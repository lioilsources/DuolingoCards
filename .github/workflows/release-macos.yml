name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build macOS (release)
        working-directory: .
        run: flutter build macos --release

      - name: Package as ZIP
        run: |
          cd "./build/macos/Build/Products/Release"
          # Bundle name comes from PRODUCT_NAME (Lexify), not the pubspec name —
          # hardcoding duolingo_cards.app made zip exit 12 with "Nothing to do!"
          # and v2.2.4 shipped without a macOS asset. Take whatever was built.
          app="$(ls -d *.app 2>/dev/null | head -1)"
          if [ -z "$app" ]; then
            echo "::error::no .app bundle in $(pwd)"; ls -la; exit 1
          fi
          echo "Packaging $app"
          zip -r "$OLDPWD/DuolingoCards-${{ github.ref_name }}-macOS.zip" "$app"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: DuolingoCards-${{ github.ref_name }}-macOS.zip
          name: DuolingoCards ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
