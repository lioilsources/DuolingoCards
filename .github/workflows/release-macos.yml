name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build macOS (release)
        working-directory: .
        run: flutter build macos --release

      - name: Package as ZIP
        run: |
          cd "./build/macos/Build/Products/Release"
          # The bundle is named after PRODUCT_NAME; hardcoding it here meant the
          # Lexify rename broke packaging with a zip "name not matched" and
          # nothing else to point at the cause.
          shopt -s nullglob
          apps=(*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "expected exactly one .app, found: ${apps[*]:-none}" >&2
            exit 1
          fi
          echo "packaging ${apps[0]}"
          zip -r "$OLDPWD/Lexify-${{ github.ref_name }}-macOS.zip" "${apps[0]}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: Lexify-${{ github.ref_name }}-macOS.zip
          name: Lexify ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
