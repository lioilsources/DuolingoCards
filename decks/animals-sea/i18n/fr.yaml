lang: fr
pivot: false
title: Animaux marins
cards:
  animal.crab:
    label: crabe
    summary: Crustacé décapode avec carapace et pinces, qui se déplace latéralement.
    info: Le crabe est un crustacé de l'infra-ordre des Brachyoures. Il possède une carapace rigide en chitine qu'il mue régulièrement pour pouvoir grandir. Son mouvement caractéristique est latéral. Ses pinces servent à la défense, à la chasse ainsi qu'à la communication. Les crabes vivent aussi bien dans les océans que dans l'eau douce ou sur terre.
  animal.dolphin:
    label: dauphin
    summary: Mammifère marin intelligent vivant en groupes et sautillant hors de l'eau.
    info: Le dauphin est un mammifère marin appartenant à la famille des cétacés. Il est connu pour son intelligence élevée, sa capacité d'écholocalisation et son comportement joueur – les dauphins aiment bondir par-dessus les vagues des bateaux et communiquer grâce à des sifflements et cliquetis. Ils vivent en groupes appelés bancs et sont proches parents des baleines.
  animal.jellyfish:
    label: méduse
    summary: Animal marin transparent en forme de cloche avec des bras venimeux.
    info: Une méduse est un animal marin du phylum Cnidaria sans cerveau, cœur ni os – son corps est composé à 95 % d'eau. Elle se déplace grâce aux pulsations de son corps en forme de cloche. Ses bras contiennent des cellules urticantes (nématocystes) qui paralysent sa proie. Certaines espèces sont presque immortelles – elles peuvent revenir à leur stade juvénile.
  animal.octopus:
    label: poulpe
    summary: Mollusque à huit bras capable de changer de couleur et de forme corporelle.
    info: 'Le poulpe est un animal invertébré appartenant à la classe des céphalopodes. Il possède trois cœurs, du sang bleu et peut instantanément modifier sa couleur ainsi que la texture de sa peau grâce aux chromatophores. C''est un animal très intelligent : il arrive à ouvrir des récipients fermés et résoudre des labyrinthes.'
  animal.sea_turtle:
    label: tortue verte
    summary: Un grand reptile marin qui retourne sur les plages pour pondre.
    info: La tortue verte est l'un des sept types de tortues marines. Les femelles reviennent toutes les deux à cinq ans sur la plage où elles sont nées pour y déposer leurs œufs. Les individus adultes sont herbivores et se nourrissent principalement d'herbes marines et d'algues ; en revanche, les petits sont omnivores.
  animal.seahorse:
    label: poisson-gourami
    summary: Petite poisson nageant en position verticale ; le mâle porte les petits.
    info: Le poisson-gourami est un poisson du genre Hippocampus qui se déplace dans une position verticale à l'aide de sa nageoire dorsale. Une particularité est que ce sont les males et non les femelles qui portent les petits dans une poche. Il utilise sa queue pour s'accrocher aux algues marines tout en attendant la proie.
  animal.shark:
    label: requin
    summary: Grande poisson prédateur avec des dents acérées et un corps hydrodynamique.
    info: Le requin blanc est le plus grand poisson prédateur du monde et peut atteindre une longueur de plus de six mètres. Il possède la capacité de détecter les champs électriques de ses proies grâce aux ampoules de Lorenzini. Malgré sa réputation, les attaques contre l'homme sont très rares ; les requins jouent un rôle clé en tant que prédateurs dans l'écosystème océanique.
  animal.whale:
    label: baleine bleue
    summary: Le plus grand animal sur Terre – un cétacé respirant l'air.
    info: La baleine bleue est le plus gros animal jamais connu sur Terre ; elle peut mesurer jusqu'à 30 mètres de long et peser plus de 150 tonnes. Elle se nourrit exclusivement de copépodes appelés krill qu'elle filtre à travers ses fanons.
