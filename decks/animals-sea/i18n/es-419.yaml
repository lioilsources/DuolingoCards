lang: es-419
pivot: false
title: Animales marinos
cards:
  animal.crab:
    label: cangrejo
    summary: Crustáceo decápodo con caparazón y pinzas que se mueve de lado.
    info: El cangrejo es un artrópodo del suborden Brachyura. Tiene una dura cubierta de quitina que desprende periódicamente (ecdipsis) para poder crecer. Se desplaza característicamente hacia los lados. Sus pinzas sirven tanto para defensa como para cazar e incluso comunicarse. Vive en océanos, aguas dulces o tierra firme.
  animal.dolphin:
    label: delfín
    summary: Animal marino inteligente que vive en grupos y salta del agua.
    info: El delfín es un mamífero marino de la familia de los delfines. Es conocido por su alta inteligencia, capacidad para el ecolocalización y comportamiento juguetón; los delfines disfrutan saltando sobre las olas de los barcos y comunicándose mediante silbidos y clics. Viven en grupos llamados cardúmenes y son parientes cercanos de las ballenas.
  animal.jellyfish:
    label: medusa
    summary: Animal marino transparente en forma de campana con tentáculos venenosos.
    info: Una medusa es un animal marino del filo Cnidaria sin cerebro, corazón ni huesos; su cuerpo está compuesto por un 95% de agua. Se mueve mediante pulsaciones de su cuerpo en forma de campana. Sus tentáculos contienen células urticantes (nematocistos) que paralizan sus presas. Algunas especies son casi inmortales y pueden regresar a una etapa juvenil.
  animal.octopus:
    label: pulpo
    summary: Molusco con ocho tentáculos capaz de cambiar color y forma del cuerpo.
    info: El pulpo es un animal invertebrado perteneciente a la clase de los cefalópodos. Tiene tres corazones, sangre azulada y puede cambiar instantáneamente el color y la textura de su piel mediante células llamadas cromatóforos. Es muy inteligente; puede abrir recipientes cerrados y resolver laberintos.
  animal.sea_turtle:
    label: tortuga marina
    summary: Un gran reptil marino que regresa a la playa para poner huevos.
    info: La tortuga verde es uno de los siete tipos de tortugas marinas. Las hembras vuelven cada dos a cinco años a la misma playa donde nacieron para depositar sus huevos. Los adultos son herbívoros y comen algas y hierbas marinas; en cambio, las crías son omnívoras.
  animal.seahorse:
    label: caballito de mar
    summary: Pequeña pez que nada en posición vertical; el macho lleva los crías.
    info: El caballito de mar es un pez del género Hippocampus que se mueve en posición vertical usando su aleta dorsal. Una curiosidad es que son los machos quienes llevan las crías en una bolsa, no las hembras. Se aferra con la cola a hierbas marinas y espera a que sus presas pasen.
  animal.shark:
    label: Tiburón
    summary: Gran pez depredador con dientes afilados y cuerpo hidrodinámico.
    info: El tiburón blanco es el mayor depredador acuático del mundo y puede alcanzar una longitud de más de seis metros. Posee la capacidad de percibir campos eléctricos de sus presas mediante las ampolletas de Lorenzini. A pesar de su reputación, los ataques a humanos son muy raros; los tiburones desempeñan un papel clave como depredadores en el ecosistema marino.
  animal.whale:
    label: ballena azul
    summary: El mayor animal del mundo es un mamífero marino que respira aire.
    info: La ballena azul es el animal más grande jamás conocido en la Tierra; puede alcanzar una longitud de hasta 30 metros y pesar más de 150 toneladas. Se alimenta exclusivamente de pequeños crustáceos llamados copépodos o krill, los cuales filtra mediante placas óseas. Emite los sonidos más fuertes de todos los animales.
