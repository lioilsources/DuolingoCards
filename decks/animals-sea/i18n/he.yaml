title: สัตว์ในทะเล
cards:
  animal.anglerfish:
    label: دיבול ים
    summary: דג עמק עם נחיר אור ביואורגני
    info: דיבול ים חי בחומת האוקיינוס העמוקה יותר מ־1000 מטרים. הנקבה מחזיקה באשלייה ביואורגנית על פניה כדי למשוך טרף וזכרים. הזכרי קטן מאוד ומתחבר אל הנקבית לאחר מציאתה.
  animal.barnacle:
    label: רָקוֹן סוּג הַשׁוֵט
    summary: חֶבְרוֺנִי מֻתֲדוֹף ניצבות בצלעות ולודיות.
    info: |-
      śwיתלונושים הם חרקוני ים מהסאב קלאס סיריפדיה שצמודים לסלע ולחגורות אבקה על ידי פוליאקציה צמיגה;
      z עיקרי גוף המרחפים מחוץ לעלי הקפה שלהם הם מסנןプランקטון.
  animal.beluga_whale:
    label: بلוגה
    summary: "\U0001F40B פנתר ימי לבן עם ראש עגול ואופטימי."
    info: "בלוגה (델פינאפטירוס ליאקוס) היא חיה ים קטן לבן באוקייני ארקטיים וסאבארקטיים. המצח הבולבובית שלה משמשת לאקולוקציה והיא היחידה מסוגו שיכולה להזיז את צווארו לימין ולשמאל. בלוغا מתקשרת באמצעות מגוון רחב של קולי תקשורת והמכונה על ידי נוטשי האוקיון \"\U0001F426歌唱的海鳽\"."
  animal.blue_tang:
    label: канיכ модרый
    summary: דג כחולים זוהרים של מקומות הקורים; גיבור בסרט 'Hunting for Nemo'.
    info: קניך כחול הוא דג ים קטן עם צבע הכחלוף וסמל חום מאי אינדו פאציפיק הנותנים ב скаלה קוראלית. הסרט 'הunting for Nemo' העניק לו עניין רב יותר בחובבי הדגים למרות שהוא קשה להחזקת. יש לו סכינים острые על שרשראות הזנב שלו מהן נוצר השמות surgeonfish.
  animal.carp_river:
    label: ปลาคาร์พแม่น้ำ
    summary: ปลาน้ำจืดขนาดใหญ่สีทองน้ำตาลที่อาศัยอยู่ในลำธารและบ่อเลี้ยง
    info: |-
      קפר אובענקי הוא אורגנית מאסיה ותורם להיבוא לאירופה כבר בתקופת הביניים
      הוא טרף הכללי שמחפץ את הקרקעית ומכליל מياه
      היא סמל חגיגי של צ'כוסלבוקה; תجار השווקיםמכילים אותו חיים מקדימים
      זה אחד מהדגות הכי נצפות בעולם ויש יותר ממאה גזעי
  animal.catfish:
    label: سומاك
    summary: рыбы большая с бородками и живет на дне рек.
    info: |-
      סומאק גדול הוא ה рыба пресноводная הכי גדולה באירופה; מגיע לאורך של יותר מ - 2 מטרים ומשקל מעל ל - 100 קילוגרם.
      The characteristic whiskers serve as sensory organs for smell and touch.
      It lives on river beds and lake bottoms at night;
      in the Czech Republic it is considered an important game fish.
  animal.clam:
    label: חָלֶף גְדו́ר
    summary: החולפת הגדולה ביותר בעולם שחייה במעיינות קוראלים טרופיים.
    info: '{"hint":"軟體動物 עםเปลือกสองชิ้นที่เชื่อมด้วยข้อต่อ","info":"หอยแมลงภู่ยักษ์ (Tridacna gigาส) เป็นหอยขนาดใหญ่ที่สุดในโลก มีความยาวเกินหนึ่งเมตรและมีน้ำหนักมากกว่า 200 กิโลกรัม\nอาศัยร่วมกับสาหร่ายฟอโตซังเคราะห์ (Zooxanthella) ในเนื้อบางของเปลือก\nสามารถอายุได้นานกว่า 100 ปี\nตำนานว่าจับผู้ดำน้ำเป็นเพียงเรื่องเล่าเท่านั้น เพราะการปิดปากเปลือกก็ทำได้ช้าพอๆ การเคลื่อนไหว","label":"หอยแมลงภู่ยักษ์","summary":"หอยชนิดใหญ่ที่สุดบนโลก เจริญเติบโตในแนวปะการามเขตร้อน"}'
  animal.clown_triggerfish:
    label: сфוש туиз
    summary: דג תרופתי בולט בצבעיו לבן ואדום.
    info: הספואש טוויסט הוא דג ים גדול מהמשפחה הบาลיסטידה עם צבעים מבריקים במיוחד מבין הדגים האוקיינוסיים. יש לו שיני חזקות שמטרתן לשבור קוצים וצמחייה קשה. השם 'سفועשטויז' נובע מקצה הגב הראשון שלו, שהוא סוג של מנעול המונח על השני.
  animal.clownfish:
    label: Clownfish
    summary: An orange fish that lives in mutualism with poisonous sea anemone.
    info: |-
      הקלון העייני חי בסאסנות ימיות שהחוטפים שלהן是有毒的，其他魚類會因此死亡；但小丑鱼因有保護性的黏液而免疫。
      它們之間是共生關係：小丑清理海葵並驅趕捕食者，同時獲得庇護。
      所有的小丑最初都是雄性出生，在群體中佔優勢地位的個体会變成雌性。
      The movie Finding Nemo made them global celebrities.
  animal.crab:
    label: 蟹
    summary: 十足類的甲殼動物，有硬殻和螯足，側向移動。
    info: קרב הוא חרק ים מהספקלר ברוכיורה. יש לו קירח כהовый של ציטין שמשלים אותו באופן קבוע כדי לגדול. תנועתו מאופסת בזיגוג הצדדי שלו.
  animal.dolphin:
    label: ドル핀
    summary: חכם ימי חיות קבוצתי והופך את עצמו על פני המים.
    info: דולפין הוא יונק הים מהמשפחה הדלphinיים. הם מוכרים בذכינותם הגבוהה בשימוש באקווסטיות ובעובדה שהם מתנהגים בחצייה - דלייפינים אוהבים לกระongan מעבר לאمواג'י סירות ולתקשר באמצעות צעקות וגימיקים.
  animal.dugong:
    label: digung
    summary: חיית ים רכה מהאוכיינוס ההדי והשיקט קרובה למנאטאה.
    info: דיגונג הוא ים תחתוני קרוב לקפסניאק החיים באוקיינוס ההודי ובאוקיינוס השקט. הם ניזונים אך ורק מ풀ים ימיים. נחשב כמקור הแรงה ליצורים כמו אמצעות ימית - חלוצנים זיהו אותו בטעות כשדים.
  animal.eel:
    label: אングוילה / מורנה
    summary: דג בצורת עקרב נע בתוך הסדק בסלעי קורלים.
    info: מוּרֵנָה היא דג ימי גדול מהמשפחה Muranidae המסתתר בפערים של סלע קוראלים. יש לה זוג שיניים - פרוסות פיו והן הפנים (פרינגיאליות), המשמשת לשליפת טרפתי אל תוך הגרון. מוירני לא מתקדמים באופן פעיל; נקישה תיתכן רק כ رد فعل להתערבות חיצונית.
  animal.flying_fish:
    label: летון
    summary: טיפוח ים טרופי שמצליף מעל פני השמיים בעזרת סנפריים.
    info: '"летון" הוא דג טרופי המסוגל לקפוץ מהמים ולגלוש באוויר באמצעות סנפיריות קדקודיות מתרוצצות שמשמשות כкрылья; הדגים יכולים לנוע עד מרחק של 200 מטרים ולהגיע לגובה של метר וחצי כדי להתחמק מקודרים כמו תונה, מלינ וдельфиינים. בברמודס מכנים את האiland ''ארץ הדגים המעופפים''; לטונים יש תפקיד חשוב גם בהמטיקה המקומית והתרבות.'
  animal.frogfish:
    label: אנטרניוס
    summary: ציד בצלחת בעמקי אקורדונים
    info: |-
      אנטנאריו הוא דג ים קטן מהמשפחה האנטיינריאידה עם משלטת קמouflage מקצועית מאוד
       יש לו כפפות שחייה בצורת גפיים באמצעותן הלוך על הרציף.
      on ראשוני הגב שלו יש נחיר תנועתי (Illicitum) למשיכת טרף
      dapat לאכול חיות בגודל כמעט זהה אליו עצמו; ההשעפת заниמת 0.006 שניימס.
  animal.giant_squid:
    label: ג׳יגנטוס
    summary: 這是世界上最大的無脊椎生物，在深海生活。
    info: |-
      ג'יגאנטס דקסייס הוא חיות הלא מס梳齿动物最大的无脊椎動物，體長可超過十三米。
      牠們有著動物界中最大眼睛（直徑達二十五公分），適應深海的黑暗環境。
      牠們生活在三百至一千米深度處，是抹香鯨的主要食物來源之一。
      直到二〇〇四年才首次拍攝到活生生的巨大章魚在海底活動的照片。
  animal.hammerhead_shark:
    label: שחף מטומן
    summary: זאב שוכם צפוף עם ראש ריבועי ייחודי בצורת 'T'.
    info: שחף מטומן הוא זבוב עם ראש מרחב אקראי במיוחד המורכב משני חצאיים עגולות בצורת טווחה. הראש הרחב מאפשר גילוי טוב יותר של פrey באמצעות אורגנונים חשמליים ותמרון ניידות טובה יותר.
  animal.horseshoe_crab:
    label: כרספיין
    summary: عضو מפלגה עתיק שהתקשה לארבע hundred ומחוזות fifty مليون שנה.
    info: הכרספיאן הוא חרק ימי ישן בת כ - ארבע מאות וחמישים מיליון שנים ששרד ללא שינויים משמעותיים מאז הארכיון. זהו לא קרנף אמיתי אלא קרוב יותר לקיפודרים. הדם הכחול שלו מכיל תערובת ייחודית של גורם đôngנה משמש לבדיקת בטיחות בתרופות ובוונקצינות.
  animal.jellyfish:
    label: omedusa
    summary: חיה שקוף בצורת צון עם זרועות חדבי דקירה.
    info: omedusa היא חיה ימי ללא מוח, לב או עצמות - גופה מורכב כמעט כולה ממים. הוא נע באמצעות פעימות של הגוף הצונני שלו. החוטי מכילים תאים רעדיים (נמטוציסט) שמעוררים פרכוס בเหיתם.
  animal.lionfish:
    label: קורת
    summary: דג טרופי חד פעמי עם חרשים ובצורות צבעוניות.
    info: קרוטופאס אדום הוא דג ים רעיל מהמשפחה סקורפיאנידיאה עם פסים 부רים וירוקים והרעל על גביו של הרגליו. הרעל שלו מسبب כאבים עזים אך בדרך כלל לא מסוכן לחיי אדם.
  animal.lobster:
    label: homraus
    summary: חיה ים עם זנבות גדולים; מבשלים אותם בשחור אך חייהם בציאן.
    info: הומראוס אטלנטי הוא חרק ימי גדול משושלת הנפרופידאיים הגובר על מטר באורכו. לפני בישול他是 כחול ירוק בהיר מאוד但是在 הבישום רק אז התרחש צבע האדום בגלל קיטון. הם יכולים לחיות יותר ממאה שנים.
  animal.manatee:
    label: دיגونغ / منאטיניי
    summary: حيوان بحري بطئ يُعرف باسم البقرة البحرية.
    info: |-
      דיגונג הוא ים גדול וסנאי שמתפרנס רק מ풀ים ימיים
      הוא חי בזקיפים טרופיים poco profundos y en rías de los Caribe, Florida i África
      Está gravemente amenazado por colisiones con embarcaciones motoraux; muchos tienen cicatrices en la piel causadas por hélices
  animal.manta_ray:
    label: מנתא
    summary: 생물이 바다 표면 근처에서 플랑크톤을 여과하는 거대하고 우아한 날개 물고기.
    info: מאנטה אוקיינית היא המין הגדול ביותר של מנטות עם רוחב כנפיים מעל שבעה метרים ומשקל מעבר ל - 2000 קילוגרמים. מסנן פלנקטון באמצעות דקעי הפה במהלך השחייה בפיהם פתוחים. אין לה ספסלי זן是有毒的; זה לחלוטין חסרอันตราย לאדם.
  animal.mussel:
    label: 슬라프카
    summary: 간조와 만조 사이 바위 위를 어두운 조개 형태로 모읍니다。
    info: |-
      슬라브카 제다는 대서양과 태평양의 간조 지역에서 사는 조개입니다。
      바위에 단단한 실(비스스)로 붙잡고 있습니다。
      물을 여름하고 오염 지표가 되며 독성 물질 및 중금속을 축적합니다。
      맛있게 먹히므로 벨기에 뮈лез 프리테(Moules-Frites)는 세계적으로 유명한 요리입니다。
  animal.narwhal:
    label: narzal
    summary: .velrya arktykys me tzur'a shel spira shezot et hadas hamushak
    info: |-
      נארוואל הוא ח獸 קטן בים הארקטי (길ות עד חמישה מטר), עם תכונה ייחודית של שן ספירלית שנוצרת מהשינ השמאלית המוגזמת יותר.
      The tooth can grow up to three meters in length ובסדרה נשים אין לו כלל.
      הוא חי קבוצתי באוקיינוס הارتיק.
      bימי הביניימין נהגו להאמין שהספירה של הנורווול היא קרני独角兽 עם כוחות ריפוי פלאיים.
  animal.nautilus:
    label: נAUTILUS
    summary: חסית קדום בסלע מסחרף שהוריש מהתקופת הדינוזאורים.
    info: נאוטילוס הוא חסית ראשוני עם売贝壳 ספירלי שחי כמעט ללא שינוי למשך יותר מארבע מאות מיליון שנה. השפה מחולקת לחדרים בהם הנAUTILUS управляет תחושת הלחץ על ידי גז בחללים. בניגוד לשאר החסיות יש לו עיני פשוטה בלי עדשה.
  animal.octopus:
    label: צ'בו
    summary: มีปล้องแปดขาที่สามารถเปลี่ยนสีและรูปร่างได้
    info: '{"hint":"חָמֵר חסידת תשעה איברים","info":"צ''בון הוא בעל חיים ללא חוליות מטיל מאלפונוקטים עם שמונה זרועות ורגליים. יש לו שלושה לבבות, דם כחול ואינו מסוגל להשתנות צבע או טקסטורה кожи באופן מיידי באמצעות כלורופורים. זהו אורגניזם thông minh מאוד - יכול לפתוח קופסאות סגורות ולפתור לabyrinths.","label":"צ''בו ניקי","summary":"בעל חיים without-back עם שמונה ידיים שיכול לשנות צבע ומבנה."}'
  animal.orca:
    label: كوفكا
    summary: .predator צבעוני שחור לבן מהאוקינוסים, גדול מדלphin
    info: קופ'ס הוא המין הגדול ביותר במשפחת הדולפינים והחיות הумנות בעולם. הם יורים כצוותים מкоординציה בין בני המשפחה - כל משפחה משתמשת בטכניקות ל냥 שונות ויחדניות. קופ'סים תקשורת באמצעות דיאלקטים של אותיות קוליים שמתחלקים לפי משפחות השונות. בהחזקתם באכיפיה כמו Sea World יש להם בעייתי בריאותיים; קרבות עבור זכות בעלי חיים הביאו להגבלות על חיבוקם.
  animal.oyster:
    label: אסתרייה
    summary: חסilst שממיין את המים; מקור לפפרה ואוכל טרי אהוב
    info: |-
      אוסטריות הן חסילאים שמסננים מים; אסטריה אחת מסフィרת עד ליטר ו - 200 של ים ביום
      כמה מהשpecies מייצרות פפרות כאשר עצמים זרים מעורמות בשריפן שלהן
  animal.piranha:
    label: פיראנאה
    summary: דג טרייניקאי צariant של חומרים סמויי
    info: פירהנה אדומה היא דרור ים מתוק מאמזוניה עם שיניים חדות בצורת משולש. השמועה על היותו פראדט רעוע הוא מגזין – הפיראנים תקופפים בני אדם ברורים נקיים בדלילות רבה מאוד. הם לוכדים בחבורת ובעזרת חוש הריח החוזק שלהם יכולים לזהות 피 מרחק רב.
