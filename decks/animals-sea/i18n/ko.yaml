lang: ko
pivot: false
title: 해양 동물
cards:
  animal.anglerfish:
    label: 모로이쉬 아이들
    summary: 머릿 위에 생명발광 납치기를 가진 해저어.
    info: 바다 악마(Moorish Idol 또는 Lophius)는 깊은 어둠 속에서 수심이 천 미터 이상인 바닷속에 사라요.암컷의 머리에는 생체 발광 빛을 내며 식사와 남성을 유혹하는 낚시 줄(illicium)이 있어요.수컷은 매우 작으며, 자신의 짝과 만나면 붙어서 생물학적으로 융합해요.생명발광 현상은 낚싯줄 안에 있는 균류가 공존하며 만들어내죠.
  animal.barnacle:
    label: 벼락
    summary: 바위와 선박의 외판 위를 고정하여 사는 작은 갑각류.
    info: 해양 생물학에서 표면에 형성된 군집을 연구하는 데 핵심적인 유기체이다.
  animal.beluga_whale:
    label: belluga
    summary: 둥근 머리를 지닌 백색 아틱 지역의 작은 고래
    info: 벨уг아(학명 Delphinapterus leucas)는 아르ctic 및 서부 북극해의 흰색 소형 고래이다. 두드러진 볼록한 이마(melon)를 이용하여 에코로케이션을 한다. 유일하게 목을 옆으로 움직이는 능력을 가졌다. 다양한 음성을 사용해서 의사소통하며 역사적으로 해사들은 그녀에게 '바다 칸차리'라는 이름을 붙였다.
  animal.blue_tang:
    label: 블루 트라이어
    summary: '''니모''라는 캐릭처와 함께 등장한 명암석 위의 환경 속에서 살아가는 아름답게 반짝이는 파랑빛 어류.'
    info: 파라칸투루스 헵터스(Paecanthurus hepatus)는 인도양과 태평양의 산호 암초에서 발견되는 작은 바다 물고기로 밝은 파란색을 띠며 꼬리는 노랗습니다. 영화 '디오를 찾아서(2016)' 이후 수족관 보유에 대한 관심이 증가했지만 사육하기에는 까다롭다고 합니다. 이 생물체는 꼬리 극단부에 나이프처럼 가늘게 된 첨두뼈인 스칼펠(scalpel)을 가지고 있으며, 이것이 이름 surgeonsfish 의 유래입니다.
  animal.carp_river:
    label: 강 어귀
    summary: 큰 황갈색 닷수생물로 강과 연못에서 산다.
    info: 강어귀는 아시아 원산이며 중세 시대에 유럽으로 도입되었다. 모든 것을 먹으며 바닥을 파서 물이 탁해지게 할 수 있다. 체코 크리스마스의 상징이다. 생선 장사꾼들은 그물을 사용하여 살아있는 강어귀를 판다.
  animal.catfish:
    label: sumec
    summary: 강의 바닥 근처를 숨어 지내며 생활하는 수염이 있는 대형 담수 어종
    info: 서메크 벨키는 유럽에서 가장 큰 담수 어류로 길이가 약 2미터 이상이고 무게도 백킬로그램을 넘습니다. 특징적인 수염(바벨리스)은 후각과 촉감 기관으로 사용됩니다. 강이나 호소 바닥에 서식하며 이들은 주야전환성 포식자입니다. 청카에서는 스포츠 낚시용 고급 물고기로 여겨집니다.
  animal.clam:
    label: 거북조개
    summary: 열대 지역 산호초 지방에서 사는 세상 최대 크기의 조개.
    info: 거북조개(Tridacna gigas)는 길이가 한 미터 이상이고 무게도 200kg을 넘어서 세계에서 가장 큰 조개이다. 이들은 완충막 속에 광합성하는 갈색미세알gae(zooxanthella)와 공생한다. 수명은 백 년 이상일 수도 있다. 잠수사들을 빨아들인다는 전설은 사실과 다르며, 실제로 거북조개의 닫힘 속도는 매우 느리다.
  animal.clown_triggerfish:
    label: clown triggerfish
    summary: 흰색 점과 오렌지빛 입술의 눈에 잘 뜨이는 열대어.
    info: 클라운 트리거피시는 바다 생선 중에서도 가장 화려한 색상을 지닌 열대 어류로, 강력한 이빨을 사용해 단단한 산호와 조개를 부순다. 첫 번째 주요 뿌리를 고정하는 기능이 있어 '트리거'라고 불린다. 짝짓기 시즌에는 잠수사에게 공격적으로 반응할 수 있다.
  animal.clownfish:
    label: 눈가 있는 클라운
    summary: 노란색 어류로, 유독성 바다사자와 공존합니다.
    info: 눈가 있는 클라운은 해葵의 독한 촉수를 피해 다른 물고기가 살해되는 것을 막아줍니다. 이는 보호막 덕분에 면역이 되기 때문입니다. 상생 관계에서 그들은 해葵을 청소하고 포식자를 몰래 떨어뜨리며, 반면 해葵로부터 자신들을 보호받습니다. 모든 눈가 있는 클라운은 수컷으로 태어나지만 우세한 개체는 암컷이 될 수도 있습니다.
  animal.crab:
    label: 게
    summary: 갑각류인 게는 패와 발톱이 있으며 옆으로 움직입니다.
    info: 게는 인프라목 브라키우라에 속하는 갑각류입니다. 주기적으로 완충을 벗어내며 성장합니다. 특징적인 방향은 옆쪽이며, 발톱은 방어, 사냥 및 의사소통에도 사용됩니다. 바다뿐만 아니라 담수나 육지에서도 서식할 수 있습니다.
  animal.dolphin:
    label: 돌고래
    summary: 집단으로 사는 지능이 높은 바다 포유동물로 물에서 점프하는 동작을 보인다.
    info: 돌고래는 돌고래과에 속한 해양 포유류입니다. 고도의 지능, 에코로케이션 능력, 그리고 장난스러운 행동으로 유명합니다—돌고래들은 배 옆 물결 위를 절구처럼 뛰어오르며, 휘파람 소리와 클릭음으로 의사소통합니다. 그들은 '군'이라는 이름의 집단 형태로 살아가며, 상어나 고등어 등 다른 큰 어종들과 가까운 친척 관계에 있습니다.
  animal.dugong:
    label: 두구ונג
    summary: 인도양 및 태평양에서 발견되는 부드러운 헤르비보어(풀먹이는) 수중 생물을 말하며, 마나티와 유사하다.
    info: 두고ング은 인도양과 태평양에 서식하는 바다 포유류로, 마나티와 관련이 있다. 이 동물들은 오직 해초만을 먹는다. 두고잉은 아마존의 영감으로 간주되며 과거 항해자들이 잘못 식별하여 '바닷 여신'이라고 불렸던 존재이다.
  animal.eel:
    label: 잉어 / 모래뱀장어
    summary: 산호암반 틈바구니를 움직이는 가시살 같은 어류.
    info: "모래뱀장어는 Muranidae과에 속하는 큰 바다ปลา로 산호 암초의 균열 사이에서 숨습니다. 입 주위와 내부 모두 이빨이 있어 먹잇감을 목으로 끌어당깁니다. 보통 공격하지 않으며 자극받았을 때 물기를 합니다. 강\U0002CD8F(Anguilla anguilla)라는 종은 사라고 해양 지역으로 마이그레이션하여 번식하고 죽게 됩니다."
  animal.flying_fish:
    label: летун
    summary: 열대 지역 해수면 위를 그물 같은 형태로 나는 특별한 종류의 어류이다.
    info: |-
      лет운(Exocoetidae)은 수영하는 동안 날개 모양의 가슴지느러미를 사용하여 공중에서 미끄러져 이동할 수 있는 열대 어류입니다。
      펼쳐진 가슴 지느러미는 낯처럼 작용하며 최장으로 물 밖에 약 200미터까지 비행하고 높이로는 무려 1.2미터까지 도달합니다。
      이는 포식자들인 금枪어나 마린과 돌고래로부터 자신을 보호하기 위한 것입니다。
      바베도스에서는 '날아다니는 생선들의 나라'라고 불리며, лет운은 국가 음식 문화와 전통에도 중요한 위치를 차지합니다。
  animal.frogfish:
    label: 개구리상어
    summary: 해양 암반 지대에서 환각적인 미끼로 사냥하는 숨바꼭질 전문가.
    info: 개구리상어(Anthennairus)는 천연색으로 완벽하게 위장된 작은 바다 어류로, 안테나리이dae과에 속한다. 가시鳍를 발처럼 움직이며 해저에서 기어 다닌다. 등지느러미의 앞쪽 끝에는 유혹용 낚싯줄(illicium)을 가지고 있어 먹잇감을 유인할 수 있다. 개체 크기와 거의 비슷한 큰 물고기도 삼킬 수 있으며, 이 과정은 단 0.006초 만에 이루어진다.
  animal.giant_squid:
    label: 큰 오징어
    summary: 깊숙한 대양속 생존자로서 전세계적으로 알려진 가장 크고 흔하지 않은 철갑상태의 물체.
    info: 거대한 탐지(architeuthisdux)는 길이가 최소 13미터에 달하는 세계에서 가장 큰 무척추동물입니다. 동물계의 눈 중에서도 지름이 약 25cm 이상 되며 깊은 어둠 속 환경을 위해 적응되어 있습니다. 이들은 수심 300~1000 미터 사이를 서식하며 주요 먹잇감으로서 왜도어류에게 잡히기도 합니다. 해저 바닥에서 살아가는 거대한 타코들을 처음 사진 촬영하게 된 것은 2004년 이후부터였습니다.
  animal.hammerhead_shark:
    label: 망치상어
    summary: T자 모양의 특징적인 두개골로 인해 구별되는 종류의 상어.
    info: 망치상어는 머리가 비정형적으로 확장된 평평한 형태를 가진 상어이다. 이 넓게 퍼진 머리는 전기 기관인 로렌티니 암플을 통해 사냥감 탐지와 더 나은 조종이 가능하게 한다. 열대 해양에서 서식하며 물고기, 게 및 문어 등을 포식한다.
  animal.horseshoe_crab:
    label: 가죽포기
    summary: 주된 변형없이 수백 만 년 간 생존해 온 오래 된 척추동물.
    info: 가죽포기( Limulus polyphemus )는 약 4억 5천만 년 전에 존재했던 절지동물로, 주요 변화 없이 고대부터 살아남아 있다. 이 동물은 진정한 게와 관련성이 없으며 거미류와 더 가까운 관계이다. 파란색의 혈액 속에는 의약품과 백신 안전성 검사를 위해 사용되는 독특한 물질인 응고원(coagulogen)을 포함하고 있으며 매년 봄마다 번식을 목적으로 해변으로 몰려온다. 또한 이들은 마иг레이션 중인 조류들에게 중요한 먹잇감 역할도 한다.
  animal.jellyfish:
    label: 메두за
    summary: 투명한 해양 동물로 종 모양의 몸과 독이 든 촉수를 가진다.
    info: 메두자는 뇌와 심장, 뼈가 없는 척추동물이며, 신체의 약 95%는 물로 이루어져 있다. 펄사션으로 움직이고, 촉수에는 마비 효과가 있는 유해세포(네타시스트)를 포함한다. 일부 종은 거의 불멸하며, 성숙 단계에서 다시 어린 시기 단계로 돌아갈 수 있다.
  animal.lionfish:
    label: ' 붉은 가시사자치'
    summary: 줄 무늬와 강렬한 척추를 가지며 독성이 있는 열대어.
    info: 붉은 가시사자치는 독한 해양 어류로, 흰색과 빨간 줄무늬가 특징이며 유독성의 척추를 가지고 있다. 그들의 독소는 극심한 통증을 일으키지만 생명에 위협이 되는 경우는 드물다. 카리브해와 지중해에서 외래종으로 갈수록 확산되며 현지 물고기 종들을 감축시키고 있으며 본토 이외 지역에서는 자연적인 포식자가 없다.
  animal.lobster:
    label: 홍게
    summary: 클랩터를 가진 대형 바닷 동물로서 삶으면 붚지만 살아 있을 때는 짙고 청록색입니다.
    info: 대서양 홍게는 네프로피다과에 속하는 큰 해양 갑각류이며 길이가 최소한 60cm까지 자랍니다. 생선 상태에서는 어두운 파랑색 녹색을 띠며 조리 후 비타민 C의 작용으로 붉은 색깔로 변합니다.
  animal.manatee:
    label: 두곤/카푸스티尼亚크
    summary: 바다소라고 불리는 천천히 움직이는 온순한 해양 초식 동물
    info: 카푸스티냐크(만테이트)는 바다풀을 전적으로 먹고 사는 큰 해양 포유동물입니다.
  animal.manta_ray:
    label: 망아리
    summary: 플랑크통 필터링하는 표면 근처에서 활동하는 대형 우아한 광물.
    info: 바다망아리는 날개 폭이 최대 약 7미터이고 무게는 2톤 이상으로 가장 큰 종의 망아리입니다. 입을 열고 수영하면서 미끼판과 비슷한 기관인 연골막을 이용해 플랑크턴만 걸러 먹습니다. 독가시를 가지지 않으며 인간에게 전혀 해롭지 않습니다. 이 물고기는 매우 지능적이며 거울 속 자신의 모습도 인식할 가능성이 있습니다.
  animal.mussel:
    label: 슬라바
    summary: 간조 및 만조 구역 바위 위를 어두운 양지 모이 형태로 형성하는 두족류.
    info: 슬라브카 제다는 대서양과 태평양의 간조 지역에서 사는 조개입니다. 돌에 단단한 실(비스스)로 붙잡고 있습니다. 물을 여과장하며 해양 오염 지표가 되며 독소와 중금속을 축적합니다. 이 음식으로 귀하게 여기이며 벨기에 뮈лез 프리테(Moules-Frites)는 세계적으로 유명한 특별 요리입니다.
  animal.narwhal:
    label: 날발
    summary: 북극에 서식하는 희귀한 고래로서 광기 어린 단뿔을 닮았으며 마법 같은 성질을 가지고 있다고 여겨졌다.
    info: 날вал은 북극해에서 무리 지어 사는 작은 아르קט릭 고래(길이 최대 약 5미터)로 특징적인 나선형 송곳니를 가진다. 이 손톱 모양의 날카로운 치아는 실제로 과장된 외측 상악 전치이다. 남성 개체에서는 길이는 세 미터 이상 될 수 있지만 여성에게서는 나타나지 않는다.
  animal.nautilus:
    label: 나우틸루스
    summary: 공룡 시대 이후 살아남아 있는 코일 모양의 껌질 손가락 같은 고대 머리 발 동물
    info: 날缇투스는 나선형으로 감긴 껍데기를 가진 원시적인 머리발동물로 약 4억 년 전부터 거의 변함없이 생존해 왔다. 그 꼴은 여러 방으로 구분되어 있으며 날缇투스는 기체를 주입하여 부력을 조절한다. 다른 머리발류와 달리 높이 없는 단순한 눈을 가지고 있다(핀홀 카메라). 국제 협약에 의해 과잉 포획에서 보호받고 있다.
  animal.octopus:
    label: 오징어
    summary: 팔이 여덟 개인 머리발류 무척추 동물로, 색상과 형태를 바꿀 수 있다.
    info: 오징어는 머리발류에 속한 무척추 동물이다. 세 개의 심장과 파란 피를 가지고 있으며, 크로마토포르를 이용해 몸의 색깔과 질감을 즉시 변화시킬 수 있다. 매우 지능이 높아 닫힌 용기를 열거나 미로 문제를 해결할 수도 있다.
  animal.orca:
    label: killer whale
    summary: 바다 최상위 포식자인 검정색 및 흰색 색상을 가진 대형 돌고래.
    info: ' Killer Whale는 고래목 돌고래과의 가장 큰 종으로서 세계에서 가장 지능이 높은 동물 중 하나입니다. 협동적으로 사냥하는 무리(족보)를 형성하며 각각 독특한 포식 기술을 가지고 있습니다. 다양한 족보 간에 구별되는 음향 신호 방언들을 사용하여 소통합니다. 수용 환경(Seworld 등)에서는 건강 문제로 고통받으며, 동물 권리 운동 덕분에 이러한 관행에는 제약이 생겼습니다.'
  animal.oyster:
    label: '"굴"'
    summary: '"물을 여과장하고 진주의 원천이며 인기 있는 특별한 음식이다."'
    info: '{"hint":"산호와 바위 위에서 자라는 양서류(오스트레아 또는 크라소스테라이)","info":"굴은 물을 여과하는 조개입니다. 하나의 굴이 하루에 최대 200리터까지 필러합니다. 일부 종들은 외부물체가 껍질 안쪽을 건드릴 때 진주를 생산하기도 합니다. 생으로 먹는 굽은 고급 요리로 간주되며 전통적으로 ''R''자가 들어가는 달에는 소비하지 않습니다. 해양 손상 없이 지속 가능한 방식으로 재배되어 있으며, 이 과정 자체가 수중 환경 정화에도 도움을 줍니다."}'
  animal.piranha:
    label: 피라냐
    summary: 남미에 서식하고 납작한 배와 낫 모양의 이빨으로 알려져 있는 육식성 물고기
    info: 피라냐는 아마존 강의 날카로운 삼각형 치아를 가진 육식성 담수어이다. 그녀가 위험한 포경자라는 소문은 과장된 것이며 건강한 수영객에게 공격하는 경우는 드물다. 무리를 지어서 사냥하며 냄새 감지 능력이 매우 좋아 멀리서 피를 맛을 알아차릴 수 있다.
  animal.puffer_fish:
    label: 포코 피쉬
    summary: 위험 시 날카로운 병아리를 만드는 포코 피시이며 식용 및 유독하다.
    info: 푸구는 테트라도돈타이데 가족의 물고기로 위협을 받으면 몸에 공기를 불어넣거나 수분으로 부풀려 첨예한 구슬 모양으로 변할 수 있다. 이들은 극강 독성인 튼도톡신 성분을 함유하고 있으며 간 조직과 생식 기관은 치명적이다. 일본에서는 특별히 라이선스를 취득해야만 조리 가능한 고급 요리다.
  animal.salmon:
    label: 연어
    summary: 산란을 하기 위해 해변에서 강물 속으로 올라가는 큰 살모소 유사종.
    info: 연어는 바다에서 자라나지만 산란을 위해 수백 킬로미터 떨어진 본래 강으로 돌아오는 회귀성 어류이다. 연어가 상륙할 때 색이 은색에서 선명한 붉은빛으로 변한다. 대부분의 태평양 종들은 산란장에 도착하면 죽게 되는데, 그들의 시신들이 부패하면서 영양분들을 숲 생태계에 돌려준다.
  animal.sea_anemone:
    label: mořská sasanka
    summary: 바위 지형에서 서식하고 일치 덤벨과 같은 형태의 팔을 갖춘 해양 무척추동물.
    info: |-
      {"hint":"꽃 모양의 해양 동물로 가시덤불이 있는 것이 특징이다.(Actiniaria)","info":"해삼은 코니디아(刺皮動物門 Cnidaria)에 속하는 생물을 말하며, 바위 위에 고정된 꽃처럼 보인다.
      팔에는 독성 세포(nematocysts)가 있어 먹잇감을 마비시키는 데 사용된다.
      klaun이나 조류 및 청소개구리와 공생 관계를 유지한다.
      수명이 백 년 이상이며 노화로 인한 사망 없이 잠재적으로 불멸할 수 있다."}
  animal.sea_cucumber:
    label: 해삼
    summary: 바닷속에서 유기 성분들을 모으는 실린더형 해양 동물.
    info: 해삼은 해양 바닥에 사는 홀로토루리오아(Holothuroidea) 계열의 무척추동물이다. 이들은 퇴적물을 여과하고 유기성 잔사를 섭취한다. 위협을 받으면 장이나 수분이 많은 액체를 배출하지만 이후 회복된다. 아시아에서는 극상품으로 간주되며 중국 요리는 전통적으로 이를 사용하는 중요한 재료다.
  animal.sea_lion:
    label: 해獮
    summary: 날개 발에 서서 걸릴 수 있으며 소리를 크게 내는 귀가 있는 물고기.
    info: 캘리포니아 해獅은 귀가 있는 바다사자(Otariidae)의 대표적인 종입니다. 진정한 고래와 달리 외부 귓바퀴를 가지고 있고 네 개의 날개발로 걷을 수 있습니다. 이 동물들은 특별히 지능이 높으며 엔터테인먼트 산업에서는 복잡한 기술들을 배우게 됩니다. 자연 상태에서 어류, 연어 그리고 갑각류 등을 사냥합니다.
  animal.sea_otter:
    label: 바닷여울
    summary: 바닷여울은 등을 대고 둥둥 뜰 때 돌멩이나 다른 도구들을 쓴다.
    info: '{"hint":"해양에서 등으로 떠다니며 도구를 사용하는 바다 여우(Enhydra lutris)","info":"바닷여울은 북아메리카의 해양 포유류로 모든 포유동물 중 가장 짙고 두꺼운 털을 가지고 있다.(cm²당 약 80만 개)\n돌맹이 같은 공 cụ를 이용하여 가슴 위에 올려놓고 조개와 홍합 껌질기를 깨뜨린다. \n수면위에서 잔다고 하루 동안 서로 발톱끼리를 붙잡고 있으므로 강한 물살에도 밀려가지 않는다.\n모피 때문에 거의 멸종 직전까지 갈았으나 보호 프로그램 덕분에 수량이 회복되었다."'
  animal.sea_slug:
    label: Placophore/Naked-gill
    summary: 산호초 지역에서 발견되는 다채롭게 보이는 무각류 해양 조개.
    info: 플라코포라는 바다에서 사는 껍질 없는 소프트 셰이로 주로 삼림지대에 서식한다. 이들은 동물계 중 가장 눈길을 끄는 색상을 가지고 있으며 독성을 경고하는 역할을 한다. 일부 종은 먹이(해葵 등)로부터 유독 세포를 흡수하여 자신 방어용으로 사용하기도 하며 현재까지 약 3천 개 이상의 다양한 형태와 색상의 종들이 존재한다.
  animal.sea_turtle:
    label: 해양 거북
    summary: 알을 낳기 위해 해변으로 돌아오는 큰 바다 파충류입니다.
    info: 녹색 바다 거북은 일곱 종의 바다 거북 중 하나입니다. 암컷들은 자신이 태어난 해변에 두에서 다섯 년마다 돌아와 알을 낳습니다. 성체는 초식성이며 바닷풀과 조류를 먹고, 새끼들은 포식자입니다.
  animal.sea_urchin:
    label: 해바라기
    summary: ' скалист한 바닷속 바닥에서 발견되는 트리스톤 모양의 해양 동물입니다.'
    info: 해바라기는 바다 바닥에 사는 가시가 있는 구형의 해양동물로 이끼류와 곰팡이 그리고 유기물을 먹고 삽니다.
  animal.seahorse:
    label: 해마
    summary: 수직으로 수영하는 작은 어류로, 암컷이 아니라 수컷이 새끼를 품어 낳는다.
    info: 해마는 등鳍을 이용하여 수직 방향으로 움직이는 해양 어류이다. 흥미롭게도 새끼를 키우는 것은 암컷이 아닌 수컷이며, 그의 배에 있는 주머니에서 자란다. 꼬리를 사용해서 바닷풀에 붙잡고 먹잇감이 지나가기를 기다린다.
  animal.seal:
    label: 바다사자
    summary: 바위 위에서 쉬면서 어류를 주요 먹잇감으로 삼는 고래상어.
    info: 고래상어는 날카로운 돌기 없이 공력학적으로 설계된 몸을 가진 해양 포유동물입니다. 대서양과 태평양 연안에서 서식하며 물속에서도 바위 위에도 시간을 보내죠. 수심은 최대 약 500미터까지 잡아내리며 반시간 이상 숨지 않고 지낼 수도 있습니다. 오염이나 사냥으로 인해 생존에 위협받습니다.
  animal.shark:
    label: 상어
    summary: 날카로운 이빨과 수역력이 뛰어난 몸을 가진 큰 포식성 어류입니다.
    info: 백상어는 세계에서 가장 큰 포식성 물고기이며 길이는 여섯 미터 이상 됩니다. 로렌티니의 암풀이라는 감각 기관으로 먹잇감의 전자장을 느낄 수 있습니다. 사람에게 공격하는 경우는 매우 드물지만, 상어는 해양 생태계에서 핵심적인 포식자 역할을 합니다.
  animal.shrimp:
    label: 새우
    summary: 작은 바다 생선이며 전 세계적으로 널리 알려진 해양수산업 제품
    info: |-
      새우는 다리가 총 열쌍인 바닷물이나 닷물을 사는 작은 갑각류입니다.
      세계적으로 약 2천 개 이상의 종이 있으며 세계에서 두 번째로 인기 있는 해양 수산품으로 꼽힙니다.
      필터링과 포식을 하는 새우들은 대서양 음식사슬에 핵심적인 역할을 합니다.
      열대 지역 연안 공동체에서는 많은종들이 중요한 영양원이 됩니다.
  animal.squid:
    label: 오징어
    summary: 팔과 두 줄기를 사용하는 수중 튜브 이동 방식으로 헤엄치며 활보한다.
    info: 오징어는 팔다리와 두 개의 잡기 다리를 가진 머리동물이다. 물을 분사하여 움직이며 색소포를 이용해 체색 변화가 가능하다. 아치테우티스(Architeuthus)라는 거대한 오징어 종은 길이가 약 13미터에 달하며 세계에서 가장 큰 무척추 동물로 알려져 있다.
  animal.starfish:
    label: 별가리
    summary: 팔 하나라도 손상되었으면 복원할 수 있는 다섯 팔 모양 바다 생물을 말한다.
    info: 별가리는 일반적으로 다섯 개의 팔을 가진 해양 척삭동물입니다. 잃어버린 팔 전체를 회복하거나 절단된 팔로 새로운 몸을 만들 수 있습니다. 조개류와 같은 먹이에 의존하며 이를 흡입구멍으로 열어서 섭취합니다. 갯벌 지역부터 심해까지 약 1천 8백 종 이상이 존재합니다.
  animal.stingray:
    label: 레이노크
    summary: 꼬리에 척추가 있고 해저 퇴적물 위에서 쉰다는 특징이 있으며 평탄한 해양 물고기
    info: |-
      {"hint":"-flat ray with venomous spine on tail (Dasyatidae)","info":"레이노크는 바닥 생활에 적응된 평평한 디스크 모양의 몸을 가진 상어와 관련이 있는 어류입니다.
      다른 종들의 꼬리에는 방어를 위한 독침이 장착되어 있습니다.
      가슴지느러미로 파도치듯 움직이며 이동합니다.
      일부종은 전기생산성으로 먹잇감에게 충격적인 전기를 일으킬 수 있습니다."}
  animal.swordfish:
    label: 메추
    summary: 긴 찌르처럼 생긴 부리를 가진 대형 포식자인 깃발치상.
    info: 메추는 열대성 및 아열대 해역의 큰 회遊어이다. 날카로운 창 모양으로 평평한 입은 먹이(생선과 젊은 어류)를 쓰러뜨리기 위해 사용되며, 뚫지 않도록 설계되어 있다. 이 물고기는 최대 시속 100km 이상을 달릴 수 있을 정도로 매우 높은 속도를 자랑하며 스포츠와 요리는 물론 고급 식재료로서 인기가 많다.
  animal.tuna:
    label: 참치
    summary: 식품 산업용 대량 조달 목적으로 잡히는 고기능성 표층어.
    info: 블루핀 참치는 길이가 3미터 이상이고 무게도 700kg을 넘으며 가장 큰 종의 참치이다. 체온조절 능력(동물처럼 따뜻한 피를 유지함)이 있고 주변 물보다 몸 온도를 높은 상태로 유지한다. 바다에서 속도 면에서는 최고 수준이며 시속으로 약 70km까지 달릴 수 있다. 과잉 어업 때문에 생존에 위협받아 있으며 한 마리만 일본시장에서 백万美元 가까운 값을 한다.
  animal.walrus:
    label: 바다사자
    summary: 북쪽 극지방에 사는 큰 해양포유류로서 특징적인 것은 크고 두꺼운 턱수염과 매우 오래된 형태의 송곳니이다.
    info: 해양 포유동물인 바다사자(Odontophoca rosmarum)는 길이가 한 미터를 넘을 수 있는 거대한 상아로 이루어진 날카로운 이빨(상악니)으로 유명하다. 이러한 치기는 남극의 얼음 위에서 활보하기 위해 사용되며, 암컷과 경쟁하는 데에도 쓰이며 사회적 계급 구조도 형성한다.
  animal.whale:
    label: 고래
    summary: 지구상에서 가장 큰 동물 - 공기로 숨 쉬는 바다 포유류입니다.
    info: 블루웨일은 지구 역사상 존재한 최대의 동물이며, 길이는 약 30미터에 달하고 무게는 150톤 이상이 됩니다. 이들은 오직 미세한 갑각류인 크릴을 먹으며, 이를 체골 판으로 걸러냅니다. 모든 동물 중에서도 가장 소리가 큰 울음소리를 냅니다.
