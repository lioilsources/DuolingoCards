lang: ko
pivot: false
title: 해양 동물
cards:
  animal.crab:
    label: 게
    summary: 갑각류인 게는 패와 발톱이 있으며 옆으로 움직입니다.
    info: 게는 인프라목 브라키우라에 속하는 갑각류입니다. 주기적으로 완충을 벗어내며 성장합니다. 특징적인 방향은 옆쪽이며, 발톱은 방어, 사냥 및 의사소통에도 사용됩니다. 바다뿐만 아니라 담수나 육지에서도 서식할 수 있습니다.
  animal.dolphin:
    label: 돌고래
    summary: 집단으로 사는 지능이 높은 바다 포유동물로 물에서 점프하는 동작을 보인다.
    info: 돌고래는 돌고래과에 속한 해양 포유류입니다. 고도의 지능, 에코로케이션 능력, 그리고 장난스러운 행동으로 유명합니다—돌고래들은 배 옆 물결 위를 절구처럼 뛰어오르며, 휘파람 소리와 클릭음으로 의사소통합니다. 그들은 '군'이라는 이름의 집단 형태로 살아가며, 상어나 고등어 등 다른 큰 어종들과 가까운 친척 관계에 있습니다.
  animal.jellyfish:
    label: 메두за
    summary: 투명한 해양 동물로 종 모양의 몸과 독이 든 촉수를 가진다.
    info: 메두자는 뇌와 심장, 뼈가 없는 척추동물이며, 신체의 약 95%는 물로 이루어져 있다. 펄사션으로 움직이고, 촉수에는 마비 효과가 있는 유해세포(네타시스트)를 포함한다. 일부 종은 거의 불멸하며, 성숙 단계에서 다시 어린 시기 단계로 돌아갈 수 있다.
  animal.octopus:
    label: 오징어
    summary: 팔이 여덟 개인 머리발류 무척추 동물로, 색상과 형태를 바꿀 수 있다.
    info: 오징어는 머리발류에 속한 무척추 동물이다. 세 개의 심장과 파란 피를 가지고 있으며, 크로마토포르를 이용해 몸의 색깔과 질감을 즉시 변화시킬 수 있다. 매우 지능이 높아 닫힌 용기를 열거나 미로 문제를 해결할 수도 있다.
  animal.sea_turtle:
    label: 해양 거북
    summary: 알을 낳기 위해 해변으로 돌아오는 큰 바다 파충류입니다.
    info: 녹색 바다 거북은 일곱 종의 바다 거북 중 하나입니다. 암컷들은 자신이 태어난 해변에 두에서 다섯 년마다 돌아와 알을 낳습니다. 성체는 초식성이며 바닷풀과 조류를 먹고, 새끼들은 포식자입니다.
  animal.seahorse:
    label: 해마
    summary: 수직으로 수영하는 작은 어류로, 암컷이 아니라 수컷이 새끼를 품어 낳는다.
    info: 해마는 등鳍을 이용하여 수직 방향으로 움직이는 해양 어류이다. 흥미롭게도 새끼를 키우는 것은 암컷이 아닌 수컷이며, 그의 배에 있는 주머니에서 자란다. 꼬리를 사용해서 바닷풀에 붙잡고 먹잇감이 지나가기를 기다린다.
  animal.shark:
    label: 상어
    summary: 날카로운 이빨과 수역력이 뛰어난 몸을 가진 큰 포식성 어류입니다.
    info: 백상어는 세계에서 가장 큰 포식성 물고기이며 길이는 여섯 미터 이상 됩니다. 로렌티니의 암풀이라는 감각 기관으로 먹잇감의 전자장을 느낄 수 있습니다. 사람에게 공격하는 경우는 매우 드물지만, 상어는 해양 생태계에서 핵심적인 포식자 역할을 합니다.
  animal.whale:
    label: 고래
    summary: 지구상에서 가장 큰 동물 - 공기로 숨 쉬는 바다 포유류입니다.
    info: 블루웨일은 지구 역사상 존재한 최대의 동물이며, 길이는 약 30미터에 달하고 무게는 150톤 이상이 됩니다. 이들은 오직 미세한 갑각류인 크릴을 먹으며, 이를 체골 판으로 걸러냅니다. 모든 동물 중에서도 가장 소리가 큰 울음소리를 냅니다.
