lang: ru
pivot: false
title: Морские животные
cards:
  animal.anglerfish:
    label: морской дьявол
    summary: Глубоководная рыба с био светящимся наживкой.
    info: Морской дьявол живет в темных глубинах океана на расстоянии более чем через тысячу метров под водой у поверхности земли или моря . У самки есть биолюминесцентная приманка для привлечения пищи и других особей.
  animal.barnacle:
    label: рак светляк
    summary: Маленький рапакищеющийся организм живёт на камнях или корпусах судов.
    info: Светляки – прикреплённые ракообразные из подкласса Cиррипепия; они цементируются на скалах и кораблях с помощью выделений.
  animal.beluga_whale:
    label: белуха
    summary: Маленький белый арктический дельфин со скругленной головой.
    info: Белуга - небольшая белая китообразная животное арктических и субарктических морей. Ее выдающаяся выпуклая головка служит для эхо-локации.
  animal.blue_tang:
    label: хирургическая рыба
    summary: Ярко голубой обитающий среди коралловых рифов вид из фильма «Найди Ниуму».
    info: Синий канникус или хирургическая рыба с острым ножом на корне хвоста живет в тропических морях Индокитая и Тихого океана. Это ярко окрашенная маленькая рыбка со светло-голубым телом и желтыми полосами у основания плавников. Пищится она зоофланктоном и фитопланктоном.
  animal.carp_river:
    label: Речной карп
    summary: Большая золотисто-коричневая рыба, обитающая в ручьях и оранжевых бассейнах.
    info: '{"hint":"\u{43e}\u{43f]\u{598}","info": "Капор обыкновенный родом из Азии и был завезен в Европу ещё во времена Средневековья. Это всеядное животное выгребает дно реки лапами или хвостом, что может вызвать помутнение воды. Каприца является символом чешских рождеств - продавцы на ярмарках продают их живыми прямо из кадок с водой. Он относится ко многим наиболее распространенным видам рыб мира и существует более ста пород."}'
  animal.catfish:
    label: Som
    summary: Большая пресноводная рыба со щетками живущая под водой реки
    info: '{"hint":"днообитающая пресноводная рыба с усиками","info":"Сом европейский - самая крупная пресковенная рыба Европы длиной более двух метров и весом свыше ста килограммов\rНосовые щупальца служат органам обоняния и осязания\rОбитает на глубине рек и озер\rВ Чехии считается ценным объектом спортивного рыболовства","label":"som","summary":"Крупная пресноводная рыба с барбусами скрытого типа в речных долинах"}'
  animal.clam:
    label: млж обрій
    summary: Наибольшая разновидность млёжа на планете, которая населяет коралловые рифы экзотических регионов.
    info: '{"hint":"двустворчатый моллюск с двумя шарнирными раковинами (Бивалвия)","info":"Гигантский трюфельный устрицовый гребешок (Tridacna gigas) - это крупнейший в мире вид этих животных длиной более метра и массой свыше 200 кг\u202fkg. Он живет во взаимодействии со светочувствительным водорослями zooxanthella внутри своего панциря. Может жить больше ста лет. Легенда о том что он ловит ныряльщиков является вымыслом поскольку закрывается слишком медленно."}'
  animal.clown_triggerfish:
    label: клетчатый хирург
    summary: Тропический вид рыбы с белыми пятнами по всему тулу и оранжевое оттенение губ.
    info: '{"hint":"рыба с ярким узором на коралловых рифах","info":"Клоунский балист – крупная тропическая рыба из семейства Балистидае со одним из самых выразительных окрасов среди морских рыб. У неё прочные зубы для разрушения твёрдого материала вроде ракушек и коралловой массы. Название связано с первым спинным шипом, действующем как предохранительный механизм второму остну. Может проявлять агрессию к дайверам во время сезона спаривания."}'
  animal.clownfish:
    label: клоун очкатый
    summary: Оранжевая рыба, которая живёт во взаимовыгодном сотрудничестве со зловещей морской асманкой.
    info: Клаун оцкаетый живёт в морских анемонах, чьи ядовитые щупальца могли бы убить других рыб; клоуны иммунны благодаря защитной слизистой оболочке.
  animal.crab:
    label: краб
    summary: Десятиногий ракообразный с панцирем и клешнями, передвигающийся вбок.
    info: Краб – это членистоногое из инфраотряда Коротконогие. У него твердый хитиновый панцирь, который он регулярно линяет (экдизис), чтобы расти. Он двигается характерным образом в сторону. Клыки служат для защиты, охоты и общения. Обитает как в океанах, так и в пресной воде или на суше.
  animal.dolphin:
    label: дельфин
    summary: Умное морское млекопитающее, живущее стаями и прыгающее из воды.
    info: Дельфин — это морское млекопитающее семейства дельфинов. Он известен высоким интеллектом, способностью к эхолокации и игривым поведением; дельфины любят прыгать через волны кораблей и общаются с помощью свистящих звуков и щелчков. Они живут группами, называемыми стаями, и являются близкими родственниками китов.
  animal.dugong:
    label: дуго́нга
    summary: Тихое травоядное морское животное индикоокеанического региона, связанное с манатей.
    info: Дюгонг – морское млекопитающее из Индийского и Тихого океанов родственное манати. Он питается исключительно водными растениями. Его считают вероятным источником вдохновения для образа морских дев; когда путешественники ошибочно принимали его за подводные существа.
  animal.eel:
    label: Угорь / мура
    summary: Змеевидная рыба движется по щелям коралловой скалы.
    info: Мурена - большая морская рыба из семейства Муравьих скатов, прячущаяся в трещинах кораллового рифа.
  animal.flying_fish:
    label: лётущая рыба
    summary: Тропическая рыба может планируют над поверхностью океана при помощи больших грудных плавников.
    info: |-
      Летающая рыба (летун Exocoetidae), тропическая особь способна прыгать из воды и скользить по воздуху с помощью своих раскрытых плавников наподобие крыльев;
      рыбы могут лететь до двухсот метров на высоте около полутора метра,
      чтобы уйти от хищников таких как тигровая акула или дельфины.
      Барбадос называют «Страной лётучих рыб»;
  animal.frogfish:
    label: жабиц
    summary: Маскарадная охотница в коралловых рифах.
    info: '{"hint":"необычный засадчик с плавниками вместо ног","info":"Жабица - маленькая морская рыба из семейства Антеннариид со сложной маскировкой и способностью к преследованию добычи на лакомстве."}'
  animal.giant_squid:
    label: гигантская головоногая
    summary: Самый большой безпозвоночный животное мира живет на глубоком океане.
    info: Гигантские каракатицы (Architeuthis dux) являются крупнейшими беспозвоночными в мире длиной более тринадцати метров.
  animal.hammerhead_shark:
    label: мечехвост
    summary: Акулы с характерно расширённой плоской Т–образной головой.
    info: Молот – вид акул с необычной широкой головой в форме молота или цефалофила. Расширенная форма позволяет лучше обнаруживать добычу при помощи электрических органов и улучшает управляемость под водой.
  animal.horseshoe_crab:
    label: подкожец
    summary: Древний членовторч превратившийся в подкожца за последние 450 млн.
    info: Подкожец или хиронимус полифема - это членистоногий возрастом около 450 миллионов лет и выживший без существенных изменений с первобытной эры.
  animal.jellyfish:
    label: медуза
    summary: Прозрачное морское животное в форме колокола с ядовитыми щупальцами.
    info: Медуза — это прозрачное морское животное из типа коралловых полипов без мозга, сердца или костей; тело состоит на 95% из воды. Она перемещается за счет пульсации своего колокольчатого тела. Щупальца содержат уколы (нематоцисты), которые парализуют добычу. Некоторые виды почти бессмертны и могут вернуться в стадию молоди.
  animal.lionfish:
    label: крючковатый
    summary: Ядовитая тропическая рыба с драматичными иглами.
    info: Красный крабовый окунь - ядовитая морская рыба из семейства Scorpionов с выразительными красно-белыми полосами и ядовитыми шипами.
  animal.lobster:
    label: лобстер
    summary: Крупное морское членистоногое со щупальцем; готовится до коричневатой окраски но живёт зелено.
    info: |-
      Атлантический лобстер - крупный морской ракообразный из семейства Нефродидов длиной более чем на 60 см.
      Он темно синезеленый при сыром виде и краснеет только во время варки.
      Может жить больше пятидесяти лет.
      Это ценная кулинарная роскошь; торговля лангустами составляет миллиардную отрасль.
  animal.manatee:
    label: манатей / дугонг
    summary: Плавучее морское травоядное животное известное как морская корова
    info: '{"hint":"медленный травоядное морское животное (трихеус), называемое морской коровой","info":"Манатей или дюгонь - крупные морские млекопитающие которые питаются исключительно водными растениями и живут в тропических бухтах с неглубокой водной гладью у берегов Карибского побережья Флориды Африки а также на входах рек и проливах .\nОни серьезно подвержены опасности столкновений со скоростями лодками двигающимися по их местам обитания ; многие из них имеют шрамы от вертушек этих суден на коже \"Шепчет медленным шагом (от трех до пяти киллометров за час ) и делает глубокий вздох каждые три минуты."'
  animal.manta_ray:
    label: мантские лучи
    summary: Огромная изящно выглядевшая рыба-ската, которая собирает планктон у поверхности воды.
    info: Мантас океанические - самые большие виды скатов с размахом плавников более семи метров и весом свыше двух тонн. Они фильтруют планктон при помощи жаберных пластинок во время движения со зияющим ртом.
  animal.mussel:
    label: '"еда"'
    summary: '"Темная устрица собирается вместе на скалах во время отлива и прилива."'
    info: '{"hint":"темнокорый двустворчатый моллюск, образующий скопления на камнях (Mytilus)","info":"Еда славка - это устрица, обитающая в приливных зонах Атлантического и Тихого океанов.\nОна прочно крепится к скалам прочными нитями (byss).\nФильтрует воду и служит индикатором загрязнения океана; аккумулирует токсины и тяжелые металлы.\nЭто ценный продукт питания; бельгийские фритюры с ракушками являются всемирно известной деликатесностью."}'
  animal.narwhal:
    label: нарывал
    summary: Арктический кита со скрученными по спирали зубами напоминает фантастического единорога.
    info: Нарвал - небольшая арктическая китообразная длиной до пяти метров с характерным длинным спиралевидным клыком на голове, который представляет собой чрезмерно развитый левой резец верхней челюсти и может достигать в длину более трёх метров у самцов, тогда как у самок он отсутствует полностью или почти не развивается. Живёт стаями преимущественно во внутренних частях Арктики.
  animal.nautilus:
    label: наутилий
    summary: Древний головоногое в завитковидной оболочке.
    info: Наутилус - примитивный головоногий моллюск со спирально закрученной раковиной и практически не изменился за последние полтора миллиарда лет.
  animal.octopus:
    label: осьминог
    summary: Моллюск с восемью щупальцами, способный менять цвет и форму тела.
    info: Осьминоги — беспозвоночные животные из класса головоногих моллюсков. У них три сердца, кровь у них голубая, а также они могут моментально изменять цвет и текстуру кожи при помощи хроматофоров. Они очень умны — умеют открывать закрытые контейнеры и решать лабиринты.
  animal.orca:
    label: косатка
    summary: Черно-белый вершинный хищник мирового океана - самый большой вид среди дельфинов.
    info: '{"hint":"черно-белый апексный хищник также называемый косаткой или оркином","info":"Косатка драконья является крупнейшим представителем семейства дельфинов и одним из самых умных животных мира.\nОна охотится в координированных группах (стадах), каждое стадо имеет уникальные методы лова.\nОбщение происходит через диалект звуковых сигналов различного характера между разными стаями.\nВ неволе она болезненно переносит условия содержания; кампании по правам животных достигли ограничения их выращивания."}'
  animal.oyster:
    label: устрица
    summary: Млжь, фильтрующий воду; источник жемчужин и популярная закуска.
    info: '{"hint":"двустворчатый моллюск на коралловых рифах и скалах (острея или крассострея)","info":"Устрицы - это фильтрующие воду двустворчаки; одна устрица может очистить до двухсот литров воды в день\u000aНекоторые виды производят жемчуг при раздражении раковины посторонним предметом\u000аСвежие устрицы ценятся как деликатес; традиционно их ели только месяце с буквой "R"").","label":"устрица","summary":"Млжь, фильтрующий воду; источник жемчужин и популярная закуска."}'
  animal.piranha:
    label: пира尼亚
    summary: Южноамериканская хищная пресноводная рыба с острыми зубками.
    info: Пирания краснобрюхая – хищная пресноводная рыба из Амазонки с острыми треугольными зубами и сложной репутацией опасного охотника на человека. Она нападает крайне редко в случае здорового купающегося члеловека.
  animal.puffer_fish:
    label: Рыба Фугу
    summary: Рыбы, которые могут накачивать себя губами во время опасности; рыбу фугу можно есть только если вы знаете что делаете.
    info: |-
      {"hint":"рыба, которая надувается в колючий шар при угрозе","info":"Фугу - это вид рыб из семейства Тетродонтовидных, способный наполнять тело водой или воздухом до островатого мяча.
      Содержит тетрадотоксин один самых сильнодействующих натуральных ядов; печёночная и половые железы являются летальными для человека.
      В Японии фугу является деликатесным блюдом; повар должен иметь специальное разрешение на его готовку.
      Надуться происходит как защитная реакция а не как форма атаки."}
  animal.salmon:
    label: \u05d9ی
    summary: ת׬ מןלם כ־ֻּך ׮׫ֽ֪֬ ׯורי׎.
    info: '{"hint":"\u043f\u044b\u043b\u044c \u0438\u0437 \'
  animal.sea_anemone:
    label: морской анémon
    summary: Цветковое подобие морского организма с ядивными ножками, обитающее во рифах.
    info: '{"hint":"цветущее морское животное с уколами на щупальцах","info":"Морская актиния - медуза из класса коралловых полипов, прикрепленная к скалам и напоминающая цветок своими внешними чертами."\"Щупальца содержат ядовитые клетки (нематоцисты), которые используются для паралича добычи."\"Она живёт в симбиозе со скунсами, водорослями и чистящими ракушками."\"Её возраст может превышать сто лет; она потенциально бессмертна (никогда не старится до конечной стадии жизни)",'
  animal.sea_cucumber:
    label: голотура
    summary: Цилиндрический морской организм собирает органику с глубины.
    info: Морские личины из класса голотуриоидов живут на дне океана и питаются органическими отходами. При угрозе они выбрасывают кишечник или водянистую жидкость, которая затем восстанавливается. Их ценят в Азии как трепанга – традиционный компонент китайской кухни.
  animal.sea_lion:
    label: морской леопард
    summary: Ушастый пловец способный передвигаться с помощью плавников; громкое рычание.
    info: Калифорнийский морской леопард – самый известный представитель ушатых тюленей (Отарииды). В отличие от настоящих тюлений он имеет наружные уши и может ходить по четырём плавникам. Он исключительно сообразителен; в развлекательной индустрии его обучают сложным трюкам.
  animal.sea_otter:
    label: мария
    summary: Марийка пливесячі інструментами розколує черешню.
    info: '{"hint":"морская выдра плывет на спине и использует инструменты (Lutra marina)","info":"Морские еноты - морское млекопитающее Северной Америки с самой густым шерстью среди всех млекопитаний(около миллиона волосов в квадратном дюйме).\nОни используют камни как орудие для разбивания устриц и ракушек положенных на живот. \nСпят плавая по поверхности воды, цепляются за лапки друг друга чтобы течение не отнесло их. \nПочти были полностью истребленны ради меха, но благодаря программам защиты популяция восстановилась","label":"мариинка","summary":"Марина плавает на спине и бьёт камнями рапаны."}'
  animal.sea_slug:
    label: плакофора / нудиподии
    summary: Разноцветный голый морской улитка без панциря живёт на кораллах.
    info: Нудибранхиальные моллюски обитают на коралловых рифах и не имеют раковины. У них самые яркие цвета в животном мире – они служат предупредительным сигналом о наличии токсинов. Некоторые виды заимствуют ядовитые клетки из пищи (кораллы), чтобы использовать их для своей защиты.
  animal.sea_turtle:
    label: морская черепаха
    summary: Большой морской рептилия, которая возвращается на пляж для откладывания яиц.
    info: Зеленая морская черепаха является одним из семи видов морских черепах. Самки возвращаются каждые два до пяти лет на тот же пляж, где они сами вылупились, чтобы отложить яйца. Взрослые особи являются травоядными и питаются водной травой и водорослями; молодь имеет всеядное питание.
  animal.sea_urchin:
    label: ехиноиде
    summary: Круглый океанский иглокожий обитатель каменистого дна.
    info: Ехиноиды – морские иглокожие животные с подвижными шипами на поверхности тела. Между ними расположены специальные органы для очищения и добычи пищи - педикеллярии. Питаются водорослями, грибками и органическим детритом.
  animal.seahorse:
    label: морская лошадка
    summary: Мелкая рыба, плавающая в вертикальном положении; самцы носят потомство.
    info: Морская лошадка – это рыба рода Hippocampus, которая передвигается во время плавания в вертикальной позе с помощью спинного плавника. Интересный факт заключается в том, что молодь вынашивает самец, а не самка. Морские лошадки держатся за водные травы хвостом и ждут проходящей добычи.
  animal.seal:
    label: Тюлень
    summary: Морской хищник отдыхающий на камнях и добывающий рыбу в океане.
    info: Обыкновенный тюлень – морское млекопитающее из семейства медвежьих пингвинов с аэродинамическим туловищем и отсутствием ушных раковин. Он обитает вдоль береговой линии Атлантикики и Тихого океана; проводя время как под водой так и на скалах. Может нырять глубже чем до 50 метров и находиться там более получаса.
  animal.shark:
    label: акула
    summary: Большая хищная рыба с острыми зубами и обтекаемым телом.
    info: Белая акула – самая крупная хищная рыба в мире, достигающая длины более шести метров. У неё есть способность чувствовать электрические поля добычи при помощи ампул Лоренцини. Несмотря на свою репутацию, нападения на человека очень редки; акулы играют ключевую роль как хищники океанической экосистемы.
  animal.shrimp:
    label: краб
    summary: Мелкий морской членистоногое, второй самый популярный морской продукт мира.
    info: '{"hint":"малый быстро плавающий ракообразный\"(Penevidae или похожий)\", "info": "Креветки - это маленькие морские или пресноводные членистоногие с десятью парами ног\. \Существует более чем две тысячи видов креветок; они являются вторым наиболее популярным морским продуктом в мире\. Они фильтруют воду и охотятся на добычу; играя ключевую роль во всемирной цепочке питания океана\. Множество их разновидностей служат важными источниками пищи для тропических побережных общин."}'
  animal.squid:
    label: \xCE\xBB\xCF\xE9\xC3
    summary: \xD0\xB5\x20\xCB\xED\xEC\xEA\xF0\xA0\xBA\xEB\xCA\xBE\xAD\xAE\xAF\xAC\xAB\xFE\xFF\xFB\xFD\xFC\xDF\xBF\xDA\xBC\xDE\xBD\xDB\xBE\xDC\xCE\xDD\xAA
    info: '{"hint":"\u4e5d\ufffd\udc6f\udd70 \uc9fc\ucca0\ubbac \uceb8\uae30 \ubaab\ude84 \ubecc\uaeb0\uda9c 캠쪽몮�결(\uDca0\Udecd\UDcbduade)","info": "\UCFef\UCEA0\UBCFC\UDAEC \UCEEB\UBECD\UED00\UECC0\UAED8 \UCEBB\UCEFD\UFEE0\UFFFE\UDEFF\UDBBD\UDDDC\UDEBF\UDEF0\UFBFA\UDECF\UDBC0\UDEC0\UDED0\UDEEF\UDECB\UDEBC\UDEBA\UDEBE\UDECE\UDEEA\UDEAF\UDEDA\UDEAE\UDEAD\UDEDF\UDEB0\UDEB8\UDEB0\UDEB0\UDEB0\UDEB0\UDEB0\UDEB0\UDEB0","label": "\UCEbb\UCEFd\UFee0\UFFfe\Udef0\Ufbfa\Udecf\Ubdbbd\Udddc\Udebda\uedcf\uedeae\uebad\uebaed\ufeff\ufeff\ufe0f","summary": "\Uded0\Udee0\Udea0\Udead\Udfbc\Udebf\Udeba\Udebe\Udeaf\Udeaa\Udecd\Udbc0\Udec0\Uded0\Udeef\Udecb\Udebc."}'
  animal.starfish:
    label: звезда
    summary: Пятилучевый морской животный организм со способностью восстанавливаться после потери частей.
    info: Звёздчатые морские ежи - это пятиконечные океанические эхинодермы с типичной формой из пяти лучей или концовок. Они способны регенерировать полностью потерянное крыло либо создать новое тело от ампутированного крыла. Ежедневно они кормятся устрицами и другими двустворками, раскрывая их раковины при помощи присоски.
  animal.stingray:
    label: райя
    summary: Плоская рыба со щупальцами на хвое; отдыхает на песчаных участках.
    info: Райя похожа на акулу с плоским дисковидным телом для жизни у дна морей и океанов. У многих видов хвост оснащен ядовитым шипом в целях самозащиты.
  animal.swordfish:
    label: меч
    summary: Большая хищная глубоко плавающая рыба со длинным мечевым наконечком.
    info: Мечник крупный – большая рыба из тропических и субтропических океанов. Его плоский мечевидной формы клюв служит для подкалывания добычи (рыбок или головоногих) а не на протыкание ими. Он одна самых быстрых рыб в мире достигающих скорости свыше ста километров за час.
  animal.tuna:
    label: '"тюнус"'
    summary: '"Быстрая пелагическая рыба вылавливаемая огромными количествами для пищевой индустрии"'
    info: '{"info":"Тунец синеперый - это самый крупный вид тунца длиной более трех метров и весом свыше семи сотен килограммов. Он эндотермен или теплокрвенен, поддерживая температуру своего тела выше окружающей воды. Это одна из самых быстрых рыб океана со скоростью до ста семьдесят киллометров в час. Критически угрожает ему превышение лова рыбы; один экземпляр продается на японском рынке за десятки тысяч долларов."}'
  animal.walrus:
    label: морж
    summary: Крупное морское млекопитающее Арктики со статным видом.
    info: Морж – крупный арктический пинипед с огромными слоновьими клыками длиной более метра и усами из волосковой ткани.
  animal.whale:
    label: кит
    summary: Самое большое животное на Земле — морское млекопитающее, дышащее воздухом.
    info: Голубой кит — самое крупное из когда-либо живших на Земле животных; его длина может достигать до 30 метров и массы свыше 150 тонн. Оно питается исключительно микроскопическими ракообразными, называемыми крилем, которые фильтрует через жаберные решётки. Голубые киты производят самые громкие звуки среди всех животных.
