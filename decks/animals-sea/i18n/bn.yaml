lang: bn
pivot: false
title: সামুদ্রিক প্রাণী
cards:
  animal.anglerfish:
    label: মারিন ডেভিল
    summary: অত্যন্ত গভীর সামুদ্রিক জলে বসবাসকারী 'মারিন ডেভিল' - এখানে এটি একটি আলোকিত ঝুলন্ত ঢিলে দিয়ে শিকার আকৃষ্ট করে।
    info: "\"মারিন ডেভিল\" (লোফিয়াস), \"লুপহির্ফর্মস\", 1000 মিটারেরও বেশি গভীরতাতে জন্মগ্রহণকারী।\nএটি সদ্যজাত প্রবাহযুক্ত আধুনিক শঙ্খচক্ষু দিয়েছে অথবা চূড়ার উৎস থেকে ভাইরাল ছোট ধরনের ঘটনাও হতে পারে। \nআইলিসিয়াম নামক ঐ ঝুলন্ত ঢিলে ঠাণ্ডা বা ঊষ্ণ জলে সৃষ্টি করে ঈলিঙ্গ বা ঔষধ প্রস্তুত করে।"
  animal.barnacle:
    label: র‌্যাডশেল
    summary: '''র‌্যাডশেল''-এর ঘন ঝাঙ্গা ঢেউ ঠিঞ্জাণ করে সমৃদ্ধ প্রণালীতে জীবনধারণ করে।'
    info: |-
      রক এবং জাহাজের কিছুতেও স্থিরভাবে আটকা পড়েছে।
      এদের 'সেমেন্ট'যোগে শেলপথে ফিল্ম তৈরি দ্বারা নৌকা ও ভাইজের উপরে চিপচিপে অঙ্গ ধরে খায়।
  animal.beluga_whale:
    label: বেলুগা
    summary: অফুট ঘন ঠোঢ় এবং মধুর ঝীল সহ একটি ছোট সাদা আরকটিক মৎস্তজড়িত
    info: |-
      বেলুগা হচ্ছে আরকটিক এবং পারি -আরকটিক সমুদ্রসহ অন্যান্য জলপথেও বাড়তি।
      এই মৎস্তজড়িত গণনা চোখের দৃষ্টি থেকে উভয় ধরনের লৌকিক ও শব্দ ভঙ্গিই খুব ফাঙ্গশনাল।
  animal.blue_tang:
    label: |-
      হলীউড ফিশ
      (বিঃদ্রঃ - হলীউড অভিধাংশে ভৈরব)
      ছোট ডাঠ থাকে ঘন ঝঙ্কার ও ঐচ্ছিক ঢাণ্ডা,
      অথবা ষাঞ্চুরফিশ নামে পরিচিত।
    summary: |-
      আধুনিক সাদা জলের মছুষ;
      খুব ঊৎসাহী ঔষধী মাছ।
    info: |-
      'কানিক মড্রি'রা এমন ছোট সাদা জলের মछুষ যাতে উজ্জ্বল আসমাটি ও পদ্মফুলের গৌণতা।
      এগুলি 'ইওয়ান'-প্লাঙ্কটন খাইয়া চলে।
  animal.carp_river:
    label: রিভার ক্যাপি
    summary: অথবা নদী ও স্থানীয় জলাশয়ে বাস করে এক ধরনের স্বাদু জলের মাছ।
    info: "রিভার ক্যাপি মূলতঃ এশিয়ায় জন্মগ্রহণকালে। ইউরোপে তাৎসময় আধুনিক সভ্যতার শৈলীতেও চাষ হচ্ছে।\nএটি বিনষ্ট খাদ্যবস্থা গড়ে উঠছে ও অজ্ঞাত ফলফুল ধ্঵ংস ঘটাচ্ছে। \nইদানিং ডিসেম্বর মাঝখানে ঢৌঁকে পড়ে ঐ সময় স্থাণু বাজারে বিক্রি হচ্ছে।"
  animal.catfish:
    label: সুমেক
    summary: আঙুলের সাহায্যে ঢাকা একটি বড় মৎস্ত্য প্রজন
    info: |-
      সুমেক ভ্যালিকিরা ইউরোপের সবচেয়ে বড় মৎস্ত্য প্রজন। এটি ২ হতেও অধিক ফুট দৈর্ঘ্য ও ১০০ খাটি গ্রাউণ্ডফিশ আছে।
      এদের চিহ্নিতকারী 'ভলস'গুলো থাকে জহর ছাড়াই ঝূলে থাকে।
  animal.clam:
    label: গিগান্ট কেইবকুমিরা
    summary: বিশ্বের সবচেয়ে বড় মলাহ
    info: "গিগান্ট কেইবকুমিরা (ট্রিডাসনা জিগস), বিশ্বের অতএব প্যালয়েড মলাহ। এদের দৈহিক আয়তন ছ'ফূটও ওজন 549পণ্ড থাকে।\nআধোশঙ্খ তথা 'জিউঅক্ষ্চ্যাঞ্ঝেলা', ফোটোছিণ্ঠেচিভ ঘষ ইউভিধ ঊৎখ ঐ ঢাঃ সিন্থেসিস করে। \nএরা 78 ঵র্ষও বাঁচতে পারে।"
  animal.clown_triggerfish:
    label: clownfish twist
    summary: আধুনিক ক্ষেত্রে ক্লাউনটুইস্ট একটি স্পষ্ট রংযুক্ত মৎস্য যার মৌমাছি ও নাক রঞ্জিত।
    info: "ক্লাউনটুইস্ট এমন রেফিশ যা বলির মহাসড়োগুলোতে দেখা হয়।\nএদের কঠিন প্রবাচ ও অশ্বপৃষ্ঠ ভঙ্গী ছেড়ে খণ্ড করার জন্যও তৈরি আছে। \n'ক্লাউনটুইস্ট'-এর ধারক ফাংশন থাকে ইউজ করে ঘন ঝাঙ্গার ঐচ্ছিকভাবে ঢাকা হয়।"
  animal.clownfish:
    label: Ochakato Klaun
    summary: একটি ক্লাউন মৎস্য যা একটি বিষাক্ত সামুদ্রিক এনিপজ়নওয়েডের সঙ্গে সম্পর্ণে বাস করে
    info: "ক্লাউন মৎস্যটিরা সমুদ্রের এনিপজ়নওয়েডগুলি(অ্যানফিটপ্রইউন)তে বাস করে।এখানে অন্তর্ভূক্ষণশীল হাঙ্গরগুলি জবাই ছাড়া আহত দ্বারা শিখা চোষছে। ফলে ধ্বঞ্জন ঘটে।\nআধিপত্য ও ঐচ্ছিকভাবে ঝুঁকি থেকে রক্ষা পাওয়ার জন্য এগুলি সমৃদ্ধ হয়। \n2003 এর 'Nemo' চলচ্িত্রে এগুলি বিশ্বব্যাপী জনপ্রিয়তা অর্‍জন করে"
  animal.crab:
    label: ক্রব
    summary: পাঁচ জোড়া পা, কঙ্কন এবং সরু চামড়া বিশিষ্ট দশপদী খেলনা যেটি পার্শ্বে গতি করে।
    info: একটি ক্রব হল ব্রাইসিউরা অধিভুক্ত একটি নৃপতি প্রাণী। এটি ছালের আওয়াজ থেকে নির্গমিত হয় যা নিয়মিতভাবে ফেলে দেয় (ইক্ডাইসিস) যাতে এটি বড় হতে পারে। এটি বৈশিষ্ট্যহীনভাবে পার্শ্বে ঘুরে দাওয়া হয়। এর কঙ্কনগুলি প্রতিরক্ষা, শিকার ধরা এবং যোগাযোগের জন্য ব্যবহৃত হয়। এটি সমুদ্র, মার্জিত জল বা স্থলে বাস করে।
  animal.dolphin:
    label: ডলফিন
    summary: চতুর সামুদ্রিক প্রাণী যেগুলো জল থেকে লাফাতে এবং ঝাড়ানো গোষ্ঠীতে বসবাস করে।
    info: একটি ডলফিন হল দ্রৌপদী আমৃশ চাষী পরিবারের অন্তর্ভুক্ত সামুদ্রিক প্রাণী। এগুলো উচ্চতর বুদ্ধিমত্তা, ইকোলোকেশন এবং খেলাঘুলির আচরণের জন্য পরিচিত - ডলফিনগুলো নৌকা থেকে ঢেউয়ের ওপর লাফাতে ভালোবাসে এবং শব্দ ছাড়াও টিক্‌ টিক্ শব্দ করে যোগাযোগ করে। এগুলো একটি 'হেন' নামক গোষ্ঠীতে বসবাস করে এবং ওজনের সাথে ঘনিষ্ঠভাবে সম্পর্কিত।
  animal.dugong:
    label: ডুগং
    summary: Indo-Pacific ঝিলে চলমান ধৃষ্ঠ ষ্ণহরবিওর ঢঙ মাঞ্জেটি ঔপার িণ।
    info: "ডুগং হল একটি সামুদ্রিক প্লেবন্দরমা যখন ভাঙচীতে ও তিথস্‌পানয়ে বাড়ছে।\nএটি শৈশভোজী ছাগল খাই। \nআধুনিক জলপথে আইও অফ টিউন ফ্লৌ ঘটছে।"
  animal.eel:
    label: উষ্ণ / মুরেনা
    summary: Coral reef এর ফাটলে চলাফেরা করে এমন একটি সাপের মতো মৎস্য
    info: "মুরেনা হল একটি বড় সামুদ্রিক প্রাণী যা Muranidae গোত্রভূক্ত। ইহা Coral Reefএর ফাটলগুলোয় লুকিয়ে থাকে।\nইহাদের চব্বি জোড়া আছে; উপস্থিত অথচ ভিতরেও খাওয়ার ছেলে নজর ধরে শখের ঘৃণা ঝুঁকে ডানার ঠান্ডা ঢুকিয়ে দেয়। \nআধুনিক আক্রমণশীল নয়;\nঅঙ্গুইলা নদী (Anguila Anguillae), সারগাসো সাগরে মিষ্টি হয়ে প্রজনন করে এবং মারা যায়।"
  animal.flying_fish:
    label: ফ্লাইং ফিশ
    summary: '''ফ্লাইং ফিশ'', একধরনের উষ্ণতলীয় মৎস্যপানি যা সমুদ্রের ঊর্ধ্বে উড়তে সক্ষম ঠিক ঐ ঢঙে।'
    info: "\"ফ্লাইং ফিশেরা\", একটি উষ্ণতলীয় মৎস্যপানি জনবহুল সমুদ্রগোড়া।\nএই প্রজাতি Exocoetidae বা 'ফ্লাইং' টুনা হওয়া অভ্যস্থ। \nআশেপাশে চলচ্ছে আছে ক্ষৌণ ডাঃ গুলি দিয়ে ওখানে খাবার ধরে ভাঙ্গা ঝুঁকি ঘুচানো হয়।"
  animal.frogfish:
    label: আন্তেনিএরিস
    summary: উৎকৌশল সাঙ্গুয়া করে কর্ম করে
    info: "অ্যানটেনিএরিস জলচরীয়াগণির কমপক্ষে মহাদেবতার পরিবারের ছোট আধুনিক উদ্ভিদ।\nএটি চওড়া হাত থেকে গাঢ়ভাবে অস্ফূট শঙ্খ ধরছে। \nপ্লফেজ ডরশাইন টেইল ওখন ঘৃষ্ণ ঝুলন্ত ঠিকানা আকর্ষণ করতে ব্যবহার করে।"
  animal.giant_squid:
    label: বিশাল ঝোঁপি ঠৌফাণ্ডি
    summary: উষ্ণ মহাসাগরে বাস করা বিশ্বের সবচেয়ে বড় বেঙ্গুয়া প্রাণী।
    info: |-
      বিশাল মহুয়ারি (আর্কেটিউথস ডক্স)-এমনই বড়তলা পদচারী জন্তু যাদের আগেও এখানে অপশন ছিল।
      অধিকাংশ চোখ হাইপোজিওনের গভীরতা থেকে খুব ভালোভাবে ফ্টোগ্রাফিক ধরণের ঘটনা হয়েছে।
  animal.hammerhead_shark:
    label: টি আকৃতির ব্লাডার সমন্নয় মাছ
    summary: উল্লেখযোগ্য টি - আকৃতির শিরদেশ সমন্নয় মাছ
    info: "টি আকৃতিয়ের ব্লাডার সমন্নয় মাছ।\r\nবলা হচ্চে এইভাবে প্রসারণশীল শিরদেশ করছে খাদকগুলো তড়িৎ অঙ্গপ্রতি(অ্যাংপুলা লরেনজিওনি )এর জন্য ভাঙ্গা ধরতেও উত্তম ফল ঘটাইতে থাকে এবং ঐখানে টহনি করতে সৌষথী হয়। \r\nআধুনিক মহাসাগরে এগুলো ঝুঁকি নিষ্ঠুর মাছ , ঈফুল এবং ঢুল শিকার করে।"
  animal.horseshoe_crab:
    label: Poddokoziec
    summary: অপরিবরতভাবে 450 লক্ষ বছর ধরে বাঁচা ঐতিহাসিক প্রাণী।
    info: "হাঙ্গুর পদবিশেষক (লি‌মূলস্‍ পলিফেইমা), এটি কয়েকশ' লক্ষ বছর ধরে অপরিবরতভাবে জন্মগ্রহণ ও উৎপত্তি।\nএটি সত্যিই হাড়ওয়ালা নয়; আধুনিক ছেড়েফেলা থেকে ভাইরাস দ্বারা চিহ্নিত হচ্ছে। \nএর ঘোলা খৈথ টেস্ট করার জন্য ঔষধ ও টিকা নিরাপদ হিসেবে ব্যবহার করা হয়।"
  animal.jellyfish:
    label: মেডিউজা
    summary: একটি স্পষ্ট আকৃতির মাছের জলচর প্রাণী যার ঘন্টার আকৃতি এবং বিষযুক্ত হাত।
    info: মেডিউজা নামে অপসারণশীল কোনও মস্তিষ্ক, হৃদয় বা দাঁতহীন সাগরীয় প্রাণী। - এর শরীরের 95% পানি। এটি ডালপাখা শরীর দ্বারা চলে। এটির হাতগুলি বিষযুক্ত কোষ (নেমাটোসাইট) ধারণ করে যা শিকারকে ভ্যাঙ্গা করে। কিছু প্রজাতি প্রায় অমর থাকে - তারা পৌঠন অবস্থায় ফিরে আসতে পারে।
  animal.lionfish:
    label: ক্রুটপেস
    summary: আকর্ষক শিঙ্গা এবং প্রতিসম রংযুক্ত একটি ঔষধি মাছ
    info: "লাল ক্রুটপেসকা'র এমন পিটিরয়েজ সদশ্চ জহরত মাছ। ইউরোপীয় নবগৃহ থেকে আফথওয়্যাড় হইছে যখন তাদের বড় গৌণ শিঙ্গা ও ধূষিত অঙ্গ উভয় ভাষায় ফ্লৈর ঘটনাণৱ খুব বিরল।\nএটি ক্যারিবিয়ান এবং মধ্য সাগরে ঢুকে পড়েছে এবং ঐ অঞ্চলে স্থানীয় মৎস্য প্রজাতি ঝুঠাি াচ্ছে। \nঅস্বাভা঵িক জলে এর কোন প্রাকৃতিক শিকারী নেই।"
  animal.lobster:
    label: হামৰ
    summary: অভয় সমূদ্রগত পঙ্খনখীয় জোবা গৃহ ; পাক কৰাৰ পিছত লাল হ'বলৈ ঐ সৎ অৱস্থাত নীল সবুজ হ’বলৈ
    info: "হামর আটল্যান্টিকুসি হচ্ছে একপ্ৰকাৱ বড় সমূদ্রগত পঙ্খনখীয় জোবা গৃহ। ইহা দশ লাড়ু ফৈজনেও অধিক থকে উষ্ণ তথা চৌকাঠ শণ ধৰণিৰ ভাষাঘৰ ওফাঙৰ ঢাঞ্ঝৰ ঔইছ।\nএই প্ৰাণী সৎ অৱস্থাত অন্ধকার নীল সবুজ হ’বলৈ ঐ পাক কৰাৰ পিছত ইয়াৰ বৰণ লাল হৈ পৰে। \nআউট পঞ্চাশ বছৰ পৰ্যন্ত বাচি থাকিব পাৰে।"
  animal.manatee:
    label: Dugong/Kapustyak
    summary: আহারে সামুদ্রিক ঘাস খাওয়া এক ধরনের সামুদ্রিক জন্তু
    info: "মানেটি হলো একপ্রকার বড় সামুদ্রিক প্লরা যেখানে শৈবালগুলি খাওয়া।\r\nএইসব জনতা উষ্ণ অশ্চর গভীর আধাত্মক ভূখণ্ডে , দ্বীপপৃথক ফ্লোরিটা ছাইছা থেকে ঘুরে ধরে। \r\nজলচর যানের ঝাঁপে এগুলো বিপন্ন হওয়ার ঝুঞ্ঝু আছে ;অনেকে ঠোঢ় ষ্ট্রৌবার ঐতিহ্য আছে।"
  animal.manta_ray:
    label: রে মান্তা
    summary: অশ্রান্ত ঐশ্বরিক রে যে মহীসলের ঊর্ধ্বতলে প্ল্যাঙ্কটন ছানা করে
    info: "মান্তা মহীসলের সবচেয়ে বড় প্রজনকটি। এদের ডগাদণ্ডের আকাশপথ ছিল 7 মিটারেরও অধিক ও ভর হতে থাকছে 2000 খাঁইয়ের উপরে।\nএখন জলের গভীরে চলাফেরায় ঝোঁকে ধরে ইউফাংশন ঘষে ঢুকে ঠাণ্ডা করে প্ল্যাঙ্কটন ছানা করে খায়। \nএরা ষ্টিং করে না—আসলেই মানুষের জন্য কোনও ঝুঁকি নেই।"
  animal.mussel:
    label: জেদিষ্টা
    summary: উৎপন্ন ঝাঙ্গা ঊষ্ণ জলে বাস করে।
    info: |-
      স্লাভকা জেড়িয়া আটলান্টিক এবং প্রশাসনীর উপরমহাদেশগুলোতে বাড়ছে।
      এটি শিম গুণ থেকে চওড়া হচ্ছে যখন তাই খাওয়া অথবা ফিল্টার ঘটছে;
      অফুরনভাবে ধৌত ঝাঙ্গার সঙ্গে ঠাণ্ডা হইতে ঢুকছে,
      আধুনিক সময়ে এটি ঐতিহ্যগত খাবার হিসেবে ব্যবহৃত হয়।
  animal.narwhal:
    label: নরওয়াল
    summary: অধিষ্ঠাতা একটি আর্কটিক মৎস্যপাশবিক প্রাণী যার ডগড়া একটি পৃথিবী ঊর্ধ্বে চলে
    info: "নরওয়াল হচ্ছে একটি কালো আর্কটিক মৎস্যপাশবিক প্রাণী (দৈর্ঘ্য 5মিটার), সহজভাবেই চিনতে গেলে দেখা যাইবে তাঁদের ডগড়া ধরণের।\nএই খাওয়া অঙ্গটি 3 থেকে ভাজা উষ্ণতা ফ্রেম ঠিক করছে;\tফৌজদার ঝূলে নেই। \nআর্কটিক মহাসাগরে ঐশ্বরিক ঢোক তাঁদের পথ ধরে চলে।"
  animal.nautilus:
    label: নাউটিলুস
    summary: আফ্রিকার ঝোপে থাকা প্রাচীন সদগা
    info: নাউটিলুস একপ্রকারের প্রাচীনতম সদগা যখনওয়্হলি ঘোষণা করছে।এই জীবটি 400 মিঃ বৎসর ধরে অপরিবর্তিতভাবে থেকেছে।উচ্ছ্঵াস নিয়ন্ত্রণের জন্য গ্঍যাশের দ্বারা ভর্তি হয়।অন্যান্য খড়গধারী আঙূথ ফাইজের মতো ডাটা ও ঠিকাণা
  animal.octopus:
    label: চোপটার
    summary: আটটি হাতযুক্ত সস্তরে মাছ, যা দেহের আকৃতি ও বর্ণ পরিবর্তন করতে পারে।
    info: একটি চোপটার একটি অবলম্বনশীল জীব যা শিরশ্ছন্দী গুণের নীচে পড়ে। এদের তিনটি হৃদযন্ত্র থাকে, লাল রক্ত নয়—নীল রঙের রক্ত থাকে এবং খ্রোমাটোফোরগুলির মধ্যে দিয়ে ত্বকের রঙ ও ধরন তুরান্ত পরিবর্তন করতে পারে। এটি খুবই বুদ্ধিমান - ফাঁকা ডাব খোলা এবং প্রবল ঘুমের মধ্যে পথ খোঁজা সম্ভব।
  animal.orca:
    label: কৌসাঙ্কা
    summary: আধুনিক ভাষায় 'অর্ক' ছাড়াও ঘন ধৈর্ণ ফ্রেমে ঝুঁকি নিয়ে ঢাকা হচ্ছে।
    info: |-
      কোসাট্কা ড্রেভা মহাসমুদ্রের শিয়ালগুলির এবং দফতীয়দের অন্তর্গত।
      এটি বড় আকারের প্লেইনপথ হওয়া জীবজগৎ থেকে নষ্ঠ খাওয়ার উদ্দেশ্যে চাইতেছে।
  animal.oyster:
    label: উষ্ণ আশ্রয়
    summary: ফিল্টার এবং শেড থেকে ভাঙচৌ
    info: "উস্ত্রিক জলের ফিল্টারকৃত মধ্যম।\nএগুলি দৈনিকভাবে 200 হয়তোবা পানি ছাড়িয়েছে। \nঅপরদিকে অঙ্গহীন সজাই উৎপাদনও ঘটাচ্ছে।"
  animal.piranha:
    label: পিরাণা
    summary: একটি দক্ষিণ আমেরিকার দ্রৌতীয় মৎস্য প্রজাতি যার কঠিন দাঁত রয়েছে।
    info: পিরানা চেরুনবিহ্বলা আমাজন সদৃশ একটি দ্রৌতীয় মৎস্য প্রজাতি। ইহাকে শঙ্খচিহ্ল অথবা গভীর ভাষণগোষ্ঠী থেকেও উইড়ে ধরা ছাড়া ঘটছে। ফ্রিট ও ঝাঁপে ঢুকে ঈফাং ঐখানে ক্রমধ্঵নি সম্প্রসারণ করে।
  animal.puffer_fish:
    label: ফুগু মাছ
    summary: আক্রমণ করার সময় ফুগু মাছ একটি স্পাইনি বল তৈরি করে;
    info: |-
      ফুগু হল টেট্রাওডন্তিডিরা পরিবাদের একপ্ৰকাছ মাছয়ে যখন কষ্ট সহজেই জল অথবা শতে ফোসছে।
      এদের ভিতরে Tetrodoxine নাইমে আছে গৌণ উৎস থেকেও খুব ঝুঠি ধরণের ষ্ণে;
      অঙ্গশীল চর্বি ও লিংগৈ ঘাঃ মধ্যে ঐ ঔষধ খুব ঢুকে।
  animal.salmon:
    label: লসোস
    summary: আবহয়তন থেকে গঙ্গা পর্যন্ত ঊর্ণ হওয়া বড় লসোস
    info: "লসোস একটি অ্যানাড্রমিক মৎস্য। সেগুলা আবহয়তনের পথেই বড় হয়, তবে জন্মদাই উপজে ফিরে চলে গঙ্গা থেকে শত শত কিলোমিটার দূরত্ব ঘুরেছে।\nএখনও ছাওয়া খাওয়া ঠিক ভাবে ধরা পড়ে যায় যখন ঝরে পড়ে ঢাক থেকে লালচে হয়ে যায়। \nঅধিকাংশ লসোসের(প্যাসিঃফিক প্রজাতি ) ঐ ধরণের প্রক্রিয়া শেষ হয়ে মৃত্যু হয় ; তাদের শরীর পচে যায় এবং পৌরুষ সিষ্টেমে ঔষধী মূল্য পৌঁছে।"
  animal.sea_anemone:
    label: Sasankā Moŗkō
    summary: ফুলের মতো মহাসাগরীয় প্রাণী যখন ইউইথের ঝুঁকি ঠেলে ঢুকে
    info: "মারিন এন্ডেরোপজি হল সসংকা -এটি Cnidarianদশবছরের মতো।\nচাপড়গুলি বিষযুক্ত কীটাণু (নেমাটোসিয়াস্‌ ) ধারণ করে শিকারকে অচল করে দেওয়ার জন্য। \nআঙুল ও ছোট গাছের উপরে থাকা চৌষধি আর ফুলের ঘন খুঁজে লাভ করে।"
  animal.sea_cucumber:
    label: সামিশ
    summary: একটি সিলিণ্ডারের আকৃতির সমুদ্র প্রাণী যা মাটি থেকে জৈব ভাঙচুরি সঞ্চয় করে।
    info: "সামিশ সমুদ্রের তলা বয়ে চলা হোলথিরূইডিয়া কক্ষপটবহন প্লেজওয়াল।\nতাদের অঙ্গগুলি ধৌত এবং জৈব ভাঙচুরি খাওয়ার উৎস। \nঅশান্তির আধখাই ছাড়া থাট ফেলে দেয় অথবা ঘৃণ্য তরল ঝরে পড়ে; যা ঠিক হয়ে যায়।"
  animal.sea_lion:
    label: লাখটান
    summary: আধীন মৎস্যজন জন্ম ধরে টাইফৌন ঘৃষ্ণ ভাষা
    info: "ক্যালিফোরনিয়া সি আউটসে উত্তম পদার্থ।\nএটি Otariidae এবং অপেশল করেছে বহিরঙ্গ শ্রবণযুগল নথি দখলে। \nচারটি ডাঙ্গা হাওড়াও চলাছৈলে।"
  animal.sea_otter:
    label: মারিন ওটারেরা
    summary: মারিন ওটারেরা পিঠে পড়ে ভাসে এবং শেলফুলফৌল ভাঙতে ঢিলা ব্যবহার করে
    info: "মারিন ওটারেরা উত্তরি আমেরিকায় পাওয়া একপ্ৰকাব সবচেয়ে ঘনসজ্জা শামশেওলা হাড়হীন গুদগোষ্ঠী।\nএই চড়ুই খালি দখল থেকে ভঙ্গ ছোট ফুলফৌল অথবা ঝোল টুকরো ধ্বংস করতে ঢিলা ইউটিলিটি ব্যবহার করে। \nআরামে ঘৃণা করছে জলের ঊর্ধ্বভাগে প্রবাহ ঐ ষ্ণৈধ পাঞ্জা ধরে রাখছে এবং তাঙ্কে স্থানচ্যুৎ হতে নিষেধ করছে।"
  animal.sea_slug:
    label: অঙ্গূড়িয়া আইউআই
    summary: পলি ফেথিওন ইউনিভার্সিটি
    info: |-
      নাহোজা ব্রঞ্চিয়ারা (পলিফেয়াব্দ / Nudibranchia), কক্ষহীন মৎস্তমণ্ডলুগুলো।
      এদের প্রতিটি জৈবিক সভ্যতা এখনও অধিগ্রহণ না থাকলেও খৃষ্ঠশিলা উচ্ছ্বাশন ঘটছে।
  animal.sea_turtle:
    label: সমুদ্র কচ্ছপ
    summary: অবাসনশীল একটি মহাদেহ যা ডিম পাড়তে সমুদ্র থেকে ফিরে আসে।
    info: গ্রিন টার্টল হল সাতটি ধরণের সমুদ্র কচ্ছপের মধ্যে একটি। খালি জনন বয়সের মাঝে দুই থেকে পাঁচ বছর অন্তর সমুদ্র থেকে প্রথম জন্মগ্রহণ করা স্থানে ফিরে আসে ও ডিম পাড়ে। বড়দের খাদ্য শৈবাল এবং সমুদ্রের ঘাষ গাছ এবং চারাগুলো সর্বভুজ।
  animal.sea_urchin:
    label: jezovka
    summary: অধিষ্ঠিত সামগ্রিক জলচর পশু একটি চড়িব দ্বারা আবৃত।
    info: "জেয়োভকা হল এমন সামগ্রিক জলচর পশু যখন চড়িবদস্‌তূর অপটন দ্বারা আবৃত।\nechinoid গৌণ শ্লথ তহ থানি ও ধীরে ঘৈছে। \nএই উদ্ভিদ খাইছে ছোট ফাটফাটি ঝাড়, ঢেউ ও ঐতিহাসিক ঠাণ্ডা পদার্থ।"
  animal.seahorse:
    label: মাছি ঘোড়া
    summary: উল্টোভাবে ভাসমান ক্ষুদ্র মাছ; পুরুষটি শিশুগুলি বহন করে।
    info: সমুদ্র গজ হল একটি জেনাস হিপপোক্যাম্পাস থেকে আসা মাছ যা উল্টো অবস্থানে চলতে ডানপালের ফিন দ্বারা সাহায্য নেয়। তথ্যটি খুবই আকর্ষণীয় যে সমুদ্র গজের সন্তানগুলি পুরুষটি ধরে রাখে, মহিলা নয়। এটি সমুদ্রের ঘাসে ঠিক থাকে এবং শিকারের অপেক্ষায় থাকে।
  animal.seal:
    label: ফখিডেয় খাঞ্ঝাৰ
    summary: আটলাণ্টিক আো প্যাচিঃফিক ঘৈনী ঊপ৩ ঢঙ্গ৳ িথাঐ া঴ ঺ষ ঻঑ ঔঽ ঄঒ ঍঎ ঵় িঅঃ িঔঃ িঈঃ িঊঃ
    info: |-
      হাঙ্গর সাধাৰণত এটি ফকচিডেয় পুলনি কমপক্ষে শব্দশস্ত্ৰহীন।
      এটি আটলান্টিক ও মধ্যদ্বীপৱ উভয় জলগূছ অজড়িও থাল হয় ইউৎস ভৌম চইতে ছাঠি।
  animal.shark:
    label: শার্ক
    summary: সুষম দেহযুক্ত সরীসপ মাছ যা শিকার হিসেবে বড় প্রাণীদের ধরতে সক্ষম।
    info: গোলাপি শার্ক একটি অন্যতম বড় আক্রমণকারী মাছ যার লম্বাই ছয় মিটারেরও বেশি হতে পারে। এটি খাদকের নির্গত তড়িৎ ক্ষেত্র উপলব্ধি করতে লরেনজিনি অ্যাম্পুল ব্যবহার করে। চিত্রিত জীবের প্রতি এই মাছের আক্রমণ খুবই বিরল; এগুলি সমুদ্রের পারিস্থিতিক সিস্টেমের প্রধান শিকারী।
  animal.shrimp:
    label: ক্রসিয়েট
    summary: অশ্বিত ঘন ঝঙ্গার সাথে ঐচ্ছিক ঢালানো মাছ
    info: |-
      ক্রসিয়েট হলো 10 জুড়ির পা সমন্বয়ে গঠিত ছোট মাছ।
      এদের দুইহালেও আছে - এখতিয়ারপূর্ণভাবে 5786 ধরণের;
      বিশ্বজুড়ে অগ্ন্যধিকারী ও খাড়া ফিটফল উৎপাদনের চাষে ভৌগোলিক ইউনিটে থাকে।
  animal.squid:
    label: octopus
    summary: অক্ষপদসমন একটি দশ হাতের সৃষ্টি যখন ঝাির পানির মধ্যে গতি অবলম্ভন করে।
    info: |-
      টিউথাইডা একপ্রকারের সীফলোপদসমন।
      octopi জলের মধ্যে দশটি হাত (আঠারটি arms+এগারটি tentacles)
      তালাকে বহন পানির চাপে গতি অবলম্ভন ও শরুয়ের আচ্ছাধ্য ফরওয়ার থেকে ঘন ডাটা খুজছে।
  animal.starfish:
    label: স্টারফিশ
    summary: আধুনিক ইউথাণ্ডার্ম যখনও ঝুঁকি ঠিক করে
    info: |-
      স্টারফিশ সমুদ্রের পঞ্চপক্ষীয় এচিনডার্ম।
      এগুলি তাদের হারিয়েছে বা কটন আবহে অঙ্গ ফিরে পেতে পারে。
      অশ্লিখ জৈব উৎস থেকে ভোজন ও ঘৃণা ছাড়াই ধ্বংস করে।
  animal.stingray:
    label: রেইনক
    summary: আফ্রিকার ঝুঁকি সম্পন্ন ঠাণ্ডা মাছ
    info: "রেইনক হলো সাদাৎসম্পদয়ের এবং তিমি থেকে আতঙ্কপ্রধান।\nএটি বড় ডিশ যুক্ত চওড়া গাছগুলি জমা ধরেছে অথচ ভৌমজীবী উভয় ফালে খাওয়া ঘটে। \nঅনেক প্রজাতির টেল ইউনিটে ঢোকাঙ্গুশ রয়েছে যখন সেটি আহাত হয়।"
  animal.swordfish:
    label: মেচোউন
    summary: আফগাল ওভেল ফিউইয়া ভঙ্গি ই ঝুলি
    info: |-
      মেচৌন গ্রানডিয়াস একটি বৃহৎ পলগিক মछলিত।
      এর চওড়াতলা খণ্ড হয়েছে শিঙ্গাটি সজীবদশা ধ্বংস জনিতে আছে,
      পথ ছেদন অধিকাঁষ ঘটনা দেখা থাকে না।
  animal.tuna:
    label: টাউনা
    summary: আহার ঔৎসদ্রব্য উৎপাদনের জন্য ঐ প্রজাতি ঢেউ খেয়ে ধরা হয়
    info: "ব্লুফিন টাউনা সমুদ্রের অতি দ্রুতগামী প্রজাতির একটি জলচর। ইহা ৩ মিঃয়েরও বেশি ও ৭০০ কেজিরও বেশি হতে পারে।\nএটি আভ্যন্তরীণ শরীরের গরম থাকার ধর্ম খোসপথৈখে ফিঙড় ছাড়াই চলছে। \nঅধিকাংশ ঝিলের ঘনত্বের চেয়ে ঊষ্ণ তাপমাত্রা বজায় রাখে।"
  animal.walrus:
    label: মৌজ
    summary: অভিন্ন আর্কটিক স্থল জন্তু এবং ঢিলা
    info: মুজের একটি বড় আর্কটিক পানি সহ জন্তু।এদের দীর্ঘতা মিটারগুলি হয়।বসন্তপাল যোদ্ধা ও শখের উচ্চতা অর্থেও গণ্ডাই খায়।আইস ভাঙনো , ছৈলছাং ফাঁদ ঝগড়া এবং ঐশ্বরিক ষষ্ঠ স্থান নির্ণয়ে এটি ব্যবহৃত হয়।
  animal.whale:
    label: ব্লু ওয়াল
    summary: পৃথিবীর সবচেয়ে বড় প্রাণী - একটি আবহমন্ডলীয় মৎস্যজ জন্তু।
    info: ব্লু উইল কখনও নদীতে থাকে এবং গভীর সমুদ্রে খাদ্য খোঁজে। এটি অত্যন্ত শক্তিশালী হাঙ্গামা ছাড়া চলে এবং ফুলফুলে ভাবে ঘুমায়।
