title: Meeresgetier
cards:
  animal.crab:
    label: Hummer
    summary: Zehnfüßiger Krebs mit Panzer und Scherenklauen, der seitlich bewegt.
    info: Ein Hummer ist ein Gliederfußtier aus dem Unterstamm der Kurzschwänge (Brachyura). Er hat einen harten Chitinkorpuspanzer, den er regelmäßig abstoßen muss (Ecdyse), um wachsen zu können. Seine Bewegung erfolgt charakteristisch zur Seite. Die Scheren dienen sowohl der Verteidigung als auch der Beutefangtechnik und Kommunikation. Sie leben sowohl im Meer, als auch in Süßwasser oder auf Land.
  animal.dolphin:
    label: Delphin
    summary: Intelligenter Meeresbewohner, der in Gruppen lebt und aus dem Wasser springt.
    info: Der Delphin ist ein Meeressäuger aus der Familie der Delphine. Er ist bekannt für seine hohe Intelligenz, die Fähigkeit zur Echolokation sowie sein spielerisches Verhalten – Delphine lieben es, über Wellen zu springen und kommunizieren durch Pfeifen und Klicken. Sie leben in Gruppen namens Schwärme und sind nahe Verwandte der Wale.
  animal.jellyfish:
    label: Muschelwurm
    summary: Transparents marines Tier im Glockenform mit giftigen Tentakeln.
    info: Ein Muschelwurm ist ein mariner Lebewesen aus dem Stamm der Nesseltiere ohne Gehirn, Herz oder Knochen – sein Körper besteht zu 95 % aus Wasser. Es bewegt sich durch die pulsierende Bewegung seiner glockenförmigen Form voran. Die Tentakel enthalten stechende Zellen (Nematocyten), die Beute lähmen können. Einige Arten sind fast unsterblich – sie können in einen jugendlichen Zustand zurückkehren.
  animal.octopus:
    label: Kalmare
    summary: Schneckenartiges Tier mit acht Tentakeln, das Farbe und Körperform verändern kann.
    info: Ein Kalmar ist ein geripptes Lebewesen aus der Klasse der Kopffüßer. Es hat drei Herzen, bläuliches Blut und kann die Hautfarbe sowie -textur durch Chromatophore sofort ändern. Es ist sehr intelligent – es kann verschlossene Behälter öffnen und Labyrinthe lösen.
  animal.sea_turtle:
    label: Meeres­schildkröte
    summary: Ein großer Meeresreptilienart, die zum Eiablage an Strände zurückkehrt.
    info: Die grüne Meeresschildkröte ist eine von sieben Schildkrötengattungen im Meer. Weibchen kehren alle zwei bis fünf Jahre zum Strand zurück, an dem sie selbst geschlüpft sind, um ihre Eier abzulegen. Erwachsene Individuen ernähren sich als Pflanzenfresser von Seetang und Algen; Jungtiere hingegen sind Allesfresser.
  animal.seahorse:
    label: Seepferdchen
    summary: Kleine Fischart, die aufrecht schwimmt; der Männchen trägt das Junges.
    info: Das Seepferdchen ist ein Fisch aus der Gattung Hippocampus und bewegt sich im Wasser vertikal mithilfe seiner Rückenflosse. Besonders interessant ist, dass der Männchen die Jungen in einem Beutel trägt – nicht die Weibchen. Mit seinem Schwanz klammert es sich an Meeresalgen fest und wartet darauf, dass seine Beute vorbeizieht.
  animal.shark:
    label: Hai
    summary: Große Raubfischart mit scharfen Zähnen und strömungsgünstigem Körper.
    info: Der Weiße Hai ist die größte raubende Fischart der Welt und erreicht eine Länge von über sechs Metern. Er besitzt die Fähigkeit, durch Lorenzinischen Ampullen das elektrische Feld seiner Beute wahrzunehmen. Obwohl er berüchtigt ist, sind Angriffe auf Menschen äußerst selten; Haie spielen als Schlüsselrauber eine wichtige Rolle im Meeresökosystem.
  animal.whale:
    label: Blauwal
    summary: Das größte Tier der Erde – ein mit Sauerstoff atmender Meeresbewohner.
    info: Der Blauwal ist das größte Tier, das jemals auf der Erde gelebt hat; er erreicht eine Länge von bis zu 30 Metern und ein Gewicht von über 150 Tonnen. Er ernährt sich ausschließlich von winzigen Krebsen namens Krill, die er durch Waleisen filtert. Er produziert die lautesten Geräusche aller Tiere.
