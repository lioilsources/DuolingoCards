lang: fa
pivot: false
title: حیوانات دریایی
cards:
  animal.anglerfish:
    label: موشك طبيعى
    summary: ماهي عميق با منفعت لامپ الکترونیکی روی بال.
    info: '{"info":"ماهی شيطان دريايى(لوفيوس)،در اعماق نورخيز بيشتر از هزار متر زندگى ميكنيم.","samka": "روشنى زيستن باکتريهاى كه به صورت سينبيوز در فرماندهى وجود دارد، بر روى جلوسر آن است و تاكنافتن غذا و مردى را جذب مى‌كرد.\nمردي خيلي كوچك است؛ پس از يافت مايس، به او متصل مى‌شد و بيولوژىكي با وي تركيب مى‌شد.\nروشنایى حاصل از باكتيرى که در داخل قابلمهٔ علفدار وجود دارند.'
  animal.barnacle:
    label: راک سفید
    summary: جوجه کوچکی که دائمی روی سنگ‌ها و بدنه‌های داخلی کشتی‌ها مستقر می‌باشد.
    info: سوسک‌های نورانی از جنس پوسته‌دارها در زیرشاخه سرخالندها هستند؛ آن‌ها با استفاده از مواد غلت کهن به صخره، قسمت‌های فلزی و دلفین‌ها متصل می‌گردند.آن‌ها با ترشح ذرات موجودات شناور روزمره مثل بقوله بر روی بالچه‌های خود حمراه با عضلات بلندتر عمل می‌کنند. لاروها قادر به حرکت درون آب هستند ولی بعد از رسیدن به سن مرحلهٔ جوانگرفتن ثابت می‌ماند.
  animal.beluga_whale:
    label: بلوموا
    summary: سفیدپشت بلوموا، حيواناتي كوتاه بدن، بيضاوي الشكل، با روحانيتي مناسب.
    info: بالموگا، دارای نام علمی Delphinapterus لوسکس است و در اقیانوس‌های قطب شمال زندگی می کنند. جلوتر آن به شکل تخم مرغ بافت هستش که برای پیدافتن غذا از فرآیند الکتروماسونال خود استفاده می کنه. تنها نوع سفیدپشت وجوددار است که قادر به حرکت عضلات چهره اش به طرف مقابل است.
  animal.blue_tang:
    label: کانیس مودری
    summary: ماهل آبی روشن؛ ستاره اصلی فیلم دریافت.
    info: کانیس مودری به نام علمی Paracanthurus Hepatus، کوچک‌ترین پرتوزه دریایی با رنگ آبی روشن و دم زرد از مناطق جزریات فلورا استنداردواسفافیک هستند. فیلم «دریافت» سال ۲۰۱۶ علاقه عمومی برای تولید داخلیش را بالا برد، البته حضانت خاصیت مشخصی دارد. این موجودها قطعات شدّاد مثل چاقو روی لبهٔ ذُخلَتشان داشتن که اسم انجلوسروژِرشون از اینجا بدست میآمد.
  animal.carp_river:
    label: ماهی کاپر رودخانه‌ای
    summary: مارمولک طلائی قهوه‌ای قد بلوند در محیط روزنه‌دار و ماخره.
    info: |-
      کاپر رودخانه‌ای اصلآ در آسیا پدیدار شده و قرن متوسط به اروپا منتقل شد
      مصرف غذای همه جانبه است؛ کف خوردن و تیرگی دادن آب نتیجه فعالیتش است
      نماد مهم عروسی زمستانی چک است، بازارچه سازها حالت زندۀ او رو داخل بشقاب فروش می‌دهند
      در بین انواع مختلف ماهی‌های جهان بالاترین ضدعمل وجود دارد و حداقل صد نوع نژاد برایش مشخص شده
  animal.catfish:
    label: سُومِك
    summary: سبک بزرگی از ماهی‌های آب شیرین با بربل، پوشیده در لابه‌لا مناطق تحتانی.
    info: |-
      سومک بزرگ‌ترین ماهی آب شیرین اروپا است؛ به طول بالای دو متر و وزن فراتر از صد کیلوگرم می‌رسند.
      چشمان خود را با مواد غذایی در پهنه زمین، توسط سنسورها مثل «بربل» تشخیص می‌دهند.
      در قعر جلگی ها و لاکانوس ها زندگی می‌کنند؛ شب نما هستند و شکارچیان حرفه‌ای هستند.
  animal.clam:
    label: خرچنه عظیم
    summary: درخت مرمری بزرگترین خرچنه جهان است که در مناطق حفره‌دار لاستونی موجود است.
    info: خیلی‌ساز بزرگترین خرچنده جهان است که طولش ممکن است از ۱ متر و وزنش بالای ٢٠٠ کیلوگرم باشد. در همزیستی با ریواس فتوسنتتیک داخل پوستشو به نام زُوزوازنِله وجود دارد، بنابراین عمر آن می تواند از صد سال برسد. شایعه‌ای وجود داره که معتقدند ماهیگیرها رو مثل قابلمه می‌بنده ولی این موضوع غلطه؛ وقتی تحت فشار قرار می‌گیره فقط به آرامی بسته میشه.
  animal.clown_triggerfish:
    label: ماکرو
    summary: ماهی چشم‌نوازن با نقاط سفید و دهان نارنجی.
    info: ماکرو الگوی کلاون از خانوادهٔ بالستیدا، ماهی تالش‌دار است با رنگ‌بندی برجسته در میان ماشهای نمکین و دارای فنجان قدرتمند برای شکستن سنگواره ها و سرخرسها. اسم «ماکرو» به علت وجود جلد پوشاننده روی آرنج اول اوست که عمل حفاظتی از آرنجهای بعدی را انجام می‌دهد؛ البته وقتی زمان لقمه انداختن رسید، ممکن است طعنه‌طلب باشد.
  animal.clownfish:
    label: کلاون چشمانه
    summary: ماهی قرمز تیره‌ای است که در جفت‌زنی با مواد غذائی سمی وجود دارد.
    info: |-
      کلاون چشمانه در میانسازها، که دست‌های سمی آن را برای سایر ماهی‌ها مرگبار می‌کند؛ این پوشا به علت لزج بودنش مقاومند
      در همراه زندگی باهم تمیز می‌کنند و شکارچی‌ها رو دور نگه می‌دارند؛ میزان حفاظت می‌دهد
      تمام کلاون‌ها مثل مردان متولد میشن؛ غالب دقیق میتونه خواهرشو بشمار
  animal.crab:
    label: گریب
    summary: جاندار بدن فولادی داشتن و دستان قدرتمند، حرکات عموماً جانبی.
    info: گریب جانورهای زیر رده‌برخِوروها است. بدنش از کُرونَپرش، پوست سخت و شفاف تشکیل میشود که به طور منظم تخلّی نمودن آن برای رشد ضروری است. حرکت خاص جانبی دارد. لازارتو ها در مقابله با عدوان، صید غذا و انتقال پیام نقش مهمی ایفا مینمایند.
  animal.dolphin:
    label: دلفین
    summary: ذات ذهن مرغوبى كه درياى حيوانات است و بصورت چاهى زندگى كردنشان.
    info: دلفین، سگماهی از خانوادۀ دلفین‌سان است که به هوش بالا و توانایی لокالسازی صوتی معروف شده است؛ آنها با رفتار مirthful مشهورند مثل پریدن روی دريائى ها و انتقال نقل قول فضاسنجى كمك مىكنند. دلفين ها جمعت زدن تحت عنوان «چاه» و بستريابى نزديکى برای والوس وجود دارد.
  animal.dugong:
    label: دوغون
    summary: سالندهٔ آروم دریایی اهل اقیانوشِ هند و آرام، پدرمنشی بر ماچینتو.
    info: دوقونگ، ساکن دریای هند و اقیانوس آرام است که با مناتو رابطه نزدیک دارد؛ غذش فقط علف‌های دریاست. به عنوان الهام بخش ممکنه «خواهران دریائی» شناخته میشه؛ خلبادها بعضی وقتاً او رو به طور اشتباه به موجودات زیرآب تشبّه میداشتند.
  animal.eel:
    label: مارماهی / mourene
    summary: موتور ماخواه مشابه مرغوب که در شقوق سنگ قارچ حرکت می کند.
    info: "مورانه ماهی دریایی بزرگ از خانوادهٔ muranid با حلق‌های دندان است که به جستجوی غذا، داخل شکاف ها و ترشه های سنگ قارچ رفته است. \nduos فضله سرش بر روی زمین نشان دهنده وجود آنهاست؛ علاوه بر دندانهای لثه اصلی، مویرنه دندانهای faringeal دارد که به او کمک می‌کند تا طعمه را به صورت عمودی بلع کند. \nmourane به طور فعال حملات ندارد؛ تنفس ضربه زدن به منجر به مجروحیت می شود."
  animal.flying_fish:
    label: فلایینگ فلاوند
    summary: ماهی تراپیکی فوق العاده‌ای که روی سطح اقیانوس با بالتره غلط حرکت می‌نماید
    info: |-
      فلاوند فلایینگ (خانواده اکسوسئتیدا) ماهی است тропіческое که قادر به پرتاب شدن از آب و سپارش در هواست
      بال‌مانند بالتره غلت دارد؛ ممکن است تا ۲٠٠ متر بتواند پرواز کند و حداکثر به عرض ١،٢ متر نائل شود
      به این طریق از موشکافران مثل ماچوقالها، مارتینها و خورشدماهیها دور باقی می‌ماند
      بارباڈوس «زمین فلاوندهای پرنده» معروف است؛ флайинг ریسه جزو غذائے ملّی و فرهنگ مردم است
  animal.frogfish:
    label: انتناریوس
    summary: در حال حمله به صورت مستقیم با منفعت بر روی سنگ مرمر.
    info: انتناریوس، ماهی دریایی کوچکی از خانواده آنتناراتیدا است با توان بالای پوشش دهنده و بهترین رمزگذار بر روی زمین لابراتوارهاست. اندازه‌اش مثل فوت نرم بوده و همانطور که قدمت شما حرکت می‌کند. سررشتهٔ عمومی او شامل جاذب غذا (لائسیوم) برای جلب طعمه است.
  animal.giant_squid:
    label: خیلی‌الحوص
    summary: بزرگترین موجود غیراستخواندار جهان که در اعماق اقیانوس زندگی می‌کند.
    info: "خیلی‌الحوضهای بزرگ (Architeuthis dux)، بدونفقرات عظیم جهان هستند که طولشان میتواند به بالا از سیزده متر برود. \nچشم‌های آنها در دنیای حیوانات نسبت به تاریکی مناطق عمیق تناسب پیدا کرده است و قطر حداقل ۲۵ سانتی‌مترو فراتر را دارد\nدر زیر لایه‌های شصتصدم تا یکهزار متر، خوراک اصلی قزلآلєس هستند.\nتا قبل از سال ٢٠٠٤ تصویر مستقل زنده خیلی‌الحوپه روی کف اقیانوس ثبت نشد."
  animal.hammerhead_shark:
    label: ماکرو لئورینزی
    summary: ماکرو لئورینزی نوعی زلفدار است که پهنۀ بالایی مثل حرف «T» دارد.
    info: "ماکرو لئورینزی در خانواده اسپیرنیدا، ماهی‌خزن با سر برجسته و فرم ت شکل است. \nsr روزنه های الکتریکی آمبل لوفرتزو بر روی سرش قرار دارند که به تشخيص غذاها نظير ماهي، موشکره و جلبك كمك مىكند."
  animal.horseshoe_crab:
    label: پُدرَچ
    summary: عضو خارکفتهٔ قدیمی انسان زده ۴۵۰ میلیون سال قبل.
    info: "خانواده‌ای به نام لیمولوس پلئوفِمس، حدود ۴۵۰ میلیون سال است که بدون تغییرات جدی از دوران فریدوم وجود دارد و عضو خارکفتهٔ قدیمی است. \nاین موجود با حشرات درختی رابطه قرابتی مستقیم ندارد بلکه بیشتر شباهت به عنکبوت‌ها دارد. \nخون آبی او شامل مواد منحصر به فرد مثل «کواگولوز» است که برای تست ها و واکسیناسیون مهم استفاده می شود."
  animal.jellyfish:
    label: مَجُسْ
    summary: جاندار مشابه زنجیرچین دریائی با لامسه‌های سمی.
    info: مگوستا، جانور دریایی از ردهٔ مژگن‌ها بدون مغز و قلب است که بدن آبی تقریباً به طول دوازده سانتی‌متر با فرم زونک نمونه دارد؛ پروتئوزوم همانند حشرات شناور بر روی صفحهٔ آب حرکت می‌نماید.
  animal.lionfish:
    label: کروتوباس
    summary: ماهی سم‌دار حوضه گرم‌آبی با پرهای بلند و الگوهای خطوط.
    info: کروتوپاس کریدنی، ماهی دریایی سم‌دار از خانواده ساکراوندا با نوارهای قرمز و سفید واضح و تارسم دارد؛ سم آن بسیار دردناک است ولی به روش مشابه زندگی جانوران محلی فراموش شده است. همچنین در مناطق غیرطبیعی مثل مدیترانه و کربائی وجودش ضربات سنگینی بر انواع طبیعی ماهیها وافرشته است.
  animal.lobster:
    label: همر
    summary: جانور دریایی بزرگ با لاغرها؛ وقتی پخته میشود قرمز ولی قبل از پخت منطقه مردمدرقست.
    info: همر اطلسی، جانور دریایی بزرگ و متعلق به خانواده نفروپیدا است که طولش بالاتر از شصت سانتی‌متر می‌رسد. زمانیکه تازه باشد رنگ آبی روشن دارد؛ فقط پس از غذاپوشی قرمزرنگ می‌شود. عمر او حتی میتواند فراتر از پنجاه سال برسد.
  animal.manatee:
    label: دوقون
    summary: جاندار دریایی کُند حرکت که «دریافت» نام دارد.
    info: کاپوستنیانک (مناتِ نام دارد)، جانور دریایی بزرگ و مخصوص به خود است که فقط از علف‌های دریایی تغذیه می‌شود، زندگی آب سرد روزمره این موجود شامل مناطق حاشیه‌ای با فصل گرما مثل بندهای شالواری، پهنۀ بالادم‌ها و قسمت های مختلف در کارائیب، فلاوریدا و آفریقا است.
  animal.manta_ray:
    label: راي ماينتا
    summary: ماهي سطحي عظيم كه ذوبندان را از طريق غربالگري درياچه اي فلاتوي.
    info: مانتا اقیانوسی بزرگترین نوع رایه‌ها با پهنای بال به اندازهٔ هفت متر و وزن فراتر از دو تن است، که در حالت شناور با تُلّۀ باز ذره‌بندان را از طریق صفحات زباله‌خوارش جذب می‌کند؛ ندارد لازارتوس خطرناک برای انسان و قراردادن آن در ردیف هوشمندانه‌ترین ماهی‌ها منطقی است.
  animal.mussel:
    label: سلوا
    summary: ملخ تاریک روی صخره هاست.
    info: سلاوکا غذایی ملخ است که در مناطق بالانچ و پائین‌آور اطلس واقع شده است، به صخره با سوزن‌های محکم متصل می‌شود. آب را فیلتر می‌کند و نمونه‌گیری برای آلودگی اقیانوسهاست؛ سموم و عناصر سنگین را جمع‌آوری می‌نماید.
  animal.narwhal:
    label: ناوارвал
    summary: سفيدماهي اركتيكيكه دندان حلزوني شباهت زيادي به موجود تخيلية يكروحي دارد.
    info: |-
      ناروال، سفیدماهی کوچک ارقطیق است با طول تا پنج متر و دندان خم به شکل حلزون که در حقیقت فراموش راستشده‌اید
      طول آن دندان میتواند ببین هفتادسانتیمتربرسد؛ زنان ندارند
      در جمع در اقيانوس قطب شمال زندگي مى كنىم
      در دوران وسطاييمين اعتقاد بر اين وجودداشت كه دندانهاى نارواال مثل موشكىت يكرويهٔ حيوان想像ى واحدورخى با ويژگىهای معجزهآميز لطفى.
  animal.nautilus:
    label: ناوتلس
    summary: جانور قدیمی با پوستهٔ لولاوار که از زمان موجودات خزنده زنده ماند.
    info: |-
      ناتلیوس جانور اوله‌گو با پوشش مارپیچ است که تقریباً بدون هرگونه تغییر، در طی حدود ۴۰۰ میلیون سال زندگی کرده است؛ پوسته آن به قسمت‌ها تقسیم شده و ناتلیوس فشار را با بخشهای هوادهنده تنظیم میکند
      در مقابل دیگر حیوانات بالافروزدار، عدسی مناسب برای چشم نداشته بلکه فقط شامل دوربین سوراخ صفحه‌است
  animal.octopus:
    label: چوبوتنيتسه
    summary: ماهیگو با هشتمام جفت پهن قادر به تعويض نمادين و صورت.
    info: '{"hint":"کرم غریب‌الذيل هشت دسته","info":"خاوئینس ماهیان فاقد استخوان از رده حشرات سرشاخ با سه قلب، خون آسمانی و توانایی در عوض کردنه زودن بارورت به شمار میرفته.","label":"چوبوتنيتسه","summary":"ماهیگو با هشتمام جفت پهن قادر به تعويض نمادين و صورت."}'
  animal.orca:
    label: کوساتکا
    summary: پرنده قدرتمند، بالشتراخ با وجود بلندترین دلفین.
    info: کوساتکا درواژه از بزرگترین نماد فامیل دلفین‌ها و یکی از هوشمند ترین موجودات جهان است. آن ها به صورت مختصات شده در گروه های کوچک(سربازها) شکار می کند؛ هر سرباز روش منحصر به خود برای شکار دارد.
  animal.oyster:
    label: غرق
    summary: ملحّث فلاتر کنندة آب؛ منبع تشکیل الماس و غذای لوکس.
    info: |-
      گوشت‌های مرجانی فلتر کنندۀ آب هستند؛ به عنوان نمونه، یک غرقدار قادر است تا دوصد لیتر روزانه از آب را پالایش کند.
      برخی انواع در صورت تماس با جسم خارجی روی زغال ساخته شده و قطعات براق مثل الماس را تولید می‌نمائند.
      غذاهای طبخ نشده شامل غردوارها معروف به محصولات لوکس محسوب می‌شوند؛ عادتاً در ماہ‌های حاوی حرف «R» برداشت می‌شود.
  animal.piranha:
    label: pirenya
    summary: جوجه مرغ با بالهای طولانی.
    info: پیرانا قرمزبینی، ماهی شکارچه ای است که در رودخانه‌ای آمازون با دندان ها و مثلثی تیز زنده می کند. شهرت او به عنوان پوشه خطرناک بسیار غلوگرانه است؛ فقط نادر حمله به فرد سالمی که در حال عبور است می کند. اغلب جمعیتی از آنها برای صید تشکیل میشود؛ بوی قدرتش قادر به رد کردن مواد لخت از فواصل دور است.
  animal.puffer_fish:
    label: ماهی فوقو
    summary: ماهی بالگرد شده؛ ماشوف برخوردار از عطر غذائی و سم.
    info: فوقو مجموعه‌ای از ماهی‌ها در خانواده تترودونتیدا هستند که قادر به پمپول زدن بدن با آب و هواساختن توسعه دارند. حاوی تترودوتوکسین، یکی از قدرتمندترین سموم طبیعی است؛ بافت печه و جنس نرمال فاتال هستند.
  animal.salmon:
    label: سارما
    summary: مارمولك بزرگى كه از دريا به نهرها براى زادآورى مى‌رسd.
    info: |-
      سرما، ماهیان تراکم‌خور هستند؛ در اقیانوس بزرگ شده و برای زادآوری به رودهای خونروشان خود پس از صد کیلومتر بازمی‌گردند.
      وقتی سرما بالا می‌رفte، رنگ آبی فلزی خود را به قرمز روشن عوض می‌کnd.
      pسال بعداز زادآوری، بخش عمدهٔ انواع استواىِ سرماس دچار مرگ طبعى مى‌شوند؛ جسد آنان فساد مي‌پذیرد و مواد غذاىى به سيستم حياطى جنگلى منتقل مى‌شود.
      mغنى از اسيدهاى چرب Omega-3.
  animal.sea_anemone:
    label: سزاونک دریایی
    summary: جانور دریائی شبیه گله با لاستیک های سمی، در مناطق رسوبی.
    info: |-
      {"info":"سازنک دریایی جانور زهره‌دار از خانواده سفتارها است که به صورت بلوغ شباهت دارد و روی سنگ ها متصل می شود.
      چرخند آن حاوی سلول های سمی (نتاموسست) برای فلج قربانیانش است.
      در رابطه با نماتار، الگوزدنهای عروسکی، پلانکتون ها و موشهای تمیزکننده زندگی می کند.
      mمقدار عمر بالاتر از ۱۰۰ سال داشته و تقریباً غیرقابل مردن (همراه با طبیعت قدیمی نمی میرد).").
  animal.sea_cucumber:
    label: سُومِش
    summary: جاندار دریائی لولاوار که ذرات آلی موجود بر روی کف دریا را جمعآوری میکند.
    info: |-
      سومیش‌ها جانورهای دریائی از رده هولوتوروئیدا متعلق به تارگم زنده روی کف اقیانوس استند.
      آنها رسوب را فیلتر و با مواد آلی دفع شدۀ خود غذاء میکنند.
      در صورت آزار، معدهٔ خود یا سطح مرطوب داخل بدن را پرتاب میکنند ولی بعد از مدتی انحطاط نخواهد کرد.
      در آسیا به عنوان طعمهٔ قابل توجهی (تراپانج)، ارزشمند هستند و عضو مهم غذاهای محلی چینی هاست.
  animal.sea_lion:
    label: لختان
    summary: تلنگان با بالکس بلند که میتواند روی بالکسهایش بپرد.
    info: |-
      لختان کالیفورنیایی مهم‌ترین نماد از خانواده تلنگان ها با دندان است( Otariidae ).
      در مقابل ماهی سفیدها، لختان فضول و در عوض قطع شدن به صورت طبیعی قادر به پردازنده رفتار بر روی چهار عدد بالکس است.
      خودش بسیار هوشمند؛ در زمینه جذاب آموزش حرفه‌ای مثل حرکات پیچیده یاد می‌گیرد.
  animal.sea_otter:
    label: آب سگ دریائی
    summary: آب سگ دریاء روی پهلو می‌ماند و از سنگ برای شکستن قطعات استفاده می‌کند.
    info: "{\"label\":\"آب‌سگ دریایی\",\"summary\":\"آب‌سگ دریا روی پهلو می‌ماند و از سنگ برای شکستن قطعات استفاده می‌کند.\",\"info\":\"آب سگ دریائی، جانور آبزی شمال آمریکاست که فشرده ترین موها را دارد(۸۰۰ هزار خارچه به اندازه سانتیمتر مربع). \nاز سنگ به عنوان نمونه ابزار برای شکستن زغال عسل و لوبستر استفاده می کند.\nدر حال غروب با بدنش بالا می آید؛ با دوام دستانش متصل می شود تا جابجا نشوند.\nتقریباً تمام وجودش برای بدنه حذف شده است؛ برنامه های محافظتی منجر به بازنواختن جمعیت شد."
  animal.sea_slug:
    label: ملح زبر
    summary: پرنقطه مرغوب فاقد پوست در محیط دریایی.
    info: نهازابریان (نو دی برنشِه) ملخ‌های دریائی بدون پوست کرم نمک هستند که روی صخره‌های قارچ ساکتند. آن‌ها از رنگ‌بافته شدید به عنوان تهدید علائم سمی استفاده می‌کنند؛ بعضی اوقات جسم خودشان با غذا، مثل قارچ‌سرا، مواد سمی جذب و ذخیره می‌نمایند. بیشتر از ۳هزار نوع مختلف وجود دارد.
  animal.sea_turtle:
    label: کوزه دریائی
    summary: جاندار ماکروبدریایی که برای انداختن تخم به شامه بازنمود.
    info: کوسه دریایی سبز جانوراتو از هفت دسته کوسه‌ها است، مادگان آن به طول دورهٔ پنج تا دوازدهما فصل بر روی شامه بازنمودن خاسته و نرمش زدن بچه رفته. بالغینشون فقط غذاقندرو علف دریائی و الگاس؛ ولی قلابتاشون حشرخوارند.
  animal.sea_urchin:
    label: جست
    summary: استنوسر شباهتي بيضوي روشن ديروازه اي است.
    info: سگوکا، جانور دریایی از خانوادهٔ استنُرها و زیرخانوادهٔ هچینودئیدا محسوب می‌شود که با سوزن‌های حرکت دار پوشیده شده است. بخش‌های فرعی به نام «پدِسلَرا» وجود دارد که برای تمیز کردن و صید آبزي مناسبند. غذاء اصلی اين موجودات شامل ريزالگي، قارچ و موادي كه تجزيه يافته است.
  animal.seahorse:
    label: اسب دریایی
    summary: ماهی سبزی کوچک؛ نر ماشومان را حامل می‌باشد.
    info: ماهی اسب دریایی، ماهی‌ای است که با دم خود به علف‌های دریایی پیچیده و منتظر قربانی می‌ماند. جالب توجه آنکه نرها باردار شده و زادگان را حمل می‌کند.
  animal.seal:
    label: تولون
    summary: موارض غذائی بر روی سنگها رفتن و تلاش برای صيد مايسي در دريا.
    info: |-
      نگین‌ماهی سادک عمومی از خانواده فوسیدا، ماهی دریایی با بدن هواپیماساز بدون پرچمه است که روی خطوط آتلانتیس واقع شده است
      در جلوگیری از آلودگی و قلقل به وجود میآورند.
  animal.shark:
    label: ماکرو
    summary: ماهی شوال بزرگ با دندان‌های تیز و بدنهٔ هیدرواژ.
    info: ماکرو لیل سفید بزرگترین ماهی شوال در جهان است و طولش از شش متر نماید. دارای توانایی تشخیص الکترون‌ها با کاوش زنجیره Lorenzinio هستند، به منظور تعقیب غذاء خود. حملات آنان بر روی انسان بسیار نادر است؛ ولی نقش مهمی در فرآیندهای پوچت محصولات درون اکوسистем اقیانوس را ایفا می‌نمائند.
  animal.shrimp:
    label: گرب
    summary: حشرة دریایی کوچک، معروفترین محصول دریایی جهان.
    info: گریل‌ها حشرات دریایی کوچک با ده جفت پا هستند و بیش از ۲هزار نژاد وجود دارد؛ آن‌ها به عنوان محبوب ترین منابع غذائی دریایی بعد از سبزپوشان شناخته می‌شوند، نقش مهمی در زنجیرۀ غذایی اقیانوس را داشته و برخی از انواع آن عامل فعالترین شبکه غذایی است.
  animal.squid:
    label: سَݢِنِ
    summary: ماهيگناوي ديسيم ريتماني كه از طريق فشردن آبي حركث ميكني.
    info: سگانه‌ها ماهیگوناد با دهم رام به شمار میروند که هشت پا و دو لاغر برای جستن در آب دارند، این حيوانات توسط فشار سطح آب حرکت ميكند و قادر است رنگ خودش رو عوض كنه. بزرگترین نوع سگانه (Arachiteuthis)، طولش بالاي سيزده متري ست و بيچينه ترين موجود بدون نخاعي جهان نيست.
  animal.starfish:
    label: ستاره دریایی
    summary: جاندار دریائی پنج دمند با ظرفیت رگناوراسیون.
    info: |-
      ستاره دریایی از جانوران پوچ‌پوش با دم ها، معمولاً شامل پنج دم است و قادر به رگنرره کامل ناحیه زخم شده خود یا ساخت بدن تازه از قطعات جداشده آنها میباشد
      آنها غذاء بر روی حلزونها فعالند که علائم انحنادار آنها را با استفاده از لوازم متصل به بدنشان بازکنند.
  animal.stingray:
    label: رينوك
    summary: مارموسيتي با سرخرطعم سم‌دار؛ روياي ذرات رسوبى.
    info: "{\"hint\":\"نوروز با سرخک تیز و مسموم در دم خود\",\"info\":\"راينوك شباهت زيادى به اسماك ها نسبتاً دارد، ولی بدن آن كاملاً فلزي شكل است كه جانش بر روى زمين قرار گرفته است .\nبرخي انواع ريچي يافتن غذا را تسهيل ميكنند\nدر حركات مثل پرواز بالهاي صدري روي حرارت ديده ميشوند \n بعضي انواع الكتريكال هستند و قادر به ضربه الكترิกى عالي نيستند."
  animal.swordfish:
    label: ماچه‌ون
    summary: ماچه‌ون نوعی ماهی شوالر با منقار طولانی شبیه چاقوست.
    info: ماچه‌ون بزرگ، ماهی پلاژلک در اقیانوس های استوائی و نواحی زیراستوائی است که دندان بلنده با سطح تختش به عنوان ماچ قراردارد. این ماچ برای ضربه زدن به غذای خود مثل ماهیها و جوجه آب استفاده شده و نمیتواند فرو رفتن مواد غذایی را تسهیل کند.
  animal.tuna:
    label: ماکروالان
    summary: ماکروالان نوعی ماکروبند است که به عنوان غذای عمده درصنعت موادغذائی انبوهی شناخته می‌شود.
    info: ماکروالان مارینوس بزرگترین نهنگ است که طولش از سه متر و وزنش بالای هفت‌صد کیلوگرم می‌رسد، دمای بدنس را با حفظ تودۀ عضلانی به صورت خونسرخ در مقابل آب پیرامونش حفظ می‌نماید؛ جزو سرعتمندان فراوان دریاست و قادر به رسیدن به سرعت بالاتر از شصت و هشت کیلومتر بر ساعت است.
  animal.walrus:
    label: نایب
    summary: نوعی ذوات نفس بزرگ با دندان‌های عظیم و موافقت عمومی.
    info: نایب، پینیپد بزرگ اقیانوس شمال با دندون‌های بلند و غول‌آسا که ممکن است طولشان به بالاتر از ۱ متر نائل شود را تشخیص می‌دهید. این فرد در تابستان بر روی صفحات لاستوچه جمع می‌شود و همزمان با ساختارهای خاص مثل حلقه‌ها، زغال سنگ و آتش‌سوزی، مناطق مختلفی را تحت عنوان «منطقۀ» قرار می‌دهد.
  animal.whale:
    label: بازوانه
    summary: بزرگ‌ترین موجود بر روی زمین - پستاندار دریایی که هوادهن
    info: بازوانه آبل از بزرگ‌ترین حیات وحش است که همچنای زندگان در سطح زمین؛ ممکن به طولِ تا ۳۰ متر و وزنهٔ بالای ۱۵۰ تن میرسد. با غذا خوردن صدف جونداران روزمره، مثل «رَخ» داروئیده شده، نجوم فلتر می‌کند.
