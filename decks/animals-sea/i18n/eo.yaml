pivot: false
title: Maraj bestoj
cards:
  animal.anglerfish:
    label: marĉefo
    summary: Profunda marbestio per luminanta kapvenko.
    info: Marĉefo (Lophius) vivas en profundaj oceanaj regionoj pli ol mil metroj sub la surfaco. La femalo havas lumigantan venkon sur sia frunto por alvoki manĝon kaj masklojn. Maskulo estas tre malgranda; post trovi unu feminison li atakas kaj fuzias kun ŝi biologie.
  animal.barnacle:
    label: balaneo
    summary: Petrofiksa krustoanimalo kun specifa formo.
    info: Balanoidea estas aderintaj krustacoj el la subordo Cirripedia kiuj atachxiĝas al rokoj kaj ŝipojn per cimenta sekreto. Ili manĝas planctonfiltrante ĉe iliaj nuksoj eksteren de sia konuloformo. Iliaj larvoj flatusamas; post tio ili fiksas sin por plenumi sian tutan vivon.
  animal.beluga_whale:
    label: balena beloga
    summary: Blanka arktoprovenanta baleno havante ronda kapo.
    info: Balena beluga (delphinoptero leucas) estas mallonga blanka baleno de arkta maro kun distingiva sferoida frunto uzata por eĥlokado. Ĝi povas movigi la kolon flanken al flanko kaj esprimis diversspecajn sonojn per kiuj komunikiĝas.
  animal.blue_tang:
    label: surĝefiska
    summary: Blua rubelefiŝo el serĉanta Niomon.
    info: Surgeofisko helblua (Paracanthurus hepatus) estas mara fisketo kun klare blua koloro kaj flava pinto de la vango el la rubinakoralaĵoj en Indio-Pacifico. Ĝi estis popularigita per "Serĉante Niemon" (Dory's Adventure - nekonataj tradukitaj titoloj). Tamen tia fiŝo bezonas multe da atentado dum tenko domenikeco. Surĝas akra skalo sur radiko de sia vango por protektadon si mem.
  animal.carp_river:
    label: Ripacapo
    summary: Granda oranĝbruna internacia akva specio loĝanta fluvegojn kaj akvarumoj.
    info: La kapro originas el Azio kaj estis enkondukita al Eŭropo dum la mezepoko. Ĝi estas omnovo kaj forŝoveladas sedimentojn de fundamento por serĉadi manĝon, per tio ebligante malpurigi akvon. En Ĉeĥujo temas pri simbolo de natala festado – vivantaj ekzemplerojn vendacas sur merkatplacoj.
  animal.catfish:
    label: walse
    summary: Granda interna fisko kun vangoj kaŝita apud fundamento.
    info: Welse granda estas la plej grava akvo interne de Eŭropo; atingas longon pli ol du metrojn kaj pezon super cent kilogramojn. Karaktarizaj vangoj funkcias kiel nazo kaj taktilorganoj por trovi manĝon en malklara akuakolo. Ili vivadas proksime al riverobendoj kaj lagunoj dum nokto.
  animal.clam:
    label: tridadakta
    summary: La plej granda bivalva moluso loĝantas tropan rifujo.
    info: Giganta tridakto (giant clam Tridacna gigas) estas la plej granda moluso en du kaskelojn dividita el tiu grupo atingante longon super unu metro kaj pezon supren al 200 kilogramoj. Ĝi vivas kun simbiozo de fot sintezantaj algiloj (zooxanthella) internen per sia muskolo. La specio povas establiĝi dum plurcentjaro.
  animal.clown_triggerfish:
    label: clownfish
    summary: Tropika peĉofervo kun distingebaj blankaj makuleroj kaj naranĝ-kolorigitaj labroj.
    info: Klaunkloakisto estas granda varmaĵora marangulo el la familio de balistikoj kun unu el plej eksterordinaraj ĉevaladoj inter malvarmaj akvopeco.Ĝi havas fortajn dentojn por krushi duran rokon kaj muselojn.Nomo klauko derivis pro ties pirmastro, kiun funkcias kiel sekurilo (klavo) blokiecante duan.
  animal.clownfish:
    label: clownfish
    summary: Orange colored marine creature coexisting together within toxic environment provided through relationship established between itself alongwith some specific type(s) Of Sea Anenomes.
    info: An orange clownfish lives among venomous tentacles of sea anemonies that would kill other fishes due to its protective mucosa layer. In mutualism it cleans them up while repelling predators whereas they provide shelter for him back again.
  animal.crab:
    label: krabo
    summary: Dekmankega korisio kun panĉiero kaj mankoj, fluantanta en laterala direkcio.
    info: Krabo estas korisio el la subordo de brakjuridoj. Ĝi havas dikan kitinpancirion kiun regule forigas per ekdiso por povadi grandiĝi. Krabi moviĝas karakterize al flankoj.
  animal.dolphin:
    label: delphino
    summary: Inteligenta akvamano vivanta en grupoj kaj saltega ekster la akvo.
    info: Delphino estas maro mamifo el la familio de delphinidoj. Ĝi havas altan intelekton kaj uzas eĥlokon por navigado; ankaŭ konata pro ludema konduto inkludanta saltadon super varmojn ligitaj al naviro.
  animal.dugong:
    label: duĝonto
    summary: Trankviligita herbonmanĝo el Indo-Pacifica regiono kun ties rilateco al la manato.
    info: La dongo estas mara mamiferulo rilatanta al la manato vivantaj en la India Okeano kaj Pacifiko. Ĝi ekzklude viveblas de mariherboj. Estas verŝajne inspiro por nocio pri 'marino'; ŝipokazistoj misidentis ilin pro siajn apartan ecojn.
  animal.eel:
    label: morao/hadriko
    summary: Longa serpoformita fiŝo moviĝanteco tra spacoj sub karbonataĵaro.
    info: Morao estas granda marbato el la familio de murenoj kaŝanta sin en fendojn inter rilatofaloj. Ĝi havas du parojon da manĝiloj – eksteran mordilon por preni prizonulojn kaj internan faringealan parton helpante al ili atingi siajn gutojn per sango-suga ago. Morao ne agresie batalas sed nur defensivite reagas kontraŭ estontoj kiuj minacas.
  animal.flying_fish:
    label: volanta finkapo
    summary: Volantaj finkapoj uzantas sian spicforman korpon por rapidi super la surfaco.
    info: Flyingfisho (Familio Exocoetidoj estas tropika fiŝo kapabla saltadi el akvo kaj fluigi per la aero. Ekspluigitaj brustpintiloj funkcias kiel flugilas; tiel ĝi povas voliĝi supren al ducent metrojn kaj atingi altecon de dudek centimetroj. Tio helpas eviti predatorojn kiun inkluzivas tunojnojn, maarinon, kaj delfinoj.
  animal.frogfish:
    label: ripostilo
    summary: Kamuflagita atakisto en karbonatklifaro, prokuranta predo.
    info: |-
      Ripostilo (Antennarius) estas mara fisko el la familio de Antennariidae kun mastruma kaŭĉiofareco
      Ĝi havas brustpintoj formitaj kiel piedetoj per kiuj ĝi paspas sur fundon.
      Sur unua dorsplato trovas sin movema venenfingo uzata por alproksimi viktimojn.
  animal.giant_squid:
    label: gigantiĉa kalma
    summary: La plej grandsenhomo vivado sub marprofunde.
    info: Gigantaj kalmaroj (Architeutius dux) estas la plej grandaj senhomaĵo en tiu mondo kiu atingas plenumon de super 13 metrojn. Ili havas la plej grandan okulo inter animaloj reĝimo (diametro trans duone kvin centimetroj), adaptita al malvarmecon profundeco. Vivante je profundo ĉirkaŭ tricent ĝis milmetro kaj estanta prungrando por sardino.
  animal.hammerhead_shark:
    label: hamerhavo
    summary: Sharks having distinctively wide flattened hammer-like heads.
    info: Hammerhead shark is species of sharks characterized by their uniquely broad flat heads shaped like an 'T' called cephalofoil. The widened shape allows for better prey detection using electroreceptors known as ampullae of Lorenzi and improved maneuverability. They live in tropical oceans where they hunt fish rays squid.
  animal.horseshoe_crab:
    label: kevapiĝilo
    summary: Malnovtempa membro-artopoda vivanta sen grandaj ŝanĝoj dum 450 miliardoj.
    info: "Kevapiĝilo (limulo polifemo) estas ĉirkaŭ 450 miliardo da jarojn malnova artropodo, kiun ekzistado ne ŝanĝiĝis gravas de la plej frua epoko. \nĜin rilatas al taranoj anstataŭ reale kun skorpionsoj;\nLa verda sango enhavas unusigan substanco uzatan por provizi pri sekureco en medikaĵoj kaj varioj."
  animal.jellyfish:
    label: meduzo
    summary: Transparenta marbesteco en formo da ŝalto kun toksiĉapelo.
    info: La meduzo estas mara bestego el la tipo Cnidaria sen cerbo, koro nek ostoj - ĝia korpo konsistas el proksimume 95% akvao.Ĝi movas sin per pulsado de sia ŝaltilformaj korpopartoj.Liniaj kapiloj enhavas venenajn celduktojn kiun povigas paraliziĝigi pridoktato.
  animal.lionfish:
    label: lionfischo
    summary: Venena troika mara kun dramaturgaj spinuloj kaj stripitaj bariloj.
    info: Red lionfish is an venomous marine fish belonging to family Scorpaenidae that has striking red-and-white stripes along its body together with poisonous dorsal fins which cause severe pain upon contact but rarely lead life-threatening situations due low toxicity levels despite their potency being enough for causing intense discomfort when touched by humans accidentally while swimming near them especially during night time because they tend hide under rocks where visibility might be limited making accidental encounters more likely than intentional ones however there aren't any natural predators outside original habitat so populations can grow unchecked leading invasive species problems particularly Caribbean Sea & Mediterranean region threatening local biodiversity through competition over resources like food sources etc.
  animal.lobster:
    label: homo
    summary: Granda mar-korizo kun klavoj; baze verda-blaua per viveco kiu iros roze dum varmo.
    info: Atlantis homo estas granda maro karnedo el la familio de Nephridoj atinganta longeco pli ol 60 centimetrojn. Ĝi havas mallumadec blua-verdan koloron dum vivado sed fariĝas ruza nur post kuiriĝo pro kemio en ties skalo.Ĝia mezo povas esti super kvindek jaroj.
  animal.manatee:
    label: Dungongo/manate
    summary: Malrapidaj gentilaj marherbopastoro nomitaj 'marbovo'.
    info: Manatenoj estas grandaj maraj mamuloj kiuj vivas en varmaj akvokonservoj ĉefe manĝante subakvaran herbon. Ili loziĝas pro kolizio kun motorsampano kaj multaj havas skurĉojn de elvolujoj sur la korpo. Manatenoj moviĝas tre malrapide – inter tri al kvin kilometroj horimpeire - kaj spiras ĝis trionminuton.
  animal.manta_ray:
    label: manta
    summary: Granda eleganca reydo filtri-plankton apud surfaco.
    info: La Manta oceanida estas la plej granda specio de reynoj kun atingo ĝis olĝo da 7 metrojn kaj pezo super 2 000 kilogramojn. Filtrante plancton per branĥiaj tabuloj dum nado kun malfermita buko. Ne havas venena spineto; temas pri kompletnemente senperega besto por homo. Konsiderata unu el inteligentejo ripoŝantaj en akvo;
  animal.mussel:
    label: Musselo
    summary: Dark-colored shellfish that clusters together among coastal rock areas.
    info: Edible mussel is an edible mollusk living along coasts around Atlantic Ocean and Pacific Ocean. It attaches itself to stones using strong threads called byssal fibers. These mussels filter water so they serve like indicators for ocean pollution because accumulate toxins including heavy metals.
  animal.narwhal:
    label: narvo
    summary: Arkto-baleno kun spirala horio similanta al unu-horna besto el fabulo.
    info: La Narvo estas mallonga arkta baleno kun karakteriza spira dento kiu fakte temas pri supergrandigita maldekstra incisoro. La dentoj povas esti plenlongeco de ĝis tri metroj por la maskloj dum virino ne havas tiun strukturon. Ili vivadas en grupojn sur norda marbordo.
  animal.nautilus:
    label: nautilo
    summary: Primaŭra marbestio vivanta ekde dinosaŭraj tempoj en spira formata ŝelo.
    info: Paukoformaj karnoj havas spiraligitan ŝelon kun ĉambriĝinta interna strukturo por regadi levadon per gasplenado en la ĉamberspacoj. Kontraste al plej multaj malfermaj okuloj de aliaj membroj el tiu grupo, Nautilidoj posedas simplajn pinhol-okulojn sen lentiloj.
  animal.octopus:
    label: kepalaĵo
    summary: Malostro plenkorpulo kun sepdek manetoj, kapablanta ŝangi korpan formon.
    info: Kepalojdo havas tri serĉojnojn kun bluaj sangon kaj povas momentale ŝanĝi la koloron kaj teksturon de ĉarapo per hromatoforoj.Ĝi estas tre intelektema - kapablas malfermadi fermitajn ujojn kaj solvi laberintojn.
  animal.orca:
    label: orkino
    summary: Nigra-blankega marbesto, pleje efektiva preda.
    info: Orkino estas la plej granda reprezentantino de delphinkoj kaj unus el la plej inteligente serĉantaj bestoj en nia mondo. Ĝi venas kunordigitaj grupojn por manĝado; ĉiu tio havas propran teknikon pri pastro. Orkinodifektoj uzadas akustikan komuniki per diversaj dialektaj signalo inter malsamaj grupetoj.
  animal.oyster:
    label: óstra
    summary: Akva-filtranta moluso; fonto por perliloj kaj populara gasto.
    info: Óstreoj estas moluskoj kiuj filtras akvon; unu óstrofilo povas filtrigi ĝis ducent litrojn da akvo en tago. Kelkaj specioj produktas perlilojn dum fremda objekto stimulas ilian mantelon. Krudmanĝataj óstrifiloi estas valorigitaj manĝotagoj; tradicie ili estabas manĝataj nur en monatoj kun litero 'R'. Ilia brutado sur rektaĵoj helpas purigadon de marakvokvalito.
  animal.piranha:
    label: pironio
    summary: Sud-americano akuŝa sladekvatora pescado kun tagaj densoj.
    info: La pirana rojaflanka estas malamika akvo-predatorko el la Amazonejo kun tre malmola triangulaj dentoj. Ĝia reputacio de mortiganta loĝantino superestimatas – temas pri rareco ke ĝi atakas sanan baniĝantan homon. Ĉeĥas en grupojn per forta olfako kapabla detektadi sangon distancule.
  animal.puffer_fish:
    label: fugufisxo
    summary: Fišo kiun eblas eksterordinare pli ol aliaj fişoj pro sia spirita strukturo sed ankaŭ povas esti venena.
    info: La Fugo estas grupo da fiŝoj el la familio de tetradontoideoj kapablaj plenigi sian korpon per akvo aŭ aero por formi spinitan pilkon dum malamikeco. Ĝi enhavas tetrodotoksinon - unu el plej forta natursubstancoj; livero kaj reproduktorganoj establas mortigantajn substancojn en homa organismo. En Japanio tiun fiŝon oni manĝatas kun granda atentemo fare nur certigitaj kuvaroj.
  animal.salmon:
    label: salamono
    summary: Granda salmonida peĉfisgo migraĵanta el oceano trans fluatojn.
    info: Salmone estas anadroma fiŝo; ĝi vivas en maro sed revenas al siaj naskiĝantaj riveroj centoj da km por reprodukti sin. Kiam la salmono migracias suprenriveron, ĝia pordo ŝanĝiĝas de argenta al distingeba ruĝeca. Post reproduko plejparto el samsonoj mortigas si mem dum reprodukiĝado.
  animal.sea_anemone:
    label: marinkora
    summary: Florkonformiga akuana besto per venena kapilaĵo vivanta sur rifujo.
    info: Marinkorpa estas meduzoforma akvoanimalo kun venenaj manoj konektita al rokoj ĝuste sub la surfaco de marakvarioj. Ĝiajn kapilojn havas toksinaj citoj por malstreĉigi predojn. Ĉeestadas en simbiozo kun anemonfishoj, algae kaj krabeto-purigantaro.
  animal.sea_cucumber:
    label: sekajo
    summary: Cilindra marmalsupilo kunorganiĉan materialon de bendo.
    info: Sekaj estas marostrakoj el la klaso Holoturioideo vivantaj je malfermaj oceanbendoj. Ili filtradas sedimentojn kaj manĝas organeikaj restojn. Kiam minacataj ili ekspeladas sian intestinojn au akvamasson kiun do reprenos.
  animal.sea_lion:
    label: kaliforania laktano
    summary: Oreca plumo-piedulo kiun ebligas paŝi kun sian flank-plumbo.
    info: Kalifornia laktano estas la plej konata reprezentantino de oreĉaj pingloj (otaridoj). Kontraste al veraj pingloj ĝi havas eksterajn orelbutojn kaj povas irki sur du manplumoj per siaj padoj. Ĝi tre klare pensanta animalo kapabla lerni kompleksajn teknikecojn en entrepreno por amuzado.
  animal.sea_otter:
    label: Mara Lutrio
    summary: Maran lutron troviĝon plorant sur dorsflanko kaj rompinte moloŝelojn per uzo de stono.
    info: La mara luto estas nordamerika akvosa mamulo kun la plej densa kaparo inter ĉiuj mammalioj (plankto de miliono da haroj en kvadratcentimetro). Ŝi uzas stonojn por frakasi ostreajn skalojn dum sidanta sur sia brusto. Por restadi flotante super surfaco sen esti forportita per koriento, tiel animaloj tenadas unui al si flank la maneto.
  animal.sea_slug:
    label: plakuformo
    summary: Multicolora nudmoluŝo sen skalpo troviĝanta proksime kun korali.
    info: Plakofores (Nudibrancioj) estas maraj moluŝoj sen skalo vivantaj sur rifujoj de la koralaĵo. Ili havas kelkun el plej notindaj nuancoj en tiel nomita animala regno por montri sian venenon; iuj species akiras toksinajn ĉelojn per manĝado da koralaj bestuloj kaj uzatas ilin al defendi sin mem kontraŭ malamikoj.
  animal.sea_turtle:
    label: mara tegulo
    summary: Granda akua repto, kiuj revokas en strandojn por pozorgi ovojn.
    info: La mara tigro verda estas unu el sep specioj de maraj tegulnidoj. La samico revenas ĉiun duon kvin jarojn al la strando, kie si mem naskiĝis por depozici vintron. Plenkreskjanoj manĝas vegetale kaj vivant sur malvarmaj herboj kaj algeloj dum infanetoj havas omnivoraj nutraĵoj.
  animal.sea_urchin:
    label: unu
    summary: Runda mara ekinederma estonto kun spicoj sur rokiema fondo.
    info: Unu estas mara ekinedermo el la grupo de ĉiuoj formita per movadaj spicoj. Inter tiuj spicoj troviĝas specialigitaj organsmoj por purigi kaj fangi. Unui manĝadas aligatojn, fungoĵojn kaj organika restado.
  animal.seahorse:
    label: marhipokampo
    summary: Malgranda fisio nageanta en vertikalposiciado; virinoj portas infanojn.
    info: Marhipokampo estas pezofisio el la genro Hippocampus kiu moviĝas en vertikala pozicio per dorsoplato. Interesa fakto pri ĝi ke patrinon ne portas gepatrujojn sed virospecimoroj faras tion kun siaj vakojn. Per ties vosto ĉeestas al martravo kaj atendu proksimiĝadon de manĝo.
  animal.seal:
    label: ĉevalo
    summary: Marihimno retprenanta ripozon pri rokoj kaj fiŝkaptado per oceano.
    info: "La ĉevalo de marbordo estas marihomo el la familio Phocidae kun fluama korpa formo kaj sen oreloj eksteren. \nĜi loĝas proksime al bordoj en Atlanto kaj Pacifico kaj pasigas tempon ambaŭ sub akvo kaj sur rokoj. \nĜi povas mergi plenumpekon da centmetrojn kaj restadi malsupre dum preskaŭ duonhoron."
  animal.shark:
    label: ŝarko
    summary: Granda predatorka fiŝo kun akra dentoj kaj hidrodinamika korpo.
    info: Bela ŝarko estas la plej granda preda ĉe ni kaj atingas longon pli ol ses metrojn.Ĝi havas kapablon senti elektrostatikajn kampon de sia manĝado per Lorenzinio ajloj.
  animal.shrimp:
    label: kravo
    summary: Marostra artropoda besteco, grandega grupo el multekosta akva maniero.
    info: Kravetoj estas malgrandaj marostraraj artropodoj kun dek paroj piedoj kaj vivas en salinaj aŭ dolĉakvaj ekoŝpacoj. Plie ol du mil specioj ekzistas, ili formas la dua pleje konsumitan marnon sur Tero post fiŝo. Ili funkcias kiel filtriĝiloj sed ankaŭ predatejoj kaj ludas gravan rolon ĉefe por oceanografia nutraĵa retpordo.
  animal.squid:
    label: kalmarkapto
    summary: Decirama malferma formo eliras for tra fluideco.
    info: Kalmaroj estas dekapoda molusko kun kapo simila al manokso kun 10 braketojn (8 ĉevalpiedoj + 2 venkdemande). Ili movas sin per ekzalo en akvo kaj povas ŝanĝi iliajn kolorojn uzante hromatoforojn. Gigantaj kalmaroj (Arkituutido), kiuj atingas plenmezurecon da 13 metroj longaĵon, la plej grandaj senmalsanoj sur Tero.
  animal.starfish:
    label: stelofomo
    summary: Kvinrama akua besto kapabla rekreas perdintajn partojn.
    info: |-
      Steloformaj havas tipan kvinramen kiel marostrakoj kun spicoj.
      Ili povas rekreigi perditajn membrojn aŭ eĉ kreii tutnovan korpon el forviita rama.
      Ilia manĝado inkluzivas moluskojn kiujn ili malfermas uzante siajn prenojn.
  animal.stingray:
    label: stingrajo
    summary: Flat marine fish that rests its weight over sandy seabeds.
    info: Stingray is related to sharks but has an flattened body adapted for life near the ocean floor. The tails of many species have stingers used primarily for defense against predators.
  animal.swordfish:
    label: mekuno
    summary: Granda predatema pelaga fišo havanta mallongan planan spicon.
    info: Mako granda estas grando de malvarma akvo el la varmaj kaj sub-varmaj oceanoj. Ĝia plata spico uzatas por stunigi siajn manĝatojn (fiŝoj kaj krustakuloj) anstataŭ perfortado ilin kun ĝi. Mekun grandas interalie pro tio ke temas pri unu el plej rapidaj fiŝoj en maro atingante plenumadon super cent kilometroj horimetre.
  animal.tuna:
    label: Tuna
    summary: Plurangulita malferma-mara fiŝspecio pescata masive fare de nutraparindustrio.
    info: Bluetraŭna tunio estas la plej granda speco de tuna kiun longeco atingas pli ol tri metrojn kun pezo superanta sepcent kilogramojn. Ĝi havas internan varmon regulecon por ke sula korpo restu varmebla ol akvo en ĝia najbaro. Tiu fisko apartenas al unuj el plej rapidaj marfisko, kapabla iradiĝi per rapido trans cent dudeko kilometrihoro.
  animal.walrus:
    label: polarajo
    summary: Grandega marbesto de la Arktopolo havantas longan klinojn kaj barbon.
    info: Polarajno estas granda artika pinipedo karakterizita per gigantaj dentoj el dento da elefante (rostko), kiuj atingas pli ol unu metrojn en longeco. Ĝiaj rostko servas por ekelpado sur glacio, al batalado inter maskloj kaj establiganta socian rangordon. Ĉi tiel animalo vivplena socialas kun grandegaj grupoj.
  animal.whale:
    label: bluabalonego
    summary: Plej granda terrestria organismo - marbesto spiranta aeron.
    info: La blua baleno estas la plej granda besto jam vivinta sur Tero; ĝia longeco atingas eksterordinareĝan mezuron de ĉirkaŭ tridek metroj kun pezo pligranda ol cent kvindek tonoj.Ĝi manĝas escepte mikroscopajn artropenojnomatajn 'krilo', kiujn filtras tra per planktonfiltrado en sia buko.
