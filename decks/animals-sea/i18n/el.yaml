lang: el
pivot: false
title: Θαλάσσια ζώα
cards:
  animal.anglerfish:
    label: Θαλάσιο Δαιμόνιο
    summary: Γεβύς με λάμψη.
    info: Το θαλάσιο δαιμόνιο είναι μεγάλη ψύρα που βρίσκεται στα απήχη των νυχτώδων φθινοπωρινών και χειμερινών γεφυρών.
  animal.barnacle:
    label: αντροπέδα
    summary: Μικρός ζωγραφιστικός πουζούλιος που ξεπερνά σε πέτρες.
    info: Τα αντροπεδά είναι πρόσημους κιλέφθων τύχου θαλάσσια φυκών με στήθος ραβδών γιγαντιαϊκών δακτύλων· βρίσκονται σε λίθους, ναΰξ, και κιτρινοψαριά.
  animal.beluga_whale:
    label: μικρός αρκτικός κοτέλ
    summary: Μικρός βοϊδωτός αρκτικός κοτέλ.
    info: Η Beluga είναι μικρό λευκό κοτέλ Αρκτικών ωκεανών που διαθέτει σφαιρική φάτνη για τηχοπούλωση.
  animal.blue_tang:
    label: Κανικ
    summary: Φωτεινός μπλε ψαράς από τα προϊόντα της corals; star από 'Finding Nemo'.
    info: To Kanik μπλεύριον είναι ένας πέστρωτος ωκεάνιδας του αμβώγυρου κόκκινης φθοράς σχήματος λεπτού δρόμου γεμάτο νεφελιδίδια βαθιά μπλε και με κίτρινο ουρά από τα προϊόντα της Indopacific coral reefs.
  animal.carp_river:
    label: Ρυπαρίς ποταμαϊκός
    summary: Μεγάλο χρυσαφένειο ωξεία όψιν ύδατος που ζει σε ποταμούς και ψαροτρόφια
    info: |-
      Η ρυπαρίς είναι αφετηριολόγως Ασιάτικο και μεταφέρθηκε στην Ευρώπη του Δύσμαχου προβλήματος
      Είναι γενικευμένο φαγοδύτης· βγάζει λάσπη και διαταράσσει νερό
      Συμβολίζει τα Γιαννιάτα της Τσεχίας· πωλείται ζωντανό σε τροφεία
      Ανήκει στις πιο καλλιεργούμενες ψάρια στον κόσμο και υπάρχουν πάνω από 100 φυλές
  animal.catfish:
    label: ψάρι
    summary: Μεγάλο ψάρι σε ασθένη νερό με βλήχες · κρύβεται στον πυθμένα.
    info: |-
      Το Sumec είναι το μεγαλύτερο ψάρι που ζει σε ασθένη νερό στην Ευρώπη και φτάνει σε διάμετρο για λίγο πάνω από 2 μέτρα και βάρος πάνω από 100 kgr
      Οι χαρακτηριστικές «βλήχες»(«φρύδια», αγκίστρα), εξυπηρετούν ως αισθητήρια ραβδία·
      Ζει κοντά στον πυθμένα των ποταμών και τζιμπλισμάτων,
      Στη Γερμανία , το Sumec είναι αγαπημένο ψάρι.
  animal.clam:
    label: Πολύ μεγάλο
    summary: To megalo taiwnio fyllo einai to megalitero gialexia ston kosmo kai zwinei sto tropical coral reefs.
    info: '{"hint":"δίφυλος μαρμάρι σύν ιχθείση διπτέρω που ανήκει στη νότιδα Bivalvia","info":{"label":"Μεγάλο ταιώνιο φύλλο","summary":"Το ροζ κοράλλι είναι το μεγαλύτερο γαλαξία στον κόσμο βρίσκεται στα τροπικά νησιωτικά λιβάδια ."}, "info": {"Για το Tridacna gigas", είναι το μεγαλύτερο γαλαξία στον κόσμο , με μήκος πάνω από ένα μέτρο και βάρος πάνω από $\$kg. \Ζει σε συμβίωση με φωτοσυνθετικά φύκη zooxanthella μέσα στο περίθημα\. Διαρκεί πάνω από $$ї۸$$ $ড$. ",Η παράδοση ότι πιάνει submersibles είναι mythe ; το tridacna gigas κλείνει πολύ αργά."}'
  animal.clown_triggerfish:
    label: Κλωνική Σπουστίοβαρφη
    summary: Πολύ χρωματιστός τροπικός ψαρών με λευκές κηλίδες και πορτοκαλί υψίδι
    info: |-
      Η κλωνική σπουστίοβαρφη είναι μεγάλος τροπικός ψαρών από τη φυλμή Βαλιστίδα που διέθετε μία από τις πιο γεμάτες βαφές μεταξύ θαλάσσιων ρύχων
      Έχει δυνατά δόντια για να λιώνει σκληρά κοράλλια και μύτια
      Το όνομα «Σπουστίοβαρφη» προέρχεται από το πρώτο ωϊνο του χερουκιού, το οποίο λειτουργεί ως ασφάλιστρο (σπουστί) που παγώνει το δεύτερο
  animal.clownfish:
    label: Κλάουν
    summary: Πορτοκαλί ψάρι που ζει σε συμβίωση με τον δηλητηριασμένο ωκεανικό πήκανο.
    info: Ο κλάουν οχθοφυσίς διαβιώνει στη μέση των χρόνιμων πήκανων αγκύλων επειδή φέρει λαιμοξυλικό βλέννα για να είναι ανέπαφος· καθαρίζει το πήκανο και απωθεί τους προϊόντες, ενώ το πήκανο του παρέχει προστασία.
  animal.crab:
    label: Καβουνάκι
    summary: Δωδεαφύλλο θαλάσσιο ζῷο µὲ ἀµφὶ βῆµα.
    info: Το καβουνάκι είναι έντερο από τη υποδιαίρεση Brachyura που φέρει σκληρή μεμβράνης exoskeleton για να διυγχθεί (ecdysis) περιοδικά για να μεγαλώσει. Διακινείται χαρακτηριστικά πλευρικά.
  animal.dolphin:
    label: Δελφίνι
    summary: Ένας έξυψος οθωνοπίδας που ζει σε σύνολα και πηδάει από τη Θάλασσα.
    info: Το δελφίνι είναι θαλάσσιο σπουδαίο από τη νήμντρα που χαρακτηρίζεται για μεγάλη φωςχέτη και ικανότητα εξ' αποστάσεως βούλευσης· λατρεύει να πηδάει από τα κύµατα των πλοίων µε ρώγµατα και κλικs για να επικοινωνεί.
  animal.dugong:
    label: Δυγόν
    summary: Σπάνιο οργανισμός της Ινδικής & Δυτικής Ωκεανικής περιοχής που σχετίζεται με το Manatje.
    info: |-
      Το Dugong είναι θαλάσιο σπουδαίο προγενές της κατηγορίας με αμφότερα ωκεανικά νερά γύρω απ' τη Γη
      Ζυγώνει βάζοντας φυτά που λειτουργούν διαχρονικά στη Θάλασσα,
      Θεωρήθηκε ότι εξέπληψε την εμβληματική εμπνευστική ιδέα για τα «Νερά»·
      Οι ναυτικοί το παραπλανήθηκαν να το περιγράψουν.
  animal.eel:
    label: Ελιέρα / murena
    summary: Πεταχτός ψαρόσαρκος που κινείται σε ρωγμές
    info: "Η μούρα είναι ένας κόλαστρο φιάλη από τη νεκρή συγγένεια Muranidae που βρίσκεται διαχωριζμένο υδροφόβο λιθώματος\nΈχει γεύση στο στόμα· εξοπλισμένο με εσωτερικές γεύσεις (φαρυγγικές), για να τραβήξει την τροφή στο στομάχι \nΔεν επιτίθεται · Γενικά, η διάρρηψη προκαλεί προϊκτικά"
  animal.flying_fish:
    label: Πτηνόψαρο
    summary: Ένα τροπικό χρυσόβουνο που γλιστράει πάνω από την επιφάνεια του υδρογραφείου.
    info: "Το Letoun ή Exocoetidae είναι μια τροπική ρυτσός που κάθεται απ' τη νύμφη στον αέρα γλιδώνοντας·\noι διαγωνιζόμενες φτεροχτιστές λειτουργούν ως πτερύγια · \nη ψάρι μπορεί να «πετάξει» έως και 200 μέτρα\nκαι να φτάσει ύψος 1,5 μ., για να βγει από τους προϊσταμένους,\nόπως τον tono, τον marlino και τον δελφίνι."
  animal.frogfish:
    label: Αntennarius
    summary: Κρυφτό προϊόν σε αλυβωτικές περιοχές.
    info: Το Αντενάριους είναι μικρό ψαρωδέσπομπο αλυβών της κατηγορίας που διαθέτει σχήμα για να βοηθά τη λύψη φαγητού.
  animal.giant_squid:
    label: Γιγαντιαίος βάτραχος
    summary: Το μεγαλύτερο αβαθές ζῷο που ζῇ στο βάθος.
    info: '{"hint":"προσωμότυπα θάλασσας φθάνουν σε μήκος πέρα από τα 13 χιλιόμετρα","info":{"text": "Οι γίγαντες καφέ εξώδης δύο νερού"}}'
  animal.hammerhead_shark:
    label: ψάρι tabló
    summary: Ακυδητών με χαρακτηριστική επιμηκυμένη κεφαλή σχήματος Γ.
    info: "Το ψάρι ταμπλό είναι ένας τύπος ακυδητών με πολύ σχήμα κεφαλής λωρίδας γνωστό ως cefalofoil\nΗ διεγέρθη κεφαλή βοηθά να ανιχνεύουν φυζικά αξεσούαρ (Ampullae van der Waals), καθώς και να κινούνται καλύτερα \nΖουν στα τροπικά ύδατα και τρέφονται με ρύβους , καβούρια και καβούρια"
  animal.horseshoe_crab:
    label: limulus
    summary: Αρχαϊκό αρθρόποδο που 'ζει' αχαλίνωτο από τη Δεξαμενική περίοδο.
    info: Το Limulus Polyphemus είναι ένα αρθρόποδο που υπάγεται στη φυλή των κιβώκων με λέμφιο γούνος διαστάσεων ~7 cm - βρίσκεται να «ζει» αχαλίνωτο από τη Δεξαμενική περίοδο (~689–~419 εκατομμύρια χρόνια).
  animal.jellyfish:
    label: Μεδούσα
    summary: Διαφανής ζῷο ἀλιῶν σὲ σχῆμα κόλπῳ μὲ δηλητηριώδες.
    info: Η μεδούσα είναι θαλάσσιος τρωτόζωο από τη φυλμή σκώληξ που δεν έχει νεφέλωμα και χιαστί - o βλάστης αποτελείται καθ' ολον από νερό για το 95%. Διαγράφει την κίνηση λόγω της παλινδρομικής κίνησης του κολψοειδούς σώματος.
  animal.lionfish:
    label: Κρυτόπασχο
    summary: Δηλητῆρια τροπικὴ ᾠκῶν ἡ ὲνὶ πᾶσῃ ἄκρᾳ.
    info: Το κρυτόπασχος είναι μια δηλητήρια θαλάσσια ρύγκα από τη φυλή Scarpaena που σε νεφέλωμα λευκών γραμμών και βρίσκεται σε ιζηματοθρυψίδες. Δηλητηριασμός από το ζῷο προκαλεῖ ἀξιοσημεῖον πόνῳ· σπάνια προκαλεῖ οἱωνὲς ὑπὸ κίνδυνον.
  animal.lobster:
    label: Χουμρ
    summary: Μεγάλη θαλάσσια χελωνή με κλεπτές · Γίνεται κόκκινη ώστε να μαγειρευτεί αλλά η ιστορία της είναι μπλε.
    info: |-
      Το Χουμρ ατλαντικό είναι μεγάλη χελωνή συσχέτιση της κατηγορίας νεφρώδη που φθάνει τα 60 επίπεδα δύναμης
      Είναι γεμάτο λευκό βλέποντας την αξία του· το ροζ ως υψηλό όριο εμφανίζεται μόνο ύστερα από τη ζέστη
      can live over fifty years
      It is considered an expensive seafood delicacy;
      humming trade constitutes billions industry
  animal.manatee:
    label: Dugong/manatées
    summary: Πολύ αργό χθαμενό υδρόβιο ζῷο.
    info: Το Dugon ή manatees είναι μεγάλα ωκεανικά σπουδαί που τρέφονται από νησιωτική βλάστηση και δύο λεμβών γυρίζουν στον Κариβικό Ωκεανός, Florida en Afrika. Δεν φοβούνται τα πλοΐα αλλά πολλά έχουν τραύματα από τις περιστροφικές τους.
  animal.manta_ray:
    label: ραϊ μάντα
    summary: Πολύ μεγάλο όμορφο ρυπός που φιλτράρει λεπτόκοκκο κοντά στην επιφάνεια.
    info: |-
      Η Manta θαλάσσιος είναι το μεγαλύτερο είδος ρυπών που φθάνει σε ανάπτυξη κωπήδων για να διαμορφώσει πέραν των 7 μέτρων και βάρος πάνω από 2.000 кг.
      Φιλτράρει λεπτόκοκκο με τις χειλικές πλακίδες κατά την κολύβανη με ανοιχτό στόμα.
      Δεν έχει δηλητηριώδες σπινθήρα· είναι宣完全 αψόρογο για τον άνθρωπο.
      Συμπεριλαμβάνεται στα πιο εγκλειστικά ψάρια · πιθανόν να αναγνωρίζει την εικόνα του στον καθρέφτη.
  animal.mussel:
    label: Σλάβκα
    summary: Το tmavo μπεστιέ που συγκεντρώνεται σε πέτρες.
    info: Η φαγούρινη σλάβκα είναι ένα μπεστιέ που δυνάμως τζόχει αφήνει να βρεθεί και υδροξείνει για λευκών ροκών.
  animal.narwhal:
    label: Ναρβάλ
    summary: Αρκτική φυσαλιδόφαγη η οποία έχει σπειρωμένο κερας.
    info: Το ναρβάλ είναι μικρή αρκτική φυσαλιδόφαγη θαλάσσια που χαραχθεί για το σπειρωμένο κερας - πρώτα δύο λεπτά δόντια, το αριστερό βρίσκεται σε σπείρα που μπορεί να φτάσει τα 40 cm· στα οργανισμούς των ζωντανών δεν υπάρχει ·ζει σε ιχθυοϋψίλους στον αρκτικό ωκεανό.
  animal.nautilus:
    label: Ναυτίλιο
    summary: Παλαιός κεφαλάποδος με σπειροειδή σχήμα, που επιβίωσε απ’ τη Δινοσαύρια.
    info: |-
      Το ναυτίλιο είναι πρωϊμός κεφαλάποδος με σπηλώσχη τύβου χитώνα ακόμη ίδιος για λέγοντα δισεκατομμύρια χρόνια·
      o φλοιός είναι διαμορφωμένος σε βήματα και το ναυτίλιο ρυθμίζει την υδροστατική του ισορροπία
      με την εξαγωγή αερίου απ' τις κοιλότητες.
  animal.octopus:
    label: KAVYIS
    summary: Plithyménos me octó ypsiloús ós, e íkanos na allaxe to úfos.
    info: |-
      {"hint":"ενδογαστρικό μπουφάν πληθυμένων","info":"Η καβύς είναι ένα αχώρι τζάμπι χωρίς σπονδύλωση απ' τη νήμα για φαΐ δεξιότητας βραχιόνων· Διαθέτει τρεις καρδιές\r
      πράσινο αίμα και μπορεί να λειτουργεί αμέσως την αλλαγή ρούχων και την επιφάνεια της επιδερμίδας του με τη χρήση\r
      χρωματοφόρων. Είναι πολύ ικανό - μπορεί να ανοίξει κλειστές συσκευασίες\r
      και να λύσει λαβύρινθους.","label":"ΚΑΒΥΣ","summary":"Πληθυμένος με οκτώ υψηλούς ως, η ίκανος να αλλάξει όλο το ύφος."}
  animal.orca:
    label: Κοσάτκα
    summary: Πρωτεύον λεβεντοφάγος των ωκεανών.
    info: Η κοσάτκα είναι το μεγαλύτερο από γένος συ διψήφιου πρωτεύον θηλασματών ωθεί να φτάσει σχεδόν το βάρος των 6000 kg.
  animal.oyster:
    label: ostrakoeidís
    summary: Διαφορετικό είδος μύλθιας που διηγεί το νερό.
    info: '{"info":"Οι οστρακοειδής είναι μύλθια που διηγούν το νερό· όμως από συχνά φέρνουν και λεβιαθάνια για τη βιώσιμη αξιοποίηση\"}'
  animal.piranha:
    label: Πιράνα
    summary: Σλαδεψανιά ψάρι με ξιφολόγχη.
    info: Η πιράνα είναι από τη δυτική Αμεζονία και χαρακτηρίζεται για μεγάλους σχεδόν λεβέντες φύσαντες βρώμικα νωτιαία. Δεν είναι εξίσου επιθετική όπως περιγράφεται.
  animal.puffer_fish:
    label: fugu fish
    summary: Ψάρι που φυσώνεται σε μπαλίκι κομβός ;to fugu είναι μια ζωντανή γεύση αλλά και δηλητήριο.
    info: |-
      {"hint":"ψάρι που φυσώνεται σε μπαλίκι κομβός όταν απειληθεί","info":"Το Fugu είναι ένα ψάρι των Tetrodontidae δύναται να φυσήξει το λεγόμενο "φυσαδάκι" γέμνοντας το με νερό ή αέρα βάζοντας σχήμα μπαλικιού με αιχμηρά ακάνθες.Περιέχει tetrodotoxine ,ένα από τα πιο δηλητηριώδη φυσικά δηλητήρια·Οι ηπατικοί ιστοί και ΓΩΝΑΔΕΣ είναι θανατηφόροι.\r
      Στην اليαπωνία το fugu είναι μια ξεχωριστή γεύση ·Οι οργιστές πρέπει να έχουν ειδική άδεια .Η φύσανση είναι μια μέθοδος προστασίας ΔΕΚΤΙΚΉ ΑΥΛΗ
  animal.salmon:
    label: Λεβεντάρι
    summary: Μεγάλο ροΐκο όνομα που ανεβαίνει από τη Θάλασσα στους ποταμούς για να βάψει.
    info: "Το λεύκα είναι από τις ψάρες που κυλήστημα στη θάλασσα για να μεγαθύνει , αλλά επέστρεφε δεκάδων km πίσω στους φυσικούς ποταμούς του για να βάψει . \nΌταν βάζει , αλλάξει χρώμα - από αχνό σε κόκκινο\nΠολλά λεβεντάρια(παχυδρομικά ) πεθαίνουν μετά το βάψιμο ;\ntα σώματα τους φυλλώνουν και οι ιχthyofages επιστρέφουν στο φυσικό ecosystem."
  animal.sea_anemone:
    label: Sasanki marina
    summary: Φυτοειδές θαλάσσιο ζῷο µὲ ἀµελῶς λοξὰ χεῖλα, που κατοικεῖ σὲ κοραλλιᾶ.
    info: "Η μαρίνιστρος είναι ένα πληκτρώδες ωθόπου τυμβά σχήμα κρύφτων αγκιστρωμένο σε βράχους\nΟι λοξοί δακτύλιοι φέρουν νευροτοξικά γονίδια (νεματοζύστες), για να παραλύψουν την τροφή \nΖει σε συμβίωση με κλαουνίδια , φυτοπλαγκτόν και κρεβάτσια - καθαριστές"
  animal.sea_cucumber:
    label: ΣΟΥΜΙΣ
    summary: Κυλινδρικό διθαλάσσιο ζῷο που συλλέγει φυτικὰ ὑπολεῖμμα.
    info: Τα σούμις είναι θαλάσσιες ακρωτηρώπου πλήγες της κλάσης Holothurioidea που υπάρχουν μέσα στο νερό γυμνές.
  animal.sea_lion:
    label: Δεξίτης
    summary: Πλοΰχονογός με λοβούς νωτιαίων και ικανότητα να περπατά με πλοΐχες.
    info: Το Καλιφόρνιου Δεξίτης είναι το πιο γνωστό μέλος από τη φυλή Otariidae κάτω χώρας σκύμβων· διαθέτει βγαλμένα λοβούς νωτιαίων και μπορεί να περπατήσει με τέσσερις πλοϋχές.Είναι εξαιρετικά εξυπνοδύνατο · στον ψυχαγωγικό τομέα μαθαίνει πολύπλοκα τζόγκα.
  animal.sea_otter:
    label: Λύθρα
    summary: Παράκτια γλουσκίδη που κολυμπά σε ανάσχετη θέση και χρησιμοποιεί πέτρες για να σπάσει τα μαΪμου.
    info: '{"hint":"παράκτιος γλουσκίδη που κολυμπά σε ανάσχετη θέση χρησιμοποιώντας εργαλεία","info":"Η λύθρα των μαρμάρων είναι ένα ξηρόζωο νήσου διαβάζοντας βόρεια Για φροντίδα με την πιο πυκνή τρίχα από όλα τα ζώα (800.000 τρίχες ανά cm\U+00A0cm). \Χρησιμοποιεί πέτρες ως εργαλεία για να σπάσει τα μαϊμού και τα αφρικανικά μαΐμου που τα οποία τα ισορροπεί στο στήθος. \Κοιμάται πλεύσιμο στην επιφάνεια· Διατηρεί τα πόδια τους μαζί για να μην τα φέρει το ρεύμα. \Ήταν σχ乎接近灭绝状态，因为毛皮；由于保护计划种群恢复了。"'
  animal.sea_slug:
    label: Πλακόφορο / Nauτοβράνχη
    summary: Δροσερό ροϊκό ναυτοβράνχη ως ακροθαλάσσιος φυτόφαγος.
    info: |-
      Οι ναυτοβράνχες είναι θαλάσσια μη κεφαλόγαστρα χωρίς σπiralώμα που ζουν σε ακροθαλάσσιες φύσεις βρέφων τζαμανιών
      Έχουν από τα λαμπρότερα χρώματα στo βασίλειο των οδοντωτών δεντρολιβαδιών·
      Συνήθως για να προειδοποιήσουν για την παρουσία τοξικών ιδιοτήτων,
      oρισμένα είδη αποκτούν τοξικά κύτταρα από την τροφή τους(τζαμανιών)
      kai xρησιμοποιούν τα για την προστασία.
  animal.sea_turtle:
    label: Γλαύκα
    summary: Πράσινος νερόθηλος.
    info: Η πράσινη χελώνα είναι μία από τις έξι φυτοφαγές και δύο σχεδόν βουαλωμένες γλαύκες.
  animal.sea_urchin:
    label: sponge
    summary: Γεμάτος Θαλάσσιος αρθρώμενος που φέρει λύχνους
    info: "Η σπόνγια είναι θαλάσσιο αρθρώμενο που βρίσκεται μέσα της κατηγορίας χεχινωδή διαφυλλιζόμενη από λύχνους\nΠεριβάλλει φυσικά νεύρα για καθαρισμό και ανίψη \nΤρέφεται με φύκια , μύκητες και οργανικά υπολείμματα .\nΟι ΓΩΝΙΕΣ της( uni ) είναι πολύξια από τη ΔΑΦΝΗ"
  animal.seahorse:
    label: Νεροπίδων
    summary: Πολύ μικρό ψάρι που κολυμπάει κατακόρυφα · o αρσενικός φροντίζει τα παιδιά.
    info: '{"hint":"μικρό ψάρι που κολυμπάει στην ορθή ταχύτητα","info":"Το νεροπίδων είναι μια αξιοσημείωτη φιγούρα για το δέρμα τους, βρίσκονται σε λεβιούφρακτο θάλασσας, όπου το αρσενικό φροντίζει τα παιδιά του.","label":"Νεροπίδων","summary":"Ψαράκι που κολυμπάει στην ίδια ταχύτητα· το αρσενικό φροντίζει τα παιδιά."}'
  animal.seal:
    label: Αλιγότσα
    summary: Ωκεάνιος σπουδαίος που αναψυχάζει στα βράχια και αναζητεί ψάρια.
    info: Η αλιγότσα είναι ένας ωκεάνιος σπουδαίος με τη δυναμική καθώς πρέχει νύξεων για λίβανο· βρίσκεται κατ' αφορμήν της Ατλαντικής και Πακιστανικής θαλάσσης και περνά φάσεις τόσο στο νερό όσο και στα βράχια. Δύναται να βυθιστεί σε βάθος πάνω από 500 μέτρα και να μείνει κάτω από το νερό πάνω από μισή ώρα.
  animal.shark:
    label: Καµπάρι
    summary: Μεγάλη πρωτεϊνική рыба µε ξύφια δόντια και υδροδυναµικό σώµα.
    info: Το λευκό καμπάρι είναι η μεγαλύτερη πρωτεϊνική ρыба στον κόσµο µε µέγεθος ακόµα για να φτάσουν τα δέξι βήχες. Διαθέτει την ιδιότητα να αντιλαµβάνεται ηλεκτρικά πεδία της µερίδας του µέσω των Ampullae Lorenzini. Παρ' όλη τη φήµη του, οι επιθέσεις σε ανθρώπους είναι πολύ σπάνιες· τα καµπάρια είναι κλειδιά πρωτεϊνικά στο θαλάσσιο ecosystem.
  animal.shrimp:
    label: '"Αγκιστρώνας"'
    summary: Μικρό ωκεανικό φωσφοροβάθρο, Δεύτερο πιο δημοφιλές ψάρι.
    info: '{"hint":"μικρός γονίδας που κολυμπάει ταχύτητα ή σχετιζόμενο με Penaeidae","info":"Οι αγκιστρώνες είναι μικρές ωκεανικές η λιμναϊκές φωσφοροβάθρες με δέκα ζεύγη νυχιών\nΥπάρχουν πάνω από 2\.000 είδη· είναι το δεύτερο πιο δημοφιλές ψάρι στον κόσμο\nΕίναι φίλτρα και κυνήγια · είναι βασικά στοιχεία της χαλιάς τροφής της θάλασσας \ nΠολλά είδη είναι σημαντική πηγή τροφής στις τροπικές παρακτιές κοινότητες."}'
  animal.squid:
    label: '"ogkon'
    summary: Πενταχείρις αφύας που κινείται βάζοντας λεβιού.
    info: |-
      {"hint":"Δέκαχείρις κολπόστρωνη που ρυθμίζει τη μετάδοσή στο νερό","info":"Οι ογκώνες είναι αφύαλα δέκαχείρια φύαλα·
      Κινούνται βάζοντας λεβιού για να πετάξουν και μπορούν να αλλάξουν χρώμα υπολογιστικά.
      Τα μεγάλα θεϊκά έχουν μήκος πάνω από 13 μέτρα και είναι τα μεγαλύτερα αφύαλα στον κόσμο.
      Αφήνουν ίχνη στην επιφάνεια των νερών, όπου πολεμούν με τα νερά."}
  animal.starfish:
    label: Αστεροείδη
    summary: Πολύφυλλο ζῷο µὲ ἀµβλῶνες πῆχες.
    info: Οι αστεροείδες είναι θαλάσσια πουκάμισα με τυπική δύο χέρια σχηματιζόντας κάθε φορά νέο λωρίδιο για να βγάλει το νέο σώμα.
  animal.stingray:
    label: Ρέϊνοκ
    summary: Επίπεδο ψάρι με άκρες στο ουρά· Ανάπαυση στο χαλίκι.
    info: '{"info":"Το ρέινοκ είναι συγγενής του καρχαρία με πλάτωμα από ένα δίσκο για να βοηθήσει τη ζωή του στον πυθμένα\nΠολλών φύλων λεβροφόρος εξοπλισμένος με ξύλο για την προστασία του \ nΚινείται με ταλάντωση των πλευρικών πτερυγίων , όπως πτήση πτερύγων .\nΟρισμένα είδη είναι eletrogeni και μπορούν να αποζημιώσουν την προμήθεια με ηλεκτρικά shock"}'
  animal.swordfish:
    label: Σπαθί
    summary: Πολύ μεγάλος πικρύδης με μεγάλο σπαθί.
    info: Το μεγάλο σπαθί είναι ένας κρουστός πικρύδης από τα ωκεανικά νερά των τροπών και υποτροπικών γειτονικές λεμφοβλήτες δυνατό φρύξιμο βλέμμα -χρησιμοποιεί για να αποζημιώνει την προϊόντα (ψάρια) , όχι για να τα σκαρφαλώνει .
  animal.tuna:
    label: Θύναμβλι
    summary: Γρήγορη ωκεανική ρίψη που αλιεύεται σε πολύ μεγάλες ποσότητες.
    info: Το θύναμβλικό είναι το μεγαλύτερο σπέσις ψάρου που φθάνει κυμή λεχ από 3 μέτρων και βάρος για να δώση 700 κιλά. Διατηρεί ένα ζεστό σώμα πάνω από τη θερμοκρασία του νερού. Είναι μία από τις ταχύτερες ρίψες της οδηγώντας σε ταχύτητα πάνω από 70km/t. Απειλείται από την υπεραλιεία· η τιμή ενός εξαρτήματος στη Γιαφώνεια αγορά φτάνει σε χιλιάδες δολάρια.
  animal.walrus:
    label: Μρόσινγκ
    summary: Πλουμπέτης µε λεβρούδια και φρύδια
    info: "Το μρόσινγκ είναι ένας πλουμπέτης των αρχευθάλασσών και χαρακτηρίζεται για τα φρύδια σφυρήλατα δόντια - λεβρούδια -, που φτάνουν να βγάλουν πάνω από ένα μέτρο\nΑξιοποιεί τα λεβρούδια για να ανεβαίνει στο παγωμένο νερό , για να πολεμεί με τα άλλα αρσενικά και για να οργανώνει την ιεραρχία .\nΕίναι κοινωνικό ζῷο και ξεψυχάρει σε τεράστιες πληθυσμιακές θαλάσσιες ομάδες \nΟ Γενικός Διαστρεβλωμένος Θερμοκρασιακός Παγκόσμιος Κύκλος απειλεί τον τρόπο Ζωῆς του στα παγωμένα νερά"
  animal.whale:
    label: Μπλού
    summary: Πιό γεράκι στη Γή
    info: Η μπλού Ουαϊλ είναι το πιό γεράκι όμως και στη Γή αφώσουν να διέθει βγαζόντας φωνή λεβχίδας -48m και βάρος +90 tonne. Δίνει τροφή μόνο σε μικρά κραστέρια που λέγονται Krill.
