lang: yi
pivot: false
title: מערין קרעעטארן
cards:
  animal.anglerfish:
    label: מערקענס диיוול
    summary: טאיפ פע рыבע מיט גליידעודיגע לאמס עלעקטראן
    info: מערקענש דявעל (לופיעוס) לעבט אין די טאפטן פון אקיאנען מיט'ס וואונדער נאר עטליכע הUNDר מעטר צו תם. די שוויגע האט אויף זיין קאפ גליידנדיק ליצצינג נעך (יללאציע), וועלכע ער מאכן אייך צוברענגען פריז און בענטווייַזן. די מאле איז ספעציאל שווערע; נאך באנוץ פון די שיינגע, ער הייסט זיך אנגעווארפן און ביולוגי באזירטען מיט יער.
  animal.barnacle:
    label: לייצל ברינג
    summary: קיינעג מעגלעך קרעשטאזיאן געבווסן אויף שטיائن און שויבן.
    info: ליכטברינגזערע זיין אונדזשלאפטע קרעסטאציעס פון דער סאב קלאס ציריפעדיען;זיי באנדיגן מיט סיימנט וואווער אויף שטיין, שויבן און ווייסעלעס. עטליך נוצן די פענעוועלס אין איינוורקונג טראף פילטראטיונען פלויקאן מאכאניזמעס.
  animal.beluga_whale:
    label: بلוגה
    summary: kleiner veleweys mit בליבנדער קרני
    info: בלוגע איז נאך וועלויס פון די ארקטישע און סאבארקטי שטערן מיט איינספאליגע באלווענע קרענקלמענגליך צוויקן זיין לעכגעראציע אין דעם בולבוויטע פרונטעל. עס האבן געווענט מעגנציאלי ערשייןונג מאכן מיט יעדיגע טאן.
  animal.blue_tang:
    label: канיק модры
    summary: בריליאנטי בענזקלע рыבענדיג פון coral reefs; העכסטער פון Heldung Nimmo.
    info: קאניק מודרый (פאראكانטורוס האפטאטס) איז א קליינע מארגן פיש אין בריליאנט בענוקלער צוויגונג מיט גאלטשטעיול טעל און זיין באקומט וואונדער ביי דעם סוף די indo-Pacific ריפ עריערן. ערש'נעמען נארוואוועג שפעציעס אויסגעדרוכן דורכאויס דורך דאס 2016 film 'Heldung Dora', אפילו אז עס איז שוועריקייטיג צו האבן איין אלץ היימ. עס האבן א חנית מעגליך צום לעצם פעולה על ידי יתדות.
  animal.carp_river:
    label: רייבישע капרע
    summary: גרוסה גולדן בראונד איינזידיגע פische וועלכע ליוויין אין ريבעעס און פischפארם.
    info: Der kapr iz afgerizen fun Azien un is geintroydzirt tsu Europa אין די מיטעלאלטער עпоха. ער איז אלמענשיג; ער שפיץ פון דעם באלג וואסנדיקן קיין צייט מעגליך צו מאכן נאכגעמאך פענעמונען. ער איז אויסדרוק פאר טשערסקע חנוכה'ס; שויפער האבן זיי געווענט צו סעלן זייער לעבאנדיגע פון באקיערן.
  animal.catfish:
    label: סומעך
    summary: גרוסע סלאדווארונישע פישטע מיט שויסה, פלויה' פעגאלען.
    info: סומעך וועלקער איז די גרעסטה' סלאדковונישע פишטע אין אייראפע; ער קאנט דריי מיטערן אריבער צוויי מאטרעס און זיין באזשטען טוט נאר בעניצן עטליכע הינדייגר ביי שטיין. מעגליך הארטן אויפ'ן ברעלעכונגנעמענדיקע פרויעקטיאנעראן, וואלעדזשע נוצן זייערע שאפצען אלץ צוווייסן צום חישה און טאקילע לעבן. ער ליווענט אנדרעם רעקען און סיידרן; ער איז נוקטורנאלישער פריידעאטאור.
  animal.clam:
    label: גרייססע מעסקע
    summary: די גריעססי מסקעה ביי ערדר אנהängט צווישן טרופישע קריסטאל ריפצען
    info: |-
      Großer Muschel (Tridaktena gigas iz di gréisste muschle op der wועל מיט א לענגקייט פון איינע מאטער אן וואגיענדיג קיין צוויי הונדערט קילאגראמער
      זי גייט אין סימביוזה מיט פאטעאסאנטהליסירנде אלגין (זועקסאןשלעלעס), די זייערע שאלוסספלאץ דרייכט אויבער האלב'ן מאטלער
      זי קענען ליוווען מאר אזוי וייזשנדיק אלס ע一百 יאר
  animal.clown_triggerfish:
    label: Springer klauen
    summary: Trupekes fisch mi weisse flecken un orange lippen.
    info: Klaunspringer iz di grôse trupikales fisch fun der famile Balistidae mit enem vu den farstelektsten färbungen tusenden see fishe. Es hot stark tsaytn fir zaubrekn harke un schalenfishe. Di nam Klauenspringer komt vi di ershte dorsale spinne, vos arbeit als ein versicherungsfad (klauen) um de twitte zu blockiren.
  animal.clownfish:
    label: קלאון
    summary: אן אורנזאוווויקע рыבה וועלכע ליבט אין סימבוזה מיט einer giftigen marinen sausenka.
    info: דער קלאון אינען לעבט אין מארין סאנסקעס וועלכע זיין גיפטיגע פלעצות צו דרענעניש נוצן האבן; ער איז איימונס דורכאוס טרэкטעמענט פון די שמייען אויסגעזוכן. ארבעייט אין סימביוז'ה רעינהם די סאסאנקה איבער פרעדאטארס און באלווערט אזוי די סאסанקי; עפענעמט די סאסanke באלדרוויי אנצוטרייטונג. אלץ קלואנים ברענגן ארויף מענהרן כמוך מאנן; דומינانتע מאנון können sich zu weibchen entwickeln.
  animal.crab:
    label: קראב
    summary: דייעם קנעכטלעגענע קרעשטאזיאן מיט panelier און קלעפ滕
    info: קראב איז עין קרעסטאציען פון דער סדרה בר钗יורה מיט טענעם לעגס וועגן צו די זייט נארוואך ער האט א חרטינאוויס paneer שטייגלנדיק געוועלדזשטע ברייבק אין אוشن,슬אטונ וואasser אויוואר
  animal.dolphin:
    label: דלפון
    summary: חוכמה מערבית שוורצענטישע לעבנס איר בערך אין חבורות.
    info: דעלפינ איז עין מערע שווארצן פון דעם משפחה וואס ערשיידט די נעמענשאפט ביי דאלף אין זייער נאם. ס'איז באקאנטע מעגליכקייט צו האבן גרויסע טalent, קענען אייךלאוקיישאן אויבוערן און מאכן פעלויגע אנגabayungen - דעלפן לייען צונקומען צוברענגענדיק צוגרייפן ים לויים און תקשורת דורכאויס רעשנים און קליקים.
  animal.dugong:
    label: דוגונג
    summary: קאלע מסך הרגבאור פון דעם אינדישן און טיקן اوceaנען פיליווזאנט מantee.
    info: די דוגונג איז איינע פון די מערסטע סווועםמענטל וועלכע גייט צו מעןטייער אין דעם אינדישן און טיכן אוceaנים. עס יעד נאר מארעסקע травעס. ער ווארט באטרachtט אלס קיין מקור לדריפונג פון שפיץ מיירין; שווארצע לענדזשאפט האבן זיך פעשליך אנגעמיידן אזויי בייוטסייט.
  animal.eel:
    label: angler/floor eel
    summary: E snaakelyke fisch vuimt braken töschen karrel stolpen.
    info: מערווענע איז עין גרעסטע מערע פיש וואוינט זיך אין ברעכן צווישן קארעל סטלפונגען. ער האט צוויי שפילעס טשאץ מאכ'ן דעם אויסגעזעצלטן באלויגונג נוצנדיק די באלקעווערמאך צו שאכאראם די פריענדויף.
  animal.flying_fish:
    label: לעטאווה
    summary: די לטאוונה איז א טרופיקאנדזש ריכת וואס קלוזאט מעגליך על הולצה באוויוס פארם.
    info: '"летאָווען" איז נייגער פון דעם טראפישע שפעcieר וועלכע קנענט צוגרייפן מיט די סווים אין אויברגענץ מאכן זייערע פרסשע פיינס אלס ערלויבט האנדלאך ווי גלייסן ביי עקסאמעטעידיאה.'
  animal.frogfish:
    label: אנטענענאירוס
    summary: געמאשקטע סככה אין קריסטעל רוקס, ליווי על ידי חוט
    info: דער אנטענענאיריאס פון דער צילינדרידאי משפחה איז עין קליינע מארinem fishes מיט וואונדערבאראמער камופליגן. ער האט בענקלעס געשאפן אלץ לעגאלן אויפ'ן באoden. אויף זיין דורצש פענל שטייערט איין מאבילישע נאדזש טווען די בוך.
  animal.giant_squid:
    label: גרייסע שוואנזפיש
    summary: די גרױסע בלאםווייבעל חיות האבן ניאך באקוועמת מעגליכקייט צו ליינען אין בעפעקלעמערטע טייל פון דעם יאט
    info: |-
      דער גרויסע אוליגנען פון דעם סארט 'ארכייטוועודס' זינדן די größטע ניידרונגענ אין ערדשפילר וועלכע קענען רעקנדן מיטלמערציק נענטשליכ צузאמenalגעווייזן מיט מאקסימום לנגקייט פון מער אלץ 13 מעטער
      זיין אויפן זיין די größטע איינוואוס טיריערן רייך (מיט דורכאצונק פון מער алץ 25 ס
  animal.hammerhead_shark:
    label: špingern
    summary: ШPingرن האט א חסר נאך טראפיקאנע ים.
    info: Š핑ערן פון דעם שארק ספירנידע משפחה האבן א באזארג'נע ערוויגטע קאפ וואס ענטהאלט מעגליכקייט צו געדענקן טרעף מיט איילעקטרישע ארגרנהלעס און בעפעקליקייט צו מאנווערירן זיך בesser אין די וasser.זיי לעבאן אויף טרופינשעמע ים און הייסטן פиш, ראדעוועלס און.Okтопוס.
  animal.horseshoe_crab:
    label: הוקהרעל
    summary: עס איז אן אלטע מעגליכקייטע פון ארבערטישע לעבן.
    info: Hokherlעך פארן איז געווענשאפט מיט דער ערד אייך וואס צוטריבט זיין קאליגולוגענע באזונדערהייט אין טעסטונג פון מאדים און疫苗. ער האלט בלומע שפילץ וועלכע ספאנגענדיק נוצ'ן די בערגשלופ פעראמיערן.
  animal.jellyfish:
    label: медуза
    summary: Transparent fish-like creature that glides through water using its long tendrils.
    info: מעדוזע איז נאכודיג פון די מער גליידנדיקס טירן וויינט מעגליך קלאווער צווישן זיין באקאנטע שפילער דורך ספונץ מאכן אויסגעזעצן באלעוואך אין עטליכע יארן.
  animal.lionfish:
    label: Krutopeks
    summary: Ein giftiker tropske fisch mit dramatische nadln und gestreifte farbung.
    info: Der Krutopeks iz ein giftiger see-fis gevelglik famelie Scorpaenidae mit markante raud-un-weisse bander un giftige nadeln. Der gif verursaht stark sheyne; es geyt seltn genug zu lifsgefaehrliche situationn. Es iz en eindringende art im karibi an mediteraneesik ozean; et vernichtet dort heymische fischartn.
  animal.lobster:
    label: הוימר
    summary: גראסי מארצשין קריסטאטיעס מיט קלופעס; באקוקד רעדנדיג אובער לייצט בלווענגלעך.
    info: הומרוס אטלאנטיקע איז א גרויסער מארינישן קרעסטאציעס פון דעם משפחה ניפרופידאה וואס צייגט די לענג פונקט זיבן ס
  animal.manatee:
    label: kapustňak/dugong
    summary: Ser langsamer seelevel genannt 'see koche'
    info: Manaten iz ein großer seelevel mit grünem blattfutter un nisht-meat. Eyntropit di meiste zeit op shvelerungen, flussmunderelekh un karibijshe kanale fun Florida, Afrika un de karabik. Zogt sich ser langsam fort (bis zu 6 mph), atmet all 4 minuten un hot oft wunden fon rotoren.
  animal.manta_ray:
    label: ראי מانتה
    summary: גרייסף ראי מантאה דורצט פלוואן אלץ פאן דעם סוף פון די אוceaן.
    info: מאנטוע אוקיאנסקע איז די גרעסטע שפעציע פון rays מיט וויסנשאפטליכן צווייג פונקטער ביים זיבן מאטרעס און באזירונג פארצווסנט קילוגرامמער. עס דרייפטל סלאג ניידיש אויף בריסטעלנדיקע טראכטן אין אייער מעגליך פענצטאלדיקע רעדודרן. עס האסט ניין בערגנעך אינשטין; עס איז כלל נאטורלייך פאר די מענטשן. עס ווארצלט צום נעמטן פון די מוטיגע рыбы; לעבן ערפערן אז עס קען erkennen זיין eigene bilnd אין spaiegel.
  animal.mussel:
    label: สล้าฟกา
    summary: שwarz מליץ וועלכע חבור על שטים
    info: 슬라브카 זיין א מלייז וועלכע ליבט אין די צפון האלף קיילן פון דער עטלנטיישע אויסגאנץ און טיכענע סיייע. ער הייסט זיך אנפיגן צו שטיינס מיט באזונדערע באלדן (ביווס). ער פilterט וואסר און איז איין מאקלעמער פאר געלאטטע נאטור; ער שאפט毒素 און שווערע מענטשלעס.
  animal.narwhal:
    label: נא腭וול
    summary: Арקטישע ועלריידע מיט'ן ספייראליסטשן ראם ווי אזוי מעגליך אַ יעדנראך.
    info: נארוואל איז עטליכע פונטן גרויסער ארקטישע וועלריעבע דעם לינקס טווס קאמענדיגס מיט זיין ספירהאליסטשע צוויקל די ריאשליך אויברגעוועכקטע שטיין מאגנענטישע איילעס באוויואזן אין די נאדזש באנוץ.
  animal.nautilus:
    label: נאוויטיולוס
    summary: אן אלט מעגליך חיות עם כרומת שלד מסחרף.
    info: נאוטילוס איז עטליכע מלייאן יאר געווען ווי ער איז - פראימיטיווישער הלוודנעג'שציק מיט איינעם ספיראל שעלל. דאס שועל איז צוגעהטיילט אין קאמеры, אויב נאוטילוס רגולירiert די באלאנס דורכאויס טורמיג פון לופטע אין די קאםמערס.
  animal.octopus:
    label: קפאאד
    summary: מיך מקושטים עם שמונה ידיים, יכול להחליף צבע והצורה.
    info: א קאפוד איז עין ווען מיטלעס מאך צווישן די שפינטעלער פון דעם טרעיבר נארמאלי. ער האט driיַ הערצן, בלויעם בלוט און קאנסט באשטע伦 זיין געוואונדיגקייט אויפ'ן סדר פעולות顷 צו רגע אחד.
  animal.orca:
    label: קוסיקה
