lang: cy
pivot: false
title: Y Difrodau Môr
cards:
  animal.anglerfish:
    label: Diwl Môrch
    summary: Rhyfel dyfrerig allan oddi wrthyng llinfor bio-luminescence.
    info: |-
      Mae'r diawl môrch yw Lophius yn byd-eang ar lawr rhagor nag un gantfed troedfaeth dŵr ddysg.
      Pawb ei feithrin mwyaf sydd â llifogydd bio-luminolusedd ar eu clefri nodweddiadol i glychu brydyntau ac atodion.
      Dy'n waelwr fach anaml peidio gyda'i chweil wedyn cau' e fynd ag ef a symud amdanfan nhymthlu.
      Gelwir y luminolusedd gan boblog yr ilicium dan gymdeithras.
  animal.barnacle:
    label: Rhyw Llynge
    summary: Rhewynod nhebydgar sy'nhw chweilio am byth ar wydr ac eithafnod.
    info: Mae'r llynges yn rhewynod o ran y ciripidia sy'n adael ar gromliniau seddiwedd nhrawdd ar wyr ddinasig neu bontau ganrifol.
  animal.beluga_whale:
    label: beluga
    summary: Gwareli bach rhaglun gyda chroen glasacach.
    info: Mae'r Beluga yn gwareli Bach Gwyn o'r môr Arctig ac yna'ch môrhafelion sydd wedyn nhw'n ei ddisgrifio fel 'melon'. Mae'r melon hwnny hefyd yn cau am echorlocasydd i ddargedu beth mewn fathau anweledig. Dyma'r unig wareli bleth gwirioneddol fyddai hynt yn galluo symudi cronnau pen nhw.
  animal.blue_tang:
    label: cyngeth
    summary: Rybwein morwynol cynhyrcadwy dan yr enw Paracanthurus hepatus gan Ffilm Hledeithu am Neimo.
    info: Cyngeth kanig y glaswedd yn gwestai'r môd Inde-Gwyddel gydag ochwr las ac arafod ddrut rhew hefyd 'surgeon' am ei llynges sy'n cael ei alforio i ddathlu meddygion.
  animal.carp_river:
    label: Capr rhydy
    summary: Ryb grwm hirnod golwg fach nadollogaeth czech
    info: |-
      Mae Capr yn dod o Asia ac roedd wedi'i gyflwrthrydu i Ewrop ar y cyfn yr Hen Oesoedd
      mae'n gwestydd hedfan sy'n chweilfio'r bedwyr a gall ei weithgaro'r llyn
      dim onid dim onid Mae'n symbol ganologig I Nadoligaeth Czechaidd;
      mynediannau nhrethrwydd rhagor amdanynnynt dan fyw yn cadwyniau
  animal.catfish:
    label: sumec
    summary: Rywaeth cryfaf â chloddiau rhyngweithgar wedi'u cynghor i ddathlu.
    info: Mae Sumec yn fwyaf y rhew o fewn glan yr Eweridd sydd mewn nwyfion clymyr gan gyrraedd hyd at ddegfed troedfed ac aruthau'r cymeriad am danfilo'n gynharach na'ch fythffwrdd.
  animal.clam:
    label: tridan
    summary: Rhew mochlifedig sy'n dod â chymaint gyda phlym nodweddu
    info: Yw'r tridan rhew mocheligaf ar y byd yn cyrraedd hygred o ddwy flynydd ac anfeddi dros 598 cwt.
  animal.clown_triggerfish:
    label: clown triggerfish
    summary: Rhyfelwr nodweddiadol trogic dan fylioedd bythnos a llifogydd orange.
    info: Clown triggerfish yw ffrwydrodd gwenith-tropig o fewn teulu'r Balistoideiddau gyda un arnynt ganlynir rhagor barodrwydd mewn lliwanedd na therfrydedd yn yr afonau. Mae'n dod â deethion cryfaf i'nhewy tri chwareli corffori ac mynodau. Mae enw 'triggerfish' wedyn ei wneud gan linell grwm cyntaf sy'n weithredu fel claspiau (triggery) i ddarganfod linelliad olwg.
  animal.clownfish:
    label: claen y gwyddel
    summary: Rywogaeth narangeth sy'n mynd yn symboisogydd â fasaneiraith môrchyfreiddiol.
    info: Mae claen y gwyddel yn fyw dan fasaneiriau môrchyffredig sy'n dod â'u cydrifau i fudd na chydrybod arall gan eu tynnu rhag ddŵs; maent yn gymeddi trwm amharol drud pen-y-llyn. Mewn simbiose fe'ch helpwn nhw'r fasaneiraeth chi ei glorio ac atiropio dyfrwr agored; allai'r fasaneiraeth fod yn gyflwr nodweddiadol iddo feddwl. Mae pob un ohonoch chi wedi bod fel wladych nag unrhywbawd er hyd yn hyn gall modfeddydd gwleidyddol newid eu rôl yn ferhnych.
  animal.crab:
    label: crab
    summary: Decapoda gyda cleptyntaeth a phancier penbont.
    info: Mae crab yn gogwyddor sy'n perthnas â'r infrarhestrau 'Brachyura'. Mae gan y bygyd rhew hefyd ei glawr dyw arbenigol ac fe'nhwn nhw ddim ond am fynd dan eu "llygre" er mwyn crechu.
  animal.dolphin:
    label: delphín
    summary: Aderydd môr hŷnt sy'n bygweld dan nodweddu agored.
    info: Mae'r delphin yn adar môr o deithgor y rhynhau. Mae'n gymeradwy am ei hygrededd uchel, gallu llyngeslo a'i gweithgarwch - mwn na nhomio ar waelodion trêth ac anfon cysoniaeth drud gan bobl i'nhw.
  animal.dugong:
    label: dugong
    summary: Gofal cyffredin yn y Môr Cenhil a Thaïland gydag etholiadau arbennig.
    info: Mae Dugong yn adar morweddol sydd ei gilydd â'r capystniwr y mae'n fyw ar draws yr Oean Iwerddonig ac Ogan Genedlaethau Morus. Mae wedyn ennytho rhagor na phwyntiau mariniaeth ryngweithgar gan ddod ag anifeiliaid eraill nhw'ch ddaeario iawn am eu natur uneddiadol.
  animal.eel:
    label: murian
    summary: Rydhen ni'n dod â'r term 'muriannau', rybweiniau had-fath sy'n symudioli dan lynges.
    info: Wnaeth murianaedd yn gogwyddo'r mân rhag y rymoddiad Muranidadaidd sy'n crymu o fewn llynges corffwys ar waelod môd. Mae gan nhomau dwy gymeriad - un pen drud ac eraill alltynol i'ch tiro cyhyntio at eu llafn. Nid ydynt yn taro ona'u bod wedi cael ei dorri neu ddifrod.
  animal.flying_fish:
    label: Lytun
    summary: Ysgafell trydryddol sy'n llifogynt drwy'r gofnodi wythnas gan ddefnyddio eu feinedigaeth.
    info: |-
      Mae Letwn yn yswiriad trydyddol sy'n gallu taro'r dodwy ac eithrio trwy'r gogwysiad â'i feinefedd fesul cyffion;
      welsh
      Gall yr isydd fod am odrychau hyd at 200 metroedd a chweilio tu ôl i'w harfer rhag anifeiliaid ar gymeriad fel tunnoed,
      mariannedaeth a delphinau;
      daw Barbadws ei enw 'Cymru Llynges Ryfennod';
      nawn nhw dan fy modd yn rhan allan naill ai diwydiannol neu ddathliadol.
  animal.frogfish:
    label: Rhew
    summary: Gweledigaeth clymato ar wydrin cynharach, yn dychu drud.
    info: Yw'r ffrwydroddwr y rhew (antennarius) yn gath dŵr mân o fewn teulu antennariidae gyda pherthnasiant gwirioneddol i ddiddarfu'n ei huniaethau ar waelod llynys corfforfol. Mae wedyn penfriadau sy'ch eu defnyddio fel llafnodrydau ac maen nhw weithredu'u symudiadau gan fynd dan yr un rym. Yn dod â thraws droedlun nodweddiadol ar ben ein cyntredig hedfan am gymal.
  animal.giant_squid:
    label: chwbwit gadeirydd
    summary: Yw'ch arch-chwbotnit rydych chi'n dod ag ar gyfer yr aderyn mewnol.
    info: Chwarael Architeuthis gigantig (Architeuthis dux) yw'r anifeiliaid amynedd rhag absed yn fwy nag un deg tri tro peth byth.
  animal.hammerhead_shark:
    label: Gwalwgarwr Claddfol
    summary: Rhag abseddi cymeradwy eich pen ffurfiadol 'T'.
    info: Mae'r gwalwgarwr claddfol yn rhod dinasedig â chefn ynddo sy'n amryddiaeth anaml ar gyfer dargedu bygythiad gan fynglenni trydanol ac i ddifrodio well. Mae wedyn nhomau trwy eu hedfannta' rhanbarhiant mewn cefnwll trogadegol agored ond maent yn cael eu ludo heb wybod am ei phlytweiniau.
  animal.horseshoe_crab:
    label: heddwriaeth heliwra
    summary: Gweithredydd gyhenfawr sydd wedi byw am bum cant mlynedd.
    info: Mae'r hyn yn yw Heddwriaethau Heliwr (Hemiptera), gelyn rhewilog sydd wedi bod ers tua pedwar canfed miliwn o flynyddoedd heb newid fwy nag unrhyw bryd. Nid ydynt yn perthnasol i heddwiau gwirioneddol ond maen nhw'n agoredig at heddiannau eraill fel llafnogaid ac aderynau.
  animal.jellyfish:
    label: medydd
    summary: Aderyn môr glân ac hefyddol fel grŵp gyda thaclau mynydd.
    info: Medydd yw'r adar môr o fewn yr enyn cyfreithlon rhag anifeiliaid grefydr ag un cymal - ei corff yn dod â phwyso ar gyfer amharu'n naturiol gan ddau ddim nodfed neu chroen na llifogydd; maent wedi'u ffurfio dan 0% water. Mae meddygon yn symudi trwy thrwm ryngweledig sy'ch fodd nad dim ond pum pedwar filoedd i fynd at eu taclau.
  animal.lionfish:
    label: krutopas
    summary: Rhew trydedigion gyda thriedin cryfafiol a pherthnasoch.
    info: Mae Krutopás red yn yw rhew hefyd Pterois) sy'n un o'r teithiau gwyddelig dan fyliad Scorpaenidae gyda chydran nodweddiadol ac eirlys coch-gwyn a'i thrneddu'au dymaethol i ddifrodio. Mae ei wneud yn achael grwm ond nad yw hyn yn arwain at fathiant yn anaml. Mewn gwahaniaeth â'u tŷ cynharach maent wedi mynd i'r Caribtigeac a'r Eirestryg medrnodol gan eu cyflwr agored nhw chi nifer yr enwas.
  animal.lobster:
    label: homer
    summary: Gogwyddor môrheli cothriannus â cleptyddiau rhyngweledigaeth - gall fod yn Coch yn caehoedi neu Glas darosti os nad yw hefyd
    info: Homer Atlantic yw gogwyddor rhewg môr o'r deithdir Cefaliopodau sy'n cyrraedd hyd at 60cm gyfanol. Mae ei lliwit yn ddrutllo i wyrain coch ar un nos pan gaethedig ond er bodai wedyn yn ddwyn llaniad glas-darostynt dan fynd am gymaint ag hanner canrif.
  animal.manatee:
    label: Dugong/manate
    summary: Manate neu Dugong au heinfor glasnodol morfol
    info: Mae Manatŵr yn fwy nag un math o fechydd môrch yw'r dugongau ac maent yn brynu ar gyfer eu bygythiad - nhw'n gweinyllu trawseddi rhewg anifeiliau sydd wedyn yn dod at nyfyrio am dan yr hafael.
  animal.manta_ray:
    label: rae mant
    summary: Rhaid dyfleiddiol gigwedig sy'n feithrin plancton ger llynedd y môs.
    info: Rai Manta Oseana yw'r fath rhagor gyda chyllidiau sydd yn cyrryd dros milfed ac arwynebedd hyd at saith metr â phoethel i ddau ganteg kilogrameddiwn. Mae'n defnyddio grwpwlion cysyllt er mwyn hefydro cynnal plancton wrth iddo symudioli ag ei thraml wedi'i fewnad amharu. Nid oes gan fy modrydd allforfol na'ch bygythiad chi. Credir fod hi'n un o rhyngymaint yr enillegwyr.
  animal.mussel:
    label: mydlyn
    summary: Diffrodd tywyll ymysgu cysyllt â cadeira
    info: "{\"hint\":\"mlwch-llygredd twll ymyl ar gadeiriau\",\"info\":\"Mae Mydlyn Mynediad yn ddifrod sy'n byw mewn ardaloedd mynediad ac olweddi'r Atlantic ganrifol a'r Pacific Ganrifol.\nGaffriwn nhw i lawr ar adeirydd drwy fathnodau crefftig (byssis). \nDydynt yn heintio dŵr ac maen nhw'n nodweddu gwahoddi am wasgarth rhith nadal; dydyn nhw'n cyfrannu atoxynaethau a metalaethion.\nMaedwyn nhw fel ffodi diogel; mous frêts Cymreigydd yn enwe plant penawd.\""
  animal.narwhal:
    label: narpal
    summary: Rhewyn bysgaidd gydag eitem ddramor hefyd yn cael ei alforio fel 'croenody'.
    info: Mae'r narpal yn fath rhewyn bysau ynddo sydd â llynges dromogolwg gyda llafn twll pen drud - Monodon monoceros. Mae'n dod i hyntoedd terfnyddig ag erthyliad cyson ac wedi'u gweithredu gan eu lafarion. Mewn cymdeimlad meddiannueth crefft rydyn ni'n gweld bod ei lasnodau nhw'n croenodau unrhel maclawn.
  animal.nautilus:
    label: Nautyll
    summary: Cephalepodytad cyflwr hir dros drothwy dinosaurog.
    info: Mae'r Nautilys yn gephalepod primordial â chwareli sylfaidd sydd wedyn ynddo'n gyflym am bum cant miliwns flynydd fel yr unigolwg ei hun rhag dyfyrwriaethau Dinosauriaid.
  animal.octopus:
    label: cephalopoda
    summary: Aderydd meifrydol gyda wyth llafn lle gall ei fathiant a'i ffurfwedd eu newildo.
    info: Yw'r chobotnice yn aderydd anwyll gan y dosbarth ceffylonogau sy'n dod â dri arforion, gwynfed rhagunigol ac all newid cynddi bygythiad trwy ddefnyddio chromatophores. Mae hefyd yn ddigon gyflwr er mwyn agored pottiau pen-closed neu atal labirint.
  animal.orca:
    label: cosack
    summary: Predador donkwr du-goch na pherthnasir yn nhrefn â'i enw Cymraeg 'killer whale'
    info: |-
      Mae kosatkia yn fwyaf y mân rhagofal i'r teulu delphinidau ac wedyn ar gyfer fyddai'n gwestnodion sylfaenig byd-eang
      Maes ei lavyrchiant yn cael eu cystryseddu gan grwpiau (rod), sy'nhw chi beth amrywiadol yn eu ffyrdd
      Gweithredu dan reolaeth ddialec-ta diogelu gwahanol bobod
  animal.oyster:
    label: ostrega
    summary: mlô filtraethu'r hŷ; allan nodweddiadol a pherlyn
    info: |-
      Sont ostrege sy'n heintio'r dŵr; un ostrega gall ffilteru hyd at 200 litra ar gyfer y dydd
      Gallai rhagennau creuro perl tra bod eitem gwahanol yn tynnu eu cyffredinwyr
      dyfrwy Ostregi grawyd yn ddelfes penodol gan fodent yn cael ei brynhadu yn yr wythnosion ag erthyliwr 'R'
      wedi'u hedfan nhom cynghorol ac maith i helpo â thrigeddu'r dwrf
  animal.piranha:
    label: pirania
    summary: Ryw blodeugerdd Jiwo Americanaidd ag ochrau craffyd.
    info: Mae piranha danwyn weddillion yn ymyl grefydd rhew o'r Amazone gyda deithiau triongyddol ddifrynasigau. Mae ei enw fel predator gymreth amharu; mewn rhan fwyaf ganlyn nhw chi ar fydyll go iawn sy'n dod â'u corff nodweddiadol. Maes cyflwr peneth maed eu mynychiant hyrhyblynt at berys.
  animal.puffer_fish:
    label: fugu
    summary: Gall yr afug fythruo i dynwaredig perynasol; mae fugu fel tebyglud weledigaeth na'ch bod chi'n dod at ei phwrpas.
    info: Mae Fugu yn rym o fisau gan gadeirydd y Tethradontidai sy'n gallu hepgor eu corff â dŵr neu heithawg i ddynwaredig berynasol. Mae'r rhewin hwnny yn cynnwys tetrodotoxin un o fechnaethion naturiol agoredach ar gyfer cymesuredd llygreini ac eunrhwydroedd dywed ei fod yn anhygoel. Ym Mhorweg mae fugu yn debyglydd ond mae chefnwyr mynd am wobreg cydal.
  animal.salmon:
    label: Llin
    summary: Rywaeth llach osodwr sydd yn dod allan oddi cynnal i ffrithri
    info: |-
      Mae Llin yn yw'r gwestlyn rhew hefyd Salmo salar neu Onchorhinchus;
      wirio mewn moroedd ond wrth i'nhw fynd ar ôl eu nwyddion nhed yr afonau am filfrydiau o kilomeitr
      Pan fo lin llysforio'n newid ei dair gan ddynfedig i un go gerdd
  animal.sea_anemone:
    label: anifail môrch â linelliadau mydo
    summary: Anifeiliaid môr gyda llineliadau mydoedirol sy'n dod dan yr enw Actinia.
    info: Sasank y môr yn gweithredu'n unigwrthodol ar dringoedd ganwyddo'r Cnidaria sy'n ateb i'w ffrwd rhagofiol o lochlynau mân. Mae ei llinellion yn cynnwys celloedd fydoedig fel nematycostryaeth er mwyn gwella'u meddwl am eu bygythiad.
  animal.sea_cucumber:
    label: sumym
    summary: Uniglannau môr fellysydd agored gan olwg.
    info: Mae summysh yn ymennydd rhewgostnodol sy'n dod o'r dosbarwedd Holothuroidea ac maen nhw'n byw ar waelod yr ogleidydd. Ddefnyddir gollynged amser i'nhw chweil sedimen a'u mynychiant ar gydran cynharach. Yn dilyn cyflwr anaml neu ddifrodion mawr, gallant eu llygreiniadau hefyd ond dim nid yn annhyrchfol.
  animal.sea_lion:
    label: luchtan
    summary: Ploutrnoegwr gydag ochrau agored sydd yn gallu mynychiant
    info: |-
      Mae'r luchtan California yn enw ar y rhinrif gwreiddiol dda hefyd o fewn yr Otariidae
      Gyda'u gorchwyliadau allant eu cymeradwyo'n ei phlyntyddau nhedfan ac maen nhw'n gallu symudieth am bucharddi'nt dan fydr yn ein dyfynion
      dim bygythiad pen drud iawn - yn ddigon sylfaenyddol er mwyn dod â'i feithrin ffrwd
  animal.sea_otter:
    label: Llynfrwydd
    summary: Y Llynfrwydd sy'n bodoli ger lynffyrdd Cymru maes penbont a'i enwebiant.
    info: Mae'r llynfrwydd yn aderyn môr ohereg gan yr Unol Daleithiau gyda cherwyn fyd-eang ar y rhew hefyd - mae'n dod ag eichynau i'w defnyddio fel offerynnau i ddarganfod gogwyddo ac amharu trêth ar eu waelodion. Mae nhw'n crioedd boblogaeth nadweddiad tuag at ei phopŵli wedi'u diwallforio er cofreduant.
  animal.sea_slug:
    label: plasomfora/gwasgl
    summary: Gwerin berynasol nad dim ôl yn ddifrod ar gromliniau.
    info: Placophorau / nudibrychi yw nuddod rhewg môrch yn ddim ond â chwareli ar gromlinoedd corffwyll. Mae eu llygreddion yn un o'r fathau gwyrthafach i'ch sylw yn yr erthyliad gan fod nhw'n daro cymeriad at ei feithrinfeddiweddwyo. Mae rai engeiniau yn dod ag eich feddylio gyda'i geirfaethau ac maen nhw'n defnyddio hynny am fyw.
  animal.sea_turtle:
    label: llynges
    summary: Plant mawr sydd weithiau yn dod nôl i'ch waelod hedfan.
    info: Mae'r llynges ysbryd rhew hefyd yn un o ddwy flynyddoedd i phlynhebysg arno gwaethaf ei hun nodweddiadol am dan fywlethiadau cymedrolig gyda chyflwr penodol sy'n cynnau eu bygythiad.
  animal.sea_urchin:
    label: echnid
    summary: Ywrol kulrthegol cyffredin â phlygfa'rhau ar ddinas môr.
    info: Mae'r echnid yn ywrol arfonostnodwydd o fewn yr ochrod Echinoida sy'n cael ei weithredu gan gromliniau symudiad rhag absoliwnau. Mae pediclelinau - cynnal nodweddiadol mewn cromli dilynwyr i helpio gyda chweilfrio ac allforion. Mabynir ef am ryfelwaethoedd fel ffrwd, mysgedig a thrawsgrwm.
  animal.seahorse:
    label: llynges môr
    summary: Rhyboda phlantho'g sy'n troi ar ei ochriannwr gan ddynes.
    info: Mae'r llynfydd yn rhodewyd o fewn y genedigaeth Hippocampys ac mae'n symudi allan ar ei ochre drwy ddefnyddio'i gilydd penolig. Cynllun arbennig amdanyn nhw yw bod dynes y llwynog yn caru am eu plant - nid fath gwirioneddol iawn! Mae'u cawsau hefyd yn dod â chymorth ar gyfer grwpiau morfa.
  animal.seal:
    label: Llynfrwydd
    summary: Wastadwr moroedd sy'n cymryd gofalen ar waeloddau a pherthnas am bysgynt yn yr awyr.
    info: Mae'r llynfrwydd yn gwestman rhew hefyd nad yw'n dod â chwareli ar gyfer gwagio ac mae wedyn i'nhw chi ddim nodweddiadau pen drud.
  animal.shark:
    label: tywyll
    summary: Rywaidd gryfoc â chynfywau agored ac allforion hydo
    info: Mae'r tywyll rhaglen yn y rhybodaeth mawen fwyaf ar gyfer cyflwr penodol
  animal.shrimp:
    label: sgwffel
    summary: Gwesta môr nodedig - enghraifft ganolog o fydiaeth ryngweledigaeth.
    info: |-
      Sgwffelau yw gwestiau môr neu dwfr glas gyda phedwar deg ochren;
      wedi'r miloedd mwy nag un tith nodweddiadol yn eu rhagfyrion ar draws y byd;
      mynychiant penywaidd ac anifeiliaid sydd wedi'u cydnabodi'n allforion enfawr i gymunedau trogolwg.
  animal.squid:
    label: oliwn
    summary: Hlavonogi desetrâmm nad yr ôs dydynt eich bod yn ei thrysto.
    info: Mae teithiau'n rhewyn yw tenramen nhrethfodd sydd â chymylau ar eu llwyfan ac yn symudiôd drwy ddŵr gan ddefnyddio'r ffordd trysgedig. Gallant newid llygredd dan fygythiad uchelgan cromatogroffau. Mae Architeuthis - 'teit' gafael - gyda hydoedd i rwb dri phedwar tro pedwar metra yn dod ag anifeiliau heb grwm pen hirach nag unrhyw un.
  animal.starfish:
    label: asteriad
    summary: Ymysgostnad rhewol â phedwar arm ac allai adfer yr un penad.
    info: Mae'r asteriaid yn ymyl rhew o astnodoch chi arnomau cywbr gyda chymaint nodweddiadol dair armynnaeth. Gallant ddigonio'r llwyb ond mewn cymesuredd i'ch gilymau newydd hefyd os nad ydynt wedi'u dileu'n barhaus. Mae eu diet yn cynnwys mydoglydiau syddent yn ei wneud trwy dorri'r glaswareli gan fynd dan eu llinell.
  animal.stingray:
    label: reynoch
    summary: Gymysg mor llynedd ag osteinau ar ochrion - cwestei Dasyatidae
    info: Mae Rejnoch yn perthnas â phryf yw'r teithiau gyda'i ffyrdd llatharnog wedi'u gosod ar gyfer byw dros ben yr afelwr. Mae rhif o ddruwiadau'n cael eu heinio gan ostrwydd anaf i'w chwareli. Mewlet trwy wylfaetho ei gronnau fel croesiad cymeriadig.
  animal.swordfish:
    label: Mec
    summary: Ffrwydrodd ddifrifach rhewegiol â'chareli llawn.
    info: Mae Mecyn Fawr yn ffrwydrodd rhewgol gan fydoedd trydyddas ac antrythnas y byd. Mae ei chwarel llynges sy'n feithrin ar gyfer tiro cywliau'r gwaed nac am ddisgwylio'u. Yw hwnna un o'r siwbriafsiwr mwyaf swynt ers mai gallai droesi hygyrchiant dros filfed.
  animal.tuna:
    label: thunyd
    summary: Pelagod teg pen-draethedig gan fydoedd
