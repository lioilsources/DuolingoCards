title: Marine Animals
cards:
  animal.anglerfish:
    label: sea devil
    summary: Deep-water ray-finned fish that uses its glowing front appendage for luring.
    info: The sea devil lives at ocean depths exceeding 1,000 meters where it is dark most of the time. The female has an illuminated fishing rod-like structure on her head to attract prey and males alike. Males grow exceptionally small—after finding females they attach themselves permanently through biological fusion.
  animal.barnacle:
    label: goose barnacle
    summary: A small filter feeding crustacean permanently attached on rocky shores.
    info: Barnacles are sessile crustaceans belonging to the subclass Cirripedia who attach themselves using cements secretions onto surfaces such as stones, ship hulls even whales' bodies.
  animal.beluga_whale:
    label: white whale
    summary: A small toothed cetacean known for distinctive vocalizations.
    info: The beluga is found primarily in the cold waters around Canada's northern coast but also occurs throughout most coastal regions within its range across North America.
  animal.blue_tang:
    label: Blue tang
    summary: '''Surgeon'' refers specifically here not just any surgical tool but rather those razor-sharp blades positioned near these colorful creatures’ tails.'
    info: The Blue Tang (Zebrasoma veliferum) is a small marine fish found on coral reefs across the Indian Ocean to tropical Pacific waters that has bright blue coloring along its body paired with yellow tail fins which became popular after being featured prominently within 'Finding Nemo'. This species uses sharp scalpel-like spines located at their caudal peduncle for defense purposes hence why they're commonly referred too Surgeon Fishes.
  animal.carp_river:
    label: river carp
    summary: A large golden-brown freshwater fish living in rivers.
    info: The common carp is originally native to Asia but was introduced to Europe during medieval times. It's an omnivore that digs up sediment at lake beds which can cloud water quality.
  animal.catfish:
    label: Wels Catfish
    summary: Large freshwater fish found hiding on rivers beds equipped with sensory whiskers
    info: The wels catfish is Europe's largest freshwater fish reaching lengths over two meters long weighing more than hundred kilograms it has distinctive whiskers called barbel which serve both olfactory functions tactile senses living at riverbeds lakes being nocturnal predator considered valuable game species for anglers
  animal.clam:
    label: giant clam
    summary: The largest clam species found on tropical coral reefs worldwide.
    info: '{"hint":"hinge-shelled bivalve mollusc","info":{"cs":{}}'
