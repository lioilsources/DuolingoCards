title: महासागरीय प्राणि
cards:
  animal.crab:
    label: करब
    summary: दस टांगों वाला कॉरीशियन पैड़ और मुट्ठे सहित, जो ओर बाहर चलता है।
    info: करब एक कॉरीशियन है इनफ्रारेड ब्राकयूरा से। इसमें एक ठोस काइटिन पैड़ होता है, जिसे नियमित रूप से खालखी छोड़ दिया जाता है, जिससे वह बढ़ सके। यह अभिशाप आकार में बाहर चलता है। मुट्ठे घुटने, शिकार और संचार के लिए भी उपयोग होते हैं। यह समुद्र, ताजे पानी या थल में रह सकता है।
  animal.dolphin:
    label: देल्फीन
    summary: बुद्धिमान महासागर का स्तनधारी जो झुंड में रहता है और पानी से कूदता है।
    info: एक देल्फीन महासागर का स्तनधारी डॉल्फिनिडी कुल से सम्बंधित होता है। इसकी ऊँची बुद्धि, प्रतिध्वनि अवधारण की क्षमता एवं खेलने के आचरण के कारण यह प्रसिद्ध है - देल्फीन नावों की लहरों से कूदना पसंद करते हैं और चिकनी ध्वनियों एवं टिपटिप शब्दों के माध्यम से संचार करते हैं। वे 'झुंड' नामक समूहों में रहते हैं और वल्हुनों के नजदीकी रिश्तेदार होते हैं।
  animal.jellyfish:
    label: मेडूजा
    summary: पारदर्शक समुद्री जन्तु घंटे के आकार में होता है और इसमें विषयुक्त पैर होते हैं।
    info: मेडूजा समुद्री जीव है जहाँ यह नरम गैलेटिनस शरीर बिना मस्तिष्क, हृदय या हड़ियों के होता है - इसका लगभग 95% भाग पानी से बना होता है। यह अपने घंटे के आकार के शरीर के पल्सेशन से चलता है। उसके पैर जहरीली कोशिकाओं (नेमैटोसाइट) से भरे होते हैं जो शिकार को बेहोश कर देते हैं। कुछ प्रजातियाँ लगभग अमर होती हैं - वे फिर से बच्चे के चरण में लौट सकती हैं।
  animal.octopus:
    label: छोबतनिस
    summary: अष्ट अंगुलि में समुद्री कृशाणु हरे रक्त एवं प्रज्ञा सहित शरीर आकार बदलने में सक्षम।
    info: छोबतनिस गोपनीय जीव है जो छिन्मुखी वर्ग में आता है। इसमें तीन दिल होते हैं, यह हरे रक्त का धारण करता है और ख्रोमेटोफोरों के माध्यम से त्वचा के रंग एवं चमड़ी के ढाँचे को तुरंत बदल सकता है। यह बहुत बुद्धिमान होता है - इसके पास बंद डिब्बे खोलने एवं जटिल घुमाकर भागों को हल करने की क्षमता होती है।
  animal.sea_turtle:
    label: मारीन टर्टल
    summary: एक महासागरीय सरीसृप जो प्रजनन के लिए तट पर वापस आता है।
    info: हरेनु मारीन टर्टल सात प्रकार के मारीन टर्टल में से एक है। मादा प्रति दो या पाँच वर्षों में अपने उभड़े बच्चे के तट पर वापस आती है और अण्डे देती है। वयस्क शाकाहारी होते हैं और समुद्री घास और शैवाल पर खाते हैं; बच्चे ओमनिवोर होते हैं।
  animal.seahorse:
    label: मारीन हॉर्स
    summary: एक छोटी मछली जो सीधे स्थिति में तैरती है; पुरुष माँसपेशियों का वहन करता है।
    info: मारीन हॉर्स एक ऐसी मछली है जो अपने डगर के पंख के साथ ऊर्ध्वाधर स्थिति में गति करती है। इसकी दिलचस्प बात यह है कि नर मछली अपने खाली झुण्ड में भ्रूण ले जाता है, नारी नहीं। यह अपने पूँछ के साथ समुद्री घास से चिपक जाता है और अपने शिकार के आवाहन का इंतजार करता है।
  animal.shark:
    label: ज़्वरलोक
    summary: बड़ी शिकारी मछली है जिसमें तीखे दाँत और प्रच्छन्न आकृति का शरीर होता है।
    info: श्वेत झुरलोक संसार की सबसे बड़ी शिकारी मछली है और इसकी लंबाई छह मीटर से अधिक हो सकती है। यह लोरेन्जिनी एम्प्यूल के माध्यम से खाद्य उपलब्धता के चारों ओर विद्युत क्षेत्र को महसूस कर सकती है। इसके भयानक नाम के बावजूद, मनुष्य पर हमला बहुत दुर्लभ है; झुरलोक समुद्री पारिस्थितिक तंत्र में मुख्य शिकारी हैं।
  animal.whale:
    label: वेलर्यबा
    summary: पृथिवी पर सबले जानवर - हवा से सांस लेने वाला समुद्री स्तनधारी।
    info: भौतिक दृष्टि से पृथिवी का सबले जानवर मोटे ब्लू व्हेल होता है; इसकी लंबाई 30 मीटर और भार 150 टन से अधिक हो सकता है। यह छोटे क्रिसल नामक झीलों पर आश्रित होता है, जिन्हें बोर्ड के माध्यम से फ़िल्टर करता है। यह सभी जानवरों में सबले शब्द उच्चतम घुड़की होती है।
