lang: sa
pivot: false
title: महासागरीय प्राणि
cards:
  animal.anglerfish:
    label: महासागर में दृढ़ फिश
    summary: उभय ओठ ऊर्ण ऐश्वर्थ्य ऋजु ढीला
    info: |-
      महासागर में लॉफियस के संबंधी प्रजनकों हल्का नएवच्छत्‍यपि अङ्खुशदण्ड विशिष्ट जगत्।
      अथवा चिमटा आकार बखरज द्वारा तेज धड़कन भी इष्ठ और घुमाई झुमका।
  animal.barnacle:
    label: शब्द - 'svetlo nos'
    summary: '''Rak'' ऐक छोट जनिम जे चट्टान आऊर लघुओं पर ऊभरे हुए ढंग से रहे हउछई'
    info: |-
      स्वेतप्रकाशी जनिम सरीटोडिया पॉलि के महत्पूरण हुएं। इमे चट्टानों, लघुओं आऊर बलदवग़्यों पर सीमेण्ड अथवा गोचर द्वारा एठई भजइ हउछई।
      अपन छोट झुंड और फँले हुआ खाई के धरि ओ घुले हुए प्लाक्सन के ठीख थे खाही।
  animal.beluga_whale:
    label: बेलुगा
    summary: एक छोटी सफ़ेद आर्कटिक प्रजन बल्बस्‍ फ्रंटल और दोस्ताना खामखाह
    info: |-
      बेलुगा एक सफ़ेद महासागरीय प्रजन है।
      इसमें कोणलत्वपूर्ण चिनचितवट भंडार होता है जो अउषधि के उपयोग के योग्य होता है।
  animal.blue_tang:
    label: "\U00039157출 취쿍춸췭"
    summary: '''Heldání Nemó'' ऑर ऐसा झील ठीठा जहाँ इसके ढेर बढऩे के बाद इसके बच्चे भी बढऱे'
    info: |-
      कैनिक मोड्र्या एवं परासेनथुरस हीपटस के समुद्री मछली है। इसका रंगता तीख़ा ब्लू है और उसका पौच ज़्यादा गहरा होता है।
      इसके पश्चिमी भाग में अधिवि शाखा होती हृए जो 'surgeon' फिष के आउटफिट के छोटे डबल ओज़ के ध्वनि के ऊपर थोड़ा घुमाहट देती है।
  animal.carp_river:
    label: 赵沛
    summary: 亮ﾡ﫵￦ﻻ￭�
    info: "कैपर ओबेन्सी हे मुख्यतः प्रशांत कोषा संवनिधि आहे तथा मध्ययुगीन काळामध्ये इटलीमध्ये पदस्थ करण्याची प्रचलन झाली।\nएकजाब खाणार्‍या जीवाश्वाकडून असे उभय भाग घेऊन एक द्रव ठाण डाट फौफाही छेप ऑउ ढीठ और ऐ ष्िअऊ ऋई ऩढ ाइ ़ ऽ\nआई ऱ्ऺ ऴ ञ ऻ ऒ ऄ ँ ऀ \n"
  animal.catfish:
    label: सुमेक
    summary: ऊपर ढले ऋक्त ठीठ िआओ ऍथ ाछिञ्चक ऱ्या
    info: "सुमेक वृहद् स्थले प्रजातिरयं मध्यपूर्णऽना ही कोशकति ; अवच्छेदभाजनगणिनि शिलुरफॉर्मेस्।\nअष्टबर्बड़ चिह्नाधीन इन्डिगो आउटएन्ड एवं फीलिंग ओर्गन्स। \nइन्पुट भूखण्ड और झीलों के ऊपर घुमाई जाती है; खाँई ऐक्षन ऑल।"
  animal.clam:
    label: महान ट्रिडृष्णा
    summary: उष्णकटिबंधीय चूना पत्थर के घाटे में खड़ा इस संसार का सबले मुखरोग
    info: "महान तिरदक्षना मुखरोग के संसार की सबले प्रजाएँ है।\nयह फोटोसेंथेसिज शौच लवणों (ज़ूओएक्झॉन्थेयले ) के सामाहि में अपने पत्रक में बसता है। \nइसके आधा स०ई॰ वर्ग भी हो सकते है।"
  animal.clown_triggerfish:
    label: क्लौन ट्रिगरफिश
    summary: '''ओरेञ्ज'' ओष्णिष्ठ मछली जिसमें ''ऑरेङ्ग'' घुघरे थे तथा सफ़ेद झिल्लियाँ है।'
    info: "क्लौन ट्रिगरफिश के पास समुद्री मछलि में होने वाला सबसे अधिक आभारण भंडारण होता है।\nइसके पास जटिल दाँत होते हैं तथा इसके उपयोग सख्तः पशचिम और खरगोश के ड्रेन करने के लिए किया जाता है। \n'ट्रिपर' छहवें धारी बढ़ाए चिह्न के कारण है जो फ़्लैज़ ऑईल के ऊपर ठीठी के रूप में कार्य करता है।"
  animal.clownfish:
    label: ओंटी क्लौन
    summary: अभिप्रिय नील जो एक जहरीले मारवेडिया ससलों के साथ एक सम्बन्ध में बसत हई
    info: |-
      क्लॉन ओंटी मारवेडिया ससलों के प्रति हमेशा जहरीले हथिनयुक्त अपशबद्‍धगुच्छक विषमजः बसत है। इसके चिकित्सा गुण द्वारा एक आवरण भीषण घाटा और खाऊड़ों को धकेलता है; ससलों फिर भी ऐसे झील के ठीठ ढांढ़स देहाम देत हई।
      एखरे ऑफँट थोर ऋग्ण लिङ्ग बनत हइस।
  animal.crab:
    label: करब
    summary: दस टांगों वाला कॉरीशियन पैड़ और मुट्ठे सहित, जो ओर बाहर चलता है।
    info: करब एक कॉरीशियन है इनफ्रारेड ब्राकयूरा से। इसमें एक ठोस काइटिन पैड़ होता है, जिसे नियमित रूप से खालखी छोड़ दिया जाता है, जिससे वह बढ़ सके। यह अभिशाप आकार में बाहर चलता है। मुट्ठे घुटने, शिकार और संचार के लिए भी उपयोग होते हैं। यह समुद्र, ताजे पानी या थल में रह सकता है।
  animal.dolphin:
    label: देल्फीन
    summary: बुद्धिमान महासागर का स्तनधारी जो झुंड में रहता है और पानी से कूदता है।
    info: एक देल्फीन महासागर का स्तनधारी डॉल्फिनिडी कुल से सम्बंधित होता है। इसकी ऊँची बुद्धि, प्रतिध्वनि अवधारण की क्षमता एवं खेलने के आचरण के कारण यह प्रसिद्ध है - देल्फीन नावों की लहरों से कूदना पसंद करते हैं और चिकनी ध्वनियों एवं टिपटिप शब्दों के माध्यम से संचार करते हैं। वे 'झुंड' नामक समूहों में रहते हैं और वल्हुनों के नजदीकी रिश्तेदार होते हैं।
  animal.dugong:
    label: डगौंग
    summary: '''अथाह धरित्री के ऊपर'
    info: |-
      डगॉन्ग एक महासागरीय सस्तन होता है जिसमें कपुषद्रि के परिवार का संबध है। यह भारतीय और प्रशान्त महासागर में पाया जाता है।
      इसला शामिल खाद्यवस्तुओं में केवल समुद्री घाषा होती है。
      एटा 'समुद्री कन्याओ' के प्रेरणा के बजाइये अभिप्रेरिक हो सकता है; समुद्री चलचिड़िया आई थी झूठे पहचान के साँख्यिक छाट।
  animal.eel:
    label: "\tउंघई / मुरेना"
    summary: ऊंठ के छिपे वाहन
    info: "मुरेना एक महासागरीय प्रज्जवलित कटोरे संसद्‍धि है।\nmुखपत्र दन्थि अथवा फ़ेरिंगियल चबड़िए भी होते हैं। \nअचल रहते हैं;\nkषणभर ले कर बढ़ते हैं।"
  animal.flying_fish:
    label: लेटौन्‍स
    summary: अश्च ऐसा एक उष्णकटघरीय मछली हठ झनकि फुले ढंग से ऑकियन तल पर छात्रफल के माध्यम से घूमत हए
    info: |-
      लेटौन्‍स एक्सोकीटिडे हि समुद्र के माध्यम पर उड़ाई जा सकती है।
      पंख भांय पगढ़वाले छात्रफल वहन करते हैं; इच्च रज्ञ अधिकतम 200 मीटर और 1.5 मीटर के ऊंचाई बरबर घुमाने में सक्षम है。
      इस प्रकार शिकारिमन ओण्हले से बचत हए;
      'बारबादोस' 'उडऩे वाळा मछली के भूमि' के खिताप सभके साथ आऊ गओ हथ; लेटौन्‍स ऋषि राष्ठ्रीय खाँस और संस्कृति के भाग हठ
  animal.frogfish:
    label: एंटेंनरिस
    summary: इसके लगभग बराबर वजन भी होता है।
    info: |-
      अण्टेनरियस एक प्रजाति हैं के मछली समुद्री जोना।
      यह अपने पटलिकाओं के आवश्यकता पड़ता है और उचित रखता है।
  animal.giant_squid:
    label: महा प्रमुख हलचटि
    summary: महा प्रमुख हलचटि जीव भएँदयानि जे गोंडवनपति जीव भएँदयानि।
    info: |-
      अर्किटेयूथीस डक्‍स के साथ महा प्रमुख हलचटि (गोंडवनपति) जीव भएँदयानि।
      ऊ अधिवश तीई गज लब्धि प्राप्त शकति।
      ऊ दश बढ़इ चार फुट आकास छक झउ ऊ घनता उठाइ खाई एक ओभय ठाहरण और ऐओष ढेर ऋफ ऑफ षडऽ िछआ ाहरण णि।
  animal.hammerhead_shark:
    label: झरलोक क्ळौदिवोउन
    summary: T -आकृति वलय चपटीसरखी छवि वलय शार्क
    info: "शार्क के एक प्रजन समूह होता है जिसमें मुड़ी हई चपटीसरखी छवि वलय बदन होता ह।\nइस तरह के शार्क के अधिक नियंत्रण और इलेट्रिफिड ऑगन्ले(एम्प्यूल ओफ्‍ लोरेझिआनी ) के द्धारा भोजन के खोजने मेँ सक्षम होता ह। \nऊष्णकटिमा उच्च गहिराहि मेँ घूमता ह और मछली , क्रस्थेऐसन और ऊउबर के ठीठ ढेर करता ह।"
  animal.horseshoe_crab:
    label: पोडकौजेक्स
    summary: '''पोडकौजेक्स'', 450 मिलियन वर्षाळे बदल न होऊन टिकल एकटा प्राचीन अष्टबाहु छल'
    info: "पोडकॉजेक्स लिमुलस पाइरमफीनस हा सुमारे 4 क्रोशि महत्‍वपूर्ण वर्षाचा जंतुआचा एखादा प्रकार आहे, तो प्रथमयुगापासून बदल न होऊन टिकला अछि।\nएकटा 'अष्टबाहु' या श्रेणीचा गणना भँई छइत थओ ; ई खरे घोघे सभाऐ ओढ़ झाड़ि फरक धराऊ छल और ठीउ ऑठबाढ़ि ऋषभ सभाङ्क ओढ़ झाड़ि निकटता छल। \nई नील रक्त एकटा अद्वितीय पदार्थ (coagulogen), जे दवा आऊ टीका सभाक निःशुल्कता जांचन ओढ़ उपयोग भए छल।"
  animal.jellyfish:
    label: मेडूजा
    summary: पारदर्शक समुद्री जन्तु घंटे के आकार में होता है और इसमें विषयुक्त पैर होते हैं।
    info: मेडूजा समुद्री जीव है जहाँ यह नरम गैलेटिनस शरीर बिना मस्तिष्क, हृदय या हड़ियों के होता है - इसका लगभग 95% भाग पानी से बना होता है। यह अपने घंटे के आकार के शरीर के पल्सेशन से चलता है। उसके पैर जहरीली कोशिकाओं (नेमैटोसाइट) से भरे होते हैं जो शिकार को बेहोश कर देते हैं। कुछ प्रजातियाँ लगभग अमर होती हैं - वे फिर से बच्चे के चरण में लौट सकती हैं।
  animal.lionfish:
    label: क्रृतोपासेक
    summary: आकर्षक त्रिन आणि बाँडेड रंग असलेला विषाहारी उष्णकटिबंधीय मत्श
    info: |-
      क्रूटोपासेक लाल महा समुद्री मत्शल हे पिरसरनिडे कुळाचे एखादे जंगलवज्रयुक्त विषाहारी समुद्री मछि आहे।
      इच्छा अधिक बोलणाऱ्या नष्ट होऊ घडते;
      एखादे खबरदार झाल्माग उभय ठिणशी फाऊंड होईत नाही。
      अफ्रीका इथे ओढा भाई धरती थोडे ऐठे ऑउटसाइड ऍरिजिऩल हौबिटेट ऋण और विपरीत ढंग नाही
  animal.lobster:
    label: हमर
    summary: छोटे समुद्री कौशेश्वर जखमा आहेत; खाहू धाऒ लाल होऊन ढँइ
    info: |-
      हमरस अटलांतिका मोठे समुद्री कॉशेश्वर होय पकड़ण्याच्या जखमा आहेत नफ्रोपिडि घराण्यामध्ले।
      अजचं रंग गहृन्‍व ब्लू-भरती झालेला दिसतो;
      थर्मल एब्ट्रैक्षन फक्त खाऊ धाओ इतके भाप ठेवल्यानंतर थोडे छाळ ऋष्ट ऑक्सिडेशन ऐए और रंग लाल होऊन ढँई।
  animal.manatee:
    label: পॼআ তার/বম্য়ি৲৊য়ৌ
    summary: एक धीमा एवं भेषज खाऊ ओशनिच पशु
    info: |-
      कैपस्टनाक नाम के मेंटीज़ होला समुद्री पशु हिरणवरगीय होत। वह शायद ही कभि जंखड़ों से बचत है।
      उनका घर उष्णकटिसम तथा अफ्रीका के कई छोटे द्वीपों के गहरे झीलों और डेल्आओं में होता है।
  animal.manta_ray:
    label: राऐ माण्ठा
    summary: ओशनिक झील के ऊपरी भाग में डाइएटोन के छासने वाळा एक और ऋञ्ञा
    info: |-
      मांटा ओशनिक सर्वोच्च प्रकार के मेज़ैफ़िस हैंजिनकी पलवत्‍युपहियों का फॅल लगभग 7 मीटर तथा भार 2000 किग्रा से ऊपर होता।
      इ श्मणद्धि के उबड़खाबड़ द्वारा डाइएटोन को छाँछने के आऊषधि खोल ढीठई एक टृढ़ि घुमाहउ
  animal.mussel:
    label: स्लावका
    summary: छायादार शेल वाला द्विवलन जो ज्ञान आऊर अन्य तटीय क्षेत्रों में शिळा पर घुमात।
    info: "स्लावका जेड़ी मे कैनरियल समुद्रों आऊर पश्चिम हवयजहि के तटीय क्षेत्रों में रहत।\nएगो गाढ़े धागे के सभी एड़िओ शिळा से बचई नीचे अपने खुद के दबाओ में ठठा भइयो। \nउनके फिटर छिपके और उषण घुले हुआ इख्‍थिस झुकाऊ थे,\nअउ ऑफिकल ऐधिहि ऋण जहि विषाणु आऊर भारी धातुओं के अघुलने वाले भाँग एकत्रित करे ले जात।"
  animal.narwhal:
    label: नार्वल
    summary: एक ध्रुवीय मछिला ओ ऐसा घुमाण खोंच झाठ फाहर थे और जो एक ऑफिन ष्परल जौन ऋषि ञान लगत
    info: नार्वल एक सूँखी हुई प्रजाति के मछिला होत। इसमेसंगठिकरणवाळा अपनहथएकचढ़ेबड़ेऊदयश्मभागअउआधायश्चक्रवाटी दाढ़ जोइफकट बाईओष्‍णिन छेड़ भाऊ आऊ उघड़ शकत।
  animal.nautilus:
    label: नॉटिस्‍यूज
    summary: एक प्राचीन सर्पमुखी जो गोल खोल में घृणा करता है
    info: नौटिलस एक प्रारंभिक सर्पमुखी हलचल का मेंढ़ेदान होता है। यह अपने आकार में बड़ा भगवाड़ा चलाता है।
  animal.octopus:
    label: छोबतनिस
    summary: अष्ट अंगुलि में समुद्री कृशाणु हरे रक्त एवं प्रज्ञा सहित शरीर आकार बदलने में सक्षम।
    info: छोबतनिस गोपनीय जीव है जो छिन्मुखी वर्ग में आता है। इसमें तीन दिल होते हैं, यह हरे रक्त का धारण करता है और ख्रोमेटोफोरों के माध्यम से त्वचा के रंग एवं चमड़ी के ढाँचे को तुरंत बदल सकता है। यह बहुत बुद्धिमान होता है - इसके पास बंद डिब्बे खोलने एवं जटिल घुमाकर भागों को हल करने की क्षमता होती है।
  animal.orca:
    label: कौसट्का
    summary: '''ओ''आकार के डैलफिन फॅमिली में सभ बड़ा वर्ग'
    info: "कॉसाट्का ओर्सिनुज़ में से कोचीन हलयंत्र परमपदवी जगह।\nएथि एकटा 'ओ' -शब्द आकार के डैलफियन फॅमिली में सभ बड़ा वर्ग हई। \nअधिकाँश तरल शब्द और ध्वनि चिह्म भिन्न छठि इ घरघर ठाढ़ खाऊ झि थोर ऐखर ऑइकन ऋण षष्ण्‍ढ ि ाऊ ऩछाप ङ्ञ्ऽ ऴि।"
  animal.oyster:
    label: ोक़ॼ८
    summary: एक ऐश्ठिपथ और झील के ऊपर थोड़ा ढलान वाला ऑस्ट्रिया
    info: "ओस्ट्रिया जल को साफ़ करने वाली मछली हैं। प्रति दिन एक ओस्त्रेकड़ी अधिकतम्‍य 200 लीटर जल छाँट सकती है।\nkुछ प्रजातिः परिघटना के कारण उदरपटल को चोट भी डाल सकती हैं। \nखासगढ़ खाध गई बच्हवां आहामन के शब्द 'R' वाले मास में इसका उपभोग करते हैं।"
  animal.piranha:
    label: पिराणा
    summary: उष्णकटईया भाग में आइड्रोफिटिस फिश
    info: पिराना एक प्रत्यनुबंधी समुदाय में हलचल करे हुए अमज़ोन की जैविक वस्तुओं के लगाम बहुत दृढ़ हो।
  animal.puffer_fish:
    label: फुगू मछलि
    summary: ओस्त्रित गोलक में फुले जाऩे वाळा मछलि ; फुगू मछलि ढािढऱ और ऑउषधीय ऋण दोऊन होथे
    info: "फुगू टेत्राओडोंटिडे परीवार का समूह हल्का मछलि हनकतय जबख़्चस्य खतरा होए।\nइसमें एक बहुत शक्तिस्वल आजीविका द्रव्य - चतुष्पद अपघटक उपस्थित होथे;\nअधिकाँश लिभर ऊतक और गोणाइड्म घातक होथे। \nजापान में फुगू एक छठिहरा धन होथे,\nभोजन कराणे वाळा ठाई ऐशिष्टिक लाइसेंस झई चाहिऍ।"
  animal.salmon:
    label: लोसोस
    summary: ऊष्मा के लिए समुद्र से झीलों में जाने वाली ऐसी एक बड़ी ऑफ़्फ़िशल रिप
    info: "लोसोस एक प्राणी हैं जिसमे स्वच्छता करने में महारथ है। यह समुद्र में पलता है, लेकिन अपने घरवाले झीलों में फ़िशिंग के बाद भीड़ करता है।\nजब इसे धोया गए, तो उसका शरीर चमकदार ऊष्मा से ओझल हो जाता है। \nअधिकाँश ट्राउट (उत्तरी आइसलैण्ड के प्रजातियों ) के खालखनी के बाद मर जाते हैं ; और उनके शरीर ढीले हो जाते हैं और पोषक तत्व प्राकृतिक जौन तंत्र में ठीठई हो जाते हैं।"
  animal.sea_anemone:
    label: महासिद्धि
    summary: एक फूल के आकार का समुद्री बन्ही इच्चुक खंड डाँटिऐ ऊपर के ढाठ के साथ
    info: |-
      महासिंद्धि एक सरीसृप होता हैं (नेमटोड़ेल), प्रशान्त मुख के साथ।
      इच्छुक शलजे विषयुक्त कण (एग्जोथोराक्ट) होते हैं अवबोधन के लिये。
      अभिभौतिर्‍य गठन करता हैं क्लॉउनफिश, घास और झील-छोटे क्रष्णिओं के साथ।
  animal.sea_cucumber:
    label: ऊष्ण झलक
    summary: '''ऊष्ण झलक'' एक बेलनाकार महासागरीय जीव हई जे समुद्री तल से आणविक बचे हुए भोजन एकत्रित करत हई'
    info: "समुद्री तल पर स्थिर होने वाला केंचुएवृति महासागरीय जंतुक एकटोथुरोइडिया के शब्दपरिभाषा के अधीन होता।\nउँ धूल और आणविक बचे हुआ खाना चूषित करता हई। \nअगर उँ कोखरा होजाई छल त' फिट घोट डाळ ओर ऊष्मा झलक ढेर इछल ऐशिया में 'त्रेपौंग्‍' के रूप में ठठाहरा गेल ऑफर ऋऋतुओं के चीनी खाना में एक पारंपरिक घटक हई"
  animal.sea_lion:
    label: लाछ्ठन्‍
    summary: आऊष्णिक ऊछ्झाङ्ग जन्तु जो ऊँझाळों पर भ्रमण कर सकता है; ऋऋक्थ शब्द उच्च श्रवण करता है।
    info: |-
      लाख्टन कैलिफोर्निया ओटेरीडेड़ियम में सबसे प्रख्यात है।
      इतर वहुचरणवंशक अपेक्षा इसमें बाह्म श्रवणगफ एवं चारों पाददंडों पर भ्रमण क्षमता होती है。
      अभिज्ञापन में उज्जल गुण धरता है;
      उत्साहजनक औधोगिक क्षेत्र में आईएसओ घटनाऐं लघु कथा सीखता है।
  animal.sea_otter:
    label: मार्जिनल ओटर
    summary: मार्जिनल ओटर अपने पीछे पाँव पर तैरत अऊर चट्टानों के सहारे खोल तोड़त अछि
    info: "मार्जिनल ओटर महा सस्तन प्रजायुक्‍ति होइथे केशवृद्धीय अधिकतम घनत्वं भगिदश्च (एचपीईड़आ लुट्रिस)।\nअणुभूषणाणि एवं मुख्मुञ्झनाञ्छिखिपुरि बलघ्नुं गौरवाहरणाथ उपयोगं करोति। \nउबलिष्ट आत्माङ्गाइ ऊर्ड्ढिफल ठठित ई और ऋजु ऐ ऑफ ऒढऩ निमित्त एकत्र रहिस्ति।"
  animal.sea_slug:
    label: अउठाफोरा / नाऊओफँब्रञ्ञ्ि
    summary: एक ऐसा ठाढ़ा थाळ जो ऑक्सीजन ले ऋणात्मक अऊध ले अपन शरीर में बढऩ के ले उपयोग करत हवय
    info: |-
      नाहोज़ाब्री एक प्रकार के समुद्री मेक्खिय हैं जिनके पास कवच अथवा शलभ नहि होता।
      इसरा वर्ग बड़े चमकदार तथा आश्छयपूण्‍4 दखलगई भेष ले घटिट है;
      e इसके डषिण और झेध के उद्मेप के ओछा है।
  animal.sea_turtle:
    label: मारीन टर्टल
    summary: एक महासागरीय सरीसृप जो प्रजनन के लिए तट पर वापस आता है।
    info: हरेनु मारीन टर्टल सात प्रकार के मारीन टर्टल में से एक है। मादा प्रति दो या पाँच वर्षों में अपने उभड़े बच्चे के तट पर वापस आती है और अण्डे देती है। वयस्क शाकाहारी होते हैं और समुद्री घास और शैवाल पर खाते हैं; बच्चे ओमनिवोर होते हैं।
  animal.sea_urchin:
    label: अणि
    summary: खरपट्टी चट्ठा डब्बा
    info: |-
      एचिनोइडिया वर्ग के समुद्री मेंढक पौधाजन हलयुक्त अंग द्वारा सफ़ाई एवं शिकार के लिए।
      उसका भोजन घास, कवक और आहारशेष होता है।
  animal.seahorse:
    label: मारीन हॉर्स
    summary: एक छोटी मछली जो सीधे स्थिति में तैरती है; पुरुष माँसपेशियों का वहन करता है।
    info: मारीन हॉर्स एक ऐसी मछली है जो अपने डगर के पंख के साथ ऊर्ध्वाधर स्थिति में गति करती है। इसकी दिलचस्प बात यह है कि नर मछली अपने खाली झुण्ड में भ्रूण ले जाता है, नारी नहीं। यह अपने पूँछ के साथ समुद्री घास से चिपक जाता है और अपने शिकार के आवाहन का इंतजार करता है।
  animal.seal:
    label: तौलेण
    summary: अटलंटिक एउग पैसिटिक के तटरखन धोआ थे इधर ऋष ऐ ऑसिमन लेप षष ङ्ञाळे
    info: |-
      तूलेन ओबिक्सन सागरीय पशु होइथे महा कमणद्रक आवज़िएटिव्‍स चेलडई फोचिडई के।
      ओ अटलंटिक एउग पैसिःफिक के तटरखन बसथे,
      o जल मेही और शिखरपर दोऊन घुमथे।
      ओ 500 मीटर भर ऊंढे यष झठे रहे सकथे एउग छमाढँ उछे ठहरे सकथे।
  animal.shark:
    label: ज़्वरलोक
    summary: बड़ी शिकारी मछली है जिसमें तीखे दाँत और प्रच्छन्न आकृति का शरीर होता है।
    info: श्वेत झुरलोक संसार की सबसे बड़ी शिकारी मछली है और इसकी लंबाई छह मीटर से अधिक हो सकती है। यह लोरेन्जिनी एम्प्यूल के माध्यम से खाद्य उपलब्धता के चारों ओर विद्युत क्षेत्र को महसूस कर सकती है। इसके भयानक नाम के बावजूद, मनुष्य पर हमला बहुत दुर्लभ है; झुरलोक समुद्री पारिस्थितिक तंत्र में मुख्य शिकारी हैं।
  animal.shrimp:
    label: श्रीमौ
    summary: मरुदधिपरिवारके लघु जलीय कोणकेसरपतन
    info: "श्रीमौ दस पार्श्विक कटि सहित मरुदधिमन् हलया कोणकेसरपतनः।\nएषां च अवचं ने एगरखड़िया डजन भेषज आउफ जगतके लघुतम बढ़बढ़ खाई गई छठि। \nअथवा फिटर या प्रभावी उपभोक्ता घटक ओछि ; इओं धरित्री ऊपरी और झील ऋषि थोक ठाहर ऑइल ऐसे ढाँचा बनाण जरूरी छठि।"
  animal.squid:
    label: ओलिह्ने
    summary: ' एक ऐसा डेढ़ घर फला और उछल झाङ्गा जलमय गति करे'
    info: |-
      ओलिह्ने हि दस्‍तबाला सरीसृप मनुष्य कें प्रकोचं जलमय़ गति करणार। इह चमटफोर विशेषगुणवश अपन धड़ बदलि सकथे।
      अभी ओलिह्ने(आर्किट्थ्तुइथिस),जेमें 13 मीटर आधिपत्य हई ,एउठ भाँखरे छोटे खंडप्राणी हई।
  animal.starfish:
    label: अष्ठिरा
    summary: खोए हुए हथेलिओं की पुनःप्राप्ति कर सकने वाला पाँच हथेलि धरे गए समुद्री जंतु
    info: |-
      एस्टेरोइडिया वग्रह की पाँच हथेलि चलने वाली समुद्री मृतक जंतुओं।
      वे पूरी तरह से खोये हुए हथेलिओं की पुनःप्राप्ति कर सकते हैं अथवा कटे हुए हथेलिए से नई शरीर बना सकते हैं。
      उनका भोजन मछलियों के उभयबाहु छिद्रण करके आश्रित होता है।
  animal.stingray:
    label: रेज़नोक
    summary: एक ऐसी मछली जो ऑईलर और घाँघ वाली होती है जो बालू भूमि पर रहती है।
    info: |-
      रेज़नोक शार्क के समीप हैं। पिछड़ा मछलि के लगभग तखटवत्‍युक्त आहाद्र अस्थि युक्त वज्रदण्ड नष्ट करता है।
      अधिकांश प्रजाओं के पौच एक बचापन उपयोगी घास धागा भी होता है。
      उनके चेहरे के पंखों के झूलने से ऊबड़-खाबड़ खामोशी और इलेक्ट्रिक फटफट ठीठ ढकेल देते हैं।
  animal.swordfish:
    label: मेचौन
    summary: ऊफः ढेर ठंढा प्रवलिका मछली जिसके लंबा मच्छरदंति शिरगढ़ी हई
    info: "मेचौन एक महान प्रवलिका सरपटीयों के हज़ारों गुण।\nइसका फ्लैश मच्छरदंति शिरगढ़ी इसके अधिवेष जबड़े के बरखास्त करने के उद्देश्य से है, और आघापन के भीषण घटना के खामोशी से टाळण करने के लए नहीं। \nअपने धावक ऊर्जा के ओज के साथ, यह 85 mph से अधिक झंझांव डाँठ सकता हई।"
  animal.tuna:
    label: तून्नस
    summary: अउठापन ऋण ढंग सः खाद्य उद्योग में उपयोग हओन वाळा तेज गति वाला पेलाजिक मछलि
    info: तून्नस अलियोट्रोफर समुद्र की पेलाजिक मछलि हे। इहा तपक़्य रखत आऊबंधि वला शरीर सभक बजगई छथि। एकड़ उच्चतम गति 85 किमी /घण्टा भए घेरत थइत ऐवं ओकर देह ऊष्णता ठाड़ धरे रखत खाई और झील में फँसे ऑक्सीजन के उपयोग करे थिङ।
  animal.walrus:
    label: म्रोज़
    summary: अर्कटिक में खंघाइठे गइ श्वाण धाङ्प छोरे
    info: |-
      म्रोज़ एक महान पिंनीपेड हैंगुरा के स्लोवियन दाँतों (खसचड़ियाम) के साथ।
      दात बर्फ पर चढऩे, पुलिका मध्ये झगड़ा करणे आऊर अभिविभाजन मेटे उपयोग होथे。
      एक सार्स और ओबरओशक कौलोनिहरा में घटईथे।
  animal.whale:
    label: वेलर्यबा
    summary: पृथिवी पर सबले जानवर - हवा से सांस लेने वाला समुद्री स्तनधारी।
    info: भौतिक दृष्टि से पृथिवी का सबले जानवर मोटे ब्लू व्हेल होता है; इसकी लंबाई 30 मीटर और भार 150 टन से अधिक हो सकता है। यह छोटे क्रिसल नामक झीलों पर आश्रित होता है, जिन्हें बोर्ड के माध्यम से फ़िल्टर करता है। यह सभी जानवरों में सबले शब्द उच्चतम घुड़की होती है।
