lang: ar
pivot: false
title: الحيوانات البحرية
cards:
  animal.anglerfish:
    label: الأسد البحري
    summary: سمكة عميقة تحتوي على فخ إضاءة حيوية.
    info: الأسد البحري يعيش في أعماق المحيط حيث تكون درجة الإضاءة أقل من ألف متر، وتتميز الإناث بوجود خيط مضيء على رؤوسهن يستخدم كفخ لجذب الفرائس والإناث الصغيرة. الذكر صغير بشكل استثنائي؛ وبعد العثور على أنثى يتصل به ويختلط معها بيولوجيًا.
  animal.barnacle:
    label: ركايين
    summary: حشرة صغيرة تعشش في الأسطح البحرية مثل القباب أو جوانب السفن.
    info: "الرُّكَيْنِين هم حشرات بحرية تعلق نفسها على الصخور والقوارب وحتى\U0001F40B الجبال؛ حيث يستخدمون مادة سمنتية للاصطفاف عليها، ويأكلون البكتيريا عن طريق فلترة الطحالب باستخدام أقدام خفيفة تمتد من قوقعتهم الخارجية. يمر صغارها بمراحل طفو قبل أن تستقر وتصبح كائنًا ثابت الوضع مدى الحياة."
  animal.beluga_whale:
    label: بلواجا
    summary: هي حيوان أبيض نادر يتسم برأس مستدير ومظهر لطيف.
    info: "البلاوغا هي نوع صغير من\U0001F40B الحيتان البيضاء التي تعيش في المحيط الأرctic وشبه القطبي، وتتميز بوجهها الكروي الذي يُستخدم للتنصت على الصوت والكشف عن الأجسام بالقرب منها باستخدام موجات كهربائية ضعيفة جداً. كما أنها الوحيدة القادرة على تحريك رقبتها إلى الجانبين."
  animal.blue_tang:
    label: كانيك ازرق
    summary: سمكة شواطىء مرجانية زرقاء؛ نجمة الفلم هنديا.
    info: |-
      الكانيك الأزرق هو سمكة بحرية صغيرة ذات لون أزرق فاتح وذيل أصفر من الشعاب المرجانية في المحيط الهادئ والهندي.
      The film 'Holding for Dora' increased interest in keeping it despite its demanding nature when kept captive.
      It has an edge on the tail root that gives rise to the name surgeonfish
      Eats zoo planktons and phyto-planks.
  animal.carp_river:
    label: '"كارب نهري"'
    summary: '"سمكة كبيرة ذات اللون الذهبي والبني تعيش بالأنهار والمزارع السمكية."'
    info: '{"hint":"الكابور الشائع في بيئته الطبيعية النهرية (Cyprius Carpio)","info":"يُعتبر الكارب الأصلي من أصل آسيوي، وقد تم تقديمه إلى أوروبا منذ العصور الوسطى\nmفترس متعدد؛ يحفّر قاع الماء ويجعله ملتوثًا\nيرمز لعيد الميلاد التشيكي؛ حيث تبيع الباعة الحيوات مباشرةً داخل أحواض المياه\nيعتبر أحد أكثر الأسماك زراعتها على مستوى العالم وهناك ما يزيد عن ١٠٠ سلالة."}'
  animal.catfish:
    label: سمك
    summary: سمكة كبيرة ذات شعرة تعيش خفيةً عند أعماق النهر.
    info: |-
      السمك الكبير هو أكبر سمكة عذبة في أوروبا؛ يصل طولها إلى أكثر من مترين ووزنها يتجاوز الـ 100 كجم
      تُستخدم الشعيرات المميزة كأعضاء حسية للشم واللمس
      تعيش على قاع الأنهار والمياه العذبة وهي مفترسة ليلية
      في التشيك، يعتبر السمك نوعًا رياضيًا مرغوب فيه.
  animal.clam:
    label: المحار الضخم
    summary: أكبر محارة تعيش ضمن الأعماق المحيطية الدافئة.
    info: المحار الضخم هو أكبر حيوان من نوع المحارة في العالم يصل طوله إلى أكثر من متر ووزنه يزيد عن ٢٠٠ كجم، ويوجد داخل قشرة واحدة كبيرة جداً.
  animal.clown_triggerfish:
    label: '''splayf clown'''
    summary: سمكة استوائية ذات ألوان جاذبية مع نقاط بيضاء وشفاه محمرة.
    info: |-
      الأسماك الملونة بشكل مذهل من عائلة الباليستيدا، تتميز بزهريتها الجذابة بين الأسماك البحرية الأخرى
       لديها أسنان قوية لتكسير الشعاب المرجانية الصلبة والقواقع
       اسم 'سلايف كلاون' مشتق من الحافة الأولى التي تعمل مثل سوكة أو مقعد يمنع حركة الثانية
  animal.clownfish:
    label: الكلاون العيني
    summary: ' سمكة برتقالية تعشش مع سوسومات مهددة.'
    info: يعيش الكلاون العيني في السوسمات البحرية، والتي تُقتلب أذرعها السمّ لأسماك أخرى؛ لكنه مناع بسبب طبقته المخاطية الحامية. ينظف ويدافع عن السوسومة مقابل حميتها له، ويتحول الذكر الأكبر سنًا إلى أنثى.
  animal.crab:
    label: كраб
    summary: قشريّ يدوي ذو قشرة وفكيه، يتصرف جانبيًا.
    info: الكраб هو كائن من تحت الرتبة البراكيورا. لديه غطاء خيتيني صلب يلزمه بشكل دوري (إيكديس) للنمو. يتحرك بطريقة مميزة إلى الجانب. تُستخدم الفكيه في الدفاع والصيد والتواصل. يعيش الكرب في المحيط أو المياه العذبة أو حتى على اليابسة.
  animal.dolphin:
    label: دلفين
    summary: حيوان بحري ذكي يعيش في مجموعات ويتخطى الماء.
    info: الدلافين هي حيوانات بحرية تابعة لعائلة الدلافين. وهي معروفة بذكائها العالي وقدرتها على استخدام الصدى للتنقل، بالإضافة إلى سلوكها المرحة مثل قفزها من الأمواج والتقاطها للسفن. كما أنها تعتمد على النقيق والنقر للتواصل وتُشكل مجموعات تسمى 'الهجن'.
  animal.dugong:
    label: الدوغنيج
    summary: أعشابي سلمي من مياه جنوب شرق آسيا والهند قريب الشبه بالماناته.
    info: دوجونغ حيوان بحري يشبه الكابوستينا ويعيش في المحيط الهندي والمحيط الهادئ، ويأكل فقط العشب البحري. يعتبر مصدر إلهام محتمل للنساء البحرية؛ حيث أخطأ المستكشفون في تحديد هويته ككائنات بحرية أخرى.
  animal.eel:
    label: ปลาไหล / มูเรนา
    summary: سمكة طويلة مثل الحيوانات الزاحفة التي تحرك نفسها عبر الشقوق الموجودة داخل صخر مرجاني.
    info: المرنة هي سمكة بحرية كبيرة تنتمي إلى عائلة المورينيدا تختبئ في شقوق الصخور المرجانية، ولها زوجان من الفكين؛ بالإضافة لفكّيها العلوي والسفلي يوجد فكي داخليان (في الرأس البلعومي) يستخدمهما للمساعدة على سحب فريسته نحو حنجرتها. أنها لا تستفز بشكل نشط؛ وعادة ما تتسبب بالعض عندما يتم إثارة غضبتها.
  animal.flying_fish:
    label: سمكة طائرة
    summary: سمكة استوائية تنزلق فوق سطح المحيط باستخدام الأشعة الصدرية.
    info: السمكة الطائرة (عائلة الإكزوكويتيداى) هي سمكة استوائية قادرة على القفز من الماء والانجراف في الهواء، تستخدم أشعة صدرية مشابهة للأجنحة لتساعدها على التحرك مسافة قد تمتد إلى ٢٠٠ متراً وارتفاع يصل حتى ١٫٢مترًا؛ هذه القدرة تساعدها للهروب من الحيوانات آكلة اللحوم مثل أسماق التونة والسلاحف البحرية والدلافين. باربادوس يُعرف باسم 'أرض الأسماك الطيارة' حيث أن السمكات الطائرة جزء لا يتجزأ عن الطعام الوطني والتقاليد الثقافية.
  animal.frogfish:
    label: ضفدع بحري
    summary: خفيّ يصيد الفرائس باستخدام النَزْلِيَّات في الشعاب المرجانية.
    info: الضفدع البحري هو سمكة صغيرة من عائلة الأنتينارييدا تتميز بكاموフラج ممتاز، لديها أشعة صدرية على شكل كعب وتتحرك بها فوق قاع البحر. تحتوي أول خياشيم لها إلى نصنة مرنة لاستمالة فرائسها.
  animal.giant_squid:
    label: خرافية كبيرة
    summary: هي أضخم كائن عدي الفقار الذي يعيش بالقرب من قاع المحيط.
    info: الخرازيات العملاقة (أركهيوتيوثيس دوكس) هي أكبر حيوانات بلا عمود فقري في العالم، وطولها يزيد عن 13 مترًا.
  animal.hammerhead_shark:
    label: قرش ذي حافة مستديرة
    summary: قرش له جزء عرضي خاص على هيئة الحرف التي.
    info: |-
      الأسماك المطرزة ذات الرؤوس المستوية هي نوع من أسماق القرش لها رؤس مسطحة بشكل غريب تسمى 'سيفاليو فيل'.
      t هذه الأجزاء العريضة تسهل الكشف عن الفرائس باستخدام أعضاء كهربائية وتساعد على المناورة بسهولة أكبر.
      تعيش الأسماك المطرزة ذات الرؤوس المستوية في المناطق الاستوائية وتبحث عن السمكة والجمبرية والأخطبوطات.
      n بعض أنواعها مهددة بالانقراض؛ لأن الناس يصطادونها لجلب شوكاتها.
  animal.horseshoe_crab:
    label: الحيوان المتشابك
    summary: عضو قديم جدًّا لا يتغير تقريبًا عبر الـ ٤٥٠ مليون عام.
    info: |-
      هو حيوان يشبه العنكبوت ويُعرف علميًا باسم Limulus polyphemus، وهو كائن عاش منذ حوالي ٤٥٠ مليون سنة وظل دون تغييرات كبيرة حتى اليوم.
      ليس من الأخطار الحقيقية بل قريب أكثر من ذوات الجناحين مثل السحالي والعنكبوتيين.
      دمه الذي لونه أزرق يحتوي على مادة فريدة تسمى الكواغولوجن وتستخدم في اختبار سلامة الدواء وإنتاج اللقاحات.
  animal.jellyfish:
    label: الجَرادِيَّة
    summary: حيوان بحري شفاف على هيئة زنبرك مع أطراف سامة.
    info: الجرادية هي حيوان بحري من عائلة اليراعيات، لا تملك دماغًا أو قلبًا أو عظامًا - يتكون جسدها بنسبة 95% من الماء. تتحرك عن طريق النبضات في جسمها الزنبري الشكل. تحتوي الأذرع على خلايا مُلتهبة (نيماتوسيست)، والتي تسبب التخدير للفرائس.
  animal.lionfish:
    label: أسد البحر
    summary: سمكة استوائية سامَّة ذات جذور كبيرة وألوان متعرجة.
    info: الأسد البحر الأحمر هو سمكة بحرية سامة تنتمي إلى عائلة السكروبينيدا، وتشتهر بأشرطة حمراء بيضاء مميزة وجذورها المسمومة. يسبب السم ألمًا شديدًا؛ ومع ذلك نادراً ما يؤدي إلى حالة تهدّد الحياة. إنه نوع غازي في الكاريبي وفي البحر المتوسط حيث يؤثر بشكل كبير على الأسماك المحلية هناك.
  animal.lobster:
    label: الحمار
    summary: كائن بحري ضخم ذو قفازين؛ يبدو أحمر عند الطبخ ولكنه يحيا بلون زرقاء.
    info: هو الحمار الأطلسي وهو كائن بحري كبير ينتمي إلى عائلة النوفروبيديا يصل طوله لأكثر من 60 سم، ويكون لونه أخضر مزرق داكن عندما يكون نيئًا؛ لكن يتغير اللون ليصبح أحمر فقط أثناء الطهي بسبب الكاروتينات. يمكن أن تعيش أكثر من خمسين عامًا.
  animal.manatee:
    label: دغونج / كابوستناك
    summary: حيوان بحري هادئ يُعرف باسم البقرة البحرية.
    info: '{"hint":"Slow gentle marine herbivore (Dugongidae), also known as manatees","info": "The dugong is large oceanic mammal that feeds exclusively on seaweed.\nThe species lives along shallow tropical bays, river mouths, canals across Caribbean Sea, Florida coastlines, Africa''s coasts. \nThey face serious threats due to collisions involving speedboats - many have scars caused by propellers visible over their skin surface area .\nTheir movement rate remains slow at around three-five kilometers per hour while they breathe every few minutes."}'
  animal.manta_ray:
    label: رائي مانتا
    summary: ريو كبير جدًا ومريح يستخدمه لكشف الطحالب بالقرب من مستوى البحيرة.
    info: راي المانتا هي أكبر نوع من رياح البحر، حيث يصل امتداد أجنحتها إلى أكثر من سبعة أمتار ووزنها يزيد عن ألفين كجم. تستخدم شبكية الأذن لفلتر البلايتون أثناء السباحة مع فتح الفك العلوي. لا تحتوي على مخدرات؛ وهي آمنة تمامًا للإنسان.
  animal.mussel:
    label: سلوفك
    summary: سرطان البحر الغني بالحديد يعيش على صخر
    info: '{"hint":"القواقع ذات القشرة الداكنة المزدوجة التي تتشكل على الصخور (Mussels)","info":"توجد سلوفكا الإدمية في مناطق الجزر والأنهار الساحلية للبحر الأطلسي والمحيط الهادئ، وهي مخلوقات بحرية تتربض على الحجارة باستخدام خيوط قوية (byssus). تقوم هذه الكائنات بتصفية المياه وتعمل كمؤشر لتنامي التلوث البحري حيث تمتص السموم المعادن الثقيلة. كما أنها طعام شائع؛ فمثلاً ''موليس -فيتس'' البلجيكي هو أطباق مشهورة عالمياً."}'
  animal.narwhal:
    label: نرف
    summary: حيتان قطبية لها رأس حلو مثل جراديوت الأساطير.
    info: "النارف هو نوع صغير من\U0001F40B الحيتان القطبية التي يصل طولها إلى خمسة أمتار، ويتميز بسن ملتف على شكل حلزوني وهو في الواقع سن الضرس الأيسر المفرط النمو\nيمكن أن يبلغ هذا السن أكثر من ثلاثة أمتراً؛ بينما تفتقر الإناث إليه\nيعيشون ضمن فرق صغيرة بالقارة القطبية الشمالية\nفي العصور الوسطى كان الناس يعتبروا أسنان Narwhal هي قرون الجُرَادِيّات ذات الخصائص السحرية والعلاجية."
  animal.nautilus:
    label: نايتليس
    summary: رخوى قديم داخل قشرة زاوله منذ العصر الدهسوري.
    info: الناتاليوس هو حيوان من الرخويات يعيش في قشرة ملتفة على شكل حلزون، وقد استمر تقريبًا دون تغيير لأكثر من ٤٠٠ مليون سنة. القشرة مقسمة إلى غرف؛ والناتليوس يستخدم هذه الغرف لملئها بالغاز للتحكم بطفوته. عكس باقي الحيوانات الرخوية الأخرى لديه أعين بسيطة بدون عدسة تعمل كآلة تصوير ثقبية.
  animal.octopus:
    label: الخراز
    summary: حيوان ناعم ذا ثماني أطراف قادر على تغيير لونه وشكل جسمه.
    info: الخراز حيوان عديم الفكرين ينتمي إلى فئة الحواملات. لديه قلبان، دم أزرق ويمكنه تغيير اللون والملمس الجلدي فورًا باستخدام خلايا الصباغ. وهو ذكي للغاية - يستطيع فتح العبار المغلقة وحل الألغاز.
  animal.orca:
    label: كوستكا
    summary: حيوان آكل اللحوم الرئيسي للأعماق وهو النوع الأكبر بين أنواع الدلفين.
    info: '{"hint":"predator أسود وأبيض يُعرف أيضًا باسم الحوت القاتل (الاسم العلمي Orcinus أورا)","info":"كوساكا درافا هي أكبر عضو في أسرة الدلافين، وهي واحدة من أكثر الكائنات ذكاءً على الإطلاق.\ن تهاجم بشكل متناسق ضمن فرق؛ كل مجموعة لديها تقنياتها الخاصة للصيد. \ن تتواصل عبر لهجات مختلفة من إشارات صوتية تعتمد عليها المجموعات المختلفة للكشف عن بعضها البعض. \ن تحيا بمعاناة داخل الأقفاص البحرية مثل سيد وورلد؛ حملات حقوق الحيوان أدت إلى قيود جديدة على الاحتفاظ بها."}'
  animal.oyster:
    label: oyster
    summary: A water filtering mollusk that produces pearls and serves as a popular seafood dish.
    info: |-
      المحار هو نوع من المحار ي-filter المياه؛ حيث يمكن لمحارة واحدة أن تفلتر ما يصل إلى 200 لتراً يومياً.
      بعض الأنواع تنتج اللؤلؤ عندما يتلامس جسم غريب مع قشرتها الداخلية.
      The raw shellfish is considered an expensive delicacy، وعادة يتم استهلاكها في الشهور التي تحتوي على حرف 'R'.
      cultivating them in oceans has positive environmental effects because it helps clean seawater.
  animal.piranha:
    label: برانيا
    summary: هي نوع من الأسماك الهجمانية العاشقة للمياه العذبة الموجودة بالقارة الأمريكية الجنوبية.
    info: البُرَانِيّة الحمراء هي سمكة نهرية هاجمة تعيش في الأمازون ولها أسنان حادة مثلثة الشكل، وسمعتها كхиادٍ قاتل مبالغ فيها؛ فكثيرًا ما لا تستهدف البشر السليمين الذين يسبحون. أنها تتغذى بجناحيه كبيرتين وتكتشف الدم من بعد باستخدام شمها القوي وهي عنصر مهم جدًّا في نظام الأيكولوجيا النهرية للأمازون.
  animal.puffer_fish:
    label: سمكة الفوجو
    summary: أسماك يمكنها النفخ لتكون كرات دفاعية؛ كما أنها مصدر غذائي ومصدر سمية.
    info: فوجو هو نوع من الأسماك العضوية التي تنتمي إلى عائلة تيتراودونتيدا، قادرة على نفخ جسدها بالماء أو الهواء لتشكيل كرة مدببة متينة عند التهديد. تحتوي هذه السمكة على توكترودوتوكسين وهو أحد أكثر السامات طبيعية فتكًا؛ حيث إن أنسجة الكبد والأنثى فيها قد تكون خطيرة للحياة. في اليابان تعتبر سمكة الفوجو وجبة راقصة؛ ومع ذلك يجب أن يكون الطهاة الذين يتعاملون معها حاملين لإجازة خاصة.
  animal.salmon:
    label: سمكة سالمون
    summary: أسماك كبيرة تنحدر من البحيرة نحو النهر لتتكاثر.
    info: السلمون هو سمكة أنادرومية؛ تنمو في البحر، لكنها عائدة إلى أنهار ميلادها عبر آلاف الكيلومترات للتزاوج. عندما يصعد السلمون يتغير لونه من الفضي إلى الأحمر المميز للغاية. بعد التكاثر فإن معظم أسماخ السلمون (الأصناف الهادئة) تسقط ضعيفة وتتلاشى أجسادها وتعود العناصر الغذائية للنظام البيئي الطبيعي.
  animal.sea_anemone:
    label: سحلية البحر
    summary: كائن بحري كاذيب سام، يسكن المرجان.
    info: '{"hint":"حيوان بحري على شكل زهرة له لسانات مؤلمة (الأنميا)، "info": "سحلية البحر هي حيوان من الفصيلة اليراعيّة تشبه الزهور وتلتصق بالحجارة في الأعماق المفتوحة."\n"تستخدم أطرافها السامة التي تحتوي خلاياه المؤذية (نماتوسيستا) لتجميد فرائسها."\n"تعيش مع الحشرات والطحالب وسرطانات التنظيف بشكل متناغم."\n"يمكن أن يعيش أكثر من قرن وهي محتملة للخلود (أبداً لا تتوفى بسبب التقدم في العمر).").'
  animal.sea_cucumber:
    label: أسد
    summary: كائن دائري الشكل موجود بالبحر جمع النفايات العضوية من القاعدة.
    info: |-
      الأسود هي حيوانات بحرية تنتمي إلى فئة الهولوثورويديا تعيش على قاع المحيط.
      tلها القدرة على تصفيه الترسب وتناول المواد العضوية المتبقية.
      عندما يهددهم الخطر، فإنهم يقومون بإطلاق أمعائهم أو سائل مائي ويمكن استعادته لاحقاً.
      إنها طعام ثمين في آسيا ويُعرف باسم 'تريبنج' وهي عنصر تقليدي في الطهي الصيني.
  animal.sea_lion:
    label: لختان
    summary: تمساح بحر ذو آذان يمكنه السير على الحطاميته ويشتهر بصراخ عالي.
    info: اللختان كاليفورني هو أبرز ممثل لعائلة Otariidae من التماسيح البحرية التي تملك آذاناً خارجية ويمكنها المشي على الأربعة حطامات، وهو ذكي بشكل استثنائي ويُعلَّمه في الصناعة الترفيهية الحيل المعقدة؛ كما يصطاد الأسماك والمحاريات والحشرات المائية.
  animal.sea_otter:
    label: فأرة البحر
    summary: الفأر البحري يتقلب إلى الخلف ويكسر القواقع باستخدام الحجر.
    info: '{"hint":"الكوالانغ البحري الذي يطفو على ظهره مستخدماً أدواتاً (Enhydra lutris)","info":"الفأر البحري هو حيوان بحري من أمريكا الشمالية لديه كثافة شعر أعلى بين جميع الثدييات (800،000 خصلة لكل سنتيمتر مربع).\n يستخدم الحجارة كأدوات لتكسير المحار والقواقع المثبتة في الصدر. \ن النائم العائلة فوق السطح؛ تمسك بعضها البعض بأقدامها حتى لا تحملها التيارات بعيدًا. \ن تعرضت للإبادة تقريبًا بسبب جلود الفراء؛ لكن الأعداد استعادت نفسها благодаря برامج التصحيح البيئي."'
  animal.sea_slug:
    label: Placophore/Naked-gill
    summary: حشرة البحر العارية ذات اللون الزاهي التي تسكن شواطئ الرمال.
    info: النوديبرانكيا هي حيوانات بحرية تابعة لمملكة المفصليين، وتعيش على الشعاب المرجانية دون وجود قشرة خارجية لها. تحتوي هذه الكائنات الحية إلى أحجار الألوان في ممالك الحياة؛ حيث أنها تحذير من سميومها. كما أن بعض الأنواع تستطيع امتصاص الخلايا السامة الموجودة داخل طعامها مثل أفراد القشريات وتستخدمها لحماية نفسها.
  animal.sea_turtle:
    label: السمكة المخططة
    summary: ثعبان بحري كبير يعود إلى الشاطئ لوضع البيض.
    info: تُعتبر السَّمْكَة الزَّرقاء واحدة من سبع أنواع للسِّمَكَات البحرية، حيث تعود الإناث كل عامين إلى خمس سنوات إلى الشاطئ الذي ولدت فيه لتضع بيوضها. الأفراد البالغون هم نباتيون ويأكلون العشب البحري والطحالب؛ بينما الصغار هم آكلون جميعًا.
  animal.sea_urchin:
    label: جَرْبِيّة
    summary: هي كائن فقري يشبه الكرة ويوجد تحت سطح الأرض.
    info: '{"hint":"كرة مدببة الشكل من الفقاريات على قاع المحيط (الإكينوئيدا)","info":"تُغطيها بقع حمراء وبيضاء، وهي تعيش في الأماكن العميقة والباردة."}'
  animal.seahorse:
    label: ' حصان البحر'
    summary: سمكة صغيرة تسبح في وضعية عمودية؛ الذكر يحمل الصغار.
    info: هو سمكة من جنس Hippocampus، وتتحرك بشكل عمودي باستخدام زعانفها الظهرية. ما يلفت الانتباه هو أن الذكور لا الإناث هم الذين يحتفظون بالصغار داخل كيس خاص. يستخدم ذيله للاستناد إلى أعشاب البحر ويتربّض انتظارًا لفرائسه.
  animal.seal:
    label: التُمْلَص
    summary: هو كائن بحري يستريح على الحِجار ويصطاد الأسماك بالقرب من السّاحل.
    info: |-
      التمساح البحري عبارة عن حيوان بحري ينحدر من العائلة الفوكيدا ولا توجد لديه آذان خارجية.
      يعيش على طول سواحل المحيط الأطلسي والمحيط الهادئ، ويقضى جزءًا من وقته في البحر والجزء الآخر فوق الصخور.
      يمكنه الغوص إلى أعماق أكثر من ٥٠٠ متر وتبقى تحت الماء لأكثر من نصف ساعة.
  animal.shark:
    label: أسماك القرش
    summary: سمكة قرش كبيرة مع أسنان حادة وجسم هيدروديناميكي.
    info: القرش الأبيض هو أكبر سمكة مفترسة في العالم ويمكن أن يصل طوله إلى أكثر من ستة أمتار. يمتلك القدرة على اكتشاف الحقول الكهربائية للفريسة باستخدام أمبولات لورنزي. وعلى الرغم من سمعته، فإن الهجوم على الإنسان نادر للغاية؛ فالقراصنة الأسماك هي المفترسون الرئيسيون في نظام البيئة البحري.
  animal.shrimp:
    label: '"كرفو"'
    summary: حشرة بحرية صغير، أحد أنواع السمكة الشهير عالمياً
    info: '{"hint":"القشريات الصغيرة السائدة بسرعة ( Penaeidae أو مشابهة )","info":"إن الكرفتوس هي قشريات صغيرة تعيش في البحر أو المياه العذبة ولها زوجان من الأقدام العشرة .\n هناك أكثر من ألفي نوع ; فهي ثاني أصناف الأسماك المحبوبة على مستوى العالم \n إنها مُصفية وصائد؛ وهي حلقات أساسية في سلسلة غذاء البحار \n العديد منها مصدر مهم للطعام في المجتمعات الساحلية الاستوائية"}'
  animal.squid:
    label: جرانييه
    summary: كائن رئوي ذو عشرين ذراع يستخدم الطرد الهوائي للتنقل.
    info: "{\"hint\":\"الحشرة الرأسية ذات العشر أذرع التي تتحرك بسرعة في الماء (تيوثيدا)\",\"info\":\"إن الجرانيه هي حيوانات رؤوسية لها عشرة ذراعين (ثمانية من الأصابع بالإضافة إلى زوج واحد لصيد الفريسة). \nيمكنها التحرك عن طريق النفخ والطرد الهوائي للمياه، كما يمكنها تغيير اللون باستخدام كروماتوفوراتها. \nجرانية العملاقة (أركيتيوثيس)، والتي يزيد طولها على ثلاثة وثلاثين متراً، تعتبر أكبر الكائنات العديمة الفقر بالعالم. \nتركز هذه الحيوانات آثارًا واضحة على جلود النيمفوسيس أثناء مواجهتها معهم تحت أعماق المحيط.\"}"
  animal.starfish:
    label: النجوم البحرية
    summary: حيوان بحري يحتوي على خمسة أطراف ويمكنه إعادة نمو الأجزاء الضائعة.
    info: النجوم البحرية هي حيوانات بحرية تُنتمي إلى فئة الأسماك المدرّعة، وعادة ما تكون لها خمسة أذرع. يمكنها استرجاع الذراع فقدت بالكامل أو إنشاء جسم جديد من ذراع مقطوعة فقط. وهي تتغذى على المحار عن طريق افتتاح قشرتها باستخدام الشفطيات الخاصة بها.
  animal.stingray:
    label: رجنة
    summary: أسفنج سمكة البحر مع خصلات شوكية على الظهر؛ تستقر على الأرض الطينية.
    info: '{"hint":"شعاع مسطح بمخبر سام على الذيل (الداسياتيدا)، "info": "تُشبه الرجنة أسماك القرش، وتمتلك جسمًا مستويًا يناسب الحياة في قيعان المحيطات\nتحتوي ذيول بعض الأنواع على غصة سامة تستخدم للدفاع عن النفس\nتحركها من خلال ارتعاش أجنحتها الصدرية كأنها تحرك الجناح\nبعض أنواعها إلكترونية وتستطيع صعق فريستها باستخدام طاقة كهربائية"}'
  animal.swordfish:
    label: المُقَطِّعة
    summary: سمكة مفترسة كبيرة الحجم ذات فك طويل على شكل سيف.
    info: الأسماك الماكرة الكبيرة تعيش في المناطق الاستوائية والشبه استوائية من البحار، وتعتبر واحدة من أسرع الأسماك حيث يمكن أن يصل معدل سرعتها إلى أكثر من ١٠٠ كم بالساعة.
  animal.tuna:
    label: تونا
    summary: أسدف بحري سريع جداً يتم صيده بكثرة للصناعة الغذائية.
    info: تونة الأزرق المخطط هي أكبر نوع من التوينات، وطولها يتجاوز الثلاثة أمتار والوزن أكثر من سبعمائة كجم وهي حيوان دافئ الدم ويحافظ على درجة حرارة جسمه أعلى مما حول المياه وهو أحد أندر الأسماك في البحر؛ حيث تصل إلى السرعة التي تزيد عن ٧٠كم بالساعة كما أنها مهددة بشكل خطير بسبب الصيد الجائر فسعر سمكة واحدة في السوق اليابانية قد يصل لآلاف الدولارات.
  animal.walrus:
    label: دب بحر
    summary: حيوان بحري قطبي كبير ذو أنواع طويلة وأسنان.
    info: الدب البحري حيوان بحري كبير في القطب الشمالي يتميز بأنياب من العاج ضخمة تصل أطوالها إلى أكثر من متر، وتستخدم هذه الأنياب للصعود على الجليد والقتال بين الذكور وتحديد التسلسل الاجتماعي. وهو كائن اجتماعي يعيش ضمن مستعمرات هائلة. ومع ذلك فإن الدفء العالمي يؤثر سلبًا على موئله المتواجد فوق جليد القطب الشمال.
  animal.whale:
    label: الحيتان
    summary: أكبر حيوان على الأرض - ثديي بحري يتنفس الهواء.
    info: تُعتبر الحوت الأزرق أكبر كائن عاش قط على سطح الأرض؛ يصل طوله إلى 30 مترًا ووزنه أكثر من 150 طنًا. يتغذى فقط على الكاريدس الصغير المعروف بالكريل، الذي يفلتره عبر لوحات العظمية. كما أنه يصدر أصواتاً أعلى من أي كائن آخر.
