lang: ur
pivot: false
title: سمندری جانورات
cards:
  animal.anglerfish:
    label: سمندری شےطان
    summary: ایک عمودی ماڈولوز موافقت الٗومیننس سے منسلک ہے۔
    info: سمندری شےطان (لوفئوس)، اترن والوں کا سامنا نہ کرکے، تقریباً چارسو میٹروں زیر درجۂ آب واردات حوصلا رکھتا ہے۔ عورت جسم پر روشن دماغ لائینگ برش خصوصیت سے فائدہ اُٹھاتی ہے، جو غذا کو بلانے اور مردوں کو متاثر کرنے کے لئے استعمال ہوتا ہے۔ ذکوروں کا انداز قابلِ تعجب طور پر چھوٹا ہوا؛ جب وہ عورتوں کو تلاش کرتے تو وہ شامل ہوجاتے ہیں اور بالآخر باہمی تناسق میں ضائع ہونے لگتے ہیں۔
  animal.barnacle:
    label: راک سولومبر
    summary: ایک چھوٹا موٹا حشرات البحار جو صخور اور بحری جہازوں پر دائمی طور پر رہتا ہے
    info: "سیلرائپیدین کے زیر تعلق سوسکن والوں میں انسان نہ جانتا، ان پر لگنے والا قشوار حشرات البحار شامل ہوتا ہے؛ وہ سنسرٹ فرشتہ کے ذریعے صخور، بحری جہازوں اور بلبلوں پر آسانی سے راس المال بنالیتا۔ \n وہ غذا کھلنے کے عمل کے دوران بالشتون کو شاخچہ استعمال کرتے ہوئے فلٗٹرو کرنے کے طریقوں سے خود برقرار رہتے ہیں。\n ان کے جوان مرحلے دریافت کردہ ہوتے ہیں؛ بعد میں وہ مستقل طور پر روشن مقامات پر منتقل ہوجاتے ہیں اور تمام عمر دبلا پنا باقاعدہ رہتے ہیں۔\n درحقیقت اوقیانوسولوجی میں سطحی عمارتوں کے مطالعہ کے معاملے میں ان موجودہ نظامیات کا اہم عنصر ہونا ضروری ہے۔"
  animal.beluga_whale:
    label: بلوجا
    summary: ایک چھوٹی سفید شمالی دریادوار جانور جس کے اوپری علاقہ گول شکل میں ہے
    info: |-
      بیلوگا، جس کے سائنسی نام Delphinapterus لئوسکاس ہے ارctic اور سابارctc میں پانیوں میں موجود ایک بحری حیات آہستہ رفتار والی دھنواں چمڑی والا جانوروں۔
      ایک خصوصیت واقعی بالون جیسا قدموں کا حصہ جو اصل طرح صوتی تلاش کرنے کے عمل میں استعمال ہوتا ہے。
      یہ واحد زردربدرو قسم ہے جو دائیں باقی دونوں جانب حرکت کرسکتا ہے۔
  animal.blue_tang:
    label: جانوروں کی قسم
    summary: ایک روشن آئل زرد لائن والی ماories؛ 'جستجو' کے مرد
    info: کانیس مڈرے (پیرا کنچورس هی پٹوس)، انسوائینگ، انڈو-پاسفک ريفز سے تعلق رکھتی ہے۔ یہ بلو جبڑ وائل فش نمودار ہوتی ہے۔
  animal.carp_river:
    label: ریچکا کارپ
    summary: اس طرح کا درجۂ بالا سنتری برآمداتی چربدروازہ والا ماحول میں پیدا ہوا ہے۔
    info: |-
      ریچکا کارپ اصل میں جنوب شرق آسٹریلیائی نسل والے سمندری تالابوں میں پایا جاتا ہے۔ وسطی دور حاضر میں، لوگوں نے انھیں فرانس سمیت مختلف علاقوں میں منتقل کردیا。
       ریچکا کارپ غذا کے لحاظ سے بڑی حد تک عام موجود ہوتا ہے؛ زمین کو خراش دیتا ہے اور پانی کو بدصورتحالت کرسکتا ہے۔
       یہ قرون وسطیٰ کے وقت سے وجود میں آئے ہوئے ہزاروں قدیم ماڈلوں کا ذخیرہ ہے۔
  animal.catfish:
    label: سومک
    summary: ایک بزرگ مشترکاتی مچھلی جو نہروں کے فرش پر ٹھہرتيا
    info: |-
      سومک بڑا اور سمندری جانوروں کے درمیان دنیا کا سب سے بড़ا مچھلی؛ وہ تقریباً ٢ مترا لمبو، ۱۰۰ کلوگرام وزن والو بن سکتيا۔
      خوبصورت موسرے ان کے حواس خوش ذوق اور لمس کے عضلات هوندئي。
      اس نهروں اور آبروزنوں کے فرش پر رہندىء شام کالائی وقت صید کردئي۔
  animal.clam:
    label: ملز
    summary: دوسرا بحری ذخیرہ جو درمیانی حصّے میں تقسیم ہوا ہوتا ہے۔
    info: بڑا ملز (ٹریڈکنا جائگس)، دنیا کے سب سے بڑھ کر اور وزن والے ملوں میں شامل ہوتا ہے، جو متعدد فوائد حاصل کرتا رہتا۔ وہ تروپیکل قارچات پر مشتمل علاقوں میں زندہ رہتے ہیں۔ ان کے شاسان میں خاص طرح کی لاش نامی غذا موجود ہوتی ہے۔
  animal.clown_triggerfish:
    label: کلاون فرو
    summary: ایک واضح رنگ کی گرم خطوں کی ماچھلی جس کی صفت سفید نماد اور نارنجی لال روغن ہوتی
    info: کلاون فروگ کیل جو بلوطائیدس خاندان سے تعلق رکھتی اور مہمان نواز زرد وحشات والی درندہ طبع ماچھلی ہوتی۔ ان کا دانت قدرتی حالت میں موجود تمام پرندوں، عظائم اور شاخدار سنگ مرمر کو توڑنے کے لئے مضبوط ہوتے ہیں۔ 'فرو' کا اسم بالعموم آسانی سے حرارتی نظام کار کام کرنے والا اولین غضروفی عنصر ہوتا ہے، جبکہ دوسرا حصہ بلاک کرتا ہے۔ موسم تناسل میں ڈوبنے والے لوگوں کے مقابلے میں یہ مندمل ہوجاتی ہے۔
  animal.clownfish:
    label: آؤچِّکَتنْ
    summary: '''اورینج'' فش جو سمبتوز میں موجود ہے اور اس وقت تکراتا ہے'
    info: "کلاون آچھا کیتے سمندری اسپنگلز میں رہتا ہے، جو دوسروں فش کی طرح ان خطرناک تاروں پر لازم نہیں؛ وہ بحفاظت موٹی زلف کی وجہ سے حفاظت شدہ ہوتا ہے۔\n دونوں کے درمیان عجیب قسم کی تعلق ہے، جہاں کلاون اسپنگلوں کو صاف کرتا ہے اور شکاریوں کو روکتا ہے، تو اسپنجااس کے تحفوں کی ضمان فراہم کرتا ہے。\n تمام کلاون فشر مردوں کی طرح پیدا ہوجاتے ہیں، لیکن غالب شخص بالآخر عورتوں بن سکتی ہے۔ \n ٢۰٠٣ء کی فلم 'Nemo' کے ذریعے وہ عالمی مشہوروں کے مقام حاصل کرنے والے ہیں。"
  animal.crab:
    label: کریم
    summary: دس پائوں والا جانور، کلوا اور بھاری چھال سے مزین، جو طرف کی طرف حرکت کرتا ہے۔
    info: کریم بریچیورا انفراسس کا ایک قسم کا جانور ہوتا ہے۔ اس کے ٹخنے چرب تھیلن کے بنے ہوتے ہیں، جو وہ منظم طریقے سے نکالتا رہتا ہے (ایکڈائز)، تاکہ وہ بڑھ سکے۔ یہ خصوصی طور پر طرف کی طرف حرکت کرتا ہے۔ اس کے کلوا حفاظت، شکار کرنے اور آپسی ابلاغ کے لیے استعمال ہوتے ہیں۔ یہ دریاؤں، سمندروں یا زمین دونوں پر زندگی گزار سکتا ہے۔
  animal.dolphin:
    label: دلفین
    summary: چالاک سمندری جانور، جو گروہوں میں رہتا اور پانی سے کودتا ہے۔
    info: دلفین سمندری جانور ہوتا ہے جو دلفین فملی سے تعلق رکھتا ہے۔ اس کی بلند ذہانت، آواز کے ذریعے نشاندہی کی صلاحیت اور خوش طبعی کے لیے مشہور ہے - دلفین زوردار لہروں سے برقی شارٹس کرتے ہیں اور چیخنے اور چمکنے والی آوازوں کے ذریعے تبادلہ خیال کرتے ہیں۔ وہ گروپوں میں رہتے ہیں جو 'جنا' کہلاتے ہیں اور وائل حیوانات کے قریبی رشتہ دار ہیں۔
  animal.dugong:
    label: دوجون
    summary: ایک شاداب دریاوٗى نباتات حامل جاندار جس کا تعلق منٹی سے ہوتا ہے۔
    info: ڈوگون، منٹی سے تعلق رکھنے والا ایک دریائی جانور ہوتا ہے۔ وہ انڈین آئل کر اور پاسیفک آئل میں زندہ بستہ ہوتا ہے۔ وہ صرف دریاوٰى علف خوردہ چیزوں پر غذا فراہم کرتا ہے۔
  animal.eel:
    label: |-
      ماڈ / ماڈین
      (انجلاء)
    summary: سرخ درخت کے قطعات کے ذرات
    info: "مُرِنَ ایک بڑی سمندری مچھلی ہے جو کورال راکس کی تارنوں میں پوشیدہ رہتی ہے۔\niشان دندانوں کے علاوہ فرشتوں والی زبان بھی موجود ہوتی ہے، جبکہ اندر کے حلق کے لئے وائرنگول نفاذ شامل ہوسکتا ہے۔ \nایک غیرفعال طاقت کے طور پر، عام طور پر صرف خطرناک حرکاتٗ واپس کرتا ہے۔"
  animal.flying_fish:
    label: لیٹاؤن
    summary: ایک تھرمال رائے جو دریا کی سطح پر پرواز کرسکتا ہے۔
    info: "لیٹاؤن ایک تھرمل رائے جو پانی سے بچ کر فضا میں نہا سکتی ہے۔\nپرواز کرنے والی زندگی ان کی بالغ حالت ہوتی ہے؛ وہ آسمان میں لڑکار، دشمنوں (مارلن، ڈالفنز)، اور شتر مردار کو دور کرتے ہیں۔ \nباربادوس 'فlying рыбы' کے طور پر معروف ہے؛ لیٹونس قومی خوردنبات اور ثقافت کا حصہ ہیں۔"
  animal.frogfish:
    label: زرد منشی
    summary: '''خود کوفلا'' کالونیوں میں چھپا ہوا، لمبا مواد جسم کے سائز کے تعقیب میں'
    info: |-
      زبیچنک (انٹینارئس)، انتنا نرائڈے کا خلجان، مہم جو فائن پر تھپڑ لگاتا ہوا بحری سمندری ماچھروں کا عجیب حملہ آور شکار کرتا ہے۔
      اس کے بازوؤں والے بال بلند اندازاً قدموں کی طرح دکھتے ہیں جن پر وہ زمین پر قدم رکھتا ہے。
      ایک حرکت پذیر مشکول (Illicitum) موجود ہوتا ہے جو اس کے اوّل الذکر بال کے ذریعے غذا کو متوجہ کرنے کے لیے استعمال ہوتا ہے۔
  animal.giant_squid:
    label: بڑی چابتری
    summary: دنیا کا سب سے بڑا بالغ حيوان جو ژرفه سمندر ميں رهيلا ہوا
    info: بڑی اولینسز (ارکائٹوئتھسس دُكس) سمندر کے فرش پر زندہ رہنے والے بزرگ ترین جانور میں شامل ہوتا ہے، جو چودہ مترا سے زائد لمبا ہوسکتا ہے۔ ان کے آنسوب حشرات کائنات کے عظیم ترین ہونے کے باوجود درست طرح نظر نہیں آجاتے، جو شدید تاریقی کے لحاظ سے مناسب بنادیاجاتا ہے۔ وہ عمومًا ۳٠٠ سے ١٬٠٠٠ مترا کی گہرائی میں رہتے ہیں اور خصوصًا سوراخ کشوروں کا غذایی ذخیرہ ہوتا ہے۔ سمندر کے فرش پر موجود زندہ بڑی اولینسز کو عام طور پر 2004ء تک تصاویر قطع نہیں کی گئی تھی۔
  animal.hammerhead_shark:
    label: کلاڈیوون شارک
    summary: T-شکل کی لمبوالی سرا والا زردوق
    info: |-
      کلاڈیوون شارک اس کے عجیب طور پر وسعت حاصل چہرہ والی سروں، جنھें 'سفائرندا' کہتے ہیں۔
      اس وسعت حاصل سروا میں بجلی کے آلات لانزینی انفولٹس شامل ہوتے ہیں تاکہ نشتر کی دلدل کمپاؤنڈ فعال رہے۔
      ایسا خاص طور پر مندوبات کے ذریعے حرکت کرتا ہوا قومی غذا کے عنصر بناتا ہے۔
  animal.horseshoe_crab:
    label: پودکوزِس
    summary: اس قدیم چلندر کے وجود کا دورانٗ لاکھوں سال بعد بھی متاثر نہیں ہواتا۔
    info: پوڈکوزِس (لیمو لوس پوليفيمُس)، تقریباً ارب سال قبل کے جانور میں شامل ہوتا ہے، جن کی شناخت موجودہ حالت میں قائم رہتی ہے۔ واقعی خرچند نہیں بلکہ بڑھئیر زمینداروں سے مشابہ ہوتا ہے۔ اس کا آسمانی رنگ والا خون منفرد مواد (جمنش فرومر) کے استعمال کے ذریعے دواﺅں اور واٹسنز کی حفاظت کرنے کے لیے استعمال ہوتا ہے۔ ہرشام بر وقت دریائے روشنی کے طرف حرمت کرتا ہے؛ ان کا غذایی حصّہ مارچ کردہ عدیدہ مرغیلاں بناتا ہے。
  animal.jellyfish:
    label: میڈوݨا
    summary: ایک شفاف سمندری جانور، دُھن کے رُخ اُتے تاروں والی حالت میں۔
    info: میڈوݨا اک سمندری جانور ہِے جو بچّوں کے بغیر، دل کے بغیر یا ہڈیاں کے بغیر ہندن والے جانوروں کے زمرے سے تعلق رکھدا ہِے - اس کا تناسب 95 فیصد پاݨی توں بنا ہوا ہِے۔ وو اپنے زوندروں والے جسم کے ذریعے حرکت کردی ہِے۔ ان کے تاروں میں نشتردار خلیات شامل ہَن جو شکار کو معطل کردوں۔ بعض قسمیں تقریباً مرگئے کے بعد واپس بچّوں کی حالت میں آ سکدن۔
  animal.lionfish:
    label: کروٹوپاس
    summary: جہل خوردۂ مچھلی ہے، واضح طنوؤں اور لمبوں والا رنگ
    info: کروٹوپا سیس کرمند ایک جہل خورشید مچھلی ہے، فملی سکار پینائڈئے سے تعلق رکھتی ہے۔ ان کے بڑے نمایان علامات لال و سفید خطوط ہوتے ہیں اور زہنی طنوؤں والے دانت ہوتے ہیں۔ ان کا زہر دردناک ہونے کے باوجود عمومًا حادثاتی قسم کا نقصان تو نہیں ہوا ہے۔ کربین اور مدیترانحی ماہیگیری میں غزوہ آباد کردہ ذخائر ہیں؛ مقامی مچھلوں کو متاثر کرتے ہیں۔ عام طور پر اصل موطن کے علاقوں کے مقابلے میں انسداد کے شکار نہیں ہوتے۔
  animal.lobster:
    label: ہمر
    summary: بڑا آئنو مشترکات؛ خشخاش کرنے سے قرمزی ہوجاتا ہے
    info: ہومر ایٹلانتک جو کارپس فملے سے تعلق رکھتا ہے، وہ بحری پانچن مینڈوبائیں والا درندہ ہوتا ہے۔ یہ دماغ کے طور پر زرد لال بننے والا نمونہ ہوتا ہے۔
  animal.manatee:
    label: دوغُنٗج / کَّاِْ‌‏ڤُستِنَيَاك
    summary: ایک سماول سامنا کرنے والا ماہی جو سمندری گاؤں کہلا جاتا ہے۔
    info: کاپسٹنیانک، جو منےتائے کہلاتا ہے اور مچھلی نہیں بلکہ سمندری علف پر غذا اختیار کرتا ہے۔ وہ تropic زمیندار فلوئڈا افروز کربائن بحر الاحمر کے دروازوں اور رود خشک موسم والے خطوں میں آبادگرانوں میں موجود ہوتا ہے۔ ان کو موٹرسوار دوروں کے حملوں سے شدید خطرات لاحق ہیں؛ بعض لوگوں کو چکر کے ذریعہ برداشت ہونے والی چوٹوں کے باوجود چند قومی طاقت کے نقشوں کا تحفظ حاصل ہوسکتا ہے۔
  animal.manta_ray:
    label: رائے مانتا
    summary: سمندر کی سطح پر موجود نافع حشرات فلسفہ کرنے والا عظیم الشان اور خوبصورت متنوع ماچھر
    info: "مانتا اوریئنٹل سمند کے بڑھتے پانچوں مینڈر جات، انکے فرشتوں کا وسعت ٧ مترا سے زائد اور وزن دوم الہزار کلوگرام تک۔ \nاس نافع حشرات آب کو منفی طرح لامبدا رزق خصوصاً بالغ شاخون والے نظام استعمال کرتا ہے۔\nایک غیر ضاری نوعیت؛ انسان کے لئے صحت عامہ کے اعتبار سے محفوظ。\nشامل ذرات عقلاءترین ماچھروں میں سے ایک؛ قابلِ شبہ ہے کہ اپنا نقاش تصویر درآتش مشابه تشخّص کرسکتا ہے۔"
  animal.mussel:
    label: سلاوکا
    summary: درندہ ملنے والا ملز جو بالمقابل اقدار میں روشن ہوتا ہے۔
    info: "سلاوکا جی این ملز کے نام سے مشہور، وہ شمالی اوقیانوس اور پاسifik آبادار زون میں رہنے والی غذا ہے۔ \nایش بسوس انچڑھ دو تخت لالٹين کے ذریعے سنگائیوں پر مضبوط طرح قابض ہوتا ہے。\nیہ فلوئڈ کو صاف کرتا ہے اور درحقیقت اقیانوس کے آلودگی کا علامت ہے؛ یہ سمتوں اور متعدد خطرناک مواد کو جذب کر لاتا ہے۔\nیہ معروف غذا ہے؛ بلجئم کے 'مولس فروتس' تمام دنیا میں شہرت حاصل ہوا ہے۔"
  animal.narwhal:
    label: |
      نافل
    summary: آرکٹک وائلڈ بلبلاتا ہوا روڑّو
    info: ناروال ایک چھوٹا آرکٹک وہل رائے جانور ہوتا ہے، جس کی لمبائی تقریباً پانچ میٹروں تک ہوتی ہے۔ نارول کے خصوصی دانت سپائر شکل والے ہوتے ہیں، حقیقت میں ان حلقہ بند فرماؤں کے طور پر درج ذیل لفظ استعمال ہوا ہے۔
  animal.nautilus:
    label: نوئلائوس
    summary: اصل نمونہ حلقہ دار جانوروں کی قسم، خفافعات دور سے باقی
    info: نیوٹائلوس ابتدای حلقہ دار جانور چرخ کے انداز میں سرنگ والی زرد بھوند پر رہتا، تقریباً ٤٠٠ لاکھ سال بعد بنا۔
  animal.octopus:
    label: چھوباتنیس
    summary: آٹھ ہتھوں والا مالاسک، جو رنگ اور بدن کے شکل تبدیل کر سکتا ہے۔
    info: چھوباتنیس ایک غیر آباد حیوان ہوتا ہے جو سر کے نشان دار حیوانات کی قسم سے تعلق رکھتا ہے۔ اس کے پاس تین دلوں، نیلا خون اور فوری طور پر چمکدار یا چمڑے کی بنیاد پر رنگ اور ٹیکسچر تبدیل کرنے کی صلاحیت ہوتی ہے۔ یہ بہت ذہین ہوتا ہے - اس کے پاس بند عمارتوں کو کھولنا اور لابیرنٹس حل کرنا شامل ہوتا ہے۔
  animal.orca:
    label: کوسٹکا
    summary: سمندروں کا بلند شمار کن لوٹرس، تمام دلphin کا سب سے بڑا
    info: کوساتکا جنوبی ابھار کے سمندر میں پائی جانے والی بڑی دلفینوں کی قسم ہے۔ وہ ذرائع تعلق رکھتی ہے، مختلف خصوصی حملوں کے طور استعمال کرتی ہے۔ ان کے درمیان آوازوں کے نشانات کے زبانی فرق موجود ہوتا ہے۔ محصور حالتوں میں عذاب برداشت کرنے لگتا ہے؛ حقوق حیوانات کامپینز نے بالآخر پالتو نظام کے تحفظ کو حدود داخل کردیا۔
  animal.oyster:
    label: اسٹرائیس
    summary: پانی کو فلٗٹرو کرنے والے مچھلی؛ نتام کا ذخائر اور عمدہ خوشبو.
    info: "اسٹرائیس مچھلی کے پانی کو فلوڈ کرنے والے جہاں اک بار سبز تبدیل ہوجاتا ہے؛ اور اوسط اسٹرائیس روزانہ دوسوم لڑج وندر۔\n بعض قسمیں مرغوب نتام بناتی ہیں، جب ان کے باقاعدگی کو غیر ضمانت شئی خراب کردیتا ہے。\n زندہ اسٹرائیس لوگوں کے ذوق کا موضوع ہوتا ہے؛ عام طور پر 'R' حرف والا ماہ منتخب کرتے وقت استعمال کیاجاتا ہے۔ \n دریاؤں میں ان کی آوازاں صحت مند نظام برقرار رکھنا موذون ہے اور سمندری پانی کو صاف کرنے میں مدد کرتا ہے۔"
  animal.piranha:
    label: پِرانَ
    summary: جنوبی امریکا کا درمیانی تالاب کا شوال بال آخر.
    info: |-
      چراغوں والی پیرانہ جنوب امریکا کے علاقائی سمندر میں زندگی بسر کرنے والا شارک فروش ماوراء البحرا، تازہ آباد راتل نسل Pygocentrus nattereri کا حامل ہوتا ہے۔
      اس کی خوفناک قتل عام کردینے والے دفاع کی تصاویر غلط ہیں؛ واقعی صحت مند شخص کس طرح لطف اٹھاتا ہے تو اس کو نقصان پہنچانا مشکل ہوتا ہے。
      ایسا لوٹتے وقت ان کا ذائقہ مضبوط ہونے کے باوجود دور سے خون کی بو سن سکتا ہے۔
  animal.puffer_fish:
    label: فوݑو مچھلي
    summary: خود کو چربدراست گول شكل ميں بلائن٘دري ۾ مچھلي؛ فوݐو ٻيه ۽ زهر دونوں ڪميٽ.
    info: "فُوگو مچھلی اس وقت تکوناٹوڈنٹائڈ فیملی سے تعلق رखتی ہے جب خطرہ کشوف واقعات پر بدن کو آواز دینے والی حالت اختیار کرتا، تو نمک یا هوا کے ذریعے بالکل گول شکل بنانے۔\nاس مچھلی میں 'ترتوڈو' شامل ہوتا ہے، جو قدرتی طور پر موجود تمام زہروں میں سے سب سے مضبوط؛ لIVER کے عضلات اور جنسی نظام سميت مرمار کرنے والا ہوسکتا۔ \nجاپان ميں فوݗو يادكاري چيز دي منصوبه ہندواندي ہوي ہئي؛ غذايات اندازا کردڻ لاءِ ماخذين کي خاص درجہ حصول ضروري ٿيل۔"
  animal.salmon:
    label: ماڈلوس
    summary: درختوں میں نسل繁衍 کرتی ہوئی بڑی ماڈلوسو مشابه مچھلی
    info: اس کا تعلق ایک انادروموس مچھلی سے ہوتا ہے جو دریاؤں میں واپس لوٹنے پر بحری علاقوں میں بالغ ہوجاتی ہے۔جب وہ نسل繁衍 کرنے کے لئے آتا ہے تو، اس کا رنگ سفید سے قرمزی ہوجائے گا۔باقاعدہ طور پر زیادہ تعداد میں ماڈلسوس (مشرقی نوعیت) مردہ ہونے والی حالت میں ختم ہوجانے والا ہوا؛جسم فنا ہو جایا ہے اور غذائیت موافقت الطرز نظام حیات جنگلات میں داخل ہو جاتی ہے۔
  animal.sea_anemone:
    label: سمندری ساسنکا
    summary: ایک فرشتوں مثل سمندری موجود، جس کے دم آنسوز ہوتے ہیں۔
    info: سمندری ساسنکا ایک جہل کھولے والانسانوں، مچھروں اور پودوں کے ساتھ توازن قائم رکھتے ہوئے زندگی بسر کرتا ہے۔ ان کے دماغ نارمل خطرناک حشرات کو معطل کرنے کے لیے دردناک عضلات استعمال کر سکتا ہے۔
  animal.sea_cucumber:
    label: سمنش
    summary: ایک لمبا موذجی جاندار جو درختوں د ّزبرتوں تو‍ں غذا حاصل کرتا ا‏‏ے
    info: "سمنیش اُن مہاساگر کے تالابوں پار جانوروں د‏‏ی حکمت عملی نو‍ں فلٹرو کرن تو‍ں بچاؤ وچ استعمال ہوندی ا‏‏ے۔\n اوہ سطح زمین لئي، آبادیاتی ذرات د‏‏ی طرح خوراک بنائندے نيں۔ \nخطرے د‍‍ں صورت وچ انھاں د ِنوڑواݨ والے عضلات یا رطب غذا شامل کردے نيں، جو بعد وچ واپس لوٗٹ جاندا ا‏‏ے۔"
  animal.sea_lion:
    label: لختان
    summary: برقتِس موذون زمین پر چلتا ہوا؛ شدید بلند آوازوں
    info: "لختان کیفلورنین سب سے مشہور اُتارئڈائی فملّی کا نمائندہ ہے۔\nحقیقی تولوں سے الگ، لختان کپڑے برقع مچھروں پر قابض خارجی کان والٹس رکھتا ہے جو ان کے 4 برتنوں پر چلنے کی اجازت دیتے ہیں۔ \nایک حیرت انگیز طرح ذہانت والا؛ تفریح صنعت میں وہ الجھنا آسان علاحدہ حرکتوں کو سیکھتا ہے۔"
  animal.sea_otter:
    label: بحری اونٹ
    summary: بحری اونٹ اپنی پشت پر پلائیج اور سنگ مرمار کا استعمال کر کے حلقوں کو توڑتا ہے۔
    info: '{"info":"بحری اونٹ کا جانور شمالی آمریکہ سے تعلق رکھتا ہے، تمام بچوں میں ان پر زبردست بالاترین مواد موجود ہوتا ہے۔\n وہ سنگ مرمار کا استعمال نرم روغن دار غذا حاصل کرنے کے لئے کرتا ہے۔ \n وہ بازوؤں پر درمیانی طاقت کام کرتا ہوا خوابیدہ حالت میں رہتا ہے؛ جبکہ فرشتوں کے ذریعے قابض برقرار رکھنے کے لئے۔\n اس کی شرح صفر کردی گئی تھی، بلند مقصد والے منصوبوں کے تحت لوپولنس واپسی ہوئی۔"}'
  animal.sea_slug:
    label: plaikophor/anohozaber
    summary: coral reef پر پایا جانے والا غیر فطری رنگ برنماﺅ لالٹین
    info: |-
      نہوڑی براچ کے ملزمان انسان جس طرح سمندروں پر قابض رہتے ہیں، ویسا ہی انکا وجود ہوتا ہے۔
      anhozabrany نامی حشرات دار زمیندار خاص طور پر آب دراز میں موجود گھونسلوں والے علاقوں میں پائے جاتے ہیں۔
  animal.sea_turtle:
    label: سمندری چھینا
    summary: ایک بڑا سمندری پرندہ جو تخم رکھنے کے لئے شاطر پر واپس آتا ہے۔
    info: سمندری چھینا سبز ایک سات مختلف قسم کے سمندری چھینوں میں سے ایک ہے۔ بالغ حیوانات علائقی غذائیت پر زمیندار ہوتے ہیں اور ان کا خوراک سمندری گھاس اور اعشاب پر مشتمل ہوتی ہے؛ جبکہ نوجوان حیوانات تمام قسم کی غذا کھانے والے ہوتے ہیں۔
  animal.sea_urchin:
    label: جیزوافکا
    summary: '''جیزوافکا'' ایک موڑدہ، خالص انڈر واٹر انسان کی طرح کائنات کا حصّہ ہوا'
    info: "جیزوفکا سمندر کے فرش پر موجود ایک خاردار، گوളائی شکل والانمٹ جس مچھروں کے زمرہ 'ایشینوئید' میں شامل ہوتا۔ \nاس کے درمیان دانت نما آلات براستہ لات و لاپرواہی کرنے کے علاوه صفائی کام کرتے رہتے ہیں۔\nیہ طحالی، قطعات اور حشرات کے ذخائر پر غذا اختیار کرتا ہے。\nاس کے تولیدی نظام (ونی)، جابن کی معروف بالغ مرغنی کے عنوان سے مشہور ہیں۔"
  animal.seahorse:
    label: بحری گھوڑا
    summary: چھوٹی سی پانی میں عمودی حالت میں تیرتی مچھلی؛ جس کے بچے باپ نے لالن کر رکھے ہوتے ہیں۔
    info: بحری گھوڑا ایک قسم کی مچھلی ہے جو عمودی وضع میں حرکت کرتی ہے، اور یہ اپنا دم استعمال کر کے سمندری علف کو مضبوطی سے پکڑے رکھتا ہے۔ اس کی خصوصیت یہ ہے کہ اس کے بچوں کو باپ ہی نہیں بلکہ ماں نہیں لالن کرتی۔
  animal.seal:
    label: ہورنکیل
    summary: ایک موذج ذمار حوض میں ماچھلوں کا شکار کرنا اور سنتریات پر استراحت کرنا
    info: |-
      ہورنکیل ارطغرول مچھروں کا سمندڑ جاندار ہے، فووسائڈس خاندان کا تعلق رکھتا ہے۔
       وہ آئرنٹک اور پاسفک دریاؤں کے کناروں پر زندگی بسر کرتا ہے، پانی میں وقت صرف کرتا ہوا تو نمودار ہوتا ہے。
       وہ ۵۰۰ مترا سے زائد گہربال غوطہ لینے کی قابلیت رکھتا ہے اور دوبئی عرصہ تک پانی کے اندر باقی رہ سکتا ہے۔
  animal.shark:
    label: شیر کا شکاری
    summary: بڑی پرندگان والی مچھلی جس کے تیز دانت اور ہائیڈروڈائنامک بدن ہوتے ہیں۔
    info: شیر کا شکاری دنیا کی سب سے بڑی شکاری مچھلی ہے، جو 6 میٹر سے زائد لمبی ہوسکتی ہے۔ یہ لورینزن کے چھولوں کے ذریعے فریم کے الیکٹرانک میدان کو محسوس کرنے کی صلاحیت رکھتی ہے۔ انسان پر حملہ کرنا نایاب ہے؛ شیر کے شکاری دریا کے ماحولیاتی نظام کے اہم شکاری ہیں۔
  animal.shrimp:
    label: کریسٹل
    summary: چھوٹا سامُندی جانورو، دنیا بھر میں عام سماݨِّدَم.
    info: کریسٹل کے ابتدائی جانورات سمندری ہوتا ہے، ان میں دوسری نسل والے پنئیڈائن خاص طور پر شامل ہیں۔ وسائل تقریباً ۲؍۰۰ٗ مختلف قسم کے موجود ہیں؛ اور یہ تمام دنیا بھر میں ساحلوں کے لحاظ سے دوسرا زیادہ مشہور ذخیرۂ غذا ہے۔ بعض وقت فلٹروالے شکاری ہونے کے علاوه درجہ حرارت بالغ موذی حشرات کے رقبے میں مرکزی عنصر بن جاتا ہے۔ متعدد قسم کے لوگوں کے لیے استعمال کرتے ہوئے آمدنی کا مناسب ذریعہ ہیں۔
  animal.squid:
    label: سیاہ مچھلی
    summary: پانی کے ذریعے تیرنے والی دسوں بازو والی حلقے والی جانور
    info: سیاہ مچھلیوں حلقے والے جانورات سبز اور دودھ کے رنگ کے بال بڑھائے ہوتے ہیں۔ وہ پانی کے ذریعے تیرتے ہیں، آسانی سے رنگ بدال لینے کی صلاحیت رکھتے ہیں اور ان کے خاص فرشتوں کے ذریعے حرارت نمٹاتے ہیں۔ عظیم الشان سیاہ مچھلیاں (آرکئی‌ٹیؤتس)، جو 13 مترا سے زائد لمبا ہوسکتا ہے، تمام غیر منڈمل جانوروں میں سب سے طاقتور ہیں۔ وہ دریافت کرنے والا بناتے وقت ماچروں کی باقاعدہ تصاویر چھوڑ دیتے ہیں۔
  animal.starfish:
    label: ستار فشیئن
    summary: پنجرا مشتمل دریائی جاندار جو نقصان رسیدہ بازوؤں کی واپسی کرسکتا ہے
    info: ستار فشیئن اسٹینوکورم کے خاندان سے تعلق رکھتے ہیں، جو عام طور پر معمولی آب و ہوا والے علاقوں سے لے کر بڑی گہرتاؤ تک موجود ہوتا ہے۔ ان کے دانتوں کے ذریعے وہ حلزونات سمیت مختلف قسم کے زندہ حشرات کا شکار کرنے کے استطاعت رکھتا ہے۔
  animal.stingray:
    label: رینک
    summary: سبزی کمپنی کے اوائل میں موجود غیر ضروری حصّے؛ رملائذ کے سطح پر مشغول
    info: ریئنک، شارک کے قریبی رشتہ دار اور سمندر میں تخت جسم والا حیوان ہوتا ہے۔ بہت سے انواع کے پُچھڑے میں دردناک زہر آلود ناخنوں کے علاقوں کا استعمال تحفظ کے لیے کرتے ہیں۔ وہ باقاعدگی سے بالسٹروں کے ذریعہ حرکت کرنے والا آلات بناتے ہیں۔ بعض انواع الیکٹروجنک ہونے کے ساتھ خطرناک فائدہ مند مواد کو الیکٹرانک طوفانوں کے ذریعہ متاثر کرسکتا ہے۔
  animal.swordfish:
    label: میچوون
    summary: ایک درندہ طبع جذبندي ماچل جس کا لمبا خفيف بل ہوتا ہے
    info: |-
      میچوون بڑا ایک تپت زمانہ کے محيطيات سمندر ميں پائيدہ جھولن والی ماچل ہے۔
      اس کا لمبا فلت بل، شکار کرنا نهىں بلکہ حملہ آوران کو دباؤنے کے لئے استعمال ہوتا ہے。
      ایس رفتار وادھندہ انماچل ہے؛ گزشتہ وقت ميں 100 کلومیٹر فی گھنٗتي کے قرب العین رفتار تك رسید.
  animal.tuna:
    label: تونياك
    summary: صنعتی غذاء کے لیے عظیم الشمار ماچلی کی وجہ سے لوگوں کے ذخیرہ آورد کردہ اقتصادی نظام میں داخل ہوجانا
    info: تُونیاک مَدروپلاؤٹو کے تھننس سبزی جانور ان بڑائی اقسام کے توئناکس میں شامل ہوتا ہے، جو ۳ مترا سے زائد لمبا اور ٧۰۰ کلوگرام وزن والاتعمر کر سکتا ۔ وہ حرارت حفاظتی (چمتوارمو ) ہوتا ہے اور پانی کے درجۂ حرارت سے اوپر خود کواضافی طاقت فراہم رکھتا ہے۔ یہ دنیا کی تقریباً تیزترین ماچلس کی قسم ہے؛ ۷۰ کلومیٹر فی گھنٹہ کی رفتار حاصل کرنے کی صلاحیت رکھتی ہے۔ ناجائزماچولی کے باوجود انتہائی خطرہ میں ہے؛ ایک واحد شے جابسن منڈی میں لاکھوں روپے کی رقم برقرار رکھتی ہے۔
  animal.walrus:
    label: مرُوز
    summary: ایک بڑا شمالی شینچواج جسم والا جانور
    info: مروز ایک بڑا آرکٹک پن نپید جانور ہے، جس کو لمبائی میں متعدد فرشتہ سائز والے دانت حاصل ہوتے ہیں۔ ان دانتوں کا استعمال لد کھولنے، مردوں کے درمیان تنازعات حل کرنے اور رتبہ قائم کرنے کے مقاصد کےلئے کرتا ہے۔ وہ خوشگوار طبعی ذوق رکھتا ہے اور عظیم الشان کالونیوں میں زندہ رہتا ہے۔
  animal.whale:
    label: بلو وہال
    summary: زمین پر سب سے بڑا جانور - ایک مچھروالا جانور ہے۔
    info: بلو وہل زمین کا سب سے بڑا حیوان ہے، جس کی لمبائی تقریباً 30 میٹر اور وزن 150 ٹن سے زائد ہوتا ہے۔ یہ صرف چھوٹے قارچات، جنہیں 'کرل' کہا جاتا ہے، پر غذا کرتا ہے، جو اس کے ڈھانچوں کے ذریعے فلٹر کیا جاتا ہے۔ یہ تمام حیوانات میں سب سے آوازدار آوازیں دیتی ہے۔
