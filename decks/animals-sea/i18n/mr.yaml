lang: mr
pivot: false
title: मार्शल जनावरे
cards:
  animal.crab:
    label: क्रब
    summary: दहा टांगीचे कॉर्यश संपूल आणि पिशव्हीसह, बाजूने हलतो.
    info: क्रब हा इन्फ्रारेड ब्राक्सिओरा मधील एक कॉर्यश असतो. त्याच्या लठ्ठ खोळयामुळे वाढ होऊ शकते आणि नियमितपणे ते घालवतो (एकडिझ). ते विशिष्ट बाजूने हलतात. त्यांच्या पिशव्ही बचाव, शिकार करणे आणि संपर्कासाठी वापरल्या जातात. ते समुद्रात, द्रव वातावरणात किंवा भूमीवर राहतात.
  animal.dolphin:
    label: डॉल्फिन
    summary: चतुर महासागरी प्राणी जे समूहात राहतात आणि पाण्यापासून उडतात.
    info: एक डॉल्फिन हा एक महासागरीय पशुप्राणी असतो जो डॉल्फिनविटेच्या कुटुंबामध्ये येतो. त्याला विशेषतः बुद्धिमत्ता, इकोलोकेशनच्या क्षमता आणि खेळखून व्यवहारांसाठी ओळखले जाते - डॉल्फिन्स लहरी लाथांमधून उडण्याचा आनंद घेऊन झुगारे आणि क्लिक करून दुसऱ्यांशी संपर्क साधतात. ते 'फ्लोक' असे नावाच्या समूहांमध्ये राहतात आणि व्हेल्सचे निकटवर्ती भाऊभीज असतात.
  animal.jellyfish:
    label: मेड्युझा
    summary: पाणबिंदूचे एक प्रतिबिम्बीकरण करणारे समुद्री प्राणी ज्याच्या मागे विषाऱ्या हाताळांसह झोडप असतात.
    info: मेड्युझा हे नरमांगसंवलनीय श्रेणीतील एक समुद्री प्राणी आहे; त्याला मज्जा, हृदय किंवा हाडे नसतात - त्याचे शरीर 95% पाण्यापासून बनलेले असते. ते घटकाकृतीच्या शरीराद्वारे पल्स करून फिरतात. त्यांच्या हाताळांमध्ये छळणार्‍या कोशिका (नेमटोसिस्ट) असतात ज्या शिकारला भेदून थोपवून ठेवतात. काही प्रजाति लगभग अमर असतात - त्या बालपणाच्या अवस्थेत परत जाऊ शकतात.
  animal.octopus:
    label: कॉपी
    summary: आठ खंडांच्या सहभागासह मेकलेले प्राणी.
    info: कॉपी हा एखादा बिनशरीरी प्राणी आहे जो केफळोपोडा वर्गात असतो. त्याच्या शरीरामध्ये तीन हृदये असतात, त्याचे रक्त निळे असते आणि ते क्रोमटोफोर्सच्या मदतीने त्वचेचा रंग आणि टेक्स्चर ठीक करू शकते. ते खूप बुद्धिमान आहे - ते बंद करण्यात आलेल्या डब्यांचे उघडणे आणि घोंटाळे निराकरण करणे शक्य आहे.
  animal.sea_turtle:
    label: मारीन टर्टल
    summary: वेगळा महासागरी पक्षीजन्य प्राणी जो अंडे घालण्यासाठी सुटका करतो.
    info: ग्रीन मारीन टर्टल हा सात प्रकारच्या मारीन टर्टलपैकी एक आहे. बर्मिन दरम्यान दोन ते पाच वर्षांनी त्यांच्या खाऊबद्दल झाडलेल्या सुटकेवर परत येतात आणि अंडे घालतात. इयशापासून ओलाढेक भाग शाकाहारी आहे आणि समुद्री घास आणि फाउकस खातात; छोट्या बच्च्यांचे आहार विविध आहे.
  animal.seahorse:
    label: मारीन हॉर्स
    summary: उभे पोकळ असलेला सुदृढ माछी ज्याच्या कंठपटलावर माता नव्हे तर बापच मांजरांचे धरतो.
    info: मारीन हॉर्स हा हिप्पोकैम्पस गटामधील एक खाडय़ा आहे जो शरीराच्या दगडाच्या भागाचा वापर करून ऊर्ध्वाधर घट्ट ठेवून फिरतो. याच्या ओघात थोडीशी इंग्रजी झाकणारी विशेषता आहे कि बापच मांजरांचे धरतो तर माता नाही. त्याच्या पाठीच्या बाजूला जखम असते ज्यामध्ये तो त्याच्या शिकारीच्या अंगावर बसतो.
  animal.shark:
    label: शार्क
    summary: तीव्र दंत आणि हायड्रोडाइनॅमिक शरीर असलेला मोठा प्रकोप करणारा मासा.
    info: ब्लू शार्क हे जगातील सर्वात मोठे प्रकोष्ठक मासा आहे आणि एका छेडय़च्या उभारापुढे खूप लांब गेले आहे. त्याच्या बद्ध नखामध्ये लॉरेनझिनी अम्फुली नावाच्या भागामुळे त्याला शिकारच्या विद्युत क्षेत्राचा अनुभव होऊ शकतो. त्याच्या घटना झाल्याची ओळख असली तरी माणसावर हल्ला खूप दुर्मिळ आहे; शार्क हे महासागरी जैविक व्यवस्थेत महत्वाचे प्रकोष्ठक आहेत.
  animal.whale:
    label: वेलरिबा
    summary: पृथ्वीचे सर्वात मोठे प्राणी - हवेने श्वास घेणारे समुद्री कंदकंदीत प्राणी.
    info: ब्लू व्हेल हे पृथ्वीवर जन्मलेले सर्वात मोठे प्राणी आहे; त्याची लांबी 30 मीटर असू शकते आणि त्याचे वजन 150 टन एवढे असते. ते फक्त क्रिल नावाच्या छोट्या खोबऱ्यांवर आधारित असते, जे डगिशी धारांद्वारे फिल्टर करते. हे सर्व प्राण्यांमध्ये सर्वात गाजलेले आवाज उत्पन्न करते.
