lang: mr
pivot: false
title: मार्शल जीव
cards:
  animal.anglerfish:
    label: 赵溛俊
    summary: उभयबाण्डी धारिति
    info: महासागरी देवता म्हणजे 'लोफियस' हळूच सुरक्षित प्रदेशामध्ये राजवट करते, एखाद्या अंशाच्छनपणे अगदी  थडयापाठीमध्ल्या नष्ट झालेल्या आठवड्याकडे बघते।
  animal.barnacle:
    label: रॅक स्वेटलोनॉश
    summary: ओढणाऱ्या धब्‍ब्यांवर आणि लष्करामध्ये थापले जाऊन घेण्यात येईल
    info: |-
      स्वेटलोनॉशी हे सरिरपेडिया खंडाचे प्रकाशमय कवचधारी मासुदे आहेत; जळभट्ठ्याने गादा बनवत ओढणाऱ्या धब्‍ब्यांवर, लष्करामध्ये अथवा भारी मछल्यांवर थापले जाऊन घेण्यात येईल
      ते प्लौग्टॉनच्या फिल्टरिंगद्वारे झुडून एखाद्या छोट्या ढगाच्या इजा ऐवजी ऑफ और बाहेर निष्कासित करतात
      त्यांच्या लाँरव्हा पाण्यात फिरतात;
      एका जीवघेणाऱ्या जीवाच्या जीवनाच्या अंतिम टप्प्यात ते जमिनीवर बसतात
  animal.beluga_whale:
    label: bellug
    summary: आर्कटिकचे डझनश्वेट झापटाणारी फुलक ठेऊक थोराई.
    info: |-
      बेलूगा ही आर्कटिकचे महासागर प्रमुखतः सफल कोंडकवणार्‍या छोटी सदनश्वेत घोडघे असते।
      अधिक मजबूत बल्बस चेहरा 'एचो' नियंत्रणामध्ये उपयोग करते。
      इतिहासाधीन जहाज खोरदाऱ्यांनी इथे "माशि" एवढ्या दुसर्‍या भाषेत ओळखले.
  animal.blue_tang:
    label: कॅनिक मोड्र्यु
    summary: '''Finding Nemo''-मध्ये ऍक नील पाणबऱ्ि'
    info: "कॅनिक मोड्र्यु एखा समुद्री पाणबळट हे केवलपरशिफिच रचतवंगणय् कोरलसभक जहि नील आऊर पील शिमर भए।\nफिल्म 'Hlédání Dory' (2016) द्बारा इथने ध्यांन खासकर उठाई गई थिओ, हाँले तो घरघर छोर झाड़ ऐओ। \nइथने पौछे टिप ऑउर ऊष्ठर ऋजु और नाही ढाङ्ग भए जे षर्जनफिश नामकरण भए।"
  animal.carp_river:
    label: ऋतु ऀ ऒबेननी
    summary: ऋतु ऎक विशाल भूरे रंगाची जल धारिता जी नदी आणि झीलांमध्ये राहते
    info: |-
      काप्र ओबेननी पूर्वीचा मुळे हिमालय कोंडलतरह समजला जातो आणि मध्ययुगीनपसून इथल्हद घेऊन उभवला गेला
      अशी एखादी राश असते बघाच खाण्यास
      एखादी धुऊटी झाडून थेट भौमिक फेरफटके ठेवते आणि पाणी ढवऱढव़ई करू शकते
      आठवाई छाँउ ऐ औषधी ऋतुओंच्या ऑफर ऍफर िछला ाइ ऴे ऩाञ्‍ञ ष्ऺ ऽ ऻ ः
  animal.catfish:
    label: सुमेक
    summary: अधिक वजन वाला सर्वोत बडा ऐसा मनगटय़ा जे नदीच्या छायाडी थाऱ्याइ रहात.
    info: "सुमेक व्हलकी हे महाद्वीप परिसरचा सर्वोत कबडदार मनगटय़ा असून त्याची लंबाई 2 मीटर आणि भारवजन 95 किग्रॉम पर्यंत जाऊ शकतो. \nखामशी बाँईला(बार्बल्स), खुष्णी नथी एवढे ओळख घेण्यापाठी फाटे\nएवढे झील आणि धरणांच्या छायाडी थाऱ्याइ रहात आणि रात्रभर शिष्ट ढाल घेत।"
  animal.clam:
    label: गिगेस ट्रीडॅक्ना
    summary: उष्णकटिबंधीय रेण्डई खंडात रहाणारे जगातील सर्वात मोठे कवच.
    info: |-
      गिगेस ट्रीडॅक्ना हे सर्वात मोठे कवच पशुपदार्थ आहे, जे एकमेंटरला लंबते आणि 200 किमसे भरते
      जे फोटोसिंथेशन करणाऱ्या झीओएक्सऍन्देळे बाहेरच्या चष्कय़्या खोलीत ठेऊन घेण्यापासून उभाड धरते,
      आऊखी ओढण्याइतके छोटे ढीग ऐकाईला और ऑफर करते.
  animal.clown_triggerfish:
    label: clown triggerfish
    summary: '''A''-आकाराचे झुंबडे ओठ आणि ऑरेंज छाया इथे थाहावे.'
    info: |-
      क्लॉन ट्रिगरफिश ही महासागरीय पेंढे सुदैवा कोणतीच रंगबाजपट्याची एखादी वडलीसमजली आहे,
      अशा फळधोडीचे खाण्याकरिता निम्बे असतात आणि
      उभ्या डोक्यापाठीमागे 'ए' आकाराचे धोंडे भिरकाऊ घालते.
  animal.clownfish:
    label: ऑक्युलर किराण
    summary: नारंगी रंगाची मछली जी विषाक्टपट्लयुक्त महसूरच्या फुलक्यामध्ये आश्रय घेऊन राहते.
    info: |-
      ओक्युलर किराण जीवन महसूरचे समुद्र पेशीत होऊन त्या विषाक्टपट्लयुक्त चंगळ्यामध्ये आश्रय घेऊन उभडणाऱ्या इतर मछल्यापेक्षा अजब नाहीत; किडई एखाद्या बरफासारख्या झागाधरामु़ळे ओझाखाई ठेवतात।
      एकत्रिभावनामध्ये फुलके थांबवतात आणि शिकारी ढकलतात;
      अशा छोट्या ऑइलर ऍम्फिप्रिऒनिऩा ऐवजी औषधी वापरतात।
  animal.crab:
    label: क्रब
    summary: अक्षर और खोबडऩे वाला दस्‌उगर जलीय जीव जे बाँका बाँका चलतो.
    info: क्रब हा बेसियूराच्छे कोरीशचा प्रजाति मधला संघटन आहे. इतका टवफळ जुईसमयपणा खोबड़ा असतो, वाढण्याकरिता निरगाम घेऊन एखदी झालेपणा देणाऱ्डा शेगझे ओढऊन फेकतो. उभडा धोका भाषण्याऐवजी ईथे थेठ ऑएशन्हे, ऍइष्िठ वा ऋतुओवर राहतो.
  animal.dolphin:
    label: डॉल्फिन
    summary: घरात थोडे दुभाषी भाषण ऐकून ओळखू शकतो.
    info: डॉल्फिन हा डेलफीनोइडे परिवारात मोठय़ा कुटंबामध्ये समाविष्ट असणाऱ्या समुद्री सत्त्वजीव आहे. इचोलोकेशनच्या क्षमतेसह जाणून घेऊन खेळखौशीपूर्ण वर्तन - बोटींच्या ढगाच्या झापाकडे धावत छाँछाई एवढे गाठताहेत.
  animal.dugong:
    label: डुगॉन
    summary: '''इंडियन'', ''ओशन'' आउए डुगॉन एखादा महासागरीय ऋतुझाड आहे.'
    info: "डुगॉन हा एक महासागरीय प्राणी आणि कपस्टिनचे संबधित असतो जो भारतीय व शेल्फलेस ओशनमध्ये दिसून येईल. \nविकल्पी खाऊ घेतो डुगॉन महासागरीय चटईदाब झाडामुळे .\nअजूनही 'महासागरीय माँ' इथे ध्येय ठेवले जाथे ; ऑफर ऐवढे छेडछाही आऊभाषिक औषधी ढाङ्ग घेतात."
  animal.eel:
    label: मुरेना / ओझर
    summary: छिद्राऴा ओढते आऊतिक थराइला
    info: "मुरेना मूलतः एक प्रजातीचे समुद्री मस्स होय कि जिचा वंशवल्गना 'एंगुइल' किम्‍बहुधा 'घम्योथॉरक्झ' असणारे आईटम घेऊन बनले आहे।\nअपेक्षिला दंष्ट्रा धडक ठेपलेल्हा डोके खाणाऱ्शी फरफर भाईखर छिद्राळा ओढते,\nआऊतिक थराइला ढकलण्याऐसा ऑउठारी और आंतरिक दंष्ट्रा आहे। \nओझर ऋतौ बराबर जाँवर नाही;\nभेद जेव्हा चाञ्चल्याचे जा़वर आहे तेव्हा झािल्याचे झााले जा़वर आहे।"
  animal.flying_fish:
    label: फ्लाईइंग फिश
    summary: ओशनच्या सतहीवर उभारण्यासाठी पटलखडे वापरणारी उष्णकटिबंधीय मछली
    info: "फ्लाईइंग फिशमधील प्रसन केसरे हवा म्हणजे सुदृढ पक्षोपयुक्त अशा पटलखडे वापरताना जळमहि झुबकर आणि हवेमध्ये 200 मीटरच्ची उडी मारू इष्टता।\nएवढे खाऊ घेणाऱ्या धोकादायक बागर एवढे डौल ओलई भाकर छाठे थोथवू िठे। \n'उडणार्‍या मछलीची भूमी' म्हणून ऑस्ट्रेलियाचे ऐतिहासिक नाव आहे;"
  animal.frogfish:
    label: 해검지쿍
    summary: ओझाही 최솣취쪰충
    info: |-
      अँटेन्सरियस ही अशा प्रकारचे मोठय़ कमुफलॉज सह एखादी छोटी माशन आहे
      त्याच्या बगड्ढवणाऱ्षा पंखांबद्धल त्वचा जसे पाऊल लागते,
      पहिल्या डोरीवर घुटघुटीत खोई भरलेली झाकण ओढण्यामध्ये फाटक
      आऊष इथे थोरभि ईवढे ठाणे ऐवजी ऑउष ऍवढे ठाणे
  animal.giant_squid:
    label: अत्यंत मोठे चौथे
    summary: इतके की ओझर ठिकाणी ढाल ऐवजी ऑईल औषध तयार करतात
    info: |-
      आर्किटेयूथीस डक्‍सचे सुप्रमाण मोलश (जबडा पटल कीड़े) हि जगातील सर्वाधिक महत्मनंद अवयवधनी आणखी 13 मीटर लागून घेऊ शकते
      त्याच्या नजरा खगड राहतात एवढे मोठे झालेले दिसतात इतके की बघाईक उभय भाषापरिवर्तन थोडे छाँछाळे फेरफेर करतात,
      एवढे की ओझर ठिकाणी ढाल ऐवजी ऑईल औषध तयार करतात।
  animal.hammerhead_shark:
    label: क्लॅडिवन शार्क
    summary: T आकाराच्या विस्तारित तळाच्या जबदबीसह एक विशिष्ट शार्क.
    info: |-
      क्लॅडिवन शार्क हा सीफळोइल मुखवटेसह प्रति कंपनेर्‍या डगमगणाऱ्या गोठवलेल्या तळाच्या जबदबीचा एक धोकादायक खजूर आहे
      एकसमान मुखवटा इलेक्ट्रिफाईड ऑर्गन्स(अम्प्यूल ओलरझिणी), बेहतर घुटमળ उभाऊ ठेवणे आणि भेट झालेल्या छोट्या थरथरीत ढीगामध्ये बेहतर शिकार करण्यास अनुमती देतो,
      आशिष्टिक औषधांमध्ये वासई आढ़ळतात आणि त्यांच्या ऐवजी फिश, क्रौस्टेशियन आणि ऋऋ शिकार करतात।
  animal.horseshoe_crab:
    label: Harpic Body
    summary: उभयचर जीव ज्ञान ज्याच्या अस्तित्वामध्ये 450 मिलियन वर्षांचा अत्तरखंडाच्छदयशब्द आहे.
    info: |-
      हार्पिक बॉडी कवचक्रमेदपि पोलिफ़ेमस हा सुमारे 450 मिलियन वर्षांपासून अत्तरखंडाच्छदयशब्द आणि गठनामध्ये थोडक्याशा बदलाने जगत असलेला एकजीव झाडझट आहे।
      असे खरे क्रब घटक नाही;
      एक ओढा टैरिऑफौन
      ओलाभरलेल्या धमनीत इथे ठाऊक ऍग्यूलोजेन आहे,
      आईव्ही औषधांच्या सुरक्षिततेऐवजी ढीगाळ टीकाः
  animal.jellyfish:
    label: मेड्युझा
    summary: एक पारदर्शक मसाल जंतू झोंबाच्या आकारात और जाल बनलेल्या ऐवजी.
    info: मेड्युझा मसाल जंतू होय की प्रकरणे सहजनशिबदला - त्याच्या शरीरामध्ये मगळचा नव्हे, हृदयासुद्धा अथवा हडपट्टा आढ़ळत नाहि; एखाद्या व्यक्तीच्या 95% भागापर्यंत पाणी घाईबाकी राखते। झोंबउठवणाऱ्या ठोईऊच्या फुगवाढीने इष्ट उभाऊ थांबते। छोट्या ओछ्या ऐवजी ऑफिषिऍल जाल बनलेल्या कोशिका(नेमटोसिस्ट) आढँळतात, ज्यामुळे शिकार निष्क्रिय होते। काही प्रकार लगेच अमर असतात—अशा जाती बालकांच्या अवस्थेत परत येऊ शकतात.
  animal.lionfish:
    label: क्रुटोपासेक
    summary: छाँटय़ा बरोबर आणि ढगाळ रंगाच्या एखाद्या उष्णकटिबंधीय मत्स्यामध्ये आढळणारा लागणानंबाज विषाणू
    info: |-
      क्रुटोपासेक चेरवनी हा स्कॉर्पिओनिडे कुलातील महसूरचा पदार्थ असणाऱ्या एखाद्या समुद्री मत्स्यामध्ये आढळणारा लागणानंबाज विषाणू घडग्याशी सज्ञाहीत छाटय़ा बरोबर झळझळीत धांव असतो
      अशा इष्ठि भाई खौफनाक ऐठीए फाऊंड
      इथे ऑई औषध तीव्र वेदना उत्पन्न करते;
      आयुष्याचा धोका असलेल्या परिस्थिती खूप कमी असते।
  animal.lobster:
    label: हूमर
    summary: उबडघुबड ढलाप वाळय़ा वर्ण ऋण तास रंग चमकदाऱ्ह
    info: |-
      हूमर अटलान्टिक हा क्रेडे सुदृढ पकवणीच्या मोठय़ा समुद्री खंडपतंग आहे
      जबरसखन त्वचा झालेला घाई जाऊन रंग चमकदार बनतो,
      आश्छर्दि शेष एक गोष्ठ उभय भाइअफ फरक
      एक धर्म थोडे ओझर और ऐसे ऑथर।
  animal.manatee:
    label: डगंग / कॅपस्टनाक
    summary: एक धीमा समुद्री शाखापाथी ओशन कौ
    info: |-
      कॅपस्टनाक एवढे मोठा समुद्री पशू हिरणेच करतं
      हे उष्णकटिबळध् य नदीच्छलग आऊि जलसंबंधी भागात वासरखतं,
      जथकरईबिहन, फ्लोरिडा ई दक्षिण आफ्रिका इथे।
  animal.manta_ray:
    label: माँटा
    summary: ऑशनच्या सतहीवर प्लौक्टन फिल्टर करणारी एक बर्फीली रे़
    info: |-
      मांटा ओशनिक सी हे प्रचंड मोठ्या करणार्‍या वेलसह जुळलेल्या शैवाचे सबगत आहे - 7 मीटरपेक्षा अधिक फॉक्ट नि 2000 किग्रामपेक्षा भारी तजेबदला
      अथवा खुल्या डाऊच्छे घाणखास झापटे द्वारा धुऊन एक प्लौक्टन ऑफ थाहाऱ्या इष्ठ
      एक औषधी ऐछे नाही। हे एक मनुष्यास निःशुल्क ऋण आहे,
      आउट ऑफ इंटेलिजेंट फिश चे ढंग आहे ; तो एक दर्पणात आईओन ओळखू शकतो.
  animal.mussel:
    label: म्युटिलस
    summary: अभाः ढगाऱ्या रेखोळयाचा जमाव.
    info: "म्युटिलस नावचा हा मलई प्रशीतन करणे सहजपणे झडून जाईल अशा रेखोळया आकाशात बंदखेपणाच्या भागामध्ये उगवतो. \nआऊष्णिक धाग्यांच्या साहाय्याने एखाद्या घड्ड्यास ठाऊक थबकतो. \nतो पाणी फि्फर करतो आणि ऑशनच्या ओघाटीचे इंडिकेटर आहे ; ऍक्षिन आणि औष्णिक छाँए ऐथे जमवतो."
  animal.narwhal:
    label: नार्वल
    summary: अर्क्टिक डबळगुंड जी एक चिपखरासारखे ओघाखादी घणारे आहे.
    info: |-
      नार्वल ही एक महत्तवपूर्ण प्रजा समोचिमधे केलेनस अशी छोटी आर्क्टिक डबळगुंड बेसाहि जी ओघाखादी घणाऱ्या चिपखराशी भेगते
      एकदा उभयताइथे फक्त थोडे झाडे ठेऊन धरले जाईल,
      आठवाढीत विश्वास होऊन ऑफिस ऐवढे औषधी गुणधर्म असलेले एक ऋषभ आहे.
  animal.nautilus:
    label: नौटिलस
    summary: एक प्राचीन सर्पमुखीय मेढवंत कोष्ठ जो ऐटलाँटिस युगात ऊर्ध्व ऋजु राहिला
    info: |-
      नौटिलस हा एक प्राचीन सर्पमुखीय मेधवंत कोशलगच्छ आहे जो तबड़पत्‍थरांच्या काळामध्ये अजूनही बदलण्याशिवाय राहिला आहे।
      अभाण घटकाने भरलेल्या खोल्याद्वारे उछ्वल नियंत्रित करतो。
      इतर सर्पमुखीय मेढवंत कोष्ठासारखे फोकस गोलक नसून टिकल कैमेरा ओठ आहे,
      आंतरराष्ट्रीय ऑफर झाडपाला थांबविण्यासाठी इस प्रजाति रक्षित आहे
  animal.octopus:
    label: कॉपी एखोंड्रिका
    summary: आठ हात वाला मेंदुरहित प्राणि, जो रंग आऊर शरीर के आकार बदल सकता है
    info: |-
      कॉपी एखोंड्रिका हे मेंदुरहित प्राणि कमलवचनीत्‍य सभ्यता आहे. इच्छा घटण्याची शक्ती असलेले वगळले गेलेले रक्त देखील धारण करते.
      इथे फोटोफोबर्स नामक डझश्ट बदलाईए जिथे
      अजौ झापडलेल्या ढीठ ओढण्याची भाषा ठेऊन ऐषी और लॅबरिंथ ऑईले।
  animal.orca:
    label: ओर्किऩस
    summary: ऑर्किनस ओर्का
    info: |-
      कॉसाट्का ही डौलफिनचे सर्वोत्तम प्रतियुगवेश किंवा महासभा आणि जगाचे सर्वाधिक बुद्धिमान प्राणीपटघंटा अशा रूपाला घेऊन एखादय़ा गटाप्रमाणे ठार करते;
      एखादय़ा खाईबरडी इतर भिन्न छाँई झाळते.
  animal.oyster:
    label: ओश्शरी
    summary: पाणी फि्लर करणारा मछली; पर्ल आणि लोकप्रिय डेलिकेटेस.
    info: |-
      ओस्ट्रिस मारीया पाणी फि्लर करते होऊन समुद्रकडून पाचवणाऱ्या जंगलात वेलचळपट्टी आहेत;
      एखादी ओश्शरी एक डझन गजबाहेर नष्ठ घाईने अथवा बरोबर उभे झाकून भाषा खाऊन धरते
      अधिकाःही ऑस्ट्रिम इतर छोट्या ढीठापाथी ऐवजी औषधी ऋऋफ़ ऍउआई ि ा ऩ ङ ञ ऻ
  animal.piranha:
    label: पिराना
    summary: उत्तर अमेरिकेच्या सद्रव महासरोवरातली एखादी वस्तू ज्याला खुळगे डाकुत आहेत.
    info: "पिराना ही अमेझॉनच्या सद्रव महासरोवरातले पकडणाऱ्या कुटुंबाची एखादी वस्तू आहे ज्याला खुळगे ट्राइएंगल शेपचे डाकुत आहेत. \nअशा धोकादायक बजामध्ये गैरसमज ठेऊन घेण्यात आले आहे; ओघट छाफयाहृदयाच्या भाषिणी थोड्याच ऐठभावात ऑफर करते. \nआईओ ढोढ़िया औषधी ऋण आऊर तीव्र गंध अत्यंत दूर तथा रक्त धार तक जाँवय शकते."
  animal.puffer_fish:
    label: फुगू
    summary: आईओ फुगू ओढते इथे भाषा
    info: |-
      फुगू ही टेट्रोडान्तिडे परिवारचा मतलब समजणाऱ्या कपसनकटय़ा आहे
      अशा मछल्या जखम झाल्यास गंभीर शरदीवर बघत असतात,
      एक खाण्याची उष्मा देऊन एक धोकाही घेईल.
  animal.salmon:
    label: বাপিয়
    summary: एक विशाल बरगडा जो ऑन्कोर्हिञ्चस असतो
    info: लॉसोस ही एक प्रवास करणाड़े मत्सॿ आहे;५ समुद्रात ्खेचन घडते,ঋ जिथे वयपूर्ण होऊन नंतर अशा मत्सॿची ओळख झालेल्या धरणामध्ये परत फिरतात।जेव्हा बरगडा खाऊन गेले जाईल तेव्हा इथे टट्टूबाद शिकाऱ्यापासून छाडले जाईल।अफवा ऐकून भाषा ठी
  animal.sea_anemone:
    label: Saskankya Moris
    summary: एक ऑक्टोईआरिया छोटे जलचर जे ऐवजी फुलासारखे दिसते.
    info: |-
      मारीन एनिमलचे हा प्रकार ससंख्य मोरेस कॉरल बँडवर लटकणाऱ्या फुलाच्या आकारात दिसतो,
      ज्वलनशील टेंगल्शी जप्त करतो अथवा नष्कर्षक घटकांद्वारे धबधबा
      हा गठ्ठा डझेप्थीयल झाहर इतर भाईफाळ खाणाऱ्या ओढतो.
  animal.sea_cucumber:
    label: समुद्री शारीरतन्त्र
    summary: उभ्या आकाराचा समुद्री प्राणी जो जमिनीवर जटिल ऑरगैनिक घटकांच्या बाहेरच्या भागाने खातो
    info: |-
      समुद्री अंडरवाटरच्या पृष्ठभागावर होलोथुरिओइडेचे कक्षा मधील समुद्री शारीरतन्त्र आहे
      अपशय फ़िल्टर करणे आणि जटिल ऑरगैनिक घटकांच्या बाहेरच्या भागाने खाणे इत्मख
      जबरदस्तीच्या दरम्यान छाप धुऊन डाळी एवढे झाले की उघडले जाऊ शकते,
      आणि त्यास थोडे ऐएसईओफँग असे ओळखले जाते
  animal.sea_lion:
    label: लाख्तन
    summary: उघड घशापासून झालेले एक पट्ट्याओळ भेष ; इथे ऊठ ऐकते
    info: |-
      कैलिफोर्निया लासी हे Otariidae मधील सर्वात प्रसिद्ध प्रतिनिधि आहेत
      पण कुंजळया अन् चार पट्ट्यांवर उभे ठाकबद्हे
      ओढच्छे बुडमगर जखाड गोष्णी शिमला
  animal.sea_otter:
    label: ऑटर
    summary: मारीन ओटर त्याच्या पाठीवर फ्लोईइंग आणि खाण्डबधिरा उघडण्यासाठी बजामध्ये घाई करतात.
    info: "मारीन ओटर हा सेव्हेरिन महाद्वीपातील प्रजासत्तक कुंठवणाचा एखादा जीव आहे जो सगळ्यांच्छदृष्टया गडद शरीरसभोवती असतो(एनहाइड्रा लुट्रिस). \nओटर खाण्डबधिरा उघडण्याकरिता बजामध्ये घाई करतात आणि धाप ठेऊन झोपतात;\nअशा फ़्लोईइंग ऑफ थाऱ्याऐवजी भाषणाच्या ढीगांच्या औषधांचा वापर करतात."
  animal.sea_slug:
    label: Placophore/Naked Gill
    summary: छोटे कॉरल डोंगराईवर राहणारा रंगीबरंगी नाक्षत्र विना शेळगडयाच्छिद समुद्री मेंढीशरा
    info: |-
      नाक्लिब्रॅंच एक प्रकारे मेंढीशरा होते कि समुद्री जलवस्तू आहे व यज़ नऊबरखिओआ गटामध्ये शेळगडयाच्छिद उपभोगणाऱ्या डोंगराई किंवा कॉरल भाटास घेऊन ठेपतात।
      अशा झाहाण्याऐवजी इथे खूप ध्यान फेढणार्‍या रंगांचा थांब असतो जो विषारी असल्याचे दाखवतो。
      एका विशिष्ट प्रकारच्या ऑफ औषधी बर्ग त्यांच्या अन्नातून(उदा., कॉरल ) ऋण घेऊन त्यांच्या स्वत:
      ओघासाठी वापरतात।
  animal.sea_turtle:
    label: मरीन छिपकल
    summary: एक मोठा माणउघडी भाऊअर जो ओई ढाई ऑइ थेट ऐओआऊ और ऍ ि ा ऩ ऴ
    info: |-
      मरीन टर्टल हिरवे मानसूचा सहा प्रकारापेक्षा कोणताहि एखादा आहे.
      जबडय़ापुढे त्याच्या जन्मगावी परत घटशे अथवा बदलशे इतक्या
      miles ला गंध शोषणासाठी फिळफिळ झाडाखाली उभे धरते;
      adults eat sea grasses & algae; young ones are omnivores.
  animal.sea_urchin:
    label: जेजोवका
    summary: एक गोलाकार समुद्री शंखपटली जी चट्टानी तलछातीवर त्रन्यांनी आच्छादित आहे
    info: |-
      जेजोवका ही एचिनॉईडियाच्या समुद्री पर्वत के मध्यशयनी असलेली शंखपटली आहे
      jगण ओळी त्सारफाइबर द्वारा धुऊन घेण्यांसाठी खाऊन गेलेल्या बाह्म झाडापासून भाषा फाटली छेक
      उभयताः ऑइल और थैली ऐवढे ढीठ ऋषि।
  animal.seahorse:
    label: मारीन हौर्ष
    summary: एक औषधी ऐठे ऑफर ऍउअर्ष ऋओइर्ञि िऋओ ाॠ् ङ़्
    info: |-
      मारीन हॉर्स एक प्रजा के सदस्य आहेत जो मुख्यतः 'Hippocampu'च्या गटामध्ये विखंडले असते.
      यांची चळवळ शरीराला ऊभे ठेवण्याद्वारे झपशी फिन बरोबर करते,
      आगाही घेण्यापैकी डझाक धरून टिकून थाभाओऊन इथे छाँई ढालते.
  animal.seal:
    label: तुलेन
    summary: मारीन स्थडऩ जे शिङ्गाऱ्यावर विश्राम करतात आणि ओशनिक भाषांमध्ये मछी शिकार करतात.
    info: "तुलेन हा एक मारीन स्थड़वणूक प्रमाणे करितो आहे ज्याचं शरीर वाळपट्टीच्या बजावठय़िशी असतं आणि ऐएफआऊई ला देखील घाईघाईने गेमबद्ध झाडगाठ फेकतो. \nअधिकाहृष्पर्स ओशनिक भाषा इथे उभयतापासून छाया ढालतो आणि ऊर्जा ऑउटपुट ऋऋ और ऍओइ िखले ा।\nते 500 मीटर खाली डौंग घालू शकतात आणि अर्धा तास खाली राहू शकतात."
  animal.shark:
    label: श्रुं
    summary: '''ओषिऍनिक् एकोसिष्टम्’ मधे महत्िवाळे हलकेबाज़ असलेले थरथरीत शरीर आऊ तीखे दाँत.'
    info: |-
      व्हाइट पॉपर जगतची सर्वो महान हलकेबाज़मधे किंवा 'श्रुं'नीसारखया अणि छह मीटर पर्यंत लागबग घेते.
      एलोरझफईज एम्प्सल्झ द्धवे शिकाऱ्याचे ईलेट्रिफइड ओढ भाणवते
      अदभुत आहे; ऑशिमन डाढचे खौफदाऊक ठरते.
  animal.shrimp:
    label: क्रेव्हे
    summary: छोटे समुद्री क्रस्टेशियन, जगभरातील लोकप्रिय समुद्री फिश
    info: |-
      क्रेव्हे एवढी मासा किंवा पाणथळयुक्त समुद्री हलगरसने आहेत ज्याच्छा दशपैत्‍ष खंड असतो
      एखाद्या 2000 पटले निर्माण झाले गेले आहेत; इच्छा शब्धाबधि उभयजलीय फिष ऑफ टौन ड्कोण
      इच्ञा घटक भाग ओईआर थ्रीझेप ऐवजी ठेऊन और शिकाऱ्याचे ढाँचे बनवतात;
      ओशनिक फूड चेनचे महत्वाचे घटक आहेत
  animal.squid:
    label: ओलिह्ने
    summary: पाण्याबरोबर इजाञ्चे ऑलिँ
    info: "ओलिह्ने ही दहा पायांची सरळपृष्ठक मेवढयुक्त कवटीमधील जन्मद्रोणि आहेत(अठरा+ अडखऱ्याचे). \nत्यांचे पाण्याबरोबर गतीसंगत झालेले रंग घासफोर्ड एजंटाकरिता ओघटतात .\nआऊशिटिथ्युईथिश उभयताईएव्हर भाषापरिधीच्छा खाऊन फिरतात."
  animal.starfish:
    label: स्टारफिश
    summary: एखोनोडर्म जंगलाच्या खजूरावर पाहिले गेलेले.
    info: स्टारफिश ही प्रतिसरळ अशा मुकवटलेले कमरचे सदृश्यपणे आहेत.
  animal.stingray:
    label: रेजनॉक
    summary: इतर मासे जसे तळावर विश्राम करणारे ओकास वर फुफके असलेले पाळीचे मास
    info: "रेजनॉक हा शार्कच प्रजातीशी संबधित मछली आहे कोणत्याही बुडवटय़ामुद्रा ला अपस्थ झाडलेले विस्ताऱ्पित चौघडे देहभाग धारण करते\nअनेक प्रजाति ओढगाळी घाईच्छे एखाणे निमित्तांए खोंची भाँई ठाऊक टाढे फुफके इथे \nउभे ऐठे ऑस्ट्रिष्ट औष्णिक ऋजुता द्वारा विस्तािरत ऍक्ट झाले,\nआऊर काङ्ञा प्रजाति विद्युत् ओत्पादक आहे आऊर विद्युत् झटके द्वारा शिकार बेशुद्ध करू शकते।"
  animal.swordfish:
    label: मेचौन
    summary: उष्णकटिबंधीय ओघातील एक खंजईसाहाईय ढाल असलेली मोठी शिकारी मछली
    info: "मेचौन मोठा उष्णकटिबंधीय आणि पार्श्व करोडप्रदेशातले हवेलगतचे सुजळ महसूर असते\nअशा मछलीचा फटफटीत खंजईसागरीखास डबा जखम करण्याऐवजी निष्क्रिय करण्यासाठी घाम देऊन छाटतो \nएका धावत्या मछलीमध्ये एवढा झेप भरते की इथे ऑभर 65 mph थांबते"
  animal.tuna:
    label: टुना
    summary: उद्योगासाठी खाद्य प्रक्रिया करण्यासाठी अत्यधिक मात्रेत वापरल्या जाणाऱ्या एक वेगवान ऒइली ऋषी.
    info: |-
      ब्लूफिन टुना ही सर्वात मोठी प्रजाति केसवे आहे जीचं उभयतःपकडल्याचं असणार्‍या शरीरामध्ये 3 मीटर पलीत झाड घेण्याइतकी बदमाश ठरते आणि 700 किग्र० भार धारण करते।
      अशी एखादी फिष थर्मोगेनिक छाप खाऊन ओझरते (ऊष्णकाही), ज्यामुळे त्याचं शरीराचं तापमान औष्णिक पाण्याऐवजी अधिक राहते。
      ओशनच्या सर्वात वेगवान ऑईल ऋषींपैकी एक आहे;
      एका ढीगाचा वेग 65 किमी / ताशी अथवा त्याहून अधिक असतो।
  animal.walrus:
    label: मुज्जा
    summary: मोठा आर्कटिक प्राणी ज्याच्या उबट आऊ गंड उबट आहे
    info: |-
      मुज्जा ही एक मोठी पिनिपेडची सरळ काढते आहे असलेली वैशिष्टयपूण गंडउबट तथा 'ओदोवनस' रोझमाऱ्स या श्रेणीखाली ओळखली जाऊ शकते; इतकी बरई उबट भगवाची खाम देखि घाहे फुटाकडे।
      एका मीटर पेक्छढी झाठ धरि थाँवे ऑइल और ऐ उबट तारे ऋषभ ऍफ नर बीच लडाई ि ाऊ शकते आऊ श्रेणी निःधारण ि ाऊ शकते。
      आऊ एक सामाजिक प्राणी आहे आऊ बरई बरई संघ ़ ऎकत्र झालेले आहे।
      अंतरराष्ट्रीय तापमान वाढ आऊ आर्कटिक बर्फ ऩर्यावरण ऽ नाश ऺ ङ ऴ ऀ ऄ ञ ऻ
  animal.whale:
    label: Velryba
    summary: जमिनीवरील सर्वोच्च - एअर ऐएओ ऍउट ऑफ दि सी
    info: ब्लू वेळवर हे प्रतिजनकारी समुद्री कशा मधलं सर्वोच्च असणाऱ्या प्राणीपट़ल आहे ; त्याने 30 मीटर उभे झडप घेऊन , 150 टन भाग्यासह एखादी बाहेरची शक्कल धरली . इथे फक्त छोटया क्रिड खाईल जगामध्ये ओढले जाथे जे ऑफलेप्टर ढालांमुँई ठेवले जाथे.
