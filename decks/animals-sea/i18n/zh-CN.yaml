lang: zh-CN
pivot: false
title: 海洋动物
cards:
  animal.anglerfish:
    label: 海洋恶魔
    summary: 一种拥有头部长有能发亮以引诱他人的工具作为捕食手段或求偶方式之一种鱼类
    info: |-
      {"hint":"深海发光诱饵鱼（鮟鱇目）","info":"海洋恶魔（Anglerfish，学名：Lophius），生活在超过一千米的黑暗海底。
      雌性在头部有一个生物荧光钓钩用来吸引猎物和雄性的注意。\n雄性能小得惊人；一旦找到配偶便附着其上并融合为一个整体。\n这种发出光芒的能力来自与之共生于钓具中的细菌所产生出的效果。
  animal.barnacle:
    label: 藤壶
    summary: 一种依附于石头和船只的小型固定生活节肢动物
    info: |-
      藤壶是附着在岩石、船体甚至鲸鱼上的水泥状分泌物的固著甲壳类动物。它们通过从外壳中伸出足部过滤浮游生物为食。
      其幼虫阶段可以游泳，之后定居并转变为终生固定的成年个体。
      海洋生物学研究表面群落时会将这些物种作为关键性有机体。
  animal.beluga_whale:
    label: 白鲸
    summary: 头部圆润、表情友好的小体型北极地区白色鲸鱼
    info: 白鲸（学名：Delphinapterus leucas）是生活在北极和次极地海域的一种小型白色须鲸。其显著的圆形额头被称为“水滴”，用于回声定位功能。它是唯一一种能够左右活动颈部的鲸类，能发出多种声音进行交流；历史上航海者称它为‘海金丝雀’。
  animal.blue_tang:
    label: 蓝刺尾鱼
    summary: 一种生活在珊瑚礁中的亮蓝色小鱼，《寻找尼莫》中明星角色
    info: |-
      {"hint":"Finding Nemo 中的明亮蓝色珊瑚礁鱼（Paracanthurus hepatus）","info":"蓝刺尾鱼（Paracanaturus Hepatus），又称外科医生鱼，是一种来自印度洋和太平洋地区的小型海洋鱼类。它具有鲜明的蓝色体色以及黄色尾巴，并且在根部有刀片状结构。
      电影《海底总动员》(2016 年版)，提高了人们对饲养这种动物的兴趣；尽管如此，在圈养条件下仍较难照顾好它们
      这些生物以浮游植物及小型水生无脊椎动物为食。
  animal.carp_river:
    label: 河流鲤鱼
    summary: 一种大型金褐色淡水鱼，在河流和池塘中有栖息地。
    info: '{"info":"普通鲤鱼起源于亚洲，并在中世纪被引入欧洲。\n它是杂食性动物，会翻搅河床并可能使水浑浊。\n它象征着捷克的圣诞节；商贩会在木盆里卖活鱼给顾客。\n这是世界上养殖最广泛的鱼类之一，已知有超过一百个品种。"]'
  animal.catfish:
    label: 大西洋鱼
    summary: 一种大型带胡须的淡水河底栖息鱼类
    info: 大西洋鱼是欧洲最大的淡水鱼类，体长可达两米以上、体重超过一百公斤。其标志性的胡须（触角）用作嗅觉和感觉器官；它们生活在河流或湖泊底部，并且为夜行性捕食者，在捷克共和国被视为珍贵的运动钓鱼对象。
  animal.clam:
    label: 巨蛤
    summary: 生活在热带珊瑚礁中的世界最大种类的蛤
    info: |-
      {"hint":"双壳类软体动物，具有两个铰合的贝壳（瓣鳃纲）","info":"巨蛤是世界上最大的贝类之一。其长度可达一米以上，并且重量超过两百公斤。
      它与外套膜内的光合作用藻类(虫黄藻属Zooxanthella)共生生活。
      寿命可以达到一百年以上。
      关于它可以夹住潜水员的说法只是个神话；实际上它的闭合力太弱了。"}
  animal.clown_triggerfish:
    label: 小丑刺尾鱼
    summary: 一种具有白色斑点与橙色嘴唇特征的大胆着装型热带海鱼
    info: '{"hint":"色彩鲜艳的珊瑚礁鱼类（学名：Balistoides conspicillum）","info":"小丑刺尾鱼是一种大型热带海水鱼，属于箱鲀科，在海洋鱼类中拥有最显眼的颜色之一。\u005Cn它有强壮牙齿用于咀嚼坚硬的珊瑚和贝类。\u005Cn名称中的''刺尾''来源于其第一根背鳍棘的功能——像保险栓一样锁定第二根棘以防止误伤自己或他人。\u005Cn在繁殖季节时可能会对潜水员表现出攻击性行为。");'
  animal.clownfish:
    label: 眼斑双锯鱼
    summary: 一种橙色海洋生物与剧毒珊瑚共存
    info: 小丑鱼生活在海葵中，这些动物的有毒触手会杀死其他鱼类；由于有保护性的黏液层覆盖着身体的小丑鱼是免疫的。这种共生关系下，它清洁并驱赶捕食者离开海葵，并且反过来获得庇护所。所有种类最初都是雄性出生，在群体里最占优势地位的一个可以变成雌性。
  animal.crab:
    label: 螃蟹
    summary: 一种十足类甲壳动物，有硬壳和螯足，横向移动。
    info: 螃蟹属于短尾下目的一种节肢动物。它有一层坚硬的几丁质外壳，并会定期蜕皮以促进生长。其特征是身体向侧面移动。螯足用于防御、捕食以及交流。它们既生活在海洋中，也栖息在淡水或陆地上。
  animal.dolphin:
    label: 海豚
    summary: 一种聪明的海洋哺乳动物，群居并会从水中跃出。
    info: 海豚是鲸目中的一种海洋哺乳动物。它们以高智商、回声定位能力和活泼的行为而闻名——海豚喜欢从船边的浪花中跳跃，并通过鸣叫和咔嗒声进行交流。它们通常成群生活，被称为群体，与鲸鱼有密切亲缘关系。
  animal.dugong:
    label: 儒艮
    summary: 一种栖息于印度洋及太平洋的温和海洋植食性生物，类似人鱼
    info: 儒艮是一种与海牛相关的海洋哺乳动物，生活在印度洋和太平洋。它们只以海水草为食。
  animal.eel:
    label: 鳗鱼
    summary: 一种在珊瑚岩缝隙间游动的蠕虫状鱼
    info: |-
      {"hint":"长蛇形鱼类（鳗鱼属或裸胸鳝）","info":"海蛾是一种大型海洋鱼类，属于海蛾科，在珊瑚礁裂缝中隐藏。它有一对颌骨；除了口腔的外侧颌之外还有内部咽喉部的内颚来将猎物吸入喉咙。
      它们不会主动攻击人；咬伤通常是在受到挑衅时发生的。
      欧洲鳗鲡(Anguilla anguilla)，会迁徙到亚速尔海域繁殖并死亡。
  animal.flying_fish:
    label: 飞行鱼
    summary: 使用胸鳍在海洋表面上方滑动的一种热带鱼
    info: '{"hint":"热带鱼，利用类似翅膀的胸鳍在水面上滑翔（飞鱼科）","info":"飞行鱼(Exocoetidae) 是一种能够从水中跃出并在空中滑行的热带鱼类。\n展开的胸鳍像翼一样起作用；这种鱼可以飞翔达两百米远，并达到一米二的高度。\n它们以此方式逃避捕食者如金枪鱼、剑鱼和海豚等。\n巴巴多斯被称为''会飞之鱼之地''; 飞鱼是该国饮食文化和民族文化的组成部分。");'
  animal.frogfish:
    label: 海蟾鱼
    summary: 珊瑚礁 上 的 隐 形 杀手 ， 使用 钓杆 引诱 肉类 。
    info: '{"hint":"奇怪的伏击捕食者，用鳍行走（角鮟鱇科）","info":"海蟾鱼（Antennarius）是一种小型海洋鱼类，属于角鮟鱇科，具有高超伪装能力。\r它的胸鳍形似脚掌，在海底爬行移动。\r第一背鳍上有一个可动诱饵（illucium），用来吸引猎物。\r它能够吞下几乎与自己一样大的食物；整个吞噬过程只需六毫秒。","label":"海蟾鱼","summary":"珊瑚礁上的隐形杀手，使用钓竿引诱猎物。'
  animal.giant_squid:
    label: 大王酸浆草
    summary: 这是地球上现存体型最庞大的软体动物
    info: '{"hint":"生活在深海的巨大头足类动物，体长可达13米以上（巨乌贼）","info":"巨型鱿鱼（Architeuthis dux）是世界上最大的无脊椎生物之一，其长度可超过13米。\u000d\u000aN它们拥有动物界中最大眼睛的记录保持者——直径达25厘米以上的适应黑暗环境的眼睛。\u000d\u000aN这些生物通常栖息在水下约300至1000米之间，并且主要作为抹香鲸的食物来源；直到2004年才首次拍摄到活着并游动于海底表面之上的完整个体图像。",'
  animal.hammerhead_shark:
    label: hammerhead shark
    summary: 一种具有独特T形扁平脑袋的大洋掠食者
    info: |-
      锤头鲨是一种头部异常宽大的奇特鲨鱼（cephalofoil）。这种扩展开的头部有助于通过洛伦兹壶腹更好地探测猎物，并提高机动性。它们生活在热带海洋中，以鱼类、鳐和章鱼为食。
      一些种类受到威胁；因为其鳍而被捕捞。
  animal.horseshoe_crab:
    label: 鲎
    summary: 一种存活了约4.5亿年的古代无脊椎动物
    info: 鲎（Limulus polyphemus）是一种大约有四亿五千万年历史的节肢动物，从古生代至今几乎没有发生重大变化。它与真正的螃蟹没有亲缘关系；更接近蛛形纲生物。它的蓝色血液含有一种独特的物质——凝固素，被用于检测药物和疫苗的安全性。
  animal.jellyfish:
    label: 水母
    summary: 透明的钟形海洋动物，带有毒触手。
    info: 水母是一种没有大脑、心脏或骨骼的腔肠动物——其身体由大约95%的水分组成。它通过脉动钟状的身体移动。触手上含有刺细胞（刺丝胞），能麻痹猎物。某些种类几乎不朽——它们可以回到幼体阶段。
  animal.lionfish:
    label: 毒鮋
    summary: 一种具有明显脊椎并带斑点色彩图案的热带海水中有害生物
    info: |-
      {"hint":"有毒的珊瑚礁鱼类，有明显的刺（毒鮋）","info":"红鳍狮子鱼是一种来自鲉科的一类海洋剧毒性鱼类。它们有着醒目的黑白条纹和带有毒素的尖锐背棘。
      其分泌物会引起剧烈疼痛；但极少危及生命的情况发生。
      它是加勒比海与地中海地区的入侵物种，在这些地方会大量捕食本地鱼类资源。
      在非原生栖息地水域中没有天敌存在。"
  animal.lobster:
    label: 龙虾
    summary: 带螯的大型海蟹状生物，煮熟后变红但活着是蓝色的
    info: 龙虾是一种大型海洋甲壳类动物，属于Nephropidae科。其体长可达超过60厘米，在生的时候呈深蓝绿色；只有在烹饪时才会变成红色。
  animal.manatee:
    label: Dugong / 海牛
    summary: 一种被称作“海上母牛”的温顺海洋植食性动物
    info: "{\"hint\":\"缓慢温和的海洋食草动物（海牛属）；被称为儒艮\",\"info\":\"海牛是一种大型以海水植物为食物为主的哺乳类生物。\r\n它们生活在浅热带海湾、河流入海口以及加勒比地区、佛罗里达和非洲的一些海峡中。\r\n由于与机动船碰撞而受到严重威胁，许多个体皮肤上都有螺旋桨留下的伤疤痕迹。\r\n它移动非常慢(每小时约3到5公里)，每隔三至五分钟就要呼吸一次空气。\"}"
  animal.manta_ray:
    label: 蝠鲼
    summary: 一种巨大的优雅鳐形动物，在海面附近以滤食方式摄取浮游植物
    info: 海洋魔鬼鱼是鳐类中最大的物种，翼展超过七米且体重逾两千公斤。它在游泳时张开嘴巴通过鳃耙过滤浮游生物作为食物来源。这种鱼类没有毒刺；对人类完全无害。它是被认为最聪明的鱼类之一，并可能能够识别自己镜中的影像。
  animal.mussel:
    label: 海虹
    summary: 一种黑暗外壳、群集生长于涨落潮区域岩壁上的软体动物
    info: '{"hint":"深壳双贝类聚集在岩石上（贻贝）","info":"食用藤壶是一种生活在大西洋和太平洋潮间带的蛤蜊。\n它通过坚固纤维附着于石头；过滤水并作为海洋污染指标，会积累毒素及重金属元素。\n它是受人喜爱的食物资源之一，在比利时著名的炸海鲜薯条是世界知名美食。").'
  animal.narwhal:
    label: 独角鲸
    summary: 一种类似传说中独角兽、拥有螺旋形角的北极须鲸
    info: |-
      {"info":"独角鲸是一种小型北极须鲸（体长可达五米），具有螺旋状的标志性獠牙，实际上这是过度生长的左门齿。这种牙齿可以超过三米；雌性没有这种情况。
      它们生活在极地海洋中的群体中。
      在中世纪人们相信独角鲸角是独角兽有魔力治疗特性的角。
  animal.nautilus:
    label: 鹦鹉螺
    summary: 一种生活在古代、具有卷曲贝壳中的远古头足类海洋生物
    info: |-
      鹦鹉螺是一种原始的头足类软体动物，拥有螺旋状外壳，并且在近四亿年的时间里几乎没有改变。其壳被分隔成多个腔室；通过气体填充这些气室来调节浮力。
      与其它所有现代头足纲生物不同的是，它的眼睛是简单的无晶状眼（针孔相机式）结构
      国际公约保护这种物种免受过度捕捞。
  animal.octopus:
    label: 章鱼
    summary: 一种有八条触手的软体动物，能够改变身体的颜色和形状。
    info: 章鱼是一种无脊椎动物，属于头足纲。它拥有三个心脏、蓝色血液，并能通过色素细胞迅速改变皮肤颜色和纹理。它们非常聪明——可以打开封闭容器并解决迷宫问题。
  animal.orca:
    label: 虎鲸
    summary: 黑白相间的顶级掠食者、体型最庞大的海豚
    info: '{"info":"虎鲸是海豚科中最大的成员，也是世界上最聪明的动物之一。\n它们以协调的方式组成群体（家族）进行捕猎；每个家庭都有独特的狩猎技巧。\n通过声音信号的不同方言在不同族群之间交流沟通。\n被圈养时会生病(如海洋世界)，保护动物权利运动已促使限制其饲养。"]'
  animal.oyster:
    label: oyster
    summary: Filtering mollusk that produces pearls.
    info: '{"hint":"双壳贝类，生长在礁石和岩石上（牡蛎属或厚壳蛤属）","info":"生蚝是过滤海水的软体动物；一只生蚝每天可滤除多达两百升水。\u67d0些物种会在外套膜受到异物刺激时产生珍珠。\u8fd9种食物作为生鲜食用非常受欢迎，在传统习俗中人们通常只在月份名称里含有字母R的时候才吃它。\u5c4f养它们对海洋生态友好，并有助于净化海水中杂质。");'
  animal.piranha:
    label: piranha
    summary: 一种拥有尖牙的南美淡水掠食型鱼类
    info: '{"hint":"南美洲的淡水掠食性鱼类（锯齿鲑脂鲤）","info":"红腹 piranha 是亚马逊河的一种具有锋利三角形牙齿的肉食性淡水鱼。\r\nPiranhas 的致命捕猎者声誉被夸大了；它们很少攻击健康的游泳的人类。\r\n这些鱼以群体形式狩猎，敏锐嗅觉可以远距离探测到血液的存在。\r\n它是亚马逊河流生态系统中的重要组成部分。","label":"piranha","summary":"一种拥有尖牙的南美淡水掠食型鱼类"}'
  animal.puffer_fish:
    label: fugu 鱼
    summary: 能把自己变成一个长满了棘刺小球形状的身体结构来保护自己的生物叫做 FUGU 或者叫作 puffer fish 的一种海洋动物
    info: '{"hint":"受威胁时会膨胀成带刺球体的鱼（鲀科）","info":"河豚是一类属于鲀科、能够在受到惊吓时装满水或空气将身体胀大为有尖刺的小圆球状鱼类。\r\n它们体内含有四氢哒嗪毒素，是自然界中最强烈的毒物之一；肝脏组织和性腺具有致命毒性。\r\n在日本，食用处理过的河豚是一种美食享受但必须由持有特殊执照的大厨进行料理加工。\r\n这种充气行为是为了防御而非攻击手段。"]'
  animal.salmon:
    label: 鲑
    summary: 一种大型由海入江溪产卵的鲑科鱼类
    info: |-
      鲑鱼是一种溯河洄游鱼类；它们在海洋中成长，但会回流到数百公里外的出生河流进行繁殖。当鲑鱼开始逆流而上时，其颜色从银色变为明显的红色。
      大多数太平洋种类的鲑鱼会在产卵后死亡；尸体腐烂并将养分释放至森林生态系统。
  animal.sea_anemone:
    label: sea anemone
    summary: 一种类似花状的有毒触须海洋生物，栖息于珊瑚礁区域。
    info: '{"info":"海洋海葵是一种刺胞动物（腔肠动物门），外观像固定在岩石上的花朵。\n它的触手含有毒细胞（穿孔器）用于麻痹猎物。\n它与小丑鱼、藻类和清洁虾共生生活。\n寿命可超过一百年，并且理论上具有潜在的永生性，不会因衰老而死亡。"]'
  animal.sea_cucumber:
    label: 海参
    summary: 圆柱形海底生物收集底栖有机残留物质
    info: 海参是生活在海洋底部的棘皮动物，属于蛇尾纲。它们过滤沉积物并以有机残渣为食，在受到威胁时会排出肠道或一种水状液体，并能重新再生这些器官组织。在亚洲被视为珍贵美食（称作‘花胶’），也是中国菜系中的传统食材。
  animal.sea_lion:
    label: 加州海狮
    summary: 会游泳并且叫声很大的海洋生物，属于外耳海豹家族的一员。
    info: |-
      {"hint":"有耳的海豹，可以用鳍足行走（ Otariidae）","info":"加利福尼亚海狮是外耳海豹科最著名的代表。\u005c
      与真海豹不同的是它拥有外部耳朵，并且可以使用四只鳍脚走路。\u005c
      它们异常聪明，在娱乐产业中能学会复杂的技巧；在自然环境中捕食鱼类、鱿鱼和甲壳类动物。","label":"sea lion","summary":"一种能够用鳍状肢行走并发出响亮吠叫声的哺乳动物。"}
  animal.sea_otter:
    label: sea otter
    summary: Sea Otters float upside down while breaking shells by utilizing rocks.
    info: '{"hint":"使用工具在背部漂浮的海獭（Enhydra lutris）","info":"海洋水貂是北美的一个物种，拥有所有哺乳动物中最密集的毛发密度(每平方厘米有八十万根头发)。\n它们用石头作为工具来打破牡蛎和贻贝，并将这些贝壳放在胸前进行处理。 \n睡觉时会在水面仰泳；为了防止水流带走自己会互相抓住脚掌保持在一起。\n由于皮草贸易几乎被灭绝了，在保护计划的帮助下种群数量得到了恢复。");'
  animal.sea_slug:
    label: 无壳纲
    summary: 一种色彩斑斓、栖息于珊瑚礁且不具贝壳特征的海洋蜗牛
    info: |-
      裸鳃类（海兔）是生活在珊瑚礁上的海洋软体动物，没有外壳。它们拥有自然界中最鲜艳的颜色之一；这些颜色用于警告捕食者其有毒的特性。
      一些种类会从食物中吸收毒素细胞并将其用作自我防御手段。
  animal.sea_turtle:
    label: 海龟
    summary: 一种大型海洋爬行动物，会返回海滩产卵。
    info: 绿海龟是七种海龟之一。雌性每隔两到五年就会回到自己出生的沙滩产卵。成年个体以海草和藻类为食；幼体则是杂食性的。
  animal.sea_urchin:
    label: sea urchin
    summary: 岩石海底上长满尖刺的小型圆形海洋生物
    info: |-
      海胆是一种覆盖着可移动刺的海洋棘皮动物，属于球形亚纲。它的刺之间有特殊器官（足柄）用于清洁和捕食。
      它们以藻类、真菌和其他有机物为生。
      其生殖腺被称为“uni”，是日本珍贵美食。
  animal.seahorse:
    label: 海马
    summary: 一种小型以垂直姿势游泳的鱼类；雄性负责携带幼崽。
    info: 海马是一种属于海马属的小型鱼类，它通过背鳍保持直立游动。有趣的是，幼崽是由雄鱼而非雌鱼在育儿袋中孵化和携带的。它们用尾巴缠绕着海洋植物等待猎物经过。
  animal.seal:
    label: 海狮
    summary: 一种栖息于沿海地区的鱼类捕手，在陆地上晒太阳并进行繁殖行为
    info: |-
      {"hint":"生活在岩石上的鳍足类海洋哺乳动物（海豹科）","info":"普通海狮是无耳廓的流线型身体的食肉目海豹科成员。\u004
      它们沿着大西洋和太平洋海岸生活，既在水中活动也在岩礁上休息。
      能下潜超过五百米深，并且能在水底停留半个多小时。
      受到污染与捕猎威胁着这种生物种群的安全发展。
  animal.shark:
    label: 鲨鱼
    summary: 大型掠食性鱼类，具有锋利的牙齿和流线型身体。
    info: 大白鲨是世界上最大的捕食性鱼类之一，体长可达六米以上。它能通过洛伦兹壶腹感知猎物发出的电场信号。尽管有其凶猛的名声，但攻击人类的情况非常罕见；鲨鱼在海洋生态系统中扮演着关键捕食者的重要角色。
  animal.shrimp:
    label: 虾
    summary: 一种小而快游的小型节肢生物（如明虾科等），世界上海产最普遍的产品之一
    info: "虾是小型的海洋或淡水甲壳类动物，有十对脚。\n全球已知超过两千种；它们是世界上第二大受欢迎的海产品。 \n作为滤食者和捕猎者的角色，在海洋食物链中起着关键作用。"
  animal.squid:
    label: 章鱼
    summary: 一种能靠喷流运动、有十条手臂的头足目海洋节肢动物
    info: |-
      {"hint":"十腕头足类软体动物，通过喷水游动（乌贼）","info":"章鱼是具有十个臂的头足纲生物(八只触手+两只捕食用的手爪)，它们可以通过喷射水流移动，并且能够利用色素细胞改变颜色。巨型乌贼(Architeuthus)长达十三米以上，在世界上最大的无脊椎动物中名列前茅。");
      在深海与鲸鱼搏斗时会在其皮肤上留下痕迹。
  animal.starfish:
    label: 海星
    summary: 一种能再生失去触手的5条腿海洋生物
    info: |-
      海星是典型的五只手臂的海洋棘皮动物。它们能够再生整个丢失的手臂，甚至可以从被截断的手臂中重新生成身体。
      利用吸盘打开贝类外壳来捕食软体动物。
  animal.stingray:
    label: '"electric skate"'
    summary: '"一种身体平坦、带有脊椎骨和带齿边缘特征并栖息于沙质海床底部附近的海水区域里的软骨类水生哺乳动物."'
    info: |-
      {"hint":"扁平的鳐鱼，尾巴上有毒刺（Dasyatidae）","info":"电鳐是鲨鱼类近亲的一种生物体呈盘状且适应海底生活的海洋动物。\n许多种类在尾部装有用于防御的一根有毒尖刺。它们通过胸鳍像翅膀一样摆动来移动前进；一些种群还具有发电能力，并能用放出来的电流使猎物麻痹瘫痪。
      "}
  animal.swordfish:
    label: 剑鱼
    summary: 一种拥有长形剑状吻部的大型掠食性远洋鱼类。
    info: 剑鱼是一种大型热带和亚热带海洋中的大洋鱼类。其扁平的剑状喙用于击晕猎物（如其他鱼类及幼鲨），而非刺穿它们；它是速度最快的鱼类之一，时速可达超过一百公里以上，并且是受人喜爱的一种运动钓鱼与美食用鱼。
  animal.tuna:
    label: '"label": "金枪鱼"'
    summary: '"summary": "这种快速游动的远洋型鱼类被大量捕捉用于食品工业生产用途。",'
    info: '{"info":"蓝鳍金枪鱼是最大的一种金枪鱼类，体长可达三米以上、重达七百公斤。它是温血动物（热血的），能保持比周围水温和的身体温度；属于海洋中最快的鱼类之一，在时速超过七十公里的速度下活动频繁。由于过度捕捞而濒临灭绝危险，并且在日本市场上单条售价高达数万美元。"]'
  animal.walrus:
    label: 海象
    summary: 一种拥有大象般犬齿和胡须的大体型北极哺乳动物
    info: |-
      海象是一种大型北极鳍足类动物，其标志性的长牙（獠齿）可超过一米。这些牙齿用于爬到冰上、雄性之间的打斗以及等级制度中起作用。
      它们是群居的，在巨大的群体里聚集生活。
      全球变暖正在威胁着它在北极地区的生存环境。
  animal.whale:
    label: 蓝鲸
    summary: 地球上最大的动物——用肺呼吸的海洋哺乳动物。
    info: 蓝鲸是地球历史上体型最大的生物，体长可达30米，体重超过150吨。它们以一种名为磷虾的小型甲壳类为食，并通过鲸须板进行过滤进食。蓝鲸发出的声音是所有动物中最强响亮的。
