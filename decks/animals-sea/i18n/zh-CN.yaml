lang: zh-CN
pivot: false
title: 海洋动物
cards:
  animal.crab:
    label: 螃蟹
    summary: 一种十足类甲壳动物，有硬壳和螯足，横向移动。
    info: 螃蟹属于短尾下目的一种节肢动物。它有一层坚硬的几丁质外壳，并会定期蜕皮以促进生长。其特征是身体向侧面移动。螯足用于防御、捕食以及交流。它们既生活在海洋中，也栖息在淡水或陆地上。
  animal.dolphin:
    label: 海豚
    summary: 一种聪明的海洋哺乳动物，群居并会从水中跃出。
    info: 海豚是鲸目中的一种海洋哺乳动物。它们以高智商、回声定位能力和活泼的行为而闻名——海豚喜欢从船边的浪花中跳跃，并通过鸣叫和咔嗒声进行交流。它们通常成群生活，被称为群体，与鲸鱼有密切亲缘关系。
  animal.jellyfish:
    label: 水母
    summary: 透明的钟形海洋动物，带有毒触手。
    info: 水母是一种没有大脑、心脏或骨骼的腔肠动物——其身体由大约95%的水分组成。它通过脉动钟状的身体移动。触手上含有刺细胞（刺丝胞），能麻痹猎物。某些种类几乎不朽——它们可以回到幼体阶段。
  animal.octopus:
    label: 章鱼
    summary: 一种有八条触手的软体动物，能够改变身体的颜色和形状。
    info: 章鱼是一种无脊椎动物，属于头足纲。它拥有三个心脏、蓝色血液，并能通过色素细胞迅速改变皮肤颜色和纹理。它们非常聪明——可以打开封闭容器并解决迷宫问题。
  animal.sea_turtle:
    label: 海龟
    summary: 一种大型海洋爬行动物，会返回海滩产卵。
    info: 绿海龟是七种海龟之一。雌性每隔两到五年就会回到自己出生的沙滩产卵。成年个体以海草和藻类为食；幼体则是杂食性的。
  animal.seahorse:
    label: 海马
    summary: 一种小型以垂直姿势游泳的鱼类；雄性负责携带幼崽。
    info: 海马是一种属于海马属的小型鱼类，它通过背鳍保持直立游动。有趣的是，幼崽是由雄鱼而非雌鱼在育儿袋中孵化和携带的。它们用尾巴缠绕着海洋植物等待猎物经过。
  animal.shark:
    label: 鲨鱼
    summary: 大型掠食性鱼类，具有锋利的牙齿和流线型身体。
    info: 大白鲨是世界上最大的捕食性鱼类之一，体长可达六米以上。它能通过洛伦兹壶腹感知猎物发出的电场信号。尽管有其凶猛的名声，但攻击人类的情况非常罕见；鲨鱼在海洋生态系统中扮演着关键捕食者的重要角色。
  animal.whale:
    label: 蓝鲸
    summary: 地球上最大的动物——用肺呼吸的海洋哺乳动物。
    info: 蓝鲸是地球历史上体型最大的生物，体长可达30米，体重超过150吨。它们以一种名为磷虾的小型甲壳类为食，并通过鲸须板进行过滤进食。蓝鲸发出的声音是所有动物中最强响亮的。
