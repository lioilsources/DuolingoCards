lang: hi
pivot: false
title: समुद्री जानवर
cards:
  animal.anglerfish:
    label: samudri bhoot-narakeshinya
    summary: एक ऐसी गहरी ऋशि है जिसके सिर पर bioफ्लोरेसेंट आकर्षण है।
    info: |-
      समुद्री भूतनरकेशिन्‍याओं के स्थलों पर हज़ार मीटर से अधिक गहराईवाले धब्बों में रहता है।
      male तिमिरपृष्ठ पर चमकदार आकर्षण के उपयोग करता है,
      amma जड़ित और male के खोजने के लिये।
      samca विस्पष्ट छोटा होता है;
      amma के ढूढऩे के बाद amma के साथ इसके फ्यूज हो जाता है。
      bioफ्लोरेसेंस डिवाइस में घुले बौचरिऑइअल्स के झाँझी से ऊठता है।
  animal.barnacle:
    label: झीलोनौशी
    summary: चट्ठा और नाहबड़िओ के सतह पर चिपके रहे एक छोटा जाति
    info: |-
      स्वेटलोनॉशी मछिला जाति के संगठक हुए, एवज़रपेडिया प्रतिरूप अधखण्डमय हई। ओहि चट्ठे और नाहबड़िओ आऊर बल्मच्छिका के सतह पर सीमेण्टित गुदा से घुथइ झाँकथे।
      अउ फिसफिशन द्वारा ऑर्थोपोडा के भोजन करथे,
      आऊर ऊलिप्टा से खाई धुंघरिष्ट ऐंगुलिओ के सभी इष्ट
      लार्वा तैरत रहथे;
      और जब ओहि ढेरी बढऩ झाँकथे त' ओहि एक जीवन लंबा चिपके रहथे।
  animal.beluga_whale:
    label: बेलूगा
    summary: उठलवार छोटी सफेद डल्फिम जिसके ऊपर खुशखबरी आई हुई है
    info: "बेलूगा एक हल्के पानी कि समुद्रिय मछली होती है।\nइसका विशिष्ट गोल चहरा 'एचो' बनाता हैं। \nयह अपने घुटने को दाहिने और उज़डऩे ओर भी झुका सकती है।"
  animal.blue_tang:
    label: |-
      कौरिह ऑउट
      (Blue Tang)
    summary: '''Heldaniy Nemio'' के स्टार'
    info: |-
      नीले कैरेट्स (पारा सुड़ यस हिपटस) प्रशांत महाद्वीपों के कई जमुखयुक्त चट्ठे पर नए फिल्म 'फाइंडिग डॉरी' (2016) के बढ़िया अभिभाषण।
      वे एक छोटे समुद्री मछली हैं और ओजोन शब्द के आधार पर खाका घुटने के ऊपर धाँचा था।
  animal.carp_river:
    label: झील के मछली
    summary: घरेलू धारा और झील में रहने वाली एक बड़ी पीले -भूरी तरल मछली
    info: "रिवर कैप्पन एशिया से मूल हैं और पहली बार मध्यकाल में इसे यूरोप में प्रवतरणित किया गया।\nइनमें सभी खाद्य चीज़ें शामिल हैं; वे नदी के तल को उखाड़ते हुए पानी को घोल सकते हैं। \nचेक अब्सट्राह्ट के छठे जश्न का प्रतीक हैं ; फुड आउटलेट ओवरफ्लो झाँगों के ऊपर थोक भाषा में ठीक ऐसे ही बेचते हैं।"
  animal.catfish:
    label: सुमेक
    summary: ऊषण धारा के ठीठ पर खफे हुआ ऊँचे ढंग का ऐसा गढ़ा जो ऋजुओं के फर्ष पर छिपा रहता है।
    info: "सुमेक बड़ा पूर्णतया सबले मछली होने के साथ यह एशिआईएव्रप की सबले मछली है। इसकी लंबाई 2 मीटर और वजन 100 कि॰ग्रा से अधिक हो सकता है।\nइसके चिह्नित गद्दे (भर्डल्‍स) घ्राण और स्पर्श ऑर्गन के रूप में काम करते हैं। \nयह झीलों ओर नदियों के फर्श पर जीवित रहता है; यह उच्छ्वासी प्रकृति का भखमाट है।"
  animal.clam:
    label: महामुझ
    summary: उष्णकटिबध्ध कॉरल डाइव में घर छोड़े चलने ओढऩे और आकार में सबसे बड़ी मुज़ा
    info: |-
      महासंस्करण मुज़ा गिज के सबसे बड़ी प्रकार है।
      iयोगेननथलए फोटोसिंथेटिक शौचालय के साथ एक सदभवता में अपने पॉशियम में ठीठि हई।iऊ दो वर्षों से भी ऊपर तक झखइ सकछई।
  animal.clown_triggerfish:
    label: clown triggerfish
    summary: '''अद्वितीय'' ऊष्णकटिबध्य मछली जिसमें सफेद धब्बे और ऑरेञ्ज रंग के होथ होते हैं।'
    info: "क्लॉन ट्रिगरफिश महासागरीय पेड़ों के सबसे हраб्बता रंगवली मछलियों में से एक है।\nइमेने मजबूत दाँत होते हैं जो कठोर पशुओं और घोंघों को चबाकर तोड़ने के लिए होते हैं। \nट्रिगरफिश विधि 'एक अपने पहले खामखाह छोई के कारण है जो आउच फंसाओ के भाषा में इसे ठीऊर कर देता है।"
  animal.clownfish:
    label: ओकेल
    summary: अधिकांश ओकेल घर पर ठंढे फलों और इमली के सामान्य धोई झाड़ियों के साथ ढके होते हैं।
    info: |-
      ओकेल अपने मारूद्दी कलमबुशों से प्रतिकरण होगा, जहाँ वे एड़ियों के बजाय चटखच्छे तसवीरों के साथ खेळते है।
      इसके नए गठन में उनके शरीर के ऊपर और भी आउटफिट डिस्प्ले होते हैं।
  animal.crab:
    label: केकड़ा
    summary: एक दस पैरों वाला क्रस्टेशियन हथिनी से और एक छल्ला, जो तरफ में चलता है।
    info: केकड़ा ब्राहयुरा अवर रखक का एक क्रस्टेसियन है। इसमें एक ठोस काइटिन आच्छद भी होता है, जिसे नियमित रूप से उतार डाला जाता है (एकडाइज) ताकि वह बढ़ सके। यह विशिष्ट रूप से ओर की ओर गति करता है। इसके हथिनी घात, शिकार और संचार के लिए भी उपयोग होते हैं। यह निमकी खाड़ियों, ताजे पानी या भूमि पर रह सकता है।
  animal.dolphin:
    label: डॉल्फिन
    summary: बुद्धिमान महासागरीय स्तनधारी जो झुंड में रहता है और पानी से कूदता है।
    info: एक डॉल्फिन मछलीगोटा के परिवार से समुद्री स्तनपायी है। इसकी ऊँची बुद्धि, पराश्रव्य लोकेटर क्षमता और खेलने के आचरण के लिए जाना जाता है - डॉल्फिन नावों की लहरों से कूदना पसंद करते हैं और चिकनी अवाज और ठीठी द्वारा संचार करते हैं। वे 'झुंड' नामक समूहों में रहते हैं और वाल पर घनिष्ठ रिश्तेदार हैं।
  animal.dugong:
    label: डूगों
    summary: '''अखबार'', धीमा समुद्री उष्णकटघरा भारतीय और प्रशान्त महासागर में मनेटे का साथी।'
    info: |-
      डूगों एक समुद्री पशु है मनेटे का साक्षरता। यह भारतीय और प्रशान्त महासागर में पाया जाता है।
      विशेषज्ञ इसलिए डूगों कई बाहरी समुद्री घाम के लिए खाद्य होता है。
      इसे 'पावर' के अभिप्रचाओं के चित्रण के आधार के रूप में माना जाता है;
      sailors have mistakenly identified it for sea creatures.
  animal.eel:
    label: घुशख / murena
    summary: एक साही मछली जो कोरल प्रक्षिप्ति के खाटों में घूमती है
    info: |-
      मुरेना सागरीय रूप मे कोरल प्रक्षिप्ति के दरारों में छिपने वाली मुरेनिडीज़ परिवार की एक बड़ी मछली है।
      iसभी मच्चलियों के जबड़े के अतिरिक्त इसके भीतरी फेरिंगिस जबड़े होते हैं और उनका उपयोग शिकार को घटने में करती है।
      वह सक्रिय आक्रमण नहीं करती;
      kदाँत मामूली धमकी के कारण होता है।
  animal.flying_fish:
    label: लेटौन
    summary: उष्णकटिबंधीय मछली जो प्रगणयुक्त पंख के सहारे समुद्र की सतह पर घूमकर चलती है।
    info: |-
      लेटौन एक्सोसियटीडे हवा में कुदरत समान प्रगणयुक्त पंख के सहारे उछलकर और घूमकर चल सकता है।
      इसके फ़िशिग विशेषज्ञ पंख कई बाहर खीचे जाकर पंख के आकार में दिखाई देते हैं; इस लेडीफिश के ऊपर 200 मीटर छोड़ भी सकते हैं अथवा 1.5 मीटर की ओर झुठला सकते हैं。
      एक ऐसा ढंग धबधबा ठीढ़ियों (भामन, मारलिन, डॉल्पिन), थोड़े भी बचाने के लिए है।
  animal.frogfish:
    label: जापिकनिक
    summary: भाँधे ओढऩे वाळा ठीठ जो ऑफर करता है
    info: "एंटेन्नेरियस एक समुद्री मछली है। पालन का अच्छा ढ़गोबहता हूआ इसके पेट के रंग के बरावर हो जाता है।\nइसके पश्चपखवाड़े ऐसे होते हैं जैसे पॉड़ियम और फिसलकर धराशायी भाग पर घूमता है। \nऊपरी पखवाझ में खाद्म के आकर्षण के लिए ऊष्णक थाहा होता है।"
  animal.giant_squid:
    label: भेषणा चौषद्‍घ
    summary: ऊंचे समुद्र में घर बसे ऐसे जानवर हैं जो ठीठ झाँढ़ी ऑर्हिण जानवर हैं।
    info: |-
      अर्किटेयूथस डक्स के साथ हुए प्रचंड मोलस्का (गиг़नट सीफ़िश) पृथवी पर सबसे बड़े अपजातीय जानवर हैं।
      इम लंबाइ में 13 मीटर से भी ऊपर होते हैं。
      उनके आंखें एक रईस दुनिया में सबसे विशाल हैं - 25 सेमी से छोटे औसत,
      हाउओर गहराओ के धुआधार के खिलाफ ढले हुए हैं।
  animal.hammerhead_shark:
    label: शार्क के डंठल भाषा
    summary: T-आकार के छोटे ठोस सिर वाला धाँस
    info: |-
      मुर्गा मारीन एक सिमेनोइड हैंगल के प्रजाति है।
      उसका फ़्लैट टीएचपी शेप वाला सिर बेहतर पकड़ के अवधि के इलेक्ट्रिकल ऑर्गन (अम्यूबल ओफ़ लोरेज़िनी) और उछलने के दखल कहता है。
      यह ऊष्णकटिबंदीय महासागरों में खेलता है और मछली, घोंघे आऊर सीप का चढ़ाई करता है।
  animal.horseshoe_crab:
    label: Hyporheic zone
    summary: A type of ancient habitat that has remained largely unchanged for millions of years.
    info: "हाइपोरॉडीलियम प्रजनक एक स्पष्ट केंचुआ हथिना मछलि हे।\niतना प्राचीन हवय कि वह 450 मिलिअन साल से बग़ैर कोई महत्त्वपूणं् फेरबदल होए जीऊ हवय। \nhार्मोनीस शेड गुटखी द्वारा खाऊ भी जाहे।"
  animal.jellyfish:
    label: मेडूजा
    summary: पारदर्शक समुद्री जानवर के घंटी के आकार में होता है और इसमें विषाक्त पैर होते हैं।
    info: मेडूजा एक समुद्री जानवर है जहाँ उसका शरीर 95% पानी से बना होता है और यह कोई मस्तिष्क, दिल या हड़ियाँ नहीं होती है। यह अपने घंटी के आकार के शरीर के पल्स से गति करता है। इसके पैर टोकरियों को चुभाने वाली कोशिकाओं (नेमेटोसाइट) से भरे होते हैं। कुछ प्रजातियाँ लगभग अमर होती हैं - वे फिर से बच्चे के चरण में लौट सकती हैं।
  animal.lionfish:
    label: क्रूटोपेस
    summary: एक जहरीला उष्णकटईय जल मछली जिसमें भयानक खामोशि और धारियों का रंग होता है
    info: "लाल क्रूटोपेस एक स्कर्पियनीडे परिवार में जहरीला समुद्री मछली है। इसमें चमचमते गुलाबी -बॉवल धारिओं और अजगर के तख़्ते के समान टूथयुक्त खामोशि होती है।\nइसका डंठल भारी दर्द का कारण बनता है ; आमतौर पर घातक स्थिति शामिल नहीं होती。\nयह कैरेबियन और भूमध्य सागर में फैले छोटे झाँढ़े के ऐसे प्रजाति है जो स्थानीय मछली के प्रजातियों को ठीक से ढंग से ऊबा देता है। \nअपने मूल घर के बाहर इसके पास प्राकृतिक शिकारी नहीं होते।"
  animal.lobster:
    label: हमरस
    summary: छोटे झील ढेर थे ऐ ऑफ ऍउर िभाङ्ञ् ढेर
    info: |-
      हमरस अटलांटिक है के मेटा स्पीशीज़ प्रकोष्ठनुपचय फैमिली से संबंधित एगो बड़ा समुद्री चवथिया जानवर हई।
      इए खासतौर पर 48 - 79°N दक्षिणी गोलार्ध मेँ पावल जाहि और इओआ ओखे भामण्डलिक आऊर उठाऊ शेळी मेँ घरघल छई।
  animal.manatee:
    label: डुगॉ / मनटी
    summary: '''अश्मिक चरुआई'' के रूप में जाँचा डुगॉ'
    info: मनेटी एक महासागर का स्तंभप्रसू होता है जिसे 'दुग़ॉ' कहा भी जाता है। यह पौधों पर खादया करता है और विशेष रूप से अलवणजल के घानि में बढऩे लगा है।
  animal.manta_ray:
    label: हॉईपर माटा
    summary: एक शानदार चौंघरा छछूना ऑयन के सतह पर प्लैंकटन खासे है।
    info: मांटा ओशनिक हैलफी के सबसे बड़े प्रजाति में से एक होती हैं। इसके प्लवरगुदों का फैलाव 7 मीटर से अधिक होता है और भार 2000 किग्रा से ज्यादा होता है।
  animal.mussel:
    label: खड़ीचीज़
    summary: अशुगर झील ओढऩ छेड़छाड़ करते ऊपर चट्टानों पर ऐसा एक ऑफ़्‍फळ जो अपने आप को बाँध लेता है।
    info: |-
      स्लावका एटलेंटिक के प्रति समुद्री महासागरों के हवा के ज़ॉन में रहता है।
      यह चट्टानों पर ठोस धागों (बिशस) के साथ अपने आप को बाँध देता है。
      इसमें पानी को फ़िल्टर करने की क्षमता होती है और यह समुद्री प्रदूषण का संकेतक है;
      एक खतरनाम घटक और भारी धातुओं को इकठ्ढा करता है।
  animal.narwhal:
    label: नार्वल
    summary: आइसफ्लोईयर घोड़ा और उसके शास्त्रीय आकार के खगोल के समान ध्रुवीय डौला
    info: नार्वल एक हिमपरी कम से कम प्रजाति में (अधिकतम ५ मीटर) लंबा होता है। इसके चिह्नित छड़दाँत अवशेष बचे हुए दाढ़ी के ऊपरी भाग कहलाये जाते हैं।
  animal.nautilus:
    label: नेटलस
    summary: एक प्रारम्भिक सर्पोदबंध गड़गढ़ित खोपड़ी और बहुभुजीय शेड के साथ, नौटिलस दिनसूरिओं के उपस्तर से ठीठ आऊर छोई हई।
    info: नौटिलस एक प्राचीन सर्पोदबंध हलचल के मुख्य अवयव वाला जीव है।
  animal.octopus:
    label: कॉरल
    summary: आठ अंगुलियों वाला मेक्सीपोड सूजन प्राणी।
    info: एक कॉरल एक हेडफॉट जीव है और इसमें तीन दिल होते हैं, नीला रक्त होता है और यह क्रोमेटोफोर्स के माध्यम से फौरन अपनी चमक और त्वचा के आकार को बदल सकता है। यह बहुत बुद्धिमान है - इसके पास बंद खोल खोलने और पहेलियों को हल करने की क्षमता होती है।
  animal.orca:
    label: ओसियनस ओर्चा / किलर व्हेल
    summary: एटलस के एपेटाइट डॉल्फिन के जीव द्वारा घेरे तथा खास ऊबड़खाबड़ छाँया वाले झाम्बो
    info: किलर व्हेल समुद्र के महाप्रजा हैं। पोड़ में शिकारी गति से आगे बढ़ने और अलग-अलग पोड़ में ध्वनि संचार के भिन्न ढंग होते हैं।
  animal.oyster:
    label: उश्प्रिऑ
    summary: फ़िलर मलईया; मणि और ऐश्चर्यजनक डिम के स्रोत
    info: |-
      ओस्ट्रिका पानी को फ़िलर हैं।
      कुछ प्रजातियां मणि से भरपूर होती हैं, जब उनमें एक विदेशी चीज़ छवि बदल रही होती है。
      खाली ओस्ट्रिस अच्छी खट्ठी डिम के आइटम हैं;
      एक गड़गढ़ में इनका ध्यान और 'R' घटना में ऊष्णकटिबध्य झाँठ के साथ खाहे जाते हैं।
  animal.piranha:
    label: पिराना
    summary: सुदृढ़ प्रतीच्छेदन करे हुए मछली
    info: |-
      पिराना एक सुदृढ़ प्रतीच्छेदन करे हुए मछली होती है।
      यह अमज़ोन के जंगलों में पायी गई है।
  animal.puffer_fish:
    label: फूगु मछली
    summary: एक मछली जो चभचई भाँख में इष्ठि आउठ छोडऩे धर झामर ढंढळ थोथ ऐशा ऑफऱ ऋऋ ि
    info: |-
      फूगु टेराओडोंटिडेई परिवार की मछलि है जो समय पर अपना शरीर पानी या हवा से फ़ौकरती है।
      इसमें 'टेरोदोटॉक्सिन' होता है, एक बहुत ही खतरनाक प्राकृतिक दबज;
      अधिगण ऊतक और लैंगिक तंत्र घातक हो सकते हैं।
  animal.salmon:
    label: लॉकन
    summary: ऊष्णकटिबंधीय झीलों में त्वचा के लिए आने वाली बड़ी लॉकन मछली।
    info: |-
      लॉकन एक प्रवाही मछली होता है। यह समुद्र के अंगरेज़ियों में पलता है लेकिन त्वचा के बजाइए घर की झीलों में आता है।
      जब ओसार शुरू होता है, तो चमड़ी का रंग धीरे -धीरे गहरा भौरा हो जाता है。
      अफ्रीका के पश्मीना देखभाल कई छोटे प्रजापतिाओं के ऊपर फैल जाते हैं;
      tथोड़े और डाटा ऑइल्स ऐसे होते हैं जो थोड़े ठंढे ढंग से जीवित रहते हैं।
  animal.sea_anemone:
    label: Sasanka Moresha
    summary: अधिपति जलचर जिसके अँगुलिवत्‍य भाग जहरीले होते हैं और जो कोरल रीफ में रहता है
    info: "समुद्री एनेमोन साइडिया परजीवी हैं जो कि चट्टानों में लगे फूल के समान दिखते है।\nइनके अँगुलिवत्‍य भाग में बहुखणिका (एनेथोबचा) होते हैं तथा शिरपेस घेर कर उनको आघात पहुंचाते हैं। \nई झील डाही के साथ सहभाषी और छछुआओं ओर कशाधारिणी ठीठी के साथ ऐसे ढंग से रहते हैं कि वे एक दौरा ऊपर से ऑफ ऋषि कर देते हैं।"
  animal.sea_cucumber:
    label: समुद्री गोल्डफिश
    summary: इस ऊष्णकटिपट समुद्री जीव ऐसे जैविक अवशेषों को ढूढ़ता है जो जमीन पर होते हैं।
    info: |-
      समुद्री गोल्डफिश महासागर के पेचकश सतह पर हॉलोथुरिया के वर्ग से संबंधित समुद्री एचनरिकटज़ है।
      वे अपशिष्ट को फ़िल्टर करते हैं और जैविक बचे हुए भार के साथ खाना दें。
      अगर धमकी लगती है तो इनके आंतरिक ऑर्गन छोड़ देते हैं या झामयुक्त तरल पदार्थ,
      जो फिर से ठीठ घटाओ।
  animal.sea_lion:
    label: लाइन
    summary: उष्णकटिबध्डः्‍थ घुटनबाझ जो ओछे पर ठीठीया जा सकता है;
    info: "कैलिफोर्निया लाइन हुत के प्रमुख सदस्य हैं।\nवास्तविक मेंटीड कि वह बाहरी कान के छिद्र और चार प्लाउज़ पर ठीठीया जा सकता है। \nइसमें अप्रचलित बुद्धिमत्ता होती है;\nएंटरटेनमेंट एगोढ़ा में भाग शामिल कर आश्चर्यजनक ट्रिपल खेलते हैं।"
  animal.sea_otter:
    label: ओटर
    summary: जलखर ओटर अपने पिठ पर तैरता हुआ और पथर के टुकड़े उपयोग करके धब्बों को ढीला करता है।
    info: '{"info":"मारीन ओटर है कि पिठ से तैरता हुआ मछली को उपकरणों के सहारे खेलता है।\nयह एशिया के श्वसन जगत् का अधिकतम घनत्ववानः बच्चा है और इसके ऊपरी भाग में 456798 छोटे झड़े होते हैं।\nइसके द्वारा पथर के टुकड़े आदि धब्बों के फ्रेम के डाँठ को ढीला करने के लिए उपयोग किया जाता है।\nएक ऐसा ऑफर था जिसमें इसके बाहरी त्वचा के लिए लाभ था।"}'
  animal.sea_slug:
    label: |-
      अखंड छिलछिम
      (Placophore)
    summary: एक ऐसा समुद्री झील धारक जो कई रंगों में ढंग था और ऊष्ठ नहीं हथिष्करण करता है।
    info: |-
      नाक्लिब्रैंचिया में एक समुद्री कवर होते हैं।
      इस प्रजाति के जानवर अपने शरीर कलरफ़्यूल रहते हैं;
      एक चेहरे के खबर देवे के उद्देश्य से,
      उनके भोजन से इस आश्रित टॉक्सिफ़िकटी के घटक ग्रहण कर और ओगोड़े के डिपेण्ड करते हैं।
  animal.sea_turtle:
    label: समुद्री कछुआ
    summary: अंडे देने के लिए समुद्री प्लैज़ा में वापस आने वाला बड़ा समुद्री सरीसृप।
    info: हर्मन कछुए में से यह गोल्डन हर्मन समुद्री कछुई के सात प्रकारों में से एक है। मादा प्रति दो से पाँच वर्षों में अपने जन्म के समुद्री तट पर वापस आती है और अंडे देती है। वयस्क शाकाहारी होते हैं और समुद्री घास और शैवाल पर खाते हैं; इनके छोटे भाग चारे के उपभोग करते हैं।
  animal.sea_urchin:
    label: ऊष्णकटि
    summary: '''ईचिनोइड'' दलघर के झील में धरापर ठीठी ऐसे इकाईओं के साथ एक गोल जीव है।'
    info: |-
      एक जीवाश्म के समुद्र में होने वाला पौधा 'ईचिनोइड' एक चलती हुरहुरी के संगठनों से ढ़का होता है।
      यह अपने तखटनों के बीच खास ऊतकों (फेडिकेटरियस्‍ ) के साथ साफ़ करता है और भोजन छोड़ता है。
      यह रशेषण, कबूतर आउट ओर ऑर्गेनिक घटकों पर उभरता है।
  animal.seahorse:
    label: समुद्री घोड़ा
    summary: एक छोटी मछली है जो सीधे पानी के स्तंभ में उतरती है; इनके बच्चे पिता के पास रहते हैं।
    info: समुद्री घोड़ा एक ऐसी मछली है जो अपनी पृष्ठीय पंख के सहारे ऊर्ध्वाधर स्थिति में गति करती है। दिलचस्प बात यह है कि इनके शिशुओं को पालतू डब्बे में पिता निभाते हैं, माँ नहीं। इनका पौंछ जलीय घास पर टिका रहता है और इनके शिकार के पास आने का इंतजार करता है।
  animal.seal:
    label: हीना
    summary: अफवापने ठठेरों पर ऑउथ ऐऊ महासागर में मछली िष्‍ठ करे वाळा समुद्री पशु
    info: |-
      हाथियों के आकृति में हीना समुद्री पशुओं के एक परिवार phocidae से होता है।
      यह अटलान्टिक और प्रशांत महासागर के तटवरख में बसे हए होते हैं जबकि इनका समय धरती पर भी लगभग उच्च शिखरों पर छपड़े दिखाई देता है。
      इनकी डुबई की ऊंचाई 500 मीटर से अधिक होती है और ओजन के घण्टे ढाँढ़स फौलाहट झेले जा सकते हैं।
  animal.shark:
    label: शार्क
    summary: नुकीले दांतों और हाइड्रोडायनैमिक शरीर के साथ एक बड़ा माँसाहारी मछली।
    info: ब्लैकटेन प्रजाति विश्व की सबसे बड़ी माँसाहारी मछली है जो छह मीटर से अधिक लंबी हो सकती है। इनके पास खाद्य चाप के विद्युत क्षेत्र को ग्रहण करने की क्षमता है जो लोरेंजिनी की ट्यूब के माध्यम से होती है। इनकी ओछी छवि के बावजूद, मनुष्य पर हमला बहुत दुर्लभ है; शार्क समुद्री पारिस्थितिक तंत्र में महत्वपूर्ण माँसाहारी हैं।
  animal.shrimp:
    label: कृषि
    summary: चिपड़ा और उबड़-खाबड़ चीजें
    info: |-
      कैवेट्स मछली के समान छोटा प्रजनित हुआ जंतु है।
      kरेवेंस कई प्रकार के होते हैं - लगभग 2000 से अधिक;
      यह दुनिया के शीघ्रता से बढ़ते हए खामखाह भोजन के एक आउटपुट है।
  animal.squid:
    label: ओटिपुस
    summary: एक जलचर टेऊथिडा एक ऐसा घड़ाऊ फँसला है जो ठठा आकार में ओबरिस ऑर्किमेहुई के खिलाफ झगड़ा करता है।
    info: |-
      सीपियों में दहाई हथ के स्तम्भक प्रजनक है।
      iतरल पदार्थों का उछाल और वर्णफ़ियरों के माध्यम से अवशोषण के बगैर इनके चलने की गति निश्छल है।
  animal.starfish:
    label: सितारा
    summary: 5 हथियारों और समुद्री भूमि पर चलने वाला ऐसा जीव जो खोई हुई हथियार के पुनःजीवन कर सकता है।
    info: |-
      सितारे समुद्री छोटे पौधें होते हैं।
      वह क्षयशील हथियार में एक नए शरीर बनाकर अपने खोई हुई हथियार के पुनःजीवन कर सकते हैं。
      उनके द्वारा मछलि के उभयचर घोड़े जब इनके गोफ्रों के सहारे ओखली लगाते हैं।
  animal.stingray:
    label: रेजनोक
    summary: छोटी समुद्री मछली जिसके पौंछ में धारी बर्हिष्कृत होते हैं; रेत के तल पर बैठती है।
    info: "रेजनोक शार्क के संबंध में है। पिछड़ापन वाली तलवाड़ियों के समुद्रतट पर बसे एक फ्लैश आकार के गठन के साथ।\nअहान कई प्रजाओं के घुटने पर अग्रणी चुभने योग्य धारा के सामान्य उच्चाटन के द्वारा खुद को औषधीय ढंग से भर देते हैं। \nउनकी इमारत ऊपर झूलते हुए ऐसे ठीथरे के समाप्त होते हैं जैसे कि ऑफर करने वाले पंखों के समान।"
  animal.swordfish:
    label: मेचुओन
    summary: एक स्थानिक केराटिंग जबदस्त बज़रख
    info: मेचौन एक प्रचंड मछली होता है।
  animal.tuna:
    label: टना
    summary: ओढऺ ऋण बर खाद्य उद्योग लेऽ बर बड़े पैमाने पर पकडऱ जाने वाला एक तेज़ गति वाला पेलाजिक मछली हई
    info: "ब्लूफिन टونा मछली समुद्र के सर्वोच्च पंखवाहक हड़तालीय महसूस करनेकी तथा एक अपशिष्ठ गति धारण करनेमेँ सक्षम हो।\nइ उष्णभक्ति (ऊष्य शरीर बनाईए ) जीव हई आउ इ घटिस ऊष्य द्रव भाप छोड़ खुदके शरीर थर्मल डगर ढेर झािठ रखत हई। \nअधिकांश ओढऩ औजार फिशिङ के कारण ऐ जीव अत्यंत खतरे मेँ हई ; एक उदाहरण जापानी ऑक्शन मेँ $456890 बर बेचल गेळ"
  animal.walrus:
    label: मुज़्जा
    summary: एक ओढऩी ऐसा ऑफः थर्मल ऍथर्मल ढीला
    info: मुज़्जा एक प्रचंड सर्द महासागरीय कशेरूक होता है। इसके लगभग तिमाही मेट्रल चाकूनि जबड़े होते हैं और ये बर्फ पर उठने, डटवण आणि हिरावणाऱ्या नराशी झगपगण्यासाठी अधिक घाण भरून खाऊद छेपाळे धरतात।
  animal.whale:
    label: वेल
    summary: पृथ्वी पर सबसे बड़ा जानवर - हवा से सांस लेने वाला समुद्री स्तनधारी।
    info: ब्लू व्हेल पृथ्वी पर कभी भी रहे हुए सबसे बड़े जानवर हैं; यह 30 मीटर लंबा और 150 टन से अधिक भार वाला होता है। यह छोटे क्रिसल के कीटों को कोशिशक डिस्क के माध्यम से फ़िल्टर करके खाद्य ग्रहण करता है। इसके उत्पन्न किए गए ध्वनि आवाज़ जानवरों में सबसे लगातार होती है।
