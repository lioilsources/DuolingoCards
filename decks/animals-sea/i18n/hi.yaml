title: समुद्री जानवर
cards:
  animal.crab:
    label: केकड़ा
    summary: एक दस पैरों वाला क्रस्टेशियन हथिनी से और एक छल्ला, जो तरफ में चलता है।
    info: केकड़ा ब्राहयुरा अवर रखक का एक क्रस्टेसियन है। इसमें एक ठोस काइटिन आच्छद भी होता है, जिसे नियमित रूप से उतार डाला जाता है (एकडाइज) ताकि वह बढ़ सके। यह विशिष्ट रूप से ओर की ओर गति करता है। इसके हथिनी घात, शिकार और संचार के लिए भी उपयोग होते हैं। यह निमकी खाड़ियों, ताजे पानी या भूमि पर रह सकता है।
  animal.dolphin:
    label: डॉल्फिन
    summary: बुद्धिमान महासागरीय स्तनधारी जो झुंड में रहता है और पानी से कूदता है।
    info: एक डॉल्फिन मछलीगोटा के परिवार से समुद्री स्तनपायी है। इसकी ऊँची बुद्धि, पराश्रव्य लोकेटर क्षमता और खेलने के आचरण के लिए जाना जाता है - डॉल्फिन नावों की लहरों से कूदना पसंद करते हैं और चिकनी अवाज और ठीठी द्वारा संचार करते हैं। वे 'झुंड' नामक समूहों में रहते हैं और वाल पर घनिष्ठ रिश्तेदार हैं।
  animal.jellyfish:
    label: मेडूजा
    summary: पारदर्शक समुद्री जानवर के घंटी के आकार में होता है और इसमें विषाक्त पैर होते हैं।
    info: मेडूजा एक समुद्री जानवर है जहाँ उसका शरीर 95% पानी से बना होता है और यह कोई मस्तिष्क, दिल या हड़ियाँ नहीं होती है। यह अपने घंटी के आकार के शरीर के पल्स से गति करता है। इसके पैर टोकरियों को चुभाने वाली कोशिकाओं (नेमेटोसाइट) से भरे होते हैं। कुछ प्रजातियाँ लगभग अमर होती हैं - वे फिर से बच्चे के चरण में लौट सकती हैं।
  animal.octopus:
    label: कॉरल
    summary: आठ अंगुलियों वाला मेक्सीपोड सूजन प्राणी।
    info: एक कॉरल एक हेडफॉट जीव है और इसमें तीन दिल होते हैं, नीला रक्त होता है और यह क्रोमेटोफोर्स के माध्यम से फौरन अपनी चमक और त्वचा के आकार को बदल सकता है। यह बहुत बुद्धिमान है - इसके पास बंद खोल खोलने और पहेलियों को हल करने की क्षमता होती है।
  animal.sea_turtle:
    label: समुद्री कछुआ
    summary: अंडे देने के लिए समुद्री प्लैज़ा में वापस आने वाला बड़ा समुद्री सरीसृप।
    info: हर्मन कछुए में से यह गोल्डन हर्मन समुद्री कछुई के सात प्रकारों में से एक है। मादा प्रति दो से पाँच वर्षों में अपने जन्म के समुद्री तट पर वापस आती है और अंडे देती है। वयस्क शाकाहारी होते हैं और समुद्री घास और शैवाल पर खाते हैं; इनके छोटे भाग चारे के उपभोग करते हैं।
  animal.seahorse:
    label: समुद्री घोड़ा
    summary: एक छोटी मछली है जो सीधे पानी के स्तंभ में उतरती है; इनके बच्चे पिता के पास रहते हैं।
    info: समुद्री घोड़ा एक ऐसी मछली है जो अपनी पृष्ठीय पंख के सहारे ऊर्ध्वाधर स्थिति में गति करती है। दिलचस्प बात यह है कि इनके शिशुओं को पालतू डब्बे में पिता निभाते हैं, माँ नहीं। इनका पौंछ जलीय घास पर टिका रहता है और इनके शिकार के पास आने का इंतजार करता है।
  animal.shark:
    label: शार्क
    summary: नुकीले दांतों और हाइड्रोडायनैमिक शरीर के साथ एक बड़ा माँसाहारी मछली।
    info: ब्लैकटेन प्रजाति विश्व की सबसे बड़ी माँसाहारी मछली है जो छह मीटर से अधिक लंबी हो सकती है। इनके पास खाद्य चाप के विद्युत क्षेत्र को ग्रहण करने की क्षमता है जो लोरेंजिनी की ट्यूब के माध्यम से होती है। इनकी ओछी छवि के बावजूद, मनुष्य पर हमला बहुत दुर्लभ है; शार्क समुद्री पारिस्थितिक तंत्र में महत्वपूर्ण माँसाहारी हैं।
  animal.whale:
    label: वेल
    summary: पृथ्वी पर सबसे बड़ा जानवर - हवा से सांस लेने वाला समुद्री स्तनधारी।
    info: ब्लू व्हेल पृथ्वी पर कभी भी रहे हुए सबसे बड़े जानवर हैं; यह 30 मीटर लंबा और 150 टन से अधिक भार वाला होता है। यह छोटे क्रिसल के कीटों को कोशिशक डिस्क के माध्यम से फ़िल्टर करके खाद्य ग्रहण करता है। इसके उत्पन्न किए गए ध्वनि आवाज़ जानवरों में सबसे लगातार होती है।
