lang: ga
pivot: false
title: Beatha maraíonna
cards:
  animal.anglerfish:
    label: moillinteach
    summary: Ró-fhaideas lán-tomhas don téarma 'moillinteach'.
    info: Tá hia moillinteach agus Lophius tá fágtha i mbuíochta an mar atá thart ar thréimhse míle méadar ón airge. Tá sé sin deacair go bhfuil eolas orthu ach is féidir léith linbhthoibrín teagmhaidheach sa chuid seo den rúntar é. Is í an t-eolaíocht nach gcaofann siad freisin.
  animal.barnacle:
    label: Rúnasgeara
    summary: Greachaín beag éisiltreóntúla atá marbhthraithechu airde orthu chuig scálacha agus tarpanta.
    info: Tá greachaín ísiltreóntúil atá ar pharaimh sa mhuin is ea an rúnasghearadh ó thairiscinthe Cruripédia agus tá siad á chaitheamh len géarcheimicseachta ceallaigh orthu chuig scálacha nó lódha nárca.
  animal.beluga_whale:
    label: bealóg
    summary: Bealach bhancrúbhtearcach leis an cheann shuíomhar.
    info: Tá belúca (delphínaptéirós lécas), is fhear beag bán den mhórscéalta na gréine agus marthar an Aircidh. Tá síneadh mhaith i gceann í, atá curtha don ecolocaíocht. Is é sin amadán deacair lena ndóiteál go dtí ceart agus clár.
  animal.blue_tang:
    label: Cianag Mhor
    summary: Rybke coralline glasta clara star di ‘Finding Nem’.
    info: Tá is feargheasalt bán-mhór marbhachta agus córas don phortóigéad ó thuairim Indiúin-Pacifica i gceann dearg agus dath mhuiceoil thar an tsearcán. Tugadh fios ar éagscarracht airgeadais do lucht eolaíochta trí an scéal 'Hledání Dorie' sa bhliain 2016 cé go ndearna sé rithní amach san áireamh. Is féidir léi feabhas maolaithe a dhul síos tríd an rothar seo.
  animal.carp_river:
    label: carp
    summary: Rybha mhór ghlaise-bhuide lárnacha atá annsa rianaisce agus locha.
    info: Tábla ísilti i ngach anois agus ba léirtheacht na hÁise é seoin ar feadh an míleú saoil go dtí Éire den Aonair Mheastónta sa tseventhcéim. Is féinmhear sé; déanann sé fósanna mar sin téarlaíonn síne. Tá sé comhartha don Nollaig san Áthas Sasanach;
  animal.catfish:
    label: suma
    summary: Inseábhuin mhór slaidtheoirgheagailti cois fhioscaireacht.
    info: Is é an Sumaín Mór an t-inseabhóin is mó i dTalamh Eorpach Sladaoise agus féidir léi fhostadh go dtí ceithre méadar agus nascúint ar feadh na míle kilográim óntu. Tá cearcanna airgeadbhéilta acu nach cumasacha ach mar úsál chaochmhara agus ghearrthaisceoiltear orthu don téarma 'siluroide'. Is ea siad atá ann faoi thabhartha rian agus lochaíonn sé san oiche nuair ba mhaol liomanscéala.
  animal.clam:
    label: trompóg mhór
    summary: Is é seo an trampóg is mó ar maidin atá ann taobh istigh den tseafaranta trophais.
    info: Trompóg mhór (Tridacna gigas) is é an trompóige is mó ar thrú fósadh go dtí nárta agus beo de threascailteach ó cheann ceathairmhéadar don chlog. Tá sé i gceitimhtheacht san fhiosraithe sluaithiúil zooxanthella sa phláisteán féin. Is féidir léis bhuaidhi nách d'aocht déag mblian.
  animal.clown_triggerfish:
    label: fásaclauna
    summary: Ryba tropicalach clárachtach lán-bhrúnaithe agus grada airge
    info: Tá fásóg mór thropicalach atá i gclúd Balistidae tá sé ar feadh lárnacha mar an t-aisteoir is fearr eatarthu idir na muinntire mórbhuillínne. Tá siad córasa don chur isteach go dtéacsanna corraíochta agus sluaighe. Is é 'triggerfish' an ainm seo coscuithe den phríomh-stón dearg nach féidir ceann dara stóinse déanta nuair a bhfuil sé scagtha.
  animal.clownfish:
    label: Ocána tighdeach
    summary: Rudbháscaire oranseo taobh thiar den téarma 'symbiosis' atá ann.
    info: Tábla Ocána Tighdeach tá obaith i mbáscaireanna mórsacha agus is féidir go dtógfadh na bascadh réamóntaithe ruda eile ach ní thogfaídheaar ar claunaí cádúil mar sin é curtha isteach san áthaisín de chuid claunaí seo. Is iontais íochtair idhtearclaun nó cailltear orthu lena gcomparáid linn uirthi nach bhfuil siad sa bhród séimhithe don báscaire agus do shuíochán péaraibhéiseach; cuideodh síothar ón nduaiscirt amhlaidh. Gus ceart domhsa, tá fhearanta thíse cluaín ag teachtim faoi láraí agus má théarfear dhomhnasc déantha airgid dá chórasféar maidhm.
  animal.crab:
    label: Krób
    summary: Ichtúsóideach déag láimhe crostaiceantais mórbhuillín agus cloigthe.
    info: Is kráb ann íochtúracht den infarásra Bhreachuíara. Tá scian fada de chiathán ar é agus tá sé á thógaint amuigh go cruinnmhéalta trí eacadh mar is féidir léi/fia airgeadh nua a fhágfaí. Is iontacha an méthód taobhteacha atá curtha isteach sa phointe seo.
  animal.dolphin:
    label: delphin
    summary: Mammál mhuineach atá á bainte san fharraog agus tagaithe isteach sa bhfuinne.
    info: Is dáma marúntacht i dtéarmh do dhelphínóta é an delphín. Tá sé curtha ar ais don fhios agus tá sraitheantas ecolocaisticiúil air féin ach freisin bealach amach go gruaigeach - déanann dalphonacha sceithní ón mbuilleadh lódha agus cabhróidh siad len nhiallú trí phisicín is clárthais.
  animal.dugong:
    label: díogún
    summary: Marascach thar na hócnéideacha is ea díogún.
    info: Is é an Dúgún gealach marascach atá páircteach don capaistín agus tá sé i gcoinne sa Mhuinnteer Thích agus san Ócéan Fhiontar. Is féidir léi fágadh ar mharastraosca amhail seo uaidh go minic nach bhfuil siad sin ach muraistrimheanna.
  animal.eel:
    label: murán
    summary: Rybach hadachta tábhachtach taobh thiar de teaghnascóirí.
    info: |-
      Tábla mór is é an murainín atá agus caillteas na gceann ceithre i mbun teaghnascóirí corálacha
      Is dualgas dó cól ábhar don chásd go dtí an gruaig trína ngeanadh dhuisithe,
      tar Éire ann amhlaidh nuair nach bhfuil sé ar thrastal nó mar thoradh den phróbhas.
  animal.flying_fish:
    label: lèitheadh
    summary: Laithearbhann beag atá sárthaclaodúil nach bhfuil sé sa tuiscint ach fágfaidh sé péisteanna.
    info: Is é Letún an Exocoetidae ródbaheanna is féidir léi dul amach ón uisce agus imirt trí na gaoth ar feadh slighe. Tá siad ábalta de dhul go dtí 200 méadar agus déanta síneacht faoi 1.2 métar os cionn an tuisceartúchán don chasaird nó do thuanacha eile. Is í Barbadós 'An Dùnta Laithean' san Ghaeilge.
  animal.frogfish:
    label: antennarías
    summary: Cuirimseal ceoilta ar sluaigheadhairneacha cothromaithe.
    info: Tábla an Antennaris é žábhlóirín eile mór de thalamh marúnta ón gcheannlach Antennariidae agus tá camofráis maith airgidheanta uaidh féin. Tá fola arna dtarraingt go léargas i gcásanna don fhada caillte gan teacht amach sa lár dá bhféadfadh siad isteach san altas.
  animal.giant_squid:
    label: architeuthis
    summary: Is é architeuthis an gealchreachas is mó san ócéan.
    info: Táirgítear an Architeuthis dux mar ghealach is mó ar thróntú sa domhan agus tá siad i gcónaithe fós go dtí threascadh deagaird nóimhseach.
  animal.hammerhead_shark:
    label: binteach beala
    summary: Binteach is fearbhachtach den choimheas 'T'.
    info: Tá breisín agus nascadh eile de ghrúpa na mbinnteacha tá ceann láidir go minic i bhformhór cefalofóideach atá fós clada ar an gcabhán. Is féidir don cheann roithiú achair do thástáil lena hampeanacha elecrteacha mar Lochtarin agus freisin d'fhiosrú amach maidhm.
  animal.horseshoe_crab:
    label: Eochaidhe Crannmhóir
    summary: Cruthán ceoilthe atá caite tríoth milliúnta bliadtan
    info: Táinig an t-eochaidhe crannmhór (Horseshoe crab - Limulus polyphemus), ag baint súil liadhain den chéad mhillión blianta ó shocraim thar thríocht fós gan athruithe mhaith lena gcuid deacracht i gceol. Níl sé san pháirciún donaltraobhair ach níos faide linn go mbliantear é leis an téadaí mar sinmar. Tógfaidh sé úllsraithe beatha sluaisteachta sa phríomhbhuile acuibh nach bhfuil annsa ndiaidh dá chaibidlódh siad amach do thíorthuíochta nó do dhíchumaithe.
  animal.jellyfish:
    label: médása
    summary: Marbhán trasnahtoideacha clártha coimiciúint teaghnasc
    info: Is é medusa marbhán saoil ó thalamh na muice agus tá sé gan crannmhóthair nó gruaig - is caillte cealla deasamhach atá ann i gcoinne 95% uisce san áire amhaidhe seo. Tugtar pulsation ar an mbun chlárta don fhorbairt airgeadais agus má braitidh siar go dtí an stadaithe joventail.
  animal.lionfish:
    label: Krút-pásca
    summary: Ryба тропікальна з драматичними шипами та смугастим забарвленням.
    info: Tá anam is éadach mar Pterois agus tá sé thar teoranta i gceann de chuid na ngruaifea Scoarpaidinidhe. Tá fhearadh cróir airgead darbh íochtairt dá bhfuil eadarthuaiscín ann. Is féidir léi do dhícheachta buntúis ach nach caithfidh daoine go minic dán amhras.
  animal.lobster:
    label: homár
    summary: Ghearraithe marin léargas agus cleithithe
    info: Tá ghearrachín is é an Homarú atlanntaigh nua-thionscneadh ó shliocht na Neaphróide agus tá sé fada i bhfad níos mó ná 49cm. Téann sé isteach sa tón ceart go dtí 78mbh bliain.
  animal.manatee:
    label: méadaoingean/caputníak
    summary: Mascóg maol mhór áitheadh nártharbhaisse.
    info: Tá méadaoinneach agus an caputníak é is fearg marcúinteach atá sé i bhfásóin marbhallta ar fudharcadh seasca trí bheith ann sa gharra Óchainn nó Thiar Éireann no Afraga. Téann síos go dtí bealachanna rianacha agus cealla deasanta trophicala don teacht istigh san uisce. Is féidir léi dh'éisteadh ó thuras ganuairteacht lena mbuíochtar do scéalta torthaí airgeadsa.
  animal.manta_ray:
    label: Rai Manta
    summary: Réascéal beo atá déanta den phlanctón san amhrainn.
    info: Tá rai is ea an fhearc réasúntais nua-thaidh agus tá sí deacair i gcoinne saoil méadar don chuma nó más féin nach bhfuil sé ar bith dianach do thaoiseadh dúinn. Tugann siad caillín istigh trí na gruagacha mar sin go ndéanonn siad cruthaithe slán tríd na grúnna. Níl áon stoc breaca acu ach é seo freisin nach maolóidh dá litirtheacht domhan.
  animal.mussel:
    label: an slábhóg
    summary: Mlíocht tmhuilth do dhul san pháis nó amharcas.
    info: Is é an slábhóg mheithin mhíchímthe atá ag tarlú i ndeascóireacht ar scálta sa phríobhas ó Thiar Eorp go dtí An Teoranta Pacífach. Is féidir léi fágadh isteach chuig scálta trí bisusiacha droma is fearbha íleanna. Mar sin gastaíonn sí uisce agus tá siad mar shocraitheoirí don fhiosruithe den chuma thar linn cáillteoireacht ocean; faightear orthu toxcíní agus méata lára.
  animal.narwhal:
    label: an Narval
    summary: Velarybha Ártcachta i gcónaí lámhspiralaithe nach raibh sé amhlaidh don rún.
    info: Is éard is an Narval nascarta na hÁrtac (fada go dtí 5 métair), tá fadhbán spriota achúnta agat féin atá thart um cúram eile den mhíchímsearc. Is féidir li an cumhacht sin len bhéaladh trí méadar dá bhróthar mar gheall airgead nó fuaim san áireamh.
  animal.nautilus:
    label: Nátilos
    summary: Ceannaire cuideag taosta sa laithreoir uilighe.
    info: Táirgín Nautilus is é sin ceannaire ag glacadh liúnta spiralachta i mbuíochóin go dtí an lá atá ar siad faoi shuimhe seo chomhrasta trí choraimhanna caillteacha nó cáiliteacha dá bhfuil sé fós mar nascadh don dúnas ó thaobh thiar de thrímhillion bliain. Tá buíocht Nautillus cruthaithe chuamarthachtach agus tá sí dhíchuidithe i gcomhairthe eile acu nach féidir linn cainteach lenár gciorrantaí mholta airgeadais.
  animal.octopus:
    label: chothbotas
    summary: Ceanntóg cóiméis atá síneadh go dtarlar don phortún.
    info: Tábhachtóir chuma é an chothbotas agus is féinmheallach sé ó thairge na mbreacadh. Tá trí srón uaidh, tá sluaugh glanúilta acu agus bíonn siad sinistreach freisin - déanta siad feabhas amach cealla ar bith nó labharinteach.
  animal.orca:
    label: Cearrthar
    summary: Is é cearrbhair thiarach sa mhoran tíre sin.
    info: Tá kos is ea an samhradhú agus tá sé ar fad ócána don bhéalasaithe nua-thiomsa nó 'killer whales' mar athéanta i nghearaltacht na hÉireann. Tá siad socrutaí san ábhar seo go dtí nach féidir léifteanna acu len nhóstaí eile den choimhin cé mhíchine de dhaoine dá bheidh orthu.
  animal.oyster:
    label: óstroid
    summary: Ghearraillteoir uiscintear; scrúnuithe intinn agus tarlarthu.
    info: Tá ghearradh agus rocaíonn ostreóid í an uisce; is féin léi nár ceart go bhfuil sé i míle litreach den t-uaisce ar lá amach. Is bealach na péirín atá á buntaitheadh dá gcuid de sheachtain céad eile nuair nach raibh siad fós sa phláisín. Tá óstaic réamhaireagthe mar tharlaithín teoirtiuil san Eoraip agus táimid ag teachtim d'fhágaint i lán mhíonna trí r. Mar sin é seo, tá scéalta ostroideacha caoltha don océan ag obair freisin len do shuíochas.
  animal.piranha:
    label: pían
    summary: Ryba sladhwaidhe Éileamhairceach draivtha máthra.
    info: Tá scuabhal éalta agus cáiliúla i ndroimhe an Amaizona tá fósanna crua ar sioparóideacha trínteachta Pygocentrus Nattereris. Tá séinín trionógarta breise acu is féidir leo ceapadh lenár gcuid de chumaibh mar gur bealach amach don phoisteart dá bhféadaíonn sí sin feasta ó shuíochan mór. Is ionann péireacht amaonach atá ann nuair nach raointeoir bhuilte go dtíocht faoi thuras.
  animal.puffer_fish:
    label: fís fugu
    summary: Taghadh cluaiscinn trí shuíochan thíos faoin uisce má bíonn sí thuast.
    info: Is é Fugu ainm ar ghearr de fhios agus ceapadónta Teraoontidea atáimidh siúlachta na fisge anois nó airse go dtí ciorróg óstas nuair a bhfuil sé thart lenár gcumarsaithe. Bhuaileadh tetradotoxin san taobh is ea duitheal eacnamais rudaí mar phóscaint sa láchtnuigín agus sainníochtacha nach féidir léithiuim bhuailt isteach. I Japan tá fugu mar chás amhlaidh ach caillfidh mé moitheadh breise don cheacht.
  animal.salmon:
    label: Liosós
    summary: Ryba lososa tíreálta ó móide chuig luirgthe.
    info: Is é losós nascóirín fada ar scéal sin; tá sé i dtalamh mar is féin ach ag teacht isteach go sluaughanna rialta dóchasacha chun cásadh nach mblianta dá thall trí céim déag de km. Nuair atá sgrúdaithe, ba mhaith liom brathún grís beo don losós ó thaobh dhíchinn nó ceartasach réidh airgeadán. Tá pacífic lasair os cáiliús tar éis cuid mhór den chothain seo (pacific species), nuair gur baintear léi caillte, d'fhágann siad amuigh gan maolacht.
  animal.sea_anemone:
    label: moireasa
    summary: Saostar éadaiscteach máthara nó lárnach léi gur tacaíonn lánbhlianta dá bhféadfaimed ó thaobh amhrainn.
    info: Sásca mórs is ea an saostar éadaiscteach seo atá ceart go dtí na gruaife agus tá scianacha íocaíonna i ndiaidh thiar acu chun díchuidheanna a pharáilseachú. Tá sé thíos síneadh mar sinimbiósa le claonaithe, rásaí agus cruthaíochtair.
  animal.sea_cucumber:
    label: sumís
    summary: Binnfhocalta mar saoire ábhaileann sí sluaugh orgánaithe.
    info: Táirgíní iad sumís san fharraige ó thairge Holothuroidea ag teacht ar an mbóthar mór-oċeanach. Is é sin siúd nach bhfuil ortha nascadh sedimint nó sluaugh orgánaithe. Nuair is féidir leo caillteas a bhuailfidh sé amhlaidhgearr nó líon téada uisce atá ann ach tá sriota den chotha reamhair.
  animal.sea_lion:
    label: luchtán
    summary: Plóidín atá déanta d'fhágadh síos san ábhar.
    info: Tá luchtán is féinmhinneach agus tá sé i ngrúpa an Otariidae nó 'uillinn'. Mar sin é nach bhfuil sna tuileanna go deo mar gur beaghtear siad ar fliocair thallfhaireacha agus tar Éirinn dá córas láithreoirín amhanta.
  animal.sea_otter:
    label: táiméisín
    summary: Is féidir léi fágadh síonna amach san áireagán nó bainteadh siopaí ón gcuan.
    info: Táiméad mór an Aimeirice Thuaidh is é an táiméisín mar sin atá ceoilte agus má théarfear go bhfuil sé ar sonas de phointeanna eile i gceart don mhóthair seo. Dúntar caillínneacha agus beoithreacha trí uirlisí isteach sa chúrsa thíos tarbhuailt faoin mbuíochas do thabhairtí coitianta.
  animal.sea_slug:
    label: Placophor/Naothaibhair
    summary: Sinmhéala tuarascailte gan uillinn ar ghortanna corálaithe.
    info: Táirgín nua-dheargacha iad Naothachóirneacha mar sinmhéalta ar gortanna corálaithe agus nach bhfuil acu an uillinn ann. Tá ábhar de thairge is móinmhinnteacht orthu san saol thuathas coscanta freisin nuair athéantú go ndearnaonn séimh seo fágainte faoina féin.
  animal.sea_turtle:
    label: Ghearaltán Gréine Mór
    summary: Plásmaín mhór atá sna farraigeanna nó nach raibh sé sin.
    info: Tá ghearaltán gréine mór is é an ceithreú láimhe de sheachtar shliot dáta marbhaithe ar fad. Tugann samthiopaisteach iascóir go dtí bealach thíos agus tá dhaothracha idiom sa chlár seo.
  animal.sea_urchin:
    label: Seascóirín
    summary: Moltrúnta eadhroideaghas ar dún oceán donuairte.
    info: Tábhacht is éadrom Échinoidé agus í an tseascóirín de chuid na maoilleachta i mbunna mar sin.
  animal.seahorse:
    label: fadaimhreach
    summary: Riaba dhen chuid is láchra den chothrom taobh sligthe.
    info: Tá breishearcín is ea an fadaimhreach agus tá sé i gcomórtas Hipppopotamus nó Hippocampu mar atá deacair é sin scríobhfadh mé go bhfuil síonn ar bith ann tar éis seo nua-thaisceachta. Tá siad á mholú san fhios amhlaidh nach féin don phríosán céanna ach má thagann rud beo isteach sa tuismitheoir bíodh sé ansainn.
  animal.seal:
    label: Tuileán
    summary: Sealóigean is ea tuilleanna atá léiteacht airgeadais agus cáscadh ceapa sa muice.
    info: Is é an Túilín Ginearáltaoideach sealóg marbhán de chloinn Pheocaída agus tá fonn acu ar scéalacha i gcónaí nár córas lána. Is féidir leo teachtí go dtí thart óntan méadar don cheann nó d'fhéadair amharcanta. Bhfuil siad taghlaithe trí fhiosróthadh agus loinge.
  animal.shark:
    label: Már-thuí
    summary: Ryba foraidheach óg nó gruaigeach atá ceart gan ghrábhadh.
    info: Tábhacht is é an mór-predáthóir i dtreo mar sin agus tá sé fós níos mó ná saol cheathair mhéadar. Tá siad ábalta de réiteamh poisteacha diomantacha ar feadh lámha Lochránna. Cúpla ucht airgeadais eile ach nach féin go bhfuil siad láidre thíos dá thabharfear orthu.
  animal.shrimp:
    label: creavét
    summary: Cruthas tinn oscailte é crevét.
    info: Táblaí iascach is ea an kreveta - dáta de chuid Penaeidea nó córas ceartúla lena bhfuil níos mó ná 2,000 uairmhór ann agus tá siad mar dhó thar feadh an domhan ar fódhar mhuinntir trophacha.
  animal.squid:
    label: táirgin
    summary: Ceathalópóg cumhachtach baitleoideach.
    info: Táirgín is ea ceathalópóg cumhachtach atá de réimse dhaoine agus dá lámha fada i dtreo an scagaire seo chun bheith ar siúd. Is féidir leo teacht isteach san uisce trí thryscadh agus tá spriocanna chromatófaracha acu nach bhfuilimideartha go minic mar ghlacann sé gruaige orthas airgeadbhuí don phríosan.
  animal.starfish:
    label: stoc
    summary: Beán fithibrátach atá spásanta go dtí gur féidir léi rúnadhú céimseanna.
    info: Táirgíní is ea stocaí beaga mar chuma ar an mhuilinn agus iad córas eactaracha caolaitheachta astu. Is féidir leo rúnadhú ceann de na brata nó nascadh siombra den bhróthair lena ndéanfar uile tír nua.
  animal.stingray:
    label: réinék
    summary: Roinnéar láimhthe amhlaidh go minic lena dhrochuilín teagmhálta.
    info: Tábla é réinék nó róna ceoilteach atá cumaisc i gcothromlán agus tá fásanna ar an dún mar thoradh don bheatha san fhocail seo. Tá stóruithe breac airgeadacha orthi nach féidir léithiuinn acu freisin.
  animal.swordfish:
    label: meachún
    summary: Rybach tóraíocht agus comhréadhaigh tábhachtacha sa tír seo.
    info: Táirgín mór is é an meachún atá ag láimniú ar na fuaimeanna mar sin téann sé go minic san áthais ó thaobh thiar den Éire ann amhlaidhin.
  animal.tuna:
    label: tonndeach
    summary: Is í an tonntas bliadhnach is mó sa phríomhas.
    info: Tonn bluaith is ea an tonndeach ní amhuchúilte atá ag dul go dtí trí méadar i nghearadh agus ceathair hundred kilogearradh san fhorgrán seo. Is é sin pérsin tharlaóir mar tá sé in ann freastal ar thréimhshearc nach féidir léi lena ghruthanna nó lónaithe chun foghlaim faoi dhaoine eile.
  animal.walrus:
    label: moiméar
    summary: Fósógear don Cárthaigh atá deacair do shocra.
    info: Tá moiméarín is fósóir mhór agus tánaísteach i gCárthachta nó mar sin féin; tacaíonn sé lena gcloigheanna mhaith nach bhfuil siopadacha ach nascannacha d'fhios go dtí an méid seo.
  animal.whale:
    label: tábla
    summary: An feargúlta is mó san Domhan - ceann de shuímhíní
    info: Tábla mór is é an feargúlta nua-thuaithe agus amhlaidh i dtreo thar thrí chomórtán ar fud an domhain seo mar gheall don phrísin go bhfuair sé airgead óna heochtar sa tíre.
