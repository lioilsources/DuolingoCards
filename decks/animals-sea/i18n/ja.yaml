lang: ja
pivot: false
title: 海洋動物
cards:
  animal.anglerfish:
    label: '"mořský ěibel"'
    summary: 「顔に生物発光性の誘因を持っている深海水産動物」
    info: "{\"hint\":\"深海魚で、発光する誘引器を持つ（Lophiiformes）\",\"info\":\"海洋の暗い水域に生息し、水深は1000メートル以上である。\n雌には頭部にある生物発光性の誘引装置があり、獲物や雄を引き寄せるために使われる。 \n雄は非常に小さく、雌を見つけた後では吸着力を使って結合して生物学的に一体化してしまう。\nこの発光現象は共生関係にある細菌によって起こされるものだ。\"}"
  animal.barnacle:
    label: '"rak světlonoš"'
    summary: 小型の甲殻類で、岩や船体に永久的に付着して生活する。
    info: '{"hint":"\"immobile crustaceans attaching themselves onto rocks and vessels \"(Cirripedia)\", "info": "The barnacles belong under suborder Cirripedia within class Crustacea - they attach permanently using calcareous secretions on rocky surfaces including ship hulls even whale bodies through their entire life cycle after metamorphosis starting initially free-swimming larvae stage filtering microscopic organisms like phytoplanktons via specialized appendages extending outside protective shell cases."}'
  animal.beluga_whale:
    label: '"ベリュガ"'
    summary: '"北極地方の小型の白く毛深いクジラで、まるみのある顔つきを持ち、親しみやすい印象があります。"'
    info: "{\"hint\":\"小型の白いアーティッククジラで、頭部が膨らんでいる（デルフィン アペテールス レウカス）\",\"info\":\"ベルーカ（学名：Delphinapterus leucas）は極地および亜寒帯海域に生息する小さな白色のクジラです。\r\n特徴的な丸まった額部分である「メロン」と呼ばれる器官を使ってエコロケーションを行います。\r\n首を横方向へ動かすことができる唯一のクジ拉であり、多様な音声によってコミュニケーションを取ります；歴史上漁師たちはこれを『海のカンラン』と呼んでいました。\"}"
  animal.blue_tang:
    label: カンピチブルー
    summary: 珊瑚礁域の鮮やかに染まる青色小魚；アニメ『ファインディングニモ』のスター
    info: |-
      {"hint":"明るい青色のサンゴ礁魚（パラカントゥルス・ヘパトゥス）『ファインディングニモ』から","info":"カンピチブルー（Paracanthurus hepatus）は、インド太平洋に広く分布する珊瑚礁域で見られる小型海水魚であり、鮮やかな青と黄色が目を引きます。
      映画『ディズニー／pixar ファインディングドリー』(2016年公開)によって人気となりました。ただし飼育には高い技術が必要です。
      尾びれの根元近くにある鋭利な刃のような器官があり、「サージョンフィッシュ」という英名もこの特徴由来しています。
      プランクトン類を主食としています。
  animal.carp_river:
    label: リバー・カルプ
    summary: 「リバー・カルプ」は、川と養殖場などの淡水域に住む大型の金色または茶色の魚である。
    info: '{"hint":"自然の川環境におけるコイ（学名：Cyprius carpio）","info":"カラスウオはアジア原産で、中世にヨーロッパへ導入されました。\n雑食性であり、底を掘って水質が濁ることもあります。\nチェコではクリスマスの象徴的存在となっており、市場の人々によって生きている状態で売られます。\n世界でもっとも多く飼育されている魚種の一つです。","label":"リバーコーク","summary":"河川や池塘など淡水域に生息する大きな黄金色から褐色系の魚類。'
  animal.catfish:
    label: スメック
    summary: 大きなヒゲを持ち、川床部に隠れる大型の淡水魚です。
    info: |-
      {"hint":"川や湖の底に住む、ひげを持つ淡水魚（シルリーフォームズ）","info":"スメク・ヴェルキはヨーロッパ最大の淡水魚で、長さが2mを超え、体重も100kgを超える。
      特徴的なヒゲであるバールエルによって嗅覚と触角機能を果たす。
      河川および湖泊の底部付近に生息し夜行性捕食者として行動する。
      チェコではスポーツフィッシングにおいて希少価値のある対象種と考えられている。","label":"スメック","summary":"大きなヒゲを持ち、川床部に隠れる大型の淡水魚"}
  animal.clam:
    label: '"巨大なカキ"'
    summary: '"熱帯性サンゴ礁域に生息する世界最大のカキ。'
    info: |-
      {"hint":"両開腔軟体動物で、二つのヒンジ付きの貝殻を持つ（双鰓綱）","info":"巨大なカキ（Tridacna gigas）は世界最大級のカキであり、長さがメートルを超え、重さも200kgを超える。
      体内に光合成を行う藻類（ゾオザントラエル）と共生している。
      寿命は百年以上にもなる。
      潜り人を捕まえられるという都市伝説だが、実際には閉じるのが遅く、嘘である。"}
  animal.clown_triggerfish:
    label: '"クラウントラウト"'
    summary: 白い斑点とオレンジ色の唇を持っている鮮明な色彩を持つ熱帯魚
    info: |-
      {"hint":"太く模様の入ったサンゴ礁魚（バルリストイデス・コンスピキラム）","info":"クラウントラウトは、熱帯性で大きな海水魚であり、最も目立つ色合いを持つ海洋魚種の一つです。
      硬い珊瑚やカサガイを砕くために強い歯を持っています。
      「クラウン」という名前は最初の背びれ棘に由来し、これは第二の棘に対して安全装置のように機能します。
      繁殖期にはダイバーに対しても攻撃的になることがあります。"}
  animal.clownfish:
    label: クラウン・オチャカタ
    summary: 赤い色合いをしていて、有毒な海洋ササンゴと共生している魚である。
    info: |-
      クラウン・オチャカタは、有毒な触手を持つ海のササンゴに住んでおり、他の魚であればその毒で死ぬであろうが、保護的な粘膜により免疫を持っている。共生関係において彼はササンゴを清掃し捕食者から守り、一方ではササンゴも自身への防御として役立っている。
      すべてのクラウン・オチャカタはオスとして生まれるが、優勢個体はメスになることができる。
      『ニモを探して』という映画によって世界中の人々にとって有名人となった。
  animal.crab:
    label: かに
    summary: 甲殻類の十脚目で、硬い外骨格とが集装備し、横へ移動する。
    info: カニはBrachyura亜目の甲殻動物です。硬いキチン質の外皮を持ち、成長のために定期的にこれを脱ぎます（エクディゼ）。特徴的なのは横への動きであり、そのガラスのような鋏足は防御や捕食およびコミュニケーションにも使われます。海だけでなく淡水や陸でも生息しています。
  animal.dolphin:
    label: イルカ
    summary: 群れで生活し、水からジャンプする賢い海洋哺乳類。
    info: イルカはクジラ目ヒゲクジラ科の海生哺乳動物です。高い知能やエコロケーション能力、遊ぶような行動が特徴で、船の波からジャンプしたり、ピーピー鳴いたりクリック音を使ってコミュニケーションをとります。仲間と一緒に「群れ」と呼ばれるグループで暮らしており、クジラとは近縁の関係にあります。
  animal.dugong:
    label: デュゴン
    summary: 静かな海洋植食物で、インディアントラフとパシフィックトラフに分布するマナティ属の仲間です
    info: |-
      {"hint":"優しい海洋食草動物で、マンテーに近縁しインド洋（学名：Dugong dugon）の海域に生息しています","info":"デュゴンはマナティと親戚関係にある海獣であり、インディアンオーシャンや太平洋沿岸域を棲み家としています。
      彼らは完全な植物性食料である海水藻類のみによって生きています。
      古代から現代まで航海者たちが誤ってこの生物を見間違えて「美人魚」などと考えていたため、伝説的な存在とも言えるかもしれません。
      しかし現在では深刻な絶滅危機下におかれており、その主因としては自然環境破壊による生息地喪失および船との衝突事故などが挙げられます。"}
  animal.eel:
    label: ウナギ／マーレナ
    summary: 岩場や珊瑚礁の中での蠕行する蛇のような形態を持つ魚です。
    info: |-
      マーレナは、サンゴ礁のひび割れの中に隠れる大型の海魚で、アングイラ科に属しています。口と咽頭部にある二組の顎を持ち、獲物を喉元へ引き込むために使います。
      攻撃的ではありませんが、刺激された際に咬まれることがあります。
      川エビ（学名：Anugila anugila）という種類では、繁殖のためにサルガッソ海まで移動し、そこで死ぬこともあります。
  animal.flying_fish:
    label: летун
    summary: 熱帯魚であり、海洋表面上で胸びれを使用して滑翔します。
    info: |-
      {"hint":"熱帯魚で、翼のような胸びれを使って水面の上を滑空する（エクソセテイド）","info":"レトゥン（エクソセテイダエ科）は水からジャンプして空中に滑るように飛行できる熱帯魚です。
      広げた胸ビレが羽のように機能し、最大約200メートルまで飛び立ち高さ1.2メートルにも達することができます。こうした能力により捕食者であるマグロやマルリン、イルカなどからの逃走を行います。
      バーバドスではこの「飛ぶ魚」によって国として知られおり、レトゥーンはその国民料理および文化において重要な存在となっています。
  animal.frogfish:
    label: '"カエルギンチャクエビ"'
    summary: '"珊瑚礁での隠れた狩人として行動し、仕掛けた饵を使っています。"'
    info: |-
      {"hint":"変な伏兵の捕食者で、胸びれを使って歩く（アンテナリアイデー）","info":"カエルギンチャクエビ（Antennarius）は、マスターカモフラージュを持つ小さな海水魚です。
      胸びれが足のように形作られており、それらを用いて海底を歩いています。
      第一背鰭には餌となる可動式のひげ状器官があり、獲物に誘引します。
      そのサイズと同等またはそれに近い大きさの獲物も食べることができて、飲み込むのにかかる時間はわずか0.006秒です。"}
  animal.giant_squid:
    label: 巨大型タコ
    summary: 地球上で最もうえにある深海水域に住む最大級の無脊椎動物です
    info: |-
      {"hint":"巨大な深海頭足類で、長さは最大13メートル以上（アーキテューツ）","info":"グレイトコウモリガイ（学名：アーカイテュース・デックス）は世界の無脊椎動物の中で最も大きい種であり、全長が13メートルを超える。
      彼らには動物界でもっとも大きな目があり、直径は約25cmを超えている。この特徴により暗い海底環境に適応している。
      これらの生物は水深300〜1000メートルを主として生息しており、サケザメなどの捕食者にとって主要な食物である。
      実際に海洋底面での生きているグレイトコウモリガイが撮影されたのは初めてだったのが2004年まで遡る。
  animal.hammerhead_shark:
    label: hammerhead shark
    summary: T字形の拡大した平面状の頭を持ったサメ
    info: " Hammerhead sharkは、特徴的なT字型の頭部（セファロフィル）を持つサメ科に属する。広い頭により電気器官であるロンゼーニ管を通じて獲物をより正確に検知しやすくなり、操縦性も向上している。\t熱帯域の海洋で生息しており、魚やエビ・タコなどを捕食する。\t一部種類では絶滅のおそれがあり、ヒゲを使って狩猟される。"
  animal.horseshoe_crab:
    label: ヒマラビ
    summary: 大きな変化なしに4億5千萬年間生き延びてきた古き日の節足動物
    info: |-
      ヒマラビ（学名：Limulus polyphemus）は、約4億5千万年前から変化なく存在し続けている古代の節足動物です。カニとは関係が無く、クモやダニなどの蜘蛛類に近い親戚になります。
      その青色血液には医薬品およびワクチンの安全性をテストするために使われる特有成分である凝固素が含まれています。
      春になると群れで海岸へ向かい繁殖のために集まります。またこれは渡り鳥にとって重要な餌となっています。
  animal.jellyfish:
    label: クラゲ
    summary: 透明な鐘型の海の動物で、毒のある触手を持っている。
    info: クラゲは脳や心臓、骨を持たない刺胞動物門の海洋生物であり、体の約95％が水である。脈動によってその鐘状の身体を移動させる。触手には麻痺効果を持つ刺胞（ネマトサイト）があり、獲物に作用する。一部の種類はほぼ不死であり、幼生期に戻ることができる。
  animal.lionfish:
    label: クルトパセック
    summary: 劇的な棘としま模様を持つ熱帯の有毒な魚だ。
    info: "{\"hint\":\"毒を持つサンゴ礁の魚で、印象的な棘を持っている（ポテロイス）\",\"info\":\"赤いクルトパセックはScorpaenidae科に属する有毒な海水魚であり、鮮やかな赤白の縞模様と毒性のある棘を持っています。\r\nその毒素によって激しい痛みを引き起こしますが、命に関わる状況になることはほとんどありません。\r\nカリブ海および地中海では外来種として広まりており、現地の魚類を減少させています。\r\n原産地域以外での水中には自然発生的に捕食者を持っていません。\",\"label\":\"クルトパセック\",\"summary\":\"劇的である棘としま模様がある熱帯の有毒な魚です。\"}"
  animal.lobster:
    label: ロブスタ
    summary: クセのある足を持つ大きい海の昆虫；茹でると赤くなるけれども本来は青みがかった緑色なのです
    info: |-
      {"hint":"大型の甲殻類で、脚があります。調理すると鮮やかな赤色になります（ホマーラス）","info":"アトランティック・ロブスターはネフロピダエ科に属する大きな海洋性甲殼動物であり、体長が60cmを超えることがあります。
      生では暗い青緑色をしています；加熱してカドミウムのような赤く染まるのはその時です。
      寿命としては最大でも50年以上生きることがあります。
      高級な海産品として評価されており、この種との取引には数十億ドル規模の市場があるのです。
  animal.manatee:
    label: デュゴン／カプストニヤック
    summary: 「海牛」として知られる遡上型の海の草食動物
    info: |-
      {"hint":"遅く、優しく、海の草食動物（トリケトゥス）；シーカウと呼ばれる","info":"カブースナイャク（マナティ）は海洋性哺乳類で、完全に海水藻を食べて生きています。
      melké tropické přístavy, ústi řek a kanály karibu, florida a afrikaに生息しています。\nモーター船との衝突によって深刻な脅威を受けているため多くの個体がプロペラによる傷跡を持っています。\n彼らはゆっくり動いており(時速3〜5キロメートル)，呼吸する頻度も3〜5分間隔です。
  animal.manta_ray:
    label: レイ・マンター
    summary: 海洋表面付近でプランクトンをフィルタリングする巨大で美しいレインコである。
    info: |-
      {"hint":"巨大で優雅なフィルターフィードを行うレインコ（Mobula birostris）","info":"マントアオウは最大のサメであり、翼状軟骨が7m以上に達し体重も2トンを超える。
      プランクトンをエラ蓋を使って濾過しながら口を開けて泳ぐ。
      毒針を持たず人間には全く害がないとされる。
      最も知能が高い魚類として分類され、鏡の中での自分の映像を見分けられる可能性がある。","label":"レイ・マンター","summary":"海面近くでプランクトンをフィルタリングする巨大で優美なレインコ。"}
  animal.mussel:
    label: スロヴカー
    summary: 明け干し地帯などで岩に集団的に付着している黒い牡蠂
    info: |-
      {"hint":"暗色の貝殻を持つ二枚貝が岩に群生する（ミツガシラ）","info":"エゾカキは、大西洋と太平洋沿岸域で潮間帯に住むムジナガイである。
      岩にくっつくためには固い糸状物質を用いる。
      水を通すフィルターとして働き海洋汚染度合いを見極める指標となる。毒や重金属も蓄積してしまう。
      また高価な食材としても知られおり、ベルギー風モーフ・フリットという世界中でも有名な料理がある。
  animal.narwhal:
    label: ナルヴァル
    summary: 螺旋状の角があり、伝説上の一角獣のような外見をしている寒帯海域に住むクジラ
    info: |-
      {"hint":"北極のクジラで、長いらせん状の牙を持つ（モノドン・モノケロス）","info":"ナルバルは長さが最大約5メートルまでの小型のアーチックなクジラであり、特徴的なねじれた形をした歯を持っています。この歯は実際には左側の門歯から発達したものである。
      その牙の長さは最長でも3メートルに達することができ、雌では存在しない。
      彼らは群れを作りながら主に北極海域に生息しています。
      中世時代においては、ナルバルのこのような牙が魔力のある薬効があると信じられていた。
  animal.nautilus:
    label: ナウチトルス
    summary: 恐竜時代以來生存し続ける螺旋状の壳の中の古生物
    info: "{\"hint\":\"古代の頭足類で、巻き貝のような殼を持つ（ナウティルス）\",\"info\":\"ナウティルスは進化していない原始的な頭足動物であり、ほぼ変化なく約4億年間生き続けている。\r\nその外骨格であるシェルは部屋に区切られており；ナウテイルスはガスを充填して浮力を調節している。\r\n他の頭足動物とは異なりレンズを持たない単純な目を持っている。（ピンホールカメラ型視覚）\r\n国際条約により乱獲から保護されている。\",\"label\":\"ナウチトルス\",\"summary\":\"恐竜時代以来生存し続ける螺旋状の壳の中の古生物\"}"
  animal.octopus:
    label: タコ
    summary: 八つの腕を持つ軟体動物で、色や体の形を変えることができる。
    info: タコは頭足類に属する無脊椎動物です。三つの心臓を持ち、青い血液があります。クロマトフォアを使って肌の色と質感を瞬時に変えることができます。非常に知能が高く、閉じた容器を開けることや迷路を解くこともできます。
  animal.orca:
    label: コサトーカ
    summary: 海洋における最強種であるブラックアンドホワイツカラーを持つ大型イルカ
    info: |-
      {"hint":"黒白の頂点捕食者、別名キラー・シャチ（オルカ）","info":"ドロナはデリフィノイタ科の中で最大で、世界でも最も知能が高い動物の一つです。\n協調して狩りをします；各群れには独自な狩猟能力があります。
      異なる音声信号によって方言を使ってコミュニケーションを取ります。
      飼育下では健康問題が生じています。（シー・ワールドなど）。動物権利運動によりその養殖に制限が出ました。
  animal.oyster:
    label: カキ
    summary: 水をろ過して綺麗にして、その結果生まれる真珠と美味しい料理でも有名な双殻目軟体動物です。
    info: |-
      {"hint":"reef and rock-grown bivalves (Ostreidae family)","info":"牡蠣は水をろ過する二枚貝で、1匹の牡蠣が毎日最大200リットルもの海水を通す。
      一部の種類では外套膜に異物が刺さると真珠を作り出すことがある。
      生牡蠣は高級食材として人気があり、伝統的にRという文字がある月には食べる習慣がある。
      海洋での養殖は環境にもやさしく、海中の汚れた水もきれいにする役割もある。","label":"oyster","summary":"水を濾過し、真珠と美食としても知られる二枚貝。"
  animal.piranha:
    label: ピランハ
    summary: 南アメリカ原産の鋳物のような尖った牙を持つ淡水性掠奪的な魚
    info: ピラニア・チェルヴェノブリチャは、アマゾンの淡水に生息する肉食魚で鋭い三角形の歯を持っています。死体を狙う捕食者としての評判が誇張されており、健康な入浴者の攻撃行為は非常にまれです。群れ単位での狩猟能力と強い嗅覚により遠くから血の気配を感じ取ります。
  animal.puffer_fish:
    label: フーグ
    summary: 刺のような突起を持ちながら丸くなる魚；フーギュは珍味かつ毒を持っている
    info: |-
      {"hint":"脅かされると体を棘のある球状に膨らませる魚（トリトドン科）","info":"フグは、トリトドン科の多くの種が水や空気で身体を尖ったボールのようにふくらますことができる。
      テトラドートキシンという自然界でもっとも強力な毒を持つ；肝臓組織と性腺部分には致死的な毒性がある。
      日本では高級料理として扱われており、調理士たちは特別ライセンスが必要である。
      そのような体の拡張機能は防衛手段であり攻撃ではない。"}
  animal.salmon:
    label: サーマン
    summary: 海から河川への産卵行動を行う大きなサーメン科の魚
    info: |-
      {"hint":"大型の上流洄遊魚（サクラマスまたはオニカジキ）","info":"サーモンは海水で成長した後、産卵のために数百km離れた川に戻ってきます。
      産卵前に体色が銀白色から明るい赤に変わります。
      太平洋種の大半の鮭は産卵後に死ぬため、その遺骸によって栄養分が森林生態系へと供給されます。また、ω−6脂肪酸を豊富に含んでいます。
  animal.sea_anemone:
    label: sea anemone
    summary: 美しい海洋生物であり、有毒な触手を持ちサンゴ礁域に生息します。
    info: |-
      {"hint":"花のような触手を持つ刺胞動物（珊瑚虫）","info":"海のアメフラシは、岩に固定されたように見える花のように見えます。
      その腕には毒細胞が含まれており獲物を麻痺させることができます。クラウンディップと藻類およびクリーニングエビとの共生関係で生活しています。
      寿命としては百年以上生きることができ、老化による死から永遠不滅である可能性があります。
      "}
  animal.sea_cucumber:
    label: サミシ
    summary: 円筒状の海底生物であり、底部から有機的残留物を集める
    info: |-
      {"hint":"柔らかく細長な海の動物で、デトリタスを食べる（ホロトゥーロイdea）","info":"サミシヨウは海洋底に生息する棘皮動物門ヒダカガエル科の無脊椎動物です。
      堆積物を通し有機的な残りものを濾過して食べます。
      脅威を感じると腸や水様体液を吐き出し、それも再生されます。
      アジアでは高価なお取り寄せ品として知られ、「トレパン」と呼ばれています。中国料理には伝統的に使われている食材でもあります。
  animal.sea_lion:
    label: アゴヒゲウミラク
    summary: 外耳あり、フリップパーソで歩ける海洋哺乳綱；鳴き声が高い。
    info: |-
      {"hint":"外耳を持つ、フリッパーで歩くことができるシロクマ科の動物","info":"カリフォルニアアゴヒゲウミラクは、オタリアデー（外耳を持ったペンギン）の中で最も有名な種です。
      真っ直ぐに立つことができて4つのフリップパーソを用いて歩いています。
      非常に知能が高く、娯楽業界では複雑な芸事を学びます。
      自然界では魚類やエビ・甲殻类などを捕食します。","label":"アゴヒゲウミラク","summary":"外耳があり、フリップパーソを使って歩ける海獣；吠える音声があります。"}
  animal.sea_otter:
    label: シーラン
    summary: シーランは背中に漂泊しながら石を使い貝殻を開く
    info: |-
      {"hint":"海のアナグマは背中を使って浮遊し、道具を使う（エンヒドラ・ルトリス）","info":"シロナガミユリカモメは北アメリカ原産の海洋哺乳類で、すべての哺乳動物の中で最も密な毛皮を持っている。（平方センチあたり80万本）。岩を工具として使用して胸に置かれた牡蠣やホタテを開ける。水面で横たわって眠りにつき、流れが自分たちを持ち去らないように互いの足を取り合っている。
      かつてファーのためにほぼ絶滅寸前まで追い詰められたが保護プログラムのおかげで個体数が増えている。
  animal.sea_slug:
    label: プラコフォラ／ナキハベル
    summary: カラフルな無殼海洋貝であり、サンゴ礁に生息する。
    info: |-
      ナキバブラ（ヌーディブランチア）は、サンゴ礁で暮らす殻を持たない海の軟体動物です。
      彼らには動物界でも最も目立つ色調があり、毒を持っていることを示しています。一部の種類は餌である珊瑚虫から毒性細胞を取り込み自身を守るために使います。
      現在では形や色彩が多様な約三千を超える種類が確認されています。
  animal.sea_turtle:
    label: 海亀
    summary: 産卵のために岸に戻る大きな海洋爬虫類。
    info: グリーン・タートルは7種の海亀の一つです。メスは、自分自身が孵化した浜に2〜5年ごとに戻ってきて産卵します。成体は草食で、海藻やマリンプランツを食べますが、幼体は雑食性です。
  animal.sea_urchin:
    label: うみゆり
    summary: 岩場の海底にある棘を持つ丸い海洋動物です。
    info: |-
      {"hint":"海の底にいる棘のある球形エキノデルマ（エチニオイダ）","info":"ウミユリは、移動可能な棘で覆われた海洋性エキノーデルマである。
      棘の中には清掃や捕食のために特別な器官（ペディセルラリー）がある。
      藻類・菌类および有機物を食べて生きている。
      その生殖腺（卵巣）は日本では高価な料理として知られている。","label":"うみゆり","summary":"岩場の海底にある棘を持つ丸い海洋動物"}
  animal.seahorse:
    label: 海馬
    summary: 縦向きに泳ぐ小さな魚；雄が幼児を育てる。
    info: 海馬はヒポカムパス属の魚で、背びれを使って垂直方向へ移動します。面白いのは、子供を育てるのは雌ではなく雄である点です。尾を使って海草にくっついており、獲物が通りかかるのを待ちます。
  animal.seal:
    label: ホッキョクグモ
    summary: 魚を狩りながら海水の中で休息を取り、岩場などに休む海洋性哺乳類です。
    info: |-
      {"hint":"海洋の哺乳類で、フィン状肢をもつ岩に横たわる動物（フコイド科）","info":"ホッキョクグモはアトランティックと太平洋沿岸部に生息する無耳尖骨を持つ流線型体躯を持った海産哺乳類である。
      水中だけでなく岩石上でも時間を過ごす。最大深度五百メートルまで潜ることができて半時間以上水底に滞在できるが可能だ。
      汚染や捕獲によって脅かされている。","label":"ホッキョクグモ","summary":"魚を狩りながら海水の中で休息を取り、岩場などに休む海洋性哺乳類"}
  animal.shark:
    label: サメ
    summary: 鋭い歯と水力的に効率的な体を持つ大型の捕食魚。
    info: ホワイトシャークは世界最大の捕食魚であり、6メートル以上の長さに達する。ロレンツィーニ管という器官を使って獲物から発生する電磁場を感じ取る能力を持っている。人間への襲撃は非常にまれだが、サメは海洋生態系において重要な頂点捕食者である。
  animal.shrimp:
    label: '"エビ"'
    summary: '"小型の海生甲殻類であるエビは世界的な人気がある海産品です。"'
    info: |-
      {"hint":"小型で速く泳ぐ甲殻類（ペネイド科やそれに似たもの）","info":"エビは、10対の脚を持つ小さな海水または淡水性の甲殻動物です。\n世界には2千種以上が存在しており、地球上では二番目に人気のある海産物となっています。\n濁りを取る生物と捕食者であり、海洋食物連鎖において重要な役割を持っています。\n多くの種は熱帯沿岸地域コミュニティにとって生活に必要な栄養源でもあります。
      "}
  animal.squid:
    label: '"タコ"'
    summary: 「水を噴出して泳ぐ十腕の頭足類」
    info: |-
      {"hint":"十腕の頭足類軟体動物で、水を噴射して移動する（テウチダ）","info":"タコは八つの触手と二本の捕食用の脚を持つ頭足綱に属します。
      彼らは水中での運動には噴流を使い、クロマトフォアを使って色を変えます。
      巨大なタコであるアルキテューティス種は長さが十三メートル以上になり世界最大級です。
      深海ではクジラとの戦いで皮膚上に痕跡を作ります。"}
  animal.starfish:
    label: スタークラウン
    summary: 失った腕を再生成できる五腕の海洋生物
    info: |-
      {"hint":"五腕のエchinoderマ海底（アステロイデア）","info":"スタークラウンは典型的に5本の腕を持つ海洋棘皮動物です。
      失われた腕全体を再生したり、切断された腕から新しい体を作り出すことができます。
      彼らはカキを開けるために吸盤を使って生きています。
      干潮域から深海帯まで約1,800種以上が存在しています。","label":"スタークラウン","summary":"失った腕を再生成できる五腕の海洋生物"}
  animal.stingray:
    label: レインコ
    summary: 砂地などに潜んでおり、背中に毒のある尖った突起を持つ扁平な海水魚です。
    info: |-
      {"hint":"平らなエイで、尾に毒針がある（ダシテイド科）","info":"レインコはサメの親戚であり、底面での生活のために平面的な円盤状の体を持つ。
      多くの種類では防御用としてお尻が有毒な棘によって装備されている。
      胸びれを波打つように動かして移動する。
      いくつかの種类は電気発生器官を持ち、獲物に対して放電により麻痩させることが可能である。","label":"レインコ","summary":"背中にお尻にある刺を持っている平たい海魚；砂地などの海底に横たわっている。"}
  animal.swordfish:
    label: '"メジナ"'
    summary: 「長くて尖っているような嘴を持っている大型肉食性の海中上層部に住む魚」
    info: "{\"hint\":\"大型で速く、広い海域を泳ぐ魚であり、長い平たい嘴を持つ（学名：Xiphias gladius）\",\"info\":\"メジナは熱帯および亜熱帯の海洋に生息する大きなペラギックな魚です。\r\nその扁平面状の剣のような口先を使って獲物である魚やイカなどを麻痺させるためであって刺すために使うわけではありません。\r\nこれは最も早いスピードを持った魚種の一つであり時速100キロを超える速度が出ます。\r\nまたスポーツフィッシングと食料としても非常に価値が高い魚です。\"}"
  animal.tuna:
    label: マグロ
    summary: 食品産業のために大量捕獲される高速で泳ぐ表層魚
    info: |-
      {"hint":"高速で泳ぐ体が細長い表層魚（サバ）","info":"ブルfinチップは、最大全長3メートル以上、体重700kgを超える世界でもっとも大きなマグロの一種です。
      温血性であり、周囲より高い体温を保つことができます。
      海洋の中で最も速く遊泳する魚類に属し時速70キロを超えます。
      過剰な漁獲により絶滅危惧種となっています。日本市場では一匹数万ドルにもなることがあります。
  animal.walrus:
    label: シロクマ
    summary: 大型の極地方海獣であり、とても大きい犬歯と髭を持っています。
    info: |-
      シロクマは巨大な寒帯の肉食動物で、象牙のような長い歯（角）があり、その長さはメートルを超えます。
      これらの大きな歯は氷上への登攀や雄同士での闘争および階層構造に使われています。また群れを作り非常に社会性があります。
      地球温暖化によりアーティック圏内の彼らが生息する環境である氷地が脅かされています。
  animal.whale:
    label: クジラ
    summary: 地球上で最も大きな動物—空気を呼吸する海洋哺乳類。
    info: ブルーフィンは、地球に存在した最大の動物です。全長は最大で30メートルにもなり、体重は150トンを超えます。エサとなるのは小型の甲殻類であるカイコのみで、これを骨板を通して濾過して摂取します。また、すべての動物の中で最も大きい音を発しています。
