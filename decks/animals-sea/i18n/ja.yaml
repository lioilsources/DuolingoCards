lang: ja
pivot: false
title: 海洋動物
cards:
  animal.crab:
    label: かに
    summary: 甲殻類の十脚目で、硬い外骨格とが集装備し、横へ移動する。
    info: カニはBrachyura亜目の甲殻動物です。硬いキチン質の外皮を持ち、成長のために定期的にこれを脱ぎます（エクディゼ）。特徴的なのは横への動きであり、そのガラスのような鋏足は防御や捕食およびコミュニケーションにも使われます。海だけでなく淡水や陸でも生息しています。
  animal.dolphin:
    label: イルカ
    summary: 群れで生活し、水からジャンプする賢い海洋哺乳類。
    info: イルカはクジラ目ヒゲクジラ科の海生哺乳動物です。高い知能やエコロケーション能力、遊ぶような行動が特徴で、船の波からジャンプしたり、ピーピー鳴いたりクリック音を使ってコミュニケーションをとります。仲間と一緒に「群れ」と呼ばれるグループで暮らしており、クジラとは近縁の関係にあります。
  animal.jellyfish:
    label: クラゲ
    summary: 透明な鐘型の海の動物で、毒のある触手を持っている。
    info: クラゲは脳や心臓、骨を持たない刺胞動物門の海洋生物であり、体の約95％が水である。脈動によってその鐘状の身体を移動させる。触手には麻痺効果を持つ刺胞（ネマトサイト）があり、獲物に作用する。一部の種類はほぼ不死であり、幼生期に戻ることができる。
  animal.octopus:
    label: タコ
    summary: 八つの腕を持つ軟体動物で、色や体の形を変えることができる。
    info: タコは頭足類に属する無脊椎動物です。三つの心臓を持ち、青い血液があります。クロマトフォアを使って肌の色と質感を瞬時に変えることができます。非常に知能が高く、閉じた容器を開けることや迷路を解くこともできます。
  animal.sea_turtle:
    label: 海亀
    summary: 産卵のために岸に戻る大きな海洋爬虫類。
    info: グリーン・タートルは7種の海亀の一つです。メスは、自分自身が孵化した浜に2〜5年ごとに戻ってきて産卵します。成体は草食で、海藻やマリンプランツを食べますが、幼体は雑食性です。
  animal.seahorse:
    label: 海馬
    summary: 縦向きに泳ぐ小さな魚；雄が幼児を育てる。
    info: 海馬はヒポカムパス属の魚で、背びれを使って垂直方向へ移動します。面白いのは、子供を育てるのは雌ではなく雄である点です。尾を使って海草にくっついており、獲物が通りかかるのを待ちます。
  animal.shark:
    label: サメ
    summary: 鋭い歯と水力的に効率的な体を持つ大型の捕食魚。
    info: ホワイトシャークは世界最大の捕食魚であり、6メートル以上の長さに達する。ロレンツィーニ管という器官を使って獲物から発生する電磁場を感じ取る能力を持っている。人間への襲撃は非常にまれだが、サメは海洋生態系において重要な頂点捕食者である。
  animal.whale:
    label: クジラ
    summary: 地球上で最も大きな動物—空気を呼吸する海洋哺乳類。
    info: ブルーフィンは、地球に存在した最大の動物です。全長は最大で30メートルにもなり、体重は150トンを超えます。エサとなるのは小型の甲殻類であるカイコのみで、これを骨板を通して濾過して摂取します。また、すべての動物の中で最も大きい音を発しています。
