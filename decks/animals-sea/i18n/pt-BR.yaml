lang: pt-BR
pivot: false
title: Animais Marinhos
cards:
  animal.crab:
    label: caranguejo
    summary: Crustáceo de dez patas com carapaça dura e garras que se move para os lados.
    info: O caranguejo é um crustáceo pertencente ao subordem Brachyura. Possui uma carapaça dura feita de quitina, que ele descama regularmente (ecdise) para crescer. Seu movimento característico ocorre lateralmente. Suas garras servem tanto para defesa quanto para caça e comunicação. Eles podem viver em oceanos, águas doces ou até mesmo no ambiente terrestre.
  animal.dolphin:
    label: delfim
    summary: Mamífero marinho inteligente que vive em cardumes e salta da água.
    info: O delfim é um mamífero marinho pertencente à família dos cetáceos. É conhecido por sua alta inteligência, capacidade de ecolocalização e comportamento brincalhão – os delfins adoram saltar das ondas de embarcações e se comunicam usando assobios e cliques. Eles vivem em grupos chamados cardumes e são parentes próximos das baleias.
  animal.jellyfish:
    label: medusa
    summary: Animal marinho transparente em forma de sino com braços venenosos.
    info: A medusa é um animal marinho pertencente ao filo Cnidaria que não possui cérebro, coração nem ossos – seu corpo é composto por cerca de 95% água. Ela se move através da contração pulsante de seu corpo em formato de sino. Seus braços contêm células urticantes chamadas cnidoblastos, capazes de paralisar suas presas. Algumas espécies são quase imortais e podem voltar para uma fase juvenil.
  animal.octopus:
    label: lula
    summary: Molusco com oito braços capaz de mudar cor e forma do corpo.
    info: Lulas são animais invertebrados da classe dos cefalópodes. Possuem três corações, sangue azul e podem alterar instantaneamente a cor e a textura da pele usando cromatóforos. São muito inteligentes – conseguem abrir recipientes fechados e resolver labirintos.
  animal.sea_turtle:
    label: Tartaruga-marinha
    summary: Réptil marinho grande que retorna às praias para botar ovos.
    info: A tartaruga-verde é um dos sete tipos de tartarugas marinhas. As fêmeas retornam à praia onde nasceram a cada dois e cinco anos para depositar seus ovos. Indivíduos adultos são herbívoros e se alimentam de algas e ervas marinhas; os filhotes são onívoros.
  animal.seahorse:
    label: peixe-palha
    summary: Pequena ave que nada em posição vertical; o macho carrega os filhotes.
    info: O peixe-palha é um pequeno peixe do gênero Hippocampus que se move na posição vertical usando sua nadadeira dorsal. Uma curiosidade é que são os machos que carregam os filhotes em uma bolsa abdominal, e não as fêmeas. Ele usa sua cauda para se segurar nas algas marinhas enquanto aguarda a passagem de suas presas.
  animal.shark:
    label: Tubarão
    summary: Grande peixe predador com dentes afiados e corpo hidrodinâmico.
    info: O tubarão-branco é o maior predador marinho do mundo e pode atingir mais de seis metros de comprimento. Ele consegue sentir campos elétricos das presas usando os órgãos Ampola de Lorenzini. Apesar da sua reputação, ataques aos seres humanos são extremamente raros; tubarões desempenham um papel fundamental como predadores-chave no ecossistema marinho.
  animal.whale:
    label: baleia azul
    summary: O maior animal da Terra – um mamífero marinho que respira ar.
    info: A baleia azul é o maior animal já conhecido na história da Terra; pode atingir até 30 metros de comprimento e pesar mais de 150 toneladas. Alimenta-se exclusivamente de pequenos crustáceos chamados copépodes, os quais filtra através das placas baleias. Emite os sons mais altos entre todos os animais.
