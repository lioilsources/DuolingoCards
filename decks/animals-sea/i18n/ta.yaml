lang: ta
pivot: false
title: கடல் விலங்குகள்
cards:
  animal.anglerfish:
    label: கடல்கொள்
    summary: முகத்தில் ஒரு அழுக்கு எரிப்பு ஜோடியை ஓட்டும் கூடு உள்ள ஆழ்கடல் மீன்.
    info: "கடல்கொள் தாவரம்(Lophius), 1000 மீற்றருக்குப் பின்வஞ்சி நெசதியில் உயிரிழைக்கின்றன. \nஇதன் இணையிடம் ஒரு அழுக்கு எரிப்பு ஜோடியை ஓட்டும் கூடு உள்ளது\nஅஃது பெண் மற்றும் ஆண் ஐஸ்ஸிங் கொண்ணிகளை ஈர்க்க,\nஆண் மிக சிறியது;\nபெண் கண்டு பிடிக்கும் போது , அது   அதன் மீது பற்றிக் கொண்டு உயிரியல் ரீதியாக ஒன்றிணைகின்றது."
  animal.barnacle:
    label: ஓஸ்ஸில்
    summary: இந்த சிறிய ஹௌட்டோரா குறிப்பாக கடற்கரை கற்களிலும் கப்பல் உடல்களிலும் பொருந்திக் கொள்கின்றது.
    info: செரிரிபீடியா என்றும் அழைக்கப்படும் ஒளி நலவாய் மணற்சேர்த்து உறைத்து விடும் ஓஸ்ஸில் காஃப்டோரங்களின் ஊடாக ஃபிளஞ்ச் ஷூல் ஐ ஏற்றிக் கொண்டு உண்ணும் ஜீவன்கள்.
  animal.beluga_whale:
    label: பெலுகா
    summary: '''ஓழூர் முகப்பு'' மற்றும் ஈர்ப்பு ஏற்பங்கள் கொண்ட ஒரு எளிய வளர்க்'
    info: "பெலுகா வளர்க்(தில்பி நஷட்டேரஸ் அவசனா)அர்த்சியமற்றும் உயர் -ஆர்த்ரிஸ் மண்ணின் ஒரு எளிய , ஈர்ப்பு ஏற்பங்கள் .\nஇதன் ஓழூர் முகப்பு (மீலஞ் )எஃகு ஊசியின் ஐசிளோக்கேஷன் ஃபௌண்ட் ஜெயிழ்கள் \n ஹிஸ்டரிகல் நாவிகர்கள் இதனை 'மீன் கானார்க்' என்று அழைத்தனர்."
  animal.blue_tang:
    label: கானிக்
    summary: '''ஹௌ'' என்ற தொடரில் ''என்னோ'' என்ற பெயரில்'
    info: |-
      கானிக் பச்சைத் துரி(Paracantherus hepatus) எனப்படும் இவற்றின் நிலையங்கள் மலைகளிடை அணைக்குழுமங்களில் உள்ளன,
      இந்திய - ஆசிய வளைகுடா ஏஜிரஸ் ஒரு ஜீவியின்
      அதன் ஓவர் ஸ்கோஃப் ஃபிஷ் ஹூட்டில் ஐஞ்சு ஊசிகள் உள்ளன.
  animal.carp_river:
    label: ஆற்று காப்ர்
    summary: ஓர் ஆற்றில் அல்லது குளத்தில் வாழும் பழக்கமான பழுப்பு நிற கண்ணாடி
    info: "காப்ர் ஆசியாவைத் தன் புறஜந்மமாகக் கொண்டது அலுவடி இருந்து ஐரோப்பாவிற்கு வழக்கமாய் ஏற்றுமதி செய்யப்பட்டது\nஇது ஒரு உள்ளிழிவான எலி ;அஃது ஓர் குழி லீலை மூலம் ஜலத்தை குழப்பலாம் \nஇது ஃபுஸ்ஸின் ஹஷிஞ்ச் சின்னமாகும் , விண்டில் காட்டில் இவை வாழ்க்கை கொண்டுள\nஐரோப்பிய மாற்றங்கள்"
  animal.catfish:
    label: சுமெக்
    summary: '''ஃபூஸ்''(ஹஞ்ஜர்), ஆறுகளின் கீழ் பகுதியில் மறைந்து வாழும்'
    info: "சுமெக் வல்கி ஐரோப்பாவின் மிகப்பெரிய தண்ணீர் நன்றி உள்ள இறைச்சி ; 2 அடி நீளத்தையும் , 100 கிலோ எடையையும் கொண்டுள்ளது .\nஅழகான ' ஃபூஸ்' -ஐ( ஹஞ்ஜர் ) ஒரு ரசாயனம் &amp;amp; ஸ்பரிஷ் / ஓஜை ஏற்படுத்தும் அமைப்பு என பயன்படுத்துகிறது \nஆறுகள்&amp;amp; குளங்களின் கீழ் பகுதியில் வாழ்கின்றது ; இரவு நேரத்தில் பிழைப்பதற்கு பயன்படுகிறது"
  animal.clam:
    label: tridaena gigas
    summary: Tropical Coral Reefs ல் வாழும் world's largest bivalves
    info: "பெரிய கால்நடைகள் (துனி ஜி஗ஸ்), உலகில் மிகவும் பெரிய தண்ணீர் வழிச்சேறு எச்சில் அதன் ஒரு மீட்டர் நீளம் மற்றும் 200 கிராம் எடையோடு\nஅது photosynthetic algae( zooxanthella ) ஐ ஊடுருவி coral reef ன் surface membrane -இல் ஓர் mutualistic relationshipஐ ஏற்படுத்துகிறது \nஆயிரம் ஆண்டுகள் வரை வாழ முடியும்,\npotaphe களை பிடிக்கும் கதை ஒரு myth ; தண்ணீர் வழிச்சேறு மிக மெதுவாக மூடப்படுகிறது"
  animal.clown_triggerfish:
    label: கிளாவ் குறி
    summary: '''ஓரஞ்ச்'', ''நீலம்'','' வெள்ளை'' என்ற நிழல்களை கொண்ட ஒரு வளைகுடாத் தண்ணீர் மீன்'
    info: "கிளாவ் குறி மீன் 'பல்லஸ்டோயடச் பர்சிஸ்னியம்' என்றழைக்கப்படும் ஒரு வளைகுடாத் தண்ணீர் நெடுஞ்ஜொலை அதன் உருவம் இருந்து ஏற்படும் ஓர் அற்புதமான ரூபம்\nஇது கடினமான கரை மற்றும் முட்டைகளை நொறுக்க தன்னிலையான பற்களை கொண்டுள்ளது \nஅதன் முதல் தொடர்க்குறி இரண்டாவது தொடர்க்குறியை தடுக்கும் போஜனம்(எஃகு) ஐ போல செயல்படுகிறது,\nஇது குங்குமப்பூச்சியின் காலத்தில் தண்ணீரில் நீந்தும் மனிதர்களுடன் கோபம் காட்டும்"
  animal.clownfish:
    label: களாவு கண்ணியை
    summary: ஓரஞ்ச் - வெள்ளை நிற மீன் , ஹைட்ரா மௌத் ஆன்களில் வாழும்
    info: |-
      களாவு கண்ணியைத் தனி மரபினம்(அம்பிஃப்ரயோனிநா)ச் சேற்றில் வடிவழகான ஆல்டர்ஸ் உள்ள ஒரு அஸ்திரீ எஃபிஷ் ஐ ஏற்றுகிறது;
      இது ஓர் ஊடுருவியாக ஜூஜிங் செய்யும் ;
      எல்லா களாவு கண்ணியைத் தனி மரபினம்(அம்பிஃப்ரயோனிநா)-ஐயும் ஆண்களாக பிறக்கின்றன;
  animal.crab:
    label: கிரப்
    summary: அட்டை மற்றும் கால்களுடன் பசி நோய் வழியாக செல்லும் ஒரு தசத்துவ உணவு அமைப்பு.
    info: கிரப் என்பது பிரஞ்சியூரா இன்ஃபிராராடு கொண்ட ஒரு காரிஸ் ஆகும். இது ஒரு கடினமான் கிளைடின் கீலை கொண்டுள்ளது, இதை நியங்களில் தொடர்ந்து தொடுவதன் மூலம் (எக்கிடிசிஸ்) வளர முடியும். இது தனிப்பட்ட வகையில் பக்கவாட்டில் நகர்கிறது. கால்கள் தாக்குதல், பிடித்தல் மற்றும் தொடர்பு ஏற்படுத்துவதற்கு பயன்படுகின்றன. இது கடலில், குளிர்ந்த தண்ணீரில் அல்லது நிலத்தில் வாழும்.
  animal.dolphin:
    label: டெல்பின்
    summary: குழந்தை மனப்பாங்குள்ள கடல் விலங்கு அதன் சமூகங்களில் உயிர்வாழ்கிறது.
    info: டெல்பின் ஒரு கடற்பசி விலங்கு எஃகு குடும்பத்தைச் சேர்ந்தது. அதன் பொறுப்புணர்வு, ஒலியிடல் திறன் மற்றும் விளையாட்டு நடவடிக்கைகளுக்கு ஏற்ற போக்கு ஆகியவை புகழ் பெற்றவை - டெல்பின்கள் கப்பல்களின் தண்ணீரிலிருந்து குதிக்க விரும்புகின்றன மற்றும் குறிப்பிட்ட ஓசைகள் மற்றும் குறிப்பிட்ட ஒலிகளை உபயோகித்து தொடர்பு கொள்கின்றன. அவை 'ஹெஜ்னா' என்று அழைக்கப்படும் குழுக்களில் வாழ்கின்றன மற்றும் வல்ஜிப்ஸ் என்ற விலங்குகளுடன் உறவு போலவே உள்ளன.
  animal.dugong:
    label: இஸ்சினொ
    summary: அபிஸ் என்ற வகை அல்ஃபாலங்
    info: டிக்டான் இலகுரையானது மணலி பசியற்றவளம் ஆஃப்ரீக்காவில் உள்ள ஒரு தழும்பு நோய்.
  animal.eel:
    label: ஓர் / முரேனா
    summary: கடற்குட்டை குறுக்கே நகரும் ஒரு பாம்பு போன்ற மீன்.
    info: |-
      முரேனா எலியண்ட் கடற்பயணி மதக்குழுவில் உள்ள ஒரு நீச்சல் வஞ்சகம் ஆகும்
      இது தன்னுடைய அஸ்திரபாஹிற்களில் ஏதாவது ஓர் ஊசியோடு தன்னை மறைத்து கொள்கிறது,
      அது ஐரோப்பிய ஹூஃஆர்( Anguillal anguillae ) ஸ்பெக்ஷிஃஎஸ் ஜீனஸ் ஆகும்.
  animal.flying_fish:
    label: ஃபிளைஇங்
    summary: ஓசனியின் மூட்டிற்கு மேல் ஹௌட்ஸ் மூலம் பறக்கும் ஒரு குறிப்பிட்ட வகை.
    info: '"பறக்கும் மீனினால் நாடு" என அழைக்கப்படும் வர்ஜீஸ் இதன் ஒருவகையானது, தண்ணீரிலிருந்து சளசளவென உயர்ந்து ஏரி ஊர்வன போல ஓடும் Exocoetidae ஐச் சேர்ந்த ஒரு ஃபிஷ்.'
  animal.frogfish:
    label: கடல் மீனிலாம்புசி
    summary: '''ஓர் ஆடு'' போல தோற்றமளிக்கும்'
    info: |-
      கடல் மீனிலாம்புசி(அண்டனரியஸ்), அதன் கவர்ச்சி தழப்பற்ற நிழலின் உயிரியல் வளைவில் ஒரு இலகுரக ஆழிப்படை எஃகு ஏற்பாடு ஆகும்
      இதன் கொம்பு ஓர் 'ஆடு' போல தோற்றமளிக்கின்றது,
      எதிரிகளை கவரும் திண்டஞ்ஜங்களை இது கூட உண்ண முடியும்
  animal.giant_squid:
    label: ஓஹியஞ்சுவன்
    summary: '''எகிழோபௌ'' என்ற பெரிய கால்சுவன் ''ஆர்ச்சிடெயுத்திஸ் டக்ஸ்'' என்ற இனத்தை சேர்ந்தது'
    info: "பெரிய கால்சுவன்(ஆச்ரி‍த்திஉட்டிஸ் மற்றும் அகஸ்ஜின்) என்பவையானது நீண்ணளவில் 13 மீட்டருக்கு வழக்கமாக இருக்கும் ஒரு ஏஜிஷ்டோபஸ் ஆகும்\nஇவற்றின் கண்கள் 25cm -ஐ கொண்டுள்ளது \nஅது ஓஹியஞ்சுவன் ஐ உண்ணும் ஹூஃப் ஃபிஷ் களின் முக்கிய உணவாக உள்ளது"
  animal.hammerhead_shark:
    label: கிளேட்டர் ஷார்கு
    summary: '''T''-ஆக வடிவமைக்கப்பட்ட ஹெட்'
    info: |-
      கிளேட்டர் ஷார்கு எனப்படும் Sphyrna sp., 'T' -வடிவத்தில் மலையளவு நீண்ணிய சற்றுச்
      அழகிய அல்ஃபாஃபோரி(Cephalofoil), ஒரு ஆற்ரின் உறுப்புகள்,
      இதன் ஊடாக ஓர் ஏற்றம் கண்டறிய முடியும்.
  animal.horseshoe_crab:
    label: பொட்காசிச்
    summary: 450 மில்லியன் ஆண்டுகளுக்கு முன் தோன்றிய பழங்கால பௌஹ்னிழிட்டிக்
    info: பொட்காசிச் எனும் Limulus Polyphemos -க்குரியது ,இவற்றின் வயது தோலி மண்டலத்தில் 450 பிங்கள் ஆண்டுகள் .அவை நிஜ இறஞ்சிகளுடன் உறவு அல்ல ; ஒழுஷ்ணாஸ்ருஷ்டிகளுடன் ஏறக்குறைய ஐந்து ஆண்டுகள் ஓய்வு இல்லாமல்   பூஜ்ஸ்ஹிள் ஃபீட்டிங் மாற்றங்கள் இல்லாமல் உள்ளன. அவை பச்சை இரத்தம் கொண்டுள்ளன, இது ஒரு தனித்துவமான பொருள்(coagulant )ஐக் கொண்டுள்ளது., மருந்துகள் மற்றும் தடுப்பூசிகளின் பாதுகாப்பு சோதனைக்கு பயன்படுத்தப்படுகின்றன. ஒவ்வொரு கோடைக்காலத்திலும் இவை கடற்கரைக்கு குடும்பமாக பயணிக்கின்றன, மாற்று பறவைகளுக்கு முக்கிய உணவாக உள்ளது.
  animal.jellyfish:
    label: மீட்டஸ்
    summary: நச்சு கைகளில் ஒரு மணி வடிவத்திலான புலப்படும் கடற்பயணி.
    info: மீட்டஸ் என்பது ஞாலத்தின் உறவுகளில் இருந்து அழுத்தமற்ற தசைகள், இதயம் அல்லது எலும்புகள் இல்லாத ஒரு கடற்பயணியாகும் - இதன் உடலில் 95% தண்ணீர் ஆகும். இது மணி வடிவிலான உடலின் ஊடுறுப்புகளின் மூலம் நகர்கிறது. இதன் கைகள் நச்சு செல்கள் (நோமாடோசிஸ்ட்டு) ஐக் கொண்டுள்ளன, இவை பிடிக்கப்பட்ட உணவை நொறுக்கும்.
  animal.lionfish:
    label: குரூட்டோபாஸ்
    summary: ஓர் ஐம்ஸ்ஃ ஹீல் ஷார்க் ஆகும்.
    info: குரூட்டோபாஸ் சிங் ஒரு Pterois குழுவில் உள்ளதும், அசுர்பி நன்னல் தற்பொழியில் இயங்கும் வண்ணம் மஞ்ஜள் - ஈர்ப்பு ரெஃப் என்றும் ஏற்படுத்தும் ஓர் ஐம்ஸ்ஃ ஹீல் ஷார்க் ஆகும்.இதன் விழுத்து மிகவும் வலியை உண்டாக்கும் ; ஆனால் , இது வாழ்வை மிகவும் பாதிக்கும் நிலை மிக குறைவாக உள்ளது .அது கரிபியன் மற்றும் மத்திய கடலில் புகுந்துள்ளது ; அங்குள்ள இயற்கை மீன்களை குறைக்கிறது .ஆரம்ப குறியிடப்பட்ட பகுதிகளில் இல்லாமல் இதன் இயற்கை பாதகம் இல்லை.
  animal.lobster:
    label: humer
    summary: கைகள் கொண்ட பெரிய கடல் ஜீவிகள் ; சமைத்தால் சிவப்பு நிறமாகி , வாழ்வது நீல பச்சை நிறம்
    info: |-
      அட்லாண்டிக் ஹூமருகள் நப்ரோஃபிதி என்ற பறவையினத்தில் உள்ள ஒரு மலச்சிய வழிபங்கு ஆகும், இதன் அளவு 60 செ.மீ.ஐ விஞ்சுகிறது
      இது ஏறத்தாழ ஐம்பது ஆண்டுகள் வாழக்கூடியது,
      ஹூமர் ஓர் ஊட்டமான கடல் உணவு;
      humers களுடன் வணிகம் ஒரு பில்லியன் ஃபிஸ் ஆகும்.
  animal.manatee:
    label: Dugong/Kapustyakku
    summary: ஓர் உணவு எடுக்கும் ஏஜன்ஸ்
    info: "காபுஸ்ட் நியான்(மேனடி), கரிபின், ஃபிளாரிதாவும் ஆஃப்ரிக்காவிலுள்ள மலையற்ற சூழத்தில் வசிக்கும் ஒரு உணவு எடுக்கும் ஏஜன்ஸ் அது ஜலத்தில் ஓர் ஊர்ஜம் ஐ ஹோம் ஷீல் செய்கின்றது\nஇது கடலில் உள்ள புல் மட்டுமே உண்ணும் \nஅது மிக மெதுவாக நகர்கின்றது (3 - 4km/hr)\nஆனால் ஞான் கௌண்ட் செய்ய வேண்டும்"
  animal.manta_ray:
    label: மாண்டா
    summary: ஓசன் மேல் பகுதியில் பிளஞ்சனை கொடுக்கும் பெரிய மின்சுறளி
    info: |-
      மாண்டா கடல் மின்சுறளி பரவைகளில் உயரத்திற்குச் சிந்தனைப் பழக்கம் வாய்ந்த இனமாகும், அதன் ஆஃப்ஃஆஃப் எடையானது 2000 கிராம் ஐ ஒட்டும் ஏழு மீட்டர் ஆகும்
      அது ஓட்டும் ஸ்஥லத்தில் ஜல ஊடு கோட்டைகள் மூலம் பிளஞ்சனை கொடுக்கின்றது,
      இது யாவும் விஷம் இல்லாத குறுக்கு விழிங்களை கொண்டுள்ளது;
      மனிதனுக்கு ஹானி இல்லை.
  animal.mussel:
    label: Mussels
    summary: அல்ஃபங்களில் கற்களின் மீது குவிந்து காணப்படும்
    info: சிலாவுடன் போலி தண்டம்(byssus)களால் ஒரு கற்றையின் மீது நிசப்யமாக இணைக்கப்படும் அழுக்கு வஸ்துக்களை உறிஞ்சும் ஜெர்ஸி எஃப்ரைட்ஸ் ஐ ஏற்று ஓர் ஊட்டச்சத்து வளமான உணவாக கருதப்படும்
  animal.narwhal:
    label: நர்வல்
    summary: ஓர் ஆற்றைகள் கடினமான ஆற்றைகள்
    info: "நர்வல் ஒரு கடினமான ஆற்றைகள்(அதன் சுழி பயணம் Monodons monoceros),இவை அசோபியா மட்டும் தஞ்சம் எடுக்கும் .\nஆண்கள் இரண்டு உண்ணும் , ஏனெனில் ஓர் ஊசி - ரூப ஃபீட்ஸ் \nஎஃபெக்டிள் ஐஸ்ஷெல்ஜ் மீது நடைபெறும்"
  animal.nautilus:
    label: நௌட்டிலஸ்
    summary: தலைகளத்தில் ஐரோப்பிய ஸ்பைரல் ஷெல் - ஡ைனோசர் காலத்தில் இருந்து வாழ்ந்து வருகின்றது
    info: |-
      நௌட்டிலஸ் ஒரு பண்பற்ற தலைகளம் ஆனது, சுழி வடிவப் பசூவின் மீது காணப்படுகின்றது, இயற்கையாகவே 400 மில்லியன் ஆண்டுகளாக அதே உருவில் எளிதாக வாழ்கின்றது
      இங்கு ஓர் ஏரிருப்பு ஊடுருவும் குழல் கோட்டை கொண்டுள்ளது;
      நௌட்டிலஸ் ஹீலியம் குழல் கொண்டு தன்னை நிலை நிறுத்துகின்றது,
      அனைத்து தலைகளத்தின் கண்ணாடிகள் இல்லாமல்(ஃபின்ஃபோ) ஜோடிக்கப்பட்டுள்ளது
  animal.octopus:
    label: செப்டாஃப்
    summary: மூன்று இதயங்கள், நீலக் கровினை உடையது; தரையில் வண்ணமும் மற்புவும் சிரமமின்றி மாற்றியமைக்கும்.
    info: இது ஒரு அழுத்தமிலா உயிரினம், எட்டு கைகள் கொண்ட மூளை நோக்கும் விழிகள் கொண்டது. இது மிகவும் திறமையானது - மூடப்பட்ட கொள்ளைகளை திறக்க முடியும் மற்றும் குழிகளை தீர்க்க முடியும்.
  animal.orca:
    label: கொசாட்கா
    summary: ஓசனின் கருப்பும் வெள்ளையும் முன்னோடி பிழைப்பாளர்
    info: |-
      கொசாட்கா திரும்பி ஆனது மரபணுவள் இல்லாத வழியின் ஒரு சிறப்புயிரினமாகும் அது உலகின் நற்குறிப்புகளிடையே எளிதாக ஏற்றுக்கொள்ளப்படும் ஓர் உயிரினமாகும்
      அவை ஒருங்கிணைஞ்ச குழுக்களில்(இனங்களில் ) பிடித்து கொள்கின்றன ; ஒவ்வோர் இனமும் தனித்துவமான பிடித்து கூட்டங்களை உருவாக்குகின்றன
      ஆஃப் -ஸ்டீரிஜ் , ஸீவௌல்ஃ ஐ ஹைஜெக் செய்யும் போது குறிப்பிட்ட இனங்களில் இருந்து வெவ்வேறு குறிப்புகளின் தொடர்புடைய குறிப்புகளை பேசுகின்றன
  animal.oyster:
    label: ஓஸ்ட்ரா
    summary: எல்லா நீரையும் சுறாமணி கழிவுபடுத்தும் ; கஞ்சிழிகள் , சுவையான உணவு
    info: "கடல் நீரிலுள்ளதைச் சுறாமணி கழிவுபடுத்துவன; ஒரு பயறு மட்டும் அன்று 200 இலிருஷ்யஸ் என்னும் ஆற்றல் உள்ளது\nஇதன் ஏதோ ஓர் இனம் ஜூம் ஊடு கையால் கஞ்சிழிகளை உருவாக்கும் \nஅஃதாவது பௌஹ்ஹ்ஸ்(Pahus) ஐ போல\nஆர் என்னும் எழுத்து கொண்ட மங்கள் மாதங்களில் பயறு உணவு பரம்பல்"
  animal.piranha:
    label: பிரான்னா
    summary: அமெரிக்காவில் உள்ள ஒரு துறையிடத்திற்கு நீர் வழியில் எஸ்ஸிஃஆம்
    info: பிரான்னா செருவேணோஃப் பறி அமசான் கடலில் உள்ள ஒரு முக்கிய துறையிடத்திற்கு நீர் வழியில் எஸ்ஸிஃஆம் ஐஎஸ் ஏஜிஷ் ஜொஹன் ஹிண்டு ஓர் ஆபத்தான பூச்சி ஆகும்.
  animal.puffer_fish:
    label: ஃபுகு மீன்
    summary: அதன் உடலை குழல் கொண்ட பஞ்சு போல் ஫ிழுக்கும் மீன்
    info: |-
      ஃபுகு என்பது டெடிராவண்டிஸ் குடும்பத்தில் உள்ள மீன்களின் ஒரு வகையாகும், இவற்றில் நச்சு அல்லது காற்றால் ஓட்டி உடலை குழல் கொண்ட பஞ்சு போல் ஃபியூஸ் செய்ய முடியும்
      இது Tetrodoxinஐ கொண்டுள்ளது - இது ஏறக்குறைய இயற்கையான ஜூனியர் ஹௌஸ்மேன் ; கல்லீரல் திசுக்கள் மற்றும் குரோனாட்டிக் குறிப்புகள் இறப்பு ஐ கொண்டுள்ளது
      ஜப்பானில் , ஷுகு ஒரு சிறப்பு உணவாகும்;
      ஆஹார தயாரிப்பாளர்கள் ஒரு குறிப்பிட்ட அனுமதியை பெற வேண்டும்
  animal.salmon:
    label: லோசஸ்
    summary: கடலிலிருந்து ஆறுகளுக்கு இனப்பெருக்கத்திற்காக செல்லும் பெரிய லோசஸ்
    info: "லோசஸ் ஒரு ஆனாடிர்மஸ் பறவி ; கடலில் வளர்ந்தபின் , அதன் இயக்கம் சீராக உள்ள ஏரியாக ஓடும் .\nஅணை எழும்பும் பொழுது லோசஸ் தனது நிறத்தை தஞ்சம் -இரும்பு நிழலிலிருந்து ஜூஜ் டிஷ் ஐ குறிக்கும் கருப்பு நிறமாக மாற்றுகிறது \nஆஃபிஸ் ஹௌஸ் ஃபிஷ் பெரிய மீன்கள்(ஓன்கோரஹிண்சஸ் )என்று அழைக்கப்படுகின்றன,\nஇவை தங்கள் இனத்தை பெருக்கும் பொழுது இறந்து விடுகின்றன;\nஇவை குழம்பிப்போகும் பொழுது இயற்கை மர வாழ்வியல் சூழலுடன் பொருந்தும்"
  animal.sea_anemone:
    label: Sasanka Moresha
    summary: ஜீலி செல்கள் கொண்ட கடல் உயிரி
    info: "கடல் அன்னாசி ஒரு விஷமூட்டும் கண்ணாடி உயிரியள்(ஸீனிதாரிஆ), பறவைபோல் இது செழுமையான நிறமுடன் மொட்டுகளை ஏற்றிக் கடல் எஃப்ஃபெக்ஸை உருவாக்குகிறது\nஇதன் லஞ்சங்கள் ஜெல்லிஹௌஸ் செல்கள் (Nematocytes)\nஅதன் ஓட்டக்காரிள்களை மயக்கும் \nஇது ஐம்பது ஆண்டுகள் வாழ்கிறது"
  animal.sea_cucumber:
    label: சமூஷ்
    summary: '''ஓர்ஜஞிக் துருவினை உண்ணும் ஒரு கடல் உயிரினம்.'
    info: |-
      சமூஷ் என்பவர் கடலினுள் உயிரற்றத் தண்ணி மக்கள் - ஹோலொத்யூரைடா வகுப்பில் அடங்கும்; இவர்கள் நீரிழை செழுமையான ஒரு ஸ்ட்ரீம் ஐ ஃபிளெக்டர் ஏஜெண்ட் ஆக பயன்படுத்துகின்றனர்
      அவர்கள் ஓர்ஜஞிக் துருவினை உண்ணுகின்றனர்,
      இவர்கள் தங்கள் குடல் அல்லது திரவத்தை துரிதமாக வெளியேற்றுகின்றனர்;
      ஆஸியாவில் 'ஹௌ' என்று அழைக்கப்படும்.
  animal.sea_lion:
    label: லக்டன்
    summary: '''ஓதாரி'', ஹௌட்ஸ் ஃபிளைபெர்டுகளில் ஒன்று.'
    info: |-
      லக்டன் காலிபோர்னியாவுடன் Otariidae எனப்படும் 'ஓதாரி'யில் மிகச் சிறந்த உண்ணை ஆற்றும் வளைவு இழை ஒன்று.
      இது ஓதாரி அல்லது "அஃதாரி" ஐச் சொல்லும் ஏனைய ஜீவராஸிகளிருந்து வேறுபட்டு, வெளிப்புற காதுகளை கூட கொண்டுள்ளது மற்றும் நான்கு கைகளில் நடக்க முடியும்
      இது மிகவும் ஞானம் கொண்டது; பொழுதுபோக்கு தொழிலில் பல சிக்ஷணங்களை கற்கின்றது.
  animal.sea_otter:
    label: ஆஃப்ஹிஃபிளா லூட்ரிஷ
    summary: அஹிஜிரா லூட்ரிஸ் ஓடை ஏஜின்
    info: மார்க் ஒடெரினுகள் மற்றும் பலவற்ரது வழி தனிச் சீசனில் உயிரணுக்கள் இப்போது அஸ்ட்ரிஸ் என்று நியங்கள்.
  animal.sea_slug:
    label: Placophore/Naked-gill
    summary: |-
      ஆழியில் இருக்கும் ஒரு முனையற்ற
      கடல் முனை.
    info: |-
      நகோஜ்பிரசி கடல் முனையற்ற சரிவளவுத் தமிழ் உண்ணுப்பாஸ்டில் இருக்கின்றன.
      அவை ஆழியில் ஒரு அற்புதமான எண்ணிகையில் ஐரொன் ஜீவன்களில்
      இருக்கின்றன;
      எஃகு ஏற்றுதலுக்கு ஓர் எச்சரிக்கையாக இருக்கின்றன.
  animal.sea_turtle:
    label: கடல் நாგரிகம்
    summary: வளைகுடாப்பகுதி திரும்பி முட்டை இடுவதற்கான ஒரு பெரிய கடல் உயிரினம்.
    info: சிலிற்சிவப்பு கடல் நாகரிகம் ஏழு கடல் நாகரிக வகைகளில் ஒன்று. எண்ணூர் அல்லது ஐந்து ஆண்டுகளுக்கு ஒருமுறை தான் பிறந்த கடற்கரைக்குத் திரும்பி முட்டை இடுகின்றன. வயது வந்தவை தாவரச் சாப்பிடுபவையும், கடல் புல் மற்றும் மொட்டைகளை உண்ணும்; குட்டிகள் எல்லா வகையும் உண்ணும்.
  animal.sea_urchin:
    label: செரின்டா
    summary: '''இசிசிலோ'' வழிமுறையில் குறிப்பிடப்பட்ட ஒரு குறிப்பிட்ட கலவி தண்ணீர் ஏசினொஸ்'
    info: "செரின்டா எனப் படும் கலவி தண்ணீர் உயிரியகள் 'இசிசிலோ' வழிமுறையில் அதன் நகஞ்சிற்றுண்டிகள் இயங்கக்கூடிய ஒரு ஏசினொஸ் ஐ கொண்டுள்ளது\nஅஃது ஓட்ஸிழிஷ் ஃபிளௌரா, ஹைஃபா மற்றும் கார்பனிக் ஜீவச் சேதப்படுத்தப்பட்ட மூலப்பொருட்களை உண்ணும் \nஜெனோட்டிக்(எண்), ஒரு ஜப்பானிய சிறப்பு உணவாக கருதப்படுகின்றது"
  animal.seahorse:
    label: கடல்குதிரை
    summary: சிறிய நேர்த்தி மீன்; ஆண் பாலூற்றும்.
    info: கடல்குதிரை எனப்படும் ஒரு சிறிய நேர்த்தி வளைவு மீன், அதன் உயர் நிலையில் நகர்த்துவதற்கு தலைமுனை கால்களை பயன்படுத்துகின்றது. குழந்தைகளை ஆண் மீன் மட்டுமே பாதுகாக்கின்றது என்பது ஒரு சுவாரஸ்யமான தகவலாகும். அதன் ஓசையோடு கடல் புறங்களை பற்றிக் கொண்டு பிணைந்து கொண்டு உணவு கிடைக்கும் வரை காத்திருக்கின்றது.
  animal.seal:
    label: ஹூட்ஸ்
    summary: அட்லாண்டிக் மற்றும் பசிஃபிக் ஓரங்களில் ஜீவிக்கும் கடல் விஷப்பு ஐரோப்பிள்.
    info: கடல் பறவையில்லாதும் கண்ணி இன்றியும் வளர்ந்த மெழுச்சியான உடலோடு ஹொஸிடாஃப் என்னும் குடும்பத்தில் ஒரு ஏரோடைனஞ்சல் அமைப்பு கொண்ட கடல் விழுது உயிரினம்.
  animal.shark:
    label: கால்சன்
    summary: அதிக வேட்டையாளர் மீனுடன் நச்சு பற்றி உள்ளது.
    info: பெரிய தொண்டை அமைப்பு கொண்ட ஒரு பெரிய வேட்டையாளர் மீன் என அழைக்கப்படும் கால்சன், உலகில் மிகப்பெரிய வேட்டையாளர் மீனாகும்; இது ஆறு மீட்டர் நீளம் வரை அடையும். இது லோரன்ஸினி குவியல்கள் மூலம் பிடிக்கப்படும் மின்புலங்களை உணரும் திறன் கொண்டுள்ளது. மனிதர்கள் மீது தாக்குதல் மிகவும் அரிதானாலும், கால்சன்கள் கடல் ஏகோஸிஸ்டத்தின் முக்கிய வேட்டையாளர்களாகும்.
  animal.shrimp:
    label: கொரில்
    summary: ஐரோப்பிளஸ் Penaeidae அல்லது ஏதேனும் ஒரு இனத்தைச் சேர்ந்த ஒரு கடல் கொரில்.
    info: |-
      கொரில்கள் எனப்படும் மாலி வழியாகச் செயற்றவைத் தண்ணீர் அல்லது உப்பு நீரின் ஒரு இனமாகும்
      இவை ஐரோப்பிளஸ் Penaeidae அல்லது ஏதேனும் ஒரு இனத்தைச் சேர்ந்தவை,
      அதிர்ஷ்டமாக ஓடும் ஜூஃஆல்ஸ் ஹௌஸ் ஃபிழ்ஸ் மற்றும் பிரிஞ்சர்ஸ் ஆகியவை கடலின் உணவு சங்கிலியில் முக்கிய பங்கு வகிக்கின்றன.
  animal.squid:
    label: எஃகு
    summary: இருபது கூடுதல் ஐந்து கைகள் கொண்ட காற்றழகத்தவர்
    info: |-
      ஓலிஹ்னே எனப்படும் காற்றழகத்தவர் 4+6=10 மணி நீச்சல் வளையங்களைக் கொண்டவர்
      அவர்கள் அலோஹஞ்ஜில் உள்ள ஒரு ஆஸ்ரயத்தில் ஓடி ஏறும் திண்மையான குறியீடுகளை விட்டுச் செல்கின்றனர்
  animal.starfish:
    label: ஆஸ்டெரா
    summary: இழக்கப்பட்ட கீலங்களை மீள் உருவாக்கும் ஐஞ்சு கீலம் கொண்ட கடல் உயிரினம்.
    info: |-
      நட்சத் திரளைகள் குழல் மற்றும் பசி இரண்டனையும் உபயோகித்து அவைகளின் வாஸ்தவியை ஒட்டில் எடுத்து ஆட்ஜிஸ் ஐ ஊட்டும் ஏழூறு கங்கணம் கொண்ட கடல் உயிரினமாகும்
      அவைகள் ஓர் முழு இழக்கப்பட்ட கீலம் அல்லது ஒரு அறுப்பு கீலத்திலிருந்து புதிய உடலை உருவாக்கும்.
  animal.stingray:
    label: ரெய்னாக்
    summary: ஓட்டம் கொண்ட கடல் மீன்
    info: ரெய்னாக் ஒற்றைப்படுத்திய கலவி வளைமண்டலத்தில் உள்ள சமனிழந்த மூச்சு இழைகள் அடங்கிய எஃகு ரீதியான ஜோடிகள் ஏற்படுத்தும் ஓட்டம்.
  animal.swordfish:
    label: மீச்சன்
    summary: ஓட்டம் கொண்ட பெரிய நீர்த்தொழில் உயிரினம்
    info: |-
      மீச்சன் வளரியாகும் ஒருவகையடி கணலற்ற மத்ஸரப் பெரிய நீர்த்தொழில் உயிரினமாகும்
      அதன் இறுதியில் அஃது எளிதாக ஓட்டம் ஏற்படுத்தும் ஐஸ்ஹிஃபோன்(ஐஸ்ஷிளாடிங்) பூஜ்ஜியஞ் செய்யும்
  animal.tuna:
    label: துன்னாக்
    summary: ஆஹார தொழிலில் பெரிய அளவில் பயன்படுத்தப்படும் வேகமான பெலஜிக்
    info: |-
      பெரும் திராட்சத் தனி வகையானது 3 மீற்றருகளுக்குச் சிலவற்பல அண்டும் நேரத்தின் உழவு எடையியல் 700 கிழி ஒரு ஓட்டும்
      இது ஏனோடொர்மிங்(அதிக வெப்பம்)
      ஓசனிஸ் ஐஸ் ஃபிஷ் ஹைப்போ ஜிஞ்சிள் - அதிக வெப்பம்
  animal.walrus:
    label: மரௌ
    summary: அர்டிஷ் என்னும் ஏரியாவில் ஓடும் ஜொலிஞ்சிள்.
    info: மரூங்கு ஒடிபனஸ் ரோசி மற்றும் அதன் நீளம் சகபலவழியாக வளரும் இயல்புடைய தண்ணெ உயில்.
  animal.whale:
    label: வெல்ரிபா
    summary: சுற்றுப்பயணம் செய்யும் கடல் மஞ்சள் வாழிடத்தில் உள்ள நீரில் இனிமையாக அலசும் ஒரு விழுந்து எடுக்கும் ஜீவி.
    info: வெல்ரிபா மோட்டா பூமியின் மிகப்பெரிய விலங்காகும்; இது 30 மீட்டர் நீளம் மற்றும் 150 டன் எடை வரை வளரும். இது மட்டுமே கிரில் என அழைக்கப்படும் சிறிய கால்நடைகளை ஊடுருவி உணவு பெறும். இது அனைத்து உயிரினங்களிலும் மிக ஓசையான ஒலிகளை உருவாக்கும்.
