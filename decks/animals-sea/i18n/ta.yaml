lang: ta
pivot: false
title: கடல் விலங்குகள்
cards:
  animal.crab:
    label: கிரப்
    summary: அட்டை மற்றும் கால்களுடன் பசி நோய் வழியாக செல்லும் ஒரு தசத்துவ உணவு அமைப்பு.
    info: கிரப் என்பது பிரஞ்சியூரா இன்ஃபிராராடு கொண்ட ஒரு காரிஸ் ஆகும். இது ஒரு கடினமான் கிளைடின் கீலை கொண்டுள்ளது, இதை நியங்களில் தொடர்ந்து தொடுவதன் மூலம் (எக்கிடிசிஸ்) வளர முடியும். இது தனிப்பட்ட வகையில் பக்கவாட்டில் நகர்கிறது. கால்கள் தாக்குதல், பிடித்தல் மற்றும் தொடர்பு ஏற்படுத்துவதற்கு பயன்படுகின்றன. இது கடலில், குளிர்ந்த தண்ணீரில் அல்லது நிலத்தில் வாழும்.
  animal.dolphin:
    label: டெல்பின்
    summary: குழந்தை மனப்பாங்குள்ள கடல் விலங்கு அதன் சமூகங்களில் உயிர்வாழ்கிறது.
    info: டெல்பின் ஒரு கடற்பசி விலங்கு எஃகு குடும்பத்தைச் சேர்ந்தது. அதன் பொறுப்புணர்வு, ஒலியிடல் திறன் மற்றும் விளையாட்டு நடவடிக்கைகளுக்கு ஏற்ற போக்கு ஆகியவை புகழ் பெற்றவை - டெல்பின்கள் கப்பல்களின் தண்ணீரிலிருந்து குதிக்க விரும்புகின்றன மற்றும் குறிப்பிட்ட ஓசைகள் மற்றும் குறிப்பிட்ட ஒலிகளை உபயோகித்து தொடர்பு கொள்கின்றன. அவை 'ஹெஜ்னா' என்று அழைக்கப்படும் குழுக்களில் வாழ்கின்றன மற்றும் வல்ஜிப்ஸ் என்ற விலங்குகளுடன் உறவு போலவே உள்ளன.
  animal.jellyfish:
    label: மீட்டஸ்
    summary: நச்சு கைகளில் ஒரு மணி வடிவத்திலான புலப்படும் கடற்பயணி.
    info: மீட்டஸ் என்பது ஞாலத்தின் உறவுகளில் இருந்து அழுத்தமற்ற தசைகள், இதயம் அல்லது எலும்புகள் இல்லாத ஒரு கடற்பயணியாகும் - இதன் உடலில் 95% தண்ணீர் ஆகும். இது மணி வடிவிலான உடலின் ஊடுறுப்புகளின் மூலம் நகர்கிறது. இதன் கைகள் நச்சு செல்கள் (நோமாடோசிஸ்ட்டு) ஐக் கொண்டுள்ளன, இவை பிடிக்கப்பட்ட உணவை நொறுக்கும்.
  animal.octopus:
    label: செப்டாஃப்
    summary: மூன்று இதயங்கள், நீலக் கровினை உடையது; தரையில் வண்ணமும் மற்புவும் சிரமமின்றி மாற்றியமைக்கும்.
    info: இது ஒரு அழுத்தமிலா உயிரினம், எட்டு கைகள் கொண்ட மூளை நோக்கும் விழிகள் கொண்டது. இது மிகவும் திறமையானது - மூடப்பட்ட கொள்ளைகளை திறக்க முடியும் மற்றும் குழிகளை தீர்க்க முடியும்.
  animal.sea_turtle:
    label: கடல் நாგரிகம்
    summary: வளைகுடாப்பகுதி திரும்பி முட்டை இடுவதற்கான ஒரு பெரிய கடல் உயிரினம்.
    info: சிலிற்சிவப்பு கடல் நாகரிகம் ஏழு கடல் நாகரிக வகைகளில் ஒன்று. எண்ணூர் அல்லது ஐந்து ஆண்டுகளுக்கு ஒருமுறை தான் பிறந்த கடற்கரைக்குத் திரும்பி முட்டை இடுகின்றன. வயது வந்தவை தாவரச் சாப்பிடுபவையும், கடல் புல் மற்றும் மொட்டைகளை உண்ணும்; குட்டிகள் எல்லா வகையும் உண்ணும்.
  animal.seahorse:
    label: கடல்குதிரை
    summary: சிறிய நேர்த்தி மீன்; ஆண் பாலூற்றும்.
    info: கடல்குதிரை எனப்படும் ஒரு சிறிய நேர்த்தி வளைவு மீன், அதன் உயர் நிலையில் நகர்த்துவதற்கு தலைமுனை கால்களை பயன்படுத்துகின்றது. குழந்தைகளை ஆண் மீன் மட்டுமே பாதுகாக்கின்றது என்பது ஒரு சுவாரஸ்யமான தகவலாகும். அதன் ஓசையோடு கடல் புறங்களை பற்றிக் கொண்டு பிணைந்து கொண்டு உணவு கிடைக்கும் வரை காத்திருக்கின்றது.
  animal.shark:
    label: கால்சன்
    summary: அதிக வேட்டையாளர் மீனுடன் நச்சு பற்றி உள்ளது.
    info: பெரிய தொண்டை அமைப்பு கொண்ட ஒரு பெரிய வேட்டையாளர் மீன் என அழைக்கப்படும் கால்சன், உலகில் மிகப்பெரிய வேட்டையாளர் மீனாகும்; இது ஆறு மீட்டர் நீளம் வரை அடையும். இது லோரன்ஸினி குவியல்கள் மூலம் பிடிக்கப்படும் மின்புலங்களை உணரும் திறன் கொண்டுள்ளது. மனிதர்கள் மீது தாக்குதல் மிகவும் அரிதானாலும், கால்சன்கள் கடல் ஏகோஸிஸ்டத்தின் முக்கிய வேட்டையாளர்களாகும்.
  animal.whale:
    label: வெல்ரிபா
    summary: சுற்றுப்பயணம் செய்யும் கடல் மஞ்சள் வாழிடத்தில் உள்ள நீரில் இனிமையாக அலசும் ஒரு விழுந்து எடுக்கும் ஜீவி.
    info: வெல்ரிபா மோட்டா பூமியின் மிகப்பெரிய விலங்காகும்; இது 30 மீட்டர் நீளம் மற்றும் 150 டன் எடை வரை வளரும். இது மட்டுமே கிரில் என அழைக்கப்படும் சிறிய கால்நடைகளை ஊடுருவி உணவு பெறும். இது அனைத்து உயிரினங்களிலும் மிக ஓசையான ஒலிகளை உருவாக்கும்.
