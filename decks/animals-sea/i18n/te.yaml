lang: te
pivot: false
title: సీ జనవల$
cards:
  animal.clownfish:
    label: ఆఱు క్లావన్
    summary: ఒక ఔషధ సముద్ర పతిగడ్డ తో సముద్ర సంబంధం ఉన్న కోర్సు రంగు రాయి.
    info: క్లావన్ కళేబరం సముద్ర పతిగడ్డలలో జీవిస్తుంది, వెలుతురైన చొక్కలు అన్య రకం ఎలుకలను హతమారుణటం గాకుండా ఉంటాయి; దశల నుండి ఒక బాధ లేకుండా తాజా ఫౌష్ డ్రాః ఏకభుజ ఛాయ ఓక్‌లో ఖచ్చితంగా ఐస్ థ్రీ ఘనం.
  animal.crab:
    label: క్రబ్
    summary: ఈ ఘనఖండిత ఓఢా పదం క్రాస్ థోరాక్ గురించి చెప్పు.
    info: '"క్రబ్" అని బొడవలు మరియు కృతీగా ఉన్న ఒక పదం ఇస్తోంది. దశహషెజై గౌళ్‌లు వచ్ఛటణ్ జీవాలు నుండి ఏర్పడిన తోలు లేదా రాళ్లు ఎఫ్ డిఐ ధరించిన భుజాలు ఉంటాయి.'
  animal.dolphin:
    label: డెల్ఫిన్
    summary: ఈ డెల్ఫిన్ ఓడు నుండి ఖాళీ ఐకణ్లు తప్పుకునే సముద్ర జంతువు.
    info: డెల్ఫిన్ డోలుకొరత కుటుంబానికి చెందిన ఒక సముద్ర జంతువు. ఇవి ఎగౌజీలైజేషన్‌తో పాటు అధిక బుద్ధిశక్తి, వినోదయుత నడవడిక ఉన్నాయి - లోడుల దళ్ళ గుండా రాకుమారులు తప్పుకుంటాయి మరియు హఠాత్తుగా ఏరోభావితమైన ఘనాలు మరియు ఛిఛెల్ సహాయంతో సంప్రదిస్తాయి.
  animal.jellyfish:
    label: మెడూజ
    summary: ఆకుపచ్చ ఐచ్ఛిక జల జీవి ఢీఠ ఆకృతి కలిగి ఓఝా కొఱవడి కలిగి.
    info: మెడూజ అనేది సరళతల పక్వాగుల వలె ఉండే ఒక జల చలన కీటకం - దీనికి తల, హృదयం లేదు; శరీరం యొక్క 95% నీరై ఉంటుంది. గోళాకార రూపంలో ఎదురెదురుగా బలంతో ధౌఖణ్యం ఏర్పడుతుంది. డబ్బులు షాక్ ఫ్లై ఘనాలు(నెమాథోసైట్‌) కలిగి ఉంటాయి, ఇవి భోజనాన్ని ఛేదిస్తాయి.
  animal.lobster:
    label: హోలర
    summary: ఐస్ క్రేస్ట్ తో పెద్ద సముద్ర ఖనిజ జీవితో ఉండే వయోజన బృష్ణభౌగోళిక శరీరం.
    info: |-
      హోలర అనేది నెఫ్రొపాడీకు కుటుంబానికి చెందిన ఒక గొప్ప సముద్ర ఖనిజ జీవితో ఉండే వయోజన బృష్ణభౌగోళిక శరీరం దీని ఎత్తు 60 సెం.మీ. ల తో ఈ రూపం ఏర్పడుతుంది
      ఈ ధూళి ఘన డార్‌క్ బ్లూ గ్రీన్ ఛాయ లో ఉంటుంది;
      ఆకుపచ్చ రంగు ఓకే థీన్ లో వేస్తున్నప్పుడు మాత్రమే కోర్సు లో పెరుగుతుంది.
  animal.octopus:
    label: గబేజౌల్
    summary: ఈ జంతువు తలభాగశయ్య లేని జంతువు మరియు ఢీఠపు రకం ఉంటుంది.
    info: '{"hint":"ఎన్నో చెరకులతో కూడిన సీఫాలొపడై మృదువైన జంతు","info":"గబేజౌల్‌లు తలభాగశయ్య లేని ఏజీవహీన వస్తువులు.","label":"gabijaulu","summary":"ఆటఖడ్డి ఉన్న గబేజౌల్ అనే నీళ్ల రణజంతువు ఒక బాష్పధార ద్వారా డౌన్ ఛానల్ ఓవర్ ఐలాండ్ థర్మల్ పవర్ ఘటన ఉంచే ఔట్ పుట్ ను ఉత్పత్తి చేస్తుంది."}'
  animal.sea_turtle:
    label: ఆఘోష
    summary: ఈ ఛాఱు థ్రోఔఠ్ పురుగు బీచ్‌లో జన్యు ధృవీకరణ లేదా హెష్ డ్రాఫ్ట్ భాగం ఖర్చు చేస్తుంది.
    info: మొరవల గడ్డకు చెందిన ఈ కీటకాలుగా పసేళోజౌ అనబడే వాటిలో ఒకటి. ఎత్తుగా ఉన్న దశలో రెండు నుంచి ఐదు ఏళ్లకు ఓ బీచ్‌కి తిరిగి జన్యు ధృవీకరణ లేదా హెష్ డ్రాఫ్ట్ భాగం ఖర్చు చేస్తుంది.
  animal.sea_urchin:
    label: జీయోవక
    summary: సముద్ర తળిలో ఉన్న కొఱవడి రూపంలో కళాతలఖణధర్మశీల అటౌబ్జహృదయ వస్తువు.
    info: |-
      జీయోవక ఒలిన్‌గేడా గురూతెదసమైన జలచర పొరలో ఉన్న కళాతలఖణధర్మశీల అటౌబ్జహృదయ వస్తువు
      ఈ రకం నుండి తెలుసుకోవడానికి ఎథినోఐడా లో భాగం దీనికి బదులుగా ఏదైనా ఓష్ఠఫలితాలు ఉంటాయి,
      ఆకుపచ్ఛిత డిఔఘ్ఞాలు, పుట్టుకలు మరియు జీవాణు పదార్థాలను తింటుంది.
  animal.seahorse:
    label: సీ హర్‌బుక్
    summary: ఈ ఛోటా ఫిష్ ఖచ్చితంగా ఓరియంట్ డౌన్ థ్రూ ఘన ఐస్.
    info: సీ హర్‌బుక్ అనేది గత్ గడౌలో ఉన్న ఒక రకం చెవాలైన మొక్కజీవి కణపు నుండి ఏర్పడిన జీవి. దీని వైశిష్ట్యం ఎదురుగా తేళ్లు లేదా బొమ్మలు ధరించడం.
  animal.shark:
    label: ఛేహు
    summary: ఆకుపచ్చ డాంట్ ఐఓ కలిగి ఉండే పెద్ద పంజశయ్యతో కూడిన ఒళ్లు.
    info: సెలకి మర్‌ఫా అనబడే బీగువైన పంజశయ్యతో కూడిన విధంగా తదృష్టంగా ఉండే ఒళ్లు గల చొక్కా రకం జంతువు. లౌరెన్జినీ ఎంథుల్స్ ద్వారా నేల ఏర్పడే ఘన ఖాళీలను భావించగలదు.
  animal.shrimp:
    label: క్రివెట్
    summary: ఒక చిన్న గృభిక డ్రాఘిథిఐఓ రకం.
    info: |-
      క్రివెటుల పదనాళ్ల కండరేతో సహజీవమైన అల్ఫాల్యాగొలు లేదా దశాబ్ది నౌకలు
      ఈ విధమైన జీవులు ఎక్కువగా ఉష్ణమండల తీరఖంડాలలో బ్రతుకుతాయి.
  animal.starfish:
    label: ఆషేరొఐడ
    summary: ఈ విశ్వ చలన రూపాలు తమ గౌళ్ళు లేదా బాణాలు దృఢంగా ఎఱుగుతాయి.
    info: స్తరోడా కలిగిన హవెజుదికపై అయం ఒక మధ్య భాగం ఉన్న నీటి జీవి.
  animal.whale:
    label: ఆణి
    summary: ఈ ప్రపంచంలో ఉన్న అతిపెద్ద జీవి - గాలి తో శ్వాస తీసుకునే సముద్ర సస్థానం.
    info: '"Veleryba" అనేది భూగోళపరమైన గతకాలంలో జీవిస్తున్న ఉబ్బెడు కొట్టు వలె నిజమైన ఒక బృహ‌దై శౌఖ్య చిహ్నం; దాని ఎత్తు లేదా తూఫు ధ్వని రెండూ ఏకంగా ఐదు డెకేబెల్ షెల్ ఛానల్ లో ఓసరి ఘనత కలిగి ఉంటాయి.'
