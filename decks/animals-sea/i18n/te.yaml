lang: te
pivot: false
title: సముద్ర జన్తువులు
cards:
  animal.crab:
    label: క్రబ్
    summary: పానీయ మరియు కొలతలతో ఉన్న దశాంగుల సెలైట్, వైపుకు చలనం.
    info: క్రబ్ బ్రాక్షీఅరా ఇన్‌ఫ్రాఆర్డర్ లోని ఒక జలజీవి. ఇది నియమితంగా తొలగించే గట్టి హైమ్ రాళ్ల ఖాళీని కలిగి ఉంటుంది (ఎక్స్కేజి). ఇది ప్రత్యేకంగా వైపుకు చలనం చేస్తుంది. కొలతలు రక్షణ, వేట మరియు సంచారం కోసం ఉపయోగించబడతాయి. ఇది సముద్రంలో, తేమ నీటిలో లేదా భూమిపై జీవిస్తుంది.
  animal.dolphin:
    label: డెల్ఫిన్
    summary: జల జీవిగా సమూహాలు నివసిస్తూ వాటి నుండి దూకే చతురైన ప్రాణి.
    info: డెల్ఫిన్ డోల్ఫిన్ కుటుంబానికి చెందిన ఒక సముద్ర సస్యం. అది ఎకోలొకేషన్ తో గానీ, బౌంస్ లు మరియు రసవత్తర ప్రవర్తన ఉన్న అధిక సృజనాత్మకత కలిగి ఉంటుంది - డెల్ఫిన్ లు లోడ్ ఏరోభేర్ నుండి దూకడం ఇష్టపడతారు మరియు శబ్దాలు మరియు క్లిక్ ల ద్వారా సంప్రదిస్తారు. వారు 'హెయిన్' అనే సమూహాలలో నివసిస్తారు మరియు వాల్‌స్ యొక్క సమీప సంబంధులు.
  animal.jellyfish:
    label: మీడ్జా
    summary: విద్రోహక చెప్పులతో కూడిన గొట్టం రూపంలో స్థలంలో ఉన్న ఒక విధంగా తేలికపాటి జీవి.
    info: మీడ్జా అనేది నాళ్ళు, హృదయం లేని ఎమైనోఫోరా శ్రేణికి చెందిన ఒక సముద్ర జీవి - దాని శరీరం సుమారు 95% నీటితో ఏర్పడింది. బెల్-షేప్ శరీరం ద్వారా పలుచన తో కదులుతుంది. దాని చెప్పులు నేమాటోసిస్ట్‌లను కలిగి ఉంటాయి, ఇవి దాడి చేసే జీవులను అణచివేస్తాయి.
  animal.octopus:
    label: కొప్పెరు
    summary: ఆరవ చేతులున్న మృదుశరీర జంతువు, దేహ రంగు మరియు ఆకృతిని మార్చడానికి సమర్థవంతం.
    info: కొప్పెరు ఒక అట్టుడి కాని జంతువైన తలపిండి వర్గానికి చెందినది. ఇది మూడు గుఱ్ఱధాళ్లు, నీలి రక్తం ఉంటుంది మరియు కోమల ఫోరోలు ఉపయోగించి బయట నుండి లోపల దాక్కునే సౌకర్యం ఉంటుంది. ఇది ఎక్కువగా బుద్ధిమంతం - మూసివేసిన డబ్బాలు తెరిచే మరియు పజిల్‌లు పరిష్కరించే సామర్థ్యం ఉంటుంది.
  animal.sea_turtle:
    label: సముద్ర కాకి
    summary: వలయగాడీని వదిలించడానికి తిరిగి రావే పెద్ద సముద్ర దొంగ.
    info: ఆకుపచ్చ సముద్ర కాకి ఏడు సముద్ర కాకి జాతులలో ఒకటిగా ఉంటుంది. అణులు రెండు నుంచి ఐదు సంవత్సరాలకు ఓ బీచ్‌కి తిరిగి వస్తాయి, అక్కడ వారు హాట్ లైంగ్ గా ఉంటాయి. పెద్ద జీవులు ఘనపదార్థాలను భుజిస్తాయి మరియు సముద్ర గడ్డి మరియు శైవలాలను తింటాయి; చిన్న జీవులు ఎముకలు తింటాయి.
  animal.seahorse:
    label: సీ హార్స్
    summary: దగ్గరలోని ఒక రకం చేప ఊడుగా నడుచుకుంటుంది; గురువు బస వయస్కులు కలిగి ఉంటాడు.
    info: సీ హార్స్ అనేది హిప్పోకామ్పస్ జాతికి చెందిన ఒక రకం చేప అయిన దాని తల భాగం లో ఈ చేప ఎదురుగా నడుచుకుంటుంది. ఆకర్షణీయమైన విషయం ఏమిటంటే శిశువులను ధరించడం ఫలితంగా గర్భం గురువు కాబట్టి స్త్రీ కాదు. ఈ చేప తన పొట్టి వల్ల సముద్ర ఘాసం పట్టుకొని వాటి కోసం వేచి ఉంటుంది.
  animal.shark:
    label: సీకలర్
    summary: బలమైన దంతాలు ఉన్న పెద్ద కొడవగోసేపులు.
    info: అత్యంత విలువైన బీట్ సీకలర్ భౌగోళిక జీవులలో ఒకటిగా గుర్తించబడింది మరియు ఆరు మీటర్ల ఎత్తు వరకు పెరుగుతుంది. లోరెన్జిని అంశుల సహాయంతో నేలపై ఉన్న విద్యుత్ ఫీల్డ్‌లను గుర్తించగలదు. తన ప్రఖ్యాతి కారణంగా మనిషిపై దాడి చేయడం చాలా అరుదు; సీకలర్లు మహాసముద్ర పర్యావరణ వ్యవస్థలో కీలకమైన కొడవగోసేపులు.
  animal.whale:
    label: వెలరిబా
    summary: భూమి పై అతిపెద్ద జీవి - గాలితో శ్వాసక్రియ చేసే ఒడుగుజీవి.
    info: నీలి వెలరిబా ఎప్పటికీ భూమి పై ఉన్న అతిపెద్ద జీవి; దాని పొడవు 30 మీటర్లు మరియు బరువు 150 టన్నులకు పైగా ఉంటుంది. క్రిల్ అనే చిన్న షెల్‌ఫ్రీ జీవులను తింటుంది, ఇవి నోరు లో ఉన్న రెండు డిస్క్ ల మీద నుంచి వడపోస్తుంది. ఇది ఏ జీవి కంటే గాలి ధ్వనులు ఎక్కువగా ఉత్సర్జిస్తుంది.
