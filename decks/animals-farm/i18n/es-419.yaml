lang: es-419
pivot: false
title: Animales de granja
cards:
  farm.chicken:
    label: gallina
    summary: Ave doméstico que pone huevos.
    info: La gallina es la ave de corral más extendida del mundo. Pone huevos y se cría para carne; hay más de 25 mil millones de ejemplares.
  farm.cow:
    label: vaca
    summary: Animal agrícola grande que produce leche.
    info: La vaca doméstica se cría para la producción de leche y carne. Es uno de los principales recursos alimenticios en todo el mundo; una vaca lechera puede dar entre 20 y 30 litros de leche al día.
  farm.donkey:
    label: burro
    summary: Animal trabajador de orejas con caminata confiable.
    info: El burro doméstico es un asno africano silvestre domesticado que ha sido utilizado durante siglos como animal de trabajo. Es resistente, confiable y capaz de cargar pesados fardos.
  farm.duck:
    label: pato
    summary: Ave acuático con pico ancho criado en granjas.
    info: El pato doméstico es una aviaría criada para su carne y huevos. Puede nadar bien gracias a las membranas entre sus dedos y emite un sonido característico.
  farm.goat:
    label: cabra
    summary: Animal de granja con cuernos que da delicioso leche.
    info: La cabra doméstica se cría para la producción de leche, carne y lana. Es adaptable y puede sobrevivir en una variedad de vegetación, incluidas áreas secas.
  farm.horse:
    label: caballo
    summary: Fuerte animal de granja utilizado para montar y trabajar.
    info: El caballo ha sido esencial durante miles de años para el transporte, la agricultura y la guerra. Hoy en día también se cría para deportes y recreación.
  farm.pig:
    label: cerdo
    summary: Animal de granja rosado con hocico cartilaginoso.
    info: El cerdo doméstico es un animal inteligente criado para su carne. Es omnívoro y puede recordar tareas complejas.
  farm.sheep:
    label: oveja
    summary: Animal lanudo de granja que proporciona lana y leche.
    info: La oveja doméstica se cría para obtener lana, leche y carne. Vive en rebaños y es uno de los primeros animales domesticados en la historia.
