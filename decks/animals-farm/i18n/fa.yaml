lang: fa
pivot: false
title: حیوانات اهلی
cards:
  farm.alpaca:
    label: الپاکا
    summary: جانور كوچك مشابه لايم كه برای بدست آوردن مو خردمندانه پرورش يافته.
    info: 'الپاکا حیوان کوچک‌تر از لامه است و در مناطق مرتفع آند های شرقی پرورش داده می‌شود. نخ این جاندار به عنوان یکی از ظریف ترین الافل طبیعی سراسر جهان، بسیار گرم، ضد آلرژی و رنده بافت ترشح می‌نماید؛ وجود دارد دسته تقسیم بندي : هوآيا(تاجي)، سورى(حرير). فعالیت صادرات محصولات این زاغه در حال توسعه قراردادهاي جديد در اروپاست.'
  farm.barn_cat:
    label: موشكش
    summary: سگ موشكش يك نوع سگي است كه براي مقابله با پستانداران كوچك در محل كشاورزي نگهداري ميشود.
    info: سگ موش‌کش، سگی است که در محیط زراعت و دامداری ماندژر باشد تا موشها را شکار کند. این حیوانات به عنوان نگهدارنده ذخایر غذایی مثل جویدنی ها عمل می‌کنند. برعكس كوتولك خانگى، آنان فرازمندى كمترى نسبت به مردم دارد.
  farm.beehive:
    label: کلونی
    summary: سازهٔ چوبی با منظور اقامت دائمی ملخ.
    info: کOLONIE ماندگار در کنار عسل به عنوان جایی برای زندگی و ساخت دودمان، از فضاهای خالی درختان را تعویض نموده است؛ هر کolonie شامل بین پنجاد تا صفرصد حشرات مختلف است. هر واحد از آنان حداقل ۲۰ الی ۳۰ کیلوگرم شهد طبیعی روزمره تولید می‌نماید.
  farm.boar:
    label: کانس
    summary: جنس مردانهٔ خودجوش یا ساخته شده از نوع خوزستان.
    info: "کانس جنس ناکاسترو شده ای است که متعلق به خوک درخان و دمپایگان هستند، بر روی فارماها آن را پرورش میدهند تا بتواند تولید مثل کند؛ منظومات حاوی مواد لازم برای سمیناسیون الکتریکی باشد. \nدر طبیعت، کانس زباله‌دار قابل مقابله با عضلات بالقوه وجود دارد و قادر به دفاع ضدافسرتیف است. \nهمچنین، گوشتهٔ کانس در غذائی مهم است."
  farm.calf:
    label: تل
    summary: جوجه سگوز قبل از رسیدن به سن ۱ سال.
    info: تله جوجه سگوز از زمان تولدش تا جدا شدن از مادر، یا حدود چهارماه بعد است. پس از تولید به راحتی بایست و انرژی والدین قوی است. در صنعت دامداری برای تأمین مواد غذائی حیوانات نوظهور، کمتر با مادر آنان همنشه خواهد بود.
  farm.carp:
    label: کارب
    summary: ماهی بزرگ حاوی آبهای شیرین؛ غذا سنتی عید نو سال در جمهوری چک.
    info: کاپر عمومی بزرگ‌ترین ماهی است که در رایبرنیک های جمهوری چک پرواندوزده و به طرز غیرقابل انفصال با عید نو سال آنان انسجام دارد، خصوصاً در تربونسکه رابرنیکها. این ماهی فراموش شدنی قرون وسطی مدیت زاده شده و تمام مواد غذائی را مصرف می‌نموده؛ بدنهٔ او بالغ بر ۳۰ کیلو وزنش ممکن است بشمارد.
  farm.chicken:
    label: مرغا
    summary: طير كشاورزي با قابليت تخم ريزي.
    info: گوشت مرغ خانگی به عنوان پر توزيع‌ترين نژاد طيور در سرتاسر جهان شناخته ميشود، اين حيوانات براي توليد مثل و استخراج غذا کاشته ميشوند؛ وجود دارد بالا فراتر از بيست وپنج هزارمليار عدد.
  farm.cow:
    label: گاوان
    summary: حيوان كوچكي بزرگ که شير ميدهد.
    info: گاو خانگی برای تولید شیر و گوشت پرورش داده می‌شود. این حيوت يكى از منابع مهم غذاء در سرتاسر جهان است؛ هريک از زنحبيات روزانه بين بيست الي سي ليت شير توليديمي كند.
  farm.deer:
    label: دانک
    summary: جوجه‌های فراموش شده یا دانک برای تامین مواد غذائی.
    info: در ایران، جوجه‌های قرمز و دانک در مزارع برای تولید غذای حیوانات خودرو استفاده می‌شوند. اندازهٔ آنها کمتر از سگوستا باشد و پارچه‌های مشخصی را نسبت به همدیگر داشته باشند.
  farm.donkey:
    label: خاج
    summary: حیوان دو زانو با پایداری بالا.
    info: خاج خانگی از نوع Equus africanus asinus است که قرن‌ها به عنوان حیوان کارآمد مورد استفاده بوده و قادر به تحمل وزن سنگین است.
  farm.duck:
    label: کاچن
    summary: پرندهٔ جوش با زبان فلاته که روستاهای مختلف پروشد.
    info: کاچن خانگی برای تولید مرغ وتخم پرورش داده می‌شود، به علت وجود غضروف بین انگشتان قادر است در آب شنا کند و صدای مشخصی از خود نوشت.
  farm.emu:
    label: ماهی‌تاز فرام
    summary: ماهی‌تazes روزانه برای گوشت، لوسفاس و جلدرفت در منطقهٔ استرالیا.
    info: ماهی‌تاز در استرالیا روی مزارع پروار شده و برای گوشت، اسیدچرب که به عنوان مواد غذائی در محصولات آراستنی استفاده میشود، همراه با جلد نیز تولید میکند. این نوع ماها دارای خواص ضد التهاب بوده و در طب سنتی و حالت فعلی بهتر مشاهد میباشد.
  farm.farm_shrimp:
    label: ماجلم کرکس
    summary: ماهیانه کرکس در محیط‌های تحت کنترل داخلی.
    info: |-
      گوشت کرکس سفید دریای آرام، پرجمع‌ترین نوع ماهیانه است که جذب شده و به صورت تجاری فروش داده می‌شود
      مازرها عموماً در خاورمیانه از هندچین و لاتنامراست با وجود مناطق مختلف قراردارد
      محصول بار غیرطبیعی ناشی از ماژل زدن بر روی رشد طولانی مدت مغروف‌ها موثر است
      در حال حاضر بعد از تن، بالاخص ۲ نوع معروف انداخته شده است.
  farm.foal:
    label: هايب
    summary: جنين اسب قبل از يك سال ديگري كه ساعتهاي اوليويرو بيچرا ايست.
    info: هایب جنین اسب تا سال نخست زندگی است، در ساعات اولیه پس از متولد شدن می‌تواند روی پاهایش بایستد و به فرم کرده باشد؛ دارای لاغرسوز قابل توجهی نسبت به بدنش است که همراه رشد بلندتر شود. حیات هایبات خوشحالکننده و علاقمندمثل هستند؛ آماده‌سازی برای استخدام فقط بعد از سن دو الی سه سالگی صورت می‌پذیرد.
  farm.freshwater_crayfish:
    label: رَک رِچُني
    summary: ياك نوع از قوراش باسدي که د غذا طرفدارى کيداي.
    info: "رَک رِچنی در افغانستان فراوان بود، ولې د ناروغۍ او آب‌های آلودل شوی له کبله تقریباً ختم شوي و همراه ساتي ديرونه لري. \ndمتخصصان به مزرعه ‏هاى اختصاصى پاليسى كړئ. \nدا يوه علامت است که څاته آبه جذاب وي؛ فقط توخونه تميز زموږ ماشومتونه دي."
  farm.garden_snail:
    label: Escargots
    summary: بزرگترین نوع بالشت زمینی موجود در اروپاست که در فرهنگ غذایی فرانسه معروف به Escargot است.
    info: نمات باغی، به عنوان بالشت زمینی در اروپا شناخته می‌شود و پر طعمترین نانوای فرانسوی با نام Escargot استفاده می‌گردد. آنها برای سرمائیز کارمند تابستان هستند و خونک را روی صفحات غلاف خود قرار داده و جلوی عبور هوافضلا را مسدوم می‌سازند.
  farm.goat:
    label: کوزه
    summary: حیوانات کشاورزی با قرون که شیر لطافت را فراهم می‌آورد.
    info: '{"info":"کوزه دامی برای تولید شیر، گوشت و پشم نگهداری می‌شود. این حیوان انعطاف‌پذیر است و قادر به زنده ماندن در مناطق خشک با تنوع بومی مختلف است."}'
  farm.goat_dairy:
    label: گوزن
    summary: گوزنی که برای تولید شیر استفاده می‌شود.
    info: گوسفند خانگی انسجام پذیر است و بسیار مناسب برای تولید شیر محسوب می‌شود که بهترین مواد غذایی را دارد، نسبت به شیر گاو قابل هضم است؛ بنابراین برای افراد حساس به لاکتوز مناسب است. انواع سرخچه معروف مثل Chevre، فتا و هلومی با آبجوست جوش شده در زنجیرهٔ لاتین ساخته می‌شوند.
  farm.goose:
    label: حسهٔ خانگی
    summary: بزرگترین طاووس دامی کشاورزان برای غذا، مواد لازم برای تخمیر و بال.
    info: گوشت‌مرغ خانگی از پرندگان وحشی قبل از بیشتر از سه هزار سال به وجود آمده است. در روم باستان، حسنهای کاپیтол مراقبت میکردند. برای تولید جوجه مرغان، چربی قرمز فرانسوی و نخود زنده معروف شدند.
  farm.guinea_fowl:
    label: perlīke
    summary: طوطی امریکائی برای ذرت و ضد فرسودگی.
    info: پرلیکا با کلاه افریقایی، در سواح استاندارد زندگی می‌کنند؛ به عنوان ناظران طبیعی روستاهای دامداری شناخته شده و صدا بلند آنان برای هشدار حضور فصل جادویی، پستاندارها و غیرت مشترک بسیار مناسب است. بدنش رنگ خاکستری تابلویی با نقاط سفید و بالاتنه قرمز-آسمانی بدون مو وجود دارد.
  farm.guinea_pig_farm:
    label: خوکچهٔ کشاورزي
    summary: خوکچه اي كه در أمريكا لاتينى برای گوشتخوارى يا به عنوان يك جونويسي ديدي
    info: |-
      خوکچه خانگی از مناطق آند سرزمین است که قبل از بیشتر از هزار وسهصدسال توسط شماردهای درآمده محسوب می‌شد
      در حال حاضر غذای روزمره در پرو، قرقازا و کلمبیا به نام «سوئ» وجود دارد
      در اوراق و شمال آمریکاستان با عنوان جوجه علاقمند برای کودکان معروف است
      با صداهاي مختلف شامل فُت، زمزمه و فِفَن صحبت می‌کند
  farm.highland_cattle:
    label: گوساله های اسکاتلند
    summary: نژاد چرب با مو بلونده و شاخ فراوان.
    info: نژاد قدومی گاو در مناطق کوهستانی اسکاتلند پرورش می‌یابد و دارای مو طولانی قرمز رنگ است، که آب و هوائی سرد و مرطوب را تحمل می‌نمود. به خواص مقاومت بالا نسبت به بیماریها مشهور است.
  farm.horse:
    label: اسب
    summary: سبک قوی در حال حرکت با فعالیت روزمره
    info: اسب خانگی هزارها سال است که برای حمل و نقل، زراعت و جنگ ضروری بوده‌است امروز به دلیل تفرج ورزشی پرداخت می شود.
  farm.lamb:
    label: جوانه
    summary: ملت اره تا ۱ سال زندگی باشد؛ نماد فصل بهار و پاکدلی
    info: |-
      جوانه جوجه اره تا سن یک سالگی است
      در مسیح‌شناسی نماد بی­نزا و خداپرستانه به عنوان براند الهی است
      برداردن چربش همانند مرغ کباب، غذای معروف در آشپزخونه‌ها
  farm.llama:
    label: lama
    summary: جاندار خوزپشت زهرافه ای جنوب آمریکاست که به منظور بدست آوردنتازه و حرکت روی زمین فعالیت می کرد.
    info: Lama، جانوری است که در آمریکای جنوبی پرورش داده می‌شد و از قرن ها قبل توسط شمارگان به عنوان حمل کننده بار مهم برای راه انداختن تمدن باستانی نوآندوم. لاما قادر است وزنهائی معادل سیصد در صد وزنش را تحمل کند.
  farm.mule:
    label: mezak
    summary: تلاقح غیرقابل توالدرسانی دو جنس مختلف باعث انتقال فناوری بالاتر میشود.
    info: |-
      میزک اسپر خالص نژاد کوزه و شترمرغ است؛ مخلوط معکوس آن به اسم «مولا» مشهور است。
      mی‌تواند بار سنگین را در مناطق پست حمل کند، ولی قابل تولید مثل نبوده و فقط برای هجده سال زندگی می‌نماید.
  farm.mussel:
    label: سلوا
    summary: ملخ دریائى خوار كه بر لوله هاى درياى عمقى حيوانى پرورش يافته.
    info: سلاوکا جدید غذا خوردنی است که در مزارع اقیانوس آتلانتیک اروپا به فراز و نشیب پرداخته شده‌است، روی طناب های تعلق داده شده با حرکت بالشتگی ساخته می‌شود. این موجودات آب را فیلتر می‌کند و غذای زیست محیطی با رد قهوه‌ای بزرگ است.
  farm.ostrich:
    label: farm pštros
    summary: پشتروس برای گوشت، مو و جلد.
    info: |-
      پستور م最快的 دو پا و در کشاورزی برای گوشت، مو و جلد تولید می‌شود。
      گوشت این حیوان قرمز است مثل گاو، ولی با فاترکس بالاتر نسبت به چربی و کلسترول آن وجود دارد
      جلد پسترو شناخته شده در ساخت لوازم لوکس.
  farm.ox:
    label: بوف
    summary: باف، مردانه شده اما بدون تعویض، مهمترین حیوان جاذبه در سابقه زراعت.
    info: بیک از تاس دامنهای خانگی است که برای کار نرهاستند، و در طول هزاران سال به عنوان حیوانات مخصوص جذاب زراعت بوده‌است. با وجود قدرت بالا و شخصیت فروتن، در زمین لغزندهٔ زراعت قدیم نقش مهمتری را انجام داده‌اند. در حال حاضر ماشین‌آلات مثل تراکتور آن‌ها را پوشش داده‌اند ولی در مناطق توسعه‌ناپیده هنوز ادامه مفاهیم قبلی را دارد.
  farm.oyster:
    label: ماهي صيد
    summary: ملخ درياىى كه در اقيانوس هاي سواحل برروى طناب ها يا قفس پرورش يافته
    info: |-
      گوشت ماهی در اقیانوس‌های ساحلی روی طناب ها و قفس پرورش داده می شود؛ رسیدن به بلوغ آن حداقل ۳ تا ۵ سال زمان نیاز است.
      فیلتر کردن آب را تسهیل میکند و به تمیز کردن منظومات عصری دریائى کمك مي كند
      چربى خوبى برای غذاست، با فرم جوشیده یا خام موجود است
      ماهى لؤلئعى( ماوى انحصارى ) حامل الماسهاى طبيعى است.
  farm.peacock:
    label: پاو
    summary: نر پاو در مناطق روستایی و محلات شهری برای زیباسازی پوشیده می‌شود.
    info: پاوا قرمز اصلی هند است و مدت‌ها قبل به عنوان پرنده زینتی در خانه تربیت شد. نر آن کمتر از صد فقره رشته بال با طرح دارد که برای جذب عروس، مثل سجاف برجسته می‌کشد. بلندگوئی او بسیار بلند و حاد است.
  farm.pheasant:
    label: بازانت فرم
    summary: بازيابي كردن بازانت روئي مزراع و رهايش دادنش برائے شكار
    info: بازانت عمومی در جمهوری چک روی مزارع پرداخته شده و به طور منظم به محیط زیست آزاد رها ساخته می‌شود تا برای هدف‌های صید استفاده کنند، این حشرات باستانی نخستين بار در آسيا ظاهر شدن و بعد فراموشان لاتيني به اروپا منتقل كردند. مردي دوامدار و قوي ديگري وجود دارد كه خصوصيات مشخصي مثل يك بال بلونتي داشته و انثى عادي و قهوسي است.
  farm.pig:
    label: پرس
    summary: موجود رُزن خاکستر با منقار مواد غذائی.
    info: '{"hint":"خر مرغی (sus scrofa domestica)، حیوانات کشاورزی صنفی","info":"خروس به عنو مخلوق هوشمند و دام تجاری برای استحصال گوشت پرداخته شده، همه‌چیره است و قادر به فراموش نکردن سوالات مهماندار.'
  farm.pigeon_farm:
    label: golube domesticus
    summary: حولوب داخلی برای گوشت (pigeonlet) یا پرشتاب.
    info: |-
      голون خانگی نسخه‌ای اهلی شده از پرندۀ صخره است؛ طی تکثیر مصنوعی، هفته‌ها سلسلہ جدید به وجود آمده است。
      pigeonlet(گوشت مرغ کبابی حلق) در بسیاری فرهنگ‌ها غذائی با قیمت بالا و معروف است.
      پرنده‌های رقابتی برای دقت لازمهٔ حرکت تنظیم شده‌اند؛ انفرادی با ضبط زمان بلندتر از ۱۵۰ کیلومتر در ساعت پرواز می‌کنند.
      holubářs در جمهوری چесь عمدتاً سابقهٔ قدیمی دارد.
  farm.piglet:
    label: جوجه
    summary: پرندهٔ جدیدتولد شده، عمومًا سفید و بازیگوش.
    info: ساله‌ها جوجه پرندگان خانگی در ابتدای زندگی هستند، معمولاً سفید و فعال به نظر می‌رسند. تازه متولد شده بچه‌های کوچکی دارند ولی رشدشون آسان است. حیوانات انثی مثل مرغ مادر حدوداً ۱۰ الی ۲۵ عدد جوجه تولید می‌کنند.
  farm.pony:
    label: پونیک
    summary: نسل طبیعی اسب کوتاه قد که به خاطر قابلیت حرکت بالا برای کودکان مشهور است
    info: "پونیک، نژاد کوچک اسب است که قد آن در سطح شانه بزرگتر از ۱۴٫۲ دست اندازی (حدود ۱۴۷ سانتی‌متر) نمی‌شود\n پونیک شتزلند به عنوان فشردگی ترین و با منشاء بر روی جزایر شتزلند اسکاتلند معروف محسوب می‌شود \n این حیوانات مقاوم هستند و قادر به تحمل محیط‌های خشن هستند\n علاوه بر روزنه زدن برای کودکان، نقش مهمی در صورت وجود مواد غذائی داخل ذخیره‌ها انجام می‌دهند"
  farm.quail:
    label: کره‌پلا
    summary: ماهی سبک نژاد شده برای لقمه و گوشت.
    info: کره‌پلکا جابانی نوعی کره‌پلو است که به صورت شدید پرورش داده می‌شود تا ازتخام و مرغ خوردگی آنها بدست بآیند، زردچشمای ان روزمره قارم می‌زنند؛ در غذا های مختلف فصل باشد.
  farm.rabbit:
    label: خرطوم
    summary: خودت غذایی برای گوشت، مو یا عنصر لوازم جانبی.
    info: گوزن خانگی در مهندسی عمران از سده های وسطی اروپا به‌عنوان نژاد طبیعی تکامل پیدا کرده است، بیشتر از صد نوع مختلف با اندازه، رنگ و جنس مو وجود دارد. زنان بالغ (زن گوزن)، قادر به تولید مثل چهار الیدوازو فرزند در دوره حمل شوند و ممکن است چندین بار در سال متولد بشوند.
  farm.ram:
    label: بران
    summary: جانور بالغ مرد گوساله با رؤس مشابه فنجان
    info: "بران جنس مرد حیوان گوسفند خانگی است که دارای رог‌های پر و مات با شکل فنرهست، این رغوهها در اندازه بزرگتر نسبت به زنان(گوشت ها ) وجوددارد\nدر دوران تولید مثل برخورد مستقیم سرشانسها با روغنامه آغاز میشود \nدر متون الهی و معنوی بران علامت قوت، طاقتمندی و مدیریت موثر است"
  farm.rooster:
    label: کوهوت
    summary: مردجنس جوجه خانه؛ با فحصدها تابستان را اعلام می‌نمایند.
    info: کوهوت مردگان جوجه خانه است که به دلیل پر رنگ بودن، ماهیچ و بال های زیبا شناخته می‌شوند. فحصداری آنان نوعی رفتار ارضی است و در تمام ساعات صورت می‌پذیرد نه فقط قبل از طلوع خورشید.
  farm.salmon:
    label: ماهی سلمون
    summary: مارتندریائی جوجه دهنده روی رودها ; حشره انبوه در محصول.
    info: سالمون عمومی، ماهی‌ای است که از دریا به سوی رودخانه خود برای تخمگذاری بازمی‌آید؛ قادر به پیداکردن رودخانهٔ اصلیش با ناوگاتوری و عطر هستند. فروچین زراعت سالمن در نорوه و اسکاتلند بزرگترین صنعت آبزی شناخته می‌شود.
  farm.sheep:
    label: گُسَفِنْد
    summary: حيوان فراموش با مو كه براي استخراج پارچم و شير جمع آوري ميشود.
    info: گوسفند خانگی برای تولید پشم، شیر و گوشت نژاد می‌شود. این حيوانات به صورت قطيع زندگي مى کنند و يكى از اولين موجودات دامى در تاريخ هستند.
  farm.sheepdog:
    label: دام‌نگه
    summary: سگی است که به منظور مدیریت و محافظت از قطيع گوساله تربیت می‌شود
    info: |-
      بردر کولی پرطرفدارترین سگ دام‌نگه است، نژادش برای هدایت قطعات اسباب بصر و فراموشه مخصوص به خود طراحی شده است
      از هوش بالا در رتبهٔ جانورها آبجکسند
      توانایی کار باشد توانمندسازی شوند و لزوماً از زمان صفت غذاسفید تمرین حرفه‌ای داشته باشند
      مسابقات دام‌نگهداری(همچون مرغ‌نما)، ورزش معروف انگلستان است
  farm.silkworm:
    label: برک مرعش
    summary: کرم تخم‌مرغ بروسرسون مبدأ طبیعی هدفاب.
    info: بُرک مورشی، کرم تخم‌مرغ سحرگاه است که از آن برای تولید الات هدفابی بهره جستند و در بیش از پنج هزار سال قبل در چین فراموش شده است. زانوئهٔ او با نخ بلندتر از ۹۰۰ متر منبع طبیعی هدفاب را تشکیل داده است؛ قدرت بالای آن به حدی بود که صدسالها چین علتِ تولید انرا خفته حافظ کرد. خط لطافت هم به خاطر معامله با این مواد غذائی اسم گرفته.
  farm.sow:
    label: پرسات
    summary: زن بالغ موشک، والد جوجه
    info: |-
      گاومادر جوجه‌های خانگی بالغ است و ممکن است دو بار در سال زاد کند، با تولید فرزندان به طور متوسط از ۱۰ الی ۱۴ عدد
      در حال حاضر پرواز نسل چوبی آبجکت هستش براساس شرايطي كه وجود دارد
      برخورد با يك منطقتي قابل مقايسه بايد حداقل ١٢ الي ١٦ هفته صرف كرد
  farm.tilapia:
    label: تیلاپیا
    summary: ماهی کشاورذی انبوهی است که در حال حاضر در نقاط مختلف جغرافیائی دیده می‌شود.
    info: تیلاپیا نیل، جزو ماهی‌های پرورش زده شدۀ بسیار رایج در سراسر دنیاست؛ هرسال به طرفداران تون بازار آماده می‌کند. این ماهی از مناطق حوضة نیل و لاگوانت فراموش است ولی الان روی تمام قارات وجود دارد.
  farm.trout:
    label: mahozeh
    summary: مادربچهٔ سازماندار با نام علمي Oncorhynchus mykiss
    info: |-
      ماکروزه ماهی قزل آلای رنگارنگ امریکا شمالی است که به عنوان ماشوم در آسیا وارد شده‌است،
      mahozeh mahi qezel ale ya ebarat az gavaye amrikai shemalay ast ke dar avvale be eshare sazi vareshande shode,
      dar baziha ham moheme hastand.
  farm.turkey:
    label: كركن
    summary: بزرگترین طوطئ خانگی برای چرم، علامت مهماني آمرิกائی.
    info: |-
      کروكان دومش به مكزیك بازمی‌گردد، جایي كه قبل از بيش از ۲ هزار سال توسط آzteكاها فراموش شد.
      ناموس نمادين و قادر است پيريهاي بالا را در حالت يك قلاب باز کند.
      در ايالات مشتركة غذاي تقليدي برای شبكار؛ در تمام جهان مرتبه دو ديگربزي مناسبتى است.
  farm.water_buffalo:
    label: بوفالوی خانگی
    summary: بوفالوی خانگی، یک نوع بزرگ از انواع گوسفند با منشاء آسیائی است.
    info: بوفالوی خانگی، شکارچه اهلی‌شده ودین بوفالو است که در آسیا حیوانات دامی پایه هستند. به مدت قرنها زمین برنج را جوشاندن و محموله را نقل می‌کنند. لبنۀ او غلیظ تر از لبنۀ گاو است و برای ساخت موتزarella دي بوافلا استفاده می‌شود.
  farm.yak:
    label: جادو
    summary: چربولت بلوند طالوس تختة تبت
    info: گاومیش خانگی شکل پرورده‌ای از جادو است که در منطقۀ تبت واقع بر بالاتراز سطح دریا بین ۳ هزار الی ۵هزار متر زندگی می‌نموده، بنابراین به عنوان محور اقتصاد محلی عمل نموده و مواد غذائی مثل لبن، گوشت را فراهم آورد؛ علاوه برآن بافت ضخامت لبیده حاوی حرارت قابل توجهی دارد.
