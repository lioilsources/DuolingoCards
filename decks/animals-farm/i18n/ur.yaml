lang: ur
pivot: false
title: اقتصادی جانور
cards:
  farm.chicken:
    label: سُلیٰو
    summary: ایک خانگرد پرندہ جو انڈے دیتا ہے۔
    info: خانگرد سُلیٰو دنیا کی سب سے زیادہ تعداد میں موجود مرغی کی نسل ہے۔ اس سے انڈے حاصل کئے جاتے ہیں اور گوشت کے لیے بھی پالا جاتا ہے؛ 25 ارب سے زائد فارم والے پرندے موجود ہیں۔
  farm.cow:
    label: گائے
    summary: ایک بڑا کھیتی کا جانور، جو دودھ فراہم کرتا ہے۔
    info: گائے عام طور پر دودھ اور گوشت کے لئے تربیت میں رکھی جاتی ہے۔ یہ دنیا بھر میں غذاء کا ایک اہم ذریعہ ہے؛ ایک دودھ والی گائے روزانہ 20 سے 30 لیٹر دودھ دیتی ہے۔
  farm.donkey:
    label: اُسَل
    summary: یقینی قدم والے کام کرنے والا جانور۔
    info: اُسَل اِک خاندانی حیوان ہے، جو سالوں کے دوران کام کرنے والے حیوان کے طور پر استعمال ہوا ہے۔ یہ مضبوط، قابل اعتماد ہے اور بوجھ نقل کرنے کی صلاحیت رکھتا ہے۔
  farm.duck:
    label: کچن
    summary: ایک پانی کا پرندہ جس میں ایک گھمنڈ والے منقار کے ساتھ فارم پر پالا جاتا ہے۔
    info: دومائی کچن کو دواڑھی اور انڈوں کے لئے پالا جاتا ہے۔ یہ اپنی انگلیوں کے درمیان تیراکی کی بدولت خوب تیرتا ہے اور وضاحت شدہ آواز نکالتا ہے۔
  farm.goat:
    label: کوہا
    summary: چرب ملائی دینے والے پنجروں والے زرعی جانور۔
    info: گھریلو کوہا دودھ، گوشت اور بال کے لئے پالی جاتی ہے۔ یہ تطبیق پذیر ہوتی ہے اور خشک علاقوں سمیت مختلف قسم کی فصلوں پر بآسانی زندہ رہ سکتی ہے۔
  farm.horse:
    label: کوہا
    summary: گھوڑا ایک مضبوط خاندان کا جانور ہے، جسے سواری اور کام کے لیے استعمال کیا جاتا ہے۔
    info: گھوڑا دنیا بھر میں تاریخ کے دوران حمل و نقل، زراعت اور لڑائی جیتنے کے لیے ضروری رہا ہے۔ آج اسے کھیل اور تفریح کے مقاصد کے لیے پالا جاتا ہے۔
  farm.pig:
    label: پریس
    summary: ایک رُضّوں والا فارم جانور، جس کے پاس موم کے حشرات کھونے کی صلاحیت ہوتی ہے۔
    info: ایک درخواستی اور ذہنی طور پر توانا گائوٗ کا جانور ہے جسے گوشت کی فراہمی کے لیے پالا جاتا ہے۔ یہ تمام قسم کے غذا کھاتا ہے اور مشکل کاموں کو یاد رکھ سکتا ہے۔
  farm.sheep:
    label: بکری
    summary: ایک بالوں والا کھالہ جانور جس سے اُگل اور دودھ حاصل ہوتا ہے۔
    info: بکری اُگل، دودھ اور گوشت کے لئے پالی جاتی ہے۔ وہ بچروں میں رہتی ہے اور تاریخ میں پہلے گھروں والے جانوروں میں سے ایک ہے۔
