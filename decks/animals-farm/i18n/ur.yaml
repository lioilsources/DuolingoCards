lang: ur
pivot: false
title: اقتصادی جانور
cards:
  farm.alpaca:
    label: الپاکہ
    summary: چھوٹی لامے کی اقسام جس میں سونگل وول حاصل کرنا مقصد بنایا جاتا ہے۔
    info: |-
      الپاکہ لمبائی، انڈین پہاڑوں میں ترقی دی گئی ہے۔
      اس کا بال بظاہر دنیا کے تمام قدرتی رشتوں میں سے سب سے زیادہ نرم ہوتا ہے؛ یہ گرم، الرباط فراہم کرنے والانہیں ہوتااور کاشمر سے بھی نرم ہوتا ہے。
      dو مختلف نسلیں موجود ہیں: ہواچيا(بالدار)، سورى(روغنی)
      alpaq کے پالن کا عالمی طور پر توسّع ہو رہا ہے۔
  farm.barn_cat:
    label: کوچا سٹیج
    summary: ایک خانگی کتے جسے فارم پر حشرات شوالہ مارنے والوں کے طور پر رکھا جائے۔
    info: "اسٹیج کتو، ایک زراعت تنصیب میں رہنے والا درندہ ہوتا ہے جہاں وہ موشوق اور دوسروں کو لینے کے علاقوں میں براجمان ہوا ہوتا ہے۔\n ان لوگوں نے غذاء ذخائر اور آئل کی حفاظت کرتے ہیں۔ \n عام طور پر وہ منزل کتنے سماجی معاملات میں شامل نہیں ہونے بلکہ صرف قومی مقاصد کے تحت استعمال ہوجاتے ہیں۔"
  farm.beehive:
    label: چوبی کھربزہ
    summary: ایک لکڑی سے بنائی گئی تعمیر جو مصنوعی رہائش فراہم کرتا ہے اور خوشbowر نسلاں پالتو عسل والی زردмуش کولونی کو قابض بنا دیتا ہے۔
    info: اس طرح، وائلڈ حشرات جن کا انحصار درختوں کے غاروں پر ہوتا ہے، کو استعمال کرنے کے مقام پر چوبی کھربزوں کا استعمال کیا جاتا ہے۔ عام طور پر ایک کلونی میں ۵۰٬۰۰٠ سے ۸۰٬۰۰ٗ زردموشوں کی موجودگی ہوسکتی ہے۔ ہر کلینی صرف ہر سال ۲۰ سے ۳۰ کلو گرام عسل تیار کرسکتی ہے۔
  farm.boar:
    label: کانس
    summary: ایک خود سے پالا جاتا اور غیر کیشمشیدہ مردہ مچھروں والوں کا ذخیرہ۔
    info: "کانس، دبئی زمیندار حشرات نامعلوم گرماپسند بارن تقررات کا علاج ہوتا ہے۔\n فرمونز ان کو روزمرہ استعمال کرتے ہیں؛ ان کا شمار آدمی کے لحاظ سے عام طور پر وسائل کے طور پر کیا جاتا ہے。\n بالغ کانس (ذلول)، مضبوط قسم کے مواد کے ساتھ معروف ہوتا ہے اور انسدادِ حراست کی صلاحیتوں کا مظاہرہ کرنے کی صلاحیت رکھتا ہے۔ \n کافی حد تک، کانس کا گوشت لوگوں کے درمیان مشہور ہے۔"
  farm.calf:
    label: ٹیل
    summary: ایک سال تک عمر کا اوندھوں بچہ۔
    info: "ٹیل، جنوب میں پیدائش سے لے کر انداز نامعلوم تک یا ایک سال کی عمر تک غور و فکروں کا حامل گاوٗ کا بچہ ہوتا ہے۔\nPیداء شدہ ٹیلوں کو جلد ہی قدم رکھنا آتا ہے؛ ماں کا مقصد مضبوط ہوتا ہے۔ \nماحولیاتی طور پر دودھ کی ترقی کے لئے پالتا ہوا ٹیلا زیادہ وقت بعد والدین سے الگ کردیا جاتا ہے۔"
  farm.carp:
    label: کاپر
    summary: ایک بڑی مینہ کشمشیر؛ جولائی سے قبل تقریباً اس طرح نوید عظیم الگورنٹھت۔
    info: "چیک ریاست میں پالے جانے والی سب سے بڑی ماچل، 'کاپر' وقفہ حوالے سے چیک دسمبر کے فرشتوں سے منسلک ہوتا ہے۔\nوسطی یوروپ خصوصتاً چیک لینڈز (ترنوئنسکے) میں قدامت درجات میں داخل ہوا。\nاس غذا کا استعمال عام ہونے والا ہے اور اُس کا وزن ۳٠ کلو گرام سے زائد ہوسکتا ہے۔ \nترنوئنسکے آبادار نظام اندر سے ایک اعظم تعداد کے معدوم شدہ نظام کے معروف حصّے ہیں۔"
  farm.chicken:
    label: سُلیٰو
    summary: ایک خانگرد پرندہ جو انڈے دیتا ہے۔
    info: خانگرد سُلیٰو دنیا کی سب سے زیادہ تعداد میں موجود مرغی کی نسل ہے۔ اس سے انڈے حاصل کئے جاتے ہیں اور گوشت کے لیے بھی پالا جاتا ہے؛ 25 ارب سے زائد فارم والے پرندے موجود ہیں۔
  farm.cow:
    label: گائے
    summary: ایک بڑا کھیتی کا جانور، جو دودھ فراہم کرتا ہے۔
    info: گائے عام طور پر دودھ اور گوشت کے لئے تربیت میں رکھی جاتی ہے۔ یہ دنیا بھر میں غذاء کا ایک اہم ذریعہ ہے؛ ایک دودھ والی گائے روزانہ 20 سے 30 لیٹر دودھ دیتی ہے۔
  farm.deer:
    label: فارم جیلنا
    summary: چک کے فارموں میں پالا گئاتو دانہ اور جلن، زدینن کے لاء۔
    info: |-
      چک میں فارموں اُتّر وادیوں میں رڈ بھارتی سائنس نام 'جَلن' اور 'دانِسْ' تقریر کروݨ والٗ انعام حاصل کردؤندے ہون۔
      даньسي جَليني لوڑ من تو خاص طرح شاخدار بالٹى مومن والا ہوندا آهي
      اور ہرسال ان کے مومن الگ ہوجاي دي اور دوبآرا واقع ہوتيا۔
  farm.donkey:
    label: اُسَل
    summary: یقینی قدم والے کام کرنے والا جانور۔
    info: اُسَل اِک خاندانی حیوان ہے، جو سالوں کے دوران کام کرنے والے حیوان کے طور پر استعمال ہوا ہے۔ یہ مضبوط، قابل اعتماد ہے اور بوجھ نقل کرنے کی صلاحیت رکھتا ہے۔
  farm.duck:
    label: کچن
    summary: ایک پانی کا پرندہ جس میں ایک گھمنڈ والے منقار کے ساتھ فارم پر پالا جاتا ہے۔
    info: دومائی کچن کو دواڑھی اور انڈوں کے لئے پالا جاتا ہے۔ یہ اپنی انگلیوں کے درمیان تیراکی کی بدولت خوب تیرتا ہے اور وضاحت شدہ آواز نکالتا ہے۔
  farm.emu:
    label: EMU کی فارم
    summary: اُسٹریلیہ میں EMU کو تیل، گوشت اور جلد حاصل کرنے کے لئے پالا جاتا ہے۔
    info: ایملو سے نکلنے والے تیلوں کا استعمال خوبصورتی کے علاج میں بھی ہوتا ہے، ان میں التامش روکنے والا خاصہ موجود ہوتا ہے۔ چند وقت قبل یونان اور آمریکا سمیت دیگر خطوط میں EMAUS کی زراعت شروع ہو رہی ہے۔
  farm.farm_shrimp:
    label: کریور فارم
    summary: ساحلی تالابوں میں پیدا کردہ ایک قسم کے سمندری جانوروں کی طرح، غذا کے لئے۔
    info: |-
      بائٹھن بلو وائل نام کی کرسچن انڈین خواتین کی حفاظت کرتی ہے۔
      ایشیاء کے جنوب مشرقی حصّے اور لا틴 آمریکا میں زراعت کرنے والے علاقوں موجود ہوتے ہیں。
      کرسچنز کی شدید پروڈکشن منگروفز کے نظام پر متاثر کرنے کی وجہ سے معاملات بن رہی ہے۔
      دنیا میں دوسرا سب سے زیادہ مقبول درجۂ علم بعد کے تنفس کے بعد۔
  farm.foal:
    label: ہریبے
    summary: گھوڑا جس کی عمر ایک سال تک ہوتی ہے؛ پیدائش کے حوالے سے چند گھنٹوں میں قدم رکھ لینا شروع کردیتا ہے۔
    info: "ایک ہرِبا، وہ بچہ ہوتا ہے جو اپنے زندگی کے پہلے سال تک گزر جاتا ہے。\np>اس کی پیدائش کے بعد فوراً دنوں کے اندر وہ خود آسانی سے قائم ہوجاتا ہےاور دودھ پلانا شروع کرتا ہے۔\n\nان کے قدموں کا تناسب بالخصوص لمبوں والے نظر آتے ہیں جسم کے مقابلے میں؛ وقت گزرنے کے ساتھ ساتھ یہ صفت غائب ہونے لگتی ہے۔ \n\nہرباء عام طور پر باقاعدہ حرکت کرنے والا اور علم حاصل کرنے والا ہوا کرتا ہے؛ ان کی تعلیم (بریکنگ)، دو سے تین سال کی عمر تک متوقع نہیں ہوتی۔"
  farm.freshwater_crayfish:
    label: رک ریچنِ
    summary: ایک تازہ پانی کا جوڑ اور خصوصی فارم میں غذا کے لئے پالا جاتا ہے۔
    info: |-
      رک ریچنِ، چیک سے بھارتی علاقوں میں عام طرح موجود تھا، لیکن نسبتاً بالائی حالت میں آبادگی کمزور ہونے اور پانی کی آلودگی کے باعث قدرتی انحصار متاثر ہوا۔
      اب وہ صرف خاص فارموں میں پروڈکشن کے مقصد سے پیداوار کرتے ہیں。
      اس کے ذریعے پانی کی شفافیت کا تعین کرنے والے عنصر کے طور پر استعمال کیا جاتا ہے؛ فقط پاک دلائل کے درختوں میں زندہ رہ سکتا ہے۔
  farm.garden_snail:
    label: شِک زہردنی
    summary: فرانس کے پختہ غذا میں اسکارگوٹ کے طور پر استعمال ہونے والا بڑا ساحلی جانوروں کا تھنو۔
    info: "شِک زہردینی یروپ کا سب سے بڑا خشک علاقائی حلمازد ہے۔\ni\nاسے فرانسوی دسترس میں 'ایسکارݢ' نام سے قدردانی حاصل ہے۔ \n\n ونطراۃ، اس وقت موسم چلتا رہتا ہے تو اس کی شیلف کو ڈال لاتا ہے(هibernaculum)،اور اس کا پالت (heliciulture) فرانس، اطالیہ اور دوسروں ممالک میں عمل میں آتی ہے۔"
  farm.goat:
    label: کوہا
    summary: چرب ملائی دینے والے پنجروں والے زرعی جانور۔
    info: گھریلو کوہا دودھ، گوشت اور بال کے لئے پالی جاتی ہے۔ یہ تطبیق پذیر ہوتی ہے اور خشک علاقوں سمیت مختلف قسم کی فصلوں پر بآسانی زندہ رہ سکتی ہے۔
  farm.goat_dairy:
    label: دوہی کو بکری
    summary: دودھ دینے والی اُس جانور کا نام ہے، جس سے پنیر اور يوقل تيار كيا جاتا ہے۔
    info: گذشتہ زمانے میں لاءٗ فارم پربکراؤں کوبچھڑوا کردودھ حاصل کرتے رہتے ہيں۔ ان کادودھ غذا کے اعتبار سے خاص طورپر قدردار ہوتا ہے اوردوسروں کے مقابلے میں آسانی سے پचتا ہے؛ لوگوں کولاكتوز تحمل کی شکایت ہونے کالائق مناسب ہوتا ہے۔ چِفَر، فيٹا يا هاليومى جیسا مشہور پنيروں کابكراﺅ دودھ استعمال ہوجائے۔ بكرا ئين موسمياتی حالات کاسبزى وضلع علاقوں مثلى سنگلاخ پہاDickوں پرنئيب ثابت ہوتى ہى۔
  farm.goose:
    label: ہوسا دوامکی
    summary: ایک بڑے پالتو طوطے کا جانور، مچھلی اُٹھائن لئيں، سادلو تَواݪ نِمْبٗد وار۔
    info: |-
      دوامکی حسا من زمانۂ قدم سے لاوارت ۳۰۰۰ سال قبل غیر فصل والی حساؤں تو بنّيا گيو。
      اس لوونجات اندر سردار رومین عمارتون چلاوي ڳيل
      حسراء سادلو، ذبح شدہ گوشتر، بلکه حسارا خنزرو (فؤء‏‌ ݙرس) کيت‍ى معروف هند۔
      hussarاي ضرب المثل خطاطی کيت‍ى آلہ سن
  farm.guinea_fowl:
    label: پرلیچکا
    summary: افریقہ کے ایک پنجاب جانور، ماسوٹنگ اور سبزی خوروں کے حفاظت کے لئے استعمال ہوتا ہے۔
    info: "ایک فارم والے طوطا نسل کا ذخیرہ افریقا سے تعلق رکھتا ہے، جس وقت وادیات میں بسنے والا ہوا کرتا ہے。\nfarmers انہیں قدردان بنائیں؛ اپنا شدید آوازاً صدا دبا کر زحل، شکاریوں اور غیر معروف لوگوں کی موجودگی کی علامت دینے کے لئے۔\nanimals کے بال بلند مشخصاتی علاقوں میں سفید نقطوں کے ساتھ درج ہیں اور احمر-سبزرنگی موذون منڈولوں کے ساتھ۔ \nits meat is taste-wise similar to game birds."
  farm.guinea_pig_farm:
    label: مروچا فارمو
    summary: لیٹین امریکہ میں مرغ کے لئے پالنے والی جانورات یا بطور سفید تھرمل۔
    info: "ایسی دوسری حشرات، انڈز کے علاقوں میں آباد کردہ گزرد واقع ہوتا ہے، جہاں درحقیقت قرون قدیم نے ۳٬۰۰۰ سال قبل ذبح کرنے کے مقصد سے استعمال شروع کیا。\nاب بھی مشترکہ غذائیت براسلامبرنس، ایکواڈور اور کولمبیا میں موجود رہتا ہے (جسے 'cue' کہا جاتا)۔\neuropeاور شمالی امریکہ میں یہ عام طور پر بچوں کے خوبصورت جانوروں کے طور پر پالتا ہے۔ \nیہ مختلف آوازوں شامل بلند صدا، زمزما اور چلاتے ہوئے معقد نظام کے ذریعے باہمی تعلقات بناتا ہے۔"
  farm.highland_cattle:
    label: سکاٹش ایلائے بلند
    summary: ایک سرخ رنگ کے بالوں والے، لمبے موہین خور پالتو جانوروں کا نسل۔
    info: "اسکارچ لائنڈ انگلستان میں زمیندار حشرات کھاد وغیرہ کے استعمال سے بنا ہوا قدیم ترسیلات آدمی کا قسم ہے۔\nاس کا علامتی طور پر لمبا سرخ درخت فطرتاً مرطوبیت اور سردی کے مقابلے میں تحفظ فراہم کرتا ہے。\nیہ دوسروں کے مقابلے میں مقاطعہ اور غربت سے کمزور متاثر ہوتا ہے۔ \nاس کا گوشت مشتمل اور شدید ذائقہ والا؛ عام لوگوں کے گوشت کے مقابلے میں مقبول 替代品 ہے۔"
  farm.horse:
    label: کوہا
    summary: گھوڑا ایک مضبوط خاندان کا جانور ہے، جسے سواری اور کام کے لیے استعمال کیا جاتا ہے۔
    info: گھوڑا دنیا بھر میں تاریخ کے دوران حمل و نقل، زراعت اور لڑائی جیتنے کے لیے ضروری رہا ہے۔ آج اسے کھیل اور تفریح کے مقاصد کے لیے پالا جاتا ہے۔
  farm.lamb:
    label: جھنٔ
    summary: ایک سال کی عمر تک پل رہے بچوں والی اونٹین، جارااور نِبُّت کا علام۔
    info: "جھنٕ وہ گائس کا بچہ ہوتا ہے جو اپنی زندگی کے پہلے سال میں ہوتا ہے。\nاس وقت اس کے بال لَفوف دکھائی دیتے ہیں اور وہ زندگی کے شروعاتی دنوں میں خود فراغ حصول غذا کرتا ہے۔\nمسیحیت میں یہ نِبُّت اور اللہ کے معصوم بچے کاناممثلاً ہے۔ \nبرانڈ انعام (جھنٓدے کا گوشوارہ ) مختلف آشپزخانوں میں مشہور طرح کا محبوب کھانا ہے۔"
  farm.llama:
    label: لاما
    summary: ایک جنوبی امریکی سمندر کے حشرات والانسانوں نے بال بنا کر پالا۔
    info: "لما جنوبی امریکہ میں انکاؤس کے ذریعہ زراعت شدہ خاص طور پر تقریباً 6،000 سال قبل استعمال کردہ دبلا واقف رہتا ہے۔\nاس وقت لمائیں آندز کے علاقے کے بنیادی موذون حیوانات تھے؛ اور وہ اپنے وزن کا تین فیصد تک برداشت کرسکتے ہیں。\nلماء کے بال درجۂ حرارت کی وجہ سے قیمتی چمڑا لگانا مشہور ہے۔ \nخطرہ یا عدم الرضامنٹ کی صورت میں لمائیں عام طور پر بلغم کرتی ہیں۔"
  farm.mule:
    label: میزک
    summary: گھوڑے اور ناچال کے مابین ترازو زادہ جانوروں کا باروزردار، مضبوط فرزند۔
    info: ایک mezok ہاس انوس سے ماخوذ غلطا miscellany ہوتا ہے؛ دن رات دونوں طرح کے خصوصیت والے ذبائح موجود ہیں۔ وہ بالکل حامل نہیں ہونٹ لیکن قدرتی طور پر مضبوط، مستحکم اور استوار ہوتا ہے۔ وہ مقامی علاقوں میں آسانی سے حرکت کرتا ہے اور عام طور پر گھوڑے کے مقابلے میں باخبر اور شائستہ رویہ اختیار کرنے والا ہوتا ہے۔ صدیوں سے وہ سنگلاس موذون علاقے میں متعدد ضرب الاعمال کے لئے بنیادی عنصر ثابت ہوا ہے۔
  farm.mussel:
    label: سلاوکا
    summary: ایک قابل خوردن سمندری ملز جب کہ اُتّھنے والی لینڈ پر تربیت دتا وݙندون۔
    info: "سلواجکا نام، اٹلانٗطِک رَشْد‏ي فارمz بچان زبرات حفظگاه، اک عام طور پر استعمال شدہ منجمد مواد اے۔\nاسنوں لمبن توڑ انقلابات اُتّھنے والی لائنز يا كولهروں ذريعيٰى دريا کيت‏ي حرکت سے تربیت دتا ويندا ا‍ء。\nويجه کثافت کمزور کرن دي ڳالھ هئي ايک صحت مند غذا وجوں ايسوائي ڪاربون علامت آهي۔ \nايسي مختلف روشنما ۽ قدامت پسندي مشروبات جو حصو ا‍ء مثل بلجنکي ماؤلس فريس۔"
  farm.ostrich:
    label: پشتراس فارم
    summary: چربی اور کولسٹرال سے ختم، پھل دانہ جاتا ہے۔
    info: |-
      ایک بادام نما حشر مینڈک کو تازگی برقرار رکھنے والی غذا کے طور پر استعمال کرتا ہے۔
      بادام نما حشر مینڈک کا ذائقہ لذت آفرین ہوتا ہے اور وہ زندہ قومی علامتوں کے روشن تصاویر بنائے ہوئے ہوتا ہے。
      حشر مینڈک کے بال عام طور پر شوقیہ لوگوں کے تحفے کے طور پر استعمال ہوا کروتا ہے۔
  farm.ox:
    label: بولا
    summary: کاٹر کیلے والے بچھڑوں نے تاریخ میں زراعت کانامم سب سے اہم حیوان رہنما بنائے۔
    info: "ایک بل، خصوصی طور پر جنسی قابلیت سے محروم شدہ بالغ مردار ذبحات برداشت کرنے والا درجۂ دوم حیوان ہوتا ہے۔\nاس وقت تکسیر وادی علاقوں میں زرعی فصلوں کی لازمی ضرورت تھا۔ \nابتدائی زراعت میں ان کی مضبوط اور غلامانہ شخصیت کے باعث وہ موذون کروالوں کے مقابلے میں زیادہ زمین کاشتنے کے قابل تھے۔"
  farm.oyster:
    label: کھالی مچھلی
    summary: ساحلی پانیوں کے جال اور تاروں پر پاลی سمندروں کی زمیندار۔
    info: فاسٹ فش، ساحلی آبادیات میں رسن یا قفسوں پر پالتا ہے؛ بالغ ہونے میں ٣ لے کر ۵ برس لگتے ہئيں۔ وہ پانی صاف کرتا ہے اور دریائے خود کو نظافت دیتا ہے۔ عام طور پر غیر استعمال شدہ یا پختہ حالت میں کھایا جاتا ہے۔
  farm.peacock:
    label: پاو دمک
    summary: نامور جانوروں میں پالے جاتے اس کے سرخ و خوبصورت بال توجہ حاصل کرنے کے لئے۔
    info: بھارت کا نسل والار بچھڑا، قدیم زمانے سے علاقائی روایات کا حصہ رہا ہے۔ مردہ فرد اپنا لمبا شاندار ذرات طوفان بناتا ہے جذباتی حرکتوں کے دوران انگلش آوازوں کے ساتھ۔
  farm.pheasant:
    label: بازارٹ فارم
    summary: یہ اکثر شکار کے مقاصد کے لئے پالا جانے والا بازانت ہوتا ہے۔
    info: |-
      چیک رپبلک میں، 'باݢنٗت عمومي' عام طور پر زراعتي حطب و قائم علاقوں تعلق دوسرى ضرب سے نشتر خورد بندروں دے لاءِ لوگ توڑون واليا ھلدا آهي
      اس کا منشاء ایشیائی ہے؛ رومی روایات کے تحت یوروپ منتقل کردیا گیا。
      مرد کا بالخصوص رنگ اور لمبی ذنب ہوتا ہے؛ عورتوں کا رنگ غیر واضح بندر ہوتا ہے۔
      'باݨَنت' کا گوشت معروف شکار ہے، جس کا ذائقہ خوبصورت ہوتا ہے۔
  farm.pig:
    label: پریس
    summary: ایک رُضّوں والا فارم جانور، جس کے پاس موم کے حشرات کھونے کی صلاحیت ہوتی ہے۔
    info: ایک درخواستی اور ذہنی طور پر توانا گائوٗ کا جانور ہے جسے گوشت کی فراہمی کے لیے پالا جاتا ہے۔ یہ تمام قسم کے غذا کھاتا ہے اور مشکل کاموں کو یاد رکھ سکتا ہے۔
  farm.pigeon_farm:
    label: ہومب دوامی
    summary: ایک اس قسم کا دراندوز جانور، مچھلی یا مقابلے والے پرواز کے لئے پالا جاتا ہے۔
    info: |-
      درندا براجمان ذرائع سمنٹ شاداب؛ نسل آزمائش کے دوران صدوق حضرت بن گئے。
      muscle (جوان درندوں کا گوشت)، مختلف ثقافتوں میں ترجیحی خوش طبعی کے عنصر کے طور پر معروف ہے۔
      racing pigeons فضول رفتار کے لئے منتخب کردہ ہوتے ہیں؛ بعض واقعات میں ان لوگوں کی رفتار 94 mph سے زائد ہوسکتی ہے۔
      domesticated doves، چین میں مضبوط روایات کے تحت مشغول ہیں۔
  farm.piglet:
    label: سیلے
    summary: گوشت کا جانور، عام طور پر رُضّنہ اور نشاط سے بھرا ہوا۔
    info: |-
      سلے دبئی حشرات مچھروں کے توانائی والے ذخیرہ ہوتے ہیں۔
      نو عمر وائلٹ فرشتہ ان لوکال زندگی کے دوران خودمختار بن جاتے ہیں。
      ایک عمارت میں عمومًا 45 سے لے کر 60 درجۂ حرارت تک موجود ہونے کا موقع ہوسکتا ہے۔
  farm.pony:
    label: پونی
    summary: بچوں کے سوار اور دکاندار مینڈھا جاتن والے بہت فٹ پڑوسی نسل۔
    info: ایک پونی وائیرس اندرلئے تقریباً ١۴،٢ ہاتھ (١٤٧ سم ) لمبائی والا گدّار حامل ذخیرہ ہوتا ہے۔ شیتلندز کا پونی سب سے چھوٹا ہوتا ہے اور اس قسم کا آغاز اس وقت ہوا جب برطانیہ کے شمالی علاقوں میں رہنا مشکل ہوجانا۔
  farm.quail:
    label: کرپلکا جاپونسکا
    summary: ایک چھوٹی پنے کان مینڈ سبزی اور مرغوبہ لئے فارم بند تربیت دی جاتی ہے۔
    info: جاپانی قراش، انسان نے استعمال شدہ ایک قسم کی گودام والی چڑیا ہے جس کی زراعت ان لوگوں کے لئے خصوصی طور پر کی جائے گی جو آوازوں کی وجہ سے مشہور رہے۔
  farm.rabbit:
    label: خرگوش
    summary: ایک خانہ بدوش خرگوش جو کھال، بال اور مچنے والی حیات نسل سے پیدا کیا جائے۔
    info: |-
      موجودہ زمانے میں دبئی میں موجود تمام قسم کے خرگوش ان علاقوں میں شامل تھے جہاں وسطی دور قدیم میں فرانس کے غیر منظم خرگوشوں کو استعمال کرتے رہتے ہیں۔
      خرگوش کی مختلف صفات، شمار، رنگ اور مواد کے بناء پر 50 سے زائد معترضہ نژاد وجود میں آئے。
      عمر رسیدہ لڑکی (جوان مرغوب) 4 سے 12 ماڈلز پیدا کرنے کی طاقت رکھتا ہے اور سالانہ متعدد وقت تولید کرسکتا ہے۔
  farm.ram:
    label: بران
    summary: اگن کے بالغ مردہ جسم میں لمبے سپرل رُوکھ والے بچرا۔
    info: "بران انسائڈ آواز کا بالغ مردہ حیوان ہوتا ہے،\nاس کے پسندیدہ تار دائرہ بناتے ہیں جو عورتوں(اووس) نہیں ہوتے\nیا ان کے صرف چھوٹے ہوتے ہیں。\nحتماء (خزاں) کے دوران بران خواتین کے لئے مقابلے میں \nسر اور روکھوں کے ذریعے واردات کرتے ہیں۔"
  farm.rooster:
    label: کوؤٹ
    summary: گھریلو مرغ کا جندر؛ اس کے پچورنا سے صبح کا وقت بتایا جاتا ہے۔
    info: "کوٗوت، گھروں میں پالے جانے والے مرغوں کا نام ہے، جو خصوصتاً رنگین بالوں، حلق دار منڈّل اور لمبائی والا ذرا بڑا عقبی حصہ لئے ہوئے شناسا جاسکتے ہیں۔\nپچورنا واقعی ان کا تابعداری کا رویہ ہے اور یہ فقط سورج طلاعت کے بعد بلکہ تمام دن کسی بھی وقت ہوسکتا ہے。\nچیک جمہوریہ میں یہ ’’انتظام‘‘ کا علمبردار قرار دیا گیا ہوا ہے، جبکہ چائنہ کے زودی악 نظام میں یہ ۱۲ جانوروں میں شامل ہے۔ \nقدیم یونانی لوگوں نے آشلسِفُس کو فرشتوں کے وجود کے معروف اشارہ کے طور پر قربان کرنے کے لئے اس کو استعمال کرتے تھے۔"
  farm.salmon:
    label: لوسوس
    summary: یک بڑا سمندری مچھل جو دریاؤں کے لئے تیرتا ہے؛ فارم پر زیادہ اُگایا جاتا ہے۔
    info: |-
      اندروموس لوسمن نامی مچھلی، سمندر میں بالغ ہوتی ہے لیکن شادی کرنے کے لئے وطن واپس آجاتی ہے。
      اس کی منزل خود کے رقبہ کو پائیدوار بنانا ہوتا ہے، جس کا تعقیب زمین کے میگناٹک فیلڈ اور بو دواسطے ہوجاتا ہے۔
      norway اور scotland میں لوسمن کا فارمرز حوالے سے پالشدن ان قومي معروف ماہی گيرى صنعت کا حصّہ ہے۔
      لوسمن غذائیت والی omega-three چربی کے احماض سے براجمان ہے جو صحت مند ہونے کے لئے ضروری ہے۔
  farm.sheep:
    label: بکری
    summary: ایک بالوں والا کھالہ جانور جس سے اُگل اور دودھ حاصل ہوتا ہے۔
    info: بکری اُگل، دودھ اور گوشت کے لئے پالی جاتی ہے۔ وہ بچروں میں رہتی ہے اور تاریخ میں پہلے گھروں والے جانوروں میں سے ایک ہے۔
  farm.sheepdog:
    label: چرواہے کا کتا
    summary: ایک ایسا کتّا جو خصوصی تربیت حاصل کر رکھا ہوتا ہے، بطور ذمہ داری مویشی مینڈروں پر نگرانی و قابومandi۔
    info: "بوردر کولائے سب سے زیادہ مشہور چراوا کا کتا ہے، جسے آنکھوں کے استعمال اور چپ لفظي اختیارات کے ذريعيٗ مويا شماره کنٹرول کرنے کے لئے پالا جاتا ہے。\n\nاس طرح کتنوں کے تمام فلسفونز مين سے سبقتي عقلمندائي کا معروف نمونہ ہے۔\n\nان کتنوں کی محنت کردغیر کام کرشميتوں کو بالغوں کے وقت سے ہی منظم اندازوں کے تحت ترقى کرنا ضروري ہوتا هے۔ \n\nبرطانوييه ميين 'مويا شماره' مقابلے عام لوک.popular sports."
  farm.silkworm:
    label: بُرچ موروکس
    summary: برچ مو روسی کا تار پیدا کرنے والا جانوروں والات اِستعمال.
    info: مو بومباكس موري سے نکلنے والے برچ مو رو شويٗن، فرشتہ کا خاص طرح کا انداز حشرات کھانا۔
  farm.sow:
    label: پرنسنیس
    summary: ایک بالغ خاتون سوئین، بچّے کا ماں۔
    info: "ہوم پورک جانوروں میں ایک بالغ عورت دبلاڑا ہوتا ہے。\n وہ صرف تقریباً دوسال بعد حمل رکھتا ہے اور عام طور پر گود لینے والے نوزائیدہ کی تعداد دسوں سے چاردوں تک ہوتی ہے۔\n زراعت کے شعبے میں ان کے فروخت کرنے کے عمل کو غیر ضابطہ قرار دیا جاتا ہے کیونکہ بعض وقت ان کو تنگ جگہوں میں روکنا پڑتا ہے۔ \n ان کی ذمہ داری مناسب حالات میں موجود ہوتی ہے اور وہ عام طور پربچّوں کی دیکھ بدل کرتی ہے جو ١٢ سے ١۶ ہفتوں تک جاری رہتی ہے۔"
  farm.tilapia:
    label: ٹیلابینا
    summary: ایک تپسیرہ جو ماحول کے سارے حصّوں وچ پالن لگائی اُتردی آ۔
    info: تھلاپئ نائلنسکا دوسرا زیادہ فصل روزانہ حاصل کرن والی مچھلی ہِے؛ لاکھوں تن قسم د‏‍ برس تو‏ں حاصل کيتيا جاتا ا‏‏ے۔ اندازًا افریق ٗ، نیلن منشأ ہندی اَوازاں چ پرورش لگن لاء عالمگیر طور اُتے استعمال کيتيا جانداس، اوہ صحتمندانہ، ترقی د ‌سرعت تو ‌اور غذائی ضرورتوں د ‌قلّت د ‌خصوصیات والا ہوندسا۔
  farm.trout:
    label: پسٹرو
    summary: ایک لمبی مچھلی جو فارم اور آزادانہ پانی دونوں میں تربیت کے مقصد سے پالی جاتی ہے۔
    info: ڈائونز رنگدار بیرفائن شرقِ شمالی امریکا کی نسل ہے، جسے خصوصی طر ح غذا کے لئے فارموں میں استعمال کرنے کے لئے یورپ میں لاوا دیا گیا۔ عام ڈائونز (جھری والد ) ان لوگوں کی قسم ہے جو صاف اور تیز حرکت والا پانی وقفہ وقفہ سے موجود ہوتا ہے۔ دونوں قسم کے ڈائونزوں کو عالمی معروف کھلاڑی اور ذائقۂ خوشگوار مچھلی کے طور پر زیادہ قدراً قدر دیتا ہے۔ چیک جمهوریہ میں ڈائونزا کی تربیت بالخصوص پہاDick کے خطوں میں روایتی منشأ ہے۔
  farm.turkey:
    label: کروچن
    summary: ایک بڑا خاندانی پرندہ جسے مخصوص طور پر تھینکسنگ دوسرے عید کے موقع پر گوشت حاصل کرنے کे لئے پالا جاتا ہے۔
    info: دائرۃ امریکائی فوجدار، 'کروچن' میکسیکو سے آتا ہے جہاں ۲؍ ہزار سے زائد وقت قبل نومادز وارم لوگوں نے انہیں قابض رکھا۔ مرداپن کے منفرد شناختی علامت اور ذرا غصّے میں بال آخر کو واٹربیرل مثلث بنانے کی صلاحیت معروف ہوتی ہے۔ امریکا میں یہ تھینکسجنگ دوسرے عید کا روایتی کھانا ہے؛ دُنیا بھر میں یہ دوسرا سب سے عام خاندانی ماشواح جانوروں کا درجہ رکھتا ہے۔
  farm.water_buffalo:
    label: بُوفالو
    summary: ایک بڑا ایشائی جانور، دلہن کے میدانوں کا بنیادی پٹھوا۔
    info: |-
      گھریلو بوول آسیاء کا بنیادی زراعتی حیوان ہوتا ہے۔
      اس نے سینکڑوں سال تک رائزر فارم کاشت کرنے اور مواد منتقل کرنے کا ذکر کرتا ہے。
      اس کا دودھ گائے کے مقابلے میں زیادہ چرب ہوتا ہے اور 'موتسلا' درجۂ بالا لازمی طور پر استعمال ہوتا ہے۔
      بھارت میں یہ عقیدہ عام ہندومت کا قدمبردار حیوان ہے۔
  farm.yak:
    label: jak
    summary: ہمالیہ کے علاقے میں پائی جانے والی لمبی بالوں والا بوفالو؛ دودھ، گوشت اور مواد فراہم کرتا ہے۔
    info: |-
      جک درحقیقت تبت کے نچلے سطح زیرزمین پر موجود 4800 میٹروں تک بلند مقامات پر رہنے والے یق حیوان کا خاندانی شجر وارث ہے۔
      یہ تبت کی معیشتوں کا بنیادی حصّہ ہے؛ دودھ، گوشت، بال اور قدرتی طاقت فراہم کرنے لازم آتا ہے。
      اس کے بال بڑے چلتے ہیں اور ان کا استعمال گرمی کے وقت بنا کر استعمال کردیاجاتا ہے۔
