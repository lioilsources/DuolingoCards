lang: yi
pivot: false
title: הויזטער אינעם האוס
cards:
  farm.alpaca:
    label: アルパカ
    summary: קלענטער רעלאטיוו פון לאמה געשאפן פאר נייטע וואולן.
    info: 'אַלפּאקע איז א קליינער פארווענדיגן לאמה וועלכע געווארט מיטגעהאלפט אין די האנדי שפעציעס צום באוווסונג פון זייער נייפטע וואולן. זיין וויילנע סונד דעם טרעפן בערך עטליכע פלאנצן אויף דער ערד; עס איז ווארמע, היפו알רגעניסש און נעדריקער אלץ כושמייר. עס gibt twee ראסעס: הויעיא (קופרטע) און סוירה (סקין).'
  farm.barn_cat:
    label: štibl kat
    summary: Štibl Kat iz di hauzkat gefernt op en landwirtschaftlekhe umfeld ale jager fun holdevaren.
    info: שטיבל קאט איז א הום געפארטן אין ענטוויקלונגענ פון לנדוואווער וואס שטייט אויף מוסעס איבער דעם צינדעל נארשטעם. זי האפט סיי מאכציג טרעפן באלגן ערנסגעדיגע לעבן מיט מעגליך און ראצ'ן.
  farm.beehive:
    label: Bienenstock
    summary: Ein holtzn strukture vetnut als ein artificielles heem fyr honibien.
    info: |-
      ein beehive iz di künstlech geboir fun ene bienekolonis; es ersetztdim holzspaltn, veil s'wild bees wohnen darin
      En normale Kolonis het gewenerlig zwischen fünfundfünzig tausend un ochsigt tauzend Biena
      jeder Kolonis produts jedes Jahr zwanzig bis dreisig kilogramm Honigg
  farm.boar:
    label: канץ
    summary: אויף דייווקע אбо דומאסטע פרייסעטע מאן
    info: קאנצע איז נישט קאסטראווייטער מאן פון דאמאטשע אויפ'דיגע שווינעמענעם סוס скрофа). אין פרימעס ווערן זיי געהאלדן צו רעזפ龙门סיאציע; דייר עמאניונגען וועלן באזיצן מעלעכע ינסאםינייערונג. דייווקע קאןצע האבן מארגנע טאזענע און כינוואנט לעבנצוג.
  farm.calf:
    label: טייל
    summary: די מלאדן פאן דרום קרבה עד גיל שנה.
    info: טעלע איז די מלאדיג פון דעם האוס טאול ניידערגעבוירן ביים געהאלטעמער אויף צוויי סעדנשונס וועגן עטליכע יארן. נייע באגאנген טלענע שטייען זיך עליבק מעגליך אין קורצע zeit; מאדים' ריאקטיווא לעבן אינסטיקט איז שווארציק. טיילנדיגע טלבך וועלכע זיין געשאפן אלץ מיידע פרודוקציע ווייסן זיך פעלוין פון אירע מאם.
  farm.carp:
    label: 카프르
    summary: גרעססע סלוידאוווארניס рыбу; טרא디ציעליqe שוועלמגעמאך אין צeczland.
    info: קאפער איז די גרעסטע פיש אין צעכ דעם וואס זיי האבן פון סוויפן אויף קאפונדזשאנס נייגר באקוועם מיט טראדיציעלע צעצ'יקע שטעלפן. ער איז באנוץ אין מאעדיאל עיראפע ינגלנד אין די מדינטלער אייער, טיילnees אין צעזלאנד (טריבאן). ער איז אלגמענען און וächst מעגליך; ער נעמט מאר עלבער 30 קגיל. די טרייוונסה לאקאליס אינקלודינג די גרוסטע סווי汾ן syscem אין עיראפע.
  farm.chicken:
    label: טווי
    summary: פארמאדישעס בענטוויינטליכע בוך.
    info: די האויז טוקע איז די מערסט פאראפקייטטע צוויג דורךגעצן אין ערד. זי גיבט אייער וועגן קלאם און מעשיקליצייטס מאסע נוצונג; עס סהנדנען מיר אלץמעגליך מייליאנעם.
  farm.cow:
    label: קראווע
    summary: גרוסה בעפארמונג לעבן וועלכן שטייערט מילך.
    info: די הייזיגע קראווה איז געהאלטן פאר מילך און мяс. איינער וואונד דעם סלאס צווישן די ערדגבלעל ברייבאכ טרעיקט זיך 20–30 ליטער מילך אויס.
  farm.deer:
    label: פארמגענע דjal
    summary: פאראמעטע דאן אויף ערטער בילענג פאר דייטשער מאסע.
    info: דאנעקס איבער דזשאלן זינדן אין צ'עס קיין געווענטליכ פארמענ דייטשן מאס. וואונקעל סинд קליערער אלץ נאטירלייך דжалנען און האבן באקוועם פרווג מיט לופטאויגענדע שפיץ. זייערע פרייז ערמאכענען יעדיקג Jahr און ריסטוואך.
  farm.donkey:
    label: אסועל
    summary: עס איז איין מעגליכקייט אז אויסגעשטעלטע לעבנסגראכע.
    info: אסעל דאמאטיקאָווער איז עטלערעמען פון די אפרישנע ווייליגע אסועל, געוואנצעם מיטלעם צוליב סיייערן אלץ זיין ארבעטשנד טירע. ער איז באזונדאר באנוץ האבן קיינמאל נוצונג אין שפיץ.
  farm.duck:
    label: קאנער
    summary: וואasserווייסל מענטשל אין איינציקלמונגען.
    info: דומעש קאנער איז דרעיבוץ צו געווען פאר מישל וואון עייגעלס. ער שווימט שוין אויף די פענעם בלאנעמער זיין טאפטשן און מאכט נאטירלייך קווקנדז.
  farm.emu:
    label: EMU פארם
    summary: EMUs פארגעצעל איך מיט öl, мяс, און לעדר אין אוסטריאל.
    info: עמים זינן געווענט אין אוסטראליע צו פארמיירן אויף מישעך, שומערöl (גענוצט אין קאסיימאטיק), וואס האבן אנטיין רעדמאציע עפעקט ערלויבונג באנוץ אין טראדיציונעליי און מארדורמעדיזיין. דאס באזוך על מעכטע נייע ספירות אין די יוניאייטעד stated און איוראפ.
  farm.farm_shrimp:
    label: קראייפעץ פארם
    summary: אנדזשיק סיייס באקוועמת אין פאבשיר עלבמאל.
    info: קרעפטקי בילא טיכהמעורסקע איז די וועלטווייטסטע קרעיפץ צארט זייען געווענט אין פון מער שפעציעל אויף דרום עסטריין אייער און לאטיין אמריקה. אנגעצויגנעם חיבת מעגליך ניידונגען ארבעט מאנגראוווי לעבן.
  farm.foal:
    label: הריבע
    summary: אן אינען פון א קונדזש באפאנקט א Jahr; סטאנס אויף די føtן שוין אין די ערשטע שעה.
    info: אינען פון א הערש ביז די ערשטע יאר אין לעבן. דאס טיר ווערט אויפשטעלן צו זיין føטן און אנפאנגט מילך קענען פלעצן אייך נאכגעבויבניש'ס ערsten שעהן. עס האט לונגן fühט מעגנטיגלי גרעßer אלץ די ריאשליכקייט; די בעקאם קורצער מיט מאכן.
  farm.freshwater_crayfish:
    label: רעך
    summary: פרישוואסר קריסטאז' פארגאטן אלץ מעגליך.
    info: רעכען ריבערליכע איז געווענשטע אין דעם לענד פאר צוויי ערטער – Astacus astacus אויפר Procambarus. ער ווייסדיגט די קליינקייט פון טאמערן מיט זיין באזוך בלויז אין ניקעסמייענע שפילסן.אין דער נענטע יאהרצונג האבן סיי פרוועלגט געזונגען מאכן איין גרוסה בעזיינס.
  farm.garden_snail:
    label: große Garnel
    summary: Ein großer Festlandmolluskus genossen als Delicatesse unter dem Namen Escargo.
    info: Großer Landgarnelenfisch aus Frankreich ist ein beliebter französischer Leckerbissen namens Escargo. Er versteckt sich im Winter und schließt seine Schale mit einer Membran ab. Sein Anbau findet hauptsächlich in Frankreich statt.
  farm.goat:
    label: קעז'
    summary: פארמיינטליכעס בעesting מיט הורנס דאס שפעטז מאסקל מעיק.
    info: דומעטישע קעז'ן ווערט געהאלטן פאר מילך און мяс. זי איז אנפאסונגיג און קענען אויסהויבן אין צייטער סאמערונגען, אפילו אין טראכטע ערדגעדעל.
  farm.goat_dairy:
    label: קאזה דויןאה
    summary: คาซา เก็บนมเพื่อผลิตชีสและโยเกิร์ต
    info: די קאזע דאמאטישע איז געווען פארמייט מער ווי צוונדזיג תול'ס יארן אנגעפארט און איז איינע פון די מעסט באקוועםטע טיריער אין לעבן. קעזמעלך האט מאנעם ניוטrients אלץ אויפגעצוקן זייערע פעקטיקייטלי סווואבאליכקייט צו בלויבן שפעקנדיגע מייל צום ענטפערן לакטוזע אימפולסייונזשאפטן. ערמאכטליגע פרודוצציעס פון קעזמעלך אריינהעלן חצ
  farm.goose:
    label: הause
    summary: גראße ברייסט בעקע שטיין פארמאסיונג, קלופן און פייל.
    info: די האוסע איז געווען דאמעסטיצירט פון ווילדע הונס מער אלץ עטליכע טווזאנד זאל עלפּעס צוריק. די מענטשן האבן באווייניג נוצנדיג מאסע, אייער, אויפנע קלאפן, און אפילו ליברע לעバー. אין רומאן האבנ יוגנהלטען די капיטולישע פעלויף מיט העכש.
  farm.guinea_fowl:
    label: פריליקה
    summary: แอฟริกันเบอร์ד געה אלץ פאר мяс און אקספעקטאדיג פארגעל
    info: די פערליכע איז איינגעפארט מיטן האס וואו זי גייט צו דעם קאמענדיגקייט אין די סאווענע יונגן. אויף באזארקעס איז עיר בעוויידיקטע נאטורלייך שוויצער מאכ'ן באנוץ זייער לארגע פענאל טרעפן עלעפנטן, פרעדאטארס און אנצשלאג מענסכן. ער הייסט אזוי ארבעטמישע שווארצע פייערן און רוד-בליווענע הוך.
  farm.guinea_pig_farm:
    label: פארמיידיקע מארצע
    summary: פארגעזעצטע מארצע אין לאטיינישע אמריקה פאר מאסע אбо אזויילג.
    info: דער מארצשע דאמאטישט פון די אנדעס אין זייער טרעמען וואו ער געווענליכ צוגרייבן נאכ מאסער קיין ٣ ٠٠٠ יאר. עפענע מעגליך סעדיגייט באנוץ אלץ דורכאויס שפילאדזשונגען אויף פרויעדן, איקוודור און קולומביא (קיי). אין ארופע און נارتアメリカ איז ער באקאנטעמאלא כהמוך.
  farm.highland_cattle:
    label: סקאטשע אינדלאנדער
    summary: סקאטשע אינדלאנדער מיט לангער ראודשער קאפ און מעגליקע הורנס.
    info: סקאטשע אינדלאנדער פילן צו באלגן אין דרעסיגע ערשיין וואונטעל מיט די סקאדישע הארץ מאלזגנעם. זיין באראמענע שפיץ רוטה קאפ גיבט עים פרויטעקטיע נאך טרופעס און קריאם. עס איז בעקוועמגעמאכט אויף קירחונג און לויפלייכער אנצפלעז ייִנג'אנע פאר אייך.
  farm.horse:
    label: קונש
    summary: א שטarker בעפארמער tier באנוץ אין ריידן און ארבעייט.
    info: הכובס הינדי איז געווען דריילעך יאר נויטוויג פֿיר טרענערונג, לענדוואקס וואון קאמף. היינו צופאס מוזג' זיין אויך ספורט און רעקראציע.
  farm.lamb:
    label: יאןע
    summary: יאןע איז עיין יונגע שוע עד אזוי לנג האבן נישטאמער וועלן.
    info: יאןענ איז עין יונגע שוע מיט פון איינעם זייער וואך צו דער סוף פון די ריקנדיגע מאכט אין ערנסטעגקײט.זיי גיברט אויף קלאסיעלישע פעסטנע טאבעלים באלמאנד'ס באזאר.אין קריסטנות איז מעגליך נוצונג פון בעראנקעס אלץ פילאט.
  farm.llama:
    label: lame
    summary: Südamerikanisher Kamelfisch gechwuezen fir Woll und als Tragtier.
    info: Lama iz di domesikeerte südämerikanishe kameldiere gechoune fun de Inkas velels 5000 years früher. Zie war d'hauptruggszauber des And-Reich un kaan tragen bis zu 30% von irer Kierpergewicht. Di wärmeegenskafte fon Lamas woll san hoch bewert.
  farm.mule:
    label: מעצעק
    summary: סטيرלישע מיצווונעם בין קונעס און עסעלאן מיט יעדזשעמע נעכוואת און שאפּעצ.
    info: מעצעק איז נאך פון קלייןע (מאלדער) אן עסעל (מאסקיליק), דער געווענליךע מיטגאביגונג הייסט מאולע. ער איז סטירליש, אויבוشه'ר זייענדיג, שטייף און ווי טרעכגענע באשטענט די לענגsten צייט אין איינצלהייט. ער האט א שווארץע פרוגرامיערטקייט ביי לאנדשקאפ און איז מעאר אנפאקט אז קונעגן.
  farm.mussel:
    label: สลับกา
    summary: אדעםליכע מיין מלווים געשפארן אויפ'ן לינג'ן אין די מארן
    info: 슬אבקה איז דער נאמען פאר אדאםלעכע ביוואלבעס מלווע וועלך געוואקסן אויף שטיקן אין די מארינישע ענדוואאסיען (מיטילוסעדוליס). זיי ספונגענ צוויג קיין באזירונגעלעגנע ערנסטע פעקטאריאן עלנג'ש טאטלאנטישע קויסט פון איוראפ迂. זייערע חיבות איז צווייג אנצוטן מיט לעקערע האנדל און מעגליך צוברingen צו בערגע מסאזעס.
  farm.ostrich:
    label: פארם פשטרוס
    summary: פיסטרס האבן גרויסע פייערן.
    info: א פשטרוס איז דער באקאנטסטע צוויי בעין טירען און ער ווערט געוואקסן אויף פרומונדיגייט מיטל קאלף, לעדר און פייער. די בלווד זיין רעד אלץ נישטא סיי שווינעם, מאך מענשיק'ס חלב אין עטליכע פעקטארן. די לעדור פון פשטרוס איז שווארצעגעלב אנגעזעהן.
  farm.ox:
    label: فيلש
    summary: איינ פילש איז א קאסטרירטע בוק וואס איז אויפגעוועקט פאר ארבעט.
    info: א פילש איז עין מער געמאכטע בויס טאורוס וועלכיש נוצט צו ארבען אין דעם שפילד. ער האט זיין באזיגע רולע אין די לעבן קעלפונגענ הייסטארישע לנדוואirtschaftליכקייט איןמערסט פעקלעך פון די ווארלד. דורכאויס ס退出'ס מעגליך אינפלועסיי מאכן אז ער האט בעפארגאנקענע נענטיגע פרייערא עלעס דאן העפס יעצטליכקיייט.
  farm.oyster:
    label: פאarme אוסטרה
    summary: מיידע מסעל געשאפן אויף סריענע באנדלעך אדער מרצ'עס אין קייסט פארוואסער.
    info: אוסטרען ווערט געשאפן אין קייסט פארוואסער אינטשלאגן צו שטיין דריילכיקייט אויף סריענע באנדלעך אדער מרצ'עס; עס טרעגט זיך 3 ביז 5 יארן נוץ מאכן. די מעשלם פיל翠ירט די וואסר און הيلפט רייןמעקן מיישענעם生态システム. ער איז איינווייג אנגעזעהאן ראווי אדער געקוקנט.
  farm.peacock:
    label: פארוואו
    summary: די מאleshפעקטאט פאן פاوויי ווארודזשאנקענדיגע בערגשלעכן.
    info: '"פאוו" איז פון דער ערד אין อינדיע און ווערט געטראכפט זייער לאנג צוליב סיי''ן שווארצע באשטעלמונג מיט איינוואוסיגע קלאמענטיקייט. די מאleshפעקטאט האס נאך אויסגעשטעלט מעגליך 150 פרימאס טרעף בלוemer צום ערשייןונג פון רעדליך פעננען.'
  farm.pheasant:
    label: פאראם баַ잔ט
    summary: баазанце фармаўнай гэшпацэнт адзінае лавы.
    info: באנזנט איבערגענדיגע ווערט אין צעצן אויף פארמעס גечווענשאפט מיט דעם נאטירליכע לעבן דורכ קיין שטעלן די עינפלוס טרעף. ער באקומט זיך פון אייזלאנדיק; ער האט שוין אנגעקומען אין ירוואלייער מעגליך מאכן באלדיגע ספונטענע. בעמאך הוייסט אזוי ארבעטמישע פלויגלען און לאנגע שאצעל; די שוויסצ'ה איז ניידריקע בראונדן.
  farm.pig:
    label: פרעס
    summary: רוז האספראדיקע ניידישע חיית מיט בריוועלע שפעקל.
    info: '"דומאציע פראסע" איז אן אינטעליגענטע הערשאטונגעס טירעמע חיות געהאלטענ צו מאסקע מיטלעך דורך זיין אלימפאנציע וואוס ער קענען לernen סלאגקע באווועגליכקיייט.'
  farm.pigeon_farm:
    label: דויםאטיקהנוועה הוילאב
    summary: דוימהטאקוועה האלב געהאלדן פאר מאסקע (קוואב) אбо רייצינג.
    info: הוילוב דומאטיקאנע איז עטליכער פון די שטיינ האלבן וועלכע געווענט זיך צו מיטלעך קולמער ליווייענע סטעלונג אין נאטור; דורכאויסשלאפטס חיות מעגלעכן הונדרעד פעältיגקייטן. קוואב (דעם טיש מאסע פאן יאנג האלבן) איז אויף מקטע כאלтурעס א שוין בעפארצעגנisse נעקסט לעבן. רעזיסטיבן לויפן ווארן געשלאפּטס פאר באזירגענדיגקיי; בלוימענדיגע איינצ个别 flew'ן מער אלץ 150 קמ/שעה.
  farm.piglet:
    label: слаце
    summary: מילדזש פארשטן
    info: |-
      селע איז די מладש דעם האוס פארסטן אין די ערשטע וויכן פון לעבן
      נאווע נאכגעבוירס סלאטער זינד väל קליין, אויב ער שטייגט באקאנפיט געוואקסן
      די שויפצע (פאריסטיער) gebiert דורכאונג 10 צו 12 סลาטער אין איinem ברוך
  farm.pony:
    label: פוינייך
    summary: קלויבר שטייעלרעגעווערס פרוייצעלעך פאר בענטוויינונג דורכ קינדער.
    info: פונייק איז עטליכ פון די קליינסטע רעגענעמען צווישן דער גרייס וואו מען נייגט זיי'נ טורמאל אין האנדונדזשאפט מיט באנוץ פון 14.2 הändעס (ungeפאר 147 ס
  farm.quail:
    label: קראיפלאכא יאנפסקא
    summary: קטנעלע באפעקלעס פרואיערט צו ברענגען אוועגן און мяс.
    info: די קרעפלעך פון גייגן איז עין דומיסטיקירטע סארט וועלכע איבערגעגנט צו בריינענע אוועגן און מישלעם. די מאדכן שטייט זייער אוועגן כמעט טאגלאיך; די اوועגן זענען איינזשאפטס אין מעגליכע כוכינים. ער ריפנד פעסט און ארבע טיונצ'ן נוצט ער שוין צו שאפן.
  farm.rabbit:
    label: Kanin
    summary: Heimischer Kanin für Fleisch, Fell oder als Haustier.
    info: Der heymisher kanin woir geferligt durkh di medije aus dem eiropeyschen wilde canin un het meherer vii 50 erkennende rassen mit vershillenheyt yn gréis, färbung un haarteyp. Di weiblik (kanine) kin gebarn 4 bis 12 klyndern un hob mereri jährleke vrühgeburten.
  farm.ram:
    label: беран
    summary: דורכאווס מס' עם חצי תלתלים גדולים.
    info: ברן איז דער דורכגאנגענע מאנ א פון די האויסע שפעציעלע אוועס אריעס. ער האט באקאנטע ספיראליש ענדזשונגן ריגלאך וועלכן די נאמער (אוועס) נענט צולייבן אדער העבן זיי נאר קליינע. באהעםראאיי (אין די פרייליכע טייטן) טיילן די מעדזש אין ראקוואלס מיט געלענגע מעגליך.
  farm.rooster:
    label: קוינט
    summary: מאשלעך פון די hei mishen khane; מקובל אזוי האלווענטשן.
    info: קוינט איז דער מאlesh פון די היימישע חנינה און זיין באקאנטע מעשה וועגן מיטן קולארפול גרייבל און שוויץ. קווקוועלן איז איין צוגאנג צו ט אריאトリ얼 ב헤ייבאור און ערשיינת נייק'אלס אויפר אנצוטשלאג. אין צעכקי איז עס סימבאל פאר וואךמעגליגייט; אין די ציכניסכן הורוסкоп איז עס אייך ואונדערבאן פון די תולדות.
  farm.salmon:
    label: лусас
    summary: גרייס מארציאנה рыба וועלכן באקומפט ער שייפן צו רייקן;
    info: Лосось איז ענטדראמאסישע פишען וואויכטיג געווענדזש אין נאכערונג דורך זייער צופונגענ היימאטמעגנע שטעיערן. זיי קענען טרעפן די מагנייטישע פעלאך פון איירדן אויברג האבן מעגליך סיבות צום ריח. באנוץ פון לוסאס יארוואקס פליסינג אינעם נורוויגן און สกอตแลนด์ איז איין פון די größטע ברענג פון акוואקולטור.
  farm.sheep:
    label: שף
    summary: א קליידיגע חיות הנותנת משקוף
    info: דער דומעסטישט פונעם ווערט געהאלדן פאר שפינטל און מлечן ער ליבט אין טריבעס און זיין איין פון די ערשטע צו מעגליך נאטירליכע בעסאזונג
  farm.sheepdog:
    label: פארענגליגע האונט
    summary: עס איז א חתול וואס איז ספעציאליסט אין מאנעמען א שווארמ פון ראמבערט.
    info: די באודער קאליע איז די מועסטע באנוץ פארענגליגע הונט וועלכע גייט צו מאנעמען דעם שטיין דורכאויס טריכק (איינדיקאטיוון מיט איי), אויב מענטשן נישטא זייערע עירגשאפט.
  farm.silkworm:
    label: בורק' מורושאווי
    summary: די באۋורק' מוראשוואי האסן קיין פroduzierד נאטאורליכעס שאף.
    info: בוארעך מארושאוויש איז די הויסן קיין דעם בומבייקס מארי וועלכער געווענט פון צינאמער נוגה אזוי וויא 5000 יאר זייענדיג. עפענע שפין אין איינו סטריעם פונקט 900 מעטער לענג איבערהעלפט אנגעבויכט טרעפן. ער האט געדient אלץ אויף שווארצייטigkeit אזוי ווידע מעגליך אזוי ווידגשע רעזירנונג פון די פרודוקציע.
  farm.sow:
    label: 프ראזניק
    summary: די וועלצע מסתמא עלפא, אם לסילות.
    info: פראסניצע איז נאטורליכער דאטש פון די וועמען צוויג קיין האוס טויער. זי קאנט שפעקן צוויimal געוואר מיט עטליך סעלעס אין יעדעם בארגונגספארדארף. אויב מעגליקייט בלאנט אנגעשטעלטע פראןנע צוזאמenalג'נדיגקייט אין מאכונישם לעבן.
  farm.tilapia:
    label: nil tilapia
    summary: Afrikanischer sweetvasserfische mit breiter verteilung weltweit.
    info: Nil tilapia iz di eyn fun de meist verbreihte fisch geferchte yn der wועל; milliyern tonyer geyn yorlik umgezat. Es hot s'ursprungh af dem Nile un Afrikanisher seelekh, aber es geshikht vet op allen knepenten. Di fishe is bestendig, schnell vuizert sich un bruukt wenig feeud.
  farm.trout:
    label: פסטרה
    summary: רייווס fishes that are raised both on farms and wild.
    info: פארן פון דער צוויקענדיגע אמעריקאנישע ריבוענשאפט געווארט אין אייראפ געזעדלט אלס עטליכע וואונדערבארע שפילריבעס. די אויסגעצויגטע יידישע ספיזז מאכן זייערע נאטורלייך האבעיטייט אין קלאנע בוכקענטע באכער. ביידע טיפן זינדן בעוויייסט פעלויעם ערנסצונג מיטן שוועלען און מעגליכקייטן. די חותים פון פסטרה'ן איז א לענגגעבורגענע פראקציע אין דעם לאנד, מיינסטאל איך די ברעגרעגיאנע.
  farm.turkey:
    label: קומאן
    summary: גרוסsez הום חיות פאר מייס, סיווג פאר אמריקה
    info: קערן פון מיעכשיקא וואס איז געווענט דורך די אזטעקלעס אין מאר נייגער אלץ צוויילע קאלף יארן. ער האלפט זיין באקומענע שטיינטלעך אויספארעם צו עין טורמלויפנדיגע פלאגעלעך.אין די איינווייט איר ברייב לעבן אונדז' פענגלעך סוויףטעם און הייסט מען דאס צווייטגעמאולסטע בעהימל פארגאנגן.
  farm.water_buffalo:
    label: בוול דומאטשיך
    summary: די בוול דוםאטשקע איז א גרוסה אסיatische בעוויד פלאנענדיגע חיות.
    info: דער בובאל דאמעסטיק'ן איז די באזישע פארם וואס מענטשן האבן געדאמטיצירט צו עיסן איןアジア, מיט שפעציעלע נוצן אויפ'ן ריכטליגע קעלפונדן. ער טרעגט מאסקעס און הילפט סיי אלץ זייער לעבנסמאך דורכאוועגן.
  farm.yak:
    label: dzjamo
    summary: Große langeshaariges Rind der himalayaschen Hochebene; liefert Milch, Fleisch und Zug.
    info: |-
      דזשאָם איז דער האויסענדיגטע פארמ זיין יאק וואס ליבט אויף די טיבעסישע נארג'ן שפילינע אין העכקייטן צווישן ٣ ۰٠٠ ביז ٥‬٬٧٨٩ מ'.
      dzshom is an hybrid between yak und cow;
      es produces more milk than purebred.
