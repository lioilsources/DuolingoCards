lang: de
pivot: false
title: Haustiere
cards:
  farm.chicken:
    label: Huhn
    summary: Haustierart, die Eier legt.
    info: Das Huhn ist die am weitesten verbreitete Geflügelart der Welt. Es wird gezüchtet für seine Eier und sein Fleisch; es gibt mehr als 25 Milliarden Tiere.
  farm.cow:
    label: Rind
    summary: Großes Nutztier, das Milch gibt.
    info: Das Hausrind wird für seine Milch und sein Fleisch gehalten. Es ist eine der wichtigsten Nahrungsquellen weltweit; eine Melkkuh kann täglich 20 bis 30 Liter Milch liefern.
  farm.donkey:
    label: Esels
    summary: Ein robustes und zuverlässiges Arbeitsgetier mit sicheren Schritten.
    info: Der Hausesel ist ein domestiziertes Tier aus der Gattung des afrikanischen Wildesels, das seit Jahrhunderten als Arbeitstier genutzt wird. Er ist widerstandsfähig, vertrauenswürdig und fähig schwere Lasten zu tragen.
  farm.duck:
    label: Gans
    summary: Wasservogel mit flachem Schnabel, der auf Farmen gehalten wird.
    info: Die Hauggans ist ein Geflügel, das zur Fleisch- und Eiergewinnung gezüchtet wird. Sie schwimmt gut dank den Schwimmhäuten zwischen ihren Zehen und gibt typisches Gackern von sich.
  farm.goat:
    label: Ziege
    summary: Haustier mit Hörnern, das aromatisches Milch gibt.
    info: Die Haunziege wird für ihre Milch, ihr Fleisch und ihren Wolle gehalten. Sie ist anpassungsfähig und kann auf unterschiedlichen Vegetationstypen überleben, einschließlich trockener Gebiete.
  farm.horse:
    label: Horse
    summary: Strong domesticated animal used for riding and work.
    info: The domestic horse has been essential for transportation, agriculture, and warfare for thousands of years. Today it is also bred for sports and recreation.
  farm.pig:
    label: Schwein
    summary: Ein rosa Haustier mit knorpeligem Schnauzbart.
    info: Das Haus-Schwein ist ein intelligenter Nutztiertyp, der zum Fleischgewinn gezüchtet wird. Es ist Allesfresser und kann komplexe Aufgaben merken.
  farm.sheep:
    label: Schaf
    summary: Wolliges Nutztier, das Wolle und Milch gibt.
    info: Das Hausschaf wird für seine Wolle, sein Fleisch und ihre Milch gehalten. Es lebt in Herden und gehört zu den ersten domestizierten Tieren der Geschichte.
