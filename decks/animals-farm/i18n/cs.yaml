lang: cs
pivot: true
title: Hospodářská zvířata
cards:
  farm.cow:
    label: kráva
    summary: Velké hospodářské zvíře, které dává mléko.
    info: Kráva domácí je chována pro mléko a maso. Jeden z klíčových zdrojů potravy na celém světě; dojnice produkuje denně 20–30 litrů mléka.
  farm.pig:
    label: prase
    summary: Růžové hospodářské zvíře s chrupavčitým rypcem.
    info: Domácí prase je inteligentní hospodářské zvíře chované pro maso. Je všežravé a dokáže si zapamatovat složité úkoly.
  farm.sheep:
    label: ovce
    summary: Chlupaté hospodářské zvíře dávající vlnu a mléko.
    info: Ovce domácí se chová pro vlnu, mléko a maso. Žije ve stádech a je jedním z prvních domestikovaných zvířat v historii.
  farm.chicken:
    label: slepice
    summary: Hospodářský pták snášející vejce.
    info: Domácí slepice je nejrozšířenější druh drůbeže na světě. Snáší vejce a chová se pro maso; existuje více než 25 miliard kusů.
  farm.goat:
    label: koza
    summary: Hospodářské zvíře s rohy dávající chutné mléko.
    info: Domácí koza se chová pro mléko, maso a vlnu. Je přizpůsobivá a dokáže přežít na různorodé vegetaci včetně suchých oblastí.
  farm.horse:
    label: kůň
    summary: Silné hospodářské zvíře používané k jízdě i práci.
    info: Kůň domácí byl tisíce let nezbytný pro přepravu, zemědělství a boj. Dnes se chová také pro sport a rekreaci.
  farm.donkey:
    label: osel
    summary: Ušaté pracovité zvíře se spolehlivou chůzí.
    info: Osel domácí je domestikovaný africký divoký osel, využívaný staletí jako pracovní zvíře. Je odolný, spolehlivý a schopen nést těžká břemena.
  farm.duck:
    label: kachna
    summary: Vodní pták s plochým zobákem, chovaný na farmách.
    info: Domácí kachna je drůbež chovaná pro maso a vejce. Dobře plave díky plovacím blanám mezi prsty a vydává charakteristické kvákání.
