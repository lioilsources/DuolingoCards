  farm.ram:
    label: '"כبش"'
    summary: זכרי האגלים הבוגרות עם קריות מהירות לסיבית.
    info: '{"hint":"ברת כבש מבוגרת עם קרני ספירלה גדולות (אוביס אריאס)","info":"כبش הוא זכר אגלים בוגר. יש לו חבי צלופח שצורתם היא מסחרפת ומעגליי הספירה, אותם לא מחזיק בהן הנקבה או אם כן אז רק מעט מאוד. במהלך הרעננות (בסתיו), מתמודדים הזכרים מול זה לזה על ידי פגיעה חזקה של החזה והקרניים שלהם. בכמה תרבויות ובמיתולוגיה מזוהה הכبش עם עוצמה, ייצוריות ואutorитет."}'
  farm.rooster:
    label: '"cock"'
    summary: Male bird known by its colorful feathers who crows to announce sunrise.
    info: '{"hint":"פריט זכר בוגר עם קן צבעוני וذנבו", "info": "קוקו הוא פרה של תירס דומית וניכרת על ידי שיערה הצבעוני והכתרים שלו\nThe crowing is part of territorial behavior that occurs not only at dawn but also throughout other times during day \In Czech culture it''s considered symbolic for vigilance while Chinese astrology includes rooster among twelve animals representing new beginnings."}'
  farm.salmon:
    label: лосось
    summary: דג ימי גדול שמגיע אל נהרים להתרבות; מת nuôi many farms.
    info: לוס הוא דג אנאדرومטי שגדל באוקיינוס אך מתרבה בנהרות האב שלו. היכולת לזהות את הנהר שבו נולדה תלויה בשדה המגנטי של כדור הארץ ובאודם החוש ההשמה. חיבורי לוז בנורווגיה וסקוטלנד הם אחד מהànhכים הגדולים בעולם.
  farm.sheep:
    label: ספינה
    summary: жив畜 עםขน用于 פרווה וחليب.
    info: שפתן ביתית נוטה לחלבון ולבשר ונוגעת גם במוצרת חיבוקים. היא אחת מהחיות הרגל הראשונות שהאדם תקנן בהיסטוריה.
  farm.sheepdog:
    label: כלב אובח
    summary: كلב מאומן במיוחד כדי להוביל ולהגן על העדר.
    info: בונדרא קוליא הוא הכלب האובך הנפוץ ביותר, נ육ם לניהול גושת עדרים באמצעות מבט ופקודות דמויות. זהו אחד המינים החכמים יותר של כלבים. יכולות העבודה מועברות בירושה אך יש לפתח אותן דרך אימונים כבר מה階段 הצעיר.
  farm.silkworm:
    label: بוברוס מורי
    summary: חוכם לבן שמייצר את הבד הטבעי.
    info: בוברוס מורי הוא ח충 של פרפר הבד המורא (Bombix Mori) שנursed בסין לפני יותר ממילני שנה. סיבו באורך מעל תשעה מאות מטרים משמש כמקור לụת בד טבעית. היה כל כך יקר שהוא נחשב לסוד国家战略 לאורך מאה السنינות.
  farm.sow:
    label: 프라스니체
    summary: Мать поросёнка – взрослая самка домашнего пигста.
    info: |-
      פרת חזיר היא זוקנת מבוגרת של חסית בתהום.
      she может рождать дважды в год и обычно приносит от 10 до 14 поросят за раз.
      В современном земледелии интенсивное содержание свиноматок вызывает споры из-за условий их жизни в клетках с ограниченным пространством.
      Свиньи умные животные,
      а в естественных условиях они выкармливают потомство на протяжении примерно 12–16 недель.
  farm.tilapia:
    label: 틸פי
    summary: рыба пресноводная тропическая массово разводимая по всему миру.
    info: טילפיה ניולית היא אחת מהדגים הפטריים ביותר בעולם; מפיקים מיליוני טון כל שנה. במקור הגיעה מנילוס וبحמות אפריקה אך כיום מת nuôi על כולם היבשות. הדג ידוע בעמידותו, גדל במהירות ואינו צורך הרבה תזונה.
  farm.trout:
    label: pastroukh
    summary: рыба из семейства лосося выращивается на рыбных фермах и в дикой природе.
    info: |-
      פסטרוּח דיווי באג' נוצר בצפון אמריקה ומביאים אותו לאירופה כדג חקלאי.
      pastroach רגיל הוא מין אירויפאי ילוד שחי במימי קרים טהורים ונעולים בזרימה מהירה.
      one species both valued highly for sports fishing and culinary purposes.
      The farming of trout is traditional industry especially mountainous regions.
  farm.turkey:
    label: קנאן
    summary: 큰 가축 조류 고기 생산을 위해 기르는 미국 추수 감사절의 상징
    info: |-
      קנאנר הבית בא ממקסיקו שם האצטלים תרבמו אותו לפני יותר ממאה שנים
      הזכר שלו מאופיין בזנב ובפרווה שמתפצלת לצורת פרח
      בארצות הברית הוא אוכל מסורתי ליום ההודיה ובעולם זהו השני ברמה של התרבויות最多的家禽
  farm.water_buffalo:
    label: بوبول בית
    summary: büyük آسيوي بوفيد أساسي حيوان سحب مزارع الأرز.
    info: |-
      בובול הבית הוא צורת מגורשת של בובל המים וחיית хозяйств היסוד באסיה
      הוא עובד על שדה אורז והעמסת משא כבר אלפי שנים
      החלב שלו גמיש יותר מזה של פרות ונעשה בו חלב עוף buffalo
  farm.yak:
    label: Yak
    summary: yak הוא בקר גדול עם שיער ארוך מהנמלה ההימלאיה
    info: דז'ו הוא צורת יקע מותאמת לבית גידול של הייקס החיים על הפלטפורמה הטיבטית בגובה בין 3 ל -5.5 קילומטרים מעל פני המ海报. זהו הבסיס הכלכלתי לטיפול טיפוסי; מספק חלב וにく וגם כוח דחיפה. סיב החוט שלו עדין במיוחד וחם.
