lang: he
pivot: false
title: חיות תרבות אקזוטיות
cards:
  farm.alpaca:
    label: 올פיקה
    summary: חווה את הקטנה מבני משפחת האינוקו עבור הụלו הטבעי.
    info: אולפיקה היא קרית פרה קטנה יותר ממשפחת האינוקו שחייה באנדים הגבוהים ומשרתת כמקור לụלֶן טבעי דק מאוד – אחד הדקים ביותר בעולם. הụלו של אולפיק הוא חם ואניע לאлерגיות והוא עדין אפילו מהכשمير. קיים שני סוגים שונים - הווייא'ה עםขน גזע והסורי ذو החוטים חלקים כמו משי.
  farm.barn_cat:
    label: แม้วู้
    summary: แมวดอมิกันถูกเลี้ยงไว้บนฟาร์มในฐานะผู้จับสัตว์กัด
    info: '{"hint":"แมวที่เลี้ยงไว้ในฟาร์มเพื่อควบคุมสัตว์กินพืช","info":"แม้วัวเป็นแมวดомิกันอาศัยอยู่บนฟาร์ม โดยล่าหนูและกระรอก\nปกป้องอาหารสำรองจากสัตว์กัดแทะ\nโดยมากจะไม่ได้มีปฏิสัมพันธ์ทางสังคมกับมนุษย์เท่านั้นแต่มักพบบ่อยกว่าแม่วาด้าน\nตามประวัติศาสตร์แล้ว มีการเคารพนมแมวเพราะความสามารถในการปกป้องของพวกเขา"}'
  farm.beehive:
    label: 養蜂箱
    summary: 用于饲养蜜蜂的木质结构。
    info: |-
      꿀벌 군집은 나무 꿀통에서 사육되는 인공적인 서식지이며 야생 벌들이 살던 수목의 구멍을 대체한다.
      하나의 집단에는 보통 5만~8만 마리의 벙이 포함된다.
      각 집단은 매년 20kg ~ 30kg 의 양蜂을 생산한다.
      양봉들은 주요한 가루미(꽃가루) 역할로 세계 식량 중 삳분之一이 이들의 가루미에 따라 달려 있다.
  farm.boar:
    label: канец
    summary: זכר פרסה תחת ים
    info: קאנץ הוא זכר לא קצוץ של חזיר או פרסת דומית. בדיגנים הם נращים לצורך רבייה; הזרע שלהם משמש להפריית מלאכותית. הפרס האלוף (או פורח) כולל שיניו העבות והיכולת שלו לפגוע בחמלה.
  farm.calf:
    label: телёнок
    summary: גורמה של פרה עד גיל שנה.
    info: |-
      תל הוא גורם של בקר מהלידה ועד לفصل השתייה או לגיל שנה אחת.新生牛犊很快就能站立；母性的本能很强。用于产奶的幼崽会早早与母亲分离。
      телятина היא מנה יוקרית במגוון מסעדות אירופאיות.
  farm.carp:
    label: كַפּר
    summary: דג גדול בסביבה חסר מלח; מאכל חגיגי מסורתowy בצ'ך.
    info: קפר אובנני הוא הדג הגדול ביותר שנращים בריכוזי דגים בצ'כיה והוא קשור קשר בלתי נפרד לחג הפסחא הצ'כי. הוא התורם ל养殖 במזרח אירופה בתקופת הביניימית במיוחד בכצ'כה (בריכז תרשוב). זהו צדאי טיפוס וגדל מהר מאוד; משקלו יכול להגיע מעל 30 קילוגרם. ריכוזי דגי thrnov הם אחד ממערכות הריכוזיות השונות בגודל באירופה.
  farm.chicken:
    label: עופר
    summary: עוות ידוע שמטריאל ביוט
    info: '{"hint":"ג''יפון רגיל (Gallus gallus domesticus) - עוף חקלאי נפוץ", "info": "העופר הבית הוא המין הנפוצה ביותר בעולם בדרויבז''. העופרים מטילים بيוטים ומשמשים כמקור ל고בינה; קיים יותר ממאה וחמישה טריילيون פריטים.", "label": "עופר", "summary": "עוות ידוע שמטריאל ביוט"}'
  farm.cow:
    label: ׸
    summary: תםן מךכח
    info: '{"hint":"פרה", "summary":"פי מלך כת םן זל"}'
  farm.deer:
    label: elk farmed
    summary: Elk hoặc daňka được nuôi trong trang trại để lấy thịt săn và sừng
    info: |-
      דן או ילן נ육מים בקופות ובฟารמהในเช็กเพื่อเนื้อยล์
      danek tinier than forest elk have distinctively shaped antlers
      Antler shed annually và regrow
      Game meat từ farmed elks là một alternative lành mạnh cho beef
  farm.donkey:
    label: オスル
    summary: בעל החיים העניינים וחכם הצועד בצורה אמיצה.
    info: '{"hint":"חמור משפחתי (Equus africanus asinus)، חיות עבודה עם צעד יציב","info":"הحمור המשפחתי הוא גזע של החמר האפריקאי הלא מוכוון שנעשה בו שימוש כחיות עבודה לאורך מאות שנים. זהו בעל חיים עמיד ובטוח המבוסס על נושא 짐ثقיל.","label":"オスル","summary":"בעל החיים הענייני והאמיץ שיציבה בצעדיו."}'
  farm.duck:
    label: '".label": "قنנה"'
    summary: '{"summary":"ציפור במים עם פטיש רך, נращת על קמפוס.",}'
    info: '{"info":"קננית ביתית היא עוף חקלאי שמגדלים כדי לאכול את בשרו וללמוד מהبيض שהוא מ産. הוא שוחה טוב מאוד בגלל הפלפיטות שבין אצבעיו ומכורח צעקה מאפיינת."}'
  farm.emu:
    label: 鸸鹋農場
    summary: 澳洲养殖鸸鹋以获取其油、肉类与皮
    info: |-
      鸸鹋是以澳大利亞農場養殖的動物，用於肉類、脂肪油（廣泛應用在化妝品中）和皮革。鸸鹋油脂具有抗炎特性，在傳統與現代醫學中有使用價值。
      鸸鹋畜牧業也逐漸擴展至美國及歐洲地區。
      這些鳥類好奇心強且不怕人類。
  farm.farm_shrimp:
    label: כרייה חקלאית
    summary: קצת כרעית נפח גבוה שנращают בבריכות לחוף
    info: |-
      קריית הים הלבן היא המין הנפוץ ביותר של קревת בעולם
      המסחר מתבצע בעיקר באסיה ובאמריקה הלטינית
      גידול עשירי של קרבות הוא מושא לוויכוח בשל ההשפעות על יערות האנגרוס
  farm.foal:
    label: חתול
    summary: חיית כבשים מתחת לשנה אחת; עמידה על רגליהם כבר בשעת לידתן.
    info: חָתוּל הנווה הוא גוון של חיה למשך השנה הראשונה שלו. במהלך השעות הראשונות לאחר הלידה הם עומדים על רגליו ומתחילים לאכול שומן. יש להםרגליים ארוכות במיוחד ביחס לגוף; הן נצמצמות עם הגיל. החתולים הנובחים הם מזדממים ומרעישים מאוד; האימוצם מתחיל רק בגיל שני עד שלישי.
  farm.freshwater_crayfish:
    label: рак речной
    summary: Морской коралл выращивается как деликатес.
    info: רָק הירחאי היה נפוץ בčeche אך כמעט נכחד מ מגפת רכים וחומרי מזהמים במים היום הוא מתבגר באגפים מיוחדים זהו מדד לניקוז המים והוא חי רק בסופות чистые В XIX веке экспорт раков из Чехии во Францию и Германию был важным бизнесом.
  farm.garden_snail:
    label: שנעק
    summary: 곤יל גדול שמשתמר במזון הצרפתי כמו אسكארגוט.
    info: |-
      גרם גינה הוא הפלג הגדול ביותר באירופה.
      it מוערך כמוצר יוקרתי במטבח הצרפתית בשם אסקארגוֹט.
      בشتה נחבא ומכסה את לוויו עם רباط חיצוני (هיברנקלום),
      והגידול שלו (הליקולטוריה) מתבצע בצ'כיה, איטליה ובמדינות אחרות.
  farm.goat:
    label: كبוש
    summary: פרה משפחת הכבושים מיוצרת חלב טעים.
    info: '{"hint":"חיה תייראי עם קרניים - כבשים","info":"מקורות חלב וmięס והם מתאימים לסביבות יבשיות.","label":"כבשים","summary":"חיית פרנסה עם קוצים שמייצרת מזון."}'
  farm.goat_dairy:
    label: коза доярная
    summary: Коца выращивается для молока из которого делают сыр и Йогурт
    info: "קֶשׁ הַבָּתִי נְבוֹאֵית בְּעֲדִיוֹן ל -10 מֵאוֹרוֹת וְהוּא א חיות האדמה הנפוצה ביותר\nמטעמו של קשבות הוא עשיר במغذيים ואומר יותר קל לעיכול מהחלב הפרסי ; מתאים לאנשים עם רגישות הלקטוז \nמשם יצרו גורמים כמו שרייר , פיטה או halloumi\nקשובטים הם תומכים ומתקנים את עצמם גם על פני השטח ההר והסלעים"
  farm.goose:
    label: Goose Familiar
    summary: ציפור גדולה המשמשת כבקרת צool לחום הבשר, השחל ופנינים
    info: |-
      הoose הומית נגזרת מה Goose הבריא לפני יותר מ - 3,000 שנה
      הייתה אחת מהحيות הראשונות שנכרכו לחיים משפחתיים; בروם היו גואלים על טריפטן
      goose ידועה בשל שיערה של השחלה והבשר הניבש שלה וכן בשל לב החוזק (goose)
      The pen הוא כלי כתיבה מסורתי
  farm.guinea_fowl:
    label: פרלי
    summary: ציפור אفريقאית משמשת לשיקום ולשמירה מפני סerpents.
    info: פרליקה עם כובע נפוצה מאסיה, שם היא חיית בר בסוואנות. בדיגנים מעריצים אותה כמו שומר טבעי - קולה החרישי מזהיר על חיות רועמות וחיות טרף וגם אנשים זרים. יש להathers לבנוי בצבע אפור עם תבליטי צהבהב וה머קס אדומה-כחול ללאATHER.
  farm.guinea_pig_farm:
    label: 쥐 Guinea
    summary: giume pigs משמשים למאכל בלטין אמריקה או כדרכנים.
    info: |-
      ג'יני פיג הוא חיות נ畜ת מדרום אמריקה המשמש כמקור אוכל (כavia porcellus). הגינה הפיגה הביתית происходит מהאנדים ונדומשת על ידי האימפריה האינקית לפני יותר чем 3,000 שנים כתוצר י식י.
      עד היום זהו מאכל מסורתי בפרו, באקוודורה ובקולומביה (מונח loco - 'קי').
      באירופה ואמריקה הצפונית גינה פגים הם בעלי חיים אהובים של ילדים.
      הם תקשורת באמצעות צעקות מורכות כולל רועש, זמזום וחצי.
  farm.highland_cattle:
    label: פרית סקוטלנד
    summary: скот с ארוכה אדומה ושערות חזקות.
    info: הסקוטי היילנד הוא זן ישן של פרות שנוצר בסביבת ההרים הדרסיים בסקטland. שיערו האדום–שחור הארוך שלו מוגן אותו מפני לחץ וקור. זהו חיה עמיד פחות נושם לโรגן בהשוואה לזנים אחרים.
  farm.horse:
    label: '"סוס"'
    summary: '"חיית עבודה חזקה משמשת לתעופה ולעבודה"'
    info: '{"info":"הסוס הביתי היה הכרח ל transporte, חקלאות ולחימה已有천יםשנים. כיום הוא גם נ육ד לשעשוע והנאה."}'
  farm.lamb:
    label: sheep
    summary: Young sheep until age one year old, symbol springtime innocence.
    info: |-
      שאלה היא כừ צלע עד גיל שנה אחת
      היא נולדה עם גוון ו начинает to graze בימים הראשונים לחייה.
      בנצרות הוא סמל של חסידות ושל ישו הנוצרי כמו הכבשים האלוקים.
      The consumption of lamb meat is popular delicacy many kitchens around world.
  farm.llama:
    label: lama
    summary: млекопитающее из Южной Америки выращивается для шерсти и как вьючное животное
    info: Lama היא חיות יבשתית דומסטיקלית של אמריקה הדרומה שנדגלה על ידי האינקה לפני יותר מ - 5,000 שנה . הייתה החיה הנושאת עיקרית בדרכו של אנדים ; יכולה להוביל עד ל -% 30 משקולה הגופנית שלה . פילם השיער הוא נפוץ מאוד בגלל תכונותיו התורמים לחום
  farm.mule:
    label: مزة
    summary: hibrid sterile של حصון וחמור בעל עוצמה ייחודית.
    info: מיזה הוא היברידי של סוסית וasin; ההybrid הפוך נקרא מולה. זהו חיות שטוף אך חזק מאוד ומתמיד, עם תיאום טוב לטריטוריה והוא זהיר יותר מסוס ומתקשה פחות לפanicות.
  farm.mussel:
    label: 슬라바
    summary: 해수 속 줄기 위에서 키운 먹을 수 있는 이형 연체동물
    info: |-
      슬라브카 제다는는 유럽 대서양 해안가의 양식장에서 많이 기르이는 조개이다.
      조류와 갯벌에 매달려 사육되며 물을 여과하여 환경 친화적인 식품으로 알려져 있다.
      이 생선은 탄소 발자국도 작고 전통 요리인 벨기에 뮈즈 프라이드 등 다양한 음식 재료로 사용된다.
  farm.ostrich:
    label: страוס מטעי
    summary: strauss raised on farms for its meat, feathers, and hide.
    info: |-
      ה страוס הוא המין הכי מהיר ביצורים דו ערכיים והוא נבוב על חיותו במטעמים לmięס, עור ופראות。
      The meat is red like beef but has less fat and cholesterol than other meats.
      The ostrich skin is used to make high-quality luxury goods such as handbags and shoes.
  farm.ox:
    label: بكار
    summary: 阉割的公牛历史上最重要的农业牵引动物。
    info: |-
      בקר הוא זכר תaurus בוגר שנ阉割用于劳动。
       במשך אלפי שנים היה הבסיס של חיות עבודה באgriculture ברוב עולמות החקלאות.
       בזכות כוחו והגון נפש שלו פיצח יותר קרקע מהסוסים בעבודת האדמה המוקדמת.
      בחקלאות מודרנית התחלפה על ידי טרהקטורים但是在開發中國家仍然使用。
  farm.oyster:
    label: 養殖牡蠣
    summary: 一種海水雙殼類軟體動物，在近海水中以繩索和網籠飼育。
    info: |-
      牡蛎在沿海水域用绳索或网箱养殖；需要三到五年才能成熟。
      它们过滤水体，有助于清洁海洋生态系统。
      双壳类（珍珠贝）的牡蛎是天然珠子的来源。
  farm.peacock:
    label: פקן ביתי
    summary: זכרי פאווה מחוברים בגנים ובפרדות על מנת להעניק תוספת של יופי
    info: |-
      פאווון כחול הוא אורגניזם יליד אינדיה שנדומסטיקט לפני אלפי שנים כסמל יפה쁨
      הזכר (פאווון) פותח יותר מ -150 נוצצות צבעוניות ליצירת מסגרת המדהימה כדי לגשת לאמהים
      קולו חזק מאוד וחד
  farm.pheasant:
    label: פרוור פארמה
    summary: 猟能在农场饲养并释放用于狩獵。
    info: |-
      בצאנט טיפוסי נ육 בקזח ומשוחרר באופן קבוע לטבע למטרת狞猎。
      המקור שלו באסיה; הוא הביא לרומא אירופה על ידי הרומים。
      The male has striking coloration and long tail; females have inconspicuous brown coloring.
      猟兔肉是有价值的野味，味道鲜美。
  farm.pig:
    label: חזיר
    summary: בעל חיים עדרי וורוד בעל גזע קשיח של כיסוי שטוף העיניים והפה שלו בצבע לבן או ירוק בהיר מאוד ולעיתים גם שחור כמו בשר טרי אבל זה רק אם הוא מתבגר עד לגיל השישה - אז יש לו פנים נראות יותר טוב ונעים מהשכנים הקרובים אליו בגובה אך פחות מקווקווין שהוא גבוה ממנו פי שניים בערך ובמקרה כזה אפשר לראות אותו על הגג ולהרגיש שהרוח מנפחת עליו כאילו הוא עומד להתרסק כל הזמן בגלל האקליפסה הסופנית שנוצרת שם למעלה בין החוטפים הגבוהים ביותר באמריקה הלטינית כולל מדינות כמו ברזיל ואקודור.
