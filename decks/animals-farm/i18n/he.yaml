    info: |-
      הולוב דומטי הוא הוללב סלע מועדן; על ידי ניסיון תרבותיים התפתחו מאות שיבוטים שונים.
      mם צאצאי חסרי גיל - נחשב בultureות רבות למנה יוקרתית ומדידה.
      holovi מרוץ משופצים למהירות; פרטים מיוחדים יכולים לעוף במהירויות של מעל 150 קמ"ש.
      thobby זה נהנה מהיסטוריה עשירה במיוחד בהונגריה.
  farm.piglet:
    label: "\U0001F437"
    summary: "\U0001F416"
    info: '{"hint":"תינוק חזיר", "info": "חיזירים הם צעדים של חסידה בת początkי החיים שלהם.<br>刚出生的小猪非常小，但它们长得很快。<br>母猪平均每次产下大约十到十二只仔猪。<br>小豬很聰明；研究表明，豬的智力與狗相当。","label":"piglet","summary":"野猪幼崽，通常粉红色且活泼"}'
  farm.pony:
    label: פוֹנוּק
    summary: 小型纯种马品种，常用于孩子骑行
    info: |-
      פונייק הוא זן קטן של סוסים שגובהו אינו עולה על 14.5 אינץ' בכתף (כ-60 בס"מ). הפונייק השטנדיי是最小的一种，原产于苏格兰设得兰群岛。它们是强壮的动物，在恶劣条件下具有耐受性。

      这些马被广泛用作儿童骑乘和矿井中的拉车用途。
  farm.quail:
    label: קיפלית יפנית
    summary: בIRD raised on farms mainly for its eggs and meat.
    info: |-
      קיפליקה יפנית היא זן של קיפלקים משפחתיים המגדלים בדרכים אינטנסיביות כדי לייצורبيض ו迄ם.
      The females lay almost every day; these eggs are considered delicacies by many cuisines.
      They mature quickly and begin laying within six weeks.
  farm.rabbit:
    label: krälic
    summary: KRÁLÍK DOMACI CHOVANÝ PRO MASO, SRST NEBO JAKO MAZĽÍČEK.
    info: |-
      ה królik הבית נבנה במאה ה-16 מה królık האירופאי הברי.
