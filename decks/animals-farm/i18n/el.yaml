lang: el
pivot: false
title: Ζώα φάρμας
cards:
  farm.alpaca:
    label: Αλπακά
    summary: Μικρός συγγενής της λάμας , κτηνοτροφούμενος για τη λεπτή του βούβο.
    info: "Η αλπακά είναι μικρός συγγενής της λάμας που κτηνοτροφεύεται στα Άνδε για χώρους βουνωσκέψεως. \nΤο νήμα της είναι δύσχρηστο φυσικό υλικό -θερμό, υποαλλεργικό και λεπτόterο από το cashmere .\nΥπάρχουν δύο στελέχη : Hucuya(ξανθιά), Suria(matt)."
  farm.barn_cat:
    label: Γάτα βοσκοτροφική
    summary: Διαθεματική γάτα φυλαγμένη σε αγροτικό ως αποκλειστικό
    info: '{"hint":"κατοικίδιο γάτο που φυλάγεται σε αμπέλωνα ή χώρο κηπουρικής εξόχης τύφλωσης","info":"Η βοσκοτροφική γάτα είναι μια διαθεματική γάτα που ζει σε Γεωργικό περιβάλλον , λαμβάνοντας νερό και τροφή .\"Προστατεύει τις αποθήκες τροφής και αμπέλων από τα τζιρκάδια \"Είναι λιγότερο κοινωνική με τους ανθρώπους απ'' ότι η εσωτερική γάτα \"Στην ιστορία οι γάτες τιμώνταν στην Αίγυπτο για την ίδια ακριβώς δύναμη προστασίας"'
  farm.beehive:
    label: κουφάρι
    summary: Διαμέρισμα για τις αγέρων βούληξ.
    info: |-
      Ένα κουφάρι είναι η τεχνητή σπούδαση μιας πληθυσμό αγέρων βούληξ όπου διώκει να φιλοξενήσει για λογαριασμό τους τις αγέρων βούληξ·
      Οι αγέρων βούληξ ζουν σε φυσικές τρύπες σε δέντρα,
      Αλλά στο κουφάρι οι αγέρων βούληξ έχουν
      Περίπου 64000 αγέρων βούληξ;
      Και παράγουν κάθε χρόνο περίπου 7kg μέλι.
  farm.boar:
    label: Κανώ
    summary: Αρσενικός πίθηχος.
    info: |-
      Ο αρσενικός πίθηχος είναι έγκατά σπέλαιο του κυμαϊδή χωρίς να μεταβληθεί γεύση·
      Στις φάρμες βρίσκονται διαφορετικές λύσεις για να προσεγγιστεί
      Η αξία του είναι πολύ υψηλή.
  farm.calf:
    label: Ταύρος
    summary: Νεότης βουδισµένων
    info: "Ο ταύρος είναι ο νεότης βουδισμένων από τη γέννα μέχρι και συγκεκριμένη περίοδο ωριμάζει λιβαδών διήθησης\nΣτη φύλαξη των ταύρων για παραγωγή γάλακτος , αφαιρούνται πρώϊμα από τη µητέρα \nΗ ταυρίνα(veal), είναι ακριβή γεύση σε πολλές ευρωπαϊκές"
  farm.carp:
    label: Καπρίτσιο
    summary: Μεγάλο υδρόβιο ως παραδοσιακό ροΐστρο στη Czecha.
    info: "Το καπρίτσιο είναι η μεγαλύτερη ψάρι που φυματίζεται στις τσέχικες λίμνες για αξιοποίησή του και δεν μπορεί να βρεθεί χωρίς τις τσέχικες Γιόλγκες\nΉδη από τη Δυτική Ευρώπη του Μεσαίωνα - ιδιαίτερα στη Tchequie (λίμνες Trben) – έχει εφαρμοστεί \nΕίναι πολύ ευεργετικό και αναπτύσσεται γρήγορα· μπορεί να φτάσει τα 35 kgr."
  farm.chicken:
    label: Κοτενίδα
    summary: Πουλερικό που δίνει λευκόβουνα.
    info: '{"hint":"κοτενίσια πουλέρικη ζώντας σπόγγος αυξάνων τύπος χρήμα γαιοχώρα","info":"Η κοτενίδα είναι μια διαφθορική φυλή νεζικής βοσκής σ'' όλο τον κόσμο. Δίνει λευκόβουνα και ροΐζεται για κρέας· υπάρχουν περισσότερα από 20 milliard pieces.","label":"κοτενίδα","summary":"Εμπορικό πουλερικό που δίνει λευκόβουνα."}'
  farm.cow:
    label: Κατσίκι
    summary: Παραγωγή λιπαρών και πρωτεϊνών.
    info: '{"hint":"μεγάλο βουδιστικό ζώο για την παραγωγή νυχίου και χοΐς","info":"Η απέρα είναι σύμβολο μεγάλης διαφθοράς.","label":"απέρα","summary":"Μεγάλο φυτό."}'
  farm.deer:
    label: Φυλασσόμενο αλεξίψι
    summary: Αλεξίψι ή δάνικο που φυλάσσεται σε γης για ιχthyos και παρασκευή κεράτων
    info: |-
      Στη Τσεχία το δάνικο και αλέγουρό φυλάς επώδεύονται σε περιφρουρήμενες γης ως μια λύση για να βρεθεί ζωϊκός κρέας·
      Τα δάνικα είναι μικρότερα από τα αλέγουρα και έχουν χαρακτηριστικά παρομβρακισμένα κέρατα,
      Πετάνε τα κέρατα τους κάθε χρόνο και αναζυγούνται
      Ο θηλασμός από φυλασσόμενα αλεξιψία είναι υγιεινή εναλλακτική στο βοείο
  farm.donkey:
    label: Ερπύστης
    summary: Προσεκτικός εργατικός θῆρας ὁ ῥᾴδιος περπᾰτᾶν.
    info: '{"hint":"ερπύστης Αφρικανός αμάξος","info":"Ο ερπυστής χώρου είναι το καλλωπισμένο πρόβατο με σχήμα φθηγού λαϊκού γεύματος διαδρομής βαζούμενο να υποστηρίξει την εργασία.","label":"Ερπύστης","summary":"Προσεκτικός εργατικός ζῷο ἀξιόπιστῳ πορείᾳ."}'
  farm.duck:
    label: '"kotósklithra"'
    summary: Γαϊδουρίδιο νερού χωρίς φτερά για διαφορετικούς σκοπούς.
    info: '{"hint":"παράδειγμα που θυμίζει την κοτόσκλήθρα εύχαιρης αβένα με βάση στο Anas platyrhynchos","cards":[{"back":{"text":"\nΠώς λέγεται;"},"front":{}}]}'
  farm.emu:
    label: Φαρμακείο Emu
    summary: Εμούς που υπάρχουν για λίπος, κρέας και εξωτερική επιφάνεια στη Νότια Γη.
    info: Οι εμούς φυσικά χρησιμεύουν στη Μαλαιζία για τη παραγωγή κρέατος, λίπου αφόδινου με βιβλικό νερό (χρησιμοποιώντας διαθέσιμο σε κοσμετική), και για την παραγωγή της εξωτερικής επιφάνειας.
  farm.farm_shrimp:
    label: Γαϊδουρίνι
    summary: Στενά σχεδιασμένη γαϊδουρίνι για κτηνοτροφία.
    info: |-
      Η Litopenaeus vannamei είναι το παγκόσμιο φυλλωδής αρθρώπο σε κτηνοτροφία για να μάζεψου ηχές ρύβες·
      Οι βιοτεχνικές δραστηριότητες λειτουργούν κυρίως στην νότια Ασία και τη Λατινική Αμερική.
      Το έντονο κτηνοτροφικό της είναι αμφιλεγόμενο λόγω των επιπτώσεων στα μανγρόβια.
  farm.foal:
    label: hríbe
    summary: Το μικρό ίππος μέχρι το διήνεο ηλικίας· σταθεί στα πόδια του μέσα στις πρώτες ώρες.
    info: Ένα hρίβε είναι το μικρό άλογο κάτω από ένα χρόνο συμφώνης που βάζει γρήγορα τα πόδια του να φύσσει λέχθος.
  farm.freshwater_crayfish:
    label: Ρακί
    summary: Σλαβικό βρώμικο.
    info: Το ρακί ήταν πλήρως διάδοχο στη Γερμανία από τους μύστες και εξαφανίζθηκε λόγω νέου φυσικού γεγονότος.
  farm.garden_snail:
    label: Σκηνόπουλο
    summary: Ένα μεγάλο υδρόφιλο μαλακόζωο που τρώεται στη γαλλική κουζίνα ως escargot.
    info: "Το Σκηνόπουλο είναι το μεγαλύτερο χιμά στης πεδινής Δυτικής Ευρώπης και αξιοθέωρη γαστρονομική βιβλιοθήκη Γαλλίας φέρει το όνομα escargot. \nΠερνάει το ψυχρό διάστημα λιποψυχώντας και κλείνοντας το ναυτίλιο του με μια μεμβράνη (hibernaculum)."
  farm.goat:
    label: Πρόβατο
    summary: Γεωργικό ζώο με κέρατα που παράγει νωπό.
    info: '{"hint":"πρόβατο που ανήκει στη φυλή Capra aegagrus hircus", "info": "Η οίχιστρα χύθαιμά μας για το νωπό και λέγει εξαιρετικό βούτυρο· διαφοροποιείται και μπορεί να επιζήσει σ'' εδώλια με διάφορα φυτά, ακόμα και σε ξηρές περιοχές.","label":"Οίχιστρα","summary":"Ζώο που υπάρχει στη γεωργία με κέρατα που δίνει νωπό."}'
  farm.goat_dairy:
    label: Γαλακτοπαραγωγική Δόνη
    summary: Δόνη που ανατρέφεται για την παραγωγή γάλακτος, από το οποίο παράγονται τυριά και yogurt.
    info: "Η οικόσογα είναι κυττεύουσα από πριν της μέχρι δέκα χιλιάδες χρόνων γι' αυξήθη σε βοσκότμο και να φαίνεται λαβών ένα από τα πιο πολυφανταζμένα ζώα. \nΟ γάλακτας της θηλυκής ημίψης είναι πλούσιος σε ιχνοστοιχεία και πιο εύπεπτος από το βοεϊκό· κατάλληλος γι’ ανθρώπους με ανεπάρκεια λακτόζης. \nΑπό τον γάλακτα της ξεχωριστικά άγρια ήπια τυριά όπως Chevrot, Fetta ή Halloumei."
  farm.goose:
    label: Χούσα
    summary: Πολύ φθηνό νωπό βούτυρο.
    info: Η Χούσα προέρχεται από τις δίκηδρους υγρών εδάφων για λευκή σάρδελα και μποζομάϊσα.
  farm.guinea_fowl:
    label: Γαϊνιός
    summary: Αφρικανικό πουλί που τραφεί για το κρέας του και υπολογίζεται ψαλίδα
    info: |-
      Η περλίτσα επικονδύλου έχει τη δυτική αφρικανική και σαβάννας ως φυσικό βιώμα
      Στα γεωργικά νέφια μπορεί να λειτουργεί χρήσιμα όπως φυσικός «ψαλίδα»
      Προειδοποιεί με το θόρυβο της για οποιονδήποτε εξωτερικό
  farm.guinea_pig_farm:
    label: Μορτζ
    summary: Γνωστός σαν «μορτ» - ζωϊκό που υψώνεται για τροφή στη Νότια Αμερική.
    info: "Ο μορτς είναι από τους Άνδεις περιοχές και χαμηλώθηκε σε δομήσιμο φυσιγά γύρω στα 5478 λεφτά να βρει τροφή·\nΣήμερα εξακολουθεί να είναι τραδιβική τροφή στο Περού, το Εκουαδόρ και την Κολομβία\n(Που). \nΕίναι επίσης δημοφιλής παιδικό σκυλί στην Αυροπή και την Βόρεια Αμερική."
  farm.highland_cattle:
    label: Σκωτσικό highland
    summary: Παλιό είδος αγελάδας με λευκή νεράϊδα.
    info: Το Σκωτσικό είδος αγελάδας χρησιμοποιήθηκε σ' περιβάλλοντα του βουνώδους δυτικού μέρους της Αγγλίας και γνωστικό φορέα του είναι η λευχωφόρα του νεράϊδα.
  farm.horse:
    label: '"Άλογο"'
    summary: '"Δύνατος βοσκός όχημα για ναζιωδία και εργασία.",'
    info: '{"info":"To άλογο είναι απαραίτητό για τη μεταφορά και πολιορκησία χιλιές χρόνια· σήμερα φυλάγεται για δραστηριότητες λουξ και αθλητισμό."}'
  farm.lamb:
    label: Πρωταγονιστή
    summary: Μικρό αμνό μέχρι τον πρώτο ΓΕΝΗΣΙΑΚΟ ΕΤΟΥΣ.
    info: Ο πρωταγονιστής είναι ένα μικρό αμνό ως τη συμπλήρωση του δεύτερου γένους και φθάνει να βοσκεί λίγες ημέρες μετά τη γέννα. Διαδραματίζει σχετικώς σημαντικό ρόλο στον χριστιανισμό όπου εξυψώνεται ως σύμβολο της αφετηρίας της αγνότητας.
  farm.llama:
    label: Λάμα
    summary: Νότιο -Αμερικανικό ζῷο ἀγελῶν ὁργανισμὸς γὰρ βοῦρτζῳ καὶ ᾧ ῥῆξῃ.
    info: Η λάμα είναι ένα υποτρόφισμενο αγέλου της νότιας Αμερική που κυβερνών σχεδόν για βούρτζων με διαθεσιμότητα φωτεινής θερμότητας.
  farm.mule:
    label: Ζυγός
    summary: Στερεώς αστερεό χυβριδικό από ίππο και δρομαΐο
    info: "Το ζυγός είναι υβριδικό από καστανή γάϊδαρη που τελεύτως μέχρι να φθάσει σ' αυτή ένα δρομαίο - η αντίστροφη συζυγία λέγεται βούβαλο\nΕίναι στερεώς αστερεό , αλλά πολύ αξιόπιστος, δυνατός και ανθεκτικός \nΈχει καλή προσανατολισμό στο επίπεδο και είναι πιο προσεκτικός από το άλογο· πανικόβλητος"
  farm.mussel:
    label: Mύτιλo
    summary: Παραθαλάσσιο λιμανικό μύτιλο που καλλιεργείται σε τηθλό.
    info: Η μύτιλος εδών απασχολεί ένα συμβάλλων που καλλιεργείται τηθλό φρέζκα δίπλα απ' όλη τη βορειοατλαντική γραμμή νερού.
  farm.ostrich:
    label: φαρμός πστρού
    summary: Πστρός φυλακισμένος για κρέας, βούρτσα και λέβημα.
    info: "Το πστρός είναι το γρηγορότερο δύωχινο ζώο και φυλακίζεται σε αμπέλους για να χρησιμοποιήθει μάλλον, λέβημα και βούρτσα. \nΟ κρέας πστρού είναι κόκκινος όπως το βοδινό, αλλά με υψηλότερη περιεκτικότητα σε λίπος και χοληστερίνη. \nΗ λέβημα πστρού είναι αξιοπρεπής στην παραγωγή luxury είδη."
  farm.ox:
    label: Βοσκός
    summary: Απαγορευμένος ταύρος - ιστορικά σημαντικός τραβηγμένος θηριών.
    info: Ο βοσκός είναι απαγορευμένη άλωτή που χρησιμοποιείται για τη δύναμη στη γεωργία και φυλάχθηκε μετά από εξώδικο. Για χιλιάδες χρόνια ήταν ο βασικός τραβηγμένος ζῷο στη γεωργία στη νοτιοανατολική πλευρά του κόσμου. Διότι λόγω της δύναμης και της υφής του έψαχνε περισσότερο εδάφους απ' ό,τι τα ίπποι στην αρχαϊκή γεωργία.
  farm.oyster:
    label: Οστρα φαρμ
    summary: Θαλάσσιο νηθή βρύζεται σε λώρων και δίχτυα.
    info: Η οστρα εκτροφεύεται σε πανέμορφους ωκεάνιους από λώρων και δίχτυα· μεγαλώνει για τρία έως πέντε χρόνια.
  farm.peacock:
    label: Πάβος
    summary: Αρσενικό πάβος που φυλαφθή σε αγροκτήματα και πάρκα για αισθητική.
    info: |-
      Το μπλε πάου της Ινδίας είχε κυριολεκτικά χωμένο από δώσε σύγχρονο για να φυλαφθή για λόγους αισθητικής
      Ο αρσενικός (πάβος), ανοίγει περισσότερο από 150 βούρσα σε έξαιρετο σχήμα φαναριού για να προσελκύσει τις θηλυκές,
      Η φωνή του είναι πολύ ισχυρή και διαπεραστική.
  farm.pheasant:
    label: Φασιάνο
    summary: Περιγράψτε λεπτομερώς το φασιάνο.
    info: Το φασιάνο είναι από της Ασίες και μεταφέρθηκε στην Ευρώπη υπό τους Ρωμαϊκούς χρόνους για να πλουτίσει τη διαβίωσή μας.
  farm.pig:
    label: Χοιρο
    summary: Ροζ χρυσή με παθητικό φίδι και τρύφες δια βίου να μάθει πολύπλοκα έργα.
    info: '{"hint":"γαλούχι αρνίου","content":{"front": "Πώς λέτε γάλο άρνη στα εβραιωμπσκό;", "back": "Γαλούχι"}, "type": "flashcards"}'
  farm.pigeon_farm:
    label: Πελαργίδι
    summary: Οικότροφο πελαργίδι για λιβανέζικο βρώμα.
    info: Το οικότροφο πελαργίδι είναι του κάμπους χήνη αξιοποιείται για συσχέτιση με δύναμη και να φθάνει τα 94 mph.
  farm.piglet:
    label: selate
    summary: Πράσκος , τυπικά ροζ και παίζει.
    info: "Οι σελέντζορα είναι ο μωρός πράσκος και τυπική αφύδρουμη διάστημα λίγες βδομάδες γέννησης\nΑξιοθρώπινα νεογέννητα χρειάζονται φροντίδα,\nΗ θηλυκός(ψελέντζορα)\nΣχεδόν 95% των σελέντζορα \nΕίναι έξυπνοι"
  farm.pony:
    label: Πόνι
    summary: Μικρός φυλή του ιπποτικού ζώου.
    info: "Το πόνι είναι ένας μικρός φυλή του άμηπτου αγελάδων χωρίς να σχηματίσει κέφι γύρω από 14 δάχτυλα (58'') \n(146cm). To shetlandske pony είναι το λιγότερο βαθύ και προέρχεται από τα Γαλλικά\nΝησιώτικα νησιά. Διαβιούν σε αξιόλογες συνθήκες."
  farm.quail:
    label: Ιαπωνική Γέφυρα
    summary: Μικρό πουλί αξιοποιούμενο συστηματικά για λιβαδάκια και νερό.
    info: "Η Ιαπωνική κρεμάλγη είναι μια φυτούχουσα ποικιλότητα της γέφυρας αξιοποιούμενη συστηματικά ως πηγή λιβαδών και νερού. \nΟι θηλυκοί βάζουν διαρκώς λιβαδάκια, τα οποία είναι ιδιαιτέρως επιθυμητά σε πολλές κουζίνες. \nΦτάνουν γρήγορα στην ώριμη ηλικία - ξεκινούν να βάζουν λιβαδάκια μετά από έξι εβδομάδες."
  farm.rabbit:
    label: Κρασάκη
    summary: Σπίτι του κρασάκης περήφθη για κρέας, τρίχα ή όπως σύντροφο.
    info: Το σπίτι του κρασάκης περήφθη από μέλη ευγενών φαιδρωμένων χρόνων έχει λύβα γνωστά ντόπια διαφορετικά σε μέγεθος, ως βάψη και τύπο τρίχας.
  farm.ram:
    label: Βίλιο
    summary: Ωριμός αρσενικός πρόβατο με μεγάλες νύξεις.
    info: |-
      Το βίλιο είναι ένας ώριμος αρσενικός των προβάτου.
      Έχει σημαντικές κυπρίδες με διψήφια γύροι, που λείπουν από τις θηλυκές φορείς ή είναι πολύ μικρές.
      Κατά τη διάρκεια της αγώνισης (φθινόπωρο), οι αρσενικοί ανταγωνίζονται με άμεσες συγκρούσεις.
  farm.rooster:
    label: Προϊόν
    summary: Γαλλικός βραχίωνας ; Δηλώνει τη λύψη.
    info: '{"hint":"κρεατοφόνιμπλου και ράμφως με πολύχρωμη συγκίνηση τέλεια ιδιότητα αξιών","info":{"label":"Κρεβάθι","summary":"Αρσενικό γαλλικής φύσης ; επικοινωνεί να δηλώσει τη λύψη."},"language": "Greek",}'
  farm.salmon:
    label: Σαλμόνι
    summary: Μεγάλο ιχθύς που πηγαίνει στους ποταμούς για να τρίψει· είναι συχνά καλλιεργούμενο.
    info: Το σαλμόνι είναι ανάδρους ψάρας που μεγαθύτηπσε στη θάλασσα και γυρνά τη λέβητα δήλωσης στους ποταμούς του να φτάσει. Δικαιώχεται να βρει τον ποταμό του με το μαγνητικό πεδίο της Γης και την όξινη αίσθηση. Το σαλμόνι εφαρμόζεται σε μεγάλες καλλιεργήσεις στη Νορβηγία και τη Σκωτία.
  farm.sheep:
    label: Πρόβατο
    summary: Σαρωτής και παραγωγός γάλακτος.
    info: Η πρόβατο χύθηκε για τους ίνδυμο και σάλπιγξ αφ' είχε νέφωση διώς με λευκή φλοιώδη βλεφαρίδα· είναι επίσης μία απ’ τις πρώτες επιζωϊκές προϋποθέσεις που επιτρέψαν την ανάπτυξη.
  farm.sheepdog:
    label: Σκύλος Οβράχου
    summary: Πρωταρχικά εκπαιδευμένος σκύλος για να φροντίζει και να προστατεύει το βοΐδι.
    info: To Border Colley είναι το πιό δημοφιλές σκύλος οβράχου καθώς χρησιμευτή για να φροντίζει μπροστά από λεξιγραφική βοϊδεία (eye).
  farm.silkworm:
    label: βουρέκι
    summary: Η λαϊκή ονομασία 'βουρέκι' προϋποθέτει την παραγωγή φυσικού σιδηρού.
    info: Το βουρέκι της μούρα είναι η χτενώδης πλάσχωνας από τη συγκεκριμένη φθόρα Bombix Mori για νήμα και διαφοροποιήθηκε στην Κίνα πριν από πάνω από 5.000 χρόνια.
  farm.sow:
    label: Πρασνίτσα
    summary: Ωριμός αρσενοπλής μάχαιρος.
    info: Η πρασνίτσα είναι η ώριμη αρσενοπλή του σπιτικό μάχαιρος και γεννά δύο φορές το χρόνο, με νωπό μέγεθος περίπου 10–14 βρυών. Η λειτουργία των πρασνιτζών σε σφραγισμένα κελιά είναι αξιόποδη στη σύγχρονη γεωργία λόγω των συνθηκών ζωής.
  farm.tilapia:
    label: Τιλάπια
    summary: Θερμοζώνης χλωρίδας ωκεανού μεγάλης κτηνοτροφικής παραγωγής.
    info: Η τιλάπια νερού είναι μια από τις πιο δημοφιλείς κτηνοτροφούμενες ψάρια στον κόσμο· η εκχώρησή του φθάνει σε εκατομμύρια τόνους ετησίως. Διέγνυσε γενικά από τον Νилο και τους λιμνώδεις βραχίονες της Αφρικής, αλλά σήμερα κτηνοτροφείται σε όλους τους συνεχής.
  farm.trout:
    label: trúgono
    summary: Λύχνος της οικογένειας lososidōn που υψώνεται σε λύχνους farming και wild water.
    info: "Η τρυγονίτιδα πηλαιά εμφανίζεται από τη Βόρειους Αμερική και χρησιμοποιείται στην Ευρώπη για φωτοβολικές λύχνους διατροφή με νερό. \nΟ βαθύτερος τρύγονος είναι ένας αυθεντικός ευρωπαϊκός τύπος που ζει σε καθαρά, γρήγορα ρέοντα νερά. \nΚαι τα δύο είδη είναι αξιοπρεπείς αθλητικές και γαστρονομικές λύχνους."
  farm.turkey:
    label: Κρόκην
    summary: Πολύ μεγάλος βοσβούκος που λαμβάνεται για φαγητό.
    info: Το κρόκην έχει τα αυτά που χρωμίζουσαι στη Γλώσσα επειδή δέξθηκε να μεγαλύνει για φαγητό, ειδικά στο Διαφορετικός Προσευχής (Μeleagris gallus).
  farm.water_buffalo:
    label: Βουβάλι
    summary: Πολύ μεγάλο ασιατικό βοϊκό θηλαστικὸ
    info: |-
      Το βουβάλι είναι η κατευθύνση των νερώδων προγόμφων σπέκ ας για χρήση με φυσική διαχείριση και λειτουργεί ως βασικός γεωργικός ζῷος στην Ασία
      Για υψηλό όριο ρυζικών πεδιάδων και μεταφορά φορτίων,
      Η γάλα του είναι πιο λίπαρη απ' ότι το βοείο γάλα και χρησιμοποιείται για την παρασκευὴ της Mozzarella di Bufala.
  farm.yak:
    label: Ζακ
    summary: Μεγάλο χριστιανικό animal της νήσο απ’ όπου διαβάζει.
    info: Το ζακ είναι μια κυλιόμενη φορμά του γέγχως που βρίσκεται στη νήσο απ' όπου διαβάζει σε ύψος 4867 -900m.Είναι η βάση της οικονομίας της Τιμύθιας ;δίνει γάλα ,κρέας,vlna(φράγκα) και λειτουργεί ως μέσο μεταφορών.
