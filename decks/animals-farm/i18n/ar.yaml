lang: ar
pivot: false
title: الحيوانات الاقتصادية
cards:
  farm.chicken:
    label: دجاجة
    summary: طائر زراعي يضع البيض.
    info: الديك الأحمر المنزلي هو أكثر أنواع الدواجن انتشاراً في العالم. توضع بيضها وتُربى لحمها؛ وهناك أكثر من 25 مليار فرد.
  farm.cow:
    label: بقرة
    summary: حيوان زراعي كبير يُنتج الحليب.
    info: البقرة المنزلية تُربى من أجل إنتاج الحليب واللحوم. واحدة من المصادر الرئيسية للغذاء في جميع أنحاء العالم؛ حيث تنتج البقرة المدرّاة ما بين 20 إلى 30 لترًا من الحليب يوميًا.
  farm.donkey:
    label: حمار
    summary: حيوان عملي موثوق به ذو مشية مستقرة.
    info: الحمار المنزلي هو حمار أفريقي جبلي تم ترويضه، ويستخدم منذ قرون كحيوان عمل. إنه متوازن وموثوق ومُستعد لحمل الأوزان الثقيلة.
  farm.duck:
    label: كُرّة
    summary: طَيْرٌ مائيٌ ذو فمٍ واسع، يُربى في المزارع.
    info: تُربى الكِرَّة من أجل لحمها وأيضًا بيوضها. تسبح جيدًا بفضل الأغشية بين أصابع قدميها وتطلق صوتًا خاصًا.
  farm.goat:
    label: الغنم
    summary: حيوان زراعي مزود بالقرن ينتج حليبًا لذيذًا.
    info: تُربى الغنم المحلية من نوع (Capra aegagrus hircus) لإنتاج الحليب واللحوم والسيلان. إنها قابلة للتكيف ويمكن أن تعيش على مختلف النباتات، بما في ذلك المناطق الجافة.
  farm.horse:
    label: ال حصو
    summary: حيوان زراعي قوي يستخدم للركوب والعمل.
    info: الحصو المنزلي (Equus ferus caballus) كان ضروريًا منذ آلاف السنين للنقل والزراعة والحرب، ويُربى اليوم أيضًا من أجل الرياضة والاستجمام.
  farm.pig:
    label: خنزير
    summary: حيوان زراعي وردي ذو أنف مطاطي.
    info: الخنزير المنزلي هو حيوان أليف ذكي يتم تربيته من أجل لحمه، وهو آكل كل شيء ويمكنه تذكر المهام المعقدة.
  farm.sheep:
    label: 绵羊
    summary: 提供羊毛和乳制品的毛发动物。
    info: 家养绵羊（学名：Ovis aries）被饲养以获取其羊毛、奶和肉。它们成群生活，是历史上最早被驯化的动物之一。
