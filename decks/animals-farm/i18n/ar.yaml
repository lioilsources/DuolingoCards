lang: ar
pivot: false
title: الحيوانات الاقتصادية
cards:
  farm.alpaca:
    label: ألفاكا
    summary: حيوان صغير من عائلة الجمال الأمريكي يُربى لإنتاج خيوط فاخرة.
    info: الألفكا حيوان أصغر قليلاً من اللاما ويتم تربيته في جبال الأنديز المرتفعة جداً لحصول على شعره الناعم للغاية، وهو أحد أنواع الألياف الطبيعية الأكثر نعومة بالعالم؛ فهو دافئ ومضاد للحساسية أكثر من الكشمير. هناك نوعين منها هما 'هوايا' ذات الشعر المتجعد و'Suri' ذو الملمس الحريري. أصبحت زراعة هذا الحيوان منتشرة بسرعة حتى داخل القارةヨوروبية.
  farm.barn_cat:
    label: قطة مزرعة
    summary: كلب قط domestique يُربى في المزارع كمفترس للقوارض.
    info: القطة الزراعية هي كلاب القط المنزلية التي تعيش بيئة زراعية، حيث تقوم بالصيد الفئران والجرذان. أنها تحافظ على احتياطي العلف والأرز من القوارض. عادة ما تكون أقل التفاعل مع البشر عن القط السكنية.
  farm.beehive:
    label: حوض النحل
    summary: هيكل خشبي يُستخدم كمأوى صناعي للabe مملكة.
    info: |-
      إن حوض النحل هو بيت اصطناعي لمستعمرة نحلة العسل؛ وهو يستبدل التجويفات الموجودة في الأشجار التي تعيش فيها النحال البرية.
      typically تحتوي مستعمرت على ما بين ٥٠ إلى ٨٠ ألف عاملة.
      كаждى مستعمة منتجة حواليً ٢٠ إلى ٣٠ كلغ سنوياً من العسل.
      The bees هي الملقَّبات الرئيسية، وثلث الغذاء العالمي تعتمد على التلقيح الذي تقوم به.
  farm.boar:
    label: كُرَّاس
    summary: ذكور الخنازير الأهلية أو البرية المرباة في المزارع.
    info: |-
      الكراس هو ذكر خنزير أهلي غير مقطوع العجلة، ويتم تربيته على المزراع للتكاثر؛ حيث يستخدم منيهم للتلقيح الاصطناعي.
      The wild boar has large tusks and is capable of aggressive defense. In cuisine, its meat is considered valuable game.
  farm.calf:
    label: تيل
    summary: صغير البقرة قبل بلوغه عامًا واحداً.
    info: التيل هو صغير الأبقار من ولادته حتى فطامه أو سن سنة واحدة تقريبًا. يقف التيل الجديد للحياة على قدميه سريعًا؛ فالإرادة الأمية قوية جدًا فيه. تُفصل الصغار المرباة لإنتاج الحليب عن أمهاتهن مبكرًا، وغالبا ما يتم استعمال لحم التيل كطبق رفيع في العديد من المطبخ الأوروبي.
  farm.carp:
    label: كابر
    summary: سمكة نهرية كبيرة؛ طبق تقليدي في عيد الميلاد بتشيكيا.
    info: الكابر هو أكبر سمكة تُربى بالبحيرات التشيكية، ويعد جزءًا لا يتجزا من الأعياد هناك. تم إدخاؤه إلى أوروبا الوسطي خلال العصور الوسطى وخاصةً في بوهمانيا مثل البحيرة التريبونسكيّة. إنه كARN مفترس سريع النمو ويمكن أن يصل وزنه لأكثر من ٣٠ كلغ.
  farm.chicken:
    label: دجاجة
    summary: طائر زراعي يضع البيض.
    info: الديك الأحمر المنزلي هو أكثر أنواع الدواجن انتشاراً في العالم. توضع بيضها وتُربى لحمها؛ وهناك أكثر من 25 مليار فرد.
  farm.cow:
    label: بقرة
    summary: حيوان زراعي كبير يُنتج الحليب.
    info: البقرة المنزلية تُربى من أجل إنتاج الحليب واللحوم. واحدة من المصادر الرئيسية للغذاء في جميع أنحاء العالم؛ حيث تنتج البقرة المدرّاة ما بين 20 إلى 30 لترًا من الحليب يوميًا.
  farm.deer:
    label: الغزال المربى
    summary: إما غزلان أو دينك مُربي في التشيك لانتاج اللحم والقرنيه.
    info: |-
      في تشيكا، يزرع الغزالة أو الدينكي كجزء من الزراعة للحصول على لحومها الطبيعية.
      The Dainki أصغر حجمًا من الدينا وله قرون مستعرضة ومميزة.
      take off القرناء كل عام ثم تنمو مرة أخرى.
      لحم الحيوانات هذه هو بديل صحي عن لحم البقر.
  farm.donkey:
    label: حمار
    summary: حيوان عملي موثوق به ذو مشية مستقرة.
    info: الحمار المنزلي هو حمار أفريقي جبلي تم ترويضه، ويستخدم منذ قرون كحيوان عمل. إنه متوازن وموثوق ومُستعد لحمل الأوزان الثقيلة.
  farm.duck:
    label: كُرّة
    summary: طَيْرٌ مائيٌ ذو فمٍ واسع، يُربى في المزارع.
    info: تُربى الكِرَّة من أجل لحمها وأيضًا بيوضها. تسبح جيدًا بفضل الأغشية بين أصابع قدميها وتطلق صوتًا خاصًا.
  farm.emu:
    label: 鸸鹋 تجارياً
    summary: تُربى ذوات الأرجل الطويلة في أستراليا لاستخدام الزيوت، واللحوم، وجلودها.
    info: يتم رعي وتربيّة الذئاب البرية أو ما يسمَّى بـ'ذات الأرجل طويلة الشكل' على المزارع التجاريّة لأغراض اللحم، واستخراج زيت من دهونها المستخدم في المنتجات التجميليّة، بالإضافة إلى جلد تلك الحيوانات التي يتم استخدامها أيضًا. كما أن هذا النوع من الزواحف له خصائص مضادة للالتهاب وتستخدم هذه الخصائص في الطب التقليدي الحديث. بدأت عمليات الرعاية التجارية لهذه الكائنات الحيّة بالتوسع حتى داخل الولايات المتحدة الأمريكية وأوروبا. علاوة على ذلك فإن هؤلاء الثدييات لديهم فضول كبير ولا تخاف البشر.
  farm.farm_shrimp:
    label: كُرْفِيتَّا فارموفَا
    summary: كركيتيتا بحرية تربى بشكل مكثف في أحواض الساحل.
    info: |-
      القرطيتة البيضاء المحيطية هي نوع القرش الأكثر زراعته على مستوى العالم،
      tيوجد المصانع خاصةً جنوب شرق آسيا وأمريكا اللاتينية.
      زراعة الكركيتيتا بكثافة موضوع خلاف بسبب التأثير السلبي على غابات المنغروف.
      والقريد是非转基因的，是世界上仅次于金枪鱼最受欢迎的海产品。
  farm.foal:
    label: حصان صغير
    summary: طفل حصان أقل من سنة؛ يقف على قدميه في الساعات الأولى.
    info: |-
      الحصان الصغير هو طفل الحصان خلال السنة الأولى من حياته.
      في أول ساعات الولادة، يقوم بوضعه على أقدامه ويبدأ بالرضاعة
      لديهم ساقين طويلتين بشكل ملاحظ بالنسبة لجسدهم تقل طوالها مع النمو إلى مرحلة البلوغ.
  farm.freshwater_crayfish:
    label: رجل النهر
    summary: قشري بحيرة مُربى كوجبة فاخرة.
    info: |-
      كان رجل نهري شائعًا في التشيك، لكن تقرّب من الانقراض بسبب وباء الرضوض وملوثات المياه.
      اليوم يزرع داخل أماكن خاصة للزراعة.
      هو مؤشر على جودة الماء؛ لأنه لا يعيش إلا في الأنهار الصافية.
      في القرن التاسع عشر كانت صادرت رجال تشيكا إلى فرنسا وألمانيا مصدر دخل كبير.
  farm.garden_snail:
    label: الحلزون الحديقي
    summary: حشرة مُلحقة كبيرة تؤكل في المطبخ الفرنسي وتسمى 'إسكارغوت'.
    info: يعد الحلزون الحديقي أكبر حيوان من نوعه على اليابسة بأوروبا، ويتم إنتاجه كطعام فاخر يحمل اسم Escargot بالفرنسية. خلال الشتاء يتراجع إلى مكان آمن ويرمم قوقعته بجلد خفيف للاختباء منه. يتم تربيته بشكل صناعي باسم Heliciculture داخل أراضٍ مثل فرنسا وإيطاليا وغيرها.
  farm.goat:
    label: الغنم
    summary: حيوان زراعي مزود بالقرن ينتج حليبًا لذيذًا.
    info: تُربى الغنم المحلية من نوع (Capra aegagrus hircus) لإنتاج الحليب واللحوم والسيلان. إنها قابلة للتكيف ويمكن أن تعيش على مختلف النباتات، بما في ذلك المناطق الجافة.
  farm.goat_dairy:
    label: الغنم المُنتج للحليب
    summary: حيوان الغنم الذي يربى لإنتاج الحليب، والذي تصنع منه الجبن والโยغاورت.
    info: تم ترويض حيوان الغنم منذ أكثر من عشرة آلاف عام ويعتبر أحد أبرز الحيوانات الزراعية انتشاراً. يتميز لبن الغنم بأنه غني بالعناصر الغذائية ويكون أسهل هضماً مقارنة بلب الأبقار؛ مما يجعله مناسباً لمن لديهم عدم تحمل اللاكتوز. كما يستخدم هذا اللبن في إعداد أنواع مشهورة من الجبن مثل جبن الشفر أو الفيتا أو الهاليومي. بالإضافة إلى ذلك فإن الغنام قوية ومتكيفة ويمكنها الرعي حتى على التلال الصخرية.
  farm.goose:
    label: الغَازلُ الْخانِي
    summary: طيرٌ من فصيلة الدواجن مربى للحومه وريشه والزغاليل.
    info: ينحدر الغزل الخاني عن الطيور البرية منذ أكثر من ثلاثة آلاف عام، وكان أحد أوائل الحيوانات المدجنة؛ حيث كانت تحرس الكابيتول في روما بالفعل. يقدّر الناس لحمه ولiverه المعروف باسم foie gras وكذلك زغليلاته.
  farm.guinea_fowl:
    label: الدجاجة المُقَطّعة
    summary: طائر أفريقاني يربى للأكل ولحماية الناس من الثعابين.
    info: تتميز الدواجن الأفريقيّة بأنها تعيش في السافانا، وتستخدم كحارس طبيعي على مزارع؛ لأن صوتها العالي يمكن أن ينبه إلى وجود ثعبان أو حيوانات آكلي لحوم أو حتى إنسان غريب. لها ريش بني فضي متقطّع باللون الأبيض ورأس أحمر وأزرق بدون ريشه.
  farm.guinea_pig_farm:
    label: خنزير غينيا المربى
    summary: الخنازير الغنية المربيّة لмяستها في أمريكا اللاتينية أو كحيوان أليف.
    info: |-
      يأتي خنزير غينيا المنزلي من جبال الأنديس، حيث تم ترويضه بواسطة الإمبراطورية الإنكوية قبل أكثر من ٣ آلاف سنة作为一种肉类来源。
      وحتى اليوم يُعتبر طعامًا تقليديةً في بيرو وإكوادور وكولومبيا (ويسمونه هناك 'كي').
      في أوروبا وأمريка الشمالية هو حيوان الألوف الشائع لدى الأطفال.
      يتواصل باستخدام أنماط معقدة من الصوت مثل النباح والنباح العالي.
  farm.highland_cattle:
    label: سكوت شوسيان هايленد
    summary: نوع من الأبقار اسكتلندية ذات الشعر الطويل البني الداكن والقرنين الكبيرين.
    info: الهايленدر الإسكتلندي هو سباق قوي للأبقار يُربى في البيئات الصعبة المرتفعة في إسكوندا. تتميز بشرائها طويلة اللون الرمادي المائل إلى الحمرة، والتي توفر حمايتها ضد البرودة ورطوبة الجو. كما أنها مقاومة أكثر وأقل عرضة للمرض مقارنة بأنواع أخرى من الغنم. لحمه نكهة غنية ومميزة؛ وهو خيار مشهور كبديل عن اللحوم القياسية.
  farm.horse:
    label: ال حصو
    summary: حيوان زراعي قوي يستخدم للركوب والعمل.
    info: الحصو المنزلي (Equus ferus caballus) كان ضروريًا منذ آلاف السنين للنقل والزراعة والحرب، ويُربى اليوم أيضًا من أجل الرياضة والاستجمام.
  farm.lamb:
    label: جَهْنُم
    summary: صغير الأغنام حتى سن سنة واحدة، رمز للربيع والبراءة.
    info: الجهنم هو صغير الغنم قبل بلوغ عام واحد من العمر. يولد مع شعر متجعد ويبدأ في الرعي خلال الأيام الأولى حياته. كما أنه رمز للمسيحية كرمز للاستقامة ويسوع على هيئة الحمل الإلهي. تناول لحم الجهم (لحم الصغار) طعامًا مشهوراً لدى العديد من المطابخ العالمية.
  farm.llama:
    label: لاما
    summary: ثديٍّ من فصيلة الفيلكودات الجنوب أمريكية المربى لขนها ونقل الأحمال.
    info: |2-
       Lama هي حيوان فيلكوذي جنوب أمريكي تم ترويضه منذ أكثر من خمسة آلاف عام بواسطة الإنكا.
      كان يُستخدم كحيوان نقل رئيسي للإمبراطورية الأندين؛ حيث يستطيع تحمل ما يصل إلى نسبة 30% من وزنه الجسماني.
       يتم التقدير قماش اللاماس بسبب خواص عزل الحرارة الجيدة له.
       كما أن لها سمة مميزة وهي أنها تصيب بالقيء عندما تكون غاضبة أو تحت الخطر.
  farm.mule:
    label: مزيك
    summary: عُذقٌ غير قابل للإنجاب ناتج عن تزاوج الحصان والحمار يتمتع بقوة وتحمل استثنائيين.
    info: |-
      المzik هو عبارة عن مخلوط بين حصان أنثى وأسد ذكر؛ العكس يسمّي المولا.
      هو كائن لا يمكنه الإنجاب، لكنه متواضع للغاية في القوة والعزم والنضال ضد الصعب.
      لديه إحساس جيد بالمكانية الأرضية ويكون أكثر انتباهاً من الخيل وهو أقل خوفًا منها.
      كان ضروريًا على مدى آلاف السنين لنقل البضائع عبر الأراضي الجبلية.
  farm.mussel:
    label: الحلزون
    summary: حشرة بحرية قابلة للأكل تُربى على الحبال في مياه البحر.
    info: يتم رعي الحلزون الأكلي بكثرة داخل المزارع تحت طول الساحل الأوروبي للبحر الأطلسي، ويزرعونه باستخدام حبال أو كرات ضمن مناطق الرسو والانجراف. كما أنه يفلتر المياه ويعتبر غذاءً صديقاً للبيئة مع بصمة نشطة للكربون صغيرة جداً.
  farm.ostrich:
    label: ' ostrich farmed'
    summary: Ostrich raised for its meat, feathers, and skin.
    info: The ostrich is the fastest bipedal animal and it's bred on farms primarily for its meat, hide, and plumage. Ostrich meat resembles beef but has lower fat and cholesterol levels. The bird’s skin is highly valued by luxury shoemakers.
  farm.ox:
    label: بقرة مذبوحة
    summary: الثيران المخصى كان الحيوان السحب الأكثر أهمية في الزراعة تاريخياً.
    info: |-
      إن البقر هو ذكر من الثيران المنزليين تم تربيته للعمل،
      وكان أساساً لحيوانات سائقة زراعية عبر معظم العالم على مدى آلاف السنين.
      وبفضل قدراته القوية وطبيعته الهادئة حفر أكثر أراضي ما عرف بالزراعة البدائية مما فعله الخيل.
      في الزراعة الحديثة استُبدل بمحركات الآلات لكن لا يزال مستخدماً بكثرة في الدول النامية.
  farm.oyster:
    label: المحار المزروع
    summary: حشرة بحرية تُزرَّع على الحبال أو في الأقفاص داخل المياه الساحلية.
    info: يتم زراعة المحار في مياه الشاطئ باستخدام حبالٍ وأسلاك؛ يبلغ سن النضج خلال ثلاث إلى خمس سنوات. كما أنه يعمل كمصفاة للماء ويساعد في تنقية النظام البيئي البحري. يتم استهلاكه نيِّفًا أو مشويًّا، وهو طعام فاخر. أما محارة اللؤلؤ فهي مصدر للذهب الطبيعي.
  farm.peacock:
    label: البوق الأزرق المنزلي
    summary: ذكر البوق المربى في الحدائق والقصور لأغراض الزينة.
    info: |-
      يأتي البوق الأزرق من الهند، وتم ترويضه منذ آلاف السنين كطائر زخرفي.
       الذكر ينشر أكثر من مائة ريش مشوّح ليشكل شكل فانٍ هائل لجذب الإناث.
       صوت طائر البوق عالي جداً ومميز.
       في الهند هو الطير الوطني ويُعتبر رمزاً للجمال.
  farm.pheasant:
    label: بازانط مزارعي
    summary: البزانت المربى في المزراع والمُطلق لغرض الصيد.
    info: يتم تربية البزانت العادي في التشيك على المزارع ويُفرج عنه بانتظام إلى الطبيعة لأهداف صيد الحيوانات. يعود أصله آسيويًا؛ وقد تم إحضاره إلى أوروبا من قبل الرومان. الذكر له لون ملفت وذيل طويل، بينما الأنثى ذات اللون البني المتواضع.
  farm.pig:
    label: خنزير
    summary: حيوان زراعي وردي ذو أنف مطاطي.
    info: الخنزير المنزلي هو حيوان أليف ذكي يتم تربيته من أجل لحمه، وهو آكل كل شيء ويمكنه تذكر المهام المعقدة.
  farm.pigeon_farm:
    label: البجع المنزلي
    summary: غُربة منزَّلة تُتربي لحمها أو سباق الطيران.
    info: يتم تصنيف الغراب المحلي كنوع غربي مهجن؛ وقد نشأت منه المئات من السلال المختلفة عبر التهجين المتخصص. يُعتبر طائر السكاب، وهو لحوم صغيرة للغرابة الصغار، وجبة فاخرة في العديد من الثقافات. أما الغرائب الرياضية فهي تم تحويلها إلى أصناف عالية الأداء بسرعة كبيرة جداً حيث يمكن أن يصل معدل بعض الفرد منها أكثر من ١٥٠ كلم بالساعة. كما يوجد تقليد قوي بين محبي رياضة البجعة داخل التشيك.
  farm.piglet:
    label: صِلُو
    summary: طفل الخنزير، عادةً ملون بالوردي ونشيط.
    info: "الصلع هو طفل خروف المنزل في الأسابيع الأولى من حياته. \nالخنازير الصغيرة حديثة الولادة صغيرة جداً لكنها تنمو بسرعة. \ntypically рожает الإناث (الحماريات) ما بين ١٠ إلى ١٢ صلو خلال ولادتها الواحدة. \nThe سلع هي ذكية؛ أظهرت دراسات أن الخنازير لديهم مستوى ذكاء مشابه للكلب."
  farm.pony:
    label: بوني
    summary: سلالة خيول صغيرة نقيّة، محبوبة لركوب الأطفال.
    info: |-
      البونية هي سلالة الخيول الصغيرة التي لا تتجاوز ارتفاعها عند الكتفين ١٤٫٢ ذراعًا (أو ما يعادله في السنتيمترات هو ١٤٧ سم).
      The الشتيلاندي البونية是最小的一种，起源于苏格兰的设得兰群岛。
      إنها كائنات قوية ومقاومة للظروف القاسية
      وتُستخدم بكثرة كحيوان ركض للأطفال أو حتى كحيوان عمل تحت الأرض.
  farm.quail:
    label: كريبيلكا اليابانية
    summary: طائر صغير يتم تربيته في المزارع لإنتاج البيض واللحوم.
    info: الكربيلا اليابانية هي نوع من الطيور المنزلية التي يُربى بشكل مكثف للحصول على بيوضها ولحومها، وتبيض الإناث تقريباً كل يوم؛ حيث تعتبر هذه البيضة طعاماً فاخراً في العديد من المطاعم. كما أنها تنضج بسرعة وبدأت بالفعل بالإباضة بعد ست أسابيع فقط.
  farm.rabbit:
    label: أرنب
    summary: الأرنوب المنزلي المربى للأكل أو الفراء كحيوان أليف.
    info: تم ترويض الأرنب الأوروبي في العصور الوسطي من الأنواع البرية، وله أكثر من خمسين سلالة معترف بها متفاوتة الحجم واللون والنوعية الشعرية. الإناث يمكنها إنجاب ما بين ٤ إلى ١٢ صغيرًا وتلد عدة مرات سنويًّا.
  farm.ram:
    label: بران
    summary: ذكور الأغنام البالغة التي تمتلك قرونًا ملتفة كبيرة.
    info: يُعرف البران بأنه ذكر الغنم المنزلي الناضج، ويتميز بقرونه الملتوية بشكل لفاف واضح الذي لا يملكه الإناث أو يكون لدى بعضها صغير جدًّا. خلال موسم التزاوج في الخريف، يتقاتلون الذكور بالاشتباك المباشر برؤوسهم وقرنوصحوب القوة والخصوبة والعلاقات الرمزية والتاريخية مع المعتقدات.
  farm.rooster:
    label: كُوهَوت
    summary: ذكور الدواجن المنزلية؛ يعلن عن الفجر بنباحه.
    info: الكوهوت هو ذكر دجاجة منزلية ويتميز بشعر لونيه وجناح وقرن ملونين. النباح هو سلوك ترابي، ويمكن أن يحدث في أي وقت وليس فقط عند شروق الشمس. يعتبر الكوحوت رمزًا للانتباه في التشيك، وهو أحد الحيوانات الاثني عشر في التقويم الصيني. كما كان اليونانيون القدامى يقدمون الذبيحة لهيسكلابوس كرمز لأول فجر.
  farm.salmon:
    label: سمك السلمون
    summary: سمكة بحرية كبيرة تهاجر إلى الأنهار للإفراز؛ يتم إنتاجها بكثرة في المزارع.
    info: السلمون هو سمكة أنادرومية، ينضج تحت البحر ولكن يتوجه مرة أخرى نحو أنهاره الأصلية للتزاوج. القدرة على العثور على النهر الأصلي تعتمد على المجال الجغرافي الأرضي والرائحة. الإنتاج الزراعي لأسماخ السالمون في نورويجا واسكتلندا من أكبر قطاعات الاستزراع السمكي.
  farm.sheep:
    label: 绵羊
    summary: 提供羊毛和乳制品的毛发动物。
    info: 家养绵羊（学名：Ovis aries）被饲养以获取其羊毛、奶和肉。它们成群生活，是历史上最早被驯化的动物之一。
  farm.sheepdog:
    label: كلب رعاية الأغنام
    summary: ' كلب يتم تدريبه بشكل خاص لإدارة حشود الماشية.'
    info: يعتبر بوردر كولي أكثر سلالات الكلاب شعبية لرعاية الغنم، ويتم إدارته عبر الإشارات البصرية والتعليمات الهادئة. يُعد من السلالات الأكثر ذكاءً لدى الحيوانات المنزلية. يمكن وراثة القدرة على العمل ولكن يجب تنميتها بالتدريب منذ مرحلة الرضاعة.
  farm.silkworm:
    label: بُورِك موروشوفى
    summary: يرتبط بُرك الموروش بالحصول على حرير طبيعي.
    info: إنّ بوَرْك الـموروشي هو حسٍنة من فراشة السيلك التي تربى في الصين منذ أكثر من خمسين ألف سنة لانتاج الحرير الطبيعي، ويتكون كيسه الواحد من سلك واحد يزيد طوله عن تسعمائة متري، وكان هذا النوع قيماً جداً إلى درجة أن الصين كانت تحافظ بشكل صارم للغاية على أسرار إنتاجه عبر القرون الماضية.
  farm.sow:
    label: خنزير أنثى
    summary: أنثى الخروف البالغة، أم صغار الخنازير.
    info: |-
      إن الأنثى المدربة هي خنزيرة منزلية بالغة تُنتج مرتين في السنة مع ولادة تتراوح بين ١٠ إلى ١٤ من الصغار كل مرة
      تربية هذه الحيوانات بشكل كثيف يثير جدلًا كبيراً بسبب ظروف السجون الضيقة المستخدمة حالياً
      وهي حيوان ذكي ويقوم برعايته لأطفاله لمدة أسبوعيّن ونصف تقريبا.
  farm.tilapia:
    label: تيلابيا
    summary: سمكة مياه عذبة استوائية تُربى بكثافة في جميع أنحاء العالم.
    info: تيلابيا النيليّة هي واحدة من أكثر الأسماك المزارعة انتشارًا بالعالم؛ حيث ينتج منها ملايين الأطنان سنويًّا. أصلها نهر النيل وبحيرات إفريقيا، لكن الآن يتم زراعتها على قارات مختلفة حول العالم. وتتميز بمقاومتها العالية والنمو السريع وعدم حاجتها إلى أعلاف غنية.
  farm.trout:
    label: سمك السلمون
    summary: سمكة من فصيلة سمك السلور تُربى في مزارع الأسماك وفي المياه الحرة.
    info: يأتي سلوك الطرية الملونة إلى أمريكا الشمالية، وقد تم إدخالها لأول مرة بأوروبا كأسماك زراعية. أما طراز النهر فهو نوع أوروبي نقي يعيش بالمياه الصافية والأنهار الجارية بسرعة. وكلا النوعين يتمتعان باحترام كبير بين محبي الرياضات والمطاعم. وتعد رعي هذه السمكات تقليدًا قائمًا بالفعل داخل جمهورية التشيك خصوصاً المناطق المرتفعة.
  farm.turkey:
    label: كروكان
    summary: طائر كبير مُربى للحوم، رمز عيد الشكر الأمريكي.
    info: |-
      يأتي الكوكو الداخلي من المكسيك حيث تم تربيته بواسطة الأزتيكيين قبل أكثر من ألفيتَ عامٍ.
      The male has characteristic wattles that can spread their tail feathers like an open fan.
      في الولايات المتحدة الأمريكية هو طبق تقليدي في يوم العطاء؛ وهو ثاني أكبر نوع دواجن يتم إنتاجه على مستوى العالم.
      الكلمة "كروكان" أعطتنا أيضًا وصف شخص متضخم.
  farm.water_buffalo:
    label: بوفالو المنزلي
    summary: حيوان بوفي كبير من آسيا، يُستخدم أساسًا كحيوان سحب في مزارع الأرز.
    info: يعتبر البوفالو المنزلية شكلًا مستأنفًا للبوفالو المائي ويشكّل الحيوان الزراعي الأساسي لآسيا. يستخدم منذ آلاف السنين لإعداد حقول الأرز والنقل بالحمولة الثقيلة. كما أن لبنه أكثر دسمة من لبن العجل ويستعمل لتحضير جبن الـموزاريلا دي بوفلا. وفي الهند هو حيوان مقدس لدى الهنود.
  farm.yak:
    label: ياك
    summary: حيوان كبير من منطقة التبت المرتفعة؛ يُنتج الحليب واللحم ويستخدم كقوة سحب.
    info: |-
      الياك هو نوع مربى لوحمة تعيش على ارتفاع يتراوح بين ٣ آلاف إلى ٥٫٥ ألف متتر في بقية الهضاب التبتيّة العليا.
      يعد مصدرًا أساسيًّا للاقتصاد التبتي، حيث يقدم حليبه ولحومه وفروه وأيضًا قدرته على السحب.
      فراؤه ناعم جدًّا دافئ.
