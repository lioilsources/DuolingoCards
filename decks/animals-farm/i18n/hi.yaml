lang: hi
pivot: false
title: अर्थवृद्धि पशु
cards:
  farm.alpaca:
    label: अल्पाका
    summary: एक छोटी हुई कैमेलिड पशु जिसे सूति महसूरने के उद्देश्य से प्रजनन किए गये।
    info: "विनग्वा पॅकोस के रूप में भी बख़्बख़ा इंडियन आउषधि और फौलाहरी के तथ्यों में चिट्ठा खण्ड के ऊची पहाड़ियों में घरेलू ढंग से प्रजनन किए गए थे।\nइसकी सूति धागे ऐसे हैं जो दुनिया के सभी प्राकृतिक झीलों में से सबले ओढऩे वाले हैं - गर्म, हाइपोआलर्जेनिक और कश्मीर से भी नरम। \nऊपरी दो नस्लेँ हैं : 'हुओ' (घनी), और 'सुरी' (रेशमी)\nअल्पाका के प्रजनन के कार्यक्रम यूरोप में भी तेजी से फैल रहे हैं।"
  farm.barn_cat:
    label: गांव की बिल्ली
    summary: एक पशुधन में होलेरा संभारण के उद्देश्य से एक घरेलू चमत्कार।
    info: |-
      खेति क्रम में गाड़ी और अनाज के संचय के खतरे से नष्ट करने के लिए इस छोटे वजन भेषज को ध्यापन कहा जाता है।
      इसके आबासी झुंड के ऊपर फौलाहट थोथे ओर ढीठ ठेम नई होती है।
  farm.beehive:
    label: मधुबन का झाड़ी
    summary: लकड़ी से होनेवाली मैनेज्ड हंसिफर प्रजाति के एपिस मेनफिरा।
    info: "एक मधुबन का झाड़ी आवश्यकता के अनुसार बनाओ गया घर होता है और इसमें खुद उगने वाले पेड़ों के छिद्रों की भाँति काम करता है।\nआमतौर पर ऐसे झाढ़ी में 50,000 से 80,000 मधुचरण होते हैं। \nहर झाणी शाही चीनी के 20 से 30 किलोग्राम उत्पादन करती है।"
  farm.boar:
    label: कनेस
    summary: खतरे में डाला हुआ पीग कॉल्ट या संयोजित।
    info: |-
      एक कनेकस घरेलू अथवा जंगली स्वच्छ बरमहर का एक नईफ़िट श्रेणीपद होता है।
      बड़े खेमर में कनेच्ह फँसे रहते हैं और इनके गठन का आधारभूत भाषण ध्वनि द्वारा ऑपरेशन के लिए उपयोग किया जाता है。
      अशुद्ध कनेप ऊंचे ठीढ़ ढंग से ओछे झुकाव थे और ऐग्रेसिव रक्षा कर सकता है।
      इन्हें खाना पकाने में एक मौलिक शिकार के रूप में माना जाता है।
  farm.calf:
    label: बछड़ा
    summary: एक साल तक की हल्के मवेशियों की प्रजनन।
    info: |-
      गौओं के बच्चे जन्म के एक वर्ष अथवा दुधखमे छूटे रहते हैं।
      पैदा होते ही इसके टाँगे खड़ी हो जाती हैं;
      mother's instinct भी ठीठ होता है।
  farm.carp:
    label: कापर
    summary: एक बड़ी स्लैटवोदनिया मछलि हे। प्रमुखतया केच के वृषभों में एगो पारंपरिक खाना हे।
    info: "चेस्टीज में जलस्थलों में पाली गई सबसे बड़ी मछलि कामन काफ्रोइश हह। इओ दिशा त्योहारों से अटॉठ हऊथे।\nअधिकाँश ओउरोप मेडळयुग में घरेलू करे गए आऊर भेषण में (त्रेबोंस्के झर्हनिक) \nआऊर ऑल छोर धाऊ और तेजी से बढऩे वाले हऊथे।"
  farm.chicken:
    label: मुर्गी
    summary: अंडे देने वाला कृषि पक्षी।
    info: गैलस गैलस डोमेस्टिकस हॉसपेड मुर्गी है जो सबसे अधिक फैली हुई पक्षी प्रजाति है। यह अंडे देती है और मांस के लिए पाली जाती है; इनकी संख्या 25 बिलियन से भी अधिक है।
  farm.cow:
    label: गाय
    summary: एक बड़ा कृषि पशु जो दूध देता है।
    info: घरेलू गाय के मवेशियों को दूध और माँस के लिए पाला जाता है। वह सम्पूर्ण विश्व में खाने की आवश्यकता की एक प्रमुख आपूर्ति है; एक दूध उत्पादन गाय प्रतिदिन 20-30 लीटर दूध देती है।
  farm.deer:
    label: फार्मों में जिना
    summary: खेती करे हुए सैलवर या पकड़े हुए हरन के लिए।
    info: "चेकप्रजा में 'दाँय' और 'हरन' कई फारमों में बसे हुए हैं अथवा वे शिकारी मास के उत्पादन के लिए चलाइए गइए हओ।\ndanek छोटे हओ आऊर डगढ़िया घोंघे भी खासबर हरनों से ओठे हओ। \nhorned animals घोंघे हर साल झण्टा धर ढे ऊ ठीक ऐसे ही बढ़ जाथे।"
  farm.donkey:
    label: गधा
    summary: चालक गधा एक स्थिरता पूर्वक चलने वाला कामगार जानवर होता है।
    info: घरेलु गधा अफ्रीकी शाबूत गधा का घरेलू रूप है, जिसका उपयोग लंबे समय तक काम करने वाले जानवर के रूप में किया जाता है। यह टिकाऊ, भरोसेमंद और भारी भार ढोने की क्षमता रखता है।
  farm.duck:
    label: कच्चा
    summary: एक जलीय पक्षी है जिसमें एक सपाट बिल होता है और किसानों द्वारा पाला जाता है।
    info: घरेलु मुरगे के अंडे और माँस के लिए पाला जाता है। उँगलियों के बीच फैली प्रभावशाली झिल्लियों के कारण घरेलु मुरगा खूब तैर सकता है और इनके आवाज भी विशिष्ट होते हैं।
  farm.emu:
    label: एमू फार्मिग
    summary: ऑस्ट्रेलिया मे एमु को तेल, मास अउ चर्खीक पटल हेबि संभाळत।
    info: |-
      ओजनवान ऑयल औषधि मे उपयोग हथहबि जे शामनशक्ति वाहि।
      अफ़्रीदा आऊर ओरोपा मे भी इ धड़क देकर छई घलच।
  farm.farm_shrimp:
    label: कॉर्मोरन फारम
    summary: तटीय संलग्न केंद्र मे पिशवा हुआ समुद्री खचड़िए।
    info: |-
      बहुधा 'सफेद पश्चिमी' तख्ता लिटोपेज़्ज़ेऊस वैनमेयई के बढ़ाओ गइथे हई।
      अधिकाँश इउ के एशिआ के डाहिस और अमेरिका मे ओकठा हई।
  farm.foal:
    label: गैलोप
    summary: एक साल तक के हुबहरा पश्चिमी में।जन्म के घंटों के भीतर वे खड़े हो जाएंगे।
    info: |-
      घोड़े के बच्चे अपने प्रथम जीवन वर्ष के दौरान 'गैलोप' कहलाये जाते हैं。
      इसके उभयदखि शिरोधर्थ और आहार ग्रहण करना इसके जन्म के कई घंटों के भीतर हो जाता है।
      अपने छोटे ऊष्णकास के ठीठे के झुकाओ के फलस्पर्धा ऐसे टाँगों के ढीलाकर डाहिने ऑफ जाते हैं।
      गैलोप खेळने और जिज्ञासा भरे होते हैं;
      उनके प्रशिक्षण की शुरुआत उनके दो या तीन साल की उम्र में होती है।
  farm.freshwater_crayfish:
    label: झील के खरगोश
    summary: एक स्लादवॉटर में प्रजनित हुआ क्रस्टेशियम।
    info: "चेकप्रदेश में 'झील का रब' बहुत आम था, लेकिन इसे ज़्यादातर एक वाईरस और पानी के प्रदूषण के कारण घास के झंडे में डुबो दिया गया था।\nअब चिपके फामों में पाला जाता है। \nइसके अधिकतर छठि भाषाओं में ऐसे धुंढे जाते हैं जहाँ पानी ठीक हो।"
  farm.garden_snail:
    label: गार्डन सीक
    summary: फ्रेंच खाने में परोसा हुआ एक बड़ा किलमतलबीय जंतु।
    info: "शैखवज़्हादि (गार्टेन सीक) यूरोप का सबसे बड़ा भौमिक घोंघा है।\nfrench cuisine में 'एस्कर्गट' के तौर पर इसे अधिक महत्व और प्रभाव दिया जाता है। \nwinter में यह छिप जाता है और hibernation के लिए शेल को झिल्ली से ढक लेता है。\nhelicoptericulture कई देशों - फ्राँस, इटली आदि में किसाओं द्वारा किया जाता है।"
  farm.goat:
    label: बकरी
    summary: चिपचिपा दूध देने वाला पंजों वाला कृषि पशु।
    info: गृहस्थ बकरी मनखे, मास और ऊन के लिए पाली जाती है। यह अपयुक्त भीतर समायोजित हो सकती है और शुष्क क्षेत्रों सहित विविध वनस्पति पर उपलब्ध रह सकती है।
  farm.goat_dairy:
    label: दूध की बकरी
    summary: एमवने से पाला हुआ मवेशियों का एक प्रजाति, जहाँ से पनीर और दही निर्मित होता है।
    info: "गृहस्थ भेड़िया 10,000 से अधिक साल पहले घरेलू आबादी के उपचार के लिए चुना गया था और इसे सभी खेती के छोटे वनस्पति में से एक माना जाता है।\nभेड़िया दूध पोषण धनी होता है और ऊंघ ठीठ के लोगों के लिए फाटक ढीठ के तुलना में ओछा होता है। \nअफवाहों के ऐश्वरिक झासे जैसे 'Chèvre', 'Feta' या 'Halloumi' बनाए जाते हैं।"
  farm.goose:
    label: घरेलू हंस
    summary: माँस और पीठों के लिए पाला महत्वपूर्ण सुअल।
    info: |-
      घरेलू हंस 3500 से अधिक साल पहले जंगली हंसों से उत्पन्न हुआ था।
      यह प्रथम पालतौभी पशुओं में से एक रहा है;
      rōme में कैपिटोल के हंस द्वारा बचाया गया था。
      hंस के पीटों, मास तथा hंs के फ़्लेम के खाश चाहे भी इसके ऊष्ठिष्ठ है।
  farm.guinea_fowl:
    label: परलीचा
    summary: एक अफ्रिकन पक्षी मांस के संग्रह हेतु और सैमयोजि्त रखवाला के रूप में।
    info: "इस परलीचा का उद्गम एशिया से है, जहाँ वह घासभूमिमय इलाकों में आबाद है।\nfarmers फ़ार्मों पर नौटिचल बड़े ध्वनि के कारण डरापट भईया, शिकारी ओर छठे लोगों के खबर देहि के लेट ऊधर रखत हई। \nउसके झाठ ग्रे रंग के हई थे ऐ बिना ढंग के सफेद धब्बा हई ओर ऋषि रंग के बिना पंघुआ गढ़ हई।\nऊकरा मांस ऑर्ण जानवरों के मांस के स्वाद में समान हई।"
  farm.guinea_pig_farm:
    label: फार्मो मरचे
    summary: लैटिन अमेरिका की प्रति हवेलईयन सज़ादा या मसाजक बहुउपयोगी।
    info: "घरेलू मरचे एंडीज़ से आए हैं, इन्हें 3500 से भी ऊपर साल पहले दक्षिण अमेरिका में खासकर चावल के उत्पादन के तौर पर घरेलू ढंग से छोड़ा गया था।\nअब ऐशिया, ओइक्टेडोर और कोलंबिया में 'कुआ' के रूप में फैले हुए हैं। \nभूरे ध्रुवीय शीत झीलों और उत्तरी अमेरिका में ये बच्चों के पालतू जानवर के रूप में लोकप्रिय हैं।"
  farm.highland_cattle:
    label: स्कॉटिश हाईलँड से कुतरा
    summary: एक ऐसी प्रजनन विधि में लंबे रंगदार बच्चों और महान खुशखबरी।
    info: |-
      यह एक प्रमुख प्रजनन तथा अपवाह भाग के जंगली इलाकों में आधारित है।
      इसकी छोटी ऊष्णकरण देखभाल ठंढे या घुले हुए थे कई फासफोरस डाटा के झुठलाओ को ढंक लेती है。
      अन्य प्रजननों के तुलना में यह ऑल्पन और बीमारियों के खिलाफ अधिक अछूत है।
  farm.horse:
    label: घोड़ा
    summary: एक शक्तिशाली कृषि पशु है जिसे सवारी और काम में उपयोग किया जाता है।
    info: देवल घोड़ा हजारों साल तक परिवहन, कृषि और युद्ध के लिए आवश्यक था। अब इसे खेल और आनंद के लिए भी पाला जाता है।
  farm.lamb:
    label: बकरी
    summary: एक साल तक के उम्र में हिरनों का पलता बच्चा, वसंत और अज्ञयता का प्रतीक।
    info: "हिनौवा एक साल या इससे कम आयु के हिऱण होते हैं।\nइनका जन्म ऊँट के झाड़ियों के साथ होता है और शुरुआती दिनों में घास खाकर भगड़ों लगाते हैं。\nईसाईधर्म में यह ठीठपन और गोद धर्म के छोटे ढेर के प्रतीक होते हैं। \nभेष फलाहार (खाटा), ऐशिपन के ओषथ व्यञ्जनों में एक लोकप्रिय खाणा है।"
  farm.llama:
    label: लामा
    summary: एक दक्षिणी अमेरिकन सुअर कोशिश प्रजाति हैं। इसके मेढ़े और पहुचाने के लगवय जाथे हई।
    info: "इंका बड़े भारतीय सभ्यता वास्पद एटले 5000 से ऊपर छब्हर गथे हई।\nआण्डीज उष्ठल घुमाओ के चढऩे आऊर टोकरे के लगवय जाधे हई। ऐ खुद अपने फिझिकल वेंट के 30% तक भार ले सकधे हई। \nलामा मेँढऽ के गर्मी ऑफर करे वाळा गुणखंड के लगवय जाधे हई।"
  farm.mule:
    label: मीज़ेक
    summary: घोड़ा और हाथी क्रॉसबुल्लेट से पैदा हुआ एक अपत्यहीन मिश्रण।
    info: |-
      एक मीज़ेक घोड़िया (मादा गधा), जिसे 'ओश' कहा भी जाता हैं, व्‍यवहार में बच्चा होता हैं; इसके ठीक ऊपर के ओखट को मुला कहा जाने वाला खगोल होता हैं।
      इसके आउटपुट फौलाड होते हैं, लेकिन यह धीरज और शक्ति के सामथ्र्य से छलछलित होता हैं。
      अपने झील में ऐसा ऑफर ढूढँ करता हैं जो घोड़े के बराबर होता हैं;
      ऊष्णकटिबंधीय क्षेत्रों में अभिप्राय ले जाने के लिहाज से यह हजारों वर्षों तक अपरिहरणीय रहा हैं।
  farm.mussel:
    label: स्लावका
    summary: एडिबल समुद्री घोंघा महरू के पानी में रस्सियों पर पाला हथग़।
    info: |-
      जबकि 'स्लाफवा' एटलाटन्तिक ओशन के अधिकतर भाग में जलपादयों पर चढ़ाई और उठाई जाती है।
      इसे डच्छा धामनियों या खाँचों में इकट्ठा किया जाता है।
  farm.ostrich:
    label: फार्म पशुपक्षी
    summary: मांस, बरछियों और सौखन के लिए पला हुआ मेहद़िया।
    info: |-
      एग्रिकचर में महत्वपूर्ण फाउण्डवान जाति के मेहद़िया को माँस, सौखन अथवा चमड़ी के लिए पाला जाता है।
      mehdiya ke māṃsa ka rūpa gō-meat ki tarahi lal hai par yeh ēvam ya adhik taḍak aur cholastrol bhīndan wala hota hai。
      The skin is highly valued by luxury fashion brands.
  farm.ox:
    label: वौल
    summary: कास्ट्रेशन किया गया मुरगी पशु हस्तको सबले खेमणि कमज़्म।
    info: |-
      एक वौल घरेलू पशुओं का कटोरत नर होता है जिसे कार्य के लिए पाला जाता है।
      हजारों साल बच इसे दुनिया के अधिकाँश भाग में कृषि का मूलभूत ड्राफ्ट जानवर माना जाता था।
      इसकी मजबूत और आदर्शपूर्ण प्रकृति के कारण उर्ध्वाहरण कृषि में ऊँघों की तुलना में ओझल चापड़ ढेर कई झाड़ी छोड़ दी।
  farm.oyster:
    label: ओस्ट्रा फारम
    summary: एक समुद्री मृग को पतले जालियों और हथेनपनों पर तटवरखि वादयों में चहचाक गई।
    info: "अण्ड़ी उष्ण अउ खाम बाहर एक ओश्रिआ छऊड़ भइयो झि धाँध घलछि ; इ ढाई थि पाञ्च साल में पकछि।\nइ ठठा शुद्ध करे अउ समुद्री पारिपेष्ठि को शुद्ध करे में मदद करछि। \nइ ऊब ऐवज उबाळकर खािआ जाइत छि।"
  farm.peacock:
    label: गृह पीलक
    summary: सजावट के लिए स्टेशनों और पार्क में हुएशा प्रदर्शन करते हुए पीलक।
    info: |-
      भौर भारत के मूल निवासी हैं तथा हज़ारों साल पहले सजाबर पक्षि के रूप में घरेलू कर दिये गये थे।
      माधवाचरण पीलक अधिकाँश 150 सजाहते हुए पखों को आशचर्यजनक फॉफड़े में खोलते हैं जबकि माड़ों को झुकाओ के लिए。
      उनकी ऊँची छोटी इष्ठि बहुत ऐठी और ढीली होती है।
  farm.pheasant:
    label: खेती का बाज़न्ट
    summary: फरमों पर पाले हुए और सिंहल के मकसद से छोड़े गये एक प्रजाति।
    info: |-
      चेकप्रवश्‍यता में 'बैजँट' फरमों पर पाला जाने वाला चिडगई है अउ इसे शियार के उद्देस्म से आऊधिभृत ढंग से प्रकृति में खोल दिहल जाथे।
      इसकी उत्पत्ति एशिया में हुआई हथे;
      europe में इसे romans ले ले गए ओ हथे。
      भाऊण्ण ध्वज झलकता हओ ऑउ लंबा पूछ होठे,
      audience ठंढा भूरा रंग होठे।
      bajent meat
      अउ ऐसा एक प्रकार का शियार हथे जिसका स्वाद बहुत प्रतिष्ठित हथे।
  farm.pig:
    label: सुअर
    summary: एक गृहीत पालतू जानवर होने के साथ मांस के उत्पादन के लिए प्रयोग किया जाता है।
    info: घरेलू सुअर बुद्धिमान घरेलू जानवर होता है और इसमें विभिन्न प्रकार के खाद्य पदार्थों का अपशिष्ट शामिल होता है। इसके अलावा, यह जटिल कार्यों को याद रख सकता है।
  farm.pigeon_farm:
    label: घरेलू गुब्बारा
    summary: एक प्रजनित कलंगी होवे समय मसाले (चिकन) या दैहिन्‍द उड़ाई के लि।
    info: "घरेलू घुपटा पत्थर के खामखाह जाति हथिस एक आश्रित विशेषण होवे।\nअधिकाँश सभ्यता में छोटे चिड़िया के मांस 'छोटा' अफलाही भोजन मानल जाइत हइ। \nऊड़ाई के धापा फाटे ऊषा के लि ओउठाऐ जाित हइ;\nआओ ठी झील और ऑविण ऋतु के ढाङ चढ़ित हइ।"
  farm.piglet:
    label: सेले
    summary: एक प्रासित का बच्चा होता है। सामनीय रुजवई महसूर होता हैं और खेळलगि भी होता हैं।
    info: "पशुओं के घरेलू सब्ज़ी के शिकाया एम दिनों के अवधि मेँ 'सेले' कहल गइठ।\nअफर उभड़े वाले सेले छोटे होत हं इउर झलखदर ओढऩे के आऊर फौर ऊपर ठीक ढंग से ध्याह डल जाथ। \nऔषिटिक मादा (छोटे प्राणियों ) एक ऑथ ऐसे षण ले दस ि ा बच्चे पैदा कर सकथ।"
  farm.pony:
    label: पोनी
    summary: एक छोटा पूर्ण कासल हॉरसब्रेड, बच्चे सवारी में लगभग।
    info: |-
      शेतलंडियन पोनी सबसे नाटुरल और वह शेतलंड द्वीपों से आता है।
      ये जमीन कठोर परिस्थिति में भी ठीक ढंग से खुद को अछा ध्यज्ञ रखते हैं。
      इन्हें गोद घोड़ा एवं ऊँचाइयों में काम करने वाले जानवर के रूप में भी फायदा माना जाता है।
  farm.quail:
    label: जापानी क्रेस्टर
    summary: अंडे और मांस हेतु पिला समृद्धि कोषयन छोटा पक्षी।
    info: "जापानी क्रेस्टर एक घरला पशुपालन किया गए पक्षी का प्रतिकैवल्य जाति है अंडे व् माँस के उत्पादन हेतु।\nइच्च बहुखण्डों में खाओऽगई भोजन के रूप में इनके अंडे आउभाम हैं। \nछः सप्ताह में ही फलने शुरू कर देथे।"
  farm.rabbit:
    label: खरगोश
    summary: मांस या पैंट के स्ट्रिपल हेतु महतवपूर्ण खरगोष।
    info: "ईधनकीय अवधि में एक घरेलू जानवर के रूप में इसे विकसित किया गया था| \nइसके 50 से भी ऊँचे प्रजाओं हैं और उनमें आकार , बर्डर दबदबा शामिल है |"
  farm.ram:
    label: बरान
    summary: एक वयस्क पुंजला में से हॉन की महत्तवपूर्ण घोंघड़ियाँ।
    info: |-
      बरान एक बच्चा भेड़ का शिया होता है।
      उसमें खासकर ध्रुवीय रखे गए छोटे अथवा लगभग जौना दिमाग के ऊपर झुठेले और फैले हुए आकार के हॉन होते हैं।
  farm.rooster:
    label: कोहूत
    summary: घरेलु मुर्गी का पुंस जिसे सामने के हल्के बज़्यॉम और पैचवार वाले पंखों से पहचाना जाता है।
    info: "एक कोहूत एक डबई चौड़िया का प्रभापद होता है अउ इसे खूबसूरत फीथर, हल्का आऊर टेलफीथर से पहचाना जाता है।\nkōkrāna भूमि के दायित्वपूर्ण ध्वनि के छोटे शब्द होते हैं ओर ऐ हर समय झगड़ा कर सकते हैं। \nअठाऊ ठाढ़ी में कोहूत जागरण के प्रतीक होता है ; चीनी ज्ञाहर थाँआओ में यह बारह जानवरों में से एक है।"
  farm.salmon:
    label: लॉसोस
    summary: एक बड़ी समुद्री मछली हरित क्षेत्र पहुंचाने के लगी होती है ; खाद्य फार्म में अधिकता से पालने की जाती है।
    info: "यह एक Anadromous मछली है - वह समुद्र में पलती है , लेकिन इब्सटवाहन के लि‍ए घर की झील ओर आजाती है | \nअपने गृहनगर की धाट ढौढऩे की क्षमता पृथ्‍वी के चुंबकीय क्षेत्र और शखशन के द्वारा भ्रषणित होती है |\nनॉर्डफळ ऊ ऑर स्कॉटलैंड में छापने वाले लॉसोस का ऐक बड़ा ऋण ठेण था|"
  farm.sheep:
    label: भेड़
    summary: ऊन और दूध प्रदान करने वाला बुशी होस्टड जानवर।
    info: घरेलू भेड़ में ऊन, दूध और माँस के उत्पादन के लिए पाला जाता है। यह समूहों में रहता है और इतिहास में पहले घरेलूकरण जानवरों में से एक है।
  farm.sheepdog:
    label: ओव्चाकी पेस
    summary: एक ऐसा कुत्ता होगा जिसे मरम्मद से ओलचंड़ियन और उनकी रखौट के लिए प्रशिक्षित किया गया हो।
    info: "बॉर्डर कोली दुनिया का सबसे अधिक बहाने वाला खजूर भेड़ कुत्ता है, इसे आई टच और शांत ऑर्डर के माध्यम से झुण्ड के प्रबंधन के लिए पाला जाता है।\nइसके पापा छठप्पा फिहर घर के ऊपर थे। \nउनकी काम करने की क्षमता ठीथी ढंढा जाती है और बच्चे के दिनों से अभ्यास के माध्यम से विकसित करने की आवश्यकता होती है।"
  farm.silkworm:
    label: बूरेस मोरुशवी
    summary: सिल्क उत्पादन के स्रोत होने वाला प्रकृति से रहमान।
    info: "चीन में 5000 से अधिक साल पहले 'बैंबियक्स मोर' के घरेलूकरण के क缘 कटोरा बनाए गए।\nइसका जामोटक तार कई सौ मीटर चढ़ाया और इससे प्राकृतिक शीप धागा खींचा गया। \nऐसा आदर्श था कि भगवान ऐसे ढंग से छुपाओ डाटा फैलाऊ ठीठ झाँड़े रखे।"
  farm.sow:
    label: प्रसनिस
    summary: एक वयोवृद्ध मादा सुअर के पल
    info: "एक प्रसनि हमारी घरेलू सुई की एक बड़ी माँ होती है।\nइनमें औसतन 10 से 14 छोटे सुआओं को जन्म भी दे सकते हैं। \nजबरदस्ती से पशुधन उठाने के कारण आधुनिक कृषि में प्रसनियों के अभिशाप के खिलाफ चर्चा चल रही है।"
  farm.tilapia:
    label: टिलापी
    summary: एक उष्ण कटिबंधीय सुदृढ़ मछली होने का प्रतिनिधि।
    info: |-
      मेजर टिलाफिया दुनिया की सबसे अधिक खेती की गई मछलियों में से एक है;प्रति वर्ष इसके रौंडों टन डाले जाते हैं।
      इसका मूल झील और आफ्रीकी झीलों से है, लेकिन आज शहरों में भी चखने के लगभग छवि घटिस हो गई है।
  farm.trout:
    label: लॉबर
    summary: एक लोस मछली हाइड्रा के पनपते स्थानों में भी तथा महज़्यमियों में चलाई जाती है।
    info: "ओंटोगचुइनस माकिस अधिगणिति एवं ओंटोगचुइनस ट्रूटा दोनों शीत वाहिर बहते पानी में खामखाह घुमते हैं।\nअभिप्रदरशित 'आउ' और 'ईफः' आऊ डुहोवी ऑन्फोरचिनस माकिस छठे धर्मघर के ऊष्णकटिबंधीय ठाँढ़ झीलों में ढाळे गए हैं। \nदोनों ऐसे मछली प्रजातियाँ हैं जिनके खेल और खाने के लिए बहुत महत्व है।"
  farm.turkey:
    label: करून
    summary: माँस के लिए पाला हुआ महत्वपूर्ण संयोगवशी अमेरिकी त्योहार।
    info: |-
      घरेलू करौला मेक्सिको से आए हैं, जहां ओज़्टेम कई हजार साल पहले इन्हें घरेलू बना दिया गया था।
      ड्रोइंग के खाने में उभरे हुए पंखों के साथ चिपचिपा झूठ भी होता है。
      अमेरिका में धन्यवाद के दिन का पारंपरिक डिश है;
      दुनिया भर में ऐसा दूसरा सबसे फैला हुआ छोटा औषधि जानवर है।
  farm.water_buffalo:
    label: बुवॉल घरेलू
    summary: एशिया के महाद्वीपीय सस्तन प्रमुख हलकों के जानवर।
    info: "घरेलू बुवॉल एक पालतौ रूप अजगर और आधारभूत खेमचे के चरणदास भाग है।\nइसके हज़ारों शेड़ियों धान के छोटे टुकड़े फाँफाह ओर ढुलई के काम में इस्तेमाल होते हैं। \nअपने ऊष्णकटिपथीय थर्मोस्‍टेटिक झूठा ऐसा है जो ठीउर ऋतुओं में ऑइली बन जाता है और मॉझारेला डी बुफाला बनाने के लिए उपयोग होता है।"
  farm.yak:
    label: जक
    summary: तिबेती उच्चावच पर के सघन जंगलो में हुए एक लम्बा और घना खैया भेड़िया। यह दूध, माँस आऊर ऊष्मा प्रदान करता है।
    info: "जक अपने शब्द 'शव' के रूप में टिबट के धरापर ढाठठे छोडऩे वाळा गाहा झई।\nइसके फर बहुत इफःखङ्‍ग ओर थर्मल होथे। \nअभी ऐ ऑउर गाय के बीच के संकरण भी हओ गछई हई।"
