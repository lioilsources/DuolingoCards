lang: hi
pivot: false
title: अर्थवृद्धि पशु
cards:
  farm.chicken:
    label: मुर्गी
    summary: अंडे देने वाला कृषि पक्षी।
    info: गैलस गैलस डोमेस्टिकस हॉसपेड मुर्गी है जो सबसे अधिक फैली हुई पक्षी प्रजाति है। यह अंडे देती है और मांस के लिए पाली जाती है; इनकी संख्या 25 बिलियन से भी अधिक है।
  farm.cow:
    label: गाय
    summary: एक बड़ा कृषि पशु जो दूध देता है।
    info: घरेलू गाय के मवेशियों को दूध और माँस के लिए पाला जाता है। वह सम्पूर्ण विश्व में खाने की आवश्यकता की एक प्रमुख आपूर्ति है; एक दूध उत्पादन गाय प्रतिदिन 20-30 लीटर दूध देती है।
  farm.donkey:
    label: गधा
    summary: चालक गधा एक स्थिरता पूर्वक चलने वाला कामगार जानवर होता है।
    info: घरेलु गधा अफ्रीकी शाबूत गधा का घरेलू रूप है, जिसका उपयोग लंबे समय तक काम करने वाले जानवर के रूप में किया जाता है। यह टिकाऊ, भरोसेमंद और भारी भार ढोने की क्षमता रखता है।
  farm.duck:
    label: कच्चा
    summary: एक जलीय पक्षी है जिसमें एक सपाट बिल होता है और किसानों द्वारा पाला जाता है।
    info: घरेलु मुरगे के अंडे और माँस के लिए पाला जाता है। उँगलियों के बीच फैली प्रभावशाली झिल्लियों के कारण घरेलु मुरगा खूब तैर सकता है और इनके आवाज भी विशिष्ट होते हैं।
  farm.goat:
    label: बकरी
    summary: चिपचिपा दूध देने वाला पंजों वाला कृषि पशु।
    info: गृहस्थ बकरी मनखे, मास और ऊन के लिए पाली जाती है। यह अपयुक्त भीतर समायोजित हो सकती है और शुष्क क्षेत्रों सहित विविध वनस्पति पर उपलब्ध रह सकती है।
  farm.horse:
    label: घोड़ा
    summary: एक शक्तिशाली कृषि पशु है जिसे सवारी और काम में उपयोग किया जाता है।
    info: देवल घोड़ा हजारों साल तक परिवहन, कृषि और युद्ध के लिए आवश्यक था। अब इसे खेल और आनंद के लिए भी पाला जाता है।
  farm.pig:
    label: सुअर
    summary: एक गृहीत पालतू जानवर होने के साथ मांस के उत्पादन के लिए प्रयोग किया जाता है।
    info: घरेलू सुअर बुद्धिमान घरेलू जानवर होता है और इसमें विभिन्न प्रकार के खाद्य पदार्थों का अपशिष्ट शामिल होता है। इसके अलावा, यह जटिल कार्यों को याद रख सकता है।
  farm.sheep:
    label: भेड़
    summary: ऊन और दूध प्रदान करने वाला बुशी होस्टड जानवर।
    info: घरेलू भेड़ में ऊन, दूध और माँस के उत्पादन के लिए पाला जाता है। यह समूहों में रहता है और इतिहास में पहले घरेलूकरण जानवरों में से एक है।
