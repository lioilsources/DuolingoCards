lang: bn
pivot: false
title: অর্থনৈতিক পশু
cards:
  farm.chicken:
    label: গোরু
    summary: প্রজননে ডিম দানকারী কৃষি পাখি।
    info: বাসা গোরু বিশ্বের সবচেয়ে জনপ্রিয় চাষের পশুদল। এটি ডিম দেয় এবং মাছের জন্য তৈরি হয়; 25 বিলিয়নেরও বেশি টুকরো আছে।
  farm.cow:
    label: গরু
    summary: দূধ দেওয়ার জন্য বড় কৃষি পশু।
    info: বাড়িতে গরুকে দুগ্ধ ও মাশ উৎপাদনের জন্য রাখা হয়। এটি সমগ্র বিশ্বে খাদ্যের অন্যতম প্রধান উৎস; একটি দোয়েল গরু প্রতিদিন 20-30 লিটার দুধ তৈরি করে।
  farm.donkey:
    label: গৃহসজ্জা ঘোড়া
    summary: নিরাপদে হাঁটতে সক্ষম একটি কার্যকর পশু।
    info: বাড়ির গৃহসজ্জা ঘোড়া শত শত বছর ধরে নিয়মিত কাজের জন্য ব্যবহৃত আফ্রিকান অ্যাফ্টাস গৃহসজ্জা ঘোড়া। এটি দৃঢ়প্রতিম ও নির্ভরযোগ্য এবং ভারী লোড বহন করতে সক্ষম।
  farm.duck:
    label: কাঁচা
    summary: প্ল্যাটফরম মূলত এনাস প্লেটিরিন্কস ডমেস্তিকাস হয়।
    info: ডমেস্টিক বাৎসল জলপক্ষী গৃহসজ্জা ও অবদানের উদ্দেশ্যে চাষ করা হয়। আঙুলগুলির মধ্যে ফিন থাকার কারণে ভালোভাবে ভাসে এবং এটি একটি বৈশিষ্ট্যপূর্ণ শব্দও করে।
  farm.goat:
    label: কোয়া
    summary: চামড়া এবং দুগ্ধের জন্য প্রসিদ্ধ সমতল চাষি পশু।
    info: পালন করা হয় দুধ, মাছ এবং শিমটির জন্য। এটি অভিযোজনশীল এবং বিভিন্ন উদ্ভিদ থাকা স্থানে জীবন ধারণ করতে পারে যেখানে শুষ্ক অঞ্চলও আছে।
  farm.horse:
    label: ঘোড়া
    summary: যাত্রা এবং কর্মের জন্য ব্যবহৃত শক্তিশালী খামারি পশু।
    info: ঘোড়া হাজার বছর ধরে পরিবহণ, কৃষি ও যুদ্ধের জন্য অপরিহরণীয় ছিল। আজ স্পোর্টস এবং আমোদ-প্রমোদের জন্যও চাষ করা হয়।
  farm.pig:
    label: প্রাসে
    summary: নরম চোয়ালযুক্ত এবং গৃহসজ্জা পশু।
    info: গৃহসজ্জা হিসেবে মানুষ দ্বারা অতি উদ্ভাবনী ও খালি করে ছোট শিক্ষণীয় কাজগুলি আয়ত্ত করতে সক্ষম এই ফ্যাট প্রাণী প্রাসে পালন করা হয়। এটি সর্বভুজ এবং ইচ্ছাকৃত ধরনের খাদ্য থেকে সব ধরনের খাবার খায়।
  farm.sheep:
    label: ভেড়া
    summary: চুল এবং দুধ প্রদানকারী চুলযুক্ত কৃষি পশু।
    info: গৃহপালিত ভেড়া বাছাই হয় চুল, দুধ এবং মাসের জন্য। এটি ঝাঁকে থাকে এবং ঐতিহাসিকভাবে গৃহপালিত প্রথম প্রাণীদের অন্যতম।
