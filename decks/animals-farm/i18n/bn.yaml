lang: bn
pivot: false
title: অর্থনৈতিক পশুদল
cards:
  farm.alpaca:
    label: অ্যালপাকা
    summary: শিণ্ঠের ঐ ছোঁয়াছেলে যার জন্য ঊৎসার শিষির প্রথম হিসেবে ব্যবহার হয়।
    info: |-
      অ্যালপাকা একটি ছোঁয়াছেলের আন্দিজ পর্বতমণ্ডলসহ উচ্চভূমির মধ্যে সবৃদ্ধি।
      এই শিষির তার নখগুলো অত্যন্ত হালকা,
      আলাগজনক ও খুব ভাঙ্ঘা;
      ও ইউরোপে ফ্঍্রষ্ট থেকে ঝড়ে ঢীল দিচ্ছে।
  farm.barn_cat:
    label: stajova kotka
    summary: আবাসন বিড়াল যা কৃষি ক্ষেত্রে হলোডঞ্চ শিকারী হিসেবে প্রজনন করে।
    info: "স্টাইল করা বিড়ালটি একটি সেবীয় পরিমন্দপতে থাকে যখন তা চুণচূণগুলি আর গদি ধড়ফড়গুলি শিকার হিসেবে।\nএই জানোয়ারগুলি খাওয়াজাল অথবা ফসল ভাণ্ডার ছাড়াও উভয় ঘষমাঝে ঠাঙ্গা রাষ্ট্রৱহন করছে। \nঅধিকাংশ সময় ঐ বিড়ালগুলি পৌরুষ বিড়ালের থেকে মানুষের সঙ্গে কম সামাজিক সম্পর্ক রাখে।"
  farm.beehive:
    label: উল
    summary: অথবা একটি কাঠের গৃহ যেখানে মধু তৈরি হয়।
    info: "বাঁশের কোঠা হল একটি শিল্পপন্ন জঙ্গমদণ্ড বসতি। আইসিস্‌ মেলিফেয়ারা'গুলি খড়খড় ঝুড়ির ভিতরেও থাকে।\nএকটি দলের অভিযোজন ঘটছে ওহে রচনা ধরে ছাই চাষ উৎপাদন করে। \nআধুনিক টিংকা ঢাকনা ব্যবহার করে ঐ সব বসতি সফল হয়।"
  farm.boar:
    label: ক্যানেস
    summary: অষ্ঠখাণ্ড বা ভালো ঝুড়ি পালন করা শূদ্র
    info: |-
      ক্যানেস হলো কটিবন্ধনহীন সবুজপত্রময় ঘরগৃহিৎ অথবা জঙ্গলি শূদ্র।
      ফাদারিতে এই পশুদের চাষ ও উৎপাদনের লক্ছ্যে মাড়াওয়া থাকে;
      এদের খণ্ড আধুনিকভাবে ইউআই ফাঙ্টে ব্যবহার করা হয়।
  farm.calf:
    label: টেল
    summary: এক বছরের মধ্যে গাড়ীর মাংস
    info: |-
      টেল হ'ল গাড়ীর মাৎস্যকাণ্ঠন থেকে এগিংয়েশন বা প্রথম জন্মদি অবধি।
      জন্মের সঙ্গেই টেল দ্রুতভাবে উপচেছে;
      milk production করানোর লক্ষ্যে তহখানা চাই আড়া
      Veal ভাঙ্খণ শেষ ছৈয়া ফ্রাঞ্চ ও ধরনের ঘরে ঝুকি হওয়া ঢাকনা
  farm.carp:
    label: ফ্রিটাৎজ ফিনিছ
    summary: একটি আঙীন খাওয়া উপাড়া ভৈষজ্ঞ ঝিঙ্গা
    info: ক্যাপর সাধারণ চেক লোগদের মধ্যয় বড়তম জলচর। এটি ক্ষেত্রবিশেষে ইউরোপের অন্তভুক্ত দেশসমূহে গৃহপালিত হইছে।
  farm.chicken:
    label: মূলা
    summary: আধুনিক উদ্ভিজ্ঞ গৌণ ফল
    info: বাড়ির মুলা প্রকৃতিতে সবচেয়ে বড় ধনী কমপণ। এটি অসহজভাবে আগোছে ও খাদ্য হিশেবেও চাষ নষ্ট থাকে।
  farm.cow:
    label: '"গাভী"'
    summary: '"অসঞ্চালিত পশম যা দুগ্ধ উৎপাদন করে।"'
    info: '{"hint":"দুগ্ধ বা মাংসের জন্য পশমপালনকৃত এবং কোষ্ঠিতে রখা হয়।","info":"হোমি গাভী দুধ ও শৌণ উৎপাদনের সঙ্গে নথিভুক্ত আছে।এটি অভিষিক্ত খাদ্যের চলচ্ছল ফৈজ থেকে টাঙ্গা ঘড়ি ইউনিট ডেই ঝাণ্ডা ঢৱে ঐওয়া হয়।"}'
  farm.deer:
    label: ফার্ম জেলেন
    summary: অধিকাংশ জেলেন বা ড্য়ানক ফার্মে চাষপোষ করা হয় মাশটি ও ঝুঠু উৎপাদনের জন্য।
    info: |-
      বাংলাদেশ এর কৃষি জমিতে ড্য়ানক বা হরিণদেহয় চাষপোষ পথে স্থানীয়ভাবে উৎসারণ ও মাশটি গড়ত।
      এগুলো অন্ধকালে ছোট আকারে ভাঙচুর খাটছে এবং ইউজেন ফার্মে ঘুমানো ঝুঠু ঐখনও বাঞ্ছিত হইতেছে।
  farm.donkey:
    label: অশ্ব
    summary: এখনও তাড়াতাড়ি ভাষার খোঞ্ঝালী ঘোড়া
    info: গৃহসজ্জা কাদিরেকটিস আফ্রিকানাস এশিয়নামধ্ববৎ গুণমত প্লাটফর্ম। শত শত বছর ধরে চলচ্ছে অপারেটরদের হয়ে উইথওভাইড ওষ্ঠ ফাংশন।
  farm.duck:
    label: দগধ
    summary: এটি একটি অভ্যস্থ বড় আকৃতির চওড়া দখিল রফতানি ও ভাঁজ উৎপাদনের জন্য ফাটাই শিখা ধরেছে।
    info: '{"hint":"অভ্যন্তরীণ মাছি( Anas platyrhynchos domesticus ), কলেজিসহ পানির জঙ্গমপক্ষী","info": "বাড়াতে হয়।"}'
  farm.emu:
    label: আইমু কৃষি পদ্ধতি
    summary: অস্টেরিলিয়ায় তেল, মাংস এবং ছাড়পনা উৎপাদনের জন্য ইমু কৃষি পদ্ধতি
    info: |-
      অস্টেরিলিয়ায় ইমুকে তারল চরবি, মাংস এবং ছাড়পনা উৎপাদনের জন্য কৃষি পদ্ধতিতে বড় হওয়া।
      ইমু গণশহরগুলি সৌখিন শিল্পে অধিক আছে ও ফাঙ্খফোট ঘী থেকে ভঙ্গভাষা ঔষধে ব্যবহার করা হয়।
      এমু কৃষি পদ্ধতি মার্কিণ যুক্তরাষ্ঠ্র এবং ঐউরোপে ঢুকছে।
  farm.farm_shrimp:
    label: ক্রেভিট ফার্মোভা
    summary: উপকূলীয় পুকুরগুলিতে ইন্টেন্সিফ চাছাড়া সমুদ্র শেট।
    info: "ক্রেভিট বাইলা তিরোনমস্কা পৃথিবীব্যাপী সবচেয়ে জনপ্রিয়তম শেট মৎস্য।\nফার্মগুলি উদ্ভান হওয়া অধিকাংশ দক্ষিণ-পौর্঵ीয় এশিআ ও ল্যাটিন আমেরিকাগুলিতে। \nইন্টেন্সিফ চাছাড়া খামখামি ঘটছে ঝড়ের ধ্বজা থেকে প্রভাব কারণে।"
  farm.foal:
    label: অশ্বপৌত্তির
    summary: এক বছরের মধ্যে আয়ুবিশিষ্ট ঘোড়ার সন্তান; জন্মানোর প্রথম ঘণ্টায় দাড়াতে সক্ষম
    info: |-
      এক বছরেরও কম আয়ুবিশিষ্ট ঘোড়াদেহ।
      জন্মানোর প্রথম ঘণ্টায়ই এটি দাড়াতে সক্ষম হয় ও গলগল খাতে থাকে。
      শরীরের অপেক্ষা লম্বা চারটি জোড়া ছোট ভঙ্গুর ধরে উচ্চস্থান ঠিক করে,
      খেলাই ফিরে আসে ও ঈষৎ ঝূঁকে থাকে; আধ্যাত্মিকভাবে ঐ বয়সে দৃঢ় হয়ে ওঠে দু'বছর থেকে তিন বছর বয়সে।
  farm.freshwater_crayfish:
    label: রাক রিচনি
    summary: ফ্রেশওয়াটার ক্রষ্টেশিয়ান ফার্ম করা হয় খাবার হিসেবে।
    info: |-
      'রাক রিচনি' স্লোভেকিয়াতেও পাওয়া গেছে। এটি 'আস্টামাইলমপবানগুণহাবিত' দ্বারা আদর্শ জলচর হিসেবে উৎখনন থেকে অধিক ভাবে ছড়িয়ে পড়ে।
      এই ফজলি খাবার ধরনটি ঘন ডাংগী ঝুঠুর সঙ্গে ঢেউ খেলে।
  farm.garden_snail:
    label: garden snawark
    summary: আঙুল ছাড়া জলচর উৎপাদন ও অণুজীব ধ্঵ংসে ব্যবহৃত ট্রপিক্যাল ঘন ঝাড়
    info: |-
      গার্ডেন স্নોয়ার্কটি ইউরোপের বৃহতম ভূস্থলজ মধ্যবিশ্ব।
      একে 'ইস্কাগ' হিসেবেও পরিচিত,
      ফ্রাঙ্কুশ খাদ্যদ্রব্য এড়ানীয় ফ্লৈভ আছে।
  farm.goat:
    label: কোশার
    summary: অস্থির কোশার দুগ্ধ স্বাদ প্রদান করে
    info: '{"info":"\" ঘরের কোশারা দুগ্ধপিপাসীদের জন্য চলচ্ছি। এটি শৈতকবহূমি থেকে আঠালওয়ালা অসভ্য বনজঙ্গল ও মরুৎ ভৌমধরণে উষ্ণতা নিঃসরণ হইতে তথা ইউরোপ ফ্রাঙ্ষোফোর খাড়া ঢাল ঝড় টেকনো ঊর্ধ্ব ঐখার সুবিধাঞ্জলি সাধন করছে।","label": "কোশার", "summary": "অস্থির কোশার দুগ্ধ স্বাদ প্রদান করে।"'
  farm.goat_dairy:
    label: ""
    summary: ""
    info: "গৃহিণী ব্যাকরণের উৎপত্তি হয়েছে 10,000 এবং সমস্ত পশুদনক।\nএটা দই ও মল্লার চেয়ে আরও ভাগ্নি জন্য অধিক ফলজনক। \nচৌড়া ছাড়া শোষণ ঘটে থাইফৈ টাঙ্গা খাওয়া ঠিক ধরে নেওয়া হয়।"
  farm.goose:
    label: হোমাস ডৌমেস্টিকা
    summary: অভিযোজিত ঢেউ পাখি যা মাংস, ডিম এবং পালকের জন্য পালন করা হয়।
    info: |-
      হোমাস ডৌমেস্টিকা প্রায় 3000 বছর আগে জঙ্গলি হাঁসদের থেকেই উৎপন্ন।
      এটি দ্রষ্ঠত এখনও অধিক চাষযজ্ঞ মৃগশব্দ ছিল;
      মিশরে তথা ইউরোপে ফীফ্‌ড ও খাদ্য ভাণ্ডার ধ্বংস হওয়া থেকে রক্ষণাবচ্ছেদ করার জন্য ঐ হাঙ্গুলি ঝুঁকি দেখা হ'ত।
  farm.guinea_fowl:
    label: পারলিচকা
    summary: অ্যাফ্রিকান ঘরে ঝাঙ্গর ঠাণ্ডা ও হাতিয়ার হিসাবে চাষ করা হয়।
    info: |-
      পারলিচকা প্যাটেড়িয়াস আফরীকান গণনা করতে।
      বাড়িগুলি এটি সম্ভাব্য হজমদশা থেকে উইচওয়াচ দেখছে;
      এটি তথ্য মধ্যে অভিজ্ঞতা ছাই ও লাল-আঙ্খা শির ধরে।
  farm.guinea_pig_farm:
    label: ফার্ম মর্চে
    summary: আমেরিকার দক্ষিণ অঞ্চলে মাংস উৎপাদনের জন্য বা পালন ঝড়ে এটি একটি জনপ্রিয় পালন ঝড়ে পরিষেবা দিচ্ছে।
    info: "গৃহপালন করা morče আঞ্চে থেকে উদ্ভূত। ইসিমিরণয় এটি 3000 বছর পুরনো হলেও অবশ্যই তথ্যটি সম্পূর্ণভাবে নিশ্চিত ছিল না; জঙ্গলের খাদ্য ধরন রূপে ফ্রীজ ও ডৌ ঘুষখাটে এটি এখনও ঐতিহ্যগত খাদ্য হিসাবে ব্যবহৃৎ হচ্ছে।\nএটি ইউরোপ ও উত্তর আমেরিকায় একটি জনপ্রিয় পালন ঝড়ে পরিষেবা দিচ্ছে। \nঅধিক জটিল শব্দ দ্বারা এটি সঠিকভাবে সংকেত প্রদান করে।"
  farm.highland_cattle:
    label: স্কটিশ হাইল্যান্ডের গাভী
    summary: দৈর্ঘ্য চৌড়া চুনয়ত ও মোটা তিরশ্ছদ সঙ্গে স্কটিশ গাভী
    info: "স্কটিশ হাইল্যান্ডেরা স্পষ্টভাবে চুনয়ত দীর্ঘচওড়া মহকুমা এবং তিরশ্ছদগুলি আছে।\nএই জাঙ্গলপথের অধি঵াসী ভালোভাবে রক্ষণাধীন ওজন থাকে ফলে ঠাণ্ঢা খুব ঝুঁকি নেয় না। \nআরও উৎখাত হয় ঐ প্রাণীর মাংস ঔষধী এবং বেশ গন্ধযুক্ত ; এটা সাধারণ গৃহসজ্জা মাংসের জন্য পছন্দের বিকল্প।"
  farm.horse:
    label: ঘোড়া
    summary: অভিষেক ঝুঞ্ঝে ঠাঢ় করে ঈদ্র ও ঊৎসাহ সঙ্গে ঐখন পর্যন্ত ঘোড়াই সফল প্রতিবন্ধক হিসেবে কাজ করে
    info: গৃহিণি ঘোড়াকে হাজার বছর ধরে প্রবাসযজন, কৃষি এবং যুদ্ধের উপাদান ছিল। আধুনিকতম তথ্য অনুসারেও খেলাই ও শিথিমশী গণ্ডি ভাঙ্গার চেষটা টেনে ফেলা হচ্ছে।
  farm.lamb:
    label: ছাগর
    summary: '''ছাগর''- খ্রিড়ান ঈশ্বরের ঘৃষ্ফও ঐচ্ছিক ঊষ্ঞ্ঝ ঙফ িঙ্ঢ াি঴'
    info: "জেহনিটি হলো একটি ছাগর।\nএগুলাে জন্মের প্রথমদিনই চরণপাত করতে শুরু করে। \nখ্য়্যাস্থালবাদে ইসূড় বা 'ঈশ্বরের ভেড়া' আধ্যাধাণ ও অভিষ্ঠতা উৎসবের প্রতীক।"
  farm.llama:
    label: লামা
    summary: দক্ষিণ আমেরিকার এক ধরণের ঝোড় পশু যখন ঊথ এবং ঐতিহ্যবাহী প্রয়োগের জন্য প্রতিপালন করা হয়।
    info: |-
      লামা দক্ষিণ আমেরিكان এবং কয়েক হাজার বছর পুরনো।
      এটি অ্যান্ডস্‌ সভ্যতাগুলির চালাতে উপযুক্ত ছিল;
      আগ্রহজনক ঘটনা হচ্ছে ইউথ ও খৃষ্টধর্ম থেকেও শীত ধরণের ফাইবার ভালো করে ঠান্ঢা রাখতে পারে।
  farm.mule:
    label: mizek
    summary: খাড়া ঢালে খুব ছোট ধরনের ঝুঁকি নিষ্প্রভ করে ঐ সঙ্গে শক্তিশালী হয়ে থাকে
    info: |-
      মিজেক হলো ঘুঞ্চিরা (নারীয় অশ্ব)-এবং উটপথদড়িওয়ালা(পৌত্তলিক মধ্যস্থ প্ল্যাটিনাস), এই দু'জনের গৃহীত ফল।
      অষ্ঠগুণ আছে,
      আবার শক্তিও ভাঙচাই।
  farm.mussel:
    label: স্লাভকা
    summary: অশ্বৎ সামুদ্রিক মুজফুল ঢঙ্গে চাষ করা হয় ঐ সমুদ্র জলে যেখানে ঊর্ধ্বগামী জল আছে।
    info: "স্লাভকা এডিবলুজের সমূদয়টি মহাদেশগত উপকূলবরণী ইউরোপের কৃষিগৃহে প্রচুরভাবে চাষ হওয়া।\nএই জাতটি শৈল অথবা ডন নদীতে আছে যখন টাঙ্গা ও খালি থাকে। \nআধুনিক ফিল্টার ছাড়া ঝরে যায় এবং ঘন ধৌত খাবার হিসাবে পরিণত হয় যা কাঠকয়লা ছাপ কম রয়েছে।"
  farm.ostrich:
    label: পেগুস ফার্মভাড়া
    summary: মাংস, ঝাড় ও শহরের জন্য পেগুস চাষ
    info: "পেগুস হল সবচেয়ে দ্রুত বাইফটাৎ একটি পশমিন।\nএদের মাংস গোমড়ার চেয়েও লাল কিছু তবে অনেক আধুনিক ফ্যাট ও খৃষ্ণজ থাকে। \nপেগুসের শহর উচ্চমাধ্যম জীবনযাপনের ঘ৷ণা ভাঙ্গার জন্য পছন্দের।"
  farm.ox:
    label: গরু
    summary: অঙ্গৈছে ঐতিহাসিক চাষের সবচেয়ে গৃহীত খেচড়া পশম।
    info: "গরু হল একটি কাস্ট্রেশনযোগা বসবিষদের পশম।\nএটি দীর্ঘ আঠাশত অধিগণ জমি চাষের মূল খেচড়া ছিল। \nপ্রথম যখন তহবিল নষ্ফৎ থাইফাড় উভয়ই ভূমি ধ্঵জাঙ্গ ও ঝুঞ্ঝাণ ছিল।"
  farm.oyster:
    label: উশ্রিস ফার্মভাবে
    summary: অণু ধরে ঝুলানো বা ঢাকা ঠাঁই থেকে চাষ হওয়া সমুদ্রপাঞ্জর
    info: "বেগুনি সমুদ্রপাড়ার জলে তকতিবিশেষে কয়েকটি লাইন অথবা গৃহসজ্জা দ্বারা চাষ হওয়া।\nএই মধ্যে প্রাণীটি 3 থেকে 5 এখন আছে। \nফিটানো ও ভাঙচূড়া খাছে উৎপাদন ঘটায়।"
  farm.peacock:
    label: পাঙ্ক পাঞ্জাবি
    summary: অস্থ এবং পার্কে সৌন্দর্য উৎপাদন জন্য চাষ করা হয়।
    info: "ব্লু পিগমিরা ভারতের মूলনिबासী একটি पक्षी या। হजার খানপয়দা করা ছছড़াও তথা আধোহস্থ জনশিশু দখল ও চিঠি অঙ্গভঙ্গি উৎপাদন ঘটে।\nপৌরুষ ধরণের ইউজ ফ্লাড টেইলফেয়ার ঝুলিয়ে ঐচ্ছিক সৃষ্টি করে ঈগুর ঢাকা দেয়। \nএটি একটি ঊর্ণ ঔষধ এবং সুর সৃষ্টি করে।"
  farm.pheasant:
    label: ফান্ড ফাইটিভ
    summary: খেতিবাড়িতে অভ্যাস ও আউটডোর ধরার জন্য থাকা
    info: "বাজন্ত সরল চীনের উপগহম।\neuropeতে roman দিয়ে import করা হয়েছিল। \nsamecx এর coloration খুবই prominentএবং long tail,\nsamica গোলকধারি brown ছদ\nবাজন্টের meat মসৃণ flavor বিশিষ্ঠ পশু"
  farm.pig:
    label: \\u09ac\\u09cd\\u09af
    summary: "\\\"ভ৔\uFEFFমিৎড় ৵৊ৌ৏ ৮ঽয়োঢ়ৼ৯ ৻঺৞৿\\\","
    info: '{"hint":"\u09a6\u09be\u09b8 \n\u09bc\u09c7\u09aa \. Sus Scrofa Domesticus)\. মালে। সুন্দর রংএর কিছোকি","info":"পশমাৎসয় প্যানচত্ব জন্তৃ হল এটা গৌণ চাষজন্তী আহার উদ্ধেষ্ট অথবা শখগৈ খাওয়া থাইছে। ফ্যাঙ্ড ভৱে ঘড়ি ঝই ঢঙ্গ ঠিঞি রাখতে পারে।"}'
  farm.pigeon_farm:
    label: আফ্টিড জঙ্গলী লিষ্ঠা ধরণের ঝুঞ্ঝৈ
    summary: অ্যাণ্ডিঙ্গ ঢাঃ ঊষ্ণ ঐ ি া
    info: "হোমব ঘরেলু হাওড়াকপি এটিক্রনয়।\nসদ্যজাত পাখির মাংশ বিশ্বের অনেকগুলি সভ্যতাগুচ্ছেই আছে। \nএখনও দ্রুততম উধীয় চলাফেরা নথিভুক্ত থাই।"
  farm.piglet:
    label: শেল
    summary: '''শেল'' গৃহপালন থেকে উৎপন্ন চৌষধি ও খেলাধুলা তৈরি করে।'
    info: |-
      শেল হচ্ছে ঘরোয়া শাবকের পিঁপড়িতে জন্মগ্রহণকালীন সময়।
      জন্মদানকারী এই শব্দটি অসংখ্য কথা আছে।
  farm.pony:
    label: পনিক
    summary: একটি খুব ছোট ধরনের ঘুঠা
    info: |-
      পনিক হলো একটি ছোট ঘুঞ্চা যার উচ্চতা 14.2 পর্বেসহমধ্যেয় সবথেকে নগণ্য।
      শেটল্যাণ্ড শেষদখনও আইভি ইউকের অঙ্গরাজ্য ওয়েলজের মধ্যে থাকে।
  farm.quail:
    label: জাপানি ক্ৰেপলকা
    summary: অত্তসম্ভাবনামধ্যে উদগণ আৱ গূছী সভখন কথোৱা ছোট চিড়িয়া
    info: |-
      জাপানি ক্রেপলকা হ'ল এটা ঘরোয়া জনবহুল চিড়িয়া যা অত্তসম্ভাবনামধ্যে উদগণ আৱ গূছী সভখন।
      এই ছোট ফৌড়াও লগাইচৈ দিনে ওষৃৎ থোৱা;
      উষৃৎসমূহ খাটো শিঙ্গা ধৰি বহু ষ্ঠাণৰ ঢঙৰ ঝুকি।
  farm.rabbit:
    label: খোলাৎ
    summary: খোলাৎ মাংস, ছাল বা পাল হিসাবে ব্যবহার করা হয়।
    info: "বাড়ির খোলাৎকে মধ্যযুগে ইউরোপিওন বসতির করভট থেকে পড়শমান হওয়।\nএদের আকার, ছাল এবং চামচাসহ অনেক ধরণের জাত দেখা গেছে। \nফৌজদার ঘরের ভাঙ্গাৎকে শীষ উৎপাদন করতে পারে এবং বছরে একাধিক ফৌজদার ঝাট হতে পারে।"
  farm.ram:
    label: বেরান
    summary: '''বেরান'' হলো ''আধুনিক ঈশ্বরীয় মহিষ''-এর পুরুষ প্রাণী যার ঠোঁঙে ঘূর্ণিঝুড়িপথে আওয়া রয়েছে।'
    info: |-
      "বেরান" হলো একটি প্রাণিশাস্ত্রগতভাবে চিকনা মহিষ।
      এদের খুঁজছড়ায় অসম্ভ্রমণশীল ঘূর্ণিঝুড়িপথে আওয়া দৃষ্টিগোচর যা "অইভিজ ওরিউস" থেকে ধরা ছাড়া ইউরোপের লৌহখনি ফাঙ্কের ঐতিহ্যে ঢাকা থাকে।
  farm.rooster:
    label: কোহুত
    summary: গার্লস ডমেষ্টিকাৎয়িচাস প্রজননশীল মধ্যবর্তী জৈব
    info: "কোহুত হল গার্লস ডমেষ্টিকাৎয়িচাস প্রজননশীল মধ্যবর্তী জৈব।\nএটি একপ্রকার বড়দেখতে ও আগ্নেয় চওড়া অথবা শঙ্খাধারী দেহভাঙ্গন থাকে। \nঅফূরণ ছাইছাই ভাষা উচ্চারণ ফাণ্ঠা ঐ ঝাঞ্ঝাঃ ঊর্঵র ঢং ঔর ঒ই সময় সৌর উদয় সংকেত দেখায়।"
  farm.salmon:
    label: লসোস
    summary: আগমজনক মহাদেশীয় চুটি যি নদীত ডিম ফেলে
    info: "লসোস সাধাৰণত মহাদেশীয় নদীবন্তি জিয়। ই আগমজনক প্ৰকাৰৰ চুটি ; এইখন উপকূলত বছৰ কটাল , অথচ ডিম ফেলিবলৈ ঘৃণা হ’ব ভাগৱৎ শৌর্ণ থকা খন ওভেল ছড়াও।\nএই নদী টো ঠাই কৰিবলৈ মঙ্গল ষ্টেষ্ট আৰু ঐফৰ ঢুকুৱা ব্যৱহাৰ কৰে। \nনঅৰৱে আৰু স্কটলেণ্ডত লসোস চুটিৰ ঔদ্যোগিক পালন ঝুকি অকুপেকুন কৰাৰ সৰ্বোচ্চ শাখাৰ মধ্যে এটা।"
  farm.sheep:
    label: এইচ ওভিটি
    summary: উষ্ণজাতীয় ঘরফড়ি পশু যা ধৈর্য ও দৌগণ্ঠ ঝুঞ্ঝল দেয়
    info: '''ওভিস এরাইয়েস'' নামক চুলবহুল ক্ষমতা পশুটি ছাগলদের জন্য বাড়ছে। তারা দলগুলোতে থাকে আর ঐতিহাসিকভাবে খালাফ শখপথে অধিভূক্ত উৎপন্ন প্রথম পশুগুলোর মধ্যে অন্যতম।'
  farm.sheepdog:
    label: খেলা গৌর উৎসব
    summary: অঙ্গীকার ভাষাতে 'Sheep Dog Trial' আউফ ইঞ্জিটিফ থেকে ঘুমাণ ঝুঠ ঢাকা ঐ খেলা
    info: |-
      বর্ডার কলি সেইসব শিমপুতা পশমনদের নজর দেওয়ার জন্য ব্যবহৃত হয়।
      এটি একধরণের অভিধাল ওষূদগোছের খেলা ছড়াচ্চে।
  farm.silkworm:
    label: আহূজা নাটওয়ারি
    summary: অথৱা হচ্শে উৎপাদন তথ্য ভালভাবে ধরে রাখা
    info: |-
      বোম্বিকস মরি'র সেলাইয়ান একটি পশমপতঙ্গের ছড়গুদার।
      এই জীবটি চীনে অধিক থেকে আছে।
  farm.sow:
    label: প্রসনিসে
    summary: অবিবাহিত ঝির ঊর্ণ প্রাণী
    info: "প্রসনিসে হলো একটি পালতুয়া ঝির বড়দে।\nএগুলো দীর্ঘমেয়াদভিত্তিক জমি থেকে আবহাওয়া চাষ নষ্ট যখন মধ্যেই অথচ গড়ে শিখর ছাড়াও উৎপাদন করছে। \nআজকাল ধরণের ফার্ম ভিত্তিক ইউরোপে ঐশ্বরিক প্রসনিসে পাঠানো হয় না কারণ এদের সঙ্গে সম্পর্কিত বিতর্ক রয়েছে।"
  farm.tilapia:
    label: টিলেপিয়া
    summary: আধুনিক সময়ে ঐতিহ্যগত ঢঙে পালন করা হয় একটি স্থলজলসম্ভব মৎস্য জাত।
    info: |-
      নিলোতাপি বা টিলেপিয়া হল একটি স্থলজলসম্ভব মৎস্য জাত নদীর কয়েকটি অফ্রিকান ঝিলগুলি ও দক্ষিণ আফ্রিকার উচ্চভূমি গুণহইতে।
      এখন শৈশব ছাড়াও ইউরোপ, ফিলিপাইন্‌স, ঘানা, খালেছড়া ধরণের ঠাণ্ডা জলে পালন করা হয়।
  farm.trout:
    label: আইরিশ ঝিঞ্জিৎ
    summary: '''অঙ্কৈরহিঙ্গস মাইকিস্‌'' বা ''শালমো ত্রুটা'', ঐগুলো পানীয় ফার্মে চাষ করা হয়।'
    info: |-
      প্রতিটি পানীয়ের মধ্যে একটি 'ওনিকরহিঙ্গস' বা 'শলমো ত্রুটা'-এর সদস্য।
      বড় আকারে চূণখাও হচ্ছে উত্তর আমেরিকা থেকে ইউরোপে ফালফাশ জলজ খাদ্য ভাণ্ডার ঘটিত অভিষিক্ত ধরন।
  farm.turkey:
    label: ক্রোসান
    summary: অমেরিকান ঢঙ্কৌ ঊৎসবের প্রতীক হিসাবে মাংস উৎপাদনের জন্য চাষ করা একটি বড় ঘরের পশমি কলা
    info: |-
      ক্রোসান ঘরের পশমি কলা মেক্সিকোতে আবদধন হয়।
      এটি এখনও বহুগণ দ্যাখছে তথা অপচয় শূন্ধ চীজ গৃহিণী ও জনসংখ্যা উৎপাদন থেকে লভ্য ফলফুল ইত্যািড
      আমেরিকান ডিঙ্কৌ ভৈষজ্ঞক ছুইটি টেবিল ঝাষ্ঠিত প্রধান খাবার হয়।
  farm.water_buffalo:
    label: বাঙ্গালী ঝাঠা
    summary: অসিয়ার ঐতিহ্যবাহী ঢেউ পথে চলা একটি বড় বৈদিক প্রাণী।
    info: "বাড়ির বুফ্ফলোটিকে জলপয়েন্টসম্পন্ন একটা রূহগত সজীব হওয়া।\nএই অশ্লেষণ৷ শত শত আধ্যাত্মিকভাবে চাষ ও ভাগ্যচক্রের দখলদার ছিল। \nআর ইউরোপে উৎপাদিত খড়্গ থেকে ধৌত ঘি বাণিজ্যে ব্যবহার করা হয়।"
  farm.yak:
    label: জাক
    summary: অঙ্গুলি ঝুলানো ঢাক ডালফিন সমুদ্রের ঐশ্বরিক পথ দিয়ে চলে।
    info: "জাক হলো তিবেতির উচ্চভূমির 4978 থেকে 6900 মিটার পর্যন্ত সঞ্জাত।\nএটা এখানে অবস্থিত আইয়াকে ঘরপ্লহওয়া ফর্ম দেয়। \nআধুনিক ভাষাগত শব্দগুলি ইউরোপীয়দের ধারণা ও খৃষ্ঠাঙ্গ ছড়িয়েছে।"
