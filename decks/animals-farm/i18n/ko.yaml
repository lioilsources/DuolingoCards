lang: ko
pivot: false
title: 가축
cards:
  farm.alpaca:
    label: 알파카
    summary: 고기능성 양모를 생산하기 위해 사육하는 소형 남미 낙타류 동물.
    info: |-
      알파카는 안데스 고산지대에서 키우는 라마의 작은 친척입니다.
      그들의 모발은 세계적으로 가장 부드러운 천연 섬유 중 하나로 알려져 있으며 따뜻하고 알레르기가 거의 없으며 캐시mere보다도 더 매끄럽습니다.
      huaсау아( куд리 있는 유전자 )와 Surі( 실크 같은 외관을 가진 것 ) 두 가지 종이 있습니다.
      alpacas의 기른 것은 이제 유럽으로까지 급속히 확장되고 있다.
  farm.barn_cat:
    label: stajni 고양이
    summary: 농장에서 생쥐를 잡는 목적으로 키우는 가정용 고양이입니다.
    info: 스테이지오바 코치카(Staňova Kočka)란 농업 환경에 사니며 설치류인 생쥐와 여우 등을 포식하는 집고양이다. 과일과 곳감을 포함한 저장 식량은 물론 곡물을 생쥐로부터 보호한다. 방향성 있는 사회화가 필요 없는 반면, 일반적인 애완묘보다 사람에게 덜 친근하다. 역사상 이집트에서는 이러한 능력으로 인해 고양이는 존중받았으며 숭배의 대상이 되기도 하였다.
  farm.beehive:
    label: 벌집
    summary: 인공적인 사육 환경으로서의 꿀나방 벌 집.
    info: |-
      꿀벌 군락을 위한 인조 거주지로 나무 속에 서식하는 야생 벙어리를 대체합니다.
      하나의 군락에는 보통 5만에서 8만 마리 정도가 있습니다.
      각 군락은 연간 평균적으로 최소한 2~3kg 이상의 양질의 고품질 꽃nectar를 생산해냅니다.
      이러한 벚들은 중요한 수분자이며 세계 식량 중 삶과 밥 한 끓 만큼이나 많은 부분이 이들의 활동에 의존하고 있습니다.
  farm.boar:
    label: 가nqu
    summary: 야생 또는 가축화된 돼지의 수컷.
    info: |-
      가는 비절단 상태인 암퇘지를 말한다.
      농장에서는 번식을 위해 가를 기르며 그들의 정액은 인공수정에 사용된다.
      야생하는 가는 강한 송곳니와 공격적인 방어 능력을 갖추고 있다.
      요리 분야에서 갈 고기는 소중하게 여겨지는 사냥감으로 평가받는다.
  farm.calf:
    label: 텔
    summary: 한 살 이하의 소 어린이.
    info: тел은 출생부터 떼우기나 약 일년까지 생긴 가축 새끼입니다. 타는 곧바로 서서 걷게 되며 엄마 본능도 강합니다. 우유 생산을 위해 키운 씨소들은 조기에 모체와 분리됩니다. 텔(veau) 고기는 유럽 여러 요리에서 극찬받는 특별 음식으로 여겨집니다.
  farm.carp:
    label: 카프리
    summary: 큰 담수 어류로 청소년 크기의 전통적인 연말 음식이다.
    info: 체코에서 품종으로 사육되는 가장 큰 물고기는 치즈와 밀접하게 연결되어 있으며 특히 트레보니스크 농장과 관련이 있다. 중세 유럽에서는 주요한 가축화된 생물이며 포용적 식성에 속하며 신속히 자라며 무게는 최대 약 30kg까지 된다.
  farm.chicken:
    label: 닭
    summary: 알을 낳는 농업용 조류입니다.
    info: 가정 닭은 전 세계에서 가장 흔한 가금류 종으로, 알과 고기를 위해 사육되며, 현재 250억 마리 이상이 존재합니다.
  farm.cow:
    label: 소
    summary: 우유를 생산하는 농업용 가축입니다.
    info: 가정에서 소는 우유와 고기 생산을 위해 기르는 중요한 동물입니다. 전 세계적으로 주요 음식 자원으로서, 젖소 한 마리는 하루에 약 20~30리터의 우유를 생산합니다.
  farm.deer:
    label: 농장 사슴
    summary: 가축화된 농장 사슴 또는 낙타는 고기와 모피 생산을 위해 기르인다.
    info: |-
      체코에서는 야생 동물의 육류를 얻고자 하수리사슴이나 산양이 목초지나 농장을 중심으로 길러진다.
      하수리사슴은 일반적인 산양보다 작으며 특징적으로 넓게 펴져 있는뿔을 가지고 있다.
      산양들은 매년 자신의 뿔들을 벗어내며 다시 자라난다.
      농장에서 재배한 이 종들의 고기는 소고기를 대신하는 건강하고 좋은 선택이다.
  farm.donkey:
    label: 당나귀
    summary: 믿을 수 있는 걸음걸이로 유명한 귀여운 일하는 동물입니다.
    info: 가정용 당나귀는 아프리카 야생 당나귀(Equus africanus asinus)에서 도입된 가축으로, 수세기 동안 작업동물로 사용되어 왔습니다. 매우 튼튼하고 믿을 것이며 무거운 짐을 운반할 수 있습니다.
  farm.duck:
    label: 오리
    summary: 날다람쥐처럼 날 수 있는 편평한 부리를 가진 물새로 농장에서 기릅니다.
    info: 집 오리는 고기와 계란 생산을 위해 사육되는 조류입니다. 손가락 사이의 수영막 덕분에 잘 수영할 수 있으며 특징적인 꽥叫声도 내냅니다.
  farm.emu:
    label: 鸸鹋 농장
    summary: 오일리스 호주에서 기름과 고기 그리고 가죽을 위해 사육되는 엠유.
    info: "호주는 에뮤를 오일 생산(화장품에 사용됨), 육류 및 천연가죽 제조용으로 대규모로 재배하고 있습니다. \n에무의 지방 유래 오일은 항염증 효과가 있어 전통 의학뿐 아니라 현대 치료에도 활용됩니다. \n이러한 에му 축산 방식은 미국과 유럽 지역까지 확장되고 있으며,\n에뮬리는 사람에게 무서워하지 않고 접근하는 성향도 가지고 있는 흥미롭고的好奇心 강한 동물입니다."
  farm.farm_shrimp:
    label: 농장 멍게
    summary: 해안 저수지에서 집중적으로 사육되는 해양성 게다.
    info: |-
      타их우스 백색 리포네아(Litopenaeus vannamei)는 전 세계적으로 가장 많이 기르이는 종이다.
      주로 동남 아시아와 라틴 아메리카에 이들이 있는 것으로 알려져 있다.
      집약적인 양식은 적조류림의 영향으로 인한 논란이 일고 있으며,
      멍게는 금枪어 다음으로 좋아하는 바닷물 수산품 중 두 번째로 선호된다.
  farm.foal:
    label: 말 어린이
    summary: 한 살 미만의 말 새끼로 태어난 후 몇 시간 안에 서서 걷기 시작한다.
    info: |-
      말 어린이는 한살 이하인 말아이다.
      태어난 직후 수시간 내 다리를 세우고 젖을 빨며 활동하게 된다.
      몸집보다 눈부시게 긴다리를 지니지만 나이가 들수록 짧아진다.
      말 어린들은 장난꾸러기이며 호기심 많으며 두세 살 되어야 훌륭히 기르는 교육 과정(breaking)이 본격적으로 이루어 진다.
  farm.freshwater_crayfish:
    label: 강 게
    summary: 먹거리로 사육되는 담수 갑각류.
    info: 체코에서는 강게가 흔했지만 래기병과 수질 오염으로 거의 멸종되었다. 지금은 특별한 억양장에서 재배되고 있다. 깨끗한 물의 지표 종이며, 청결한 계곡에만 서식한다. 19세기에 체코산 게는 프랑스와 독일로 대량 내보내져 큰 비즈니스였다.
  farm.garden_snail:
    label: 정원 달팽이
    summary: 프랑스 요리에서 에스크아로트(escargot)라고 해서 먹는 큰 육상 무척추동물이다.
    info: 정원 달팽이는 유럽 최대의 육지 거북이며 귀한 프랑스 특선 음식인 '에سك아로트'라는 이름으로 알려져 있다. 겨울에는 피부를 보호하기 위해 껍데기를 막고 숙면 상태(hibernation)가 된다. 이 동물을 사육하는 활동은 헤르시쿨처라 불리는 것이며 주요 생산지는 프랑스와 이탈리아 등 다른 국가들에서도 이루어진다.
  farm.goat:
    label: 염소
    summary: 뿔이 나 있는 유제품을 생산하는 농장 동물입니다.
    info: 가정에서 키우는 염소는 우유, 고기 및ขน을 위해 사육됩니다. 이들은 다양한 식물을 먹고 건조한 지역에서도 잘 살아남을 수 있습니다.
  farm.goat_dairy:
    label: 젖소 염소
    summary: 치즈와 요거트를 만드는 데 사용되는 우유 생산을 위해 기르는 염소입니다.
    info: "가정용 소형 목장에서 짜내지는 젖염소(Capra aegagrus hircus)로 수천 년 전부터 약 1만년 이상 가축화되었습니다. \n염소의 유제품은 영양분이 풍부하며 소비하기 쉬워서 특히 사람들의 대사에 적합합니다. 이들은 일반적으로 낙타나 다른 동물들보다 더 많은 양으로 만들어집니다.\nChèvre, 피타(Petta), 홀루미(Halloumi) 등 세계적인 치즈들이 모두 코자의 우유로부터 제조됩니다.\n또한 강력하고 다양한 지리적 조건에서도 잘 살아남으며 산악 지역과 같은 돌밭에도 먹고 자랄 수 있습니다."
  farm.goose:
    label: 가금류
    summary: 고기와 알 그리고 깃털을 얻기 위해 길러지는 가축용 오리.
    info: |-
      집오리는 약 3천 년 전에 와일드한 종에서 유래되었습니다.
      이들은 가장 먼저 인간에게 훈련받은 동물 중 하나이며,
      로마의 카피톨 황궁에서는 집오리를 경비견처럼 사용했습니다.
      그들의 고기는 물론이고 갯살(포아 그라스)과 솜깃털도 소중하게 여겨졌으며,
      옛날에는 오리 깔끔으로 제작된 붓펜까지 만들어 썼습니다.
  farm.guinea_fowl:
    label: 퍼리치카
    summary: 뱀과 포식자로부터 경계하기 위해 사육되며 고기로도 소비되는 아프리카의 새입니다.
    info: 퍼리치카는 야생으로 서반구에서 발견됩니다. 농장에서는 자연적인 감시견처럼 평가받으며 그녀 특유의 시끄러운 울음소리는 코브라나 낯선 사람을 포함한 위험에 대처합니다. 흰색 점이 있는 회갈색 깃털과 붉은-파란 먹각 없는 머리를 지니고 있으며, 육류 맛은 조류와 비슷하다.
  farm.guinea_pig_farm:
    label: 가축 토끼
    summary: 라틴아메리카에서 고기로 사육되거나 애완동물로서 기른 가축 토끼입니다.
    info: |-
      집토끼는 안데스 산맥 지역 출신으로 인카인들이 이미 3천 년 전에 육류 공급원으로 길렀습니다.
      지금도 페루와 에콰도르 그리고 콜롬비아에서는 '쿠이'라는 이름의 전통 음식으로 여전히 소중하게 먹고 있습니다.
      유럽과 북미에는 어린이나 아이들의 사랑을 받은 반려 동물로 널리 알려져 있으며,
      복잡한 울음소리를 포함해 신음을 내며 의사소통합니다.
  farm.highland_cattle:
    label: 스코티시 하이랜드 소
    summary: 붉은색 긴 털과 거대한 뿔을 가진 스코틀랜드의 소.
    info: |-
      스코트 고원 지역에서 건조하고 혹독한 환경에 적응하도록 사육된 오래된 종입니다.
      특징적인 붉은 장모는 습기와 추위로부터 보호해줍니다.
      다른 품종보다 내성이 강하며 병균에도 덜 취약합니다.
      고기는 부드럽고 매우 진미로 알려져 있으며 일반 쇠고기를 대체하는 인기가 있는 선택지 중 하나입니다.
  farm.horse:
    label: 말
    summary: 타고 다니거나 일에 사용되는 강한 가축입니다.
    info: 가정에서 수천 년 동안 이동, 농업 및 전투에 필수적인 존재였습니다. 오늘날에는 스포츠와 여가 활동에도 사육됩니다.
  farm.lamb:
    label: 양 어린이
    summary: 한 살 이하의 젖소 새끼로 봄과 순수성의 상징이다.
    info: |-
      양은 태어난 후 첫 해까지를 지칭한다.
      털을 가진 채서 세상에 나와 생애 초반부터 풀을 먹기 시작한다.
      크리스천 문화에서는 양이 무죄함과 신적인 존재인 그리스도(예수님)를 의미하기도 한다.
  farm.llama:
    label: 라마
    summary: 남아메리카의 난장이 켈레드로 털과 운반을 위해 사육되는 포유류입니다.
    info: |-
      람라는 인카족에 의해 이미 5천 년 전부터 남미에서 약간 크기만 한 동물로서 긴 역사가 있습니다.
      안데스 지역에서는 주요한 짐승으로 사용되며 최대 체중의 30%까지도 지닐 수 있는 능력을 가지고 있습니다.
      램라 먹은ขน은 열보존 특성 때문에 높게 평가받습니다.
      위협이나 불편함 시에는 유명하게 침을 튀깁니다.
  farm.mule:
    label: 메즈크
    summary: 말과 나귀의 임신하지 않는 교배종으로 뛰어난 인내력과 힘을 지님.
    info: |-
      메즈크는 말(암컷)과 낙타(수컷) 사이에서 태어나며 반대로 생긴 것은 '뮬라'라고 부른다.
      불임이지만 매우 강하고 튼튼하며 오래 견딜 수 있다.
      지형에 대한 방향 감각도 좋고 말보다 더 신중하게 행동한다;
      공황 상태가 덜하다.
      천 년 이상 산악 지역 물류 운송에는 없어서 안 되던 존재였다.
  farm.mussel:
    label: 슬라브카
    summary: 해수의 만조에서 줄에 기르는 먹을 수 있는 양식 조개류입니다.
    info: 스لاف카 제다는 유럽 대서양 해안가를 따라 농장에서 많이 사육되는 굴 종류이다. 이들은 로프나 케이블 위에서 흐름과 갯벌 사이 주변 환경 속에서 자란다. 물질 여과장치 역할을 하며 탄소 발자국도 작아 생태적으로 친환경적인 음식이다. 벨기에의 '모울레 프리트' 같은 전통 요리를 비롯한 다양한 지역 특별요리에도 포함된다.
  farm.ostrich:
    label: 육용 및 가죽·깃털 생산을 위한 학
    summary: 고기와 깃털 그리고 가죽 생산에 이용되는 학입니다.
    info: |-
      학은 가장 빠른 이족보행 동물이며, 고기를 비롯해 그의 피부인 가죽과 깨끗한 까다리를 얻으려는 목적으로 농장에서 기릅니다.
      학 살코기는 소고기에 유사하지만 지방함량이 낮으며 콜레스테롤도 적습니다.
      학가죽은 고품질 제화 산업에서 귀하게 여겨집니다.
      전통적으로 학 깔따구들은 모자 장식이나 팬티클 등 다양한 용도로 사용되었습니다.
  farm.ox:
    label: 황소
    summary: 절단된 수우로 역사적으로 농업에서 가장 중요한 인력 동물이었다.
    info: |-
      황 소는 일하기 위해 길러진 가축인 Bos Taurus의 절단된 암컷이다.
      수천 년간 세계 대부분 지역에서는 황소가 주요한 견마 역할을 했다.
      힘센 성격과 온순함 덕분에 초기 농업 시대에는 말보다 더 많은 밭을 갉아먹혔다.
      현대 농업에서는 트랙터들이 대체했지만 개발도상국들에서는 여전히 사용되고 있다.
  farm.oyster:
    label: 양식 조개
    summary: 해안 수역에서 줄이나 케이지에 기르는 해산물입니다.
    info: 조개류인 양식 조개는 해변 근처의 물속에서 끈 또는 철망 위로 키우며 성체가 되기까지 약 3~5년 정도 걸립니다. 이 생물을 통해 주변 바닷물은 여과되어 해양생태계를 정화하는 역할을 합니다. 신선하게 혹은 삶아서 요리하여 즐길수 있는 고급 음식이며, 진주 생산에도 사용됩니다.
  farm.peacock:
    label: 가정용 핀 머리 매
    summary: 농장과 공원에서 장식으로 기른 수컷 푸르름매.
    info: "푸르름매는 인도 원산지이며 천 년 전부터 아름다움을 위해 긴급화되었습니다. \n수컷은 암컷의 유혹을 위해서 꾸미고 있는 더 than 150개 깃털로 놀라운 부채 모양 형태를 만듭니다. \n그들의 욕창음은 매우 시끄럽고 강렬합니다. \n인도에서는 이 새가 국가 조류이자 미와 관련된 상징입니다."
  farm.pheasant:
    label: 농장용 볏닭
    summary: 사육되어 사냥을 위해 방출되는 농장 닭.
    info: 일반적인 바조ант는 체코에서 가축으로 기르며 정기적으로 야생에 풀어줍니다. 이 종은 아시아 원산이며 로마 시대에 유럽까지 수입되었습니다. 수컷의 색상이 두드러지고 꽤 길쭉한 깃털을 가지고 있으며 암탉은 주로 갈색 계열입니다. 바조안트 고기는 맛있고 극찬받는 조류로서 소비됩니다.
  farm.pig:
    label: 돼지
    summary: 관절연골이 있는 입 주위를 가진 분홍색 농장 동물입니다.
    info: 가정 돼지는 고기 생산을 위해 사육되는 지능 있는 농업용 동물이다. 잡식성이며 복잡한 작업을 기억할 수 있다.
  farm.pigeon_farm:
    label: 가정용 비둘기
    summary: 고기를 위한 스쿼브나 경주비행을 위해 길러지는 가축화된 비둘기.
    info: 가는 야생 돌비를 기반으로 수많은 품종이 개량되었다. 많은 문화에서 어린 비둘기 고깃감인 '스쿼브'는 귀한 특식이다. 렉서드(경마처럼 난쟁이들을 속도로 겨루는 것)에 사용되는 종들은 매우 빠른 속력을 자랑하며 최대 시속 150km 이상의 비행 능력까지 보여준다.
  farm.piglet:
    label: 세레
    summary: 돼지 새끼로 보통 분홍색이고 장난기 넘치다.
    info: |-
      새는 가정 돼지의 어린이로서 생후 몇 주 동안을 말한다.
      태어나서 얼마 지나지 않아 작지만 빠르게 자란다.
      암퇘지는 평균적으로 한 번에 약 10~12마리의 세리를 낳는다.
      연구 결과들에 따르면 세리는 똑똑하며 개만큼 영민하다.
  farm.pony:
    label: 포니
    summary: 아이들이 타기 좋은 작은 품종의 말입니다.
    info: |-
      포니는 어깨 높이가 최대 약 56인치(약 147cm)에 불과한 소형 마육 종말이다.
      셰틀랜드 포니는 가장 작으며 스코트ランド 셰틀랜드 제도에서 유래했다.
      강하고 혹독한 환경에도 잘 견디며 아이들을 위한 조련용으로 인기가 있으며 광산에서도 사용된다.
  farm.quail:
    label: 일본골鹧
    summary: 알과 고기 생산을 위해 사육하는 소형 가금류입니다.
    info: 일본골鹧는 알과 육계로 집중적으로 기르는 골鹧의 한 종류이다. 암컷은 거의 매일 납란하며, 이들의 계란은 다양한 요리에서 귀한 재료이다. 빠른 성숙 속도를 지니며 생후 여섯 주만에 산란이 시작된다. 일본에서는 이러한 조류들을 노래새처럼 키우기도 하여 그 관행은 오랜 전통으로 남아 있다.
  farm.rabbit:
    label: 토끼
    summary: 고기나 털을 얻거나 애완용으로 기르는 가축화된 동물.
    info: |-
      집토끼(Oryctolagus cuniculus)는 중세 시대 유럽의 들쥐에서 사육되어 오늘날 우리가 아는 형태로 진화하였다.
      이 종은 크기와 색상 및 모발 타입에 따라 인정받는 최소한 50개 이상의 다양한 견종들을 포함한다.
      암컷(황녀)은 한 번의 출산당 새끼를 4~12마리 낳으며 연간 여러 차례 자손을 남길 수 있다.
      유럽에서는 개와 고양잇과 함께 집안 반려동물을 뽑아보면 세번째 인기를 누리는 것이 바로 이 집토끼이다.
  farm.ram:
    label: 버란
    summary: 가축 양의 성체 수컷으로서 두드러진 나선형 뿔을 가지고 있다.
    info: 버란은 가축인 성년 남성 억양(양)이다. 암수는 작은 것 또는 아예 없는 반면에 버란은 눈부신 나선통 모양의 큰 뿔이 특징적이다. 특히 겨울철에는 다른 개체들과 머리로 부딪치며 경쟁한다. 상징과 신화에서는 버란은 힘, 생식력 및 지도력을 연상시키는 존재와 연결된다.
  farm.rooster:
    label: 암탉
    summary: 가정 독수리의 수컷으로 아침을 알리는 울음소리를 낼 때 알려줍니다.
    info: 암탉은 가정 닭(학명 Gallus gallus domesticus)의 성숙한 남성 개체로 풍부하고 화려하게 보이는 깃털과 뿌리 그리고 붉게 반짝거리는 먹새를 특징적으로 나타냅니다. 앵앵거리기는 영역 표시 행동이며 오직 새벽뿐만 아니라 언제든지 발생할 수 있습니다. 체코에서는 이 동물이 경계심의 상징이고 중국 점술에서 열두 마디 징후 중 하나입니다. 고대 그리스인들은 신 Askлепios에게 제물을 바치며 새로운 태양 솟음을 의미하는 것으로 여겼습니다.
  farm.salmon:
    label: 연어
    summary: 강으로 회遊하는 대형 해양 어류로 양식장에서 많이 기르는 생선입니다.
    info: 태평양 연어(Pacific salmon)와 같은 강회유성 물고기인 연어(Salmonidae 과)는 바다에서 자라나서 산란을 위해 본래의 강으로 돌아옵니다. 이들은 자기 고장을 찾아가는 능력을 지구자석과 냄새를 통해 정확하게 항해합니다. 노르웨이 및 스코틀랜드에서는 연어 양식업이 수산농업 분야 중 가장 큰 규모를 차지하고 있습니다. 또한, 건강에 좋은 오메가-3 불포화지방산 함량도 풍부한 음식이다.
  farm.sheep:
    label: 양
    summary: 모와 젖을 주는 털 많은 가축입니다.
    info: 가정 양은 모, 우유 및 고기를 위해 길러집니다. 무리를 지어 살아 있으며 역사상 최초로 야생에서 온 동물 중 하나입니다.
  farm.sheepdog:
    label: 양 목장 개
    summary: 사냥과 보호를 위해 특별히 훈련된 양 떼 관리용 강아지입니다.
    info: 보더 콜리는 시선(눈으로 주의 깊게 바라봄) 및 조용한 지시로 가축을 유도하는 가장 인기 있는 종목 중 하나이며, 최고 수준의 영민함이 알려진 견종에 속합니다. 작업 능력은 선천적으로 전달되며 어린 나이부터 체계적인 교육 과정에서 발전되어야 합니다. '오브치 앤 점프' 경기는 특히 대영 제국 내에서 넓게 사랑받는 스포츠 활동입니다.
  farm.silkworm:
    label: 모루슈 보우레시
    summary: 자연 실크를 생산하는 모루슈 보우레의 유충입니다.
    info: 보우레는 중국에서 이미 5천 년 전부터 사육된 실방곤 나무에 기생하며 자라는 벼룩으로 알려져 있습니다. 이 곤충은 약 900미터 길이의 단일 섬유로 이루어진 코코론을 만드는데, 이것이 자연적인 실타래가 됩니다. 그 가치 때문에 수세기 동안 중국에서는 이를 제조 비법처럼 엄격히 지켜왔습니다. 또한 '실크 로드'라고 불리는 고대 교역길도 이러한 물질과 관련되어 이름 붙여졌습니다.
  farm.sow:
    label: 돼지 엄마
    summary: 성체 암퇘지는 어린 돼지를 낳는 모친입니다.
    info: |-
      암퇘지는 집에서 키우는 성인 암컷으로 한 해 두 번 새끼를 가질 수 있으며 평균적으로 자식은 10~14 마리에 달합니다.
      현대 농업에서는 넓이가 제한된 공간 안에서의 강도 있는 사육 방식을 채택하고 있어 논란이 되고 있습니다.
      또한 암퇘지는 지능적이며 자연 상태라면 보통 12주 ~ 16주의 기간 동안 자신의 아기를 돌보게 됩니다.
  farm.tilapia:
    label: 틸라피아
    summary: 열대 지방 전 세계에서 대량으로 사육되는 담수 어류입니다.
    info: 니罗 틸라피아는 현재까지 가장 널리 재배된 수산물 중 하나로 매년 백만톤 단위의 생산이 이루어지고 있습니다. 원래은 나이루 강과 아프리카 호수에 서식했지만 지금은 모든 주요 지역에서 기르고 있으며 빠른 성장 속도와 저영양 요구 조건을 가진 종 입니다. 이 물고기는 연어 다음으로 많이 기르이는 두 번째 순서를 차지하고 있죠.
  farm.trout:
    label: ' фор엘'
    summary: 연어과의 어류로 양식장이나 자연 수역에서 기르는 물고기이다.
    info: 무가지 연어(虹鱒 또는 Oncorhynchus mykiss)는 북미 원산이며 유럽에 도입되어 식용으로 재배되었다. 강물 속 생활하는 일반적인 포털은 청정하고 빠른 투수를 가진 본래 유럽종이다. 두 종 모두 스포츠와 요리 측면에서 귀한 존재다. 특히 산악 지역에서는 구전된 방식대로 트루히아(chovy)라는 전통적 부문이 있다.
  farm.turkey:
    label: 토르티
    summary: 고기 생산을 위해 길러지는 큰 가축 새이며 미국의 추수감사절 기념 행사와 관련된 상징입니다.
    info: |-
      가정용 토르티는 멕시코에서 유래되었으며 아즈텍인들이 약 2천 년 전에 사육했습니다。
       수컷은 특유의 귀 모양과 꼬리 깃털로 부채 같은 형태를 만들 수 있습니다。
      미국에서는 추수감사절 음식으로 널리 알려져 있으며 세계적으로 두 번째로 많이 사육되는 집짐승 중 하나입니다。
      체코어 '크로칸'이라는 단어는 사람에게 자만적인 성격이나 고집 섞인 인상을 나타내기도 합니다.
  farm.water_buffalo:
    label: 가축 버펄로
    summary: 아시아의 농업용 대형 보비드 동물로서 쌀田에서 주요 수력 자원이다.
    info: 버펄로는 아시아 지역에 흔한 가축으로서 오랜 세월동안 논을 갈고 환적 작업에도 사용되었다. 그 우유는 소우유보다 더 진하고 이를 이용해 '모짜렐라 딸 부카'를 만든다. 인도에서는 이 동물을 신성하게 여긴다.
  farm.yak:
    label: 야크
    summary: 티베트 고원에서 사육되는 큰 털소 동물로 우유와고기 그리고 인력 제공.
    info: 야크는 주요한 농업 자산으로서 우유, 육류 및ขน을 생산하며 특히 매우 부드럽고 따뜻한 특성을 가진 모직이 유용하다. 조모(Jomoi)란 야크와 소의 교배종이며 순수 혈통보다 더 많은 양의 우유를 생성한다.
