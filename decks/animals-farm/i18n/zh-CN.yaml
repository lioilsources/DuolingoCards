lang: zh-CN
pivot: false
title: 经济动物
cards:
  farm.chicken:
    label: 鸡
    summary: 产蛋的家禽。
    info: 家鸡是世界上最常见的鸟类之一，用于产蛋和肉类。目前全球有超过250亿只鸡。
  farm.cow:
    label: 牛
    summary: 提供牛奶的大型家畜。
    info: 家养奶牛被饲养用于产奶和肉类。它是全球重要的食物来源之一；一头母牛每天可产出20至30升牛奶。
  farm.donkey:
    label: 驴
    summary: 耳朵大、走路稳健的勤劳动物。
    info: 家养驴是非洲野驴（Equus africanus asinus）被驯化的品种，数百年来一直作为工作动物使用。它们耐力强、可靠，并且能够驮运重物。
  farm.duck:
    label: 鸭子
    summary: 一种有扁嘴的水禽，常在农场饲养。
    info: 家鸭是一种为了肉和蛋而被养殖的鸟类。它们因为脚趾间有蹼膜的帮助可以很好地游泳，并且会发出特有的嘎嘎叫声。
  farm.goat:
    label: 山羊
    summary: 一种有角的家畜，能产出美味的奶。
    info: 山羊被饲养用于产奶、肉类和毛发。它们适应性强，能够在包括干旱地区在内的多种植被环境中生存。
  farm.horse:
    label: 马
    summary: 用于骑乘和工作的强壮家畜。
    info: 马（学名：Equus ferus caballus）长期以来一直是运输、农业和战争中不可或缺的动物。如今，人们也饲养它们进行体育运动和休闲活动。
  farm.pig:
    label: 猪
    summary: 一种粉红色的家畜，有软骨质口鼻部。
    info: 家猪是一种被饲养用于肉类生产的智能牲畜。它们是杂食动物，并且能够记住复杂的任务。
  farm.sheep:
    label: 绵羊
    summary: 提供羊毛和奶的毛发动物。
    info: 家养绵羊被饲养以获取其羊毛、牛奶和肉。它们群居生活，是历史上最早被驯化的动物之一。
