lang: zh-CN
pivot: false
title: 经济动物
cards:
  farm.alpaca:
    label: 羊驼
    summary: 一种较小的骆马亲属，因其细软毛发而被饲养。
    info: |-
      羊驼是原产于安第斯山脉高地的一种小型家养南美动物。它的羊毛被认为是世界上最柔软天然纤维之一；这种材料温暖、低致敏性，并且比开司米更细腻。
      现存两个品种：卷毛型（Huacaya）和丝光型（Suri）。
      近年来在欧洲也开始迅速推广养殖羊驼。
  farm.barn_cat:
    label: 谷仓猫
    summary: 作为捕鼠工具在农场饲养的家猫。
    info: 谷仓猫是一种生活在农业环境中的宠物，它们通过捕捉老鼠和田鼠来保护饲料与粮食。相比室内猫咪来说，这类猫较少接触人类并进行社交化训练，在历史上埃及人就因为其守护粮草的能力而崇拜过这些动物们
  farm.beehive:
    label: 蜂箱
    summary: 作为人工住所的木质结构，供蜜蜂居住。
    info: |-
      一个养蜂场是人为建造的人工栖息地；它代替了野生蜂蜜生存所需的树洞。通常一只殖民群体有五万到八万个成员。
      每个群体会每年生产二十至三十公斤蜜糖。
      这些昆虫在生态系统中扮演着关键传粉者的角色：全球三分之一的食物依赖于它们进行授花受精作用以完成生长过程
  farm.boar:
    label: 公猪
    summary: 野或驯化的雄性家猪。
    info: |-
      未阉割的野生或养殖成年雄性家猪。
      在农场中，它们被饲养用于繁殖；其精液可用于人工授精。野外的公猪（即野猪肉）有强壮犬齿，并能进行攻击性的防御行为。
      烹饪上认为它的肉是一种珍贵猎物食材而受到重视和喜爱
  farm.calf:
    label: 小牛
    summary: 一岁以下奶牛的幼崽。
    info: |-
      犊牛是从出生到断乳或一年龄期间的小牲畜。刚生下的小牛很快就能站起来；母性的本能很强。
      用于产牛奶养殖的小牛通常会被尽早与母亲分开饲养。在许多欧洲国家，嫩牛肉（即小牛肉）是一种珍贵美食，在餐桌上备受推崇。
  farm.carp:
    label: 鲤鱼
    summary: 大型淡水鱼类；捷克传统的圣诞食物。
    info: 普通鲤鱼是养在捷克斯洛伐克池塘中最大的一种鱼，与该国的圣诞节传统密不可分。它于中世纪被驯化，在欧洲中部尤其是波西米亚地区（特雷布尼茨湖）尤为常见。这种杂食性动物生长迅速，并且体重可达超过三十公斤。特雷布尼茨湖泊系统也是整个欧洲最大型的人工养殖水体之一
  farm.chicken:
    label: 鸡
    summary: 产蛋的家禽。
    info: 家鸡是世界上最常见的鸟类之一，用于产蛋和肉类。目前全球有超过250亿只鸡。
  farm.cow:
    label: 牛
    summary: 提供牛奶的大型家畜。
    info: 家养奶牛被饲养用于产奶和肉类。它是全球重要的食物来源之一；一头母牛每天可产出20至30升牛奶。
  farm.deer:
    label: 农场鹿
    summary: 在养殖场中饲养的红鹿或黇鹿，用于获取鹿肉和鹿茸。
    info: "在中国养殖的丹恩鹿（一种小型红鹿）或者森林麂常被圈养于专门区域以生产高质量肉类。\n这些动物体型较小，并具有独特的分叉状角类特征；每年会自然脱落并重新生长出新的犄角。 \n来自人工繁殖场中的这类反刍兽提供的蛋白质来源比普通牛肉更加健康且营养丰富"
  farm.donkey:
    label: 驴
    summary: 耳朵大、走路稳健的勤劳动物。
    info: 家养驴是非洲野驴（Equus africanus asinus）被驯化的品种，数百年来一直作为工作动物使用。它们耐力强、可靠，并且能够驮运重物。
  farm.duck:
    label: 鸭子
    summary: 一种有扁嘴的水禽，常在农场饲养。
    info: 家鸭是一种为了肉和蛋而被养殖的鸟类。它们因为脚趾间有蹼膜的帮助可以很好地游泳，并且会发出特有的嘎嘎叫声。
  farm.emu:
    label: 鸸鹋养殖
    summary: 在澳大利亚，鸸鹋被饲养以获取油、肉和皮革。
    info: |-
      在澳大利亚的农场里，人们将鸸鹋用于生产肉类、脂肪制成的油脂（常应用于化妆品）以及其皮。鸸鹋脂具有抗炎特性，在传统与现代医学中均有应用价值。
      这种动物也被引入到美国及欧洲地区进行繁殖发展。
      此外，这些好奇心强的小家伙并不害怕接近人类。
  farm.farm_shrimp:
    label: 养殖虾
    summary: 在沿海池塘中集约化饲养的海虾。
    info: |-
      白对虾是全球最广泛人工繁殖和培育的一种虾类。
      主要养殖场位于东南亚及拉丁美洲地区。由于其生产活动可能影响红树林生态系统，因此这种密集型养虾业存在争议性问题；
      此外，在世界范围内仅次于金枪鱼之后成为最受欢迎海洋食品之一
  farm.foal:
    label: 小马驹
    summary: 一岁以内的幼年马；出生后数小时内就能站立。
    info: |-
      小马驹是年龄在一年以下的年轻马。
      它们通常会在刚降生后的几小时之内站起来并开始吃奶。相对于身体来说，它的腿特别长，在成长过程中会逐渐变短一些。
      这些年轻的动物活泼好动且充满好奇心；训练（驯服）则要等到两到三岁时才正式展开。
  farm.freshwater_crayfish:
    label: 河龙虾
    summary: 淡水甲壳类动物，养殖作为美食。
    info: 在捷克地区曾广泛分布的河龙虾几乎因瘟疫和水污染而灭绝。如今它们被专门人工饲养于养殖场中，并且是水质清洁度的重要指标物种——只生活在清澈溪流里；十九世纪时从波西米亚出口到法国与德国进行贸易十分繁荣
  farm.garden_snail:
    label: 花园蜗牛
    summary: 一种大型陆生软体动物，在法国料理中作为美食escargot食用。
    info: 花园蜗牛（园艺螺）是欧洲最大的陆地蜗牛。它是一种珍贵的法式佳肴，被称为Escargot。冬季时会躲藏起来，并用膜封闭壳口以越冬。（养殖这种蜗牛称为“螺旋栽培”），主要在法国、意大利和其他国家进行饲养。
  farm.goat:
    label: 山羊
    summary: 一种有角的家畜，能产出美味的奶。
    info: 山羊被饲养用于产奶、肉类和毛发。它们适应性强，能够在包括干旱地区在内的多种植被环境中生存。
  farm.goat_dairy:
    label: 奶山羊
    summary: 用于产奶的山羊，其乳可用于制作芝士和酸奶。
    info: 家养山羊已被驯化超过一万年，并是世界上最常见的牲畜之一。 山羊毛脂含量高且比牛奶更容易消化；适合对乳糖不耐受的人群食用。 著名的干酪如Chèvre、Feta或Halloumi都是用这种动物生产的。 这些生物具有很强的生命力与适应性，在岩石山区也能放牧生存。
  farm.goose:
    label: 家鹅
    summary: 一种大型驯养的禽类鸟，饲养用于肉、蛋和羽毛。
    info: |-
      家鹅起源于三千多年前野生雁种。它是最早被人类驯化的动物之一；在古罗马时期甚至有守卫卡比托利欧山的任务。
      人们重视它的产卵能力以及屠宰用肉类，并且也食用其肝脏（如法式肥肝）
      传统上还使用它柔软的羽绒作为书写工具的一部分——笔尖材料
  farm.guinea_fowl:
    label: 珍珠鸡
    summary: 一种非洲鸟类，因其肉质和作为蛇类警报器而被饲养。
    info: |-
      珠颈斑鸠原产于非洲，在草原地区野生生活。
      在农场中它被视为天然的守卫者；通过其响亮叫声可以提醒人们注意毒蛇、捕食动物以及陌生人。
      它的羽毛呈灰色并带有白色圆点，并且头部没有毛发而是红色与蓝色相间的特点。
      这种鸟儿肉类的味道类似于野味。
  farm.guinea_pig_farm:
    label: 豚鼠
    summary: 南美洲饲养作肉食或作为宠物的豚鼠。
    info: |-
      家养豚鼠原产于安第斯山脉，三千多年前印加人将其驯化为肉类来源。
      如今在秘鲁、厄瓜多尔和哥伦比亚仍是一种传统食物（称为 cuy）。
      而在欧洲及北美地区，则是广受欢迎的小孩宠物。
      它们通过复杂的叫声进行交流，包括咕噜声、呜咽以及嘶鸣等。
  farm.highland_cattle:
    label: 苏格兰高地牛
    summary: 一种拥有红褐色长毛和粗壮角的英国高地区域原产牛肉品种。
    info: |-
      苏格兰高地是源自于恶劣环境下的古老肉用牛种。
      其标志性的红色长发能有效抵御潮湿与寒冷气候的影响，具有较强的适应性和抗病能力。这种肉类口感鲜美、香气浓郁；作为传统黄油之外的一种受欢迎的选择而广受喜爱
  farm.horse:
    label: 马
    summary: 用于骑乘和工作的强壮家畜。
    info: 马（学名：Equus ferus caballus）长期以来一直是运输、农业和战争中不可或缺的动物。如今，人们也饲养它们进行体育运动和休闲活动。
  farm.lamb:
    label: 羔羊
    summary: 一岁以内的小绵羊，象征春天和纯洁。
    info: |-
      羔羊是一岁以下的小绵羊。
      它们出生时有毛发，并在生命最初几天开始吃草生活。
      基督教中它代表纯真以及作为上帝之子的基督形象。许多国家的传统美食都喜欢食用羊肉（尤其是羔羊肉）
  farm.llama:
    label: ' Lama'
    summary: 南美洲的骆驼科哺乳动物，饲养用于毛发和作为驮兽。
    info: |-
      羊驼是安第斯山脉地区被印加人驯化了超过五千年的家养骆驼类动物。它是该地区的主力运输牲畜之一；能够承载高达自身体重百分之三十的东西。
      其羊毛因其保温性能而受到珍视。
      当感到威胁或不满时，它以吐口水著称。
  farm.mule:
    label: 骡子
    summary: 马和驴的不育杂交种，具有非凡耐力与力量。
    info: |-
      骡是母马（雌性）与公驴（雄性）所生后代；相反组合则称为「騾」。它是不能生育但非常坚韧、强壮且适应性强的一种动物，在地形中方向感良好，并比普通马来得更加谨慎而少惊慌反应。
      千百年来它一直是山地运输不可或缺的重要工具。
  farm.mussel:
    label: 贻贝
    summary: 一种可食用的双壳类软体动物，用绳子在海水潮汐中养殖。
    info: |-
      蓝贻贝壳是一种广泛分布于欧洲大西洋沿岸养殖场中的牡蛎。
      它通过缆索或浮标系统，在涨落潮流水中进行养殖。这种生物能够过滤水并具有较低碳足迹、环保型食品的特点；
      它是许多传统菜肴的重要组成部分之一如比利时著名的生蚝薯条（moules-frites）等美食
  farm.ostrich:
    label: 肉用鸵鸟
    summary: 饲养用于肉类、羽毛和皮革的鸵鸟。
    info: |-
      鸵鸟是最快的双足动物，常被养殖以获取其肉食、皮毛与羽绒。
      鸵鸟类牛肉呈红色但脂肪及胆固醇含量较低。
      在奢侈品制革业中广泛使用高质量的鸵鸟皮革。
      传统上人们会利用它的长尾羽来装饰帽子以及球迷服饰等物品。
  farm.ox:
    label: 公牛
    summary: 被阉割的用于农业牵引工作的家养母牛。
    info: |-
      公牛是经过阉割并驯化以供劳动用的家庭牲畜。在世界大部分地区，它曾数千年作为农业生产的基本拉力动物使用。
      由于其强壮且温顺的性格，在早期农耕中比马更能有效地耕地。
      现代机械化取代了它的作用；但在发展中国家中仍广泛地继续应用着这种传统方式
  farm.oyster:
    label: 养殖牡蛎
    summary: 在沿海水域用绳索或网箱培育的海贝类软体动物。
    info: 牡蛎通常被养于近海水域中的浮筏或者笼子中，成熟需要三到五年时间。它们通过过滤水来帮助净化海洋生态系统，并且是一种可以生食也可以煮熟食用的人们喜爱的食物之一；珍珠母（珠光）型牡蛎则是天然珠宝的重要来源地
  farm.peacock:
    label: 孔雀
    summary: 饲养在庄园和公园中用于观赏的雄性孔雀。
    info: 蓝孔雀原产于印度，早在数千年前就被驯化为装饰性的鸟类。 雄鸟会展开超过一百五十根华丽羽毛形成惊人的扇形尾羽以吸引雌鸟。 它们的叫声非常响亮且刺耳。 在印度，孔雀是国鸟并象征着美丽。
  farm.pheasant:
    label: 农场野鸡
    summary: 在养殖场饲养并用于狩猎的野鸡。
    info: |-
      普通雉在中国被养殖，并定期放归自然以供打猎。它的原产地是亚洲；罗马人将其引入欧洲。
      雄性有显眼的颜色和长尾巴，雌性的颜色则较为暗淡、呈棕色。
      野鸡肉是一种珍贵的游戏动物肉质鲜美可口
  farm.pig:
    label: 猪
    summary: 一种粉红色的家畜，有软骨质口鼻部。
    info: 家猪是一种被饲养用于肉类生产的智能牲畜。它们是杂食动物，并且能够记住复杂的任务。
  farm.pigeon_farm:
    label: 家鸽
    summary: 用于肉类（乳鸽）或竞速飞行的家养鸽子。
    info: 家鸽是驯化的岩鸽，通过选育已培育出数百个品种。在许多文化中，幼鸽肉被视为珍贵美食；赛鸽则被专门培养以提高速度，最快的个体时速可达超过150公里以上。捷克拥有悠久而深厚的信鸽养殖传统。
  farm.piglet:
    label: 小猪
    summary: 家养猪的幼崽，通常呈粉红色且活泼好动。
    info: |-
      在出生后的最初几周里被称为‘selate’的小猪非常小巧但生长迅速。母猪平均一次产下约10到12只仔猪。
      selate是聪明动物；研究表明它们与狗一样具有高度智力。
  farm.pony:
    label: 小马
    summary: 一种小型纯种马，常用于儿童骑乘。
    info: |-
      小马是一种体高不超过14.2掌（约147厘米）的小型骏马。
      设得兰矮马是最常见的一种，原产于苏格兰的设得兰群岛。它们体型健壮且能适应恶劣环境条件
      这种动物既适合孩子作为骑行伴侣使用，在矿井中也常用作牵引工具
  farm.quail:
    label: 日本鹌鹑
    summary: 一种小型家养鸟类，用于产蛋和肉类。
    info: |-
      日本鹌鹑是一种被广泛饲养的小型禽类，在集约化养殖中主要用于生产鸡蛋与鸡肉。雌鸟几乎每天都能下蛋；这些卵在许多国家的烹饪文化里被视为珍馐美味。
      它们成熟得很快，并且仅需六周就开始生蛋。
      在日本还把这种小动物当作歌唱宠物来培育，那里对它的驯育已有悠久的历史传统。
  farm.rabbit:
    label: 兔子
    summary: 作为宠物、毛皮或肉用的家兔。
    info: |-
      欧洲野兔在中世纪被驯化成了现在的家兔。
      目前有超过五十种公认的品种，它们在外形大小和颜色以及绒毛类型上各不相同。雌性（母兔）一次可产下四到十二只幼崽，并且每年可以多次繁殖。
      在家养动物受欢迎程度方面，在欧洲仅次于狗与猫之后的是兔子。
  farm.ram:
    label: 公羊
    summary: 成年雄性绵羊，有巨大的螺旋状角。
    info: "公羊是家养绵羊的成熟雄性个体。它们拥有显著且呈螺纹卷曲的大犄角；而雌性的母羊则没有这种特征或仅有很小的小型角。在交配季节（通常为秋季），为了争夺配偶权，这些强壮的动物会用头与对方进行直接碰撞较量。\r\n\r\n此外，在象征意义及神话传说中，“伯兰”常被用来代表力量、生育能力以及领导才能等正面特质，并广泛出现在各种文化背景下的艺术作品和故事叙述当中"
  farm.rooster:
    label: 公鸡
    summary: 家禽雄性；以啼叫宣告黎明。
    info: |-
      公鸡是家庭养的母鸡的男性，以其色彩斑斓羽毛、冠和尾羽而闻名。
      打鸣是一种领地行为的表现，并不仅限于天亮时进行。在捷克语中，它象征警觉，在中国生肖里则是十二种动物之一。
      古希腊人将它们献给阿斯科勒庇俄斯神庙作为新曙光来临之象徵。
  farm.salmon:
    label: 三文鱼
    summary: 一种洄游鱼类，广泛养殖用于食用；在河流中繁殖。
    info: |-
      大西洋鲑是一种典型的溯河产卵的海洋生物，在海水中成长后会返回出生地——淡水中的特定河流进行交配。它们依靠地球磁场和嗅觉来定位自己的故乡河道。
      挪威与苏格兰的大规模人工饲养是水产养殖业的重要组成部分之一
      此外这种美味还富含对健康有益处颇多的人体必需脂肪酸omega - 3
  farm.sheep:
    label: 绵羊
    summary: 提供羊毛和奶的毛发动物。
    info: 家养绵羊被饲养以获取其羊毛、牛奶和肉。它们群居生活，是历史上最早被驯化的动物之一。
  farm.sheepdog:
    label: 牧羊犬
    summary: 经过专门训练用于管理和保护绵羊群的狗。
    info: 边境牧羊犬是最受欢迎的一种放牧用的工作型狗狗，它们通过眼神和安静指令来引导畜群。这种品种被认为是世界上最聪明的一类宠物之一；其工作能力具有遗传性，并且需要从小进行系统性的培养与锻炼才能得到充分发挥。“跳栏赛”（即“赶牛比赛”，英文为Sheep Dog Trials）在英国是一项广受喜爱的传统运动项目，在那里人们会展示自己所养动物的能力水平以及控制力表现等技能技巧
  farm.silkworm:
    label: 蚕
    summary: 家桑蚕蛾的幼虫，能生产天然丝绸。
    info: |-
      桑蚕是被中国驯化的家养丝茧昆虫（学名：Bombyx mori），已有超过五千年的历史。它的一个长达九百米以上的单根纤维是由其蛹壳形成的自然织物来源。
      由于这种材料极其珍贵，在很长一段时间里，中国的相关技术都被严格保密。
      丝绸之路正是因贸易中使用该物质而得名。
  farm.sow:
    label: 母猪
    summary: 成年雌性家养猪，小猪的母亲。
    info: |-
      母猪是已成熟的雌性的家养野猪。它们每年可以生育两次，并且平均一窝产下约十到十四只仔猪。
      在现代农业中，在空间狭小的圈舍内集中饲养母猪的做法存在争议；
      因为这些动物很聪明并且如果处于自然环境中会照顾幼崽长达十二至十六周的时间
  farm.tilapia:
    label: 罗非鱼
    summary: 一种广泛养殖于世界各地的热带淡水鱼类。
    info: 尼罗河口红鲈是世界上最普遍饲养的一种水产，每年产量达数百万吨。它原产自非洲和尼罗河流域湖泊地区，在全球各大洲均有分布；具有较强的适应能力、生长速度快且对饲料要求不高。它是仅次于鲤科鱼类的世界第二大人工培育水产品种
  farm.trout:
    label: 虹鳟鱼
    summary: 一种在养殖场和自然水域中养殖的鲑科鱼类。
    info: |-
      彩虹 trout 原产于北美，后来被引入欧洲作为养殖品种。河鳟（Salmonidae）是原生于欧州、生活在清澈湍急水体中的本地物种。
      这两种鱼都受到钓鱼爱好者及美食家的高度评价，在捷克山区等地养鳟业已有悠久历史并成为传统产业之一部分。
  farm.turkey:
    label: 火鸡
    summary: 一种大型家养鸟类，以肉食为主，在美国感恩节中具有象征意义。
    info: |-
      驯化火鸡起源于墨西哥，并在两千多年前被阿兹特克人首次饲养。雄性火鸡肉有明显的喉部垂羽和展开尾羽形成扇形的特征。
      在美国是传统节日“感恩节”的代表性食物；在全球范围内则是仅次于鸡蛋的第二大养殖禽类。
      在捷语里，“firebird”一词也用来形容一个骄傲自大的人。
  farm.water_buffalo:
    label: 家水牛
    summary: 亚洲大型反刍动物，是稻田的基本耕作牲畜。
    info: |-
      家水牛是从野水牛驯化而来的物种，并且在亚洲是一种基础的经济性畜牧。几千年来它一直用于耕地和运输货物。
      它的奶比牛奶更浓稠并被用来制作布法罗莫扎雷拉干酪（Mozzarella）
      在家印度教徒眼中它是神圣不可侵犯之物
  farm.yak:
    label: 牦牛
    summary: 生活在青藏高原的大型长毛偶蹄动物；提供奶、肉和牵引力。
    info: |-
      家养牦牛是栖息在海拔约三千至五千五百米西藏高寒地区的驯化形式。
      它是当地经济的重要基础，能产牛奶、肉类，并用于纺织及拉车等用途。其羊毛非常柔软且保暖性强。
      杂交品种‘犏’为牦牛与普通黄牛之间的混种后代，在乳产量方面比纯血统牦牛更高一些。
