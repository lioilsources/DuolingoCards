lang: mr
pivot: false
title: व्यावसायिक प्राणी
cards:
  farm.chicken:
    label: मुर्ग
    summary: उद्योगी अंडी देणारा पक्षी.
    info: घरचे मुर्ग हा जगभर सर्वात लोकप्रिय पाळीव पक्षी आहे. ते अंडी घालतात आणि शिकार करून खाल्ले जाते; एखाद्या 25 बिलियन नंबर इतके उपलब्ध आहे.
  farm.cow:
    label: गाई
    summary: मल्हारी दूध आणि मास करिता प्रयुक्त होते.
    info: घरची गाई दूध आणि मास करिता चरवली जाते. हे संपूर्ण जगभरात खाद्याचे एक महत्वाचे स्रोत आहे; एखादी दुग्धशेष गाई दैनिकदा 20–30 लीटर दूध उत्पादन करते.
  farm.donkey:
    label: ओसेल
    summary: विश्वासू चालीचे कामगार प्राणी.
    info: घरचा ओसेल हा आफ्रिकन संतति असलेला जमिनीचा ओसेल आहे, जो दुबळ्या मागण्यांसाठी शतकाधीपासून वापरला जातो. तो टिकाऊ, विश्वासू आणि भारी बर्डेन घेऊन फिरू शकतो.
  farm.duck:
    label: काच्या
    summary: पसरलेले बंद प्रकारची मुखबंदी असलेला पाणवन.
    info: घरगृह काच्या हा मांस आणि डाळिसाठी पालतू वन होय. त्याच्या बर्फ सामेल नसलेल्या पंजांमध्ये पाण्यावर उडवण्यास मदत होऊन ते चांगले ओलापटते.
  farm.goat:
    label: कोंबडू
    summary: रुचिकर दूध देणारे प्रसवीत मनुष्य करणारे प्राणी.
    info: घरगुती कोंबडूला दूध, मास आणि वटळ तयार करण्यासाठी पालतू धरले जाते. हे समायोजित असून शुष्क क्षेत्रांसह विविध प्रकारच्या वनस्पतीवर बाहेर पडू शकते.
  farm.horse:
    label: घोडा
    summary: जिरणे आणि कामासाठी वापरल्या जाणाऱ्या मजबूत पशुप्राण्याचे संदरभनाम.
    info: एक हजार वर्षांपासून घोडा एवढा असलेला गाडीचा परिवहन, कृषी आणि युद्धात निश्चित भूमिका बजावत आला आहे. आज खेळ आणि छगली उपयोगासाठीही त्याचे पालन केले जाते.
  farm.pig:
    label: प्रसे
    summary: खरचंद आणि सॉफ्ट कान मिळवलेली हरताळ प्राणी.
    info: घरगुती प्रसे हा मांसासाठी पालन केला जाणारा बुद्धिमान शेतकऱ्याचा प्राणी आहे. हा सर्वोदर्भीय असून जटिल कार्यांची ओळख घेऊ शकतो.
  farm.sheep:
    label: मांजर
    summary: व्हॉल आणि मेथने काढता येणारे हरित प्राणी.
    info: घरगुती बकरीचे पालन व्हॉल, दूध आणि मासे साठी केले जाते. तो गटामध्ये राहते आणि इतिहासातील पहिले घरगुती प्राणी आहे.
