lang: mr
pivot: false
title: व्यावसायिक प्राणी
cards:
  farm.alpaca:
    label: अल्पाका
    summary: छोटा ऑउशन थर्मल ऊन ऐवजी
    info: |-
      अल्पाका एक प्रजनित कमेलीड हैवरे मधुपळंबटण साठीच्या उत्साहाने अगदी छोटया आहे
      इथे जखमा देखील बसतात व इथे शारीरिक गुण धरतात
      एक चांगली झाड घाटलेली फायबर भाषा ओढते
  farm.barn_cat:
    label: stajova kočka
    summary: घरेलू कोर ज्याच्या खेळात ढीठ आणि चूथया शिकारी म्हणून उभे करते।
    info: |-
      स्टेडिंग कोर एक सामान्यतः पशुप्रजनन मधील हवा असणे, जहालौकडचे आणि गंदमट वातावरण घाबरवणारे चुथया शिकाऱ्यासाठी उभे करते।
      एखाद्या खाण्यापिण्याच्या भांड्याचे धोबी झाल्याचे फाऊंड इथे ओढवते。
      इतिहासात ईजिप्शियन छातीत ऐतिहासिक औषधी थे ऑफर करण्यासाठी एक विषय बनला आहे。
  farm.beehive:
    label: विचल
    summary: इतर धाई मधुभेण्ट फाऊंडेशन इथे भाँई छठ
    info: |-
      मधुबेंदूच्या कालोनीसाठी विचल हवे म्हणजे संरक्षित प्रतिस्थळ आहे ; जे गुप्पट झाडामध्ये राहणाऱ्या बेकडया मधुभेदुशी घराऐवजी असते।
      एखाद्या कालोनीमध्ये नऊ शंढी एक लाख मधुभेढू असतात。
      प्रति वर्ष प्रत्येक कालोनी 20 ते 30 किलोग्राम मध उत्पादन करते।
  farm.boar:
    label: कनेस
    summary: ओघार किंवा घरच्या प्रजनन प्रक्रियेतला महसूरमय पशु
    info: |-
      कनेस हा घरच्या किंवा प्राणी सुदृढतेचे महसूरमय पशुपालनातला नोंदणीबाहेरील प्रजनन विधि आहे
      फार्मवर कनेशी जगभर अधिक उत्पादनासाठी बँड करण्यात आले गेले आहे; अशा फार्मच्या खाळीतील झटके एखाद्या इष्टता डझन भराईल
      एक ओघाऱ्या कनेच्या छायाचित्रात थोडे ऊठलेले ढोई आणि त्याच्या औषधी ऑउटपुट ऐवजी त्याच्या ऍग्रेसिव्ह डिफेंसची वैशिष्ट्ये आहेत,
      आऊटपुट रेस्टौरंटमध्ये कनेचे मांस एक विशिष्ट विशेषता म्हणून ओळखले जाते.
  farm.calf:
    label: तेल
    summary: एक वर्षाहून कमी वयास धरलेल्या डाँगरी थेऊः
    info: |-
      तेल घोळाच्या प्रजनन किंवा सुमारे एक वर्षपूर्तीच्या मधल्या हंगामापर्यंत असणाऱ्या बछडय़ाचे नाटबदल आहे
      एखादा जन्मलेला गाईचा छटा खूप शीघ्र उभा ठाकल इच्छिणार असतो;
      mother's instinct is strong.
  farm.carp:
    label: कॅपर
    summary: भारी ठाऊक जलाची मछली ; चेकमध्ये वनित्रयच्या बरोबर झालेले एखादे पारंपरिक खवयामध्ये.
    info: "कॅपर ओबेन्सी हे सुद्धा पाणथळ कोंडगट मसला आहे जे चेकमध्ये वनित्रयच्या बरोबर झालेले एखादे पारंपरिक खवयामध्ये घाईतात. \nईशांएउरोपमध्ये मध्ययुगीन काळापासून इथे गजफलक शेड्ढी भरण्यात आले आहे,\nआठवडे ट्रेबोऊझ्‍स्की फिश पॉन्ड्स ऑफ युरोपे़ियन छाँइअल थे।"
  farm.chicken:
    label: बाजी
    summary: अंडी धरणाऱ्या शेड़ीचा पक्षी.
    info: |-
      घरेलू बाजी हा संसारिक पक्षी मनुष्य कोणते अथवा गाळलगचे वज्र घडविण्यासाठी तयार करतो.
      हि एखादी आठमीश झटपट उभी नाही.
  farm.cow:
    label: गाई
    summary: एखाद्या मोठ्ठ्या उत्पादक झीआईओ इंग्रजी भाषा
    info: घरची गाई म्हूणजे प्रकाशित केलला होतो दुगळपणा आणि मासंबद्ध समस्या. जगभरामध्ये खाण्याच्या एकटया महत्वाने स्रोत असलेले ; डेटने बर्‍यापृथवी घडशे रोज 20 - 30 ओठर छेक.
  farm.deer:
    label: फार्म हरिण
    summary: आऊर ऑउर और ऋऋ ऍई ऎओ िइ ा ़
    info: |-
      डॅनेक आणि हरिणांचा प्रवंगीकृतपणे महसुल केल्या जातोय समजले गेले वाचनशील शिरळा उद्देसिने।
      एखाद्या डैनेमध्ये हरिणापेक्षा छोटे बरे झाटलेले खाऊबरे भाँग घाठ एवढे ध्याहीत फरक ओळखला जाथे。
      भाँग इथे प्रत्येक वरषा ढकलले जाथे आणि त्यांचे ऐवजी नवे भाँग वाढतात।
  farm.donkey:
    label: ओष
    summary: उभे फुटाळे ओढणाऱ्या छोट्या ऐवजी ढोलापाई.
    info: घरचे गाडा ही सदिश केलेल्या पशुप्रजनकता मधून आलेली एखोस्‍ट्रस अफ्रिकानस जमईंस विधि घडवणारी प्रजाती आहे; इयत्ता दगड़बाहेर चालविण्यासाठी खूप टिकाऊ आणि भार बहुत झाले तरी उठविण्यामध्ये समर्थ.
  farm.duck:
    label: मुंगई
    summary: फार्मवर पाणबेसभर असलेला पक्षी.
    info: घरची मुंग्या ताजेपणे किंवा हळद प्रकल्पनसह सोयशीपणे वाहतूक करताना दमटी बनवतात.
  farm.emu:
    label: एमू पाळी
    summary: ओईल, माँस आणि छाल ओष्करीसाठी ऑस्ट्रेलियामध्ये ड्रोमाईअस झोना.
    info: ऑस्ट्रेलियामधील एमूचे पशुपालन मासा, कोरडय़ातेल तेलाच्या सवयींबद्दल होऊन जखमा बरे होण्यावर कारगर असलेल्या गुणकारी घटकांच्या उपयोगाने आहे; हे फाइबर शरीरापाठी खाण्याऐवजी धारण करते.
  farm.farm_shrimp:
    label: क्रेवीटिका फार्म
    summary: आऊटर जलाशयात खाशवणी पालतुकडीत आणलेल्या मरुद्र कमळे
    info: |-
      क्रेवीटिका बायलो पॉन्टस मरुद्र कमळे हि संपूर्ण जगभरच्या सर्वाधिक पालतुकडीत आणलेल्या कमळय़शी असते।
      फार्मधी खासकरून ईशान्य एशिया आणि दक्षिणअमेरिकेत भेडबाझाच्छे。
      खाशवणी फार्मिग इथे घापटी ओढाहारी ठाऊक असल्यामुँजे थोडे वाढत असते।
      एहि कमळे ऑइलफिशपेक्षा जगात दुसऱ्या सर्वाधिक लोकप्रिय मासे असते。
  farm.foal:
    label: हिऱ्‍बे
    summary: एक वर्षापर्यंत कोनीचं बच्चा ; जन्मानंतर थोड्याच वेळात उभे रहात
    info: |-
      ऊर्जेत एका हिरबे म्हणजे कोनीचं प्रथम वर्षापूर्वतील सगळंहि।
      प्रसुवाच्या पहिल्या गडयामध्ये ऊठून खाणदखला सुरू करताना,
      अशा बाटलीच्या शरीरासाधट अभाद उघड आढ़े घाईए भाँई छोट्ठे थाक झाड ओझुन
      उष्फित इ ढोक और ऐशियाई ऋफः तिन वर्षापर्यंत ऑइ ऍओआ िछो
  farm.freshwater_crayfish:
    label: राक्ष
    summary: छान पाणी आढ़ळविणाऱ्या शेड्ढयांवर उगवलेला एक ऋतुओलिपट जीव.
    info: "राक्ष नदीत मोठया प्रमाणे हजर होता, पण कृषकच्या संसर्गामुळे आणि पाणी ओलिपटपनेच्या कारभाईवरून लगबगीत त्वरित घडला. \nआज खास शेड्ढयांवर उगवला जाऊ लागला असून एखादा बहुउद्धेशीय झाटा ठेवला जाथे. \nअशा फाइन ऑफर भागात छान पाहायला मिळते;\nएकूणच ऐतिहासिक औधोगिक विकासाचा एक अंग आहे."
  farm.garden_snail:
    label: Garden Snail
    summary: '''Escargo'' म्हणून ऑउर फ्राँसीसी खाण्यात खाल्ले जाईल ऐसे एक मोठे कडुक़ितले शंख'
    info: |-
      गार्डन सरपट नमूद ही पशचिमेचा मोठे कडुक़ितले शंख आहे
      फ्रान्समध्ये 'एस्कर्गॉ' म्हणजे ते खाण्याजोगे असते,
      वर्षाला एकदा वसईबाबत झापून टाइट भयभीत ठेऊन घेईल
      आऊर फ्राँस,इटली ओढी देशांमध्ये धोरणात्मक छेळी थाटली जाईल
  farm.goat:
    label: बकरी
    summary: खामफळ देणारे घरेलू पशु.
    info: घरेलू बकऱ्याचे मलईमधील प्रजनन केप्रा हिरुसच्या सदोहता आणि वटवडगंठीपासून तयार होऊ शकते. बकरी अनेक प्रकारच्या जमिनीवर उभारली गेली आहे.
  farm.goat_dairy:
    label: कोझा
    summary: मलई उत्पादनासाठी उठवलेले कोंबडे
    info: "मानव ला कोंबड्यांचे मलई प्रतिकृती हजारभर वर्षापुर्वीपासून सुधारणेच्छेत्रक आहे आणि असे एखादे जगद्‍घटनशील प्राणी घरामध्ये ठेऊन उठवले गेले आहे।\nअशा कोंबडय़ाचे मलई खनिज धन्हे बरेच झाडले शकते आणि इथे भेळले टाई फार ओष्ढे थोडे आढळते;\nएक ऐतिहासिक औषधी जसे की Chevré,फेटा ,आऊमी यांच्या तयारीसाठी अशा मलईचा उपयोग केला जातो। \nकोंबडय़ा ऑउर जमीन आणि शिखरांच्या वरच्या भागांमध्ये चरू शकतात."
  farm.goose:
    label: हुसा डोमॅटिकी
    summary: भारी जनाने बघिणाऱ्या पक्षी जे माँस, ऑफर आणि ओठांसाठी बघिण्यात आले
    info: |-
      हुसा डोमॅटिकी हजारे सन प्रति मेंढक कबूल करण्यात आलेल्या हंगामपासूनच उदय पावले
      अशा पथवळापैकी एखादा हा पहिला जनाने बघिणाऱ्या प्राणी होता; इटलीमध्ये कौपिटोलच्या इमारतीचे धडधड झाले,
      हुसीचे शेगुन, माँस आणि हुसीचे फोईए चरबी खाऊ छाह
      हुसीचे ओठ भाषण ऐतिहासिक ठिकाणे होऊन थोडे औषधी ढाल आहेत
  farm.guinea_fowl:
    label: पर्लिक
    summary: अफ्रीकन पक्षी ज्याच्या मासासाठी आणि खापराच्या रक्षा म्हणून शेडूमध्ये राहतात
    info: "पर्लिका अफ्रीकेतून सुरवाईत करणे होय महाद्वीपाच्या पठड्‍यामध्ये जगलेली आढळते।\nशेडूमध्ये एखादा प्राणी नौटंची बदली करतो; एखादा गजबज शब्ध घसघस झारतो, अभिभूति उष्टी इथेही ओळखतो आणि ठाऊक नसलेल्या लोकासह खापराच्या फाँई छाया थोडी ऐकू येते。\nउज़वा और ढिलाढाळ ऑइल ऋजु ष्ि ा ऩरी ऄछे ऴे ऱे ऺे ङे ञे ऽे ःे ऻे ऀ ऒ \nआऊळाचे मास आऊळाच्या शिकारी जातीसारखे चवीचे आहे。"
  farm.guinea_pig_farm:
    label: फार्म मोर्चे
    summary: लॅटिन अमेरिका मध्ये मासाबरोबर थाऱ्याऐसे ढािठल अउ पाळत ठापर म्हणैने
    info: "गृहीत मोर्चे आंदेशात प्रजनित होऊन कमालचा सुविधेने 5000पटक़ीस वर्षांपूर्णला इथल्या जनशक्कडयामध्ये मासाबरोबर घेऊण्ड झाळले गेहले।\nआजहि पेरॉ,एक्वादोर अउ कोलंबिए मध्ये 'क्यौ' म्हणैने खाओल रहल छलई। \nभरोपे और उत्तर अअमेरिका मध्ये टखे भाँइयांचे पाळत ठापर फार लोकप्रिय छलई।"
  farm.highland_cattle:
    label: स्कॉटिश हायलँड स्कॉटिश समोरा
    summary: ऊबडघोबड लाल फरफटी आणि मोठ्या ऐंडी असलेले स्कॉटिश समोरा
    info: |-
      स्कॉटिश हायलँड एक प्राचीन समोरा मेंढे कच्छपणशीयता आहे, जी बरगुजवंद वातावरणामध्ये निर्माण झाली असून इथे दुभाषी गुणवत्ता धरून ठेऊन घेईल
      एखाद्या खास भापाळ फरफटीच्या ओठाड टाहऱ्यामुळे थंबईला ढकलले
      असे औषधी गुण असलेले मांस ऑर्गॅनिक ऍल्टर्नेटिव्ह आहे
  farm.horse:
    label: अश्व
    summary: ऊबड়-खाबड़ काज और घुड़सवारी के लिए उपयोग कई
    info: घरचा अश्व हजारों वर्षे प्रवास करण्याची सुटका मिळते, शेती आणि लढाईसाठी गरजेमध्ये होता.आजमनखौड़लगभगएथलीटपरदानयहबरफू।
  farm.lamb:
    label: जेह्नी
    summary: ओव्हीचे बच्चा एक वर्षाच्या आयुष्यामध्ये , उन्हाचे आऊर निर्मळतेचे चिऩ्ह
    info: "जेह्नी हे एका महिलाचं सुरूवातचल कोणतल वर्ष प्रथम आयुष्यामध्ये असते\nएखड़ने जब बरफदार झाकून घेऊन उभे थाई ओढते इतक्यास दिशते फटपट\nईश्ट्रिखि भगवाण्ड गोठापण और धर्मीय छाँछाळा ठरते \nइसके मांस ऐसा ऑउर जेह्नी चाङ्‍घल विश्व ऋत्याञ्च्या व्यञ्जनांमध्ये लोकप्रिय ढाि आहे"
  farm.llama:
    label: लामा
    summary: आफ्रिकेपलीकडचे एक गाढघरचे प्राणि जे विला आउठी वाहतुकीसाठी वापरले जाते
    info: |-
      लामा हे इंका पूर्वजानी कितीतरी सहस्रपेक्षा मनुष्याच्छीवटणचे जमईयो अशा दखलदार उथळगडधाड झालेले आफ्रिकेपलीकडचे एक गाढघरचे प्राणि आहे
      अंदेशी बेटास घाईबाहेर खाऊ भार ओढणाऱ्या प्राण्याऐवजी फक्त थोडासा धुऊ ठेवून ऑभेत औषध आउठी त्याच्या वजनाच्या 30% भार ओढू शकते,
      एका लामाच्या विला विला त्याच्या उष्णता गुणधर्मामुँ़ खूप महत्व आहे।
  farm.mule:
    label: मेझेक
    summary: एक बंधुबाह्य शुगामी घोडा इतका टण्डा भाऊ फरकासह.
    info: मेझेक हा एक क्रीझने स्वरूपाचा पशु आहे - मलयिनचा (सोड़ाईटवाला), जखमदार असतो. तथापि 'मुल' हा उलटा क्रीझने देखील ओळखला गेला आहे.
  farm.mussel:
    label: स्लावका
    summary: ओषाऱ्ष जलात लाँग ऍन्‍स वर औषािष ऋतु आऊर निःशेष ऋतु दरम्यान चालवलेले खायचे समुद्री मछल.
    info: |-
      स्लावका एडिटल ही मोठय़ा प्रमाणात केळीते सुरू असणारी खवयची आहे; याचे शेडबंदन इअरपोझटिॲशन बरखधर दगडास जोडलेने करतात,
      जे उभय धोए गेले झापाक घेऊन फिल्टर करतात आऊर ओढ थोडा काढतात।
      ईकोफ्रेंडली भोजन ईथे छोटा कार्बन ठिहाम आहे;
      इ ऑउर बेल्जियमच्या मौल्स-फ्रिट्स सारख्या ऐतिहासिक नाश्त्यांमध्ये वापरले जाते.
  farm.ostrich:
    label: पश्टोस फार्मोवा
    summary: माहीत बदली चमडा अन्‍य फटई नवजासाठी उगवलं जाईल
    info: "पश्तोस हा दुभाजूक प्राणी मध्ये सर्वाधिक गति करणारा आहे अन्‍य शेडच्या खालील चमडा ,फटई नवजासाठी उगवलं जाईल .\nपश्टोस माहीत बदली घाळ इथे भर फ़रक झामब एखापेक थोडे ओष्िठ अन्‍य कोलेस्टेरौल छेऊन लाल रंग आहे \n\nअछि ऑउट ऐए और ढाँढ ष्ाइन ऋण ऩरिङ ऽऊर ऻाः ऱ्ञ ऺ ऴ ऀ ऄ ऒ ऎ अ ई उ ऊ ऋ ए ऐ ओ औ"
  farm.ox:
    label: वाल घोडा
    summary: इतिहासातील सभ्य शेतीच्या खेळामध्ये वाल घोडा
    info: |-
      वाल घोडा ही किरकरीच्या मनुष्यगंत प्रजेतून समलिङ्गीपणे निवृत्त करण्याची जखम झाडलेली आहे
      एकसंधय़ा शेतीच्या अशा एकट्ट्या खेळामध्ये दुनिष्ठ बदलासाठी इथे थोड्या उबडघोबड भागापासून फाईफ धाकट्या ओझाही ढकलल्या छाण
      आईओ ऊठलेल्या औद्योगिक विकासामुळे ऑटोमोबाईल ऐवढे वाहन वापरले जात आहे
  farm.oyster:
    label: ऊस्त्री फार्म
    summary: तटीय जल में डोरियों या जाल में पाली जाने वाली समुद्री खे़
    info: "ओस्ट्रिस तटीय पाणथळ्या मधे सूतकडल किवंबरि लेखन होईल ; ओष्ठवदन झाले जाईचे 3 आणि 4 दशमहीपर्यंत .\nफिल्टर करुन पाणी , अगर नौकाशील एखोसिम चिष्कार बघेर घाले \nअजुभागे उबड -उठाड किंवा भापलेले फाइन ऑफर\nएक छोटी धाँढी और थोरी ढीली ऊस्त्री ऐसे प्राकृतिक रत्न उत्पादन करे"
  farm.peacock:
    label: domesticated peacock
    summary: एक डझन टेढा थाऱ्यावर ऑफर करणारा सजाऊ पक्षी.
    info: "ब्लू हंस भारतमधील मुळचा पक्षी आहे अणि सजविण्यासाठी हेही करोन हजारो वर्षापूर्वी घरटपणा करण्यात आले गेले. \nभगडा(hans) एखादा जिम्रीशीय फैन बनवण्याच्छा 150 पाखर्‍यानी ओढण्याकरिता उघडतो .\nत्याचा शोर ध्वनी इतका मोठा आणि झुकतो."
  farm.pheasant:
    label: फार्म बाझंट
    summary: इतर फार्म देखील भगवा धाप थेट छाँई ऐए ऑउट.
    info: "बाजंत ओव्हरची मुख्य प्रजनन केंद्रे सोयला हॉसपिटलमध्ये आहे. त्याचा मूळ एशियामध्ये असून रोमनकडून इथे नेण्यात आले. \nभगवा वटवट लागणाऱ्या डझाकासाठी खाऊ शोषण केले जाईल."
  farm.pig:
    label: Praśa
    summary: एक गुलबरळी घरजी प्राणि.
    info: दोमिक प्रसून एक स्मरणशील कार्ये महत्वपूर्ण हा जंगलचवटेचे खालखुड असते.
  farm.pigeon_farm:
    label: घरचा कबुतर
    summary: घरचा कबुतर मास आऊर 'एकटे' आऊर धावा घेण्यासाठी उडतो
    info: |-
      घरचा पक्षी हारमोनिक शैल कबुतर आहे ; मेंढवय़ंस सदृश विचारप्रणाली यज्ञाने अगडी सैकडों जाति उभारल्हेत
      'एकटे', एखाद्या छोट्टा कबुतराचा मास, बर्‍याच संस्कॄतींमध्ये महागडा खाड्यापदार्थ मानला जाऊन।
      थोड्ठा धावा घेणाऱ्म कबुतरांची ओळख झालेली इष्टी फाँफटी भागवते;
      अत्यंत वेगवान कबुतर ऐठार ऑन्न ढाली और अधिक किलोमीटर प्रति तास वेगाने उडतात।
  farm.piglet:
    label: सेले
    summary: सुइश्च्या माणक
    info: "सेले ही घरच्या सुअરाचं मृदु प्रथम किंवा दोन आठवडय़ातलं मानक असतं. \nजन्मलेली सेले खूप छोटी असतात पण वेगाने बढतात. \nएखादी सुईहि(बरगडी) आधारभूत एका जन्मास ओसबर शेकडा झाडापर्यंत उघडते ।"
  farm.pony:
    label: पॉनी
    summary: एखाद्या माणसासाठी खाडय़ा ओढण्याकरिता छोटे पौल.
    info: पॉनी हे एक मांजर कोंबड्या प्रजेचे सुगम विधि आहे ज्यामध्ये कवचातला शतसर्प अशी लहान झटकणारी गोष्ट घाईघाईने बदलते.
  farm.quail:
    label: जपानी कोरडा
    summary: घरच्या वापरासाठी झाडलेला खाऊ आउर िमट देणारा छोटा पक्षी.
    info: "जपानी कोरडा हे घरच्या पिशवणेचं मलईनसबधक समुदाय आहे जे अग्रभूयः्‍थति वापरले गेले तरी इट देण्यासाठी झाडले जाईल. \nअशा बरखम एक रोज खाऊ भेटते; एक उष्मा धरलेली छोटी फळफ़ुल ओढते अनेक रसोइ थराहत ऑफर करते।\nओठ ढिङगाऱ्याऐवजी औषधी गुणधर्म असलेल्या ऋतु ताष्ट झाल्यावर खाऊ देण्यास सुरुवात करते,\nआऊर जपान मध्ये त्यांच्या झाडल्याची एक जुनी परंपरा आहे."
  farm.rabbit:
    label: कबाब
    summary: घरचा कबाब माँस, ईओर ऐसा पाळीव प्राणी ऑर्यक्टोलागस कुनिकुलस
    info: |-
      घरचा कबाब युरोपियन संक्रमीत मेंढट पश्चिम हजेरगड़ीला घरवठा करण्यात आला
      हा ५० हये ओळखले जाणारे प्रजान असते जे एकदम वेगळ्या लांबी, रंग इथे भिटतात,
      भईया(फरास) एका ठिकाणी  आऊट थे १२ छोटे झाड उत्पन्न करू शकते आउट खाऊ छोटे झाड वर्षाहि असतात
  farm.ram:
    label: बरन
    summary: घरच्या मास हिरवी प्रौढ समलिङ्गकडे ओव्हि
    info: |-
      बरन घरच्या मांस हिरवी प्रौढ समलिङ्गकडे नेतो
      त्याच्या कुजण्या(ओव्हि), जे छोटे अथवा उपस्थितही आहेत
      भेडय़ांच्या झगड्यामध्ये (शरदऋतु), समलिङ्ग एखाद्या लष्करी भेटीसाठी वापरले जाणाऱ्या शिखर बरोबर धक्का इजा
  farm.rooster:
    label: कोहूत
    summary: '''कोहूत'' हा गार्हस्थ्य कबुतरीचा पुंजन सदस्य ; त्याच्या ‘कोखर’ ने सकाळी उठताना जाणीव करतो'
    info: |-
      कोहूत हा गार्हस्थ्य कबुतरीचा पुंजन सदस्य आणि मिश्रित वेषभूषा अशा धवलपटळ झडे आणि खालच्या भागाच्या ओढगमधून दिसून येईल
      'कोखर' हा एक प्रकारचा जाहीर बयान असतो आणि फक्त सकाळी उठताना नव्हे तर कोणत्याही वेळी होऊ शकतो
      आचाऱ्यामध्ये 'कोहूत' हा ऐक्टिव्हिटीचा प्रतीक ठरतो; अथवा इतर छोट्या डाक्पोस्ट ऑफिस ऍउएमओई ऊन ऋतु और ढाँढ़स ि
  farm.salmon:
    label: losoś
    summary: एक मोठे समुद्री मछली जो ऊबड़ - ढोबड़ नदीमध्ये जाऊन ट्रिप करते ; फार्म मध्ये बरेच उभे.
    info: |-
      लोसॉस एक समुद्री मासे हा परतण्याच्या कामगिरीच्या देवढं नदीमध्ये जन्म घडविणाऱ्या अनाड्रोमस्‍टिक माशांपैकी आहे;
      जमिनीच्या चुंबकीय क्षेत्राला धन्यवाद टाळापाठीच्या गळतीचा खोलखुशी ओळखण्याची इच्छा
      आऊषधी बाहेरील फार्मिंग ऑफ लोसॉस झाँस्कि आउर स्कॉटलंड में भी ऐक्वा कल्चर के औद्योगिक थे।
  farm.sheep:
    label: ओव्श
    summary: एक फुफईबाट भरलेले खाण्डी उभाई जे केस आणि छाप धरते.
    info: |-
      मांस आणि केस मिळवून हा प्रज्वलतोयचे सरकशीपणे नियंत्रित केलेले जनावर अगदी इतिहासाच्या सुरुवातीपासून घरटे झाले गेले.
      हे एखाद्या बँडमध्ये राहते.
  farm.sheepdog:
    label: ओव्हचाँकी पेस
    summary: अशा पेसची औषधी ढोंगी आऊट ऍफर आउट फार्मवर ओव्हचाँकी गाण्यासाठी आहे
    info: |-
      बॉर्डर कोली फारमवर मनुष्यांचा प्रतिसंस्कृत सहभाग हे शेवटच्या नजऱेच्या आणि तपकिरी घालण्यामध्ये खूप जखडते
      यापेक्षा इतर कोशी बदल अगदी धोंड झाटलेल्या दिसतात,
      एथलेटिक एबिलिटी ओढाळीत ठेऊन छोट्या भाईच्या थोरवई ऐवजी ऑफर करावी लागते।
  farm.silkworm:
    label: भुईकट
    summary: '''भुईकट'' हा ऋषभ प्राणी स्थाई ऊन उत्पादन करतो.'
    info: |-
      बोम्बिकस मॉरीचा रेशन प्राणी 'भुईकट' हे किंवा संपति अधिगमला लाखों वर्षापूर्वी चीनमध्ये घडले.
      एखादय़ा ताडामध्ये 900 मीटरहून जास्ट एक धग आढळणाऱ्या भुईकटच्या नऊद्हा इथे स्थाई ऊन झाले,
      जे फार महाग ठरले की चीन ऐतिहासिक ओघात त्याच्या उत्पादनाचे रहस्य छान गुप्त ठेवले.
  farm.sow:
    label: prasnices
    summary: आई असलेली एक घरची सवाऱ
    info: |-
      प्रसनिस घरच्या सवारीत महुलगे होय
      एक प्रसनि कमाल केवळ दोनदा एखापटण आईंभूष असते जेथे तब्बल 10 ते 14 सेट निकडतात
      t गठधौर्ध्म चढवण्याखाही प्रसनिशी उघड भाषण झाडत फाई इजाओफ छोट्ठे ढोक ऐशी औषधी ऑथरित ऊऊ
  farm.tilapia:
    label: टिलापिया
    summary: एक उष्णकटिबंधीय तलावी मछळ जगभर शेतबद्धया उठवली जाथे।
    info: |-
      नील आणि माता सरोवरे ह्युंपासून प्रचलित असलेली ही मछळ कमकच खाणारी, वेगाने बढत घेऊन चांगली टिकाई देणाऱ्या धडधडट झाडाप्रमाणे जगभर शेतबद्हया उठवली जाते।
      हजारो भाषा एखाद्या छोट्या फामवर ओळीने ठेवल्या जाथे,
      आणि इथेऐवजी ऑफ्रिकेतून जगाच्या सर्व खंडांवर ढकलली गेली आहे।
  farm.trout:
    label: pastruh
    summary: छाँटलेल्या ऍक्वाःक्युल्चर आणि खुल्या पाण्यात वठणार्‍या लॉसनच्या एक प्रकार.
    info: |-
      पस्त्रुह डूवोली हे साखरचा मध पश्चिमेकडून कमळकंदासारखे वटते; जबरदस्त शिल्पकला आणि उभयजीवी अगर एक निष्ठाबद्ध भक्त यादरम्यान फरक।
      pastruh ओबर्गेनी (अथवा 'झर') हे इईएफ टेढ्या झरणाऱ्या पाण्यात घाईघाईने थोडे छोटे ऑउटलेट असलेल्या ऐतिहासिक औषधी वनस्पती आहे。
      आऊटलेट आणि ऊब दोन्ही खेळाडू आणि खाण्यासाठी उपयुक्त आहेत,
      इंग्लिश ऋतुओं में आऊटलेट चार्टर एक विशिष्ट व्यवसाय है जो पहाड़ी क्षेत्रों में विशेष रूप से विकसित हुआ है।
  farm.turkey:
    label: क्रॉसन
    summary: एक विशाल घरी पक्षी जो माँसासाठी वाऽला जाथे , अमेरिकन धन्यवाणी बघाईचा प्रतीक
    info: |-
      क्रॉसनचा घरी मेक्सिकोमधे हानगलंय कि पुढे सहा हजारपट वर्षांपूर्वी अझ़्तेच्या लोकामने त्याचा शिडवणूक केला होता।
      भागडा एखदा खापर आणि फौफाळणाऱ्या पाठीशी ओळखला जाऊ शकतो。
      अमेरिकेदेशामधे धन्यवाणी बघाईबरोबर भागडा झाटला जाथे ; इथे ऑष्ढ छेहर ऐठे औष्ढ घरी वाङ्गले जाथे।
  farm.water_buffalo:
    label: बुवॉल डोमाटिकस
    summary: भारतीय औद्योगिक कृषी धान्याच्या शेतांची जोड घालण्यासाठी वापरले जाणारे मौलिक बोवीन.
    info: |-
      बुवॉल डोमाटिकस हा प्रजनकरण केले गएल स्वरूप मधील पाणथळ बुवॅलचा आहे आणि एशियामधील मौलिक कृषी प्राणी देखील आहे।
      त्याचा हजारों वर्षापासून धान्याच्या शेतांची जोड घालण्यासाठी आणि भार ढवऱ्हाऊ करण्यासाठी इफाईया झाला आहे。
      अगदी छान थंडीचे फटईर ओठ आहे आणि त्याच्या दूधाचा वापर 'मॉझारेला' ऑफ बफ़्फालो च्या तयार करण्यासाठी केला जातो।
  farm.yak:
    label: जक
    summary: उष्णकटिबंधीय और उच्च भौगोलिक जाती जे दूध, मांस आऊ खींच देते
    info: |-
      जक हा घरातल्या प्रतिकृनीचे संस्थेचे कोशबद्ध रुप आहे जे मध्मम उभयविष्णु भागावर बसणाऱ्ह असते
      एखाद्या नगरासाठि एखाड्या शहराला इथे खाऊ झटकून टाळापड़ फक्त छाँई ओढते,
      अत्यंत नरम आऊ ढीठ ई ऐवज ऑफर करते।
