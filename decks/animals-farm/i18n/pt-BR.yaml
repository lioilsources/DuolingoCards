lang: pt-BR
pivot: false
title: Animais de fazenda
cards:
  farm.chicken:
    label: galinha
    summary: Ave doméstica que põe ovos.
    info: A galinha é o tipo de aves mais comum no mundo. Ela põe ovos e é criada para carne; há mais de 25 bilhões delas.
  farm.cow:
    label: vaca
    summary: Animal de fazenda que fornece leite.
    info: A vaca é mantida para produção de leite e carne. É um dos principais alimentos no mundo todo; uma vaca leiteira pode produzir diariamente entre 20 e 30 litros de leite.
  farm.donkey:
    label: ásino
    summary: Animal de carga confiável com passo firme.
    info: O asino doméstico é um equus africano domesticado, utilizado há séculos como animal de trabalho. É resistente, confiável e capaz de carregar pesos pesados.
  farm.duck:
    label: pato
    summary: Ave aquática com bico plano criado em fazendas.
    info: O pato doméstico é uma ave de granja criada para carne e ovos. Ele nada bem graças às membranas entre os dedos e emite um som característico de quack.
  farm.goat:
    label: cabra
    summary: Animal de fazenda com cornos que produz leite saboroso.
    info: A cabra doméstica é criada para produção de leite, carne e lã. É adaptável e consegue sobreviver em diferentes tipos de vegetação, incluindo áreas secas.
  farm.horse:
    label: cavalo
    summary: Animal de estimação forte usado para montaria e trabalho.
    info: O cavalo doméstico (Equus ferus caballus) é um grande animal utilizado na agricultura e no esporte. Por milhares de anos foi essencial para transporte, agricultura e combate. Atualmente também é criado para fins esportivos e recreativos.
  farm.pig:
    label: porco
    summary: Animal de estimação rosa com focinho carnudo.
    info: O porco doméstico é um animal inteligente criado para carne. É onívoro e capaz de lembrar tarefas complexas.
  farm.sheep:
    label: ovelha
    summary: Animal lanoso que produz lã e leite.
    info: A ovelha é criada para sua lã, leite e carne. Vive em rebanhos e é um dos primeiros animais domesticados na história.
