lang: eo
pivot: false
title: Ekonomiaj bestoj
cards:
  farm.alpaca:
    label: alpaco
    summary: Plimalkamara kamelido kultivata por sian belan lanon.
    info: 'La Alpako estas pli malgranda kamarida de la Lama dominitigita en montaroj de Aŭdakoj. Ĝia flando unu el plej finaj natursupraĵoj sur Tero - varmeca, hipo-alergiana kaj delika ol kasĥmirano. Ekzistas du rasoj : Huaycya (ondulanta), Surio (serufina). En Eŭropo ankaŭ rapidas disvolviĝado.'
  farm.barn_cat:
    label: katino di'stabla
    summary: Hejmokatino uzita sur agrofarejo por luktadi kun rodentoj.
    info: Kato de stablo estas hejmpatra katino vivanta en agrara medio, kie ĝi pridemandas musojn kaj ratajn bestarojn.Ĝi protektas manĝeblan foragejon kaj graṇon kontraŭ rodentuloj.Katinaro estis plenuminta rolon jam dum la antikva Egipto ekzakte por tio.
  farm.beehive:
    label: bona kaso
    summary: Konstruita lignohejmo uzita de domdativaj abeloj.
    info: Bona kazo estas artifa hejmo por la apida familio; ĝi anstataŭigas arbarajn truojn en kiuj vivadas naskitaj abeloj. Unu grupo havas tipike inter kvindek mil kaj okdekmil abeloj. Kiu el ili produktas jare dudek al triekz doskojn da mielon.
  farm.boar:
    label: boaro
    summary: Silvestra aŭ domesticigita porkvirino.
    info: Boaro estas necastrita virino de la domaĝata aŭ silvestra porko. Sur agrumoj boari estas havigitaj por reproduktado; ilia spermaĵo estis uzota en artifika inkonato. La wilda boaro havas grandajn dentojn kaj povas defendi sin per atakado.
  farm.calf:
    label: tel
    summary: Infaneco da bovino antaŭ ol iĝi plenkrage.
    info: Telo estas infano de domaĝita bovo ekde ĝia naturo go fortilas al la unua jariĝo. Naskiĝinta telo rapidas starigi sin sur piedoj; la patrinoinstinkto estas fortika. Telaĵetoj por lakta produktado estos frue disigis el siajn patron. Telomaso (veal) estas valorplena manĝeterneco en multaj eŭropaj kuvaistiko.
  farm.carp:
    label: karpo
    summary: Granda interna marakva fiŝo; klara natalegesto en Ĉehujo.
    info: La kapro estas la plej granda akvo-kaptita fiŝo en Ĉekio kaj tradicie ligitas al nataltagoj ekde mezepoko sur Mezur-Eŭropo, precipe en Bohemio kun Trebon lakes.Ĝi manĝas ion ajn kaj rapidegas plenumi pesecon super 30 kilogramoj.
  farm.chicken:
    label: Poma
    summary: Agrarbirdino boturanta ovum.
    info: La domata pomo estas la plej disvastigita specio de volatilo en mondo. Ĝi boturas ovojn kaj establas por manĝaĵo; ekzistas pli ol dudek kvin milionoj da individuanoj.
  farm.cow:
    label: '"bosno"'
    summary: '{"summary":"Granda agrikultura animalo donante lakton"}'
    info: '{"info":"La domestika bosno estas kaptita por lakto kaj viando. Unu el la plej gravaj manĝoresurcoj en tutmondo; unu laktanta besto produktas ĉiun tagon inter dudekkaj al tridekj da litroj de lacto."}'
  farm.deer:
    label: elano agrarulo
    summary: Elano aŭ daĝo estas agrare ulatita specieco por sia viandro.
    info: En la Ĉeĥio daĝoj kaj farmonaj elani estas en agrikulturo por produkto de varmbrustemaĵo. Daĝoj havas pli malgrandan korpon ol arbaraj elanoj kun karakterizigitaj larĝaj horhojn; tiun ajron ili perdas unueĉle al si eksteren ĉiu jaron. La viando el tiaj bestaroj formas sana maniero kontraŭ bovo.
  farm.donkey:
    label: Ĉevalo
    summary: Auriganta laborkapablaj bestoj kun stabila paŝado.
    info: La ĉevalo estas domesticita afrika saheloĉeno, uzata dum jarcentoj kiel laborbesto.Ĝi establa, fidelebla kaj kapable portadi pezon.
  farm.duck:
    label: '"ĉevalbato"'
    summary: '"Akua birdo kun plata beko, uzita en agrikulturo"'
    info: '{"info":"La domata ĉevalbato estas birdo farmita por manĝiĵoj kaj ovoj. Plenumegas bone dank'' al la membrano inter siaj fingroj kaj emitas karakterizan kuakadon."}'
  farm.emu:
    label: farmitaj EMU
    summary: Farmitaj EMU donadas ol jon, manĝon kaj peloton.
    info: En Australia onkaptas emuj por manĝaĵoj, grasa oljo uzota en kosmetiko kaj pelleto. La oljon el la grasolemo de l’EMU havas kontraŭinflamajn proprecojn kaj estas uzita ambaŭ tradicie kaj moderne medike.
  farm.farm_shrimp:
    label: vaunmeakrab
    summary: Maruma kraba specie masive fariĝante sur bordbassino.
    info: |-
      La Litopeaneo vaunamea estas la plejelevita krabartido en mondo.
      Farmedoj troviĝas ĉefe sudeste Azio kaj Latinameriko.
      Enintensiva krabofermo konflikta pro efekto al manglezbestaroj.
      Plejsupervolanta marprodukto post tunĉofishto.
  farm.foal:
    label: foalo
    summary: Knabo el ekzemplero Ĝis unu jarolda; Staras en siaj gamboj jam dum kelka tempo.
    info: Foalo estas knabo de ekzemplo ĝis unu jaro da vivo. En la unuan horon post naskado ili staras sur piedoj kaj komencas trinka laktan manĝaĵon. Ili havas tre longkorpigitajn gambojn rilate al ilia korpo kiuj mallongigados kun plenkreskiĝo.
  farm.freshwater_crayfish:
    label: Fluarkapo
    summary: Akva artrópodo agrarbrukita por manĝo.
    info: La raka fluara estis abundanta en la lando sed preskaŭ elsterbinta pro ekkonsumado kaj akvopolaĵoj. Nuntempe oni brumigas ilin je specialaj brutadejoj. Tio estas signato de pura akvo; vivas nur en klarefluantaj riveretoj.
  farm.garden_snail:
    label: gardenan nautilus
    summary: Grandega terestra moluso konsumota fare de francesoj kiel gasto.
    info: Gardena nautilo estas la plej granda terrestro molusko en Eŭropo. Ĝi estas tre valorata franca manĝeterio nomita 'escargoto'. En vintro ĝi kaŝas sin sub folion por hibernaciado.
  farm.goat:
    label: capri
    summary: Agrikultura animalo kun korpoj produktantaj gustan lac-ton.
    info: '{"hint":"domestika kaprogo (Capra aegagrus hircus), kornita agrara bestio","info":"La domaĝi kaprogo estas brufata por lakto, viando kaj lano. Ĝi adaptas sin al malsamaj arboj inkluzive de sekaj regionoj.","label":"kaprogo","summary":"Agrarbesto kun horloj donanta delikatan lacton."}'
  farm.goat_dairy:
    label: kapro
    summary: Besto kun alta valoro al manĝado farata el sia lakto.
    info: La kapro estas domesticigita ekde pli ol dekmil jaroj antaŭe kaj unu el la pleje rozvastigitaj agrikulturaj bestoj en tuta mondo. Kapan lakto enhavas multajn nutrion kaj ĝi havas malplian lacton kontraŭ buvo-lakto por homoj kiuj malsanegas per lact-intoleremo. El kaplakto produktadas famaj formagoj inkluzive Chevre, Feto kaj Halumi.
  farm.goose:
    label: anas serriato
    summary: Granda kaptiva avia besto haviganta mason, pinon kaj plumaron.
    info: La Anas serriata domestica devenis en la kultivado el wilde gansoj pli ol tri miljaro da jarcentoj antau. Ĝin tenis por ties pinojn, mortadon kaj eĉ foje graso interne de tiu birdo estas tre valorita. La periloj de tio birdo tradicie establis pensojn uzitajn ekzemple al skribado.
  farm.guinea_fowl:
    label: guineaperlo
    summary: Afrika birdo uzata ekzemple por manĝaĵo kaj protektado de fermegojn antaŭ serpentoj.
    info: Guineeperlo havas kapelon el Aferiko, kie ĝi vivadas en sabanoj. Je agrikulturo valoratas por esti nativa varnegilo kun sonora voĉo kontraŭ serpentoj, kaŝitoj kaj nesciohomoj.
  farm.guinea_pig_farm:
    label: domatigo
    summary: Dometigitaj guineaporkoj uzatas por vivfaktoj en Sudamerika.
    info: Domatiga guineaporka origines en la Aŭndoj, kie ĝi estis domesticigita de Inkaj antike pli ol 3 000 jarojn komence fonto da viando. Neniam tradicia manĝajo en Peruo, Ekvuadorio kaj Kolombio estas konata kiel 'cuji'. En Okcidento temas pri populara infana amiko.
  farm.highland_cattle:
    label: Alpine ŝoti
    summary: Raso da bòvus kun longaj bruna kapiloj kaj grandaj horĉeloj.
    info: La Skota Alpino estas malnova rasa de bovoj adaptita al la dura montara teritorio en Skoto. Ĝi havas karakterizan longan ruĝbrunajn plumojn por protektado kontraŭ humideco kaj fermo. La rasomaso estas delikata kaj tre aromema, estante populara alternaĵo al normala beef.
  farm.horse:
    label: ĉevalo
    summary: Pova agrikultura besto utiligata ambaŭ al ekzekvo kaj laboro.
    info: La domestikita ĉevalo estis centoj da jardecojn necesa por transportado, agronomio kaj bataliĝo. Hodiaŭ oni ankaŭ uzas ĝin en atleto kaj rekreaĵoj.
  farm.lamb:
    label: berekas
    summary: Knaboj de ovo Ĝis UnujarĜeco Da Vivo
    info: Berekas estas knabo de ovo ĝis unu jarĝo da vivo. Naskiĝas kun folio kaj komenciĝas paŝti en la plej frue ajroj de sia vivo.
  farm.llama:
    label: lamo
    summary: Sudamerican animalo simila al kamelo, uzate por flankego kaj transporto.
    info: La Lama estas dominita sudamericana kameldomo kiu estis uzata de la Inkaj por varmo kaj transporto ekde antaux ol kvin mil jaroj. Ĝi servas kiel plej grava transportema besto en tiuj regionoj kie vivadas per montetojn portantaj supren al tridek procentoj el sia pezo. La plumado havanta termikan valoron estas tre sercxita.
  farm.mule:
    label: mezeko
    summary: Nefertila mezeco inter Ĉevalo kaj Asino kun ekstraordigna persistemo kaj energio.
    info: "La mezekeco estas hibrido de ĉevalino kaj asinonulo; la inversa kombinaĵo nomiĝas muļo. \nĜi establas sterilecon sed havas grandan fortikecon, forton kaj rezistemon al stresoj en montara terraino. \nIli bone navigacias tra naturaj barieroj kaj montras plian prudentecon ol pur-purĉevaloj dum transportado."
  farm.mussel:
    label: mola
    summary: Moloko edible kaptite sur linoj dum movadeco.
    info: Edibla slavko estas duvalva moluko abundante kultivate en fazendoj laŭlonge de Atlantika marbordo da Eŭropo. Ĝi estos trentita per lanoj aŭ ŝtonoj inter pleĝado kaj eliremo. Filtrantas akvon, temas pri ekkologia maniero produkti nutraĵon kun mallonga karbona paco.
  farm.ostrich:
    label: farmemaŭ
    summary: Farmita emuo por manĝado.
    info: Emua estas la plej rapida dupeka birdo kaj ĝin brufas en agraro por manĝajo, peroj kaj karno. Emuan karbonon oni priskatu al bovo kun pli malalta graso kaj kolesterolo enhavo.
  farm.ox:
    label: bovu
    summary: Kastraĝita buko historia pleje gravinta tiranta animalo.
    info: Bovu estas kastralita masculo de la domiĉa bova specio uzata por laboro. Ĝi estis bazaj tirantaj bestoj en agronomio dum miljarde da jarojn preskaŭ en tutmondo. Pro sia forto kaj pacemo povas ariti pli multekostan teron ol ekzemple hundoj.
  farm.oyster:
    label: farm-ostra
    summary: Marino molusko kultivata super fadenoj kaj retetoj en proksimaj akvok.
    info: Perlo ostras estas kaptita en litoraj akvoj sur fadenojn aŭ retojn; ĝi atingas plenan grandon post tri al kvin jaroj.Ĝi filtradas la akvon kaj helpas purigi marinajn eko-sistemojn.Gustema ostrakomestado okazigas saviĝante aŭ kuŝinte.Bispermiga (perlproduktanta) ostramalfermas fonto de naturaj perl.
  farm.peacock:
    label: doma paŭko
    summary: Maskla paŭkulo kun lusterplumita venstreto uzata en parketo.
    info: Blua pavoko originas el Indo kaj establiĝi ekzistas jam miloj da jarojn kiel dekoracia birdo. La masklo malfermas pli ol cent ornitaj plumoj por formigi impresan venturon dum serĉado pri konjuginoj. Ĝia voĉdonaco estas tre forta kaj klara.
  farm.pheasant:
    label: farmphezano
    summary: Pezanato havanta specifan plumadon kaj longa vosto.
    info: La farmaŭto estas en la lando havigita sur agrokulturaj posedoj kaj regule liberigata al naturo por venenado celoj. Lia origino troviĝis en Azio; li establiĝis en Eŭropo per romanoj transporditaj ekzempleroj.
  farm.pig:
    label: porkaĵo
    summary: Rosakolora agrara besto kun malforta nazo.
    info: La domata porkaĵo estas konsiderita intelektema agrikultura besto ĉasota por manĝi homojn.Ĝi havas omnivorajn nutraĵojn kaj povas memoradi kompleksajn taskojn.
  farm.pigeon_farm:
    label: tufeto domesticigita
    summary: Tufeton kunmetita por farno squab aŭ kurada volado.
    info: La domatika tufeto estas la domesticigita roka tufeto; per selekto estis kreitaj centoj da rasoj. Squabo (farkas de junuloj) en multe el landoj havas grandan valoron por manĝado. Kurad-tufetokas estas edukataj pri rapideco; kelkaj ekzempleroj flugas pli ol 150km/h rapidecon. En Rumanio oni serĉegas longa historie.
  farm.piglet:
    label: pigloto
    summary: Infanulo porko, kutime rozokoloreca kaj ludema.
    info: Pigletoj estas infanoj de la hejmporco en ilia unuaj semajnoj da vivo. Nova-naskiĝintaj piglotoj estas tre miksitaj sed rapideme kreskas. Ino-porcinoj ĝenerale donacas al naski interdek kaj dudek piglojn dum ununura parturo.
  farm.pony:
    label: ponio
    summary: Plenkravita miniatura Ĉevaleca Raso populariganta montadon por infanoj.
    info: Pony estas malgranda ekstrema de ĉevalo kiun alteco en la flanketo ne transpasas 14,2 manojn (aŭ 147 centimetrojn). Ŝotlandaj pony'j estas pleje grandeco el tiu grupo kaj origine venis al Skotlando sur insuloj nomitaj Shetlands. Ili establas fortikaj bestoj kapablaj da vivado sub malfacilaj kondiĉoj.
  farm.quail:
    label: perduko japana
    summary: Malsupera birdo agrikulture ĝisdata por ovoj kaj viandro.
    info: La japanisma perduko estas domiĝinta specio de perdutko ĉasita intensive por ovoj kaj viando. La femalo depozacas ovon preskaŭ ĉiu tago; la ovaloj establas delicatemon en multe da kuvaĵaroj. Rapidigas sian plenumadon kaj ekdeponeblas jam post ses semajnoj.
  farm.rabbit:
    label: Kaniko
    summary: Domaĉa Kaniko tenata por manĝo, pelo aŭ kiel amika besto.
    info: La domesticigita kaniro estis plenumigitaj en mezepoko el la eŭropa silvestra kaniko. Ĝi havas pli ol kvindek rekonitan rasoĵojn diversantajn per grando, koloro kaj tipo de pelto. La femalo (kanino) povas donaci al naskiĝi inter 4 kaj 12 gepatrojn kun pluraj reproduktadoj jare.
  farm.ram:
    label: bero
    summary: Adulto virina ago kun grandaj spirale turnitaj korne.
    info: Bero estas adulta kapro de agno domestika. Ĝi havas distingindajn spirele turnitajn kornojn kiujn la femaloj (aginoj) mankas aŭ nur posedas mallongajn ekzempleron. Dum batoresado en oktabra periodo rivaloj inter si konfrotadas per fronto-kornadaj kolizioj.
  farm.rooster:
    label: peto
    summary: Maskula parto el domestiki pinton; per sia voĉo oni atentegas sur sunleviĝon.
    info: Peto estas la maskulo de domestika pinto kaj agnoskiĝas pro ĝiaj barilitaj plumoj, kapo kun plumaro kaj longa vestita venstreko. Kriado 'kokoko' montras sian posedon kaj okazigas ekde matene sed ankaŭ dum tuta tago. En Eŭropo peto simbolas vigiladon en heraldiko; en la ĉina astrologo ĝin inkludas inter duondeco da animatoj. Antikvaj grekoj donacis al Aseklop kao signo pri nova sunleviĝo.
  farm.salmon:
    label: lus
    summary: Granda varma-mara fiŝo migrantas al fluatoj por reprodukti sigin; multe uzata sur agrumfiŝfarmoj.
    info: Atlantika lusojas estas anadroma fiŝo; ĝi vivadas en maro sed revenas al sia naskiĝanta rivero por riprodukti sin. La kapablo trovi sian originan riveron dependas de la tera magneta kampo kaj olfakado. En Norvegio kaj Skocio agrumi-kaptado establis unuan el plej grandaj branĉoj da akuaka agrikULTUro.
  farm.sheep:
    label: ovo
    summary: Pilka agrikulturada besto donanta lanon kaj lacton.
    info: Domaca ovo estas kultivita por ĝia lano, lakto kaj carne.Ĝi vivas en grupoj kaj unu el la plej frue domesticigitaj bestoj de historia epoko.
  farm.sheepdog:
    label: hunda pastorego
    summary: Hundoj kiuj ricevas specialan instrui kun administrante kaj protektanta grupo da ovci.
    info: "La Border Koli estas la plej populara ovĉaca hundo, ĉasita por gvidado de grupo per rigardo kaj silenta ordonojn. \nĜi apartenas al unu el pli inteligente peco da pasintoj. \nTrabato kapablo devas esti hereditaj kaj trejniĝis ekde infano. \nOvca saŭto konkursoj estas popola atleto en Anglio."
  farm.silkworm:
    label: serika larvo
    summary: Larva formo de la serikanimo uzota por naturseton-produko.
    info: |-
      La seriko de la dominita tenkato en BomoX Mori estis kultivita ekde pli ol kvin mil jaroj antau en Ĉinio
      El lia pako eliras ununura fibro longiganta super naŭcent metroj por donaci naturan setonon,
      kies valoro konduktas al strikte gardata sekreto dum centuroj pri ties produktado;
      tie pro tiu komerco ricevis nomon La Setona Vojo.
  farm.sow:
    label: porcina
    summary: Matematiko el porkbestoj.
    info: Porcino estas matura ĉevalo de hejma porkbestoj. Ŝi povas naski dufoje jare kaj la meza grando de gepatrogo establas interdek al kvardekkvin infanojn. Intenca havi porcinin en modernej agronomio kontraŭstarigas pro kondiĉoj kiun oni donacas per grandaj celdimensioj.
  farm.tilapia:
    label: nilfundo
    summary: Tro-paka salakvo-masa havbrado globala.
    info: Nilofundo estas unu el la pleje disvastigitaj akvilokoj en mondo; ĉiun jaron produktas centoj da tonoj. Originas de Nilo kaj afrikaj lakejoj sed nuntempe oni havbrems plenumas sur Ĉiu Kontinente .
  farm.trout:
    label: truta
    summary: Salmonida pezumo faskata sur agrarfarboj kaj liberaĵoj.
    info: Arko-trouta origine de Nord-Ameriko kaj estis enkondukita al Eŭropo kiel agrikultura fiŝo. La trouto estas originala eŭropa specio vivanta en puraj rapidantaj akvoj. Ambau la tipoj gravas por sportsfiskado kaj gasto.
  farm.turkey:
    label: melegallo
    summary: Granda domatiptano por masego uzato simboli tagon Graciasdonadon.
    info: La Melea Galopava estas originema el Meksiko, kie ĝi estis domestikiĝinta de Aztekoj pli ol du mil jarojn antaŭe. La maskulo havas karakterizan ŝtonon sur la kapo kaj povas disetendi sian pinton en formo da ventilo. En Usono tiun manĝatas tradicie dum Tago Graciasdonado; globale temas pri dua pleje rolijmata domestiĥita volatila animalo.
  farm.water_buffalo:
    label: domestic buffalo
    summary: Granda azia bovida laborbesto utiligata sur ricekarteroj.
    info: Domestika búfalo estas la formita specio de akua búfalo kaj baza agrikultura besto en Azio. Ĝi traktrasas ricekarbojn dum miloj da jaroj kaj transportadas ŝargojn. La lakto el tiuj animaĵoj pli grasa ol vaksa kaj uzatas por produktado de Mozzarella di Bufallo.
  farm.yak:
    label: Yako
    summary: Granda bestego de alta montara regiono en Tibetio uzata pro laktado, mankarmono kaj trahelpovo.
    info: Domakita yak estas formiĝinta el la wilda yak vivanta sur Tibeana Nohompejo ĉe alteco inter 3 000 kaj 5 500 metroj. Ŝi donas lakton, mankon por mangxi, varman kaprandon kaj fortran potencon.
