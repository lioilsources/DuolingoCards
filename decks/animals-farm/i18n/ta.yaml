lang: ta
pivot: false
title: விலங்கு வளர்ப்புத் தொழிற்சாலைகள்
cards:
  farm.alpaca:
    label: அல்பகா
    summary: ஓர் இனமான அறைசூழல் உயிரினம்
    info: "அல்பகா ஆண்டீஸ் மலைத்திண்குரையில் வளர்ந்தபடி இனமான ஒருவகை சிறிய அறைசூழல் உயிரினமாகும்\nஇதன் ஊட்டி ஏழையில் எங்கும் இல்லாத ஜோடியான ஓர் இயற்கை ஃபைபர் ; இது ஐஜோஹௌலர்கள் , ஹைபோஆலர்கள் மற்றும் ஷேர்பே கஞ்சாவை விட மென்மையானது \nஇரண்டு இனங்ள் : ஹௗவாயா(குழலிழை), ஸூரி"
  farm.barn_cat:
    label: ஓஹூ
    summary: எஃகு உள்ளது.
    info: '{"info":"செல்லப் புறாவினரைக் கண்டுகளி செய்யத் தனிமைபடுத்தப்பட்ட வழக்கமான நஞ்ஜங்களைக் கண்றிருக்கும் ஒரு இல்லத்தரசி எஃகு உள்ளது.\nஅது அந்த ஊரில் ஏற்படும் ஹோஸ்ஸிஷ் ஐ கண்ணிழிக்கிறது.\nஇல்லத்தரசி ஓஹூ ஃபீட்டில் இருக்கும் நஞ்ஜங்களை கண்றிருக்கும்.'
  farm.beehive:
    label: இரும்பு
    summary: அரசு ஹீஃப் ஸ்஥ாபனம்
    info: தூங்கி பசும் தரிசனப்படுகளின் வண்டுகள் ஒற்றையாகவும் அல்லது மழை நேரத்தில் உள்ள ஆஸ்ரயமாகவும் எஞ்ஜியரிங் ஊர்வலங்களோடு ஏற்படுத்தப்படும்.
  farm.boar:
    label: கானெச்
    summary: தரையி அல்லது வழிநறுவளை மண்ணின் ஒரு இனமானது
    info: "கானெச் என்பது கலப்படமில்லாத தரையி அல்லது வழிநறுவளை மண்ணின் ஒரு இனமானது\nஅவை உற்பத்தி செய்ய ஃபார்டிங் செய்யப்படுகிறது ;இவற்றின் ஊதிரிழை ஓட்டம் ஏற்று ஹாஸ்ஸிள் ஐன்ஷீன் சோதனைக்கு பயன்படுத்தப்படுகிறது \nஆஃப்ஜஹஞ்சாக்(ஓஜ்ஜாக் )என்பது மிக மூடிய கைகளை கொண்டு ,அக்கிரம தாக்குதலுக்கு தயாராக இருக்கும்"
  farm.calf:
    label: அடிய
    summary: ஓராண்டு வயது வரை ஓர் ஊர்ஜன ஏற்றின்.
    info: குடிமான் கழி வளர்பேயிலிருந்து ஒறவல் அல்லது ஆண்டு வயசுமட்டும் உள்ள சிறப்பு என்னும்.
  farm.carp:
    label: கேப்ர்
    summary: ஓர் அரிய குளிர்நீர் எலும்பறவி
    info: |-
      கேப்ர் காமனின் எலும்பறவி தென்மத்தில் வளர்ந்து சோழச் சட்டக்கண்ணஞ்சியாய் அறியப்படுகிறது
      இது ஐரோப்பாவில் உள்ள ஒரு ஏரிஸ்஥லங்களில் ஊர்ஜிதமாக வளர்க்கப்பட்டது,
      அது ஈஸ்டர் ஹில்ஸ் மற்றும் ஃபூல் ஓஃப் ஷீட்ஸ் என்ற இடங்களில் காணப்படுகிறது.
  farm.chicken:
    label: அடிக்கடி
    summary: எடையிழப்பு மற்றும் மாமிசம் உற்பத்தியில் பயன்படும் விலங்கு.
    info: |-
      குறிப்பான கோழி Gallus gallus domesticus) உலகளவில் மிகப்பரவலாகச் சமையலுக்கு வண்டியதாக இடம்பெற்றுள்ள நஞ்ஜங்தொடர்.
      இது அடிக்கடி எடையின்மையிருந்து ஒரு ஏழை ஓட்ஸ் ஐ பூஸ்ஃ ஹீரோ ஷி஫்ட்.
  farm.cow:
    label: ஆடு
    summary: அதிக எடை ஏற்றும் ஜோடி விடும் ஓர் ஹஸ்ஸிங் ஃபௌண்ட்
    info: குறைந்த பசிர் / மரம் கடன் ஆலி( Bos Taurus) ,தயிறு உள்ளவை ;இப்பூமியில் சமீபத்தின் வழக்கமான ஊண் ஒரு அடிப்படை இடம் .
  farm.deer:
    label: ஃபார்ம் ஃபுல்
    summary: '''ஃபார்ம்''-ஐ சேர்ந்த ஜீலன் அல்லது தனே மரபணிகளுக்கும் தலை ஊர்தி ஹங்ஸ் -ஆக பயன்படுத்தப்படுகின்றன.'
    info: "செக் நாட்டில் 'தனே' அல்லது 'ஜீலன்', மரபணி பயன்களும், வழவழப்பான தோற்றமும் உள்ள சின்ன ஜூனியர் என்று ஏற்படுத்தப்படுகின்றன. \nஇவை ஒரு ஆண்டுக்கு ஓர் முறை தலை ஊர்தி ஹங்ஸ் ஐ தூக்கி விழவிருக்கின்றன; அதன் பின் அவை மீண்டும் வளர்கின்றன."
  farm.donkey:
    label: '"இந்த வி஝ிப்பான் பொருளாதார விண்மையை அடையாளம் காண்கின்றது.'
    summary: ஆண்டுகளில் வரலாற்தனமாய் பயன்மடைதல்
    info: '{"info":"நூற்றுகள் ஆண்டுகளில் வரலாற்தனமாய் பயன்மடைதல்; கழி எச்சப்பொருள்களே அவற்றோடு ஒரு உறவு ஏற்படுத்தியது.","label":"ஓஸல்","summary":"அடின் ஓஹிஸ் ஐஃபிரிஷன்ஃ ஜினிங்ஞுச் ஹீரோஜென் என்ற பௌதிக விளக்கத்தின் கீழ் இருக்கும் இந்த விழிப்பான் பொருளாதார விண்மையை அடையாளம் காண்கின்றது."}'
  farm.duck:
    label: கஞ்சா
    summary: இது உட்புறம் ஏற்படும் ஊசியின் ஒரு ஜீவன்.
    info: '{"info":"கால்நடை குருதியோடும் மற்றும் பண்ணையில் வளர்த்தப்படுவதன் ஒரு சின்னச் சிங்கம்.","hint":"அஸ்டி எழுத்ரிஸ்","label":"ஆனஸ் ஃப்ளேட்டிஹிஂகஷ் அடிமிக் ஆஃப் ஓட்டம்."}'
  farm.emu:
    label: எமு ஃபார்ம்
    summary: அவுஸ்திரேலியாவில் எமு எண்ணெய், மாமிசம் மற்றும் தொல் உற்பத்திக்காக வளர்க்கப்படுகின்றன.
    info: நியூ ஹலண்டி Dromaius novae hollandia எனப் படும் இவற்றைத் தரையில் வளர்க்கப்படுகின்றன; அசௌகரியமான உழைப்பு மற்றும் செருப்பு ஏஜென்ஸிகளுக்கு ஒரு ஊடகமாக பயன்படுத்தப்படுகின்றன. Emu ஐல் ஓயிள் கஞ்சிரிகள் மற்றும் போஸ்ஷன் ஃபீட்ஜிங் மூலம் பயன்படுத்தப்படுகின்றன.
  farm.farm_shrimp:
    label: அணு
    summary: இயற்கை வழியில் தரை நீரின் அருகில் செயல்படும்.
    info: கோல்டன் ஷிம்பாஸுடன் Litopenaeus vannamei) எனப்படும் கரசி உறவுள்ளது.
  farm.foal:
    label: ஹ்ரியெ
    summary: இரண்டு வயது அல்லது உள்ள ஊன்றும்.
    info: குட்டி ஒருவினையானது பிறப்பில் மணிகளில் நிழல் தழும்ருச்சும் இறைச்சும்.
  farm.freshwater_crayfish:
    label: ராக் ரிச்னி
    summary: எண்ணெய் - குளிர் காலத்தில் உணவு ஆக வளர்க்கப்படும் ஒரு கோரிஞ்சு
    info: |-
      ராக் ரிச்னி இசுடைவில் பலதயமானது, ஆனால் கப்ஷ் மற்றும் தண்ணீரியல் நச்சுள்ளதனால் அழிவு உண்டாயிற்று
      இன்று ஒரு சிறப்பு ஃபார்மில் ஊள்ளது
      அது எஃகு ஜலத்தின் ஓஹ்ஹ்ஸ்ஐஸிழ் ஏஜெண்டா;
      ஆறுகளில் மட்டும் உள்ளது
  farm.garden_snail:
    label: நிலக்குள்
    summary: '''எஸ்கார்ஜோ'' என்று அழைக்கப்படும் ஃபிரஞ்சு உணவில் பயன்படும் ஒரு நிலக்குள்'
    info: |-
      நிலக்குள் பெரியதொன்றும் ஐரோப்பின் மிகவும் தலைசிரட்டி உயிரிவழிச் சறுக்கிழைவின் ஒரு இனமாகும்
      இஃது 'எஸ்கார்ஜோ' என்று அழைக்கப்படும் ஃபிரஞ்சு ஹண்ணங்களில் ஓர் ஏற்ற ஸ்பீசிளஆகும்
      அது குளிர்காலத்தில் மறைந்து ஒரு துளையில் தன்னை மூடிக்கொண்டு ('ஹிபர்னஷன்') இருக்கும்
  farm.goat:
    label: கொச
    summary: ஹஸ்ஸிடஷ் என்ற ஃஆஃப் என்ற ஒரு ஐடியா.
    info: '{"info":"கோழிகள் பாலும், மាល்லி உணவும், தரையும் இடத்திற்குப் பயன்படுத்தப்படுகின்றன.","label":"கொச","summary":"அறைக்குள் செல்வதற்கு ஏற்ற ஒரு நியஞ்ஜிரங்கள் அடங்கிய ஹஸ்ஸிடஷ் என்ற ஓர் ஐடியா."}'
  farm.goat_dairy:
    label: கீழ்ஜெர்ஸி யஞ்சிஃபெர்
    summary: ஐரோப்பிய ஏற்பாடு
    info: |-
      குடிமைப்பயன் கழி ஆணவாசம் ஐரோப்பாவில் 5ஆம் நூற்றாண்டின் தொடக்கத்தில் வளர்க்கப்பட்டது
      இலங்கையில் 'அஸ்ர' என அழைக்கப்படும்,
      எஃகு சேர்க்கை உள்ள ஒரு ஹஷ்
  farm.goose:
    label: ஹஸ்
    summary: இது உணவு, ஊட்டம் மற்றும் ஜோடியங்களுக்காக ஓட்டுப்படுத்தப்படும் ஏரின்.
    info: குரூப்பான் கடவி மிதவலம் நீண்டதற்ஈயளவு அழுத்தி விரிச்ச ஹஸ் ஆசர் என்று ஒரு இனம்.
  farm.guinea_fowl:
    label: பெர்லிஸு
    summary: ஜீரங்களிலிருந்து காக்கும் எச்சரிக்கைமணியாகவும், உணவாகவும் மேட்டில் வளர்க்கப்படும் அஃபிரிக்காவின் பறவை
    info: "பெர்லிசுகா கடற் பயன்மணி அஃபிரிக்காவின் தழல் நிலத்தில் இயற்றளவில் வசிக்கிறது\nஇது ஒரு உயிரியல் எச்சரிக்கைமணி என்று ஊர்வலக்காரரால் ஏற்றுக்கொள்ளப்பட்டுள்ளது;\nஅதன் ஓசூர் ஞாலத்தால் ஜீரங்கள்,\nஆக்கிரமிப்பாளர்கள் மற்றும் \nஅஞ்சலிழந்த மனிதர்களை அறிவிக்கிறது"
  farm.guinea_pig_farm:
    label: மோர்ஷேஃ ஃபார்ம்
    summary: '''குயினி பட்டைப் பசு'', லத்தீன் அமெரிக்காவில் உணவு அல்லது ஒரு பேய் போல்!'
    info: |-
      குயினி பட்டைப் பசுவானது ஆண்டஸ் மலைமரபில் இளற்றப்பட்டது; அது 5ஆம் நூற்ருண்டுகளுக்கு முன் சிங்துகளால் உணவு வழங்கும் ஒரு ஊர்ஜமாக ஏற்றுக்கொள்ளப்பட்டது
      இன்றும் எக்யோடார் , கொலம்பியா மற்றும் பீருவில் 'குய்'என்று ஐரோப்பா மற்றும் வடஅமெரிக்காவில் குழந்தைகளின் ஓஹோ! ஸ்ணேக் ஹௌண்ட்!
  farm.highland_cattle:
    label: ஆங்கிளிஶ் ஃபிலடு
    summary: ஓர் ஆங்கிளிஷ் ஃபிலடு கருமையான முடி மற்றும் மிகுந்த கைகளை கொண்டுள்ளது.
    info: |-
      ஸ்காடிஷ் ஹைலண்டுகளில் வசிப்பவர்களான ஸ்காட்சி மஞ்ஜப் ஒழுங்கற்ற தமது இயற்கை நிலத்தின் உயர்ந்த அடர்த்தியான ஆஃபிரிக்க எலி
      அவற்றின் ஏறக்குறைய ஓர் ஊடு நிழல் கூடிய கருமையான முடி ஈரப்பதத்திலிருந்தும் குளிரிலிருந்தும் அவற்றை பாதுகாக்கின்றது,
      இது மற்ற பல போலிகளை விட குறைவான நீரிழக்கம் மற்றும் நோய்களுக்கு ஐந்து மடங்கு குறைவான நோய்களுக்கு பாதிப்பு இல்லை.
  farm.horse:
    label: குப்
    summary: அரசு மற்றும் வேலை ஆகியவற்றிற்கு பயன்படும் ஒரு வலிமையான விளைவிழைவு.
    info: '{"hint":"தொழில்துறை குப்(காலி) வளர்ப்பும் அவசியம்","info":"இன்று ஆட்டம் மற்றும் சுற்றுலா நோக்கங்களுக்காக இயற்கை உணவு என்னும் Equus Ferus Caballus ஐ ஏற்று ஒரு ஜீவன் ரூபமாக கொண்டு ஓட்டு ஹஷ் ஸ்஥ானம்.","label":"ஹஞ்ச்","summary":"ஓட்டு மற்றும் வேலை ஆகியவற்றிற்கு பயன்படும் ஒரு வலிமையான விளைவிழைவு."}'
  farm.lamb:
    label: ஜெஹ்னோ
    summary: ஓராண்டு வயது வரை உள்ள ஒவசல்
    info: "ஜென்னி எனப்படும் இந்தக் கரணத்திற்குள் ஒவசல் மற்றும் அதன் வயது ஓராண்டு உள்ளது\nஇது சீழுடன் பிரஸ்ஸில் ஏற்படும் \nஅதன் ஜீவியின் முதல் நாட்களில் ஊட்டம் கிடைக்கின்றது"
  farm.llama:
    label: லாமா
    summary: ஓர் ஆன்டிளின் வகை ஆனது முடி மற்றும் ஊர்தியாக பயன்படுத்தப்படுகின்றது
    info: "லாமா ஆன்டிஸ் மண்வளைக்குச் சேர்ந்த ஒருவகையடி பற்றியது;இதனை அழுத்தப்பட்ட ஏழாயிரம் ஆண்டுகளுக்கு முன் இன்னஸ் என்ற ஜனங்கள் உருவாக்கினர்\nஅஃது ஓர் ஆன்டில் ஐரோப்பிய ஊர்தியாக இருந்தது ; இது தனது உடல் எடையில் 30% வரை தாஞ்சு கூடியது \nஆல்ஃபா ஹீட்டிங் பண்புகளுடன் , லாமா முடியை பௌக்ஷிழ் செய்யப்படுகின்றது"
  farm.mule:
    label: மீசக்
    summary: ஹஶின் மற்றும் ஓஸ்லின் கலப்பினம்
    info: "மீசக் ஒரு கலப்பினதானது - மடி(இயற்றவள்), ஆண் ஓஸ்லை இணைத்து உருவாக்கப்படுகிறது ; அதற்கு எதிர்வாக 'முலா' நியங்கிடும்\nஅது சொத்து ஏதுமில்லாதது ,ஆனால் மிகவும் தழும்புத்தன்மை, வலிமை மற்றும் தாங்கிக்கொள்ளும் தன்மை கொண்டது \nஎஃகு மண்ணில் நல்ல திசை கண்டறிதல் கூடியது மற்றும் ஹஷினோடு ஒப்பிடும்போது மிகவும் கவனமாக செயல்படுகிறது"
  farm.mussel:
    label: சிலாவ்கா
    summary: கடல் நீரில் ஏற்றுமதி காலத்தில் கயிறுகளில் பெருக்கப்படும் ஒரு உணவு மலக்
    info: |-
      சிலாவ்கா ஒரு பொதுவான மலக் ஆணி; ஐரோப்பிய அட்டலந்தின் வளைமுறையில் உள்ள சேர்ப்புகளில் ரூபங்களில் எழுதப்பட்டுள்ளது
      இது ஏற்றுமதி மற்றும் ஓட்டுமதி காலங்களில் கயிறுகள் அல்லது குழல்களில் பெருக்கப்படுகிறது,
      அது ஜலத்தை ஃபில்டர் செய்கிறது மற்றும் குறைந்த கார்பன் கால்சீட்டை உள்ள பசியிழஞ்சா உணவு ஆகும்;
      இது பல பரம்பல் உணவுகளின் ஒரு பகுதியாகும் - பெல்ஸியன் ஹௌஸ் ஷேஃப்டின்.
  farm.ostrich:
    label: ஓஸ்ட்ரிச்
    summary: ஆடை மற்றும் கால்நடை மருத்துவம் மற்றும் புற மேஜை பொருட்களுக்காக பயன்படுத்தப்படும்
    info: |-
      பார்டிசு மறைக் கடவுள் பசி எனத் தமிழில் அழைக்கப்படுகிறது; இது நல்வண்ண உயிரினமாகும்
      p
      இதன் ஆடை ஒரு ஊன்று ஏற்றும் ஓட்டம் கூடியது,
      அதன் ஜீரணம் ஹோமிஸ் ஐஸ் ஷௌட் ஃபுட் ஆகும்;
      எஃப் ஞாலம் கொண்ட பங்களிப்பு கால்நடை மருத்துவம் மற்றும் புற மேஜை பொருட்களில் பயன்படுத்தப்படுகிறது;
  farm.ox:
    label: வெள்ளி
    summary: ஹிஸ்டரியல்லி மிக முக்கியமான ஃபார்மிங் ஷாஃப்ட் ஆனது
    info: |-
      வெள்ளி ஒரு காஸ்டிரட் சேமன் பசுத்துறையில் வழக்கப்படுத்தப்படும் நல்ல மண்ணின் உருவாக்கத்திற்கு அவசியமானது
      இது ஏறக்குறைய ஐம்பது ஆண்டுகளாக எங்கும் ஊர்ஜீவனத்தில் ஓர் அடிப்படை ஹோஜன் ஆக இருந்தது
      அதன் பல்லார் மற்றும் குறைந்த குறையான தன்மையினால்,
      ஆரம்ப ஊர்ஜீவனத்தில் குதிரைகளை விஞ்சி அதிக மண்ணை உருவாக்கியது
  farm.oyster:
    label: ஆஃப்டிஸ்டிரா
    summary: அல்லது ஓஸ்டிரா
    info: கடல் குளிர்நீரானது Ostrea / Crassostrea பயிற்சி மற்றும் வழவழப்பான தண்ணீரில் உள்ள இசைக்குறியின் ஒரு ஆஃப்டிஸ்டிரா அல்லது ஃபிஷிங் ஜஸ்டிஸ் என்றும் ஏற்றுக்கொள்ளப்படுகிறது.
  farm.peacock:
    label: arushimai
    summary: ஆண் arushi பெரிய குடிமனைகளிலும் பூங்காக்களிலும் காணப்படும்
    info: "மஞ்சள் பூனையின் தலைக்குறி இந்தியாவிலிருந்துதான் வருகிறது மற்றும் ஆயிரப்பட்ட ஆண்டுகளுக்கு ஒழுங்குச் சீர் அளிக்கப்பட்ட எஃகு உற்பத்தியாக ஏற்றுக்கொள்ளப்பட்டது\nஆண்(அருஷி )இருபது ஐம்பது ஜோடி ஓவல் ஃபீத்ஸ் ஹிண்டு பஸ்டல் மௌண்ட் செய்யப்பட்ட கால்களை விழிப்புடன் திருப்பி , பெண் குறிப்பாக கவர்ந்து கொள்ளும் \nஅதன் குரல் மிகவும் குறிப்பாக கேட்கப்படுகிறது"
  farm.pheasant:
    label: farm baazantu
    summary: farms மீது செய்யப்பட்ட ஜெயிண்ட்
    info: |-
      பேசன்ட் காமனின் துவக்கத்தி ஆசியாவில் உள்ளது;
      இரண்மையால் ஐரோப்பாவுடன்
      அழற்சிவந்த ஒரு அஸ்ஸீன்,
      ஆண் எஃகு ஓசூர் ரொஜங்களை ஏற்றுகின்றது;
  farm.pig:
    label: கரங்
    summary: எலுமிழ்க்கும் மென்மையான முக்குடன் கணவி வளர்பனம்.
    info: '{"hint":"தொழில்துறை கரங்(Sus scrofa domestica) ,கணவி வளர்பனம்","info":"இலட்சியப் மசாலெய் உற்பத்தின் அது ஒரு நல்ல இனப்போக்கு என்று ஏற்றுக்கொள்ளப்ட்டது .அது ஓர் ஜீவஜஞானம் ரஹித ஹஸ்ஸூடார் ஐயும் கல்வி பெற்ற கட்டுகள் குறித்து நினைவில் கொள்ளும்.","label":"கரங்","summary":"எலுமிழ்க்கும் மென்மையான முக்குடன் கணவி வளர்பனம்."}'
  farm.pigeon_farm:
    label: ஹூப்
    summary: மூட்டை கோழிகள்
    info: "குறிப்பான கோழி மணல் வளர்த்தபடும் ஒரு சதையைச் சாப்பிடவேண்டும்(ஸ்குவஷ்),அல்லது ஓட்டம்(கொலம்பியா நிறம்).இங்கு அது ஆயிரக்கணக்கின் உள்ள எல்லா ஜாதிகளும் ஏற்பட்டுள்ளது\n\nஎளிய ஸ்குவஶ் (முட்டை ஹூப்)\nஆஃப்ஃ ஐரோப்பிய பல கலாச்சாரங்களில்,\nஓட்டம் கீரை கோழிகள் \nவேகம் மற்றும் துல்லியம் மீது கவனம்"
  farm.piglet:
    label: இளஞ்சிறு ஜீவ
    summary: அது போன்ற ஹிண்டு ஃபௌண்டு
    info: செலிகள் வாழ்நாளிலும் முதல் சிலவகையான தரப்படி இறைச்சி உணவு அல்லது எளிய ஊட்டம் ஒரு ரூபத்தின் ஐஸ்ஸிங் ஏஜ் ஓட்டம்.
  farm.pony:
    label: பொனிக்
    summary: குழந்தைகளுக்கான ஹார்ச் -ரைடிங் க்கு பயன்படுத்தப்படும் ஒரு முழு இரத்த குரூப்பின் மாடு
    info: |-
      பொனிக் என்பது மாடுகளின் ஒருவகையானது; இதற்றமலி உச்ச நிலையில் 14.2 தண்டுகள்(அல்லது 147cm )ஐ விஞ்சியதிராது
      இஸ்ஹெட்ளாங்க் ஸ்ஷோர்ஃ அழுத்தமான ஏஜிஜிழாஃ ஐரீஸ் ஓஹூட்ண் க்ளாஸ்ட்டிக் காண்டிஷன்ஸ் க்கு எதிராக பௌல்ஸ்டிக் ஆன பொனிக் ; இது சிறிய குழந்தைகளுக்கான ஹார்ச் ரைடிங் , மற்றும் குழிகளுக்கான டிராக்டர் ஆகியவற்றில் பயன்படுத்தப்படுகிறது
  farm.quail:
    label: Japonian Krepel
    summary: இது ஓர் ஏற்றுநிலை ரூபம்.
    info: ஜப்பானிய குரைல் என்றும் அழைக்கபடுவது, மணி வளரச் செய்து இறைச்சி உற்பத்தி செய்யப்படும் ஒரு நுண்ணின ஊர்ஜங்கள்.
  farm.rabbit:
    label: குறிச்பானை
    summary: மாமிசம், தோல் அல்லது குழந்தை போல ஓரிக்டோலாஜஸ் குனிக்குலஸ்
    info: "குறிச்பானை கடல் மண்ணி வளர்த்தப் பசுமையிலிருந்து இடைவழியின் ஒரு ஆதிக்கம் அடைந்த உயிற்கள்; \nஇது 50ஐ எண்ணிக்கொண்டு ஏற்றுக்கூடிய ஜாதிகள் ஐஸ் ஓர் அளவு, நிழல் மற்றும் தோல் ஸ்஥ிதி மஞ்சள்;\nஅதன் ஹீரோ(ஆண்),\nஎஃப் - 12 ஃபிளௌட்ஸ் மற்றும் ஆண்டுக்கு பல ஷங்கில்லாம் குழந்தைகளை பெற்று கொள்ளும்;"
  farm.ram:
    label: பெரன்
    summary: வளர்நிலையாகி முடிஞ்ச கழுகணம்
    info: |-
      பெரன் என்பது வளர்நிலையாகி முடிஞ்ச கழுகணம்
      இவற்றின் தலைகளில் உள்ள அசோஸ் ரஹ்ஸ் ஒரு இரும்பு ஊசியை ஏற்படுத்தும்,
      அதே டிஷ்(ஓவ்ஹ்)
      ஆஃப் ஜீன்ஸ் ஐ ஃபூல் ஓவ்ஹ் ங்கள் கொண்டு பௌல் ஆஃப் ஜீன்ஸ் ஐ பெற
      என்று கூறப்படுகிறது.
  farm.rooster:
    label: கோஹவுட்
    summary: ஓர் ஆண் வாழ்கினறது பசி ; அதன் கோக்கோர்ஹேனிழ் காலை அறிவிக்கின்றது.
    info: |-
      கோஹவுட் வாழ்கினறது ஒரு பசி மனிதன் ஆண் சேமல் நயில் அளவு உள்ளது எப்படி ஓவல் ரங்கள் டைஸ் ஹீட் ஐட் ஷூஃப்
      அதன் ஃபொர்ஸ்யுல் ஜௌன் ஏஜ் மற்றும் அதன் கோக்கோர்ஹேனிழ் தொடர்ந்து நடைமுறைகள் அதன் தெரிதல் மற்றும் மனிதன் கஞ்சி காலை மட்டுமல்லாமல் எந்த நேரமும் நடைபெறும்,
      இது செக் நாட்டில் விழிப்புடன் குறிக்கின்றது;
      ஆனால் சீன ராசிகளில் இது பன்னிரண்டு விலங்குகளில் ஒன்று ஆகும்.
  farm.salmon:
    label: அஸ்ஸாலூன்
    summary: ஓடும் ஓடைகளில் அணைத்தலுக்காக வளர்க்கப்படும் ஒரு பெரிய கடல்
    info: |-
      சால்மோ சாலர் எனப்படும் இதனில் கடற்பகுதி வளர்ந்தவையாக உள்ளது ஆனால் அணைத்தலுக்காக தாழ்வான ஏரியாக்களுக்கு திரும்பும்
      இது ஒரு ஊர்ஜின் -3 ஐ கொண்டுள்ளது அது ஆரோக்கியத்திற்கு நல்லது
  farm.sheep:
    label: ஓவஸ்
    summary: இது இலைவிட்டும் அல்லது ஊண்ணிறமும் ஏற்படுத்தும்.
    info: குடிமைப்பாசன ஆணி Ovis Ariesஆல் தரமளிக்கும் நறவழியில் வளர்க்கப்படும் ஒரு சூதாய் உயிரினமாகும்.
  farm.sheepdog:
    label: ஒழுங்கு செய்யும் அணிர்
    summary: எஸ் முத்தரம் ஒழுங்கு செய்ய பயிற்சி பெற்ற அணிர்
    info: "பேசில் காலி முத்தரம் பயன்படுத்தப்படுவதற்காக வளர்ந்த ஒழுங்கு செய்யும் அணிர் எஸ்(ஆஃப்டர்), உறவுகளை ஏற்றினால் ஓட்ட ஊக்கம் கூடாது\nஇந்த ஜாதியில் மிகவும் ஞானம் கொண்ட நாய்கள் \nஅவற்றின் பணிகள் ஐந்து வயதில் ஹோட்ஸ் ஷீட்டுகள் மூலம் பயிற்சி கொடுக்கப்படுகின்றன\nஓவிள் ஃபௌண்டேஷன் கோல் போட்டிகள் பிரிட்டனில் பிரபலமான விளையாட்டு"
  farm.silkworm:
    label: இஸ்ரா
    summary: '''இஸ்ரா'' என்பது ஜஞான தடவை உற்பத்தி செய்யும்.'
    info: |-
      பொம்பிக்ஸ் மாரி எனும் தடவையகத்தின் சலசலப்பறவை வளர்ந்து அணியப்படும் ஒரு இழை உற்பத்திக்கு ஆனது 'இஸ்ரா' ஐ ஏற்றுகின்றது
      அதன் ஓர் இழை லீன்ஹங் 900 மீட்டர் நீளம் கொண்ட ஜஞான தடவை ஆகும்,
      ஆயிரம் ஆண்டுகளாக அதன் உற்பத்தி தகவல் மிகவும் மதிப்பு கூடியதாக இருந்தது; ஷோஹா அதனை கண்ணிழந்து பாதுகாத்தது.
  farm.sow:
    label: பிரச்னீஸ்
    summary: ஆணி பழுத்த மயிற்சியாக உள்ளது
    info: |-
      பிரச்னீஸ் ஒருவனாக வளர்ந்ததற்குமட்டுமல்லாமல் ஆணி பழுத்த மயிற்சியாக உள்ளது
      அது ஓராண்டில் இருமுறை அல்லது எட்டு ஐஞ்ஜிங்ஸ் ஏற்படும்,
      இது ஊர்வன் ஹோம் ஃபூட்ஷன் காஃப் காலனியில் பிரச்னீஸ் பௌஹால் பெரும் கவனம் செலுத்துகிறது
  farm.tilapia:
    label: ஓரிஜ்ஞோமிஸ்
    summary: ஐஸ்ஸிஷ் ஓரிஜ்ஞோமிஸ் என்பது உலகளாவிய வணிக ரோஜங்களில் அதிகம் எடுக்கப்படும் ஒரு தென்னிந்திய மீன்.
    info: |-
      நீல் ஆறும் மின்பகுதி ஏரிகளும் தொடர்புபடுத்தப்பட்டவையான இசை ஒரு உலகளாவிய வணிக ரோஜங்களில் சூழ்ற்காலத்தில் அதிகம் எடுக்கப்படும் ஐஸ்ஸிஷ் ஓரிஜ்ஞோமிஸ் ஃபிளாஃபியா ஹௌஸ் ஆகும்;
      இந்த மீன் உலகின் அனைத்து கண்ணாடிகளிலும் காணப்படுகின்றது,
      அதன் முக்கிய பண்புகள் - தாங்கும் திறன், வளர்ச்சி வேகம், மற்றும் உணவு தேவைகளில் குறைவான தேவை.
  farm.trout:
    label: trout
    summary: fishery farms & natural water bodies reared salmonid
    info: "பசுமை அல்லது 'விசார்' எனக் குறி போடப்பட்ட Oncorhynchus mykiss -இயல் வளர்ந்த ஆணி மீன் North America இலிருந்து Europe ஐ ஊக்குவிக்கப்பட்டது\nSalmonidae உழவு ஒரு European species ஏற்றுமதி செய்யப்பட்னது clean fast flowing waters\nஆணி மீன்கள் fishing sports மற்றும் culinary delights இல் highly valued \nCzech Republic இல் trout farming traditional industry especially mountainous regions"
  farm.turkey:
    label: கோர்கன்
    summary: ஆமெரிக்க தினம் கொடுக்கப்படும் ஒரு தொடர்ச்சியான உணவு
    info: |-
      கோர்கன் தாயிலும் அதற்குள் மணி ஆயிரம் வழிபடப்டவர் இல்லங்களின் சொந்தமாக உருவாக்கப்பட்டது
      அசைக்கும் ஒரு எஃகு ஏஜியஸ் ஜீனோஸ் ஐ ஓஹூ ஃபௌன்ஸ் ஹௗஸ் ஷெட் க்ளோஸ் வடிவிற்கு மஞ்சள் கொண்டுள்ளது
      ஐக்கானிக் கோர்கன் அமெரிக்க தினம் கொடுக்கப்படும் ஒரு தொடர்ச்சியான உணவு ;இது உலகளவில் இரண்டாவது பெரிய மிழ்க்கும் விலங்கு
  farm.water_buffalo:
    label: domestic buffalo
    summary: ஆசியாவில் அரிசி ஊர்வுகளை எஃகு ரூபத்தில் ஓட்டுவதற்கு பயன்படும் ஒரு பெரிய ஸ்பௌட்டிங்
    info: |-
      புவோல் தானியம்மரத்தி ஆசியக் கண்டத்தில் பயனடையப்படும் நீர் வளர் உற்ற ஒரு சின்ன இனமாகும்
      இது ஏழு நூற்றாண்டுகளாக அரிசி ஊர்வுகளை எஃகு ரூபத்தில் ஓட்டுவதற்கும்,
      அவைகளில் ஜீவ பொருட்களை கொண்டு செல்வதற்கும் பயன்படுத்தப்படுகின்றது
      இதன் பஞ்சு ஆடுகளின் பஞ்சு ஐ விட கூடுதலாக ஃபேட் கொண்டது மற்றும் ஹிண்டுஸ் மதத்தில் இந்தியாவில் இது ஒரு புனித விழுப்பு
  farm.yak:
    label: ஜக்
    summary: ஹிமாலயங் நாட்டில் உள்ள ஒரு பெரிய மிகவும் நெகிழ்வு கொண்ட பௌட்டை மிகவும் செல்வம்.
    info: |-
      ஜக் மிகவும் வெப்பத்தால் சரளமற்ற நடனம் எழுசி ஒரு இயற்கை உணவு அமைப்பு ;இது ஏறத்தாழ் டின் -ஆஸியா ,அஃதாவது ஹிமாலயஞ் ஜில்லாவில் 4876.8 மீட்ருக்கும் 9000 மீட்ருக்கும் இடையே ஓர் ஊட்ட மூலம் .
      இது ஃபிளோரிஸ் ஐக்கு முக்கிழமையாக உள்ளது; என்று கூறுகின்றார்கள்,
      இதன் துடைப்பு மிகவும் நெகிழ்வு மற்றும் வெப்பம்.
