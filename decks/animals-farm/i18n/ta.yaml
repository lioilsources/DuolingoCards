lang: ta
pivot: false
title: வணிக வளையங்கள்
cards:
  farm.chicken:
    label: கோழி
    summary: முட்டை பொரிக்கும் வளர்ப்புப் பறவை.
    info: தானியங்கள் உலகில் மிகவும் பரவலாக இருக்கும் நாயக்குளிர் தருணம். அது முட்டைகளை செலுத்துகிறது மற்றும் எச்சிலுக்காக வளர்க்கப்படுகின்றது; 25 பில்லியன் ஐ ஒரு குறிப்பாக ஏற்றுக்கொள்ளப்படுகின்றது.
  farm.cow:
    label: கால்நடை
    summary: மில்க் தரும் பெரிய வளர்ப்பு மிருதுவான உயிரி.
    info: இந்த கால்நடை பசிரின் சேறு அல்லது மாமிசப் பண்டங்களை உற்பத்தி செய்வதற்காக வளர்க்கப்படுகிறது. உலகம் முழுவதும் உணவின் ஒரு முக்கிய ஆதாரம்.
  farm.donkey:
    label: ஓசல்
    summary: நம்பகமான கால்செலவில் வழி தேடும் ஒரு முறையான உள்ளது.
    info: ஓசல் அப்ரிக்க வன்னோஸலை வளர்க்கப்பட்ட ஒரு வகை ஆகும், நூற்றாண்டுகளாக ஓசல் ஒரு பணியாற்றும் விலங்காக பயன்படுத்தப்படுகிறது. இது எதிர்ப்பு மிக்கது, நம்பகமானது மற்றும் கடினமான ஏற்றுதலை தாங்கும்.
  farm.duck:
    label: காட்டு கொம்பன்
    summary: சில வளர்த்து மற்றும் இணைப்புகளை உற்பத்தி செய்யும் நீரின் ஒரு பறவை.
    info: காட்டு கொம்பன் என்பது அதன் மாமிசம் மற்றும் முட்டைகளுக்காக வளர்க்கப்படும் ஒரு பறவை ஆகும். கால்களில் உள்ள நீர்மூழ்கி மற்றும் குரலில் குறிப்பிட்ட ஓசை காரணமாக நன்றாக நீந்த முடிகிறது.
  farm.goat:
    label: கோழி
    summary: முட்டை சாப்பிடத் தரும் கணுவுள்ள வேளாண் நாயகன்.
    info: இல்லற கோழியை மின், மாமிசம் மற்றும் ஆடைக்கு உற்பத்தி செய்ய பயன்படுத்தப்படுகிறது. அது ஒரு ஏற்புடைய விலங்கு என்றும், வளர்ச்சியில்லாத பகுதிகளில் வாழ முடியும்.
  farm.horse:
    label: குதிரை
    summary: சவாரி மற்றும் வேலைக்குப் பயன்படும் ஒரு சக்தியான நிலை வளர்ப்பு விலங்கு.
    info: ஆயிரக்கணக்கான ஆண்டுகளாக குதிரைகள் போக்குவரத்து, வீட்டு உழவு மற்றும் போரில் அவசியமாகப் பயன்படுத்தப்பட்டுள்ளன. இன்று விளையாட்டு மற்றும் ஓய்வெடுப்பதற்காகவும் அவற்றை வளர்க்கின்றனர்.
  farm.pig:
    label: பிரசே
    summary: மஞ்சள் நிற குரல் மற்படையுடன் உள்ள வீட்டு விலங்கு.
    info: தொழில்துறையில் பண்ணைகளில் ஆடுவினை அதிகம் பயன்படுத்தி மாமிசம் உற்பத்தி செய்யப்படுகிறது. இவை எல்லா உணவுகளையும் ஏற்று சிக்கலான பணிகளை நினைவில் கொள்ளும்.
  farm.sheep:
    label: கழுதை
    summary: மின்ம கால்நடையில் இருப்பவை தரி உற்பத்தி செய்வது.
    info: ஓவிஸ் அரியஸ் என்ற கழுதை தரி, பால் மற்றும் மாமிசத்திற்காக வளர்க்கப்படுகிறது. இவை ஒருசோட்டை ஏற்றிக் கொண்டு வாழ்கின்றன மற்றும் வரலாற்றில் முதலில் வளர்க்கப்பட்ட கால்நடைகளில் ஒன்றாகும்.
