lang: vi
pivot: false
title: Động vật chăn nuôi
cards:
  farm.chicken:
    label: gà
    summary: Chim gia cầm đẻ trứng.
    info: Gà nhà là loài chim nuôi phổ biến nhất trên thế giới. Nó được nuôi để lấy thịt và trứng; hiện có hơn 25 tỷ con.
  farm.cow:
    label: bò
    summary: Động vật nông nghiệp lớn cho sữa.
    info: Bò nhà được nuôi để lấy sữa và thịt. Đây là một trong những nguồn thực phẩm quan trọng trên toàn thế giới; bò cái có thể sản xuất từ 20 đến 30 lít sữa mỗi ngày.
  farm.donkey:
    label: con lừa
    summary: Động vật làm việc chăm chỉ với bước đi chắc chắn.
    info: Lừa nhà là loài lừa hoang dã châu Phi được thuần hóa, đã được sử dụng hàng thế kỷ như một con vật kéo. Nó bền bỉ, đáng tin cậy và có khả năng mang những gánh nặng.
  farm.duck:
    label: con vịt
    summary: Chim nước có mỏ bẹp được nuôi trên trang trại.
    info: Con vịt nhà là loài gia cầm được nuôi để lấy thịt và trứng. Nó biết bơi tốt nhờ những màng giữa các ngón chân và phát ra âm thanh đặc trưng 'quạc quạc'.
  farm.goat:
    label: dê
    summary: Động vật nông nghiệp có sừng cho sữa ngon.
    info: Dê nhà được nuôi để lấy sữa, thịt và len. Chúng thích nghi tốt và có thể sống sót trong nhiều loại thảm thực vật khác nhau, kể cả các khu vực khô hạn.
  farm.horse:
    label: ngựa
    summary: Động vật nông nghiệp khỏe mạnh được sử dụng để cưỡi và lao động.
    info: Ngựa đã là loài vật không thể thiếu trong giao thông vận tải, nông nghiệp và chiến tranh suốt hàng nghìn năm. Ngày nay ngựa cũng được nuôi dưỡng cho mục đích thể thao và giải trí.
  farm.pig:
    label: lợn
    summary: Động vật nông nghiệp màu hồng có mõm sụn.
    info: Lợn nhà là một loài động vật nuôi thông minh được nuôi để lấy thịt. Nó ăn tạp và có khả năng ghi nhớ các nhiệm vụ phức tạp.
  farm.sheep:
    label: cừu
    summary: Động vật nuôi lông cho len và sữa.
    info: Cừu được nuôi để lấy len, sữa và thịt. Chúng sống thành đàn và là một trong những loài động vật đầu tiên bị thuần hóa trong lịch sử.
