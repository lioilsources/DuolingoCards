lang: ru
pivot: false
title: Хозяйственные животные
cards:
  farm.chicken:
    label: курица
    summary: Домашняя птица, несущая яйца.
    info: Курица домашняя – самый распространённый вид птиц в мире. Она откладывает яйца и разводится ради мяса; существует более чем 25 миллиардов особей.
  farm.cow:
    label: корова
    summary: Домашнее животное, дающее молоко.
    info: Коровы держатся на фермах для получения молока и мяса. Это один из ключевых источников пищи во всем мире; одна корова может давать до 20–30 литров молока в день.
  farm.donkey:
    label: осёл
    summary: Ушастое работящее животное со стабильной походкой.
    info: Домашний осёл — это одомашненный африканский дикий осёл, который веками используется как рабочее животное. Он выносливый, надежный и способен нести тяжелые грузы.
  farm.duck:
    label: утка
    summary: Водоплавающая птица с широким клювом, разводимая на фермах.
    info: Домашняя утка выращивается ради мяса и яиц. Она хорошо плавает благодаря перепонкам между пальцами и издаёт характерное кудахтанье.
  farm.goat:
    label: коза
    summary: Домашнее животное с рогами, дающее вкусное молоко.
    info: Домашняя коза разводится для получения молока, мяса и шерсти. Она приспособлена к жизни в разных условиях, включая засушливые регионы.
  farm.horse:
    label: лошадь
    summary: Сильное сельскохозяйственное животное для езды и работы.
    info: Домашняя лошадь на протяжении тысячелетий была необходима для перевозок, земледелия и боя. Сегодня её разводят также ради спорта и отдыха.
  farm.pig:
    label: свинья
    summary: Розовое домашнее животное с хрящеватым рылом.
    info: Домашняя свинья – это умное сельскохозяйственное животное, разводимое ради мяса. Оно всеядное и способно запомнить сложные задачи.
  farm.sheep:
    label: овца
    summary: Шерстистое сельскохозяйственное животное, дающее шерсть и молоко.
    info: Домашняя овца разводится для получения шерсти, молока и мяса. Она живет стадами и является одним из первых одомашенных животных в истории.
