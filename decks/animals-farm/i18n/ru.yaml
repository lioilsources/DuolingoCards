lang: ru
pivot: false
title: Хозяйственные животные
cards:
  farm.alpaca:
    label: альпака
    summary: Меньший родственный вид животного, выращиваемый для получения тонкой шерсти.
    info: Альпака - меньший родственник ламы, одомашненный в высокогорных Андах.
  farm.barn_cat:
    label: фармацевтическая кошка
    summary: домашнее животное содержимое на ферме чтобы уничтожить грызуны
    info: '{"hint":"кошка держится на ферме для борьбы с грызунами","info":"Фермерская кошка - это домашняя кошка живущая в аграрной среде где она охотиться за мышами и крысами\nОна защищает запасы корма и злаков от грызунов\nОбычно менее социализированная чем комнатные кошки\nВ истории кошек почитали во многих культурах особенно в Египте изза их способности защищать запасы","label":"фермерская кошка","summary":"Домашняя кошка выращенная на ранчете как хищник против грызунов."}'
  farm.beehive:
    label: пчелоферма
    summary: Деревянная конструкция служит как искусственно построенное место обитания медоносной пчеле.
    info: В улье находится колония пчел - искусственное жилище для медоносных пчёл вместо деревянного гнезда диких пчелиных маток.
  farm.boar:
    label: канец
    summary: Дикий или одомашненный самец свиньи.
    info: Канец - это необрезанный самец домашнего или дикого свиньи. На фермах канцы разводятся для воспроизводства потомства; их сперму используют при искусственном осеменении.
  farm.calf:
    label: телёнок
    summary: Молодой бычок менее чем один год.
    info: Телёнок - это молодняк крупного рогатого скота от рождения до приёма на пастбище или в возрасте одного года. Новорождённый телят быстро поднимается на ноги; инстинкт матери сильен. Телята выращиваемые для производства молока рано разлучаются со своей матерью. Мясо телят используется как деликатес во многих европейских кухнях.
  farm.carp:
    label: капр
    summary: Большая пресковенная рыба; традиционный новогодний продукт питания в Чехии.
    info: '{"hint":"\u4f59 \u6d77 \ufffd","info": "Капр обыкновенный - крупная пресноводная рыба, которая разводится в прудах и традиционно ассоциируется с чешскими рождественскими праздниками. Он был одомашнен на средневековых территориях Европы особенно во время эпохи Чехии (Требонские рыбные хозяйства). Кормление у капра всеядное характера, он быстро растет до массы сверху 30 кг. Требонские рыбные хозяйства являются одним из самых больших систем рыбоводных хозяйств в Европе."}'
  farm.chicken:
    label: курица
    summary: Домашняя птица, несущая яйца.
    info: Курица домашняя – самый распространённый вид птиц в мире. Она откладывает яйца и разводится ради мяса; существует более чем 25 миллиардов особей.
  farm.cow:
    label: корова
    summary: Домашнее животное, дающее молоко.
    info: Коровы держатся на фермах для получения молока и мяса. Это один из ключевых источников пищи во всем мире; одна корова может давать до 20–30 литров молока в день.
  farm.deer:
    label: фермерский лось
    summary: Фармовый ягельный жир используется как альтернатива говядине.
    info: Данька или олень в Чехии разводятся на фермах и ранчо для получения мяса дичи.
  farm.donkey:
    label: осёл
    summary: Ушастое работящее животное со стабильной походкой.
    info: Домашний осёл — это одомашненный африканский дикий осёл, который веками используется как рабочее животное. Он выносливый, надежный и способен нести тяжелые грузы.
  farm.duck:
    label: утка
    summary: Водоплавающая птица с широким клювом, разводимая на фермах.
    info: Домашняя утка выращивается ради мяса и яиц. Она хорошо плавает благодаря перепонкам между пальцами и издаёт характерное кудахтанье.
  farm.emu:
    label: фермы с эму
    summary: Фармоэму выращивают ради масла, мясо и кожи.
    info: Эму разводят в Австралии на фермах для получения мяса и кожевенного жира эму (используемого в косметике). Жир из тела эмусов обладает противовоспалительными свойствами и используется как в современной так и в традиционной медицине.
  farm.farm_shrimp:
    label: ферма с креветками
    summary: Мировая индустрия рыбной ловли использует белую тихоокеанскую креветку наиболее часто.
    info: Белокурая тихоокеанская креветка - это самый популярный вид креветки во всем мире для разведения в прудах на побережье и используется как пища. Фармы расположены главным образом в Юго-Восточной Азии и Латинской Америке. Интенсивное выращивание этих раков стало предметом дискуссионных споров из-за влияния на мангровые заросли.
  farm.foal:
    label: жеребёнок
    summary: Молодая лошадь менее чем один год стара; новорожденные могут стоять уже через несколько часов.
    info: Отеленка - это молодой жеребец в возрасте до одного года жизни. В течение первых часов после рождения он поднимается на ноги и начинает пить молоко матери.
  farm.freshwater_crayfish:
    label: рак река
    summary: Пресноводный рак домашний.
    info: Рак речной был широко распространен в Чехии, но почти вымер из-за эпидемий и загрязнения воды.
  farm.garden_snail:
    label: садовый улиток
    summary: Крупные сухоземные моллюски едят в качестве блюд эскараго
    info: |-
      Садовый улиток - самый крупный наземной моллюск Европы
      Он является ценным французским деликатесом под названием эскаргот,
      Зимой он прячется и закрывается пленкой раковины (гипернациум)
      Его разведение происходит во Франции Италии и других странах
  farm.goat:
    label: коза
    summary: Домашнее животное с рогами, дающее вкусное молоко.
    info: Домашняя коза разводится для получения молока, мяса и шерсти. Она приспособлена к жизни в разных условиях, включая засушливые регионы.
  farm.goat_dairy:
    label: кормящаяся домашняя коза
    summary: Коза выращенная для получения молока используемого при изготовлении сырой продукции.
    info: Домашняя коза была одомашнена более чем 10 тысяч лет назад и является одним из самых распространённых сельскохозяйственных животных. Козье молоко богато питательными веществами и легче усваивается по сравнению со коровьим; подходит людям с непереносимостью лактозы. Из козьего молока производят знаменитые сыры такие как Чеврэ, Фета или Халуми.
  farm.goose:
    label: домашний гусь
    summary: Большая доместикованная куревая птица выращивается для получения мяса, перьевого покрова и перья
    info: Домашняя гусь происходит от диких гусей более чем три тысячи лет назад. Это было одним из первых одомашенных животных; в Риме патрулировали Капитолийские гусята. Ценится за мясную массу и мясо убоя, а также за печень гуса (фош грэс)
  farm.guinea_fowl:
    label: Голосящий
    summary: Птица африканского происхождения выращивается ради мясной продукции и защиты от змей.
    info: '{"hint":"голова с каской пердитица содержится на фермах для борьбы с вредителями (Numida meleagris)","info":"Перлика головная происходит из Африки, где она дикая и живет во фламбируемых лугах\nНа ферме ценят как естественного сторожевого пса; своим громким кудырянием он предупреждает о змее, хищниках или неизвестных людях\nУ него характерное белое пятно серых оперений и красный - голубая безперьевая голова\nЕе мясо вкусовое похоже на мясную птицу","label":"пеликан","summary":"Аfricanская птица разводится за мясо и служит стражем от ядов."}'
  farm.guinea_pig_farm:
    label: морское животное
    summary: Морские грызуны разводятся для получения мясо в Латиноамерике или содержаться дома.
    info: Домашнее морская свинка происходит из Анд и была одомашнена инками более чем три тысячи лет назад как источник мяса.
  farm.highland_cattle:
    label: скот Шетланда
    summary: Скотоводство с длинной красноватой шерстью и мощными рогами.
    info: Шотландский Хайленд - старое порода скота, выведенная в суровых условиях шотландских горных районов.
  farm.horse:
    label: лошадь
    summary: Сильное сельскохозяйственное животное для езды и работы.
    info: Домашняя лошадь на протяжении тысячелетий была необходима для перевозок, земледелия и боя. Сегодня её разводят также ради спорта и отдыха.
  farm.lamb:
    label: ягнёнок
    summary: Молодое животное от стада в возрасте менее чем год.
    info: Ягненок - это молодая овца до одного года жизни.
  farm.llama:
    label: ламина
    summary: Южноамериканская млекопитающая лошадь, разводимая для получения шерсти и как транспортное средство.
    info: Лама - домашний животный южноамериканский верблюдоподобный вид, который инки одомашнили более чем за пять тысяч лет назад.
  farm.mule:
    label: мул
    summary: Бесполое потомство от коня и осле со впечатляющей силой.
    info: Мул - это гибрид лошади и осла; обратный скрещенный называется мерином. Он бесплоден, но очень выносливый, сильный и устойчив к воздействиям внешней среды.
  farm.mussel:
    label: '"славка"'
    summary: '"Съедобная морская раковина, которая разводится на линиях в присутствии морской воды.'
    info: '{"hint":"съедобный двустворчатый моллюск разводимый на веревках в соленой воде (Mytilus edulis)","info":"Мидии - это распространенный вид устриц, выращиваемых фермерами по всему атлантическому побережью Европы."\nРазведение происходит на линях или кольцах во время прилива и отлива. \nОни очищают воду и являются экологически чистым продуктом питания со слабо выраженной углеродной статистикой. \nИспользуются как компонент многих традиционных блюд таких как "муссоны-фриты", популярные в Бельгии.'
  farm.ostrich:
    label: фермерский страуc
    summary: страус выращенный за мясо перо и кожу
    info: Странствующий пингвин - самый быстрый двуногий зверь и его разводят на фермах ради мяса кожевенной кожи перьев Мясо страуса красное как говядина но с меньшим содержанием жира и холестрина Кожа страусины ценится в производстве люксового кошелька Перья страусин используются традиционно для украшения шляпок и болидов
  farm.ox:
    label: вол
    summary: Кастрированная корова исторически важное тянущееся животное
    info: |-
      Вол - это кастрированный самец домашнего скота, прирученный для работы на полях и в хозяйстве
      Был основным тягловым животным сельского хозяйства во всем мире многие века,
      Из-за своей силы характера он обрабатывал больше земли чем лошади в раннем периоде развития аграрного производства
  farm.oyster:
    label: фермерская устрица
    summary: Выращиваемый морской двустворчатый моллюск с использованием линий и сеток.
    info: Моллюск выращивается в прибрежных водах на веревках или клетях и достигает зрелости за три до пяти лет. Он фильтрует воду и помогает очистке морских экосистем.
  farm.peacock:
    label: Петух домашний
    summary: Полоумки держаться на ферме или в саду исключительно по причине их внешнего вида.
    info: '{"hint":"самец пава с радужным хвостом; часто содержится на виллах и усадьбах (Pavo cristatus)","info":"Синий павиан происходит из Индии и был одомашнен тысячи лет назад как декоративная птица\nМальчик разворачивает более чем 150 украшенных перьев во внушительный веер для привлечения самок\nЕго крик очень громкий и резкий\nВ Индии павиан является государственной птицей и символом красоты","label":"петух домашний","summary":"Полоумка выращивается на фермах и парках ради эстетики."}'
  farm.pheasant:
    label: фермерский барабан
    summary: Разведение барана на ферме с последующей его добычёй.
    info: Барабол обыкновенный в Чехии разводится на фермах и регулярно выпускается обратно природе для охоты. Его родина - Азия; он был завезён в Европу римлянами.
  farm.pig:
    label: свинья
    summary: Розовое домашнее животное с хрящеватым рылом.
    info: Домашняя свинья – это умное сельскохозяйственное животное, разводимое ради мяса. Оно всеядное и способно запомнить сложные задачи.
  farm.pigeon_farm:
    label: доместикованная птица
    summary: Голуби разводятся для мяса или гонок.
    info: Домашняя голубка - это одичавший скальный голубь; благодаря селекции возникли сотни пород.
  farm.piglet:
    label: сель
    summary: Детеныши свиней обычно имеют красноватый цвет кожи
    info: Селенок - это детёныш домашней свиньи в первые недели жизни. Недавно родившиеся селёнки очень маленькие и быстро растут. Самка поросёнка производит от десяти до двенадцати потомков за один размножительный период.
  farm.pony:
    label: пони
    summary: Маленькое полноценное коневодство любимое для езды детей.
    info: Пони - это маленькая порода лошадей высотой не более чем на 14 руки и два пальца в холке (около 147 см). Шетлендское пони самая мелкая из них происходит с шотландских островов Шетландах. Это прочные животные устойчивые к суровым условиям.
  farm.quail:
    label: Крепелка
    summary: Маленький птиц фармово разводимый для яйц
    info: |-
      {"hint":"маленькая домашняя куропатка выращенная для яиц и мяса (Coturnix japonica)","info":"Японская куропатка - это одомашненный вид птицы интенсивно разводимый ради получения яйцах и мясо.Оле пикмайжет яйца за ден;они являются делицейностью в многих куx
      Вызреливается быстро и уже в шести неделях начинает нестись.
      Разведение их также как поющих птиц в Японии,куда есть продолжающаяся традиция.
  farm.rabbit:
    label: кролик
    summary: Домашний заяц выращивается для мяса или меха либо как домашнее животное.
    info: Домашняя крольчиха была одомашнена в Средневековье из дикого европейского зайца и имеет более чем пятьдесят признанных пород различной величины, окраски и типа шерсти.
  farm.ram:
    label: беран
    summary: Взрослый мужской бараний скот со значимыми спирализованными рогами.
    info: Беран - это взрослый самец домашней овцы с выразительными спиралевидно закрученными рогами, которых нет у самок или они имеют их в очень маленьких размерах.
  farm.rooster:
    label: петух
    summary: Самка домашнего цыплёнка; своим кудахтаньем объявляет о начале светового времени.
    info: "{\"hint\":\"взрослый петух с ярким гребнем и хохолком (Gallus gallus domesticus)\",\"info\":\"Петушок - это самец домашней курицы, его можно узнать по окраске перьевания, гребню и хохотку.\r\nКокошение является способом территориального поведения и происходит не только на рассвете, но в любое время дня или ночи.\r\nВ Чехии петух символизирует бдительность;\r\nа в Китае он один из двенадцати животных гороскопов.\r\nДревние греки приносили ему жертвы Асклепию как символ нового утра.\"}"
  farm.salmon:
    label: форель
    summary: Большая пресноводно-морская рыба, которая приходит в реки для нерестины; часто содержится на рыбных фермах.
    info: Обыкновенная форель – анадромная рыба; вырастает в океане и для нереста возвращается к родным рекам. Способность находить свою родную речку основана на магнитном поле Земли и обонянии. В Норвегии и Шотландии разведение фармовой форели является одним из крупнейших направлений аквафarminga.
  farm.sheep:
    label: овца
    summary: Шерстистое сельскохозяйственное животное, дающее шерсть и молоко.
    info: Домашняя овца разводится для получения шерсти, молока и мяса. Она живет стадами и является одним из первых одомашенных животных в истории.
  farm.sheepdog:
    label: Пастушья Собака
    summary: Специально обученная собака управляет и защищает овечье стадо.
    info: Бордер коли используется в качестве пастушьей собаки для управления стадом на ферме с помощью взгляда и тихого голоса команды. Это одна из самых умных пород собак; их рабочие способности передаются по наследству и должны быть развитыми через тренировку еще щенками.
  farm.silkworm:
    label: борец муравьиного
    summary: Гусеницы бороц мурашевского производящие натуральный шёлк.
    info: Бомбик моруховый - это гусеница бабочки Бомбикус Мори, которая была одомашнена в Китае более чем за пять тысяч лет назад. Его кокон состоит из одного нитя длиной свыше девятисот метров и является источником натурального шелка.
  farm.sow:
    label: свиноматка
    summary: Взрослое животное женского пола, мать поросенков
    info: |-
      Свиноматка - это взрослая самка домашней свиньи
      Она может приносить потомство дважды в год и обычно рождает от десяти до четырнадцати поросят за раз
      Интенсивное содержание свиноматок является спорным вопросом современного земледелия из-за условий их жизни в клетках
  farm.tilapia:
    label: тиляпия
    summary: Тропическая пресноводная рыба массово разводимая по всему миру.
    info: Нилская тиляпия - одна из самых распространенных выращиваемых рыб в мире; ежегодно производятся миллионы тонн этой рыбы.
  farm.trout:
    label: окунь
    summary: Рыбка лосообразная выращивается как на рыбоводческих фермах так и во свободном водоёме.
    info: Окунь радужный происходит из Северной Америки и был введён в Европу как рыба для фермирования. Окунь речной – это оригинальное европейское видовое обитание чистых быстро текущих водных систем. Оба являются ценными спортивноыми и кухонными рыбами. В Чехии разведение окуни является традиционной отраслью особенно на горных территориях.
  farm.turkey:
    label: индейка
    summary: Большая домашняя птица выращивается для мяса, символ американского праздника Благодарения
    info: |-
      Домашний индейка происходит из Мексики и была одомахчена ацтеками более чем две тысячи лет назад
      Самцы имеют характерный нарост у головы и могут расправить хвостовые перья в виде веера
      В США это традиционное блюдо к Дню благодарности; по всему миру он является вторым наиболее распространённым домашним птичьим животным
  farm.water_buffalo:
    label: домашний буйвол
    summary: Большой азиатский говядий скот, используемый для транспортировки рисовых полей.
    info: Домашний буйвол - это одомашненная форма водного быка и основное сельскохозяйственное животное Азии.
  farm.yak:
    label: як
    summary: Большой длиннохвостый бычок тибертского плато обеспечивает молоко и мясо.
    info: Как домашний вид это одомашненная форма яка живущего на Тибетской нагорной плоскости в высоте от 3 000 до 5 500 метров.
