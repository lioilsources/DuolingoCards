lang: ja
pivot: false
title: 家畜
cards:
  farm.chicken:
    label: ニワトリ
    summary: 卵を産む家禽。
    info: ニワトリは世界で最も広く飼育されている家禽です。卵と肉のために飼われており、250億羽以上が存在しています。
  farm.cow:
    label: 牛
    summary: 乳を供給する大型の家畜。
    info: 家牛は乳と肉のために農場で飼育されています。世界中における主要な食料源の一つであり、一頭の乳牛が毎日20～30リットルもの牛乳を生み出します。
  farm.donkey:
    label: アシル
    summary: 丈夫で信頼性の高い足取りのうしろた動物。
    info: 家畜化されたアフリカ野生のアシルであり、何世紀にもわたって作業用の動物として利用されてきました。それは強靭で信頼でき、重い荷物を運ぶ能力を持っています。
  farm.duck:
    label: カモ
    summary: 平らな嘴を持つ水鳥で、農場で飼育されています。
    info: 家来のカモは肉や卵を得るために飼われています。指の間にある蹼のおかげでよく泳ぎ、特徴的な鳴き声を出します。
  farm.goat:
    label: ヤギ
    summary: 角を持つ家畜で、美味しい牛乳を提供する。
    info: ヤギは乳、肉および毛のために飼育される。適応力が高く、乾燥した地域を含め多様な植生の中で生き延びることができる。
  farm.horse:
    label: 馬
    summary: 乗馬や労働に使用される力強い家畜。
    info: 馬（エクス・フェルス・カバリウス）は、何千年もの間、輸送、農業、戦闘のために不可欠でした。現代ではスポーツやレクリエーションのためにも飼育されています。
  farm.pig:
    label: 豚
    summary: 関節軟骨のような鼻を持つピンク色の家畜。
    info: 家庭用豚は肉のために飼育される知的な農業動物です。雑食で、複雑なタスクを記憶する能力があります。
  farm.sheep:
    label: 羊
    summary: 毛と乳を提供する毛のある家畜。
    info: 家養された羊は、毛や乳、肉のために飼育される。群れで生活し、歴史上最も早くから家畜化された動物の一つである。
