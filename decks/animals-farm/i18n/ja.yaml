lang: ja
pivot: false
title: 家畜
cards:
  farm.alpaca:
    label: アルパカ
    summary: ラマの小型近縁種であり、細かい毛を生産するために飼育される。
    info: |-
      アルパ카はアンデス高地で家畜化された小さな南米ケモイドです。その羊毛は世界でも最も繊細な天然素材とされ、暖かく低アレルゲン性があり、キャシミヤよりも柔らかくなっています。
      alpacaには「ヒャーカ（巻き毛）」および「スーリー（絹のような光沢のある毛）」という二つの品種があります。近年ではヨーロッパにも急速に普及しています。
  farm.barn_cat:
    label: 厩の猫
    summary: 農場でネズミを捕えるために飼われる家猫。
    info: 厩の猫は、農業環境に住む家の猫であり、ネズミやモグラなどを狩る。穀物と飼料の在庫を齧歯類から守ってくれます。室内用の猫よりも人間に対して社会化されていないことが多いです。過去にはエジプトにおいてもその貢献により崇められていました。
  farm.beehive:
    label: ミツバチの巣箱
    summary: 人工的な蜜蜁（アピス・メリフェラ）の住処として使われる木製構造。
    info: |-
      蜂箱は、野生ハチが生息する樹洞を代替える養蜂場における人工的居住地です。
      一つの群れには通常、約5万〜8万匹ほどの蜜蜂があります。
      各々の群れは毎年平均して20kgから30kg程度の中身を作ります。
      蜂蜜たちは重要な受粉者であり、世界中の食料の三分の一以上がその授粉に依存しています。
  farm.boar:
    label: ブタのオス
    summary: 家畜化されたまたは野生のブタの雄。
    info: |-
      カネツは、家のないまま飼育される家庭用や野性的なブタ（学名：ススクロファ）の未去勢のメスではない個体です。
      農場では繁殖のためにカネツが飼われており、その精液を使って人工授精を行います。
      野生のカネツには大きな牙があり攻撃的な防衛能力を持っています。
      料理においてはカネツ肉は高価で希少性のある食材とされています。
  farm.calf:
    label: テル
    summary: 牛の子供で、年齢が一歳未満。
    info: |-
      テルとは出生から離乳または一年までに育つ家畜である。生まれたてはすぐに立ち上がることができるように母性本能が高い。
      ミルク生産のために飼われる場合は早い段階ですぐ母親と分離される。
      仔牛肉（ヴイア）は多くのヨーロッパ料理において高価な珍味として知られている。
  farm.carp:
    label: カプリュウ
    summary: 大型の淡水魚；チェコで伝統的なクリスマス料理。
    info: |-
      キャピル・オブェネニーは、チェコの池養殖されている最大の魚であり、チェコの冬至と切り離せない存在です。
      中世ヨーロッパ特にボヘミア（トレボン湖畔）において家畜化されました。
      雑食性であるため成長が早く、体重は30kgを超えることもあります。
  farm.chicken:
    label: ニワトリ
    summary: 卵を産む家禽。
    info: ニワトリは世界で最も広く飼育されている家禽です。卵と肉のために飼われており、250億羽以上が存在しています。
  farm.cow:
    label: 牛
    summary: 乳を供給する大型の家畜。
    info: 家牛は乳と肉のために農場で飼育されています。世界中における主要な食料源の一つであり、一頭の乳牛が毎日20～30リットルもの牛乳を生み出します。
  farm.deer:
    label: 農場シカ
    summary: 肉や角の生産のために、ファームで飼育されるヤギまたはジロウヒョウ。
    info: |-
      チェコでは、鹿とヘビクが狩猟用および食用として牧場や養殖施設に保管されています。
      ダーンは森の中で見られるより小さく、特徴的な枝分かれした角を持っています。これらは毎年脱落し、再び成長します。
      これらの野生動物由来の牛肉製品は健康な代替食品です。
  farm.donkey:
    label: アシル
    summary: 丈夫で信頼性の高い足取りのうしろた動物。
    info: 家畜化されたアフリカ野生のアシルであり、何世紀にもわたって作業用の動物として利用されてきました。それは強靭で信頼でき、重い荷物を運ぶ能力を持っています。
  farm.duck:
    label: カモ
    summary: 平らな嘴を持つ水鳥で、農場で飼育されています。
    info: 家来のカモは肉や卵を得るために飼われています。指の間にある蹼のおかげでよく泳ぎ、特徴的な鳴き声を出します。
  farm.emu:
    label: エミュー農場
    summary: オーストラリアで油、肉および革のために飼育されるエミュー。
    info: エミューはその脂から得られる食用の油脂や化粧品に使われるため、また皮革製品にも利用され、オーストラリアでは商業的に養殖されています。この動物由来の油には抗炎症作用があり伝統医学と現代医療でも使用されます。近年になってアメリカ合衆国そしてヨーロッパ諸国の地域へもエミューを扱う畜産業が広まっています。好奇心旺盛な性格を持つこれらの鳥類たちは人間に対して臆することなく近づいてきます。
  farm.farm_shrimp:
    label: 養殖エビ
    summary: 沿岸の池で集中的に育てられる海水エビ。
    info: |-
      タイガメハゼは世界中で最も多く飼われているエビの種です。
      主な養殖場は東南アジアとラテンアメリカにあります。
      インテンシブなエビ農業にはマングローブ林への影響が懸念されており、論争を引き起こしています。
      エビは世界的にもニホントウジょうに次いで人気のある海産物です。
  farm.foal:
    label: ひつじ
    summary: 馬の子供で、生まれてから一年未満；産まれたばかりでも数時間以内に立ち上がる。
    info: |-
      ヒツジは一歳になるまでを指す。出生後すぐに足を使えるようになり母乳を与わ始める。
      体に対して脚が異常に長く見えるが成長とともに短くなる。
      ヒツジは好奇心旺盛かつ遊ぶことが好きである。調教（ブレイキング）は二〜三才になって初めて行われる。
  farm.freshwater_crayfish:
    label: 川エビ
    summary: 淡水甲殻類で、食用として養殖される。
    info: |-
      チェコではかつて豊富に生息していたが、カニの病気と水質汚染によってほぼ絶滅した。
      現在は特別な農場で飼育されている。これは水質を示す指標生物であり、清流でのみ生活できる。
      19世紀にはチェコからフランスやドイツへのエビ輸出ビジネスがあった。
  farm.garden_snail:
    label: 庭園ナメクジ
    summary: フランス料理でエスカゴとして食用とされる大型の陸生軟体動物。
    info: |-
      ガーデン・スネークリム（Garden Snail）はヨーロッパ最大級の陸棲貝である。
      これは、フレンチレストランなどで高価なデザート「エスカゴ」として提供されている。
      冬には地中に潜り込み、殻を膜（ヒバーナクラム）によって閉じて越冬する。その飼育方法（ヘリキルチャ）は主にイタリアや他の国々でも行われている。
  farm.goat:
    label: ヤギ
    summary: 角を持つ家畜で、美味しい牛乳を提供する。
    info: ヤギは乳、肉および毛のために飼育される。適応力が高く、乾燥した地域を含め多様な植生の中で生き延びることができる。
  farm.goat_dairy:
    label: 乳用ヤギ
    summary: チーズやヨーグルトを作るために飼育されるヤギ。
    info: |-
      家畜化されたのは一万年以上前で、最も広く分布する農業動物の一つです。
      ヤギミルクは栄養豊富であり、牛乳よりも消化しやすく、ラクトース不耐症の人にも適しています。
      有名なチーズとしてはChèvre（シェーブル）、フェタ、ハロウムイがあります。
      ヤギは頑丈かつ環境に順応力が高く、岩場のような山地でも放牧可能です。
  farm.goose:
    label: 家ヒース
    summary: 肉、卵および羽毛のために飼育される大型の家禽鳥。
    info: |-
      家ヒースは三千年前に野生のヒースから来ています。
      これは最初期の家畜化された動物の一頭であり、ローマではカピトリオで警備をしていたとされています。
      その価値ある産品にはヒース肝（フォアグラ）、食用肉だけでなく、ヒース毛も含まれます。
      また伝統的な筆として使われてきたのはヒースの羽根です。
  farm.guinea_fowl:
    label: ペリカ
    summary: アフリカの農場で肉用およびヘビなどの見張りとして飼育される鳥。
    info: |-
      ヘルメット付きガニシギ（学名：Numida meleagris）は、アフリカ原産であり、サバンナ地域に野生でも生息しています。
      農場では自然な警戒役としても重宝されおり、その大きな声を出して蛇や捕食者、不審人物などを知らせてくれます。
      特徴的なのは白い斑点のある灰色のかさ羽と赤みがかった青色の無毛頭部です。また、この鳥類の肉は野禽によく似た味わいを持っています。
  farm.guinea_pig_farm:
    label: ファームモルス
    summary: ラテンアメリカで肉用に飼育される、またはペットとして人気のあるモルス。
    info: |-
      家畜化されたモルス（学名：Cavia porcellus）はアンデス地域が原産地であり、インカ人はそれ以上にもう3千年前から食用としました。
      今日でもペルー・エクアドル・コロンビアでは伝統的な食料品「キュイ」の一つです。
      ヨーロッパや北米においては子供たちの人気ある愛玩動物となっています。
      複雑な鳴き声を含むくぐもった音、ねぎょうびのような泣き声、笛のように鋭いピーコピーなどのコミュニケーション手段を持っています。
  farm.highland_cattle:
    label: スコットランド・ハイランダー牛
    summary: 赤茶色の長毛と大きな角を持つスコットランド原産の牛。
    info: |-
      スコットランド高地で育てられる伝統的な品種であり、湿気や寒さに耐えるため特徴的な長い赤褐色の毛を持っています。他の品種よりも丈夫で病気にかかりにくいです。
      その肉は柔らかく風味が強く、通常の牛肉のかわりによく選ばれます。
  farm.horse:
    label: 馬
    summary: 乗馬や労働に使用される力強い家畜。
    info: 馬（エクス・フェルス・カバリウス）は、何千年もの間、輸送、農業、戦闘のために不可欠でした。現代ではスポーツやレクリエーションのためにも飼育されています。
  farm.lamb:
    label: 子羊
    summary: 一歳未満の若いヒツジ、春や無垢さを象徴する。
    info: |-
      子羊は生まれてから一年以内に属し、毛皮を持ちながら生後数日で放牧される。キリスト教では純粋性と神の子イエス・キリスト（天鶏）としての象徴でもある。
      多くの世界中の料理において、子羊肉という高級食材が人気がある。
  farm.llama:
    label: ラマ
    summary: 南アメリカの偶蹄目動物で、毛と運搬のために飼育される。
    info: インカ人は5000年以上前からアンドー諸山脈地域に住む人々によって家畜化された。これは主な荷物を載せるための重要な役割を持ち、体重のおよそ30％までものを背負うことができる。その羊毛は保温性が高く評価されている。脅かされたり不満があるときにはよく唾を吐くことで知られている。
  farm.mule:
    label: メズーク
    summary: 馬とラクダの交配によって生まれた、例外的な耐久力と強さを持つ不妊動物。
    info: |-
      メゼックは牝馬（母）とオスラクダから生じる雑種であり；逆に牡馬と雌ラクダからのものは「ムーラ」と呼ばれる。
      繁殖能力はないが非常に頼りになるほど強く丈夫である。地形に対する適応性も良く、馬よりも慎重でパニックになりにくいという特徴がある。
      何千年もの間、山岳地帯での輸送において不可欠な存在であった。
  farm.mussel:
    label: スラヴカ
    summary: 海の縄に育てられた食用二枚貝。
    info: エッジブル・ミルトゥス（Edulis）として知られるこの種は、ヨーロッパ大西洋岸沿いでの養殖が盛んである。潮汐を利用してロープやネットで栽培され、水をろ過して環境負荷の低い持続可能な食品とされている。ベルギー料理「ムールズ＝フィート」など多くの伝統的な食事にも使われている
  farm.ostrich:
    label: 肉・羽毛・皮革用のダチョウ
    summary: マス、フェザーズおよびレザーのために飼育されるダチョウ。
    info: ダチョウは最も速い二足歩行動物であり、農場でその肉や皮膚と羽が利用されています。 ダチョウの肉は牛肉のように赤身ですが脂肪分とコレステロール量が低いです。 ウォーターグラジエントな表面を持つダチョウ革は高級製品に使われます。伝統的にダチョウの羽は帽子や扇子などの装飾にも使用されていました。
  farm.ox:
    label: 牛
    summary: 去勢された牡牛は歴史上農業で最も重要な曳き動物です。
    info: |-
      牛とは、家畜として仕事のために飼育される去勢した雄のホルスタイン種（学名：ボス・タウラス）のことである。
      何千年もの間、世界中の大部分において基本的な牽引動物であった。
      力強く従順な性格により、初期の農耕では馬よりも多くの土地を耕耘していた。
      現代農業ではトラクターによって置き換えられたが発展途上国ではまだ使用されている。
  farm.oyster:
    label: 養殖牡蠣
    summary: 沿岸の水でロープやネットに吊るして育てられる海産貝。
    info: |-
      牡蠣は、沿岸水域においてロープまたは網状容器を使って飼われており、成熟には約3〜5年かかります。
      mollusca（双殻類）として、海水をろ過し海洋生態系の浄化にも役立ちます。生食用としても加熱用としても高級食材とされています。
      また、「ビスエロー・オイスター」と呼ばれる品種からは天然真珠が得られます。
  farm.peacock:
    label: 家来孔雀
    summary: 所有者が美しさのために飼育する、尾を広げる雄の孔雀。
    info: |-
      ブルー・ペアフィットはインド原産で、何千年も前から装飾用に馴化されてきました。
      オス（孔雀）は求愛するために約150本以上の美しい羽を開いて扇状になります。
      その鳴き声は非常に大きく鋭いです。
  farm.pheasant:
    label: ファームバズァント
    summary: 農場で飼育され、狩猟のために放されるフェアウェルガモ。
    info: チェコでは一般的なバズァントは農場や大規模牧場において狩りのため定期的に自然へ解放されています。その原産地はアジアであり、ローマ帝国によってヨーロッパに導入されました。オスには目立つ色調と長い尾羽がありますがメスの方は控えめな茶色です。この鳥類から得られる肉質は繊細かつ美味しいことで知られています
  farm.pig:
    label: 豚
    summary: 関節軟骨のような鼻を持つピンク色の家畜。
    info: 家庭用豚は肉のために飼育される知的な農業動物です。雑食で、複雑なタスクを記憶する能力があります。
  farm.pigeon_farm:
    label: 家化されたハト
    summary: 肉（スカブ）や競技飛行のために飼育される家のハト。
    info: 家化的岩ドバは、品種改良によって数百の血統が生まれた。 スカブとは若いハトを指し、多くの文化で高価な珍味とされている。 競走用に選ばれたハトは速度重視で繁殖されおり、記録的な個体では時速150キロメートルを超えることもある。 チェコにおいてはホウボシ伝承も強い
  farm.piglet:
    label: 仔豚
    summary: 家畜のブタの子供、典型的にはピンク色で遊ぶことが好きです。
    info: |-
      仔豚は生まれて最初の数週間を過ごす家の猪（いし）の幼児である。
      産まれたばかりの仔豚は非常に小さいけれども急速に成長する。雌（メス）つまり母豚が一度に出産するのは平均して10〜12頭程度だという研究結果もある。
      また仔豚は知能が高い動物であり、犬と同じようなレベルの知性を持つともされている。
  farm.pony:
    label: ポニー
    summary: 子供の乗馬に人気のある小型の純血種馬。
    info: |-
      ポニーケは、背丈が最大で14.2ハンド（約147cm）を超えない小さな馬です。
      シェットランド・ポンイーという最も小さい品種があり、これはスコotlandにあるシェットランド諸島原産です。
      これらの動物たちは耐寒性や頑健さがあるため、厳しい環境にも適応します。また子どもたちへの騎乗用としてだけでなく坑夫向けの曳き馬としても親しまれています
  farm.quail:
    label: 日本鹌鹑
    summary: 卵と肉のために農業的に飼育される小型の鳥。
    info: |-
      日本の家畜化されたアヒルガラスは、産卵および食用として集約的につかわれています。
      メスがほぼ毎日卵を産みます。その卵は多くの料理において珍味です。
      6週間で成熟し始めるとすぐに産卵が始まります。
      また、日本では歌う鳥としても扱われる伝統があり、そこでの繁殖も行われています。
  farm.rabbit:
    label: ウサギ
    summary: 食用、毛皮用またはペットとして飼育される家畜化されたうさぎ。
    info: |-
      ヨーロピアンハツカネズミ（学名：Oryctolagus cuniculus）は中世に野生の欧州うさぎから家畜化されました。
      体格や色調、被毛タイプによって認知されている品種が50以上あります。
      雌（メス）である「めしうさぎ」は一回で子供を4〜12匹産み、年間何回も出産することが可能です。
      ヨーロッパでは犬と猫に次いで人気のある家庭動物です。
  farm.ram:
    label: 羊の雄
    summary: 大型な螺旋状の角を持つ成獣オスの家畜用ヒツジ。
    info: |-
      「バラン（beran）」は、家のヒツジの中で成熟したオスを指します。
      特徴的なのはその目立つ大きな螺旋状に巻いた角で、メスであるオーツェル（oveczka）にはこのような角がなく、あるいは非常に小さなものです。秋になるとオス同士は頭と角を使って直接的に争いを見せます。「バラン」という象徴や神話では力強さ・豊穣性および指導者としての役割に関連づけられています。
  farm.rooster:
    label: 雄鶏
    summary: 家禽のメスである雌鶉とは対照的に、その鳴き声で朝を告げる。
    info: |-
      雄鶸（おじょう）は家のニワトリの中でオスであり、カラフルな羽毛や冠と尾羽によって識別できます。
      「コックアダム」という鳴く行為は縄張り行動の一環として行われており、明け方だけでなくいつでも行います。
      チェコでは雄鵝が警戒心の象徴となっています。中国十二支にも含まれています。
      古代ギリシャ人は新日の出のシンボルとして医神アクシピオに捧げました。
  farm.salmon:
    label: サケ
    summary: 海で育ち、産卵のために川へ戻る大型の魚；養殖が盛んである。
    info: |-
      アトランティックサーモンは回遊性を持つ魚であり、成体として成長するのは海洋だが、繁殖期には故郷となった河に戻ってくる。
      生まれた川を特定する能力は地球磁場と嗅覚によって導かれる。
      ノルウェーやスコットランドでのサーモン農業は水産养殖の中でも最大規模である。
      また、健康に良いオメガ−３脂肪酸が多く含まれている。
  farm.sheep:
    label: 羊
    summary: 毛と乳を提供する毛のある家畜。
    info: 家養された羊は、毛や乳、肉のために飼育される。群れで生活し、歴史上最も早くから家畜化された動物の一つである。
  farm.sheepdog:
    label: 羊飼いの犬
    summary: 群れを導き、守るために特別に訓練された犬。
    info: ボーダーコリーは農場で羊の大群を視線と静かな指令を使って管理するために最も人気のある牧畜用犬です。これは犬の中でも特に知能が高い品種として認知されています。作業能力は遺伝しますが、子犬からトレーニングによって育てられる必要があります。「オブディエンス・トライアル（競技）」という活動では、この技能を使った大会がイギリスを中心に盛んに行われています。
  farm.silkworm:
    label: ボムビクス・モリの幼虫
    summary: サテンシルクロッド（ボンブキックス・モーリ）は天然繭を産む。
    info: |-
      ボンドゥーという名前のこの蚕は、中国で5千年以上前から飼育されてきた。
      その作る糸巻きには一つの長さが900メートルを超える単一の糸がある。それが自然な絹を作り出すのである。
      これほど価値のあるものだったため、中国では何世紀にもわたって生産方法について厳重に秘密にしてきた。
      そして「丝绸之路」という名称もこうした素材に関する貿易によってつけられたのだ。
  farm.sow:
    label: ブタメス
    summary: 子豚の母となる成体の雌猪。
    info: |-
      ブタメスは家庭用家畜として飼われる成熟した雌である。
      年間で二回出産し、平均して一回につき10〜14頭ほどの仔を生む。
      現代農業においては広いケージでの密閉的な環境が問題視されており、その点から養殖されることが議論されている。
  farm.tilapia:
    label: チラピア
    summary: 熱帯の淡水魚で、世界中で大量に養殖されています。
    info: ニール・ティラピアは最も広く养殖されている世界的な魚種であり、毎年何百万千トンが生産されます。元々ナイル川やアフリカの湖から来ていますが、現在ではすべての大陸で飼育されています。この魚は丈夫で成長も早く、餌への要求水準が低い特徴があります。ブラックバスに次いで世界第二位に多く養殖される魚です。
  farm.trout:
    label: 虹鱒
    summary: 養殖場や自然水域で飼育されるサケ科の魚。
    info: |-
      虹色を持つアメリカ原産のアユ（Rainbow Trout）はヨーロッパに導入され、食用として栽培されています。
      一方、川などの清流を好む欧州固有種であるトラウトも存在します。両者ともスポーツフィッシングと食文化において高い評価を受けます。
      チェコでは特に山岳地帯を中心に、マス類の養殖が伝統的な業界となっています。
  farm.turkey:
    label: トキシ
    summary: 肉用に飼育される大型の家禽、アメリカのお祭り・感謝祭の象徴。
    info: |-
      メキシコ原産でアステカによってすでに2千年以上前から家畜化されていた。
      雄は特有の垂れ耳を持ち尾羽を扇状に広げることができる。米国では伝統的な感謝祭料理であり世界中でも二番目に多く食用とされている鳥類である。
      czech語圏において「tokeš」（＝自慢好きな人）という言葉もこの動物由来だ。
  farm.water_buffalo:
    label: 家畜バッファロ
    summary: アジアの大型牛科動物で、主に稲田での耕作用として使われる基本的な牽引動物。
    info: |-
      家畜化された水 buffalo の形態であり、アシアにおける主要な農業動物です。
      何千年もの間、稕田を耕耘したり荷物運搬にも利用されてきました。
      その乳は牛乳よりも濃厚で、「モッツァレラ・ディ・ブッファーロ」などのチーズ製造に使用されます。
      インドではヒンドゥー教徒にとって聖なる存在とされています。
  farm.yak:
    label: ジャク
    summary: チベット高原の大型長毛偶蹄目動物；乳、肉および牽引を提供する。
    info: |-
      家畜化された形態でティベト高平原（標高約3000～5500メートル）に生息している。
      これはチベット経済の基盤であり、牛乳や牛肉だけでなく羊毛と曳力をも供給してくれる。
      その毛は非常に柔らかく暖かい。ドジョモとはヤギと普通の牛との交雑種であるがより多くのミルクを与える
