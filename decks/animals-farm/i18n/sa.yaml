lang: sa
pivot: false
title: अर्थवृद्धि प्राणी
cards:
  farm.chicken:
    label: सर्पिह
    summary: अंडे देने वाला कृषि पक्षी।
    info: गृह सर्पिह जगत् में सबले चोपड़ के सबले प्रजाति हवय। इनमे अंडे होत आउ इनके मास के लिए पाल जात हवई। यहाँ उपर 25 बिलियन गुण रहे।
  farm.cow:
    label: गाई
    summary: मेंढ़क जन्तु जो दूध देता है।
    info: घरेलू गाय की प्रजनन में दूध और माँस उत्पादन के लिए किया जाता है। वह संपूर्ण विश्व में खाना का एक महत्वपूर्ण स्रोत है; एक दूध देने वाली गाय प्रति दिन 20–30 लीटर दूध देती है।
  farm.donkey:
    label: ओषधि
    summary: शिरोभाग वाला स्थिरता पूर्ण कामगाज़ प्राणी।
    info: ओषधि हे एक मनुष्य द्वारा पालित अफ्रीकी श्वेत ओषधि हे, जेकर इसका उपयोग लंबे समय तक कामगाज़ प्राणी के रूप में कियल जात हवए। ई प्रतिरोधी, भरोसेमंद और भारी बोझ झूठे के क्षमता रखत हवए।
  farm.duck:
    label: काकना
    summary: फ़ार्म में पाले जाने वाले कमली चोंच वाला जलपक्षी।
    info: गृहीत काकना माँस और अण्डा उत्पादन हेतु पाली जाती है। इसके बिछड़े आंगुलों के बीच प्रवाहक झिल्लि से यह शुष्क रहती है एवं खास ध्वनि भी उत्सर्जित करती है।
  farm.goat:
    label: कोज
    summary: रूखे दुग्ध प्रदान करने वाला हथियार वाला सस्तन पशु।
    info: घरेलू कोज में छील, गोबर और ऊन के उत्पादन के लिए पाला जाता है। यह अपने आवास के अनुकूल होने में सक्षम है और शुष्क क्षेत्रों सहित विभिन्न प्रकार के वनस्पति पर बच सकता है।
  farm.horse:
    label: गुरुचलन
    summary: शक्तिशाली कृषि प्राणी जो सवारी और काम में उपयोग होता है।
    info: घोड़े हजारों वर्षों तक परिवहन, कृषि और युद्ध के लिए आवश्यक थे। अब इसे खेल और आनंद के लिए भी पाला जाता है।
  farm.pig:
    label: प्रसे
    summary: लाल रंग का पशु जिसकी हड़केली से बनी मुट्ठी होती है।
    info: घरेलू प्रसे एक बुद्धिमान् कृषि पशु है जिसे माँस के लिये पाला जाता है। यह सभी भोजन खाने वाला है और जटिल कार्यों को याद रख सकता है।
  farm.sheep:
    label: ओव्स
    summary: ऊन और दूध देने वाला बुशी पशु।
    info: घरेलू ओव्स को ऊन, दूध और माँस हेतु पाला जाता है। यह समूह में रहता है और इतिहास में प्रथम घरेलूकृत पशुओं में से एक है।
