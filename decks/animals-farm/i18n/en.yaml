lang: en
pivot: false
title: Livestock Animals
cards:
  farm.chicken:
    label: chicken
    summary: A farmed bird that lays eggs.
    info: The domestic chicken is the most widespread type of poultry in the world. It lays eggs and is raised for meat; there are more than 25 billion chickens.
  farm.cow:
    label: cow
    summary: Large farm animal that produces milk.
    info: The domestic cow is raised for its milk and meat. It is one of the key sources of food worldwide; a milking cow can produce up to 20–30 liters of milk per day.
  farm.donkey:
    label: donkey
    summary: Eared work animal with reliable gait.
    info: The domestic donkey is a domesticated African wild ass that has been used for centuries as a working animal. It is hardy, dependable, and capable of carrying heavy loads.
  farm.duck:
    label: duck
    summary: Water bird with a flat beak, raised on farms.
    info: The domestic duck is poultry kept for meat and eggs. It swims well thanks to webbed feet between its toes and makes characteristic quacking sounds.
  farm.goat:
    label: goat
    summary: Hoofed livestock giving tasty milk.
    info: The domestic goat is raised for its milk, meat, and wool. It is adaptable and can survive on diverse vegetation including arid areas.
  farm.horse:
    label: horse
    summary: Strong domesticated animal used for riding and work.
    info: The domestic horse has been essential for transportation, agriculture, and warfare for thousands of years. Today it is also bred for sports and recreation.
  farm.pig:
    label: pig
    summary: Pink farm animal with a cartilaginous snout.
    info: The domestic pig is an intelligent livestock animal raised for meat. It is omnivorous and capable of remembering complex tasks.
  farm.sheep:
    label: sheep
    summary: Fuzzy domesticated animal providing wool and milk.
    info: Domestic sheep is kept for its wool, milk, and meat. It lives in flocks and is one of the first animals to have been domesticated in history.
