lang: la
pivot: false
title: Animalia domestica
cards:
  farm.chicken:
    label: pullum
    summary: Aves domestica ovans.
    info: Pullum domesticum est Gallus gallus domesticus et commune aves agraria sunt. Pulla ova ponunt et ad carnem creantur; plus quam viginti quinque millia billiones pullorum extant.
  farm.cow:
    label: bos
    summary: Magnus animal domesticum lactis datur.
    info: Bos domesticus est ad lacticem et carnem cultus. Est unus ex fontibus ciborum primariis in toto mundo; vacca singula quotidie 20–30 litros lactis reddit.
  farm.donkey:
    label: asinus
    summary: Spotify ambulans gregarius cum passu stabile.
    info: Asinus domesticus est Equus africanus asinus domesticatus, utilis annis ut animal laborale. Est robustus et fidelis, potens onera gravia portare.
  farm.duck:
    label: anser
    summary: Aqua aves cum rostro plano, qui in agris colitur.
    info: Anser domesticus est volucris gallinaceus ad carnem et ova colitur. Bene natat gratias pelliculis inter digitos et sonum characteristicum emittit.
  farm.goat:
    label: capra
    summary: Animalia domestica cornuta dare lactem sapidum.
    info: Capra domesticus cibatur propter lac, carnem et lanam. Est adaptiva et potest subsistere super varietate vegetationis, inclusa arida regiones.
  farm.horse:
    label: caballus
    summary: Fortis animal domesticum ad equestram exercitationem et laboris usum destinatum.
    info: Caballus domesticus mille annorum esset necessarius ad transportandum, agricolam et pugnam. Hodie quoque educatur ad lusum atque recreationem.
  farm.pig:
    label: sus
    summary: Animalia domestica roseum cum rhinocerio cartilagineo.
    info: Sus est animalia domestica intelligens, quod creari potest ad carnem producendam. Est omnivorum et complexas res memorare potest.
  farm.sheep:
    label: ovi
    summary: Animal lanigerum domesticum, quod dat lanam et lac.
    info: Ovis domestica est animal, quod pro lana, lacte et carne colitur. In gregibus habitat et unum ex primis animantibus historicis domesticatis est.
