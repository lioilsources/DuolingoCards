lang: te
pivot: false
title: ఆర్థిక జంతువులు
cards:
  farm.chicken:
    label: సులభ మాంసపు చికెన్
    summary: వృత్తిగా ఉడికించే అండాలు కలిగిన గొర్రె.
    info: దోమాటి బావీడు లోకలో అత్యధికంగా వాడుకునే దుంప జాతి. ఈ గొర్రె నుండి అండాలు తీసుకోబడి మాంసం కోసం పెంపుడు జంతువుగా ఉంటుంది; ఒక్కొక్కటి 25 బిలియన్ కంటే ఎక్కువ జంతువులు ఉన్నాయి.
  farm.cow:
    label: గేదె
    summary: పాలు ఇవ్వే విలువైన గొర్రె జంతువు.
    info: హోమ్ కుక్క లేదా బీఫ్ ఉత్పత్తి చేసే ఒక దశాబ్ది తో Bos Taurus అనే జాతికి చెందిన గొర్రె జంతువు. ఇది భూమిపై పౌష్టికాహార ఉత్పత్తికి ఒక ప్రధాన మూలం; ఒక డైరీ గొర్రె రోజుకు 20-30 లీటర్ల పాలు ఇస్తుంది.
  farm.donkey:
    label: ఎద్దు
    summary: నడక నిలకడగా ఉండే పరిశీలన కలిగిన జీవి.
    info: ఈ ఘనతను సహజంగా అధికారిక విధిని చెయ్యడమైన బొట్టు గోళం దృఢంగా తెలుసుకోవడం లేదు.
  farm.duck:
    label: కాచ్న
    summary: తలకు పీగొడే నీరు కలిగిన వస్తువు, ఫారం లో మాంసం అయిన గృహ జంతువు.
    info: దీనిని తయారు చేసి దాని మాంసం మరియు గుడ్లు కోసం ఉపయోగిస్తారు. ఈ బెలుబెట్టి ఎరుపు రంగు శరీరం కలిగి ఉంటుంది.
  farm.goat:
    label: కోళ్లు
    summary: రెండు గొర్రెలు కలిగిన ఇసుక రుచి ఉత్పత్తి అయ్యే వాణిజ్య జీవి.
    info: దోమ లేని నాలుగు కాళ్లు కలిగిన ఈ జీవి దుంప, ఎర్ర బంటు తో ఒక శాఖ ఉంటుంది.
  farm.horse:
    label: కురి
    summary: వేగంగా ప్రయాణించడానికి మరియు కార్యకలాపాలకు ఉపయోగించే శక్తివంతమైన వృత్తి జీవి.
    info: దీర్ఘకాలం నుండి సరిపెట్టుబాటు, రైతు బీజాలు మరియు యుద్ధాలకు అవసరమైన ఒక పెద్ద గొర్రె మరియు తోలు దళం. ఈ రోజుల్లో ఖేలా మరియు రిక్రియేషన్ లకు కూడా పెంపుడు జీవిగా ఉపయోగిస్తారు.
  farm.pig:
    label: ప్రసె
    summary: కాలిన హవేలు కొరకు చేతోడుగా ఉండే గృహ జంతువు.
    info: దీని మృదువైన నాలుక ద్వారా వివిధ రకాల ఆహారాలను తింటుంది. ఇది బాగా అర్థం చేసుకోగలిగే జంతువు మరియు సంకీర్ణ పనులను గుర్తు చేసుకోగలదు.
  farm.sheep:
    label: మేక
    summary: వీపు వలన దుండగమైన గొర్రె జాతి కోసం ఉన్న ఒక హౌస్‌హోల్డ్ జంతువు.
    info: దుండగమైన గొర్రె నుండి తయారు చేసిన వీపు, దుండగమైన పాలు మరియు మాంసం అందుబాటులో ఉంటాయి. ఇవి బృందాలలో జీవిస్తాయి మరియు చరిత్రలో మొదటి డమోష్టికేటెడ్ జంతువులలో ఒకటి.
