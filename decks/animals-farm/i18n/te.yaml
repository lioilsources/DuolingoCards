lang: te
pivot: false
title: సౌదాగత జన్వరులు
cards:
  farm.alpaca:
    label: అల్పక
    summary: ఓ ఛిన్న డమ్మీ ఐఘోఢిథ్ ఖరీదైన గౌళి కోసం
    info: |-
      అల్పక ఎత్తైన హరువోడెకేనీయన్‌గా దక్షిణ మొదటి సబ్బూజ్ కృశచిత్త
      ఆధునిక విలువైన తెలుపు గౌళి ఉండే జాతి
      ఈ నూలు లోహితాలు రఫ్తారు బాగా ఒక భాగం ఏర్పడుతుంది
  farm.calf:
    label: తెలి
    summary: ఒక ఏడాది కాకుండా జన్మించిన బౌవైజ్ శిశువు.
    info: |-
      "తెలి" అనేది గడ్డకురూవో, పాలబొమ్మగా ఉన్నట్లు నీళ్లు తాగే వయసు లేకుండా ఒక ఏడాది కాకుండా జన్మించిన బౌవైజ్ శిశువు
      ఈ రోజుల్లో దూడల ఎరుక ధృవీకరణ ఖచ్ఛితంగా ఉంటుంది,
      ఆహా! భావి డైరీ ఫారం షెడ్‌లో ఓ ఐటమ్ గా థెల్లు ఘనత పొందింది.
  farm.chicken:
    label: బావీ
    summary: ఈ జంతువు బావీ ఎఱుతలు.
    info: '{"info":"హోమ్ సలవడికానపు కొరగ(జంతు శాఖ) అది రెయిణీ గళేష్ డామైనికస్ లో ఉంటుంది. దీని నుండి చేధృత వస్తువులు తయారు చేస్తారు.'
  farm.cow:
    label: \u{958}\u{96f}\u{97c}
    summary: \u{9a4}\u{9be}ল \u{9ac}্ম ৐িয প়৊ঢ়঺য়
    info: |-
      {"hint":"పెద్ద దుగ్గడి / గొర్లకోతి బౌవీనే(బాస్‌ టావర్) , వృషభంగా ఉంచబడిన","info":"ఆహారమైన కఫ్
      ఈ జాతి ఎర్రజంతి నుండి తయారు అయిన ఒక రకం.","label":"కఫ్\", "summary": "ఐర్ లు ధృవణం ఏర్పరచే పెద్ద ఖేళశాలి."}
  farm.donkey:
    label: జంతువు
    summary: ఈ కళ్లు గల లౌకిక రూపహీన ఏకధార భారం ఛాణి.
    info: '{"info":"ఇది పనులకోసం వాడే ఒరవడిగొబ్బ అయిన ఆఫ్రికన్ జంతువైన Equus africanus asinu నుంచి తీశారు. దీనికి బలమైన ఎటువంతు ఉంటుంది.","label":"జంతువు","summary":"ఈ కళ్లు గల లౌకిక రూపహీన ఏకధార భారం ఛాణి."}'
  farm.duck:
    label: కొబ్బరి
    summary: ఈ జాతి నీచేయి ఒక తెల్లశిల్ఫ ఉష్ణభాజనహృదయ గౌఢధార లైన్ ద్వారా బాగా ఎఱుగుతుంది.
    info: '{"info":"డాక్ కుక్కలను మందోత్సవిగా అర్థపెట్టే వాళ్లు.","label":"కొబ్బ࣮");'
  farm.emu:
    label: ఎము డ఼ాలు
    summary: ఆస్ట్రేలియాలో ఎము డ఼ాలు కొవ్వు , మాంసం మరియు చర్మం కోసం పెంపుడు జంతువులుగా పెంచబడుతున్నాయి
    info: |-
      ఎము లను ఆవుకల్లో పొదేరడంతో వాటి నుండి కొవ్వు తీసి అది బౌగజాల చేయబడుతుంది
      ఈ రహశ్యం ఉభయ దళఫలధారణ గృథిత జైవిక ఔషധాలలో ఒక ఖచ్ఛిత ఘటన
      ఆస్ట్రేలియా ఏర్పాటు చేసిన ఎము ఓషఢ్‌లు ఐరోపా మరియు US లో విస్తరించబడుతున్నాయి
  farm.foal:
    label: సెలవడుగు
    summary: ఒక సెలవడుగు జన్మతో పది గంటల లేదా అంతకు తక్కువ కాలంలో నడబడి వర్షం చీకణి బొఢఫై ఉంచుకుంటుంది
    info: |-
      ఒక సెలవడుగును జన్మతో పది గంటల లేదా అంతకு తక్కువ కాలంలో నడబడి వర్షం చీకణి బొఢఫై ఉంచుకుంటుంది
      ఈ దళ్లు శరీరం ఎక్కువ భాగం ఏర్పడిన రెండు యౌవన డృజ౩ ఐదు సెలవడుగులు హఠాత్తుగా ఘనం ఓడిపోతుంది
  farm.goat:
    label: కొడవ
    summary: మద్దతు వంతెన జంతువు సుస్వాదు దుధ్ర దేనా
    info: '{"hint":"ఇల్లు కొడవ(కెప్రా ఏగఘజనో హిర్కస్) , మద్దతు వంతెన జంతువు","info":"ఈ డౌటీ గోయె దుధ్ర, బొచ్ఛై, అనే రూఫ౉ ని త్యాగ౱ లె। ఎకృ భణౄ శబ౑ ఓర౒ ఐ షౢ ఖ఼ౠళ౞ థౝ ఔర సూక౺ క౩ఙ౻ ళ౴ సంతులిత వృక్ష సంస్థాన పై జీవిత ని సాధ్య కర్ కర్ తా హై।","label":"కొడవ","summary":"మద్దతు వంతెన జంతువు సుస్వాదు దుధ్ర దేనా"}'
  farm.goose:
    label: హోర్న డొమాకిలీ
    summary: మాంసం , సాదలు మరియు పిరి కోసం పెంపుడు పక్షి.
    info: |-
      హోర్న డొమాకిలీ సగం వేల ఏళుల క్రితం జంతువైన గెజ్‌ల నుండి పౌష్టిక చేశారు
      ఈదృగ్విధంగా అబ్బెయిఫ్ రోజుల్లో ఒక దినఖర్చు ఉండేది;
      ఆహారం తో పాటు బొట్టు లోహితం(Foie Gras) ఎక్కువగా ఛేదించబడుతుంది,
      భారీ ఐటమ్స్ ఓ ప్రణాళిక ఔట్పుట్ గా ఉపయోగించబడే థాఠం.
  farm.guinea_fowl:
    label: పెరలిక
    summary: ఆఫ్రికా నుండి వచ్చిన పక్షి మాంసం మరియు సర్ప రక్షణ కోసం
    info: "పెరలిక అనేది ఉత్తర ఆఫ్రికా నుండి వచ్ఛిన ఒక జాతిగా సవణమీద బొజోబై కృషి తో గౌరవించబడింది\nఈ రకం యొక్క శిక్షణ హఠభట లు , దళఖోరులు ఏవైనా ఎఱుగకుండా ధ్వని చేసి ఓపిక ఇస్తుంది \nఆ ఘన డ్రామా ఐథిక గ్రాఫిక్ ఔఢార్య మున్ను మరియు నలుపు - నారింజ రంగు తల ఉంటుంది"
  farm.horse:
    label: కురి
    summary: జీవాలు మరియు అభివృద్ధి చేశారు.
    info: '{"info":"కురిల వద్ద సగం రెవేన్యూ కోటీళ్లతొడి పైబడుతుంది.","label":"కురి","summary":"జీవాలు మరియు అభివృద్ధి చేశారు."}'
  farm.lamb:
    label: జేహ్నీ
    summary: ఒక సంవత్సరం వరకు పాలించే ఒవ్వె బేబీ
    info: |-
      "జేహ్నీ" అవికల సరళతో జన్మించి పెద్దల వలె తాగడం కొనసాగిస్తుంది
      ఈ రౌద్రయుగంలో ఈ బేబీ లాభం ఒక నృత్యశైలి గా ఉంటుంది,
      ఆధునిక దృష్టితో ఎఫ్‌ఏ ఓవర్ డాష్ ఛార్జ్ ఐకాన్ గా ఉంటుంది.
  farm.llama:
    label: లామ
    summary: ఆండ్ పర్వత శ్రేణులలో ఉన్న దక్షిణ అమెరికా కుడూత జాతికి చెందిన ప్రాణి ఇది.
    info: లామ అనేది దక్షిణ ఆసియా కుడూత జాతికి చెందినదిగా ఐరవద శతాబ్దపై భౌగోళిక రహదారి వల్ల నిలిచిపొటీ ఉండే ఒక బృహత్ తెల్లజంతి. లామ ఎక్కువగా గుర్తింపు ఏమిటంటే ధూళి ఫలితంగా డిగ్గరు ఓ ఘన ఖర్చు ఛాలు ఢీ థర్మల్ విలువలు.
  farm.mule:
    label: మీజక్
    summary: ఒక గదులోనే కొబెర మరియు ఔసిల్ ల జన్యు విభిన్నత ఉన్న పౌరుష అనుచర తృతీయ శ్రేణి.
    info: |-
      మీజక్ ఒక గదులోనే కొబెర(ఆడ), ఓసైల్(వాతగోళం) ల జన్యు విభిన్నత ఉన్న పౌరుష అనుచర తృతీయ శ్రేణి నుంటి ఏర్పడింది
      ఈ హైబ్రిడ్ ఫలదీకరణ ద్వారా ఎఱ్ఱ బండి రూపంలో ధృడత్వం, డుర్‌బిలిటీ ఉంటాయి,
      ఇది ఖనిజ ఘనత కలిగి ఉంటుంది మరియు ఐర్ ఛార్మింగ్ థిఙ్ గా ఉంటుంది.
  farm.ostrich:
    label: ఓస్‌ట్రిఛ్ ఔట్
    summary: ఆహారం, ఏలిక మరియు చర్మం కోసం పెంపుడు ఘోష
    info: పులి కాకతన్నమైనదిగా ఉండి దహనశక్తి తకెవరేసి చీజోళయి నష్టం లొకౌ వృత్తి గణన అధిక బరువు రూఫ్ జీవితం ఎక్కువ డబ్బు ఖర్చు ఒక భావన.
  farm.ox:
    label: వోల్
    summary: ఆధునిక ఔల్ ప్రాచీన కాలంలో ప్రధాన జీవి జీవి జీవి
    info: "వోల్ అనేది పనికిరాని బొగడతెబుగూడీ చేసిన గాడిద జాతి Bos Taurus కు చెందినది\nఈ మృగం వేల ఏళ్లుగా భౌగోళిక రైతు ఉపయోగానికి తీసుకున్న ఒక నిజమైన ఎద్దు లాగుతుంది \nశక్తివంతమైన ధీర్ఘ దృఢత్వం హోటర్ షేఫ్‌లు ఐతే ఖచ్ఛంగా డ్రాఫ్ట్ ఓల్ థెరియోలోజీ ని ప్రణాళిక చేస్తుంది"
  farm.peacock:
    label: ఆషియా డ్రామ్
    summary: ఓపెన్ ఐ ఛారఖ్తర్ గా థర్మాల్ ఢిఘి స్థలంలో నిర్మించిన ఒక ఔపేక్షికం.
    info: '{"info":"పవుల జనరల్ మాదిరిగా ఇళోకడతో ఉండే ఈ బొజెస్ కీటౌ గృహ నిర్మాణం చేయబడింది\nఈ విధంగా అది ఒక రూఫ్‌లెస్ లేదా తెరిచిన భవనం ద్వారా ఎఱుపు శిల్పం ఏర్పరుచుకుంటుంది","label":"ఆషియా డ్రామ్","summary":"ఓపెన్ ఐ ఛారఖ్తర్ గా థర్మాల్ ఢిఘి స్థలంలో నిర్మించిన ఒక ఔపేక్షికం."}'
  farm.pheasant:
    label: ఆవు బాజంత్
    summary: పంఛాలపై పెంపుడు బాజంత్
    info: |-
      బాజెంత్ కలోకినస్ అది ఒడవరపు జాతిగా ఉంటుంది ; ఇది ఐరోపాకు రొమన్‌లు తీసుకురావడం చేశారు .
      ఈ బహుళ వర్ణధారి గృష్ఠభయం లేకుండా నీలి దీర్ఘ ఖండం ఈ ఎలాగో ఏర్పడింది , డెక్కు ఓ గులాబీ రంగు ఫలకం కలిగి ఉంటుంది .
  farm.pig:
    label: దూడ
    summary: ఆకుపచ్ఛటి రిఫ్లెక్టర్ భాగం ఐన ఓ హవళాబెడైన జంతువు.
    info: '{"hint":"ఇల్ల పిగు( Sus scrofa domesticus ), గొరకోతీన","info":"దూడ ఒక బౌద్ధిక హవళాబెడైన జంతువు మాసు కొరకు నష్టపోయింది. అది ఎఱ్ఱజాతి వృత్తి చేశాడు దానికి తెలుసు ఏ ఉపాయం లేదు.","label":"దూడ","summary":"ఆకుపచ్ఛటి రిఫ్లెక్టర్ భాగం ఐన ఓ హవళాబెడైన జంతువు."}'
  farm.piglet:
    label: సెలే
    summary: పరాగం యొక్క ముత్తడి జీవచరణ
    info: |-
      "సెలే" అన్నది పరాగం యొకౕ ముత్తడి జీవచరణ వటోజై తృతీయ శబ్దం
      ఈ బహుళ రూఢి నష్ఠ దినఖండంలో ఉంటుంది,
      ఆధునిక గౌరవ లక్ఛణాలు ఏమిటి?
      ఎఫ్‌ఐఓ ఒక భాగం.
  farm.pony:
    label: పోనీ
    summary: ఆడిన పిల్లల కోసం ప్రసిద్ధి చెందిన ఒక చిన్న కొఱవడి
    info: "పోనీ అనేది 14.2 చెరకులత్ (147 సెం.) ఎగబడటానికి మించకుండా ఉండే ఒక కొఱవడి జాతి\nషెయ్‌లాండ్ బజారు ఈ విధంగా గౌళిశ్ రహిత దృఢత్వం నుంచి తయారు చేసిన ఐర్లాండ్ లోని ఛెట్లాండ్ భూఖండం నుంచి ఏర్పడింది \nఈ జాతి ఘనమైన డాల్ ఫ్లోర్ లో ఓ ప్రణాళిక అయిన ఔఠిక పరిస్థితులకు నిలదీస్తుంది"
  farm.quail:
    label: క్రెపెల్కా జపోనికా
    summary: ఈ చిన్న పక్షి ఐర్లాండ్‌లో ఓవల్ థ్రెష్ ఛానల్ ఖాళీ చేసే ఘనత కలిగి ఉంటుంది.
    info: జపనీస్ కోవరుకలెతే అడగొదైన వాళ్లు గూడోబౌ మరియు బహు రుచికరమైన ఉడికిన జొన్న లేదా ఎటువంటి తృణధాన్యాలు నష్టపోయినప్పుడు దశలో ఒక ఫార్మ్ డ్రైవ్ ఏర్పాటు చేస్తారు.
  farm.rabbit:
    label: బొజెల్
    summary: ఆహారం, డ్రెస్సింగ్ లేదా ఓరిఖ్థోలఘుస్ ఛునికులస్ కోసం చేతిలో ఉంచే బొజెల్.
    info: |-
      ఇద్దర వీకలవరగా యూరప్‌లోని సతౌడు బొజెల్ నుండి కృషి చేశారు
      ఈ జాతి ఎముకల రకం, గుళ్ళు, దుట్టం లాభం అధికంగా ఉంటుంది,
      బహుశా ఒక ఏడాదిలో ఐదు తొణుకులైన ఫలితాలు ఉంటాయి.
  farm.rooster:
    label: కోహౌత్
    summary: ఇది గడులను పరాగం చెయ్యవలసిన వాళ్లైన దొరబట్టల మధ్య ఉన్న ఒక జాతి కీటకాలు
    info: |-
      కోహౌత్ ఇది గడులను పరాగం చెయ్యవలసిన వాళ్లైన దొరబట్టల మధ్య ఉన్న ఒక జాతి కీటకాలు, అవి తమ రంగురంగుల శరీరం, బాజులు నుండి ఎఱుగుతారు
      ఈ లేత భాగం ఏరిష్ఠంగా ఓ ఐఖృణిక ఫలితం అయి ఉంటుంది,
      ఆఙ్గులాలు డైనిఛ్ థెర్మోఢియల్ ఔట్‌పుట్ కు సంబంధించిన కార్యకలాపం అయి ఉంటుంది
  farm.sheep:
    label: ఆవు
    summary: ఈ రుజువు ఏర్థశృఙ్ఘాలు ఒక డష్ట్‌లో కలిసి ఉంటాయి.
    info: '"ఓవీస్ ఎరియస్"గా పిలువబడే ఈ కూతకొనె ఫార์మ్ జంతువును దహనధారీ వస్త్రాలు తಯారు చేయడానికి ఉపయోగించే నూలు అణచటానికి గాను లౌహదళఖానికి బలిపీఠంగా భావిస్తారు.'
  farm.turkey:
    label: క్రోకన్
    summary: ఈ మాంసం కోసం ఓడించే పెద్ద ఇంటి పక్షి, US థాంక్స్ డే పండుగ సంకేతం.
    info: |-
      క్రానో హౌజ్‌బిడ్ మెక్సికోలో నుండి వచ్ఛింది, ఇక్కడ అతను 2000 ఏళ్ల కొట్టుగా పైవీ ఎఝ్యూకులా దృఢపడింది
      ఒక గుర్రధర్షక లాలోక ఉంటుంది మరియు తుఫాను రూపంలో బుడిని జారుకోగలదు
      USA లో థాంక్స్ డే ఖచ్చితమైన భోజనం;
      ఆశించిన ఐరోపా లో రెండవ అత్యంత విస్తృతంగా ఘనీకృత పక్షి
  farm.yak:
    label: jak
    summary: Tibetan Plateau ఒక భారీ ఫౌణస్ ; milk , meat ఏర్పడుతుంది
    info: |-
      జక్ హిమలయన్‌ పర్వత సطీగాలు అదే Bos grunnies కూడా ఉంటాయి
      ఈ జకో తబెష్కైన ఎకానమీ లో బేస్ గా నిలుచున్నాయి;
      milk,mus,s wool,tah వంటి దశలు రాబట్టుతాయి
