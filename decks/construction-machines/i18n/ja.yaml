lang: ja
pivot: false
title: はたらく車
cards:
  machine.excavator:
    label: ショベルカー
    summary: 長いうでと、歯のついたバケットで地面をほる機械です。
    info: |
      ショベルカーはキャタピラで走るので、やわらかいどろにしずみません。
      運転席とうでがついた上の部分は、ぐるっと一回転できます。
      うでは油圧で動きます。油をとても強い力でパイプに送りこむのです。
  machine.mini_excavator:
    label: ミニショベル
    summary: 庭の門も通れる、小さなショベルカーです。
    info: |
      ミニショベルは、庭や中庭、せまい道など、大きなショベルカーが入れない場所でほります。
      ふつうはゴムのキャタピラで走るので、ほそうした地面をいためません。
      前についている小さな板で、土をあなにもどします。
  machine.backhoe_loader:
    label: バックホーローダー
    summary: 前にすくう道具、うしろにほるうでがあるトラクターです。
    info: |
      バックホーローダーは、2つの機械が1つになったものです。前はローダー、うしろはショベルカーです。
      うしろのうでを使うときは、運転手がいすをくるっと回します。
      タイヤで走るので、道路を走って次の仕事場へ行けます。
  machine.wheel_loader:
    label: ホイールローダー
    summary: 大きなタイヤで、砂やじゃりをすくって運ぶ機械です。
    info: |
      ホイールローダーは、前の大きなバケットをいっぱいにして、トラックに入れます。
      車体がまん中で曲がるので、せまい場所でも向きを変えられます。
      いちばん大きなホイールローダーのタイヤは、大人の背よりも高いです。
  machine.bulldozer:
    label: ブルドーザー
    summary: 広い板で土をおす、キャタピラの力持ちの機械です。
    info: |
      ブルドーザーは、前についている鉄の板で、土や石や砂をおします。
      うしろのつめはリッパーとよばれ、かたい地面をくだきます。
      はばの広いキャタピラが重さを広げるので、やわらかい土の上も走れます。
  machine.skid_steer:
    label: スキッドステアローダー
    summary: その場でくるっと回れる、箱の形をした小さなローダーです。
    info: |
      スキッドステアローダーは、かた方のタイヤをもうかた方より速く回して曲がります。
      だから、戦車のようにその場でくるっと回れます。
      バケットのかわりに、フォークやブラシ、ドリルなど、いろいろな道具をつけられます。
  machine.dump_truck:
    label: ダンプカー
    summary: にだいをかたむけて、うしろから荷物をおろすトラックです。
    info: |
      ダンプカーは、鉄の箱の形をしたにだいで、砂やじゃりや土を運びます。
      油圧のピストンがにだいの前をもち上げると、荷物がうしろからすべり落ちます。
      それからにだいが下にもどって、また次の荷物を取りに行きます。
  machine.articulated_hauler:
    label: アーティキュレートダンプ
    summary: まん中で曲がる、でこぼこ道が得意なダンプです。
    info: |
      アーティキュレートダンプは、2つの部分がつなぎ目でつながっていて、まん中で曲がります。
      だから、ふつうのトラックが動けなくなるようなどろやでこぼこも走れます。
      道路ではなく、工事現場や石切り場のためにつくられています。
  machine.mining_truck:
    label: 鉱山用ダンプ
    summary: 大きな露天ぼりの鉱山ではたらく、きょだいなダンプです。
    info: |
      鉱山用ダンプは、世界でいちばん大きなトラックのなかまです。
      タイヤは大人の背より高く、運転手ははしごをのぼって運転席に行きます。
      いちばん大きなものは、一度に400トン以上の石を運べます。
  machine.concrete_mixer:
    label: ミキサー車
    summary: 大きなドラムがずっと回っているトラックです。
    info: |
      ミキサー車は、工事現場にできたてのコンクリートを運びます。
      とちゅうもドラムが回り続けるので、中でコンクリートがかたまりません。
      ドラムが反対に回ると、コンクリートがといを通って流れ出ます。
  machine.concrete_pump:
    label: コンクリートポンプ車
    summary: おりたためる長いうでで、高い所にコンクリートを流しこむトラックです。
    info: |
      コンクリートポンプ車は、長いうでにそったパイプで、ぬれたコンクリートをおし出します。
      うでは大きな指のようにのびて、ビルの上の階までとどきます。
      横についた鉄の足が、トラックがたおれないようにささえます。
  machine.tower_crane:
    label: タワークレーン
    summary: 工事現場の上に高く立っているクレーンです。
    info: |
      タワークレーンは、鉄のはりやコンクリートなどの重い物を、ビルのてっぺんまでつり上げます。
      運転する人は、タワーの中をのぼって、上の小さな運転席に行きます。
      短いうでについた重いコンクリートのかたまりが、長いうでの荷物とつり合いをとります。
  machine.mobile_crane:
    label: クレーン車
    summary: うでがどんどん長くのびる、トラックについたクレーンです。
    info: |
      クレーン車は、自分のタイヤで工事現場まで走って行きます。
      うでは望遠鏡のようにすべり出て、ずっと長くなります。
      つり上げる前に、たおれないように両側にじょうぶな足を出します。
  machine.crawler_crane:
    label: クローラークレーン
    summary: 骨組みの形をした高いうでをもつ、キャタピラのとても強いクレーンです。
    info: |
      クローラークレーンはキャタピラの上に立っていて、とても重い体の重さを地面に広げます。
      長いうでは鉄の骨組みでできていて、軽いのにとてもじょうぶです。
      大きなクローラークレーンは、橋や風車の部品をつり上げます。
  machine.road_roller:
    label: ロードローラー
    summary: つるつるの鉄のローラーで、アスファルトを平らにする重い機械です。
    info: |
      ロードローラーは、できたてのアスファルトの上をゆっくり走って、平らでかたくおしかためます。
      鉄のローラーはとても速くふるえることができ、道路をもっとしっかりかためます。
      熱いアスファルトがくっつかないように、ローラーに水をかけます。
  machine.asphalt_paver:
    label: アスファルトフィニッシャー
    summary: 道路の新しいそうをしく機械です。
    info: |
      トラックが、熱いアスファルトをフィニッシャーの前に入れます。
      フィニッシャーはゆっくり前に進みながら、うしろにアスファルトを同じ厚さで広げます。
      すぐうしろには、たいていロードローラーがついて来ます。
  machine.motor_grader:
    label: モーターグレーダー
    summary: おなかの下の板で道路を平らにする、長い機械です。
    info: |
      モーターグレーダーは、前のタイヤとうしろのタイヤのあいだの下に、長い板があります。
      板はかたむけたり回したりできるので、地面をまっ平らにも、少しななめにもできます。
      じゃり道を平らにしたり、新しい道路をつくる前に地面をととのえたりします。
  machine.forklift:
    label: フォークリフト
    summary: 2本のフォークで荷物をもち上げる、小さな車です。
    info: |
      フォークリフトは、2本のフォークをパレットの下にさしこんで、もち上げます。
      倉庫や工場やお店ではたらいています。
      うしろについた重いおもりが、荷物で前にたおれないようにしています。
  machine.telehandler:
    label: テレハンドラー
    summary: のびる長いうでで、物を高くもち上げるローダーです。
    info: |
      テレハンドラーは、長くのびるうでがついたフォークリフトのような機械です。
      レンガをのせたパレットを、屋根の上や、建物のおくまで運べます。
      工事現場や農場で使われ、農場では干し草のかたまりをもち上げます。
  machine.boom_lift:
    label: 高所作業車
    summary: かごに人を乗せて、高い所までもち上げる機械です。
    info: |
      高所作業車は、手すりのついた小さな台を、空高くもち上げます。
      はたらく人はそこに立って、かべをぬったり、電灯を直したり、木の枝を切ったりします。
      関節のあるうでは、上にのびるだけでなく、じゃまな物をこえてとどくこともできます。
  machine.scissor_lift:
    label: シザーリフト
    summary: ばってんに組んだささえで、まっすぐ上に上がる台です。
    info: |
      シザーリフトには、はさみのように開く、交差した金属のささえがあります。
      ささえが開くと、上の台がまっすぐ上に上がります。
      はたらく人は、ホールや倉庫で天井にとどくためにこれを使います。
  machine.demolition_breaker:
    label: 油圧ブレーカー
    summary: バケットのかわりにハンマーをつけて、コンクリートをこわすショベルカーです。
    info: |
      油圧ブレーカーは、ショベルカーのうでにとりつけた、きょだいなハンマーです。
      コンクリートや岩を1秒に何回もたたいて、ひびを入れます。
      古い建物をこわしたり、石切り場で岩をくだいたりするのに役立ちます。
  machine.pile_driver:
    label: くい打ち機
    summary: 長いくいを地面の深くまで打ちこむ機械です。
    info: |
      くい打ち機は、くいとよばれる鉄やコンクリートの長い柱を、地面におしこんだり打ちこんだりします。
      地面がやわらかい場所では、くいが建物や橋をささえます。
      高い柱があって、くいをまっすぐにたもちます。
  machine.drilling_rig:
    label: アースオーガー
    summary: 地面に深いあなをあける、キャタピラの機械です。
    info: |
      アースオーガーは、長いらせん形のドリルを回して、深いあなをほります。
      土はらせんにそって上がってきて、あなのまわりにつもります。
      あなにはコンクリートを流しこんで、じょうぶな土台をつくります。
  machine.tunnel_boring_machine:
    label: シールドマシン
    summary: 地面の下にトンネルをほる、きょだいな丸い機械です。
    info: |
      シールドマシンの前には、けずるための円ばんがついた大きな丸い車輪があり、ゆっくり回りながら岩をけずって進みます。
      そのうしろで、機械はトンネルのかべにコンクリートのブロックをはっていきます。
      シールドマシンには、よく女の子の名前がつけられます。
  machine.cold_planer:
    label: 路面切削機
    summary: 古くなってすりへったアスファルトをけずり取る機械です。
    info: |
      路面切削機の下には、するどい歯がついた回るドラムがあります。
      古い道路のいちばん上のそうをけずり取り、ベルトコンベアがそのかけらをトラックにつみこみます。
      古いアスファルトは、新しい道路にもう一度使うことができます。
  machine.plate_compactor:
    label: プレートコンパクター
    summary: 人がおして地面をかためる、ぶるぶるふるえる小さな板です。
    info: |
      プレートコンパクターには、とても速くふるえる重い鉄の板があります。
      はたらく人がうしろを歩いて、ハンドルで向きを変えます。
      歩道やテラスや道の下の、砂やじゃりをかためます。
  machine.sheepsfoot_roller:
    label: タンピングローラー
    summary: でこぼこのローラーで土をかためる機械です。
    info: |
      タンピングローラーのローラーには、パッドとよばれるでっぱりがたくさんついています。
      パッドが土に深くくいこんで、つるつるのローラーよりもしっかりかためます。
      新しい道路の下やダムなど、土やねん土をかためるのに使われます。
  machine.bucket_wheel_excavator:
    label: バケットホイールエクスカベーター
    summary: バケットがたくさんついた車輪が回る、ものすごく大きな機械です。
    info: |
      バケットホイールエクスカベーターは、大きな露天ぼりの鉱山で石炭や土をほります。
      うでの先で、バケットのついた大きな車輪が回り、長いベルトコンベアに土をのせていきます。
      いちばん大きなものは長さが200メートル以上あり、陸の上でいちばん大きな機械のなかまです。
  machine.loader_crane_truck:
    label: クレーン付きトラック
    summary: おりたためるうでで、荷物をのせたりおろしたりするトラックです。
    info: |
      クレーン付きトラックは、運転席のうしろに、おりたためる自分の油圧のうでをもっています。
      ほかの機械がなくても、レンガやパイプやパレットをおろせます。
      つり上げる前に、横に足を出して、ぐらぐらしないようにします。
