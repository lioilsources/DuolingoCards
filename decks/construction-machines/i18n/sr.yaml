lang: sr
pivot: false
title: Багери и грађевинске машине
cards:
  machine.excavator:
    label: багер
    summary: Машина за копање с дугачком руком и кашиком пуном зуба.
    info: |
      Багер се креће на гусеницама, па не тоне у меко блато.
      Цео горњи део с кабином и руком може да се окрене укруг.
      Руку покреће хидраулика, односно уље које се под великим притиском гура кроз цеви.
  machine.mini_excavator:
    label: мини-багер
    summary: Мали багер који може да прође кроз баштенску капију.
    info: |
      Мини-багер копа тамо где велики не би могао да стане, на пример у баштама, двориштима и уским улицама.
      Обично се креће на гуменим гусеницама, па не оштећује поплочане површине.
      Мала раоница спреда враћа земљу назад у рупу.
  machine.backhoe_loader:
    label: ровокопач
    summary: Трактор с кашиком спреда и руком за копање позади.
    info: |
      Ровокопач је две машине у једној, спреда утоваривач, а позади багер.
      Возач окрене седиште да би радио задњом руком.
      Креће се на точковима, па може путем да се одвезе с једног градилишта на друго.
  machine.wheel_loader:
    label: утоваривач
    summary: Машина с огромним гумама која захвата и превози песак и шљунак.
    info: |
      Утоваривач напуни своју велику предњу кашику и истресе је у камионе.
      Тело му се савија у средини, па може да скреће на уским местима.
      Највећи утоваривачи имају гуме више од одраслог човека.
  machine.bulldozer:
    label: булдожер
    summary: Снажна машина на гусеницама која гура земљу широким ножем.
    info: |
      Булдожер гура земљу, камење и песак челичним ножем спреда.
      Канџа позади, која се зове рипер, разбија тврдо тле.
      Широке гусенице распоређују његову тежину, па може да вози по растреситој земљи.
  machine.skid_steer:
    label: мини-утоваривач
    summary: Мали утоваривач у облику кутије који може да се окрене у месту.
    info: |
      Мини-утоваривач скреће тако што точкове с једне стране врти брже него с друге.
      Тако може да се окрене у месту, скоро као тенк.
      Уместо кашике може да носи много других алата, на пример виљушке, четке или бушилицу.
  machine.dump_truck:
    label: кипер
    summary: Камион који истоварује терет уназад.
    info: |
      Кипер вози песак, шљунак или земљу у челичном сандуку.
      Хидраулични клипови подигну предњи део сандука, а терет склизне позади.
      Онда се сандук спусти и кипер одлази по још.
  machine.articulated_hauler:
    label: зглобни дампер
    summary: Кипер за нераван терен који се савија у средини.
    info: |
      Зглобни дампер има два дела спојена зглобом, па се савија у средини.
      Зато пролази кроз блато и преко неравнина где би се обичан камион заглавио.
      Направљен је за градилишта и каменоломе, а не за путеве.
  machine.mining_truck:
    label: рударски дампер
    summary: Џиновски кипер који ради у огромним површинским рудницима.
    info: |
      Рударски дампери спадају међу највеће камионе на свету.
      Гуме су им више од одраслог човека, а возач се до кабине пење мердевинама.
      Највећи могу одједном да превезу више од 400 тона камена.
  machine.concrete_mixer:
    label: миксер за бетон
    summary: Камион с великим бубњем који се стално окреће.
    info: |
      Миксер за бетон довози свеж бетон на градилиште.
      Бубањ се окреће целим путем, да се бетон унутра не стврдне.
      Кад се бубањ окрене на другу страну, бетон се излива низ жлеб.
  machine.concrete_pump:
    label: пумпа за бетон
    summary: Камион с дугачком склопивом руком који излива бетон високо.
    info: |
      Пумпа за бетон гура влажан бетон кроз цев дуж своје дугачке руке.
      Рука се расклопи као џиновски прст и досегне до горњих спратова зграде.
      Челичне ноге са стране чувају камион да се не преврне.
  machine.tower_crane:
    label: торањска дизалица
    summary: Висока дизалица која стоји изнад градилишта.
    info: |
      Торањска дизалица подиже тешке терете, као што су челичне греде и бетон, до врха зграде.
      Дизаличар се пење кроз торањ до мале кабине на врху.
      Тешки бетонски блокови на краћој руци уравнотежују терет на дужој руци.
  machine.mobile_crane:
    label: аутодизалица
    summary: Дизалица на камиону с руком која се извлачи све дуже и дуже.
    info: |
      Аутодизалица долази на градилиште на сопственим точковима.
      Рука јој је телескопска, извлачи се као дурбин и постаје много дужа.
      Пре подизања извуче јаке ноге на обе стране да се не би преврнула.
  machine.crawler_crane:
    label: гусенична дизалица
    summary: Веома снажна дизалица на гусеницама с високом решеткастом руком.
    info: |
      Гусенична дизалица стоји на гусеницама које распоређују њену огромну тежину по тлу.
      Њена дугачка рука направљена је од челичне решетке, лака, али веома чврста.
      Велике гусеничне дизалице подижу делове мостова и ветротурбина.
  machine.road_roller:
    label: ваљак
    summary: Тешка машина с глатким челичним бубњевима која изравнава асфалт.
    info: |
      Ваљак полако вози преко свежег асфалта и сабија га да буде раван и тврд.
      Његови челични бубњеви могу веома брзо да вибрирају, па још боље набијају пут.
      Бубњеви се прскају водом да се врући асфалт не би лепио за њих.
  machine.asphalt_paver:
    label: финишер
    summary: Машина која поставља нови слој пута.
    info: |
      Камиони истресају врући асфалт у предњи део финишера.
      Финишер полако иде напред и разастире га иза себе у равномерном слоју.
      Одмах иза њега обично иде ваљак.
  machine.motor_grader:
    label: грејдер
    summary: Дугачка машина с ножем испод стомака која изравнава путеве.
    info: |
      Грејдер има дугачак нож одоздо, између предњих и задњих точкова.
      Нож може да се нагиње и окреће, па тло буде савршено равно или благо нагнуто.
      Грејдери изравнавају макадамске путеве и припремају тло пре него што се направи нови пут.
  machine.forklift:
    label: виљушкар
    summary: Мало возило које подиже терет на две виљушке.
    info: |
      Виљушкар подвуче две виљушке испод палете и подигне је.
      Ради у магацинима, фабрикама и продавницама.
      Тежак противтег позади чува га да се под теретом не преврне напред.
  machine.telehandler:
    label: телескопски утоваривач
    summary: Утоваривач с дугачком руком која се извлачи да подиже ствари високо.
    info: |
      Телескопски утоваривач је као виљушкар с дугачком телескопском руком.
      Може да подигне палету цигли на кров или да је дода дубоко у зграду.
      Користи се на градилиштима и на фармама, где подиже бале сена.
  machine.boom_lift:
    label: дизалица с корпом
    summary: Машина која подиже раднике високо у корпи.
    info: |
      Дизалица с корпом подиже високо у ваздух малу платформу с оградом.
      Радници стоје у њој док фарбају зидове, поправљају светла или секу гране.
      Њена зглобна рука може да досегне увис, а и преко препрека.
  machine.scissor_lift:
    label: маказаста платформа
    summary: Платформа која се диже право навише на укрштеним подупирачима.
    info: |
      Маказаста платформа има укрштене металне подупираче који се отварају као маказе.
      Кад се отварају, платформа на врху диже се право навише.
      Радници је користе у халама и магацинима да би дохватили плафон.
  machine.demolition_breaker:
    label: хидраулични чекић
    summary: Багер с чекићем уместо кашике који разбија бетон.
    info: |
      Хидраулични чекић је огроман чекић причвршћен за руку багера.
      Удара по бетону и стени много пута у секунди док не напукну.
      Помаже да се руше старе зграде и разбија стена у каменоломима.
  machine.pile_driver:
    label: машина за побијање шипова
    summary: Машина која забија дугачке стубове дубоко у земљу.
    info: |
      Машина за побијање шипова утискује или забија у земљу дугачке челичне или бетонске стубове, који се зову шипови.
      Шипови држе зграде и мостове тамо где је тло меко.
      Има висок јарбол који држи шип савршено усправно.
  machine.drilling_rig:
    label: бушилица за тло
    summary: Машина на гусеницама која буши дубоке рупе у земљи.
    info: |
      Бушилица за тло окреће дугачку спиралну бургију која буши дубоку рупу.
      Земља излази нагоре дуж спирале и гомила се око рупе.
      Рупе се пуне бетоном да би се добили чврсти темељи.
  machine.tunnel_boring_machine:
    label: машина за копање тунела
    summary: Џиновска округла машина која копа тунеле под земљом.
    info: |
      Спреда машина за копање тунела има огроман округли точак с дисковима за сечење, који се полако окреће и меље стену.
      Иза њега машина облаже зидове тунела бетонским деловима.
      Машине за копање тунела често добијају женска имена.
  machine.cold_planer:
    label: глодалица за асфалт
    summary: Машина која струже стари, истрошени асфалт.
    info: |
      Глодалица за асфалт има одоздо бубањ који се окреће и има оштре зубе.
      Она састругне горњи слој старог пута, а покретна трака утовари комаде у камион.
      Стари асфалт може поново да се искористи у новом путу.
  machine.plate_compactor:
    label: вибро-плоча
    summary: Мала плоча која се тресе, коју радник гура да набије тло.
    info: |
      Вибро-плоча има тешку челичну плочу која се веома брзо тресе.
      Радник хода иза ње и управља њом помоћу дршке.
      Она набија песак и шљунак испод стаза, тераса и тротоара.
  machine.sheepsfoot_roller:
    label: јежевац
    summary: Ваљак с квргавим бубњем који набија земљу.
    info: |
      Бубањ јежевца прекривен је избочинама које се зову папуче.
      Папуче се утискују дубоко у земљу и набијају је боље од глатког бубња.
      Користи се за земљу и глину, на пример испод нових путева или за бране.
  machine.bucket_wheel_excavator:
    label: роторни багер
    summary: Гигантска машина с точком пуним кашика који се окреће.
    info: |
      Роторни багер копа угаљ и земљу у огромним површинским коповима.
      Велики точак с кашикама окреће се на крају његове руке и пуни дугачку покретну траку.
      Највећи су дужи од 200 метара, па спадају међу највеће машине на копну.
  machine.loader_crane_truck:
    label: камион с краном
    summary: Камион са склопивом руком који сам утовара и истовара терет.
    info: |
      Камион с краном носи своју склопиву хидрауличну руку одмах иза кабине.
      Може да истовари цигле, цеви или палете без икакве друге машине.
      Пре подизања извуче ноге са стране да би стајао стабилно.
