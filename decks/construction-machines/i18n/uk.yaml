lang: uk
pivot: false
title: Екскаватори та будівельна техніка
cards:
  machine.excavator:
    label: екскаватор
    summary: Машина для копання з довгою стрілою і ковшем із зубцями.
    info: |
      Екскаватор їздить на гусеницях, тому не провалюється в м'яку багнюку.
      Уся верхня частина з кабіною та стрілою може повертатися по колу.
      Стрілу рухає гідравліка — олива, яку під великим тиском проганяють трубками.
  machine.mini_excavator:
    label: міні-екскаватор
    summary: Маленький екскаватор, який пролізе в садову хвіртку.
    info: |
      Міні-екскаватор копає там, де великий не вміститься, наприклад у садах, на подвір'ях і вузьких вуличках.
      Зазвичай він їздить на гумових гусеницях, тому не псує плитку й асфальт.
      Маленький відвал спереду згортає землю назад у яму.
  machine.backhoe_loader:
    label: екскаватор-навантажувач
    summary: Трактор із ковшем спереду і стрілою для копання ззаду.
    info: |
      Екскаватор-навантажувач — це дві машини в одній, спереду навантажувач, а ззаду екскаватор.
      Щоб працювати задньою стрілою, водій розвертає своє сидіння.
      Він їздить на колесах, тому може доїхати дорогою з одного будівництва на інше.
  machine.wheel_loader:
    label: фронтальний навантажувач
    summary: Машина з величезними колесами, яка набирає і возить пісок та щебінь.
    info: |
      Фронтальний навантажувач набирає повний великий ківш спереду і висипає його у вантажівки.
      Його корпус згинається посередині, тому він може повертати в тісних місцях.
      У найбільших навантажувачів колеса вищі за дорослу людину.
  machine.bulldozer:
    label: бульдозер
    summary: Сильна машина на гусеницях, яка штовхає землю широким відвалом.
    info: |
      Бульдозер штовхає землю, каміння й пісок сталевим відвалом спереду.
      Кіготь ззаду, який називається розпушувачем, розбиває тверду землю.
      Широкі гусениці розподіляють його вагу, тому він може їздити пухкою землею.
  machine.skid_steer:
    label: міні-навантажувач
    summary: Маленький навантажувач, схожий на коробку, який розвертається на місці.
    info: |
      Міні-навантажувач повертає так, що колеса з одного боку крутяться швидше, ніж з іншого.
      Тому він може розвернутися на місці, майже як танк.
      Замість ковша на нього можна поставити багато інших інструментів, наприклад вила, щітки або бур.
  machine.dump_truck:
    label: самоскид
    summary: Вантажівка, яка висипає вантаж назад.
    info: |
      Самоскид возить пісок, щебінь або землю в сталевому кузові.
      Гідравлічні поршні піднімають передню частину кузова, і вантаж з'їжджає назад.
      Потім кузов опускається, і самоскид їде по новий вантаж.
  machine.articulated_hauler:
    label: зчленований самоскид
    summary: Самоскид для бездоріжжя, який згинається посередині.
    info: |
      Зчленований самоскид має дві частини, з'єднані шарніром, тому він згинається посередині.
      Так він проїжджає багнюкою та вибоями там, де звичайна вантажівка застрягла б.
      Його роблять для будівництв і кар'єрів, а не для доріг.
  machine.mining_truck:
    label: кар'єрний самоскид
    summary: Гігантський самоскид, який працює у величезних кар'єрах.
    info: |
      Кар'єрні самоскиди — одні з найбільших вантажівок у світі.
      Їхні колеса вищі за дорослу людину, а водій вилазить до кабіни драбинкою.
      Найбільші можуть перевезти за один раз понад 400 тонн каміння.
  machine.concrete_mixer:
    label: бетономішалка
    summary: Вантажівка з великою бочкою, яка весь час крутиться.
    info: |
      Бетономішалка привозить на будівництво свіжий бетон.
      Бочка крутиться всю дорогу, щоб бетон не застиг усередині.
      Коли бочка крутиться в інший бік, бетон виливається жолобом.
  machine.concrete_pump:
    label: бетононасос
    summary: Вантажівка з довгою складаною стрілою, яка подає бетон високо вгору.
    info: |
      Бетононасос качає рідкий бетон трубою вздовж своєї довгої стріли.
      Стріла розкладається, як величезний палець, і дістає до верхніх поверхів будинку.
      Сталеві опори з боків не дають вантажівці перекинутися.
  machine.tower_crane:
    label: баштовий кран
    summary: Високий кран, який стоїть над будівництвом.
    info: |
      Баштовий кран піднімає важкі вантажі, наприклад сталеві балки й бетон, на самий верх будівлі.
      Кранівник вилазить усередині башти нагору, до маленької кабіни.
      Важкі бетонні блоки на короткій стрілі врівноважують вантаж на довгій стрілі.
  machine.mobile_crane:
    label: автокран
    summary: Кран на вантажівці зі стрілою, яка висувається дедалі довше.
    info: |
      Автокран сам приїжджає на будівництво на власних колесах.
      Його стріла телескопічна, вона висувається, як підзорна труба, і стає набагато довшою.
      Перед підйомом він виставляє міцні опори з обох боків, щоб не перекинутися.
  machine.crawler_crane:
    label: гусеничний кран
    summary: Дуже сильний кран на гусеницях із високою ґратчастою стрілою.
    info: |
      Гусеничний кран стоїть на гусеницях, які розподіляють його величезну вагу по землі.
      Його довга стріла зроблена зі сталевих ґрат, легких, але дуже міцних.
      Великі гусеничні крани піднімають частини мостів і вітряків.
  machine.road_roller:
    label: дорожній коток
    summary: Важка машина з гладкими сталевими вальцями, яка вирівнює асфальт.
    info: |
      Дорожній коток повільно їде свіжим асфальтом і робить його рівним і твердим.
      Його сталеві вальці можуть дуже швидко трястися, і від цього дорога ущільнюється ще краще.
      Вальці поливають водою, щоб гарячий асфальт до них не прилипав.
  machine.asphalt_paver:
    label: асфальтоукладач
    summary: Машина, яка кладе новий шар дороги.
    info: |
      Вантажівки висипають гарячий асфальт у передню частину асфальтоукладача.
      Асфальтоукладач повільно їде вперед і розкладає його позаду себе рівним шаром.
      Зазвичай одразу за ним їде дорожній коток.
  machine.motor_grader:
    label: грейдер
    summary: Довга машина з ножем під черевом, яка вирівнює дороги.
    info: |
      Грейдер має знизу довгий ніж, між передніми й задніми колесами.
      Ніж може нахилятися й повертатися, тому земля виходить зовсім рівною або з невеликим нахилом.
      Грейдери вирівнюють гравійні дороги й готують землю перед будівництвом нової дороги.
  machine.forklift:
    label: вилковий навантажувач
    summary: Маленька машина, яка піднімає вантажі на двох вилах.
    info: |
      Вилковий навантажувач підсуває дві вили під піддон і піднімає його.
      Він працює на складах, заводах і в магазинах.
      Важка противага ззаду не дає йому перекинутися вперед під вантажем.
  machine.telehandler:
    label: телескопічний навантажувач
    summary: Навантажувач із довгою висувною стрілою, який піднімає речі високо.
    info: |
      Телескопічний навантажувач схожий на вилковий навантажувач із довгою телескопічною стрілою.
      Він може підняти піддон цегли на дах або подати його далеко всередину будівлі.
      Його використовують на будівництвах і фермах, де він піднімає тюки сіна.
  machine.boom_lift:
    label: автовишка
    summary: Машина, яка піднімає робітників високо в кошику.
    info: |
      Автовишка піднімає високо в повітря маленький майданчик із поручнями.
      Робітники стоять у ньому, коли фарбують стіни, лагодять ліхтарі або обрізають гілки.
      Її колінчаста стріла може тягнутися вгору, а також понад перешкодами.
  machine.scissor_lift:
    label: ножичний підйомник
    summary: Майданчик, який піднімається прямо вгору на схрещених опорах.
    info: |
      Ножичний підйомник має схрещені металеві опори, які розкриваються, як ножиці.
      Коли вони розкриваються, майданчик угорі піднімається прямо вгору.
      Робітники користуються ним у цехах і на складах, щоб дістати до стелі.
  machine.demolition_breaker:
    label: гідромолот
    summary: Екскаватор із молотом замість ковша, який розбиває бетон.
    info: |
      Гідромолот — це величезний молот, закріплений на стрілі екскаватора.
      Він б'є по бетону й каменю багато разів на секунду, доки вони не тріснуть.
      Він допомагає зносити старі будинки й дробити каміння в кар'єрах.
  machine.pile_driver:
    label: палебійна машина
    summary: Машина, яка забиває довгі стовпи глибоко в землю.
    info: |
      Палебійна машина вдавлює або забиває в землю довгі сталеві чи бетонні стовпи, які називаються палями.
      Палі тримають будинки й мости там, де земля м'яка.
      Вона має високу щоглу, яка тримає палю ідеально рівно.
  machine.drilling_rig:
    label: бурова установка
    summary: Машина на гусеницях, яка свердлить глибокі ями в землі.
    info: |
      Бурова установка обертає довгий спіральний бур, який свердлить глибоку яму.
      Земля піднімається вгору по спіралі й збирається купою навколо ями.
      Ями заливають бетоном, щоб вийшов міцний фундамент.
  machine.tunnel_boring_machine:
    label: тунелепрохідницький щит
    summary: Гігантська кругла машина, яка копає тунелі під землею.
    info: |
      Спереду в тунелепрохідницького щита величезне кругле колесо з різальними дисками, яке повільно обертається й перетирає камінь.
      Позаду нього машина обкладає стіни тунелю бетонними блоками.
      Тунелепрохідницьким щитам часто дають жіночі імена.
  machine.cold_planer:
    label: дорожня фреза
    summary: Машина, яка зрізає старий, зношений асфальт.
    info: |
      Дорожня фреза має знизу барабан, що обертається, з гострими зубцями.
      Вона зрізає верхній шар старої дороги, а стрічковий транспортер вантажить шматки у вантажівку.
      Старий асфальт можна знову використати для нової дороги.
  machine.plate_compactor:
    label: віброплита
    summary: Маленька плита, що трясеться, яку робітник штовхає, щоб утрамбувати землю.
    info: |
      Віброплита має важку сталеву плиту, яка дуже швидко трясеться.
      Робітник іде за нею і спрямовує її за ручку.
      Вона утрамбовує пісок і щебінь під доріжками, терасами й тротуарами.
  machine.sheepsfoot_roller:
    label: кулачковий коток
    summary: Коток із горбкуватим вальцем, який утрамбовує землю.
    info: |
      Валець кулачкового котка вкритий виступами, які називаються кулачками.
      Кулачки глибоко вдавлюються в землю й ущільнюють її краще, ніж гладкий валець.
      Його використовують на землі та глині, наприклад під новими дорогами або для гребель.
  machine.bucket_wheel_excavator:
    label: роторний екскаватор
    summary: Гігантська машина з колесом, повним ковшів, яке обертається.
    info: |
      Роторний екскаватор видобуває вугілля й землю у величезних кар'єрах.
      Велике колесо з ковшами крутиться на кінці його стріли й наповнює довгий стрічковий транспортер.
      Найбільші довші за 200 метрів, тому це одні з найбільших машин на суходолі.
  machine.loader_crane_truck:
    label: вантажівка з краном
    summary: Вантажівка зі складаною стрілою, яка сама вантажить і розвантажує вантажі.
    info: |
      Вантажівка з краном возить свою складану гідравлічну стрілу одразу за кабіною.
      Вона може розвантажити цеглу, труби чи піддони без жодної іншої машини.
      Перед підйомом вона виставляє опори з боків, щоб стояти стійко.
