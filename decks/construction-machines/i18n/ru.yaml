lang: ru
pivot: false
title: Экскаваторы и строительная техника
cards:
  machine.excavator:
    label: экскаватор
    summary: Копающая машина с длинной стрелой и ковшом с зубьями.
    info: |
      Экскаватор ездит на гусеницах, поэтому не проваливается в мягкую грязь.
      Вся верхняя часть с кабиной и стрелой может поворачиваться по кругу.
      Стрелу двигает гидравлика — масло, которое под большим давлением прокачивают по трубкам.
  machine.mini_excavator:
    label: мини-экскаватор
    summary: Маленький экскаватор, который пролезет в садовую калитку.
    info: |
      Мини-экскаватор копает там, где большой не поместится, например в садах, во дворах и на узких улочках.
      Обычно он ездит на резиновых гусеницах, поэтому не портит плитку и асфальт.
      Маленький отвал спереди сгребает землю обратно в яму.
  machine.backhoe_loader:
    label: экскаватор-погрузчик
    summary: Трактор с ковшом спереди и копающей стрелой сзади.
    info: |
      Экскаватор-погрузчик — это две машины в одной, спереди погрузчик, а сзади экскаватор.
      Чтобы работать задней стрелой, водитель разворачивает своё сиденье.
      Он ездит на колёсах, поэтому может доехать по дороге с одной стройки на другую.
  machine.wheel_loader:
    label: фронтальный погрузчик
    summary: Машина с огромными колёсами, которая набирает и возит песок и щебень.
    info: |
      Фронтальный погрузчик набирает полный большой ковш спереди и высыпает его в грузовики.
      Его корпус сгибается посередине, поэтому он может поворачивать в тесных местах.
      У самых больших погрузчиков колёса выше взрослого человека.
  machine.bulldozer:
    label: бульдозер
    summary: Сильная машина на гусеницах, которая толкает землю широким отвалом.
    info: |
      Бульдозер толкает землю, камни и песок стальным отвалом спереди.
      Коготь сзади, который называется рыхлителем, разбивает твёрдую землю.
      Широкие гусеницы распределяют его вес, поэтому он может ездить по рыхлой земле.
  machine.skid_steer:
    label: мини-погрузчик
    summary: Маленький погрузчик, похожий на коробку, который разворачивается на месте.
    info: |
      Мини-погрузчик поворачивает так, что колёса с одной стороны крутятся быстрее, чем с другой.
      Поэтому он может развернуться на месте, почти как танк.
      Вместо ковша на него можно поставить много других инструментов, например вилы, щётки или бур.
  machine.dump_truck:
    label: самосвал
    summary: Грузовик, который высыпает груз назад.
    info: |
      Самосвал возит песок, щебень или землю в стальном кузове.
      Гидравлические поршни поднимают переднюю часть кузова, и груз съезжает назад.
      Потом кузов опускается, и самосвал едет за новым грузом.
  machine.articulated_hauler:
    label: сочленённый самосвал
    summary: Самосвал для бездорожья, который сгибается посередине.
    info: |
      У сочленённого самосвала две части, соединённые шарниром, поэтому он сгибается посередине.
      Так он проезжает по грязи и кочкам там, где обычный грузовик застрял бы.
      Его делают для строек и карьеров, а не для дорог.
  machine.mining_truck:
    label: карьерный самосвал
    summary: Гигантский самосвал, который работает в огромных карьерах.
    info: |
      Карьерные самосвалы — одни из самых больших грузовиков в мире.
      Их колёса выше взрослого человека, а водитель забирается в кабину по лесенке.
      Самые большие могут увезти за один раз больше 400 тонн камня.
  machine.concrete_mixer:
    label: бетономешалка
    summary: Грузовик с большой бочкой, которая всё время крутится.
    info: |
      Бетономешалка привозит на стройку свежий бетон.
      Бочка крутится всю дорогу, чтобы бетон не застыл внутри.
      Когда бочка крутится в другую сторону, бетон выливается по жёлобу.
  machine.concrete_pump:
    label: бетононасос
    summary: Грузовик с длинной складной стрелой, который подаёт бетон высоко наверх.
    info: |
      Бетононасос качает жидкий бетон по трубе вдоль своей длинной стрелы.
      Стрела раскладывается, как огромный палец, и достаёт до верхних этажей дома.
      Стальные опоры по бокам не дают грузовику опрокинуться.
  machine.tower_crane:
    label: башенный кран
    summary: Высокий кран, который стоит над стройкой.
    info: |
      Башенный кран поднимает тяжёлые грузы, например стальные балки и бетон, на самый верх здания.
      Крановщик забирается внутри башни наверх, в маленькую кабину.
      Тяжёлые бетонные блоки на короткой стреле уравновешивают груз на длинной стреле.
  machine.mobile_crane:
    label: автокран
    summary: Кран на грузовике со стрелой, которая выдвигается всё длиннее и длиннее.
    info: |
      Автокран сам приезжает на стройку на своих колёсах.
      Его стрела телескопическая, она выдвигается, как подзорная труба, и становится намного длиннее.
      Перед подъёмом груза он выставляет крепкие опоры с обеих сторон, чтобы не опрокинуться.
  machine.crawler_crane:
    label: гусеничный кран
    summary: Очень сильный кран на гусеницах с высокой решётчатой стрелой.
    info: |
      Гусеничный кран стоит на гусеницах, которые распределяют его огромный вес по земле.
      Его длинная стрела сделана из стальной решётки, лёгкой, но очень прочной.
      Большие гусеничные краны поднимают части мостов и ветряков.
  machine.road_roller:
    label: каток
    summary: Тяжёлая машина с гладкими стальными вальцами, которая утрамбовывает асфальт.
    info: |
      Каток медленно едет по свежему асфальту и делает его ровным и твёрдым.
      Его стальные вальцы могут очень быстро трястись, и от этого дорога уплотняется ещё лучше.
      Вальцы поливают водой, чтобы горячий асфальт к ним не прилипал.
  machine.asphalt_paver:
    label: асфальтоукладчик
    summary: Машина, которая укладывает новый слой дороги.
    info: |
      Грузовики высыпают горячий асфальт в переднюю часть асфальтоукладчика.
      Асфальтоукладчик медленно едет вперёд и раскладывает его позади себя ровным слоем.
      Обычно прямо за ним едет каток.
  machine.motor_grader:
    label: грейдер
    summary: Длинная машина с ножом под брюхом, которая выравнивает дороги.
    info: |
      У грейдера снизу длинный нож, между передними и задними колёсами.
      Нож может наклоняться и поворачиваться, поэтому земля получается совсем ровной или с небольшим наклоном.
      Грейдеры выравнивают гравийные дороги и готовят землю перед строительством новой дороги.
  machine.forklift:
    label: вилочный погрузчик
    summary: Маленькая машина, которая поднимает грузы на двух вилах.
    info: |
      Вилочный погрузчик подводит две вилы под поддон и поднимает его.
      Он работает на складах, на заводах и в магазинах.
      Тяжёлый противовес сзади не даёт ему опрокинуться вперёд под грузом.
  machine.telehandler:
    label: телескопический погрузчик
    summary: Погрузчик с длинной выдвижной стрелой, который поднимает вещи высоко.
    info: |
      Телескопический погрузчик похож на вилочный погрузчик с длинной телескопической стрелой.
      Он может поднять поддон с кирпичами на крышу или подать его далеко внутрь здания.
      Его используют на стройках и на фермах, где он поднимает тюки сена.
  machine.boom_lift:
    label: автовышка
    summary: Машина, которая поднимает рабочих высоко в корзине.
    info: |
      Автовышка поднимает высоко в воздух маленькую площадку с перилами.
      Рабочие стоят в ней, когда красят стены, чинят фонари или спиливают ветки.
      Её коленчатая стрела может тянуться вверх и через препятствия.
  machine.scissor_lift:
    label: ножничный подъёмник
    summary: Площадка, которая поднимается прямо вверх на скрещённых опорах.
    info: |
      У ножничного подъёмника скрещённые металлические опоры, которые раскрываются, как ножницы.
      Когда они раскрываются, площадка наверху поднимается прямо вверх.
      Рабочие пользуются им в цехах и на складах, чтобы дотянуться до потолка.
  machine.demolition_breaker:
    label: гидромолот
    summary: Экскаватор с молотом вместо ковша, который разбивает бетон.
    info: |
      Гидромолот — это огромный молот, закреплённый на стреле экскаватора.
      Он бьёт по бетону и камню много раз в секунду, пока они не треснут.
      Он помогает сносить старые дома и дробить камень в карьерах.
  machine.pile_driver:
    label: сваебой
    summary: Машина, которая забивает длинные столбы глубоко в землю.
    info: |
      Сваебой вдавливает или забивает в землю длинные стальные или бетонные столбы, которые называются сваями.
      Сваи держат дома и мосты там, где земля мягкая.
      У него высокая мачта, которая держит сваю совершенно прямо.
  machine.drilling_rig:
    label: буровая установка
    summary: Машина на гусеницах, которая сверлит глубокие ямы в земле.
    info: |
      Буровая установка вращает длинный спиральный бур, который сверлит глубокую яму.
      Земля поднимается вверх по спирали и собирается в кучу вокруг ямы.
      Ямы заливают бетоном, чтобы получился прочный фундамент.
  machine.tunnel_boring_machine:
    label: тоннелепроходческий щит
    summary: Гигантская круглая машина, которая копает тоннели под землёй.
    info: |
      Спереди у тоннелепроходческого щита огромное круглое колесо с режущими дисками, которое медленно вращается и перетирает камень.
      Позади него машина обкладывает стены тоннеля бетонными блоками.
      Тоннелепроходческим щитам часто дают женские имена.
  machine.cold_planer:
    label: дорожная фреза
    summary: Машина, которая срезает старый, изношенный асфальт.
    info: |
      У дорожной фрезы снизу вращающийся барабан с острыми зубьями.
      Она срезает верхний слой старой дороги, а лента транспортёра грузит куски в грузовик.
      Старый асфальт можно снова использовать для новой дороги.
  machine.plate_compactor:
    label: виброплита
    summary: Маленькая трясущаяся плита, которую рабочий толкает, чтобы утрамбовать землю.
    info: |
      У виброплиты тяжёлая стальная плита, которая очень быстро трясётся.
      Рабочий идёт за ней и направляет её за ручку.
      Она утрамбовывает песок и щебень под дорожками, террасами и тротуарами.
  machine.sheepsfoot_roller:
    label: кулачковый каток
    summary: Каток с бугристым вальцом, который утрамбовывает землю.
    info: |
      Валец кулачкового катка покрыт выступами, которые называются кулачками.
      Кулачки глубоко вдавливаются в землю и уплотняют её лучше, чем гладкий валец.
      Его используют на земле и глине, например под новыми дорогами или для плотин.
  machine.bucket_wheel_excavator:
    label: роторный экскаватор
    summary: Гигантская машина с вращающимся колесом, полным ковшей.
    info: |
      Роторный экскаватор добывает уголь и землю в огромных карьерах.
      Большое колесо с ковшами крутится на конце его стрелы и наполняет длинную ленту транспортёра.
      Самые большие длиннее 200 метров, поэтому это одни из самых больших машин на суше.
  machine.loader_crane_truck:
    label: грузовик с краном
    summary: Грузовик со складной стрелой, который сам грузит и разгружает грузы.
    info: |
      Грузовик с краном возит свою складную гидравлическую стрелу прямо за кабиной.
      Он может разгрузить кирпичи, трубы или поддоны без всякой другой машины.
      Перед подъёмом он выставляет опоры по бокам, чтобы стоять устойчиво.
