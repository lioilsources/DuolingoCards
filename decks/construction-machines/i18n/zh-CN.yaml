lang: zh-CN
pivot: false
title: 工程车
cards:
  machine.excavator:
    label: 挖掘机
    summary: 一台挖土的机器，有长长的手臂和一个满是牙齿的铲斗。
    info: |
      挖掘机靠履带行走，所以不会陷进软软的泥里。
      上面带驾驶室和手臂的整个部分，可以转上一整圈。
      手臂是靠液压来动的，就是用很大的压力把油推过管子。
  machine.mini_excavator:
    label: 小型挖掘机
    summary: 一台能穿过花园小门的小挖掘机。
    info: |
      大挖掘机进不去的地方，比如花园、院子和窄窄的街道，就由小型挖掘机来挖。
      它通常用橡胶履带行走，所以不会弄坏铺好的地面。
      前面的小铲板可以把土推回坑里。
  machine.backhoe_loader:
    label: 挖掘装载机
    summary: 一台前面有铲斗、后面有挖掘臂的拖拉机。
    info: |
      挖掘装载机是两台机器合在一起，前面是装载机，后面是挖掘机。
      要用后面的手臂干活时，司机会把座椅转过去。
      它用轮子行走，所以可以沿着公路从一个工地开到下一个工地。
  machine.wheel_loader:
    label: 铲车
    summary: 一台有巨大轮胎的机器，能铲起沙子和碎石运走。
    info: |
      铲车把前面的大铲斗装满，再倒进卡车里。
      它的车身中间可以弯折，所以在窄小的地方也能转弯。
      最大的铲车，轮胎比大人还高。
  machine.bulldozer:
    label: 推土机
    summary: 一台用履带行走的大力士，用宽宽的铲刀推土。
    info: |
      推土机用前面的钢铲刀推动泥土、石头和沙子。
      后面的爪子叫松土器，能把坚硬的地面弄碎。
      它宽宽的履带能分散重量，所以能在松软的土上行驶。
  machine.skid_steer:
    label: 滑移装载机
    summary: 一台方盒子一样的小装载机，能原地转圈。
    info: |
      滑移装载机转弯时，让一边的轮子比另一边转得快。
      这样它就能原地转圈，有点像坦克一样。
      除了铲斗，它还能装上很多别的工具，比如叉子、扫刷或钻头。
  machine.dump_truck:
    label: 自卸车
    summary: 一辆能从后面把货倒出来的卡车。
    info: |
      自卸车用一个叫车斗的钢箱子装沙子、碎石或泥土。
      液压活塞把车斗前面顶起来，货物就从后面滑出去。
      然后车斗落回原位，卡车再开走去装下一车。
  machine.articulated_hauler:
    label: 铰接式自卸车
    summary: 一辆中间能弯折、专走崎岖地面的自卸车。
    info: |
      铰接式自卸车由两部分组成，中间用一个转轴连着，所以它能在中间弯折。
      这样，在普通卡车会被困住的泥地和坑洼路上，它也能开过去。
      它是为工地和采石场造的，不是用来在公路上跑的。
  machine.mining_truck:
    label: 矿用自卸车
    summary: 一辆在巨大的露天矿里干活的超大自卸车。
    info: |
      矿用自卸车是世界上最大的卡车之一。
      它的轮胎比大人还高，司机要爬梯子才能到驾驶室。
      最大的矿用自卸车一次能运400多吨石头。
  machine.concrete_mixer:
    label: 水泥搅拌车
    summary: 一辆背着大滚筒、滚筒一直在转的卡车。
    info: |
      水泥搅拌车把新鲜的混凝土送到工地。
      一路上滚筒一直在转，这样混凝土就不会在里面凝固。
      滚筒反过来转的时候，混凝土就顺着溜槽流出来。
  machine.concrete_pump:
    label: 混凝土泵车
    summary: 一辆有可折叠长臂的卡车，能把混凝土送到高处。
    info: |
      混凝土泵车通过沿着长臂铺设的管子，把湿混凝土推出去。
      长臂像一根巨大的手指一样展开，能够到大楼的高层。
      车两侧的钢支腿让卡车不会翻倒。
  machine.tower_crane:
    label: 塔吊
    summary: 一台高高地立在工地上的起重机。
    info: |
      塔吊把钢梁、混凝土这样的重物吊到大楼顶上。
      操作员要在塔身里面往上爬，才能到顶上的小驾驶室。
      短臂上沉重的混凝土块，用来平衡长臂上吊着的重物。
  machine.mobile_crane:
    label: 吊车
    summary: 一台装在卡车上的起重机，吊臂能越伸越长。
    info: |
      吊车靠自己的轮子开到工地。
      它的吊臂是伸缩式的，能像望远镜一样一节节伸出来，变得长很多。
      吊东西之前，它会在两边伸出结实的支腿，这样就不会翻倒。
  machine.crawler_crane:
    label: 履带吊
    summary: 一台用履带行走、力气很大的起重机，有高高的框架吊臂。
    info: |
      履带吊站在履带上，履带把它巨大的重量分散到地面上。
      它的长吊臂是用钢格架做的，又轻又非常结实。
      大型履带吊能吊起桥梁和风力发电机的部件。
  machine.road_roller:
    label: 压路机
    summary: 一台很重的机器，用光滑的钢轮把沥青压平。
    info: |
      压路机在新铺的沥青上慢慢开过，把它压得又平又结实。
      它的钢轮能飞快地振动，把路面压得更紧实。
      钢轮上会洒水，这样热沥青就不会粘在上面。
  machine.asphalt_paver:
    label: 摊铺机
    summary: 一台铺出新路面的机器。
    info: |
      卡车把热沥青倒进摊铺机的前面。
      摊铺机一边慢慢往前走，一边在身后把沥青铺成均匀的一层。
      它后面通常紧跟着一台压路机。
  machine.motor_grader:
    label: 平地机
    summary: 一台长长的机器，肚子下面有一把铲刀，用来把路弄平。
    info: |
      平地机的下面有一把长铲刀，在前轮和后轮之间。
      铲刀可以倾斜和转动，所以能把地面弄得非常平，也能弄出一点坡度。
      平地机把碎石路整平，还会在修新路之前把地面准备好。
  machine.forklift:
    label: 叉车
    summary: 一辆用两根货叉把货物举起来的小车。
    info: |
      叉车把两根货叉插到托盘下面，再把它举起来。
      它在仓库、工厂和商店里干活。
      车尾有一块很重的配重，让它在举着货物时不会往前翻。
  machine.telehandler:
    label: 伸缩臂叉车
    summary: 一台有可伸长手臂的装载机，能把东西举得很高。
    info: |
      伸缩臂叉车就像一台装着可伸缩长臂的叉车。
      它能把一托盘砖头举到屋顶上，或者送进大楼深处。
      它在工地和农场上使用，在农场里用来举起干草捆。
  machine.boom_lift:
    label: 高空作业车
    summary: 一台用篮子把工人送到高处的机器。
    info: |
      高空作业车把一个带栏杆的小平台升到高高的空中。
      工人站在里面刷墙、修灯或者剪树枝。
      它带关节的手臂既能往上伸，也能越过障碍物。
  machine.scissor_lift:
    label: 剪叉式升降机
    summary: 一个靠交叉支架笔直升起来的平台。
    info: |
      剪叉式升降机有交叉的金属支架，能像剪刀一样张开。
      支架张开的时候，顶上的平台就笔直地往上升。
      工人在大厅和仓库里用它够到天花板。
  machine.demolition_breaker:
    label: 破碎锤
    summary: 一台用锤子代替铲斗、能砸碎混凝土的挖掘机。
    info: |
      破碎锤是装在挖掘机手臂上的一把巨大锤子。
      它每秒钟敲打混凝土和岩石好几次，直到把它们敲裂。
      它能帮忙拆掉旧房子，还能在采石场里敲碎岩石。
  machine.pile_driver:
    label: 打桩机
    summary: 一台把长柱子深深打进地里的机器。
    info: |
      打桩机把钢或混凝土做的长柱子压进或打进地里，这些柱子叫作桩。
      在地面松软的地方，桩能撑住大楼和桥梁。
      它有一根高高的桩架，让桩保持笔直。
  machine.drilling_rig:
    label: 螺旋钻机
    summary: 一台用履带行走、能在地上钻深洞的机器。
    info: |
      螺旋钻机转动一根长长的螺旋钻杆，钻出一个深洞。
      泥土顺着螺旋升上来，堆在洞口周围。
      这些洞里会灌满混凝土，做成结实的地基。
  machine.tunnel_boring_machine:
    label: 盾构机
    summary: 一台在地下挖隧道的巨大圆形机器。
    info: |
      盾构机的前面是一个巨大的圆形刀盘，上面装着切割用的滚刀，它慢慢转动，一点点磨穿岩石。
      在它后面，机器用一块块混凝土管片把隧道的墙壁铺好。
      人们常常给盾构机起女孩的名字。
  machine.cold_planer:
    label: 铣刨机
    summary: 一台把旧的、磨坏的沥青刨掉的机器。
    info: |
      铣刨机下面有一个带着尖齿的旋转滚筒。
      它把旧路面最上面的一层刨掉，再由传送带把碎块装进卡车。
      旧沥青还能再用来铺新路。
  machine.plate_compactor:
    label: 平板夯
    summary: 一块会振动的小平板，由工人推着把地面压实。
    info: |
      平板夯有一块飞快振动的沉重钢板。
      工人跟在它后面走，用把手控制方向。
      它能把小路、露台和人行道下面的沙子和碎石压实。
  machine.sheepsfoot_roller:
    label: 凸块压路机
    summary: 一台钢轮上有很多凸块、用来压实泥土的压路机。
    info: |
      凸块压路机的钢轮上布满了一块块凸起，叫作凸块。
      凸块深深压进泥土里，比光滑的钢轮压得更结实。
      它用来压实泥土和黏土，比如在新修的路下面，或者用来筑水坝。
  machine.bucket_wheel_excavator:
    label: 斗轮挖掘机
    summary: 一台超级巨大的机器，有一个装满铲斗的旋转大轮子。
    info: |
      斗轮挖掘机在巨大的露天矿里挖煤和泥土。
      它手臂末端的大轮子上装着铲斗，一边转一边把东西装到长长的传送带上。
      最大的斗轮挖掘机长200多米，是陆地上最大的机器之一。
  machine.loader_crane_truck:
    label: 随车吊
    summary: 一辆有可折叠手臂、能把货物吊上吊下的卡车。
    info: |
      随车吊在驾驶室后面带着自己的可折叠液压臂。
      不用别的机器，它就能卸下砖头、管子或托盘。
      吊东西之前，它会在两边伸出支腿，让自己站得稳稳的。
