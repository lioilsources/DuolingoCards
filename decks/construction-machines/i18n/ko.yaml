lang: ko
pivot: false
title: 건설 기계
cards:
  machine.excavator:
    label: 굴착기
    summary: 긴 팔과 이빨이 가득한 버킷으로 땅을 파는 기계예요.
    info: |
      굴착기는 무한궤도로 다녀서 부드러운 진흙에 빠지지 않아요.
      운전석과 팔이 달린 윗부분 전체가 한 바퀴 빙 돌 수 있어요.
      팔은 유압으로 움직여요. 기름을 아주 센 힘으로 관 속에 밀어 넣는 거예요.
  machine.mini_excavator:
    label: 미니 굴착기
    summary: 정원 대문도 지나갈 수 있는 작은 굴착기예요.
    info: |
      미니 굴착기는 정원이나 마당, 좁은 골목처럼 큰 굴착기가 들어갈 수 없는 곳에서 땅을 파요.
      보통 고무 무한궤도로 다녀서 포장된 바닥을 망가뜨리지 않아요.
      앞에 있는 작은 날로 흙을 다시 구덩이에 밀어 넣어요.
  machine.backhoe_loader:
    label: 백호 로더
    summary: 앞에는 삽이, 뒤에는 땅 파는 팔이 달린 트랙터예요.
    info: |
      백호 로더는 기계 두 대를 하나로 합친 거예요. 앞은 로더이고, 뒤는 굴착기예요.
      운전사는 뒤쪽 팔로 일할 때 의자를 빙 돌려 앉아요.
      바퀴로 달려서 도로를 따라 다음 공사장까지 갈 수 있어요.
  machine.wheel_loader:
    label: 휠 로더
    summary: 커다란 타이어로 모래와 자갈을 퍼서 나르는 기계예요.
    info: |
      휠 로더는 앞에 달린 큰 버킷을 가득 채워서 트럭에 쏟아요.
      몸체가 가운데에서 꺾여서 좁은 곳에서도 방향을 바꿀 수 있어요.
      가장 큰 휠 로더는 타이어가 어른 키보다 커요.
  machine.bulldozer:
    label: 불도저
    summary: 넓은 날로 흙을 미는, 무한궤도로 다니는 힘센 기계예요.
    info: |
      불도저는 앞에 달린 강철 날로 흙과 돌과 모래를 밀어요.
      뒤에 달린 갈고리는 리퍼라고 하는데, 딱딱한 땅을 부숴요.
      넓은 무한궤도가 무게를 고르게 나눠 주어서 푸석한 흙 위도 달릴 수 있어요.
  machine.skid_steer:
    label: 스키드 로더
    summary: 제자리에서 빙글 돌 수 있는 상자 모양의 작은 로더예요.
    info: |
      스키드 로더는 한쪽 바퀴를 다른 쪽보다 빨리 돌려서 방향을 바꿔요.
      그래서 탱크처럼 제자리에서 빙글 돌 수 있어요.
      버킷 대신 포크, 빗자루, 드릴 같은 여러 가지 도구를 달 수 있어요.
  machine.dump_truck:
    label: 덤프트럭
    summary: 짐칸을 기울여서 뒤로 짐을 쏟는 트럭이에요.
    info: |
      덤프트럭은 적재함이라고 하는 강철 상자에 모래나 자갈이나 흙을 싣고 다녀요.
      유압 피스톤이 적재함 앞쪽을 들어 올리면, 짐이 뒤로 미끄러져 나와요.
      그다음 적재함이 다시 내려가고, 트럭은 짐을 더 실으러 떠나요.
  machine.articulated_hauler:
    label: 굴절식 덤프트럭
    summary: 가운데가 꺾이는, 험한 땅을 달리는 덤프트럭이에요.
    info: |
      굴절식 덤프트럭은 두 부분이 회전 이음새로 연결되어 있어서 가운데가 꺾여요.
      그래서 보통 트럭이라면 꼼짝 못 할 진흙길과 울퉁불퉁한 곳도 달릴 수 있어요.
      도로가 아니라 공사장과 채석장에서 쓰려고 만든 차예요.
  machine.mining_truck:
    label: 광산용 덤프트럭
    summary: 거대한 노천 광산에서 일하는 엄청나게 큰 덤프트럭이에요.
    info: |
      광산용 덤프트럭은 세계에서 가장 큰 트럭 중 하나예요.
      타이어가 어른 키보다 크고, 운전사는 사다리를 타고 운전석에 올라가요.
      가장 큰 트럭은 한 번에 바위를 400톤 넘게 실을 수 있어요.
  machine.concrete_mixer:
    label: 레미콘
    summary: 커다란 통이 계속 빙빙 도는 트럭이에요.
    info: |
      레미콘은 공사장에 갓 만든 콘크리트를 날라요.
      가는 길에도 통이 계속 돌아서, 콘크리트가 그 안에서 굳지 않아요.
      통이 반대로 돌면, 콘크리트가 슈트를 따라 흘러나와요.
  machine.concrete_pump:
    label: 콘크리트 펌프카
    summary: 접히는 긴 팔로 높은 곳에 콘크리트를 붓는 트럭이에요.
    info: |
      콘크리트 펌프카는 긴 팔을 따라 이어진 관으로 젖은 콘크리트를 밀어 보내요.
      팔은 거대한 손가락처럼 펴져서 건물의 높은 층까지 닿아요.
      양옆의 강철 다리가 트럭이 넘어지지 않게 받쳐 줘요.
  machine.tower_crane:
    label: 타워크레인
    summary: 공사장 위에 높이 서 있는 크레인이에요.
    info: |
      타워크레인은 철골이나 콘크리트 같은 무거운 짐을 건물 꼭대기까지 들어 올려요.
      기사는 타워 안쪽을 타고 올라가서 꼭대기의 작은 운전실에 들어가요.
      짧은 팔에 달린 무거운 콘크리트 덩어리가 긴 팔에 매달린 짐과 균형을 맞춰요.
  machine.mobile_crane:
    label: 크레인차
    summary: 팔이 쭉쭉 길어지는, 트럭에 달린 크레인이에요.
    info: |
      크레인차는 자기 바퀴로 공사장까지 달려가요.
      팔은 망원경처럼 쭉 빠져나와서 훨씬 길어져요.
      짐을 들기 전에 넘어지지 않도록 양옆으로 튼튼한 다리를 뻗어요.
  machine.crawler_crane:
    label: 크롤러 크레인
    summary: 높은 뼈대 모양의 팔이 달린, 무한궤도로 다니는 아주 힘센 크레인이에요.
    info: |
      크롤러 크레인은 무한궤도 위에 서 있어서, 엄청난 무게를 땅에 고르게 나눠요.
      긴 팔은 강철 격자로 되어 있어서 가볍지만 아주 튼튼해요.
      큰 크롤러 크레인은 다리나 풍력 발전기의 부품을 들어 올려요.
  machine.road_roller:
    label: 로드롤러
    summary: 매끈한 강철 바퀴로 아스팔트를 평평하게 누르는 무거운 기계예요.
    info: |
      로드롤러는 새로 깐 아스팔트 위를 천천히 달리며 평평하고 단단하게 눌러요.
      강철 바퀴가 아주 빠르게 떨 수 있어서 길을 더 단단하게 다져요.
      뜨거운 아스팔트가 달라붙지 않게 바퀴에 물을 뿌려요.
  machine.asphalt_paver:
    label: 아스팔트 피니셔
    summary: 새로운 도로 층을 까는 기계예요.
    info: |
      트럭이 뜨거운 아스팔트를 피니셔 앞쪽에 쏟아 넣어요.
      피니셔는 천천히 앞으로 가면서 뒤쪽에 아스팔트를 고른 두께로 펴 깔아요.
      보통 바로 뒤에 로드롤러가 따라와요.
  machine.motor_grader:
    label: 그레이더
    summary: 배 아래에 달린 날로 길을 고르게 하는 긴 기계예요.
    info: |
      그레이더는 앞바퀴와 뒷바퀴 사이, 아래쪽에 긴 날이 달려 있어요.
      날을 기울이고 돌릴 수 있어서, 땅을 아주 평평하게 하거나 살짝 비스듬하게 만들 수 있어요.
      그레이더는 자갈길을 고르고, 새 도로를 만들기 전에 땅을 다듬어요.
  machine.forklift:
    label: 지게차
    summary: 포크 두 개로 짐을 들어 올리는 작은 차예요.
    info: |
      지게차는 포크 두 개를 팰릿 밑에 넣고 들어 올려요.
      창고와 공장과 가게에서 일해요.
      뒤에 달린 무거운 추가 짐 때문에 앞으로 넘어지지 않게 해 줘요.
  machine.telehandler:
    label: 텔레핸들러
    summary: 쭉 늘어나는 긴 팔로 물건을 높이 들어 올리는 로더예요.
    info: |
      텔레핸들러는 길게 늘어나는 팔이 달린 지게차 같은 기계예요.
      벽돌을 실은 팰릿을 지붕 위나 건물 안 깊숙한 곳까지 올려 줄 수 있어요.
      공사장과 농장에서 쓰이는데, 농장에서는 건초 더미를 들어 올려요.
  machine.boom_lift:
    label: 고소작업차
    summary: 바구니에 사람을 태워 높이 올려 주는 기계예요.
    info: |
      고소작업차는 난간이 있는 작은 받침대를 하늘 높이 올려요.
      일하는 사람들이 거기에 서서 벽을 칠하거나, 전등을 고치거나, 나뭇가지를 잘라요.
      마디가 있는 팔은 위로 뻗을 수도 있고, 장애물 너머로 넘어갈 수도 있어요.
  machine.scissor_lift:
    label: 시저리프트
    summary: X자로 엇갈린 다리 위에서 똑바로 위로 올라가는 발판이에요.
    info: |
      시저리프트에는 가위처럼 벌어지는 엇갈린 금속 받침대가 있어요.
      받침대가 벌어지면 위에 있는 발판이 똑바로 위로 올라가요.
      일하는 사람들은 강당이나 창고에서 천장에 손이 닿게 하려고 이것을 써요.
  machine.demolition_breaker:
    label: 유압 브레이커
    summary: 버킷 대신 망치를 달아서 콘크리트를 깨는 굴착기예요.
    info: |
      유압 브레이커는 굴착기 팔에 단 거대한 망치예요.
      콘크리트와 바위를 1초에 여러 번 두드려서 금이 가게 해요.
      낡은 건물을 허물거나 채석장에서 바위를 깨는 데 도움을 줘요.
  machine.pile_driver:
    label: 항타기
    summary: 긴 기둥을 땅속 깊이 박는 기계예요.
    info: |
      항타기는 말뚝이라고 하는 강철이나 콘크리트로 된 긴 기둥을 땅속으로 밀어 넣거나 두드려 박아요.
      땅이 무른 곳에서는 말뚝이 건물과 다리를 받쳐 줘요.
      높은 기둥이 있어서 말뚝을 똑바로 세워 줘요.
  machine.drilling_rig:
    label: 천공기
    summary: 땅에 깊은 구멍을 뚫는, 무한궤도로 다니는 기계예요.
    info: |
      천공기는 긴 나선형 드릴을 돌려서 깊은 구멍을 뚫어요.
      흙은 나선을 따라 올라와서 구멍 둘레에 쌓여요.
      구멍에 콘크리트를 채워서 튼튼한 기초를 만들어요.
  machine.tunnel_boring_machine:
    label: 터널 굴착기
    summary: 땅속에 터널을 파는 거대한 동그란 기계예요.
    info: |
      터널 굴착기 앞쪽에는 자르는 원판이 달린 거대한 동그란 바퀴가 있는데, 천천히 돌면서 바위를 갈아 뚫어요.
      그 뒤에서 기계가 터널 벽에 콘크리트 조각을 붙여 나가요.
      터널 굴착기에는 여자아이 이름을 붙이는 일이 많아요.
  machine.cold_planer:
    label: 노면 절삭기
    summary: 낡고 닳은 아스팔트를 깎아 내는 기계예요.
    info: |
      노면 절삭기 아래에는 날카로운 이가 달린 빙글빙글 도는 드럼이 있어요.
      낡은 길의 맨 윗층을 깎아 내고, 컨베이어 벨트가 그 조각들을 트럭에 실어요.
      낡은 아스팔트는 새 도로에 다시 쓸 수 있어요.
  machine.plate_compactor:
    label: 플레이트 콤팩터
    summary: 사람이 밀면서 땅을 다지는, 덜덜 떠는 작은 판이에요.
    info: |
      플레이트 콤팩터에는 아주 빠르게 떠는 무거운 강철판이 있어요.
      일하는 사람이 뒤에서 걸으며 손잡이로 방향을 잡아요.
      산책길, 테라스, 보도 밑의 모래와 자갈을 단단하게 다져요.
  machine.sheepsfoot_roller:
    label: 패드풋 롤러
    summary: 울퉁불퉁한 드럼으로 흙을 다지는 롤러예요.
    info: |
      패드풋 롤러의 드럼은 패드라고 하는 돌기로 덮여 있어요.
      패드가 흙 속 깊이 파고들어서 매끈한 드럼보다 더 단단하게 다져요.
      흙과 점토에 쓰는데, 예를 들어 새 도로 밑이나 댐을 만들 때 써요.
  machine.bucket_wheel_excavator:
    label: 버킷 휠 굴착기
    summary: 버킷이 가득 달린 바퀴가 빙글빙글 도는 어마어마하게 큰 기계예요.
    info: |
      버킷 휠 굴착기는 거대한 노천 광산에서 석탄과 흙을 파요.
      팔 끝에서 버킷이 달린 큰 바퀴가 돌면서 긴 컨베이어 벨트를 가득 채워요.
      가장 큰 것은 길이가 200미터가 넘어서, 땅 위에서 가장 큰 기계 중 하나예요.
  machine.loader_crane_truck:
    label: 카고크레인
    summary: 접히는 팔로 짐을 싣고 내리는 트럭이에요.
    info: |
      카고크레인은 운전석 뒤에 접히는 유압 팔을 직접 달고 다녀요.
      다른 기계 없이도 벽돌이나 관이나 팰릿을 내릴 수 있어요.
      짐을 들기 전에 옆으로 다리를 뻗어서 흔들리지 않게 서요.
