lang: hi
pivot: false
title: निर्माण की मशीनें
cards:
  machine.excavator:
    label: एक्सकेवेटर
    summary: खुदाई करने वाली मशीन, जिसकी लंबी बाँह और दाँतों से भरी बाल्टी होती है।
    info: |
      एक्सकेवेटर पट्टों (ट्रैक) पर चलता है, इसलिए यह नरम कीचड़ में नहीं धँसता।
      केबिन और बाँह वाला पूरा ऊपरी हिस्सा पूरा एक चक्कर घूम सकता है।
      बाँह हाइड्रोलिक से चलती है, यानी तेल को बहुत ज़्यादा दबाव से पाइपों में धकेला जाता है।
  machine.mini_excavator:
    label: मिनी एक्सकेवेटर
    summary: एक छोटी खुदाई मशीन, जो बगीचे के गेट से भी निकल जाती है।
    info: |
      मिनी एक्सकेवेटर वहाँ खुदाई करता है जहाँ बड़ा नहीं समा सकता, जैसे बगीचे, आँगन और तंग गलियाँ।
      यह आमतौर पर रबर के पट्टों पर चलता है, इसलिए पक्की ज़मीन को नुकसान नहीं पहुँचाता।
      आगे लगा छोटा ब्लेड मिट्टी को वापस गड्ढे में धकेलता है।
  machine.backhoe_loader:
    label: बैकहो लोडर
    summary: एक ट्रैक्टर, जिसके आगे बेलचा और पीछे खुदाई वाली बाँह होती है।
    info: |
      बैकहो लोडर एक में दो मशीनें है, आगे लोडर और पीछे एक्सकेवेटर।
      पीछे वाली बाँह से काम करने के लिए चालक अपनी सीट घुमा लेता है।
      यह पहियों पर चलता है, इसलिए सड़क पर चलकर एक काम से दूसरे काम तक जा सकता है।
  machine.wheel_loader:
    label: व्हील लोडर
    summary: बड़े-बड़े टायरों वाली मशीन, जो रेत और बजरी उठाकर ले जाती है।
    info: |
      व्हील लोडर आगे की बड़ी बाल्टी भरता है और उसे ट्रकों में उलट देता है।
      इसका शरीर बीच से मुड़ता है, जिससे यह तंग जगहों में भी घूम सकता है।
      सबसे बड़े व्हील लोडरों के टायर किसी बड़े आदमी से भी ऊँचे होते हैं।
  machine.bulldozer:
    label: बुलडोज़र
    summary: पट्टों पर चलने वाली एक ताक़तवर मशीन, जो चौड़े ब्लेड से मिट्टी धकेलती है।
    info: |
      बुलडोज़र आगे लगे स्टील के ब्लेड से मिट्टी, पत्थर और रेत धकेलता है।
      पीछे लगा पंजा, जिसे रिपर कहते हैं, सख़्त ज़मीन को तोड़ता है।
      इसके चौड़े पट्टे इसका वज़न फैला देते हैं, इसलिए यह भुरभुरी मिट्टी पर भी चल सकता है।
  machine.skid_steer:
    label: स्किड स्टीयर लोडर
    summary: डिब्बे जैसा एक छोटा लोडर, जो एक ही जगह पर घूम सकता है।
    info: |
      स्किड स्टीयर लोडर एक तरफ़ के पहियों को दूसरी तरफ़ से तेज़ घुमाकर मुड़ता है।
      इससे यह एक ही जगह पर गोल घूम सकता है, लगभग टैंक की तरह।
      बाल्टी की जगह इस पर कई दूसरे औज़ार लग सकते हैं, जैसे काँटे, ब्रश या ड्रिल।
  machine.dump_truck:
    label: डंपर
    summary: एक ट्रक, जो अपना माल पीछे से उलट देता है।
    info: |
      डंपर रेत, बजरी या मिट्टी को स्टील के एक डिब्बे में ले जाता है, जिसे टिपर कहते हैं।
      हाइड्रोलिक पिस्टन डिब्बे का अगला हिस्सा ऊपर उठाते हैं, और माल पीछे से फिसलकर निकल जाता है।
      फिर डिब्बा वापस नीचे आ जाता है और ट्रक और माल लाने चल पड़ता है।
  machine.articulated_hauler:
    label: आर्टिकुलेटेड डंपर
    summary: ऊबड़-खाबड़ ज़मीन का डंपर, जो बीच से मुड़ता है।
    info: |
      आर्टिकुलेटेड डंपर के दो हिस्से एक जोड़ से जुड़े होते हैं, इसलिए यह बीच से मुड़ता है।
      इससे यह कीचड़ और गड्ढों से निकल जाता है, जहाँ कोई आम ट्रक फँस जाता।
      यह निर्माण स्थलों और खदानों के लिए बना है, सड़कों के लिए नहीं।
  machine.mining_truck:
    label: खनन डंपर
    summary: एक विशाल डंपर, जो बड़ी-बड़ी खुली खदानों में काम करता है।
    info: |
      खनन डंपर दुनिया के सबसे बड़े ट्रकों में से हैं।
      इनके टायर बड़े आदमी से भी ऊँचे होते हैं, और चालक सीढ़ी चढ़कर केबिन तक पहुँचता है।
      सबसे बड़े डंपर एक बार में 400 टन से ज़्यादा पत्थर ले जा सकते हैं।
  machine.concrete_mixer:
    label: कंक्रीट मिक्सर ट्रक
    summary: एक ट्रक, जिसका बड़ा ड्रम लगातार घूमता रहता है।
    info: |
      कंक्रीट मिक्सर ट्रक निर्माण स्थल तक ताज़ा कंक्रीट लाता है।
      रास्ते भर ड्रम घूमता रहता है, ताकि कंक्रीट उसके अंदर जम न जाए।
      जब ड्रम उल्टी दिशा में घूमता है, तो कंक्रीट नाली से बहकर बाहर आता है।
  machine.concrete_pump:
    label: कंक्रीट पंप
    summary: मुड़ने वाली लंबी बाँह वाला ट्रक, जो ऊँचाई तक कंक्रीट डालता है।
    info: |
      कंक्रीट पंप अपनी लंबी बाँह के साथ लगे पाइप से गीला कंक्रीट धकेलता है।
      बाँह एक विशाल उँगली की तरह खुलती है और इमारत की ऊपरी मंज़िलों तक पहुँच जाती है।
      किनारों पर लगे स्टील के पैर ट्रक को पलटने से बचाते हैं।
  machine.tower_crane:
    label: टावर क्रेन
    summary: एक ऊँची क्रेन, जो निर्माण स्थल के ऊपर खड़ी रहती है।
    info: |
      टावर क्रेन स्टील के गर्डर और कंक्रीट जैसी भारी चीज़ों को इमारत की चोटी तक उठाती है।
      चलाने वाला टावर के अंदर चढ़कर ऊपर बने छोटे केबिन तक जाता है।
      छोटी बाँह पर रखे कंक्रीट के भारी टुकड़े लंबी बाँह पर लटके भार को संतुलित रखते हैं।
  machine.mobile_crane:
    label: मोबाइल क्रेन
    summary: ट्रक पर लगी क्रेन, जिसकी बाँह खिसककर लंबी और लंबी होती जाती है।
    info: |
      मोबाइल क्रेन अपने ही पहियों पर चलकर निर्माण स्थल तक पहुँचती है।
      इसकी बाँह दूरबीन की तरह खिसककर बाहर निकलती है और बहुत लंबी हो जाती है।
      उठाने से पहले यह दोनों तरफ़ मज़बूत पैर फैला देती है, ताकि पलट न जाए।
  machine.crawler_crane:
    label: क्रॉलर क्रेन
    summary: पट्टों पर चलने वाली एक बहुत ताक़तवर क्रेन, जिसकी बाँह ऊँचे ढाँचे जैसी है।
    info: |
      क्रॉलर क्रेन पट्टों पर खड़ी रहती है, जो इसके भारी वज़न को ज़मीन पर फैला देते हैं।
      इसकी लंबी बाँह स्टील की जाली से बनी है, हल्की लेकिन बहुत मज़बूत।
      बड़ी क्रॉलर क्रेनें पुलों और पवन चक्कियों के हिस्से उठाती हैं।
  machine.road_roller:
    label: रोड रोलर
    summary: चिकने स्टील के ड्रम वाली एक भारी मशीन, जो डामर को समतल करती है।
    info: |
      रोड रोलर ताज़े डामर पर धीरे-धीरे चलता है और उसे दबाकर समतल और सख़्त बनाता है।
      इसके स्टील के ड्रम बहुत तेज़ी से काँप सकते हैं, जिससे सड़क और अच्छी तरह दब जाती है।
      ड्रमों पर पानी छिड़का जाता है ताकि गरम डामर उनसे न चिपके।
  machine.asphalt_paver:
    label: डामर पेवर
    summary: एक मशीन, जो सड़क की नई परत बिछाती है।
    info: |
      ट्रक गरम डामर को पेवर के आगे वाले हिस्से में उलटते हैं।
      पेवर धीरे-धीरे आगे बढ़ते हुए उसे अपने पीछे एक बराबर परत में फैला देता है।
      आमतौर पर एक रोड रोलर ठीक उसके पीछे-पीछे चलता है।
  machine.motor_grader:
    label: ग्रेडर
    summary: एक लंबी मशीन, जिसके पेट के नीचे ब्लेड है और जो सड़कों को समतल करती है।
    info: |
      ग्रेडर के नीचे, आगे और पीछे के पहियों के बीच, एक लंबा ब्लेड होता है।
      ब्लेड झुक और घूम सकता है, इसलिए यह ज़मीन को बिल्कुल समतल या थोड़ा ढलान वाला बना सकता है।
      ग्रेडर बजरी वाली सड़कों को समतल करते हैं और नई सड़क बनने से पहले ज़मीन तैयार करते हैं।
  machine.forklift:
    label: फ़ोर्कलिफ़्ट
    summary: एक छोटी गाड़ी, जो दो काँटों पर सामान उठाती है।
    info: |
      फ़ोर्कलिफ़्ट अपने दो काँटे पैलेट के नीचे घुसाकर उसे ऊपर उठा लेती है।
      यह गोदामों, कारख़ानों और दुकानों में काम करती है।
      पीछे लगा भारी वज़न इसे सामान के बोझ से आगे पलटने से बचाता है।
  machine.telehandler:
    label: टेलीहैंडलर
    summary: एक लोडर, जिसकी लंबी बाँह खिसककर बाहर आती है और चीज़ें ऊँचाई तक उठाती है।
    info: |
      टेलीहैंडलर एक फ़ोर्कलिफ़्ट जैसा है, जिसमें दूरबीन की तरह खुलने वाली लंबी बाँह होती है।
      यह ईंटों से भरा पैलेट छत पर या इमारत के काफ़ी अंदर तक पहुँचा सकता है।
      इसका इस्तेमाल निर्माण स्थलों और खेतों पर होता है, जहाँ यह भूसे के गट्ठर उठाता है।
  machine.boom_lift:
    label: बूम लिफ़्ट
    summary: एक मशीन, जो मज़दूरों को एक टोकरी में बैठाकर ऊँचाई तक उठाती है।
    info: |
      बूम लिफ़्ट रेलिंग वाले एक छोटे चबूतरे को हवा में ऊँचा उठाती है।
      मज़दूर उस पर खड़े होकर दीवारें रंगते हैं, बत्तियाँ ठीक करते हैं या डालियाँ काटते हैं।
      इसकी जोड़ों वाली बाँह ऊपर तक भी पहुँच सकती है और रुकावटों के ऊपर से भी।
  machine.scissor_lift:
    label: सिज़र लिफ़्ट
    summary: एक चबूतरा, जो आड़े-तिरछे सहारों पर सीधा ऊपर उठता है।
    info: |
      सिज़र लिफ़्ट में धातु के आपस में क्रॉस किए हुए सहारे होते हैं, जो कैंची की तरह खुलते हैं।
      जैसे-जैसे वे खुलते हैं, ऊपर वाला चबूतरा सीधा ऊपर उठता है।
      मज़दूर इसे हॉल और गोदामों में छत तक पहुँचने के लिए इस्तेमाल करते हैं।
  machine.demolition_breaker:
    label: हाइड्रोलिक ब्रेकर
    summary: बाल्टी की जगह हथौड़े वाला एक्सकेवेटर, जो कंक्रीट तोड़ता है।
    info: |
      हाइड्रोलिक ब्रेकर एक विशाल हथौड़ा है, जो एक्सकेवेटर की बाँह पर लगाया जाता है।
      यह कंक्रीट और चट्टान पर एक सेकंड में कई बार चोट करता है, जब तक उनमें दरार न आ जाए।
      यह पुरानी इमारतें गिराने और खदानों में चट्टानें तोड़ने में मदद करता है।
  machine.pile_driver:
    label: पाइल ड्राइवर
    summary: एक मशीन, जो लंबे खंभों को ठोककर ज़मीन में गहराई तक गाड़ती है।
    info: |
      पाइल ड्राइवर स्टील या कंक्रीट के लंबे खंभों को, जिन्हें पाइल कहते हैं, ज़मीन में दबाता या ठोकता है।
      जहाँ ज़मीन नरम होती है, वहाँ पाइल इमारतों और पुलों को सहारा देते हैं।
      इसमें एक ऊँचा खंभा होता है, जो पाइल को बिल्कुल सीधा रखता है।
  machine.drilling_rig:
    label: ड्रिलिंग रिग
    summary: पट्टों पर चलने वाली एक मशीन, जो ज़मीन में गहरे छेद करती है।
    info: |
      ड्रिलिंग रिग एक लंबी घुमावदार ड्रिल घुमाता है, जो गहरा छेद खोदती है।
      मिट्टी घुमाव के साथ-साथ ऊपर आती है और छेद के चारों ओर ढेर बन जाती है।
      छेदों को कंक्रीट से भरकर मज़बूत नींव बनाई जाती है।
  machine.tunnel_boring_machine:
    label: सुरंग खोदने वाली मशीन
    summary: एक विशाल गोल मशीन, जो ज़मीन के नीचे सुरंगें खोदती है।
    info: |
      सुरंग खोदने वाली मशीन के आगे काटने वाली चकतियों से भरा एक बड़ा गोल पहिया होता है, जो धीरे-धीरे घूमकर चट्टान को पीसता जाता है।
      उसके पीछे मशीन सुरंग की दीवारों पर कंक्रीट के टुकड़े लगाती जाती है।
      सुरंग खोदने वाली मशीनों को अक्सर लड़कियों के नाम दिए जाते हैं।
  machine.cold_planer:
    label: रोड मिलिंग मशीन
    summary: एक मशीन, जो पुराने, घिसे हुए डामर को खुरचकर हटाती है।
    info: |
      रोड मिलिंग मशीन के नीचे तेज़ दाँतों वाला एक घूमता हुआ ड्रम होता है।
      यह पुरानी सड़क की ऊपरी परत खुरच देती है, और एक कन्वेयर बेल्ट टुकड़ों को ट्रक में भर देती है।
      पुराने डामर को नई सड़क में फिर से इस्तेमाल किया जा सकता है।
  machine.plate_compactor:
    label: प्लेट कॉम्पैक्टर
    summary: एक छोटी काँपती हुई प्लेट, जिसे मज़दूर ज़मीन दबाने के लिए धकेलता है।
    info: |
      प्लेट कॉम्पैक्टर में स्टील की एक भारी प्लेट होती है, जो बहुत तेज़ी से काँपती है।
      मज़दूर उसके पीछे चलता है और हैंडल से उसे दिशा देता है।
      यह रास्तों, आँगनों और फ़ुटपाथों के नीचे की रेत और बजरी को दबाकर पक्का करता है।
  machine.sheepsfoot_roller:
    label: पैडफ़ुट रोलर
    summary: उभारों वाले ड्रम का एक रोलर, जो मिट्टी को दबाता है।
    info: |
      पैडफ़ुट रोलर का ड्रम उभरे हुए टुकड़ों से ढका होता है, जिन्हें पैड कहते हैं।
      पैड मिट्टी में गहराई तक धँसते हैं और उसे चिकने ड्रम से बेहतर दबाते हैं।
      इसका इस्तेमाल मिट्टी और चिकनी मिट्टी पर होता है, जैसे नई सड़कों के नीचे या बाँध बनाने में।
  machine.bucket_wheel_excavator:
    label: बकेट व्हील एक्सकेवेटर
    summary: एक बहुत ही विशाल मशीन, जिसका पहिया बाल्टियों से भरा है और घूमता रहता है।
    info: |
      बकेट व्हील एक्सकेवेटर बड़ी-बड़ी खुली खदानों में कोयला और मिट्टी खोदता है।
      इसकी बाँह के सिरे पर बाल्टियों वाला एक बड़ा पहिया घूमता है और एक लंबी कन्वेयर बेल्ट को भरता है।
      सबसे बड़े 200 मीटर से भी ज़्यादा लंबे हैं, इसलिए ये ज़मीन पर चलने वाली सबसे बड़ी मशीनों में से हैं।
  machine.loader_crane_truck:
    label: क्रेन वाला ट्रक
    summary: मुड़ने वाली बाँह वाला ट्रक, जो सामान चढ़ाता और उतारता है।
    info: |
      क्रेन वाले ट्रक के केबिन के पीछे उसकी अपनी मुड़ने वाली हाइड्रोलिक बाँह लगी होती है।
      यह बिना किसी दूसरी मशीन के ईंटें, पाइप या पैलेट उतार सकता है।
      उठाने से पहले यह किनारों पर पैर फैला देता है, ताकि मज़बूती से खड़ा रहे।
