lang: ar
pivot: false
title: آلات البناء
cards:
  machine.excavator:
    label: حفّارة
    summary: آلة حفر لها ذراع طويلة ودلو مليء بالأسنان.
    info: |
      تسير الحفّارة على جنازير، لذلك لا تغوص في الطين الطري.
      الجزء العلوي كله مع غرفة السائق والذراع يستطيع أن يدور دورة كاملة.
      تتحرك الذراع بالهيدروليك، أي بزيت يُدفع داخل الأنابيب بضغط عالٍ.
  machine.mini_excavator:
    label: حفّارة صغيرة
    summary: حفّارة صغيرة تمر من باب الحديقة.
    info: |
      تحفر الحفّارة الصغيرة حيث لا تتسع الحفّارة الكبيرة، مثل الحدائق والساحات والشوارع الضيقة.
      تسير عادةً على جنازير من المطاط، لذلك لا تُتلف الأرض المرصوفة.
      الشفرة الصغيرة في الأمام تدفع التراب ليعود إلى الحفرة.
  machine.backhoe_loader:
    label: لودر بحفّار خلفي
    summary: جرّار له مجرفة في الأمام وذراع حفر في الخلف.
    info: |
      اللودر بحفّار خلفي آلتان في آلة واحدة، لودر في الأمام وحفّارة في الخلف.
      يُدير السائق مقعده إلى الخلف ليعمل بالذراع الخلفية.
      يسير على عجلات، لذلك يستطيع أن يسير على الطرق من ورشة إلى أخرى.
  machine.wheel_loader:
    label: لودر بعجلات
    summary: آلة بإطارات ضخمة تجرف الرمل والحصى وتنقلهما.
    info: |
      يملأ اللودر دلوه الأمامي الكبير ثم يفرغه في الشاحنات.
      ينثني جسمه من الوسط، وهذا يساعده على الالتفاف في الأماكن الضيقة.
      أكبر اللوادر لها إطارات أطول من الإنسان البالغ.
  machine.bulldozer:
    label: جرّافة
    summary: آلة قوية على جنازير تدفع التراب بشفرة عريضة.
    info: |
      تدفع الجرّافة التراب والصخور والرمل بالشفرة الفولاذية في مقدمتها.
      المخلب في الخلف، واسمه المِشقّ، يفتّت الأرض الصلبة.
      جنازيرها العريضة توزّع وزنها، لذلك تستطيع السير فوق التراب الرخو.
  machine.skid_steer:
    label: لودر صغير
    summary: لودر صغير على شكل صندوق يستطيع أن يدور في مكانه.
    info: |
      يلتف اللودر الصغير بتدوير عجلات أحد الجانبين أسرع من عجلات الجانب الآخر.
      وهكذا يستطيع أن يدور في مكانه، تقريبًا مثل الدبابة.
      وبدلًا من الدلو يستطيع أن يحمل أدوات كثيرة أخرى، مثل الشوكات أو الفرش أو المثقاب.
  machine.dump_truck:
    label: شاحنة قلّابة
    summary: شاحنة تُفرغ حمولتها من الخلف بإمالة صندوقها.
    info: |
      تنقل الشاحنة القلّابة الرمل أو الحصى أو التراب في صندوق فولاذي يُسمّى القلّاب.
      ترفع مكابس هيدروليكية مقدمة الصندوق، فتنزلق الحمولة من الخلف.
      ثم ينزل الصندوق من جديد وتنطلق الشاحنة لتجلب حمولة أخرى.
  machine.articulated_hauler:
    label: شاحنة قلّابة مفصلية
    summary: شاحنة قلّابة للأراضي الوعرة تنثني من الوسط.
    info: |
      للشاحنة القلّابة المفصلية جزءان يصل بينهما مفصل، لذلك تنثني من الوسط.
      وهذا يساعدها على السير في الطين وفوق المطبات حيث تعلق الشاحنة العادية.
      صُنعت لمواقع البناء والمحاجر، لا للطرق.
  machine.mining_truck:
    label: شاحنة المناجم القلّابة
    summary: شاحنة قلّابة عملاقة تعمل في المناجم المكشوفة الضخمة.
    info: |
      شاحنات المناجم القلّابة من أكبر الشاحنات في العالم.
      إطاراتها أطول من الإنسان البالغ، ويصعد السائق على سلّم ليصل إلى غرفة القيادة.
      أكبرها تستطيع أن تحمل أكثر من 400 طن من الصخور في مرة واحدة.
  machine.concrete_mixer:
    label: خلّاطة خرسانة
    summary: شاحنة عليها برميل كبير يظل يدور.
    info: |
      تجلب خلّاطة الخرسانة الخرسانة الطازجة إلى موقع البناء.
      يظل البرميل يدور في الطريق، حتى لا تتصلّب الخرسانة في داخله.
      وعندما يدور البرميل في الاتجاه المعاكس، تنصبّ الخرسانة عبر المزراب.
  machine.concrete_pump:
    label: مضخة خرسانة
    summary: شاحنة لها ذراع طويلة تنطوي، تصبّ الخرسانة في الأعلى.
    info: |
      تدفع مضخة الخرسانة الخرسانة الرطبة في أنبوب يمتد على طول ذراعها الطويلة.
      تنفرد الذراع مثل إصبع عملاقة وتصل إلى الطوابق العليا من المبنى.
      أرجل فولاذية على الجانبين تمنع الشاحنة من الانقلاب.
  machine.tower_crane:
    label: رافعة برجية
    summary: رافعة عالية تقف فوق موقع البناء.
    info: |
      ترفع الرافعة البرجية أحمالًا ثقيلة مثل العوارض الفولاذية والخرسانة إلى أعلى المبنى.
      يتسلق المشغّل داخل البرج حتى يصل إلى غرفة صغيرة في القمة.
      كتل الخرسانة الثقيلة على الذراع القصيرة توازن الحمولة على الذراع الطويلة.
  machine.mobile_crane:
    label: رافعة متنقلة
    summary: رافعة على شاحنة، ذراعها تنزلق إلى الخارج فتطول أكثر فأكثر.
    info: |
      تسير الرافعة المتنقلة إلى موقع البناء على عجلاتها.
      ذراعها تلسكوبية، أي أنها تنزلق إلى الخارج مثل المنظار فتصبح أطول بكثير.
      وقبل أن ترفع، تمدّ أرجلًا قوية على الجانبين حتى لا تنقلب.
  machine.crawler_crane:
    label: رافعة مجنزرة
    summary: رافعة قوية جدًا على جنازير، لها ذراع عالية على شكل هيكل.
    info: |
      تقف الرافعة المجنزرة على جنازير توزّع وزنها الضخم على الأرض.
      ذراعها الطويلة مصنوعة من شبكة فولاذية، خفيفة لكنها قوية جدًا.
      الرافعات المجنزرة الكبيرة ترفع أجزاء الجسور وتوربينات الرياح.
  machine.road_roller:
    label: مدحلة
    summary: آلة ثقيلة لها أسطوانات فولاذية ملساء تسوّي الأسفلت.
    info: |
      تسير المدحلة ببطء فوق الأسفلت الجديد وتضغطه حتى يصبح مستويًا وصلبًا.
      أسطواناتها الفولاذية تستطيع أن تهتز بسرعة كبيرة، فتدكّ الطريق أفضل.
      يُرشّ الماء على الأسطوانات حتى لا يلتصق بها الأسفلت الساخن.
  machine.asphalt_paver:
    label: فارشة أسفلت
    summary: آلة تفرش طبقة جديدة من الطريق.
    info: |
      تُفرغ الشاحنات الأسفلت الساخن في مقدمة الفارشة.
      تفرشه الفارشة خلفها طبقةً متساوية وهي تتقدم ببطء.
      وعادةً تسير مدحلة خلفها مباشرة.
  machine.motor_grader:
    label: ممهّدة طرق
    summary: آلة طويلة لها شفرة تحت بطنها تسوّي الطرق.
    info: |
      لممهّدة الطرق شفرة طويلة في الأسفل، بين عجلاتها الأمامية والخلفية.
      تستطيع الشفرة أن تميل وتدور، لذلك تجعل الأرض مستوية تمامًا أو مائلة قليلًا.
      تسوّي ممهّدات الطرق الطرق الحصوية وتجهّز الأرض قبل بناء طريق جديد.
  machine.forklift:
    label: رافعة شوكية
    summary: شاحنة صغيرة ترفع الأحمال على شوكتين.
    info: |
      تُدخل الرافعة الشوكية شوكتيها تحت المنصّة الخشبية ثم ترفعها.
      تعمل في المستودعات والمصانع والمحلات.
      ثقل كبير في الخلف يمنعها من الانقلاب إلى الأمام تحت الحمولة.
  machine.telehandler:
    label: رافعة شوكية تلسكوبية
    summary: لودر له ذراع طويلة تنزلق إلى الخارج لترفع الأشياء عاليًا.
    info: |
      الرافعة الشوكية التلسكوبية تشبه الرافعة الشوكية، لكن لها ذراع طويلة تنزلق إلى الخارج.
      تستطيع أن ترفع منصّة من الطوب إلى السطح أو إلى داخل المبنى بعيدًا.
      تُستخدم في مواقع البناء وفي المزارع، حيث ترفع بالات القش.
  machine.boom_lift:
    label: رافعة بسلّة
    summary: آلة ترفع العمال عاليًا في سلّة.
    info: |
      ترفع الرافعة بسلّة منصّة صغيرة لها حاجز عاليًا في الهواء.
      يقف فيها العمال ليدهنوا الجدران أو يصلحوا المصابيح أو يقطعوا الأغصان.
      ذراعها ذات المفاصل تستطيع أن تمتد إلى الأعلى وأن تتخطى العوائق أيضًا.
  machine.scissor_lift:
    label: رافعة مقصية
    summary: منصّة ترتفع إلى الأعلى مباشرة على دعائم متقاطعة.
    info: |
      للرافعة المقصية دعائم معدنية متقاطعة تنفتح مثل المقص.
      وعندما تنفتح، ترتفع المنصّة التي فوقها إلى الأعلى مباشرة.
      يستخدمها العمال في القاعات والمستودعات ليصلوا إلى السقف.
  machine.demolition_breaker:
    label: مطرقة هيدروليكية
    summary: حفّارة لها مطرقة بدلًا من الدلو، تكسّر الخرسانة.
    info: |
      المطرقة الهيدروليكية مطرقة ضخمة مثبّتة على ذراع حفّارة.
      تضرب الخرسانة والصخور مرات كثيرة في الثانية حتى تتشقق.
      تساعد على هدم المباني القديمة وتكسير الصخور في المحاجر.
  machine.pile_driver:
    label: دقّاقة الخوازيق
    summary: آلة تدقّ أعمدة طويلة عميقًا في الأرض.
    info: |
      تدفع دقّاقة الخوازيق أو تدقّ أعمدة طويلة من الفولاذ أو الخرسانة، تُسمّى الخوازيق، في الأرض.
      تحمل الخوازيق المباني والجسور حيث تكون الأرض طرية.
      لها صارية عالية تُبقي الخازوق مستقيمًا تمامًا.
  machine.drilling_rig:
    label: آلة حفر
    summary: آلة على جنازير تحفر ثقوبًا عميقة في الأرض.
    info: |
      تُدير آلة الحفر مثقابًا حلزونيًا طويلًا يحفر ثقبًا عميقًا.
      يصعد التراب على طول الحلزون ويتكوّم حول الثقب.
      تُملأ الثقوب بالخرسانة لتصنع أساسات قوية.
  machine.tunnel_boring_machine:
    label: آلة حفر الأنفاق
    summary: آلة مستديرة عملاقة تحفر الأنفاق تحت الأرض.
    info: |
      مقدمة آلة حفر الأنفاق عجلة مستديرة ضخمة عليها أقراص قاطعة، تدور ببطء وتطحن الصخر.
      وخلفها تكسو الآلة جدران النفق بقطع من الخرسانة.
      غالبًا ما تُعطى آلات حفر الأنفاق أسماء بنات.
  machine.cold_planer:
    label: آلة كشط الأسفلت
    summary: آلة تكشط الأسفلت القديم المهترئ.
    info: |
      لآلة كشط الأسفلت أسطوانة دوّارة في أسفلها أسنان حادة.
      تكشط الطبقة العليا من الطريق القديم، ويحمّل سير ناقل القطع في شاحنة.
      يمكن استخدام الأسفلت القديم من جديد في طريق جديد.
  machine.plate_compactor:
    label: دكّاكة
    summary: صفيحة صغيرة تهتز، يدفعها العامل ليدكّ الأرض.
    info: |
      للدكّاكة صفيحة فولاذية ثقيلة تهتز بسرعة كبيرة.
      يمشي العامل خلفها ويوجّهها بالمقبض.
      تدكّ الرمل والحصى تحت الممرات والباحات والأرصفة.
  machine.sheepsfoot_roller:
    label: مدحلة قدم الخروف
    summary: مدحلة لها أسطوانة مليئة بالنتوءات تدكّ التربة.
    info: |
      أسطوانة مدحلة قدم الخروف مغطاة بكتل بارزة تُسمّى النتوءات.
      تنغرس النتوءات عميقًا في التربة وتدكّها أفضل من الأسطوانة الملساء.
      تُستخدم للتراب والطين، مثلًا تحت الطرق الجديدة أو لبناء السدود.
  machine.bucket_wheel_excavator:
    label: حفّارة بعجلة الدلاء
    summary: آلة هائلة لها عجلة دوّارة مليئة بالدلاء.
    info: |
      تحفر الحفّارة بعجلة الدلاء الفحم والتراب في المناجم المكشوفة الضخمة.
      تدور عجلة كبيرة بالدلاء في طرف ذراعها وتملأ سيرًا ناقلًا طويلًا.
      أكبرها يزيد طوله على 200 متر، وهذا يجعلها من أكبر الآلات على اليابسة.
  machine.loader_crane_truck:
    label: شاحنة برافعة
    summary: شاحنة لها ذراع تنطوي، ترفع الأحمال وتنزلها.
    info: |
      تحمل الشاحنة برافعة ذراعها الهيدروليكية المطوية خلف غرفة السائق.
      تستطيع أن تُنزل الطوب أو الأنابيب أو المنصّات من دون أي آلة أخرى.
      وقبل أن ترفع، تمدّ أرجلًا على الجانبين حتى تبقى ثابتة.
