lang: bg
pivot: false
title: Багери и строителни машини
cards:
  machine.excavator:
    label: багер
    summary: Машина за копаене с дълга стрела и кофа със зъби.
    info: |
      Багерът се движи на вериги, затова не потъва в меката кал.
      Цялата горна част с кабината и стрелата може да се завърта в кръг.
      Стрелата се движи с хидравлика, тоест с масло, което се тласка по тръби под високо налягане.
  machine.mini_excavator:
    label: мини багер
    summary: Малък багер, който минава през градинска портичка.
    info: |
      Мини багерът копае там, където голям не би се побрал, например в градини, дворове и тесни улички.
      Обикновено се движи на гумени вериги, затова не поврежда настилката.
      Малкият нож отпред избутва пръстта обратно в дупката.
  machine.backhoe_loader:
    label: багер-товарач
    summary: Трактор с кофа отпред и стрела за копаене отзад.
    info: |
      Багер-товарачът е две машини в една, отпред товарач, а отзад багер.
      Шофьорът завърта седалката си, за да работи със задната стрела.
      Движи се на колела, затова може да кара по пътя от един обект до друг.
  machine.wheel_loader:
    label: челен товарач
    summary: Машина с огромни гуми, която гребе и пренася пясък и чакъл.
    info: |
      Челният товарач напълва голямата си предна кофа и я изсипва в камиони.
      Тялото му се пречупва по средата, затова може да завива на тесни места.
      Най-големите товарачи имат гуми, по-високи от възрастен човек.
  machine.bulldozer:
    label: булдозер
    summary: Силна машина на вериги, която бута пръст с широк нож.
    info: |
      Булдозерът бута пръст, камъни и пясък със стоманения нож отпред.
      Ноктето отзад, което се нарича рипер, разбива твърдата земя.
      Широките вериги разпределят тежестта му, затова може да се движи по рохкава пръст.
  machine.skid_steer:
    label: мини товарач
    summary: Малък товарач като кутия, който се завърта на място.
    info: |
      Мини товарачът завива, като върти колелата от едната страна по-бързо, отколкото от другата.
      Така може да се завърти на място, почти като танк.
      Вместо кофа може да носи много други инструменти, например вили, четки или свредел.
  machine.dump_truck:
    label: самосвал
    summary: Камион, който изсипва товара си назад.
    info: |
      Самосвалът вози пясък, чакъл или пръст в стоманено корито.
      Хидравлични бутала вдигат предната част на коритото и товарът се изсипва отзад.
      После коритото пак се спуска и самосвалът тръгва за още.
  machine.articulated_hauler:
    label: шарнирен самосвал
    summary: Самосвал за неравен терен, който се пречупва по средата.
    info: |
      Шарнирният самосвал има две части, свързани с шарнир, затова се пречупва по средата.
      Така минава през кал и неравности там, където обикновен камион би заседнал.
      Направен е за строителни обекти и кариери, а не за пътища.
  machine.mining_truck:
    label: кариерен самосвал
    summary: Гигантски самосвал, който работи в огромни открити рудници.
    info: |
      Кариерните самосвали са сред най-големите камиони в света.
      Гумите им са по-високи от възрастен човек, а шофьорът се качва до кабината по стълба.
      Най-големите могат да носят над 400 тона скали наведнъж.
  machine.concrete_mixer:
    label: бетоновоз
    summary: Камион с голям барабан, който непрекъснато се върти.
    info: |
      Бетоновозът кара пресен бетон до строителния обект.
      Барабанът се върти през целия път, за да не се втвърди бетонът вътре.
      Когато барабанът се завърти наобратно, бетонът се излива по улея.
  machine.concrete_pump:
    label: бетонпомпа
    summary: Камион с дълга сгъваема стрела, който подава бетон нависоко.
    info: |
      Бетонпомпата тласка мокър бетон по тръба покрай дългата си стрела.
      Стрелата се разгъва като огромен пръст и стига до горните етажи на сградата.
      Стоманени крака отстрани пазят камиона да не се преобърне.
  machine.tower_crane:
    label: кулокран
    summary: Висок кран, който стои над строителния обект.
    info: |
      Кулокранът вдига тежки товари, например стоманени греди и бетон, до върха на сградата.
      Кранистът се качва вътре в кулата до малка кабина най-горе.
      Тежки бетонни блокове на късата стрела уравновесяват товара на дългата стрела.
  machine.mobile_crane:
    label: автокран
    summary: Кран на камион със стрела, която се издължава все повече.
    info: |
      Автокранът сам стига до обекта на собствените си колела.
      Стрелата му е телескопична, тоест се издърпва като далекоглед и става много по-дълга.
      Преди да вдигне товар, разпъва здрави крака от двете страни, за да не се преобърне.
  machine.crawler_crane:
    label: верижен кран
    summary: Много силен кран на вериги с висока решетъчна стрела.
    info: |
      Верижният кран стои на вериги, които разпределят огромната му тежест по земята.
      Дългата му стрела е от стоманена решетка, лека, но много здрава.
      Големите верижни кранове вдигат части от мостове и вятърни турбини.
  machine.road_roller:
    label: пътен валяк
    summary: Тежка машина с гладки стоманени барабани, която изглажда асфалта.
    info: |
      Пътният валяк минава бавно по пресния асфалт и го притиска, за да стане равен и твърд.
      Стоманените му барабани могат да вибрират много бързо и така уплътняват пътя още по-добре.
      Барабаните се пръскат с вода, за да не залепва горещият асфалт по тях.
  machine.asphalt_paver:
    label: асфалтополагаща машина
    summary: Машина, която полага нов пласт от пътя.
    info: |
      Камиони изсипват горещ асфалт в предната част на машината.
      Тя бавно се движи напред и го разстила след себе си в равен пласт.
      Обикновено точно след нея върви пътен валяк.
  machine.motor_grader:
    label: грейдер
    summary: Дълга машина с нож под корема, която изравнява пътища.
    info: |
      Грейдерът има отдолу дълъг нож, между предните и задните колела.
      Ножът може да се накланя и завърта, затова земята става съвсем равна или с лек наклон.
      Грейдерите изравняват черни пътища и подготвят земята, преди да се построи нов път.
  machine.forklift:
    label: мотокар
    summary: Малка машина, която вдига товари на две вилици.
    info: |
      Мотокарът пъха двете си вилици под палета и я вдига.
      Работи в складове, фабрики и магазини.
      Тежка противотежест отзад го пази да не падне напред под товара.
  machine.telehandler:
    label: телескопичен товарач
    summary: Товарач с дълга изтегляща се стрела, който вдига неща нависоко.
    info: |
      Телескопичният товарач е като мотокар с дълга телескопична стрела.
      Може да вдигне палета с тухли на покрива или да я подаде дълбоко в сградата.
      Използва се на строежи и във ферми, където вдига бали сено.
  machine.boom_lift:
    label: автовишка
    summary: Машина, която вдига работници нависоко в кош.
    info: |
      Автовишката вдига високо във въздуха малка платформа с парапет.
      Работниците стоят в нея, когато боядисват стени, поправят лампи или режат клони.
      Чупещата ѝ се стрела може да стига нагоре, а също и над препятствия.
  machine.scissor_lift:
    label: ножична платформа
    summary: Платформа, която се издига право нагоре на кръстосани подпори.
    info: |
      Ножичната платформа има кръстосани метални подпори, които се разтварят като ножица.
      Когато се разтварят, платформата отгоре се издига право нагоре.
      Работниците я използват в халета и складове, за да стигнат до тавана.
  machine.demolition_breaker:
    label: хидравличен чук
    summary: Багер с чук вместо кофа, който троши бетон.
    info: |
      Хидравличният чук е огромен чук, закрепен на стрелата на багер.
      Удря бетона и скалите много пъти в секунда, докато не се напукат.
      Помага да се събарят стари сгради и да се трошат скали в кариерите.
  machine.pile_driver:
    label: пилонабивна машина
    summary: Машина, която забива дълги стълбове дълбоко в земята.
    info: |
      Пилонабивната машина натиска или забива в земята дълги стоманени или бетонни стълбове, наречени пилоти.
      Пилотите държат сгради и мостове там, където земята е мека.
      Има висока мачта, която държи пилота съвсем изправен.
  machine.drilling_rig:
    label: сондажна машина
    summary: Машина на вериги, която пробива дълбоки дупки в земята.
    info: |
      Сондажната машина върти дълъг спираловиден свредел, който пробива дълбока дупка.
      Пръстта излиза нагоре по спиралата и се трупа около дупката.
      Дупките се пълнят с бетон, за да станат здрави основи.
  machine.tunnel_boring_machine:
    label: тунелопробивна машина
    summary: Гигантска кръгла машина, която копае тунели под земята.
    info: |
      Отпред тунелопробивната машина има огромно кръгло колело с режещи дискове, което бавно се върти и смила скалата.
      Зад него машината облицова стените на тунела с бетонни части.
      На тунелопробивните машини често дават женски имена.
  machine.cold_planer:
    label: пътна фреза
    summary: Машина, която изстъргва стария, изтъркан асфалт.
    info: |
      Пътната фреза има отдолу въртящ се барабан с остри зъби.
      Тя изстъргва горния пласт на стария път, а транспортна лента товари парчетата в камион.
      Старият асфалт може да се използва отново в нов път.
  machine.plate_compactor:
    label: виброплоча
    summary: Малка вибрираща плоча, която работникът бута, за да уплътни земята.
    info: |
      Виброплочата има тежка стоманена плоча, която вибрира много бързо.
      Работникът върви след нея и я управлява с дръжката.
      Тя уплътнява пясък и чакъл под пътеки, тераси и тротоари.
  machine.sheepsfoot_roller:
    label: валяк „овча стъпка“
    summary: Валяк с барабан на бучки, който уплътнява пръстта.
    info: |
      Барабанът на този валяк е покрит с издатини, наречени гърбици.
      Гърбиците се забиват дълбоко в пръстта и я уплътняват по-добре от гладък барабан.
      Използва се за пръст и глина, например под нови пътища или за язовирни стени.
  machine.bucket_wheel_excavator:
    label: роторен багер
    summary: Гигантска машина с въртящо се колело, пълно с кофи.
    info: |
      Роторният багер копае въглища и пръст в огромни открити рудници.
      Голямо колело с кофи се върти в края на стрелата му и пълни дълга транспортна лента.
      Най-големите са дълги над 200 метра, затова са сред най-големите машини на сушата.
  machine.loader_crane_truck:
    label: камион с кран
    summary: Камион със сгъваема стрела, който сам товари и разтоварва.
    info: |
      Камионът с кран носи собствена сгъваема хидравлична стрела точно зад кабината.
      Може да разтовари тухли, тръби или палети без никаква друга машина.
      Преди да вдигне товар, разпъва крака отстрани, за да стои стабилно.
