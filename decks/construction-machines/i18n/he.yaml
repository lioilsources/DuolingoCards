lang: he
pivot: false
title: כלים הנדסיים
cards:
  machine.excavator:
    label: מחפר
    summary: מכונת חפירה עם זרוע ארוכה וכף מלאה בשיניים.
    info: |
      המחפר נוסע על זחלים, ולכן הוא לא שוקע בבוץ רך.
      כל החלק העליון, עם התא והזרוע, יכול להסתובב סיבוב שלם.
      הזרוע זזה בעזרת הידראוליקה, כלומר שמן שנדחף בצינורות בלחץ גבוה.
  machine.mini_excavator:
    label: מחפר קטן
    summary: מחפר קטן שעובר דרך שער של גינה.
    info: |
      המחפר הקטן חופר במקומות שמחפר גדול לא נכנס אליהם, כמו גינות, חצרות ורחובות צרים.
      בדרך כלל הוא נוסע על זחלי גומי, ולכן הוא לא הורס משטחים מרוצפים.
      הלהב הקטן מלפנים דוחף את האדמה בחזרה לתוך הבור.
  machine.backhoe_loader:
    label: מחפרון
    summary: טרקטור עם כף גריפה מלפנים וזרוע חפירה מאחור.
    info: |
      מחפרון הוא שתי מכונות באחת, מעמיס מלפנים ומחפר מאחור.
      הנהג מסובב את הכיסא לאחור כדי לעבוד עם הזרוע האחורית.
      הוא נוסע על גלגלים, ולכן הוא יכול לנסוע בכביש מעבודה אחת לעבודה הבאה.
  machine.wheel_loader:
    label: שופל
    summary: מכונה עם צמיגים ענקיים שגורפת ומובילה חול וחצץ.
    info: |
      השופל ממלא את הכף הגדולה שלו מלפנים ושופך אותה לתוך משאיות.
      הגוף שלו מתכופף באמצע, וזה עוזר לו להסתובב במקומות צפופים.
      לשופלים הגדולים ביותר יש צמיגים גבוהים יותר מאדם מבוגר.
  machine.bulldozer:
    label: דחפור
    summary: מכונה חזקה על זחלים שדוחפת אדמה בעזרת להב רחב.
    info: |
      הדחפור דוחף אדמה, סלעים וחול בעזרת להב הפלדה שבחזית שלו.
      הטופר מאחור, שנקרא מְפַתֵּחַ, שובר אדמה קשה.
      הזחלים הרחבים שלו מפזרים את המשקל שלו, ולכן הוא יכול לנסוע על אדמה תחוחה.
  machine.skid_steer:
    label: בובקט
    summary: מעמיס קטן בצורת קופסה שיכול להסתובב במקום.
    info: |
      הבובקט פונה כשהגלגלים בצד אחד מסתובבים מהר יותר מהגלגלים בצד השני.
      כך הוא יכול להסתובב סביב עצמו במקום, כמעט כמו טנק.
      במקום הכף אפשר לחבר אליו כלים רבים אחרים, כמו מזלג, מברשת או מקדח.
  machine.dump_truck:
    label: משאית רכינה
    summary: משאית ששופכת את המטען שלה מאחור.
    info: |
      משאית רכינה מובילה חול, חצץ או אדמה בארגז פלדה שנקרא ארגז רכינה.
      בוכנות הידראוליות מרימות את החלק הקדמי של הארגז, והמטען מחליק החוצה מאחור.
      אחר כך הארגז יורד בחזרה, והמשאית נוסעת להביא עוד.
  machine.articulated_hauler:
    label: משאית רכינה מפרקית
    summary: משאית רכינה לשטח קשה שמתכופפת באמצע.
    info: |
      למשאית רכינה מפרקית יש שני חלקים שמחוברים במפרק, ולכן היא מתכופפת באמצע.
      זה עוזר לה לנסוע בבוץ ועל מהמורות, במקומות שבהם משאית רגילה הייתה נתקעת.
      היא בנויה לאתרי בנייה ולמחצבות, לא לכבישים.
  machine.mining_truck:
    label: משאית כרייה
    summary: משאית רכינה ענקית שעובדת במכרות פתוחים עצומים.
    info: |
      משאיות כרייה הן מהמשאיות הגדולות ביותר בעולם.
      הצמיגים שלהן גבוהים יותר מאדם מבוגר, והנהג מטפס בסולם כדי להגיע לתא.
      הגדולות ביותר יכולות להוביל יותר מ־400 טונות של סלעים בבת אחת.
  machine.concrete_mixer:
    label: מערבל בטון
    summary: משאית עם תוף גדול שכל הזמן מסתובב.
    info: |
      מערבל בטון מביא בטון טרי לאתר הבנייה.
      התוף ממשיך להסתובב בדרך, כדי שהבטון לא יתקשה בתוכו.
      כשהתוף מסתובב לכיוון השני, הבטון נשפך החוצה דרך המרזב.
  machine.concrete_pump:
    label: משאבת בטון
    summary: משאית עם זרוע ארוכה ומתקפלת ששופכת בטון גבוה למעלה.
    info: |
      משאבת בטון דוחפת בטון רטוב בצינור שעובר לאורך הזרוע הארוכה שלה.
      הזרוע נפתחת כמו אצבע ענקית ומגיעה עד הקומות העליונות של הבניין.
      רגלי פלדה בצדדים שומרות שהמשאית לא תתהפך.
  machine.tower_crane:
    label: עגורן צריח
    summary: עגורן גבוה שעומד מעל אתר הבנייה.
    info: |
      עגורן צריח מרים משאות כבדים כמו קורות פלדה ובטון עד לראש הבניין.
      המפעיל מטפס בתוך המגדל אל תא קטן בראשו.
      גושי בטון כבדים על הזרוע הקצרה מאזנים את המשא שעל הזרוע הארוכה.
  machine.mobile_crane:
    label: מנוף נייד
    summary: מנוף על משאית, עם זרוע שנשלפת ומתארכת עוד ועוד.
    info: |
      המנוף הנייד נוסע לאתר הבנייה על הגלגלים שלו.
      הזרוע שלו טלסקופית, כלומר היא נשלפת החוצה כמו טלסקופ ונעשית ארוכה הרבה יותר.
      לפני שהוא מרים, הוא פורש רגליים חזקות לשני הצדדים כדי שלא יתהפך.
  machine.crawler_crane:
    label: מנוף זחלי
    summary: מנוף חזק מאוד על זחלים, עם זרוע גבוהה בצורת מסגרת.
    info: |
      מנוף זחלי עומד על זחלים, שמפזרים את המשקל העצום שלו על הקרקע.
      הזרוע הארוכה שלו עשויה מסבכת פלדה, קלה אבל חזקה מאוד.
      מנופים זחליים גדולים מרימים חלקים של גשרים ושל טורבינות רוח.
  machine.road_roller:
    label: מכבש
    summary: מכונה כבדה עם תופי פלדה חלקים שמשטחת אספלט.
    info: |
      המכבש נוסע לאט על אספלט טרי ולוחץ אותו עד שהוא שטוח וקשה.
      תופי הפלדה שלו יכולים לרעוד מהר מאוד, וכך הם מהדקים את הכביש עוד יותר טוב.
      מתיזים מים על התופים כדי שהאספלט החם לא יידבק אליהם.
  machine.asphalt_paver:
    label: מפזרת אספלט
    summary: מכונה שמניחה שכבה חדשה של כביש.
    info: |
      משאיות שופכות אספלט חם לחלק הקדמי של המפזרת.
      המפזרת פורסת אותו מאחוריה בשכבה אחידה בזמן שהיא מתקדמת לאט.
      בדרך כלל מכבש נוסע מיד אחריה.
  machine.motor_grader:
    label: מפלסת
    summary: מכונה ארוכה עם להב מתחת לבטן שמיישרת דרכים.
    info: |
      למפלסת יש להב ארוך מתחתיה, בין הגלגלים הקדמיים לאחוריים.
      הלהב יכול להטות ולהסתובב, ולכן הוא יכול ליישר את הקרקע לגמרי או ליצור שיפוע קל.
      מפלסות מיישרות דרכי עפר וחצץ ומכינות את הקרקע לפני שבונים כביש חדש.
  machine.forklift:
    label: מלגזה
    summary: רכב קטן שמרים מטענים על שתי שיניים.
    info: |
      המלגזה מכניסה את שתי השיניים שלה מתחת למשטח ומרימה אותו.
      היא עובדת במחסנים, במפעלים ובחנויות.
      משקולת כבדה מאחור שומרת שהיא לא תיפול קדימה מתחת למטען.
  machine.telehandler:
    label: מלגזה טלסקופית
    summary: מעמיס עם זרוע ארוכה שנשלפת החוצה כדי להרים דברים גבוה.
    info: |
      מלגזה טלסקופית היא כמו מלגזה עם זרוע טלסקופית ארוכה.
      היא יכולה להרים משטח של לבנים עד הגג או עמוק לתוך הבניין.
      משתמשים בה באתרי בנייה ובחוות, ושם היא מרימה חבילות של חציר.
  machine.boom_lift:
    label: סל הרמה
    summary: מכונה שמרימה עובדים גבוה בתוך סל.
    info: |
      סל הרמה מרים גבוה לאוויר במה קטנה עם מעקה.
      העובדים עומדים בה כדי לצבוע קירות, לתקן פנסים או לגזום ענפים.
      הזרוע שלו, עם המפרקים, יכולה להגיע למעלה וגם מעל מכשולים.
  machine.scissor_lift:
    label: במת מספריים
    summary: במה שעולה ישר למעלה על תומכות מוצלבות.
    info: |
      לבמת מספריים יש תומכות מתכת מוצלבות שנפתחות כמו מספריים.
      כשהן נפתחות, הבמה שלמעלה עולה ישר למעלה.
      עובדים משתמשים בה באולמות ובמחסנים כדי להגיע לתקרה.
  machine.demolition_breaker:
    label: פטיש הידראולי
    summary: מחפר עם פטיש במקום כף, ששובר בטון.
    info: |
      פטיש הידראולי הוא פטיש ענק שמחובר לזרוע של מחפר.
      הוא מכה בבטון ובסלע הרבה פעמים בכל שנייה, עד שהם נסדקים.
      הוא עוזר להרוס בניינים ישנים ולשבור סלעים במחצבות.
  machine.pile_driver:
    label: מכונת כלונסאות
    summary: מכונה שתוקעת עמודים ארוכים עמוק לתוך האדמה.
    info: |
      מכונת כלונסאות דוחפת או מכה עמודים ארוכים מפלדה או מבטון, שנקראים כלונסאות, לתוך האדמה.
      הכלונסאות מחזיקים בניינים וגשרים במקומות שבהם האדמה רכה.
      יש לה תורן גבוה ששומר שהכלונס יהיה ישר לגמרי.
  machine.drilling_rig:
    label: מקדחה
    summary: מכונה על זחלים שקודחת חורים עמוקים באדמה.
    info: |
      המקדחה מסובבת מקדח ארוך בצורת ספירלה שקודח חור עמוק.
      האדמה עולה לאורך הספירלה ונערמת מסביב לחור.
      ממלאים את החורים בבטון כדי ליצור יסודות חזקים.
  machine.tunnel_boring_machine:
    label: מכונת כרייה
    summary: מכונה עגולה ענקית שחופרת מנהרות מתחת לאדמה.
    info: |
      בחזית של מכונת הכרייה יש גלגל עגול ענק עם דיסקיות חיתוך, שמסתובב לאט ושוחק את הסלע.
      מאחוריו המכונה מצפה את קירות המנהרה בחלקי בטון.
      למכונות כרייה נותנים לעיתים קרובות שמות של בנות.
  machine.cold_planer:
    label: מכונת קרצוף
    summary: מכונה שמקרצפת אספלט ישן ושחוק.
    info: |
      למכונת קרצוף יש מתחת תוף מסתובב עם שיניים חדות.
      היא מקרצפת את השכבה העליונה של כביש ישן, ומסוע מעמיס את השברים על משאית.
      אפשר להשתמש שוב באספלט הישן בכביש חדש.
  machine.plate_compactor:
    label: מהדק צלחת
    summary: צלחת קטנה ורועדת שעובד דוחף כדי להדק את הקרקע.
    info: |
      למהדק צלחת יש צלחת פלדה כבדה שרועדת מהר מאוד.
      העובד הולך מאחוריו ומכוון אותו בעזרת הידית.
      הוא מהדק חול וחצץ מתחת לשבילים, לפטיו ולמדרכות.
  machine.sheepsfoot_roller:
    label: מכבש רגל כבש
    summary: מכבש עם תוף מלא בליטות שמהדק אדמה.
    info: |
      התוף של מכבש רגל כבש מכוסה בגושים בולטים, שנקראים רגליות.
      הרגליות נכנסות עמוק לאדמה ומהדקות אותה טוב יותר מתוף חלק.
      משתמשים בו לאדמה ולחרסית, למשל מתחת לכבישים חדשים או לבניית סכרים.
  machine.bucket_wheel_excavator:
    label: מחפר גלגל דליים
    summary: מכונה עצומה עם גלגל מסתובב מלא בדליים.
    info: |
      מחפר גלגל דליים חופר פחם ואדמה במכרות פתוחים עצומים.
      גלגל גדול עם דליים מסתובב בקצה הזרוע שלו וממלא מסוע ארוך.
      הגדולים ביותר ארוכים יותר מ־200 מטרים, ולכן הם מהמכונות הגדולות ביותר על היבשה.
  machine.loader_crane_truck:
    label: משאית מנוף
    summary: משאית עם זרוע מתקפלת שמעמיסה ופורקת מטענים.
    info: |
      משאית מנוף נושאת זרוע הידראולית מתקפלת משלה, מאחורי תא הנהג.
      היא יכולה לפרוק לבנים, צינורות או משטחים בלי שום מכונה אחרת.
      לפני שהיא מרימה, היא פורשת רגליים לצדדים כדי לעמוד יציב.
