lang: el
pivot: false
title: Εκσκαφείς και μηχανήματα έργων
cards:
  machine.excavator:
    label: εκσκαφέας
    summary: Ένα μηχάνημα που σκάβει, με μακρύ βραχίονα και κουβά γεμάτο δόντια.
    info: |
      Ο εκσκαφέας κινείται με ερπύστριες, για να μη βουλιάζει στη μαλακή λάσπη.
      Όλο το πάνω μέρος, με την καμπίνα και τον βραχίονα, μπορεί να γυρίσει ολόκληρο γύρω γύρω.
      Τον βραχίονα τον κινεί το υδραυλικό σύστημα, δηλαδή λάδι που σπρώχνεται μέσα σε σωλήνες με μεγάλη πίεση.
  machine.mini_excavator:
    label: μίνι εκσκαφέας
    summary: Ένας μικρός εκσκαφέας που χωράει να περάσει από την πόρτα ενός κήπου.
    info: |
      Ο μίνι εκσκαφέας σκάβει εκεί που ένας μεγάλος δεν θα χωρούσε, όπως σε κήπους, αυλές και στενούς δρόμους.
      Συνήθως κινείται με λαστιχένιες ερπύστριες, για να μη χαλάει το πλακόστρωτο.
      Η μικρή λεπίδα μπροστά σπρώχνει το χώμα πίσω στον λάκκο.
  machine.backhoe_loader:
    label: φορτωτοεκσκαφέας
    summary: Ένα τρακτέρ με κουτάλα μπροστά και βραχίονα για σκάψιμο πίσω.
    info: |
      Ο φορτωτοεκσκαφέας είναι δύο μηχανήματα σε ένα, φορτωτής μπροστά και εκσκαφέας πίσω.
      Ο χειριστής γυρίζει το κάθισμα ανάποδα για να δουλέψει με τον πίσω βραχίονα.
      Έχει ρόδες, έτσι μπορεί να πηγαίνει από τον δρόμο από τη μια δουλειά στην άλλη.
  machine.wheel_loader:
    label: φορτωτής
    summary: Ένα μηχάνημα με τεράστια λάστιχα που φορτώνει και κουβαλάει άμμο και χαλίκι.
    info: |
      Ο φορτωτής γεμίζει τη μεγάλη μπροστινή του κουτάλα και την αδειάζει σε φορτηγά.
      Το σώμα του λυγίζει στη μέση, και έτσι μπορεί να στρίβει σε στενά σημεία.
      Οι μεγαλύτεροι φορτωτές έχουν λάστιχα πιο ψηλά από έναν μεγάλο άνθρωπο.
  machine.bulldozer:
    label: μπουλντόζα
    summary: Ένα δυνατό μηχάνημα με ερπύστριες που σπρώχνει το χώμα με μια φαρδιά λεπίδα.
    info: |
      Η μπουλντόζα σπρώχνει χώμα, πέτρες και άμμο με την ατσάλινη λεπίδα μπροστά της.
      Το νύχι πίσω λέγεται ρίπερ και σπάει το σκληρό έδαφος.
      Οι φαρδιές ερπύστριές της μοιράζουν το βάρος της, έτσι μπορεί να περνάει πάνω από χαλαρό χώμα.
  machine.skid_steer:
    label: μίνι φορτωτής
    summary: Ένας μικρός φορτωτής σαν κουτί που μπορεί να γυρίσει επί τόπου.
    info: |
      Ο μίνι φορτωτής στρίβει γυρίζοντας τις ρόδες της μιας πλευράς πιο γρήγορα από της άλλης.
      Έτσι μπορεί να στριφογυρίσει επί τόπου, σχεδόν σαν τανκ.
      Αντί για την κουτάλα μπορεί να έχει πολλά άλλα εργαλεία, όπως περόνες, βούρτσες ή τρυπάνι.
  machine.dump_truck:
    label: ανατρεπόμενο φορτηγό
    summary: Ένα φορτηγό που αδειάζει το φορτίο του από πίσω.
    info: |
      Το ανατρεπόμενο φορτηγό κουβαλάει άμμο, χαλίκι ή χώμα σε μια ατσάλινη καρότσα.
      Υδραυλικά έμβολα σηκώνουν το μπροστινό μέρος της καρότσας, και το φορτίο γλιστράει έξω από πίσω.
      Μετά η καρότσα κατεβαίνει ξανά και το φορτηγό φεύγει να φέρει κι άλλο.
  machine.articulated_hauler:
    label: αρθρωτό ανατρεπόμενο
    summary: Ένα ανατρεπόμενο για δύσβατο έδαφος που λυγίζει στη μέση.
    info: |
      Το αρθρωτό ανατρεπόμενο έχει δύο μέρη ενωμένα με μια άρθρωση, γι' αυτό λυγίζει στη μέση.
      Έτσι περνάει μέσα από λάσπες και πάνω από λακκούβες εκεί που ένα κανονικό φορτηγό θα κολλούσε.
      Είναι φτιαγμένο για εργοτάξια και λατομεία, όχι για δρόμους.
  machine.mining_truck:
    label: ανατρεπόμενο ορυχείου
    summary: Ένα γιγάντιο ανατρεπόμενο που δουλεύει σε τεράστια ανοιχτά ορυχεία.
    info: |
      Τα ανατρεπόμενα ορυχείου είναι από τα μεγαλύτερα φορτηγά στον κόσμο.
      Τα λάστιχά τους είναι πιο ψηλά από έναν μεγάλο άνθρωπο, και ο οδηγός ανεβαίνει σε μια σκάλα για να φτάσει στην καμπίνα.
      Τα μεγαλύτερα μπορούν να κουβαλήσουν πάνω από 400 τόνους πέτρες με τη μία.
  machine.concrete_mixer:
    label: μπετονιέρα
    summary: Ένα φορτηγό με μεγάλο τύμπανο που γυρίζει συνέχεια.
    info: |
      Η μπετονιέρα φέρνει φρέσκο μπετόν στο εργοτάξιο.
      Το τύμπανο γυρίζει σε όλη τη διαδρομή, για να μην πήξει το μπετόν μέσα του.
      Όταν το τύμπανο γυρίσει ανάποδα, το μπετόν χύνεται έξω από το αυλάκι.
  machine.concrete_pump:
    label: αντλία μπετόν
    summary: Ένα φορτηγό με μακρύ πτυσσόμενο βραχίονα που ρίχνει μπετόν ψηλά.
    info: |
      Η αντλία μπετόν σπρώχνει υγρό μπετόν μέσα από έναν σωλήνα κατά μήκος του μακριού της βραχίονα.
      Ο βραχίονας ανοίγει σαν ένα γιγάντιο δάχτυλο και φτάνει στους πάνω ορόφους ενός κτιρίου.
      Ατσάλινα πόδια στα πλάγια κρατάνε το φορτηγό να μην αναποδογυρίσει.
  machine.tower_crane:
    label: γερανός πύργος
    summary: Ένας ψηλός γερανός που στέκεται πάνω από ένα εργοτάξιο.
    info: |
      Ο γερανός πύργος σηκώνει βαριά φορτία, όπως ατσάλινα δοκάρια και μπετόν, μέχρι την κορυφή ενός κτιρίου.
      Ο χειριστής σκαρφαλώνει μέσα στον πύργο μέχρι μια μικρή καμπίνα στην κορυφή.
      Βαριά τσιμεντένια κομμάτια στον κοντό βραχίονα ισορροπούν το φορτίο στον μακρύ βραχίονα.
  machine.mobile_crane:
    label: κινητός γερανός
    summary: Ένας γερανός πάνω σε φορτηγό με βραχίονα που βγαίνει όλο και πιο μακρύς.
    info: |
      Ο κινητός γερανός πηγαίνει στο εργοτάξιο με τις δικές του ρόδες.
      Ο βραχίονάς του είναι τηλεσκοπικός, βγαίνει σαν τηλεσκόπιο και γίνεται πολύ πιο μακρύς.
      Πριν σηκώσει κάτι, βγάζει δυνατά πόδια και στις δύο πλευρές για να μην αναποδογυρίσει.
  machine.crawler_crane:
    label: ερπυστριοφόρος γερανός
    summary: Ένας πολύ δυνατός γερανός με ερπύστριες και ψηλό βραχίονα σαν σκαλωσιά.
    info: |
      Ο ερπυστριοφόρος γερανός στέκεται πάνω σε ερπύστριες, που μοιράζουν το τεράστιο βάρος του στο έδαφος.
      Ο μακρύς βραχίονάς του είναι φτιαγμένος από ατσάλινο δικτύωμα, ελαφρύ αλλά πολύ γερό.
      Οι μεγάλοι ερπυστριοφόροι γερανοί σηκώνουν κομμάτια από γέφυρες και ανεμογεννήτριες.
  machine.road_roller:
    label: οδοστρωτήρας
    summary: Ένα βαρύ μηχάνημα με λείους ατσάλινους κυλίνδρους που ισιώνει την άσφαλτο.
    info: |
      Ο οδοστρωτήρας περνάει αργά πάνω από τη φρέσκια άσφαλτο και την πατάει ώστε να γίνει επίπεδη και σκληρή.
      Οι ατσάλινοι κύλινδροί του μπορούν να τρέμουν πολύ γρήγορα, και έτσι πατάνε τον δρόμο ακόμα καλύτερα.
      Ψεκάζουν νερό στους κυλίνδρους για να μην κολλάει πάνω τους η καυτή άσφαλτος.
  machine.asphalt_paver:
    label: ασφαλτοστρωτήρας
    summary: Ένα μηχάνημα που στρώνει μια καινούργια στρώση δρόμου.
    info: |
      Φορτηγά αδειάζουν καυτή άσφαλτο στο μπροστινό μέρος του ασφαλτοστρωτήρα.
      Ο ασφαλτοστρωτήρας την απλώνει πίσω του σε ομοιόμορφη στρώση, καθώς προχωράει αργά μπροστά.
      Συνήθως ακριβώς από πίσω του ακολουθεί ένας οδοστρωτήρας.
  machine.motor_grader:
    label: ισοπεδωτής
    summary: Ένα μακρύ μηχάνημα με λεπίδα κάτω από την κοιλιά του που ισιώνει τους δρόμους.
    info: |
      Ο ισοπεδωτής έχει από κάτω μια μακριά λεπίδα, ανάμεσα στις μπροστινές και τις πίσω ρόδες.
      Η λεπίδα γέρνει και γυρίζει, έτσι μπορεί να κάνει το έδαφος τελείως επίπεδο ή λίγο κεκλιμένο.
      Οι ισοπεδωτές ισιώνουν χωματόδρομους και ετοιμάζουν το έδαφος πριν φτιαχτεί ένας καινούργιος δρόμος.
  machine.forklift:
    label: κλαρκ
    summary: Ένα μικρό όχημα που σηκώνει φορτία πάνω σε δύο περόνες.
    info: |
      Το κλαρκ βάζει τις δύο περόνες του κάτω από μια παλέτα και τη σηκώνει.
      Δουλεύει σε αποθήκες, εργοστάσια και καταστήματα.
      Ένα βαρύ αντίβαρο πίσω το κρατάει να μη γείρει μπροστά από το φορτίο.
  machine.telehandler:
    label: τηλεσκοπικός φορτωτής
    summary: Ένας φορτωτής με μακρύ βραχίονα που βγαίνει για να σηκώνει πράγματα ψηλά.
    info: |
      Ο τηλεσκοπικός φορτωτής είναι σαν κλαρκ με μακρύ τηλεσκοπικό βραχίονα.
      Μπορεί να σηκώσει μια παλέτα με τούβλα πάνω σε μια στέγη ή βαθιά μέσα σε ένα κτίριο.
      Τον χρησιμοποιούν σε εργοτάξια και σε φάρμες, όπου σηκώνει μπάλες σανό.
  machine.boom_lift:
    label: καλαθοφόρο
    summary: Ένα μηχάνημα που σηκώνει εργάτες ψηλά μέσα σε ένα καλάθι.
    info: |
      Το καλαθοφόρο σηκώνει ψηλά στον αέρα μια μικρή πλατφόρμα με κάγκελα.
      Οι εργάτες στέκονται μέσα της για να βάψουν τοίχους, να φτιάξουν φώτα ή να κόψουν κλαδιά.
      Ο αρθρωτός βραχίονάς του φτάνει ψηλά αλλά και πάνω από εμπόδια.
  machine.scissor_lift:
    label: ψαλιδωτή πλατφόρμα
    summary: Μια πλατφόρμα που ανεβαίνει ίσια προς τα πάνω πάνω σε σταυρωτά στηρίγματα.
    info: |
      Η ψαλιδωτή πλατφόρμα έχει σταυρωτά μεταλλικά στηρίγματα που ανοίγουν σαν ψαλίδι.
      Καθώς ανοίγουν, η πλατφόρμα από πάνω ανεβαίνει ίσια προς τα πάνω.
      Οι εργάτες τη χρησιμοποιούν σε αίθουσες και αποθήκες για να φτάσουν στο ταβάνι.
  machine.demolition_breaker:
    label: υδραυλική σφύρα
    summary: Ένας εκσκαφέας με σφυρί αντί για κουβά που σπάει το μπετόν.
    info: |
      Η υδραυλική σφύρα είναι ένα τεράστιο σφυρί στερεωμένο στον βραχίονα ενός εκσκαφέα.
      Χτυπάει το μπετόν και τον βράχο πολλές φορές το δευτερόλεπτο, μέχρι να ραγίσουν.
      Βοηθάει στο γκρέμισμα παλιών κτιρίων και στο σπάσιμο βράχων στα λατομεία.
  machine.pile_driver:
    label: πασσαλοπήχτης
    summary: Ένα μηχάνημα που καρφώνει μακριούς στύλους βαθιά στο έδαφος.
    info: |
      Ο πασσαλοπήχτης σπρώχνει ή καρφώνει στο έδαφος μακριούς στύλους από ατσάλι ή μπετόν, που λέγονται πάσσαλοι.
      Οι πάσσαλοι κρατάνε όρθια κτίρια και γέφυρες εκεί που το έδαφος είναι μαλακό.
      Έχει έναν ψηλό ιστό που κρατάει τον πάσσαλο τελείως ίσιο.
  machine.drilling_rig:
    label: γεωτρύπανο
    summary: Ένα μηχάνημα με ερπύστριες που ανοίγει βαθιές τρύπες στο έδαφος.
    info: |
      Το γεωτρύπανο γυρίζει ένα μακρύ σπειροειδές τρυπάνι που ανοίγει μια βαθιά τρύπα.
      Το χώμα ανεβαίνει πάνω στη σπείρα και μαζεύεται σωρός γύρω από την τρύπα.
      Τις τρύπες τις γεμίζουν με μπετόν για να γίνουν γερά θεμέλια.
  machine.tunnel_boring_machine:
    label: μετροπόντικας
    summary: Ένα γιγάντιο στρογγυλό μηχάνημα που σκάβει τούνελ κάτω από τη γη.
    info: |
      Μπροστά ο μετροπόντικας έχει μια τεράστια στρογγυλή ρόδα με κοπτικούς δίσκους, που γυρίζει αργά και τρίβει τον βράχο.
      Πίσω από αυτήν, το μηχάνημα ντύνει τους τοίχους του τούνελ με κομμάτια από μπετόν.
      Στους μετροπόντικες δίνουν συχνά ονόματα κοριτσιών.
  machine.cold_planer:
    label: φρέζα ασφάλτου
    summary: Ένα μηχάνημα που ξύνει την παλιά, φθαρμένη άσφαλτο.
    info: |
      Η φρέζα ασφάλτου έχει από κάτω ένα τύμπανο που γυρίζει, με κοφτερά δόντια.
      Ξύνει την πάνω στρώση ενός παλιού δρόμου, και ένας μεταφορικός ιμάντας φορτώνει τα κομμάτια σε ένα φορτηγό.
      Η παλιά άσφαλτος μπορεί να ξαναχρησιμοποιηθεί σε έναν καινούργιο δρόμο.
  machine.plate_compactor:
    label: δονητική πλάκα
    summary: Μια μικρή πλάκα που τρέμει και την σπρώχνει ένας εργάτης για να πατήσει το έδαφος.
    info: |
      Η δονητική πλάκα έχει μια βαριά ατσάλινη πλάκα που τρέμει πολύ γρήγορα.
      Ένας εργάτης περπατάει πίσω της και την οδηγεί από τη λαβή.
      Πατάει την άμμο και το χαλίκι κάτω από μονοπάτια, βεράντες και πεζοδρόμια.
  machine.sheepsfoot_roller:
    label: οδοστρωτήρας με πόδια
    summary: Ένας οδοστρωτήρας με ανώμαλο κύλινδρο που πατάει το χώμα.
    info: |
      Ο κύλινδρος ενός οδοστρωτήρα με πόδια είναι γεμάτος τακάκια, που λέγονται πόδια.
      Τα πόδια μπαίνουν βαθιά μέσα στο χώμα και το πατάνε καλύτερα από έναν λείο κύλινδρο.
      Τον χρησιμοποιούν σε χώμα και άργιλο, για παράδειγμα κάτω από καινούργιους δρόμους ή για φράγματα.
  machine.bucket_wheel_excavator:
    label: καδοφόρος εκσκαφέας
    summary: Ένα γιγάντιο μηχάνημα με μια ρόδα γεμάτη κουβάδες που γυρίζει.
    info: |
      Ο καδοφόρος εκσκαφέας σκάβει κάρβουνο και χώμα σε τεράστια ανοιχτά ορυχεία.
      Στην άκρη του βραχίονα γυρίζει μια μεγάλη ρόδα με κουβάδες και γεμίζει έναν μακρύ μεταφορικό ιμάντα.
      Οι μεγαλύτεροι έχουν μήκος πάνω από 200 μέτρα, γι' αυτό είναι από τα μεγαλύτερα μηχανήματα στη στεριά.
  machine.loader_crane_truck:
    label: φορτηγό με γερανό
    summary: Ένα φορτηγό με πτυσσόμενο βραχίονα που φορτώνει και ξεφορτώνει.
    info: |
      Το φορτηγό με γερανό έχει τον δικό του πτυσσόμενο υδραυλικό βραχίονα πίσω από την καμπίνα.
      Μπορεί να ξεφορτώσει τούβλα, σωλήνες ή παλέτες χωρίς άλλο μηχάνημα.
      Πριν σηκώσει κάτι, βγάζει πόδια στα πλάγια για να στέκεται σταθερό.
