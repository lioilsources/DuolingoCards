# construction-machines - 30 construction and mining machines for kids 4-10.
# Machine types, not brands: every brief asks for a generic yellow machine with
# no badges, so FLUX draws the shape kids recognise instead of a dealer photo.
# One whole machine per card on a plain site, three-quarter view, so the arm,
# bucket or boom that names the machine is always visible.
slug: construction-machines
version: 1
tier: 1
brief_attrs: ["(professional photography:1.3)", "(entire machine in frame:1.2)", "(accurate proportions:1.2)", "(highly detailed:1.1)"]
styles:
  - photo
default_style: photo

cards:
  - key: machine.excavator
    hint: crawler excavator, the tracked digger with a long arm and a bucket
    image: machine.excavator.png
    brief:
      subject: yellow crawler excavator digging soil
      attrs: [long two-part hydraulic arm, toothed bucket, cab on a rotating body, steel crawler tracks, three-quarter view, whole machine in frame]
      setting: [plain sandy construction site, clear sky, soft daylight]
      avoid: [text, badges, logos, brand names, people]

