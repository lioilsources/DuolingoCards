lang: la
pivot: false
title: Domestica Animalia
cards:
  pet.cat:
    label: cattus
    summary: Domesticus felis cum pedibus mollibilibus.
    info: Cattus domesticus est animal domestica ex familiae félidae, notus pro sua agilitate, pulchritudine et natura independente.
  pet.dog:
    label: canis
    summary: Fidelis animalia domestica et amicus hominum.
    info: Canis domesticus est lupa domesticatus, primum animale ab humano domesticatum. Plus quam quadringenti genera existunt et dicitur 'fidelissimus amicus hominis'.
  pet.goldfish:
    label: aurata
    summary: Piscis aureus domesticus in aquariis colitur.
    info: Aurata est Carassius auratus, piscis dulceacquae domesticus, qui in aquariis per orbem terrarum colitur. Habet centenas variationes colorum et formarum pinnae.
  pet.guinea_pig:
    label: cavia
    summary: Parva pelosa rodens animalia, popolare domesticum cum pueris.
    info: Cavia domestica est sociabile rodens ex America Meridiana. Emittit rurales sonitus et amicabiliter se habet ad homines.
  pet.hamster:
    label: auratus
    summary: Parvus et pulcher gnawer cum faciis repleta cibo.
    info: Mesocricetus auratus est animalia domesticum frequens. Habet habitum nocturnum activitatis et gaudet currere in rotulo.
  pet.parrot:
    label: psittacus
    summary: Coloratus avis qui imitare potest vocem humanae.
    info: Psittacus varius est species psittaci communissima domesticata ut animalia domestica. Est sapiens et sociabilis, sonos et verba imitantia posse.
  pet.rabbit:
    label: cuniculus
    summary: Pelagios animalculum cum auriculis longis.
    info: Cuniculus domesticus est animal pelagicum populariter tenax cum crine mollili et auriculis conspicuis. Alitur gramina, hortensibus atque herba nova.
  pet.turtle:
    label: testudo
    summary: Animale lentum cum armatura rigida.
    info: Testudo erythrostoma est testudo domestica popularis. Habitat in aquariis cum accessu ad terram, ubi se exsudit sub lampade UV.
