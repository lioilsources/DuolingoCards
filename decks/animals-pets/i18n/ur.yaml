lang: ur
pivot: false
title: گھر کے جانور
cards:
  pet.angelfish:
    label: اسکالار
    summary: ایک خوبصورت چوڑائی والا گول تراشندہ قسم کا گرم خطواۃ ماچھلی
    info: سکالر ایموزون سے تعلق رکھتا ہے، جو اپنے عمدگی کے مثلث شکل میں بناﺅ اور لمبی پرواز والی زانوروں کی وجہ سے سب سے زیادہ مقبول آوارین فشرز میں شامل ہے۔ وہ دبا چاہتی ہے اور نسبتاً گرم پانی (24 لے 28 درجۂ سینٹی گریڈ) کی ضرورت ہوتی ہے۔
  pet.axolotl:
    label: اکسوئلائل
    summary: میکسیکو کا دائمی آباد ماکرو اندر کے ساتھ ایک ملندا
    info: |-
      اکسولوٹل میکسیکن ایک آبی سالامینڈر ہے جو پوری زندگی بچپن کے شکل رکھتا ہے۔
      اس کے خارجی فلوں والی غضروف موجود ہوتے ہیں اور وہ تقریباً حیران کن طرح نظر آتی ہے。
      ایسا لاطینی دریائے 'Xochimilco'، میکسیکو میں صرف وجود دارد ہے اور بالکمل خطرات میں شامل ہے۔
  pet.ball_python:
    label: کرالا کراولسکا
    summary: خوش طبع گردش کرنے والا سپلائر جو کہ ابتدا کے لئے مناسب ہے
    info: کرالا کراولسکا افریقہ عظمیٰ وسطی سے تعلق رکھتی ہے جہاں وہ شاداب میدانوں اور درختوں والے خطوں میں پائی جاتی ہے۔ خطرہ لاحق ہونے پر، وہ مضبوط گیند بنا دیتا ہے(اس وجہ سے بال فائن)۔ یہ حشر نصف صدی سے زائد عمر رسیدہ ہوتا ہے اور لمبائی چودہ سانتیمیٹروں سے پندرہ سانتیمیٹر تک ہوسکتی ہے۔ قید میں آدمی اندازنوں کی مختلف متغیرات بنایا ہے۔
  pet.bearded_dragon:
    label: ووساتا دراك
    summary: ایک عام استراليائی لمبرتن جانورو، گرمی پسنديلا اور لوکل مرغوب
    info: "میڈیم سائز کے ووئس ات دکھن والا جانور، آپٹر ملّز نام لیندے۔ انہند‍ی بڑه فطری طور تے پالتو حیوانات وچ شامل رائج ہوندے کیؤں کہ اوہ خوش قسمتی توں موافق ہُندے نيں۔\nاوہناں منفولٗ زخموں گرميَءِ ۽ عظمت ظاهر کرن لاءِ اپݨى بازوآں کيت‏رو غصّہ ٻاريندا ہويا۔ \nواحد ہتھ بلند کردتا ہوءِ ذلت کې شعائر کماوݙ د‏ اشارہ ہويا۔\nohnaً omnivore هُندا؛昆虫، سبزي، ميوة سميت تمام چيز ماويسي。"
  pet.betta_fish:
    label: بیٹا
    summary: '''جنوب مشرقی ایشیاء سے تعلق رکھنے والا ایک رنگین لابائرنتھ فش ہے۔'
    info: بیٹا بوجھو نام کے ساتھ اس لابیرنث فش مچھلی کو تاجکستان کے پانی دار جگہوں، خصوصتاً رائج کاشت کم زور علاقوں میں پایا جاتا ہے۔ مرد حشرات باہمی طور پر غضبناک ہوتے ہیں؛ اس وجہ سے ان کا نام '暹罗战斗鱼' آیا۔ شاخسانح قسم کی صفات کو منظم کرنے والے عمل کے ذریعے وسعت اختیار کرتی ہے۔
  pet.blue_tongue_skink:
    label: بلو تھونگ سکن
    summary: آسٹریلوی جنساد مع بالغ شدت کے نیلے زباں کے استعمال کے ذریعے روکنا
    info: سکن میڈر جب کہ ایک بڑا آسٹریلین سانپوں والے حشرات کے خلاف دفاع کرنے والا نمایاں بلو تھونگ ۔ وہ پیدوار کارروائی کے طور پر زبان رُد لفظ استعمال کرتا ہے؛ نیلا رنگ منع کردہ ہوتا ہے۔ یہ غیرِ عدوّالحرب، موٹا اور سستا جاندار چند وقت کے دوران فائدہ مند قرار دیا جاسکتا ہے۔ یہ 15 سے 20 سال تک عمر رسیدہ ہوسکتے ہیں اور ان کی لمبائی 40 سانتیمر توں اوور ہوجاتی ہے
  pet.budgerigar:
    label: anđluka
    summary: عالم دا سب تو افسانوي چبوتر ديلاً ماہرو، چلو، استراليائي منجود
    info: "انڈولکا ونل کوواں دُنایِ عالم مَین سب توّ اچھے پالتوٗ تر بدن جانور نہایت مشهور ہند۔\n ان کا رنگ لاجورد، زرد ہوندؤ؛ شادیدار متغیرات(آسمانی آسماݨ والا، سفید، خشخاش والا ) فربائی حصول طرف سے وجود میں لاۓ ڳئے。\n مرداں لوگاں د‏‍ا صوت تققل کرن تو اس قابل ہندؤ او سو تو لفظ سیکھ سکدؤ۔ \n عمر ۵ تو ۱۰ سناءں ہندؤ او اجتماعي ذوق رکھدؤ"
  pet.canary:
    label: کاناڑک
    summary: چھوٹا گلوکار پنجابی جبکہ اپنی آوازوں اور روشن زرد رنگ کے باعث منتخب کیا جاسکتا
    info: "کاناریس کینر افروات سے تعلق رکھتا ہے، جو فرانچائزنگ ملک بحال کرنے والوں نے پندرہويں صدی عالمگیر بنایا۔\n مختلف قسموں کی شناخت ہوتی ہے: گلوکار(roller)، رنگدار(سرخ، سفید)اور آواز دار。\n مردوں کو مشکلات موسیقی سماعت کرتا؛ وہ دوسری غزلوں کے خلاصے حاصل کرسکتے ہیں۔ \n تاریخي طور پر انہیں ذغالی مناجم میں کربن ماڈولٹ کے عنصر کے لئے استعمال کیا جاتا تھا۔"
  pet.cat:
    label: کوچا
    summary: نرم پیروں والے مستقل خانگی مہمان۔
    info: ایک کتّی انسانی گھر میں رہنے والی جانور ہوتی ہے، جس کا علمی نام فیلِس کیٹس ہے۔ وہ تیز دماغ، صاف ستھرا حشر اور آزاد ذہن کی وجہ سے مشہور ہے۔
  pet.chameleon:
    label: چمیلئون
    summary: ایک جسٹر جو الگ الگ حرکت والا عقیدہ رکھدا
    info: |-
      چمیلئون اک جسٹر کا نام اے جو خاص طور پہ سطح مین فن تبدیل کرن د لاءٗ باروفروں تو وابستگي رکھدا ؛ ان لوگان موڈز کوم کمزور کردݨ والى آوازاں د لاءٗ، بالعموم ماخوذ شدە۔
      har akh apni حرکت کرتيا ہے اوّل تو ۳۶۰ درجات تقریباً قبضه کر سکتا ہے。
      tongue لمبائی بدنا تو زائد اے او رفتار 26km/h۔
  pet.chinchilla:
    label: چنچلا
    summary: جنوبی امریکین جانوروں میں سب سے زیادہ موٹا بال والا ہلدوا
    info: |-
      چنچلا ایک جھاڑو والے پہلوان کردوں سے تعلق رکھتا ہے؛ انڈز میں نمایاں طور پر موٹا بال، ہرشائول فارمولس میں ۶۰ لے کرو ٨۰ بوسیدگیاں آتی ہیں۔
       وہ صرف ۲۵ درجۂ حرارت تک برقرار رہ سکتی ہے؛ زائد حالت گرمی قاتل ثابت ہوتی ہے。
       وہ عمر دسوالتوں کے بعد ۱۵ سال تک زندہ رہ سکتی ہے، بعض وقت تو ۲۰ سال سے زادہ بھی۔
  pet.clownfish:
    label: آچھا کلاون
    summary: ایک سبز مچھلی جو درخت نما حشرات کے ساتھ رشتۂ قسمت میں موجود ہے۔
    info: کلاون آچھا کی ایک چھوٹی سمندری مچھلی، جس پر انڈے بحر الہند اور شمالی دوراندوز علاقائیں ترجّمہ شامل ہوتا ہے۔ وہ درخت نما حشرات کے ساتھ رشتۂ قسمت بنالیتا ہے۔ درخت نما حشرات اپنے زہریلے دستوں سے اس کی حفاظت کرتا ہے، تواس درخت نما حشرات کو صاف ستھرا رکھنا اور شارک کو روکنا۔ فلم 'Finding Nemo' (2003) کے بعد یہ ماخوذ کردہ سامراج کا اشارۃ وجود بن گئی۔ تمام کلاونز مردوں کی طرح پیدا ہوجاتے ہیں؛ غالب شخص خواتین میں منتقل ہوسکتا ہے۔
  pet.cockatiel:
    label: نمفا
    summary: ایک چھوٹا استراليائی بلبل جو گلوکاری کی صلاحیت کی وجہ سے مشہور ہے
    info: 'نامفہ اسٹیپ، جھاڑیوں میں پائے جانے والے کورلا سے تعلق رکھتا ہے۔ مرد بچّے فطرت نسبت شگردوں کی طرح آواز دینے کی صلاحیت رکھتے ہیں: وہ قطعات، موسيقارى لذتیں اور لوگوں کے الفاظ سیکھ سکتے ہیں۔ یہ سماجی حیوان ہوتا ہے اور زندگی کے دوران ماالٗ خوبصورتی سے تعامل کرتا ہے۔'
  pet.corn_snake:
    label: کُوئیز کا سبس
    summary: خوددار، روشن橙-سرخ رنگ کا سستا شروع کرنے والا حلقوم
    info: "کُوئیز کا سبسب امریکن جنوب مشرق سے تعلق رکھتا ہے، جہاں وہ فصلوں والی زمینوں اور درختوں پر بسنے والا ہوتا ہے۔\nاس حشر نامرد ہے اور خوش طبع؛ اس کے عضلات دشمنانه حرکت کرنے کی صلاحیت کمزور ہوتی ہے اور قابل استحکام ہونے کی وجہ سے مشہور ہوا ہے。\nایسا لگاتا ہے کہ اس کا نام آٹوں کے مواد یا اندرلے حصے کے نقشوں کی بناء پر دیا گیا ہے جو بالکل چارولائزر کے مثل ہوتا ہے۔ \nیہ ایک متعدد لمبا ہوسکتا ہے اور محصور حالت میں ۲۰ سال تک عمر رسیدہ ہوجاتا ہے۔"
  pet.crayfish:
    label: اکواریم کا رچھنا
    summary: اکواریم میں موجود چھوٹا، رنگدار، سنتری پانی کا رچھنا
    info: "اکواریم کے رچھن جانور اس لئے مقبول ہوتے ہیں کہ وہ فعال روایت پر مشتمل ہو سکتے ہیں، ان کی زندگی بارش والی تصاویر۔\nفلائڈز بلو شrimp (پروکامبروس الینز)، اکواڑوم کے نمونے کے طور پر سب سے زیادہ محبوب قسم ہے。\nرشتوں کے ترقیاتی دوران خود کو غسل دیتا ہے؛ نوجوان کٹّا درست آغاز میں نرم ہوتا ہے۔ \nاس وقت وہ بنیادی صفائی کرنے والا حشر ہونے کے علاوہ بالغوں کے ذخائر اور موذی جلبکوں کو استعمال کرتے ہیں。"
  pet.crested_gecko:
    label: جِئْکُون چوکلیٰط
    summary: رات کے وقت فعّال جِئْکُون جبکہ واضح چمکدار چولستان اور لمبوں آنکھوں کے ساتھ۔
    info: "چوکلیٹ کے رنگ کا جِئْکُون نَو وائس لال دواڑ سے تعلق رکھتا ہے اور لوگوں نے اسے براجمان قرار دیدیا تھا، مگر 1994ء تک اس پر غور شروع ہوتا ہے۔\nایسا حشرات خوبصورتی سے بالکل الگ طرز عمل اختیار کرتا ہے اور صرف شب کے وقت فعال رہتا ہے。\nدوسروں جِئْکُنوں کے مقابلے میں اسے خصوصی عذاب بنیاد والی روشنی کی ضرورت نہیں ہوتی۔ \nاس کا ذخیرہ انڈوں اور چھوٹے حشرات پر مشتمل ہوتا ہے، اور مختلف رنگوں کے متغیر وجود موجود ہیں۔"
  pet.degu:
    label: دِݙُ
    summary: اسکاچلے کا ایک ہلدوا سانپ جو شَنْچِلٗ کے مثل ہندی ہے
    info: ڈیگو اسکاچلے کا ایک ہلدوا سانپ جو مورچت، شینچلا دونوں پر مشتمل ہوتا۔ وہ بھاری دن رات تقریباً آباد ہونے والا ہے؛ تنہائی برداشت نہیں کرتا۔ ذخیرہ زحمت کرنے والے لوگوں کے لئے حساس ہے؛ قید خوبصورت فروٹ نہیں کرسکتا۔ آلزائممر مریضوں کے علاج کے طبعی ماخذ کے طور پر استعمال ہوسکتا
  pet.discus_fish:
    label: diskus
    summary: تاجروں کے انتظامی نظام میں موجود تمام لوگوں کے لئے ایک الگ مقام.
    info: "ڈسکوس ایک بڑا جنوبی رشید کے علاقوں میں پایا جانے والا تندرو توپوں والی شکل کا سمندری زچہ ہوتا ہے۔\nیہ انٹرائرین فشرز میں سب سے مشکل وسائل حاصل کرنے والی قسم ہے؛ اس کے لئے درست آبیاتی طور پر موافقت دار پانی اور حرارت ٢۸ تا ٣٢‏°جی ضروری ہوتی ہے。\nنو عمر نوجوانوں کو ماخذ کھال کے ذرات خورد برخورد سے غذا فراہم کرتے ہیں، جو عام طور پر مندملوں میں نادر معاملہ ہے۔ \n مختلف صفات کے تنوع کے باعث سائنسدانوں کی جانب سے سوروں سے زائد رنگدار متغیر تشکیلات وجود میں لا ئی گئی ہیں۔"
  pet.dog:
    label: کتّا
    summary: ایک وفادار گھریلو پالتو جانور، انسان کا دوست۔
    info: ہومسٹی ڈاگ آدمی کے چمچماتے ہوئے شیر خوبصورتی کا سب سے قدیم جانور ہے۔ 400 سے زائد نسلیں موجود ہیں اور اسے 'انسان کا بہترین دوست' کے طور پر جانا جاتا ہے۔
  pet.dove_pet:
    label: چونرا محل
    summary: ایک بالکلاً سفید چونرا جو معمولاً ذخیرہ عام یا محفلی تقاضوں کے لئے پالتا ہے۔
    info: "بیلکول سفید رنگ کے حصول کو نشانہ بنا کر پالا جاتا چونرا اور تھامس معدوم شتر مرغ ہوتا ہے۔\nیہ خوش طبع، دوسروں کو لطف آنے والی قسم ہے؛ بلغمبرد کی طرح وہ کڑوا نہیں کرتا اور روائے توڑتا۔ \nدنیا بھر کی عقدِ ولائم، فوجداری اور تعزیتی رسماّت میں استعمال ہوتا ہے。\nاسلامی دور قبل ازل سے صلح کا نماد ہے۔"
  pet.electric_eel:
    label: |-
      الیکٹرک انڈین
      (Elctrphor)
    summary: جنوبی امریکا کا حشر جو ۸۶۰ ولٹ تک کے الیکٹرونک شداؤں کو جنم دیتا ہے۔
    info: یہ امریکن الیکٹرک کےپروں سے تعلق رکھتا ہے۔ وہ جانور مارنے یا خود دفاع کرنے کے لئے آگ برساتا ہے، جو ۸۶۰ ولٹ تک پہنچتی ہے۔ وہ فضا سانس لینے کे قابل ہوتا ہے اور منظم طور پر سطح پر نمایاں ہونا ضروری ہوتا ہے۔ اس کے تمام بدنا کا زیادہ حصّہ موڑے ہوئے عضلاتی بافتوں سے بنائے گئے الیکٹرانک غدد سے تشکیل پاتا ہے۔
  pet.ferret:
    label: فرُٹَکَا
    summary: ایک دلچسپ، خصوصی نوعیت کا درخواستی ماکلف، حیران کن اور محبت کرنے والے موذٖج
    info: "فروٹکا ایک خانگی شے کرائسپ فورو رنڈولفو سے تعلق رکھتی ہے، جبکہ وائلد واصل مچلی براون ان لوگوں نے پالنا شروع کردیا۔\nایسا حیران کن اور دلچسپ ذوق والی ہوتی ہے؛ عام طور پر روزانہ 14 لے کر 18 گھنٹے آرام کرتی ہے اور باقی وقت غمغماڑ کرنے میں صرف کر دیتا ہے。\nاس کا الطراف قسم کا بوءِ زندگی کے عادی بناتا ہے۔ \nچیک جوملو میں فروٹکا مشہور غیرمعمولی خاصیت والا خوبصورت موذٗج ہے۔"
  pet.frilled_lizard:
    label: اگاما لمبکوا
    summary: آسٹریلا کا جھوڑ کے حشر ہے جو خود کو تحفظ کرنے کے لئے تماشوافزاء اندازمیں گرد سروال کھولا
    info: |-
      اگامہ لمبکوا ایک آسٹریلین جھوڑ کے حشر ہے، جو خطرات میں بچانے کے لئے تماشائی طور پر گرد سروال کھول دیتا ہے، شادن ناخون کرتا ہے اور آخری قدموں پر قائم رہتے۔
      سر کا زاوٗج فرشتوں والے ڈوبندوں سے مضبوط بنایا جاتا ہے。
       وہ آخری قدموں پر چلتا ہے جیسا کہ ایک چوتھائی درخت
       وہ عالمِ حسن تصویری فنکاروں کا مشہور موضوع ہے اور شمالی آسٹریلوی خطۂ کائنات کا علمبردار ہے۔
  pet.gerbil:
    label: پِسْكُومِل
    summary: ایک چھوٹا صحرائی چانچال جسم والا جاندار
    info: مغولستان اور چین کے خشک علاقوں سے تعلق رکھتا ہے۔ وہ صحرا میں زندگی بسر کرنے پر ماہر ہوتا ہے؛ نسبتاً آب استعمال کرتا ہے، کیونکہ غذا سے حاصل ہونے والی مواد کو فروغ دینے میں قابل عمل ہوتا ہے۔ جماعتوں میں رہنے والا ہوتا ہے اور دن کے وقت حرکت کرتا ہے، لہٰذّا مشاہدہ کرنے والا مناسب شوقیہ ذخیرہ بناتا ہے۔ سوراخ درست کرنے سے محبت کرتا ہے اور طبعی رویوں کے لئے متعدد سطحی مٹی کی ضرورت ہوتی ہے
  pet.goldfish:
    label: زلمبریا
    summary: ایک سفید، زرد رنگ کی مچھلی جو اکوایریم میں پالی جاتی ہے۔
    info: زلمبریا دنیا بھر میں اکوایریم میں پالتی ہوئی ایک گھروں میں پالی ہوئی مچھلی ہے۔ اس کی صدود مختلف رنگوں اور پنجوں کے اندازوں کی موجودگی ہے۔
  pet.guinea_pig:
    label: مُورچ
    summary: ایک چھوٹا، بالیلا حشرہ جانوروں کے لئے بچوں کا محبوب پالتو جانور ہے۔
    info: مُورچ ایک جنوبی امریکی سماجی حشرہ جانور ہے۔ وہ ریزہ دار آوازوں کا ادا کرتا ہے، دوستانہ طبیعت والا ہوتا ہے اور لوگوں کی موجودگی کو پسند کرتا ہے۔
  pet.hamster:
    label: کریچک
    summary: ہل دان کھالنے والا ایک خوبصورت گوشت جس کے چہروں میں غذا کی ترسیل ہوتی ہے۔
    info: کریچک سب سے زیادہ پسند کردہ گھریلو حیوانات میں سے ایک ہے۔ وہ اپنی چہارمیں غذائی ذخیرہ رکھتا ہے، رات کے وقت فعال رہتا ہے اور عام طور پر گول ڈھانچے میں بھاگنا پسند کرتا ہے۔
  pet.hedgehog:
    label: جنگلی خاربک
    summary: ایک چھوٹا موٹا خاردار درندہ جو خطرے کی صورت میں چمڑی کی طرح بنا دیتا ہے۔
    info: افریقہ کا جنگلی خاربک اس وقت سے دوسرے ممالک بھی پال رہے ہیں۔ ان کے بالشت پر تقریباً ٥،۰۰۰ لاتینی نشاندہی والے آستروں کرتے ہیں۔ وہ خطرے کی حالت میں غیر قابل رسائی چوبند بن جاتے ہیں۔
  pet.hermit_crab:
    label: رک پاوستین尼克
    summary: ایک چھوٹا کرسٽلن جو منسلک شلوار میں رہتا ہے، غیر عام گھریلو ذوق
    info: "رک پاؤستیونن کا اپنا جسمانی زرد نہیں ہوتا، بلکہ وہ خالی مچھلے والوں کے شلوار سے اپنے ترش حلقے کو بچاتا رہتا۔ \nجب وہ بالغ ہوجائے تو ان کو موٹرا شلوار تلاش کرنے لگتے ہیں。\n суخ دماغ والے رکس باقاعدہ طور پر لوگوں کے عزاز کرتے ہیں؛ وہ سماجی ہوتے ہیں اور گروہوں میں رہتے ہیں۔\n فطرت میں وہ دریابڑوں اور گرم خطوط کے قریب آوازوں میں رہتے ہیں"
  pet.iguana:
    label: leguan
    summary: ایک خوبصورت حبّاب زرد رنگ والی تہتر مچھر
    info: لیگوآن جھینا اک بڑے سائز کی تہتر مچھرو، مرکزی امریکا توں ود دنیا نال پلاٹو لئي۔
  pet.koi:
    label: کوئی کاپر
    summary: ایسا آراستہ کاپر جو شادید رنغوں کے ساتھ باحترام ڈشوار ہوتا ہے۔
    info: کوئی کاپر جابان میں سے دہائیوں تک پالنے والے اس عام کارب فشر کا خوبصورت نسل ہے۔ مختلف رنگوں کی صدیوں کی وقعت موجود؛ ان قدردار حصولات بھی لاکھوں روپے میں فروخت کرتے ہیں۔ چودہ سوسٹ لبرلز، مشہور طرح Hanaco)، عمر کے علاحدہ ذخیرہ کرنے والا شخص تقریباً ٢۲۶ سال زندہ رہتا ہے۔
  pet.leopard_gecko:
    label: جبلند قارح زباق
    summary: چھوٹا سوراخدار درجنواختر، شروع کرنے والوں کے لیے مناسب خطرناک جانور
    info: گیکون لائے ود کا اصل مقام پاکستان اور افغانستان کے رملی علاقوں سے ہوتا ہے۔ بقایاجانوروں میں ان کو نمٹن والے دانت حیرت آئینہ فرما جاتے ہیں، شیشہ پر تھلّنا مشکل ہوجاتا ہے۔ غیرمعمولی طورپر، ان کو حرکت کرنے والا بالساز موجود ہوتا ہے۔
  pet.lovebird:
    label: اگاپرنز
    summary: چھوٹا رنگدار فاخته جو مضبوط شراکت دار بناتا
    info: |-
      اگاپورنیس افریقائی پاروکھ سے تعلّقات رखتا ہے جو مضبوط زوجین کے باندھ میں مشہور ہے۔
      ایک جفت دونوں آمادہ، صاف ستھری اور وقت باہم ختم کرتا؛ لہٗذلئِ نام عاشقوں کا طائر دیتے ہیں。
      نو قسم موجود ہند جو مختلف رنگ و حضور سے الگ ہوتا ہے۔
  pet.mandarin_fish:
    label: MANDARIN FISH
    summary: دنیا کا سب سے زبردست سامراجی مندر
    info: "مندربن نادھرنہ ایک ساحلی جانور کے حشرات والوں پر مبنی انڈو - لمبائی کا تباہ کن رنگ والا درجہ بند فرشتہ چمڑا لال، زرد، وارناٹک الاؤس شامل۔ \nاس کے شعاعی دانتوں کے ذریعے خصوصی عضلاتی ساختہ موجود ہوتی ہے۔\nایسا غذا کے طور پر صرف موذون قسم کا آتشیز استعمال کرتا ہے۔"
  pet.mini_pig:
    label: باقاعدگی سے زندہ وجود
    summary: ذرا سا درخت لال روغن کسی شخص کے شوق کا مرکوز نقطہ
    info: چھوٹے پیغامات کا تعلق انسان نے بہت ساده انداز میں جانوروں کے ذریعے حاصل کرنے والے علم، صفائی ستائش اور دلکش خصوصیات رکھنے والے فرشتوں کے قابل بنایا۔ وہ سوراخ کھولنا اور آسان طریقوں سے حرارت تنظیم کرتے ہیں۔
  pet.moon_jellyfish:
    label: |
      ماہوار درمنش
    summary: بلاولومینسنٹ ماہوار درمنش، خاص انداز میں بنائے گئے مچھلی کے تالابوں میں پیدا ہونے والی چربی کے ذخیرہ کرنے والا عضو
    info: مہنگی مچھلی کے تالابوں میں پانی کا حشرات رکھنا بڑی مشکل سے شروع ہوا؛ آج اس وقت خصوصی دائرائی جار (کرئزل) موجود ہیں۔ یہ شخص برای فرد قدرے غیرضروری ہوتا ہے، لیکن عام طور پر واقعی نقصاندہ ثابت نہیں ہوسکتا۔
  pet.mouse:
    label: موش بلیلا
    summary: ایک چھوٹا درندہ جانوروں کے روپ میں پالا جائے یا تحقیق کے علاقے میں استعمال ہوسکے۔
    info: بیلہ خانگی موش بچھو کا اکٹر فارم ہے جسے لابورټاتروں میں تحقیق، دوا سازی اور زینت کے طور پر استعمال کرتے ہیں۔ وہ ذہنی صلاحیتوں والا حیوان ہوتا ہے اور راستوں اور نالوں کو آسانی سے سمجھتا ہے۔ ان کا عمر قدر مشترکہ ۲ تا ۳ سال ہوتی ہے، اور وہ سماجی حیوان ہونے کے باعث گروپوں میں پالتا مناسب ہوتا ہے۔ موشوں کا علمی تحقیقات میں مرکزی مقام ہے۔
  pet.mynah_bird:
    label: منہ
    summary: بولاٹ اسیئن شاچک جس کی زبان کے ذریعے فطری طور پر مختلف آوازوں کو نقل کرنے کی استعداد ہے
    info: "مِنہ ایک پرندہ ہے جو شاپ کول خاندان سے تعلق رکھتا ہے، تمام پرندوں میں بات کرنے کی صلاحیت کے لحاظ سے نمبر ون قرار دیا جائے۔\nاس وقت کے انداز، علاحدگی اور آوازوں کو حیرت‌آفرین طرح سے نقل کرتا ہے۔ \nایشیاء کے جنوب مشرقی حصّے اور بالخصوص بنگلادیش سے منظر عام پر موجود ہوتا ہے۔"
  pet.oscar_fish:
    label: اواسکار
    summary: امازون سے تعلق رکھنے والی بڑی ذہین مچھلی جو اپنے مالک کی موجودگی کا تعاقب کرتی
    info: اُسکار پیوی جنوب امریکہ کے عظیم الشان سمارٹ مچھلی ہوتی ہے، ذہانت اور صاحب کی شناخت کرنے کی قابلیت کے لئے مشہور۔ بڑا آکواریم (حداقل دوسوم لیٹر)، زندہ یا فرسودہ غذا کے منظم خورد و نوش کی ضرورت ہوتی ہے۔ ان کی لمبائی تقریباً ٣٥ سم تک حاصل کرتی ہے اور عمر ۱۵ سال تک رہ سکتی ہے۔ بعض وقت پلوں کی طرح رویہ اختیار کردیتا ہے؛ جب ماالروات قربت اختیار کرتا تو دروازے کی جانب سفر کرتا ہے۔
  pet.parrot:
    label: چیکن
    summary: ایک رنگین پرندہ جو انسانی آواز کا جواب دے سکتا ہے۔
    info: وولنکوفانا انڈلکا، چھوٹا مسافروں کے طور پر پالا جاتا ہے۔ وہ ذہانت مند، سماجی ہوتا ہے اور آوازوں اور الفاظ کو نقل کرنے کی صلاحیت رکھتا ہے۔
  pet.prairie_dog:
    label: psoun preiovy
    summary: شمالی امریکا کے علاقائی بالغات میں غار بنانے والے جانور
    info: "پسون پریئووا کے شمال امریکا میں وسعت سے زیرزمین جماعتوں میں رہنے والے خاندانی حلقے کا ذخیرہ۔\n ان کا تعلق دبلا نظام آوازوں، جو علماء نے انسان کے بعد سب سے پیچیدہ شایدی بول قرار دیا گیا ہے۔ \n 'ڈاگ' کا لفظ درندوں کے خلاف تنباھ کرنے والا بلند آواز کے باعث شامل کیا گیا۔"
  pet.quail_pet:
    label: بُرا قلّو
    summary: ایک چھوٹا، غیر مشقدار پتاڑ جو دربار حشر کے طور پر پالتا جاتا ہے۔
    info: "جاپانی کرائے والا ایک بہت چھوٹا پтаڑ جسے انڈوں یا مزملن لالچ کے طور پر تربیت دی جاتی ہے۔\niys صرف سौ گرام وزن رکھتا ہے، اور نسبتاً چھوٹا ذخیرہ والارواج ہوتا ہے。\nمرد فرشتوں کے آوازوں میں 'pi-pi-pit' کرتے ہیں، عورتیں خاموشی سے چلاتی ہیں۔ \niys خاموش ہونے کے باوجود وقفے کمروں کے لئے مناسب ہیں۔"
  pet.rabbit:
    label: خرگوش
    summary: لچکنے والا مہمان جس کے لمبے کان ہوتے ہیں۔
    info: ایک خاندانی خرگوش ایک مقبول پالتو حیوان ہے، جس کی نرم بال سی بھوک ہوتی ہے اور لمبے لمبے کانوں کی وضاحت کرتی ہے۔ یہ گائے کا دودھ، سبزیاں اور تازہ گھاس کھاتا ہے۔
  pet.rat:
    label: کرشا عام
    summary: ذہانت والے قابلِ استعمال حملوں میں داخل ہونے والا محبت کا سوراخ
    info: "کریسہ انسان کا سب سے زیادہ ذمابال حمولوں میں شامل ہوتی ہے؛ وہ نام پر رد عمل دینے اور جٹائل عمدات فن کرنے کی تربیت بھی لے سکتا ۔\nاس میں خاص طرح کی رشتہ بازی کی صلاحیت موجود ہوتی ہے، لوگوں اور دوسروں کرساؤں کے درمیان مضبوط بنائے ۔ \nایشیاء میں چائنی زودوازوں کے نقشوں میں شعوراور دولت کا آئندہ ظاہر کرتا ہے۔ ان کے ذرا غمازنہ سے افریقہ میں مندوزلخ موثر طریقوں سے حل کردی جارہی ہیں۔"
  pet.red_eared_slider:
    label: زُلوا نَذیرنا
    summary: سب سے عام طرح سے لوئے چلنے والی ماڑی کی غذا کے ساتھ چرماء کے بعد روسائل شامل
    info: |-
      چمپا کی اصل جگہ شمالی آمریکا ہے، دنیا بھر میں قید حالت میں سب سے زیادہ پائیسال نسل ۔
      اس کو خوبصورت رڈ شدہ علامات درشتِ لشکر وانٹل فارمنٛج تبدیل کردتا
      اور مشابہ انواع سے الگ کرتا ہے。
      ایک چربی والی حصّہ اور سوراخ کرنے والا روشنی کا منبع دونوں ضروی ہند۔
  pet.sea_horse_pet:
    label: سمندری گھوڑا اکوایریم میں
    summary: سمندری گھوڑا موسمی اکوایریوم میں، باحترام اور دلچسب
    info: "سمندری گھوڑا سب سے مشکل ترین جانوروں میں سے ایک ہے، جن کو قید خانے میں پالنا بہت دشوار ہوتا ہے؛ ان کو زندہ غذا (ارٹمئی، منسرائڈز)، اور آرام والی حالت ضرور درکار ہوتی ہے۔\nذکرونشا فطرت میں نسل لاتا رہتا ہے، وہ اپنے شکم کے علاقے میں بالغوں کو لاۓ چلتا ہے اور ایک وقت میں صدّوں بالغ بناسکتا ہے。\nایک جفت میں رہتے ہیں اور تمام عمر ایک دوسرا کو محبت کرتے ہیں۔ \nقائد العلاج کے طبعی علماء کے ذرائع سے لوٹ مارتے ہوئے ان کی موجودگی ختم ہونے کی وجہ سے وہ خود کفاف کرنے والا خطرہ برداشت کر رہا ہے۔"
  pet.sugar_glider:
    label: وچاءس ليٽافا
    summary: آسٽرليائيئن واسول جانورو جنهنجو هجوم به مايع بلائن ذريعه ٺاهيل هو.
    info: "وچائیس لیٹاوا ایک ننھا آسٽریلین واسپال جانور ہے، جو پرواز کرنے والی بندوق سبب تقریباً درختن سان فضا ميں رلايو۔ \nایہ شام کار وقت دوڑت ۽ انفراديت حالتون ختم ڪري طاقتور تعزيرات جهڙوڪ گرجيندي، زخمي ٿيل صدا ۽ ٻيا قسم جا علامتون استعمال ڪري ڳالهيجهو ڪري۔"
  pet.tarantula:
    label: pta kopisk
    summary: برتر وڈا موذی عنکبوت غیر عام ذخیرہ برای باضما
    info: "پتکو پسک رُزگنہ ایک مقبول تارانتولا جب کہ شروعات کرنے والوں کا خاموش طبع بنائے۔\n سب سے بڑا قسم، چولوا دان فرینٹس، زمین پر سب سے لمبا عنکبوت ہوتا ہے جس کے قدموں کی لمبائی ۳۰ سینٗطِ مترا سے زائد ہوسکتی ہے。\nاس کا سم حشرش ندامت کے مقابلے میں مشابہ ہوتا ہے اور صحت مندانہ بالغ شخص کے لئے خطرناک نہیں ہوتا۔ \n تارانتولات ۲۰ سال سے ۳۰ سال تک عمر رسیدہ ہونے کی استعداد رکھتا ہے۔"
  pet.tortoise_pet:
    label: ' суخومزمكى زيلۋا '
    summary: ایک لمبی عمر والی زمینی سبزیلوا، تمام زندگی کا پالتو حیوان
    info: |-
      ہرمن کی سبزیلوا جنوب مشرق اورسطی یوروپ کا نسبتاً چھوٹا زمینی دُکان والا ہے، جسے پالتو حیوان بنا لیا جاتا ہے۔
      اس کی عمر صدی تک بلند رہتی ہے؛ واقعی اس کے مالک کی عمر سے آگے بڑھ جائے گی。
      سرما کے موسم میں یہ خواب غفلہ میں ڈوبا رہتا ہے، جہاں اس کا متقلّب نظام تقریباً روک دیا جاتا ہے۔
  pet.turtle:
    label: کریم
    summary: تھوڑا سا پانی والے کرم جسے خاص طور پر ایمڈائیڈی فیملی میں رکھا جاتا ہے۔
    info: نادهرا قرمزی لخت والا کرم عام طور پر گھروں میں پالا جاتا ہے۔ یہ ایک آکواریم میں زمین تک رسائی حاصل کرتا ہے، جہاں وہ یو وی لمب کے نیچے گرمی بنا رہتا ہے۔
