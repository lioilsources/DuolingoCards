lang: te
pivot: false
title: ఇల్లు జీవాలు
cards:
  pet.cat:
    label: కుక్క
    summary: సౌకర్యవంతమైన ఇల్లు కొట్టుకు చెందిన పాలీడ్ ఫెలిస్ జాతి నుండి వచ్చిన ఒక అనుభవజ్ఞ శిక్షణ.
    info: ఈ డమ్మీ బిగ్గరగా ఉండి తన గోళ్లు లేకుండా ఎల్లప్పుడూ స్వచ్ఛంగా ఉండే దానికి ప్రఖ్యాతి పొందింది. ఇది స్వతంత్ర ధోరణి కలిగి ఉంటుంది.
  pet.dog:
    label: పెస్
    summary: విలక్షణ ఇంటి జీవి, మనిషి సుతారుడు.
    info: హోమ్ డొమెస్టికేటెడ్ వోల్ఫ్గా తెలీయజేసే ఈ కుక్క అది నిర్వహించబడిన గృహ ప్రాణికి ఉన్నాయి. దాదాపు 400 బ్రీడ్‌లు ఉన్నాయి మరియు ఇది 'మనిషి శ్రేష్ఠ సౌఖ్యం' గా ప్రసిద్ధి చెందింది.
  pet.goldfish:
    label: గోల్డ్ ఫిష్
    summary: కొరతెంకలు అనే నది చేప వాటిని సృష్ఠించిన కమ్యునిటీలో ఉంచబడిన ఒక రకం.
    info: గోల్డ్ ఫిష్ అనేది జైవిక శిక్షణ లేని కాప్రిస్ గా తెలుస్తుంది, దీనిని ప్రపంచవ్యాప్తంగా అక్వారియంలలో పెంచుతారు. ఇది వందల రకాల రంగులు మరియు బొడ్డు రకాలలో ఉంటుంది.
  pet.guinea_pig:
    label: మొర్చె
    summary: సున్ని రకం గల పాడీ జంతువు, బాలురకు ఇష్టమైన కుక్కగా ఉంటుంది.
    info: ఘర్షణ అనేది దక్షిణ అమెరికా నుండి వచ్చిన ఒక సోయియల్ హాబిట్‌ట్ జంతువు. ఇది తుఫాను ధ్వనులు ఇస్తుంది, సౌమ్యమైనది మరియు మానవ సంపర్కం నచ్చే జంతువు.
  pet.hamster:
    label: క్రిసెక్
    summary: వైపుల మొణెలతో కూడిన చిన్న బావుగా ఉన్న హోల్డర్.
    info: క్రిసెక్ గృహ జంతువుగా ఎక్కువగా నిల్వ చేయబడే ఒక చిన్న రాతి వీధి అది తన ముఖాలలో భోజనాన్ని నిల్వ చేసుకుంటుంది, రాత్రిళ్లలో దాని చుట్టూ ఓ చక్రం లో పరుగెత్తడం ఇష్టపడుతుంది.
  pet.parrot:
    label: పావులన్
    summary: రంగు రంగుల అక్షరాలతో మాట్లాడగలిగే పక్షి.
    info: సీజన్‌లో చిన్న కొండికి వదులుగా ఉండే ఈ పావులన్ ఒక బహుళ దశాబ్దిక జాతికి చెందినది. ఇది తెలివిగా, సమాజంలో నిలబడి గాలిలో ధ్వనులు లేదా పదాలు ఎలా ఉంటాయో నకలు చేస్తుంది.
  pet.rabbit:
    label: క్రాలిక్
    summary: దీని చెవులు పొడవైనవి.
    info: ఇంటి క్రాలిక్ ఒక సహజమైన జంతువు, దీని శరీరం గోళాకారంగా ఉంటుంది మరియు అది ఓరిక్టోలాగస్ కునికులస్ నుండి వస్తుంది. ఇది బూడిద రేగు, తృణధాన్యాలు మరియు ఎండబెట్టిన ఘన ఫలాలను భోజనం చేస్తుంది.
  pet.turtle:
    label: శెల్ పైకి ఉన్న జంతువు
    summary: దీర్ఘకాలిక కఠిన చర్మం ఉన్న ఒక జంతువు.
    info: రెడ్‌ఫేస్డ్ టర్టోల్ అనేది తరచుగా నిల్వ చేయబడే జంతువు. దీనికి భూభాగానికి పొడవున వృత్తి గల బౌల్ లో ఎమ్యువల్ లైట్ కింద హీటింగ్ చేస్తారు.
