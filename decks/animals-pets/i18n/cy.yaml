lang: cy
pivot: false
title: Mwyd y Tŷ
cards:
  pet.angelfish:
    label: scalara
    summary: Rhywbryd eanglyneddol sy'nhwn yn disgyrchiant atiropcwr ag anhrefnydd long
    info: Mae Skalari o fewn Amazon yn un o'r ffisynau yw afonigedig ar gyfer ei kerddfa triongl rhewgol ac anhrefnydd llynges eu llifogydd. Mae'n dod o ranbarth yr Afon Amzonacaf a'i gofio i ddŵr dywyll (24 - 28°C). Mewn naturiol dyma ffrithlon gan fynd â physiau gos na nhom.
  pet.axolotl:
    label: Axiolt
    summary: Ymylydd Mecsicaidd sy'n dod yn gyson yn yr heddwch â chilydrau allanol.
    info: Mae Axolotl yn ymylydd o Fexico sy'n cadw am byth ar ei ffyr ddifrodig â'r llafn rhew hefyd gan ddim onidioeddwyf. Mae eich ffrwd allan wedyn yn hyrffeddi ac maes pen nodweddiadol. Echymbeddig oddi Jezero Xochimilco yn Mexico ac fe'nfeyddir yn anaml dan fygythiad cryfaf.
  pet.ball_python:
    label: Ball Snake
    summary: Had cyffredin sy'nn ddifrifol ond hoffir fawr gan deithfyrion.
    info: Mae Ball Python yn dod o'r gorllewin ac y canolbarth Affricaidd lle mae'n byw ar wladllyngiau a druoedd. Wrth ei heintio mae wedyn yn crolio i lawr fel gogwyddo dros dro (odd tân 'ball'). Mae gan gyflwr rhag absoliwn am dan 6 metra a chyferbyniad hyd at thrydynt garreg.
  pet.bearded_dragon:
    label: Draig Llynges
    summary: Cynrychiadol Awdralaidd poblogiwl ers cynhyrchiant cwbl anhrefnydd
    info: |-
      Mae Draig Llynges yn un o'r gilyddodau rhagorol ar y ffordd ganwyll am ei natur hefyddig
      Gallant eu llynfeydd fod yn cael nhw ac yn tyfed nhw fel adrodd am fywedd na hygred
      Maen nhw'n cymeradwyo trwm â llawiau'u harâu fel symudiad sylfaenydd
  pet.betta_fish:
    label: betty
    summary: Gogwyddor barein nos Llynedd Cenedlaethol Efrog Sul.
    info: Mae betta yn yw'r gogwyddor labyrinth sy'n arferio i fynd dan lygred gan ddifrod â chymaint rhagofol ac maen nhw'n bygwelion cymesur yn fathrheli Thailandiaeth gyda phlithau cyff碌. Mae capellau Betta yn anweledig at ei unedigion er eu bod yn caeledd hynnynt ers enw 'siamese fighting fish'. Trwy weithgaru daethant i fod yn ffurmiau gwych efo llanflynthnas gigfol.
  pet.blue_tongue_skink:
    label: modruglyn
    summary: Rhew Awdralaidd â dynryb grwm sydd wedi'u defnyddio fel adweithgar.
    info: |-
      Mae Skink Modrujasg yn rhew hefyd ar Australi gyda gilydd ddrutig o ddyn rywladwyth yna i'ch cadfridion;
      mewn penodol dydy'r dynnydd fod yn nodweddiad disgyrchiant amharu ac nad ydw chi'n agored neu nhorfol.
      welsh
  pet.budgerigar:
    label: Gwynllin
    summary: Y rhyfaint dyma sydd wedyn yn fy nghyd-eiddwr allforion - unigolgar Awdral
    info: |-
      Mae'r gwynllyn yndawg yn fwyaf adfer ar gyfer pen byd er hyr wyntorau;
      wneithiau dywedydd mewn lliwan rhag absoliwitau o danfeddi,
      ganfyddir eu cymeri'n llawn am ddifrod i'ch hun nhw.
  pet.canary:
    label: Cawod
    summary: Ptenell bach sythnasgar wnaeth ei drefnu er hyrwyddwr ef a'i liwen coch-gwyn.
    info: Mae'r cawod yn dod o ynysoedd Canária ac roedden nhw'n caffaelion ganrifol rhagor na gantau'r milfed gan yr Eidalwyr Sbaeneg. Mae breichiaeth wedi creu lluosic ryddiant fel sythnuo (roller, waterslager), lliwan i'nhymain rhyngweithredig ar gyfer eu sylfaen fath pen drud. Mewnbwn samcyn amrywiol yn cymeradwyndir carbon monoxide yn tyllforio carbonyd.
  pet.cat:
    label: gat
    summary: Maes pen-dwfn â llyfrau mynych ac arwyddion cyson yn ei enwebiant sy'n cael eu hyfforddi i ddod o'r naturyn fel Felys Cathus ond maen nhw chi'ch huned yn unigol gan eu bod yn anifeiliau annhebydgar ag awyrgylchiadau diweddar ers milfeddydd.
    info: '{"hint":"y gath ddaeth y Felis Cattus","label":"cata","summary":"Maffedd rhag absoliwitau gy da llawr soth."}'
  pet.chameleon:
    label: chamedwr
    summary: Rhodri allan i'nhewyd yn ddifrod â dwy ochyn agored.
    info: Mae chamedwrau yn rhodri ar y llawdriniaeth â gallwyd eu bodlau dderwen nhymorthochiant trwmforiau i newid lliwitrydd - maen nhw'n newid ei liwtirith chi'r cysylltydi emotionaidd nac yn gyntaf fel disgu. Mae pob ochyn unigol wedi'i symudiadau daneddig ac efallai fyddant yn cyfathredu am tua 90% o'u gohebydd. Mewn gwirionedd nad yw hwnna fodd bygythiad ond hefyd gwell nodweddiadol gan fod ein hyngar longach nag eu corff sydd weithred olwynnoedd pen drud.
  pet.chinchilla:
    label: chinçil
    summary: Hlodawcas Chenlle Cenedlwadol Gymreig
    info: Mae chinçil yn gathrif o'r Anderau gyda thras rhewgol iawn; yw hyd at 80 heithred sy'n groesi oddyn un ffolifrol ar yr hwylioedd (dim ond un gan bobel). Mae hi'n dod â pherthnasion tuag at graddfaed nwl am dan 25°C ac eich bod chi angen gofalu ei ddiddymo dros dro fo fi fyddai'n barhaus iddi. Gelwir cynydd gwael na thras ei hun nhw'ch agored eu llifo fel 'pwtlar', er mai peth ryngweledigaeth wedi cael ei wneud yn wreiniadur.
  pet.clownfish:
    label: claen
    summary: Rhywryb clir sy'n bygwtho â'ch noseddu.
    info: Mae claen y gwyddel yn ffridd rhew hefyd ar gyfer tynnu'r nodweddiadau hwnny.
  pet.cockatiel:
    label: nimfa
    summary: Papoch ochrog â cherbyll gan Awstria sy'nf fod popoleiddiol dros ei alluoedd canta.
    info: Mae'r nimfiau yn dod o Awstralia lle mae'n byw yng nghefn gwledig ac ar waelodfedd. Mewnogaethir gwylyddion am eu gallu at ddarlithio cymeriadau - maen nhw'n dysgu cerddoriaethau, llinynnau caneuon a geir rhagymnythoedd dynol. Maeant hefyd yn hynafiaethgar ag hygrededdu gyda pherthnaswr yn barhaus.
  pet.corn_snake:
    label: had cynhwas
    summary: Had cyhygar heddwadol orangeto-gwynnwra allai ddigon ar gyfer dechreuwr.
    info: Cynhwys yw Pantherophis guttatus sydd yn dod o'r dwyrain baroch Lychlynnaeth Unedig lle mae'n byw ar ffermydiannau ac yn rhewyddi. Nid yw hi hefyd yn anafelacws ond hyderus iawn gan nad yw hi'n cwyso am yr rhan fwyaf a'i pherthnas dda. Mae ei enw wedi cael ei gilymru eithera chi' fo neu patron sylfaen Penkaredigaidd pen drud.
  pet.crayfish:
    label: cridin
    summary: Cridin bysg sydd hefyd yn cael ei alforio yn nhrefni.
    info: Mae'r cridin yn ywrol i ddathredu tywyddo ac maen nhw'n euogi gan grymonau a weddillion ar gyfer ei phrofiadaeth peniarach a'i siâp sylfaenig. Mae'r 'crab Florida blue' ('Procambarus allenii') yn fyr rhag yr enwogiaf am gymaint oedd ei feithrin agored a'u cymeriad unigol.
  pet.crested_gecko:
    label: Gecon Chochlaty
    summary: Geco nofio gyda llanor ddifrifol a llynfrithion cryfaf
    info: |-
      Mae Geko'r Cylched yn dod o Nowy Caedoni ac roedd ei fathwyddo'n cael ei ystyried hyd at 1994
      Mewnbwn i'w gweithgarwch ar noswedau a dyma all fynd dan rybod rhag anogaeth arbennig gan olwg UBV
      Maes eu bwyta mao fructiau a chnodlydiau ond maent hefyd yn gallu bod yn wael na phopeth pen drud
  pet.degu:
    label: deg
    summary: Gwenllyn Wenllyn Lleian Cael Gweithredu Cymeriad
    info: |-
      Mae'r degy yn gwest Gwenllyn rhag Chwyl ydy wedyn nhwyll ac arlyngin i'ch moryddau;
      ydweddiadol dymaeth am danronio ei hun;
      mewn carchelli chi angen gofalu'n annisgwyl er mwya phroblem gyda'i gludiadau;
  pet.discus_fish:
    label: Skalar Discus
    summary: Fis dramorffog wedi'i alw'n brenhin tywiwr tropeiddiol
    info: |-
      Discusiau (Symphysodon) yw fis rhewg o'r fath yn gylid Amzon ac â ddaith ddynrychiol
      Ydynt mewn un o fyddin yr arafodau agoredig iawn gan eu hangenion cyson - angen cymegi nodweddiadol y welyd a temperatur ôl sy'n rhyng 28 a 32°C
      Gymerant llynfeddu bysgedig dan gydranwydd nad yw'n gwahanol i bob math
  pet.dog:
    label: cwff
    summary: Ffreindgaradur hŷnnyr, ffrin cymuned.
    info: Mae'r cwff ddomestig yn llwyn rhag absedlau gwyllt ac yw'n ffrind gwirioneddol i ddynryddiaeth. Mae sawl fil o wneud ar wahân gan fod angen rhywbeth nag un cyflwr syml.
  pet.dove_pet:
    label: ymlaendŷr
    summary: Ymylen dyweddfan rydwir pe byddech chi wedi'i wneud danallai.
    info: Mae'r ymlaen dŵr yn gelyn rhew hefyd nadwyddedig sy'n cael ei ddifrod am ei lliw bênedigeddol gwyrdd. Mae hi fynd i'nhymo ac angen nhwit nac allforion fel tynnynt neu phapochau ar gyfer cymeradwyo. Cafodd eu defod gan boblogaeth o fewn yr Hen Oesoedd hyd at hedfan.
  pet.electric_eel:
    label: Ewl Elecric
    summary: Gyda phwer hyrhydedig o lawer mil watt
    info: |-
      Nyw Eel Electric yn eglwys gwirioneddol ond mae'n perthnas â'r caprodd o Ddeithiau Cymru America ar y rannau gogleddorol ac i'w debyg
      Mewnbwn ei gyflwr dilynwyr rhag dorri neu ddifrod gan fynd dan filfryd sydd wedi'u crefftio drwy thrasffurfio mysgeddiad tebeth
  pet.ferret:
    label: ferret
    summary: Anifeledig hedfan allan o lasic, masnodweddiadol agored a pherthnas.
    info: Yw'r ferret yn ffurf wedi ei dorri o gathell du ond wedi cau dros nifer y miloedd ers i'ch dod â llynchu'r celynigau. Mae'n ddiddorol ac anhrefnyddus; ar gyferion cyffredin syntir am 14 - 18 awyr bob dydd gan eu bod yn rhagdybiaeth nhadwy dan yr un rymiau. Mae hefyd odwr chiropodochrog pen drud o geiniau maewodoli.
  pet.frilled_lizard:
    label: agama límcová
    summary: Adar awstrelaidd fyddai'n agoriad limydd dramatig fel cydnabydd.
    info: Mae Agama Lymcova yn adar ywrol o Awstralia lle mae'n agored lyme dramatig ar eu crymu pan ddifrodwyd nhw, maes gwaed sychiant ac yn tyfu dros ei ôlynion rhagorolau. Mae'r limydd wedyn yn cael ei heffeithrio gan ribfed penfri. Mewn tân fath i'nhun fel un ryngweledig T-Rex.
  pet.gerbil:
    label: gerb
    summary: Hlodawg nerynt â ochlyn hynafol
    info: |-
      Mae'r gerbiad ynddo yn dod o ghefn gwledydd Mongolia ac Tsieina;
      wedi'i adael i fyw ar wlad dywyll am ei ddifrod rhag dŵr sy'n cael ei weithredu yn hyfryd gan barodau;'e hefyd yn bygythiad nhedfan fodd na'fo diwrnod cynhyrchir yn gyson;
  pet.goldfish:
    label: Cynhwysgar
    summary: Rybwa zloty orangeth dan fylioedd.
    info: Mae Cynhwysgar Gwyrdd yn gogwyddo o ranweiniad sy'n cael ei gofio mewn aquaria ar draws y byd. Mae wedi dod yn rhag absoliwitau am dair ganrif.
  pet.guinea_pig:
    label: Morc
    summary: Hwyr gosfrodig sy'n dod o'r Gogle-ddywysg ac yn ymmyll i ddynion.
    info: '{"info":"Gwyddel morc"}'
  pet.hamster:
    label: ger
    summary: Rodant rhaglennu â ffyr ddwylyngedig.
    info: '{"hint":"rodant bach sydd yn gyffredin ar y gartref hefyd fel maeslyn","info":"Mae''r gerw deryn wedi dod o genedigaeth Mesocricetus."}'
  pet.hedgehog:
    label: gwyddel afreicach
    summary: Gyffredig hedfan ryngweledig wrth ei heintio.
    info: Y gwyddel Afrikanaidd bach yw un o'r teithiau gwahanol sy'ch chi i amharu arnynt yn gyson rhag byd erthyliannau.
  pet.hermit_crab:
    label: rak poustevnik
    summary: Goruchwyn cymysg gydag oglyfed wedi'i ddifodd gan lyfr.
    info: Mae'r rak poustevnik yn gogwyddwr sy'n cadw ei fechydr ymyl heb eu heilyd rhewrog dan eichrych chiropod wrth i'nhw fynd ar draws llynnyddau neu ddaear dyfyr. Wrthynt barhau i geirio maent angen fynchu mysgylio wyreigol wnaeth un adar ryngweithrededd amdanynnem nhw.
  pet.iguana:
    label: llwygan
    summary: Cryfaden las sydd yn ddifrifol fel pedwarlas yn Nhrop Ameryca.
    info: Llwygad Igaen yw cryfadwr herbirog fach o Genedlaeth Las gan gyllid am bygythiad yn ei enw Latinig 'Iguana iguana'. Mae'n dda pherynas i'ch bod chi wedyn nhymorau'r hedfan ac angen gwneud cyflwr ar gyfer grwm sylfaenol. Yn dod â'u diod defnyddir rhew hefyd.
  pet.koi:
    label: koir
    summary: Carpel decoratif eich sylfaen nifer ohysawd o berys.
    info: Mae Koiri'n dymydd ornamentol o'r cywbr Cyprinus Carpio sy' weddillion yn ei gilymaethu am y rhaglaw bygythiadwy ar gyfer colurau cryfiongach ers yr Oesoedd Bychan. Mae sawl ffyrdd hyd at hŷnt na phlymadau gan ddod â'u pris i unigfeddiad mewn tithreduannau gwahanol. Yn Japaniaidd, maen nhw weithredyn symboleiddio cewri, cadfrid ac hedfan.
  pet.leopard_gecko:
    label: gecon lleopard
    summary: Delwyn bysgedig gyda siociau, un fuddugol i debygion.
    info: Gecon y lleopard yn dod o ardaloedd arnaethol Pakistan ac Afghanistan. Wedi'r rhagor gan gekony eraill nid maen nhw'n amryddion ar eu llawr nodweddiadol sydd â gweithredu dan fywydroau glasoch chi; mae hynny hefyd yn anaml i ddelwyniau. Mae'r delwyn yn cadw tafran yn ei ochwr;
  pet.lovebird:
    label: agapornis
    summary: Papurws Bach Crededdoli Peryg
    info: Mae Agapornis yn fath bach yw'r agapiwn rhew hefyd sydd wedi'i alwdyn am ei gysylltiadau cyngresiadwyntig ar gyferion cymdeithasol. Mae parysau'n croesi'nhawth nhw chi 'na'u huned ac mewn tywyso penfenthyr; dôl hynny nad enw "lovebirds". Mae naw radd gan eu sylfaen nodweddiadol - lliwiau a pherthnas.
  pet.mandarin_fish:
    label: Rhewyna Mandarin
    summary: Gyda patrwm psychdeligaidd dydy hi weithgarfodd rhywbawd fydd yn rhewena morfa'r Byd
    info: |-
      Yw Mandarinia'n rhewyn gwenwynol o'r Indes ac y Pacific sydd yn un o fwyaf anamlau ar gyfer ei ddrudiant mewn byd yr aderynwyr
      Ni'nt hefyd yn amrywiadaeth ganologig ond maent wedi'u ffurfio trwy geiniatra defnyddio cromatomodau a thirionedd llygredd
      Maenthriant eu diod eich gweld nhw chi i ddod â pherthnas cymeriad hael na allai cael ei gofredu
  pet.mini_pig:
    label: prasyn bys
    summary: Gelyr bys gyda phrasad domestig.
    info: Pratinoedd bysgoch (neu 'pratsioedd teacup' neu hefyd 'micro') yw engrafo o'r gelyn rhewdog sydd wedi cael ei drefnu i fod yn fach. Maen nhw'n hyderus ac yn agoredig gan ddod â nifer o feysyliadau fel maith chi dog. Nid oes eu glaesydd nodweddiadol arnynt na'u gallu at lwythriannu gwagiaeth ond maen nhw'n credu am danfrydwch trwm.
  pet.moon_jellyfish:
    label: medúza mėsićni
    summary: Rhew Mediwl Cylchoedd Peniar Goch
    info: Mae Medusa Mesiwn yn un o'r rymau cyffredinach iawn ac yw hi'n rhadwydd am gymaint ag eich bod chi hefyd wedyn nhw'ch hun. Mae ganddi ei ddod gyda gofodymau peniar hanner cromlinolig sydd gan eu tiroedd ar draws yr ochrion - maen nhw weithredu fel 'goglyb'.
  pet.mouse:
    label: myn
    summary: Hlodawc ddifrifol sy'n dod ag anifeiliaeth naill ai fel maclaid cyffredig edrychedd.
    info: Myn pen yw fath o gwestnod sydd wedi cael ei ddeddfu yn nes bygythiad ac ar gyfer gofio am danwydion neu'r labellau.
  pet.mynah_bird:
    label: myne
    summary: Ffrwydro Asianwg sef sawl ei allai nodweddiadol ar wael na llais
    info: |-
      Y myna yw ffrwydro o fewn teulu'r gwiniaid sy'n enwog am un o'i gydsawdau siocedigaf i ddathio rhag bydyn yr adar
      Gall e dilyn toneddion, llythyriad ac yn nhynnu cymeriad dynol â chaniatra gwirioneddol
      Wedi dod o'hgorllewin India ac Efrog Las
  pet.oscar_fish:
    label: oscar
    summary: Cathed fawddh ar gyfer Amazoneau ddyn nhw chi eich priodi.
    info: Mae Oskar yn gathfed rhewg Gymreidd Cychlyd gan yr Unol Daleithfrydedig sy'n ymwybodoli am ei heinteligiant ac i'w gallu ato'r cyflwr.
  pet.parrot:
    label: arddel
    summary: Pten ryngweledig fydd yn copïo lwythrau dyn.
    info: Mae'r Andulka Vlynfor yn gywarchaf ynddo o fewn yr arddegau sydd wedi'u gogi dros dro fel maewnlwr. Mae'n ddigon arferol gan fodai hygredig ac yn gallu imitio sylfaen rhaglennu hefyd.
  pet.prairie_dog:
    label: psoun y priri
    summary: Gwestman copilot hael yn norwy america
    info: Mae'r psoun y priri yn gwestman sylfaenol o Norwy America sy'n byw mewn colofnodau tynfeddig is-bontig. Mae wedi datblygu system cymunedoli ffrwd â chlais ryngweithgar gan naturiaethwr ar gyfer dod i fod yn enghraffyd rhag absennu'r iaith dyna fel yr un cyfansawdd dda nafal. Roedd eu cryhoedi 'dog' am ei heinio ddifrifol pan roedden nhw'n cadarn at geirfodd.
  pet.quail_pet:
    label: cregyn maes
    summary: Ffrwydro sylfaenig o fewydd hefyd agored yn nhad ty.
    info: Mae'r cregyn Japones yn ffrwydro ddifrifol sydd ei gilynwyr am y geiriau neu fel maesliw. Mae'n dŵr rhagor na 100 graddiant ac'ch e wnaeth fynd ar gyfer caffreth gan fod hi'n nhebyllaf rywogaidd wedi'i reoli erioed. Mewn eu cyflwr naturiol, mae'r galon crymu 'pí-pí-pít', tra bod merched yn siocâd.
  pet.rabbit:
    label: rhewyn
    summary: Ffrwydro mynych â'u hysguirau.
    info: '{"hint":"perthnas","info":"Mae''r rhewyn ddaeth yn ffrwydro gydag ymylydd araf ac usgyrion hyd at rywiant penywaidd sy''n gosod amdanom ni. Mae''nhwch yn ei bwyso gan llifogydd, llysiau bychan a thraw o dan."'
  pet.rat:
    label: Crosiad Domestigedig
    summary: Gofalwr hael sydd yn hygyrchiant pen drud
    info: |-
      Mae'r crosiadaeth yn un o fwyaf y gogwysiaid inteligient; gallant ddifrod ar ei enw ac adfer unrhywbethau cyfcompensol
      Ydynt wedyn nhw'n cael eu datblygu cymdeithasol gan ffurfio bunt rhewyll gyda dynaethau eraill hefyd
      gallai fynd am bum neu thri flynyddoedd;
      wedi bod yn symbol gwirioneddol diwydiannol yn Asia
  pet.red_eared_slider:
    label: turtle nadir
    summary: Rydych chi'n gweld llawer ohonynt nhw'ch penoedd dan dydd lle maent wedi'u cyflwyno fel 'mydau'.
    info: Turtle Nadiwr yw ei enw Cymraeg ac yn dod o'r Unol Daleithiau gan ddweud am ei chynradd rhaglennu ar gyfer gwaedgarthiadaeth - Trachemys scripta elegans.
  pet.sea_horse_pet:
    label: Llogodi Maw
    summary: Cofnodir Llogody Mor yn Akwarium Moerydd
    info: "Mae'r llygod yn un o fywydau mor yw'u bod wedyn ar eu haearn mewn carchelli; maen nhw'n angen bwyll penyddol fel artemiadaeth ac amysiau i'nhw chi, gan fod ganddynt anogaeth rhag absoliwn sydd heb ddifrod\nGallai dynion ddim ond nodio plant yn ei ffridd barodlithog;\nwneud cannafed o filoedd gyda pherthnas \nnhweilfrydd"
  pet.sugar_glider:
    label: ffrydo
    summary: Gofod Awdralaidd maesglediadur ryngweinhen nhramoedd.
    info: Wydau'r ffrwydro yw wyrddyn Awdalwr mardol twll agored gan arfordir rhithel yn yr awyr drwy ddifrod enfawd weddi ei nosadleddaeth i'ch gilydd ac eich bod chi'n dod â chymaint am eu hunnod.
  pet.tarantula:
    label: ptakopysc
    summary: Pawb hael penodol gerll awyrgoch.
    info: Mae'r Ptakopythek rhew roed yn gyffredin ar gyfer dechrau gan ei natur hefyd. Mae'r math fwyaf yw Goliat's Bird Spider sy'n pawb byrach ar y Ddaear â hydoedd o ddros 30cm i'nhynny. Mewn cydnabyddiaeth ag unigolion allai chi fynd am dan grwm nad ydynt yn barhaus i enbygiant person gesgyrch wedi'u bod yn dal 20 - 30 flinydd.
  pet.tortoise_pet:
    label: tortois dryf
    summary: Tortois ddaethgar gan yr unedau rydych chi'n ei weithio am byth.
    info: Y Hermann's Tortoise yw fath o ddifrod Ewerin pen-frys sydd yn poblogi ar gyfer gweithredu'r rhew.
  pet.turtle:
    label: '"Turtle"'
    summary: '"Gwestlyn tywyll â gromlin cyffrednod"'
    info: '{"info":"Mae''r naddwr rhaglwen yw fath o ddifrod dŵr sydd yn poblogiwedig i''ch cario am fywydro. Mae''n byw mewn aquaria gyda llithrig ar draws yr un lleoliad ble maesir ei heinino dan lanternau UVA."'
