lang: eo
pivot: false
title: Domaj animaloj
cards:
  pet.angelfish:
    label: skalara
    summary: Tropika diskoformigita akuaria fiŝo kun allonge plentoj.
    info: Amazono-skalaro estas unu el plezuraj akuariaj fiŝoj kaptita per sia eleganta triangula formo kaj longaj flueglantaj ŝvelado-pintoj. Ĝi origine venas de la Amazona riverkampo kaj bezonas varman akvon inter 24–28 °C; ĉar temas pri predatisto, ĝi kapablas manĝi plenkreskadajn peĉonfishetojn.
  pet.axolotl:
    label: aksaloteolo
    summary: Akva Mezkura Salamo kun permane entute vivado elternaj Branĉion.
    info: "La Axolotle estas akua meksikana salamanĝero kiun ĝia infanila formo restas dum la vivo nekiam ŝangante al adultoformo (neoĥonio). \nĜi havas eksterordinarajn internajn branĉiojn kaj distingantan ridemon en sia fakoĵo. \nEstablitis nur sur lago de Xochimilko en Meksiko kie temas pri tre minacata specio pro perdo da habitato. \nPleje mirinde kapablita rekrei memstare amputitan partojn inkluzivanta nuksojn kaj eĉ cerbo-parton."
  pet.ball_python:
    label: Ballpython
    summary: Paca serpento spirale formanta pilkon dum minaco, idealigita reptilo por novulo.
    info: La Ball Python vivas en la savañoj kaj arbaroj de Okcidenta kaj Mez-Afrikio; ĝi estas konata per sia pacema naturo kaj tendenco ruligi sin al dika cirklo por protekti minacon je malgrandeco.Ĝia longo atingas inter 120 kaj 150 centimetrojn kun vivo super trideko jaroj.
  pet.bearded_dragon:
    label: dragocapon
    summary: Dragokapido el Auztralio tre ŝatis kiel varmebrua ekstraterapia animalo.
    info: La mezcarnia dragokapo estas unu el la plej popularaj reptilioj en kaptado ĉar tio havas mildan karakteron. Lia kapo fariĝas influita kaj malhela por esprimi emociojn aŭ dominadon. Li komunikiĝas per movoj de maneno kiel signo da subjektivo.
  pet.betta_fish:
    label: beta
    summary: Kolorhava labirinta fiŝo havanta eksterordinarajn plumetojn origininte ĉe Sudorientazio.
    info: La betto estas labirintema fiŝo kapabla spiradi laŭ normaleco per akvo sed ankaŭ uzante aeron pro sia speciala organismo por tio, vivanta en malprofundaj riĉarbojn de Tailandio. La maskuloj montras inter-similaj atakadeco, el kiuj venas ilia nomo 'siam-kamporda'. Per selektado estis kreitaj grandstilaj variantoj kun enormaj fluantplumaj pintoj.
  pet.blue_tongue_skink:
    label: modralingvaskingo
    summary: Blualtingva australiana reptilo uzantas nigran bildigon kontrau predatoroj.
    info: Modra-langaj lizardo estas granda Aŭstralia skinkspeço kun karakteriza blua lingvo. Ĝi montras la linguon por minacigi pridiktulojn – la bia pinto malatentigas ilin. Tio estas netemptema besto, grasa kaj moviĝanta per manko de agado, populara inter amatoroj.
  pet.budgerigar:
    label: melopside
    summary: Plej populare kapto-pasero, mallumaŭstrala psito.
    info: La Melopsitta undata estas la plej disvolviĝinta kaptita paserofonto en mondo post perdrolokojn. Ilia nativa plumaro estas verdan-kaj-flava sed diversspecaj mutantoj ekzistas pro selektbredo inkluzive de bluaj, blankaj kaj grizaj variantoj.
  pet.canary:
    label: kanarido
    summary: Pika kantipluma ovohavo bredata por ĝia voĉo kaj brila flaveco.
    info: La kanarido originas de la Insuloj Kanaario kaj estis domestikiĝinta en la 16-a jarcento fare de hispane okupantarojn. Per selektbredo multaj tipoj evoluis inkluzive tiuj kiuj estas kapablaj al melodioj (Rolero, Akvostaliero), diversfaritaj (ruĝa, blanka) kaj formodiversigitaj. Maskuloj eldonas kompleksajn melodyojn kaj povas lerni parton pri aliaj kantaĵoj.
  pet.cat:
    label: Katino
    summary: Sendependan plentempigantan hejomestranton per varmegradigitaj piedoj oni nomas Katino en nia lingvo.
    info: '{"hint":"la domestika kato (Felix catus), plezura hejmebestro","info":"Domestikita katino estas besto el la familio de grandaj felinidoj tre ŝatata por sia agila movado, pura konduto kaj sendependa karaktero.","label":"katino","summary":"Sendependoza plezurhejmeco kun malvarmaj piedo."}'
  pet.chameleon:
    label: Camaleono
    summary: Sauro kun sendependaj movebla duokulo.
    info: Kamelo estas saŭro kapabla ŝanĝi la kuloron de ĉarapo per hromaforoj; tiu ŝanĝado servas por esprimi emociojn plenumante kamufladon unue.Ĉiu okulo moviĝas sendepende kaj povas rigardi preskaŭ en tutajn direkcioj.Ĝia lingvo longegas ol korpo kaj forpuŝata rapideco atinganta 26km/h.
  pet.chinchilla:
    label: ĉinclio
    summary: Sud-amazona rodo havanta pleje denson pelton inter terrestriaj mamiferoj.
    info: La ĉincilo estas sudamericana rodo kun eksterordinare densa pelfabo de la montaroj Anđezoj kie el unu foliculo naskasĝiras inter sesdek kaj okdez naŭgipojn (pere al homo nur unus). Tiu animalo tenas en temperaturo supre ol dudek kvin grado Celsius; supervarmigo povus esti mortiga por tiun beston.
  pet.clownfish:
    label: klaufo
    summary: Orangeca fiŝo vivanta en simbiozeco kun marihelmono.
    info: Anemono okulhava estas mallonga mara pescio kiu vivas en simbiozo kun marihelmoj ĉefe en la Tropika Indi-Tahita Oceano. La helmon protektas per siajn venenajn manoj dum li netraŭgas ilin de predateco. Post ekspozicio al filmeto 'Nemo' (2003), tiuj fiskoj iĝis konataj pro niaj akuariaj interagoj.
  pet.cockatiel:
    label: nimfo
    summary: Petrozoro de malgranda kapakrestita papago el Aŭtralio.
    info: 'La nimfapapo estas originanta el Aŭstralio, kie vivas en stepejoj kaj arbaroj. Virinoj bone povas imiti sonojn: lernu ĉiun muzikon, melodion eĉ homajn vortojn. Tiu birdo tre socia facile establas rilaton kun sia posedanto dum prizorgado.'
  pet.corn_snake:
    label: kukuriko ujuvo
    summary: Kolorhava rudo-naranda ujuvo bonadaptita por novuloj.
    info: La Pantherophis guttatus originas en la sudeste de Usono, kie vivadas sur agrarojn kaj arbarojn. Ĝi estas netoksa kaj milda serpento kiun malofte mordas kaj havanta fortikan konstitucion.
  pet.crayfish:
    label: krustoakuara
    summary: Vivas malgranda kolorplena slavaci krustoko en akuario.
    info: Akvajniaj krustokostoj estas populara specio de salacrigenero por akuariaj batojn ĉar ilia aktiva konduto kaj vivuloj nuancoj.
  pet.crested_gecko:
    label: Gepono cilii
    summary: Noka gepida kun distingeba ŝveligita kapakapo kaj grandegaj okuloj.
    info: La Gekono Cilii estas originanta el Nuba Kaedonio kaj estis konsiderita eksterminta ĝis la jaro 1994-aĝo.Ĝi povas saltadi kaj agadas nokte.Malsimile al aliaj gepidoj, ĉi tiu ne bezonas specialan UVB lumigon.Gepida per fruktoj kaj insektoj; en prizonkapta stato ekestas diversa vario de barvitaj mutantoj.
  pet.degu:
    label: diguo
    summary: Malsaŭa Ĉila rodomato kun konduto simila al tiuj de inkoj.
    info: Digu estas malsuprenhava ĉilia rodonto rilate al la kinko kaj ŝino. Ĝi vivas nur tagmeze kaj tre socie, suferante de izolado. Digu havas tendencon ricevi diabeteson kaj en kaptaĵo ne devas manĝi sagraman frukton.
  pet.discus_fish:
    label: Skalar Diskus
    summary: Klavema diskoforma pezfiŝo rigardatas kiel reĝo da tropikoakuari.
    info: Diska (Simfizodono) estas granda rondformita amazonopecio kun magnifikaĵoj de diversaj koloroj. Ĝi unu el la plej postulataj akuariaj fiŝoj; necesas preciza aguochemio kaj temperaturo inter 28 kaj 32 gradoj Celsiaj. Junuloj nutriĝas per elmaloĉado eksteren de gepatra skapo; tiun fenomenon tro rare en fiŝoj.
  pet.dog:
    label: hundino
    summary: Fidela amiko por vivado en komunumo kun homo.
    info: Domata hundo estas la plej malnova hejmigita besto de homoj kaj apartenas al ĉi tiu raso pli ol mil da jaroj. Ekzistas super 400 rasoj kaj temas pri unu el pluraj subspecioj de geparda lupo.
  pet.dove_pet:
    label: domoka kolumbo
    summary: Pura blanka kolumbo tenata kiel amika besto aŭ liberigi ceremonie.
    info: La blanka kolumbo estas domesticigita roka kolombo kremitaj por purblanko videbleco. Ĝin uzas en geedziĝoj, enterigoj kaj festadojn dum la tuta mondo.
  pet.electric_eel:
    label: elektrofis
    summary: Sudamericana akvofonto kiun estas kapabla emiti elekrton kun forco supren iom pli ol okcent sesdek volto.
    info: Elektrofis Elektra neestas reela fiso sed rilata al karpoj el Suda Ameriko en la rivero Amazono. Ĝi povoras produktadi elekrtaĵojn de ekzaktece 860 voltojn por malvarmigi siajn manĝatojn aŭ defendi sin mem. Ĉar tiun beston tre gravas spirado per aerumo, ĝi devas regule levadri sur surfaco.
  pet.ferret:
    label: furko
    summary: Plenhumora ludo-domestiĉita membro de familio Lasieron, kurioza kaj afektiva amiko.
    info: La furko estas domestikiĝinta formo de la blanka muselo, kiun homoj ekdomestikigis pli ol du mil kvincent jaroj antaŭ por venki lirojn. Ŝi trezoriĝas interdeknel tri horaj tagloge kaj pasigas sian tempon ludante enebrie. ŝia karakteriza aromo elvenas per maŝadecoj.
  pet.frilled_lizard:
    label: Agamo kollarflanke
    summary: Varano el Aŭstralio uzanta dramaturgan flankfoldon por defendo.
    info: La Agamo kollarflankita estas aŭstralia varano, kiu ruzigas grandan kolfrunon ĉirkaŭ la pugo dum malpacoj per etendo de saviĝantaj ribelojn, faras silivan sonadon kaj staras sur siaj postaĵoj. Ŝi kuradas rapide kun nigrumitaj antauhorakoj en similigo al mikra trekskeleto.
  pet.gerbil:
    label: merion
    summary: Petola dezerta rodonto kun longstanga pelzokulo.
    info: La Meriones unguiculatus originas el aridaj steppoj de Mongolia kaj Ĉino. Adaptiĝis al vivado en la dezerto per tre malplena trinkado dank' al efika uzo da akvo ricevitaj kun manĝo. Vivantaroj grupojn kaj estas tagaktiva, tial taŭga por rigardi kiel dombestaĵo.
  pet.goldfish:
    label: zulorejo
    summary: Orajnoria oranĵokolora fiŝeto tenata en akuario.
    info: La zulorejo estas domiĉigita karasio kaptita en akuariioj ĉirkaŭ la tuta mondo. Ekzistas centoj da diverskolorigaj variantoj kaj tipoj de nĝilo.
  pet.guinea_pig:
    label: domato
    summary: Mallonga pelisita rodonto popolara inter infanoj.
    info: Domata kaviido estas socia rodonto el Suda Ameriko. Ĝi faras sandadajn sonojn, amikeca kaj ŝatas esti kun homoj.
  pet.hamster:
    label: hamster
    summary: Mallonga kaj belmonda glutema besteto kun plenigitaj bukoj.
    info: Zolata hamstero estas populara hejmdomo amiko. Ĝi kaptas manĝon en siajn bukojn por stokado de provizoj, pleje aktiva nokte kaj ŝatas ruli balancilo.
  pet.hedgehog:
    label: afrika heslonto
    summary: Peta spinema insektokaptisto kun kapabla formi bolon dum danĝero.
    info: Afrikan heslo estas populara ekzota hejma besto ĉeestanta en tuta la mondo.Ĝi havas inter 5 000 kaj 7 000 malplenaĵoj el keratino sur sia dorso.Kiam minacitaĝi ruligas sin al nepermebla pilko.
  pet.hermit_crab:
    label: hermitemo
    summary: Petrokrabo loĝanta en prenitaj ŝeloj por establigado el ekzota hejmpatro.
    info: |-
      Hermito rakso estas krustocefalo sen propra rigida pano, kiun ĝi protektas sian molan butonon en malplenigitaj muselŝeloĵoj de litoforidaj animaloj
      Ĝi serĉas pli granda ŝelon dum sia kresko.
      Seĥe hermitaj raksoj kondutiĝas amike; ili estas sociecaj kaj vivantaj kun aliaj.
  pet.iguana:
    label: iguano
    summary: Grandega verda repto el centra Aŭstralio populariganta ekzotikan hejmpastmon.
    info: La Iguano viridesca estas granda suda amerika reptilio kiu povas atingi ĝis du metroj da longeco. Tio strikte vegetarula besto postulas variegan folion kun UVB lumigo en prizonkapto. Gvidita per tri okulo sur la pinto de ties kapo por detektado de lumo.
  pet.koi:
    label: Capriko
    summary: Ornamada kapro per briloza kolorkolorado tenate en hortozistigo.
    info: La Kapro Kōi estas dekorativa raso da la ĝenerala kapro, ŝlachte en Japanio ekde la 18-a jarcento. Ekzistas pli ol cent diverskolorecaj variaĵoj; plezeblaj individuo kostas milerojn da monunitatoj.Ĝi povas atingi duonmiljardekolmon vivdaŭron; konata plejebla Kōi nomita Hanako establis rekordon kun dua-kvin-trankvil-cent-jara vivo.
  pet.leopard_gecko:
    label: Gepon Leoparda
    summary: Tagmeza geporda naskita kun makuloj estas bonega elektoreto por novbeginantaro.
    info: Leoparda geparda vivas en la dezertaj regionoj de Pakistanio kaj Afganio. Kontraste al plej multe el sia raso ĝi havas movadecajn paŭkojn anstataŭ adhaeriloj sur fingroj por ŝprucado per vitro. Tiel ekzistas ebleco akumuli grasecon dum tago kaj forĵeti sian voston se bezonis.
  pet.lovebird:
    label: agaporndiso
    summary: Mallonga brilema papega formanta fortan parencajn ligit.
    info: Agapornidoj estas malgrandaj afrikanoj papegoj konataj pri ilia forta rilato inter geparnoj. Geedzoj ekzercas reciprokan manĝigon, purigadon de unuolauko kaj pasigado da multe tempo kune; tiel originiĝis la nomo 'lovebirds'. Ekzistas naŭ specioj diversantaj per siaj koloroj kaj disvolviĝokondiĉoj.
  pet.mandarin_fish:
    label: mandarinko
    summary: Plejeblankulo marafisko mondo kun psikedela desegno.
    info: La Mandarinokarpio splendida estas malluma mara fisco el la ĉevalbato de Indiko-Kvaropo kun unu el plej rimarkindaj pintoj en animala regno. Gxi havas pigmenteblan plasto sen skaloj formita per specialaj pigmentceloj (kromatóforoj) kaj lumlumigantaj kombinaĵoj.
  pet.mini_pig:
    label: miniatur-praso
    summary: Petite hejmpraseco uzate kiel amiko.
    info: Miniaturpraso estas ŝloskribita por miniatura grandeco el la domestika prasa specio. Ili havas altan intelektivon kapablon lernanta truko simile al hundojn sed ankaŭ bezonas akvon ĉar ili mankas per sudoradiloj do rolas en limaco por regoli sian korpotemon.
  pet.moon_jellyfish:
    label: Lunomeduzo
    summary: Transparenta lumemisa ĉevalino tenato per kreisele.
    info: La lunaĵo estas unu el la plej oftaj tipoj de ĵetonoj kaj relativa senpeliganta por homoj. Preskaŭ transparenta, oni povas rigardi tra ĝiajn kvar cirkulajn gametoformadorganumon. Chovi en akuariio estis antau ol tio tre malfacileco sed nun ekzistas specialaj rondakvo tankoj nomata Kreisel.
  pet.mouse:
    label: murilo
    summary: Petaĵa malgranda rodonto pibrakigota kiam amiko au eksperimentbesto.
    info: La blanka murilo estas kultivita formo da la ĝenerala murilo, ŝlaftebrida por establiĝanta en labortorioj kaj kiel prizorgema besto.Ĝi havas altan intelekton kaj rapidas atenti al laberintojn kaj teknikecojn.Levadas du ĉu trionojn jarojn kaj estas socia animalo; rekomendinde teni per grupo.Murioj ludas gravan rolon pri medicina esploro.
  pet.mynah_bird:
    label: myne
    summary: Parolebla azia estorno havanta eksterordinaran kapablon al imito pri voĉoj.
    info: |-
      Myne estas paseriformo el la familio de estorneloj konata per unu el plej bonaj kapabloj paroli inter ĉiu ovoĵoj
      Ĝi imitas tonojn, lokparoladojn kaj melodiaĵon kun homa voĉo tre precize,
      kunorigine en Sudorienta Azio kaj Hindijo.
      En prizonpastro ĝi povas lernigi centero da vortoj kaj frazo.
  pet.oscar_fish:
    label: oskar
    summary: Granda inteligeckapabla cikldata el Amazonio respondanta pri sia posedanto.
    info: La oskaresoj estas grandaj sudamericanoj ciklidejo kun alta intelektivo kapablo distingi sian posedanton. Ili bezonas malgrandan akuariumo de almenaŭ 200 literoj kaj regula manĝado per viva aŭ frostigita manĝo por ilia nutrado. La plej altaj ekzempleroj atingas longecon super la 35 centimetraj kaj vivadas ĝis dudekkvin jarojn.
  pet.parrot:
    label: Papego
    summary: Kolora ovo kapabla imitadi homan voĉon.
    info: La Andulo striata estas la pleje rozbaldaŭigita specio de papego kaptota kiel hejmpeteco. Ĝi havas intelekton, sociablecon kaj povas imiti sonojn kaj vortojn.
  pet.prairie_dog:
    label: praerie-hundo
    summary: Sociale aganta hundorodo formantas subterranean unuopecon sur nordamericana prairie.
    info: Prairie-dogoj estas sociaj rodoformuloj el Norda Ameriko vivantaj en vastaj subteraj komunumoj. Ili interparolas per kompleksigita akustika sistemo kiu sciencistoj nombras la plejevolan animalan lingvon post homoj. Iliajn varnon de predatoroj oni transdonas kun voĉtonado simila al tondro.
  pet.quail_pet:
    label: Krepela mastrumado
    summary: Neplenumita kaj netrahema birdo adaptigota en internaj spaco.
    info: La japana krepelo estas malgranda ovo donanta paseriformo uzata por manĝaĵoj sed ankaŭ kiel dombestico. Ĝia pezo nur cent gramojn faras el la plej plenkorpulo inter domestikigitaj bestaroj. La maskloj emas al ŝrapi per 'pi-pi-pet', dum virinoj havas silenta voĉo.
  pet.rabbit:
    label: '"konik"'
    summary: '"Pelifabita amika besto kun longejn oreloj"'
    info: '{"info":"La domata koniko estas populara kato kun malvarmega pelfabo kaj karakterizaj longearoj. Ĝi manĝas fagonon, varmecon kaj freŝan herbon."}'
  pet.rat:
    label: rato
    summary: Pleja inteligecon montras la domata rato dum ludado.
    info: La domata rato estas unu el la pleje inteligente hodiaŭoj; ĝi lernas respondi al sia nomo kaj plenumadi kompleksajn taskojn per trejnado.Ĝi havas socian evoluon kaj formadas fortajn ligilojn kun homoj kiel ankaŭ inter si mem. La vivdauro de tiuj bestoj varias inter du kaj tri jaroj;
  pet.red_eared_slider:
    label: red-eared slider
    summary: Populara dulaka rezervaĵ-reptilo kun ruzaj strekoj malproksime al sia orel.
    info: Red-eared sliders estas originanta el Nordameriko kaj temas pri la plej disvolviĝinta reptilio en kapto ĉe niuj tempoj. La karakteriza ruza strio post ties orelio distingas ilin de similaj specioj. Ili bezonas ambaŭ akuakan por bati sin sub UVC-lampo kaj sukan teron pro soĉado.
  pet.sea_horse_pet:
    label: marinkonio
    summary: La marinkonio en salakvoa akuario – ekzotiĥa kaj faszino.
    info: Marinkonio estas unu el la pleje malfacile havigeblaj marhomojnuloj en prizono; ĝi bezonas vivantan manĝon (arthemejoj, mysidoj) kaj senpagan medion. La masklo portas puledojn dum naskado en ventra saketo kaj produktas centerojn da gepatroj samtempe. Ili lovas kun partnero por tuta vivo.
  pet.sugar_glider:
    label: flying squirrel
    summary: Small Australian flying mammal uses skin flaps along body while moving
    info: Flying squirrel is small Australian marsupial that can glide using membrane stretched between its front legs to back feet thanks for patagium which allows it fly through trees at night time when they have large eyes adapted seeing during darkness hours.
  pet.tarantula:
    label: birdspimo
    summary: Granda pelzita araneo eksterordinara amiko por aventurema.
    info: Pinktoed birdspider estas populara terapozido por komenciĝintoj ĉar de kalmeco. La plej granda specio, la giganta birdeŭo, estas pli granda ekluspaumo en mondo kun noutolongo super 30 centimetrojn; ties veneno egalas al tiu el insektoj kaj ne danĝeras per sanulo. Terapozidoj vivis dum dudek tra tridekk jaroj.
  pet.tortoise_pet:
    label: hermanna salamandra
    summary: Longlevora terrestra salamando por tuttempo.
    info: La hermannaj salamandroj estas malgrandaj suda-eŭropaj salamandroj populara kiel dombestoj. Ili vivas pli ol cent jarojn kaj multfoje superiras la agadon de iliaj posedantoj. En vintro ili dormumas per preskaŭ haltigita metabolismo.
  pet.turtle:
    label: '{"label":"tart", "type": "string"}'
    summary: '{"summary":"Malrapide aganta besto kun dura skvalto.",}'
    info: '{"info":"La Nádherko rujfaceta estas populara hejma tarto. Ĝi vivas en akuariio kun alirebla tero por sunlumo sub UVC-lampo."}'
