lang: ru
pivot: false
title: Домашние животные
cards:
  pet.angelfish:
    label: скаляр
    summary: Элегантный дискообразный тропический окунь со вытянутыми плавниками.
    info: '{"hint":"высокая дисковидная тропическая аквариумная рыба (Pterophyllum скалярное)","info":"Скаляриус амазонский - одна из самых популярных декоративных рыб благодаря своему элегантному треугольной форме и длинным плывущим плавникам.\nОн происходит с территории Амазона и требует теплой воды температуре от +24 до +28 градусов Цельсия.\nЭто хищник может есть маленьких рыбок.\nВ Японии этот красивый сколяр был первым видом экзотических животных импортированный в году 1909","label":"скаляр","summary":"Элегантный дискообразный тропический окунь со вытянутыми плавниками."}'
  pet.axolotl:
    label: аксолотл
    summary: Мехиканская амфибия со внешними жабрами.
    info: Аксолотл – водная саламандра из Мексики, которая сохраняет личиночную форму на протяжении всей жизни и не претерпевает метаморфоза как взрослая особь.
  pet.ball_python:
    label: королевский питон
    summary: Спокойная круглая змея, свивающаяся клубком при опасности; идеальный рептилоид для новичков.
    info: Королевская питонка происходит из западной и центральной Африки, где обитает в саваннах и лесах. При угрозе она свивается в плотный шарик (отсюда название «шаровая змея»). Она достигает длины от 120 до 150 см и живет более тридцати лет.
  pet.bearded_dragon:
    label: вампирский дракон
    summary: Австралийская ящерица популярен как теплый экзотический питомец.
    info: Средний вампирский дракон - один из самых популярных рептилий в неволе благодаря спокойному характеру.
  pet.betta_fish:
    label: бэтта
    summary: Цветная лабиринтовая рыба с выразительной чешуйками из южноазиатского региона.
    info: '{"hint":"цветная лабиринтовая рыба с пышными хвостами из Юго-Восточной Азии","info":"Бетта боевая - это лабиринтная рыба дыхания воздуха через специальный орган и живущий в мелких рисовых полях Таиланда.\rСамцы агрессивны друг к другу; отсюда название тайская бойцовская рыбка.\rПри разведении возникли величественные формы с огромным сплывающим жабрами.\rЖизнь составляет три до пяти лет и относительно непритязательна."}'
  pet.blue_tongue_skink:
    label: сцинк со светлой зеленовато-голубой окраской
    summary: Австралузский рептиль с заметным голубым язычном используется в качестве угрозы.
    info: Синезыбный скимскрот – крупная австралийская ящерица с характерно голубым языком. Он высовывает язык как предупреждение для хищников; цвет служит отпугивающим фактором.
  pet.budgerigar:
    label: анделька
    summary: Самая популярная клеточная певчая птица мира – маленькая австралийская попугай.
    info: Анделька волнообразная является самым распространённым домашним птицем на свете после канарейки. Дикие андальски имеют зелёно-жёлтую окраску; цветные мутации (синие, белые, серые) появились благодаря селекции. Самцы могут имитировать человеческий голос и выучить сотни слов.
  pet.canary:
    label: канарейка
    summary: Маленькая птица породы канарейки разводится за красивый голос и ярко желтую окраску.
    info: Канарейка происходит с Канарских островов и была одомашнена испанскими завоевателями в XV веке.
  pet.cat:
    label: кошка
    summary: Независимое домашнее животное с мягкими лапами.
    info: Домашняя кошка — это зверь из семейства кошачьих, держащаяся как питомец. Она известна своей проворностью, чистоплотностью и независимым характером.
  pet.chameleon:
    label: xaméléon
    summary: |-
      Рептилия, которая может менять свою окраску кожного покрова за счет наличия хроматофоров; она использует изменения цвета больше всего для выражения своих чувств, а не только ради маскирования себя.
      Каждый из его двух глаз перемещается по своему собственному направлению и охватывает почти полный круг видимости до 360 градусов вокруг него самого.
      Его язык длиннее тела самой рептилиии выстреливает на скоростях около 26 км"). Он живёт исключительно среди деревьев и имеет клешнёобразные ноги, чтобы удерживать ветви дерева под собой во время движения или отдыха.
    info: '{"hint":"ящерица меняет цвет с независимо двигающимися глазами","info":"Хамелеон - ящерка со способностью менять окраску кожи при помощи хроматофоров; он изменяет свой оттенок для передачи эмоций и не в первую очередь как маскировочная мера.","label":"хамелеон","summary":"Ящерка меняющая цвет с двумя свободно движущимися глазами."}'
  pet.chinchilla:
    label: чинчила
    summary: Южноамериканская мышиная тварь с самыми густо обросшей кожей среди всех наземных животных.
    info: '{"hint":"мягкошерстный южноамериканский грызун с очень плотной шкурой (Chinchilla lanigera)","info":"Чинчилла - это млекопитающее из Анд со рекордно густым покровом волоса; на один фолликул растет от 60 до 80 волосков (у человека всего лишь один).\nОна держится при температуре не выше +25°C; перегрев может быть для неё летальным. \nМожет прожить и по 15 лет, иногда даже больше чем через двадцать лет.\nЕго мех был исторически так ценен, что вид находится под угрозой браконьерства."}'
  pet.clownfish:
    label: клоун с глазами
    summary: Оранжевый цветной рыбы, который живёт во взаимосвязанности с морскими степнями.
    info: '{"hint":"маленькая оранжево-белая морская рыба, живущая в кораллах анемонов (амфиприона)," "info": "Клоун с глазами - это маленькие тропические индоокеанические рыбки из семейства амфириониновых, которые живут во взаимодействии со стебельками морских медуз." Степенка защищает его своими ядовитыми щупальцами, он чистит ее и отгоняет хищников. После фильма «Поиск Немы»(2003 год) стал символом акварийного искусства. Все клоуны рождаются как самцы; доминирующий особь может претерпеть трансформацию на самку.'
  pet.cockatiel:
    label: нимфика
    summary: Маленький австральский попугай с курчавой головкой известен своей способностью петь.
    info: Нимфа происходит из Австралии и обитает в степях и лесах этой страны.
  pet.corn_snake:
    label: питон кукурудзовый
    summary: Спокойное красноватое домашнее создание подходит новичкам.
    info: '{"hint":"домашняя оранжево-красная змея без яда для начинающих","info":"Кукурузный питон происходит из юго-востока США и обитает на полях и в лесах\nЭто неядовитая спокойственная змея; редко кусается и устойчива\nЕе имя получило от полей с кукурузой или похожего пятнистого образца живота напоминающего зерно кукурузы\nДлина достигает более метра и живет до двадцати лет в неволе."}'
  pet.crayfish:
    label: рак аквариум
    summary: Маленькие цвета соленых воды улитка в аквариум.
    info: '{"hint":"пресноводные ракообразные в аквариумах (Cambarellus или Procambarus)","info":"Аквакультурный краб - популярное обитатели пресных водоемов благодаря активному поведению и яркой окраске.\nСиний флоридский краб (Procambarus alleni) является наиболее любимым видом для аквариума.\nОн линяет при росте; новый панцирь изначально мягкий.\nЭто полезно как очистители дна; они потребляют водоросли и остатки пищи."}'
  pet.crested_gecko:
    label: гекон с ресничкой
    summary: Ночной гекон со заметной кисточковой чешуей на голове.
    info: Гекон с ресничками происходит из Новой Каледонии и считался вымершим до года 1994. Он умеет прыгать и активен ночью.
  pet.degu:
    label: дегу
    summary: Малый чиллийский хомяк с поведением в стиле шиншиллы.
    info: Дегу – маленький чилийский грызун из семейства морковиевых и близких к ним видов. Он строго дневной животный и очень социальный, поэтому плохо переносит одиночество.
  pet.discus_fish:
    label: дискус
    summary: Яркая дисковидная тепловодная аквариумная рыба.
    info: Дискусовыe рыбы (Symphysodon) – это крупные круглые тропические рыбки яркой окраски из Амазонии.
  pet.dog:
    label: собака
    summary: Верный домашний питомец, друг человека.
    info: Домашняя собака – это одомашненный волк, самый древний домашний зверь человека. Существует более 400 пород и она известна как «лучший друг человека».
  pet.dove_pet:
    label: Дрозд
    summary: Чисто белое пернатое любимец или используемое для церемоний выпускания.
    info: '{"hint":"белая голубица держится как нежное домашнее животное или используется для выпусков (Pigeon Columba livia)","info":"Белый воронок - это одомашненный скальный гусь породы с чисто белой окраской\nОна спокойная и доброжелательная; в отличие от попугаев она не кусает и не плачет\nИспользуется на свадьбах, похоронах и торжественных мероприятиях во всем мире\nЭто символ мира со времен Библии","label":"дворовый голубь","summary":"Чисто белые голубицы содержатся как питомцы или используются для праздничного выпущения."}'
  pet.electric_eel:
    label: электрический угр
    summary: Южноамериканская рыба вырабатывающая электроразряды до 860 вольт.
    info: Электрический угорь не является настоящим угрем и относится к родне карповых Южной Америки из бассейна реки Амазонка.
  pet.ferret:
    label: '"ферри"'
    summary: '"Игрушка, одомашниваемый ласковый зверек, любознателен и дружеское животное."'
    info: '{"hint":"игровой одомашненный мелкий хищник из семейства куньих родственников выдрах (Mustela putorius furo)","info":"Феррет - это доместикованная форма белого терьера, которая была приручена более чем две тысячи пятьсот лет назад для охоты на зайцев.\nОна любопытна и игрива; обычно спит от четырёх до шести часов в день и остальное время проводит активно играя.\nУ нее характерный запах аромата с барсучьей железки.\nВ Чехии феррит является популярным экзотическим питомцем дома."}'
  pet.frilled_lizard:
    label: агама с манжетом
    summary: Австральский хамелеон разворачивает драматический складной воротник для защиты.
    info: Агама с манжетом - австралийская ящерица, которая при угрозе раскрывает большой воротник вокруг шеи и издает свистящий звук; она стоит на задних лапах как миниатюрный Тираниросавр Рекс. Воротник усилен вытянутыми ребрами.
  pet.gerbil:
    label: песчанок
    summary: Маленький пушистый грызун со шлейкой хвостом.
    info: Песчанка монгольская происходит из сухих степей Монголии и Китая. Она адаптирована к жизни в пустыне – почти не пьёт воду благодаря эффективной переработке воды пищи. Живет стадами и активна днём, поэтому подходит как домашнее животное для наблюдения.
  pet.goldfish:
    label: золотая рыбка
    summary: Оранжево-золотистая рыба, содержащаяся в аквариуме.
    info: Золотая рыбка – это одомашненный карп, разводимый в аквариумах по всему миру. Она существует в сотнях цветовых вариаций и типов плавников.
  pet.guinea_pig:
    label: морская свинка
    summary: Маленькое пушистое грызунье, популярное домашнее животное для детей.
    info: Домашняя морская свинка – это социальное млекопитающее из Южной Америки. Она издаёт писклявые звуки и любит человеческую компанию.
  pet.hamster:
    label: хомяк
    summary: Маленький милый грызун с щеками, набитыми едой.
    info: Золотистые хомяки популярны как домашние питомцы. Они прячут запасы пищи в свои щёки, активны преимущественно ночью и любят бегать по колесу.
  pet.hedgehog:
    label: еж африканская
    summary: Мелкий колючий насекомоядное животное сворачивается в клубок при угрозе.
    info: Африканский ежик – популярный экзотический питомец, разводимый по всему миру.
  pet.hermit_crab:
    label: краб-отшельник
    summary: Маленький членистоногий животный с арендованной скорлупой, экзотический любимец.
    info: Раки-отшельники – это ракообразные без собственного прочного панциря и защищают мягкую заднюю часть тела в пустых моллюсковых раковинах. Когда они растут, им приходится находить более крупную оболочку. Сухие отшельниковые крабы могут быть домашним питомцем; они социальны и живут группами.
  pet.iguana:
    label: анаконда
    summary: Большой зелёный хищник с тропической Юго-Америки популярны как экзотические любимцы.
    info: '{"hint":"большая травоядная ящерица из Центральной Америки держится в качестве домашнего питомца (Anolis anolineus)","info": "Зеленый анаконда - большая южноамериканская змея вырастающая до двух метров."}'
  pet.koi:
    label: комп
    summary: Лицевый креп с яркими кольорами
    info: |-
      {"hint":"\u043a\u0440\u0435\u043f \u0438\u043d\u043b\u043c\u0435\u0439\u043a\u0438 Cyprinidae","info":"\u041a\u043e\u0438 - крепливой вид обыкного крепа,искусственный в
      Японии c XVII w.
      Istnieje ponad stuzka odmian kolorystycznych;
      uwazane za najdrozsze egzemplarze sprzedawane sa za tysiace zlotych.
      Zdojawieza ponad dwa stulecia;
      najstarszy znany ko"}
  pet.leopard_gecko:
    label: пятнистый геккон
    summary: Маленький пятнистой окраски ночной геккон идеально подходящий для начинающих.
    info: Геккон пятнистый происходит из пустынных районов Пакистана и Афганистана. В отличие от большинства геконов у него нет присосок на лапках – он не может взбираться по стеклу. У этого вида подвижные веки, что является редкостью среди других видов ящериц.
  pet.lovebird:
    label: агапорнис
    summary: Яркого красного перца формирует плотное соединение парности.
    info: "{\"hint\":\"маленький яркоокрашенный попугай с парными связями (Агапорнис)\",\"info\":\"Агапорнисы - это маленькие африканские птицы известные своими прочными партнерскими отношениями.\\rПары кормят друг друга и проводят много времени вместе;\nотсюда название Lovebirds. \nСуществует девять видов различающихся по цвету и распространению.\nОбе половые формы могут имитировать звуки\",\"label\":\"агапорнис\",\"summary\":\"Мелкая окраска вороны образующая тесную парность.\"}"
  pet.mandarin_fish:
    label: мандаринка
    summary: Самая цветастая морская рыба мира со спейседеликским узором.
    info: Мандаринка прекрасная – это маленькая морская рыба коралловых рифов Индоокеана с одним из самых ярких окрасок в животном мире.
  pet.mini_pig:
    label: минипиг
    summary: Крошечная домашняя свинья держится как питомец.
    info: Миниатюрные свиньи (чашечка или микросвинки) – это выведенные мелкие породы домашней свиней. Они умны и чистоплотны; могут учиться трюкам как собака. Избегают солнца из-за отсутствия потовых желез и катаются в грязи для терморегуляции.
  pet.moon_jellyfish:
    label: \U0436\U0435\U043b\U0435
    summary: \U0417\U0435\U043b\
    info: '{"hint":"\U043c\U0435\U043b\U043a\/ \U043f\U044e\U0449\U043d\U043e-\'
  pet.mouse:
    label: мышь белая
    summary: Маленький одомаханый грызун содержится в качестве питомца или лабораторного животного.
    info: Белая домашняя мышь - это одомашненная форма полевой мыши, выведённая как лабораторное и декоративное животное.
  pet.mynah_bird:
    label: майна
    summary: Разговаривающий азиатский шпицель с исключительно хорошим умением имитировать звуки.
    info: '{"hint":"певчий воробей из семейства дроздовых с Азии","info":"Голубой майна - птица от семьи ткачиков известная одной из лучших способностей говорить среди всех птиц.\rНаподражает тоны и интонацие человеческого голоса со поразительной точностью.\rПроисходит из Юго-Восточной Азии и Индии.\rВ неволе может выучит сотни слов и фраз."}'
  pet.oscar_fish:
    label: оскар
    summary: Большая разумная цихлинда с Амазона которые реагируют на хозяина
    info: '{"hint":"большая умная цихлида из Южной Америки (Астронотус оцеллатус)","info":"Оскар павий - большая югамериканская цихлина известна своей интеллектом и способностью распознать своего владельца.\nТребует большое аквариуме(минимум на 200 литров), а также регулярное кормление живой или замороженной пищей. \nДостигает длины более чем в 35 см., может жить до 15 лет.\nИногда он себя больше как собака нежели рыба; плывет ко стеклу когда владелец приближаются","label":"оскар","summary":"Большую разумную цихлинду с Амазона которая реагирует на хозяина."}'
  pet.parrot:
    label: попугай
    summary: Разноцветная птица, способная имитировать человеческий голос.
    info: Попугаи молуккские являются наиболее распространённым видом попугаев, держимых в качестве домашних животных. Они умны, общительны и могут подражать звукам и словам.
  pet.prairie_dog:
    label: прус прери
    summary: Социально ориентированный хищник строящий тунели на лугах и степях Северной Америке.
    info: Прун предрый - это социальное грызущее животное с Северной Америки живое в обширных подземных колониях.
  pet.quail_pet:
    label: курочка любимчик
    summary: Маленькое ненастный птенец содержит как комнатное животное.
    info: '{"hint":"кнопка перепел или японский куропатки держаться как маленький питомец птица (Котернекс)","info":"Японская курицы - мелкие пташки содержится либо для яиц и в качестве домашних животных.\nОни весит всего лишь 100 граммов и является наименее крупной разновидностью мяса из птицы.\nСамцы кукушечник выкричивают: пи-пи-пит, самочки тихо кудахчают.\nЭто спокойные и подходящие даже квартир."}'
  pet.rabbit:
    label: кролик
    summary: Шерстистое животное с длинными ушами.
    info: Домашний кролик – популярное домашнее животное со шелковистой шерстью и характерно длинными ушами. Питается сеном, зеленью и свежей травой.
  pet.rat:
    label: крыса домашняя
    summary: Интеллигентный одомашненный грызун, преданный питомец поразительно умен.
    info: Домашняя крыса - один из самых умных грызунов; она может учиться реагировать на имя и выполнять сложные задачи.
  pet.red_eared_slider:
    label: черепаха красногорлая
    summary: Популярный пресноводный питомец черепашки с чёрно-красными пятныщами около глаз.
    info: Черепаха краснобрюхая происходит из Северной Америки и является самым распространённым рептилией в неволе на планете. Характерная полоска за ушами отличает её от похожих видов. Ей нужна водяная часть аквариума а также сухое место для грёз под УФ лампой.
  pet.sea_horse_pet:
    label: \u043C\u043E\u0440\u0441\u043A\u0438\u0439 \u043A\u043E\u043D\u0435\u044F
    summary: \.
    info: '{"hint":"\u043a\u0456\u043f \u0447\u043e\u043b\u0438\u0441\u044f \u0432 \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u043d\u044b\u0445 морских аквариумах (Гиппокамп)'
  pet.sugar_glider:
    label: флейтушка
    summary: Маленькая летучая флейтушка с плёнкой вдоль тела скользит по деревьям.
    info: Флейтушка длиннохвостая – маленький австралийский сумчатый зверь, способный парить благодаря кожистой перепонке между передними и задними ногами. У неё большие глаза для ночного зрения, она очень социальна и страдает от одиночества. Флейтушки издают лай, шипение или мурлычащие звуки.
  pet.tarantula:
    label: павиан
    summary: Большее волосатое членистоногое экзотическое домашнее животное для смелых.
    info: Птицеподобный паук розового цвета популярен среди новичков благодаря спокойному характеру.
  pet.tortoise_pet:
    label: сушесную черепаху
    summary: Длительный сушистый черепахи, мазликик на всю жизнь
    info: '{"hint":"малая сухопутная черепаха из рода Testudo как долгоживущее домашнее животное","info":"Черепаха Гельманна - маленькая южноевропейская сухопутная черепаха популярная в качестве питомца\nМожет дойти до возраста более чем на сто лет и пережить своего владельца\nЗимует зимой, метаболизм почти останавливается\nВ Чехии разведение без лицензии запрещено для некоторых видов"}'
  pet.turtle:
    label: черепаха
    summary: Медленное животное с твёрдой скорлупой.
    info: Черепаха красноголовая — популярная домашняя черепаха. Она живёт в аквариумах с доступом на суше и греется под УФ лампой.
