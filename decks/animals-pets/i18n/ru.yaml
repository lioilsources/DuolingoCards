lang: ru
pivot: false
title: Домашние животные
cards:
  pet.cat:
    label: кошка
    summary: Независимое домашнее животное с мягкими лапами.
    info: Домашняя кошка — это зверь из семейства кошачьих, держащаяся как питомец. Она известна своей проворностью, чистоплотностью и независимым характером.
  pet.dog:
    label: собака
    summary: Верный домашний питомец, друг человека.
    info: Домашняя собака – это одомашненный волк, самый древний домашний зверь человека. Существует более 400 пород и она известна как «лучший друг человека».
  pet.goldfish:
    label: золотая рыбка
    summary: Оранжево-золотистая рыба, содержащаяся в аквариуме.
    info: Золотая рыбка – это одомашненный карп, разводимый в аквариумах по всему миру. Она существует в сотнях цветовых вариаций и типов плавников.
  pet.guinea_pig:
    label: морская свинка
    summary: Маленькое пушистое грызунье, популярное домашнее животное для детей.
    info: Домашняя морская свинка – это социальное млекопитающее из Южной Америки. Она издаёт писклявые звуки и любит человеческую компанию.
  pet.hamster:
    label: хомяк
    summary: Маленький милый грызун с щеками, набитыми едой.
    info: Золотистые хомяки популярны как домашние питомцы. Они прячут запасы пищи в свои щёки, активны преимущественно ночью и любят бегать по колесу.
  pet.parrot:
    label: попугай
    summary: Разноцветная птица, способная имитировать человеческий голос.
    info: Попугаи молуккские являются наиболее распространённым видом попугаев, держимых в качестве домашних животных. Они умны, общительны и могут подражать звукам и словам.
  pet.rabbit:
    label: кролик
    summary: Шерстистое животное с длинными ушами.
    info: Домашний кролик – популярное домашнее животное со шелковистой шерстью и характерно длинными ушами. Питается сеном, зеленью и свежей травой.
  pet.turtle:
    label: черепаха
    summary: Медленное животное с твёрдой скорлупой.
    info: Черепаха красноголовая — популярная домашняя черепаха. Она живёт в аквариумах с доступом на суше и греется под УФ лампой.
