lang: ko
pivot: false
title: 가정용 애완동물
cards:
  pet.cat:
    label: 고양이
    summary: 부드러운 발바닥을 가진 독립적인 애완동물입니다.
    info: 가정에서 흔히 길러지는 고양이는 포유류 중 코치과에 속하며, 민첩함, 깨끗함 그리고 독립적 성격으로 알려져 있습니다.
  pet.dog:
    label: 개
    summary: 충성스러운 가정 애완동물인 인간의 친구입니다.
    info: 가정 개는 유대된 늑대로, 인류 최초로 길들여진 동물입니다. 400개 이상의 품종이 있으며 '인간에게 가장 좋은 친구'라고 불립니다.
  pet.goldfish:
    label: 금붕어
    summary: 아쿠아리움에서 길러지는 오렌지색 물고기입니다.
    info: 금붕어는 세계 곳곳의 아쿠아리움에서 키우는 야생 카퍼(Carassius auratus)로, 수백 가지 색상 변이와 꽃게 형태가 있습니다.
  pet.guinea_pig:
    label: 모르체
    summary: 털이 많은 작은 포유동물로 아이들의 인기 있는 애완동물입니다.
    info: 가정용 모르체는 남아메리카에 서식하는 사회적인 곰팡이입니다. 이 동물은 소리를 내며 친절하며 사람과의 교류를 즐깁니다.
  pet.hamster:
    label: 햄스터
    summary: 귀여운 작은 포유동물로 얼굴에 음식을 저장합니다.
    info: 황색 햄스터는 인기 있는 애완 동물입니다. 먹이를 얼굴 안으로 챙겨 두고, 주로 밤에 활발하며 바퀴 위에서 달리는 것을 좋아합니다.
  pet.parrot:
    label: 앵무
    summary: 인간의 목소리를 흉내낼 수 있는 색이 놀라운 새입니다.
    info: 털깃 앵무는 반려동물로 가장 널리 사육되는 종 중 하나입니다. 이들은 지능이 뛰어나고 사회적이며 소리와 단어를 모방할 수 있습니다.
  pet.rabbit:
    label: 토끼
    summary: 긴 귀가 있는 털이 많은 애완동물.
    info: 집토끼는 부드러운 털과 특징적인 긴 귀를 가진 인기 있는 애완동물입니다. 이들은 건초, 채소와 신선한 잔디로 먹이를 주어 사육됩니다.
  pet.turtle:
    label: 거북이
    summary: 딱딱한 갑각을 가진 느린 동물입니다.
    info: 붉은 얼굴 붉은 등 거북이는 인기 있는 애완용 터틀입니다. 육지로 이동할 수 있는 수족관에서 사육되며, 자외선 램프 아래서 몸을 녹힙니다.
