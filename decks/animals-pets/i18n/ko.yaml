lang: ko
pivot: false
title: 가정용 애완동물
cards:
  pet.angelfish:
    label: 스칼라
    summary: 세모난 모양과 늘씬한 지느러미를 가진 우아한 딱딱한 열대 어류.
    info: 아마존 분지에서 온 스칼라 잉어는 세모난 형태와 길고 부드러운 꼬리가 특징이며 수족관 애호가들 사이에 가장 인기 있는 열대 어류 중 하나입니다. 따뜻한 물(섭씨 24~28도)을 필요로 하며 포식자이므로 작은 고기를 먹습니다. 일본에서는 아름다움으로 널리 알려진 이 종은 처음으로 도입된 열대수생동물로서 1909년 들어 왔습니다.
  pet.axolotl:
    label: аксолотл
    summary: 멕시코 출산의 영구적으로 물 속에 사는 척추동물을 말하며, 외부 기관을 가졌다.
    info: 아코로틀은 멕시카누 아메이스토마(Ambystoma mexicanum)라는 물螈으로, 일생 동안 유충 형태를 유지한다(신유체). 이 생물에는 두드러진 외부 기관인 어린 살과 특징적인 웃는 표정을 보여준다. 멕시코의 호치미르코호에서만 서식하는 종이며, 야생 환경에서는 위급한 상태에 처해 있다. 놀라운 재생 능력을 가지고 있어 팔 다리뿐 아니라 심장이나 대뇌 일부도 회복할 수 있는 것으로 알려져 있다.
  pet.ball_python:
    label: 왕가다나
    summary: 온순하고 둥근 형태를 만드는 이 가다는 초보자에게 적합한 흔히 선호되는 첫 번째 도마뱀 입니다。
    info: "왕가다나는 서아프리카와 중부 아프리카의 사바나 및 숲에서 발견됩니다。\n위협을 느낄 때 몸을 단단한 공 모양으로 말습니다(이유로 볼 파이썬이라는 이름이 붙여졌음). \n길이는 약 120~150cm이며 수명은 보통 30년 이상입니다。\n현재까지 포획 상태에서 교배된 색상 돌연변종만도 무려 8천 개 이상 존재합니다。"
  pet.bearded_dragon:
    label: vousatý drak
    summary: 온난화 환경에서 사랑받는 호주산 애완용 뎀블링 도마뱀
    info: 중형의 Vousatý 드라크는 온순한 성격 덕분에 가장 인기 있는 파충류 중 하나입니다. 감정이나 지배성을 표현할 때 털을 부풀리고 어두워집니다. 팔로 손짓하는 제스처를 하며 순종적인 신호를 보냅니다. 이 동물은 육식성이며 곤충과 채소 및 열매도 먹습니다.
  pet.betta_fish:
    label: bettas
    summary: 아세안 지역에 서식하는 화려한 색상과 장난감 같은 지느러미를 가진 레빈보우 어류입니다.
    info: ' Bettasplenden은 특수한 기관을 이용해 공기를 마시는 래비린스어로 태국의 얕고 물이 고인 쌀田에서 삽니다. 수컷들은 서로에게 적대적이어서 ''사이암 파이트 피쉬''라는 이름으로 알려져 있습니다. 교배를 통해 거대하고 흐르듯 연결된 꼬리가 있는 형태들이 생겨났습니다.'
  pet.blue_tongue_skink:
    label: 파랑혀스킨
    summary: 호주의 대형 도마뱀이며 눈길 사냥꾼들을 겁주는 역할의 두드러지는 파랗다.
    info: 블루 턱 스카인크는 특징적인 파란 혀를 가진 큰 호주 냉혈동물이다. 이 동물은 포식자에게 경고하기 위해 혓바닥을 내밀며, 붉게 반짝이는 청색이 위협적으로 작용한다. 폐쇄적이지 않고 살찐 몸집에 느리지만 사람과 친화력 있는 성격으로 애완동물로 인기가 있다.
  pet.budgerigar:
    label: 앵무새
    summary: 세계 최대 규모의 갇힌 새인 작은 호주 원앙.
    info: '''안둘카 벨나타''는 세계에서 가장 흔하게 사육되는 조류 중 하나로 알려져 있습니다. 야생의 안둘카는 녹색과 노란빛을 띠며 인공적으로 재배종된 변이 종으로 파랑이나 하얀 색상도 존재합니다. 수컷은 사람 목소리를 모방할 수 있으며 백 개 이상 단어를 배울 수도 있어요.'
  pet.canary:
    label: '"""'
    summary: '"작고 아름답게 부리는 새로서 소리를 위한 교배 및 눈부신 노란빛 빛깔 때문에 인기 있는 존재이다.'
    info: '{"hint":"소형 노래새로 그의 목소리와 밝은 황색깔(세린우스 카나리아)을 위해 길러진 것","info":"칸라르는 캐년 제도에서 유래하며 스페인 정복자들에 의해 15 세기에 야생 상태를 벗어났다.\n육종으로 다양한 종류가 생겨났는데, 가창성(Roller, Waterslager), 색상별(빨간색, 흰색), 형태 등이 있다.\n수컷들은 복잡한 멜로디를 불며 다른 곡들의 일부분들을 배울 수 있다.\n역사적으로 섬유질 광산 내 일氧化碳 탐지용으로 사용되었다."}'
  pet.cat:
    label: 고양이
    summary: 부드러운 발바닥을 가진 독립적인 애완동물입니다.
    info: 가정에서 흔히 길러지는 고양이는 포유류 중 코치과에 속하며, 민첩함, 깨끗함 그리고 독립적 성격으로 알려져 있습니다.
  pet.chameleon:
    label: カメレオン
    summary: 색상 변환하는 파충류로서 두 개의 눕에 독자적인 운동성을 보인다.
    info: 카멜레온은 색소포를 이용해 피부의 색을 바꾸는 뱀파이처럼 생긴 동물입니다. 이들은 감정 표현으로 주로 색상을 변화시키며 캄ouflage보다 우선시합니다. 각각 눈동자는 독립적으로 움직이며 거의 360도 시야 범위가 있습니다.
  pet.chinchilla:
    label: 치칠라
    summary: 남아메리칸 육상 포유동물 중 가장 밀집된ขน을 지닌 생쥐.
    info: 치칠라(chinchilla)는 안데스 산맥에 사는 털이 매우 과밀한 설치류입니다. 하나의 모낭에서 최대 60~80개까지 머리카락이 자랍니다(인간은 단 한 가닥만). 체온 조절을 위해 섭씨 25도 이하 환경을 선호하며 고열로 인해 죽음으로 이어질 수 있습니다. 평균적으로 암수 모두 15년 정도를 살며 드물게나마 20살 이상 되기도 합니다.
  pet.clownfish:
    label: 눈가리개 깍
    summary: 주황색 어류로서 해葵와 공생하며 살아갑니다.
    info: 눈가리개 까만은 열대 인도양과 태평양의 해葵와 공생하는 작은 바다 물고기입니다.해葵는 독한 촉수로 눈가리개 깃을 보호해주며, 그 대신 눈가니 개 깨끗하게 하고 포식자로부터 방어합니다.영화 '누마를 찾아서'(2003년작) 이후 수족관 문화에서 아이콘으로 자리 잡았습니다.모든 눈다이들은 암컷으로부터 시작되지만 우월한 개인은 다시 수컷으로 변할 수 있습니다.
  pet.cockatiel:
    label: 니무프카
    summary: 호주의 작은 머리 깃털 달린 파피용새로서 부드러운 목소리를 가진 이유로 사랑받습니다.
    info: 니姆파(코렐라)는 호주에서 온 새로 초원과 숲에 서식합니다. 수컷은 훌륭한 모방 능력을 가지고 있어 노래와 멜로디 그리고 인간의 말을 배울 수 있습니다. 사회적인 성향이 강하고 길들일 경우 주인에게 쉽게 친근감을 표현하죠. 약 15~20년까지 사육되며 세계적으로 세 번째 인기 있는 반려조류입니다.
  pet.corn_snake:
    label: "\U0001F33D 옐로 스폿"
    summary: 평화롭고 주홍색 또는 오렌지 색상으로 초보자에게 적합한 파우더 스네크입니다.
    info: "\U0001F33D 옐로 스팟 뱀은 미국 남동부의 밭과 숲에서 발견되며 무해하고 평온한 성격을 가지고 있습니다. 드물게 물어뜯으며 강건합니다. 이름은 아마도 콩 필드나 배에 있는 곡물을 닮은 반점무늬 때문에 붙여졌습니다. 길이가 약 한 미터이며 포획 상태에서는 최대 20년까지 삶을 이룹니다."
  pet.crayfish:
    label: '"라크 아쿠아르지네"'
    summary: '"작고 다채로운 담수가 수족관 안에서 사육된다."'
    info: '{"hint":"수족관에서 키우는 담수 게(카مبر렐루스 또는 프로캄바рус)","info":"게들은 활발한 행동과 생동감 있는 색상으로 인해 수족관의 대표적인 주민들이다.\n플로리다 청색 게(프로캄버러스 알렌이)가 가장 선호되는 종이며 애완용으로 널리 사랑받고 있다.\n성장하면서 껍질을 벗어내며 새롭게 자라는 외골격은 처음에는 부드럽기 때문에 유연하다.\n저주머니 역할도 하여 조류와 음식 찬물을 소비하며 바닥 정화에 기여한다."'
  pet.crested_gecko:
    label: 게콘 치라티우스
    summary: 눈 주위에 터무늬가 있는 눈부신 크림색 먹모사 꽃 모양의 밤 생활하는 게코.
    info: 카일리아투스 게코는 뉴칼레도니아에서 온 동물로, 1994년까지 멸종된 것으로 여겨졌다. 점프할 수 있고 야행성이다. 다른 게코들과 달리 특별한 자외선 조명이 필요하지 않다.
  pet.degu:
    label: 데구
    summary: 칠레 출신 소형 포유동물로서 강한 사회성을 지닌 특징으로 인해 흔히 알려져 있습니다.
    info: 데구는 칠레의 작은 설치류로 쥐와 기니피그에 가까운 종입니다. 엄격하게 주간 활동을 하며 매우 사회적이어서 고립 상태를 견디기 어렵습니다. 당뇨병이 잘 생길 수 있으므로 야생에서는 달콤한 과일 섭취가 제한됩니다. 알츠하ай머 병 연구에서 중요한 모델 동물 중 하나입니다.
  pet.discus_fish:
    label: diskus
    summary: 색とりどき나 다각적인 형태를 가진 열대어로서 '수족관 왕'으로 여겨지는 고귀하고 희소한 존재.
    info: 디스커스(Symphysodon)는 아마존 강에서 서식하는 원형의 놀라운 색상을 지닌 큰 물고기입니다. 이 종은 수족관 생물 중 가장 까다로운 것으로 알려져 있으며 정확한 수질 화학 조건과 약 28~32°C 사이의 온도가 필요합니다. 어린 딸리는 부모 피부로부터 배출된 점액을 먹이로 삼는데, 이것은 매우 드문 현상입니다.
  pet.dog:
    label: 개
    summary: 충성스러운 가정 애완동물인 인간의 친구입니다.
    info: 가정 개는 유대된 늑대로, 인류 최초로 길들여진 동물입니다. 400개 이상의 품종이 있으며 '인간에게 가장 좋은 친구'라고 불립니다.
  pet.dove_pet:
    label: 흰비둘기
    summary: 하얗게 생긴 이 종은 반려동물로 기르거나 특별히 예술적인 의미를 나타내는 축제나 의식에 쓴다.
    info: 백색 비둘기인 흰비둘기는 깨끗한 하얀 색상을 위해 길러진 야생 돌비의 가축종입니다. 올빼미와 닭처럼 소리를 내지 않고 물지도 않아 친근합니다. 결혼식이나 장례 및 다양한 행사에서 전 세계적으로 방출용으로 사용됩니다.
  pet.electric_eel:
    label: Electric eel
    summary: 남미에서 발견되는 강력한 전류(최고 약 860 볼트)를 생성하는 물고기
    info: 전기뱀장어는 진짜 뱀장어가 아니라 남아메리카 아마존 지역의 카프 종에 속한 생물입니다. 최대 860볼트까지 전기를 발생시켜 먹이를 마비시키거나 방어용으로 사용합니다. 공기가 필요해서 주기적으로 수면 위로 올라와 숨을 쉭니다.
  pet.ferret:
    label: 페트카
    summary: 장난감 같은 집게 생쥐로, 호기심 있고 귀여움 있는 반려동물입니다.
    info: |-
      페트카는 흰 여우가락의 야생종으로서 2천5백 년 전에 설치류 포획을 위해 가축화된 곤충이다。
      이 동물은 호기심 많고 장난스러운 성격이며 하루 평균 14~18시간 정도 자며 나머지 시간에는 활발하게 놀아요.
      특징적인 피자색 나는 기름샘에서 나오는 특유의 냄새를 가지고 있어요.
  pet.frilled_lizard:
    label: 림프 아가마
    summary: 호주 원주민이 위험할 때 극적인 라인 코브 형태의 접힌 부분을 열어서 보입니다.
    info: 아가마 리임코바는 위협을 받으면 목 주위에 큰 림프를 펴고 침착한 소리를 내며 발톱으로 서서 방어합니다. 이 브레이스는 연장된 늑골로 강화되어 있습니다. 두 다리에서 달리는 모습은 미니 튜렉과 같습니다.
  pet.gerbil:
    label: 털쥐
    summary: 긴 모ขน 꼬리 가진 작은 사막 포유류.
    info: 몽골과 중국의 건조한 스텝 지역에서 온 몽고 털쥐는 사막 생활에 적응되어 있습니다. 음식으로부터 물을 잘 처리하므로 거의 마시지 않습니다. 무리를 지어 살아 있고 낮 동안 활동적이기 때문에 관찰하기 좋은 애완용입니다. 땅 파기를 좋아하고 자연스러운 행동이 가능하도록 충분한 기질(substrát)가 필요합니다.
  pet.goldfish:
    label: 금붕어
    summary: 아쿠아리움에서 길러지는 오렌지색 물고기입니다.
    info: 금붕어는 세계 곳곳의 아쿠아리움에서 키우는 야생 카퍼(Carassius auratus)로, 수백 가지 색상 변이와 꽃게 형태가 있습니다.
  pet.guinea_pig:
    label: 모르체
    summary: 털이 많은 작은 포유동물로 아이들의 인기 있는 애완동물입니다.
    info: 가정용 모르체는 남아메리카에 서식하는 사회적인 곰팡이입니다. 이 동물은 소리를 내며 친절하며 사람과의 교류를 즐깁니다.
  pet.hamster:
    label: 햄스터
    summary: 귀여운 작은 포유동물로 얼굴에 음식을 저장합니다.
    info: 황색 햄스터는 인기 있는 애완 동물입니다. 먹이를 얼굴 안으로 챙겨 두고, 주로 밤에 활발하며 바퀴 위에서 달리는 것을 좋아합니다.
  pet.hedgehog:
    label: 구보
    summary: 위험 시 몸을 굽혀 볼 형태로 만드는 작은 가시진한 포유류
    info: 아프리카 구보는 전 세계에서 인기 있는 애완동물입니다. 등에는 카테닌으로 된 빈 바늘 모양의 돌기가 최대 7천 개까지 있습니다. 위협을 받으면 방수가 되지 않는 공처럼 말려 보호합니다. 이 동물은 밤행성이며 활동하기 위해 휘轮이 필요하며 한밤중에 무려 5km를 달릴 수 있다고 합니다.
  pet.hermit_crab:
    label: 사막속게
    summary: 빌린 케밥 안에 산 작은 연체 동물로 희귀한 반려동물입니다。
    info: |-
      사막 속의 게는 자신의 단단한 갑각이 없고 대신 나뭇잎 모양 껌을 빈 조개에 숨깁니다。
      크기가 커지면 더 큰 코끼리를 찾아다닙니다。
      건조 지대에서 사냥하는 이들은 애완동물처럼 행동하며 사회적이고 무리 생활합니다。
      자연 상태에서는 열대 해변과 만 지역에서 서식하고 있습니다。
  pet.iguana:
    label: 앵무
    summary: 열대 아메리카 지역 출신인 녹색 대형 도마뱀으로 흔히 가축화된 왕따구르다.
    info: 녹색 앵무는 중미에서 온 최대 길이가 2m에 달하는 큰 파충류이다. 이 종은 엄격한 초식성이며 사육 환경에서는 다양한 채소와 자외선 B(UVB) 조명을 필요로 한다. 머리 정상부에는 빛에 민감하게 반응하는 제3의 눈(정수개체)를 가지고 있다.
  pet.koi:
    label: '"capri ko"'
    summary: 정원 웅덩이나 호소 등에서 보통 아름다움을 위해 재배되는 백조 모양의 생선.
    info: '{"hint":"색이 화려한 희귀 종으로 사육된 고기용 연어(Cyprinus carpio)","info":"코이 카프리는 일본에서 18세기에 처음 길러진 장식적인 붉은 물고기입니다.\n100개 이상의 샘플 변종들이 존재하며 가장 귀중한 개체는 수천만 원에 팔릴 정도로 가치가 높습니다.\n평균수명보다 더 오래 살아서 최장 기록인 코이는 한아카라는 이름을 가졌으며 무려 226년까지 산 것으로 알려져 있습니다.\n일본 문화에서는 용감함과 인내심 그리고 행운을 상징합니다."}'
  pet.leopard_gecko:
    label: ' Leopard Gecko'
    summary: 작고 점이 있는 밤 생활하는 뱀파우로 초보자에게 이상적인 종.
    info: 豹紋 Gecko는 파키스탄과 아프가니스탄의 사막 지역에서 온 야행성 소형 도마뱀입니다. 대부분의 Gecko와 달리 손끝에 흡입구를 가지고 있지 않기 때문에 유리를 오르지 못합니다.
  pet.lovebird:
    label: 애그앱오른시스
    summary: 강력히 결합된 쌍으로 구성되는 작고 밀색 높인 조류
    info: |-
      아가포르니스(Agapornis)(분리되지 않는 앵무새)는 강한 짝짓기 관계로 유명한 작은 아프리카 종의 황조류입니다。
      짝들은 서로에게 먹이를 주고 깨끗하게 하고 대부분 시간을 함께 보내며 '러브버드'라는 이름은 여기서 비롯됩니다。
      9개종으로 색상과 분포에 따라 달라집니다。
      암수 모두 소리를 흡사하게 모방할 수 있습니다.
  pet.mandarin_fish:
    label: 마날린카
    summary: 심해 최대 규모로 심각하게 변하는 패턴으로 유명한 세계적인 다채롭기 바닷 물고기.
    info: 인도양과 태평양의 산호초에서 사는 Mandarinfish(예쁜 마나르디шка)는 동물계 중에서도 가장 눈에 띄게 색이 나는 바다생선이다. 비늘 대신 염색체를 가진 특별한 세포와 발광 화합물을 통해 그림 같은 무늬가 나타난다. 이 생선은 살아 있는 미세 먹잇감만을 섭취하며 키우기가 매우 어렵고 국제적으로 보호받는 종이다.
  pet.mini_pig:
    label: 마이너트 프리스
    summary: 반려동물로서 길들여진 작은 집돼지
    info: |-
      미니 돼지(티 컵 또는 마이크로 품종의 미니어처 돼지는 가축으로 사육된 소형 개체이다.
      그들은 지능적이고 깨끗하며 강아지를 연상시키는 기술을 배울 수 있다.
      햇빛에서 스스로를 보호한다.(땀샘 없음), 온도 조절 위해 진흙탕에 굴러 들어간다.
      많은 주인들이 판매자가 약속한 것보다 더 크게 자라는 것을 놀라워 한다.
  pet.moon_jellyfish:
    label: 미끄러운 담쟁이
    summary: 반투명하면서도 생물발광성을 지닌 조류인 '미끄러운 담쟁이는' 특정 수족관 속에서 재배되고 있다.
    info: '{"hint":"작고 생체 발광하는 미꾸라지가 특수 수족관에서 사육됩니다.(아우렐리아 아우르ита)","info":"달 모양 물방울은 가장 흔한 종 중 하나이며 인간에게는 상대적으로 무해합니다\. 거의 반투명하며 네 개의 원형 난소를 통해 볼 수 있습니다\.<br> 고통스럽게 유지되던 수족관 내 환경이 오늘날에는 특별히 설계된 둥근 탱크(kreisel)로 인해 쉬워졌습니다\.<br> 약 1년에서 최장 1½ 년까지 삶을 이어갑니다","label":"미끄러운 담쟁이","summary":"특정 수조에 기른 반투명하고 생물발광성 점액충");'
  pet.mouse:
    label: 小白鼠
    summary: 집이나 연구소에서 길러지는 작은 유사한 종인 소형 포유동물.
    info: 흰쥐는 집에서 키우거나 실험실 동물로 사육하기 위해 교배된 야생 쥐의 가축화 형태입니다. 이들은 지능이 높아 미로와 다양한 기술을 배울 수 있습니다. 평균적으로 생애가 짧은 것으로 알려져 있으며 최대 세 살까지 삽니다.
  pet.mynah_bird:
    label: 민야
    summary: 말을 잘 따라 하는 아시아 지역 스팅크가족새.
    info: 마이나는 매스티드 가족에 속하는 조류로, 모든 새 중에서도 가장 뛰어난 말하기 능력을 자랑합니다. 인간의 목소리 톤과 억양 및 어조를 믿기지 않을 만큼 정확하게 모방할 수 있습니다. 동남아시아와 인도에서 온 이 종은 야생 상태에서는 물론 사육 환경에서도 백 개 이상 단어나 문장을 배울 수 있는 것으로 알려져 있습니다.
  pet.oscar_fish:
    label: '"oscar"'
    summary: '"암존강 근처 지역 출신이며 사람에게 반응하는 스마트하고 컷나운 척추동물."'
    info: '{"hint":"남미에서 온 큰 지능이 있는 치카디스(아스트로노투스 오셀라터)","info":"오ска르는 남미의 대형 체클리드로서 주인을 인식할 수 있을 만큼 높은 지성을 가지고 있으며 유명하다.\n큰 어항(최소한으로 약 200 리터 이상), 그리고 생선이나 동결된 음식으로 규칙적으로 먹이는 것이 필요하다.\n성체가 되면 길이가 최대 35cm까지 자라고 평균수명도 무려 15년에 달한다.\n때론 강아지보다 물고기처럼 행동하기도 하며, 주인이 가까워질 때 창문 쪽으로 헤엄쳐 다닌다."'
  pet.parrot:
    label: 앵무
    summary: 인간의 목소리를 흉내낼 수 있는 색이 놀라운 새입니다.
    info: 털깃 앵무는 반려동물로 가장 널리 사육되는 종 중 하나입니다. 이들은 지능이 뛰어나고 사회적이며 소리와 단어를 모방할 수 있습니다.
  pet.prairie_dog:
    label: 프레리 돝
    summary: 북미 대초원 지역에서 토굴을 파며 살아가는 집단성 설치동물
    info: 프레리 독은 북아메리카의 광활한 지하 공동체에서 사는 사회적 포유류입니다. 과학자들은 이들이 사용하는 복잡한 소리를 인간 다음으로 가장 복합적인 동물 언어로 간주합니다. '독'이라는 이름은 포식자를 경고하기 위한 짖음소인 것에 기반을 뒀습니다. 그들의 군락지는 수십 가지 다른 종들에게 핵심 생태계 역할을 합니다.
  pet.quail_pet:
    label: 애완 깐부리
    summary: 작으며 관리하기 쉽도록 실내에서 사육되는 야생 동물.
    info: |-
      일본산 까마귀는 작은 새로 달걀을 생산하거나 애완동물로서 길러집니다.
      몸무게가 단지 100그램이며 가장 작고 키우기 쉬운 가금류입니다.
      수컷은 '피-피-핏' 소리를 내며, 암컷은 조용하게 куд куд 거립니다.
      조용하고 아파트에서도 기르기에 적합합니다.
  pet.rabbit:
    label: 토끼
    summary: 긴 귀가 있는 털이 많은 애완동물.
    info: 집토끼는 부드러운 털과 특징적인 긴 귀를 가진 인기 있는 애완동물입니다. 이들은 건초, 채소와 신선한 잔디로 먹이를 주어 사육됩니다.
  pet.rat:
    label: 집鼷鼠
    summary: 지적이고 충실하며 높은 지능을 가진 온순한 동물.
    info: '{"hint":"가정에서 키우는 지능 있고 애착 있는 반려동물인 집쥐(Rattus norvegicus)","info":"집鼷鼠는 가장 똑똑한 포유류 중 하나로 이름에 대한 음성을 인식하고 복잡한 작업을 수행할 수 있다.\n사회성이 발달되어 있으며 사람과 다른 쥐와 강력한 유대 관계를 형성한다.\n평균 수명은 2~3년이며 아시아에서는 기민함과 번영의 상징이기도 하다(중국 절기).\n강렬한 후각으로 인해 아프리카 지역 미네 타파(mining)에도 도움을 준다."}'
  pet.red_eared_slider:
    label: 붉은귀 거북
    summary: 귀 주변에 붉은 무늬가 있는 인기 많은 담수 연못용 거북
    info: 붉은귀 거북이는 북아메리카 원산지이며 세계에서 가장 흔한 포획된 파충류이다. 귀 뒤의 붉은 줄무늬는 유사종과 구별되는 특징이다. 수영할 물 공간 외에도 자외선 등 아래서 일광욕을 할 수 있는 육상 영역도 필요하다. 이 종류는 최대 30년 이상 사육될 수도 있으며 일부 개체들은 야생으로 방출되어 침입성 생물로 갈등이 발생하기도 한다.
  pet.sea_horse_pet:
    label: 수족관 내 바다말
    summary: 해양 수조에서 볼 수 있는 독특하고 매력적인 생물을 말하는 '바다말'.
    info: 바다말은 수족관에서 사육하기 가장 어려운 해양 동물 중 하나로 살아있는 먹이(아르테미에, 미시디스 등)와 조용한 환경을 필요로 합니다. 암컷 대신 수컷 바닷말이 배 속 주머니 안에서 새끼를 품고 있으며 한 번에 수백 마리의 아기를 낳습니다. 이들은 짝으로 함께 살며 평생 서로에게 충성합니다. 전통 의학 때문에 불법적으로 채취되어 비판적 위험 상태입니다.
  pet.sugar_glider:
    label: 비치체 렟타바
    summary: 몸의 막으로 나뭇가지 간 비행이 가능한 작고 아프터나트적인 오스트레일리아 유사한 포유 동물.
    info: 비치체 렛아바는 앞다리와 다리를 연결하는 낭포(patagium)를 이용해 나무 사이로 나는 작은 호주 포유류입니다. 큰 눈을 가지고 밤에 활동하며 매우 사회적이며 고립 상태에서 고통받습니다. 짖음과 휘파람 소리 그리고 야옹 같은 울음을 사용하여 의사소통합니다.
  pet.tarantula:
    label: ptakopysek
    summary: 용감한 사람들을 위한 대형 깃털 모양 파우크 이색 반려동물
    info: |2-
       Ptakopysek rozyvy는 초보자에게 인기 있는 타란투라로 온순한 성격때문입니다.
      가장 큰 종인 거대 페루 뱌바스카이아(ptaracyn)는 다리 길이 기준으로 세계에서 가장 커서 무려 약 30cm에 달합니다.
      그의 독은 범위와 비슷하며 건강한 어른 인간에는 위험하지 않습니다.
      tarantrulas는 최소 20년에서 많게야 30년까지 삶을 누릴 수 있습니다.
  pet.tortoise_pet:
    label: 지중해 육상거북
    summary: 오랜 생애를 가진 육상거북이며 평생 함께할 반려 동물이다.
    info: |-
      헤르만 거북은 소형 남유럽 육상거북으로 애완동물로 인기가 많다.
      수명이 백 년을 넘길 수 있어 주인보다 오래 살아남는 경우도 있다.
      겨울에는 휴면 상태에 들어 대사 작용 거의 멈춘 채 지낸다.
      체코에서는 일부 종류의 사육이 법적으로 제한된다.
  pet.turtle:
    label: 거북이
    summary: 딱딱한 갑각을 가진 느린 동물입니다.
    info: 붉은 얼굴 붉은 등 거북이는 인기 있는 애완용 터틀입니다. 육지로 이동할 수 있는 수족관에서 사육되며, 자외선 램프 아래서 몸을 녹힙니다.
