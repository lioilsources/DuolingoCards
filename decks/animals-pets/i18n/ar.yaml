lang: ar
pivot: false
title: الحيوانات الأليفة
cards:
  pet.angelfish:
    label: سكوالية
    summary: سمكة مستديرة الشكل ذات أطراف طويلة تشبه القرص.
    info: السكاليار الأمازوني هو أحد أكثر الأسماك المحبوبة في أحواض السمك بسبب شكله الثلاثي الأنيق وأسنانها الطويلة العائمة. يعيش حول نهر الأمازون ويتطلب ماء دافئًا درجة حرارة تتراوح بين ٢٤ إلى ٢٨°م، وهو جائع ويمكن أن يستهلك أسماك صغيرة. كما أنه كان أول نوع من السكان التوتروبية المستورد لليابان عام ١٩٠٩.
  pet.axolotl:
    label: أكسولاتل
    summary: ملوثة مكسيكيّة تسكن دائمًا المياه مع وجود زعنوبры.
    info: الأسكولوتل هو حيوان مائي من الملوتشات يعيش في المكسيك، ويحتفظ ب 形태 اليراع طوال حياته (ظاهرة تُعرف بالنيوتيين). لديه زعانفر خارجية واضحة ووجه يبدو وكأنه ابتسامة. وهو نوع فريد لبحيرة شوكيميلكو بالمكسيك ومهدد بشكل خطير بالإختفاء.
  pet.ball_python:
    label: كوبرا ملكية
    summary: ثعبان هادئ ينكمش على شكل كرّة وهو حيوان أليف مثالٍي للمبتدؤين.
    info: الكobra الملكية تأتي من غرب ووسط إفريقيا، حيث تسكن الأعشاب الجافة والغابات. عندما تتعرض للخطر تنكمش في كرة محصنة (ومن هنا جاءت مسمى الكرة). يصل طولها إلى ما بين 120 سم إلى 150 سم وتعيش أكثر من ثلاثين عامًا. هناك أكثر من ثمانية آلاف نوع لوني تم انتجينه بالأسر.
  pet.bearded_dragon:
    label: التنين ذو الفك
    summary: ثعلب أسترالي مشهور بكونه قطًا عالميًّا.
    info: |-
      التنين ذو الفك المفتوح هو أحد أكثر الزواحف شعبية في الأسر بسبب طبعه الهادئ
      يفخّم فكه ويتغير لونهما كتعبير عن المشاعر أو السيطرة،
      it يتفاعل بإيماءات الذراع مثل موجز ذراعيه باعتبارها إشارة تصالح,
      وهو حيوان آكل لل一切 من الحشرات والنباتات والفواكه.
  pet.betta_fish:
    label: '"betta"'
    summary: سمكة متاهية ذات ريش كثيف ومُلوِنة تأتي من جنوب شرقي آسيا.
    info: |-
      {"hint":"سمكة متاهية لونها زاهي وذات أشعة متدلّية من جنوب شرق آسيا (بيتا سبندينس)","info":"الbettas هي سمك متاهة يتنفَّسه الهواء باستخدام عضو خاص ويوجد في حقول الأرز الضحلة بประเทศไทย.
      The males are aggressive towards each other; hence its name Thai fighting fish.
      Through breeding have arisen extravagant forms having huge trailing rays.
      It lives for three to five years and is relatively low-maintenance."}
  pet.blue_tongue_skink:
    label: سكينق ذو اللسان الأزرق
    summary: ثعلب بري أسترالي معروف بتفرعاته الزرقاء الواضحة التي يستخدمها للتوعية.
    info: السَّكينق الأزرق اللسان هو ثعبان كبير أسترالي يتميز بلسانه الأزرق المميز للغاية، يظهر لسانه كتحذير للحيوانات آكلة اللحوم؛ فاللون الأزرق له تأثير رادٍ عنهما. إنه حيوان غير عgressي وسميك ومتأخر الحركة محبوب من قبل الناس باعتباره قطعة شائقة. يمكن أن يصل عمر هذا الثدي إلى ما بين خمس عشرة إلى عشرين عامًا ويصل طوله أكثر من 50 سم.
  pet.budgerigar:
    label: أَنْدولِكَا
    summary: أكثر طيرٍ مشهور للحفاظ عليه داخل القفص حول العالم وهو عبارة عن ببغاء صغير ناشيء.
    info: الأندوكا الموجية هي الطائر الأليف الأكثر انتشارًا في العالم بعد الزنجيل، ويتم تربيتها كحيوان أليفة بشكل واسع النطاق؛ فالأنواع البرية لها لونها الأخضر والأصفر بينما يظهر اللون الأزرق والرمادي نتيجة التهجين البشري. الذكور قادرة على تقليد صوت الإنسان وتتعلم مئات الكلمات خلال حياتهم التي تمتد من خمس إلى عشر سنوات وهي حيوان اجتماعي.
  pet.canary:
    label: الكاناري
    summary: طائر صغير غني بالصوت تم اختياره لنغمته الصوتيّة ولونه الزاهٍ.
    info: يأتي الكاناري من جزر الكناري وتم ترويضه في القرن الخامس عشر على يد الغزاة الإسبان، وقد نتج عن التهجين العديد من الأنواع مثل المغنية واللونية والأخرى ذات الشكل المختلف؛ الذكور تنطق ألحاناً معقدة وتتعلم قطعًا من أغاني أخرى. كما استخدموا تاريخيا ككاشف لثاني أكسيد الكربون داخل المناجم الفحم.
  pet.cat:
    label: القطة
    summary: حيوان أليف منزلي مستقل ذو قدمين ناعمين.
    info: القطة المنزلية هي حيوان من عائلة الفelines تُربى كحيوان أليف. وهي معروفة برشاقتها ونظافتها وطبيعتها المستقلة.
  pet.chameleon:
    label: ضفان
    summary: زاحفة تتغير بألوان مستقلة ومتحركة.
    info: |-
      {"hint":"الضفان الملون الذي يغير لونه مع حركة العين المستقلة (كامايليو)","info":" الضفان هو نوع من الزواحف لديه القدرة على تغيير لون الجلد باستخدام الكروماتوفورات؛ ويقوم بتغيير اللون كوسيلة للتعبير عن المشاعر، وليس بشكل أساسي للتخفية.
      كل عين يمكنها الحركة بحرية وتغطي تقريبًا دائرة كاملة قياس ٣٦٠ درجة.
      لسان الضفان أطول من جسده ويمكن أن يتم طرحه بمعدل سرعة وصل إلى ٢٦ كلم في الساعة.
      يعيش فقط على الأشجار ولديه ذراعا مخلبية خاصة بالتقاط الفروع."}
  pet.chinchilla:
    label: '{ "label": "قنصل" }'
    summary: '{"summary":"حشرات أنواع الحيوان المقرمش بأعلى كثافة للشعر على الإطلاق عند الثدييات البرية."}'
    info: '{"hint":"ثديّ ناعم من أمريكا الجنوبية له كسوة شعر كثيفة جدًا (Lagomorpha Laniger)","info":"القِنْصَلُ حيوانٌ مقرمش يعيش في الجبال الأنديز لديه طبقة شعر كثيف بشكل قياسي؛ كل فردة واحدة تنتج ما بين ستين إلى ثمانون خصلة (في البشر فقط واحد).\nيمكنه التحمل حتى درجة حرارة 25°م، والحر الشديد قد يكون خطير عليه وربما يؤدي لموته. \nقد يصل عمر القِنصَل إلى 15 عاماً، وفي بعض الأحيان أكثر من عشرين سنة.\nكانت قيمة ألياف هذا الشعر عالية جداً تاريخياً مما يجعل نوعها الآن تحت الخطر بسبب الصيد غير المشروع."}'
  pet.clownfish:
    label: الكلوون العيني
    summary: سمكة بلورية اللون تحيا بشكل متناغم مع الزواحف البحرية.
    info: الكلوون العيني هو سمكة بحرية صغيرة من منطقة إنديانبيك الإستوائية تعيش في علاقة تنمّية مع النباتات البحرية المُثيرة للسامة. تقوم هذه الأخيرة بالحماية بواسطة أذرعها السامَة، بينما ينظف الكلوون ويصد عنهم الحيوانات المفترسة. أصبح رمزًا لعلم الأحياء البحري بعد ظهوره في الفيلم 'Looking for Nemo' عام ٢٠٠٣. جميع الكلوونات يولدون ذكوراً؛ ويمكن أن يتغير الذكر الغالب إلى مؤنث.
  pet.cockatiel:
    label: نيمفيك
    summary: طير نُيمفَّا الصغير ذو القمة المتموجة المعروفة بأصواته الغنية.
    info: النِيمْفا تأتي من أستراليا، حيث تسكن الأعشاب الطويلة والغابات. الذكور متميزون في التقليد ويتعلمون أغاني وحروفًا إنسانية. إنها كائن اجتماعي يرتبط بسهولة مع صاحبته عند الاحتجز.
  pet.corn_snake:
    label: الboa الحلو
    summary: ثعبان أحمر برتقالي هادئ ومناسب للمستخدمين الجدد.
    info: تعيش الboa الحلوة في جنوب شرق الولايات المتحدة، حيث توجد على المزارع والغابات. أنها ليست سامة وودية؛ نادراً ما تنقرض وهي مقاومة للضرر. يُعتقد أن اسمها يأتي من مزروعات الذرة أو النمط المتقطّب لبطنها الذي يتذكر بالحبوب.
  pet.crayfish:
    label: '"رَكْسٌ إكواريوم"'
    summary: '{"summary": "صغير جذاب ذو رأس حرشفي وموجود داخل الإيكويريم"}'
    info: |-
      {"info":"الرَّكْسُ الْأَقْيَاوِينِ يَنْتَشِرُ كَمَلٍ فِي أَحْواضِ السَّدًى لِعَطاءِهِ النَّشاطَ وَالألوانَ الجذابة.
      (Procambarus alleni)، الرَّاكَ الأزرق من ولاية فلوريدا، هو الأكثر شعبية في أحوض المياه العذبة.
      يرتدِّي قشرة جديدة أثناء نموه؛ القشر الجديدة تكون طريّة أولًا.
      إنهم مفيدون بتنظيف الأرضيات حيث يستهلكون الطحالب والفضلات."}
  pet.crested_gecko:
    label: جيكون شوكولاتوي
    summary: ثعبان ليلى بcrest واضح مثل الحواجب وأعين كبيرة.
    info: '{"hint":"الجاكوس الليلي ذو الريش المماثل للحواجب (Correllophus ciliatus)","info":"يأتي الجيكو الشوكولي من كاليدونيا الجديدة، وكان يُعتقد أنه انقرض حتى عام ١٩٩٤\ندق قادر على القفز وهو ناشط ليلاً\نعلى عكس أنواع أخرى من جاكيوز لا يتطلب إضاءة خاصة بالأشعة فوق البنفسجية UBV \نيأكل الفواكه والآفات وداخل الأسر توجد مجموعة متنوعة كبيرة من الطفرات في الألوان."}'
  pet.degu:
    label: ديغو
    summary: حَمّام صغير اجتماعي من تشيلي مشابه للقرد.
    info: الديغو هو حيوان غني بالنشاط ينتمي إلى فئة الحيوانات المُلتحمة، ويوجد في تشيلي وهو قريب من الأرانب والقِرين. إنه نشط خلال النهار فقط واجتماعية للغاية؛ وقد تؤثر العزلة عليه سلبًا. كما أنه عرضة لمرض السكري ولا يجب إعطاؤه الفواكه الحلوة إذا كان مربى كحيوان أليف.
  pet.discus_fish:
    label: سكاليار ديستوس
    summary: سمكة القرص الفاخرة المعترف بها على أنها ملك لأحواض المياه الدافئة.
    info: القرصيات هي سمكة كروية الشكل من الأمازون ذات ألوان مذهلة، وهي واحدة من أكثر الأسماك المطلوبة في أحواض السمك؛ تتطلب تركيبًا دقيقاً للمياه ودرجة حرارة تراوح بين ٢٨ إلى ٣٢ درجة مئوية. كما أن الصغار تستمد غذائها من العواد التمثيلية الناتج عن جلد والديها وهو ظاهرة نادرة جداً لدى الأسماك.
  pet.dog:
    label: الكلب
    summary: حيوان أليف مخلص، صديق الإنسان.
    info: الكلب المنزلي هو كلب أُسِرَ من الذئب، وهو الحيوان الأسرى القديم للإنسان. يوجد أكثر من 400 سلالة وكلب معروف باسم 'أفضل صديق للإنسان'.
  pet.dove_pet:
    label: حمام أبيض
    summary: حمامة بيضاء نقية مرباة كحيوان أليف أو للاستخدام في المناسبات.
    info: الصقور البيضاء هي نوع من الحمام البري يتم تربيته لتكون بيضاء ناصعة اللون، وهي هادئة وودية؛ على عكس الببغاءات لا تقضم ولا تنفث الصوت بحدة. وتُستخدم في الزواج والدفن والعروض والحفلات عبر العالم كله منذ العصور الكتابية.
  pet.electric_eel:
    label: Electric Eel
    summary: سمكة جنوب أمريكية تولد صدمة كهربائية قوية حتى 860 فولط.
    info: العُجول الكهربائي ليس سمكة حقيقية، بل قريب من أسماك السلمون في أمريكا الجنوبية. يمكن له إنتاج صدمات كهربائية تصل إلى 860 فولت لتخدير الفريسة أو الدفاع عن نفسه.
  pet.ferret:
    label: الفريسكا
    summary: حيوان كاسر داجني هادر ولطيف.
    info: الكلب المفترس هو شكل مُدَوْمِج من الثعلب الأبيض، وقد تم ترويضه منذ أكثر من ألفي وخمسمائة سنة لصيد зайцы. إنه فضولي وهادئ؛ ينام عادةً بين أربع عشرة إلى ثمانية عشر ساعة يومياً ويقضى الباقي في اللعب النشط جداً. له رائحة خفيفة ومميزة مصدرها غدد العطر.
  pet.frilled_lizard:
    label: أغامة ذات الرقبة المفتوحة
    summary: ثعلب بري استرالي يستخدم فتح زياح ضخم في العنق كوسيلة دفاع.
    info: أغاما اللِّمْصُوَا هى ثعبان أسترالى يفتح ليمكاً كبيراً حول عنقه عندما يتعرض للخطر، ويصدر صوتًا مسموعًا وينتصب على قدميه الخلفيتين. يتم تعزيز الليمك بواسطة عظام جانبية منطوَّلة. كما أنه يركض على رجليه الأماميين كأنها نسخة صغيرة من تي rex.
  pet.gerbil:
    label: الصقر
    summary: حيوان صغير ذو ذيل طويل ومُعَدِّل للحياة الصحراوية.
    info: يأتي الصقور المغولي من الأراضي الجافة في مونجوليا والصين، وهو يعيش بشكل جيد في الصحاري؛ لأنه يحتاج إلى كمية قليلة جداً من المياه نظراً لقدرته العالية على استخلاص الرطوبة الغذائية من الطعام. كما أنه حيوان اجتماعي ونشط خلال النهار مما يجعل منه كلباً أليفاً مشاهداً رائعاً.
  pet.goldfish:
    label: سمكة ذهبية
    summary: سمكة ذات لون برتقالي فاتح تُربى في أحواض الزينة.
    info: السمكة الذهبية هي نوع من سمك الكاراس المدجن الذي يُحتفظ به في الأحواض الزجاجية حول العالم. يوجد لها مئات التباينات اللونية وأنواع مختلفة من الفتح.
  pet.guinea_pig:
    label: خنزير غابة
    summary: حيوان صغير مُغطى بالขน، وهو حيوان أليف شائع للأطفال.
    info: الخنزير الغابي منزلي هو حيوان اجتماعي ينتمي إلى فئة الحيوانات المضغة ويوجد في أمريكا الجنوبية. يصدر أصواتًا متقطعة ووديع جدًا ومتحمس للتفاعل مع البشر.
  pet.hamster:
    label: فأر ذهبي
    summary: حيوان صغير لطيف ينتمي إلى فصيلة الحيوانات المضغة وله وجهان ممتلئان.
    info: الفأر الذهبي حيوان أليف شائع جدًا. يخزن الطعام في خديه، ويكون نشيطًا بشكل رئيسي خلال الليل، وهو يحب الركض في العجلات.
  pet.hedgehog:
    label: جراديف أفريقي
    summary: ثديٌ صغير ذو زوائد تشبه الإبر والقواقع التي تتجمع عند الخطر.
    info: يُربى الجَرذان الأفريقي الصغير كحيوان أليف شائع في جميع أنحاء العالم، ويحمل على ظهره بين خمسة آلاف إلى سبعة آلاف حافة فارغة مصنوعة من الكيراتين؛ وعندما يشعر بالخطر يتقلص ليكوّن كرة محكمة لا يمكن اختراقها.
  pet.hermit_crab:
    label: راك بري
    summary: حشرة صغيرة تسكن داخل القوقع المقرض، وتكون رفيقًا نادرًا للإنسان.
    info: الرخويات البرية هي حيوان لا يملك درعًا صلبًا خاصًّا به، بل يستخدم قواقع مرجانية فارغة لحماية جسمه الناعم من الخلف. عندما يتزايد الحجم، فإنه يبحث عن قوقعة أكبر. تُربى الركوات الصحراوية الجافة كحيوانات أليفة؛ فهي اجتماعية وتعيش في مجموعات.
  pet.iguana:
    label: إيقوانا
    summary: ثعبان خزامي ضخم موجود بالأمريكتين المداريتين ويتم اقتناؤه كحيوان غريب الأطوار
    info: |-
      الإيغوانا الخضراء هي ثعبان كبير يعيش في أمريكا الجنوبية يصل طوله إلى مترين، وهو نباتي صارم؛ يحتاج الطعام النضروفي والإنارة بالأشعة فوق البنفسجية من نوع B عند الاحتفاظ به كحيوان أليف
      لديها عين ثانية على جبهتها تُسمى العين الجباعية وهي حساسة للضوء
      يمكن أن تصل لعمر أكثر من二十年 عندما تكون مرباة ولكن تحتاج بيئة ورعاية دقيقة
  pet.koi:
    label: كارب كوي
    summary: سمكة الزينة ذات الوان حيوية يتم رعايتها بالبحيرات المنزلية.
    info: |-
      الكابو كوي هو نوع زخرفي من سمكة الكارب العادية، تم تربيته في اليابان منذ القرن السابع عشر
      هناك أكثر من مائة صفة لونية؛ أغلى الأفراد يُباع بآلاف الدولارات
      يمكن أن يصل عمرها إلى ما فوق المئتين عامًا؛ أقدم فرد معروف كان اسمه هاناكو وعاش لمدة ٢٢٦ سنة
  pet.leopard_gecko:
    label: جيكو فهدي
    summary: حيوان غекون صغير ذو نقاط ونوم ليلي، هو حيوان المربين البداية المثالي.
    info: |-
      جيكو الفهد يعيش في المناطق الصحراوية من باكستان وأفغانستان
      على عكس أغلب الجيكونات، فإنه لا يتمتع بشفط على الأصابع؛ وبالتالي فهو غير قادر على التسلق على الزجاج
      له جفنان متحركان وهو أمر نادر بين الجيكونات
  pet.lovebird:
    label: إيغوبرونيسي
    summary: طائر الببغاء الصغير المُكوّن لرومانسيا قوي.
    info: أغابورنيس أو ببغاء الحب هو طائر صغير أفريقاني مشهور بصلاته العاطفية القوية بين الأزواج، حيث يطعم كل من الزوجين الآخر ويحصنه ويتشارك معه وقتًا طويلًا؛ ومن هنا جاء اسم 'الحب'. هناك تسع أنواع مميزة باللون والانتشار الجغرافي.
  pet.mandarin_fish:
    label: مُنْدارِينَّ
    summary: أفضل الأسماك البحرية بلون زاهي مع نقش مشوَّق.
    info: المندرينكا المذهلة هي سمكة بحرية صغيرة تعيش في الشعاب المرجانية للهند والแปسيفيك وهي واحدة من أكثر الكائنات حيوية لونًا في مملكتها الحيوان، وتحتوي على خلايا خاصة تحتوي صبغة وأيضًا مواد فلورسنتية بدلاً عن الزعانف؛ وتتغذى فقط على أطيان كائنية دقيقة نشطة ويصعب إبقاؤها في الأسر.
  pet.mini_pig:
    label: خنزير صغير
    summary: حيوان منزله بسيط جدًا يتم إبقاؤه كصديق.
    info: |-
      الخنازير الصغيرة أو الخنزيران الميني مايكرو هي سلالات صغيرة من خنزير المنزل تم تربيتها وتكاثرها لهذا الغرض
      إنهم ذكيون نظيفون ويتعلمون الحيل مثل الكلاب، كما يتجنبوا الشمس لأن لديهم غدد عرقية لذلك يستخدموا الطمي للحفاظ على درجة الحرارة المناسبة لهم
      كثيرًا ممن اشتروا هذه الكائنات كانوا في حيرة كبيرة عندما رأو أن أبعاد هذا الخنزير أكبر مما وعد به البائع
  pet.moon_jellyfish:
    label: جيلية قمرية
    summary: جلدية شفافة مضيئة حيوائيًا يتم رعايتها في أحواض مائية متخصصة.
    info: '{"hint":"الجelly صغيرة المضيئة بيولوجياً تُحتفَظ بها في أحواض مخصصة (أوريلا أوريتا)،" "info": "إن الجيلية القمرية هي واحدة من أنواع الجيلي الأكثر شيوعًا وهي نسبيًا آمنة للإنسان.\n إنها شبه ش透يّة ونرى عبرها أربع غدد جنسيّة دائرية. \n كان التربيط داخل الأحواض صعب للغاية؛ اليوم هناك خزانات مستديرة خاصة (كرايسل). \n يعيش ما بين ١٢ إلى ١٨ شهر."}'
  pet.mouse:
    label: فَارٌ أبْيَض
    summary: فرس خليط مُعَوِّض يُستخدم إما كحيوان أليف أو للاختبار في المعامل.
    info: الفأر الأبيض هو نوع من الفئران المنزلية المدربة كحيوانات تجريب وديكور منزلية، وهو ذكي ويتعلم بسرعة المسارات والمهام المختلفة.
  pet.mynah_bird:
    label: '"مُرَّغا"'
    summary: طير أسيوي قادر على التحدث بنبرة صوت بشرية استثنائية.
    info: '{"hint":"طائر من عائلة الغربان يتحدث ومن آسيا (Gracula religiosa)","info":"المرغوب الجبلي هو طائر من فصيلة الشقاقات معروفة بإحدى أفضل مهارات الكلام بين جميع الطيور.\napيدو تكرار نغمات وأدوار وintonation الصوت البشرية بدقة عالية جداً.\npوجدها في جنوب شرق آسيا وإندونيسيا.\ndخل الأسر يمكن أن يتعلم المئات من الكلمات والعبارات."}'
  pet.oscar_fish:
    label: '"الأسكار"'
    summary: سمكة سيكليدة أسطورية الذكاء من أمريكيا الجنوبية تستجيب لملاكيه.
    info: '{"hint":"سمكة مُذكّية ذكية كبيرة من أمريكا الجنوبية (Astronotus ocellatus)","info":"الأسكار البافى هو نوع كبير جداً من سمكات السيلكليد الأمازونية المعروفة بذكائها وقدرته على التعرف إلى صاحبه\nتحتاج إلى حوضٍ واسع جدًا يزيد عن 200 لتر، مع تغذيتها بشكل منتظم بأطعمة طازجة أو مجمدة\nيمكن أن يصل طولها لأكثر من 35 سنتيميتر وتصل عيشهَا حتى الـ15 عاماً\نأحيان ما تتصرف كأنها كلب أكثر مما هي سمكة؛ فتسير نحو الزجاج عندما يتقرَّب المالك."}'
  pet.parrot:
    label: صقري
    summary: طائر لونه ملون ويستطيع تقليد صوت الإنسان.
    info: الصقر الأزرق هو أكثر أنواع الصقور شيوعًا التي تُربى كحيوان أليف. إنه ذكي واجتماعي ويمكنه التقليد أصوات وحتى الكلمات.
  pet.prairie_dog:
    label: صاعوق بري
    summary: حيوان كاسر نفق جماعي موجود بالبراري الأمريكية.
    info: الصاعوق البري حيوان اجتماعي يعيش في أمريكا الشمالية ويوجد داخل مستعمرات تحت الأرض واسعة النطاق، حيث يستخدم نظامًا معقد من الأصوات للتواصل والذي يعتبر العلماء أنه أعقد لغة حيوانية بعد اللغة البشرية. تُسمى هذه الحيوانات 'dogs' بسبب صوتها القريب من الهمس عند التحذير من المفترسين.
  pet.quail_pet:
    label: طائر الكركي الأليف
    summary: طير صغير غير متعب يتم رعايته كحيوان أليف داخلي.
    info: |-
      الكركديه اليابانية هي طائر صغير يُربى إما للبيض أو كحيوان أليف.
      tتزن فقط 100 غرام وهي أقل أنواع الطيور المرباة حجمًا.
       الذكور تصدر نقيقها بصوت عالي مثل 'بي بي بيت'، بينما الإناث تنقرق بهدوء
      إنهم هادئون ومناسبين حتى في الشقق.
  pet.rabbit:
    label: أرنب
    summary: حيوان مُحْفَظ يملكون أذنين طويلتين.
    info: الأرنب المنزلي هو حيوان أليف شائع يتميز بفراء ناعم وأذن طويلة مميزة. يتغذى على العشب، الخضروات الطازجة والعلف.
  pet.rat:
    label: جرذاً منزلًا
    summary: ثعبنة ذكية ومخلصة جدًا وأنيقة.
    info: '{"hint":" Rat أليف مُدَرْبٌ ذكي ومحفوف يحتفظ به كحيوان أليفة (Rattus نورفيغيكوس)","info": "الجرذان المنزلية هي واحدة من أكثر الثدييات الذكاء؛ يمكنها تعلّم الرجوع إلى الاسم والقيام بمهام معقدة.<br>إنها ذات طبيعة اجتماعية قوية وتربط علاقات متينة بالبشر وبأمثالها.<br>تعيش ما بين عامين أو ثلاث سنوات، وهي في آسيا رمز للذكاء والمزدهرة الاقتصادية (التقويم الصيني).<br>تساعد على الكشف عن الألغام الأرضية بسبب حاسة الشم القوية."}'
  pet.red_eared_slider:
    label: السمكة النجمية
    summary: أحد أنواع السلاحف العشبية المنزلية شائعة مع وجود خطوط حمراء خلف الأذنين.
    info: السمكة النجمية هي حيوان أصلي من أمريكا الشمالية وهي أكثر الزواحف انتشاراً في الأسر على مستوى العالم، ويعتبر الشريط الاحمر خلف الاذن مميزتها التي تميزها عن الانواع المشابهة لها، تحتاج إلى جزء مائي وأرضي للاستلقاء تحت المصابيح فوق البنفسجية.
  pet.sea_horse_pet:
    label: ' حصان البحر داخل الأكواريوم'
    summary: حصان البحر المعروض في أكواريوم مخصص يُعتبر كائناً نادر الجمال وجذاب.
    info: |-
      الخروف البحري هو أحد أكثر الكائنات البحرية صعوبة في تربيتها بالأسر؛ يتطلب طعامًا حيًّا مثل Artemia وMisids، بالإضافة إلى بيئة هادئة.
      The male carries young ones inside his abdominal pouch and gives birth to hundreds at once.
      They live together for life forming pairs that remain faithful forever.
      Their population is critically endangered due to illegal collection used by traditional medicine.
  pet.sugar_glider:
    label: كوالو طائر
    summary: ثديٍّ أوروبي نادر يتسلل عبر الشجر بواسطة غطاء ليفاني على جسمه.
    info: الكوالا الطائر هو حيوان أسترالي صغير ينتمي إلى فصيلة الثدييات المحمية، ويستطيع التزلج في الهواء بفضل الغشاء الليفاني الذي تمتد بين ذراعيه وساقيه. لديه عيون كبيرة مخصصة للرؤية الليلية وهو كائن اجتماعي للغاية وقد تعانون من الوحدة إذا لم يكن مع الآخرين. يستخدم الأصوات مثل النباح والهمس والعويل للتواصل.
  pet.tarantula:
    label: Ptakoyps
    summary: الصراصير الكبيرة والشعرية هي أصدقاء الأشخاص الجريء.
    info: |2-
       Ptakopyth rosa هو نوع شائع من الصرصوريات المثيرة للاهتمام للمبتدئين نظرًا لنوعيته الهادئة
      أكبر أنواعها، صرصار الغوليث البودياني، أكبر حشرة في العالم بطول ساق يزيد عن ٣٠ سم
      سمّه مماثل للنحل ولا يعتبر خطير على الإنسان السليم الناضج
  pet.tortoise_pet:
    label: السلحفاة البرية
    summary: تعتبر السلحفاة البرية حيوانًا طويل العمر ومناسبة ليكون حيّواً نافعًا مدى الحياة.
    info: تُعتبر أنواع هرمان من السلاحف الصغيرة الجنوبية الأوروبية شائعة كحيوانات أليفة، ويمكنها العيش لأكثر من مئة عام؛ مما يعني أنها تعيش لسنوات بعد وفاة صاحبها. كما تستأنس هذه السلاحف في الشتواء وتتوقف عملية التمثيل الغذائي فيها تقريبًا.
  pet.turtle:
    label: ' черเตب '
    summary: ' حيوان بطيء مع قشرة صلبة.'
    info: ' تُعتبر السلاحف الحمراء من الأنواع الشائعة كحيوانات أليفة. تعيش في أحواض مائية متصلة بالأرض، حيث تتعرض للحرارة تحت المصباح فوق البنفسجي.'
