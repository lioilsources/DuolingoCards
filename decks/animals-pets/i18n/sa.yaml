lang: sa
pivot: false
title: पालतू पशु
cards:
  pet.cat:
    label: कोच्छ
    summary: मृदु खालयुक्त स्वतंत्र पाळीव पशु।
    info: फेलिस कैटस हे एक परिवार में पाला जाने वाला पाळीव पशु है। यह अपनी चतुराई, स्वच्छता और स्वतंत्र प्रकृति के लिए प्रसिद्ध है।
  pet.dog:
    label: कुत्ता
    summary: मानव के सच्चा घरेलू पालतू जानवर।
    info: गृहीत कुत्ता मनुष्यों द्वारा पाला गया एक शिकारी है, और इसे 'मानव का सबले प्रिय' कहा जाता है। अधिक से अधिक 400 ब्रीड हैं और यह मनुष्यों के सबले प्रिय के रूप में जाना जाता है।
  pet.goldfish:
    label: जलदंती
    summary: सुनामय रंग का मछली जो एक्वेरियम में पाला गया है।
    info: जलदंती सभी दुनिया में एक्वेरियम में पाले गए कपड़ के घरेलू नस्ल है। इसके सौ भिन्न रंगों और प्रकार के पटल अस्तित्व में हैं।
  pet.guinea_pig:
    label: मोर्चे
    summary: छोटा बालूदार हिमलनका प्रसिद्ध मज़्बूत संगठन।
    info: घरेलु मोर्चे एक जियो अमेरिकी सामाजिक हिमलन है। वह कणखर आवाज़ निकालता है, दयालु है और मनुष्य के साथ समय बिताना पसंद करता है।
  pet.hamster:
    label: क्रीचेक
    summary: एक छोटा सुंदर हड्डीवला पशु जिसमें मौखिक क्षेत्र भरे होते हैं।
    info: गोल्डन हमस्टर एक लोकप्रिय पालतू जानवर है। वह अपने चेहरे में खाद्य पदार्थों की आपूर्ति छिपाता है, रात्रि में सबसे अधिक सक्रिय होता है और घूमने के लिए गोल चक्र पसंद करता है।
  pet.parrot:
    label: पापुशेक
    summary: रंगबिरंगा पक्षी जो मनुष्य के स्वर के अनुकरण कर सकता है।
    info: अंडलका वल्नकोवांना पेटसम बच्चा के तौर पर पाले गए पापुशेक के सबसे आम प्रजाति हवय। इह बुद्धिमान्, सामाजिक और ध्वनियों एवं शब्दों के अनुकरण कर सकता हवय।
  pet.rabbit:
    label: कर्कटितोष
    summary: चमड़ा वाला पालतू सस्तन प्राणी।
    info: गृहयुक्त कर्कटितोष एक लोकप्रिय पालतू जानवर है जिसमें मुलायम बाल होते हैं और चिह्नित लंबे कान होते हैं। इसका भोजन घास, सब्जियाँ और ताजा घास होता है।
  pet.turtle:
    label: शिलीकः
    summary: मन्दगति शरीरस्य कठोरचरणं प्राणिन्।
    info: एषा रक्तवदना चिकेटा सुलभा अपि घरे धूमकेटा मन्दगति पालिता भवति। एषा जलज उबयधर्मा आहारः गृहे विहरति जहाँ ऊर्जा बल्ब द्वारा तापन भवति।
