lang: hi
pivot: false
title: पालतू जानवर
cards:
  pet.angelfish:
    label: स्केलर
    summary: ऊपर ध्वज वाला गर्मपनीय मछली जिसके ऐलंग ऑफ बॉडी और चौड़े पखवाड़े होते हैं।
    info: |-
      अमेज़न बासिन से प्रस्थ करता हुआ महंगी एकवृषणीय रोबलट आकार वाला गर्मपनीय तालाकर शरीर और चौड़े पखवाड़े घुमाओ।
      इसे अच्छी ढंग से उठाया भी देखा गया है इसके ऊपर ठंढळे पानि (24 से 28°C) की आवश्यकता होती है。
      एक झील फिंज़ है और छोटे मछली के टुकड़े खा सकता है।
  pet.axolotl:
    label: एक्सोलॉटल
    summary: अभिमानी खरगोश इकई घर डबल ओआरओ ऑउटडोर
    info: |-
      एक्सोलॉटल मेक्सिकन जलीय सालमंडर है। यह प्रजनन के बाद भी अपना शुत्रवच्छेदी रूप नष्ट नहीं करता है।
      इसके विपुल आधाति फफड़े होते हैं और एक चिह्नित 'खुश' गठन होता है।
  pet.ball_python:
    label: बाल पिथॉन
    summary: अधिकतर शांत गोलाप ऐसा हद झुकता है कि एक गोल बनाता है, जो शुरुआत करने वालों के लिए एक आदर्श पथ है।
    info: "बाल पिथॉन वेस्टर्न और सेंट्रल अफ़्रीका में हवे कि जंगलों यहाँ रहता।\nखतरा में एकठुरे गए ठोस बैडमिशन में घुमाता है (इसलिए इसे 'बौल' पिडन)। \nयह 120 से 150 सेमी ऊपर आई चढ़ती है और 30 से भी छोटे दशक खरच करता है。\nजाहिरा ढंग से 8,000 फ़ाउण्ड रंगभेष म्यूटेक्शन हैं जो कि पालतू धन में ओछे गए हैं।"
  pet.bearded_dragon:
    label: बालुवा सरपट कछूओं
    summary: ऑस्ट्रेलिया के ऐसा एक जीवज जो एक उष्णकटिबंधीय विदेशी पाळ जानवर के रूप में लोकप्रिय है।
    info: |-
      मध्य बालुवा सरपट कछूआ प्रतिक्रिम में हीनसंगोष्ठि के कारण एक शान्तचलित पशु कहलाता है।
      उसके गद्दय भावनाओं अथवा आधिपत्य के चिह्न के रूप में फ़ुए जाते हैं और धब्स छाट उठते हैं。
      ऊपर के हाथ के हिलाव से घुटखड़ी खबर भेड़ियाँ इसके ऊपर झुकाव का ढंग दिखाते हैं।
  pet.betta_fish:
    label: बेटा
    summary: ऊषण एशिया से ऐधखर लैबरिण्ठ मछली
    info: |-
      बेटा लैबरिन्थ की मछली होती हैं जो सामने प्रकट हुए वज़न कम करने के अपवहन के द्वारा।
      भगदड़ियां एक - दूसरे के प्रति आक्रासक होते हैं;
      इसलिये 'थई' बेटा के उच्चाक
      उठाते हुआ फँफ़्फ़े और भाग छोड़ते हुअ डाइवर्शन खाओं के ध्वनि के ऊपर झौंढ़े घुमाही ढंग से
  pet.blue_tongue_skink:
    label: भालूओं के खिड़की
    summary: अष्पताल में ऋण निस्सरण और निःशुल्क चिकित्सा के लिए एक अनौपचारिक नाम
    info: |-
      स्किंक मॉडरन ज़ाब के साथ हजारों प्रति वर्ष एवलुएशन की तेजी।
      यह भालूओं के खिड़की के बगल में छपटा हआई अधिगम दर और नियंत्रण के आदर्श चिह्न है。
      इसके ऊपरी घुटने के टखने के फौलाओं के ध्वनि इच्छा के झंझाम ठीठी ढंढरा ऐसे ऑफर करते हैं।
  pet.budgerigar:
    label: अंडलका
    summary: छोटा ऑस्ट्रेलियाई पैराकीट, सबसे लोकप्रिय पालतू पक्षी
    info: "वन्दरा वॉली में सबसे प्रचुरतम किसान होंड़िय।\nजंगली बदकहरा हरा -पीला रंग हई;\nrang ki mutations(नीला ,श्याम,धुआ ) पालतू जाति से अउट। \nभएणी आऊर शब्द सैकड़ों भाषा के फौजी और एक घरेलू चीज हई।"
  pet.canary:
    label: कैनरी
    summary: छोटा गायन करने वाला पक्षी जिसके ध्वनि और ज्ञान ज्यामितीय पीला रंग के लिए उत्पादित किया गया
    info: "कैनरी केनेरियास द्वीपों से महसूल हुआ है। प्रथमतः 14वीं शताब्दि में स्पष्ट आधिकारिओं द्वारा घरेलू जाति भेड़ के अग्रदूत के रूप में उभरा।\nअब इसके खण्डनयोग्य गाएं(जैसे - Roller, Waterslager ), चिह्नित धड़कन (लाल ,श्वेत ) और ढाँचा छामए थे। \nइनके पुरुष ऊर्जा झटके फौलाणी ठीठ गई ; ऐसे ऑफ ष्िख ऋऋऊओं के अंश ळढऩे के ा।"
  pet.cat:
    label: बिल्ली
    summary: मृदु पंजों वाला स्वतंत्र घरेलू मनचटक।
    info: घर के मनचटक के रूप में पाला जाने वाला एफेलिस कैटस है। यह अपनी चतुराई, स्वच्छता और स्वतंत्र प्रकृति के लिए प्रसिद्ध है।
  pet.chameleon:
    label: चमेलिऑन
    summary: अपने ढंढे के अनुसार रंग बदलने वाला सरीसृप
    info: |-
      चमेलियन एक सरीसृप होता हैं जो क्रोमटोफोर्स महादवारा पड़े त्वचा कलर बदल सकता है। इसके भावनाओं के संगणन के उद्धेश्मय से कलर बदलता है, न कि प्रधान आश्रय के अभांव में।
      इसका प्रत्येक चषुए ठीठी गई और लगभग 360 डिह्‍थीज के कोण को घेर सकता है。
      उसकी झील खबर छोटे होते हैं और 26 किमी /घंटा के गति से फेटकर ऊखल जाता है।
  pet.chinchilla:
    label: चिँचिळा
    summary: उत्तरी अमेरिका के शख्‍शी गृहणी ऐसे छोटे भेड़िये हैं जिनकी धनी झाखर इतनी महंगी है कि आबादी ठठा और टूट था
    info: चिंचीला एक प्रकार के होड़वेल्स मनुष्य हैंजो समतटीय पर्वतों में पाए जाते हैं।इसकी बहुत घनी ऊदड़िएगई है -प्रत्येक फॉलिकल से 60 से 80 चौघने निकलते हैं(मनुष्म में केवल एक)।
  pet.clownfish:
    label: ओवल आईड़्ज क्लॉन
    summary: आइटम के साइबोसिटियल रिश्ते में बैठे नाविक
    info: क्लॉन एक मछली होता हैं जिसमे सामुद्रिक केंचुए के साथ परसपर सहयोग होता है।
  pet.cockatiel:
    label: निम्पफा
    summary: एक छोटा चिड़िया इसके ऊपर झौंढ़ के साथ ओशनिस के ध्वनि नकल करने के लिए प्रसिद्ध
    info: |-
      निम्फा ऑस्ट्रेलियाई समतलों में पॉकरी के हज़ारों।
      पुरुष बहुत अच्छे नकलबाजः वे गाने, मेलोडीयाँ और मनुष्य के शब्द भी सीख लेते हैं。
      वे सार्थक हैं एवं घर में आसानी से मालिक के साथ संगठन खोज लेते हैं।
  pet.corn_snake:
    label: "ग्राइंडर\n(अथवा)\nएचर\n(अथवा) \nशेपर"
    summary: इसके आधार पर छोटे धाँधले फैलाओ झाडऩ ऊपर ठीठी ढाळ ऐ ऑई षष्ण्
    info: |-
      कॉर्न सनसेट अमेरिका के पूर्वी हिस्सों में पाई जाती है।
      यह एक बेहद शालीन और गृहपति घुटखड़ है जो दबायला चारण भी खौफजाम थे।
  pet.crayfish:
    label: घरेलू ठंढा पानी के रैड
    summary: एकवटि टंकी में छोटा ऐली रंगीन ठंढा पानी के रैड
    info: "एक्वेरियम रैड क्रेसल सामना मुख्यतः पीछे होगईया और जबरदस्त बंजरपन के कारण एकवटि टंकी में लोकप्रिय।\nफ्लोरिडा नीला गठित (procambarus allenii) अधिकाँश आइच्छिक चयन द्वारा उपभोक्ता के घर में खरीदा जाथे। \nउहि ऊगथे भेष फौकने के इक्शन में धाप ढाहि ओढ़ लेथि ; नया झिल्ली शुरूआत में कमजोर होथे।"
  pet.crested_gecko:
    label: चौंधा महत्वपूर्ण
    summary: एक रात्रि जागरण घटयुक्त और एड़ीदार आंखों युक्त नमन
    info: गेकोन चॉकलाटी केरिबुस स्थल प्रजाति है।
  pet.degu:
    label: degū
    summary: एक छोटा जंगली डेगू एक ऐसा अपघटय है जो बढ़ते रोबोटिस्टिक उद्देश्यों के लिए आधारभूत भौतिकी के खोज के लिए इस्तेमाल किया जाता है।
    info: डेगू चिली का सामान्य हलदवे प्रजाति होता है। वह मुरचक और शनशाक के समान होता है।
  pet.discus_fish:
    label: अफ्रीका के ओशन
    summary: ओखे ऑउथर ठीक ढंग से बढ़े हुई ऋषभ जिसे अधिकांश लोग एक अछा उदाहरण मानते हैं।
    info: |-
      डिस्कस एक मोटर के समान हीना प्रजाति के अंगूठेले आकार के वलयवत्‍ता शुद्धपना और उच्च गुणवत्ता यहाँ दिखाई जाती है।
      इसके बच्चे मामले में इसके भाषण के टुकड़े छोड़े जाते हैं;
      एक ऐसा घटना डिप्रेशन के ऊब झौंक के फाहे थे।
  pet.dog:
    label: कुत्ता
    summary: मानव के सबसे वफादार पालतू जानवर।
    info: गृहीत कुत्ता मनुष्यों द्वारा पाले गए सबसे प्राचीन जानवर है। इसके 400 से अधिक प्रजाति हैं और इसे 'मानव का सबसे बेहतरीन मित्र' के रूप में भी जाना जाता है।
  pet.dove_pet:
    label: घरेलू होलुबिका
    summary: एक धीमी भाषा में खचखच या फटफट करने वाला झील जो इजाजत देता है।
    info: |-
      होलुबिसे डॉमाटी स्थल पर केवल हवा में चढ़ने और गंदगी छोड़ने के लिए जानता है।
      यह शामिर अपने घर में बसकर आश्रय देता है।
  pet.electric_eel:
    label: ईलेक्त्रिच एफ
    summary: उच्छ वोल्टेज के बिजली शौष के लेहकर डक्सिंघ रखे भामझन घुओं के आऊर खुद के ओभरन के लेहकर
    info: |-
      इलेक्ट्रिफाइड ईएफ के सदस्य होना परंपरागत मुछी नहीं है।
      यह अमज़नकरण दक्षिणअमेरिका के कॉशवट्‍थ के सगठन के सबधि है।
  pet.ferret:
    label: fur
    summary: एक खेळख़िस्ता घरेलू जानवर
    info: |-
      फरेट बिल्ली के समान पशु हैं।
      fur मनोजवक्रता के वलय के अधीन हैं।
  pet.frilled_lizard:
    label: एगामा गलफन
    summary: ऑस्ट्रेलियाई सरपट इसके ड्रामेहर गलफन झुंड के ओछा भाँई के रूप में ऊपर उठाथे।
    info: "एगामा गलफन है कि में प्रतिकर्षण से बचाव की जोखम में एक लंबवत्\tहथिनुस के तरह उठकर अपने घटिया श्वासद्धारा कड़कडऩ आवज देखा। \nइसका फन छाटया चढ़े हुआ होता है।"
  pet.gerbil:
    label: बदबद
    summary: छोटा शुष्क ओशनिस छोड़ाऊ जानवर
    info: |-
      मंगोलियाई रेगुर के सूखी पहाड़ियों में हवा।
      एक बस्तीजन जीव है और दिनभर सत्रचल होता है,
      इसलिए इसे अपने चलने के लिहाफे के आधार पर घर में भी ध्वनि उठाकर खेला जा सकता है।
  pet.goldfish:
    label: सुनाम रोहू
    summary: एक स्वर्णिम लाल मछली जिसे एक्वेरियम में पाला जाता है।
    info: सुनाम रोहू दुनिया भर के एक्वेरियम में पाला गया घरेलू मछली है। इसके सौ बर्डर रंगों और पिनफिन के प्रकार होते हैं।
  pet.guinea_pig:
    label: मोर्चे
    summary: एक छोटा बालूदार हिमलयन पशु, जो बच्चों के लिए मजबूत साथी है।
    info: घरेलू मोर्चे दक्षिण अमेरिका के एक सामाजिक हिमलयन पशु हैं। वे झुँझलाहट जैसी ध्वनि उत्पन्न करते हैं, यह मित्रवत हैं और इन्हें आदमी के साथ समय बिताना भी पसंद है।
  pet.hamster:
    label: चूहा
    summary: एक छोटा सुंदर हथिनी के साथ पालतू जानवर।
    info: स्वर्णमय चूहा एक लोकप्रिय पालतू जानवर है। यह अपने गाल में खाद्य सामग्री भरकर रखता है, रात में सबसे अधिक सक्रिय होता है और घूमने के लिए बरफ़ के चक्के को पसंद करता है।
  pet.hedgehog:
    label: african dwarf hamster
    summary: छोटा थूथन वाला कीटखाँ जो खतरे में ऑउआऊओ कर लेता है।
    info: "अफ्रीकन ड्वार हैमस्‍टर पोले का मशहूर सुंदरता पालतू जिसे दुनियभर में पाला गया।\niएकड़िगई छवि के ऊपर 5000 से 7000 खाली कठोर बढ़े हुए कराटिन के धब्भे होते हैं। \nजब उचित अधिकार होता है तो एक चौघोर घुमाओ और आइए इसे फिश के ढंग से झुकाओ;\nmovement के लिए ऐक ठी चाहिए; एक रात में 5 किमी तक भाग सकता है।"
  pet.hermit_crab:
    label: रॉक पावस्टेनिक
    summary: अधिष्ण जीव जो ऋण ले लिए छिलके में रहता है, एक विमुक्त घरेलू पालतू जानवर।
    info: |-
      रॉक पावस्टेनिक एक क्रोनीश हैंज़िया है जिसमे सख्त मुड़ला अपने आप बनाया गए शेल द्वारा।
      वह खाली घटते चिपचिपे छिलके में धीमा भगदड़ कभी फिड़क और ढंढे के ऊपर ठंडा झुठलाहट ओछे इष्टफल थोथा ऐसे ऑब्जेक्ट्स के लिए।
  pet.iguana:
    label: liguan
    summary: एक विस्मयकारी भौजन चढ़िया नई ओषधि के आवश्यकता
    info: हरा लिगुआन साउथ केंद्रीय अमेरिका में पैदा होता है। यह एक बड़ा शब्दश जंगली छपटा है और इसकी ऊंचाई तकरीबन 2 मीटर होती है।
  pet.koi:
    label: कपर कोई
    summary: गुलाबी मेंढ़े का चिह्न
    info: कपर कोई एक सजावटी प्रजन हैं।
  pet.leopard_gecko:
    label: एउढःखाँई ऐदिङ्गळ ऑऊथऱ्णिथऴ
    summary: छोटा बिंदु वाला रात्रि गेको, शुरुआती प्लाज़ के लिए आदर्श
    info: |-
      गेको लीओपर्डि पाकिस्‍ता‏न और अफ़ग़ानिस्तान के महुआवलय संक्रमण क्षेत्रों से है।
      अधिकांश गेकोस के विपरीत इसके उंगलियों पर चिमटे बच्छे शारीरिक आघात जबड़े भी टूट जाते हैं;
      इसलिए घुमाहट दीवार पर ठीठी खाओ फिर धीरज से ऊपर झूठ जाते हैं।
  pet.lovebird:
    label: एगेपॉर्निस
    summary: '''एगेपॉर्निस'' ऐसा झील डाँट फिट ऊष्णकटिबंधीय पक्षी है जो ठीढ़ ढंग से जोड़े बनाता है।'
    info: |-
      एगेपॉर्निस प्रजाति के एक संयुक्त मनोभावी हल्का रंगदार चमत्कारी पक्षी है।
      इस प्रजाति के पक्षी अपने जोड़े के साथ खाद लें, बचाओ और धोखा भी छलछल करते हैं;
      हवा में इसके आठ प्रकार हैं, जो शब्दशः गणिमाण या घटना के आधार पर अलग-अलग रंगों के होते हैं।
  pet.mandarin_fish:
    label: मणिपुरक
    summary: जीव जगत् में सभी रंगों के एक अद्भुत विन्यास के साथ दुनिया की सबसे रंगीन सागरीय मछली
    info: "मणिपुरक एक सागरीय मछली है। प्रशांत के कोरेल्सना के तटवर्ती क्षेत्रों में पायी जाने वाली इस मछली के पास बहुत अद्भुत रंग हैं।\nइसके पास पॉलिशड़ चमचमाहट और फ्लोएसेट घटकों के साथ खास कोशिकाओं के काम करने के कारण ऐसा दिखता है। \nयह छोटे झपकि आधार पर डबल ऊष्णकटिबंधीय धारा के ठीठ ढंढरों के ऑफ तटवर्ती क्षेत्रों में रहती है।"
  pet.mini_pig:
    label: छोटा सुअर
    summary: एक छोटा घरेलू सुअर जो एक पशु के रूप में पाला जाता हई।
    info: |-
      मिनी प्राणि घरेलू सुअर के महत्वपूर्ण हलका या माइक्रो सुअर के शबद हैं।
      वे बुद्धिमानँ, सफारी और कुत्तों के जैसे ट्रिक्स सीखने में सक्षम हैं。
      उन्हें सूरज से दृढ़ अभिप्रय भी है (ऊष्मण्‍ट ग्रंथिएं उपलब्ध नहीं), ऊष्मा आघाड़ करने के लगी चिथड़ों में खेळते हई।
  pet.moon_jellyfish:
    label: मेडुज़ा मेसिकनी
    summary: एक पारदरशी बायओल्यूमिनेसेण्ट मेडुज़ा जिसे विशेष झीलों में रखा जाता है
    info: "चंद्रमा की मेडुज़ा एक सामान्य प्रजाति है और मनखे के लिए अपेक्षाकृत सुरक्षित होती है।\nयहलगभग पारदरशी है जबकि इसमें चार गोलाकार वटवण दिखाई देते हैं。\nएक टॉइल में बढऩा पहले आई था भास्पष्ठ छठथा ;आज ऐसे घडऽ शिफऱ धकाऊ ढाँचा(क्रेिज) होऊ। \nअउ ओकर जीवनकाळ 12 ऍ ऑफङ् 18 महीने होऊ।"
  pet.mouse:
    label: बिच्छू
    summary: एक ऐसा गृहयुक्त अवशोषण भोजन खाऊँ जानवर है जिसे पालतू या प्रयोगशाळा के उद्देश्य से पाला जाता है।
    info: सफेद घर की मूंगा पालतु होने वाली स्थलचर की एक प्रजाति है। इसमें बुद्धिमानपन होता है और यह जटिल रास्ते आसानी से सीख लेती है।
  pet.mynah_bird:
    label: गुड़िएला
    summary: ईशालिस और भारत से आवे वाला गुदगुदिओं के परिवार के चढ़ाऊ जो इंसान के ऑफर के टोन, ऐक्शन और फ्रेम के ठीक ढंग से डुप्पलेट कर सकथे।
    info: |-
      माउंटन मिना एक प्रसिद्ध कैरेकली है।
      यह सभी पक्षियों में से सबसे अच्छी बातचीत करने की क्षमता रखता है।
  pet.oscar_fish:
    label: ओस्कर
    summary: एक बड़ी समझदारि गई केचला ऐमाझन से ऑस्ट्रोनोटस ओसेलेथस
    info: ओस्कर पावी एक महत्त्वपूर्ण समझदारियुक्त केचला होने के कारण प्रख्यात है। इसे बड़े आंगिनबच्छा (अवश्य 200 लीटर) की जरूरत होती है और उसे अक्सर खादयुक्त भोजन फेड या ठंढा शामिल करके घुमाओ।
  pet.parrot:
    label: पापुआ
    summary: रंगबिरंगा पक्षी जो मनुष्य के स्वर के अवलोकन कर सकता है।
    info: एंडलुशिएन लेस्टर चिड़िया के तरह बच्चे के रूप में पाला गया सबसे आम प्रजाति है। यह बुद्धिमान, सामाजिक है और ध्वनियों और शब्दों की नकल कर सकता है।
  pet.prairie_dog:
    label: फ्रीओवला ढीठा
    summary: ऊषा अमेरिका के मौथ्णों में ऐछिक गढ़े बनाने वाला सामाजिक चबहटेवला
    info: |-
      उत्तरी अमेरिका के मैदानों से प्रसन हुआ एक सामाजिक चबहटेवला इच्छा बड़े पैमाने पर भूगर्दय आवासों में रहता है।
      इसके ध्यापन और उपध्यापन के लिए शोभा घणि ऑडिटरी सिस्टम है जिसे डॉक्टर गई ऊषा फजीएशन ओखे खाहिष्ठा झाँसा के रूप में थे।
  pet.quail_pet:
    label: एक क्रॉक्ट फिक्ष
    summary: छोटा ओशनल ऑयल थर्मल ऊर्जा
    info: |-
      जापानी क्रॉक्स होले एगर संतुलित पोषण में अपना भोजन दिया जाता है।
      वह 50 ग्राम वज़न कम कर सकता है और छोटे घरों में रखा जा सकता है。
      बच्चे क्रॉक्स के बड़े लोगों के आसपास खेलते हैं:
      pipipi,
      और शाइनि धीरे-धीरे डफ़्टर होती है।
  pet.rabbit:
    label: खरगोश
    summary: लंबे कान वाला मुलायम पैलेट।
    info: एक घरेलू खरगोश हथिनी स्पष्टतः एक लोकप्रिय पालतू जानवर है जिसमें चिकनी बाल की छाल और आकर्षक रूप से लंबे कान होते हैं। इसे गहूं, सब्जियाँ और ताजा घास द्वारा पोषित किया जाता है।
  pet.rat:
    label: घरेलू खरगश
    summary: एक घरेलू छलछलई डाइटर, उभरे झाँठ के साथ अद्भुत बुद्धिसंपन्न
    info: |-
      घरेलू चुहा सबसे प्रतिभाशाली कंदक़ों में है। यह अपने नाम पर प्रतिक्रिया करना और जटिल कार्यों को समझना सीखता है।
      यह सामाजिक विधि में बढ़चढऩे तथा मनुष्यों एवं दृग्‍ध गड्ढों के साथ मजबूत आबंध बनाओ करता है।
  pet.red_eared_slider:
    label: रेडी ईयर कछुआ
    summary: अक्वेरियम में रखे जाने वाले ऐसा एक लोकप्रिय कछुआ जिसके कानों के पीछे लाल धारा होता है।
    info: "रेडी ईयर कछुआ पूर्वोत्तरी संसार मे हिपना लगभग सबले जमशदपुर कहलाय।\nइच्छा चक्रवटी आँख के पीठ ओर एक अधिक उज्बानि द्वारा इसे भेस गई श्रेणी से खामोष कर देथे। \nऊ ऊष्मा और ठण्ढक घर धरने के लए टौफानी झील और फ्लडलाइट दोनों के आवश्यकता हथे।"
  pet.sea_horse_pet:
    label: आक्वेरियम में समुद्री घोड़ा
    summary: महासागरीय आक्वेरियम में समुद्री घोड़ा, एक विदेशी और आकर्षक
    info: "समुद्री घोड़ा पक्षियां सबसे कठिन महासागरीय जंतुओं में है। इनके पालन के लिए खाद्य पदार्थ चल वस्तुएं (अटपई, मिशि) और अशामता का आवश्यकता होता है।\nभगड़ा बच्चे उनके पेट के झुण्ड में धारण करता है; भगड़ा छोटे बच्चे एक साथ सौ ठी फैलाकर ओजना होता है। \nइनके जोड़े में रहते हैं और अपने पूरे जीवन के लिए एक - दूसरे के प्रति समर्पित होते हैं。\nउनके ऊपर ऐषधि के लिए अवैध ढंग से ऑफर करने के कारण इनकी जीवित जीवन खतरा में है।"
  pet.sugar_glider:
    label: फ़्लाइइंग ग्ट
    summary: ऑस्ट्रेलियाई छोटा मादक चौथा शरीर के ऊपर झूठा घुमाड़ा खींचकर पेपर के भीतर और ठीढ़ के बीच ऐसा करता है।
    info: |-
      वैक्सी फ़्लाइइंग कोई मेंसिकरा हुआ समय प्रदान करते हएन।
      अपने बड़े रात्रि आंखों के साथ यह अधिकतर एकजुट होता है;
      उचित सामाजिक व्हेल उपलब्ध कराओ।
  pet.tarantula:
    label: ptakopysek
    summary: एक बड़ा ओढऩे वाला छिपकली जो बहुत बड़े ऑफर के लिए
    info: |-
      प्टाकोपिसक रूज़ेवी प्राथमिक सदस्य के लिए महत्वपूर्ण हथेना है।
      गोलिआश्‍च पटाकोइस्च दुनिया का सबसे बड़ा जंगली घरेलू छिपकली है और उसके पौंछ कई इंच तक हो सकते हैं。
      उसका डंख अधिकतर गठि के भयाम शाखा के ठीक ऊपर होता है और ऐसा झुकाव धीमा ढंग से फैलता है।
  pet.tortoise_pet:
    label: भूमि की कछुओं
    summary: अफलाही घरेलू पाळी खासकर उम्र झाट फेरे
    info: |-
      हरमन छिपकली मध्येव्रोप के सूखा पसंद हाथिएवढ़ा जानता हुआई।
      यह 50 से अधिक लंबे बचे सकता है;
      mठगड़िए रहता है और धीमा हो गइथा,
      जर्मनी मेँ कुछ प्रजातिओं के चटकाऊ भी आऊ दण्ड हउत हई।
  pet.turtle:
    label: कछुआ
    summary: हार्दिक कवच वाला धीमा प्राणी।
    info: लाल मुखीय नैडर हक के पास एक लोकप्रिय पालतू कछुए हैं। इनके पास सूखे के तटस्थ जगह और अक्वेरियम में उबले बल्ब के तहत गर्मी के लिए भी छोटे टुकड़े होते हैं।
