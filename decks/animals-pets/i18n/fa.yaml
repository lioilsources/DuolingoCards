lang: fa
pivot: false
title: حیوانات خانگی
cards:
  pet.angelfish:
    label: اسكالر
    summary: ماهي استوائي ظريف با بدنه ديسي شكل و ريفرهاي تميز.
    info: '{"hint":"ماهی آکواریومی استوایی دارنده شکل تقریبی دیسک و بلند","info":"اسкалر امزونسکی، به خاطر ساختار مثلث‌شکله زیبا و پلاژهاي طولانی که مخصوص حرکت در هواست، یکی از معروفترین ماہیهای آکواریومی است.\nمنشا اصلی اون منطقۀ رودخانة جنگل بزرگ امزنوس است و نیاز به آب با دمای بالا(حدود ۲۴ الات ٢٨درجه)دارد\. \nاینو حشره‌خور است و قادر به غذا دادن به انواع مختلف ماهیچهای کوچک است.\nدر کشور ژاپن، اس칼رو عالیرجحان برای اولين نوع استوائى كه در سال ١٩٠٩ فراوردى شد.'
  pet.axolotl:
    label: اکسولوتل
    summary: ساخاترآبی اصلی مکزیک با تراشه هاست.
    info: اکسولوتل، سالاماندری آبزی اهل مکزیک است که به طور دائم شکل لارو خود را حفظ می‌کند و دچاه نمی‌شوند. دارد تراشه های برجسته و ظاهر مشخص با علامت خنده مثلثی. فقط در جدول زادگاه او در منطقهٔ هوشمیلو قرار داشته ولی الان تحت فشار انقراض قرار دارد.
  pet.ball_python:
    label: کرچه سلطنتی
    summary: خونسر حلقه‌دار بافت مشابه توپ برای تمام علاقمندان.
    info: کرچه سلطنتی از غرب و جنوب آفریقا مبدأ دارد، کجا در مناطق مرتعی و جنگل‌ها زندگی می‌کند. هنگام تهدید به شدت خود را توپ محکمی می‌بافد (ازاینجا نام بال پایتون). طولش بین ۱۲۰ الی ۱۵۰ سانتی‌مترو عمرش فراتر از ٣٠سال است.
  pet.bearded_dragon:
    label: درواز
    summary: سالمند هلندی معروف به عنوان چهره شناخته شده مرغابی.
    info: دراک با موی بلند متوسط از جمله پرطرفدارترین حشرات در محیط زنده است به دلیل خصوصیت آرامش بخش. موها را تورم و سایه انداخته که نمونه عاطفی یا هژمه‌گرانه است، و با حرکت بالانو برای فردی غیرمستقیم تعامل می‌نماید. تمام طبیعتخوار؛ شامل حشرات، سبزیجات و میوه.
  pet.betta_fish:
    label: بتا
    summary: درخت انبوه روزنه‌دار با منظرهٔ غربی.
    info: بُت‌ها ریابهای لابیرینتوس هستند که از طریق سازگار خاص هوادهنده و در مزارع برنج فلات تالاند زنده است. نرها به دلیل عصبانی بودن باشد، بنابراین اسم «ماچوکا» برایشان وجود دارد؛ شاخسارهای بلندتر و جذابتر آنها پس از بالشتنتنش قابل مشاهده است.
  pet.blue_tongue_skink:
    label: سکینک با زبان آبی
    summary: پستاندار استرالیایی با زبان واضحآ آبی که برای هراس دادن.
    info: سکینک با زبان آبی، پستاندار بزرگ استرالیایی‌ست که دارای زبان مشخصاً آبی رنگ می‌باشد و از طرفشان برای هدف قراردادن شوالیه‌ها به عنوان تهدید نمادین استفاده می‌شود؛ رنگ آبی جلوهٔ فروتنده‌است. حیات سالم خواص غیرتند، ضخیم و آرام‌تر در مقام ذهن مرغوب به وجود لذت می‌برد. عمرش حداقل۱۵تا۲۰سال و اندازه بلندی بالای چهل سانتی‌متراست.
  pet.budgerigar:
    label: پرنده
    summary: محصولات معروف و متداول در صفحهٔ وب شامل HTML، CSS و JavaScript.
    info: اندولکا ونلیافته شده پرندگان خانگی بسیار محبوب دنیاست، بعد از کاناره. انواع طبیعی آن سبز روشن به همراه رنگ‌های زرد وجود دارد؛ با تغذیه مناسب در محیط لازماتوری نمونه‌های جدیدتر مثل فراموشی قرمز، مشکی و غیره حلقهٔ عضویت برداشته است.
  pet.canary:
    label: کاناریس
    summary: ماهیچه صداخوش برای حرفه و طول عمر بلوند
    info: |-
      کاناریس از جنوب کانری و در قرن پانزدهم توسط فاتحین اسپانیایی دومستیک شدند
      با سلکت به انواع مختلفی مثل زمزمه‌زن، آبگیر، رنگی(قرمز،سفید)،شکل متفاوت ها تقسیم شدن
      مردانه با عبارتهای نغمه‌دار خوانده میشه؛ بخش‌های غنیمت دیگران رو یاد میگیرن
  pet.cat:
    label: ماکرو
    summary: حیوان خانگی مستقل با صفحات نرم.
    info: '{"info":"ماکرو سرخ که به عنوان حیوان خانگی پرورش داده می‌شود، از تیره ماکروبوم است و برای حرکت باهوشا و تمیز بودن معروف است."}'
  pet.chameleon:
    label: خرس ما
    summary: جوجه کوزمه با چشمان مستقل
    info: |-
      خرس‌ماهی کاموفلژ با توانایی عوض کردن رنگ پوست به وسیلهٔ خروشانها؛ این حشرات برای نماد دادن هوازدگی، ناهیداً مثل ماسکول فعال عمل می‌کند.
      oچشم جدا در حرکت است و قادر به روشن شدن تقریباً تمام جلوه‌های دورتر است.
      zبان بلونده بوده و سرعت آتش زدن آن حدود ۲۶ کیلومتر در ساعت است.
      درختان فقط زندگی می‌کنند و انگشتان قفلدارشان وجود دارد.
  pet.chinchilla:
    label: چِنشُلا
    summary: حشرخوار جنوب آمریکائی با ضخامت عالی موها.
    info: چنگولا حیوان هرزه از کوه‌های آند با پوست بسیار سفت است؛ در هر فولیکول، تا ۶۰ الی ۸۰ مو رشد می‌کند و فقط یک عدد برای انسان وجود دارد. بهترین شرایط حرارتی برای زندگی او بالاتر از ٢٥ درجه نمی‌باشد و خطر جوشیدن برایش مرگبار است.
  pet.clownfish:
    label: kloun occhato
    summary: ماهی نارنجی رنگی که درهمزیستی باسانسورهادریایی زندگیمیکند.
    info: کلائون چشمانه نوعی ماهی دریایی کوچک از منطقۀ اندوپاسifik است که با سانس‌دریاها به صورت همزیست زندگی می‌کنند.
  pet.cockatiel:
    label: نمف
    summary: پرندهٔ بالدار ماژولار اهلستان با ظاهر مشابه چمن، مورد علاقه به خواص غنی.
    info: نیمفا از پرندگان محبوب است که در مناطق خشک و جنگل‌ها آسسترالیا زندگی می‌کند، به طور برجسته‌ای قابل تقلید دارد؛ قادر است نغمه‌ها را با همان صداقت فراوان شعر سازد. این حشرات اجتماعی علاوه بر تماس عمومی، به عنتی معروف به مردم خود متصل می‌شوند.
  pet.corn_snake:
    label: عقاب کوکر
    summary: خزن صورتی-زرد بدونسم مناسب برای شروع.
    info: |-
      عقاب کوکریس از جنوب شرق آمریکا مبدأ دارد و در زمین‌های فراموششده و جنگل‌ها زندگی می‌کند.
      بدون سم است، خشن نیست؛ به راحتی عضوه بدن را مجروح نمی‌نموده بلکه مقاومند.
      احتمالاً اسم «کوکر» را براساس پارچهٔ سبز روغنی با حالت ذرت یا الگوی تیرهٔ معروف قفسهٔ شانه‌اش گرفته است.
      طول بالغ این موجودات حداقل ۱ متربه طول رسیده و عمر مناسبی همانطور که در محصوریت وجود دارد تقریباً ۲۰ سال دارد.
  pet.crayfish:
    label: راک اوبتلی
    summary: ماهیچه جذاب با فعالیت بالا، به خصوص در محیط هیدروپونیک دارند؛ نمونه معروف شامل «راک بلوفلوئور» است.
    info: '{"label":"رَک اُبْتِلی","summary":"نوع رَک کوچک و درخشان آب شیرین استفاده‌شونده برای مخزن زیستگاهی."}'
  pet.crested_gecko:
    label: گکون تاج‌دار
    summary: گکون شب‌زنده با موهاي بلند مثل تاج روی سرش.
    info: گکون تاج‌دار از نو کالدونیا مبدأ دارد و فرض بر آن بوده است که منقرض شده باشد، ولی در سال ۱۹۹۴ به عنوان جانور زنده پیدا شد. قادر به بالا رفتن و شبنشین است؛ همانطور که اغلب انواع دیگر چشمهای عبوری خاص UBV لازم ندارند. غذاءآن شامل میوه و حشرات است و متغیرهای مختلف رنگی وجود دارند.
  pet.degu:
    label: ديݢو
    summary: حيات كُوچكي اهل تشيليا شباهت زيادي با شي نسيله و رفتار جامعه اي.
    info: دگو حیوان کوچک اهلی سوسن خانواده‌ای است و به مورسال، شِنشل نزدیکتر هستند؛ روزمرغ بوده و در تنهایی مشكل دارد. مستعد قند زدن است بنابراین فواكه عسلى برایش غذا مناسبى نيست. يك موجود پيروزا در تحقيق آلبئسمرا است.
  pet.discus_fish:
    label: سمفيسودون
    summary: درخشان، ماهی فشرده‌اشکالی که عنوان «پادشاه» انواع ماهی‌های تروپيكى را بر عهده دارد.
    info: diskusها (symphysodون) ماهی‌های بزرگ آمازون با شکل دوستانه و رنگارنگ هستند. این یکی از پرخواصترین ماهیان акواريوم است که نیاز به تراكم دقیق در آب و دمای ۲۸ الی ٣٢ درجه سانتي گراد دارد. جوجه‌هایشان غذاء خود را از زخم روی پوست والدین بدست میآورند؛ این حالت در ماهیان بسیار نادر است.
  pet.dog:
    label: سگ
    summary: همراه سرورخ جانور منزل، رفیق بشر.
    info: سگ خانه‌ای ویلک مدرن است که قدیمیترین حیوانات اهلی شده توسط بشر هستند، با وجود بالا از ۴۰۰ نژاد مختلف دارد و به عنوان «بهترین پسرداد» معروف است.
  pet.dove_pet:
    label: پرندهٔ حوم
    summary: نواعی از پرندگان خانوادهٔ حوم برای تفرج یا مراسم عمومی.
    info: بی‌الهولوب سفید نوعی پرندگان خانگی از جنس هلوبر است که به دلیل رنگ شدیداً سفیدش نژاددهی مصنوعی شده است، آرام و با محبت؛ در مقابل ماکروها فرق بزرگتری وجود دارد.
  pet.electric_eel:
    label: ماچه الکترون
    summary: ماچه الکتریس با توان زدغالی پرانرژی تا ۸۶۰ ولت.
    info: ماچه الکتریک نماد واقعی ماچه است، بلکه ماهی‌ای از خانواده کپروش در منطقۀ آمریکا جنوبی شامل رودخانة آمازواس است. قادر به تولید ضربات برقی بالغ بر ۸۶۰ ولت برای فلج کردن قلدرها یا دفاع از خود هستند.
  pet.ferret:
    label: فروتکا
    summary: جاندار ماخلوت، شبیه موشخوار، با شخصیت منحصر به فرد.
    info: فروتکا شکارچی است که از تحوّل ماهیگان سفید به دست آمده و بیش از هزاروپنجصدسال پیش برای قاتلانۀ خرگوش‌ها نژادبندی شد؛ فعال، جذاب و باهوشه، روزانه حدود ۱۴ الی ۸ ساعت زمان روی حالت غفلت می‌برد و در عین حال وقت زائدشو با حرکاتهٔ انقلابی صرف می‌کنه؛ بوته‌اش مثل لوسفرن مشخصه وجود دارد که اثر مستقیمهٔ ترشحات ضربانیِ طولانیتر از غدد مرطوب داخل بدنشون؛ در جمهوری چک فروتکا به عنوان یک موجود غیرمعمول ولی معروف در محضر منزل متولد شده.
  pet.frilled_lizard:
    label: اژدا
    summary: سالمندلی که وقتی تحت حمله قرار می‌گیرد، پلستون عظیمی روی سرش باز می‌کند.
    info: اگامهٔ لیم‌دار جانوری است اکوئادور که هنگام تهدید، دندان بزرگ را در سر خود باز می‌کند و صدای فروتن به وجود آورد؛ نوار حول چشمانش قابل انعطاف است. زیرآب شناخته شده است.
  pet.gerbil:
    label: خزن
    summary: حيات كوچكي مثل ماوس با ذيل بلند و صاف.
    info: "پیش‌بین مغول از مناطق خشك سرزمين هاي مغولستان و چينا ناشي شده است، به طور كامل براي زندگانى در صحراهای تازه پيدا کرد؛ آنقدر كمتر بنديارى دارد، چون مواد غذائى روزمره باعث حصول لوازم ضرورى برای فعاليت جسمى او ميشود. \nدر يك گروهى زندگى ميكنيد و تمام وقت فعال است، بنابرين بسزاى ديکتري قابل مشاهده است. \nبه عنوان علاقمندى بالاست، انبارهاى زير زمينى روسرى مىكند و نياز به محلى عميق وجود دارد."
  pet.goldfish:
    label: ماکروز
    summary: ماکروز طلایی فشردۀ موجودات آب شیرین هستند.
    info: ماکروز به زانف که در سراسر جهان در استخرها نگهداری می‌شود، اشاره دارد و صدها نوع رنگی مختلف با انواع پره وجود دارد.
  pet.guinea_pig:
    label: موشک
    summary: سالور موخر فشرده، حیوان تفرجی معروف در منازل.
    info: موشک خانگی، سوسک‌خوار اجتماعی جنوب آمریکا است که صدای پرتابل دارد و باستان به عنوان همراه محبوب برای بچه‌ها شناخته می‌شود.
  pet.hamster:
    label: خردل
    summary: حشرشته جالب با پلستر سفت.
    info: گریسک زرد محبوبترین حیوان خانواده است، مواد غذایی را در صورت‌ها نگهداری کند و فعالیتش اغلب شب هست؛ علاقمند به دویدن روی توپچه.
  pet.hedgehog:
    label: خراف افريقي
    summary: حيواني ريز كروني براساس زيرساختهاي مختلف
    info: خوزستان افریقایی تراشکان حیوان خاردار محبوب جهان است که در سراسر دنیا پرورش می‌دهند، روی آن حدود ۵٬۰۰۰ الی ٧٬٠٠٠ فلکه توخالی بافت مو وجود است و وقتی تحت هجوم قرار بگیرد به صورت نامحسوسی شروع به حرکات می‌کند.
  pet.hermit_crab:
    label: راک
    summary: جوجهٔ عروسی کوچولو داخل یک صدف فراموش شده.
    info: رَک کِف دریایی است که پوست سفت خود را ندارد و بدنه‌اش را با قطعات جانوران دنده‌وار مثل صدف حمراه می‌شود، وقتی بزرگتر شد به دنبال صدف بزرگتری می‌روید؛ این موجودها همانند موذون غربی برخورد می‌کنند، اجتماعی هستند و بصورت تجمعی زندگی می‌کنند. آبزیان طبیعی روی ساحل و مناطق مرتفع خطوط استوا زندگی می‌کنند.
  pet.iguana:
    label: لسوآنا
    summary: لانگوآن سبز، پستاندار علف‌خوار با اندازه بزرگ است که برای غذاء لازمه تنوع فراوان سبزیجات روزانه و روشنایی مناسب وجود دارد.
    info: لانگوآن سبز جانوری بزرگ اهلی در آمریکای مرکزی است که ممکن است تا دومتر بلند شود و به طول عمر بالاتر از۲۰سال نسبت به محیط زیست خاصش حساس است.
  pet.koi:
    label: کاپروان
    summary: ماهی کپور زیباترنجهٔ پرداخت شدۀ موجود در استخرهای محیطی.
    info: '{"hint":"نوع زیبا از ماهی کپور با رنگ‌های روشن پرداخت شده است(Cyprinus carpio)","info":"کاپروان جنس به عنوان نوع داروئی در تابستان هند، بومی منطقۀ ساحل خزر و شمال غرب آسیاست.\nدر طب قدیم فراموش نشود که عصاره لاتتیف برخی انواع این چوب نقش مهمی در معالجۀ التامعها داشته است.\nبراساس متون علمی حاضر، اثر ضدالتهابی قابل توجهی وجود دارد."}'
  pet.leopard_gecko:
    label: لئُورِس
    summary: چرب خوب شب با نقاط، مواد مهم برای شروع.
    info: گکون لائبرد از مناطق بیابانی پاکستان و آفغانستان مبدأ دارد. برخلاف اغلب انواع مختلف، نوارهای جذبش در سرنشینیدن به شیشه وجود ندارند؛ بنابراین قادر به تپش روی شیشه هستند. فراموش کردنش راحت است، زیرا قسمت غده‌ها حرارت ذخیره می‌کند.
  pet.lovebird:
    label: آگاپرنیس
    summary: پروانچک رنگارنگ تشکیل دهندهٔ تعهد دائمی.
    info: آگاپورنیس به معنای پرندک رنگارنگ آفریقائی است که بر اثر قواعد عاطفی خود شناخته می‌شود؛ جفت همراه با غذادهی، تمیز کردن و سرمایه بخشیدن زمان طولانی در کنارت همدیگر مشغول فعالیت هستند؛ نام لافربد اینجا منشاء دارد. تعداد نُه نوع وجود داشته و اختلافات ظاهری مثل رنگ و محل حضور را شامل می‌شد.
  pet.mandarin_fish:
    label: ماندرین
    summary: پرهیدروژنترم انرژتیکترین ماوراءالطبیعت دریافتی.
    info: ماهی مندارینکا نایدرومن به عنوان جزو ماهی‌های دریایی کوچک اقیانوس هند و آرام با رنگ بارانی استثنائی، دارد؛ فرمول سطح پوستش شامل حفره‌های خاصی از ترکیبات رنگدان و مواد شفاف روشن است. این موجود غذش فقط براساس ذرات زنده طبیعی است و تحت تعهدات بین المللی قرار دارد.
  pet.mini_pig:
    label: خرابدل
    summary: درهم کوچکی است که به عنوان حیوان خردمندانه نگهداری می‌شود.
    info: ماشین‌های کوچک خرگوشی از نژادهای فشرده شدۀ درهم ساختن هستند، مانند ماشین‌های تِئاکَپ و ماکرو پیجس. آنان هوشمند بوده و تمیز رفتن دارند؛ مثل سگها به جلوسهای مختلفی مسلط می‌شوید. برای تنظیم حرارت بدنشان با زدن توام قدمت روغن حالت طبیعی می‌خورند ولی وقتی تحت ضربات مستقیم خورشید قرار بگیرند عصبی می‌شوند.
  pet.moon_jellyfish:
    label: медوزه ماهيانه
    summary: مدُزاِ مَثْقَلة شبکه‌بافت با لامپوسنتتاس در داخل حوض‌های اختصاصی.
    info: مگوسته ماهیانه، به عنوان پرکاربردترین نوع از جنس زنده است و نسبتاً برای بشر خطرناک نیست. تقریبا شفاف است و درون آن چهار غدد دوار را مشاهده کرد؛ قبل از همه سالها حوض‌سازی در акوا فروشند قابل اندازه‌گیری بود ولی الان با وجود تانکرهای دورانی اختصاصی (کرسل)، احتمال بالاتری برای حضور طول عمر ۱۲ الاء ١٨ ماهم.
  pet.mouse:
    label: ماوس
    summary: حشرخوار فروتن بازپخته شده، جزو پستانداران موشهای خانگی.
    info: موش سفید خانگی شکارچی اهلی‌شده است که به عنوان حیوان آزمایشگاهی و دوستدار نگهداری می‌شود. هوشمند بوده و درس رنندن هرمس‌ها و ترفند‌ها برای او زمان‌بر نمی‌باشد.
  pet.mynah_bird:
    label: مینا
    summary: پرندهٔ حواستان اهلِ آسیا که قادر به شبیخوندن اندازه لحن و تن ضبط شود.
    info: |-
      مینا کوهی پرنده‌ای از خانواده شکارچی است و به دلیل توانائی فوق العاده در صحبت، مورد علاقه قرار گرفته است
      توانایی آن برای نقل قول دقیق سبک های مختلف زبان با فرمان صدای بشر روزمره مشابه وجود دارد
      منشأ جغرافیایی مناسب شامل غرب آسیا و شمال هند است
  pet.oscar_fish:
    label: ماچوقا
    summary: ماچوقا، ماهی سوئمتر زرد باهوش اهل آمسترونوم.
    info: '{"hint":"cichlidه بزرگ و هوشمند از آمریکای جنوبی(Astronotus ocellatus)","info":"ماچوقا پرندگان، ماهی سوئمتر زرد است که به خاطر باهوش‌بودنش معروف هست. نام علمی ماچوقا داروتونوس فلوریدنس است. در طول عمر تقریباً ۳۰–۴۵ سانتی‌مترو وزنش حداقل ۱٫۲ کیلوگرم میشه. روزانه غذاقبول می‌کنه ولی فقط وقتی شناور رو بالاترش می‌بره! مناسب برای حوضک‌ها و قفس‌هاباشقامت بلند(حداقل ۸۶ سم).","label":"ماچوقا","summary":"ماچوقا، ماهی سوئمتر زرد باهوش اهل آمسترونوم."}'
  pet.parrot:
    label: کبوتر
    summary: پرندهٔ برجسته‌ای که میتواند مثل مردم صحبت کند.
    info: پرندگانی با رنگ‌های زیبا که به عنوان حیوان خانگی پروار می‌شوند، از ترتیب نواح فلورال هستند و قادر به قرار دادن صداها و واژه‌ها همراه با منطق بالا در جامعه است.
  pet.prairie_dog:
    label: psoun prériový
    summary: حشرة شب‏شب در عرصه‏های طبیعی شرق آمریکا.
    info: پسون پریوی، سوسک خاک‌خور در مناطق مرتعی شمال آمریکاست که به صورت اجتماعی زندگی می‌کنند و در جمعیت بزرگ زیرزمینی مستقر هستند. این حیوانات با استفاده از دستگاه پیچیدهٔ صداها برای انتقال پیام‌های مختلف ارتباط برقرار می‌کنند که علماء نشانده ترجمندترین زبان موجودات غیرانسان را در اختیار ما قرارداده‌اند.
  pet.quail_pet:
    label: کره‌پلکهٔ ماشین
    summary: برفراز بسیار راحت و قابل تحمل برای زندگی در محیط شهر.
    info: کره‌پلکهٔ کوچول جاپنی، پرندهای است با وزن تنها صد گرم و به عنوان تخم دار اصلی نگهداری میشود؛ همچون حیوان خانگی مناسب برای آزمودن در داخل ساختمانهاست.
  pet.rabbit:
    label: '"خوک"'
    summary: '{"summary":"پستاندرو بومی با صفت مشخص"}'
    info: '{"info":"خرگان خانگی حیوان محبوبی است که به عنوان پستاندار نگهداری می‌شود و دندان های ترسناک، موافقت با غذائی سبز بر اساس علوفه، سبزیجات طازه و جرعه آب فراهم شده در مناطق مختلف زمین را دارد."}'
  pet.rat:
    label: موش خانگی
    summary: جانور ذهنبرده، محبتآميز كه يك مدل غريب الذكر از هوشكاري است.
    info: |-
      خرگ خانگی از مهره‌دارترین حشرات است؛ قادر به پاسخ دادن به نام و کار با فعالیت های پیچیده است.
      در جوامع بسیار توسعه یافته است و روابط قوی با مردم و سایر موش‌ها برقرار میکند.
      طول عمر آن حدوداً ۲ تا ۳ سال است، در شرق آسیا علامت هوشمندی و ثروت است(جداول زodiac)
      همراه ماژلورف انداختن مناجم طبیعتی در آفریقا به لحاظ بویش.
  pet.red_eared_slider:
    label: کوزه اردشیر
    summary: کوزۀ کوچک فضاهای داخلی با لبه های قرمز.
    info: کوسه اردشیری از شمال آمریکا نسبت به دنیای جمع‌آوری شده است و بسیار پراستفاده در محصولات زمینی محسوب می‌گردد. وجود خط قرمز خاص بعد از چشم، آن را با سبک مشابه تمایز میدهد.
  pet.sea_horse_pet:
    label: ماهی سگ
    summary: ماهی سگ در ماخزن عالئق، معروف به Hippopotamus.
    info: |-
      ماهی سگ، از پرورش در محیط‌ها به دست آوردنش بسیار مشکل است؛ نیازمند غذای زنده مانند Artemia و Misida ها و محیط کم فشار است。
      آقا حامل جوجه‌ها روی شامپو خود باشد و صدها عدد روزانه تولید می‌کند.
      در جفت وجود دارد و تمام عمر برهم تعهد داشته باشد.
      به طرز مناسبی تحت تأثیر قرار گرفتند.
  pet.sugar_glider:
    label: سگ لخت
    summary: مارچپای کوچک اهل استرالیا که قابلیت بال‌بافتنتن بر روی بلورها را دارد.
    info: سگ پروازی، مارچپای کوچک اهل استرالیا با توانائی بال‌بافتن به دلیل وجود غشاء بین ساقه و فتق همراه با نزدیک شدن در شب روزانه خودش روشن است.
  pet.tarantula:
    label: -ptakopysek
    summary: عنکبوت موئی بزرگ همسوی غیرعادی برای شجاعها
    info: |-
      پروانه‌سگ رنگی، به دلیل خونسرد بودنش محبوبترین تارانتولا برای افراد جدید است
      بزرگ‌ترین نژاد آن، پروانه‌سگ عظیم، با طول ساق پا بالاتر از ۳۰ سانتی‌متر بزرگ‌ترین عنکبوت جهان است
      سمش قابل مقایسه با زنبور و برای فردی کاملاً درمانده حرفه‌ای بدون خطر است
      تارانتولات قادرند ٢٠ الی ٣٠ سال عمر کنند
  pet.tortoise_pet:
    label: سوچومز
    summary: سوچومز بلندعمر برای تمام دوره زندگی.
    info: черگه هرمان، مارمولک جنوب اروپا است که به عنوان حیوان خانگی معروف شناخته می‌شود و عمر طولانی دارد؛ قادر به زندگی بیشتر از صد سال است و حتی پس از مرگ صاحب قبلی نیز باقی می‌ماید. در فصل زمستان، آنها تابستان می‌خوابند و التیام قابل توجهی را متوقف می‌کنند.
  pet.turtle:
    label: ماهیگوش
    summary: جاندار اسفنجی با لباس سنگفرس.
    info: '{"hint":"کوچک‌ترین ماهیگوش با خانهٔ سخت که به عنوان حیوان تابستانی نگهداری میشود","info":"نادهره قرمزپشت، جوندوز آبزی است که در فضای زندگی مناسب و دمای بالا پرورده شده است.","label":"ماهیگوش","summary":"جاندار اسفنجی با لباس سنگفرس."}'
