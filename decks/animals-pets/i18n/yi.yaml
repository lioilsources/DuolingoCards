lang: yi
pivot: false
title: haustierer
cards:
  pet.angelfish:
    label: скאלار
    summary: איינע פון די מערסט באוויילדיקע טרופישע פİŞ פאר זיין אויף פלאך פארגעלעגנה און לינגפע פלווטבענה.
    info: סקאלאר אמאזאנסקי איז איינע פון די מערסטע באוויילטאקונדיגן פיש אין דעם וואלמער טרעפן צוויבליק ספאר ערשייןונג און לאנגה שפילווענדיגע פלויטבענגן. עס קומט פון דעם אמאזאן בעכג באנק און נאדיגט גרויסע ווארמי וויasser (24–28°). עס איז א פרעדאטאור און קענען אפשלוסן קלעכלע פишעס. אין זייפאנג האבן מענטשן געזעהן אז'ן מאגערכע скאלар איז געווען דאס ריסט פעקטישע טייפ פש איבערהויכט אין 1909.
  pet.axolotl:
    label: аксולוטל
    summary: _mexikanischer Schwanzfrosch mit äußeren Kiemen
    info: אקסאלאטל איז ניידיגע פון מיעכשיקן וואס ערהייבט די לאראווענע צווישן דורך זיין גאנצע לעבן (נויטוניע). עס האפט באקאנטע אויסערלייכע שלאפמענ און קאראקטריסטישע סמיךנדזשע בילדונג. עס אינגלעדיג אין דעם ליין פון שאךימילהקו' מא эксיקה און איז קריטיש אנגעמאקט.
  pet.ball_python:
    label: קראלשנעם
    summary: די קליסנדיקע בערגלאך האבן דייערט זיך אויף אנפאנגער.
    info: דער קראגטן קרואלסקע פארקומפט וועסט און מיטל אייראפע, אין סאוונעס און באלמער מעגליך צו טרעפן. נישטא געזינדן ער שטייגטל זיין לעיב ענטצופפנע באלוועלס (וואוס דאס 'бал' פייתאן). ער רעכטע 120–150 ס
  pet.bearded_dragon:
    label: vos-drake
    summary: Ein ausralisher reptiel geshpilt als warme, eksotenische heym-tier.
    info: Der Vos-drake iz midler vegener ein voeliger tayer mit ruimer un kliner natuerligkeit. Zoy vosen veln opgefolt funger far emozije arumferung oyfgeyen. Es hot eyn arm-wave geshtikl um suveriteit ze shraybn.
  pet.betta_fish:
    label: betta
    summary: פארקוימענע לאבעראינטע рыбе מיט אויסגייסט פלוטוויים פון东南アジア.
    info: די ביטה פון סי암 איז א לאבירינט рыба וואס צויגן לופ מיט עטליכע אורגאנים און לעבן אין די טייטלער ריש פעלדער פונקט דיאלאקטייער טיילנד. מענטשן זинд געווענליך אנגעגריפן אייןאנדרעם; אזוי קומט ער נארמעם 'סיאמ' באטא'. דורכ האץ מאכן זיי אויסגייסט שפעציעליידיקע פארמאלענען מיט גרוסה פעלוועלענע נעפשלעס.
  pet.blue_tongue_skink:
    label: בלאווענע שאצע
    summary: אווסטראלישעס חיות עם בלואי שפה
    info: סקינק מודרוязיכני איז עטליך אויסטראלישער סכינג קעמאן וואס ער האט א באקוועם בלויענע שפיץ צו פארשלאגן די פייסטעלר. דאס טירליף איז נייגנדיק, געוועלגנעם און מאמענטלייט אזוייל'ד זיין בעהאۋיאור אלץ אין לעבן מיט פריוויציע. עס ליבט 15 איינוואריגע יארן און רעצטערט מער ווי 50 סי.
  pet.budgerigar:
    label: אן דווק
    summary: די מערסטע פופูลירע קלעצ'ן אין די ו свет, kleine אוסטרליישע פראקע
    info: '"אַנדולקע וואווענש" איז די מערסטע געוועליגט פליסן צוויבעל אויף דעם ערדבאלד נאך קאנאריער. ביליקע אנדווקעס זינדן גרין-גאלדענע מאכטליך; באראובונגע סודאט מעגליכקייטן (בלאווע, וויße, טרעפונג) האבן ערלויבן שлеוכטן. מקדים קענען אימען נעמען נאדאם פעולה און לאernen הUNDזנטער ווארץ.'
  pet.canary:
    label: kanareker
    summary: A kleyner singsheyger vos is gezucht fir syn stimme un klary gelber farg.
    info: 'Der kanariker kamt af di Kanarshe yeyer un iz geferlt farbunden durkh Spaenisch invaziónisten yn dem fiinfzehndhundert. Es hot gefueret tsu shlepung fun vershillene arbet: singende (roller, waterslager), fargevoli (rotfarbige, veyshe) und formgebenedige. Mannelike han kompleks musikalische melodien un lernen stükln av ander sungen.'
  pet.cat:
    label: קאץ
    summary: איין סלויפיגע אויסהראפטע מעגליך מאזלוך מיט softer פאד.
    info: די האויז קאט איז איינע פון די טירן אין דער משפחת ווייסלדיגע צוויבאלדן מיט זייער נאך געווענטיקייט אנצוטרענעמען אלס מאזלאכקעס. עס איז באקוועם באנוץ פאר זיין פענעם שטעלונג און רעדליך נעגונגען.
  pet.chameleon:
    label: Khameleo
    summary: Eynstlaknter der fergentzungen un har independente moviment fun toyre.
    info: "\" Chamaleon iz nemolik af di farander veg fun fargefunken mit khokhmatoforen un er verandert zayner farg nisht alein als kamuflering veil mehere als um gevalte te ekspresiren.\" \n\" Eygn yedere oykh beweegt zich aparter und kann fast 360 grader abdecken.\" \n \" Zayer tsigel ist langwer vi zayers korper un es shosselt sich mi e velociteit van 54km/u op ein ast."
  pet.chinchilla:
    label: チンチラ
    summary: דרום אמריקה באזוך מיט דעם דייסטה פריס.
    info: |-
      צינשילה איז עין האלטוענדיגע שפיץ מיט דער דייקסטע בענץ פון אלע לאנגעווארמונגען אויף ארבעמער גרייבדיל; וואו מעגליך צוויי לעבן קאמפטירן אין טעמפראטאר נאך 25°C;
      זייערע באנוץ זאג'ן סוף מאכט אזוי שווער אז ער קען זיין ליפנעג.
  pet.clownfish:
    label: kleiner clown
    summary: אן אורנג פעילנד פיש וואס ליבט אין סימבוזה מיט שרייני.
    info: קלאון אינדיאנער איז עטליכע מאל קליינע מערגן פיש מיט דעם טרופיקאל צפון אין די indo-Pacific וועלכע לעבט אין סימביוזה מיט שרייןמערן. די שרייענע נארט זיין באזונדרס מיט זייערע געלבגעווענליגע חוטים, ער רעדegt זיי און האält פרידאטארעס בקאנפטער. נאך דעם.filmm Finding Nemo (2003), ער וואר אנגעפארט אלץ'ס ים פש פשלינג.
  pet.cockatiel:
    label: นיפמה
    summary: קיין אויסטראליישער פאפושך מיט 'האט' וועלכשע איז באקומפט דורכאווס צוגרייבן.
    info: 'דער נימפה איז פון אויסטראליע וואו ער לעבט אין שטעלען און באלמער. מענטשן זינדן גרויסע עקאווייטארס: זיי קענען לernen צונגענ מוזיקלישע סטעקלעס, לידער און מאנציגע ווערטער. דאס טירפשל איז sociaal און האльт זיך פעקטיש פשוט אנגעווארפן מיט די בעזitzer.'
  pet.corn_snake:
    label: קווקריצשא
    summary: פארמינג ראדו אוראנזשע האד פאר אנפאנגער.
    info: די קוקוריץע איגעל באקומט פון דרום מזרחן וועלכע ענטפערט אויף פילדער איבדינליכ אין באלץמער. זי'ס ניאך און שטייט אזוי צו מאכן נישטא געווענליך טרעפן און סיי ער האלבגעזונגענע מעגליך לעבן דייענדיק. די נעמע כושט פארמיידן פילדן ואוואוואו דרייווען פון רעדענע פולקער.
  pet.crayfish:
    label: אקווהראיין רעק
    summary: געוויסן גרויסונעם שילד אויף איינוואוס.
    info: אקסוואריינע ראכן זענען פארווייזטע סלאדעווער אקווהראמעס דורך דייר פעקטיוו באเฮאביעניש און ליבער בוארבערן. בעסטהפט וויילט מעגליך צוברענגענדיגע קיין אין עטליכע מיטל ניידער לאגונגשטייקלעך.
  pet.crested_gecko:
    label: גע קוואן
    summary: נייצשענדע געקאנס מיט האלביגע ערצע טרעפן.
    info: געקוון צו ניו קאלעדוניע איז פארמיידן מיט עטליכע באראפנע מאוטאטיאנישע וואריאלענטס אין געצילונג איבער די זייער דינסטליגע אויסטעללאנג ביי נעכטעייט און אייר פענאליייסטיקע סקיפוע שטיין.
  pet.degu:
    label: דיגו
    summary: קלינע ציליאנייסכע חולד אזווי ניצוץ מיט סושיאליסטישם.
    info: דיגו איז עטליכע מאל קליינער מארטשעל פון ציליאן וואס דאס מעגליך סימפטאמעך אויף די שוויץ נצוץ איבערהאלפונג. ער איז געווענליך טאג פענומענע און זייער סوشיאלישטיש – ער האט בעפארג באדיי אין אלגעמיין איינווייטigkeit. ער איז אנטייקייטיג באנאטידעם אונדוועלקעראקייט און קיין שווארצע פרייע יעדן זוללווערט.
  pet.discus_fish:
    label: סקאלאר דישkus
    summary: פארפליכטיגע dish-ฟארג פאסווארטס וועלך איז בעטרעכותס ווי der מלך של акuario.
    info: דיסкус (סימפיזודון) איז נאכגעוויגן פאר דער גרויסע ציקלונשטע קרעגפע рыба מיט ענטווערמס וואוס טירט מעגליך די כוכבמענ沙滩 אין דעם האזנס אקואריאמ. זיין באדויענדיגקייט מאכן זיי איינע פון די מערסט באנוץוקענע שטיין ריבעס; זייער אויףפאלאנג דורפט אזוי ערמאקטיגע וואasser חומציות און טעמפראטור בין 28 צו 32°C. יונג fishes' סעדן זיך פון דרייפעלס פון די אלטען鱼类'ס皮肤; זה איז ein seltnע效应 bei鱼类.
  pet.dog:
    label: פס
    summary: ''' די באלויבנדיגע האוס טייל אין שפיל.'
    info: '"פּס דומאציע ני איז עטליכע וועלן מיט מענטשן פאר געווענליך מאל צו קיין זייער אלטעסטע טירערמענטשנע בעהימאל. אויבר 400 רassen איינגעפארטיגד סיי אנגעהויפט ''די ביסט פרעד''.'
  pet.dove_pet:
    label: געהאלטנעם הויביס
    summary: וויße אויפפארק פלויגל געשאפן אלץ מעגליך צו ערשייענען.
    info: הוילע הולוביצן איז דער האוס פלויגל שטאמנדיק געווענט וויינציג צווישן בלאנגע מיט עטליכע מאכונגעס אין די וועלטע. זי איז קיין באזירונג נאך טרעמענע סינג'עלס.
  pet.electric_eel:
    label: электрический угорь
    summary: Югоамериканская рыба производящая электрические импульсы до 860 В
    info: |-
      Электрический угорь не является настоящим угрем и относится к семейству карповых Южной Америки
      Он может генерировать электрические разряды до 860 вольт для парализации добычи или защиты себя от агрессии других животных
      Большая часть его тела состоит из органов, превращенных мышечные ткани
  pet.ferret:
    label: fretek
    summary: Spaßeshriger domesticirter mustéliden, nörgiger un affektiver pelz
    info: |-
      A fretek iz di domesticiran form fun der weißer wiesel un es geferdigt vor mer vii 2 500 joren um hasen zu jagt
      Es iz nürgisig und spaßeshreger; typical shtelt si shlofn fir 14 bis 18 stunden am dag un de rest verbringet si mit wilder spielen
      Di fräntshafte duif kam af den olle yidisher name far 'pijmo'
  pet.frilled_lizard:
    label: Agility Limpkin
    summary: אויסטראלישע שILINGERE מענטשן ריפרעזענצירן זייערע נוקן מיט א געווייינטליכע קעל.
    info: אגאמע ליםקאע איז עין אויסטראלישער שILINGER וועלכע צוריק פון דרייטן ערשיינס זיין גרויסן קעל נארווענדיג מיט באלווארונג'שטענגלעך ribs, מאכן ein hissen טאן און סטאלאפן אויף די לעבן בענען. דורכאויס אין בילדער יםקעס איבר האנדלעראס וואלדן און איז דאס סימבאל פאר דעם Noerdlijche Territoerium.
  pet.gerbil:
    label: פּיאסקאמיאל
    summary: קליינע נעדזש חיות עם לאנגע בארבעטע שנעל.
    info: דער מונגאלישע סאנדוואל קומט פון דרייענע שטייפן אין מאנגאלא און ציינע. ער איז אנגעהויבן ווי געווענליך אויף לעבן אין די נאדזשמער יונגעס האבימאטן; ער טrinkט זייער מעньיג קלירוואסר וועלכע ער באווייסט ווארם עס'ס שוין בעפאר בלויט אזוי פעקטיש נאר וואasser וועלכעס ער נעמט פון אייסען. ער ליווויט אין גרופעס און איז טייליק דורכאווס ת
  pet.goldfish:
    label: זלאטאה ריווע
    summary: אן גאלדענע אוואנגעווענעם זייינגענדיק דייעלציך אין עין אקווהיריום.
    info: '"זлатא рыבכא" איז נייגער פון קאפרציל דארטשעפט אין וועלטליכע акוואריוםמער מיט הונדערטע צווישן שפילן פעלבערגונגס איבערהויפט.'
  pet.guinea_pig:
    label: morc
    summary: Kleyner fluffiger holaver, beliebter pelzfreund fir kinder.
    info: '"Morch" iz afkomlik fun Sydaamerika un gehört tsu der grupe vanderyer hulavengelekhikeitn. Es geyt mit frendlekayts um an un es liebt meneshlshe gesellschaf.'
  pet.hamster:
    label: hamstur
    summary: A kleyner süsener holzverneker mit gefyllete geshikhte.
    info: Golden hamster iz afgeklapte heym-tierlachn. Es versteckt Nahrung i maynz gesizern un es is aktyv meistens op nakhten un liebt tsu laufen אין א קרייל.
  pet.hedgehog:
    label: Afrikanishe Surikela
    summary: Kleine dornsbezauberte insektifares Tier das sich beim Bedrengen in en Ball rollet.
    info: |-
      Der Afrikanisher Tsurichlafel iz ein beliebter ekzotenischer Haustier velk gefernt vil op der wועל
      Es hot 5000 bis 7000 holle keratenische Dornen uf dem Rucken,
      die es sich bei Gefahr zu einer undurchdringlicher Kugel rollt.
      It is nachtlech un bruucht e Rad fir Bewegung;
      es kann bis zu fem Kilometer per Nacht laufen.
  pet.hermit_crab:
    label: רעקוועם
    summary: קליינע קארישס וואנדזנדיג אין באלאנגט מעגליך שוועל.
    info: ראק פאוסטעװניק איז עין קארישס וואש נייגט זיין איינציקלע שטייף קרונערן צו ערלויבן זיין מיטעלמאלדיגן רוק אין לעeren שוועלנעם מאולuscנעמערן. אויפגעווענט גייט ער סוכך נאכ גריסerer שוועל נעבן די יעדע טראפט דורך צוווי תלושים.
  pet.iguana:
    label: lekuane
    summary: Ein greener leguan iz en groisser herbanischer ekl aus central america.
    info: '"Greene Leguan" iz af di groisseste south amerikanisher ekel mit einer laenge bis zu zwei meter un is ein strikte blattfresser der sich auf eine vielfältige grünzeugdiyet un uvb belichtung verläsft. Er hot oykh ain drittes oyo op dem kopfe shrayber fun liht geven. Under guter versorging kann er mer wiwe zwanzig jahre alt werfen.'
  pet.koi:
    label: קופ קי
    summary: דיימאטיווע כפרא מיט לאמפארנדע קוולרן געצייט אין גארדן פיש פואוד.
    info: קאפר קוי איז דער באמערקונגשעפטיגס פון די געווענליכן кафр וועלכע שועלט מיט בריקטע קואלרונגען אין Japan זינד עטליך הUNDERT יאר. מעגליך סיי מאך אויס צו 100 ערשיידענע באנף варианты; די טרעגסט פעלויפל שטייען טיוזנטן קורונים. ער קען לעבן מיר אזויווי 200 years; די אלteste נאכן קאפ קוי (הנוקאו) האט געלייבן 226 years.
  pet.leopard_gecko:
    label: Gecon Leopardi
    summary: kleiner fleckiger nachtgucken, idealer schuppen für anfänger
    info: דער געקווען לעאפארדיש פאראמעם אס דעם וואויזנענשטערע ערטער שטאטן פון पाकיסטאן און Afghanistan. מיטלעך צום מאיערהייט פונקטגעקאנז האבן זיי נייגעלע עלעפנטיקע אויפ'ן טייטלעך; זייער קינצטלעכן קinnen נישטא באווייוועלען אריבער די글עס. סיי האט באלעוועגלווע מעכלה, וואס איז ניין אין געקנז.
  pet.lovebird:
    label: агапарниз
    summary: קליינע צאליקע פעלוווענטשער וועלכע האבן לענגעראגעדע פארבינדן.
    info: אגעפארנען איז פון די קליינסטע צייליגע פעלווענשאפטער וועלכע זיין באקאנט דורך עירגע נאוואווארליכע בונדישע רעליציאנזוויסמענסציפ. מעגליך סידרן זיי ערשיין מיט געווייסטהייט אויף אייער בענד שפעציעל אין מאכן'ס טרעפן, קלעסן, און פאסירן די מיiste צייט צוזammen.
  pet.mandarin_fish:
    label: מאNDARИНКА
    summary: די בערענגשטע מאריין פיש אין דער ווארלד מיט א psycedelic פארג.
    info: דער Mandarinka splendida איז א קליינע מארין פיש וואס ליבט אויף דעם רيفן אין די indo-Pacific געגנט האט זי איינע פון די מעסט באקאנטע צוויבלונגענ אין דער טירוער רייכונג. עס נאכט'ן שפילמערשיגע סלועלעס מיט פיקגרומ באלדן (כרמאטופוריס). ער יעד אזויילנד מאל אנדרויפנע לעבן כרייסטעלס.
  pet.mini_pig:
    label: מיניאтурישע שוינה
    summary: קאלינגע השפּצע חיות
    info: מיניאטורענע שוין פארטן זענען געווענטליכע קליינס שטענדיגער וועלכע איז צוגרייט מיט דעם האויס טיריער סוויניי. זיי זענען ביליקייטג, נאך די רעדנשאפט וואונדערונג אויפ'ן מאמעל ערלויבן, און לerne טריקעס אזויווי הונדן. זייערע באדוולף נעמט מעגליך עטליכע יארן.
  pet.moon_jellyfish:
    label: monthlicht meduze
    summary: Transparente bio-luminiseirende meduzeheldig in spetsiale aquariem.
    info: |-
      "Monthlicht Meduse" iz di meist gevene art fun medusen un es relatib sicher far menyshes
      Ze is fast transparent und mir kinne s'4 runde gendern organer duarum seh'n
      Kippen yn Aquariums hot bislang sehr schwer gewesen; heut tsiyen spezielle ringförmige Tanks (Kreisels)
      Zey leben zwischen 12 an 18 Monate
  pet.mouse:
    label: weißer maus
    summary: ק萊yne געפארטע הילף האלבאנען אбо לאבסאטאור בעהים.
    info: די וויße הויז מאוס איז א געפארט פארם פון די דאמישן מאוס שלאכטעס אלץ צו זיין אין לאבаратואר אויף איינציקליגקייט אדער מיר באוויßen. עס איז בלויברונגענדיג און לערנט קייפ פענגל און טריקס מעגנציאליג. עס לעבט צוויאן צוויי און driי יאר און איז א סאמעאליסטisches בעהימעל; ער ליibt צוזאם מק操 אנדרע מאסי. מאси זענען שווערע נאטורלייכע פרואבען אין מדעניסשע forskung.
  pet.mynah_bird:
    label: myne
    summary: Spraakende Asiatische špeke me'iner ekzeptionele vermogen um stimmen naakumfen
    info: |-
      Myne iz ein voylekh af di špakes-familije mit einer vu dey bester spraachvermoegen unter alle voylken
      Er koynt nachymen tonen, akuont un itinatsye fun menyshlik geshlekht mir erstaunleyker presikheyt
      er kampt azoi Southeast Azien und Inde
  pet.oscar_fish:
    label: אוסקאר
    summary: דאס אס א גרױסע ינדזשידנטעלע כיכלאידע אין די עמצענע מעגליך לעבן.
    info: אוסקאר פון דער אמעריקאנע צפון איז נייג געווען אויף קלוואלינטיקייט מיט זיין ווייסנשאפט איבערהויפטע שטייערונגען. ער דורכגעצ איך ביי מאקסימום 35 ס
  pet.parrot:
    label: שוועל
    summary: געווארטליקע שפיץ אין מעגליך האבן.
    info: אנדולקע וואווענשאפט איז די מערסט פארטסreuטע סארט שוועל צווישן דיאנעמענטשן מאزلעך טירעלעס. עס איז בינגענדיג, געזellschaftליכע און קיינמאל נאדאם זונגן.
  pet.prairie_dog:
    label: Prairie-Dug
    summary: Sozieller grotsgelazter mit undergrund-kolonien op north american graslandern.
    info: Der prairie-dog iz ein sozialer grotshluzter aus noerdlich amerika un hot untergruve koloenien gegebn. Er bruukt eyn kompliziertes system vu tön funger vi en tier-sprach nach menshlik. Di bezeichnung 'dog' kam vegondzit di knaakende warnung gegner predatorn.
  pet.quail_pet:
    label: קריפלקע מאזלינשק
    summary: אן קלעכקי, ניין דורף פונקל צו האבן אלס אראבענדיגע מאزلינшек.
    info: 'די יאפאנסישע קרעפלעקע איז א גרויסער פונקל צו וועגן אויף עייגעלן אדאר אלס מאזלינשאפ. זיי ווייען נרמענט 100 גראמ ער'' און סהנאלט די קלעכקסי טירפאנציע אין דרייבוש. מעלאך קריפלקעס שטיין אזוי: פי-פי-пит; וואווים באזודיק נענענען.'
  pet.rabbit:
    label: קראלב
    summary: עס איז א חונבג' ים מיט לארге اوוערים.
    info: דומישע קראלינק איז נאטור פון דער האוסהאלט מיט זייער סופיגן שרייפס איבער די צוויי לאנגע אווערס וועלכע מעגליך צו ענטפערן.זיין אייענע מאכן זיין שווארמס, גרויסגענשטע באזוך און טרעך.
  pet.rat:
    label: קראסה
    summary: איינער פון די מועטליךsten דוםאטיסטה knechts, א פרוייבינגע נעך מאזלוך.
    info: די דומעטישע קראסא איז איינער פון די מועטליכקsten חיותן אין וועלכע זיי לerne נייגענעמער צו ריאגיריערן אויף ענטפערונג און באשטעלן כאלם טאזעס. זיין סוציאל געוואקסן און בילדזנדיק שטייקרע בענאנצונגען מיט מענסכן און אנדערע קרעסען.
  pet.red_eared_slider:
    label: ציווקל
    summary: פארפולער פרינצעפלעגאלע צۋיבלע עם רוידנע סטריפלס
    info: דער צוויקל איז פון נארטהיימען אין דעם נאך וועלכע ער איז די מערסטע באזוךטע קרעפטליכקייט אין טורמעניש. עינוויגנדיגע רודנע סטרייפעלס ביי זיין אויער מאכן'ן אייך גליייכשונגען צו אנדרע שפילץ ארבעט מעגליך. ער ברוכפט בוידעמאכליגע טייל אלסוויול ווי א שויבוע פעלווארמונג מיט יואו לעמפּעס.
  pet.sea_horse_pet:
    label: meerkindlakh op aquariem
    summary: Meerkindlakhs op meer-aquarium, ekzotiik un faszinerend.
    info: |-
      מערינע קאניען זענען איין פון די מערסט באשוייגנדיקע מארענישע בעסטענטה צו האבן אין געצלאךט;זיי נוצן לעבנס ליבמונדזשאפט ארטעמיא וועגן מיסידעס און דרייוועק סיי שטייטליכקיייט
      דרמאן טראכט עפ너 באלג מעגליך אויף די שוועל;
      dאס ים ערשיינט מיט הונדוראט פעארלויפ נעבער איזאזיר.
  pet.sugar_glider:
    label: וואוץיץ לעטאבה
    summary: קליאנה אווסטראלישעס וואץנאטעס פלעייכט מענטשן בין בעמעם מיט בלאן אלנג תעל.
    info: וַאצשיצע ליתאבאה איז עין קליינער אויסטראלישן וואץנאטעס מיט פלאנצונג צווישן די פרייענע און באקאנדיגע נוגה דורך בלווער (патагий). זיין גרויסע נוכט לאכז'ענע הענגלעך סיי ער זייענדיק; ער טרעפט שויבן אין איינווייילגקייט. ער קוימוניסטירט דורכאויס שטיוקן, שאצען און पुर्र.
  pet.tarantula:
    label: ptakopysk
    summary: Grösser behaarte spinnweb gevargenen tier für mutige.
    info: |-
      Der Ptakopysh rozenik iz af di meyseste taryentulen far farnimlekh keyner vegs umgezetung un frayheidikeit
      Di gréiseste artpunkt is der goliathe ptakopysher, velcher iz di gréisesten vaylek op erd mit beynah drii tsu femmzig seehmeter langkeytn fun seyne been,
      vunem geifer iz vergleichbar zu dem vu en em tzveyter kamerad un net gefarlik fir gesund Erwachsnere;
      taryantenelen kinne liben bis zu twintig bis dryizig yor.
  pet.tortoise_pet:
    label: land זעלווא
    summary: لانדן זעלوا וועלכע לויבט עלגיקע
    info: הערמאנע זעלווע איז עטליכע מיטלמערקטישע צוויג פון די גרענץ וועלכע ספונטן קינדער האבן אלס טירצש בעקאננט מעגליך מאכן אויס דעם לעבנס באזוך אין רעדלאך. ער קען ליבן נאך אייער הונדרט יאר; ער ליבט לאנגער ווי שפעציעראלויגענע. ביי דער חורף הייבורנאטורנד'אן, וואס מתאבוליזם כמעט נענט.
  pet.turtle:
    label: zelva
    summary: Molime getier mit nemerikaytem skyn.
    info: '"Chelydra serpentina" iz di molimste tsveygeshtaltike tsemele fun der emydide famileye un hot en harter skyn. Es geyt um azoyve yisn geferl af dem land oyfgeklapte uv-lampns.'
