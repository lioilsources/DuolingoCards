lang: zh-CN
pivot: false
title: 家养动物
cards:
  pet.cat:
    label: 猫
    summary: 一种独立的家养宠物，有柔软的爪子。
    info: 家猫是猫科动物中被人类驯化作为宠物饲养的一种。它以灵活、爱干净和性格独立而著称。
  pet.dog:
    label: 狗
    summary: 忠诚的家庭宠物，人类的朋友。
    info: 家犬是被驯化的狼，也是人类最早驯养的动物。目前已知有超过400个品种，并被称为“人类最好的朋友”。
  pet.goldfish:
    label: 金鱼
    summary: 一种饲养在水族箱中的金色或橙色鱼类。
    info: 金鱼是全球广泛养殖于水族箱中的一种驯化鲤科鱼类。它有数百种颜色和鳍型的变种，是一种常见的观赏性淡水鱼。
  pet.guinea_pig:
    label: 豚鼠
    summary: 一种毛茸茸的小型啮齿动物，是孩子们喜爱的宠物。
    info: 家养豚鼠是一种来自南美洲的社会性啮齿类动物。它们会发出沙哑的声音，性格友好且喜欢与人互动。
  pet.hamster:
    label: 金仓鼠
    summary: 一种脸部鼓胀的小型可爱啮齿动物。
    info: 金仓鼠是一种受欢迎的宠物。它们会把食物储存在脸颊里，主要在夜间活动，并且喜欢在滚轮上奔跑。
  pet.parrot:
    label: 鹦鹉
    summary: 一种能模仿人类声音的彩色鸣鸟。
    info: 虎皮鹦鹉是最广泛饲养为宠物的一种鹦鹉。它们很聪明、喜欢社交，能够模仿各种声音和词语。
  pet.rabbit:
    label: 兔子
    summary: 长耳朵的毛茸茸宠物。
    info: 家兔是一种受欢迎的家庭饲养动物，有着柔软的皮毛和标志性的长耳。它们以干草、蔬菜和新鲜青草为食。
  pet.turtle:
    label: 乌龟
    summary: 一种行动缓慢、有坚硬甲壳的动物。
    info: 红面陆龟是一种受欢迎的家庭宠物。它们生活在可以登陆的水族箱中，并在紫外线灯下晒太阳取暖。
