lang: zh-CN
pivot: false
title: 家养动物
cards:
  pet.angelfish:
    label: 神仙鱼
    summary: 具有长椭圆形尾鳍的优美热带圆型鱼
    info: |-
      {"hint":"高盘状热带观赏鱼（神仙鱼 Pterophyllum scalare）","info":"亚马逊神仙鱼是水族馆中最受欢迎的鱼类之一，因其优雅的三角形体型和长长的飘逸鳍而闻名。\n它来自亚马逊河流域，并需要温暖水域(摄氏度在24至28°C之间）。 \ n它是肉食性动物并可以吃小鱼。
      在日本，迷人的神仙鱼于1909年成为第一个进口到日本的第一个热带品种。
      "}
  pet.axolotl:
    label: 美西螈
    summary: 一种永远生活在水中并拥有外部腮的墨西哥蝾螈
    info: |-
      {"info":"墨西哥无尾两栖动物，终生保留幼体形态（新成熟现象）。\u005C
      有显著的外鳃和独特的微笑表情。\u005C
      是墨西哥Xochimilco湖特有的物种，并且处于极度濒危状态。\u005C
      具有惊人的再生能力；可以恢复四肢以及部分心脏与大脑组织。","label":"美西螈","summary":"一种永久性水生、带有外部腮呼吸器的墨西哥蝾螈。「
  pet.ball_python:
    label: 球蟒
    summary: 温顺易养、能卷曲身体形成圆形的理想入门蛇类
    info: |-
      球蟒来自西非和中非，生活在稀树草原和森林里。当受到威胁时会蜷缩成一个紧密的圆圈（因此得名ball python）。它们体长可达120至150厘米，并且寿命超过三十年。
      在人工饲养下已经培育出八千多种颜色变异。
  pet.bearded_dragon:
    label: 中冠龙
    summary: 澳大利亚的一种蜥蜴类动物，在温暖环境中很适合作为异宠饲养
    info: 中冠龙是一种非常受欢迎的宠物爬行动物，因其性格温顺。它的喉部会充气并变暗以表达情绪或展示支配地位，并通过挥动手臂（手臂波）作为示好动作进行交流。
  pet.betta_fish:
    label: betta
    summary: 一种颜色丰富的亚洲东南部地区的壮观鳍状迷宫鱼
    info: |-
      {"hint":"色彩鲜艳的迷宫鱼，拥有飘逸鳍片来自东南亚（贝塔splendens）","info":"暹罗斗鱼是一种通过特殊器官呼吸空气并在泰国浅水稻田中生活的迷路鱼类。\u00a8雄性之间具有攻击性；因此得名暹罗战斗鱼。
      经过选育后形成了夸张的形式，并且有巨大的流动性的鳍。
      它们可以活到三至五年并且相对容易饲养。
  pet.blue_tongue_skink:
    label: 蓝舌头巨蜥
    summary: 一种拥有显著蓝色语言用于吓唬敌人的澳洲爬行类动物
    info: |-
      {"hint":"大型蓝舌蜥蜴（Tiliqua scincoides）","info":"蓝舌头巨蜥是澳大利亚的一种大体型壁虎，其特征是有鲜明的蓝色舌头。它会伸出这种颜色鲜艳的语言来警告捕食者；蓝色具有威慑作用。
      这是一种不具攻击性、肥硕且行动缓慢的小动物，在宠物市场很受欢迎。
      它们寿命可达15到20年，并能长超过50厘米长度。"]
  pet.budgerigar:
    label: 安第尔卡
    summary: 世界上最受欢迎的小型澳大利亚鹦鹉
    info: |-
      安第尔卡鹦鹉是世界上继金丝雀之后最广泛饲养的宠物鸟。
      野生的安第尔卡羽毛呈绿黄色；通过人工选育，出现了蓝色、白色和灰色等变种。
      雄性能够模仿人类的声音并学会上百个单词。它们寿命为五到十年，并且是一种社交动物。
  pet.canary:
    label: 金丝雀
    summary: 一种小型歌唱鸟类因其声音及明亮黄色而进行人工繁殖
    info: "{\"info\":\"金丝雀来自加那利群岛，于十五世纪被西班牙征服者驯化。通过选育产生了许多类型：鸣叫型（如翻滚鸟、水槽歌），颜色型（红色的和白色的）以及体型特征不同的品种。\r\n雄性会唱复杂的旋律；它们可以学会其他歌曲片段。\r\n历史上曾用作煤矿中一氧化碳检测器。"
  pet.cat:
    label: 猫
    summary: 一种独立的家养宠物，有柔软的爪子。
    info: 家猫是猫科动物中被人类驯化作为宠物饲养的一种。它以灵活、爱干净和性格独立而著称。
  pet.chameleon:
    label: 变色龙
    summary: 会变换色彩、双眼可分别运动的一种爬行动物
    info: |-
      {"hint":"变色龙，拥有能独立移动的眼睛（Chamaeleo）","info":"变色龙是一种能够通过色素细胞改变皮肤颜色的蜥蜴；它主要用这种能力来表达情绪，并非主要用于伪装。
      每只眼睛都能单独活动并覆盖几乎完整的360度视角。舌头比身体还长且以时速26公里的速度弹射出来捕食猎物。
      它们完全生活在树上并且有类似钳子的小脚用来抓握树枝。
  pet.chinchilla:
    label: 绒鼠
    summary: 南美最密集皮毛的地栖哺乳类
    info: |-
      绒鼠是一种来自安第斯山脉的啮齿动物，其毛发密度创下了纪录；每个毛孔能长出60到80根毛（人类则只有一根）。它们适应在不超过25°C 的温度下生活。过热对它来说可能是致命的。
      它可以活到15年，在极少数情况下甚至超过20岁。
  pet.clownfish:
    label: 眼斑双带丽鱼
    summary: 一种橘色在共生于海葵的鱼
    info: '{"hint":"小型橙白色海水鱼，生活在海葵中（小丑亚科）","info":"眼斑双带丽鱼是一种来自热带印度洋和太平洋的小型海洋鱼类，在与海葵的共生关系中共存。\n 海葵用有毒触手保护它免受捕食者攻击；而这种鱼则清洁并驱赶掠夺性动物。\n 自电影《海底总动员》(Finding Nemo)(2003年)，该物种已成为水族馆中的标志性角色。\n 所有种类的眼斑双带丽鱼都以雄性的形式出生，并且优势个体可以转变为雌性。");'
  pet.cockatiel:
    label: 尼姆法
    summary: 一种有冠的小型澳洲鹦鹉，因其歌唱能力而广受喜爱
    info: "尼姆法（科雷拉）来自澳大利亚，生活在草原和森林中。雄性是出色的模仿者：它们能学会歌曲、旋律甚至人类的语言。\r\n这是一种社会性强的鸟类，在圈养条件下很容易与主人建立联系。\r\n寿命为15到20年；它是全球第三受欢迎的家庭宠物鸟。"
  pet.corn_snake:
    label: cornsnake
    summary: 温顺、呈红色至橙色的小型宠物蟒科动物，适合初学者养的爬行动物（学名：Panthrophis guttatus）
    info: '{"info":"玉米蛇来自美国东南部，在田野和森林中生活。\n它无毒且性情温和，很少咬人并且适应力强。\n它的名字可能来源于生长在玉米田附近或其腹部斑点图案类似玉米粒的外观特征。\n它可以长到超过一米，并能在人工饲养下活到二十岁。"]'
  pet.crayfish:
    label: 观赏小龙虾
    summary: 小型色彩丰富的淡水螯虾生活在鱼缸内.
    info: '{"hint":"淡水螯虾，常被养在水族箱中（如 Cambarellus 或 Procambarus）","info":"观赏小龙虾是受欢迎的淡水产宠物，在于它们活跃的行为和鲜艳的颜色。\n佛罗里达蓝龙虾(学名：Procambarus allenii)，是最受喜爱的一种饲养品种；随着成长会蜕皮(Ecdysis), 新壳最初较软。\n作为底床清洁工很有用处，能吃掉藻类及食物残渣。","label":"观赏小龙虾","summary":"小型色彩丰富的淡水螯虾生活在鱼缸内."}'
  pet.crested_gecko:
    label: chocholate Gecko
    summary: 具有显著鬃毛般头饰及大眼睛特征的一种夜晚活跃型蜥蜴
    info: '{"info":"睫毛状冠丛的夜行性壁虎（学名：Correlophus ciliatus）原产于新喀里多尼亚，曾被认为已经灭绝直到1994年才重新发现。这种动物擅长跳跃，并且在夜间活动频繁。与其它种类不同的是它并不需要特殊的紫外线照射环境即可生存繁衍；它们以水果和昆虫为食，在人工饲养条件下还出现了多种颜色变异体。"]'
  pet.degu:
    label: degū
    summary: 一种类似南美栗鼠的社会行为明显的小型智利啮齿类
    info: |-
      绒鼠是一种来自智利的小型啮齿动物，与豚鼠和毛丝鼠有亲缘关系。它严格昼行性（白天活动），非常社会化；独处时会感到痛苦。
      它们容易患糖尿病，在人工饲养下不能吃甜味水果。
      它是研究阿尔茨海默病的先锋模型生物。
  pet.discus_fish:
    label: 神仙鱼
    summary: 一种华丽的圆形热带鱼被认为是水族馆之王
    info: |-
      圆盘鱼（Sympthysodons）是一种大型环形、色彩绚丽的亚马逊鱼类。它是对水族箱要求最高的观赏性热带鱼之一，需要精确控制水质和保持温度在摄氏度28到32之间。
      幼年时以父母皮肤分泌物为食，在鱼类中非常罕见；通过人工繁殖已培育出数百种颜色变体。
  pet.dog:
    label: 狗
    summary: 忠诚的家庭宠物，人类的朋友。
    info: 家犬是被驯化的狼，也是人类最早驯养的动物。目前已知有超过400个品种，并被称为“人类最好的朋友”。
  pet.dove_pet:
    label: 家鸽
    summary: 一种完全白色的鸽子作为宠物饲养或者在仪式上释放
    info: 白家鸽是一种被培育成纯白色羽毛的岩鸽。它性格温顺友好，与鹦鹉不同的是不会咬人或尖叫。常用于婚礼、葬礼和世界各地的各种庆典活动。
  pet.electric_eel:
    label: electrocyte
    summary: A specialized cell found primarily in certain species like Electric Eels which can generate electricity for hunting prey or self-defense purposes up to around eight hundred volts.
    info: '{"hint":"淡水鱼，能产生强大的电击（Electric eel）","info":"电动鳗不是真正的鳗鱼，而是南美亚马逊地区的鲶形目鱼类的近亲。\n它能够生成高达860伏特的电流来麻痹猎物或防御自己。\n它们呼吸空气，并且必须定期浮出水面换气。\n它的大部分身体由从肌肉组织转化而来的发电器官组成。","label":"electric eel","summary":"一种来自美洲南部、可发出最高达860伏电压冲击的鱼类。'
  pet.ferret:
    label: ferret
    summary: 一种好奇、爱玩的小型哺乳类家畜
    info: |-
      {"hint":"与鼬相关的驯养嬉戏的食虫动物（学名：Mustela putorius furo）","info":"雪貂是白鼬的一种被人类驯化的形式，早在两千五百年前就被用来捕猎兔子。它们好奇心强且活泼好动；通常每天睡眠时间为十四到十八小时，并用其余时间进行活跃的游戏活动。
      其特征是从腺体中散发出独特的麝香味气味。
      在捷克共和国，它是一种受欢迎但不常见的宠物家庭成员之一。
  pet.frilled_lizard:
    label: 鬃狮蜥
    summary: 澳洲的一种蜥蜴，在遇到危险时展开戏剧性脖环进行自我保护措施。
    info: '{"hint":"一种蜥蜴在受到威胁时会展开巨大的颈褶（Chlamydosaurus kingii）","info":"鬃狮蜥是一种澳大利亚的蜥蜴，当它感到受威胁的时候会张开脖子周围的巨大颈部褶皱，并发出嘶哑的声音和用后腿站立。\n这个颈部褶皱由延长肋骨支撑着。\n它们像微型T-Rex一样奔跑于两足之上。\n这种动物是野生动物摄影师们喜爱的对象以及北领地地区的象征物。","label":"鬃狮蜥","summary":"澳洲的一种蜥蜴，在遇到危险时展开戏剧性的脖环作为防御手段."}'
  pet.gerbil:
    label: 沙鼠
    summary: 有长毛尾巴的一种小沙漠啮齿类哺乳动物
    info: '{"hint":"来自沙漠地区的袖珍宠物，一种小型啮齿动物（Meriones unguiculatus）","info":"蒙古沙鼠原产于中国和蒙古的干旱草原地区。\n它适应了荒漠生活；几乎不需要喝水，因为它能很好地从食物中获取水分并加以利用。\n它们群居且白天活动性高，因此是适合观察的小型伴侣动物。\n喜欢挖掘隧道，并需要足够的底材来满足其自然行为需求。",'
  pet.goldfish:
    label: 金鱼
    summary: 一种饲养在水族箱中的金色或橙色鱼类。
    info: 金鱼是全球广泛养殖于水族箱中的一种驯化鲤科鱼类。它有数百种颜色和鳍型的变种，是一种常见的观赏性淡水鱼。
  pet.guinea_pig:
    label: 豚鼠
    summary: 一种毛茸茸的小型啮齿动物，是孩子们喜爱的宠物。
    info: 家养豚鼠是一种来自南美洲的社会性啮齿类动物。它们会发出沙哑的声音，性格友好且喜欢与人互动。
  pet.hamster:
    label: 金仓鼠
    summary: 一种脸部鼓胀的小型可爱啮齿动物。
    info: 金仓鼠是一种受欢迎的宠物。它们会把食物储存在脸颊里，主要在夜间活动，并且喜欢在滚轮上奔跑。
  pet.hedgehog:
    label: 非洲侏儒豪猪
    summary: |-
      当感到被威胁的时候能够把自己滚成一个小球体的一种微型带刺吃害虫类食物的哺乳动物。这种特性常见于欧洲刺猬(Erinaceus europaeus)，但这里特指的是另一种类似物种——Telfair's hedgehog 或称作 Telfair 的欧亚刺猬变种等非典型代表成员之一。不过根据上下文描述更可能是指向了与之相近却属于不同科属分类下的其他种类如：African pygmy shrew 等待进一步确认具体所指的是哪一类群落中的个体对象才好做出最终判断结论！总之无论如何都表明这是一个具有自我保护机制并且非常可爱迷人的小小生灵呢～^_^~!@#$%^&*()_+{}|":<>?[];',./`~-_=+

      综述部分简明扼要地概括出了该词条目内容要点所在之处啦！！信息栏里则详细介绍了其生活习性和身体特征等方面的知识点哦^-^!!@#￥%……&amp;amp;&lt;/p&gt;
      </body>
      </html>
    info: '{"hint":"小型多刺食虫动物，受威胁时会蜷成球状（Echinops telfairii）","info":"非洲侏儒豪猪是一种受欢迎的异国宠物，在世界各地都有饲养。\n它的背部有五千到七千根中空角质尖刺。\n受到惊吓或攻击时就会卷缩起来形成一个密不透风的小圆球。\n它们是夜行性生物，并且需要轮子来移动；每晚可以跑上至五公里。","label":"非洲侏儒豪猪","summary":"一种体型小、浑身长满棘刺并能将自己团成一团以抵御危险的昆虫捕食者。'
  pet.hermit_crab:
    label: 寄居蟹
    summary: 住在借用贝壳里的小型节肢动物，一种异国风情的家庭宠物
    info: |-
      {"hint":"携带借来的贝壳的陆生蟹（Coenobita）","info":"寄居蟹是一种甲壳类动物，没有自己的坚硬外壳，并用空蜗牛壳保护柔软的身体。当它长大时会寻找更大的贝売。干燥环境中的寄居蟹被当作宠物饲养；它们是社会性的并群居生活。
      在自然环境中生活在沙滩和热带潮间带地区。
  pet.iguana:
    label: 鬣蜥
    summary: 一种体型较大的热带美洲绿色蜥蜴，常被当作异国风情的小动物养在家里
    info: |-
      {"hint":"来自中美洲的大型草食蜥蜴，作为宠物饲养（绿鬣蜥）","info":"绿色鬣蜥是一种南美大型爬行动物，在野外可长到两米。
      它们是严格的植食动物；在人工环境下需要多样化的蔬菜和UVB照明设备来维持健康生活状态。\nmiddle
      它头部顶部有一个对光线敏感的第三只眼睛——顶眼。
      如果得到适当的照顾与环境条件支持的话它可以活超过二十年以上的时间跨度内保持良好生存状况。
  pet.koi:
    label: 锦鲤
    summary: 一种在花园池塘中饲养、具有鲜明色彩的装饰用鱼类
    info: '{"hint":"观赏品种的鲤鱼，因其鲜艳的颜色而被培育（学名：Cypri nus c arp i o）","i nf o ":["锦鲤是普通鲤鱼的一个装饰性品系，在日本自十七世纪以来就被人工选育。\n存在超过一百种颜色变体；最珍贵个体售价可达数万英镑。"]'
  pet.leopard_gecko:
    label: 豹纹守宫
    summary: 一种小型带斑点、夜间活跃的小型蜥蜴类动物——适合初学者饲养的理想宠物
    info: |-
      豹纹守宫原产于巴基斯坦和阿富汗的沙漠地区。与大多数壁虎不同，它没有脚趾上的吸盘；不能在玻璃上爬行。
      它们有可活动的眼睑，在壁虎中较为罕见。
      它可以将脂肪储存在尾巴里，并能断尾（自切）以求生存，之后新尾巴会重新长出来。
  pet.lovebird:
    label: lovebirds
    summary: 一种形成牢固配偶纽带的颜色艳丽小鹦鹉。
    info: |-
      {"hint":"小型色彩鲜艳的鹦鹉，成对结伴（爱情鸟）","info":"阿加波尼斯鹦鹉是一种来自非洲的小型鸟类，以其强烈的配对关系而闻名。\u005c
      这对伴侣会互相喂食、清洁并共度大量时间；因此得名爱侣鹦鹉。
      共有九个种类，在颜色和分布上有所不同。
      雄性和雌性都能模仿声音。","label":"lovebirds","summary":"一种形成牢固配偶纽带的颜色艳丽小鹦鹉。
  pet.mandarin_fish:
    label: man dar lin
    summary: 世界最丰富多彩、具有迷幻图案的小型海洋鱼类
    info: '{"hint":"色彩极其丰富的珊瑚礁小型鱼类（华丽狮子鱼）","info":"绚丽的曼达林是印度洋和太平洋地区的一种小海水鱼，拥有动物界中最引人注目的颜色之一。\r它没有鳞片；其鲜艳的颜色由含有色素（色素除了细胞）及荧光化合物组成特殊细胞形成。");\r它们以微小活体猎物为食，并且非常难以饲养。\r该物种受到国际公约保护。'
  pet.mini_pig:
    label: 迷你猪
    summary: 作为宠物饲养的小体型家庭用猪
    info: 迷你猪（茶杯或微型品种）是家养猪的小型培育品系。它们聪明、爱干净，能学会像狗一样的技巧；不喜欢阳光直射（因为没有汗腺），会滚泥巴来调节体温。许多主人惊讶地发现他们的小猪长大后比商家承诺的要大。
  pet.moon_jellyfish:
    label: 月亮水母
    summary: 一种能发出冷光、几乎完全通透并被人工圈养于特殊设备中的海洋无脊椎动物
    info: '{"hint":"小型生物发光水母，饲养在专门的鱼缸中（海月水母）","info":"月亮水母是常见的一种水母，并且对人类相对安全。\r它几乎是透明的，在其体内我们可以看到四个圆形生殖腺体。过去很难将其养活；如今已有特别设计成环形结构的容器来养殖它们——称为克雷塞尔系统(CreiseI system)，这使得长期维持这些脆弱生命成为可能。这种寿命大约为一年到一年半左右。");'
  pet.mouse:
    label: 小白鼠
    summary: 一种小型的、经过人工培育的小型啮齿类哺乳动物，常用于做家庭宠物或实验室研究对象
    info: |-
      白化家鼠是被驯化的老鼠，既作为实验动物也用作观赏宠物。它们很聪明且能快速学会迷宫和技巧。
      寿命为两到三年，并属于群居性动物；建议以群体方式饲养。
  pet.mynah_bird:
    label: 八哥
    summary: 一种具有非凡声音模仿能力的亚洲讲话椋鸟
    info: "{\"info\":\"山八哥是一种椋鸟科的鸟类，以其出色的模仿人类说话的能力而闻名。它能以惊人的准确性模拟人声语调、口音和语气。\r\n这种鸟原产于东南亚及印度地区，在人工饲养下可以学会数百个单词和短语。\",\"hint\":\"会说的人造星群家族亚洲鸟类（学名：Graçaca reliģioza）\",\"label\":\"八哥\"}"
  pet.oscar_fish:
    label: 奥斯卡
    summary: 一种亚马逊地区的大型聪明的慈鲷能够对主人做出反应
    info: '{"hint":"来自南美的大型智能慈鲷（Astronotus ocellatus）","info":"奥斯卡鱼是一种体型较大的南美慈鲷，以高智商和能认出主人而闻名。\n它需要一个大的水族箱(至少200升)，并定期喂食活饵或冷冻食物。\n成年个体长度超过35厘米，并且寿命可达15年。\n有时它的行为更像狗而不是鱼类；当主靠近时会游到玻璃前迎接。",'
  pet.parrot:
    label: 鹦鹉
    summary: 一种能模仿人类声音的彩色鸣鸟。
    info: 虎皮鹦鹉是最广泛饲养为宠物的一种鹦鹉。它们很聪明、喜欢社交，能够模仿各种声音和词语。
  pet.prairie_dog:
    label: 草原犬
    summary: 一种生活于北美大平原上的社交型掘洞啮齿兽
    info: "{\"hint\":\"来自北美草原的群居啮齿动物（地松鼠）\",\"info\":\"草原犬是一种生活在北美的社会性啮齿类哺乳动物，它们居住在广阔的地下殖民地中。\\u005c\n这种生物通过复杂的声学系统交流，科学家认为这是仅次于人类语言最复杂的一种动物语音形式了。\n因为发出类似狗叫的声音来警告捕食者而得名dog(意为“小狗”)；\r\n其群体是数十种其他物种的关键生态系统组成部分。"
  pet.quail_pet:
    label: 宠物鹌鹑
    summary: 一种小巧、易于照顾的小型室内宠物鸟
    info: |-
      日本鹌鹑是一种小型鸟类，既可以作为宠物饲养也可以产蛋。它们体重只有约100克，并且是体型最小的家养禽类之一。
      雄性会发出‘pi pi pit’的声音鸣叫；雌性的叫声则较为安静柔和。
  pet.rabbit:
    label: 兔子
    summary: 长耳朵的毛茸茸宠物。
    info: 家兔是一种受欢迎的家庭饲养动物，有着柔软的皮毛和标志性的长耳。它们以干草、蔬菜和新鲜青草为食。
  pet.rat:
    label: 家庭鼠
    summary: 一种聪慧且忠诚的人工驯养啮齿类哺乳动物
    info: '{"hint":"作为聪明而富有感情的宠物饲养的家庭鼠（褐家鼠）","info":"家庭老鼠是啮齿动物中最智能的一种；它们可以学会对名字做出反应并完成复杂的任务。\n它具有高度的社会性，与人类和其他老鼠之间形成牢固的情感联系。\n寿命为两到三年，在亚洲它是机智和繁荣的象征(中国生肖)，并且由于其敏锐嗅觉在非洲帮助探测地雷。");'
  pet.red_eared_slider:
    label: 红耳龟
    summary: 一种带有耳部红色斑块的人气淡水宠物乌龟
    info: "{\"info\":\"红耳龟原产于北美洲，是世界上数量最多的圈养爬行动物。其耳朵后方独特的红色条纹使其与其他类似物种区分开来。\r\n它需要水生区域和干燥的UV灯照射下的晒太阳的地方。\r\n寿命超过三十年；许多被释放到野外，在那里它们成为入侵性物种。"
  pet.sea_horse_pet:
    label: 水族箱中的海马
    summary: 海水缸中养殖的一种奇特而迷人的鱼类——海马
    info: 海马是世界上最难在人工环境中饲养的海洋生物之一；它们需要活饵（如丰年虾、樱蛤）和安静的生活环境。雄性会用腹部囊袋孕育幼崽，一次可产下数百只小海马。它们成对生活，并终生保持忠诚关系。
  pet.sugar_glider:
    label: 蜜袋鼯
    summary: 一种利用身体上的薄膜在树间飞行的小型澳洲哺乳类
    info: |-
      蜜袋鼯是一种小型澳大利亚有袋动物，能够在前肢和后肢之间张开的膜（飞皮）的帮助下滑翔。它拥有巨大的夜间眼睛，并且非常社交；孤独会令其痛苦。
      它们通过吠叫、嘶鸣以及类似猫叫声的声音进行交流
      它是夜行性动物，在圈养条件下需要陪伴。
  pet.tarantula:
    label: ptakopysk
    summary: 一种大型毛茸茸、适合冒险者的异宠蜘蛛
    info: "{\"info\":\"玫瑰豹蛛是一种受欢迎的入门级宠物蜘蛛，因其性情温顺。最大的种类是巨人捕鸟蛛（Goliath birdeater），它是世界上体型最大的蜘蛛之一，腿长可达超过30厘米。\r\n其毒液与蜜蜂相当，并不会对健康的成年人构成威胁。\r\n巨蟹类可以活到20至30年之间。"
  pet.tortoise_pet:
    label: 陆生龟
    summary: 一种长命百岁的陆地爬行动物，可陪伴一生的好伙伴
    info: "{\"hint\":\"小型陆龟，作为长寿宠物饲养（泽西属）\",\"info\":\"赫尔曼陆龟是一种体型较小的地中海地区的乌龟，在人们家中很受欢迎。\\u005Cn它们的寿命可以超过一百年；常常比主人活得更久。\\u005Cn在冬季会冬眠，并且其新陈代谢几乎停止下来。\\u005Cn捷克共和国的一些种类如果没有许可是禁止繁殖和养殖的。\r\n\"}"
  pet.turtle:
    label: 乌龟
    summary: 一种行动缓慢、有坚硬甲壳的动物。
    info: 红面陆龟是一种受欢迎的家庭宠物。它们生活在可以登陆的水族箱中，并在紫外线灯下晒太阳取暖。
