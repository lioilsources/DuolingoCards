lang: en
pivot: false
title: Pets
cards:
  pet.cat:
    label: cat
    summary: Independent house pet with soft paws.
    info: The domestic cat is a member of the Felidae family kept as a pet. It is known for its agility, cleanliness, and independent nature.
  pet.dog:
    label: dog
    summary: Loyal household pet, friend to humans.
    info: The domestic dog is a tamed wolf and humanity's oldest domesticated animal. There are over 400 breeds recognized, and it is known as 'man’s best friend.'
  pet.goldfish:
    label: goldfish
    summary: An orange-gold fish kept in an aquarium.
    info: The goldfish is a domesticated carp raised in aquariums around the world. It exists in hundreds of color varieties and fin types.
  pet.guinea_pig:
    label: guinea pig
    summary: Small furry rodent, beloved pet for children.
    info: The domestic guinea pig is a social rodent native to South America. It makes chirping sounds, is friendly, and enjoys human company.
  pet.hamster:
    label: golden hamster
    summary: A small cute rodent with cheek pouches.
    info: The golden hamster is a popular household pet. It stores food in its cheeks, is active mainly at night, and enjoys running on a wheel.
  pet.parrot:
    label: parrot
    summary: Colorful bird capable of mimicking human speech.
    info: The budgerigar is the most widespread species of parrot kept as a pet. It is intelligent, social, and can imitate sounds and even words.
  pet.rabbit:
    label: rabbit
    summary: Furry pet with long ears.
    info: The domestic rabbit is a popular household pet with soft fur and distinctive long ears. It feeds on hay, vegetables, and fresh grass.
  pet.turtle:
    label: turtle
    summary: Slow animal with a hard shell.
    info: The red-eared slider is a popular pet turtle. It lives in aquariums with access to land, where it basks under a UV lamp.
