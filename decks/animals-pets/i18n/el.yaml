lang: el
pivot: false
title: Σπίτι Ζώα Pets σε μορφή φλάσχου!
cards:
  pet.angelfish:
    label: scalari
    summary: Γραθωδής τροπική χελώνα με επιμηκείς νεροπτέρες.
    info: "To Skalάριο είναι μία από τις πλέον δημοφιλείς ψύχτρες λόγω του άκρως συμμετρικού και γραθώδους σχήματος φορμαρισμένου σε τρίγωνο και των μεγάλων νεροπτερών του·\nΠροέρχεται από την περιοχή του Amazonas και απαιτεί θερμό νερό (25 - 27 βαθμούς Celsius)· \nΕίναι εξεζητημένο και μπορεί να φάψει μικρότερα ροϊκά,\nΣτη Γιαβανέζια το εντυπωσιακό Scalari ήταν το πρώτο τροπικό είδος που εισήχθη το 1906."
  pet.axolotl:
    label: Αξολότλ
    summary: Πέσσωπη του Μεξικού που ζει πάντα στο νερό με εξωτερικές φυλλώματα.
    info: Η αξολότλ είναι υδρόβια μεγάλη πέσσωπή του Μεξικού που διατηρεί νευρώμορφο σχήμα καθ' όλη της τη ζωή (νεοτενία). Διαθέτει γνήσιες εξωτερικές φυλλώματα και λεπτομερές «χαμόγελο».Είναι ενδημικό βιοτικό είδος του λιμναίου Χοϊχιμίλκο στο Μεξικό και είναι κρισιμότατα επιζήμιο.
  pet.ball_python:
    label: Ball Python
    summary: Ένας ελκωδώς φθινό μεγάλο γλίστρο που σχηματίζει μια σφαίρα.
    info: Η Ball Python προέρχεται από τη δυτική και νότια Αφρίκη όπου βρίσκεται σε λύματα και δάση.
  pet.bearded_dragon:
    label: Πογκόνα
    summary: Δημοφιλής εξωτικός σκύλος από την Australie.
    info: Ο Πογκόνα βιτεπίσης εμφανίζει χρωστικές αλλαγές και φουσκώνει τα μάχαιρα για να δείξει συναισθήματα ή προβολή. Δείχνει υποδούλεια λερωντας το χέρι - arm waving.
  pet.betta_fish:
    label: betta
    summary: Πολύχρωμη λυμπάβορε ρόδη με εμφανείς πλοΐες από την νοτιοανατολική Ασία
    info: |-
      Η Betta είναι μια λυμπάβορε ρόδη που αντλεί νέφελο και ζει στα βαθύγεως τζιχάκια γεώσπορου στην Ταϊλάνδη·
      Οι αρσενικοί φυσική δεν είναι φιλικοί μεταξύ τους · απ' εκεί προέρχεται το όνομα «Σιαμέζικος πολεμιστής»;
      Από την αναπαραγωγή προέκυψαν εμφανείς μορφές με τεράστιες, περιστρεφόμενες πλοΐες;
  pet.blue_tongue_skink:
    label: Σκινκ με πράσινη γλῶσσα
    summary: Πανίδα απ' την Γερμανία μὲ ἀπὸ τὴν γλὼσσα ποὺ ψῆνε.
    info: |-
      To Skink με την πράσινο γλώσσα είναι ένας κόκκινος αυτοφύγων σκουΐμπα χαρακτηριστική λευκή φθέγχα
      Εξοβελίζει τη γλώσσα του να δείξει τους προϊδρίτες·
      Η λευκή ρούχο είναι αποτρεπτική,
      Αυτός είναι βλαχοπαραγωγός, αδρός και αργός ζῷο που αγαπάται ως σκύλος.
  pet.budgerigar:
    label: Αντουλκα
    summary: Το πιο δημοφιλές πουλί σε κάγχη του κόσμου.
    info: Η αντουλκα είναι το πιο δημοφιλές ζώο σε κάγχη μετά το χήναρο· βρίσκεται φυσικά νωπό γύρω από λευκό - πράσινο ροζ ; τα ψυχρά ως προς το υψομέτρο , το όνομα «βλεγμα» · εξελίχθηκαν από την ανδουλκα .
  pet.canary:
    label: Nifas
    summary: Μικρός τραγουδιστής πελάργος αναπαραχθέν για την ξεχωριστή φωνή και το λαμπρό μπλε.
    info: '{"hint":"μικρό τραγουδιστής πελάργος αναπαραχθέν για έξω φυση και λαμπρό μπλε χρώμα","info":"Ο νίφα είναι από τα Γαλαϊκά Νησιά και διαβιούσε σε βροχερά περιοχές από το Δ’ αιώνα από Ισπανούς εξερευνητές\nΠολλαπλασιαζόμενος ημιψυχροκλιματικά ήταν οι Rollers, Water Slagers, reds & whites\nΑνδρικά τραγουδιστές θεωρούνται ικανοί να αναπαράγουν μελῳδίες· Μαθαίνουν κομβώντας \"fragmenti\",\nΣτην Ελλάδα υπήρχε τον 40'' άνθρωπος που ψάχνει για CO₂ στα μεταλλεία."}'
  pet.cat:
    label: Γάτα
    summary: Συντροφιάς με μαλακές πατούσες.
    info: '{"hint":"η ιθαγενής γάτα (Félis félinus) που είναι συχνό κομπλέ μιστραλικών","info":"Η Γάτα των αφενδικών είναι χρωματιστό φύλο της διαβατικής νομαδικής βοσκής που λατρεύεται ως συντροφιά.","label":"Γάτα","summary":"Αξιόπιστος συντροφιάς με μαλακές πατούσες."}'
  pet.chameleon:
    label: Χαμαιλέον
    summary: Θερμάκωνος με αυτόνομα κινούμενα μάτια.
    info: Ο χαμαιλέοντας είναι μια από της θερμάκωνου που δύναται να κυβεργήσει σχηματιζώντας φθορίδια για να λαμπρίσει το βρογχικό του ύφος· αλλάζει όψη για να εξαρτηθεί απ' τις συναισθηματικές του καταστάσεις, ρίχνοντας πρώτα για να κρύβεται.
  pet.chinchilla:
    label: Χινχίλα
    summary: Νότιοϊβηρικός ποδηγόροφος µε την πιο συµπυκνωµένη βάζο.
    info: Η χινχίλα είναι ένας ποδηγόροφος από τους Άντες με καθορισμένως συμπύκνωτο βάζον – γι’ αυτή να φυτώνουν δεξιά λουλούδια.
  pet.clownfish:
    label: Κλάουν
    summary: Πορτοκαλί ψάρι που ζει σε συμβίωση με αμφιβρύχωση.
    info: Το κλάουν οκυπατό είναι μικρό ψάρι που βγαζε της αμφιβρύχωση στο νότιο Indopacific για να δώσει φιλοξένηση από τις αμφιβρύχωση.Η αμφιβρύχωση το προστατεύει με λεπτή αδρανή προστασία , ενώ το χρησιμοποιεί για να καθαρίσει.
  pet.cockatiel:
    label: Νύμφη
    summary: Μικρό αυστραλιανό παπαγαλάκι με κρόσσο, δημοφιλές για την ηχητική του ικανότητα.
    info: 'Η νύμφη προέρχεται από την Αυστραλία και βιώνεται σε εξωράϊκους χώρους και δάση.Οι μασκulinia είναι φθογγοδήτες για την απομίμηση : μπορούν να μάθουν τραγούδια , μελωδίες και λέξεις .Είναι κοινωνικό ζώο και σε φυλακισμό εύκολα συνδέεται με τον ιδιοκτήτη.'
  pet.corn_snake:
    label: panthera gutatt
    summary: Εύθυμο μπλε - φως λεβεντώνα
    info: Η Panthera guttata προέρχεται από τη νοτιοανατολική Ηνωμένες Πολιτείες όπου βρίσκεται σε γεωργικά εδάφη και δάση.
  pet.crayfish:
    label: \
    summary: \
    info: '{"hint":"\xce\xa6\xcf\x85\xe4\xec\xd7 \xc0\xea\xf9\xb1\xee\xba\xed\xfd\xeb\xfc \'
  pet.crested_gecko:
    label: Γεκόν Γεκόν
    summary: Νύχτερινο γεκόν με εμφανή ράφι όψεων
    info: |-
      Το Gekon χόχλατύ προέρχεται από τη Νέα Κάλεδονια και είχε γίνει δεκτή συμβολή μόνο φθάνοντας νωρίς του '80s λόγω της βιώσιμης αξιολόγησης
      Δεν υπολογίζει σε ειδικό φωτισμό UVA,
      Εφαρμόζει σε φρούτα και έντομα
  pet.degu:
    label: degue
    summary: Μικρό χιλιανό ψυχροϋψίδα με κοινωνική συμπεριφορά.
    info: To degen είναι ένα μικρό χλωδάτο που συγγενές της κύστες απ' την Χιλή· δραστηριοποιείται για να φώς και είναι πολύ κοινωνικό - βλάπτεται λόγω μόνης · εμφανίζει ευθραβεία σχετικά με την σακχαρώδη ΔΣΠΔΓ ; σε κλειστό περιβάλλον , δεν πρέπει να φάει γλυκό φρούτο .
  pet.discus_fish:
    label: Σκαλάρι Δίσκο
    summary: Πολύ ωραίο όρθιο ψάρι που έχει τον τίτλο «Βασιλιά» του ακουαρίου.
    info: |-
      Τα δίσκοι Συμφύζων είναι μεγάλα ψάρια κυκλικής σχήμης που βρίσκονται τώρα από τον νδέβελ γεμάτο λαμψιάριθμα φως·
      Είναι από τα πιο αξιόλογα ροΐστρα ακουαρίου, απαιτούν ακριβή χημεία νερού και θερμοκρασία 28–32°C
      Οι νεαροί ψάρια τρέφονται με το εκκριμένο από την ξεροϊδρωτική τους επιδερμίδα—ένα σπάνιο φαινόμενο.
  pet.dog:
    label: Σκύλος
    summary: Πιστός σύντροφος, φίλος του ανθρώπου.
    info: '{"hint":"το σπίτι του κυνός ή γερμανική ελάφη που χωδαιώθηκε από τον άνθρωπο","info":"Ο μέγας λύσσας δεν είναι φυσικό βάζοντας νερό στο σχήμα - αυτό είναι το πιο παλιό ζώο που υποβλήθηκε σε εξασκηση από τον ίδιο τον Άνθρωπο.", "label": "Σκύλος", "summary": "Πιστός σύντροφος, φίλος του ανθρώπου."}'
  pet.dove_pet:
    label: Πτέρνα
    summary: Λευκή πτέρνα που φυλάγεται ως εξατομικευμένο ζώο ή όταν αφήνεται.
    info: Η λευκή πτέρνα είναι ένας καλλιεργημένος τύπος βράχου για να φέρει μόνο ασβεστωποίητο χρώμα. Δεν διψάζει σε σχέση με τα παπαγάλια - δεν διδάθηκε και δεν κλαίει.
  pet.electric_eel:
    label: Σούση
    summary: Δυτική αμερικανική ρίψη παράγει θερμικά φθοριζόντα
    info: |-
      Η ηλεκτρική σούση δεν είναι παγωμένο ψάρι αλλά κοντός του νυχτερίδα μπρούμης από τη βόρεια Δυτική Αφρική·
      Μπορεί να γεννήσει ιώδες φθοριζόντα λεβιτούμενο ή αντίσταση,
      Πρέπει να αναπνεύσει αέρα και να αναδύεται συχνά στην επιφάνεια
      Το μεγαλύτερο μέρος του σώματός του αποτελείται από οργανικά έξω από μεταμορφωμένο μυϊκό ίδιο.
  pet.ferret:
    label: Σκυλίτσα
    summary: Παίζει με προεγχωρημένο laurids, νοσταλγικό και αγαπημένο.
    info: |-
      Η σκυλίτσα είναι η προεγχωρημένη μορφή του λιόθρη από κάποια χιλιάδες χρόνια για να διώχνει φύσαλες
      Είναι νοσταλγική και παίζει - βρίσκει τον ύπνο της 14–18 ώρες την ημέρα,
      Έχει υψηλή αξία στην αναπαραγωγή της από τις οσμωνεϊκές αδενώσεις.
  pet.frilled_lizard:
    label: agama límpa
    summary: Αυστραλιακός ζωϊκός πού σχηματίζει μέγα γρουβι το νήθρι.
    info: Η Agama λύμπου είναι αυστραλιακός θηλάζων πού όταν κεφαλαιώνεται σχηματίζει μέγα γρουβι το νήθρι φορτωμένο με διατεταγμένους βραδιάδες.
  pet.gerbil:
    label: πίσκομη
    summary: Μικρό παραθαλάσσιο ζῷο µὲ ἀµφὶ ὑψῶς.
    info: |-
      Η πίσκομηλ Μεριόνς επαγγέλματος αυξά στους μαύρους βουνωδείς χώρους της Νορβήγια και Γιαπωνία
      Προσαρμοσμένο για να διαζευχθεί στην παραθαλάσσια φύση· λίγο πολύ πίνει, γιατί επεξεργάζεται πολύ καλά το νερό από την τροφή.
  pet.goldfish:
    label: Κόκκινη τζίγκα
    summary: Πορτοκαλίψια ψάρι που βαλώνεται σε ακβί.
    info: '{"hint":"μικρό χοντρό νερό με λουλούδια που φυσά σε ακβία (Carrassius auratus)","info":"Η κόκκινη τζίγκα είναι ένας δομήθηκε γεωχημές που βαλώνεται σε ακβία σε όλο τον κόσμο.Υπάρχουν εκατοντάδες ροές ως προς τα χρώματα και τα είδη των πτερυγίων.","label":"Κόκκινη τζίγκα","summary":"Πορτοκαλίψια ψάρι που βαλώνεται σε ακβί."}'
  pet.guinea_pig:
    label: '"caby"'
    summary: Πολύ μικρός αλεπούς – αγαπημένος σύντροφος για παιδιά.
    info: '{"hint":"μικρός αλεπού μαντηθέν ζώο που είδος των Caviaporcelles","info":"Ο σπίτιγκο κάβια είναι φυσική χώρα για να βρεθεί στη Δύση Αφρική .Εξοχικό διαταραχμένο , είναι φιλικός και λατρεύει να έχει ανθρώπινη συντροφιά.","label":"cavya","summary":"Μικρός τζιμπός αλεπούς - αγαπημένος συντροφιά για παιδιά."}'
  pet.hamster:
    label: '"κρεβάτζι"'
    summary: '"Μικρός χαριτωμένος σπονδυλωτός με'
    info: '{"hint":"μικρός σπονδυλωτός που φυσιολαγηθεί ως ζώο εύχαριστής αφέταιδος","info":"Το κρεβάτζι του γίνεται δημοφιλές μέλος της οικογένειας. Για να βάλει λίγο φαγητό στ'' αυτιά του, είναι ενεργός κυρίως τη νύχτα και αγαπάει να τρέχει στον τροχό.","label":"κρεβάτζι","summary":"Μικρός χαριτωμένος σπονδυλωτός με "'
  pet.hedgehog:
    label: Αφρικανό χελώνωπο
    summary: Πολύ μικρή βδελλοξυλία φαΐνοντας να είναι στρογγυλεμένη.
    info: Το αφρικανό χελώνωπου είναι δημοφιλές ξενόστραγο σύνθετο πάχυ το καλλιεργείται με λάβαρο γύρω σ’ όλο τον κόσμο.
  pet.hermit_crab:
    label: rak poustevnik
    summary: Μικρό crustacean που lives σε loaned shells, exotic domestic animal.
    info: "Το χελώνι της ερήμου δεν έχει παγκόσμιο κάθετρο απ' τη φύση γέφυρα με σκληρό λίβανο να βρίζει το μαλακό του παιδί σε κενές σαϊτίδες. \nΠαίρνει μεγαλύτερες σαΐτες όταν μεγαλώνει\nΟι suché rak poustevníky εξωτερικά είναι pet-friendly· είναι social media friendly και ζουν σε groups online.\nΣτη φύση ζουν σε beaches και tropical areas."
  pet.iguana:
    label: '"leguańs"'
    summary: '"Πολύ μεγάλο πράσινο είδος από την Tropicale Νorth America που αγαπάται όπως exotic animal."'
    info: |-
      {"hint":"μεγάλος φυτόφαγος θηλαστικό από την κεντρική Αμερίκη που διαιωνίζεται ως σύνθημα για εξώδοχο","info":"Το leguanas μπλέ ντε λα Γκαϊάνα είναι ένα μεγάλο βόρειο - αμερικανικό είδος που μπορεί να φτάσει τα 2 μέτρα\nΕίναι αυστηρός φυτοβόρος· σε αιχμαλωσία χρειάζεται ποικιλομορφία στα λαχανικά και φωτισμό UVΒ \nΈχει άλλο μάτι στην κορυφή της κεφαλής (παριεταλικό), ευαίσθητο στο φῶς ·
      Μπορεί να ζῇ πάνω από 20 χρόνια σε αιχμαλωσία , αλλά είναι απαιτητικό στο περιβάλλον και την περίθαλψη ."}
  pet.koi:
    label: Κάπριο
    summary: Διακοσμητικό κάπριο με ζωντανά χρώματα που φυλάγεται σε κήπους.
    info: Το κάπριο είναι ένας ακμόσχημο που στήθε το χέλι με βρύσε δυνατών ντυσμάτων για φωτεινά ροζ (Cyprius caryprio). Διαφορετικά λεγόμενα υπάρχουν πάνω απ' τις 100 ως προς τα χρώματα· τα πιο αξιόλογα άτομα πουλιούνται για χιλιάδες λεβάντες.
  pet.leopard_gecko:
    label: Γεκόνας λέοπαρδου
    summary: Μικρό γεκόνας με κηλίδες, νυχτερινό, ιδανικό για αρχάριους.
    info: Το γεκόνας λέοπάρδου προέρχεται από ερημικές περιοχές του Πακίσταν και του Αφγανιστάν. Διαφορετικά με τη συντριπτική πλειοψηφία των γεκών δεν έχει υποδούβες στα νύχια - δεν μπορεί να φθάνει σε βράχια.Έχει κινητές βλεφαρίδες , πράγμα αξιοσημείωτο για άλλα γεκόν.
  pet.lovebird:
    label: agapornis
    summary: Ένα λαμπερό νεαρό πελωρέτσι που σχηματίζει στενές σχέσει.
    info: Το Agapornis είναι ένα μικρό αφρικάνικο πελωρέτσι γνωστό για τη δυναμή σύγχυσης χρώμα και τους ισχυρούς δεσμούς φιλοπαθίας.
  pet.mandarin_fish:
    label: Μανταρίν
    summary: Πιο ψυχεδελικός οργανισμός στον κόσμο.
    info: Η Mandarinoka splendida είναι μικρό χαλύβδωτο θάλασσας από τη λεώφορο που διέχει κυματιζόμενο σχήμα φθογγού να βρίσκεται στο Indopacifico. Δεν έχει γρανάζια· το ρόϊσμα της προέρχεται από εξειδικευμένα κύτταρα με υψηλό ποσοστό ως chromatophores και fluoroscentes compounds. Τρέφεται αποκλειστικά με μικρά ζωντανά άγρια και είναι πολύ δύσκολο να φυλαχτεί.
  pet.mini_pig:
    label: Μεγάλος
    summary: Σκύλος φυσικής βοήθειας.
    info: Οι μεγάλος πρόβατο είναι ένα σκύλο χωμένη από τους κυνήγους για να διώξει λύχνους.
  pet.moon_jellyfish:
    label: Μηνίγ
    summary: Διαφανής βιοφωτεϊνική μῆνις που φυσίζεται σε εξειδικευμένες τάβες.
    info: '{"hint":"μικρό βιοφωτεϊνικό καλάθι που φυσίζεται σε εξειδικεύμένες τάβες νερού ζωής","info":"Η μηνίγ αποτελεί όνε για τις δημοφιλέστερες είδη μηνών και είναι σχετικά ασφαλής για τον άνθρωπο\nΕίναι σχεδόν διαφανής και λες να δεις τις τέσσερις κυκλικές γονάδες μέσα της\nΟ φύσισμα σε τάβες νερού ήταν μέχρι πρόσφατα πολύ δύσκολο· σήμερα υπάρχουν ειδικές κυκλικές δεξαμενές (Kreisels)\nΖει 12 - 18 μήνες."}'
  pet.mouse:
    label: Πάμψο
    summary: Μικρός κροσέλας που τραΐζεται χώρις να έχει αρνητικές επιδράσεις.
    info: Η λευκή σπίτια μύγα είναι η κροσέλα της πάμψου αφιερωμένη ως διαβόθρα για να βοηθήσει στην εξέταση φαρμάκων.
  pet.mynah_bird:
    label: '"myne"'
    summary: Ασιατικός κάβουρας με εξαιρετική ικανότητα να προσομοιώνει ήχους.
    info: '{"hint":"πτηνό ασιατικής πολυδεξίας των στρουμφών","info":"Η Μύνα είναι μια χήν κάβουρ γνωστή για να διαθέτει μία από τις καλύτερες φωνητικές λειτουργίες ανάμεσα σ'' όλα τα πτηνά\rΠροσομοιώνει τόνους, ακцεντικά και προφορά με αξιοπρεπή ακρίβεια\rΕίναι βουλισμένη στην Δυτική Ασία & την Ινδία\rΣε κλειστόχωρο μπορεί να μάθει εκατοντάδες λέξεις & φράσεις"}'
  pet.oscar_fish:
    label: '"oscar"'
    summary: Μεγάλος νηφαίος κιχλίδα από τη Γιαμανόνια.
    info: '{"hint":"μεγάλος νηφαίος κιχλίδα από τη Νότια Αмерική (Αστρωνώτους εξέλαιος)","info":"Ο Oskar παβύ χαρακτηρίζεται για μεγάλο συνολικό βάθος διαστάσεων λόγω της φυσικής του εμφάνισης - περισσότερο από 48cm – , και της διάρκειας ζωής του που μπορεί να φτάσει τα 769 ρολόγια."}'
  pet.parrot:
    label: psitaokis
    summary: Πολύχρωμο με δυνατότητα να φωνάζει.
    info: '{"hint":"πολύχρωμο που αντιγράφει ήχους και λέξεις ως συνήθη είδος τακσόβιου","info":"Η Andulka wlnkovana eina to perissotero yparxontos psitakiwn pou xrisimopoieite gia katoikidio.","label":"psitaokis","summary":"Πολύχρωμο με δυνατότητα να φωνάζει."}'
  pet.prairie_dog:
    label: ψουν πρειακό
    summary: Σπουγά που κοιτάζει τον ρόλο της στις πρειακές περιοχές.
    info: |-
      Το psoun πρειακό είναι κοινωνική σπουγά της Βόρειας Αμερικής που ζει μέσα στενών υπόγειων αυλακών
      Επικοινωνεί δύσκολο σύστημα φθογγών για να λέξει βιβλίο που οι επιστήμονες το χαρακτηρίζουν ως την πιο πολύπλοκη θηλαστική γλώσσα μετά τον άνθρωπο,
      Η έκδοση «dog» προέχει από την ξαφνική προειδοποίηση για προϊόντες.
  pet.quail_pet:
    label: Κρεμάλκα
    summary: Πολύ μικρό πουλί που ψηφίζεται σαν σύντροφος.
    info: Η Ιαπωνική κρεμάλκα είναι μικρό πουλί το οποίο φυσικώς χτίζεται για να δίδει αβγά ή σαν σύντροφος. Διαθέτει βάρος λιγότερο από 100 γρ., και είναι το μικρότερο πουλί που υπάρχει.
  pet.rabbit:
    label: Κουνέλι
    summary: Σκύλος με μαλλί και μεγάλα αυτιά.
    info: '{"hint":"παρτίδιο κουνέλι (Oryctolagus cuniculus) που φυλάγεται ως σκύλος","info":"Το εσωτερικό αμνόφαγο ζώο με τη λεϊβοθή νύχια διατρέχει για να βρει τροφή.","label":"Κουνέλι","summary":"Παχύψαρνο σκύλος με μεγάλα αυτιά."}'
  pet.rat:
    label: ΔOMIKΉ KATINAS
    summary: EΞUYPSILÓS ME TO EIDOS TON ZWYNAMENON AFENTIKEPOU KE OPRAKTICA.
    info: '{"hint":"παρόμοιο με την ευγενή σκύλους ζώων που φέρεται ως αφεντικά και δίδει λύσεις για να βεβαιωθεί","info": "Η ΔΟΜΙΚΗ ΓΑΤΕΣ ΕΊΝΑI ΜΈΡΟΣ ΤΩN ΠΛΕΓΜΑΤOΠAΘHTEPΏN ΖWYME;","label": "ΔOMIKΉ KATINAS","summary": "EΞΥΨΗΛΌS ME TO EIDOS TON ZWYNION ΑΦΗΝΕTAY KAIA OPAKTIKA."}'
  pet.red_eared_slider:
    label: Turtle
    summary: Πολύ δημοφιλής αξιοθρήνητη υδρόβια όψεων ως ύποπτος.
    info: Η χελώνη Trachemys είναι αυτόχθονας του Βορειοδύσκωπου και παγκόσμια δημοφιλής σε φυλάκιση λέβητα. Διακρίνεται για να μπορεί να βρεθεί ένα ροζ ψηφίο πίσω από το αυτί.
  pet.sea_horse_pet:
    label: Ιπποκάμπος
    summary: Ίπποκαμπος σε θαλασσινό ακουαρίουμ.
    info: |-
      Το ιππόκαμψιν είναι μεριάς από τους πλέον δύσχρητους ωθήφυγες να φυλαχτούν σε κλειστό γύρω ; απαιτεί βιώδη λιβανιζόντα(αρτεμιΐδες , μισιδίδες ) και ήσυχο περιβάλλον .
      Ο αρσενικός φέρνει τα παιδιά του σ' ένα σακίδιο στο σώμα του ; γεννά χιλιάδες παιδιά μιας.
  pet.sugar_glider:
    label: Πεταούριδα
    summary: Μικρό αυστραλιάνικο σαγμωτό που 'πλαΐζει' μεταξύ των δέντρων.
    info: Η πεταούριδα είναι ένα μικρό αυστραλιάνικο σαγμωτό του γένους Petauridae και διαθέτει χημική βλέπουσα φτώχεια να «πλαϊτεί» αφ’ εξακριβώς λόγω της παταγίας - μιας ελαστικής βλέπουσας – που είναι τεντωμένη μεταξύ των προσωπικών της ποδιών.
  pet.tarantula:
    label: Pterinobiosis
    summary: Πολύ μεγάλος τριχωτός σπονδυλώματος εξωτικός σύντροφος για τους θαρραλέους.
    info: |-
      Το πτερόπισκα ροζ είναι δημοφιλές τάραντουλ για αρχάριους λόγω η σύμβασής του με καθ’ ευνοϊκό νοήμα.
      To μεγαλύτερο είδος, Γιγαντιαίο Pterinothripsis, είναι το μεγαλύτερο σπονδυλώματος στον κόσμο με φαγητό μήκος πάνω από 30cm
      Η βλάστηση του είναι συγκρίσιμη με την από την απόψη της και για έναν υγιή ενήλικα δεν είναι εξαιρετικά επικίνδυνη.
  pet.tortoise_pet:
    label: land turtle
    summary: Long-living land turtle companion.
    info: |-
      Η χελωνία Χέρμπαν είναι μικρή νότιου και ανατολικού τζάγκας που δημοφιλής συντροφιά για λαβύρινθο
      Μπορεί να φτάσει τα πάνω από 100 χρόνια· βγαίνει από τον κύριο της,
      Εξώχωρα υπνοδαμάζει τον wintertime , ώστε το metabolitismos να σχεδόν stop.
      Στη Γερμανία η καλλιέργεια χωρίς άδεια είναι forbitden για κάποια species.
  pet.turtle:
    label: Kechris
    summary: Grigoros zoos me isxuros ramfos.
    info: '{"hint":"μικρή υδατόθηλος κεχρί με τσάνγκ ντζου συντροφιά επί γένου Εμύδαι","info":"Η Trachemys scripta elegans είναι δημοφιλής πετρίτα αξιοπροσοχής. Ζει σε βαθύ λιβανωτό φιλτροκαθαριστικό σύστημα με πρόσβαση στην ξηρά, όπου θερμαίνεται χάρη σε UVA/UVC λάμψη.","label":"Κεχρίς","summary":"Γρήγορος ζώος με ισχυρό ράμφος."}'
