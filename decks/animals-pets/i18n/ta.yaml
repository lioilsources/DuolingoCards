lang: ta
pivot: false
title: நுகர்வோம் பிராணி
cards:
  pet.angelfish:
    label: இடம்
    summary: ஓட்டைகளை ஊட்டுவதற்கு ஐஸ் ஹீட்டர்.
    info: அமேசான் பகுதியிலிருந்துவரும் ஸ்கலார் அழகான மட்டையணி வடிவின் ஆக்சுவாரியம் உறப்பிற்குள் எஃகு ஒன்று; ஏழை ஜோடி முட்டைகள் மற்றும் ஓட்டைகளை ஊட்டுவதற்கு ஐஸ் ஹீட்டர் பயன்படுத்தப்படுகிறது.
  pet.axolotl:
    label: ஆக்ஷோலாடில்
    summary: எக்ஸோஹிமில்கோ ஏரியில் இருந்து வரும் மெக்சிகோவில் உள்ள ஹைட்ரோஜென் ஃபங்க்ஷன் கொண்ட தண்ணீர் பசி நதவளப்பற்றும்.
    info: |-
      அக்ஸோலாடில் மெக்சிகனும் ஒரு தண்ணீர் பசி நதவளப்பற்றும் அழகான உயிரினமாகும்
      இது வாழ்வியல் இளம் எஃகுகளை ஏறக்குறைய ஓர் ஜொல் டூஸ்(Neoteny) ஐ கொண்டுள்ளது,
      இது தெளிவான வெளிப்புற ஞாலிழைகள் மற்றும் தனிப்பட்ட 'சிரிப்பு' முக வடிவமைப்பை கொண்டுள்ளது.
  pet.ball_python:
    label: கார்டியோ ரஜன்
    summary: ஓஹ்ரூஜீன் ஷௌல் ஫ுல்ஜி஝் ஹௗஸ்
    info: "கார்டியோ ரஜன் தெறி முதல் பசில் கடவுள் எப்படி இயங்கும்? \nஇது ஒரு சண்டை வழியின் நடுவிற்கு உள்ள அஸ்ஸாஃப் ஐ ஏற்றுக்கொள்ளும்\nஅது ஓஹ்ரூஜீன் ஷௌல் ஃபுல்ஜிழ் ஹௗஸ் என்பதை குறிப்பிடும்"
  pet.bearded_dragon:
    label: வோயுசாட் டிரக்
    summary: ஓஷனின் பெரிய மலர்நிலை இளஞ்சறுக்கு.
    info: "மத்திய வோயுசாட் டிரக் Pogona vitticeps எனப்படுவது மலர்நிலை இளஞ்சறுக்கு ஆஃப்ளஸி ஒன்றாகும்\nஇதன் உணவு அழுத்தம் ஏற்படுத்தும் ஊடு ஓட்டம் மற்றும் ஹீரோஜன் ஐஎம்ஃஆர்(HIMR) \nஅது கூட்டு ஜீவன் கொண்டது;   \nஇது பௌஹெர்ஸ்,  காய்கள் மற்றும் பழங்களை உண்ணும்."
  pet.betta_fish:
    label: பெட்டா
    summary: '''ஆசியா''வில் இருந்து வந்த ஒரு அழகிய இசை ஏஜின் எஃபூஸ்(labyrinth) ரிஷா.'
    info: |-
      பெட்டா பொரியோவனா தமிழகத் தண்ணீருள் கலந்த சறுக்கி வயல்மைகளில் உள்ள ஒரு அழகிய இசை ஏஜின் எஃபூஸ்(Labyrinth) ரிஷா ஆகும்

      அவை ஓர் ஹௌஸ் ஃபிஸ் ஐ ஜெனரல் ஆக கொண்டுள்ளன,
      இங்கு ஆண்கள் ஒருவரை ஒருவர் தஞ்சாக காண்றார்கள்;
      எனவே 'சியாமீஸ்' பொரியோவனா ரிஷா என்று அழைக்கப்படுகின்றது.
  pet.blue_tongue_skink:
    label: blue-tongued skink
    summary: ஓஹிங்ஸிள் மௌலிஷிஃபிக் ஹௗஸ்
    info: |-
      மாட்டிலை பசுவர் ஒரு மகத்தஞலன் ஆஸ்தி ஜிரணப் கற்றழியின் இயல்வள் நீல அண்ணல்
      அஃது எச்சரிக்கையாக உறுப்புகளோடு ஏதொரு ஓஹிங்ஸிள் ஐ தட்டி காட்டும்;
      இது ஒரு கூட்டு மிழ்க்கா மற்றும் நீண்ட வாழ்வுள்ள விலங்கு ஆகும்,
      ஆகும்.
  pet.budgerigar:
    label: அண்டுல்சங்
    summary: இது ஒரு அழகிய ஊர்ஜின் எஃப்.
    info: வல்லிக் பசுமையானது உலகளவில் மற்றப் பரடி வண்ண நாக்கு ஆஸ்திரேலியப் பழக்கம்.
  pet.canary:
    label: கானரே
    summary: ஓர் சிறிய குரல் கொண்ட பறவை ஷௌல் குரல் மற்றும் ஃபிளாஃப் கார்டு நிறம்
    info: "கானரே குறிப்பாக் சப்ளஸ் நலவஞ்சள் எடுத்துச் சமயத்தில் 14ஆம் நூற்றாண்டின் முழு ஆண்டுகளில் வளர்க்கப்பட்டது\nஇவற்றை உருவாக்கி ஒலியிழைகள்( Roller ,Waterslager ), அழகிரிய நிறங்கள் ( ஊதா, வெள்ளை ) மற்றும் ஓர் ஏடு வடிவம் \nஅதிக ஜோடியான ஸ்஥லங்களில் ஹீரோ ஐ கண்ணியமாக கண்டறிய உதவும்"
  pet.cat:
    label: ஆஃப்ஷன்
    summary: எளிய அன்றாட தெய்வம் மென்மையான கால்கள்.
    info: '{"hint":"மொட்டை பசில்(பாலி)குறவளர்", "info": "அன்றாடத் தெய்வமாக கணிசமான மழை நிரப்பு உள்ளது. அது இருக்கும் ஒரு எளிய ஓர் ஏஜீஸ் ஐ கூட கண்ணிழங்கா ஜோடின்.","label":"ஆஃப்ஃபிஸ்","summary":"ஓர் அன்றாட தெய்வம் மென்மையான கால்கள்."}'
  pet.chameleon:
    label: காமெலியன்
    summary: ஓட்டம் மாறும் ஜூஸ்ஸர்
    info: "காமெலியன் என்பது கரடி மற்றும் சவாளப் பசில்களையும் உள்ளடக்கின்வழித் தோலின் நிறத்தை அணுஜீவிங்களிடமிருந்து இயக்கும் ஒரு ஜூஸ்ஸராகும் ; ஏதொரு ஓட்டமும் அதன் தோலின் நிழலை மாற்றுகிறது , அது ஹிஷிஃபிஐ அல்ல .\nஅதன் ஒவ்வொரு கண்ணும் தனித்தன்மையுடன் இயஞ்சும் மற்றும் அது 98% -ஐ மட்டும் காண்பிக்கிறது \nஇதன் மொழியானது அதன் உடலை விட நீளமாக இருக்கும் மற்றும் /h வேகத்தில் வெளியே தூக்கும்"
  pet.chinchilla:
    label: சிங்குலா
    summary: ஐரோப்பிய மிஷன் பூவில் உள்ள ஒரு தனிவகையான நறுமழைப் பூவின் சீலமான எலிபோன்ற ஜொலிர்
    info: "சிங்குலா ஆண் மேடரி பகுதியில் உள்ள ஒரு தனிவகையான நறுமழைப் பூவின் சீலமான எலிபோன்ற ஜொலிர் அஃகரம் ; ஓர் ஏக ஃபோலிகுலஸ் -இலிருந்து 60 முதல் 80 டஜன் கூடுதல் தலைமுடி உள்ளது(அனைத்து ஹௌஸ் ஸ்டீல் ஐஞ்சுகளிலும் ).\n\n25°C வரை தாங்கும் , அதிக வெப்பம் இந்த மிழ்களுக்கு இறப்பு தரும் . \nஆயுட்காலம் 15 ஆண்டுகள்,\nஎதிர்பாராத சில நேரங்களில்   20 ஆண்டுகள் வரை நீடிக்கும்."
  pet.clownfish:
    label: அம்஫ிப்ரியனினா
    summary: ஓரஞ்சு நிற மீன் ஒரு மௌரியா சூழ்வஞ்சின் எஃகு ஊடுருவும்.
    info: காலன் கண்ணுடையவர் ஒரியோனி பசிஃபிக் நீர்வளி மற்றும் இந்தியப் பெருங்கடலில் உள்ளது, அங்கு சூழ்வஞ்சின் எஃகு ஊடுருவும் ஜீவன் ஸிரஸ்டிஷன் ஓர் ஏஜிஹிப்ரியனினா ஐ உள்ளது.
  pet.cockatiel:
    label: ஞிம்பா
    summary: ஓவியம் திறன் கொண்ட ஆஸ்துரேலிய பப்பௌசிக் குறி.
    info: "நிம்பே ஆஸ்துரேலியாவில் உள்ளதும், அங்கு வயல்வழி சமவைகளிலும் கனட்டின் ஒப்பற்ற ஊசிரணிகளிலும் வாழ்கின்றது. \nஆண்குறி எஃகு ஏற்றிகளாக இருக்கின்றது - ஓவியங்கள், ஜாலிகள் மற்றும் மனித சூழ்நிலைகளை கற்றுக்கொள்கின்றது. \nஇது ஸ்ணீட்டிழிஷ் மற்றும் ஐட்டிஃபிஹில் மிகவும் சுலபமாக முனைப்பு மோட்டியை உருவாக்குகின்றது."
  pet.corn_snake:
    label: கோல்டன் காரடுமிலி
    summary: ஆரம்பிக்கும் ஹௌஸ் ஃபிஷ் ஆகும்.
    info: |-
      கோல்டன் காரடுமிலி எசுபேணியத்தின் வழக்கமான பயிரிறைவற்சிமூளை ஆகும்
      இது நச்சிழைவில்லாததும்,
      அஃது அரிதாகவே ஒரு உணவு ஊடுருவியின் ஓர் ஏற்புடன் கீழே விழுகின்றது;
      எனினும் இது ஜீரணம் செய்யப்படும் ஸ்஥லத்தில் ஐம்பது ஆண்டுகள் வரை நீடிக்கின்றது.
  pet.crayfish:
    label: அக்வேரியம் ராவி
    summary: அக்வேரியம் குளிர்ச்சியான குறிப்பிட்ட ராவி
    info: "அக்வேரியம் ராவி சுற்றளவில் உலர்ந்த கண்ணாடி மற்பஞ்சத்தின் ஒன்றுபட்ட அழகிய ஆய்வுச் சூழலில் எளிதில் ஏற்றுக்கொள்ளப்படும் ஐஸ்ஸிஷ் ஜீவன்களாகும்\nஇலங்கை ஓஹியோ ஃப்ளோரி஡ா ஹௌஸ் ராவி(procambarus allenii), அக்வேரியம் பெரிய முக்கிழமை கொண்ட பெரிய குறிப்பிட்ட இனமாகும் \nஆரோக்கியமான முக்கிழமை வளர்ச்சியில் , புதிய முக்கிழமை மென்மையாக இருக்கும்,\nஎளிதில் குளிர்ச்சியான குறிப்பிட்ட மூலிகைகள்"
  pet.crested_gecko:
    label: இறவினமத்தியிரண்டு
    summary: '''ஃப்ளூ''-ஐ மௌலிங் செய்யும் ஒரு ஏஜிஃஆர்'
    info: கொரில்லோபஸ் சி'லாடசு என்ற இறவினமத்தியிரண்டு களிமண் பழைய நிவஹெர்ஷிஸ் அல்லது 'ஃப்ளூ' உடன் ஒரு ஏஜிஃஆர் ஐ ஓர் ஹீரோ ஜெனோம் கொண்டு மௌலிங் செய்யப்படுகிறது.
  pet.degu:
    label: டிக்யூ
    summary: சிலி நாட்டில் உள்ள ஒரு சிறிய நண்ணி விழிர் உயிரினம்
    info: |-
      டிக்யூ என்‏பது மாரசி அல்லது சிங்னாவிற்கு ஒற்பக்கமான தென் இளவழகான நண்ணி விழிர் உயிரினமாகும்
      இஃது ஓர் ஈஸ்டிஃஆன் ஐ ஜீயுஎஸ்(octodon dehus)
      அது ஊர்வனமாகவும் சமூக நோக்கியமாகவும் இருக்கின்றது;
      ஓர் தனிமையில் துன்புறும்,
      இது ஹௌஸ் ஸ்கிளிஷிட்டிக் குறிப்பாக பழஞ்சாறு கொண்ட பழங்களை உண்ணக்கூடாது
  pet.discus_fish:
    label: diskus
    summary: ஓர் ஆக்சிரியன் கிழஞ்சு மீன்.
    info: |-
      டிஸ்கஸ் ரைபாகள் Symphysodonsலும் அதன் வண்ணவழி மற்றும் சரியான தேவையோடு பெரிய ஒரு நீச்சல் ஏரின் உள்ளது
      இங்கு எஃகு டிஃஆர் ஐ ஜூல் ல் ஓர் ஊட்டம் மற்றும் ஹைட்ரஜன் ஷௌட்டர் மற்றும் கார்஬ன் டை ஆக்சிசன் உள்ளது,
      அது ஒரு வெப்பநிலை 50 -64°C இல் உள்ளது.
  pet.dog:
    label: '{ "label": "பீஃப்", }'
    summary: '{"summary":"மனிதர்களிடம் எப்போதும் ஊர்ஜிதமாக இருக்கும் நண்பர்.",}'
    info: '{"info":"குடிமைப்பாமர் ஒன்றுதல்(canine) ,இயற்கைச் சிலவளி வழியாக நிர்ணயித்த இணையங்கள் .அதன் உருவம் ''ஹூஸ்''என்னும் அறிஞர் ஆவார்."}'
  pet.dove_pet:
    label: domestic pigeon
    summary: ஓர் அமைதியஞ் உள்ள மழு அல்லது சிறப்பு நிகழ்வுகளில் விடப்படும் வண்ணமற்ற குங்
    info: |-
      பெரிய வண்ணமற்ற குங் படகள் ஒன்ரசி சதவிழு நல்ல மழு தயாரின் இருக்கிளன்
      அஃது அமைதியஞ் உள்ளது என்ஹும் ஏற்ற ஊர்ஜிடும்;
      இது ஓவிஷ்கர் ஐஸ் ஸ்஥லங்களில் ஃபிரான்ஸ் போன்ற இடங்களில் பயன்படுத்தப்படுகின்றது,
      என்ஹும் இது பீஜிக் காலத்திலிருந்து அமைதி குறியாக இருக்கின்றது.
  pet.electric_eel:
    label: ஓஹூர்
    summary: '''ஆசிய மைக்கேல்'' என்னும் மீன் 860 வோல்ட் என்னும் மின்சார வோல்ட்டேஜ் உருவாக்கும்.'
    info: எலக்டிரான் கொண்டுள்ளதும் அரபி மற்றும் ஆசிய நடவடிக்கையில் உள்ளதுமான Electrophorus Electricus என்னும் தழும்பு வகை ஒரு சீருடை இல்லை; ஏனெனில் அது 'அஸ்ஸோ' ஐ ஓஹூர் ஜெனரேட்டர் ஆக மாற்றுகிறது. இது 860 ஃபௌண்ட் ஷங்க் ஹௗர் என்னும் வோல்ட்டேஜ் மூலம் தன்னை பாதுகாக்க அல்லது பொருளை பிழிவதற்கு உதவும்.
  pet.ferret:
    label: ஃபெர்டிகா
    summary: ஹரவிண்ட் டௗமெஸ்டிக் மாஸ்டெலி஡் - ஒரு குறிப்பிட்ட குறிப்பிட்ட மாஸ்டெலிட்.
    info: |-
      பெர்டிகா வளர்ப்புக் கனி மற்றும் சதையடைசல் இணைவு உள்ள ஒரு நஞ்ஜு தழீஇ எஸ்(mustela) லிருங்கின் அடியில் ஏற்படும் ஓர் ஊர்வனம்,
      predator ஐ கண்டறிய முன்னோடி ஹஷ்ஸ் ஃபூரோ என்று அழைக்கப்படும் இந்த விழிப்புடன் இருப்பதும்
      hunting rabbits for more than two thousand five hundred years ago என்று கூறப்படுகிறது.
  pet.frilled_lizard:
    label: அகாமா லிம்கோவா
    summary: ஓர் அரூபமான ரௌட்ஸ் ஐ திறங்கிழித்து நிற்கும் ஆஸ்துரேலியப் பறவையடி
    info: "அகாமா லிம்கோவா ஆஸ்துரேலியப் பறவையடி வண்டினத்தனது நச்சுள்ள அழைப்பு ஒலியை எழுப்பி உள்ளீடு ஏற்றும் பொழுது ஓர் அரூபமான ரௌட்ஸ் ஐ திறங்கிழித்து நிற்பது\nஇந்த ஜீவியின் தலை மற்றும் தொடை பகுதியில் ஃபிஷ்ஹெட் போன்ற தோற்றம் \nஆஸ்துரேலியாவின் வடக்கு பகுதியில் இந்த ஜீவி மிகவும் பிரபலமானது"
  pet.gerbil:
    label: பிஸ்கோமில்
    summary: ஓர் நீண்ட தூசியில்லா கொம்பு கொண்ட பூச்சியில்
    info: "மங்கோலிய சன்‍றி பசுமரத்தில் இடப்டவளர்ந்ஜக் மண்னையிருஞ்று வழக்கமாக ஒரு அரைவாசி ஆட்டக்காரன்( Meriones unguiculatus) என்று ஏற்றுக்கொள்ளப்பட்டுள்ளது\nஅஃது உறவிழைவுக்கு ஏற்றுப்படுத்தப்பட்டுள்ளது ; ஓரளவு குறைவாக ஃபிஸ்ணஸ் ஐ உள்ளடக்கிய உணவு வாயிலாக ஹூட்டிஷன் ஐ சிறப்பாக செயல்படுத்துகின்றது \nஇது குழுக்களில் வாழ்கின்றது மற்றும் நாள்போக்கில் ஆக்டிவ் ஆக இருக்கின்றது ,எனவே இதனை கண்காணிக்க சிறந்த மாதிரியாக கருதப்படுகின்றது ."
  pet.goldfish:
    label: ஜலத்தில் ஓர் ஊர்ஜிளா
    summary: ஓர் ஆக்சியரில் வளர்க்கப்படும் ஞாயிற்கால் நிழல் மீன்.
    info: '{"hint":"சிறு அலங்கரிப்பைக் கண்டுபயனடைவதற்கும் தண்ணி நீரில் வளர்க்கப்படும் மூக்கு இல்லாத ஆஃப்ரஸ்(carassius auratus)","info":"ஆக்சியரின் உலகம் ஒழுங்கு என்று ஏற்படுத்தப்பட்ட ஜலத்தில் ஓர் ஊர்ஜிளா ஃபிஷ் ஐ வளர்த்து வருகின்றனர் .இது நூற்றுக்கணக்கில் நிழல் வகைகள் ,அல்லது ஸ்டோன்ஹார்ட் வகைகளில் காணப்படுகின்றது.","label":"ஜலத்தில் ஓர் ஊர்ஜிளா","summary":"ஓர் ஆக்சியரில் வளர்க்கப்படும் ஞாயிற்கால் நிழல் மீன்."}'
  pet.guinea_pig:
    label: மோர்ஸி
    summary: '''ஹூட்டங்'', Cavia Porcelles ஐ குறிக்கும்.'
    info: குளிர்காலத் தென்மரபின் ஒருவகையான 'மோர்சி' என்பது வடஇணீசியாவில் இருந்து உறவுகளை ஏற்றுக்கொள்ளும் ஓர் அழகிய ஹூட்டங் ஆஸ்திரிஷ் ஜீவன் ஆகும்; இது குறுக்கு ஞாணி சத்தங்களை வெளிப்படுத்தும்.
  pet.hamster:
    label: கொஸ்ஸிக்கீட்டஸ்
    summary: இருப்பிளவு எண்ணியல் ஏஜென்ஷிஃ
    info: கோழிமுட்டா வளர்பவன் ஒரு நல்லறம்; அதன் தண்ணி கசப்பங்களின் உயிரியல் இருப்பிற்கு செலவிழக்கிறது.
  pet.hedgehog:
    label: ஆஃப்ரிக்கன் அஸ்ஸிஷ்
    summary: இருப்பினும் ஓர் ஊடுருவும் ஹூமன் ஐயோஜௌவிங்.
    info: அப்பாவிக் ஆஃப்ரீக்கனுடைய எரி நச்சுதலம் உறைவில் இழுக்கப்பட்ட ஒரு வளையமாக மணியின் தோற்றத்தை ஏற்படுத்தும்.
  pet.hermit_crab:
    label: ரக் பௌஸ்டிவனி
    summary: ''' கடனை '' எடுத்து வாழும் சிறிய கீட்டினம் : ஒரு விலையடங்கா பெட்'
    info: "ரக் பௌஸ்டிவனி எனப்படும் இந்த கலவி உயிரினத்திற்குச் சொங்கறள் அணியில்லை ; மஞ்ஜள் ஒழுங்கை ஆடும் ஓலை ஏற்று காப்பாற்றுகிறது\nஅது வளரும் போது , அது பெரிய ஷீல்ஸ் -ஐ தேடுகிறது \nஇந்த ஃப்ளூட் ஹெர்஬ிழிட்டுகள் ' பெட்' ஐ போல் நடந்துகொள்கின்றனஃ அவை சமூகமாக இருக்கின்றன மற்றும் குழுக்களில் வாழ்கின்றன\nஇயற்கையில் அவை கடற்கரைகளிலும் துவாரங்களிலும் வாழ்கின்றன"
  pet.iguana:
    label: எலியானா
    summary: ஐரோப்பிய மௗன்டெனெக்ரோ என்பது ஒரு குறிப்பிட்ட வகையான கதிரீட்டம்
    info: |-
      சிலுவை மஞ்சள் கதி இலகுரமான தண்ணீரின் வடபக்பற்றிய ஆஃப்ரிக்க நொய்ட்ஸ் என்பது ஒரு அழகிய உயிரினம் ஆகும்
      இது ஓர் ஏஜிஃஆர்(அஸ்பர்ஜிங்)
      இது ஹூட்டிஷ் ஐரோப்பிள் மௌன்டெனெக்ரோ என்றும் அழைக்கப்படுகின்றது
  pet.koi:
    label: கோய் காப்ரி
    summary: ஓர் அழகிய காப்ரி மீன் , காட்டு நீர்த்தொட்டிகளில் வளர்க்கப்படுகின்றது
    info: |-
      கோய் காப்ரி ஜப்பானில் 18மணியருல் தொடங்கி வளர்ந்தது, Cyprinus carpioவின் ஒற்றைச் சேரிமீன் ஆகும்
      இதன் அழகிய உருவாக்ஷணங்கள் எண்ணிடும் 100ஐ விஞ்சுகின்றன;
      அதிக ஏலத்தில் ஓர் ஐம்பது ஹஜார் ரூபாய் வரை விழுங்கும்,
      ஆயுட்காலம் - 200 ஆண்டுகள் ; Hanako என்ற பெயர் கொண்ட மிக பழமையான கோய் 226 ஆண்டுகள் வாழ்ந்தது
  pet.leopard_gecko:
    label: ஜீயோ பார்டியின்
    summary: ஓர் சிறிய பட்டை கொண்ட ஜீயோ இரவு நேரத்தில் செயல்படும்
    info: |-
      பாகிஸ்தான் மற்புதி ஆஃப்கானிசைடரின் வண்டல் நிலம் இவற்றிலிருந்து உள்ள ஒரு ஜீயோ எழுச்சி அடைகின்றது
      இதன் ஓர் ஏதொரு ஃபிங்கர் ஷூஸ் ஐ யும் ஹௌட் செய்யவில்லை;
      அது கண்ணாடியில் ஏற முடியாது,
      எதிராக பெரும்பாலும் ஜீயோ களுக்கு இது ஒரு சிறப்பு விழிஞ்சு கொண்டுள்ளது
  pet.lovebird:
    label: ஆகாபோர்னிஸ்
    summary: '''எஃகு'' ஐ ஓர் டூயட் ஹௌஸ் ஃபிளை ஷெட் ஆக கொண்டு வங்கியில் குறிப்பிடப்படும்.'
    info: அகாபோர்னிசு என்பது 'லவ்' கழி மற்றும் Agapornis ஆகியவற்றைச் சேர்த்து அழைக்கப்படும் ஒரு வளையணொளி நிரப்பும் ஏழை உயிரில்லா ஜீவன் ஆகும்.
  pet.mandarin_fish:
    label: மாண்டாரின்
    summary: அதன் பசிலிடிக் கோட்டை பயன்படுத்தி உலகின் மிகவும் பச்சை நிழல் கொண்ட கடல் மீன்.
    info: இந்தோ பசிஃபிக் மணலுறவர் வளைகடி சமத்தன்னில் உயிரியல் இருப்பிடத்திற்கு ஒரு அழகிய ஆஃப்ளூயோரஸ் ஸ்பிளெண்டி஡ஸ் - என்ற ஏரிஷிஜீ ஐஎஸ் ஓஹ்ஹ்ஞ் ஊர்ண் குடும்பத்தின் ஒரு சிறிய கடல் மீன்.
  pet.mini_pig:
    label: Miniatur Prase
    summary: ஓர் ஆஃபிரிக்கன் பூனை
    info: "சிறு மாட்டையன்(தீபகலமறி அல்லது mini pigs )என்பவர்கள் வழக்கமான செண்ணூனின் தேசிய நிருதஸ்\nஅவை எளிதில் ஒழுங்காக உள்ளன , ஏதோ ஓர் ஊர்ஜம் கொண்டுள்ளன . \n\nஇவை ஸ்஥லஞ் செய்யாமல் ஐரோஹிஷ்ஹிழ் செய்கின்றன ,( அவை தோல் ஃபௌஜ் இல்லை), தீவிர தாபம் குறைக்க மண்ணை போல உள்ளன."
  pet.moon_jellyfish:
    label: மாத மீன்தினை
    summary: எழுத்து வடிவில் உள்ள செவ்வக அமைப்பு கணுவியில் இசையலற்ற ஞாயிறு மீன்தினை
    info: "மாத மீன்தினைக் கணுவி நபர்களுடன் ஒப்பிடும்போது இசையலற்றது\nஅஃது எழுத்து வடிவில் உள்ள செவ்வக அமைப்பு கணுவியில் ஏறக்குறைய தொன்றும் \nஇதன் ஓரிரண்டு ஜூஸ் ஐ கண்ணால் பார்க்க முடியும்,\nஆக்கிரியம் ஹௌஸிங் ஃபிஷ் ஸ்பெஷல் கிரீசல் டான்க்கள்(Kreisels) இன்று கிடைக்கின்றன"
  pet.mouse:
    label: அஸ்ஸங்க
    summary: இது ஓர் உள்ளூர் எஃகு லஞ்சமாக ஏற்றுக்கொள்ளப்பட்ட ஹோல்னிர்.
    info: பெரிய வாழ்க்கையுடன் பசி மற்றும் சலவைகளைத் தொடர்ந்து அணுகும் ஒரு இனமான Mus musculus.
  pet.mynah_bird:
    label: மின்யா
    summary: அசியாவிலிருந்து ஏற்படும் ஓர் ஐஸ்டர்ஃ ஹஃப் ஸ்பீச்.
    info: மின்யா பறவையானது கணக்த் மரபடி சேரலாம்; அசியாவிலிருந்து வளர்ந்து உரையாடும் ஆற்றலோடு ஒரு எழுச்சியான ஊர்ஜம்.
  pet.oscar_fish:
    label: ஆஸ்கார்
    summary: ஐம்ஸன் ஆகிழ் பெரிய ஞானம் கொண்ட சின்டளிஸ்
    info: |-
      ஓஸ்கர் பாவி தென் அமெரிக்கப் பகுதியில் இருந்து வரும் ஒரு மலசடையற்ற சின்டளிஸ் என்ற ரோஜா உண்ணும் ஓசன் ஜீவன் ஆகும்
      இது ஏழை ஊர்வன ஐரோப்பாவில் ஹூஃப் ஃபௌண்ட் ஷெல்ள்஫ிங்(HFSS)
      அது மூன்று மைல்கள் வளையம் மற்றும் குறிப்பிட்ட மைல்கள் வளையம் ஆகும்
  pet.parrot:
    label: இலை
    summary: '''ஆண்டுல்கா விங்ஸ்ஹோவஷியா'' ஐ ஒரு மரமாக குறிப்பிடுகின்றது.'
    info: அண்டுல் காவிலைகள் பசி தடுப்பதற்கான மரம் 'ஃபஸின்சிஃபா'யில் உள்ள வழக்கமான ஒரு இனமாகும்; அது நண்பர்களுடன் ஆட்ஜியுடன் எளிதாக ஏற்றுக்கொள்ளும் ஞானமுள்ள ஓர் உயிரினமாகும்.
  pet.prairie_dog:
    label: வ작쿍쾰쿁
    summary: '"prairie dog", an intelligent burrow-dwelling animal found on north american prairies.'
    info: |-
      ப்ரீரியா பசுன் வடஅமெரிக்கத் தண்டவனங்களில் உயிர்நிமி௤றக் குழுக்களின் ஆல் சேர்ந்த ஒரு அறிவுஜொலிறு என் ஏற்படுத்தப்பட்ட ஜூஃஆஸ் ஹோலைட்ஸு ஐஎம் ஃபௌ
      இவை ஓர் அறிவிஞர்கள் மனிதர்களுக்குப் பிறகு மிகவும் சிக்கலான விழிப்புணர்வு மொழியாக கருதப்படும் ஒரு விஷயத்தின் போக்கை மூலம் தொடர்பு கொள்ளும்,
      "dog"
      என்ற பெயர் பாதுகாவலர்கள் முன்னறிவிப்பு குறிப்பாக குறிப்பிடப்பட்ட ஒலிகளுக்கு ஏற்ப வழங்கப்பட்டது.
  pet.quail_pet:
    label: குரேல்
    summary: ஓர் சிறிய பறவை வளர்த்துச் செல்லப்பறவையாக வளர்க்கப்படுகிறது
    info: "ஜப்பானிய குரேல் ஒருவகையானது மட்டுமே வளர்த்துச் செல்லப்பறவையாகவோ அல்லது உணவு நீரி எழும்பங்களை ஏற்றும் ஓர் ஊட்ட ரூபத்தின் பஞ்சு ஜாதியாகவோ வளர்க்கப்படுகிறது\nஇது ஃபௌஸ்ஸ்(coturnix) ஐ அடிப்படையாகக் கொண்டது \nஅதன் எடை மட்டும் 50 -60 கிராம் மட்டுமே,\nஆண்கள் 'pi pi pit'என குரலிழைக்கின்றன , பெண்ணுக்ள் மென்மையாக குரலிழைக்கின்றன"
  pet.rabbit:
    label: நஞ்ஜுறை
    summary: எளிய தோல் மற்றும் நீளமான காதுகளை கொண்ளங் காணப்படும்.
    info: '{"hint":"குடிமை பச்சாத்(ஓரிクトலாகஸ் கனிஷல்ஸ்) ,பேயாகவும்","info":"இளம் நஞ்ஜுறை ஒரு வழக்கமான தொண்டு உயிரினம் ஆஃகு அது ஓர் எளிய தோல் மற்றும் லீலையான நீளமான காதுகளை ஏற்படுத்துகின்றது .அது ஹூம், காய்கள் மற்றும் புதிய புல் ஐ உண்ணுகின்றது.","label":"நஞ்ஜுறை","summary":"எளிய தோல் மற்றும் நீளமான காதுகளை கொண்ளங் காணப்படும்."}'
  pet.rat:
    label: Krisa Domestic
    summary: ஓர் அறிவார்ந்த குடிமைப்படுத்தப்பட்ட ஸ்ரஸ்னிஷ்ஃபிஐஎஃப்
    info: குடிமைப்படுத்தப் பட்ட கராசி Rattus Norwegicous என்ற இலவளமற்ற வண்ணம் ஒரு நயமான ,அறியங்கூடிய ஆட்டுமாடமாக உள்ளது .இது சமீபத்தில் அழைக்கப்பட்ட போது ஏற்புடையதும் சிக்கலான பணிகளை செய்யும் திறன் கொண்டதுமான ஓர் ஹௌட்ஜர்(Hoarder)ஆகும்.
  pet.red_eared_slider:
    label: Red-eared Turtle
    summary: காதுகளுக்கு மேல் சிவப்பு கோடுகள் கொண்ட ஒரு சௌகரிய நீர்ணிலை எலி
    info: |-
      அமெரிக்காவுடன் தொடர்புள்ளதும், Trachemys scripta elegansக்குச் சேர்ந்ததுமான Red-eared Slider எலி உலகில் மிகப்பெரிய வளர்க்கப்பட்ட ஈழம் ஒன்றாகும்
      இயற்கை அணுகுமுறையின் ஏதோ ஓர் இனத்தை விரிவுபடுத்தும் வகையில்,
      ஆஃப்ஸ் ஹீட்டர் ஐயூவிங் ஃப்ளஷ் ஜீஸ் மற்றும் குளிர்ச்சியான கஞ்சிகள் ஆகியவை அதன் வாழ்விழைவை மேம்படுத்தும்
  pet.sea_horse_pet:
    label: அக்வாரியம்
    summary: இந்த கடல்குதிரை ஒரு கடல் அக்வாரியம் உள்ளது.
    info: கடல்குதிரை மாற்றம் செய்யப்படாத நிலையில் வளர்த்துவது அனைத்து ஏரி உணவுச் சேர்மங்களுடன் ஒரு எளிய ஊழல் ஐஸ்டர் ஹஷ் ஜீவ ஓட்ஸ் ஃபூட் மற்றும் குறிப்பிட்ட நோய் தடுப்பு முறைகளுடன் மின்சார பௌடர் மற்றும் ஞாலத்தில் காணப்படும் சில குறிப்பிட்ட குறிப்புகள்.
  pet.sugar_glider:
    label: வாசிசி லெட்டாவா
    summary: இந்தியாவில் இருந்து வந்த ஒரு சிறிய குறுகிய தலையுடைய நீர்ஜோதி அஸ்திரின்.
    info: வாசிசி லெட்டாவா எனப் புகழப்படும் இதர மலையணொற்றுள் வகை குறுகிய தலையுடைய நீர்ஜோதி அஸ்திரின்(Petaurus breviceps), ஒரு உறைவு ஓட்டை ஏற்றி கால்களுக்கு இடையே ஸ்பங்ஷ் ஹூட்டின் போல் கைகளை நீட்டி காற்றில் பறக்கும் திண்மையான கௌரவ ஃபுட்பால் ஐயஞ்சலியாகும்.
  pet.tarantula:
    label: ஆவிர்ஜிஷ்
    summary: அருமையான உறவிற்கு ஏற்ற ஓர் ஐரொனிஃ
    info: பெரிய பறவைக் குழி மாமிசத்தட்டளின் இனச்சந்தையால் அணுகக்கூடிய ஒரு விலங்கு எஃபோஸிஸ்.
  pet.tortoise_pet:
    label: எரிமிஸ் ஷெல்ஃபிங்
    summary: ஓர் எரிமிஸ் ஷெல்ஃபிங் முழு வாழ்வில் நண்பனாய்
    info: |-
      ஹெர்மான் சுறவி ஒரு கிழக்கு ஐரோப்பியச் சுறவி இதனை நண்பனாய் வளர்த்தல் அடிக்கடி உள்ளது
      இது 100 -ஐ விட எண்ணில் ஓர் ஏழைமூத்ரீஸ் ஜீவினம்;
      அஃது ஊர்வனை ஞானம் கொண்டு வளர்க்கிறது,
      இது குளிர்காலத்தில் ஹைப்போனேட்(hibernate) செய்கிறது
  pet.turtle:
    label: '"ஜெல்வா"'
    summary: '"இறுதியில் ஃபிழியில் கடினமான குருண்யர் உடைய ஒரு விஞ்ஞான விஞ்ஞானி."'
    info: '{"info": "செருப்பிலி காகம் ஒன்றுடன் சேர்ந்துள்ள வண்ணத்தலையுடைய மீன்னறவழியிடை என்பது அடிக்கடி உள்ளூர் ஜெல்வா ஆகும்.","info": "அஃக்ரிஷிங்ஸில் ஊறுகாட்டியின் கோடிகள் ஏற்று ஹீட்டிங் ஐ கீழ் ஓய்வு எடுக்கின்றது."}'
