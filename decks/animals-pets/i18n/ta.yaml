lang: ta
pivot: false
title: நகர்பேழ் விலங்குகள்
cards:
  pet.cat:
    label: மான்
    summary: செவ்விலி குடும்பத்தினர் மேல் சிறப்பு அறியா நண்பர்.
    info: குடும்பத்தில் ஒரு மான் (ஃபெலிஸ் கேடஸ்) என்பது குடும்பத்தில் உள்ள ஒரு பொதுவான நண்பர் ஆகும். இது தன்னை தூய்மையாக வைத்துக்கொள்ளும் தன்மையுடன், தன்னார்வமான குணமுடையது.
  pet.dog:
    label: குறட்டி
    summary: மனிதரின் நண்பரான விசுவாசப் பேய்.
    info: தீவிர குறட்டி மனிதரால் ஆளுமையாக்கப்பட்ட ஒரு வேடராகும்; மனிதரால் ஆளுமையாக்கப்பட்ட மிகவும் பழமையான உயிரியம். 400ஐ விட அதிகமான பண்பினங்கள் உள்ளன என்றும் 'மனிதரின் மிகவும் நல்ல நண்பர்' என்றும் அறியப்படுகின்றது.
  pet.goldfish:
    label: கார்டின் கொலோசி
    summary: துளையற்ற தண்ணீரில் வளர்க்கப்படும் மஞ்சள் நிற ஆவிரியில் உள்ள இனம்.
    info: இந்த அழகிய மஞ்ஜள் நிற ஆவிரியில் உள்ள கார்டின் கொலோசி என்பது உலகம் முழுவதும் ஆக்வாரியம்களில் வளர்க்கப்படும் ஒரு வீட்டில் வளர்க்கப்படும் ஆவிரியில் உள்ள இனமாகும். இது நூற்றுக்கணக்கான் நிற வகைகள் மற்றும் தோல் வகைகளில் கிடைக்கின்றது.
  pet.guinea_pig:
    label: மோர்சி
    summary: குழந்தைகள் பிடிக்கும் ஒரு மயிரற்ற விலங்கு.
    info: தென் அமெரிக்காவின் ஒரு சமூக இடப்பகுதி உண்ணும் விலங்கு ஆனது மோர்சி எனப்படுகிறது. இது குரலில் கசக்கும் ஓசை கொடுக்கிறது, நண்பமான மற்றும் மனிதர்களின் நேரடியான நிழலில் இருப்பதை பிடிக்கிறது.
  pet.hamster:
    label: கிரீசெக்
    summary: முட்டை மாவில் நிறைந்த சின்ன பராவியல் விலங்கு.
    info: கிரீசெக் எனப்படும் இந்த பற்பலி விலங்கு ஒரு பொதுவான பூட்டு விலங்கு. அது உணவு துண்டுகளை தனது முகத்தில் சேமிக்கிறது, இரவு நேரத்தில் செயல்பாடுகளில் ஈடுபடுகிறது மற்றும் ஓடும் வளைவு வழியாக ஏறக்குறைய ஓட விரும்புகிறது.
  pet.parrot:
    label: பாபூசக்
    summary: மனித குரலை பதிலளிக்கும் நிறமிட்ட பறவை.
    info: அண்டுல்கா விள்ன்கோவானா மிகவும் பரவலாக இருக்கும் ஒரு பாபூசக் சிங்கம் ஆகும்; அது ஒரு பொழுதுபோக்கு உயிரி என்று கருதப்படுகிறது. இது புத்திசாலி, சமூக நல்லிணக்கம் கொண்டது மற்றும் ஒலியையும் சொற்களையும் காப்பியாக ஏற்றுக்கொள்ளும்.
  pet.rabbit:
    label: குரலிக்
    summary: நீளமான காதுகளுடன் சூட்டப்பட்ட மயிர் விலங்கு.
    info: ஓரிக்தோலாகஸ் குனிக்குலசு என்ற இனத்தின் உள்ளூர் குறி ஆகியவை ஒரு அழகிய பொறுப்பு விலங்காகும்; இதன் மென்மையான மயிர் மற்றும் தனிப்பட்ட நீளமான காதுகள் உள்ளன. இவை காய்கறிகள், புதிய புல் மற்றும் காய்கறிகளை உணவாக உட்கொள்கின்றன.
  pet.turtle:
    label: நடுவண்
    summary: தசையில்லா தன்மை கொண்ட உறுப்பு.
    info: கரும் இளஞ்சிவப்பு எலி ஆடும் ஒரு பொதுவான வீட்டு நடுவண். அது குளிர்சாதன குழாயின் கீழ் சூடுபடுத்தப்படும் தரையோடு கூடிய குடுவையில் வாழ்கிறது.
