lang: ja
pivot: false
title: ペット動物
cards:
  pet.angelfish:
    label: スカーラー
    summary: 長く伸びた尾びれを持つ優雅な円盤状の熱帯魚
    info: アマゾンスカラーは、そのエレガントな三角形の体と長い泳ぐフィニッシュで最も人気のあるアクワリウム魚種です。 アマゾン流域に生息しており温かい水（24〜28°C）を必要としています。 肉食性であり小さな魚類を食べることがあります。 日本では魅力的なスカラーアクアリウムが最初の熱帯魚である1909年に輸入されました。
  pet.axolotl:
    label: アクソロトゥール
    summary: メキシコ原産の水中生活をする動物で、常に外部鰭を持っている
    info: |-
      {"hint":"水生のメキシコアカミルワームで、一生幼虫期に似た形態（アンビストマ・メヒカンム）を保つ","info":"アクソロトゥールはメキシコ原産の水中生活を行うヤモリのような両棲類であり、生涯を通じてその若いうちの姿を持っています。（新童性と呼ばれるこの現象です。）。
      外見には目立った外部鰓があり、微笑んでいるような表情が特徴的です。
      これはメキシクス湖でのみ発見される固有種であり、絶滅危惧種となっています。
      驚くべき再生能力を持っており、四肢や心臓および脳といった部分も再生成することができるのです。
  pet.ball_python:
    label: king ball python
    summary: 落ち着いた丸くまとまる蛇として、初心者が最初にするのに理想的な爬虫類
    info: |-
      {"hint":"服従的な巻き方をする人気の初心者向けパイソン（Pytho\u00f4n r\xe9gius）","info":"キングボールピースは西アフリカと中央アフリカ原産で、サバンナや森に生息しています。脅かされると固い球体になります。（ここからball pythonという名前が来ています）。長さは約120〜150cmになり、寿命は30年以上です。
      飼育下ではすでに8000以上の色変異があります。"}
  pet.bearded_dragon:
    label: ヴォーザト・ドラク
    summary: オーストラリア原産の人気ある温かい環境に適したエキゾチックなペットとして知られる鬣竜
    info: 中型のヴォーサートドラゴンは、その温和な性格から爬虫類の中で最も人気のあるペットの一つです。感情や支配性を示すために髭がふくらんで暗くなることがあります。腕を振る（アームウェーブ）というサブミッシブジェスチャーでコミュニケーションを取ります。雑食であり、昆虫だけでなく野菜と果物も食べます。
  pet.betta_fish:
    label: '"bettas"'
    summary: Southeast Asian colorful labyrinths fishes known by their elaborate tailfins.
    info: '{"hint":"colorful labyrinth fish with flowing fins from Southeast Asia (Betta splendens)","info":"The Siamese fighting fish is an air-breathing labyrinth fish that lives in shallow rice fields across Thailand using its specialized organ for breathing.\nThe males show aggression towards each other which gives it name ''Siamese Fighting Fish''.\nThrough selective breeding extravagant forms have been created featuring enormous trailing finnage.\nIt can live up to three-to-five years making them relatively low-maintenance pets."}'
  pet.blue_tongue_skink:
    label: blue-tongued skink
    summary: オーストラリアに生息する、見事な青い舌を持ち、それを脅しのために用いる爬虫類
    info: '{"hint":"大型の舌が鮮やかな青色をしたスキンク（Tiliqua scincoides）","info":"ブルータンギースキントは、特徴的な青い舌を持つオーストラリア原産の大柄なトカゲである。\nこの動物は捕食者に対して警告として舌を見せる；その青みは威嚇的だ。\n攻撃性ではなく太りやすく動きも遅く、ペットとしても人気がある。\n寿命は約15～20年で体長は50cmを超える。'
  pet.budgerigar:
    label: アンダルカー
    summary: 世界最多の人気小形オーストラリアインコ
    info: |-
      アンドルカ・ヴランコヴァナは、世界で最も一般的なペット鳥の一つであり、金翅雀に次いで人気がある。
      野生種は緑と黄色が基調だが、品評会向けには青や白、灰色などの変異個体も作出されている。
      オスは人の声を真似ることができて数百語もの単語を習得することができる。
      寿命は約5〜10年間で社会性のある動物である。
  pet.canary:
    label: 金翅雀
    summary: 小型で歌声豊かな鳥であり、その美しい音楽性および鮮やかさゆえに人気がある
    info: '{"hint":"小柄で歌うことができる黄色い鳥（セリナス・カニリア）として、声と明るく黄緑色の体が特徴。")","info":"金翅雀はカンリー諸島に生息しており、スペイン人が15世紀頃から家畜化しました。\n品種改良によって多くのタイプができました：鳩のようにさえずりを繰り返すものやさまざまな色彩を持つ赤いや白い個体などがあります。\nオスたちは複雑なメロディーを奏でることができて他の曲調も習得します。\n歴史的には石炭鉱山での一酸化炭素検知器としても使われていました。'
  pet.cat:
    label: ねこ
    summary: 柔らかな足を持ち、独立心の強い家庭用ペット。
    info: 家猫（フェリス・キャツ）はネコ科に属する動物で、一般的な家庭のペットとして飼われています。俊敏さや清潔さ、そして独立した性格が特徴です。
  pet.chameleon:
    label: カメレオン
    summary: 色変わりをする爬虫類であり、左右の眼玉が別個に自由自在に動きます
    info: |-
      {"hint":"色を変える爬虫類で、独立して動く目を持っている（カメレオン）","info":"カモフラージュではなく感情のコミュニケーションのために皮膚の色素細胞を使って体の色を変えます。
      それぞれの目の動きは互いに独立しておりほぼ360度を見渡すことができます。舌先が枝分かれし時速26キロメートルというスピードですぐ伸びて獲物を取り込みます。
      木々だけで生活するこの動物には葉や小枝などをつかむための爪のような足があります。
  pet.chinchilla:
    label: '"チンチラ"'
    summary: '"最も密度の高い体毛を持ちながら陸上生活をするサル以外の哺乳動物である南米原産のげっしやる。"'
    info: |-
      {"hint":"毛が非常に密な南アメリカの柔らかい皮をもつ齧歯類（チンチラ・ランギエラ）","info":"チンチラはアンデス山脈に生息する、記録的に濃い被毛を持つ哺乳動物です。一つの毛穴から60～80本もの髪があるため、人間のように一本だけではありません。
      体温調節のために気温が高いと耐えられず、高温で死ぬこともあります。
      寿命としては平均して15年ですが、まれにはそれ以上生きることもあります。
      その美しい毛並みはかつて大変高価であったために絶滅危機を感じさせるほど乱獲されました。"}
  pet.clownfish:
    label: クマノミ
    summary: 海葵と一緒に暮らす橙色の魚であるクマノミについて説明します。
    info: |-
      {"hint":"小型のオレンジ色から白い海水魚で、海葵（アンフィプリオンネ）の中に生息する","info":"クマノミは熱帯インド太平洋に分布し、海葵と共生関係にある小さな海水魚です。
      海葵が毒針を持つ触手によってクマノミを守ってくれると引き換えに、クマノミはその体を掃除して捕食者を寄せ付けません。
      映画『海底总动员』(Finding Nemo)(2003年作)により海洋水槽飼育の人気シンボルとなりました。
      すべてのクマノミはオスとして生まれますが、優勢な個体会にはメスへ性転換することがあります。","label":"クマノミ","summary":"海葵とともに共存している橙色の魚"}
  pet.cockatiel:
    label: '"ニンファ"'
    summary: '"オーストラリア原産の小さな冠付きインコで、歌声を得られる点から好まれている。"'
    info: |-
      {"hint":"オーストラリア原産の小型冠を持つインコで、歌を習得するペットとして人気がある（ニムファ・ホランドイカス）","info":"ニンファはステップ地帯や森に生息している。
      オス個体は優れた模倣能力を持ち、曲やメロディーだけでなく人の言葉も学ぶことができる。
      社会性が高く、飼育下では所有者と簡単に親密な関係を作ることができる。
      寿命は約15～20年であり世界第３位の人気鳥類である。"}
  pet.corn_snake:
    label: コーンクリークカバ
    summary: 穏やかな赤味のある橙色のヘビで、初心者が適切に対応できます。
    info: |-
      {"hint":"従順でオレンジ色のペット蛇、初心者向けの人気ある爬虫類（パンテロフィス・ガットタス）","info":"コーンクリークカバはアメリカ南東部原産であり、畑や森に生息しています。
      毒を持たず温厚な性格ですが、ほとんど噛まず丈夫です。
      名前はトウモロコシ畑から来ているか、あるいは腹部にある斑点がトウモロコシのような模様を連想させることによるものです。
      体長はメートルを超え、飼育下では最大20年生きることがあります。"}
  pet.crayfish:
    label: アクワリウム用カニ
    summary: 小型でカラフルな淡水カニであるアクアリウム用カニ
    info: |-
      {"hint":"水族館で飼育される淡水カニ（カンバラエリウスまたはプロカメバрус）","info":"アクアリウムのラクダは、活発な行動と鮮やかな色合いのために人気のある淡水产水槽住民です。
      ブルーフロリダ・クローガー（プルコマバー ス アレンイ）が最も好まれる種類として知られています。
      成長に伴い甲羅を脱ぎます；新しく生え変わる甲羅は最初柔らかい状態になります。
      彼らは床面清掃員としても有用であり、藻类および食べ残し物質などを消費します。"
  pet.crested_gecko:
    label: チョコレートゲコン
    summary: 特徴的なヒダ状頭部を持つ大きな目を持った夜間に行動するげкон
    info: "{\"hint\":\"夜行性のげこんで、まつ毛のような冠を持っている（コリレロフス・キリアタス）\",\"info\":\"チョコレートゲコンはニューカレドニア原産であり、1994年まで絶滅したと考えられていた。\r\nジャンプが得意で、活動時間帯は昼間ではなく夜である。他の多くのげこんとは異なり特別なUV-B照明を必要としない。\r\n果物や昆虫などを食べて生きており、飼育下では色調変化に幅広いバリエーションがあることが確認されている。"
  pet.degu:
    label: degū
    summary: 南米チリ原産の小さなげっ歯動物で群れをつくる
    info: |-
      {"info":"デグーはチリ原産の小型げっ歯類で、モルモットやチンチョウに近い。
      昼行性であり非常に社会的であるため孤立するとストレスを感じる。
      糖尿病になりやすく飼育下では甘味のある果物を与えてはならない。
      アルツハイマーやその他の神経変性疾患研究において重要なモデル生物とされている。","label":"degū(ドゥエギ)","summary":"南米チリ原産の小さなげっ歯動物で群れをつくる習性を持つ。"
  pet.discus_fish:
    label: diskus
    summary: 豪華なディスク型の魚として熱帯水族館において王と考えられている
    info: "{\"hint\":\"色とりどりの円盤状熱帯魚で、水槽界ではキングとされる（シムフィズドン）\",\"info\":\"ディスクス（Simphysodons）はアマゾン原産の大きな丸い形をした美しい色彩を持つ魚です。\r\nこれは最も難しい飼育条件が必要なアクアリウム用の魚であり；正確な水質化学成分および温度が摂氏28度から32度に保たれなければなりません。 \r\n幼少期には親からの皮膚分泌物によって栄養を得ます；これは非常に珍しい現象です。\r\n品種改良により数百ものカラーバリアントができました。"
  pet.dog:
    label: いぬ
    summary: 人間の友である忠実なペット動物。
    info: 家庭犬は家畜化されたオオカミであり、人類が最も早くから家畜化した動物です。400種類以上の品種があり、「人の最良の友」として知られています。
  pet.dove_pet:
    label: ホルブイチェ・ドマチ
    summary: 完全に白く染まったペットとしても、または記念イベントでの放出にも用いられるヒヨッコです。
    info: |-
      {"hint":"白い鳩として飼育されたり、解放のために使われたりする温順なペット（学名：コウモリガラス）","info":"ホロビツェ・ドマチは岩の上で家畜化されたコムバ・リヴィアを交配して純白色にしたものです。
      落ち着いており親しみやすく、インコのように咬まず泣きません。
      結婚式や葬儀など世界中の祝祭行事で放鳥されます。
      聖書時代から平和の象徴とされています。"}
  pet.electric_eel:
    label: Electric Eel
    summary: 南米魚であり、捕食または防御のために最高860ボルトまでの電流を生成できます。
    info: |-
      電気エイは本当のウナギではなく、南アメリカアマゾン原産のカプレ目と近い関係にあります。
      最大で860ボルトもの放電を発生させることができて獲物や敵対者に対して使用します。空気呼吸を行うため水面へ定期的に顔を出さなければなりません。
      その体の大半が筋肉組織から変化した電気器官によって構成されています。
  pet.ferret:
    label: '"felek"'
    summary: 「楽しい家畜化したネズミ目哺乳類，好奇心があり愛玩性が高い」
    info: |-
      {"hint":"プレイフルな家畜化されたマムシのような動物、タヌキと関係がある（学名：Mustela putorius furo）","info":"フェルレットは白いタヌキの家畜形態であり、ウサギ狩りのために2500年以上前から飼育されています。
      好奇心が強く遊ぶことが好きで；通常毎日14〜18時間眠りにつき残り時間を活発に遊びます。
      特徴的なピーマン臭を放つ皮脂腺があります。
      チェコでは珍しいペットとして人気のある家庭用可愛い犬です。"}
  pet.frilled_lizard:
    label: '"agama límcová"'
    summary: 「オーストラリア産のトカゲが威嚇として劇的な襟状突起を見せ開く」
    info: |-
      {"hint":"脅されると大きな首輪のような飾りを広げるトカゲ（Chlamydosaurus kingii）","info":"アガマ・リムコヴァは、オーストラリアのトカゲで、危険を感じたときに頸部に取り囲まれている大きな襟を開き、ヒスという音を立てて後肢立ちになります。
      この襟には延長された肋骨によって補強されています。
      彼女は背中の脚を使って走るミニチュアT-Rexのように見えます。
      野生動物写真家たちの人気のある撮影対象であり、北領地のシンボルでもあります。"}
  pet.gerbil:
    label: '"piskomil"'
    summary: 「長い毛皮尾を持つ小さな砂漠齧歯類」
    info: |-
      {"hint":"砂漠地域の小型社会性嚙歯動物、人気のあるポケットペット（Meriones unguiculatus）","info":"モンゴルと中国の中干地帯に生息するモンキーモウスは砂漠生活への適応が高く、食物から得た水分を非常に効率よく処理できるためほとんど飲まない。
      群れで暮らしており昼間に活動的であるので観察しやすいペットとして最適です。
      トンネル掘りるのが好きであり自然な行動のために十分量の基質が必要になります。"}
  pet.goldfish:
    label: 金魚
    summary: 金色や橙色の体をした、水槽で飼育される魚。
    info: 金魚は世界中で水槽に飼われている家畜化されたコイです。数百種類もの色のバリエーションとヒレのタイプが存在します。
  pet.guinea_pig:
    label: モルモット
    summary: ふわふわの毛並みで、子どもに人気のある小さなほ乳類。
    info: モルモットは南アメリカ原産の社会性を持つげっ歯類です。かすかな鳴き声を出し、親しみやすく、人のそばにいることを好む動物です。
  pet.hamster:
    label: 金地鼠
    summary: 顔に食物をため込む愛らしい小さなげっ歯類。
    info: 金地鼠は人気のある家庭用ペットです。顔の中に食べ物の備蓄をしまい、主に夜間に活動的で、ホイールを使ってよく走り回るのが好きです。
  pet.hedgehog:
    label: アフリカトゲ
    summary: 小さな棘を持つ虫喰い哺乳類で、脅威に対して丸くなる
    info: |-
      {"hint":"小型の棘のある昆虫食動物で、脅かされるとボール状になる（エリネウス・ヨーロピアヌス）","info":"アフリカトゲモドキは世界中で人気がある外来種ペットとして飼育されています。背中にケラチンからなる空洞の刺が約五千本あります。
      危険を感じ取ったときには完全に貫通できない球体になります。
      夜行性であり移動のためにホイールが必要です；一夜であらゆる距離を走ることができます。
  pet.hermit_crab:
    label: ラク・プーステヴニーク
    summary: 借り物の貝殻の中に暮らす小さな節足動物であり、エキゾチックな家庭用ペットとなることもある
    info: 陸ガニの一種であるラク・プーステヴニークは、自ら硬い甲羅を持たず、貝殻を使って柔かい体を守っている。成長するとより大きな貝殼を探し求める。乾燥した環境に住むこのカブトムシのような生物はペットとして人気があり、社会性が高く群れで生活する傾向がある。
  pet.iguana:
    label: レオパードリクネ
    summary: 熱帯アメリカから来ている緑色の大柄なトカゲで、エキゾチックなペットとしても人気があります。
    info: |-
      {"hint":"大型の草食性トカゲで、中央アメリカ原産。ペットとして飼育される（学名：イグアナ・イグアナ）","info":"レオパードリクネは南米に生息する最大体長が約2メートルになる大きな爬虫類です。
      完全な草食動物であり、家畜化された環境では多様な野菜とUVB照明が必要になります。
      頭部のてっぺんには光を感じ取る第三の目があるのが特徴です。
      適切であれば野生よりも寿命を延ばすことができますが、その分、高い管理技術や設備が求められます。
  pet.koi:
    label: カピル・コーラ
    summary: ガーデン池などで飼育されている鮮やかな色彩を持ったデコレーション用水産動物
    info: |-
      {"hint":"装飾用のカラフルなコイ（ Cyprinus carpio）","info":"カピル・コーラは、日本で17世紀から繁殖された普通のカルビヌス属魚である。
      100種類以上の色変異があり；最も価値のある個体は数千ドルで販売されることがある。
      最大寿命は200年以上に達することができる。最長命記録を持つコイ『ハナコー』が226年間生きたことが知られている。
      日本の文化では勇気や忍耐力と幸せを象徴している。
  pet.leopard_gecko:
    label: ' Leopard Gecko'
    summary: 小さなスポットがある夜間活動型のレプチルであり、初心者のためのお勧めな動物
    info: "{\"hint\":\"小型の夜行性で斑点のあるヘビガメ、初心者向けの人気ある爬虫類（エブルファリス・マクラリアス）\",\"info\":\"豹変色鬣蜥蜴はパキスタンとアフガニスタンの砂漠地帯に生息しています。他のゲッコーとは異なり指先には吸盤がなく、グラスを登ることはできません。\r\n動くことができるまぶたを持ちこれはげっこう科では珍しい特徴です。\r\n脂肪をしっぽの中に蓄えることができ、必要であればしっぽを切り離すことができます(オートトミー現象とも呼ばれます）。再び新しいしっぽも育つことが可能です。"
  pet.lovebird:
    label: '"アガポルニス"'
    summary: 「美しい小柄な鳥で安定したパートナーシップを持つ」
    info: |-
      {"hint":"小型で鮮やかな色のついた、ペアを結ぶハネジラミ","info":"アガポルニス（別名：ローブードバディ）はアフリカ原産の小さなインコであり、強いカップリング傾向が知られている。
      一対になると互いに餌を与え合い、清掃し合い、一緒に過ごす時間を最大限にする；ここから『lovebird』という名称になった。
      9種類存在しており、それぞれ色彩や分布によって異なる。
      オスもメスも音真似ができる。"}
  pet.mandarin_fish:
    label: '"マンダリンカ"'
    summary: '"世界一カラフルな海水魚で、サイケデリックパターンがあります。"'
    info: "{\"hint\":\"極めてカラフルな小さなサンゴ礁の魚（シンヒロパス・スプランデンタクス）\",\"info\":\"マナリーナ・ナルディアナは、インド太平洋地域の珊瑚礁に生息する非常に小型で色彩豊かな海水魚であり、動物界でも最も目立つ色使いを持つ一つです。\r\n鱗を持たず、色素を含む特殊細胞（クロマトフォア）と蛍光化合物によってその美しい彩りが作られています。\r\nこの魚は生きている微小生物のみを食べて生活しており、飼育するのはとても難しいことで知られています。\r\n国際的な条約により保護されています。\"}"
  pet.mini_pig:
    label: ミニチュア猪
    summary: ペットとして育てられる小さな家庭用猪
    info: |-
      ミニチュアブタ（ティーカップやマイクロ・ポーク）は、家畜化された小型の豚です。
      これらは知能があり清潔好きで、犬のように芸を覚えます。
      太陽光から身を守るため汗腺を持たず泥の中に転がって体温調節を行います。
      多くの飼い主にとって驚きになるのはその成長後のサイズであり販売店が約束したよりも大きくなることが多いことです。
  pet.moon_jellyfish:
    label: 月明かりのように輝くクラゲ
    summary: 特製のアクアリウムで飼われる透過性のある生物発光を持つクラゲ
    info: '{"hint":"小型の発光水母で、専用アクアリウムに飼育されている（オレリア・アウライト）","info":"月明かりのような名前のクラゲは最も一般的な種類であり、人間にとって比較的無害である。\nほぼ透明で、4つの円形卵巣が透けて見えることができる。\nかつては特別な容器での維持繁殖が非常に困難であったが、現在では特殊な循環式タンクがあるため容易になった。\n寿命は約1年から一年半まで。");'
  pet.mouse:
    label: ホワイト・ノルウェージャン・フェレット
    summary: 小さな家庭用げっ歯類であり、ペットまたは実験室動物として飼われています。
    info: |-
      {"hint":"飼いネズミ（Mus musculus）として人気のある小型の家畜化されたマウス","info":"白ねずみは、実験動物および装飾的なペットのために品種改良されてきた野生のネズミです。
      賢く、ラビリンスやトリックを素早く学習します。寿命は約２〜３年で社会性が高くグループでの飼育をお勧めします。
      ネズミたちは医学研究において重要な役割を持っています。
  pet.mynah_bird:
    label: '"myna"'
    summary: 「話し上手なアジアのスズムドリで、人の声を非常にうまくまねる特技がある」
    info: "{\"hint\":\"アジアのアマツバメ科（グラクラ・リゲイオーサ）に属する話す鳥\",\"info\":\"ヒナギクチョウは、すべての中でも最も優れた会話能力を持つとされる鳥である。\r\n人間の声調やアクセントおよび語尾を驚くほど正確に真似ることができる。\r\n東南アジアおよびインド原産であり、飼育下では数百単語やフレーズを学ぶことができる。\"}"
  pet.oscar_fish:
    label: oscar
    summary: Amazonから来た反応力のある高智能なサイクライド
    info: '{"hint":"南アメリカ原産の大型で知能が高いシクリッド（アストロノトゥス・オセラータス）","info":"オスカーは、非常に賢く飼い主を認識できるという特徴を持つ大きな南米生まれのサイクライドです。\n大容量の水槽が必要であり最低でも200リットル以上が推奨されます。","label":"oscar","summary":"Amazonから来た反応力のある高智能なサイクライド"}'
  pet.parrot:
    label: インコ
    summary: 色とりどりの声をまねする鳥。
    info: アフリカインコはペットとして最も広く飼育されているインコの一種です。知性があり、社交的で、音や言葉を真似ることができます。
  pet.prairie_dog:
    label: プリエオイソロバ
    summary: 北アメリカの大平原においてトンネルを作りながら生活をする集団的なげっし类です。
    info: |-
      {"hint":"北アメリカの草原に生息する、地下で群れをなす掘る社会性を持つ齧歯類（カニモウス）","info":"プリエオイソロバは、広大な地下コロニーの中で暮らしている北米原産の社会化されたげっし类です。
      彼らは複雑な音声システムを使ってコミュニケーションを取ります。この言語体系については科学者たちが人間以外では最も複雑であると評価しています。
      「ドッグ」という名前は捕食動物に対して吠えるような警告音から来ています。
      そのコロニーは数十種以上の生物にとって重要な生態系となっています。","label":"プリエオイソロバ","summary":"北アメリカの大平原においてトンネルを作りながら生活をする集団的なげっし类です。
  pet.quail_pet:
    label: ポケットサイズのクレペル
    summary: 小さくて手間のかからない室内用のペット
    info: |-
      {"hint":"ボタンクレペルカまたは日本風のクレペルカとして、小さなペット鳥（コターニックス）に飼われている。","info":"ジャパンクリープラは小型で卵を産んだり、愛玩動物としても育てられている。
      体重はわずか100グラムであり、最も小さい家畜化された禽類である。
      オスが鳴く音はピッピットと聞こえ、メスは静かな声で啼いている。
      彼らは騒がないためアパートでも適している。
  pet.rabbit:
    label: ウサギ
    summary: ふわふわの毛と長い耳を持つ愛らしいペット。
    info: 家ウサギ（学名：Oryctolagus cuniculus）は、柔らかな毛皮と特徴的な長く立った耳を持ち、人気のある家庭用ペットです。乾草、野菜、新鮮な牧草を主食としています。
  pet.rat:
    label: 家ねずみ
    summary: 非常に賢い家族の一員となることができる温順なペット
    info: |-
      {"hint":"家庭で飼われる賢く親しみやすいペットとしてのネズミ（Rattus norvegicus）","info":"家ねずみは最も知能が高いげっ歯類の一つであり、名前に対して反応したり複雑なタスクを学習することが可能です。\n社会性が高く人間や他のネズミと強い絆を作ります。
      寿命は約2〜3年です；アジアでは中国十二支において機智と繁栄の象徴となっています。
      アフリカでは嗅覚を使って地雷探査にも貢献しています。
  pet.red_eared_slider:
    label: ナイスなカメ
    summary: 耳の後の赤色帯を持つ淡水アクアリウム用の人気カメ
    info: "{\"hint\":\"人気のある赤耳の亀（トレケミス・クリプタ・エレガンス）\",\"info\":\"ナイスなカメは北アメリカ原産で、世界中で最も飼育されている爬虫類です。\r\n特徴的なのは耳後ろに見える赤いストライプであり、他の種と区別できます。水槽には水中部分だけでなく紫外線ランプを使って加温できる陸地も必要になります。\r\n寿命は30年以上になることもあります；多くの個体が自然界に戻されますが、それによって外来種として問題になっています。"
  pet.sea_horse_pet:
    label: アクアリウム内のマリンホース
    summary: 海水槽内における希少かつ魅力的な存在である海馬
    info: |-
      {"hint":"専用の海水槽に飼育されている海馬（ヒポカムパス）","info":"海洋魚の中でも、最も難しいとされる水族館での繁殖が可能な動物です。生きている餌（アーテミエやマイシド類）、そして静かな環境が必要になります。
      雄は腹部にある袋で卵を抱えて孵化させます；一度に数百匹もの子供を持ち出します。
      彼らはペアとして一緒に暮らし一生を通して忠実な関係を築きます。
      伝統医学のために違法採取されることにより絶滅危惧種となっています。
  pet.sugar_glider:
    label: フライトオポッサ
    summary: 体に沿って広がる皮膚によって木々の中を行き来して飛ぶことが可能な小型のオーストラリア産有袋動物
    info: |-
      フライトオポッサーは、前足と後ろ足の間にある膜（パタギウム）を使って木から木へ滑空することができる小さな夜行性有袋類です。
      大きな目を持ち非常に社会的で孤独になるとストレスを感じます。
      吠え声やヒスティング、ミャウンディングのような音を出してコミュニケーションを取ります。
  pet.tarantula:
    label: トカゲ
    summary: 冒険心がある人用の大柄でふわふわとしたかっこいんな爬虫類です。
    info: |-
      {"hint":"大型の毛深いクモで、エキゾチックなペットとして飼育される（タラントゥーラ科）","info":"ピグミー・コアスパは臆病ではない性格から初心者向けの人気のあるトカゲ。
      最大種であるゴリアテ・スピナーが世界最大級のクモであり足長さでは約30cmに達する。
      その毒液はハチと同等だが健康な成人には害がない。
      トガリユ類は寿命としては平均して20〜30年生きる。","label":"トカゲ","summary":"冒険心がある人用の大柄でふわふわした外見のかっこいい爬虫類"}
  pet.tortoise_pet:
    label: сушеемская черепаха
    summary: 長期的に共存可能な長命な陸上のカメである。
    info: '{"hint":"小型の陸棲カメ、長生きするペットとして人気（テストドゥス属）","info":"ヘルマンガメは南ヨーロッパ原産で小さな亀であり、飼いやすいペットとしても知られています。\n寿命が百年以上にもなり得るため所有者を越えて生きます。\n冬にはヒバネーションを行い代謝活動ほぼ停止します。\nチェコでは一部種類については許可なしに繁殖すること自体も違法です。","label":" сушеемская черепаха ","summary":" 長寿な陆上カメ、生涯を通じて良いパートナーとなるペット "}'
  pet.turtle:
    label: 亀
    summary: 硬い甲羅を持つ遅く動く動物。
    info: 赤顔ナドレルカは人気のある家庭用カメです。陸にアクセスできる水槽で飼われ、紫外線ランプの下で日光浴をします。
