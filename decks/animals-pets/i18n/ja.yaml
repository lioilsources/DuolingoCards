lang: ja
pivot: false
title: ペット動物
cards:
  pet.cat:
    label: ねこ
    summary: 柔らかな足を持ち、独立心の強い家庭用ペット。
    info: 家猫（フェリス・キャツ）はネコ科に属する動物で、一般的な家庭のペットとして飼われています。俊敏さや清潔さ、そして独立した性格が特徴です。
  pet.dog:
    label: いぬ
    summary: 人間の友である忠実なペット動物。
    info: 家庭犬は家畜化されたオオカミであり、人類が最も早くから家畜化した動物です。400種類以上の品種があり、「人の最良の友」として知られています。
  pet.goldfish:
    label: 金魚
    summary: 金色や橙色の体をした、水槽で飼育される魚。
    info: 金魚は世界中で水槽に飼われている家畜化されたコイです。数百種類もの色のバリエーションとヒレのタイプが存在します。
  pet.guinea_pig:
    label: モルモット
    summary: ふわふわの毛並みで、子どもに人気のある小さなほ乳類。
    info: モルモットは南アメリカ原産の社会性を持つげっ歯類です。かすかな鳴き声を出し、親しみやすく、人のそばにいることを好む動物です。
  pet.hamster:
    label: 金地鼠
    summary: 顔に食物をため込む愛らしい小さなげっ歯類。
    info: 金地鼠は人気のある家庭用ペットです。顔の中に食べ物の備蓄をしまい、主に夜間に活動的で、ホイールを使ってよく走り回るのが好きです。
  pet.parrot:
    label: インコ
    summary: 色とりどりの声をまねする鳥。
    info: アフリカインコはペットとして最も広く飼育されているインコの一種です。知性があり、社交的で、音や言葉を真似ることができます。
  pet.rabbit:
    label: ウサギ
    summary: ふわふわの毛と長い耳を持つ愛らしいペット。
    info: 家ウサギ（学名：Oryctolagus cuniculus）は、柔らかな毛皮と特徴的な長く立った耳を持ち、人気のある家庭用ペットです。乾草、野菜、新鮮な牧草を主食としています。
  pet.turtle:
    label: 亀
    summary: 硬い甲羅を持つ遅く動く動物。
    info: 赤顔ナドレルカは人気のある家庭用カメです。陸にアクセスできる水槽で飼われ、紫外線ランプの下で日光浴をします。
