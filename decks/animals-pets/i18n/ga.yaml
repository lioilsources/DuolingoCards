lang: ga
pivot: false
title: Maoithreachtaí Fháilteach
cards:
  pet.angelfish:
    label: scalara
    summary: Riabha thropicala dísithe atá córas de phlaotuímh lánthrom.
    info: Tábla naillínneach Amadóin é an Skálair nó Pterophylum Scalare agus tá sé ar feadh lárnacha i ngradaimheacht cáirdeanna don fhear is féin do shaol airgeadbhuíthe eile mar ghrás go dtí 5cm san áireamh.
  pet.axolotl:
    label: Achollatl
    summary: Amhracadóir Mheascánach nach féin dearg trí shuí ag baint úsáid as gnásanna.
    info: Tábla axolótl is é an amharcadóir Aontroméxico atá agus scuabhair lárnacha ar feadh na saoire seo thar nádúrachta neotenius nó go raibh sé mar mhac léinn uaidh san áireamar. Tá fósanna laeairte faoi lámha acu agus ceithreann gruaigeacht orthu freisin.
  pet.ball_python:
    label: Ball Python
    summary: Had beagnódha éagscothach nascadh san fhorma cáiliúil trí shuíochán isteach i bhfocal
    info: Táinseann an Ball Python ó na tíreanna i dTeach Aontaithe agus Éire Átha Cliath, áit is féidir léi bhuailtiú ar fadónta nó gruaigínneacha. Nuair nach raibh sí sábhais íoiltaranta siún go dtí péacadh cruth dála (san pháirt seo 'ball'). Tá sé de long láithreach idirmhéide don chuid eile den tsaol mar atá ann sa phríomhas - tá méid air thart um 90cm to 6m.
  pet.bearded_dragon:
    label: draigeán beagnách
    summary: Tógfear isteach sa chóras Draigneanta Aostroel
    info: Beannachtar na draigheanna thiarlaiteacha ar an tseasamh mar sin é do shuímhín agus cléibheadh dóchasach. Tugtar fhuaim air nó bíonn sé dearg amhlaidh chun comharthaú faoina ghrádha nó domhanaithe. D'fhreagair síneadh láimhe don phointe seo mar shearcadóireacht.
  pet.betta_fish:
    label: betta
    summary: Rabhadh láimhdbeitheache léargasógairteach ó Theastuaisce
    info: Tá breis is betta láimhseach atá ag dul i mbáscairín thiarlaigh ó Theas-Eorpa máirseach (splendidus). Tá sé sin labhradhbheatha nó lámhghearú ar feadh an tíre trí organ áirithe agus tá sínnithe ann san gcothrom lena bheidh fósanna gruaigeacha sa Thai. Is éard í féin go bhfuil na himearcóireacht idéalaithe don phríosan seo mar thírtheann siad tríd mhóránna taiscinn.
  pet.blue_tongue_skink:
    label: sceineán dearg
    summary: An sceineán Aositarla déanta den chuid is fearr nach féinfiartha.
    info: Is é an Skínge Modrójalyscach Aostarálach is mó agus tá sé i bhfeidhm mar chúplaodh don fhianfais nóinjhearcóirí trí na dábhairt eileacairdha atá ar bhuilleadh airgintiúil orthu. Tá siad gan fhear fiaránta agus tógfidh siad go dtí nár thosaíonn siad amach sa phríomhbharraigh.
  pet.budgerigar:
    label: andúil
    summary: Is féidir léi teacht amach san áireamarás trína dhorchaíocht.
    info: Táinig an Andúlca Vlioscóir isteach i gcomharsamh agus is é sin an pteas atá tábhachtach sa tír don phógairiún go dtí seo ón mbánfhear. Tá scéalacha cothromaithe de thaiscínte sléitheanna eile mar dhonn, frithínis nó gruaige ar fad.
  pet.canary:
    label: cianfhear
    summary: Peachóg beo is ea cianféar go dtí nach bhfuil sé thiar don ghaoth agus don dhochtúireacht.
    info: Tábla tábhachtach atá ag teacht ó na Caillínís agus ba é an deichidh ar fad den chuaide seo i gceannú saicse san uimhirtheannta ceithre déag. Bhíonn siopótaí difriúla ann mar phointeanna eolaithe (roller, waterslagrair), dathacha (donrúnacha, gealtair), nó cumainnéartha.
  pet.cat:
    label: cat
    summary: Independent housepet with soft paws.
    info: '{"hint":"an múinteán fheidhmeachta iadha (Féilís Cátus) is beag an téacs ar bith ag teacht","info":"Is féidir go dtuitheann sé sin má tá ceimicín ann nó mar gur cúpla lá d''aochtar na gruaigeanna nascóraí.","label":"Múinteoideacha","summary":"Tá scian amuigh ón gcónaí nuair nach bhfuil siadsan saor."}'
  pet.chameleon:
    label: chéimín
    summary: Ghealacht at hainmhéarann suas do dhaoine eile trí shuimiú.
    info: Is é chéimín an ainm ar ghealachta is féin nach n-aithneoidh sé dearcadh agus dathanna i dtús mar tá fógrú chromatófarach ann don fhiosradh dá thabharfadar slonn nó méadaidh go minic san áireamh amhlaidhin ach sa bhfuil siad tagaithe isteach faoin gcód laistigh den phríomhbhfocail seo.
  pet.chinchilla:
    label: cinchila
    summary: Is é an cinchila amhlaidh sluaighthe atá ann sa Mhearca Thiar.
    info: Tá cinchila is é an amhlaidh sluaithneachta agus tá sí ceannaire ar thuras na hAind íseal iad deireadhacha fada go dtí 75 mm san áit cá bhfuil daoine céanna lena dhuille séimhe. Tá siar dhóthain nascanta don téarma 'cinchillid', mar sin ba cheart dom féachaint orthu.
  pet.clownfish:
    label: claun
    summary: Rabhadóra oranaithe atá bainteach lena sheanscasanna.
    info: Tábla clauna é Klaun Oicheadhach agus tá sé mar ghealach i ndaoilte Indiúna-Talamhanacha ar feadh an domaingo cothrom nua eile san áit go mbaineann sí saor ó moireanta. Tugtar tacaíocht den chotha airge dá shasnaimh seascairthe don chlawn agus tugann sé fritheacht doibh freisin nuair nach bhfuil siad beo de phríontais nó daoine eile. Bhaineadh ama íseal amach faoin fhilm 'Hledání Nem' (Nim's Journey), seo is ea ceart go dtuitfeadar thar thrí scéalta d'éadais.
  pet.cockatiel:
    label: tálant
    summary: Gruaisín eileac is féidir liod go mbeadh scéalta céanna.
    info: Táinsear na Nimfhe agus an Hollandicus tá fós ann sa phróis seo thall ó Éirinn nó nua-thuairiscithe ar son 'nímphicas'. Tá sé mar ghrúdán beag dearg-lámhach atá déanta don chóras siamsa agus cól ceoil.
  pet.corn_snake:
    label: Huanncán Ciuaine
    summary: Had óg-chuma, oran-fearraghas don tagairtí.
    info: Tá uisteach agus an téad is féidir liúnta i gColumba Thoir na Stát Aontaithe nuair atá sí ar fhuaimhniúlacha nó sna gruaigeanna. Is é sin nón-nuíthiúnach agus mhaith-sinmhéalta; tá sé rómhsineadh go minic nach bhfuil siad fiuch dá chaillfidh méadaíocht acu san áireamh. D'fhágann ainm thar thrócaim istigh sa tsiocra nó trí shaothracht scagaire tríd an bpiont seo chun ciorcóire clise a phostail.
  pet.crayfish:
    label: Rac Acara
    summary: Crunchán buntúsach sa lárthrom.
    info: Táirgíní iascaireachta tábhachtacha is ea na crannóg acara don t-aicmeóidh ag súd gan fhrithfhonn mar atá siad beo agus córasca. Is é an Prawn Blue Florida (Procambarus alleni), ceart ar ais san áit sin, an sampla nua-thaifeadhaisde do thomhas íocaíochta. Nuair nacht séarantaí deargheanntas orthu nuair go mbéathaidh síos amach ón gcruinnín seo.
  pet.crested_gecko:
    label: Geckon Chochochlata
    summary: Geconn ócádhaigh cochuillteach atá beo trí an t-oiche.
    info: "Tá ghecon bhuailteach agus gnóthúil i lár an noithe tá fós ar New Caledonia é agus d'fhágadh daoine go raibh sé thart amach roimhe seo nuair nach bhfuair siad airse don chogar sa Bhliain 1994\nNí mór dhomhnacht uathu mar sin de réir na géagónacha eile nóchtur is féidir léi scianadh,\nní thuigfidh sí rith mhíchuímhilt dáta UVB \ntaistlíonn siad fruta agus inseictín agus bíodh córas lárnaithe breise ann san áireamh."
  pet.degu:
    label: degú
    summary: Hlodhvac beagnach ó Chille dá chaithfear sínteachas soclódha.
    info: Tá deagúin is é an t-degú, atá ag moladh i dTuaisceart Chill cho bhfuil mhorcín nó cincill. Is féidir léi dul ar siopógóireacht mar gheall airgeadais mhór go dtí nach mblianta sé amach sa láthair nuair a tharlaigh crannmhionta sna bliana '60s.
  pet.discus_fish:
    label: diskus
    summary: Rybach diskoidialta cáiliútha mar 'rí' acaraí triocha.
    info: Tábhachtar Diskusacha (Symphysodon), is é sin ró-fhearr beo Amasontach i bhform dhioraithe agus cólchu láidre. Is féin an ceann de na fearaí acara íseall atá tánaisteanna ar shuíomh chímiciúil áirithe den uaithne agus témpérátur ó 28 go dtiost 32°C. Tá feastaíocht mhór ann maidir len údhaireadh slándála trí thabhairt isteach cearrthaisc mhuineoil san fhearán.
  pet.dog:
    label: eo
    summary: Miongráinneach gruaigeacha d'fhuisceoir
    info: '"An t-eo ghráinneach is féinmhinic an tsluaght seo agus tá sé ar feadh níos mó ná ceithre haoiseanna de phleanma ann.'
  pet.dove_pet:
    label: Holúbín Domhnaithe
    summary: Is féidir léi gur taghadh sí ansamhluithe nua-thromnaítear nó trí shuíochán.
    info: Tá holubeach thomaiseacha í an 'columba livia' atá fadaighthe don ghaoth bhróin agus tá sé caolúil is fearr liadhainne. Is é sin tacaite ar thrastálta nó sliocht i dtreo láithreacht um saoil mar thíos go hAthair Fhionnta.
  pet.electric_eel:
    label: Electric Eel
    summary: South American freshwater fish capable of generating electrical discharges up to 860 volts.
    info: Tá ghearradh níl sé i bhfeart den chluiche agus tá fhearann eileacairteach ann ó thaobh thiar de shuíse Éireannaigh South America. Is féidir léi rithiltóirí cothromaithe go dtí 860 volts d'fhiosrú ar an gciorra nó mar dhaoine amach. Tógfear air saor áitiúil trí lámha isteach san uisce.
  pet.ferret:
    label: fréatóg
    summary: Tineál dómhnaithe, freagáltach agus maolmhiannta.
    info: Is féadailín freatachta é an fréatóg agus tá sé mar phorma dómhain de thrónadh na háthaisne, atá curtha i gcruth nua ar feadha níos mó ná blianta 2500 don cháchlasú dáileánacha. Is fearbhachtach agus freagairt is ea,agus sinsearfidh sí ó 14 go dtí 18 uaireanna laithi sula bhfuil siad tagaithe isteach san am seo eile sa lá, nuair nach mb'éann fiuinn faoi lorg airgeadbhuí. Tá scéal ioncaim thall orthu - máshuíonn siad seomra beaga gealóide agus cailltear siad gan teachtaireacht.
  pet.frilled_lizard:
    label: agamán linim
    summary: Is féidir léi dul isteach san áit nach mbeimid faoi thraslódaithe.
    info: Tá agám línimth is é an Chlamydosaurius Kingii atá i láithreacht sa tionscadal Éireannach; nuair a bhfuil sé fágtha go dtoradh ró mhór ar chúla nóinbhéalta dá ghlúine mar fhiosmhún de thartras agus síneas scianthe sna gruaifeanna.
  pet.gerbil:
    label: pioscómile
    summary: Hlodavaca beag d'fhorma tighthe do ghluaisteal.
    info: Tá písciomail ó na stiúpaí go hálta ar an Mhanach agus Chuineas. Is féidir léi bheith iascaireachtach mar ní thiontín sé cnapán fós nach bhfuair sí é amhaidh de phointeanna eile sa lárthóss. Tá siad ábhartha san fhómhas grúpa nóimhnithe agus tá siad gníomhaíochtacha láithne seo más ídealt don mhaoillinteach.
  pet.goldfish:
    label: carás
    summary: Rógan órnaitheach atarraintear san ácuarium.
    info: '{"label":"caras","summary":"Rógan órnaitheach tharraingtéar sa túbanna.","info":"Túthánnaíonn carás an caparta ar fud na tíre i ndaoine agus tá sé mar ghrádhaíocht de thrachtanta sara nó laeairn."}'
  pet.guinea_pig:
    label: moorc
    summary: Mothú ghrúaifeach tírthe atá tharaise do dhaoine.
    info: Tá mothú agus gruaifeach iad na morcacha ó Thiar Éireann. Is é Cavia porcellus an ainm ar bithiúnais orthu is tá siad socrán don phósadh mar mhaitle.
  pet.hamster:
    label: krith
    summary: Gaoileán beag fheiceoil atá córas na healaistean.
    info: Tá gaoileán is é kriostógach agus tá sé tharla go minic mar mhaidinín. Tugann sé comhréadacha isteach i nguthanna nó grúpaí.
  pet.hedgehog:
    label: Gaoithe Éadaigh
    summary: Bodhadh tinn déanta den choimeád atá ag crochaint isteach san am céanna nuair a dhéantar grádh orthu.
    info: |-
      Tá gaoithe Éadaigh ag teacht i láthair ar fud an domhain mar mhazlín éigeantach nua-thóiréadúil
      Is féidir léi córas de 5,000 go dtí 7,000 bódhaí ónta ísealacha dhothaí thar lámh cárainteach airgeadh,
      iompraíonn sí sinneadh don fhios dá réir nach bhfuil sé saor iarbhéalta;
      is iontrálach is ea agus tá siad seo á rith trí cearpad;
  pet.hermit_crab:
    label: An Rak Poustevinik
    summary: Séimhe béaga thíos dá múshla ceaptha, fisineacht eacnamha.
    info: Is é an rak poustevnik séimhe óg nach bhfuil áthas air féar amhanta agus nascannan taobh thiar de mhúscleanna litínneacha iad uile. Nuair athéantear siad, déanfear fágadh ar múshla beag nóta go dtí gur chóir liadtar. Tá scéalaithe dryopids comóradh mar phisíní, tá siad socailte agus bíodh siad san fhómhar. Ina saoire bít síd in ainmhithe agus tríochtar trópa.
  pet.iguana:
    label: leguán
    summary: Fiúchín fhionntaithe den Aigéar Thropacailte eile ach tuilltíocht chomh maolmhian nóibhthe.
    info: Táimseal leguan is é sin fiúchín mhór ó Mheirice agus tá sé mar shampla Iguana iguana. Táimidh i bhfolach ar ghrásanna breiseacha agus beo á luchtóint leo sa dhoras go dtí dhá méadar dá thabharfadh siad faoi láthair ortha. Is féidir léi blianta fada—níos mó ná hia gcheadhbhlaoide—in aithreacht cé nach ísle an rud atá deacrún don taobh amhara.
  pet.koi:
    label: capríne Kói
    summary: Capríne decorátach léi feabhas faideacha breoite.
    info: Tá fhearc is ea an capríne Kói atá ag tabhairt isteach i bhfargaí sluaiteacha trí shaol na bpianóigeachta sa taoiseadh de thuras ar phointín cáirteanna. Tá níos mó ná céad staidhreacha dífhaideacha ann san fhoinse seo mar ghrúpa; tá ceannaithe is éifeachtacha acisi féin baintear lonnaidhean oileasa ó thaobh clár don cheart airgeada. Is féidir leo blianta go dtí dá trion thrasgabhailthe lena ndea-fhear Hanaco bailligh séc úd.
  pet.leopard_gecko:
    label: gékó leipéada
    summary: Geckón beag spottheach noctúntais is ea an gékó leipéada, searcéal déanta don chur isteach.
    info: Táinnteann Gékó Leoparda ó thalamhu Phaístín agus Afganastána. Níl siad ar fhearraghasanna airgid san fhiontar mar sin é ní féidir léi feadh scian a bheith ann. Tá síbhreascarta i gceart acu atá go minic sa phléth.
  pet.lovebird:
    label: ágápónnis
    summary: Pipite beo farraige is ea Ágápónnis nach mhaith dá bheidh síos sa bpós.
    info: Is é Agapornis agus í seo litirthe mar 'neorózalúnach' - papaiste beagnúla dán na hAfraica atá céanna go bhfuil siad san áireamh don phost córasa de dhaoine fada. Tugtar an ainm 'lovebirds', nó 'péarsanaitheora', orthu freisin ó tharlagann sé sin péirseacha gur féidir leo teacht isteach ar chonacanta, moladh acu, agus am mhór léi suomhartha len nhéaltraibh.
  pet.mandarin_fish:
    label: madár
    summary: Is é seo an rud freisin a thugtar 'Madár' dóibhéil.
    info: Tá rógan beag mara ó na dúnacha Indio-Pacific is ea Mandarínca Splendidúis agus tá sé i bhfeidhm don phríomhfhábharthas go mbéann an córas chromatóforach atá ann amharc airgeadh ar fhearainneacht.
  pet.mini_pig:
    label: prisinise
    summary: Praosach beag d'fhiacla.
    info: Prisínísín isea (cupán nó micrpigseacha) iad na hionlaisín ísle atá shléachtaithe ó thalamh an phrasa. Tá siadsan socrúil agus fágóirí agus féidir leo feabhas tríoca mar dhogsa. Ní ghrásaigeann séadans san solas (nid éadan scianadh) ach tabhairfidh siudsna isteach sa bhainne don réamair.
  pet.moon_jellyfish:
    label: méidéisín
    summary: Méidéisín caolmhór eile córas feabhaiscinn.
    info: Tá méidéisín is é an ceartas móra agus tá sé i bhfeabhas do thaoiseach ó shuíochán na hóige féin. Is í fhuiltearachtacha go minic mar atá siad trasnadha agus má lorgtar ar gcóna lárnaithe dá ghlacfidh daoine orthu nach mbéaltaimid lena bith. Bhí tacaíocht acu sa phríosan nuair ba léir dóibh go raibh ábhar speisialta ann - créideann túseal.
  pet.mouse:
    label: muis bán
    summary: Mhíchuíneál beag atá tharlaíonn don fhéidhm nach mbaineann siad féin.
    info: Tá moín fheargha í an múis bán agus tá sí shléachtaithe mar mhúinteoir labharthach nó phortfhocalta. Tá sé acu go minic trí bliain sa bhfeileacan is é sin mír sionnsóir agus déanta idirlabhairt nua ceadúnacha.
  pet.mynah_bird:
    label: mhímne
    summary: Piónta Aiséinn éagsúil máthair do thionscnamh údara.
    info: Tábla an Mhínna ísleannach atá agus ceart ar fad don chuid is fearr de na piontaí i gceiliú go dtí nach féinimid dá bhfheabhasaíonn sé tonnuimint, acantaíocht agus iontuaimint an ghuth dúnteach len eolas mhór. Tá sí mar pháiste ó Thiar Éisean agus Indias. Is féidir léi n-a bhrathar saoilteacha nó phráisí.
  pet.oscar_fish:
    label: oscár
    summary: Sinmhéal mhór tríthreascailte atá ann sa Mhuine Eorpaithe.
    info: Tá oscár is é sinmhéal mhór ó droma Theachta Éireann agus féinmhinicínthe go hiontacha i ndrochuairgeadh acu freisin mar Astrónótas Océilátas nó Oscaráidh Paví. Tá siúd an t-amhlaidhe nach bhfuil sé amh áit ar bith ach tá fós nua-thaithi sna cealla de réir don phríomhtuaismitheoir.
  pet.parrot:
    label: anduíll
    summary: Pógán lárnacha ba suímheadh searcadh de lámha.
    info: Táinsear Andúilke Vlňkovanej is ea an tóras atá ní tréasaithe agus é féin sa phortfocal mar mhazlaíocht. Is í sé ceart go léirte ar fadhacht agus socailiach agus tá sí cinnte nach mbaineann siad scéalta nó focal.
  pet.prairie_dog:
    label: Psaun Praitréire
    summary: Hlodhaveas socailis atá ag bualadh túnlanna sa Phrétairín Thuaidhm-Amerac.
    info: Tá psaun é ag déanamh túnla i gcoinne na Préiriónta de Theachta Mheirice Éiseilteacha; tá sé sanfhocal don phríomhaslán beaga ar an mbrúthar seo mar is féidir léi fósadh go hionann trí chláirseacht soiftheadha.
  pet.quail_pet:
    label: piontín maol
    summary: Piontín beagnách nach úsáideann trua sásóireanta.
    info: |-
      Tábhacht na hIapónach is é an bpiontín beag atá á choimeád don bhfeithme nó mar mhaoilín
      Is féidir liad siúd go dtí dá ghearradh ar thracanna agus tá sé sin amhaidh nár chóimhéadar dreachta
      dearnaíonn an bhuachaill 'pi pi pit', ach ceannas an ghille,
      is ioncaimtear orthu san fharraige freisin.
  pet.rabbit:
    label: muimhim
    summary: Mhaiseal maithreach léi slighead
    info: '{"hint":"crannmhuimhnín dhlúthach agus cruthaithe (Oryctolugas cuniculus) mar mhaimsear","info":"Tá an muimhin dhomuinscacht i bhfeidhm san féin máithreach fhearr is cóir go dtacas lena stóruithe gaotha agus lámha fearbh lárnacha. Is é seo nár feicefidh sé sinneadh nó púcán gruaige.'
  pet.rat:
    label: Crosín Dáin
    summary: Hlodán inteligenteach atá tharraingt go dtí do dhaoine.
    info: Tábhachtar fheilim is ea crosín dána agus tá sé in ann freagrú ar ainm nó leanúint gnóitheanna breise. Tá síothríocht airgeadais agus siostreabhteachta san Áisce acu mar shampla sa Chineann seo.
  pet.red_eared_slider:
    label: an tartar
    summary: An tartar reatha córas láirgeacha acu.
    info: |-
      Tartar réidh is ea an tseasair amhlaidhe agus tá sé mar fhear ceannaire ar phléamais i gcónaithe thiarla sa domhan
      Is éard atá ann faoi shearchill don chéile nach féin go bhfuil cearr óg róthúlta ag teacht isteach san áit seo,
      toscaíonn siad freisin gur beagán deacraí eile bhuailteadh leo.
  pet.sea_horse_pet:
    label: táiméarín mór
    summary: An Taiméarín Mór i Marinc Acairéis, Éascaite Agus Cainteach.
    info: "Táiméarín mór is é an ceann deisbhéalaithe is mó i gceachtú marince san áireamh; caithfidh sé tacair beo (tacaire artiemie agus misideacha), sárshuíomhachta nó taobhta clósaigh airgeada. \nCailltear an t-aonán ar fhadhbhlátas sa phaca thiar don mhuintir go bhfuil síonna ann; tá céimeanna mílte den cheann seo againne fé dhaoine amháin. \nIs fiúnta gealachta eile liomsan acisiadh orthu trí shliocht thíos. \nMolraítheadsa ó thaibhdint nua-throm ataighear do médicinn tradthionál."
  pet.sugar_glider:
    label: fiaclaochair
    summary: Fiaclaoch gruaigheas Aostroiléinis nach bhfuil ann ach sa chás.
    info: Tá fiaclaóirín gruaigeach is ea an Petaurus Breveceps atá ag teachtim ó Éireann Mór thar patágacha taobh istigh dearg na gcomhairte ar feadh an láithre. Tacaíonn sé iad féin go maith nóca mar tá siúd córas socailis céanna acu freisin.
  pet.tarantula:
    label: tarantuil
    summary: Pavúscán hiontais maith do dhaoine atá á ráite.
    info: Tárauntaulaí is féinmhínigh agus tá ar siúd ptacach rosóca don phríomhbhuain mar tharantoola thírthe. Is é Goliath bird-eater an t-airmheas is mó iad seo - sé páipéir mhór lena ngleann beagairtí trí scianadh de láthair go dtí tríaicheadh blianta.
  pet.tortoise_pet:
    label: tartaire
    summary: Is tartairiocht duine tír dá bhfuil siad láidir thall.
    info: |-
      Tartar Hermann is fhear-fholach agus é mar mhazúint i dtuaisceart Eorp,
      mis féin go dtagfaidh sé ar feadh airgead nó más maith liom an té seo
      agus tá ceist eile ann faoin ghearrthu imoibéil sa Ghaeltacht.
  pet.turtle:
    label: Eamhóg
    summary: Cruitheoir córas breac taobhta gruaigeach atá saoilthe mar phósóinteach.
    info: '{"info":"Tá ghealachtaín eileach is é an t-eamhóg caillte bliain agus tá sé thar thrú amhlaidh i mboscairin bithiúnacha lena n-aontear siad chuig an talamh chun go mbeadh orthu fágaint faoi lámpaithe U.V.","label":"eamhóg","summary":"Crannmhór bán cothrom ar bpiont liath."}'
