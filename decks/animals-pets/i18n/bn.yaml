lang: bn
pivot: false
title: পালন করা প্রাণী
cards:
  pet.cat:
    label: বাড়ির বিড়াল
    summary: নির্ভরশীল পালতে হয় না এমন মসৃণ খুড়িদার ঘরের পাল
    info: বাড়ির বিড়াল হলো কৌতূহলপূর্ণ জাতের সদস্য যাদের অভ্যেষ্টি হিসেবে চাষ করা হয়। এটি গতিশীলতা, স্বচ্ছতা আর স্বাধীন চরিত্রের জন্য পরিচিত।
  pet.dog:
    label: কুকুর
    summary: মানুষের বিশ্বস্ত পালনপোষক এবং সহচর।
    info: গৃহপালিত কুকুর হল মানুষের দ্বারা অভিযোজিত আধুনিক ভাইয়াল জাতির গৃহপালিত প্রাণী। এটি মানুষের সবথেকে প্রাচীন গৃহপালিত প্রাণী। এখনও প্রায় 400টি উপজাতি রয়েছে এবং এটি 'মানুষের সেরা বন্ধু' নামে পরিচিত।
  pet.goldfish:
    label: সোনালি মাছ
    summary: গৃহপালিত সোনার আকুরগাটে পানির মাছ।
    info: সোনালি মাছটি Carassius auratus জাতীয় এবং বিশ্বজুড়ে অ্যাকুয়ারিয়ামে চাষ হয়। এতে শত শত রঙের ও ফিন ধরণের ভিন্নতা দেখা যায়।
  pet.guinea_pig:
    label: মর্চে
    summary: একটি ছোট ফালফালে গুহ্যপথী প্রাণী, শিশুদের জন্য সবচেয়ে বেশি আদরণীয়।
    info: গৃহসজ্জা মর্চে একটি দক্ষিণ আমেরিকান হলোড়াভূক্ত প্রাণী। এটি ধুনী শব্দ করে, অত্যন্ত বন্ধুত্বপূর্ণ এবং মানুষের সঙ্গে থাকতে ভালোবাসে।
  pet.hamster:
    label: গুহ্য পাখি
    summary: মেসোক্রিসিটাস গণর একটি ছোট কীটপতঙ্গ।
    info: গুহ্য পাখি হল জনপ্রিয় ঘরের মানবজন। তাদের চোয়ালে খাবার ভর্তি থাকে, তারা আধিকাংশ সময় রাতে সক্রিয় ও ডালি ধরে দৌড়াতে ভালবাসে।
  pet.parrot:
    label: পাপুয়েক
    summary: রঙিন পাখি যা মানব স্বর অনু�রণ করতে পারে।
    info: অ্যান্ডুলকা ভ্লিংকোভানা হল এমন একটি পাপুয়েক জাত যা পালনের উদ্দেশ্যে সবচেয়ে বেশি পরিচিত। এটি বুদ্ধিমান, সহজাত ও শব্দ এবং শব্দগুলি অনুকরণ করতে সক্ষম।
  pet.rabbit:
    label: খরগোশ
    summary: দীর্ঘ কানযুক্ত একটি চুলের মাঝা।
    info: বাড়িতে রাখা খরগোশ (Oryctolagus cuniculus) পালনের জন্য সম্পূর্ণ উপযুক্ত একটি প্রাণী, যার ছিটফোঁট শরীরের আবরণ ও দীর্ঘ বৈশিষ্ট্যহীন কান রয়েছে। ইহাদের খাদ্য হল ফসলের অবসর, ভিটা ও গাঢ় সবুজ ঘাষা।
  pet.turtle:
    label: জেলভা
    summary: কঠিন প্রস্তরনির্মিত খোপযুক্ত ধীরগতির সাথী।
    info: এমডিডি পরিবারের এই লালবুকটি জেলভা ঘরে রাখা হয়। এটি কৃত্রিম আলোতে উষ্ণ ভাবে গরম করা ও শুকানোর জন্য অ্যাকোয়ারিয়ামে চলে আসে।
