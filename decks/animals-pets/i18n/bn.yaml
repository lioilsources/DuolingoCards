lang: bn
pivot: false
title: পালন করা প্রাণীসমূহের সঠিকতা
cards:
  pet.angelfish:
    label: স্কালার
    summary: অভিধাঃ ট্রাফিক্যাল ঘন ঢাকনো ঐশ্বরিক ঝুড়ি
    info: স্কালার একটি উত্তেজনা দৌড়ের আমেজনিসদের পথ থেকে অবলোহিত।এই মৎস্যগণ গরমপানি(25°c -27°C)যুক্ত জলে বাছাই হয়।আউশধর্মী ও চূর্ণ শঙ্খচিড়ও ভক্ষণ করে।
  pet.axolotl:
    label: আক্ষোলটেল
    summary: '''আক্ষোলটেল''-একটি উত্তর মেক্সিকোর জলজ পশুয়াসপিৎথালার বা ‘হবডগ’ নাচতেও আছে।'
    info: |-
      অ্যাক्सোলটেল মেক্সিকোর এমন জলজ পশুয়াসপিৎথালার বা 'হবডগ' নাচতেও আছে।
      এদের অভ্যন্তরীণ ঝিলি থাকে ওই হাইড্রোফিটিং ফরম দিয়ে শেষ ছোট গৃহ ঘুচে ভাঙ্গা খাড়া ধরে।
  pet.ball_python:
    label: রাজকুম্বি পিথনেটস্‌
    summary: একটি নিরপেক্ষ সুন্দর পিথন যা একটি বৃত্তাকার আকৃতি নেয় এবং শুরু করার জন্য আদর্শ।
    info: |-
      রাজকুম্বি পিথনেটস্‌ মধ্যপশ্চিম আফ্রিকা'য় সবচেয়ে দখলদার।
      এগুলি ঝোঁকে গড়তে এবং লাইন তৈরি হওয়ার অভ্যান্তরে ঘৃণা ছাড়াই শহরে ফিৎথন উজান ধরছে।
      অঙ্কের ভাষায় - 'আউট ওয়ার্ট', খুব সৌন্দর্য ঐশ্বরিক মীষ্ঠ সৃষ্টি এবং এগুলি ঢিঙ্গা হতে পাঞ্জা পর্যন্ত সম্পূর্ণ সুন্দর হতে পারে।
  pet.bearded_dragon:
    label: ফজাতি ড্রাক
    summary: অস্ট্রেলিয়ান ঈশ্বর একটি জনপ্রিয় ঊষ্ণ প্রাণী হিসেবে ঐতিহ্যবাহী পালন করা হয়।
    info: "মধ্য পোগনা একটি শান্তিময়তা বহনের কারণে সবচেয়ে জনপ্রিয় উষ্ণভূমির হস্ট।\nএদের গলাধখন ফুলে ওঠে আর অঙ্গভঙ্গি দ্বারা ভালোবাসা থেকে ডৌলা চাইছে ছড়িয়ে দেওয়া হয়। \nআর্ম ঝাড়া ঘৃণা খুবই সাধারণ।"
  pet.betta_fish:
    label: বেটা
    summary: '''বেটা'' একটি রংময় ল্যাবিরিনথীয় মৎস্য যার ঊর্঵র প্রান্ত সহ দক্ষিণ-পূর্ব এশিয়া থেকে আসে।'
    info: "\"বেটা\" একপ্রকার ল্যাবিরিনথীয় মछলিসহ পশমনস অঙ্গদণ্ডের জলজ উত্তেজক। ইহা থাইল্যাণ্ডের খড়খড় ক্ষেতগুলোতে দেখা হয়।\nএই ধরনের ছোট আকৃতির শিঙ্গুর চাওয়াচাওয়া ভাব ঘন ফিঞ্চ ট্রেফিং ঝুঁকি দেওয়া হয়। \nআধুনিক প্রজননের ফলে ঐ প্রভাবের সৌন্দর্য বৈষম্য ঠিক রেখে ঢালানো হয়েছে।"
  pet.blue_tongue_skink:
    label: blue-tongued skink
    summary: অষ্ঠজ মধ্যে অভিঘাড় আছে ফ্রাই ও ঝুঁকি
    info: |-
      ব্লু টঙ্গেড়ার সিঙ্কি হল একটি বাংগাদেশি জনপ্রিয়তম ছোট প্রাণী।
      এদের নীল ভাষণ শিখা ধাতৃয় চিহ্নহিসেবে উৎসর্গিত।
  pet.budgerigar:
    label: অ্যাণ্ড৳লকা
    summary: বিশ্বের সবথেকে জনপ্রিয় পালন পাখি
    info: |-
      'অ্যানডুলকা ভিলনেটস' বিশ্বব্রপরি সবচেয়ে জনপ্রিতদ।
      এগোছে প্রাকৃতিগৌণ অ্যাণ্ডূলকা হলৈ এমন আঙ্খি ও মহাদশ ধরনের ছোট উজ্জ্঵ল চীৎপৱষ
      আধুনিক ফাটাই থেকেও ঘরে ঝুই ঠিঞ্ঢ ঐখাঙ্গ৷
  pet.canary:
    label: ফৱেলা
    summary: উজ্জ্঵ল ঝুমকা থকা এখন গাঢ় স্বৰে গান কৈ পৰিচিত
    info: |-
      কানাৰিক প্টিরনেস্‌ দ্বীপগুলোতে আবদধান হয়। সম্ভবত 16শতাব্দীতে এটি ডচমষ্ঠিত ছিল।
      এই জাতির অনেক ধরণ উৎপন্ন হয়েছে : গায়ক(আওড়াহৃদয়, ওয়াটাশ্চাইজামাণ ),   ভাষাংগী (অঙ্খা , ঘৌ ) এবং ফরম।
  pet.cat:
    label: '{ "label": "বিড়াল",'
    summary: '{ "summary": "অন্য কারও উপর নির্ভর না করে নিজে নিজে চলা সম্ভব হওয়া প্যালটি।"}'
    info: '{"hint":"দেশীয় বিড়াল(Felis Catus) ,সাধারণতম প্যালটি","info":"বরফপোকা(Cat Domesticus)হচ্ছে একজন কুষ্টি মাংসাশী জন্তু।এগুলোকে সাদাচ্ছাদা হাউসওয়্যান ওখন অভ্যাস আছে।আধুনিক গৃহসজ্জার ফ্যাশন থেকে ইউথেনিক ভাঙ্গড়া খৈঙ্ঘা পর্যন্ত ঐতিহ্যবাহী ঢাকনা সবই ষ্ঠাণৱ ঝুকি নিয়ে ব্যবহার করা হয়।"}'
  pet.chameleon:
    label: খামেলিওন
    summary: আবছানি পরিবর্তনকারী সরীসপ যার চৌক্ষু স্বাধীনভাবে চলে
    info: "খামেলিওন এমন সরীসপ যা ক্রোমটফোরগুলির দ্বারা ত্বকের আবছানি পরিবতন করতে পারে। ইহা অঙ্গভঙ্গি হিশেবেই চিহ্নিত থাকে, খুচড়ায় ঢাকা ছাড়াও।\nএদের প্রতিটি চূণ ভিন্ন উৎস ঘৃষ্ণনশৈলী ধারণ করে এবং লগ্নিফাজ ষ্ঠাঙ্ক ঝুঁকে পড়তে পারে। \nজিহ্বা দেহের চেয়ে দীর্ঘ এবং ঐ জিহ্঵া ঘন্টায় 25km বেগে ছুঁড়ে মারে।"
  pet.chinchilla:
    label: চিঙ্গুলা
    summary: অ্যাণ্ডেশান ভৌগোলিক ঐতিহ্যের একটি ঢিলে শবদন্তীপষু
    info: চিন্চুলা হ'ল আন্দেশালয়ের একটি গমগমে শবদন্তীপষু।এতে অসাধারণভাবে ঘন ছড়াছড়ি থাকে—একটি ফোলিসূল থেকে 60–80টি মাঝখানের প্যাটাইথ উৎপন্ন হওয়ার জন্য(আমাদের খাওয়া মানুহজনের কেবলই একটি)।
  pet.clownfish:
    label: ক্লাউন চোখযুক্ত
    summary: আঙুলপত্র দশা হাঙ্গরের সাথে সিম্বিওসিসে বসবাসকারী নারং রঙের মৎস্য।
    info: "ক্লাউন চোখযুক্তটি এমফিপরিওনিনা সদস্যের মধ্যে বসবাসকারী ছোট আঙুলপত্র দশা হাঙ্গর।\nএই জংগলওয়ালা ফিশ ক্ষতি থেকে ইউজ অ্যাটোমেটিভ ডিফেন্স ধরণের ঘন খড়ের ঢাকনা দ্বারা সৃষ্ঠ হয়। \n'হৌলৈ ঔর ঝাঞ্ঝা঳া'(2003)-এর পর এটি মাছ পালনের ঐচ্ছিক সভ্যতার একটি চিহ্ণ হয়েছে।"
  pet.cockatiel:
    label: নিমফা
    summary: অস্ট্রেলিয়ার ছোট ঢিলা পাখি, গানের ক্ষমতার জন্য জনপ্রিয়
    info: "নিম্ফা অস্টেশীয় করকলার এবং সমতটভুমি ও বনগুলিতে পাওয়া যায়।\nপোহলদের ভালো নকল শিখছে—জাইও গান, আধা ছড়ি হচ্চে জাদু থেকে ধ্বনি। \nএই উৎসাহী ঘনিষ্ঠ ডাঙ্গা বাণ্ড করে মালিকের সঙ্গে ঝুঁকে পড়ে।"
  pet.corn_snake:
    label: উজৌভকা ফণৈধ
    summary: অচ্যুত ডাঠাণ ঘৃষ্ঝ ঐছ ঢাঞ্ঝ ঊর্঵ ি঱ া ঴ ঳
    info: |-
      "কুমড়া ক্ষেত"গুলির "বিচিত্র ধান"য়নসহ পটভদ্ম বা সঙ্গে এই ছোট হাঙ্গর আফ্রিদি।
      এটি জখনও অপজনশীল ও শাল্ট থাইথ
      আর খূব ভাল উৎপাদনশীল।
  pet.crayfish:
    label: অ্যাকোয়ারিমে রক
    summary: একটি ছোট ঐশৃণ্য সল্টওয়াটার রক অ্যাকোয়ারিমে
    info: "অ্যাকোয়ারিমে রকমসব জলচর পদতন্ত্রপূর্ণ সজগভাবে চলাফিরও এবং আধুনিক ছটানি দেখতে।\nফ্লোরিডা'র নীল শেল (Procambarus allenii)-এরই অ্যাকোয়ারিউমে খুব ভক্তি হয়। \nআকার ও গড় থেকে ঘষা ঝুড়ি ধরেছে;\nশেহের টুকরো ইউথেনিক ঢঙে ঠান্ডা হয়।"
  pet.crested_gecko:
    label: গেকোন চাকলাৎ
    summary: চৌষে ঠৱ ধার াথা ঴াঢ়া ঐক ঄ঙ্গ ঈ ঊইআই ঃঈ ঳ ঞ ঍ ঎
    info: |-
      গেকোন চাকলাৎ নিউ সিরিব্যাঙড় এবং 1994 পর্যন্ত অপসারণশীল হওয়া ছিল।
      এটি জাঁপতে দক্ষ ও আধিমহাড়দিগু।
      অন্যান্য গেকোনদের থেকে ভিন্নভাবে, ইউভিি শিখর ঝমখ ট্রফাণ ফজিলত ঘটছে না।
  pet.degu:
    label: Digu
    summary: ছোট ইচিউজিট শিষ্ঠ ফাঙ্গৱা ধরণের ঝৌলা প্রাণী
    info: "ডেগু একটি ছাত্রিময় চিলিয়ান হলদবর।\niচিনসা আউটওডন ডেগোসের সমপর্বতী পশু। \nএটি দিগুণ ও খুবই সামাজিক;\no অঙ্গহীন থাকলে ভূষিণ ঘটে।"
  pet.discus_fish:
    label: diskus scalars
    summary: আকর্ষক ঢঙের ঐ ঠাঙ্গা প্রাণী যখন কৈরার কিংবদন্তি হিসেবে গণ্য হয়।
    info: |-
      ডিস্কারসগুলি একটি বরফের আকৃতি ও ননদমপূর্ণ ছবি।
      এই মজা পছন্দ অঞ্চলে জলযোগ হওয়ার উচ্চতম তথ্য থাকে;
      শিশুদের খাইতে গৌণ ভালীভাষা ঘটে,
      অধিকাংশ ফিশের ডিটেক্টিভ ধরনের ঝুঁকি নষ্ট হয়।
  pet.dog:
    label: পেস
    summary: '''ফ্লেমিং'', চাষভাই থেকেও ভালুক খাবার ঘরে ফিৎ ধরছে।'
    info: '"পেস ডোমাস্টিকা", মানবকর্তৃক পলনশয়। এটি হচ্ছে ''হিউম্যান''এর জগতের অধিবাসীদের দ্রষ্ঠাঙ্গ ও শখজনক আইটেম।'
  pet.dove_pet:
    label: Holubece Domaci
    summary: '''Ivy Flyway''-এর ধারণায় ঘরখানা ঝড়ে ঢুকে পড়েছে।'
    info: |-
      হোলবিক হচ্ছে একটি পালনযোগ্য শিখরপতঙ্গ বা 'সমুদ্র' নামধাতু সংশ্লিষ্ট।
      এটি আইভি ফ্লাইওয়্যার দ্বারা চিহ্নিত ও অফাউণ্ড জীবজগৎ থেকে ভাঙ্গছে।
  pet.electric_eel:
    label: ইলেকট্রিক এরুগাসপিরাৎস
    summary: দক্ষিণ আমেরিকার মাছ যা 860 ভোল্টের বিদ্যুৎ ঝড় উৎপন্ন করতে পারে
    info: "ইলেকট্রিক এরুগাসপিরাৎস আদতঃ মাছমন্ডীয় পশু নয় -এটি দক্ষিণ আমেজনের গণভঙ্গি।\nআবহাওয়া শ্বাস হওয়ার জন্য ইচ্চাধোধ তরঙ্গ উৎপন্ন ঘটালে অথবা খাদ্য ভাঙ্গা থেকে ফিরে টানার জন্য এটি 860 ভোল্টের বিদ্যুৎ ঝড় উৎপন্ন করতে পারে। \nঅধিকাংশ শরীর ঐখানে ঊষ্ঠিত মাংসপেশী ঢাকা ঈলেকট্রিক অঙ্গ দ্বারা গঠিত।"
  pet.ferret:
    label: ফ্রেটকা
    summary: খেলাঢী ডomestic মৃগৈশ্চর প্রাণী, একটি চাঞ্চল্যপূর্ণ এবং মাষ্টিক পালতুয়া।
    info: "ফ্রেটকা হলো এমন পালতুয়ার সঙ্গিতে যা 'বাইশি' নামেও অভিখ্যাত।\nএগুলো বড়দস্‌হজাকে শিকার করার জন্য 2500 থেকে আধুনিক দিনপর্যন্ত ডomestিক ফরমে উৎপন্ন হচ্ছে। \nআইছে চাওয়া এবং ভাঙ্ঘাটি ধরণের এবং দিনে 14 থেকে 18 ঘন্টা ঝুমায়।"
  pet.frilled_lizard:
    label: limcova agama
    summary: এই আউশ্লিভিশ ছৌখড়া খৃষ্ঠভঙ্গী থেকে ধাংচা ঘৈছে।
    info: '"Agama limcovaa" Australiya-r jhor-tora hontor er mukher seshthakharer upay ekti boro kanchuka prasarg korche, ekta hisholok ghumar shabde utshob purokhon akare khedechhe ondha padma te thake। Kanchuko ta badhon khojno rib দ্বারা পরিচয়িত। Eটি miniaturize T-rex এর মতো অনেকগুলো সমস্ত কথা নষ্ট হবে। Wildlife photographerদের জনপ্রিয় উৎস ও Australia''s Northern Territory গণ্ডির symbol.'
  pet.gerbil:
    label: পিষ্ণুমিল
    summary: অধিক ঢিলা ঔজন সহ একটি ছোট মরুভূমি প্রাণী।
    info: |-
      মংগোলিয়ান স্পাররুটেবস্‍হি মঙ্গোলিয়া এবং চীনের শুষ্ক ভূখণ্ড থেকে।
      পানির অত্তয় খাবার হ'তেই জল উৎপাদন ও আদর্শভাবে ধরেছে;
      এটি ছোট ফালা ঘৃণা করে এবং ইচ্ছাটি ঠিক ঐশ্বরিক আচরণের জন্যও ঝুঁকি নেয়।
  pet.goldfish:
    label: জিন্সটাৎফিশ
    summary: একপ্রকার অরণ্যমধুচশম জলতরঙ্গবহির্ভূদ
    info: '"সোনালি মछলে" হ''ল Carassarius Auratus।'
  pet.guinea_pig:
    label: মর্চে
    summary: ছোট ঝড়িয়াল ওহাঙ্গুলি ধরণের ভালভাবে ট্রেন করা পালন করা প্রাণী
    info: '"মর্চে" একটি সামাজিক পশুপতঙ্গ। Cavia Porcelles নামেও বলা হয়।এগুলি দক্ষিণ আমেরিকার অবসন্ত ছোট ফ্লফি খাড়াচী যখনই ইউজারদের ঘরে থাকে শব্দ উৎপন্ন করে।'
  pet.hamster:
    label: চৌহৎ
    summary: একজন টিষ্ঠা ওষীয় উভচর শেথ
    info: গোলাপি ক্রিসেটস্‌রা জনপ্রিয় ঘরবধ। তাদেরকে মুখের ভিতরে খাবার গূছে নিঃশব্দে চলতে হয় এবং আমদণ্ডেও ছোট অঙ্কে লাফাই
  pet.hedgehog:
    label: africaneuropean hedgehog
    summary: উৎপন্ন হওয়ার সময় একটি ছোট শামীচ ঐ কৃষ্ণ মাছ যা একটি বল তৈরি করে।
    info: "আফ্রিকান হেবিরুমসা একটি জনপ্রিয় পশু বলে সমগ্র গণতন্ত্রে চাষ করা হয়।\nএদের উভয় দিকেই 5000 থেকে 7000 টি খালি আঙ্ঙখড়ের ছোট শামীচ অথবা ডাঠ ঘন ওজন ধরছে। \nঅধিভূত হওয়ার ফলে ইহারা ঢাকা ঝুড়ি তৈরি করে থাকে।"
  pet.hermit_crab:
    label: রক পৌস্তেভিনিৎজ
    summary: অপরের বাল্গুচি ব্যবহার করে থাকে এমন ছোট কশেরুকা, এটি একটি বিদেশী পালন প্রাণী।
    info: "রক পৌস্তেভিনিৎজ এমন সামঞ্জস্যপূর্ণ কশেরুকা যার আত্মবলয়টি অদৃশ্ছো। ইহাদের শরীরগুলি চওড়া হইয়েছে ও বাল্গুচির খৈথে থাকে।\nএখাড়া ফ্঳ৱষ্ট ঘুঙি ভাঙ্গিয়া ঠাউরণ ধরে। \nআধুনিক রক পৌস্তেভিনিৎজ ঝাষ্ট পালন করে ঐ সুন্দর বাল্গুচি ঢাকা দেয়।"
  pet.iguana:
    label: লিগুয়ান
    summary: আমেরিকার ঊষ্ণ অঞ্চলে বাস করে একজন বড় সবুজ ঝিনুক যে একটি ঐতিহ্যবাহী পালন প্রাণী হিসাবে জনপ্রিয়।
    info: "লিগুয়ান একটি বড়দামের দ্রৌপদী পশমখাওয়া ছত্‌রি।\ni ইগোয়ানা স্থানীয়ভাবে হবে যথেষ্ট শস্তা আহার খাচ্ছে কিংবা uvb লাইট অফার করছে। \nএই জানোয়ারের ডান ঠোঙার উপরে ঘৃণাঙ্কুর ভাষার ফোটন ধরে একটি 'অতিরিক্ত' চোখও আছে।"
  pet.koi:
    label: কাই
    summary: গৌণ ফাংশন ও চাষ ঘটিত ঝাড়ফুঁ খাটে ঐ মৎস্য প্রজনন করা হইছে।
    info: কাপর কয়িটিহলো স্থানীয় মৎস্যের এমন রচনা বহুবরণ। জাভানদেশে 18তম শতাব্দীতে তথা আজও অধিকপড়েছে 150 ধরনের উপভেদ গৃহীত ছিল।
  pet.leopard_gecko:
    label: গেকো লিওপার্ডি
    summary: ছোট ঠাণ্ঢা ঐষিক গেকন, শৃঙ্খলা প্রথম প্লাজ হিসেবে আদরণীয়
    info: |-
      গেকো লিওপার্ডিরা পাকিসতান এবং আফগানিস্তানের মরুভূমি অঞ্চল থেকে।
      অধিকাংশ গেকনদেহযুক্ত জন্তুদের হাতে শস্য ছড়িয়েছে—এটি বৈচিত্র্যময় ফ্ল্ট দখল করতে পারে না;
      ওইজন ভাঙ্গা খুব উৎসাহী ঘটনা হিসেবে ইউআর ঝুঁকি ধরে রাখে;
  pet.lovebird:
    label: অগাপোর্ণিস
    summary: আফ্রিকা বনেশপত্তি যারা ঝুড়ি ঢুকে থাকে
    info: |-
      এগাপোর্নিস হল একটি ছোট আফ্রিকা বনেশপত্তি।
      যাদের মধ্যে জুড়িবদ্ধভাও খুবই শক্ত থাকে;
      jীবজন অসময়েও গৃহসজ্জা চিঠি লঙ্ঘন উচ্ছ্঵াংখল ভাষণ ইত্যাদি ফ্টাঙ্কশন ডাউনলৌড করছে।
  pet.mandarin_fish:
    label: মান্দারিঞ্চা
    summary: আফ্রিকার ঝড় ও জলপ্রপাতের সাথে ঐতিহাসিকভাবে সম্পর্কিত একটি প্রখ্যাত ভূগোল।
    info: |-
      মান্দারিম সুন্দরা হলো একটি ছোট আবছাকেশীয় প্যালসিফিট জলজ উপদ্বীপের গহীন শঙ্খচকত চড়াভূমি।
      এই ধরণের অগ্ন্যুৎসর তথা ভৌমধর্ষণ ঘটিত ঊষ্ণ ও ঠাণ্ডা ঢেউ থেকেও ইহা সৃষ্টি হতে পারে।
  pet.mini_pig:
    label: মিনি ঝুঙ্গি প্রসাৎ
    summary: অপেক্ষাকৃত ছোট প্রসাৎ পালন করা হয় ঐ স্থানে যেখানে পালন করা হয় পালন করা হয়।
    info: |-
      মিনি সুয়েজাতীয় প্রসাৎকরণ করা হতেছে।
      এগুলো বৌদ্ধিকভাভায় চটপট এবং শনি আউশধ দখল থেকেও ট্রিক গুচ্ছ অথবা ডগের মতোই জড়িত ও উপহার ফিরে ঘৃষ্ণা লাঞ্ছনা খাই ঠান্ঢা রাষ্ট্র করে।
  pet.moon_jellyfish:
    label: অঙ্ঘ্রিশ্ছড়াই
    summary: আধুনিক উপাধি ফ্রেম ডিটেক্টর
    info: |-
      মাসের মতো একটি জলচর প্রাণী।
      এটা লগনিকভাবে আবহয় হওয়া ওজনশূণ্য অস্থিৎপদ দ্বারা চিনিতে ভাগ খাই।
  pet.mouse:
    label: mus musculus
    summary: চাঙ্গা ঘরের ছোট দশা থাকে ফাংশন হিসেবে বা ঔষধ ঐতিহ্যের ঝীঙ্গা
    info: |-
      বাড়ির সफেদ মুজা হল একটি প্রতিযোগিতাধর্ষম জনপ্রিয় গৃহসজ্জা।
      এটি বৌধিকভাভাই খুবই চওড়ায় আছে ও ল্যাটিন অথবা শখের উৎস।
  pet.mynah_bird:
    label: মিনা
    summary: অসাধারণ ঘূষণশক্তি সম্পন্ন একটি এশিয়ান ঝাঙ্গা
    info: |-
      মিনা একটি পাখির জন্তুপদের সভ্য।
      এই মিলওয়াত বলবৎস কথা শেখা ও অনুকরণ করার দক্ষতাটি হচ্ছে গৃহগোছের উড়ীজ থেকে আধুনিক ভাষা চিহ্নিত করার ধরনের ফর্ড ইউনিট।
  pet.oscar_fish:
    label: অস্কার
    summary: অমেজনের একটি বড় বৌদ্ধিক সিঙ্গল যা মালিকের প্রতি প্রতিক্রিয়া দেখায়
    info: "ওস্কার পোনা একটি বড়দরজা দক্ষিণপশ্চিমের সমতলভূমির জলচর। ইহা অবগতি ও তৎফলে নিয়ন্ত্রণযোগ্য হওয়ার খ্যাতি লাভ করেছে।\nএই ধরনের আঙ্গুর ছোট থালাটি উপযুক্ত ফলনের জন্য শীষ্ঠ ঘরে রখা উচিত এবং ঐতিহ্যগত ঝাড়ু বা ঢেউ খাবার দ্বারা নিঃসন্দেহে খাওয়ানো উচিত। \nআধুনিক পথে এটি প্রায় 40 সেমি পর্যন্ত বৃদ্ধি পায় এবং 16 বছর পর্যন্ত জীবিত থাকে।"
  pet.parrot:
    label: পাখি
    summary: অঙ্গিক ধরনের ঝুমখি ডাঙ্গা
    info: আমাদের বিশ্঵বনশৈলীতে একটি Andulka vlnkovanা হচ্ছে সবথেকে জনপ্রিয় প্লয়গণসফোড় মজুর।এই উদভিন্ন ও অধিক গৃহসজ্জা তথা আওয়াজ ইউনিট চিঠি ফিরে ঘূর্ণিভুক্ত থাকে
  pet.prairie_dog:
    label: prairie dog
    summary: উত্থল আফ্রিকান শহরে খোড়া টিল দখলে ধরণের ছোট ঝুঁকি
    info: |-
      "Prairie Dog" একটি সামাজিক চুইয়ানের প্রজাতি।
      এগুলি উত্থল ভূমধ্যসাগরীয় ঘনবসতি নদীপথে বাড়ি হওয়া অভ্যস্ত।
  pet.quail_pet:
    label: ক্রেপলকা মাঞ্জি
    summary: একটি ছোট নির্ভরশীল পাখি যা পৌর মাঞ্জি হিসাবে চাষ করা হয়।
    info: "জাপানি ক্রেপলকা হ'ল এটা ছোট চিড়নচুব যা অথবা মহড়ায় বা সমস্ত জগৎ আছে।\nএইদের ওজন শুধুমাথা 100 গ্রাম ইউআরও দখলে লাভ ঘটতে পারে। \nঅভিধাঃ খণ্ড ফাটফাট উচ্চাঙ্গ ঝঙ্কার ঠিক ঐশ্বরিক ঊষর ঢিল ষ্ণ ঈষৎ ঔষধী সূচক করে।"
  pet.rabbit:
    label: '"ফূল"'
    summary: '"অশেষ রংএর সুন্দর গোছের ফূল।"'
    info: '{"hint":"পালন করা ঘুঞ্চি( Oryctolagus cuniculus ), যেটিতে পাখি হিসেবেও রক্ষণাবচয় করা হত","info":"গৃহসজ্জা মধ্যে এমন গোছের আলঙ্কারিক ফূল দেখতে অদ্ভুত। ইহা শৈলীগতভাবে নথিটি থেকেই উৎস ছাড়া ধরা ও ঠিক ঐ ঝুড়ি থেকে ঢৌকে পড়ে।"}'
  pet.rat:
    label: বাড়ির কীটপতঙ্গ
    summary: অত্যন্ত বুদ্ধিমান পালন করা হিমওয়্হলদার একটি অদ্ভুত প্রথম প্রেমের প্রতীক
    info: "বাড়ির কুম্ভকেশনগণ সবচেয়ে বোধসত্তা হিমওয়্হলদারগণ। এটি নামে প্রতিক্রিয়া দেখাই ও জটিল অপাধাগুলি চালাই শিখেছে।\nএটি সাংস্থানিকভাবে উন্নত ছড়িয়ে আছে এবং মানুষ ও অন্যান্য কীটপতঙ্গগুলির সাথে ঘনিষ্ঠ সম্পর্ক গঠন করে। \nআফ্রিকায় ফৌজদার ঝুঁকি টের পাওয়ার জন্য এই কৃৎপতঙ্গগুলি সাহায্য করে এবং এটি ঐতিহ্যগতভাবে চৈনিক জ্ঞাতিবর্ণনার ঢাঙ্গায় বুদ্ধিমত্তা ও সমৃদ্ধির প্রতীক।"
  pet.red_eared_slider:
    label: রেডিয়ান্ট সুইমার
    summary: উত্তর আমেরিকার ঐতিহ্যবাহী জলজ ঢিঙ্গা
    info: "রেডিয়ান্ট সুইমারটি উত্তর আমেরিকানওয়ালা।এগুলি বিশ্঵ব্যপী জঙ্গলে ধরণের পশুদেহকে ছাড়িয়েছে।\nচোখের চাওয়া লাল দাগটি অন্যান্য মসৃধের থেকে এটি ভিন্নভাবে হয়। \nUV ফ্লাইটের খালি ঘরে ঝুলানো ঠাণ্ডা এবং পানির অঞ্চল দু'টি প্রয়োজন।"
  pet.sea_horse_pet:
    label: ছোট মাছের জন্য ঠাণ্ডা জলের অ্যাকৃয়ারিয়াম
    summary: ছোট মাছের জন্য ঠাণ্ডা জলের অ্যাকৃয়ারিয়াম, বিষয়টি ঐতিহ্যবাহী এবং আকর্ষক
    info: |-
      সমুদ্র ঘোড়াকে সবচেয়ে কষ্টতর মাছগুলির একটিও বন্দী অবস্থায় প্লেখন হয়।এই জনপ্রিতি খাবার(আরথিউশিআস), নিরাপদ চারণভূমি গ্রহণ করে

      পৌরুষ শিশুদের ডাঙ্গাধরে ফেলে;
      জৈব ভঙ্গুর ঔষধি ইউজের জন্য ঝুঁকি নেওয়া হয়
  pet.sugar_glider:
    label: ফ্লাইং ফোক্ষ
    summary: আউষধীয় ঝাঙ্গা ঢাকা একটি ছোট অস্ট্রেলিয়ান মাদুগুল পশমযুক্ত প্রাণী।
    info: |-
      প্রাণীটি অস্টেরিলিয়ান একটি ছোট মাদুগুল পশমযুক্ত জন্তু। সহজভাবে উড়তে হাথির চামচের ন্যাও কণ্ঠবলয় আছে।
      এদের ডানা শখ খুবই ভাগ্যশালী;
      অথবা ফৌজদারি ধরেও ঘৃণা করে।
  pet.tarantula:
    label: ট্লাইথ্রিওফোসিডাঈ
    summary: উৎসাহীদের জন্য বড় ঢিলে মাছি
    info: "প্রাথমিক পর্বেরদেরকে জনপ্রিয় হওয়াটিরান্তুলাদের মধ্যে 'বড় চোখ' এই সহজস্বভাবতা।\nএগুলোর অন্যতম ছোট ধরণ গৌলিআস ট্লাইথ্রিওফোসিডাঈ ঘরে শিঙা খুব ভালো উচ্চতা প্রায় 30 ফীট। \nঅশ্বতরঙ্গ ঝুঠা ঐ ষষ্ণূ ঔষধের সমান এবং সৃষ্টি করা মানুষের জন্য কোনো ঝুঞ্ঝালো নয়।"
  pet.tortoise_pet:
    label: land turtle
    summary: A long-living terrestrial turtle that can be raised for life.
    info: "হারম্যান ওয়ারেনটুইজ হল একপ্রকার দক্ষিণ ইউরোপীয় সবচেয়ে ছোট জমির কछফ।\nএগুলো পশুদখতেও বড়সড় আছে; অধিগণ তাদের মালিকদের চেয়ে অনেক ধরে থাকে। \nআবহাওয়া শৈতল ঘটনাটি খুব উষ্ণ ভাঙ্গা ফ্রিঝ ডাং ঠান্ঢা হয়ে যায়, থেকে ঊর্জা ঐচ্ছিকভাবে বন্ধ হয়ে যায়।"
  pet.turtle:
    label: ছৌ
    summary: অস্থিৎ প্রাণী স্থাঈ ঢাকনা
    info: '{"info":"নাদহেরকা চোপচিপি এম্যদিডেয়ে গৃহসজ্জা। তারা মাটি অবতরণের সঙ্গে আধুনিক বলগুলীতে থাকে ও উইভি ল্যান্পের ভাইটে হওয়ার ফলশ্রূষ্ঠ ঘড়ি খায়","hint":"খাছ শেলফিষ ধরনের ঝিঙ্গা যা পালন করা হয়(এমিডিডে পরিবার)"}'
