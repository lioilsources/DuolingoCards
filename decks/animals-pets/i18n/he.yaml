lang: he
pivot: false
title: חיות מחמד ביתיים
cards:
  pet.angelfish:
    label: סקלאר
    summary: рыба тропическая дисковидная элегантная с вытянутыми плавниками.
    info: "скаלר האמזונס הוא אחת הירקות המועדון הפופולריות ביותר בבריכים בגלל צורתו המשושה והאגדית וקצותיה הארוכים של כנפי השחייה שלו.\nit בא מזרם הנהר אמזונה ומתאים למים חמים (24 עד 28 מעלות Ц). \nהוא טורף ומכלוך יכול לאכול דגים קטנים יותר.\nביפן סקלאר יפה היה הראשון מהדרכים הקטנים שהובאו בשנת תרפ\"ט."
  pet.axolotl:
    label: אקсолוטל
    summary: זחית מקסיكي המתקיים תמיד במימי עם חרufe
    info: אקסולוטל הוא זוחה מים מהמקסיקו שמשמר את彤 של נבצתי לאורך כל חייו (נויטניה). יש לו חפתות פנימיות וביטוי ייחודי ונעוץ. זהו אורגанизם אנדמי לทะเล האוקשימילקו ב מקסיקו והוא בסיכון גבוה מאוד.
  pet.ball_python:
    label: royal python
    summary: 溫馴、能卷成一顆圓球的小型蛇類，是初學者理想的寵物爬蟲
    info: |-
      蟒蛇來自西非和中非的草原與森林地區。當受到威脅時，它會捲成緊密的一團（因此得名球形蟒）。體長約為一百二十至一百五十公分且壽命超過三十年。
      目前已在人工飼養下培育出八千種以上的顏色突變。
  pet.bearded_dragon:
    label: latran me'ushar
    summary: עכברים מאוסטרליה פופולאריים מאוד כתוצר טרופי
    info: |-
      לטראן עם שיער הוא אחד מהסנakes הפופולריים ביותר בבריחה בגלל המינדום שלו
      שיערו מתפוצץ ומחשיך כהבעת רגשות או שליטה
      הוא מתקשר באמצעות תנועות זרוע כמו жест подчинения
      הוא אוכל הכל – חרקים, ירקות ואורז
  pet.betta_fish:
    label: betta
    summary: דג לבנבן בצבעוני ולובן מהמזרח התיכון.
    info: bettasplendid הוא דג לabyrinתי שמשתף באוויר באמצעות איבר מיוחד וחי במקווי אורז מודרים בטאילנד. הזכריים הם אלימים זה לזה - משם השם bettasiamensis. על ידי גידול מבוקר נוצרו צורות מרוממות עם חוטمي עיניים גדולים מאוד.
  pet.blue_tongue_skink:
    label: סקינק עם שפת כחל
    summary: 잉어프는 오스트레일리아의 큰 도마뱀으로 눈에 띄게 파란 혀를 사용하여 위협을 주며 경계합니다.
    info: סקינק עם שפה כחולה הוא ינשוף אוסטרלי גדול עם חרק לבן ומיוחד במיוחד בזנב הכחול שלו. השפה הבהירה משמשת להרתעה של טורפים – הצבעה האגרסיבית מפחידה אותם. זהו בעל חיים לא אלים, עגלגל ומתקדם באיטיות מאוד פופולרי כתוצר דומestic.
  pet.budgerigar:
    label: 앤드올카
    summary: העוף האקראי הפופולרי ביותר בעולם הוא птица маленький австралийский попугай
    info: אנדולקה וונלקובה היא הנפוצה ביותר בעולם אחרי הكنרבים. אנודלקי בטבעיים צבועים ירוק ואפור; מוטציות בצבעים כמו כחול לבן אפור נוצרו על ידי גידול מבוקר. זכרים יכולים לחקות את קולה של בני אדם ול aprender מאות كلمאות
  pet.canary:
    label: канарец
    summary: Маленькая певчая птица порода выведена за голос и ярко желтый окрас.
    info: |-
      {"hint":"ציפור קטנה שרה מ养殖出于其声音和鲜艳的黄色（金丝雀）","info":"הゴールドフィンץ' מגיע מהאיים הקנריים ותורם על ידי המעצנים הספרדיים במאה ה-15。
      באמצעות גידול תקינות נוצרו סוגים רבים: שרירים (롤러, 워터슬래거), צבעוני (אדומים, לבנים) ומorphs שונים。
      זכרים יוצרים סמללים מורכבים; הם לומדים קטעי노thersשירים。
      בהיסטוריה משמש כמגשר לאיתור דו חמצן פחמן במכשאות הפחם."}
  pet.cat:
    label: قط
    summary: حيوان أليف منزلي مستقل مع قدمين ناعمين.
    info: |-
      {"hint":"החתול הביתאי (felis catus) הוא חיות בית נפוצה","info":"קַט שָׂמֶל הינוו זִי מֵעֲרֻב פְלוּס קֹאטוס שֶאצֳד יוניק"לים כחן ביתיים. זו famous לחריפות, cleanliness וטבע עצמאי.","label":"קט",
      "summary":"חיית בת גברת עם רגליים חלקות."}
  pet.chameleon:
    label: カメレオン
    summary: 体調節とコミュニケーション目的で肌の色彩を変えられる両眼分離動作を持つ動物
    info: |-
      カメレオンは、クロマトフォアを使って皮膚の色を変える爬虫類です。この能力は主に感情表現のために使われます。左右それぞれの目が独立して動くことができ、ほぼ360度を見渡すことができます。
      舌先には捕食対象に向かって時速約57キロメートルで突進する長さがあります。
      木々の中で生活し、枝などをつかむために特化した足を持っています。
  pet.chinchilla:
    label: '"צ''ינץ''ילה"'
    summary: חיידק אמרิกני דרום אפריות עם סיב הכי גזוז בכל המammals היבשתיים.
    info: '{"hint":"חיה נמוכה עם שיער רך מהאמריקה הדרומית עם חוט השער הצפוף ביותר (Chinchilla lanigera)","info":"צ''ינץ''ילה הוא млכד מгорות האנדים עם צלע דחוס ב-record; יש לה בין 60 ל -80 תאי פוליקולה אחת וрастущая волосים (באדם רק אחד).\nהיא נשארת בטמפרטורה עד 25 מעלות цельזיוס; לחום יתר על כן יכולה להיות מסוכנת חיים. \ n היא מסוג שיכול להגיע לגיל 15, לעיתים רחוקות יותר ממאה שנים. \ n בשעתו, היה מאוד יקר את השיערה שלה, כך שהמין בסיכון מאחרי קражות."}'
  pet.clownfish:
    label: \ufeff잕홍 첼껿"
    summary: \\
    info: '{"hint":"\uc795\ud64d \ucef8\ubcc4 \<span class=''highlight''>\uae40</span>\uba8a <br/>\ubeef\udeb8\udaec\ubbfc \uecf0\uaeb0\ufffd","info":"\'
  pet.cockatiel:
    label: ניפמה
    summary: צפר ים קטן מהאיסוף האוטרלי עם כובע, פופולארי בשל היכולת שלו לשיר.
    info: נימפה (קורהלה) באוהרייה מאוסטרליה, שם היא חיה במרחבי עשב ויערות. הזכרים הם מיטמרים מצוינים שמלמדים את עצמם לשיר ולשפת אדם. זהו ציפור חברתי מאוד שמתחבר בקלות עם הבעלים בבית.
  pet.corn_snake:
    label: עقارب שדה
    summary: חמוד צבע כתום-כתמי אורנจ'אי מתאים ל מתחילים.
    info: העקרב השדה נפוץ בדרום מזרח ארה"ב וחי באגמים וביערות שם. הוא לא是有毐且溫和，幾乎不會咬人而且很堅強。它的名字可能來自於玉米田或其腹部的斑點模式類似玉米粒。
  pet.crayfish:
    label: '"רץ''אקوارיון"'
    summary: '"חוט פרווה קטן בצבעוניות במימי מתוק באקווריו"'
    info: '{"info":"אקליפסיים אקואריוני הם תושבי מימי מתוק פופולרים באקווריומים בגלל התנהגותם הפעילה והצבעיהם החיים\.\nThe blue Florida crawfish \(Procambarus allenii\) הוא המין הנפוץ ביותר לאكوוריום\.เขา מאבד את הגבורה שלו בגדילה - גבוורת חדשה היא רכה בהתחלה\. הם שימושיים כנקה דשנים שמתפרקים ואוכלים צמחייה וเศיפים של식."}'
  pet.crested_gecko:
    label: Geckon Shayer
    summary: ג׳יקו נочной עם קרן שערית דומה לחוטי עיניים וחצי
    info: ג'קון השיער מגיע מניו קאלוודיה וחשב כמיירש עד לשנת 1994. הוא יכול לקפוץ והוא פעיל בלילה. בניגוד ל Gecko אחרים אינו צורך תאורה מיוחדים של אורכי גל UVB.
  pet.degu:
    label: ديغو
    summary: חיית חולשה צ'ליזמה קטנה הדומה לשן ונכלה.
    info: דיגו הוא חסיל קטן מהצ'ילה קרוב לכריש ולשנץ'. זהו אורני שמתמודדת עם עייפות אם היא לבדה. דגים נוטים לסוכרת ולכן אסור להם לאכול פירות מתוקים בבריחה.
  pet.discus_fish:
    label: סקלר דיסкус
    summary: рыба дисковидной формы с яркой окраской считается королем тропического аквариума.
    info: דיסקוסים הם דגים טרופיים בצורת עיגול עם צבעוניות מרהיבה מהאמזון הגדולה. זהו אחד הדגשים הקשורים ביותר לבריכת המלחמה; הוא דורש כימיה וטמפרטורה שלמים בводה - בין 28°C לבין 32°ס.דגונים קטנים אוכלים את השארית הנפלטה על ידי שורשי העורות родителиם – תופעה נדירה אצל דגים.
  pet.dog:
    label: الكلב
    summary: חיה משפחתי 忠實 וידידה
    info: '{"info":"הכלב הבית הוא כלב אומן, החיית האומנת העתיקה ביותר של האדם. קיימים יותר מ - 400 תרבויות וכלבים ידועים כ''חבר הכי טוב של אדם''.","hint":"הكلب הביתי (canis lupus familiaris) , חיות בית נפוצה.",}'
  pet.dove_pet:
    label: גוליביץ' ביתית
    summary: 골브이ца לבן טהור המשמש כתペット או לשחרור ב торיות
    info: |-
      ה голוביצה לבנה היא גזע של הולב שונא סלעי משופץ לצביעה بيضاء טהרנית
      זהו חיה רגוע וידידותי; בניגוד לפרפרונים הוא לא מטיח ולא צועק
      משתخدم כחלק מקדושין, קבורות ואירועים חשובים ברחבי העולם
  pet.electric_eel:
    label: אוכף אל렉טרי
    summary: דג ים מתוק שמפיק גלים אלקטריים חזקים
    info: האלקטרוס הלאו הוא דג מים חמים ולא אוכף אמיתי אלא קרוב משפחה של סדרת האוקונייטיס מהאמזונס באמריקה الجنوبית. יכול לייצר ביצועי כוח עד ל - 860 וולט כדי להרגש או הגנה על עצמו.
  pet.ferret:
    label: '"פרטקה"'
    summary: '"животное играющее домашнее млекопитающее из семейства муселидовое, любознательная и ласковая питомица."'
    info: '{"hint":"חיה טרופי שמחה משפחת Mustelidae קרוב לחרשׁים (Mustela putorius furex)","info":"פרטקה היא צורת חיות תקוע של חרשי לבן שנתקעה לפני יותר מ - 2500 שנה כדי להרוג królików .\nהוא любопытный וиграющий; בדרך כלל ישנת בין ארבע עשרה לשמונה עשר שעות ביום והשאר מבלה במשחק דינמי. \nיש לו ריח ייחודי כמו פטרוזילית מאגרות השמן שלו. \nבצ''כ הוא נחשב לנפוץ ונוסף כחייזרי בית נדיר."}'
  pet.frilled_lizard:
    label: agyema lipit
    summary: ינשוף אוסטראלי שמפתח את הקפולתו כדי לסמל
    info: |-
      אגמה ליפית היא ינשוף אוסטרלי שכאשר הוא מודע להгрמות פותח קפלת גדולה סביב צווארו, מייצר רעש של חרקים ו섭ס על הרגלים הקדמיות שלו
      הקיפול מחוזק בעזרת עמודי גב מת장בים
      הוא זורר כמו טיראנוصورקס קטן
  pet.gerbil:
    label: סנאי
    summary: חדל קטן עם זנב ארוך מעוטר מהדברי.
    info: הסנאי המונגולי מגיע ממרחבי הערבה של סין ומונגוליה. הוא מתאים לחיים במדבר – שותה מעט מאוד מכיוון שהוא עיבוד מצוינות את מי האוכל שלו. חי קבוצתי ופעיל במהלך היום, ולכן מתאים להיות חיות מחמד לצפייה. אוהב חופרים תעלות ומתן substrate מספק חשוב כדי להימנע התנהגויות טבעיים.
  pet.goldfish:
    label: דַּג הָזוֹבו
    summary: рыбка оранжевая разводится дома и по всему миру в аквакультурных условиях.
    info: '{"hint":"سمכרה מים מתוקים זעירה用于装饰，养在水族箱中（金鱼）","info":"ז''וזל הזהב הוא דג קפורה מבוקר שמוחדר למקוויי עולמות רבים. יש לו מאות צבעוניות וצורות של חוטמי שחייה.","label":"דג זהוב","summary":" рыба золотисто-оранжевого цвета, выращенная в аквариуме."}'
  pet.guinea_pig:
    label: ג'יף
    summary: חיה קטן כיסי נפוץ מאוד כתהילה
    info: ג'יפון הוא חלוד חברתי מקצה דרום אמריקה. גורם לרעמים קטנים וידבק עם בני אדם.
  pet.hamster:
    label: 햄סטר
    summary: חיית המחם קטנה ונעימה שיש לה מראה של הפן עגמומיים.
    info: '{"hint":"חיה קטן וadorable עם פנים מלאות","info":"הסנאי הذهبي הוא חיות מחמד נפוצה מאוד. היא שומרת אוכל בפנים שלה, פעילה בעיקר בשעות הליל והרבה רצה על גלגל.","label":"hamster","summary":"สัตว์เลี้ยงขนาดเล็กที่น่ารักซึ่งมีใบหน้าอ้วนๆ"'
  pet.hedgehog:
    label: 鼴 טיפוס אתיופי
    summary: קטן ומכרסם המסתובבים ככדור בעת מסוכנת.
    info: העכבר האפריקאי הקטן הוא חיות בית פופולרית שמגורשת ברחבי העולם. יש לו בין 5,000 ל -7,000 סיבים ריקים של קרטאין על הגב שלו. כאשר מודאג,הוא מתגלגל成为一个堅硬的球體。牠是夜行性動物，需要輪子來移動；一晚可以跑達五公里。
  pet.hermit_crab:
    label: рак пустельник
    summary: 작은 갑각류는 빌린 조개 안에 산다. 이국적인 애완동물이다.
    info: |-
      רקט פאוסטווינייק הוא חרק ים שאין לו קירח מוצק משלהו ומכסה את הגב הרכך שלו ב ракלי עכברים ריקים. כשהוא גדל, מחפשים рам更大的贝壳。干燥的寄居蟹被当作宠物饲养；它们是社会性的，生活在群体中。
      在自然环境中，它们栖息于沙滩和热带地区的潮间带。
  pet.iguana:
    label: ლიגוֹאן
    summary: הלווייני האקראי הפופולרי באמריקה המ тропическая עם גוף ירוק.
    info: ליגואן ירוק הוא זוחר גדול מהאמריקות הדרומיות הגובר עד שני מטרים במורכבים. זהו צמחוני נוקשה שדורש תזונה מגוונת של ירקות וקרני אור UVB כדי לשרוד במרפאה אנושית. יש לו עין נוספת על ראש הצואר שלו – 'עין פאריאטלי' רגישה לאור.
  pet.koi:
    label: כַפּר קוֹי
    summary: דג סלמון עם תווי צבעוניות הנשמרת בריכוזות גינה.
    info: קיפר קוי הוא זן יפה של כפר פשוט שנדגם ביפון כבר מהמאה ה-17 לצבועים צבעוניים. יש יותר מ-100 ווריאציות בצבעים; פרטים יקרים נמכרים תמורת אלפים שקלים. הם יכולים להגיע לגיל ממוצע מעל 200 שנים; הפרט המבוגר ביותר שנמצא היה חנוקו שהגיע לגיל 226.
  pet.leopard_gecko:
    label: ג'קוונ פניניאני
    summary: ג'כווון קטן ומשובח בשעות הלילה, מתאים במיוחד למתחילים
    info: |-
