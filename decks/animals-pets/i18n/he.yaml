    info: '{"hint":"cichlide גדול thông minh từ Nam Mỹ (Astronotus ocellatus)","info":"אוסקר פיו הוא צ''ליד קטן מדרום אמריקה ידוע בذכינותו ויכולת לזהות את הבעלים שלו.\nהוא דורש בריכוז גדולה מאוד ( לפחות 200 ליטר ) ואוכל חי או קפוא באופן קבוע.\נשכב לאורך של יותר מ - 35 סנטימטרים ויושב עד 15 שנים.\ иногда התנהגותו דומה לחיה מאשר рыба ; הוא שוחה לקיר הזכוכית כאשר בעל הבית מתקרב."}'
  pet.parrot:
