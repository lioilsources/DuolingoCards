    info: פיטאורוס ברייביסיפס הוא יונק וואכני קטן אustralianski שיכן יכול לעוף nhờ לבלון הנקרא פטגיום שנמתח בין רגליו הקדמיים והחזריים שלו. יש לו עיניי צהרים גדולים והוא חברתי מאוד ומתקשה עם одиночество. מתקשר באמצעות נביחות, זעקות ונשימות דממה.
