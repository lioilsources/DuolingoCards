  pet.lovebird:
    label: agyafarniz
    summary: ağfarnız – ציפורי אגם קטנים עם קשרי זוג עוצמתיים.
    info: אגפאורניס הוא ציפור קטן וצבעוני מהמשפחה של האגאפורניזים המוכרים בקשרי זוג חזקים מאוד. זוגות אלו מזינים זה את זו, מחטפים אחד לשני ואומדים זמן רב יחד - משם השם 'צפרדע ליבר'. קיימים九大精神 שמתחלקות בצבען ובהתפלגות גיאוגרפית.
  pet.mandarin_fish:
    label: מאנדארין
    summary: הדג היבשתי המ색ן בעולם עם עיצוב מטורף.
    info: |-
      המנדרינקה היפה היא דג ים קטן מהצלחות האוקיינוס ההודי והแปסיפיק עם צבעים נראות ביותר במלכודת החייתית.
      לדג אין קשקשים אלא תאים מיוחדים המכילים פיגמנט וสาร כימי שמאירים באור אולטרה סגול (כרומטופורים).
      The Mandarinfish is exclusively fed on tiny live prey and it's very difficult to keep them.
  pet.mini_pig:
