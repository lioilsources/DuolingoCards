  pet.red_eared_slider:
    label: צבייתה
    summary: נמלת בריכה פופולארית עם תספורות אדומות מאחור לאזניות.
    info: צבית נאדרנה היא מקומת צפון אמריקה והיא הנמלה היבשה הפופולרית ביותר בעולם. סימני האוזניים המודים ייחודיים לה ומייצגים אותה מול מינים דומים אחרים. לחייה יש צורך בשטח 물וני וגם שטח יבשתי עם תאורה תת אדומה כדי לחםר.
  pet.sea_horse_pet:
