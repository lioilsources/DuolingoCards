      एखादी बुद्धिमान इथे गणित शिकते आणि ट्रिप
      आपल्या उभाच्छेष खाऊ झाडत फाईव्ह थे ओढते,
      असे भाग औषधी अनुसंधानात महत्वाचे आहे
  pet.mynah_bird:
