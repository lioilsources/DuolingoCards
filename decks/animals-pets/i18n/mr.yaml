    info: "ग्रीन इग्वाना हे केंद्र समोरच्या मुख्य पटलाचे एक जिरपौड़ा असते,\niग्लाणा ईग्लाणा' तयार करणाऱ्या गवतखंडामध्ये आढळते. \nहे खूबशा बाहेरच्या उजेडासाठी फाटफाट झाकलेल्या भाज्या घेऊन धाप देते\nआणि ओएव्हीबी शिष्टता थोडी छान ऐकते."
  pet.koi:
