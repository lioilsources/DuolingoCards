    info: |-
      मायना ही श्वेतपक्षिक कुटुंबाचे प्रसिद्ध मौखिक संवाद करणारे पक्षी आहे; इतके कि अशा पक्ष्यांच्या बोलण्याच्या क्षमतेमध्ये जगभरातील उत्खनिल गणता येऊ शकते
      याने माणसाच्या ओठापासून झळझळ टोन, एअरफोड आणि ईएनटॉईओन फॉलोइंग घेण्याची छान भावना ठेवली आहे,
      जी डाहाथेऽ ऑउथ ऍसियाच्या आणि भारताच्या ऐतिहासिक ऋषिः और ढाँढ़ िदेशात ाछ।
  pet.oscar_fish:
