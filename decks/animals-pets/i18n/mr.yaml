lang: mr
pivot: false
title: घरातील प्राणी
cards:
  pet.cat:
    label: मुलाखत
    summary: सॉफ्ट पेड अशा स्वभावाचे एकटे मनोरंजक प्राणी.
    info: हाऊस कॅट हा फेलिस कॅटसचा प्राणी आहे जो घरगुती पाळीव प्राणी म्हणून धरला जातो. हा ओळखला जातो त्याच्या नादुरुस्ती, स्वच्छता आणि स्वतंत्रपणामुळे.
  pet.dog:
    label: कुत्रा
    summary: वफादार घरचा मित्र, मनुष्याचा सखा.
    info: घरगुती कुत्रा हा पूर्णपणे पालन केलेला शेवटला आहे; हा मनुष्याने पाळलेला सर्वात जुना पाळीव प्राणी आहे. 400 हून अधिक नस्लींचे उदाहरण आढळतात आणि हा 'मनुष्याचा सर्वोत्तम मित्र' म्हणून ओळखला जातो.
  pet.goldfish:
    label: सुवर्ण मासे
    summary: किंमतीचा तेलखोर पाणी सजावटीचा माशा.
    info: गोल्डफिश हा कॅरपचा एक प्रकार आहे जो जगभरातील टँकमध्ये पाळला जातो. त्याच्या बनण्यामध्ये निरनिराळ्या रंगांच्या आणि फिनच्या प्रकार असतात.
  pet.guinea_pig:
    label: मॉर्चे
    summary: चिमुकल्यांसाठी लोकप्रिय मजबूत पाळीव प्राणी हा सुद्धा एक छोटा केसवंडा घोळ आहे.
    info: मॉर्चे हा दक्षिण अमेरिकन बसलेला एक सामाजिक घोळ आहे. तो विशिष्ट प्रकारचे गडगडणारे आवाज काढतो, नीट माणसाची भेट घेऊन खूश झाला.
  pet.hamster:
    label: क्रिस्केट
    summary: मानसे क्रीटेयुस जातीचा मोठा पाळत रखडवला जाणारा सूक्ष्म हाडवरदळ.
    info: गोल्डन हम्स्टर हा लोकप्रिय पाळत वस्तू आहे. त्याच्या गालांमध्ये खादयाच्या संचित असतात, तो बरेचशी रात्रभर सक्रिय असतो आणि एका चक्रात धावायला आवडते.
  pet.parrot:
    label: पापुशेक
    summary: रंगीबेरंगी पक्षी जो मनुष्य किंवा शब्दाचे नमुने बनवू शकतो.
    info: एंडलुस्का वळंकोवाना हा सर्वात लोकप्रिय पापुशेकचा प्रजाती आहे जो पाळीव प्राणी म्हणून धरला जातो. हा बुद्धिमान, सामाजिक असून ध्वनि आणि शब्दांची नक्कल करू शकतो.
  pet.rabbit:
    label: कर्लिक
    summary: मऊ बाहुला आणि विशिष्टपणे मोठी काने असलेला प्रिय संगीत.
    info: घरचा कर्लिक हा एक जनसामान्य पाळत रहिवासी त्याच्या मऊ बाहुला आणि खास मोठ्या कानांसह ओळखला जातो. त्याचे भोजन घाणे, फळे आणि ताजे गवत असते.
  pet.turtle:
    label: कर्क
    summary: खडबडीत चालणारे प्राणी कठोर कवचासह.
    info: एमिडेई मधील एक सुंदर कर्क हा घरगृहस्थ कर्क आहे. ते जमिनीवर प्रवेशयोग्य अँकवेरियममध्ये उभे राहतात आणि यूव्ही बल्बखाली गरम होतात.
