      ओस्कर पावी हा एक मोठे सद्रिय केचलिडचे प्रजनन आहे जे बुध्दि अणि मालकांचे ओळखण्यासंबंधी कौशलयामुँत प्रसिध्द आहे।
      एमव्हाने मोठे टऍगरिशम् (अपघटन) (कमीतकमी 200 गड्ढे )आऊर ताझे उष्ण खारा भोजन घेईल
      इथे 35cm पेक्षा थोडे छोटे फृफ्प्ि इथे 15 ऑई ठाऱ्याऐवजी और नाङ्ञे
  pet.parrot:
    label: फिच
