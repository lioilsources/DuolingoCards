    info: वेव्हली फिनच हा पालतू म्हसुर कोंबडे मध्ये सगळटकर जखम आहे. हा बुद्धिमान्‍य असतो, साथीदार असतो आणि तो शब्द आणि गाणी ऐनप्रमाणे घेऊ शकतो.
  pet.prairie_dog:
    label: préri psaun
    summary: '''उत्तरअमेरिकेतील प्रेरियांमध्ये खडङ्ग बनवणारा सामाजिक कुंकव.'
    info: |-
      प्रेरियो प्साऊन हा उत्तरी अमेरिकेमधला सामाजिक कुंकव म्हणजे वृहद्‌ खड़बड़यांच्या समुदायाच्या आश्रयाने राहणाऱ्या एखाद्या गुफा बसणाऱ्या शेड्याला।
      त्यांच्ध्या घटना इतक्ष छाट झालेल्या ऐषाळी फौगापाठी ओळखला जाईल जे भाषा ऑफ ऍनिमल्समध्ये थोडक्यात औषधी ऋषि ढढ विणकथा आहे।
      'डॉग' हा शब्द त्यांच्या शिकारी विरोधात चिलखत देण्यासाठी वापरला जाईल,
      आणि त्यांच्या समुदायाच्या आऊटपुटमध्ये दहां इतर प्रजातींच्या जीवनाची आठवण येईल.
  pet.quail_pet:
    label: कर्बेटिस मझलि
