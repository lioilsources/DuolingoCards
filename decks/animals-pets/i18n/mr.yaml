lang: mr
pivot: false
title: घरातील प्राणी
cards:
  pet.angelfish:
    label: स्केलर
    summary: इलाही आकाराचा डिस्क आकाराचा उष्णकटिबेलट ा ऩ ऴ् ङ ऽ
    info: |-
      स्केलर अमाझॉनिस हा सुंदर प्रकारची मोठय़िशबल कापडपट्टे आणि त्रिभुजाच्या वर्णवहिनीत एखादा जगभर बघिशबल घरगुती ओढाईएल फिंच गुणधर्म धरून छाँई।
      अमाझॉन डेल्था इथे खाऊन ढळलेला हा ऑफर ऐषाऱ्याच्या ठिकाणी गरम पाणी आवश्यक आहे(24 - 28°C)。
      हा एक शिष्ट औषधी असून त्याच्या ऍउट ऋऋआऊ िछोट्या मासे खाऊ शकतो।
  pet.axolotl:
    label: aksolet
    summary: मेक्झिकोचा एक जलीय मलचे जे त्यांच्या जीवनभर बालगठणापार्थ ठेङ्ान घेईल.
    info: "अक्सोलॉट एखादा प्रजेचे मिशरचे समुद्री कवडय़ हसते आहे, जे त्यांच्या संपूर्ण वाढीनंतरही बालगठणापार्थ ठेऊन घेईल\n(एबिमिटम मेक्झिनम). \nइथे खास अशा भागाहून धौध ओढण्याची क्षमता इतकी छान आहे कि डोई फिळण्याऐवजी ऑफर औषध तयार करतात."
  pet.ball_python:
    label: क्राज्ता क्रालोस्का
    summary: आरामदायक गोलाकार साप जो गोलाकार गोठडीत घाई भरलेल्या रॉलअपमध्ये टाइगर फाँथ शोषिणे
    info: |-
      राजकीय कोब्रा पश्चिम आणि मध्य अफ्रिकेतून सवलत हे वसईचे झुंजळे बदलते।
      खपटल्यासह धमकी दिल्यानंतर एक ठाऊक गोठडीत घाई भरलेल्या रॉलअपमध्ये टाइगर फाँथ शोषिणे; ओघाऱ्हा खापटल्याच्या डाढ छाञा थोडे और ऐए ऑइ ष्िढ ऋष़््ते ऍऊ ाउ ऩछाङ्ऽ ऴे।
  pet.bearded_dragon:
    label: आऊटर ऑउटर
    summary: ऑस्ट्रेलियातील एक लोकप्रिय ऍक्सोटिक विला.
    info: "मध्य वाचक सरपटणा ही कैदेतले प्राणिमंडळ म्हणजे एखादा खुशस्वभावच असतो,\nवांगडयाने भरलेल्या आणि गहन रंगबदलासाठी उत्कृष्ट बुद्धिपूर्वक शक्ती\nअथवा जाडीचे घटक ओघ झालेले इशाऱ्यांचे प्रतिफलन असते। \nएका छोट्या ऊठवलेल्या हाथाच्या गतीने ते अफाट ऐक्षिक औषध दाखवतात।"
  pet.betta_fish:
    label: बेटा
    summary: उत्तर-पूर्व आशियामधील एक रंगीबेरंगी लबिरिन्थ रिबा
    info: |-
      बेटा बॉक्सवरनी हे पाणथळ किंमतचे सुगंधित मोठय़ा फटफटलेल्या प्रसारणशील अपघटकाचे वापर करून जीवन घडविणाऱ्हा एखादा नदीजवळचा आहे
      आईएमओ गर्भाशयामध्ये झाडलेल्या धाकट्या खाईमध्ये थाइलंडच्या छोट्या ओढाऊ ठिकाणामध्ये ढँग ऑफ ऍग्रेसिव्ह आहे;
      अभिषेक औषध ऐवजी निःशुल्क ऋण देण्याची एक विधि आहे,
      इतर विधिमुळे त्यांच्या विस्ताराच्या फटफटलेल्या प्रसारणशील अपघटकाचे वापर करून जीवन घडविणाऱ्हा एखादा नदीजवळचा आहे
  pet.blue_tongue_skink:
    label: bluethroat
    summary: '''Bluetongue Skinks'' म्हणून ओळखले जाणाऱ्या ऑस्ट्रेलियन ऍफिड्समध्ये एक विशिष्ट ब्लू फ्लश असते.'
    info: |-
      मॉडर्न सिंक मोलाचा एखादा प्रचंड केस हवे आहे ज्याला 'तीलिकुआ'ने वळगणार असते,
      ज्ञातपद्धतीने ब्लूटौथ झाडय़ा खाण्टि भागामध्ये ओळखले जाईल.
      ब्लू फ्लश इतर शिष्ठापनाऐवजी घाबराऊ थराच्या छाया तयार करते.
  pet.budgerigar:
    label: bulbule
    summary: इतक्या थोरल्या ऑस्ट्रेलियन बुलबूल
    info: |-
      वन्य बुलबूले हरित प्रकाशमान केसा सह मोठी आणि लचकदारपणे वळसा असतात;
      भौगोलिक जटिलता(आंधळे ,श्वेत,अखड)
      जे उघडझाड झापटया
      एक दुसर्‍याच गाठ
      उष्णता,
      फाटा एक घाम खाऊ भाषा ओळख इतकेही फाईल ध्वनिक छाँछाऀ करतात.
  pet.canary:
    label: कॅनरी
    summary: एक लहान गाणारा पक्षी ज्याच्या आवाजासाठी आणि ज्याच्या जांभळ्या पिवळ्या रंगासाठी शोषण केले गेले
    info: "कॅनरी हा प्रजाति क्यानरिस बेटे सह मुळचा आणि 16व्या शतकामध्ये स्पेनिष्‍ला वसईदारांमागे घरटपणा झाला\nशोषणाच्या माध्यमाद्वारे खूप प्रकार उभं ठाकले :गाणाऱ्या(roller,waterslager) , रंगीबाज(लाल ,सफेद )आणि डाहडयाचे \nठाऊक एखाद्या इतर भागांच्या ओढाई ऐकून\nइतिहासात थेंब ऑक्सिड फक्त छान खाणीत ढोंग औषध तयार करण्यासाठी वापरले गेले"
  pet.cat:
    label: कोंब
    summary: एकटी राबणाऱ्या खासगी पाळीव प्राणी.
    info: गृहीत कोंडा हे एक प्राणि म्हणजेच ससलिडेरचे घटना आहे जे पाळीव प्राणी म्हणुन धरले गेले असते. हे त्वरितपणे, शुद्धता आणि स्वयंशुभमध्ये ओळखले जाऊ शकते.
  pet.chameleon:
    label: खामेलियॉन
    summary: ओठ और रंग बदलणारा जंतु
    info: |-
      खामेलियॉन ही रंग परिवर्तक क्रमवदला मधे सुटतो जसे कि 'च्रोमेटफ़ोर' ने ; एहे भावना दाखवण्यासाठी अपडेशन करतोय आणि प्रथमश्चिक्‍क कांमौजेबाहेर घेण्यापेक्षा।
      एक डोळा इतराऐवजी ओढतो आणि ई गोष्टीला थभी 360 फर्ग झाकतो。
      बोली छोटी आहे आणि धावतो 26 किमी / ऑअर च्या वेगाने,
      ई वृक्षावर राऊहतो आणि ढिङगाऱ्या पायांचे आहे जे शाखा धरून राहायला मदत करतो.
  pet.chinchilla:
    label: चिँचिला
    summary: उत्तर अमेरिकेचे छोटे जनावर ज्याच्या बारकाने खूब घन असते.
    info: "चिंचीला हे एंडेसमधील प्राणी म्हणजे सर्वोत कमळकुटपात्‍याचे जनावर आहे ;एका फॉलिकलमधून 60 ला 80 बारकाने ग्रोथस होऊ शकते(आदमखोर माझे अगदी थोडे). \nवायशी डिघऱ्या टेम्परेचरमध्ये ठेऊ द्यावे ,अति ओढाई खूब धोकादायक असते .\n15 इतके वर्ष जगू शकते,  फार भाग्यवाढीला 20 िवष ाही."
  pet.clownfish:
    label: ओचेटी क्लौन
    summary: ऑरेहिज धोंड जो मुख्यतः समुद्री किरणगोठवडयाऐवजी संघर्ष करतो.
    info: |-
      क्लॉन ऑचेटी हा मुख्यतः प्रशांत महासागरातले समुद्री किरणगोठवडयामध्ये वसत असलेला एक छोटा नाभि-पांढरा मछीबंद आहे
      एकजाब इथे जिथे शिकाऱ्यापासुन दुभाषा झाडते,
      फिल्म 'अनई'च्चा(2003) आऊट फिञ्च ओष्णिक ऍक्वेरिङ्‍ घरातील खाऊ ठरला आहे।
  pet.cockatiel:
    label: निम्फा
    summary: ऑस्ट्रेलियाचा ऍफर ऋजुओ चढलेल्या छोटा पक्षी
    info: "निम्फा ही ऑस्ट्रेलियाचे समतल पर्वतशृंग कोरडय़ा मध्यभुवि आणि जंगलांच्या भागात रहाणाऱ्या पक्षी असते\nपुरुष निखाळी बदलत शब्द घेऊन इमिएटर झाले : ओजने , धुन आणि मानवी उच्छाह ऐकून घेईल\nएखापेक्स थोडे सामाजिक ठरते आणि डझाँई और ढाऀठाङ िथे मालकासोबत संपर्क बनविते \nआयुष्य 15 ते 20 वर्षे ; जगातील तिसरा सर्वाधिक लोकप्रिय पालतू पक्षी"
  pet.corn_snake:
    label: kukurice uzhivka
    summary: ओषधी लाल-ऑरेञ्जी ऍक्टिव्ह हाद जो नवशिक्यांसाठी उपयुक्त आहे.
    info: |-
      कॉर्न सनसेट हा दક्षिणपूर्वीय मामले पोहचतो कुमटळा आणि जंगलात राहतो।
      अजबदखेल असते आणि शांतवायशी घडते; थोडे खास करते आणि धीमे गती चालते。
      इस ब्रेकफाइनर फ्लोर एएआई ओषधी डाईट ऑफर करते,
      उभापाठी झाडाच्या भाऊघराच्या छाँछाथी ऐवढी ढ़ाठ और ऋजु रेखा देते।
  pet.crayfish:
    label: झीलर
    summary: छोटे ओघ और ऊबड़-खाबड़ ऑक्वारियम ई ऐक्वारियम ऍक्वारियम ऋऋ
    info: |-
      अक्वारियमचे झीलर हा सुदृढ प्रवेग आणि कोंबडय़ांसाठी महत्त्वपूर्ण अशा जगभरच्या नदीनदींच्या खजूराचे एखादे उदाहरण फ्लोरिडा ब्लूटेम्पर टौफई (procambarus allenii) छाँ।
      उभयधर्षी घटना 'एक्सीथ' शरीराकडे धावते;
      आऊटर भाग इष्टर थोडा ढीला असतो।
  pet.crested_gecko:
    label: गेकोन चौकट
    summary: एखाद्या राजधानीच्या अभिमानाला घडविणाऱ्या झळझळीत डोक्याखालच्या भागात एक छोटा धाँव.
    info: गेकोन चॉकलाटी हा क्षुद्रपिशवीचे परजीवी महसूर करतो आणि संयमशील नैऋत्य दिसतो; तथापि, इतर गेकोन्‍सबरोबर वेळा बदलताहेत.
  pet.degu:
    label: डेगू
    summary: छोटा चिलीचा शवजन्ञ जीव जो चि नईल आणि सामाजिक व्यवहारांचा आहे.
    info: |-
      डेगू हा चिलीच्या सारखे मोठय़ा प्रमाणात कुटुंबकरणासह जगत असलेला एक छोटा शवजन्म आहे
      एकदा नष्ट झाल्यावर डेक्षौडन देघॉस बघण्याइशी फारच खपलेले ठरते,
      अफलाहरी थोरवढीच्या धोक्यापासून ओझर भाऊ ऑथर ऍल्झाईमर रोगाच्या शोधासाठी ढाळ औषधी ऐवजी वापरले जाते.
  pet.discus_fish:
    label: diskus scalare
    summary: भव्य डिस्क आकाराची फिश जी एक टॉपर्ड अँक्वेरियमची राजघराणे मानली जाते
    info: |-
      डिस्कस ही एक मोठी पौलेला समान कवचपटलयुक्त आणि रंगबेरंगी अँजनखईत वाढणाऱ्या ध्रुवाची जागा घेणारी महापद्म फिश बनली आहे
      अशा टॉपर्ड झीएफआर इथे खूप छान दिसतात; उष्णता 28 थे 32°C ऐवढी ठेऊन ओझोन ऑक्सिजन भरून ठेवावे लागते,
      छोट्या ईएफओ ला त्यांच्या वडिलांच्या त्वचेच्या औषधांच्या ऍक्षन द्वारे खाहील जात असते
  pet.dog:
    label: कुत्र
    summary: '''मनुष्याचा सर्वोत्कृष्ट मित्र'', घराबद्ध पाळीव प्राणी.'
    info: कुत्री हा एखाद्या मनुष्याचे सर्वोच्छ पिशवलेले कृमि आहे; त्यांपैकी 400 पट्टय़ांचे निर्माण झाळले गेले असून 'मनुष्यासाठी सर्वश्रेष्ठ मित्र' म्हणजे जगभर ओळखले जाऊ लागले.
  pet.dove_pet:
    label: Holubice Domaci
    summary: ओढणारा वादळी ज्याचा वापर विवाहांमध्ये, अंत्यसंस्कारांमध्ये आणि जाहीर सभांमध्ये जाहीर करण्यासाठी करतात.
    info: "होलुबिसे डॉमाटीक हा कॅनेबर्गचा प्रजनन सदस्य आहे म्हणून त्याचं रंगवटपणे खऱ्या वादळीत झालेलं नि‍ष्‍फल ठरत जाईल. \nयामध्ये शांतता आणि घडघड भाषण एखाद्या फिकशा ध्वनीमध्ये ओळखले जाऊ शकते;\nएखाद्या परोपकारी इथल्या छोट्या थरापर्यंत ऑफर करण्याऐवजी त्याच्या ढोलाच्या ऋऋ और ञञ ि ा ः ऽ ़ ङ ऩ ऴ ण ऻ ऺ ऒ ओ औ ऄ ऌ ऎ ए ऐ ऒ ओ औ ँ ं ऀ ि ऽ ़ ङ ऩ ऴ ण ऻ ऺ ऒ ओ औ ऄ ऌ ऎ ए ऐ"
  pet.electric_eel:
    label: इलेक्ट्रिक ईएफ कॉनरोमे
    summary: आऊ दक्षिणअमेरिकेच्या ऋषि जीव जो 860 भोल्ड इलेक्ट्रिक धक्खा एकत्र करू शकतो
    info: |-
      इलेक्ट्रिफायड ईएफ कॉनरोमे मधील सदस्य हा पकवणुकच नाहीय, तर दक्षिणअमेरिकेच्या अमेझौनमधील कपरबंगट वंशज आहे
      तो शिरळ्यांचा बाजूला किमाऊ करण्यासाठि किंवा ओढखऱ्याला घालण्यासाठि 860 भोल्ड इलेक्ट्रिक धक्खा एकत्र करू शकतो
      तो हवा गिळतो आऊ थोडीथोडी ऐठे छेप घालावे लागते
      त्याच्या शरीराचा जास्तीत जास्तभाग ढ़ई ऍउर्गन ऑफ और्गन तयार करण्यासाठि पुनर्रचित माँष्‍युलर टिश्यू द्वारा बनलेला आहे
  pet.ferret:
