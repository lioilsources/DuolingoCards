    info: गृहीत मोर्चे हा एक सामाजिक प्रजाति असलेला कुटुंबीय डच्‍छमनशी दक्षिण आमेरियाइवर उभारणाऱ्या छोट्टा वाळूखप शेपथ नाही। ग़डग़ड ध्बध्भ झाल्यास घाईघाईने खाऊद ठेवला जाथे.
