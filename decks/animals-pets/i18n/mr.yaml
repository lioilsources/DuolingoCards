    info: |-
      गोल्डफिश हा एक सुंदर पाणीवळण करते मनमोहक फिस आहे जेलपूलच्या अभयारण्यात ठेवला गेला आहे.
      जगभरातील घटस्थःखड नऊशब्दाच्या ब्रँडिटी इथे उपलब्ध झाले आहे.
  pet.guinea_pig:
