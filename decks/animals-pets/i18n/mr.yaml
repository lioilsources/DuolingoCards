      रक पौस्तेवनिक हा संपुष्ट नाहीये कोणत्याच मजबूत कवचाला, आणि एखाद्या रिमलेश मधील खाळमध्ये ग़डग़द भाग बचाव करतो।
      आकारात जेव्हा झटका घेणाऱ्या अशा छोट्या ध्रुवापासुन उभा होईल तेथे ओढलेल्या इतर ठिकाणात डाढ फाईल करतो。
