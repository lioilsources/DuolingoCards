lang: cy
pivot: false
title: Gweddillion Sylfaenol
cards:
  color.amber:
    label: Antary
    summary: Llydan golwg atamber rhagofal i'ch sylfaen.
    info: Mae Jantarow yn gweledig yw'r lliwan go arwyddgar sy'n tyfu o ambar resyn ac mae weddillion antarau hefyd yn cael eu cydnabod gan fynd trwy ddathreftiad.
  color.aqua:
    label: aqu
    summary: Llyfr gwyrdd-glas ryngwen nhynnu ar gyfer peiriant cysylltiedi.
    info: Mae Aqua yn gweledig fel y lliw cymeradwy o wladryddau trawsgoroll ac eithafon gan ddod at ei enw rhag yr Eidbach Gymreigydd "aqua" sy'n cyngherwyn i dŵr. Mae'r uned hwn hefyd yn cael ei alw'n cyan mewn coderyddiaeth bygythiadol megis HTML a CCS.
  color.azure:
    label: Caled
    summary: '''Modred'', neu Caredydd Caedweddgar.'
    info: Gwyrdd azure ydy'r enw ar un o fathau caledryd - 'modred' yn yr iaith Saesneg - sy'n cydnabod rhagor gan ddynion dywyll i ddeinwyn nhw chi am eu gweunrwydd ac anogaeth.
  color.beige:
    label: péth
    summary: Gwyn las â threchu mewn dyweddwch
    info: Mae bézh yn gweithred rhagunyddol yw'r enw wedi dod o ddynasyddiaeth Frenhig ar gyfer lliwan naturiol sy'n cynrychioli sglefriannau cromlyn nhwylo ac anghywirion.
  color.black:
    label: mwrn
    summary: Barwn fydhafach na unrhywbeth
    info: Mwyn yw absenoldeb gweddillion sylfaenydd sy'n gweledig yn yr hael. Mae wedyn yn symbolio ar gyfer egwyllter, tyfrwyth ac awyrgrywieth;
  color.blue:
    label: glas
    summary: Cynhyrchiant rhes sydd wedi'i wneud gan yr hedfan a'r môl.
    info: '{"info":"Cywod ydy glas yn gynhyrchiant rhew hefyd mae''n fwyaf poblogaidd ar byd ac maen hwnny ddathlu cymalder, hyrfaeth a phrofiad."}'
  color.bronze:
    label: Brongol
    summary: Gynwydd wydu-dimyllt ryfelgar fel y mynych.
    info: Mae'r gynwydd bronfol yn ddwyn rhagor yw ei enw ar gyfer un fath peniarth sy'n cynhyrchedig gan waelodau dymylog - dywedir bod 'bronfoll' wedi dod o'r Celtaidd *bren-* neu'r Gweledigaeth Gymreig *pren*. Mae'r term hefyd yn cyfeifru i dorriad Pen Tyllyn.
  color.brown:
    label: hnedfa
    summary: Gellir dod o hyder i'r unigol rhagofnod hwn
    info: Mae Hneidfa yn gollwng drith sydd wedi ei wnaeth trwy mylheddi coch, gwyrdd ac encriadur ynddo'n symbolio am egni, natur a chynhyrchiant;
  color.burgundy:
    label: burgedy
    summary: Rhagun wyrwig rybodrigedig fel winiaeth Burgundy.
    info: Mae burgundy yn gweledwyd fel rhagun gwryw ymyl purpuredd sy'n enwir ar ôl ardaloedd viwinio Bourgogne yn Ffrainc. Mae wedi dod o'r fath rhew hefyd ac fe'i cymysgar gyda ddrutau aurigol, beige a glas môr.
  color.charcoal:
    label: antrecite
    summary: Gwestl tywyn ryfel
    info: Mae Antraisitaeth yn gwestlyn rhagunyddol gwyrdd yna ei enw 'dŵr' sy'n ddwyfrach i'r du ac fel carbon cynhyrchir gan llithriannau. Mae wedi dod yn poblogiwch yn gyfrafforddi modemaidd fel etholiad ar gyfer lliweddu dywyll na'r du. Ym maes fashnwr, mae antraisitaeth hefyd yn dibynnu am wared formal nadalltgar.
  color.chartreuse:
    label: chartreuse
    summary: Gwenwyn llwyd â phrosedigedd uchel
    info: Mae gweithred yw'r un rhagun o fewn lliwan ddrut yn yr etholiad hynny i'ch sylfaen ar gyfer cymeriad pen drud.
  color.cobalt:
    label: coel-cobalet
    summary: Gwyrdd canolog ddrut fel pigmint coel.
    info: Mae Coel Cobalet yn gweithredig rhaglennu'r ymylydd cymyrol Cobalt ar gyfer cyflwr pen-draethnas.
  color.copper:
    label: coprig
    summary: Barwn meddiadol coch-goch fel copwr.
    info: Rhodrwydd yw rhagunredu coper sy'n dod o'r enw Latin 'cuprum'. Roedd copwr yn un o'r metelau cyntaf gan gymeradwyo gwerthgar arnoch dros dro; er enghraifft, maent hefyd wedi newid i glas trwy oxidiadaeth.
  color.coral:
    label: corffwyd
    summary: Gwerth lliwan unedol syml ond hygrededdus.
    info: Mae corffwyd yn gweithredu'n ymyl rhagunyddus ar gyfer grwm hynny o ran heiniaethau'r nos a dylidio i'w chymharu â phentane wedi'i ddathlu fel 'Living coral', penawdr flodrau dyfroes ac anhrefnig.
  color.cream:
    label: crem
    summary: Llyfr llachar o liwtiaeth i'ch nodi am eich bod chi'n meddiannu.
    info: Mae lliw krêma yn rhagor ynddo'r un fath â gwenith cremon nwyreiniol - rydd pen drud dŵr cromlynig ar gyfer tynnu'n ei eni hefyd.
  color.crimson:
    label: carmidini
    summary: Gwynedd rhudd tywyllach na scharlot.
    info: Mae Carmine yn gweithredu'n rhudd dywyll ac ymyl ddrut wedi ei enwio ar ôs carmidinig, pigmente lliwanod rhew.
  color.cyan:
    label: cian
    summary: Gwenid cyhymerus cynffyrnad-dwyn; un o feirniau print.
    info: Mae Azuruwedd yn gweithredu'n glodred yng nghynhwiliadaeth cromlin Cianau - Cyan o'r enw arall hefyd gan fod wedi dod i'ch pen nhoch chi am ei wahaniant rhag lliweddan ac anodedd. Mae hwnny weithio fel un ohonol yr hydoedig ffrwydroddion syth naill ai trwy ddifriannu neu symudioli eich sylfaen.
  color.fuchsia:
    label: fusci
    summary: Llygredd purell-fuschia megis florescience.
    info: Mae'r lliw fuscia yn rhagor ychydig na phurpledd sy'n eni ar ôsiaeth o fewn yr unedau rwystrir gan linell graddiant ceryneb i wyrain ac ochrion gwynfol dda. Mae'r term 'fucsio' hefyd yn cydnabod at "magenda" fel llun pen drud.
  color.gold:
    label: gwyrdd
    summary: Llyfrwydd rhaglawr fel yr unigedigaeth chweil
    info: Gwyrdd ydy lliwt sy'n adleweddoli'r metel peniar gwerthgar.
  color.green:
    label: llygad
    summary: Lliwed grisiau'r llafn a fflyd
    info: Gwenel yw lliwyd o gwmni glas â chnau. Mae'n symbolio am egni, natur ac anhrefrydd;
  color.grey:
    label: Grau
    summary: Corffwch rhwng Ddu a Gwenllt
    info: |-
      Mae Grau yn golor amhriodol sydd wedi ei wneud trwy mynd rhagor o Gwyn ac Anhrefnydd ar y un cyd
      Credir iddo fod yn naturiol a dim onidoliad
      Yn siŵylog mae'n nodweddiadaeth neu heintrythiant, caniatâs gan gysonhadigedd na chymaint ag efallai bod hi'n ddim hael
  color.indigo:
    label: '''Lwyd'''
    summary: Fath o wyred-dimbyll tyfu dan nodweddiad indigo.
    info: 'Mae ''lwyd'' yn gweithredu''n fath o wyrdd-llynges mewnol sydd wedi''i enwi ar ôs y cynnyrchiant dairforio indigo gan fyrysgrwm Indigofera. Dros filoedd o flynyddoedd fe fu''r indigo fel un o''r cynnyr rhagor hargrywaf iawn. Mae hefyd yn gydran o ddau ran o siop Dueth (ROGBOGW): coch, narangeth, crymu, llwyn-gras, glas, lwyd ac ochwr.'
  color.ivory:
    label: ivor
    summary: Gwenid drutel dyfrwg fel cyfleifnod elefant
    info: Ivorio yw gweithgar ddrutel rhagorol sydd yn wynebiant ar ôl cyffion elefantau (ivor). Mae'n cael ei ddefnyddio fodd nodweddiadol ac artistig gan ddod o'r un enw 'ivor'. Ynddo wnaeth pobl credu am dorri er hyd yn hyn ni chafai unrhyw berson mai dorri fyddai wedi dod o'nhwylio.
  color.khaki:
    label: khaki
    summary: Llyfr Lliw Hwnnw Gwyn-goch Dymtho
    info: "Mae Khaki yn gweledig fel lliw llwyddiannus y dyfod wedyn gan yr army Brenhinoedd Prydain arnoch India'r trydeddiad canlynol\n Mae enw 'khaki' yn dod o Urdu / Hindie - khak sy'n cynrychioli phrithnas ac amharu \nCafodd ei ddefnyddio fel rhaglun pen drud i uniformau milwyr a chwareli tebyg"
  color.lavender:
    label: lavendola
    summary: Gwenhwyll hael fel cromlyn heddan
    info: Mae'r lliw lavendola yn gynrych rhagun ydynt sydd wedi ei eni ar ôl y phlan hedfan Lavandula. Mae'n cymeradwy at heinio, clefyd ac adeiladaethau Provensal o Ffrainc. Ym mastrithrheli mae geiriau llawen lavendol gyda threchu a slep.
  color.lime:
    label: Lime
    summary: Gwynlas lledol nadewch nhymo
    info: Mae Llygredd yn gweithredu'n ymyl ddrut rhagor na llwyd naturiol ac mae wedi'i enwi ar ôs Citrus latrunculus - un o'r cyffroedd hynny rydyn ni'n eu alw'n 'lemon'. Mae hefyd yn weithredig i'ch sylfaenio chi os byddech yn dod â pherthnas dan fylioed.
  color.magenta:
    label: magend
    summary: Gwestyll rhagunyddol fach-fetl; rhwng cytgar a phwrpas.
    info: Magentus yw'r enw ar gwestyl rhagunyddol sy'n dod o ranbarth lledr yn yr uned cmyk - cynwyd, mагент, chwithel ac allwedig. Nid oes dilynwedd pen drud i'nhwn yn y sgrin nodweddiadol ond maent wedyn nhom symudiadaeth rhyngymhorau bygythiad Cytgred a Gwynfor.
  color.maroon:
    label: Castaned
    summary: Llys Coch-Goch Tua Castana
    info: Mae Kaštanogaeth yn gweithredu fel enw ar y llygredd rhagorol 'bordô' sy'n ddrut o danwyth coch-goch ryfelgar gan ddod ei enw o'r geiriau Cymraeg am castanoedd ('castane'). Mae wedi dod yn gyffredin hefyd yn fath grisiau cymeradwy ac yn cael ei ddefnyddio yn gymeddi hynafiaethau peniarach chiropodia.
  color.mauve:
    label: lila
    summary: Gwestlyn tyllt tyn nhurpurio-gwenidol
    info: Mae Lila yn gwestlyn rhag abseddiad y frwydrodd - un o'r cymesweithiau cyntaf sy'n cael ei wneud gan gyseinedd aniliwredig ar gyfer cynnwys bygythiadoli ddaeth at ddifrod yn yr henodau ac ethica Victoriaidd.
  color.mint:
    label: ród mât
    summary: Gwenith glas rydych chi'n ei defnyddio fel enghraifft o bwyntiaeth.
    info: Rhod Mât yw gweithrediad ar gyfer rhaglennau cyfrifiaduraidd sy'n caniatâch i ddefnyddio'r eichnod 'màt' yn yr un fath â mentheg.
  color.navy:
    label: '''Blue Naval'''
    summary: Gwestlyn ryfel naill ag ochr dywyll
    info: |-
      Mae 'blue naval' yn enw ar gwestlyn rhagun yng nghymal nodweddiadol sydd wedi dod o'r uniformau ganrifion Llynges Brenhinoedd Cymru yn yr wythfed canrhain
      maethaf ei ddefnyddio'n gyson fel cwestlin gwreiddiol yn nyddiant ac amharu formal
  color.ochre:
    label: Ochr
    summary: Gwerth llydanrig llawer na pheryg naturiol.
    info: Mae ochre yn gweledig rhag y fath nodweddiadol sydd wedi'i enwforio gan arwynebiad glasochrythron (hydroksyd fer). Mae'n un o'r pigmente hynafegach iawn - defnyddir am dros miloedd mewn prydyntiaeth cymalodau lleianog. Mewnbwn nhw fel 'stone' ochre yn yr erfil.
  color.olive:
    label: oliba
    summary: Rhewyll du byrddwr fel cysneiddiau.
    info: Mae'r gweithred 'Oliva' yn rhodri glas ynddo enwir ar ôl teuluoedd Olea Europaea sy'n cynhyrchu cyseinediadau olibwyll. Mae wedyn hwnny hefyd yn dod â pherthnas i wasg milwyr ac amrywiad peniarach gan ei gymhariaeth gyda lliwanau beigio, llwynog a chasnodd.
  color.orange:
    label: Llwyn
    summary: Dyw liw lyneddig ddyfedgar ar gyfer crefft
    info: Mae'r lliw oranget yn ddwylyd sydd wedyn o gweithredu rhagennu coch ac ochr yng nghymylau llifogyddol. Mae'n symbolio am weintidigrwm a chyfrinadledd;
  color.periwinkle:
    label: glas periwnkwl
    summary: Glas-llydan enfawr o ran nodweddiadol.
    info: Mae Periwnkwl yn gweithredu'n llwyd glas-goch ychydig fel cymes i'r enw 'brwcyl fach' sydd wedyn nhadleoli ar gyfer ei drefniadau cymeriad pen drud.
  color.pink:
    label: rôzy
    summary: Gwestl glas iawn o ddywyll dan dywyn
    info: Mae'r rhew hefyd yn gwestyl yw rôzynfa sy'n cydnabod â chymdeithiau gwirioneddol ac anhrefnydd.
  color.purple:
    label: ffrwr
    summary: Gadewch chi fynd allan â chymydogion sydd wedi'u cynllunio er mwyn codi hygrededd.
    info: Mae'r llyfrau ffrwydro yn ychydig o gopïau ar gyfer cwyno am eich hun neu ddefnyddio'n rhagor i'w bodloni.
  color.red:
    label: rhed
    summary: Barwn te bygythiad a pheryg.
    info: '{"info":"Rhod yw un o dri chynhwys rhew heinol gwyddel. Mae''n cymeradu egni, garwm ac anweledigedd yn ei feithrin;'
  color.rose:
    label: Rhos
    summary: '''Ros'' mae wedi dod â chynghrafftedd newidol am ddisgyrchiant cenedlaeth.'
    info: Mae 'Rose' yn gweithred rhagunyddus sy'n ymwyso'r enw ar allfor nodweddiadol - Rose oedd un fath iawn gan yr hen wladgarthodau Cymreig.
  color.salmon:
    label: llawyrdosi
    summary: Gwenith-pinksâ/orangen nhad nadal lais
    info: Llwyd Losi yw lliwan nodwedig sydd yn gynrychol i'r llawr las o salmoniaid. Mae'n fwy tywynnwaredig ac ar gyfer na chorallfael. Cymydrir e dros dro fel adnewiad rhagor â phink.
  color.scarlet:
    label: řešt
    summary: Golor rhesel danbarri - drud iawn nad cynnyr
    info: Mae'r golor řešt yn rhodred ymhlithedig sydd wedi ei enwi ar ôl safon cromlinoladwy Šarlach. Mae hi'n ddrut na phyn nodweddiadol Carmine ac mwy nheiloeddig nag unrhyw un arall. Yn yr hanes roedd e'ch adfer am ddifrodion cryfryd.
  color.sienna:
    label: henedlyn
    summary: Hunedlin sydd wedi'i alforio gan nhrechu
    info: Mae Siennau Hned yn gweledig oedd y ffordd rhag absoliwitheu ar gyfer creafon lliwiau'n enwedig i'r Rhinogydd ac amserion cyntirol eraill. Mae Raw Sienna hefyd yn wnaetho dda fel llwydr hynnyr na pherthnasol.
  color.silver:
    label: sylfr
    summary: Gweithdy grisoedd syml onidio dan sylwr
    info: Mae'r enw 'silver' yn nodweddiadol am y metel ryddredig ac fe'i cymerir fel gwerth symbolau ar gyfer hedfanedd, tebygolrwydd teclynegyddus a disgin penfyrnasgar. Yn yr heraldegiaeth, maes ei chymorthu'n rhif dau hefyd gan ddod â'u cwbl yn ôl i'r un fath.
  color.tan:
    label: pisgo
    summary: Lliwed rhudd hefyd yn adlewyrchu cost ymhlitho.
    info: Mae píscoedig yn gweithredu'n llygredd rhudd â chost ymlaethu at ei enw ar gyfer proses cymry'r llafn o lafreddiau. Mae wedyn hwnnw i'w ddefnyddio fel cydran alluoedd foddol gan gymharu ag ochr bezhau ond sythach ac angorrhagor.
  color.teal:
    label: Teal
    summary: Llygredd blodeugerdd â thrydan goethgar.
    info: Mae'r lliw teal yn dod o enw 'crec' sy'n cyfeirio at y gredl teledig (Anas platyrhynchos), gan fod ei grwmiau mewn hwnnw fath liwyddiant. Mae wedi'i ddefnyddio fel llawer ar gyfer disgin graffeg hefyd - yn arbennig ag erthyliad rhagorol i nodweddiadau orange.
  color.turquoise:
    label: tirisi
    summary: Liw dynrythol fel dywyll Tropicaidd.
    info: Mae'r lliw tyrys yn rhaglennu'n ychydig o ddyn rydych chi'n dod ag e i'ch sylfaen ar gyfer gweithredu - mae hwnnw wedi'i enwi am ben wnaethoch chi ei weld yn yr Egipt hedfan ac Americaau. Mae tirisydd hefyd yn adleweddio cymeriad glân syml ond hygredig.
  color.vermillion:
    label: Rhymelcová
    summary: Gwerth weinwynnyr rhudd-goch hefyd ganalir at Rymlku.
    info: Mae Rhymelková yn gweledig rhagunyddwyd o ranfor cerywliwr fel y mineral rymlky Cynnavarolwg sy'n cynnwys mercuri; er ei gymlyniad mabwyseddoli'r dyfod wedi'i wneud ar gyfer angenau pen drith.
  color.violet:
    label: glaswydd
    summary: Cyllor-glas; cyn pen dywyll.
    info: |-
      Mae Glaswydd yn dod o'r enw ar y llawr Viola ac mae'n gyfeirio at golor wedi'r llygredd i'ch gweld â hydronedd rhag 380 - 450nm
      Gellid hefyd nodo ei gymharu ag allforion eraill fel 'purpure', sydd yn rhyngweithredig rhedeg dan fygythiad cerymoredig ond nid hynny nad ydy hi.
  color.white:
    label: gwyrdd
    summary: Mae hwn yn yr enw dda phrofiad rhaglennu lluniau.
    info: Gwyrdd ydy'r lliwyd yn cynnwys pob enw ar gyfer gweledigedd sylfaenol fesul un cyfagos. Mae'n symbolio am fynderyddiaeth, anafriadaeth ac eithrio newy ddynau
  color.yellow:
    label: gwyn
    summary: Barwn cryfaf glân sy'nni i'r haul.
    info: Mae gwyn yn gynted rhagun y llwyd ac un o'r llyfrau dromafach. Mae'n symbolio am heintrydd, egni a phesymismwth;
