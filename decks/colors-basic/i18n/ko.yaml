lang: ko
pivot: false
title: 기본 색상
cards:
  color.black:
    label: 검은색
    summary: 가장 어두운 색, 빛의 부재.
    info: 검은색은 모든 가시광선이 없는 상태를 의미합니다. 우아함, 신비, 권력을 상징하며 패션에서는 기본이고 보편적인 색으로 여겨집니다.
  color.blue:
    label: 파란색
    summary: 하늘과 바다의 차가운 기본 색상입니다.
    info: 파란색은 냉각된 광원의 주요 색상이며 전 세계에서 가장 인기 있는 색상입니다. 이는 평온함, 신뢰 그리고 깊이를 상징합니다.
  color.brown:
    label: 갈색
    summary: 흙과 나무를 상징하는 땅 같은 보조 색상입니다.
    info: 갈색은 붉은색, 노란색, 검정색을 섞어 만들어지는 보조 색상으로서, 흙과 자연 그리고 안정성을 상징합니다. 자연이나 가을 주제에서 자주 사용됩니다.
  color.green:
    label: 초록색
    summary: 잔디와 나뭇잎의 색상이며 파랑과 노란색을 섞어 만든 보조 색상입니다.
    info: 녹색은 파랑과 노란색을 혼합하여 만들어지는 보조 색상이다. 자연, 생태계 및 신선함을 상징하며, 시각적으로 눈이 가장 민감하게 인식하는 색상 중 하나로 알려져 있다.
  color.orange:
    label: 주황색
    summary: 빨강과 노랑의 따뜻한 보조 색상입니다.
    info: 주황색은 빨간색과 노란색을 섞어 만들어지는 보조 색상으로, 열정과 창의성을 상징합니다. 이름은 귤이라는 과일에서 유래되었습니다.
  color.pink:
    label: 분홍색
    summary: 붉은색의 옅은 색조로, 부드럽고 귀여운 색입니다.
    info: 분홍색은 붉은색의 밝은 톤으로 표현됩니다. 많은 문화에서 이 색상은 친절함, 로맨스 그리고 장난기와 연결되어 있습니다.
  color.purple:
    label: 보라색
    summary: 적색과 청색을 혼합하여 만들어지는 신비로운 보색.
    info: 보라색은 적색과 청색을 섞어 만든 이차 색상이다. 역사적으로 가장 비싼 색으로 왕실 권위와 럭스를 상징해왔다.
  color.red:
    label: 빨강
    summary: 혈액과 불의 따뜻한 기본색
    info: 빨간색은 빛의 세 가지 기본 색 중 하나이다. 에너지와 열정 그리고 위험을 연상시키며, 많은 문화에서 행운과 힘을 상징한다.
  color.white:
    label: 흰색
    summary: 가장 밝은 색으로, 모든 빛을 반사합니다.
    info: 흰색은 가시광선 스펙트럼의 모든 색상을 동시에 포함하고 있습니다. 순수성, 무죄, 새로운 시작 등을 상징하며, 많은 문화에서 평화를 나타내는 색입니다.
  color.yellow:
    label: 노란색
    summary: 태양과 금의 밝고 따뜻한 기본 색상입니다.
    info: 노란색은 빛의 기본 색 중 하나이며 가장 눈에 잘 뜨이는 색들 중 하나입니다. 행복, 에너지와 낙관주의를 상징하며 주목을 효과적으로 끌어모으는 색입니다.
