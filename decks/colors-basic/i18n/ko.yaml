lang: ko
pivot: false
title: 기본 색상
cards:
  color.amber:
    label: 앰버
    summary: 광물 앤더와 같은 따뜻한 금갈색
    info: 황금 갈색은 화석화된 수지인 앰버 광물에서 유래한 이름이다. 고대에는 장식용 및 영적 소재로 귀하게 여겨졌다. 아MBER 색의 신호등(신호기의 노란 빛)은 보통 주의를 의미하는 표시다. 앨범베르에 포합되어 있는 미니어처는 최소 백만 년 전 생물을 포함하고 있다.
  color.aqua:
    label: 에쿼
    summary: 깨끗하고 맑은 물처럼 보이는 밝고 청량감 있는 파란 녹색.
    info: '에콰는 밝은 파랑 초록색이다; HTML과 CSS에서 에쿠아와 시안(cyan)은 동의어이며 색상 코드 #00FFFF를 가진다. 이름은 라틴어 ''aquae'' 즉 물(water)에서 유래했다. 열대 해양이나 수영장 그리고 상쾌함을 연관시킨다. 그래픽 디자인에서는 현대적인 인터페이스로 사용되는 대비 강한 컬러로서 널리 쓰이고 있다.'
  color.azure:
    label: 청록
    summary: 여름하늘이 주는 화사한 푸른빛.
    info: 아주루바(Azure Blue 또는 Azulrova Modra)는 여름 하늘처럼 밝고 생동감 있는 청색이다. 이 색은 미네랄인 라즈우리트(lapis lazuli)에서 이름을 따왔다. 여러 국가(프랑스, 이스라엘, 핀란드 등)의 문장에 사용된다. 중세 시대에는 레오나issance 기간 동안 길이보다 더 비쌌으며 마돈나의 파란 옷감으로 쓰였다.
  color.beige:
    label: 베이지
    summary: 밝은 모래 갈색이며, 따뜻한 무채색 계열.
    info: 베이지는 흰색과 금갈색 사이의 밝고 따뜻한 색이다. 이는 자연적인 파도를 의미하는 고대 프랑스어에서 유래했다. 인테리어 디자인에서는 온난하고 중립적 기반으로 널리 사용된다.
  color.black:
    label: 검은색
    summary: 가장 어두운 색, 빛의 부재.
    info: 검은색은 모든 가시광선이 없는 상태를 의미합니다. 우아함, 신비, 권력을 상징하며 패션에서는 기본이고 보편적인 색으로 여겨집니다.
  color.blue:
    label: 파란색
    summary: 하늘과 바다의 차가운 기본 색상입니다.
    info: 파란색은 냉각된 광원의 주요 색상이며 전 세계에서 가장 인기 있는 색상입니다. 이는 평온함, 신뢰 그리고 깊이를 상징합니다.
  color.bronze:
    label: bronze
    summary: 구리와 주석이 섞인 혼합물처럼 보이는 짙고 화려한 골드 브라운 색
    info: 브론즈는 구리와 주석의 합금을 연상시키며 어두운 갈색 금빛으로 나타납니다. 청동기 시대(약 기원전 3300년~1200년)라는 이름은 이 물질에서 유래되었습니다. 올림픽 경기에선 동메달로 등수 세 번째를 의미합니다.
  color.brown:
    label: 갈색
    summary: 흙과 나무를 상징하는 땅 같은 보조 색상입니다.
    info: 갈색은 붉은색, 노란색, 검정색을 섞어 만들어지는 보조 색상으로서, 흙과 자연 그리고 안정성을 상징합니다. 자연이나 가을 주제에서 자주 사용됩니다.
  color.burgundy:
    label: бургундская
    summary: 프랑스 버艮디 출신의 적포도주처럼 짙고 진한 적보랏빛.
    info: 버艮디(Bourguignon)는 프랑스의 와인 생산 지역으로 이름 붙여진 어두운 적색에서 보라빛을 띠는 색입니다. 이 색은 포도주와 호화 및 풍요를 연상시킵니다. 패션에서는 가장 인기 있는 가을 컬러 중 하나이며 금색과 베키어(beige), 해군 파란색(navy blue) 등 여러 다른 색들과 잘 조합됩니다.
  color.charcoal:
    label: 앙트라사이트
    summary: 나뭇탄 같은 아주 짙은 회색
    info: 앙트라사이트(antracite 또는 숯 검정색)는 나무 탄(숯)처럼 매우 어두운 회색이며 거의 흑에 가깝습니다. 현대 인테리어 디자인에서 브랙을 대체하는 색으로 널리 사용되고 있습니다. 패션 분야에서는 공식적인 의상과 잘 어울리는 중립적 기본 컬러입니다.
  color.chartreuse:
    label: 청황색
    summary: 노란색과 녹색 사이다생동하는 색.
    info: |-
      차트뢰즈(청황색)는 스펙트럼에서 노랑과 초록 사이에 있는 생동감 넘치는 색입니다.
      이름은 동명의 프랑스 수도원에서 만들어진 허브 리큐어 차트뢰즈에서 유래했습니다.
      인간 눈으로 가장 잘 보이는 색 중 하나이며,
      비행기 조종사용 점퍼와 운동 경기에 사용되는 표시물 등 최대한 시야를 확보해야 하는 경우 청황색을 자주 씁니다.
  color.cobalt:
    label: 코발트
    summary: 생명력 넘치고 짙은 어두운 파랑 같은 코발트 물질.
    info: |-
      코발트 블루는 화학 원소 코발트(Co)에서 이름을 따온 생동감 있는 진한 파란색이다.
      18세기 회화에서는 가장 인기가 많았던 청색 색료 중 하나였다.
      도자기와 유리 그리고 미술 작품에도 사용된다.
      vincet van gogh가 좋아했던 대표적인 색상이기도 하다.
  color.copper:
    label: 구리
    summary: 금속 구리와 같은 붉게 물든 갈색.
    info: 구리색은 금속 광택이 있는 붉적한 갈색으로 구리를 연상시키는 색이다. 인간들이 처음 가공했던 금속 중 하나인 구리는 석기시대 말기에 사용되었다. 오래된 구리로 된 지붕들은 산화작용(녹슨 현상)을 겪으면서 녹색으로 변한다; 이른바 '티르코소' 라고 부를 수 있다. 또한, '아번(aubrun)'이라는 표현도 털빛깔에서 쓰이며 주홍갈색의 머릿결을 묘사할 때 자주 활용된다.
  color.coral:
    label: 코랄
    summary: 해양 산호처럼 활력이 있는 핑크오렌지를 뜻합니다.
    info: |-
      코랄라색은 해양 산호에서 이름을 따온 주홍빛 오렌지와 분홍 사이의 생동감 넘치는 온난한 색상입니다.
      여름 패션과 실내 디자인에서는 매우 인기가 있습니다.
      Pantone사는 이 색상을 '리빙 코럴'이라는 명칭으로 2019년도 컬러로 선정했습니다.
      티르키스 파랑, 흰색 및 금색 등 여러 다른 색들과 잘 어울립니다.
  color.cream:
    label: 크рем
    summary: 크림처럼 아주 연하고 황백색이다.
    info: 크림색은 매우 가볍고 노란빛이 감도는 흰 색조입니다. 이름 자체가 신선한 크림의 색을 의미합니다. 인테리어 디자인에서는 순수 백색 대신 따뜻하게 느껴지는 선택지로 사용됩니다.
  color.crimson:
    label: 크림슨
    summary: 깊고 진한 적갈색이며, 사라제보다 어둡다.
    info: 크림슨은 카르미네라는 붉은 색소에서 유래된 깊고 생동감 있는 빨간색이다. 전통적으로 크리스마인 은 노팔 벼룩(Dactylopius coccus)으로부터 만들어졌다. 이는 하버드 대학교의 공식적인 컬러(Harvard Crimson), 그리고 문장학에서는 '구울레즈(gules)'로 표시된다.
  color.cyan:
    label: 아주루바
    summary: 생명력 넘치는 파랑 초록빛깔로, 프린팅 기초 샘플.
    info: 청록색(cyan)은 생동감 있는 청녹 색상으로, RGB 모델에서 값이 R:0, G:255, B:255입니다. 이는 인쇄의 네 가지 기본 색인 CMYK 중 하나(C= Cyan을 의미함). 자연에서는 맑은 날 얕고 열대 해양 지역에 나타나며, 과거 CRT 화면 시절 컴퓨터 단말기에서도 주요한 표시 색상이었습니다.
  color.fuchsia:
    label: 후시아
    summary: 꽃 피부인 후시아처럼 활기찬 자주빛 핫핑크
    info: |-
      후시아는 후시에 꽃(Fuchsia)에서 유래한 생동감 넘치는 보라색과 분홍색의 혼합 색상입니다.
      이 식물은 독일식물학자 레오너트 푸차스(Leonhard Fuchs)(1501–1566년)에게 이름지어졌습니다.
      CSS와 HTML에서는 '마젠타(#FF00FF)'가 후시아를 의미하며, 패션 및 80년대 문화 그리고 포크 아트 등 화려함을 연관시키는 대표적인 컬러로 여겨집니다.
  color.gold:
    label: gold
    summary: 귀하게 여겨지는 금속처럼 깊으며 빛나는 노란빛
    info: |-
      금색은 귀중한 금속인 황금을 연상시키는 색이다.
      부와 명성, 성공 및 고귀함의 상징이 된다.
      紋章학에서 두 가지 직접 사용되는 금속 중 하나(황금과 은장)이며,
      경기나 올림픽 등에서는 최고 수준 수행 능력을 나타내는 골드 메달로도 쓰인다.
  color.green:
    label: 초록색
    summary: 잔디와 나뭇잎의 색상이며 파랑과 노란색을 섞어 만든 보조 색상입니다.
    info: 녹색은 파랑과 노란색을 혼합하여 만들어지는 보조 색상이다. 자연, 생태계 및 신선함을 상징하며, 시각적으로 눈이 가장 민감하게 인식하는 색상 중 하나로 알려져 있다.
  color.grey:
    label: 회색
    summary: 검고와 백 사이의 색이며 구름이나 콘크리트 같은 물체에서 볼 수 있습니다.
    info: 회색은 흰색과 검정을 섞어 만든 무채도 색상입니다. 중립적이고 눈에 잘 뜨지 않는 것으로 여겨집니다. 심리학에서는 회색이 중립성, 균형감 그리고 때로는 감각의 결여를 상징한다고 합니다.
  color.indigo:
    label: 靛蓝色
    summary: 인디غو 염료와 같은 깊은 푸른보랏빛.
    info: 인디고는 인도의 식물에서 추출되는 염료로 이름 붙여진 짙은 파랑 보라색이다. 수천 년 동안 인디구오염료는 가장 귀한 색소 중 하나였다. 무지개 빛 일곱 가지 색(RYBGOVI)에 포함되며 현대적 관점에서는 어두운 청록과 비슷하다.
  color.ivory:
    label: ivorino
    summary: '''크림 같은 하얀색''으로 이브로보다 따뜻한 느낌.'
    info: Ivorino는 상아(상어의 치아)처럼 고운 노란색을 띤 크림 퍼플 색이다. 이름은 '이보리(ivory)'에서 유래했다. 패션과 디자인뿐 아니라 피부 설명에도 사용된다.
  color.khaki:
    label: 카키
    summary: 탁한 연 갈색; 군용 야전 색상
    info: 카키는 19세기 인도에서 영국군이 사용하면서 대중화된 어두운 연갈색이다. 이 단어의 원래 의미는 우르두어와 힌디어로 '가루' 또는 '진흙'을 뜻한다. 카기는 군복과 야외 의류에 기본적으로 쓰이며, 여성 패션에서는 이미 수십 년 전부터 트렌드를 유지하고 있다.
  color.lavender:
    label: 레반두르보
    summary: 꽃처럼 아주 가벼운 자주빛
    info: |-
      라벤더는 라바ندูล라는 허브에서 유래한 매우 연하고 부드러운 보라색이다.
      이 색은 평온함과 깨끗함을 상징하며 프로방스 지방의 자연 경관도 연상시킨다.
      aromatherapy에서는 이 향기와 느긋함 및 수면 상태가 연결되어 있다.
      kids 방 디자인이나 스파 미학에서도 인기가 많다.
  color.lime:
    label: ليمتکوفا
    summary: 생동감 있는 노랑초록색이며, 체리를 닮았다.
    info: |-
      리메트코바(라임 그린)는 라이무스라는 귀한 과일에서 이름을 따온 밝고 풍부한 노란색과 초록색의 혼합 색상이다.
      잎 녹음보다 더 두드러지며, 보다 많은 황금빛 감도를 포함하고 있다.
      그래픽 디자인에서는 강조 효과와 행동 유발용으로 널리 사용되는데,
      안전복은 고시민성 때문에 종종 리멧코바로 만들어진다.
  color.magenta:
    label: 마젠타
    summary: 생기넘치는 보라-분홍색; 레드와 벽스터간
    info: 퍼플루바(Purple-red 또는 마젠타)는 빨강과 파랑 사이에 있는 생동감 넘치는 색으로, 가시광선 스펙트럼에서는 대응하는 특정한 파장이 없다. 이름은 이탈리아에서 일어난 메건타 전투(1859년)에서 유래했다. 인쇄의 경우, CMYK 모델(Cyan - Cyan, Magenta - 마젠타, Yellow - 노란색, Key - 검정색) 기본 네 가지 중 하나이다. 무지개 속에는 존재하지 않으며, 두 원색인 붉고와 푸른빛을 혼합하여 눈속에서 만들어진다.
  color.maroon:
    label: 카시나토바
    summary: 깊고 부드럽게 감싸주는 간주색의 톤
    info: |-
      캐슈타노바(버건디색)는 스페인어로 '갈색'을 뜻하는 단어에서 유래한 어두운 갈레트빛 붉은 색이다.
      패션과 운동복 및 군중복에 인기 있는 컬러다.
      영국에서는 버건디를 고립된 섬 속 포위당한 사람에게도 사용한다.
      보르도와 비교하면 보라조가 덜하고 짙게 검지 않은 점이 다르며, 진홍보다 더 깊지는 않지만 적절히 따뜻하다.
  color.mauve:
    label: 라이트
    summary: 희미하고 약간 누렇게 변한 자주색.
    info: |-
      라일락(마브)은 부드럽고 희미한 보라색과 분홍빛을 띤 색이다.
      이름은 프랑스어에서 유래되었으며 'slézovník' 또는 'Malva sylvestris'(꽃의 한 종류)를 의미한다.
      첫 번째로 합성된 염료인 아닐린보랏빛(aniline purple), 윌리엄 파커(William Perkins)가 1856년에 개발하였다.
      vintage와 비كتORIA안 스타일에서도 인기가 있다.
  color.mint:
    label: 민트
    summary: 잎의 색깔처럼 매우 가벼운 초록빛.
    info: 민트는 민트 식물(Mentha)에서 유래한 상큼하고 옅은 녹색이다. 깨끗함과 시원함을 연상시키며 현대 인테리어 디자인 및 레트로 감성(특히 50년대 스타일)에서도 널리 사용된다. 민트 아이스크림이나 차와 같은 음식이 대표적인 연결점으로 꼽힌다.
  color.navy:
    label: 나비 블루
    summary: 밤에 보이는 바다처럼 아주 깊고 짙게 검푸른 색
    info: 해군 파랑(navy)은 매우 어두운 청색이다. 이름은 18세기에 영국 왕립 해군(Royal Navy)의 제복에서 유래했다. 패션과 공식 의상에서는 가장 인기 있는 기본 색 중 하나이며 흰색이나 베이지색 그리고 금빛 등 여러 가지와 잘 조화된다.
  color.ochre:
    label: 오르카
    summary: 흙 같은 주황갈색으로서 자연적인 오크리트 미네랄 성분.
    info: 오크레는 철분 화합물인 오크로이드에서 유래한 흙빛 갈색과 노란색을 혼합한 색이다. 이 물질은 인류 역사상 가장 초기에 사용된 안료 중 하나이며, 구석기 시대의 동굴 벽화에서도 발견된다. 자연 상태에서는 땅 속 돌 형태로 존재하며 알타미라와 라스코 등의 고고학적 발굴지에도 나타난다.
  color.olive:
    label: 오лив
    summary: ' 옴을 연상시키는 무채도한 노란 초록빛'
    info: 올리브색은 자연 환경에서 캐모플라주 효과를 주기 때문에 전통적인 군용 및 야영 색상입니다. 패션에서는 흔히 '밀리터리 스타일'의 대표적 컬러로 사용되며 베이지와 갈색 계열과 잘 어울립니다.
  color.orange:
    label: 주황색
    summary: 빨강과 노랑의 따뜻한 보조 색상입니다.
    info: 주황색은 빨간색과 노란색을 섞어 만들어지는 보조 색상으로, 열정과 창의성을 상징합니다. 이름은 귤이라는 과일에서 유래되었습니다.
  color.periwinkle:
    label: 퍼라이윙클 빛
    summary: 연한 청보랏빛
    info: 페리와인슬 블루는 작은 비냐차(Vinca minor) 꽃에서 이름을 딴 연한 파랑 보라색이다. 이 색은 연파란색과 라벤더 사이의 범위에 있다. 섬세하고 로맨틱한 느낌으로 패션 및 인테리어 분야에서도 널리 사용된다.
  color.pink:
    label: 분홍색
    summary: 붉은색의 옅은 색조로, 부드럽고 귀여운 색입니다.
    info: 분홍색은 붉은색의 밝은 톤으로 표현됩니다. 많은 문화에서 이 색상은 친절함, 로맨스 그리고 장난기와 연결되어 있습니다.
  color.purple:
    label: 보라색
    summary: 적색과 청색을 혼합하여 만들어지는 신비로운 보색.
    info: 보라색은 적색과 청색을 섞어 만든 이차 색상이다. 역사적으로 가장 비싼 색으로 왕실 권위와 럭스를 상징해왔다.
  color.red:
    label: 빨강
    summary: 혈액과 불의 따뜻한 기본색
    info: 빨간색은 빛의 세 가지 기본 색 중 하나이다. 에너지와 열정 그리고 위험을 연상시키며, 많은 문화에서 행운과 힘을 상징한다.
  color.rose:
    label: розовый
    summary: 연하고 고혹적인 핑크-빨간색이며, 진짜 장미 꽃잎과 유사함.
    info: |-
      로즈(Rose)는 장미꽃을 본따 이름 붙여진 부드럽고 연한 분홍색이다.
      핑크(pink)와 구별되는데 로즈 색은 더 어둡으며 빨강 성분이 강하다.
      서머럴 베키트(Samuel Beckett)의 말에 따르면 '하트를 자연스러운 방식으로 표현하는 가장 적절한 색상도 바로 이 로즈색'이라고 한다.
      紋章학(heraldry)에서는 영국 왕실 문장에도 등장하며 흔히 ‘헤라ルド릭 로ーズ’라고 불린다.
  color.salmon:
    label: 로즈핑크
    summary: 연한 핑크와 오랜지를 혼합하여 농어 고기를 닮은 색상.
    info: 로즈핑크는 연한 핑크색에서 오렌지까지의 색조를 가진 것으로 로소 마디기름과 비슷하다. 이 색은 분홍빛보다 따뜻하고 밝으며 패션 산업에서는 부드러운 대안으로 자주 사용된다. 인테리어 디자인에서도 포근함을 주며 편안하게 느껴지는 효과가 있다.
  color.scarlet:
    label: scharlatt
    summary: 밝고 살짝 누란주색 감이 나는 진한 레드
    info: 사라토바(Scharlattova)는 샤랄레(Scarlet)라는 염료 성분으로 이름 붙여진 밝은 빨강 주황색이다. 카민보다 약간 더 환하고 오렌지 톤이 강하다. 역사적으로 이 색상은 고급스러운 적갈색 천을 의미했다. 하워드의 소설 '더 스카렛 리터(The Scarlet Letter)'에서 사라토 바튼 글자는 수치심과 부끄럼의 상징이다.
  color.sienna:
    label: Burnt Sienna
    summary: 붉게 변형된 지구 페인트로서 원래 또는 굽힘 처리가 된 형태로 알려진.
    info: 시에나 주홍색은 이탈리아 도시 시에나에서 이름을 딴 붉고 갈색 땅 화합물입니다. Raw Sienna는 노란갈색이고 Burnt Sienna(굽힌 상태)는 진한 적갈색입니다. 문학적 재생의 그림과 자연적인 따뜻함이 느껴지는 샘이며 수채화에서는 기본적으로 사용되는 온난하고 어두운 간주색으로 쓰이며.
  color.silver:
    label: streibrna
    summary: 귀한 금속 은처럼 반짝이는 회백색.
    info: 은색(streibrna)은 귀금속인 은을 연상시키는 금属性의 색이다. 현대성과 우아함, 기술 및 산업 디자인을 상징하며 문장학에서 두 번째로 중요한 길드이며 올림픽에서는 둘째 자리를 나타낸다.
  color.tan:
    label: 탄
    summary: 빛난 갱색과 같은 미묘하게 따뜻하고 진한 간주색.
    info: 피스코바나(tan)는 땅이나 태닝된 피부를 연상시키는 온화한 갈색이다. 이 색 이름은 가죽을 처리하는 '태닝' 과정에서 유래되었다. 베이지와 비슷하지만 약간 어두우며 황갈색 기운이 더 강하다.
  color.teal:
    label: modrozelená
    summary: 바다처럼 파랑과 초록이 섞인 샘물
    info: '모두르제레나(teal)는 윙크 크레이지(anas crecka)의 날개와 같은 색상을 뜻하며 터키색 스펱트럼 상단에 해당합니다. 그래픽 디자인에서 주로 오렌지를 대비시키기 위한 컨ทรา스트용으로 사용되며 CSS에서는 짧은 코드 #008080을 쓸 수 있습니다.'
  color.turquoise:
    label: turquoise
    summary: 열대 수역처럼 화사하고 삶동적인 빛깔.
    info: 티르코소바(Turquoise)는 반귀재료인 티르쿠이스(천연석류 광물 중 하나로 고대 이집트와 파키スタン 그리고 아메리카에서 귀하게 여겨졌음)의 이름을 딕은 생기 넘치고 청량한 연두색이다. 열대 해양이나 바다 얼음 또는 맑은 날 하늘과 같은 색감으로 표현된다.
  color.vermillion:
    label: 럼엘кова
    summary: 생기 있는 붉고 오렌지 같은 뿌리미레오니온.
    info: 루멜코바(버민illion)는 광물 루메르크(cinnabar 또는 수은 황화염석(HgS))에서 이름을 디킨 생동감 넘치는 붉고 주황색이다. 역사적으로 가장 많이 사용된 적색 색소 중 하나였다. 중국의 럼에일카는 독성광물을 포함하므로 오늘날에는 합성을 대체하고 있다.
  color.violet:
    label: 보라
    summary: 파란 보라색; 시각적으로 인식 가능한 스펙트럼의 가장 마지막.
    info: 보라색은 보이는 빛 스펙트럼의 맨 오른쪽에 위치하며 파장이 약간 380~420nm입니다. 이 색상 이름은 꿀풀(Viola)이라는 식물에서 유래되었습니다. 색채 이해 측면에서는 적갈색과 구별되는데, 보라색은 푸르스름한 반면, 자주색(적자홍색)은 붉고 파랑 사이를 가집니다. 과거에는 보랏빛 염료가 매우 귀하고 비쌌기 때문에 왕족들만 보라옷을 입었습니다.
  color.white:
    label: 흰색
    summary: 가장 밝은 색으로, 모든 빛을 반사합니다.
    info: 흰색은 가시광선 스펙트럼의 모든 색상을 동시에 포함하고 있습니다. 순수성, 무죄, 새로운 시작 등을 상징하며, 많은 문화에서 평화를 나타내는 색입니다.
  color.yellow:
    label: 노란색
    summary: 태양과 금의 밝고 따뜻한 기본 색상입니다.
    info: 노란색은 빛의 기본 색 중 하나이며 가장 눈에 잘 뜨이는 색들 중 하나입니다. 행복, 에너지와 낙관주의를 상징하며 주목을 효과적으로 끌어모으는 색입니다.
