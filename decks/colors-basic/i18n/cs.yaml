lang: cs
pivot: true
title: Základní barvy
cards:
  color.red:
    label: červená
    summary: Teplá primární barva krve a ohně.
    info: Červená je jedna ze tří základních barev světla. Evokuje energii, vášeň a nebezpečí; v mnoha kulturách symbolizuje štěstí a sílu.
  color.blue:
    label: modrá
    summary: Chladná primární barva nebe a oceánu.
    info: Modrá je chladná primární barva světla. Je nejoblíbenější barvou na světě a symbolizuje klid, důvěru a hloubku.
  color.green:
    label: zelená
    summary: Barva trávy a listů, sekundární barva z modré a žluté.
    info: Zelená je sekundární barva vzniklá smícháním modré a žluté. Symbolizuje přírodu, přírodu a svěžest; oko ji vnímá nejcitlivěji ze všech barev.
  color.yellow:
    label: žlutá
    summary: Jasná teplá primární barva slunce a zlata.
    info: Žlutá je primární barva světla a jedna z nejjasnějších barev. Symbolizuje štěstí, energii a optimismus; dobře přitahuje pozornost.
  color.orange:
    label: oranžová
    summary: Teplá sekundární barva vzniklá z červené a žluté.
    info: Oranžová je sekundární barva vzniklá smícháním červené a žluté. Symbolizuje entuziastmus a kreativitu; je pojmenována podle plodu pomeranče.
  color.purple:
    label: fialová
    summary: Záhadná sekundární barva vzniklá z červené a modré.
    info: Fialová je sekundární barva vzniklá smícháním červené a modré. Historicky bývala nejdražší barvou, spojenou s královskou mocí a luxusem.
  color.pink:
    label: růžová
    summary: Světlý odstín červené, jemná a roztomilá barva.
    info: Růžová je světlý tón červené barvy. V mnoha kulturách se spojuje s laskavostí, romantikou a hravostí.
  color.brown:
    label: hnědá
    summary: Zemitá sekundární barva dřeva a půdy.
    info: Hnědá je sekundární barva vzniklá smícháním červené, žluté a černé. Symbolizuje zemi, přírodu a stabilitu; je oblíbená v přírodních a podzimních tématech.
  color.black:
    label: černá
    summary: Nejtmavší barva, nepřítomnost světla.
    info: Černá je absence veškerého viditelného světla. Symbolizuje eleganci, tajemství a moc; v módě je považována za základní univerzální barvu.
  color.white:
    label: bílá
    summary: Nejsvětlejší barva, odraz veškerého světla.
    info: Bílá obsahuje všechny barvy viditelného spektra současně. Symbolizuje čistotu, nevinnost a nové začátky; v mnoha kulturách je barvou míru.
