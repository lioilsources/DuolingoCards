lang: es-419
pivot: false
title: Colores básicos
cards:
  color.black:
    label: negra
    summary: El color negro es el más oscuro y representa la ausencia de luz.
    info: Negro es la ausencia total de cualquier luz visible. Simboliza elegancia, misterio y poder; en la moda se considera una color básico universal.
  color.blue:
    label: azul
    summary: Color primario frío del cielo y el océano.
    info: El azul es un color primario frío de la luz. Es el color más popular en el mundo y simboliza calma, confianza y profundidad.
  color.brown:
    label: marrón
    summary: Color tierra secundario de la madera y el suelo.
    info: El color marrón es una tonalidad terrosa que se obtiene al mezclar rojo, amarillo y negro. Representa la tierra, la naturaleza y la estabilidad; es muy utilizado en temas relacionados con lo natural y los paisajes otoñales.
  color.green:
    label: verde
    summary: Color de la hierba y las hojas, color secundario mezclando azul y amarillo.
    info: El verde es un color secundario que se forma al combinar el azul con el amarillo. Simboliza la naturaleza, frescura y vitalidad; además, nuestro ojo lo percibe más claramente de todos los colores.
  color.orange:
    label: naranja
    summary: Color secundario cálido formado por rojo y amarillo.
    info: El naranja es un color secundario que se crea al mezclar el rojo y el amarillo. Simboliza entusiasmo y creatividad; recibe su nombre del fruto de la naranja.
  color.pink:
    label: rosa
    summary: Un tono claro de rojo, color suave y adorable.
    info: El rosa es un tono claro del rojo. En muchas culturas se asocia con la dulzura, el romanticismo y la juguetonería.
  color.purple:
    label: morada
    summary: Misteriosa color secundario formado por el rojo y el azul.
    info: El morado es un color secundario que se crea al mezclar rojo y azul. Históricamente era considerado el color más caro, asociado con poder real y lujo.
  color.red:
    label: roja
    summary: Caliente color primario del sangre y fuego.
    info: Roja es una de las tres colores básicas de la luz. Evoca energía, pasión y peligro; en muchas culturas simboliza suerte y fuerza.
  color.white:
    label: blanca
    summary: El color más claro, reflejo de toda la luz.
    info: Blanco contiene todas las colores del espectro visible al mismo tiempo. Simboliza pureza, inocencia y nuevos comienzos; en muchas culturas es el color de la paz.
  color.yellow:
    label: amarilla
    summary: Color brillante y cálido del sol y el oro.
    info: El amarillo es un color primario de la luz y uno de los más llamativos. Simboliza felicidad, energía y optimismo; tiene una gran capacidad para captar la atención.
