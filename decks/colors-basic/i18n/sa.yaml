lang: sa
pivot: false
title: मूल रंगः
cards:
  color.black:
    label: कृष्ण
    summary: अतिसमान अंधकार, प्रकाश का अभाव।
    info: कृष्ण दृश्य प्रकाश के सर्वप्रकार अनुपस्थिति होती छल। इ महाकाय एवं गुप्तता, शक्ति के प्रतीक होइत अछि; फैशन में इ आधारभूत सामान्य रंग के रूप में मानयल जाहि छल।
  color.blue:
    label: नीला
    summary: शांत और गहिरे को प्रदर्शित करने वाला मुख्य आकाश एवं समुद्र का ठंडा प्राथमिक रंग।
    info: नीला प्रकाश का एक ठंडा प्राथमिक रंग है। यह पृथ्वी पर सबसे अधिक पसंद किया जाने वाला रंग है और शांति, भरोसा और गहराई को प्रतीकात्मक रूप से दर्शाता है।
  color.brown:
    label: भूरी
    summary: मिट्टा और प्रकृति के संबंध में हुई द्वितीयक रंग।
    info: भूराम् एक द्वितीयक रंगः अस्पष्ट लाल, पीला चाँदनी आणि काळा मिश्रणाने उत्पन्न होतो। भूरा धरती, प्रकृति आणि स्थिरता यांचे प्रतीक आहे; जीवनशैली आणि ओसड़ी विषयांमध्ये खूप लोकप्रिय आहे।
  color.green:
    label: हरा
    summary: घास एवं पत्तियों की रंग, नीले और पीले से द्वितीयक रंग।
    info: हरा नीले और पीले के मिश्रण से बना हुआ द्वितीयक रंग है। इसका प्रतीक प्रकृति, प्राकृतिकता एवं ताजगी है; आँखें इसे सभी रंगों में सबसे संवेदनशीलता से ग्रहण करती हैं।
  color.orange:
    label: ओरेंज
    summary: लाल एवं पीत के मिश्रण से बनी तकनीसी द्वितीयक रंग।
    info: ओरेज नामक फल के अनुसार इसे ओरेज भी कहा जाता है। यह उत्साह और कल्पनाक्षमता को प्रदर्शित करता है।
  color.pink:
    label: रूज़वा
    summary: लाल के एक सुगंधित और मनोहर रंग की प्रकाश छटा।
    info: रूज़वा लाल रंग का हल्का टोन है। अनेक संस्कृतियों में इसे दया, रोमान्स और खेलने के भाव के साथ जोड़ा गया है।
  color.purple:
    label: फियालोवा
    summary: रक्त और नीले के मिश्रण से बनी रहस्यमयी द्वितीयक रंग।
    info: फियालोवा एक द्वितीयक रंग है जो लाल और नीले के मिश्रण से बनता है। ऐतिहासिक रूप से यह सबसे महँगा रंग माना गया था और इसे राजशक्ति और लक्झुरी के साथ जोड़ा गया था।
  color.red:
    label: लाल
    summary: रक्त एवं अग्नि की गरम प्राथमिक रंग।
    info: लाल शब्दपटले में तीनों प्राथमिक प्रकाश रंगों में से एक है। यह ऊर्जा, उत्साह और खतरे को बुलाता है; अधिकांश सभ्यताओं में इसका भाग्य एवं शक्ति के चिह्न के रूप में प्रयोग किया जाता है।
  color.white:
    label: श्वेत
    summary: सभी प्रकाश का बिना अवशोषणे पर परावर्तन हुई सबले रंग।
    info: श्वेत मनुष्य द्वारा दृष्टिगोचर स्पेक्ट्रम में सभी रंगों के समाहार हुआ जाईत छल। इ हौदयपन, निष्ठा आऊर नए आरंभ के प्रतीक भी हउँ; बहुत से संस्कृति में इ शांति के चिह्न भी हउँ।
  color.yellow:
    label: भूरी
    summary: सूर्य और सोने का प्रकाशमान तापमुखीय मूल रंग।
    info: भूरी प्रकाश की मूल बरंग होइत अउ इच्छा सबलेस चमकदार बरंग में से एक हवई। ई आनंदिति, ऊर्जा अउ उपेक्षा के प्रतीक हवई; ध्यान ले खींचे में अच्छा काम करथे।
