lang: zh-CN
pivot: false
title: 基本颜色
cards:
  color.amber:
    label: 琥珀
    summary: 像矿物质琥珀一样的暖金色调
    info: |-
      琥珀色是一种温暖的金橙色调，以矿物化石树脂（石化松脂）命名。在史前时代，人们珍视它作为装饰和精神材料使用。
      琥珀信号灯(交通红绿灯中的黄色灯光)，是普遍代表谨慎的标准符号。
      包含于其中的小型生物标本被称为“包埋物”，是非常稀有的、可追溯至一亿年前的生命遗迹。
  color.aqua:
    label: 天青
    summary: 像清澈海水一样的鲜明蓝色调
    info: |-
      天青石色是一种明亮的蓝绿色；在HTML和CSS中，aquasynonym 是 #00FFFF。名称源自拉丁语：aqua 表示水。
      aquasynonym 带有热带海洋、游泳池以及清新感的印象，在图形设计领域广泛用作现代界面中的对比颜色。
  color.azure:
    label: 天蓝色
    summary: 像夏天一样清澈湛蓝天空的颜色
    info: |-
      天蓝色（蔚蓝）是一种明亮、生动的天空颜色；名字来源于矿物青金石。它是多个国家国徽的一部分，如法国、以色列和芬兰。
      在文艺复兴时期，这种颜料比黄金还昂贵，并被用于圣母玛利亚长袍上的蓝色。
  color.beige:
    label: 米白
    summary: 浅淡暖棕色；温润中性色
    info: 米色是一种介于白色和金褐色之间的明亮温暖颜色。它源自古法语中表示自然波浪的词语，在室内设计领域广泛用作温和的中间色调基础，其色彩接近沙砾与未烧制陶土的颜色。
  color.black:
    label: 黑色
    summary: 最暗的颜色，没有光。
    info: 黑色是所有可见光的缺失。它象征着优雅、神秘和力量；在时尚界被视为基础且通用的颜色。
  color.blue:
    label: 蓝色
    summary: 天空和海洋的冷色原色。
    info: 蓝色是光的一种冷色调基本颜色。它是世界上最受欢迎的颜色，象征着平静、信任与深度。
  color.bronze:
    label: bronze
    summary: 像青铜一样的暗金色棕色金属色调
    info: 青铜色是一种类似铜和锡合金的深金褐色金属颜色。 青铜时代（约公元前3300至前1200年）得名于这种金属。（在奥运会中，它象征第三位——获得一枚 bronze 奖牌）。 公共场所常见的雕像通常为青铜材质。
  color.brown:
    label: 棕色
    summary: 象征土地和自然的稳定次级颜色。
    info: 棕色是一种通过混合红色、黄色和黑色形成的次级颜色，它代表大地与自然，并传递出稳重的感觉；常用于表现自然主题或秋季场景。
  color.burgundy:
    label: 勃艮第
    summary: 一种如来自勃艮第地区的红色葡萄酒般暗沉而带有紫色调的颜色
    info: 勃艮第色是一种深红带紫的色调，以其命名的是法国著名的葡萄酒产区布尔戈涅（Bourgone）。这种颜色让人联想到红酒、奢华与富足。在时尚界中它是最受欢迎的一种秋季色彩之一，并且能很好地搭配金色、米白色和海军蓝色。
  color.charcoal:
    label: 炭灰色
    summary: 像木头烧成的煤一样的极暗灰色
    info: 炭灰色（Charcoal）是一种非常深的灰，几乎接近黑色的颜色。在现代室内设计中常作为黑颜色的一种替代选择而流行起来；它也是时尚界的基础性中立色之一，在正式服装搭配上尤为合适。
  color.chartreuse:
    label: 黄绿色
    summary: 介于黄色与绿色之间的一种鲜明色彩
    info: |-
      金绿色（黄绿）是位于黄色和绿色之间的鲜艳颜色。这种名称来源于同名法国修道院生产的草药利口酒chartreuse。
      它是人眼最易识别的颜色之一，飞行员背心及运动标志通常使用此色以达到最大可见度。
  color.cobalt:
    label: 钴蓝
    summary: 一种像钴色素那样鲜艳而深沉的蓝色
    info: |-
      钴蓝是一种明亮、浓郁的蓝色，以化学元素钴（Co）命名。十九世纪绘画中使用最广泛的蓝色颜料之一就是这种颜色。
      它被广泛用于陶瓷器皿和玻璃制品以及艺术创作之中，并且是文森特·梵喜爱用的颜色。
  color.copper:
    label: 铜
    summary: 像铜一样的红色带棕色的金属颜色
    info: 铜色是一种带有金属光泽的红褐色，让人联想到元素周期表中的铜（Cu）。 铜是人类最早加工使用的几种金属之一，在新石器时代晚期至青铜时代的过渡期即使用。 老化的铜屋顶由于氧化作用会变成绿色；这种被称为‘绿松’的颜色接近天青石蓝。
  color.coral:
    label: coral
    summary: 像海里珊瑚一样的生动粉橘色调
    info: |-
      珊瑚色是一种介于橙色和粉色之间的温暖鲜艳颜色，以海洋中的珊瑚命名。它在夏季时尚与室内设计中非常流行。
      pantone 将其命名为「活珊瑚」并宣布为2019年度色彩。
  color.cream:
    label: 奶黄色
    summary: 像鲜奶油一样的很淡的黄白色
    info: 奶油色是一种非常浅的黄白色调。这种颜色名称来源于新鲜奶油的颜色，在室内设计中，它常被用作纯白的一种更温暖的选择。
  color.crimson:
    label: 胭脂红
    summary: 这是一种比猩红色更深、浓郁且鲜明的暗红色调
    info: 胭脂红是一种深而鲜艳的红色，其名称来源于一种名为胭脂虫（Cochineal）产生的染料颜料。传统上用诺帕尔仙人掌上的昆虫 Dactylopius coccous 制成这种色素。它是哈佛大学的颜色之一，并在纹章学中被称为 'gules'。
  color.cyan:
    label: 青
    summary: 一种鲜明的绿松石般的色彩，在打印过程中是基本色调
    info: 天蓝色（青色）是一种鲜艳的蓝绿色；在RGB模型中，其值为R：0、G：255和B：255。它是CMYK印刷四原色之一（其中 C 表示 Cyan）。这种颜色也出现在自然环境中——例如晴朗白天浅热带海洋的颜色就类似如此。
  color.fuchsia:
    label: 福克斯紫
    summary: 像天竺葵花朵一样的鲜艳淡紫色。
    info: |-
      福克斯紫是一种明亮的淡紫色，以植物福克斯花（天竺葵）命名。
      这种颜色在CSS和HTML中也被称为品红色(#FF00FF)，与时尚、八十年代风格以及流行艺术相关联。
  color.gold:
    label: 金色
    summary: 像贵金属一样的深亮黄色
    info: '{"info":"黄金是一种象征财富、声望和成功的颜色。在纹章学中，它是直接用于徽章的两种金属（金与银）之一；金牌则代表比赛或奥运会上最高水平的表现。");'
  color.green:
    label: 绿色
    summary: 草和叶子的颜色，由蓝色与黄色混合而成的二次色。
    info: 绿色是通过将蓝色和黄色混合而形成的次级颜色。它象征着自然、生命力和清新；在所有颜色中，人眼对绿色最为敏感。
  color.grey:
    label: gray
    summary: 位于黑白之间的色彩；云朵及混凝土之色泽
    info: '{"hint":"灰色，介于黑色和白色之间","info":"灰是通过混合白与黑形成的无色系颜色。\n它被认为是一种中性且不显眼的颜色。\n在心理学上象征着中立、平衡以及有时的乏味感；其深色调称为烟煤色（antracite），浅调几乎接近纯白。");'
  color.indigo:
    label: 靛蓝色
    summary: 像靛蓝颜料一样的黑暗的蓝紫色
    info: 靛蓝色是一种深蓝紫色，得名于染料植物（如木蓝属）。几千年来，靛蓝一直是最重要的天然色素之一。它是彩虹七种颜色中的一种(红、橙、黄、绿、青、靛蓝和紫)，在现代概念里它接近暗蓝色。
  color.ivory:
    label: 象牙白
    summary: 像象齿一样的乳脂白色；比纯白更温暖
    info: 象牙色是一种细腻的淡黄色、奶油白色。名称来源于大象牙齿（Ivory）。它在时尚界和设计中使用，也用于描述肤色。
  color.khaki:
    label: 卡其
    summary: 一种柔和的浅褐黄色；军事野外色调
    info: 卡其色是一种由英国军队在十九世纪于印度推广的柔和浅黄褐色。这个词来源于乌尔都语或印地语，意为尘土、泥巴。它是军装和户外服装的基本颜色。
  color.lavender:
    label: 薰衣草紫
    summary: 像薰衣草花一样极淡的紫色
    info: 薰衣草色是一种柔和的浅紫色，以香料植物熏衣草（Lavandula）命名。它让人联想到宁静、纯净和法国普罗旺斯地区的风景，在芳香疗法中与放松和睡眠联系在一起，并且在儿童房间设计以及水疗美容领域非常流行。
  color.lime:
    label: 青柠色
    summary: 像柠檬一样鲜活的黄绿色
    info: |-
      青柠色（Lime）是一种明亮、鲜艳的黄绿色，名字来源于柑橘类水果——酸橙。它比叶绿更鲜明；含有更多的黄色调子。
      在平面设计中广泛用作强调和行动号召的颜色。
  color.magenta:
    label: 紫罗兰
    summary: 一种鲜明的紫色；在红色和蓝之间
    info: 品红色（洋红）是一种介于红色和蓝色之间的鲜艳颜色，在可见光谱中没有对应的波长。名称来源于意大利马焦雷战役(1859年)，是CMYK印刷中的基本色之一(CMYK：青、品红、黄、黑）。彩虹上找不到这种颜色，它是大脑将红色与蓝色混合产生的。
  color.maroon:
    label: 栗色
    summary: 一种较不带紫色调且比酒红色更深的颜色；类似于葡萄酒般的浓重色调
    info: |-
      栗色（深红褐色）是一种暗棕色的红色，得名于西班牙语中的‘castaña’意为板栗。这种颜色在时尚、运动服和制服中很受欢迎。
      英语单词'maroon'也可用来形容被遗弃在一个荒岛上的人。
  color.mauve:
    label: lila
    summary: 一种柔雅而略带灰调的粉红与深蓝混合而成的颜色；类似尘土覆盖下的浅紫红色
    info: 紫罗兰色（丁香）是一种柔和的淡紫色，名称来源于法语‘mauve’意为锦葵属植物。它是第一种合成染料——苯胺紫于1856年由威廉·珀金发明。
  color.mint:
    label: 薄荷绿
    summary: 像薄荷叶一样非常浅淡的一种绿色
    info: 薄荷色是一种清新明亮的绿色，名字来源于香草薄荷（留兰香）。它让人联想到纯净、新鲜和清凉感。这种颜色在现代室内设计中很受欢迎，在复古美学风格(如五十年代风潮）也很常见。
  color.navy:
    label: 海军蓝
    summary: 像夜晚海洋一样极暗的一种蓝色；即为‘军舰’之意
    info: 海军蓝（navy）是一种非常深的蓝色。这种名称来源于英国皇家海军建于十八世纪时所穿制服的颜色，是时尚界和正式服装中最重要的基础色之一，并且与白色、米黄色以及金色搭配起来效果很好。
  color.ochre:
    label: 赭
    summary: 像天然赭石一样呈泥土黄色的颜色
    info: 赭色是一种土壤状的黄褐色颜色，以氧化铁（氢氧化铁）颜料命名。这是最古老的色素之一；史前人类曾在洞穴绘画中使用它。在自然界中作为地层中的赤土石存在，并出现在阿尔塔米拉、拉斯科等旧石器时代的壁画上。
  color.olive:
    label: 橄榄绿
    summary: 像橄榄一样的暗黄色调的颜色
    info: 橄榄色是一种柔和的黄绿色，其名称来源于油橄榄（学名：oleaeurpoea）。由于在自然环境中具有伪装效果而成为经典的军用和露营颜色。它也是时尚界中军队风格的传统色彩，并且与米白色、棕色以及栗子褐色搭配起来非常协调。
  color.orange:
    label: 橙色
    summary: 由红色和黄色混合而成的暖色调次级颜色。
    info: 橙色是一种通过将红色与黄色调合而形成的次级色彩，象征着热情与创造力；其名称来源于柑橘类水果。
  color.periwinkle:
    label: '{ "label": "天竺葵蓝", }'
    summary: '{"summary":"像天竺葵花朵一样的淡紫罗兰色调颜色."}'
    info: |-
      {"info":"天竺葵蓝是一种淡蓝色调，灵感来自小花长春藤（学名：Vinca minor）的颜色。它介于浅蓝色和薰衣草色之间，在时尚界与装饰设计中广受欢迎，并被认为具有柔和浪漫的特质。
      在HTML代码中的近似表示为#CCCCCCFF"}
  color.pink:
    label: 粉红色
    summary: 红色的浅色调，柔和而可爱的颜色。
    info: 粉色是红色的一种浅色调。在许多文化中，它与温柔、浪漫和俏皮联系在一起。
  color.purple:
    label: 紫色
    summary: 由红色和蓝色混合而成的神秘二次色。
    info: 紫色是一种通过红与蓝混合形成的冷色调次级颜色。历史上，它曾是最昂贵的颜色之一，常与王权、奢华联系在一起。
  color.red:
    label: 红色
    summary: 血液和火焰的温暖原色。
    info: 红色是三种基本光颜色之一。它唤起能量、激情与危险的感觉；在许多文化中，红色象征着幸福和力量。
  color.rose:
    label: 玫红色
    summary: 像一朵蔷薇花瓣般细腻而略带红色的颜色
    info: |-
      玫瑰红（Rose）是一种柔和的粉红色，以蔷薇花命名。它与浅粉色不同：玫瑰色更深且更偏红色。
      塞缪尔·贝克特曾说：“没有一种颜色比玫瑰更适合表达心。”
      在纹章学中，“玫瑰”作为象征出现在英格兰王国国徽上。
  color.salmon:
    label: 鲑鱼
    summary: 像三文鱼肉类一样的浅粉橘颜色
    info: 鲑鱼色是一种柔和的粉橙色调，其名称来源于三文鱼肉的颜色。它比珊瑚粉色更温暖、明亮，在时尚界常作为淡雅替代品用于玫瑰红色之外的选择；在室内设计中则营造出温馨友好的氛围。
  color.scarlet:
    label: 朱红色
    summary: 鲜明的橙红色；较胭脂色淡一些
    info: 朱红色是一种明亮的略带橙调的鲜红，得名于一种染料。它比胭脂色稍浅且更偏橘色调，在历史上曾用来表示奢华的红色织物。“猩红旗”（《红字》，霍桑）是耻辱的象征。
  color.sienna:
    label: 西恩那赭石
    summary: 一种像色素一样的红棕色地球颜料
    info: 生褐土是一种黄色至棕色的土壤颜料，熟褐（烧制）则呈红色到棕褐色。这种颜色以意大利城市锡耶纳命名，并且是文艺复兴时期绘画中广受欢迎的颜色之一，在自然色彩表现上也常被使用为温暖、大地色调的基础色。
  color.silver:
    label: silver
    summary: 像贵重金属一样的闪亮灰白色
    info: "{\"info\":\"银色是一种金属颜色，象征着昂贵的贵金属白银。它代表现代、优雅和技术工业设计。\r\n在纹章学中是第二种金属；奥运会则用其表示第二名。\r\n许多国家最受欢迎汽车的颜色就是银灰色漆面\"}"
  color.tan:
    label: 栗色
    summary: 像被太阳晒过的肤色一样的淡棕色调
    info: |-
      栗色（Tan）是一种浅棕色，类似于土地或晒黑的皮肤。名称来源于通过树皮处理皮革的过程。
      它与米白色相近但略深一些，并且更偏向黄褐色调。
      这种颜色在时尚界广泛用于制作皮革配饰、鞋子和外套。
  color.teal:
    label: 模罗兹列那
    summary: 带蓝色调子像海水一样的绿色
    info: 碧绿色（蓝绿）是以普通绿头鸭的翅膀颜色命名的颜色。这是在青色光谱上端的一种色调，在平面设计中常作为对比橙色使用的流行色彩，CSS中的速记代码为#008080。
  color.turquoise:
    label: 天蓝色
    summary: 像热带水一样的鲜活蓝绿
    info: 天空蓝是一种生动的蓝绿色，以半宝石青金石命名。这种石头在古埃及、波斯和美洲备受珍视。它象征着热带海洋的颜色或晴朗白天下的海水冰川与蓝天。
  color.vermillion:
    label: 朱砂
    summary: 一种如辰砂般鲜亮的红橙色彩
    info: |-
      朱砂色（Vermillion）是一种鲜艳的红橙色调，得名于矿物辰砂。历史上它是最常用的红色颜料之一；中国使用的辰砂是有毒矿物质汞化合物，在今天已被合成材料替代使用了。
      这种颜色常见在中国漆器、日本寺庙和东正教圣像画中。
  color.violet:
    label: purple
    summary: 蓝紫色调的一种色彩类型
    info: 紫色（violate）是可见光谱末端的颜色，波长大约在380到420纳米之间。它以紫罗兰花的名字命名，在颜色认知上与品红色不同：紫色更接近蓝色；而品红则介于红色和蓝色之间。
  color.white:
    label: 白色
    summary: 最浅的颜色，反射所有光线。
    info: 白色同时包含可见光谱中的所有颜色。它象征纯洁、天真和新的开始；在许多文化中是和平的代表色。
  color.yellow:
    label: 黄色
    summary: 明亮温暖的太阳和黄金的基本颜色。
    info: 黄色是光的主要颜色之一，也是最鲜艳的颜色之一。它象征着幸福、能量与乐观主义，并且能很好地吸引注意力。
