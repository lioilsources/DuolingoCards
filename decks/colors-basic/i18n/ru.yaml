lang: ru
pivot: false
title: Основные цвета
cards:
  color.black:
    label: черная
    summary: Самый темный цвет, отсутствие света.
    info: Черный означает полное отсутствие видимого света. Символизирует элегантность, тайну и силу; в моде считается базовой универсальной окраской.
  color.blue:
    label: голубая
    summary: Холодный первичный цвет неба и океана.
    info: Голубой холодный первичный цвет света. Это самый популярный в мире цвет и символизирует спокойствие, доверие и глубину.
  color.brown:
    label: коричневый
    summary: Землистая вторичная цветовая палитра древесины и почвы.
    info: Коричневый является вторичным цветом, полученным смешиванием красного, желтого и черного. Он символизирует землю, природу и стабильность; часто используется в темах, связанных с природой и осенью.
  color.green:
    label: зеленый
    summary: Цвет травы и листьев, вторичный цвет из синего и желтого.
    info: Зеленый является вторичным цветом, полученным смешиванием синего и желтого. Он символизирует природу, свежесть и жизненную силу; глаз наиболее чувствителен к этому цвету среди всех.
  color.orange:
    label: оранжевый
    summary: Тёплая вторичная цветовая смесь красного и жёлтого.
    info: Оранжевый — это вторичный цвет, полученный при смешивании красного и желтого. Он символизирует энтузиазм и творчество; название происходит от названия апельсина.
  color.pink:
    label: розовая
    summary: Светлый оттенок красного цвета, нежный и милый.
    info: Розовый – это светлая тональность красного цвета. Во многих культурах он ассоциируется с добротой, романтикой и игривостью.
  color.purple:
    label: фиолетовый
    summary: Загадочная вторичный цвет, полученный смешиванием красного и синего.
    info: Фиолетовый является вторичным цветом, возникающим при смешении красного и синего. Исторически он был самым дорогим цветом, связанным с королевской властью и роскошью.
  color.red:
    label: красный
    summary: Теплый первичный цвет крови и огня.
    info: Красный является одной из трёх основных световых цветов. Он вызывает ассоциации с энергией, страстью и опасностью; в многих культурах символизирует удачу и силу.
  color.white:
    label: белый
    summary: Самый светлый цвет, отражающий всё видимое излучение.
    info: Белый содержит все цвета видимого спектра одновременно. Он символизирует чистоту, невинность и новые начала; в многих культурах это цвет мира.
  color.yellow:
    label: желтый
    summary: Яркий теплый основной цвет солнца и золота.
    info: Жёлтый является первичным световым цветом и одной из самых ярких красок. Он символизирует радость, энергию и оптимизм, привлекая внимание.
