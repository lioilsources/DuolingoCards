lang: ru
pivot: false
title: Основные цвета
cards:
  color.amber:
    label: янтарная
    summary: Теплое оранжево-золотой оттенок подобен минералу янтру.
    info: Янтарный цвет - это тёплое золотисто-оранжевое окрашивание названный по минералу янтарь (каменная смола). Янтарь в древности высоко ценился как декорацый и духовной материал. Желтые сигналы светофоров символизируют осторожность во всем мире.
  color.aqua:
    label: аква
    summary: Яркий синезеленый как чистая вода.
    info: Аква - это ярко-сине-зелёный цвет; в HTML и CSS аква эквивалентна циану (#00FFFF). Название происходит от латинского слова 'аqua', что означает воду.
  color.azure:
    label: голубая
    summary: Ясный светлосиний цвет летнего неба.
    info: Азуровый синий цвет неба - яркий и живой оттенок голубого как летнее небо. Он получил своё название по минералу лазурит или азбурийский камень. Азоровый является частью гербов многих стран таких как Франция, Израиль и Финляндия.
  color.beige:
    label: бежевая
    summary: Светло песочный коричневый тон
    info: Бежевый - это светлая теплая цвет между белым и золотисто-коричневым. Он происходит от старофранцузского слова для описания природной волны волоса. Широко используется во внутреннем дизайне как теплое нейтральное основание.
  color.black:
    label: черная
    summary: Самый темный цвет, отсутствие света.
    info: Черный означает полное отсутствие видимого света. Символизирует элегантность, тайну и силу; в моде считается базовой универсальной окраской.
  color.blue:
    label: голубая
    summary: Холодный первичный цвет неба и океана.
    info: Голубой холодный первичный цвет света. Это самый популярный в мире цвет и символизирует спокойствие, доверие и глубину.
  color.bronze:
    label: бронзовый
    summary: Темный золотисто-каштановый металл как бронза.
    info: Бронзовый цвет - это тёмно-золотисто-коричневый металлический оттенок, напоминающий сплав меди и олова. Бронзовая эпоха (~3300–1200 до н.э.) получила своё название благодаря этому материалу.
  color.brown:
    label: коричневый
    summary: Землистая вторичная цветовая палитра древесины и почвы.
    info: Коричневый является вторичным цветом, полученным смешиванием красного, желтого и черного. Он символизирует землю, природу и стабильность; часто используется в темах, связанных с природой и осенью.
  color.burgundy:
    label: бордовая
    summary: Тёплый темнокрасновато-фиолетового цвета как красное вино из региона Бордо.
    info: Бордовый цвет - это тёмно-красный пурпурный оттенок с названием по винодельческому региону Бордо во Франции. Он ассоцируется со красным вином и роскошью. В моде бордовый является одной из самых популярных осенних расцветок.
  color.charcoal:
    label: антрацитовая
    summary: Очень тёмная серая краска подобна деревянной угля.
    info: Антрацитовый цвет - это очень темно серый оттенок почти черный как древесный уголь. Он популярен в современном интерьере как альтернатива чёрному.
  color.chartreuse:
    label: жёлтозелёная
    summary: Яркий живительный цвет между жёлтым и зелённым.
    info: Живописный цвет Желто-зеленый находится точно между желтым и зеленым в спектре. Название происходит от травяного ликера Chartreuse той же французской обители.
  color.cobalt:
    label: кобальтовое
    summary: Живописный средней темной синий как пигмент кобальта
    info: Кобальтовая синяя - это живой насыщенный оттенок голубого цвета названного в честь химического элемента кобальт (Со). Кобальтовый окрас был одним из самых популярных синих красителей для рисования XIX века и используется сегодня при производстве фарфоровой посуды стекла и декоративно-прикладного искусства Он также стал любимым цветом Винсента ван Гога
  color.copper:
    label: медный
    summary: Красно-бурый металлический оттенок как у меди.
    info: Медная - это красновато-коричневый цвет с металлическим блеском, напоминающий металл медь (латинское название Cuprum). Медь была одним из первых обрабатываемых людьми металлов в эпоху медного века или халколита.
  color.coral:
    label: коралловый
    summary: Живой красновато-розовый как у подводного корала
    info: Коралловый - это теплая живая цвет между оранжевым и розовым названный по морским кораллам.
  color.cream:
    label: кремовый
    summary: Очень светлая жёлтая белый как крем.
    info: Кремовая цвета - это очень светлое желто-белое оттенок. Название происходит от цвета свежего сливочного крема.
  color.crimson:
    label: кармин
    summary: Глубокая темно-красная.
    info: Карминовый - это глубокий и насыщенный красный цвет названный в честь кармина – красного пигмента для окраски тканей. Кармин был изготовлен из насекомого Dactylopius Coccis. Это также официальный университетский цвет Гарвардского Университета.
  color.cyan:
    label: голубая
    summary: Яркий зелено-синий цвет; одна из базовых красок для печати.
    info: Голубой цвет - это ярко выраженный сине-зеленый оттенок; в модели RGB он имеет значение Красный=0%, Зелёный=100% и Синий=100%. Это один из четырех основных цветов печати по технологии ЦМЖПК (С=G). В природе встречается как окрашивание мелководного тропического океана на свету днем.
  color.fuchsia:
    label: фуксий
    summary: Яркий пурпурно-розовый цвет подобен цвету фуксии.
    info: |-
      Фуксия - ярко-пурпурово розовый цвет названный в честь фиалки губчатой (латинское название – Fucsia). Растение получило своё имя от немецкого ботаника Леонарта Факсииа (1497–1566), который первым описал его.
      В CSS и HTML «фуксию» часто используют как синоним мадженты (# FF00FF)
      Это экстравагантный цвет ассоциирующийся со стилем модной одежды конца XX века.
  color.gold:
    label: золотая
    summary: Глубокий ярко-желтый оттенок подобный драгметаллу
    info: |-
      Золотой - это цвет драгоценного металла золото
      Он символизирует богатство, престиж и успех,
      a также используется в геральдике как один из двух основных металлов вместе с серебром.
  color.green:
    label: зеленый
    summary: Цвет травы и листьев, вторичный цвет из синего и желтого.
    info: Зеленый является вторичным цветом, полученным смешиванием синего и желтого. Он символизирует природу, свежесть и жизненную силу; глаз наиболее чувствителен к этому цвету среди всех.
  color.grey:
    label: серая
    summary: Цвет между чёрным и белым; цвет облаков и бетона.
    info: Серый является ахроматической цветом, созданным смешиванием белого и черного. Он считается нейтральным и неярким.
  color.indigo:
    label: инфидги
    summary: Тёмная модрофиловая окраска как индиго.
    info: Индиго - это глубокий синефиолетовый цвет названный по красителю индигоферы из растения Индиговера. В течение тысячелетий индиго был одним из самых ценных красителей и является одной из семи основных цветов радуги ROYGBIV – красный, оранжевый, желтый, зеленый, голубой, фиалково-синий или просто «индик», а затем пурпурно-розово-сирень. Современные представления об этом оттенке близки к темному синему.
  color.ivory:
    label: слоновая
    summary: Кремово-белая окраска как у бивня слона; теплее чисто белой.
    info: Слоновиновый - это тонко желтоватый кремово белого цвета. Название происходит от слона клык (ивори). Используется в моде и дизайне для описания кожи.
  color.khaki:
    label: хаки
    summary: Матовый светлозолотистокоричневый оттенок; военный полевой тон.
    info: Хаки – это приглушенный светло коричнево–желтый цвет, популяризированный британской армией в Индии XIX века.
  color.lavender:
    label: лавандовый
    summary: Очень мягкий фиалковый как у цветов лаванды.
    info: Лавандовый - это нежный светло фиолетового цвета по имени травы лаванда ( Lavendula ). Он вызывает ощущение спокойствия и чистоту а также пейзажи провансальской Франции.
  color.lime:
    label: лимонно-зеленая
    summary: Живой желтовато-зеленыЙ как у лемонов.
    info: Лаймовый цвет - яркий и насыщенный желто-зеленый оттенок названный в честь цитруса лиметта. Он более заметный чем зелень листвы; содержит больше жёлтого тонального акцента.
  color.magenta:
    label: Мадженский
    summary: Является ярким розово-фиалкового тона между красной и зеленой.
    info: Пурпурный цвет появился после битвы при Мадженте в Италии и является одним из основных цветов системы печатания CMJZ вместе с голубым, пурпурово-розовым магента, жёлтым и чёрным ключевыми тонами. Он не встречается ни на дуге радуги как отдельная спектральная линия, а возникает только тогда, когда глаз воспринимает сочетание красного света и фиолетового.
  color.maroon:
    label: каштановый
    summary: Темно коричневый красноватый оттенок
    info: Каштановая (марун) – это тёмно-коричнево-красный цвет названный по кешью или грецкому ореху в испанском языке как 'маррон'. Это популярная палитра моды и спортивных форм. В английском слово марон также используется для человека заброшенного на острове.
  color.mauve:
    label: лила
    summary: Приглушённая пурпурово-розовая; грязно-фиолетового тона.
    info: Лиловый цвет – это нежный и приглушённый пурпурно-розовый оттенок. Название происходит из французского языка («маув» означает слизевник или Malva sylvestris). Это был первый искусственный краситель (анилиновый лиловый), созданный Уильямом Перкинсом в 1856 году.
  color.mint:
    label: мятный
    summary: Очень мягкий зелёный как листья ментола.
    info: Мятный цвет - это свежий светло-зеленый оттенок названный в честь травы мята ( Mentha ). Он вызывает ассоциации с чистотой и охлаждением.
  color.navy:
    label: морская синева
    summary: Очень глухая синия подобна ночному океану.
    info: Морская синяя цвета (нави блю), также известная как темно-синий морской окраска - это очень тёмный оттенок голубого. Название происходит из униформы английского Королевского флота в XVIII веке.
  color.ochre:
    label: окром
    summary: Зеленоватая коричневатая естественная краска от природного минерала окур.
    info: Окрома представляет собой землистый желтовато-коричневого цвета пигмент окра или гидроксид железа. Это один из древнейших известных красителей и использовался первобытными людьми для росписи в пещерах.
  color.olive:
    label: оливковый
    summary: Матово жёлтозеленая краска как у олив.
    info: Оливковый цвет - приглушённо желто-зелёный оттенок названный в честь оливы (Olea europaea). Это классический военный и кемпинговый цвет благодаря маскировке на фоне естественной среды.
  color.orange:
    label: оранжевый
    summary: Тёплая вторичная цветовая смесь красного и жёлтого.
    info: Оранжевый — это вторичный цвет, полученный при смешивании красного и желтого. Он символизирует энтузиазм и творчество; название происходит от названия апельсина.
  color.periwinkle:
    label: периуинкаль
    summary: Светлый сиренево-синий как у периллы.
    info: Периуинкаль - это светло-голубовато-фиалковый цвет названный по имени цвета малого винкса (Vinca Minor). Он находится между голубым и лавандовым оттенками.
  color.pink:
    label: розовая
    summary: Светлый оттенок красного цвета, нежный и милый.
    info: Розовый – это светлая тональность красного цвета. Во многих культурах он ассоциируется с добротой, романтикой и игривостью.
  color.purple:
    label: фиолетовый
    summary: Загадочная вторичный цвет, полученный смешиванием красного и синего.
    info: Фиолетовый является вторичным цветом, возникающим при смешении красного и синего. Исторически он был самым дорогим цветом, связанным с королевской властью и роскошью.
  color.red:
    label: красный
    summary: Теплый первичный цвет крови и огня.
    info: Красный является одной из трёх основных световых цветов. Он вызывает ассоциации с энергией, страстью и опасностью; в многих культурах символизирует удачу и силу.
  color.rose:
    label: roze
    summary: Нежно-розовая окраска подобна лепестку розы.
    info: Розовый - это нежный розово-красный цвет, который получил своё название от цветка розы. Он отличается от светло-розового (pink), так как roze темнее и более красноватый по сравнению с последним.
  color.salmon:
    label: лососьевый
    summary: Светлое розовое оранжевое пятно на мясе рыбы
    info: |-
      Лососьевый - это мягкий розово-оранжевого цвета оттенок названный в честь мяса лосося
      Он теплее и светлей кораллового
      Часто используется как модная альтернатива мягкому розовому
  color.scarlet:
    label: шафранный
    summary: Ясный красновато-оранжевый цвет; чуть светлей карминового.
    info: Шарлотовый цвет - ярко красно-оранжевый оттенок названный в честь красителя шафран. Он немного светлее и более оранжевый по сравнению с кирпично-красным. В истории он обозначал роскошные ткани изготавливаемые на основе этого пигмента.
  color.sienna:
    label: сиенская глина
    summary: Красный оранжевый оксид железа как минерал.
    info: Сиенская бурая краска - это земляная коричнево-красноватая пигментированная краска названная в честь итальянского города Сьены.
  color.silver:
    label: серебряная
    summary: Блистающее серовато-металлическое
    info: '{"hint":"сияющая серая как металл серебро","info":"Серебристый - это металлический цвет, напоминающий драгоценный металл серебро\nОн символизирует современность, элегантность и технологический дизайн\nВ геральдике он является вторым металлом; на Олимпиадах означает второе место\nАвтомобиль с покрытием из светлого лака варьируется от популярности по странам"}'
  color.tan:
    label: песочный
    summary: Светло-коричневый цвет как у загорающей кожи.
    info: Песочный цвет получается при обработке кожи дубильными веществами и напоминает землю или загорелую кожу. Он близок к оттенку бежевого, но немного темнее и желтоватее.
  color.teal:
    label: голубой
    summary: Цвет моря с голубым отливом.
    info: Голубовато-зеленый цвет получил свое название от крыльев зелёной утки Anas crecka в этом же оттенке. Это верхняя часть спектра бирюзы и часто используется как контрастный к оранжевому на графических дизайнах.
  color.turquoise:
    label: туркуазовый
    summary: Яркий синезеленый как тропическое море.
    info: Цвет турquoise – ярко-сине-зелёный цвет названный в честь полудрагоценного камня тюркиса.
  color.vermillion:
    label: румяновый
    summary: Яркий красно-оранжевый как руменка.
    info: Румяловый цвет носит название минерала ртути или киноварь и представляет собой ярко выраженный красно-оранжевый оттенок пигмента вермильон. Это один из самых популярных в истории красный пигментов; он используется для создания лака на Китае, храмовых построек Японии а также православной иконографий.
  color.violet:
    label: фиолетовая
    summary: Светло-сине-фиолетовый цвет у конца светового спектра.
    info: 'Фиолетовый цвет находится на конце видимого спектра с длиной волны около 380–420 нм и получил своё название от растения фиалка (латинское *Violaceus*). В восприятии он отличается от пурпурного: фиолетовый ближе к голубому, а пурпуровый расположен между красным и синим. Ранее фиолетовые окраски были очень ценными из-за своей дороговизны, поэтому только правители могли позволить себе одеваться в такую ткань.'
  color.white:
    label: белый
    summary: Самый светлый цвет, отражающий всё видимое излучение.
    info: Белый содержит все цвета видимого спектра одновременно. Он символизирует чистоту, невинность и новые начала; в многих культурах это цвет мира.
  color.yellow:
    label: желтый
    summary: Яркий теплый основной цвет солнца и золота.
    info: Жёлтый является первичным световым цветом и одной из самых ярких красок. Он символизирует радость, энергию и оптимизм, привлекая внимание.
