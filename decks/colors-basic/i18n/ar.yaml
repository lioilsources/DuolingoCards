lang: ar
pivot: false
title: الألوان الأساسية
cards:
  color.amber:
    label: أحمر جنتاري
    summary: لون أخضر فاقع مشابه لمعدن الجنتار.
    info: الجنتاروفا هي لون ذهبي برتقالي دافئ يحمل اسم الحجر الجيري، وهو معدن طيني تصلب من الصمغ النباتي. كان الناس في العصور القديمة يعتبرون هذا المعدن قيمًا كمادة زخرفية وروحانية. إن ضوء الإشارة الأصفر على إشارات المرور هو رمز عالمي للحذر.
  color.aqua:
    label: '"أكوا"'
    summary: '"لّونه فاتح وأخضر زاهي كما لو كان طاهرًا ومائيًّا"'
    info: '{"hint":"لون أزرق مخضر براق؛ لون الماء السماوي","info":"أكوا هو اللون الأخضر الأزرق الفاتح مثل نقاء المياه النظيفة؛ في html وcss، يُعتبر ''akwa'' و''saynan'' مرادفين للرمز #00ffff\nالاسم مشتق من اللغة الإيطالية حيث تعني akua الماء\نإنه يستحضر صورة البحار الاستوائية والمسابح والمظهر العصري المنعش\نإنها تستخدم بكثرة في التصميم الجرافيكي كצבע متضاد لمختلف التطبيقات الحديثة."'
  color.azure:
    label: أزرق سماوي
    summary: لون أزرق نقي ومتوهج كالسماء صيفًا.
    info: الأزرق السماوي هو لون مشرق ونقي يشبه سماء الصيف؛ وهو اسمه نسبة إلى المعادن الزرقاء مثل اللافيريت أو حجر اللازورد. كما أنه جزء من شعارات العديد من الدول، بما في ذلك فرنسا وإسرائيل والفنلندية. كان استخدام هذا اللون خلال عصر النهضة أغلى من الذهب وكان يستخدم لتزيين كسوة المريم.
  color.beige:
    label: بَيْج
    summary: لون بني رملي فاتح؛ اللون المحايد الدافئ.
    info: اللون البِيج هو لون فاتح دافئ يقع بين الأبيض والبني الذهبي، ويرجع أصله إلى كلمة باللغة الفرنسية القديمة تعني الموجة الطبيعية. يستخدم بكثرة في تصميم الإطلالات الداخلية كأساس محايد دافئ.
  color.black:
    label: أسود
    summary: اللون الأسود، أدق لون، غياب الضوء.
    info: الأزرق هو انعدام كل ضوء مرئي. يرمز إلى الفخامة والسرية والقوة؛ في الموضة يعتبر اللون الأساسي العالمي.
  color.blue:
    label: زرقاء
    summary: لون أساسي بارد للسماء والمحيط.
    info: اللون الأزرق هو لون بارد واسع الانتشار في الضوء. وهو أكثر ألوان العالم إثارةً للمحبة، ويمثل هدوءًا وتواضعًا وعمقًا.
  color.bronze:
    label: برونزية
    summary: لون فلزي أصفر غامض مثل المعادن البرونزية.
    info: اللون البرونزي هو لون معدني برتقالي داكن يشبه سبيكة النحاس والقصدير، ويُستخدم في تمثيل العصر البرونزي الذي امتد من حوالي عامي ٣٠٠٠ إلى ١٢٠٠ قبل الميلاد. كما أن اللون البرونزي يستخدم كرمز للمركز الثالث في الألعاب الأولمبية عبر صدور الوسام البرونزي.
  color.brown:
    label: البني
    summary: لون ثانوي يمثل الأرض والطبيعة والاستقرار.
    info: يُنتج اللون البني عن مزج الأحمر والأصفر والأسود، وهو لون أرضي وثاني ويستخدم بكثرة في المواضيع الطبيعية وخاصةً تلك المتعلقة بالخريف. كما أنه يرمز إلى الطبيعة والاستقرار.
  color.burgundy:
    label: бургундская
    summary: لون نبيذي غامق ك النبيذ الأحمر من برغندي.
    info: بورغوندي هي لون أحمر بورجوندي داكن بنفسجي يحمل اسم منطقة التصنيع الزراعي للنبيذ 'بُرْجِنْدَسْ' ('bourgogne') في فرنسا، وهو اللون الذي يتذكرنا بالنبيذ الأحمر والرفاهية والأثرة. كما أنه أحد أكثر ألوان الخريف رواجاً في الموضة ويتداخل بشكل جيد مع الذهب البشاق وبهجة البحر.
  color.charcoal:
    label: أنتراستي
    summary: لون رمادٍ غامض مثل الخشبة المحروسة.
    info: الأنتراسيت هي لون رمادي داكن جدًا، تشبه اللون الأسود تقريبًا وتشبه أيضًا خشب الكوكس المُحروق. إنها شائعة في التصميم الداخلي الحديث كخيار بديل للأسود. كما أنها تعتبر لون محايد أساسي مناسب للأزياء الرسمية؛ فقميص أو بدلة أنثراكيتيّة تعطي انطباعًا أكثر أناقةً مما لو كانت سوداء.
  color.chartreuse:
    label: _chartreuse_
    summary: اللون الأزرق والأحمر.
    info: _chartreuse_ (اللون الأصفر الأخضر الحيوي هو لون حيوي يقع بالضبط بين اللونين الأسود والأخضر في الطيف، واسمها مشتق من شراب النباتات المُسمى _chartreuse_ الذي أنتجته دير فرنسي بنفس الاسم. وهو أحد أكثر الألوان مرئية للعين البشرية.
  color.cobalt:
    label: كوبلت
    summary: لون زهري متوسط الظلام مثل بودرة كوابل.
    info: كوبالت الأزرق هي لون أزرق نابض بالحياة وغني يحمل اسم العنصر الكيميائي كوبالتوس (CO). كانت هذه الصبغة الزرقاء واحدة من أكثر صبغاً شعبية في رسم القرن التاسع عشر، وتُستخدم اليوم في السيراميك والزجاج والنحت الفنّي. وكانت اللون المفضل لدي فنسنت فان جوخ.
  color.copper:
    label: مُعَطِّرٌ بالنِّحَا س
    summary: لون ناعم بلمسة ذهبية مثل معدن النحاس.
    info: النحاسية هي لون بني أحمر يعكس معدناً هو النحاس، وهو أحد أول المعادن التي استخدمها البشر في العصر البرتقالاوي أو عصر ما قبل الحديد والنحاسي. تتحول الأسطح المصنوعة من النحاس إلى اللون الأخضر مع مرور الوقت بسبب التأكسد؛ واللون الأخضر للنحاس يكون أزرق فاتحاً.
  color.coral:
    label: لون المرجان
    summary: لون حيوي برتقالي رزيع مثل مرجل البحر.
    info: الوردي هو لون دافئ وحيوي يقع بين اللون البرتقالي والرزي فاتح ويحمل اسم المرجان البحري، وهو شائع جدًا في الموضة الصيفية وتخطيط الأثاث الداخلي. أعلنت شركة Pantone أنه سيكون لون العام عام ٢٠١٩ تحت عنوان 'Living Coral'. كما أن هذا اللون يتماشى بشكل ممتاز مع الأخضر الزمردي والأبيض والنيلي.
  color.cream:
    label: كريمية
    summary: درجة بيضاء وفاتحة جدا مثل زبدة.
    info: لون الكريم هو درجة فاتحة جدًا من الأصفر والأبيض، ويأتي اسمه من لون الزبدة الطازجة أو الكريمة بالإنجليزية. يستخدم في تصميم المباني الداخلية كخيار أكثر دفءً مقارنة بالأزرق النقي. يقع على سلم اللوان بين البيض والكستناء.
  color.crimson:
    label: كرميزوني
    summary: لون أحمر غامق؛ أغمق من السراليت.
    info: الكيرمزيون هي لون أحمر عميق وحيوي يُسمى باسم الكارمين، وهو بигمنت أحمر للرسمة. كان يتم إنتاجه تقليديًا من حشرات النopal (دكتيلوبوس كوكس). كما أنه اللون الرسمي لكلية هارفارد (هايفورد كريمسن)، وفي علم الأعلام تشير إلى اللون الأسود.
  color.cyan:
    label: أزرق سماقي
    summary: لون مُنعش بلّور وأخضر؛ واحد من أربعة ألوان أساسية في الطباعة.
    info: 'الأزرق السماوي هو لون أخضر زهري نابض بالحياة؛ في النموذج الأحمر والأخضر والأزرق، يبلغ حجمه ر: صفر، ج: ٢٥٥، ب: ٢٥٥. وهو أحد اللواحق الأساسية الأربع للطباعة بالألوان المكملة (سي أي أم كي)، حيث ترمز السي إلى الأزرق السماقي. كما أنه موجود بشكل طبيعي على هيئة لون البحر الاستوائي الضحل خلال الأيام الصافية.'
  color.fuchsia:
    label: فوشي
    summary: لون وردِّي بَرْتقالي حيوي مشابه لتلوث الزهرة.
    info: "اللون الوردي الفوشي هو لون وردي برتقالي نشيط يحمل اسمه من زهرة فوشيا.\n تُسمى النبتة باسم عالم الأحياء الألماني ليونهارت فوكسوس (١٥٠١–١٥٦٦). \n في أكواد التصميم واللغات البرمجية مثل سي إس أس، يمكن استخدام مصطلح 'ماغنطة' كمرادف للون الوردي الفوشي (# FF00FF)، وهو ما يجعل هذا اللون رمزًا جذاباً للموضة والعقد الثمانينيات искусان البوب."
  color.gold:
    label: ذهبي
    summary: أحمر داكن لامع كالذهب
    info: '{"gold": "اللون الذهبي يرمز إلى المعدن الثمين الذهب\nيرمز اللون الأصفر الداكن واللمعان مثل معدن الذهب، ويستخدم في الرموز كتعبير عن الغنى والعظمة والنفوذ والأناقة\nفي علم الترميزات هو أحد المعادن المستخدمة مباشرةً في شعار العائلة المالكة (ذهب وفضّي)، كما أن الميدالية الذهبية تعبِّر عن أفضل نتيجة أو أداء رفيع المستوى"}'
  color.green:
    label: الأخضر
    summary: لون العشب والأوراق، لون ثانوي من الأزرق والأسفيري.
    info: الأخضر هو لون ثانوي ينتج عن مزج اللونين الأزرق والأصفر. يرمز إلى الطبيعة والحياة والنضارة؛ فالعين تدركه بحساسية أكبر من أي لون آخر.
  color.grey:
    label: رَمْضِي
    summary: لون بين الأسود والأبيض؛ وهو لون السحب والإسمنت.
    info: الرمادي هو لون غير ملون ينتج عن خلط الأسود والأبيض، ويُعتبر اللون الحياد والغير عدوانية. في علم النفس فإنه رمز للحيادية والتوازن أحيانًا وفقدان الإشارة إلى أي طابع معين.
  color.indigo:
    label: أنديغو
    summary: درجة زرقاء داكنة بنفاثيّ كصبغة الأنديغو.
    info: اللون الأندجوي هو لون أزرق بنفسجي عميق يُسمى باسم الصبغة أنديجو المستمدة من نبات الاندغوفيرا، وهي واحدة من أكثر صباغات اللوحة تكلفة على مدى آلاف السنين. كما أنه أحد الستة والأربعين درجة في قوس القزحية (الأحمر والبرتقالي والأصفر والنيلي والأزرق وأنديغو البنفسجي). وفي الفهم الحديث فإن اللون الأندجوي قريب جداً من الزرقاء الداكن.
  color.ivory:
    label: أبيض كريم
    summary: لون أبيض مائل إلى الكريمة مثل لون أنفاس الفيل؛ أكثر دفئًا من البياض النقي.
    info: اللون الأبيض الكريمي هو لون أبيض مع قليل من الذهبي الدافئ، ويُشبه اللون الذي يظهر في أنياب الفيلة. يستخدم هذا المصطلح بشكل شائع في الموضة والتصميم ووصف البشرة.
  color.khaki:
    label: كاكي
    summary: لون غموضي أشبه بالبني الفاتح المائل إلى الصفار؛ هو درجة عسكرية للتضاريس.
    info: |-
      كاهكي هي لون بني فاتح مائل للصفرة خفيف يتميز به الجيش البريطاني في الهند خلال القرن التاسع عشر
      الكلمة تأتي من اللغة الأوردية أو الهنديّة، حيث تعني 'خاك' الغبار والطين
      وهو اللون الأساسي لأزياء الجيوش وملابس السير على الأقدام
  color.lavender:
    label: ليلكي
    summary: لون أرجواني خفيف جدًّا مثل بتلات الزهرة.
    info: لون البنفسج الفاتح المسمى باسم نبات اللافندر، وهو يمثل هدوءًا ونظافة ويُذكر بالمناظر الطبيعية لبرونويسال في فرنسا. ترتبط رائحة الليلك بعلاج العطور بالإسترخاء والنوم الجيد. كما أنه شائع الاستخدام في تصميم غرف الأطفال وفي التصميم الداخلي للمنتجعات.
  color.lime:
    label: لّون لِمَوْنِي
    summary: لون زهري حاد مثل قشر الثمار الحمضية.
    info: اللون الليموني هو لون أخضر كثيف يحمل اسم ثمرة الليمو، وهو نسخة أكثر وضوحًا من اللون الأخضر الطبيعي للنباتات؛ حيث يتكون بشكل أساسي من تدرج أحمر وأصفر مكثف. يستخدم بكثرة في التصميم الجرافيكي بصفته لوناً جذاباً ومُحفيزاً للأفعال.
  color.magenta:
    label: ماجينتا
    summary: لون برتقالي فاتر إلى الوردي؛ بين أحمر وأخضر.
    info: |-
      اللون الماجنتا هو لون مكثف يقع بين اللون الأحمر والأزرق ولا يوجد له طول موجي مقابل في الطيف المرئي.
      اسمها مشتق من معركة ماجента التي وقعت عام ١٨٥٩م بإيطاليا، وهو أحد ألوان الطباعة الأساسية في نظام CYMK (أيشن - ماجينتا - صفراء - أسود).
      لا يمكن العثور عليه قوس القزحية؛ حيث يتم تكوينه عندما يتخلط الدماغ بين اللون الأحمر والأخضر.
  color.maroon:
    label: كاشتنوفي
    summary: لون أرجواني غامق؛ حمرة عميقة.
    info: الكستنوي هو لون بني داكن أحمر يحمل اسمه من كلمة ماررون في اللغة الإسبانية، وهو شائع الاستخدام في الموضة وزيّات الرياضية والعسكرية. كما تُستخدم الكلمة 'ماروون' باللغة الإنكليزية أيضًا للإشارة إلى شخص محروج على جزر نائية.
  color.mauve:
    label: بنفسج
    summary: لون بنفسجي فاتح؛ بلسم رملي.
    info: اللون البنفسجي (مايفو) هو لون وردي بني绛، خفيف ومائل إلى البلاط الأرجواني. يعود اسمه إلى اللغة الفرنسية حيث تعني مايفو النبات المعروف باسم Sléزوفنيك أو Malva سيلفيستريس. كما أنه أول صبغة تم إنتاجها بشكل اصطناعي وهي الصباغ الأنثرازيني الذي أكتشفه ويليام باركين في عام ١٨٥٦.
  color.mint:
    label: ماتو
    summary: لون أخضر فاتح كأغصان العطر.
    info: ماتو هو لون أخضر فاتح ناضج يحمل اسم عشبة النعناع (منثا). وهو مرتبط بالنظافة، والرطوبة، والتبريد. كما أنه لون شائع في التصميم الداخلي الحديث وفي الجماليات الرетرو (عشرينيات الخمسينيات)، وغالبًا ما تُربط به الصور مثل المثلجات أو الشاي بالنعناع.
  color.navy:
    label: أزرق نافي
    summary: لون زهري غني كالأعماق البحيرة ليلا.
    info: نافى أزرق هي لون برتقالية داكنة جدًا، يشبه اللون الأزرق الداكن للبحر في الليل. اسمها مشتق من زي موحدات البحر الملكي البريطاني منذ القرن الثامن عشر وهي واحدة من أكثر الوان الأساس شعبيةً في الموضة والملابس الرسمية وتنسجم بشكلٍ كبير مع البيضاء والأوفواو الذهب.
  color.ochre:
    label: أوكري
    summary: صورة اللون البني المحمرة المستخلصة من الصباغ الطبيعي 'الأكر'.
    info: اللون الأوكري هو لون بني محمر يحمل اسم صبغة أوكر، وهي هيدروكسيد حديدي طبيعي تُستخدم كمصدر للرسم بالألوان الطبيعية منذ العصور القديمة جداً؛ حيث استخدمه البشر البدائي في الرسم على الجدران داخل الكهوف. كما أنه موجود طبيعاً بصخور مغطاة بالأتربة.
  color.olive:
    label: أوليف
    summary: لون أحمر برتقالي فاتح مثل حبة زيتونة.
    info: |-
      اللون الأ Oliv هو لون أخضر باهت يحمل اسم شجرة الزيتون ( Olea europaea ).
      it is a classic military وcamping color due to its ability to blend well in natural environments.
      in fashion it's traditionally associated with army أو styles,
      and pairs nicely مع beige، brown، ochre.
  color.orange:
    label: البرتقالي
    summary: لون ثانوي دافئ ناتج عن مزج اللون الأحمر واللون الأصفر.
    info: يُنتج اللون البرتقالي من خلط اللونين الأحمر والأصفر، وهو لون ثانوي يرمز إلى الحماس والإبداع؛ ويحمل اسمه من ثمرة البرتقال.
  color.periwinkle:
    label: أزرق برتقال
    summary: لون أحمر بنفسجى فاتح مثل زهرة البرتيكين.
    info: برتقالي أزرق فاتح يحمل اسمه من زهرة اللفت الصغير، وهو لون بين الأزرق الفاتح والبنفسجي المهدب ويستخدم بكثرة في عالم الموضة والنقوش الداخلية كلون رقيق ورومانسي.
  color.pink:
    label: رُزَوْفَا
    summary: لون وردِي فاتح، لون ناعم وجذاب.
    info: الوردي هو درجة فاتحة من اللون الأحمر. في العديد من الثقافات، يرتبط باللطف والرومانسية واللعب.
  color.purple:
    label: بنفسجية
    summary: لون غامض ثانوي ناتج عن مزج اللون الأحمر والأزرق.
    info: البنفسجي هو لون ثانوي ينتج عن خلط الأحمر والأزرق. تاريخياً كان أحد أغلى الألوان، مرتبطاً بالسلطة الملكية والرفاهية.
  color.red:
    label: الحمراء
    summary: لون أساسي دافئ يمثل لون الدم والنار.
    info: الأحمر هو أحد الألوان الأساسية الثلاثة للضوء. فهو يثير مشاعر الطاقة والشغف والمُخاطرة؛ وفي العديد من الثقافات، فإنه يرمز إلى الحظ والسِّلَمة.
  color.rose:
    label: rosy
    summary: درجة فاقسة من أحمر برتقالي مشابهة بلون بتلات الزهرة
    info: '{"hint":"أحمر وردي ناعم مثل لون بتلة الوردة","info":"اللون روز هو درجة خفيفة من اللون الأرجواني المائل إلى الحمرة، ويُسمى بهذا الإسم نسبةً للزهرة التي تعرف بالورد\nويختلف عن الرزيفايت(Pink)، حيث أن اللون ''روزي'' أغمق وأقرب للأحمرية\nكما قال سامويل بيكتش في أحد أقواله:''ليس هناك أي لون طبيعي أكثر طبيعية للمجسات منه لون الروزا ''\ن كما يظهر هذا اللون أيضًا كرمزٍ شعري في علم الترميز المعروف باسم ''роза геральдическая'' أو مايطلق عليه اسم زهرة الشعار ضمن علامة ملك إنجلترا"}'
  color.salmon:
    label: السلموني
    summary: لون أصفر روزاوي مثل لحم سمكة السلمون.
    info: لون السلمون هو لون وردي برتقالي فاتح يحمل اسمه من اللحم الوردي البرتقالي للسمك السالمون، وهو أكثر دفئًا وإشراقاً مقارنة باللؤلؤي الأرجواني. يستخدم بكثرة في عالم الموضة كخيار ناعم عن البني الجذاب.
  color.scarlet:
    label: شارلاتي
    summary: لون أحمر برتقالي مشرق؛ أكثر إشراقًا من كرمزي.
    info: اللون الوردي هو لون أحمر برتقالي فاتح يحمل اسم صبغة الشارلوك. وهو أفتح قليلاً وأكثر احتوائه على اللون البرتقالي من الكايرمين، وتمثّله في التاريخ الأنسجة الحمراء الفاخرة.
  color.sienna:
    label: سيانسكا حنئة
    summary: حنئة فحمية كيميائية باسم سيانا.
    info: السِّينَوْتَا هُيَة لون أرضي بني أحمر يحمل اسم مدينة سينا الإيطالية. السِّينَوة الخام هي بنية صفراء، بينما السِّينَوة المحروقة تميل إلى اللون البوردي. إنها لون شائع في رسامات النهضة ولون دافئ من الأرض الطبيعية.
  color.silver:
    label: '{"label": "فضّي"}'
    summary: '{"summary": "لون شاحب بلون فلز الفضة."}'
    info: '{"info":"اللون الفضي هو لون معدني يعكس المعادن الثمينة فضة\nيرمز إلى العصرية والأناقة والتكنولوجيا والتصميم الصناعي\nفي علم الأعلام، فهو المعدن الثاني؛ وفي الأولمبيادات فإنه رمز للمرتبة الثانية\nسيارة ذات طلاء فضي هي أكثر ألوان السيارات شيوعاً في العديد من الدول"}'
  color.tan:
    label: بونيتو
    summary: درجة بلورية فاتحة تشبه لون البشرة المصابة بالشمس
    info: |-
      اللون البني الفاتح يشبه لون الأرض أو الجلد المُصاب بالشمس
      يأتي الاسم من معالجة جلود الحيوانات باستخدام التريسلة لتليينها وجعلها أكثر مرونة، وهو ما يعرف بعملية 'تَنْجِينغ' في اللغة الإنجليزية
      هو أقرب إلى اللون البيج لكنه أغمق قليلًا وأكثر احتوائه على درجة بنية صفراء
  color.teal:
    label: '#008080'
    summary: أزرق بمسحة خضروية مثل لون البحر.
    info: اللون الأزرق الأخضر هو لون سمّيت به كراكيات النهر، حيث أجنحتها بهذا الظلال. وهو أحد درجات اللون الممتد في طيف الزمرد العلوي. يُستخدم بكثرة في التصميم الجرافيكي باعتباره لونًا متناقضًا مع البرتقالي.
  color.turquoise:
    label: تيركونسي
    summary: أزرق مخضر مثل المياه الاستوائية.
    info: لون التيركوز هو لون أزرق مخضر نابض بالحياة يحمل اسمه من الحجر شبه الكريم تيركونس، وكان هذا النوع من الأحجار يتمتع بقيمة في مصر القديمة وبيروثيا وأمريكا. كما أنه اللون الذي يبدو عليه البحر المداري أو الجليد البحري أو السماء الصافية خلال النهار المشمس.
  color.vermillion:
    label: رملية
    summary: لون رملي أحمر برتقالي ناري.
    info: الحمرة هي لون أحمر برتقالي حيوي يحمل اسم المعادن الحمرا أو كبريتيد الزئبق، وهي واحدة من أكثر ألوان الأحمر استخدامًا في التاريخ. تُستخدم هذه المعدنية السامة سابقًا بكثرة؛ اليوم يتم تصنيعها اصطناعياً. كما أنها اللون النموذجي للطلاء الصيني والمعابد اليابانية والأيقونات الراشديّة.
  color.violet:
    label: الأرجواني
    summary: لون بنفسجي - أزرق يوجد في طرف الطيف المرئي.
    info: البنفسجي هو لون يقع في نهاية الطيف المرئي بطول موجة يتراوح بين حوالي 380 و420 نانومترًا، ويُسمى على اسم زهرة البنفسج (فيولا). وفي علم الألوان فإنه مختلف عن اللون الوردي؛ فاللون البنفسجي أقرب إلى الزرقاء بينما يكون اللون الوردي بين أحمر وزهري.
  color.white:
    label: بيضاء
    summary: اللون الأبيض، أضواء كل الضوء المرئي.
    info: تحتوي اللون الأبيض على جميع ألوان الطيف المرئي في آن واحد. ترمز إلى النقاء والبراءة والنهايات الجديدة؛ وفي العديد من الثقافات هو لون السلام.
  color.yellow:
    label: اللون الأصفر
    summary: لون دافئ وواضح يمثل اللون الأساسي للشمس والذهب.
    info: الأصفر هو لون أساسي للضوء وأحد أكثر الألوان إشراقًا. يرمز إلى السعادة والطاقة والأمل؛ كما أنه جيد في جذب الانتباه.
