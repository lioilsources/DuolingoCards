lang: ar
pivot: false
title: الألوان الأساسية
cards:
  color.black:
    label: أسود
    summary: اللون الأسود، أدق لون، غياب الضوء.
    info: الأزرق هو انعدام كل ضوء مرئي. يرمز إلى الفخامة والسرية والقوة؛ في الموضة يعتبر اللون الأساسي العالمي.
  color.blue:
    label: زرقاء
    summary: لون أساسي بارد للسماء والمحيط.
    info: اللون الأزرق هو لون بارد واسع الانتشار في الضوء. وهو أكثر ألوان العالم إثارةً للمحبة، ويمثل هدوءًا وتواضعًا وعمقًا.
  color.brown:
    label: البني
    summary: لون ثانوي يمثل الأرض والطبيعة والاستقرار.
    info: يُنتج اللون البني عن مزج الأحمر والأصفر والأسود، وهو لون أرضي وثاني ويستخدم بكثرة في المواضيع الطبيعية وخاصةً تلك المتعلقة بالخريف. كما أنه يرمز إلى الطبيعة والاستقرار.
  color.green:
    label: الأخضر
    summary: لون العشب والأوراق، لون ثانوي من الأزرق والأسفيري.
    info: الأخضر هو لون ثانوي ينتج عن مزج اللونين الأزرق والأصفر. يرمز إلى الطبيعة والحياة والنضارة؛ فالعين تدركه بحساسية أكبر من أي لون آخر.
  color.orange:
    label: البرتقالي
    summary: لون ثانوي دافئ ناتج عن مزج اللون الأحمر واللون الأصفر.
    info: يُنتج اللون البرتقالي من خلط اللونين الأحمر والأصفر، وهو لون ثانوي يرمز إلى الحماس والإبداع؛ ويحمل اسمه من ثمرة البرتقال.
  color.pink:
    label: رُزَوْفَا
    summary: لون وردِي فاتح، لون ناعم وجذاب.
    info: الوردي هو درجة فاتحة من اللون الأحمر. في العديد من الثقافات، يرتبط باللطف والرومانسية واللعب.
  color.purple:
    label: بنفسجية
    summary: لون غامض ثانوي ناتج عن مزج اللون الأحمر والأزرق.
    info: البنفسجي هو لون ثانوي ينتج عن خلط الأحمر والأزرق. تاريخياً كان أحد أغلى الألوان، مرتبطاً بالسلطة الملكية والرفاهية.
  color.red:
    label: الحمراء
    summary: لون أساسي دافئ يمثل لون الدم والنار.
    info: الأحمر هو أحد الألوان الأساسية الثلاثة للضوء. فهو يثير مشاعر الطاقة والشغف والمُخاطرة؛ وفي العديد من الثقافات، فإنه يرمز إلى الحظ والسِّلَمة.
  color.white:
    label: بيضاء
    summary: اللون الأبيض، أضواء كل الضوء المرئي.
    info: تحتوي اللون الأبيض على جميع ألوان الطيف المرئي في آن واحد. ترمز إلى النقاء والبراءة والنهايات الجديدة؛ وفي العديد من الثقافات هو لون السلام.
  color.yellow:
    label: اللون الأصفر
    summary: لون دافئ وواضح يمثل اللون الأساسي للشمس والذهب.
    info: الأصفر هو لون أساسي للضوء وأحد أكثر الألوان إشراقًا. يرمز إلى السعادة والطاقة والأمل؛ كما أنه جيد في جذب الانتباه.
