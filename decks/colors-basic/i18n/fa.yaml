lang: fa
pivot: false
title: رنگ های اصلی
cards:
  color.amber:
    label: جانترو
    summary: رنگ جانترو شباهت دارد به ذوب شدن طلا
    info: |-
      جنتارو به رنگ طلایی نارنجی است که از معادن جتامر، شمع سنگ قرارداده می‌شود
      در دوران باستان، جاتمر به عنوان مواد دکوراسیون و معنوی در مقابله با خدا تقدیر بسزا حاصل کرد
      چشم انداز سبز روشن زرد برای علامت فراموشی همراه با وجود آتش منفرد است
  color.aqua:
    label: آква
    summary: رنگی جذاب با ترکیب فراموشنشدنی برای شبیه سازی پالتو طبیعی.
    info: آکوا رنگی روشن و سبز آسمانی است؛ در اچ‌تِل و سی‌اس‌اُس، واژه‌های «آکو» و «سین» معادله هستند (#00FFFF). نامش به زبان لاتین مربوط می شود که Aqua=آب بدان خوانده میشد.
  color.azure:
    label: آزر
    summary: رنگ سماوی تابستان
    info: آبی آzure، رنگ روشن و زنده ابرهاست؛ نامش براساس سنگ لازورد می‌باشد. در پرچم کشورهای مختلف مثل فرانسه،اسرائیل وفنزدل به کاررفته است.
  color.beige:
    label: بژ
    summary: قهوه‌ای شامه؛ رنگ خنثی داغ
    info: بژ رنگی روشن و داغ بین سفید و قهوه‌ای طلائی است، از واژه فرانسوی قدیم برای موج طبیعی نشأت گرفته است. در طراحی داخلی به عنوان پایهٔ خنثی داغ کاربرد زیادی دارد.
  color.black:
    label: سبز
    summary: رنگ سفیدترین رنگ، حضور تمام طيف.
    info: سیاه به معنای عدم وجود هرگونه نور قابل روئیت است و در مد، رنگ پاپولار اساسی تلقی می‌شود.
  color.blue:
    label: آبی
    summary: رنگ سرد اصلی آسمان و دریاست.
    info: آبی رنگ سرد اولیه نور است و محبوب‌ترین رنگ جهان به شمار میرود که آرامش، دوستداشت و عمق را نمادار میکند.
  color.bronze:
    label: برنز
    summary: نمونه دوم در المپیک با مدال طلا بود.
    info: رنگ فلزی تیره زرد قهوه‌ای است که ادغام مس و سرب را به خاطر آورده، دوران برنجی نیز براساس وجود این فلز نامگذاری شده است.
  color.brown:
    label: ناتو
    summary: رنگ ثانویهٔ شبیه خاک برای چوب و مواد طبیعی.
    info: ناتویه از ترکیب قرمز، زرد و سیاه به وجود می‌آید؛ نماد خاک، طبیعت و پایداری است که در موضوعات طبیعی و فصل پائیزو بسیار رواج دارد.
  color.burgundy:
    label: бургундська
    summary: رنگ عمیقاً قرمز مثل شراب بورگند.
    info: بورگوندی رنگ تیره‌ای قرمز و بنفش است که نامش از منطقۀ محبوب سازندهٔ شراب بورگند در فرانسه آمده است، به خاطر شباهت با انواع مختلف شربات مرمری عمق دارد. این رنگ حس لوکس و ثروت را منتقل می‌کند؛ همواره جزو پرتقاضانترین رنگ‌های زمستان برای مد طراحان لباس است.
  color.charcoal:
    label: anthracite
    summary: رنگ سبز روشن مثل زغال
    info: انتراسیتی به معنای سفیدگونه‌ای بسیار تیره، شبیه دودکرده است و در طراحی داخلی مدرن به عنوان جایگزین مناسب برای مشکی شناخته میشود. همچنین این رنگ نمونه‌ای خوب از رنگ پاپوش باشد که قابلیت فرموله کردن آراسته وجود دارد.
  color.chartreuse:
    label: سبز روشن
    summary: رنگ حاد بین زرد و سبز
    info: |-
      چارتوروز (زرد سبز رنگ) زرد و سبز در طیف است که بین آن دو قرار می‌گیرد
      این نام از شراب ترشحی به همراه لکر، با منشأ فرانسوی مشابه معبد «chartreuse» برداشت می‌شود
      در مقایسه با رندها، چارترس جزو پرتعدادترین رندهاست که چشم انسان قادر به تشخیص آن است
  color.cobalt:
    label: آسماني كوبالتي
    summary: سبك فرحمند و تاري مشابه پاست الكوبالي.
    info: نفود کبالتی آسمانی رنگ تند و زنده ای است به نام عنصر شیمایی کبالت (کو). در قرن نوزدم میلادی، پاست الکبالت بسیار معروف بین نقاش ها بوده است. از این رنگ برای سرامیک، شيشه و هنر تصويري استفاده مى‌شود.
  color.copper:
    label: مس
    summary: رنگ فلزی قهوه‌ای قرمز مثل فلز مس.
    info: سربسته قرمزی رنگ فلز مس است که به عنوان Cu نشان داده می‌شود و اولین فلزاتی هستند که توسط بشر پرداخت شد، در دوران سرباز سنگ (چالکولیت). سقف‌های قدیمی با عامل موافق زرد می‌شوید؛ سبز سربسته آسمانی است.
  color.coral:
    label: کورال
    summary: زنده، قرمز فروزانی-نارنجی مثل مرجان دریائی.
    info: کورالویا، رنگ داغ و زندان‌آموز بین نارنجی و صدفی است که از مرجان دریایی به اسمش پرداخته شده است. این رنگ در مد تابستانی و طراحی داخلی ساختمان خیلی معروف است. بنچوارت آن را با عنوان لِونگ کُراَل به عنوان «رنگ سال» ۲۰۱۹ اعلام کرد. این رنگ بهتر هماهنگی با رنگ تیرکسوب، سفید و طلا دارد.
  color.cream:
    label: رنگ کره
    summary: بصورت زرد فاتح مثل سمتان.
    info: نام رنگ کره ای به دلیل شباهت با رنگ سرکه تازه استفاده می شود، و در طراحی داخلی به عنوان جایگزین گرمتر برای سفید خالص نسبتاً بسیار روشن است.
  color.crimson:
    label: قرمز کارمین
    summary: رنگ قرمز غلیظ؛ تیرهتر از رنگ سرش.
    info: قرمز کارمینی رنگ قرمز عمیق و زنده‌ای است به نام پودر رنگدانهٔ سرخ با همان اسم، کرمین. از قدیم برای تولید آن از حشرات دکتیلوپوس کوچس استفاده می‌شد. این رنگ در جغرافیا بعنوان علامت خاص «جامعة هل» شناخته میشود.
  color.cyan:
    label: ازورو
    summary: رنگ زنده و جذاب؛ بخش مهمی از طراحی چاپ.
    info: آبی سرخابی، رنگ زنده‌ای است با تونالیتهٔ آسمانی و در مدل RGB دارای مقادیر R:۰، G:۲۵۵، B:۲۵۵ است. این رنگ به عنوان یکی از چهار رنگ پایه فناوری نسج الکترومغناطیسی CMYK شناخته میشود که C معادل Cyan است.
  color.fuchsia:
    label: رنگ فوشسیو
    summary: فرابرشته رز قرمز شبیه به گل فوشسیا.
    info: |-
      فوشسیو به رنگ زنده ای با عنصر بنفش و صورتی مانند فلک های چرمه‌برخ است، که نامش براساس گونهٔ باغبانی «فوتشیا» درآمده است.
      در سبک دادن وب، واژهٔ فوشسیو معادلهٔ رنگ ماژنتا (# FF00FF) است.
      این رنگ عمدتاً با مد، دهه۸۰ و آثار هنرمند پاپ مشخص شده است.
  color.gold:
    label: فلز
    summary: ذخایر طبیعی مواد غیرقابل بازنگرشده.
    info: زیراک زمانی است که معدن فلزات ارزان به دست آورد و در ساخت جواهرات، لوازم خودروها و تجهیزات صنعتی بسیار مهم شد.
  color.green:
    label: سبز
    summary: رنگ علف و برگ ها، رنگ ثانویه از آبی و زرد.
    info: سبزی رنگ ثانویه‌ای است که از ترکیب آبی و زرد به دست می‌آید؛ نماد طبيعت، جوانمردی و سلامتی است؛ چشم در تشخیص تمام رنگها حساسترین فرد بر روی این رنگ عمل می‌نمود.
  color.grey:
    label: سیاه آبی
    summary: رنگی بین سیاه و سفید؛ شبیه لخته ابرها و بتون.
    info: |-
      سیاه‌آبی رنگ اچروماتیک است که با ترکیب سفید و سیاه به دست می‌آید
      این رنگ نسبت به بقیه، خودنمایی پذیرفتۀ مردم دربارش بالا است
      در زمینۀ علم نفس شناسی معادل هدفمندسازی بدون تمایزات فرهنگی مثل تعاملات عاطفی است
  color.indigo:
    label: نیلوفرنما
    summary: رنگ عمیق آسمانی-بنفش مثل نیلوفر.
    info: نیلوفر رنگ، به عنوان نام فارسی ایندوکرو مایه‌دهنده است که شباهت زیادی با آبی تیره دارد و در طول هزاران سال یکی از برجستهترین مواد صبغی شناخته شد. این رنگ چندصد سال پیش براساس عصاره گیاه انداوژرا حاصل میشد.
  color.ivory:
    label: سفید
    summary: رنگ صاف و روشن بدون قسمت مشخص؛ تمومترین نوع سفید.
    info: سیفونو، رنگ سفت و شل با نام مستعار از کله فانوس در ماه های تابستان است. به دلیل طولانی بودن شبها و خشکی هوائی مناسب برای جذب حشرات مختلف آفات زراعی مثل موشهای ذرت، پروانه‌های لوبیا و ... استفاده می‌شود.
  color.khaki:
    label: كاكي
    summary: سبوك رندي؛ رنگ نظامي
    info: |-
      کاکی رنگ مات و سبزه‌ای تیره اهلی است که در قرن نوزدهم به طور عمومی توسط ارتش بریتانیا در هند شناخته شد
      واژه «خَکِ» اصلآ از زبان اُردو و هلدن آمد، خاك يعني غبار يا لغزندهايي كه باعث پوشانيدن جسم ميشود
      در حال حاضر يكى از متداولترين رنگها براى دستارچه نظامي و لباس فعاليت محلي است
  color.lavender:
    label: لیواندلوا
    summary: رنگ روشن فروغ شبیه چمن لیواندل
    info: |-
      لیواندولو، رنگ ناز افسرد فروغ است که به بوته لیواندلوا (lavendel) معروف شده‌است
      این رنگ آرامش و پاکیزگی و مناظر طبیعی جنوب غرب فرانسه را برمیاند
      در عطر درمانی، خوشبو های مرتبط با لیواندلوا با تنش زداها و خواب سالم دستخوشند
  color.lime:
    label: سبز لیمون
    summary: رنگ خوشال و زرد-سبز مثل لیموت.
    info: |-
      لیمتکوفا به معنای سبز روشن و غمگین است که نام آن از موسوم به لیموترش برداشت شده‌است، رنگ قابل توجه‌تری در مقایسه با زرد فلفل دانه؛ حاوی برشتهٔ زردرنگ است
      و در طراحی های چشم انداز به عنوان پسزمینه جذاب و راهنمائی تصویری متداول استفاده می‌شود.
  color.magenta:
    label: ماژانتو
    summary: رنگ زردرود؛ بین قرمز و آبی.
    info: نام رزرو شده اولیه در سال ۱۸۵۹ میلادی به دلیل نبرد ماژنتا است که در ایتالیا روی داد و همچنان یکی از پایه‌هاست.
  color.maroon:
    label: قهوه ای
    summary: رنگ قهوه ای تازه؛ سرخ عمیق.
    info: کاستانووا به معنای قرمز تیره و کاوه‌ای است، نامگذاری شده از روی دانهٔ کستanye در زبان اسپانiol «ماررون» محسوب میشود. این رنگ در مد، لباس های ورزشی و پوششهای نظامی بسیار متداول است.
  color.mauve:
    label: لیلا
    summary: رنگ ابرکوه-قرمز؛ رنگ قرمز لیلاف مناسب.
    info: لیلا (موو) رنگ ابرکوه‌ای نرم و تیره است که به فرانسوی معنی «سlezون»، مالوا سیلوستریسمان می‌دهد. این رنگ برای اولین بار در آزمایشات شیمیائی با عنوان انیلن لیله‌ای توسط ولیام پربک در سال ۱۸۵۶ خلق شد.
  color.mint:
    label: ماتوف
    summary: رنگ سفید تقریباً مثل لوبیا
    info: سایهٔ ماتو، رنگ سبز روشنی است که به دلیل شباهت با برگ‌ها و خمیردندان ابریشم معروف شده است. نام آن از گیاه ابریشمش ( Mentha ) گرفته شده است.
  color.navy:
    label: آبی نظامی
    summary: رَنْغِ خُوردۀ غرقاب شب.
    info: نیو بلو به معنای آبی تیره ای است که شبها در ساحل دیده می شود و نامش را از پوشک های قرن هجدهم انگلستان برداشتند، جزو متداولترین رنگ‌های زاویه بازار فشن و لباس مراسمی است.
  color.ochre:
    label: اکرو
    summary: رنگ زمینی طلا قهوه ای مثل pigment طبعتی اکرو.
    info: |-
      اکرُووا رنگی زمینی طلایی قهوه‌ای است که از پیgment اکرو (hidroxید فروس) نام برده میشود؛ به عنوان یکی از قدیمیترین pigments، مردم تاریخ باستان آنرا در نقاشی های غاری استفاده کردند
      در طبعت به صورت سنگ اکرو وجود دارد و در نقشه های عصر سطح بالای التمیر، لاسکسوس و جاهای دیگر مشاهد شده.
  color.olive:
    label: سبز روشن
    summary: رنگ صاف و فاقد قدرت بالغ شبیه سبز.
    info: سبزی کمرنگ و زرد مثل رنگ سبزیجات اولو است، نام آن بر پایه درخت اُلِوا ( Olea europaea ) مشتق شده‌است. به دلیل توانائی ماسک بودن با محیط طبیعی، سابقهٔ بلندی همراه نظامیان و خیرگاه‌ها دارد؛ در مد هم نقش مهمی در جلوه‌دادن به اندازه لباس نظامی داشته‌است.
  color.orange:
    label: نارنجی
    summary: رنگ داغ ثانویه تشکیل شده با آمیختن سرخ و روشن.
    info: نارنجی رنگ ثانویه‌ای است که از ترکیب قرمز و زرد به وجود می‌آید؛ نماد هیجان و خلاقیت بوده، اسمش براساس پرتقال درامد.
  color.periwinkle:
    label: '#ccccff'
    summary: رنگ فراموشنش مثل چمن.
    info: نیلوفرو رنگ آسمان، نام‌برده بر اساس گلهای جنس وینکا معدود است که به عنوان ترکیبی بین سفیدآبی و بنفش شناخته میشود. در مد و دزدوزی معروف است به خاطر ظاهر زنانه و پرشور.
  color.pink:
    label: روزان
    summary: سفت تیره نسبتاً روشن.
    info: رُزوفونی، رنگ سفید به اضافه مقدار کمتر قرمز است و در بسیاری فرهنگ‌ها با لطف، عشق و شوخ طبعی همزادارد.
  color.purple:
    label: نیلوفه
    summary: رنگ جادوئی ناشی از ترکیب قرمز و آبی.
    info: نیلوفه، رنگ ثانوی است که از ترکیب قرمز و آبی به وجود می‌آید. در طول سابقهٔ تاریخی نیلوفه بسپاردترین رنگ باقی مانده است و همراه با حاکمان سلطنتی و لوکس فاخر شناخته شد.
  color.red:
    label: '{"label": "قرمز",'
    summary: '{"summary": "رنگ داغ بلوز و جرقه.",'
    info: '{"info":"قرمز رنگ از سه رنگ پایه نور است و انرژی، عشق و خطر را به ذهن می‌آورد؛ در بسیاری فرهنگها آن شادی و قدرت را نمادین کند."}'
  color.rose:
    label: rosy
    summary: صورتی-قرمز نازک شبیه یک بلسم.
    info: 'روزه (Rose)، رنگی نرم و قرمز مانند پوکت سرخ است که این اسم به دلیل گلهای زانت، معروف شده‌است. تفاوت آن با روشنتر بودنش در مقابل رنگ صورتی وجود دارد؛ «розе» تیره‌تر و قرمزتر است. همچون عبارات مشهور سمول جِبَکتس: ''رنگ طبیعی برای قلب مثل روزه.'' در علم خُطاطی، «rozeh» یا رُزهٔ خطاطی در لوح فرهنگ انگلستان حضور داشته.'
  color.salmon:
    label: لوزوسوفا
    summary: رنگ صاف و صورت‌ آلبالو مثل گوشتش ماهی سلمون.
    info: لوزوسوفا رنگی نرم و صورت‌آلبالو به اسم لوبیانه است که از رنگ گوشته ماهی سالمون الهام گرفته شده است، تازه‌تر و روشن‌تر از زردآلوست. در مد بسیار پرکاربرد است و جایگزین مناسبی برای رنگ قرمز فرامرز باشد.
  color.scarlet:
    label: شارلتان
    summary: رنگ روشن قرمز؛ روشن‌تر از سرخاب.
    info: قرمز شارلاتی رنگ روشن قرمز با ناهماهنگ کمتر از سرخاب است و به دلیل مادهٔ رنگ‌دهندهٔ شارلاک معروف است، در تاریخ برای پوسترهای لوکس قرمز استفاده می‌شد.
  color.sienna:
    label: sianska henid
    summary: رنگ قرمز-قهوه‌ای زمینی مثل pigment سينا.
    info: "سیان سکا هنید از نوع قرمز تیره و زمینی است که نامش برگرفته شده از شهر ایتالیایی «سِنا». \nsiennská hned' خام، رنگ طلائی-قهوه‌ای دارد؛ در حالی که 'burnt sienna' با پختن به رنگ قرمز-قهوه‌ای مبدل می‌شود. \nاین رنگ بدلیل ظاهر چرمی آرامش بخش، در نقاشی دورهٔ رنسانس و تصویربرداری از طبیعت استفاده فراوانی دارند."
  color.silver:
    label: silver
    summary: رنگ سفید روشن مثل فلز نقره.
    info: نقره‌ای رنگ فلزی است که ارزشمند بودن معدنی نقره را به خاطر آورده و حالت عصر، زیبائی، تکنولوژي و طراحى صنايعي دارد. در علم شمشیرزنی عنصر دوم فلزات است؛ در المپيك هم جايگاه دوم را مشخص می‌كند.
  color.tan:
    label: پِسْكُوانَ
    summary: سفيد قهوه اي كمي مشابه بافت جلد.
    info: رنگ پیسکوونا، که به رنگ تان نزدیک است، سفید و قهوه‌ای ملایم شباهت دارد و اغلب برای لباس های جلدی مثل شلوارها، کفش ها و آستین برجسته استفاده میشود.
  color.teal:
    label: سبزیابو
    summary: رنگ آبى با لمسِ سبز مثل رنگ دريا.
    info: سبزیابو رنگ مانند دريا است كه اين نام، به دليل بال‌هاي پرندۀ کريک عمومى (anas crecka)، با همين ظلّت فارس توصيف شده است و جزو قسمتهای بالاي طيف زردآبي سبز آبی است. این رنگ در طراحی چاپى بعنوان يك رنگ مقابل عماردي محبوب است.
  color.turquoise:
    label: trquoise
    summary: سبز فلزاً مثل آب هست.
    info: رنگ ترکیس به رنگ زرد سبز روشن مثل آب‌های استوائی، کمربند این نام براساس جواهر شبه قیمتی «ترکیس» تعیین می‌شود. سنگ‌های ترکیس در مصر باستان، پارس و آمریکا دیده می‌شدند. این رنگ شباهت بزرگی با رنگ دریاستروان، منجمد دریاها یا آسمان مشمس دارد.
  color.vermillion:
    label: رومَلْکوفا
    summary: رنگ ساخته شدۀ قرمز و نارنجی شبیه به رومال.
    info: رُمِلکوواه (ورمنیلوس) رنگ سرسخت قرمز و نارنجی است که از معادن معدن‌شناختی به اسم «رومل»، همانند جینابار (HgS)، مشتق شده است. در طول تاریخ یکی از پرتراستترین مواد رنگ دهندهٔ زرد بوده است. روامل فعالانه خطرات محصولات سمی مثل جیوه؛ بنابراین الان با منابع سنتتیک تعویض می‌شود.
  color.violet:
    label: فيلوا
    summary: رنگ بين آبي - فيلوسي ; در پاياني ديده ميشود.
    info: فیلوا فارسک به انتهای طيف دیدني مربوط است و در حدود بلندگي موج ۳۸۰ تا ٤٢٠ نانومتر قراردارد. اين رنگ براساس چمن‌باغ، که Viola خوانده ميشود، نامگذاري شدهاست. با وجود شباهت ؛ آنرا با سرخابي تميز کرد؛ زيرا فيلوا بيشتر به منظور مشخصات آبي نزديك است.
  color.white:
    label: سفید
    summary: روشن‌ترین رنگ موجود، بازتاب انعكاس كل نور.
    info: سفید رنگ شامل تمامی اشکال قابل دسترس در طول محدودهٔ نور مرئی است و همزمان بازتاب آنها را به خوبی برجسته کرده، حالت جدیدترین تازگی‌ها را فراهم می‌آورد؛ سفید رنگ علامت تمایل به پurity، شیرینی و زندگانی بدون سابقه منفی است.
  color.yellow:
    label: زرد
    summary: رنگ روشن و چاق با حرارت بالای آفتاب و طلا.
    info: زرد رنگ اصلی نور است و به عنوان محبوب ترین رنگ ها شناخته می‌شود. معادل زرد، خوشبختی، انرژی و جو سالم؛ در کسب دقت بسیار موثر است.
