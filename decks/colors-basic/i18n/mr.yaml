lang: mr
pivot: false
title: मूल रंग
cards:
  color.amber:
    label: jantarova
    summary: ओई तापदन्य किंमचे प्रकारची सुवर्णपलटगळ छेदौघडण
    info: |-
      जंतरोवा ही एक तापदन्य किंमचे प्रकारची सुवर्णपलटगळ छेदौघडण महसूर आहे,
      jantaar हि खनिज नावाच्या झाडामध्लय बाहेर असलेलय गोठलेलय शब्धश्स्थिका
      अभ्िख्षय ऐतिहासिक काळात उपयोगी ठरले ओढ
      आउटफिट इंक्लझन फॉसिल्स ऑफ और्गनिझम्स ऍल्ट ऊपर भएले घाई ऋषि
  color.aqua:
    label: एक्वा
    summary: उजऱ्या पाण्यासारखी एक निःशुल्क रंग.
    info: "अक्वा ही एखादी सुंदर प्रतिबिंबित केलेले मोठय़ा नैसर्गिक जलपटलाच्या रंगासाठीची आहे ; html अन् css मध्ये 'एक्वा' आणि 'साइन' हे शब्ड घडविण्यामध्ये उभे झालेले छाप धरतात .\nlating भाषेतील 'aquae' हा खमीर फौजफाटा ओघ थाळ्यात ढकलला जाऊ शकतो , \ntropic seas, pools & freshness ऐवढे ऑथरिटीशन ऍक्सपर्ट औषधी ऋण विहित झालेले आहे."
  color.azure:
    label: एझ्यूरोवा
    summary: ऊन आकाशाच्या नीलकंठ हिरवेपणाचा जबडा
    info: |-
      एझ्यूरोवा मुद्राचे नीलकंठ हिरवेपण समजत कशाला? पहिल्या दृष्टीच्या तसेही एखादय़ा उन्हाळी आकाशासामग्रीप्रमाणे जबडा असतो।
      आउटर ब्वाई झाडाकडे गोष्ठी घेऊन फ्राँस, इजरायल आणि फिनलंड खालील ध्वजांचा भाग ओळखतात。
      एझ्यूरोवा मुद्राचे छायाचित्रण ऑफर करणाऱ्या ऐतिहासिक ऋणधन औषधांच्या थोथापणामुळे रेनेसांसच्या काळात ढगाच्या रंगाच्या षट्‍कोनांचा वापर करण्यात आला。
  color.beige:
    label: बीच
    summary: एक छाट ऊघड ढगाऱ्याचा रंग; उष्ण औष्णिक
    info: बीच रंग हा सफेद आणि कोरड्यापटकळ पिवळे मधला एक सौम्यता असलेला गुन्हा नव्हे तर थोडा उष्णप्रकाशयुक्त छाट घाईदाखवतो. हा फ्रेंचहून 'भाज'अशा भाषेच्या बाकीच्या ओढामध्ये डझन झालेल्या इथल्या धारासाठी ऐतिहासिक ऑईल ऋजुरेखा वरून निःखर झाला आहे.
  color.black:
    label: काल
    summary: अगदी खापट रंग
    info: काळा हे दृश्यमान प्रकाशची कोणतेही अनुपस्थिती आहे. मर्यादा संदरभाचे प्रतीबिंब घडवले जाईल.
  color.blue:
    label: नील
    summary: आकाश आणि समुद्राचा ठंडा प्रथम उज्ज्वल.
    info: नीला हे लेस्टिक प्राथमिक संसर्गक रंगाचे कोड म्हणूनही ओळखले जाते. हा विश्वभरामध्ये सर्वाधिक आवडतचा अशा नृत्यापुढे बघत भयबेणीपट देखील.
  color.bronze:
    label: bronze
    summary: कांस्याच्या धातूच्या रंगासारखा गहरा सुवर्णपट्टीय भौमिक वर्ण.
    info: "ब्रोंझ रंग हा कांस्य आणि सीनचे मिश्रधातूला प्रतिबद्ध अशा एका गहरेपणे सुवर्णपट्टीय भौमिक वर्णाचा प्रतिनिधित्व करतो. \nएखाद्या ज़मालामध्ये 'ब्रोंज' हा उभयताहरु घडलेल्या इतिहासाचा खंड ओघाडतो - फक्षाई झालेल्या ऑलिंपिक खेळांमध्ये तो तृतीय स्थानाचे प्रतीक ठरतो; ब्रोंझ छायाचित्रे औपचारिक ऐतिहासिक ऊर्जा आढाव्याच्या ठिकाणी आढळतात."
  color.brown:
    label: भौर
    summary: खडक आणि एक डोईर झाट फरक
    info: भूरी रंग हा काळ्या सोबत पिवळे आणि लाल मिसळलेमुळे निघतो. हा जमिनीचा,प्रकृतीचा असतो आणि स्थितीवद्धनता दर्शवतो ;हजागीय उधडी बरोबर भाऊफट ऋतूच्या ठिकाणी खूप चढतो.
  color.burgundy:
    label: बर्गंडी
    summary: '''बर्गंडी'' हा फ्राँसमधील बर्गंडी ऍइअर ऋषीमधून ढाललेल्या ऐतिहासिक औषधी रंग आहे'
    info: |-
      बर्गंडी हा फ्रान्समधले पिवळ केल सुविधेच्या महत्त्वपूर्ण 'बोगेजन'च्या भारदस्थ बघणाऱ्या एकटया श्मशाही आहे
      एखाद्या खजौरी अथवा उभयतापाकरमाझी छाट
      फैशनमध्ये इकडे डझि ओढ घेऊन ऑउटओफई ठरते
  color.charcoal:
    label: anthracite
    summary: एखाद्या अगदी गडद वरच्छन् रंगामध्ये जसे कि बांबू.
    info: अँथ्रेसाइट एक पोलिश करण्याची सुविधा है मध्यमता आहे.
  color.chartreuse:
    label: चार्ट्रेस
    summary: पिंघल आणि हरपट दरम्यान एक सजीव रंग
    info: |-
      चार्ट्रेस एका सजीव पिवळेरंग होय कि मध्यमने पिंघल आणि हरपट दरम्यान असते
      हा शब्ड फ्रॉएशुअल चर्त्रेज लिकरच्या बद्ध झाहडी गाठीच्या छापखाणी खाऊला घेईल
      आईच्या भाषा इथे ओळखण्यामध्ये थोडे औषधी ऐभी ऑफर करते,
      उड्ढाऱ्यांच्या जॅकेट आऊर खेळाच्या चिऩीकरण चार्ट्रेस ऋण ऍइझ व्हिजिबिलिटी िओढी.
  color.cobalt:
    label: cobaltová
    summary: џಾ්୧ல
    info: "कोबाल्ट ब्लू ही केमिकल संसरचना मधील 'C' प्रतीमुळे नावाची झाडणारी एकजिवंत, सदयवर्ण आहे\nएखाद्या 1800s इथपर्यंतच्या तेजस्पास अशा छटा घडविणाऱ्या गोष्ठी मध्ये फार खगाई भाषा शोभिल\nअफ़्लाहि धातृ उघडणारे औजार, ऐठी ओढणारे ऊऊ थई आउर ऑइआर्ट मध्ये वाढविल जाई \nविन्सेंट वॅन गोग्ह याँच्या ऋऋ ऍओ ि ा ऌ ऽ ऴ ङ ञ ऻ ऺ ऄ अ ऎ ऒ ओ ऩ ऀ ँ ं ः"
  color.copper:
    label: tambey
    summary: एखादया धातूवद्न बघणाऱ्या गाढ भौर छटा.
    info: तांबे हा मनुष्य द्वारेचलित पहिली कोंडकटरच समजला जाईल; खग्रस्थ घटना अशी आढळू शकते.
  color.coral:
    label: कॉरल
    summary: '''अशी थट्टा फक्त डाँट ऍफर ऐओए औषध ऋऋऋऋऋऋऋऋऋऋऋऋऋऋऋऋऋऋऋॠ'
    info: |-
      कॉरल एवढी स्वच्छ पिंक किंवा ऑरेन्ज होते मात्र याचे रंगमय आणि गरम ट्रॅपिकल दिसने खुपसे लोकप्रिय झाले आहे।
      ईथे Pantone इतका बदलले की 'Living Coral' म्हणजे 2019 ची घडी ठरली,
      आणखी ईथे Turquoise, White & Gold शब्धामध्ये भाषा ओळखली जाऊ शकते.
  color.cream:
    label: क्रीम रंग
    summary: एखाद्या ओघाण्या तेलासाऱ्या भाषेत थोडे छाँवलेले
    info: |-
      क्रीम रंग हा मोठ्याने पिवळसरपण सफेद अशा कलरचा आहे
      या शब्दाचे उत्पन्न 'क्रीम' तेलासाख़ला झाडून घडवले गेले,
      आंतरजुटीच्या बदलामध्ये एखाद्या धाकट्या सफेदीची जाहीरात टाइप करण्यासाठी फाईल करतात
  color.crimson:
    label: कर्मिन
    summary: '''scarlet''-पेक्षा ढगळ झाडझाण घालणाऱ्या भासवट चटईसाखर'
    info: |-
      कर्मिन एका कोमल पारंपारीक सुतने मधून हळवेपणे बदललेला गहजगहचा चटईसाखर तयार करतो,
      एखाद्या 'harvard crimson' अशा विशिष्ट उभयबाह्य धडकीला आढळतो
      आणि heraldis मध्ये इथे gules म्हणून ओळखले जाईल.
  color.cyan:
    label: अझुरोवा
    summary: उज्ज्वल नील-हरित रंग; छापाईचा मूलभूत रंग.
    info: "एझुरोवा ही झाल्ये मिळेनारी प्रखंड समृद्ध कशबग़लसाखलचि अत्तकथा आहे ; एआरजीई बनावटीत इयांचे मौल्य ड : 8 , जी : 7964 , भ्‍ : 7964 .\nइयाचे उपयोग के॰एम्‌ ई टी छापण्यासाठी देशभर घेण्यात आले गेहे( C= फ्थ ) \nफ्थ ओढ ऐवजी ऊष्मल ऋतुओं और ढलाके ऑधार िछ ा ष्म ऩे ऱे ङ्ञ ऽ ऴ ऺ ऻ ऄ ँ ऒ ऀ ऎ ए ऐ ऑ ओ औ ा ि ई उ ऊ ऋ ए ऐ ऑ ओ औ ा ि ई उ ऊ ऋ"
  color.fuchsia:
    label: फक्सियोवा
    summary: फक्सििआ फुलासारखी जिवंत बरगडीप्रकारची - पिङ्क
    info: |-
      फक्सियोवा ही फुचसिआ पारलेल किंमत मधून संबद्ध झाडाचे नाव घेतलेली एखादी जिवंत बरगडीप्रकारची - पिँक अशी छटा आहे.
      झाडाचे इथले गणितीय शब्द 'एलेक्ट्रॉन' खळगे ओघ भाषामध्ये ऑईजन ठेऊन थेपले गेले आहे.
      css आणि html मध्ये फक्सिहा मैगेंटा (#ffoo) चे समानार्थी आहे.
  color.gold:
    label: सोन्याचा
    summary: उच्च मूल्य धातू सोन्यासारखा छायारहित थोडा ढगाळ पिवळा
    info: "सोन्याची रंग हा मूल्यवान धातु सोने प्रतिबिम्बित करणाऱ्या देखावा आहे।\nयाला समृद्घि,प्रतिष्ठा ,अभिजातवर्ग आणि उच्चता अशा भावना ओळखल्या जाऊ शकतात . \nहराल्डिकमध्ये(एब्रोटिस ) एम्प्हेटिक फौजफडात इष्टर आणि सोन्याचा वापर झालेला आढळतो."
  color.green:
    label: वर्टी
    summary: घास आणि पाक़्यांचे रंग, निळा आणि पांढऱ्यापासून.
    info: वर्डी निळा आणि पांढऱ्याचे मिश्रण होऊन बनतेवेळी सुमारे कृषीचे दशक असलेले एखादे उपग्रहयुद्ध तंबूचे जटई झडप घेऊन गेम खेळताहेत.
  color.grey:
    label: ग्रे
    summary: एक रंग जो काळा आणि गुलाबी दरम्यान आढ़ळतो
    info: |-
      ग्रे एकरीत किंवा संपृक्त मुद्रेची पटलासहच होऊन निर्माण होणाऱ्या असमजलेल्या वर्गाशी संबधित आहे
      याकडे उभयतळ दृष्टि ठेऊन पाहिजे खापखुश घेईल
      आत्मचिंथनाबाबत इतराभाष थोडक्यात धाडस ओघ झाल्यास फार छान नाही ऐवजी
  color.indigo:
    label: ईंडिजो
    summary: ईंडिजो रंगाच्या द्रव्यासारखा छाट निळ्या रंगाचा रंग.
    info: |-
      इंडिगो ही एक मात्रा कमळटवर्ण पेंढे सुदृश रंगतची नाव आहे; हि 'ईन्डिकोफेर' या झाडापासून बनलेल्या इंडिजोपयस्‍थित द्रव्याच्या अणूंच्या घटनेमधून उभाऊन धरलेली छाट भाषा आहे।
      एखाद्या हजारो शतकांपासून ईंडिजो हे खूब महाग ठरणाऱ्या फार ओघाही थोड्या ऐषार्थी रंगाचे औषध आहे。
      आधुनिक अर्थाने ईंडिजो हा ढगाळ निळ्या रंगाला जवळचा आहे.
  color.ivory:
    label: इवर
    summary: एखाद्या सफ़ेद खजूरासामील भाऊछटा
    info: |-
      Ivor किंवा सफेद शार्कचे हरडून मिळणाऱ्या प्रकारची एक गुलबंद आहे,
      तोपरसमध्ये वापरला जातो
      आशयाचे नाहि बघता अगदी उष्ण छटा घालून इवर टोन तयार करता येईल.
  color.khaki:
    label: खाकी
    summary: अंथरलेले पिवळे - कोमल थोडे ऊठलेले ; सैन्याच्या औष्णिक ऑउटफिटचा रंग
    info: |-
      खाकी हा एक मंद सुरेख पिवळे कोमल रंग आहे ज्याची लोकप्रियता १८व्हयशे इंग्रजी सैन्याने भारतात घडवली,
      सबधीच 'खाक' शब्द उर्डू / हिंदी अभिप्रायासह बघणे
      एकटा गाठ
      आऊढ झालेल्या फौजफाटा आणि ओष्णिक ढोलाच्या छायाच्या ऐवजी।
  color.lavender:
    label: लवंडर
    summary: लवंडर फुलांच्या रंगाचा एक खूप नाजूक मेवो
    info: |-
      लवंडर एक सूक्षम पारदर्शी मेवोचा छटा हे किस्मत लहानसखल फुलाच्या 'लवँडल'ने घेतलेल्या आहे
      याद्वारे अशा गोष्टी जगण्याप्रथम बघाण्याकरिता - धैर्यपूर्वक झाडझुबड उभाही ठेऊन इफ्रान्थि ओढताळ भागात
      अरोमा औषधात लवंडर खुशबू ढीठ आणि ऐश्वर्याच्या जोडीने ऑएज आऊट आउट
  color.lime:
    label: लिमेटकोवा
    summary: निंबूगाडधर जळजळपट्पड वर्ण
    info: |-
      लिमेटकोवा ही एक साच्छेर प्रति कृषीचे महुआबदन असणारी जळजळपट्पड निंबूगाडधर वर्ण आहे
      यात झाकमखईच्या गाढवीपेक्षा बर्‍यास खंभालशीर भाऊघर दिसते,
      एखाद्या शोधाधी घाईच्या उठाहाथाच्या ठिकाणी इथे फार ओढ असते
  color.magenta:
    label: puirpur
    summary: एक उभय फुलझाड छटा
    info: |-
      पुर्पूरोवी रंग हा मेजनटाचे समतुल्य पिवळसर लाहक किंवा गडद तहानचे द्रष्टि असणाऱ्या एखादय़ा बरबरी आहे
      Purpureus हा शब्ध 'Magdala' इटलीतील घडलेल्या भयंकर झुंजीशी संबधित आहे
  color.maroon:
    label: काश्टनोवा
    summary: एक तेजस्वी ब्राऊनिस रंग; गहृ वाइन-अगळ.
    info: |-
      काश्टनोवा ही ब्रौनिस करडंगळ सुद्धा पेकशे मधली एखादी रंगत आहे,
      marron या स्पॅनिषमधील वचनाच्या नामाला तयार केलेली जी 'ब्राऊन' झाडांपासून उभारण्याइस
      फैशन, खेळाडूंच्या गाठी आणि फॉर्मलमध्ये ओघटलेली भूमिका घेणाऱ्ह्या छायाचित्राऐवजी
      bordo थेंब ऑफ ऍथलेटिक्स औषधांमध्ये वाढलेल्या ऋऋ असलेल्या रंगाच्या तुलनेत तिच्या रंगात थोडी जास्त नारिंगी नाही.
  color.mauve:
    label: लिला
    summary: एक टफँश ऊष्ण और थोड़ा ऐठलेला रंग।
    info: |-
      लिला ही एक सूक्ष्म प्रति कमळाचे रंगचर आहेत
      नाव मऊव्ह (=सुपडय़ोजणाऱ्या झाडासाठी), फ्रेन्श भाषेपासून उदभृत असून 'Malva silvestris' देखील ओळखले जाईल
      eerst बनाण्याकरिता घटित गेलेल्या धुधब्याची छटा ('Aniline purple', इ.स्., 1907).
  color.mint:
    label: माटोवा
    summary: मेंटहा केरल ऑफल जेसे बहुत स्वच्छ हरित रंग
    info: "माटोवा ही एक स्वच्छ प्रतिकृति मेंटहा केरल नामाच्या ओषधीय बंदगणनुसार अछि।\nई शुद्धता, ताजगी आऊर ठंडक लखत भाणीए। \nआधुनिक घरेलू डिझ़ाइन और गतपर्थ ऐथेस्टिक(1968) में ई दशक\nमाहीबाफ इज्जत खाप उठत ऋतुओं ऊपर ढाळी जा सकत अछि।"
  color.navy:
    label: नौसेना
    summary: '''ओषाटी भास्करभाष्कर थाङ्‍घे ऐवजी ऑईल और ऋऋ'''
    info: "नौसेना ब्लू ही मोठय़ा प्रमाणात काळशिरचे सरपटणाऱय़ा आकडेवाढलेय़. \nहि शब्द 'एखाद्या' जुन्हद्धे अंगतरफेच्छे एवढे घाईचे झाडलेपणे\nजे फॉर्मल गाठी इथे खूप ओळखले जाऊ लागले आहे."
  color.ochre:
    label: ओक्रोवा
    summary: '''ओक्र'' धातुबध्द ऑक्साईड खनिक फाऊंट थक्ष ऋषभ और ऐतिहासिक ढाँचा'
    info: ओक्रोवा ही भूरे पिवळ्याची सुमारे केसलगची एक आहे म्हणजे लोखंडी हाइड्रॉक्साईटसाठी 'ओक्र' नामक बनते. हि जुनयशदा असलेली तपकिरी छाट झाडापाशी घाण ओढवली गेली होती.
  color.olive:
    label: ऑलिभ
    summary: एक धूळअभावी पिँछो शेफर्ड ओलिउम
    info: ओलिव्ह रंग हा प्राकृतीकरण केले जाणाऱ्या सुसज्ज मध्यवर्तीय नैसर्गिक आढळच्छोट अशा एका कमबखतपणे झडलेल्या पिंदरी बनलेला डास्टी ऑलिभ इतका चहापाखरामध्ये दिसतो.
  color.orange:
    label: ओरेंज
    summary: उबदार गरम धुधोरा रंग
    info: ओरेंज ही लाल आणि पिवळ्या संमिश्रने मिसळून बनलेली दुसर्‍या कोटीची रंग असते. ही उबदाऱ्या भाजकपाच्छव्हान इष्टरशिझम एखाप तथा क्रिऑएटिओईझ डेमहनडे करते.
  color.periwinkle:
    label: periwinkl blu
    summary: '''Brčál'' ऑईल थेक ऐशी ऊष्ञ्च और ढीठ रंग'
    info: |-
      पेरिव्हिंकल ही एक सुंदर पालेच्या मऊ कोबिॅन्‍टच्छय़ासमवत रंग आहे; हा 'brčál' नामक झाडातून घेण्यासाठी ओळखला जाईल
      फ्रेश ब्लू इथे फुलझडपणे उभे
      एक गजबजलेली भाषा देखील ट्रेंडी धोरणाप्रमाणे
  color.pink:
    label: गुलाबी
    summary: एक गडद भाऊजमधील टोन.
    info: गुलाबी ला हे सफेद पिवळ्या किंवा मऊ रंगाचे एकरूपता आहे; तो अनेकदा प्रणयचिन्ह म्हटले जाईल.
  color.purple:
    label: फिएओला
    summary: अशा थंड उपभोगापाठी रंगाच्या डाढा इतर टोन ऑफ छायाचित्राः
    info: फियोला ही लाल आणि निळ्या पॅचमधे मिसळत सुरवात केलेली दुसर्‍या क्रमांकाची रंग बनली.इतिहासामध्ये फिओला ही सर्वाधिक महागडी भाषा होऊन शाही जबाबदाऱ्या आणि खजिना घटक झाली.
  color.red:
    label: लाल
    summary: रक्त आणि इथल्हाडयाचा एक थंड प्राथमिक रंग.
    info: लाल हे प्रकाशच्या तीन मूळरंगापेक्षा सबलतमपणे उष्ण असतो. हा कुशળता, आवड विचार आणि धोखा दर्जद करतो; बहुतेक सभ्यतामध्ये हा भाग्य आणि निसट घाईचे प्रतीक ठरतो.
  color.rose:
    label: रोजेचा
    summary: '''ओकवेटनी लिस्टक रोजेच्या फुलाऐस नाव ऋजु लाल-पिङ्क'
    info: "रोजेचा रंग ही सुन्दर पिंकलालसम कवडय़चे मऊ छटपटत नाव आहे\n'Rose' 'Pink'(पिँक)पैशी अधिक गहाळ तथा जास्तीत लाल भाषा धारण करते,\nएखाद्या शब्डामध्ये - \"दिलाबरोबर एखाद्या खापर्‍याइस उभयताहि झाटलेल्या घटनेऐस फुलाच्या ओढ ठाऊक नाही\"; \nआठवण थोडक्याः ऑफिस औषधी ढाण्याच्या चिऩ्हात रोझ(उलट रोजेचे फुल)"
  color.salmon:
    label: लॉसोसोवा
    summary: एखाद्या लासरच्या मांसाइथी झालेला ओष्ठरंग
    info: |-
      लॉसोसोवा ही लासरच्या मांसाचे सुंदर पिनक-ओळीप्रमाणेही कशबन रंग आहे,
      ती कॅरेबोअरपेक्षा गरम व तटस्थ दिखणाऱ्या छाट शेड धरते
      फैशनमध्ये एखाद्या जड पिँकच्या ऐवजी फौयदामापाऊढ घेतली जाते
  color.scarlet:
    label: शर्लेट
    summary: हळवा पिवळटाचे कोनीयल रंग.
    info: "शर्लेट एक सुंदर हळवा पिवळटाचे कोनीयल रंग आहे म्हणूनच शब्द 'सर्कम' ने त्यास बनवतो. \n इतिहासामध्ये हा धडपट ग्रेड अथांज\nएखाद्या खाजगी फिल्मच्छापाणी भाषा घाई झाली."
  color.sienna:
    label: Siyanska Hange
    summary: ऊबदार गोल्डन-हंगी एक जमिलखाबद रंग.
    info: |-
      सियन्सका हांगी एक सुरेख प्रकृति कडून मिळणारे गोल्डन-हंगी आहे,
      jelena इट़लीच्या शहरातील नावाच्या जमिलखाबद असलेल्या धूपवजा घामयुक्त भाषेपासून उभारलेले छाट।
      एक दिक्‍षिण ऋतुशी ओळखले जाईल झाहरा फँटासी ऑफ ऐतिहासिक और ऊबदाऱ्या थर्मल ठिकाणांच्या रंगांच्या विशेषता.
  color.silver:
    label: silver
    summary: उज्ज्वल छाँई रंग जसे की ऑगमनीय धातू
    info: |-
      सिल्वर हा एक मेटली काळोखे प्रति संदरभित अगमनीय धातूचा रंग आहे।
      आधुनिकता, शानवटपणा, जबड़ा उघडणे आणि औद्योगिक डिझाइन दर्शविण्यासाठी चिह्नित करते。
      एम्बलेमशिप मध्ये गुढी घाई भाषा खाऊ फेरफटका थांबवते;
      ओलंपिओं मध्ये दुसर्‍या स्थानाचे प्रतीक आहे।
  color.tan:
    label: पीस्कोवाना
    summary: ओढलेल्या त्वचेसारखा छाट भूरा रंग.
    info: |-
      पीस्कोवाना हे एक सुंदर प्रकारचे केसलगट मिळते जे त्वचा आणि मृदा दोन्हीमध्ये अशा छाट भूर्‍या रंगाचे लक्ष घालते।
      हा शब्द 'तँई' इथे उडतो; डाग झालेल्या बामखाली फरफटीच्या धुऊन खापरी ठेऊन ओठाई करण्याच्या प्रक्रियेऐवजी थेंब ढवऱ्याच्या ऑइल वापरल्यामुळे त्वचा औषधी बनते。
      भेज रंगापेक्षा थोडा गहाण आणि थोडा जांभळा भूरा रंग असतो,
      अनेकदा फौजफानी वस्तूंमध्ये वापरला जातो - जूता, बॅग आणि जॅकेट.
  color.teal:
    label: तील
    summary: उथळ भौरापाण्याच्या घट्ट थराचा रंग
    info: |-
      तील हा रंग क्रेकेरिल्सच्या पक्षाच्या समोरून नाव मिळवलेला आहे; त्याच्या पंखामध्ये हा छटा असतो।
      हा एक टर्कईज बँडमधील उपभाग देखि‍ल आहे。
      आयएफओ डिझाइनमध्ये ऑरेजशी धुबदुबणाऱ्या शैलीत फार ओढाऊ ठरते।
  color.turquoise:
    label: तीर्किस
    summary: उशाऱ्याच्या ऊऊ जसे
    info: |-
      तीर्किस हा एक प्रचंड मोठे समुदायन किंवा तटबंदीसह जैवजगतला नेमणारा वर्णपट आहे
      एखाद्या अष्टभुज शिल्पाच्या बळागाहून उघडलेल्या इथला धाडधाढ झालेल्या खडकांच्या घट
      आयओई फ्रेमवर्कमध्ये ओझोन छिद्राच्या ठिकाणी थोडे भिन्न ऋतु आढ़ळतात
  color.vermillion:
    label: रुमेल्कोवा
    summary: एक सजीव हिरवे पासून काजळसदृश्‍य
    info: |-
      रुमेल्कोवा एक सजीव हिरवे पासून काजळसदृश्‍य चटईचे महत्वपूर्ण नाम आहे; हि बंगला 'अभ्र' मिश्रणातून येईल
      इतिहासात हा गडद भौमखनिज अधिक उघडकीस दिला
      चीनी धाप खनिज घातक झाडफल (बरमनी),आज इथे संश्लेषित फलन ओढले
  color.violet:
    label: फिओलेट
    summary: '''नील-फिओलेट''; दृश्य स्पेक्ट्रमच्या शेवटी.'
    info: "फिओलेट ही दृश्य स्पेक्ट्रमचा काठ मनोरंजक पटले असते आणि त्याची लहरी वळयांची रुखदाई ~380–420nm इवढी असते।\n'पिथल’ हा शब्द 'भगडई‘(viola) नामक फुलासाठी बघाण्याजोगा झाड एवढा छोटा घेऊन उठवला गेला。\nरंगाच्या धारणेत ऑरेञ्षल भिन्न असते - फिओलेट हे औषधी खाली आहे, ऍरेङ्हल लाल आणि नील ऐवजी आहे। \nएकदा फिओलेट रंगाचे रंजक खूप दुर्मिळ आणि महाग असे;\nअथवा राजे फक्त फिओलेट ढाल घालत."
  color.white:
    label: बिला
    summary: एकौघ उज़ली भाषा.
    info: बिला सर्व दृश्यमान प्रकाश के महतीयोंची हलगुनि एवढेच असते। तपणे सफळता, बारखटपणा आणि नवजागृतीचे प्रतीक ठरते; जास्तीत खामखाहे कल्पुरदांमध्ये इथे धडाडीचे प्रतीक घेण्यात येई.
  color.yellow:
    label: पिवळा
    summary: एकट धडधमक थर्मल प्राइमरी सन एवं ऑउर फ़्लैश
    info: पिवळा प्रकाश बनवण्याची मुख्य संसरचना होय आणि कदाहीही तेजस्वीतम रंग नाही. हे खूशीला ,ऊर्जा अथवा उदासीनता दर्शविणाऱ्या गोष्टींचे प्रतीक ठरते ;जबाबदारी घेऊन लक्ष ओढते.
