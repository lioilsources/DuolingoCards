lang: mr
pivot: false
title: मूल रंग
cards:
  color.black:
    label: काळा
    summary: सर्वात गडद रंग, प्रकाशाची अनुपस्थिती.
    info: काळा हा सर्व प्रकाशाच्या उपलब्धतेचा अभाव आहे. हा रंग नमूद, रहस्यवाद आणि शक्तीचे प्रतीक आहे; मोडेल जगतामध्ये हा एक मौलिक आणि सार्वजनिक रंग मानला जातो.
  color.blue:
    label: निळी
    summary: शांत आणि प्राथमिक हवेच्या रंगातले निळे.
    info: निळा हा सर्द प्रकाशाचा प्राथमिक रंग आहे. हा जगभरातील सर्वाधिक लोकप्रिय रंग मानला जातो आणि शांतता, विश्वास आणि गहराईचे प्रतीक आहे.
  color.brown:
    label: भूरी
    summary: जमिन आणि हवेच्या संयोगामुळे बनलेली दुसरी प्रकारची रंग.
    info: भूरा हा लाल, पिवळा आणि काळा मिसळून तयार होतो. हा जमिनीचा, प्राकृतिक आणि स्थिरतेचा प्रतीक असतो; प्राकृतिक आणि शरदऋतूच्या थीममध्ये खूप लोकप्रिय असतो.
  color.green:
    label: हरवा
    summary: तुरट आणि पानांचे रंग, केसल्याचे ब्लू आणि पिवळ्यापासून मिश्रीकरणामध्ये समोर आलेले द्वितीयक रंग.
    info: हरवा हा एक द्वितीयक रंग असतो जो उभय ब्लू आणि पिवळ्याच्या मिश्रणामधून तयार होतो. हा रंग प्रकृती, प्रकृती आणि ताजेपणाचा प्रतीक असतो; हा रंग डोळ्याने सर्व रंगांपेक्षा सर्वाधिक संवेदनशीलपणे घेतला जातो.
  color.orange:
    label: ओरेंज
    summary: लाल आणि पिवळ्या मधील एक गरम दुय्यम रंग.
    info: ओरेंच हे लाल आणि पिवळ्या च्या मिश्रणाने बनतो. हा उत्साह आणि कल्पनाशक्तीचा सूचक असून ओरेंच फळाच्या नावावरून नामकरण केले गेले.
  color.pink:
    label: रूजवा
    summary: लाल रंगाचा हलका स्वर, मऊ आणि प्रेमळ रंग.
    info: रुजवा ही एक निसर्गसिद्ध लाल रंगाची कोमलता असते. बहुतेक संस्कृतींमध्ये हा रंग शांतता, प्रेम आणि खेळाडूपणाच्या भावनांशी जोडला जातो.
  color.purple:
    label: फियोला
    summary: ही रहस्यमयी दुय्या प्रकारची रंग हरवे आणि निळ्या रंगाच्या मिश्रणामधून तयार होते.
    info: फिओला ही लाल आणि निळ्या रंगाच्या मिश्रणामधून बनलेली एक सेकंदर किंवा उपकेंद्रीय रंग असते. ऐतिहासिकदृष्ट्या हा रंग सर्वाधिक महागडा मानला जाई, जो राजशक्ती आणि भव्यतेच्या संबंधात ठेवला जाई.
  color.red:
    label: लाल
    summary: रक्त आणि ज्वाळा यांची गरम प्राथमिक रंग.
    info: लाल हे प्रकाशाच्या मूलभूत रंगांपैकी एक असते. हा ऊर्जा, कामुकता आणि धोका दर्शवतो; बहुतेक संस्कृतींमध्ये हा भाग्य आणि शक्तीचा प्रतीक असतो.
  color.white:
    label: बिला
    summary: दृश्यमान सर्व प्रकाश देणारी सर्वात हलकी रंग.
    info: बिला हे दृश्यमान स्पेक्ट्रमच्या सर्व रंगांचे मिश्रण असते. ही चिसटता, बुद्धिमत्ता आणि नवीन सुरुवात कोणत्याही संस्कृतीत एक शांतता दर्शविते.
  color.yellow:
    label: पिवळा
    summary: सूर्य आणि सोन्याची उबदार प्रकाशमान बेसिक रंग.
    info: पिवळा हा प्रकाशाचा मुख्य रंग असतो आणि किमान तेजस्वी रंगांपैकी एक आहे. हा खुशी,ऊर्जा आणि धन्यवादचा संकेत देतो;लक्ष ओढण्यात खूप चांगला ठरतो.
