lang: bn
pivot: false
title: মৌলিক রংসমুহ
cards:
  color.amber:
    label: জন্তার রঞ্জন
    summary: '''অ্যামবার''-এর ভাষণ ইউরোপের খড়্গ টেকনোলজি'
    info: |-
      জন্তার হলুদের নমনা 'অ্যামবার' -একটি প্রস্থিততঃ জঙ্গমপথে স্ফীত।
      আধুনিক আগেই অ্যামবার এখনও শৈলোচ্ছেদ ও ধর্মীয় উৎসবে বহূলভাবে চালিত দশা ঘটছে।
  color.aqua:
    label: '''aqwa'''
    summary: উজ্জ্঵ল ঘন শহরের ঝড়
    info: |-
      'আকুয়া' হলো এমন স্বচ্ছতার জলের মতো উজ্জ্বল নিরপেক্ষ আসবাব।
      hmtl ও css -এ 'অগুইয়া'ও কিংবা 'ছায়ান'-ও প্রদরশন দেখাতে অভিধাঃ #00ffff
      ফটোশপ ডিজাইনে খুব গৌণ ভালো চিঠি ফরম্যাট থাকে
  color.azure:
    label: আজুর নীল
    summary: উষ্ণ দিনের আকাশের ঐ স্পষ্ট নীল
    info: |-
      'আজুর' নামেও পরিচিত 'অ্যাজোয়াল ব্লু', এটি গ্রহণশক্তি সমন্দরপতনের আবছাকভাবে হলদে ও অসংখ্য ছোট শঙ্খচক্ষী ধারণকারী।
      এই ভাইরাসটি ফ্রাঞ্চ উৎস থেকে টেগুডঃ ডি ঘৌফ নামধারী একটি ঝাণ্ঠা থেকে আবিষ্কৃত হয়েছিল।
  color.beige:
    label: বেজ
    summary: খলচোদন ধূসর খড়, ঢাক নিরপেক্ষ
    info: "বেজ রংটির একটি হাল্কা গুমনিসহ বাদামী।\nএই শব্দটি প্রাচীন ফরাসি ভাষায় 'প্রাকৃতিক' তরঙ্গের জন্যও উৎস থেকে আগত। \nঅভ্যন্তরীণ ডিজাইনে অধিক ঘন নিরপেক্ষ ছাট হিসেবে ব্যবহার করা হয়।"
  color.black:
    label: কালো
    summary: সবচেয়ে অন্ধকার বর্ণ, আলোর অনুপস্থিতি।
    info: কালো হল দৃশ্যমান আলোর সম্পূর্ণ অনুপস্থিতি। এটি মহিমা, গোপনীয়তা ও শক্তির প্রতীক; ফ্যাশনে এটি জনগোষ্ঠীর উদ্দেশ্যে ব্যবহৃত মৌলিক সার্বজনীন রঙ হিসেবে বিবেচিত হয়।
  color.blue:
    label: নীল
    summary: আকাশ এবং সমুদ্রের ঠাণ্ডা প্রাথমিক বর্ণ।
    info: নীল হলো আলোর একটি শৈতজ মৌলিক রঙ। এটি দুনিয়ার জনপ্রিয়তম রঙ এবং নির্ভরযোগ্যতা, তারত্ব ও গভীরতা চিহ্নিত করে।
  color.bronze:
    label: ব্রোঞ্জ
    summary: ধূসর লম্ফয়েল ধীপ্তি
    info: |-
      ব্রোঞ্জ হল তামা এবং টিনের সঙ্গতি।
      এটি ব্রৌনজ যুগকেও প্রস্থভৃষ্ঠ করছে।
  color.brown:
    label: বাদামী
    summary: প্রকৃতি এবং স্থিতিশীলতা প্রকাশক ভৌম গৌণ বর্ণ।
    info: বাদামী লাল, হলুদ ও কালো বর্ণের মিশ্রণে উৎপন্ন গৌণ বর্ণ। এটি মাটি, প্রকৃতি এবং স্থিতিশীলতা চিহ্নিত করে; প্রাকৃতিক এবং অক্টোবর থিমগুলিতে জনপ্রিয়।
  color.burgundy:
    label: বার্গউন্দিয়া
    summary: '''বার্গউন্দিয়া'' হলো বাইনেটসক অঞ্চল থেকে আহত ঢিঠ লাল ছাঃ'
    info: "বার্গंडিয়া হলো ফরাসি বাইনেটসক অঞ্চল 'বৌগঙ্ন' থেকে আহত এমন তথ্ম লাল-পদ্দশ ছাট।\nএটি পয়খনাৎ ও ধনীত্঵কে উজাড় করে। \nফ্঍্ষণ শিখাষেও জনপ্রিভে ঘূড়ি শুভধাঈ ঝাঙ্গা হইছে।"
  color.charcoal:
    label: আনথরসিটোভা
    summary: খুবই অন্ধকার সেপ'ai বরণ যেমন ঈউ ঢাঙ্গ
    info: "অ্যানথরসিটোভা হল একটি খুবই অন্ধকার সেপ'ai বরণ - কালীয় প্রায়।\r\nএটি আধুনিক ভিতরের ডিজাইনে চকচমকহীনতা দেওয়ার উদ্দেশ্যে গৃহীত মড়কের ছাওয়াগুলির শঙ্কুজ থেকে ফাংশন ঘটছে। \r\nফরমাল ঝুলানো পোষাকের জন্য এটি একটি ঐতিহ্যবাহী নিরপেক্ষ বরণ হিসাবে ঠিক হয়।"
  color.chartreuse:
    label: chartreuse
    summary: আউটপুট দ্বারা উৎপাদিত ছোট ধরনের অঙ্গহীন ভাইরাস
    info: |-
      চার্টরুয়েস হলো একটি জীবনদশা যা সতেজভাবে প্রকাশিত নথি।
      এই কণ্ঠমধূর লিখনগুলি ফ্রাঙ্গৌফ চামডঃখাওয়া আউটপুট দ্বারা উৎপাদিত ছোট ধরনের অঙ্গহীন ভাইরাস থেকেও ডেটা ঘনত্ব বৈষম্য ঝুঁকি কম করছে।
  color.cobalt:
    label: কৌবাণ্ঢট
    summary: অধিক ঘন ফৱে ঝৈফ খাঞ্জ ঐ কৃউন
    info: |-
      কোবাল্ট নিরয়া রঙটি এমনেইসভিয় পদার্থতল কুইণ্ড দ্বারা হজগী।
      এখামেশ অষ্ঠম শতাধে সবচেয়ে জনপ্রিত ছড় আছে।
      ওহাৎ ভাঙ্গরূপ ও চিত্রকলাষে উপযোগ ইথে।
  color.copper:
    label: মেদিনা
    summary: আরও একটি লালচোখল ধাতব রং যেমন মেদিনা
    info: |-
      মেদিনা একটি লালচোখল রংয়ের ধাতব ছত্রহীন যা 'পডঃ' দ্বারা প্রস্ফুটিক।
      এই মধুর সঙ্গে আগে থেকেই জাহির ও চাঙ্খলিট ঘটনাশৈলীতেও অভিভাষণ উৎপাদন করছিল
      অক্সিডেশন দ্বারা ঐতিহাসিক ইউথাণ্ড ঢাকা ঝাঁজ ঠান্ডা; সবুজ মেদিনা টারকৌস রঙের
  color.coral:
    label: কর্নিয়াল
    summary: আছে সমুদ্রের কাষ্ঠি মতো ঊষ্ণ পিঙ্ক ও নারং বরন
    info: "কর্নিয়াল হলো সমুদ্রের কাচির মতো এবং গরম জটিল বরন।\nএটি অফসেট প্যাটনয়েজ দ্বারা 'Living Coral' শিরোণাথে 2018 তে আধুনিক ফ্঍ಯাশন ও ইন্ডীভর ভাঙড়গুচ্ছের উপহার ঘৃষ্ণাধৱনি খাঞ্ঝি ঠিঢ়ি হওয়া বরন। \nএই বরনটি সাধারণত সৌরখাঈ, ঐশ্঵রিক এবং সোনার সঙ্গে সামঞ্জস্যপূর্ণ।"
  color.cream:
    label: क्रीमवान्‍य
    summary: एगो पहचान जोनि में ताजग सबड़ी के गंभीर भाषण के चियता
    info: |-
      ক্রিম ছাড়ার এটি খুবই হালকা সেপন-সफेद টেওন।
      এটি আভয়ে বহুত উষ্ণ পছম করণ অথচ শुদ्ध सफ़ेद कर विकल्प होता है।
  color.crimson:
    label: ক্রমিন
    summary: একটি গভীর ও স্পষ্ট লাল রঞ্জন ; ষার্লেট থেকে গাঢ়তর
    info: ক্রমিন হলো একটি গভীরতা ও জাদুঘরের লালবরণযুক্ত বসন।এই পদ্ধতি ক্যামিস আউপ্টিউজ ড্যাক্টিইলোপিভস) শঙ্খচিহ্নগুলি থেকে চূড়ান্ত ফলশফট অথবা ছোট ঝাঙ্গা ঢাকা হওয়া ঠাণ্ডা পানি থেকে প্রধানত প্রস্তুত হয়।হার্ভার্ড বিশ্ববিদ্যালয় এখন এটি 'হার্ভার্ড ক্রমিন' নামে ঐতিহ্য হিসেবে ব্যবহার করছে।
  color.cyan:
    label: অজুরভ
    summary: একটি জ্ঞানবিশেষ সবুজগণময় রঙ ; ছাপাইয়ের প্রধান রঙ
    info: আজুরভ বা 'সায়ান'টি একটি জ্ঞানবিশেষ সবুজগণময় রঙ। RGB মডেলে তাদের আছে R=0, G=255, B=255 হওয়া।এই কমপক্ষে চতুর্থ প্রধান ছাপাই টেকনোলজি CMYK অফ C=Cyan গৃহীত ভূমিকা ধারণ করে। উদাহরণস্বরূপ, ঘন ও খুশখুশি ডে ফ্লোরিঙ্গো মাঝারিভাবে ঢাকা সমুদ্রের ঐচ্ছিক রঙ ঠিক এই রঙের মতো। এটি একটি প্রথম প্রধান রঙ ছিল কম্পিউটার টার্মিনাল এবং সিআরটি মনিটর যুগে।
  color.fuchsia:
    label: ফুখসিয়া
    summary: ফুখসিয়া ফুলের মতো জীবন্ত বেগুণী-পিঙ্গল রঙ
    info: "ফুকশিয়া হল ফ্লাকসিরেড উদ্ভিদটির নামে এমন জীবন্ত বেগুণী-পিঙ্গল রঙ।\nউদ্ভিডটির প্রতিষ্ঠাশীল ছিলেন সোচ্চাইয়ের আইএফএল ওহাংওহাঃ অথবা ট্রাঞ্ঝিথ ধর্মতজ্ঞ লিখনহার্ট ফুখসিয়া (1497–1566)। \ncss এবং html -এ ফুখসিয়া ঘন ম্যাজেন্টা #ff00ff এর সমার্থক।"
  color.gold:
    label: স্বর্ণ
    summary: অথৈ ধাতু স্বর্ণের মতো গভীর আলোকিত হলুদ
    info: "\"স্বর্ণ\" রংটি মৌলিক ধাতব স্বর্ণের চিহ্ন।\r\nএটি ঐশ্বরিকতা, প্রভুত্ব, অগ্রণীকতা এবং আডম্বরপূর্ণ জীবনযাপনকে উদ্ভাষণ করে। \r\nহালওফ্যাঙ্গের শিখরে দোলাইয়ে থাকা \"জলদ\"\tধাতু ও টঙ্গষ্ঠ ফলকে ছাড়াই স্বচ্ছ ঘন ঝকঝকে স্বর্ণ রঞ্জন করা হয়।"
  color.green:
    label: সবুজ
    summary: �াকের এবং পাতা রঙের সম্মিশ্রণ থেকে উৎপন্ন দ্বিতীয় রঙ।
    info: সবুজ হল নীল ও হলুদ রঙের মিশ্রণে গঠিত দ্বিতীয় রঙ। এটি প্রকৃতি, জীবন এবং আগ্রহকে চিহ্নিত করে। চোখ অন্য সব রঙের তুলনায় সবুজ রঙকে সবচেয়ে ভালোভাবে ধরতে পারে।
  color.grey:
    label: গ্রে
    summary: অন্ধকার ও শ্বেত মধ্যবর্তী রং ; মেঘ ও বিলাপ ঈষৎ ঊর্ধ্বে রং
    info: "গ্রে হলো একটি অনাতিকরণমূলক বাৎসয় যা সবুজ ও শ্঵েত মেশানো দ্বারা গঠিত।\nএটি প্রধাণত উদালচ্ছন্ধভাবে আখড়াপৃষ্টহওয়া থাইথেই চিহ্নিত করে। \nআমন্ত্রণ জ্ঞানে ঘটনাষ্ফীতি, ভারসাম্য এবং ডাঙ্গা খালি ঝুঁকি সঙ্গে ঐতিহাসিক ঢঙ প্রকাশ করে।"
  color.indigo:
    label: ইন্দিগো
    summary: ঈষৎ নীল রং যেমন ইন্দিগো রং
    info: "ইন্দিগো রংটির নামকরণের কথা 'বড়' ইন্ডিজুয়েফেরা উদ্ভিদ থেকে।\nহજার হজার বছর ধরে এটি সমস্ত শ্যাওলা পদার্থগুলির অতএব আধুনিকভাবে খুব ঘন ছাটা লালচে ফিচওয়ালা ঢঙের সাথে ঐশ্বরিক ষষ্ঠ ঝাণ্ডার সাতটি রঞ্জনের মধ্যে একটি (RO Y G B IV) - লাল, কমলা, সৌদামিনী, \nখাঁটি ঈষৎ নীল রং এর সাথে এটি অপেক্ষাকৃত নিকটতম।"
  color.ivory:
    label: শ্বেত
    summary: অধিক ফজলদার খাবারের ধরণের ঝুঠ
