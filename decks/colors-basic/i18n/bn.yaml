lang: bn
pivot: false
title: মৌলিক রংসমুহ
cards:
  color.black:
    label: কালো
    summary: সবচেয়ে অন্ধকার বর্ণ, আলোর অনুপস্থিতি।
    info: কালো হল দৃশ্যমান আলোর সম্পূর্ণ অনুপস্থিতি। এটি মহিমা, গোপনীয়তা ও শক্তির প্রতীক; ফ্যাশনে এটি জনগোষ্ঠীর উদ্দেশ্যে ব্যবহৃত মৌলিক সার্বজনীন রঙ হিসেবে বিবেচিত হয়।
  color.blue:
    label: নীল
    summary: আকাশ এবং সমুদ্রের ঠাণ্ডা প্রাথমিক বর্ণ।
    info: নীল হলো আলোর একটি শৈতজ মৌলিক রঙ। এটি দুনিয়ার জনপ্রিয়তম রঙ এবং নির্ভরযোগ্যতা, তারত্ব ও গভীরতা চিহ্নিত করে।
  color.brown:
    label: বাদামী
    summary: প্রকৃতি এবং স্থিতিশীলতা প্রকাশক ভৌম গৌণ বর্ণ।
    info: বাদামী লাল, হলুদ ও কালো বর্ণের মিশ্রণে উৎপন্ন গৌণ বর্ণ। এটি মাটি, প্রকৃতি এবং স্থিতিশীলতা চিহ্নিত করে; প্রাকৃতিক এবং অক্টোবর থিমগুলিতে জনপ্রিয়।
  color.green:
    label: সবুজ
    summary: �াকের এবং পাতা রঙের সম্মিশ্রণ থেকে উৎপন্ন দ্বিতীয় রঙ।
    info: সবুজ হল নীল ও হলুদ রঙের মিশ্রণে গঠিত দ্বিতীয় রঙ। এটি প্রকৃতি, জীবন এবং আগ্রহকে চিহ্নিত করে। চোখ অন্য সব রঙের তুলনায় সবুজ রঙকে সবচেয়ে ভালোভাবে ধরতে পারে।
  color.orange:
    label: নারং
    summary: লাল এবং হরিতের মধ্যে উষ্ণ দ্বিতীয়ক রঙ।
    info: নারং সম্পূর্ণত লাল ও হরি মেশানো দ্বারা গঠিত একটি দ্বিতীয়ক রঙ। এটি আগ্রহ এবং কল্পনাশক্তির প্রতীক; এই রঙের নামকরণ করা হয়েছে নারিকেল ফলের নামে।
  color.pink:
    label: রোজেন্ট
    summary: লাল রংয়ের একটি হালকা ছায়া, মধুর ও সুন্দর রঙ।
    info: রোজেন্ট হল লাল রংয়ের একটি হালকা প্রকাশ। অনেক সংস্কৃতিতে এটি নমনীয়তা, ভালবাসা এবং খেলাধূলার সাথে জড়িত।
  color.purple:
    label: বেগুনি
    summary: লাল এবং নীল থেকে তৈরি হওয়া রহস্যময় সেকেণ্ডারি রঙ।
    info: বেগুনি একটি দ্বিতীয়ক রঙ, যা লাল ও নীল মিশিয়ে তৈরি হয়। ঐতিহাসিকভাবে এটি ছিল সবচেয়ে গুপ্ত রঙ, যা রাজশক্তি এবং আড্ডা প্রদর্শন করতো।
  color.red:
    label: লাল
    summary: রক্ত এবং আগুনের উষ্ণ প্রাথমিক বর্ণ।
    info: লাল হল আলোর মৌলিক বর্ণগুলির মধ্যে অন্যতমটি। এটি শক্তি, সাধনা এবং ঝুঁকি নির্দেশ করে; অনেক সংস্কৃতিতে এটি ভাগ্য ও শক্তির প্রতীক।
  color.white:
    label: শুভ্র
    summary: সবচেয়ে উজ্জল বর্ণ, সমগ্র আলোকের প্রতিফলন।
    info: শুভ্র দৃশ্যমান অপটিক্যাল স্পেক্ট্রামের সমস্ত রঙের একইসাথে প্রতিফলন। এটি শুদ্ধতা, নির্মলতা ও নতুন শুরুর প্রতীক; অনেক সংস্কৃতিতে এটি শান্তির চিহ্নও হিসেবে গণ্য হয়।
  color.yellow:
    label: জামুনি
    summary: সূর্য এবং সোনা থেকে প্রধান তাপময় উজ্জল বর্ণ।
    info: জামুনি আলোর প্রাইমারি বর্ণ এবং অত্যন্ত উজ্জল বর্ণগুলির মধ্যে একটি। এটি হappiness, শক্তি এবং আশা চিহ্নিত করে; দৃষ্টি আকর্ষণ করতে ভালো।
