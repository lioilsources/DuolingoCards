    info: শুভ্র দৃশ্যমান অপটিক্যাল স্পেক্ট্রামের সমস্ত রঙের একইসাথে প্রতিফলন। এটি শুদ্ধতা, নির্মলতা ও নতুন শুরুর প্রতীক; অনেক সংস্কৃতিতে এটি শান্তির চিহ্নও হিসেবে গণ্য হয়।
  color.yellow:
    label: জামুনি
    summary: সূর্য এবং সোনা থেকে প্রধান তাপময় উজ্জল বর্ণ।
    info: জামুনি আলোর প্রাইমারি বর্ণ এবং অত্যন্ত উজ্জল বর্ণগুলির মধ্যে একটি। এটি হappiness, শক্তি এবং আশা চিহ্নিত করে; দৃষ্টি আকর্ষণ করতে ভালো।
