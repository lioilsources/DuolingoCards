title: Bazaj koloroj
cards:
  color.amber:
    label: amber
    summary: Varma oro-flava koloro similas al mineraĵo amber.
    info: Amber estas varma oraflava koloro nomita laŭ mineraloj ambaraj (petrifikis rezino). Amber estis valorata en antikveco pro sia decorativa kaj spiritala graveco. Ambra signallampeto (hela sur trafiko lampo) ĉie simbolas atenton.
  color.aqua:
    label: akvu
    summary: Klare difinita verdo-blauza koloro asociita kun netraha akvo.
    info: Aquamarine estas klara blua-verda koloro uzata en akvo-pensoj por pentrikiĝi al la publiko pri ĝia simbolo de pureco kaj vivdonaco. En HTML kaj CSS 'aquamarin' egalas kun '#00FFFF'. La nomenklaturo originas el latina lingво kie "aqwa" signifis akvon.
  color.azure:
    label: blua
    summary: Klara cerulecaĵo similanta al verda Ĉielo.
    info: Azura bluo estas klara kaj viva cian-koloro simila al la somera ĉielo; ĝia nomo devenas el minero lapis azurius uzita en mezepoko por piktadoj kun Madonnaj sur blankumiloj. Azura bluo troviĝas ankaŭ inter herboj multe da landoj inkluzive Francio, Israelo kaj Finnlando.
  color.beige:
    label: beĝo
    summary: Klara sabla bruna; varmegenerala.
    info: Beĝo estas klara kaj varma koloro mezuranta kun blanko kaj ora bruno. Ĝi devenas el malnova franca vorto por natura ondo. Ofte uzata en interna dezignado kiel varmega neŭtrala bazo.
  color.black:
    label: nigra
    summary: La plej malhela nuanco, absenco da lumo.
    info: Nigra estas la manko de ĉiu videbla lumo. Simbolas eleganteco, mistro kaj potenco; en modeto oni rigardas ĝin kiel bazan universalan kolorton.
  color.blue:
    label: blaŭa
    summary: Frigida primara luma koloro simila al tiu de nebulo.
    info: Blua estas kroma frigida lumkoloro de la spektro. Ĝi establas plejeblata aliaĵo en naciiĝaj landoj kaj signifas pacemeco, fidelecon kaj profundon.
  color.bronze:
    label: bronzo
    summary: Mallumflava metalkoloreco karakteriza por kombinaĵo inter kupre kaj stanato.
    info: Brongalo estas malluma flaveca metala koloro simila al la legno de kupro kaj stano. La Bronzkolo periodo (~3300–1200 antCHR) ricevis sian nomon el tiun metalon. En Olimpikoj ĝi reprezentas trian rangon per bronza medalio; statuo en publika spaco ankaŭ povas esti farita el tiaj materialoj.
  color.brown:
    label: kasta
    summary: Tera sekunda kolo por ligno kaj sol.
    info: Kastanokoloro estas sekunda kolo formita per miksiĝado de ruĝa, flava kaj nigra. Ĝi simbolas teron, naturon kaj stabilon; ĝi popularas en naturaj kaj varmestunaj temoj.
  color.burgundy:
    label: burgoñia
    summary: Mallumruĝa burgoňa vininkoloreco.
    info: Burgoña estas malluma ruĝpurpora koloro nomita laŭ vinberga regiono Burgoño en Fratio. Ĝi evokas rubinan vinon, luksan kaj riĉecocon. En modaĵoj temas pri unu el plej popularaj oktobrajn jarmarkado.
  color.charcoal:
    label: antarakito
    summary: Tre malluma graja kolo similanta lignokokinon.
    info: Antarakita estas tre malhela griza koloro preska nigra, simila al lignokokino. Ĝi estabas populara en modernej internaj dekoracioj kiel alternativo kontraŭ nigraro. En modoj ĝi funkcias kiel baza neutrala tono taŭga por formalvestado.
  color.chartreuse:
    label: flavverdeta
    summary: Viva koloro mezurita ekde flavo al verdeto.
    info: Khartrezose estas vivanta koloro inter flava kaj verda en la spektro. Ĝi venas de herba liqueuro nomata Khartres el monasterio kun sama nomo en Francujo.
  color.cobalt:
    label: coblta
    summary: Viva meztma bluo simila al cbalta pigmenteble.
    info: Coblta blua estas vivanta kaj saturita blekaĵo nomiĝante laŭ kemioelemento cblto (Cb). Ĝi estis unu el plej popularaj bledaj pignmentoj en pintarado dum dekadroko jarcento. Uzata por ceramiko, vitro kun artefarbistikeco.
  color.copper:
    label: cuprea
    summary: Kolorego similanta al brilo de pura kupreto.
    info: Rufbruna metala koloro simila al la lumo de kupro estas konata kiel rufkupa; ĝi referencas al la elementon Cuprum kun signifo 'rudo'. Kupro estis unu el la plej frue uzitaj metaloj dum la kupra epoko antikve. Malnovaj kupraj tegmentoj ŝanĝigas sian kolorton per oksidigo formante patinojn kiuj donacas verdetan efekton nomitan turkoz-verda.
  color.coral:
    label: coralo
    summary: Viva rosakolorecaj/orangulbaro simila al marinkoralo.
    info: Corala estas varma kaj vivanta baro mezurita inter orangulo kaj rozkoloro nomiĝas laŭ mar-koraloj. Ĝi estis tre populara en somera stilo kaj interna dezignado dum multtempo.
  color.cream:
    label: kremono
    summary: Tre klara flavblanka kiel krėm.
    info: Kremo-koloras estas tre klara kaj varme brila flaveca nuanco simila al ĉiutaga kremaĵo de frishega krēmo. En interna arto oni uzas tiun nombron por donacii plian varmon ol purpurhela blankeco. La tono troviĝas en la spektro inter blanko kaj elofino.
  color.crimson:
    label: crimson
    summary: Profunda saturita ruĝa koloro pli malluma ol rubina.
    info: Crimsono estas profunda vivanta ruĝa koloro nomita laŭ crimo, rufia pinto pigmente. Tradicie ĝi estis farata el Dactylopius coccusi nometida insectoj. Ĝi estas Harvard-universitatoj koloro.
  color.cyan:
    label: ciano
    summary: Viva verdkoloreca koloro; baza printada kolo.
    info: 'Azurola estas vivanta blua-verda koloro kun valoroj en la RGB modelo de Ruĝo: 0%, Verdo: 100% kaj Bluo: 100%. Ĝi apartenas al unu el la kvar bazkoloroj uzataj por presado per sistemo CIELMYKO (kie ''CIANO'' signifas cian). En naturo oni trovas tiun saman tonon sur klara tago dum malprofunda trópika marbordo.'
  color.fuchsia:
    label: Fuksia
    summary: Ruĝpurpurecaj floroj de fuksioplantaro.
    info: Fuxsia estas viva ruĝpurpora-koloro nomita laŭ la plantofukcia (Fuchsia). La planta ricevis ĝin honore al germana botaniisto Leona Hart Fuksio (1501–1566). En CSS kaj HTML 'fuksia' egalas al magneto (# FF00FF) .
  color.gold:
    label: oro
    summary: Profunda lumigita flava jube ol pretia metaolo.
    info: Oro estas la koloro de pretioza metalo oro; ĝi simbolas rikecon, prestiĝon, sukceson kaj grandolegecojn. En heralddeso en uzatas unu el du precipe gravaj materialoj - oro kaj arĝento.
  color.green:
    label: verdokolo
    summary: Koloreco da herbo kaj folioj.
    info: Verda estas duanara koloro formita per miksiĝado de blua kaj flava. Ĝi simboligas naturon, vivadon kaj freŝecon;
  color.grey:
    label: graico
    summary: Kolore inter negreco kaj blankeco; la koloro de norloko kaj konkreto.
    info: Graeco estas akroma koloro kreita per miksiĝado de blanka kaj nigra. Ĝi establiĝas pro sia netecon kaj senstreĉemon. En psikologio graeco simbolas neutralan ekilibron sed foje povas signifi mankon da emocioj.
  color.indigo:
    label: koloro-indiko
    summary: Profunda malsupra-verd-flaua kiel indiku.
    info: 'La koloro indiko estas profunda malverda-blua naskiĝinta el la planto Indigofera. Dum miloj da jaroj ĝin rigarditis unu el plej valoraj tekstilbarvoj.Ĝi ankaŭ apartenas al sepa hejm-kolores de arko (ROGIBIV): ruda, oranĝa, flava, verda, blanka, indikola, viola.'
  color.ivory:
    label: ivorina
    summary: Krema blankeco simila al dentoj de elefanto; pli varmega ol purblanka.
    info: Ivorino estas malvarme flaveca, krema blanko. Ĝia nomo devenas el ivorio - la dento da elefanto. Oni uzas en modeto, desegno kaj por priskribado de poko.
  color.khaki:
    label: kahki
    summary: Malbrila klare bruna flaveca nuanço uzata en milite.
    info: Kahki estas malbrila klara kastanie-flava nuanco popolarigita de la angla armeo en Indo dum la dudeka jarcento. La vorto origine venas el Urdu/aŭ Hindio signifi „pulveron“ aŭ „lamin“. Ĝi estis baza pakaĵkoloro por militaj uniformoj kaj turobekigo.
  color.lavender:
    label: lilaka
    summary: Tre hela malverda nuanco simila al florpetaloj.
    info: La lavendola estas delikata helppurpleo nomita laŭ herbo Lavando (lavendo). Ĝi sugestas pacon, purecon kaj Provenco-kamparojn de Fratio. En aroma terapio odoroj asociitaj kun relakso kaj dormado.
  color.lime:
    label: lime
    summary: Viva flavo-verdema kiel de limespino.
    info: Limeo estas klara kaj saturita flave-verda koloro nomata laŭ citrilo - limespino. Ĝi havas pli da flavan tonon ol folia verdeto kaj tial ŝuldas sian vivemon al tiun propraĵon.
  color.magenta:
    label: magente
    summary: Viva rubinokarmezna koloro; mezinter reto kaj malblua.
    info: Magenta estas vivanta koloro inter ruĝo kaj bluo sen ekzistado de egalas ondolongo en la videbla lumospektraĵo. Ĝia nomo naskis post batalo apud Magento (Italio), okazinta en 1876-a jaro.
  color.maroon:
    label: kastaña
    summary: Malhela rubeola kolo-ro; profunda vinroĵa.
    info: Kastana (karamelo) estas malluma ruĝ-bruna koloro nomita laŭ kastroloj (carmesin en hispane). Ĝi estas populara por modeto, sportsvestoj kaj unuiormoj. En anglalingve 'karmono' ankaŭ povas signifi homon isolitan sur malplena insulo.
  color.mauve:
    label: violeo
    summary: Malforta rubino-viola; parda bluviolakula.
    info: Violeto (mavo) estas malvarmegaj koloro kun tonoj de ruĝeco kaj blankumo ĝis violeto. La nomo venas el la franca 'mauve', rilate al plantejo Slezoniko (Malvo silvestra).Ĝi ankaŭ establiĝis pro unua sinteza dikaĵo - anilina violo kreita per Willian Perkins en 1856.
  color.mint:
    label: matosa
    summary: Tre klara verda kiel folioj de matos.
    info: Matosa estas frisca kaj klara verdora koloro nomita laŭ mentolo (menthe). Ĝi sugigas purecon, freŝecon kaj refreĉigon.
  color.navy:
    label: marblua
    summary: Tre malluma azura kiel nokta maro.
    info: Marble bluo estas tre malhela ruĝokoloro kiu estis uzata en uniformoj de la Brita Reĝaj Mararmejro dum la 17-a jarcento. Ĝi estas unus el plej popularaj bazaj koloroj por vestado kaj formalaj plumboj.
  color.ochre:
    label: okriv
    summary: Tera flavbruna kolo simila al netaŭga mineralpigmento.
    info: Okriva estas tero-baza flave bruna koloro nomita laŭ la pigmeno 'okra' (ferhidrido). Ĝi estis unu el plej frue uzataj pintojn de homoj en spelon pentriko dum praaj tempoj. En naturo troveblas tiun mineron kiel okrapiedon interteren.
  color.olive:
    label: oliva
    summary: Malbrilflava verdaneco simile al olivaruo.
    info: Olivo estas malbrila flave-verda nuanco nomita laŭ olivo arbo (Olea europaea). Ĝi estis klare uzata en milito kaj eksterdomaj vivostilo pro tia ke ĝi konfuzu kun naturo.
  color.orange:
    label: orange
    summary: Varma duaranga koloro inter la rudoj.
    info: Orange estas varma dua nombro kreita per miksiĝo de ruĝa kaj flava. Ĝi simboligas emziasmon kaj kreadon;
  color.periwinkle:
    label: periwinkle
    summary: Helblaŭvioza kiel floro el vinco.
    info: Periwiginko estas malvarma kaj klara bluokoloro kun violetkonsisto nomita laŭ plantejo Vinca minor. Ĝiaj tonoj troviĝas inter helblua kaj lavendora. Popularigis sin en modaĵindustrio pro sia subtila kaj rompega ekzistenco.
  color.pink:
    label: roza
    summary: Klara nuanço da rubejo, delika kaj malgranda koloro.
    info: Roza estas klara tono de ruĝa koloro. En multaj kulturoj ĝi asociigas kun amikeco, romanco kaj ludemo.
  color.purple:
    label: purpora
    summary: Misteruliga duopa koloro elvenanta el kombinacio inter purpuro kaj azulo.
    info: Purpura estas sekunda koloro kreita per miksiĝado de ruĝo kun bluo. En historio ĝi estis pleje la kostema kaj ligit al reĝeca potenco kaj lukspezo.
  color.red:
    label: ruĝa
    summary: Varma baza kolo de sango kaj fermo.
    info: Ruĝo estas unu el la tri bazaj lumkoloroj. Ĝi sugigas forton, pasion kaj danĝeron; en multaj landoj simbolas bonvolon kaj fortikecon.
  color.rose:
    label: roskolo
    summary: Mola rosakoloreco simila al folieto el roza flor.
    info: Roseo estas mola kaj dika rozokoloro nomita laŭ la floro de rozo. Ĝi diferenciĝas de pingo (pale rosa), ĉar 'roze' plu havas malplian intenson sed pli da ruĝeco ol pinto.
  color.salmon:
    label: salmono
    summary: Varma kaj klara rozo-kastana kiel salmonto.
    info: Salmonroza estas varma kaj klara rosa-naranĝeca nuanco nomita laŭ la flanko de sardino. Ĝi havas plian varmecon ol korala koloro kaj establiĝis en modeto pro sia subtila alturnativo kontraŭ purpurkoloro. En interna dezainado tio kreacias amikecan atmosferon.
  color.scarlet:
    label: scarlato
    summary: Klarega rudo-orangeco.
    info: Scarletto estas klara raudorĝena koloro nomita laŭ pigmento scarlate. Ĝi estis pli hela kaj malpli orangeca ol rubino-koloreca. En historiajn tempojn ĝi signifadis luksajn ruĝajn tekstilojn.
  color.sienna:
    label: sienza bruno
    summary: Ruba bronka terpigmento el Sienie.
    info: Sienza bruna estas tero kiu havas ruĝ-brunan coloron nomitan laŭ Itala urbo Siene. Raw sienne brunas pli flavbrunaj dum paŝtita sienne estadas ĉefe rubrabronaj. Tio estas populara pigmente en Renesanco pentraĵoj por varma naturo de tiu specifo.
  color.silver:
    label: argenta
    summary: Lumplena griza kiel la metalo argento
    info: '{"info":"Argento estas metala koloro simboliĝanta la prezan mineraĵon argenton\rSimboligas modernecon, elegantecojn teknologiajn desegnaĵojn industriajn \rEn heraldeco ĝi estas dua metalemente en olimpiadoj duan lokon reprezentante \rAŭto kun argentkonservita pinto estis plejebla veturilo-koloro multaj landoj"}'
  color.tan:
    label: tan
    summary: Klare bruña koloro similanta sunbatan pokon.
    info: Tan estas klara bruna koloro simila al tero aŭ sunbrulinta poko. Ĝia nomo devenas el la procezo por traktado da peletraĵoj per tanĝiloj (sunbato). Ĉar temas pri malpli forta beźokolo sed iomete pli malluma kaj flav-brunula ol tiu lastatempe.
  color.teal:
    label: tealo
    summary: Blua kuŝanta sur verda simila al marbildo.
    info: Tealto estas nomita laŭ malgrandaj ŝelduploj de Anas Creca kun tiajn flugilojn; ĉi tiun tonon oni trovas en pli alta parto de turkozspektro. Populara en grafa desegno pro sia kontrashteco al orange.
  color.turquoise:
    label: turkeza
    summary: Azur-verda kiel tropika marakvo.
    info: La koloro turko estas viva azura naskiĝinta de la meze orientaj pietroj nomitaj perlitajo. Ĝin oni aprezis en malnova Egipto, Perzio kaj Nordameriko por ties brilo kaj signifo. En arto kaj interno-dizajno tiun vivan bluan verdan uzatas por donacigi netemon, refreŝigon kaj modernejson.
  color.vermillion:
    label: Verdilo
    summary: Ĉarma rufianoranca koloro simila al verdilpigmento.
    info: Vermilio (ruĝmerkozio) estas ĉarma rufia naranĉo kolorita pigmente nomiĝanta laŭ mineralo ruĝmerkarbo (HgS). Tiu estis unu el plej uzataj rubaj pigmentoj dum historia epoko. Ĉina vermiljo estas toksika mineraĵo; hodiaŭ oni anstatauxigas per sintezitaj preparatoj.
  color.violet:
    label: violoka
    summary: Blua-violoka koloro; fine de la videblspektro.
    info: 'Violoka estas koloro ĉe la fino de videbla spektro kun ondolongo proksimume inter 380–420-nanometraj.Ĝi ricevis nomon elfloro Violakokvio (geniko Violo). En percepcio diferenciĝas forpurpora: violoko pli malproksima al ruĝo ol porpuraj.'
  color.white:
    label: blanko
    summary: La plej klara koloro reflektanta tutan lumon.
    info: Blanka enhavas ĉiujn videblajn spegtralajn nuancojn samtempe. Simboligas purecon, senkulpecan propron kaj novkomencojn; en multe el la kulturoj temas pri paco.
  color.yellow:
    label: flavulo
    summary: Klara varma primitiva luma kolo rilate al solaŭro.
    info: Flava estas la prima koloro de lumo kaj unu el plej klare brilantaj koloroj. Ĝi simboligas feliĉon, energion kaj optimismon kaj bone atentrigatan.
