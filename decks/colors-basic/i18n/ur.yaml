lang: ur
pivot: false
title: بنیادی رنگ
cards:
  color.amber:
    label: جنتر
    summary: معدنیات جنتروا کی طرف سے وجود میں آئی ہوئی تازہ۔
    info: جنتارووا جنتر کی طرح ایک تپتی سرخ۔ زرد رنگ، معدنیات جنتروا نام لے کر بنائی ہوتی ہے۔ قدامت پسند دوران قدر دانت بطور علامت و معنوی مواد استعمال کرتا تھا۔ جنتراور فلش لاٹ (چمکدار روشنی والا حلقہ) عام طور پر خبردہی کرنے والی شمع کے نقشے کی علامت ہے۔
  color.aqua:
    label: اکوا
    summary: پانی کی خالص شفاف ترنگ
    info: '''اکوا'' ایک روشن سبز-ہرے رنگ کی پانی والی قسم ہے؛ ووب مینوں، جسٹل اور فونٹس میں عام طور پر استعمال ہوتا ہے۔'
  color.azure:
    label: ایزر
    summary: جمندار موسم صاف آسمان کے مثل
    info: ازیورووا مڈرہ (اِزر اسکائے بلو )، جارحانہ طاقت ورانه نظر آن والی سبز کشادگی والا رنگ چھ۔ لاجورت (لاپس لا زولی) پسندازا خام معدنیات کے بعد تخلص حاصل ہوتا ہے۔ فرانس، اسرائیل، فناند کے علامتوں میں شامل ہوتا ہے۔ رینئسانس دوران لاجورت ذہن سے قیمتی دستاویزوں کے استعمال کرتا تھا۔
  color.beige:
    label: بِݙُزوَّا
    summary: ایک گرم خام روشن لمبا رنگ
    info: بیج کا رنگ ایک روشن، دماغ بھرے والارنگ ہوتا ہے جو سفید اور زرد مائل نâu تک پہنچتا ہے۔ یہ فرانسیسی الفاظ سے ماخوذ ہے جو قدرتی لہروں کو ظاہر کرتا ہے۔ انٹیرئر ڈزائن میں عام طور پر استعمال ہونے والا یہ گرم خام وسطی رنگ بنیادی عنصر کے طور پر استعمال ہوا کرتا ہے۔
  color.black:
    label: کالا
    summary: سب سے تیز بار، روشنی کی عدم موجودگی۔
    info: کالا دیدہ جانے والی تمام روشنی کی غیر حاضری ہوتی ہے۔ یہ عمدگی، راز اور طاقت کو ظاہر کرتا ہے؛ فیشن میں یہ بنیادی عام بار جانا جاتا ہے۔
  color.blue:
    label: نیلے رنگ
    summary: آسمان اور سمندر کا سرد بنیادی رنگ۔
    info: نیلا روشنی کا سرد بنیادی رنگ ہے۔ دنیا بھر میں یہ سب سے زیادہ پسند کیا جاتا ہے اور آرام، اعتماد اور گہرائی کو ظاہر کرتا ہے۔
  color.bronze:
    label: broncovā
    summary: ایک تیردوزندہ زرد قہواٗئی معدنی رنگ
    info: برانزوفا ایک تار کشادہ زرد قهوائی معدنی رنگ ہے جو بالواسطہ طور پر برونze، چمڑے اور سرب کے آلائیدہ حالت کو ظاہر کرتی ہے۔ بلاتھل برآمد (تقریباً قبل المسیح) ان دنوں کے لئے مشہور ہے جب لوگوں نے فولاد استعمال شروع کیا۔ اولمپک مقابلے میں یہ رنگ ثالث مقام کی علامت ہوتا ہے۔ عام مقامات پر واقع مجسمّات عمومًا اس رنگ کے ہونٹے ہوتے ہیں۔
  color.brown:
    label: براؤن
    summary: زمین اور لکڑی کی زمیندارانہ دوسری قسم کی رنگت۔
    info: براؤن، سرخ، پیلا اور کالا ملائے جانے سے وجود میں آئی ہوتی ہے۔ یہ زمین، طبیعت اور استحکام کی نمائندگی کرتی ہے؛ یہ موسم خزاں اور طبعی موضوعات میں عام طور پر استعمال ہوتی ہے۔
  color.burgundy:
    label: بُرجِنْدوَلّٗ
    summary: چمکدار بنجرندا رنگت جیسا کہ برجندا سے آتا ہے
    info: "بورگوندی فرانس میں وائن کے علاقہ بورگنڈی سے نام لینے والی ایک تار دھوپ روسا۔ \nیہ لوئر، جواہرات اور غنا کی طرف بلند کرتی ہے۔\nایشوز میں یہ موسم خزاں کی تمام مشہور شاندار رنگت ہے۔"
  color.charcoal:
    label: چرب
    summary: سرخ رنگ والا درجۂ حرارت
    info: انٹرا سیتوفا انتہائی تار دوں شدہ نمایندگی کرنے والی سرخ رنگ، جس میں بالکل بھورا لگتا ہے۔ یہ عصر حاضر کے اندریئرو داخلی طرزِ زندگی میں بلکہ کالے رنگ کے مقابلے میں عام استعمال ہوتا ہے۔ فشن میں یہ بنیادی خاموش رنگ مناسب ہے جبکہ غیر ضروری پختہ آلات میں استعمال کرتے وقت۔
  color.chartreuse:
    label: زردوزرقاب
    summary: ایک زندہ رنگ جو زرد اور سبز کے درمیان ہوتا ہے
    info: چارٹریوس کا رنگ اس طرح سے زردہائے درمیان میں موجود ہوتا ہے جو بالکل نفیس حالت میں دھواًن پیدا کرتا ہے۔ اسم کا تعلق فرانسوی آبشارت عمارتوں والے شہر 'chartreuse' سے ہے، جہاں باغات بنائے گئے تھے۔ یہ لوگوں کے لحاظ سے واضح دشمن ذرا وضاحت کرنے والا رنگ ہے۔ چلتے وقت استعمال ہونے والے بلبواؤں اور کھلاڑیوں کے خصوصی علامات عام طور پر چارترواس کولر انداز میں ظاهر کرتے ہیں۔
  color.cobalt:
    label: کوبلٹ کا رنگ
    summary: سب زندہ درجۂ حقارت والی بلو جیسا کہ کوبلٹ کا رنگ
    info: کوبلٹ کیلے اس وقت متعارف تھا جب سائنس دانوں نے عناصر کوبالٹ کا اندازہ لگایا۔ چونکہ یہ رنگ بڑی خوش فہمی سے بناتا ہے، تو وینسنٹ ون ݙوؤن کے آرٹ پرج مرکوز طور پر استعمال کرتے تھے۔
  color.copper:
    label: میڈنا
    summary: ایک رُدّی شاداب برون مٹل کولر جیسا کہ میڈن
    info: میڈنگا رuddy براون مٹل کولر اس وقت تک جھلسے والی قلعہ سے متاثر ہوتا ہے، جو لوگوں نے پہلا ف metallurgy لال سنگ مرمر دوران استعمال کرتے تھے۔ قدیم معدنی چھتوں کی آکسائیشن (پاتینا)، ان کی زردی دشوار؛ ہیراسفروتی طور پر سبز ہوا۔
  color.coral:
    label: کورالووا
    summary: '''مرجان جیسا'' چمکدار صحت مند زرد-بادامی رنگ'
    info: |-
      کورالووا ایک زنگارا رنگ ہے جس کا نام سمندری مرجان پر رکھا گیا، واقعی تپت برشروں والا۔
      اس رنگ کو موسم گرم کی فشن اور انٹیرئر ڈزائن میں خاص طور پر استعمال کیا جاتا ہے。
       Pantone نے ۲۰۱۹ء کی دنیا کی عالمی برائند ' لائفینگ کوروال' قرار دیا۔
  color.cream:
    label: کیرمووا
    summary: ایسی خوش ذوق زرد سفید قسم کا رنگ جیسا کہ مکھنا
    info: کریم کا رنگ انتہائی روشن زرد سفید شدّت والا ٹون ہوتا ہے۔ نام تازہ دودھ والی مکھن جان بچھڑوں کے رنگ پر مشتمل ہے، اندریئورز ڈیزائن میں صاف سفید کے مقابلے میں گرم حلقہ فراہم کرتا ہے۔
  color.crimson:
    label: |-
      کِروْماݢنا
      (قلم)
    summary: سباقلاً خون آلود قرمزی؛ چرنولاء سے درجۂ حرارت کمزور
    info: |-
      کرمنیووا اس کرمین نامی سرخ رنگ والے پائیدان فرشتہ مادّے کے بعد لازم طور پر تجویز شدہ زرد، جلندار قرمزی چھاؤں ہوتا۔
      ٹراڈیشنل طور پر کمرن بحث د‍ٗ واسطے نوبالش (داکٹلوئوس کُؤَسس) نامی چربڑے سے بنایا جاتا۔
  color.cyan:
    label: ازورووا
    summary: ابھرتا سرخ زلد رنگ؛ ایک بنیادی رنگ
    info: |-
      آزر کی بارشہ ابھرتا سرخ زرد رنگ ہے؛ آئی جی برائے مانٹرنل فائلز میں اندازن R:0، G:255، B:255۔
      ایکس نما تینوں پروڈکشنز کمپنیوں کے لحاظ سے بنیادی رنگوں میں شامل ہے (جی= سائن)
      طبیعات میں چند دنوں کے دوران شفاف دریاؤں کے علاقوں میں موجود ہوتا ہے。
      CRT موورنز کے حوالے سے اصل طاقت وراندوزی کا حصہ بنا
  color.fuchsia:
    label: فکسیاء
    summary: '''فلوشئِه'' کے پھول کے مثل فلوفر-پینک رَنگ'
    info: فکسیا اُن رَنگ کو بولتے جو فلوور مچھروں سے مشابہ ہوتا، نباتات 'فلوشئِه' پر مشتمل ہوتا۔ یہ رَنگ اسم بلبند لائون هارٹ فوسز (١٥٠٢–۱۵۶۷) کے بعد حروف تعبیر کرتا۔ ووب طرز زبان میں فکسیا منجنا کا معادل ہوتا۔ یہ شاندار رَنگ عمدہ خامداغم، آسمان دوزخ اور بالغ فن کے ساتھ مرتب ہوتا
  color.gold:
    label: سب زلائل حسن
    summary: بادامی شدید روشن
    info: سونا وہ رنگ ہے جو قیمتی معدنی سونا کو ظاہر کرتا ہے۔ اسکولز بھارت، فرانس، برطانیہ سمیت دوسروں کے تعلق نظر آتا ہے۔
  color.green:
    label: سبزی
    summary: چارہ اور پتّوں کا رنگ، نیلے اور زرد سے بننے والی دوسری قسم کا رنگ۔
    info: سبزی نیلا اور زردرنگ ملانے سے بنتا ہے۔ یہ فطرت، حیات اور تازگی کی علامت ہے؛ آنکھ تمام رنغوں میں سبزی کو سب سے زیادہ حساسیت سے دیکھتا ہے۔
  color.grey:
    label: شفاف
    summary: ایک درمیانی رنگ؛ بادلوں اور منجمد مواد کا رنگ
    info: سیاہ اور سفید کے ملائش سے بنن والی شاداب رنگ، جو نتھرال انداز میں پیش آتی ہے۔ نفسیات میں چکناپلاٹ برابرت، توازن اور بعض وقت بلند فضا کی علامت ہوتی ہے۔ اس کے دبئی قسم کانتراسٗٹ اور روشن طاقت بالکل سفید لگتا ہے۔
  color.indigo:
    label: اندروغوبالا
    summary: ایسا غلظ شدت والا بالافاءلو رنگ جو اندرو ورنم سے مشابہ ہوتا
    info: |-
      انڈیگو اسٹرکت انڈائجینوفر کے پودے سے نام لے رہا تھا، جو عميق بلوا فائلوں والی خصوصی طور پر قيمتي رنگ دار ماده ۔
      hزاروں برس حضرات انڈیجو آسمان کی روشنی کے زیر استعمال سب سے زائد قدردار رنگ دار مواد تھا۔
  color.ivory:
    label: سلوانووا
    summary: '''ایرو'' والے فانوس کے دات کی طرح سفید؛ صاف سفید سے چند درجے مختلف'
    info: |-
      سلاونووا نا برشے کی طرح ایک سفید رنگ جبکہ تھورا زرد مائل ہوتا ہے۔
      اس کا نام 'ایورو' پر مشتمل ہے، جو فانوس کے دانت کے لحاظ سے آتا ہے。
      یہ موڈز، ڈیزاٸن اور خود کپڑوں کے وضاحت میں استعمال ہوتا ہے۔
  color.khaki:
    label: کھاکی
    summary: '''روشن قہوا زرد رنگ؛ فوجی موسمیاتی رنگ'
    info: کھاکی اس وقت کے برطانوی فوج نے برصغیر میں تقریباً سترہويں صدی عالمگیر طور پر عام کردہ دبلا پتلا روشن قهوائی زرد رنگ ہوتا ۔ لفظ 'خاک'، جس کا معنی خاک و مردار ہے، سندھی / ہندی الفاظ سے ماخذ ہے ۔ یہ فوجی ٹونسوالوں اور موسمیاتی آلات کرنے والی بنیادی رنگ ہے ۔ 1980ء کی دہائی سے کھاکی شلوارزمانہ حاضر کے اندازمیں مستقل موجود رہتا ہے
  color.lavender:
    label: لوندلوا
    summary: ایک بہت ہلکا بنفشی رنگ جیسا کہ لواندولوا کے پھول
    info: لیونڈلو کا رنگ اکثر لہو نامی پودے سے ملتا جلا ہوتا ہے، جس کا تعلق Lavandula قسم کے درختوں سے ہے۔ یہ آرام دہ حالت، صفائی اور فرانس کے Provence علاقے کی تصاویر کو بھڑکاتا ہے۔ الائمنترپی میں لوئندولوا کی خوشبو عام طور پر آرام اور نیند کے ساتھ منسلک ہوسکتی ہے۔ چاران والے بالغوں کے انداز اور سالون کی زبان میں یہ رنگ مشہور ہے
  color.lime:
    label: ليمٗتيكووا
    summary: سبز-زرد رنگ مثل لمونا
    info: لائمٹکووا لہجے کی اس سبز رنگ، جس نام سے پھلوں میں موجود لمونا کر دیا جاتا ہے۔ چاران والی سبزی کے مقابلے میں زیادہ شدید ہوتا ہے؛ یہ زرد روشنایی بڑھتی ہے۔ تصاویری طور پر فعال ذرا حوالہ وغیرہ کرنے والا رنگ عام استعمال ہوجاتا ہے۔ عالمی تحفظ کے کپڑے عمومًا بلند درجۂ قابلِ تماشائی خصوصیت کی وجہ سے لايمٗتيكُوا ہوتے ہيں
  color.magenta:
    label: پروورووا
    summary: ایک زندہ بالغ صفت بلبلی ہے؛ سرخ اور نیلا کے درمیان
    info: پروورووا (میگنٹا)، سرخ اور نیلا کے درمیان زندہ رنگ، دکھائی دینے والی طول موج کسی برق ترتیب پر مشتمل نہیں۔ اسماء لڑائی عظیما فرانچ جارحیت آئٹالی میں واقعات حادثاتی مناسب استعمال شدہ ہوتا ہے۔ یہ CMKYD پرنٹنگ نظام کے بنیادی رنگوں میں شامل ہے۔ تواس انداز میں قوس قزح میں موجود نہیں؛ یہ ذہن کے خود ساختہ سرخ اور نیلا کے مخلوط عمل کے تحت وجود میں آتا ہے۔
  color.maroon:
    label: کستانا
    summary: '''بordo'' کے مقابلے میں کم ورمروسان مندوبت؛ درندہ سرخ کے مقابلے میں کم تیرا'
    info: کاچھنائی کانٹوں سے نام لینے والی اس تاریق بورڈون رنگ میں دلہنوں، خواتین کے فاسفورم اور جوتاؤں پر عام استعمال ہوا۔ انگریزی زبان میں 'مارون' الفاظ کا معنی قید کردہ شخص کو بھی ہوسکتا ہے۔
  color.mauve:
    label: لیلا
    summary: بنفشہ سا روشن؛ غباردار لیلوار رنگ
    info: لیلا (ماؤوے) ایک خاموش، دبائی ہوئی بنفشہ سا رنگ ہوتا ہے۔ نام فرانسیسی زبان کے لفظ 'ماuvo' سے ماخوذ ہوا جو مالوا سائلوسٹر آؤن باغات کا حوالہ دیتا ہے۔ یہ پہلی تخلیق شدہ رنگین مواد تھی (انولائن وایلن، ولی엄 برنس)، جس کا انعقاد ١۸۵۶ء میں ہوا۔
  color.mint:
    label: ماتوا
    summary: چکنا حالت والا سفید سبز رنگ
    info: |-
      مٹا کی سبزی جسے مائتھا بول دو، اور نرم لہجے والی تازگی۔
      mاتوا رنگ واقعی صاف ستّر، خوشبوءُں اور موسمِ گرما کی طرح فضا پیدا کرتا ہے۔
  color.navy:
    label: بحریہ کا نیلا
    summary: '''بحریہ کا نیلا'' درحقیقت شب کے دوران سمندر کی طرز پر انتہاء تارا نیلا ہوتا'
    info: نیوی بلو انتہائی تار کا رنگ ہے۔ نام سترسوں میں برطانوی قائم مقام فوج کی جماعتوں پر مشتمل عسکری تنظیم کے لباس کے بعد دیا گیا تھا، وہ زمانہ جب ان لوگوں کو 'ناول' کہا جاتا تھا۔ یہ مدینتِ حسن اور غیر ضابطوی آرامدہ لباس کا سب سے عام بنیادی رنگوں میں سے ایک ہے۔ یہ بلون خوبصورت طرح سے سفید، شمشق اور ذراتی سے ملاپتا ہے
  color.ochre:
    label: اورجݨ
    summary: طبیعی عنصر اوجݩ توں وجود رکھندی زمینی براؤنز فلٹ
    info: اوکرووا زمینی، سفیدا رنگ کشادہ براون جسے اورجھو پائیغاں نام دیا گیا۔ چند قدیم ترین عناصر میں سے ایک ہے؛ ماڈرن لوگ ان خانقحلوؤں وچ استعمال کردے سن۔ طبیعت وچ اوکرو واالّا صخورت زمیندوز حالت وچ موجود ا‏ هُندا ا‍।
  color.olive:
    label: اُلوِوَ
    summary: سبز درخت کے مثل ذرات
    info: |-
      اولیو کے رنگ میں ایک دبلا پسینہ زرد سبز جسمانی طور پر نام لے کر بنایا گیا ہوتا ہے۔
      یہ فوجی، قومی تربیت اور موٹروں کے علاقائی حفاظت کے مقاصد کےلئے استعمال ہونے والی روشنی چھپاتی ہے。
      مصنوعات کے اندازا میں براجمان شمار ہوا ہے۔
  color.orange:
    label: نارنجی
    summary: لال اور پیلا کے ملانے سے بنائی جانے والی گرم دوسری قسم کی رنگت۔
    info: نارنجی، لال اور زرد کے ملنے سے بنتا ہے۔ یہ جوش و خروش اور تخلّیقی صلاحیتوں کی نمائندگی کرتا ہے؛ اس کا نام نارنجی فروٹ کے بعد رکھا گیا۔
  color.periwinkle:
    label: ببربلوم
    summary: ایک روشن نیلا فائلو رنگ جیسا کہ برچلن کا پھول
    info: 'پیراونکل ایک روشن نیلا فائلو رنگ ہے جس کا نام بچھڑال مینر (vinca منور) پودے سے دیا گیا۔ یہ روشن لائٹ بلو اور لاولندلو کے درمیان واقع ہے۔ یہ موڈ، آرت اور اندازِ زندگی کے شعبوں میں عام استعمال ہوتا ہے۔ html میں تقریباً #ccccff'
  color.pink:
    label: گلابی
    summary: سرخ کا ایک روشن رنگ، نرم اور خوبصورت رنگ۔
    info: گلابی سرخ رنگ کا ایک روشن شدہ ٹون ہے۔ بہت سی ثقافتوں میں یہ لطف، عشق اور جھومکے سے منسلک ہوتا ہے۔
  color.purple:
    label: فیولووا
    summary: چراغ کی مہنگائی سے پیدا ہونے والی ایک دلچسپ دوسری رنگت۔
    info: فیولووا، لال اور نیلا رنگ ملانے سے بننے والی دوسری رنگت ہے۔ تاریخی طور پر یہ سب سے زیادہ قیمتی رنگ تھا جو بادشاہانہ طاقت اور شان و شوکت سے منسلک تھا۔
  color.red:
    label: سرخ
    summary: گرم اصلی رنگ خون اور آگ کا۔
    info: سرخ تین بنیادی روشنی کے رنگوں میں سے ایک ہے۔ یہ توانائی، جذب و حرارت اور خطرے کو ظاہر کرتا ہے؛ بہت سی ثقافتوں میں یہ خوش قسمتی اور طاقت کی نشاندہی کرتا ہے۔
  color.rose:
    label: роз
    summary: '''roz'' رُسیف کے پھول کے مثلث شکل کے برگڑوں کے مشابه ایک لمّاحق قرمزی رنگ'
    info: روز رُسیف کے پھول سے نام لینے والی ایک ملائم لمہائی قرمزی شدیدگانوں والا رنگ ہوتا۔ چمکدار رو ز(پِنج)، جبکہ 'رُوز' تار داور قرمزی طور پر مختلف ہوتا۔ سمیئل بٹمن، فطرت کے لحاظ سے دلوں کے لیے بالخصوص مناسب رنگ کے طور پر 'روزا' کا ذکر کرتے ہیں۔ علامات علم و حسن خاص طور پر انگریزوں کے آرم کوارٹرز میں موجود ہوا کرتا۔
  color.salmon:
    label: لوسوواس
    summary: ایک لمپڑا رُخسار والی قرمزی -سوراخ والا رنگ جیسا لوسر کا گوشت
    info: لوزوسووا جمیں اس کے نام سے مچھلی لوزوس کے گوشت کی رنگت پر مشتمل تقریباً خوبصورت الٹرنیٹ حاصل ہوتی ہے۔ یہ قرمزی گرم اور روشن ہوتی ہے، جبکہ آئیندہ فاسونز میں براہ راست استعمال کرتے وقت اس کا مقصد صرف دانشمندانہ طرز زندگی کو ظاہر کرنا ہوتا ہے۔
  color.scarlet:
    label: شرلاتونه
    summary: ایک روشن سارنگی رنگ؛ شعلہ آسا قرمزی سے اوپر
    info: شہرلٹووا ایک روشن سارنگی رنگ کا نام ہے جس میں تھوڑا زرد لبادہ بھی شامل ہوتا ہے۔ یہ شعلہ آسا قرمزی سے دوسرا درجہ حاصل کرتا ہے، کم و بیش اور خصوصتاً سانروجن پینچ والی علامت۔
  color.sienna:
    label: سيانا كى هنيدا
    summary: ایک لمبا لال-بھورو زمیندار چارج
    info: سیان سکا حناء اٹلہ کے شہر سنئین پر نام دو۔ راؤ سمائنا زرد-بھوری، جبکہ بربقیع سمائنا (پختہ) لال-بھوری ہوتی ہے۔ یہ عمارت کے فرشتوں کی محبوب ترنم چارج ہے اور طبعیات کی گرم زمیندار قسم کی خصوصیت والی چارج ہے۔ آواز کے نقاشی میں بنیادی گرم بھوندرا چارج کے طور پر استعمال ہوتا ہے
  color.silver:
    label: سفید
    summary: '"واضح شدہ درخشندہ سفید رنگ مثل المونومیٹل."'
    info: |-
      {"info":"سیلور ایک معدنی رنگ ہے جو قدرتی سرخ کان کا تصور دلاتی ہے۔
      اس کा معنوں میں حاضری، عمدگی، فناوری اور صنعتی طرزِ بنائی شامل ہوتا ہے。
      جھنڈوں کی زبان میں چمکدار لال نامعلوم عنصر ہے؛ اولمپکز میں دوسرا مقام ظاہر کرتا ہے۔
      ایک موٹرسائیکل سفید پلاسٹروں والی برقی خصوصیات والا آسانی سے مشترکہ رنگ مختلف ممالک میں موجود ہے۔"}
  color.tan:
    label: پِسنْكُوانَاء
    summary: ایک روشن بنجر رنگ جو سورج کرنوں سے متاثر جلد کے مثل
    info: |-
      پیسکوواونا (ٹیننگ کرے والی جلد سبز رنگ مانند زمین، اور تھوڑا بہت دلچسپ نارنج۔
      اس لفظ کا استعمال عام طور پر موڈ فیشن کے حوالے سے مختلف قسم کے آئٗتمان، بوائٗتمان، اور شلوار وغیرہ کے لحاظ سے کرتے ہیں۔
  color.teal:
    label: ماڑروزنلن
    summary: آب و دarya کے مثل اُلجھنا ہوا سبز
    info: مادرا زیلینا (ٹیلو، teal)، اس رنگ کو اناس کرکچہ نامی پرنے والے جانور سے لیا گیا۔ اس کے بال بھی اسی شدید مائنس طرز کے ہوتے ہیں۔ یہ تربوز آسمانی رقبے کے اوپر حصے کی حامل ہے۔ ڈزائن میں عام طور پر نارنج روشنی کے مقابلے کے لئے استعمال ہوا ہے۔
  color.turquoise:
    label: ترقیسوا
    summary: جیسا کہ گرم خطوط کے پانی کا
    info: تارکیسوا رنگ اصل میں ترکائے نام کے جو پولودراہم سے ماخوذ ہوتا ہے۔ قدیم مصر، فارس اور آمریکا میں ان سنگھلتوں کی قدر بڑی دشوار ہوتی تھی۔ یہ روز روشنی کے زمانے میں دریافت شدہ وادیات کے لئے مشابہ چٹانوں، سمندری یخبندہ یا سماﺅں کا رنگ ہوتا ہے۔ طراحی میں صاف ستّرو، تازہ کرنے والے اور عصر حاضر کی خوبصورتی کے لئے استعمال ہوتا ہے۔
  color.vermillion:
    label: رومِݙَلُؤْ
    summary: اس دماغ کا رنگ چند مختلف عناصر کے مرکب سے بنایا جاتا ہے۔
    info: رومنکلووا رومنیل کے نام سے جانی جاتی اس قسم کا زردچینی لال-سبزگوں پر مشتمل معدنی ذخیرہ ہوتا۔ یہ تاریح میں استعمال ہونے والی خوبصورت لال رنگ کی برازنٹ فرشتوں میں شامل تھا۔ چائنیز رومنبر، ڈرامائش حالت میں موجود ہوتا ہے؛ آج وضاحت شدہ طور پر استعمال کرتے ہیں۔ یہ چینی لاک، جابانی مندر اور انترنشن الاء تصاویر کا عام رنگ ہوتا ہے。
  color.violet:
    label: فاولا
    summary: '''ناچل بورڈ، آسمانی؛ دکھائی دینے والا طيف کے آخر میں'''
    info: |-
      فیولووا فارسہ رنگ نام کے خاتمے پر واقع دکھائی دینے والے طيف میں موجود ایک رنگ ہوتا ہے جس کی لہروں کی لمبائی تقریباً 380–450 نانومیٹر ہوتی ہے۔
      i
      اس کا نام 'violets' بلبل کے پودے سے ماخوذ ہے۔
  color.white:
    label: سفید
    summary: سب سے روشن رنگ، تمام روشنی کا عکس۔
    info: سفید رنگ دیکھنے والے طيف کے تمام رنگوں کو ایک ساتھ شامل کرتا ہے۔ یہ پurity، بے گناہی اور نئی تحریک کی علامت ہے؛ مختلف ثقافتوں میں یہ جنگ کے خاتمے کا رنگ بھی ہوتا ہے۔
  color.yellow:
    label: پیلا
    summary: سورج اور سونے کا روشن گرم پہلی قسم کا رنگ۔
    info: پیلا نور کا بنیادی رنگ ہے اور سب سے زیادہ روشن رنگوں میں سے ایک ہے۔ یہ خوشی، توانائی اور مثبت فکر کی علامت ہے؛ دقت سے توجہ حاصل کرتا ہے۔
