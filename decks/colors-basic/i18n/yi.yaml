title: בעזישע פארבן
cards:
  color.amber:
    label: יאנטרובה
    summary: Тепלאה златоорanje барве або маінерал янтэр.
    info: ג'אנטארווע איז נאמען צווישענע גאלדער פראגע בלוyme מיט דעם נעבן וואס מענטשן האבן באזיראט אויף די מאינראל ג'אן טאר (באווייסט קאמפ). אין ערטליכע זייטיגקייט וואר ג'אן טאר געוורנשטעם אלץ סיי שפעקונגליך און רעליגיעוז. ג' антарובע ליצצונג לעכטן (וויילעס אויפ פרוספאר) איי א גענוועל ערצעIGN פאר וואך.
  color.aqua:
    label: אקווה
    summary: ברגענע בורגנגליקע טרעף.
    info: 'אква איז די ברענגנדיגע בערגן גרינ צווישן מאווייט וואס גייט פארועם אין האטמאל און סיס עפער קיין זעלבע ווארץ מיט דעם נומער #00FFFF. דאס ווירד אויפגעהאט פונקטצונג פון לאטיין וואוס באדיוט ''וואסה''.'
  color.azure:
    label: азуроўа блау
    summary: גלויביקע נעבעס בלאו ווי'ן סוממעראבעלב.
    info: '"Azurová" blau איז די ברענג פון בלאו ווי דער סוממער שמיימל; עס קאם נאך צום מינראל לאזוריט (דזשאדן לאזל). זיין געווענט אין דעם וואפפג באפלעקטע לענדער (פראנצע, ישראל, финלנד), און דורכאויס מאכטיגער וויゴールדן אין ריאנענסץ צו מעשה מקדוּם.'
  color.beige:
    label: בעזאג
    summary: לייצטגעווענע פילסט בראונדן; חום ניוטראלית
    info: ביזווע איז עין ליכטגעווענע צען מיטל פון וויße ביגער אלץ גאלדשנעדיקס מאכטליך נייטראלע טונ. דאס ווארט קומט פארם אויסגעפארקנדעם פראנצעסיש סלאוו 'beige' פאר זינגלעמע שטייער. מען באוויינט די בערג אין איינטעריק дизיין ווי א חום ניאטרעלע בסיס.
  color.black:
    label: шwarz
    summary: די טמאקסטה קאלור, נאך לעצטליך לייט.
    info: '"שwarz" איז די נעגאטיווע פון אלע סיכטבארע ליצערן. עס דארפערט אויגנעליקייט, מיסטעריע און מאכטע; אין מדינה וואלד זיין געזעהויבן ציינעם באזישענע קאלמער.'
  color.blue:
    label: blav
    summary: Kaltere prinarische farge fun himl un see.
    info: '"Blau iz di kalt farner vinterfarb fun liht un iz di meist beliebtste farb yn der wועל; es represents shleimikheyṭ, vertraunen und tief.'
  color.bronze:
    label: бронзовая
    summary: די בלאכזינדן גאלדענע מאַטיאל ברונצה.
    info: ברונזה איז די דערמאנדיגע גאלדעמע באראנגשטע צווישן קאָ퍼 און טין מיט עטליכע פארווענטיקל שטעלן וואס מעגליך נוצן זיין אין אויבר סיבות.
  color.brown:
    label: brun
    summary: Erdishe tsweiiterlike fornt von ervayse und bodne.
    info: Brún iz di tsveyterlikhe farb gevorn durkh mishung fun roytem, gelbnem un shvartzm. Es represents erde, natuer un stabiliteit; es iz beliebt אין נאטירליכע און האוסטן טעמעס.
  color.burgundy:
    label: burɣondskā
    summary: Burɣondskā iz diitlighe rute farbe van roge wyn aus Burɣonde.
    info: бурґונדסקע איז' עטליכער דייטליגע רוט פארבער מיט א נאמען וועלכע קומט פון דעם פראנצעזישע געלעדיקייט בורגונדי אין צפון סודוויסט באסיצילאן. מעגליך טרעפט זיין אויף שפעציעלע ערשיינונגספארם ווי מאראנען אбо purpur איבערהויפט.
  color.charcoal:
    label: антрацит
    summary: Antrazit iz eine shvartsikayt farb.
    info: |-
      אנטראцит איז עטליכס דינסט פון שווארצע שווارتיגייט וואן צו נאך'ר באזירט אויף קאלשונדער גרויסמענ'.
      die is זייער ביליק אין מודרן איינווענדונג לעבן אלץ מאל האלבגעווייטע סיי'ם.
  color.chartreuse:
    label: chartreuse
    summary: Lebhaft farbe tsvijsen gold un grün.
    info: ชาרטרעוסע איז א לעבן פארבע אין דער מיטל צווישן גאלדנע און גרין אויפ'ם ספקטרום. די נאמענטיק קומט פונעם הארץ בירגענשטעס ליקר וועלכע הייסט זעלביקס אלס דאס פראנצעזישעס קליסטור וואו עס איז מאכן געווען.
  color.cobalt:
    label: קוואלץ
    summary: זייער פעסטיגע תום בערגענע בלוויי.
    info: קוואלץ בלו איז נאטורלייגענדיק צו דער מיטט פון די טונדעווען מאכטע באלאגונגספיגמענט קאפּעל וועלכע געדינקט זיך אין ערטשנישן סוף שפעקאלע מעלות.
  color.copper:
    label: messigg
    summary: Rozbroiynbroyze metallische kleur lykas bei d'messigs.
    info: Messigg is di ruz-roynbroyzn farbe fun eysopik glykts vos erikernt den metall Messig (Kuper). Messe iz een von de earste metallen geveld door menesheyen un gebruk yn 't messigtiedperiood (Chalkolyteum). Alde messige dakke blieve griins dorumen ze zien oxidering (Patina), en grune messig heet Tirkoyz.
  color.coral:
    label: קורלבוּה
    summary: Lebhaftes Pinkisch-oranje farbe like meer-koral.
    info: '"קאראלווע" איז נייגער פון דעם וואמען טרופישע קאלטיר צווישן אוראנזש ענטפער ראוזע מיט באדיקונג פון מערגעלע מארינע קריסטלעך. די ברכה איז זייער פאפיליער אין סוממערע שטיול און איינגעהייט לעבן אויבאוועסונגען. פאןטענע האט געווארן ערקלערט אלץ ירח''ס בערך פאר 2019 תחת השם ''Living Coral''.'
  color.cream:
    label: krempave
    summary: Afgerisene veys-lidervabe vie kreieme.
    info: '"Kremfarb" iz afgerisener veys-lider-farbe mit nemol milchweiße un golden. Di farbe folt nakh der farbe fun frische kreme. In innerem dêkoratshaf is es geven vien di warmere alternative tsu rein weiße.'
  color.crimson:
    label: קאַרפין
    summary: הויפסקע בלאדן רויע פעלרג; דורכאויס אז שמאלטא.
    info: |-
      קארמינווער איז א דיקע, לעבן ראדעויג פארגונג נעמען נאך קערמיקאן, א רעדנע פייגמנט צופרעגנדזשונגענ מאכן וועלכע טראדיציעל געמאנט זיך פון די שפינאט מיטגליד Dactylopius Coccous
      עס איז די farb אין וואס הארוואר्ट יוניורסיטע ספארט אויס,
      און עס באצייכנט 'gules' אין אראלדיקה.
  color.cyan:
    label: азуроеа
    summary: Leben blume grine farb; eine von den grundfarbe prints.
    info: |-
      Aзуראוויס איז א לעבן בלומען גרינע פארבערונג מיט די ווערט אין דעם RGB מאדאל ר':0 גריין'255 בליווישטשטענדיגס'255
      זיי איז איינע פון צוואלף באזיסטאנגענ טרעכקונגן קאפשל נאך פריענטגער סדרה (צ'=ไซאן)
      ze ישפאַנע זיך אלץ עטליכע פעקטוארן שטיין מערגעל תחת יומיים לייצות
      עס האב ערשיידענע אויב ארעוויוס נעפוץ על ידי מחשב terminals של CRT monitors
  color.fuchsia:
    label: פאכסיאווא
    summary: Lebenhafte violett-rotes Farbton wie die Blume der Pflanze.
    info: פוקסיעווע איז א לעבן פארפלעקטיגער רודן צווישן דעם וואלדשאפענדיקנ קלאר האט פינק מעדזשנטה באנוץ אין טעקסט ניידונג. די נעמעכונגעג באקומפט זייערענע שטיין פון די בלומע פאלטע 'פוקסיה' געווארן אויסגעפארעמט דורכאויס עטליכע יאהרן. די פעלויטיגע סיווג פון די בערג מאכן אזוי מעגליך צווייסטעלעך צוזאמenal עם מוסמבער איבערהייט.
  color.gold:
    label: 골드
    summary: א שטיין קלייערע ילאגע ליגקט לווייבן אלץ.
    info: '"ゴールド" איז די פארבע וואס דערשפילט זיך מיטן באזונדערע מעטאל גול्ड. עס סימבאלisiert רייכטעמער, פרייסטיצ, ערפאלג און אווענקייַת. אין הר알דייק איז עס איינע פון צוויי מעטעלן (גולדן און סיילבר), וועלכע נוצן באנוץ אין וויפנע.'
  color.green:
    label: grin
    summary: Di farbo fun gras un bloemenblätter, eine secondarye farbo aus blau un gelb.
    info: '"Grin" iz di seykoendare farbo genegt duerf mengn blau un gelb tsu sammen. Es symbolisiert natuer, grunstof un frische; es is der einzigste farbe mit dem meistens sensitiivsten oge.'
  color.grey:
    label: เกรיס
    summary: דאס כ'וואוס צווישן שווארוץ און וויסע
    info: גרעיס איז עין ציוויג פארמאכטע מיטל וואס גייט אויף מאכן דורך די מעשוע בין שווארץ און וויß. זי שטעלן ניאтраלייע, באלאנס, און פעלויפמאל קיין טרעגנדיק הייסט אין פסיכאלאגיע. אין אייר דורכאפונקטער סדרה רעדעמענט ערהייבט אנטראזידיש און ביי די לעצטער ים האלבוויße.
  color.indigo:
    label: 靛青
    summary: '''靛青'' איז ''深深的蓝紫色，像靛蓝染料。'''
    info: 'אינדיגו איז עין דיאפער פון בעניצן צווישן בלוועס און וויולעט מיט די נאם קיימנדיק פונעם באפערנעמענט אין靛青 (געבויבן דורכאויס טרעפט). אויף אלץ זייער יאר האבן מען געהאט''ן靛青 איינע פון די וואלידזשטע באfäרגונגס מאכן. עס איז איינע פון די שבעע כאלארס אין רעדן סירכעל (ROYGBIV): רווד, אוראנג'', גילב, גר茵, בליוו,靛青, ויעילעט''.'
  color.ivory:
    label: ivor
    summary: קريمווי פארגע לייכנליך אלעфанטלוך; ווארמע ווי ענטלאכטע וועisse
    info: Ivor ist אַ קרעם וויסע פארבע אין מער גלעזנדיג צווישן טאונהדיק נייט אויב דאס'ס שטעלן זיך בלויז וויינציג יעדזש מאכן.
  color.khaki:
    label: khaike
    summary: gedempete lihte brun-oysgevelnte kavole; militairer terriner duktus.
    info: |-
      Khaiki iz di gedempte licht brone-lime kaveoler die geveden is door de briitse arme in India im negztem jortelhundert
      Di voslumt keynm olde hindeshteyner tsegling fun 'pritshe' ode'r mudderlekhayg.
      Es iz der gruntdafte far militearisher uniforms und terrin klidung.
  color.lavender:
    label: לבנדרולה
    summary: זייךר לייכטע פיולט וועלכע אלץ נעבסט לעיווידעלעס.
    info: לעוונדולווע איז עין זייער ליכט פילאט וואסן נאך צו די שפילער לעוויינדูลע (לאוואונדל). דאס טון ערצעייט רוסיגקייט, קלייסטיקייט און פראנציעזישע לאנדווארפונג מיט בלומעם אין פראוווענסאל.אין ארומאטאריעפייע גענענט מען לעויידולי סכיחות מיט ראקסיאציע און שניפ.
  color.lime:
    label: לימטעקאווע
    summary: געווייסע שפילרנעם גרין
    info: ليمט קווקע איז נאמען פאר צווישן די גריינס וואו דער זאלדן קאמפאננט רעדזש עטליכע טון'ס מיטל באקוועם מאכן אויפפארונג אין סיגנלינג אדראפט בילדווארבע.
  color.magenta:
    label: פרפלרווע
    summary: נעכטליקע פריימלעך פארג; צווישן רווט און בערג.
    info: פערפארוועה איז נאמענטליך פארג מיטן רעד און בלו וויינעט צווישן דעם אין די ספקטרום. עס קומט פונקט פון די שפילץ באטיילע אין מאגענדה (1860), אויבר'ש טרעף זיך נייגער געווען. מעגליכק הייסט עס נוקם איין פון די גרונד פארגס אין די C-M-Y-K פרינטערארייע.
  color.maroon:
    label: kashtonave
    summary: Dik rot-brauner farg; dikh weyn-roter.
    info: Kashtanove (meron) iz di tsvalek rote-brune farbe genannt nach kaschtane (mershon op spansh). Es iz eine beliebete farge אין mode un sportuniforms. Im englishe gleybt meron oykh an persun gevest shtecken uf enem eylzamen eiland.
  color.mauve:
    label: לילע
    summary: פאראדיגמא פון פירפל-רעאד; פרואסטיגע באוגנבוק.
    info: לילע (מאווע) איז עין זינטיגע פארקייטערטע בארג שטייענדיק צווישן רוז וועלקעס אנגעווונדן אין טרנשענעס מיט דעם נאמען מאוויי' קיין סלאז väsen, מאלוواسילוסטריס). די ערצע באנוץ פון ארטיפיציאל געלאטיגע שאפונג האבן מעגליך געהאלפן צוברingen אויבן לילה צום בעקוועם פאן 1907.
  color.mint:
    label: ماتאווה
    summary: די זייער שוועל גרין איי אזוי אלץ אויף מינתהייל.
    info: מאטאוועה איז נאמען פון די גראס מאטענטע מינטה וואקס; עס דיוויקלירט קליינקייט, שווארצעייט און קוולם. מעגליך צווישן שפיץ ראנגע אין מודערנע אינטעריאר דזשיגנ און ראטרו סטייל (דעם 60'ס).
  color.navy:
    label: נאווה
    summary: די טמפלעסע מאאדראע כחול
    info: '"נאווי" איז עטליכער צווישן די דינסט קאלענטשאפט פון ברייטאנדז''ס רoyal נavy אין די אייטענד זעכטעל וואו מען באגונגען צוברוקן מיט דerer טמאמער מאודרע סלוועת.'
  color.ochre:
    label: אויקר
    summary: ארדיקגעלטע אויב שפעקל עלעמנט פון אייערן
    info: אוקרווע איז ערדיגע געלט פון צוויי קייטן מיטל וויידעמער באנוץ אין נאטיראלישע ספינטלס דורך די באווולקערונג פונעם פרימית טיים.
  color.olive:
    label: או履职
    summary: געווענליכע גריין-גרונע פעלער
    info: אוליוו איז די געוויסן פעלער צופאסנדיג קיין נאטירליכס מיטמעגליך אין דעם וואlder ענטפערטשאפ עליבוס עריאפעאריעהאדזש' מאכן אויף זייער נעמען. באלד האבן מענשי טרעפן באווייניקייט אין מיליציירישע סטייל.
  color.orange:
    label: אורנג'
    summary: די בירגענעג האפט בארה פון ראוד און געל
    info: אראנזשעוווע איז עין צווייטער בארא פון דעם טרעפן וועלכע קומט מיטן מאכן רעד און גאלד אנצוטוישם. עס סימבאלisiert אויספארונג און קריאייטיוויטעי; די נעמע שטייגל נאך דעם פרייך פונעם אוראנג.
  color.periwinkle:
    label: פראווייינקאל בלאו
    summary: светלאג' блю фиолетавая панкрас ад кветл вайн мיענור.
    info: פרעווינקל איז נאמענטליך די פארבע צו דער גלייכנעם קветל וויין מיעןער (uingהminor). עס איז זייער בלווענע באזונדערש לעבן און ליוואנדעל פענליג. מעגליך אין מאדע און בעפאררעכונג אלץ טירם שטיל.
  color.pink:
    label: роизене
    summary: Швейгель адשтин фан рудне, джемнес айз штурмес барве.
    info: '"רויזענע" איז א שווערע צוויקל פון דער רודן קאלאר. אין מערERE כילטורעס וואס מענט זיין מקינדניש, ראמענטייעמונט און שפילריגקייט.'
  color.purple:
    label: פיאלאווע
    summary: איין פונעם מסתוריים שפעקל נייפר באזירט אויף ראוד און בעלב.
    info: פיאלאווע איז א סענדערנע פארבע וועלכע קומט מיטן מאכן צווישן רוט און בלומעם. אין די היסטאריע זאג מען אז עס האט געווענ טרעגסטע פארבע געזינדן אנגעפארטעדיקייט איבערהאפטיגקייט און לאקסוס.
  color.red:
    label: rot
    summary: Di varme prinarafarbe vu bloid un feuer.
    info: '"Rot" iz eine von dray grondfarben fun lijt un geyldt op enerygie, paasie un geferl; es represents oek glück un mochsheyk keyn vieler kulturn.'
  color.rose:
    label: roys
    summary: Zoftes pinke-purpel vi an royseblatl.
    info: '"Rose" iz di name fun ayner zofte purper-roze farb vi an blattl von eyne royseblumme un es verndert sich af "pinke": ''royse'' iz donkerer un mehr purperl. Samuel Beckat huet geshraybn azoye nisht geet en natuerlekhe hersts-farb wi rosegelbt. In der wappendiik iz de royse-blume oyfgefunnen op dem wappen fun Englan.'
  color.salmon:
    label: לוסאס
    summary: דער סאפיסטיקירטע ראוטג'אן
    info: '"Лосось" איז נאמען פאר דעם רעדער צווישענשטענדיגע בארא קיין מאסע וואס גייט מיט די בלווער האלב שטעלן אין עטליכע טרענדז.'
  color.scarlet:
    label: шаראלטאўוа
    summary: גлеיצונגע סאטאן-אוראנג' פעלרגע; ליוותער ווי קרמין.
    info: שאראלטאווע איז א גלייכע צווישן רויט און אוראנזש פארפלויגנדיק דורך די שפילער שאראלאך מאלדיער. עס איז ניידriger ווי קאמירנע אבער מער אוואנגשייניג. אין היסטוריע האבן זיי באוויינדן ראייך ראודע טעקסטילעס.
  color.sienna:
    label: סיונה
    summary: רויט- היידה אדוים דורכאויף
    info: סיענסקע הינעד איז ענט געווען צו זיין פונקטיגער דרואם מיט רוט-הנוד טון וועלכע קאמט נאך די סלאווישע שטעטל סיינה אין י탈ije. Raw sienna איז בלוימ-הייד; gebraten sienna (געפאלגן) איז רויט-היידע. עס איז א באמערקונגשווה פעראגנע מאלדיקייט פאר ראנאיסansa מעלס און א חום-אדאם בערגענדיגע נעטורלייכע טאן.
  color.silver:
    label: štirbnā
    summary: leshkle shvedave farbe vos לינקט צו דעם מקודם
    info: שטريبנע איז א מעדאלישע פארבע ענדערשטענדיגס צו דעם ווערטעגמענ קאפital סילバー. זי שטעלן אויס מאדאניטעט, עלעגיענציע, טעקנאלאגיע און איןדוסטריאל לעבן.אין הר알דייק איז ער די צווייטע מדיאל; אין אלימפידע באזירט מען אזוי אריבר צווייטע פעאציע.
  color.tan:
    label: тан
    summary: שויעה ברונע פארקער
    info: '"Tan" iz אַ שוויער ברונע פארקער וואס ערינדערט אויפן קאלמענע צו מעגליך געווענטליכע סקוודער דורך טאニング מיט טאן רישעס. עס איז נייגער צו בеж מאך''נ און זייערט מעטעלמאנש דורכגעמאלאגט אין די מועד פון לעדר באזוקות.'
  color.teal:
    label: turquoisel
    summary: Blav mit en geruchtnes Grin fun der see.
    info: Turquoise is blau mit grünem Schimmer un iz gevenen nach dem Krej obikneyim (Anas Crecka), velkhers flegls sind di farbe gevildt. Es iz eynfarb tsemes tsirkus spectrum. Populyar in graphishe dizayn als kontre-farb zu orange.
  color.turquoise:
    label: טירקיז
    summary: Blau-grune farb liikhnt op ozeanfarben.
    info: Turquoise is an intense bluish green color named after turquoise gemstone. Turquoise stones were valued in ancient Egypt, Persia, and America. It's similar to colors found on ocean surfaces under sunlight.
  color.vermillion:
    label: русмлкава
    summary: רעד-اورאן בערגלאכטע באקווע מסין
    info: רוסמלקעוויג' איז נאמען פון דער ציננבר מארם (HgS), וואס גibt אויס א לעבן רעד-אוראנזש קאלר. עס זאגט אייך אז די בלוyme האט געווענטליכ פעגנענדיק געזעהויבן אין היסטאריע. טודע ישפראך סינתאטישע פראזעס מאכן שפעקל ער מעגל נייט אריינגעצוקן.
  color.violet:
    label: fiolt
    summary: Blau-fiolar fare; op dem endl fun dem shikehbarem Spektrum.
    info: Fiolt is di farbe op dem end fun der shikhebare sprektrum mit ene wavelengte fanmlich um 380–450 nm. Es iz nemt nach de Blume Viola. In der farkleyner begrepsverstanis iz fiol nicher bei bloem un purpur iz tsvischen ruz unb loybl. Vorher hot man gevestert az fioler farge ware heftig selten und teuer; nur herer hoben geshport fiolorim kles.
  color.white:
    label: veis
    summary: די ווייסטע טונל, רפלעקציע פון אלץ לעכט.
    info: Veys iz di färb fun aln sichtbare farben im sprektrum zugleich un drayft ale liuts reflektirn. Es symbolisiert reinheyts, unschuldigkeit und neue anfangen; אין פיל קולטורן איז עס די צוויג פון שלאפט.
  color.yellow:
    label: zhlute
    summary: Ene helle warme prìmäre farbe vu dem sonne un golt.
    info: '"Zhluta" iz di prímär farbe fun liht un eine vun de meist hellen fargen. Es representiert glük, enegije un optimiszmus un es helpt oufmerksamkeet zu treknen.'
