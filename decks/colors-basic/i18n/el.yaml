lang: el
pivot: false
title: Βασικά χρώματα
cards:
  color.amber:
    label: ambrosia
    summary: Ένας τύπος ροδοχρώματος.
    info: Η αμβρόσια είναι ένας τύπος χρώματος που μοιάζει συγκεκριμένη φωφή βλέψη και λέγεται διαχρονικά για να αξιοποιηθεί ως ornamental και spiritual material.
  color.aqua:
    label: akua
    summary: Φωτεινός μπλε - πράσινος όπως το καθαρό νερό.
    info: |-
      Η ακουα είναι ένας φωτεινός μπλέ πράσινο χρώμα και συχνά τη διδύνουν για να λεγήθηκε «cyan» #00FFFF στο html & css
      Προέρχεται από τη λατινική 'aquae' (= νερό),
      evoke την τροπική θάλασσα, τα βάζειν και την πρωϊνή νεφελιότητα,
      kai epi to katholiko xrisimopoietai gia antithetikos chromatos stin simeioforia.
  color.azure:
    label: ΑΖΟΥΡΕΝΙΟΣ ΓΛΑΥΚΩΔΗΣ
    summary: Φωτεινός γλαυκώδης ως το καλοκαίρι.
    info: Η αζουρένια μπλε είναι η φωτεινή και δυναμική χρώμα της ποδήσφαιράς σύγχρονη νότια για λοξό βλέψη· πήρε το όνομά της από το μεταλλεύμα lapis lazuli. Διαθέτει το σήμα πολλών χωρών (Γαλλία, Ισραήλ).
  color.beige:
    label: Μπέζ
    summary: Φθινοπωρινό ροζ
    info: Το μπέζ είναι ένα φωτεινό και τρυφερό χρώμα ανάμεσα στο λεύκωμα που δηλώνει νευτρική βάση για εξωχώριας σχεδιαγραφή· προέρχεται από Γαλλική λέξη που αναφέρεται σε φυσικό κύμα.
  color.black:
    label: '"ΜΑΥΡΟ"'
    summary: Το πιο σκοτεινό ροζ, έλλειψη φωτός.
    info: '{"info":"Η μαύρη είναι η απουσία όλων των φυσικώς παθοφόρων λευκών στάδιων και δέχεται να γίνει βασική και παγκόσμια χρωματική θέση."}'
  color.blue:
    label: Blue
    summary: Cold light's main hue used to teach language help
    info: '{"info":"Η μπλε είναι η κρύα πρωτογενής χρώμα του φωτός. Διάβαση συχνές αφή για να διδάξει λεκτική βοήθεια","label":"blue","summary":"Cool primary color for teaching vocabulary"}'
  color.bronze:
    label: χρυσαφνιά
    summary: Φθηνή νομισματική βάψη.
    info: Η χρυσαφνιά είναι μεταλλικός τύπος αχμωδώς κίτρινου πράσινου ή σκούρο φθηνό λευκό ως γέμισμα δοντιών.
  color.brown:
    label: Καφέ
    summary: Γήϊνος δευτερεύουσα χρώμα.
    info: Το καφέ είναι δευτερεύουσα χρώμα που σχηματιζόταν από τη μίξη έγκωμψης, γλάστρας και νερού. Δείχνει Γήινο φύση και βεβαιότητα· είναι δημοφιλές σε φυσικά θέματα.
  color.burgundy:
    label: Μπουργονδική
    summary: Σκούρο κόκκινο ροζ ως διαχρονικό κόκκινο.
    info: Η Μπουργονδική είναι μια σκούρη κόκκινη πολυτελές χρώμα το οποίο λαμβάνει το όνομά του από τη γαστρονομική περιοχή Bourgogne/Burgundy στη Γαλλία. Δημιουργεί φωτογραφία ναΐσθηση βαθύτατου κόκκινου κρασιού.
  color.charcoal:
    label: Ανθρακιές
    summary: Πολύ σκουρόχρωμη γκρίζα όπως βουτυρωμένος.
    info: Η ανθρακιές είναι μια πολύ σκουρόχρωμη γκρίζα χρώμα κοντά τυφλή ή νερό λιγόσπαρτο φοβικό δρένδο. Δημοφιλής στο σύγχρονο εσωτερικό σχεδιασμό ως εναλλακτική της μαύρης.
  color.chartreuse:
    label: Χρυσοπράσινη
    summary: Ζωτική τόξεμη μεταξύ κίτρινη &amp; πράσινη.
    info: |-
      Η χρυσοπράσινη είναι μια ζωτική τόξεμη που βρίσκεται ακριβώς στη διχοτόμο γύρω από κίτρινο - πράσινο φάλαγγα
      Πήρε το όνομά της από το λικέρ νάϊζ Γκαΐδαρδ από το ομώνυμο γαλλικό μοναστήρι,
      Είναι μια από τις πιο εύρηθες ροφήματα για το ανθρώπινο μάτι.
  color.cobalt:
    label: Cobalto
    summary: Ζωηρό μέτριο - σκούρο μπλε όπως το κοβαλτικό pigment.
    info: "Η κοβαλτική μπλε είναι ζωηρό χρώμα που λέγεται τις σύσθετη από το χημικό στοιχείο Cobalt (Σo). \nΉταν γνωστά φυσικά βαφτικά δεδομένα να υπάρξει το 1800s painting .\nΧρησιμοποιείται σε κεραμική , τζάμι & art."
  color.copper:
    label: χαλκώδη
    summary: Κόκκινο φωσφοριζόν βαθμό για ρούχα.
    info: Η χαλκοπράσινη είναι μια κόκκινη που δείχνει το λεύγμα από στέφυς ή υδροξείδιο νικελίου.
  color.coral:
    label: Ροδαχνή
    summary: Ζωηρό χρώμα μεταξύ πορτοκαλί - ψητή
    info: |-
      Η ροδαχνή είναι ζωηρό κι απλώς τυπικό που βρίσκεται μεταξύ φωτεινού και γαλάζιου σφένγας νερού λεμβοθαλάσσιας διακοσμητικής
      Είναι πολύ δημοφιλής στην καλοκαιρινή μόδα και το interior design,
      Το Pantone την κήρυξε «Χρώμα του έτους» το 2019 με το όνομα Living Coral.
  color.cream:
    label: ΚΡΕΜΑ
    summary: Πολύ ασπρυγενές μουρβοχρώμι.
    info: Η χρωματική τονός κρέμα είναι ένα πολύ ασπρυγενές μουρβοχρώμι σάν γάλα νηστικό φρέσκου γάλακτος. Διαφθορίζεται λόγω της διαφορετικής της βαρύτητας απ' το λευκό.
  color.crimson:
    label: Καφέ
    summary: Ένα βαθύ, έντονο κόκκινο χρώμα· σκούροτερο από το crimson.
    info: Το καρμίνι είναι μια βαθειά ζωηρή πούλι από το χρώμα ντυσμένο σκουριά γνωστός ως carmine, διαχρονικό φυσιγγιδιού λεβάντα (Dactylopius coccous). Δεν είναι το Harvard University color (Harvard Crimson), και στην heraldry είναι γνωστό ότι Gules.
  color.cyan:
    label: αζουρένια
    summary: Έντονη μπλε πράσινη χρώμα· μία από τις βασικές χρώματα τυπωτικής
    info: "Η αζουρένια είναι έντονη μπλε πράσινη χρώμα και συχνός φως τύπου RGB δίδει τιμή γκρι:R=0,G=255,B=255\nΕίναι μία από τις βασικές χρώματα CCMKY τυπωτικής (C=cyan)\nΣυγκεκριμένα λεβεθεί να ως ροφή των εξελιγμένων θαλασσινών περιοχών \nΑποτελεί την βασική χρώμα των terminal computer της εποχής CRT"
  color.fuchsia:
    label: Ροδανή
    summary: Ζωηρός πουρπουρινόχρωμος - χρώμα του ντάφνι.
    info: "Η ροδανή είναι ζωηρός πουρπουρινόχρωμο λευκό και τσάϊ μέλι απ'το φύλλο στα γενιά ντάφνια.\nΤο φυτό διώχνει βγαζει το όνομα του απ’ το Γερμανό βοτανικό Leonard Fuchs(1497–1566). \nΣτο CSS & HTML «ροδανή» = #ff00ff."
  color.gold:
    label: Χρυσό
    summary: Ένα βαθύ φωτεινό κίτρινο ως το δρασμέταλ.
    info: |-
      Το χρυσό είναι μια φωτεινή κίτρινη απόχρους που θύμιζε το δрагμέταλ λάδι σκοπό.
      Συμβολίζει πλούτο, προϊγμένη βαθμίδα νίκης και γενικώς εξέχουσα ιδιότητα.
      Στην εραλεΐα, είναι μία από τις δύο μεταλλικές απόχρους - όπως το χρυσό και το αργύρι – που χρησιμοποιούνται άμεσα στο σφραγιστό.
  color.green:
    label: '"ΠΡΑΣΙΝΗ"'
    summary: Χρώμα γέμελου και φύλων ·Δευτερεύον χρώμα από σκούρα νυχτερινή βδελλίδα & λεβάντη.
    info: '{"hint":"το χρώμα πράσινο του γέμελου και φύλων","info":"Το Πράσινο είναι δευτερεύον χρώμα από μίγμα σκούρας νυχτερινής βδελλίδας και λεβάντης· Δείξει τη φύση ,φθινόπωρο και νεφελιοκρασία ;Ο αμφιβληστροειδής αντιλαμβάνεται αυτό το ροζ πιο ευαίσθητα απ''όλα τα υπόλοιπα χρώματα ."}'
  color.grey:
    label: Γκρι
    summary: Χρώμα μεταξύ μαύρου και λευκού ; χρώμα νεφελών και βετόν
    info: |-
      Το γκρι είναι αχρωματικό χρώμα που δημιουργείται με τη σύμπλεξη λευκού και μαύρου Χρήσιμος νέφος
      Θεωρείται φθάνει και αδιάφοροΣυμβολίζει την ουδετερότητα , την ισορροπία και μερικές φορές την ανυψωμένη
  color.indigo:
    label: Ίνδιγο
    summary: Σκούρο μπλε - φιόλεto όπως το pigmento Ίνδιγο.
    info: 'Η χρωματική απόχroma ινδίγο είναι μια βαθειά πλησιές συζήτηση του φύλλου και λεγόμενη για να δώσει ροφή στο pigmento του ίνδιγο (από το φυτό Indigofera). Για χιλιάδες χρόνια o Ινδίγο ήταν μία από τις πιο αξιόλογες υψηλές ως pigmenti. Δεν είναι μία από τις επτά χρωματικές απόχromas του arcobaleno (ΚΟΡΥΓΒΙΑΛΕ: красный, оранжевый, желтый, зеленый, синий, индиго, фиолетовый). Στη σύγχρονη αντίληψη, το Ίνδιγο είναι πολύ κοντά στο σκούρο μπλε.'
  color.ivory:
    label: Αμέλιγκα
    summary: Κρεμώδες λευκό ως βιβή φώκα · Θερμότερο από το καθαρό λευκό
    info: Η αμέλιγκα είναι ένα λεπτό χρυσωπούχο κρέμ που μοιάζει στη βιβή του φώκα. To όνομα δικαιολογείται για να μοιάξει στην ivyry. Xρησιμοποιείται στη μόδα , στο σχεδιασμό και στην περιγραφής του δέρματος . Διαφοροποιείται από το καθαρό λευκό με θερμότητα ; Γι' αυτό μπορεί να φτιαχτεί με λευκό και λίγο κίτρινο ή beiges.
  color.khaki:
    label: χάκι
    summary: Φωτεινή καφέ - λευκόχρους ; stratospheric terrain tone
    info: "Το χάκι είναι μπλεγμένη πρασινωπόχρους αυτή τη φωτεινή καφέ ή λευκώδη γκρίζα διαβαθμιση σύμφωνα με τη βρετανική στρατιωτική νομοθεσία του Δεκαετίου '85\nΟ όρος «χάκι» προέρχεται από την ούρδο / हिन्दी : khāki=ξιφισμός,\nΕίναι η βασική ρούχο στρατιωτικών uniform & outdoor wear \nΠαντελόνια χάκι είναι fashion staple από το Decade ‘90"
  color.lavender:
    label: Λεβανδινό
    summary: Πολύ φωτεινός γαλαζοπράσινος όπως τα λεβανδινά λουλούδια.
    info: Η χρωματική απόχroma λεβάνδου είναι μια πολύ ήπια κυανέψη της βγασμένης φωτεινής γαλαζοπράσινης διαθέσεως σφραγισμένης από τη νάνοση φυτική Levandula. Δημιουργεί αίσθηση ηρεμίας, καθαρότητας και Provençalscapes Γαλλίας· στην αρώματοθεραπεία, οι υποξείνωσες λεβάνδου συνδέονται με την ανάπαυση και τον ύπνο.
  color.lime:
    label: Λιμε
    summary: Ζωντανό κίτρινο - πράσινο χρώμα.
    info: Το λιμετκόβα είναι μια φως και έγχρου απάνθηση πράσινο χρώμα το οποίο δέχεται το όνομά του από το συκωτήλαιο γκριφούζδι. Διαφοροποιείται από το βλαστικό πράσινο· περιέχει περισσότερο νότα κίτρινου.
  color.magenta:
    label: porfiroeides
    summary: Ζώντας porphyróes color; Between red & blue
    info: "Η πορτοκαλί μπεϊζ εμφάνισης έχει χωρίς αντίστοιχο συγκεκριμένου κύματος του φαινόμενου διάθλασης\nΠήρε το όνομά της από τη νίκη στη Γαλλία(Γαλλίδα)(1760)\nΕίναι βασικό για τη λειτουργία CYMK(Cyan,Yellow,Magenta,K) \nΔεν υπάρχει στην αξονική γραμμή"
  color.maroon:
    label: Καστάνι
    summary: Σκούρο πορτοκαλόχρους.
    info: Η καστάνια χρωματίζει το σκούρο πορτοκαλόχρους μπλέ αυγή ή εξαιρετικώς φθηνό λεβεντίνι βαφτό για να δώσει το όνομά της στο 'cinnamon' - ένα ροδοχρώμι.
  color.mauve:
    label: Λιλάκι
    summary: Φωσφόρος – ως τεθωριμένο ψιλό
    info: Το λιλάκι είναι μια απαλή και τεθωριμένη πουρτούδα ρόζ ή σχεδόν γυψώδες χρώμα φωσφόρου - βγαλμένο ντυμένο. Διαβάζεται «màve» διότι προέρχεται από Γαλλικό όνομα (Mauve), που σημαίνει 'Malva Sylvestris'.
  color.mint:
    label: Μάτι
    summary: Πράσινο όψιμο ροζ.
    info: Η χρώμα μάτι είναι ένας νευροκλωστός πράσινος από τη σύγχρονη φυτοφθένδρα και λήγει στους δρόμους για την καθαρότητα, την πρωϊνή βαρβαρότητα και την ψύξη.
  color.navy:
    label: Ναυτική Mblè
    summary: Πολύ σκουρόχρωμη κάσια όπως το νύχτικο ωκεανό
    info: "Η ναυτική μπλε είναι πολύ σκουρόχρωμη κάσια χρώμα το οποίο λέγεται απ' τις φόρμες για βουνδούκι διαβίβαζε το Kratos Nautikos tis Elladas to osmoudiaposio\nΕίναι μία απ’ τις πιο δημοφιλείς βασικές ρούχα στη μόδα και στο εξεργασθέν \nΣυνδυάζεται καλά με το λευκό , το beige και το χρυσό"
  color.ochre:
    label: ochre
    summary: Γεύση ωξειδωμένου ύλης ώστε να προκαλεί χρωματισμό.
    info: |-
      Η οχρέα είναι χλωμοκιτρινόσπυρη γεύση που λήγει σε κάφος με το όνομα ντα βρώμη από το φυσικό ροζ διδύμο Fe(OH)₃·
      Είναι ένα από τα παλαιότερα υψηλόβαθμα ψηφία ·
      Οι πρώϊμοι άνθρωποι την χρησιμοποιούσαν για την προετοιμασία των προϊόντων.
  color.olive:
    label: ΟΛΙΒΕ
    summary: Έχω την ίδια υψηλή αξιολόγηση.
    info: Το χρώμα ολιβέ είναι μπάσκετ που λήγει σε φυσικό τοπίο και αφηρέθηκε γι' αυτό δύναται να βοηθήσει στην αξιολόγηση.
  color.orange:
    label: Κόκκινο
    summary: Συμβολιζει την ενθουσιαστικότητα και τη δημιουργικότητα· πήρε το όνομά του από το φρούτο του πομέλου.
    info: '{"hint":"το χρώμα πούπλουν ή τσικλάδες","info":"Το κόκκινο είναι δευτερεύων φθέγχας μεταξύ λευκής αφηρημένης σκέψης για να βρεις την απάντηση.","label":"κόκκινο","summary":"Θερμός δευτερεύων φθέγχας από κόκκινο και πούπλουν."}'
  color.periwinkle:
    label: '#CCD8E6'
    summary: Ένα λεύκαντρο βγαζει νεφελωμένο.
    info: Η Periwinkle είναι ένας αριθμός που δείχνει το χρώμα μπλέ κάτω από Vinca Minor στη φυσική γλώσσα.
  color.pink:
    label: '"Πούλι"'
    summary: Φθηνό υφασμάτινο ύφος.
    info: '{"hint":"το χρώμα μπλε κόκκινο ή το ασβέστως","info":"Το πουλί είναι φυγή σχημάτων λευκού δέρματος· Δεδομένου ότι γνωρίζετε να βγάζετε τον ρόλο τους;"}'
  color.purple:
    label: Μελαντικό
    summary: Η νύφη των ροζ και των θαλασσίνων.
    info: Το μελαντικό είναι δευτερεύουσα χρωματική απόχρωση που σχηματίζεται καθώς το ιξώδες γάλα βγαίνει από το λιβανένιο φλοιό.
  color.red:
    label: '"Κόκκινο"'
    summary: '{"summary":"Θερμός πρωτεύων ρόδινος υψηλός"}'
    info: '{"info":"Η κόκκινη είναι μία από τις πρωτεύουσες χρώματος φωτός συχνά θεωρήθηκε να δείξει ενέργεια, γλυφιδοβραϊα και κίνδυνο· σε λεζάντες πολιτισμούς βορράδει τύχη και δύναμη."}'
  color.rose:
    label: ρόδανη
    summary: Λεπτή light-pink / κόκκινη ως φύλλο σφαγιάς
    info: Η ρόδανη είναι μια λεπτή κοκκινωπά πράσινη απχώρους η οποία τυγχάνει διαμέσου φύλλου σφαγιάς· Διαφοροποιείται από το γαλαζωπό βαθμό (light pink), το «βαϊ» είναι νεξτο και πιο κόκκινο · Samuel Becketts είπε 'Δεν υπάρχει φυσική χρωματική για το καρδιογράμμα όπως το ρόδανο' · Γεραλογραφία - Η ρόδανη (gerbinal rhodanthe) εμφανίζεται στο σήμα της Αγγλικής βασιλείας
  color.salmon:
    label: ΣΚΟΡΔΕΛΙΑ
    summary: Πολύ ψιλό υποξιλίνιο.
    info: Η χρωματιστή λευκοπίνγκ είναι μια ήπια πλάβ αχνώδης φύση του σφυζόντος κόκκινου νερθέν για το ρόφημα βαψιμένο δόντι. Δεν είναι τόσο ζεστή όσο το coral.
  color.scarlet:
    label: Σάρλαχ
    summary: Φθάνει κόκκινο - πορτοκαλί.
    info: Η χρώματος σάρλαχ είναι ένα φωσφόριζε κόκκινο μπλέ που λήγει τη δύναμη αυξάνει για να βάψει.
  color.sienna:
    label: Σιένσκα τράχηλος
    summary: Κόκκινο-βαθμωδώς γεμάτη ώστε να είναι πιγμέντο
    info: "Η Σιένσκα τράχηλος είναι μια γεμάτη χώρα κόκκινου πορτοκαλί απ' όπου λήγει στην Ιταλική πόλη Μπολόνια\nH raw Sienna δύνεται φυσικό - κόκκινο βαθμωδώς· H Burnt Sienna είναι ναφθαλινοκόκκινη ·\nΕίναι μια δημοφιλής ροζ ζωγραφική και θερμή γεμάτη υψηλής φύσης \nΧρησιμοποιείται σε watercolor ως βασικό ιξώδες"
  color.silver:
    label: asiménia
    summary: Ένα λαμπερό γκρι όπως το μέταλλο ασήμι.
    info: Η ασημένια είναι μεταλλικό χρώμα που θυμίζει το δύσπος κάδμιο στήθων. Δείχνει νεφελικότητα, λεξιβαγιά, τεχνολογία και βιομηχανικό φιλοσοφία. Στη γερουσία είναι το δεύτερο μέταλλο· στις ΟΛΥΜΠΙΑΚΕΣ ΑΓΩΝΙΣΤΙΚΟΥΣ ΓΡΑΦΕΙΟ ΠΡΟΪΔΡΕΊΟΥ ΕΞΏΝΥΜΟ.
  color.tan:
    label: Tann
    summary: Ένα απόχρωμα φυλλώδους κάφε
    info: |-
      Η χρωματιστή με τον πίθης είναι ένα απόχρωμα φυλλώδους κάφε σκούρο γῆς ή λεγόμενο δέρμα βραβείῳ ντάν
      Προέρχεται από την επεξεργασία του δέρματος με την προσθήκη τριψίματος
  color.teal:
    label: Teal
    summary: Έχει μπλε και πράσινο.
    info: Η μπλε που φαίνονται τα χρώματά σκόγισης είναι η αξία για να λέγεται teal και βρίσκεται στο πάνω μέρος του δήθεν turquoise spectrum.
  color.turquoise:
    label: Χρυσαφίτι
    summary: Πεπάγων βαθύ νερό.
    info: Η χρυσαφίτιδος είναι ένα πεπάγων αόρατο μπλέ του κόκκινο λουμινών σχηματιζόμενο γύρω από φθοριτή διαβροχή.
  color.vermillion:
    label: Ρουμελκό
