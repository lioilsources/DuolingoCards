lang: he
pivot: false
title: צבעים בסיסיים
cards:
  color.amber:
    label: ג'נטאורוֹ
    summary: צבע הזהוב-אפורנג כמו המינראל גימבר.
    info: ג'נטארווה הוא צבע חם של זהב אורנג', שממנו נазвה המינרל גימבר (שרף מוקפוץ). בתקופת האנוכות הוערכה הגמבר כחומר דקורטיבי ורוחני. אורות סัญญา שצבעם желטый על תומס הם סמל עולמי לاحتירנות.
  color.aqua:
    label: اكוו
    summary: צבע ירוק כחלוף בהירות כמו מי נקי.
    info: 'אקווא היא צבע ירוק כחול בהיר מאוד; ב-html ו-css אקווה וכיאן הם סинонимים (#00ffff). השם בא מהשפה הלטינית: ''אקווה'' פירושו מים.'
  color.azure:
    label: azerub
    summary: צבע שמים חיים ונקי
    info: אזרוּב אדום הוא צבע בהיר וחיובי של השמיים - כשמיים קיץ נקיים. הצבע קרוי על שם המינרל לאזוריט (לבנדר), שנעשה בו שימוש גם בתקופת הרנסנציה יותר מכסף זהה למדלים לבנים. האزرוב משמש חלק מהסמל הלאומית многих מדינות כמו צרפת, ישראל ואイスלנד.
  color.beige:
    label: بزج
    summary: צבע אורבני של סנדאי טון
    info: בז'ובה היא צבע חם בין לבן וחום אדמדמָה. הצבע נגזר מהמילה הפורטוגזית לגליל טבעי ומשתخدم רבות בעיצוב פנים כבסיסей תכליתיים חמימים. הוא קרוב לצבעי חול ולאדמה לא מוקלחת.
  color.black:
    label: черная
    summary: הلون השחורים ביותר, חוסר האור.
    info: שחור הוא היעדר כל אור נראה. סמל של אלגנטיות, מסתורין וכוח; ב패션 נחשב לون בסיסי אוניברסלי.
  color.blue:
    label: '"כחול"'
    summary: '{"summary":"צבע ראשוני קרים של השמיים והאוקיינוס"}'
    info: '{"info":"הצבע כחול הוא צבע קר של אור וראשוני. זהו הצבע האהוב ביותר בעולם ويمثل שלווה אמון וחוזק."}'
  color.bronze:
    label: бронзовая
    summary: צבע מתכתי כהה באור גוֹרמי כמו להט ברוני.
    info: ברונזה היא צבע מתכתי אפור-ทอง שמתאר את הלהט שנוצר משילוב נחושת וоловן. תקופת הברזל (לערך השנים 3300–1200 לפני הספירה) קרויה על שם המתכת הזו. במשחקים האולימפיים הצבע מייצג מקום שלישי (מדליה של ברון). פסלים מוצגים בצבע זה הם שכיחים במיוחד בסביבות עירוניות.
  color.brown:
    label: 갈색
    summary: 흙의 고유한 이차적 샛기와 관련된 갈색.
    info: 갈색은 빨강과 노랑 그리고 검정을 섞어 만들어지는 보조 색상이다. 흙이나 자연 및 안전성을 상징하며, 특히 야생 또는 가을 주제에서 자주 사용된다.
  color.burgundy:
    label: بورגונדי
    summary: צבע כחול רך כמו ייין לבן.
    info: |-
      בורגונדית היא צבע אדוורפוריול שכה נקרא על שם האזור היין בורגונייה (bourgogne) שבצרפת。
      it מזכיר יינות红酒, גאווה ועושר。
      in המода זהו אחד הצבעים הפופלרי ביותר ל겨울,
      ומתאים מצוין עם זהב, בג'וב ודיו הימי.
  color.charcoal:
    label: אנתרצית
    summary: גוון אפרתי כבד דומה לפחם
    info: |-
      אנטרציט הוא גוון אפור מאוד כהה כמעט שחור כמו עץ פחם
      הוא נפוץ בديكور מודרני כתחליף לأسود
      במода זהו צבע בסיסי וניוטראלי מתאים לבגדים רשמיים
  color.chartreuse:
    label: _chartreuse
    summary: צבע חיים בין желтый и зеленый.
    info: _chartreuse_ הוא צבע חיווי בין 노랑 לירוק בדיוק ב-spektrum של האור. השם נגזר מהליקר הגרעיניים בשם זה שמגיע ממסדר הצ'רט柔ס הפראנציסאי בעל אותו שם. זהו אחד המקרים הנפוצים ביותר שמאפשרים ראות טובה באדם.
  color.cobalt:
    label: קוֹבַאֲלטוּ
    summary: חمرة תכולה עד אמצעית חיה כמו פיגמנטים של קובליט
    info: קובהלט בלו היא צבע כחול עז ופראי שמם על האיבר הכימי קובאלט (Co). הייתה אחת מהצבעים הכתומים הנפוצים ביותר במאה התשע עשרה לציור. משמשת בסرامיקה, זכוכית ובאמנות.
  color.copper:
    label: סגולה
    summary: צבע חומרי ונחושה כמו מetail נחושה.
    info: סגולת היא צבע אדום-חום עם לuster מתכתי המזכיר את המתכת נחושה (קופר). הנחושה הייתה אחת מהמתכות הראשונות שהאדם עיבדה, בתקופה התחמוצית (הלקליטוס). גגות ישנים של נחושה נעולים בצטנז'יה מאוקсидציה; סגולה ירוקה היא טורקויז.
  color.coral:
    label: קורל
    summary: צֶבע רוז'-אדוֹמָת נייד כמו קורות ימיים.
    info: קורה היא צבע חם וחיובי בין אדום תangerוני לורוז'ב שנקרא על שם קורי מорские. הוא מאוד פופולרי במודה הקיץ ובעיצוב wnętrz. פנטון הประกาศ אותו כצבע השנה לשנת 2019 בשם 'Living Coral'. הצבע מתאים מצוין עם טירכוסוב, לבן וחזה.
  color.cream:
    label: קريم
    summary: זהו צבע ירקרק בהיר כמו הסמטנה.
    info: צבע קремה הוא ניגוד של צלול לבן וצהוב בהיר מאוד. השם בא מהצלת הצבע של סметנה טרייה. בעיצוב פנים משמש כאלטרנטיבה חמה יותר ללבן чистый.
  color.crimson:
    label: קארמיני
    summary: צבע אדום עשיר מאוד; أغمق משלשח.
    info: קרמינה היא צבע אדום עמוק וחיובי שנקרא על שם פיגמנט הצבע האדום קרמין. באופן מסורתי יצרו את הקרן מה벌ית Dactylopius Coccous. זהו גם צבע האוניברסיטה ההרברדיות והסמל הקרמי.
  color.cyan:
    label: סיניוני
    summary: צבע ירוק כחולים חיים; חלק מהцветיס הבסיסיות להדפסה.
    info: סיניאן הוא צבע ירוק כחול חיווי; במודל ה-RGB ערכו הוא R:0, G:255, B:255. זהו אחד מארבעת הצבעים הבסיסיים בתהליך הדפסה CМУК (С= סיניאן). בטבע ניכר בצבע ים טרופי poco תחת יום בהיר.
  color.fuchsia:
    label: فوكسية
    summary: צבע סגול פלוימלי כמו פרח פוקסי.
    info: פוקסיה היא צבע סגול פלפלים חם ששמו נגזר מהפרווה芙uchsia). הצמח קרוי על שם הბוטנאי الألماني ליאונרט פאוצ'יוס (1501–1566). ב-CSS ו-HTMML 'ฟักซิยา הוא אקראי למגונטה (#FF00FF). זהו צבע מופלג הנקשר לעיצוב, לשנות השמונים ולאמנות הפופ.
  color.gold:
    label: זהוב
    summary: צבע בהיר כמו垛 הזהב
    info: |-
      זהב הוא צבע המזכיר את垛 הזהב היקר
      הוא סמל לثروה, ערך, מوفقיות ועושר
      ברודסיה זהו אחד משני垛ים הנמצאים בשימוש ישיר בזימר
  color.green:
    label: ירוק
    summary: لون革草和叶子،由藍色與黃색混合而來的次級顏色。
    info: '{"hint":"הצבע ירוק, צבע העשב ועלה","info":"ירוק הוא הצבע משני שנוצרจากการערבוב של 파ול עם 노랑. הוא מסמל טבע, חיים וה свֵפֶת; עין רואית אותו הכי טוב מכל שאר הצבועים.","label":"ירוק","summary":"لون革草和叶子，由蓝色和黄色混合而成的二次色。'
  color.grey:
    label: שאדה
    summary: צבע בין שחור ללבן; הצבע הענן והבטונ
    info: |-
      גרייה היא צבע אכרומטי שנוצר על ידי תערובת של לבן ושחור
      היא נחשבת נייטרלית ולא מטרידה
      בפסיכולוגיה סמלית שלה הוא ניטראליות ו균ון וגם לפעמים חוסם
  color.indigo:
    label: 靛蓝
    summary: 深蓝色，如染料靛青色。
    info: אינדיגו היא צבע תכול כחול פיאולוב שנקרא על שם הצבען אינדיקור (מפריט האנדיפררה). לאורך אלפי שנים היה אינדו אחד מהצבענים היקרsten ביותר. זהו גם אחד מسبע הצבעים של הקשת (ROYGBIV - أحمر, נaranji, желтоватый, ירוק, סגול, אינדור, фиолетовый). במודל הצבע الحديث הוא דומה לצבע הכחול התכלת.
  color.ivory:
    label: Ivorowy
    summary: สีขาวคล้ายฟันช้าง มีความอบอุ่นมากกว่าสีขาวบริบูรณ์
    info: |-
      สีงาช้างเป็นโทนขาวครีมที่อมเหลืองอ่อน ๆ
      คำว่า 'สลอนิโนวา' มาจากฟันฉลามของช้าง
      doใช้ในแฟชั่น การออกแบบ และการบรรยายถึงผิวหนัง ส่วนต่างระหว่างกับสีขาวบริบูรณ์คือความอบอุ่นเล็กน้อยจากการผสมสีขาวเข้าด้วยกันเพียงเล็กน้อยหรือเบจ
  color.khaki:
    label: כחול
    summary: צבע חום-אפרicot כחול; גוון צבא.
    info: |-
      קח'קי הוא צבע אפור-צהוב בהיר שנפוץ על ידי הצבא הבריטי באינדיה במאה התשע עשרה
      השם נגזר מהאורדו וה힌די - 'खाका', כלומר пыль או בוץ.
      הוא构成了 מדים צבאיים ומדפי טרנספורט.
      מכנסי קח'קי הפכו למודל קבוע מאז שנות העשר של המאה הקודמת.
  color.lavender:
    label: לבןדה
    summary: צבע סגול מאוד קל כמו פרכי לְבַנּדָה.
    info: לבנדר הוא צבע סגול בהיר ומרומם שמזכיר את פרחי הלבנדו. הצבע מייצג שלווה ונקיון ומזכיל תחושת מפרנס האלזס בצרפת. בנוסף, ריחות של לבנדול משמשים כריפוי אромטי לשינה ולשיקום.
  color.lime:
    label: ليمتکوفا
    summary: لون חיוויי אפור בין הזהבן והאכזר כמו באפליים.
    info: לימותקובה היא צבע ירוק בהיר ועוצמתי של לימון זהוב-أخזב המאופיין על ידי נטייה חזקה יותר לזהבה מגרין עלים רגיל. הצבע משמש לעיתים קרובות כצבע הדגשת דגמה ב 그래픽 дизיין בגלל היותו קל לעינ睛
  color.magenta:
    label: פורטופלו
    summary: צבע פורפרובו ו핑ק חיים
    info: |-
      פורפורוובה (מגנטה) היא צבע חיווי בין אדום וכחול ללא גודלגל אור מתאם באפקט הנראה לעין.
      The name comes from the Battle of Magenta (1870), fought near Milan in Italy.
      It is also used for color printing using four colors - Cyan, Magenta Yellow Key
      This color cannot be found on rainbows but appears when your brain mixes Red & Blue.
  color.maroon:
    label: คาชตาโนวา
    summary: โทนสีนู้ดดำเชียว ๆ มันคือน้ำผลไม้นำทาง
    info: คาชตาโนวา (มารูน) เป็นสีแดงเข้มที่คล้ายกับสีของลูกเกาดั้วยาเสพติดในภาษาฝรั่งเศษ เธอเป็นหนึ่งในการเลือกสียอดนิยมสำหรับการแต่งกายและเครื่องแบบ ในภาษาอังกฤษคำว่า 'Maroon' ก็ใช้อ้างถึงคนที่ถูกปล่อยให้อยู่โดดเด่นบนเกาะเปล่าๆ อีกด้าน สีมารูนมักจะไม่มากไปกว่าน้ำเงินอมชมพุอย่างสีบอร์โด และเธอกลายจากสีแดงธรรมดาเพราะความสว่าง
  color.mauve:
    label: ליל
    summary: צבע טונה של סגול עם לבנדר
    info: לילה (מואב') היא צבע סגול עדין וצונן יותר מדי. השם נגזר מהשפה הצרפתית (mouve פירושו שורש תירס). הייתה זו הפסילון הראשון שנוצר באופן מלאכותי (א-nil אינדיגו,ولي엄 פרקינג', 1904)
  color.mint:
    label: מטובה
    summary: צבע ירוק מאוד בהיר כמו עלים של מנטה.
    info: מָטוּבַה היא צבע ירוק בהיר ורענן שמגיעה על שמה של המנטה ( Mentha ). הוא מעורר תחושת ניקיון, רעננות וחיוויות.
  color.navy:
    label: נאוوي
    summary: צבע כהוב כמו האוקיינוס בערב.
    info: נאווי בלו היא צבע כחול מאוד אפל. השם נגזר מחלוצות של ה-Royal Navy הבריטית במאה התשע עשרה. זהו אחד הצבעים הבסיסיים הנפוצים ביותר בגאווה ובבגד רשמי.
  color.ochre:
    label: 赭
    summary: 一種像天然赭土一樣的地衣黃褐顏色
    info: |-
      赭色是一种泥土状的黄褐色颜色，以氧化铁（鐵質氫氧根）這種色素命名。
      這是最古老的颜料之一；史前人類曾用於洞穴繪畫中。
      在自然界中作為土壤中的赭石存在。它出現在阿爾塔米拉、拉斯科及其他舊石器時代壁畫上。
  color.olive:
    label: אוליבובי
    summary: لون חלוש כמו פטריות.
    info: |-
      אוליבוב הוא צבע ירוק בהיר עם נטייה לכתום ופיגם דומה לצבע של עץ האוליו (Olea europaea). הצבע נחשב כצבע מילוא טיפוסי因为在自然環境中具有掩護作用。
      הוא גם משמש בצורות אופנתיות ובמגזר התיירות.
  color.orange:
    label: אורת'
    summary: צבע אורנז', מיקוד בין אדום לצהוב
    info: אורנג' הוא צבע肌膚 שניוני שנוצר על ידי ערבוב של אדום וצהב. הצבע סמל לרגש ולإبداع והוא נקרא על שם פירות האורנג'
  color.periwinkle:
    label: 퍼וויקל באלו
    summary: צבע תכלת אפורי בהר כמו הפרחת הרקונ
    info: פריווינקל הוא צבע תכלת אפורי בהיר שמם של פרח הורכון הקטן (ויינקה מינוואר). הצבע נמצא בין התכולה הבירה ללבנדר. זהו צבע פופולרי במודה ובדקורציה כצבע עדין ונשגב.
  color.pink:
    label: розова
    summary: גונת אדומה חלשה יותר, בצבע עדיני ונ่า ליבה.
    info: '{"hint":"הצבע розовый, צבע כחול של אדום","info":"розовая היא גוון בהיר של הצבע האדום. בultureות רבות מזוהה עם רחמים, הרומנטיקה והנאה.","label":"розовую","summary":"גוון בהיר של אדום, צבע עדין וadorable."}'
  color.purple:
    label: Фиалка
    summary: Загадочный вторичный цвет между красным и голубым
    info: фиолетовый цвет образуется при смешивании красного и синего; исторически он был самым дорогим из всех оттенков
  color.red:
    label: '"אדומה"'
    summary: '{"summary":"צבע חם ראשוני של דם ואש."}'
