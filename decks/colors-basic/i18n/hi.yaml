lang: hi
pivot: false
title: मूल रंग
cards:
  color.amber:
    label: जंतर
    summary: आफ्ताही ओषणिक यशद और धौला ऐसा घन झाड़ा इओं
    info: |-
      जंतर एक सूगना पीले हुए मिट्ठास कमलप्रसवनि रंग होय।
      इच्‍छा जेम्बरदेव अहँ खडखड लघु शब्द 'अम्फट' नाचा आधारभूत भाग छई।
  color.aqua:
    label: एक्स्फा
    summary: छाड़े ठंडे घले ऐश्वरिक रंग
    info: "'एक्वा' एक सुनहरी हरित प्राकृति के रंग को देखवट में लाईय।\nHTML अउ CSS में 'एक्यूआँ' और 'साइनल' आपसमें बदलबदली शब्द हई। \nइ नाम गढ़ी भाषा से उठलथे - Aqua=जल\nऊषण जलधि, स्पष्ट झील ओर चमचमाहट के छवि धारण करई।"
  color.azure:
    label: एज़िओर भौर जबड़ा
    summary: ऊषा आकास के अधिवश
    info: एज़्योर नीला है। कई देशों -फ्रांस, इजऱे‍अल, फिल्मन में पहचानक समुदाय के रूप में एगो चमत्कारी बर्तन के उदाहरण हवे|
  color.beige:
    label: भीज़
    summary: एक हल्का पथरीला भूरा ; धूपदार उदय
    info: बीज़ एक हल्का सुगंधित प्राकृतिक केसरी रंग होता है। यह मनखे और अपवस्थिति के बीच गरम नटरल शेड है।
  color.black:
    label: काला
    summary: सबसे गहरी रंगत, प्रकाश की अनुपस्थिति।
    info: काला सभी दृश्यमान प्रकाश की अनुपस्थिति होती है। इसका प्रतीक उदाहरण के तौर पर आकर्षकता, रहस्य और शक्ति में होता है; फैशन में इसे एक मूल विश्वव्यापी रंग माना जाता है।
  color.blue:
    label: नीला
    summary: आकाश और महासागर के प्रकाश का एक ठंडा प्राथमिक रंग।
    info: नीला प्रकाश का एक ठंडा प्राथमिक रंग है। यह दुनिया का सबसे पसंदीदा रंग है और शांति, विश्वास और गहराई को प्रतीकत्मक करता है।
  color.bronze:
    label: ब्रोंज़
    summary: '''ब्रोंज़'', ऐसा ऊघरा ऋष्पाष्ण रंग जो पीतल और सुथडालिया के मिश्रधातु के जैसा दिखाई देत हवे'
    info: "ब्रोंज़ के रूप में पीतल और सुथडालिया के हमशक्के कि तहसील करने वाली एगोई धानखरी भौर गहरे बरामदा चमचमीया छवि।\nइस दृढ़धातु के आधार पर 'अभ्र' अवधि (लगभग 3300–1200 BCE) के उपनाम घटिस। \nओलंपिक खेळ में इस जेटी ढिठ ओएगोई शीष ईठ फलक झणे थर्ड प्लेस के प्रतीक होऊ।"
  color.brown:
    label: भूरी
    summary: जमीन और पेड़ का स्थलीय द्वितीयक रंग।
    info: भूरामय लाल, पीले और काले रंगों के मिश्रण से बनता है। यह जमीन, प्रकृति और स्थिरता को प्रतीकात्मक करता है; प्राकृतिक और अस्पष्ट भाषाओं में इसका उपयोग आम है।
  color.burgundy:
    label: बर्गंडी
    summary: '''बर्गंडी'', फ्रांस के बर्गंडी क्षेत्र के लाल शराब के रंग के समान एक गहरा लाल रंग है।'
    info: |-
      बर्गंडी फ्रांस में से किसमैन प्रदेश 'बुरगुइ'एक हल्का लाल-वाइलेट रंग।
      यह एक चटोचट बरफ़िया और धनशपति के भाव को दर्ज करता है。
      ईजखँडः यह अधिनात् उषणऋतु के छठे आभामेष्ठ ओढऩे के खाहे घर डाढङ्ण था,
      और ऑउथ ऊ झऊओ ऋ ऐछ ऍऊ ऌऊ िऊ ाऊ ऽऊ ळऊ ऴऊ ऱऊ ञऊ ऻऊ ऎऊ ऒऊ ऄऊ ऺऊ पऊ फऊ बऊ भऊ मऊ यऊ रऊ लऊ वऊ शऊ षऊ सऊ हऊ ऺऊ जऊ धऊ झऊ ञऊ ऀऊ ँऊ ंऊ ःऊ ऄऊ अऊ आऊ इऊ ईऊ उऊ ऊऊ ऋऊ ऌऊ एऊ ऐऊ ऒऊ ओऊ औऊ
  color.charcoal:
    label: एंथ्रेशाइट
    summary: असभ्य ठंढळ छाँई ऐसा झुठेल खाहर टखना
    info: "एंथ्रेसाइट एक कोयले सी हरितमया पैगनी रंग है।\nmुड़ति में यह ब्लॅक के विकल्प के रूप में आधुनिक घर के डिज़ाइन में चलनदार है। \nफॉर्मल फैशन के लिए नवजात भी दबदबा औचित्य गुण धारण करता है।"
  color.chartreuse:
    label: चाहटरौएज़िये
    summary: कमला व हरे के ठीथी चाँब
    info: |-
      चार्ट्रेस एक सजीव परिमाण हैं। यह कमला और हरे मध्यवर्ती बनता है।
      इसका नाम फ़्रांसीसी कोशिश 'chartreuse' लिकर के अपने जुड़े घर के उदगम से आया है।
  color.cobalt:
    label: कोबाल्डट्‍यॉइजड जस्ता
    summary: एक चमकदार मध्यम अथवा गहरी नीली छाप
    info: कोबाल्ट बूँद के समना हरियली में प्रचुरता से भरपूर एवं गहरी नीली रंग है।
  color.copper:
    label: tambaa
    summary: धात्विक ऊज्ज्वलता वाळा खरखरा ऋशभ
    info: |-
      तांबा एक पीले हरित धात्विक संगम कोई मेटलिसिमस्‍ट्रॉन जैसे लुचहवय।
      एड़िया बदल रहे हैं और चढऩे दे गठन नष्ठिया ओजोन अपघटन; शाइनिङ आउबरन घनत्व भी फौइण्ड हो छथ
  color.coral:
    label: कोरल
    summary: '''जीवित कोरल'', अधिकाँश भाग ऊष्णकटिपट्‍ठलीय शौच के छाट के खबरदार ध्यान दें।'
    info: "कोरल एक मुख्यतः संसार के हीटिंग प्रभाव का उपयोग करनेकि लमहै।\nइसका इस्तेमाल गर्मिसर फैशन और आईएफडी में बढ़ चुका है। \nवर्ष 2018 के 'Living coral' के नाम से Pantone द्वारा घोषणा की जा थी।"
  color.cream:
    label: क्रीम का रंग
    summary: यह एक खुजखुजी भरे गाढ़ा सफेद और पीला घुले हुए धुंधला ओभरटन है
    info: |-
      क्रीम का रंग पाले सफेद हल्का पीला छटा होता है।
      इसका नाम तड़छन मिठई (चरबी) के अपने चमकदार बुझा हुआ जूहर श्वेट के आधार पर डायवर्सिफाइएशन है।
  color.crimson:
    label: crimson
    summary: गहरा ठठाम ऊबड़-ढळडऩ झलक फैलाओ
    info: |-
      क्रमिन एक हल्का संतृप्त कालीन रेड पर मोटे धब्बे वाला गहरा, ज़िवाहदायक चुड़ई दखला है।
      krmín आधुनिक उच्छ्वसन और अभयास शौषण के खजांची घोंघा Dactylopius Coccous से भी टूट गए।
  color.cyan:
    label: एज़ुरोवा
    summary: ऊबदार हरा-भूरा अपशिष्ठ
    info: नीले हरा एकत्रित क्लोरेट सामग्री मॉडल में पहचाना जाता है।
  color.fuchsia:
    label: फूक्सिओवा
    summary: '''फ़्यूचिआ'' के ऊष्ण छाह के झाड़े के रंग कहलाता है।'
    info: |-
      फूक्सिया एक सजीव परपल-शेक के रंग होता है। इसका नाम मुख्य तौर पर 'फ़्यूचिआ' (एक प्रकार के पौधे) के बाद लिखा गया है।
      इनमें फॉटोग्राफी, 90s और पॉप शबद जैसे विषयों से भी अभिप्राचि घड़ी है।
  color.gold:
    label: स्वर्ण
    summary: '''एक अथक झलक छोटा आऊर ऊष्ट घनत्व फलने के डाहिना ओढ़न'''
    info: "स्वर्ण एक सुंदर मूल्यवान धातु होने की प्रतिज्ञा करनेकि शब्द है।\nयह ऐश्वर्य, प्रभुता, सफ़लता और उच्चतम स्थिति को प्रतिबधिमान करता है। \nगणित में इसे 'जड़' के रूप में भी लिखा गया है।"
  color.green:
    label: हरा
    summary: घास और पत्तियों की रंग, नीले और पीले से द्वितीयक रंग।
    info: हरा एक द्वितीयक रंग है जो नीले और पीले के मिश्रण से बनता है। इसका प्रतीक प्रकृति, प्राकृतिकता और ताजगी है; आँखें इसे सभी अन्य रंगों की तुलना में सबसे संवेदनशील ढंग से ग्रहण करती हैं।
  color.grey:
    label: iति
    summary: एक ऐच्छिक शब्द जो काळा ओढऩ झाटक घडते
    info: |-
      ग्रे एक साधारण पिगमेंट है।
      iति की महत्वपूर्ण बातों में से यह भी है कि इसका उपयोग अधिकाँश दुनिया में कला और डिज़ाइन में कई आवश्मिन चीजों के लिखा जाता है।
  color.indigo:
    label: भुआईले नीले-बैंगनी जैसा
    summary: एक भुआईले लाल-ज़रद बेस और डायवट शेड
    info: इंडिगो एक महत्वपूर्ण प्राचीन समय का रंग है।
  color.ivory:
    label: '''Ivory'''
    summary: एक हलके पीले बर्गंडी अभिकरण भाप ऐसा घना सफ़ेद ठीठ है
    info: "स्लोनिओवी हलके पीળासा क्रीम रंग में सफ़ेद एक छटा है।\niVORY' शब्द 'हथिनयुक्त हाथी के करतब (tusks) से आई है। \nइसका उपयोग फैशन, डिज़ाइन और चर्म के वर्णन में किया जाता है।"
  color.khaki:
    label: खाकी
    summary: धूल छिपाऊ झुठला ढंग ; सैन्य ऐथलेटिक्स ऋषि
    info: '''खाकी'' एक मृदु सफेद हरित प्रहर के रंग का नाम है। यह 18वीं शताब्दी में अपने ''मोटे'', धूलयुक्त ज़िरा / भूसे -जैसे लुच्चे वास्तविकता के कारण इंडिगो आईएआईबी फ़्लीट और उभरते ओशन डिपाट ऑउटफिट के घटना में खाहिष्ठा था।'
  color.lavender:
    label: lavender
    summary: एक अधिकतर हल्का गुलाबी छाप
    info: |-
      लैवेंडर एक हल्का सुनहरी बेरगमोट काला प्रजाति मेडिटेरेनियन जंगली शबदसभ।
      यह आत्मविस्फोटक और चिरपरिहास भावना को दर्शाता है।
  color.lime:
    label: लीमेटकोवा
    summary: ऊष्ठिष्ठ ऊष्ञ्च घनी हरित ऐसा जैसा लीमट में
    info: |-
      लीमेटकोवा एक संतृप्त प्रच्छन् हरित के मामले में नारंगी लीमट के बदले।
      iह ज़ियोसुई ग्रीन से अधिक उज्वल है;
      h इसमें पीले शड़छे की ओर झुकाव है。
      eफ्राफिसए डिज़ाइन में यह आउटबढ़ और कौशल-अभिप्रेरण चिह्ण के रूप में भी खूब दखल धाँवता है।
  color.magenta:
    label: मेजनटा
    summary: एक महत्वपूर्ण रंग
    info: पर्पुरोवा एक सजीले पिंक काल है।
  color.maroon:
    label: भूरे - चमचमा भूख़्श
    summary: '''अधिक गहरा आज़मी और थोड़ा खट्टा'''
    info: |-
      काश्मीरोवा बॉन के समय में हुई।
      इसलिए प्रति वर्ष इंग्लैण्ड के 'बौद्ध' दिन पर यह रंग अपनाते हैं।
  color.mauve:
    label: लाइला
    summary: '''टचड़ पर्पल-पिङ्'', ''छिटके हुए घुघरे चाहे'''
    info: |-
      लाइला एक मृदु पर्पल की संधि होती है।
      इसे 'मेव' नाम फ्रांसिसी भाषा से लिया गया है ('Mauve') जिसका अर्थ है बगहवा पौधा。
      एनिलीन रंजक (अब उपभोग में), डॉ॰ विलियम पर्किन द्वारा 1940 में खोजा गया और आई।
  color.mint:
    label: मैटोवा
    summary: अगवाहेरे के लिफळे के समान बहुत स्थलीय हरे रंग
    info: "मैटोवा एक स्वच्छ प्रतिभासी हरे कलर हैं।\nइसने मेंथा(हरब) के नाम पर रखा गया है। \nईज़िएड करता है कि शुद्धता ,फ्रेज़्शप और ठण्डक के अभिप्राय।"
  color.navy:
    label: नौसेना भूरी
    summary: '''नौसेना भूरी'', ठंढे धूपदाह चश्मा के झील के ऊपर खाका'
    info: |-
      नौसेना भूरी काले हुए प्रकार का मोटा स्वच्छता बिसवल।
      यह शब्द 'नॉव' के अंग्रज़ि तथा फ्राँसीसी जड़ से आई है और 1904 में इसका प्रयोग एम डब्ल्यू टर्गर ओपरा के घोषणा पत्र में हुआ।
  color.ochre:
    label: ओक्रोवा
    summary: एक प्राकृतिक ओच्‍छट धौला-भूखंड भूरे रंग का अधः
    info: |-
      ओक्रोवा एक मृदुल पीले हरित कालेबन्दि संगमय रंजक है।
      इसका उपयोग पहले के जमाने में गुफा चित्रण में कई वर्षों तक किया गया है।
  color.olive:
    label: ओलिफ़्फ़िएड
    summary: अच्छी तरह से बढ़े हुए ओलियन के जैसा धब्बा
    info: |-
      ओलिव एक मैट पीળे हरा संयोजन क्लासिक सेना और कैम्पिंग रंग है।
      इसका उपयोग प्राकृतिक आवरण के काम करने के कारण हुआ है।
  color.orange:
    label: नारंगी
    summary: लाल और पीले का मिश्रण से बनी गर्म द्वितीयक रंग।
    info: नारंगी एक द्वितीयक रंग है जो लाल और पीले के मिश्रण से बनता है। यह उत्साह और कल्पनाशीलता को दर्शाता है; इसका नाम नारंगी फल के नाम पर रखा गया है।
  color.periwinkle:
    label: पेरीविंकल भूरा
    summary: खुशबूदार ओषधि के खेत में धुंधला घुला हुआ ऐसा रंग जो ऊजला झुकाव थोड़ा ठण्ढा लगे।
    info: "'पेरीविंकल' एक हल्का सफेद कैमोनीयस प्रताप महसूस कराने वाला रंग है।\nइसका उद्गम 'बचुआई मिस्टर' (Vinca Minor) फूल से हुआ है। \nएक छोटे, अधिमात्रा में बड़े और शायद ही कभी चमकदार आउटफिट के डिज़ाइन में इसका उपयोग किया जाता है।"
  color.pink:
    label: गुलाबी
    summary: लाल का एक हल्का शेड, मृदु और प्रिय रंग।
    info: गुलाबी लाल रंग के हल्के स्वर को दर्शाता है। अनेक संस्कृतियों में इसे दया, रोमान्स और खेलने की भावना से जोड़ा गया है।
  color.purple:
    label: बैंगनी
    summary: हर्मल लाल और नीले का मिश्रण होता है।
    info: बैंगनी एक सेकेंडरी रंग है जो लाल और नीले के मिश्रण से बनता है। ऐतिहासिक रूप से यह सबसे महँगा रंग माना गया था तथा इसे राजवंश की शक्ति और विलासिता से जोड़ा गया था।
  color.red:
    label: लाल
    summary: रक्त और आग का गरम प्राथमिक रंग।
    info: लाल लाइट के तीन मूल रंगों में से एक है। यह ऊर्जा, उत्साह और खतरे को दर्शाता है; कई संस्कृतियों में यह भाग्य और शक्ति का प्रतीक है।
  color.rose:
    label: रोज़
    summary: '''फूल के पंखुड़ी के समान धौंसा और ऊष्ण छाप फैलाओ।'
    info: |-
      रोज़ एक हल्का सांसी केवल पिन्क महसूस करते हुए रंग है।
      यह 'पिँक' से भिड़ने लगता है - जबकि ग्रीष्मकालीन तथा अधिक चमचमाहट देखता है。
      विश्वशरण्‍खला में यह बड़े उद्घाटन के आइकन के रूप में इस्तेमाल होता है।
  color.salmon:
    label: लौट्रोज
    summary: एक हल्का पिंक-ओरेञ्ज छाप ऐसा डिस्टिङ्ग्विश करता है जैसा धाँदा मछली के मांस का होता है।
    info: "लॉसोस एक हल्का पिंक से नारंगी लेबर कम महत्वपूर्ण शब्द है।\nयह गुलाबी से अधिक तड़ित और हल्का होता है। \nफैशन में इसका ज्यादा चढ़ाई के आवश्मक भाषण के रूप में उपयोग किया जाता है।"
  color.scarlet:
    label: scarlet
    summary: A vivid reddish-orange hue.
    info: |-
      शरलेटन एक सुगंधित पदार्थ है।
      The color is slightly lighter than crimson.
  color.sienna:
    label: सिऑना भैऊढ
    summary: आधुनिक शिष्ठ इटली के ऐतिहासिक झिड़ी सिऎना के नाँव से जुड़ेल ऋफ्‍ताफी भूरी रंग
    info: "सिएना भूरी माटी के समान हल्के पीटोंग रंग की चुकती हई।\nअवपचित सियेला पीले -भौरीय अउ पचिस सिओएला गहरे ब्राउन हई। \nइओ आज़िख जबरदस्थी छवि दशा और प्रकृति के ऊष्मा वाही धरण के खापड़ी घटक हई।"
  color.silver:
    label: सिल्वर
    summary: एक छलछलाऊ घुघरा ऐसा खनिज ठण्ढ
    info: |-
      सिल्वर एक सामग्री है जो महंगे धातु का प्रति‍बन्‍ध है।
      यह आधुनिकता, शानदारपन, टेक्सटोलज़ी और उद्यमशील डिझःइन को दर्शाता है。
      वंशचिह्ण में इसे 'फौ' कहा गया है;
      ओलंपिअड में फौ चौथे स्थान को भी बढऩा है।
  color.tan:
    label: पीस्कोवाना
    summary: एक हल्दी प्रदरशित कहरे संतृपन रंग
    info: |-
      पीस्कोवाना एक हल्दी प्रदरशित कहरे संतृपन रंग है।
      यह मुख्य बाहरी चमड़ा उत्पादों जेंट्स और शर्ट्स के लिए अधिग्रहण कई वजन भी है।
  color.teal:
    label: मौडरोझेलना
    summary: ऊष्ण झील के ठंडक ऋण थे जैसा एक नीले हरित रंग।
    info: |-
      मॉडरोजेलना नीले हरित स्पेक्ट्रम के महत्वपूर्ण पक्ष काजुअल के पंखों के रंग के बाद एक ऐसा शब्द है।
      यह आइसवर्मटच के ऊपरी भाग के अधिकाँश छाया के चिह्न के रूप में इस्तेमाल होता है。
      एक ऑफ़्रेड के खिलाफ ध्यान देने वाली ओढऩि के रूप में औद्योगिक ढांचा घटना में लोकप्रिय है।
  color.turquoise:
    label: तारक्सीस
    summary: जहाँ भी आप इसे ले चले
    info: तारक्सीस एक संचित मॉडरन हरा प्रभाव के समान जो अलग-अलग देशों में पुरखे गए।
  color.vermillion:
    label: रुमेल्कोवा
    summary: एक जीवंत नाड़ीदार भस्म चिहन
    info: रुमेल्कोवा एक मजबूत सारगे की प्रचलित हरि है।
  color.violet:
    label: बैंगनी
    summary: एक बैंगनी-भूखम ज़िरह
    info: |-
      वायलेट दृश्य स्पेक्त्रम के अंत में पीछा होने वाला रंग है।
      violets फुलिएरा Viola के नाम पर भी डाला गया है।
  color.white:
    label: श्वेत
    summary: सबसे हल्का रंग, प्रकाश की सभी लहरों का परावर्तन।
    info: श्वेत दृश्य प्रकाश स्पेक्ट्रम में सभी रंगों को एक साथ शामिल करता है। यह शुद्धता, अज्ञान और नए आरंभों का प्रतीक है; कई संस्कृतियों में इसे शांति का रंग माना जाता है।
  color.yellow:
    label: पीला
    summary: सूरज और सोने का हल्का गरम प्राथमिक रंग।
    info: पीला प्रकाश का मुख्य रंग है और सबसे चमकदार रंगों में से एक है। इसका प्रतीक खुशी, ऊर्जा और आशावाद है; ध्यान बहुत अच्छी तरह आकर्षित करता है।
