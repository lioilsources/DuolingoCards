lang: hi
pivot: false
title: मूल रंग
cards:
  color.black:
    label: काला
    summary: सबसे गहरी रंगत, प्रकाश की अनुपस्थिति।
    info: काला सभी दृश्यमान प्रकाश की अनुपस्थिति होती है। इसका प्रतीक उदाहरण के तौर पर आकर्षकता, रहस्य और शक्ति में होता है; फैशन में इसे एक मूल विश्वव्यापी रंग माना जाता है।
  color.blue:
    label: नीला
    summary: आकाश और महासागर के प्रकाश का एक ठंडा प्राथमिक रंग।
    info: नीला प्रकाश का एक ठंडा प्राथमिक रंग है। यह दुनिया का सबसे पसंदीदा रंग है और शांति, विश्वास और गहराई को प्रतीकत्मक करता है।
  color.brown:
    label: भूरी
    summary: जमीन और पेड़ का स्थलीय द्वितीयक रंग।
    info: भूरामय लाल, पीले और काले रंगों के मिश्रण से बनता है। यह जमीन, प्रकृति और स्थिरता को प्रतीकात्मक करता है; प्राकृतिक और अस्पष्ट भाषाओं में इसका उपयोग आम है।
  color.green:
    label: हरा
    summary: घास और पत्तियों की रंग, नीले और पीले से द्वितीयक रंग।
    info: हरा एक द्वितीयक रंग है जो नीले और पीले के मिश्रण से बनता है। इसका प्रतीक प्रकृति, प्राकृतिकता और ताजगी है; आँखें इसे सभी अन्य रंगों की तुलना में सबसे संवेदनशील ढंग से ग्रहण करती हैं।
  color.orange:
    label: नारंगी
    summary: लाल और पीले का मिश्रण से बनी गर्म द्वितीयक रंग।
    info: नारंगी एक द्वितीयक रंग है जो लाल और पीले के मिश्रण से बनता है। यह उत्साह और कल्पनाशीलता को दर्शाता है; इसका नाम नारंगी फल के नाम पर रखा गया है।
  color.pink:
    label: गुलाबी
    summary: लाल का एक हल्का शेड, मृदु और प्रिय रंग।
    info: गुलाबी लाल रंग के हल्के स्वर को दर्शाता है। अनेक संस्कृतियों में इसे दया, रोमान्स और खेलने की भावना से जोड़ा गया है।
  color.purple:
    label: बैंगनी
    summary: हर्मल लाल और नीले का मिश्रण होता है।
    info: बैंगनी एक सेकेंडरी रंग है जो लाल और नीले के मिश्रण से बनता है। ऐतिहासिक रूप से यह सबसे महँगा रंग माना गया था तथा इसे राजवंश की शक्ति और विलासिता से जोड़ा गया था।
  color.red:
    label: लाल
    summary: रक्त और आग का गरम प्राथमिक रंग।
    info: लाल लाइट के तीन मूल रंगों में से एक है। यह ऊर्जा, उत्साह और खतरे को दर्शाता है; कई संस्कृतियों में यह भाग्य और शक्ति का प्रतीक है।
  color.white:
    label: श्वेत
    summary: सबसे हल्का रंग, प्रकाश की सभी लहरों का परावर्तन।
    info: श्वेत दृश्य प्रकाश स्पेक्ट्रम में सभी रंगों को एक साथ शामिल करता है। यह शुद्धता, अज्ञान और नए आरंभों का प्रतीक है; कई संस्कृतियों में इसे शांति का रंग माना जाता है।
  color.yellow:
    label: पीला
    summary: सूरज और सोने का हल्का गरम प्राथमिक रंग।
    info: पीला प्रकाश का मुख्य रंग है और सबसे चमकदार रंगों में से एक है। इसका प्रतीक खुशी, ऊर्जा और आशावाद है; ध्यान बहुत अच्छी तरह आकर्षित करता है।
