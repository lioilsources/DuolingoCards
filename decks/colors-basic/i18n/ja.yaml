lang: ja
pivot: false
title: 基本的な色
cards:
  color.amber:
    label: ジェントラーワ
    summary: 鉱石「琥珀」のような暖かみのある黄金橙色
    info: |-
      ジェンタロヴァは、化石樹脂である琥珀（こほく）という鉱物にちなんで名付けられた温かい金色オレンジ色です。古代では装飾や精神的な用途で重宝されていました。
      琥珀の信号灯として使われる黄色い光は世界共通的に注意を意味する象徴となっています。
      前層位内包体が含まれた琥珀には最大一億年前までの生物の希少な化石があります。
  color.aqua:
    label: アクア
    summary: 清らかな水中のように見える明るい青緑色
    info: アクアは明るい青緑色のことであり、HTMLやCSSでは「シアン」と同じ意味（#00FFFF）です。名前はラテン語で水を表す『aqua』に由来します。「アクア」は熱帯海やプールのような澄んだ水面と新鮮さを感じさせます。グラフィックデザインにおいて現代的なインターフェースのために対比となるカラーとしてよく使われています。
  color.azure:
    label: アズール
    summary: 夏季の空のように明るい天気を表す青
    info: |-
      アズール（青碧）は、夏の空のような明るく鮮やかな青色で、「ラピス・ラザリ」から名前が取られている。多くの国の紋章に使われており、フランス、イスラエル、フィンランドなどが挙げられる。
      レナissance期には金よりも高価な素材として聖母マリア像の紫衣にも使用されていた。
  color.beige:
    label: べーじゅう
    summary: 淡い砂漠のような茶系；温かなニュートラルカラー
    info: ベージュは白とゴールドブラウンの中間にある明るく温かい色です。古代フランス語で「自然な波」という意味の単語に由来しています。インテリアデザインでは、暖かさを帯びた中性カラーとして広く使用されています。
  color.black:
    label: 黒
    summary: 最も暗い色、光の不在。
    info: 黒はすべての可視光が存在しない状態です。エレガンスや謎、権力などの象徴とされ、ファッションでは基本的な普遍的な色とされています。
  color.blue:
    label: 青
    summary: 空と海の冷たい一次色。
    info: 青は光の冷たい一次色です。これは世界で最も人気のある色であり、落ち着き、信頼感、深さを象徴しています。
  color.bronze:
    label: bronze
    summary: 銅のような金褐色の金属的な暗い色
    info: |-
      {"bronze"は銅と錫の合金を連想させる暗い金色褐色の金属色です。
      青銅器時代（紀元前約3300年～1200年）という名前の由来にもなります。
      オリンピックでは、この「bronze」が三位を象徴するメダルとして使われています。
      また、「bronze」で作られた像は公共空間に特有なものです。
  color.brown:
    label: 茶色
    summary: 大地や土を表す地味な二次色。
    info: 茶色は赤、黄、黒の混合によって作られる二次色です。大地や自然、安定性を象徴しており、自然や秋に関するテーマでよく使われます。
  color.burgundy:
    label: '"burgundy"'
    summary: 「ブルグンディ」は、フランス産の赤ワインのような深い紅茶色
    info: "{\"hint\":\"暗いワインレッド；濃紺のマーブル紫\",\"info\":\"ブルゴニューシュは、フランスにあるブドウ栽培地域であるボルドー（bourgogne）にちなんで名付けられた深みのある赤紫色です。\r\nこれは赤ワインや高級感・豊かさを連想させます。\r\nファッションでは最も人気がある秋色の一つであります。\r\nゴールド、ベージュおよびネイビーとよく調和します。\"}"
  color.charcoal:
    label: antracite
    summary: wood coal-like very dark gray color
    info: |-
      アントラサイト（木炭）色は、非常に暗い灰色でほぼ黒に近い。これは木材から作られる石炭のような外観をしている。
      moodなインテリアデザインではブラックの代わりとして人気がある。
      fashionにおいてもフォーマルウェア向けの中性カラーとしても適している。
      antraсit色のシャツやスーツはblackよりもエレガントである。
  color.chartreuse:
    label: 黄緑
    summary: 黄色と緑の中間に位置する活気ある色
    info: チャトレーゼ（黄緑色）は、スペクトル上で黄色と绿色のちょうど中間にある鮮やかな色彩です。この名前は同名のフランス修道院で作られるハーブリキュール「シャトリューズ」に由来します。これは人間の目にとって最も見やすい色の一つであり、パイロット用ベストやスポーツ関連マークなどでは最大限の視認性を得るためにしばしば使用されます。
  color.cobalt:
    label: クオーツ
    summary: コバルト顔料のように生きている中程度～深みある青
    info: |-
      {"hint":"コバルト顔料のような鮮やかな中〜暗い青色","info":"クォルツブルーは、化学元素のコバルト（Co）にちなんで名付けられた明るく濃密な青色です。\nこの藍染めは18世紀後半から最も人気のある絵画用青系色素でした。
      陶器・ガラス製品および芸術作品にも使用されています。
      ヴィンセント＝ファン＝ゴッホも好んで使った色彩として知られています。
      "}
  color.copper:
    label: 銅
    summary: 銅のように輝く紅褐色
    info: |-
      銅色は、金属の光沢を持つ赤茶系で、人間が最初に加工した素材である金属「銅（コッペル）」を連想させる。青銅器時代と呼ばれる時期にはすでに使用されていた。
      古い銅製屋根は酸化によって緑がかって見えることがある；この状態では、「グリーン・カーブ」として知られる淡い碧緑色になることもある。
      また、「アバースン」という表現も使われていて、これは火のようなオレンジや赤みのかかった髪色のこと。
  color.coral:
    label: 珊瑚
    summary: 活気に満ちた桃色から橙色のような海水のサンギュームの色彩。
    info: |-
      コラロヴァは、オレンジとピンクの中間で海のサンゴに名前を取った温かみのある鮮やかな色です。
      夏ファッションおよびインテリアデザインにおいて非常に人気があります。
      パントン社によって「リビング・コーラル」として2019年のカラー・オブ・ザ・イヤーにも選ばれました。
      この色にはシトリングリーン（ターコイズ）、白、そしてゴールドがよく合います。
  color.cream:
    label: '"クリーミー"'
    summary: 「新しい生クリームのように見える非常に薄くて黄色っぽい白」
    info: '{"hint":"非常に淡い黄色や白、新鮮なクリームのような色調","info":"クレームボアはとても明るく黄味がかった白色です。\nこの名称はフレッシュクリームの色から来ています。\nインテリアデザインでは純粋なホワイトよりも温かみのある代替として使用されます。\nスケール上では真っ白とアイボリーの中間的な位置にあります。"]'
  color.crimson:
    label: クマイン
    summary: とても濃厚な赤色である；サルレットより暗い。
    info: |-
      {"hint":"深く鮮やかな赤色で、サルレットよりも暗い","info":"カーミンは紅虫（ダクトイロピアス・コッキウス）から伝統的に作られていた染料色素に由来する深い濃い赤の名前です。
      これはハーバード大学が使用しているカラーであり、「ハーバート クリムソン」とも呼ばれます。
      紋章学では「グールズ(gules)」と表記されます。","label":"クマイン(カーマイン)","summary":"非常に濃密な赤；サルレットより暗い。"
  color.cyan:
    label: アズローヴァ
    summary: 明るく活気のあるブルーグリーン；印刷用四原色のひとつ
    info: 青緑色（シアン）は、鮮やかな碧いグリーンで、RGBモデルではR：0、G：255、B：255の値を持つ。これはCMYK印刷における4つの基本カラーの一つである（C＝シアン）。自然界においても晴れた日に浅い熱帯海が持つような美しい色彩として現れることがある。
  color.fuchsia:
    label: フクシア
    summary: フクシア花のような生きている紫色調
    info: |-
      フクシア色は、植物のフクシア（Fuchsia）にちなんで名付けられた鮮やかな紫ピンク色です。
      この植物はドイツ人のボタニストレオナハルト・フォックス氏(1501–1566)に因んで命名されました。
      CSSおよびHTMLでは「マゼンタ」(#FF00FF)と同義語であり、「ポップなファッション」「80年代文化」と関連づけられる目立つ色彩として知られています。
  color.gold:
    label: ゴールド
    summary: 貴重な金属である黄金のように深い輝かしい黄緑
    info: |-
      {"hint":"貴重な金属のような深く明るい黄色","info":"ゴールドは、金という高価な金属を連想させる色です。
      富や威厳・成功そして荘厳さの象徴でもあります。
      紋章学ではエッチングに直接使われる二つの金属（ゴールドとシルバー）の一つで
      競技会およびオリンピックにおいて最高位のパフォーマンスを示すのがゴールドメダルです。"}
  color.green:
    label: 緑
    summary: 草や葉の色、青と黄からなる二次色。
    info: 緑は青と黄色を混ぜることでできる二次的な色です。自然、生命力、新鮮さを象徴しています。人間の目にとって最も敏感に認識される色でもあります。
  color.grey:
    label: gray
    summary: BlackとWhiteの中間に位置するColor；雲やコンクリートと同じcolor
    info: |-
      {"hint":"灰色、黒と白の間にある色","info":"グレーは白色と黑色を混ぜて作られる無彩色です。\n中立的で目立ちにくいと考えられています。\n心理学では中立性やバランス感覚そして時には地味さを象徴します。\n濃いトーンではアントラサイト（石炭のような）とも呼ばれ、明るい調子ではほぼ白に近づきます。
      "}
  color.indigo:
    label: インディゴ
    summary: インディゴ色素のような暗い青紫の色
    info: インディゴ色は、植物のインドリゲラから得られる染料「インディゴ」にちなんで名付けられた深く青みがかった紫色です。何千年もの間、インディゴは最も高価な染料とされていました。これは七つの虹の色（ROYYBIV：レッド、オレンジ、黄色、緑、ブルー、インディゴ、バイオレット）の一つでもあります。
  color.ivory:
    label: アイボリー
    summary: 象牙のようにクリーム色がかった白；純白よりも暖かい
    info: アイボリーは、象牙のような繊細な黄色味を帯びたクリーム色の白い色彩です。この名称は「象牙（イヴォア）」に由来します。「モード」「デザイン」といった分野や肌の描写にも使われます。純粋な白色とは異なり温かみのある印象を持ち、「白と少し黄またはベージュを混ぜることで作られます。
  color.khaki:
    label: カーキ
    summary: 明るく落ち着いた黄褐色；軍隊の野外調和色
    info: カーキは、英国軍がインドで用いた淡い茶色や黄色の落ち着きのある色彩です。この言葉はウルドゥ語およびヒンディー語から来ており、「ほこり」または「泥」という意味があります。「カーキ」は現在でも主に軍服とアウトドアウェアとして使用される基本的なカラーであり、また第二次世界大戦後もファッションにおいて定番アイテムとなっています。
  color.lavender:
    label: レモン
    summary: とても明るく柔らかな紫色
    info: ラベンダーカラーは、ハーブのラバンデュール（学名：ラヴァンズ）に由来する淡い紫で、落ち着きと清潔感を連想させます。フランス南部プロヴァンス地方やリゾート地のような風景とも関係があります。アロマテラピーでは、この香りがリラックス効果や良質な睡眠に関与するとされています。
  color.lime:
    label: りめっとこば
    summary: レモンのような生きているような黄緑色。
    info: |-
      リメットコヴァ（ライム）は、柑橘類のレモンにちなんで名付けられた明るく鮮やかな黄緑色である。
      葉っぱグリーンよりも目立つ色彩であり、黄色味が強いのが特徴だ。
      グラフィックデザインではアクセントとして広く使用され、アクションを促すカラーとしても使われる。
      安全ベストも高可視性のために通常この色で作られている。
  color.magenta:
    label: 紫色
    summary: 明るいピンク寄りな紫色；赤と青の中間に位置します
    info: マゼンタ（紫）は、赤と青の間にある鮮やかな色であり、可視スペクトルには対応する波長を持たない。この名前はイタリアで起こったメガンティ戦争(1859年)に由来している。
  color.maroon:
    label: かしわ
    summary: 濃いワインレッド；深みある紅褐色
    info: カシス（マロン）という名前の栗色は、スペイン語の「marrón」に由来する暗い赤茶色です。ファッションやスポーツウェアおよび制服で人気のあるカラーであり、「maarun」という英単語には孤立した無人の島へ放逐された人物を意味することもあります。
  color.mauve:
    label: リラ
    summary: 落ち着きのある紫色調；ほこりっぽい薄紫
    info: |-
      {"info":"リラ（マーブ）は淡く落ち着いた紫がかったピンク色です。
      名前はフランス語の『mauve』つまりスレゾウニク、学名Malva silvesterisに由来します。
      これは最初の人造的に作られた染料であり（アニリン・バイオレット、ウィリアム・パーキンによって発見されました。）、ヴィンテージやビクトリア朝風美術において人気があります。
  color.mint:
    label: マトバ
    summary: 非常に淡く、ミント葉のようなグリーン
    info: |-
      マトバは、ハーブのミント（メント）にちなんで名付けられたフレッシュな明るい緑色です。
      cleanlinessや新鮮さと冷たさを連想させます。現代インテリアデザインおよびレ트ロエスティート（特に1950年代風）で人気のあるカラーでもあります。「マトバアイスクリーム」または「マトバティー」といった関聯もあります。
  color.navy:
    label: 航海用藍
    summary: 夜間の大西洋のようなとても濃い青。
    info: |-
      ナビーブルー（海軍青）は非常に暗いブルーカラーです。
      この名前は、18世紀のイギリス皇家海軍（ロイヤル・ネイビー）制服から来ています。
      moodとフォーマルな服飾において最も人気のある基本色の一つであり、白やベージュ、ゴールドとの相性が良いです。
  color.ochre:
    label: окровая
    summary: 天然の色素として知られる地色調の黄色みのある茶色
    info: オクルーヴァは、鉄の水酸化物である色素「オークリュ」にちなんで名付けられた地味な黄褐色です。これは最も古い時代から使われてきた顔料であり、旧石器時代の人々が洞窟壁画で使用していました。「赤土」として自然の中に存在しており、「アルタミラ」「ロザンヌー」などの洞窟絵画にも見られます。
  color.olive:
    label: オリーヴ
    summary: オリブのようなくすんだ黄色いグリーン
    info: |-
      オリーブ色は、オレア・エウロピーア（木の実）にちなんで名付けられたややくすんだ黄緑色です。
      これは自然環境で目立たないため、軍隊およびキャンプ用カラーとして一般的なものです。
      ファッションでは伝統的にミリタリー風スタイルと関連しています。
      ベージュ、ブラウン、カシス色などとの相性が良いです。
  color.orange:
    label: オレンジ
    summary: 赤と黄から作られる温かい二次色。
    info: オレンジは、赤と黄色を混ぜることでできる二次色です。情熱や創造性を象徴しています。この名前はオレンジの果物に由来します。
  color.periwinkle:
    label: '"ペリウィンクラー ブルー"'
    summary: '"ヴェイコ・マイナーような花のように見える明るくて淡い青紫色。"'
    info: |-
      {"hint":"ヒント：ペリウィンクルの花のような淡い青紫色","info":"パールホワイトは、ヴェイコ・マイナー（学名 Vinca minor）という植物から取られた明るく柔らかな紫がかった青色です。
      これは薄藍とラベンダーの中間的な色彩であり、ファッションやインテリアデザインで人気のある繊細かつロマンチックなカラーとして知られています。
      HTMLではおよそ#CCCCFFに近似します。"}
  color.pink:
    label: ピンク
    summary: 赤の明るい色調、柔らかく愛らしい色。
    info: ピンクは赤色の淡いトーンです。多くの文化で思いやり、ロマンス、そして遊ぶ心と結びついています。
  color.purple:
    label: 紫
    summary: 赤と青から生まれた神秘的な二次色。
    info: 紫色は、紅（こう）や藍（あい）などから作られる二次色であり、歴史上最も高価な色彩として王権や豪華さの象徴となっていました。
  color.red:
    label: 赤
    summary: 血や火の温かな一次色。
    info: 赤は光の三原色の一つです。エネルギー、情熱、そして危険を連想させます。多くの文化では幸せと力の象徴でもあります。
  color.rose:
    label: ロージュ
    summary: バラの花びらのような柔らかなピンクリン
    info: |-
      ローズ（Rose）は、バラの花にちなんで名付けられた淡いピンク色です。
      ピーカーな明るさと赤みが特徴で、「ライトピンク」よりも暗く、よりレッド寄りになります。
      サミュエル・ベケットによれば「心にとって自然な色彩はないほど美しいのがロゼカラー」とされています。また紋章学では英王王国国徽にも見られる「ヘラルドックスローズ（紋章用ロズ）」として登場します。
  color.salmon:
    label: サーモンピンク
    summary: サーモンの肉のように見える明るい桃オレンジカラー
    info: サーモンピンクは、サーモンの身のような柔らかいピーチ色で、ローズよりも繊細な代替としてファッション業界で広く使用されています。インテリアデザインでは温かみと親しみやすさを演出します。
  color.scarlet:
    label: シャラト
    summary: 明るくて橙みのある赤色；karmínよりも明るい
    info: |
      {"hint":"明るい赤色でわずかなオレンジのニュアンスがある","info":"シャラトは、染料であるシャルカから名付けられた鮮やかで橙みがかった赤色です。\nkarmínよりも少し明るく、より橙味があります。\nhistoryでは高級な赤い生地を指していました。\nThe Scarlet Letter（ハザードン）の中にある"scarlet letter"は恥辱の象徴です。
  color.sienna:
    label: Sien'ska Hned'
    summary: 「Sien'ska hned'」とは、天然由来の赤みがかった茶色調の颜料である
    info: |-
      {"hint":"赤みがかった茶色の土質顔料（生または焼成済）","info":"シエナ赭は、イタリアの都市スィエーナにちなんで名付けられた地味な紅褐色の色彩です。\n Raw Sienna(生赭石)は黄ばんだ茶色でBurnt Sienna(Burned)は赤く燃えたような茶色になります。
      これはルネッサンス絵画において人気のある温かさを帯びた自然的な土質色素であり、アクリル画材として基本となる暖かいブラウンカラーとしても使用されます。
  color.silver:
    label: シルバー
    summary: 銀という金属のように光る灰色
    info: |-
      {"hint":"銀の金属のような輝く灰色","info":"シルバーは高価な金属である銀を連想させる、金属性質を持つ色です。
      現代性やエレガンス、技術および工業デザインを象徴しています。
      紋章学では第二位に位置する金属であり；オリンピックでそれは二位を表します。
      多くの国々において自動車が持つ最も人気のある塗装カラーです。"}
  color.tan:
    label: piškovana
    summary: 焼き上がった皮膚のような明るいうす褐色
    info: |-
      {"info":"ピスコヴァナ（タン）は、土や焼けた肌に似た淡い茶色の色彩です。
      この名称は革を加工する「タンニング」から来ています。
      ベージュと近いですがわずかに暗く、黄みがかった茶色調となっています。\nmoodでよく使われており、レザーアクセサリーや靴・ジャケットなどにも広く利用されています。
  color.teal:
    label: mojurozurenā
    summary: 海のような青みを帯びたグリーン
    info: |-
      モドロゼレナ（テール）という色は、アヒルの種であるクリエック・クレンチャ（学名：Anas crecca）から来ている。この鳥類の翼にはそのような青緑が見られる。
      これはターコイズ系の中で上部に位置する色彩であり、グラフィックデザインではオレンジと対照的に使うことが多い。
      cssで使用される速記コードは#008080。
  color.turquoise:
    label: トルクイゾ
    summary: 熱帯水域のように生きているような明るい青緑
    info: トルコ石ブルーは、古代エジプトやペルシャおよびアメリカで珍重された半宝石「トルマリン」に由来する鮮やかな青緑色です。これは熱帯の海・海水氷または晴れた日の空のような色彩を指します。デザインでは清潔感がありリフレッシュしモダンな美学として利用されます。
  color.vermillion:
    label: ルメルコヴァ
    summary: ルメルカのような生きているような紅 orange 色
    info: |-
      ルメルコヴァ（ヴェルミリオン）は、鉱物のルメルカ（辰砂、HgS）にちなんで名付けられた鮮やかな赤橙色である。これは歴史上もっとも広く使われた赤い顔料の一つであった。
      中国産のルメルカは毒性を持つ鉱石であり今日では合成によって置き換えられている。
  color.violet:
    label: バイオレット
    summary: 青から紫への移行的な色調；可視域の終わり
    info: "{\"hint\":\"青紫色；スペクトルで青と紫の間\",\"info\":\"バイオレット（紫）は、波長約380〜420nmを持つ可視光領域の端にある色です。この名前は花「ビオラ」に由来します。\r\n色彩認識では赤みを帯びたパープルとは異なります：バイオレットはより青寄りであり、パープルは赤と青の中間に位置しています。\r\nかつてバイオレット染料は非常に希少且つ高価でしたため、王侯貴族だけが紫の衣装を使用していました。"
  color.white:
    label: しろい
    summary: すべての光を反射する、最も明るい色。
    info: 白は可視スペクトルに含まれるすべての色が同時に含まれたものです。清潔さや無垢さ、新しい始まりを象徴しており、多くの文化では平和の色でもあります。
  color.yellow:
    label: 黄色
    summary: 太陽や金の明るい暖かい一次色。
    info: 黄色は光の基本色であり、最も鮮やかな色の一つです。幸福・エネルギー・楽観主義を象徴し、注意を集める効果があります。
