lang: ja
pivot: false
title: 基本的な色
cards:
  color.black:
    label: 黒
    summary: 最も暗い色、光の不在。
    info: 黒はすべての可視光が存在しない状態です。エレガンスや謎、権力などの象徴とされ、ファッションでは基本的な普遍的な色とされています。
  color.blue:
    label: 青
    summary: 空と海の冷たい一次色。
    info: 青は光の冷たい一次色です。これは世界で最も人気のある色であり、落ち着き、信頼感、深さを象徴しています。
  color.brown:
    label: 茶色
    summary: 大地や土を表す地味な二次色。
    info: 茶色は赤、黄、黒の混合によって作られる二次色です。大地や自然、安定性を象徴しており、自然や秋に関するテーマでよく使われます。
  color.green:
    label: 緑
    summary: 草や葉の色、青と黄からなる二次色。
    info: 緑は青と黄色を混ぜることでできる二次的な色です。自然、生命力、新鮮さを象徴しています。人間の目にとって最も敏感に認識される色でもあります。
  color.orange:
    label: オレンジ
    summary: 赤と黄から作られる温かい二次色。
    info: オレンジは、赤と黄色を混ぜることでできる二次色です。情熱や創造性を象徴しています。この名前はオレンジの果物に由来します。
  color.pink:
    label: ピンク
    summary: 赤の明るい色調、柔らかく愛らしい色。
    info: ピンクは赤色の淡いトーンです。多くの文化で思いやり、ロマンス、そして遊ぶ心と結びついています。
  color.purple:
    label: 紫
    summary: 赤と青から生まれた神秘的な二次色。
    info: 紫色は、紅（こう）や藍（あい）などから作られる二次色であり、歴史上最も高価な色彩として王権や豪華さの象徴となっていました。
  color.red:
    label: 赤
    summary: 血や火の温かな一次色。
    info: 赤は光の三原色の一つです。エネルギー、情熱、そして危険を連想させます。多くの文化では幸せと力の象徴でもあります。
  color.white:
    label: しろい
    summary: すべての光を反射する、最も明るい色。
    info: 白は可視スペクトルに含まれるすべての色が同時に含まれたものです。清潔さや無垢さ、新しい始まりを象徴しており、多くの文化では平和の色でもあります。
  color.yellow:
    label: 黄色
    summary: 太陽や金の明るい暖かい一次色。
    info: 黄色は光の基本色であり、最も鮮やかな色の一つです。幸福・エネルギー・楽観主義を象徴し、注意を集める効果があります。
