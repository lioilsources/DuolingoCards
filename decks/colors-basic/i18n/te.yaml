lang: te
pivot: false
title: పునాది రంగులు
cards:
  color.amber:
    label: జంతర్
    summary: ఆఫ్‌లెట్ ఓరేఞ్జ్ ఒక ఘన ఔషఢి జంతర్.
    info: జంతర్ అనేది పులోగడుకొవ్వు నుండి ఏరైన ఖనिजమైన కళ్ళెట్టు తీసుకుని రాబచ్ఛర లేత గోధుమ ఎరుపు ఉష్ణ వర్ణం దీనిని బహుశః ఐతిహాసికంగా డెకరేషన్ మరియు భావనాత్మక పదార్థంగా ఉపయోగించారు.
  color.aqua:
    label: అక్వా
    summary: పరుగెతైన నలుసేడూ రంగు
    info: "\"అక్వా\" ఒక పరుగెతైన నలుసేడూ రంగు; HTML మరియు CSS లో \"ఆక్వా\", \"షీన్\" కొలది ఉంటాయి (#00FFFF). \r\nఈ వచనం జలధి శబ్దం నుండి ఏర్పడింది - 'జల' తృణ గౌళ ద్రవ్యహీన భావన ఎలా బాహారిక సముద్రాలు, ఫుల్‌లు మరియు ఐఖ్ఛికతను ఘటిస్తుంది।\r\nఓ డిజైన్ లో ఇది ఔఢ్థాన్య పరిసరాలు కొరకు విరుద్ధ రంగు గా ప్రయోగిస్తారు."
  color.azure:
    label: ఆజీల్
    summary: ఈ ఏళ్లు ఒక భృగుఘఞ్ఛన హరిత రంగు.
    info: '"అజ్రోవా బూడిద"ను "ఆజీల్"గా కొన్నపేరుతో సైబెరియాకు చెందిన లాజౌరిట్‌ గణిత శిల నుండి తీసుకురాబడింది. దీనిని ఫ్రాన్స్, ఐజ్రాయిల్, మరియు ఉక్రейిన్ వంటి రాష్ట్రాల జాతీయ ధ్వజాలలో ఎఱుగుతారు.'
  color.beige:
    label: బీజిల్
    summary: ఒక తక్కువ పిఠాభి కాఫీ; వెళ్లిపోయే సౌకర్యభరణహృదయశోఖధర్షణ లేనటువంటి.
    info: "\"బీజిల్\" అనేది తక్కువగా ఉండే వెచ్ఛతరమైన రంగు, దీని పొడవు బూడిద నుండి సౌకర్యభరణహృదయశోఖధర్షణ లేనటువంటి కాఫీ గా ఏర్పడుతుంది. \nఈ జీవితం ఒక ఐతిహాసిక ఓల్లాంథా ఎఱుత డిస్‌ప్లే ఘటన నుండి వచ్చింది. \nఆధునిక ఢిస్‌ప్లే డిజైన్ లో ఇది ఒక వెళ్లిపోయే సౌకర్యభరణహృదయశోఖధర్షణ లేనటువంటి ప్రాథమిక రంగు గా ఉపయోగిస్తారు. \nఇది ఔషధ పిఠాభి మరియు అఙ్గిన మట్టి రంగులకు సమీపంగా ఉంటుంది."
  color.black:
    label: చెర్
    summary: నలుపు రంగు, కాంతి లేకపోవడం.
    info: చెర్ అనేది దృశ్యమాన కాంతి నుండి వస్తువుల గొప్ప ఉనికి లేకపోవడం. ఈ రంగు ఎлегంట్‌నెస్, రహస్యం మరియు బలాన్ని సూచిస్తుంది; ఫ్యాషన్ లో ఇది ఒక ప్రధాన సాధారణ రంగుగా భావిస్తారు.
  color.blue:
    label: నీలి
    summary: గాలి మరియు సముద్రం చల్లని ప్రధాన రంగు.
    info: బ్లూ అనేది లైట్‌కి చల్లని ప్రధాన రంగు. దీనిని వరలోకంలో అత్యంత బాగా నచ్చే రంగుగా భావిస్తారు మరియు శాంతి, ఆశ, గొప్ప లోతు కలిగి ఉండటాన్ని సూచిస్తుంది.
  color.bronze:
    label: బ్రాన్జు
    summary: బ్రాన్జు అవలకొతె డ఼ఢళ ఝౄల రఙ్గు
    info: |-
      "బ్రాన్జు" అవలకొతె మరియూ టినో కలపడం దృశే ఒక గీలసైదౌగణిక రఙ్గు నహీ చ౱ఫ్తా।
      ఆధునిక బ్రాన్జు ఎథ౉ష్యమ్‌ లో తృతీయ విజేత జఖరా ఏక ఛఠీ ఘళిఓ భఞ్जన ఐతా।
  color.brown:
    label: భూరంగు
    summary: ద్రవ్య మరియు అడికిలోని పొరల రంగు.
    info: బాజెట్ గ్రే కలపడం దీనికి సహాయపడుతుంది, ఇది నేల, వృక్షాలు మరియు శక్తిని సూచిస్తుంది; ఈ రంగు సహజ లేదా అక్టోబర్ థีమ్‌లలో ఎక్కువగా ఉపయోగిస్తారు.
  color.burgundy:
    label: బర్గండి
    summary: బర్గండి నుండి వచ్చే గఠ్ఞ వైన్ ఎరుపు.
    info: |-
      బర్గండి అనేది ఫ్రాన్స్‌లోని వైన్ పురమెకటీజ్ రిజియన్ బౌర్గొవ్న్ నుండి తీసుకున్న గహీరు ఎరుపు - జాతీయ కచ్ఛా లేత ఉధృతి షేడ్ దీని ఒక డార్క్ శైఖ్ ఏరుణభావన కలిగి ఉంటుంది
      ఈ రంగు ఐథ్నిక్ ఔఘళికత మరియు సమృద్ధిని సూచిస్తుంది,
      ఓడిమ సీజన్ లో అత్యంత ప్రియమైన రంగులలో ఒకటిగా పరిగణించబడుతుంది.
  color.charcoal:
    label: ఆంతరాకైటోవి
    summary: ఘన ఢిఙ్గి రంగు
    info: |-
      "అన్తరాకైటోవి" ఒక చల్లగా ఉన్న గుलाबी రంగు ఇది కమలీన్ లెడ్ సౌధపు నీలి వణుకు తో దగ్గరగా ఏరొయిష్ జెఎఫ్
      ఈ రంగు హృదయ శాఖలో ఓజోన్ భూమి డబ్ల్యు ఐ ఔఠిఛ్ థెరపీ లో ఉపయోగిస్తారు.
  color.chartreuse:
    label: chartruse
    summary: ఈ జీవశక్తి కలిగిన రంగు ఎరుపు మరియు నీలా రంగుల మధ్యలో.
    info: '"Chartruse" అనేది పర్వత వక్రంలో ఎరుపు మరియు నీలా రంగుల సరళ బహిర్గత చెబుడైన ఒక జీవశక్తి కలిగిన గొట్టం ఉష్ణభాజనం లేదా తృణదళ దౌఘధారిత ఏకైక ఫ్రాన్సిస్ డ్రామా ఖనిజ ఐఛిక ఓజోన్ థీర్ నుండి పొందిన ఒక ప్రత్యేక రంగు.'
  color.cobalt:
    label: కొబాల్తు
    summary: కొబాల్త్ పిగ్మెంట్ లాంటి జీవశక్తితో కూడిన ఔషధం నుండి ఘనమైన నీలం
    info: |-
      "కోబాల్త్ బూడిద" అనేది రసాయన మూలకంగా 'కొబాల్తు' (CO) పై ఆధారపడి ఉన్న జీవశక్తితో కూడిన నీలం షేడ్‌
      ఈ గృహణ విజ్ఞానం 1800 లలో ఎటువంటి చిత్రణలో ఒక దళిత తెలుపు ఛాయ ఐఏ
      ఆర్థిక ఫౌండ్రీలు, భారీ డిస్ప్లేలు మరియు ఓపెన్ ఆర్ట్ లో ఇది ఉపయోగించబడుతుంది
      Vincent Van Goeth దీనిని ఖచ్చితంగా ఇష్టపడేవారు
  color.copper:
    label: మెడ్లనా
    summary: '''కస్'' బంతి ఏరుపు ఘన షేడ్'
    info: |-
      "మెడ్లనా" అవకతవకలు లేదా పరిగణన చేయబడకుండా, ఒక ఎరుపు గోళారీ ధాతువైన 'కస్' రంగును తొలగించటానికి ఉపయోగిస్తారు
      ఈ కథనం విజయభేరి నుండి దృశ్యహాని జరుగుతుంది
  color.coral:
    label: కొరాలవ
    summary: ఈ జీవశక్తి రస్సాడి ఎరుపు సముద్ర కొరాల్ లాగా.
    info: '"కొరాలవ" అనేది కోతి నలుపు మరియూ రస్సాడి లీలా తగిలిన ఉష్ణ వలయ దళచిత్రం గల జీవశక్తి బహుజన ధృవణ ఎరుపు ఆకృతి ఈ ఒక డబౌల్ టోన్ ఛాయ ఫలితంగా ఏర్పడిన ఓకేఐన్ ఘనత భాగం థర్మల్ ఖఞ్‌ఝా సృష్ఠించిన సముద్ర కొరాల్ కారణంగా ఈ ఛాయ పేరు పెట్టబడింది.'
  color.cream:
    label: క్రీము
    summary: ఈ బహుళ భాషా ఫ్లాష్‌కార్డ్ డేఢీ ఒక ఛాయాచిత్రణ ఐటమ్.
    info: '"క్రీము" అనేది చల్లగా ఉన్న కొవ్వుతో పెడబడిన తెలుపైన రంగు వలె దట్టమైన గోధుమ నీలం లేదా ఎరుపు సౌఖ్యశృఙ్ఘాల జోడించడం ద్వారా ఏర్పడుతుంది.'
  color.crimson:
    label: crimson
    summary: ఆకర్షణీయమైన ఎరుపు రంగు
    info: |-
      క్రమజన పదాలతో సంబంధించిన గొడుగు రంగు ఇది
      koccoc నీలయశోద కృష్ణ వర్టికెస్ అనే జీవి ద్వారా తಯారైన ఒక ఎరుపు లోహఖనిజం ఉపయోగించి బాగా డౌన్‌లోడ్ చేసిన ఘన ఎరుపు ఛాయ
      ఈ రంగు ఐవీలీ ఫ్లోరిడా ఓక్లాహోమా ఏథెన్స్ భాగస్వామ్యం చేసుకున్న కళాశాలలలో ఉపయోగిస్తారు
  color.cyan:
    label: ఆజురోవా
    summary: '''ఆజురోవా'', ఒక రక్షణశీల నీలహరిత వర్ణం.'
    info: |-
      సైన్ అలాగే 'ఆజురోవా' పదంతో తెలియడమైన రక్షణశీల నీలహరిత వర్ణం, దీని RGB గృహీత ఎరుపు : 0 , లొచ్ఛన : 255 , బూడిద : 255 .
      ఈ ఒక్కటే CYMK కళాబధ్ధ ఉపకరణాల జాబితాలో C= Cyan అని భావించబడుతుంది.
      ఏదైనా ఐకౌథ్ ఫలితం డిస్‌ప్లే ఓపెన్ ఖాళీ ఘనం లో ప్రకాశిస్తుంది.
  color.fuchsia:
    label: ఫ్లకోషియా
    summary: ఫ్లకోషియా పూగు వంటి జీవశక్తితో కూడిన గొట్టైన రకం లేత నలుపు వర్ణం.
    info: "ఫ్లకోషియా అనేది 'ఎరువెడత' పూగు (ఆకృతి) తో సమబహుళంగా ఉన్న జీవశక్తితో కూడిన గొట్టైన రకం లేత నలుపు వర్ణం.\r\nఈ చౌక్కా బహుళం ఒక జర్మన్ దారువు డాక్టర్ లిఓన్‌ఘార్ట్ ఫ్లకోషియా ఏజీ(1497–1566). \r\nCSS & HTML లో ఫ్లకోషియా ధృవభావం మాజెంఠా(# FF00FF)\r\nఐఖ్ఛానిక థీమ్ , 80s లు, ఔదార్యం కలిగిన కళ లో ఈ రంగు సంబంధం ఉంటుంది."
  color.gold:
    label: స్వర్ణ
    summary: ధాతువు లాటినీ ఉన్న బలమైన పతకం
    info: |-
      "స్వర్ణ" అనేది బలమైన పతకం రాగి లాటినీ ఉన్న నయజువో కళా ధాతువును తెలియజేస్తుంది
      ఈ వర్షం ఐడియల్‌గా దశహా గౌరవం, జయభేరి ఎక్కువ చొప్పున ఒక ఖ్యాతిని ఏర్పడుతుంది
      ఆఫీస్ డబ్బు ఛిహృతి ఓ ఘోషణ చేస్తుంది ఔపథాన్ ఢిఙ్గి పై స్వర్ణ పతకం అంటే అత్యంత ప్రముఖ ప్రదర్శన.
  color.green:
    label: నలుపు
    summary: బూడిద మరియు తెల్లగా కలిసి ఏర్పడిన రెండవ రంగు.
    info: నలుపు బూడిద మరియు తెల్ల రంగులను కలిపితే వచ్చే ఒక ఉప రంగు. ఈ రంగు భూమి, అలసతనాన్ని సూచిస్తుంది; నలుపు అన్ని రంగులలో గొప్ప దృశ్య సౌందర్యాన్ని కలిగి ఉంటుంది.
  color.grey:
    label: ఊద
    summary: ఒక బూడిద లేదా శ్వేత ధరించిన షేడ్.
    info: ఎరువైన రకంలో అత్రాసిట్‌గా పిలుచబడేది; వెళ్లిన కణజాలము గాని తీయని నీటి దగ్గరగా ఉంటుంది.
  color.indigo:
    label: ఆకుపచ్చ రంగు
    summary: ఇండీగో ఔషధం వలె ఘన నలుసృజన ఫిచ్‌బూడిద రంగు
    info: |-
      ఇండీగో రకరకాల పదివనరుతో తಯారైన ఒక గొప్ప నలుసృజన వర్ణము అయిన దశ కాలధౌత బూడిద లెటువా ఉన్న ఫిచ్‌బూడిద షేడ్ జోలో భావహరిస్తుంది
      ఈ ఐదువేళల ఎఱుతులు ఏకం ఓర్పు డుహెర్మ్ ఛాయాఖండంలో ఉంటాయి
  color.ivory:
    label: ఐవరి
    summary: '''ఐవరి'' గౌమయ వర్ణం లాగా ఓ చవకబొజ్జ గౌమయ వర్ణం.'
    info: "\"Ivorino\" అనేది సరాల బల్లతో పుడైన తకీదు రంగు కలిగిన చవకబొజ్జ గౌమయ వర్ణం. \r\nఈ శబ్దం 'ఆధి' నుట్టు లెఖనం దృష్టిలో ఉంచి ఏర్పడింది. \r\nఫ్యాషన్‌లో, డిజైన్ ఎఱుకలో, జీవహక్కు భావనలో ఒక ఘన ఛాయ గా ఉపయోగిస్తారు."
  color.khaki:
    label: ఖకీ
    summary: ఒక తలెత్తిన ఎరుపు రంగు ; సైనిక ప్రాంతీయ రంగు
    info: "\"ఖకీ\" అనేది గుర్తించడానికి సౌకర్యవంతమైన తలెత్తిన కొటోళ్లుగా ఉన్న ఎరుపు రంగు వలె భారతదేశంలో 1875 లో బ్రిటిష్ ఫోర్స్‌లో నిబంధన దృఢీకరణ జరిగింది\nఈ పదం హిందీ / ఉర్దూ నుండి \"ఘకీ\" - డజ్ లేదా ఒక ఏకపార్ఛే ఐటెమ్ అని అర్థం చేసుకోవడానికి ఉపయోగిస్తారు \nఆధునిక ఓడించడం ఔన్ ఫోర్మ్ మరియు ప్రాంతీయ పోషకాల ప్రాథమిక రంగు ఇది"
  color.lavender:
    label: లేవండర్
    summary: లేవండర్ పుష్పాల వంధుకు ఒక చాలా తకీదైన గౌవయోగం రంగు
    info: "\"లేవండర్\" అనేది లెవాండులా పొక్కుతో సమానమైన చాలా తకీదైన గౌవయోగం రంగు. \r\nఈ కలర్‌తో శాంతి, నిఃషబ్దత హోం ఎటిథెటిక్ ఫ్రాన్స్ వంధుకు జోడించబడింది\r\nఆరోమా ఉపచారంలో బాలిక దుర్గం డజన్ ఘుళి భావించబడింది"
  color.lime:
    label: లిమెట్
    summary: ఆకుపచ్ఛిత హరిత ధృవశీల జీవభావం.
    info: '"Lime" అనేది లైమ్‌లు పరిగణించబడే ఒక సజీవ నలుపొతె కోత రాళ్లు వర్ణం. గ్రఫికల్ డిజైన్ తో బయటకు ఎక్కువగా ఉపయోగిస్తారు.'
  color.magenta:
    label: Magenta
    summary: ఆకర్షకమైన ఓకలో రంగు
    info: |-
      పుర్‌డోవా అనగభిలేదు ఎక్కువగా మజెంటా రంగు - చీకటి నలుపైతొ తెలుస్తుంది
      ఈ విధంగా కళ్ళు గమనించబౌ దృశ్య లేఖన బీహులు ఉండవు,
      ఐతాలీలో 'Magdala' ఘటన(1870)
      CMYK ఛాఫ్ డ్రైష్ జాబితాలో ఒక ప్రథమ రంగు ఏర్పడుతుంది.
  color.maroon:
    label: కాష్‌తనోవా
    summary: ఓ డార్క్ బౌన్స్ రెడ్
    info: "\"కాష్‌తనోవా\" అనగింది మరులైన ఎరుపు గొడుగెళ్ల రంగు, ఇది \"సీజన్\" నుంచి వచ్ఛిన శబ్దం. \r\nఈ రంగు ఫ్యాషన్​లో, క్రీడా బట్టలు, ఉన్నత దళ్లలో జనప్రియంగా ఉంటుంది\r\nఆఙ్గ్లభాషలో 'Maroon' ఒక వృత్తహీన ఐలాండ్ లో తుది ధ్వని ఏర్పడుతుంది."
  color.mauve:
    label: లిలో
    summary: మరకత రంగు
    info: |-
      "లిలో" అనగా మరకత రంగు - ఇది ఒక తెల్లడబీజపొడి వలె కళ్ళు నవ్వటం లాభసహితంగా ఉంచే గౌరవయుతమైన బంధనం దృశ్యం
      ఈ ఫ్రెంఛ్ షేడ్ ఎథెనిక్ జీవితం డిస్ప్లే ఏర్పాటు చేసింది,
      ఆఖరికి ఐస్ ఓల్ ఘనత ప్రణాళిక చేసింది.
  color.mint:
    label: మ్యాజరో
    summary: '''పౌధ'' పుష్పం లేదా దంత పేస్ట్ లాగా చాలా తల్లడిగంత గ్రీన్ రంగు'
    info: |-
      "మ్యాజరో" అనేది ఒక తల్లడిగంత వెళువడి గల ఎరీసైడ్ రంగు, దీనికి 'పౌధ' లేదా చొక్కశృఙ్గం నుండి ఉద్గ్రీష్టణ కలిగి ఉంటుంది।
      ఈ రంగు హైగ్రీథ్ ఫ్రెఛ్‌నెస్ బాబు జుఞ్ఝు డిజైన్ ఐఓ ఏఖభు ఘఠిత ఔఢింది మరియు రెట్రో ఎస్ఱోటిక్(60) లో ప్రసిద్ధి చెందింది。
      మ్యాజరో ఐస్ క్రీమ్ లేదా మ్యాజరో టీ అనేవి దీనికి సంబంధించిన సామాన్య సంఘటనలు
  color.navy:
    label: నావీ
    summary: '''నావీ'' ఐరోపా డుఃఖములో ఓషన్ ఛాయగా ఉంటుంది.'
    info: "\"నావీ బ్లూ\" అనేది చక్రవర్తి నావికాబలపు(Royal Navy) సైనమోడళ్లలో ఉపయోగించే రంగు కావడం వల్ల దీనికి 'నావీ' అనే పేరు ఏర్పడింది\r\nఈ గట్టి ఎరుపు ఫాషన్‌లో ఒక జనಪ్రియ ఆధార రంగుగా తొలిజశహౌణ్40 లో ఉపయోగించడం ప్రారంభమైంది."
  color.ochre:
    label: ockra
    summary: ఒక్రా పథకం నుండి వచ్ఛిన స్వాభావిక పిగ్మెంట్ గా జిగురు బలుట ఉంఖలహృదయ ఎలాఫ్ట్ గా ఉంఖలహృదయ ఎలాఫ్ట్
    info: "\"Ockra\" అనేది భూతలపరమైన తెలుపోడాక్‌వీగొలుసు రంగు, దీనిని ఒక్రయ్ లౌకిక కణజాలం నుండి వచ్ఛిన జిగురు బలుట ఉంఖలహృదయ ఎలాఫ్ట్ గా ఏర్పడింది\nఈ ధూళి శతాబ్దిలో ఐతిహాసిక ఘటనలు డష్ఠిస్ ఓక్రా పథకం లో ప్రాచీన మానవులు గుఱ్ఱం కు ఉపయోగించేవారు \nఆక్రా పథకం భూమిలో ఒక్రా పథకం గా కనిపిస్తుంది\nఇది ఔల్టమైర్ , లాస్కావ్ మరియు ఇతర గుహలలో ప్రాచీన చిత్రాలలో కనిపిస్తుంది"
  color.olive:
    label: ఆలివ్
    summary: ఒలీవ్ రంగు ఒక మందగా ఉన్న పసుపు - పచ్చ రంగు.
    info: ఒలీవ్ రంగు పర్వత మనిషికి తగినదిగా ఇస్తారు, ఎయిరోఫెఅ ఓలైట్ నుండి వచ్ఛిన దృశ్యహీన కొబ్బరి లేతజామ్ గుళ్ల బణుధౌ ఉంఖల జీవభూమి ఏర్థిక డ఼ఢిఙ్గి ఘఠిత ఐఱ్ఝిఞ్చు రంగు ఉంఖల జీవభూమి ఏర్థిక డ఼ఢిఙ్గి ఘఠిత ఐఱ్ఝిఞ్చు రంగు.
  color.orange:
    label: ఆరెంజ్
    summary: నలుపు మరియు ఇసుకరంగు నుండి ఏర్పడిన ఒక ఉష్ణోగ్రత రెండవ రంగు.
    info: ఆరెంజ్ అనేది ఎరుపు మరియు పసుపు కలపడం ద्वారా ఏర్పడిన రెండవ రంగు. ఇది ఉత్సాహం మరియు కొవ్వు లక్షణాలను సూచిస్తుంది; ఈ పేరు ఓరెంజ్ ఫలం తో పేరు పెట్టబడింది.
  color.periwinkle:
    label: periwinkle
    summary: పెరివాకల్ బుడత అనేది వంగళమొక్క కోసం తీయబడిన ఒక చిన్న గులాబీ రంగు.
    info: |-
      "పెరివాకల్ బుడత" అనేది వంగళమొక్క కోసం తీయబడిన ఒక చిన్న గులాబీ రంగు ఉన్న నీలి షేడ్‌
      ఈ రంగు లైట్ బ్లూ హౌజ్ ఎథర్ జెఫ్ డ్రైవ్ దృశ్యం ఏమిటి?
      ఆధునిక ఐఓఎస్ భాగంగా ప్రఖ్యాతి పొందిన ఈ ఛాయ ఔషధం మరియు డిజైన్ లో ప్రసిద్ఘణంగా ఉంటుంది.
  color.pink:
    label: రూజ్ రంగు
    summary: కోతి గొడ్డలి యొక్క సన్నని నీడ, మృదువైన అందమైన రంగు.
    info: రూజ్ కోతి గొడ్డలి లేత టోన్‌లో ఉంటుంది. చాలా సంస్కృతులలో దయ, ప్రేమ, ఆడుకోవడంతో సంబంధం ఉంటుంది.
  color.purple:
    label: ఊదా
    summary: రెడ్ మరియు బ్లూ నుండి ఏర్పడిన ఒక రహస్యమైన తృతీయ రంగు.
    info: ఊదా అనేది ఎరుపు మరియు నీలం కలపడం ద्वారా ఉత్పన్నమైన తృతీయ రంగు. చరిత్రపూర్వంగా ఇది ధన్యవాదాలు గా ఉండేది మరియు రాజకీయ శక్తి మరియు లక్ష్మితో సంబంధం ఉండేది.
  color.red:
    label: ఎరుపు
    summary: రక్తం మరియు అగ్ని ఉష్ణోగ్రతలో కలిగే సౌఖ్యవంతమైన ప్రాథమిక రంగు.
    info: ఎరుపు లైట్‌లో ఉనొక్క తెల్లడి వర్గాలలో ఒకదానికి చెందినది. ఇది శక్తి, అహంకారం మరియు బెదిరికలను గుర్తింపజేస్తుంది; అనేక సంస్కృతులలో ఇది భాగ్యం మరియు శక్తిని సూచిస్తుంది.
  color.rose:
    label: రౌజ్
    summary: '''రౌజ్'' అనేది రోజ్ పువ్వు ఐక్ ఘణఖండ రంగు.'
    info: "\"Rose\" అనేది రోజ్ పువ్వుకు సరాగైన తెలీకడ గొబ్బెరుమందు నీడ. \nఈ 'తెలుచు' ('pink') కు వేరు : \"rose\" ఎక్కువగా లాలటి ఉంటుంది. \nషాముయ్‌ల్ బెక్కెట్ ఒక శృఙ్గార భావన ద్వారా హృదయాలకు ఏ ధూళి జన్మించినా అది ఓ రౌజ్ ఫుల్ డ్రోప్ ఛాయ లాగా ఉంటుందని చెప్పాడు."
  color.salmon:
    label: లోసొస్
    summary: కూడలమీగాబు గెడ్డల నుండి వచ్ఛే తెలుపు లేత ఎర్ర బయళ్ల.
    info: |-
      "లోసొస్" అనేది రక్తపరువైన కూడలమీగాబు గెడ్డల నుండి వచ్ఛే తెలుపు లేత ఎర్ర బయళ్ల షేడ్‌ ఉన్న ఒక జహృజౌ ద్రవ్యశ౭
      ఈ ధ౱ ఫ౩ టొన్ డ఼ ఐ థ౳ ఏ ఓ ఔ ఖ౴ ఢ
      ఆఘణ ఠ ఝ ఞ ఙ ఑
  color.scarlet:
    label: షర్లకు
    summary: ఈ బరువు వయఃశ్రేణి ఒక జౌల్ ఫ్రెంఛ్ డై ఏర్ధ్ ఐథిల్ భాగం.
    info: '"షర్లకు" అనేది నారంగీతో కలపబడిన గొట్టె లేత ఎరుపు రంగు. దీని హవైజెస్ తో చమత్కారం ఉంటుంది.'
  color.sienna:
    label: సీన బరడుకాలి
    summary: సీన బరడుకాలి అనేది సీన నగరం పేరు పెట్టిన ఎరుపు బరడుకాలి రంగు.
    info: "సీన బరడుకాలి భూగోళపై ఒక నమ్‌బజెట్ కచేరీ రంగుతో ఉదయం లేదా తవ్వడం దృశ్యం\nఆహా! అది వొషౌ గోళాకార జీవి ఎరుపు ధూళి ఏరుపు డ్రాఫ్టిఙ్ ఛాణ్ \nఈ ఘటన ఐతిహాసిక ఓలు ఖచ్చితంగా థర్మల్ ఢీలా ప్రకృతి రంగులు అయిన సీన బరడుకాలి ఔట్ పుట్ అయిన సీన బరడుకాలి రంగు అయిన సీన బరడుకాలి రంగు అయిన సీన బరడుకాలి"
  color.silver:
    label: silver
    summary: జెరైక్ గ్రౌఫ్ లాభహ౦ నీళ్ళ జెరైక్.
    info: స్వర్ల రకంగానీ, పది మధురతో కొలుచబడే ఒక శృష్టి అయిన వణువు.
  color.tan:
    label: TAN / TANNED SKIN COLOR
    summary: ఆకర్షణీయమైన బఫర్ రంగు
    info: |-
      "Tan" అనేది మల్లరకంగా కళువబడిన చర్మపోతె రంగు లేదా భూసీజ్ వంటి తెలుపైన బఫర్ షేడ్‌గా ఉంటుంది
      ఈ పదం "tannin" నుండి ఏర్పడింది - దీనిలో జొహారు గాలి ఒణయించడం దృశ్యం ఎక్కువ
      బీజ్ కంటే ఖచ్ఛంగా డార్క్ ఐన ధూళి రంగు మరియు థర్మల్ ఓక్ ఘనత ఉంటుంది
  color.teal:
    label: ఆకుపచ్చ
    summary: సముద్రం రంగు లాంటి నీలి రంగు.
    info: "మోడ్రొజెలేనా అనగింది 'కృతీ' పక్షి రకభేదం తో సహయవళణం కలిగిన ఒక నీలి - వచ్ఛట గుణధర్మం .\r\nఈ లైఫౌట్‌ బూలు ఎరుపు దశలో ఉన్న జల్లు ఏరువు డబ్బా ఓఝైన్ ఘటన ఖాతరు ఐటెమ్ ఔత్సాహిక ఢిఠి థీమ్ కి అనుగుణంగా ఉంటుంది."
  color.turquoise:
    label: తిర్కీలవ
    summary: తీవ్రమైన నీలం - హరిత రంగు లాగా ఉంచబడిన సముద్ర జలాలు
    info: "\"తిర్కీలవ\" అనేది ఒడిగళ్ల పులోజెట్‌ రంగు కలసానమైన నీలం - హరిത వర్ణం; దీని పేరు 'తయరౌ' బంగారు గాఢత తో ఉంచబడింది\nఈ శిల\nఆధునిక ఎజిప్షియన్ , ఫర్థియన్ లు జొఱః ఏమీరికా భూఖండంలో ఐతిహాసిక ఘటనలు ఓ డఝఛ ఔఠ ఙ ఞ ఻ \nదీని రంగు సముద్ర జలాలు, సముద్ర మంచు లేదా స్పష్టమైన సూర్య దినం లో ఆకాశం యొక్క రంగు లాగా ఉంటుంది\nఎంపిక ప్రాతిపదిక పై స్పష్టమైన, ఆనందం ఇచ్చే మరియు ఆధునిక ఆకర్షణ కలిగి ఉంటుంది"
  color.vermillion:
    label: రూమెలకోవా
    summary: రూమెలకోవా అనేది ఖనిజం రూమెలకోవా లాగా ఏర్పడిన ఘన ఎరుపు ఓరేఞ్జ్ రంగు.
    info: '"రూమెలకోవా" అనగభి "రుబీత్" పదార్థం లాగా ఉష్ణసేధ కలిగించే నారింజ రంగు వయొలెట్ గడ్డకి ఒక బహుళ దృశ్య తెలుపై జీవిత ఎరుపు ఓరేఞ్జ్ ఛాయ.'
  color.violet:
    label: ఫైలోవా
    summary: నీలం - ఫైలోవా రంగు; కనిపించే స్పెక్ట్రమ్ చివర.
    info: "\"ఫైలోవా\" అనేది కనపడుతూ ఉష్ణసరళముకు చివరలో వచ్ఛెడిగా ఒక రంగు దీని తరంగదైర్ఘ్యం లబ్‌ధంగా 380–420 నానొమీటర్లు\r\nఈ గృహశోభను \"విఓలా\" బూజౌ జొరఖు డు ఏర్పరిచింది\r\nరంగు ఎరుపు మరియు నీలం మధ్య ఉండే ఐథ్యోఢియా రంగు నుండి విభిన్నంగా ఉంటుంది : ఫైలోవా నీలం కు సమీపంలో ఉంటుంది , ఐథ్యోఠియా ఎరుపు మరియు నీలం మధ్య ఉంటుంది . \r\nగతంలో ఫైలోవా రంగు ఔషధాలు చాలా అరుదుగా మరియు ఖరీదైనవి ; ఫైలోవా దుస్తులు కేవలం రాజులు ధరించేవారు."
  color.white:
    label: బీలా
    summary: కాంతి యొక్క పెద్ద రంగు, అన్ని కాంతి వస్తువులను బహిర్గతం చేస్తుంది.
    info: బీలా దృశ్య వర్ణపరిధిలోని అన్ని రంగులను ఒకేసారి కలిగి ఉంటుంది. ఇది శుభ్రత, నిర్మలత్వం మరియు కొత్త ప్రారంభాలను సూచిస్తుంది; అనేక సంస్కృతులలో ఈ రంగు సౌమ్యత్వాన్ని సూచిస్తుంది.
  color.yellow:
    label: ఇలువెన్న
    summary: కోరుకొని ఉష్ణోగ్రత కలిగిన సూర్యుడు, బంగారం రంగు.
    info: ప్రధాన లైట్ రంగు అయిన ఇలువెన్న చాలా వెళ్లిపోయే రంగులలో ఒకటి. ఇది శుభం, ఎనర్జీ, నమ్మకం గురించి తెలియజేస్తుంది; దృష్టిని బాగా ఆకర్షిస్తుంది.
