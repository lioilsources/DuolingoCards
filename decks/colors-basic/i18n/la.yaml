lang: la
pivot: false
title: Colores Fundamentales
cards:
  color.black:
    label: nigra
    summary: Tenebris color, lux luminis absentia.
    info: Nigra est absens omnis visibilis luminis. Symbolicit elegantiam, mysterium et potentiam; in arte textiliorum proclamatur fundamentalis universali color.
  color.blue:
    label: caerulea
    summary: Frigida prima coloratio caeli et maris.
    info: Caerulea est frigida prima coloratio lux. Est coloratio plurimum dilecta in mundo et symbolon tranquillitatis, fiduciae atque profunditatis.
  color.brown:
    label: ferruginea
    summary: Terra secunda coloris ligni et terrae.
    info: Ferruginea est color terra secunda quae nascitur ex mixtione rubri, flavi et nigri. Habet symbolica significationem terrae, naturae atque stabilitatis; frequenter usitatur in thematibus naturalibus aut autumnalibus.
  color.green:
    label: viridis
    summary: Color herbae et foliorum, color secundarius ex caeruleo et flavo mixto.
    info: Virides est color secundarius qui nascitur ex miscendo caeruleum cum flavo. Hic color symbolizat naturam, vitam et frescor; oculus humanus eum percepit sensitivissime inter omnes colores.
  color.orange:
    label: nārāngea
    summary: Calida color secundarius ex rubro et flāvo factus.
    info: Nārāngeum est color secundarius qui ex mixtione rōbri et flāvi nascitur. Hic color enthūsiasmum atque creativitatem significat; ab fructu narangis appellatur.
  color.pink:
    label: rosa
    summary: Pallidus rubri tonus, tener et pulcher color.
    info: Rosa est pallida tons rubrae. In multis culturae cum benignitate, romanticum et ludicrum coniuncta est.
  color.purple:
    label: purpureus
    summary: Mysteriosa tertia coloratio ex rubro et caeruleo nata.
    info: Purpureus est tertius color qui fit mixtione rubri et caeruli. Historicē fuit pretiosissimus color, cum regia potestate atque luxu coniunctus.
  color.red:
    label: rubeus
    summary: Calida prima coloris sanguinis et ignis.
    info: Rubeus est unus trium fundamentorum luminis. Suggestit vim, passiones atque pericula; multae culturae prospere ac fortitudinem significat.
  color.white:
    label: albus
    summary: Clarissima color, reflexio totius luminis.
    info: Albus continet omnes colores visibilis spectri simul. Simbolizat puritatem, innocentiam et nova initia; in multis culturae est color pacis.
  color.yellow:
    label: flava
    summary: Clarum et calidum primum coloris solis et aurae.
    info: Flava est prima lux coloris luminis et una ex clarissimis coloribus. Simbolizat felicitatem, vim et optimismo; bene attrectat oculos.
