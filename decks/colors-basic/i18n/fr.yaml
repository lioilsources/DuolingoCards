lang: fr
pivot: false
title: Couleurs de base
cards:
  color.black:
    label: noire
    summary: La couleur noire, la plus sombre des couleurs, l'absence de lumière.
    info: Le noir est l'absence totale de toute lumière visible. Il symbolise l'élegance, le mystère et le pouvoir ; en mode, il est considéré comme une couleur universelle fondamentale.
  color.blue:
    label: bleu
    summary: Couleur primaire froide du ciel et de l'océan.
    info: Le bleu est une couleur primaire froide de la lumière. C'est la couleur la plus populaire au monde et elle symbolise la tranquillité, la confiance et la profondeur.
  color.brown:
    label: marron
    summary: Couleur secondaire terrestre du bois et des sols.
    info: Le marron est une couleur secondaire obtenue en mélangant le rouge, le jaune et le noir. Elle symbolise la terre, la nature et la stabilité ; elle est populaire dans les thèmes naturels et automnaux.
  color.green:
    label: verte
    summary: La couleur de l'herbe et des feuilles, une couleur secondaire obtenue en mélangeant le bleu et le jaune.
    info: Le vert est une couleur secondaire qui résulte du mélange du bleu et du jaune. Elle symbolise la nature, les plantes et la fraîcheur ; l’œil humain perçoit cette couleur plus facilement que toutes les autres.
  color.orange:
    label: orange
    summary: Une couleur secondaire chaude issue du rouge et du jaune.
    info: L'orange est une couleur secondaire obtenue en mélangeant le rouge et le jaune. Elle symbolise l'enthousiasme et la créativité ; elle tire son nom de la couleur du fruit d'oranger.
  color.pink:
    label: rose
    summary: Un ton clair de rouge, couleur douce et charmante.
    info: Le rose est un teinte claire de la couleur rouge. Dans beaucoup de cultures, il est associé à la gentillesse, au romantisme et à la légèreté.
  color.purple:
    label: violette
    summary: Une couleur secondaire mystérieuse entre la rouge et la bleue.
    info: Le violet est une couleur secondaire obtenue en mélangeant du rouge et du bleu. Histoirement, c'était la teinte la plus coûteuse, associée au pouvoir royal et à l'opulence.
  color.red:
    label: rouge
    summary: Chaleur de la couleur primaire associée au sang et au feu.
    info: Le rouge est l'une des trois couleurs primaires de la lumière. Il évoque l'énergie, la passion et le danger ; dans plusieurs cultures, il symbolise également le bonheur et la force.
  color.white:
    label: blanche
    summary: La couleur la plus claire, réflexion de toute la lumière.
    info: Le blanc contient toutes les couleurs du spectre visible en même temps. Il symbolise la pureté, l'innocence et de nouveaux départs ; dans beaucoup de cultures, c'est la couleur de la paix.
  color.yellow:
    label: jaune
    summary: Une couleur primaire chaude et brillante du soleil et de l'or.
    info: Le jaune est une couleur primaire de la lumière et l'une des couleurs les plus lumineuses. Elle symbolise le bonheur, l'énergie et l'optimisme ; elle attire bien l’attention.
