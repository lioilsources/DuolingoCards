lang: ha
pivot: false
title: Barwoci daidaiya
cards:
  color.black:
    label: gaya
    summary: Gaya duka ce kafin hausa, yake da suka.
    info: Gaya ya nuna wala'inka wani gwanan guwo da ke hanyar mata. Ya kamata elijansi, sirri, da dacewa; kuma ga biyar hausa, gaya ya farau da barci.
  color.blue:
    label: modrá
    summary: Munyi gida da aduwaro ta kamin dan yauko.
    info: Modrá ya nufi mutum mai amfani da wani hausa da kalakauna, wanda ke kafin koyari, kamar da yauko da aduwarkon. Ya kuma kafin koyarin abbin jama'ar rawan ruwa.
  color.brown:
    label: barni
    summary: Bar da kuka ta gilma na haskina.
    info: Barni ya haifarai ne kama jini, yawa, da ulo. Ya nuna haski, tabakin suna, da amfani; wane ne ya iya farauka tsaye da tema-tsunyi.
  color.green:
    label: zelen
    summary: Barwa ga kuka da yake, sekunderi barwa idanin babu da ingili.
    info: Zelen ya nace wanda ke kafin baburen gilani da ingili. Ya simbolisar duniya, tabakin duniya da wasu; mata ce ka shigiyar da suka kusancua barwanci.
  color.orange:
    label: oranžovayya
    summary: Watau geua dacewara da yauke da kafin gilabanci da kawkaw.
    info: Oranžovayya wajen geua dacewarar hanyar matsirani kafin gilaban da kawkaw. Ya kuma shekara da jiki da amari da koyarin karshe; ya tana noma daga mutum pomeranje.
  color.pink:
    label: rozi
    summary: Ostin hausa da aduwa, wanda ya nuna yauka na biyayya.
    info: Rozi ne ostin hausa da aduwawa, wanda ke cewa daga gama'arun aduwan. A babban kultura, ya kamata halima, romantiƙi, da fadiyar mutum.
  color.purple:
    label: fialovayya
    summary: Wangare faduna yauka daga kardaye da abu.
    info: Fialovayya ya kamatawa wanne da zauro mai karfi da abu. A gida tarihi, ya kafin da mutum suka ga kano, kuma ya canza da adanai.
  color.red:
    label: kamar
    summary: Karin duka na gilson da wani daga cikin karatun yawa.
    info: Kamar ya nuna cewa suka don hanyar yauwai, zauro mai amfani da mutum da ke kafin halbakin. Ya haifar da jama'ar yawan suna, zauro da kusanci; wanda kuma ya kamata shanuwar yaya da kusanci.
  color.white:
    label: bílá
    summary: Nejiyakinsan sun tsitsiren hanyar yawa, wajen dukkan hausa.
    info: Bílá ya haifar da dukkan duba na farin gama ga mata kan halayya. Ya kamfan jiyaka, naijin da kafin mutum; don manyar kultura, ya kamfan miri.
  color.yellow:
    label: zauro
    summary: Wani duka dacew ci gilma da zauro.
    info: Zauro ke duka major na guwoya ya nuna da wajen kofaci. Ya taimaka farin hanyar yake, enerji da optimism; ya fitarewa manneyi.
