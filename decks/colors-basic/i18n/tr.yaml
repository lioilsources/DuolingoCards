lang: tr
pivot: false
title: Temel Renkler
cards:
  color.black:
    label: siyah
    summary: En koyu renk, ışığın yokluğu.
    info: Siyah, tüm görünür ışığın yokluğudur. Elegansı, gizemi ve gücü simgeler; modada temel evrensel bir renk olarak kabul edilir.
  color.blue:
    label: mavi
    summary: Gökten ve okyanusun soğuk birincil rengi.
    info: Mavi ışığın soğuk birincil bir renkidir. Dünyanın en çok sevilen rengi olup sakinlik, güven ve derinliği simgeler.
  color.brown:
    label: kahverengi
    summary: Yer ve ahşap gibi doğa unsurlarını temsil eden ikinci derece bir toprak rengidir.
    info: Kahverengi kırmızı, sarı ve siyahın karışımından meydana gelen ikincil bir renktir. Yeryüzü, doğa ve istikrarı simgeler; doğal ve sonbahar temalı konularda sıklıkla kullanılır.
  color.green:
    label: yeşil
    summary: Çayır ve yaprakların rengi, mavi ile sarının karışımından oluşan ikincil bir renktir.
    info: Yeşil, mavi ve sarı renklerin karışımından meydana gelen ikincil bir renktir. Doğa, doğallık ve taze olma anlayışını simgeler; göz bu renge diğer tüm renklere göre en hassas şekilde tepki verir.
  color.orange:
    label: turuncu
    summary: Kırmızı ve sarının karışımından oluşan sıcak ikincil bir renk.
    info: Turuncu, kırmızıyla sarının karıştırılmasıyla elde edilen ikinci derece bir rengdir. Enthusiasm ve yaratıcılığı simgeler; portakal meyvesinden isimlendirilmiştir.
  color.pink:
    label: gül bezi
    summary: Kırmızının hafif bir tonu olan yumuşak ve tatlı bir renk.
    info: Gül bezi kırmızının açık bir tonudur. Birçok kültürde nazanilik, romantiğin ve eğlenceli olmanın sembolü olarak görülür.
  color.purple:
    label: mor
    summary: Kırmızı ve mavi renklerin karışımından oluşan gizemli bir ikincil renktir.
    info: Mor, kırmızının ve mavidin karışımıyla elde edilen ikincil bir rengi ifade eder. Tarihsel olarak en pahalı renk olarak biliniyor ve kraliyet gücü ile lüksle ilişkilendiriliyordu.
  color.red:
    label: kırmızı
    summary: Kanın ve ateşin sıcak birincil rengi.
    info: Kırmızı, ışığın üç temel renklerinden biridir. Enerji, tutku ve tehlikeleri çağrıştırır; birçok kültürde mutluluğu ve gücü simgeler.
  color.white:
    label: beyaz
    summary: Görülebilir tüm ışığın yansımasıyla oluşan en açık renk.
    info: Beyaz, görünür ışık spektrumundaki tüm renkleri aynı anda içerir. Temizlik, naivite ve yeni başlangıçları simgeler; birçok kültürde barış rengi olarak kullanılır.
  color.yellow:
    label: sarı
    summary: Güneşin ve altının parlak sıcak birincil rengi.
    info: Sarı ışığın birincil rengidir ve en parlak renklerden biridir. Mutluluk, enerji ve iyimserliği simgeler; dikkat çekmekte çok etkilidir.
