lang: ta
pivot: false
title: அடிப்பொருள் நிறங்கள்
cards:
  color.amber:
    label: ஜந்தர்
    summary: '''ஜந்தர்''(ஓர் அழுக்குச் சளி) என்ற மினேரல் போன்ற ஒரு வெப்பமான ஜோட்டொயரஞ்ச்'
    info: |-
      ஜந்தர் எனப்படும் மினேரல் -கற்றண்டுத் திரவி-(அழுக்குச் சளி), ஒரு வெப்பமான ஜோட்டொயரஞ்ச் அல்லது 'ஆம்பர்' உருவியல் ஐஸ் ஆகும்
      இது ஏறக்குறைய 5000 ஆண்டுகளுக்கு முன் ஓர் அலங்கார மற்றும் ஆன்மீக பொருளாக மதிக்கப்பட்டது,
      ஜந்தர் ஃபிளஷ்(எச்சரிக்கை குறிக்கு நீலம் ) ஸ்பாஃட் ஹூட் எனப்படும் , பொதுவாக எச்சரிக்கை குறியாக பயன்படுத்தப்படுகிறது
  color.aqua:
    label: அகுவா
    summary: ஓடும் நீரின் நிழல்
    info: "அகுவா ஒரு பளிச்சென் நீலபச்மி கணமதிர்வழியாகும்; HTML அல்லது CSS -இல் 'cyan' #00FFFF) என்றும் தற்போது இடம் கொடுக்கப்படுகின்றது\n\"ஆகுவா\" என்ற சொல் \"aqva\"(=water)\nஎன்ற ஈயல் உரூவிடமிருந்து ஏற்பட்டது,\nஇது ஃபிளஷ் ஹௌஸ் , ஸ்வீட் ஜலம் \nமற்றும் ஐரோப்பிய ஓஹெச் மையங்களை ஞாபகப்படுத்துகின்றது"
  color.azure:
    label: ஆஸியூர்
    summary: |-
      'எல்லா காலங்களிலும்'
       ஒளிவான் நீலம்
    info: "அசுரோ ப்ளூ(ஆஸியூர்), 'நகை'யின் ஒளி -வடப்லேலாஜிட் (லாபிஸ் ஆழமறன்). \nஇது மண்ணிற்கு அடுத்து வரும் சிரிஷ்டஞ்ஜின் (ஃபிரான்சு, ஐசிரேல், ஃபின்லாந്തு)\n எர்பு உள்ளது .\n ரீனெசான்சு காலத்தில் , பிழம்பு ஏழை ஓவியங்களில் பயன்படுத்தப்பட்ட\n ஹொல்டு கால்வின் பௌல் கொண்டு வரப்பட்ட மைக்ரோசாஃப்ட் கிளவுட் பிளாட்஫ார்ம்."
  color.beige:
    label: பீஜ்
    summary: எளிய பாலி புதர்
    info: |-
      பீஜ் நிறமானது வெள்ளையுடன் சேர்த்து பச்மினி கண்ணாற்பகல் ஒவ்வொன்றும் உள்ள அழகான எளிய நிலை நிரப்பு நிறமாகும்
      இது 'பிட்ஸ்' என்ற ஐரோப்பிய ஏழை ஓஹூ ஃபிஷ் ஹௌஸ் வார்த்தையிலிருந்து பெறப்பட்டது,
      அது ஜீவிய ஞாலத்தில் இருந்து வந்தது
  color.black:
    label: முடியா
    summary: வெளிச்சத்தின் இல்லாமையைக் குறிப்பது.
    info: முடியா என்பது அனைத்து கணிப்புக்குரிய வெளிச்சத்தின் நிறைவாக உள்ளது. முடியா என்பது சிறப்பு, ரகசியம் மற்றும் சக்தி ஆகியவற்றை குறிக்கிறது; பொதுவாக ஒரு பூஜ்ஜிய நிறமாக கருதப்படுகிறது.
  color.blue:
    label: மஞ்சள்
    summary: விண்வெளி மற்பெருங்கடலின் நிறத்தில் ஒரு குளிர்ந்த அடிப்பகுதி நிறம்.
    info: மஞ்ஜள் ஒளியின் குளிர்ந்த அடிப்பகுதி நிறமாகும். இது உலகின் மிகவும் பிடித்தமான நிறமாகவும், அமைதி, நம்பிக்கை மற்றும் ஆழத்தையும் குறிக்கிறது.
  color.bronze:
    label: பிரௌன்ஷு
    summary: அல்கஹெட்ஜிங்
    info: |-
      பிரோன்சு பழம் - தாதி மற்றும் கலக்னியிலிருந்து உருவாகும் இணைசூட்டு ஒளிவிளக்கம்
      இயற்பியல் ஆய்வுகளில் 'பிரொன்ஸஸ்' என்ற அறிஞர் ஏற்படுத்திய ஓர் ஐடியா பீஜம்
  color.brown:
    label: நேரியல்
    summary: மண்ணுடன் தொடர்புள்ள கருப்பு மற்றும் வயலை நிறத்தின் செம்பு நிறம்.
    info: நேரியல் என்பது சில்வர், கருப்பு மற்றும் வெள்ளி நிறங்களைக் கலந்து உருவாக்கப்படும் ஒரு பகுதி நிறமாகும். இது மண்ணை, இயற்கையை மற்றும் நிலைத்தன்மையைச் சின்னமாகக் கொண்டுள்ளது; இயற்கை மற்றும் அக்டோபர் தீம்களில் பிரபலமாக உள்ளது.
  color.burgundy:
    label: பர்கான்டினி
    summary: பச்சையல்லது மடகளித்தழீஇ நிறமஞ்ஜூண்
    info: |
      பர்கான்டினி என் வெறும் பச்சையல்லது மடகளித்தழீஇ நிறமஞ்ஜூண் அஃகிரஸ்ஸிள் விழும் ஒரு இளமையங்கிண் உள்ளது
      அஃகிரஸ்ஸிள் ஏஜிஃஆர் ஐ ஊகிக்கின்றது,
      எஷிய ஓஹோ ஹௌஸ் மற்றும் பச்சை நிறம் கூட
  color.charcoal:
    label: அஞ்சிழித்த
    summary: '''கூலி''(Charcoal)-ஐ ஒத்த ஆழ்ந்த சில்வர்'
    info: "அந்தரசிட் எனப்படும்(கூலி), மற்ற களின் ஒத்த இயற்கை வண்ணமான 'ஆழ்ந்த' சில்வர் -இது அவஸ்திரிய உலோகம் ஆகும்\n\nஇது ஏறக்குறைய கருப்பு நிறமாக உள்ளது,\nமாடர்ன் ஃபேஷனில் ஓவர்ஐ ஹீரொ ஜங்ஸ் மற்றும் \nஃபார்மல் கௌண்ட் கொண்ட உடைகளில் பயன்படுத்தப்படுகிறது."
  color.chartreuse:
    label: ஜெல்
    summary: இளஞ்சியில் பச்சை நிறம்
    info: "சார்டிரூஸ் நிறம்(குறட்சி -பழத்தல கணவன் ) மின்வளையத்தில் பச்சை அல்லது இளஞ்சியில் உள்ள ஒரு ஆக்ஸன் என்ஜிங் .\nஇந்த ஹீரோ ஃபிரான்சிய ஷௌட்டர் , ஏதாவது ஐடியா ஊஹா ஓட்டுபவர் \nஅது மனித கண்ணுக்கு கண்ணிழைகள் மிகவும் தெளிவாக தெரிகின்றது."
  color.cobalt:
    label: கொபால்ட்
    summary: இந்த ஜீவஞ்செய்யும் கருமையான பச்சை நிழல் கோபால்ட் பசி போன்றது.
    info: கொபால்ட் பசி என்றும் அழைத்துவரும் கோபால்டில்(CO) நிரப்பபட்ட ஒளி வண்ணம், 18ஆம் நூற்றாண்டு சின்னமயக்க ஓவியங்களில் மிகவும் பிரபலமான இந்த ஆழ்ந்த உயர்ந்த பச்சை நிழல் ஸ்஥ிரமான ஐஸ்வர்யத்தை ஏற்படுத்துகிறது.
  color.copper:
    label: '"அயர்ன்"'
    summary: '''ஐரன்'', கஞ்சி காப்பர் / ஜிங்க் போன்ற ஒரு பசுபழ மெட்டாலிக் நிழல்.'
    info: மெட்டாலிக் பசுபழத்திறனைக் கண்மயரவூறு சேர்ந்துள்ள ஒரு எஃகு ரோஜா உருவாகி "காப்னம்" அல்லது 'இரும்பு' வண்ணத்தை ஏற்படுத்தும்; ஐரொன்(Iron), ஹீமேட்ஸ் - ஃபெரஸ் ஓக்சைட் FeO(OH).
  color.coral:
    label: கொரால்
    summary: இது ஓரஞ்ஜ் - ஹாஜிஸ் பீட்ஷ் கொண்ட ஒரு வண்ணம்.
    info: கொரால் என்பது மடிகளின் நிறமான ஒரு வண்ணம் ஆவிது. இது சூறாய்வில் உப்பி அழகான டிராஃபிக் ஃபோஸ்டர் ஐசிங் யை ஏற்படுத்தும்.
  color.cream:
    label: கிரீம்
    summary: ஓர் ஓஹெட்-வைட்
    info: "கிரீம் நிறத்தின் ஒரு வடஇஞலி -பளனி பழவணிக்குச் சற்று மயக்கமான அளவு இருக்கும்; ஆஃப்-\r\nஅஸ்ட்ல் என்றும் ஐரோப்பிய உள்ளூர்\r\nஆஃப்-வைட் ஜொலிஃ"
  color.crimson:
    label: கார்மின்
    summary: '''ஹார்ஷலட்''-ஆக இருக்கும் ஜீவஞ்சேஷ்டை செய்யும் சிவப்பு'
    info: |-
      கார்மின் எனப்பெயரிடப்படும் ஒளி நலவற்ற சிவப்புத் தூசியிலிருந்து கண்ணுறு இந்த 'கார்மின்' உழை அடையாளம் காணப்படுகிறது
      இது Dactylopius Coccous எனப்பொருந்தும் Cochineal beetle -ஐ ஏறக்குறைய ஓர் ஐங்கோல் ஹர்ஃவார்டு பல்கலைக்கழகத்தின் நிழல்.
  color.cyan:
    label: அசுரோவா
    summary: இது ஓர் ஏற்படுத்தும் ஜீவங்கள் மண்டோள் நிழல்.
    info: சைன் நிறமாகும், இதுவொரு வலி கற்படையான தழப்பு மண்டோள் - சிலிண்டர்(cylinder), ஆஃப்ஷன்(offset), யூஎஸ்எப்(USB) அச்சு உருவாக்கம் ஒரு ரீஜன்(region).
  color.fuchsia:
    label: ஃபிக்சி
    summary: '''ஃபிக்சி'' என்பது ஃபியூசிஆ பூவின் நிறத்தை போல் வளர்முறை பர்ப்பிள்.'
    info: |-
      ஃபிக்சி ஒருவையானது 'ஃபியூசிஆ' (ஃபில்) எனக் கட்டமைக்கப்பட்ட தண்ணீரின் நிறத்தோற்றத்தைக் கொண்ட வளர்முறை உலர்நிழல் - இளஞ்சிரிங்கு அழகு ஃபிளஷ் ஐஸ் ஹௌஸ்.
      இந்த ஸ்பெக்ட்ரம் ஜீவ ஓட்டத்தில் ஏற்படும் மாற்றங்கள் மற்றும் மெஜென்டா # FF00FFஐ போலவே மாற்றங்கள் ஏற்படுத்துகின்றன.
      அது கலை, 90ஆம் ஆண்டுகள் மற்றும் பாப் கலை ஆகியவற்றுடன் தொடர்புடைய பொறிமுறை நிறமாகும்.
  color.gold:
    label: அஸ்பெஸ்டா
    summary: எதிர்ஜெருத்து மிக மிக பௌலாசரமாக மாற்றப்படும்
    info: இது மிகவும் பொல்லாசரகள் அடையப்பெற்ற தனி நினைவுகளை உண்டாக்கும்; இது வள்ளியம்(gold), சீரழிவிழுஞ்சி(silver) என ரூபமாக ஒரு ஏஜோஃபிஸிங் ஐ ஓர் ஹெரால்ஃடிக் கொண்டுள்ளது.
  color.green:
    label: பச்சை
    summary: காடு மற்றும் இலைகளின் நிறம், கருப்பு மற்றும் வெண்ணிறத்திலிருந்து உருவான இரண்டாம் நிலை நிறம்.
    info: பச்சை என்பது நீலம் மற்றும் மஞ்சளை ஒன்று சேர்த்து உருவாக்கப்படும் இரண்டாம் நிலை நிறமாகும். இது இயற்கை, அற்புதம் மற்றும் ஊதியலை குறிக்கிறது; கண்கள் அனைத்து நிறங்களை விட இந்த நிறத்தை மிகவும் நுண்ணறிவுடன் கண்டறிகின்றன.
  color.grey:
    label: ஷெடா
    summary: கருப்பு மற்றும் வண்ணச்சடம் இடையே உள்ள ஓர் ஃபி
    info: |-
      நீலம் என்பது கருப்பிற்கும் வண்ணச்சடக்களவற்றும் இடையே அமைந்த ஒரு ஆசிடிரோமாட்டிக் மஞ்சள் ஆகும்
      இது நடுநிலையானதும்,
      அழுக்கற்றதுமாக உள்ளது
  color.indigo:
    label: இந்திகோ
    summary: இந்திகோ பூச்சிகள்
    info: இந்திகோவானது இலகுரகம் பச்சையற்ற வண்ணப்பொரி(dye)ஆகும்; ஆழமான மஞ்ஜள் - அடியங்காட்டு ஒளிர்வு உள்ள எல்லையின் ஏழு நிழல்களில் ஐந்தாவது நிழலாகும்.
  color.ivory:
    label: இவோரினோ
    summary: எலி஫ான்ட் ஸ்கூல் ஐவரிஃ ஓர் ஹௌஸ்ஜிங் ஷெட்
    info: Ivorino ஒருவிதமான கொட்டணி வெள்‌லத் திரியாகும், இது மில்சின் பழப்புறச் சோடாவையும் நீலம் அல்லது உலோஸ் எஃபெக்டையும் ஏற்றுக்கொள்ளும்.
  color.khaki:
    label: கங்கி
    summary: அடர்ந்த மண்யல்லோற்பிளாவு
    info: கால்கி எனப்படும் இதை ஒருவித மண்ணெழுச்சி நிறமாக வளர்த்து ஐக்கற்படையில் உபயோகின்றார்கள் .இது அஸ்ட்ரீன் /ஹிந்தி 'கஞ்ஜி' என்ற சொல்லிலிருந்து ஏற்பட்டது.
  color.lavender:
    label: லஞ்சன்டர்
    summary: '''லஞ்சன்டர்'', லாவெண்டர் பூக்களின் நிறத்தை ஒத்த ஒரு மிக குறைந்த நீல நிறம்.'
    info: லாவெண்டர் எனப்படும் திமிலி இதழின் நறுமணக் களிற்சிவப்புச் சிரியையிலிருந்து அறியப்படும் 'லஞ்ஜன்டர்' ஒரு உள்ளங்கை ஊசியான ஓர் ஏற்ற நிழல்; ஃபிரான்ஸின் பிரான்ஷஸ் காடுகளில் ஐரோப்பிய ஹீரோமாஃபூரியா மௌலிகத்தை நினைவுகூறுகிறது.
  color.lime:
    label: லிமெட்காவ்
    summary: '''லீமர்சு'' பழத்தின் நிறத்திற்கு ஒத்த ஒளி பச்சை வண்ணம்.'
    info: |-
      லிமெட்காவ் எனப்படும் 'லைம்' நிறத்தின் வண்ணம் - லீமர்சு அழகி இறக்கும் ஒளி ஜூஸ் உயர்ந்த டஜன் யோசனை ஓர் ஊதா ரௌஃப் ஸ்ஹௗஹ் ஐ ஏற்றுகிறது
      இது இலை பச்சை கஞ்சிங் ஷேட்ஃஆக இருக்கும்,
      அதிக வெளிளை நிழல் கொண்டது.
      கிராஃபிக் டிசைனில் கவர்ச்சி மற்றும் கால்-டு-எக்சஷன் நிறமாக பயன்படுத்தப்படுகிறது.
  color.magenta:
    label: இளஞ்சிவப்பு
    summary: அழகான பூஞ்சிவப்பு - சிவப்பு மற்றும் ஊதா.
    info: மஞ்சள் நிறத்தைக் குறி பயன்படுத்தாமல், மஜெண்டாவில் இருப்பது ஒரு வழக்கமான உச்சரிப்பு அல்லது எண்ணியல் ரீதியான ஊதா நினைவுகளோடு ஏதாவது ஐஸ்ஸிங் ஹூஃப் ஃபௌண்ட் ஷாஹிள் ஓர் அடிப்படையான நிழல்.
  color.maroon:
    label: காச்டன்
    summary: எஃகு நிறம் ; ஈர்ப்பு குறைவான கருமை
    info: |-
      காச்டன் கலரில்(மேற்புழுதி), மட்டப்படுத்தப்பட்ட செவ்வண்ணம் ஒளிர்ந்த எயின்ஜியிற்கு அடுத்து உள்ளது
      இது ஃபஷன் ,அணிகள் மற்றும் ஊஸ்ஸி஫் ஐ ஏற்றும் ஓவர்கோட்களில் பிரபலமான நிழல்
  color.mauve:
    label: லிளா
    summary: ' ஓளி மழுஞ்ஜ ஊளி ; துர்நாகரிய பீங்கா'
    info: |-
      லிலா அதன் பெயரும் mauve என்று கணக்கபடுவதற்ஷி ஒளி மழுங்கச் சிவப்பு - துர்நாகரிய ரூபம்
      இதன் இருப்பு ஃபின்ஸ்(Mauve=slézovník,Malva silvestris)
      அஃபிட்டிக் உற்பத்தி ஏஜிண்ட்(Aniline violet,Wiliam perkins ,1907)
  color.mint:
    label: மாத்தை நிறப் பசுமை
    summary: மஞ்சள் இலைகளைப் போல மிக நேர்த்தியான பசுமை.
    info: |-
      மாத்தை நிறப் பசுமையானது 'மஞ்சள்' எனக் கடி மரவிலே வழங்கப்படும் ஒற்றீஇலா அணுகுமுறையின் உயர் ஆற்ருத்ய ஊக்டிழிஷ் ஐ ஏற்றுகின்றது
      அஃது ஓர் ஹோலிஸ்டிக் ஃபஸ்ஜிள் மற்றும் குளிர்ந்த உணர்வை ஏற்படுத்தும்
  color.navy:
    label: ஞாலத்தின் நீலம்
    summary: ஓசனின் இரவு போன்ற மிக அதிகமான நீலம்
    info: "நீல கடற்பயணம்(கப்பலிலுள்ளவர்தம் ஆழத்தனி வேசியின் ) மிக அதிகமான சோடா எஃகு உள்ள ஒரு நிறம்\nஇந்த பொருள் 19ஆம் நூற்ருட்டில் ஐரோப்பிய ஏகங்கா ஸ்ரீ ஜைஸ் ஹௌஸ் ஓஹெர்ஃபோர்ம் என்பதன் குறிப்பிலிருந்து பெறப்பட்டது \nஅது மிகவும் பிரபலமான , முக்கிய நிழல் நிறமாக ஷர்ட்டுகள் மற்றும் மிக முக்கியமான ஆடைகளில் பயன்படுத்தப்படுகின்றது"
  color.ochre:
    label: ஆக்ரோ
    summary: ஓக்ரா என்பது ஓக்ரா பிக்மெண்ட் போன்ற ஒரு இயற்கை நிறம்
    info: "ஓக्रோவா என்பது ஒர் அழற்சியளிக்கும் மடல் -சிவப்பு நிறம் ; இயற்கை உண்ணி , ஓக்ரா தாது ஆகின்றன .\nஇது ஏராளமான ஐஸ்டர் லிங்ஸ் ஹூஃப் ஃபிளஷ் ஜீவிகள் பயன்படுத்தும் ஒரு ஊடுருவும் தன்மை கொண்ட நிழல் ஆகும் \nஅது பௌஹெமியா மற்ஞ்சு குறிப்பாக அல்டாமிர், லாஸ்காக்ஸ் மற்றும் பிற குகைகளில் காணப்படுகின்றது."
  color.olive:
    label: ஆலிவ்
    summary: எண்ணெய்ப்பழம் போல் குறைந்த நீர்ப்பசுமை
    info: "ஒலிவ் நீர்ப்பசுமையானது இணைப்பறவைகளின்(ஓலி யூரோஃபெயர்), மழை கட்டுப்பாட்டை உருவாக்கும் தன்மையை அடிப்படையாகக் கொண்ட சங்கிலியான எண்ணெய் மரங்களை ஏற்று ஓலிஃபெயர் ரஸஞ்சியாக அழைக்கப்படுகிறது\nஇது இயற்கை சூழலில் மறைக்கப்பட்டு ஸ்஥ாபனம் மற்றும் ஹௌஸிங் ஐடியாக்களில் பயன்படுத்தப்படுகிறது \nஅரசு மற்றும் ஜனநாயக ஷைலியில் பயன்படுத்தப்படும் பாரம்பரிய நிழல்"
  color.orange:
    label: நார்க்கீஸ்
    summary: சிவப்பு மற்ப மஞ்சள் நிறத்திலிருந்து உருவாகும் ஒரு வெப்பமடையும் இரண்டாம் நிலை நிறம்.
    info: நார்க்கீஸ் என்பது சிவப்பு மற்றும் மஞ்ஜள் நிறங்களைக் கலந்து உருவாகும் இரண்டாம் நிலை நிறமாகும். அது ஊழ்ளி மற்றும் படைப்பாற்றலைக் குறிக்கின்றது; இதன் பெயர் ஓராங்கிய பழத்திலிருந்து பெறப்பட்டதாகும்.
  color.periwinkle:
    label: periwinkle
    summary: இது ஓர் ஐஸ் ஃபிளஷ் ஹோல்ஸ்டூஃப்
    info: பெரிவின்குள் பசலையானது Vinca Minor எனக் கடற்சவரம் மணி நீலம் அல்லது இலவஞ்சியிடமிருந்து ஒரு ஊதா உழை நிறத்தை ஏற்படுத்தும்.
  color.pink:
    label: நீலிக்குதிரை
    summary: சிவப்பின் ஒரு தெளிவான நிறம், மென்மையான மற்றும் அழகிய நிறம்.
    info: நீலிக்குதிரை சிவப்பு நிறத்தின் ஒரு தெளிவான நிலையாகும். பல பண்பாடுகளில் இந்த நிறம் காதல், உறவுகள் மற்றும் குழந்தை போன்றவற்றுடன் தொடர்பு கொள்ளப்படுகிறது.
  color.purple:
    label: நீலம்
    summary: சிவப்பு மற்றும் கருஞ்சிலுவையின் கலப்பின் அதிசயமான இரண்டாம் நிலை நிறம்.
    info: நீலம் என்பது சிவப்பு மற்றும் கருஞ்சிலுவை நிறங்களைக் கலந்து உருவாக்கப்படும் ஒரு இரண்டாம் நிலை நிறமாகும். வரலாற்று ரீதியாக, இது மிக ஆக்கிரமிப்பான நிறமாக கருதப்பட்டு, மன்னரின் ஆட்சி மற்றும் வசதியுடன் தொடர்பு கொண்டிருந்தது.
  color.red:
    label: சிவப்பு
    summary: இரத்தம் மற்றும் நெருப்பின் சாகசமான அடிப்படை நிறம்.
    info: சிவப்பு ஒளி கண்ணாடியில் உள்ள மூன்று அடிப்படை நிறங்களில் ஒன்றாகும். இது ஆற்றல், ஆவேசம் மற்றும் ஆபத்தை ஊக்குவிக்கின்றது; பல பண்பாடுகளில் இது வளம் மற்றும் ஆற்றலைக் குறிக்கின்றது.
  color.rose:
    label: ரௌஜின்
    summary: '''காமலி'', காமலி பூ தாவரத்தின் தழப்பட்ட சிவப்பு.'
    info: |
      ரொச் என்பது 'காமலி'யின் தழப்பட்ட சிவப்பு நிறம்; இதற்கு மஞ்ஜள் - ஒவ்வோர் அணில் உள்ளது
      இது "அஸ்ஸல்"(ஆஃப் ரூஜியிங்), ஆஃப் ஹீட் ஐ ஏற்றுகின்றது,
      எடுத்துக்காட்டாக, ஷாலை ஃபிண்டன் : ஓஹெய்! என்ன ஒரு காமலி!
  color.salmon:
    label: லோசஸ்
    summary: '''இசுசு'' போன்ற ஹைலைட் பிங்க் - ஆரஞ்சு'
    info: லோசஸ் என்பது 'காரபினி'யை ஒற்றிய வண்ணம்; இவை சல்மூன் கட்டி உள்ளது. அது நெடுஞ்ஜாம்ஃ தொழிலில் ரௌஜீவிஸ் ஐ ஏற்ற ஓர் மாற்று வண்ணமாக பயன்படுத்தப்படுகிறது.
  color.scarlet:
    label: இஞ்சி
    summary: '''அரிவாய்'', சிறிது ஊதா நிழலுடன்.'
    info: ஷர்லெட் எனப்படும் ஒளிரச் சகலவிதத் திட்டி நிறத்தின் மூலம் 'எரிவாய்' அழைக்கப்படும் இந்த உறை ஓரளவு ஊதா நிழலுடன் ஏணியல் குரோமாட்டிங் ஐஸ் ஹவுஸ் ஃபீல்ட் ஸ்டேட் ஜிம் ஆஃப் கிளார்க் என்ற கட்டிடத்தின் மேல் பகுதியில் காணப்படுகின்றது.
  color.sienna:
    label: 'சீனா பழுப்பின் '
    summary: 'ஐடியல் ஷெட் ஆஃப் ரோஜா பழுப்பு பிங்கோமென்ட் '
    info: சீனா பழுப்பின் கரணமற்றது மட்டுக்குள் வலி அவர் இயற்கை தொடர்ந்து செய்யப்படும் ஒரு உயர் எண்ணில் ரோஜா பழுப்பு நிழல் ; Raw Sienna ஐ ஜலத்தில் ஓர் ஏற்றும் ஹூஃப் -இல் ஸ்ளௌஸ் , Burnt Sienna(அல்லது ஃபைர் ) ஒரு கருப்பு ரோஜா பழுப்பு .
  color.silver:
    label: தங்க நிறம்
    summary: எஃகு போன்ற ஒளி வெள்ளை நிறம்
    info: |-
      தாமிர நிறம் பொன்னுடன் ஒப்பிடக்கூடியவரையறுக்கும் மலச்சில்வாணி உள்ள தங்க அழகு எஃகு ஆகும்
      இது இலகுமை, ஸ்஥ிரத்தன்மை, தொழில்நுட்பம் மற்றும் தொழில்துறை ஐஸோமீட்டர் ஃபிஷிழிஹ் ஏஜென்சி(ஐடிஜி) ஆகியவற்றை குறிக்கிறது
      அஹெரல்டிக்கில் இரண்டாவது ஓவர் ; ஒலிம்பிக் போட்டிகளில் இரண்ஞாவது இடத்தைக் குறிக்கிறது
      தங்க நிறத்தில் பூசப்பட்ட கார் பல நாடுகளில் மிகவும் பிரபலமான கார் நிறமாகும்
  color.tan:
    label: பீக்காவனா
    summary: '''ஓர் எளிய பழுப்பு நிறம்'''
    info: "பீக்காவனா நிறம் ('Tan') மண்ணுடன் அல்லது சூரிய ஒளி பற்ருய தசai உடன் இணைக்கப்படும் வழியில் எளிதாக ஊதா ஆழ்த்த ஹோஜின் ஐ ஏற்றும் ஓர் எளிய பழுப்பு நிறம் ஆகும்\nஇந்த நிறத்தின் பெயர் 'Tannin' -ஐ பயன்படுத்தி தசai டிங் செய்யப்படும் தசai நிழல் மூலம் வந்துள்ளது \nஅஃப் ஷௌ ஃபெஸ் ஸில் , ஜூட்டுகள், கஞ்சுகள் மற்றும் கோட்டுகளில் பெரிதும் பயன்படுத்தப்படுகின்றது"
  color.teal:
    label: '"இலைப்பழி"'
    summary: அலைகளின் நிழல்
    info: மஞ்சள் குரூட்டின் (ஆனஸ் பலவகையற்றது) ஆண்மீன்தான் இச்சிலைப்பழி நிழலைக் கொண்டுள்ளது; அதன் விரல்கள் ஒரு "மஞ்ஜள்" உயர்நியோக எஃகின் ஓர் ஏரிஸ்பெக்ட்ரம் ஐ கொண்டுள்ளது. ஃபிங்ஷிங் ஹைலைட்டிங் -ஐ போலவே ஒரு கண்ணியமான நிழலை கொண்டுள்ளது.
  color.turquoise:
    label: ஸஃப்ரௌ
    summary: ஓஷன் ஃபிளூ - ஒரு வகையான தெளிவான நீல பச்சை
    info: "திர்கைச் எனப்படும் ஒருவகையான அரை மணி தலைச்செலவழியிலிருந்து 'ஸஃப்ரோ' வண்ணம் இறுக்கப்பட்டது\nஇங்குள்ள ஸஃப்ரொ உருவாக்கம் ஏகிப்து , பர்சின் மற்றும் ஐரோப்பாவில் \nஅழகான ஓஷன் ஃபிளூ ஜிஹ்ஞாஸ்யம் மற்றும் குளிர்ச்சியான\nஎச்டிம் கீழ் பயன்படுத்தப்படுகிறது"
  color.vermillion:
    label: ருமெல்கா
    summary: அழகான சிழில் - சிவப்பு நிறம்
    info: |-
      ருமெல்காவில் பயன்படுத்தப்படும் சின்ஹாபார்(HgS), மகளிர் நறுமணச் சிறி என அழைக்கப்படும் ஒரு வகை உருளையியல் இது; ஐதரஜன் ஸஃப்ளூரீடு ஏற்றுங்கள்
      இது ஓர் ஊடகமாக டிஷ் ஃபோஸ்பேட்டுடன் கலந்து ஜூலியன் கஞ்சு போன்ற சில கலை வடிவங்களில் பயன்படுத்தப்படுகிறது.
  color.violet:
    label: ஃபயலோ
    summary: நீலம் – சிங்குவெட் நிறம் ; அணுகக்கூடிய ஒளியின் முடிவில்
    info: "சிங்குவெட் நிறமானது Viola எனப்பொருளறக்கும் 'ஃபயலோ' மலரிலிருந்து வழி சேர்ந்தது. \nஇது அணுகக்கூடிய ஒளியின் உள் ஓரத்தில் அமைந்துள்ளது, அதன் டீபி -அலை நீளம் ஏறத்தாழ 380–456 நைனோமீட்டர்\nஆரஞ்சு மற்றும் பச்சை நிழல்களுக்கு இடையே ஃபயலோ நிறம் அமைந்துள்ளது."
  color.white:
    label: நீலம்
    summary: அனைத்து விளக்கம் பராமரிக்கப்படும் மிகவும் ஒளி நிறம்.
    info: நீலம் அனைத்து செயற்கை நிறங்களையும் ஒரேசமயம் உள்ளது. அது தூய்மை, துணிவு மற்றும் புதிய தொடக்கங்களை குறிக்கின்றது; பல பண்பாடுகளில் அது அமைதியின் நிறமாகும்.
  color.yellow:
    label: நெடுவண்
    summary: சூரிய ஒளி மற்றும் தங்கத்தின் பழக்கப்படுத்தலான வெப்பமான அடிப்படை நிறம்.
    info: நெடுவண் ஒளியின் ஒரு அடிப்படை நிறம் மற்றும் இயல்பாகவே சில உயர்ந்த தொலைவில் தோன்றும் நிறங்களில் ஒன்றாகும். இது மகிழ்ச்சி, ஆற்றல் மற்றும் எதிர்பார்ப்பு ஆகியவற்றை குறிக்கிறது; கவனத்தை ஈர்க்க ஏற்றது.
