lang: vi
pivot: false
title: Các màu cơ bản
cards:
  color.black:
    label: đen
    summary: Màu tối nhất, sự vắng mặt của ánh sáng.
    info: Đen là sự vắng hoàn toàn của ánh sáng nhìn thấy được. Nó tượng trưng cho sự sang trọng, bí mật và quyền lực; trong thời trang, màu đen được coi là một gam màu cơ bản và phổ quát.
  color.blue:
    label: màu xanh lam
    summary: Màu sơ cấp lạnh của bầu trời và đại dương.
    info: Xanh lam là màu lạnh thuộc nhóm ba màu cơ bản trong ánh sáng. Đây được coi là màu sắc yêu thích nhất trên thế giới và tượng trưng cho sự bình yên, lòng tin tưởng cũng như chiều sâu.
  color.brown:
    label: màu nâu
    summary: Màu đất đặc trưng của gỗ và đất.
    info: Nâu là màu thứ cấp được tạo ra bằng cách trộn đỏ, vàng và đen. Nó tượng trưng cho đất đai, thiên nhiên và sự ổn định; thường được sử dụng trong các chủ đề tự nhiên hoặc mùa thu.
  color.green:
    label: xanh lá
    summary: Màu cỏ và lá cây, màu thứ cấp từ xanh lam và vàng.
    info: Xanh lá là một màu phụ được tạo ra bằng cách pha trộn giữa xanh lam và vàng. Nó tượng trưng cho thiên nhiên, sự sống và tươi mới; mắt người nhạy cảm nhất với màu này trong tất cả các màu sắc.
  color.orange:
    label: cam
    summary: Màu thứ cấp ấm áp được tạo ra từ đỏ và vàng.
    info: Cam là màu thứ cấp hình thành bằng cách trộn lẫn đỏ và vàng. Nó tượng trưng cho sự nhiệt huyết và sáng tạo; tên gọi của nó bắt nguồn từ trái cam.
  color.pink:
    label: hồng
    summary: Màu hồng là một sắc độ nhạt của màu đỏ.
    info: Hồng là gam màu nhạt của đỏ và thường được liên tưởng đến sự dịu dàng, lãng mạn và vui vẻ trong nhiều nền văn hóa.
  color.purple:
    label: tím tím
    summary: Màu bí ẩn thứ cấp được tạo ra từ đỏ và xanh lam.
    info: Tím là màu thứ cấp hình thành bằng cách trộn lẫn đỏ và xanh lam. Trong lịch sử, đây thường là màu đắt giá nhất, gắn liền với quyền lực hoàng gia và sự xa hoa.
  color.red:
    label: đỏ
    summary: Màu đỏ - màu nóng nhất trong các màu cơ bản.
    info: Đỏ là một trong ba màu chính của ánh sáng. Màu này gợi lên năng lượng, đam mê và nguy hiểm; ở nhiều nền văn hóa, nó tượng trưng cho may mắn và sức mạnh.
  color.white:
    label: màu trắng
    summary: Màu sáng nhất, phản chiếu toàn bộ ánh sáng.
    info: Màu trắng chứa tất cả các màu trong quang phổ nhìn thấy cùng lúc. Nó tượng trưng cho sự sạch sẽ, vô tội và khởi đầu mới; ở nhiều nền văn hóa, đây là biểu tượng của hòa bình.
  color.yellow:
    label: màu vàng
    summary: Màu nóng sáng và là màu cơ bản của ánh nắng mặt trời cùng với vàng kim.
    info: Vàng là một trong những màu sắc tươi sáng nhất và cũng là màu nguyên tố của ánh sáng. Nó tượng trưng cho niềm vui, năng lượng dồi dào và sự lạc quan; đồng thời rất hiệu quả trong việc thu hút sự chú ý.
