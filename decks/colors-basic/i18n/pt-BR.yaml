lang: pt-BR
pivot: false
title: Cores básicas
cards:
  color.black:
    label: preta
    summary: A cor mais escura, ausência de luz.
    info: Preta é a ausência total da luz visível. Simboliza elegância, mistério e poder; na moda, ela é considerada uma cor básica universal.
  color.blue:
    label: azul
    summary: Cor primária fria do céu e do oceano.
    info: O azul é uma cor primária fria da luz. É a cor mais popular no mundo e simboliza calma, confiança e profundidade.
  color.brown:
    label: marrom
    summary: Cor terrosa secundária da madeira e do solo.
    info: O marrom é uma cor secundária formada pela mistura de vermelho, amarelo e preto. Simboliza terra, natureza e estabilidade; é muito usada em temas naturais e outonais.
  color.green:
    label: verde
    summary: Cor da grama e das folhas, cor secundária misturando azul e amarelo.
    info: O verde é uma cor secundária formada pela mistura de azul e amarelo. Símbolo da natureza, frescor e vitalidade; o olho humano percebe essa cor com mais sensibilidade do que qualquer outra.
  color.orange:
    label: laranja
    summary: Cor quente e secundária formada por vermelho e amarelo.
    info: Laranja é uma cor secundária criada ao misturar vermelho e amarelo. Simboliza entusiasmo e criatividade; recebeu o nome da fruta laranja.
  color.pink:
    label: rosa
    summary: Tom de vermelho claro e cor delicada.
    info: O rosa é um tom suave do vermelho. Em muitas culturas, está associado à gentileza, romance e brincadeira.
  color.purple:
    label: roxa
    summary: Cor misteriosa e secundária formada pela mistura de vermelho e azul.
    info: A cor roxa é uma cor secundária criada ao se misturar o vermelho com o azul. Historicamente era considerada a cor mais cara, associada à realeza, poder e luxo.
  color.red:
    label: vermelho
    summary: Primária quente da cor do sangue e fogo.
    info: Vermelho é uma das três cores primárias da luz. Ela evoca energia, paixão e perigo; em muitas culturas simboliza felicidade e força.
  color.white:
    label: branca
    summary: A cor mais clara, reflexo de toda luz.
    info: A branca contém todas as cores do espectro visível simultaneamente. Simboliza pureza, inocência e novos começos; em muitas culturas é a cor da paz.
  color.yellow:
    label: amarelo
    summary: Cor quente e brilhante do sol e ouro.
    info: O amarelo é uma cor primária da luz e uma das mais brilhantes. Simboliza felicidade, energia e otimismo; atrai bem a atenção.
