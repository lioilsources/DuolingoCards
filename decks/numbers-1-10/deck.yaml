# numbers-1-10 — numerals illustrated with objects. Despite the slug the deck
# runs 1..50; the titles say so.
#
# The numeral is the teaching signal and renders correctly on every card. The
# accompanying object count does NOT: FLUX cannot count reliably above ~4, and
# no prompt phrasing fixes it — explicit grids ("a row of four above a row of
# three") were tried and ignored. Cards 5, 6, 7, 8 and 10 show the wrong number
# of objects; 1-4 and 9 happen to be right. Fixing this needs a generate →
# count → retry loop (content images -tune with a vision validator), not better
# wording.
slug: numbers-1-10
version: 1
tier: 0
brief_attrs: ["(cute cartoon:1.2)", "(simple illustration:1.2)", "(bold and clear:1.2)", "(centered composition:1.1)"]
styles:
  - photo
  - ink
default_style: photo

cards:
  - key: num.one
    hint: the numeral 1, cardinal number one
    image: num.one.png
    brief:
      subject: one apple on a plain background
      attrs: [single apple, large numeral 1, bold, cute cartoon style]
      setting: [white background, centered, clean]
      avoid: [text labels, other fruits, multiple objects]

