    info: "अंक सः द्विचतुरशीयो हि प्राकृतिकस्य अंकेन् 21 के पश्चा आगच्छन्ति।\nद्विशष्टमवधिरहितपञ्चाधिक मण्डल लिपि : 'XXI'। \nएकांक गणना - एकाम्बर षट्सभ्य जनँ।"
