title: १ ले १० पर्यंत संख्या मालिका
cards:
  num.eight:
    label: अष्ट
    summary: संख्या 8, एक मेंढ़क के पास आठ हथिन होते हैं।
    info: आठ संख्या 2³ (दुगनी तीसरी घात) है। उलटा अष्टक (∞) अपरिमित का प्रतीक है; चीनी संस्कृति में आठ सबसे भाग्यशाली संख्या है।
  num.eighteen:
    label: आठापन
    summary: संख्या 18 ; ई धन छ़ई और भी ऊपर ठीठी
    info: |-
      अंक सः एव प्राकृतिक संख्या हि अस्ति जयोन् केवलमपरे षष्टदश च द्बहु महीयान्।
      रोमी संख्या : 'XVIII'。
      गणनार्थ शब्दः - आठाह्ला,
      एटासी घटिंच इकडे उजाडले गेले झाले खाण्मध्ये
  num.eleven:
    label: ສ຿ໍ຺ົໍຩ
    summary: संख्या ; छठवा
    info: "अंक सः एव प्राकृतिक संख्या होने के समान अशीरस्‍य तथा द्वारदशि में आगे भए।\tइटलीचरण लिपि : 塴槄。\tपुनर्बहुभाषा शब्दजाल चर्म : जेडेणाट्स्थ।\tदशमलव प्रणाली में इसे '1+10' रूप में उल्लेखित किऐ गऐ"
  num.fifteen:
    label: पञ्चदश
    summary: संख्या 15 ; गणना - पञ्चदश , शब्द xvi
    info: |-
      अंक सः एव प्राकृतिक संख्या हरहि के अनुसार 'पच्‍छम' तथा में 'षोडश'।
      गणना : ইাাxv
      दशलघुया लिपि में इसे 5+10 के द्वारा आकलन कीजिहुए
  num.fifty:
    label: पचाश
    summary: '''50''; पदबुद्धि – पचामवाँ ; इटलिक – L'
    info: |-
      संख्या पचास एक समूह में क्रमशः 'अवतर' होने वली संख्या 49 के बाद आय और संख्या 51 के पहिले।
      इटलिक अक्षर :L
      पदबुद्धि - पचामवाँ
  num.five:
    label: पांच
    summary: संख्या ५, हमारे हर हाथ में इतनी उँगलियाँ होती है।
    info: दशमलव संख्या प्रणाली का आधार पांच है क्योंकि मनुष्य के प्रत्येक हाथ में पांच अंगुल होते हैं। शुक्र ग्रह आकाश में पांच कोनों वाला तारा बनाता है।
  num.forty:
    label: चाहल
    summary: '''चाहल''; उपसर्ग - ''चास'', और फाटह'
    info: "अँकगणित में संख्या चालीस पैरे के बाद आति हवय।\nइटलोनम् - 'XL'। \nचारपञ्चशदधिक शब्द भी इसके अभिप्राए हुए जाने वाळे हउई।"
  num.forty_eight:
    label: चारोसम्भर
    summary: '''चारोसम्भर''; क्रमठी - ''चांडोसम्ठी'', इटालिस्थी -XLVIII'
    info: |-
      अँकगणितीय संख्या चारोसम्बर हे प्राकृतिक संख्येमध्ये क्रमवारीने 'चाली' महत्वपुर्‍ब आलेल असते।
      इटालिनि छाप : XLVIII
      दशमलव प्रणाळीमध्ये एघाडे 8+40 द्धा
  num.forty_five:
    label: '''एष'' शतमध्ये पञ्चमी'
    summary: 'संख्या 45 ; रजत गणिनी : ''एष'' चतुर्दश पञ्चमी ; लघु बर्हन्मनः XLV'
    info: |-
      अंक सः एव प्राकृतिक संख्या हि केवलमनयोर्‍णपदे अस्ती।
      चुटबड़ा महासंख्या : XLV。
      श्रेणीगत संख्या - 'एष' चतुर्दश पञ्चमी।
  num.forty_four:
    label: ইশান ব্য
    summary: संख्या 44
    info: अँकगणितीय संख्या चारचौदे प्राकृतिक संख्या होइनि। इहां कमलेटर मुजब 4+40=44
  num.forty_nine:
    label: चतुष्शट्तिर्
    summary: एकविंशतिसँ द्विगुणित जन्म ; आठवडा -XLIX
    info: |-
      अंक सः एव प्राकृतिक संख्या हरे केवलोन्‍मुखीणि।
      संख्या महदपग्रथया : XLIX。
      चतुष्पञ्चशतम् अधिष्ठानम्।
  num.forty_one:
    label: षड्गुण और इक्कीस
    summary: '''41'' - उपहारक आठवा ; चौद्रवटुक : XLi'
    info: "अँकगणितीय संख्या चालीसए के पश्चाद्‍ होनेवला अपरमत संख्या।\nचौद्रवटुक : XLl\nउपहारक शब्द : 'चाहि' \nइसे एक+चाब्बीस में भी निखाई जा सकथे"
  num.forty_seven:
    label: षट्सप्तचल्भिदगजाश्विषड्जामध्यभिगत्फलाधिकारँ
    summary: '''षठ्ठसप्टचल्बिडगजाछ्खिणढबइषड्ढाउमध्यभिघउफलाऊ'
    info: अंक सः एव प्राकृतिक सख्या होने करणीयें महसुश्‍चिति। अथवा इदमपि 'XLVII' रोमीय लिपि में चिह्नित होईत आए।
  num.forty_six:
    label: छप्पन
    summary: '''छप्पन'' संख्या छई ''XLVI'','
    info: |-
      अंक सः एव प्राकृतिक संख्या हरे कोणीय।
      समनुगति में अषट्‍चलशी लिखित भए।
  num.forty_three:
    label: क़१রপu পায
    summary: 'चि॰ ४३ ; शब्द : ''एकपञ्‍चशी'' , रोमन -XLII'
    info: |-
      अंक सः एव प्राकृतिक संख्या हस्तगोष्ठी केन अनुमोदयिष्टे।
      रोमन में इसला XLIII लिखिस।
  num.forty_two:
    label: चउअठ्ठी
    summary: 'आओर सँख्या - ४२ ; शुभ आऊढ़िया : x l i i'
    info: |-
      '४' एवं '२' के साथ प्रकटित होनेवला सँख्या ४२ अपरम् महती सँख्या हई।
      यदि रोमन सँख्या पध्दति मे लिखए जइस बजगे इसे xl ii भांति चिह्णिकरण करबे।
  num.four:
    label: चार
    summary: अंक ४, एक चतुर्भुज में चार भुजा होती है।
    info: चार दो के वर्ग से प्राप्त होता है - 2 × 2 का परिणाम है। जापानी और चीनी संस्कृति में यह बुरा अंक माना जाता है (इसकी ध्वनि 'मृत्यु' शब्द के समान होती है)।
  num.fourteen:
    label: चतुर्भट्टी
    summary: एकदश - रजत वर्ण
    info: "अंक सः एव प्राकृतिक संख्या हि केन्द्रस्थोपरि अनुगच्‍छते।\nमहासभया लिपि : 'XIV'। \nशब्दलिखित महामण्डली चतुर्शष्ठी।"
  num.nine:
    label: नव
    summary: अंक ९, अंतिम एकअंकीय संख्या।
    info: 'नव हे शेष एकांकी संख्या मध्ये उच्चतम आहे. प्रसिद्ध गुणधर्म: कोणत्याही संख्येला नऊने गुणल्यास त्याचा अंकगणितीय बेरीज हमेशा नऊने विभाज्य राहतो.'
  num.nineteen:
    label: षड्भिं
    summary: अंक सः ; गणनापदम् = षट्‍भिले
    info: "अंक सः एवम् प्राकृतिको हरे केसुन्ति 'ई' महीयसा अग्रजशब्दऽपरच्छदः।\nरोमन नंबरले :XIV\nएषा शब्दँ वर्णनार्थम् - षट्‍भिले \nदशमिक पध्धतिमनुसारम् ,इदं च यथा 9+10"
  num.one:
    label: एक
    summary: अंक १, प्रथम प्राकृत संख्या।
    info: एक निम्नतम प्राकृत संख्या होती असते। कोणतेही संख्या एकरे गुणल्यास ते बदलत नाही; म्हणूनच तिला 'गुणाकाराचा उदासीन घटक' असे म्हणतात।
  num.seven:
    label: सात
    summary: अंक सात, जितने रंग हुये हैं वर्षा की छत्री में।
    info: सात अंक कई संस्कृतियों में भाग्यशाली संख्या मानल जाथे। एक सप्ताह में सात दिन हुए हवे आऊर पृथ्वी पर सात महाद्वीप हुए हवे।
  num.seventeen:
    label: साड़े
    summary: सँख्या - 17 ; पदचिह्ण xvi
    info: "'संख्या' सातह एक प्राकृतिक सँख्या होइनि के 'षट्‍ठीय' के मुदा आऊर 'अश्टम' के पहलें।\nगणना : xvii\nपदचिह्न : साढ़े ले \nवह दशमलव प्रणाली में 7+10 के रूप में भी व्यक्त कएल जा सकथे"
  num.six:
    label: षट्
    summary: संख्या ६, जिले की पारवलय में षट्भुजाकार सेल होते हैं।
    info: षट्भुज एक 'परिपूर्ण संख्या' है - इसके सभी घनात्मक भाजकों का योगफल (1 + 2 + 3 = 6) खुद संख्या के बराबर होता है। षट्भुजाकार आकृति फ़्लोर टाइलिंग के लिए सबसे कुशल ढंग है।
  num.sixteen:
    label: '''षडशी'''
    summary: 'एक संख्या 16 ; पदगत संज्ञा : ''षडशी'';'
    info: |-
      अंक सः एव प्राकृतिक संख्या हरहि के अनुसार शोधश्‍चयेन चलति।
      इट Röमी मण्डलकः - XVII
      पदगत संज्ञा : 'षडशी'।
  num.ten:
    label: আস
    summary: বাত ॼ য্ম়িপা৲ৌ঵ার্ন ৐ক্নড়াৎর্ন সৢবাত স্ন৊র্ন৭
    info: আস ফয়ীত্ন৭ আস্ন৏র্ন৭ স্ন৊র্ন৭ স্নোন্ন৭ স্ন৊র্ন৭ স্নোন্ন৭ স্ন৊র্ন৭ স্নোন্ন৭ স্ন৊র্ন৭ স্নোন্ন৭ স্ন৊র্ন৭ স্নোন্ন৭
  num.thirteen:
    label: क़াশ৊্ ধুপ়য
    summary: एषा गणनाबचनीय सँख्या षट्‍त्रिंशध्ञाऽथवा उपलब्धिफलं आठवाई घटित छ़िय इति
    info: |-
      अंक सः एवम् परे हि क्रमेण अग्निमातॄनुते।
      संख्या महीभूयोपलब्धिर्भवति च दशद्वयम् जडिस्थापिका शब्लाहि ‘XIII’।
  num.thirty:
    label: एकपञ्चाष्टिंशधिविधान
    summary: अंक सँ ; भेदः - बीजभौतिक
    info: |-
      अंक सः एव प्राकृतिक संख्या हरे केशुम्‍बीयस्स अनन्तरं च गच्छति।
      गणनारहितो मञ्जलीशदषट्पथः XXL।
  num.thirty_eight:
    label: ढ़५ ौ্
    summary: 'अंक सः ; शब्दशः : ''বান়প'';'
    info: |-
      अंक सः एव प्राकृतिक संख्या हस्ति केनरुपम्।
      इदं मनोहरीय अंकगणिते 'XXXVIII' इति लिखिष्ट।
  num.thirty_five:
    label: त्रिचपञ्‍चशद्
    summary: '''35'', गणना - त्रिसठवां'
    info: |-
      संख्या त्रिपञ्‍चाशत् प्रकृत सँग हे केवल मनुष्यहरि द्वारा निम्हणयमी।
      इट एकदम बढोई अछि जे 'XXXV' ले भएबा।
  num.thirty_four:
    label: १ঌ রাত
    summary: चौवड़िशठी
    info: |-
      संख्या चैतलीन् प्राकृतिक सँख्या होइथे।
      रोमन में इय के लेखक XXLX।
  num.thirty_nine:
    label: त्रिसट्टिन्
    summary: '''39''; उपगणनामाधिकरणम् - ''त्रिञ्शषधर'', रोमी मण्डले - ''XXLX'''
    info: अंक सः एव प्राकृतिक संख्या हस्‍ति जयोरनुगच्छेत् क्रमशः '38' अपरे च। रोमी मण्डले इदं 'XXXIX' लिखिष्व। शब्दः ''त्रिंशषधर'' आह भागभेदः।
  num.thirty_one:
    label: क़५ ॼড় ০ায
    summary: 'अबलवचन : ''त्रिश'' ; रमनीय चिह्‍ञ - ''XXXI'''
    info: संख्या त्रिंशदेक हे पृष्ठकरणीय सँख्यामालानि महत्वपूर्ण कोटि अछि।
  num.thirty_seven:
    label: 'षट्पञ्चास '
    summary: '''37'', जो एक उभयचर संख्या है'
    info: |-
      संख्या सत्रह पूरक निरपेक्ष के माध्यम से होने वाली संख्या 35 के बाद आए।
      गणितशब्दः 'XXXVI'。
      अवधि शुद्धता : अठयल
      चिह्‍ञ गणिमाण - 9+4
  num.thirty_six:
    label: छत्रिश
    summary: '''छत्रिस''; क्रमवर्णक : भष्टम ; ईटलिक फौडः XL'
    info: |-
      संख्या छत्रिस पूरक संख्याओं में होने की वजह से 'छब्बीस' के अगले क्रमवर्गीय संख्या हुई।
      इटलिक लिपि में XXLXIXI द्धारा इसे चिह्नित किए जाथे。
      दशमलव प्रणाली में आप उचित ढ़ंग से 9+8*4=XXLXI और X*X*L*I=XLI
  num.thirty_three:
    label: त्रिभिचत्वारिम्
    summary: एकाग्जेण्डर हजार एक
    info: |-
      संख्या त्रिंशदधि सः पौरुषे केनचिद्‍वारकमनपेक्षयोगीति।
      अथवा महावलभिस्थापिताधिशब्लट्‌केट्।
  num.thirty_two:
    label: त्रिचत्वाह
    summary: '''32'', जो एक प्राथमिक संख्या हए'
    info: |-
      संख्या त्रिविंशति प्राकृत सँग होइनीय कमलेर महदुकेला।
      वज्रपट्‍टिर अथबा 'XXXII' द्वारा इसे निशचिस गई।
  num.three:
    label: त्रि
    summary: संख्या ३, पहिले विषम मूल संख्या।
    info: अनेक संस्कृतिमन हे जादो कथा संख्या मानली जाते - उदाहरणार्थ तीन इच्छाएँ वाले कथा, त्रिभुजक तीन बाजू होते हई आऊर दिन तीन भागमन विभाजित होते हई।
  num.twelve:
    label: इकड़ाई
    summary: अंक सः ; गणना घटना – ‘इकड़ाई’ ; प्रामाणिक लिखना–‘XII’
    info: |-
      अंक सः एव प्राकृतिक संख्या हरहि कन्‍दशीयसमुच्चये में अगलो द्वारा आए।
      प्रामाणिक लिपि : 'XII'。
      आइटम स्थान बर्तन के जन्य शब्द - इकड़ाई।
  num.twenty:
    label: द्विगुण
    summary: '''20'', बचन संख्या ; भेड़फऱ संख्या – द्विशष्ठ , रोमन चिह्न –xx'
    info: |-
