lang: vi
pivot: false
title: Số từ 1 đến 10
cards:
  num.eight:
    label: tám
    summary: Số 8, bạch tuộc có tám cánh tay.
    info: Tám là số thứ tự 2³ (hai mũ ba). Hình tám quay ngược lại (∞) là biểu tượng của vô cùng; trong văn hóa Trung Quốc, tám được coi là con số may mắn nhất.
  num.five:
    label: năm
    summary: Số năm, số ngón tay trên một bàn tay.
    info: Con số năm là cơ sở của hệ thập phân vì con người có năm ngón tay ở mỗi bàn tay. Hành tinh Kim Tinh vẽ nên ngôi sao năm cánh trên bầu trời.
  num.four:
    label: bốn
    summary: Số 4, hình vuông có bốn cạnh.
    info: Bốn là bình phương của hai – kết quả của phép nhân 2 × 2. Trong văn hóa Nhật Bản và Trung Quốc, số này được coi là không may mắn (âm thanh của từ 'bốn' tương tự với từ 'chết').
  num.nine:
    label: chín
    summary: Số 9, số có một chữ số cuối cùng.
    info: 'Chín là con số cao nhất trong các số có một chữ số. Một đặc điểm đáng chú ý: bất kỳ số nào nhân với chín thì tổng các chữ số của kết quả luôn chia hết cho chín.'
  num.one:
    label: một
    summary: Số 1, số tự nhiên đầu tiên.
    info: Một là con số nhỏ nhất trong các số tự nhiên. Khi nhân một số bất kỳ với một thì giá trị của số đó không thay đổi; vì lý do này mà người ta gọi nó là "phần tử trung lập của phép nhân".
  num.seven:
    label: bảy
    summary: Con số 7, cầu vồng có bảy màu.
    info: Số bảy được coi là con số may mắn trong nhiều nền văn hóa. Cầu vồng có bảy màu, tuần lễ gồm bảy ngày và thế giới chia thành bảy châu lục.
  num.six:
    label: sáu
    summary: Số 6, tổ ong có các ô lục giác.
    info: Số sáu là 'số hoàn hảo' - tổng tất cả các ước số của nó bằng chính nó (1 + 2 + 3 = 6). Các hình dạng lục giác (hình sáu cạnh) là cách hiệu quả nhất để lát kín một mặt phẳng.
  num.ten:
    label: mười
    summary: Số 10, cơ số của hệ thập phân mà chúng ta sử dụng.
    info: Con số mười là nền tảng cho hệ thống số thập phân vì con người có tổng cộng mười ngón tay trên hai bàn tay. Số mười đã được dùng làm đơn vị tự nhiên để đếm từ thời cổ xưa.
  num.three:
    label: ba
    summary: Số 3, số nguyên tố lẻ đầu tiên.
    info: Con số ba được coi là con số ma thuật trong nhiều nền văn hóa - có những câu chuyện cổ tích về ba điều ước, tam giác có ba cạnh và ngày được chia thành ba phần.
  num.two:
    label: hai
    summary: Số 2, số nguyên tố chẵn duy nhất.
    info: Hai là số nguyên tố chẵn duy nhất và cơ số của hệ nhị phân (hệ hai), nền tảng hoạt động cho tất cả các máy tính.
