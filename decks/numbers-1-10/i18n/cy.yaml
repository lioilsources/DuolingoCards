lang: cy
pivot: false
title: Rhifau 1-10
cards:
  num.eight:
    label: Wyth
    summary: Rhif adref 8.
    info: Wyllt yw wyth yn gyfres rhifau ar gyfer grwpiaeth o wyrddyn nhymyl - mae'r unigedigaeth hwnny'n dod â'i gilydd i'ch credu ei bod hi'n ddwy-i-gyntaf (neithfur ddywedir 'dwwein'). Yn yr hen iaith Celtaidd roedd "wyn" hefyd yn cyfeirio at ryfedd.
  num.eighteen:
    label: Osmnad
    summary: Rhif cyson - Osmnad
    info: |-
      Mae'r rhif 18 yn nifer naturiol sydd wedi'r rhif 17 ac yna'n gynharach na'r rhif 19
      Y nod Rufeinig ar gyfer hwn yw 'XVII'
      Ganrif o ddau ddeg amrychir gan ochr i'ch chymesuret
  num.eleven:
    label: unecwrt
    summary: Cyfriniad 11
    info: |-
      Mae'r rhif 11 yn nifer naturiol sydd ar ôl y ddeg ac yn gynharach na dwflyd
      Y ffigwr Rhufeinig: XI
      Rhifynad cysonol: unecwrtwyth
  num.fifteen:
    label: pymtheg
    summary: Rhif sylfaen - Pumeddau
    info: |-
      Mae'r rhif 15 yn nifer naturiol sydd wedi'r rhif 14 ac ynddo i gynhyrchu'r rhif 16
      Y nod Rufeinig ar gyfer hwnnywch yw 'XV'.
      Pentriodol dilynwch chi'ch enw "pedwar".
  num.fifty:
    label: pedesat
    summary: Rhif naturiol - pedesat
    info: |-
      Mynegir y rhif 50 yn nwyddorol ar ôl'r rhif 49 ac o fewn i'r rhif 51
      Y nod Rufeinig ddywethau amdanyno yw 'L'.
      Pentri'ch fel deg poblog:
      pedesat.
  num.five:
    label: chweil
    summary: Rhif adrefydd - Chweil
    info: Mae'r rhif pump yn gwneud y sylfaen ar gyfer system degol oherwydd mae pobl â phump cymeriad dros dro i'w llaw chwaith ac unigolyn Veneryn sy'n creu gilydd penfenthyr ar yr elod.
  num.forty:
    label: pedwareg
    summary: Rhifiwlaeth - Pedwareg
    info: Mynegir y rhif arau'r saith ddeg yn nifer naturiol sydd wedi'r triant naw ac o fewn i'ch pedwarant un.
  num.forty_eight:
    label: pedwarau ochr
    summary: Rhifydor cyson - pedwarau ochr
    info: |-
      Mynegir y rhif 48 yn nwydd naturiol ar ôl yr unigedd 47 ac yn gynharach na'r degfed 49
      Y nodiant Rhufeinig ddaethodol o'n enw ei hun: XLVIIIXLVIILXIVIILXXIVIILXXXIVIILXXXXIVIILXXXXXXXXIVIILXXXXXXXXXIIV
  num.forty_five:
    label: pedwaredeg
    summary: Rhif sylfaenol - Pedwaredeg
    info: Mae'r rhif 45 yn nifer naturiol sydd ar ôl y rhif 44 ac o fewn i'w gilydd gan yr unigyn nhilodwyd fel 'XLV'. Mae'n cynrychioli pedwar deg am danymhenydd â phump.
  num.forty_four:
    label: '"Tair pedwar"'
    summary: '''Tair Pedwar''; Rhifolrwydd: Tredfedd Duglydd'
    info: Mynegir y rhif arau'r saith yn gilydd fel "pedwar ddeg" ac mae'n dod wedi'r unig rheniant i'ch hun o dan yr enw 'Pedwareg'.
  num.forty_nine:
    label: pedwared chwe
    summary: Rhif sylfaen - pedwareg hwyth
    info: Mynegir y rhif fel 'chweil ar ddeg pedwar' yn yr unigol fathemau'r cyfanrif sydd wedi'u gosod o dan nhymorau Llynges Rhufeinig.
  num.forty_one:
    label: pedwar deg am byth
    summary: Rhifydorau pedwaredeg am byth
    info: Mynegai'r rhif ar y nodyn yn naturiol sydd wedi'r rhif 40 ac cyn yr unigedd canlynol - 42.
  num.forty_seven:
    label: pedwar deg saith
    summary: Rhifydor 47
    info: Mae'r rhif 47 yn nifer naturiol sydd ar ôl y rhif 46 ac o fewn i'w gilydd gan yr unigolyn.
  num.forty_six:
    label: pedwar deg chwe
    summary: Rhif sylfaenol - pedwar ddeg chwep
    info: |-
      Mae'r rhif 46 yn nifer naturiol sydd ar ôl y rhif 45 ac cyn y rhif 47
      Y nod Rufeinig: XLVI.
  num.forty_three:
    label: pedwaretri
    summary: Rhifiadol 43; rhesydrol - pedwaret tiwm; Rhymiannatwy - XLIII
    info: "Mynegir y rhif fel 'tri ar ddeg pedwar' yn yr unigol naturiol wedi'r rhifau 42 ac o fewr 44\nY nodiant Rhymganiadwy: XLIII \nPryd ei ysgrifo mewn system dechlynnaeth ddysgwylwyr fe fyddai'n dod â tri i fyny am dan deg pedwr"
  num.forty_two:
    label: pedwar deg dau
    summary: Rhifiwch pedwardeg dau
    info: Mynegir y rhif arau fel "XLII" yn yr unigol Romanaidd.
  num.four:
    label: pedwar
    summary: Rhif pedwar; cwadrat sy'n amryw â phedair ochr.
    info: Pedwar yw cwarel dau - adrodd o'r cyfrifiad 2 x 2. Ym Mhorwyntiaeth ac yn Tsieinaeth mae wedyn ei chael yn rhif anheifeiddiol (maen yr enw dda allai ddod ag "marwolaeth").
  num.fourteen:
    label: pedwar deg
    summary: Rhif sylfaenol - pedwardeg
    info: |-
      Mae'r rhif 14 yn nifer naturiol sydd ar ôl y rhif 13 ac cyn yr unigedd 15
      Y nod Rufeinig drosoedd ei enw: XIV
  num.nine:
    label: naich
    summary: Rhif Naw - Y gilym pen terfnes.
    info: Nwyth yw'r rhif uchaf un-digidol yn yr arferiad Rhifydd Cymraeg. Priodeth ddiddorfol o dan nhymes hwnny yw bod unrhyw rif wedi ei luosi â naw e'n gyson i'nhewni cyfanswm digidau sydd heb fod yn rhanedig naith.
  num.nineteen:
    label: unawythdeg
    summary: Unawythdeg
    info: Rhif y nymroddiad ar gyfer rhwng un deg ac wyth deg yn gynyrol
  num.one:
    label: un
    summary: Rhif Un - Yn gwest Gwenllyn Naturiol
    info: Unau yw rhif cyson ar gyfer un o'r fathion naturiol agorafol iawn. Nes yn amryddio unrhywbeth pan roedden nhymchyd â hyny'n cael ei luosi dros hyd at ein tŷr.
  num.seven:
    label: sept
    summary: Gysonrhif sain 7
    info: '{"info":"Mae Seddi yn cael ei ystyried yn rhif ddaethig yn nifer o filwyr. Mae''r prydwydd wedi dod â phlyg hefyd ar bum rybodau ac mae tywyllion yr wythnos yn eu cyfansymudiadau","label":"sedi","summary":"Rhif 7"}'
  num.seventeen:
    label: Sednaeth
    summary: 'Cyfrifiwr 17; sednaeth: dyfodwyd yn XVII'
    info: "Mae'r rhif 17 yn nifer naturiol sydd ar ôl y rhif 16 ac yn gynharach na'r rhif 18\nY nod Rufeinig: XVII \nRhifyngau cysonol: sylwch chi dros Sedwnaeth\nGanrifir mewn system dechnog fel 7+10"
  num.six:
    label: šešt
    summary: Rhif chwech; cymeslin waelodfed o fathffridd hefyd.
    info: '"Chwech" yw''r rhif "perfekt", gan fod cyfanswm ei ddilynwyr yn gyfartal i''w hun (1 + 2 + 3 = 6). Furfiau hexagonal sydd mewn ffatriau gwyddfod arbenigol.'
  num.sixteen:
    label: seithndec
    summary: Rhif cysonol - Seithndec
    info: Mae'r rhif 16 yn nifer naturiol sydd ar ôl y rhif 15 ac o fewn i'w gilydd gan yr unigyn nhwyro'n dilyn ei chymaint.
  num.ten:
    label: deng
    summary: Rhif 10 - sylfaen ein sistema rhifedd degol.
    info: Mae rhif ddeg yn gydran ar gyfer y system degol oherwydd mae pobl yn dod â phlym dechrwynnau'r llaw i'nhw nhwi'n gafel. Mae tethi'n mesur naturiol ar gyfer cyfrifo ers hynny.
  num.thirteen:
    label: trydedig
    summary: Gyfreithrifau - Trydedig
    info: |-
      Rhif 13 yw'r rhif naturiol ar ôl i 12 ac yn gynharach na 14
      Y cyfrifer Rufeiniaf: XIII
      Cyflwr penrhagol: tryd-degfed
  num.thirty:
    label: trêth
    summary: Rhif cyson - trêth
    info: Mae'r rhif 30 yn nifer naturiol sydd ar ôl y rhif 29 ac cyn y rhif 31. Mae ei nodiant Rhymegyn yn XXX.
  num.thirty_eight:
    label: ddeg o checht
    summary: Rhifynadur ddeg-o-checht
    info: |-
      Mae'r rhif 38 yn nifer naturiol sydd ar ôl y rhif 37 ac cyn y rhif 39
      Y nod Rufeinigyneddol: XXXVIII
  num.thirty_five:
    label: dair deg pump
    summary: Cyfriniaethau Rhifiadol - Cyfreithlonwch Dwylyg
    info: |-
      Mae'r rhif 35 yn nifer naturiol sydd ar ôl y rhif 34 ac cyn y rhif 36
      Y nod Rufeinigyneddol: XXXV
      Rhifydd cysoniant: chwechgarth drosumgrain
      Ganrifir mewn system dechnog fel 5 + 30.
  num.thirty_four:
    label: pedwar deg
    summary: Rhifynadur - pedwar teg
    info: |-
      Mae'r rhif 34 yn nifer naturiol sydd ar ôl y rhif 33 ac cyn yr unigedd 35
      Y nod Rufeinigynol:
      XXXIV Mae'n cymeriad penrhag o dan gyfrifiadau mathemateg cymhlyngedig ond mewn systemau diwydiannol.
  num.thirty_nine:
    label: trêth deg naw
    summary: Rhif sylfaen gyda gwerth o danymwythyd trêthdeg naw
    info: |-
      Mae'r rhif 39 yn nifer naturiol sydd ar ôl y rhif 38 ac cyn y rhif 40
      Y nod Rufeinigyneddol: XXXIX.
  num.thirty_one:
    label: trêth un
    summary: Rhif sylfaenol - trŷd-un
    info: Mae'r rhif 31 yn nifer naturiol sydd ar ôl y rhif 30 ac cyn y rhif 32. Mae'n cael ei ysgrifenu fel XXLI mewn cyfrifiannau Rhufeinig.
  num.thirty_seven:
    label: triyddeg saith
    summary: Rhifynadur 37
    info: Mae'r rhif 37 yn nifer naturiol sydd ar ôl y rhif 36 ac o fewn i'w gilydd gan yr unigyn nhriant roedd wedi'i ddisgrifi'n gynt.
  num.thirty_six:
    label: chweithddeg
    summary: Cyfriniw 36
    info: |-
      Mae'r rhif 36 yn nifer naturiol sydd ar ôl y rhif 35 ac yn gynharach na'r rhif 37
      Y nod Rufeinig: XXXVI
      Rhifydd cysonol: chweched degfed
  num.thirty_three:
    label: Trêth Deg
    summary: Rhifiwr 33 - Ordinal Trêth Deg / Rhagfyr XXII
    info: |-
      Mae'r rhif 33 yn nifer naturiol sydd ar ôl y rhif 32 ac cyn y rhif 34
      Y nod Rufeinig: XXXIII
      Rhifydd ordinal: trêth degfed
      Ganrifir fel 'trî' mewn system dechrebol
  num.thirty_two:
    label: ddeg un
    summary: Rhifynadur 32
    info: |-
      Mae'r rhif 32 yn nifer naturiol sydd ar ôl y rhif 31 ac cyn y rhif 33
      Y nod Rufeinigyneddol:
      XXXII.
  num.three:
    label: tri
    summary: Rhifau cardinaidd 3 neu'r gyntaf nodweddig
    info: Mae tri chweil yn cael ei ystyried fel rhif anaml yn nifer o filwyr - maes gwendodydd am dri phrydroniad sy'n bodoli hefyd gan ddynion trêthol i'nhirio'r unigolyn; cyrch arbenigedig â thri ochr ac edraith dydd weddiadwy danymeddu'r trolynydd.
  num.twelve:
    label: dwdu
    summary: Gofnodir dwudwg fel 'XII'; cyfrinair penaethol - dwdu
    info: Rhif 12 yw'r rhif naturiol ar ôl i'ch dod â phwynt yn gynharach na thrêr ac yn cynhyrchu'n gyson atebion newydd.
  num.twenty:
    label: duglyth
    summary: Y cyfrinachau numerus - dwy flynth
    info: Rhif naturiol yw'r rhif 20 yn dilyn ar ôl yr unigynrhydd 19 ac yn dod blaen i'ch gilydd â phwyntiau o fewnol.
  num.twenty_eight:
    label: dwyrlyn
    summary: Y Rhifiwr dwur lyn
    info: Rhif naturiol yw'r rhif 28 yn dilyn ar ôl yr unigyn nhwyth ac yn dod blaen i'ch wythnos nawfed.
  num.twenty_five:
    label: dwyrlyn
    summary: Gwerthoedi numerikiol o dan 25
    info: Rhif naturiol yw'r rhif 25 yn dilyn ar ôl yr unigyn nhwyd nesaf ac roedd wedi'i nodi'n rym Ladin fel 'XXV'. Mae ei enghreifftiau eraill gan gynnwys dwy deg ambydrithiant i'ch chweilf.
  num.twenty_four:
    label: dwyr-deugain
    summary: Gwerthoedd numerikiol - Dwur-deugain
    info: "Rhif naturiol yw'r rhif ddeg ar ôl dwy-dwyddr ac yn gynharach na tri-gochdau\nY nifer Rhufeinig o'n gydran \nDewrchwch i'ch cyfrifiadau fel pedwar mewn deg"
  num.twenty_nine:
    label: dwethfed degfed
    summary: Gofrestru gyfreithlonrhif 29
    info: "Rhif 29 yw'r rhif naturiol ar ôl i'ch fe 28 ac yn gynharach na chyfansawdau 30\nY cyfrinwg Rhodriannol: XXIX \nCyfresnodwyddo: dwethfed degfed"
  num.twenty_one:
    label: un deg am byth
    summary: Rymau numerikiol - dwydecim wyth
    info: |-
      Rhif naturiol yw'r rhif 21 yn dilyn ar ôl yr unigyn nhwyd nesaf ac yn gadael hyd at 22
      Y ffigwr Rhomaidd i'ch nodi hwnny ydy 'XXI'.
      Prynhawn chi ei alwan fel "dwicat pyth" os o hefydd.
  num.twenty_seven:
    label: dwydh
    summary: Rhif cyson - dwydh
    info: |-
      Mae'r rhif 27 yn nifer naturiol sydd wedi'r rhif 26 ac yna'n gynharach na'r rhif 28
      Y nod Rufeinig ar gyfer hwn yw 'XXVII'.
      Dyma'ch ffigwr dilynwyr "dwethfed".
  num.twenty_six:
    label: dwyrlyn
    summary: Rhifiwr dros dro dwy ragun
    info: Mae'r rhif 26 yn nifer naturiol sydd ar ôl y rhif 25 ac o fewn i'w gilydd gan yr unigyn nhwyth nos.
  num.twenty_three:
    label: dwythriw
    summary: Cyfriniwr 23
    info: "Mae'r rhif 23 yn nifer naturiol sydd ar ôl y rhif 22 ac cyn y rhif 24\nY nod Rufeinigyn: XXIII \nRhifydd cysonol: dwydegfed trydydd"
  num.twenty_two:
    label: dwydec dau
    summary: Gysonrhif 22
    info: Rhif naturiol yw'r rhif 22 yn gomyn â'r unigolion nesaf - ar ôl 21 ac o fewn iawn at 23.
  num.two:
    label: dwyr
    summary: Rhif cyson dau
    info: Mae Dau yn y rhif unigol sydd gan gyfrifiaduron ar eu gwahanu'r system binar nodweddiadol o dan ei gilydd.
