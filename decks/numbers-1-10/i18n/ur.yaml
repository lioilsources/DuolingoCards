lang: ur
pivot: false
title: عدد ١ سے ٥٠ تک
cards:
  num.eight:
    label: آٹھ
    summary: عدد 8، آٹھ اسکنور والی سمندری کرکٹ۔
    info: آٹھ 2³ (دو کا توانہٗ تیسرے) ہوتا ہے۔ موڑا گیا آٹھ (∞) ناممکن کا علامت ہے؛ چینی ثقافت میں آٹھ بالعموم سب سے زیادہ خوش فہم عدد ہے۔
  num.eighteen:
    label: اوسمناخت
    summary: '''آؤمناٹ'' نمبر 18؛ درجہ وار: اوسمناخت؛ روایتی شمار: XIII.'
    info: عددٔ اکیسہ، جو کہ عددِ سترھ کے بعد آتا ہے۔ رومانی تحریر میں 'XVII' لکھا جاتا ہے۔ دسوائی نظام میں ۸+۱۰ کے طور پر رقم چودہ بطور حوالہ موجود ہوتا ہے۔
  num.eleven:
    label: ایک سولہواں
    summary: اعداد و شمار میں 'XI' لکھا جاتا ہے
    info: عدد ایک سو دس کے بعد آتا ہے۔ رومانی عدد فارم میں، گھنٹا علامت XII استعمال ہوتا ہے۔
  num.fifteen:
    label: چودہ
    summary: 'شمارندہ 15؛ درجہ وار: چودهواں؛ رومانی زبان میں: XV'
    info: عدد پندرہ عدد سے اور نو کی تعداد میں آتا ہے۔ رومانی انداز میں لکھا جاتا ہے 'XV'، درجہ وار شمارندگی 'پندرم'. دسوال نظام میں 5+10 کے طور پر رقم بطور رقم لکھا جاسکتای.
  num.fifty:
    label: پچاس
    summary: 'عدد 50؛ صفت شماری: پچواں؛ علامۃ الرمانيّة: L'
    info: عدد پچاس ایک قدرتی عدد ہے جو نمبر ٤٩ کے بعد آتا ہے اور نمبر ۵۱ سے قبل۔ رومانی تعداد میں یہ 'L' لکھا جاتا ہے۔ دسوائس نظام میں، یہ 50 کے طور پر درج کیا جاتا ہے۔
  num.five:
    label: پانچ
    summary: عدد 5، انسان کے ہاتھ میں پانچ انگلیاں ہوتی ہیں۔
    info: دسویں عددی نظام کی بنیاد پانچ ہے کیونکہ لوگوں کے ہر ہاتھ میں پانچ انگلیاں ہوتی ہیں۔ سیارہ عطارد آسمان پر پانچ نکلا تار کا نقشہ بنا رہا ہے۔
  num.forty:
    label: چالیس
    summary: 'اعدادوشمار ۴۰؛ ترتب فراہم کرنے والا: چالیسویاں؛ رومی انداز میں: XL'
    info: 'عدد ایک سو بچھان کے بعد آتا ہے۔ رومن نمبر: XL، ترتیب دینے والی عدد و شمار: چالیسواں۔'
  num.forty_eight:
    label: چارلسات
    summary: 'اعداد و شمار 48؛ درجۂ نسبت: چالیسواں اور ایک؛ رومانی علامت: XLVIII'
    info: عددٔ چالیس اُٹھائے کوئن، عددِ طبعی ہے جو ساڑاسول کے بعد آتا ہے۔ رومانی تحریر میں 'XLVIII' لکھتے ہیں۔ دسویں نظام حساب میں یہ ’۸+۴۰‘ کے برابر ہوتا ہے۔
  num.forty_five:
    label: چارلس ون
    summary: 'شمارندہ 45؛ سرکردہ: چودُواں؛ رومی زبان میں: XLV'
    info: 'عددٔ عربی چالیس پانچ، عددِ فطری اور بعد میں آنے والا نمبر ۴۶ کے قبل۔ رومی تحریر: XLV۔ سرکردہ شمارندہ: چوّدھواں۔ دسوائی نظام میں لکھنا گزر جاتا ہے 5+40 کے طور پر۔'
  num.forty_four:
    label: چالیس تین
    summary: 'عددِ اصلي ۴۴؛ درجۂ شماري: چاليسويں تينواں؛ رُمانى زبان ديلا:XLI'
    info: عددٔ عادی چالیس تھر، عددِ اصلی ساٹائنتے کمپو نمبر ۴۳ د‏‏ی جگہ توں آنداس۔ رومانی انداز وچ لکھن والا XLIV ا‍। مسلّت نظام وچ ۱۰ رقم حسابات وچ ۲+۶=۸ طور پر لکھنا ضروار ا‍۔
  num.forty_nine:
    label: نوے اور چالیس کا مجموعہ
    summary: '''نُوے اور چالیس کا مجموعہ''؛ تسلسل والی رقم: ''XXXI IX'';'
    info: 'عددٔ نوے اور چالیس کا مجموعہ، عددِ تقرار سولہ۔ رومی شمارکر: XXXXIIIII جبکه عربی حروف استعمال کرتے تو اسے ''XLIX'' لکھتے ہیں۔'
  num.forty_one:
    label: ایک سو
    summary: 'اعداد و شمار ۴١؛ ترتیبی: چالیسواں پہلا؛ رومی طرز: XL'
    info: عدد ایک سو اور عدد دوسروں کے درمیان قدرتی نمبر، جس میں تقریباً پچاس بارہ شامل ہوتا ہے۔ رومن رقم XLII لکھنا ضروری ہے۔
  num.forty_seven:
    label: چودہ ستر
    summary: 'اعداد ۴۷؛ درجہ وار: چورده سترام؛ رومانی: XLVII'
    info: 'عددِ اکتال کے مطابق عددٔ عادی، ساٹھ تین بعد والی رقم۔ رومانی نمائندہ حروف XLVII۔ درجہ وار شمارش: چوّدُواں ساتواں۔ دس کی بنیاد پر لکھنے والا 7+40۔'
  num.forty_six:
    label: چارلس شست
    summary: '''چارلس شست'' عدداً 46؛ صفت: چارلث شستم؛ رومانی حروف: XLVI'
    info: عددٔ چالیس سے تین، اردو میں عددِ ۴۶ کو 'چوالیس' لکھا جاتا ہے۔ رومن نمبر نظام میں یہ XLVI بطور رقم درج ہوتا ہے۔ دسوائی پروٹول میں یہ 6+40 کے طور پر ظاہر ہوسکتا ہے۔
  num.forty_three:
    label: چالیس تین
    summary: 'اعداد و شمار 43؛ سلسلہ وار: چالیسواں تیجرا؛ رُمزی: XLIII'
    info: عددٔ عربی چالیس تین اور پندرہ کے درمیان آتا ھو۔ رومی عدد فارموں میں 'XLIII' لکھا جاتا ہے۔ دسوائی نظام میں، یہ ۳+۴۰ کے طور پر ظاہر ہوتا ہے۔
  num.forty_two:
    label: چالیس دو
    summary: 'شمارکنندہ ۴۲؛ درجہ وار: چالیسویں دوسرا؛ رومانی: XLII'
    info: |-
      عددِ اربعٰی دو، عددِ فطرت ہے جس کا پچاس سے قبل تیندراں نمبر ہوتا ہے۔ رومانی رقم: XLII۔ درجہ وار شمارکردگی: چالیسواں دوسرو
      عشر مبنی نظام لفظي طور پر 'دو' اور 'сорок' کے ذريعيه ظاهر کرتا ہے۔
  num.four:
    label: چار
    summary: عدد 4، ایک سربن کا چار طرف ہوتے ہیں۔
    info: چار دو کا مربع ہے - 2 × 2 کا نتیجہ ہے۔ جاپانی اور چینی ثقافت میں یہ بدقسمتی کا عدد تصور کیا جاتا ہے (اس کی آواز 'موت' لفظ کے قریب ہے)۔
  num.fourteen:
    label: چودہ
    summary: '''14'' نمبر؛ تسلسل ونٹر: چورواݨو؛ رومن ساختہ: XIV'
    info: عددٔ چارہویں اکتالیس کے بعد آتا ھِئ۔ رومانی عدد XVI لکھا جاتا هے، ترتیب دین والی صفت مثلاً 'چوتھائی' بولا جاتا ہے۔
  num.nine:
    label: نو
    summary: عدد نو، آخری اکلختہ عدد۔
    info: 'نو سب سے بڑا اک لختہ عدد ہے۔ دلچسپ خصوصیت: نو کے ساتھ ضرب شدہ کسی بھی عدد کا جمع حاصل رقم ہمیشہ نو سے قابل تقسیم ہوتا ہے۔'
  num.nineteen:
    label: نوہ
    summary: 'تعداد: ۱۹؛ ترتب: دسویں؛ رومانی: XIX'
    info: 'عددٔ نوہ سترہ کے بعد اور عیسی ون کے قبل آتا ہے۔ رومانی عدد: XIX، ترتیبی عدد: دسویں۔ دسمال نظام میں چھ ماخذ لکھا جاتا ہے۔'
  num.one:
    label: ایک
    summary: عدد ١، پہلا قدرتی عدد۔
    info: ایک سب سے چھوٹا قدرتی عدد ہے۔ کسی بھی عدد کو ایک سے ضرب دینے پر وہ عدد تبدیل نہیں ہوتا؛ اس لئے اسے 'ضرب کا متعادل عنصر' کہا جاتا ہے۔
  num.seven:
    label: سات
    summary: عدد سات، جتنا رنگ اُفق میں ہوتے ہیں۔
    info: سات کو بہت سی ثقافتوں میں خوش قسمتی کا نمبر سمجھا جاتا ہے۔ اُفق میں سات رنگ ہوتے ہیں، ایک ہفتہ میں سات دن ہوتے ہیں اور زمین کے سات حصے موجود ہیں۔
  num.seventeen:
    label: سولہ
    summary: '''سولہ''؛ درجہ وار: ''سولہواں''; رومن: ''XVII'''
    info: عدد سولہ کے بعد اور عدد آٹھاروں کے قبل قریب پانچتیرہ نمبر ہوتا ہے۔ رومن تعداد میں اسے 'XVII' لکھا جاتا ہے، درجہ وار شمارندگی 'پانچواں' ہوتی ہے۔ دسوال بستر نظام میں یہ 7+10 کے طور پر رقم ہوجائے گا۔
  num.six:
    label: چھ
    summary: عدد ٦، مکمل شکل کی عمارت ہے۔
    info: چھ ایک 'مکمل عدد' ہے - جو تمام تقسیم کنندگان (1 + 2 + 3 = 6) کا مجموعہ ہوتا ہے۔ چھ سطحی (چھ کونائی) شکلوں سے فرش لگانا سب سے زیادہ موثر طریقہ ہے۔
  num.sixteen:
    label: سولہ
    summary: '''شمارنداً'': 16؛ ''درجہ وار'': سولہواں؛ ''روم '': XVI'
    info: عددٔ ۱۶ عددِ فطری ہے جو کم ازکم ۱۵ سے پہلے آتا ہے۔ رومانی تحریر میں 'XVI' لکھا جاتا ہے، درجہ وار شمارندگی میں 'سولہواں'۔ دسوال نظام میں چھ ماخذ ۱۰ کے طور پر براجمان ہوتا ہے۔
  num.ten:
    label: دس
    summary: عدد ١٠، ہماری دسائیک عددی نظام کا بنیادی اصول۔
    info: دس اعداد و شمار کے دسائیک نظام کا مبنی ہے کیونکہ لوگوں کے ہاتھوں پر بالعموم دس انگلیاں ہوتی ہیں۔ دس قدیم زمانہ سے گننا میں استعمال ہوتا رہا ہے۔
  num.thirteen:
    label: تیرہ
    summary: 'اعداد و شمار 13؛ درجہ: تیرہواں؛ رومی زبان: XIII'
    info: عدد تیرہ عدد دوئیں کے بعد اور سولہ کے قبل آتا ہے۔ رومی نمبر نظام میں، چودہ لکھا جاتا ہے۔ درج ذیل براڈنگ فارمولا کے طور پر رقم ١۳ وانس کے علاقوں میں شامل ہوتا ہے۔
  num.thirty:
    label: تریسون
    summary: 'شمارندگي ۳۰؛ درجاتي: تئيسرا؛ روماني: XXX'
    info: 'عددٗ تھریسون اُوَّل عددِ نوزن کے بعد، جبکہ عددِ ساݢال کے پہلو ميں آيندې۔ روماني علامت: XXX۔ درجاتي شمارندگي: تئيسرو۔ دسوائى نظام وچ لکھيا جاندا هے ۳۰ کمثوب。'
  num.thirty_eight:
    label: ترِسٹھ دوسرو
    summary: 'تعداد ۳۸؛ درجہ بندی: ترسْط دوسرو'
    info: عددٗ تیسرا اُچّوں بعد آندے وار عددٗ، جنہا کرمارک سانگت رومین نشان XXXVIII لَکھلا جاتا۔
  num.thirty_five:
    label: ترسو خام
    summary: 'عددٗ ۳۵؛ درجات والا: ترسو ممدوخ؛ رومی زبان تو: XXXV'
    info: 'عددٗ تھریسٹ پائے کوئن، عددِ طبیعی اُچل جاندہ ۳۴ سندکاں بعد آؤندلا۔ رومی شمارکار: XXXV۔ درجات والا لفظ: تیرسو ممدوخ۔ دستمل نظام تو اسن نقلش گهتّي ۵+۳۰۔'
  num.thirty_four:
    label: تینتالیس
    summary: 'اعداد شمار ۳۴؛ درجۂ حروف: تیریسویں'
    info: عددٗ تیس لے کر چار، عددِ اصلی ہَن۔ رومانوی نشان XXI سب توں پہلے آندا هئي جونکھݨ مختصر طور تے 'تیریس' وی کمّدتا ہُندا ا‏ ه‍ ‌‪‬۔
  num.thirty_nine:
    label: ترچالیس
    summary: 'شمارندہ عددٗ 39؛ رتبہ: تئیسویں؛ رومن زبان: XXXIX'
    info: |-
      عددٗ تِسْتَوُن اور ساٹھ کے درمیان واقع عددٗ نہائیں، جو قدر میں بارہوا۔
      رومن شمارندگی: XXXIX
      ترتیب دیند‏ غرض: تئیسویں。
      decimal نظام توّ لکھݨ دا طریقہ ۹+۳۰
  num.thirty_one:
    label: ترچَّت وݨ
    summary: 'عددٗ ۳۱؛ درجۂ: تُرچَّت وݩم؛ رومانی: XXXI'
    info: 'عددٗ ۳۱ عددِ ۳۰ کے بعد اور عددِ ۳۲ سے پہلے آنے والی طبیعی تعداد ھئي۔ رومانی علامت: XXXI، جو ''اکسٹر'' لفظ مطابق حوالات دشوارگزار براجمان ھوندې۔'
  num.thirty_seven:
    label: تئيرتاليس
    summary: 'رقم ۳۷؛ رتبہ وار: تئيروتاليثرا؛ لمبا: XXXVII'
    info: 'عددٗ تھیسُواں عددِ طبیعی اے جوکہ ساٹّھ کر دن بچاند‏، معمولی نشان: XXXVII۔ رتبہ وار رقم: تئیرتالیسرا۔ عادی نظام میں لکھݨ والا صورت پنج ماخذ حسب ذیل اضافہ'
  num.thirty_six:
    label: تریسوندہ
    summary: 'تعداد ۱۲؛ شمارش: تیریسوندہ ؛ رومي زبان : XXI'
    info: عددٗ تھریسوندہ سے اور عددٗ تئّینتالیس کے درمِان مَوجود ہو۔ رومن نمبر نظام تو اُچا لفظ XXXVI آتا حَیث۔ دسوائی جمع وجدات نظام تو '۶' اور ’۳’، دونوں رقم شامل کروݨ والا طرزوآبادکاری اختیار کيتا جندى هيا
  num.thirty_three:
    label: تری انڈ تئیرنتی
    summary: '''تعدادی عدد'': تری انڈ تئيرينتي؛ درجہ وار: تيسيرو؛ روماني علامات: XXXIII'
    info: '"تعدادی عدد" تھری اینڈ تئیرنٹی، جو کہ نمبر ۳۲ سے بعد آتا ہے۔ رومانی حروف میں ''XXXIII'' لکھا جاتا ہے۔ دسائی نظام میں یہ ’٣‘ اور ’٣٠’ کے برابر ہوتا ہے۔'
  num.thirty_two:
    label: تیس دو
    summary: 'عددٗ 32؛ درجن والا: تيرسو مسلّماً؛ روماني: XXXII'
    info: عددٗ تیس دو اک قدرتِي عددٖ اے جوءَ کردوئں لاءُ بارہواں نمبر تو‏ں بعد آندا اے۔ رومانی سبجھن وچ ’XXXII‘، درجن والد فارمٹ وچ ’تیرسو مسلّماً‘، اور عادتاً دسمل نظام وچ ’۲ + ۳۰’ طرح رقميتاً لکھݨدا اے
  num.three:
    label: تین
    summary: عدد تین، پہلا جفت اور نمبر.
    info: تین کو بہت سی ثقافتوں میں جادوئی عدد سمجھا جاتا ہے - داستانوں میں تین خواہشیں ہوتی ہیں، مثلث میں تین اطراف ہوتی ہیں اور دن تین حصوں میں تقسیم ہوتا ہے۔
  num.twelve:
    label: دواونچ
    summary: 'عددٴ 12؛ درجہ وار: دواونچ؛ رومن حروف: XII'
    info: عددٔ دواونچ ایک قدرتی عدد ہے جو عددِ سولہ کے بعد آتا ہے۔ رومانی تحریر میں اسے 'XII' لکھا جاتا ہے، درجہ وار نام ’دواونچ‘ ہوتا ہے۔ دسوائی نظام میں یہ ’۲+۱۰‘ کے طور پر رقم گذاری کرتا ہے۔
  num.twenty:
    label: چودہویں
    summary: 'شمارندہ ۲۰؛ درجہ وار: بیسویں؛ رومانی: XX'
    info: عددٗ ۲۰ عددِ ۱۹ کے بعد اور عددِ ۲۱ سے پہلے آنے والا قدرتی نمبر ھے۔ رومانی تحریر میں 'XX' لکھا جاتا ہے، درجہ وار شمارندگی 'بیسویں' ہوتی ہے۔ دس کی بنیاد والی نظام تعدید میں ۲۰ رقم کے طور پر لکھا جائتا ہے۔
  num.twenty_eight:
    label: دوئوندرا
    summary: 'تعداد ۳؛ درجہ: دوئوندرو؛ رومانی: XXIX'
    info: عددٗ ۲۸ عددِ ۷ کے بعد اور عددِ ۹ سبکر آنے والی تعداد ہو۔ رومانی نمبر نظام میں، چودھواں بارہواں جس طرح لکھا جاتا ہے وہ 'XXIX' ہوتا ہے۔ دسوائی فارمٹ میں، ۱۰ کے مضاعف کے علاوہ ۶ کے حساب سے رقم بنایا جاسکتا ہے۔
  num.twenty_five:
    label: پونجوقیاسو
    summary: 'شمارندہ ۲۵؛ رُومانی تحریر: XXV'
    info: "عددٗ ۲۵ عددِ ۲۴ کے بعد اور عددِ ۲۶ سے پہلے آنے والا قدرتی نمبر ہ۔\nrُومانی تحریر میں یوں لکھا جاتا ہے: XXV\nترتیب دار شمارندگی: بیسویں، \ndسائمنٹل نظام میں ۱۰ کے حساب سے ۵+۲۰ کے طور پر رقم چالول کرتا ہ"
  num.twenty_four:
    label: دوائیس چار
    summary: 'شمارندݢا ۲۴؛ درجہ وار: دسوُم فرتّو؛ رومانی: XXIV'
    info: 'عددٗ ۲۴ عددِ ۱۳ کے بعد اور عددِ ۵۲ سے پہلے آنے والا قدرتی نمبر ھَي۔ رومانی تحریر میں ''XXIV'' لکھا جاتا ھَي۔ درجہ وار شمارندگی: دسوُم فرتّو، عادی حساب نظام میں چار زائد بیس کے طور پر رقمطراز ھوندی ھَي۔'
  num.twenty_nine:
    label: دوئیسواں
    summary: 'عددٗ ۲۹؛ ردمائش: دوئیسوؤں؛ رومانی: XXIX'
    info: عددٗ دوئیسواں نُما کرݨ والے عددِ اکتالیس تے ساڑاسی وچوالے، جنہ۔ رومانی عدداور مسلّم طور پر انگ بارہواں لفظي شکل مین XIX۔
  num.twenty_one:
    label: دوسری واحد
    summary: 'شمارندا چالیس ون؛ درجۂ حسابات: دوسرا واحد؛ رومانی: XXI'
    info: 'عددٗ عیسائی کے نمبر ۲۱، عددِ اصلی بوجہ سوئم تکرّار والی قدر۔ رومانی متناسب شمارندگی: ''XXI''۔ درجۂ حسابات: دسوُں پھلوا۔ دعوتِ جدولی نظام میں لکھا جاسکتا ہے ۱+۲۰ کے طور پر۔'
  num.twenty_seven:
    label: دوازده
    summary: 'عددٗ 27؛ درجہ وار: دوازدم؛ رومانی: XXVII'
    info: 'عددٗ دوئیں ساتھ اک ناطق عددِ‏ہے جس کا مطلب ’۲۶‘ تُمار بعد لَگن والّا عددِ‏ہے۔ رومانی شکل: ''XXVII''، درجہ وار فورمٹ: ‘دوسرادوازدہ’۔ عشاری نظام توں ادا کرݨ والا طریقہ ’سبْعۃ زائد إثناء العشري‘۔'
  num.twenty_six:
    label: چھُتَّیس
    summary: '''دوسرو بار چھ''؛ درجہ وار: چھتواسرا؛ رومانی حروف: XXVI'
    info: عددٔ ۲۶ عددِ طبیعیٰ ہے جو کم ازکم ۲۵ سے آگئے ہوتا ہے۔ رومن نمبر میں، چھُتّیس لفظ 'XXVI' استعمال ہوا تھا۔ دسوائی نظام میں، یہ ۱۹ پر مشتمل ہے۔
  num.twenty_three:
    label: ترانوي
    summary: 'اعداد 23؛ شمارش: ترانوي؛ رومين: XXIII'
    info: عددٗ ۲۳ عددِ اعشاریہ میں تیرانوے کے بعد آتا ھئي۔ رومن نمبر سسٹم میں ايسا لکھيا جاتا ھئي 'XXIII'، دسویں نظام فارغت وچ ݢ = 20 + 3 طور پر درج کيتا جائدا هَى۔
  num.twenty_two:
    label: دوازده
    summary: '''دوازده''; درجہ وار: ''دوئٹھ دوازده''; رومانوی: ''XXY'''
    info: عددٗ ۲۲ عددِ ۱ کے بعد اور عددِ ۳ سے پہلے آنے والا قدرتی عدد ھَي۔ رومانوی تحریر میں اسنو XXY لکھا جاتا ھى، درجہ وار فارم 'دوسرادوازده' ھى۔ دسوائی نظام میں اسنو 2+20 طرُق توّیندرا بݨدا ھى۔
  num.two:
    label: دو
    summary: عدد دو، واحد جفت اول عدد۔
    info: دُو جیسا کہ اکلوتے جفت پرائم نمبر ہے، یہ دودھارا (بائنری) نظام کی بنیاد بھی ہے، جس پر تمام کمپیوٹروں کا کام چل رہا ہے۔
