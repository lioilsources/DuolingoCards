lang: ur
pivot: false
title: عدد ١ سے ١٠ تک
cards:
  num.eight:
    label: آٹھ
    summary: عدد 8، آٹھ اسکنور والی سمندری کرکٹ۔
    info: آٹھ 2³ (دو کا توانہٗ تیسرے) ہوتا ہے۔ موڑا گیا آٹھ (∞) ناممکن کا علامت ہے؛ چینی ثقافت میں آٹھ بالعموم سب سے زیادہ خوش فہم عدد ہے۔
  num.five:
    label: پانچ
    summary: عدد 5، انسان کے ہاتھ میں پانچ انگلیاں ہوتی ہیں۔
    info: دسویں عددی نظام کی بنیاد پانچ ہے کیونکہ لوگوں کے ہر ہاتھ میں پانچ انگلیاں ہوتی ہیں۔ سیارہ عطارد آسمان پر پانچ نکلا تار کا نقشہ بنا رہا ہے۔
  num.four:
    label: چار
    summary: عدد 4، ایک سربن کا چار طرف ہوتے ہیں۔
    info: چار دو کا مربع ہے - 2 × 2 کا نتیجہ ہے۔ جاپانی اور چینی ثقافت میں یہ بدقسمتی کا عدد تصور کیا جاتا ہے (اس کی آواز 'موت' لفظ کے قریب ہے)۔
  num.nine:
    label: نو
    summary: عدد نو، آخری اکلختہ عدد۔
    info: 'نو سب سے بڑا اک لختہ عدد ہے۔ دلچسپ خصوصیت: نو کے ساتھ ضرب شدہ کسی بھی عدد کا جمع حاصل رقم ہمیشہ نو سے قابل تقسیم ہوتا ہے۔'
  num.one:
    label: ایک
    summary: عدد ١، پہلا قدرتی عدد۔
    info: ایک سب سے چھوٹا قدرتی عدد ہے۔ کسی بھی عدد کو ایک سے ضرب دینے پر وہ عدد تبدیل نہیں ہوتا؛ اس لئے اسے 'ضرب کا متعادل عنصر' کہا جاتا ہے۔
  num.seven:
    label: سات
    summary: عدد سات، جتنا رنگ اُفق میں ہوتے ہیں۔
    info: سات کو بہت سی ثقافتوں میں خوش قسمتی کا نمبر سمجھا جاتا ہے۔ اُفق میں سات رنگ ہوتے ہیں، ایک ہفتہ میں سات دن ہوتے ہیں اور زمین کے سات حصے موجود ہیں۔
  num.six:
    label: چھ
    summary: عدد ٦، مکمل شکل کی عمارت ہے۔
    info: چھ ایک 'مکمل عدد' ہے - جو تمام تقسیم کنندگان (1 + 2 + 3 = 6) کا مجموعہ ہوتا ہے۔ چھ سطحی (چھ کونائی) شکلوں سے فرش لگانا سب سے زیادہ موثر طریقہ ہے۔
  num.ten:
    label: دس
    summary: عدد ١٠، ہماری دسائیک عددی نظام کا بنیادی اصول۔
    info: دس اعداد و شمار کے دسائیک نظام کا مبنی ہے کیونکہ لوگوں کے ہاتھوں پر بالعموم دس انگلیاں ہوتی ہیں۔ دس قدیم زمانہ سے گننا میں استعمال ہوتا رہا ہے۔
  num.three:
    label: تین
    summary: عدد تین، پہلا جفت اور نمبر.
    info: تین کو بہت سی ثقافتوں میں جادوئی عدد سمجھا جاتا ہے - داستانوں میں تین خواہشیں ہوتی ہیں، مثلث میں تین اطراف ہوتی ہیں اور دن تین حصوں میں تقسیم ہوتا ہے۔
  num.two:
    label: دو
    summary: عدد دو، واحد جفت اول عدد۔
    info: دُو جیسا کہ اکلوتے جفت پرائم نمبر ہے، یہ دودھارا (بائنری) نظام کی بنیاد بھی ہے، جس پر تمام کمپیوٹروں کا کام چل رہا ہے۔
