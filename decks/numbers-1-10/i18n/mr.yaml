title: संख्या १-१०
cards:
  num.eight:
    label: आठ
    summary: संख्या 8, एक मासेरी आठ पाठीला असते.
    info: आठ ही संख्या २³ (दोनची तिसरी घात) आहे. उलट केलेली आठ (∞) हा अपरिमिततेचा संकेत आहे; बुद्धवादी संस्कृतीमध्ये आठ ही सर्वात शुभ संख्या मानली जाते.
  num.five:
    label: पाच
    summary: संख्या ५, ही संख्या आमच्या हातावर प्रत्येकाला असलेल्या बोटांची मापने करते.
    info: दहाने पधडीवर आधारित संख्या प्रणाळीचा आधार पाच आहे, कारण माणूस प्रत्येक हातावर पाच बोटे धारण करतो. शुक्र ग्रह आकाशावर पाच टोकांचा तारका ओळखतो.
  num.four:
    label: चार
    summary: संख्या ४, चोरदी पासेला चार बाजु असतात.
    info: चार हे दोनचे वर्ग आहे - २ × २ मिळवल्यामुळे होते. जपानी आणि चीनी संस्कृतीमध्ये हे खूबशा संख्या मानले जाते (कारण इथे 'मृत्यू' शब्दाच्या ध्वनीला त्याच्या संख्येच्या ध्वनीसारखे ऐकून येते).
  num.nine:
    label: नऊ
    summary: संख्या 9, शेवटची एकअंकी संख्या.
    info: नऊ हे अकरापैकी उपलब्ध जास्तीत जास्त एकअंकी संख्या आहे. मजेची गोष्ट म्हणजे कोणतीही संख्या नऊने गुणली गेली तर तिची अंकांची बेरीज नऊने भाग जाते.
  num.one:
    label: एक
    summary: संख्या १, प्रथम स्वाभाविक संख्या.
    info: एक ही लहान स्वाभाविक संख्या आहे. कोणतीही संख्या एकाने गुणल्यास तीच मिळते; म्हणजेच एक हा 'गुणाकाराचा उदासीन घटक' म्हणून ओळखला जातो.
  num.seven:
    label: सात
    summary: संख्या सात, ही रंगांची संख्या आहे.
    info: अनेक संस्कृतिमध्ये सात ही संख्या शुभ मानली जाते. एक प्रवाहाचे सात रंग असतात, एक आठवड्याला सात दिवस असतात आणि सात काळज असतात.
  num.six:
    label: सहा
    summary: संख्या ६, चवीचे कापड हा सहा पक्षांचा आहे.
    info: शेस्टका म्हणजे 'आदर्श संख्या' - तिच्या सर्व भाजकांची बेरीज (1 + 2 + 3 = 6) तिच्याइतकीच होऊन राहते. अष्टभुज (हेक्सगोनल) आकृति पृष्ठभागाच्या झटपट ढकलण्यासाठी सर्वात कमी खर्च लागणारा प्रकार आहे.
  num.ten:
    label: दहा
    summary: संख्या १०, आमच्या दशांश संख्यात्मक प्रणालीचे मूलभूत.
    info: दहा हे दशांश प्रणालीचे मूलभूत असून, मानवांना कोरडेच दहा बोटे हातावर असतात. जुन्या काळापासून गणना करण्यासाठी दहा ही स्वाभाविक मापदंड मानली जाते.
  num.three:
    label: तीन
    summary: संख्या ३, पहिले विषम मुख्य संख्या.
    info: तीन ही क्रमवाचक संख्या आहे. बरेच कल्पनचित्र अशी आहेत कि तीन ही एक जादा संख्या मानली जाईल - उदाहरणार्थ, तीन इच्छा असलेले कथा, त्रिकोणामध्ये तीन बाजू आहेत आणि दिवस तीन भागांमध्ये विभाजित झालेला आहे.
  num.two:
    label: दोन
    summary: संख्या २, एकटेच सम प्राइम संख्या.
    info: दुहेरी ही एकटेच सम प्राइम संख्या आहे आणि द्विसंचयी (बायनरी) पध्दतीची मूलभूत संख्या असून, ज्यावर काम करणारे सर्व कंप्यूटर धडकतात.
