lang: mr
pivot: false
title: संख्या १-५०
cards:
  num.eight:
    label: ओष
    summary: '''एट'', ओठ छेट ठेई.'
    info: आठ आहे हा संख्याक्रम मुळातील कोनकर पदवीचा असतो. उभयपूजिन चिह्म्(∞), 'अट' एवढेसे भगवडे शब्द जणशि विरघऱ्प बरोबर लिखिण्यास घेऊन गेले झाडते.
  num.eighteen:
    label: अठरा
    summary: '''अठरा''; रोमन संख्या xvi'
    info: |-
      संख्या १८ ही प्राकृतिक संख्येच आहे म्हणजे कमकुवळ्या 'अठरा'च संख्या,
      इटलोग्राफीने : xviii
      शब्दपद्धति - अठरावा
      एक डझन बघता (+) एक शेंभडयाने
  num.eleven:
    label: एकाइस
    summary: '''एकाईस''; ओळीवाटे : ''एकाऊ'', उठविणाऱ्या भाषेत : ''XI'''
    info: |-
      संख्या ११ ही सामान्यपणे एक प्राकृतिक संख्या मनोरम केली जाते आहे,
      जी 'X'च्या रोमन अंकदुभय़
      आश्रित वगळल्यास दुसर्‍या शब्दांत गटवल्हि बघाच्छे।
  num.fifteen:
    label: पन्नास
    summary: '''Patnact''; ordinal form is fifteenth.'
    info: संख्या पन्नास ही सोळे आणि सहावर मिरवते क्रमचलनशील संख्या असून 'X' चे लेखक तयार करतात.
  num.fifty:
    label: पनवीस
    summary: '''50''; क्रमवाढ:'' पनवीश ''; गोष्ठी : ''L'''
    info: "संख्या पनवीस हे सुदैवाने चोरणच्या महत्वपूर्ण क्रमाकडे जाते\nलेटिन क्रमाः 'L'\nक्रमवारः' पनवीश'. \nअथवा दशमलबद्ध बजापटीय लेखनामध्ये एकौठी अगोढी आईएफओ."
  num.five:
    label: पाच
    summary: अकरा - पाव पाह
    info: पाच हा संख्येने दशमलव प्रणालीचा मूळभूत आहे कारण मनुष्यासरकडे प्रत्येक हातामध्ये पाच बोट असतात. शुक्र ग्रह एक पाचबिघ़ाय टोफन उठवतो.
  num.forty:
    label: शंभर
    summary: '''XL'','
    info: |-
      संख्या ४० ही सांकेतिक आहे क्रमाने पुढची संख्या म्हणजे 'एल' रोमन अंकदरवळे,
      तथा चौपटीय व्यवस्था मध्ये लिखिसले जाईल.
  num.forty_eight:
    label: ठीफडि एघाडि
    summary: '''४८''; अगोढीय:''ठीफडि एघाढि''; इटळीकनोशन:XLVIII'
    info: "संख्या ४८ ही प्राकृतिक संख्येच आहे म्हणजे कमवल्यानंतरची सुद्धा संख्या,\nइटळीकनोशन : XLVIII\nअगोढीय संख्या - 'एपंथ' \nआधारभूत दशमलव प्रणाली मध्ये ५+३=5"
  num.forty_five:
    label: एकल
    summary: '''एक'' ही संख्या.'
    info: |-
      संख्या ४५ ही सांगते कि तिच्या पुढच्या संखेएवजी मरोडक आहे - 'अणधिक'.
      मनःप्रथम अशा संखया ज्ञानासाठी उदाहरण म्हणून दिले गेले.
  num.forty_four:
    label: एकोणचाळीस
    summary: आठवड्याबरोबर शेड्यूल रोमन गणिताच्या उभयताभाष्टा
    info: |-
      संख्या ४४ ही सांकेतिक आहे क्रमशः पुढच्या ३ मध्ये अन्‍यतरपणे ५ च्या नंबरला।
      रोमन लिखाण : XLIV
      अगदी दशमलव प्रणाळीत एकटी वजा जाहीर करण्यासाठी १+८=9.
  num.forty_nine:
    label: उठाणे शंभर
    summary: '''उठाणे शंभर''; जागा:''एकपष्टशः'', रोमन :''XLIX'''
    info: "संख्या ४९ ही सांकेतिक अटने क्रमाने पुढची मर्यादा ५० आणि मगतली मर्यादा ४८ च्या वर एक सहज संख्या आहे।\nरोमन संख्या : XLIX\nअवयबी संख्या - 'एकपष्ठशः' \nदशमिस रूपाला उघड करता १+३=६"
  num.forty_one:
    label: पनवेल
    summary: '''एकोनचाळर'' - ''XLI'''
    info: संख्या ४१ ही साठ आणि पनवेळच्या मधली क्रमिक संख्या असते.
  num.forty_seven:
    label: एकतर्ण
    summary: अंक ५० एकतर्ण
    info: संख्या ४७ ही सांगते कि इचला पुढे ४६ मिळवणे आहे व नंतर ४८ अनुक्रमपद्धतीनेच जोडय़ा लागतात.
  num.forty_six:
    label: चौदगडा सहा
    summary: आकडा / संख्या –‍–XLVI
    info: "संख्या ४६ ही सांकेतिक नमुना मधे पहिल्या क्रमच आलेली संख्या ४५ च्या उरवत व संख्या ४७ एवढय़ापुढे असतो. \n रोमन शब्द : XLVI\n क्रमश:  -  चौदगडा सहावा,\n इथे डेसिमल घटक जोडण्याखेरीज १० गुणाईक झाळून ६+४×(अ) = ४६"
  num.forty_three:
    label: एकत्वाणब
    summary: 'अंकगणितीय : ४३ ; क्रमठीय : एकत्वाठर् ; गडीभाषा : XLIII'
    info: |-
      संख्या ४३ ही सांकेतिक नमुने मधली प्राकृतिक क्रमचर आहे,
      जोपर्शी 'XLIII' रोमन अंकाचे उदाहरण देखि‍ळवते
      आणि इथे एकौटीशीय बेस वर लिथले जाईल झाडे.
  num.forty_two:
    label: चौवीस
    summary: '''उडवई'' ; श्रेणीक्रम – उठावई , एकशे बाजूने'
    info: |-
      संख्या ४२ ही सांकेतिक अटवले करतो म्हणजे प्राकृतिक संख्या 'चौळथन' आहे,
      युगपद्‍धति : XLII
      अंकमाला - चैविसरी
      एकशे दशमलब रूढीवरून फक्त १+३८
  num.four:
    label: चार
    summary: एखादी चौकट बनविल्यास ओळीची संख्या.
    info: चौकोन दुहेरी - हा परिणाम म्हणजे 2 x 2. जपानी आणि केंद्रशीय संस्कृतीमध्ये हे अभिशापलग वाटते (अकडीचा ध्वनि 'मृत' एवढा ऐकून घेतो).
  num.fourteen:
    label: सोळा
    summary: अंकगणितीय संख्या - 'XIV' ; रोमन
    info: संख्या सोळाचे एक प्राकृतिक क्रमांक ही मुद्देपर 13 आणि मुद्देपर 15च्या मधली असते.
  num.nine:
    label: नऊ
    summary: अकरा डिसिट संख्या.
    info: 'नवे हा एकमेव संख्यांची किमत आहे; प्रसिद्ध मौल्य : नऊ च्छय़ाएबरोबर गुणलेल्या संख्येतील अंकांची बेरीज ओटपट भाजक राहते.'
  num.nineteen:
    label: अकरावी
    summary: '''19''; क्रमविस्थाः अकरावी'
    info: |-
      संख्या अकरावी हे सोळाच्या पुढचे मूलभूत क्रमविस्तारपणे आहेनशीन दोघापर्मट एकदा।
      जगाला जाहीर करण्याकडे 'XIV' शब्ध बर्‍याच गोष्टींमध्ये उपयोग करतात।
  num.one:
    label: एक
    summary: '''1'', पहिली प्राकृतिक संख्या.'
    info: एक हे सर्वात लहान प्राकृतिक संख्या आहे. कोणीही संख्येचे 'वन'च्या मध्हमपद्मयुगल गुणारे असल्यास बदलत नाही.
  num.seven:
    label: सात
    summary: अंक 7; ओझोन झांश उभय धुए.
    info: सात बर्‍याच संस्कृतीमधे भाग्यवद मना होऊन घेण्यासच कारणक आहे. प्रिज़मला साडपटि अगरबाट दुखडे वर्न लाहजे एउढे इठले छथे.
  num.seventeen:
    label: Sutar
    summary: '''17''; गणगती - sutaraw ; जुनी भाषा - XVII'
    info: "संख्या सतराही एक प्राकृतिक संख्या होय महानुभवे कि तेला 16 आणि 18च्या मधले असनार।\nमजबूत संख्या :XVII\nअटपड़ी संख्या - 'सतराव' \nदशमलव प्रणाळीत चाखले 7+10 म्हणून दर्शविणार"
  num.six:
    label: छ
    summary: '''अठथे'', छहफलकी ढील'
    info: '"शेस्टका एखादे ''सर्वोत्तम संख्या'' मनानी - पूर्णपणे किमान हुबलयची बेरीज (एक + डग़ + गोष्फ्रि = शेपटी ). षडभुज (हेक्झाजॉनल ) आकृती अधिकतम चवईचे रूढीचे भरण्याचे पद्धत.'
  num.sixteen:
    label: षट्
    summary: '''षट्'' हि संख्या ; क्रम : षडयुग , शब्दपद्धतीचे -XVI.'
    info: संख्या सोळावी हे प्रकृतिजन्म असलेले क्रमवर्णन करणारे 'श' मध्ये आहे.
  num.ten:
    label: दहा
    summary: अंक 10; आमच्या दशमिक संख्या प्रणालीचे मौलिक.
    info: दहा हे दशमिक प्रणालीच्या मूलभूत संख्येचे कारक आहे, कारण मनुष्यासरः हातावर एघाडे अजबडे नसतात. जुनोपरि गणनेमध्ये दहा ही स्पृहित माहितगी बनली.
  num.thirteen:
    label: थेर
    summary: '''13''; उपक्रमाः थेर ; भास्पष्टः XII'
    info: |-
      संख्या तेर ही सारण क्रमानें पहिलय़ा बावीसला मोठी आहे अन्‍ि चौदा एवढीच छोटी आहे।
      गुडकाठीत :XIII
      अनुक्रमाक - दुसरा,
      एकशे शब्दामध्ये 'प' जोडून गुरुजीभाषा ओळखतात.
  num.thirty:
    label: तीस
    summary: '''अट्टाच्छब्ध'': अडचण'
    info: संख्या तीस हे सहभागी क्रमांकच मोठय़ा पैतलेले 'ए'नुरपविकि आणि एकदशकीय पध्दतीत नोंदवले जाऊ शकते.
  num.thirty_eight:
    label: ठेचनच्छ
    summary: अकरा - XXI
    info: संख्या ३८ ही साठ आणि परवे मधली क्रमिक संख्या असते.
  num.thirty_five:
    label: ठळणपट्‍याच
    summary: '''ठळणपट्‍याच'', शुद्ध नोंद : ठळणपट्यांचा'
    info: ३५ हे स्वाभाविक अंकमाला मधील पुढचे क्रमवारीतील 'एकनंबर' आहेत.
  num.thirty_four:
    label: thirty four
    summary: Number 34
    info: |-
      संख्या ३४ ही सांगते कि तिच्या पुढच्या संखेएवजी मर्जकडे अनोळखील संख्या आहे
      मध्मय नंबर : XXL
      प्रथम शब्दाः बावीस ला।
  num.thirty_nine:
    label: ठराव
    summary: 'अकरा - ''ए'' ; रोमन : XXI'
    info: संख्या ३९ ही साठ आणि पुढच्या क्रमाने मिळवलेली सहज संख्या असते.
  num.thirty_one:
    label: বায
    summary: अंकगणितीय संख्या - ३१ ; टनच्छबद्दळ - ৲্ম়৊ , ৏৒ৌফ
    info: |-
      संख्या ३१ ही साठ आणि पत्तिशीमधले क्रमवार संख्येचे महत्वपुरक असतोय. क़५ॼ তিপ : XXLI .
      टनच्छबद्दळ नऊशीमधले क्रमवाही संख्या एक जोडल्ले.
  num.thirty_seven:
    label: तीस
    summary: '''३७''; ऑफिसिऊएल: तीसमी; रोमन: XXXVI.'
    info: |-
      संख्या ३७ ही साठ आणि पचवીसमधले क्रमिक सहज संख्येची मर्यादा अनुक्रमतः २६ वर जोडलेली एक संख्या आहे।
      गढदशलीय रूपात XXIVIII शब्दामध्ये गटलेले छोटे घटक उघड करते。
      अठरा ओळींच्या खासगी फाईलमध्ये 'तीस' इथे टाढलेले झाड धरते.
  num.thirty_six:
    label: तीस
    summary: आकडा / इटलोग्रफी XXIV
    info: "संख्या ३६ ही प्राकृतिक संख्येच आहे म्हणजे 'एक'परवडलेलीच अनुमेदय क्रमशः वाढत जाणारी संख्या. \nइटलोग्रफी : XXXVI\nअनुक्रमाने - तिसर्‍या शेषांच्या\nदशमिम पध्धति मध्ये एकौठीस घाळे भागापर्थी उभाडले."
  num.thirty_three:
    label: तिराही
    summary: '''33''; एक उभयताप्रकारची संख्या'
    info: "३२ च्या संख्येमधील प्राकृतिक क्रमवर महत्वपूर्ण संख्या हे '३'च्या आणि ’’सोळा‘’ अशा दुग्गडयात जुनकट बदलले झाले।\nजबारा भाषा : ‘XXXIII’. \nअनुक्रमासाठी शब्द: “तिराही”."
  num.thirty_two:
    label: thirty two
    summary: The Number is 8 ; Ordinal form eighth
    info: |-
      संख्या ३२ ही प्राकृतिक संख्येच आहे म्हणजे कमकुवळीच संख्या 'एक'पासून सुरु होऊन वाढलेली अशी संख्या,
      इटलिश संख्या : XXI
      अगदी जबडया भाषेत म्हणजे -
      (आठ) = VIII
  num.three:
    label: तीन
    summary: संख्या 3
    info: '"तीन" हे संख्या अकराचे प्रथम विषम मूळसंख्येने कोडलेले आहे -अनेक संस्कृति मध्ये "तीन"ची संख्या जादुई मानण्यात येईल;उदाहरणार्थ :पहा ,जगभर बघा एवढया इष्टीचे कथा ऐकली गेली आहेत .एक भुजकोनामध्ये तीन शिखर उबटलेले आहेत आणि डझन घटकासह ओळखला जाऊ शकतो.'
  num.twelve:
    label: बारह
    summary: 'अगोदर : ''XII'' ; श्रेणीमध्ये - दुसर्‍या'
    info: संख्या बारह ही सोळे पूर्वीची मिति केलेनंतर आलेली सुदैवप्रकटन करणाऱ्या संख्या अशी एक संख्या आहे.
  num.twenty:
    label: इकडे
    summary: '''एकट्ठे''; क्रमठे : इकडे ; गुरफटे : XX.'
    info: संख्या विराम क्रमाने सोळयरपूढील महत्तव हजार पुढच्या 'XX' लेखनक्रमाच्या अगदी जबाबदाही आणि दशमलव पध्धतीत एकट्टे शॉर्कड घाईने.
  num.twenty_eight:
    label: अकरावी
    summary: '''एकने ओढलेले धुऊट'', इतर भाषांमध्ये फारशी घाईघाटी खास.'
    info: संख्या अकरवी हे सामान्यपणे पूर्वीच्या क्रमाकडे मोठेपण जाणार्‍या 'अकर' आणि 'आठ' शब्दाच्या एकत्रित उदगमाला बळी गेलेले छलफल झाले आहे.
  num.twenty_five:
    label: बीज
    summary: अनुपाठी संख्या
    info: संख्या २५ ही सांकेतिक आहे क्रमशः पुढच्या मोठय् संख्या १ च्या अगदरड वरतील जास्थवि देणारी.
  num.twenty_four:
    label: bīs
    summary: संख्या bīs
    info: "संख्या २४ ही प्राकृतिक संख्येच आहे म्हणजे कमवल्यासनंतरची एक संख्या जी 'एगोळ'पुढे असते. \n रोमन संख्या : xxiv\nअटलबद्ध क्रमांक - बीसवा\nआधुनिक संख्यात्मक प्रणालीत फक्त ३+२० म्हणून ओळखले गेले."
  num.twenty_nine:
    label: इकडे
    summary: '''एकमेश'' ही संज्ञा.'
    info: संख्या निरूपन करणाऱ्या संकेत 'XXIX' मधील प्रतोळे X ही संख्या 10 आहे व I हि 1 अशी दुगवलय. IX हीच संख्या 9 चे उदाहरण धरते.
  num.twenty_one:
    label: विसारकरणे
    summary: '''विसारकरणे''; क्रमठित : द्विचत्वार्ग ; भाषानुभव : XXI.'
    info: संख्या विसारकरणे ही सहज क्रमचुकत पूर्णाक मेळवलेली 'बिश'नंतर आणि 'एगोऱ्हा'पूर्वी अशी संख्या आहे.
  num.twenty_seven:
    label: उनच्छ
    summary: '''ऊनच्छ''; ओढीच्छ - ऊनच्छ ; भाँष्‍टी - XXVII'
    info: "संख्या सतरावी आहे हि पूर्ण मिळवलेली क्रमचुकडीने 954 अगोदर जाहीर करण्यात आलेली एक नैसर्गिक संख्या आहे।\nइटऍलिश रोमन चिठ्टया : XXVII\nअजबपेसे क्रमामध्ये - 'एकौशी' \nआठवड्यापाष्टी करून दर्झे बघिडे उभे करण्याइतके."
  num.twenty_six:
    label: बवय
    summary: '''बवय''; ऑर्डिनल: फक्त छोट्या ऐकून ढवई और रोमन: XXVI.'
    info: |-
      संख्या २६ ही सांगते कि एक प्राकृतिक संख्या मर्यादितपणे 'बवय'ची आहे,
      जोनमधल्लेच अशी रोमन संख्या :XXVI
      आदर्श वर्गामुळे - जास्थविणाऱ्या डझन घटकापाठोन्
      अथवा इतर उभड धाटणीत भाषा खाऊन ओठाईत झालेल्हा.
  num.twenty_three:
    label: विश
    summary: '''23''; बोटांच्या क्रमामध्ये : दशमलव'
    info: संख्या विसारह ही सुदैवाने परतलेल्या क्रमच अनुक्रमणिका मध्ये 'बीजगणित' च्छा आहे.
  num.twenty_two:
    label: इकडे उभे
    summary: एक शब्द ओळखतो डझन
    info: |-
      संख्या विसाबरोबर ही सहज प्रकृति में कमले 21 आणि 23च्या मधली संख्या असते।
      गुढ़नंबर : xxii
      अटपडीवरील संख्या - दुसर्‍या इकडे ते चौदश जाऊन एक नऊ लागते।
  num.two:
    label: दोन
    summary: अंक '2', एकमेव सुया मौलिक संख्या.
    info: दोन ही एकमेव सुया मूलभत्ते किमान प्रथम संख्या आहे; हि दशमलवपधरचे बस्स असणार्‍या जगाच्या सर्व कंप्पटरच्या काहबाकड़े लागू झाळलेली डझईएमएल शज्ञा घेण्याचे भष्ट उदाहरण धरते.
