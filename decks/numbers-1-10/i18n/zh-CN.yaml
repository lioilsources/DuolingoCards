lang: zh-CN
pivot: false
title: 数字 1-10
cards:
  num.eight:
    label: 八
    summary: 数字8，章鱼有八条触手。
    info: 8是2的三次方（2³）。倒置的8字形（∞）代表无限符号；在中国文化中，8是最吉利的数字。
  num.five:
    label: 五
    summary: 数字5，我们每只手有五个手指。
    info: 五是十进制数系的基础，因为人类每只手上都有五个手指。金星在天空中描绘出一颗五角形的星星。
  num.four:
    label: 四
    summary: 数字4，正方形有四条边。
    info: 四是二的平方——即2×2的结果。在日本和中国文化中，它被认为是一个不吉利的数字（发音与“死”相似）。
  num.nine:
    label: 九
    summary: 数字9，最后一个一位数。
    info: 九是最大的个位数。值得注意的特性：任何数乘以九后，其各位数字之和总是能被九整除。
  num.one:
    label: 一
    summary: 数字1，第一个自然数。
    info: 一是最小的自然数。任何数乘以一都不会改变；因此它被称为“乘法中的中性元素”。
  num.seven:
    label: 七
    summary: 数字7，彩虹有七种颜色。
    info: 在许多文化中，7被认为是一个幸运的数字。彩虹有七种颜色，一周有七天，并且存在七大洲。
  num.six:
    label: 六
    summary: 数字6，蜂巢有六边形的格子。
    info: 六是一个“完美数”——所有因数（1 + 2 + 3）之和等于它本身。六角形是最节省空间的地砖方式之一。
  num.ten:
    label: 十
    summary: 数字10，我们十进制数系的基础。
    info: 十是十进制系统的基本单位，因为人类双手共有十个手指。自古以来，十就成为计数的自然标准。
  num.three:
    label: 三
    summary: 数字3，第一个奇素数。
    info: 在许多文化中，三被认为是神奇的数字——有童话故事讲到三个愿望，三角形有三条边，而一天被分为三个部分。
  num.two:
    label: 二
    summary: 数字2，唯一的偶质数。
    info: 二是唯一一个偶素数，并且是二进制（基数为2）系统的基础。所有计算机都基于这种系统运行。
