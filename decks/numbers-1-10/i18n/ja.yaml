lang: ja
pivot: false
title: 数字 1～10
cards:
  num.eight:
    label: 八
    summary: 数字の8、タコは腕が8本ある。
    info: 8（八）は2³（二乗三）です。逆さにした8（∞）は無限を表す記号であり；中国では、8という数字は最も幸運とされています。
  num.eighteen:
    label: '"osmnáct"'
    summary: ' "číslovka 18; Şadová: osmnaŭtý; Średem: XVIII."'
    info: "{\"hint\":\"基数詞の18、十八\",\"info\":\"数字18は自然数で、17に次ぎ19より前です。\r\nローマ数字：XVIII\r\n序数：第十八（じゅうだい）\r\n十進法では「8＋10」と表されます。"
  num.eleven:
    label: 十一
    summary: 基数詞：十一；序數詞：第十一；羅馬字：XI
    info: 数字の11は、自然数で10に次ぎ12より前です。ローマ数字ではXIと表されます。
  num.fifteen:
    label: 十五
    summary: 基数詞：十五；序數詞：第十五位；羅馬字表示為「XV」
    info: 数字の15は、自然数で14に次ぎ16より前です。ローマ数字ではXVと表記されます。
  num.fifty:
    label: 五十
    summary: 基数詞：五十；序數詞：第五回目（五十番目の）；ローマ字表示：L
    info: |-
      数字の50は、自然数で49に次ぎ51より前です。
      ローマ数字ではLと表されます。
      五十進法ではなく十進法においても通常「50」と書かれます。
  num.five:
    label: 五
    summary: 数字の5、人間は手にこの数だけ指を持っている。
    info: 五は十進法の基盤であり、これは人が片方に5本の指を持つためである。また金星が空を描く軌道は五芒星（五つの角を持つ星）のような形をしている。
  num.forty:
    label: 四十
    summary: 基数詞：四拾；序數詞：第四十位
    info: 数字の40は、自然数で39に次ぎ41より前です。ローマ数字ではXLと表記されます。
  num.forty_eight:
    label: 四十と八
    summary: 数詞48；順序：第四十八；ラテン語式：XLVIII。
    info: '{"hint":"基数詞の数値48、四十八","info":"数字48は自然数で、47に次ぎ49より前です。\nローマ数字：XLVIII\n序数：第48位（四十と八番目）\n十進法では「8＋40」と表記されます。","label":"四十と八","summary":"数詞48；順序：第四十八；ラテン語式：XLVIII。'
  num.forty_five:
    label: 四十五
    summary: 基数詞：45；序數詞：第45位；羅馬字表示為：XLV
    info: 数字の45は、自然数で44に次ぎ46より前です。ローマ数字ではXLVと表されます。
  num.forty_four:
    label: 四十四
    summary: 基数詞：四十；序數詞：第四位
    info: |-
      数字の44は、自然数で43に次ぎ45より前です。ローマ数字ではXLIVと表記されます。
      desítkové（十進法）においては、「4＋40」として書かれます。
  num.forty_nine:
    label: 四十玖
    summary: 基数詞49；序数：四十玖番目；ローマ字：XLIX
    info: "{\"hint\":\"基数詞の49、四十九\",\"info\":\"数値49は自然数で、48に次ぎ50より前です。\r\nローマ数字：XLIX\r\n序数：九十四番目（じゅうよんばんめ）\r\n十進法では『9＋40』と表記されます。\",\"label\":\"四十玖\",\"summary\":\"基数詞49；序数：四十玖番目；ローマ字：XLIX\"}"
  num.forty_one:
    label: 四十人
    summary: 基数詞：四十一；序數詞：第四十一；羅馬字：XLI
