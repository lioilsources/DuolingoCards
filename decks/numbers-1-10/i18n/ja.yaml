lang: ja
pivot: false
title: 数字 1～10
cards:
  num.eight:
    label: 八
    summary: 数字の8、タコは腕が8本ある。
    info: 8（八）は2³（二乗三）です。逆さにした8（∞）は無限を表す記号であり；中国では、8という数字は最も幸運とされています。
  num.five:
    label: 五
    summary: 数字の5、人間は手にこの数だけ指を持っている。
    info: 五は十進法の基盤であり、これは人が片方に5本の指を持つためである。また金星が空を描く軌道は五芒星（五つの角を持つ星）のような形をしている。
  num.four:
    label: 四
    summary: 数字の4、正方形は4つの辺を持っています。
    info: 4は2を二乗した数で、2×2の結果です。日本や中国では不吉な数字とされ（「死」という言葉に発音が似ているため）、文化上特別な意味があります。
  num.nine:
    label: 九
    summary: 数字の9、最後の一桁の数。
    info: 九は最大の一桁の数です。興味深い性質として、九で掛け算した数の各位の和（数字和）は常に九で割り切れます。
  num.one:
    label: 一
    summary: 数の1、最初の自然数。
    info: 「1」は最小の自然数です。任意の数を1で掛けてもその値は変わりません。そのため、「乗法における単位元」と呼ばれます。
  num.seven:
    label: 七
    summary: 数字7、虹には七色あります。
    info: 7という数は多くの文化で幸運の数字とされています。虹は七つの色を持ち、週も七日間続き、七大陸が存在しています。
  num.six:
    label: 六
    summary: 数字の6、ミツバチの巣枠は六角形のセルを持っている。
    info: 6という数値は「完全数」として知られている。すべての約数（1＋2＋3＝6）を足すと自分自身に等しいからである。六角形（ヘキサゴナル）な形状は、平面を敷き詰める最も効率的な方法として知られている。
  num.ten:
    label: 十
    summary: 数字の10、私たちの十進法数体系の基準。
    info: 十は指を含む人間が合計で手に持つ本数であり、十進法の基礎となっています。古くから十は自然な測定単位として使われてきました。
  num.three:
    label: 三
    summary: 数字の3、最初の奇数の素数。
    info: 3は多くの文化で神秘的な数と見なされています。例えば、3つの願いを叶えるという童話や三角形が3辺を持つことなどです。また、一日も朝・昼・夜の3つの部分に分けられています。
  num.two:
    label: 二
    summary: 数字の2、唯一の偶数の素数。
    info: 2は唯一の偶数の素数であり、二進法（base-2）の基数でもあります。すべてのコンピュータがこの二進法に基づいて動作しています。
