  num.three:
    label: 三
    summary: 数字の3、最初の奇数の素数。
    info: 3は多くの文化で神秘的な数と見なされています。例えば、3つの願いを叶えるという童話や三角形が3辺を持つことなどです。また、一日も朝・昼・夜の3つの部分に分けられています。
