    info: 数字の43は、自然数で42に次ぎ44より前です。ローマ数字ではXLIIIと表記されます。
  num.forty_two:
    label: 四十人二
    summary: 基数詞：四十二；序數詞：第四十一；羅馬字：XLⅡ
    info: |-
      数字の42は、自然数で41に次ぎ43より前です。ローマ数字ではXLIIと表されます。
      desítkové（十進法）においては「2＋40」として書かれます。
  num.four:
    label: 四
    summary: 数字の4、正方形は4つの辺を持っています。
    info: 4は2を二乗した数で、2×2の結果です。日本や中国では不吉な数字とされ（「死」という言葉に発音が似ているため）、文化上特別な意味があります。
  num.fourteen:
    label: fourteen
    summary: 基数：fourteen；序数：第十四；ローマ字：XIV．
    info: '{"hint":"数詞の14、基数四teen","info":"数字14は自然数で、13の次に来て15より前です。\rローマ数字：XIV\.\r序数：十四番目。\r十進法では4＋10と表記されます。","label":"fourteen","summary":"基数：fourteen；序数：第十四；ローマ字：XIV."}'
  num.nine:
    label: 九
    summary: 数字の9、最後の一桁の数。
    info: 九は最大の一桁の数です。興味深い性質として、九で掛け算した数の各位の和（数字和）は常に九で割り切れます。
  num.nineteen:
    label: девятьнадцать
    summary: 数字19；顺位表現： девятнадцатый；罗马字表示:XIX
    info: "{\"hint\":\"基数詞の19、序数第十九\",\"info\":\"数字19は自然数で、18に次ぎ20より前です。\r\nローマ数字：XIX\r\n順番を表す語形態（序数）では「 девятнадцатый」\r\n十進法においては、「9＋10」として記録されます。"
  num.one:
    label: 一
    summary: 数の1、最初の自然数。
    info: 「1」は最小の自然数です。任意の数を1で掛けてもその値は変わりません。そのため、「乗法における単位元」と呼ばれます。
  num.seven:
    label: 七
    summary: 数字7、虹には七色あります。
    info: 7という数は多くの文化で幸運の数字とされています。虹は七つの色を持ち、週も七日間続き、七大陸が存在しています。
  num.seventeen:
    label: 十七
    summary: 基数：17；序数：第十七；ローマ字：XVII
    info: 数字の17は、自然数で16に次ぎ18より前です。ローマ数字ではXVIIと表記されます。
  num.six:
    label: 六
    summary: 数字の6、ミツバチの巣枠は六角形のセルを持っている。
    info: 6という数値は「完全数」として知られている。すべての約数（1＋2＋3＝6）を足すと自分自身に等しいからである。六角形（ヘキサゴナル）な形状は、平面を敷き詰める最も効率的な方法として知られている。
  num.sixteen:
    label: sixteen
    summary: The numerical value for 'shesntact'; ordinal form is sixteenth
    info: "{\"hint\":\"数詞の16、基数十六\",\"info\":\"番号16は自然な数字で、番号15の後に来て番号17より前です。\rローマ数字：XVI\r順序を表す語形態（序數）：第十六\r十進法では6＋10として書かれます。\"}"
  num.ten:
    label: 十
    summary: 数字の10、私たちの十進法数体系の基準。
    info: 十は指を含む人間が合計で手に持つ本数であり、十進法の基礎となっています。古くから十は自然な測定単位として使われてきました。
  num.thirteen:
    label: 十三
    summary: 基数詞「13」；序数詞「三十一番目等」；ローマ数字「XIII」
    info: "{\"hint\":\"数詞の13、基数詞十三\",\"info\":\"数字13は自然数で、12に次ぎ14より前です。\r\nローマ数字：XIII\r\n序数詞（第何番）：thirteenth（第三十位など）。\r\n十進法では3＋10と表されます。\",\"label\":\"thirteen\",\"summary\":\"基数詞13；序数詞third thirtieth etc．；ローマ字XIII\"}"
  num.thirty:
