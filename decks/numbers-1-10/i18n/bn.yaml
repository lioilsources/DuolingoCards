title: ১ থেকে ১০ পর্যন্ত সংখ্যা
cards:
  num.eight:
    label: আট
    summary: সংখ্যা ৮, সর্পগুলির আটটি হাত।
    info: অষ্টমিকা ২³ (দুইয়ের ঘনফল); অক্ষরিত অষ্টমিকা (∞) একটি অসীমতার চিহ্ন। চীনা সংস্কৃতিতে আট হচ্ছে সবথেকে শুভ সংখ্যা।
  num.eighteen:
    label: একাধিক
    summary: '''18''-এর ফরম্যাট জাভা'
    info: "সংখ্যা আটারোকে 'আরও' সংখ্যা 17 এবং পরবর্তীতে অষ্টদশমিক ব্যবহার হয়।\r\nইউনি চিনিঃ ইপ্লুভলুগ\r\nঅফিশিও মধ্যে দ্বিগুণ উচ্ছ্঵াস ঘটছে।"
  num.eleven:
    label: জয়ডশম
    summary: 'অঙ্গারক 7 ; শ্রেণীবিভাজন : ডোলওভাইফথ ; মধ্যযুগীয় চিহ্ণ : VII'
    info: "'১২' এর আগে '৯'এবং '১০'-এর পর্বতি সংখ্যা।\nইটালিকন অক্ষর :XI\nপদসমষ্টি :জয়ডশম। \ndecimal system -এ তা 9+8"
  num.fifteen:
    label: পন্থাট্‌
    summary: অঙ্ক ১৩
    info: "'১৫' হলো 'প্রাকৃতিক সংখ্যা',যেটির পরবর্তী নম্বরগুচ্ছ দশক।\r\nইহা একটি মনসাগর জড়িত অঙ্ক ও আধুনিক ভাষায়ও খুব চলছে।"
  num.fifty:
    label: পাঞ্চাত্মক
    summary: '''পাঞ্চালী'';'
    info: |-
      সংখ্যা পাচিশটিরোমান সংকেত 'L'।
      এই ক্রমবর্জনীয় বলতে এগুণশৌজন অপেক্ষা ছোট আছে।
  num.five:
    label: পাঁচ
    summary: সংখ্যা ৫, আমরা প্রতিটি হাতে এই সংখ্যক আঙুল দেখতে পাই।
    info: দশমিক সংখ্যা ব্যবস্থার ভিত্তি হল পাঁচটি আঙুল, কারণ মানুষের প্রতিটি হাতে পাঁচটি আঙুল থাকে। শনি গ্রহ আকাশে একটি পাঁচ কৌণিক তারা অঙ্কন করে।
  num.forty:
    label: 'চতল্বার '
    summary: অঙ্গন চতল্বাঃ ইটালিক নথিতে Xl
    info: "'৪' সংখ্যাটি '৩৮'-এর এবং '৪১'-এর আগে।\r\nইটালিক অক্ষর : XL\r\nপদসমষ্টি :চতল্বারা \r\nযোগফল হিশেবেও -XL"
  num.forty_eight:
    label: চাইল্ড ওজওইউ
    summary: অঙ্ক ৪৮ ; ধারাঃ চতুর্দশ অষ্টম ; ঘৌঢ়্য়ঃ XLVIII
    info: "সংখ্যা ৪৮ হলো ৪৭ এবং ৪৯ের সাথে জড়িত।\r\nগণনা করার চিঠি : XLVIII\r\nক্রমিশদ নথিতে লেখা আছে -চতুর্দশ অষ্টম। \r\nএটি বহীয় গণনা ফরম্যাটে উপস্থাপন করা হয় ৮+৪০"
  num.forty_five:
    label: ষড়যন্ত্র ও আহত গণনা - উভয় ধরনের ঘটনাই খৃষ্ঠাণীয় ভাবে ঐশ্বরিক সৎ কর্মের সঙ্গে সম্পর্কিত।
    summary: '''আমি'', ''ওরা,'' ডান হাতের ঝুড়ি'
    info: |-
      সংখ্যা ৪৫ হলো ৪৪ এব় ৪৬ সংখ্যার মধ্যে।
      রুমানিজনদের অক্ষরগুচ্ছটি দ্বারা লেখা XVL
      অপর কথাটি 'এই চতুর্থ শতক' তৈরি করছে।
  num.forty_four:
    label: এফওআরি ওয়ানহাল্‌ফ
    summary: 'অঙ্ক ৪৪ ; অর্ডিনাল: ছ''ষটি ষ্ট'
    info: "সংখ্যা ৪৪ হলো ৪৩ এর সাথে ৪৫ রয়নি।\r\nগণিতমত চিঠি : XLIV\r\nপজিশন নম্বরটি -চব্বইশ কৌধাম। \r\nদশক গড় দশক আছে"
  num.forty_nine:
    label: চতুরশীষটহইও
    summary: অঙ্গদ ১৩ ; শ্রেণিঃ চতুরশীষটহইও
    info: "সংখ্যা ৪৯ হলো ৪৮ এব় ৫০ -এর সাথে ঘনিষ্ঠভাবে।\r\nগণনা : XLIX\r\nক্রমিক নির্ণয়কাজ :চতুরশীষটহইও"
  num.forty_one:
    label: চার এক
    summary: '''আঃ'', চতুর্গৌণ : চতুর্গৈষ্ঠ ; ইটালি অঙ্ক : XL'
    info: "সংখ্যা ৪১ হলো ৪০ এব় ৪২য়ের মধ্যকার সহজগণনিক সংখ্যা।\nইটালি অঙ্ক: XLl\nঅতএব, 'চতুর্থ' শব্দটি ব্যবহার করে চতুর্গীয় আছে। \nদশমিত ভাষাটি ইউপিও ফরম্যাটে উৎপন্ন হওয়া ছাড়া জানা খুব ঘন ঝুঁকি ঐ ঠিকাণা"
  num.forty_seven:
    label: চব্বিশ ছয়
    summary: '''৪৮''-এর চেয়েও ডাইজিট ফরম্যাট ঘটছে'
    info: |-
      সংখ্যা ৪৭ হলো ৪৬ এর সাথে ১টি অঙ্ক দিয়ে গঠনকৃত।
      ইহা রোমান লিখনপদ্ধতিতে 'XLVII' আকারে উৎপন্ন হয়।
  num.forty_six:
    label: পঞ্চাইশি
    summary: '''৪৬''-এর উৎস ছড়িয়ে তথা জৈব ঘনত্ব'
    info: "সংখ্যা ৪৬ হলো ৪৫ এবং ৪৭য়ের মধ্যকার সহজগণনিক নম্বর।\r\nইটালির অঙ্ক: XLVI\r\nঅতএব, 'চতুর্দশ' শব্দটি চতুর্থ ওষ্ঠ ধ্বনি গৃহীত আছে।"
  num.forty_three:
    label: চৈত্য ট্রি
    summary: আওয়াজ ও ইউনিভাজ্ঞাঃ ফোর্ডি
    info: "সংখ্যা ৪৩ হলো ৪২ এবং ৪৪ের মধ্যকার সহজগণন ধাঁধা।\r\nইটালিক অঙ্কদি : XLIII\r\nঅতএব শ্রেণীভুক্তি বা আয়মপৌরষ চিঠি দশমিক গড়ে থাকে"
  num.forty_two:
    label: আড়াই চল্লিছ
    summary: '''৪২''-এর গণনা ; ঘরের ঃ ‘চতুর্ভঙ্খ’ , ইউরোপীয় উৎস :-XLII'
    info: "সংখ্যা ৪২ হলো ৪১ এবং ৪৩ সংখ্যার মধ্যে।\r\nরমনিক অক্ষরটি আছে : XLII\r\nঅপরচয় শতকরা - 'চতুর্থদশ' \r\nএই দশভগ্ণ ব্যথ্তি লেখা হয় ২+৪০"
  num.four:
    label: চার
    summary: সংখ্যা ৪ বা 'ফর'। একটি চতুর্ভুজের চারটি বাহু থাকে।
    info: চার দুইয়ের বর্গ - ২×২ এর ফলাফল। জাপানি ও চিনা সংস্কৃতিতে এটি অশুভ সংখ্যা হিসেবে বিবেচিত হয় (এর ধ্বনি শব্দ "মৃত্যু" শব্দের মতো)।
  num.fourteen:
    label: চোদ্দ
    summary: '''14''-এর উৎপাদন ঘটছে'
    info: "সংখ্যা চৌদ্দটির সাথেই একজন প্রাকৃতিক নম্বর।\nবলা হয় 'XIV' আকারে। \nএগারও ও তেরের মধ্যে অপর গণনা শুরু হয়।"
  num.nine:
    label: নব
    summary: সংখ্যা ৯, সর্বশেষ এক অঙ্কের সংখ্যা।
    info: 'নবটি হল সর্বোচ্চ মানের এক অঙ্কের সংখ্যা। আকর্ষণীয় ধর্ম: নব দিয়ে গুণ করা হলে ফলাফলের অঙ্কগুলোর যোগফল সর্বদা নব দ্বারা বিভাজ্য হয়।'
  num.nineteen:
    label: XIV
    summary: শব্দটি ৩
    info: "'১৯' হলো '৮'-এর পরে এবং '২০'-এর আগে।\r\nইহা রমাণস্ক সংখ্যা - IX\r\nক্রমিত শব্দটি অনুপযুক্ততা ছাড়াও ব্লক চিঠি থেকে উদ্ভূত।"
  num.one:
    label: এক
    summary: সংখ্যা ১, প্রথম স্বাভাবিক সংখ্যা।
    info: একটি হলো সবচেয়ে ছোট স্বাভাবিক সংখ্যা। এক দ্বারা গুণন করলে যে কোনও সংখ্যা অপরিবর্তিত থাকে; ফলে এটি গুণনের "অভেদক উপাদান" নামে পরিচিত।
  num.seven:
    label: সাত
    summary: সংখ্যা ৭, এটি র‌্যাডিউমের সঙ্গে আছে।
    info: বহু সংস্কৃতিতে 'সাত'কে শুভ সংখ্যা হিসেবে বিবেচনা করা হয়। দুইপ্রান্ত ছাড়া সাতটি রং থাকে এবং সপ্তাহেও সাতদিন থাকে এবং পৃথিবীতে সাতটি মহাদেশ রয়েছে।
  num.seventeen:
    label: সপ্তদশ
    summary: অঙ্ক ১৭ ; শ্রেণিঃ 'সপ্তদশ'; রোমান :X V I
    info: "১৭ হলো ১৬এর পরে এবং ১৮এর আগে।\r\nইহা রোমান সংখ্যা X VII দিয়েও লেখা হয়। \r\nদশক গণনা করতে ৷+১০ তথা ১৫ থেকে ৩টি অঙ্ক জুড়ে ইহা চিহ্নিত করা হয়।"
  num.six:
    label: ছয়
    summary: সংখ্যা ৬, মধুমাকড়ের পিটলে ষটভুজাকার ছিদ্র।
    info: ষটক হলো 'পূর্ণতা সংখ্যা' - এর সবগুলি গুণনীর যোগফল (1 + 2 + 3 = 6) নিজেই তা ফিরে আসে। ষটভুজাকার (হেক্সাগোনাল) আকৃতি সবচেয়ে অধিক কার্যকর ভাবে ক্ষেত্রফল ঢেকে থাকে।
  num.sixteen:
    label: ষোল
    summary: ষোল ; অগণিত - ষোড়দশম , ল্যাটিন:XVI
    info: "সংখ্যা ষোলটির পাশেইয়া সতিনকেন।\r\nবাইশম রুপ :XVI\r\nঅগণিত ক্রমিঃষোড়দশম \r\nএকাদশ বহী একাধিক হওয়া ছয়+দশ"
  num.ten:
    label: দশ
    summary: সংখ্যা ১০, আমাদের দশমিক সংখ্যা পদ্ধতির ভিত্তি।
    info: দশটি হাতের আঙুল মানুষের রয়েছে, এইজন্য দশকের উপর ভিত্তি করে দশমিক ব্যবস্থা গড়ে ওঠে। দশ শুধুমাত্র গণনার জন্য প্রাচীন কাল থেকে স্বাভাবিক পরিমাপ ছিল।
  num.thirteen:
    label: thirteen
    summary: The ordinal is thirteenth.
    info: |-
      ১৩ হলো ২টিরও বেশি সংখ্যা।
      সঠিকভাবে একদমই রুমালপতন আছে:
      XIII
      এবং তথ্যগুলো দশমিক পদ্ধতি অনুযাওয়া থাম্ভাঃ
  num.thirty:
    label: ত্রিশ
    summary: সংখ্যা - ’৩০’, গণনা – ’ত্রিশতম’, ইউপি–XXL
    info: "'৩০' সংখ্যাটি '২৯'-এর পরেও এবং '৩১'-এর আগেও।\r\nইহা রোমান অক্ষরে XXL হিসাবে লেখা হয়। \r\nত্রিশতম ক্রমণীয় ছদ্মনামটি ‘ত্রিচত্ত’"
  num.thirty_eight:
    label: ত্রিওষ্ঠ
    summary: 'অঙ্ক 38 ; ঘর : ত্রিঃ ছয় , রোমান :XXXVIII'
    info: "সংখ্যা ৩৮ হলো ৩৭ এবং ৪০ সংখ্যার আগের নিজural সংখ্যা।\nরমন অক্ষরটি XXVIIIXXXVIII\nপজিশনাল ক্রম :ত্রয়ী ত্বষডশদশম চতুর্থ। \nএই ডেসিটাল গণনা ফরম্যাটে ইহা 8+30 ধরে উৎপন্ন হয়।"
  num.thirty_five:
    label: ট্রিটিও ভাইজ
    summary: আঙ্ক ১৫
    info: "'৩৫' হলো '৪০'-এর আগে এবং '২৮'-এর পর।\r\nইহা রুমালি সংখ্যক চিঠি XXLX বা LXXXIV গণনা করতে অসচরভাবে উপযোগী।"
  num.thirty_four:
    label: একীকৃত আড়াই ডজন
    summary: আছে ইওফৌনিট ফর্ম
    info: "সংখ্যা ৩৪ হলো ১ থেকে ∞ এর মধ্যবর্তি সহজগণনাকৃত নিখুঁট গণনা।\nইউথমিউশন রোমালপদ্ধতি : XXLX। \nঅভিজ্ঞতা -চতুর্দশ শতকের চতুর্বিষয়ক অঙ্ক।"
  num.thirty_nine:
