lang: bn
pivot: false
title: ১ থেকে ১০ পর্যন্ত সংখ্যা
cards:
  num.eight:
    label: আট
    summary: সংখ্যা ৮, সর্পগুলির আটটি হাত।
    info: অষ্টমিকা ২³ (দুইয়ের ঘনফল); অক্ষরিত অষ্টমিকা (∞) একটি অসীমতার চিহ্ন। চীনা সংস্কৃতিতে আট হচ্ছে সবথেকে শুভ সংখ্যা।
  num.five:
    label: পাঁচ
    summary: সংখ্যা ৫, আমরা প্রতিটি হাতে এই সংখ্যক আঙুল দেখতে পাই।
    info: দশমিক সংখ্যা ব্যবস্থার ভিত্তি হল পাঁচটি আঙুল, কারণ মানুষের প্রতিটি হাতে পাঁচটি আঙুল থাকে। শনি গ্রহ আকাশে একটি পাঁচ কৌণিক তারা অঙ্কন করে।
  num.four:
    label: চার
    summary: সংখ্যা ৪ বা 'ফর'। একটি চতুর্ভুজের চারটি বাহু থাকে।
    info: চার দুইয়ের বর্গ - ২×২ এর ফলাফল। জাপানি ও চিনা সংস্কৃতিতে এটি অশুভ সংখ্যা হিসেবে বিবেচিত হয় (এর ধ্বনি শব্দ "মৃত্যু" শব্দের মতো)।
  num.nine:
    label: নব
    summary: সংখ্যা ৯, সর্বশেষ এক অঙ্কের সংখ্যা।
    info: 'নবটি হল সর্বোচ্চ মানের এক অঙ্কের সংখ্যা। আকর্ষণীয় ধর্ম: নব দিয়ে গুণ করা হলে ফলাফলের অঙ্কগুলোর যোগফল সর্বদা নব দ্বারা বিভাজ্য হয়।'
  num.one:
    label: এক
    summary: সংখ্যা ১, প্রথম স্বাভাবিক সংখ্যা।
    info: একটি হলো সবচেয়ে ছোট স্বাভাবিক সংখ্যা। এক দ্বারা গুণন করলে যে কোনও সংখ্যা অপরিবর্তিত থাকে; ফলে এটি গুণনের "অভেদক উপাদান" নামে পরিচিত।
  num.seven:
    label: সাত
    summary: সংখ্যা ৭, এটি র‌্যাডিউমের সঙ্গে আছে।
    info: বহু সংস্কৃতিতে 'সাত'কে শুভ সংখ্যা হিসেবে বিবেচনা করা হয়। দুইপ্রান্ত ছাড়া সাতটি রং থাকে এবং সপ্তাহেও সাতদিন থাকে এবং পৃথিবীতে সাতটি মহাদেশ রয়েছে।
  num.six:
    label: ছয়
    summary: সংখ্যা ৬, মধুমাকড়ের পিটলে ষটভুজাকার ছিদ্র।
    info: ষটক হলো 'পূর্ণতা সংখ্যা' - এর সবগুলি গুণনীর যোগফল (1 + 2 + 3 = 6) নিজেই তা ফিরে আসে। ষটভুজাকার (হেক্সাগোনাল) আকৃতি সবচেয়ে অধিক কার্যকর ভাবে ক্ষেত্রফল ঢেকে থাকে।
  num.ten:
    label: দশ
    summary: সংখ্যা ১০, আমাদের দশমিক সংখ্যা পদ্ধতির ভিত্তি।
    info: দশটি হাতের আঙুল মানুষের রয়েছে, এইজন্য দশকের উপর ভিত্তি করে দশমিক ব্যবস্থা গড়ে ওঠে। দশ শুধুমাত্র গণনার জন্য প্রাচীন কাল থেকে স্বাভাবিক পরিমাপ ছিল।
  num.three:
    label: তিন
    summary: সংখ্যা ৩, প্রথম বিজোড় মৌলিক সংখ্যা।
    info: তিনটির ধারণা অনেকগুলি সংস্কৃতিতে ভাগ্যবিশেষ হিসেবে বিবেচিত হয় - এই সংখ্যাটি থেকে তিনটি ইচ্ছা পূরণের কাহিনী আছে, ত্রিভুজের তিনটি বাহু আছে এবং দিন তিনভাগে বিভক্ত হয়।
  num.two:
    label: দুই
    summary: সংখ্যা 2, একমাত্র জোড় মৌলিক সংখ্যা।
    info: দুইটি হল অনন্য জোড় মৌলিক সংখ্যা এবং দ্বিগুণ পদ্ধতির (বাইনারি) ভিত্তি, যেটি সমস্ত কম্পিউটারগুলি চালিত হয়।
