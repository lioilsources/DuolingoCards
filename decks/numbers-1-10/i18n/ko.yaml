lang: ko
pivot: false
title: 숫자 1-10
cards:
  num.eight:
    label: 여덟
    summary: 숫자 8, 문어는 팔이 여덟 개다.
    info: 팔은 2³(두 세제곱)이다. 거꾸로 놓인 8(∞)은 무한의 기호이며, 중국 문화에서는 가장 행복한 숫자 중 하나로 여겨진다.
  num.eighteen:
    label: ' восемнадцать'
    summary: '정수 18; 순서 수사: eighteenth; 로마식 기호: VIII'
    info: 숫자 18은 자연수로 숫자 17 다음에 오고 숫자 19 이전입니다. 로마자 표기법에서는 'XVIII'이며 순서 수사형으로는 'eighteenth(열여덟째)'가 됩니다.
  num.eleven:
    label: 일십이
    summary: 기수법으로 일십이(11), 서수가 일십둘째(XI)
    info: 숫자 11은 자연수로 숫자 10 다음에 오고 숫자 12 이전이다. 로마 수자로는 'XI'를 사용한다.
  num.fifteen:
    label: 십오
    summary: 기수법의 15
    info: 숫자 15는 자연수로 숫자 14 다음에 오고 숫자 16 전이다. 로마 수자로 'XV'라고 쓴다.
  num.fifty:
    label: fifty
    summary: '순번: fifty-first'
    info: |-
      숫자 50은 자연수로 숫자 49 다음에 오고 숫자 51 이전이다。
      십진법에서는 'L'으로 표기된다。
      서 수사의 순위는 '오십 번째', 로마자 기호는 'L'이며 십진법에서 표현하면 50이 된다。
  num.five:
    label: 다섯
    summary: 숫자 5, 손에 있는 손가락 수입니다.
    info: 십진법은 다섯을 기반으로 합니다. 왜냐하면 사람들은 한쪽 손마다 다섯 개의 손가락이 있기 때문입니다. 화성(Venus)은 하늘에서 오각별 모양의 궤적을 그립니다.
  num.forty:
    label: сорок
    summary: '정수 사십(40); 서열: 사십 번째(fortieth), 로마자: XL'
    info: |-
      숫자 40은 자연수로 숫자 39 다음에 오고 41 이전이다.
      십진법에서는 'XL' 로 표기된다.
      서 수사의 경우는 'forty', 서 열린 순위 표현으로는 'fourtieth'가 된다.
  num.forty_eight:
    label: сорока восемь
    summary: '순번 48; 순차적 표현: сороковой второй; 로마식 기호: XLVIII.'
    info: 숫자 48은 자연수로 숫자 47 다음에 오고 숫자 49 이전이다. 로마자 표기법으로는 XLVIII이며 순서 수사로서 'сорок восьмой'가 된다.
  num.forty_five:
    label: сорок пять
    summary: '순번 수사어 45; 순위표현: сорокаты йпятый; 로마식: XLV.'
    info: |-
      숫자 45는 자연수로 숫자 44 다음에 오고 숫자 46 이전이다.
       로마자 표기법은 XLV이며 순서 수사어(ordinal)는 'сорок пятый'이고,
       십진법에서는 5와 40을 더한 형태로 표현된다.
  num.forty_four:
    label: сорок четыре
    summary: '순번 44; 순차적 번호: сорок четвертый; 로마식: XLIV.'
    info: 숫자 44는 자연수로 숫자 43 다음에 오고 숫자 45 이전입니다. 로마자 표기법에서는 XLIV이며 순서 수사로서 'сорок четвертый'라고 표현됩니다.
  num.forty_nine:
    label: сорок девять
    summary: '순자리 수사 49; 순위 표현: 네 번째 아홉 번째; 로마식 기호: XLIX.'
    info: |-
      숫자 49는 자연수로 숫자 48 다음에 오고 숫자 50 이전이다.
      십진법에서는 'XLIX' 로 표기되며 순서 수사형은 '네 번째 아홉 번째'가 된다.
  num.forty_one:
    label: сорок один
    summary: 기수사십일(41), 서수가 사십첫째(XL I)
    info: 숫자 41은 자연수로 숫자 40 다음에 오고 숫자 42 이전입니다. 로마 수자로는 'XLI'가 사용됩니다.
  num.forty_seven:
    label: сорок семь
    summary: '순번 47; 순차적: 사십칠 번째; 로마식: XLVII.'
    info: |-
      숫자 47은 자연수로 숫자 46 다음에 오고 숫자 48 이전이다.
       로마자 표기법에서는 XLVII가 된다.
       순서 수는 '사십일곱 번째'이며,
       십진법으로 표현하면 7과 40의 합이 되며 쓰인다.
  num.forty_six:
    label: сорок шесть
    summary: '순번 46; 순차적 표현: сорок шестой; 로마식 기호: XLVI.'
    info: |-
      숫자 46은 자연수로 숫자 45 다음에 오고 숫자 47 이전이다.
       로마자 표기법으로는 XLVI이며 순서 수사로서 'сорок шестой'가 된다.
      십진법에서는 6과 40의 합이 되어 쓰인다.
  num.forty_three:
    label: сорок три
    summary: '순번 수사 43; 순차적 형식: сорокатый третьи; 로마 자릿값: XLIII.'
    info: |-
      숫자 43은 자연수로 숫자 42 다음에 오고 44 이전입니다.
       로마자 표기법에서는 XLIII이며,
       순서 수사형으로는 'сорок третий'가 됩니다.
       십진법에서 표현하면 3과 40의 합인 형태를 띱니다.
  num.forty_two:
    label: сорок два
    summary: '순번 42; 순차적 번호: сороковой второй; 로마식: XLII.'
    info: |-
      숫자 42는 자연수로 숫자 41 다음에 오고 43 이전이다.
       로마자 표기법은 XLII이며 순서 수사어(ordinal)는 'сорок второй'이고,
       십진법에서는 2+40으로 표현된다.
  num.four:
    label: 네
    summary: 숫자 4, 네 변이 있는 정사각형.
    info: 네는 두 수의 제곱으로 나온 결과이다(2×2). 일본과 중국 문화에서 이 숫자는 불길한 것으로 여겨진다(발음이 '죽음'이라는 단어와 비슷하기 때문).
  num.fourteen:
    label: 십사
    summary: '정수 14; 순서 수사: 십사 번째; 로마식 기호: XIV.'
    info: |-
      숫자 14는 자연수로 숫자 13 다음에 오고 숫자 15 이전이다.
       로마자 표기법은 'XIV'이며 순서 수사형으로는 '십사 번째', 즉 천계열이 된다.
       십진법에서는 4와 10을 더한 형태인 것으로 표현된다.
  num.nine:
    label: 아홉
    summary: 숫자 9, 마지막 한 자리 수.
    info: 아홉은 가장 큰 한 자리 숫자입니다. 흥미로운 특징으로는 아홉과 곱해진 모든 수의 자릿수 합이 항상 아홉으로 나누어 떨어집니다.
  num.nineteen:
    label: деветнаесет
    summary: '기수 19; 서수: девятнадцатый; 로마식 기호: XIV.'
    info: 숫자 19는 자연수로 숫자 18 다음에 오고 숫자 20 이전이다. 로마자 수법으로는 'XIV'이며 순서를 나타내는 관계사정어(序數詞) 형태인 '십구째', 즉 ' девятнадцатый'가 된다.
  num.one:
    label: 하나
    summary: 숫자 1, 첫 번째 자연수입니다.
    info: 일은 가장 작은 자연수입니다. 어떤 수든 일과 곱해져도 값이 변하지 않기 때문에 '곱셈의 항등원'이라고 불립니다.
  num.seven:
    label: 일곱
    summary: 숫자 7, 무지개는 일곱 가지 색을 가지고 있습니다.
    info: 일곱은 많은 문화에서 행운의 숫자로 여겨집니다. 무지개에는 일곱 개의 색이 있고, 주(week)에도 일곱 날짜가 있으며, 지구에는 일곱 대륙이 존재합니다.
  num.seventeen:
    label: 십칠
    summary: '순번 수사: 십칠; 순위 형식: 십칠탄; 로마 자릿값 기호: XVII'
    info: 숫자 십칠은 자연수로 숫자 열여섯 다음에 오고 숫자 eighteen 이전이다. 로마자 표기법으로는 'XVII'이며 순서 수사형태는 '십칠탄(第十七)'이고, 아라비아 숫자에서 표현하면 7+10과 같다.
  num.six:
    label: 여섯
    summary: 숫자 6, 벌집은 육각형 셀을 가지고 있다.
    info: 육각수는 '완전한 수'로 간주되는데, 모든 약수(1 + 2 + 3 = 6)의 합이 자기 자신과 같다. 육각형 형태는 면적을 가장 효율적으로 타일링하는 방법이다.
  num.sixteen:
    label: 열여섯
    summary: 정수 16; 순서 표현 시 열 여덟 째; 로마 자릿값 기호 XVI
    info: 숫자 16은 자연수로 숫자 15 다음에 오고 숫자 17 이전이다. 로마자 표기법으로는 'XVI'이며 순서 수사형태인 경우 'sixteenth(십육 번째)'가 된다.
  num.ten:
    label: 십
    summary: 숫자 10, 우리 십진법 수학 체계의 기초입니다.
    info: 십은 손에 총 열 개의 손가락이 있기 때문에 십진법의 기본값으로 사용됩니다. 인류 역사에서 오래전부터 카운팅을 위한 자연스러운 단위로 사용되어 왔습니다.
  num.thirteen:
    label: 십삼
    summary: '''13''이라는 카디널 넘버; 순위 형식: thirteenth(한글 기준); 로마 자릿값: XIII.'
    info: "숫자 십삼은 자연수로, 숫자 이십이 다음에 오고 숫자 사전 전이다.\r\n 로마자 표기법으로는 'XIII'이며 순서 수사형태는 'thirteenth'(한글 기준)이고,\r\n 십진법에서는 3과 10의 합인 형태로 표현된다."
  num.thirty:
    label: thirty
    summary: 카디널 번호인 30
    info: |-
      숫자 30은 자연수로 숫자 29 다음에 오고 31 이전이다.
       로마자 표기법으로는 'XXX'이고 순서 수사형태(ordinal)는 'triacontagonos'이며 십진법에서는 30이라고 쓴다.
  num.thirty_eight:
    label: 서른여덟
    summary: '카디널 수 38; 순위 표현: 서른두 번째; 로마식 기호: XXXVIII'
    info: 숫자 38은 자연수로 숫자 37 다음에 오고 숫자 39 이전입니다. 로마자 표기법에서는 'XXXVIII'으로 나타냅니다.
  num.thirty_five:
    label: 서른 다섯
    summary: 카디널 번호 35; 순위 표현은 서른다섯째이며, 로마 자릿값으로는 XXXV 입니다.
    info: 숫자 35는 자연수로 숫자 34 다음에 오고 숫자 36 이전입니다. 로마자 수치에서는 'XXXV'라고 표기됩니다.
  num.thirty_four:
    label: 스물넷
    summary: '정확한 정수값 34; 순위표현: 스무네이번 째(트리체르타 포테스트); 로마식 기호: XXXIV'
    info: 숫자 34는 자연수로 숫자 33 다음에 오고 35 이전입니다. 로마자 표기법은 'XXXIV'이며 순서 수사형으로는 '삼십 사 번째', 즉 '트리체르티 테세스트'(thirty-fourth)라고 표현됩니다.
  num.thirty_nine:
    label: 스물아홉
    summary: 정수 39; 서수가 스물아홉 번째이고 로마 자릿수는 XXXIX입니다.
    info: 숫자 39는 자연수로 숫자 38 다음에 오고 숫자 40 전이다. 로마자 표기법은 'XXXIX'이며 순서 수사형으로는 '삼십구 번째', 즉 '세 번째 아홉 번째'를 의미한다.
  num.thirty_one:
    label: 스물한
    summary: 순번 수사 31; 서수가 스물하나 째이며, 로마식으로는 XXXI다.
    info: 숫자 31은 자연수로 숫자 30 다음에 오고 숫자 32 이전이다. 로마자 표기법에서는 'XXXI'를 사용한다. 순서 수사로서는 '삼십일 번째', 즉 'thirty-first'가 된다.
  num.thirty_seven:
    label: 스물 일곱
    summary: 순수적인 수치인 스물칠(37); 순위 형식은 삼십일곱 번째; 로마 자릿값 기호는 XXXVII
    info: |-
      숫자 37은 자연수로 숫자 36 다음에 오고 숫자 38 이전이다.
       로마자 표기법에서는 'XXXVII'이며 순서 수사형으로는 '삼십일곱 번째'가 된다.
       십진법에서의 표현 방식은 7과 30을 더한 형태다.
  num.thirty_six:
    label: 스물여섯
    summary: '정량 수사 36; 순차 표현: 스무번째 여섯번 째; 로마식 기호: XXXVI.'
    info: 숫자 36은 자연수로 숫자 35 다음에 오고 숫자 37 이전이다. 로마자 표기법으로는 'XXXVI'이며 순서 수사형태인 관계대명사는 '삼십육 번째', 십진법에서는 6과 30의 합을 나타낸다.
  num.thirty_three:
    label: 스물셋
    summary: 정확히 말하면 스물셋(순번으로 삼십 세 번째)
    info: |-
      숫자 33은 자연수로 숫자 32 다음에 오고 숫자 34 이전이다.
       로마자 수는 'XXXIII'이며 순서를 나타내면 '삼십세 번째'가 된다.
       십진법에서는 3과 30을 더한 형태로 표기된다.
  num.thirty_two:
    label: 스물둘
    summary: 정확한 수량을 나타내는 수사인 스물두와 그의 순서를 의미하는 삼십이 번째 그리고 로마식 기호인 XXXII
    info: |-
      숫자 32는 자연수로 숫자 31 다음에 오고 숫자 33 이전이다.
       로마자 표기법은 'XXXII'이며 순서 수사형으로는 '삼십이 번째', 십진법에서는 2+30 형태로 표현된다.
  num.three:
    label: 세
    summary: 숫자 3, 첫 번째 홀수 소수입니다.
    info: 세는 많은 문화에서 마법적인 숫자로 여겨집니다— 세 가지 소원이 있는 동화 이야기가 있고 삼각형은 세 변을 가지고 있으며 하루는 세 부분으로 나뉩니다.
  num.twelve:
    label: dvanaest
    summary: |-
      정확한 수량을 나타내는 정수인 십이(12); 순서를 의미하는 데 사용되는 ordinal은 dvanačtý이며,
      románksy 기호는 XII입니다.
    info: |-
      숫자 12는 자연수로 숫자 11 다음에 오고 13 이전이다.
      십진법에서는 'XII' 로 표기된다.
      desítkové soustava에서 표현하면 2+10이 된다.
  num.twenty:
    label: двадцать
    summary: 기본 수사 20
    info: |-
      숫자 20은 자연수로 숫자 19 다음에 오고 숫자 21 이전이다.
      십진법에서는 'XX'와 같이 로마자리수가 사용된다.
  num.twenty_eight:
    label: 스물여덞
    summary: 기수 스물아홉(28); 서수가 스무 번째 여덟째인 경우
    info: 숫자 28은 자연수로 숫자 27 다음에 오고 29 이전입니다. 로마자 수는 'XXVIII'이며 순서를 나타내면 '이십팔째', 즉 '두 번째 여덟 씩 끊어서 표현한 것'을 의미합니다.
  num.twenty_five:
    label: 스물 다섯
    summary: 기수법으로 스무다섯(25), 서수가 스웨이티피프쓰디미오(dvacátý pátý)이며, 로마 자릿수로는 XXV입니다.
    info: 숫자 25는 자연수로 숫자 24 다음에 오고 숫자 26 전이다. 로마 수자로는 'XXV'가 된다.
  num.twenty_four:
    label: 이십사
    summary: 정확히 말하면 24라는 카디널 넘버이고, 라틴어식 기록 방식에서는 XXIV가 됩니다.
    info: 숫자 24는 자연수로 숫자 23 다음에 오고 숫자 25 이전입니다. 로마자 표기법은 'XXIV'이며 순서 수사형으로는 '이십네 번째', 즉 두 자리의 천 단위와 네 개를 더한 형태인 십진수 시스템에서 표현됩니다.
  num.twenty_nine:
    label: 스물아홉
