      숫자 21은 자연수로 숫자 20 다음에 오고 숫자 22 이전이다.
       로마자 표기법으로는 'XXI'이며 순서 수사형태는 '이십일 번째', 십진법에서는 1+20 형태로 표현된다.
  num.twenty_seven:
    label: ' двадцать семь'
