lang: ko
pivot: false
title: 숫자 1-10
cards:
  num.eight:
    label: 여덟
    summary: 숫자 8, 문어는 팔이 여덟 개다.
    info: 팔은 2³(두 세제곱)이다. 거꾸로 놓인 8(∞)은 무한의 기호이며, 중국 문화에서는 가장 행복한 숫자 중 하나로 여겨진다.
  num.five:
    label: 다섯
    summary: 숫자 5, 손에 있는 손가락 수입니다.
    info: 십진법은 다섯을 기반으로 합니다. 왜냐하면 사람들은 한쪽 손마다 다섯 개의 손가락이 있기 때문입니다. 화성(Venus)은 하늘에서 오각별 모양의 궤적을 그립니다.
  num.four:
    label: 네
    summary: 숫자 4, 네 변이 있는 정사각형.
    info: 네는 두 수의 제곱으로 나온 결과이다(2×2). 일본과 중국 문화에서 이 숫자는 불길한 것으로 여겨진다(발음이 '죽음'이라는 단어와 비슷하기 때문).
  num.nine:
    label: 아홉
    summary: 숫자 9, 마지막 한 자리 수.
    info: 아홉은 가장 큰 한 자리 숫자입니다. 흥미로운 특징으로는 아홉과 곱해진 모든 수의 자릿수 합이 항상 아홉으로 나누어 떨어집니다.
  num.one:
    label: 하나
    summary: 숫자 1, 첫 번째 자연수입니다.
    info: 일은 가장 작은 자연수입니다. 어떤 수든 일과 곱해져도 값이 변하지 않기 때문에 '곱셈의 항등원'이라고 불립니다.
  num.seven:
    label: 일곱
    summary: 숫자 7, 무지개는 일곱 가지 색을 가지고 있습니다.
    info: 일곱은 많은 문화에서 행운의 숫자로 여겨집니다. 무지개에는 일곱 개의 색이 있고, 주(week)에도 일곱 날짜가 있으며, 지구에는 일곱 대륙이 존재합니다.
  num.six:
    label: 여섯
    summary: 숫자 6, 벌집은 육각형 셀을 가지고 있다.
    info: 육각수는 '완전한 수'로 간주되는데, 모든 약수(1 + 2 + 3 = 6)의 합이 자기 자신과 같다. 육각형 형태는 면적을 가장 효율적으로 타일링하는 방법이다.
  num.ten:
    label: 십
    summary: 숫자 10, 우리 십진법 수학 체계의 기초입니다.
    info: 십은 손에 총 열 개의 손가락이 있기 때문에 십진법의 기본값으로 사용됩니다. 인류 역사에서 오래전부터 카운팅을 위한 자연스러운 단위로 사용되어 왔습니다.
  num.three:
    label: 세
    summary: 숫자 3, 첫 번째 홀수 소수입니다.
    info: 세는 많은 문화에서 마법적인 숫자로 여겨집니다— 세 가지 소원이 있는 동화 이야기가 있고 삼각형은 세 변을 가지고 있으며 하루는 세 부분으로 나뉩니다.
  num.two:
    label: 두
    summary: 숫자 2, 유일한 짝수 소수입니다.
    info: 두는 유일한 짝수인 소수이며, 이진법(0과 1로 이루어진 수 체계)의 기초가 되며 모든 컴퓨터가 작동하는 데 사용됩니다.
