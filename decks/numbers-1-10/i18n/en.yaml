lang: en
pivot: true
title: Numbers 1–10
cards:
  num.eight:
    label: eight
    summary: The number 8, an octopus has eight arms.
    info: Eight is 2³ (two to the power of three). An inverted eight (∞) is the symbol for infinity; in Chinese culture, eight is considered the luckiest number.
  num.eighteen:
    label: Eighteen
    summary: Number Eighteen
    info: The number 18 is an integer that follows 17 and precedes 19 on the natural numbers scale. In Roman numerals it's written as 'XVIII', while its ordinal form becomes 'eighteenth'. When expressed within decimal system notation rules we get eight plus ten.
  num.eleven:
    label: eleven
    summary: Number 11
    info: The number 11 is part of natural numbers that follow after ten before twelve comes along.
  num.fifteen:
    label: fifteen
    summary: Number十五；ordinal：第十五位；罗马数字表示为XV。
    info: The number 15 is part of natural numbers that follow after 14 before reaching 16 within decimal system where it's written down using digits representing five plus ten.
  num.fifty:
    label: Fifty
    summary: Cardinal Number Fifty
    info: The number 50 is part of natural numbers that follow after 49 before reaching 51 within decimal system representation where it's written simply 'fifty'. In Roman numerals equivalent to letter combination “L” representing value exactly equaling modern numerical expression for five times ten.
  num.five:
    label: five
    summary: The number 5, that's how many fingers we have on our hand.
    info: Five is the basis for the decimal numbering system because humans have five fingers on each hand. The planet Venus traces a five-pointed star across the sky.
  num.forty:
    label: forty
    summary: Cardinal fourtieth
    info: The number 40 is a natural integer that follows 39 and precedes 41. In Roman numerals it's written as XL.
  num.forty_eight:
    label: forty eight
    summary: Cardinal Number Forty-Eight
    info: The number 48 is part of natural numbers that follows after 47 before reaching up to reach towards achieving higher goals such as becoming an expert at something.
  num.forty_five:
    label: forty five
    summary: Number cardinals - Forty Five
    info: The number 45 is part of natural numbers that follow after 44 before reaching 46 within our numerical system used daily for counting objects around us like people at an event etc.
  num.forty_four:
    label: Forty Four
    summary: Number Forty-Four
    info: The number 44 is an integer that follows 43 and precedes 45 on the natural numbers scale. Its Roman numerals representation is XLIV while its ordinal form reads 'forty fourth'. In decimal notation it can be expressed by adding up four plus forty.
  num.forty_nine:
    label: forty nine
    summary: Cardinal Number Forty-Nine
    info: The number 49 is part of natural numbers that follows after 48 before reaching up to fifty.
  num.forty_one:
    label: Forty One
    summary: Cardinal Number Forty-One
    info: The number 41 is part of natural numbers that follow after 40 before reaching 42. In Roman numerals it's written as 'XLI'. Its ordinal form reads ‘forty-first’. When expressed within decimal system notation format we write down its value by adding up units like so - just simply put together digits representing tens plus ones which gives us total sum equaling to exactly fourteens added onto single unit making overall result being precisely known quantity amount called out loud verbally speaking when counting things sequentially.
  num.forty_seven:
    label: fourteen
    summary: Number cardinals for fourteen
    info: The number 47 is a natural integer that follows 46 and precedes 48. Its Roman numeral representation is XLVII, while its ordinal form is 'forty-seventh'. In decimal notation it can be expressed as seven plus four tens.
  num.forty_six:
    label: forty-six
    summary: Cardinal Number Forty-Six
    info: The number 46 is an integer that follows 45 and precedes 47. Its Roman numerals form is written as 'XLVI'. In decimal notation it can be expressed by adding six to four tens.
  num.forty_three:
    label: forty-three
    summary: Cardinal figure for fourteens plus threes equals thirtyseven.
    info: The number 43 is part of natural numbers that follow after 42 before reaching up to but not including yet another integer which would be known simply by adding just three more units onto it making them total altogether fifty-seven digits long when written out fully using only Arabic numerals without any other symbols included at all.
  num.forty_two:
    label: forty two
    summary: Cardinal number 42
    info: The number 42 is a natural number that follows 41 and precedes 43. Its Roman numeral representation is XLII.
  num.four:
    label: four
    summary: The number 4; a square has four sides.
    info: Four is two squared—the result of 2 × 2. In Japanese and Chinese culture, it is considered an unlucky number (its pronunciation resembles the word for 'death').
  num.fourteen:
    label: fourteen
    summary: Numeral for quantity 'Fourteen'; ordinal form - Fourteenth ; Roman Numeral representation – IV.
    info: The number 14 is part of natural numbers that follow after thirteen before fifteen comes up next on our counting scale system here we use base ten numerals which means it's written down using four plus another digit representing value equaling exactly what would be expressed by adding together digits worth different amounts depending upon their position within any given numerical expression.
  num.nine:
    label: nine
    summary: The number 9, last single-digit number.
    info: 'Nine is the highest single-digit number. A remarkable property: any number multiplied by nine has a digit sum that is always divisible by nine.'
  num.nineteen:
    label: nineteen
    summary: Number 19
    info: The number 19 is part of natural numbers that follow after 18 before reaching 20.
  num.one:
    label: one
    summary: The number 1, first natural number.
    info: One is the smallest natural number. Any number multiplied by one remains unchanged; therefore, it is called the 'neutral element of multiplication'.
  num.seven:
    label: seven
    summary: The number 7; there are that many colors in a rainbow.
    info: Seven is considered a lucky number in many cultures. A rainbow has seven colors, a week consists of seven days, and there are seven continents.
  num.seventeen:
    label: seventeen
    summary: Cardinal Number Seventeen
    info: The number 17 is part of natural numbers following after sixteen before eighteen.
  num.six:
    label: six
    summary: The number 6; beehives have hexagonal cells.
    info: Six is considered a 'perfect number' because it equals the sum of all its divisors (1 + 2 + 3 = 6). Hexagonal shapes provide the most efficient way to tile an area.
  num.sixteen:
    label: sixteen
    summary: Cardinal number sixteenth
    info: The number 16 is a natural number that follows 15 and precedes 17. Its Roman numeral representation is XVI.
  num.ten:
    label: ten
    summary: The number 10, base of our decimal numbering system.
    info: Ten is the basis of the decimal system because humans have a total of ten fingers on their hands. Ten has been a natural measure for counting since ancient times.
  num.thirteen:
    label: thirteen
    summary: Number十三；序数：第十三个
    info: The number 13 is part of natural numbers following after twelve before fourteen.
  num.thirty:
    label: Thirty
    summary: Cardinal Number Thirty
    info: The number 30 is part of natural numbers that follow after 29 before reaching 31 within decimal system representation where it's written simply 'thirty'. In Roman numerals equivalent to three tens combined together forming symbol for value - XX plus X equals total amount represented by letter combination known widely across Europe since ancient times.
  num.thirty_eight:
    label: thirty eight
    summary: Cardinal Number Thirty-Eight
    info: The number 38 is part of natural numbers that follow after 37 before reaching 39 within numerical sequences used globally today for counting purposes such as mathematics education materials like these very cards you're studying now.
  num.thirty_five:
    label: thirtyfive
    summary: Cardinal Number Thirty-Five
    info: The number 35 is part of natural numbers that follows after 34 before reaching 36 within numerical sequence progression on base ten system where it's expressed by adding together five units plus three tens.
  num.thirty_four:
    label: thirty four
    summary: Cardinal number 34
    info: The number 34 is an integer that follows the number 33 and precedes the number 35. Its Roman numeral representation is XXXIV.
  num.thirty_nine:
    label: thirty nine
    summary: Number cardinals for 39
    info: The number 39 is an integer that follows 38 and precedes 40 on the natural numbers scale. Its Roman numerals representation is written as 'XXXIX'. In ordinal form it's called thirtieth ninth.
  num.thirty_one:
    label: thirty-one
    summary: Number cardinals for numbers up to ten
    info: The number 31 is a natural number that follows 30 and precedes 32. Its Roman numeral representation is XXXI. In decimal form it can be written down as 'one plus thirty'.
  num.thirty_seven:
    label: thirty seven
    summary: Number cardinal form 'Thirty Seven'; ordinal forms include thirtieth seventh when referring to positions rather than quantities directly.
    info: The number 37 is part of natural numbers that follows after 36 before reaching 38 within numerical sequences used globally today for counting purposes such as mathematics education materials like these cards designed specifically around numeracy skills development among learners at various stages including early childhood through adolescence.
  num.thirty_six:
    label: thirty six
    summary: Number cardinals for 'sixty' can be written using Roman numerals such as XXL.
    info: The natural number following 35 is followed by numbers up to three hundred sixty-seven.
  num.thirty_three:
    label: thirty-three
    summary: Cardinal figure for 'three tens' which can also be expressed numerically using Roman digits such that each digit represents its place value.
    info: The natural number after 32 is followed by the next integer before it becomes even again at position three plus ten times two equals forty-two.
  num.thirty_two:
    label: thirty two
    summary: Number cardinals for three dozens plus another couple units
    info: The number 32 is an integer that follows 31 and precedes 33 on the natural numbers scale. Its Roman numerals representation is written as 'XXXII'. In ordinal form it's called thirtieth second.
  num.three:
    label: three
    summary: The number 3, the first odd prime number.
    info: Three is considered a magical number in many cultures—there are fairy tales about three wishes, triangles have three sides, and the day is divided into three parts.
  num.twelve:
    label: twelve
    summary: Cardinal Number Twelve
    info: The number 12 is part of natural numbers that follow after eleven before thirteen comes up next on your list when counting sequentially through them all together at once without skipping any steps along either side path taken during such an exercise involving only basic arithmetic operations like addition subtraction multiplication division etcetera.
  num.twenty:
    label: twenty
    summary: Cardinal figure representing quantity equivalent exactly matching count obtained through adding digit zero placed right side adjacent position relative base unit multiplied twice.
    info: The number 20 is part of natural numbers following after 19 before reaching up to next integer which would be represented by symbol 'XX' when using Roman numerals system where it stands for value two times ten added together.
  num.twenty_eight:
    label: twenty eight
    summary: Number cardinals for 'two' plus ten times two equals thirty.
    info: The number 28 is part of natural numbers that follows after 27 before reaching up to reach towards achieving higher goals like becoming an expert at something new every day.
  num.twenty_five:
    label: twenty
    summary: Number cardinals for 'five' can also represent ordinal positions such tenth first.
    info: The natural numbers before it is 24 followed by after which comes to be written down using decimal notation like five plus two tens.
  num.twenty_four:
    label: twentyfour
    summary: Number cardinals for numbers up to ten
    info: The number 24 is a natural number that follows 23 and precedes 25. Its Roman numeral representation is XXIV. In decimal form it can be written down like four plus two tens.
  num.twenty_nine:
    label: twenty nine
    summary: Number cardinals for 'two' - ninety
    info: The number 29 is written after the natural numbers 27 and before 30.
  num.twenty_one:
    label: Twenty One
    summary: Number Twenty-One
    info: The number 21 is part of natural numbers that follow after 20 before reaching 22. In Roman numerals it's written as 'XXI'. When used for ordering items sequentially within lists or sequences its ordinal form becomes important - here being expressed simply yet clearly through spoken language where we say something like “twenty-first”. This value can also be represented mathematically using base ten arithmetic by adding together two distinct quantities namely zero plus twenty.
  num.twenty_seven:
    label: twenty seven
    summary: Cardinal figure representing quantity exactly equaling two tens plus another single unit making up total value amount equivalent precisely matching what would be written numerically using digits '2' followed directly by digit symbolizing individual units being added together resulting final outcome expressed clearly through spoken language form known commonly among native speakers worldwide.
    info: The number 27 is part of natural numbers that follow after 26 before reaching 28 within counting sequences used globally today across various languages including but not limited to mathematics contexts where it might represent quantities such as objects counted during inventory checks at stores like supermarkets which often use numerical systems for tracking stock levels efficiently.
  num.twenty_six:
    label: twenty six
    summary: Cardinal Number 26
    info: The natural numbers before it is 25 followed by after which comes to be written down using ten digits.
  num.twenty_three:
    label: twenty three
    summary: Number cardinals include 'Twenty Three' which can also be written using Roman numerals such as XXIII.
    info: The number 23 is part of natural numbers that follow after 22 before reaching 24 within our numerical system used daily for counting objects around us like people at an event etcetera.
  num.twenty_two:
    label: twenty two
    summary: Number cardinals for 'two' plus ten times more than that.
    info: The natural numbers before it is 21 followed by after which comes to be written down using decimal notation.
  num.two:
    label: two
    summary: The number 2, the only even prime number.
    info: Two is the only even prime number and serves as the base for the binary system, which underlies all computer operations.
