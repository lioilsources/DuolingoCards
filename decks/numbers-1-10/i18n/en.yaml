lang: en
pivot: false
title: Numbers 1–10
cards:
  num.eight:
    label: eight
    summary: The number 8, an octopus has eight arms.
    info: Eight is 2³ (two to the power of three). An inverted eight (∞) is the symbol for infinity; in Chinese culture, eight is considered the luckiest number.
  num.five:
    label: five
    summary: The number 5, that's how many fingers we have on our hand.
    info: Five is the basis for the decimal numbering system because humans have five fingers on each hand. The planet Venus traces a five-pointed star across the sky.
  num.four:
    label: four
    summary: The number 4; a square has four sides.
    info: Four is two squared—the result of 2 × 2. In Japanese and Chinese culture, it is considered an unlucky number (its pronunciation resembles the word for 'death').
  num.nine:
    label: nine
    summary: The number 9, last single-digit number.
    info: 'Nine is the highest single-digit number. A remarkable property: any number multiplied by nine has a digit sum that is always divisible by nine.'
  num.one:
    label: one
    summary: The number 1, first natural number.
    info: One is the smallest natural number. Any number multiplied by one remains unchanged; therefore, it is called the 'neutral element of multiplication'.
  num.seven:
    label: seven
    summary: The number 7; there are that many colors in a rainbow.
    info: Seven is considered a lucky number in many cultures. A rainbow has seven colors, a week consists of seven days, and there are seven continents.
  num.six:
    label: six
    summary: The number 6; beehives have hexagonal cells.
    info: Six is considered a 'perfect number' because it equals the sum of all its divisors (1 + 2 + 3 = 6). Hexagonal shapes provide the most efficient way to tile an area.
  num.ten:
    label: ten
    summary: The number 10, base of our decimal numbering system.
    info: Ten is the basis of the decimal system because humans have a total of ten fingers on their hands. Ten has been a natural measure for counting since ancient times.
  num.three:
    label: three
    summary: The number 3, the first odd prime number.
    info: Three is considered a magical number in many cultures—there are fairy tales about three wishes, triangles have three sides, and the day is divided into three parts.
  num.two:
    label: two
    summary: The number 2, the only even prime number.
    info: Two is the only even prime number and serves as the base for the binary system, which underlies all computer operations.
