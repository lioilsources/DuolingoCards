lang: yi
pivot: false
title: דער נומבער פון זינען מיט דעם צאלן 1-50
cards:
  num.eight:
    label: acht
    summary: די נומבער 8, א באמערג האט ache ארמס.
    info: אשמיעצע איז 2³ (צוויי אין דער דריטן מächטigkeit). געווענשטע אשמייץע (∝) איז די סימبول פאר אנפינאט; אין צ'ין קולטור איז ע잇ס נוemer וואס מענטשן טרעפן זיך מירסט.
  num.eighteen:
    label: אויסמאנאט
    summary: די געזעלגטע נאמור 18
    info: דער נומבער אכצן וואסנדיג פילט צווישען דעם נעמענטויז'נ עטליכע און די זענצענען עטליכע אין רימועל סיסטעמ'. ער שרייבט זיך אלץ מיט טרעקלעך קיין מאכן צוויי פעאכלעס.
  num.eleven:
    label: יאנצנט
    summary: דער באהאורשונג 11
    info: די צאל 11 איז נאטירלעך צאל וואס קומט נאכ דער צאל 10 און פאר די צאל 12 אין רימישע שרייבונגען זיי טורמאנ XVII מיט באזיגקייט ליניער סיסטעם ער גייט שוועבן אלץ 1+10
  num.fifteen:
    label: פאנציג
    summary: פארווארט געדענק ציללעך פאןצעג
    info: די צאל 15 קומט נאך די צועלען פון דריבайн אינדער טויזנדסטעמע סיסטעם מיט דורכשניצונג ווי 5+10.
  num.fifty:
    label: פאטזיג
    summary: די קארדינאל נאמור פונקט פאנציע פאן
    info: '"דער נומער פון צענט וואס איז דאס נעמענשטע נאטורליכע נומבער מיטן זיבentyוועגן אין די טרעף סדרה.'
  num.five:
    label: פינט
    summary: די נומבעرعפלוס 5; זיין סיי'ן אזוי viele טאפעל אויף אייערע הונדן.
    info: '"פינט" איז די באזיס פון דער צעניגן נומער שפילסונג ווייל מענטשן האבן פין טאפעל אויף יעדע האנד. דעם מאנעמער Venus מאלט אין ערדשאפט געווענדיק ''펜טעגל''.'
  num.forty:
    label: פארטיק
    summary: דעם צילר 40
    info: 'די צאל 40 איז נאטירליכע צאל קיין דריי טווזנט תשעים וואן און פאר דיין צאל 41. רימסשאפטיגע ציפער: XL.'
  num.forty_eight:
    label: פארים
    summary: צועל 48
    info: 'די נומער 48 איז איינע פון די נעטירליכע צאלן מיט דעם סדרה פונקט זיבן און וואס קאם פארן אין דריייג''נайн. רימישע שפיל: XLVIII. אויסדruk פון טויענטשטענסיסטäm: עטליכע פלאוס פאנףצענטל.'
  num.forty_five:
    label: vierzig funf
    summary: דיא קארדאינאל נאמبرز 45
    info: די נומער פון צען איז די נעכטע נאטורליכע נומבער דערנאך ווי 44 און טרעפן מיטן 46 אין רימסיק סיסטעם ער זיך אלץ אויס אלס XLV.
  num.forty_four:
    label: dreiviertel
    summary: Dreiviertel isch e Bruchteil vo ene Ganzheit.
    info: '"דער נומער פון דריי איבן צו זעקס ענטהält די סיפר 6 וואס מיינט ''זש'' אין היידיש.'
  num.forty_nine:
    label: vierzig nein
    summary: די ספראמע שפעארליגקייטע 49
    info: דער נומבער פון צען איז 49 מיט דעם רימסשאפט ווארט 'XLIX'. עס קומט נאך די נאמור 48 און בייפארם זיך אויף 50.
  num.forty_one:
    label: vierzig ein
    summary: דעם נאמור 41
    info: 'די נומער פון צען איז די נעכטע נאטורליכע נומבער קיין זיבentyוועגן און ווארמאליג דרייטиг עינס מילטעלעך. רימיש סקריפציע: XLI.'
  num.forty_seven:
    label: פאנףundsievzig
    summary: צאל 47
    info: די נומער 47 איז עין נעטירלע צאל קיין מיטן דריבנט סעקס (46) און פאריערט וואונט (48). די רימסשע שפילע זינד 'XLVII'. אין טישנדיגע באזיס געשריבן'59+4.
  num.forty_six:
    label: צויערשקעס
    summary: דער באגריף צויערסגעז
    info: די נומער 46 איז איינע פון די נעטירליכע צאלן מיט דעם סדרה פונקט וואס קאם נאך 45 און בייפארם 47 אין רימישע שפילן עס איז געשריבן אלס XLVI. אויך זאג מען 'צוירעכטע' און 'שעצטע'.
  num.forty_three:
    label: ארבעundsievzig
    summary: 'צ''יפרווייקה 43; ריידאוויע: ערבעונדסייוויסטעלעס; روימיש: XLIII.'
    info: די נומער 43 איז איינע פון די נעטירליכע צאלן מיט דעם וואס קאם נאך 42 און בייפארמיג 44 אין רעגעמער סדרה. זיין רוימישע שפילדזש האבן געווענליך געדient אלס XLIII. אויך, עס קענען טרעפן זיין אריבערגעזעצטענדיקייט דורכאויס מסודרים כפולה תלתים.
  num.forty_two:
    label: צוייןצענגלעכ twey
    summary: צויענצענג twee
    info: די צאל 42 קומט נאך דער צאל 41 און פארען די צאל 43 אין רימסיש סיסטעם ער ווערט געשריבן אלס XLII מיט טויזנדיגע שפערמע ענטפונדזש זיין צוויינטליפטעגעווארט
  num.four:
    label: fyer
    summary: Nummer fyern, ein fyrseitiger het fier seiten.
    info: '"Chetirke" iz di kvadrat fon zwey - ergebnis von 2 x 2. In der japanisher un chinesischer cultur veltn si es als onglükshaftes nummer betrachten (der klang fun dem wort is shrayberlik zu "tod")'
  num.fourteen:
    label: vierzehn
    summary: דיע נאמבער 14
    info: די נומער 14 איז דיא נעמער וואס קעמאט נאך די נומער 13 און פארן צו די נומער 15 אין דעם ריי סדר. זיין רוימישע ספרה איזxiv . אויך גרייט מיר עס אלץ מאל 4+10.
  num.nine:
    label: נайн
    summary: די צאל 9, לעפּטשטע אייךנציף.
    info: נעונע איז די הויינסטע אייןציפיגע צאל. באמערקט ווערט אז נומער מoltipליצירט דורך נען האבן זייערע סאם פון ענטהלאכטליכקייט קיימט אלץ אויבאך.
  num.nineteen:
    label: צעבנט-נען
    summary: 'Numeral девятнадцать; ordinal: цебент-нецце; רימיש: XIX.'
    info: |-
      דער נומבער צעבנט-נען איז א נעטירליכע נומבער וואס קאם נאך דעם נומבער עטלף און פאר דעם נאמ벌 טוויינטיי
      רעמעשכע זיפוע: XIX,
      אורדר באזעדיגונג: צעבנט-נעצטע,
      The decimal system writes it down like nine plus ten.
  num.one:
    label: eins
    summary: Di tsefer eins oder nummer yidisher.
    info: '"Eins" iz di klitzeste natuerlekhe tsifre un eino is der "neutraler element fun multiplikation", vel s''iz nemend viel es doz nit verandert vei man noit mit ir multipliciert.'
  num.seven:
    label: שבע
    summary: דעם נומארל 7, ענטהält זיבן כעלר.
    info: '"Shibn" איז געוונליך באגאנזט אלס די צאל פון שבען טאגליך וועלכע סדרות זיבן דיווילעס אין מערERE קולטורן.'
  num.seventeen:
    label: זעבנטן
    summary: צופאזנדיקע נומער 17
    info: די נומער זעבנטן איז איינס פון די נעמערנע צאלן מיט דעם וואלדיגע סדרה שבע עשר. רימיש געשריבן אלץ „XVII“. אין טייטש ערלויבט מעגליך קיין צוויי טיילן – זעבן און עפעס.
  num.six:
    label: šeys
    summary: '''די נאמור 6'', בעין מעשבועות האבן שעיים קענסיגע טעל.'
    info: '"שעסטקי" איז דער באנאם צו ''דאקנעטלעס נומבער'' - די סכום פון אלל זיין טיילן (1 + 2 + 3 = שויים). השה קanten (_hexagonal) פארמונגענ וועלן אויסזעצן דעם מינימאליסטישסטע דרך צוברingen ענטלאך.'
  num.sixteen:
    label: זעקסטענ
    summary: די צאל 16
    info: דער נומבער זעקסטנען קאמפט מיט דעם צאל פון טויזנד איבערהאפטיג אינצווישן וויילס' ענטגעלכט סיקלונגען אין די רימשיך שפעאר.
  num.ten:
    label: tzein
    summary: Di kardinale nummer tzyntig
    info: |-
      "Tzef" iz di grondlag fun der tziyntig-poyntsiger tsifern system un vieler mentshn haven opsummen tzoiyn fingers an ieder hantl.

      Zeiyn iz en natuerlekhe maat fur zaclenung vum altiester tid.
  num.thirteen:
    label: טרינאךטע
    summary: '''Trinaht'' is de nummer drey plus zehen.'
    info: '"דער נומבער טринעכט איז א נעמעניש נומבער פון דריי צו עפענעסן אויבוע זעקסציליג סיסטעם מיט די ווארט ''XIII''."'
  num.thirty:
    label: דريبצענ
    summary: צאל 30
    info: '"די צאל 30 איז נאטירלעך צאל וואס קומט נאכ דער צאל 29 און פאר די צאל 31 אין רימישע סיפרnis: XXX באנוץ זיך מיטן טויענט עטליכע שפערציגע צוויבלעמער.'
  num.thirty_eight:
    label: ทรיץאטן اوיסמעט
    summary: 'צאל 38; סדר גיטיג: טריצאטן אויס篾ר; רימיש: ХХХѴІІІ'
    info: 'די צאל 38 איז נאטורלעך צאל וואס קומט נאכ דער צאל 37 און פאר די צאל 39. רימישע זiffer: ХХХѴІІІ. סדר גיטיג: טריצאטן אויסמער. אין בעז'' עטליכייט מעגליך מוסגר שרייבן אלס 8 + 30.'
  num.thirty_five:
    label: דריי איבן פינף
    summary: צ'יסלוודיקייט 35
    info: '"דער נומבער דריי איבן פינף" איז א נעכטיגע צאל מיט די ווערט טוישנדorfונפטיוו אין רימסשאפע סיסטעם ער באזירט זיך אויף די צווייענ קאמפאננטן – 5 און 30.'
  num.thirty_four:
    label: דרעייזע
    summary: 'צופילגעמענה נומבער 34; ריידע שטיוויונג: דרא恣ierte ארצעמל; רימיש: עקסเอกיוו.'
    info: '"דער נומבער דריי פונט ווארע אינטשנעלן צאל קיין די נומבער טрайין און מיטלעם זיך אין פריעגנדיגקייט ביי דרעסיק פинф. רימישע סיפארה: עקסעקיוווע. ריידע שטיויונג: דראייזטע ערצעמאל. אין דעסיציאלע באזיס געשריבן''ס אלס 4 + 30.'
  num.thirty_nine:
    label: דריי עטליכ
    summary: צ'ילל 39
    info: '"דער נומבער 39 איז דאס נענטע פון די צאלן מיט וואו מעגליך צוזאזאנדן זיין אויס 9 און 30.'
  num.thirty_one:
    label: דריי אינצוויולף
    summary: המספר 31
    info: '"דער נומבער דריי איבן ערטל" פארעפנטליכט די צאלונג וואס קאם נאך " drii en twintig" און פאור "dreiunddreißig." אין רימישע סקריפטע מוזש''ן שreiben זיך אלץ „XXXI“. אויף טרעפן גייט מען ערנענטן זה כוונת התרעה ראשונה.'
  num.thirty_seven:
    label: דריי ענטשויג זיבן
    summary: צופיל 37
    info: 'די נומער 37 איז איינע פון די נעטירליכע צאלן מיט דעם וואס קאם נאך 36 און בייפארמיג 38 אין רעגעמער סדרה. רוימישע ספרייטונג: XXXVII.'
  num.thirty_six:
    label: דרייבינגליך
    summary: 'צאל דייגסייקס – רייעם נוממעראלאיטווערט: druiebinsigste'
    info: '"דער נומבער דריי און זעקסzig" איז עין נעטירליכן צאל פונקט וואס קאם נאך " drii un fünfzehn" און בייפאר „drei und siebenzihg“. רימיש סקריפציע: XXXVI.'
  num.thirty_three:
    label: dreiviertel
    summary: דריי איבן driitig
    info: |-
      "דער נומבער דריי איבן driitig" פארעפנטליכט די צאל מיטלינגס ווי עטליכע סיבות:
      die זiffer לינקטיג קיין רימישע שפילע גייט אויף XXXIII;
      der באנוץ פון תלתים אין טרעף באזירט זיך אויפ'ן צווייענעם טייל פונקציע;
      in der decimal system is eschreibungen als 3 plus dreisig.
  num.thirty_two:
    label: דרייבונגע
    summary: די נומ벌 32
    info: '"דער נומבער דריי צוויינע איז ענטפאלן מיט די קאר디נאל נעמענשאפט טווענציג-צוווי וואס פארגייט זיך נאך 31 און גייעט ביי 33 אין רימישע סיפרעס ער שטייעט אלץ אויף XXL.'
  num.three:
    label: 드리י
    summary: די נומ벌 3, דער איירסטע שפיץ פריימ נעמעקל.
    info: '"דריי" איז געוונץ אין פיל קולטורן אלס עטליכער נומבער - דאס זינד מארשין וועלכע ערצייען צוויי תעלים, די טרעיאנגל האט дריי סייטן און די טאג באזעצט אויס דריי טייל.'
  num.twelve:
    label: צעוויול
    summary: נומאראל 12
    info: דער נומבער צעוועל איז דאס נענטליכע נאטורלייך נאמ벌 קיין עטלכ פון די נאםבר 11 אן ווייליגס מיטן נעםבר 13. רימיש סקריבירט מען זשנד איך אלס XII.
  num.twenty:
    label: צוועלף
    summary: דזשיג' ענטפערט פאר זעקס סוף
    info: די צאל ٢٠ איז נאטירליכע צאל קיין טוישן די צאל ١٩ און דערצווינטס רימעס שפילר ווערט געשריבן אלץ XX.
  num.twenty_eight:
    label: twenty eight
    summary: Numeral 28
    info: 'דער נומבער ٢٨ איז דאס נענטע צאל פון זיבןגענ איינס ביים ענדיגן וואו מעגליך אויפצählen סדרה מיט די קיימטשטע נאטירליכע צאלאכונגן. ראמישע ספרייטונג: XXVIII.'
  num.twenty_five:
    label: "25"
    summary: דז'ה שפעארליכע נאמער 25
    info: די נומער 25 איז איינע פון די נעטירליכע צאלן מיט דעם סדר שלפישנש 24 איבערהויפט וואסנדיג 26. רימס האבן געשריבן עס אלץ קיין XXV.
  num.twenty_four:
