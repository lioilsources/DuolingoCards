lang: eo
pivot: false
title: Nombroj 1-10
cards:
  num.eight:
    label: ok
    summary: Okramena animalo ekzemple estas kalmaro.
    info: La ok estas la dua al kuba potenco de du (₂³ = ₈), sed ankaŭ ĝi havas multajn simbolojn en diversaj kulturaj sistemoj. Turnita ok formo ∞ signifas senfinecon matematike dum en orientalaj landoj oni rigardas ĉi tiun nombron por esti pleje bonŝanca.
  num.eighteen:
    label: deklasete
    summary: Numerale deklasitegxe
    info: La nombro deklasitegxe estas natura numero post la nombro sedanumero kaj antau ol la numbro devtnumerus. Ĝi en romia skriba maniero estis esprimita per XVIIdigitus.
  num.eleven:
    label: dekunuo
    summary: Kardinalnumero ondekk-unu
    info: La nombro 11 estas natura numero post la nombro 10 kaj antauxe al la nombro 12 en dekdigitalo sistemo. Ĝi povas esti skribita kiel 'XI' per romiaj ciferoj.
  num.fifteen:
    label: Kvindek-unuo
    summary: '''Patnaht'' signifas nombron 15.'
    info: La nombro kvindek unu estas natura numero kiu sekvas post la kvatordeko kaj antauas al sesdek. Ĝi en romia skriba maniero ricevis formon de 'XV'. En decimalo ĝi prezentis sumon el plenumado inter naŭ kaj dudek.
  num.fifty:
    label: Kvindek
    summary: Numeralkvindo de kvindek;
    info: La nombro kvindek estas natura numero kiu sekvas post la kvaredok cento kaj antauas al sesdeko unu en decimal sistemo ĝi skribatas kiel '50'. En romiaj ciferoj tio ekzistas per litero 'L', dum ordigo uzante vortojn montras tiun nombron.
  num.five:
    label: kvin
    summary: La numero 5; tio multeblajn fingron ni havas.
    info: Kvin estas bazo de la decimala nombrosistemo ĉar homoj havas kvin fingrojn sur kvarmalo. La planedo Venuso formas stelon kun kvin strangoj en la firmamento.
  num.forty:
    label: Kvardek
    summary: Nombraĵo 40
    info: La nombro kvardek estas natura numero post la tridek naŭ kaj antaux de kvankam unu. En romiaj ciferoj ĝi skribas kiel 'XL'.
  num.forty_eight:
    label: Kvardeko Ok
    summary: Nombra valoro 48 ekzistas ankaŭ per romana cifero "XLVIII".
    info: La nombro kvardek ok is situas inter la numeroj 47 kaj 49 en natura serio de entjeroj. Ĝi estas skribita romane kiel XLVIII kaj ordigite kiel 'la kvaredoka'. En decimalo sistemo temas pri adicio de 8 al 40.
  num.forty_five:
    label: Kvardek kvin
    summary: 'Nombra valoro 45; ordigo: Kvara centr'' unua; Romie: XLV.'
    info: La nombro kvardek kvin estas natura numero post la kvarentre kaj antaux de quardekses. Ĝi en romiaj ciferoj skribasĝXLV kaj en decimalo esprimite temas pri adicio inter kvin kaj kvardek.
  num.forty_four:
    label: Kvardek Kvar
    summary: Numeralkoarolo de 44
    info: La nombro kvardek kvar estas natura numero post la numero tridek tri kaj antauxe al kvindekkvin. Ĝia romana cifero estas XLIV.
  num.forty_nine:
    label: Kvardek Naû
    summary: Numeralkvaredeknaû
    info: La nombro kvardek naŭ estas natura numero post la kvarentriokaj antaux kvindeko. Ĝi en romiaj ciferoj skribasĝXLIX kaj en decimalo esprimite kiel 9+40.
  num.forty_one:
    label: Kvardekmilunua
    summary: 'Numeralkvarkvinmilunu; ordigita: Kvara centra prima; Romana numeracio: XL.'
    info: La nombro kvardek unu estas natura numero inter la kvaredmilo kaj duumila. Ĝi havas romanan ciferecon 'XLI' kaj en decimalo skribiĝas kiel sumo de 1 plus 40.
  num.forty_seven:
    label: Kvardekses
    summary: Numeraleco 47
    info: La nombro kvardek sep estas natura numero post la numero sesdek ok kaj antau de la numero dudek naŭ. Ĝi en romiaj ciferoj skribas kiel XLVII.
  num.forty_six:
    label: Kvarduono Ses
    summary: 'Numerale de 46; Ordinara formo: Kvara centra Sesma ; Romana Skribo : XLVI.'
    info: La nombro kvardek ses estas natura numero post la kvarentripunkto kvin kaj antauxe al la kvaredupunkton sep en decimalo. Ĝi povas esti skribita romane kiel 'XLVI'. En ordigo tio signifus 'kvarecentokta'.
  num.forty_three:
    label: Kvardekkolm
    summary: Numeracio por ekzemplo en ĉiu lingvo.
    info: La nombro kvardek tri estas natura numero inter la duono de dudek kaj kvaredun miloj da aliaj numeradoj.
  num.forty_two:
    label: Kvardek Du
    summary: Numbra valoro 42 ekzistante inter numeroj 41 kaj 43.
    info: La nombro kvardek du venas post la numero kvardekkun kaj antaŭ kvindek tri en naturnumbrado. Ĝi estas skribita romane kiel 'XLII' kaj signifite per adicio de dudeko al kvaredok cento.
  num.four:
    label: kvindo
    summary: Nombrosesenco por kvin.
    info: Kvar estas kvadrato de du - rezulto el la multipliko 2 x 2. En japanaj kaj ĉinaj tradicioj temas pri malelza nombro pro tio ke sonas simile al 'mort'.
  num.fourteen:
    label: kvarete
    summary: Numerale 14 ekzistas anke kiel ordinala kvaredoma kaj romana XVIE.
    info: La nombro kvardek estas natura numero post la tri dekoj kaj antaux kvindeko. Ĝi en romia skriba maniero ricevas per XIVEK, dum por ordigita formo oni uzas 'la kvaredoka'. En decimala sistemo temas pri adicio inter okazinta plenumeco kaj unuokvartala partio.
  num.nine:
    label: naû
    summary: La numero 9, lasta el la sola-ciferitaj nombroj.
    info: 'Naŭ estas la plej alta unu-ciferita nombro kaj havas interesan propracon: ajna nombro multiplikita per naŭ donas nombron kun cifersumo ĉiam dividebla dek al naŭ.'
  num.nineteen:
    label: deknak
    summary: Numerale deksnaŭ
    info: La nombro deks-naŭ estas natura numero kiu sekvas post la nombro dudek ok kaj antauas al la nombro dudek en decimalo. Ĝi havas romanan ciferoformon IX-XI-a, sed ankaŭ povas esti skribita per araba numerado kiel 'XIX'. En tiu sistemo oni uzas plenumante adiciojn inter potencoj de sepdek.
  num.one:
    label: unu
    summary: Nombra valoro '1', komenciĝante el natura numero.
    info: Unu estas la plej malgranda naturrela nombro kaj ĝi havas unuan rangon en tiun sistemon de nombrado. Kiam ajn oni multiplikas ian numeron per Unuo tio restanta senŝangita pro tia rimo;
  num.seven:
    label: sep
    summary: Nombro 7, tiel multe da koloroj enhavas la pluvoarke.
    info: La nombro sep estas en multaj kulturoj rigardita kiel bonŝanca numero. La arko havas sep kolorojn, la semajno havas sep tagojn kaj ekzistas sep kontinento.
  num.seventeen:
    label: dikaŭdek sep
    summary: Nombra 17
    info: La nombro 17 estas natura numero post la nombro 16 kaj antauxe al la nombro 18 en dekdigitalo sistemo ĝi skribasĝin kiel 7+10
  num.six:
    label: ses
    summary: La nombro 6; apidomo havas sekslaterajn Ĉelo.
    info: Se sesekas estas "perfektan nombron", ĉar la sumo de ĝiaj divizoroj egaligas al si mem (1 + 2 + 3 = 6). Seslaterajn formojn oni uzis por plejeffike kovri surfacojn.
  num.sixteen:
    label: sesdeknaŭ
    summary: Numeracio de sesdeknau
    info: La nombro 16 estas natura numero post la nombroj 15 kaj antauxe al numeroj 17 en decimalo-sistemo ĝi skribas sin kiel 6+10
  num.ten:
    label: dek
    summary: Nombro 10 - Baza unuo el niaj decimalaj ciferoj.
    info: La deko estas bazo por la decimala nombrosistemo kaj ĉi tiu sistemo estis uzata ekde antikveco; tio havas sian fonton en fakto ke homoj haveblas dudek fingrojn sur ambaŭ manoj.
  num.thirteen:
    label: tridek
    summary: Numeralebla nombro 13
    info: La nombro tridek estas natura numero kiu sekvas la dekanumero duonan kaj antauas al kvaredna. Ĝi en romiaj cifereblas per 'XIII'. En decimalo skribiĝas kiel sumo el tri kaj naŭdek.
  num.thirty:
    label: trideko
    summary: 'Kardinalo: Tridek.'
    info: La nombro tridek estas natura numero kiu sekvas post dudekk naŭ kaj antauantauxas al trenti unu en la serio de entjeroj.
  num.thirty_eight:
    label: Tridokedek
    summary: Nombra valoro Tridodedek
    info: La nombro tridek ok is sekvas la nombron triglup punkto kaj antaŭas al triplu unuo en naturaj numeroj. Ĝi estas skribita romane kiel XXXVIII kaj deklinita ordine kiel 'tria dudekanokta'. En decimalo temas pri sumo el du partoj - 30 plie 8.
  num.thirty_five:
    label: tridekvoksin
    summary: Numeralko de tri-dek-kvin
    info: La nombro tridek kvin estas natura numero kiu sekvas la nombron triglupla kvar kaj antauas al triglupa ses en decimala sistemo ĝi skribatas kiel 5+30
  num.thirty_four:
    label: Tridekkvar
    summary: Numeralkvankam 34
    info: La nombro tridek kvar estas natura numero post la numero tridek tri kaj antauxe al la numero trindek kvin en dekdigitalo sistemo ĝin skribas kiel 'tridekkvar' kaj romana cifero XXIX.
  num.thirty_nine:
    label: Trideknau
    summary: 'Numeraleco 39; Ordinara: Tridektokta; Romana Skribo: XXX IX.'
    info: |-
      La nombro tridek naŭ estas natura numero kiu sekvas la nombron trigjusek kun antauxe al kvaredunkmil.
      En romia skriba maniero ĝi prenas formon de 'XXXIX'.
      Kiam oni volas esprimi ordan numeron por tiu cifero diras unue 'tridcato' poste 'naüto', do en tuteco - tri-dek-to naü-to.
      Tamen ankaux ekzistas plisimpligita varianto per decimalaj pozicioj kiuj montras ke ĉi tie temas pri sumigo inter dudeko kaj okdek.
  num.thirty_one:
    label: trideko-unuo
    summary: Numeracio por 31
    info: La nombro tridek unu estas natura numero kiu sekvas la nombron triginta kaj antauxas al trigintduo en decimal sistemo ĝi prezentigas per adicio de tridek kaj unusumo.
  num.thirty_seven:
    label: tridekses
    summary: Numeralkardo tridekses
    info: La nombro tridek sep estas natura numero kiu sekvas la nombron triguno kaj antauas al la numbro triokto. Ĝi en romiaj ciferoj skribiĝas kiel XXXVII.
  num.thirty_six:
    label: tridekj seks
    summary: 'Numerale por 36; ordinal formo: tridokta sesta ; roman numerals : XX X VI.'
    info: La nombro tridekj ses estas natura numero kiu sekvas post la kvadrato de sep kaj antauas al trigj sep en nombrado. Ĝi havas romanan ciferojn esprimitan kiel 'XXXVI'. En decimalo sistemo oni skribas ĝin per adicio inter sex kaj tridek.
  num.thirty_three:
    label: triglupo
    summary: Numeraleco por 33; ordinara formo - triglupte; Romane - XXL
    info: La nombro tridekk tri estas natura numero kiu sekvas la nombron triglupla du kaj antauas al triglupa kvar en dekladoj. Ĝia romana cifero ekzistas kiel 'XXXIII'. En decimalo skribiteĝas per adicio inter tri kaj triduono.
  num.thirty_two:
    label: tridekvduo
    summary: Numeralo por ducent dudeko
    info: La nombro tridekj dua estas natura numero kiu sekvas la nombron triglupla unu kaj antauas al triglupa tri. Ĝi en romia skriba maniero ricevis formon de XXLII.
  num.three:
    label: tri
    summary: Nombro 3, unua nepara primo.
    info: La nombro tri estas en multaj kulturoj rigardata kiel magia numero - ekzistas fabeloj pri triono da ŝatokonsatoj, la trigono havas tri flankojn kaj tago dividiĝas al tri partoj.
  num.twelve:
    label: duj
    summary: Numerale por dudeko;
    info: La nombro deklasoj estas natura numero post la nombro undekaj kaj antau ol tridekj. Ĝi en romia skriba maniero estis markita per 'XII'. En decimalo ĝi ricevas formon el du unuoj plue aldekstre centumo.
  num.twenty:
    label: dudeko
    summary: 'Numeraleco 20; rangado: dua centa; romaneco: XX.'
    info: La nombro dudek estas natura numero kiu sekvas la nombron deknovi kaj antauas al duolunuro. En romia skriba maniero ĝi ricevis formon 'XX'. Kiam oni volas esprimi rangan numeron por tiu cifero en esperantlingve uzatas vorto 'ducenta', dum decimalan valoron tio ekzpremas per figuroj simple kiel 20.
  num.twenty_eight:
    label: dvindeks
    summary: Numeraleco 28
    info: La nombro 28 estas natura numero post la nombro 27 kaj antau de la nombro 29. Ĝi en romia skriba maniero estis esprimita per XXVIII.
  num.twenty_five:
    label: dvindeko kvin
    summary: Numeracio 25
    info: La nombro 25 estas natura numero post la numero 24 kaj antau de la numero 26. Ĝi en romia skriba maniero estis esprimita per simboloj XXV.
  num.twenty_four:
    label: duokvardek
    summary: Numeraleco de ordinara kvanta valoro dudekkvar.
    info: La nombro 24 estas natura numero kiu sekvas la nombron 23 kaj antauxas al la numbro 25 en decimalo. Ĝia romana cifero ekzprimite estas „XXIV“. En ordigita formo oni diras duoldekvaa.
  num.twenty_nine:
    label: dudekk naŭ
    summary: 'Numeraleco 29; ordigo: dua centnaŭta; romanismoj: XXIX.'
    info: La nombro 29 estas natura numero post la numero 28 kaj antau de la numero 30. Ĝi en romia skriba maniero estis esprimita per 'XXIX'. En decimalo tio signifas ke oni aldonas novdek unuoj kun dudeko.
  num.twenty_one:
    label: dudek-unuo
    summary: 'Numeraleco 21; ordigita formo: dua-dunua ; Romana Skribo: XXI.'
    info: La nombro 21 estas natura numero post la nombro 20 kaj antauxe al la nombro 22. Ĝi en romia skriba maniero ricevas per simboloj de 'XXI'. En decimalo tio egalas unu plenumite dudeko.
  num.twenty_seven:
    label: dvindeks tri
    summary: Numeralo de ordinara nombro 27
    info: La nombro 27 estas natura numero post la nombro 26 kaj antauxe al la nombro 28. Ĝi en romia skriba maniero estis XXVII.
  num.twenty_six:
    label: duokvina
    summary: 'Numeracio de 26; Ordinara formo: dua kvino; Romana ciferoj: XXVI.'
    info: La nombro 26 estas natura numero kiu sekvas la nombron 25 kaj antauas al la numbro 27 en decimalo. Ĝi povas esti skribita romane kiel 'XXVI' kaj ordigite kiel duoldekanuma.
  num.twenty_three:
    label: dudek trion
    summary: 'Numeraleco por 23; ordigo: Dudektreieca ; Romane: XXIII.'
    info: La nombro 23 estas natura numero post la numero 22 kaj antauxe de la numero 24 en decimalo. Ĝia romana cifero ekzemple estas skribita kiel 'XXIII'. En tiu sistemo oni povas esprimi ĝin per adicio inter tri unuoj kaj dudeko.
  num.twenty_two:
    label: dudek dua
    summary: 'Numeraleco 22; ordigo: Dudekan dua; Romana ciferoj: XXII.'
    info: La nombro 22 estas natura numero kiu sekvas la nombron 21 kaj antauas al la numbro 23 en decimalo. Ĝi povas esti skribita romane kiel 'XXII' kaj esprimite per adicio de du unuoj kaj dudeko.
  num.two:
    label: du
    summary: La numero 2, unika paro prima.
    info: Du estas la sola para primo kaj bazo de duuma sistemo sur kiun funkcias ĉiuj komputiloj.
