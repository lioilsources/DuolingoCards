lang: pt-BR
pivot: false
title: Números de 1 a 10
cards:
  num.eight:
    label: oito
    summary: O número 8, um polvo tem oito braços.
    info: Oito é 2³ (dois ao cubo). Uma oito deitada (∞) é o símbolo do infinito; na cultura chinesa, oito é considerado o número mais auspicioso de todos.
  num.eighteen:
    label: dezoito
    summary: Numeral cardinais de dezessete
    info: O número 18 é um número natural que vem após o número 17 e antes do número 19.
  num.eleven:
    label: onze
    summary: Numeral ordinal onésimo
    info: O número 11 é um número natural que vem após o número 10 e antes do número 12.
  num.fifteen:
    label: quinze
    summary: Número cardina lquince
    info: O número quinze é um número natural que vem após o catorze e antes do dezesseis na sequência numérica. Seu símbolo romano corresponde ao 'XV'. Em termos de posição ordinal ele pode ser descrito como décimo-quinto.
  num.fifty:
    label: cinquenta
    summary: Número cardinais cinquenta
    info: O número 50 é um número natural que vem após o número 49 e antes do número 51.
  num.five:
    label: cinco
    summary: O número 5, tantos dedos temos em uma mão.
    info: Cinco é a base do sistema numérico decimal, porque os humanos têm cinco dedos em cada mão. O planeta Vênus traça no céu uma estrela de cinco pontas.
  num.forty:
    label: quarenta
    summary: Número cardinais quarenta
    info: O número 40 é um número natural que vem após o número 39 e antes do número 41.
  num.forty_eight:
    label: quarenta e oito
    summary: Número ordinal quarenta-e-oitavo
    info: O número 48 é um número natural que vem após o número 47 e antes do número 49.
  num.forty_five:
    label: quarenta e cinco
    summary: Número ordinal quinquagésimo
    info: O número 45 é um número natural que vem após o número 44 e antes do número 46.
  num.forty_four:
    label: quarenta e quatro
    summary: Número ordinal de ordem quaranta-quarto
    info: O número 44 é um número natural que vem após o número 43 e antes do número 45.
  num.forty_nine:
    label: quarenta e nove
    summary: Número ordinal quinquagésimo nono
    info: O número 49 é um número natural que vem após o número 48 e antes do número 50.
  num.forty_one:
    label: quarenta e uma
    summary: Número ordinal quinquagésimo primeiro
    info: O número 41 é um número natural que vem após o número 40 e antes do número 42.
  num.forty_seven:
    label: quarenta e sete
    summary: Número ordinal quarenta-e-sétimo
    info: O número 47 é um número natural que vem após o número 46 e antes do número 48.
  num.forty_six:
    label: quarenta e seis
    summary: Número ordinal quinquagésimo sexto
    info: O número 46 é um número natural que vem após o número 45 e antes do número 47.
  num.forty_three:
    label: quarenta e três
    summary: Número ordinal quinquagésimo terceiro
    info: O número 43 é um número natural que vem após o número 42 e antes do número 44.
  num.forty_two:
    label: quarenta e dois
    summary: Número ordinal quinquagésimo segundo
    info: O número 42 é um número natural que vem após o número 41 e antes do número 43.
  num.four:
    label: quatro
    summary: O número 4; um quadrado tem quatro lados.
    info: Quatro é o quadrado de dois — resultado de 2 × 2. Na cultura japonesa e chinesa, é considerado um número infeliz (o som da palavra é semelhante à palavra 'morte').
  num.fourteen:
    label: quatorze
    summary: Numeral cardinais quatorze
    info: O número 14 é um número natural que vem após o número 13 e antes do número 15.
  num.nine:
    label: nove
    summary: O número 9, o último número de um algarismo.
    info: 'Nove é o maior número com apenas um dígito. Uma propriedade notável: qualquer número multiplicado por nove tem uma soma dos seus dígitos sempre divisível por nove.'
  num.nineteen:
    label: dezanove
    summary: Número cardinais de dez nove
    info: O número 19 é um número natural que vem após o número 18 e antes do número 20.
  num.one:
    label: um
    summary: O número 1, o primeiro número natural.
    info: Um é o menor número natural. Qualquer número multiplicado por um permanece inalterado; por isso, ele também é chamado de "elemento neutro da multiplicação".
  num.seven:
    label: sete
    summary: O número 7, tantas cores tem o arco-íris.
    info: Sete é considerado um número feliz em muitas culturas. O arco-íris possui sete cores, a semana tem sete dias e existem sete continentes.
  num.seventeen:
    label: dezessete
    summary: Número ordinal dezessétimo
    info: O número 17 é um número natural que vem após o número 16 e antes do número 18.
  num.six:
    label: seis
    summary: O número 6; o favo de mel tem células hexagonais.
    info: Seis é um "número perfeito", pois a soma de todos os seus divisores resulta em seis (1 + 2 + 3 = 6). Formas hexagonais são a maneira mais eficiente para pavimentar uma superfície.
  num.sixteen:
    label: dezesseis
    summary: 'Número cardina l dezassei s ; ordinal : décimo-sexto'
    info: O número 16 é um número natural que vem após o número 15 e antes do número 17.
  num.ten:
    label: dez
    summary: Número 10, base do nosso sistema decimal.
    info: O número dez é a base do sistema de numeração decimal porque os seres humanos têm um total de dez dedos nas mãos. Dez tem sido uma medida natural para contar desde tempos antigos.
  num.thirteen:
    label: treze
    summary: Número cardinais treze
    info: O número 13 é um número natural que vem após o número 12 e antes do número 14.
  num.thirty:
    label: trintas
    summary: Numeral cardinais 30
    info: |-
      O número trinta é um natural que vem após o vinte e nove antes do trigésimo primeiro.
      Seu algarismo romano corresponde ao símbolo 'XXX'.
      Na base decimal ele pode ser escrito como sendo igual à soma de três zeros.
  num.thirty_eight:
    label: trinta e oito
    summary: Numeral cardinais trinta-e-oitavo
    info: O número 38 é um número natural que vem após o número 37 e antes do número 39.
  num.thirty_five:
    label: trinta e cinco
    summary: Numeral cardinais trinta e cinco
    info: O número 35 é um número natural que vem após o número 34 e antes do número 36.
  num.thirty_four:
    label: trinta e quatro
    summary: Numeral cardinais de trinta-e-quatro
    info: O número 34 é um número natural que vem após o número 33 e antes do número 35.
  num.thirty_nine:
    label: trinta e nove
    summary: Número ordinal trigesimo nono
    info: O número 39 é um número natural que vem após o número 38 e antes do número 40.
  num.thirty_one:
    label: trinta e uma
    summary: Número ordinal trinta primeiro
    info: O número 31 é um número natural que vem após o número 30 e antes do número 32.
  num.thirty_seven:
    label: trinta e sete
    summary: Numeral cardinais trinta e sete
    info: O número 37 é um número natural que vem após o número 36 e antes do número 38.
  num.thirty_six:
    label: trinta e seis
    summary: Número ordinal trinta-e-seis
    info: O número 36 é um número natural que vem após o número 35 e antes do número 37.
  num.thirty_three:
    label: trinta e três
    summary: Numeral cardina trinta e três
    info: O número 33 é um número natural que vem após o número 32 e antes do número 34.
  num.thirty_two:
    label: trinta dois
    summary: Numeral cardinais trinta e dois
    info: O número 32 é um número natural que vem após o número 31 e antes do número 33.
  num.three:
    label: três
    summary: O número 3, primeiro número primo ímpar.
    info: Três é considerado um número mágico em muitas culturas – há contos de fadas sobre três desejos, o triângulo tem três lados e o dia divide-se em três partes.
  num.twelve:
    label: doze
    summary: Numeral cardinais de 12
    info: O número 12 é um número natural que vem após o número 11 e antes do número 13.
  num.twenty:
    label: vinte
    summary: Numeral cardinais 20
    info: O número vinte é um número natural que vem após o dezanove e antes do vigésimo primeiro na sequência numérica.
  num.twenty_eight:
    label: vinte e oito
    summary: Numeral cardinais vinte-e-oitavo
    info: O número 28 é um número natural que vem após o número 27 e antes do número 29.
  num.twenty_five:
    label: vinte e cinco
    summary: Número cardinais vinte e cinco
    info: O número 25 é um número natural que vem após o número 24 e antes do número 26.
  num.twenty_four:
    label: vinte quatro
    summary: Número cardinais 24
    info: O número 24 é um número natural que vem após o número 23 e antes do número 25.
  num.twenty_nine:
    label: vinte e nove
    summary: Número cardinais 29; ordinal vigsimo nono
    info: O número 29 é um número natural que vem após o número 28 e antes do número 30.
  num.twenty_one:
    label: vinte e um
    summary: Número cardinais vinte e um
    info: O número 21 é um número natural que vem após o número 20 e antes do número 22.
  num.twenty_seven:
    label: vinte sete
    summary: Número cardinais 27; ordinal vigsimo sétima
    info: O número 27 é um número natural que vem após o número 26 e antes do número 28.
  num.twenty_six:
    label: vinte e seis
    summary: Número cardinais vinte e seis
    info: O número 26 é um número natural que vem após o número 25 e antes do número 27.
  num.twenty_three:
    label: vinte três
    summary: Número cardinais 23
    info: O número 23 é um número natural que vem após o número 22 e antes do número 24.
  num.twenty_two:
    label: vinte dois
    summary: Número ordinal vindo depois de 21
    info: O número 22 é um número natural que vem após o número 21 e antes do número 23.
  num.two:
    label: dois
    summary: O número 2, o único número primo par.
    info: Duas é o único número primo par e também a base do sistema binário, que é fundamental para o funcionamento de todos os computadores.
