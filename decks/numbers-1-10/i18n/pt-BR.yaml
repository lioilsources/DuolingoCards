lang: pt-BR
pivot: false
title: Números de 1 a 10
cards:
  num.eight:
    label: oito
    summary: O número 8, um polvo tem oito braços.
    info: Oito é 2³ (dois ao cubo). Uma oito deitada (∞) é o símbolo do infinito; na cultura chinesa, oito é considerado o número mais auspicioso de todos.
  num.five:
    label: cinco
    summary: O número 5, tantos dedos temos em uma mão.
    info: Cinco é a base do sistema numérico decimal, porque os humanos têm cinco dedos em cada mão. O planeta Vênus traça no céu uma estrela de cinco pontas.
  num.four:
    label: quatro
    summary: O número 4; um quadrado tem quatro lados.
    info: Quatro é o quadrado de dois — resultado de 2 × 2. Na cultura japonesa e chinesa, é considerado um número infeliz (o som da palavra é semelhante à palavra 'morte').
  num.nine:
    label: nove
    summary: O número 9, o último número de um algarismo.
    info: 'Nove é o maior número com apenas um dígito. Uma propriedade notável: qualquer número multiplicado por nove tem uma soma dos seus dígitos sempre divisível por nove.'
  num.one:
    label: um
    summary: O número 1, o primeiro número natural.
    info: Um é o menor número natural. Qualquer número multiplicado por um permanece inalterado; por isso, ele também é chamado de "elemento neutro da multiplicação".
  num.seven:
    label: sete
    summary: O número 7, tantas cores tem o arco-íris.
    info: Sete é considerado um número feliz em muitas culturas. O arco-íris possui sete cores, a semana tem sete dias e existem sete continentes.
  num.six:
    label: seis
    summary: O número 6; o favo de mel tem células hexagonais.
    info: Seis é um "número perfeito", pois a soma de todos os seus divisores resulta em seis (1 + 2 + 3 = 6). Formas hexagonais são a maneira mais eficiente para pavimentar uma superfície.
  num.ten:
    label: dez
    summary: Número 10, base do nosso sistema decimal.
    info: O número dez é a base do sistema de numeração decimal porque os seres humanos têm um total de dez dedos nas mãos. Dez tem sido uma medida natural para contar desde tempos antigos.
  num.three:
    label: três
    summary: O número 3, primeiro número primo ímpar.
    info: Três é considerado um número mágico em muitas culturas – há contos de fadas sobre três desejos, o triângulo tem três lados e o dia divide-se em três partes.
  num.two:
    label: dois
    summary: O número 2, o único número primo par.
    info: Duas é o único número primo par e também a base do sistema binário, que é fundamental para o funcionamento de todos os computadores.
