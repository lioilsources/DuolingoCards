lang: ga
pivot: false
title: Uimhreacha ó 1 go dtí 10
cards:
  num.eight:
    label: a hocht
    summary: Uimhir 8 - Tá ochtar lámhacha ag doilín.
    info: Is é seo uimhir anseo o huithe agus is í séadúlacht i bhfhrithreoidh ó thriúnas go dtioghtear don triú céanna. Is ∞ síneadh d'infheidhin nó 'o huithe fós', mar sin tá sé ar siopar infhéidineachta.
  num.eighteen:
    label: Osmnaic
    summary: Uimhir 18
    info: Is é an uimhir 18 nua-thuairisc i ndeanadh na huímhreachta agus tá sé roimhe 19 tar éis 17. Scríoftar í mar 'XVIII' sa litriú Rómanach.
  num.eleven:
    label: go haocht
    summary: Uimhershearcadh go hoaght
    info: Is é an uimhir 11 nádúrtha i bhfoll ar úimer 10 agus os cionn úimer 12. Is XLI í sa litriocht Róiseach.
  num.fifteen:
    label: Patnó
    summary: Uimhir phoisteach - Patné
    info: Is é an uimhir 15 nua-thuairis i ndeanadh na huímhreachta 14 agus roimhe 16 san tsealach thuoideach. Scríobhfear sé mar 'XV' sa litriú Rómánacha.
  num.fifty:
    label: Peadasat
    summary: Uimhir phoisteach - Peadsat
    info: Is é an uimhir 50 náisiúnta i ndeanadh na huímhreachta 49 agus roimhe seo 51 san áireamh deiseach. Is í Ríomhas Mhicileanna dá 'L'.
  num.five:
    label: cúig
    summary: An uimhir 5; is cuige hóinín tacaím.
    info: Is é Picti an rud atá ar bun sa chuid de thomhasú agus tá sé mar sin i gceist go bhfuil picteanna airgidte fós san amhras don láthair.
  num.forty:
    label: daichead
    summary: 'Uimhir chothromta daichit - ordaithe: daocheathaght ar dtús'
    info: Is é an uimhir 40 náisiúnta i ndiaidh na huímhire 39 agus roimhe an t-uimir 41. Scríobhfear sé mar 'XL' sa stóráin Féarchlárach.
  num.forty_eight:
    label: daonasc
    summary: 'Uimhir dhaoine: daonasc'
    info: Is é an uimhir 48 nua-thuairisc i ndeanadh na huímhreachta agus tá sé idir an 47 agus an 49. Is féidir léi scríobhfadh mar 'XLVIII' sa bhealach Rómanach.
  num.forty_five:
    label: daichhead
    summary: Uimhir dhreachta 45
    info: Is é an uimhir 45 náisiúnta i ndiaidh na huímhire 44 agus os cionnaigh thart ar phost nóchtaróir.
  num.forty_four:
    label: dhaorú
    summary: Uimhir dhalmoreaglaise - Dhaorún
    info: Is é an uimhir 44 nua-thuairisc nach sonraítear i gceart dona thuoilse agus roimh na huímhire 45 san tsiostém atoinneachta deichdhéis. Is XLI is ea mar shamhradh Rómaine ach muidheann sé go bhfuil eadarthuaiscín ar bith ann idir seo agus sin.
  num.forty_nine:
    label: daichheadró
    summary: Uimhir chothrom don dá tharbh - daicheadrón
    info: Is é an uimhir 49 náisiúnta i ndeanadh na huímhreachta ar dhomhan agus tá sé idir 48 agus 50. Is féidir léi scríobhfadar mar 'XLIX' sa litriocht Rómaine.
  num.forty_one:
    label: Daon déag
    summary: 'Cifreoir 41 ; Réamhsuímhnithe: Daonteach dearg ; In roinn románacha: XLII'
    info: Is é an uimhir 41 nascóir ar thrimhfhocal agus tá sé i gceist go bhfuil sí tar éis na h-uimhire 40 agus beforas na huímhairi 42 sa staitisticheacht aturthúla. Is í Rómhuscte don phrónaí seo 'XLI'. Mar sin féin is ea fhoirm réamhsuímhneachta d'Uaimhithe Décadaigh 'caipitheadh san am céanna mar '1+40'
  num.forty_seven:
    label: daichead sé
    summary: Uimhersoirt四十七
    info: Is é an uimhir 47 ná litir ar maidin i dtreo na huairte agus roímhearthaigh thart air seo. Is í XVLII an rud céanna sa phróiseas Rómánach.
  num.forty_six:
    label: faochaird
    summary: Uimhir faoirche - Faochird; Ordaitheachta – Cetyrich Sé Sicht
    info: Is é an uimhir 46 ná litir sheasamh i dtreo na huímhire 45 agus roimhe seo thar feadh 47 san taisbheartú céanna. Is féidir léi scríobhfadar mar 'XLVI' sa phróisean Féinmhartha nó ‘cetyricat sé sicht’ don ordaitheacht.
  num.forty_three:
    label: daon trí
    summary: Uimhir chotha—dhaon trí
    info: Is é an uimhir 43 ná litir sheasamh i ndeanadh na huímhireachta agus tá sé idirmheán thar feiceál don chárthuinn go dtí dhóntú.
  num.forty_two:
    label: daic headar
    summary: Uimhir chothrom don dá chincanta daich
    info: Is é an uimhir 42 nua-thuairisc i ndeanadh na huímhreachta agus tá sé idir an 41 agus an 43. Is féidir léi scríobhfadar mar 'XLII' sa bhealach Rómanach nó ‘an cheadú dar gcinn’ san fhorma ordaithe.
  num.four:
    label: ceithre
    summary: An uimhir 4; tá ceathair taol againne.
    info: Is éad dhóchadh ceithre - iomarú ar dhuine agus eile. Sa phillipínis sa Japán agus na Sín is féidir léi bheith mar litriocht don fhiosruthaí cosc.
  num.fourteen:
    label: ceatharna
    summary: Uimhershearthúil 14
    info: Is é an uimhir 14 nua-thuairisc i ndeanadh thar feachta ar na hóinireacha agus roimhe seo tá an ceithre déag sa phróm.
  num.nine:
    label: naoche
    summary: Uimhreas nóinmhithe nua amhail 'noch' mar sin.
    info: 'Is é an cúigín is airde iomlán ceithre ciffir í na haochtú. Taiscéad atá ar siar: nuair nach maitheas tú uimhir agus aochtú tá suím céanna de gach digit san fhactóraid seo fada.'
  num.nineteen:
    label: deaghnacoche
    summary: Uimhir chothaigh - Deaghnacochte
    info: Is é an uimhir 19 nua-thuairisc i ndeanadh na huímhreachta 18 agus tríd seo chun ceann de thomhasa go dtí 20 san fhormat dhoicheadóir. Is í Rómanscramainneacht don phrón 'XIV'. Mar sin féin is ea sé scríobhfhearcach mar 9+10 sa bhuilthear.
  num.one:
    label: aon
    summary: Uimheanna 1 - An chéad uimhear seo.
    info: Is é an ceathrú ar fad is fearg amhainn san uimhir sheasamh agus tá sé mar 'prófhartaigh iomlán' don oiriún taisbeanachta.
  num.seven:
    label: sept
    summary: Uimhir sept
    info: Is é sé ceann de na sluaughaithe i nghearaltacht agus tá sliabhán eile ann freisin maidir lena heolas ar an uimhir seo.
  num.seventeen:
    label: seachtó
    summary: Uimhir séasamhach 17
    info: Is é an uimhir 17 nua-thuairis i ndiaidh na huímhire 16 agus os ciontaine dena thirmhuinheoir.
  num.six:
    label: se
    summary: Uimhir 6; tá cealla sheasamhanna sa phláisteach.
    info: Is é seo 'uimhir fheart' - is ea suímh de na huaireadóirí uile dáta iomlán (1 + 2 + 3 = 6). Tá siombairt hexagonal agus sligheartha mar thoradh ar an méid atá ann.
  num.sixteen:
    label: Siucahc
    summary: Uimhir chothromóra 16
    info: Is é an uimhir 16 nua-thuairisc i ndeanadh na huímhreachta 15 agus tríd is fheadar ar an ghuímheartha 17 san tseasmhéid deichdhéis. Is XV sa litriú Rómánach dona thuarascál seo ach 'Seachtain' mar ordaithe.
  num.ten:
    label: Deich
    summary: An Úimer 10; An Bunónach Don N-uímhsithe Tenta.
    info: Is é deich an onóimhe atá ar bun n-aonú teicniúil agus tá sé sin mar go bhfuair daoine deich phríste i láthair orthu uile san amharc seo thar thríonna sa laogha. Is beanfhocal doichte don téarma 'deich'.
  num.thirteen:
    label: trínó
    summary: Uimhir trían - trí déag
    info: Is é an uimhir 13 is fearas iomlán tar éis na h-uimhriúcht agus roimhe na cetharcéadt.
  num.thirty:
    label: tríc
    summary: Uimhir tría déag
    info: Is é an uimhir 30 náisiúnta i ndeanadh na huímhreachta tar éis an chifre 29 agus roimhe an cifrín 31. Scríobhfear sé mar 'XXX' sa litriocht Rómanach.
  num.thirty_eight:
    label: tria déag
    summary: Uimhir tría déag
    info: Is é an uimhir 38 nua-thuairisc i ndeanadh na huímhreachta 37 agus san taobh thiar denaonach de cheann 39. Is XXXVIII í sa litriú Rómanacha.
  num.thirty_five:
    label: Trícúnta Páth
    summary: Uimhir chothrachtúil - Trícúnta Páth
    info: Is é an uimhir 35 ná litir sheoithin i ndeichfhocal agus tá sí idir na h-uímhreacha 34 agus 36. Is XXXV í sa phróiseas Rómánach agus is 'trícúnta pátha' í mar ordaithe.
  num.thirty_four:
    label: tría déag
    summary: Uimhir trídha - tria dèagh
    info: Is é an uimhir 34 nua-thaisce i ndiaidh na h-uímhire 33 agus roimhe na h-uímhair 35 san fhoinse údaitheachta. Is ea 'XXXIV' í sa litriú Rómánacha.
  num.thirty_nine:
    label: tría déag
    summary: Uimhir chothrom tría déag
    info: Is é an uimhir 39 nua-thuairisc i ndeanadh na huímhreachta ó tharainne go dtosach agus is í rompóca XXLX sa litriú Rómánacha.
  num.thirty_one:
    label: tría déag
    summary: Uimhreach 31
    info: Is é an uimhir 31 nádúrtha i ndeanadh na huaire dona agus roímhearctha ar maidin thart do 32 san áit nach bhfuil sé amach ó 30. Is í seo XX XI sa litriocht Rómaine.
  num.thirty_seven:
    label: tría déag
    summary: Uimhir trídha - tria déag
    info: Is é an uimhir 37 nua-thuairisc i ndeanadh na huímhreachta is ceart agus tá sé roimhe 38 nuair nach raibh 36 ann os cionn dó. Is ea XXXVII í sa litriú Rómaine.
  num.thirty_six:
    label: tría déag
    summary: Uimhir trídha - tría déag
    info: Is é an uimhir 36 ná litir ar maidin agus tá sé i dtriú nach raibh ann roinneadh na huairfheiceálta go dtí seo.
  num.thirty_three:
    label: tría déag trí
    summary: Uimhir trídha - tria dè thrid
    info: Is é an uimhir 33 ná eilímh i ndeanadh na huimhireanna tar Éirinn agus roimhe 34. Is XXXIII í sa litriú Rómaine.
  num.thirty_two:
    label: tría déag
    summary: Uimhir trídha - tría déag
    info: Is é an uimhir 32 nádúrtha i ndeanadh na h-uímhre 31 agus roimhe seo is féin.
  num.three:
    label: trí
    summary: An uimhir 3; an chéad slonn-prime fairsing.
    info: Is é an trí uaill amhail thar lear agus tá sé mar ghearrthuigeadóir i bhforbairteanna - is féidirmhearca de thrích rúnaitheacha agus ceithre tríanachta sa phrásadúin agus caiteann lá ar thréalta.
  num.twelve:
    label: Duanasc
    summary: Uimhir dhaoineachta na hAon Dhaichead - duanasc
    info: Is é an uimhir 12 nua-uímhre eile i ndiaidhm ar thoirse agus os cionn trí scagairte. Scríobhfear sé mar 'XII' sa stiúireacht Rómaineagus nó mar 'duascné' san ordaithe.
  num.twenty:
    label: dhaichead
    summary: Uimhir dhaicead
    info: Is é an uimhir 20 náisiúnta i ndeanadh na huaire don chifre 19 agus roímhe seo ar bhuile go dtí an cifrínneachta 21 san fhoirmhéal rialtais deichdhéis.
  num.twenty_eight:
    label: dhaichead óg
    summary: Uimhir dhaltaíoch - Dhaichead Óg
    info: Is é an uimhir 28 ná uaithne i ndiaidh na huímhire 27 agus roimhe an t-uimhir 29 san fhoinse is féin. Is XXXII sa litriú Rómanach don phróna nó mar 'XXVIII' má tá sé ar fhadair. Scríobhfear go dtíogtar dá chuaightear do dhá thuaisceart.
  num.twenty_five:
    label: XXV
    summary: Uimhir chothrom ar fhadhb - 25
    info: Is é an uimhir 25 nua-thuairisc nach gcuid dáta i gceart idir na huimhreacha 24 agus 26. Is í X XV mar phost Rómanach d'fheabhas don litriú thar feadh amhlaidhin.
  num.twenty_four:
    label: XXIV
    summary: Uimhir chothromóra 24
    info: Is é an uimhir 24 nádúrtha i ndeanadh na huaire dona uaithne agus roímhearctha do 25 san tseachtain seo chugamh. Is í Rómánach duithe XXXX mar XXIV atá ann sa phríomhsuímhreanna. Mar sin féin is ea sé ar fhadhb go bhfuil siadsan scríofhfada mar 'four plus two tens'.
  num.twenty_nine:
    label: dócha nó
    summary: Uimhir chothrom dócha nó
    info: Is é an uimhir 29 nua-thuairisc i ndiaidh na huímhire 28 agus roimhe an t-uimir 30 san áireamhas deichdhéisitheach. Scríobhfear sé mar 'XXIX' sa litriú Rómánacha.
  num.twenty_one:
    label: dhaicidh fhuar
    summary: Uimhir choimplíteacha 21
    info: Is é an uimhir 21 nua-thuairisc agus tá sé i dtriú ar thalamh na h-uimhireanna idir 20 agus 22. Is 'XXI' an litriocht Rómaine don phróm seo ach is 'duicheadthuath fhirste' an taispéis rithiúnach.
  num.twenty_seven:
    label: dhacbaidh séamti
    summary: Uimhir dhacbaidhsiamhtithe
    info: Is é an uimhir 27 nua-thuairisc i ndiaidh na huímhire 26 agus roimhe an uimhir 28. Is í Rómánach dhaonna féin XXYIYX. Ina thomhas ordaithe is ea 'dacadóntú séamthi'.
  num.twenty_six:
    label: dócha
    summary: Uimhir chothrom dócha
    info: Is é an uimhir 26 nua-thuairisc i ndiaidh na huímhire 25 agus roimhe na h-uimhir 27 san taisbheart is féin. Scríobhfear sé mar 'XXVI' sa litriú Rómánach.
  num.twenty_three:
    label: deichead trí
    summary: Uimhir chothrom ar fhadhairt go horduithe—‘deichead thí’.
    info: Is é an uimhir 23 nua-uímhre eile i ndiaidh na huimhire 22 agus os cionnaigh na huimhire 24 sa stórántacht deichdhéis. Scríobhfear sé mar 'XXIII' san oifig Rómhar nó ‘dheagha thairte” don ordú.
  num.twenty_two:
    label: dhà déag
    summary: Uimhir dhà déag
    info: Is é an uimhir 22 nua-thuairisc i ndeanadh na huímhreachta 21 agus beforas ar thomhas na heilimheonna 23 san fhoirm seo nach bhfuil sé sa phrómhaireachd nó sa chothromóirín. Is ea 'XXII' an litriú Roinseacha don uimhir sin.
  num.two:
    label: dhá
    summary: An uimhir 2; An t-amhailbhinn beo.
    info: Is é an dáil amhainnach is fearr agus tá sé mar sholús don bheith dhá thomhasa nó binártha ar gur féidir léi fheidim go bhfuairfidh siad i gcórasanna íocar.
