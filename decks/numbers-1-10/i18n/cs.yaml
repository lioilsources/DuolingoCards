lang: cs
pivot: false
title: Čísla 1–10
cards:
  num.one:
    label: jedna
    summary: Číslo 1, první přirozené číslo.
    info: Jednička je nejmenší přirozené číslo. Každé číslo vynásobené jedničkou se nezmění; proto se ji říká „neutrální prvek násobení".
  num.two:
    label: dva
    summary: Číslo 2, jediné sudé prvočíslo.
    info: Dvojka je jediné sudé prvočíslo a základ dvojkové (binární) soustavy, na níž fungují všechny počítače.
  num.three:
    label: tři
    summary: Číslo 3, první liché prvočíslo.
    info: Trojka je v mnoha kulturách považována za magické číslo – existují pohádky o třech přáních, triangl má tři strany a den se dělí na tři části.
  num.four:
    label: čtyři
    summary: Číslo 4, čtvereček má čtyři strany.
    info: Čtyřka je čtverec dvou – výsledek 2 × 2. V japonské a čínské kultuře je považována za nešťastné číslo (zvuk slova je podobný slovu „smrt").
  num.five:
    label: pět
    summary: Číslo 5, tolik prstů máme na ruce.
    info: Pětka je základem desítkové číselné soustavy, protože lidé mají na každé ruce pět prstů. Planeta Venuše opisuje na obloze pěticípou hvězdu.
  num.six:
    label: šest
    summary: Číslo 6, včelí plástev má šestihranné buňky.
    info: Šestka je „dokonalé číslo" – součet všech svých dělitelů (1+2+3 = 6). Šestihranné (hexagonální) tvary jsou nejúspornější způsob dláždění plochy.
  num.seven:
    label: sedm
    summary: Číslo 7, tolik barev má duha.
    info: Sedmička je v mnoha kulturách považována za šťastné číslo. Duha má sedm barev, týden má sedm dní a existuje sedm světadílů.
  num.eight:
    label: osm
    summary: Číslo 8, chobotnice má osm ramen.
    info: Osmička je 2³ (dva na třetí). Otočená osmička (∞) je symbol nekonečna; v čínské kultuře je osm nejšťastnějším číslem vůbec.
  num.nine:
    label: devět
    summary: Číslo 9, poslední jednociferné číslo.
    info: "Devítka je nejvyšší jednociferné číslo. Pozoruhodná vlastnost: číslo vynásobené devíti má ciferný součet vždy dělitelný devíti."
  num.ten:
    label: deset
    summary: Číslo 10, základ naší desetinné číselné soustavy.
    info: Desítka je základem desítkové soustavy, protože lidé mají celkem deset prstů na rukou. Deset je přirozenou mírou pro počítání od pradávna.

  num.eleven:
    label: jedenáct
    summary: "Číslovka 11; řadová: jedenáctý; římsky: XI."
    info: |
      Číslo 11 je přirozené číslo po čísle 10 a před číslem 12.
      Římská číslice: XI.
      Řadová číslovka: jedenáctý.
      V desítkové soustavě se zapíše jako 1 + 10.

