  num.twenty_five:
    label: ஐம்பது ஒன்னஞ்சு
    summary: எண் 25 ; ஓர் ஊர்ணம் - ஐம்பது ஒன்னஞ்சு , இசை உருவம் – XXV
    info: "எண் 25 என்பது 24க்குப் பிறகும் 26ல் முந்தையவரிலுள்ள இயற்கை அடி ஆகும்\nஇசை உருவம் :XXV\nஅடிச்சார் வழிஃ ஐம்பது ஒன்னஞ்சு \nஆஸ்ட்ரோஃபீ ஏஜிஸ் ஜூனியர்"
  num.twenty_four:
    label: இருபது ஆறு
    summary: 'அடிப்படை அலகுஃ 24 ; ஒழுங்கு ஏவல் : ஐஞ்ஜிரண்டாம் ; லத்தீஸ் ஃபாண்ட் : XXIV.'
    info: எண் 24 என்பது 23க்குப் பிறகும் 25ஐவிட முந்தி உள்ள இயற்கைச் சரிவகு.
  num.twenty_nine:
    label: இருபது மற்றும் ஒன்பது
    summary: எண் 29 ; ஓரீடு ஃ இருபது மற்றும் ஒன்பதாவது , இரோமன் அழகுஃ XXIX
    info: "எண் 29 என்பது 28க்குப் பின் வரும் மற்றும் 30ஐச் சாடி ஒரேயலவில் உள்ள நைஸர்க்கண ஆகிரமமாகும்\nஇரோமன் அழகுஃ XXIX\nஅடுத்தடுத்து ஏறும் ஐக்கிழைகள் : இருபது மற்றும் ஒன்பதாவது \nஆகிரமம் - 9+20"
  num.twenty_one:
    label: இருபது ஓரு
    summary: எண் - 21 ; அளவு – இருபது ஓரு , ரோமன்–XXI
    info: "எண் 21 என்பது 20க்குப் பிறகும் 22ஐவிட முந்தி வரும் இயற்கைச் சொல் ஆகும்\nஇடைக்குறிஃ XXI\nஅளவுஃ இருபது ஒன்னு \nஆழம் : 1+20"
  num.twenty_seven:
    label: இருபது
    summary: '''27''; ஓரிணை:''இருபது'''
    info: "எண் 27 என்பது 26க்குப் பிறகும் 28ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்\nஇலட்சிய அடையாளம் : XXVII\nஅடுத்தடுத்து ஒழுங்குஃ ஏழு ஐம்பது \nஆஸ்ரிதமான லட்சின் ஸ்஥ானத்தில் 'XX' என்று எழுதப்படுகிறது."
  num.twenty_six:
    label: இருபது
    summary: அடிப்படை அலகுஃ 26
