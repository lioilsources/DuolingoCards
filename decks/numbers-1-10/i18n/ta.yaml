lang: ta
pivot: false
title: எண்கள் 1-10
cards:
  num.eight:
    label: எட்டு
    summary: எண் 8, கொம்பனிலைகள் எட்டு தலைப்பாக்கங்களைக் கொண்டது.
    info: எட்டு என்பது 2³ (இரண்டு மூன்றாவது); நேர்விளக்கான எட்டு (∞) அணையற்றத்தின் குறி; சீன உள்ளுறவில், எட்டு ஒரு மிகச் சிறந்த ஆசீர்வாத எண்.
  num.five:
    label: ஐந்து
    summary: எண் 5, ஒவ்வொரு கையிலும் இத்தனை உள்ளடக்கங்கள் உள்ளன.
    info: பத்தின் எண்ணும் முறை ஐந்தை அடிப்படையாகக் கொண்டுள்ளது, ஏனெனில் மனிதர்கள் ஒவ்வொரு கையிலும் ஐந்து சுடி விரல்களைக் கொண்டுள்ளனர். வீனஸ் நிலவியல் வடிவமாக ஆகாசத்தில் ஐந்து கோண நட்சத்திரத்தை உருவாக்குகிறது.
  num.four:
    label: நான்கு
    summary: எண் 4, சதுரம் நான்கு பக்கங்களைக் கொண்டிருக்கிறது.
    info: ஒரு எண் 4 இரண்டின் வர்க்கம் - 2 x 2 ஆல் உருவாகின்றது. ஜப்பானிய மற்றும் சீன பண்பாடுகளில் அச்சமயம் தூய்மையான எண்ணாகக் கருதப்படுகிறது (அதன் ஓசை 'இறப்பு' என்ற சொல்லுடன் ஒத்திருக்கிறது).
  num.nine:
    label: ஒன்பது
    summary: எண் 9, இறுதி ஒரெழுத்துக் கூறின எண்.
    info: 'ஒன்பது மடங்கில் உள்ள நோய்கள்: ஒன்பது ஐ விட அதிகமாக சொல்லப்படும் எண்ணை ஒன்பது கூட்டிய பிறகு அவை ஒன்பது கீழ் பெருக்கப்படும்.'
  num.one:
    label: ஒன்று
    summary: எண் 1 முதல் இயற்கை எண்.
    info: ஒரு எண் எப்போதும் அதே வடிவில் தொடர்ந்து செயல்படுவதற்கு ஏற்ப, ஒன்று பெருக்கலின் 'சீரற்ற உறுப்பு' என்றும் கருதப்படுகிறது.
  num.seven:
    label: செம்மை
    summary: எண் 7, இந்திரधனுவில் உள்ள நிறங்களின் எண்ணிகை.
    info: பல பண்பாடுகளில் 7 ஒரு சிறப்பு எண் என கருதப்படுகிறது. இந்திரধனுவில் ஏழு நிறங்கள், வாரத்தில் ஏழு நாட்கள் மற்றும் ஐந்து கண்டங்கள் உள்ளன.
  num.six:
    label: ஆறு
    summary: எண் 6, தூத்துகளின் பல்லக்கு ஆறுமுகப் பையைகளைக் கொண்டது.
    info: ஆறு என்ற எண் 'சரியான எண்' ஆகும் - அதன் வகுஎண்களின் கூடுதல் (1 + 2 + 3 = 6) மீண்டும் ஆறு ஆகும். ஆறு பக்கவிலி (அறுகோண) வடிவங்கள் ஒரு இடத்தை நிரப்புவதில் மிகவும் சிக்கனமான வழியாகும்.
  num.ten:
    label: பத்து
    summary: எண் 10, எங்களின் பெரிய அடிமான எண் வகை.
    info: மனிதர்களுக்கு இருக்கும் மொத்த கைவிரல்கள் பத்து என்பதனால், பத்து ஒரு சில நூற்றாண்டுகளாக கணக்கிடுவதற்கான இயற்கையான அளவு ஆகும்.
  num.three:
    label: மூன்று
    summary: எண் 3, முதல் ஒற்றைப்படையான பகா எண்.
    info: மூன்று என்னும் எண் நிலவி வரும் பல கலங்களில் சார்பு அடையாளமாக கருதப்படுகிறது - மூன்று ஆசைகள் குறித்த கதைகள், மூன்று பக்கங்களைக் கொண்ட முக்கோணம் மற்றும் நாள் மூன்று பகுதிகளாகப் பிரிக்கப்படுகிறது.
  num.two:
    label: இரண்டு
    summary: எண் 2, ஒற்றைப் பகா எண்.
    info: இரண்டும் மட்டுமே சம பகா எண் ஆகும்; அதன் காரணமாக தற்போதைய கணினி நிலைமைகள் இயங்குவதற்கு இரண்டால் வழியில் உள்ள அடிப்படை முறையில் அமைக்கப்பட்டுள்ளது.
