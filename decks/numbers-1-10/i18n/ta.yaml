lang: ta
pivot: false
title: எண்கள் 1-க்கும் 10 -ஐயும் இடைப்பார்வை!
cards:
  num.eight:
    label: அட்ட
    summary: '''8'', ஹோஸ்டிள் ஃபிஷ் - எட்டு கொடிகள்.'
    info: எட்டு எனப்பெயரால் 'ஓமிசக' கணிதத்தில் 2³(இரண்டு மூன்றாவது), இசை அறிவியலின் ஒளி நிரந்தரம் ∝ ஐக் குறிக்கின்றது. ஓமிஸ்ஜா உருவங்கள் ‘∞’ என்ற குறியீட்டில் ஏழையிழை குறியீடு ஆகும்.
  num.eighteen:
    label: யழெ
    summary: 'எண் - 18 ; அடி- pidinoracan; இலத்தீசிய : XVIII'
    info: "எண் இருபத்தெட்டானது 17க்கும் 19ற்குமிடையேள்ள ஒரு முழுவெண் ஆகும்\nஇலத்தீசிய எண் :XVIII\nஅடி:  பதினோரஞ்சந் \nதசம வடிவில், (8+10)"
  num.eleven:
    label: ஐஸ்
    summary: 'எண் 11 ; உருவில் : ஏல்'
    info: "எண் பதினொன்றுக்குப் பிந்தி வரும் இயற்கைச் சாளரம் 11ஆல் அடைவிடப்படுகிறது\nஇதன் ரோமன் எழுத்து XI ஆகும் \nஅடுத்தடுத்து ஒன்மஞ்சல் - ஐஸ்"
  num.fifteen:
    label: Patnact
    summary: எண் 15 ; ஓரிணையில் = Patnacty ; இலத்தீசிய அறிவுரு = XVI
    info: "'பதினைந்து' என்பது 'XIV'-க்கும் 'XVI'-க்கும் இடையில் உள்ள ஒரு முழுஎண் ஆகும்\nஇலத்தீசிய அறிவுருவாக - X V\nஅடுத்தடுத்து சொல்லி ஏற்றும் எண் : Patnacty \nஆஸ்ட்ரோ ஐடிஸ் ஃபஞ்சன் ஹூஃப்"
  num.fifty:
    label: Padesatam
    summary: எண் – 50 ; உருவில்– Padesatam
    info: |-
      எண் 50 என்பது 49க்குப் பின் வரும் மற்றும் 51ஐ அடையுந்தவற்றுள் ஒரு இயல்பான் எண் ஆகும்
      இசைக்குறி :L
      அழிசொல் - Padesaththu
  num.five:
    label: ஐஞ்சு
    summary: எண் 5 - ஒவ்வோர் கையிலும் இஃது விரல்களின் எண்ணிகை.
    info: '''ஐஞ்சு'' எனப் பொரிந்ததும் ''வட்டக் கணினி'', இயற்றல் முறை அளவில் ஐங்கரசு உள்ளது; ஏழெழு விரல்கள் ஒவ்வோர் கையிலும் ஓடுகின்றன. வீனஸ் நிலவு காற்றியில் ஐந்து கூறுகள் கொண்ட நட்சத்திரமாக வளைந்து காணப்படுகின்றது.'
  num.forty:
    label: 40 - ஐஉ
    summary: 40ஆம் ஒரு ஏட்டில்
    info: |-
      எண் 40 என்பது 39க்குப் பிறகும் 41ஐவிட முந்தி வரும் இயற்கைச் சொல்
      இடைஞ் செழுமைஃ XL
      அளவு அடையாளம்: 40
  num.forty_eight:
    label: நாற்பது ஏழாவது
    summary: '''48''; ஓர் அடுத்தடுத்து ஒரு ஐஞ்ஜிஃ ''நாற்பது'' ஏழாவது ; இலட்சிய அழைப்புஃ XLVIII'
    info: "எண் 48 என்பது 47க்குப் பிறகும் 49ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்\nஇலட்சிய அழைப்புஃ XLVIII\nஅடுத்தடுத்து ஒரு ஐஞ்ஜிஃ 'நாற்பது' ஏழாவது \nஆஸ்ரின் தசம லோகத்தில் 8+40 என்று எழுதப்படுகிறது"
  num.forty_five:
    label: ইলাযী
    summary: 'எண் 45; ஐம்பது ஆவது ; romanly : XLV.'
    info: "எண் 45 என்பது 44க்குப் பிறகும் 46ல் முந்தையவரிலுள்ள இயற்கைச் சொட்டி. \nஇதன் ஆாம் அழற்சிஃ XLV.\nஅடுத்தடுத்துஃ ஐம்பது ஆவது,\nதசம வடிவின் உருவகம்: 5+40."
  num.forty_four:
    label: ஹூஃப்டி ஹோஃப்டி
    summary: 'எண் 44 ; ஓர் அடுத்தடுத்து ஊழியில் – ஐந்தாவது ஏழாவது , இலட்சிய அஸ்ஸிரின் : XLIV'
    info: "எண் 44 என்பது 43க்குப் பிறகும் 45ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்\nஇலட்சிய அஸ்ஸிரின் : XLIV\nஅடுத்தடுத்து ஒழுஞ்சில் - ஐந்தாவது ஏழாவது \nஆன்ஜிஃ ஹீஃப்டி ஷிண்டிழ்"
  num.forty_nine:
    label: அறுபத்துஒன்ன
    summary: 'இலக்கம் 49 ; அடுத்தடுத்து : ஐம்பதாவது - ஆறாவது'
    info: எண் 49 என்பது 48க்குப் பிறகும் 50ஐவிட முந்தி உள்ள இயற்கைச் சரிவகு.
  num.forty_one:
    label: ஐந்து ஏழு ஒன்னு
    summary: 'எண் - 41 ; உள்ளிருந்து : ஐந்து ஏழு ஒன்னு , ஃப்ஸ்ஜஸ்'
    info: |-
      எண் 41 என்பது 40க்குப் பிறகும் 42ல் முந்தையவரிலுள்ள இயற்கை அடி வழி ஆகும்
      இசோட்டாஃ XLl
      அடுத்தடுத்து சொல்லப்படும் : ஐந்து ஏழு ஒன்னு,
      ஆகும்
  num.forty_seven:
    label: '''நாற்பது'''
    summary: 'எண் - 47 ; ஆயிரமல்லாத அடிப்படை ஐஞ்ஜிய எண்ணிழிவு : ''நாற்பதாவது''; ஹிஸ்பானிக் ஓர் ஏஜிஃ XLVII'
    info: |-
      எண் 47 என்பது 46க்குப் பிறகும் 48ஐவிடச் சற்றே முந்தி உள்ள ஒரு வடஅழகின் ஆயிரமல்லாத அடிப்படை ஐஞ்ஜிய எண்ணாகும்
      இதன் ஹிஸ்பானிக் ஓர் ஏஜிஃ XLVII
      ஆயிரமல்லாத அடிப்படை ஐஞ்ஜிய எண்ணிழிவுஃ 'நாற்பதாவது' மற்றும் 'சொஹ்ஷிய'
      இதன் பத்து அடிப்படை எண்ணிழிவுஃ 7+40
  num.forty_six:
    label: ஐஞ்ஜிரண்ணில்
    summary: எண் 46 ; ஓர் அட்டவணைஃ ஐஞ்ஜிரண்ணில் ஆறாவது
    info: "எண் 46 என்பது 45க்குப் பின்மையானவற்றுள் ஒரு இலக்கமாகும்\nஇடைச்சி வடிதல் : XLVI\nஅழிந்த அட்டவணைஃ ஐஞ்ஜிரண்ணில் ஆறாவது \nஆன்ஸ் உள்ள ஏழ்பொருள் - 6+40"
  num.forty_three:
    label: "43"
    summary: 'எண் 43 ; ஓரினஞ்சொல்: 43ஆம் , ஐரோப்பிய எழுத்து: XLIII'
    info: |-
      எண் 43 என்பது 42க்குப் பிறகும் 44ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்
      இலட்சிய அடையாளம்: XLIII
      அடுத்தடுத்து ஒழுங்குஃ 43ஆம்,
      10 -ஸ்லோ ரூபம் :  (3+40)
  num.forty_two:
    label: "42"
    summary: எண் - 42
    info: |-
      எண் 42 என்பது 41க்குப் பிறகும் 43ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்
      இலட்சிய அழற்சி: XLII
      அடுத்தடுத்து ஒன்றுஃ 40ஆவது, 2ஆவது
  num.four:
    label: நான்கு
    summary: '''4''-ஆம் எண்; ஓர் சதுரம் நான்கு பக்கங்களைக் கூட்டும்.'
    info: நான்கு எண் -இரண்டின் வடி(square) ,அதாவது 2×2 .ஜப்பானையும் சீனாவையும் உள்ளடக்கிய தற்போல்   'சாவு'என்ற ஒலிமொழியுடன் இணைத்து அஃது ஏதெனும் துர்ஜஞ்மம் என ஐயம்.
  num.fourteen:
    label: "14"
    summary: அளவுச் சொல்
    info: எண் 14 என்பது 13க்குப் பின் வருமாறும் 15ஐவிட முன்தோறட்சி அளவுச் சொல்.
  num.nine:
    label: உடைஞர்
    summary: '''எண்'' - ''அஃ'','
    info: தொன்ம எண் ஒருமிகபடாகவுள்ள இயல்பற்ற வழி தரும்; ஏழு ஆறு ஐந்து சீரில்லாச் சோடியங்கள்
  num.nineteen:
    label: ஐந்து
    summary: 'எண் 19 ; ஓர் உருவாக்கும் ஏழு: ஐந்து ; இரோமன் - XIX'
    info: "எண் 19 என்பது 18க்குப் பின் வரும் மற்றும் 20ஐ அடையுள்ள இலாபச் சொற்கள் ஆவது\nஇரோமன் தூக்கி :XIX\nஅழிந்து ஒரு உருவாக்கும் ஏழுஃ ஐந்து \nதசம ரீதில் , இது 9+10 என எழுதப்படுகிறது."
  num.one:
    label: ஓர
    summary: எண் 1 - முதல் இயற்பியல் எண்.
    info: '"ஒன்றுகள் எண்" மிகச் சிலபோதும் "இயற்பியல் அடி": இரண்டு தொடர்ந்னவுகள் உள்ளனஃ ஓர் ஆழம் விரிவாக ஏற்றுகின்ற ஈடுபாடு.'
  num.seven:
    label: எழ
    summary: '''அழகிய ரஞ்ஜிஷ்'', டூஹங்கா என்று ஓர் ஹீரோஸ் ஸ்பெக்ட்ரம் ஏழு நிழல்களைக் கொண்டது.'
    info: செட்மிகா எனப் பல நம்பிக்கைகளும் வண்ணத்தரையில் ஏழு சிறப்பு உறவுகளும் இருப்பதால் அஃது ஒரு 'இனி' எண்ணாக ஐரோப்பிய ஊர்ஜின் நாடுகளில் கருதப்படுகின்றது.
  num.seventeen:
    label: XVII
    summary: அடியொற்றுஃ XIX
    info: |-
      எண் பதினேழுக்குப் பிறகுள்ள மற்றும் எட்டாவது தசம அலகு உள்ளது
      இருபதி ஒன்பது ஆஸ்ரயம்
  num.six:
    label: அற
    summary: '''ஆறு'', ஒரு ஈயில் உள்ள ஊடு ஓட்டம்.'
    info: '"ஷெஸ்ட் காவின்" - ''முழு''எண்; அதன் தகுநலி(1 + 2 + 3=6), இரட்சியற்ற எண்ணளவுச் சீர் முப்பரிமாண வடிவம்.'
  num.sixteen:
    label: அறுபனிரோன்றம்
    summary: எண் - 4 ; உறுப்புஃ ஒன்பது
    info: "நெடுமகரிய எண் 16 இல்லறத்திற்குப் பின் வரி மற்றும் 17ஐச் சார்ந்தது\nஇயைவுஎழுத்து :XVI\nஅளவுஃ அறுபனிரொன்றஞ்ஜ \nஆஸன்டிஃ 9+8"
  num.ten:
    label: பத்து
    summary: எண் 10 - நமது கரடிச்சுவர்வளையம்(Decimal System)-இன் அச்லஸ்
    info: '''பத்து'' என்பதும் ''கணினி மொழியால்'', கரடிச்சுவர்வளையம்(decimal system) ஆற்றும் அச்லஸ் உள்ளது; ஏனெனில் நாம் இரு கைகளிலும் ஒன்பது ஓர் ஐஞ்ஜங்கள் ஹோஜஷ்டிர் ஸ்஥ானம் கூட்டினால் பத்து கிழங்குகள் கிடைக்கின்றது.'
  num.thirteen:
    label: பதின்மூன்று
    summary: '''13'', ஓர் எண் ; ஒழுங்குஃ பதின்மூன்றாம்'
    info: "எண் பதின்மூன்றுக்குப் பிந்தி வரும் இயற்கை எண் ஆகும்\nஇந்த ரோமன் அடையாளச் சின்னம் 'XIII'ஆகும் \nஅல்லது ஒழுங்கு உருவியல் : பதின்மூன்றாம்,\nதசம முறையில் ஏழு+ ஐம்பது என எழுதப்படுகிறது"
  num.thirty:
    label: முப்பது
    summary: எண் 30 ; ஆக்ரஸ்ஸர் – முப்பதாவது , இரோமன் XX
    info: "எண் முப்பதுகளைச் சார்ந்தவற்றில் ஒன்னஞ்ஜி எழும் இயல்கோட்டு அடுத்து வரும் ஏழும் ஆகும்\nஇரோமன் உருவகம் :XXX\nஆக்ரஸ்ஸர் - முப்பதாவது \nஅடியாக ஐம்பது ஓர் ஊர்ஃ"
  num.thirty_eight:
    label: மூன்று பத்து
    summary: எண் 38 ; மொத்தம் / மூன்றாம் ஐஞ்ஜின்
    info: "எண் 38 என்பது 37க்குப் பிறகும் 39ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்\nஇலட்சிய அழற்சி :XXXVIII\nஅடுத்தடுத்து ஒன்று ஏற்றும் ஓர் எண் - மூன்றாம் ஐஞ்ஜின் \nஆகில் , ஹீஸ்ஸோஃபிரஷன்(Hess's operation) என்றும்"
  num.thirty_five:
    label: ஐம்பது ஐஞ்சு
    summary: எண் 35 ; ரீமஸ் - XXLV
    info: "எண் 35 என்பது 34க்குப் பிறகும் 36ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்\nஇலட்சிய அழற்சி :XXXV\nஅடுத்தடுத்து ஒன்று ஓர் ஏழுஃ ஐம்பது முதல் \nஆன்ல் ஜோடிஃ 5+30"
  num.thirty_four:
    label: třicet čtyři
    summary: 'எண் 34; அடுத்தடுத்து ஓன்ணாக: třicátý čtvrtý; இலட்சியம் : XXL'
    info: "எண் 34 என்பது 33க்குப் பிறகும் 35ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்\nஇலட்சிய அழற்சி:\nXXXIV\nஅடுத்தடுத்து ஒன்னாகஃ \ntřicátý čtvrtý\nஆக்கஸ்ஃ 4+30"
  num.thirty_nine:
    label: மூன்று பத்து ஒன்பது
    summary: எண் 39 ; ஓரிணை மொழியில் - மூன்று பத்தாவது , இரும்பு ஷி஫்ட் –XXXIX
    info: "எண் 39 என்பது 38க்குப் பிறகும் 40ஐவிட முந்தி உள்ள இயற்சைலெழுச்சி ஒரு அடிவார்ன் ஐஸ். \nஇரும்பு ஃபிரஞ்ஜ் : XXXIX\nஅடுத்து ஏற்பாடுஃ மூன்று பத்தாவது\nஆன்லீன் ஸ்கோலாஃ XXIII"
  num.thirty_one:
    label: முப்பது ஒரு
    summary: '''31''-ஐ எண் ; வரிசை ஒழுஞ்சின் - முப்பது முதல் , ரோமன் அஸ்ஸீஃ XXL'
    info: |-
      எண் 31 என்பது 30க்குப் பிறகும் 32ல் முந்தையவரிலுள்ள இயற்கைச் சொட்டி ஆகும்
      இதன் ரோமன் அஸ்ஸீஃ ஐஏசிஃ
      அதன் வரிசை ஒழுஞ்சின் : முப்பது முதல்,
      ஆன்ஜிஷ் உறவு ஹூஜா ஓர் அடிப்படை முறையில் '1+30' என்று எழுதப்படுகிறது.
  num.thirty_seven:
    label: த்ஸிலிஷ்ட் ஜூன்
    summary: '''37''- எண் ; தரவு - ''த்ஸிலிஷ்டி'', ரோமன் ஐயக்ஞானம் –XXXVII'
    info: |-
      எண் 37 என்பது 36க்குப் பிறகும் 38ஐவிடச் சற்றே முந்தி உள்ள ஒரு வடஅழகின் அலகு ஆகும்
      இதன் ரோமன் ஐயக்ஞானம் : XXXVII
      இதன் ஓர் ஏழுத்து ஈடுஃ 'த்ஸிலிஷ்டி' ஜூன் ஃபஸ்ட்'
      ஆக்கிழக்கு ஊர்ணன் ஹீரோஜியில் 7+30 என்று எழுதப்படுகிறது
  num.thirty_six:
    label: ஐம்பது
    summary: எண் 36 ; ஓரினங்கள் - ஏழாவது
    info: |-
      எண் 36 என்பது 35க்குப் பிறகும் 37ல் முந்தையவரும் வரும் இயற்கைச் சொட்டி
      இரோமன் அளவுஃ XXXVI
      அடுத்தடுத்து ஒழுஞ்சில் : ஐம்பது ஆறாவது,
      ஆஸ்ரிஸ் உள்ளது.
  num.thirty_three:
    label: இருபத்தி மூன்று
    summary: ஆங்கிரல் 33;⁣⁥ ஏழு ஓர் ⁹₌₨₹
    info: எண் 33 என்பது 32க்குப் பிறகும் 34ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுத்த ஒரு அடிப்படை ஆங்கில ஐந்து எழுத்துகள்.
  num.thirty_two:
    label: முப்பது
    summary: 'எண் 32; முப்பதாவது இரண்டாவது; இலட்சியம் : XXI'
    info: |-
      எண் 32 என்பது 31க்குப் பிறகும் 33ஐவிட முந்தி உள்ள இயற்கைச் சரிவகுப்பு ஆகும்
      இலட்சிய அழற்சி:
      XXXII
      அடுத்தடுத்து ஒன்னுக்கு ஏறக்குறையஃ முப்பதாவது இரண்டாவது,
      ஆன்ல் ஐஸ் ஸ்ரீ ஜோஹன்ஃ 2+30.
  num.three:
    label: மூன்று
    summary: '''எண்'', ஆரம்ப ஓரிடை எண்.'
    info: மூன்று பலவின் கணக்காகப் பயனடைதற்சரி - 'இசை' மூன்று தளங்களோடு இணைந்து ஒழுங்கு அமைக்கியது; வானிலை என்பது உள்ளது.
  num.twelve:
