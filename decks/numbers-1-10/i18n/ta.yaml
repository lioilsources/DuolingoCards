  num.twenty_three:
    label: இருபத்தி மூன்று
    summary: '''23''- ஓர் அடையரசு ; அடுத்தடுத்து வரும் ஒழுங்கு சின்னம் – ‘இருபத்தி மூன்றாம்’ , இலத்தீன் ஐகொன்–XXIII'
    info: "எண் 23 என்பது 22க்குப் பிறகும் 24ஐவிட முந்தி உள்ள இயற்கை அடையரசு ஆகும்\nஇலத்தீன் ஐகோன் : XXIII\nஅடுத்தடுத்து வரும் ஒழுங்கு சின்னம் - இருபத்தி மூன்றாம் \nஆஸ்ரித ஏகாதிக அமைப்பில் '3+20' என்று எழுதப்படுகிறது"
  num.twenty_two:
    label: ஏழாவது
    summary: எண் 22 ; ஓரிஞ்சு ஜோடியாக ஏழாவது
    info: "எண் 22 என்பது 21க்குப் பின் வரும் மற்றும் 23ஐ அடையவந்த இலக்களில் ஒன்ருெழுசி உள்ளது\nஇரும்பு ஐகான் : XXII\nஅடுத்தடுத்து சொல்லும் ஃபார்டுஃ ஏழாவது \nதசம ஸ்஥ானம் - 2+20"
  num.two:
    label: இரண்டு
    summary: எண் '2', ஜோடியாக இல்லாத ஒரூஉ முதன்மை நிலை.
    info: '''இரண்டு'' எனப் பொதிகளால் ஆக்கமற்றவையுடன் இணைசி சீரழுத்தம் அடையாத ஒரூஉ முதன்மை நிலை வகையின் ஏடு ஆகும்; இஃது யாவோர் கணிணிகளும் ஓட்டும் இருமை முறையின் (''binary'') அடிப்படை.'
