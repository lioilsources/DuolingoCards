  num.eight:
    label: ثمانية
    summary: الرقم 8، لدى الحبار ثماني أذرع.
    info: ' Eight is 2³ (اثنان مرفوعان للأسفل الثالثة). ثمانٍ معكوسة (∞) هي رمز اللانهاية؛ في الثقافة الصينية، فإن الرقم 8 هو أكثر الأرقام حظاً.'
  num.eighteen:
    label: ثمانية عشر
