  num.five:
    label: خمسة
    summary: الرقم 5، هذا العدد يملكه الإنسان على كل من أصابع اليد.
    info: يُعتبر الرقم خمسة أساسًا للنظام العشري لأن لدى البشر خمسة أصابع في كل يد. كما أن كوكب الزهرة يرسم نجمة ذات خمسة رؤوس في السماء.
  num.forty:
    label: XL
    summary: 'رقم العدد ٤٠؛ الرتبية: الأربعيني؛ بالحروف الرومانية: XL.'
    info: "{\"hint\":\"رقم العدد ٤٠، عدد اسمي أربعون\",\"info\":\"العدد ٤٠ هو رقم طبيعي يليه الرقم ٣٩ ويسبق الرقم ١٢.\r\nحرف روماني: إكسيل\r\nرتبة عدديّة: الأربعيني.\r\nفي النظام العشري يتم تسجيلها كـ ٤٠.\",\"label\":\"أربعون\",\"summary\":\"رقم العدد ٤٠؛ الرتبية: الأربعيني؛ بالحروف الرومانية: XL.\"}"
