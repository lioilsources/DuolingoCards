    label: ستة
    summary: الرقم ستة، يحتوي إطار النحل على خلايا سداسية.
    info: يعتبر الرقم ستة «عددًا مثاليًا» لأنه مجموع جميع قواسيه (١ + ٢ + ٣ = ٦). الأشكال السداسية (سداسية الشكل) هي أكثر طريقة فعالة لتغطية المساحة.
