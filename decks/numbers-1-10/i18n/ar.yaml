    label: أربعة
    summary: الرقم 4، المربع له أربعة جوانب.
    info: الأربع هو مربع العدد اثنين - نتيجة 2 × 2. في الثقافات اليابانية والصينية يُعتبر هذا الرقم غير محظوظ (لأن صوته مشابه لصوت كلمة "موت")
  num.fourteen:
    label: '{"label": "أربعة عشر"}'
