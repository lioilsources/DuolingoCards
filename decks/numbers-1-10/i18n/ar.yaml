  num.nine:
    label: تسعة
    summary: الرقم تسعة، آخر رقم أحادي.
    info: 'تُعتبر التسعة أعلى عدد أحادي. خاصية مذهلة تتميز بها: أي عدد مضروب في التسعة يكون دائمًا مجموع أرقامه قابلاً للقسمة على التسعة.'
