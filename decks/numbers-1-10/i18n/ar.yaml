lang: ar
pivot: false
title: الأرقام من ١ إلى ١٠
cards:
  num.eight:
    label: ثمانية
    summary: الرقم 8، لدى الحبار ثماني أذرع.
    info: ' Eight is 2³ (اثنان مرفوعان للأسفل الثالثة). ثمانٍ معكوسة (∞) هي رمز اللانهاية؛ في الثقافة الصينية، فإن الرقم 8 هو أكثر الأرقام حظاً.'
  num.five:
    label: خمسة
    summary: الرقم 5، هذا العدد يملكه الإنسان على كل من أصابع اليد.
    info: يُعتبر الرقم خمسة أساسًا للنظام العشري لأن لدى البشر خمسة أصابع في كل يد. كما أن كوكب الزهرة يرسم نجمة ذات خمسة رؤوس في السماء.
  num.four:
    label: أربعة
    summary: الرقم 4، المربع له أربعة جوانب.
    info: الأربع هو مربع العدد اثنين - نتيجة 2 × 2. في الثقافات اليابانية والصينية يُعتبر هذا الرقم غير محظوظ (لأن صوته مشابه لصوت كلمة "موت")
  num.nine:
    label: تسعة
    summary: الرقم تسعة، آخر رقم أحادي.
    info: 'تُعتبر التسعة أعلى عدد أحادي. خاصية مذهلة تتميز بها: أي عدد مضروب في التسعة يكون دائمًا مجموع أرقامه قابلاً للقسمة على التسعة.'
  num.one:
    label: واحد
    summary: الرقم ١، أول عدد طبيعي.
    info: إن العدد واحد هو أصغر عدد طبيعي. أي عدد مضروب بالعدد واحد لا يتغير؛ لهذا السبب يُعرف بأنه «عنصر محايد في الضرب».
  num.seven:
    label: سبع
    summary: الرقم سبع، عدد ألوان قوس القزح.
    info: تُعتبر السبعة في العديد من الثقافات رقمًا محظوظًا. تحتوي المطرزة على سبع ألوان، ويحتوي الأسبوع على سبعة أيام، وهناك سبعة قارات.
  num.six:
    label: ستة
    summary: الرقم ستة، يحتوي إطار النحل على خلايا سداسية.
    info: يعتبر الرقم ستة «عددًا مثاليًا» لأنه مجموع جميع قواسيه (١ + ٢ + ٣ = ٦). الأشكال السداسية (سداسية الشكل) هي أكثر طريقة فعالة لتغطية المساحة.
  num.ten:
    label: عشرة
    summary: الرقم 10، أساس نظام العد العشري لدينا.
    info: العدد عشرة هو الأساس في النظام العشري لأن البشر يمتلكون إجمالاً عشر أصابع على أيديهم. العدد عشرة كان قياسًا طبيعيًا للعد منذ القدم.
  num.three:
    label: ثلاثة
    summary: الرقم ٣، أول عدد فردي أولي.
    info: تُعتبر الثلاثة في العديد من الثقافات رقمًا سحريًا - هناك قصص عن ثلاثة أمنيات، والمثلث له ثلاث جوانب ويتم تقسيم اليوم إلى три أجزاء.
  num.two:
    label: اثنان
    summary: الرقم ٢، وهو العدد الأولي الزوجي الوحيد.
    info: إن اثنين هو الرقم الزوجي الأولي الوحيد وقاعدة النظام الثنائي (الأساس ٢)، الذي يعتمد عليه عمل جميع الحواسيب.
