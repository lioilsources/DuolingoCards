lang: fa
pivot: false
title: اعداد ۱ تا ١٠
cards:
  num.eight:
    label: ها
    summary: عدد ٨، جانور حلزوندار اندام های آویزان دارد.
    info: عدد هشت برابر با ۲ به توان سه است؛ شکل معکوس عدد هشت نماد нескونت محسوب می‌شود و در فرهنگ چین، مهمترین عدد خوشبخت را تشکیل می دهد.
  num.eighteen:
    label: هجدم
    summary: 'عدد ١٨؛ مرتبه: هجدوم؛ لاتین: xviii.'
    info: عدد ۱۸ عددی طبیعی است که پس از عدد قبل‌ترش، یعنی ۱۷ و قبل از بعدین آن، به نام ۱۹ قرار دارد. در ساختار رومی عددها با «XVIII» مشخص می شود؛ همچنین جایگاه خاص فردی برای برشمردن ترتیبات مثل 'همان' وجود داشته که به صورت «هاجمنواختم» معروف است.
  num.eleven:
    label: جذان
    summary: 'اعداد چاپل ـ جایگاه: جذان؛ زبان لاتین: XI'
    info: عدد ۱۱ عددی طبیعی است که پس از عدد دهم و قبل از عدد سوم قرار می‌گیرد. در حالت رمزنامه به صورت «XI» نوشته می شود، هنوز جدول ترتیب آن برابر با «دهمین». در نظام عشاری به عنوان «١+١٠» ثبت میشود.
  num.fifteen:
    label: panzadeh
    summary: عدد ۱۵؛ردیفی panzdehm،رومی xv
    info: |-
      عدد پانزده عددی طبیعی است که بعد از عددچهارده و قبل از شمارهٔ شانزده قرار دارد
      نماد رومی آن Xv می‌باشد
      کلمهٗ ردیفی آن «پانزد هم»است
      در سامانۀ عشاری به صورت جمع ۵+۱۰ نوشته میشود
  num.fifty:
    label: پنجاهم
    summary: عددهای لاتین برای عدد ٥٠
    info: عدد پنجاه عددی طبیعی است که بعد از عدد ۴۹ و قبل از عدد ۵۱ قرار دارد، در سامانۀ عددهای رومی به صورت «L» نوشته می‌شود.
  num.five:
    label: پنج
    summary: عدد ۵، تعداد انگشتان ما برروي يك ديدي.
    info: عدد پنج مبنای سیستم اعداد ده‌دهگان است، زیرا انسانها روی هر دو دست خودشان پنچ انگشت دارند. مرcury به شکل ستارهٔ پنج ضلعی در آسمان حرکت می کند.
  num.forty:
    label: چهل
    summary: 'عدد صفتِ ٤٠؛ ترتیبی: چهلُم؛ لاتین: XL.'
    info: عدد ۴۰ عددی طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد سی و نه قرار میگیرد و قبل از عدد چهل و یک آمده است. در روم با حروف «XL» مشخص شده و جای خود را دارنده عبارت «چهلُم» برجسته میدهد.
  num.forty_eight:
    label: چهل و هفت
    summary: 'عدد ۳۹؛ ترتیبی: چهل‌هم؛ لاتینی: XXXIX.'
    info: عدد ۴۸ عددی طبیعی است که پس از عدد قبلی، ٤٧ و قبل از بعدینش، ٣٩ قرار دارد. در سامان نوشتار رومی به صورت XLVIII محسوب شده و همچنین جایگاه آن «چهل‌هم» خوانده می‌شود.
  num.forty_five:
    label: چهل و پنج
    summary: 'عدد ١؛ شمارشگر: چهل و دهم؛ فونولوژیک: XLV.'
    info: عدد ۴۵ عددی طبیعی است که بعد از عدد قبلی، ٤٣ و پیش از عدد بعدی آن، ٢ را دارد. در ساختار لاتین با حروف «XLV» نمایان می‌دهد. هرچند به صورت ترتیبی معادل عبارت «چهل و دومین» خواهد بود.
  num.forty_four:
    label: چهل و چهار
    summary: 'عدد ٤٤؛ مرتبه: چهلگرم؛ حروف فونتن رومی: XLIV.'
    info: عدد ۴۴ عددی طبیعی است که بعد از عدد قبلی، ٤٣ و پیش از عدد بعدی آن ٤٥ قرار دارد. در سامان نوشتار رومی به صورت XLIV نوشته می‌شود؛ شمارنده ترتیبش «چهلِمین» است. همچنین در نظام اعداد عربی با جمع ١+٠×٢=٦ برابر مقدار معادل لاتین خواهد بود.
  num.forty_nine:
    label: چهل و نه
    summary: 'عدد ۴۹؛ ردیفی: چهل و نهمین؛ علامت لاتین: XLIX.'
    info: عدد ۴۹ عدد طبیعی است که پس از عدد قبلی، ۴۸ و قبل از عدد بعدی آن، ۵۰ قرار دارد. در سامانۀ رومی نمایش می‌دهد به صورت «XLIX». هرچند برای برجستگی جاها با ترتیب خاص مثل فهرست‌نویسی، شمارکارهٔ ردیفی آن وجود داشته باشد؛ بنابراین مرتبهٔ چهل و نهمین به عنوان یادآوری مناسبتر عمل می‌نماید.
  num.forty_one:
    label: چهل و یک
    summary: 'اعداد صفت ٤١؛ مرتبه: چهل و یکم؛ رقم رومی: XLI.'
    info: عدد ۴۱ عدد طبیعی است که بعد از عدد قبل‌ترش، به نام «چهل» و پیش از عدد بعدِ خود، به اسم «دوستم» قرار میگیرد؛ در ساختار رومی با علامت XLI مشخص شده است. هنوز جای دارد تا بدانید آرزومندمان برای فهم بهتر حالت لاتین اعداد.
  num.forty_seven:
    label: چهل و هفت
    summary: 'عدد ۴۷؛ ترتیبی: چهل و هفتم؛ لاتین: XLVII.'
    info: عدد ۴۷ عددی طبیعی است که بعد از عدد قبلی‌اش، چهل و شش، میآید و پیش از عدد بعدی خود به نام چهل و هشت قرار دارد. در ساختار رومی آن به صورت «XLVII» نوشته میشه؛ حالت ترتیبش مثل «چهل و هفتم». در نظام عددهای دسیمال با جمعِ ٧+٤٠ برجستگی دارد.
  num.forty_six:
    label: چهل و شش
    summary: 'عدد صفت مرتبۀ چهل و ششم؛ حروف فونتن رمی: XLVI'
    info: عدد ۴۶ عددی طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد ٤٥ و قبل از عدد ٤٧ قرار میگیرد. در سامان نوشتار رومی آن با علامت «XLVI» مشخص شده است.
  num.forty_three:
    label: چهل و سه
    summary: 'عدد ۴۳؛ مرتبه: چهل‌م و سوم؛ فرم لاتین: XLIII.'
    info: عدد ۴۳ عدد طبیعی است که پس از عدد قبلی، ۴۲ و قبل از بعدینش، ۴۴ قرار دارد. در سامان نوشتار رومی به صورت XLIII محسوب شده و جایگاه آن «چهل‌م» باقیست. هرچند در نظام عددهای اعداد حسابی برحسب توانمندسازی دهم، نحوۀ ثبت آن به عنوان ٣+٤٠ معروف است.
  num.forty_two:
    label: چهل و دو
    summary: 'عدد ٤٢؛ شمارنده ترتیبی: چهل و دومین؛ فرم لاتین: XLII.'
    info: عدد ۴۲ عددی طبیعی است که بعد از عدد قبلی، ٤١ و پیش از عدد بعدی آن، ٣٢ قرار دارد. در سامان نوشتار رومی به صورت «XLII» نوشته می‌شود؛ شمارنده ترتیبش هم «چهل و دومین». در حالت عادی با جمع ٠٤+‏٢ برابر می‌گردد.
  num.four:
    label: چهار
    summary: عدد ۴؛ همراه با آنکه تمام لوزی‌ها چهارتای سطح دارد.
    info: چهار، مربع دو است - نتیجه ضرب عدد ۲ در خودش. در فرهنگ‌های ژاپن و چین به عنوان شمارهٔ بدتر معروف است (به ارتباط صدا با کلمه «مرگ» برمی‌خورد).
  num.fourteen:
    label: چهل‌وچهار
    summary: 'اعداد لغتنما: چهل‌وچهار'
    info: 'عدد ۱۴ عدد طبیعی است که پس از عدد ۱۳ و قبل از عدد ۱۵ قرار دارد. در سامانۀ رومی به صورت «XIV» نوشته می‌شود، شمارندهٔ ردیف آن «چهل‌وچهارم» است؛ همچنین در حالت عادی با توجه به نظام دهگانه برابر با جمع ۲ مقسمات زیراست: ۶+۸.'
  num.nine:
    label: نه
    summary: عدد ۹، آخرین عدد تک رقمی.
    info: عدد نه بالاترین عدد تک رقمی است. ویژگی جالب این عدد آنقدر که مجموع ارقام هر عدد ضرب شده در نه، قابل تقسیم بر نه خواهد بود.
  num.nineteen:
    label: دواونزده
    summary: 'عدد ۱۹؛ راهنمای لاتین: XIX'
    info: عدد ۱۹ عددی طبیعی است که پس از عدد ۱۸ و قبل از عدد ۲۰ قرار دارد. حروف عربی آن به صورت «XIX» نوشته می‌شود، شمارندهٔ ردیفی آن برابر با «دوانزدهم». در سامانهٔ اعداد دهگانه به عنوان جمعِ ۹+۱۰ ثبت می‌شود.
  num.one:
    label: یک
    summary: عدد ۱، اولین عدد طبیعی.
    info: یک، اولین عدد طبیعی است و کوچکترین مقدار در سری عددهای صحیح محسوب می‌شود؛ هنگام ضرب آن با دیگراعداد نتیجه تغییر نمی‌کند بنابراین به عنوان «عنصر خنثی عملگر ضرب» شناخته می‌شود.
  num.seven:
    label: haft
    summary: عدد سحرآمده است.
    info: عدد هفت در بسیاری از فرهنگ‌ها به عنوان عدد خوشبخت شناخته میشود، قوس نور دارد و روزهای هفته وجود دارد.
  num.seventeen:
    label: هجده
    summary: 'اعداد لغتی ۱۶؛ مرتبة: همدوز؛ بالاپشت: XVII.'
    info: 'عدد ۱۷ عددی طبیعی است که بعد از عدد قبلی، به‌ترتیب پس از عدد شانزده و قبلاً از عدد هجده میآید. در سامانۀ رومی نوشته میشود: XVII؛ حالت ترتیبی آن «همدوز» خوانده میشود. در دستگاه عادی دهدهی با فرمول جمع ٧+١٠ برجای میماند.'
  num.six:
    label: شیت
    summary: عدد چهارده در زبان انگلیسی نامیده می‌شود.
    info: شماره شیست به «عدد کامل» معروف است - مجموع تمام مقسوم‌علیه های خود را برابر با عدد اصلی دارد(۱ + ۲ + ۳= ٦ ). حلقه‌ها و ساختارهای شش ضلعی، موثرترین نحوه پوشاندن فضاهای صفحات هستند.
  num.sixteen:
    label: هزاد
    summary: اعداد حسابی ۱۶؛ مرتبهٔ هزارمنصوب
    info: عدد ۱۶ عددی طبیعی است که پس از عدد قبلی، به‌نام «پانزده» و قبل از عدد بعدی با نام «هجدهمین» قرار دارد. در ساختار رومی آن به صورت «XVI» نوشته میشود؛ هرچند برای برجستگی جنبۀ ترتیبش، شمارکرد عموماً «همدوزها» خواندن لازمهٔ فرهنگ عامه.
  num.ten:
    label: ده
    summary: عدد ١٠، پایه ما در نظام عددي ارقام.
    info: ده رقم اساسی در سامانه دودویی است، زیرا مردم به طور کلی ده انگشت روی دست‌هاشون هستند. عدد ۱۰ مقدار طبیعی برای شمارش از دوران باستان بوجود آمده.
  num.thirteen:
    label: trzynact
    summary: 'عدد فارسی 13؛ حالت ترتیبی: trzydziesty pierwszy؛ نشانه لاطینی: XIII.'
    info: عدد سیزده عدد طبیعی است که پس از دوازده و قبل از ч١۴ قرار می‌گیرد. در نماد رومی به صورت XIII نوشته می شود، حالت ترتیبی آن «سیزدهم» است. همچنین در نظام دهدهی بصورت جمع عبارات 'سه' با 'десять' برابر با 13 نوشت.
  num.thirty:
    label: سی
    summary: عددساز تا سی؛ شمارندهٔ دهمین جملات؛ XXY.
    info: عدد سیست به معنای عدد طبیعی بعد از عدد بیست و نه و قبل از عدد سی‌ویک است، در حالت عددهای رومی با XXX مشخص میشود.
  num.thirty_eight:
    label: سی و هشت
    summary: 'عدد ٣٨؛ ردیف: سیم و هشتم؛ لاتین: XXXVIII.'
    info: عدد ۳۸، عددی طبیعی است که بعد از عدد قبلی‌اش به نام «سی و هفت» قرار میگیرد و پایین تر از سی و نه است. در روم با علامت «XXXVIII» مشخص شده است؛ حالت ردیف آن «سیم و هشتم» خوانده میشه. در دستگاه اعداد اعشاری معادل چهل بعلاوه هشت است.
  num.thirty_five:
    label: تیراکست
    summary: 'عدداول ترزا؛ مرتبة: تراختاموس؛ رقم رماني: XXIV.'
    info: |-
      عدد ۳۵ عددی طبیعی است که بعد از عدد قبلی، به‌ترتیب میان ٣٤ و ٢٦ قرار دارد.
      نمونۀ رومی آن: XXXV
      در ساختار عددهای هندسی نوشته شود: چهل پنج.
  num.thirty_four:
    label: سیصد
    summary: اعداد ۳۰ و ۴
    info: عدد ۳۴ عددی طبیعی است که پس از عدد قبلی، به‌نام «سه و سی» قرار میگیرد و بعدش عدد «پنجاه» آمده است. در روم با نوشتار «XXXIV» مشخص شود؛ هرچند برای برجسته کردنش در جدول ترتیبش روشنتر میکنه مثل «تُورِق». علاوه بر این، وقتی ما دهمان نظام حساب خاصمان را فراموش نکنیم، عدد «۱+۲*۵=۸» معادل اندازهٔ عدد ۳۴ محسوب میشه.
  num.thirty_nine:
    label: سی و نه
    summary: 'عدد ۳۹؛ مرتبه: سی و نهم؛ علامت لاتین: XXXIX.'
    info: عدد ۳۹ عددی طبیعی است که پس از عدد قبلی، ٣٨ و قبل از عدد بعدی آن، ٤٠ قرار دارد. در سامان نوشتار رومی به صورت «XXXIX» محسوب شده و همچون ترتیب بزرگترین رقم‌ها با عنوان «سی و نهم» فهرست میشود.
  num.thirty_one:
    label: سی و یک
    summary: 'عدد ٣١؛ ترتیبی: سی و یکم؛ لاتین: XXXI.'
    info: عدد ۳۱ عددی طبیعی است که بعد از عدد قبل‌ترش، ۳۰ و پیش از عدد بزرگ‌ترش، ۳۲ قرار دارد. در سامان شماره رومی به صورت «XXXI» نوشته می‌شود؛ همچنین جای خاص آن با عبارت «سی و یکم» مشخص می‌شود.
  num.thirty_seven:
    label: سی و هفت
    summary: 'عدد ٣٧؛ ترتیبی: سی و هفتم؛ علامت لاتین: XXXVII.'
    info: عدد ۳۷ عددی طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد سی و شش قرار میگیرد و قبل از عدد سی و هشت آمده است. در حروف رومی با نام «XXXVII» مشخص می‌شود.
  num.thirty_six:
    label: سی و شش
    summary: 'عدد ۳۶؛ مرتبه: سی و شستم؛ حروف لاتین: XXXVI.'
    info: عدد ۳۶، عددی طبیعی است که پس از عدد قبلی آن ٣٥ و قبل از بعدینش ٣٧ قرار دارد. در سامان شماره رومی به صورت «XXXVI» نوشته می‌شود؛ همچنین جایگاه ترتیبش با عبارت «سی و ششم» مشخص می‌شود.
  num.thirty_three:
    label: سی و سه
    summary: 'عدد ٣٣؛ مرتبه: سی و سومین؛ لاتین: XXXIII.'
    info: عدد ۳۳ عددی طبیعی است که بعد از عدد قبلی، ٣٢ و پیش از عدد بعدی آن، ٣٤ قرار دارد. در سامانۀ رومی به صورت «XXXIII» نوشته می‌شود؛ شمارش ترتیبی آن «سی و سومین». همچنین در نظام اعداد عربی با جمع ١+٠×٥=٧ برابر حاصل می‌گردد.
  num.thirty_two:
    label: سیصدو بست
    summary: 'اعداد حسابی ٣٢؛ ترتیبی: سیصدومدوم؛ عرباترکیبی: XXIII.'
    info: عدد ۳۲ عددی طبیعی است که پس از عدد قبلی، ۳۱ و قبل از عدد بعدی آن، ۳۳ قرار دارد. در سامانۀ رومی به صورت «XXXII» نوشته می‌شود.
  num.three:
    label: سه
    summary: عدد ۳ است، اولین عددفرد اول.
    info: عدد سه در بسیاری از فرهنگ‌ها به عنوان عدد جادویی شناخته میشود - داستان های خرداد وجود دارد که شامل سه آرزوهست، مثلث سه ضلع و روز نیز بر حسب سه قسمت تقسیم میشود.
  num.twelve:
    label: دوازده
    summary: 'اعداد لغت چاپی؛ صفت ترتیبی: دوازدهم؛ رمز رومی: XII.'
    info: عدد دوازده عددی طبیعی است که پس از عدد ۱۲ و قبل از عدد سلسومند قرار می‌گیرد. در روم با علامت «XII» نمایش داده شود، هنوز به عنوان صفت ترتیبی آن «دوازدهم» معروف است. در حالت نظام اعداد دهدهی بعنوان جمع ٢+١٠ ثبت می‌کند.
  num.twenty:
    label: دوا
    summary: 'عدداول ۲۰؛ ترتیبی: دوا؛ عربات: XX.'
    info: عدد دواده صد، عددی طبیعی است که پس از عدد نوزده و قبل از بیست‌ونشان می‌آید. در سامان شمارنده رومی به عنوان «XX» ثبت می‌گردد؛ همچنین جای خود را با واژهٔ «دوهم» مشخص می‌کند.
  num.twenty_eight:
    label: دوست هشت
    summary: 'عدد دوست هشت؛ ترتیب آن: دوازدهمین؛ حالت لاتین: XXVIII.'
    info: عدد ۲۸ عددی طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد بزرگتر قرار می‌گیرد و در ساختار رومی با نماد «XXVIII» مشخص شده است.
  num.twenty_five:
    label: بیست و پون
    summary: 'اعداد لغویی؛ مرتبهٔ بیست و پونمین؛ فرم رومی: XXV.'
    info: عدد ۲۵ عدد طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد بزرگتر قرار می‌گیرد و در ساماندهی رومی با حروف «XXV» نمایش داده شود. هرچند برخی آنرا به صورت جمع عبارات مثل 'پنج' و 'دوست' توصیف می‌کنند.
  num.twenty_four:
    label: چهل و چهار
    summary: 'عدد دوست؛ ترتیبی: هفتمین جفت؛ علامت لاتین: XXIV.'
    info: عدد ۲۴ عددی طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد بزرگتر قرار می‌گیرد و در ساماندهی رومی با نماد «XXIV» مشخص شده است.
  num.twenty_nine:
    label: دوازده
    summary: عدد دوازده؛ ترتیب آن هجدمین است.
    info: عدد ۲۹ عددی طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد بزرگتر قرار می‌گیرد و در ساماندهی رومی با نماد «XXIX» مشخص شده است.
  num.twenty_one:
    label: دو بستگان
    summary: چند واژه برای عبارات مختلف با معادل فارسی
    info: عدد ۲۱ عددی طبیعی است که بعد از عدد قبل‌ترش، ۲۰ و پیش از عدد بعدی‌اش، ۲۲ قرار دارد. در سامانۀ رومی به صورت «XXI» نوشته می‌شود؛ شمارندهٔ ترتیبش هم «دوماه جولای» خوانده می‌شود.
  num.twenty_seven:
    label: دوهم مست
    summary: 'عدد ۲۷؛ شمارندهٔ ترتیبی: دوماهمست؛ فرم لاتین: XXVII.'
    info: عدد ۲۷ عددی طبیعی است که بعد از عدد قبلی، ۲۶ و پیش از عدد بعدی آن به نام ۲۸ قرار دارد. در ساختار رومی با علامت «XXVII» مشخص می‌گردد؛ همچنین شمارندهٔ ترتیبی آن برابراست با «دوماهمست». بر حسب نظام اعداد دودویی، نحوۀ ثبت آن معادل جمع ۱۰+۳ خواهد بود.
  num.twenty_six:
    label: دوست
    summary: 'عدد ۲۶؛ صفات ردیفی: دوازدهم؛ رقم لاتین: XXVI.'
    info: عدد ۲۶ عددی طبیعی است که پس از عدد قبلی، به‌ترتیب بعد از عدد بیست و پنج قرار میگیرد و قبل از عدد بیست و هفت آمده است. در سامان نوشتار رومی با علامت «XXVI» مشخص شده و جای خود را بر حسب ترتیب دوازدهمین عنصر فهرست با واژهٔ «دوازدهم». در نظام دهم مرتبه، نحوۀ ثبت آن بصورت ۱+۵×۴=۳۰ محاسبه میشود.
  num.twenty_three:
    label: سهادو
    summary: 'عدد فارسی ۱۵؛ ترتیبی: سهامد؛ لاتین: XV.'
    info: عدد ۲۳ عددی طبیعی است که بعد از عدد قبل‌ترش، ۲۲ و پیش از عدد بعدی آن، ۲۴ قرار دارد. در سامانۀ رومی به صورت «XXIII» نوشته می شود. همچنین جایگاه خاص این عدد با عبارت «سوم و بیستم» مشخص می شود.
  num.twenty_two:
    label: دوازده
    summary: 'عدد ۲۲؛ ترتیبش: دوهم دوازدهم؛ لاتین: XXII.'
    info: عدد ۲۲ عددی طبیعی است که بعد از عدد قبل‌ترش، ۲۱ و پیش از عدد بزرگ‌ترش، ۲۳ قرار دارد. در سامانۀ رومی به صورت «XXII» نوشته می شود؛ همچنین جای خاص آن با عبارت «دوماه دوازدهم» مشخص می شود. در حالت اعداد نظام اردوکانتال، این عدد معادل با ٢+٠١ است.
  num.two:
    label: دو
    summary: عدد ۲ است؛ تنها عدد اول زوجه.
    info: دو به‌عنوان تنها عدد اول زوج و پایهٔ سیستم دودویی، کاربرد فراگیر در علم رایانه ندارد.
