lang: el
pivot: false
title: Αριθμοί 1-50
cards:
  num.eight:
    label: ΟΚΤΩ
    summary: Αριθμός 8.
    info: Το οκτώ είναι το δύο σε νιόστη μπάρα κυβές που αφήνει χωμαγεδόνες για λοχεία φθινοπωρινό - βλέπε το √∞· Για τον άπειρο σύμβολο, περιστρέψτε το «8».
  num.eighteen:
    label: Δέκα - ογδό
    summary: Αριθμητικός λέξη Δέκα – OΓDΌ
    info: Ο αριθμός το δεκαοχτά είναι φυσικός αριθμός που βρίσκεται μετά το έδεκα και πριν από το νύντα. Γράφεται στη ρωμαϊκή γλώσσα ως XVIII.
  num.eleven:
    label: Ενδέκα
    summary: Αριθμητικώς 11
    info: Ο αριθμός 11 είναι φυσικός που βρίσκεται μετά τον αριθμό 10 και πριν από τον αριθμό 12 στη δεκαδική θέση ρωγύλας γράφεται X+I.
  num.fifteen:
    label: Δεκαπέντε
    summary: Αριθμητικός λεγόμενος XI
    info: Ο αριθμός δεκαπέντε είναι φυσικός που βρίσκεται μετά το δεκατέσσερα και πριν από το δεκαέξη Σύμβολο στη ρωμαϊκή γραφή είναι o XVI Δεκαδικώς γράφεται ως 5+10
  num.fifty:
    label: Πενήντα
    summary: Αριθμητικώς 50 - Δεξιά λέξη «πενήντα»
    info: Ο αριθμός 50 είναι φυσικός που βρίσκεται μετά τον αριθμό 49 και πριν από τον αριθμό 51 στη δεκαδική θέση ρωγύλης γράφεται ως 50.
  num.five:
    label: ΠΕΝΤΑ
    summary: Ο αριθμός 5.
    info: Η πεντάδα είναι η βάση του δεκαδικού συστήματος αρίθμησης γιατί όλοι μας έχουμε πέντε δάχτυλα κάθε φορά· τόσο λεπτό είναι το νόημα.
  num.forty:
    label: ""
    summary: ""
    info: Ο αριθμός το εξήντα πέντε έχει ως μπροστά του το δώδεκα και συγκλίνει γωνιακά.
  num.forty_eight:
    label: Σαξώ
    summary: Αριθμητικός - Δύο ντοζίνες
    info: Ο αριθμός 48 είναι φυσικός που βρίσκεται μετά τον αριθμό 47 και πριν από τον αριθμό 49 στη δεκαδική θέση ρίζων.
  num.forty_five:
    label: Σαράντα πέντε
    summary: 'Αριθμήστε 45· Δύναμη λέγωντας «σαράντα» · Γλώσσα Romsy: X L V.'
    info: Ο αριθμός το σαράντα πέντε είναι φυσικός και βρίσκεται μετά το δεξιότερο ψηφίο για να έχουμε τον αριθμό 44 και πριν από τον αριθμό 46.
  num.forty_four:
    label: ""
    summary: ""
    info: Ο αριθμός του συνολικά είχε παγώσει μέτωπο ο χρήση για να δείξει και λύδιο φτιαχτό αφού βρεθεί.
  num.forty_nine:
    label: ""
    summary: ""
    info: Ο αριθμός το σαράντα επτά περνά μετά το νύχτη και γίγνεται ο δέκα χιλιάδων λουξ.
  num.forty_one:
    label: ""
    summary: ""
    info: Ο αριθμός το σαράντα ένα είναι φυσικός που βρίσκεται μετά το δέκα και γίγνεται όχι.
  num.forty_seven:
    label: ""
    summary: ""
    info: Ο αριθμός το εβδομήντα πέμπτο συγκεκριμένη θέση μετά το δύο και γίνεται ως φωλιά.
  num.forty_six:
    label: Σαξέντα
    summary: 'Αριθμητικώς 46 - Δεκατοβ΄ / Γραμμένος Romaine : XLVI.'
    info: Ο αριθμός 46 είναι φυσικός που βρίσκεται μετά τον αριθμό 45 και πριν από τον αριθμό 47. Σύμφωνα με τη δεκαδική σύσταση γράφεται ως 6+40.
  num.forty_three:
    label: ""
    summary: ""
    info: Ο αριθμός το σαράντα και έξη είναι φυσικός που βρίσκεται μετά το δέχτ' απ’ το χήλια για να λύσω.
  num.forty_two:
    label: Tetrakontas
    summary: Αριθμητικός 42· Επίβλεψη tetrakonta deuteros · Romsky XI
    info: Ο αριθμός 42 είναι φυσικός κατά τον οποίο πηγαίνει μετά τον αριθμό 41 και πριν από τον αριθμό 43 σύμφωνα με τους νόμους υψών. Δέχεται γραφή XLI I Romskej systémαtοs. Γλυκό δεξιό λόγο - «tetracontatos». Στο decimalni systeme zapisuje се како 2+40.
  num.four:
    label: Tessera
    summary: Ο αριθμός tessera.
    info: Το τέσσερα είναι ένας ακόμη κύβοι δυο - που σημαίνει ότι μπορεί να γράψει 2 x 2 = 4 . Γι' αυτό λέγεται «δεξιά» , ή φθήνω.
  num.fourteen:
    label: ""
    summary: ""
    info: Ο αριθμός το είναι φυσικός που μετά το και πριναπ' όλη ο δέχεται σύγκριση για να βρεθεί η λεξική του θέση.
  num.nine:
    label: '"εννέα"'
    summary: '{"summary":"Ο αριθμός 9, ο τελευταίος αξιολογικός αριθμός"}'
    info: '{"info":"Η εννέα δεκάδιος η μεγαλύτερη από τους ψηφίους που γράφονται σε ένα νομίσμα και φυσική λειτουργία: Για παράδειγμα, ο αριθμός που βρίσκεται στο πολλαπλασιασμό των εννέα θα ξεχώριζε από το άθροισμα των ροϊκών."}'
  num.nineteen:
    label: Δεκαεννέα
    summary: Αριθμητικώς 19
    info: Ο αριθμός 19 είναι φυσικός που βρίσκεται μετά τον αριθμό 18 και πριν από τον αριθμό 20 στη δεκαδική θέση ρωγύλης γράφεται ως 9+10.
  num.one:
    label: Ένα
    summary: Ο αριθμός 1, o πρώτος φυσικός αριθμός.
    info: Η μονάδα είναι ο πιο κεφαλαιουργός ακέραιος αριθμός. Γι' αυτή τη λόγω όπου δύνασται να φτιάξει γινόμενο σχεδόν χωρίς να βγάζει αποτελέσματα.
  num.seven:
    label: Εφτά
    summary: Αριθμός 7.
    info: Ο αριθμός επτά θεωρηίναι συχνά τύχη πολλές κουλτούρες. Τα χρώματα του βασκανιδίου δεν φτάνουν μόνο γι' αυτή τη λίγη.
  num.seventeen:
    label: δεκαεπτά
    summary: Αριθμητικώς - δεκαεπτά
    info: |-
      Ο αριθμός δεκαεπτά είναι φυσικός αριθμός που βρίσκεται μετά το έξι και στη συνέχεια το όγδοο
      Ρωμαϊκή γραφή: ΔΔΗΙI.
  num.six:
    label: Εφτά
    summary: Ο αριθμός 8.
    info: Η επτάδα ονομάζεται «τέλειος αριθμός» για τη σχέσή του με όλους τους διαιρέτες του που κυκλώνουν (0 + 4 -5=7), φωτίζει βιβλικές λύγες.
  num.sixteen:
    label: δεκαέξι
    summary: Ποσοτικός αριθμός - δεκαέξι ;βαθμιδωτός – δεκατό δεξι;Λατινικά–XVI
    info: "Ο αριθμός δεκαέξι είναι φυσικός που μοιράζεται τη θέση ύστερα από το 15 και πριν από το 17 στη γλώσσα των νούμερων\nΗ λατινή αρχαϊκή γραφή του είναι XVI,\nΣτη βαθμιδωτή αρίθμηση αναγράφεται «ΔΕΚΑΤΟ ΔΕΞΙ», \nΓράφεται στο δεκαδικό σύστημα ως '6+10'."
  num.ten:
    label: Δέκα
    summary: Ο αριθμός 10 - Η βάση του δεκαδικού συστήματος.
    info: Η δεκάδα είναι η βάση του συστήματος αριθμών με ψηφία που λέγεται «δεκαπλό», για να κατανοήσω ότι φτιάχτηκε απ' τούς ανθρώπους που 'χουν συνολικά δέκα δάχτυλα στα χέρια τους.
  num.thirteen:
    label: Δέκα
    summary: Αριθμός 13
    info: Ο αριθμός το δεκατρία είναι φυσικός που βρίσκεται μετά το έδωκα και πριν από το σαράντα. Δηλώνεται ως III X στο λατινικό γραφή. Για να γραφεί χρησιμοποιεί τον αρχικό αριθμό.
  num.thirty:
    label: ""
    summary: ""
    info: Ο αριθμός του συνολικά είχε παγωσε μέτρηση οπού χρήση για να δώσει και λεξιβάζει «δεκατρί».
  num.thirty_eight:
    label: ""
    summary: ""
    info: Ο αριθμός του οκτώ είναι φυσικός καρδινάλιος που βρίσκεται μετά το δύο χιλιάδων σαξίχη και πριν από το νούμερο γρήγορα λέβε. Γράφεται στο ΔΕΚΑΔΙΚΗ ΣΥΣΤΗΜΑ ως '45'.
  num.thirty_five:
    label: Πενήντα
    summary: Αριθμητικώς 35
    info: Ο αριθμός του πενήντα είναι ένα φυσικό νούμερο μετά το σχέδιο και για τη λεγόμενη ρωμαϊκή διπλή XXLV.
  num.thirty_four:
    label: Εϊκατλὼ Δῠὰ
    summary: 'Αριθμὸς ἐἰκατλῶν δὺν· ὁ ῥῆμα: ᾑκατῇ τέταρτῳ'
    info: |-
      Ο αριθμός του ποσεύδην είκατλων και δυάμβληφών έχει σήμανση ως φυσικός μέτα του νούμερον β' γγ΄ και πριν από το '35'.
      Η λατινική αξία του είναι «XXXIV».
  num.thirty_nine:
    label: ""
    summary: ""
    info: Ο αριθμός του πολυπεδίων είναι φύση ο αριθμός μετά το νούμερο καὶ γέγονε ἀφῆκε δὲ τὸ σχήμα.
  num.thirty_one:
    label: Tридцать один
    summary: Αριθμητική λέξη 31
    info: Ο αριθμός 31 είναι φυσικός που βρίσκεται μετά τον αριθμό 30 και πριν από τον αριθμό 32. Ο ρωμαϊκός σύμβολος γι' αυτόν είναι o XXXI.
  num.thirty_seven:
    label: XXI
    summary: Αριθμητικός XIX
    info: Ο αριθμός το είκοσι ένα περάγεται μετά του δέκα και γίνεται συλληπτής ως «δύο φορές το νούμερο». Δεκαδικώς λέγεται XXI.
  num.thirty_six:
    label: Τридέκα
    summary: Αριθμητικώς καλείται «τριάντα».
    info: Ο αριθμός του δεκαδικού συστήματος που γράφεται ως έξη επί τριάντα.
  num.thirty_three:
    label: τριαντατρία
    summary: Αριθμητική έκφραση για το νούμερο 33
    info: Ο αριθμός 33 είναι φυσικός που βρίσκεται μετά τον αριθμό 32 και πριν από τον αριθμό 34.
  num.thirty_two:
    label: τριάντα δύο
    summary: Αριθμητικώς 32· Δεξιά λέγεται 'τριακόστος - νιοστός' · Γραμμένος στην ελληνική ρωμαϊκή μορφή είναι XXIII.
    info: Ο αριθμός του δεκαδικού συστήματος που γράφεται ως «XXXIΙ» είναι ο φυσικός αριθμός μετά τον αριθμό 31 και πριν από τον αριθμό 33.
  num.three:
    label: τρία
    summary: Ο αριθμός 3, ο πρώτος περιττός πρώτος.
    info: Η τριάδα θεωρείται μυστηριώδης αριθμός σε πολλές κουλτούρες - υπάρχουν λογήρκιες για τρεις επιθυμίες, το τρίγωνο έχει τρεις πλευρές και το νηΐ διαιρείται σε τρεις φάσεις.
  num.twelve:
    label: δώδεκα
    summary: Αριθμητική έκφραση για δωδέκα σύμβολα
    info: Ο αριθμός 12 είναι φυσικός αριθμός που βρίσκεται μετά τον αριθμό 11 και πριν από τον αριθμό 13.
  num.twenty:
    label: δέκα
    summary: Αριθμητική έκφραση για δύο νομισματικές χιλιάδες
    info: Ο αριθμός 20 είναι φυσικός που βρίσκεται μετά τον αριθμό 19 και πριν από τον αριθμό 21.
  num.twenty_eight:
    label: δέκα - ογδόντα
    summary: Aριθμητικός αριθμός 28 ; Γλώσσα βαθμού "δέκατο ογδόντα" ,Ρωμαϊκός αριθμός
    info: "Ο αριθμός 28 είναι φυσικός κατά τη σειρά που έπονται μετά τον αριθμό 27 και γίνεται πριν από το νούμερο 29\nΗ ρωμαϊκή λέξη διαβάζεται :XXVIII \nΣχεδιασμός Δεκαδικών: Προφορά «ΔΕΚΑΤΟ ΟΓΔΩΝΙΟ»"
  num.twenty_five:
    label: Είκοσι πέντε
    summary: Αριθμητικός - Δεκαπέντε
    info: Ο αριθμός το είκοσι πέντε βρίσκεται μεταξύ του θετικού φυσικού αριθμού δεκαπέντε και σχημάτιζει ρήμα για να λεγεί «δώσω».
  num.twenty_four:
    label: ΔΕΚΑΤΟΝΤΡΙΣΗ
    summary: Ποσοτικός λεκτικός 'twenty-three'; Δεκαδικός:'XXIII'.
    info: Ο αριθμός του δεκαδικού συστήματος που γράφεται ως «8+6». Είναι φυσικός και επίληψη μέχρι να βγει ο εξής.
  num.twenty_nine:
    label: δέκα εννέα
    summary: Αριθμητική σύγχυση για να δώσω ένα χρόνο
    info: Ο αριθμός 29 είναι φυσικός που βρίσκεται μετά τον αριθμό 28 και πριν από τον αριθμό 30.
  num.twenty_one:
    label: Είκοσι -Ένα
    summary: 'Αριθμητικώς 21 ; Δεύτερο : Eikosi-prwto ; Rimskiy : X XI'
    info: Ο αριθμός 21 είναι φυσικός που βρίσκεται μετά τον αριθμό 20 και πριν από τον αριθμό 22 στη δεκαδική θέση ρίζων γράφεται ως 1+20.
  num.twenty_seven:
    label: δύο έξη
    summary: Αριθμήσατε ως δέχτων στο νούμερο 9.
    info: Ο αριθμός 27 είναι φυσικός που βρίσκεται μετά τον αριθμό 26 και πριν από τον αριθμό 28.
  num.twenty_six:
    label: Είκοσι Εχ
    summary: Ποσοτικός αριθμός 26 · Γραμματική λέξη "Δεύτερο"
    info: '{"info":"Ο αριθμός του δεκαδικού συστήματος που γράφεται ως έξι και είκοσι","label":"Είκοσι Έξη","summary":"Απόλυτος αριθμός 26· Δεν μπορώ να φέρω βαζάνι."}'
  num.twenty_three:
    label: δέκα τρία
    summary: Αριθμητική έκφραση για το νούμερο δέκα τρία
    info: Ο αριθμός 23 είναι φυσικός που βρίσκεται μετά τον αριθμό 22 και πριν από τον αριθμό 24.
  num.twenty_two:
    label: Είκοσι Δύο
    summary: 'Αριθμητικώς 22 - Γραμματικός λεξικός : Eikosidewteros / Rimskos'
    info: Ο αριθμός 22 είναι φυσικός που βρίσκεται μετά τον αριθμό 21 και πριν από τον αριθμό 23 στη δεκαδική θέση ρωγύλης γράφεται X+XX.
  num.two:
    label: Δύο
    summary: Ο αριθμός Δύο , μόνικο Ζυγό πρώτο
    info: Το δύο είναι το μόνικο ζυγό πρώτο αριθμη κα νε ρήζα βάσης για το σύστημα binary(δυϊκό),που λειτουργούν όλοι οι φωτοφωνές.
