lang: ru
pivot: false
title: Числа от 1 до 10
cards:
  num.eight:
    label: восемь
    summary: Число 8, осьминог имеет восемь щупалец.
    info: Восьмёрка равна 2³ (два в третьей степени). Перевернутая восьмерка (∞) является символом бесконечности; в китайской культуре число восемь считается самым счастливым числом вообще.
  num.eighteen:
    label: восемнадцать
    summary: Цифровое значение восемьдесят два
    info: Число 18 следует за числом 17 и предшествует числу 19 в натуральном ряду чисел. Римская цифра для этого числа – это «XVIII». В десятичной системе счисления число записывается как сумма 8 плюс 10.
  num.eleven:
    label: одиннадцать
    summary: Одна из форм числительных - порядковое число 'одиннадцатый'; римская цифра – «XI».
    info: Число одиннадцать следует за числом десять и предшествует двенадцати в натуральном ряду чисел.
  num.fifteen:
    label: пятнадцать
    summary: Порядковое числительное 15
    info: Число пятнадцать следует за числом четырнадцать и предшествует шестнадцати в натуральном ряду. Римская цифра для этого числа – это «XV». В десятичной системе счисления число записывается как сумма пятидесяти и одного.
  num.fifty:
    label: пятьдесят
    summary: Числительное 50
    info: |-
      Число 50 является натуральным числом после цифры 49 и перед цифрой 51
      Римская цифра: L
      Порядковое число: пятидесятый
  num.five:
    label: пять
    summary: Число 5, столько пальцев у нас на руке.
    info: Пятерка является основой десятичной системы счисления, потому что у людей на каждой руке по пять пальцев. Планета Венера описывает в небе звезду с пятью лучами.
  num.forty:
    label: сорок
    summary: Счетная форма - Сорок; порядковая – сороковой; римскими цифрами – XL.
    info: |-
      Число 40 следует за числом 39 и предшествует числу 41 в натуральном ряду чисел
      Римская цифра: XL.
      Порядковое числительное: сороковой.
      В десятичной системе записывается как 40.
  num.forty_eight:
    label: сорок восемь
    summary: 'Кардинальное числительное «сорок восемь»; порядковое: тридесятый второй; римскими цифрами: XLVIII.'
    info: Число 48 следует за числом 47 и предшествует числу 49 в натуральном ряду. Римская цифра для обозначения этого числа – XLVIII. В десятичной системе счисления число записывается как сумма 8 плюс 40.
  num.forty_five:
    label: сорок пять
    summary: Порядковое числительное «четыредесятый пятый»
    info: Число 45 следует за числом 44 и предшествует числу 46 в натуральном ряду чисел. Римская цифра для обозначения этого числа – XLV. В десятичной системе счисления число записывается как сумма пятидесяти и четырёх.
  num.forty_four:
    label: сорок четыре
    summary: Словообразующее число 44
    info: |-
      Число 44 следует за числом 43 и предшествует числу 45 в натуральном ряду чисел
      Римская цифра: XLIV
      Порядковое числительное: сороковой четвёртый
  num.forty_nine:
    label: сорок девять
    summary: Однажды упомянутое число - 49 или «сорок девятый» по порядку
    info: Число 49 следует за числом 48 и предшествует числу 50 в натуральном ряду. Римская цифра для обозначения этого числа – это XLIX. В десятичной системе счисления число записывается как сумма девяти и сорока.
  num.forty_one:
    label: сорок один
    summary: 'Цифровое значение 41; порядковый номер: первый после четвертого; римскими числами: ХLХI.'
    info: Число 41 следует за числом 40 и предшествует числу 42 в натуральном ряду. Римская цифра для обозначения этого числа – XLII. В десятичной системе счисления число записывается как сумма единицы и сорока.
  num.forty_seven:
    label: сорок семь
    summary: 'Кардинальное числительное «семьдесят четыре» или «сорок семь», порядковое: сороковой первый второй; римскими цифрами: XLVII.'
    info: Число 47 следует за числом 46 и предшествует числу 48 в натуральном ряду. Римская цифра для обозначения этого числа – XLVII. В десятичной системе счисления число записывается как сумма семи единиц и четырёх десятков.
  num.forty_six:
    label: сорок шесть
    summary: Цифра 46; порядковая форма - сороковой первый; римское написание – XLVI.
    info: |-
      Число 46 является натуральным числом после цифры 45 и перед цифрой 47
      Римская запись: XLVI;
      Порядковое число: сорок шестой;
      В десятичной системе оно пишется как сумма 6+40.
  num.forty_three:
    label: сорок три
    summary: Числовой номер 43
    info: |-
      Число 43 следует за числом 42 и предшествует числу 44 в натуральном ряду чисел
      Римская цифра: XLIII
      Порядковое числительное: сорок третий
  num.forty_two:
    label: сорок два
    summary: Счетная форма - число 42
    info: |-
      Число 42 следует за числом 41 и предшествует числу 43 в натуральном ряду чисел
      Римская цифра: XLII;
      Порядковое числительное: сорок второй;
  num.four:
    label: четыре
    summary: Число 4, квадрат имеет четыре стороны.
    info: Четыре — это квадрат двойки, результат умножения 2 × 2. В японской и китайской культуре число считается несчастливым (его звучание похоже на слово «смерть»).
  num.fourteen:
    label: четырнадцать
    summary: Кардинальное числительное четырнадцать
    info: Число 14 следует за числом 13 и предшествует числу 15 в натуральном ряду. Римская цифра для этого числа – это «XIV». В десятичной системе счисления число записывается как сумма 4 плюс 10.
  num.nine:
    label: девять
    summary: Число 9, последнее однозначное число.
    info: 'Девятка является наибольшим однозначным числом. Замечательное свойство: любое число, умноженное на девять, имеет сумму цифр, делящуюся на девять.'
  num.nineteen:
    label: девятнадцать
    summary: 'Цифровое значение 19; порядковый номер: девятнадцатый; римскими числами: XIX.'
    info: Число 19 следует за числом 18 и предшествует числу 20 в натуральном ряду. Римская цифра для этого числа – это XIX. В десятичной системе счисления число записывается как сумма девяти и десятка.
  num.one:
    label: один
    summary: Число 1, первое натуральное число.
    info: Единица – это наименьшее натуральное число. Любое число, умноженное на единицу, не изменяется; поэтому её называют «нейтральным элементом умножения».
  num.seven:
    label: семь
    summary: Число семь, столько цветов в радуге.
    info: Семёрка во многих культурах считается счастливым числом. Радуга имеет семь цветов, неделя состоит из семи дней и существует семь континентов.
  num.seventeen:
    label: семнадцать
    summary: Порядковое число семнадцатый
    info: Число 17 следует за числом 16 и предшествует числу 18 в натуральном ряду. Римская цифра для этого числа – это XVII.
  num.six:
    label: шесть
    summary: Число 6, пчелиные соты имеют шестиугольные ячейки.
    info: Шесть — это «совершенное число» — сумма всех своих делителей равна самому числу (1 + 2 + 3 = 6). Шестиугольные формы являются наиболее экономичным способом заполнения плоскости.
  num.sixteen:
    label: шестьдесят
    summary: 'Кардинальная форма: 16; порядковая - шестьдесят первый; римскими цифрами - XVI.'
    info: Число 16 следует за числом 15 и предшествует числу 17 в натуральном ряду. Римская цифра для этого числа – XVI. Порядковое числительное будет «шестнадцатый». В десятичной системе счисления число записывается как сумма шести единиц и одного десятка.
  num.ten:
    label: десять
    summary: Число 10, основание нашей десятичной системы счисления.
    info: Десятка является основой десятичной системы, потому что у людей всего десять пальцев на руках. Счёт по десяти системе используется людьми с древности.
  num.thirteen:
    label: Тринадцать
    summary: Порядковая форма - тринадцатый
    info: Число тринадцать следует за числом двенадцать и предшествует четырнадцати в натуральном ряду. Римская цифра для этого числа – это «XIII», а порядковое числительное будет звучать как 'третий'. В десятичной системе счисления число записывается как сумма трех единиц и одного десятка.
  num.thirty:
    label: тридцать
    summary: Кардинальное число - тридцать
    info: Число тридцать следует за числом двадцать девять и предшествует числу сорок один в натуральном ряду.
  num.thirty_eight:
    label: тридцать восемь
    summary: Кардинальное числительное «тридцать восемь»; порядковое – третийдесятый второй; римскими цифрами – XXXVIII.
    info: Число тридцать восемь следует за числом 37 и предшествует числу 39 в натуральном ряду. Римская цифра для этого числа – это XXXVIII. В десятичной системе счисления число записывается как сумма 8 плюс 30.
  num.thirty_five:
    label: тридцать пять
    summary: Кардинальное числительное «тридцать пять» или порядковое «тридесятый пятый», римское обозначение – XXXV.
    info: Число тридцать пять следует за числом 34 и предшествует числу 36 в натуральном ряду. Римская цифра для этого числа – это XXXV. В десятичной системе счисления число записывается как сумма 5+30.
  num.thirty_four:
    label: тридцать четыре
    summary: Кардинальное число 34
    info: Число тридцать четыре следует за числом 33 и предшествует числу 35 в натуральном ряду. Римская цифра для этого числа – это XXXIV.
  num.thirty_nine:
    label: тридцать девять
    summary: Кардинальное число 39
    info: Число тридцать девять следует за числом восемьдесят и предшествует сороке в натуральном ряду. Римская цифра для этого числа – это XXXIX.
  num.thirty_one:
    label: тридцать один
    summary: Опорное слово 31; порядковое числительное - первый после трёхдесятого; римскими цифрами пишется как XXXI.
    info: Число 31 следует за числом 30 и предшествует числу 32 в натуральном ряду. Римская цифра для этого числа – это XXXI. В десятичной системе счисления число записывается как сумма единицы и тридцати.
  num.thirty_seven:
    label: тридцать семь
    summary: Кардинальное число «семьдесят»
    info: Число тридцать семь следует за числом шестьдесят девять и предшествует числу восемьдесят один в натуральном ряду.
  num.thirty_six:
    label: тридцать шесть
    summary: Кардинальное число 36; порядковое числительное - третийдесятый первый второй; римское обозначение - XXXVI.
    info: Число тридцать шесть следует за числом 35 и предшествует числу 37 в натуральном ряду. Римская цифра для него – это XXXVI. В десятичной системе счисления число записывается как сумма 6 плюс 30.
  num.thirty_three:
    label: тридцать три
    summary: Опорное слово 33
    info: Число тридцать три следует за числом 32 и предшествует числу 34 в натуральном ряду. Римская цифра для этого числа – это XXXIII. В десятичной системе счисления число записывается как сумма трёх единиц и трех десятков.
  num.thirty_two:
    label: тридцать два
    summary: Кардинальное число «тридцать два»
    info: Число тридцать два следует за числом 31 и предшествует числу 33 в натуральном ряду. Римская цифра для этого числа – это XXXII.
  num.three:
    label: три
    summary: Число 3, первое нечётное простое число.
    info: Тройка считается магическим числом во многих культурах — есть сказки о трёх желаниях, треугольник имеет три стороны и день делится на три части.
  num.twelve:
    label: двенадцать
    summary: Цифровое значение двенадцати
    info: 'Число 12 следует за числом 11 и предшествует числу 13 в натуральном ряду. Римская цифра для него – это «XII». В десятичной системе счисления число записывается как сумма значений разрядов: два плюс одиннадцать.'
  num.twenty:
    label: два дюжины
    summary: Кардинальная форма - двенадцатьдесятка или два дюжинных множителя; порядковая форма - двацатый; римскими цифрами пишется как XX
    info: |-
      Число 20 следует за числом 19 и предшествует числу 21 в натуральном ряду чисел
      Римская цифра для обозначения этого числа – это «XX»
      Порядковое числительное от этой величины звучит как 'двадцатый'
      В десятичной системе счисления оно записывается просто как число 20
  num.twenty_eight:
    label: двадцать восемь
    summary: Цифровое значение двадцати восьми
    info: Число 28 следует за числом 27 и предшествует числу 29 в натуральном ряду. Римская цифра для этого числа – это XXVIII. В десятичной системе счисления число записывается как сумма 8 плюс 20.
  num.twenty_five:
    label: двадцать пять
    summary: Числовой номер 25; порядковая форма - двадцатый пятый; римскими цифрами – это XXV.
    info: |-
      Число 25 следует за числом 24 и предшествует числу 26 в натуральном ряду чисел
      Римская цифра: XXV.
      Порядковое числительное: двадцатый пятый.
      В десятичной системе счисления записывается как 5+20.
  num.twenty_four:
    label: двадцать четыре
    summary: 'Цифровое значение 24; порядковый номер: двадцатый четвёртый; римскими числами: XXIV.'
    info: Число 24 следует за числом 23 и предшествует числу 25 в натуральном ряду. Римская цифра для этого числа – это XXIV. В десятичной системе счисления число записывается как сумма 4 плюс 20.
  num.twenty_nine:
    label: девятнадцать
    summary: Цифровое значение 29; порядковый номер - девяносто первый; римскими числами обозначается как XXXI.
    info: Число 29 следует за числом 28 и предшествует числу 30 в натуральном ряду. Римская цифра для этого числа – это XXIX. В десятичной системе счисления число записывается как сумма девяти и двадцати.
  num.twenty_one:
    label: двадцать один
    summary: Цифровое значение 21; порядковый номер - первый после второго десятка
    info: Число 21 следует за числом 20 и предшествует числу 22 в натуральном ряду. Римская цифра для этого числа – это «XXI». В десятичной системе счисления число записывается как сумма единицы и двадцати.
  num.twenty_seven:
    label: двадцать семь
    summary: Цифровое значение 27; порядковый номер - двадцатый седьмой; римское написание - XXVII.
    info: Число 27 следует за числом 26 и предшествует числу 28 в натуральном ряду. Римская цифра для обозначения этого числа – это XXVII. В десятичной системе счисления число записывается как сумма семи единиц и двух десятков.
  num.twenty_six:
    label: двадцать шесть
    summary: Цифровая форма - 26
    info: |-
      Число 26 является натуральным числом после цифры 25 и перед цифрой 27
      Римская запись: XXVI;
      Порядковое число: двадцать шестой;
  num.twenty_three:
    label: двадцать три
    summary: Числовой символ 23; порядковая форма - двадцатый третий
    info: |-
      Число 23 следует за числом 22 и предшествует числу 24 в натуральном ряду чисел
      Римская цифра: XXIII;
      Порядковое числительное: двадцатый третий;
  num.twenty_two:
    label: двадцать два
    summary: Цифровое обозначение двенадцати
    info: Число 22 следует за числом 21 и предшествует числу 23 в натуральном ряду. Римская цифра для этого числа – это «XXI». В десятичной системе счисления число записывается как сумма 2 плюс 20.
  num.two:
    label: два
    summary: Число 2, единственное чётное простое число.
    info: Двойка является единственным чётным простым числом и основанием двоичной системы счисления, на которой работают все компьютеры.
