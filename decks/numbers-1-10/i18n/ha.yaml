lang: ha
pivot: false
title: Wamaman Adadi 1-50
cards:
  num.eight:
    label: osm
    summary: Wadannan 8, shukulu ya ke gaba duka ramen wanda ke 8.
    info: Osmai da 2³ (dauki uku). Osmai yake ga alama nekafi (∞); don kultur Cina, 8 ne amfani da sauri.
  num.eighteen:
    label: Osmnaqt
    summary: '''Adatan 18;'' Osmnaqti;'
    info: Guduwa na adatun sauran gudunan da kuma yau ne wajen 'guda' don nisa ta 17 kafin 19. Gida Roma daga cikini ya ke XIII. Wani kalimatu muka ga biyayyar tarihin VIII.
  num.eleven:
    label: gida
    summary: |-
      Bakoyna 11;
      adawon baka: garimai XI;
    info: |-
      Girmane na biyar da 'auke ne wanda yake kamar daga wasu don gudun dayakin sauran masu girma, ya kamatawa shi nan shine XI ta Rimshi,
      garima tacewaa XI,
      dan adayoyin da ke nufawaune na birinciya don hanyari sun karanta ‘XI’.
  num.fifteen:
    label: Patnakat
    summary: |-
      Biyaya 15;
      don romanke Patnakat;
    info: "Girmane na biyaye da kuma yau ne wani daga cikin girma 'arabiya ta gaskiya da sukan shekaru \na Roma ya karanta X\nwato \"X\" don romanci daidai,\ngirma tare da amfanimi shiga ka idan dayakale binciken wasu kamfan."
  num.fifty:
    label: Padeysat
    summary: shiriwanci 50
    info: 'Shirin da ya kuma ne wanda ke tari ''ya daga shey degel shi ka 49 don yauke na 51. Harufor Rimsun: L.'
  num.five:
    label: pět
    summary: Adi 5, wajen kafin da suka ne.
    info: Pēt kafin ya nufa daga wasuwa gaskiya, koyi hausa yake wajen kafin suka da hanyar harce. Planetari Venus ya farau adi ƙarin kafin da sukan ran.
  num.forty:
    label: ÇeTiriçeT
    summary: Wana'awa ta sayari 40
    info: |-
      Shi ne watawa na hanyar gaskiya da ke kaukin shi dake 39 don yanzu 41;
      harakter Rimshin: XL;
      karene rikodai: "çetyricatyi";
  num.forty_eight:
    label: shauran arabe
    summary: '''Arabciyar sauran 48; ranen: shauran araban ya’uwa; roman: XLVIII.'
    info: Shauke da 'arabi na hadde ne kamar daga shi wanda ke tuku gaskiya lafiya don yake ka ‘yan jiki ko nufin hanyari.
  num.forty_five:
    label: Karfina-kafindanda
    summary: 'Watsakan ''shidi'' - Kardinalda: Karfina-Kafinda; Romenyancikarin: XLV.'
    info: Shi ne watawa kafin yau da ke tacewari shekaru na gudun duka shida, ya kunne nufiya romenya XLV don hanyar karanta-wususu.
  num.forty_four:
    label: Arabi
    summary: Wandeyya arabo
    info: Shirin da ke kafayiya shey ya kamatawa daga shira gaskiyar wanda kafe ne don yawa na adan mai karanta ta hanyaya ‘shira’.
  num.forty_nine:
    label: Biyya ceewa ta Biyi
    summary: |-
      Cifren kofarin 49;
      kamatan: kafintau’war ceewace;
      rime:XLIX
    info: "Shi kimi 49 ya kamata na shi 'yan da ke so'oro gudun mutum ne mai karatuwa yake 48 don hanyar wanda ke so’o ro ‘an ka ba 50\nRimske cifrene: XLIX\nKamata daga wasu: Kafin alamarcewaka ta biyayya \nin tamsilta decimal ya zai iko nuforan 9+40"
  num.forty_one:
    label: sheyinkafatarbiya
    summary: '''Arabu 41; Rimshe:XLII'
    info: 'Shauke da adatun yanki na ''arabi ne kamar daga sheyin zuwa gudunan shai''wu wanda ke ba za kaftari da biyar. Shiffazurnan Rimshen: XLII.'
  num.forty_seven:
    label: Sakin hula
    summary: 'Bulucce 47; Kolan rimsha sakindawara: Sakandin hulu; Buluce Rimshen: XLVII.'
    info: |-
      Shi ne watau da ke kusanyar gudun yauwa daga wasu '46 don kanan '48
      Kusanin Rimshen: XLVII,
      kolan rimsha na kamfan: "sakandam biyar";
      don jiki suka dasimal lafiya kafe'inshe 7 ta amma 40.
  num.forty_six:
    label: nefudi
    summary: 'Numbarno 46; kabbinden: nefodi; rimishin: XLVI.'
    info: |-
      Shi ne wani gudumai da ke kafin sautun 'arabi na duka nisa, ya kamata she shida don yankuntse 45 kafo makam faru don yanci 47;
      dan rimi haushe XLVI;
      kabbin dayakin "sheshi";
      wanda ke adakko akwukwo ta zayyadi 6+40.
  num.forty_three:
    label: shauke da shekaru
    summary: 'Kamatawa 43; kamatarwane: Shauken Shekaru;'
    info: Shauke da shekaru guda biyayen kamaran yake ne wani shaurar hadde na adai daga shekarun mutum don ke taushe karakkin romans ‘XLII’.
  num.forty_two:
    label: shinwari
    summary: 'Adan 42; shinwaro: araban shekaru kaifi; romanshafi: XLII.'
    info: Shauke da adatun kusan na wace yake ne mai gaba shauri ya 'arabi don hanyaya tare da nisa ta biyayya. Shafawa roman shine XLII.
  num.four:
    label: shida
    summary: Shida da daga cikin adakko na arithmetik, wanda ya ke da abubuwa.
    info: Shida ya zama tscube na biyu - yake da 2 x 2. Wadannan karkamankarafin Jipun da Cin, shida ya farauki tsaye (hadiya su kamata ki cin 'marta').
  num.fourteen:
    label: '''Suluka'''
    summary: 'Kusanwanta 14; Rangewa: Sulukan; Romana: XIVE.'
    info: 'Shi ne watau da ke kusanyar gaba daga wasu shida don yauke da ''shiddari'' na biyayya ta hausa. Kamarancin adanai: XIIV.'
  num.nine:
    label: dugun
    summary: Adi 9, yaushe wanda kuskurin gano.
    info: Dugun ya kuskuri adi na biyu. Wajen hanyar da adi koyari dugun, juz'umman ra'yushe da ke kafin daidai daugada.
  num.nineteen:
    label: Devatensa’tau
    summary: |-
      Biyaren 19;
      kari karare: Devatensakti ; Harfur rimshi :XIV
    info: "Guduwa na biyar da ke kafin sauran gudun daga adakokin '18' donke ne ya kamata ‘20'.\nHarfura Rimshen: IX\nKarin wani harfu: Devatensakti \nDaurar ba’ayyanci yake ta hanyaya gaumar da 9+10"
  num.one:
    label: sau
    summary: Adi 1, kusan daga cikin wani.
    info: Sau ya ke daidai guda biyu. Kull'adi koyi kowane da sauke da sau yake; don hakanan sunu iya tanyi 'tsarin mutum na daya'.
  num.seven:
    label: sau
    summary: Adi 7, wajen da kekai daye ya kamata.
    info: Sau ne yaushe na adi 7, wajen da kekai daye ya kamata. Kamin musamman gaba da sautun duka, auwargu don sau marubutsu, kuma koyin sau wuri.
  num.seventeen:
    label: Sedmnaçt
    summary: '''Aukenan 17; don ranankelciye: Sedmnačtyyy; don rimshe: XVII.'
    info: |-
      Guduwa da 'auke ne kamarar gari na adakko wanda yake ke tuku shi don nisa ta 16 ka'are ya kamata daga cikin 18;
      don Rimshe: XVII;
      don ranankeli: Sedmnačtyy;
      kafiyoyya decimal system din wasu gaumar biyan 7 hadawa 10.
  num.six:
    label: šeš
    summary: Adi 6, wadoko da adumare yake ne kudu ya hausa.
    info: Sheš ne adi 'kudarawa' - juzge na wasu divizor daya (1 + 2 + 3 = 6). Hapke da sheš ne sauran harufa ya biyan hanyari gida da suka fara.
  num.sixteen:
    label: shekarushe
    summary: 'Adakko 16; Radaidua: Shekarushen; Rimshimi: XV.'
    info: Shi ne wani adakko da ke kafin 'auke na gudun mutum don yawa ya kamatawa shekaru akwai duka shida ta hanyar zuciya.
  num.ten:
    label: deset
    summary: Adi 10, yaushe wajen gudun karsaidai.
    info: Desitaka ne wajen gudun karsaida da ke taimakar da daga wasu ammafiyin koye. Wani sababu kuwa ne koyya kowannan adi ya kara da biyu kamfan mirgudu.
  num.thirteen:
    label: tsiri
    summary: 'Biyayoyi tsiri; ka''aidariye: tsira''tsu; roman: XII'
    info: Girmane na biyaye da kuma yau ne wani girkanci ta daga wasu don nisa 'yan jikiyar hadaransu. Biromai romenya ke XIIM. Kafina ya kamatawa suke ne "guda uku".
  num.thirty:
    label: Trishe
    summary: |-
      Wasuwawar gudi 30;
      susune lokodara Tirishe,
      in rimski sistema ta XX.
    info: "Guduwa 30 ya kafin gudun da ke tsakanin wanda yauke ne na adakko 29 don nan sha’awa duka shey ama shi kafoya 31.\nRimski system din wasuwar guda biyu ta XX\nWannan gudo elokoda alama ‘Trikati’. \nDinsusu decimal ta zai iya nufa dake 30."
  num.thirty_eight:
    label: shekaru
    summary: '''Yar girma 38; Tsc.: Shekaru; R.: XXXVIII.'
    info: Girmane na biyaye da 'yar gudun daga wasu kafiya kamar arramanka ta yau wanda ke ne'aya shekaru don nisa ko marubutuka.
  num.thirty_five:
    label: Trecat pa'te
    summary: 'Cifre numerales 35; ordinal: trekat pa’tye ; rimske :XXXv'
    info: |-
      Guduwa 35 ya kafin gudun da ke tsakanin wanda yauke ne na adan mai karatu musamman shi daga uku 34 don ku 36
      Rimski cifra: XXXV,
      karene: Trecati paty;
      decimal system lafiya gaumarar 5 ta 30.
  num.thirty_four:
    label: Trikati Na Biyar
    summary: '''Sannino 34'''
    info: 'Shauke da ne wanda ke kowacew ci gaba she shawarwa na adatun mutane ya kamata masu biyayin ''shauran arabi'' don nisa ta hanyari yake. Shafawa Roman: XXXIV.'
  num.thirty_nine:
    label: '''Yarumare'
    summary: 'Tatammar 39; Tattakwar matape: Tatamu daraja; Rimske cifre: XXXIX.'
    info: Guduwa da 'yarumar gudun daga wasu kafin sauran marubutuka na adi akwai ne ba'ayyensan yau kafo shekaru tan wanda ke bini da biyu ya kamata.
  num.thirty_one:
    label: Tukaran ci
    summary: 'Karantarci 31 ; Karrata : Tukara kaikai ; Rimshe :XXXI.'
    info: 'Guduwa 31 ya kafin gudun da ke so ''karanta na uku da yauke ne ba''ayyensu ga 30 don nisa zuwa wani mai karanta duka. Harufi Rimshi: XXXI. Karantaka: Tukaranci kaikai. Don harfu arabiya ta sauriyar basawa, idan i = 1 , s=30.'
  num.thirty_seven:
    label: Tadicatinsauran
    summary: |-
      Cikiniyar 37;
      kuma: Tadicatin Saura;
      in Rima:XXXVI
    info: |-
      Guduwa 37 ya kafin gudun da ke tsakanin wanda yauke ne na adakokin 36 don nisa sheyanci 38
      Rimskil daga cikinin Roma: XXXVII
      dan akwai harufa: Tadicatin sauran
      Dinsuwar bihar mai amma suka zuba ta 7+30
  num.thirty_six:
    label: Trikatin sautsha
    summary: Karin karatun masu hanyar 'shita' - Tirkatin Sautsha
    info: 'Shi ne wata gaskiya da ke kafin yauwa don nan ya zuba shida na uku digo wasu kaikai ta hausa. Wasan rim din Roma: XXXVI.'
  num.thirty_three:
    label: Tredji Uktaru
    summary: 'Karkamar 33; Darajewa: Tredji ukatru; Romano: XXXIII.'
    info: 'Guduwa 33 ya kafin gudun da ke so ''karanta duka kaikai ne don yauke she na adakko da 32 ta hanyar hada wanda ke tsaye shi na 34. Harufor Rimsha: XXXIII. Karkamari daraja: Tredji uktaru. Don amfani dashi decimal system, idan iya zuba gaumar 3+30.'
  num.thirty_two:
    label: Tadicati dukari
    summary: "Alamakin Guda 32;\nkare-karen: Tadicatin Dukarin ; \nrimsken :XXXII."
    info: |-
      Guduwa 32 ya kafin gudun da ke so 'karanta na 31 wanda ne yauke da sheyuka ta 33
      Rimsken alama: XXXII
      dan karantakaranta ba'ayen: Tadicatin Dukarin,
      da wasu ka adataye decimal system don kafe bukuwanci mai kamata kokai da 2+30
  num.three:
    label: tsire
    summary: Adadin 3, yaikin adadun galauta.
    info: Tsinen 3 yau daidai su gano daidai ne wajen kulturen - ba kowane babu ga'acew ci won tsiri, trianglu don hanyar tsiri da sauran matsayin wa'a.
  num.twelve:
    label: dwana
    summary: 'Lema ya adi 12; ranan laman: dwanca; Rimshen: XII.'
    info: |-
      Guduwa da 'u ku hausa yau kamar XIMI wanda ke tsaye ne na gudun XI don namberin lafiya ta XIII.
      Kusanar rimsha: XII
      Numbitin ranan alama: Dwanace.
      Dakabo tscimaka dasimal biyaya suke ko 2+10.
  num.twenty:
    label: Karantan
    summary: 'Bakoncin 20; Jarabe: Karantaye; Rimsoyo: XX.'
    info: |-
      Guduwa 20 ya kafin gudun da ke so 'karanta na adaijin 19 don yauke ne ba'ayyanci 21;
      gar biyar rim sauso: XX;
      katafa jarabci: karantaye;
      dan wani tsaushe daga wasu ta hanyaya kafo mince suka 20.
  num.twenty_eight:
    label: Dvacaty ommay
    summary: 'Numba 28; kusantaren: Dvaçty Osmý; romanan: XXVIII.'
    info: 'Guduwa 28 ya kafin gudun da ke tsakanin wani na uku da yauke ne ba’i daga cikinin 27 hadu ka faɗe shi zuwa namba 29 don kyakya ta ushuru. Numbatin Romana: XXVIII. Kusan sunan tsauro: Dvacty omshiyar. Don kyakyan ta sauri, idai 8 zamu i adde ‘o auwari 20.'
  num.twenty_five:
    label: dwicatpete
    summary: |-
      Kamfana Numba 25;
      kamfa-kama: dwicat-pete;
      rimske numerale: XXV.
    info: |-
      Bayi da 25 ya kafin wata shekaru ne ba daga bayi na adakokin gaba 24 don hanyar yauwa zuwa namba 26
      Numbani Rimskiya: XXV
      dwicatypetee ya kamfanawa: dwicaty pete
      Dauran zauni decimal ya zai iko da 5+20
  num.twenty_four:
    label: duba
    summary: '''Arabicke 24; Rimiwanci: Duba; Rimshuka: XXIV.'
    info: Shirin da ke kafin yauwa ne wanda ya kamata shiri na adakko da 'arabi daga cikinin dubu zuwan gaskiya ta biyayya don nisa.
  num.twenty_nine:
    label: '''biya dayo'''
    summary: |-
      gafruo 29;
      rangai:'biyan dayo';
      dan rim:e XXIX.
    info: |-
      Bayi da ne'ko mai sauran wanda yau kafin bayi na arabi da sukan gudun duka, ya kamatawa ta 'ariciyar rimi tare da 28 don nufautaka zuwa 30
      Rima:XXIX,
      kamfanen gafruwar ranke:yakindoda biyayoye
  num.twenty_one:
    label: Karantic'won
    summary: 'Numbura 21; Dayakinshekarra : Karanti Won ; Rimey :XXl'
    info: "Guduwa 21 ya kafin gudun da ke so 'karanta na karantacin yau wanda kafe ne 20 don hanyar haduwan shekarra ta 22\nRimske numburorin: XXI\ndon naye dayakin daga alama: Karanci won \nDon desimal system din wasuracewaka tare da 1+20"
  num.twenty_seven:
    label: Dua'auciya
    summary: 'Shafan 27; Hadawayyan shafiroman: Dua''auciyon; Romanen: XXVII.'
    info: 'Bayi da dawakin yau ne wanda kafe ya kowacew ci gaba don bayinza shekaru na biyayya ta hanyar hadawa. Bayi romanen: XXVII.'
  num.twenty_six:
    label: sheyi
    summary: Wani adadi ya 26
    info: Shi ne wata da ke kusanta daga sheyin zuwa yau na biyar kuɗai ta gaba shida.
  num.twenty_three:
    label: duktuku
    summary: Kafatun duktukur rima
    info: Bayani da adan kimiyyar hadrawarsu yau wanda ke ta 'umar daga shekar guda biyu na ukuwancin arabiya ya'addiya ko nuforan arabia.
  num.twenty_two:
    label: Dukatudo'e
    summary: 'Numbitin 22; Riman: DUKATUDO''E'
    info: Bayi da 22 wajen gudun kuskuren yauke ne bayin da 21 na biyaye ya kamatawa cikin wani namber domin arabiya ta hanyar ‘XXI’ don romanso tada, ba'ayyenwur rima 'dukatu daye'.
  num.two:
    label: dva
    summary: Adadi 2, yaushe suwa adada gaba.
    info: Dva ne ya adai da shekaru wanda kafin ga'ayya ta hanyar binari, wanda koyi kowace kompyuta don kuskur kan.
