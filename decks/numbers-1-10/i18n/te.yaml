lang: te
pivot: false
title: సంఖ్యలు 1-10
cards:
  num.eight:
    label: ఎన్ని
    summary: సంఖ్య 8, మత్స్యపరీక్షలో ఒక జాబితా.
    info: ఎనిమిది అనేది 2³ (2 కు ఘాతం 3). తిరిగిన ఎనిమిది (∞) అనేది అనంతం గుర్తు; చైనీస్ సంస్కృతిలో ఎనిమిది అనేది అత్యధిక శుభ సంఖ్య.
  num.five:
    label: ఐదు
    summary: సంఖ్య 5, మనకు చెయ్యిలో ఇతని కొలత.
    info: వీటి పద్ధతి దశాంశ సంఖ్యా వ్యవస్థ గురించి ఉంటుంది, ఎందుకంటే ఒక్కొక్కరు తమ చెయ్యిలో ఐదు అంగుళాలు ఉంటారు. శుక్రుడు నక్షత్ర రూపంలో ఐదు బాహులు ఏర్పరుస్తుంది.
  num.four:
    label: నాలుగు
    summary: సంఖ్య 4 అది ఒక చతురస్రం కలిగి ఉండటం వల్ల.
    info: నాలుగు రెండు గొప్ప దశ - 2 × 2 ఫలితం. జపానీయ మరియు చైనీయ సంస్కృతులలో ఇది బాదుడు సంఖ్యగా భావించబడుతుంది (ఇది 'మరణం' అనే పదం తో ధ్వని సమానం).
  num.nine:
    label: నెమలు
    summary: సంఖ్య 9, చివరి ఒకే అంకె కలిగిన సంఖ్య.
    info: 'నెమలు గరిష్ట ఐకాంకె సంఖ్య. విశేషం: నెమలితో గొన్న సంఖ్య దశాంశ మొత్తం ఎల్లప్పుడూ నెమలితో భాజనం అవుతుంది.'
  num.one:
    label: ఒకటి
    summary: సంఖ్య 1, మొదటి సహజ సంఖ్య.
    info: ఒకటి అనేది కనిష్ఠ సహజ సంఖ్య. దానితో గుణించినప్పుడు ఏ సంఖ్యలైనా వాటి విలువలు మారవు; అందువల్ల దానిని 'గుణక తటస్థ అంశం' అంటారు.
  num.seven:
    label: ఏడు
    summary: సంఖ్య 7, రాకెట్లోని వర్ణమాల అంతే.
    info: ఎన్నో సంస్కృతులలో ఏడు అనేది శుభ సంఖ్యగా పరిగణించబడుతుంది. ఒక వారంలో ఏడు రోజులు ఉంటాయి, రాకెట్లో ఏడు రంగులు ఉంటాయి మరియు ఐసియా లో ఏడు దేశాలు ఉన్నాయి.
  num.six:
    label: షెస్
    summary: సంఖ్య 6 అది ఒక పరిపూర్తి సంఖ్య, దాని విలువల మొత్తం 1 + 2 + 3 = 6.
    info: హెక్సగోనల్ (ఆకృతిలు) చేసిన తలాలు ఉపరితలాన్ని నిర్మాణం కోసం ఎక్కువ సరళంగా ఉండే రీతిలో ఏర్పాటు చేస్తాయి.
  num.ten:
    label: పది
    summary: సంఖ్య 10, మన దశాధికార సంఖ్యల వ్యవస్థ ఆధారం.
    info: ఒకడు చేతులపై కలిగి ఉన్న పది అంగుళాల కారణంగా పది దశాధికార వ్యవస్థ ఆధారంగా పనిచేస్తుంది. నిజానికి గణన కోసం పది ఒక సౌకర్యప్రదమైన మార్కర్ గా ఎప్పటినుంచో ఉపయోగించబడుతోంది.
  num.three:
    label: మూడు
    summary: సంఖ్య 3, మొదటి బేసి ప్రధాన సంఖ్య.
    info: అనేక సంస్కృతులలో మూడు ఒక శక్తివంతమైన సంఖ్యగా భావించబడుతుంది - మూడు కోర్ల గాథలు, త్రిభుజం మూడు భుజాలు ఉంటాయి మరియు రోజు మూడు విభాగాలుగా విభజించబడుతుంది.
  num.two:
    label: రెండు
    summary: సంఖ్య 2, ఒకే ఒక జత ప్రధాన సంఖ్య.
    info: రెండు అనేది కేవలం మాత్రమే జత ప్రధాన సంఖ్య మరియు ద్విసంఖ్యామాన వ్యవస్థ లో ఉపయోగించే బేస్ గా నిలిచింది, ఈ వ్యవస్థ పై అన్ని కంప్యూటర్లు పని చేస్తాయి.
