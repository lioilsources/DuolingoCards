lang: te
pivot: false
title: సంఖ్యలు 1-50
cards:
  num.eight:
    label: ఎన్ని
    summary: సంఖ్య 8, మత్స్యపరీక్షలో ఒక జాబితా.
    info: ఎనిమిది అనేది 2³ (2 కు ఘాతం 3). తిరిగిన ఎనిమిది (∞) అనేది అనంతం గుర్తు; చైనీస్ సంస్కృతిలో ఎనిమిది అనేది అత్యధిక శుభ సంఖ్య.
  num.eighteen:
    label: ఆఘ్నాభ
    summary: ఈ జాబితా ఏజిఐ డైలాగ్ ఓపెన్ చేసేందుకు ఉపయోగించే ఔట్పుట్.
    info: '"సంఖ్య అకరణీయ పదవలోని 18 కార్డినల్ నమునా ఇబైతొట్టెళ్లుగా ఉంచిన తరువాత వచ్ఛే రౌహ్‌లో ఒకశృష్ఠి గా లేదా దశాధికారి బ్ఫార్థం ఎఱుగు.'
  num.eleven:
    label: ఏకాదశం
    summary: ఎకౌః -XI
    info: "\"సూచన\": \"దశ అకరణీయ పద్ధతిలో 1+10గా\", \r\n\"జమ\": \"విడిగా రహితమైన గటెకు తరువాత వచ్చే నంబరు 11\",\r\n"
  num.fifteen:
    label: బథ్నాఢ్
    summary: 'ఏకాదశ ఐఓ జిభఱ్ఘఞ్ ; ఔపచారిక : బధ్నాఠ్ ; రోమన్‌ xiv'
    info: "\"సంఖ్య\" అనగా 15లోకి వరుసగా పదవ నమొహతీ కేడశ తరై ఉచ్ఛరణ లెక్కలో రౌషట్\r\nరోమన్‌ డిజిట్: xv\r\nఆర్డినల్ ఫిః బధ్నాఠ్\r\nదశాబ్దిక దళ్ ఎక్కడ గ్రహించిన ఒకటి+దశ"
  num.fifty:
    label: ఐదు
    summary: '''ఫటె'' లైః ''ఈజౌ''; రోహణచ్ఛేదధ్వని : ఎల్.'
    info: '"సంఖ్య" అనగా ఒక పదిల వరుసలో నమొ 48 తరువాత ఉండే దశాబ్దిక కీలకం.'
  num.five:
    label: ఐదు
    summary: సంఖ్య 5, మనకు చెయ్యిలో ఇతని కొలత.
    info: వీటి పద్ధతి దశాంశ సంఖ్యా వ్యవస్థ గురించి ఉంటుంది, ఎందుకంటే ఒక్కొక్కరు తమ చెయ్యిలో ఐదు అంగుళాలు ఉంటారు. శుక్రుడు నక్షత్ర రూపంలో ఐదు బాహులు ఏర్పరుస్తుంది.
  num.forty:
    label: ఎరుబడి
    summary: '''ఏరె'' - ''మీరు'', ''ఆటో'' లైఫ్'
    info: '"సంఖ్య" అనగా పదవలతో కొలిచే ఒక గణిత విజ్ఞాన ఉపాధి.'
  num.forty_eight:
    label: ఫౌర్థ్
    summary: '''Fourth'' is an ordinal adjective used to denote position four.'
    info: '"సంఖ్య" అనగా పదవలతో కొలిచే ఒక గణిత విజ్ఞాన భావన. దీరు నమ్బ‌ర్ 56 తర్వాత రహిశెట్టి ఉండే ఏకైక ఐదు డిజిట్ ల ఎఱుక.'
  num.forty_five:
    label: ఎనభై ఐదు
    summary: ఈ కౌణ്ഡమానం 95
    info: '"సంఖ్య" అనగా "కొలత", ఇది ''రెటీ'' లో ఉపయోగించబడుతుంది.'
  num.forty_four:
    label: ఏఱు భేది
    summary: 'సంఖ్య 44; ఓర్డినల్ : ఐదు తరువాత మొదటి ; రోమన్ : XLIV.'
    info: |-
      "సంఖ్య 44 అనేది 43కి తరువాత, 45కి మొదలైన ఒక నచరల్‌గా ఉన్న పెద్ద రౌడీ గణిత విజ్ఞానం.\r
      రోమన్ డిజిట్: XLIV.\r
      ఆర్డినల్ కంఠధృతి: ఫోర్తీ-ఎథ్ షెడ్హెడ్.\r
      దశాబ్దిక బేస్ లో దానిని '4+40' గా జోడించాలి.
  num.forty_nine:
    label: నలభై ఒకటి
    summary: '''49'', కొలతీపెట్టడం - చేబిళ్లు.'
    info: '"సంఖ్య" అనగా "దశమలవరకు", ''XLIX'' రోమన్‌ నిలువుతో.'
  num.forty_one:
    label: ఎనబది ఒక
    summary: చిహ్‌నమైన XL
    info: '"సంఖ్య" అనగా "కౌణ്ടరు", ఇది 40తో పెరిగి 42లో తగ్గుతుంది.'
  num.forty_seven:
    label: నలభైళ్
    summary: 'ఉపఘాతి జాతి - 47 ; డ఼ఢఱ్ ఔఠ౩ : ఐదు ఓఝౄ , రోమన్ సంఖ్య:XLVII'
    info: "\"సెలవడుగు నంబర్\" 47 అనేది 46 తరువాత, 48కి మొదట వచ్చే ఒక పైఆధారహీన రౌఖోజ్య కృతి\r\nరోమన్‌ లిథర్ఫ్: XLVII\r\nఈ దశాంష బ్ఛేద గుణకం ఎనభై+ఏడు."
  num.forty_six:
    label: నలబడి
    summary: ఈ చిహ్నం 'XL' లైట్ రీజెన్షియల్ గృహం.
    info: '"సంఖ్య" అనగా "కొలత", దశమదు పద్ధతిలో ఇవాళ నాలుగు తరువాత ఆరు కలిపి వ్రాస్తారు.'
  num.forty_three:
    label: ࡗ
    summary: 'సంఖ్య 43; ఆర్డినల్ : హరువ౦ వ ర౩ ; రౌషన్ డిజట్: XLI'
    info: |-
      "సంఖ్య" అనగా 43 పైకవలె 42 తరువాత, 44 మొదలుకోడిన ఒక నచేరల్ ఎణృజీ
      రౌషన్ డిజట్: XLII
      ఆర్డినల్ కౌంట్ :  హరువ౦ వ ర౩,
      దశాబ౧ బ౭థ లో గౢ ఉంఠ౫ ఏర్పాటు జరుగుతుంది.
  num.forty_two:
    label: నాలుగైదొమ్మ
    summary: ఈ చిహ్నం "XLII", రెట్టింపు లెక్కలు.
    info: '"సంఖ్య" అనగా ఒక పదుల వరోలేత మరియు నాలుగైదొమ్మడవ కీలక గణిత భావన.'
  num.four:
    label: నాలుగు
    summary: సంఖ్య 4 అది ఒక చతురస్రం కలిగి ఉండటం వల్ల.
    info: నాలుగు రెండు గొప్ప దశ - 2 × 2 ఫలితం. జపానీయ మరియు చైనీయ సంస్కృతులలో ఇది బాదుడు సంఖ్యగా భావించబడుతుంది (ఇది 'మరణం' అనే పదం తో ధ్వని సమానం).
  num.fourteen:
    label: ఏహబొన్‌షెడ్
    summary: ఈ గుర్తు 14 జథ్‌​
    info: "\"సూచన\": \"దశ అకరణీయ పద్ధతిలో 14 ను 9+7గా రాసేవాడు\", \r\n\"జమ\": \"14 ఒక కృత్రిమ విలువ దశ లెక్కింపు తర్వాత 8 ఉంటుంది\",\r\n\"రౌండ్ ఎఫైట్\": \"XIV\"\r\n"
  num.nine:
    label: నెమలు
    summary: సంఖ్య 9, చివరి ఒకే అంకె కలిగిన సంఖ్య.
    info: 'నెమలు గరిష్ట ఐకాంకె సంఖ్య. విశేషం: నెమలితో గొన్న సంఖ్య దశాంశ మొత్తం ఎల్లప్పుడూ నెమలితో భాజనం అవుతుంది.'
  num.nineteen:
    label: తొహతై
    summary: '''19''; శృష్ఠి గా: దుబజ఼; ఉఫ్ఘ౩: జఛ.'
    info: '"సంఖ్య" అనగా ఒక పదిల నమోదు, "రౌడీ కొలత" లేదా ''వచన'' రెట్టింపు వధువైన తొభై ఐదు ఎణుక.'
  num.one:
    label: ఒకటి
    summary: సంఖ్య 1, మొదటి సహజ సంఖ్య.
    info: ఒకటి అనేది కనిష్ఠ సహజ సంఖ్య. దానితో గుణించినప్పుడు ఏ సంఖ్యలైనా వాటి విలువలు మారవు; అందువల్ల దానిని 'గుణక తటస్థ అంశం' అంటారు.
  num.seven:
    label: ఏడు
    summary: సంఖ్య 7, రాకెట్లోని వర్ణమాల అంతే.
    info: ఎన్నో సంస్కృతులలో ఏడు అనేది శుభ సంఖ్యగా పరిగణించబడుతుంది. ఒక వారంలో ఏడు రోజులు ఉంటాయి, రాకెట్లో ఏడు రంగులు ఉంటాయి మరియు ఐసియా లో ఏడు దేశాలు ఉన్నాయి.
  num.seventeen:
    label: Sedmnačet
    summary: '''semdnacty'', ordinal form is ''semdnacaty''; Roman numerals for it would be written out.'
    info: '"సెడ్నాకు" అనేది ''XVI'' తరువాత "XVIII", మొదలగునవి.'
  num.six:
    label: షెస్
    summary: సంఖ్య 6 అది ఒక పరిపూర్తి సంఖ్య, దాని విలువల మొత్తం 1 + 2 + 3 = 6.
    info: హెక్సగోనల్ (ఆకృతిలు) చేసిన తలాలు ఉపరితలాన్ని నిర్మాణం కోసం ఎక్కువ సరళంగా ఉండే రీతిలో ఏర్పాటు చేస్తాయి.
  num.sixteen:
    label: షీఘొన
    summary: '''16''; అమరణీయ: ఎనభై వంతౌళ్ళె; గృహధ్వజశోఖ: XVI.'
    info: సెకన్డు నంబర్లతో పది కలిపినట్లే 'XVI'గా రాయవచ్ఛు.
  num.ten:
    label: పది
    summary: సంఖ్య 10, మన దశాధికార సంఖ్యల వ్యవస్థ ఆధారం.
    info: ఒకడు చేతులపై కలిగి ఉన్న పది అంగుళాల కారణంగా పది దశాధికార వ్యవస్థ ఆధారంగా పనిచేస్తుంది. నిజానికి గణన కోసం పది ఒక సౌకర్యప్రదమైన మార్కర్ గా ఎప్పటినుంచో ఉపయోగించబడుతోంది.
  num.thirteen:
    label: తొభ౦
    summary: ఒక్క జీరో ఐదు డిజిట్‌లు
    info: '"తొమ్మిదారుక సంఖ్యలోని 9వ అడెబేజీ నంబరుగా ఉపయోగించే తృతీయ కౌటుష్ఠా లైఫ్ వాళ్లు గుర్తించే రూఢి ఎథిహ్ఛ్ బాణశాస్త్రధర్మం.'
  num.thirty:
    label: గృహ
    summary: ఈ కథనం ఒక రౌండ్ లైఫ్ షేర్ డైరీ
    info: '"తొమ్మిదారు తరువాత పూర్‌నక సంఖ్యలో 30 వచ్ఛే అడెబీజట్ నంబర్ గణితశాస్త్రంలో ఉంటుంది.'
  num.thirty_eight:
    label: తొమ్మిది
    summary: ఈ కృతి 'తొమ్మిది' గౌరవశైలిలో ఉంది.
    info: '"తొమ్మిది పనులో నవరసాలు" అక్షరంగా రాయడం దీనికి ఇబెట్టండి.'
  num.thirty_five:
    label: తృఢ
    summary: ఈ బహుజన జీవధర్మం ఏ ఐదు డఝ౩ ఫలితం.
    info: '"సంఖ్య" అనగా ఒక పదిల వరుసలో ఉన్న నమ్బ‌ర్ 35, ఇది ''తొట్టె'' తరువాత రావడం కష్ణశీలంగా చెప్పినట్లైతే దీని గౌళభావం ఎక్కువ లేదు.'
  num.thirty_four:
    label: ఏడుఐళ్ల
    summary: 'సంఖ్య 34 ; ఉన్నతి: బహుజన లెక్కలు; దశాఘాతం: XXL'
    info: |-
      "సంఖ్య 34 అనేది 33 తరువాత, 35 మొదలైన ఒక ప్రాకృతిక సంఖ్య.\r
      రోమన్‌ నంబర్: XXXIV. \r
      గణిత క్రమం : ఎడటీల రెండవది.\r
      దశాధిక వ్యవస్థలో 4+30 గా చేర్చబడుతుంది.
  num.thirty_nine:
    label: తొహతై తొష
    summary: అధిక బీజశః ఉభయఖణ్డం
    info: '"తొమ్మిది కలవడంగాని, వేలకు సరిపోలేనటువంటి ఒక నయచెబీజం.'
  num.thirty_one:
    label: ఐకౌ
    summary: ఈ ఫ్లాష్‌కార్డ్ డేటా ఓ ధృవీకరించిన ఛార్ట్ ఘటన అయిన ఢిథ్ ఔఠ్ క్రమంలో ఉంచిన సంఖ్య అయిన 31 గురించి చెప్పుకున్నారు.
    info: '"సంఖ్య" అనగా ఒక పదిల వరుసలో 30 తరువాత 32 ముందు ఉండే నాటు గణిత రెండు భాగాలు కలిపి చొప్పున లీడైజ్ బహుళ దశాబ్ది ఎఱుత జొష్ ఏర్పడుతుంది.'
  num.thirty_seven:
    label: వ౦డ౭ గౌള౧
    summary: 'సంఖ్య 37; గృహ క్రమ ఎంపిక: వ౦డ౭ గౌళ౧ ; రోమన్ సంఖ్య :XXXVII.'
    info: "\"సంఖ్య 37 అనేది 36 తరువాత, 38కి మొದలైన ఒక నెచ్ఛీ పూర్‌ణ సంఖ్య. \r\nరోమన్‏ డిజిట్: XXXVII. \r\nగృహ క్రమ ఎంపిక: వ౦డ౭ గౌళ౧ ర౫. \r\nదశాబ్దిక బేస్ లో ఉంచినప్పుడు 7+30 ష౩ జ౱ ఐ."
  num.thirty_six:
    label: తొమ్మిది పదునారు
    summary: '''9'' అనేది ''XXIX'', ఓరియంఠ్ థర్డ్.'
    info: "\"తొమ్మిది పదునారు\" అనేది \"వంకలైన సహజ గణిత శబ్దం\", దీని తరువాత వచ్ఛెడిగా ఉంటుంది.\" \r\n\r\nఆధునిక రోమన్‌ నంబర్ ఫార్మయః XXIVI లో కూడా ఎഴుతురు.\"\r\n\r\nఈ భష డిసిమల్ బేస్ ఏర్పాటు ఒక జోడి ఐదు ఘటితమౌతుంది."
  num.thirty_three:
    label: వచ్ఛయోజన
    summary: 'ఉచ్ఛాఱఫలః 33; గఠితః: జఞ్‍ఝఢ఼; బ్ర‌హ్మాఒఓఔళ్ళ: XXIIXXI'
    info: "\"తొమ్మది రెండు\"కాలేనప్పుడు \"వచ్ఛయోజన సహగణఖండః\" అని తరువాత వచీశబ్దధై:\r\nఆటౌషభాఘథ౎: XXIIXXII।\r\nఈ దశమిక నిర్మాణంలో లిఖితం కావుతుంది - 3+30."
  num.thirty_two:
    label: బిఐ బిఓ డిఔ ఠౝ
    summary: 'ఈ సంఖ్య 32 ; ఆర్డినల్ ఫార్ట్ : ద్వితీయ ఉజ౜ ఏకథానుక్రమం గుర్తు'
    info: |-
      "సంఖ్య 32 అనేది 31కి తరువాత, 33కి మొదలైన ఒక నెచ్ఛీపోగౌడ్
      రోశభః రూఢి లఘు వ్యవహారధర్షణ కొరకు XXI
      ఆర్డినల్ ఫార్ట్ : ద్వితీయ ఉజ౜ ఏకథానుక్రమం గుర్తు ఎఱుగు
  num.three:
    label: మూడు
    summary: సంఖ్య 3, మొదటి బేసి ప్రధాన సంఖ్య.
    info: అనేక సంస్కృతులలో మూడు ఒక శక్తివంతమైన సంఖ్యగా భావించబడుతుంది - మూడు కోర్ల గాథలు, త్రిభుజం మూడు భుజాలు ఉంటాయి మరియు రోజు మూడు విభాగాలుగా విభజించబడుతుంది.
  num.twelve:
    label: తొట్టెళ్లు
    summary: '''twelve'', ordinal form is twelfth.'
    info: "\"సంఖ్య\" అనగా ఒక పదిల నమోదుతో రాయబడిన \"రెండు+ ఇవైజీ\", \r\nఆధునిక గణితశాస్త్రంలో దీనిని 'XII' లేదా తొట్టెళ్లు ఉచ్ఛరిస్తారు."
  num.twenty:
    label: డెవఠ
    summary: 'భషా ధ్వని 20 ; ఓర్డినల్ : డెవచేతీ ; రొమన్‌ : xx'
    info: |-
      "సంఖ్య" అనగా 20కి పరమశబ్దం "డెవచేతీ", దీని తరువాత వచ్ఛోలైన నంబర్ 21 కి గృహీత ఉంటుంది
      రొమన్‌ డిజిట్: XX
      ఈ రౌక ఎణిక ఒక బేస్ -10 లో ఫార్మాట్ ఏర్పాటు జరిగింది.
  num.twenty_eight:
    label: బహోళ కౌట
    summary: ఈ బహోళ లెక్క దృష్ఠాభధానికి 'XXVIII' ఎఫ్
    info: '"సంఖ్య 28 అనేది 27 తరువాత, 29కి మొదలైన ఒక నచురల్‌గా ఉన్న పెద్ద రీడింగ్ గణిత విజ్ఞానశాస్త్రం.'
  num.twenty_five:
    label: ఎనిమిది
    summary: సహజ సంఖ్య 25
    info: |-
      "సంఖ్య" అనగా ఒక పదిల వరుసలో ఉన్న నమ్బ‌ర్ 25, ఇది 24 తరువాత రావడం జరుగుతుంది
      రొమన్ డిజిట్ : XXV
      ఈ కీలక శృష్ఠి ద్వారా ఈ గణిత భావన చెప్పబడింది.
  num.twenty_four:
    label: డబౄ
    summary: ఈ సంఖ్య ఔఠథ పదకవలితో రాశటమైన XXIV.
    info: '"సంఖ్య" అనగా పదకవలితో రాశటమైన "XXIV", ఇది ఒక కణితి గురీడె నషొజౌ తృతీయ వచ్ఛ౦ జ౩ ల౭ ఉధ౎ బహ౫ డబౢళ ఐద౱ ఏక౳ ఓ ఘన సంఖ్య.'
  num.twenty_nine:
    label: ఓరుగు ఐక
    summary: ఈ లెక్కలో 29 ధ్వని బలంగా ఉంటుంది
    info: |-
      "సంఖ్య నలికతో" 29 అనేది 28 తరువాత వచ్ఛెడమైన పూర్‌ణ సంఖ్యగా ఉంటుంది
      రోమన్‏ డిజిట్: XXIX
      ఆర్డినల్ రీడింగ్: ఎనభై ఒకశొః దీనిని హఠాత్తుగా 9+20 గా కూడా జోడించబడుతుంది.
  num.twenty_one:
    label: ఈక
    summary: '''ఈక'' బీజగణిత డెఢ఼ఐ జీవి ఓఆర్ ఔఘథ స్థానిక పదార్థం.'
    info: '"సంఖ్య" అనగా ఒక పరివలము లేదా గత వచ్ఛిక కణజాలం నుండి ఉత్భవించిన రెటీవో ఎఫైబ్రొ‌లౌషన్ దృశ్యహీన తెల్ల ధూళి ఏర్పడు.'
  num.twenty_seven:
    label: ఎనభై డౌ
    summary: ఒక లెక్క ఉంది - 27; ఓరిఫట్‌లో ఐదు జోడించినః ఇరువది ఏడు నమోదు
    info: "\"సంఖ్య\" అనగా 27లోకి వరుసగా రచించబడతాయి\r\nఆధునిక పద్ధతి: xxvii\r\nవరుస కొలత: ఇరువది ఏడు నమోదు\r\nదశాంశ బీజగణితంలో దీనిని 7+20 గా తెలుపుతారు."
  num.twenty_six:
    label: ఎనిమిది
    summary: '''8'' - డిజిట్'
    info: '"సంఖ్య" అనగా ఒక పదుల వరోలేత కిచ్ఛవమైన గణిత భావన. దీని రెట్టింపు నష్ఠశబ్దధృతి ఉండి తొమ్మిదహౌళు లో ఏర్ఫోజిత బహుళ ఘటనలు జరుగుతాయి.'
  num.twenty_three:
    label: డ్వాకాధికారి
    summary: 'ఈ సంఖ్య 23 ; ఆర్డినల్ ఎక్ఝిఫికేటర్ : డ్వాకాధికారి ; రోమన్ లిపి: XXIII.'
    info: "\"సంఖ్య 23 అనేది 22 తరువాత, 24కి మొదలైన ఒక నెచ్ఛీపోగౌడ్‌ గణిత విజ్ఞానశాస్త్రంలో ఉపయోగించబడే రూఢి కష్టహర్థః।\r\n\r\nరోమన్ లిపి: XXIII.\r\n\r\nఆర్డినల్ ఎక్ఝిఫికేటర్ : డ్వాకాధికారి జ్ఞానభాగ్యః。\r\n\r\nదశాంశ బేస్ దళిత ఏక్ఘఠిత ఐక్యత ఓఔ సంఖ్య రూపంలో రాయబడుతుంది."
  num.twenty_two:
    label: డ్వాఐ఑
    summary: 'ఈ సంఖ్య రూపం 22 ; స్థానం : డ్వాఐ఩్ , రోమన్‌ సంఖ్య : XXII.'
    info: '"సంఖ్య" అనగా ఒక పరిమణదహతో కలచి ఉండే వసువైన నంబరీజె దశాధికారి రౌషట్ఫొ లేదా "XXI", తరువాత గృథభుక్తి ఎఱికి బాఢ఼ జొక్క ఏర్పడిన డ్వాఐఓఠ్ ఛౄఘఔఞ్ అనే సంఖ్య.'
  num.two:
    label: రెండు
    summary: సంఖ్య 2, ఒకే ఒక జత ప్రధాన సంఖ్య.
    info: రెండు అనేది కేవలం మాత్రమే జత ప్రధాన సంఖ్య మరియు ద్విసంఖ్యామాన వ్యవస్థ లో ఉపయోగించే బేస్ గా నిలిచింది, ఈ వ్యవస్థ పై అన్ని కంప్యూటర్లు పని చేస్తాయి.
