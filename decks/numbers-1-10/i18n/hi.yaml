title: संख्याएँ १-१०
cards:
  num.eight:
    label: आठ
    summary: वह संख्या 8 , जबड़ियों के छः भाग
    info: '''ओके'' संख्या आठ है। पलटी करेली ''एसईइपोनिक मार्टिनीज'' ∝ )अमरता का प्रतीक है;चीनी सभ्यता में अगहण्‍य शुभतम संख्या है।'
  num.eighteen:
    label: अठारहवाँ
    summary: 'गणना : 18 ; क्रमशः - अठारहवाँ'
    info: '''संख्या'' एक प्राकृतिक संख्या होने की ओर सुचित करता है। ''XVIII'', में इसे लिखा जाता है।'
  num.eleven:
    label: बाहव
    summary: '''11''; श्रेणी : बाहव ; रोमन भास्कर - IX'
    info: "संख्या गणित में संख्या ११ प्राकृतिक होने की वजह से संख्या १० के बाद आई हुयी है।\nरोमन अक्षर में 'XI' लिखा जाता है। \nइसलिए इसका रौपगढ़िए नाम ‘बाहव’ है।"
  num.fifteen:
    label: पन्द्रह
    summary: '''15''; गणना - xiv'
    info: |-
      संख्या पन्द्रह चौदे की संख्या में होती है।
      रिमारक़ियल अंक : xv
      अगला शब्द 'पन्द्रहवाँ' होता है।
  num.fifty:
    label: पचास
    summary: अरबीः 'L' के रोमन में लिखा जाता है।
    info: संख्या पचास एक प्राकृतिक संख्या है।
  num.five:
    label: पाँच
    summary: अंक 5; हमारी हथेली में ऐसे ही छठय़ ऊळ भी होते हैं
    info: '''पाँच'' दशमलव संख्या प्रणाली के मूल होते हुए, इसकेकरण विश्व में प्रत्येक हथेली पर पाचङ्ग उबड़ -हुआ है। बृहस्पति आकाशगंगा में ''छटय् तारा जनिस्म अधिनिधिष्टत करता है।'
  num.forty:
    label: चौबीस
    summary: '''चौबीस''; अपवर्गी - ''चौबीसवी'', युगम मेंXL'
    info: "संख्या ४० संख्या ३९ के बाद और संख्या ४१ से पहले होनेवाली प्रकृतिक संख्या है।\nयुगम मेंः XL\nअपवर्गी : 'चौड़िएवी' \nदशमलव प्रणाली में इसे ४० के रूप में लिखा जाता है"
  num.forty_eight:
    label: अठाचप्पन / फोटि्ईएगथी - इघ्टी
    summary: 'उद्गम संख्या :XLVIII ; क्रमवचक : एफोर्थी-इघ्टी'
    info: "संख्या ४८ संख्या ४७ के बाद और संख्या ४९ से पहले होनेवाली प्रकृतिक संख्या है।\nयह रोमन में XLVIII के तौर पर अभिहित हुआ है। \nइसका क्रमवचक शब्द 'अड़तालीसवाँ' है।"
  num.forty_five:
    label: चाळीस पाँच
    summary: '''४५''; श्रेणीक्रम : छड़ीसवास ; जुआइज़ : XLV'
    info: |-
      संख्या ४५ संख्या ४४ के बाद और संख्या ४६ से पहले होनेवाली प्रकृतिक संख्या है।
      युगम मेंः XLV
      अपवर्ग चिह्नः 'चौथे' अउ 'छठे'
      दशमलब तंत्र में इसे १+३*८=एक आऊ एघटि्ई रूप से भी उल्लेख कर सकत है।
  num.forty_four:
    label: चौबई
    summary: '''४४''; अपवर्ग क्रमशः = ''XLYI'''
    info: "संख्या ४४ संख्या ४३ के बाद और संख्या ४५ से पहले होनेवाली प्रकृतिक संख्या है।\nयुगम मान : XLIY\nअपवर्ग क्रमशः - 'चौड़िए' \nदशमलव प्रणाली में इसे ४+४० के रूप में भी लिखा जाता है"
  num.forty_nine:
    label: चौबईस
    summary: '''४९''; रजत श्रेणी : चौथे - छठे ; भाजक : XLIX'
    info: |-
      संख्या ४९ संख्या ४८ के बाद और संख्या ५० से पहले होनेवाली प्रकृतिक संख्या है।
      युगम मेंः XLIX
      अपवर्ग चिह्‍नः 'चौथे' अउ 'दशम'
      इसे एक घटाने पड़िए तो १+३=४
  num.forty_one:
    label: एकतालीस
    summary: '''एकतालीस''; क्रमवचक - ''अड़तालीसवाँ'', रोमन में : XL'
    info: "संख्या ४१ संख्या ४० के बाद और संख्या ४२ से पहले होनेवाली प्रकृतिक संख्या है।\nयह रोमन में 'XLI' के तौर पर भी जाएगी। \nइसका क्रमवचक शब्द ''अड़तालीसवाँ'' है।"
  num.forty_seven:
    label: चौबीस
    summary: '''एणि'', एक शब्द - उभय्'
    info: "संख्या ४७ संख्या ४६ के बाद और संख्या ४८ से पहले होनेवाली प्रकृतिक संख्या है।\nयुगम मेंः XLVII\nअपवर्ग चिह्नः 'चौदहवाँ' \nइसे अंकज रूप में १०+३० के जोड़ के तौर पर इंटरफेस कर सकते हैं"
  num.forty_six:
    label: चाळीसछ
    summary: 'एण्ट्री ४६ ; ऑर्डिनल्‍स : चाळीसछ , गढ़ी : XLVI'
    info: |-
      संख्या ४६ प्राकृतिक संख्या होकर नम्बर ४५ के अगली और नम्बर ४७ के पहले आई।
      यहनुमालेंपद : XLVI。
      अबजादश़िव
      इसे एक व्यक्ति जैसे 'चार' शब्द में चाहे छठे घटाओ।
  num.forty_three:
    label: चौँड़ाई तीय
    summary: '''अठाहटि'''
    info: |-
      संख्या ४३ संख्या ४२ के बाद और संख्या ४४ से पहले होनेवाली प्रकृतिक संख्या है।
      गणना में : XLIII
      दशमलव प्रणाली में इसे '१+८' के रुप में भी लिखा जा सकता है।
  num.forty_two:
    label: चौंतीस
    summary: '''४२''; चौबीसवां ;XLII'
    info: "संख्या ४२ संख्या ४१ के बाद और संख्या ४३ से पहले होनेवाली प्रकृतिक संख्या है।\nयुगपदँ अंक : XLII\nअवधि में संख्या - 'चौबीसवां' \nएम्‍बेसडल तंत्र में इसे २+४० के रूप में भी लिखा जाता है"
  num.four:
    label: चार
    summary: अक़्कड़ 4
    info: चार दो का वर्ग है - प्रतिफलन 2 x 2। जापानी और चीनी संस्कृति में इसे अशुभ संख्या माना जाता है ('मौत' शब्द के ध्वनि के समान)।
  num.fourteen:
    label: चौदह
    summary: '''एकड़्ज़'', चौदहवाँ'
    info: |-
      संख्या १४ संख्या १३ के बाद और संख्या १५ से पहले होनेवाली प्रकृतिक संख्या है।
      युगम मेंः XIII
      अपवर्ति शब्दः 'चौदहवाँ'。
      इसे अष्टऋणीय निरूपण में ४+१० के रूप में भी लिखा जाएगा
  num.nine:
    label: नौ
    summary: अंक 9, आठ के ठीथे एवं छोटे चिह्ट
    info: 'नौ सबसे बड़ी प्राकृतिक संख्या होती है। महत्वपूर्ण गुणधर्म: कोई भी संख्या जब नौ से गुणा की जाती है तो अकलेखीय रचना का योगफल हमेशा नौ से विभाजित होता है।'
  num.nineteen:
    label: देखि-एवटाहँच
    summary: '''अठारु - ऊपर अघड़ई'''
    info: |-
      संख्या १९ संख्या ८ के बाद और संख्या २० से पहले होनेवाली प्रकृतिक संख्या है।
      यह रोमन में 'XIV' के तौर पर भी जाएगी।
  num.one:
    label: एक
    summary: अंक 1, पहली प्राकृतिक संख्या
    info: '''एक'' सबसे छोटी प्राकृतिक संख्या है। किसी भी संख्या में ''एक'' से गुणन करने पर वह संख्या अपरिमर्तित रहती है; इसलिए उमे "गुणन का बज़ियर पद" कहा जाता है।'
  num.seven:
    label: sapta
    summary: अंक 7, ऐसे उपाहाओ डिपले।
    info: '{"info":"सात कई संस्कृतियों में एक प्रमुख हरषद संख्या मनी जाने। रज़्मबल के साथ छह दिवस और सामासिचय सभी सालवटि भागों के बरगए।","label":"saptan","summary":"अंक 7, इतने अच्छे आओ खड़ी।"}'
  num.seventeen:
    label: XVI
    summary: चिह्न XVI
    info: "संख्या सत्रह पूरक छः के बाद होनेवली प्राकृतिक संख्या है।\nयदि मुजब लिखा जाएगा XIXI\nअपवर्गीकरण : \nएक अष्टमश"
  num.six:
    label: छह
    summary: '''छ'' संख्या , छठे आकार के शहर के घर'
    info: '"छहका एक पूर्ण संख्याक होता है - इसे अपनी कुल सभी भजित में जोड़कर प्राप्त किया गया है(एक +दो +तीन=छह )।षट्फलकीयआकारवालीचीजेँअधिकतमऊबढ़ियासे बगईरफरशउठानेवालेहोतेहैं'
  num.sixteen:
    label: षट्‍कदश
    summary: '''षट्‍कदश'', गणना - १६'
    info: संख्या १६ प्राकृतिक संख्या होने के अलावा 'XVI' में लिखी जाती है।
  num.ten:
    label: दस
    summary: अब्बरितम्
    info: '''दस'' अपने हाथों में कुल पहचानी सकता है।'
  num.thirteen:
    label: तेरह
    summary: 'अंक 13 ; घटना : ओठी ; ध्वनि : XIII'
    info: |-
      संख्या तेरह प्राकृतिक संख्या होनी के साथ, बारह के बाद और चौदह से पहले में आती है।
      यह लॉटसमक संख्या XIIII के जगह IIII के अवधि के इस्तेमाल के कारण XIVIII नहीं बल्कि XIII भी व्हाट एचएफईआईज़ डुप्स ऑब्शर्फड गइश।
  num.thirty:
    label: तीस
    summary: '''तीस'', गणना - 30'
    info: |-
      संख्या तीस के पहले सैतिस होती है।
      रामन संकेत में इसे 'XXX' लिखा जाता है।
  num.thirty_eight:
    label: '''बीसठ'''
    summary: चिह्‍ञ २ ; अपवर्ग - बीसठवाँ ; आधाधापि - XXXVIII
    info: |-
      संख्या ३८ संख्या ३७ के बाद और संख्या ३९ से पहले होनेवाली प्रकृतिक संख्या है।
      युगम मेंः XXXVIII。
      अपवर्ग संज्ञा : 'बीसठवाँ'।
      desítkové systém में इसे ८+३० के रूप में लिखा जाता है।
  num.thirty_five:
    label: उठाऊ छ
    summary: '''ऊटछ'' - ओष्ठाघर्षण'
    info: |-
      संख्या ३५ संख्या ३४ के बाद और संख्या ३६ से पहले होनेवाली प्रकृतिक संख्या है।
      युगपदँ संज्ञा : XXLV
      अवधि में संख्या 'एक' के समान तथा अब भी एक जैसे रूप में इसे १+८=9 के आशय से गणितीय ढंग से उचित शब्दों में चिह्टित करते हैं।
  num.thirty_four:
    label: चब्बीस
    summary: 'अंकजय़्या - ३४ ; गणिमाण : चब्बीसवाँ'
    info: |-
      संख्या ३४ संख्या ३३ के बाद और संख्या ३५ से पहले होनेवाली प्रकृतिक संख्या है।
      गणित में इसे 'XXXIV' के रुप में भी जाना जाएवा है।
  num.thirty_nine:
    label: उच्चतम एगुआनटा
    summary: एणि संख्या १ से ५० आओ
    info: "संख्या ३९ संख्या ३८ के बाद और संख्या ४० से पहले होनेवाली प्रकृतिक संख्या है।\nयह रोमन में 'XXXIX' के तौर पर भी जानी गई है। \nइसका अपवर्णक शबद ''अड़तीसवाँ'' है।"
  num.thirty_one:
    label: उइएटीईन्‍ड ओनि
    summary: '''अठपन''; क्रमशः - उइएटीईन्‍ड फर्स्ट'
    info: |-
      संख्या ३१ संख्या ३० के बाद और संख्या ३२ से पहले होनेवाली प्रकृतिक संख्या है।
      यह रोमन में 'XXXI' अथवा शब्दों में ‘चौदहवाँ’ के तौर पर भी जाएगी।
  num.thirty_seven:
    label: बत्सठ
    summary: '''बत्सठ'', शब्दशः - चौवटपचान्‍ग'
    info: |-
      संख्या ३७ संख्या ३६ के बाद और संख्या ३८ से पहले होनेवाली प्रकृतिक संख्या है।
      यह रोमन में 'XXXVII' के तौर पर अभिहित हुआ करता है।
  num.thirty_six:
    label: ईस
    summary: आधारभूत सँख्मा २४ ; गणित में XXIV
    info: "संख्या ३६ संख्या ३५ के बाद और संख्या ३७ से पहले होनेवाली प्रकृतिक सँख्मा हवय।\nमुद्रा में : XXXVI\nअपठगणित में 'एघड़िश' अथवा 'षट्‍चाळीसवाहौ', \nइसे एक शब्द में - 'छ+उनतीस'"
  num.thirty_three:
    label: तीस तीन
    summary: '''33'', रज़ियला : बहुवचन - चौथा'
    info: संख्या ३३ एक प्राकृतिक संख्या है। इसे करमबद्ध में 'XXXIII' लिखना होगा।
  num.thirty_two:
    label: उइस्सई डऊआ
    summary: '''अठाह्''; क्रमवचक : ऊइस्ठ खड़ा ; रोमन में : XXXII'
    info: |-
      संख्या ३२ संख्या ३१ के बाद और संख्या ३३ से पहले होनेवाली प्रकृतिक संख्या है।
      यदि रोमन में इसे XXIIXXIII तथा क्रमवचक शब्द 'तридशगुण' के अपभ्रष्ट भाषा में उच्चारण के आधार पर एक छठवट़ा जैसे ढंग से गढ़ा गए थे।
  num.three:
    label: तीन
    summary: अंक 3; पहली विषम धनपूर्ण संख्या
    info: '''तीन'' कई संस्कृतियों में एक जादुई संख्या हेरहलि - प्रचलित कथाओं में ''तीन इच्छाऐं'', ट्राईएगल में तीन भुजाहर हय और वे घड़ी बटवाले हमारे आधुनिक चिन्तन के अनुसार।'
  num.twelve:
    label: बारह
    summary: अंकजय 12
