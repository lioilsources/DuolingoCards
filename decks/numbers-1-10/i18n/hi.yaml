lang: hi
pivot: false
title: संख्याएँ १-१०
cards:
  num.eight:
    label: आठ
    summary: संख्या 8, एक सांपड़ के पास आठ हथिनी होती है।
    info: आठ दुनिया में सबसे शुभ संख्या है, खासकर चीनी संस्कृति में। उलटा आठ (एक अनंतवचन के रूप में ∞) अनंत का प्रतीक है।
  num.five:
    label: पांच
    summary: संख्या 5, हमारे हर हाथ में इतनी उँगलियाँ होती हैं।
    info: दस की संख्या प्रणाली पांचक पर आधारित है, क्योंकि मनुष्य के प्रत्येक हाथ में पांच अंगुल होते हैं। शुक्र ग्रह आकाश में पांच नोड्स वाला एक तारा बनाता है।
  num.four:
    label: चार
    summary: संख्या 4, एक चतुर्भुज में चार भुजाएँ होती हैं।
    info: चार के वर्ग से प्राप्त होने वाली संख्या है - 2 × 2 का परिणाम। जापानी और चीनी संस्कृति में इसे अशुभ संख्या माना जाता है (इसकी ध्वनि 'मौत' शब्द के समान होती है)।
  num.nine:
    label: नौ
    summary: संख्या 9, अंकों की सबसे पिछली संख्या।
    info: 'नौ सबसे बड़ी एकअंकीय संख्या है। आश्चर्यजनक गुण: नौ से गुणा की गई कोई भी संख्या जिसका अंकों का योग हमेशा नौ से विभाजित होता है।'
  num.one:
    label: एक
    summary: संख्या 1, प्राकृतिक संख्या के रूप में पहली संख्या।
    info: एक हर संख्या को गुणा करने पर उसमें कोई परिवर्तन नहीं करता है; इसलिए इसे 'गुणन का तटस्थ अवयव' कहा जाता है।
  num.seven:
    label: सात
    summary: संख्या 7, इतने ही रंगों का सैटरडे होता है।
    info: कई संस्कृतियों में सात को शुभ संख्या माना जाता है। एक सप्ताह में सात दिन होते हैं, आकाश में छह अलग-अलग रंग होते हैं और पृथ्वी के सात महाद्वीप होते हैं।
  num.six:
    label: छह
    summary: संख्या 6, एक मधुमक्खी के पिरैलेट में छः कोने वाली संरचना होती है।
    info: छह एक 'पूर्ण संख्या' है - इसके सभी भाजकों (1 + 2 + 3 = 6) का योग उस संख्या के बराबर होता है। षट्कोणीय (षट्भुजाकार) आकृति फर्श को ढकने का सबसे कुशल तरीका है।
  num.ten:
    label: दस
    summary: संख्या 10, हमारी दशमलव संख्या प्रणाली के आधार।
    info: दस दशमलव प्रणाली का आधार है, क्योंकि मनुष्यों के हाथों में कुल दस उँगलियाँ होती हैं। दस प्राचीन काल से गिनती के एक प्राकृतिक मापदंड के रूप में प्रयोग करे जाते हैं।
  num.three:
    label: तीन
    summary: संख्या 3, पहली विषम अभाज्य संख्या।
    info: कई संस्कृतियों में तीन को एक जादुई संख्या माना जाता है - ऐसे कहानियाँ हैं जिसमें तीन इच्छाओं के बारे में बताया गया है, त्रिभुज में तीन भुजाएँ होती हैं और दिन तीन भागों में विभाजित होता है।
  num.two:
    label: दो
    summary: संख्या 2, एकमात्र सम पूर्णांक।
    info: दो ही वह एकल सम मुख्य संख्या है और द्विआधारी (बाइनरी) प्रणाली के आधार के रूप में काम करता है, जिस पर सभी कंप्यूटर कार्य करते हैं।
