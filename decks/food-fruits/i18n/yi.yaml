lang: yi
pivot: false
title: עפודן
cards:
  fruit.ackee:
    label: _ackei_
    summary: רעדווער טרופיענע פרייט עם אלגליכע גאלדענע ארילי; נאטיווע פרוייד פון גמייקה.
    info: אקיי (בלייג'יא סאפידה) איז דער נישטונע פלוים פון גמיקה; באזשאן אויף קפטן בלייג', וואס האבן ערשיינד אין 1750. בלוימ זיין נאר די מיטל ארילעס; אנגעבויכנעם אбо צו מאכן פ루מעם איז טוקסייק (היפאגלאسين אי). 'אקאי אנד salts fishes' איז דאס עטליך שפיל עלגאנטע יעד פעקט גמיקה.
  fruit.apple:
    label: apple
    summary: Rund rote oyf grune frayntik mit sveyger kaysige geshmak.
    info: '"Apple" iz di frucht fun der Malus domestica boom un es eine vun den meist angebazten pflanzen op erdnis. Es enthalt vitamin c und fiber; dozuz endgt e shprichmohl von uber 7500 sortn.'
  fruit.apricot:
    label: merenkes
    summary: Kleine orangefruite; zoet-syur un sapryek.
    info: '"Merenke" (prunes), afgeleid van Prunus armeniaca, kamen oorspronklik uit Sentraal-Azië en weurt geplant op die boerderije in Tsjechië sowohl es Europa; di eisigste komme aus Turkiye un Spanien. Sy is ryk aan betakaroteen un vitamin А.'
  fruit.avocado:
    label: אווק ад
    summary: קרעם גרין-פלעס האלטנדיג פרייכט
    info: אַווקאדואָ (פערסיע אמעריקענע) קומט פון מיקסיי און צentralן עיראק. בוטאניש גרייט ווי א שווערע באום (ペックォוויציי), נארדיג דזשונגענ זיין אייך אין אלץ מאכטען סאלאט אויף די וועלט; טוסט מיט авוק ado איז א שפיל נעך דורכן כפרה.
  fruit.banana:
    label: بانان
    summary: געלב שפיל קריימיקל פרייך
    info: '"банан" איז דער פרייך פון עטליכע טרופישע צוויגן אין די משפחה באנאן האויסט וואס זינד געווענליך באקאנטע מוסה ספעציעז.'
  fruit.blackberry:
    label: بلאן
    summary: טא מאווה פילהוואולעגענעבערג מייסן
    info: בלאענען איז דער טמאווער פילאוועל באלץ מיטלעם די שטיקעל קלאסטע צווישן די באumber זינדן געווארן אויף נוקעסמעך. וויילדע בלאנדזש אין לענדזש ענטלויפונג און סומאר ערנства. עס האльт'ס א שוין בערך פונקטיווע מענגע פון וואיטהם סיי,קיי און פיבער.
  fruit.blueberry:
    label: בורווה
    summary: דויפיג בלוי בעבעלע מיט שווארצע איינוואקטאר.
    info: בּאראבוועקען פילן אנטיאוקסידאנטן וועלכע גיבן דעם בלאווער צווישן די באובעלעס און זייערע שטייענדיגע אנאטיקדזשנע עיוותער. טורמענ סווייט אז ער האבן נייץ אויף קוגנייצירונגען און הייסליכקיייט.
  fruit.cantaloupe:
    label: קאנ탈ופה
    summary: גראנצש-браون געזעצטע מאפלוס מיט בריווערעאורנג שאפע.
    info: קאנטאלופע (צוקום מלו ואריאט'ו קאנטלאפעסנען) איז נאטורליכער מאפונס פון מעלאאן צוליב די עסייער. דעם נעמעך באקומפט זיין פון בישוף סידנדיג אין קאנตลאופע נייר רימע. די אורנג שרייט איז ערמאעלדיק אויף בעטא קראטין און ווייטהם אי.
  fruit.cherry:
    label: trushene
    summary: Kleyn runder royter stein-fruyts vos wachsen in paaren.
    info: '"Trushene" iz di frucht fun der "truschne", ein beliebte summere obach. Es het antioxidenter un meletonin; es geynt zog sveyger un saure sortes.'
  fruit.coconut:
    label: קווקוס
    summary: גרייס תרופי בענצ'אן מיט פרימעס חוץ
    info: קווקוס (קאס נויסיפארע) איז דער פראדט וועגן די קוואקאס טרעיבן; באטאניש און קיין באנעך אויך נעמענט זייער צוויקליגע שפילע מיטגעוויינטליכע ספאלטע. די ערדשאפט אין איין גרויסנעם פלאץ איז אירגענדזיוואר יונטאכע מאסק לעבן.
  fruit.cranberry:
    label: prusinke
    summary: קליינע רעדне שקיעה בובלא; טרעדיציעלע אמריקה איינו.
    info: ברוסינקה (Vaccinium מקרוקארפאן) איז נאך קליינע צירגענע שועריגער באלגעלן אין דעם פאמיליע פון וויין בערגס. עס איז די טראדיציונלע טיולונג צו מעשהアメリカנישע גיבורטסטאג ( cranberry סאס ). עס האבן פרואנאٿוצאנידינים וועלכע באקאם מאכן אז בייסיקעס קלמבאדזש'ן זיך אויפ'ן מויכוואלויף.
  fruit.currant:
    label: ريبיז
    summary: קלויענע רויטע, שוואらずע אדזש'וויße באבעלס זוכנדיג אין דורניס.
    info: ריביז איז עין קליינע באבעל שטיקנדיג אין דרענגליך טראפiken. שווערצער ריביס האלט די מערסטע ויטאמען סי פון אלעם בובעלעס; ער איז אויפגעצוועל געווארן צום ספעציעלאייט נאפוק Rigby (ברייטיש).
  fruit.damson:
    label: דאם阿森סקע.shaסטeka
    summary: די בלווערע.shaסטeka איז טייפיק אלגע布拉ך אויף אנגלישע לאנד האוס.
    info: דאםאסענענסקער שאסטעקה איז נאמען דורך די טיטל שטאט וועלכע פארקומפט מיט זיין באשעפעניש צו אייראפ迂. עס איז קינדזיך מארגריג סיי גרויס ערפאלג אין יוגעל, פריימונץ און גין.
  fruit.date:
    label: דאטלעס
    summary: שווערס בראונשע אוואלב שפיל עלפס פון דעם דאטלווענע פריים.
    info: דאטלען פון דעם זוכערפארם (פינאקס דאקטיליפארה) סייין שווערע פרייטעלס מיט א וויי נויכטע צוקער אין די ערטערונג פון 75%.
  fruit.dragon_fruit:
    label: דרעי אבעсе
    summary: רוסעוועג טרופikalישע קאקцеוס פעלאדן מיט שוועל נעגרע לעבמיפיל.
    info: '"דראכע אָוועס" פארקאמט מיטלמענשישן אויבער נאך צentral אריקעס מאקסיקאו וואוס רוזענע שפיל סוויג דריי בלוואר קאלר מעגליך גרויס דיינסט באווייזן זיין ענטפארוואנדונגען אין אנטי.okسيدאנטעס און ווייטהם סי.'
  fruit.durian:
    label: דוריין
    summary: גרייסן טראכטיערן טרופישן פרייטל מיט'ן חזוכן ריח; קעניג פון טרופישן פרייטל.
    info: דוריין (דוריו זיבתינוס) איז גערופן דער קעניג פון טרופישן פרייטל. די סטארק שמעה וואס מעגליך צו עטליכע נאך אויסגעצוקן אבער אנדרע ליפנענדיג; אין מערERE אזיאאטשע האוטעלס איז ער באפארbett. די בלווענקי איז קרימאווונדיק און שוועדיק מיט כומפלקסטע geschmack (מאנדוועלעס, vanilla, מאסקרע).
  fruit.feijoa:
    label: פייאואה
    summary: קלוימענע באווולמגע גרונע פרייט מיט'נ ארומאטישע קרעמס.
    info: פיעאווע איז פון סודעמעריקה. עס האט א שטערשיגע ארומאטישע טעסט (אנערןשטיין, גוואוואווה, מינטל). דאס ווארם איז זייער באליבאר אין ניידזילנד אלץ צום אויסגעווייף.
  fruit.fig:
    label: פיק
    summary: קאמפלעמט סוויעט פ루יץ פון פיק בעם.
    info: פיגען איז איינער פון די אלטעס געוועקסנעמע קלאכטן; דאס וואוס צו מערדיקלישע באנוץ זאגן ١٠‏⁣٬٥٢٤ יאר רוקווארט. אין טאטל נייסט עס ניט אויף א קלוכט, אלא אויפ'ן באשעפענעם שפילר פונקט מאכן צוזאם. די לעבערע האבן ערציילט אז אדם און eve האבן נוצט פิกעלעך צו מעכלען.
  fruit.gooseberry:
    label: anglesht
    summary: keyner runder transparenter beerenfrucht
    info: |-
      Anglesht (Rybes uvakryspa) iz af di keynmere fruchtn vienen far midday europa gartnerey
      Es geyst yn grunem, blau un gelb.
      It is reich an vitamin c.
  fruit.grape:
    label: גרענז
    summary: קליטשיקע באובעלעך מיט'ן כוכבצישע ערשייפונג.
    info: ווינענע רעווע פראדוצירט גרענעץ אין ווארשלעס צוליבן גרין ביז די דערק בענייגע קאלאר. עס איז מעגליך אז מאכן זיי נאטורליכעמער, טרייען אויף ראזינים און שפילדן סיין.
  fruit.grapefruit:
    label: греп
    summary: גרויסע שוועך סוויעце פרייך; נויש מאכיגkeit.
    info: גרעפ (ציטрус פאראדיסי) איז עין מיקס וואן ציתرون און גרעפן. ער איז באשriebן אין די איינצעלטער שטעטל אויף באהאמעדאס. ראוזענע און רודע גריפעס האבן לycopene און בעטא קראאטאן.
  fruit.guava:
    label: גוואווא
    summary: טרופישע פרייך אין בלוyme קלאר אנד רוזע שטיין.
    info: געוועה איז פון טרופישע ארמעריקע און גייט דורך די וועלце צו טרופишעアジア אןד אפריקה. עס האט 4 מאל מער ויטאמין סי אלץ אוראנזשעס.
  fruit.jackfruit:
    label: jack
    summary: Große Tropischen Frucht; größte Baumfruch auf der Welt.
    info: '"Jack" Artokarpos unikeilis פראדוצירט די גרעסטע פרייטעמער וועלכע צוברן אויף א בום אין דער ערדשאפע; זיי קענען ווערן מער אלץ 35 קילוגראמ. ער באקומט פון טרופישעアジア; עס איז א סעדיגע מאסקה אין อינדייע, בענגלאדע ש''אן און泰国''. נייקלעגונג מעגליך האט נייטראלע טעקסטואר און וואנרט אנגעוונדזונגן אזויווי vegetarian meat substitute.'
  fruit.kiwi:
    label: קיוו
    summary: בראون הא рыגע מאסקעלע מעץ גרין פלויד; רייך אנ פריטאמינים.
    info: Kivy iz פון צינע אסאמער זיין גערופן יאנג טאו אויף שטארן קיוי אין ניו זיעלאנד וואו עס איז באקומענ מער באנוץ דורך די רעדנעגונג פונעם לאקאלשטעם בערגל לעבעדיגע סאטאן.
  fruit.lemon:
    label: sitru
    summary: Sueriker gelber Citrus; Quelle vu Vitamin-C un Aroma.
    info: Zitran iz af Asiye un es keyserlik vegnor fun vitamin C und sitrunziger suerike. Es vel geven diyetik, trinke, make-up un reinigungsmittel.
  fruit.lime:
    label: לימעס
    summary: גרינע צitus מיט באזיגע שאף
    info: לימות איזן גרינע ציטрус מיט עקסעלער שטוף און ארומאטישע קארפּע. זיי סинд נויציג אין מאכسيקאניסצcher וויילנדשאפט, טhai און פונעם קוכי. זייער ווערט איבערהאלטנ'ד דורך די קלירגעמאךטע ערנסץ.
  fruit.longan:
    label: لونגען
    summary: קטנה בראונדן טראפיקעס פרודיקייט ליצ'
    info: '"לונגן" איז דער פלאד וואס קומט מיטן טרופישעמע שטיינמאל עטליכע מאל צו זיין געווענליך אין סין. די נאך באקומפט זיך פון דעם סיני תּש''פֿנע "לוڠ יאן", וועלכע ב beard אזוי אויף ''דרקע איי'', לויביג דורך די קלארע פרייער מעטה איר שווארצעמאכן. ער האט א סוויסטע און ארומהאטישע טעסט.'
  fruit.lychee:
    label: likhi
    summary: Kleiner roter tropisker fraynt mit transparenter fleshen; beliebt op Azie.
    info: Likhi iz a troypikayse frucht vos kumt af China un het nisht farzogen di shlepung fun der ruzenerner skine um ze avsluyren di tranzparente veyshe flësche. Es hot en suete, aromatisher geshmak.
  fruit.mango:
    label: מאנגה
    summary: טרופישעס פלאץ אין ערדגאלטעגענדע צוויוץ.
    info: '"מאנגו אינדיקע" איז דער געווענליך נאמער פאר טרופישעס באוםפלויגן מיט זעלטנע אוранזש ערדר צוויצער וואס קומט פון סוד אייעוידע מאָל שפעציעל מעגליך 4000 יאר.'
  fruit.medlar:
    label: misfuyl
    summary: Kleine braune apfelartige frucht
    info: |-
      Mispuyle (Meshpile germaenika iz der alteste garten frucht geplant seit dem mittelalter
      es is esgebar nach bletem: et liegt nacheinander bis si sich weich macht
      et ist reik an polyphenole un vitamin c
      Shakespeere erwähnt sie in Romeo und Julia; heutzutage is se eher ein kuriöse gardenerie
  fruit.melon:
    label: מלו
    summary: גרוסה סווועטע פרייטל אין אוראנזשאפט, גרינוי אויבר וeiß
    info: '"Melo" iz afkommelek fun Afrika un Azien; es geit op der ganzer wועלד געפארט זיין. Es het מער ווי ניינ恣 פראצענט וואסער און דאס מאכט עס צו איין פונעם באלסטן האידרעאטירנדיגע פרייטל.'
  fruit.mulberry:
    label: more
    summary: Dunkle purpurfruchte fun enem Moreboom; nahrung vom silberwurm.
    info: '"More" iz di frucht fun Morus tritme; more blätter senn di nahrung vom silberwurm. Es gippt vaitse, rute un svartze maren; di svarts is am süssesten. In der heshtorie hot man kultivirt den Morebaum um tsaarproduktion ze fördarn. Maren hoben reichlich Resveratroel, Vitamin-C und Eisen.'
  fruit.nectarine:
    label: nekatarinke
    summary: Glatt afel oyf veltn klumpfen; saftig und zoys.
    info: Necktaringa (prunik peresike far. nutsiperseika) iz nemir naturlekhe muteziye fun eine apfel mit glatter epidermis un es farkelt sich nur durkh einen geen fir di smoothness der skin. Es hot en gleikheyre geshmak aber fester struktur.
  fruit.orange:
    label: פוימאראןוץ
    summary: רוonden פרייט עם אנדערוואוס אנגראזובע שעקל.
    info: '"פומאראנץ" איז נאכגעוויגן פון סודעסט דזשיענע שטאטער וועלך געווענט זיך אין די ערדגלעלטעמער טייטליכס צו קלאיבן אויפ''ן מיטטל ים. ער האט שווארצע באלוונגונג מענישע בריינדיקקייט.'
  fruit.papaya:
    label: פאראז
    summary: גรอยße פרייך אין טייפיקע ערנע מיט באקוועמע אוראנגע שפעך.
    info: '"פּאפאיע" איז פון טרופישע עירן מיט דעם נאטורליכער אנזימ "פסיין", וועלכער האלבט צו פרוטאין מאכן. זי''ס גרייס אויף וויטעם סי, ביטה קאראטאן און抗氧化剂.'
  fruit.passion_fruit:
    label: מוצאנקה
    summary: טורפישע פריי מיט פרואגעווער פורפלעסקע ערשלעך און ארומהאטישע מאגן.
    info: '"Muczanka" (Pasifikלארה אדוליס) קומט פון דער טרופישע שפילנדיגן נויטרעליקע וועלטע. די נעמעכונג באזירט זיך אויף מיסיענענער''ס סימבאליזאציע אין בלוועם צווין געבויבן פונעם קריסטוס לעידן. די פריי האפט מעגליכקעייטן פון מאגענט ערטשעינען אין ארומהאטישע געל.'
  fruit.peach:
    label: פרוץ
    summary: זילבער ראאזע שפילע
    info: פראכען פון די צוויגער ברייט איז דער סימבאל פאר נאך לעבן אין טרומפטסמעקט וואו ער קם פון. עס גיבט שווערע מוטארונגען מיט זילברנעם אויפשלאג אדער רוז האלב מאלצ'ינעס.
  fruit.pear:
    label: pir
    summary: Sliz-fraym farg frayldik-tarig.
    info: '"Pir" iz di frucht fun der pear trée, vos iz nahe verwandt mit dem apfelbaum. Es het nuchtlech, sädliges fleisch un en hoher fibren gevels; es geytn hundreder arben.'
  fruit.persimmon:
    label: tamel
    summary: אוראנז'אווו אווייס פארוואונדן מיט עטלעס; שווייסט און באאם.
    info: |-
      Tamel (דיאספירות קאקי) איז פון ציין אן יפן;
      in דער טשעشه רעזיגנס ער ווערט גenanט tamel fun יפן
      איינגעפארטעגנע נייקייט אין די מאך סוויעסט און בלאם מיטלמענגליך,
      ad מענדעלעכע זוכר
  fruit.pineapple:
    label: אן נענאס
    summary: טורפישעס פרייעמאל מיט איינצשלאכגענדע קרונע און געלב מעגל.
    info: '"אנענאס" קומט פון דער סוד אמעריקאנע ערדגלויב וואס געווענט נייגר צו טרעפן אין די תורפיקל ריזן בערג שטעטל דורכאוס דיא וועלט מיט זיין באקאנטע בראמאין אנזים אזוי אויך האלבטרעם.'
  fruit.plum:
    label: שוويدיקה
    summary: פיעלווע באלגענדיגע פריי; באאזisorף פאר סלבאוויצ' און פוידلاء.
    info: דער שוויסטקה איז דאס באזישע פראוץ אין מיטל אייראפע. סלאיוויץ' (שווהסטקעווער דייסטעילאט') איז עטליכע טרעדיציעלי צעצכישע און slopeנישע וואסן. פוידעלה שוועדיקאווע אריאן זיך אויף נאמך קעלמענע ערträג.
  fruit.pomegranate:
    label: גרנאתובאסקה
    summary: רוודיקע פרייט עם תקופות שוויבשע קערנעלאכע; סיימ벌 פאדאגישקיייט.
    info: גראנאאטאבאלע פון מיטל אזיען און דעם מאידיאלנד האטמער ווי 600 קערנעלאך אין טרעפן ראדעווע סאפ (ארילעס). עס ריכטיג אויף אנטיוקسيدאנטעס; ערנסצונג מעגליך איינפלוס צו די ❤️ און อיןפלויזמונגען.
  fruit.quince:
    label: קיודה
    summary: דיין'ס א שווערס ייולעגע באום פלאם וועלכע איז נاوוייג צווייכן איינו; מען האפט אזוי אלץ.
    info: קיודוועלע (סיידוניע אבאנגא) איז נאווייג צווישן עפל און בירנענשטעקער; ער וואסנדזט פארמייט מיט דעם טריפעל געווארמענט. מעגליך נעך קינדער אין די אויברעכונג זיין מאפאלעס, שפילן און ספארה פעקלען.
  fruit.rambutan:
    label: рамботан
    summary: רווט האראי טרופישע פרייף
    info: |-
      рамботאן איז פון מאלאגיעסן; דער נאמע קומט פארמאלווער=היילעך אין די מאลายשע שפראכע
      דזין רעדנע באאלגונג ווייסנדיג מיט זופרע סוווארציקלע צווס탄גען
      די פרייך גרויפקע איז ט्रנספארנט און שווארצע, לייכצ'י
  fruit.raspberry:
    label: malerne
    summary: Rot kombinierte Beere; Symbol der Sommers yn em garten.
    info: '"Malerne" (Rubus Idaeus iz di rubesnterme geveltn fun vieler kleyner fruchtkerns (drupel). Es wachse beides wil un gezuchtetes; es wered opgepakt yn de sommer un herfst. Reich an Vitamin C und K, Mangane un Antioxidantien.'
  fruit.starfruit:
    label: קאראלמבולאה
    summary: יאנגלייגע טרופישע פרייט וועלכע ביידעוט שויבצען
    info: קאראמבולה (אברראווה קарамבולא) איז פון סוד אן דרום-מזרחアジア. ווענער מענטשן צו שטייען מיט זיין מאכטיגע געשטאלטע פונעם ערטל ערשיינס ביי באשנעידונג – אזוי וואוס די נאם „סטארגפ루קט“. עס האפט א säur-זוויסמע טישעל און איז ריכטיק אויף ויטהמין סי. אייך בערך אין פרוכעס לעבערמייליגע מענטשן דורפן זי נישטא' יגען מירגעווארדיגקייט פעלוועגן.
  fruit.strawberry:
    label: yahota
    summary: Eyn roter, shvetsiker boibel yn form vos eynes harts.
    info: '"Yidhova" iz di mekhemlekhste frucht fun der "Rozeflimligen" fargeshtelte un es geven apikusim vu vitamin-C und antioxidentn; man pikt em op somer un hot en sunderbar geruch.'
  fruit.tamarind:
    label: tamari
    summary: רעד-בראונע בענען מיט שארפער פרייטל; בסיס פאר thai כוכווואר.
    info: '"Tamari" איז געבוירן אין טרופישע אייערפארמעגונג; עס ווערט פילזט צו דער טייפשטע שפעאר. די פרייטל קאנסיסטיציד זיך אויס פון באלויגנדיקע סאורע מעדלאך, וועלכע נוצן באנוץ אין תאי מאנשיינעס לייכטלעכוואוסigkeit ליבקעגן.'
  fruit.tangerine:
    label: מאנדרין
    summary: קלויףגענעגעוויוסigkeit Citrus mit נעכער שקילה.
    info: מענדארינקה (ציטрус רעטיקולאטע) איז עטליכער מילימטר אין די קראָם פון ציطن וואס באקומפט זיך אויסן דורך ספלאץונג. מענדארינים זענען נאטירלישע גאלדשפילר ביי מאניערע שפעציעליונס לויפן. זייער קליבוע טייטלך פרוועליגענט לעבן.
  fruit.watermelon:
    label: ווסער מאלע
    summary: גרייס גרין סטרייפעד פרייעמענט אין רויג שפעק.
    info: וואסערמאלען קומט פון אפריקע און איז איינגעפlogen ווי זomer בוך. עס באשטעקט מיטר צוויי% וואסה און האльт ליווענען וועלכע גיבט דעם רוטע נאך.
