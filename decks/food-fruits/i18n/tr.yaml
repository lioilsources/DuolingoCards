lang: tr
pivot: false
title: Meyve
cards:
  fruit.apple:
    label: elma
    summary: Tatlı-ekşi tadı olan yuvarlak, kırmızı ya da yeşil bir meyve.
    info: Elma, dünyanın en çok yetiştirilen bitkilerinden birinin, elma ağacının meyvesidir. C vitamini ve lif içerir; 7.500'den fazla çeşidi vardır.
  fruit.banana:
    label: muz
    summary: Tatlı özlü sarı bir tropik meyve.
    info: Muz, muzgiller familyasından tropik bir bitkinin meyvesidir. Potasyum ve hızlı enerji veren doğal şekerler bakımından zengindir.
  fruit.orange:
    label: portakal
    summary: Mis kokulu turuncu kabuğu olan yuvarlak bir turunçgil.
    info: Portakal, kökeni Güneydoğu Asya olan, bugün tüm dünyada yetiştirilen bir turunçgildir. C vitamini bakımından zengindir ve meyve suyu olarak sevilir.
  fruit.strawberry:
    label: çilek
    summary: Kırmızı, sulu, kalp biçiminde bir meyve.
    info: Çilek, gülgiller familyasından sevilen bir meyvedir. C vitamini ve antioksidan bakımından zengindir ve yazın toplanır.
  fruit.grape:
    label: üzüm
    summary: Salkımlar halinde büyüyen küçük, yuvarlak bir meyve.
    info: Asma, yeşilden koyu mora kadar çeşitli renklerde üzüm verir. Üzümler taze yenir, kuru üzüm için kurutulur ya da şarap için sıkılır.
  fruit.watermelon:
    label: karpuz
    summary: Yeşil çizgili, kırmızı sulu özü olan büyük bir meyve.
    info: Karpuz, Afrika kökenli, sevilen bir yaz meyvesidir. %92'si sudan oluşur ve ona kırmızı rengini veren likopen içerir.
  fruit.mango:
    label: mango
    summary: Sulu, sarı-turuncu özü olan tropik bir meyve.
    info: Mangoya tropik meyvelerin kralı denir. A ve C vitamini bakımından zengin olan mango, 4.000 yıldır yetiştirildiği Güney Asya'dan gelir.
  fruit.cherry:
    label: kiraz
    summary: Çiftler halinde büyüyen küçük, yuvarlak, kırmızı bir çekirdekli meyve.
    info: Kiraz, sevilen bir yaz meyvesi olan tatlı kiraz ağacının meyvesidir. Antioksidan ve melatonin içerir; tatlı ve ekşi çeşitleri vardır.
  fruit.pear:
    label: armut
    summary: Tatlı ve yumuşak tadı olan damla biçiminde bir meyve.
    info: Armut, elmanın yakın akrabası olan armut ağacının meyvesidir. Yumuşak, sulu bir öze ve yüksek lif içeriğine sahiptir; yüzlerce çeşidi vardır.
  fruit.pineapple:
    label: ananas
    summary: Dikenli bir tacı ve altın sarısı özü olan tropik bir meyve.
    info: Ananas, Güney Amerika kökenlidir ve bugün tüm dünyanın tropiklerinde yetiştirilir. Sindirime yardımcı olan bromelain enzimini içerir.
  fruit.lemon:
    label: limon
    summary: Sarı ve ekşi bir turunçgil; C vitamini ve aroma kaynağı.
    info: |
      Limon, kökeni Asya olan ekşi bir turunçgildir.
      C vitamini ve sitrik asit bakımından zengindir.
      Mutfakta, içeceklerde, kozmetikte ve temizlik ürünlerinde kullanılır.
      Limon kabuğu, karakteristik limon kokulu bir uçucu yağ içerir.
  fruit.lime:
    label: misket limonu
    summary: Küçük, yeşil ve ekşi bir turunçgil; tropik mutfağın temel malzemesi.
    info: |
      Misket limonu, ekşi suyu ve aromatik kabuğu olan küçük, yeşil bir turunçgildir.
      Meksika, Tayland ve Vietnam mutfağında vazgeçilmezdir.
      Limondan daha az C vitamini içerir, ancak daha güçlü bir aroması vardır.
      Misket limonu yemek, C vitamini sayesinde denizcileri iskorbütten korurdu.
  fruit.kiwi:
    label: kivi
    summary: Yeşil özlü, kahverengi tüylü bir meyve; vitamin bakımından zengin.
    info: |
      Kivi, Çin kökenlidir ve orada Çin bektaşi üzümü olarak adlandırılır.
      Yeni Zelanda onu ticarileştirdi ve ulusal kuşu kividen esinlenerek yeniden adlandırdı.
      Bir portakalın iki katı C vitamini içerir.
      Özü parlak yeşildir; altın (sarı) çeşitleri de vardır.
  fruit.peach:
    label: şeftali
    summary: Kadifemsi, sarı-pembe bir çekirdekli meyve; yazın simgesi.
    info: |
      Şeftali, ölümsüzlüğün simgesi olduğu Çin kökenlidir.
      Yumuşak, kadifemsi kabuğu karakteristiktir.
      Beyaz ve sarı çeşitleri vardır; nektarin, tüysüz, düz çeşididir.
      Çin'de şeftaliler yeni yılın ve şifa mitolojisinin bir parçasıdır.
  fruit.plum:
    label: erik
    summary: Mor bir çekirdekli meyve; erik rakısının ve erik reçelinin temeli.
    info: |
      Erik, Orta Avrupa'nın temel bir meyvesidir.
      Slivovica (erik rakısı), geleneksel bir Çek ve Slovak içkisidir.
      Erik reçeli, sonbahar hasadının tipik bir ürünüdür.
      Dünyada 2.000'den fazla erik çeşidi vardır.
  fruit.apricot:
    label: kayısı
    summary: Küçük, turuncu bir çekirdekli meyve; tatlı-ekşi ve sulu.
    info: |
      Kayısı, Orta Asya kökenlidir.
      Tüm Avrupa'da yetiştirilir; en tatlıları Türkiye'den ve İspanya'dan gelir.
      Beta-karoten ve A vitamini bakımından zengindir.
      Kuru kayısı, sevilen sağlıklı bir atıştırmalıktır.
  fruit.raspberry:
    label: ahududu
    summary: Kırmızı bir bileşik meyve; yaz bahçesinin simgesi.
    info: |
      Ahududu, birçok küçük çekirdekli meyveden oluşan bir bileşik meyvedir.
      Yabani ve kültür olarak yetişir; hasadı yaz ve sonbaharda olur.
      C ve K vitamini, manganez ve antioksidan bakımından zengindir.
      Ahududu reçeli ve sirkesi, geleneksel lezzetlerdir.
  fruit.blueberry:
    label: yaban mersini
    summary: Koyu mavi bir meyve; antioksidan dolu bir süper besin.
    info: |
      Yaban mersini, güçlü antioksidan özelliklere sahip pigmentler olan antosiyaninler bakımından zengindir.
      Antosiyaninler ona koyu mavi rengini verir.
      Çalışmalar, bilişsel işlevler ve kalp sağlığı üzerinde olumlu bir etki olduğuna işaret eder.
      Kültür yaban mersinleri, yabanilerinden daha büyüktür.
  fruit.blackberry:
    label: böğürtlen
    summary: Böğürtlen çalısından koyu mor bir bileşik meyve.
    info: |
      Böğürtlen, dikenli bir çalıda yetişen koyu mor bir bileşik meyvedir.
      Yabani böğürtlen, orman kenarlarında ve çalılıklarda yetişir.
      Bol miktarda C vitamini, K vitamini ve lif içerir.
      Böğürtlen reçeli, komposto ve likörü geleneksel ürünlerdir.
  fruit.coconut:
    label: hindistan cevizi
    summary: Sert kabuklu ve beyaz özlü büyük bir tropik ceviz.
    info: |
      Hindistan cevizi, hindistan cevizi palmiyesinin meyvesidir; botanik olarak bir ceviz değil, bir çekirdekli meyvedir.
      Olgunlaşmamış meyvedeki hindistan cevizi suyu, doğal izotonik bir içecektir.
      Hindistan cevizi sütü ve yağı, Güneydoğu Asya ve Hint mutfağının temelidir.
      Hindistan cevizi palmiyesine bin kullanımın ağacı denir.
  fruit.papaya:
    label: papaya
    summary: Koyu turuncu özlü büyük bir tropik meyve.
    info: |
      Papaya, tropik Amerika kökenlidir.
      Proteinlerin sindirimini kolaylaştıran papain enzimini içerir.
      C vitamini, beta-karoten ve antioksidan bakımından zengindir.
      Olgunlaşmamış papaya, Güneydoğu Asya mutfağında sebze olarak kullanılır (som tam salatasında).
  fruit.guava:
    label: guava
    summary: Yoğun kokulu, beyaz ya da pembe özlü tropik bir meyve.
    info: |
      Guava, tropik Amerika kökenlidir ve tropik Asya ile Afrika'ya yayılmıştır.
      Bir portakaldan dört kat fazla C vitamini içerir.
      Kabuğu ve çekirdekleri yenilebilir; tüm meyve besleyicidir.
      Guava suyu ve reçeli, tropik ülkelerde popüler ürünlerdir.
  fruit.pomegranate:
    label: nar
    summary: Bin tatlı taneli kırmızı bir meyve; bereketin simgesi.
    info: |
      Nar, Orta Asya ve Akdeniz kökenlidir.
      Saydam kırmızı özle (arillerle) sarılı 600'den fazla tane içerir.
      Antioksidan bakımından zengindir; çalışmalar kalp ve iltihap üzerindeki etkisini araştırır.
      Birçok kültürde bereketi ve bolluğu simgeler.
  fruit.fig:
    label: incir
    summary: İncir ağacının armut biçiminde bir meyvesi; tatlı ve çekirdek dolu.
    info: |
      İncir, en eski kültür meyvelerinden biridir; izleri 11.000 yıl öncesine uzanır.
      Aslında bir meyve değil, binlerce küçük çiçekle dolu bir zarftır.
      İncil anlatısındaki Âdem ve Havva'nın incir yaprakları, incir ağacının yapraklarıdır.
      Kuru incir, kalsiyum, potasyum ve lif bakımından mükemmel bir kaynaktır.
  fruit.date:
    label: hurma
    summary: Hurma palmiyesinin tatlı, kahverengi, oval bir meyvesi; Orta Doğu'nun temel besini.
    info: |
      Hurmalar, hurma palmiyesinin tatlı meyveleridir.
      Binlerce yıldır Orta Doğu'nun temel besinidir.
      %60'tan fazla şeker içerir ve belirgin bir enerji kaynağıdır.
      İslamda hurma, Ramazan orucunu açarken geleneksel olarak ilk yenen besindir (iftar).
  fruit.melon:
    label: kavun
    summary: Turuncu, yeşil ya da beyaz özlü büyük, tatlı bir meyve.
    info: |
      Kavun, su içeriği yüksek, tropik ve yarı tropik bir meyvedir.
      Afrika ve Asya kökenlidir; bugün tüm dünyada yetiştirilir.
      %90'dan fazlası sudan oluşur ve çok ferahlatıcıdır.
      Kantalup, bal kavunu ve galia gibi yüzlerce çeşidi vardır.
  fruit.cantaloupe:
    label: kantalup kavunu
    summary: Koyu turuncu özlü, ağ desenli bir kavun.
    info: |
      Kantalup kavunu, Asya kökenli, sevilen bir kavun çeşididir.
      Adı, Roma yakınlarındaki Cantalupo papalık konağından gelir.
      Turuncu özü, beta-karoten ve A vitamini bakımından zengindir.
      En tatlı kavun çeşitlerinden biridir.
  fruit.grapefruit:
    label: greyfurt
    summary: Büyük, tatlı-acı bir turunçgil; diyetlerin yıldızı.
    info: |
      Greyfurt, portakal ile pomelonun bir melezidir.
      18. yüzyılda Barbados'ta tanımlanmıştır.
      Pembe ve kırmızı greyfurt, likopen ve beta-karoten içerir.
      Greyfurt suyu birçok ilaçla etkileşir; hastalar doktorlarını bilgilendirmelidir.
  fruit.tangerine:
    label: mandalina
    summary: Kolay soyulan kabuğu olan küçük, tatlı bir turunçgil; Noel'in simgesi.
    info: |
      Mandalina, Çin kökenli, kolayca soyulan küçük bir turunçgildir.
      Çin Yeni Yılı'nın ve şansın simgesidir.
      Birçok ülkede tipik bir Noel meyvesidir.
      C vitamini, antioksidan ve flavonoid içerir.
  fruit.passion_fruit:
    label: çarkıfelek meyvesi
    summary: Buruşuk kabuğu ve çekirdek dolu aromatik özü olan tropik bir meyve.
    info: |
      Çarkıfelek meyvesi, tropik Güney Amerika kökenlidir.
      Adı, çiçekte Hz. İsa'nın çilesinin simgelerini gören misyonerlerden gelir.
      Özü, aromatik bir jelle sarılı çekirdeklerle doludur.
      C vitamini, lif ve antioksidan bakımından mükemmel bir kaynaktır.
  fruit.lychee:
    label: liçi
    summary: Saydam özlü, küçük, kırmızı bir tropik meyve; Asya'da sevilir.
    info: |
      Liçi, Çin kökenli bir tropik meyvedir.
      Pürüzlü kırmızı kabuğu kolayca soyulur ve saydam beyaz bir öz ortaya çıkarır.
      Tatlı ve ince aromatik bir tadı vardır.
      Çin'de şansın ve refahın simgesidir.
  fruit.dragon_fruit:
    label: ejder meyvesi
    summary: Beyaz benekli özlü, pembe bir tropik kaktüs meyvesi.
    info: |
      Ejder meyvesi (pitaya), Meksika ve Orta Amerika kökenlidir.
      Parlak pembe kabuğu ve siyah çekirdekli beyaz özü çok dekoratiftir.
      Hafif bir tadı vardır ve antioksidan ile C vitamini içerir.
      Ondan meyve suyu, smoothie ve dekoratif tatlılar yapılır.
  fruit.starfruit:
    label: yıldız meyvesi
    summary: Kesildiğinde yıldız oluşturan sarı bir tropik meyve.
    info: |
      Yıldız meyvesi, güney ve güneydoğu Asya kökenlidir.
      Enine kesildiğinde kusursuz bir yıldız oluşturur; İngilizce adı starfruit buradan gelir.
      Tatlı-ekşi bir tadı vardır ve C vitamini bakımından zengindir.
      Böbrek hastalığı olan kişiler, oksalatlar nedeniyle onu yememelidir.
  fruit.avocado:
    label: avokado
    summary: Kremsi bir tropik çekirdekli meyve; guacamolenin temeli.
    info: |
      Avokado, Meksika ve Orta Amerika kökenlidir.
      Botanik olarak bir meyvedir (çekirdekli meyve), ancak mutfakta sebze olarak kullanılır.
      Zeytinyağı gibi sağlıklı tekli doymamış yağlar (oleik asit) içerir.
      Tüm dünyada moda bir sağlıklı besindir; avokadolu tost, modern kafe kültürünün bir simgesidir.
  fruit.persimmon:
    label: Trabzon hurması
    summary: Domatese benzeyen turuncu bir meyve; tatlı ve buruk.
    info: |
      Trabzon hurması, Çin ve Japonya kökenlidir; kaki olarak da adlandırılır.
      Olgunlaşmamış Trabzon hurması tanen bakımından zengin ve buruktur; olgun hali bal gibi tatlıdır.
      A ve C vitamini ile mineral bakımından zengindir.
      Japonya'da geleneksel bir sonbahar meyvesidir.
  fruit.mulberry:
    label: dut
    summary: Dut ağacının koyu mor bir meyvesi; ipek böceğinin besini.
    info: |
      Dut, dut ağacının meyvesidir; dut ağacının yaprakları ipek böceğinin besinidir.
      Beyaz, kırmızı ve siyah dutlar vardır; siyahı en tatlısıdır.
      Tarihte dut ağacı yetiştiriciliği, ipek üretimi için belirleyiciydi.
      Dutlar resveratrol, C vitamini ve demir bakımından zengindir.
  fruit.cranberry:
    label: turna yemişi
    summary: Küçük, kırmızı, ekşi bir meyve; geleneksel bir Amerikan malzemesi.
    info: |
      Turna yemişi, küçük, ekşi, kırmızı bir meyvedir.
      Amerikan Şükran Günü'nün geleneksel bir parçasıdır (turna yemişi sosu).
      Escherichia coli bakterilerinin idrar yolu duvarlarına tutunmasını engelleyen proantosiyanidinler içerir.
      Turna yemişinin idrar yolu enfeksiyonlarını önlemedeki etkisi bilimsel olarak kanıtlanmıştır.
  fruit.gooseberry:
    label: bektaşi üzümü
    summary: Küçük, yuvarlak, saydam bir meyve; bahçelerin gözdesi.
    info: |
      Bektaşi üzümü, Orta Avrupa bahçelerine özgü küçük bir meyvedir.
      Yeşil, kırmızı ve sarı çeşitleri vardır.
      C vitamini bakımından zengindir.
      Bektaşi üzümü şarabı, tarihsel olarak sevilen bir içecektir.
  fruit.currant:
    label: frenk üzümü
    summary: Salkım halinde küçük, kırmızı, siyah ya da beyaz bir meyve.
    info: |
      Frenk üzümü, salkımlar halinde büyüyen küçük bir meyvedir.
      Siyah frenk üzümü, tüm meyveler arasında en çok C vitamini içerenidir.
      Siyah frenk üzümü, cassis likörünün ve İngiliz içeceği Ribena'nın tadının temelidir.
      Kırmızı frenk üzümü, reçellerde ve tatlı süsü olarak kullanılır.
  fruit.quince:
    label: ayva
    summary: Elmayla akraba, sert, sarı bir meyve; her zaman pişirilerek yenir.
    info: |
      Ayva, elma ve armutla akrabadır; çiğ hali sert ve buruktur.
      Her zaman ısıyla işlenir; ayva jölesi (membrillo), ayva şarabı ya da ayva rakısı yapılır.
      Bol pektin içerir, reçel yapımına uygundur.
      Avrupa'da belgelenmiş en eski marmelat (16. yüzyıl) ayvadan yapılmıştır.
  fruit.jackfruit:
    label: jak meyvesi
    summary: Devasa bir tropik meyve; dünyada bir ağaçta yetişen en büyük meyve.
    info: |
      Jak meyvesi, bir ağaçta yetişen en büyük meyveleri verir; 35 kg'dan fazla olabilirler.
      Tropik Asya kökenlidir ve Hindistan, Bangladeş ve Tayland'da temel bir besindir.
      Olgunlaşmamış jak meyvesi nötr bir dokuya sahiptir ve vejetaryen et alternatifi olarak kullanılır.
      Olgun sarı parçaları tatlı ve aromatiktir.
  fruit.durian:
    label: duryan
    summary: Güçlü kokulu, büyük, dikenli bir tropik meyve; tropik meyvelerin kralı.
    info: |
      Duryana, tropik meyvelerin kralı denir.
      Güçlü kokusu kimileri için itici, kimileri için çekicidir; birçok Asya otelinde yasaktır.
      Özü kremsi ve tatlıdır, badem, vanilya ve peynirden oluşan karmaşık bir tada sahiptir.
      Güneydoğu Asya'da rafine bir lüks olarak değer görür.
  fruit.rambutan:
    label: rambutan
    summary: Liçiye benzeyen, kırmızı, tüylü bir tropik meyve.
    info: |
      Rambutan, Malezya kökenlidir; adı, saç anlamına gelen Malayca rambut sözcüğünden gelir.
      Kırmızı kabuğu yumuşak, kanca biçimli çıkıntılarla kaplıdır.
      Özü, liçininki gibi saydam ve tatlıdır.
      C vitamini ve demir bakımından zengindir.
  fruit.longan:
    label: longan
    summary: Liçiyle akraba, küçük, kahverengi bir tropik meyve.
    info: |
      Longan, Çin kökenli tropik bir ağacın meyvesidir.
      Adı, saydam özü ve siyah çekirdeği nedeniyle ejder gözü anlamına gelen Çince long yan sözcüğünden gelir.
      Tatlı ve aromatik bir tadı vardır.
      Geleneksel Çin tıbbında, kanı ve kalbi güçlendiren bir besin sayılır.
  fruit.tamarind:
    label: demirhindi
    summary: Ekşi özlü kahverengi bir baklagil meyvesi; Tayland mutfağının temeli.
    info: |
      Demirhindi, tropik Afrika kökenlidir; bugün tüm tropiklerde yetiştirilir.
      Özü çok ekşi ve tatlıdır; pad thai'de, Worcestershire sosunda ve Hint çatnisinde kullanılır.
      Sözcük, Hint hurması anlamına gelen Arapça tamr hindi'den gelir.
      Tartarik asit, B grubu vitaminleri ve demir bakımından zengindir.
  fruit.nectarine:
    label: nektarin
    summary: Tüysüz, düz bir şeftali; sulu ve tatlı.
    info: |
      Nektarin, düz kabuklu, şeftalinin doğal bir mutasyonudur.
      Şeftaliden yalnızca kabuk düzlüğü geniyle ayrılır.
      Benzer bir tadı, ancak daha sıkı bir yapısı vardır.
      Adı, tanrıların nektarından gelir ve varsayılan kusursuzluğuna tanıklık eder.
  fruit.damson:
    label: mürdüm eriği
    summary: İngiliz kır bahçelerine özgü küçük, koyu bir erik.
    info: |
      Mürdüm eriği, koyu mavi-siyah renkte küçük bir erik çeşididir.
      Damson adı, meyvenin Avrupa'ya geldiği Şam'dan gelir.
      Çiğ hali çok ekşidir, ancak reçel, komposto ve cinde (damson gin) mükemmeldir.
      İngiliz geleneğinde antik çağdan beri yetiştirilir.
  fruit.medlar:
    label: muşmula
    summary: Elmayla akraba küçük, kahverengi bir meyve; hasattan sonra olgunlaşmalıdır.
    info: |
      Muşmula, Orta Çağ'dan beri yetiştirilen kadim bir bahçe bitkisidir.
      Ancak yumuşadıktan sonra (bekletildikten sonra), yani hasadın ardından olgunlaştıktan sonra yenilebilir.
      Tanen ve C vitamini bakımından zengindir.
      Shakespeare onu Romeo ve Juliet'te anar; bugün daha çok bahçıvanlar için bir meraktır.
  fruit.ackee:
    label: aki
    summary: Yenilebilir sarı arilleri olan kırmızı bir tropik meyve; Jamaika'nın ulusal meyvesi.
    info: |
      Aki, Jamaika'nın ulusal meyvesidir; adını Kaptan Bligh'tan (1793) alır.
      Yalnızca olgun sarı ariller yenilebilir; olgunlaşmamış ya da fazla olgun meyve zehirlidir (hipoglisin A).
      Ackee and saltfish, Jamaika'nın ulusal yemeğidir.
      Batı Afrika kökenlidir ve köle ticareti yoluyla Karayipler'e getirilmiştir.
  fruit.feijoa:
    label: feijoa
    summary: Aromatik özlü, küçük, oval, yeşil bir meyve.
    info: |
      Feijoa, Güney Amerika kökenlidir.
      Özü, ananas, guava ve nane içeren yoğun aromatik bir tada sahiptir.
      Yeni Zelanda'da bir sonbahar meyvesi olarak çok popülerdir.
      Avrupa'da az bilinir, ancak köken ülkelerinde sevilir.
