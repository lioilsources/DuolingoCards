lang: sl
pivot: false
title: Sadje
cards:
  fruit.apple:
    label: jabolko
    summary: Okrogel rdeč ali zelen sadež sladko-kislega okusa.
    info: Jabolko je plod jablane, ene najbolj gojenih kultur na svetu. Vsebuje vitamin C in vlaknine; obstaja več kot 7.500 sort.
  fruit.banana:
    label: banana
    summary: Rumen tropski sadež s sladko sredico.
    info: Banana je plod tropske rastline iz družine banan. Bogata je s kalijem in naravnimi sladkorji, ki dajejo hitro energijo.
  fruit.orange:
    label: pomaranča
    summary: Okrogel citrus z dišečo oranžno lupino.
    info: Pomaranča je citrus, ki izvira iz jugovzhodne Azije, danes pa se goji po vsem svetu. Bogata je z vitaminom C in priljubljena kot sok.
  fruit.strawberry:
    label: jagoda
    summary: Rdeča, sočna jagoda v obliki srca.
    info: Jagoda je priljubljen sadež iz družine rožnic. Bogata je z vitaminom C in antioksidanti, obira pa se poleti.
  fruit.grape:
    label: grozdje
    summary: Majhna okrogla jagoda, ki raste v grozdih.
    info: Vinska trta daje grozdje različnih barv, od zelene do temno vijolične. Grozdje jemo sveže, sušimo v rozine ali stiskamo za vino.
  fruit.watermelon:
    label: lubenica
    summary: Velik sadež z zelenimi progami in rdečo sočno sredico.
    info: Lubenica izvira iz Afrike in je priljubljen poletni sadež. Sestavlja jo 92 % vode in vsebuje likopen, ki ji daje rdečo barvo.
  fruit.mango:
    label: mango
    summary: Tropski sadež s sočno rumeno-oranžno sredico.
    info: Mango imenujejo kralj tropskega sadja. Bogat z vitaminoma A in C, izvira iz južne Azije, kjer ga gojijo že 4.000 let.
  fruit.cherry:
    label: češnja
    summary: Majhen okrogel rdeč koščičar, ki raste v parih.
    info: Češnja je plod sladke češnje, priljubljen poletni sadež. Vsebuje antioksidante in melatonin; obstajajo sladke in kisle sorte.
  fruit.pear:
    label: hruška
    summary: Kapljasti sadež sladkega in blagega okusa.
    info: Hruška je plod hruške, bližnje sorodnice jablane. Ima mehko, sočno sredico in visoko vsebnost vlaknin; obstaja na stotine sort.
  fruit.pineapple:
    label: ananas
    summary: Tropski sadež z bodičasto krono in zlato rumeno sredico.
    info: Ananas izvira iz Južne Amerike, danes pa ga gojijo v tropih po vsem svetu. Vsebuje encim bromelain, ki pomaga prebavi.
  fruit.lemon:
    label: limona
    summary: Rumen in kisel citrus; vir vitamina C in arome.
    info: |
      Limona je kisel citrus, ki izvira iz Azije.
      Bogata je z vitaminom C in citronsko kislino.
      Uporablja se v kuhinji, v pijačah, v kozmetiki in v čistilih.
      Lupina limone vsebuje eterično olje z značilnim vonjem po limoni.
  fruit.lime:
    label: limeta
    summary: Majhen zelen in kisel citrus; ključna sestavina tropske kuhinje.
    info: |
      Limeta je majhen zelen citrus s kislim sokom in aromatično lupino.
      Nepogrešljiva je v mehiški, tajski in vietnamski kuhinji.
      Vsebuje manj vitamina C kot limona, a močnejšo aromo.
      Uživanje limete je mornarje varovalo pred skorbutom zaradi vitamina C.
  fruit.kiwi:
    label: kivi
    summary: Rjav dlakav sadež z zeleno sredico; bogat z vitamini.
    info: |
      Kivi izvira iz Kitajske, kjer ga imenujejo kitajska kosmulja.
      Nova Zelandija ga je komercializirala in preimenovala po svoji nacionalni ptici, kiviju.
      Vsebuje dvakrat več vitamina C kot pomaranča.
      Sredica je živo zelena; obstajajo tudi zlate (rumene) sorte.
  fruit.peach:
    label: breskev
    summary: Žameten rumeno-rožnat koščičar; simbol poletja.
    info: |
      Breskev izvira iz Kitajske, kjer je simbol nesmrtnosti.
      Njena mehka žametna lupina je značilna.
      Obstajajo bele in rumene sorte; nektarina je gladka različica brez dlačic.
      Na Kitajskem so breskve del novega leta in zdravilne mitologije.
  fruit.plum:
    label: sliva
    summary: Vijoličen koščičar; osnova slivovke in slivove marmelade.
    info: |
      Sliva je temeljni sadež srednje Evrope.
      Slivovka (žganje iz sliv) je tradicionalna češka in slovaška žgana pijača.
      Slivova marmelada je značilen izdelek jesenskega pridelka.
      Na svetu obstaja več kot 2.000 sort sliv.
  fruit.apricot:
    label: marelica
    summary: Majhen oranžen koščičar; sladko-kisel in sočen.
    info: |
      Marelica izvira iz srednje Azije.
      Goji se po vsej Evropi; najslajše prihajajo iz Turčije in Španije.
      Bogata je z betakarotenom in vitaminom A.
      Suhe marelice so priljubljen zdrav prigrizek.
  fruit.raspberry:
    label: malina
    summary: Rdeča sestavljena jagoda; simbol poletnega vrta.
    info: |
      Malina je sestavljena jagoda iz mnogih majhnih koščičastih plodičev.
      Raste divje in gojeno; obiranje je poleti in jeseni.
      Bogata je z vitaminoma C in K, manganom in antioksidanti.
      Malinova marmelada in kis sta tradicionalni dobroti.
  fruit.blueberry:
    label: borovnica
    summary: Temno modra jagoda; superživilo, polno antioksidantov.
    info: |
      Borovnica je bogata z antociani, pigmenti z močnimi antioksidativnimi lastnostmi.
      Antociani ji dajejo temno modro barvo.
      Raziskave kažejo na ugoden učinek na kognitivne funkcije in zdravje srca.
      Gojene borovnice so večje od divjih.
  fruit.blackberry:
    label: robida
    summary: Temno vijolična sestavljena jagoda z bodičastega grma.
    info: |
      Robida je temno vijolična sestavljena jagoda, ki raste na bodičastem grmu.
      Divja robida raste na robovih gozdov in v grmovju.
      Vsebuje veliko vitamina C, vitamina K in vlaknin.
      Robidova marmelada, kompot in liker so tradicionalni izdelki.
  fruit.coconut:
    label: kokos
    summary: Velik tropski oreh s trdo lupino in belo sredico.
    info: |
      Kokos je plod kokosove palme; botanično je koščičar, ne oreh.
      Kokosova voda iz nezrelega plodu je naravna izotonična pijača.
      Kokosovo mleko in olje sta osnova kuhinje jugovzhodne Azije in Indije.
      Kokosovo palmo imenujejo drevo tisočerih uporab.
  fruit.papaya:
    label: papaja
    summary: Velik tropski sadež z globoko oranžno sredico.
    info: |
      Papaja izvira iz tropske Amerike.
      Vsebuje encim papain, ki pospešuje prebavo beljakovin.
      Bogata je z vitaminom C, betakarotenom in antioksidanti.
      Nezrela papaja se uporablja kot zelenjava v kuhinji jugovzhodne Azije (v solati som tam).
  fruit.guava:
    label: gvava
    summary: Tropski sadež z močnim vonjem in belo ali rožnato sredico.
    info: |
      Gvava izvira iz tropske Amerike in se je razširila po tropski Aziji in Afriki.
      Vsebuje štirikrat več vitamina C kot pomaranča.
      Lupina in semena so užitna; ves sadež je hranljiv.
      Sok in marmelada iz gvave sta priljubljena izdelka v tropskih državah.
  fruit.pomegranate:
    label: granatno jabolko
    summary: Rdeč sadež s tisoč sladkimi semeni; simbol plodnosti.
    info: |
      Granatno jabolko izvira iz srednje Azije in Sredozemlja.
      Vsebuje več kot 600 semen, obdanih s prosojno rdečo sredico (arili).
      Bogato je z antioksidanti; raziskave preučujejo njegov učinek na srce in vnetja.
      V mnogih kulturah simbolizira plodnost in obilje.
  fruit.fig:
    label: figa
    summary: Hruškast plod figovca; sladek in poln semen.
    info: |
      Figa je eden najstarejših gojenih sadežev; njene sledi segajo 11.000 let nazaj.
      Pravzaprav ni sadež, temveč ovoj, napolnjen s tisoči drobnih cvetov.
      Figovi listi Adama in Eve v svetopisemski zgodbi so listi figovca.
      Suhe fige so odličen vir kalcija, kalija in vlaknin.
  fruit.date:
    label: datelj
    summary: Sladek rjav ovalen plod dateljnove palme; osnovno živilo Bližnjega vzhoda.
    info: |
      Datlji so sladki plodovi dateljnove palme.
      Že tisočletja so osnovno živilo Bližnjega vzhoda.
      Vsebujejo več kot 60 % sladkorja in so izrazit vir energije.
      V islamu datlje tradicionalno pojedo prve ob prekinitvi ramadanskega posta (iftar).
  fruit.melon:
    label: melona
    summary: Velik sladek sadež z oranžno, zeleno ali belo sredico.
    info: |
      Melona je tropski do subtropski sadež z visoko vsebnostjo vode.
      Izvira iz Afrike in Azije; danes se goji po vsem svetu.
      Sestavlja jo več kot 90 % vode in je zelo osvežilna.
      Obstaja na stotine sort, med njimi kantalupa, medena melona in galia.
  fruit.cantaloupe:
    label: melona kantalupa
    summary: Mrežasta melona z globoko oranžno sredico.
    info: |
      Melona kantalupa je priljubljena sorta melone, ki izvira iz Azije.
      Ime izhaja iz papeške rezidence Cantalupo blizu Rima.
      Oranžna sredica je bogata z betakarotenom in vitaminom A.
      Je ena najslajših sort melone.
  fruit.grapefruit:
    label: grenivka
    summary: Velik grenko-sladek citrus; zvezda diet.
    info: |
      Grenivka je križanec med pomarančo in pomelom.
      Opisana je bila na Barbadosu v 18. stoletju.
      Rožnata in rdeča grenivka vsebujeta likopen in betakaroten.
      Sok grenivke deluje z mnogimi zdravili; bolniki naj obvestijo svojega zdravnika.
  fruit.tangerine:
    label: mandarina
    summary: Majhen sladek citrus z ohlapno lupino; simbol božiča.
    info: |
      Mandarina je majhen citrus, ki se zlahka lupi, izvira pa iz Kitajske.
      Je simbol kitajskega novega leta in sreče.
      V mnogih državah je značilen božični sadež.
      Vsebuje vitamin C, antioksidante in flavonoide.
  fruit.passion_fruit:
    label: pasijonka
    summary: Tropski sadež z nagubano lupino in aromatično sredico, polno semen.
    info: |
      Pasijonka izvira iz tropske Južne Amerike.
      Ime izhaja iz misijonarjev, ki so v cvetu videli simbole Kristusovega trpljenja.
      Sredica je polna semen, obdanih z aromatičnim gelom.
      Je odličen vir vitamina C, vlaknin in antioksidantov.
  fruit.lychee:
    label: liči
    summary: Majhen rdeč tropski sadež s prosojno sredico; priljubljen v Aziji.
    info: |
      Liči je tropski sadež, ki izvira iz Kitajske.
      Njegova hrapava rdeča lupina se zlahka olupi in razkrije prosojno belo sredico.
      Ima sladek in fino aromatičen okus.
      Na Kitajskem je simbol sreče in blaginje.
  fruit.dragon_fruit:
    label: zmajev sadež
    summary: Rožnat tropski kaktusov sadež z belo pikčasto sredico.
    info: |
      Zmajev sadež (pitaja) izvira iz Mehike in Srednje Amerike.
      Njegova živo rožnata lupina in bela sredica s črnimi semeni sta zelo okrasni.
      Ima blag okus in vsebuje antioksidante in vitamin C.
      Iz njega delajo sokove, napitke in okrasne sladice.
  fruit.starfruit:
    label: karambola
    summary: Rumen tropski sadež, ki ob rezanju tvori zvezde.
    info: |
      Karambola izvira iz južne in jugovzhodne Azije.
      Prerezana počez tvori popolno zvezdo, od tod angleško ime starfruit.
      Ima sladko-kisel okus in je bogata z vitaminom C.
      Osebe z ledvično boleznijo je ne smejo jesti zaradi oksalatov.
  fruit.avocado:
    label: avokado
    summary: Kremast tropski koščičar; osnova gvakamola.
    info: |
      Avokado izvira iz Mehike in Srednje Amerike.
      Botanično je sadež (koščičar), a se v kuhinji uporablja kot zelenjava.
      Vsebuje zdrave enkrat nenasičene maščobe (oleinsko kislino), tako kot oljčno olje.
      Je modno zdravo živilo po vsem svetu; avokadov toast je ikona sodobne kavarniške kulture.
  fruit.persimmon:
    label: kaki
    summary: Oranžen sadež, podoben paradižniku; sladek in trpek.
    info: |
      Kaki izvira iz Kitajske in Japonske; imenujejo ga tudi japonsko jabolko.
      Nezrel kaki je bogat s tanini in trpek; zrel je sladek kot med.
      Bogat je z vitaminoma A in C ter minerali.
      Na Japonskem je tradicionalen jesenski sadež.
  fruit.mulberry:
    label: murva
    summary: Temno vijolična jagoda murve; hrana sviloprejke.
    info: |
      Murva je plod murve; listi murve so hrana sviloprejke.
      Obstajajo bele, rdeče in črne murve; črna je najslajša.
      V zgodovini je bilo gojenje murve ključno za proizvodnjo svile.
      Murve so bogate z resveratrolom, vitaminom C in železom.
  fruit.cranberry:
    label: brusnica
    summary: Majhna rdeča kisla jagoda; tradicionalna ameriška sestavina.
    info: |
      Brusnica je majhna kisla rdeča jagoda.
      Je tradicionalni del ameriškega zahvalnega dne (omaka iz brusnic).
      Vsebuje proantocianidine, ki preprečujejo, da bi se bakterije Escherichia coli pritrdile na stene sečil.
      Učinek brusnice pri preprečevanju okužb sečil je znanstveno potrjen.
  fruit.gooseberry:
    label: kosmulja
    summary: Majhna okrogla prosojna jagoda; ljubljenka vrtov.
    info: |
      Kosmulja je majhen sadež, značilen za vrtove srednje Evrope.
      Obstaja v zelenih, rdečih in rumenih sortah.
      Bogata je z vitaminom C.
      Vino iz kosmulje je zgodovinsko priljubljena pijača.
  fruit.currant:
    label: ribez
    summary: Majhna rdeča, črna ali bela jagoda v grozdu.
    info: |
      Ribez je majhna jagoda, ki raste v grozdih.
      Črni ribez vsebuje največ vitamina C med vsemi jagodami.
      Črni ribez je osnova okusa likerja kasis in britanske pijače Ribena.
      Rdeči ribez se uporablja v marmeladah in kot okras sladic.
  fruit.quince:
    label: kutina
    summary: Trd rumen sadež, soroden jablani; vedno se je kuhan.
    info: |
      Kutina je sorodna jablani in hruški; surova je trda in trpka.
      Vedno se obdela s toploto v kutinov žele (membrillo), vino ali žganje iz kutin.
      Vsebuje veliko pektina, primernega za izdelavo marmelad.
      Najstarejša v Evropi zabeležena marmelada (16. stoletje) je bila narejena iz kutin.
  fruit.jackfruit:
    label: jackfruit
    summary: Ogromen tropski sadež; največji sadež na svetu, ki raste na drevesu.
    info: |
      Jackfruit daje največje sadeže, ki rastejo na drevesu; tehtajo lahko več kot 35 kg.
      Izvira iz tropske Azije in je osnovno živilo v Indiji, Bangladešu in na Tajskem.
      Nezrel jackfruit ima nevtralno teksturo in se uporablja kot vegetarijanski nadomestek za meso.
      Zreli rumeni kosi so sladki in aromatični.
  fruit.durian:
    label: durian
    summary: Velik bodičast tropski sadež z močnim vonjem; kralj tropskega sadja.
    info: |
      Durian imenujejo kralj tropskega sadja.
      Njegov močan vonj je za nekatere odbijajoč, za druge vabljiv; v mnogih azijskih hotelih je prepovedan.
      Sredica je kremasta in sladka, s kompleksnim okusom mandlja, vanilje in sira.
      V jugovzhodni Aziji ga cenijo kot prefinjeno razkošje.
  fruit.rambutan:
    label: rambutan
    summary: Rdeč dlakav tropski sadež, podoben ličiju.
    info: |
      Rambutan izvira iz Malezije; ime izhaja iz malajske besede rambut, ki pomeni las.
      Njegova rdeča lupina je prekrita z mehkimi kavljastimi izrastki.
      Sredica je prosojna in sladka, tako kot pri ličiju.
      Bogat je z vitaminom C in železom.
  fruit.longan:
    label: longan
    summary: Majhen rjav tropski sadež, soroden ličiju.
    info: |
      Longan je plod tropskega drevesa, ki izvira iz Kitajske.
      Ime izhaja iz kitajske besede long yan, ki pomeni zmajevo oko, zaradi prosojne sredice s črnim semenom.
      Ima sladek in aromatičen okus.
      V tradicionalni kitajski medicini velja za živilo, ki krepi kri in srce.
  fruit.tamarind:
    label: tamarinda
    summary: Rjav strok s kislo sredico; osnova tajske kuhinje.
    info: |
      Tamarinda izvira iz tropske Afrike; danes se goji po vseh tropih.
      Sredica je izrazito kisla in sladka; uporablja se v pad thaiju, v Worcester omaki in v indijskem čatniju.
      Beseda izhaja iz arabskega tamr hindi, kar pomeni indijski datelj.
      Bogata je z vinsko kislino, vitamini skupine B in železom.
  fruit.nectarine:
    label: nektarina
    summary: Gladka breskev brez dlačic; sočna in sladka.
    info: |
      Nektarina je naravna mutacija breskve z gladko lupino.
      Od breskve se razlikuje le po genu za gladkost lupine.
      Ima podoben okus, a čvrstejšo strukturo.
      Ime izhaja iz nektarja bogov in priča o njeni domnevni popolnosti.
  fruit.damson:
    label: damascenska sliva
    summary: Majhna temna sliva, značilna za angleške podeželske vrtove.
    info: |
      Damascenska sliva je majhna sorta slive temno modro-črne barve.
      Ime damson izhaja iz Damaska, od koder je sadež prišel v Evropo.
      Surova je zelo kisla, a odlična v marmeladah, kompotih in ginu (damson gin).
      V angleškem izročilu jo gojijo od antike.
  fruit.medlar:
    label: nešplja
    summary: Majhen rjav sadež, soroden jablani; po obiranju mora dozoreti.
    info: |
      Nešplja je starodavna vrtna rastlina, ki jo gojijo že od srednjega veka.
      Užitna je šele, ko se zmehča (gnitje), torej po dozorevanju po obiranju.
      Bogata je s tanini in vitaminom C.
      Shakespeare jo omenja v Romeu in Juliji; danes je bolj zanimivost za vrtnarje.
  fruit.ackee:
    label: aki
    summary: Rdeč tropski sadež z užitnimi rumenimi arili; nacionalni sadež Jamajke.
    info: |
      Aki je nacionalni sadež Jamajke; poimenovan je po kapitanu Blighu (1793).
      Užitni so le zreli rumeni arili; nezrel ali prezrel sadež je strupen (hipoglicin A).
      Ackee and saltfish je nacionalna jed Jamajke.
      Izvira iz zahodne Afrike in so ga na Karibe pripeljali s trgovino s sužnji.
  fruit.feijoa:
    label: fejhoa
    summary: Majhen ovalen zelen sadež z aromatično sredico.
    info: |
      Fejhoa izvira iz Južne Amerike.
      Njena sredica ima intenziven aromatičen okus ananasa, gvave in mete.
      Zelo priljubljena je na Novi Zelandiji kot jesenski sadež.
      V Evropi je malo znana, a priljubljena v državah izvora.
