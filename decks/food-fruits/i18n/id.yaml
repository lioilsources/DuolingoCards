lang: id
pivot: false
title: Buah-buahan
cards:
  fruit.apple:
    label: apel
    summary: Buah bulat merah atau hijau dengan rasa manis-asam.
    info: Apel adalah buah dari pohon apel, salah satu tanaman yang paling banyak dibudidayakan di dunia. Apel mengandung vitamin C dan serat; ada lebih dari 7.500 varietas.
  fruit.banana:
    label: pisang
    summary: Buah tropis kuning dengan daging yang manis.
    info: Pisang adalah buah tanaman tropis dari suku pisang-pisangan. Pisang kaya akan kalium dan gula alami yang memberi energi cepat.
  fruit.orange:
    label: jeruk
    summary: Buah sitrus bulat dengan kulit oranye yang harum.
    info: Jeruk adalah buah sitrus yang berasal dari Asia Tenggara, kini dibudidayakan di seluruh dunia. Jeruk kaya akan vitamin C dan digemari sebagai jus.
  fruit.strawberry:
    label: stroberi
    summary: Buah beri merah, berair, berbentuk hati.
    info: Stroberi adalah buah yang digemari dari suku mawar-mawaran. Stroberi kaya akan vitamin C dan antioksidan, dan dipanen pada musim panas.
  fruit.grape:
    label: anggur
    summary: Buah beri kecil dan bulat yang tumbuh bergerombol.
    info: Pohon anggur menghasilkan buah anggur dalam berbagai warna, dari hijau hingga ungu tua. Anggur dimakan segar, dikeringkan menjadi kismis, atau diperas untuk anggur.
  fruit.watermelon:
    label: semangka
    summary: Buah besar bergaris hijau dengan daging merah yang berair.
    info: Semangka berasal dari Afrika dan merupakan buah musim panas yang digemari. Semangka terdiri atas 92% air dan mengandung likopen, yang memberinya warna merah.
  fruit.mango:
    label: mangga
    summary: Buah tropis dengan daging kuning-oranye yang berair.
    info: Mangga disebut raja buah tropis. Kaya akan vitamin A dan C, mangga berasal dari Asia Selatan, tempat ia dibudidayakan selama 4.000 tahun.
  fruit.cherry:
    label: ceri
    summary: Buah batu merah kecil dan bulat yang tumbuh berpasangan.
    info: Ceri adalah buah dari pohon ceri manis, buah musim panas yang digemari. Ceri mengandung antioksidan dan melatonin; ada varietas manis dan asam.
  fruit.pear:
    label: pir
    summary: Buah berbentuk tetesan dengan rasa manis dan lembut.
    info: Pir adalah buah dari pohon pir, kerabat dekat apel. Pir memiliki daging yang lembut dan berair serta kandungan serat yang tinggi; ada ratusan varietas.
  fruit.pineapple:
    label: nanas
    summary: Buah tropis dengan mahkota berduri dan daging kuning keemasan.
    info: Nanas berasal dari Amerika Selatan dan kini dibudidayakan di daerah tropis di seluruh dunia. Nanas mengandung enzim bromelain, yang membantu pencernaan.
  fruit.lemon:
    label: lemon
    summary: Buah sitrus kuning dan asam; sumber vitamin C dan aroma.
    info: |
      Lemon adalah buah sitrus asam yang berasal dari Asia.
      Lemon kaya akan vitamin C dan asam sitrat.
      Lemon digunakan dalam masakan, minuman, kosmetik, dan produk pembersih.
      Kulit lemon mengandung minyak atsiri dengan aroma lemon yang khas.
  fruit.lime:
    label: jeruk nipis
    summary: Buah sitrus hijau kecil dan asam; bahan utama masakan tropis.
    info: |
      Jeruk nipis adalah buah sitrus hijau kecil dengan sari yang asam dan kulit yang harum.
      Jeruk nipis tak tergantikan dalam masakan Meksiko, Thailand, dan Vietnam.
      Jeruk nipis mengandung lebih sedikit vitamin C daripada lemon, tetapi aromanya lebih kuat.
      Memakan jeruk nipis melindungi para pelaut dari penyakit kudis berkat vitamin C.
  fruit.kiwi:
    label: kiwi
    summary: Buah cokelat berbulu dengan daging hijau; kaya akan vitamin.
    info: |
      Kiwi berasal dari Tiongkok, tempat ia disebut gooseberry Tiongkok.
      Selandia Baru mengomersialkannya dan menamainya ulang dari burung nasionalnya, kiwi.
      Kiwi mengandung dua kali lebih banyak vitamin C daripada jeruk.
      Dagingnya hijau cerah; ada juga varietas emas (kuning).
  fruit.peach:
    label: persik
    summary: Buah batu kuning-merah muda yang berbulu halus; lambang musim panas.
    info: |
      Persik berasal dari Tiongkok, tempat ia menjadi lambang keabadian.
      Kulitnya yang lembut dan berbulu halus adalah cirinya.
      Ada varietas putih dan kuning; nektarin adalah varietas halus tanpa bulu.
      Di Tiongkok, persik menjadi bagian dari Tahun Baru dan mitologi penyembuhan.
  fruit.plum:
    label: prem
    summary: Buah batu ungu; dasar arak prem dan selai prem.
    info: |
      Prem adalah buah pokok Eropa Tengah.
      Slivovitz (arak prem) adalah minuman keras tradisional Ceko dan Slovakia.
      Selai prem adalah produk khas panen musim gugur.
      Di dunia terdapat lebih dari 2.000 varietas prem.
  fruit.apricot:
    label: aprikot
    summary: Buah batu oranye kecil; manis-asam dan berair.
    info: |
      Aprikot berasal dari Asia Tengah.
      Aprikot dibudidayakan di seluruh Eropa; yang paling manis berasal dari Turki dan Spanyol.
      Aprikot kaya akan betakaroten dan vitamin A.
      Aprikot kering adalah camilan sehat yang digemari.
  fruit.raspberry:
    label: rasberi
    summary: Buah beri majemuk merah; lambang kebun musim panas.
    info: |
      Rasberi adalah buah beri majemuk yang terdiri atas banyak buah batu kecil.
      Rasberi tumbuh liar dan dibudidayakan; panennya pada musim panas dan gugur.
      Rasberi kaya akan vitamin C dan K, mangan, dan antioksidan.
      Selai dan cuka rasberi adalah kelezatan tradisional.
  fruit.blueberry:
    label: bluberi
    summary: Buah beri biru tua; makanan super penuh antioksidan.
    info: |
      Bluberi kaya akan antosianin, pigmen dengan sifat antioksidan yang kuat.
      Antosianin memberinya warna biru tua.
      Penelitian menunjukkan efek positif pada fungsi kognitif dan kesehatan jantung.
      Bluberi budidaya lebih besar daripada bluberi liar.
  fruit.blackberry:
    label: blackberry
    summary: Buah beri majemuk ungu tua dari semak berduri.
    info: |
      Blackberry adalah buah beri majemuk ungu tua yang tumbuh di semak berduri.
      Blackberry liar tumbuh di tepi hutan dan di semak-semak.
      Blackberry mengandung banyak vitamin C, vitamin K, dan serat.
      Selai, kolak, dan minuman keras blackberry adalah produk tradisional.
  fruit.coconut:
    label: kelapa
    summary: Buah tropis besar dengan tempurung keras dan daging putih.
    info: |
      Kelapa adalah buah pohon kelapa; secara botani ia buah batu, bukan kacang.
      Air kelapa dari buah muda adalah minuman isotonik alami.
      Santan dan minyak kelapa adalah dasar masakan Asia Tenggara dan India.
      Pohon kelapa disebut pohon seribu guna.
  fruit.papaya:
    label: pepaya
    summary: Buah tropis besar dengan daging oranye pekat.
    info: |
      Pepaya berasal dari Amerika tropis.
      Pepaya mengandung enzim papain, yang membantu pencernaan protein.
      Pepaya kaya akan vitamin C, betakaroten, dan antioksidan.
      Pepaya muda digunakan sebagai sayur dalam masakan Asia Tenggara (dalam salad som tam).
  fruit.guava:
    label: jambu biji
    summary: Buah tropis beraroma kuat dengan daging putih atau merah muda.
    info: |
      Jambu biji berasal dari Amerika tropis dan telah menyebar ke Asia dan Afrika tropis.
      Jambu biji mengandung vitamin C empat kali lebih banyak daripada jeruk.
      Kulit dan bijinya dapat dimakan; seluruh buahnya bergizi.
      Jus dan selai jambu biji adalah produk populer di negara-negara tropis.
  fruit.pomegranate:
    label: delima
    summary: Buah merah dengan seribu biji manis; lambang kesuburan.
    info: |
      Delima berasal dari Asia Tengah dan Mediterania.
      Delima mengandung lebih dari 600 biji yang terbungkus daging merah tembus pandang (aril).
      Delima kaya akan antioksidan; penelitian menyelidiki pengaruhnya terhadap jantung dan peradangan.
      Delima melambangkan kesuburan dan kelimpahan di banyak budaya.
  fruit.fig:
    label: buah ara
    summary: Buah berbentuk pir dari pohon ara; manis dan penuh biji.
    info: |
      Buah ara adalah salah satu buah budidaya tertua; jejaknya menjangkau 11.000 tahun silam.
      Sebenarnya ia bukan buah, melainkan selubung yang berisi ribuan bunga kecil.
      Daun ara Adam dan Hawa dalam kisah Alkitab adalah daun pohon ara.
      Buah ara kering adalah sumber kalsium, kalium, dan serat yang sangat baik.
  fruit.date:
    label: kurma
    summary: Buah lonjong cokelat yang manis dari pohon kurma; makanan pokok Timur Tengah.
    info: |
      Kurma adalah buah manis dari pohon kurma.
      Selama ribuan tahun kurma menjadi makanan pokok Timur Tengah.
      Kurma mengandung lebih dari 60% gula dan merupakan sumber energi yang menonjol.
      Dalam Islam, kurma secara tradisional dimakan pertama saat berbuka puasa Ramadan (iftar).
  fruit.melon:
    label: melon
    summary: Buah besar dan manis dengan daging oranye, hijau, atau putih.
    info: |
      Melon adalah buah tropis hingga subtropis dengan kandungan air yang tinggi.
      Melon berasal dari Afrika dan Asia; kini dibudidayakan di seluruh dunia.
      Melon terdiri atas lebih dari 90% air dan sangat menyegarkan.
      Ada ratusan varietas, di antaranya kantalup, melon madu, dan galia.
  fruit.cantaloupe:
    label: melon kantalup
    summary: Melon berjala dengan daging oranye pekat.
    info: |
      Melon kantalup adalah varietas melon yang digemari, berasal dari Asia.
      Namanya berasal dari kediaman kepausan Cantalupo dekat Roma.
      Daging oranyenya kaya akan betakaroten dan vitamin A.
      Ia salah satu varietas melon yang paling manis.
  fruit.grapefruit:
    label: grapefruit
    summary: Buah sitrus besar yang manis-pahit; bintang diet.
    info: |
      Grapefruit adalah persilangan antara jeruk dan pomelo.
      Grapefruit dideskripsikan di Barbados pada abad ke-18.
      Grapefruit merah muda dan merah mengandung likopen dan betakaroten.
      Jus grapefruit berinteraksi dengan banyak obat; pasien sebaiknya memberi tahu dokternya.
  fruit.tangerine:
    label: jeruk keprok
    summary: Buah sitrus manis kecil dengan kulit yang mudah dikupas; lambang Natal.
    info: |
      Jeruk keprok adalah buah sitrus kecil yang mudah dikupas, berasal dari Tiongkok.
      Ia lambang Tahun Baru Imlek dan keberuntungan.
      Di banyak negara, jeruk keprok adalah buah khas Natal.
      Jeruk keprok mengandung vitamin C, antioksidan, dan flavonoid.
  fruit.passion_fruit:
    label: markisa
    summary: Buah tropis dengan kulit berkerut dan daging aromatik penuh biji.
    info: |
      Markisa berasal dari Amerika Selatan tropis.
      Namanya berasal dari para misionaris yang melihat lambang sengsara Kristus pada bunganya.
      Dagingnya penuh biji yang terbungkus gel aromatik.
      Markisa adalah sumber vitamin C, serat, dan antioksidan yang sangat baik.
  fruit.lychee:
    label: leci
    summary: Buah tropis merah kecil dengan daging tembus pandang; digemari di Asia.
    info: |
      Leci adalah buah tropis yang berasal dari Tiongkok.
      Kulit merahnya yang kasar mudah dikupas dan menampakkan daging putih tembus pandang.
      Leci memiliki rasa manis dan aroma yang halus.
      Di Tiongkok, leci adalah lambang keberuntungan dan kemakmuran.
  fruit.dragon_fruit:
    label: buah naga
    summary: Buah kaktus tropis merah muda dengan daging putih berbintik.
    info: |
      Buah naga (pitaya) berasal dari Meksiko dan Amerika Tengah.
      Kulit merah muda cerah dan daging putih berbiji hitamnya sangat dekoratif.
      Rasanya lembut dan mengandung antioksidan serta vitamin C.
      Dari buah naga dibuat jus, smoothie, dan hidangan penutup dekoratif.
  fruit.starfruit:
    label: belimbing
    summary: Buah tropis kuning yang membentuk bintang saat dipotong.
    info: |
      Belimbing berasal dari Asia Selatan dan Tenggara.
      Dipotong melintang, belimbing membentuk bintang yang sempurna; dari sinilah nama Inggrisnya starfruit.
      Belimbing memiliki rasa manis-asam dan kaya akan vitamin C.
      Penderita penyakit ginjal tidak boleh memakannya karena kandungan oksalatnya.
  fruit.avocado:
    label: alpukat
    summary: Buah batu tropis yang lembut; dasar guacamole.
    info: |
      Alpukat berasal dari Meksiko dan Amerika Tengah.
      Secara botani ia buah (buah batu), tetapi dalam masakan digunakan sebagai sayur.
      Alpukat mengandung lemak tak jenuh tunggal yang sehat (asam oleat), seperti minyak zaitun.
      Alpukat adalah makanan sehat yang sedang tren di seluruh dunia; roti panggang alpukat adalah ikon budaya kafe modern.
  fruit.persimmon:
    label: kesemek
    summary: Buah oranye mirip tomat; manis dan sepat.
    info: |
      Kesemek berasal dari Tiongkok dan Jepang; disebut juga kaki.
      Kesemek muda kaya akan tanin dan sepat; yang matang manis seperti madu.
      Kesemek kaya akan vitamin A dan C serta mineral.
      Di Jepang, kesemek adalah buah musim gugur tradisional.
  fruit.mulberry:
    label: murbei
    summary: Buah beri ungu tua dari pohon murbei; makanan ulat sutra.
    info: |
      Murbei adalah buah dari pohon murbei; daun pohon murbei adalah makanan ulat sutra.
      Ada murbei putih, merah, dan hitam; yang hitam paling manis.
      Dalam sejarah, budi daya murbei menjadi kunci bagi produksi sutra.
      Murbei kaya akan resveratrol, vitamin C, dan zat besi.
  fruit.cranberry:
    label: cranberry
    summary: Buah beri merah kecil dan asam; bahan tradisional Amerika.
    info: |
      Cranberry adalah buah beri merah kecil yang asam.
      Cranberry adalah bagian tradisional Hari Pengucapan Syukur Amerika (saus cranberry).
      Cranberry mengandung proantosianidin, yang mencegah bakteri Escherichia coli menempel pada dinding saluran kemih.
      Efek cranberry dalam mencegah infeksi saluran kemih telah terbukti secara ilmiah.
  fruit.gooseberry:
    label: gooseberry
    summary: Buah beri kecil, bulat, dan tembus pandang; favorit kebun.
    info: |
      Gooseberry adalah buah kecil yang khas di kebun-kebun Eropa Tengah.
      Ada varietas hijau, merah, dan kuning.
      Gooseberry kaya akan vitamin C.
      Anggur gooseberry adalah minuman yang digemari secara historis.
  fruit.currant:
    label: currant
    summary: Buah beri merah, hitam, atau putih kecil dalam tandan.
    info: |
      Currant adalah buah beri kecil yang tumbuh dalam tandan.
      Currant hitam mengandung vitamin C paling banyak di antara semua buah beri.
      Currant hitam adalah dasar cita rasa minuman keras cassis dan minuman Inggris Ribena.
      Currant merah digunakan dalam selai dan sebagai hiasan hidangan penutup.
  fruit.quince:
    label: kuins
    summary: Buah kuning keras yang berkerabat dengan apel; selalu dimakan setelah dimasak.
    info: |
      Kuins berkerabat dengan apel dan pir; dalam keadaan mentah ia keras dan sepat.
      Kuins selalu diolah dengan panas menjadi jeli kuins (membrillo), anggur, atau arak kuins.
      Kuins mengandung banyak pektin, cocok untuk membuat selai.
      Selai tertua yang tercatat di Eropa (abad ke-16) dibuat dari kuins.
  fruit.jackfruit:
    label: nangka
    summary: Buah tropis raksasa; buah terbesar di dunia yang tumbuh di pohon.
    info: |
      Nangka menghasilkan buah terbesar yang tumbuh di pohon; beratnya bisa lebih dari 35 kg.
      Nangka berasal dari Asia tropis dan merupakan makanan pokok di India, Bangladesh, dan Thailand.
      Nangka muda memiliki tekstur netral dan digunakan sebagai pengganti daging bagi vegetarian.
      Bagian kuning yang matang terasa manis dan aromatik.
  fruit.durian:
    label: durian
    summary: Buah tropis besar dan berduri dengan bau kuat; raja buah tropis.
    info: |
      Durian disebut raja buah tropis.
      Baunya yang kuat menjijikkan bagi sebagian orang dan menggoda bagi yang lain; di banyak hotel Asia durian dilarang.
      Dagingnya lembut dan manis, dengan rasa kompleks berupa badam, vanila, dan keju.
      Di Asia Tenggara, durian dihargai sebagai kemewahan yang halus.
  fruit.rambutan:
    label: rambutan
    summary: Buah tropis merah dan berbulu, mirip dengan leci.
    info: |
      Rambutan berasal dari Malaysia; namanya berasal dari kata Melayu rambut, yang berarti rambut.
      Kulit merahnya tertutup tonjolan lunak berbentuk kait.
      Dagingnya tembus pandang dan manis, seperti leci.
      Rambutan kaya akan vitamin C dan zat besi.
  fruit.longan:
    label: kelengkeng
    summary: Buah tropis cokelat kecil, berkerabat dengan leci.
    info: |
      Kelengkeng adalah buah pohon tropis yang berasal dari Tiongkok.
      Namanya berasal dari kata Tionghoa long yan, yang berarti mata naga, karena dagingnya tembus pandang dengan biji hitam.
      Kelengkeng memiliki rasa manis dan aromatik.
      Dalam pengobatan tradisional Tiongkok, kelengkeng dianggap makanan yang menguatkan darah dan jantung.
  fruit.tamarind:
    label: asam jawa
    summary: Polong cokelat dengan daging asam; dasar masakan Thailand.
    info: |
      Asam jawa berasal dari Afrika tropis; kini dibudidayakan di seluruh daerah tropis.
      Dagingnya sangat asam dan manis; digunakan dalam pad thai, saus Worcestershire, dan chutney India.
      Kata itu berasal dari bahasa Arab tamr hindi, yang berarti kurma India.
      Asam jawa kaya akan asam tartarat, vitamin B, dan zat besi.
  fruit.nectarine:
    label: nektarin
    summary: Persik halus tanpa bulu; berair dan manis.
    info: |
      Nektarin adalah mutasi alami persik dengan kulit yang halus.
      Nektarin berbeda dari persik hanya pada gen kehalusan kulit.
      Nektarin memiliki rasa yang serupa, tetapi tekstur yang lebih padat.
      Namanya berasal dari nektar para dewa dan mencerminkan kesempurnaannya yang dianggap.
  fruit.damson:
    label: prem damson
    summary: Prem gelap kecil, khas kebun pedesaan Inggris.
    info: |
      Prem damson adalah varietas prem kecil berwarna biru-hitam gelap.
      Nama damson berasal dari Damaskus, tempat buah ini datang ke Eropa.
      Dalam keadaan mentah ia sangat asam, tetapi sangat baik dalam selai, kolak, dan gin (damson gin).
      Dalam tradisi Inggris, prem damson telah dibudidayakan sejak zaman kuno.
  fruit.medlar:
    label: medlar
    summary: Buah cokelat kecil yang berkerabat dengan apel; harus matang setelah dipanen.
    info: |
      Medlar adalah tanaman kebun kuno yang telah dibudidayakan sejak Abad Pertengahan.
      Medlar baru dapat dimakan setelah melunak (bletting), yaitu setelah matang usai dipanen.
      Medlar kaya akan tanin dan vitamin C.
      Shakespeare menyebutnya dalam Romeo dan Juliet; kini ia lebih merupakan keunikan bagi para pekebun.
  fruit.ackee:
    label: aki
    summary: Buah tropis merah dengan aril kuning yang dapat dimakan; buah nasional Jamaika.
    info: |
      Aki adalah buah nasional Jamaika; ia dinamai dari Kapten Bligh (1793).
      Hanya aril kuning yang matang dapat dimakan; buah mentah atau terlalu matang beracun (hipoglisin A).
      Ackee and saltfish adalah hidangan nasional Jamaika.
      Aki berasal dari Afrika Barat dan dibawa ke Karibia melalui perdagangan budak.
  fruit.feijoa:
    label: feijoa
    summary: Buah hijau lonjong kecil dengan daging yang aromatik.
    info: |
      Feijoa berasal dari Amerika Selatan.
      Dagingnya memiliki rasa aromatik yang kuat berupa nanas, jambu biji, dan mint.
      Feijoa sangat populer di Selandia Baru sebagai buah musim gugur.
      Feijoa kurang dikenal di Eropa, tetapi digemari di negara-negara asalnya.
