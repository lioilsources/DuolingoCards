lang: la
pivot: false
title: Fructus
cards:
  fruit.apple:
    label: malum
    summary: Fructus rotundus ruber vel viridis ex arbore malorum dulci-acidulo sapore.
    info: Malum est fructus arboris Malus domestica, una de culturis pomacearum frequentissimae mundo. Continet vitamin C et fibras; sunt superiores septem milia species.
  fruit.banana:
    label: banana
    summary: Fluctus dulcis fructus ex regione torrida.
    info: Banana est fructus plantae tropicalis familiae Musacearum. Est satur cum kalio et saccariis naturalibus qui praebent celerem vim.
  fruit.cherry:
    label: pruna
    summary: Parva rotunda rubra fructus lapideus geminus crescens.
    info: Pruna est fructus mali volucris, popularis aestiva pomum. Continet antioxidants et melatonina; sunt varietates dulces et acidae (cerasus).
  fruit.grape:
    label: grape
    summary: Small round berry growing in cluster-like bunches.
    info: The grapevine produces grapes in various colors—from green to dark purple. Grapes can be eaten fresh, dried into raisins, or pressed for wine.
  fruit.mango:
    label: mango
    summary: Tropicus fructus cum carne succulenta citrinoflava.
    info: Mango indicum dicitur rex frugum tropicalium. Est saturum vitaminis A et C atque originem ex Asiâ meridionali habet, ubi iam millesimum quadruplum annorum colitur.
  fruit.orange:
    label: pomelo
    summary: Rotundum fructus citri cum dulci aurantiaco limbo.
    info: Pomelus est fructus citricola ex Asia orientali oriens, nunc cultus per orbem terrarum. Est refertus vitamine C et popularis ut suus.
  fruit.pear:
    label: pyrea
    summary: Fructus lacrimae formam habens dulcis et teneris gustu.
    info: Pyrea est fructus malum communis pyri, propinquum pomorum genere. Tenera pulpa succosa et altus cellulose continet; centinae species exstant.
  fruit.pineapple:
    label: ananass
    summary: Fructus tropicalis cum corona spinosa et carne flava.
    info: Ananas originatur ex America Meridionali et iam colitur in zona tropicali totius orbis terrarum. Continet enzym bromelian, qui ad digestionem auxit.
  fruit.strawberry:
    label: fresa
    summary: Rubor cordifomis et succosa bacca.
    info: Fragara hortensis est fructus popularis ex familia Rosaceae. Est abundans in vitamine C et antioxidantibus; colligitur aestate et dulci odorata est.
  fruit.watermelon:
    label: cucumis aquosus
    summary: Magnus fructus viridi-striatus cum carne rubra succulenta.
    info: Cucumis aquosus ex Africa originatur et est fructus aestivalis popularis. Causa aquae constituit eam 92% et continet lycopenum quod ei colorem rubeum dat.
