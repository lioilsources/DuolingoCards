lang: cs
pivot: true
title: Ovoce
cards:
  fruit.apple:
    label: jablko
    summary: Kulaté červené nebo zelené ovoce sladce nakyslé chuti.
    info: Jablko je plod jabloně domácí, jedna z nejpěstovanějších plodin na světě. Obsahuje vitamín C a vlákninu; existuje přes 7 500 odrůd.
  fruit.banana:
    label: banán
    summary: Žlutý tropický plod se sladkou dužinou.
    info: Banán je plod tropické rostliny z čeledi banánovitých. Je bohatý na draslík a přirozenou cukry, které dodávají rychlou energii.
  fruit.orange:
    label: pomeranč
    summary: Kulatý citrusový plod s voňavou oranžovou slupkou.
    info: Pomeranč je citrusový plod původem z jihovýchodní Asie, dnes pěstovaný po celém světě. Je bohatý na vitamín C a oblíbený jako džus.
  fruit.strawberry:
    label: jahoda
    summary: Červená šťavnatá bobule ve tvaru srdíčka.
    info: Jahoda zahradní je oblíbené ovoce ze čeledi růžovitých. Bohatá na vitamín C a antioxidanty; sklízí se v létě a je sladce voňavá.
  fruit.grape:
    label: hrozno
    summary: Malá kulatá bobule rostoucí v hroznovitých shlucích.
    info: Vinná réva produkuje hrozny v různých barvách – od zelené po tmavě fialovou. Hrozny se jedí čerstvé, suší na rozinky nebo lisují na víno.
  fruit.watermelon:
    label: meloun vodní
    summary: Velký zeleno-pruhovaný plod s červenou šťavnatou dužinou.
    info: Vodní meloun pochází z Afriky a je oblíbeným letním ovocem. Tvoří ho z 92 % voda a obsahuje lykopen, který mu dává červenou barvu.
  fruit.mango:
    label: mango
    summary: Tropický plod se žlutooranžovou šťavnatou dužinou.
    info: Mango indické je tzv. „král tropického ovoce". Je bohaté na vitamín A a C a pochází z jižní Asie, kde se pěstuje již 4 000 let.
  fruit.cherry:
    label: třešeň
    summary: Malá kulatá červená peckovice rostoucí ve dvojicích.
    info: Třešeň je plod třešně ptačí, oblíbené letní ovoce. Obsahuje antioxidanty a melatonin; existují sladké i kyselé (višňové) odrůdy.
  fruit.pear:
    label: hruška
    summary: Ovoce ve tvaru slzy se sladkou jemnou chutí.
    info: Hruška je plod hrušně obecné, blízce příbuzné jabloní. Má jemnou, šťavnatou dužinu a vysoký obsah vlákniny; existují stovky odrůd.
  fruit.pineapple:
    label: ananas
    summary: Tropický plod s trnitou korunkou a zlatavou dužinou.
    info: Ananas pochází z Jižní Ameriky a je nyní pěstován v tropickém pásu celého světa. Obsahuje enzym bromelain, který pomáhá trávení.
