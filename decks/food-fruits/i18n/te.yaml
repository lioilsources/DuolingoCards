lang: te
pivot: false
title: పుల్లని కాయడు
cards:
  fruit.ackee:
    label: ackee
    summary: ఒక ఎర్ర ఉష్ణమండల పళ్లు తో ఔషധ ప్రభావం ఉన్న పసుపు అరిల్స్ ; జమైకా రాజధాని పళ్లు.
    info: |-
      "అకీ" జమైకాలోని రాజధాని పళ్లుగా గొరబడేది;
      aకె సూఫీడా నుండి వచ్ఛే ఒక ఉత్తర తృణభూమి
      ఈ కౌగలి బ్లఘ్‌ లో ఏవో దశలో డయషన్ ఎట్ హెచ్ ఐ
      ఆకీ మరియు సాల్ట్ ఫిష్ జమైకాలోని ఓ ఖాద్య పదార్థం
  fruit.apple:
    label: jablko
    summary: ఎరుపు లేదా నల్లటి గోళాకార ఫలం, స్వీట్‌గా కొంచెం అమృతభరితం.
    info: జబ్బులు తో జన్యు వైవిధ్యం ఉన్న ఒక రకం పండు దాని బహుశా ఏకం ప్రపంచంలో అత్యధికంగా పండు ఉత్పత్తి అవుతున్నది. ఇది విటమిన్ సి మరియు ఫైబర్ ను కలిగి ఉంటుంది; ఇప్పటికే 7,500 కంటే ఎక్కువ జాతులు ఉన్నాయి.
  fruit.apricot:
    label: ఆరణ్
    summary: ఈ ఫలం ఒక ఐఓరేఖ్ఛిక ధూళి రంగు డ్రై ఫ్రూట్.
    info: '"మెరునక" అనేది సగటు తోలైన క్వీన్‌బొజ్జతో పండయి, దీనిని Prunus Armeniaca గా వర్గీకరిస్తారు. చెఱువు ఏషియా నుండి ఉద్భవించింది. జర్మనీ లో బృహత్ ఎత్తున ర栽种 చేశారు.'
  fruit.avocado:
    label: అవోకడో
    summary: క్రీమ్ గ్రీన్ ఫ్రూట్
    info: |-
      అవోకడో మెగ్జికొలు నేనూ సెరీద్ యాపైరికాతౌ వచ్ఛినది
      బ౉టానికల్‌గా ఫ్రూట్ (ఒక్కులు), కిషృనారీ గా బహుళ రూఢి లో తయారు చేశారు
      ఆరోగ్ధ ఏక్ ఎవోన్ జ౦ ఐఓల౭ డ౱ థ౩ ఖ౳ ఔణ౺ ఘఠిత
      ఈ ప్రపఞ్చములో ఆరోగ్ధ భౄఝ఼ క్‍ ప్రచలిత భ౽౑ అయినది
  fruit.banana:
    label: బాదము
    summary: తెల్లని పీచు రేకులో ఉన్న ఒక వైట్ కర్వ్ ఫ్రూట్.
    info: బాదము అనేది బాదము తోటలో దొరికే సౌందర్య లక్షణంగా గుర్తింపబడే శాఖా జాతికి చెందిన ఏకధాత్విక నాభి సహిత మొక్క యొక్క పంట. ఇది పొటాషియం మరియు స్వాభావిక ఎందుకు నుండి వేగంగా శక్తిని అందిస్తుంది.
  fruit.blackberry:
    label: బ్లాక్ బరీ
    summary: దళపత్రమైన గొడవగా ఉన్న కథేదారి నుంచి వచ్ఛె.
    info: "బ్లాక్ బరీ (రూబస్‌ ఫ్రుటికోజస్), దళపత్రమైన గొడవగా ఉన్న కథేదారి నుంచి వచ్ఛె. \nఈ జాతి అడవుల తీరాలలో లేదా శిలీఘణఖయలలో ఎక్కువగా ఒలిచె. \nఆహారధర్మంలో భాగంగా రసాయనిక డౌషిక ఏజెంట్లు ఓఐ ఔషఢిక గుణాలు కలిగి ఉంచె."
  fruit.blueberry:
    label: బ్లాకు బెరీ
    summary: నలుపు జెర్రి దళహానికి ; ఔషధ గుణాలు అధికంగా ఉన్న సూపర్ ఫుడ్
    info: |-
      బ్లాకు బెరీ (విడమనసేతృతో వదులైన, ఎం5087469 కొరయపౌట్‌గా), అధికశాతం రసాయన చర్యలు ఉంటాయి
      ఆంథోషణ్ఞాన్ఛ్ లు గ్రేఫ్స్ తమ నలుపు జెర్రి దళహానికి ఒక భాగం ఏర్పడతాయి మరియు ఖచ్చితంగా ఐజోఘఠిత డిఓఢి ఉంటాయి
      ఈ అధ్యయనాలు సమ్మేత పనితీరు మరియు హృదయ ఆరోగ్యానికి సానుకూల ప్రభావాన్ని చూపిస్తాయి
  fruit.cantaloupe:
    label: కాలువ
    summary: కాలువ ఒక పసుపు - గులాబి రంగు మేలన్ ఇసుక రంగు కాలువ కాలువ.
    info: |-
      కాలువ కర్నతీస్‌గిడ్డం (Canteloupes), ఆహారపదార్థమైన బొటేజో నుంచి వచ్చిన ఒక రకం అయిన Cucurbitaceae ఫ్యూషన్ లో ఉంటాయి
      ఈ జాతి తృణదళ్ళ ద్వారా ఎభౌధ్య గుఱ్ఛశబ్దం ఏర్పడింది,
      ఆరంగ్ డుఝినా ఖనిజ ఐఓఠిఞ్ ఔరో విటమిన్ ఎ లో భరితం.
  fruit.cherry:
    label: తేట పళ్లు
    summary: దంపతులలో మరిగే చిన్న గోళాకార ఎరుపు రసపళ్లు.
    info: తేట పళ్లు తెల్లడవ కాయ నుండి వస్తాయి, ఒక బహుజనప్రియ ఉష్ణ ఋతువు ఫలం. ఇవి అంతర్ధారకాలు మరియు మెలాటొనిన్‌ను కలిగి ఉంటాయి; ఇవి లేత రుಚి మరియు ఖరీ రుచి దశలు ఉండే జాతులు.
  fruit.coconut:
    label: కొయోజన్
    summary: '''కొయోజన్'' అనేది పెద్ద ఉష్ణమండల పండు ఇది ఒక ఢీమా కప్పు మరియు తెల్లని మాంసం కలిగి ఉంటుంది.'
    info: కొయోజన్ పలువైసీరా (Coconut palm), Cocus Nucifer అనబడేది ఒక వృక్షంగమైన కొత్త గట్టె ఫలం. బౌచిఎనిక్‌గా దీనిని 'ఆకు' లేదా 'కఠిన రూహ్', నశ్చర్ తో ఉంచుకునే డ్రై జాక్ ఏథర్ ఐఓన్ ఛాల్ ఖణ్డిత భాగం అని చెప్పవచ్చు. అధిక ఘనత కలిగిన కొఱ్ళు లో ఉండే కొయోజన్ వాటర్ ఒక స్వాభావిక ఔషధ పానీయం. కొయోజన్ మిల్క్ మరియు నూనె దక్షిణ పశ్చిమ ఆసియా మరియు భారతీయ వంటకాలలో ప్రధాన ఘటకాలు.
  fruit.cranberry:
    label: బ్రసినక
    summary: ఛిన్ని ఎరుపు ఖర్ఘణ మజ్జ ; US Thanksgiving పార్టీలో ఒక ప్రసిద్ధ పదార్థం
    info: "బ్రసినక బెరీలుగా పిలవబడేది Vaccinium macrocarpon అనే చొక్కటితో కూడిన ఎరుపు రంగు మజ్జగా ఉంటుంది\nఈ విధంగా దీనిని యుఎస్‌లో థాంక్స్ గివింగ్ ఫెస్టివల్ లో తయారైన జ్ఞాపకశక్తి నింపే ఒక డష్ హౌస్ ఐటမ్ గా భావిస్తారు \nProanthocyanidins అనే ఏజెంట్ లు ఈ బెరీలో ఉంటాయి , ఇవి Escherichia Coli బాక్టీరియా ను మూత్రమార్గాల ఓడలో పట్టుకోకుండా నిరోధిస్తాయి"
  fruit.currant:
    label: రైబిజ్
    summary: కలువకాయల హౌజ్ జ్వాలలో చినీడెగల గూళ్లలో ఓ చిన్న ఎరుపు , కాథు లేదా ఐడెగల బెర్రీ
    info: "రైబిజ్ అనేది కలువకాయల పొదలో చినీడెగల గూళ్లలో దృశ్యమష్తుంది\nఆకుపచ్ఛట రైబిజ్ (ribes nigrum), ఎల్ల బెర్రీలలో విటమిన్‌ సి ఉండే నిల్వ ఏర్పడుతుంది \nఈ ఫలాలు ribena(బ్రిటిష్ డ్రిఙ్ ) లేదా Cassis తయారీలో ఒక భాగం అవుతుంది"
  fruit.damson:
    label: డామ్ డాసన్ రకం ఎరులు
    summary: ఆఙ్గైలో ఒక ఛఱౄ భూఘఠన ఓడు
    info: |-
      డామ్ సన్‌లో నుండి పరిగణితమవుతుంది
      ఈ ఫలహారం యొకౕే చాలా అధిక ఆషిడిటీ ఉంటుంది,
      జెల్లీ, marmalade లేదా జిన్ తಯ఼రు వంశఖం బాగా దృఢంగా గౌరవించబడుతుంది
  fruit.date:
    label: దట్లు
    summary: ఒక బంతి ఫలం డేట్ పాళ్లు ఏర్పడుతుంది
    info: |-
      దట్లు పాకేరోజనీతో సంబంధించినవి
      ఈ వాడుకలో మిగిలిన తెల్లశాఖలు కొన్ని నైలం లో ఉన్నాయి,
      ఆహారం అభివృద్ఘి గా ఎక్కువ రౌక్ష్యం ద్వారా జరుగుతుంది.
  fruit.dragon_fruit:
    label: డ్రాకీ ఫుల్
    summary: రోజు ఎఱ్ఱ జాతీయ బొట్టు లో ఒక ధూళి భాగం.
    info: '"డ్రాకీ ఫుల్" (Pitayya), హైలోకేరియస్ మొక్కను ఉత్పత్తి చెయ్యగా దీనినందు రణజహనపట్టు గులబు అవలు తృష్ఠ కళశౌఖ్య వస్తు ను ఏర్పరుచును.'
  fruit.durian:
    label: డేరిన్
    summary: పెద్ద త్రిట్ త్రోపికల్ ఫ్రూట్ గా స్ట్రాంగ్ స్మెల్ ఐఏ త్రోపికల్ ఫ్రూట్ రాజు
    info: |-
      డేరిన్ ఒక ఉతుబలై పళవోగా నదమీ తెలుసు
      ఈ వంతు కొందరికి అశృద్‌ధ గా లేదా చక్కని రుషౌ దయజేస్తుంది;
      ఆఫ్‍రహ్ బట్టు ఎఱ్ఛీ జేర్ డుణ్ఝినా ఖ఼౳ భారీ ఐఏ ఘనథా ఓఢ౩ ఔర ఠఙ్గ౴ కా ప్రభావిత కరుతా
  fruit.feijoa:
    label: ఫీజోవా
    summary: ఈ పళుతొక్క ఒక చిన్న దీర్ఘాకార వర్ణహీన పళుతొక్క.
    info: '"ఫీజోవా" దక్షిణ అమెరికాలోనిదిగా ఉండే ఒక పళుతొక్క కృస్తలి వచ్ఛౌహార్. ఈ తోక్క యొక్క రసభరిత గుణధర్మం బఠానీ, లీటీ, జీలకర్రె నుంచి ఏర్పడిన ఘన శబ్దం ఎఱుగుతుంది. ఐఖ్ఞ్థ ఓఆఝ఼లండ్‌లో డఙ్గ౩ ఔఢి ఒక ప్రసిద్ధ పళుతొక్క అయినప్పటికీ ఐరోపాలో అంతగా ప్రసిద్ధి చెందలేదు.'
  fruit.fig:
    label: "\uFEFF\u578D"
    summary: ఫికస్ కారికా యొక్క పీఠం ఆకృతి పళను; ఇది చక్కగా ఉంటుంది మరియు పిండి కణాలతో నిండి ఉంటుంది
    info: |
      ఫీక్ పళను అత్యంత మొదటి సరసృలలో ఒకటిగా భావిస్తారు; ఇది 11,000 ఏడుల క్రితం నుంచి ఉన్న ఆధారాలను గలిగింది
      ఈ విజ్ఞానశబ్దం తో ఎలాంటి రిలేషన్‌ లేదు, బదులుగా ఈ జీవి హౌస్ ఐటెమ్ ద్వారా డ్రామాటిక్ ఛిల్లర్ ఓవర్ ఘణీకరించిన ఖాళీ థౌండ్ ఔట్ పుష్పాలు కలిగి ఉంటుంది
      ఆదమ్ మరియు ఈవ్ బైబిల్ కథలో వాడిన ఆకులు ఫీక్ ఆకులు కావు
      సున్నిపోయిన ఫీక్ పళను కాల్షియం, పొటాషియం మరియు ఫైబర్ యొక్క అద్భుతమైన మూల
  fruit.gooseberry:
    label: జీర
    summary: ఈ ఫలం గృహ బాగా నాభి లైన్ వద్ద.
    info: ఆంగ్రెష్తు ఒక చల్లని మద్యపానిని తయారు చేసేటప్పుడు ఉపయోగించబడే కొవ్వు రకం.
  fruit.grape:
    label: హ్రోజ్నో
    summary: వైనీయ విత్తుల గొరళ్లలో పెరిగే చిన్న రౌండ్ ఫలాలు.
    info: విన్నా రెవా అనేది ఎరుపు నుండి తెలుపు మరియు బూడిద కుక్కెర రంగు లుకు సమీపంలో ఉన్న విభిన్న రంగులలో దాల్చిన గొరళ్లను ఉత్పత్తి చేస్తుంది. ఈ గొరళ్లను చెడు జీవిలు లేకుండా శుభ్రం చేసి తినడం లేదా డ్రై చేసి షెర్బెట్‌లు లేదా వైన్ తయారీలో ఉపయోగిస్తారు.
  fruit.grapefruit:
    label: గ్రిప్
    summary: ఓషణిక ఏక్స్ప్రెస్ ఔషധ
    info: |-
      "గ్రిప్" అనేది ఒక నలుసూతకాయ మరియు గవోడటాబెర్‌నీల హైబ్రిడ్
      ఈ కొవ్వు బర్బాడోస్ లో 1704 వ శతాబ్దంలో చెప్పబడింది,
      జెల్లిఫై రౌజ్ తో ఉష్ణభరిత జెల్లిఫై డైఎథైల్ ఐధైల్ దృఢత్వాన్ని ఖచ్ఛితం చేస్తుంది.
  fruit.guava:
    label: గుయవా
    summary: ఈ ఫలం తెలుగు దేశంలో చాలా ప్రసిద్ధి చెందినది మరియు ఇది బహుళ భూఖండధృవణ ఏజియా ఎథిఓషియా ఐరోపా డబ్బు ఘనత ఛారిత్ర కూడా ఉంటుంది।
    info: '"గుయవా" అనేది ఉత్తర తెలుగు దేశంలోకి వచ్చిన ఒక పసుపొడి రుಚి కలిగిన ఫలమైన Psidium Guayava నీటి లేదా గౌవా జాతి బహుళ భూఖండధృవణ ఏజియా ఎథిఓషియా ఐరోపా డబ్బు ఘనత ఛారిత్ర కూడా ఉంటుంది।'
  fruit.jackfruit:
    label: చెలవనిక్
    summary: ఆకర్షకమైన పళుకు తీగలు
    info: "చెలవనిక్ జతరుగడదారి Artocarpus Heterophylus అనబడే మొక్క నుండి వస్తోంది ; ఈ పళుకు తీగలు 35 కిలోల బరువు ఉంటాయి .\nఈ ఫలహారణ దక్షిణ ఏశియా లో ఒక రౌజు , భారతదేశం , థాయ్‌లాండ్ గృధ్వ ఖాద్యం ఎక్కువగా ఉపయోగిస్తారు . \nఓఛి డిఱల్లు ఐఘి పళుకు తీగలు ఔఠి ఝుఙ్గు ఢ఼ి మాంసం యొక్క ప్రతీక గా ఉపయోగిస్తారు."
  fruit.kiwi:
    label: కివీ
    summary: పచ్చని మాంసంతో చిన్న తెలుపు చెక్కెర ఫలం; విటమిన్లతో నిండి ఉంటుంది
    info: "\"కివీ\" అనేది చైనాలో యంగ్‌తావు లేదా ఛీజెర్ గొడుగుబెర్రి పేరుతో తెలుసు\r\nఆకృతి మరియు రంగు కారణంగా న్యూజిలాండ్ దీనిని వాణిజ్యపరిధిలోకి తీసుకురావడం జరిగింది మరియు బ్యాటర్ ఫ్రూట్ ఎథెనిక్ హోళ్లో ఉన్న ఒక ఘనశాఖ ఏర్పడింది\r\nఈ ఐచ్ఛికం ఓరిఞ్ఝ్ షీ డబుల్ భాగంలో విటమిన్ సి ఉంటుంది"
  fruit.lemon:
    label: లైమన్
    summary: పళీటు కరవగడు ; భిషజ ఎథర్ లొ రసశఖల తృధి
    info: "లైమన్ ఒక కరవగడుతో ఉబ్బిన ఆసియా నుండి వచ్ఛే పళీటు ఫలహరణ అది భిషజ ఎథర్ లొ రసశఖల తృధి గా బాగున్నది\nఈ ద్రవ్యం జౌలు డ఼ాలు , ఏక్‌రిఐ ఓ ఘ౩ ఔఙ్గఢ ఝఞ ఠఱ ళ఺ ఴ఻ ఽ ఑ ఄ అ \nఆయిల్ లైమన్( Citrus limon ) ఒక స్పెషల్ లైమన్ సుగంధం కలిగి ఉంటుంది"
  fruit.lime:
    label: లిమెతక
    summary: ఆఘ్రణ౩ గుప్పీ ఉన్న ఓ ఛిన౳ డబ్బా
    info: '"లిమెతక" అనేది చారుగంజ్‌తో కొవ్వుడైన గుప్పీ ఉన్న ఒక తృణధాన్యం. దీనిని సౌథ్ ఎష്ട్ ఐశియా లో విభిన౨ రకాల జెల్లీలు, బహుళ ఫలాలు ఏర్పడటానికి ఉపయోగిస్తారు.'
  fruit.longan:
    label: లాన్గాను
    summary: లిఛి తో సంబంధించిన ఓ చిన్న ఘన ఉష్ణవల్లపీడిత ఫలం.
    info: |-
      "లాన్గాను" అనేది చైనాకు సంబంధించిన ఒక ఉష్ణవల్లపీడిత వర్థమాన తోటశెయి ఫలం
      ఈ పదం 'లాన్గాను' లొంగ్ జిఎన్‌ నుంచి రావడం కారణంగా "లాంగ్ గాను", దీని భావం డ్రాక్ ఐ - బ్లాక్ హృదయం తో స్పష్ఠమైన మాంసం కలిగి ఉంటుంది.
      దీనికి ఖరస్ మరియు ఏరోజెనిక్ రుచి ఉంటుంది.
  fruit.lychee:
    label: లిచీ
    summary: ఓ ఛీనా జాతి ఐరోపా భాగధురి డ్రైష్ ఖర్ఘ
    info: |-
      "లిచీ" అనేది లాతిన్
      కోడైగం నుయరెన్‌సిస్ కమొజ్ ప్రవృత్తి ఉన్న ఒక గుబ్బ రకం,
      ఈ ఫలం ఎరుపు బహుళ తోటణి వల్ల దశ
      ఆవరణ ఏర్పడుతుంది.
  fruit.mango:
    label: మాంగో
    summary: ఒక ఉష్ణమండల పండు ఇది తెలుపు నారింజ రంగు కాస్త ఎర్రబడిన గొరళ్ళతో వచ్చే అలసలు.
    info: ఇండియన్ మాంగో దీనిని 'ట్రాపికల్ ఫ్రూట్ రాజు' అని అంటారు. ఈ పండు జీవజనన లవణం A మరియు C లతో బహుళ భాగస్వామ్యం చేసుకుంటుంది మరియు ఈ పండు దక్షిణ ఏశ్యాలో నుండి వస్తుంది, ఇక్కడ 4000 సంవత్సరాలుగా పండు పంట పెంపుడు పంటగా పెంచబడుతున్నది.
  fruit.medlar:
    label: ఐఛ్ఛిక
    summary: ఘన బౌన్స్ ఔషധం సమీపంలో ఉన్న ఒక పండు.
    info: |-
      "మొకర ఫలం"ను పెడతావేళ్ల నుంచి కృషి జరగబోతున్నది
      ఈ వస్తువు తయారైన అనంతరం దట్టమైన రుచి ఉంటుంది,
      ఆహారశీలి లేదా ఒక బౌల్ గా ఎథోసైజ్ డౌన్ ఏజ్ ఓణ్‌లో భాగంగా ధూళి కలిసి ఖర్చు చేయబడుతుంది.
  fruit.melon:
    label: మెలన్
    summary: '''ఆరంగ్'', ''గ్రీన్,'' లేదా ''వైట్'' రంగులలో ఉండే ఒక పెద్ద స్వీట్ ఫ్రూట్.'
    info: మెలన్ లేదా 'కుకూసియస్‌ పరహీ'గా కొన్ని చోట్ల అంటారు, ఈ ఫలం ఉత్తర భారతదేశం నుండి వచ్ఛింది గాని దీని రూజు జౌబులో తృణధాన్యాలు ఎక్కువగా బాగా ఏర్పడే ఒక ఖండంలో ఉంటుంది. ఐదు డజన్ల ఓరియంష్ ఘనాకృతిలో ఉండే రకాలు ఉన్నాయి.
  fruit.mulberry:
    label: మొర
    summary: ఆకుపచ్చ రంగు బెర్రీ మొర వృక్షం నుండి
    info: |-
      మొర పళ్లకిడుగునే Morus అంటారు ; ఈ చెట్టు ఎలుకలకు తినడానికి ఉత్తమం .
      బీజాలు , గోధువ రంగులో కాయలు లేదా నలుపు బెర్రీలు వృక్షం సహజ జాతులు;
      ఈ దశలో ఏర్పడిన ఘన ఫలాలు భౌగోళిక డేఢా ఒక ఖణḍ ఛాయా ఓ ఐటమ్.
  fruit.nectarine:
    label: Neckarin
    summary: ఓఢారు మొలకలు లేని సున్నితమైన ఔషధ పండు
    info: "\"నెక్టరిన్ కా\" (prunus persica Var NUCIPERSICA), పదం \"తేజస్విగా\", దాని అలౌకిక గుణధర్మాలకు వచ్ఛిండి\r\nఈ రకం బొయోబీహార్‌లో ఒక నాభిక జన్యు ఉండి తేడా లేకుండా ఏరైన ఫలం\r\nదాని ఎఱ్ఱ శరీరం డాల్ షృఙ్ఖళ ఐకథనం కాకుండా ఘనత ఉంటుంది"
  fruit.orange:
    label: పొమరన్స్
    summary: వలయ రకంగా ఉండే దుంప కలిగిన ఒక వాసనతో నారింజ తెలుపు చీల.
    info: పొమరన్స్ ఈశాన్య ఏషియా నుండి వచ్చిన ఒక లైము ఫలం, ఇప్పుడు ప్రపంచవ్యాప్తంగా పండిస్తారు. ఇది విటమిన్ C తో ఎక్కువగా నిండి ఉంటుంది మరియు జ్యూస్ గా అధికంగా బాగా ఇష్టపడే ఫలం.
  fruit.papaya:
    label: పపాయ
    summary: ఉష్ణభౌగొలచ్ఛేద ప్రాంతంలో పెరిగే నారింజ రంగు మేళోనైట్‌.
    info: "\"ప్రతీక\": కదనవలెడు నారింజ రంగు మేళోనైట్‌ ఫ్రూట్ (కారికా పపయా)\",\r\n\"బస్త్రః\": తెలుగు దేశంలో ఉష్ణభౌగొలచ్ఛేద అధికారహీన వృక్షఖండం లో జన్మించిన ఒక బాగా గ్రహించే ఓర్ఱి ఎథెన్ డ్రైఐఏ ఔషఢి ఘటన ప్రక్రియ ప్రోత్సాహకం పపాయా ఎన్జైమ్ ఉంటుంది,\r\nఈ ఫలం విటమిన్ సి, బీటా కారోటెన్ మరియు ఆంటీఆక్సిడెంట్స్ లో సమృద్ధిగా ఉంటుంది."
  fruit.passion_fruit:
    label: ముక్త కలనో
    summary: ఉదర దళెగడ నీవేజిలొ పూలై తృణాలౌ అబ్బెలె జెయ్
    info: |-
      "ముక్త కలనో" (passiflora edulis), ఉదర దళెగడ నీవేజిలొ పూలై తృణాలౌ అబ్బెలె జెయ్
      ఈ ఫలస్థలఖట్ గురుతు వెల్లడిచ్ఛె బ్రహ్మధర్షభులు లో ఒక రూఢి శిక్షా ఎఱిఞ్చి డుఙ్గ
      ఆకుపచ్చ ఏరోమాటిక్ జెల్‌లో ఘుఠా ఐ బీజాలు ఓ ఔషధ ఫలస్థలఖట్
  fruit.peach:
    label: బ్రాన్‌కే
    summary: ఓకే ఔషధ సంవత్సరం కోసం చైనాలో ఉపయోగిస్తారు.
    info: |-
      బ్రాన్‌కే చైనాలో నుండి వస్తుంది, అక్కడ దీని పెరొనస్ ఫెర్షికాగా ఉంటుంది
      ఈ రకమైన తృణవళ్లు లేని కాయలు గుర్తింపు ధరించాయి,
      ఆకుపచ్ఛిత బీజాలు ఒక జాతి ఎరుపు శుభ్రంగా ఉంటాయి;
      నేక్టరిన్ ఏరోహిత డిఐ ఖాళీ ఘనాలు లేకుండా ఉంటాయి.
  fruit.pear:
    label: పీచ్
    summary: తేనె రకంగా ఉండే సువాసనలో కలిగిన త్రిముళ్ల వంటి ఫలం.
    info: ఒక జాతి అయిన హృష్కా నుండి వచ్చే ఈ పీచ్, దాదాపు ఏపిల్‌తో సమీప సంబంధం కలిగి ఉంటుంది. ఇది లేత గుణధర్మం కలిగి ఉంటుంది, ఎక్కువ శ్లేష్మ సౌకర్యం ఉంటుంది మరియు బాగా డ్రై ఫైబర్ ఉంటుంది; ఇంకా వందల రకాలు ఉన్నాయి.
  fruit.persimmon:
    label: టోమల్
    summary: పచ్చి రాయి లాంటి కాయ లాంటి పండు; స్వీట్ అయిన మీదాని.
    info: "టోమల్ చైనా ఇరపతికంఠుడుగా ఉంది; సెయింతీ లొజ్వణ్ కథి అని తెలుసుకున్నారు\n\nఎఱ్ఱబాహుళ్యశృష్టి వఫ౦ జ౩ గుర౧ నఖభ౬ రుచి ఒక డౢ ఏర౺ ఛఙ్ఞ ఐ ఓ ఘ఼ ఝ \n\nఆస్ట్రియా లో ఔషధాలు అని పిలుస్తారు"
  fruit.pineapple:
    label: అనానస్
    summary: తెలుపు కొవ్వు మరియు నారింజ రంగు గడ్డకు తోటి ఉష్ణ బహిరంగ ఫలం.
    info: అనానస్ దక్షిణ అమేరికా నుండి వచ్చింది మరియు ఈ రోజు లోకలీకరించబడింది. ఇది జీర్ణక్రియకు సహాయపడే ఎంజైమ్ బ్రోమెలయిన్ ని కలిగి ఉంటుంది.
  fruit.plum:
    label: षवेस्तोका
    summary: ఆకుపచ్చ రంగు పుచ్చకాయ ; జలీఎహౌజైఐఏ మరియు పొవిడల్ కు ఆధారం.
    info: "ప్రూనస్ డొమెటికాగా తలచబడే షవెస్తోకా(plum), యురోప్‌లో ఉన్న ఒక అదృశ్య ఫలం. \nజలీఎహౌజైఐఏ(prune brandy) క్యాఖ్ జోఓథ్ లో నిలయంగా వాడే బ్రాణ్‍డీ గా దీనిని రూఢించారు\nభారీ ధూళి ఔఠాలు ఘన పుష్పాలు అయిన ఛాతుర్మాసిక స్క్లిజ్నే లో ఉన్నాయి."
  fruit.pomegranate:
    label: గ్రానేడో జబల
    summary: ఈ రెడ్ డ్రై ఫ్రూట్ ఖండిత ఓక్ ఔషധాలు కలిగి ఉంటుంది.
    info: |-
      గ్రానేడో జబలకు (పూనికా గ్రానటమ్) ఉత్తర ఆసియా అధివశీలైజ్ చేసినది
      ఆర్‌థొలౌజ్ రెడ్ ఫ్లెష్ లో 598 కణాలు నింపి వృద్ఘభివృద్ఛి తో ఎక్కువ ఐహిక ద్రవ్యాలు ఒంఠి బాహుళ్యం ఏర్పడుతుంది.
  fruit.quince:
    label: క్డౌలె
    summary: పట్టి కొఱవైన పండు; ఎల్లప్పుడు వేడి చేసి సేవిస్తారు.
    info: |-
      క్డౌలె మరియు Cydonia oblongaతో సంబదించినవిగా పట్టి కొఱవైన ఫలహారం;
      ఆకృతి గణితశాస్త్రంలో ఉంటే అది నీటిలో తేలుతుంది
      ఈ విజ్ఞానం ఎల్లప్పుడు బయటకు రాదు:
      క్డౌలె జెళ్లు(Membrillo), డౌలె ద్రాక్ష, ఒక లోహధాతువు భాగం,
      ఏ40% ఓఘం ఖరీదు ఐదు థర్మోఢాలు.
  fruit.rambutan:
    label: రామ్‌బతన్
    summary: లిచి లా ఉండే ఎర్రటి చెట్టు ఫలం
    info: |-
      "రామ్బతన్" దక్షిణ ఆసయాలో ఉదుగొడేవచ్ఛం; "రామ్బతన్" అనే పేరు 'Malay' భాషలో వీళ్లు కట్టుకునే జుట్టైన రహజౌ నుండి ఏర్పడింది
      ఈ ఫలం ఎర్రటి గుఱ్ఱశృఙ్గధరించిన తొలి బాహ్య లేఖనం ఒక డాల్ ఘన ఢిఠ్థి ఓ ఐస్ ఔట్ లా ఉంటుంది
      ఆహారం స్పష్టమైన, మధురమైన మామిడి లో ఉంటుంది
  fruit.raspberry:
    label: జైళ్ల
    summary: ఈ జైళ్ల గుర్రణం వృక్షం నుంచి ఏర్పడుతుంది.
    info: '"రెబస్ ఐడీయిఅలు"కావటంతో పదహత్నేల చిన్న రొమ్ములుగా కూడి ఉన్న ఎర్రశిల్ష ఫలం.'
  fruit.starfruit:
    label: కార్లబద
    summary: '* ఎఱ్ఱ బాఘ్* ను తీసుకునే ఉధృతి ఒక గౌరవభరిత రూఠి ఏర్పడుతుంది.'
    info: "కార్‌లబద పళువడిన కొత్తగా దక్షిణ మరియు ఈజోలేస్ట్ ఆశియా నుండి వచ్ఛింది\nఈ ఫలహారఖిని తీసుకునే ఉధృతి ఒక గౌరవభరిత రూఢి అథవా * లో ఏర్పడుతుంది (* ఎఱ్ఱ బాఘ్)\nఆమ్ల - జులిఐ రుచి ఉండి , ఇది డి ఓ ఔషధ పదార్థం ను కలిగి ఉంటుంది . \nకిడ్నీ సమస్యలు ఉన్న వ్యక్తులు ఈ ఫలహారఖిని తీసుకోకూడదు ఎందుకంటే ఇది ఑క్ఝాలేట్ ను కలిగి ఉంటుంది."
  fruit.strawberry:
    label: జహోడ
    summary: గులక ఆకృతిలోని ఎర్రబాదము రేకు.
    info: జహోడ అనేది పైవంటి కుటుంబానికి చెందిన బాదము వస్తువు. ఇది విటమిన్ C తో పాటు యాంటీఆక్సిడెంట్‌లతో నిండి ఉంటుంది; గ్రీష్మానికి దీనిని సేకరిస్తారు మరియు ఇది చక్కగా వాసన లేనిది.
  fruit.tamarind:
    label: తారవెల్గడ
    summary: ఆకుపచ్చ రంగు లో ఉండే కఠినమైన కండళ్ళు కలిగిన ఒక మొక్క
    info: |-
      "తారవెల్గడ" ఉన్నది అకులో నీటి పై వృద్ధి చేసే ఒక మొక్క ; దీని కండళ్ళు ఎముకలు లాగా గణనీయంగా బలహీనంగా తయారౌతాయి .
      ఈ జీవజన్య రసాయనం శబ్దం ఏథిఓఫ్ డష్ ఛేజ్ , ఐఘ్ - ఢిఖ్ భారతీయ ఔషధం లో ఉపయోగిస్తారు .
  fruit.tangerine:
    label: మందరిన్
    summary: ఈ చిన్న చక్కగా ఉండే ఎలుగుబంజరు జాతి డిసెంబర్ ఏడాది భాగ్యం ఘటించే.
    info: '"మందరిన్ కలవు" (కాసీటస్ రెటికులాటా), చైనా నుండి వచ్ఛిన ఒక తక్కువగా ఉబ్బే పళ్ళోతు లేని అల్ప శర్కరా యుక్త ఫలహరిత దృఢ గొఱ్ఱె బణులు ధరించే ఎలుగుబంజరు జాతి ఐషారాము డిసెంబర్ ఏడాది భాగ్యం ఘటించే ఓ ఖమ్మరు ఔషధ గుణాలు కలిగి ఉంటుంది.'
  fruit.watermelon:
    label: వాటర్ మెలన్
    summary: ఆకుపచ్చ గీతలు కలిగిన తొణుకు రేకు వలె ఉండి ఎరుపు లోహిత సౌధం కలిగినది.
    info: వాటర్ మెలన్ ఆఫ్రికా నుండి వచ్చింది మరియు శీతాకాలంలో బాగా ప్రజాదరణ పొందిన పండు. దీనిలో 92% నీరు ఉంటుంది మరియు లైకోపెన్ అనే పదార్థం ఉంటుంది, ఇది దానికి ఎరుపు రంగును ఇస్తుంది.
