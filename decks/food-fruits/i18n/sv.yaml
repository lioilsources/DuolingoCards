lang: sv
pivot: false
title: Frukt
cards:
  fruit.apple:
    label: äpple
    summary: En rund röd eller grön frukt med sötsyrlig smak.
    info: Äpplet är frukten från äppelträdet, en av världens mest odlade grödor. Det innehåller C-vitamin och fibrer, och det finns mer än 7 500 sorter.
  fruit.banana:
    label: banan
    summary: En gul tropisk frukt med sött fruktkött.
    info: Bananen är frukten från en tropisk växt av bananfamiljen. Den är rik på kalium och naturligt socker som ger snabb energi.
  fruit.orange:
    label: apelsin
    summary: En rund citrusfrukt med doftande orange skal.
    info: Apelsinen är en citrusfrukt med ursprung i Sydostasien, i dag odlad över hela världen. Den är rik på C-vitamin och omtyckt som juice.
  fruit.strawberry:
    label: jordgubbe
    summary: Ett rött, saftigt, hjärtformat bär.
    info: Jordgubben är en omtyckt frukt av rosfamiljen. Den är rik på C-vitamin och antioxidanter och skördas på sommaren.
  fruit.grape:
    label: vindruva
    summary: Ett litet runt bär som växer i klasar.
    info: Vinrankan ger vindruvor i olika färger, från grönt till mörklila. Druvor äts färska, torkas till russin eller pressas till vin.
  fruit.watermelon:
    label: vattenmelon
    summary: En stor grönrandig frukt med rött saftigt fruktkött.
    info: Vattenmelonen kommer från Afrika och är en omtyckt sommarfrukt. Den består till 92 % av vatten och innehåller lykopen, som ger den dess röda färg.
  fruit.mango:
    label: mango
    summary: En tropisk frukt med saftigt gulorange fruktkött.
    info: Mangon kallas de tropiska frukternas kung. Rik på A- och C-vitamin kommer den från Sydasien, där den odlats i 4 000 år.
  fruit.cherry:
    label: körsbär
    summary: En liten rund röd stenfrukt som växer i par.
    info: Körsbäret är frukten från sötkörsbäret, en omtyckt sommarfrukt. Det innehåller antioxidanter och melatonin, och det finns söta och sura sorter.
  fruit.pear:
    label: päron
    summary: En droppformad frukt med söt, mild smak.
    info: Päronet är frukten från päronträdet, en nära släkting till äpplet. Det har mjukt, saftigt fruktkött och högt fiberinnehåll, och det finns hundratals sorter.
  fruit.pineapple:
    label: ananas
    summary: En tropisk frukt med taggig krona och gyllengult fruktkött.
    info: Ananasen kommer från Sydamerika och odlas nu i tropikerna över hela världen. Den innehåller enzymet bromelain, som hjälper matsmältningen.
  fruit.lemon:
    label: citron
    summary: En sur gul citrusfrukt; en källa till C-vitamin och arom.
    info: |
      Citronen är en sur citrusfrukt med ursprung i Asien.
      Den är rik på C-vitamin och citronsyra.
      Den används i matlagning, i drycker, i kosmetika och i rengöringsmedel.
      Skalet från citronträdet innehåller en eterisk olja med karakteristisk citrondoft.
  fruit.lime:
    label: lime
    summary: En liten grön sur citrusfrukt; en nyckelingrediens i det tropiska köket.
    info: |
      Limen är en liten grön citrusfrukt med sur saft och aromatiskt skal.
      Den är oumbärlig i det mexikanska, thailändska och vietnamesiska köket.
      Den innehåller mindre C-vitamin än citronen men har en starkare arom.
      Att äta lime skyddade sjömän mot skörbjugg tack vare C-vitaminet.
  fruit.kiwi:
    label: kiwi
    summary: En brun luden frukt med grönt fruktkött; rik på vitaminer.
    info: |
      Kiwin kommer från Kina, där den kallas kinesiskt krusbär.
      Nya Zeeland kommersialiserade den och döpte om den efter sin nationalfågel, kiwin.
      Den innehåller dubbelt så mycket C-vitamin som en apelsin.
      Fruktköttet är klargrönt; det finns även gyllene (gula) sorter.
  fruit.peach:
    label: persika
    summary: En sammetslen gulröd stenfrukt; en symbol för sommaren.
    info: |
      Persikan kommer från Kina, där den är en symbol för odödlighet.
      Dess mjuka sammetslena skal är karakteristiskt.
      Det finns vita och gula sorter; nektarinen är den släta, luddfria varianten.
      I Kina ingår persikor i nyåret och i den läkande mytologin.
  fruit.plum:
    label: plommon
    summary: En lila stenfrukt; grunden för plommonbrännvin och plommonmos.
    info: |
      Plommonet är en grundfrukt i Centraleuropa.
      Slivovitz (plommonbrännvin) är en traditionell tjeckisk och slovakisk spritdryck.
      Plommonmos är en typisk produkt av höstskörden.
      I världen finns det mer än 2 000 plommonsorter.
  fruit.apricot:
    label: aprikos
    summary: En liten orange stenfrukt; sötsyrlig och saftig.
    info: |
      Aprikosen kommer från Centralasien.
      Den odlas i hela Europa; de sötaste kommer från Turkiet och Spanien.
      Den är rik på betakaroten och A-vitamin.
      Torkade aprikoser är ett omtyckt nyttigt mellanmål.
  fruit.raspberry:
    label: hallon
    summary: Ett rött samlingsbär; en symbol för sommarträdgården.
    info: |
      Hallonet är ett samlingsbär av många små stenfrukter.
      Det växer vilt och odlat; skörden infaller på sommaren och hösten.
      Det är rikt på C- och K-vitamin, mangan och antioxidanter.
      Hallonsylt och hallonvinäger är traditionella delikatesser.
  fruit.blueberry:
    label: blåbär
    summary: Ett mörkblått bär; en superfood full av antioxidanter.
    info: |
      Blåbäret är rikt på antocyaniner, färgämnen med starka antioxidativa egenskaper.
      Antocyaninerna ger det dess mörkblå färg.
      Studier tyder på en positiv effekt på de kognitiva funktionerna och hjärthälsan.
      Odlade blåbär är större än vilda blåbär.
  fruit.blackberry:
    label: björnbär
    summary: Ett mörklila samlingsbär från björnbärsbusken.
    info: |
      Björnbäret är ett mörklila samlingsbär som växer på en taggig buske.
      Det vilda björnbäret växer i skogsbryn och snår.
      Det innehåller mycket C-vitamin, K-vitamin och fibrer.
      Björnbärssylt, kompott och likör är traditionella produkter.
  fruit.coconut:
    label: kokosnöt
    summary: En stor tropisk nöt med hårt skal och vitt fruktkött.
    info: |
      Kokosnöten är frukten från kokospalmen; botaniskt är den en stenfrukt, inte en nöt.
      Kokosvattnet i den omogna frukten är en naturlig isoton dryck.
      Kokosmjölk och kokosolja är grunden i det sydostasiatiska och indiska köket.
      Kokospalmen kallas de tusen användningsområdenas träd.
  fruit.papaya:
    label: papaya
    summary: En stor tropisk frukt med djupt orange fruktkött.
    info: |
      Papayan kommer från tropiska Amerika.
      Den innehåller enzymet papain, som främjar nedbrytningen av protein.
      Den är rik på C-vitamin, betakaroten och antioxidanter.
      Omogen papaya används som grönsak i det sydostasiatiska köket (som i sallaten som tam).
  fruit.guava:
    label: guava
    summary: En tropisk frukt med intensiv doft och vitt eller rosa fruktkött.
    info: |
      Guavan kommer från tropiska Amerika och har spridit sig över tropiska Asien och Afrika.
      Den innehåller fyra gånger mer C-vitamin än en apelsin.
      Skalet och kärnorna är ätliga; hela frukten är näringsrik.
      Guavajuice och guavasylt är populära produkter i tropiska länder.
  fruit.pomegranate:
    label: granatäpple
    summary: En röd frukt med tusen söta kärnor; en symbol för fruktbarhet.
    info: |
      Granatäpplet kommer från Centralasien och Medelhavsområdet.
      Det innehåller mer än 600 kärnor omgivna av genomskinligt rött fruktkött (ariller).
      Det är rikt på antioxidanter; studier undersöker dess effekt på hjärtat och inflammationer.
      Det symboliserar fruktbarhet och överflöd i många kulturer.
  fruit.fig:
    label: fikon
    summary: En päronformad frukt från fikonträdet; söt och full av kärnor.
    info: |
      Fikonet är en av de äldsta odlade frukterna; spåren går 11 000 år tillbaka.
      Det är egentligen inte en frukt, utan ett hölje fyllt med tusentals små blommor.
      Adams och Evas fikonlöv i den bibliska berättelsen är blad från fikonträdet.
      Torkade fikon är en utmärkt källa till kalcium, kalium och fibrer.
  fruit.date:
    label: dadel
    summary: En söt brun oval frukt från dadelpalmen; en basföda i Mellanöstern.
    info: |
      Dadlar är de söta frukterna från dadelpalmen.
      De har i tusentals år varit en basföda i Mellanöstern.
      De innehåller mer än 60 % socker och är en utpräglad energikälla.
      Inom islam äts dadlar traditionellt först när man bryter ramadanfastan (iftar).
  fruit.melon:
    label: melon
    summary: En stor söt frukt med orange, grönt eller vitt fruktkött.
    info: |
      Melonen är en tropisk till subtropisk frukt med hög vattenhalt.
      Den kommer från Afrika och Asien; i dag odlas den över hela världen.
      Den består till mer än 90 % av vatten och är mycket törstsläckande.
      Det finns hundratals sorter, bland annat cantaloupe, honungsmelon och galia.
  fruit.cantaloupe:
    label: cantaloupemelon
    summary: En nätmelon med djupt orange fruktkött.
    info: |
      Cantaloupemelonen är en omtyckt melonsort med ursprung i Asien.
      Namnet kommer från den påvliga residensen Cantalupo nära Rom.
      Det orange fruktköttet är rikt på betakaroten och A-vitamin.
      Den är en av de sötaste melonsorterna.
  fruit.grapefruit:
    label: grapefrukt
    summary: En stor bittersöt citrusfrukt; en dietstjärna.
    info: |
      Grapefrukten är en korsning mellan apelsin och pomelo.
      Den beskrevs på Barbados på 1700-talet.
      Rosa och röd grapefrukt innehåller lykopen och betakaroten.
      Grapefruktjuice påverkar många läkemedel; patienter bör informera sin läkare.
  fruit.tangerine:
    label: mandarin
    summary: En liten söt citrusfrukt med löst skal; en symbol för julen.
    info: |
      Mandarinen är en liten, lättskalad citrusfrukt med ursprung i Kina.
      Den är en symbol för det kinesiska nyåret och för lycka.
      I många länder är den en typisk julfrukt.
      Den innehåller C-vitamin, antioxidanter och flavonoider.
  fruit.passion_fruit:
    label: passionsfrukt
    summary: En tropisk frukt med skrynkligt skal och aromatiskt, kärnrikt fruktkött.
    info: |
      Passionsfrukten kommer från tropiska Sydamerika.
      Dess namn kommer från missionärer som såg symbolerna för Kristi lidande i blomman.
      Fruktköttet är fullt av kärnor omgivna av en aromatisk gelé.
      Den är en utmärkt källa till C-vitamin, fibrer och antioxidanter.
  fruit.lychee:
    label: litchi
    summary: En liten röd tropisk frukt med genomskinligt fruktkött; omtyckt i Asien.
    info: |
      Litchin är en tropisk frukt med ursprung i Kina.
      Dess sträva röda skal går lätt att skala och blottar ett genomskinligt vitt fruktkött.
      Den har en söt, fint aromatisk smak.
      I Kina är den en symbol för lycka och välstånd.
  fruit.dragon_fruit:
    label: drakfrukt
    summary: En rosa tropisk kaktusfrukt med vitt prickigt fruktkött.
    info: |
      Drakfrukten (pitaya) kommer från Mexiko och Centralamerika.
      Dess klarrosa skal och vita fruktkött med svarta frön är mycket dekorativa.
      Den har en mild smak och innehåller antioxidanter och C-vitamin.
      Av den gör man juicer, smoothies och dekorativa desserter.
  fruit.starfruit:
    label: stjärnfrukt
    summary: En gul tropisk frukt som bildar stjärnor när den skärs.
    info: |
      Stjärnfrukten kommer från Syd- och Sydostasien.
      Skuren på tvären bildar den en perfekt stjärnform, därav namnet.
      Den har en sötsyrlig smak och är rik på C-vitamin.
      Personer med njursjukdom får inte äta den på grund av oxalaterna.
  fruit.avocado:
    label: avokado
    summary: En krämig tropisk stenfrukt; grunden för guacamole.
    info: |
      Avokadon kommer från Mexiko och Centralamerika.
      Botaniskt är den en frukt (en stenfrukt), men kulinariskt används den som grönsak.
      Den innehåller nyttiga enkelomättade fetter (oljesyra), precis som olivolja.
      Den är en trendig hälsokost över hela världen; avokadomackan är en ikon för den moderna kafékulturen.
  fruit.persimmon:
    label: persimon
    summary: En orange tomatliknande frukt; söt och kärv.
    info: |
      Persimonen kommer från Kina och Japan; den kallas även kaki.
      Omogen persimon är garvsyrerik och kärv; mogen är den söt som honung.
      Den är rik på A- och C-vitamin och på mineraler.
      I Japan är den en traditionell höstfrukt.
  fruit.mulberry:
    label: mullbär
    summary: Ett mörklila bär från mullbärsträdet; silkesfjärilens föda.
    info: |
      Mullbäret är bäret från mullbärsträdet; mullbärsträdets blad är silkesfjärilens föda.
      Det finns vita, röda och svarta mullbär; det svarta är det sötaste.
      I historien var odlingen av mullbärsträd avgörande för silkesproduktionen.
      Mullbär är rika på resveratrol, C-vitamin och järn.
  fruit.cranberry:
    label: tranbär
    summary: Ett litet rött surt bär; en traditionell amerikansk ingrediens.
    info: |
      Tranbäret är ett litet surt rött bär.
      Det är en traditionell del av det amerikanska Thanksgiving (tranbärssås).
      Det innehåller proantocyanidiner, som hindrar E. coli-bakterier från att fästa vid urinvägarnas väggar.
      Tranbärets effekt på att förebygga urinvägsinfektioner är vetenskapligt belagd.
  fruit.gooseberry:
    label: krusbär
    summary: Ett litet runt genomskinligt bär; en trädgårdsfavorit.
    info: |
      Krusbäret är en liten frukt typisk för trädgårdar i Centraleuropa.
      Det finns i gröna, röda och gula sorter.
      Det är rikt på C-vitamin.
      Krusbärsvin är en historiskt omtyckt dryck.
  fruit.currant:
    label: vinbär
    summary: Ett litet rött, svart eller vitt bär i en klase.
    info: |
      Vinbäret är ett litet bär som växer i klaseformiga klasar.
      Svarta vinbär innehåller mest C-vitamin av alla bär.
      Svarta vinbär är grunden för smaken i cassislikör och i den brittiska drycken Ribena.
      Röda vinbär används i sylt och som dekoration på desserter.
  fruit.quince:
    label: kvitten
    summary: En hård gul frukt släkt med äpplet; äts alltid tillagad.
    info: |
      Kvittenen är släkt med äpplet och päronet; rå är den hård och kärv.
      Den bearbetas alltid genom upphettning till kvittengelé (membrillo), kvittenvin eller kvittenbrännvin.
      Den innehåller mycket pektin, lämpligt för att göra sylt.
      Den äldsta i Europa dokumenterade marmeladen (1500-talet) gjordes av kvitten.
  fruit.jackfruit:
    label: jackfrukt
    summary: En enorm tropisk frukt; världens största frukt som växer på ett träd.
    info: |
      Jackfrukten ger de största frukterna som växer på ett träd; de kan väga mer än 35 kg.
      Den kommer från tropiska Asien och är en basföda i Indien, Bangladesh och Thailand.
      Omogen jackfrukt har en neutral konsistens och används som ett vegetariskt köttalternativ.
      De mogna gula bitarna är söta och aromatiska.
  fruit.durian:
    label: durian
    summary: En stor taggig tropisk frukt med stark lukt; de tropiska frukternas kung.
    info: |
      Durianen kallas de tropiska frukternas kung.
      Dess starka lukt är motbjudande för vissa och lockande för andra; på många asiatiska hotell är den förbjuden.
      Fruktköttet är krämigt och sött med en komplex smak av mandel, vanilj och ost.
      I Sydostasien värderas den som en förfinad lyx.
  fruit.rambutan:
    label: rambutan
    summary: En röd luden tropisk frukt, lik litchin.
    info: |
      Rambutanen kommer från Malaysia; namnet kommer från malajiskans rambut, som betyder hår.
      Dess röda skal är täckt av mjuka, krokformiga utskott.
      Fruktköttet är genomskinligt och sött, likt litchin.
      Den är rik på C-vitamin och järn.
  fruit.longan:
    label: longan
    summary: En liten brun tropisk frukt, släkt med litchin.
    info: |
      Longanen är frukten från ett tropiskt träd med ursprung i Kina.
      Namnet kommer från kinesiskans long yan, som betyder draköga, på grund av det genomskinliga fruktköttet med en svart kärna.
      Den har en söt och aromatisk smak.
      I den traditionella kinesiska medicinen anses den vara en föda som stärker blodet och hjärtat.
  fruit.tamarind:
    label: tamarind
    summary: En brun baljfrukt med surt fruktkött; en grund i det thailändska köket.
    info: |
      Tamarinden kommer från tropiska Afrika; i dag odlas den i hela tropikerna.
      Fruktköttet är starkt surt och sött; det används i pad thai, worcestershiresås och indisk chutney.
      Ordet kommer från arabiskans tamr hindi, som betyder indisk dadel.
      Den är rik på vinsyra, B-vitaminer och järn.
  fruit.nectarine:
    label: nektarin
    summary: En slät luddfri persika; saftig och söt.
    info: |
      Nektarinen är en naturlig mutation av persikan med slätt skal.
      Den skiljer sig från persikan endast genom genen för skalets släthet.
      Den har en liknande smak men en fastare struktur.
      Namnet kommer från gudarnas nektar och vittnar om dess förmodade fulländning.
  fruit.damson:
    label: krikon
    summary: Ett litet mörkt plommon, typiskt för engelska lantträdgårdar.
    info: |
      Krikonet är en liten, mörkt blåsvart plommonsort.
      Namnet damson kommer från Damaskus, varifrån frukten kom till Europa.
      Rå är den mycket sur men utmärkt i sylt, mos och gin (damson gin).
      I den engelska traditionen har den odlats sedan antiken.
  fruit.medlar:
    label: mispel
    summary: En liten brun frukt släkt med äpplet; måste eftermogna efter skörd.
    info: |
      Mispeln är en uråldrig trädgårdsväxt som odlats sedan medeltiden.
      Den är ätlig först efter att ha mjuknat (bletting), alltså efter eftermognad efter skörd.
      Den är rik på garvämnen och C-vitamin.
      Shakespeare nämner den i Romeo och Julia; i dag är den snarare en kuriositet för trädgårdsodlare.
  fruit.ackee:
    label: akee
    summary: En röd tropisk frukt med ätliga gula arillar; Jamaicas nationalfrukt.
    info: |
      Akeen är Jamaicas nationalfrukt; den är uppkallad efter kapten Bligh (1793).
      Endast de mogna gula arillerna är ätliga; omogen eller övermogen frukt är giftig (hypoglycin A).
      Ackee and saltfish är Jamaicas nationalrätt.
      Den kommer från Västafrika och fördes till Karibien genom slavhandeln.
  fruit.feijoa:
    label: feijoa
    summary: En liten oval grön frukt med aromatiskt fruktkött.
    info: |
      Feijoan kommer från Sydamerika.
      Dess fruktkött har en intensiv aromatisk smak av ananas, guava och mynta.
      Den är mycket populär på Nya Zeeland som höstfrukt.
      Den är föga känd i Europa men omtyckt i ursprungsländerna.
