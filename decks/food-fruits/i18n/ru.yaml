lang: ru
pivot: false
title: Фрукты
cards:
  fruit.apple:
    label: яблоко
    summary: Круглый красный или зеленый фрукт со сладковато-кисловатым вкусом.
    info: Яблоко – плод яблони домашней, одна из самых выращиваемых культур в мире. Содержит витамин C и клетчатку; существует более 7 500 сортов.
  fruit.banana:
    label: банан
    summary: Желтый тропический плод со сладкой мякотью.
    info: Банан — это плод тропического растения семейства банановых. Он богат калием и натуральными сахарами, которые дают быструю энергию.
  fruit.cherry:
    label: черешня
    summary: Маленькая красная круглая ягода, растущая парами.
    info: Черешня — это плод дикой черёши, популярного летнего фрукта. Содержит антиоксиданты и мелатонин; есть сладкие и кислые сорта.
  fruit.grape:
    label: виноград
    summary: Маленькая круглая ягода растущая в гроздьях.
    info: Винная лоза производит грозди различных цветов — от зеленого до темно-фиолетового. Гроздья едят свежими, сушат для получения изюма или прессуют для производства вина.
  fruit.mango:
    label: манго
    summary: Тропический плод с желто-оранжевой сочной мякотью.
    info: Индийское манго называют "королём тропических фруктов". Оно богато витаминами А и С и происходит из Южной Азии, где его выращивают уже 4000 лет.
  fruit.orange:
    label: апельсин
    summary: Круглый цитрус с ароматной оранжевой кожурой.
    info: Апельсин – это тропический цитрусовый плод, родом из Юго-Восточной Азии, сегодня выращивается по всему миру. Он богат витамином С и популярен как напиток.
  fruit.pear:
    label: груша
    summary: Фрукт в виде слезы со сладким мягким вкусом.
    info: Груша – это плод грушевого дерева, близко родственного яблоне. У неё нежная, сочная мякоть и высокое содержание клетчатки; существует несколько сотен сортов.
  fruit.pineapple:
    label: ананас
    summary: Тропический плод с колючей короной и желтоватым мякотью.
    info: Ананас произрастает в Южной Америке и сейчас выращивается по всему тропическому поясу мира. Содержит фермент бромелайн, который помогает пищеварению.
  fruit.strawberry:
    label: клубника
    summary: Красная сочно-сладкая ягода в форме сердечка.
    info: Клубника садовая – популярное фруктовое растение из семейства розовых. Богата витамином С и антиоксидантами; собирается летом и имеет сладкий аромат.
  fruit.watermelon:
    label: арбуз
    summary: Большой зеленовато-полосатый плод с сочной красной мякотью.
    info: Арбуз происходит из Африки и является популярным летним фруктом. Он состоит на 92% из воды и содержит ликопин, который придает ему красный цвет.
