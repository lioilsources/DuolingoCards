lang: ru
pivot: false
title: Фрукты
cards:
  fruit.apple:
    label: яблоко
    summary: Круглый красный или зелёный плод со сладко-кислым вкусом.
    info: Яблоко — плод яблони домашней, одной из самых распространённых культур в мире. Содержит витамин C и клетчатку; существует более 7500 сортов.
  fruit.banana:
    label: банан
    summary: Жёлтый тропический плод со сладкой мякотью.
    info: Банан — плод тропического растения семейства банановых. Богат калием и натуральными сахарами, дающими быструю энергию.
  fruit.orange:
    label: апельсин
    summary: Круглый цитрусовый плод с душистой оранжевой кожурой.
    info: Апельсин — цитрусовый плод родом из Юго-Восточной Азии, сегодня выращиваемый по всему миру. Богат витамином C и любим в виде сока.
  fruit.strawberry:
    label: клубника
    summary: Красная сочная ягода в форме сердца.
    info: Земляника садовая — любимый плод семейства розовых. Богата витамином C и антиоксидантами; собирается летом и сладко пахнет.
  fruit.grape:
    label: виноград
    summary: Маленькая круглая ягода, растущая гроздьями.
    info: Виноградная лоза даёт виноград разных цветов — от зелёного до тёмно-фиолетового. Виноград едят свежим, сушат на изюм или отжимают на вино.
  fruit.watermelon:
    label: арбуз
    summary: Крупный зелёно-полосатый плод с красной сочной мякотью.
    info: Арбуз происходит из Африки и является любимым летним плодом. Он на 92 % состоит из воды и содержит ликопин, придающий ему красный цвет.
  fruit.mango:
    label: манго
    summary: Тропический плод с сочной жёлто-оранжевой мякотью.
    info: Манго индийское называют королём тропических фруктов. Богато витаминами A и C, происходит из Южной Азии, где выращивается уже 4000 лет.
  fruit.cherry:
    label: черешня
    summary: Маленькая круглая красная костянка, растущая парами.
    info: Черешня — плод вишни птичьей, любимый летний фрукт. Содержит антиоксиданты и мелатонин; существуют сладкие и кислые (вишнёвые) сорта.
  fruit.pear:
    label: груша
    summary: Плод в форме капли со сладким нежным вкусом.
    info: Груша — плод груши обыкновенной, близкой родственницы яблони. Имеет нежную, сочную мякоть и высокое содержание клетчатки; существуют сотни сортов.
  fruit.pineapple:
    label: ананас
    summary: Тропический плод с колючей короной и золотистой мякотью.
    info: Ананас происходит из Южной Америки и сегодня выращивается в тропическом поясе всего мира. Содержит фермент бромелайн, помогающий пищеварению.
  fruit.lemon:
    label: лимон
    summary: Кислый жёлтый цитрус; источник витамина C и аромата.
    info: |
      Лимон — кислый цитрусовый плод родом из Азии.
      Он богат витамином C и лимонной кислотой.
      Его используют в кулинарии, напитках, косметике и чистящих средствах.
      Кожура лимонного дерева (Citrus limon) содержит эфирное масло с характерным лимонным ароматом.
  fruit.lime:
    label: лайм
    summary: Маленький зелёный кислый цитрус; ключевой ингредиент тропической кухни.
    info: |
      Лайм — маленький зелёный цитрус с кислым соком и ароматной кожурой.
      Он незаменим в мексиканской, тайской и вьетнамской кухне.
      Он содержит меньше витамина C, чем лимон, но более сильный аромат.
      Употребление лайма защищало моряков от цинги (витамин C).
  fruit.kiwi:
    label: киви
    summary: Коричневый мохнатый плод с зелёной мякотью; богат витаминами.
    info: |
      Киви (Actinidia deliciosa) происходит из Китая, где его называют китайским крыжовником.
      Новая Зеландия ввела его в продажу и переименовала в честь национальной птицы киви.
      Он содержит вдвое больше витамина C, чем апельсин.
      Мякоть ярко-зелёная; существуют и золотые (жёлтые) сорта.
  fruit.peach:
    label: персик
    summary: Бархатистая жёлто-розовая костянка; символ лета.
    info: |
      Персик (Prunus persica) происходит из Китая, где является символом бессмертия.
      Его нежная бархатистая кожица характерна.
      Существуют белые и жёлтые сорта; нектарин — гладкая разновидность без пушка.
      В Китае персики — часть Нового года и целебной мифологии.
  fruit.plum:
    label: слива
    summary: Фиолетовая костянка; основа сливовицы и повидла.
    info: |
      Слива (Prunus domestica) — основной плод Центральной Европы.
      Сливовица (сливовый дистиллят) — традиционный чешский и словацкий самогон.
      Сливовое повидло — типичный продукт осеннего урожая.
      В мире существует более 2000 сортов слив.
  fruit.apricot:
    label: абрикос
    summary: Маленькая оранжевая костянка; сладко-кислая и сочная.
    info: |
      Абрикос (Prunus armeniaca) происходит из Центральной Азии.
      Он выращивается по всей Европе; самые сладкие — из Турции и Испании.
      Богат бета-каротином и витамином A.
      Сушёные абрикосы — популярный полезный перекус.
  fruit.raspberry:
    label: малина
    summary: Красная сборная ягода; символ летнего сада.
    info: |
      Малина (Rubus idaeus) — сборная ягода из множества мелких костянок.
      Она растёт дикой и культурной; сбор проходит летом и осенью.
      Богата витаминами C и K, марганцем и антиоксидантами.
      Малиновое варенье и малиновый уксус — традиционные лакомства.
  fruit.blueberry:
    label: черника
    summary: Тёмно-синяя ягода; суперфуд, полный антиоксидантов.
    info: |
      Черника (Vaccinium myrtillus дикая, V. corymbosum садовая) богата антоцианами.
      Антоцианы придают ей тёмно-синий цвет и сильные антиоксидантные свойства.
      Исследования указывают на положительное влияние на когнитивные функции и здоровье сердца.
      Садовая голубика крупнее дикой лесной.
  fruit.blackberry:
    label: ежевика
    summary: Тёмно-фиолетовая сборная ягода с куста ежевики.
    info: |
      Ежевика (Rubus fruticosus) — тёмно-фиолетовая сборная ягода, растущая на колючем кусте.
      Дикая ежевика растёт по опушкам лесов и в зарослях.
      Содержит много витамина C, K и клетчатки.
      Ежевичное варенье, компот и ликёр — традиционные продукты.
  fruit.coconut:
    label: кокос
    summary: Крупный тропический орех с твёрдой скорлупой и белой мякотью.
    info: |
      Кокос (Cocos nucifera) — плод кокосовой пальмы; ботанически это костянка, а не орех.
      Кокосовая вода внутри незрелого плода — природный изотонический напиток.
      Кокосовое молоко и масло — основа юго-восточноазиатской и индийской кухни.
      Кокосовую пальму называют деревом тысячи применений.
  fruit.papaya:
    label: папайя
    summary: Крупный тропический плод с насыщенно-оранжевой мякотью.
    info: |
      Папайя (Carica papaya) происходит из тропической Америки.
      Она содержит фермент папаин, способствующий перевариванию белков.
      Богата витамином C, бета-каротином и антиоксидантами.
      Незрелая папайя используется в юго-восточноазиатской кухне как овощ (салат сомтам).
  fruit.guava:
    label: гуава
    summary: Тропический плод с интенсивным ароматом и белой или розовой мякотью.
    info: |
      Гуава (Psidium guajava) происходит из тропической Америки и распространилась по тропической Азии и Африке.
      Содержит вчетверо больше витамина C, чем апельсин.
      Кожура и семена съедобны; весь плод питателен.
      Гуавовый сок и джем — популярные продукты в тропических странах.
  fruit.pomegranate:
    label: гранат
    summary: Красный плод с тысячей сладких зёрен; символ плодородия.
    info: |
      Гранат (Punica granatum) происходит из Центральной Азии и Средиземноморья.
      Он содержит более 600 зёрен, окружённых прозрачной красной мякотью (ариллусами).
      Богат антиоксидантами; исследования изучают его влияние на сердце и воспаления.
      Он символизирует плодородие и изобилие во многих культурах (греческой, иудейской, исламской).
  fruit.fig:
    label: инжир
    summary: Грушевидный плод фигового дерева; сладкий и полный семян.
    info: |
      Инжир (Ficus carica) — один из древнейших культурных плодов; свидетельства уходят на 11 000 лет назад.
      На самом деле это не плод, а вместилище, заполненное тысячами крошечных цветков.
      Листья Адама и Евы в библейском рассказе — листья фигового дерева.
      Сушёный инжир — прекрасный источник кальция, калия и клетчатки.
  fruit.date:
    label: финик
    summary: Сладкий коричневый овальный плод финиковой пальмы; основа кухни Ближнего Востока.
    info: |
      Финики (Phoenix dactylifera) — сладкие плоды финиковой пальмы.
      Они тысячелетиями были основной пищей Ближнего Востока.
      Они содержат более 60 % сахара и являются мощным источником энергии.
      В исламе финики традиционно едят первыми при завершении поста Рамадан (ифтар).
  fruit.melon:
    label: дыня
    summary: Крупный сладкий плод с оранжевой, зелёной или белой мякотью.
    info: |
      Дыня (Cucumis melo) — тропический и субтропический плод с высоким содержанием воды.
      Происходит из Африки и Азии; сегодня выращивается по всему миру.
      Содержит более 90 % воды; отлично утоляет жажду.
      Существуют сотни сортов, среди них канталупа, ханидью, галия и шарантэ.
  fruit.cantaloupe:
    label: канталупа
    summary: Жёлто-коричневая сетчатая дыня с насыщенно-оранжевой мякотью.
    info: |
      Канталупа (Cucumis melo var. cantalupensis) — популярный сорт дыни родом из Азии.
      Название происходит от папской резиденции Канталупо близ Рима.
      Оранжевая мякоть богата бета-каротином и витамином A.
      Это один из самых сладких типов дыни.
  fruit.grapefruit:
    label: грейпфрут
    summary: Крупный горько-сладкий цитрус; диетическая суперзвезда.
    info: |
      Грейпфрут (Citrus paradisi) — гибрид апельсина и помело.
      Он был описан в XVIII веке на Барбадосе.
      Розовый и красный грейпфрут содержат ликопин и бета-каротин.
      Грейпфрутовый сок взаимодействует со многими лекарствами; пациентам следует сообщить врачу.
  fruit.tangerine:
    label: мандарин
    summary: Маленький сладкий цитрус со свободной кожурой; символ Рождества.
    info: |
      Мандарин (Citrus reticulata) — маленький, легко очищаемый цитрус родом из Китая.
      Он символ китайского Нового года и удачи.
      Во многих странах это типичный рождественский фрукт.
      Содержит витамин C, антиоксиданты и флавоноиды.
  fruit.passion_fruit:
    label: маракуйя
    summary: Тропический плод с морщинистой фиолетовой кожурой и ароматной семенной мякотью.
    info: |
      Маракуйя (Passiflora edulis) происходит из тропической Южной Америки.
      Её название дали миссионеры, видевшие в цветке символы страстей Христовых.
      Мякоть полна семян, обёрнутых ароматным гелем.
      Это отличный источник витамина C, клетчатки и антиоксидантов.
  fruit.lychee:
    label: личи
    summary: Маленький красный тропический плод с прозрачной мякотью; любим в Азии.
    info: |
      Личи (Litchi chinensis) — тропический плод родом из Китая.
      Его грубая красная кожура очищается, открывая прозрачную белую мякоть.
      Он имеет сладкий, тонко-ароматный вкус.
      В Китае это символ счастья и процветания.
  fruit.dragon_fruit:
    label: драконий фрукт
    summary: Розовый тропический плод кактуса с белой крапчатой мякотью.
    info: |
      Драконий фрукт (питахайя, Hylocereus) происходит из Мексики и Центральной Америки.
      Его ярко-розовая кожура и белая мякоть с чёрными семенами очень декоративны.
      Он имеет мягкий вкус; содержит антиоксиданты и витамин C.
      Из него делают соки, смузи и декоративные десерты.
  fruit.starfruit:
    label: карамбола
    summary: Жёлтый тропический плод, образующий звёздочки при нарезке.
    info: |
      Карамбола (Averrhoa carambola) происходит из Южной и Юго-Восточной Азии.
      Нарезанная поперёк, она образует идеальную форму звезды (поэтому starfruit).
      Она имеет кисло-сладкий вкус; богата витамином C.
      Людям с болезнями почек не следует её есть из-за оксалатов.
  fruit.avocado:
    label: авокадо
    summary: Кремовая тропическая костянка; основа гуакамоле.
    info: |
      Авокадо (Persea americana) происходит из Мексики и Центральной Америки.
      Ботанически это плод (костянка), но кулинарно используется как овощ.
      Содержит полезные мононенасыщенные жиры (олеиновую кислоту), как оливковое масло.
      Это модный в мире полезный продукт; тост с авокадо — икона современной кофейной культуры.
  fruit.persimmon:
    label: хурма
    summary: Оранжевый плод, похожий на помидор; сладкий и вяжущий.
    info: |
      Хурма (Diospyros kaki) происходит из Китая и Японии; её называют и каки.
      Незрелая хурма терпкая и вяжущая; спелая сладкая как мёд.
      Богата витаминами A и C и минералами.
      В Японии это традиционный осенний фрукт (каки).
  fruit.mulberry:
    label: шелковица
    summary: Тёмно-фиолетовая ягода шелковичного дерева; пища тутового шелкопряда.
    info: |
      Шелковица (Morus) — ягода шелковичного дерева; листья шелковицы — пища тутового шелкопряда.
      Существуют белая, красная и чёрная шелковица; чёрная самая сладкая.
      В истории выращивание шелковицы было ключевым для шелководства.
      Шелковица богата ресвератролом, витамином C и железом.
  fruit.cranberry:
    label: клюква
    summary: Маленькая красная кислая ягода; традиционный американский ингредиент.
    info: |
      Клюква (Vaccinium macrocarpon) — маленькая кислая красная ягода.
      Она традиционная часть американского Дня благодарения (клюквенный соус).
      Содержит проантоцианидины, препятствующие прилипанию бактерий E. coli к стенкам мочевыводящих путей.
      Влияние клюквы на профилактику инфекций мочевыводящих путей научно подтверждено.
  fruit.gooseberry:
    label: крыжовник
    summary: Маленькая круглая полупрозрачная ягода; любимица садов.
    info: |
      Крыжовник (Ribes uva-crispa) — мелкий плод, типичный для садов Центральной Европы.
      Существует в зелёных, красных и жёлтых сортах.
      Богат витамином C.
      Крыжовниковое вино — исторически популярный напиток.
  fruit.currant:
    label: смородина
    summary: Мелкая красная, чёрная или белая ягода в кисти.
    info: |
      Смородина (Ribes) — мелкая ягода, растущая колосовидными кистями.
      Чёрная смородина (Ribes nigrum) содержит больше всего витамина C среди всех ягод.
      Чёрная смородина — основа вкуса Ribena (британский напиток) и ликёра кассис.
      Красная смородина используется в джемах и как украшение десертов.
  fruit.quince:
    label: айва
    summary: Твёрдый жёлтый плод, родственный яблоку; употребляется всегда после тепловой обработки.
    info: |
      Айва (Cydonia oblonga) родственна яблоне и груше; сырая она твёрдая и вяжущая.
      Её всегда обрабатывают теплом; айвовый джем (мембрильо), айвовое вино и айвовый бренди.
      Содержит много пектина, подходящего для приготовления джемов.
      Древнейший в Европе задокументированный мармелад (XVI век) делали из айвы.
  fruit.jackfruit:
    label: джекфрут
    summary: Огромный тропический плод; крупнейший растущий на дереве плод в мире.
    info: |
      Джекфрут (Artocarpus heterophyllus) даёт крупнейшие растущие на дереве плоды; они могут весить более 35 кг.
      Он происходит из тропической Азии; это основная пища в Индии, Бангладеш и Таиланде.
      Незрелый джекфрут имеет нейтральную текстуру и используется как вегетарианская замена мяса.
      Спелые жёлтые дольки сладкие и ароматные.
  fruit.durian:
    label: дуриан
    summary: Крупный колючий тропический плод с сильным запахом; король тропических фруктов.
    info: |
      Дуриан (Durio zibethinus) называют королём тропических фруктов.
      Его сильный запах для одних отталкивающий, для других манящий; во многих азиатских отелях он запрещён.
      Мякоть кремовая и сладкая, со сложным вкусом (миндаль, ваниль, сыр).
      В Юго-Восточной Азии его ценят как изысканную роскошь.
  fruit.rambutan:
    label: рамбутан
    summary: Красный волосистый тропический плод, похожий на личи.
    info: |
      Рамбутан (Nephelium lappaceum) происходит из Малайзии; название происходит от малайского rambut = волосы.
      Его красная кожура покрыта мягкими крючковатыми выростами.
      Мякоть прозрачная и сладкая, похожая на личи.
      Он богат витамином C и железом.
  fruit.longan:
    label: лонган
    summary: Маленький коричневый тропический плод, родственный личи.
    info: |
      Лонган (Dimocarpus longan) — плод тропического дерева родом из Китая.
      Название происходит от китайского long yan = глаз дракона, из-за прозрачной мякоти с чёрной косточкой.
      Он имеет сладкий и ароматный вкус.
      В традиционной китайской медицине его считают пищей, поддерживающей кровь и сердце.
  fruit.tamarind:
    label: тамаринд
    summary: Коричневый стручковый плод с кислой мякотью; основа тайской кухни.
    info: |
      Тамаринд (Tamarindus indica) происходит из тропической Африки; сегодня выращивается по всему тропическому миру.
      Мякоть сильно кислая и сладкая; используется в Пад Тае, вустерском соусе и индийском чатни.
      Слово происходит из арабского tamr hindi = индийский финик.
      Он богат винной кислотой, витаминами группы B и железом.
  fruit.nectarine:
    label: нектарин
    summary: Гладкий персик без пушка; сочный и сладкий.
    info: |
      Нектарин (Prunus persica var. nucipersica) — природная мутация персика с гладкой кожицей.
      Он отличается от персика лишь геном гладкости кожицы.
      Имеет похожий вкус, но более плотную консистенцию.
      Название происходит от нектара богов; оно свидетельствует о его воспринимаемом совершенстве.
  fruit.damson:
    label: дамасская слива
    summary: Маленькая тёмная слива, типичная для английских сельских садов.
    info: |
      Дамасская слива (damson) — маленький тёмно-сине-чёрный сорт сливы.
      Название происходит от Дамаска, откуда плод попал в Европу.
      Сырая она очень кислая, но превосходна в джемах, повидле и джине (damson gin).
      В английской традиции её выращивают с античности.
  fruit.medlar:
    label: мушмула
    summary: Маленький коричневый плод, родственный яблоне; должен дозреть после сбора.
    info: |
      Мушмула (Mespilus germanica) — древнейшая садовая культура, выращиваемая со Средневековья.
      Она съедобна лишь после размягчения (блеттинга), то есть отлёживания после сбора.
      Богата дубильными веществами и витамином C.
      Шекспир упоминает её в «Ромео и Джульетте»; сегодня это скорее диковинка садоводов.
  fruit.ackee:
    label: аки
    summary: Красный тропический плод со съедобными жёлтыми ариллусами; национальный плод Ямайки.
    info: |
      Аки (Blighia sapida) — национальный плод Ямайки; назван в честь капитана Блая (1793).
      Съедобны лишь спелые жёлтые ариллусы; незрелый или переспелый плод ядовит (гипоглицин A).
      Ackee and saltfish — национальное блюдо Ямайки.
      Он происходит из Западной Африки; в Карибы его завезли работорговлей.
  fruit.feijoa:
    label: фейхоа
    summary: Маленький овальный зелёный плод с ароматной мякотью.
    info: |
      Фейхоа (Acca sellowiana, также Feijoa sellowiana) происходит из Южной Америки.
      Её мякоть имеет интенсивный ароматный вкус (ананас, гуава, мята).
      Она очень популярна в Новой Зеландии как осенний фрукт.
      Мало известна в Европе, но любима в странах происхождения.
