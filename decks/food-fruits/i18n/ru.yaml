lang: ru
pivot: false
title: Фрукты
cards:
  fruit.ackee:
    label: акии
    summary: Красная тропическая ягода со вкусными желтыми косточками; национальное растение Ямайки.
    info: Акии (Blighia sapida), национальный плод Ямайки назван в честь капитана Блига (впервые описанного ещё в 1793 году). Едят только зрелую жёлтую мякоть семян – недозревший или перезрелий фрукт ядовит из-за содержания гипоглицина А. «Блюдо акия с рыбой» является традиционным блюдом Ямайки и также считается её национальной едой.
  fruit.apple:
    label: яблоко
    summary: Круглое красное или зеленое фрукт сладковато кислого вкуса.
    info: Яблоко - плод яблони домашней, одна из самых выращиваемых культур в мире. Содержит витамин C и клетчатку; существует более чем 7 500 сортов.
  fruit.apricot:
    label: абрикос
    summary: Маленький оранжевый плод с косточкой; сочный и немного терпко-сладкий.
    info: Абрикосы выращивают в Чехии и по всей Европе; самые сладкие из Турции и Испании.
  fruit.avocado:
    label: авокадо
    summary: Кремовый тропический плод; основной компонент гуакамоль.
    info: Авокадо происходит из Мексики и Центральной Америки. Ботанически оно является фруктом семейства персиковых деревьев, но кулинарно используется как овощ. Содержит полезные мононенасыщенные жиры (олеиновую кислоту), подобную тем, что содержатся в растительном масле.
  fruit.banana:
    label: banana
    summary: yellow tropical tree with sweet pulp.
    info: '{"hint":"длинный изогнутый желтый тропический плод (вид Musa)","info":"Банан - это фрукт теплых регионов растения семейства банановых. Он богат калием и натуральными сахарами, которые дают быструю энергию.","label":"банан","summary":"Желтовато-тропическое дерево со сладкой мякотью."}'
  fruit.blackberry:
    label: бузина
    summary: Составная черника из кустарникового дерева бузыни.
    info: '{"hint":"темно фиолетовая ягода с куста малины","info":"Малина - это темно-фиалковая составная ягода растущая на колючем кусте из семейства Розоцветных.","label":"малина","summary":"Темно-фиалковое соединение ягоды от бузины."}'
  fruit.blueberry:
    label: черника
    summary: Темно-голубая бобовидная ягода; полезный продукт питания, наполненный антиоксидантами.
    info: Черника обыкновенная содержит антоцианы и является богатым источником антиоксидантов. Антоцианы придают чернике её тёмно-синий цвет и сильные抗氧化ные свойства исследования показывают положительное влияние на когнитивную функцию и здоровье сердца. Садовые ягоды крупнее диких.
  fruit.cantaloupe:
    label: канталюпе
    summary: Сетчатое желтого цвета тыква с насыщенно оранжевые мякоть.
    info: '{"hint":"апельсиновое мякоть сетчатый дыньи (Cucurbita pepоs subsp. ovifera)","infо": "Канталупа (Cucurbita pepos subsp.ovifера) - популярный сорт арбуза из Азии."Название происходит от папского резиденции Канталиупо близ Рима."Оранжевая мякот содержит много каротина и витамина А."Это один самых сладких видов арбузов","labеl": "кантальопо", "summarу": "Желтовато коричневые узорные арбузы со ярко оранжевой мякотью"}'
  fruit.cherry:
    label: черемуха
    summary: Круглая маленькая красноватая ягодка из двух частей, которая растет на деревьях весной или ранним летом.
    info: '{"hint":"маленький круглый красный каменистый плод растущий парами","info":"Трещеня - это ягода дикой черешни, популярное летнее фрукт. Содержит антиоксиданты и мелатонин; есть сладкие и кислотные сорта.","label":"трещения","summary":"Маленькое округлое красная овощь вырастающая в парах."}'
  fruit.coconut:
    label: кокос
    summary: Огромное тропическое ореховидное растение со светлом мяском.
    info: |-
      {"hint":"Большой тропический орех с волокнистой скорлупой (Cocus nucifer)","info":"Кокосовое ядро (Cocus nucifer) - это плод кокосовой пальмы; ботанически является семянем, а не орехом и даже не настоящим орешком.
      Вода внутри незрелого плода представляет собой натуральный электролитный напиток.
      Масло из кокуса используется как основной ингредиент во многих юго-восточных странах Азии и Индия.
      Пальма называется деревом жизни."}
  fruit.cranberry:
    label: клубника
    summary: Маленькая красная кислая ягода; традиционное дополнение к американскому празднику.
    info: Клюква - маленькая кислая красная ягода. Традиционно используется в американском Дне благодарения как соус из клюквы. Содержит проантоцианидины, которые предотвращают прикрепление бактерий Escherichia Coli на стенки мочевыводящих путей.
  fruit.currant:
    label: ряда
    summary: Маленькие красные или черные ягоды на гребне.
    info: Рябина – это мелкая ягода красного цвета в гроздьях. Черная рядь содержит больше всего витамина С из всех видов ягоды. Растение используется как основной вкус напитков «рибер» и ликера кассис.
  fruit.damson:
    label: дамаскская слива
    summary: Мелкие черные или фиолетовые плоды дамасской сливы.
    info: '{"hint":"маленький сорт сливы тёмно-синего цвета","info":"Дамасская слива - это маленькое темное дерево в английских сельскохозяйственных угодьях."}'
  fruit.date:
    label: датлык
    summary: Сладкий коричневый овальный фрукт дактильных пальмовников; базовая еда для близнецов востоке.
    info: Датлыки (Phoenix dactylifера) - это сладкие плоды дактильного пальма. Они являются основной пищей Ближнего Востока уже тысячи лет и содержат более чем на 60% сахара, являясь заметным источником энергии.
  fruit.dragon_fruit:
    label: драконья ягода
    summary: Розовый тропический плод кактуса с белым пятнестым мяком.
    info: '{"hint":"розовое тропическое ягода кактуса с белой пятнистой мякотью (Гилокереус)","info":"Драконье фруктовое дерево (питахайя или гилокерейус), произрастающее в Мексике и Центральной Америке имеет насыщенную розовую кожицу и белый мясистый слой с черными семенами внутри. Это очень декоративное растение обладает нежным вкусом плодов, содержит антиоксиданты и витамин С. Из него производят напитки джусы, смешанный коктейли со льдом и украшения для десертных блюд."}'
  fruit.durian:
    label: дюрен
    summary: Большой колючий тропический плод со специфическим резким запахом.
    info: Дуриан (латинское название Durio zibethinus), называют королем тропических фруктов за свой сильный аромат и вкусовые качества. Его запах может быть отталкивающим для одних или привлекательным – в некоторых азиатских отелях его даже запрещено иметь при себе из-за неприятного запаха.
  fruit.feijoa:
    label: феёя
    summary: Небольшой продолговатый зеленый плод со сладкой мякотью.
    info: '{"hint":"овал зеленый ароматический фрукт","info":"Фейёа (Acca sellowiana или Feijoa sellowiana), происходит из Южной Америки\r\\nЕе мякоть имеет интенсивный аромат и вкус (ананас, гуава, ментол). \r\\nОна очень популярная на Новом Зельандии как осенний плод. Малоизвестное в Европе, но любимое во многих странах своего происхождения.","label":"фейёа","summary":"Маленький оваловый зеленый плод с ароматической мякотью."}'
  fruit.fig:
    label: инжир
    summary: Фига имеет форму груши и содержит внутри сладкие семена.
    info: Инжир или фиговое дерево – один из древнейших выращиваемых фруктов с доказательствами существования возрастом более чем в 11 тысяч лет назад. На самом деле это не плод как таковой, а стручок наполненный множеством мелких цветков.
  fruit.gooseberry:
    label: ангрест
    summary: Мала кулацька просветна бульба; папулярны ў сарадах.
    info: '{"hint":"маленькая прозрачная зеленая или красная ягода","info":"Ангрест - это небольшой плод, характерный для садов Центральной Европы\nСуществует в виде зелёной и красновато-коричневой разновидности\nОн богата на витамин С\nКардамил из ангреята является исторически популярным напитком"}'
  fruit.grape:
    label: виноград
    summary: Маленькая круглая ягода, которая вырастает кистями на лозе.
    info: Виноградное растение производит гроздья различных цветов - от зеленого до темнофиолетового. Грозди едят свежими или сушенными в виде изюма и прессуют для производства вина.
  fruit.grapefruit:
    label: грейпфрут
    summary: Большой горькоcлaдный цитрусовый плод; диетическое чудо.
    info: '{"hint":"большой горько-сладкий цитрусовый фрукт (Citrus paradisi)","info":"Грейпфрут (Citrus paradisi) - гибрид апельсина и помело\nОн был описан в XVIII веке на Барбадосах\nРозовые и красные грейпфруты содержат ликопин и бета-каротин\nСок из грейпфрута взаимодействует с многими препаратами; пациенты должны сообщить об этом врачу","label":"грейпфрут","summary":"Большой горькo-cладкий цитрус; диетический супергерой."}'
  fruit.guava:
    label: гуаява
    summary: Тропический плод с насыщенным запахом белого или розового цвета мякоти.
    info: Гуава происходит из тропической Америки и распространена по всей тропической Азии и в Африке. В ней содержится в четыре раза больше витамина С чем в апельсине.
  fruit.jackfruit:
    label: хлебное дерево
    summary: Гигантский тропический плод; самый большой плод дерева мира.
    info: '{"hint":"огромный зеленый колючий тропический плод (Artocarpus heterophyllus)","info":"Хлебное дерево (Artocarpus heterophyllus) производит самые крупные фрукты на дереве; они могут весить более 35 кг\.\nОно произрастает в Юго-Восточной Азии и является основным продуктом питания во многих странах региона как Индия, Бангладеш или Таиланд\.\nНезрелые хурмы имеют нейтральную текстуру и используются вместо мяса для растительных блюд\.\nСозревшие желтые дольки сладкие и ароматические."}'
  fruit.kiwi:
    label: киви
    summary: Богаты витаминами желто-черные фрукты с белыми прожилками внутри.
    info: '{"hint":"маленький коричневый шершавый плод с ярко зеленой мякотью (Actinidia deliciosa)","info":"Киви (Actinidia deliciosa), родом из Китая, где его называют Ян тао или костянка дикого гусеницы.\rНовую Зеленду коммерциализировала и переименовали в честь национальной птицы - киви.\rСодержание витамина С выше чем у апельсина.\rМякоть имеет живописный зелёный цвет; существуют также оранжевые разновидности","label":"киви","summary":"коричневое волосистое фрукт со светло-зелеными семечками; богатые витаминами."}'
  fruit.lemon:
    label: лимон
    summary: Кисло желтый цитрус; источник витамина С.
    info: |-
      Лимон - кислый цитрусовый плод из Азии
      Он богат витамином С и лимонной кислотой,
      Используется на кухне напитках, косметике и чистящих средствах.
  fruit.lime:
    label: лимонка
    summary: Маленькая зелёнокожая кислая экзотическая ягоды из тропических стран
    info: '{"hint":"малый зеленый кислый цитрусовый фрукт","info":{"label":"лимона","description": "Лимон - маленький зелёный ароматический лайм с очень кислою мякотью и толстой кожурой. Он используется в мексиканской, таиландской и вьетнамской кухне как важнейший ингредиент для приготовления блюд. В отличие от обычного лемонов он содержит меньше витамина С но имеет более насыщенную вкусовые качества. Употребление его помогает предупреждать болезни у людей работающих под палящими лучами солнца."}}'
  fruit.longan:
    label: лонганны
    summary: Маленькая коричнево - оранжевого цвета круглая экзотическая ягода родственная личи.
    info: Лонган (латинское название Dimocarpus longan), это тропический плод деревьев из Китая и Юго Восточной Азии с прозрачной мякотью внутри ярко красного цвета и черным семенем по центру. Он имеет сладкий ароматный вкус.
  fruit.lychee:
    label: личи
    summary: Красное маленькое тропическое растение со светлыми косточками внутри; любимо во многих странах мира.
    info: '{"hint":"малый красный тропический плод с прозрачной мякотью и шероховатой кожурой (Litchi chinensis)","info":"Личи (Litchi chinensis) - это тропическое дерево из Китая\nЕго грубую кору легко удалить для раскрытия белого полупрозрачного мяса\nОно имеет сладкий аромат\nВ Китае личи символизирует благосостояние","label":"личи","summary":"Маленькая красная тропическая ягода с прозрачным филейным содержимым; популярна в Азии."}'
  fruit.mango:
    label: мандарин
    summary: Эта информация не может быть переведена на русский язык без потери точности или добавления фактических данных.
    info: '{"hint":"тропический каменистый плод с желто-оранжевым мякотью (Mangifera индика)", "info": "Индийское манговое дерево называется королем тропических фруктов. Оно богато витамином А и С и происходит из Юго-Восточной Азии, где его выращивают уже более 4 тысяч лет.", "label": "манго", "summary": "Тропическое ягода со вкусной жёлтой оранжевой душистой мякости."}'
  fruit.medlar:
    label: мишпюль
    summary: Коричный маленький фрукт родственный яблоку; должен дозреть после сборки.
    info: Мишпуля (Mespilos germenika) - древняя садовая культура выращиваемая со средневековья. Ее можно есть только после блетования (blitting), когда плоды становятся мягкими через некоторое время после сбора урожая.
  fruit.melon:
    label: арбузы
    summary: Крупные круглые или продолговатые ягоды с красной, жёлтой либо белой мякотью внутри.
    info: |-
      {"hint":"круглый или овальный плод с апельсиновым или зеленым мякотью (Cucumis melо)","info":"Арбузом называют тропический и подтропический фрукт высокой влагосодержащий.
      Он происходит из Африки и Азии; сегодня он выращивается по всему миру.
      Составляет более чем на 90% воды; это отличное гидратация
      Есть сотни разновидностей: канталупе, медовый десертный, Галия, Шарантаи и другие","label":"арбузы","summary":"Большой сладкий плод со светлооранжевым, желтым или беловатым мясистыми частями."}
  fruit.mulberry:
    label: морошь
    summary: Темнофиолетовая ягода с куста морошки.
    info: Морошка – это ягода моркового дерева или белены душистой. Листья этого растения служат пищей для бабочки тутового шелкопряда.
  fruit.nectarine:
    label: nectarin
    summary: Гладкий фрукт без щупальцев на кожуре
    info: Нектаринка - это естественная мутация гладкой кожи персика с кожей без волосков. Отличается от персиков только геном для шероховатости поверхности. Имеет похожий вкус и более плотную текстуру.
  fruit.orange:
    label: мандарины
    summary: Круглое экзотическое деревце с приятным запахом оранжевых листьев.
    info: '{"hint":"круглый цитрус с толстой оранжевой кожурой","info":"Мандарин - это тропический плод из Юго-Восточной Азии, сегодня выращиваемый по всему миру и богат витамином С; его любят как напиток.","label":"мандарины","summary":"Круглая экзотическая ягода с ароматной оранжевою кожицей."}'
  fruit.papaya:
    label: папая
    summary: Большой тропический плод со светлооранжевым мясом.
    info: '{"hint":"огурец","info":"Папайя - тропический фрукт с ярко оранжевой мякотью из семейства Carica papaya. Он содержит пепсин и витамин С, бетакаротен и антиоксиданты."}'
  fruit.passion_fruit:
    label: мученица
    summary: Тропический плод с фиолетовой кожурой и ароматным семенным содержимым.
    info: Мученица происходит из тропической Южной Америки и получила своё название от миссионеров, которые в её цветке увидели символы страданий Христа.
  fruit.peach:
    label: персик
    summary: Мелкая мягко розовая ягода с шероховатой кожурой.
    info: Персик появился в Китае и там является символом бессмертия.
  fruit.pear:
    label: груша
    summary: Фрукт в виде капли с нежным и мягковым вкусом.
    info: '{"hint":"фрукт в форме слезы со сладким мягким вкусом (род Pear)"}'
  fruit.persimmon:
    label: томель
    summary: Абрикосообразное оранжевое плодовое дерево с очень сочными и пряностями листьями
    info: |-
      Томателлуса или киничея японская происходит из Китая и Японии;
      незрелый томель имеет терпкую текстуру,
      a зрелый фрукт сладкий на вкус как мёд.
      Овощ богат витаминами А,C а также минералами.
  fruit.pineapple:
    label: ананас
    summary: Тропический плод с шипастым верхом и золотистого цвета мякотью.
    info: '{"hint":"тропический фрукт с колючей короной и желтым мякотью (ананас Ananas comosus)","info":"Ананас происходит из Южной Америки и сейчас выращивается в тропических регионах по всему миру. Он содержит энзим бромелайн, который помогает пищеварению.","label":"ананас","summary":"Тропический плод с шипастым верхом и золотистого цвета мякотью."}'
  fruit.plum:
    label: шслик
    summary: Фиалковый ягодонос; базис джина и компотов.
    info: |-
      Шниголиуса (prunes domesticus), или сливка – это основной фрукт Центральной Европы
      Слива из шнапса - традиционный чешский и словацкий алкоголь,
      А также пюре для сладких блюд на основе этого плода характерно осенняя сбор урожая.
  fruit.pomegranate:
    label: грантовое яблоко
    summary: Красный плод с тысячей сладких зерен; символ фертильности.
    info: |-
      Гранатовое яблоко происходит из Центральной Азии и Средиземноморья
      Оно содержит более шестисот семян в прозрачной красноватой мякоти арилей,
      богата антиоксидантами;
      научные исследования рассматривают его влияние на сердце и воспаления.
  fruit.quince:
    label: кизилец
    summary: Жёсткий золотовистый плод, связанный с яблоками; используется исключительно при нагревании.
    info: |-
      {"hint":"желтый твердый ароматный плод (Pseudocydonia sinensis)","info":"Кизилец или кинканьиа сименсис (Pseudocydonia sinensis) близок по родству яблоне и грушевому дереву; сырой фрукт имеет плотную текстуру и неприятно горчит на вкус.
      Его всегда подготавливают термически для употребления в пищу: джем из кизильца (мармелад мембрело), вино из него же, спиртное напитки.
      Фрукт содержит большое количество пектина подходящего для производства желеобразных продуктов.
      The oldest recorded jam in Europe (15th century) was made using kizilitsy.","label":"кизилец","summary":"Твёрдое желтое дерево, связанное с яблоком; потребляется только после тепловой обработке."}
  fruit.rambutan:
    label: рамбутан
    summary: Красный пушистый тропический плод напоминающий личи
    info: |-
      Рамбутан происходит из Малайзии и название образовано от малайского слова 'рамбот' - волосы
      Его красная кожура покрыта мягкими шипами похожими на щетинку
      Мякоть прозрачная сладкая как у личи Также он богат витамином С и железом
  fruit.raspberry:
    label: ягодка
    summary: красный ароматический фрукт; символ весны на клумбе
    info: |-
      {"hint":"маленькая красная ягода из мелких костянок (Rubus idaeus)","info":"Малина (Rubus idaeus) - это составное сочание малых семечекных частей плодов растения Rubus idaeus.
      Растет дикорастущая и культурно выращенная;
      сбор урожаев происходит летом или осенью.
      Богата витаминами С и К,
      mangan и антиоксидантами.
      Классические блюда с клубникой:
      вареные компоты из черной смородины
      и чесноковые луковичные маринады."}
  fruit.starfruit:
    label: карамболь
    summary: Желтоватый тропический плод формирует формы звезд при резании.
    info: Карамбола появилась в Южной и Восточной Азии. При нарезке поперек она образует идеальную форму звезды (отсюда название «звёздный фрукт»). У нее кисло-сладкий вкус; содержит много витамина С.
  fruit.strawberry:
    label: клубника
    summary: Червонная шкварна бульба у формі серце.
    info: '{"hint":"красная ягодка сердечком с семенами на поверхности ( Fragaria x ананасса )","info":"Ягода земляника - любимое фрукт из розоцветных семейства. Богатый витамином С и антиоксидантами; собирается летом и имеет сладкий аромат.","label":"земляничный плод","summary":"Красное сочное ядро формы сердца."}'
  fruit.tamarind:
    label: имбир
    summary: Коричневый стручок с кисло-сладкой мякотью; основа тайландской кухни.
    info: '{"hint":"коричневая бобовая оболочка с кислым пюре (Tamarindus indica)","info":"Индийский имбирь (Tamarиндус индика) происходит из тропической Африки и сегодня выращивается по всему тропическому миру. Мякоть очень кислая и сладкая используется в рецептах Пад Тай, соевом соусе Ворчестерширского типа и Индии чатни. Слово происходит от арабского языка: тамр хинди означает индийское дольче. Он богат на уксусную кислоту натрий, витамины группы Б и железо."}'
  fruit.tangerine:
    label: манда́рин
    summary: Небольшой сладкий цитрус без кожицы
    info: '{"hint":"малый сладкий цитрус с мягкой кожурой","info":"Мандаринка - небольшое легко очищаемое плодовое дерево из семейства растений Citrus reticulate происхождением из Китая\r\nОн является символом китайского Нового года и удачи\r\nВ Чехии он считается типичным рождественским фруктом\r\nСодержит витамин С, антиоксиданты и флаВоновы"}'
  fruit.watermelon:
    label: arbuze
    summary: Big striped fruit with juicy red pulp inside.
    info: '{"hint":"огурец с зелеными полосами и красной мякотью","info":"Арбуз произошел из Африки и является популярным летним фруктом. Он состоит на 92% из воды и содержит ликопин, который придает ему красный цвет.","label":"арбуз","summary":"Большой плод с зелеными полосками и сочной красной мякотью."}'
