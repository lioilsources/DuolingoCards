lang: sa
pivot: false
title: फलम्
cards:
  fruit.ackee:
    label: आकीई
    summary: '''अकीई'', इकटा ऋषभ औषधीय फल जे जमैका केर राष्ठ्रीय फल ऐठ'
    info: अकीई जमैका केर स्थानिक प्रजन होइत अछि। मुख्य रूपेण उबले हएला पचहाला तथा फटयवंग बीजभाग खाए छल आऊ ऊष्मदण्‍ड वस्पशी भाँझ दः झिहास चढ़े घउ धोख शरीरक टौक्षण करैत अछि। 'अकीई' ओर 'सॉल्टफिश' जमैका केर राष्ठ्रीय डिश अछि।
  fruit.apple:
    label: जाम्बुकम्
    summary: गोल लाल अथवा हरित प्रसन्न खट्टे स्वाद के फल।
    info: जाम्बुकं मैलस डोमेस्टिका इति वृक्षः जन्मयति। यदि जगति एष फलः अधिकतम प्रचलिताः भारीपक्षः। एषः विटामिन C आणि उत्पादकता शक्तिं धरति; एकाधिक 7,500 प्रकार अस्ति।
  fruit.apricot:
    label: मेरुण्यका
    summary: एक प्रकारका नाशपातीफळ
    info: मेरुण्यका प्रजाति एवं सीतल में कृषिकर्म होने लगी।
  fruit.avocado:
    label: क़াশ৊ড়
    summary: उष्णकटिबन्धीय खरपतवाँ ; गुऐकमोले ई औषध
    info: "अवोकाडो एमेरिकना पीर्सिया मेक्षिको संस्‍थलयुग क्रमणि हर।\nबोटनिशतः इदं फलशच्च अपि तु रसभोजने वनस्पतिजन्य नख्मह। \nइष्टफल ओएईओआईडी लिंक उपयोग गुणधर्म आहार घटक भाण्द छिह।"
  fruit.banana:
    label: बनाना
    summary: एक पीला उष्णकटिबंधीय फल मीठे सुगर के साथ।
    info: बनाना है एक उष्णकटिबंधीय पौधों का फल जो आमरति परिवार से संबंधित है। यह पोटेशियम और प्राकृतिक चीनी से भरपूर होता है, जो त्वरित ऊर्जा प्रदान करता है।
  fruit.blackberry:
    label: '\U09ac\U09bf\U09aa\U09ca\U09af\U09d2 '
    summary: \.ईएफ\.टी ."ओष्ठश्शिरा गठित धापा
    info: "{\"\\U0985\\U09be \\U09a6\\U09c7\\U09b4\\U09bc\\U09cd \"(rubus frutosus)\") एक काले सुनहरा प्रज्ञप्ति होती है।\nविचलिक में जंगल के कच्छे और झाड़ियों में उभड़कर बढ़ती है। \nइसमें विटामिन c ,k आण्‍विय फाइबर की अधिक मात्रा होती है।"
  fruit.blueberry:
    label: बेरी
    summary: आधुनिक ऊर्जाप्रद औषधि
    info: |-
      बेरी जिम्बोनेटम् कॉला मानसिक प्रकुपति संगठन एवं हृदय स्वास्थ्य।
      अँथोशिअनिलजन् देति गहन आभा रञ्च शक्तिषण ऑक्सिडेंट धर्माण。
      उच्छ्वलिभष्ठ फलाहि खड़ि झाड़िफलाई ऋण घनघन ओढ़िए।
  fruit.cantaloupe:
    label: कांतलुपेन्सिज़
    summary: अछाह थोर ऋषभ रंग वाळा जालीदार ढंग के फल
    info: कांतलुपेन्सिज़ एशिया से मूल कथन हो। प्रसंगीयरम् 'काँटलुप' शब्द रोम के आखड़ित बजापी वाले काँटलुपो के अधिकाधिष्ठाता सभद्रवर्ग भए उच्चाटित कहई छल। इओकर फलफौण्ड के ओष्णिम ऑरेञ्ज रंग खस और विटामिन ई ऐठ ऊबढ़ झाि
  fruit.cherry:
    label: त्रेष्णे
    summary: छोटा गोल लाल पत्थरीय फल जो युगल में होता है।
    info: त्रेष्णे के फल पक्सिनस स्पीशीज़ के अंडर होते हैं, एक लोकप्रिय उन्माद ऋतु के फल के रूप में। इनमें एंटीऑक्सीडेंट और मेलाटोनिन होते हैं; खरबूजा तथा विशेष ओरिड्स भी होते हैं।
  fruit.coconut:
    label: कोनस
    summary: उष्णकटिबंधीय अखरड़ जे ढीला आऊर सफेद गोला धर घउठ
    info: "{\"\\u0958\\u09be \\U+0A4D\\u0967\": \"कोनस न्यूजिफेरा केसी समुदार महत्वपूर्ण प्रचलित हवय। बोटनिकि दृष्टिए इ हलगई अखरड़ आऊर ओएश भी गइथ।\r\nअछुआ जब उभंध चढऩे लगथे ई ऊफर छोर डामर खण्‍ड धर घउठ। \r\nकोनस ऑइल और कोनस मिळक झे शौर्थ एशिया आऊर भारतीय रसोई के आधार ऐ हवय।\r\nकोनस केपली के 'ओफर' ऋषि के ठाहर जाँई जाथे।\"}"
  fruit.cranberry:
    label: ब्रुसिन्का
    summary: '''ब्रुसिन्का'', ऐउ झि ऍठे ऊण्ण और उधे ऑर्गन ढेर ऋषि हथत।'
    info: |-
      ब्रुसिन्का वैक्सीनियम मेगाओरपों के सभ्य हलय।
      एगो पारंपरिक अमेरिकी खाद्यवस्तु 'दि' के घटक हथत。
      इज़्में प्रोअन्थोशाइनडिडिज़ होई बखचे एफः कोली आऊ शुष्ठि माध्मन के भिट्ह लगे फौहर छढ़े चाँओ।
  fruit.currant:
    label: रिपिझ
    summary: चीनी, काळी आणि सफेद गोठाचे छोटे धन
    info: "रिबेस नामक पौधे से क्लसों में हरीबुनता हलयमट्रवि फल।\tअश्वगंधा (एथलीटिक एफ़्फ़ेक्ट)\tहजारों अभियाँत्रित जड़ी"
  fruit.damson:
    label: डामस्केस्‍ना शवेष्टका
    summary: एङ्गलखण्डीय खेतों में पायी जाने वाली एक छोटी अपशबद्ध आइज़ी
    info: डामस्केन बेरी कमला होने प्रकृति में सुगंधित है।
  fruit.date:
    label: फीनिक्स डैक्टिलिपेरा
    summary: अखरड़ाई ब्राऊन गोलाच्छेद जो खजूर के पेड़ से आत हवे
    info: |-
      दातलीन्‍हि फूटेषु प्रसिद्धा सरकोज के हवे।
      एतच् मधुरं भयमपि अगणितशः वर्षान् उष्णदेशस्य आहारभूतम् एव।
  fruit.dragon_fruit:
    label: ड्राची फलम्
    summary: अधोभामा उष्णकटिपट ऐघोष्ठफल ओझ ईष्ट झलक ऊऊ
    info: ड्राची फलम् पितहया केन्द्रीय मेरकूस संबन्धि होत। इदं रुजःपीतवर्णकं आच्छाया एवञ्जल श्वेष्ट अश्लीषण गुणगाथा भए बढई डेकोरेसन खटखट घइथ।
  fruit.durian:
    label: दुरिऑन्‍स
    summary: उच्चगध ऊष्णकटिपट फल; प्रत्तमकोष के रजः
    info: |-
      दुरियन्‍स दूरिओ सीबेथाइनस हि प्रत्तमकोष के महा रजः।
      एवं उच्चगध एशिआय निवासिका अपलभ्धि लघु जटिल भाषण छथे;
      अनेक श्रीलंकाई बड़े गृह मेह घोषिण फल और खाडऩ ठठा टफल झाँई जामिस।
  fruit.feijoa:
    label: फेज़ियोअ
    summary: एक छोटा अण्डासदृश्‍ शब्बल लहजा
    info: |-
      फीजोआ एक प्रकार का स्थलमूत्रिका हरे फल है।
      इसका महुगना गंधवला स्वाद होता है।
  fruit.fig:
    label: फिक
    summary: खरबूज के रूप के खचड़ी अभिलेखन ; मधुर ओर धनुषक
    info: |-
      फिकस केराइका फल प्रजनन में सबसे पुरानी है। यह वास्तव में एक बोतल है जो हज़ारों छोटे पुष्पों से भरी हई।
      अदम्‍य और शशि के पत्र गगणपथ के कथा में आए हई।
  fruit.gooseberry:
    label: आंग्रेष्ठ
    summary: छोटा और घना छिपकला उठाओ झाड़ियों
    info: |-
      अंग्रेश्ट्‍ट एक पारदरशी हरित कमला सुखड़ियो मनसे।
      एतच्च इवृषणप्रधानं फलम् अभिजायते。
      इह विद्धमानं बीजं भाग्यबलाढ्यं लघुफलम् आहरणीयम्।
  fruit.grape:
    label: हर्ज़नो
    summary: छोटा गोल फल झुंड में पाउली से लगा होता है।
    info: विटिस विनिफेरा के झुण्ड अनेक रंगों में होते हैं - हरे से लेकर गहरे बैंगनी तक। इन झुण्डों को ताज़ा खाया जाता है, शुष्क करके राइसिन्स बनाए जाते हैं या उन्हें अंबर में दबाया जाता है।
  fruit.grapefruit:
    label: ग्रेपफँट
    summary: ऊष्णकटघरा चुभने जाहेर आउट घन
    info: |-
      ग्रेपफ़्रूट (सिट्रुज पेराडीजि), नारंगी का स्वच्छ हाइब्रिड होता।
      इनका उल्लेख 19वीं सदी में बरमैडोस में किया गया था。
      हल्दी और भौरे श्मशाक फल एलएआईपीओथीन तथा बीटा-कॅरोटीन धारण करते हैं।
  fruit.guava:
    label: गुअवा
    summary: उष्णकटिबंधीय भोज्य चीज घन खुशबू ओर श्वेषण ठठा
    info: |-
      गुआवा के पेड़ उष्णकटिबंधीय अमरीका से हैं। यह तोपाकि में एशिआ और ऑफ्रिका में फलता है।
      इसमें नारंगी के मुकावदे 4 गुना ज्यादा लघुथड़ाएच् होता है।
  fruit.jackfruit:
    label: १ঋত৏lয
    summary: |-
      ऊर्जा वाला বাপ্৳ फल;
      उछडऩे वाले वृक्ष पर उत्पन्न होए विश्व के सबले फल।
    info: |-
      चिल्होवनीक जाति के पौधा हरियला सुईदार महादाइय फळ उत्पन्न करथे। एगों अफ्रेड आसिया से ओमजबूआए गइल छल और भारत, बाँग्लादश व् थाईलण्ड में मुख्य खाध घटभाक चलत ऐठे।
      अपरिपक्व जामुओ के टेस्टर निष्ठल शामिल छल और मास झाणी ऑफर करथे,
      जबकि परिपक्व जामुओ के ऋषभ ऊपर चढ़ेल ढंग से स्वादघन व् आरमाञ्चक छल।
  fruit.kiwi:
    label: किवी
    summary: भूरे फफोले जगत ओषधि
    info: किवी च्यापला केंद्र से हुआ है। नईज़ीलंड में पहचानने और 'एक्टिडिएम' दोबरा रखने के बाद इसे अपने घरेलू पक्षी किवी के ऊपर भी ध्यात गया।
  fruit.lemon:
    label: "\U00013575 �콊짼쾡"
    summary: अग्निमण्डलजनित जलहरिणी फलफलिका
    info: |-
      सिट्रोन एक क्षारीय संतरे पृथक् हलचटि मधुपदम्।
      एषः विशेषतः आशिया सभवति।
  fruit.lime:
    label: लिमेटका
    summary: छोटे हरित अम्लीय ऑफल जे उष्णकटिबण्ड खाद्यपद्धतिपरक आहार में महत्वपूर्ण घटक छोड़
    info: लिमेटका एवं क्षारीय सुगन्धि प्रदरशित होते। मैक्सिकन्‍स, थःईएम्‍स अथवा वियतनान्‍स खाद्यपद्धतिपरक आहार में इष्ठ भाग लेहि। उच्च जीवजनित शब्बट डी फल छोड़ ऊष्णकटिबण्ड घटनाओं में झलखधर औषधि ऋण ढाँढ़िस ऐठे।
  fruit.longan:
    label: लङ्घन्‍स
    summary: एक छोटा भूरा उष्णकटिबंदीय फल लचि से संबंधित
    info: |-
      लंगन्‍स एक प्रकार के सब्जीविका है।
      इसमें मधुरता तथा गंधयुक्त स्वाद होता है।
  fruit.lychee:
    label: लिच्छी
    summary: अछि भारतमञि उज्झल धैर्घ्य फल
    info: |-
      लिच्छी एक प्रचुरता से हमेशापन कोशल मूळयवसंहार जखण्‍ड विस्तारिषि।
      एषा लघु नागपट्टगुफा अदृश्यभाबधर्मी देहँ आबढ़ई।
  fruit.mango:
    label: मांगो
    summary: उष्णकटिबंधीय फल जिसमें पीला-नारंगी गूदे के साथ हरियालीपन होता है।
    info: इंडिक मैंगो उष्णकटिबंधीय फलों के 'बादशाह' कहलाता है। इसमें विटामिन A और C भरपूर मात्रा में होता है एवं यह दक्षिण एशिया से आता है जहाँ इसे 4000 वर्षों से खेती की जा रही है।
  fruit.medlar:
    label: मिष्पुल
    summary: छोटा भूरा फल, जो आम के जैसा है।
    info: "मिशपुले एक प्राचीन सब्ज़ियों का पौधा है। मेस्पिलस्‍ गरमेनिका कहते हैं। इसे मध्य आवश्वकारण से उगाते थे।\nइसे खाने लायक बनाने के लिए 'ब्लट' करना अभिमथ है। फल को धड़ काटकर छोड़ दें और झुलसे डाल भीख घल जाओ। \nएकदम ठठाहर ढंग से ऊष्णक ऋतु में ऐसा करें। इसमें ऑफजन एच और विटामिन सी भरपूर होता है।"
  fruit.melon:
    label: मेलौन
    summary: ओरेञ्ठ, हरित किम्बधर धुँआ डुशिट झैठ इको ऐठो और ऊर्जा देऩे वालो फ़ल
    info: "मेलौन्‍स के रूप में प्रख्यात Cucumis Melon हा एक सुषिr आणी अतिशय पाणवलंबी फळ आहे।\nअफगानिस्थानच्छोटी वरदाहर देखि जगभर उगवले गएलई। \nइथे ओजन चढे भाषा बरे घडे : Cantaloup, Honey Dew , Galia etc."
  fruit.mulberry:
    label: मोरश
    summary: मोरस जड़ी फल द्वारा चढ़े छाझे घणे ठठ्ढर ऊषा
    info: |-
      मोरस वृक्ष से प्राप्त हुई मनखेड़ी का एक प्रकार 'मोरश' है।
      mोरश के लिये अलग -अलग नाम हैं :पीत ,हरि और काळ ;इनमें काळ सबले खट्टे बदवा भए हय。
      भौतिक इतिहास मेँ मोरश के उगाओ धागा शिल्प के आधार थे।
  fruit.nectarine:
    label: नेक्टरिंका
    summary: बिजली आऊर शखरा भरपूर गठन
    info: |-
      नेक्टरिनका हे प्राइमस पीरुशिया वॉयर। न्युचि पोषिचिओ कल संजगत महासभा अछि।
      एई बड़वटा तथा लघुपर्ण फलदार झाड़ी छलइ।
  fruit.orange:
    label: पोमेलो
    summary: गोल नींबू प्रकार का फल जिसमें सुगंधित नारंगी छिलका होता है।
    info: पोमेलो एक दक्षिणपूर्व एशिया में मूल नींबू के परिवार का फल है और आज इसे पूरे विश्व में उगाया जाता है। यह विटामिन सी से भरपूर होता है और इसे अक्सर रस के रूप में पसंद किया जाता है।
  fruit.papaya:
    label: फल
    summary: ओष्णदेशीय भारी बच्चा
    info: |-
      पापैया के फल में प्रोटीन संस्थिति हर पायता ह।
      वह विटमिन-C ,बीटा -कॅरोटीन आऊर एण्टीऑक्सड़एन्ड्ज लगभग हुआई ह।
  fruit.passion_fruit:
    label: मुचेनका
    summary: उष्ण कटिबंधीय वृक्षफल येसकर झड़ीभर आब श्याम चढ़े छठि एवं भापए खण्ड धारण करछि
    info: मुचेनका उष्ण कटिबंधीय पौरातन सद्रव मे होति। इसके फल मे गंधहीन जेल मे घिरे अपामईँ दशगजखण्ड होथे।
  fruit.peach:
    label: भरखण्डा
    summary: ऊषा तथा उत्पल लघुफल
    info: |-
      प्रुनस पर्सिका चीन से है।
      इसकी मेषदार कोमलता विशिष्ट है।
      श्याम एवं पीले बरसिम भी होते हैं ; नेकटरीन्‍य सजहँ अछि जे छगड़ा खचर घलई गएबा।
  fruit.pear:
    label: हरुश्का
    summary: अंसू के आकार में स्वादिष्ट हल्की स्वाद वाला फल।
    info: हरुश्का पाइरस जीनस के एक प्रजाति का फल होता है, खासकर हरुश्नें ओबेशने का, जो कि अप्पल के बहुत निकट होता है। यह नरम, रसदार और उच्च फाइबर युक्त होता है; इसके सौ भिन्न भिन्न प्रकार होते हैं।
  fruit.persimmon:
    label: ओशन डाइऑस्पोइरोस ककी
    summary: आउफल ऑरेञ्ज ऐड थम्ब झाँझ ढंग ऊठत छल
    info: "तोमेल्‍ल जापानी ककि हर्मनिया मुख्यतः से प्रचलित है।\nअपरिपकव फल खट्टा एवं चिकना होता है अथवा परिपक्व शहद भयांबुध्दि गजगणिष्ठ रस धर्मी होता है। \nएष आई बी और सी घटक ऋद्ध ओषधिसभ्य उपयोगी छल।"
  fruit.pineapple:
    label: अनानस
    summary: उष्णकटिबंधीय फल जिसमें सुईदार मुकुल होता है और पीले रंग की भीतरी झिल्ली।
    info: अनानस दक्षिण अमेरिका से उत्पन्न हुआ था और अब इसे विश्वभर के उष्णकटिबंधीय क्षेत्रों में खेती की जाती है। यह एनज़ाइम ब्रोमेलेन धारण करता है जो पाचन में सहायता करता है।
  fruit.plum:
    label: श्वेस्तका
    summary: बौड़ आकार के गोल और उखाणे घेरिओ खाइए झािल ऊष्ठ ऋतु के थोर ऐउठइ ऑओ ढे बौढ़ फल
    info: श्वेस्तका प्रचलित फल है। सुगंधीत मदिरामय कवरेरोमनस्‍टि (प्रुनसः डोमेष्टिका), जहाँ श्लियोफिचिए नामक अभिधाप्रणालि द्बाहिं भजिञ्छथ।
  fruit.pomegranate:
    label: grāṇṭōvē jaṃblau
    summary: लाल फल िजे हजारों मीठे बीज ाछि
    info: |-
      ग्रानेट फल पूर्वी एशिया से मध्यपृथक् क्षेत्रोंमें हुआ।
      इसमेसँ 4500 से अधिक बीज होतयनि जे चमचमईला लाल गोष्ठि(अरिळ)
      mेहवेदी और शोघिरण घटाईए;
      eह उद्भिड़ आउब्मेण्ट ऑफ इत्थ
      भापर खेध ओखड़ छठ झाऊ ऐओऊ ऋग्वेद ढेङ्गा
  fruit.quince:
    label: हरीमेव / Cydonia Oblonga
    summary: शराब ऊष्णता से खाध घण्‍ठिष्ठ
    info: |-
      क्यूडोनिआ ओबलंगा के प्रजाति हरीमेव मुख्यतः सफेद फल जहाँ अपवाहय।
      असभ्य रूप से उष्णता से बदल गए भोजन निम्पटन और शराब एवं लेटिक डजिस चढ़ाई जाई।
  fruit.rambutan:
    label: रामबुतन्‍य
    summary: ऐलची के समान चमचमदार बाहरी ठठा वाळा एगों उष्णकटिपट फल
    info: "रामबुतन्‍य रेडियो हैलीक्ट्रम मले से प्रसिद्धि का एगों फल हवए। 'रांभट' शब्द मलय भाषा सँ आई हथपड़िय जइत के बाल कहे वाला अर्थ हवए।\nओकर चमचमदार ऊखल नरम तथा खास छोटे झुण्डे सँ ढकल गेल हवए। \nफल के घनघोर और मधुर उषा ओजन इश ऐलची के समान हवए।"
  fruit.raspberry:
    label: मलिना
    summary: एक चमचमीत रक्तश्वेष्ठ आकृति ; इसका प्रतीक घर में दिन धरा
    info: |-
      मलिना एक संयुक्त प्रापर होती है जो कई छोटे मेंड़िबनस्‍व (द्रुपलेट्स) से बनी होती है।
      इसकी खेती वन में भी और फलखेड़ा में उगाया गया है;
      फलहरण शरदऋतु अथवा लेकिम ऋतु में होता है।
  fruit.starfruit:
    label: करंबोला
    summary: "'करंबोला', जिसे 'आवरोऊ ढढ़िया करंबोला' कहत, \nएक पीला उष्णकटिबंधीय फल होत जिसे कटाने पर अष्टभुज बनत"
    info: |-
      करंबोला दक्षिणी एवं पूर्वपश्चिम के समुदायन में होत।
      इसे कटाने पर आयत रहित अष्टभुज भी बनत है (अतः इसे 'एस्ट्रोफ्रॉई' कहत)
      उच्छ्वासगुण शीघ्र गुड़िय लखने ओर जठराघन्‍य ऊष्ठिक फल खाहिड़,
      ओछा ऑक्झेलेट धारिपने कारण ऐथर थाँब औषधि ऋणात्मक असर देत
  fruit.strawberry:
    label: जाहोड़ा
    summary: हर्बल रूप में संतुलित हीमगुण वाले एक फल के जैविक प्रभाव।
    info: एक अनुकृति उद्यानिक जाहोड़ा आसन्न गुणधर्मों और शरीर के चयापचय के लिए उपयोगी घटकों से भरपूर होती है। इसमें विटामिन सी और ऑक्सीडेण्ट धारक भी होते हैं; गर्मियों में इसकी खेती की जाती है और इसका स्वाद मीठा तथा ऊष्ण होता है।
  fruit.tamarind:
    label: तम्बॊला
    summary: '''भृगु'' गणि फल द्वारा धड़कने वाला ऐसा झाँठ जो छाहले ढंग से ठंढऩे वाळा होई'
    info: तामरहिंदी तम्बॉला के पेड़ से होने वाला मसाला। यह अफ्रीका से आया हुआ है और इसका चटपटा एवं मधुर रस थाई खाना 'Pad Thai', ऑउशरचेस्टर शौषब्‍ज ओमेज घटिका भी है।
  fruit.tangerine:
    label: मंदारिनका
    summary: एगो मधुर फल जसकि चट्यालीपन्‍य तथा शहज़ाड़ अछि
    info: मंदारिनका एवं स्वच्छ कीनेटरले प्रतीक है।
  fruit.watermelon:
    label: वोदनी मेलौन
    summary: बड़ा हरे रंग के पट्टियां वाला फल जिसमें चुसकी भरी लाल बीज और काले बीज होते हैं।
    info: वोदनी मेलौन अफ्रीका से आता है और गर्मियों के एक लोकप्रिय फल के रूप में जाना जाता है। इसका 92% भाग पानी से बना होता है और इसमें लाल रंग देने वाला लाइकोपीन होता है।
