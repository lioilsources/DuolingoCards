lang: nb
pivot: false
title: Frukt
cards:
  fruit.apple:
    label: eple
    summary: En rund rød eller grønn frukt med søtsyrlig smak.
    info: Eplet er frukten fra epletreet, en av verdens mest dyrkede vekster. Det inneholder C-vitamin og fiber, og det finnes mer enn 7 500 sorter.
  fruit.banana:
    label: banan
    summary: En gul tropisk frukt med søtt fruktkjøtt.
    info: Bananen er frukten fra en tropisk plante av bananfamilien. Den er rik på kalium og naturlig sukker som gir rask energi.
  fruit.orange:
    label: appelsin
    summary: En rund sitrusfrukt med duftende oransje skall.
    info: Appelsinen er en sitrusfrukt med opprinnelse i Sørøst-Asia, i dag dyrket over hele verden. Den er rik på C-vitamin og elsket som juice.
  fruit.strawberry:
    label: jordbær
    summary: Et rødt, saftig, hjerteformet bær.
    info: Jordbæret er en elsket frukt av rosefamilien. Det er rikt på C-vitamin og antioksidanter og høstes om sommeren.
  fruit.grape:
    label: drue
    summary: Et lite rundt bær som vokser i klaser.
    info: Vinranken gir druer i ulike farger, fra grønt til mørkelilla. Druer spises ferske, tørkes til rosiner eller presses til vin.
  fruit.watermelon:
    label: vannmelon
    summary: En stor grønnstripet frukt med rødt saftig fruktkjøtt.
    info: Vannmelonen kommer fra Afrika og er en elsket sommerfrukt. Den består av 92 % vann og inneholder lykopen, som gir den dens røde farge.
  fruit.mango:
    label: mango
    summary: En tropisk frukt med saftig guloransje fruktkjøtt.
    info: Mangoen kalles de tropiske fruktenes konge. Rik på A- og C-vitamin kommer den fra Sør-Asia, der den har blitt dyrket i 4 000 år.
  fruit.cherry:
    label: kirsebær
    summary: En liten rund rød steinfrukt som vokser i par.
    info: Kirsebæret er frukten fra søtkirsebærtreet, en elsket sommerfrukt. Det inneholder antioksidanter og melatonin, og det finnes søte og sure sorter.
  fruit.pear:
    label: pære
    summary: En dråpeformet frukt med søt, mild smak.
    info: Pæren er frukten fra pæretreet, en nær slektning av eplet. Den har mykt, saftig fruktkjøtt og et høyt fiberinnhold, og det finnes hundrevis av sorter.
  fruit.pineapple:
    label: ananas
    summary: En tropisk frukt med en tornet krone og gyllengult fruktkjøtt.
    info: Ananasen kommer fra Sør-Amerika og dyrkes nå i tropene over hele verden. Den inneholder enzymet bromelain, som hjelper fordøyelsen.
  fruit.lemon:
    label: sitron
    summary: En sur gul sitrusfrukt; en kilde til C-vitamin og aroma.
    info: |
      Sitronen er en sur sitrusfrukt med opprinnelse i Asia.
      Den er rik på C-vitamin og sitronsyre.
      Den brukes i matlaging, i drikkevarer, i kosmetikk og i rengjøringsmidler.
      Skallet fra sitrontreet inneholder en eterisk olje med karakteristisk sitronduft.
  fruit.lime:
    label: lime
    summary: En liten grønn sur sitrusfrukt; en nøkkelingrediens i det tropiske kjøkkenet.
    info: |
      Limen er en liten grønn sitrusfrukt med sur saft og aromatisk skall.
      Den er uunnværlig i det meksikanske, thailandske og vietnamesiske kjøkkenet.
      Den inneholder mindre C-vitamin enn sitronen, men har en sterkere aroma.
      Å spise lime beskyttet sjøfolk mot skjørbuk takket være C-vitaminet.
  fruit.kiwi:
    label: kiwi
    summary: En brun lodden frukt med grønt fruktkjøtt; rik på vitaminer.
    info: |
      Kiwien kommer fra Kina, der den kalles kinesisk stikkelsbær.
      New Zealand kommersialiserte den og døpte den om etter sin nasjonalfugl, kiwien.
      Den inneholder dobbelt så mye C-vitamin som en appelsin.
      Fruktkjøttet er klargrønt; det finnes også gylne (gule) sorter.
  fruit.peach:
    label: fersken
    summary: En fløyelsmyk gulrød steinfrukt; et symbol på sommeren.
    info: |
      Ferskenen kommer fra Kina, der den er et symbol på udødelighet.
      Det myke fløyelsaktige skallet er karakteristisk.
      Det finnes hvite og gule sorter; nektarinen er den glatte, loddfrie varianten.
      I Kina inngår ferskener i nyttåret og i den helbredende mytologien.
  fruit.plum:
    label: plomme
    summary: En lilla steinfrukt; grunnlaget for plommebrennevin og plommemos.
    info: |
      Plommen er en grunnfrukt i Sentral-Europa.
      Slivovitz (plommebrennevin) er et tradisjonelt tsjekkisk og slovakisk brennevin.
      Plommemos er et typisk produkt av høstavlingen.
      I verden finnes det mer enn 2 000 plommesorter.
  fruit.apricot:
    label: aprikos
    summary: En liten oransje steinfrukt; søtsyrlig og saftig.
    info: |
      Aprikosen kommer fra Sentral-Asia.
      Den dyrkes i hele Europa; de søteste kommer fra Tyrkia og Spania.
      Den er rik på betakaroten og A-vitamin.
      Tørkede aprikoser er en elsket sunn snacks.
  fruit.raspberry:
    label: bringebær
    summary: Et rødt samlingsbær; et symbol på sommerhagen.
    info: |
      Bringebæret er et samlingsbær av mange små steinfrukter.
      Det vokser vilt og dyrket; høsten faller om sommeren og høsten.
      Det er rikt på C- og K-vitamin, mangan og antioksidanter.
      Bringebærsyltetøy og bringebæreddik er tradisjonelle delikatesser.
  fruit.blueberry:
    label: blåbær
    summary: Et mørkeblått bær; en supermat full av antioksidanter.
    info: |
      Blåbæret er rikt på antocyaniner, fargestoffer med sterke antioksidative egenskaper.
      Antocyaninene gir det den mørkeblå fargen.
      Studier tyder på en positiv effekt på de kognitive funksjonene og hjertehelsen.
      Dyrkede blåbær er større enn ville blåbær.
  fruit.blackberry:
    label: bjørnebær
    summary: Et mørkelilla samlingsbær fra bjørnebærbusken.
    info: |
      Bjørnebæret er et mørkelilla samlingsbær som vokser på en tornet busk.
      Det ville bjørnebæret vokser i skogkanter og kratt.
      Det inneholder mye C-vitamin, K-vitamin og fiber.
      Bjørnebærsyltetøy, kompott og likør er tradisjonelle produkter.
  fruit.coconut:
    label: kokosnøtt
    summary: En stor tropisk nøtt med hardt skall og hvitt fruktkjøtt.
    info: |
      Kokosnøtten er frukten fra kokospalmen; botanisk er den en steinfrukt, ikke en nøtt.
      Kokosvannet i den umodne frukten er en naturlig isotonisk drikk.
      Kokosmelk og kokosolje er grunnlaget i det sørøstasiatiske og indiske kjøkkenet.
      Kokospalmen kalles de tusen bruksområdenes tre.
  fruit.papaya:
    label: papaya
    summary: En stor tropisk frukt med dypt oransje fruktkjøtt.
    info: |
      Papayaen kommer fra det tropiske Amerika.
      Den inneholder enzymet papain, som fremmer nedbrytingen av protein.
      Den er rik på C-vitamin, betakaroten og antioksidanter.
      Umoden papaya brukes som grønnsak i det sørøstasiatiske kjøkkenet (som i salaten som tam).
  fruit.guava:
    label: guava
    summary: En tropisk frukt med intens duft og hvitt eller rosa fruktkjøtt.
    info: |
      Guavaen kommer fra det tropiske Amerika og har spredt seg over det tropiske Asia og Afrika.
      Den inneholder fire ganger mer C-vitamin enn en appelsin.
      Skallet og kjernene er spiselige; hele frukten er næringsrik.
      Guavajuice og guavasyltetøy er populære produkter i tropiske land.
  fruit.pomegranate:
    label: granateple
    summary: En rød frukt med tusen søte kjerner; et symbol på fruktbarhet.
    info: |
      Granateplet kommer fra Sentral-Asia og Middelhavsområdet.
      Det inneholder mer enn 600 kjerner omgitt av gjennomsiktig rødt fruktkjøtt (ariller).
      Det er rikt på antioksidanter; studier undersøker virkningen på hjertet og betennelser.
      Det symboliserer fruktbarhet og overflod i mange kulturer.
  fruit.fig:
    label: fiken
    summary: En pæreformet frukt fra fikentreet; søt og full av kjerner.
    info: |
      Fikenen er en av de eldste dyrkede fruktene; sporene går 11 000 år tilbake.
      Det er egentlig ikke en frukt, men et hylster fylt med tusenvis av små blomster.
      Adam og Evas fikenblader i den bibelske fortellingen er blader fra fikentreet.
      Tørkede fikener er en utmerket kilde til kalsium, kalium og fiber.
  fruit.date:
    label: daddel
    summary: En søt brun oval frukt fra daddelpalmen; en basismat i Midtøsten.
    info: |
      Dadler er de søte fruktene fra daddelpalmen.
      De har i tusenvis av år vært en basismat i Midtøsten.
      De inneholder mer enn 60 % sukker og er en utpreget energikilde.
      I islam spises dadler tradisjonelt først når man bryter ramadanfasten (iftar).
  fruit.melon:
    label: melon
    summary: En stor søt frukt med oransje, grønt eller hvitt fruktkjøtt.
    info: |
      Melonen er en tropisk til subtropisk frukt med høyt vanninnhold.
      Den kommer fra Afrika og Asia; i dag dyrkes den over hele verden.
      Den består av mer enn 90 % vann og er svært tørsteslukkende.
      Det finnes hundrevis av sorter, blant annet cantaloupe, honningmelon og galia.
  fruit.cantaloupe:
    label: cantaloupemelon
    summary: En nettmelon med dypt oransje fruktkjøtt.
    info: |
      Cantaloupemelonen er en elsket melonsort med opprinnelse i Asia.
      Navnet kommer fra den pavelige residensen Cantalupo nær Roma.
      Det oransje fruktkjøttet er rikt på betakaroten og A-vitamin.
      Den er en av de søteste melonsortene.
  fruit.grapefruit:
    label: grapefrukt
    summary: En stor bittersøt sitrusfrukt; en diettstjerne.
    info: |
      Grapefrukten er en krysning mellom appelsin og pomelo.
      Den ble beskrevet på Barbados på 1700-tallet.
      Rosa og rød grapefrukt inneholder lykopen og betakaroten.
      Grapefruktjuice påvirker mange legemidler; pasienter bør informere legen sin.
  fruit.tangerine:
    label: mandarin
    summary: En liten søt sitrusfrukt med løst skall; et symbol på julen.
    info: |
      Mandarinen er en liten, lettskrellet sitrusfrukt med opprinnelse i Kina.
      Den er et symbol på det kinesiske nyttåret og på lykke.
      I mange land er den en typisk julefrukt.
      Den inneholder C-vitamin, antioksidanter og flavonoider.
  fruit.passion_fruit:
    label: pasjonsfrukt
    summary: En tropisk frukt med rynket skall og aromatisk, kjernerikt fruktkjøtt.
    info: |
      Pasjonsfrukten kommer fra det tropiske Sør-Amerika.
      Navnet kommer fra misjonærer som så symbolene på Kristi lidelse i blomsten.
      Fruktkjøttet er fullt av kjerner omgitt av en aromatisk gelé.
      Den er en utmerket kilde til C-vitamin, fiber og antioksidanter.
  fruit.lychee:
    label: litchi
    summary: En liten rød tropisk frukt med gjennomsiktig fruktkjøtt; elsket i Asia.
    info: |
      Litchien er en tropisk frukt med opprinnelse i Kina.
      Det ru røde skallet er lett å skrelle og avslører et gjennomsiktig hvitt fruktkjøtt.
      Den har en søt, fint aromatisk smak.
      I Kina er den et symbol på lykke og velstand.
  fruit.dragon_fruit:
    label: dragefrukt
    summary: En rosa tropisk kaktusfrukt med hvitt prikket fruktkjøtt.
    info: |
      Dragefrukten (pitaya) kommer fra Mexico og Mellom-Amerika.
      Det klart rosa skallet og hvite fruktkjøttet med svarte frø er svært dekorative.
      Den har en mild smak og inneholder antioksidanter og C-vitamin.
      Av den lager man juice, smoothies og dekorative desserter.
  fruit.starfruit:
    label: stjernefrukt
    summary: En gul tropisk frukt som danner stjerner når den skjæres.
    info: |
      Stjernefrukten kommer fra Sør- og Sørøst-Asia.
      Skåret på tvers danner den en perfekt stjerneform, derav navnet.
      Den har en søtsyrlig smak og er rik på C-vitamin.
      Personer med nyresykdom må ikke spise den på grunn av oksalatene.
  fruit.avocado:
    label: avokado
    summary: En kremet tropisk steinfrukt; grunnlaget for guacamole.
    info: |
      Avokadoen kommer fra Mexico og Mellom-Amerika.
      Botanisk er den en frukt (en steinfrukt), men kulinarisk brukes den som grønnsak.
      Den inneholder sunne enumettede fettstoffer (oljesyre), akkurat som olivenolje.
      Den er en trendy sunn mat over hele verden; avokadobrødskiven er et ikon for den moderne kafékulturen.
  fruit.persimmon:
    label: persimon
    summary: En oransje tomatlignende frukt; søt og snerpen.
    info: |
      Persimonen kommer fra Kina og Japan; den kalles også kaki.
      Umoden persimon er garvesyrerik og snerpen; moden er den søt som honning.
      Den er rik på A- og C-vitamin og på mineraler.
      I Japan er den en tradisjonell høstfrukt.
  fruit.mulberry:
    label: morbær
    summary: Et mørkelilla bær fra morbærtreet; silkesommerfuglens føde.
    info: |
      Morbæret er bæret fra morbærtreet; morbærtreets blader er silkesommerfuglens føde.
      Det finnes hvite, røde og svarte morbær; det svarte er det søteste.
      I historien var dyrkingen av morbærtrær avgjørende for silkeproduksjonen.
      Morbær er rike på resveratrol, C-vitamin og jern.
  fruit.cranberry:
    label: tranebær
    summary: Et lite rødt surt bær; en tradisjonell amerikansk ingrediens.
    info: |
      Tranebæret er et lite surt rødt bær.
      Det er en tradisjonell del av den amerikanske Thanksgiving (tranebærsaus).
      Det inneholder proantocyanidiner, som hindrer E. coli-bakterier i å feste seg til veggene i urinveiene.
      Tranebærets virkning på å forebygge urinveisinfeksjoner er vitenskapelig underbygget.
  fruit.gooseberry:
    label: stikkelsbær
    summary: Et lite rundt gjennomsiktig bær; en hagefavoritt.
    info: |
      Stikkelsbæret er en liten frukt typisk for hager i Sentral-Europa.
      Det finnes i grønne, røde og gule sorter.
      Det er rikt på C-vitamin.
      Stikkelsbærvin er en historisk elsket drikk.
  fruit.currant:
    label: rips
    summary: Et lite rødt, svart eller hvitt bær i en klase.
    info: |
      Rips er et lite bær som vokser i klaseformede klaser.
      Solbær inneholder mest C-vitamin av alle bær.
      Solbær er grunnlaget for smaken i cassislikør og i den britiske drikken Ribena.
      Rødt rips brukes i syltetøy og som pynt på desserter.
  fruit.quince:
    label: kvede
    summary: En hard gul frukt i slekt med eplet; spises alltid tilberedt.
    info: |
      Kveden er i slekt med eplet og pæren; rå er den hard og snerpen.
      Den bearbeides alltid ved oppvarming til kvedegelé (membrillo), kvedevin eller kvedebrennevin.
      Den inneholder mye pektin, godt egnet til å lage syltetøy.
      Den eldste i Europa dokumenterte marmeladen (1500-tallet) ble laget av kveder.
  fruit.jackfruit:
    label: jackfrukt
    summary: En enorm tropisk frukt; verdens største frukt som vokser på et tre.
    info: |
      Jackfrukten gir de største fruktene som vokser på et tre; de kan veie mer enn 35 kg.
      Den kommer fra det tropiske Asia og er en basismat i India, Bangladesh og Thailand.
      Umoden jackfrukt har en nøytral konsistens og brukes som et vegetarisk kjøttalternativ.
      De modne gule bitene er søte og aromatiske.
  fruit.durian:
    label: durian
    summary: En stor tornet tropisk frukt med sterk lukt; de tropiske fruktenes konge.
    info: |
      Durianen kalles de tropiske fruktenes konge.
      Den sterke lukten er frastøtende for noen og fristende for andre; på mange asiatiske hoteller er den forbudt.
      Fruktkjøttet er kremet og søtt med en kompleks smak av mandel, vanilje og ost.
      I Sørøst-Asia verdsettes den som en forfinet luksus.
  fruit.rambutan:
    label: rambutan
    summary: En rød lodden tropisk frukt, som ligner litchien.
    info: |
      Rambutanen kommer fra Malaysia; navnet kommer fra malayisk rambut, som betyr hår.
      Det røde skallet er dekket av myke, krokformede utvekster.
      Fruktkjøttet er gjennomsiktig og søtt, akkurat som litchien.
      Den er rik på C-vitamin og jern.
  fruit.longan:
    label: longan
    summary: En liten brun tropisk frukt, i slekt med litchien.
    info: |
      Longanen er frukten fra et tropisk tre med opprinnelse i Kina.
      Navnet kommer fra kinesisk long yan, som betyr drageøye, på grunn av det gjennomsiktige fruktkjøttet med en svart kjerne.
      Den har en søt og aromatisk smak.
      I den tradisjonelle kinesiske medisinen regnes den som en mat som styrker blodet og hjertet.
  fruit.tamarind:
    label: tamarind
    summary: En brun belgfrukt med surt fruktkjøtt; en base i det thailandske kjøkkenet.
    info: |
      Tamarinden kommer fra det tropiske Afrika; i dag dyrkes den i hele tropene.
      Fruktkjøttet er sterkt surt og søtt; det brukes i pad thai, worcestersaus og indisk chutney.
      Ordet kommer fra arabisk tamr hindi, som betyr indisk daddel.
      Den er rik på vinsyre, B-vitaminer og jern.
  fruit.nectarine:
    label: nektarin
    summary: En glatt loddfri fersken; saftig og søt.
    info: |
      Nektarinen er en naturlig mutasjon av ferskenen med glatt skall.
      Den skiller seg fra ferskenen bare ved genet for skallets glatthet.
      Den har en lignende smak, men en fastere struktur.
      Navnet kommer fra gudenes nektar og vitner om dens antatte fullkommenhet.
  fruit.damson:
    label: kreke
    summary: En liten mørk plomme, typisk for engelske landhager.
    info: |
      Kreken er en liten, mørkeblå-svart plommesort.
      Navnet damson kommer fra Damaskus, der frukten kom til Europa fra.
      Rå er den svært sur, men utmerket i syltetøy, mos og gin (damson gin).
      I den engelske tradisjonen har den blitt dyrket siden oldtiden.
  fruit.medlar:
    label: mispel
    summary: En liten brun frukt i slekt med eplet; må ettermodne etter innhøsting.
    info: |
      Mispelen er en eldgammel hageplante som har blitt dyrket siden middelalderen.
      Den er først spiselig etter å ha blitt myk (bletting), altså etter ettermodning etter innhøstingen.
      Den er rik på garvestoffer og C-vitamin.
      Shakespeare nevner den i Romeo og Julie; i dag er den snarere en kuriositet for hagedyrkere.
  fruit.ackee:
    label: akee
    summary: En rød tropisk frukt med spiselige gule ariller; Jamaicas nasjonalfrukt.
    info: |
      Akeen er Jamaicas nasjonalfrukt; den er oppkalt etter kaptein Bligh (1793).
      Bare de modne gule arillene er spiselige; umoden eller overmoden frukt er giftig (hypoglysin A).
      Ackee and saltfish er Jamaicas nasjonalrett.
      Den kommer fra Vest-Afrika og ble brakt til Karibia gjennom slavehandelen.
  fruit.feijoa:
    label: feijoa
    summary: En liten oval grønn frukt med aromatisk fruktkjøtt.
    info: |
      Feijoaen kommer fra Sør-Amerika.
      Fruktkjøttet har en intens aromatisk smak av ananas, guava og mynte.
      Den er svært populær i New Zealand som høstfrukt.
      Den er lite kjent i Europa, men elsket i opprinnelseslandene.
