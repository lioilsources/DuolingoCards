lang: ha
pivot: false
title: Kuswaren Duka
cards:
  fruit.apple:
    label: jablko
    summary: Kulai da kusan daga cikini ya'ayi ta hawwa.
    info: Jablan yauwanda Malus domestica, wani kulai tare da sheyuka na vitamin C da fiber; wajen gaba 7,500 mutum.
  fruit.banana:
    label: banán
    summary: Zuttawa tropsik da kuka sukkur.
    info: Wakarko banán ne wace guda daga musa species. Wakarko ya za muhimman kalium da sukka amma, ku sauri yake mutum.
  fruit.cherry:
    label: třešeň
    summary: Mai kamanta da yawa da aduwa wanda ya nuna zuwa biyu.
    info: Tresheni ne plodi na treshine ptaci, mai kamanta da yauka ga watinsu. Wajasa antiosidanin da melatonin; wane da ke tsaye da wanne da ke gaba (plum).
  fruit.grape:
    label: hrozno
    summary: Mai kushe ga zaune da yake da ke baki dinsu.
    info: Wargi Vitis vinifera ya haifar da gwarzo da farko ne kafin mutum - min jali zuwa kafin tsauro. Gwarzo da farko ne yana iya kamata, sun iya guzauka zuwa rozinko ko sun iya lisa zuwa wina.
  fruit.mango:
    label: mango
    summary: Tropskò gwo mai yawa-oranje da dukkan ya so.
    info: Mango Indikiya wane ne 'baši tropsik mai gwo'. Ya ke amfani da witamin A da C ta kuma ya kai hausa Southern Asia, kamar wanda ya farauka she 4000 senne.
  fruit.orange:
    label: oranj
    summary: Gororin fruktu citruse da kuma ya canza wajen ran oranji.
    info: Oranj ne kulerey cinitsunai ran suka Aisia guddo, kuma ya canza wajen ran don so da kofar din. Ya bawa sheyin vitamin C da ke amfani da su kan dausu.
  fruit.pear:
    label: Piruse
    summary: Fruit na sauran gaga da karsain suwa.
    info: Pirusen ne wani dukkan ya kamata halke, yake da shakkin sheyoyi kuma ya zacewaka tsamman jarra. Wuce wajen yau da adanaiya ga'acinen hausa.
  fruit.pineapple:
    label: ananas
    summary: Pilaniya ta hanyar karkashen gwoza da dukkan ya can zauro don yawa.
    info: Ananas kayai ne Amina Afirka da suka wajen kuma sun fi amfani da wa don jihar halbakin hanyar karkasha na duniya. Wanda mafiyan she kamfa'insu ne bromelain, enzim ta ke fara jawi.
  fruit.strawberry:
    label: jahoda
    summary: Červená šťavnatá bobule ve tvaru srdíčka.
    info: Jahoda zahradní ye wajeta haifar da sukan rosaceae. Ya kafin vitamin C da antioksidanti; ya yake da wasu da sauri na haskina da ke amfani da har da gudun.
  fruit.watermelon:
    label: melon wani
    summary: Wajen gida guzabe da zai kafin duka sheyewa.
    info: Melon wani yake cikin Afrom na jincin da ya kamatawa daga Afrika. Ya ne 92% mafiya da ya hausa lykopene, ya kafe masu hau'ulor.
