lang: fa
pivot: false
title: میوه ها
cards:
  fruit.ackee:
    label: اکیه
    summary: مرغوب رز رویاندار با لاتار زردرنگ خوردنشدن؛ موزۀ ملی جامائیکا
    info: اکیه (بلیگیا سپیدا)، موزۀ ملی جامائیکاست که به ناحق بلایج اسحاق دادن شده است؛ فقط قسمت‌های زرد آمادهٔ خوردن غذیرند و بخش های تازه، فاسد یا پوسفروشته سمی با حاوی «هموغلisin» هستند.
  fruit.apple:
    label: جُلبَك
    summary: ميوه اي قرمز يا سفيد رند كمي ترش.
    info: سیب مثمر از درخت سیب خانگی است، که به عنوان یکی از محصولات باغ‌داری پرورش زیادی روی دنیا وجود دارد و حاوی ویتامین C و الیاف غذایی می باشد؛ نژاد های مختلف آن بالغ بر ۷٬۵۰۰ نوع است.
  fruit.apricot:
    label: merunka
    summary: گوشت قرمز محصولات پسته‌دار مثل مرزه، عطر طعم حلوخال و ترشاب وجود داشته.
    info: مرزه‌ها اولین بار در آسیای مرکزی کشت می‌شدند و الان به خوبی در تمام مناطق جغرافیائی، شامل ترکیه و اسپانیا نیز رواج دارد؛ همچنین فراموش نشود که سبزیت زرد باعث غذاء شدن مواد لازمهٔ بتا-karoten و ویتامین A است.
  fruit.avocado:
    label: افوكادو
    summary: گوجه رندي با لاشة سفيد كرمي؛ موادي جهانياً معروف برای سلامتي.
    info: افوكادو از مکسیко و آمریکای مرکزی نشأت دارد، باغبانی به عنوان پدیداره غذائی طبیعی است ولی در کولینری مثل سبزی‌ها استفاده می شود. حاوی روغن ها تکتنه خوب(مثلاً اسید الئیک)، مشابه زيتون است.
  fruit.banana:
    label: بنان
    summary: درخت جوشال با دسته بلندمنحنی زرد.
    info: بنان میوه‌ای است که از درخت تاجور به نام خانوادهٔ بنابوتیدها آمده و غنی از پتاسیوم و قند طبیعی، منبع سریع انرژی را فراهم می‌کند.
  fruit.blackberry:
    label: برز
    summary: كشككه مرمرى مشابه يك اندازي كوچيك كشيده شده.
    info: برگلیس فروتیکوس رزوم است که این ميوه تاري كشمشي قرمز درختان سرخ شاخ و برگ دارد، برشته ها به صورت طبیعى روی حاشيه جنگلى و مناطق پوشیده با بوته‌ها رشد میكند. اين محصول غنى از فيتوستيرول بالايى مثل ويتمين سي، كلسيم و اليفات نيز وجود دارند.
  fruit.blueberry:
    label: blueberry
    summary: سبزی غذایی با طعم لطافت؛ منبع عالی مواد ضدوکس.
    info: بلوبری درختکوهانه، کریمبوسوم برای مزرعه‌ها)، حاوی آنتو سیان هستند. این ترکیبات به رنگ نارنجی و خواص ضد اكسیداسیون بلبری داده شده است. پژوهش‌ها مؤثر بودن آن روی عملكرد فكري و قلب را نشان داده‌است.
  fruit.cantaloupe:
    label: کانتالوپ
    summary: خرمال شبکه‌دار طلا-قهوه‌ای با جوشیدگان عمیقاً روشن.
    info: کانتالوپ (Cucumis ملو واریتاس کنتلوبنسس)، نژاد معروفی از خرماست که منشأ آن در آسیا است. عنوان «کانتالوپ» به دلیل محل سکونت پاپ، شهر کنتالوپوس قرب رم مشتق شده‌است. ترشح داخلی زرد بافت غذایی بالغ بر بتاکاروتین و ویتامین A فراهم می‌آورد.
  fruit.cherry:
    label: تُرهَشِنه
    summary: ميوه قرمز كروي كوچك با زوجهاي مشابه.
    info: چرکه از میوه ترشینه پرنده، که به عنوان سبزی جوجه‌ای معروف است و در فصل گرم رشد می‌کند؛ حاوی آنتیاکسیدان ها و متالونن است؛ نژادهای شیرین و خوشمزه و غلیظ وجود دارد.
  fruit.coconut:
    label: کاکائو
    summary: دانه چاق و گرم با قشر ضخیم و لازمهٔ سفت.
    info: |-
      کاکائو (coco نیفرا، Cocus cocos ) میوه کاج سبز است؛ این به طور علمی دانه و غیر هستند بلکه تخم مرغ راست باشد
       آب داخل فرآمدهای جوان در حال رسیدن حاوی الکترولیت‌ها بوده و مناسب برای شرب است
       شیر و روغن کاکائو پایه خوشمزگی جنوب شرقی آسیا و هند هستند
       کاج سبز «درخت زندگی» معروف است
  fruit.cranberry:
    label: برق‌بادک
    summary: ميوهي قرمزي كوچكي؛ يك غذا ايديالي در مراسم تشكر.
    info: برق‌بادکه قرمز ترش و کوچکی است، این ميوه به عنوان سالاد برقي بادك در جشنواره تشکر آمريكا معروف است. دارای پروآنتوسايانيدين هستند كه باعث جلوگيرى نشستن باكتري Escherichia Coli روی ديواري موچ روديه مي شوند.
  fruit.currant:
    label: ribis
    summary: ريبيس يك نوع ميوه كوتاه، قرمز، سياه يا سفيد است.
    info: ریبیس به معنای ميوه‌اي است کوچک با رنگ قرمز، سياه يا سفيد که در توده ها روست. اندازه اين محصول بسيار نازل و فشرده است.
  fruit.damson:
    label: دماسک
    summary: نوع کوچک مرزدار مشخص برای حشرات روستای انگلستان.
    info: شامسونی (دمسن) نوع کوچک، آبی تیره و سیاه مروارید است. نام این پرتقال‌مرز به دلیل منشا در شهر دمشق بوده است که بعداً به اورپا رفته است. خوشمزگی بالایی وقتی با جله، شربت ها و الکل مثل ژان قابل مقابله است.
  fruit.date:
    label: خرم
    summary: محصول طبیعی کرم رنگ و مستطیل شکله؛ موادغذائی حاوی انرژی بالاست.
    info: خرما، به نام علمی Phoenix دکتِلِفرا هستند و مزه‌ای شیرین با عطر خاص دارند. این محصولات قرنها است در منطقۀ جنوب غرب آسیا بعنوان پروتئین مهم تلقی میشوند.
  fruit.dragon_fruit:
    label: میوه اژدها
    summary: صورتی جوش شیرین درخت خرما با لبافته سفید.
    info: میوه اژدها (پتایه، هائولوسِرس) از مکسیک و آمریکای مرکزی نشأت دارد. پوست رنگارنگ صورتی‌اش با فلش سفید به همراه تخم‌چین کالبد قابل مقصر است؛ طعم براقی دارد و حاوی مواد ضد اكسيدان و ویتامین C است.
  fruit.durian:
    label: دیریان
    summary: بزرگترین موزدار حاوی بوی قوی است.
    info: دیریان به دلیل عطر قوی‌اش معروف است که برای بعضی تابناک و جذاب، اما برای سایرین ناخوشایند؛ در بسیاری از هتل‌ها در آسیا ممنوع شده است. فروت داخلش رنگ خامه‌ای با طعم پخته و غمگین مثل زردآلو، وانیل و پنیر است.
  fruit.feijoa:
    label: فِجُوا
    summary: محصول صفت قلبی، سبز با لازمهٔ عطرو.
    info: فیوآ به نام علمی Acca سللوئینا، از آمریکای جنوبی مبدأ دارد و در زمین‌های منشأ خود بسیار معروف است. پوشان داخلی آن عطر شدیدی با طعم انگور ترشحاتی، فرچبوتا و موته را داشت که همواره در نوزادله به عنوان محصول غذائی مهم برداشت می‌شد.
  fruit.fig:
    label: انگورو
    summary: درخت خوش‌طعم مثل غرباله با لب داخلی شیرین.
    info: انگورهای فیکوس کارِئا از قدیم‌ترین میوه‌های زراعت شده هستند؛ دلائل تاریخچه آنها به حدود ۱۰٬۵۰٠ سال قبل بازمی‌گردد. در واقع، اندازه نسبتا بزرگش شبیه حاوی است که شامل صد‌ها گله رفتن است. برگ‌های جادویی «آدم» و «حواء» در قصۀ عهدجدید منابعشان از پلاطونس فیکوس است.
  fruit.gooseberry:
    label: انگرست
    summary: دانهٔ صافِ تقریباً گُلَف؛ پسندیده در باغها.
    info: انگرست، میوه‌ای کوچک است که در باغ‌های اروپا وسطی رواج دارد. اندازه آن به طور خاص جذاب است و سبز، قرمز و زرد وجود دارند. همراه با حاوی فراوانی ویتامین C نیز شناخته میشود.
  fruit.grape:
    label: گرید
    summary: سبک جوشانه بچه‌ای فشرده روی پارچه.
    info: گریده انواع مختلفی با رنگ‌های متفاوت از سبز تا بنفش درشت دارد. گریدها خام، کشمش شده و یا به عنوان مواد اولیه برای ترشح نectar استفاده می‌شوند.
  fruit.grapefruit:
    label: گریپ
    summary: مرکبات عظیم با طعم خوشمزه؛ ستاره غذایی.
    info: گریپ فروت (سایتراس پارادائسس) تاجوره از نخل و هلو است که در قرن ۱۸ میلادی روی جزیرۀ بربودوس شناسایی شد. انواع رُمینک‌فام مثل چرم‌نما، لycopene و بتا_karotin دارد.
  fruit.guava:
    label: گوجه
    summary: فلاور زمستونی با بو قوی و پوشش داخلی سفید یا صورتی
    info: |-
      گویاوا از مبدأ آمریکای استوائی دارد و در تمام مناطق جنوب شرقی آسیا، هند، ترکیه غربی و کشورهای عربستان وجود دارد
      در مقام حاویت فرومون‌ها بهترین نماد روزانه برای بدن ما سلامتی خودش رو باعث میشه
  fruit.jackfruit:
    label: جاكفرت
    summary: بيشترين ميوة روستاني توپيكال؛ بزرغي مثل قرص.
    info: چله‌بُونیک به نام علمی Artocarpus heterophyllos بزرگترین ميوهٔ درختان جهان است که وزن آن تا بالای سی و پنج کيلوگرم هم رسيده؛ از منطقۀ عظيم الشأن آسيايى حلقه داغش مشتق شد، و غذافزايدۀ مهمى برای الهند، بنغلاديش و تайлند است. صفت غير رسیدهٍ فلسفية يك جايگزين خوب برای گوشتي كاربردي با طعم بيطرف است.
  fruit.kiwi:
    label: کیوی
    summary: محصول موهاست با پوست قهوه‌ای و داخل سفید؛ غذافته از عناصر ویتامین.
    info: کیوی در اصل از کشور چین مبدأ دارد و به آن یانگ تاو نامیده می‌شود، همراه با عنوان سبز فلفل صحرایی چینی. جزیره زلاند نو عملیات تجاری را شروع کرد و پس از اسم مرغ خانگی محلی «کِوَئی» برآن قراردادند. حجم ویتامین C موجود در کیوی برابر دوبرابر محصول لیمو است.
  fruit.lemon:
    label: لیمو
    summary: سبز جوشندگان؛ منبع طبیعی ویتامین C.
    info: سیترن موسوم به لیمو، با ترشح از دانه‌ای سبز در آسیا نشأت کرده است و غنی از ویتامین C و اسید سیتوکسیل است. این محصول عطردار برای پخت خوردن، شرباتها، مواد التیاب و تمیز کاربرد دارد.
  fruit.lime:
    label: ليمتون
    summary: يک نوع ليمون كوچك كه نقشي مهم در غذاهاي مناطقي مثل مايكسيكو، تايلاند و فيتنام دارد.
    info: لیموترش کوچک، سبز و حاوی عصاره ترش است با پوست خوشبو این میوه در آشپذیری های ماخسک، تائلوانی و ویتنامی ضرورت دارد لیمتوارن به طور قابل توجهی نسبت به جفروارن فقیرتر ولی شدت بو را برجستگی میدهد
  fruit.longan:
    label: لُنجان
    summary: تازة كوچك حلقه اي شبیه ليتشي.
    info: لُنگان به معنی میوه‌ای است که از درخت تروپیکال آسیا، خصوصاً چین نشأت دارد و با لِجَه رابطه فامیلی داشته. اسم «لونجان» اصطلاح زبان چینی بوده که به معناست «دیدار شاهزادهٔ سرخ». همراه با طعم عطردار و شیرین، ارزش غذائی بالاتری برای قلب و جلوگرفتن ضعف خون در پزشكى قدیمى چين وجود دارد.
  fruit.lychee:
    label: لَتس
    summary: درخت باربر با سبزیابی نسبتاً قرمز؛ رایج در مناطق جغرافیائی مختلف.
    info: لیچی (نام علمی Litchi chinensis)، موسوم به لِتْسُ، درخت تاجور و زمستانه است که از خوزستان پراکندگی دارد.
  fruit.mango:
    label: ماکو
    summary: يک نوع ميوه تروبيك با لبۀ طولاني قرمز رنگ.
    info: موزه هندی به عنوان «پادشاه میوه‌های استوائی» شناخته میشود و منبع غنی از ویتامین آ دراست که اصلآ از جنوب آسیا سرچشمهد، ناحيه اي كه بيش از ۴هزار سال پيوسته دانه زده.
  fruit.medlar:
    label: می شفل
    summary: محصول صفت جوجه مرغان شبیه به سوخار، لازمه قبل از ذخیره سازی طعم مناسب.
    info: می‌شفوله (Mesepelos Germanika)، محصول قدیمی کشاورزی است که از قرون وسطایی پرداخت می‌شود، تا زمانیکه رسیدن به بلوغ ندارد؛ بعد از برداشت آب درست رفته باشد. غذائی خوبی دارد و حاوی فلافون ها و ویتامین سی است.
  fruit.melon:
    label: موز
    summary: فروتن با لگن طولانی و پوست صاف.
    info: خوشبختی مانند خرما، این سطح دارای آب زیاد است و بهترین منبع تأمین رطوبت برای بدن است. انواع مختلفی وجود دارد که شامل قندها مثل هONEYDEW، GALIA و CHARENTAIS نامیده می‌شوند.
  fruit.mulberry:
    label: مورuşه
    summary: بُوبولۀ فرامرز زرد روشن از نخل موروşe؛ غذاء بوقلمون.
    info: موروشه شامل موروشه سفید، قرمز و مشکی است؛ بهترین آنها موروشه‌ای با عطر خوش است که در تاریخ برای پرورش ابر رشد دادند.
  fruit.nectarine:
    label: nectarine
    summary: سبوس بدون مو؛ شیرین و فراموشنش غلط.
    info: نектارینکا به معنای موتاسیون طبیعی سبوس با پوست صاف است و تنها از نظر جنس هموژنه بودن پوستش از سبوس تفاوت دارد، ولی عطر آن مشابه سبوسه؛ فقط قابل تحملتر است. اسمش راهنمائی بر کمال ظاهری‌اش در حالت خوردن.
  fruit.orange:
    label: پومه رنچ
    summary: درخت ترش با پوست زرد قرمز.
    info: پومه‌رنچ میوه سیتراس است که از جنوب شرق آسیا نشأت دارد و امروز در تمام نقاط جهان فراموش می‌گردد، غذای حاوی ویتامین C بوده و به عنوان عصاره معروف است.
  fruit.papaya:
    label: موز
    summary: بزرگترین محصولات نواحِّى با لُخت سفید قرمز.
    info: پاڤایا از منطقه تروپیکال آمریكا مبدأ دارد و در فرآیند هاضمه پروتئين‌ها به عنوان الگو، انزيم «بابائن» را شامل مي شود. این ميوه غني است از فيبر، ويتمان سي، بتاكاروتين و مواد ضد oxidant.
  fruit.passion_fruit:
    label: گوجه ماچنکا
    summary: ميوه اي استاني كه قشر بنفش فرشته ياشك داراي بوسي عميقي است.
    info: ماچنکا از جنسیت پاسیفلورا واقع در مناطق استوایی آمریکای جنوبی مبدأ دارد. نامش به خاطر شباهتش با علامات رنج‌های حضرت عیسی که توسط سفیران الهی مشخص شد، تعیین شده بود.
  fruit.peach:
    label: بروسک
    summary: پرتقالی نرم و روشن؛ نماد تعطر به تابستان.
    info: بrosseکه از کشور چین می‌آید و در آنجا نماد بقایِ سرشار است، پوست لطیف فروشدهٔ خود را مشخص می‌سازد؛ وجود دارند به صورت انبوه با تفاوت همانند زرد و سفید، و نكتارينها بدون موهاي ظاهرى جاندارن كاملاً صاف هستند؛ در منطقۀ چین، Broskev قسمت مهمی از شروع سال نو و علائم معنوی برداشت علمی طبیعی.
  fruit.pear:
    label: هلو
    summary: میوهٔ برجسته مثل قطرات عسل با قابلیت ساده.
    info: هلو، میوه‌ای است کشمشک شکل با طعم تند و خوشمزه از جنس هلو درختان نرمال؛ دوستگاه لب به حالت رنده شدۀ آب پذیرفته و فراوان وجود دارد.
  fruit.persimmon:
    label: تومول
    summary: مرکبات شباهت داشتن با اندازهٔ توست، رنگ نارنجی و طعم شدید.
    info: |-
      تومل، که به نام علمی Diospyros kaki شناخته می‌شود از مناطق جنوب خاورمیانه و آسیا است؛ در فارس زبان توسط مردم با عنوان «تومل» معروف است
      در حالت غیر رسیدگی دارد طعم ترش و قوچ رفته ولی وقتی کامل روغنده بوجود میآورد عطر پرک لطافت مثل عسل!
      این محصول غذائی سبز برای وجود مواد مغذی بالا مشهور است شامل ویتامین های مهم A,C و متالها.
  fruit.pineapple:
    label: آناناس
    summary: تازه تالل با قابض زرد.
    info: انانا از آمریکای جنوبی نشأت می‌گیرد و در حال حاضر در کمربند استوائی سراسر دنیا پیداشده است. فراورده اندازه برومولین را شامل می شود، که به هضم غذا کمک می کند.
  fruit.plum:
    label: سبزک
    summary: مرغوبترین نمونهٔ تخم مرغ؛ پوست رنگ فلزا و جذاب دارد.
    info: برنج‌های سیب زمینی، مخصوصاً برند «سولانا» به عنوان محصول اصلی در مناطق مختلف کشاورزی استفاده میشوند.
  fruit.pomegranate:
    label: گلول
    summary: مرغوب به حبوبات زرد خوشمزه هزار عدد؛ علامت غنا.
    info: گریانه‌بر، از منطقۀ آسیای مرکزی و دریاپاس می‌آید. دارای بیشتر از شصتصد جفت تخم روغنی قرمز رنگ است که به صورت نمادین فراوانی را نمایند؛ پژوهشهای علمی بررسی سلامت قلب و التهابات با وجود مواد ضد اكسيدان بالاست.
  fruit.quince:
    label: کدواله
    summary: سبزی طعمدار قرمز شبیه فلفل
    info: کدواله به شاهدود و هلو نزدیک است؛ تازه سفت و خشک محسوب می‌شود، بنابراین همیشه باید داغ پخته شود مثل جله کدواله (Membrillo)، آبجو اسپانیائی از کدواله، روم اسپانیا با عطر غلیظ. حاوی مقادیر زیادی الگو مناسب برای تولید جله.
  fruit.rambutan:
    label: RAMBUTAN
    summary: فروتشنه سبز و موئی مشابه لَجِّي.
    info: رامبوتان از مالزی منشأ دارد؛ نام آن به معنای «مو» در زبان محلی است و پوست قرمز آن با تارهای کم‌وزن پوشیده شده است. هرچند شباهت بسیاری به لِجی داشته، ولی جنس انگورمرغوبتری را فراهم میکند.
  fruit.raspberry:
    label: مالینا
    summary: مرکبات قرمز؛ علامت تعجب صبحانه.
    info: بریمبلو، که به نام علمی Rubus idaeus شناخته می‌شود از تعداد زیادی دانه رنگارنگ تشکیل شده است و در طبیعت و فصل های مختلف روستاها پدید آمد. حاوی مواد غذایی مهم مثل ویتامین سی و من Transparente باشد.
  fruit.starfruit:
    label: ستاره
    summary: نوشابه زرد روزمره حاوی مواد مغذی
    info: کرامبولا، از جنوب و شرق دور آسیا مبدأ دارد. وقتی که عرضگاه برش خورده باشد به صورت ستاره‌ای درمیآید(به همین سبب نام انگلیسیش است). طعم ترش-عسلدار داشته و منبع غذائی فراوان برای ویتامینC است.
  fruit.strawberry:
    label: جاهوت
    summary: برنجوشک قرمز فشرده با ظاهر شبیه قلب.
    info: '{"hint":"berry قرمز با شکل سیب زمینی و دانه‌ها روی سطح آن، از نژاد Fragaria × ananassa","info":" Jahoda zahradní محبوبترین محصول در خانواده روزوفورس است که حاوی vitamin C بالا و مواد ضد oxidant بوده؛ جمعآوری آن به تابستان اختصاص پیدا می‌کند و عطر لذت‌بخشی همراه با طعم شیرین دارد.","label":"جاهوت","summary":"برنجوشک قرمز فشرده با ظاهر شبیه قلب."}'
  fruit.tamarind:
    label: tamrin
    summary: تخم مرمری با لبۀ ترش؛ بنیان اساسی غذاآوردن تاج.
    info: '{"hint":"تخم مرمری با ماستوره ترش و شیرین","info":"تامارنده از مناطق استوایی آفریقا نشأت دارد؛ اکنون در سراسر جهان استوائی کشت می‌شود.\nmاسه به طرز قابل توجهی خوشمزه، عصارهٔ پرتقالدار و فلفلی را شامل می‌شود؛ در غذاهای بات هاو، Worcestershire sauce و حلوای هندی استفاده می‌گردد.\nkلمه اصلآ از زبان عربی چیده شد: Tamr Hindi= انداختن انارها به صفحهٔ هند.\نهستهٔ مهم بر روی الکل اسیدی(تر)، ویتامین B و مواد معدنی مثل آهن.'
  fruit.tangerine:
    label: مدارات
    summary: سبک، حلوایی، بدون قشر؛ معروف به عنوان محصول مهم در شب غدیر.
    info: ماندارینکا، سیتروس رتیسولاته نوعی موزه‌برگ و تازه از منطقۀ جنوب شرق آسیاست که به خاطر پوست نرمش در دستان بزرگان استفاده می‌شد. همچون انار، علامت فرا رسیدن زمستان و تعطیرات باعث لذت بردن مردم در طبیعت.
  fruit.watermelon:
    label: آبمرو
    summary: سالمبو فشردۀ پهن جلو با عضلات بلوندو.
    info: خیار آب از قاره‌افریقا مبدأ دارد و به عنوان سالسبز تابستان شناخته میشود، بدن خو را ۹۲ درصد با استفاده از آب تشکیل میدهد و لایcopene حاوی کنده که نتیجهٔ زردگی هستند.
