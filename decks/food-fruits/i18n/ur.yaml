lang: ur
pivot: false
title: فروٹس
cards:
  fruit.ackee:
    label: اکی
    summary: '''اکی'' چمڑی والا ہالکا گرم خطہ کا پھل ہے جبکہ اندر کے زرد آربائل کھانے کے قابل ہوتے ہیں۔'
    info: اکی کے درخت سے جامائکا کا قومی پھل حاصل ہوتا ہے؛ اس نام کو براہر مارشلز، کپتان بلگ کے بعد رکھا گیا تھا۔ صرف بالغ زرد آربائل خوردنی ہوتے ہیں؛ غیر استوار یا فضول وقعت والے پھلوں میں ٹॉکسن (هایپروجلوسین اے) موجود ہوتا ہے۔ 'اکی' اور 'سلف ش' جامائکا کا قومی کھانا ہے۔ یہ علاحدہ افریقا سے لاتا ہوا چند وقت قبل دنیا کے مختلف حصّوں میں منتقل ہواتا ہے۔
  fruit.apple:
    label: سیب
    summary: گول، سرخ یا لال رنگ کا مچھل اور ترشہ حلواروں والا فروٹ۔
    info: سیب جبکہ دنیا بھر میں پیدا کردہ فصلوں میں سے ایک ہے، اس میں وٹامن سی اور فائبر موجود ہوتا ہے؛ 7,500 سے زائد نسلیں موجود ہیں۔
  fruit.apricot:
    label: مرونکا
    summary: ایک نسبتاً چھوٹا آلوان منڈل والا درخت؛ حلاوانداز اور رسدار
    info: "مرنکا ایشیاء کے وسط میں پائی جاتی ہے۔\nچیک رپبلک، ساری دنیا سمیت ترکی اور اسپین کو بھی فراخدہ طور پر زراعت کرتا ہے۔ \nbeta-carotene اور vitamin A سے بھروسا لگتا ہے۔"
  fruit.avocado:
    label: افوکادو
    summary: ایک صحت مندانہ تازگی والی تربّع؛ گواسمولو کا بنیادی عنصر
    info: افوکادو ایک ترپ کا سبز فروٹ ہے جس میں خوبصورت حیران کن قسم کا ذائقہ شامل ہوتا ہے۔ باغبانی کے لحاظ سے، یہ پھل ہے، البتہ روزمرہ استعمال میں وظائف نباتاتی طور پر دستاویزاً استعمال ہوا چلتا ہے۔ ان مفید غذائی عناصر میں منفرد شدہ اینجوفاء مثل زيتون کے تیلوں موجود ہوتے ہیں۔
  fruit.banana:
    label: بینس
    summary: ہلکا زرد اور میوے کی دھنی تپش حاضر رہتی ہے۔
    info: بینس، گرم علاقوں کی پودوں کا میوا ہوتا ہے جو بینس فیملی سے تعلق رکھتا ہے۔ یہ پوٹاشیم اور قدرتی شکر کے ذخیرہ والی چیز ہے جو تیز انرجی فراہم کرتی ہے۔
  fruit.blackberry:
    label: اُستروجنينا
    summary: اک تارا فاءلو آسمونى رنگ د‏ بووتر
    info: |-
      اُسٹریوژِنہ (rubus fruticosus)، اک تندورخانے والی بوئی، جل کھجوروں پراگین فائل سبز رنگ د‏ بوتر بݙت‍۔
       وچ مسلّم طرح لاسرونوں تو‏ں نکلن٘دی ہَے اوشال اندر
      اوہ وائتمائن سي، كي ايويه عناصر توازن برقرار ركھدا هيا
  fruit.blueberry:
    label: بورووفچا
    summary: ایک خوبصورت نتھی بندی؛ غذائیت زاد انٹروئیدنٹس والا
    info: |-
      برُوَفِکا، جس کی قسم مائٹللوس وائلڈ اور سرائمبوسومن فارماؤنڈ شامل ہے، آنتوسانز پر مشتمل ہوتی ہے۔
      anthocyans برُوَفِکا کو تازگی دینے والی نتھی بندی عطا کرتا ہے اور مضمر طاقت رکھتا ہے。
      تحقیق سے ظاہر ہوا ہے کہ یہ ذہنی صلاحیتوں اور دل کی حالت کو بہتر بناتا ہے۔
  fruit.cantaloupe:
    label: کنتالو
    summary: ایک صفراء-برائونی مشبّح آمار جس کا درم داخلی حصہ روشن橙 رنگ کا ہوا
    info: "کانتالوپ (سیوس ملو وار۔ کانٹلوبنسنسس)، ایشیا سے تعلق رکھنے والی آمروں کی پسندردہ قسم ہے。\nاس نام کا ذکر بابطہ حسب منازل، روم کے قریب موجود فرانچ مقام 'کینتالو' سے ہوتا ہے۔\norngae رنگ کی جذباتی دُوزِین بتا - کرتون اور وٹامن A سے خاص طور پر غناوالٗ‏‍ں ہوتی ہے۔ \nآمر کی انقسامات میں سے یہ زیادہ شیرين نوعيت کا حامل ہے"
  fruit.cherry:
    label: چیرشِن
    summary: چھوٹا، گول اور سرخ پتّی دار میوہ جو جوڑے کے طور پر بڑھتا ہے۔
    info: چیرشِن ترشن کے درخت کا میوہ ہوتا ہے، جو ایک مقبول گرمی کا میوہ ہے۔ اس میں آنتی اوکسائیڈنٹس اور میلاٹونن موجود ہوتا ہے؛ یہ شیرین اور نمکین دونوں قسم کے ہوتے ہیں۔
  fruit.coconut:
    label: کوئس
    summary: ایک لمبا عالمگير زمينداري منصوبہ
    info: |
      کوئیس کوس نچفرا، اترنٹل سائنس ميں جانے والے درخت کا فروٽ هيا؛ باتونائي طور پر يہ اُت رهنا والا دالين لاءِ تماشبيار وليكن گوشتيلا۔
      غيرپيوستہ فرو١٠ ميں موجود کوئس کاس واٟر آب طبيعيى ايون توؤن ليكير حضرت كريتا ھوي。
      کوئس کاس موسل انڈيس اوستان کاشمیر کيشي بنجرد
  fruit.cranberry:
    label: brušinkā
    summary: سرخ، کم خوشگوار، چوبند؛ استعمال امریکی طرزِ غذا
    info: |-
      بروسینکا (Vacium Macrocarpon)، ایک کم خوشگوار، سرخ رنگ والی بے آب تازہ مچھلی جاتی ہے۔
      ایسٹرن برافٗ شوپ کا روائتی حصّہ ہوتی ہے。
      اس میں پروانثواساونڈنز موجود ہوتے ہیں جو بافٹیريا الیز کولائي کے موچور دلوں کی نالیوں کی دیواروں پر لگنے سے روکتا ہے۔
  fruit.currant:
    label: رائیبز
    summary: روزانہ استعمال ہون آلی نن ڳي لال، کلاہٗ يا سفيد بيريل
    info: "رائیبز اک ننگوں لال، کلاہٗ جا سفید بیرلے د‏ مخصوص تھرا۔\nچُݙّا رائیبز وٹامن سي تو‏ں پوری طرح مصنوعات وچ موجود حضرت آندی ا‍س د سب تو‏ں زیادہ مقدار ا‍س دا حصہ بنان والی بوئی ‘‘ribes nigrom’’ وچ ہوندی ا هے۔ \nچُݙّا رائیبز برطانوی مشروب ribena اوشوق شراب cassis د اصل ذائقہ فراہ ماں کردی ا ء۔"
  fruit.damson:
    label: دمقنسکا شويستكا
    summary: برطانوی گاؤں کے گلدرا میں عام چھوٹی تنددردل بلکہ سبز-سوراخدار مشتمل چیرا
    info: دمشقی سوئسٹکا، جن کے نام پر اصل مضمون دمشق آتا ہے، وائلت فروٹ کی قسم ہے۔ یورپ تک رسائی حاصل کرنے والی چھوٹی، خشک بلوط رنگ کی شدید طاقتور زرد لال درجہ بالا دماسکین جوس، انڈوملز اور گِنز میں استعمال ہوتی ہے۔ قدامت پسنداں برطانوی روایات میں صدیوں سے کاشت کی جارہی ہے۔
  fruit.date:
    label: داتلے
    summary: ایک خوشbowن جامنی رنگ کا لمبوالا پودا؛ عرب نواح کی بنیادی غذائیت
    info: داتلے، فونکس داکٹائلیفرا کہلاتی ہے اور ان میں تقریباً ٦٠% شوگر موجود ہوتا ہے۔ وہ قدرتی طاقت کا بڑا ذخیرہ ہیں۔ عرب نواح میں سبزیوں کے لئے بنیادی غذا کروانے والی حیثیت رکھتا ہے۔
  fruit.dragon_fruit:
    label: دراچی کا فرط
    summary: لالي درندہ چوبلا کا شاخدار حصه
    info: |-
      دراچی کا فروٹ، جسے پتائہوا اور هائلوسیرئس بھی کہا جاتا ہے، مکزICO سے تعلق رکھتا ہے۔
      اس کی زبردست روزاں قشر اور نمایشی حالت والی سفید دُوڑن جبکہ اندر کالے آلوؤں کے ذرات موجود ہوتے ہیں。
      یہ خوشگوار طاقت وار بوخ مواد ہے؛ انتظامی عناصر اور وٹامن سي شامل ہوتے ہیں۔
  fruit.durian:
    label: دورین
    summary: '''دوروين'' اترم حرارتيويٗ فروٛٹ ہݨدا ہے جيس دي غضبناك روشني ہندسي ہے؛ اترم فروٕٹ كا باجسار'
    info: |-
      دُریئن کو تھرمودس زِبَتِنس نام سے جانا جاتا ہے۔ اور 'توپک فروٹ' کا بادشاہ مان ليا جائتا هے۔
      اس کي قوت وونه بعض لوگوں کو دشمن بناتى ہے، تو کچھ لوگوں کو خوب پسند آتي ہے؛ اس وجہ سے متعدد asian ہوٹلوں میں اجازت نہيں ہے。
      ایسا مشتمل ذائقہ والا شیرازہ حلاوا والا ہوتا ہے (badam، وائل کريمس)، اور south east asia میں عالیشان طبعيت کے طور پر معروف ہے۔
  fruit.feijoa:
    label: فِجوآ
    summary: چربدہ دُمّاندار حالت والی لمبا مستطیل شکل والا سبز وقت
    info: "فیجوا اسپر کا جنوبی آمریکہ سے تعلق رکھتا ہے۔ \nاس کی مالش والی قسم پراگبائٹ، انار کلی اور منتول کی خوشبو لاتی ہوئی بڑی شدت والا ذائقہ ہوتا ہے۔\nنو و زیلنڈ میں فصل کے طور پر نسبتاً مشہور ہے。\nیروپ میں عمومًا غیر معروف، البتہ اس کے موذون ممالک میں مقبول"
  fruit.fig:
    label: فيک
    summary: پلاطانيوس کے درخت کا الستاء غرش کماندار حصہ؛ مسلات اور بذرت سے بالاست
    info: "فِكُس کارِکا، جو فیک نام سے مشہور ھے انسان دنیا ميں پالئے جانے والے قدیم ترین درختون وچ شمار ہندی ھے؛ ثبوت ١۱٬۰۰۰ برس قبل تک موجود ھن۔\ni\nحقیقت يه ھے كى ݙسمبر بلکل اصلی خشمندگي نهيں بلکه لاکھواں چوبڑي قسم دي لعليندي هيا。\ni\nبائبل توں ماخذ آدم او رحمت عطا کرن والے شخص دا حوالہ فَيك کې واقع ھن۔ \ni\nخشمندغ اندر فِكس ٹماٹرو زخمي، بوتل کرموم اور فايبرز مواد دا اچّا ذريعہ ھن۔"
  fruit.gooseberry:
    label: انگریشٹ
    summary: چھوٹا دائرہ وار شفاف بالول؛ باغات میں مقبول
    info: |-
      انگریشٹ اوسط جغرافیائے مغرب کے باغوں کا خصوصی پھل ہوتا ہے۔
      iس سبز، لال اور زرد نسلوں میں موجود ہوسکتا ہے۔
  fruit.grape:
    label: ہروزنو
    summary: چھوٹا گول میوہ جو اک سلسلے کی شکل میں لات سے پیدا ہوتا ہے۔
    info: وائٹس ونیفیرا نامی لات سے مختلف رنگوں والے، زرد سے لے کر تاریک بنفشی تک ہروزنے پیدا ہوتے ہیں۔ ان ہروزنوں کو تازہ حالت میں کھایا جاتا ہے، انہیں خشک کر کے روزانوں کی شکل دی جاتی ہے یا انہیں سب کچھ دبا کر آپ کے مشروب، وائن بنا دیا جاتا ہے۔
  fruit.grapefruit:
    label: گریپ
    summary: بڑا حلاوانہ سنتر؛ غذائیت والی ماچھیر
    info: گریپ فروٹ، سنسن کے پوملو اور نارنج کا مہم جو شاخ ہوتا۔ ۱٨ ویں صدی عرب بوسس انداز میں تفصيلات دئيى ڳيا۔ رُضّواَل ۽ لال گِراًفروت لوکین اور بتا - کرتون شامل هندائي。
  fruit.guava:
    label: goāwā
    summary: مارن فروٹ مع شدید بو اور بلون یا روزا لحم
    info: گوآوا (پسیڈئم جواتا) امریکہ کے مدارن علاقوں سے تعلق رکھتی ہے، اور پوری آسٹریشین اور انفرانچائزر خطوں میں عام ہے۔ یہ نارنج کے مقابلے میں وٹامن سي کی ۴ برابر قدر حاوی ہوتی ہے۔ گلودشت اور دانے دونوں خوردہ ہیں؛ تمام فروٹ غذایی طاقت والی ہے۔ گوآوا رس اور جیمس درجات زیرِ استعمال ممالک میں مشہور محصولات ہیں
  fruit.jackfruit:
    label: جئک فرس
    summary: درخت پر موجود عظیم الشان گرم خطواً مرغوب فلم
    info: |-
      چلو بفرونسنکس ارتو کارپوس ہیٹرولفس لاتین میں جانا جا رہا ہے، درخت پر سب سے زیادہ فلسطائی دان تھا؛ ان وزن 35 کلوگرام سے اوور ہوتا۔
       وہ شمالی آسیاء کا نمایاں حصّہ ہے ؛ بالخصوص بنگلا دش ش، ہندؤستان اور تайлینڈ میں غذائیت کا ذریعہ ہے。
       ناموزون حالت میں چلو بفرونزکس خوش طبع موثر استعمال کرنے والی قسم ہے۔
  fruit.kiwi:
    label: کیوئی
    summary: بڑا براؤنس چربدراست فروٹ؛ خوبصورت سبز درخت
    info: کیوئی کا تعلق صرف سے مل رہا چین، جسے وانگ تو اور چائنیز غوزبری بھی کہتے ہیں۔ ناردرن زیلانڈ نے اس حوالے سے تجارت شروع کر دی اور اپنا قومی پنجاب کیوئی کے بعد واٹس آف لائنز شامل کردی۔ یہ فروٹ وٹامن سي کم سے کم انداز میں موجود ہوتا ہے۔
  fruit.lemon:
    label: سيترون
    summary: اس حوالے سے، يہ نمكين زرد سائترس؛ ويتمان سي اور ايروميا کي منبع ہے۔
    info: سٹیرون ایک کھسا، زرد سائتروس فروٹ ہے جو مشرق وسطیٰ کا رہنما ہے۔ یہ وٹامن سي اور لیموسن لمون شامل دار توانائى کا ذریعہ ہے۔ پختگی، مشروبز، آئلمنٹولوجی اور صفائی والے علاجات میں استعمال ہوتا ہے۔
  fruit.lime:
    label: ليمٽكَا
    summary: سبز کُشترانوالا چھوٹا نارنج؛ گرم علاقوں کی خصوصیات رکھتی ہے۔
    info: لیمونٹکا ایک کم پھلوں والی سبز شعلہ بخش نارنگی قسم ہے۔ چائنا، تایوان اور ویتنام میں استعمال ہوتی ہے۔ لیموٹکا آرتمو فروغ دینے والا ذائقہ حامل عنصر ہے جس کا استعمال مختلف غذا میں عام طور پر ہوا کرتا ہے۔
  fruit.longan:
    label: لوݙان
    summary: ایک چھوٗٹا برون آتش‌آماج گرمجوشی فروٹ، جو ليچي سے وابستہ ہند
    info: لُونگان (ڈائیموکارپس لوانا)، ایک تھرمل حوض کے درخت سے ماخوذ مچولہ جاتی فروٹ ہوتی ہے، جو صين سے منسلک ہوا۔ نام 'لون' + 'يان' سے مشتق ہے جمع الفاظ ہیں جن کا معنى ’درا‘ کا ’آنچه‘ ہوتا ہے، شفاف دباؤ والے حصّے پر اور سیاہ بذرت کی وجہ سے۔ یہ غذا خوشبودار اور زیادہ مِحْلاَت والا ہوتا ہے۔ چین کی قدامت پسنداً طب میں یہ قلب و رود فضا کو مضمر کرنے والی غذا کے عنصر کے طور پر عزت حاصل ہے۔
  fruit.lychee:
    label: لچي
    summary: چھوٹا سرخ تروپکل فرُٹ؛ ایشناء وچ مشہور
    info: "لیچِ، لَتْسِ کھنٔ سنسز)، اک تروپکال فرُٹ ہے جو چین توں آئندا۔\nاس د‏ سرخ بورّ نرم نظر ا‍جݨ والی پرت رکھد‏ اور وضاحت شفاف سفید مانگواڑ شامل۔ \nایہ خوشبوارا، حلوہ قسم د مزہ رکھدا ا ء\nچین وچ اس د‑شادمانہ اور عظیم الشان وجود سمبل منعات"
  fruit.mango:
    label: میوگا
    summary: ایک تپیدہ میوہ جس کے ہلکا پھلکا سفید رنگ کا رسدار گوشہ ہوتا ہے۔
    info: میوگا 'تپیدہ میوہ کا بادشاہ' کہلاتا ہے۔ اس میں وٹامن A اور C کی زیادہ مقدار موجود ہوتی ہے، اور یہ جنوبی ایشیاء کا مقامی میوہ ہے جہاں چار ہزار سال قبل اس کی کاشت شروع کر دی گئی تھی۔
  fruit.medlar:
    label: ملح
    summary: بڑا لمبا براؤنس قسم دا مرغوب فلواد
    info: |-
      میشپولے کا درخت اک قدیم فصل تھو، جس د‍ن سے میڈیاوٗل دور وچ لوگ انہاں نُٹرنتس لئي۔
      ایݨ بدلواوراندرو توَن خوشماز ہندى؛ پتلا رخسار حاصل کرندا هيا
      جِسا کّه شیکسبر نے 'روميو اینڈ جولي' وچ ذکر کيتا، آج وقت وچ ايس‏ے زردات کاروبار د‍نوں عام نيں
  fruit.melon:
    label: ملوان
    summary: بڑا حُسن والا فروٹ، جس کی خوشبو اور ذائقہ مختلف قسموں میں موجود ہوتا ہے۔
    info: میلوان کا تھوڑا سے مزہ اور پانی والا فروٹ، جسکا نام علماء نے Cucumis Melon دیا۔ ونچل راؤند یا بیضائی شکل والا ہوتا ہے۔ آفغانستان اور ایشیا سے منگلا؛ لیکن آج کل عالمِ گیر طریقے سے زراعت کرتے ہیں۔
  fruit.mulberry:
    label: موروش
    summary: ایک لمبا اندرونی قرمزی بوتل موروش کا درخت
    info: "موروشے سیب کا درخت؛ مورو شہ پتّي بچھرکلائسٹن جانور کی خوراک ہوتی ہے۔\nmوروش شامل ایک سفید، لال اور کالا رنگ ہوتا ہے؛ نیلا زیادہ تمازج والارنگ ہوتا ہے。\nhistorically، موروش کاشت فروغ دینا حریر صنعت کے لئے حساس تھا۔ \nmuruše آزاد انقلابات، وٹامن سي اور لوہا سے بھرا ہوا ہے"
  fruit.nectarine:
    label: nectarine
    summary: بال بنا؛ شیر خوش ذائقہ
    info: نектارینکا، ایک قسم کے نرم پھل والی سبزیوں میں شامل ہوتی ہے۔ چمڑے کی لمحوائیت کے لئے صرف جین مختلف ہوتا ہے۔ گودام تازہ رہتا ہے، البتہ زیادہ مضبوط حالت ہوتی ہے۔
  fruit.orange:
    label: پومرنس
    summary: ایک گول سیٹرس کا میوہ جس میں خوشبو دار نارنگی رنگ کی پوست ہوتی ہے۔
    info: پومرنس ایشیاء کے جنوب مشرق سے تعلق رکھتا ہے، آج وہ دنیا بھر میں پیداوار کیا جاتا ہے۔ یہ وٹامن سی سے بھرا ہوا ہوتا ہے اور عمدہ رس کے طور پر مشہور ہے۔
  fruit.papaya:
    label: چاندن
    summary: ایک لمبی زرد دُشمندار درخت کا حصّہ
    info: پاپائیہ کے پودوں سे تباہ شدہ امریکن ملکوں کے علاقوں سے نکلتا ہے۔ انزائم 'پین' جس کا استعمال بروقت غذا کے ذریعے حصول طاقت فراہم کرنے والی قوت کاربوز شامل ہوسکتی ہے، وٹامنز سي، بتا-كاراتين اور آنتيكسيدنش خصوصيات رکھتا ہے۔
  fruit.passion_fruit:
    label: مَچِݙُواً‏
    summary: ایک درندہ جنس والا شدید حرارت والے خطوط کا فروٹ جس کی بالکل گڑّ آلی بنجر ہوتی ہے۔
    info: مچنکا جو کہ Passiflora edulis نامی پودے سے حاصل ہوتا ہے، اس ملک خاص طور تھائی لینڈ سمیت دنیا بھر میں زراعت کردہ قسم کا فروٹ ہے۔ اس کا نام ان رومانوسولف منشیات والوں کے بعد رکھا گیا جنہوں نے اس کے پھلوالے بلب میں عیسوٰئی آلام و مشقت کے نقاشی کو دیکھا۔
  fruit.peach:
    label: بروسکیو
    summary: تمش الٹرو-پِلوس شفٹ؛ گرمی کا علامت
    info: "بروسکیو کا پھل اصل میں چین سے تعلق رکھتا ہے جس وقت وہاں نامortality بدلنے کا علامت قرار دیا جاتا ہے۔\nاس کی خاص حالت فرش لگی ہوتی ہے。\nایسا زرد، بلوری نوعیت کا برتن موجود ہے؛ انٹرنس تو صاف، بالائی طاقت کم ہونے والی مختلف النوعیت ہے۔ \nچین میں برانسرز نئے سال کے موقع پر استعمال ہوجاتے ہیں اور دردناک روایتوں کے ذخیرہ کا حصہ بن جاتے ہیں۔"
  fruit.pear:
    label: ہرسکا
    summary: آنس کی شکل میں ایک پھل جس کی خوشگوار چٹان والی سے لطیف ذائقہ ہوتا ہے۔
    info: ہرسکا، ہرسنی عام کا پھل ہے، جو آلو بخارا کے قریب رشتہ دار ہے۔ یہ نرم، رسدار گوشت اور بلند فائبر مواد کا حامل ہے؛ صدیوں تک مختلف نسلوں کی موجودگی ہے۔
  fruit.persimmon:
    label: تومنِنٗ
    summary: سبزی جیسا آملا دار انفرادی طاقت
    info: "تومل (ڈائوسپائرس کاکی)، چین اور جاپان سے تعلق رکھتا ہے؛ چیک میں یہ تومنِنٗ جاپونَ نام سے مشہور ہے۔ \nنازریدہ حالت میں، یہ غیرملح واقع ہوتا ہے لیکن زرد وقت میں شوگر جیسا خوش ذائقہ بنتا ہے。\nاس میں وٹامنز A،C اور مختلف مواد پایا جاتا ہے۔\njapones میں یہ روشن فصل کا معروف قسم (Kaki) ہے۔"
  fruit.pineapple:
    label: اناناس
    summary: ایک تپیدہ میوہ جس کا سر خاردار اور دُھجّی زرد رنگ کا ہوتا ہے۔
    info: اناناس جنوبی امریکہ کا نسبتاً مقامی پودا ہے، لیکن آج وہ دنیا بھر کے تپیدہ علاقوں میں کاشت کیا جاتا ہے۔ یہ اینزائمن بروملائن کا ذخیرہ ہے جو پیٹ میں غذا کے چبھاؤ میں مدد فراہم کرتا ہے۔
  fruit.plum:
    label: شِسٹکا
    summary: فائلے رنگ والا چوبلا؛ شلوفوسچہ اور شَسْتوا دانہ کا ذریعہ
    info: شِسٹکا، جو کہ ایک فائلے رنگ والی پرونوسلوماس سائنس میں آتی ہے، وسطیヨ럽 کا بنیادی خوردنی تھرمومیٹر ہے۔ شلوفوسچه (جواز شستکا کا نمونہ)، چین اور سلوواکیہ کا روایتی الکحل ہے۔ شَسْتوّٗ لاءُ دانہ براجمان ہوتا ہے، جو موسم غروب کے حصول کا علاماتی حصہ ہے۔ تمام دنیا میں شِسٹکا کی قدردرج اندازاً ۲۰۰۰ مختلف نشوؤں موجود ہیں۔
  fruit.pomegranate:
    label: گرانٗتووا جبلک
    summary: ایک لال مثمر خوش طبع بذروں والی محصول
    info: گرینیٹووا جبلک، پونچا کے رنجم اس مغربی آسیاءاور دریائے سمندر مرکزی علاقوں کا تعلق حاصل ہوتا۔ یہ شفاف قرمزی دھجنا (ارلئ)، جبکہ اندر ۶۰۰ سے زائد بذور شامل ہوتے ہیں۔ یہ فراوان ذخیرہ نمونہ؛ ماخذان مختلف تحقیقات اس کے دلوں اور التامات پراثرات کا تعاقب کرتے ہیں۔
  fruit.quince:
    label: کدوала
    summary: سبز زرد فروٹ جو بالواسطہ ذائقہ کے لئے استعمال ہونے والا ہے؛ دائمی طور پر حرارت دی جاتی ہے۔
    info: کدوالا کی سبزی جو تر اور نم محسوس ہوتی ہے۔ عام طور پر حرارت دینے والی حالت میں استعمال ہوتی ہے، مثلًا کدولا جام ( membrillo)، کدولا وائنو، کدولا برانڈي۔ یہ فراوان مواد میں بٹولن شامل ہوتا ہے جس کا خاصہ شربت بنانے میں آسانی رہتا ہے۔ قدیم تاریخی قسم کا جام انگلستان میں وجود میں لایا گیا تھا، جس وقت چودهويں صدی عالمگیر تھی۔
  fruit.rambutan:
    label: RAMBUTAN
    summary: ایک قرمزی موڑا ہوا عالمِ گرم زرعی محصول، جو لاچي کے مثل
    info: "رامبوتان، ملائسی سے تعلق رکھتا ہے؛ اور نام کا لفظ 'رَمْبُت' جو بالاتقریر بلوچ آئینگ۔\nاس کی لمروں والی قرمزی پستول حشرجنس کے مشابہ دانتوں سے ڈالن۔ \nایسا خوشہ ٹرانسلوسنت اور شوق وار ہندواستان کے فصل لاچی کے طرح ہوندرا。\nیہ وٹامن سي اور لوہے کا منبع ہوندا"
  fruit.raspberry:
    label: ماربل بربری
    summary: ایک سرخ چھپکلا؛ موسم گرم میں بازار کا علامت
    info: چُھرو کی جڑ(Rubus idaeus)، اس میں بہت سے درمیانوں والے ننگر دورو پارٹلز شامل ہوتا ہے۔ وحشی حالت میں، خصوصتاً صبح تک روز مرتبہ لات آور ہوا کرتا ہے۔ یہ وٹامنز C اور K، منجنس اور قدرتی طاقت کا ذخیرہ ہے۔ چوبوند فرشتوں کا عرق اور چوبند زعفران کا شربت عام غذائیت ہے۔
  fruit.starfruit:
    label: کرامبولا
    summary: '''زرد درجۂ حرارت بالا کا مثمر حصہ جو کٹاؤ کے وقت ستاروں کا نقشہ تشکیل دیتا ہے'
    info: "کرامبولا جنوبی اور مشرقی ایشیاء کے علاقوں سے تعلق رکھتی ہے۔\nجب آپ نصف قطر پر قطعات بنائیں تو وہ براہ راست ستاروں کا شکل دیتا ہے، لہٰذا 'ستاره فروٹ' کہلاتا ہے。\nایسی خوشگوار حلوچال والی ذائقہ ہوتی ہے؛ یہ وٹامن سي سے زائد پانی والا ہوتا ہے۔ \nغدود کمتر صحت کے لوگوں کو ان کے بلند اُکسوئل مواد کی وجہ سے استعمال نہیں کرنے چاہئے"
  fruit.strawberry:
    label: جہوڑا
    summary: سردی کے شکل میں سرخ اور رسدوار بیری۔
    info: جہوڑا زادنائی فروٹ ہوتا ہے جو رُوزِس کے خاندان سے تعلق رکھتا ہے۔ یہ وٹامن سی اور آنتی اوکسڈینٹس سے بھرا ہوا ہوتا ہے؛ گرمیوں میں کاٹ لیا جاتا ہے اور چیندلہ عطر والا ہوتا ہے۔
  fruit.tamarind:
    label: تمرنڈ
    summary: ایک براون رنگ کا دانہ دانہ مواد جس میں ایسا خوبصورت حلقہ ہوتا ہے؛ یہ تاج محل کے پختہ نظام کا حصہ ہے۔
    info: تامارنڈس انڈکا کے پودوں سے تیار کردہ ایک براون رنگ والی دانہ دانہ مچھل جاتی ہے، جبکہ آج یہ عالمی طور پر استعمال ہوتی ہے۔ نمکین قسم کا خوشہ زبردست حلوواں اور لال ذائقہ والا ہوتا ہے؛ یہ فادح وائٹ شیریف، مشرومات اور بالخصوص بنگلاذئی چتنی میں شامل ہوجاتا ہے۔ اسم 'tam' اصلًا عربی الفاظ 'tamr hindhi=hindu date' سے ماخوذ ہے۔ یہ غذا میں منافع بخش عنصرز مثل الکول، وٹامنز B اور لوہا موجود ہوتا ہے۔
  fruit.tangerine:
    label: مندرنکا
    summary: ایک چھوٹا شیرين سنترى؛ عيد الميلاد کا زنم
    info: مندرنکا، جس کی سائنسی نام 'سسٹر ریچولو' ہے ایک چھوٹا، آسانی سے پھلوان والا سنتری قسم کا میوا ہے۔ یہ چین کا مقامی میوا ہے۔ مندرنکا چائنی عید الاضحی اور خوشحالی کا تصور کردہ حوالہ دار عنصر بھی ہوتا ہے۔ چیک جمہوریہ م中秋 节 中的典型圣诞水果。它含有维生素C、抗氧化剂和类黄酮。
  fruit.watermelon:
    label: پانی کا تربو
    summary: بڑا سبز پٹتے والا فروٹ جس میں لال رسدار دھنی ہوتی ہے۔
    info: پانی کا تربو افریقہ سے تعلق رکھتا ہے اور گرمی کا مقبول میوا ہے۔ یہ 92% پانی سے بنا ہوتا ہے اور لائکوپین پایا جاتا ہے، جو اسے لال رنگ دیتا ہے۔
