lang: pt-BR
pivot: false
title: Frutas
cards:
  fruit.apple:
    label: maçã
    summary: Fruto vermelho ou verde com sabor doce e ligeiramente azedo.
    info: A maçã é o fruto da macieira, uma das culturas mais cultivadas no mundo. Contém vitamina C e fibras; existem mais de 7.500 variedades.
  fruit.banana:
    label: banana
    summary: Fruta tropical amarela com polpa doce.
    info: A banana é o fruto de uma planta tropical da família das musaceae. É rica em potássio e açúcares naturais, que fornecem energia rápida.
  fruit.cherry:
    label: ameixa
    summary: Pequena fruta vermelha arredondada que cresce em pares.
    info: A ameixa é um fruto da cereja-parda, popular fruta de verão. Contém antioxidantes e melatonina; há variedades doces e ácidas (como as cerejas).
  fruit.grape:
    label: uva
    summary: Pequena fruta redonda que cresce em cachos.
    info: A videira uvas produz cachos de várias cores - da verde à violeta escura. As uvas são comidas frescas, secas para fazer passas ou prensadas para produzir vinho.
  fruit.mango:
    label: manga
    summary: Fruta tropical com polpa suculenta amarelo-laranja.
    info: A manga é conhecida como "rei das frutas tropicais". É rica em vitaminas A e C e originária da Ásia do Sul, onde é cultivada há 4 mil anos.
  fruit.orange:
    label: laranja
    summary: Fruta cítrica redonda com casca perfumada laranja.
    info: A laranja é uma fruta cítrica originária da Ásia do Sudeste e hoje cultivada em todo o mundo. É rica em vitamina C e muito popular como suco.
  fruit.pear:
    label: pêra
    summary: Fruto em forma de lágrima com sabor doce e suave.
    info: A pêra é um fruto da persea comum, próxima parente da maçã. Possui uma polpa macia e suculenta com alto teor de fibras; há centenas de variedades.
  fruit.pineapple:
    label: abacaxi
    summary: Fruta tropical com coroa espinhosa e polpa amarela.
    info: O abacaxi é originário da América do Sul e hoje é cultivado na faixa tropical de todo o mundo. Contém a enzima bromelaína, que ajuda no processo digestivo.
  fruit.strawberry:
    label: morango
    summary: Bagas vermelhas e suculentas em forma de coração.
    info: O morango é uma fruta popular da família das rosaceae. Rico em vitamina C e antioxidantes; colhido no verão e tem um aroma doce.
  fruit.watermelon:
    label: Melão de água
    summary: Fruto grande e estriado com polpa vermelha suculenta.
    info: O melão de água vem da África e é uma fruta popular no verão. É composto por cerca de 92% de água e contém licopeno, que lhe dá a cor vermelha.
