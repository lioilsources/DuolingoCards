lang: pt-BR
pivot: false
title: Frutas
cards:
  fruit.apple:
    label: maçã
    summary: Uma fruta redonda, vermelha ou verde, de sabor agridoce.
    info: A maçã é o fruto da macieira doméstica, uma das culturas mais cultivadas do mundo. Contém vitamina C e fibras; existem mais de 7.500 variedades.
  fruit.banana:
    label: banana
    summary: Uma fruta tropical amarela de polpa doce.
    info: A banana é o fruto de uma planta tropical da família das bananeiras. É rica em potássio e açúcares naturais que fornecem energia rápida.
  fruit.orange:
    label: laranja
    summary: Uma fruta cítrica redonda de casca laranja perfumada.
    info: A laranja é uma fruta cítrica originária do Sudeste Asiático, hoje cultivada no mundo todo. É rica em vitamina C e apreciada como suco.
  fruit.strawberry:
    label: morango
    summary: Uma baga vermelha, suculenta e em forma de coração.
    info: O morango é uma fruta apreciada da família das rosáceas. Rico em vitamina C e antioxidantes, é colhido no verão e tem um perfume doce.
  fruit.grape:
    label: uva
    summary: Uma pequena baga redonda que cresce em cachos.
    info: A videira produz uvas de cores variadas, do verde ao roxo-escuro. As uvas são comidas frescas, secas em passas ou prensadas para fazer vinho.
  fruit.watermelon:
    label: melancia
    summary: Uma grande fruta verde listrada de polpa vermelha e suculenta.
    info: A melancia vem da África e é uma fruta de verão apreciada. É composta por 92% de água e contém licopeno, que lhe dá a cor vermelha.
  fruit.mango:
    label: manga
    summary: Uma fruta tropical de polpa suculenta amarelo-alaranjada.
    info: A manga é chamada de rainha das frutas tropicais. Rica em vitaminas A e C, vem do Sul da Ásia, onde é cultivada há 4.000 anos.
  fruit.cherry:
    label: cereja
    summary: Uma pequena drupa redonda e vermelha que cresce aos pares.
    info: A cereja é o fruto da cerejeira-brava, uma fruta de verão apreciada. Contém antioxidantes e melatonina; existem variedades doces e ácidas (ginjas).
  fruit.pear:
    label: pera
    summary: Uma fruta em forma de lágrima de sabor doce e suave.
    info: A pera é o fruto da pereira comum, parente próxima da macieira. Tem polpa macia e suculenta e alto teor de fibras; existem centenas de variedades.
  fruit.pineapple:
    label: abacaxi
    summary: Uma fruta tropical de coroa espinhosa e polpa dourada.
    info: O abacaxi vem da América do Sul e hoje é cultivado na faixa tropical do mundo todo. Contém a enzima bromelina, que ajuda na digestão.
  fruit.lemon:
    label: limão-siciliano
    summary: Um cítrico amarelo e ácido; fonte de vitamina C e aroma.
    info: |
      O limão-siciliano é uma fruta cítrica ácida originária da Ásia.
      É rico em vitamina C e ácido cítrico.
      É usado na culinária, em bebidas, em cosméticos e em produtos de limpeza.
      A casca do limoeiro (Citrus limon) contém um óleo essencial de aroma cítrico característico.
  fruit.lime:
    label: limão-taiti
    summary: Um pequeno cítrico verde e ácido; ingrediente-chave da culinária tropical.
    info: |
      O limão-taiti é um pequeno cítrico de suco ácido e casca aromática.
      É indispensável nas culinárias mexicana, tailandesa e vietnamita.
      Contém menos vitamina C que o limão-siciliano, mas um aroma mais forte.
      Comer limas protegia os marinheiros do escorbuto (vitamina C).
  fruit.kiwi:
    label: quivi
    summary: Uma fruta marrom e peluda de polpa verde; rica em vitaminas.
    info: |
      O quivi (Actinidia deliciosa) vem da China, onde é chamado de groselha-chinesa.
      A Nova Zelândia o comercializou e o renomeou em homenagem à sua ave nacional, o kiwi.
      Contém o dobro de vitamina C de uma laranja.
      A polpa é verde vívida; existem também variedades douradas (amarelas).
  fruit.peach:
    label: pêssego
    summary: Uma drupa aveludada amarelo-rosada; símbolo do verão.
    info: |
      O pêssego (Prunus persica) vem da China, onde é símbolo de imortalidade.
      Sua pele macia e aveludada é característica.
      Existem variedades brancas e amarelas; a nectarina é a variedade lisa, sem penugem.
      Na China, os pêssegos fazem parte do Ano-Novo e da mitologia curativa.
  fruit.plum:
    label: ameixa
    summary: Uma drupa roxa; base da aguardente de ameixa e da geleia.
    info: |
      A ameixa (Prunus domestica) é uma fruta básica da Europa Central.
      A slivovitz (aguardente de ameixa) é uma bebida tradicional tcheca e eslovaca.
      A geleia de ameixa é um produto típico da colheita de outono.
      No mundo existem mais de 2.000 variedades de ameixa.
  fruit.apricot:
    label: damasco
    summary: Uma pequena drupa laranja; agridoce e suculenta.
    info: |
      O damasco (Prunus armeniaca) vem da Ásia Central.
      É cultivado por toda a Europa; os mais doces vêm da Turquia e da Espanha.
      É rico em betacaroteno e vitamina A.
      Os damascos secos são um lanche saudável apreciado.
  fruit.raspberry:
    label: framboesa
    summary: Uma baga composta vermelha; símbolo do jardim de verão.
    info: |
      A framboesa (Rubus idaeus) é uma baga composta de muitas pequenas drupéolas.
      Cresce silvestre e cultivada; a colheita ocorre no verão e no outono.
      Rica em vitaminas C e K, manganês e antioxidantes.
      A geleia e o vinagre de framboesa são iguarias tradicionais.
  fruit.blueberry:
    label: mirtilo
    summary: Uma baga azul-escura; um superalimento cheio de antioxidantes.
    info: |
      O mirtilo (Vaccinium myrtillus silvestre, V. corymbosum cultivado) é rico em antocianinas.
      As antocianinas lhe dão a cor azul-escura e fortes propriedades antioxidantes.
      Estudos indicam efeitos positivos sobre as funções cognitivas e a saúde do coração.
      Os mirtilos cultivados são maiores que os silvestres das florestas.
  fruit.blackberry:
    label: amora-preta
    summary: Uma baga composta roxo-escura da silva.
    info: |
      A amora-preta (Rubus fruticosus) é uma baga composta roxo-escura que cresce num arbusto espinhoso.
      A amora-preta silvestre cresce nas bordas das florestas e nos matagais.
      Contém muita vitamina C, K e fibras.
      A geleia, a compota e o licor de amora-preta são produtos tradicionais.
  fruit.coconut:
    label: coco
    summary: Uma grande noz tropical de casca dura e polpa branca.
    info: |
      O coco (Cocos nucifera) é o fruto do coqueiro; botanicamente é uma drupa, não uma noz.
      A água de coco dentro do fruto verde é uma bebida isotônica natural.
      O leite e o óleo de coco são a base da culinária do Sudeste Asiático e indiana.
      O coqueiro é chamado de árvore de mil usos.
  fruit.papaya:
    label: mamão
    summary: Uma grande fruta tropical de polpa laranja intensa.
    info: |
      O mamão (Carica papaya) vem da América tropical.
      Contém a enzima papaína, que favorece a digestão de proteínas.
      É rico em vitamina C, betacaroteno e antioxidantes.
      O mamão verde é usado como legume na culinária do Sudeste Asiático (salada som tam).
  fruit.guava:
    label: goiaba
    summary: Uma fruta tropical de aroma intenso e polpa branca ou rosa.
    info: |
      A goiaba (Psidium guajava) vem da América tropical e se espalhou pela Ásia e África tropicais.
      Contém quatro vezes mais vitamina C que uma laranja.
      A casca e as sementes são comestíveis; a fruta inteira é nutritiva.
      O suco e a geleia de goiaba são produtos populares nos países tropicais.
  fruit.pomegranate:
    label: romã
    summary: Uma fruta vermelha com mil sementes doces; símbolo de fertilidade.
    info: |
      A romã (Punica granatum) vem da Ásia Central e do Mediterrâneo.
      Contém mais de 600 sementes envoltas por uma polpa vermelha translúcida (arilos).
      Rica em antioxidantes; estudos investigam seus efeitos sobre o coração e as inflamações.
      Simboliza fertilidade e abundância em muitas culturas (grega, judaica, islâmica).
  fruit.fig:
    label: figo
    summary: Uma fruta em forma de pera da figueira; doce e cheia de sementes.
    info: |
      O figo (Ficus carica) é uma das frutas cultivadas mais antigas; os vestígios remontam a 11.000 anos.
      Na verdade não é uma fruta, mas um receptáculo cheio de milhares de flores minúsculas.
      As folhas de Adão e Eva na história bíblica são folhas de figueira.
      Os figos secos são uma excelente fonte de cálcio, potássio e fibras.
  fruit.date:
    label: tâmara
    summary: Uma fruta marrom e oval doce da tamareira; alimento básico do Oriente Médio.
    info: |
      As tâmaras (Phoenix dactylifera) são os frutos doces da tamareira.
      São um alimento básico do Oriente Médio há milênios.
      Contêm mais de 60% de açúcar e são uma notável fonte de energia.
      No islã, as tâmaras são tradicionalmente comidas primeiro ao quebrar o jejum do Ramadã (Iftar).
  fruit.melon:
    label: melão
    summary: Uma grande fruta doce de polpa laranja, verde ou branca.
    info: |
      O melão (Cucumis melo) é uma fruta tropical a subtropical de alto teor de água.
      Vem da África e da Ásia; hoje é cultivado no mundo todo.
      Contém mais de 90% de água; é muito refrescante.
      Existem centenas de variedades, entre elas cantalupo, honeydew, galia e charentais.
  fruit.cantaloupe:
    label: melão-cantalupo
    summary: Um melão rendilhado amarelo-acastanhado de polpa laranja intensa.
    info: |
      O melão-cantalupo (Cucumis melo var. cantalupensis) é uma variedade apreciada de melão originária da Ásia.
      O nome vem da residência papal de Cantalupo, perto de Roma.
      A polpa laranja é rica em betacaroteno e vitamina A.
      É um dos tipos de melão mais doces.
  fruit.grapefruit:
    label: toranja
    summary: Um grande cítrico agridoce; estrela das dietas.
    info: |
      A toranja (Citrus paradisi) é um híbrido de laranja e pomelo.
      Foi descrita no século XVIII em Barbados.
      A toranja rosa e vermelha contém licopeno e betacaroteno.
      O suco de toranja interage com muitos medicamentos; os pacientes devem informar o médico.
  fruit.tangerine:
    label: tangerina
    summary: Um pequeno cítrico doce de casca solta; símbolo do Natal.
    info: |
      A tangerina (Citrus reticulata) é um pequeno cítrico fácil de descascar, originário da China.
      É símbolo do Ano-Novo chinês e de sorte.
      Em muitos países é uma fruta típica do Natal.
      Contém vitamina C, antioxidantes e flavonoides.
  fruit.passion_fruit:
    label: maracujá
    summary: Uma fruta tropical de casca roxa enrugada e polpa aromática cheia de sementes.
    info: |
      O maracujá (Passiflora edulis) vem da América do Sul tropical.
      Seu nome vem dos missionários que viam na flor os símbolos da paixão de Cristo.
      A polpa é cheia de sementes envoltas num gel aromático.
      É uma excelente fonte de vitamina C, fibras e antioxidantes.
  fruit.lychee:
    label: lichia
    summary: Uma pequena fruta tropical vermelha de polpa translúcida; apreciada na Ásia.
    info: |
      A lichia (Litchi chinensis) é uma fruta tropical originária da China.
      Sua casca vermelha áspera se descasca e revela uma polpa branca translúcida.
      Tem sabor doce e delicadamente aromático.
      Na China é símbolo de sorte e prosperidade.
  fruit.dragon_fruit:
    label: fruta-do-dragão
    summary: Uma fruta de cacto tropical rosa de polpa branca salpicada.
    info: |
      A fruta-do-dragão (pitaia, Hylocereus) vem do México e da América Central.
      Sua casca rosa vívida e sua polpa branca com sementes pretas são muito decorativas.
      Tem sabor suave; contém antioxidantes e vitamina C.
      Dela se fazem sucos, smoothies e sobremesas decorativas.
  fruit.starfruit:
    label: carambola
    summary: Uma fruta tropical amarela que forma estrelas ao ser cortada.
    info: |
      A carambola (Averrhoa carambola) vem do Sul e do Sudeste Asiático.
      Cortada transversalmente, forma um perfeito formato de estrela (por isso starfruit).
      Tem sabor agridoce; é rica em vitamina C.
      Pessoas com doença renal não devem comê-la por causa dos oxalatos.
  fruit.avocado:
    label: abacate
    summary: Uma drupa tropical cremosa; base do guacamole.
    info: |
      O abacate (Persea americana) vem do México e da América Central.
      Botanicamente é uma fruta (uma drupa), mas na culinária é usado como legume.
      Contém gorduras monoinsaturadas saudáveis (ácido oleico) como o azeite de oliva.
      É um alimento saudável em alta no mundo; o toast de abacate é um ícone da cultura de café moderna.
  fruit.persimmon:
    label: caqui
    summary: Uma fruta laranja parecida com um tomate; doce e adstringente.
    info: |
      O caqui (Diospyros kaki) vem da China e do Japão.
      O caqui verde é taninoso e adstringente; maduro é doce como mel.
      É rico em vitaminas A e C e minerais.
      No Japão é uma fruta de outono tradicional (kaki).
  fruit.mulberry:
    label: amora
    summary: Uma baga roxo-escura da amoreira; alimento do bicho-da-seda.
    info: |
      A amora (Morus) é a baga da amoreira; as folhas da amoreira são o alimento do bicho-da-seda.
      Existem amoras brancas, vermelhas e pretas; a preta é a mais doce.
      Na história, o cultivo da amoreira foi fundamental para a sericicultura.
      As amoras são ricas em resveratrol, vitamina C e ferro.
  fruit.cranberry:
    label: cranberry
    summary: Uma pequena baga vermelha e ácida; ingrediente tradicional americano.
    info: |
      A cranberry (Vaccinium macrocarpon) é uma pequena baga vermelha e ácida.
      É parte tradicional do Dia de Ação de Graças americano (molho de cranberry).
      Contém proantocianidinas, que impedem a adesão da bactéria E. coli às paredes das vias urinárias.
      O efeito da cranberry na prevenção de infecções urinárias é cientificamente comprovado.
  fruit.gooseberry:
    label: groselha-espinhosa
    summary: Uma pequena baga redonda e translúcida; queridinha dos jardins.
    info: |
      A groselha-espinhosa (Ribes uva-crispa) é uma pequena fruta típica dos jardins da Europa Central.
      Existe em variedades verdes, vermelhas e amarelas.
      É rica em vitamina C.
      O vinho de groselha-espinhosa é uma bebida historicamente apreciada.
  fruit.currant:
    label: groselha
    summary: Uma pequena baga vermelha, preta ou branca em cacho.
    info: |
      A groselha (Ribes) é uma pequena baga que cresce em cachos alongados.
      A groselha-preta (Ribes nigrum) tem mais vitamina C de todas as bagas.
      A groselha-preta é a base do sabor do Ribena (bebida britânica) e do licor de cassis.
      A groselha vermelha é usada em geleias e como decoração de sobremesas.
  fruit.quince:
    label: marmelo
    summary: Uma fruta amarela e dura, parente da maçã; consumida sempre cozida.
    info: |
      O marmelo (Cydonia oblonga) é parente da macieira e da pereira; cru, é duro e adstringente.
      É sempre processado com calor; geleia de marmelo (marmelada), vinho e aguardente de marmelo.
      Contém muita pectina, adequada para fazer geleias.
      A marmelada mais antiga registrada na Europa (século XVI) era feita de marmelos.
  fruit.jackfruit:
    label: jaca
    summary: Uma fruta tropical enorme; a maior fruta que cresce numa árvore no mundo.
    info: |
      A jaqueira (Artocarpus heterophyllus) produz as maiores frutas que crescem numa árvore; podem pesar mais de 35 kg.
      Vem da Ásia tropical; é um alimento básico na Índia, em Bangladesh e na Tailândia.
      A jaca verde tem textura neutra e é usada como substituto vegetariano da carne.
      Os gomos amarelos maduros são doces e aromáticos.
  fruit.durian:
    label: durião
    summary: Uma grande fruta tropical espinhosa de cheiro forte; o rei das frutas tropicais.
    info: |
      O durião (Durio zibethinus) é chamado de rei das frutas tropicais.
      Seu cheiro forte é repulsivo para uns e atraente para outros; em muitos hotéis asiáticos é proibido.
      A polpa é cremosa e doce, de sabor complexo (amêndoa, baunilha, queijo).
      No Sudeste Asiático é valorizado como um luxo requintado.
  fruit.rambutan:
    label: rambutão
    summary: Uma fruta tropical vermelha e peluda, semelhante à lichia.
    info: |
      O rambutão (Nephelium lappaceum) vem da Malásia; o nome vem do malaio rambut = cabelo.
      Sua casca vermelha é coberta de espinhos moles e curvos.
      A polpa é translúcida e doce, semelhante à lichia.
      É rico em vitamina C e ferro.
  fruit.longan:
    label: longana
    summary: Uma pequena fruta tropical marrom, parente da lichia.
    info: |
      A longana (Dimocarpus longan) é o fruto de uma árvore tropical originária da China.
      O nome vem do chinês long yan = olho de dragão, pela polpa translúcida com caroço preto.
      Tem sabor doce e aromático.
      Na medicina tradicional chinesa é considerada um alimento que fortalece o sangue e o coração.
  fruit.tamarind:
    label: tamarindo
    summary: Uma fruta marrom em vagem de polpa ácida; base da culinária tailandesa.
    info: |
      O tamarindo (Tamarindus indica) vem da África tropical; hoje é cultivado por todo o mundo tropical.
      A polpa é bem ácida e doce; é usada no Pad Thai, no molho inglês e no chutney indiano.
      A palavra vem do árabe tamr hindi = tâmara indiana.
      É rico em ácido tartárico, vitaminas do complexo B e ferro.
  fruit.nectarine:
    label: nectarina
    summary: Um pêssego liso, sem penugem; suculento e doce.
    info: |
      A nectarina (Prunus persica var. nucipersica) é uma mutação natural do pêssego com pele lisa.
      Difere do pêssego apenas pelo gene da lisura da pele.
      Tem sabor semelhante, mas consistência mais firme.
      O nome vem do néctar dos deuses; revela sua perfeição percebida.
  fruit.damson:
    label: ameixa-de-damasco
    summary: Uma pequena ameixa escura, típica dos jardins rurais ingleses.
    info: |
      A ameixa-de-damasco (damson) é uma pequena variedade de ameixa azul-escura a preta.
      O nome vem de Damasco, de onde a fruta viajou para a Europa.
      Crua, é bem ácida, mas excelente em geleias, compotas e gim (damson gin).
      Na tradição inglesa, é cultivada desde a Antiguidade.
  fruit.medlar:
    label: nêspera-europeia
    summary: Uma pequena fruta marrom, parente da macieira; deve amadurecer após a colheita.
    info: |
      A nêspera-europeia (Mespilus germanica) é uma planta de jardim antiquíssima, cultivada desde a Idade Média.
      Só é comestível após o amolecimento (blettismo), ou seja, depois de repousar após a colheita.
      É rica em taninos e vitamina C.
      Shakespeare a menciona em Romeu e Julieta; hoje é mais uma curiosidade de jardineiros.
  fruit.ackee:
    label: aki
    summary: Uma fruta tropical vermelha com arilos amarelos comestíveis; a fruta nacional da Jamaica.
    info: |
      O aki (Blighia sapida) é a fruta nacional da Jamaica; recebeu o nome do capitão Bligh (1793).
      Só os arilos amarelos maduros são comestíveis; a fruta verde ou passada é tóxica (hipoglicina A).
      Ackee and saltfish é o prato nacional da Jamaica.
      Vem da África Ocidental; foi levado ao Caribe pelo comércio de escravos.
  fruit.feijoa:
    label: feijoa
    summary: Uma pequena fruta verde e oval de polpa aromática.
    info: |
      A feijoa (Acca sellowiana, também Feijoa sellowiana) vem da América do Sul.
      Sua polpa tem um sabor aromático intenso (abacaxi, goiaba, menta).
      É muito popular na Nova Zelândia como fruta de outono.
      Pouco conhecida na Europa, mas apreciada nos países de origem.
