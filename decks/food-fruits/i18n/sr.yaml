lang: sr
pivot: false
title: Воће
cards:
  fruit.apple:
    label: јабука
    summary: Округао црвен или зелен плод слатко-киселкастог укуса.
    info: Јабука је плод јабуке, једне од најгајенијих култура на свету. Садржи витамин Ц и влакна; постоји више од 7.500 сорти.
  fruit.banana:
    label: банана
    summary: Жут тропски плод са слатком пулпом.
    info: Банана је плод тропске биљке из породице банана. Богата је калијумом и природним шећерима који дају брзу енергију.
  fruit.orange:
    label: поморанџа
    summary: Округао агрум с мирисном наранџастом кором.
    info: Поморанџа је агрум пореклом из југоисточне Азије, данас се гаји широм света. Богата је витамином Ц и омиљена као сок.
  fruit.strawberry:
    label: јагода
    summary: Црвена, сочна бобица у облику срца.
    info: Јагода је омиљен плод из породице ружа. Богата је витамином Ц и антиоксидансима, а бере се лети.
  fruit.grape:
    label: грожђе
    summary: Малена округла бобица која расте у гроздовима.
    info: Винова лоза даје грожђе разних боја, од зелене до тамнољубичасте. Грожђе се једе свеже, суши у сувогрожђе или цеди за вино.
  fruit.watermelon:
    label: лубеница
    summary: Велик плод са зеленим пругама и црвеном сочном пулпом.
    info: Лубеница потиче из Африке и омиљен је летњи плод. Састоји се од 92% воде и садржи ликопен, који јој даје црвену боју.
  fruit.mango:
    label: манго
    summary: Тропски плод са сочном жуто-наранџастом пулпом.
    info: Манго се назива краљем тропског воћа. Богат витаминима А и Ц, потиче из јужне Азије, где се гаји већ 4.000 година.
  fruit.cherry:
    label: трешња
    summary: Мали округао црвен коштичави плод који расте у паровима.
    info: Трешња је плод слатке трешње, омиљен летњи плод. Садржи антиоксидансе и мелатонин; постоје слатке и киселе сорте.
  fruit.pear:
    label: крушка
    summary: Плод у облику капи слатког и благог укуса.
    info: Крушка је плод крушке, блиске сроднице јабуке. Има меку, сочну пулпу и висок удео влакана; постоје стотине сорти.
  fruit.pineapple:
    label: ананас
    summary: Тропски плод с бодљикавом круном и златножутом пулпом.
    info: Ананас потиче из Јужне Америке, а данас се гаји у тропима широм света. Садржи ензим бромелаин, који помаже варење.
  fruit.lemon:
    label: лимун
    summary: Жут и кисео агрум; извор витамина Ц и ароме.
    info: |
      Лимун је кисео агрум пореклом из Азије.
      Богат је витамином Ц и лимунском киселином.
      Користи се у кухињи, у напицима, у козметици и у средствима за чишћење.
      Кора лимуна садржи етерично уље с карактеристичним мирисом лимуна.
  fruit.lime:
    label: лимета
    summary: Мален зелен и кисео агрум; кључни састојак тропске кухиње.
    info: |
      Лимета је мален зелени агрум киселог сока и ароматичне коре.
      Незаобилазна је у мексичкој, тајландској и вијетнамској кухињи.
      Садржи мање витамина Ц од лимуна, али јачу арому.
      Једење лимете штитило је морнаре од скорбута захваљујући витамину Ц.
  fruit.kiwi:
    label: киви
    summary: Смеђ длакав плод са зеленом пулпом; богат витаминима.
    info: |
      Киви потиче из Кине, где се назива кинеским огроздом.
      Нови Зеланд га је комерцијализовао и преименовао по својој националној птици, кивију.
      Садржи двоструко више витамина Ц од поморанџе.
      Пулпа је јарко зелена; постоје и златне (жуте) сорте.
  fruit.peach:
    label: бресква
    summary: Баршунаст жуто-ружичаст коштичави плод; симбол лета.
    info: |
      Бресква потиче из Кине, где је симбол бесмртности.
      Њена мека баршунаста кора је карактеристична.
      Постоје беле и жуте сорте; нектарина је глатка варијанта без маља.
      У Кини брескве чине део Нове године и лековите митологије.
  fruit.plum:
    label: шљива
    summary: Љубичаст коштичави плод; основа ракије и пекмеза од шљива.
    info: |
      Шљива је темељни плод средње Европе.
      Шљивовица (ракија од шљива) традиционално је чешко и словачко жестоко пиће.
      Пекмез од шљива типичан је производ јесење бербе.
      У свету постоји више од 2.000 сорти шљива.
  fruit.apricot:
    label: кајсија
    summary: Мален наранџаст коштичави плод; слатко-кисео и сочан.
    info: |
      Кајсија потиче из средње Азије.
      Гаји се широм Европе; најслађе долазе из Турске и Шпаније.
      Богата је бетакаротеном и витамином А.
      Суве кајсије омиљен су здрав међуоброк.
  fruit.raspberry:
    label: малина
    summary: Црвена скупна бобица; симбол летње баште.
    info: |
      Малина је скупна бобица састављена од много малених коштуница.
      Расте дивље и гајено; берба пада лети и у јесен.
      Богата је витаминима Ц и К, манганом и антиоксидансима.
      Пекмез и сирће од малине традиционалне су посластице.
  fruit.blueberry:
    label: боровница
    summary: Тамноплава бобица; суперхрана пуна антиоксиданаса.
    info: |
      Боровница је богата антоцијанима, пигментима јаких антиоксидативних својстава.
      Антоцијани јој дају тамноплаву боју.
      Истраживања указују на повољан утицај на когнитивне функције и здравље срца.
      Гајене боровнице веће су од дивљих.
  fruit.blackberry:
    label: купина
    summary: Тамнољубичаста скупна бобица с трновитог жбуна.
    info: |
      Купина је тамнољубичаста скупна бобица која расте на трновитом жбуну.
      Дивља купина расте на рубовима шума и у жбуњу.
      Садржи много витамина Ц, витамина К и влакана.
      Пекмез, компот и ликер од купине традиционални су производи.
  fruit.coconut:
    label: кокос
    summary: Велик тропски орах с тврдом љуском и белом пулпом.
    info: |
      Кокос је плод кокосове палме; ботанички је коштуница, а не орах.
      Кокосова вода из незрелог плода природни је изотонични напитак.
      Кокосово млеко и уље темељ су кухиње југоисточне Азије и Индије.
      Кокосову палму називају дрветом хиљаду намена.
  fruit.papaya:
    label: папаја
    summary: Велик тропски плод с дубоко наранџастом пулпом.
    info: |
      Папаја потиче из тропске Америке.
      Садржи ензим папаин, који потпомаже варење беланчевина.
      Богата је витамином Ц, бетакаротеном и антиоксидансима.
      Незрела папаја користи се као поврће у кухињи југоисточне Азије (у салати сом там).
  fruit.guava:
    label: гуава
    summary: Тропски плод снажног мириса и беле или ружичасте пулпе.
    info: |
      Гуава потиче из тропске Америке и проширила се тропском Азијом и Африком.
      Садржи четири пута више витамина Ц од поморанџе.
      Кора и семенке су јестиве; цео је плод хранљив.
      Сок и пекмез од гуаве популарни су производи у тропским земљама.
  fruit.pomegranate:
    label: нар
    summary: Црвен плод с хиљаду слатких семенки; симбол плодности.
    info: |
      Нар потиче из средње Азије и Средоземља.
      Садржи више од 600 семенки обавијених провидном црвеном пулпом (арилима).
      Богат је антиоксидансима; истраживања испитују његов утицај на срце и упале.
      Симболизује плодност и обиље у многим културама.
  fruit.fig:
    label: смоква
    summary: Крушколик плод смокве; сладак и пун семенки.
    info: |
      Смоква је један од најстаријих гајених плодова; њени трагови сежу 11.000 година уназад.
      Заправо није плод, него омотач испуњен хиљадама малених цветова.
      Смоквини листови Адама и Еве у библијској причи листови су смокве.
      Суве смокве изврстан су извор калцијума, калијума и влакана.
  fruit.date:
    label: урма
    summary: Сладак смеђ овалан плод урмине палме; основна намирница Блиског истока.
    info: |
      Урме су слатки плодови урмине палме.
      Већ су хиљадама година основна намирница Блиског истока.
      Садрже више од 60% шећера и изражен су извор енергије.
      У исламу се урме традиционално једу прве при прекиду рамазанског поста (ифтар).
  fruit.melon:
    label: диња
    summary: Велик сладак плод с наранџастом, зеленом или белом пулпом.
    info: |
      Диња је тропски до суптропски плод с високим уделом воде.
      Потиче из Африке и Азије; данас се гаји широм света.
      Састоји се од више од 90% воде и веома је освежавајућа.
      Постоје стотине сорти, међу њима канталупа, медна диња и галија.
  fruit.cantaloupe:
    label: диња канталупа
    summary: Мрежаста диња с дубоко наранџастом пулпом.
    info: |
      Диња канталупа омиљена је сорта диње пореклом из Азије.
      Име долази од папске резиденције Канталупо близу Рима.
      Наранџаста пулпа богата је бетакаротеном и витамином А.
      Једна је од најслађих сорти диње.
  fruit.grapefruit:
    label: грејпфрут
    summary: Велик горко-сладак агрум; звезда дијета.
    info: |
      Грејпфрут је укрштање поморанџе и помела.
      Описан је на Барбадосу у 18. веку.
      Ружичасти и црвени грејпфрут садрже ликопен и бетакаротен.
      Сок од грејпфрута ступа у интеракцију с многим лековима; пацијенти би требало да обавесте лекара.
  fruit.tangerine:
    label: мандарина
    summary: Мален сладак агрум с кором која се лако љушти; симбол Божића.
    info: |
      Мандарина је мален агрум који се лако љушти, пореклом из Кине.
      Симбол је кинеске Нове године и среће.
      У многим је земљама типичан божићни плод.
      Садржи витамин Ц, антиоксидансе и флавоноиде.
  fruit.passion_fruit:
    label: маракуја
    summary: Тропски плод наборане коре и ароматичне пулпе пуне семенки.
    info: |
      Маракуја потиче из тропске Јужне Америке.
      Име јој долази од мисионара који су у цвету видели симболе Христове муке.
      Пулпа је пуна семенки обавијених ароматичним гелом.
      Изврстан је извор витамина Ц, влакана и антиоксиданаса.
  fruit.lychee:
    label: личи
    summary: Мален црвен тропски плод провидне пулпе; омиљен у Азији.
    info: |
      Личи је тропски плод пореклом из Кине.
      Његова храпава црвена кора лако се љушти и открива провидну белу пулпу.
      Има сладак и фино ароматичан укус.
      У Кини је симбол среће и благостања.
  fruit.dragon_fruit:
    label: змајево воће
    summary: Ружичаст тропски плод кактуса с белом пегавом пулпом.
    info: |
      Змајево воће (питаја) потиче из Мексика и Средње Америке.
      Његова јарко ружичаста кора и бела пулпа с црним семенкама веома су декоративне.
      Има благ укус и садржи антиоксидансе и витамин Ц.
      Од њега се праве сокови, смутији и декоративни дезерти.
  fruit.starfruit:
    label: карамбола
    summary: Жут тропски плод који при сечењу ствара звезде.
    info: |
      Карамбола потиче из јужне и југоисточне Азије.
      Пресечена попреко ствара савршену звезду, по чему је и добила енглески назив starfruit.
      Има слатко-киселкаст укус и богата је витамином Ц.
      Особе с бубрежним болестима не смеју је јести због оксалата.
  fruit.avocado:
    label: авокадо
    summary: Кремаста тропска коштуница; основа гвакамола.
    info: |
      Авокадо потиче из Мексика и Средње Америке.
      Ботанички је плод (коштуница), али се у кухињи користи као поврће.
      Садржи здраве мононезасићене масти (олеинску киселину), попут маслиновог уља.
      Трендовска је здрава храна широм света; тост с авокадом икона је модерне кафанске културе.
  fruit.persimmon:
    label: каки
    summary: Наранџаст плод налик парадајзу; сладак и опор.
    info: |
      Каки потиче из Кине и Јапана; назива се и јапанском јабуком.
      Незрео каки богат је танинима и опор; зрео је сладак попут меда.
      Богат је витаминима А и Ц те минералима.
      У Јапану је традиционалан јесењи плод.
  fruit.mulberry:
    label: дуд
    summary: Тамнољубичаста бобица дуда; храна свилене бубе.
    info: |
      Дудиња је плод дуда; листови дуда храна су свилене бубе.
      Постоје бели, црвени и црни дудови; црни је најслађи.
      У историји је гајење дуда било кључно за производњу свиле.
      Дудиње су богате ресвератролом, витамином Ц и гвожђем.
  fruit.cranberry:
    label: брусница
    summary: Малена црвена кисела бобица; традиционални амерички састојак.
    info: |
      Брусница је малена кисела црвена бобица.
      Традиционални је део америчког Дана захвалности (сос од брусница).
      Садржи проантоцијанидине, који спречавају бактерије Escherichia coli да се прихвате за зидове мокраћних путева.
      Утицај бруснице у превенцији инфекција мокраћних путева научно је потврђен.
  fruit.gooseberry:
    label: огрозд
    summary: Малена округла провидна бобица; љубимица башти.
    info: |
      Огрозд је мален плод типичан за баште средње Европе.
      Постоји у зеленим, црвеним и жутим сортама.
      Богат је витамином Ц.
      Вино од огрозда историјски је омиљено пиће.
  fruit.currant:
    label: рибизла
    summary: Малена црвена, црна или бела бобица у грозду.
    info: |
      Рибизла је малена бобица која расте у гроздовима.
      Црна рибизла садржи највише витамина Ц од свих бобица.
      Црна рибизла темељ је укуса ликера касис и британског напитка Рибена.
      Црвена рибизла користи се у пекмезима и као украс дезерта.
  fruit.quince:
    label: дуња
    summary: Тврд жут плод сродан јабуци; једе се увек куван.
    info: |
      Дуња је сродна јабуци и крушки; сирова је тврда и опора.
      Увек се обрађује топлотом у желе од дуње (мембриљо), вино или ракију од дуње.
      Садржи много пектина, погодног за израду пекмеза.
      Најстарији у Европи забележени џем (16. век) прављен је од дуња.
  fruit.jackfruit:
    label: џекфрут
    summary: Огроман тропски плод; највећи плод на свету који расте на дрвету.
    info: |
      Џекфрут даје највеће плодове који расту на дрвету; могу тежити више од 35 kg.
      Потиче из тропске Азије и основна је намирница у Индији, Бангладешу и Тајланду.
      Незрео џекфрут има неутралну текстуру и користи се као вегетаријанска замена за месо.
      Зрели жути комади слатки су и ароматични.
  fruit.durian:
    label: дуријан
    summary: Велик бодљикав тропски плод снажног мириса; краљ тропског воћа.
    info: |
      Дуријан се назива краљем тропског воћа.
      Његов снажан мирис одбојан је једнима, а примамљив другима; у многим је азијским хотелима забрањен.
      Пулпа је кремаста и слатка, сложеног укуса бадема, ваниле и сира.
      У југоисточној Азији цени се као профињена раскош.
  fruit.rambutan:
    label: рамбутан
    summary: Црвен длакав тропски плод, сличан личију.
    info: |
      Рамбутан потиче из Малезије; име долази од малајске речи rambut, што значи коса.
      Његова црвена кора прекривена је меким кукастим израслинама.
      Пулпа је провидна и слатка, попут оне личија.
      Богат је витамином Ц и гвожђем.
  fruit.longan:
    label: лонган
    summary: Мален смеђ тропски плод, сродан личију.
    info: |
      Лонган је плод тропског дрвета пореклом из Кине.
      Име долази од кинеске речи long yan, што значи змајево око, због провидне пулпе с црном семенком.
      Има сладак и ароматичан укус.
      У традиционалној кинеској медицини сматра се храном која јача крв и срце.
  fruit.tamarind:
    label: тамаринд
    summary: Смеђа махуна киселе пулпе; основа тајландске кухиње.
    info: |
      Тамаринд потиче из тропске Африке; данас се гаји у целим тропима.
      Пулпа је изразито кисела и слатка; користи се у пад тају, у Вустер сосу и у индијском чатнију.
      Реч долази из арапског tamr hindi, што значи индијска урма.
      Богат је винском киселином, витаминима групе Б и гвожђем.
  fruit.nectarine:
    label: нектарина
    summary: Глатка бресква без маља; сочна и слатка.
    info: |
      Нектарина је природна мутација брескве с глатком кором.
      Од брескве се разликује само геном за глаткоћу коре.
      Има сличан укус, али чвршћу структуру.
      Име долази од нектара богова и сведочи о њеној наводној савршености.
  fruit.damson:
    label: дамаскинска шљива
    summary: Малена тамна шљива, типична за енглеске сеоске баште.
    info: |
      Дамаскинска шљива малена је сорта шљиве тамне плаво-црне боје.
      Назив damson долази од Дамаска, одакле је плод стигао у Европу.
      Сирова је веома кисела, али изврсна у пекмезима, компотима и џину (damson gin).
      У енглеској се традицији гаји од давнина.
  fruit.medlar:
    label: мушмула
    summary: Мален смеђ плод сродан јабуци; мора сазревати после бербе.
    info: |
      Мушмула је древна баштенска биљка која се гаји од средњег века.
      Јестива је тек након што омекша (труљење), дакле после сазревања по берби.
      Богата је танинима и витамином Ц.
      Шекспир је помиње у Ромеу и Јулији; данас је више занимљивост за баштоване.
  fruit.ackee:
    label: аки
    summary: Црвен тропски плод с јестивим жутим арилима; национални плод Јамајке.
    info: |
      Аки је национални плод Јамајке; име је добио по капетану Блају (1793).
      Јестиви су само зрели жути арили; незрео или презрео плод је отрован (хипоглицин А).
      Ackee and saltfish национално је јело Јамајке.
      Потиче из западне Африке и довезен је на Карибе трговином робљем.
  fruit.feijoa:
    label: фејхоа
    summary: Мален овалан зелен плод ароматичне пулпе.
    info: |
      Фејхоа потиче из Јужне Америке.
      Њена пулпа има интензиван ароматичан укус ананаса, гуаве и нане.
      Веома је популарна на Новом Зеланду као јесењи плод.
      Мало је позната у Европи, али омиљена у земљама порекла.
