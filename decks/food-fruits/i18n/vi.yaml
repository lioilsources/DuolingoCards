lang: vi
pivot: false
title: Trái cây
cards:
  fruit.apple:
    label: táo
    summary: Một loại quả tròn màu đỏ hoặc xanh với vị chua ngọt.
    info: Táo là quả của cây táo, một trong những loại cây trồng phổ biến nhất thế giới. Táo chứa vitamin C và chất xơ; có hơn 7.500 giống.
  fruit.banana:
    label: chuối
    summary: Một loại quả nhiệt đới màu vàng với phần thịt ngọt.
    info: Chuối là quả của một loại cây nhiệt đới thuộc họ chuối. Chuối giàu kali và đường tự nhiên giúp cung cấp năng lượng nhanh.
  fruit.orange:
    label: cam
    summary: Một loại quả có múi tròn với vỏ màu cam thơm.
    info: Cam là quả có múi có nguồn gốc từ Đông Nam Á, nay được trồng khắp thế giới. Cam giàu vitamin C và được ưa chuộng ở dạng nước ép.
  fruit.strawberry:
    label: dâu tây
    summary: Một loại quả mọng màu đỏ, mọng nước, hình trái tim.
    info: Dâu tây là loại quả được ưa chuộng thuộc họ hoa hồng. Dâu tây giàu vitamin C và chất chống oxy hóa, được thu hoạch vào mùa hè.
  fruit.grape:
    label: nho
    summary: Một loại quả mọng nhỏ, tròn, mọc thành chùm.
    info: Cây nho cho quả nho với nhiều màu sắc khác nhau, từ xanh đến tím sẫm. Nho được ăn tươi, phơi khô thành nho khô hoặc ép để làm rượu vang.
  fruit.watermelon:
    label: dưa hấu
    summary: Một loại quả lớn có sọc xanh với phần thịt đỏ, mọng nước.
    info: Dưa hấu có nguồn gốc từ châu Phi và là loại quả mùa hè được ưa chuộng. Dưa hấu gồm 92% là nước và chứa lycopene, tạo nên màu đỏ của nó.
  fruit.mango:
    label: xoài
    summary: Một loại quả nhiệt đới với phần thịt màu vàng cam, mọng nước.
    info: Xoài được gọi là vua của các loại quả nhiệt đới. Giàu vitamin A và C, xoài có nguồn gốc từ Nam Á, nơi nó được trồng suốt 4.000 năm.
  fruit.cherry:
    label: anh đào
    summary: Một loại quả hạch nhỏ, tròn, màu đỏ, mọc thành đôi.
    info: Anh đào là quả của cây anh đào ngọt, một loại quả mùa hè được ưa chuộng. Anh đào chứa chất chống oxy hóa và melatonin; có giống ngọt và giống chua.
  fruit.pear:
    label: lê
    summary: Một loại quả hình giọt nước với vị ngọt dịu.
    info: Lê là quả của cây lê, họ hàng gần của táo. Lê có phần thịt mềm, mọng nước và hàm lượng chất xơ cao; có hàng trăm giống.
  fruit.pineapple:
    label: dứa
    summary: Một loại quả nhiệt đới với mào gai và phần thịt màu vàng óng.
    info: Dứa có nguồn gốc từ Nam Mỹ và nay được trồng ở vùng nhiệt đới khắp thế giới. Dứa chứa enzyme bromelain, giúp tiêu hóa.
  fruit.lemon:
    label: chanh vàng
    summary: Một loại quả có múi màu vàng và chua; nguồn vitamin C và hương thơm.
    info: |
      Chanh vàng là quả có múi vị chua có nguồn gốc từ châu Á.
      Chanh vàng giàu vitamin C và axit citric.
      Chanh vàng được dùng trong nấu ăn, trong đồ uống, trong mỹ phẩm và trong sản phẩm tẩy rửa.
      Vỏ chanh vàng chứa tinh dầu với hương chanh đặc trưng.
  fruit.lime:
    label: chanh xanh
    summary: Một loại quả có múi nhỏ, màu xanh và chua; nguyên liệu chính của ẩm thực nhiệt đới.
    info: |
      Chanh xanh là quả có múi nhỏ màu xanh với nước cốt chua và vỏ thơm.
      Chanh xanh không thể thiếu trong ẩm thực Mexico, Thái Lan và Việt Nam.
      Chanh xanh chứa ít vitamin C hơn chanh vàng, nhưng hương thơm mạnh hơn.
      Ăn chanh xanh giúp thủy thủ tránh bệnh hoại huyết nhờ vitamin C.
  fruit.kiwi:
    label: kiwi
    summary: Một loại quả màu nâu có lông với phần thịt xanh; giàu vitamin.
    info: |
      Kiwi có nguồn gốc từ Trung Quốc, nơi nó được gọi là lý gai Trung Hoa.
      New Zealand đã thương mại hóa và đổi tên nó theo loài chim quốc gia của mình, chim kiwi.
      Kiwi chứa lượng vitamin C gấp đôi một quả cam.
      Phần thịt màu xanh tươi; cũng có giống vàng (ánh kim).
  fruit.peach:
    label: đào
    summary: Một loại quả hạch màu vàng hồng, mượt như nhung; biểu tượng mùa hè.
    info: |
      Đào có nguồn gốc từ Trung Quốc, nơi nó là biểu tượng của sự bất tử.
      Lớp vỏ mềm mượt như nhung của nó là đặc trưng.
      Có giống trắng và giống vàng; xuân đào là giống trơn, không lông.
      Ở Trung Quốc, đào là một phần của Tết và của thần thoại chữa lành.
  fruit.plum:
    label: mận
    summary: Một loại quả hạch màu tím; nền tảng của rượu mận và mứt mận.
    info: |
      Mận là loại quả nền tảng của Trung Âu.
      Slivovitz (rượu mận) là một loại rượu mạnh truyền thống của Séc và Slovakia.
      Mứt mận là sản phẩm tiêu biểu của vụ thu hoạch mùa thu.
      Trên thế giới có hơn 2.000 giống mận.
  fruit.apricot:
    label: mơ
    summary: Một loại quả hạch nhỏ màu cam; chua ngọt và mọng nước.
    info: |
      Mơ có nguồn gốc từ Trung Á.
      Mơ được trồng khắp châu Âu; ngọt nhất là loại đến từ Thổ Nhĩ Kỳ và Tây Ban Nha.
      Mơ giàu beta-caroten và vitamin A.
      Mơ khô là món ăn vặt lành mạnh được ưa chuộng.
  fruit.raspberry:
    label: mâm xôi
    summary: Một loại quả mọng kép màu đỏ; biểu tượng của khu vườn mùa hè.
    info: |
      Mâm xôi là quả mọng kép gồm nhiều quả hạch nhỏ.
      Mâm xôi mọc hoang và được trồng; vụ thu hoạch vào mùa hè và mùa thu.
      Mâm xôi giàu vitamin C và K, mangan và chất chống oxy hóa.
      Mứt và giấm mâm xôi là những món ngon truyền thống.
  fruit.blueberry:
    label: việt quất
    summary: Một loại quả mọng màu xanh sẫm; siêu thực phẩm giàu chất chống oxy hóa.
    info: |
      Việt quất giàu anthocyanin, các sắc tố có đặc tính chống oxy hóa mạnh.
      Anthocyanin tạo nên màu xanh sẫm của nó.
      Các nghiên cứu cho thấy tác động tích cực lên chức năng nhận thức và sức khỏe tim mạch.
      Việt quất trồng lớn hơn việt quất hoang dã.
  fruit.blackberry:
    label: mâm xôi đen
    summary: Một loại quả mọng kép màu tím sẫm mọc trên bụi gai.
    info: |
      Mâm xôi đen là quả mọng kép màu tím sẫm mọc trên một bụi cây có gai.
      Mâm xôi đen hoang dại mọc ở bìa rừng và trong các bụi rậm.
      Mâm xôi đen chứa nhiều vitamin C, vitamin K và chất xơ.
      Mứt, mứt hầm và rượu mùi mâm xôi đen là những sản phẩm truyền thống.
  fruit.coconut:
    label: dừa
    summary: Một loại quả nhiệt đới lớn với vỏ cứng và phần cơm trắng.
    info: |
      Dừa là quả của cây dừa; về mặt thực vật học nó là quả hạch, không phải hạt.
      Nước dừa trong quả non là một loại đồ uống đẳng trương tự nhiên.
      Nước cốt dừa và dầu dừa là nền tảng của ẩm thực Đông Nam Á và Ấn Độ.
      Cây dừa được gọi là cây của ngàn công dụng.
  fruit.papaya:
    label: đu đủ
    summary: Một loại quả nhiệt đới lớn với phần thịt màu cam đậm.
    info: |
      Đu đủ có nguồn gốc từ vùng nhiệt đới châu Mỹ.
      Đu đủ chứa enzyme papain, giúp tiêu hóa protein.
      Đu đủ giàu vitamin C, beta-caroten và chất chống oxy hóa.
      Đu đủ xanh được dùng làm rau trong ẩm thực Đông Nam Á (trong món nộm som tam).
  fruit.guava:
    label: ổi
    summary: Một loại quả nhiệt đới thơm nồng với phần thịt trắng hoặc hồng.
    info: |
      Ổi có nguồn gốc từ vùng nhiệt đới châu Mỹ và đã lan sang châu Á và châu Phi nhiệt đới.
      Ổi chứa lượng vitamin C nhiều gấp bốn lần một quả cam.
      Vỏ và hạt đều ăn được; cả quả đều bổ dưỡng.
      Nước ép và mứt ổi là những sản phẩm phổ biến ở các nước nhiệt đới.
  fruit.pomegranate:
    label: lựu
    summary: Một loại quả màu đỏ với ngàn hạt ngọt; biểu tượng của sự sinh sôi.
    info: |
      Lựu có nguồn gốc từ Trung Á và Địa Trung Hải.
      Lựu chứa hơn 600 hạt được bao bọc bởi phần thịt đỏ trong suốt (áo hạt).
      Lựu giàu chất chống oxy hóa; các nghiên cứu tìm hiểu tác động của nó lên tim và viêm.
      Lựu tượng trưng cho sự sinh sôi và sung túc trong nhiều nền văn hóa.
  fruit.fig:
    label: sung ngọt
    summary: Một loại quả hình quả lê của cây sung; ngọt và đầy hạt.
    info: |
      Sung ngọt là một trong những loại quả được trồng lâu đời nhất; dấu vết của nó có từ 11.000 năm trước.
      Thật ra nó không phải là quả, mà là một cái bao chứa hàng ngàn bông hoa nhỏ.
      Lá sung của Adam và Eva trong câu chuyện Kinh Thánh là lá của cây sung.
      Sung ngọt khô là nguồn canxi, kali và chất xơ tuyệt vời.
  fruit.date:
    label: chà là
    summary: Một loại quả bầu dục màu nâu ngọt của cây chà là; thực phẩm chính của Trung Đông.
    info: |
      Chà là là quả ngọt của cây chà là.
      Suốt hàng ngàn năm, chà là là thực phẩm chính của Trung Đông.
      Chà là chứa hơn 60% đường và là nguồn năng lượng nổi bật.
      Trong đạo Hồi, chà là theo truyền thống được ăn đầu tiên khi xả chay tháng Ramadan (iftar).
  fruit.melon:
    label: dưa lê
    summary: Một loại quả lớn, ngọt với phần thịt màu cam, xanh hoặc trắng.
    info: |
      Dưa lê là loại quả nhiệt đới đến cận nhiệt đới với hàm lượng nước cao.
      Nó có nguồn gốc từ châu Phi và châu Á; nay được trồng khắp thế giới.
      Nó gồm hơn 90% là nước và rất giải khát.
      Có hàng trăm giống, trong đó có dưa lưới, dưa mật và galia.
  fruit.cantaloupe:
    label: dưa lưới
    summary: Một loại dưa vỏ lưới với phần thịt màu cam đậm.
    info: |
      Dưa lưới là giống dưa được ưa chuộng, có nguồn gốc từ châu Á.
      Tên gọi bắt nguồn từ dinh thự của Giáo hoàng ở Cantalupo gần Roma.
      Phần thịt màu cam giàu beta-caroten và vitamin A.
      Nó là một trong những giống dưa ngọt nhất.
  fruit.grapefruit:
    label: bưởi chùm
    summary: Một loại quả có múi lớn, ngọt-đắng; ngôi sao của các chế độ ăn kiêng.
    info: |
      Bưởi chùm là giống lai giữa cam và bưởi.
      Bưởi chùm được mô tả ở Barbados vào thế kỷ 18.
      Bưởi chùm hồng và đỏ chứa lycopene và beta-caroten.
      Nước ép bưởi chùm tương tác với nhiều loại thuốc; bệnh nhân nên báo cho bác sĩ.
  fruit.tangerine:
    label: quýt
    summary: Một loại quả có múi nhỏ, ngọt với vỏ dễ bóc; biểu tượng của Giáng Sinh.
    info: |
      Quýt là quả có múi nhỏ, dễ bóc vỏ, có nguồn gốc từ Trung Quốc.
      Nó là biểu tượng của Tết Nguyên Đán và may mắn.
      Ở nhiều nước, quýt là loại quả tiêu biểu của Giáng Sinh.
      Quýt chứa vitamin C, chất chống oxy hóa và flavonoid.
  fruit.passion_fruit:
    label: chanh dây
    summary: Một loại quả nhiệt đới với vỏ nhăn và phần thịt thơm đầy hạt.
    info: |
      Chanh dây có nguồn gốc từ vùng nhiệt đới Nam Mỹ.
      Tên của nó bắt nguồn từ các nhà truyền giáo, những người nhìn thấy biểu tượng cuộc thương khó của Chúa Kitô trên bông hoa.
      Phần thịt đầy hạt được bao bọc bởi một lớp gel thơm.
      Chanh dây là nguồn vitamin C, chất xơ và chất chống oxy hóa tuyệt vời.
  fruit.lychee:
    label: vải
    summary: Một loại quả nhiệt đới nhỏ, màu đỏ với phần thịt trong suốt; được ưa chuộng ở châu Á.
    info: |
      Vải là loại quả nhiệt đới có nguồn gốc từ Trung Quốc.
      Lớp vỏ đỏ sần sùi của nó dễ bóc và để lộ phần thịt trắng trong suốt.
      Vải có vị ngọt và hương thơm tinh tế.
      Ở Trung Quốc, vải là biểu tượng của may mắn và thịnh vượng.
  fruit.dragon_fruit:
    label: thanh long
    summary: Một loại quả xương rồng nhiệt đới màu hồng với phần thịt trắng lấm tấm.
    info: |
      Thanh long (pitaya) có nguồn gốc từ Mexico và Trung Mỹ.
      Lớp vỏ hồng rực và phần thịt trắng với hạt đen của nó rất bắt mắt.
      Nó có vị dịu và chứa chất chống oxy hóa cùng vitamin C.
      Từ thanh long người ta làm nước ép, sinh tố và món tráng miệng trang trí.
  fruit.starfruit:
    label: khế
    summary: Một loại quả nhiệt đới màu vàng tạo hình ngôi sao khi cắt ra.
    info: |
      Khế có nguồn gốc từ Nam Á và Đông Nam Á.
      Cắt ngang, khế tạo thành một ngôi sao hoàn hảo; từ đó có tên tiếng Anh là starfruit.
      Khế có vị chua ngọt và giàu vitamin C.
      Người mắc bệnh thận không nên ăn khế vì hàm lượng oxalat.
  fruit.avocado:
    label: bơ
    summary: Một loại quả hạch nhiệt đới béo ngậy; nền tảng của món guacamole.
    info: |
      Bơ có nguồn gốc từ Mexico và Trung Mỹ.
      Về mặt thực vật học nó là quả (quả hạch), nhưng trong ẩm thực được dùng như một loại rau.
      Bơ chứa chất béo không bão hòa đơn lành mạnh (axit oleic), giống như dầu ô liu.
      Bơ là món ăn lành mạnh thịnh hành khắp thế giới; bánh mì nướng phết bơ là biểu tượng của văn hóa quán cà phê hiện đại.
  fruit.persimmon:
    label: hồng
    summary: Một loại quả màu cam giống quả cà chua; ngọt và chát.
    info: |
      Hồng có nguồn gốc từ Trung Quốc và Nhật Bản; còn được gọi là hồng kaki.
      Hồng chưa chín giàu tanin và chát; khi chín nó ngọt như mật.
      Hồng giàu vitamin A và C cùng khoáng chất.
      Ở Nhật Bản, hồng là loại quả mùa thu truyền thống.
  fruit.mulberry:
    label: dâu tằm
    summary: Một loại quả mọng màu tím sẫm của cây dâu tằm; thức ăn của tằm.
    info: |
      Dâu tằm là quả của cây dâu tằm; lá cây dâu tằm là thức ăn của tằm.
      Có dâu tằm trắng, đỏ và đen; loại đen ngọt nhất.
      Trong lịch sử, việc trồng dâu tằm có vai trò then chốt đối với sản xuất tơ lụa.
      Dâu tằm giàu resveratrol, vitamin C và sắt.
  fruit.cranberry:
    label: nam việt quất
    summary: Một loại quả mọng nhỏ, màu đỏ và chua; nguyên liệu truyền thống của Mỹ.
    info: |
      Nam việt quất là một loại quả mọng nhỏ, chua, màu đỏ.
      Nó là một phần truyền thống của Lễ Tạ ơn của Mỹ (sốt nam việt quất).
      Nó chứa proanthocyanidin, ngăn vi khuẩn Escherichia coli bám vào thành đường tiết niệu.
      Tác dụng của nam việt quất trong việc phòng ngừa nhiễm trùng đường tiết niệu đã được khoa học chứng minh.
  fruit.gooseberry:
    label: lý gai
    summary: Một loại quả mọng nhỏ, tròn và trong mờ; loại quả yêu thích của khu vườn.
    info: |
      Lý gai là loại quả nhỏ đặc trưng của các khu vườn Trung Âu.
      Có các giống màu xanh, đỏ và vàng.
      Lý gai giàu vitamin C.
      Rượu lý gai là một loại đồ uống được ưa chuộng trong lịch sử.
  fruit.currant:
    label: lý chua
    summary: Một loại quả mọng nhỏ màu đỏ, đen hoặc trắng mọc thành chùm.
    info: |
      Lý chua là loại quả mọng nhỏ mọc thành chùm.
      Lý chua đen chứa nhiều vitamin C nhất trong tất cả các loại quả mọng.
      Lý chua đen là nền tảng hương vị của rượu mùi cassis và đồ uống Ribena của Anh.
      Lý chua đỏ được dùng trong mứt và để trang trí món tráng miệng.
  fruit.quince:
    label: mộc qua
    summary: Một loại quả cứng màu vàng, họ hàng với táo; luôn được ăn sau khi nấu chín.
    info: |
      Mộc qua họ hàng với táo và lê; khi còn sống nó cứng và chát.
      Mộc qua luôn được chế biến bằng nhiệt thành thạch mộc qua (membrillo), rượu vang hoặc rượu mộc qua.
      Mộc qua chứa nhiều pectin, thích hợp để làm mứt.
      Loại mứt lâu đời nhất được ghi nhận ở châu Âu (thế kỷ 16) được làm từ mộc qua.
  fruit.jackfruit:
    label: mít
    summary: Một loại quả nhiệt đới khổng lồ; loại quả lớn nhất thế giới mọc trên cây.
    info: |
      Mít cho những quả lớn nhất mọc trên cây; chúng có thể nặng hơn 35 kg.
      Mít có nguồn gốc từ vùng nhiệt đới châu Á và là thực phẩm chính ở Ấn Độ, Bangladesh và Thái Lan.
      Mít non có kết cấu trung tính và được dùng làm món thay thịt cho người ăn chay.
      Những múi vàng chín có vị ngọt và thơm.
  fruit.durian:
    label: sầu riêng
    summary: Một loại quả nhiệt đới lớn, có gai với mùi nồng; vua của các loại quả nhiệt đới.
    info: |
      Sầu riêng được gọi là vua của các loại quả nhiệt đới.
      Mùi nồng của nó khiến một số người khó chịu và hấp dẫn với người khác; ở nhiều khách sạn châu Á, sầu riêng bị cấm.
      Phần thịt béo ngậy và ngọt, với hương vị phức hợp của hạnh nhân, vani và phô mai.
      Ở Đông Nam Á, sầu riêng được coi trọng như một thứ xa xỉ tinh tế.
  fruit.rambutan:
    label: chôm chôm
    summary: Một loại quả nhiệt đới màu đỏ, có lông, giống quả vải.
    info: |
      Chôm chôm có nguồn gốc từ Malaysia; tên gọi bắt nguồn từ tiếng Mã Lai rambut, nghĩa là tóc.
      Lớp vỏ đỏ của nó được phủ những gai mềm hình móc.
      Phần thịt trong suốt và ngọt, giống như quả vải.
      Chôm chôm giàu vitamin C và sắt.
  fruit.longan:
    label: nhãn
    summary: Một loại quả nhiệt đới nhỏ màu nâu, họ hàng với quả vải.
    info: |
      Nhãn là quả của một loại cây nhiệt đới có nguồn gốc từ Trung Quốc.
      Tên gọi bắt nguồn từ tiếng Hán long yan, nghĩa là mắt rồng, vì phần thịt trong suốt với một hạt đen.
      Nhãn có vị ngọt và thơm.
      Trong y học cổ truyền Trung Hoa, nhãn được coi là thực phẩm bồi bổ máu và tim.
  fruit.tamarind:
    label: me
    summary: Một quả đậu màu nâu với phần thịt chua; nền tảng của ẩm thực Thái Lan.
    info: |
      Me có nguồn gốc từ vùng nhiệt đới châu Phi; nay được trồng khắp các vùng nhiệt đới.
      Phần thịt rất chua và ngọt; được dùng trong món pad thai, trong sốt Worcestershire và trong tương ớt Ấn Độ.
      Từ này bắt nguồn từ tiếng Ả Rập tamr hindi, nghĩa là chà là Ấn Độ.
      Me giàu axit tartaric, các vitamin nhóm B và sắt.
  fruit.nectarine:
    label: xuân đào
    summary: Một loại đào trơn không lông; mọng nước và ngọt.
    info: |
      Xuân đào là một đột biến tự nhiên của quả đào với lớp vỏ trơn.
      Nó chỉ khác quả đào ở gen quyết định độ trơn của vỏ.
      Nó có vị tương tự, nhưng kết cấu chắc hơn.
      Tên gọi bắt nguồn từ mật hoa của các vị thần và chứng tỏ sự hoàn hảo được cho là của nó.
  fruit.damson:
    label: mận damson
    summary: Một loại mận nhỏ, sẫm màu, đặc trưng của những khu vườn thôn quê nước Anh.
    info: |
      Mận damson là một giống mận nhỏ có màu xanh-đen sẫm.
      Tên gọi damson bắt nguồn từ Damascus, nơi loại quả này đến châu Âu.
      Khi còn sống nó rất chua, nhưng tuyệt vời trong mứt, mứt hầm và rượu gin (damson gin).
      Trong truyền thống nước Anh, mận damson đã được trồng từ thời cổ đại.
  fruit.medlar:
    label: medlar
    summary: Một loại quả nhỏ màu nâu, họ hàng với táo; phải chín sau khi thu hoạch.
    info: |
      Medlar là một loại cây vườn cổ xưa được trồng từ thời Trung Cổ.
      Medlar chỉ ăn được sau khi mềm đi (ủ chín), tức là sau khi chín tiếp theo sau thu hoạch.
      Medlar giàu tanin và vitamin C.
      Shakespeare nhắc đến nó trong Romeo và Juliet; ngày nay nó chủ yếu là một điều lạ đối với người làm vườn.
  fruit.ackee:
    label: aki
    summary: Một loại quả nhiệt đới màu đỏ với áo hạt vàng ăn được; quả quốc gia của Jamaica.
    info: |
      Aki là quả quốc gia của Jamaica; nó được đặt tên theo Thuyền trưởng Bligh (1793).
      Chỉ áo hạt vàng chín mới ăn được; quả xanh hoặc quá chín thì độc (hypoglycin A).
      Ackee and saltfish là món ăn quốc gia của Jamaica.
      Aki có nguồn gốc từ Tây Phi và được đưa đến vùng Caribe qua nạn buôn nô lệ.
  fruit.feijoa:
    label: feijoa
    summary: Một loại quả nhỏ, bầu dục, màu xanh với phần thịt thơm.
    info: |
      Feijoa có nguồn gốc từ Nam Mỹ.
      Phần thịt của nó có hương vị thơm nồng của dứa, ổi và bạc hà.
      Feijoa rất được ưa chuộng ở New Zealand như một loại quả mùa thu.
      Feijoa ít được biết đến ở châu Âu, nhưng được ưa chuộng ở các nước xuất xứ.
