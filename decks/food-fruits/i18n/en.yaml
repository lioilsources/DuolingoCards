lang: en
pivot: false
title: Fruit
cards:
  fruit.apple:
    label: apple
    summary: Round red or green fruit with sweetly acidic taste.
    info: An apple is the fruit of the domestic apple tree, one of the most cultivated crops worldwide. It contains vitamin C and fiber; there are over 7,500 varieties.
  fruit.banana:
    label: banana
    summary: Yellow tropical fruit with sweet pulp.
    info: A banana is a fruit of a tropical plant from the banana family. It is rich in potassium and natural sugars that provide quick energy.
  fruit.cherry:
    label: cherry
    summary: Small round red stone fruit growing in pairs.
    info: Cherries are fruits of the bird cherry tree, a popular summer fruit. They contain antioxidants and melatonin; there are sweet and sour (plum-like) varieties.
  fruit.grape:
    label: grape
    summary: Small round berry growing in grape-like clusters.
    info: The common grapevine produces grapes in various colors ranging from green to dark purple. Grapes can be eaten fresh, dried into raisins, or pressed for wine.
  fruit.mango:
    label: mango
    summary: A tropical fruit with juicy yellow-orange flesh.
    info: The mango is known as the "king of tropical fruits." It is rich in vitamins A and C and originates from South Asia, where it has been cultivated for 4,000 years.
  fruit.orange:
    label: orange
    summary: Round citrus fruit with an aromatic orange peel.
    info: The orange is a citrus fruit originating from Southeast Asia but now cultivated worldwide. It is rich in vitamin C and popular for making juice.
  fruit.pear:
    label: pear
    summary: Tear-drop shaped fruit with a sweet mild flavor.
    info: A pear is the fruit of the common pear tree, closely related to apples. It has tender, juicy flesh and high fiber content; there are hundreds of varieties.
  fruit.pineapple:
    label: pineapple
    summary: A tropical fruit with a spiky crown and golden flesh.
    info: Pineapples originate from South America and are now cultivated in tropical regions around the world. They contain an enzyme called bromelain that aids digestion.
  fruit.strawberry:
    label: strawberry
    summary: Red juicy heart-shaped fruit.
    info: The garden strawberry is a popular fruit from the rose family. It's rich in vitamin C and antioxidants; it is harvested in summer and has a sweet fragrance.
  fruit.watermelon:
    label: watermelon
    summary: Large green-streaked fruit with juicy red pulp.
    info: Watermelon originates from Africa and is a popular summer fruit. It consists of about 92% water and contains lycopene, which gives it its red color.
