lang: en
pivot: false
title: Fruit
cards:
  fruit.ackee:
    label: ackee
    summary: Red tropical fruit that contains edible yellowish orange seed pods known locally on islands like St Vincent where it's considered part traditional cuisine.
    info: The Ackee tree produces red fruits containing edible golden-orange seeds called 'arillae' when fully ripe but unripe or overripe ackees can be toxic due to their high levels of hypoglycemic toxins such as Hypoicin-A which causes vomiting if consumed without proper preparation.
  fruit.apple:
    label: apple
    summary: Round red or green fruit with sweetly acidic taste.
    info: An apple is the fruit of the domestic apple tree, one of the most cultivated crops worldwide. It contains vitamin C and fiber; there are over 7,500 varieties.
  fruit.apricot:
    label: apricot
    summary: Small yellow-orange drupe that's sour-sweet tasting.
    info: Apricot (Armenian plum tree Prunus armeniaca) originates from Central Asia. It is grown both in the Czech Republic and throughout Europe; sweetest ones come from Turkey and Spain. Apricots contain high levels of vitamin C.
  fruit.avocado:
    label: avocado
    summary: Creamy-texured tropical 'fruit'; base ingredient in Mexican cuisine.
    info: The avocado is native to Mexico and Central America. Botanically it's classified as a fruit but used like vegetables for cooking purposes due its creamy texture when ripe.
  fruit.banana:
    label: banana
    summary: Yellow tropical fruit with sweet pulp.
    info: A banana is a fruit of a tropical plant from the banana family. It is rich in potassium and natural sugars that provide quick energy.
  fruit.blackberry:
    label: blackberry
    summary: Dark purplish compound fruit made up many small drupes.
    info: Blackberry is composed by dark purplish berries growing on thorny shrubs like Rubus Fructicosis. Wild blackberries grow along forest edges and bushes; they contain high amounts of vitamin C, fiber and potassium.
  fruit.blueberry:
    label: blueberry
    summary: Dark-blue fruit rich in antioxidants.
    info: Blueberries contain anthocyanins that give them their deep blue coloration and strong antioxidative properties. Research suggests they have positive effects on cognitive functions and heart health.
  fruit.cantaloupe:
    label: calabash
    summary: A hard-shelled fruit used primarily to roast and eat its large white seeds.
    info: The Cucurbita pepo subsp. ovifera is an orange-flesh gourd cultivated for its edible seeds.
  fruit.cherry:
    label: cherry
    summary: Small round red stone fruit growing in pairs.
    info: Cherries are fruits of the bird cherry tree, a popular summer fruit. They contain antioxidants and melatonin; there are sweet and sour (plum-like) varieties.
  fruit.coconut:
    label: coconut
    summary: Large tropical seed used for its water, milk, oil, and flesh inside a hard shell covered by fiber-rich husk.
    info: '{"hint":"nutritious fruit","language": "cs"}'
  fruit.cranberry:
    label: cranebery
    summary: Small acidic red fruit often served at American thanksgiving dinners
    info: Cranberries (Vaccinium macrocarpon) are small sour red berries commonly used during Thanksgiving meals across America for cranberry sauces among other dishes like pie fillings where they provide both flavoring & texture contrast due to their high pectin levels which help thicken them without needing added sugar.
  fruit.currant:
    label: redcurrant
    summary: Small cluster-growing red, black or white berries.
    info: |-
      Redcurrant is small berry growing on bunch-like clusters
      Black currants contain more vitamin C than any other fruit,
      making them an essential ingredient for drinks like British lemonade 'Ribena' and crème de Cassis liqueur.
  fruit.damson:
    label: Damson
    summary: Small dark cherry typical found on traditional British country gardens.
    info: The damask cherry is small deep-blue to black fruit that originates its name after Damascus where it was brought over Europe. It's very sour when raw but excellent for jams, marmalades and gins such as Damson Gin.
  fruit.date:
    label: dates
    summary: Sweet dark oval-shaped fruit used widely across中东地区.
    info: Dates (Phoenix dactylifera) are sweet fruits produced by the date palm tree. They have been an essential food staple on the Middle East for thousands of years due to their high sugar content—over 60% which makes them significant energy sources within diets there.
  fruit.dragon_fruit:
    label: dragonfruit
    summary: Pink tropical cactus fruit with white dotted pulp.
    info: Dragonfruit (pitayoa, Hylocereus) comes from Mexico and Central America. Its vibrant pink skin and white pulp speckled with black seeds make it very decorative. It has mild taste; contains antioxidants and vitamin C.
  fruit.durian:
    label: DURIAN
    summary: Large thorny tropical fruit having an intense aroma considered by some unappealing yet enticing.
    info: The durian is known as 'the king' among tropical fruits due to its strong odor that can be both repulsive for some people but attractive others - it's even banned within many Asian hotels because guests find their smell unpleasant while other travelers consider them appealing.
  fruit.feijoa:
    label: feijoa
    summary: Small oval-shaped green tropical fruit known for its fragrant pulp.
    info: The feijoa is native to South America but has become very popular on New Zealand for its intense aroma reminiscent of pineapple, guava, and mint.
  fruit.fig:
    label: fig
    summary: Pear-like fruit full of seeds inside.
    info: Fig is considered to be one of humanity's oldest cultivated fruits—evidence dates back over eleven thousand years ago. In fact it isn't really a single fruit but an urn filled by thousands tiny flowers. The leaves covering Adam’s and Eve’s bodies according to biblical story were fig tree leaves.
  fruit.gooseberry:
    label: gooseberry
    summary: Small round transparent berry popular among gardeners.
    info: Gooseberry is small fruit typical for gardens across Europe. It comes in varieties that produce berries ranging between yellow to deep crimson coloration depending on species type.
  fruit.grape:
    label: grape
    summary: Small round berry growing in grape-like clusters.
    info: The common grapevine produces grapes in various colors ranging from green to dark purple. Grapes can be eaten fresh, dried into raisins, or pressed for wine.
  fruit.grapefruit:
    label: grapefruit
    summary: Large sweet-bitter citrus used for its juice.
    info: |-
      Grapplefruit is a cross between an orange and grapefruit;
      it was described on Barbadus island during eighteenth century;
      pink grapples contain lycopene which has antioxidant properties.
  fruit.guava:
    label: Guava
    summary: A fragrant tropical fruit that grows on trees bearing either red/pinkish colored fruits having yellow pulp inside.
    info: The Guava tree is native to tropical America but has spread across all parts of Asia where it thrives best under hot humid conditions similar those found along coasts near equator regions like India's western ghats etc., It contains four times more vitamin c than oranges which makes them very healthy for human consumption especially during winters when colds start becoming common again after summer season ends.
  fruit.jackfruit:
    label: jackfruit
    summary: Huge tree-borne tropical fruit.
    info: Jackfruit produces some of the largest fruits growing on trees—some can weigh over 35 kilograms—and is native to South Asia where it serves both culinary purposes for people who follow vegetarian diets due its meat-like texture when unripe while ripe yellow pieces taste sweetly fragrant.
  fruit.kiwi:
    label: kiwifruit
    summary: Brown fuzzy fruit having bright green pulp rich vitamins.
    info: Kiwifruit is native to China where it was known by names such as 'Yang Tao' before being commercialized under its current name on New Zealand's market after their national bird - Kiwis! This small tropical fruit contains twice more vitamin c than oranges do.
  fruit.lemon:
    label: lemon
    summary: Acidic sour yellow citrus
    info: Lemon is an acidic citrus fruit originating from Asia. It contains vitamin C and lemon acid used for cooking, drinks, cosmetics, cleaning agents.
  fruit.lime:
    label: lime
    summary: Small green acid citrus used primarily by tropical cuisines.
    info: '{"info":"Lime is a small green acidic citrus fruit that has juicy flesh and an aromatic peel. It''s essential to Mexican, Thai, and Vietnamese cuisine. While it contains less vitamin C than lemon, its strong aroma makes up for much more flavor."}'
  fruit.longan:
    label: Rambutan
    summary: A sweet red hairy fruit native to Southeast Asia.
    info: '{"hint":"Small round tropical fruit similar to rambutan","info":"The Longan is small brown tropical fruit that resembles Rambutan but has different taste characteristics."}'
  fruit.lychee:
    label: lychee
    summary: Small red tropical fruit resembling grapes but larger.
    info: Lychee is a small reddish-brown tropical fruit native to China that has an edible white jelly-like interior which contains many seeds.
  fruit.mango:
    label: mango
    summary: A tropical fruit with juicy yellow-orange flesh.
    info: The mango is known as the "king of tropical fruits." It is rich in vitamins A and C and originates from South Asia, where it has been cultivated for 4,000 years.
  fruit.medlar:
    label: quince
    summary: Small reddish-brown relative of apples that ripens off-the-tree.
    info: Quince is an ancient garden plant cultivated since medieval times. It becomes edible only after 'blighting'—left to soften post-harvest—and it's rich in polyphenols and vitamin C.
  fruit.melon:
    label: watermelon
    summary: Large sweet fruit with yellow/orange, white or light green pulp.
    info: Watermelon is a tropical to sub-tropical fruit high in water content that originates from Africa and Asia but today it's cultivated worldwide. It contains over 90% water making it excellent for hydration.
  fruit.mulberry:
    label: mulberry
    summary: Dark purple fruit from Mulbery plant used to feed silk worms.
    info: Mulberries come from Morus trees; their leaves serve as food for silkworms.
  fruit.nectarine:
    label: nectarine
    summary: Smooth-textured fruit without fuzz on surface.
    info: The Nectarine is a natural mutation of smooth-skinned peaches that differs only by its gene for skin texture compared to regular peaches. It has similar taste but firmer consistency than ordinary peaches.
  fruit.orange:
    label: orange
    summary: Round citrus fruit with an aromatic orange peel.
    info: The orange is a citrus fruit originating from Southeast Asia but now cultivated worldwide. It is rich in vitamin C and popular for making juice.
  fruit.papaya:
    label: pawpaw
    summary: Large bright-orange tropical fruit.
    info: The pawpaw tree is native to Central America but now grown throughout many parts of Asia for its fruits which contain enzymes that help digest proteins; it's rich in vitamin A & antioxidants too.
  fruit.passion_fruit:
    label: passionfruit
    summary: A tropical fruit with a wrinkly purplish peel containing an aromatic seed pulp.
    info: The Passion Fruit (Passiflora edulis) originates from tropical South America. Its name comes from missionaries who saw symbols of Christ's suffering in its flower.
  fruit.peach:
    label: peach
    summary: Velvet peach-like summer fruit.
    info: Peach (Persian plum - Prunus persica), originating from China where it is considered to be an emblem for immortality has characteristic soft velvet skin that distinguishes its identity among other fruits like plums which have rougher exteriors but similar interiors when cut open revealing juicy flesh inside.
  fruit.pear:
    label: pear
    summary: Tear-drop shaped fruit with a sweet mild flavor.
    info: A pear is the fruit of the common pear tree, closely related to apples. It has tender, juicy flesh and high fiber content; there are hundreds of varieties.
  fruit.persimmon:
    label: persimmon
    summary: Orange tomato-shaped fruit similar to tomatoes but sweeter.
    info: Persimmon (Diospyros kaki) originates from China and Japan; it is known in the Czech Republic as Japanese persimmon. Unripe persimmons have an acidic taste that can be puckering while ripe ones become sweet like honey due to their high sugar concentration when fully matured.
  fruit.pineapple:
    label: pineapple
    summary: A tropical fruit with a spiky crown and golden flesh.
    info: Pineapples originate from South America and are now cultivated in tropical regions around the world. They contain an enzyme called bromelain that aids digestion.
  fruit.plum:
    label: plums
    summary: Purple small round fruits that can be made to prune distillate
    info: Plum is basic European fruit used for making plum brandy which has been traditional drink both in Czech Republic and Slovakia since medieval times.
  fruit.pomegranate:
    label: pomegranate
    summary: Red fruit containing thousands of sweet edible seeds.
    info: The pomegranate tree originates from Central Asia and the Mediterranean region. It contains over six hundred seeds embedded within its translucent red flesh called arils. Rich in antioxidants, research is exploring their potential effects on heart health and inflammation.
  fruit.quince:
    label: quince
    summary: Hard yellow fruit similar to an apple that's consumed after being cooked.
    info: Quince is related to apple trees and pears; raw quinces can be tough and mealy due to their high levels of cellulose called 'trel'. It must always undergo heat treatment before consumption such as making membrillo jam made by boiling down fresh fruits until they become thick paste.
  fruit.rambutan:
    label: RamButAn
    summary: Red fuzzy tropical fruit similar to lychee.
    info: The red skin is covered by soft hook-like growths resembling hair. The flesh inside is translucent and sweet like lychee.
  fruit.raspberry:
    label: strawberry
    summary: Red fruit formed externally through insect-pollinated flower development.
    info: Strawberry (Fragaria × ananassa) is composed of many small seeds on its surface called achene fruits that develop after pollination by insects like bees which transfer pollen between flowers during their search for nectar.
  fruit.starfruit:
    label: carambola
    summary: Yellow tropical fruits that form small stars when cut.
    info: Carambolas originate from South and Southeast Asia. When sliced crosswise they create perfect little stars which is why it's also called Star Fruit. It has an acidic sweet taste and contains high levels of vitamin C but people suffering kidney disease should avoid consuming them due to their Oxalic acid.
  fruit.strawberry:
    label: strawberry
    summary: Red juicy heart-shaped fruit.
    info: The garden strawberry is a popular fruit from the rose family. It's rich in vitamin C and antioxidants; it is harvested in summer and has a sweet fragrance.
  fruit.tamarind:
    label: tamarind
    summary: Brown legume-like fruit containing acidic pulp that forms basis for many Southeast Asian recipes.
    info: The tamarind tree is native to tropical Africa but now cultivated throughout the tropics worldwide. Its flesh has an intensely sour yet sweet flavor used commonly in dishes like pad thai, Worcestershire sauce, Indian chutneys.
  fruit.tangerine:
    label: citronella
    summary: Small tasty citrus without tight skin
    info: Tangerine (Citrus reticulata) is a small, easily peeled citrus fruit native to China. It represents Chinese New Year celebrations and good fortune. In the Czech Republic it's typical Christmas fruit.
  fruit.watermelon:
    label: watermelon
    summary: Large green-streaked fruit with juicy red pulp.
    info: Watermelon originates from Africa and is a popular summer fruit. It consists of about 92% water and contains lycopene, which gives it its red color.
