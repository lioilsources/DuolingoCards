lang: he
pivot: false
title: פירות
cards:
  fruit.ackee:
    label: אקי
    summary: פרי טרופי אדום שאוכלים ממנו רק את הגלד הצהוב בהבשילו, והוא סמל ג'מייקה.
    info: |-
      אקי (Blighia sapida) הוא פריהּ הלאומי של ג'מייקה.
      הוא נקרא על שם רב-החובל בלַיי שהביא אותו בשנת 1793.
      אוכלים רק את הגלד הצהוב הבשל, ואילו הפרי הבוסר או הרקוב רעיל.
      מוצאו במערב אפריקה, והמאכל 'אקי ודג מלוח' הוא מנה ג'מייקנית מפורסמת.
  fruit.apple:
    label: תפוח
    summary: פרי עגול אדום או ירוק, מתוק או חמצמץ.
    info: התפוח הוא פרי עץ התפוח (Malus domestica) ומגידולי הפרי הנפוצים בעולם. הוא עשיר בוויטמין C ובסיבים, ויש לו יותר מ-7,500 זנים.
  fruit.apricot:
    label: משמש
    summary: פרי גלעין קטן וכתום, מתוק.
    info: |-
      המשמש (Prunus armeniaca) מוצאו במרכז אסיה.
      הוא גדל ברחבי אירופה, והמתוק שבזניו מגיע מטורקיה ומספרד.
      הוא עשיר בבטא-קרוטן ובוויטמין A.
      משמש מיובש הוא חטיף בריא ואהוב.
  fruit.avocado:
    label: אבוקדו
    summary: פרי טרופי בעל מרקם חמאתי, מרכיב מרכזי בגוואקמולי.
    info: |-
      האבוקדו (Persea americana) מוצאו במקסיקו ובמרכז אמריקה.
      מבחינה בוטנית הוא פרי, אך במטבח משמש כירק.
      הוא מכיל שומן חד-בלתי-רווי בריא (חומצה אולאית) כמו שמן זית.
      טוסט אבוקדו הוא סמל של תרבות בתי הקפה המודרנית.
  fruit.banana:
    label: בננה
    summary: פרי טרופי צהוב בעל בשר מתוק.
    info: הבננה פרי של צמח ממשפחת הבננתיים, עשיר באשלגן ובסוכרים טבעיים המספקים אנרגיה מהירה.
  fruit.blackberry:
    label: פטל שחור
    summary: פרי מורכב סגול כהה הגדל על שיחים קוצניים.
    info: |-
      הפטל השחור (Rubus fruticosus) פרי מורכב סגול כהה הגדל על שיחים קוצניים.
      בטבע הוא גדל בשולי יערות ובשיחייה.
      הוא עשיר בוויטמין C, בקרוטן ובנוגדי חמצון המיטיבים עם הלב.
  fruit.blueberry:
    label: אוכמנית
    summary: פרי כחול-סגול כהה עשיר בנוגדי חמצון, מזון-על.
    info: |-
      האוכמנית עשירה בנוגדי חמצון הקרויים אנתוציאנינים.
      פיגמנט זה מקנה לה את צבעה הכחול הכהה ואת פעולתה נוגדת החמצון החזקה.
      מחקרים מצביעים על תרומתה לזיכרון ולבריאות הלב.
      הזנים המתורבתים גדולים מן הזנים הזעירים הגדלים בטבע.
  fruit.cantaloupe:
    label: מלון קנטלופ
    summary: מלון בעל קליפה רשתית ובשר כתום.
    info: מלון הקנטלופ (Cucumis melo var. cantalupensis) זן מלון פופולרי. שמו על שם אחוזת האפיפיור קנטלופו שליד רומא. בשרו הכתום עשיר בבטא-קרוטן ובוויטמין A, והוא מן המתוקים שבמלונים.
  fruit.cherry:
    label: דובדבן
    summary: פרי אדום קטן ועגול הגדל בזוגות.
    info: הדובדבן פרי קיץ אהוב המכיל נוגדי חמצון ומלטונין. יש זנים מתוקים וזנים חמוצים.
  fruit.coconut:
    label: קוקוס
    summary: זרע טרופי גדול בעל קליפה סיבית, בשר לבן ומים.
    info: |-
      הקוקוס (Cocos nucifera) אינו פרי במובן המדעי אלא זרע (פרי בית-גלעין).
      מי הקוקוס שבפרי הבוסר הם משקה אלקטרוליטים טבעי.
      חלב הקוקוס והשמן הם מרכיבי יסוד במטבחי דרום-מזרח אסיה והודו.
      עץ הקוקוס מכונה 'עץ אלף השימושים' בזכות תועלותיו הרבות.
  fruit.cranberry:
    label: חמוצית
    summary: פרי אדום קטן וחמוץ מן המטבח האמריקני המסורתי.
    info: החמוצית (Vaccinium macrocarpon) פרי אדום קטן וחמוץ. היא משמשת באופן מסורתי ברוטב חג ההודיה האמריקני. היא מכילה תרכובות המונעות מחיידקים להיצמד לדופן שלפוחית השתן, ולכן מסייעת במניעת דלקות בדרכי השתן כפי שהוכח במחקרים.
  fruit.currant:
    label: דומדמנית
    summary: פירות קטנים אדומים, שחורים או לבנים הגדלים באשכולות.
    info: |-
      הדומדמנית (Ribes) פירות קטנים הגדלים באשכולות, אדומים, שחורים או לבנים.
      העשירה בוויטמין C ביותר היא הדומדמנית השחורה שממנה מכינים את משקה הקסיס.
      האדומה משמשת להכנת מקפא ולקישוט קינוחים.
  fruit.damson:
    label: שזיף דמשק
    summary: שזיף קטן וכהה הגדל בגינות.
    info: שזיף דמשק זן שזיף קטן שצבעו כחול כהה עד שחור. שמו על שם העיר דמשק שדרכה עברה הפרי לאירופה. הוא חמוץ מאוד כשהוא טרי, אך מצוין בריבה ובמשקה הג'ין.
  fruit.date:
    label: תמר
    summary: פרי מתוק, חום וסגלגל של עץ התמר.
    info: התמר (Phoenix dactylifera) פריו המתוק של עץ התמר. הוא היה מזון יסוד במזרח התיכון אלפי שנים. תכולת הסוכר בו עולה על 60% והוא מקור ידוע לאנרגיה.
  fruit.dragon_fruit:
    label: פרי הדרקון
    summary: פרי קקטוס טרופי ורוד בעל בשר לבן מנוקד בזרעים.
    info: פרי הדרקון (פִּטָאיָה, הסוג Hylocereus) מוצאו במקסיקו ובמרכז אמריקה. קליפתו ורודה עזה ובשרו הלבן מנוקד בזרעים שחורים, ולכן מראהו דקורטיבי מאוד. טעמו עדין ורך והוא מכיל נוגדי חמצון וויטמין C.
  fruit.durian:
    label: דוריאן
    summary: פרי טרופי גדול וקוצני בעל ריח עז המכונה 'מלך הפירות'.
    info: |-
      הדוריאן (Durio zibethinus) מכונה מלך הפירות.
      ריחו העז מרתיע רבים עד שנאסר בכניסה לבתי מלון אחדים באסיה, אך אחרים מתענגים עליו.
      בשרו העבה חמאתי ומתוק בעל טעם מורכב של אגוזים, וניל וגבינה.
      הוא נחשב מעדן בדרום-מזרח אסיה.
  fruit.feijoa:
    label: פיג'ואה
    summary: פרי ירוק קטן וסגלגל בעל בשר ריחני.
    info: הפיג'ואה (Acca sellowiana) מוצאה בדרום אמריקה. יש לה ריח עז המזכיר אננס, גויאבה ומנתה, והיא אהובה מאוד בניו זילנד בסתיו.
  fruit.fig:
    label: תאנה
    summary: פרי מתוק ורב-זרעים בצורת טיפה מעץ התאנה.
    info: התאנה מגידולי הפרי העתיקים ביותר, ועדויות לה קדומות בכ-10,000 שנה. למעשה אין זה פרי אלא מעטפת המכילה אלפי פרחים זעירים. עלה התאנה הוא שבו כיסו אדם וחוה את גופם בסיפור המקראי.
  fruit.gooseberry:
    label: דומדמנית מחוספסת
    summary: פרי קטן ועגול שקוף למחצה הגדל הרבה בגינות.
    info: |-
      הדומדמנית המחוספסת (Ribes uva-crispa) פרי קטן נפוץ בגינות מרכז אירופה.
      יש לה זנים ירוקים, אדומים וצהובים.
      היא עשירה בוויטמין C.
      משקה שהוכן ממנה היה אהוב מאז ומקדם.
  fruit.grape:
    label: ענב
    summary: פרי קטן ועגול הגדל באשכולות.
    info: הענב (Vitis vinifera) מניב אשכולות בגוונים מירוק עד סגול כהה. אוכלים אותו טרי, מייבשים אותו לצימוקים או סוחטים אותו ליין.
  fruit.grapefruit:
    label: אשכולית
    summary: פרי הדר גדול, מר-מתוק ועתיר ערך תזונתי.
    info: |-
      האשכולית (Citrus paradisi) כלאיים של תפוז ופומלה.
      היא תוארה לראשונה במאה ה-18 באי ברבדוס.
      הזנים הוורודים והאדומים מכילים ליקופן ובטא-קרוטן.
      מיצה מגיב עם תרופות רבות, ולכן על החולה ליידע את רופאו.
  fruit.guava:
    label: גויאבה
    summary: פרי טרופי בעל ריח עז ובשר לבן או ורוד.
    info: הגויאבה (Psidium guajava) מוצאה באמריקה הטרופית והתפשטה לאסיה ולאפריקה הטרופיות. היא מכילה יותר ויטמין C מן התפוז. אוכלים גם את קליפתה ואת זרעיה, והיא פרי עשיר בערכים תזונתיים.
  fruit.jackfruit:
    label: ג'קפרוט
    summary: הפרי הגדול בעולם הגדל על עצים.
    info: הג'קפרוט מוצאו באסיה הטרופית, ואוכלים אותו כמזון יסוד בהודו, בבנגלדש ובתאילנד. כשהוא בוסר טעמו ניטרלי, ולכן משתמשים בו כתחליף בשר צמחוני.
  fruit.kiwi:
    label: קיווי
    summary: פרי בעל קליפה חומה ושעירה ובשר ירוק, עשיר בוויטמינים.
    info: הקיווי (Actinidia deliciosa) מוצאו בסין, שם הוא מכונה 'דומדמנית סינית'. ניו זילנד פיתחה אותו מסחרית וקראה לו על שם ציפורה הלאומית קיווי. הוא מכיל פי שניים ויטמין C מן התפוז.
  fruit.lemon:
    label: לימון
    summary: פרי הדר צהוב, חמוץ וריחני.
    info: הלימון פרי הדר חמוץ שמוצאו באסיה. הוא עשיר בוויטמין C ובחומצת לימון. משתמשים בו במטבח, במשקאות וכן בתמרוקים ובחומרי ניקוי.
  fruit.lime:
    label: ליים
    summary: פרי הדר ירוק קטן וחמוץ.
    info: |-
      הליים (Citrus aurantiifolia) פרי הדר ירוק קטן בעל מיץ חמוץ וקליפה ריחנית.
      הוא מרכיב מרכזי במטבחי מקסיקו, תאילנד ווייטנאם.
      יש בו פחות ויטמין C מן הלימון אך ריחו עז יותר.
      בעבר הגן על מלחים מפני צפדינה.
  fruit.longan:
    label: לונגן
    summary: פרי טרופי קטן וחום הקרוב לליצ'י.
    info: הלונגן (Dimocarpus longan) פריו של עץ טרופי שמוצאו בסין. הוא כונה 'עין הדרקון' בשל בשרו השקוף וזרעו השחור. טעמו מתוק וריחני, וברפואה המסורתית הוא נחשב מזון המחזק את הדם ואת הלב.
  fruit.lychee:
    label: ליצ'י
    summary: פרי טרופי אדום בעל קליפה מחוספסת ובשר שקוף.
    info: |-
      הליצ'י (Litchi chinensis) פרי טרופי שמוצאו בסין.
      מתחת לקליפתו האדומה המחוספסת בשר לבן שקוף למחצה.
      טעמו מתוק וריחני.
      בסין הוא סמל לאושר ולשגשוג.
  fruit.mango:
    label: מנגו
    summary: פרי טרופי עשיר בבשר צהוב-כתום ועסיסי.
    info: המנגו מכונה 'מלך הפירות הטרופיים'. הוא עשיר בוויטמינים A ו-C, ומגדלים אותו בדרום אסיה יותר מארבעת אלפים שנה.
  fruit.medlar:
    label: משפילה
    summary: פרי חום קטן הדומה לתפוח, נאכל רק לאחר שמתרכך בעקבות הקטיף.
    info: המשפילה (Mespilus germanica) פרי עתיק המגודל מימי הביניים. יש להניחו עד שיתרכך לאחר הקטיף כדי שיהיה ראוי לאכילה. הוא עשיר בפוליפנולים ובוויטמין C, ומוזכר ביצירות שייקספיר, אך כיום הוא בעיקר בגינות חובבים.
  fruit.melon:
    label: מלון
    summary: פרי גדול ומתוק בעל בשר כתום, ירוק או לבן.
    info: המלון (Cucumis melo) פרי שמוצאו באפריקה ובאסיה והמגודל בכל העולם. תכולת המים בו גבוהה מאוד ולכן הוא מרווה היטב.
  fruit.mulberry:
    label: תות עץ
    summary: פרי כהה מעץ התות והוא מזון לתולעת המשי.
    info: תות העץ פרי של עץ התות (הסוג Morus), והמתוק שבזניו הוא השחור. יש גם לבן ואדום, ועלי התות הם מזון לתולעת המשי ובסיס לתעשיית המשי.
  fruit.nectarine:
    label: נקטרינה
    summary: אפרסק חלק-קליפה, מתוק ועסיסי.
    info: הנקטרינה (Prunus persica var. nucipersica) מוטציה טבעית של האפרסק בעלת קליפה חלקה. היא נבדלת מן האפרסק רק בהיעדר הפלומה שעל קליפתו. טעמה דומה אך מרקמה מוצק מעט יותר, ושמה נגזר מן ה'נקטר', משקה האלים.
  fruit.orange:
    label: תפוז
    summary: פרי הדר עגול בעל קליפה כתומה וריחנית.
    info: התפוז פרי הדר שמוצאו בדרום-מזרח אסיה והמגודל כיום בכל העולם. הוא עשיר בוויטמין C ואהוב כמיץ.
  fruit.papaya:
    label: פפאיה
    summary: פרי טרופי גדול בעל בשר כתום וריחני.
    info: הפפאיה צמח טרופי שמוצאו ביבשת אמריקה. היא מכילה את האנזים פפאין המסייע בעיכול חלבונים. עשירה בוויטמין C, בבטא-קרוטן ובנוגדי חמצון, ואת הפרי הבוסר אוכלים כירק במטבחי דרום-מזרח אסיה (כסלט פפאיה).
  fruit.passion_fruit:
    label: פסיפלורה
    summary: פרי טרופי בעל קליפה סגולה מקומטת ובשר זרעים ריחני.
    info: הפסיפלורה (Passiflora edulis) מוצאה באמריקה הטרופית. שמה ניתן בידי מיסיונרים שראו בפרחיה סמלים לייסורי ישו. בשרה מלא זרעים העטופים בג'ל ריחני.
  fruit.peach:
    label: אפרסק
    summary: פרי גלעין שעיר וורדרד המסמל את הקיץ.
    info: |-
      האפרסק (Prunus persica) פרי שמוצאו בסין וסמל לנצח חיים בה.
      מייחדת אותו קליפתו השעירה והרכה.
      יש זנים לבנים וצהובים, והנקטרינה היא זן חלק שלו.
      בסין מגישים אפרסקים בראש השנה ובאגדות המרפא.
  fruit.pear:
    label: אגס
    summary: פרי בצורת טיפה, מתוק ורך.
    info: האגס פרי של עץ הקרוב לתפוח. בשרו רך ועסיסי ועשיר בסיבים. יש לו מאות זנים.
  fruit.persimmon:
    label: אפרסמון
    summary: פרי כתום הדומה לעגבנייה, מתוק מאוד בהבשילו.
    info: האפרסמון (Diospyros kaki) פרי שמוצאו בסין וביפן. הבוסר עוקצני, ואילו הבשל מתוק כדבש. הוא עשיר בוויטמינים A ו-C ובמינרלים.
  fruit.pineapple:
    label: אננס
    summary: פרי טרופי בעל קליפה קוצנית ובשר צהוב.
    info: האננס מוצאו בדרום אמריקה והוא מגודל כיום באזורים הטרופיים בעולם. הוא מכיל את האנזים ברומלאין המסייע בעיכול.
  fruit.plum:
    label: שזיף
    summary: פרי גלעין קטן וסגלגל שממנו מכינים ברנדי.
    info: השזיף (Prunus domestica) פרי יסוד במרכז אירופה. ממנו מכינים את משקה ה'סליבוביץ' המזוקק המסורתי בצ'כיה ובסלובקיה, ואותו קוטפים בסתיו.
  fruit.pomegranate:
    label: רימון
    summary: פרי אדום ובו מאות גרגרים מתוקים, סמל לפוריות.
    info: הרימון (Punica granatum) מוצאו במרכז אסיה ובאגן הים התיכון. בתוך קליפתו האדומה יותר מ-600 גרגרים אדומים שקופים. הוא עשיר בנוגדי חמצון, ותועלותיו לבריאות הלב ולהפחתת דלקת נחקרות.
  fruit.quince:
    label: חבוש
    summary: פרי קשה הדומה לתפוח, נאכל בדרך כלל מבושל.
    info: החבוש (Cydonia oblonga) קרוב לתפוח ולאגס, והוא קשה וחמוץ כשהוא נא. אוכלים אותו תמיד מבושל ומכינים ממנו ריבה ומשקה. הוא עשיר בפקטין המתאים למקפא, וריבת הפרי הראשונה שתועדה באירופה (במאה ה-16) הוכנה ממנו.
  fruit.rambutan:
    label: רמבוטן
    summary: פרי טרופי אדום ושעיר הקרוב לליצ'י.
    info: |-
      הרמבוטן (Nephelium lappaceum) מוצאו במלזיה, ושמו נגזר מן המילה המלזית 'רמבוט' שפירושה שיער.
      קליפתו האדומה מכוסה בזיזים שעירים ורכים.
      בשרו שקוף ומתוק ודומה בטעמו לליצ'י.
      הוא עשיר בסידן ובברזל.
  fruit.raspberry:
    label: פטל אדום
    summary: פרי מורכב אדום המסמל את קיץ הגינה.
    info: הפטל האדום (Rubus idaeus) פרי מורכב מגרגרים זעירים רבים. הוא גדל בטבע וגם מגודל, ואותו קוטפים בקיץ ובסתיו. הוא עשיר בוויטמינים C ו-K, במנגן ובנוגדי חמצון, וממנו מכינים הרבה ריבה וסירופ.
  fruit.starfruit:
    label: קרמבולה
    summary: פרי טרופי צהוב ההופך לכוכב בחיתוכו.
    info: הקרמבולה (Averrhoa carambola) מוצאה בדרום אסיה ובדרום-מזרחה. חותכים אותה לרוחב והיא מתגלה כצורת כוכב מושלמת, ומכאן שמה. טעמה מתוק-חמצמץ ומרענן והיא עשירה בוויטמין C. חולי כליות מוטב שיימנעו ממנה בשל חומצה אוקסלית שבה.
  fruit.strawberry:
    label: תות שדה
    summary: פרי אדום בצורת לב ובו זרעים על פני השטח.
    info: תות השדה פרי אהוב ממשפחת הוורדיים העשיר בוויטמין C ובנוגדי חמצון. קוטפים אותו בקיץ והוא מתוק וריחני.
  fruit.tamarind:
    label: תמרהינדי
    summary: בשר חום וחמוץ בתוך תרמיל, מרכיב מרכזי במטבח התאילנדי.
    info: התמרהינדי (Tamarindus indica) מוצאו באפריקה הטרופית והוא מגודל כיום באזורים החמים. בשרו חמוץ ומתוק מאוד ומשמש ב'פאד תאי', ברוטב ווסטרשייר ובצ'אטני ההודי. שמו נגזר מערבית ופירושו 'תמר הודו'.
  fruit.tangerine:
    label: מנדרינה
    summary: הדר קטן ומתוק שקל לקלפו, נאכל בחגים.
    info: |-
      המנדרינה (Citrus reticulata) פרי הדר קטן שמוצאו בסין וקל לקלפו.
      היא סמל לראש השנה הסיני ולמזל טוב.
      באירופה היא פרי מובהק של חג המולד.
      היא מכילה ויטמין C, נוגדי חמצון ופלבונואידים.
  fruit.watermelon:
    label: אבטיח
    summary: פרי גדול ומפוספס בירוק בעל בשר אדום וזרעים שחורים.
    info: האבטיח פרי קיץ אהוב שמוצאו באפריקה. הוא מכיל 92% מים ואת הפיגמנט האדום ליקופן.
