lang: he
pivot: false
title: פירות
cards:
  fruit.ackee:
    label: اكاي
    summary: פּרִי טרופיים أحמר עם ארילות צבעוניים שאכליים; זהו הפרי הומני לגימיאקה.
    info: אקיי (Blighia Sapידה) הוא פרי לאומי של ג'מייקה ונקרא על שם קפטן בלאג'. רק אריליים צהובים בשלו הם אוכלים ואילו פירות לא בשלים או מיותמים מכילים רעל (هיפוגלسين). האוכל הלאומי של ג'מייקה - 'אקאיי עם דגים מלוחים', נוצר מהיבוא מאפריקת המערב דרך המסחר העבדי.
  fruit.apple:
    label: '"אפרסק"'
    summary: '"فاן פירות עץ עם טעם מתוק ומריר."'
    info: '{"hint":"פירות עגולים אדומים או ירוקים מהעץ האפרסק (Pyracantha)"}'
  fruit.apricot:
    label: แอปเปิลไซ
    summary: ผลไม้ขนาดเล็ก สีเหลืองอมแดง มีรสชาติขมน้อยแต่หอมฉุบ
    info: '{"hint":"ผลไม้สีส้มเล็กๆ จากต้น Prunus armeniaca","info":"แอปเปิลไซซ์ที่มาราชอาณาจักรเอเชียกลาง\nปลูกในสาธารณรัฐเชโกและยุโรปรวมกันแล้วหลายประเทศ โดยเฉพาะจากเตอร์เกียนและสแปนิชจะหวานมาก\nอุดมไปด้วยเบตาแคโรเทน และสารอาหารเอ\nเมื่อนำมาอบแห้ง ก็กลายเป็นของทานเล่นยอดฮิตแบบเฮลธี้"'
  fruit.avocado:
    label: אבוקדו
    summary: פירה ירוקה עם גידולים טרופיים
    info: |-
      אводו (Peachia Americana) מגיע מקסיקו ומרכז אמריקה
      הוא פירות בוטנאי אך בשימוש קולינרי כירק
      מכיל שומנים מונואוסטורים בריאות כמו חומצה אוליבית
  fruit.banana:
    label: กล้วย
    summary: ผลไม้รสหวาน สี желโล่ ในเขตอากาศร้อน
    info: '{"hint":"ผลไม้สีเหลืองโค้งยาวในเขตร้อนของพันธุ์ Musa","info":"กล้วยเป็นผลจากต้นไม้ทรอปิคอลในวงศ์ Musaceae มันอุดมไปด้วยโพแทซเซียมและน้ำตาลธรรมชาติ ให้พลังงานเร็ว,"label":"กล้วย","summary":"ผลไม้รสหวาน สี желโล่ ในเขตอากาศร้อน"}'
  fruit.blackberry:
    label: いちご
    summary: オストロジニクからなる紫黒色の合成ベリー
    info: |-
      いちご（ラビス・フラティコサ）は、トゲのある低木に生える暗紫色の複合果実です。
      野生のは森やジャングルで育ちます。
      vitamin CとKおよび食物繊維を豊富に含みます。
      ブルーベリーのジャム、コンポート、リキュールなど伝統的な製品があります。
  fruit.blueberry:
    label: بنיה
    summary: פירות כחולים חשוכים; מזון סופר מלא באנתוקсидטים.
    info: בננה (לטינית - Vaccinium myrtillus ל야维奇', ו-V.corymbosum לגינה), עשירה באנ토ไซאנים. האנטוסייאן הוא מה שנותן לבנניות את הצבע הכחול החשוך ואת תכונות הантיקסידנטיות המạnhות שלו. מחקרים מצביעים על השפעה חיובית של בנניה בגינה והגברה של פונקציות קוגניטיביות וחוסני הלב.
  fruit.cantaloupe:
    label: קנטאלופה
    summary: תיריס עם שכבת עור צהוב-חום מסורגת ואוכף דבש כתום.
    info: |-
      קנטלופוס הוא גזע פירות יסוד אשיריים של עץ המלוון (Cucurbitaceae), ומכונה גם 'מֶלוּן קַנְטָלאוֹפ'.
      The name derives from the papal residence of Cantalupo near Rome.
  fruit.cherry:
    label: เชอรี่
    summary: ผลไม้สีแดงขนาดเล็กแบบกลมเต็มดวงตา เจริญเติบโตเป็นคู่
    info: '{"hint":"ผลไม้สีแดงรูปทรงกลมเล็ก ๆ เป็นคู่หนึ่งชนิดของพืชในวงศ์ปรุนัส","info":"เชอรี่เป็นผลจากต้นทับทิมห่านซึ่งเป็นผลไม้ยอดฮิตสำหรับฤดู hè มันประกอบด้วยสารกักเก็บอนุมูลอิสระและเมลาโทนิน และยังสามารถแบ่งออกได้อีกว่าบางสายพันธุ์จะหวาน ส่วนอื่นมีรสเปรี้ยวคล้ายลูกพลับ","label":"เชอรี่","summary":"ผลไม้สีแดงขนาดเล็กแบบกลมเต็มดวงตา เจริญเติบโตเป็นคู่"}'
  fruit.coconut:
    label: '"kokos"'
    summary: \"A large tropical nut with hard shell and white pulp ",
    info: '{"info":" Kokus הוא פרי עץ הקוקוס ; מבחינה ביולוגית זהו גרעין ולא זרניף , אלא סקאליפס . \nThe water inside an unripe fruit is natural electrolyte drink . \nThe milk and oil form the basis for Southeast Asian cuisine and Indian cooking recipes .\"}'
  fruit.cranberry:
    label: برز'ין
    summary: פריט קטן ואדום מריר; מרכיב אמריקאי טיפוח.
    info: ברוסינקה היא פירות קטנים ומרורים בצבע אדום בהירים. זהו רכיב מסורתי בסלט הברסניק של חג ההודיה האמריקני. הפלואנוטוקאנסידינים שבפירותם עוזרים למנוע את צמיחת חיידקי האקולאי על דופן מערכת העיכול.
  fruit.currant:
    label: رִבּוֹת
    summary: פירות אדומים, שחורים או לבנונים בגודל קטן.
    info: ריביס הוא פירות קטנים שגדלים בקבוצות דמויות גזע. ריביס שחור (ribes nigrum) מכיל את כמות הוויטמין סי הגבוהה ביותר מכל הפירות הקטנים. ריביס משמש בסיס לטעם 'ריינס' ולייקור קאס'.
  fruit.damson:
    label: دモンس
    summary: זית שחור קטנה הנמצאת בשימוש מסורתי בגינות הכפריות האנגליות.
    info: דמונס (Plum Damaskensis) הוא זית קטן בצבע תכול כהוב עד אزرחי עכשווי. השם נגזר מדמשק מאיפה הגיעה המלכה לאירופה. זהו פירות חומצי במיוחד כשהוא טרי אך מוכן היטב בджמייס ובפודלין וברקעט ג'ין.
  fruit.date:
    label: דתולים
    summary: плод אוכيلي חום ודבק של דרומית הדרקון.
    info: |-
      דאטליים הם פירות מתוקי עץ הדתלים (Phoenicus Dactilifer).
      הם מהווים בסיס תזונתי של מזרח התיכון כבר אלפי שנים
      והם מכילים יותר מחמישים אחוז סוכר ומקור מרשים לאנרגיה.
  fruit.dragon_fruit:
    label: פריט פלאי
    summary: плод תרופתי של קקטוס тропический בצורת עץ עם בשרה לבנה מסתובבת.
    info: |-
      פירות הדרים (питахаяה, Hilocerius) מגיעים מקסיקו וארמנדיה המרכזית
      pielם צבעוני סגול רך ובשר לבן עם זרעים שחורים הם מאוד מרהיבים לראייה.
      pitahaya יש טעם עדין; הוא מכיל אנטיאוקсидאנטים ונתרן סי.
      ממנו יוצרים תפוזים, שיווריות ודesserts דקורטיביים.
  fruit.durian:
    label: דריין
    summary: פּלוֹת תרומפי גדול עם צבע לבנבן ונוגדן עוצמתי
    info: דורייאן הוא יבש טרופי מוערך מאוד שנחשב למלך הפירות הטרופיים במזרח התיכון ודרום אסיה. הריח שלו חזק ומורכז - עבור חלק מהאנשים רעשב而对于 אחרים משך את האroma; במרחבים רבים באסיה נאסרו להכניס דריינים אל מלונות על מנת לשמור על בריאות הנزلנים וה냄שות של המלון עצמו.
  fruit.feijoa:
    label: פיוג'ואה
    summary: פריך צורת האליפסה הירוקה עם מבושם חזק.
    info: פיג'ואו (Acca סאלווייאנה), ידוע גם כ-Figiova Sellowiana, הוא עץ נגזר מדרום אמריקה. פירותיו קטנים וצורותיהם אליפסיות עם שורש ירוק; המבושם שלהם כולל טעמים של אננס, גוואווה ומנטול.
  fruit.fig:
    label: '"fig"'
    summary: ผลไม้รูปร่างเหมือนแอ๊ปลูกPEAR มาราคาจากรากฟอกซัสคาริก้า
    info: "{\"\\\"hint\\\": \\\"ผลรูปทรงลูก\U0001F350ที่มีเนื้อหวานใน(Ficus carica)\", \"info\": \"ฝิว(Ficus carica) เป็นหนึ่งในพันธุ์ไม้มะหาสารคามเก่าแก่ที่สุด โดยหลักฐานย้อนกลับไปถึง 11,000 ปีก่อน\nแท้จริงแล้วนี้ไม่ใช่ผลไม้แต่อย่างใด หากเป็นภาชนะเต็มไปด้วยดอกเล็กๆหลายพันต้น\ndash;\nใบของอา담และเอวา ในเรื่องราวจากพระคัมภีร์ไบเบิลอยู่บนต้นมะหาสารคาม\",\"dash;\"]"
  fruit.gooseberry:
    label: 앵레슈트
    summary: 작고 둥근 반투명한 열매이며, 정원에서 널리 재배된다.
    info: |-
      앵레슈트(Ribes uva-crispa)는 중부 유럽의 정원에서 흔히 볼 수 있는 작은 과일이다.
      zеленая(초록색), červená(빨간색), žlutá(노란색) 종이 있다.
      비타민C가 풍부하다.
      앵레슈트로 만든 양파 와인은 역사적으로 인기 있었던 음료였다.
  fruit.grape:
    label: גרנט
    summary: פרווה עיגולה קטנה שצומחת בקבוצות על חנית.
    info: גֶפַן יין מייצרת גבישים בצבעי תכלת עד סגול כהה. את הגבששים אוכלים טריים או מיבשלים אותם לירקות ומרסימים ליין.
  fruit.grapefruit:
    label: גريب
    summary: תוצר אורנגי עשיר באזות מינרליים.
    info: גריפ הוא היברידי של תפוז ופומלגו שנמצא לראשונה במאה ה-18 בברבדוס. גריפים אדומים ואורנג'יים מכילים ליקופן ובטא קארוטין.
  fruit.guava:
    label: gova
    summary: A tropical fruit that has an intense aroma.
    info: |-
      גואווה (Pisum guayaba) היא פירות טרופיים שמקורם באמריקה הטרופית והיא נפוצה בטורקיה האסיאתית והאפריקאית.
      המוצר מכיל פי ארבע ויטמין סי יותר ממנגו.
      The skin and seeds are edible; the entire plant is nutritious.
  fruit.jackfruit:
    label: gzerat lacham
    summary: פרוד тропический ; самый большой фрукт на дереве в мире.
    info: גזרת לחם (Artocarpus hetrophylus) יוצרת את הפרד הגדול ביותר על עץ בעולם - משקל של מעל 35 קילו גרמים. היא מקומית באסיה הטרופיקלית ומשמש כמזון בסיסי ב الهند , בנגלדש וב תאנה . גזרת לחם לא בשלות יש טקסטורה ניטרלי שמתאימה לשימוש כתחליף צמחוני לmię.
  fruit.kiwi:
    label: "\U0001F95D"
    summary: פירות קטנים עם קלף ירוק ומכילים כמות גבוהה של חומצה אскорביגית.
    info: "{\"hint\":\"ผลไม้สีน้ำตาลเล็ก ๆ มีขนและเนื้อในเขียวสดใส (Actinidia deliciosa)\",\"info\":\"คิวบี้หรือที่เรียกชื่ออังกฤษว่า Kiwifruit เดิมกำเนิดจากประเทศจีน โดยชาวจีนมักจะเรียกว่า Yang Tao หรือ Chinese Gooseberry\\nThe country that commercialized it was New Zealand which renamed after its national bird called 'Kiwis' \\nIt contains double amount vitamin c compared to oranges\\nIts pulp is bright green color there also golden yellow varieties\",\"label\":\"\U0001F95D\",\"summary\":\"buah berbulu kecokelatan dengan isi hijau terang yang mengandung banyak vitamin.\"}"
  fruit.lemon:
    label: לימונים
    summary: חומר מריר צהוב בצורת מקלות; מקור לוויטה-C ולריאו.
    info: |-
      סיטрус הוא פרי פירות ציתריים חומצי ומריר באוריגין אסייתי.
      it富含維生素C וحامض הסטريكון.
      הוא משמש במטבח, תרופות, קוסמטייקה ואפילו כמحلول ניקוזי.
      The essential oil של סטרונ (Citrus limon) מכיל ריח עם טעמה ידוע של שמן עץ.
  fruit.lime:
    label: ليمون
    summary: פירות צימרוניים ירוקים ומרורים – רכיב מרכזי במטבח טרופי.
    info: '{"hint":"ผลไม้รสเปรี้ยวสีเขียวขนาดเล็กจากตระกูลซิตรัส","info":"มะนาวคือพืชผักผลไม้ออกดอกที่มีน้ำไซเตรียและเปลือกรสหอม\nใช้อย่างแพร่หลายในอาหารเม็กซิกัน เธย และเวียดนาม\nแม้มะนาวรจะให้วิตามินซีได้น้อยกว่าลูกอมแต่มีกลิ่นแรงมาก\nการบริโภคมะนาวป้องกันโรคคอเรียนของคนขับเรือ(เนื่องมาจากสารวิตามินC)","label":"มะนาว","summary":"ผลไม้ไซtrer์สีเขียวรสชาติเปรี้ยว เป็นส่วนประกอบหลักในการปรุงอาหารแบบเขตร้อน."}'
  fruit.longan:
    label: 롱안
    summary: קטן brown טרופית פרי קרוב ל-lichi.
    info: |-
      לונגאן הוא פרי טרופי של עץ происходящий מ-China.
      The name comes from Chinese for 'dragon eye' due to its transparent flesh surrounding black seeds.
      It has sweet taste ו-aromatic flavor.
      In traditional medicine it is considered food that supports blood и-heart.
  fruit.lychee:
    label: ליץ'י
    summary: פירות טרופיים אדומים עם גבשושית שקורה וטעמיים מזוקקים מאוד הנעשים פופולריים באסיה.
    info: '{"hint":"ผลไม้เขตร้อนผิวหยาบสีแดงเล็กๆ มีเนื้อใส (Litchi chinensis)","info":"ลิตชี่ (Litchi chinensis) เป็นผลไม้เขตร้อนที่มารถจากจีน\nThe rough skin is peeled off to reveal white transparent pulp\. It has sweet delicate aroma flavor\. In China it''s symbol for happiness and wealth","label":"ลิตชี่","summary":"ผลไม้ขนาดเล็ก สีแดง เขตร้อน มีเนื้อในโปร่งแสง อร่อยเป็นที่นิยมในเอเชีย"}'
  fruit.mango:
    label: "\U0001F96D"
    summary: תפוח אדמה טרופי עם בשר צבע כתום אורנจ' רך וטעים.
    info: '{"hint":"ผลไม้เมืองร้อนที่มีเนื้อส้มเหลืองอร่อย (Mangifera indica)", "info": "มะงั่วเป็นที่เรียกว่า \x{5c}"ราชาของผลไม้เขตร้อน\x{5c}"). มันเต็มไปด้วยสารอาหารอย่างวิตามินเอและซี และถิ่นกำเนิดมาจากเอเชียตะวันออกเฉียงใต้ โดยชาวบ้านปลูกกันมาต่อเนื่องยาวนานหลายพันปี", "label": "มะงั่ว", "summary": "ผลไม้เขตร้อนที่มีเนื้อนุ่มสีส้มเหลือรสหวาน."}'
  fruit.medlar:
    label: מישפולה
    summary: פרשת חומה קטנה דמוית תפוח apples-related; חייב לה зрוף אחרי האיסוף
    info: |-
      מייפל הוא פרי עץ פרהיסטורי משפחתי שגדל מאז המiddles Ages
      הוא אוכל רק לאחר תהליך של 'בלטינג' - יושב עד שהוא מתרכך
      הוא غنى בפוליאנולים וויטמין סי
  fruit.melon:
    label: '"תאנה"'
    summary: '"פרי גדול וטעים עם פנימיות צבעוניות"'
    info: '{"hint":"פירות עגולים או אובלי גדולים עם בשר כתום או ירוק","info":"תאנה (Cucumis melo) הוא פרי טרופי עד תתropical המכיל אחוז גבוה של מים.\nThe watermelon originates from Africa and Asia but is now grown worldwide due to its popularity for hydration purposes because it contains over ninety percent water by volume which makes excellent natural hydration especially during hot weather when people need more fluids quickly without adding extra calories since most varieties have very low calorie counts per serving size depending on how much you eat at once."}'
  fruit.mulberry:
    label: מوروֺשה
