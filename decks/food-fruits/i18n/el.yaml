lang: el
pivot: false
title: Φρούτα
cards:
  fruit.apple:
    label: μήλο
    summary: Ένα στρογγυλό κόκκινο ή πράσινο φρούτο με γλυκόξινη γεύση.
    info: Το μήλο είναι ο καρπός της μηλιάς, μιας από τις πιο καλλιεργούμενες φυτείες στον κόσμο. Περιέχει βιταμίνη C και φυτικές ίνες· υπάρχουν πάνω από 7.500 ποικιλίες.
  fruit.banana:
    label: μπανάνα
    summary: Ένα κίτρινο τροπικό φρούτο με γλυκιά σάρκα.
    info: Η μπανάνα είναι ο καρπός ενός τροπικού φυτού της οικογένειας των μουσιδών. Είναι πλούσια σε κάλιο και φυσικά σάκχαρα που δίνουν γρήγορη ενέργεια.
  fruit.orange:
    label: πορτοκάλι
    summary: Ένα στρογγυλό εσπεριδοειδές με αρωματική πορτοκαλί φλούδα.
    info: Το πορτοκάλι είναι εσπεριδοειδές με καταγωγή από τη Νοτιοανατολική Ασία, που σήμερα καλλιεργείται σε όλο τον κόσμο. Είναι πλούσιο σε βιταμίνη C και αγαπητό ως χυμός.
  fruit.strawberry:
    label: φράουλα
    summary: Ένα κόκκινο, ζουμερό φρούτο σε σχήμα καρδιάς.
    info: Η φράουλα είναι αγαπητό φρούτο της οικογένειας των ροδοειδών. Είναι πλούσια σε βιταμίνη C και αντιοξειδωτικά και συλλέγεται το καλοκαίρι.
  fruit.grape:
    label: σταφύλι
    summary: Μια μικρή στρογγυλή ρώγα που φυτρώνει σε τσαμπιά.
    info: Το αμπέλι δίνει σταφύλια διαφόρων χρωμάτων, από πράσινο έως σκούρο μοβ. Τα σταφύλια τρώγονται φρέσκα, αποξηραίνονται σε σταφίδες ή πιέζονται για κρασί.
  fruit.watermelon:
    label: καρπούζι
    summary: Ένα μεγάλο φρούτο με πράσινες ρίγες και κόκκινη ζουμερή σάρκα.
    info: Το καρπούζι κατάγεται από την Αφρική και είναι αγαπητό καλοκαιρινό φρούτο. Αποτελείται κατά 92% από νερό και περιέχει λυκοπένιο, που του δίνει το κόκκινο χρώμα.
  fruit.mango:
    label: μάνγκο
    summary: Ένα τροπικό φρούτο με ζουμερή κιτρινοπορτοκαλί σάρκα.
    info: Το μάνγκο ονομάζεται ο βασιλιάς των τροπικών φρούτων. Πλούσιο σε βιταμίνες A και C, κατάγεται από τη Νότια Ασία, όπου καλλιεργείται εδώ και 4.000 χρόνια.
  fruit.cherry:
    label: κεράσι
    summary: Μια μικρή στρογγυλή κόκκινη δρύπη που φυτρώνει σε ζευγάρια.
    info: Το κεράσι είναι ο καρπός της γλυκιάς κερασιάς, αγαπητό καλοκαιρινό φρούτο. Περιέχει αντιοξειδωτικά και μελατονίνη· υπάρχουν γλυκές και ξινές ποικιλίες.
  fruit.pear:
    label: αχλάδι
    summary: Ένα φρούτο σε σχήμα σταγόνας με γλυκιά και ήπια γεύση.
    info: Το αχλάδι είναι ο καρπός της αχλαδιάς, στενού συγγενή της μηλιάς. Έχει μαλακή, ζουμερή σάρκα και υψηλή περιεκτικότητα σε φυτικές ίνες· υπάρχουν εκατοντάδες ποικιλίες.
  fruit.pineapple:
    label: ανανάς
    summary: Ένα τροπικό φρούτο με αγκαθωτό στέμμα και χρυσοκίτρινη σάρκα.
    info: Ο ανανάς κατάγεται από τη Νότια Αμερική και σήμερα καλλιεργείται στους τροπικούς σε όλο τον κόσμο. Περιέχει το ένζυμο βρομελίνη, που βοηθά την πέψη.
  fruit.lemon:
    label: λεμόνι
    summary: Ένα κίτρινο και ξινό εσπεριδοειδές· πηγή βιταμίνης C και αρώματος.
    info: |
      Το λεμόνι είναι ξινό εσπεριδοειδές με καταγωγή από την Ασία.
      Είναι πλούσιο σε βιταμίνη C και κιτρικό οξύ.
      Χρησιμοποιείται στη μαγειρική, στα ποτά, στα καλλυντικά και στα καθαριστικά.
      Η φλούδα του λεμονιού περιέχει ένα αιθέριο έλαιο με χαρακτηριστικό άρωμα λεμονιού.
  fruit.lime:
    label: λάιμ
    summary: Ένα μικρό πράσινο και ξινό εσπεριδοειδές· βασικό συστατικό της τροπικής κουζίνας.
    info: |
      Το λάιμ είναι ένα μικρό πράσινο εσπεριδοειδές με ξινό χυμό και αρωματική φλούδα.
      Είναι απαραίτητο στη μεξικανική, την ταϊλανδική και τη βιετναμέζικη κουζίνα.
      Περιέχει λιγότερη βιταμίνη C από το λεμόνι, αλλά πιο έντονο άρωμα.
      Η κατανάλωση λάιμ προστάτευε τους ναυτικούς από το σκορβούτο χάρη στη βιταμίνη C.
  fruit.kiwi:
    label: ακτινίδιο
    summary: Ένα καφέ χνουδωτό φρούτο με πράσινη σάρκα· πλούσιο σε βιταμίνες.
    info: |
      Το ακτινίδιο κατάγεται από την Κίνα, όπου το ονομάζουν κινέζικο φραγκοστάφυλο.
      Η Νέα Ζηλανδία το εμπορευματοποίησε και το μετονόμασε από το εθνικό της πουλί, το κίουι.
      Περιέχει διπλάσια βιταμίνη C από ένα πορτοκάλι.
      Η σάρκα είναι έντονα πράσινη· υπάρχουν και χρυσές (κίτρινες) ποικιλίες.
  fruit.peach:
    label: ροδάκινο
    summary: Μια βελούδινη κιτρινορόδινη δρύπη· σύμβολο του καλοκαιριού.
    info: |
      Το ροδάκινο κατάγεται από την Κίνα, όπου είναι σύμβολο της αθανασίας.
      Η μαλακή βελούδινη φλούδα του είναι χαρακτηριστική.
      Υπάρχουν λευκές και κίτρινες ποικιλίες· το νεκταρίνι είναι η λεία εκδοχή, χωρίς χνούδι.
      Στην Κίνα τα ροδάκινα αποτελούν μέρος της Πρωτοχρονιάς και της θεραπευτικής μυθολογίας.
  fruit.plum:
    label: δαμάσκηνο
    summary: Μια μοβ δρύπη· βάση για το απόσταγμα δαμάσκηνου και τη μαρμελάδα δαμάσκηνου.
    info: |
      Το δαμάσκηνο είναι θεμελιώδης καρπός της Κεντρικής Ευρώπης.
      Το σλίβοβιτς (απόσταγμα δαμάσκηνου) είναι παραδοσιακό τσέχικο και σλοβάκικο ποτό.
      Η μαρμελάδα δαμάσκηνου είναι τυπικό προϊόν της φθινοπωρινής σοδειάς.
      Στον κόσμο υπάρχουν πάνω από 2.000 ποικιλίες δαμάσκηνου.
  fruit.apricot:
    label: βερίκοκο
    summary: Μια μικρή πορτοκαλί δρύπη· γλυκόξινη και ζουμερή.
    info: |
      Το βερίκοκο κατάγεται από την Κεντρική Ασία.
      Καλλιεργείται σε όλη την Ευρώπη· τα πιο γλυκά έρχονται από την Τουρκία και την Ισπανία.
      Είναι πλούσιο σε βήτα-καροτίνη και βιταμίνη A.
      Τα αποξηραμένα βερίκοκα είναι αγαπητό υγιεινό σνακ.
  fruit.raspberry:
    label: σμέουρο
    summary: Ένα κόκκινο σύνθετο μούρο· σύμβολο του καλοκαιρινού κήπου.
    info: |
      Το σμέουρο είναι σύνθετο μούρο από πολλές μικρές δρύπες.
      Φυτρώνει άγριο και καλλιεργημένο· η συγκομιδή είναι το καλοκαίρι και το φθινόπωρο.
      Είναι πλούσιο σε βιταμίνες C και K, μαγγάνιο και αντιοξειδωτικά.
      Η μαρμελάδα και το ξίδι σμέουρου είναι παραδοσιακές λιχουδιές.
  fruit.blueberry:
    label: μύρτιλο
    summary: Ένα σκουρόμπλε μούρο· υπερτροφή γεμάτη αντιοξειδωτικά.
    info: |
      Το μύρτιλο είναι πλούσιο σε ανθοκυανίνες, χρωστικές με ισχυρές αντιοξειδωτικές ιδιότητες.
      Οι ανθοκυανίνες του δίνουν το σκουρόμπλε χρώμα.
      Μελέτες δείχνουν θετική επίδραση στις γνωστικές λειτουργίες και στην υγεία της καρδιάς.
      Τα καλλιεργημένα μύρτιλα είναι μεγαλύτερα από τα άγρια.
  fruit.blackberry:
    label: βατόμουρο
    summary: Ένα σκούρο μοβ σύνθετο μούρο από τον βάτο.
    info: |
      Το βατόμουρο είναι σκούρο μοβ σύνθετο μούρο που φυτρώνει σε αγκαθωτό θάμνο.
      Το άγριο βατόμουρο φυτρώνει στις παρυφές των δασών και στους θάμνους.
      Περιέχει πολλή βιταμίνη C, βιταμίνη K και φυτικές ίνες.
      Η μαρμελάδα, η κομπόστα και το λικέρ βατόμουρου είναι παραδοσιακά προϊόντα.
  fruit.coconut:
    label: καρύδα
    summary: Ένα μεγάλο τροπικό καρύδι με σκληρό κέλυφος και λευκή σάρκα.
    info: |
      Η καρύδα είναι ο καρπός του φοίνικα καρύδας· βοτανικά είναι δρύπη, όχι καρύδι.
      Το νερό της καρύδας από τον άγουρο καρπό είναι φυσικό ισοτονικό ρόφημα.
      Το γάλα και το λάδι καρύδας είναι η βάση της κουζίνας της Νοτιοανατολικής Ασίας και της Ινδίας.
      Τον φοίνικα της καρύδας τον αποκαλούν το δέντρο των χιλίων χρήσεων.
  fruit.papaya:
    label: παπάγια
    summary: Ένα μεγάλο τροπικό φρούτο με βαθιά πορτοκαλί σάρκα.
    info: |
      Η παπάγια κατάγεται από την τροπική Αμερική.
      Περιέχει το ένζυμο παπαΐνη, που ευνοεί την πέψη των πρωτεϊνών.
      Είναι πλούσια σε βιταμίνη C, βήτα-καροτίνη και αντιοξειδωτικά.
      Η άγουρη παπάγια χρησιμοποιείται ως λαχανικό στην κουζίνα της Νοτιοανατολικής Ασίας (στη σαλάτα σομ ταμ).
  fruit.guava:
    label: γκουάβα
    summary: Ένα τροπικό φρούτο με έντονο άρωμα και λευκή ή ροζ σάρκα.
    info: |
      Η γκουάβα κατάγεται από την τροπική Αμερική και εξαπλώθηκε στην τροπική Ασία και Αφρική.
      Περιέχει τέσσερις φορές περισσότερη βιταμίνη C από ένα πορτοκάλι.
      Η φλούδα και οι σπόροι τρώγονται· ολόκληρο το φρούτο είναι θρεπτικό.
      Ο χυμός και η μαρμελάδα γκουάβα είναι δημοφιλή προϊόντα στις τροπικές χώρες.
  fruit.pomegranate:
    label: ρόδι
    summary: Ένα κόκκινο φρούτο με χίλιους γλυκούς σπόρους· σύμβολο γονιμότητας.
    info: |
      Το ρόδι κατάγεται από την Κεντρική Ασία και τη Μεσόγειο.
      Περιέχει πάνω από 600 σπόρους τυλιγμένους σε διάφανη κόκκινη σάρκα (αρίλλους).
      Είναι πλούσιο σε αντιοξειδωτικά· μελέτες διερευνούν την επίδρασή του στην καρδιά και στις φλεγμονές.
      Συμβολίζει τη γονιμότητα και την αφθονία σε πολλούς πολιτισμούς.
  fruit.fig:
    label: σύκο
    summary: Ένα αχλαδόσχημο φρούτο της συκιάς· γλυκό και γεμάτο σπόρους.
    info: |
      Το σύκο είναι ένα από τα αρχαιότερα καλλιεργούμενα φρούτα· τα ίχνη του φτάνουν 11.000 χρόνια πίσω.
      Στην πραγματικότητα δεν είναι φρούτο, αλλά ένα περίβλημα γεμάτο με χιλιάδες μικροσκοπικά άνθη.
      Τα φύλλα συκιάς του Αδάμ και της Εύας στη βιβλική αφήγηση είναι φύλλα της συκιάς.
      Τα αποξηραμένα σύκα είναι εξαιρετική πηγή ασβεστίου, καλίου και φυτικών ινών.
  fruit.date:
    label: χουρμάς
    summary: Ένα γλυκό καφέ ωοειδές φρούτο του χουρμαδιά· βασική τροφή της Μέσης Ανατολής.
    info: |
      Οι χουρμάδες είναι οι γλυκοί καρποί του χουρμαδιά.
      Εδώ και χιλιάδες χρόνια είναι βασική τροφή της Μέσης Ανατολής.
      Περιέχουν πάνω από 60% ζάχαρη και είναι έντονη πηγή ενέργειας.
      Στο ισλάμ οι χουρμάδες τρώγονται παραδοσιακά πρώτοι στο σπάσιμο της νηστείας του Ραμαζανιού (ιφτάρ).
  fruit.melon:
    label: πεπόνι
    summary: Ένα μεγάλο γλυκό φρούτο με πορτοκαλί, πράσινη ή λευκή σάρκα.
    info: |
      Το πεπόνι είναι τροπικό έως υποτροπικό φρούτο με υψηλή περιεκτικότητα σε νερό.
      Κατάγεται από την Αφρική και την Ασία· σήμερα καλλιεργείται σε όλο τον κόσμο.
      Αποτελείται κατά πάνω από 90% από νερό και είναι πολύ δροσιστικό.
      Υπάρχουν εκατοντάδες ποικιλίες, μεταξύ αυτών το καντελούπ, το πεπόνι μελιού και το γκάλια.
  fruit.cantaloupe:
    label: πεπόνι καντελούπ
    summary: Ένα δικτυωτό πεπόνι με βαθιά πορτοκαλί σάρκα.
    info: |
      Το πεπόνι καντελούπ είναι αγαπητή ποικιλία πεπονιού με καταγωγή από την Ασία.
      Το όνομα προέρχεται από την παπική έπαυλη Cantalupo κοντά στη Ρώμη.
      Η πορτοκαλί σάρκα είναι πλούσια σε βήτα-καροτίνη και βιταμίνη A.
      Είναι μία από τις πιο γλυκές ποικιλίες πεπονιού.
  fruit.grapefruit:
    label: γκρέιπφρουτ
    summary: Ένα μεγάλο πικρόγλυκο εσπεριδοειδές· αστέρι των διαιτών.
    info: |
      Το γκρέιπφρουτ είναι διασταύρωση πορτοκαλιού και πομέλο.
      Περιγράφηκε στα Μπαρμπάντος τον 18ο αιώνα.
      Το ροζ και το κόκκινο γκρέιπφρουτ περιέχουν λυκοπένιο και βήτα-καροτίνη.
      Ο χυμός γκρέιπφρουτ αλληλεπιδρά με πολλά φάρμακα· οι ασθενείς πρέπει να ενημερώνουν τον γιατρό τους.
  fruit.tangerine:
    label: μανταρίνι
    summary: Ένα μικρό γλυκό εσπεριδοειδές με φλούδα που ξεφλουδίζεται εύκολα· σύμβολο των Χριστουγέννων.
    info: |
      Το μανταρίνι είναι ένα μικρό εσπεριδοειδές που ξεφλουδίζεται εύκολα, με καταγωγή από την Κίνα.
      Είναι σύμβολο της κινέζικης Πρωτοχρονιάς και της καλής τύχης.
      Σε πολλές χώρες είναι τυπικό χριστουγεννιάτικο φρούτο.
      Περιέχει βιταμίνη C, αντιοξειδωτικά και φλαβονοειδή.
  fruit.passion_fruit:
    label: φρούτο του πάθους
    summary: Ένα τροπικό φρούτο με ζαρωμένη φλούδα και αρωματική σάρκα γεμάτη σπόρους.
    info: |
      Το φρούτο του πάθους κατάγεται από την τροπική Νότια Αμερική.
      Το όνομά του προέρχεται από τους ιεραπόστολους που έβλεπαν στο άνθος τα σύμβολα του Πάθους του Χριστού.
      Η σάρκα είναι γεμάτη σπόρους τυλιγμένους σε αρωματική ζελατίνη.
      Είναι εξαιρετική πηγή βιταμίνης C, φυτικών ινών και αντιοξειδωτικών.
  fruit.lychee:
    label: λίτσι
    summary: Ένα μικρό κόκκινο τροπικό φρούτο με διάφανη σάρκα· αγαπητό στην Ασία.
    info: |
      Το λίτσι είναι τροπικό φρούτο με καταγωγή από την Κίνα.
      Η τραχιά κόκκινη φλούδα του ξεφλουδίζεται εύκολα και αποκαλύπτει διάφανη λευκή σάρκα.
      Έχει γλυκιά και λεπτά αρωματική γεύση.
      Στην Κίνα είναι σύμβολο καλής τύχης και ευημερίας.
  fruit.dragon_fruit:
    label: φρούτο του δράκου
    summary: Ένα ροζ τροπικό φρούτο κάκτου με λευκή στικτή σάρκα.
    info: |
      Το φρούτο του δράκου (πιταγία) κατάγεται από το Μεξικό και την Κεντρική Αμερική.
      Η έντονα ροζ φλούδα του και η λευκή σάρκα με μαύρους σπόρους είναι πολύ διακοσμητικές.
      Έχει ήπια γεύση και περιέχει αντιοξειδωτικά και βιταμίνη C.
      Από αυτό φτιάχνουν χυμούς, σμούθι και διακοσμητικά επιδόρπια.
  fruit.starfruit:
    label: καράμπολα
    summary: Ένα κίτρινο τροπικό φρούτο που σχηματίζει αστέρια όταν κόβεται.
    info: |
      Η καράμπολα κατάγεται από τη νότια και νοτιοανατολική Ασία.
      Κομμένη εγκάρσια σχηματίζει τέλειο αστέρι, εξ ου και η αγγλική ονομασία starfruit.
      Έχει γλυκόξινη γεύση και είναι πλούσια σε βιταμίνη C.
      Τα άτομα με νεφρική νόσο δεν πρέπει να τη τρώνε λόγω των οξαλικών.
  fruit.avocado:
    label: αβοκάντο
    summary: Μια κρεμώδης τροπική δρύπη· βάση του γκουακαμόλε.
    info: |
      Το αβοκάντο κατάγεται από το Μεξικό και την Κεντρική Αμερική.
      Βοτανικά είναι φρούτο (δρύπη), αλλά στην κουζίνα χρησιμοποιείται ως λαχανικό.
      Περιέχει υγιεινά μονοακόρεστα λιπαρά (ελαϊκό οξύ), όπως το ελαιόλαδο.
      Είναι μια μοντέρνα υγιεινή τροφή σε όλο τον κόσμο· η φρυγανιά με αβοκάντο είναι σύμβολο της σύγχρονης κουλτούρας των καφέ.
  fruit.persimmon:
    label: λωτός
    summary: Ένα πορτοκαλί φρούτο που μοιάζει με ντομάτα· γλυκό και στυφό.
    info: |
      Ο λωτός κατάγεται από την Κίνα και την Ιαπωνία· λέγεται και κακί.
      Ο άγουρος λωτός είναι πλούσιος σε τανίνες και στυφός· ώριμος είναι γλυκός σαν μέλι.
      Είναι πλούσιος σε βιταμίνες A και C και σε μέταλλα.
      Στην Ιαπωνία είναι παραδοσιακό φθινοπωρινό φρούτο.
  fruit.mulberry:
    label: μούρο
    summary: Ένα σκούρο μοβ μούρο της μουριάς· τροφή του μεταξοσκώληκα.
    info: |
      Το μούρο είναι ο καρπός της μουριάς· τα φύλλα της μουριάς είναι η τροφή του μεταξοσκώληκα.
      Υπάρχουν λευκά, κόκκινα και μαύρα μούρα· το μαύρο είναι το πιο γλυκό.
      Στην ιστορία η καλλιέργεια της μουριάς ήταν καίρια για την παραγωγή μεταξιού.
      Τα μούρα είναι πλούσια σε ρεσβερατρόλη, βιταμίνη C και σίδηρο.
  fruit.cranberry:
    label: κράνμπερι
    summary: Ένα μικρό κόκκινο ξινό μούρο· παραδοσιακό αμερικανικό συστατικό.
    info: |
      Το κράνμπερι είναι ένα μικρό ξινό κόκκινο μούρο.
      Είναι παραδοσιακό μέρος της αμερικανικής Ημέρας των Ευχαριστιών (σάλτσα κράνμπερι).
      Περιέχει προανθοκυανιδίνες, που εμποδίζουν τα βακτήρια Escherichia coli να προσκολληθούν στα τοιχώματα του ουροποιητικού.
      Η επίδραση του κράνμπερι στην πρόληψη λοιμώξεων του ουροποιητικού είναι επιστημονικά τεκμηριωμένη.
  fruit.gooseberry:
    label: λαγοκέρασο
    summary: Ένα μικρό στρογγυλό διάφανο μούρο· αγαπημένο των κήπων.
    info: |
      Το λαγοκέρασο είναι ένα μικρό φρούτο τυπικό για τους κήπους της Κεντρικής Ευρώπης.
      Υπάρχει σε πράσινες, κόκκινες και κίτρινες ποικιλίες.
      Είναι πλούσιο σε βιταμίνη C.
      Το κρασί λαγοκέρασου είναι ιστορικά αγαπητό ποτό.
  fruit.currant:
    label: φραγκοστάφυλο
    summary: Ένα μικρό κόκκινο, μαύρο ή λευκό μούρο σε τσαμπί.
    info: |
      Το φραγκοστάφυλο είναι ένα μικρό μούρο που φυτρώνει σε τσαμπιά.
      Το μαύρο φραγκοστάφυλο περιέχει την περισσότερη βιταμίνη C από όλα τα μούρα.
      Το μαύρο φραγκοστάφυλο είναι η βάση της γεύσης του λικέρ κασίς και του βρετανικού ποτού Ribena.
      Το κόκκινο φραγκοστάφυλο χρησιμοποιείται σε μαρμελάδες και ως διακόσμηση επιδορπίων.
  fruit.quince:
    label: κυδώνι
    summary: Ένα σκληρό κίτρινο φρούτο συγγενικό με το μήλο· τρώγεται πάντα μαγειρεμένο.
    info: |
      Το κυδώνι είναι συγγενικό με το μήλο και το αχλάδι· ωμό είναι σκληρό και στυφό.
      Επεξεργάζεται πάντα με θερμότητα σε ζελέ κυδωνιού (μεμπρίγιο), κρασί ή απόσταγμα κυδωνιού.
      Περιέχει πολλή πηκτίνη, κατάλληλη για την παρασκευή μαρμελάδων.
      Η αρχαιότερη τεκμηριωμένη στην Ευρώπη μαρμελάδα (16ος αιώνας) φτιαχνόταν από κυδώνια.
  fruit.jackfruit:
    label: τζακφρούτ
    summary: Ένα τεράστιο τροπικό φρούτο· το μεγαλύτερο φρούτο στον κόσμο που φυτρώνει σε δέντρο.
    info: |
      Το τζακφρούτ δίνει τα μεγαλύτερα φρούτα που φυτρώνουν σε δέντρο· μπορούν να ζυγίζουν πάνω από 35 κιλά.
      Κατάγεται από την τροπική Ασία και είναι βασική τροφή στην Ινδία, το Μπανγκλαντές και την Ταϊλάνδη.
      Το άγουρο τζακφρούτ έχει ουδέτερη υφή και χρησιμοποιείται ως χορτοφαγικό υποκατάστατο κρέατος.
      Τα ώριμα κίτρινα κομμάτια είναι γλυκά και αρωματικά.
  fruit.durian:
    label: ντούριαν
    summary: Ένα μεγάλο αγκαθωτό τροπικό φρούτο με έντονη μυρωδιά· ο βασιλιάς των τροπικών φρούτων.
    info: |
      Το ντούριαν ονομάζεται ο βασιλιάς των τροπικών φρούτων.
      Η έντονη μυρωδιά του είναι αποκρουστική για κάποιους και δελεαστική για άλλους· σε πολλά ασιατικά ξενοδοχεία απαγορεύεται.
      Η σάρκα είναι κρεμώδης και γλυκιά, με σύνθετη γεύση αμυγδάλου, βανίλιας και τυριού.
      Στη Νοτιοανατολική Ασία εκτιμάται ως εκλεπτυσμένη πολυτέλεια.
  fruit.rambutan:
    label: ραμπουτάν
    summary: Ένα κόκκινο τριχωτό τροπικό φρούτο, παρόμοιο με το λίτσι.
    info: |
      Το ραμπουτάν κατάγεται από τη Μαλαισία· το όνομα προέρχεται από τη μαλαισιανή λέξη rambut, που σημαίνει τρίχα.
      Η κόκκινη φλούδα του είναι καλυμμένη με μαλακές, γαντζωτές προεξοχές.
      Η σάρκα είναι διάφανη και γλυκιά, όπως του λίτσι.
      Είναι πλούσιο σε βιταμίνη C και σίδηρο.
  fruit.longan:
    label: λόνγκαν
    summary: Ένα μικρό καφέ τροπικό φρούτο, συγγενικό με το λίτσι.
    info: |
      Το λόνγκαν είναι ο καρπός ενός τροπικού δέντρου με καταγωγή από την Κίνα.
      Το όνομα προέρχεται από την κινέζικη λέξη long yan, που σημαίνει μάτι δράκου, λόγω της διάφανης σάρκας με μαύρο σπόρο.
      Έχει γλυκιά και αρωματική γεύση.
      Στην παραδοσιακή κινέζικη ιατρική θεωρείται τροφή που ενισχύει το αίμα και την καρδιά.
  fruit.tamarind:
    label: ταμάρινδος
    summary: Ένας καφέ λοβός με ξινή σάρκα· βάση της ταϊλανδικής κουζίνας.
    info: |
      Ο ταμάρινδος κατάγεται από την τροπική Αφρική· σήμερα καλλιεργείται σε όλους τους τροπικούς.
      Η σάρκα είναι έντονα ξινή και γλυκιά· χρησιμοποιείται στο παντ ταϊ, στη σάλτσα Γουόρτσεστερ και στο ινδικό τσάτνεϊ.
      Η λέξη προέρχεται από το αραβικό tamr hindi, που σημαίνει ινδικός χουρμάς.
      Είναι πλούσιος σε τρυγικό οξύ, βιταμίνες του συμπλέγματος B και σίδηρο.
  fruit.nectarine:
    label: νεκταρίνι
    summary: Ένα λείο ροδάκινο χωρίς χνούδι· ζουμερό και γλυκό.
    info: |
      Το νεκταρίνι είναι φυσική μετάλλαξη του ροδάκινου με λεία φλούδα.
      Διαφέρει από το ροδάκινο μόνο ως προς το γονίδιο της λειότητας της φλούδας.
      Έχει παρόμοια γεύση, αλλά πιο σφιχτή υφή.
      Το όνομα προέρχεται από το νέκταρ των θεών και μαρτυρεί την υποτιθέμενη τελειότητά του.
  fruit.damson:
    label: δαμάσκηνο Δαμασκού
    summary: Ένα μικρό σκούρο δαμάσκηνο, τυπικό των αγγλικών εξοχικών κήπων.
    info: |
      Το δαμάσκηνο Δαμασκού είναι μια μικρή ποικιλία δαμάσκηνου σκούρου μπλε-μαύρου χρώματος.
      Η ονομασία damson προέρχεται από τη Δαμασκό, από όπου το φρούτο έφτασε στην Ευρώπη.
      Ωμό είναι πολύ ξινό, αλλά εξαιρετικό σε μαρμελάδες, κομπόστες και τζιν (damson gin).
      Στην αγγλική παράδοση καλλιεργείται από την αρχαιότητα.
  fruit.medlar:
    label: μούσμουλο
    summary: Ένα μικρό καφέ φρούτο συγγενικό με το μήλο· πρέπει να ωριμάσει μετά τη συγκομιδή.
    info: |
      Το μούσμουλο (το γερμανικό) είναι ένα αρχαίο φυτό κήπου που καλλιεργείται από τον Μεσαίωνα.
      Είναι βρώσιμο μόνο αφού μαλακώσει (ωρίμανση), δηλαδή μετά την ωρίμανση που ακολουθεί τη συγκομιδή.
      Είναι πλούσιο σε τανίνες και βιταμίνη C.
      Ο Σαίξπηρ το αναφέρει στο Ρωμαίος και Ιουλιέτα· σήμερα είναι μάλλον περιέργεια για κηπουρούς.
  fruit.ackee:
    label: άκι
    summary: Ένα κόκκινο τροπικό φρούτο με βρώσιμους κίτρινους αρίλλους· το εθνικό φρούτο της Τζαμάικα.
    info: |
      Το άκι είναι το εθνικό φρούτο της Τζαμάικα· πήρε το όνομά του από τον καπετάνιο Μπλάι (1793).
      Βρώσιμοι είναι μόνο οι ώριμοι κίτρινοι αρίλλοι· το άγουρο ή υπερώριμο φρούτο είναι τοξικό (υπογλυκίνη A).
      Το ackee and saltfish είναι το εθνικό πιάτο της Τζαμάικα.
      Κατάγεται από τη Δυτική Αφρική και μεταφέρθηκε στην Καραϊβική μέσω του δουλεμπορίου.
  fruit.feijoa:
    label: φεϊτζόα
    summary: Ένα μικρό ωοειδές πράσινο φρούτο με αρωματική σάρκα.
    info: |
      Η φεϊτζόα κατάγεται από τη Νότια Αμερική.
      Η σάρκα της έχει έντονη αρωματική γεύση ανανά, γκουάβα και μέντας.
      Είναι πολύ δημοφιλής στη Νέα Ζηλανδία ως φθινοπωρινό φρούτο.
      Είναι ελάχιστα γνωστή στην Ευρώπη, αλλά αγαπητή στις χώρες καταγωγής.
