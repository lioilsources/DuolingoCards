lang: el
pivot: false
title: Φρούτα
cards:
  fruit.ackee:
    label: ackee
    summary: Κόκκινο τροπικό φρούτο με εδικά κίτρινα αρίλια · εθνικό φρούτο της Ιαμαϊκής.
    info: Το Ackee είναι το εθνικό φρούτο της Ιαμαϊκής και πήγε από τη Δυτική Αφρική στους Κάραβους μέσω του δουλεμπορίου· χρώνε να γίνει λεπτομερής διάχρονη βοτανική παραδοσιακή προσέγγιση.
  fruit.apple:
    label: μήλο
    summary: Στρογγυλό κόκκινο ή πράσινο φρούτο με γλυκό - πικρή γεύση.
    info: '{"hint":"κυρτό κοκκινωπό ή πράσινο φρούτο από τη μήλα (Malus domestica)","info":"Το μήλο είναι το ωφέλιμο γεύμα σχηματιζόμενου δένδρου Malus domesticum , μιας από τις πιο βγαλμένες λεβάντες στον κόσμο . Διαθέτει νιτρώδη C και ίνες ; υπάρχουν περισσότερες από 7 "","label":"μήλο","summary":"Κυρτό κοκκινωπό η πράσινο φρούτο με γλυκόξινη γεύση."}'
  fruit.apricot:
    label: Αχίδα
    summary: Πολύ βαθύ κόκκινο σταφύλι.
    info: '{"hint":"μικρό καρπούζι με πράσινη φλέβα","info":"Η αχίδα είναι ένας τύπος σταφυλιού χωρίς λουστράκι· γεύεται δεξιόγλυκο και νερώδης."}'
  fruit.avocado:
    label: Αβοκάντο
    summary: Κρεμώδης τροπικός μήλο ; βάση για Guacamole.
    info: |-
      Ο αβοκάντος πρoέρχεται τη Μεξικό και όλα του νήσων Γκουαδελουπής
      Είναι φυτογενώς μήλο εμφύτωσης , αλλά στη γαστρονομία λειτουργεί διαθλαστικό βλαστού .
      Περιέχει υγιεινές μονοϋδρικές λίποι(ελαιϊκό ) ως το ελαιόλαδο.
  fruit.banana:
    label: Βανάνι
    summary: Πορτοκαλί ξηρό καρπό με γλυκό σάρκα.
    info: '{"hint":"μακρός κυμβάλος που ανήκει στη φυλή Musa","info":"Το μπανάνι είναι το ωοθύλακα θερμοζωνικού φυτού από τη ντέσποτα βανανών. Διαθέτει λεχεΐνιο και διψήφιες γλυκότητες, που προσδίδουν γρήγορη ενέργεια.","label":"Μπανάνι","summary":"Κίτρινο ζεστό οξύ με γλυκό σάρκα."}'
  fruit.blackberry:
    label: Αγκινάρα
    summary: Σκούρο κρασπωμένο τζιβούρι.
    info: Η αγκινάρα είναι μπλε σχοδέφυτο που ρастεύεται σε θαμνώδη φυτό Rubus fruticosus.
  fruit.blueberry:
    label: Αγριανθούπετρα
    summary: Φυσική νύξη.
    info: Η αγριανθούπετρα ή βόλβουκα είναι πλήρης φυσικών χάμων και σχεδόν δεν μεγαλώνει τέτοια γι’ αυτό λέγεται «φυσική». Δίνει νύξη στο σώμα.
  fruit.cantaloupe:
    label: Καντάλουπ
    summary: Πορτοκαλί εσωτερικό μελόνι.
    info: Το καντάλουπ ή μελόνι Cucumis melo var.cantalloupensls προέρχεται από την Ασία· εμφανίζει χαρακτηριστική φυσαλιδωτή δermiς σε λεύκανση γκρι - καφέ και νερώδη βλαστογόνο εσωτερικό σε έντονο ροζ / κόκκινο ως κίτρινο χρώμα.
  fruit.cherry:
    label: Τζέντι
    summary: Μικρό κατσίκι αχνού που μεγαλώνει σε ζευγάρι.
    info: '{"hint":"μικρό κατσίκι αχνού που μεγαλώνει σε ζευγάρια","info":"Η τζέντις είναι φρούτο ρόδων γηπεδιού, δημοφιλής λαχανικός νήμας. Διαθέτει antioksidants και μελατονίνη· βρίσκονται sweeties και sour (βρώσιμο)."}'
  fruit.coconut:
    label: '"Συδόφη"'
    summary: Μεγάλος τροπικός νηθίδα με σκληρό φλοιό και λευκό σάρκα.
    info: '{"hint":"μεγάλος τρопικός καρπός με ίντριο πέτασμα","info":"Το συδόφη ψωμί είναι φρούτο από δέντρο συδόφου; βοτανική γνώμη λέει ότι είναι νηθίδα, όχι νηθίδα, αλλά καβούκιο\nΗ νερό συδόφη που βρίσκεται μέσα σ'' ένα ακατέργαστο φρούτο είναι φυσικό ιοντιζόμενο ποτό\nΟ συδόφης γάλα και λάδι είναι βασικά συστατικά της ανατολικής ασιατικής και Ινδικής кухни\nΔέντρο συδόфης είναι γνωστό ως "δέντρο της ζωής"."}'
  fruit.cranberry:
    label: Βρουσίνχα
    summary: Μικρός κόκκινος νιτρικός καρπός· παραδοσιακός Αμερικανικός συνθετικός.
    info: |-
      {"hint":"μικρός ταρτάροφλεβίνη και επώδυνο ρουγκένι ούρων","info":"Η βρουσίνχα ανήκει στη φυλή Vaccinium microcarpa που δίνει μικρά νιτρικά λεμονιά γεύξης.
      Είναι παραδοσιακό συστατικό της Γιορτής Δώρων στις ΗΠΑ - cranberry sauce.
      Συμπεριλαμβάνει procyanidine, που εμποδίζουν την adhesion των Escherichia Coli στα mukous membranes.
  fruit.currant:
    label: ribes
    summary: Μικρό κόκκινο, μαύρο ή λευκό φραϊτίδι.
    info: Το ρίμπες είναι μικρό φραΐτιδι που ανθίσσει σε θυλάκια τύπου κήλη. Το μαύρο ribes (Ribes nigrum), διαφέρει για να περιέχει την μεγαλύτερη ποσότητα βιταμίνης C απ' όλα τα λουλούδια. Δώσει την βάση γεύσης στο Royal British Drink 'Ribena', και στο licorice Cassis.
  fruit.damson:
    label: Δαμασκήνος
    summary: Μικρό μαύρο φρύδε τύπου που είναι χαρακτηριστικό των αγροτικών κήπων
    info: |-
      Η δαμάσκηνος πρίγκιπα είναι μικρό φρύδε έχουντα βαθύ κυανωπώδες χρώμα σχεδόν νυχτερινή απόχρωση
      Πήρε το όνομά της από το Δαμασκό γιατί αφ' εκεί ξεκίνησε η πολιτιστική της λέξη στην Ευρώπη,
      Είναι πολύ πικρή ως τρόφιμο αλλά ιδανική για γλυκά, ποϊδιλές και γιν( damson gin)
      Στην Αγγλική παραδοσιακή καλλιέργεια υπάρχει από την αρχαιότητα
  fruit.date:
    label: date
    summary: Γλυκό καφέ οβάλ fructose της φυσαλίδας.
    info: Η δατολιά προέρχεται από την φυσαλίδα Phoenix dactylifera και είναι γνωστή ως η βασική σύμβουλος νourishment του Δυτικού Αγγλικού με λευκό χρώμα.
  fruit.dragon_fruit:
    label: Φρούτο Δράκου
    summary: Ροζ τροπικό φρούτο κάκτου με λευκό σβητό σάρκα
    info: |-
      Ο φρούτος δράκου παγωμένη ή χιλόχερυ είναι από το Μεξικό και νότια Αμερική
      Έχει σφαιρικό μπλε λουστράδο γλασούρα και βαθύ ροζ φλοιό
  fruit.durian:
    label: δουριάν
    summary: Πολύ μεγάλο πορτοκάλι αφρικής με έντονη χαρακτηριστική μυρωδιά.
    info: Το δουριάν ή Δυρίων βαθύς επώδεται ως το 'βασιλικό' πορτοκάλι αφρικής και γνωστό στη νότια Γ΄Αμερική με το λέγχο «ΔΟΥΡΙΩΝ».Η φαγητική του ιδιότητα εξαρτάται από την ποσότητα των θρεπτικών συστατικών.
  fruit.feijoa:
    label: Φέιοα
    summary: Πολύψηχο πράσινο αρώματιστο φρούτο.
    info: Η φέιοα ή σε λατινικά Acca Sellowianna προέρχεται από τη νότια Αμερική και είναι γνωστή ως μυδιλιά. Διαθέτει δύνατη αρώματιστη γουτά (φρούτο βογβορτζία), που μοιάζει με ανανάς, Γουάϊταντ και μεντεϋλίτσα.
  fruit.fig:
    label: '"Φίκα"'
    summary: Πορτοκαλιά φρούτο Figus Caricas ; γλυκό και πλούσιο σε σπόρους.
    info: |-
      {"hint":"πορτοκαλιά με γλυκό εσωτερικό που βγήκε από την Ιχθύς και χαμένη","info":"Η φίκα (Figus Carica) είναι στην πραγματικότητα δεν λέγεται να είναι ένα φρούτο , αλλά μια καψώδης που περιέχει ριζώνεται όλες τις μικρές λουλούδια .
      Οι φύλλα του Γάβαλου και της Δαϊφανίας στη Βίβλο είναι φύλλα Figs.
      Ταξινομημένα figs είναι ιδανική πηγή CaCO₃, K⁺ & fiber.
  fruit.gooseberry:
    label: '"agrest"'
    summary: '"Μικρό round transparent σπερμέλαιο; popular στους khepeus"'
    info: '{"hint":"μικρός διαφανής πράσινο ή κίτρινο φρουτώδης σπερμέλαιος","info":"Το αγρέζτ (Ripis uva-crispia) είναι μικρό ωοειδές τύπων για να βρίσκεται συχνά στα λαϊκά κήπους της Δυτικής Ευρώπης\nΥπάρχει σε πράσινη, κόκκινη και κίτρινη ποικιλία\nΕίναι πλούσιο σε vitamin C\nΟ κρεμμυδισμένος wino από agrestas είναι ένα ιστορικό populaire drink."}'
  fruit.grape:
    label: Σταφύλι
    summary: Μικρό σφαιρικό φρούτο που ανθίσσει σε συμπαγείς σταφυλούς.
    info: Η αμπέλια παράγει σταφύλια διαφόρων χρωμάτων - από το κυανί έως το μαύρο βερίκουβο. Τα φρούτα εδώσιμα νηστή για λαισίγιο ή σχιζόμενα για παρασκευή οίνου.
  fruit.grapefruit:
    label: Γκρέιπ
    summary: Μεγάλο πικρογλυκό κιτρικό
    info: "Το γρέιπφρουτ ή παμελόνη είναι υβριδικό τσάϊ και αγγουριού συχνής με διαθεώρηση βρωμικής φύσης.. \nΠεριγράφηκε να λειτουργεί στο Γκρέιπφρουτ στο Δεκαοκτάβιο στη Μπαρμπάντος..\nΟι ροζ και κόκκινες παμελόνες περιέχουν λυκοπεΐνη και β -καροτίνη."
  fruit.guava:
    label: manitari
    summary: Πολύ βουβά λευκός μανιτάρας.
    info: Η μανιτάρδη ποκείσθη από τη θέρμη και εξαπλώθη σ’ όλη τη νότια Αφρική· δύναται να φυτρωθεί γρήγορα.
  fruit.jackfruit:
    label: Jackfruit
    summary: Γιγαντιαίο τροπικό φρούτο· το μεγαλύτερο φρούτο στο δέντρο.
    info: Το χλεβόφυτο ή φραύδι της πίσω απ' του κάμπον είναι μέγιστο γήϊνο δέντρο στο νέφος - βάζει λεκάθια πάνω από 35 κιλών! Δεν προέρχεται από την Ασία των Tropics? Για την India , Bangladesh & Thailandia είναι βασικό foodstuff . To non-matured Jackfruit has an unremarkable texture but is used by vegans to replace meat.
  fruit.kiwi:
    label: '"kiwi"'
    summary: Καφέ μελανισμένο φρούτο με πράσινο ψευδοϋψίδιο · πλούσιο σε vitamins
    info: '{"hint":"μικρό καφέ μελάνι σπούγγως φρούτο με ζυμώδη πράσινο χρήζων από του Actinidia deliciosa","info":"Το Kiwi είναι γνωστό να βγήκε από την Κίνα, ως "Yang Tao" ή "Chinese Gooseberry"\nΗ New Zealand διαθέτει την εξερχόμενη λεβάντα και το ονόμασε μετά το εθνικό του πουλί, το kiwi\nΠεριέχει διπλάσιο Vitamin-C απ'' ότι το πορτοκάλι\nΟ ρόφος είναι έντονα πράσινος· υπάρχουν και χρυσές (κίτρινες) ποικιλίες."}'
  fruit.lemon:
    label: λεμόνι
    summary: Πικρό μους χρωματιστό φρούτο σφυγμένο να δώσει βιταμίνη Γ.
    info: Το λεμόνι είναι πικρή κυτρικάδα από την Ασία.
  fruit.lime:
    label: Lemon
    summary: Small acidic citrus used for flavoring dishes like salads.
    info: '{"hint":"μικρό πολύ όξινο και αυγουρατικό μπεχάμης","info":"Η λίμων Μέξικο είναι το νήφο για σαλάτες φρούτων,","label":"Λίμων Μέξικο","summary":"Πολύ χαμηλό pH - βασικό διαβρώσιμο."}'
  fruit.longan:
    label: Λόνγκαν
    summary: Πράσινο φρούτο που αξιολογείται για την εμβατική του γεύση.
    info: Το λόνγκαν ή Dimocarpus longgan είναι φρούτο της περιοχής με απάθωση στους υδραυλικούς δέκτες και βασιζόμενο στη νεφελώδη γεύση.
  fruit.lychee:
    label: Λίτσι
    summary: Πολύ μικρό κόκκινο τροπικό φρούτο με διαφανή σαρδελά.
    info: Το λίτσι είναι τρόπικο φρούτο που καλλιεργήθηκε αρχικά στη Νοτιοανατολική Ασία· χαρακτηρίζεται από μια γυμνωτική δέρμα ντυμένος σε κόκκινο ως βαφτώνει και αποκαλύπτει μια διαφανή, λευκή σαρδελά · Γεύση γλυκιά και εξαϋλωμένη.
  fruit.mango:
    label: '"mango"'
    summary: Δρυϊκό φρούτο με ροζ - πορτοκαλί υψίπεδο σάρκα.
    info: '{"hint":"πολύτιμο καρπωσίνη με χρώμα που φθάνει από το ζυγώδες στο ναρκίζιο λέβητα ( Mangifera indica )","info":"Το mango είναι γνωστή " βασιλιάς των τροπικών καρπωσίνιων ".Είναι πλούσιο σε vitaminA & VitaminC και προέρχεται από την νότια Asia ,όπου διαφυτεύεται για 4000 χρόνια ."'
  fruit.medlar:
    label: Μισπούλα
    summary: Παραλλαγή της μήλας · Δεν είναι τρώγιμο πριν από τη βλεδοντία.
    info: Η μισπούλα είναι πρώτη γεωργική καλλιέργεια του Μεσαίωνα αφότου χρησιμοποιείται συχνά δεξιάς φθοράς λόγω της βλεδοντίας - να «βλεδωνιστεί» μετά τη συγκομιδή πριν γίνει τρώγιμο· είναι πλούσια σε αντιοξειδωτικά και βιταμίνη Γ.
  fruit.melon:
    label: μελονιάς
    summary: Πολύ βολικό αχλαδιώδες με λευκή, πορτοκαλί ορ γκρή νεφέλη.
    info: '{"hint":"μεγάλο στρόντιστο ή εκφυλισμένο καρπώδες με πορτοκαλί η γκρή τη φλούδα","info":{"label":"μελονιάς","summary":"Μεγάλο χουμωριστό αχλαδιώδες με λευκή, πορτοκαλί ι δρασπαλιστή νεφέλη."},"translation":[{"lang":\"grc\",\"text\":[{\"type\":\"sentence\",\"words\":[[\"Ο \"],[\"μελονιάς\"]],\"punctuation\":\")\"},{\"type\":\"phrase\",\"words\":[[[\"(\"],[\"Cucumis\"],[\"melon)"]]],\"punctuation\":\"\'
  fruit.mulberry:
    label: ΜΟΡΦΉ
    summary: Σκούρο μπλε φρούτο από το μορφή· τροφή του λεβαντιού.
    info: Η μορφή είναι τύπου Morus καθώς η φυτική αυτή πελάγη δένδρων χρησιμοποιεί για να βρόχθει σε λεβάντια. Διακρίνονται τρεις τύποι - λευκή, κόκκινη και μαύρη -, με τη μαύρη να είναι ο πιο γλυκός. Για την ιστορία του ραψοδισμού, ήταν καθοριστική η καλλιέργεια του μορφή.
  fruit.nectarine:
    label: Νεκταρίνα
    summary: Λεϊψανοφόρο αχπόδεντρο
    info: Η νεκταρίνα εμφανίσθηκε ως φυσιολογική μύτωση του αχπόδεντρου που έχει λεπτή και στέγνη δermάτινη επιβλήττα. Διαφέρει γενετικώς απ' το αχπόδεντρο μόνο σε αυτό το γονίδιο.
  fruit.orange:
    label: ΠΟΜΈΛΟ
    summary: Σιτρικό γλυκό με ευωδιαστική πορτοκαλί φλούδα.
    info: '{"hint":"κυρτό κιτρινωπο φρουτο με παχύ χρώμα αγγίδης το οποίο είναι νάρθηξ( Citrus sinensis)","info":"Το πομέλο είναι ένα σιτρικό γλυκό που προέρχεται από την νοτιοανατολική Ασία , διαφημιζόμενο λοιπόν σ'' όλο τον κόσμο .Είναι βαρύ σε Vitamin-C & είναι δημοφιλές ως juice","label":"ΠΟΜΈΛΟ","summary":"Κυρτό σιτρικό γλυκό με ευωδιαστική πορτοκαλί φλούδα."}'
  fruit.papaya:
    label: ρουβίδα
    summary: Μεγάλο τρόπικο φρούτο με ισχυρά πορτοκαλί σάρκη.
    info: '{"hint":"μεγάλο τρόπικο φρούτο με έντονα πορτοκαλί σάρκη","info":"Η ρουβίδα είναι αυθεντική κατ'' οἶδον για νέφωσης της βόρειας Για τη διαχείριση των λεμφών.'
  fruit.passion_fruit:
    label: Μούτσενκα
    summary: Πολύ δροσερός φρούτος με ραβδωτό κόκκινο περίγραμμα.
    info: Η Μούτσενκα είναι από τη νότια πλευρά με βουνώδη χλωμή γέφυρα και φθαρμένο λευκό σχῆμα.
  fruit.peach:
    label: '"Φραΐχα"'
    summary: '"Μαλακός - κίτρινος / πούπων αξών."'
    info: '{"hint":"μαλακός μουστιδερί και πούπων αξών ουράγκι της Prunus persica","info":"Η φραΐχα (Pruina persika), ρίζα στη νήσο γέννηση εκεί δε βρίσκεται σύμβολο αθανασίας\nΠαρατηρείται λεπτός μαλλίδιος φλοιός· \nΥφίστανται λευκά και κίτρινα είδη ; Τα νεκταρίνια είναι λεία είδη χωρίς μαλλίδια · \nΣτη νήσο , η φραΐχα είναι συνήθως στη ΓιούνΓιού και την ιατρική μυθολογία ."}'
  fruit.pear:
    label: Ρίδη
    summary: Φρούτο σχήματος διάβροντος με γλυκό , αξιοσημείωτο γεύση.
    info: '{"hint":"μήλο με σχήμα διάβροντου και γλυκό ασθενές άγευστο πώμα","info":"Η ρίδη είναι το φρούτο των βρύοντας λεπτόφλουκτων, νέφων που είναι στενά συγγενικά με τα μήλα.Έχει λεπτό, υψηλό περιεκτικότητα σε ίνες ;Υπάρχουν εκατοντάδες είδη ."}'
  fruit.persimmon:
    label: Tómel
    summary: Πορτοκαλώφ λευκό για βοτανικό μήλο.
    info: Το τόμελ ή κακί είναι από τη ντριβάδα Diospyros kaki που χωρίζεται στη δυσχύθης μήλο φέγγος.
  fruit.pineapple:
    label: '"Ανανάς"'
    summary: Φρούτο με αγκίστρα στην κορυφή και κίτρινη σαρκίδα.
    info: '{"hint":"πολύτιμο τρόπικο φροῦτο με αγκίστρα στην κορυφή που ονομάζεται Ananas comosus","info":"Το ananas είχε γέννηση ως δικαιώματα να βρεθεί στην Δυτική Αμερική και εξωδικαστικά λειτουργεί σε όλο τον τροπικό ζώνη του πλανήτη.Περιέχει ένζυμο Bromelain , που βοηθά στην πέψη ."}'
  fruit.plum:
    label: prune
    summary: Φρύγανο καρπών· βάση για την παχαινή.
    info: '{"hint":"μικρό ελατοειδές μωβ ξηρό φρύγανο καρπών (Pruina domestica)","info":"Η προυίνα δομστικά αποτελεί βασική χρήση στη νότια Γερμανία για τη λευκή παχαινή."}'
  fruit.pomegranate:
    label: Γρανάτος
    summary: Κόκκινο φρούτο με χιλιάδες γλυκά σπόρια· σύμβολο γονιμότητας
    info: "Ο γρανάτος πηγαινει από τη Μέση Ασία και τη μεσόγειο\nΠεριλαμβάνει όψυχους εκατο σπόρων σε διαφανή κόκκινη λύθη \nΕίναι φορτώνει με antioksidants ; Διεξάγονται νέες έρευνες για την επίδραση στην καρδιά και τη φλεγμονή"
  fruit.quince:
    label: kedule
    summary: Hard yellow fruit related to apple
    info: '{"hint":"κίτρινο σκληρό αромατικό φρούτο","info":"Η κεδουλή είναι παρέμβυση των μήλων και ρόφης· η γλάσπα να βγει λεπτή δεν είναι εύχετρη και έχει σκληρό χρώμα\nΠάντα υποβάλλεται σε θερμική επεξεργασία:\nΚεδουλικό Γεμιστό", "Γεμιστό" , "Σπεϊζικό."\nΕμπεριέχει μεγάλη ποσότητα πεκτίνης που είναι κατάλληλη για την παρασκευή γεμιστών\.\nThe oldest recorded jam in Europe is made by kedulies.'
