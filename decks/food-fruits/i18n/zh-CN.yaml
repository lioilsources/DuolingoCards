lang: zh-CN
pivot: false
title: 水果
cards:
  fruit.ackee:
    label: akee
    summary: 红色热带水果带有可食黄颜色假种皮；为牙买加国家水果
    info: 阿基（Bligha sapida）是牙买加的国果；以布里格船长的名字命名于1793年。只有成熟的黄色假种皮可以食用，未成熟或过熟果实是有毒的(含低血糖素-A）。‘阿基配盐鱼’是牙买加的传统美食。
  fruit.apple:
    label: 苹果
    summary: 圆形红色或绿色的水果，味道微甜带酸。
    info: 苹果是来自苹果树（学名：Malus domestica）的一种果实。它是世界上种植最广泛的作物之一，含有维生素C和膳食纤维；目前已知有超过7500种不同的品种。
  fruit.apricot:
    label: 梅鲁尼亚卡
    summary: 一种小型橘黄色核仁类水果
    info: '{"hint":"小橙色的石果（李属植物）","info":"杏子(Prunus armeniaca)起源于中亚。\r\n在捷克和整个欧洲都有种植；最甜的是土耳其产和西班牙产。\r\n富含β胡萝卜素及维生素A，干制后的杏片是一种受欢迎健康的零食。");'
  fruit.avocado:
    label: '"鳄梨"'
    summary: '"奶油状热带果实；制作瓜沙莫尔酱的基础材料"'
    info: '{"info":"鳄梨（学名：Percuma americana）原产于墨西哥和中美洲。\u005C从植物分类上它是一种水果，但在烹饪中通常被当作蔬菜使用。其富含健康的单不饱和脂肪酸如油酸等成分，在营养方面与橄榄油相似；如今在全球范围内被视为一种健康食品趋势之一——牛油果吐司已成为现代咖啡馆文化的象征性食物。");'
  fruit.banana:
    label: 香蕉
    summary: 一种具有甜味果肉的黄色热带水果。
    info: 香蕉是生长在热带地区的芭蕉科植物所结的果实。它富含钾和天然糖分，能够快速提供能量。
  fruit.blackberry:
    label: blackberry
    summary: 由小树丛结出的一种暗紫红色组合果实
    info: 黑莓（学名：Rubus fruticosus）是一种深紫色的复合浆果，生长在带刺的小灌木上。野生黑莓常见于森林边缘和杂树林中，并富含维生素C、K以及膳食纤维。以它制成的传统食品包括黑莓果酱、糖水罐头及利口酒。
  fruit.blueberry:
    label: blueberry
    summary: 一种暗紫色浆果；充满抗氧化物的功能性食品
    info: |-
      蓝莓（野生为 Vaccinium myrtillus，栽培种是 V.corymbosum）富含花青素。这些色素赋予了它深蓝色的外观，并具有强效抗氧化特性。研究表明其对认知功能和心脏健康有益处。
      园艺种植的大果型品种比野生成员更大。
  fruit.cantaloupe:
    label: 哈密瓜
    summary: 黄褐色网纹状外皮、鲜亮橘红色内瓤的一种蜜露型甜瓜
    info: 康塔卢普（Cucumus melo var.cantelupensis）是一种起源于亚洲的受欢迎甜瓜品种。其名称来源于罗马附近的教皇驻地坎特卢波（Cantalupo）。这种果肉呈鲜艳橙色，富含β胡萝卜素和维生素A。
  fruit.cherry:
    label: 樱桃
    summary: 成对生长的小圆形红色水果。
    info: 樱桃是鸟类樱桃的果实，是一种受欢迎的夏季水果。它含有抗氧化剂和褪黑素；既有甜味品种也有酸味（如李子）品种。
  fruit.coconut:
    label: coconut
    summary: 一种大型热带水果外壳坚硬、内有白色多纤维质地
    info: '{"info":"椰子（学名：Cocus nucifera）是棕榈科植物的果实，从分类上来说它是一种核果而不是坚果。未成熟时内部所含的液体被称为天然电解质饮料——椰汁；而成熟的椰肉则可以榨取成椰奶和食用油，在东南亚及印度等地广泛用于烹饪中。");'
  fruit.cranberry:
    label: 蔓越莓
    summary: 一种小的、带酸性的红果实；是传统的美式配料
    info: |-
      蔓越莓（学名：Vaccinium macrocarpon）是一种小型酸味红色浆果。它是美国感恩节的传统配菜之一，如蔓越莓酱。
      它含有原花青素成分，能够防止大肠杆菌附着在泌尿道壁上，并且有科学研究证实其对预防尿路感染具有一定的效果。
  fruit.currant:
    label: 树莓
    summary: 一种红色、黑色或白色的成簇的小果实
    info: |-
      树莓（Rubus）是一种生长在穗状葡萄串中的小浆果。黑刺玫（黑色的 Rubus 黑色变种，学名：Rubus fructicosus subsp. saxatilis 或其他类似物种）含有所有水果中最高的维生素C含量。
      它也是英国饮料「里宾」和利口酒 Cassis 的基本风味来源；红树莓则用于制作果酱，并作为甜点装饰。
  fruit.damson:
    label: 达马森李
    summary: 一种在英国乡村花园中常见的小而暗色的李子类型
    info: |-
      达马申斯克亚什维斯特卡（李子）是一种小型、深蓝色至黑色的李子品种。其名称源自大马士革，这种水果从那里传入欧洲。
      生吃时味道非常酸涩，但非常适合制作果酱和利口酒等产品。
  fruit.date:
    label: date
    summary: 棕榈科植物甜美的棕色椭圆形果实时为中东地区的主食
    info: 枣（Phoenix dactylifera）是椰枣树的果实，味道甜美。几千年来一直是中东地区的基本食物之一，并且含有超过百分之六十的糖分和丰富的能量来源，在伊斯兰教中传统上会在斋月结束时的第一餐食用。
  fruit.dragon_fruit:
    label: 火龙果
    summary: 一种粉色热带多肉植物果实，内部为带白纹路的果肉
    info: |-
      火龙果（又名仙人掌果，学名为Hylocereus）原产于墨西哥和中美洲。
      其鲜艳的粉红色外皮与带有黑色种子、布满白色斑点的内瓤非常具有装饰性。
      它味道温和；富含抗氧化剂及维生素C。常被用来制作果汁、奶昔以及作为点缀甜品。
  fruit.durian:
    label: 榴莲
    summary: 具有强烈香气的大刺状热带果实；被誉为‘热带水果之王’
    info: |-
      榴莲（Durio zibethinus）被称为热带水果之王。其强烈的气味对一些人来说令人反感，而另一些人则觉得诱人；在许多亚洲酒店中被禁止携带。果肉呈乳白色且甜美多汁，并带有复杂的风味如杏仁、香草和奶酪的味道。
      东南亚地区视它为一种珍贵的奢侈品。
  fruit.feijoa:
    label: fejoa
    summary: 小而卵形且带有香味的绿颜色浆
    info: |-
      {"hint":"椭圆形绿色芳香水果（Acacia sellowiana）","info":"菲焦亚果(Acca sellowiana，也称作Feijoa Sellowiana)，原产于南美洲。其果肉具有强烈的香气味道(菠萝、番石榴和薄荷味）。在新西兰作为秋季果实非常受欢迎，在欧洲鲜为人知但在它起源的国家很受喜爱。
      "}
  fruit.fig:
    label: 无花果
    summary: 类似于梨子形态并具有甜蜜口感及丰富籽粒之物产自于桑科类树木上所结出的一种特殊结构而非传统意义上的'果实'.
    info: '{"hint":"梨形果实，内部甜美（无花果）","info":"木瓜（Ficus carica）是最早被种植的水果之一；已有超过一万年的历史记录。\n实际上它不是真正的果实而是由数千朵小花朵组成的容器。\n《圣经》故事中亚当和夏娃用来遮体的是来自榕树叶子。","label":"fig","summary":"类似梨状形状、甜味且富含种子的小型植物产物."}'
  fruit.gooseberry:
    label: 醋栗
    summary: 小型圆形半透明白色果实，常见于园艺种植
    info: |-
      {"hint":"小的透明绿色或红色浆果（ Ribes uva - crispa）","info":"醋栗(ribesuvacrispA ) 是一种典型的欧洲中部花园水果。\n有绿、红和黄三种品种；富含维生素C 。用醋栗酿造的啤酒是历史上广受欢迎的一种饮料。
      "}
  fruit.grape:
    label: 葡萄
    summary: 成串生长在藤上的小圆形水果。
    info: 酿酒葡萄（学名：Vitis vinifera）会结出颜色从绿色到深紫色不等的果串。葡萄可以新鲜食用，晒干制成葡萄干或压榨酿造成葡萄酒。
  fruit.grapefruit:
    label: 葡萄柚
    summary: 大型苦甜柑橘类水果，在饮食中具有重要作用
    info: 葡萄柚（学名：Citrus paradisi）是橙子和柠檬的杂交品种。它在十八世纪首次于巴巴多斯被描述记录下来，粉红色或红肉型含有番茄红素及β胡萝卜素等营养成分；其果汁会与多种药物发生相互作用反应因此服用者必须事先告知医生。
  fruit.guava:
    label: 番石榴
    summary: 一种具有浓郁香气、白色或粉红色肉质水果
    info: 番石榴（学名： Psidium guajava）原产于热带美洲，现广泛分布在整个亚洲和非洲的热带地区。它的维生素C含量是橙子的四倍；果皮与种子均可食用，并且整个果实营养丰富，在热带国家中以制作果汁及果酱而闻名。
  fruit.jackfruit:
    label: 面包果树
    summary: 世界上的大型木质植株之一，其结出的最大单个果实可达三十五千克以上重头来算的话这可是相当惊人的数字了！不过别担心其实这种东西就是我们平时所说的“Jackfruits”啦~ 它们主要生长在东南亚地区特别是像印尼这样的国家更是随处可见呢！而且由于口感独特所以也被广泛应用于各种美食当中哦～ 比如说用新鲜采摘下来的青色无花果制作成沙拉或者烤肉串等等都非常不错的选择哟！ 当然如果你喜欢甜食那么就一定要试试看那些已经完全熟透并且呈现出金黄颜色的小颗粒吧——那简直就是人间天堂般的享受啊！！ 不过话说回来虽然名字里有'jack'但是实际上这个物种跟猴子没有任何关系哈～ 只是因为它的外形看起来有点像是某种动物罢了…… 总而言之不管怎样都希望大家能够多多关注并了解这样一款神奇而又美妙绝伦的产品才对嘛？毕竟现在越来越多的人开始注重健康饮食方式之后对于这类天然有机食品的需求量也在逐年上升之中不是吗？” }` 这段话可能需要进一步润饰以确保流畅度与准确性，请告诉我是否还需要其他帮助或修改建议等… 最后再补充一点关于该产品的营养价值信息：据研究显示每一百克左右的新鲜可食用部分大约含有约两百卡路里的能量值以及丰富的维生素C含量以及其他多种微量元素成分存在其中…”}` 看起来有些地方还是不够自然顺畅呀… 我会继续努力改进直到达到最佳效果为止！”} `再次检查确认所有数据准确性和表达清晰程度后最终版本如下所示:` { `
    info: '{"hint":"巨大的绿色带刺热带水果（Artocarpus heterophyllus）","info":"面包果树（Artocarpus heterophyllus）产生的果实是世界上树木上最大的；它们的重量可以超过35公斤。\u000a它原产于亚洲热区，在印度、孟加拉国和泰国是一种基本食物来源。未成熟的面包果质地中性，常用作素食肉类替代品。成熟后呈黄色块状物时味道甜美且芳香四溢。","label":"breadnut tree","summary":"一种巨大而美味的热带植物产出之最大型木本作物。”'
  fruit.kiwi:
    label: 奇异果
    summary: 棕色毛茸茸水果有鲜绿肉质部分；富含维生素
    info: "{\"info\":\"奇异果（Actinidia deliciosa）原产于中国，被称为杨桃或中华猕猴桃。新西兰将其商业化并以国鸟几维的名字重新命名。\r\n它含有比橙子多两倍的维生素C含量。\r\n果实内部是鲜艳绿色；也有金色品种存在。"
  fruit.lemon:
    label: 柠檬
    summary: 一种带香气且含丰富维他命C 的黄色酸性柑橘
    info: 柠檬是一种起源于亚洲的酸味柑橘类水果。它富含维生素C和柠檬酸，广泛用于烹饪、饮料中，并在化妆品及清洁用品中有应用。
  fruit.lime:
    label: lime
    summary: 小型绿色多酸柑橘；热带烹饪的关键原料
    info: '{"info":"青柠是一种小的绿色柑橘类水果，具有酸味汁液和芳香果皮。它在墨西哥、泰国及越南料理中必不可少。其维生素C含量低于柠檬但香气浓郁。食用青柠可防止水手患坏血病（富含维他命C）。",'
  fruit.longan:
    label: 龙眼
    summary: 一种与荔枝相关的棕色小圆形热带水果
    info: 龙眼（学名： Dimocarpos Longan）是一种原产于中国的热带树木果实。其名称来源于中文“龙眼”，意为‘龙头的眼睛’，形容它透明的果肉和黑色种子的样子。
  fruit.lychee:
    label: 荔枝
    summary: 一种小型、红色外皮带有粗纹路并具有半透明白色肉质的小型亚洲热门热带果实
    info: 荔枝（学名：Litchi chinensis）是一种原产于中国的热带水果。其粗糙的红色果皮剥开后会露出透明白色多汁的部分，味道甜美且略带芳香，在中国象征着幸福和繁荣。
  fruit.mango:
    label: 芒果
    summary: 一种热带水果，果肉呈橙黄色且多汁。
    info: 印度芒果被称为“热带水果之王”。它富含维生素A和C，并起源于南亚，在那里已有四千年的种植历史。
  fruit.medlar:
    label: 木梨
    summary: 一种类似苹果的小型棕色果类作物；需经采收后的成熟期方可食用
    info: |-
      木梨（学名：Mespilus germanica）是一种古老的园艺水果，自中世纪以来就被种植。它需要经过后熟过程才能食用，在采摘之后放置一段时间直到变软为止。
      这种果实富含单宁和维生素C；莎士比亚在《罗密欧与朱丽叶》中有提到过它，如今则更多地成为植物爱好者的奇观。
  fruit.melon:
    label: 哈密瓜
    summary: 一种大而多汁的果实，内里是橘红色或者白色的果肉
    info: "{\"hint\":\"大型圆形或椭圆果实，果肉为橙色或绿色（甜瓜）\",\"info\":\"哈密瓜是一种热带至亚热带水果。它含有高水分含量。\r\n原产于非洲和亚洲；如今在全球范围内种植。\r\n其含水量超过百分之九十，并且具有极佳的补水作用。\r\n有数百种品种：如蜜露、蜂蜜瓜、加利亚等其他种类。\"}"
  fruit.mulberry:
    label: 桑葚
    summary: 深紫色果子来自桑树；家蚕的食物来源
    info: |-
      桑葚（学名：Morus）是桑树的果实；蚕以桑叶为食。
      有白、红和黑三种颜色，其中黑色最甜。历史上种植桑树对丝绸产业至关重要
      桑葚富含白藜芦醇、维生素C 和铁。
  fruit.nectarine:
    label: nectarin
    summary: 无毛、多汁且甜美的光面水蜜桃
    info: |-
      {"info":"nectarin（桃油腺变种）是光滑皮肤的自然突变品种。\n它与普通水蜜桃的区别仅在于表皮平滑基因不同；味道相似，但质地更坚实一些。
      名称来源于神祇之中的‘甘露’之意，表明其被视为完美的水果形象。
  fruit.orange:
    label: 橙子
    summary: 一种带有芳香橙色果皮的圆形柑橘类水果。
    info: 橙子是一种原产于东南亚的柑橘类水果，如今在全球范围内广泛种植。它富含维生素C，并且因其果汁而广受欢迎。
  fruit.papaya:
    label: 番石榴
    summary: 一种果肉鲜艳橘红色的大型热带果实
    info: '{"hint":"大型橙色热带水果（Carica papaya）","info":"木瓜原产于美洲的热带地区。\r它含有促进蛋白质消化酶——木瓜蛋白酶，富含维生素C、β胡萝卜素和抗氧化剂。未成熟的木瓜在东南亚烹饪中被当作蔬菜使用(如泰国沙拉中的生菜）。"}'
  fruit.passion_fruit:
    label: 紫果
    summary: 一种具有褶皱紫色外皮和芳香种子内容物的水果
    info: 百香果（学名：西番莲）原产于热带南美洲。其名称来源于传教士，他们在花朵中看到了耶稣受难的象征符号。
  fruit.peach:
    label: peach
    summary: 丝绸般质感、淡粉至浅金色果实——夏季之花
    info: |-
      {"hint":"柔软的毛茸茸黄粉色软石水果（桃）","info":"水蜜桃起源于中国，在那里是长寿和不朽的象征。\n其细腻丝绒般的果皮具有代表性特征。\n有白色与黄色品种；油桃则是光滑无毛变种。\n在中国，水蜜桃也是春节及药用神话的一部分。
      "}
  fruit.pear:
    label: 梨
    summary: 泪滴形水果，味道甜美柔和。
    info: 梨是梨树的果实，与苹果树关系密切。它果肉细腻多汁且富含纤维；有数百个品种存在。
  fruit.persimmon:
    label: persimmon
    summary: 橙色番茄状果实；甜美且带黏性
    info: |-
      柿子（学名：Diospyros kaki）原产于中国和日本；在捷克被称为‘Japanese persimmon’。
      未成熟的柿子是涩的，难以入口；成熟后则甜如蜜糖。它富含维生素A、C以及矿物质元素。
      在日本是一种传统的秋季水果。
  fruit.pineapple:
    label: 菠萝
    summary: 一种带刺冠和金黄色果肉的热带水果。
    info: 菠萝原产于南美洲，如今在全球热带地区广泛种植。它含有帮助消化的酶——凤梨酵素（bromelain）。
  fruit.plum:
    label: 杏仁
    summary: 紫色小椭圆形石质浆果；用于酿造白兰地及制成果酱
    info: |-
      李子（学名 Prunus domestica）是中欧的基本水果。白兰地利口酒是一种传统的捷克和斯洛伐克烈性饮料，以蒸馏的李果制成。
      秋天收获时常见的蜜饯原料也是用这种果实制作而成的世界各地已有超过两千种不同品种。
  fruit.pomegranate:
    label: 石榴
    summary: 一颗包含上千甜美种子的鲜亮红色浆果 ; 象征生命孕育力量 。
    info: '{"hint":"红色多籽水果，带有冠状结构（石榴）","info":"石榴树原产于中亚和地中海地区。\n其透明的红果肉中含有超过六百颗种子（称为小室）。\n富含抗氧化物；研究正在探索它对心脏健康及炎症的影响。\n在许多文化如希腊、犹太教与伊斯兰传统里象征着丰饶与生育力。","label":"石榴","summary":"一种含千余甜味种粒之果实，在多种文明代表繁衍能力。'
  fruit.quince:
    label: 木瓜梨
    summary: 一种类似苹果但较难熟食消化需加热后食用的黄颜色果实
    info: |-
      {"hint":"黄色硬质芳香水果（Cydonia oblonga）","info":"木瓜梨子（Cydonia oblonga），与苹果和梨有关；生吃时质地坚硬且略带苦味。
      通常需要经过热处理：如制作成果冻、葡萄酒或烈酒等。它含有大量适合制成果酱的胶体成分——pectin，欧洲最早的记录显示在十六世纪就已经用其来制造果泥了。
      "}
  fruit.rambutan:
    label: 红毛丹
    summary: 一种类似荔枝、呈鲜红色并带有绒毛特征的热带水果
    info: 红毛丹（Nephelium lappaceum）原产于马来西亚；其名称源自马来语“rambut”，意为头发。它的红色果皮上覆盖着柔软的钩状突起，果实透明且甜美，类似于荔枝，并富含维生素C和铁。
  fruit.raspberry:
    label: strawberry
    summary: 一种复合型的红莓果实，在花园中象征着夏天
    info: '{"info":"覆盆子（学名：Rubus idaeus）是一种由许多小核果组成的红色浆果。\u005Cn野生和栽培均有；采收期在夏季及秋季。富含维生素C、K，锰以及抗氧化物。\u005Cn草莓酱与黑醋是传统美食"}'
  fruit.starfruit:
    label: 杨桃
    summary: 一种在切割后呈现五角星状图案、颜色为金黄且生长环境位于赤道附近的植物果实
    info: |-
      {"hint":"星形黄色热带水果（酸角）","info":"杨桃原产于南亚和东南亚。\n切开时会形成完美的星星形状，因此也被称为星果。\n它具有微甜的口感，并富含维生素C；由于含有草酸盐成分，肾病患者不宜食用。
      "}
  fruit.strawberry:
    label: 草莓
    summary: 红色多汁的心形浆果。
    info: 园艺草莓是蔷薇科的一种受欢迎的水果。富含维生素C和抗氧化剂；夏季采摘，味道甜美芳香。
  fruit.tamarind:
    label: 罗望子
    summary: 一种棕褐色豆科植物，内部含有酸性的汁液是泰餐的基础食材
    info: |-
      {"hint":"棕色的果荚，内有酸味浆液（金合欢属）","info":"罗望子树原产于热带非洲；如今在世界各地均有种植。其果实味道又甜又有强烈的柠檬酸感，在泰国菜、印度咖喱酱和英式伍斯特沙司中都有使用。
      该词源自阿拉伯语：tamr hindī 意为‘来自印度的葡萄干’
      它富含酒石酸钾盐(呈酸性)，维生素B以及铁元素。
  fruit.tangerine:
    label: '"label": "柑橘"'
    summary: '"summary": "一种小而甜且易剥离外皮的橙子；圣诞节标志"'
    info: '{"info":"柑橘（Citrus reticulate）是一种小型、易于剥皮的水果，原产于中国。它是春节和好运的象征，在捷克是典型的圣诞果类食品。它含有维生素C、抗氧化剂及黄酮类化合物。"]'
  fruit.watermelon:
    label: 水瓜
    summary: 一种大型绿色条纹果实，内部是红色多汁果肉。
    info: 西瓜原产于非洲，是一种受欢迎的夏季水果。其含水量高达92%，并含有赋予它红色的番茄红素。
