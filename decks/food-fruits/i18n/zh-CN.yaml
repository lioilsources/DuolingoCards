lang: zh-CN
pivot: false
title: 水果
cards:
  fruit.apple:
    label: 苹果
    summary: 一种圆形的红色或绿色水果，味道甜中带酸。
    info: 苹果是苹果树的果实，是世界上种植最广的作物之一。它含有维生素C和纤维，品种超过7500个。
  fruit.banana:
    label: 香蕉
    summary: 一种黄色的热带水果，果肉香甜。
    info: 香蕉是芭蕉科热带植物的果实。它富含钾和天然糖分，能快速提供能量。
  fruit.orange:
    label: 橙子
    summary: 一种圆形柑橘类水果，橙色的果皮芳香。
    info: 橙子是原产于东南亚的柑橘类水果，如今在世界各地种植。它富含维生素C，人们喜欢榨成果汁。
  fruit.strawberry:
    label: 草莓
    summary: 一种红色多汁的心形浆果。
    info: 草莓是蔷薇科深受喜爱的水果。它富含维生素C和抗氧化物，在夏季采收。
  fruit.grape:
    label: 葡萄
    summary: 一种成串生长的小圆浆果。
    info: 葡萄藤结出各种颜色的葡萄，从绿色到深紫色。葡萄可以鲜食、晒成葡萄干或压榨酿酒。
  fruit.watermelon:
    label: 西瓜
    summary: 一种带绿色条纹的大型水果，果肉红润多汁。
    info: 西瓜原产于非洲，是深受喜爱的夏季水果。它92%是水分，含有使其呈红色的番茄红素。
  fruit.mango:
    label: 芒果
    summary: 一种热带水果，果肉黄橙多汁。
    info: 芒果被称为热带水果之王。它富含维生素A和C，原产于南亚，在那里已种植4000年。
  fruit.cherry:
    label: 樱桃
    summary: 一种成对生长的小圆红色核果。
    info: 樱桃是甜樱桃树的果实，是深受喜爱的夏季水果。它含有抗氧化物和褪黑素，有甜味品种和酸味品种。
  fruit.pear:
    label: 梨
    summary: 一种水滴形水果，味道甜美柔和。
    info: 梨是梨树的果实，是苹果的近亲。它果肉柔软多汁、纤维含量高，有数百个品种。
  fruit.pineapple:
    label: 菠萝
    summary: 一种热带水果，有带刺的冠和金黄色的果肉。
    info: 菠萝原产于南美洲，如今在世界各地的热带地区种植。它含有帮助消化的菠萝蛋白酶。
  fruit.lemon:
    label: 柠檬
    summary: 一种黄色的酸味柑橘，是维生素C和香气的来源。
    info: |
      柠檬是原产于亚洲的酸味柑橘。
      它富含维生素C和柠檬酸。
      它用于烹饪、饮料、化妆品和清洁用品。
      柠檬皮含有带有独特柠檬香气的精油。
  fruit.lime:
    label: 青柠
    summary: 一种小而绿的酸味柑橘，是热带菜肴的关键原料。
    info: |
      青柠是一种小而绿的柑橘，果汁酸、果皮芳香。
      它是墨西哥、泰国和越南菜不可或缺的原料。
      它的维生素C比柠檬少，但香气更浓。
      吃青柠曾靠维生素C保护水手免患坏血病。
  fruit.kiwi:
    label: 猕猴桃
    summary: 一种棕色多毛、果肉翠绿的水果，富含维生素。
    info: |
      猕猴桃原产于中国，在那里被称为中国醋栗。
      新西兰将它商业化，并以本国的国鸟几维鸟为它重新命名。
      它的维生素C含量是橙子的两倍。
      果肉呈鲜绿色，也有金黄色（黄色）的品种。
  fruit.peach:
    label: 桃子
    summary: 一种天鹅绒般的黄粉色核果，是夏天的象征。
    info: |
      桃子原产于中国，在那里是长寿的象征。
      它柔软如天鹅绒般的果皮很有特色。
      有白色和黄色的品种，油桃是表皮光滑无毛的品种。
      在中国，桃子是新年和治病神话的一部分。
  fruit.plum:
    label: 李子
    summary: 一种紫色核果，是李子白兰地和李子酱的原料。
    info: |
      李子是中欧的基础水果。
      斯利沃维茨（李子白兰地）是捷克和斯洛伐克的传统烈酒。
      李子酱是秋收的典型产品。
      世界上有2000多个李子品种。
  fruit.apricot:
    label: 杏
    summary: 一种橙色的小核果，酸甜多汁。
    info: |
      杏原产于中亚。
      它在整个欧洲种植，最甜的来自土耳其和西班牙。
      它富含β-胡萝卜素和维生素A。
      杏干是深受喜爱的健康零食。
  fruit.raspberry:
    label: 树莓
    summary: 一种红色的聚合果，是夏日花园的象征。
    info: |
      树莓是由许多小核果组成的聚合果。
      它有野生和栽培的，在夏季和秋季采收。
      它富含维生素C和K、锰和抗氧化物。
      树莓果酱和树莓醋是传统美味。
  fruit.blueberry:
    label: 蓝莓
    summary: 一种深蓝色的浆果，是富含抗氧化物的超级食物。
    info: |
      蓝莓富含花青素，这是一种具有强抗氧化作用的色素。
      花青素赋予它深蓝的颜色。
      研究表明它对认知功能和心脏健康有益。
      栽培蓝莓比野生蓝莓大。
  fruit.blackberry:
    label: 黑莓
    summary: 一种生长在带刺灌木上的深紫色聚合果。
    info: |
      黑莓是生长在带刺灌木上的深紫色聚合果。
      野生黑莓生长在林缘和灌木丛中。
      它富含维生素C、维生素K和纤维。
      黑莓果酱、蜜饯和利口酒都是传统产品。
  fruit.coconut:
    label: 椰子
    summary: 一种大型热带坚果，外壳坚硬，果肉洁白。
    info: |
      椰子是椰子树的果实，从植物学上说它是核果，而不是坚果。
      未成熟果实里的椰子水是一种天然的等渗饮料。
      椰奶和椰油是东南亚和印度菜肴的基础。
      椰子树被称为千用之树。
  fruit.papaya:
    label: 木瓜
    summary: 一种大型热带水果，果肉呈深橙色。
    info: |
      木瓜原产于热带美洲。
      它含有帮助消化蛋白质的木瓜蛋白酶。
      它富含维生素C、β-胡萝卜素和抗氧化物。
      未熟的木瓜在东南亚菜肴中当蔬菜用（如青木瓜沙拉）。
  fruit.guava:
    label: 番石榴
    summary: 一种气味浓郁的热带水果，果肉呈白色或粉色。
    info: |
      番石榴原产于热带美洲，已传播到热带亚洲和非洲。
      它的维生素C含量是橙子的四倍。
      果皮和种子都可食用，整个果实都富含营养。
      番石榴汁和果酱是热带国家受欢迎的产品。
  fruit.pomegranate:
    label: 石榴
    summary: 一种有上千颗甜籽的红色水果，是丰饶的象征。
    info: |
      石榴原产于中亚和地中海地区。
      它含有600多颗被透明红色果肉（假种皮）包裹的种子。
      它富含抗氧化物，研究正在探讨它对心脏和炎症的作用。
      在许多文化中，它象征丰饶和富足。
  fruit.fig:
    label: 无花果
    summary: 一种无花果树结出的梨形水果，甜且多籽。
    info: |
      无花果是最古老的栽培水果之一，其踪迹可追溯到1万1千年前。
      它其实不是果实，而是装满数千朵小花的花托。
      《圣经》故事里亚当和夏娃的无花果叶就是无花果树的叶子。
      无花果干是钙、钾和纤维的极佳来源。
  fruit.date:
    label: 椰枣
    summary: 一种椰枣树结出的甜棕色椭圆形果实，是中东的主食。
    info: |
      椰枣是椰枣树的甜果实。
      数千年来它一直是中东的主食。
      它含糖量超过60%，是突出的能量来源。
      在伊斯兰教中，人们传统上在斋月开斋（伊夫塔尔）时先吃椰枣。
  fruit.melon:
    label: 甜瓜
    summary: 一种大而甜的水果，果肉呈橙、绿或白色。
    info: |
      甜瓜是含水量高的热带至亚热带水果。
      它原产于非洲和亚洲，如今在世界各地种植。
      它90%以上是水分，非常解渴。
      有数百个品种，包括哈密瓜、蜜瓜和加利亚瓜。
  fruit.cantaloupe:
    label: 哈密瓜
    summary: 一种表皮带网纹、果肉深橙的甜瓜。
    info: |
      哈密瓜是原产于亚洲、深受喜爱的甜瓜品种。
      它的名字来自罗马附近教皇的坎塔卢波别墅。
      橙色的果肉富含β-胡萝卜素和维生素A。
      它是最甜的甜瓜品种之一。
  fruit.grapefruit:
    label: 西柚
    summary: 一种大而甜苦的柑橘，是减肥食谱的明星。
    info: |
      西柚是橙子和柚子的杂交品种。
      它于18世纪在巴巴多斯被记载。
      粉色和红色的西柚含有番茄红素和β-胡萝卜素。
      西柚汁会与许多药物相互作用，患者应告知医生。
  fruit.tangerine:
    label: 橘子
    summary: 一种果皮易剥的小甜柑橘，是圣诞节的象征。
    info: |
      橘子是原产于中国、容易剥皮的小柑橘。
      它是中国农历新年和好运的象征。
      在许多国家，它是典型的圣诞水果。
      它含有维生素C、抗氧化物和类黄酮。
  fruit.passion_fruit:
    label: 百香果
    summary: 一种表皮起皱的热带水果，果肉芳香、籽多。
    info: |
      百香果原产于热带南美洲。
      它的名字来自传教士，他们在花中看到了基督受难的象征。
      果肉里满是被芳香凝胶包裹的种子。
      它是维生素C、纤维和抗氧化物的极佳来源。
  fruit.lychee:
    label: 荔枝
    summary: 一种小而红、果肉透明的热带水果，在亚洲深受喜爱。
    info: |
      荔枝是原产于中国的热带水果。
      它粗糙的红色外皮容易剥开，露出透明的白色果肉。
      它味道甜美，香气细腻。
      在中国，它是好运和兴旺的象征。
  fruit.dragon_fruit:
    label: 火龙果
    summary: 一种粉色的热带仙人掌果实，果肉白色带斑点。
    info: |
      火龙果（红龙果）原产于墨西哥和中美洲。
      它鲜艳的粉色外皮和带黑籽的白色果肉非常有装饰性。
      它味道清淡，含有抗氧化物和维生素C。
      人们用它做果汁、冰沙和装饰性甜点。
  fruit.starfruit:
    label: 杨桃
    summary: 一种黄色的热带水果，切开时呈星形。
    info: |
      杨桃原产于南亚和东南亚。
      横切时它会形成完美的星形，英文名starfruit由此而来。
      它味道酸甜，富含维生素C。
      肾病患者因草酸不宜食用。
  fruit.avocado:
    label: 牛油果
    summary: 一种奶油般的热带核果，是鳄梨酱的原料。
    info: |
      牛油果原产于墨西哥和中美洲。
      从植物学上说它是水果（核果），但在烹饪中当蔬菜用。
      它像橄榄油一样含有健康的单不饱和脂肪（油酸）。
      它是全世界流行的健康食品，牛油果吐司是现代咖啡馆文化的象征。
  fruit.persimmon:
    label: 柿子
    summary: 一种像番茄的橙色水果，甜而涩。
    info: |
      柿子原产于中国和日本，也叫kaki。
      未熟的柿子单宁多而涩，成熟后甜如蜜。
      它富含维生素A和C以及矿物质。
      在日本，柿子是传统的秋季水果。
  fruit.mulberry:
    label: 桑葚
    summary: 一种桑树结出的深紫色浆果，是蚕的食物。
    info: |
      桑葚是桑树的果实，桑树的叶子是蚕的食物。
      有白色、红色和黑色的桑葚，黑色最甜。
      历史上，种桑对丝绸生产至关重要。
      桑葚富含白藜芦醇、维生素C和铁。
  fruit.cranberry:
    label: 蔓越莓
    summary: 一种小而红的酸味浆果，是美国的传统食材。
    info: |
      蔓越莓是一种小而酸的红色浆果。
      它是美国感恩节的传统组成部分（蔓越莓酱）。
      它含有原花青素，能阻止大肠杆菌附着在尿道壁上。
      蔓越莓预防尿路感染的作用已获科学证实。
  fruit.gooseberry:
    label: 鹅莓
    summary: 一种小而圆、半透明的浆果，是花园的宠儿。
    info: |
      鹅莓是中欧花园里典型的小型水果。
      有绿色、红色和黄色的品种。
      它富含维生素C。
      鹅莓酒在历史上是深受喜爱的饮品。
  fruit.currant:
    label: 醋栗
    summary: 一种成串生长的小型红、黑或白色浆果。
    info: |
      醋栗是成串生长的小浆果。
      黑醋栗的维生素C含量在所有浆果中最高。
      黑醋栗是黑加仑利口酒和英国饮料Ribena风味的基础。
      红醋栗用于果酱和甜点的装饰。
  fruit.quince:
    label: 榅桲
    summary: 一种与苹果近缘的硬黄色水果，总是煮熟后食用。
    info: |
      榅桲与苹果和梨近缘，生的时候又硬又涩。
      它总是加热加工成榅桲果冻（membrillo）、果酒或白兰地。
      它富含果胶，适合做果酱。
      欧洲有记载的最早的果酱（16世纪）就是用榅桲做的。
  fruit.jackfruit:
    label: 菠萝蜜
    summary: 一种巨大的热带水果，是世界上长在树上的最大果实。
    info: |
      菠萝蜜结出长在树上的最大果实，重量可超过35公斤。
      它原产于热带亚洲，是印度、孟加拉国和泰国的主食。
      未熟的菠萝蜜口感中性，被用作素食的肉类替代品。
      成熟的黄色果肉香甜可口。
  fruit.durian:
    label: 榴莲
    summary: 一种气味强烈、带刺的大型热带水果，是热带水果之王。
    info: |
      榴莲被称为热带水果之王。
      它强烈的气味令一些人反感，却令另一些人着迷，许多亚洲酒店禁止携带。
      果肉奶油般香甜，有杏仁、香草和奶酪般的复杂风味。
      在东南亚，它被视为精致的奢侈品而备受推崇。
  fruit.rambutan:
    label: 红毛丹
    summary: 一种红色多毛的热带水果，与荔枝相似。
    info: |
      红毛丹原产于马来西亚，名字来自马来语rambut，意为头发。
      它红色的外皮上覆盖着柔软的钩状凸起。
      果肉透明香甜，像荔枝一样。
      它富含维生素C和铁。
  fruit.longan:
    label: 龙眼
    summary: 一种小而棕的热带水果，与荔枝近缘。
    info: |
      龙眼是原产于中国的热带树木的果实。
      名字来自中文“龙眼”，因为透明的果肉中有一颗黑籽，像龙的眼睛。
      它味道甜美芳香。
      在中医里，它被视为能补血养心的食物。
  fruit.tamarind:
    label: 罗望子
    summary: 一种果肉酸的棕色荚果，是泰国菜的基础。
    info: |
      罗望子原产于热带非洲，如今在整个热带地区种植。
      果肉又酸又甜，用于泰式炒河粉、伍斯特酱和印度酸辣酱。
      这个词来自阿拉伯语tamr hindi，意为印度椰枣。
      它富含酒石酸、B族维生素和铁。
  fruit.nectarine:
    label: 油桃
    summary: 一种表皮光滑无毛的桃子，多汁香甜。
    info: |
      油桃是桃子表皮光滑的天然变种。
      它与桃子只在决定表皮光滑的基因上不同。
      它味道相似，但质地更紧实。
      名字来自众神的仙露，彰显它所谓的完美。
  fruit.damson:
    label: 达姆森李
    summary: 一种小而色深的李子，是英国乡村花园的典型水果。
    info: |
      达姆森李是一种深蓝黑色的小型李子品种。
      damson这个名字来自大马士革，这种水果由此传入欧洲。
      生食极酸，但做成果酱、蜜饯和金酒（damson gin）却极佳。
      在英国传统中，它自古就有栽培。
  fruit.medlar:
    label: 欧楂
    summary: 一种与苹果近缘的棕色小果，采收后必须后熟。
    info: |
      欧楂是自中世纪起栽培的古老园艺植物。
      它只有在变软（后熟）之后，也就是采收后继续成熟后，才能食用。
      它富含单宁和维生素C。
      莎士比亚在《罗密欧与朱丽叶》中提到过它；如今它更像是园艺爱好者的珍品。
  fruit.ackee:
    label: 阿开木
    summary: 一种红色的热带水果，有可食用的黄色假种皮，是牙买加的国果。
    info: |
      阿开木是牙买加的国果，以布莱船长（1793年）命名。
      只有成熟的黄色假种皮可食用，未熟或过熟的果实有毒（含次甘氨酸A）。
      阿开木配咸鱼是牙买加的国菜。
      它原产于西非，通过奴隶贸易被带到加勒比海地区。
  fruit.feijoa:
    label: 斐济果
    summary: 一种小而椭圆的绿色水果，果肉芳香。
    info: |
      斐济果原产于南美洲。
      它的果肉有菠萝、番石榴和薄荷般的浓郁香味。
      在新西兰，它作为秋季水果非常受欢迎。
      它在欧洲鲜为人知，但在原产国深受喜爱。
