lang: ar
pivot: false
title: الفاكهة
cards:
  fruit.ackee:
    label: الأكي
    summary: فاكهة استوائية حمراء لا يؤكل منها إلا الغلاف الأصفر عند نضجها، وهي رمز جامايكا.
    info: |-
      الأكي (Blighia sapida) الفاكهة الوطنية لجامايكا.
      سُمّيت باسم القبطان بلاي الذي نقلها عام 1793.
      لا يؤكل إلا الغلاف الأصفر الناضج، أما الثمرة غير الناضجة أو الفاسدة فسامّة.
      موطنها غرب أفريقيا، وطبق «الأكي والسمك المملّح» من أشهر أطباق جامايكا.
  fruit.apple:
    label: تفاحة
    summary: فاكهة مستديرة حمراء أو خضراء حلوة أو حامضة.
    info: التفاح ثمرة شجرة التفاح (Malus domestica) ومن أكثر الفواكه زراعة في العالم. غنيّ بفيتامين سي والألياف، وله أكثر من 7500 صنف.
  fruit.apricot:
    label: المشمش
    summary: فاكهة حجرية صغيرة برتقالية حلوة.
    info: |-
      المشمش (Prunus armeniaca) أصله من آسيا الوسطى.
      يُزرع في أنحاء أوروبا، وأحلاه من تركيا وإسبانيا.
      غنيّ بالبيتاكاروتين وفيتامين أ.
      والمشمش المجفّف وجبة خفيفة صحية محبوبة.
  fruit.avocado:
    label: أفوكادو
    summary: فاكهة استوائية كريمية اللبّ ومكوّن أساسي للغواكامولي.
    info: |-
      الأفوكادو (Persea americana) موطنه المكسيك وأمريكا الوسطى.
      هو فاكهة نباتيًّا لكنه يُستخدم في الطبخ كالخضار.
      يحتوي دهونًا أحادية غير مشبعة مفيدة (حمض الأوليك) كزيت الزيتون.
      وخبز الأفوكادو المحمّص رمز لثقافة المقاهي الحديثة.
  fruit.banana:
    label: موز
    summary: فاكهة استوائية صفراء ذات لبّ حلو.
    info: الموز ثمرة نبات من الفصيلة الموزية، غنيّ بالبوتاسيوم والسكريات الطبيعية التي تمنح طاقة سريعة.
  fruit.blackberry:
    label: العُلّيق
    summary: ثمرة مركّبة بنفسجية داكنة تنمو على شجيرات شائكة.
    info: |-
      العُلّيق (Rubus fruticosus) ثمرة مركّبة بنفسجية داكنة تنمو على شجيرات شائكة.
      ينمو بريًّا عند أطراف الغابات والأدغال.
      غنيّ بفيتامين سي والكاروتين ومضادّات الأكسدة المفيدة للقلب.
  fruit.blueberry:
    label: التوت الأزرق
    summary: ثمرة زرقاء بنفسجية داكنة غنية بمضادّات الأكسدة.
    info: |-
      التوت الأزرق غنيّ بمضادّات الأكسدة المعروفة بالأنثوسيانين.
      وهذه الصبغة تمنحه لونه الأزرق الغامق وتأثيره المضادّ للأكسدة القويّ.
      وتشير الدراسات إلى فائدته للذاكرة وصحة القلب.
      والأصناف المزروعة الكبيرة أكبر من الأنواع البرّية الصغيرة في الغابات.
  fruit.cantaloupe:
    label: الكنتالوب
    summary: شمّام ذو قشرة شبكية ولبّ برتقالي.
    info: الكنتالوب (Cucumis melo var. cantalupensis) صنف شمّام شهير. اسمه نسبة إلى قصر كنتالوبو البابويّ قرب روما. لبّه البرتقالي غنيّ بالبيتاكاروتين وفيتامين أ، وهو من أحلى أنواع الشمّام.
  fruit.cherry:
    label: الكرز
    summary: ثمرة حمراء صغيرة مستديرة تنمو في أزواج.
    info: الكرز فاكهة صيفية محبوبة تحتوي مضادّات الأكسدة والميلاتونين. منه أصناف حلوة وأخرى حامضة.
  fruit.coconut:
    label: جوز الهند
    summary: بذرة استوائية كبيرة ذات قشرة ليفية ولبّ أبيض وماء.
    info: |-
      جوز الهند (Cocos nucifera) ليس فاكهة بالمعنى العلميّ بل بذرة (ثمرة حسلة).
      وماء جوز الهند داخل الثمرة غير الناضجة مشروب أيونيّ طبيعيّ.
      حليب جوز الهند وزيته مكوّنان أساسيّان في مطابخ جنوب شرق آسيا والهند.
      وتُسمّى نخلته «شجرة الألف استخدام» لكثرة منافعها.
  fruit.cranberry:
    label: التوت البرّي
    summary: ثمرة حمراء صغيرة حامضة من مطبخ أمريكا التقليديّ.
    info: التوت البرّي (Vaccinium macrocarpon) ثمرة حمراء صغيرة حامضة. يُستخدم تقليديًّا في صلصة عيد الشكر الأمريكيّ. ويحتوي مركّبات تمنع التصاق الجراثيم بجدار المثانة، فيساعد على الوقاية من التهابات المسالك البولية كما أثبتت الدراسات.
  fruit.currant:
    label: الكشمش
    summary: ثمرات صغيرة حمراء أو سوداء أو بيضاء تنمو في عناقيد.
    info: |-
      الكشمش (Ribes) ثمرات صغيرة تنمو في عناقيد، حمراء أو سوداء أو بيضاء.
      وأغناها بفيتامين سي الكشمش الأسود الذي يُصنع منه شراب الكاسيس.
      ويُستخدم الأحمر منه في صنع الهلام وتزيين الحلويات.
  fruit.damson:
    label: البرقوق الدمشقيّ
    summary: برقوق صغير داكن يُزرع في الحدائق.
    info: البرقوق الدمشقيّ صنف برقوق صغير لونه أزرق داكن إلى أسود. اسمه من مدينة دمشق التي عبرت منها الفاكهة إلى أوروبا. حامض جدًّا نيئًا لكنه ممتاز في المربّى ومشروب جِن البرقوق.
  fruit.date:
    label: التمر
    summary: ثمرة نخلة التمر الحلوة البنية البيضاوية.
    info: التمر (Phoenix dactylifera) ثمرة نخلة التمر الحلوة. كان غذاءً أساسيًّا في الشرق الأوسط آلاف السنين. تتجاوز نسبة السكر فيه 60% وهو مصدر معروف للطاقة.
  fruit.dragon_fruit:
    label: فاكهة التنين
    summary: فاكهة صبّار استوائية وردية بلبّ أبيض منقّط بالبذور.
    info: فاكهة التنين (البِتايا، جنس Hylocereus) موطنها المكسيك وأمريكا الوسطى. لها قشرة وردية زاهية ولبّ أبيض منقّط ببذور سوداء، فتبدو زخرفية جدًّا. طعمها لطيف ناعم وتحتوي مضادّات الأكسدة وفيتامين سي.
  fruit.durian:
    label: الدوريان
    summary: فاكهة استوائية كبيرة شائكة قويّة الرائحة تُلقّب بملك الفاكهة.
    info: |-
      الدوريان (Durio zibethinus) يُلقّب بملك الفاكهة.
      رائحته القوية تنفّر كثيرين حتى مُنع في فنادق آسيوية عدّة، لكن يعشقه آخرون.
      لبّه السميك كريميّ حلو بنكهة مركّبة من المكسّرات والفانيليا والجبن.
      ويُعدّ من الأطايب في جنوب شرق آسيا.
  fruit.feijoa:
    label: الفيجوا
    summary: ثمرة خضراء بيضاوية صغيرة ذات لبّ عطريّ.
    info: الفيجوا (Acca sellowiana) موطنها أمريكا الجنوبية. لها رائحة قوية تذكّر بالأناناس والجوافة والنعناع، وهي محبوبة جدًّا في نيوزيلندا في الخريف.
  fruit.fig:
    label: التين
    summary: ثمرة حلوة كثيرة البذور على شكل دمعة من شجرة التين.
    info: التين من أقدم الفواكه المزروعة، وتعود أدلّته إلى نحو عشرة آلاف عام. وهو في الحقيقة ليس ثمرة بل وعاء يضمّ آلاف الأزهار الصغيرة. وورق التين هو ما ستر به آدم وحوّاء في القصة الدينية.
  fruit.gooseberry:
    label: عنب الثعلب
    summary: ثمرة صغيرة مستديرة شبه شفّافة تُزرع كثيرًا في الحدائق.
    info: |-
      عنب الثعلب (Ribes uva-crispa) ثمرة صغيرة شائعة في حدائق وسط أوروبا.
      منه أصناف خضراء وحمراء وصفراء.
      وهو غنيّ بفيتامين سي.
      وكان شرابه محبوبًا منذ القديم.
  fruit.grape:
    label: العنب
    summary: ثمرة صغيرة مستديرة تنمو في عناقيد.
    info: العنب (Vitis vinifera) يُثمر عناقيد بألوان من الأخضر إلى البنفسجيّ الداكن. يؤكل طازجًا أو يُجفّف زبيبًا أو يُعصر خمرًا.
  fruit.grapefruit:
    label: الجريب فروت
    summary: فاكهة حمضية كبيرة مرّة حلوة عالية القيمة الغذائية.
    info: |-
      الجريب فروت (Citrus paradisi) هجين بين البرتقال والبوملي.
      وُصف أول مرة في القرن الثامن عشر في جزيرة بربادوس.
      يحتوي الوردي والأحمر منه على الليكوبين والبيتاكاروتين.
      وعصيره يتفاعل مع أدوية كثيرة، فعلى المريض إخبار طبيبه.
  fruit.guava:
    label: الجوافة
    summary: فاكهة استوائية قوية الرائحة بلبّ أبيض أو ورديّ.
    info: الجوافة (Psidium guajava) موطنها أمريكا الاستوائية وانتشرت في آسيا وأفريقيا المدارية. تحتوي فيتامين سي أكثر من البرتقال. ويؤكل قشرها وبذرها، فهي فاكهة عالية القيمة الغذائية.
  fruit.jackfruit:
    label: ثمرة الجاك
    summary: أكبر فاكهة تنمو على الأشجار في العالم.
    info: ثمرة الجاك موطنها آسيا الاستوائية، وتُؤكل غذاءً أساسيًّا في الهند وبنغلاديش وتايلاند. ولمَّا كانت غير ناضجة يكون طعمها محايدًا، فيستخدمها النباتيّون بديلًا عن اللحم.
  fruit.kiwi:
    label: الكيوي
    summary: ثمرة ذات قشرة بنية زغباء ولبّ أخضر، غنية بالفيتامينات.
    info: الكيوي (Actinidia deliciosa) أصله من الصين حيث يُعرف بعِنَب الثعلب الصينيّ. طوّرته نيوزيلندا تجاريًّا وسمّته باسم طائرها الوطنيّ الكيوي. ويحتوي ضعف ما في البرتقال من فيتامين سي.
  fruit.lemon:
    label: الليمون
    summary: فاكهة حمضية صفراء حامضة عطرية.
    info: الليمون فاكهة حمضية أصلها آسيويّ. غنيّ بفيتامين سي وحمض الستريك. ويُستخدم في الطبخ والمشروبات وكذلك في مستحضرات التجميل والمنظّفات.
  fruit.lime:
    label: الليمون الأخضر
    summary: فاكهة حمضية خضراء صغيرة حامضة.
    info: |-
      الليمون الأخضر (Citrus aurantiifolia) فاكهة حمضية صغيرة خضراء ذات عصير حامض وقشرة عطرة.
      وهو مكوّن أساسيّ في مطابخ المكسيك وتايلاند وفيتنام.
      فيه فيتامين سي أقلّ من الليمون لكن رائحته أقوى.
      وكان يقي البحّارة قديمًا من الإسقربوط.
  fruit.longan:
    label: اللونجان
    summary: فاكهة استوائية صغيرة بنية قريبة من الليتشي.
    info: اللونجان (Dimocarpus longan) ثمرة شجرة استوائية أصلها من الصين. سُمّي «عين التنين» للبّه الشفّاف وبذرته السوداء. طعمه حلو عطريّ، وفي الطبّ التقليديّ يُعدّ غذاءً يقوّي الدم والقلب.
  fruit.lychee:
    label: الليتشي
    summary: فاكهة استوائية حمراء خشنة القشرة بلبّ شفّاف.
    info: |-
      الليتشي (Litchi chinensis) فاكهة استوائية أصلها من الصين.
      تحت قشرتها الحمراء الخشنة لبّ أبيض شبه شفّاف.
      طعمها حلو عطريّ.
      وهي في الصين رمز للسعادة والرخاء.
  fruit.mango:
    label: المانجو
    summary: فاكهة استوائية غنية باللبّ الأصفر البرتقاليّ العصيريّ.
    info: المانجو يُلقّب بملك الفواكه الاستوائية. غنيّ بفيتاميني أ وسي، ويُزرع في جنوب آسيا منذ أكثر من أربعة آلاف عام.
  fruit.medlar:
    label: المِشْمِلة
    summary: فاكهة بنية صغيرة تشبه التفاح لا تؤكل إلا بعد أن تلين بعد القطف.
    info: المِشْمِلة (Mespilus germanica) فاكهة قديمة تُزرع منذ القرون الوسطى. يجب أن تلين بعد القطف حتى تصير صالحة للأكل. غنية بمتعدّدات الفينول وفيتامين سي، وذُكرت في أعمال شكسبير، لكنها اليوم في حدائق الهواة غالبًا.
  fruit.melon:
    label: الشمّام
    summary: فاكهة كبيرة حلوة بلبّ برتقاليّ أو أخضر أو أبيض.
    info: الشمّام (Cucumis melo) فاكهة أصلها من أفريقيا وآسيا وتُزرع في العالم كلّه. نسبة الماء فيه عالية جدًّا فيرطّب الجسم جيّدًا.
  fruit.mulberry:
    label: التوت
    summary: ثمرة داكنة من شجرة التوت وهي غذاء دودة القزّ.
    info: التوت ثمرة شجرة التوت (جنس Morus)، وأحلاه الأسود. ومنه الأبيض والأحمر، وورق التوت غذاء دودة القزّ ودعامة صناعة الحرير.
  fruit.nectarine:
    label: النكتارين
    summary: خوخ أملس القشرة حلو كثير العصير.
    info: النكتارين (Prunus persica var. nucipersica) طفرة طبيعية للخوخ ذات قشرة ملساء. لا يختلف عن الخوخ إلا بخلوّ قشرته من الزغب. طعمه شبيه لكن لبّه أمتن قليلًا، واسمه من «النكتار» شراب الآلهة.
  fruit.orange:
    label: البرتقال
    summary: فاكهة حمضية مستديرة ذات قشرة برتقالية عطرة.
    info: البرتقال فاكهة حمضية أصلها من جنوب شرق آسيا وتُزرع اليوم في العالم كلّه. غنيّ بفيتامين سي ومحبوب عصيرًا.
  fruit.papaya:
    label: البابايا
    summary: فاكهة استوائية كبيرة ذات لبّ برتقاليّ عطر.
    info: البابايا نبات استوائيّ أصله من الأمريكتين. يحتوي إنزيم الباباين الذي يساعد على هضم البروتين. غنيّة بفيتامين سي والبيتاكاروتين ومضادّات الأكسدة، وتُستخدم غير الناضجة كالخضار في مطابخ جنوب شرق آسيا (كسلطة البابايا).
  fruit.passion_fruit:
    label: فاكهة العاطفة
    summary: فاكهة استوائية ذات قشرة أرجوانية متجعّدة ولبّ بذريّ عطر.
    info: فاكهة العاطفة (Passiflora edulis) موطنها أمريكا الاستوائية. اسمها من المبشّرين الذين رأوا في زهرتها رموز آلام المسيح. ولبّها مملوء ببذور مغلّفة بهلام عطر.
  fruit.peach:
    label: الخوخ
    summary: فاكهة حجرية زغباء ورديّة ترمز إلى الصيف.
    info: |-
      الخوخ (Prunus persica) فاكهة أصلها من الصين ورمز للخلود فيها.
      يميّزه جلده الزغبيّ الناعم.
      منه الأبيض والأصفر، والنكتارين صنف أملس منه.
      ويحضر الخوخ في الصين برأس السنة وأساطير الشفاء.
  fruit.pear:
    label: الكمثرى
    summary: فاكهة على شكل دمعة حلوة ناعمة.
    info: الكمثرى ثمرة شجرة قريبة من التفاح. لبّها ناعم كثير العصير وغنيّ بالألياف. ولها مئات الأصناف.
  fruit.persimmon:
    label: الكاكا
    summary: ثمرة برتقالية تشبه الطماطم شديدة الحلاوة عند نضجها.
    info: الكاكا (Diospyros kaki) فاكهة أصلها من الصين واليابان. غير الناضجة قابضة، أما الناضجة فحلوة كالعسل. غنية بفيتاميني أ وسي والمعادن.
  fruit.pineapple:
    label: الأناناس
    summary: فاكهة استوائية ذات قشرة شائكة ولبّ أصفر.
    info: الأناناس موطنه أمريكا الجنوبية ويُزرع الآن في المناطق الاستوائية حول العالم. يحتوي إنزيم البروميلين الذي يساعد على الهضم.
  fruit.plum:
    label: البرقوق
    summary: فاكهة حجرية صغيرة بنفسجية بيضاوية تُصنع منها البراندي.
    info: البرقوق (Prunus domestica) فاكهة أساسية في وسط أوروبا. يُصنع منه مشروب «السليفوفيتز» المقطّر التقليديّ في التشيك وسلوفاكيا، ويُقطف في الخريف.
  fruit.pomegranate:
    label: الرُّمّان
    summary: فاكهة حمراء بمئات البذور الحلوة، رمز للخصوبة.
    info: الرُّمّان (Punica granatum) أصله من آسيا الوسطى وحوض المتوسّط. داخل قشرته الحمراء أكثر من 600 حبّة حمراء شفّافة. غنيّ بمضادّات الأكسدة، وتُدرس فوائده لصحة القلب ومقاومة الالتهاب.
  fruit.quince:
    label: السفرجل
    summary: فاكهة صلبة تشبه التفاح تؤكل مطبوخة عادة.
    info: السفرجل (Cydonia oblonga) قريب من التفاح والكمثرى، وهو صلب حامض نيئًا. يؤكل مطبوخًا دائمًا ويُصنع منه المربّى والخمر. غنيّ بالبكتين المناسب للهلام، وأوّل مربّى مدوّن في أوروبا (القرن السادس عشر) صُنع منه.
  fruit.rambutan:
    label: الرامبوتان
    summary: فاكهة استوائية حمراء مشعّرة قريبة من الليتشي.
    info: |-
      الرامبوتان (Nephelium lappaceum) أصله من ماليزيا، واسمه من كلمة «رامبوت» الماليزية أي الشَّعر.
      له قشرة حمراء مغطّاة بزوائد شعرية لينة.
      لبّه شفّاف حلو يشبه طعم الليتشي.
      وهو غنيّ بالكالسيوم والحديد.
  fruit.raspberry:
    label: توت العُلّيق الأحمر
    summary: ثمرة حمراء مركّبة ترمز إلى صيف الحديقة.
    info: توت العُلّيق الأحمر (Rubus idaeus) ثمرة مركّبة من حبيبات صغيرة كثيرة. ينمو بريًّا ويُزرع، ويُقطف في الصيف والخريف. غنيّ بفيتاميني سي وكي والمنغنيز ومضادّات الأكسدة، ويُصنع منه المربّى والشراب كثيرًا.
  fruit.starfruit:
    label: فاكهة النجمة
    summary: فاكهة استوائية صفراء تصير نجمة عند تقطيعها.
    info: فاكهة النجمة (Averrhoa carambola) موطنها جنوب وجنوب شرق آسيا. تُقطع عرضيًّا فتظهر بشكل نجمة كامل، ومن ثمّ اسمها. طعمها حلو حامض منعش وغنية بفيتامين سي. وعلى مرضى الكلى تجنّبها لاحتوائها حمض الأكساليك.
  fruit.strawberry:
    label: الفراولة
    summary: ثمرة حمراء على شكل قلب ببذور على سطحها.
    info: الفراولة فاكهة محبوبة من الفصيلة الوردية غنية بفيتامين سي ومضادّات الأكسدة. تُقطف في الصيف وهي حلوة عطرة.
  fruit.tamarind:
    label: التمر الهنديّ
    summary: لبّ بنّي حامض داخل قرن، مكوّن أساسيّ في المطبخ التايلانديّ.
    info: التمر الهنديّ (Tamarindus indica) موطنه أفريقيا الاستوائية ويُزرع اليوم في المناطق الدافئة. لبّه شديد الحموضة والحلاوة يُستخدم في «الباد تاي» وصلصة ورسيستر والتشاتني الهنديّ. واسمه من العربية بمعنى «تمر الهند».
  fruit.tangerine:
    label: اليوسُفي
    summary: حمضيّة صغيرة حلوة سهلة التقشير تُؤكل في الأعياد.
    info: |-
      اليوسُفي (Citrus reticulata) حمضيّة صغيرة أصلها من الصين سهلة التقشير.
      وهي رمز رأس السنة الصينية والحظّ الطيّب.
      وفي أوروبا فاكهة عيد الميلاد بامتياز.
      ويحتوي فيتامين سي ومضادّات الأكسدة والفلافونويد.
  fruit.watermelon:
    label: البطيخ
    summary: فاكهة كبيرة مخطّطة بالأخضر بلبّ أحمر وبذور سوداء.
    info: البطيخ فاكهة صيفية محبوبة أصلها من أفريقيا. نسبته 92% ماء ويحتوي صبغة الليكوبين الحمراء.
