lang: ar
pivot: false
title: الفاكهة
cards:
  fruit.ackee:
    label: أكيه
    summary: فاكهة حمراء استوائية تحتوي على عروق ذهبية قابلة للأكل وهي تصنّف كواحد من رمزيات جمايكا.
    info: يُعرف الأكيه أو فاكهة أكاي ((Blighia sapيدا)) بأنها الفاكهة الوطنية لجامايكا، وقد سميت باسم القبطان بلغ في عام ١٧٩٣م؛ فقط الناضجة ذات اللون الذهبي هي آكلة بينما الثمار غير ناضجة أو متعفنة قد تكون سامة بسبب احتوائها على المركب 'الهيبروغليكين أي'. وطبق 'الأكيه مع السمسم' هو طبق جامائكي شعبي يحظى بشهرة كبيرة.
  fruit.apple:
    label: تفاحة
    summary: فاكهة حمراء أو خضراء على شكل دائري ذات طعم حلو وحامض.
    info: التفاح هو ثمرة تنتج عن شجرة التفاح، وهي واحدة من أكثر المحاصيل زراعة في العالم. تحتوي على فيتامين سي والألياف؛ وهناك أكثر من 7500 نوع مختلف.
  fruit.apricot:
    label: مرونكة
    summary: ثمرة برتقالية صغير الحجم، ذات نكهة حلوة ومقدّرة.
    info: '{"hint":"فاكهة حجرية صغيرة اللون البرتقالي (البرقوق الأرمني)","info":"تنتج المرونية (Pruinus Armenica) من آسيا الوسطى\np تُزرع في التشيك وفي جميع أنحاء أوروبا؛ فإن أكثرها طراً يأتِيان من تركيا وإسبانيا\nt غذاءٍ غني بالبيتا كاروتين والفيتامين A\ns يتم جفافها ويكون محببًا لدى الناس على أنه وجبة خفيفة صحية","label":"مرونكة","summary":"ثمرة برتقالية صغير الحجم، ذات نكهة حلوة ومقدّرة."}'
  fruit.avocado:
    label: أفوكادو
    summary: فاكهة استوائية ذات لحم خضر فاتح؛ مكون أساسي للغواتيمول.
    info: يأتي الأفوكادو من المكسيك وأمريكا الوسطى، وهو نباتياً نوعاً من الفواكه ولكن يتم استخدامه في الطهي كخضروات. يحتوي على دهون أحادية غير مشبعة صحية مثل حمض الأوليك كما هو الحال مع زيت الزيتون.
  fruit.banana:
    label: موز
    summary: فاكهة مدارية صفراء ذات لب حلو.
    info: الموز هو ثمرة نباتي من عائلة الموزيات، وهو غني بالبوتاسيوم والسكريات الطبيعية التي توفر طاقة سريعة.
  fruit.blackberry:
    label: التُّوْطِنَان
    summary: ثمرتان برتقاليتان ناضجان يشبهان بعضهما البعض.
    info: '{"hint":"فاكهة بنفسجية داكنة إلى سوداء من نوع Rubus fruticosus","info":"التوت الأسود أو التوت البري هو ثمرة بنفسجي داكن تنمو على شجيرات مزروعة في الغابات والمناطق المفتوحة، وتحتوي هذه الثمار على كميات عالية من الفيتامين سي وج والألياف الغذائية."}'
  fruit.blueberry:
    label: التُوت
    summary: فاكهة أرجوانية داكنة؛ طعام ممتاز مليء بالعناصر المضادة للأكسدة.
    info: التوت الأزرق الداكن غني بمضادات الأكسدة، وهو مصدر للأنثوسيانينات التي تمنحه لونه وخصائص مضادة للأوكسدة قوية وتظهر الدراسات فائدته في الوظائف الإدراكية والصحة القلبية.
  fruit.cantaloupe:
    label: كنتالوب
    summary: بطيخ بلغة الشبكة بألوان صفراء وبنيّة مع لحم داخلي أحمر جذاب.
    info: '{"hint":"خوخ مقطوع الأورانج فلشس (كوسوسيز مليو فيار كانتالوبينسينيس)","info":"كانتالوب (كوزوسيز مليو فيار كانتالوبينسينيس) هو نوع شائع من البطيخ ينحدر من آسيا\nيرد اسمه إلى قصر الكنيسة البابوية كانتالوبو بالقرب من روما\nحبيبات اللون البرتقالي غنية بـ β-carotene وفيتامين أ\nإنه أحد أنواع البطيخ الأكثر حلاوة."}'
  fruit.cherry:
    label: تريشني
    summary: فاكهة حمراء دائرية صغيرة تنمو في زوجين.
    info: الترشي هو ثمرة التفاح الطيور، وهو نوع شائع من الفواكه الصيفية. يحتوي على مضادات الأكسدة والميلاتونين؛ وهناك أنواع حلوة ونوعان لاذعان (مثل الكرز).
  fruit.coconut:
    label: جوز الهند
    summary: بذرة مدارية كبيرة ذات غلاف سميك وأبيض.
    info: '{"hint":"بذرة مدارية كبيرة مع قشرة خشنة وصلبة (كوكوس نوسيفيرا)","info":"الجوز الهند أو الكاكاو هو ثمرة شجرة الجوز الهندي؛ علميًا، فهو بذر وليس حلوى ولكن كتلة صلدة.<br>ماء جوز الهند داخل الثمار غير الناضجة يُعتبر مشروب أيونات طبيعي。<br>حليب وماء جوز الهند هما أساس المطبخ الجنوبي الشرقي والهندي.<br>تشير إلى أن شجرة الجوز الهند تعرف باسم "شجرة الحياة"."}'
  fruit.cranberry:
    label: '"فراولة البرتق"'
    summary: ثمرة حلوى حامضة صفراء؛ جزءٌ أصيل من الطبقات الجانبية الأمريكية.
    info: '{"info":"البرقوق الأحمر الصغير هو ثمرة حمضية صغيرة تُستخدم تقليديًا كأطباق جانبية في عيد الشكر الأمريكي، وتحتوي على مركبات Proanthocyanidins التي تمنع ارتباط البكتيريا مثل الإشريكية القولونية بجدران المجاري البولية، كما أن هناك فائدة علميّة مؤكَّد للفراولة الحماسية من حيث الوقاية من العدوى المسالية."}'
  fruit.currant:
    label: ربيس
    summary: فاكهة حمضة صغير بيضاء أو سوداء أو حمراء توجد ضمن عنقود.
    info: الرُّيبِس ينمو كأعشاب صغيرة في عناقيد متشابكة، والريبيس الأسود هو أعلى مصدر لفيتامين سي بين جميع أنواع الفواكه الحمضية الصغيرة. كما أنه المكون الأساسي للنكهة المعروفة باسم 'ريبينا' وهي مشروب بريطاني شهير ولللكيورا الكاسيس.
  fruit.damson:
    label: تين ديامسون
    summary: ثمرة صغيرة سوداء شائعة بالحدائق الصيفية البريطانية.
    info: '{"hint":"صغير أزرق داكن إلى أسود متنوعة من التين","info":"تين دمشق هو نوع صغير بلون الأزرق الداكن أو البني، يُعرف أيضًا باسم تين الديمسن. اسمه مشتق من مدينة حلب في سوريا حيث انتقلت الفاكهة لأوروبا عبر التجارة القديمة. وهو لاذع جدًّا عند استعماله نيئًا لكنه رائع كجزء من المربى والحلوى ومشروب الجِنز (الجنه). كما أنه معروف تاريخيًا بأنه أحد محاصيل الزراعة التقليدية الإنجليزية."}'
  fruit.date:
    label: تمر
    summary: فاكهة بنيه بيضاوية الشكل تنتج عن النخل الحلو؛ أساسية جداً لثقافة الغذاء بالشرق الأوسط.
    info: الدَّتْلِيُو هي فاكهة حلوة من نخيل التمر، وهي مصدر غذاء أساسي في الشرق الأوسط منذ آلاف السنين. تحتوي على أكثر من ٦٠٪ سكر وتعتبر مصدراً هاماً للطاقة.
  fruit.dragon_fruit:
    label: فاكهة التنين
    summary: ثمرة كاتس مشمسة ذات لون روز قوية مع هاجنة بيضا
    info: فاكهة التنين أو فاكهية الهيلوكريوس تأتي من المكسيك وأمريكا الوسطى، وتشتهر بجلدها الوردي النابض وبهاجتها البيضاء التي تحتوي على حبوب سوداء صغيرة مما يجعلها جذابة بصرياً جداً. لها طعم ناعم وتتميز بأنها غنية بالأنتي أكسيدانты وفيتامين سي.
  fruit.durian:
    label: DURIAN
    summary: فاكهة دافئة كبيرة الشوك مع عطر شديد.
    info: الدوريان هو نوع من الفواكه المدارية المعروف باسم ملك فاكهة المناطق الحارة، وله رائحة قوية تثير التعجب البعض ويحبها الآخرون؛ كما أنه محظور في العديد من فنادق آسيا لرائحته القوية جداً. طعم اللب الكريمي حلو ومعقد يحمل نكاحات مثل الجوز والفانيلا والجبن.
  fruit.feijoa:
    label: الفاكيات
    summary: فاكهة صغيرة مستديرة الشكل ذات لب عاطر.
    info: '{"hint":"فاكهة خضراء بيضاوية الرائحة العطرة (أوكا سيللووانيانا)","info":"فيجويا (أوكا سيولويانايا، أو فيجوا سيولوييانايا)، تأتي من أمريكا الجنوبية\ندلتها الداخلية لها طعم عطري قوي جدًا (أناناس وغواتينا ومحلول المنثول). \نإنها شهيرة جداً على نيوزلندا كفاكهة الخريف.\نغير معروفة كثيرًا بأوروبا ولكن محبوبة ببلدان أصلها."}'
  fruit.fig:
    label: '"تِين"'
    summary: '"فاكهة على شكل الكمثرى من نبات البقوليات؛ لذيذة ومغنية بالبذور"'
    info: "{\"info\":\"الفك هو أحد أقدم الفواكه المزروعة؛ توجد أدلة تمتد إلى ما قبل ١٠ آلاف عام.\r\nفي الواقع، فإنه ليس ثمرة بل حاوية مملوءة بألفي زهر صغير\r\nورق آدم وحواء في القصة الكتابية هي ورق فاكهة التين.\r\nالتين المجفف مصدر جيد لل كالسيوم والبوتاسيوم والألياف.\"}"
  fruit.gooseberry:
    label: '"أنجراش"'
    summary: ثمار مستديرة صغيره شفافه تستخدم كثيرا في الزراعه.
    info: '{"hint":"كُرَّة خضراء أو حمراء شفافة صغيرة (الريبيس أوفا كريسفا)","info":"إن الأنجراشت (Ripbus Ribus Crispum) هو نوع من الفواكه الصغيرة الشائعة في الحدائق المتوسطية الإوروبية، ويوجد بثلاث أنواع رئيسية؛ الخضروات والتوت والأحمرة. كما أنه غني جدًا بالفيتامين سي. وشراب الكرين المصنوع منه كان مشروبًا محببًا تاريخيًّا."}'
  fruit.grape:
    label: عنب
    summary: ثمرة صغيرة دائرية تنمو في عناقيد على ساق.
    info: ينتج العُنب عنقودًا بألوان متنوعة - من الأخضر إلى البنفسجي الداكن. يمكن أكله طازجًا، أو تجفيفه لصنع التمر المجفف أو ضغطه للحصول على الخمر.
  fruit.grapefruit:
    label: '"جريب فروت"'
    summary: ثمرة سيترس ذات طعم مرّ ومليحة، وتتميز بأن لها خصائص غذائية عالية.
    info: "{\"hint\":\"فاكهة حمضية كبيرة الحجم تُعرف بمذاقها المر والحلو (Citrus paradisi)\",\"info\":\"الجريبفروت أو الجرماز هو نبات هجين ينتج عن التزاوج بين البرتقالي الأحمر والأومело.\r\nتم وصفه لأول مرة في القرن الثامن عشر على جزر باربادوس\r\nتحتوي أنواع الجريب فروت الوردي والحمرة منها على مادة الليcopene وفيتو كرتين.\r\nيمكن لعصير الجريب فروت أن يؤثر بشكل سلبي مع العديد من العلاجات؛ لذلك يجب إبلاغ الطبيب.\"}"
  fruit.guava:
    label: جواف
    summary: ثمرة استوائية ذات رائحة قوية ولحم أبيض أو فاتح.
    info: تنتج الجوافة من أمريكا الاستوائية وانتشر استخدامها في آسيا وأفريقيا المدارية، وهي تحتوي على أربع مرات أكثر من فيتامين سي بالمقارنة مع البرتقان. يمكن تناول القشر والبذور؛ فالفاكهة بأكملها غذاء صحي.
  fruit.jackfruit:
    label: خَبْزة
    summary: ثمرة استوائيّة ضخمّة؛ هي أضخم فواكه الشجر العالم.
    info: |-
      يُنتج شجرة الخبز (أرتوكاربوس هيتروفيلاوس) أكبر ثمار ناضجة على الأشجار؛ حيث يمكن أن تصل وزنها إلى أكثر من ٣٥ كجم.
      it ينمو في آسيا الاستوائية، ويعتبر غذاءً أساسيًا في الهند وبانغلاديش وتايلند.
      The الثمرة غير الناضجة لجاكفراوت لها ملمس طبيعي ويمكن استخدامها كبديل للحوم النباتية.
  fruit.kiwi:
    label: كيوي
    summary: ثمرة براشقة خضراء غنية بالفيتامينات.
    info: '{"hint":"فاكهة بنية صغيرة مغطاة بالشعر مع لب أخضر زاهٍ (أكتينيديا ديليسiosa)","info":"الكيوي هو فاكهة تأتي من الصين حيث يُعرف باسم اليانج تاو أو التوت الصيني\nنيوزلندا هي التي جعلته شائعًا واستخدمت اسم الكيوو وهو الطائر الوطني هناك\نتحتوي الفواكه على ضعف فيتامين سي أكثر مما يوجد في البرتقالي\نلبها الأخضر الزاهِر، وهناك أنواع ذهبية أيضًا","label":"كيوي","summary":"ثمرة براشقة خضراء غنية بالفيتامينات."}'
  fruit.lemon:
    label: ليمون
    summary: ثمرة حمضية صفراء؛ مصدر لفيتامين سي والأعطر.
    info: الليمون هو ثمرة حمضية من فصيلة الحمضيات أصلها آسيوي، وهو غني بفيتامين سي وحمض الستريك ويستخدم في المطبخ والمشروبات والعناية بالبشرة وفي المنظفات.
  fruit.lime:
    label: '"Lemon Green"'
    summary: ثمرة ليمونة أخضر صغيرة؛ أحد أهم عناصر الطهي الاستوائي.
    info: |-
      {"hint":"فاكهة حمضية خضراء صغيرة من فصيلة اليوسفيات (Citrus aurantiifolia)","info":"الليمون الأخضر هو نوع صغير من الفواكه الحمضية الخضراوية ذات العصير الحمضي والقشرة الرائحة.
      هو مكون أساسي في المطبخ المكسيكي والتايلاندي وفيتنامي.
      يحتوي على كمية أقل من فيتامين سي بالمقارنة مع البرتقالي، لكن له رائحة قوية.
      تناوله يحمي الأشخاص الذين يعملون تحت البحر ضد الأمراض الناشئة عن نقص فيتامين سي."}
  fruit.longan:
    label: 롱ان
    summary: ثمرة صغيرة بنية اللون ذات علاقة مع الثمار الاستوائية مثل ليتشي
    info: |-
      اللُونْغَان هو ثمرة استوائية تشبه الليمِّي، تنتمي إلى شجرة مستوردة من الصين
      اسمها مشتق من اللغة الصينية 'لون ين' أي عين التنين نسبةً لشفافيتها ووجود بذرة سوداء داخلها
      إن مذاقها حلو ومليء بالرائحة العطرة
  fruit.lychee:
    label: '"لِيتْشي"'
    summary: ثمرة صغيره حمراء دافئة مع أنسجة الشفافية؛ يحب الأسيوية.
    info: '{"hint":"فاكهة استوائية حمراء صغيرة بجلد خشن وเนื้واشفاف (Lychee sinense)","info":"الليتشي هو ثمرة مدارية تأتي من الصين، ولها قشرة أحمر خشنة يمكن فتحها لتكشف عن جسد أبيض شفاف. لها طعم حلوي عطري ناعم. في الصين هي رمز للسعادة والرخاء."}'
  fruit.mango:
    label: مَنْغُو
    summary: ثمرة استوائية ذات لب أصفر برتقالي عصير.
    info: يُعرف المانجو باسم "ملك الفواكه الاستوائية"، وهو غني بفيتامينات A وC ويأتي من جنوب آسيا حيث يزرع منذ أكثر من ٤٠٠٠ عام.
  fruit.medlar:
    label: ميسبيلوس
    summary: ثمرة صغيرة بنية اللون مرتبطة بالتفاح؛ تحتاج إلى النضوج قبل الاستهلاك.
    info: التوت الأحمر هو ثمرة قديمة تُزرع منذ العصور الوسطى، ونوع من أنواع الفاكهة المزروعة في الحدائق. يمكن أكلها فقط بعد التخمير أو الانتظار حتى تنضج وتلين بعد حصادها مباشرةً. تحتوي على كميات كبيرة من البكتين وفيتامين ج.
  fruit.melon:
    label: '"ميو"'
    summary: ثمرة حلوة كبيرة ذات قلب برتقالي أو أخضر.
    info: '{"hint":"فاكهة دائرية أو بيضاوية كبيرة مع لب أصفر أو خضري (Cucumis ميلو)","info":"البطيخ (Cucumis ميلو هو ثمرة استوائية إلى نصف الاستواء تحتوي على نسبة عالية من الماء\nأصلها إفريقي وآسيوي؛ اليوم تُزرع في جميع أنحاء العالم\نتحتوي على أكثر من ٩٠٪ ماء وهي مصدر جيد للترطيب\nهناك مئات الأصناف مثل بطيخ كنتا، هونيديュー، غاليا، شارانتاي وغيرها."}'
  fruit.mulberry:
    label: موروش
    summary: ثمرتٌ طويلة داكِنة اللَّون نابتة على فروع شجيرة الموروس.
    info: '{"hint":"الثمرة الداكنة الطويلة من شجرة الموروس","info":"الموروشات هي ثمار تُنتجها أشجار موروس؛ وتنمو على الأغصان، وتكون حلوّة جداً خاصة عندما تكون سوداء اللون. كما أن زراعة هذه الشجر كانت مهمة في صناعتي الحرير والقطيفة سابقاً."}'
  fruit.nectarine:
    label: نيكتاري
    summary: تفاحة سكرية بدون شعر على جسدها؛ غنية بالعصارة والحلو.
    info: |-
      {"hint":"نوع تفاح ملساء الجلد (البرقوق السكري من نوع Prunus persica var. nucipersica)","info":"نيكتارينكا هي طفرة طبيعية في البرقوق ذات قشر ناعم،
      تختلف عن البرقاق فقط بجين يتحكم في خفة القشر الخارجي؛ لديها نفس الطعم ولكن تركيبًا أكثر صلابة.
      اسمها مشتق من العسل الإلهي ويشير إلى الكمال المتصور لها."}
  fruit.orange:
    label: برتقال
    summary: فاكهة حمضية دائرية مع قشرة برتقالية عطرة.
    info: البرتقالي هو ثمرة حمضية أصلها آسيا جنوب شرق، وينمو اليوم في جميع أنحاء العالم. وهو غني بفيتامين سي ويُستخدم بكثرة كعصير.
  fruit.papaya:
    label: بابةيا
    summary: ثمرة حلوية كبيرة الحجم ذات قشر أخضر داكناً.
    info: '{"hint":"فاكهة استوائية كبرى مصفرة اللون (البابايا)، "info": "تُنتج البايافا من أمريكا الاستوائية، وتحتوي على إنزيم يسمّى بابين وهو ما يساعد في هضم البروتينات. كما أنها غنية بالفيتامين سي والكاروتين وأجسام مضادة للاكسدة."}'
  fruit.passion_fruit:
    label: '"المَعْضِلة"'
    summary: فاكهة استوائية تتميز بلب فاخر وقشور بنفاثجة مع حبيبات البذرة العطرية.
    info: |-
      {"hint":"فاكهة من النباتات الطحلية ذات القشرة البنفسجية التجاعيد (الباشوفلورا إديوليس)","info":"تُنتج المَعذِّبة أو الباشوفلورا الإيديوليسيس في أمريكا الجنوبية الاستوائية،
      ويأتي اسمها من الرهبان الذين رأوا في زهرتها رموزًا لتعاسة المسيح.
      تحتوي ثمار هذه الشجرة على بذور كثيرة مغلفة داخل جيل عطري.
      إنها مصدر رائع للفيتامين سي والألياف والعناصر الغذائية الأخرى."}
  fruit.peach:
    label: خوخ
    summary: ثمرة خوخية ذات لون ذهبي فاتح إلى الوردي ترمز للموسم الصيفي.
    info: '{"hint":"فاكهة حلوة مغطاة بขน أصفر ووردي ناعم"، "info": "تبدأ قصة الخوخ الصيني من الصين حيث يُعتبر رمزًا للخلود\nThe soft velvet skin is characteristic for it\. There exist white varieties and also yellow ones؛ النكتارين هو نوع صافٍ بدون شعر على الإطلاق\In China، peach fruits play an important role during New Year celebrations alongside medicinal myths."}'
  fruit.pear:
    label: "\U0001F350 الكمثرى"
    summary: ثمرة على شكل دمعة ذات طعم حلو وناعم.
    info: الكمثرى هي ثمرة الشجرة الكمثرية، وهي قريبة من التفاح. لها لب ناعم ومليء بالعصير وغنية بالألياف؛ وهناك مئات الأصناف المختلفة.
  fruit.persimmon:
    label: توميل
    summary: ثمرة برتقالية الشكل مشابة للطماطم؛ طيبة العطر.
    info: |-
      يأتي التوميل من الصين واليابان؛ ويُعرف في التشيك باسم توميل اليابانية
      التوميل غير الناضج حمضي وقاس، بينما يصبح ناعمًا ومليح الطعم كعسل النحل عند النضوج
      ويحتوى على الفيتامينات أ وج والعناصر المعدنية
  fruit.pineapple:
    label: أناناس
    summary: ثمرة استوائية ذات تاج شائك وحشوة صفراء.
    info: يأتي الأناناس من أمريكا الجنوبية ويُزرع الآن في المناطق الاستوائية حول العالم. يحتوي على إنزيم برومليين، الذي يساعد في الهضم.
  fruit.plum:
    label: شستكا
    summary: فاكهة حجرية بنغمة البنفسجي؛ مكون أساسي في إنتاج شراب العرقوسي وحلوى الشتاء.
    info: '{"info":"العَرْقُوسِيّة"}'
  fruit.pomegranate:
    label: "\U0001F347 العنب الأحمر"
    summary: ثمرة حمراء تحتوي آلاف البذور المغطاة بالمذاق اللذيذ.
    info: '{"ary": "العنب الأحمر يحتوي على أكثر من ٦٠٠ بذرة في لحمه الشفاف والأحمر، وهو غني بالمضادات الحيوية؛ تُجري الدراسات أبحاثًا حول تأثيراته الإيجابية على القلب والالتهابات."}'
  fruit.quince:
    label: '{\"kdole\"'
    summary: ثمرة زرقاء قوية الرائحة مرتبطة بالتفاحة وتؤكل فقط بعد المعالجة الحرارية.
    info: '{"\ud80c\udd74": "الفاكهة الصفراء الصلبة العطرة (سيدونيا أوبونغوا)", "info": "{\"kdole\" (cydonia oblonga)} هي قريب من التفاح والكمثرى؛ وهي صلدة وقاسية عند تناولها خامّة دائمًا يتم معالجتها حراريًّا مثل الجيلي المصنوع منها، أو الخمر الناتج عنها، أو الكحول المنتَجه منه. تحتوي على كمية كبيرة من البكتين المناسب لصنع الأطعمة اللزجة. أول مربٍ سجل في أوروبا منذ القرن السادس عشر كان يُنتجه باستخدام هذه الفاكهة."}'
  fruit.rambutan:
    label: رامبوتان
    summary: ثمرة مُحْمَرة شعرية مشبّعة بفيتامين سي والحديد.
    info: الرامبوتان هو نوع من الفواكه المدارية الحمراء والغنية بالشعر، يشبه الليتشي؛ تأتي التسمية منه اللغة المالاوية حيث تعني 'رموط' الشعر. ثمرة الراموتان حلوة وشفافة مثل الثمار الأخرى المشابهة لها.
  fruit.raspberry:
    label: '"فراولة"'
    summary: '"ثمرة كرزية حمراء؛ رمز للصيف في الحديقة."'
    info: '{"hint":"فاكهة حمراء صغيرة مكونة من ثمار فرعية (الرُّبَس إيديوس)","info":"الفراولة الحمراء (Rubus idaeus) هي نوع من الفواكه المركبة تتكوّن من العديد من الثِّمارات الصغيرة (دروبلت).\nتنمو بشكل طبيعى أو زراعي؛ وتؤخذ محصولها في الصيف وفي الخريف.\nتحتوي على نسبة عالية من فيتامينات سي وكي، والمنغنيز وأجسام مضادة للأكسدة.\nيعتبر الجيلي وجوز الهند المر من العناصر الغذائية التقليدية."}'
  fruit.starfruit:
    label: كاريماندول
    summary: فاكهة صفراء استوائية تتكون منها نجوم صغيرة عندما يتم تقطيعها.
    info: الكاريمندولا أو الكارامبولا تأتي من جنوب آسيا وجنوبيها الشرقيين، وهي فاكهة مغذية تحتوي على فيتامين سي وتتميز بمذاق حلو ومُرّ قليلاً؛ كما أن شكلها النجمي يظهر عند تقطيع الفاكهة عرضياً أفقياً. ومع ذلك فإن الأشخاص المصابون بأمراض الكلية يجب ألا يستهلكوها بسبب احتوائها على نسبة عالية من Oxalic acid.
  fruit.strawberry:
    label: فراولة
    summary: ثمرة حمراء شبيهة بالقلب غنية بالعصير.
    info: الفراولة هي ثمرة محبوبة تنتمي إلى عائلة الوردية. تحتوي على فيتامين C ومضادات الأكسدة؛ تُحصد في الصيف وهي ذات طعم حلو ومميزة برائحتها الجذابة.
  fruit.tamarind:
    label: tamari
    summary: ثمرة ذات قشر بنى ولها نكهة خفيفة ومليئة بالأعشاب.
    info: '{"hint":"بذرة بنيّة تحتوي على لحم حمضي (تامارينديس إنديكا)","info":"يأتي التمر الهندي من أفريقيا المدارية؛ ويزرع اليوم في جميع أنحاء العالم الاستوائي.\nlحومه الحمضية والحلوة تُستخدم في طبق الفاه تاي، صلصة Worcestershire، وفي عجينة التشاتني الهندية.\nalكلمة مشتقَّة من اللغة العربية: تمْر هِندِي=تمرٌ مأخوذ من الهند.\nالتمري هو غنى بالחומض الأمينيون مثل البوتاسيوم والأحماض العضوية، وبفيتامين بي وجديد."}'
  fruit.tangerine:
    label: '"مانيارينكيا"'
    summary: فاكة صغيرة ذات طعم لطيف مع قشور سهلة التفكيك؛ رمز للعيد.
    info: "{\"hint\":\"برتقال مُرَنِّح حلو ذو قشرة هلامية (Citrus reticulata)\",\"info\":\"المنارينكا أو البرتقالي المرنيح (Citrus reticulate)، هو نوع صغير من الحمضيات يسهل تقشيره، أصله الصيني.\r\nيرمز إلى عيد السنة الجديدة في الثقافة الصينية ويعني السعادة والحظ الجميل\r\nوهو أحد الفواكه الشتوية التقليدية التي ترتبط بعيد الميلاد لدى التشيك.\r\nويحتوى على فيتامين سي وأحماض فلافونويدات مضادة للأكسدة.\"}"
  fruit.watermelon:
    label: ميوه ماء
    summary: فاكهة كبيرة ذات شرائط خضراء مع لب أحمر عصير.
    info: تُنتج مِنها المِياه فاكهة الأصلي أفريقية وهي من الفواكه الصيفية الشهيرة، تتكوّن بنسبة ٩٢% من الماء وتحتوي على الليكوبيف، وهو ما يمنحها اللون الأحمر.
