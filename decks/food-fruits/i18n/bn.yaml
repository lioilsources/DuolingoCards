lang: bn
pivot: false
title: ফল
cards:
  fruit.ackee:
    label: আকি
    summary: একটি ঠাণ্ডা ঝুলে ফল সঙ্গে edible পীত বীজ ; জামেইয়ার্কার নৈতিসহ ফল
    info: "'আকি' জামেইয়ার্কার নৈতিসহ ফল। 'ব্লিগসপদন'-এর এটি বৃষণমধ্যে পড়ছে।\nফলগুলি শোধ হওয়া অথবা খুব ভাঙচূর থাকলে তা দৌর্ঘ্যজনক ('হাইপোগ্লাইসিন আ')। \nঅখে ও ছাট চাষ - জামেইয়ার্কার ধ্বনিসহ ডশ\nউৎপত্তি উত্তর আফ্রিকার এবং ক্রীতদাস ব্যবসার মাধ্যমে ক্যারিবিয়ান ঢুকেছে"
  fruit.apple:
    label: jablko
    summary: গোল লাল বা সবুজ ফল যার গন্ধযুক্ত খাওয়ার মিষ্টি চূনে আস্বাদ।
    info: এপেলটি হলো এমান ডমেস্টিকা প্রজাতির জাইভফল এবং পৃথিবীতে অধিক চাষ করা ফসলগুলির মধ্যে একটি। এটি ভিটামিন সি এবং ফাইবার ধারণ করে; 7500 এরও বেশি উপপ্রজাতি রয়েছে।
  fruit.apricot:
    label: আপেলফলা
    summary: অথবা ফল আঙ্খি লাভ ঘটাঃ টক ডই ধরন
    info: |-
      মেরুনিকা মধ্য এশিয়ায় উৎপাদিত।
      এটি চেক প্রজাতন্ত্রও সহ ইউরোপের বড়দস্থলভূমি জীবনচ্ছেদ হতেছে;
      turkey ও spain গণনা নখদেশগুলি অধিক শৈষ্ণৱ।
  fruit.avocado:
    label: অ্যাওকাটো
    summary: খাইজানো খাবার ঝাঙ্গা
    info: |-
      আবুকাদা মেক্সিকো এবং পশ্চিম আমেরিকা'য় উৎপন্ন।
      এটি গতিশীলভাবে ফল হওয়াসহ রন্ধনে তথা 'গুয়াকালমোল'-এর জন্য অধিক ঘন ভাণ্ডার ছড়াছড়ি থাকে।
  fruit.banana:
    label: ব্যাঙনা
    summary: একটি সুস্বাদু পেঁয়জা করা মধ্যদেশীয় ফল।
    info: ব্যাঙনা হল এমূল গোত্রের উষ্ণক্ষুদি উভচর উদ্ভিদের ফল। এটি পটাশিয়াম ও আপেল চিনি থেকে তাড়াহুড়ো ছাড়াই শক্তি ধরে রাখে।
  fruit.blackberry:
    label: blackberry
    summary: অধিকাংশ ঢঙা কাঙাণ রঙের এক ধরনের বেরি
    info: |-
      ব্লাকবেরি হলো Rubus Fruticosus গছনা থেকে উৎপন্ন।
      এটিতে ভিটামিনসি, জি এবং ফাইবার প্যাচতে বড়দশখম
      ফজগণ সহজেই খয়ের ধাওয়া আউট অথচ শুষ্ঠভাষা দ্বারা ঘরেও ছী ঝাড়া হয়।
  fruit.blueberry:
    label: blueberry
    summary: অধিক ডাঙ্গা সবুজ রঙের ঝড়ফুল ফল; অ্যান্টি঑ক্সিডেন্ট সমৃদ্ধ সুপারফুড।
    info: বেরি গাছগুলিতে Vaccinium myrtillus বন্যা এবং V. corymbosum কৃষি। অ্যানথোসাইয়ানইন পদার্থটি সমতুল্লভ মহাদেশের আকর্ষণপূর্ণ ফলের জন্য উচ্চ শক্তি ও ঘন হরউজল ধরনের টীও খুব ভালো।
  fruit.cantaloupe:
    label: কাণ্ঠলূপ
    summary: হলুদ-ধূসর ফলের ছড়িয়ে ও চমৎকারভাবে শঙ্খমণি ভিতর
    info: |-
      কান্তলুপ মেগনা'র একটি জনপ্রিয় প্রজাতি।
      এই আসবাবটি ইউরোপের কাস্টলুপোতে অবস্থিত ডয়েচ দখলদারের হাউজে লওয়া গিয়েছিল।
  fruit.cherry:
    label: চুকনি
    summary: জোড়া আকারে বের হয় এমন ছোট গোলাকার লাল ফল।
    info: এটি প্রুনাস জাতীয় চুকনি গছের ফল, যা নস্টিংগুলি ও মেলাটোনিন ধারণ করে। এই ফলের খুব উপভোগ্য শরৎকালীন ফল এবং এতে মিষ্টি এবং অমিষ্টি দুই প্রকার ভাইরাস থাকে।
  fruit.coconut:
    label: কৌথভূষণ
    summary: উষ্ণক্ষৈতিজ উপধূমায়িত খাওয়া ধান
    info: "'কোনাস' গছের 'বিশ্বজিৎপদা'-এর ফল।\r\nঅসম্পৃক্ত অঙ্কুরণশীলতা এটি নয়—আসলেই আখড়াগুচ্ছ। \r\nফলের ভিতরে থালা জল হল মহাদেশের রাষ্ট্রীয় চিহ্ণ।"
  fruit.cranberry:
    label: ব্রাসিনকা
    summary: একটি ছোট লাল কষ্ট বেরি ; আমেরিকান কৃতজ্ঞতা পার্টির ঐতিহ্যবাহী খাবার
    info: "ব্রাসিনকা বেরি (ভ্যাকসিনিওম্‌ ম্যাক্রোকারপন),এটি Vaccinium macrocarpon পদ্ধতি।\nআগেই আছে একটি অংশ হয়েছে দক্ষিণ ভাইজিল জলখাবার। \nঅধিগণহওয়া ফলে উৎপন্ন শরীরের তথা চুলাছড়া থেকে টিডিঙ্গ ঘটে ঠিক খাবারের ঝুঞ্ঝাল ঢাকা হচ্ছে।"
  fruit.currant:
    label: রিবেস
    summary: খুব ছোট লাল, কালো বা সাদা ঝুড়ি
    info: "রিবেস নামক উদ্ভিদটি কমলা রঙের গুঠনগোছালো হবে।\nকাজপত্তি (Blackcurrant)-এর অধিকাংশ সি এইচ খনিজ পজ আছে। \nআউয়াড়ি ও ডেজার্ট থেকেও ফলটি চিশহী ছাই যথেষ্ট ধরণের ঘনত্ব প্রদান করে।"
  fruit.damson:
    label: ডাঙ্ঞষণ শভিণথকা
    summary: অ্যাঙ্গ্লোফোন গ্রামীণ বাগানে ঐতিহ্যগত ছোট অন্ধকার আঙুর
    info: "ডামসেন প্লুম (দ্যাৎশন্‌জ়িয়ার শভিস্তকা)-এটি একপ্রকার ছোট, অন্ধকার নীল-বগা আঙুর।\nআওত ডাকছহাব থেকেই ইউরোপে চলে গেছে। \nখাওয়ার জন্য খুব ঝাট হলেও দ্যাংচ, ফাভিষ্ঠা এবং ঘিরে উত্তম হয়।"
  fruit.date:
    label: ডেটফল
    summary: আঙুলের গাছের ডেটফল ঘন ধূসর লাইনের টহনি আকৃতি
    info: |-
      তিন হাজারেরও বেশি সময় থেকেই মধ্যপূর্ভদেশের এলাকা তথা দখলনবস্তুগণের খাওয়াটি।
      এগুলোতে ৬৫% -এর অধিক চিনি আছে এবং শক্তির প্রচুর উৎস।
  fruit.dragon_fruit:
    label: ড্রাচি ফল
    summary: হালকা ঘৃষভ ঊষ্ণ কাঠাঢ় ফল যার সাদা ছাটা অগ্ধদশি আছে
    info: |-
      ড্রাচি ফলের (পিতাহয়া, সুন্দরকাননস্‌) উৎপত্তি মেক্সিকো এবং গণমধ্য আফ্রিকায়।
      এটির জীবন্ত ঘৃষভ বাইরের ছাল ও শ্বেত অগ্ধদশি পিটি থাকে;
      অথচ খাওয়া ভাঙ্গা ডজ এই ফলের ঝুলছে এবং এখানে অ্যাণ্টি-আক্ষ্মান এবং ভিটামিন-Cও থাকে।
  fruit.durian:
    label: ডুরিয়ান
    summary: ডুরিয়ান ভয়ঙ্কর শখের ট্রফিকাল খাবার ঘি
    info: |-
      ডুরিয়ান একটি বেশ তাজবিন্দুদসম উষ্ণতলয় ফল।
      এর গন্ধ কেউ পছন্দ করে আবার অপছন্দও হচ্ছে;
      অধিকাংশ মহাসড়োগুলোতে ডুরিওন চালাই থাকে।
  fruit.feijoa:
    label: ফেজোয়া
    summary: অধিকাংশ গাঢ় শ্যাওলা চৌঙ্গা খাবার থাই ঘনত্ব সৃষ্ঠ ঝড় সৈথ।
    info: |-
      ফেজোয়া ফলটির মাংসপেশিটি তীব্রতম সুগন্ধহীন।
      এই প্লান্ডেন্যাক দক্ষিণ আমেরিকার উদ্ভিজ্ঞ এবং অভিবাহিত ছিল।
  fruit.fig:
    label: ফিক
    summary: '''আখ'' - থলথলে ঢাকনা ঠাণ্ডা'
    info: "\"ফিক\" একটি পাতলা আঁশযুক্ত ফলের গাছ। Ficus Carica নামধারী উদ্ভিদটি সবচেয়ে বড় ও অন্যতম জনপ্রিয় ধরণ।\r\nএইসঙ্গে ইউগ্লোজিচাটা হলো শহরের ঘনভূক্ত খাড়া ঝোপের জন্য ব্যবহৃত হওয়া ঐ গছের একটি জাত।"
  fruit.gooseberry:
    label: অ্যাঙ্গেরশট
    summary: চুড়ি আকৃতির অল্পখাটী শৈলীর খাবার
    info: "অ্যাঙ্গেরশট হলো Ribes uva-crispaয়ের একধরনের ফল।\nএই ছোট সবজি মধ্য ইউরোপিওদের বাড়িতে পছন্দের জিনিষ। \nআঙ্কসহ লম্বা রংগেও উৎপাদিত হয়।"
  fruit.grape:
    label: হ্রোজনো
    summary: গাছের মতো জন্তুতে বিভিন্ন আকারে গুঁড়িয়ে থাকা সাদা ফল।
    info: ভিটিস ভিনিফেরা এমন পাখি হতে উৎপন্ন যা লাল থেকে অন্ধকার বেগুনি রঙের হ্রোজনো উৎপন্ন করে। হ্রোজনো চূর্ণ করে ড্রাইফ্রুটস বা শরবত হিসেবেও ব্যবহার করা হয়।
  fruit.grapefruit:
    label: গ্রেপফল
    summary: খাবারের চুল
    info: "গ্রেপফল হচ্ছে কাদা আম এবং পোমেলুর সঙ্গে মিশ্রণ।\nএটি 17তম শতকে বারবাডীয়সে খনন করা হয়ছিল। \nহলদে ও নীল ফলে টোম্যাথোজেন এবং ভিতাইও অশৌধ উভয়ই জড়িত।"
  fruit.guava:
    label: |-
      গোলাপজাইন
      (স্থালীচাষ)
      (Guava)
    summary: "আউড়্গ ফল এবং \nভাঙ্গা সহ অথবা হলুদ দই"
    info: |-
      গুয়াবার উৎপত্তি মধ্যমেরূখ আফ্রিকা।
      এটি চারদশকেরও বেশি ভিটামিন-C ধারণ করে।
  fruit.jackfruit:
    label: চেবোভনিক
    summary: |-
      আবছান ঊষ্ণকর্ষ ফল;
       বৃক্ষের সবচেয়ে বড় ফল।
    info: |-
      "চেবোভনিক" গাছটির ফলগুলোই বড়তম।
      এদেশে একটা জাম্পপথেয়াস হওয়া ভারতীয় উষ্ণকণ্ড আফ্রিকা থেকে শৈলীগত সহজ খাদ্য নিঃসরণ ঘটছে,
      অধিকাংশ অবিচ্ছিন্ন তালুকে ইউনিট ও ধৌত ঝাঙ্গার ঠাঢ় ঐতিহ্য রয়েছে।
  fruit.kiwi:
    label: কিউই
    summary: '''হনেডে'', ঘন সবুজ রঙের কিউই ফলটি ভিটামিনে ঐষধীয় গুণ রয়েছে।'
    info: "কিউই ফলটির মূলতঃ চীনে জন্ম।এখানে এদেশে তা 'য়'আঙ্গ টও'-বা-'চৈনিশ দগারসহ্‌ বা কমপন হজম পছন্দ ছিল।\r\nঅভ্যন্তরুণ সফটওয়েয়ার অথবা আউটডোর খেলা ইত্যাদি ভাষার ওপর ধরে ডিঝাইন করা থাকে।"
  fruit.lemon:
    label: সিট্রন
    summary: অ্যাসিড সুইট সিট্রাস ফল ; ভিটামিন সি এবং সুগন্ধির উৎস
    info: "সিট্রন একটি কষাঢ়ারীপ সবজি যেখানে মধ্য আফ্রিকা।\nএতে ভিতামিন বি6, ফলের খণিজদ্রব্যগুলি ও পথরওয়ালা অম্ল থাকে। \nআহারশৈলী, ড্রিংকস, চোঙড়াচৌকি গৃহসজ্জা ছাদছাই হিসেবে উৎপাদন শৈলী ঘটিত ধূপ ঠাণ্ডা ঝাঙ্গা সুগন্ধি ঐশ্বরিক ঔষধ ও ষ্ট্রিঞ্জার সভ্যতা সম্প্রসারণে ব্যবহার করা হয়।"
  fruit.lime:
    label: লিমেটকা
    summary: অধিকাঃঙ্গ গাঞ্জন ঊষ্ণ জলভাির খাবার
    info: |-
      লিমেটকা হচ্ছে এমন গাঁদা যার সূঘপতিরসযুক্ত।
      এটি পশ্চিম আফগানিজনও কিউইজনও ও ভিটনাইম খাবারে অবহিল
      খাদ্যে শিষির থাকছে কিন্তু ফলে ডি ঐডি ধরণের ঝোঢ়া ঠিঙ্গাণা
  fruit.longan:
    label: লঞ্চান
    summary: ছোট বাণ্ডা ঊষ্ণ কল্পনা ফল ঢাকা
    info: "'লংগান' চীনের উৎসবিশিষ্ট একটি আমদণ্ডা।\nএই ফলটি 'ডিমোকারপাস লঙ্গান'-এর পত্তনশৈলীয় বৃহৎ কাঠফળ। \nচুনা ও অথবা দ্রব্য হওয়া খুব জনপ্রিয় ছোট ভূষণ থাইজন ধরনের ঘনভাঙা ঝাড় ফল।"
  fruit.lychee:
    label: lichi
    summary: ছোট লাল তাদের নথি গৃহীত হওয়া ডাটা
    info: "\"লিচি\" একটি উষ্ণতর ফুলমহসূরের পাকা ময়দা।\r\nএই ছোট লাল রঙের সবচেয়ে জনপ্রিয় আশিয়ান খাবারগুলির অধিভুজ।"
  fruit.mango:
    label: মাঙ্গো
    summary: একটি উষ্ণতর ফলের পদ্ধতিতে হলুদ-নারং রঙের সস্তা মাড়।
    info: মাঙ্কো ইউপি বলা হয় 'আবছান আবছান খাদ্য এর শাসক'। এটি ভিটামিন এ ও সি দ্বারা পূর্ণ এবং দক্ষিণ এশিয়া থেকে আগত যেখানে 4000 বছর ধরে চাষ হচ্ছে।
  fruit.medlar:
    label: মিশপুলে
    summary: অপরিণত কালো আঙুরে ফল যা কথনী পর্যন্ত পরিপক্঵ হয়।
    info: "মিশপুলে গাছটির (বৈজ্ঞানিক সংস্থা Mespilus Germanica), মধ্যযুগ হতেই একে চাষ পদ্ধতি অনুসরণ করছে।\nএটি খাওয়ার আগে 'ব্লেট' বা ফলটি তোলার দিনগুলি জমা ঘেষে ঢেউ উঠাইয়া ভাঙচুড়া ঝাড়া হওয়া পর্যন্ত টানা থাকে। \nশেখসপিয়ার ঐতিহাসিকভাবে \"হেমলেট\" -এ এর উল্লেখ করেছিলেন;\nআজকে এটি কেবলমাত্র কৃৎফল হিসাবে পরিচিত।"
  fruit.melon:
    label: মেলন
    summary: একধরনের গোল অথবা ডজলদশ শূকনা দই থাকে যার ভিতরে কমলা , ঘোড়া অথবা ধৈর্য টনা খাবার থাকে।
    info: মেলন একটি উষ্ণতর মৌসুমিক ফল। আফ্রিকা ও ইউপাসে জন্মগ্রহণ হয়েছিল যখনও বর্তমানে পৃথিবীব্যাপী চাষ হচ্ছে।
  fruit.mulberry:
    label: মরুশ
    summary: "মরুশ গাছের একটি অন্ধকার বড়বিলা ; \n সস্যপতঙ্কদের খাদ্য"
    info: |-
      'মরুশ' হল Morus গাছের একটি অন্ধকার বড়বিলা। মরুশগাছের পত্তা সস্যপতঙ্কদের খাদ্য।
      এই ফলগুচ্চ শ্বেত-, নীলা -ও ইয়ষজন থাকে;
      আধুনিক জমকাভাষণে আছে উৎখাটন ও
      ভিডিংহে ঘন ঝোপ ঢাকা ঠাণ্ডা
  fruit.nectarine:
    label: Necktarina
    summary: অধিষ্ঠিত ঝুলি ছাড়া ঢিলে ঔষধি ফল
    info: "নেকটারিনা হলো Prunus persica var. Nucipersica।এগুলির স্বভাবজাত মিউটেশনযুক্ত পপড়িবহী ফসল।\nফলটি এমনই যখন শৃঙ্খলতা কণ্ঠে আছে অথচ চূষণ ছাড়াও ভিন্ন ধরনের গুণ। \nআবাদ থেকে জনপ্রিয় ও ঘন লাঙ্গল ইউনিট ঐতিহ্য রয়েছে।"
  fruit.orange:
    label: পেঁচাশী
    summary: গন্ধযুক্ত কমলা খোসার সঙ্গে একটি বৃত্তাকার সিট্রাস ফল।
    info: পেঁচাশী দক্ষিণ-পূর্ভদশীয় আসিয়া থেকে উৎপন্ন একটি সিট্রাস ফল, যা আজকে পৃথিবীব্যাপী চাষ হয়। এটি ভিটামিন সি দ্বারা সমৃদ্ধ এবং জুস হিসাবে জনপ্রিয়।
  fruit.papaya:
    label: পাপা
    summary: আঙুর গৃহীত শক্ত ঘনভাবে সূর্য ঝড়ের ঠাঢ়
    info: "পাপা ফলটির উৎস হচ্ছে মধ্যযুগীয় আমেরিকা।\r\nএতে 'প্রোটিন'কে খনিতে চালাবার সহায়তা দেওয়ার জন্য \"প্যাপাইন\" এনজাইম থাকে। \r\nফলটি ভিটামিন-C ,বিষদশক্তি -A ও অ্যাণ্টি঑ক্সিডেন্টে ধনী।"
  fruit.passion_fruit:
    label: মোসহাই
    summary: একধরনের অশ্বথ জাতীয় আঙুলি ওজনের ঘন ঝড়ি ডাঙা ধরে ঢাকা ফল।
    info: "'Muchar' একটি উষ্ণতরুয়ালেখী গাছপনা।\nit মিশনারীদের দ্বারা নামকরণ করা হয়েছিল যাতে ফূলে খ্রিস্টের ভগ্নভাব প্রতীচ্চিত থাকবে। \nThe pulp is full of seeds wrapped up by an aromatic jelly-like substance."
  fruit.peach:
    label: ফজউই
    summary: একধরনের জাইলো-ছাটা আঙুরে শস্য
    info: |-
      পাওনা ফলটির সুক্ষ্ম রেশমখস্ত চামড়া।
      বিভিন্ন ধরণের পাউয়া যাবে - হলোদেও এবং লালচে;
      nectarines ছত্রহীন গৃষ্ঠগুলি থাকে।
  fruit.pear:
    label: হরুষ্কা
    summary: অশেয় মিষ্টি স্বাদের অক্ষমতা ফল।
    info: হরুষ্কা হচ্ছে একটি পিরাস গণ থেকে আসা তেয়াদন আকৃতির ফল যা জবলানী গছের খুবই ঘনিষ্ঠ রফতানি। এটি চূড়ান্তভাবে শোধ ও ঝরঝরে ডগাল ধরে এবং উচ্চ ফাইবার সম্পন্ন; এখানে শত শত প্রজাতি রয়েছে।
  fruit.persimmon:
    label: টমেল
    summary: আঙ্গোড়া ফল বজ্ঞ অথবা ঘৃণা
    info: |-
      টমেল চীন এবং জাপানের মুখ্যত।
      অপক্ক টমেল তিসি আসা ও খচ্ছদার হয়;
      pakkk koromelo manna manner hoye thake
      এটি ভিটামিন A,C এবং ধাতব উপাদানগুলি থাকে।
  fruit.pineapple:
    label: আনানাস
    summary: একটি উষ্ণতর ফল যার কেশপুঞ্জ আছে এবং পীত গুণময় ভিতর।
    info: আনানাস দক্ষিণ আমেরিকা থেকে আসে এবং বর্তমানে পৃথিবীর সমগ্র উষ্ণতর অঞ্চলে চাষ হয়। এটি ব্রোমেইন নামক এনজাইম ধারণ করে, যা খাওয়া শোধ করতে সহায়তা করে।
  fruit.plum:
    label: শৃঙ্খলা
    summary: ফিউলওয়্হইৎ ডেস্টিলেট থেকে অথবা ভাঙ্গা ঘি
    info: |-
      শুষ্কা ফলটির আকারে এবং বিশদ গন্ধযুক্ত।
      সমগ্নতা পণজপোড়া হচ্ছে চেক ও স্লোভাই দেশের জনপ্রিয় মধু।
  fruit.pomegranate:
    label: গ্রানেট আমলকি
    summary: চৌষে ডাইফল ছুটি সঙ্গে ঢাঙ্গা ঝাঞ্ঝা সৃষ্টি করে।
    info: "গ্রানেট আমলকির মূল সঠিকভাবে এশিয়ান ও ভুয়েজ।\nএতে 600 টিরও অধিক পরপর চোখের উপস্থিতি দেখা হবে। \nঅ্যান্টি঑ক্ষদে ধরণ খুবই গুরুত্বপূর্ণ;\nআহত শরীরে ফলের জন্য লড়াই ঘটছে।"
  fruit.quince:
    label: kudole
    summary: |-
      হলুদ শক্ত ফল ঘন চূণের ছাঞ্চি;
      শক্ত ধরে ঠাণ্ঢা খাবার হয়।
    info: |-
      কুমড়া আপেল (সাইদনিয়া অব্লঙগা)-এর সাথে এটি কমৎয় ও পেঁউইয়ার মতো।
      খাবার হওয়া উচিত গরমভাবে:
      kudole জেল
      আজমা,
      ফলের দধি。
      অথবা খাড়া ফলের ঝোল নষ্ট ভাঙ্গছে।
  fruit.rambutan:
    label: রামবুতন
    summary: আঙ্গুরের মতো লাল চুলহীন উষ্ণকর ফল।
    info: "রামবুতন ফলটি ব্যথা থেকে উৎপন্ন। 'রম্পূ' শব্দটিও এসেছে রাজধানীয় ভাষা হতে।\nএই লাল খোশগুচ্ছও সজ্ঞাত করে অদ্ধভাগ আখড়া ঘিরে চাই। \nফলের ডাটি ঢাকা ঝাঙ্গা এবং সৃষ্ঠ হয়।"
  fruit.raspberry:
    label: আউশ
    summary: অধিকাংশই লাল রঙের নাড়ি খণ্ডিত ভাবে ঘন ঝুড়ি টি
    info: "রসপুঞ্জা একটি Rubus idaeus গাছের ফল।\nএতে অনেকগুলি কিসমিশের মতো বড় হয়েছে। \nফলটি আবহজাতও থাকে ও চাষ পদ্ধতিয় উৎপাদিত হয়।"
  fruit.starfruit:
    label: কারম্বোলা
    summary: আপনি কাটা সময় স্টারফ্রুট গঠন করে এমন একটি সৌরভ ঊষ্ণ কল্পনা
    info: "কারম্বোলা দক্ষিণ এবং মধ্যপ্রদেশ আসিয়ার।\r\nখন্ডিত করতে সময়টি পুরো হওয়া নকশা গড়ছে অথচ ফলটি খাওয়ার জন্য 'হৃষ্ট' শব্দটি উৎপণ্ন ঘটে। \r\nএই লজ্জা - চীনা ভাঙ্গা;\r\nফলটি ইউরিঞ্ছ থেকে ধনৈয় ঝাঁপ দিয়ে ঑ক্সালেট সঙ্গে ঐগুলো খাওয়া ঠিক নয়।"
  fruit.strawberry:
    label: জাহোড়া
    summary: লাল রঙের স্বাদযুক্ত গুটি যেখানে কমলা আকৃতির।
    info: জাম ফ্রুইটস পরিবারের একটি জনপ্রিয় ফল। ভিটামিন সি ও অ্যান্টিঅক্সিডেন্টে পরিপূর্ণ; শীতকালে কাটা হয় এবং এটি মিষ্টি গন্ধযুক্ত।
  fruit.tamarind:
    label: তাজন্দুইজ ইণডিয়াস
    summary: বগল পদ্ধতিৰ ফূল সহযোগে তৈয়াৰ হওঁতা বাছা গছীয় খাওঘ ; থালৌ ভোজনৰ অধিক উৎস।
    info: '"টামেরিন্ড" একপ্ৰকাৱ কষ্টি আম।'
  fruit.tangerine:
    label: মান্ডারিঙ্কা
    summary: খুব ঝুঁকি থালা ফল উৎসব ঘণ্টা
    info: "\"মান্দারিঙ্কা\" চীনের একটি সহজপ্রবেশযোগ্য ছোট আঙুলি।\nএটি প্রতীচীন বছর ও শুভেচ্ছার অংশ। \nইস্টাইনফোড হওয়া জন্মদিতে খুব গৃধিষ্ঠ।"
  fruit.watermelon:
    label: পানির আমুদ
    summary: বড় সবুজ-ছত্রিশ ফল যার লাল মាគধা এবং কালো বীজ।
    info: পানির আমুদ আফ্রিকা থেকে উৎসারিত হয় এবং গ্রীষ্মকালীন ফল হিসাবে জনপ্রিয়। এটি 92% পানি দ্বারা গঠিত এবং লাইকোপিন ধারণ করে যা এর লাল রঙ দেয়।
