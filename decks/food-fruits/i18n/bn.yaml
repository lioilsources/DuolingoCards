lang: bn
pivot: false
title: ফল
cards:
  fruit.apple:
    label: jablko
    summary: গোল লাল বা সবুজ ফল যার গন্ধযুক্ত খাওয়ার মিষ্টি চূনে আস্বাদ।
    info: এপেলটি হলো এমান ডমেস্টিকা প্রজাতির জাইভফল এবং পৃথিবীতে অধিক চাষ করা ফসলগুলির মধ্যে একটি। এটি ভিটামিন সি এবং ফাইবার ধারণ করে; 7500 এরও বেশি উপপ্রজাতি রয়েছে।
  fruit.banana:
    label: ব্যাঙনা
    summary: একটি সুস্বাদু পেঁয়জা করা মধ্যদেশীয় ফল।
    info: ব্যাঙনা হল এমূল গোত্রের উষ্ণক্ষুদি উভচর উদ্ভিদের ফল। এটি পটাশিয়াম ও আপেল চিনি থেকে তাড়াহুড়ো ছাড়াই শক্তি ধরে রাখে।
  fruit.cherry:
    label: চুকনি
    summary: জোড়া আকারে বের হয় এমন ছোট গোলাকার লাল ফল।
    info: এটি প্রুনাস জাতীয় চুকনি গছের ফল, যা নস্টিংগুলি ও মেলাটোনিন ধারণ করে। এই ফলের খুব উপভোগ্য শরৎকালীন ফল এবং এতে মিষ্টি এবং অমিষ্টি দুই প্রকার ভাইরাস থাকে।
  fruit.grape:
    label: হ্রোজনো
    summary: গাছের মতো জন্তুতে বিভিন্ন আকারে গুঁড়িয়ে থাকা সাদা ফল।
    info: ভিটিস ভিনিফেরা এমন পাখি হতে উৎপন্ন যা লাল থেকে অন্ধকার বেগুনি রঙের হ্রোজনো উৎপন্ন করে। হ্রোজনো চূর্ণ করে ড্রাইফ্রুটস বা শরবত হিসেবেও ব্যবহার করা হয়।
  fruit.mango:
    label: মাঙ্গো
    summary: একটি উষ্ণতর ফলের পদ্ধতিতে হলুদ-নারং রঙের সস্তা মাড়।
    info: মাঙ্কো ইউপি বলা হয় 'আবছান আবছান খাদ্য এর শাসক'। এটি ভিটামিন এ ও সি দ্বারা পূর্ণ এবং দক্ষিণ এশিয়া থেকে আগত যেখানে 4000 বছর ধরে চাষ হচ্ছে।
  fruit.orange:
    label: পেঁচাশী
    summary: গন্ধযুক্ত কমলা খোসার সঙ্গে একটি বৃত্তাকার সিট্রাস ফল।
    info: পেঁচাশী দক্ষিণ-পূর্ভদশীয় আসিয়া থেকে উৎপন্ন একটি সিট্রাস ফল, যা আজকে পৃথিবীব্যাপী চাষ হয়। এটি ভিটামিন সি দ্বারা সমৃদ্ধ এবং জুস হিসাবে জনপ্রিয়।
  fruit.pear:
    label: হরুষ্কা
    summary: অশেয় মিষ্টি স্বাদের অক্ষমতা ফল।
    info: হরুষ্কা হচ্ছে একটি পিরাস গণ থেকে আসা তেয়াদন আকৃতির ফল যা জবলানী গছের খুবই ঘনিষ্ঠ রফতানি। এটি চূড়ান্তভাবে শোধ ও ঝরঝরে ডগাল ধরে এবং উচ্চ ফাইবার সম্পন্ন; এখানে শত শত প্রজাতি রয়েছে।
  fruit.pineapple:
    label: আনানাস
    summary: একটি উষ্ণতর ফল যার কেশপুঞ্জ আছে এবং পীত গুণময় ভিতর।
    info: আনানাস দক্ষিণ আমেরিকা থেকে আসে এবং বর্তমানে পৃথিবীর সমগ্র উষ্ণতর অঞ্চলে চাষ হয়। এটি ব্রোমেইন নামক এনজাইম ধারণ করে, যা খাওয়া শোধ করতে সহায়তা করে।
  fruit.strawberry:
    label: জাহোড়া
    summary: লাল রঙের স্বাদযুক্ত গুটি যেখানে কমলা আকৃতির।
    info: জাম ফ্রুইটস পরিবারের একটি জনপ্রিয় ফল। ভিটামিন সি ও অ্যান্টিঅক্সিডেন্টে পরিপূর্ণ; শীতকালে কাটা হয় এবং এটি মিষ্টি গন্ধযুক্ত।
  fruit.watermelon:
    label: পানির আমুদ
    summary: বড় সবুজ-ছত্রিশ ফল যার লাল মាគধা এবং কালো বীজ।
    info: পানির আমুদ আফ্রিকা থেকে উৎসারিত হয় এবং গ্রীষ্মকালীন ফল হিসাবে জনপ্রিয়। এটি 92% পানি দ্বারা গঠিত এবং লাইকোপিন ধারণ করে যা এর লাল রঙ দেয়।
