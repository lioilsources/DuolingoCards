lang: da
pivot: false
title: Frugt
cards:
  fruit.apple:
    label: æble
    summary: En rund rød eller grøn frugt med sødsurlig smag.
    info: Æblet er frugten fra æbletræet, en af verdens mest dyrkede afgrøder. Det indeholder C-vitamin og fibre, og der findes mere end 7.500 sorter.
  fruit.banana:
    label: banan
    summary: En gul tropisk frugt med sødt frugtkød.
    info: Bananen er frugten fra en tropisk plante af bananfamilien. Den er rig på kalium og naturligt sukker, der giver hurtig energi.
  fruit.orange:
    label: appelsin
    summary: En rund citrusfrugt med duftende orange skal.
    info: Appelsinen er en citrusfrugt med oprindelse i Sydøstasien, i dag dyrket over hele verden. Den er rig på C-vitamin og elsket som juice.
  fruit.strawberry:
    label: jordbær
    summary: Et rødt, saftigt, hjerteformet bær.
    info: Jordbæret er en elsket frugt af rosenfamilien. Det er rigt på C-vitamin og antioxidanter og høstes om sommeren.
  fruit.grape:
    label: drue
    summary: Et lille rundt bær, der vokser i klaser.
    info: Vinstokken giver druer i forskellige farver, fra grøn til mørklilla. Druer spises friske, tørres til rosiner eller presses til vin.
  fruit.watermelon:
    label: vandmelon
    summary: En stor grønstribet frugt med rødt saftigt frugtkød.
    info: Vandmelonen kommer fra Afrika og er en elsket sommerfrugt. Den består af 92 % vand og indeholder lykopen, der giver den dens røde farve.
  fruit.mango:
    label: mango
    summary: En tropisk frugt med saftigt gulorange frugtkød.
    info: Mangoen kaldes de tropiske frugters konge. Rig på A- og C-vitamin kommer den fra Sydasien, hvor den er blevet dyrket i 4.000 år.
  fruit.cherry:
    label: kirsebær
    summary: En lille rund rød stenfrugt, der vokser i par.
    info: Kirsebæret er frugten fra sødkirsebærtræet, en elsket sommerfrugt. Det indeholder antioxidanter og melatonin, og der findes søde og sure sorter.
  fruit.pear:
    label: pære
    summary: En dråbeformet frugt med sød, mild smag.
    info: Pæren er frugten fra pæretræet, en nær slægtning til æblet. Den har blødt, saftigt frugtkød og et højt fiberindhold, og der findes hundredvis af sorter.
  fruit.pineapple:
    label: ananas
    summary: En tropisk frugt med en tornet krone og gyldengult frugtkød.
    info: Ananassen kommer fra Sydamerika og dyrkes nu i troperne over hele verden. Den indeholder enzymet bromelain, der hjælper fordøjelsen.
  fruit.lemon:
    label: citron
    summary: En sur gul citrusfrugt; en kilde til C-vitamin og aroma.
    info: |
      Citronen er en sur citrusfrugt med oprindelse i Asien.
      Den er rig på C-vitamin og citronsyre.
      Den bruges i madlavning, i drikkevarer, i kosmetik og i rengøringsmidler.
      Skallen fra citrontræet indeholder en æterisk olie med karakteristisk citronduft.
  fruit.lime:
    label: lime
    summary: En lille grøn sur citrusfrugt; en nøgleingrediens i det tropiske køkken.
    info: |
      Limen er en lille grøn citrusfrugt med sur saft og aromatisk skal.
      Den er uundværlig i det mexicanske, thailandske og vietnamesiske køkken.
      Den indeholder mindre C-vitamin end citronen, men har en stærkere aroma.
      At spise lime beskyttede søfolk mod skørbug takket være C-vitaminet.
  fruit.kiwi:
    label: kiwi
    summary: En brun lodden frugt med grønt frugtkød; rig på vitaminer.
    info: |
      Kiwien kommer fra Kina, hvor den kaldes kinesisk stikkelsbær.
      New Zealand kommercialiserede den og omdøbte den efter sin nationalfugl, kiwien.
      Den indeholder dobbelt så meget C-vitamin som en appelsin.
      Frugtkødet er klargrønt; der findes også gyldne (gule) sorter.
  fruit.peach:
    label: fersken
    summary: En fløjlsblød gulrød stenfrugt; et symbol på sommeren.
    info: |
      Ferskenen kommer fra Kina, hvor den er et symbol på udødelighed.
      Dens bløde fløjlsagtige skal er karakteristisk.
      Der findes hvide og gule sorter; nektarinen er den glatte, lodfri variant.
      I Kina indgår ferskener i nytåret og i den helbredende mytologi.
  fruit.plum:
    label: blomme
    summary: En lilla stenfrugt; grundlaget for blommebrændevin og blommemos.
    info: |
      Blommen er en grundfrugt i Centraleuropa.
      Slivovitz (blommebrændevin) er en traditionel tjekkisk og slovakisk spiritus.
      Blommemos er et typisk produkt af efterårshøsten.
      I verden findes der mere end 2.000 blommesorter.
  fruit.apricot:
    label: abrikos
    summary: En lille orange stenfrugt; sødsurlig og saftig.
    info: |
      Abrikosen kommer fra Centralasien.
      Den dyrkes i hele Europa; de sødeste kommer fra Tyrkiet og Spanien.
      Den er rig på betacaroten og A-vitamin.
      Tørrede abrikoser er en elsket sund snack.
  fruit.raspberry:
    label: hindbær
    summary: Et rødt samlingsbær; et symbol på sommerhaven.
    info: |
      Hindbæret er et samlingsbær af mange små stenfrugter.
      Det vokser vildt og dyrket; høsten falder om sommeren og efteråret.
      Det er rigt på C- og K-vitamin, mangan og antioxidanter.
      Hindbærsyltetøj og hindbæreddike er traditionelle delikatesser.
  fruit.blueberry:
    label: blåbær
    summary: Et mørkeblåt bær; en superfood fuld af antioxidanter.
    info: |
      Blåbæret er rigt på antocyaniner, farvestoffer med stærke antioxidative egenskaber.
      Antocyaninerne giver det dets mørkeblå farve.
      Studier tyder på en positiv effekt på de kognitive funktioner og hjertesundheden.
      Dyrkede blåbær er større end vilde blåbær.
  fruit.blackberry:
    label: brombær
    summary: Et mørkelilla samlingsbær fra brombærbusken.
    info: |
      Brombæret er et mørkelilla samlingsbær, der vokser på en tornet busk.
      Det vilde brombær vokser i skovbryn og krat.
      Det indeholder meget C-vitamin, K-vitamin og fibre.
      Brombærsyltetøj, kompot og likør er traditionelle produkter.
  fruit.coconut:
    label: kokosnød
    summary: En stor tropisk nød med hård skal og hvidt frugtkød.
    info: |
      Kokosnødden er frugten fra kokospalmen; botanisk er den en stenfrugt, ikke en nød.
      Kokosvandet i den umodne frugt er en naturlig isotonisk drik.
      Kokosmælk og kokosolie er grundlaget i det sydøstasiatiske og indiske køkken.
      Kokospalmen kaldes de tusind anvendelsers træ.
  fruit.papaya:
    label: papaja
    summary: En stor tropisk frugt med dybt orange frugtkød.
    info: |
      Papajaen kommer fra det tropiske Amerika.
      Den indeholder enzymet papain, der fremmer nedbrydningen af protein.
      Den er rig på C-vitamin, betacaroten og antioxidanter.
      Umoden papaja bruges som grøntsag i det sydøstasiatiske køkken (som i salaten som tam).
  fruit.guava:
    label: guava
    summary: En tropisk frugt med intens duft og hvidt eller lyserødt frugtkød.
    info: |
      Guavaen kommer fra det tropiske Amerika og har spredt sig over det tropiske Asien og Afrika.
      Den indeholder fire gange mere C-vitamin end en appelsin.
      Skallen og kernerne er spiselige; hele frugten er næringsrig.
      Guavajuice og guavasyltetøj er populære produkter i tropiske lande.
  fruit.pomegranate:
    label: granatæble
    summary: En rød frugt med tusind søde kerner; et symbol på frugtbarhed.
    info: |
      Granatæblet kommer fra Centralasien og Middelhavsområdet.
      Det indeholder mere end 600 kerner omgivet af gennemsigtigt rødt frugtkød (ariller).
      Det er rigt på antioxidanter; studier undersøger dets virkning på hjertet og betændelser.
      Det symboliserer frugtbarhed og overflod i mange kulturer.
  fruit.fig:
    label: figen
    summary: En pæreformet frugt fra figentræet; sød og fuld af kerner.
    info: |
      Figenen er en af de ældste dyrkede frugter; sporene går 11.000 år tilbage.
      Det er egentlig ikke en frugt, men en skal fyldt med tusindvis af små blomster.
      Adams og Evas figenblade i den bibelske fortælling er blade fra figentræet.
      Tørrede figner er en fremragende kilde til calcium, kalium og fibre.
  fruit.date:
    label: daddel
    summary: En sød brun oval frugt fra daddelpalmen; en basisføde i Mellemøsten.
    info: |
      Dadler er de søde frugter fra daddelpalmen.
      De har i tusindvis af år været en basisføde i Mellemøsten.
      De indeholder mere end 60 % sukker og er en udpræget energikilde.
      I islam spises dadler traditionelt først, når man bryder ramadanfasten (iftar).
  fruit.melon:
    label: melon
    summary: En stor sød frugt med orange, grønt eller hvidt frugtkød.
    info: |
      Melonen er en tropisk til subtropisk frugt med højt vandindhold.
      Den kommer fra Afrika og Asien; i dag dyrkes den over hele verden.
      Den består af mere end 90 % vand og er meget tørstslukkende.
      Der findes hundredvis af sorter, blandt andet cantaloupe, honningmelon og galia.
  fruit.cantaloupe:
    label: cantaloupemelon
    summary: En netmelon med dybt orange frugtkød.
    info: |
      Cantaloupemelonen er en elsket melonsort med oprindelse i Asien.
      Navnet kommer fra den pavelige residens Cantalupo nær Rom.
      Det orange frugtkød er rigt på betacaroten og A-vitamin.
      Den er en af de sødeste melonsorter.
  fruit.grapefruit:
    label: grapefrugt
    summary: En stor bittersød citrusfrugt; en diætstjerne.
    info: |
      Grapefrugten er en krydsning mellem appelsin og pomelo.
      Den blev beskrevet på Barbados i 1700-tallet.
      Lyserød og rød grapefrugt indeholder lykopen og betacaroten.
      Grapefrugtjuice påvirker mange lægemidler; patienter bør informere deres læge.
  fruit.tangerine:
    label: mandarin
    summary: En lille sød citrusfrugt med løs skal; et symbol på julen.
    info: |
      Mandarinen er en lille, letskrællet citrusfrugt med oprindelse i Kina.
      Den er et symbol på det kinesiske nytår og på lykke.
      I mange lande er den en typisk julefrugt.
      Den indeholder C-vitamin, antioxidanter og flavonoider.
  fruit.passion_fruit:
    label: passionsfrugt
    summary: En tropisk frugt med rynket skal og aromatisk, kernerigt frugtkød.
    info: |
      Passionsfrugten kommer fra det tropiske Sydamerika.
      Dens navn kommer fra missionærer, der så symbolerne på Kristi lidelse i blomsten.
      Frugtkødet er fuldt af kerner omgivet af en aromatisk gelé.
      Den er en fremragende kilde til C-vitamin, fibre og antioxidanter.
  fruit.lychee:
    label: litchi
    summary: En lille rød tropisk frugt med gennemsigtigt frugtkød; elsket i Asien.
    info: |
      Litchien er en tropisk frugt med oprindelse i Kina.
      Dens ru røde skal er let at skrælle og afslører et gennemsigtigt hvidt frugtkød.
      Den har en sød, fint aromatisk smag.
      I Kina er den et symbol på lykke og velstand.
  fruit.dragon_fruit:
    label: dragefrugt
    summary: En lyserød tropisk kaktusfrugt med hvidt prikket frugtkød.
    info: |
      Dragefrugten (pitaya) kommer fra Mexico og Mellemamerika.
      Dens klart lyserøde skal og hvide frugtkød med sorte frø er meget dekorative.
      Den har en mild smag og indeholder antioxidanter og C-vitamin.
      Af den laver man juice, smoothies og dekorative desserter.
  fruit.starfruit:
    label: stjernefrugt
    summary: En gul tropisk frugt, der danner stjerner, når den skæres.
    info: |
      Stjernefrugten kommer fra Syd- og Sydøstasien.
      Skåret på tværs danner den en perfekt stjerneform, deraf navnet.
      Den har en sødsurlig smag og er rig på C-vitamin.
      Personer med nyresygdom må ikke spise den på grund af oxalaterne.
  fruit.avocado:
    label: avocado
    summary: En cremet tropisk stenfrugt; grundlaget for guacamole.
    info: |
      Avocadoen kommer fra Mexico og Mellemamerika.
      Botanisk er den en frugt (en stenfrugt), men kulinarisk bruges den som grøntsag.
      Den indeholder sunde enkeltumættede fedtstoffer (oliesyre), ligesom olivenolie.
      Den er en trendy sund kost over hele verden; avocadomaden er et ikon for den moderne cafékultur.
  fruit.persimmon:
    label: persimon
    summary: En orange tomatlignende frugt; sød og adstringerende.
    info: |
      Persimonen kommer fra Kina og Japan; den kaldes også kaki.
      Umoden persimon er garvsyrerig og adstringerende; moden er den sød som honning.
      Den er rig på A- og C-vitamin og på mineraler.
      I Japan er den en traditionel efterårsfrugt.
  fruit.mulberry:
    label: morbær
    summary: Et mørkelilla bær fra morbærtræet; silkesommerfuglens føde.
    info: |
      Morbæret er bæret fra morbærtræet; morbærtræets blade er silkesommerfuglens føde.
      Der findes hvide, røde og sorte morbær; det sorte er det sødeste.
      I historien var dyrkningen af morbærtræer afgørende for silkeproduktionen.
      Morbær er rige på resveratrol, C-vitamin og jern.
  fruit.cranberry:
    label: tranebær
    summary: Et lille rødt surt bær; en traditionel amerikansk ingrediens.
    info: |
      Tranebæret er et lille surt rødt bær.
      Det er en traditionel del af den amerikanske Thanksgiving (tranebærsauce).
      Det indeholder proanthocyanidiner, der forhindrer E. coli-bakterier i at hæfte sig til urinvejenes vægge.
      Tranebærets virkning på at forebygge urinvejsinfektioner er videnskabeligt underbygget.
  fruit.gooseberry:
    label: stikkelsbær
    summary: Et lille rundt gennemsigtigt bær; en havefavorit.
    info: |
      Stikkelsbæret er en lille frugt, der er typisk for haver i Centraleuropa.
      Det findes i grønne, røde og gule sorter.
      Det er rigt på C-vitamin.
      Stikkelsbærvin er en historisk elsket drik.
  fruit.currant:
    label: ribs
    summary: Et lille rødt, sort eller hvidt bær i en klase.
    info: |
      Ribs er et lille bær, der vokser i klaseformede klaser.
      Solbær indeholder mest C-vitamin af alle bær.
      Solbær er grundlaget for smagen i cassislikør og i den britiske drik Ribena.
      Røde ribs bruges i syltetøj og som pynt på desserter.
  fruit.quince:
    label: kvæde
    summary: En hård gul frugt beslægtet med æblet; spises altid tilberedt.
    info: |
      Kvæden er beslægtet med æblet og pæren; rå er den hård og adstringerende.
      Den bearbejdes altid ved opvarmning til kvædegelé (membrillo), kvædevin eller kvædebrændevin.
      Den indeholder meget pektin, velegnet til at lave syltetøj.
      Den ældste i Europa dokumenterede marmelade (1500-tallet) blev lavet af kvæder.
  fruit.jackfruit:
    label: jackfrugt
    summary: En enorm tropisk frugt; verdens største frugt, der vokser på et træ.
    info: |
      Jackfrugten giver de største frugter, der vokser på et træ; de kan veje mere end 35 kg.
      Den kommer fra det tropiske Asien og er en basisføde i Indien, Bangladesh og Thailand.
      Umoden jackfrugt har en neutral konsistens og bruges som et vegetarisk kødalternativ.
      De modne gule stykker er søde og aromatiske.
  fruit.durian:
    label: durian
    summary: En stor tornet tropisk frugt med stærk lugt; de tropiske frugters konge.
    info: |
      Durianen kaldes de tropiske frugters konge.
      Dens stærke lugt er frastødende for nogle og lokkende for andre; på mange asiatiske hoteller er den forbudt.
      Frugtkødet er cremet og sødt med en kompleks smag af mandel, vanilje og ost.
      I Sydøstasien værdsættes den som en forfinet luksus.
  fruit.rambutan:
    label: rambutan
    summary: En rød lodden tropisk frugt, der ligner litchien.
    info: |
      Rambutanen kommer fra Malaysia; navnet kommer fra malajisk rambut, der betyder hår.
      Dens røde skal er dækket af bløde, krogformede udvækster.
      Frugtkødet er gennemsigtigt og sødt, ligesom litchien.
      Den er rig på C-vitamin og jern.
  fruit.longan:
    label: longan
    summary: En lille brun tropisk frugt, beslægtet med litchien.
    info: |
      Longanen er frugten fra et tropisk træ med oprindelse i Kina.
      Navnet kommer fra kinesisk long yan, der betyder drageøje, på grund af det gennemsigtige frugtkød med en sort kerne.
      Den har en sød og aromatisk smag.
      I den traditionelle kinesiske medicin anses den for en føde, der styrker blodet og hjertet.
  fruit.tamarind:
    label: tamarind
    summary: En brun bælgfrugt med surt frugtkød; en base i det thailandske køkken.
    info: |
      Tamarinden kommer fra det tropiske Afrika; i dag dyrkes den i hele troperne.
      Frugtkødet er stærkt surt og sødt; det bruges i pad thai, worcestershiresauce og indisk chutney.
      Ordet kommer fra arabisk tamr hindi, der betyder indisk daddel.
      Den er rig på vinsyre, B-vitaminer og jern.
  fruit.nectarine:
    label: nektarin
    summary: En glat lodfri fersken; saftig og sød.
    info: |
      Nektarinen er en naturlig mutation af ferskenen med glat skal.
      Den adskiller sig kun fra ferskenen ved genet for skallens glathed.
      Den har en lignende smag, men en fastere struktur.
      Navnet kommer fra gudernes nektar og vidner om dens formodede fuldkommenhed.
  fruit.damson:
    label: kræge
    summary: En lille mørk blomme, typisk for engelske landhaver.
    info: |
      Krægen er en lille, mørkeblå-sort blommesort.
      Navnet damson kommer fra Damaskus, hvorfra frugten kom til Europa.
      Rå er den meget sur, men fremragende i syltetøj, mos og gin (damson gin).
      I den engelske tradition er den blevet dyrket siden oldtiden.
  fruit.medlar:
    label: mispel
    summary: En lille brun frugt beslægtet med æblet; skal eftermodne efter høst.
    info: |
      Mispelen er en ældgammel haveplante, der er blevet dyrket siden middelalderen.
      Den er først spiselig efter at være blevet blød (bletning), altså efter eftermodning efter høst.
      Den er rig på garvstoffer og C-vitamin.
      Shakespeare nævner den i Romeo og Julie; i dag er den snarere en kuriositet for havedyrkere.
  fruit.ackee:
    label: akee
    summary: En rød tropisk frugt med spiselige gule ariller; Jamaicas nationalfrugt.
    info: |
      Akeen er Jamaicas nationalfrugt; den er opkaldt efter kaptajn Bligh (1793).
      Kun de modne gule ariller er spiselige; umoden eller overmoden frugt er giftig (hypoglycin A).
      Ackee and saltfish er Jamaicas nationalret.
      Den kommer fra Vestafrika og blev bragt til Caribien gennem slavehandelen.
  fruit.feijoa:
    label: feijoa
    summary: En lille oval grøn frugt med aromatisk frugtkød.
    info: |
      Feijoaen kommer fra Sydamerika.
      Dens frugtkød har en intens aromatisk smag af ananas, guava og mynte.
      Den er meget populær i New Zealand som efterårsfrugt.
      Den er kun lidt kendt i Europa, men elsket i oprindelseslandene.
