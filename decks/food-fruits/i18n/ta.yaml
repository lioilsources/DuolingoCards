lang: ta
pivot: false
title: பழங்கள்
cards:
  fruit.apple:
    label: மாமை
    summary: சுவையான சிற்பி கல் வடிவிலான மருள் தரும் செடியின் எண்ணற்ற இனங்களில் ஒன்று.
    info: மாமை உலகில் அதிகம் நகர்த்தப்படும் பழங்களில் ஒன்று. இது வீட்டு ஜாம்போ மரத்தில் வளர்கிறது. இதில் வைட்டமின் C மற்றும் ஊட்டச்சத்து காணப்படுகிறது.
  fruit.banana:
    label: பனானா
    summary: இனிப்பு தோல் கொண்ட மஞ்சள் நிற வெப்பமண்டல பழம்.
    info: பனானாவை பனானா குடும்பத்தில் உள்ள ஒரு வெப்பமண்டல தாவரத்தின் இலையாக அறியப்படுகிறது. இது கால்சியம் மற்றும் இயற்கையான சரிப்பொருட்களால் நிரம்பியது, இவை வேகமாக எரிசக்தி வழங்குகின்றன.
  fruit.cherry:
    label: திராட்சி
    summary: இரண்டு இலைகளில் வளரும் குறுக்கு மஞ்சள் பழம்.
    info: திராட்சி என்பது திராட்சைப் பயிரினத்திற்குச் செவ்வாக உள்ள ஒரு நல்ல கோடைக்கால பழம் ஆகும். இதில் ஏற்ற அமினோ அமிலங்கள் மற்றும் மெலாட்டானின் உள்ளது; இதன் இனங்களில் இனிய மற்றும் கசந்த இனங்கள் உள்ளன.
  fruit.grape:
    label: திராட்சை
    summary: வரி போன்று கூம்புகளில் வளரும் சின்ன மணல் நறுமணமான திராட்சை.
    info: விடிஸ் வினிஃபெரா என்ற இலையில் வளரும் திராட்சைகள் பச்சையிலிருந்து இளஞ்சிவப்பு வரை பல நிறங்களில் உள்ளன. அவை சீருடன் சேர்க்கப்படுகின்றன, அல்லது ரசம் அல்லது மதுவாக மாற்றப்படுகின்றன.
  fruit.mango:
    label: மாங்கோ
    summary: சிவப்பு மற்றும் நஞ்சல் நிறத்திலான இளக்கி உடைய ஒரு ஊட்டச்சத்துள்ள ஃபிரூட்டு.
    info: இந்திய மாங்கன் 'திரோபிக் ஃபிரூட்ஸின் அரசர்' என அழைக்கப்படுகிறது. இது விட்டமின் A மற்றும் C ஆகியவற்றால் நிரம்பியது; தெற்கு ஆசியாவிலிருந்து வந்துள்ளது மற்றும் 4000 ஆண்டுகளாக மக்கள் இதனை வளர்த்து வருகின்றனர்.
  fruit.orange:
    label: பொமிரான்ச்
    summary: சுவையான கருத்தடை பழத்தின் வளைவான மல்லி இறகு.
    info: பொமிரான்ச் என்பது தெற்கு கிழக்கு ஆசியாவில் உருவான ஒரு சிட்ரஸ் பழம், நாடு முழுவதும் அதன் பயிரிடப்படுகிறது. இது விட்டமின் C ஐ நிரம்பியதும் ஜூஸ் ஆக பயன்படுத்தப்படுகிறது.
  fruit.pear:
    label: பைரஸ் குடும்பத்தில் உள்ள நீராவி மணக்கும் சற்று இனிய சுவையுடைய வட்ட வடிவ பழம்
    summary: சலினூர் ஒரு பைரஸ் குடும்பத்தில் உள்ள அருகில் ஆப்ரிக்க ஜாம்போனி என்ற மரத்தின் பழம். இது நெடுஞ்சுருக்கும் தன்மை மற்றும் உயர் கார்பொக்கோஹைட்ரேட் அளவு கொண்டது; நூற்றுக்கணக்கான வகைகள் உள்ளன.
    info: அருகில் ஆப்ரிக்க ஜாம்போனி என்ற மரத்தின் பழம் ஆனது ஹ்ருச்கா ஆகும், இது ஜாம்போனி மரத்தின் அருகில் உள்ளது. இது நெடுஞ்சுருக்கும் தன்மை மற்றும் உயர் கார்பொக்கோஹைட்ரேட் அளவு கொண்டது; நூற்றுக்கணக்கான வகைகள் உள்ளன.
  fruit.pineapple:
    label: அனானாஸ்
    summary: துட்டமில்லா மலைகள் கொண்ட துறவரசி பழம் மற்றும் நீலப்பச்சை உள்ள வடிவம்.
    info: அனானாஸ் தெற்கு அமெரிக்காவிலிருந்து வந்தது மற்றும் இப்போது உலகம் முழுவதும் உள்ள ஒரு துறவரசி பூமியில் வளர்க்கப்படுகின்றது. இது எளிதாக உணவு பொருட்களை செயலிழக்கச் செய்யும் பிரோமெலைன் என்ற ஏனைய உறுப்பு கொண்டுள்ளது.
  fruit.strawberry:
    label: ஜாஹோடா
    summary: சிவப்பு நிறம் கொண்ட சதையான மரக்கனி இது ஒரு திரள் உருவில் அமைந்துள்ளது.
    info: ஜாஹோடா ஆஃப் என்னஸ்ஸா என்ற இலை வாழ் தாவர குடும்பத்தில் உள்ள ஒரு பழம் ஆகும். இது வீட்டில் பயிரிடப்படும் ஜாஹோடா ஆகும். இது விட்டமின் C மற்றும் ஆக்ஸிடன்ட்களால் நிரம்பியது; இதன் காலம் ஏப்ரல் முதல் ஹூன் வரை ஆகும்.
  fruit.watermelon:
    label: வாட்டர் மெலன்
    summary: பசினி பட்டைகளுடன் காணப்படும் சதையான அடிவயிற்று உறவுடைய பழம்.
    info: வாட்டர் மெலன் ஆப்பிரிக்காவிலிருந்து வந்தது மற்றும் ஒரு பிரபலமான குளிர்கால பழமாகும். இது 92% தண்ணீரால் ஆனது மற்றும் இது லூட்டியோபென் என்ற ஊட்டச்சத்தை கொண்டுள்ளது, இது இதன் சிவப்பு நிறத்தை ஏற்படுத்துகிறது.
