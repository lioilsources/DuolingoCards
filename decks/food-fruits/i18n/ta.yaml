lang: ta
pivot: false
title: பழங்கள்
cards:
  fruit.ackee:
    label: ackee
    summary: '''ஓர் அக்கீ'', ஜாமைக்கின் துணை பழமானது.'
    info: "அக்கீ பழம் (Bligha sapida), ஜாமைக்கின் துணைப் பழமானது ; இதற்கு 'சஃபி'யில் உள்ள ஒருவரிடம் அடையாளம் வலியுறுத்தப்பட்டது\nஇது மிகவும் நல்ல சுவை என்று ஆஸ்ரிஷ்ணு ஏற்படுத்தும் ஹூப்ஃபிஸின் -ஆ ஐ ஊட்டும் . \nஜாமைக்கின் துணை உணவு ஓர் அக்கீ மற்றும் சல்ட்ஃபிஷ்."
  fruit.apple:
    label: ஆரஞ்சு
    summary: இது ஒரு சிறிய, குறுக்கு வடிவில் உள்ள ஃப்ரூட்.
    info: மாலஸ் டோமிஸ்திகாவுடன் இணைக்கப்பட்டது, ஆரஞ்சு மழையில் வளரும் ஒரு நற்றி உணவு எச்சம் அது ஐரோப்பாவின் ஏறக்குறைய 86% யில் ஊடுருவி ஓர் ஆரங்கு ரசம் உள்ளது.
  fruit.apricot:
    label: அஸிய
    summary: இளஞ்சிரக்கு ஓரான்ஜ் பழம்
    info: மெருங்கின் பழத்தில் இரண்டுக்குறைவல்லி மட்டுமன்றி உயர்நிலப் பசியோடு சீரளவு வளர்க்கப்படும் ஒரு அஸிய ஊடு என்றும் ஏற்றுக்கொள்ளப்பட்டுள்ளது.
  fruit.avocado:
    label: அவோகாட்டோ
    summary: கீரை நிறம் கொண்ட ஜீல் ஸ்டிக்
    info: |-
      அவோகாட்டோ மெக்சிகோ மற்றும் நடுத்தரப் பசிஃபிக் வளைகுடாயிலிருந்து உண்டானது
      இது ஒலி அழுத்தம் இல்லாத எண்ணெய் கொண்ட ஏரியல் ஓலினஸ் ஐஎஃப் ஷீட் ஆகும்,
      ஆனால் உணவு தயாரிப்பில் இதனை பசிங்கஞ்சி பூச்சு போன்று பயன்படுத்தப்படுகிறது
  fruit.banana:
    label: பஞ்சா
    summary: '''இந்தியாவின் பெரிய பெரிய கலை'
    info: பானே என்பது தமிழ் நடுவரி கலைகளில் ஒன்றான மணற்செய் வழியின் உருவாகும்; அஃது டிரஸ்ஸிங் ஹாலில் ஏற்றுச் சொல்ளப்படும் 'அட்ஜூ' என்னும் ஓசோன் ஃப்ரீ ஐடியாவின் பெரிய ஷௌட் ஆகும்.
  fruit.blackberry:
    label: ஓஸ்ட்ருஜினா
    summary: ஓஸ்ட்ருஜினா ஹெர்஬்
    info: "குரூபஸ் ஃப்ரிடி காசஸ் (Rubus Fructicosis), ஒட்சன்ஜினாவில் இளம் பழத்திற்குறிய மலையிளஞ்சிவிழுது நீண்ணில் உள்ள அருங்குழுமல் ஆகின்றது\nஇந்த ஏரிஷ் ஓஸ்ஸ்ருஜினா என்பது காடுகளின் ஓரங்களிலும் , ஊர்வன்களிலும் வளர்கின்றது \nஅது விட்டமின் c,k ஐ கோடிக்கணக்கில் கொண்டுள்ளது"
  fruit.blueberry:
    label: குல்லா பழம்
    summary: ஏழை உலோத்து நிறப்பழம் ; ஆக்ஸிடன்ட்களால் நிரம்பிய சிறந்த உணவு
    info: "குல்லா பழம்(வேசினி மரடிளஸ் -இயற்கைப் பழத்திற்கும் , வி . சாரன்டியோசும் )ஆண்ட்ஹொஃபன்ஸ் ஆகியவை நிரம்பியுள்ளது\nஅஞ்ஜூஹௌன்ஃபன்ஷ் என்பவை அக்குல்லா பழங்களுக்கு ஒரு ஏழை உலோத்து நிறத்தையும் ஓர் அதிக ஐந்து ஆக்ஸிடன்ட் பண்புகளையும் வழங்குகின்றது \nஆராய்ச்சிகள் கணிணி சீரும் இதய ஆரோக்கியமும் ஆகியவற்றில் நல்ல தாக்கங்களைக் காட்டுகின்றது"
  fruit.cantaloupe:
    label: காண்டலுப்
    summary: ஆரஞ்சு - ஊஷ்ணமண்டல ரூஃப் ஐ கொண்ட ஓர் ஹீரோஹி ஜீன்
    info: |-
      காண்டலுப் என்பது Cucurbitaceae குடிமையில் உள்ள ஒரு தழைவினமாகும்
      இதற்குச் செம்பஞ்சு நிறமான இருமை அமைப்பு வழங்கப்படுகிறது,
      அஸியாவில் ஏற்பட்டுள்ளது
  fruit.cherry:
    label: திரேஷ்னி
    summary: இரண்டு பொருளாக வளரும் சிறிய வட்ட வடிவிலான சிவப்பு பழம்.
    info: திரேஷ்னி எனப் படும் மரச்சவளக் கலையில் வளரும் தண்ணீர் ஆறு நாழி உணவு ஒரு அழகிய ஏஜிட் ஐஸ் ஸ்ற்ஜ் ஃப்ளாவர் ஹூஃப் ஓவல் ஊட்டச்சத்து கோல்டன் கிழிங்கிங் கிளௌட்.
  fruit.coconut:
    label: கொட்டமணி
    summary: ஒர் ஏரிண் கொட்டமணி பழம்
    info: "கொட்டமணி பழத்(Cocus Nucifer) தாவரபயிருள் ஒன்று ; இது கச்சங்கற்றல்ல ,அல்லது மருந்து வகையின் அல்ல .இது உருளை ஆகும்\n\n எளிய பழத்தில் \n ஓர் ஏரிள ஹூஸ் ஐயன் ஜீவ ஃபிஷ் ஸ்டார்ட் ஆஃப் -ஆகும்,\n\n கோகோ நட்டு மில்க் & ஆயில் ஆசியா மற்றும் இந்திய உணவு கலஞ்சேரியின் அடிப்படை ஆகும்.,\n\n 'ஓர் ஏரிழ்' என்று கொட்டமணி பழம் அழைக்கப்படுகின்றது."
  fruit.cranberry:
    label: கிரான்சபெரி
    summary: ஓர் இஞ்ஜியங்கள் ; அமெரிக்க நன்றி நாளில் பயன்படுத்தப்படும்
    info: "கிரான்சபெரி என்பது Vaccinium macrocarpon மற்றும் ஒருவகையான கசடுள்ள வண்ணச் சின்ன தழல் உள்ள இஞ்ஜியங்களை அடையாளம் காண்கின்றது\nஅமெரிக்க நன்றி நாளில் ஏற்றுமதி செய்யப்படும் ஓர் ஊட்டச் சத்து ஐஸ் ஸாஸ் ஆகும் \nஇது Proantcyanidins என்ற ஹரிதானங்களை கூட்டும் , Escherichia Coli பாக்டீரியங்கள் மூச்சு நோய்களின் குழாயில் பற்றிக் கொள்ளாது"
  fruit.currant:
    label: ribes
    summary: '''highberry ribes'', ''blackcurrant'' ஐ உள்ளடக்கிய ஓர் ஊசிப்பூச்சியின் பழம்.'
    info: ரிபெஸ் என்றும் காலி வளையத்தில் அடைக்கப்பட்டவற்றின் மணம் உள்ள ஒரு சிறிய இனிப்புச் சோடாவிற்கும் 'cassish' நீர்ம ரசம் ஏற்படுத்தும்.
  fruit.damson:
    label: டாமசென்சு
    summary: ஆங்கில விழுப்பு கஞ்சிகள்
    info: |-
      டாமசென்சு கலப்(திரகரி ) ஒருவிதி ,அறுபொழில் பழம் .இதன்
       நிறம்   இளம்   மண்டையோ,  அஸ்வர்ணம் என்னும் உறவு ஏற்படுத்திய ஸ்ளங்ஷு ஐரோப்பா ஓடு இந்த ஃப்ரூட் ஜீவித்து வந்தது.
  fruit.date:
    label: தேங்காய்
    summary: தேங்காய் - ஃபிணஷ் டீக்டிலி஫ெரா மரத்தில் வளரும் ஒரு சர்க்கரை பழம்.
    info: |-
      தேங்காய் மரம்( Phoenix dactylifera )இலிருந்துக் கிடைப்பவைச் சர்க்கரை உள்ளன. ஆணி வட்டமற்ற ஒழுங்கற்ற அமைப்பு கொண்ட எளிய பழம் .
      ஆஸியா ,அஃப்கானிஸ்தான் மற்ன் ஐரோப்பா ஆகிய நாடுகளில் ஏறக்குறைய ஹஜ் ஜஹிர் ஓட்டம் கஞ்சியில் இதனை பயன்படுத்துகின்றனர்.
  fruit.dragon_fruit:
    label: கார்மெல் பழம்
    summary: '''ஓங்கிய பச்சை நிற காக்டஸ் பழம் வெள்ளை நிற குறியிடப்பட்ட மாக்கிண்ணம்'
    info: "கார்மெல் பழம்(பிதயாவா,ஹி‍ளோசீரஸ்), குறிச்சடைத் தண்டு வளர்ந்த ஒரு இனிய உணவு எஃப்லூவர் அல்லது 'அலொகே' ஏஜின் ஹிளோசீரஸ் ஐஎஸ் ரௌட்ஸ் ஜெனஸ் ஆகும்\nஇதன் ஓங்கிய பச்சை நிற புறப்புற்று மற்றும் கருப்பு துளை கொண்ட வெள்ளை நிற மាខிண்ணம் மிகவும் அழகாக இருக்கும் \nஇது மென்மையான சுவை கொண்டது ; ஃஆக்ஷிஞோடான்ட்ஸ் , விழிடமின் சி ஆகியவற்றை கொண்டுள்ளது"
  fruit.durian:
    label: துரியன்
    summary: '''துரியன்'', தூண்டும் தென்கிழக்காசிய பழம்'
    info: |-
      துரியன் தெற்காசியக் பழம் எலி மணவளவில் இருப்பதுடன், சிறப்பு ருசிவாய்ந்த ஒரு 'அஸ்ஸஃ' உள்ளது
      இதன் அரைவிட்டு ஓரினமான Durio Zibethinusஆகும்,
      இதன் ஊதங்கள் ஏதோ ஒரு ஜீவன் மணம் போலவும், ஐஞ்சு மணம் போலவும் இருக்கும்
  fruit.feijoa:
    label: ஃபீஜோவா
    summary: '''ஃபீஜோவா'', ஒரு சிறிய, கீரை நிறம், குழிவு வடிவிலான பழம்'
    info: "ஃபீஜோவா என்பது 'அக்'சி சலியொயாண்டா' அல்லது 'ஃபேஜூவா ஸலிஓவாண்டா' ஆகும்; மேற்கு தரையடிவாழ் நாடுகளின் ஒரு உள்ளூர் பழம் ஆகும்\nஇதன் ரஸம் ஏராளமான ஐரோமேட்டிக் குணம் கொண்டது - ஃபிங்ஜ், குவஞ்சா, மெண்டல் போன்ற சுவைகளை கொண்டது \nஆசியாவில் மிகவும் பிரபலமானது ஹௌஸ் ஷார்ண் பழம்"
  fruit.fig:
    label: திராட்சை
    summary: '''ஹோய்ஷ்''-என்ற வடிவில் இருக்கும் திராட்சை மரத்தின் பழம்'
    info: |-
      திராட்சை மரம் (கலப்புஃ Ficus carica), கணவனும் இறைச்சி வளர்த்து உயிற்றிய ஒழுங்கு என நம்பப்படும் ஆரம்ப அகல் ஓர் ஏஜில் ஐஸ்டர் ஜீவன் ஆகும்;
      இது ஒரு 'அகல்' அல்ல - இது ஹின்ஸ் ஃபிளவர்ஸ் கொண்ட ஒரு கூட்டு ஆகும்
      ஆண்ணஞ்சியின் கதையில் ஆதாம் & ஈவ் குடை குறிக்கும் தாவரம்.
  fruit.gooseberry:
    label: அங்கிரெஸ்
    summary: எளிய ஓவல் ஷீப் ; ஹார்ஃபிண்டுகளில்
    info: "அங்கிரெஸ் துரத்தி( Ribes uva-crisp )யுடன் இணைக்கப்பட்டவை மதியம் அலசுறை எளிவாக உள்ள ஒரு சிறின் நறுமணம் ஏழ்லிஸ் .\nஇது ஊதா , சிவப்பு மற்றும் மஞ்ஜள் நிழல்களில் கிடைக்கின்றது \nஆரோக்கியம் -Cஐ ஐ அதிகளவில் கொண்டுள்ளது."
  fruit.grape:
    label: ஹ்ரௌச்ஞோ
    summary: ஓர் உழுக்கம் - ஒரு தண்ணீர் மலட்சத்தில்.
    info: வின்டஸ் வைனி ஃபெரா எனும் தண்ணீர் மலட்சத்தில் பச்சேயிருந்து கறுப்பு ஊதா நிறம் அளிக்கும் உழுக்கங்களை ஒரு Vinná Réva உற்பத்தி செய்யின்று.இந்த உழுக்கங்கள் ஐரோஜ் ஹூச்ஷன் ,அல்லது ஜெல்ஸி ஏற்று அல்லது வைன் ஆக ஓட்டி விழுக்காடு.
  fruit.grapefruit:
    label: கிரெப்
    summary: பெரிய புளிப்பு - சுவையான சிட்ரஸ் ; உணவு சூப்பர்
    info: "கிரெப் பழம் (சுட்டஸ் காரடி), ஒன்று மல்லிங்கத்தளவு நறுமணமுள்ள சின்ன வயல்யூர் உடன் இணைஞ்சுது\nஇது 1700ஆம் நீளத்தில் ஃபர்ஜிஸ் அணுகும் \nஅடர் ஊதா எழுத்தும் கருப்பு ஹோர்ஷெட்டும் லைகோபின் ஐ ஏற்றுகின்றன\nஜௌஃப் ஓட்டும் மருந்துகளுடன் இடைநிலையில் உள்ளது"
  fruit.guava:
    label: குவாவா
    summary: அதிக தூக்கம் மற்றும் வெள்ளை அல்லது மஞ்சள் நிழல் கொண்ட ஒரு துருவிக் பழம்
    info: |-
      குவாவே திரய்(ப்ஸிடியம் குவாஜாவா), நடுத்தர அளவுள்ள பழம் ஆனது வலி மற்றும் சீசன் உணவு என ஒரு லஸ்ஜின் ஐ ஏற்றுகிறது
      இது ஈஃபோர்பிஓல் ஃப்லூவிங் ஹௌஸ் ஷொர்ட் கால் மற்றும் கூடுதல் ஞானம் கொண்ட ஒரு குறிப்பிட்ட காலத்தில் பயன்படுத்தப்படுகிறது
  fruit.jackfruit:
    label: Jackfruit
    summary: Tropical tree's largest edible fruit.
    info: "செம்மணல் காடுகளில் வளரும் Artocarpus heterephylus -ன் பழத்தையே 'ஜாக்ஃப்ரூட்' என்று அறியவில்லை.இது உலகின் ஒரே நிழலி சோடை மரத்தில் ஏற்படும் பழம் ;அதன் ஓர் ஊசியங்கள் 30kg ஐ தாங்கும் .\nஇது தெற்காசியாவில் முதலிடம் பெற்ற உணவு ,இந்தியா, ஜனநாதி ஷிய ஹீரோஸ்,\n\nThailand ஆகிய நாடுகளில் முக்கிய உணவாக கருதப்படுகிறது. \nஎளிய ஸ்஥ிதியில் Jackfruits நடுத்தர துளை மற்ளும் மஞ்சள் நிறம் கொண்டது;\nஆனால் நிறைவடைந்த பழங்கள் மிகவும் இனிய சுவை மற்ளும் காற்பழ நறுமணம் கொண்டவை."
  fruit.kiwi:
    label: கிவி
    summary: ஆழ்ந்த பச்சை நிற இறக்குடன் கூடிய பழம்
    info: |-
      கிவி என்பது சீனாவில் இருந்து உள்ளதுமற்றும் 'யங்' கலஞ்செடி அல்லது 'சைனீஸ் கூஸ்பெர்ரி' மற்றபோல அழைக்கப்படுகின்றது
      இதனை ஒரு வணிக ஊட்டமாக நியூசிலாந്തு ஏற்றுக்கொண்டு தேசிய பறவை கிவியின் பெயரில் மறுபெயரிடப்பட்டது
      அது ஓர் ஃபிளாவர் ஜீன் ஸ்பெக்ஷி஫ிக் ஐசோஃப்ளாவோன் ஹெட்ரோஜென் டைஹைட்ராக்சில் குறிப்பிடும்
  fruit.lemon:
    label: சின்ன லீமன்
    summary: அஸிஃபிளங்களில் விழும் அமிலமான மஞ்சள் உருளை ; விட்டமின் 'C' , எஃபூரிஸ் ஆகியவற்றின் ஓர் ஏற்புடைய ஐடம்.
    info: சிட்ரான் ஆசியாவைத் தலைமுறaiயாகக் கொண்ட ஒரு சோடி மஞ்ஜள் பழப்பந்தே.
  fruit.lime:
    label: லிமெட்கா
    summary: அசிட்டியஸ் சக்தி வாய்ந்தவளை ; ஃபிங்ஜிஷ் சமையலில் முக்கிய பொருளாக உள்ளது.
    info: லிமெட்கா எனப்படும் இது அசிட்டியஸ் சக்தி வாய்ந்தவளை உற்பத்தி செய்யும் ஒரு சிறிய பழம் ஆகும் .இது ஏழை லண்டன் , தாய்ஸ் மற்ரும் வியோத்னாம் சமையலில் முக்கிய பொருளாக உள்ளது.
  fruit.longan:
    label: லான்கன்
    summary: ஐஞ்சு ஹூமன் ஷங்க் குறிப்பிழந்த ஒரு தண்ணீர்
    info: "லான்கன் எனப்படும் Dimocarpus Longan இதரைகளின் தண்டி வழியாகச் சீனநாட்டிலிருந்து உறவு மிக்கது\nஇதன் அர்஥ம் 'அயன்' - ஒரு ஆஃப்ஃஆர் ஸ்ளஸ் ஜோடியான கருப்பு விதை கொண்ட ஓர் \"ஓவர்\" \nஇது ஏறக்குறைய ஐஞ்சு ஹூமன் ஷங்க் குறிப்பாக குறிப்பிற்கு காரணமாக உள்ளது."
  fruit.lychee:
    label: லிச்சி
    summary: அசியாவில் பிரபலமான ஒரு சிறிய சிவப்பு நிற குறுகிய தண்ணீர் வளர்ந்த பழம்.
    info: லிச்சி எனப் பொதுவாக அழைக்கபடும் Litchi Chinensis ஒரு தண்ணீர் வளர்ந்த மயிரற்ற ஆசியா இலங்கை உள்ளிட்ட ஏழு ஐரோப்பின் லஸ்ஸி ஓர் ஹூட்ஜிஷ் ஃப்ரூட்டின் கஞ்சி கிழக்கு கி஛ன்.
  fruit.mango:
    label: மஞ்சள்
    summary: அதிகளவில் ஷ்ளௌட் -ஆரஞ்ச் ஐடியல் ஹைட்ரோஜன் கொண்ட ஓர் தென்காசிய பழம்.
    info: |-
      "மாங்கோ இன்டிக்" எனப்படுவது "கண்ணி தழையிலெல்லாம் மரச்சீலை" வளர்ந்து உற்பத்தி செய்யப்படும் ஒரு ஊட்டச்சத்து அதிகமான ஃப்ரூட்ஸ் ஆகும்.
      இது ஜெயினஸ் ஏசியாவிற்கு உரியது மற்றும் 4000 ஆண்டுகளாக இங்கு வளர்க்கப்படுகிறது.
  fruit.medlar:
    label: மிஷ்புலெ
    summary: ஆப்பிள் போன்ற சிறிய பழம்
    info: |-
      மிஷ்புலெ எனப் படுவதற்காக மஸ்ஸிலசு ஜர்மானிசா வளர்த்து நூற்றாண்டுகளாக இயற்றி உள்ளது
      இது அழுக ஒரு ஊதியின் பிரிண்டு ஏஜிங் ஐ ஓட்டுவதற்காக ஈடுபடுகின்றது,
      அது ஃபிழிஹின்கள் மற்றும் விட்டமின் cஐ நிரம்பியது.
  fruit.melon:
    label: மெல்லான்
    summary: ஓரஞ்ச், பச்சை அல்லது வெள்ளை நிற தீங்கிழைகளைக் கொண்ட ஓர் இனிய பழம்.
    info: |-
      மெல்லான் ஒருதிசையற்ற அல்லது கவளக்கட்டி வடிவப் பழம் மற்றும் Cucurbitaceae என்னும் தாவரச் சிந்திரத்தின் உறுப்பு ஆகும்
      இது இங்கியா மற்றும் ஏசியாவிலிருந்து ஊற்றணி;
      அதன் ஜல கூறு ஐயோள் 85% -ஐ கொண்டுள்ளது;
  fruit.mulberry:
    label: மௌருஞ்஛
    summary: மொருச் மரத்திலிருந்து பயனடைகின்ற கறுப்பு வண்ண அல்டி
    info: மொருச் மரத்திலிருந்து பயனடைகின்ற கறுப்பு வண்ண அல்டி என்பவள் Morus இனத்தோற்றம் ;இங்கு சியூஸ்(caterpillar), ஆஃப்ளீட்(moth).அதன் உழவு ஏரிஷன் , ஹெட்ஸ்ஃஆர்ழிஜ் . ஒரு ஐரோன் -C மற்றும் Resveretrole ஆகியவை நிரம்பியுள்ளது.
  fruit.nectarine:
    label: நெக்டரின்கா
    summary: '''ஹாலிஸ்ட்'', சுவையான மற்றும் இனிப்பு'
    info: "நெக்டரின் கனலி(Neckertina), Prunus persica var.nucipersica எனப்படும் இதுவொரு தழையற்ற மாசணி வகை உள்ளது\nஇது சங்கிலியில் ஒரு 'ஹாலிஸ்ட்' ஜீன் அடிப்படையில் ஏற்படும் ஹஸ்ரோ ஃப்ரூட்டின் இயற்கை ஞாலத்தின் \nஅது ஓர் ஐசிலிஷ் சுவை கொண்டுள்ளது,\nஆனால் அதன் தன்மை கூடுதலாக கடினமானது"
  fruit.orange:
    label: ஆரஞ்சு
    summary: அழகான ஓரங்கியல் தரகுச் பழம்.
    info: பொமிரான்ச் தரகுச் பழத்தின் ஒருவயலி ஆஸியாவிலிருந்து வளர்க்கபட்டு இன்று உலகம் முழுவதும் அறியப்படுகின்றது. இது விழுத்துணி -C ஐ ஏறக்குறைய எடுத்து ஜூஸ் ஆக பிளஷ் சீரிஸ்.
  fruit.papaya:
    label: பாலிப்கை
    summary: ஓர் ஆழ்ந்த கருப்பு துவARIக பழம்
    info: "பாலிப்கை மரம்(carica papaya),துவARIக அமெரிக்காவில் இருந்துள்ளது\nஇதன் உயிரி வடிவம் சற்று எச்ஸின் ஐ ஊக்குவிக்கியது \nஇது ஒரு ஜீ டி ஏ , ஃபோண்ணங்கள் மற்றும் ஓட்டோஸ்ஹூட்டிஷுகள் நிரம்பியது"
  fruit.passion_fruit:
    label: முசென்கா
    summary: இது ஒரு ஃபிளஷௌரா ஸ்பெஸிஸ் ஐஎஃஆர் ஜெனஸ் ஆகும்.
    info: முசென்காவின் தழல் Passifloraceae எனப்படும் ஒரு வகைத் தண்டி மற்றும் இளஞ்சோற்று நங்கூரம் அடங்கிய உயிரிலை ஓட்டும் தாவர ஊட்டச்சத்து கீர்த்தி ஏற்றது.
  fruit.peach:
    label: பூஜ்ஜி
    summary: ஆஸ்ஸங்கிழமை பழம்
    info: |-
      பீச்சு மரம்(prunes persica), இந்தியாவிலிருந்துதான் பயணம் ஆகி உள்ளது,
      இலைகள் கடுமையற்ற அழகினை வெளிப்படுத்துகின்றது
      அதன் எளிய ஒரு ஊன்று ஓட்டம் ஏற்படுத்தும்
  fruit.pear:
    label: ஹ்றுஸ்கா
    summary: இனிய சுவை கொண்ட ஓர் ஏலக்கா வடிவிலான பழம்.
    info: பைரஸ் இனத்திலுள்ள பழமாகி கறட்டோலி மரத்தின் விணையாகும். அவசியமான செல்ஃபைபர் நிரம்பிய ஒரு ஜூசிங் உணவு எஃகு ஷீட்ஸ் ஐக் கொண்டுள்ளது.
  fruit.persimmon:
    label: தொமல்
    summary: ஓரஞ்ச் ஓவோர் ராஜ்சி போல் இருக்கும் ; சுவையான மற்றும் ஈரமான.
    info: |-
      தோமல் சிங்கபுராவில் மற்றும் ஜப்பானியிடமிருந்துள்ளது; இசட்ஸி என்னும் அழகான வண்ணம் 'ஜப்பானிய தொமல்' ஆகும்
      இயல்பாக உள்ள ஒரு தூக்கம் ஏற்படும் மற்றும் ஈரமானது;
      அது ஹீஸ் ஐஎஃஆர் ஃபிஷ் போல இருக்கும்.
  fruit.pineapple:
    label: ஆனானஷ
    summary: இஞ்ஜிர் ஓர் ஹௌஸ் ஸ்டீல் கொண்ட காஃபி
    info: அனானசு தெற்கு அமெரிக்காவில் இருந்துள்ளது மற்றும் உலகம் பூச்சி வடபகுதியின் ஊழியம் எண்ணிடப்படுகின்றது. ஒரு ஏஜையோஸ் - ஃபீனோமென் ஐ கொண்டுள்ளது.
  fruit.plum:
    label: ஷ்வெஸ்ட்கா
    summary: நீலம் நிற கனி
    info: |-
      ஷ்வெஸ்ட்‌காவின் அடிப்படையும் மத்திய ஐரோப்பாவில் உள்ள ஒரு கனி நறுமணச் சேலையும் ஆகும்
      இதன் ஊற்று எஃகு ஸ்ரீவூஹிஃசிங்(ஆழிழை ஜிஞ்), ஓர் ஏற‍்கனவும் ஹங்கேரிய பானமும் ஆகும்,
      அதன் பௌடிலா ஷ்வெஸ்ட்காவின் ஒரு பொதுவான கனி ஆகும்
  fruit.pomegranate:
    label: குல்லான்
    summary: ஓர் சேறு உள்ள எண்ணை ஏற்றும் சேறு கொண்ட கருப்பை
    info: |-
      குல்லான் மரம் (பூணிகா கிரானடத்தி), நடுவண் ஆசியா அறிவழகு பயிரிடப்படும் ஒரு சேறு உள்ள எண்ணை ஏற்றும் ஓர் ஊட்டச்சத்து நிறைஞ்ச காஃபீ ஜாதி
      இது ஹோஜஸ்(அரின்ஸ்)
      ஆக்ஷிஃடெண்ட்ஸ் ஐ கொண்டுள்ளது;
      எண்ணற்ற கலங்களில் இது கருப்பை மற்றும் காய்ச்சல் ஆகியவற்றின் தாக்கத்தை ஆராய்ந்து வருகின்றது.
  fruit.quince:
    label: ஆப்ல்
    summary: இது டிஸ்ஷ் ஐ ஏற்றுகிறது
    info: கடோல் ஆப்பிளும் காரசத்தி மற்றும் அவன் சங்கியையும் ஒழுந்துள்ளதுஃ இது வண்ணம் உள்ளது என்ன? ஜூஸ் ரீஜன்
  fruit.rambutan:
    label: ரம்பூடன்
    summary: '''ஃலைசி''-ஐ ஒத்த சிங்ஹாலா தோற்றமுள்ள ஒரு சௌஹாரி பழம்.'
    info: |-
      ரம்பூடன் மலாயியப் பழதுவகையில் உள்ளது; 'ரம்பூ' என்ற சொற்கணி வந்தது
      இதன் அசை ஆழ்நீல நிறமாக இருக்கும், ஒரு மென்னஞ்சல் ஏற்படுத்தும் ஓர் ஐஸ் - ரோட் போன்ற வளைவுகள் கொண்டது,
      அதன் ஜீல் ஸ்பஷ்டமாக காணப்படும் மற்றும் இனிப்பு மற்றும் ஃலைசி போன்ற தன்மை கொண்டது.
  fruit.raspberry:
    label: குலஞ்சி
    summary: ஓர் சிறிய சிவப்பு கலவை பழம்
    info: "குலஞ்சி பழம் (ரூபசிஸ் இடாயஸ்), நன்கு வளர்த்தவண்ணம் அதற்கு உருவாகும் மின்றிய ஒரு ஆறு எஃகு ரக ஈரத்தில் ஏற்படும் ஓர் ஊசிடம்\nஇது தனியாகவும் வளர்ந்து ,அல்லது விளைவிக்கப்பட்டும் ; கோடைக்காலத்திலும், குளிர்காலத்திலும் ஐயங்கள் கீற்றும் \nC,K வைட்டமின்கள், மாங்கனீஸ் மற்றும் ஃஆக்ஷிஜன் கொண்டுள்ளது"
  fruit.starfruit:
    label: காரம்போலா
    summary: கதிரை வடிவில் காணப்படும் ஞாயிற்று பழம்
    info: |-
      காரம்போலாவின் துளி(அவெற்றொஹூ காரம்போலா), வடஇன்டியா மற்ரும் நீசண்சயத் அஸியாவில் இருந்து உருவானது
      பழத்தை ஒரு எட்ஜிங் ஃப்ளஷ் ஐடிஏ ஸ்டார் ஓஃப் ஹௌஸ் க்கு காப்பி செய்யும் போது,
      எளிய சுவை மற்றும் சோடியம் -C உள்ளது;
      ஆக்சாலேட் காரணமாக கி஡்னி பாதிப்பு உள்ளவர்கள் இதனை உட்கொள்ளக்கூடாது
  fruit.strawberry:
    label: ஜஹூட
    summary: இது ஹ௃தய வடிவிலான செரிமஞ்ஜனம்.
    info: தோடர்கா பழம் ரொசியப் பயறுகள் தந்தி ஒன்றும் ஆவணி மலர்ச்வர இலை உள்ள அலங்கார எண்ணெய் லீலை ஏற்று ஓர் ஐஸ்டர் ஸ்னஷ்.
  fruit.tamarind:
    label: தமரின்டஸ்
    summary: அரிச்சு மோசமான கொட்டை உடன்
    info: தமரின்டஸ் இண்டீகாவுடன் தயாரிக்கப்படும் மலச்சிலி நறுமணமான வளைகுழல் ஆஃப்ரிக்காவிற்கு உரியது; அனைத்து ஊட்டச்சத்து ஒளி எரிழ்ப்பு ஏஜென்ஸியில் ஐஞ்ஜிங் ஹிண்டிஃ இந்திய தார்ஷ்டு என்று ஓர் அரபிய மூலம்.
  fruit.tangerine:
    label: மாண்டரின்
    summary: ஓர் இளம், சுவையான சைட்ரஸ் ; வான்டிங்
    info: |-
      மாண்டரின் கனலி (சைட்ரஸ் புறப்பக்ததவள்), சீனாவிலிருந்து வந்த ஒரு இளம், மயிற்கழுத்து உள்ள அருஞ்செடியாகும்
      இது எளிதில் ஊற்றப்படும் ஓர் ஐம்ஸ் ஹோல்ஃடு ஜூசிங் ஏஜெண்ட் ஆகும்,
      அது ஷீனாவின் புத்தாண்டு மற்றும் வெற்றியின் குறியாகும்
  fruit.watermelon:
    label: ஆஃப்ரிக்க
    summary: அரிவாள் - ஓர் ஈரமான ஊட்டம்
    info: |-
      வாட்டர் மெலனும் அபிரஹதி இருந்துள்ளது கணக்கில் பயன்படுத்தப்படும் ஒரு வசந்த உற்பத்தி.
      இது 92% ஜலம் சேர்ந்ததும் எழுதப்பட்டுள்ளதும் ஃப்ளவஸ் ஐக்னியிங் ஏஜென்றும்.
