lang: ko
pivot: false
title: 과일
cards:
  fruit.apple:
    label: 사과
    summary: 달콤하고 산미가 있는 빨간색 또는 녹색의 둥근 과일입니다.
    info: 사과는 사과나무(Malus domestica)에서 나는 열매로 세계적으로 가장 많이 재배되는 작물 중 하나입니다. 비타민 C와 식이섬유를 함유하고 있으며, 현재까지 약 7,500개 이상의 품종이 존재합니다.
  fruit.banana:
    label: 바나나
    summary: 달콤한 살이 있는 노란 열대 과일입니다.
    info: 바나나는 열대 식물인 마우스과의 열매로, 칼륨과 천연 당분을 풍부하게 함유하고 있어 에너지를 빠르게 공급합니다.
  fruit.cherry:
    label: 체리
    summary: 쌍으로 자라는 작은 둥근 붉은 열매
    info: 체리는 여름철 인기 있는 과일로 항산화 물질과 멜라토닌을 함유하고 있습니다. 달콤한 품종과 새콤달콤한 체리류가 모두 존재합니다.
  fruit.grape:
    label: 포도
    summary: 덩이 모양으로 자라나는 작은 둥근 과일입니다.
    info: 와인 포도(Vitis vinifera)는 초록색에서 짙은 보라색까지 다양한 색의 덩어리를 생산합니다. 이 포도는 신선하게 먹거나 건포도로 말려먹을 수도 있고, 와인으로 눌러서 마실 수 있습니다.
  fruit.mango:
    label: 망고
    summary: 열대 과일로 노란 주황색 육질이 풍부한 열매입니다.
    info: 인도 망고는 '열대 과일의 왕'으로 알려져 있습니다. 비타민 A와 C가 풍부하며 남아시아에서 기원전부터 4천 년 전부터 재배되어 왔습니다.
  fruit.orange:
    label: 오렌지
    summary: 향이 나는 주황색 껍질을 가진 둥근 시트러스 과일입니다.
    info: 오렌지는 동남아시아에서 유래한 시트러스 과일로, 오늘날 전 세계적으로 재배되고 있습니다. 비타민 C가 풍부하며 주스로도 인기가 많습니다.
  fruit.pear:
    label: 배
    summary: 눈 모양의 과일로 달콤하고 부드러운 맛이 난다.
    info: 배는 사과와 가까운 친척인 배나무에서 나는 열매입니다. 육질은 부드럽고 수분이 풍부하며 식이섬유 함량도 높습니다. 수백 가지 종류가 있습니다.
  fruit.pineapple:
    label: 파인애플
    summary: 가시덤불 같은 외피와 노란 과육을 가진 열대과일.
    info: 파인애플은 남아메리카 원산이며 현재 세계의 열대지역에서 재배되고 있다. 소화를 돕는 효소 브로멜라이신이 들어있다.
  fruit.strawberry:
    label: 장미
    summary: 표면에 씨가 있는 붉은 하트 모양의 열매입니다.
    info: 정원 장미는 루즈비타과에서 나는 인기 있는 과일로 비타민 C와 항산화 물질이 풍부합니다. 여름철에 수확하며 달콤하고 향긋한 맛을 가지고 있습니다.
  fruit.watermelon:
    label: 물melon
    summary: 녹색 줄무늬가 있는 큰 과일로 붉은 색의 육질과 검은 씨앗이 있다.
    info: 물melon은 아프리카에서 유래한 것으로 여름철에 인기 있는 과일이다. 이 과일은 92%가 물이며 레토필이라는 붉은 색소를 함유하고 있다.
