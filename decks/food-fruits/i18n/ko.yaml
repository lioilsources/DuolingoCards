lang: ko
pivot: false
title: 과일
cards:
  fruit.ackee:
    label: 아키
    summary: 자메이카의 국과로, 익으면 노란 가종피만 먹는 붉은 열대 과일.
    info: |-
      아키(Blighia sapida)는 자메이카의 국과다.
      이름은 1793년 이 과일을 옮긴 블라이 선장에서 유래했다.
      익어서 노랗게 벌어진 가종피만 먹을 수 있고 덜 익거나 너무 익으면 독성(하이포글리신 A)이 있다.
      원산지는 서아프리카이며 노예무역 시기에 카리브해로 들어온 것으로 보인다. '아키와 소금대구'는 자메이카의 대표 요리다.
  fruit.apple:
    label: 사과
    summary: 달콤하거나 새콤한, 빨강 또는 초록의 둥근 과일.
    info: 사과는 사과나무(Malus domestica)의 열매로 세계에서 가장 많이 재배되는 과일 중 하나다. 비타민C와 식이섬유가 풍부하며 품종이 7,500가지가 넘는다.
  fruit.apricot:
    label: 살구
    summary: 작고 주황색인 달콤한 돌과일.
    info: |-
      살구(Prunus armeniaca)는 중앙아시아에서 유래했다.
      유럽 전역에서 재배되며 가장 단 것은 터키와 스페인산으로 꼽힌다.
      베타카로틴과 비타민A가 풍부하다.
      말린 살구는 건강 간식으로 인기가 많다.
  fruit.avocado:
    label: 아보카도
    summary: 크리미한 과육으로 과카몰레의 재료가 되는 열대 과일.
    info: |-
      아보카도(Persea americana)는 멕시코와 중앙아메리카가 원산지다.
      식물학적으로는 과일이지만 요리에서는 주로 채소처럼 쓴다.
      올리브유처럼 몸에 좋은 단일불포화지방(올레산)이 많다.
      아보카도 토스트는 현대 카페 문화의 상징적인 음식이다.
  fruit.banana:
    label: 바나나
    summary: 달콤한 과육을 가진 노란 열대 과일.
    info: 바나나는 파초과 식물의 열매로 칼륨과 천연 당분이 풍부해 에너지를 빠르게 준다.
  fruit.blackberry:
    label: 블랙베리
    summary: 가시덤불에서 자라는 짙은 보라색 복합 열매.
    info: |-
      블랙베리(Rubus fruticosus)는 가시덤불에서 자라는 짙은 보라색 복합 열매다.
      야생 블랙베리는 숲 가장자리와 덤불에서 자란다.
      비타민C와 카로틴, 심장에 좋은 항산화 물질이 풍부하다.
  fruit.blueberry:
    label: 블루베리
    summary: 항산화 물질이 풍부한 짙은 청보라색 슈퍼푸드 열매.
    info: |-
      블루베리에는 안토시아닌이라는 항산화 물질이 풍부하다.
      이 색소가 열매를 짙은 파란색으로 만들며 강한 항산화 작용을 한다.
      연구에 따르면 기억력과 심장 건강에도 좋다.
      정원에서 기르는 큰 재배종이 숲속 야생종보다 알이 크다.
  fruit.cantaloupe:
    label: 칸탈루프
    summary: 그물 무늬 껍질에 주황색 과육을 가진 멜론.
    info: |-
      칸탈루프(Cucumis melo var. cantalupensis)는 인기 있는 멜론 품종이다.
      이름은 로마 근처 교황 별장 칸탈루포에서 유래했다.
      주황색 과육에 베타카로틴과 비타민A가 풍부하며 멜론 중에서도 달기로 손꼽힌다.
  fruit.cherry:
    label: 체리
    summary: 짝을 지어 자라는 작고 둥근 붉은 열매.
    info: 체리는 여름에 인기 있는 과일로 항산화 물질과 멜라토닌이 들어 있다. 달콤한 품종과 새콤한 품종이 모두 있다.
  fruit.coconut:
    label: 코코넛
    summary: 섬유질 껍질 속에 흰 과육과 물이 든 큰 열대 씨앗.
    info: |-
      코코넛(Cocos nucifera)은 생물학적으로는 과일이 아니라 씨앗(핵과)이다.
      덜 익은 열매 속의 코코넛 물은 천연 이온 음료다.
      코코넛 밀크와 기름은 동남아시아와 인도 요리의 기본 재료다.
      코코넛 나무는 쓰임새가 많아 '천 가지 쓸모의 나무'로 불린다.
  fruit.cranberry:
    label: 크랜베리
    summary: 아메리카 전통 요리에 쓰이는 작고 새콤한 붉은 열매.
    info: |-
      크랜베리(Vaccinium macrocarpon)는 작고 새콤한 붉은 열매다.
      미국 추수감사절의 크랜베리 소스로 전통적으로 쓰인다.
      세균이 방광 벽에 달라붙는 것을 막는 프로안토시아니딘이 들어 있어 요로 감염 예방에 도움이 된다고 연구로 밝혀졌다.
  fruit.currant:
    label: 까치밥나무 열매
    summary: 송이로 자라는 작고 빨갛거나 검거나 흰 열매.
    info: |-
      까치밥나무(Ribes) 열매는 송이로 달리는 작고 빨갛거나 검거나 흰 열매다.
      비타민C가 가장 많은 것은 검은 까치밥나무 열매로 카시스 음료의 재료가 된다.
      붉은 열매는 젤리를 만들거나 디저트를 장식하는 데 쓴다.
  fruit.damson:
    label: 담슨자두
    summary: 정원에서 자라는 작고 짙은 색의 자두.
    info: |-
      담슨자두는 작고 짙은 파랑에서 검정으로 변하는 자두 품종이다.
      이름은 이 열매가 유럽에 전해진 통로인 다마스쿠스에서 유래했다.
      날로 먹으면 매우 시지만 잼이나 담슨 진 같은 가공품에 아주 잘 맞는다.
  fruit.date:
    label: 대추야자
    summary: 대추야자나무의 달콤한 갈색 타원형 열매.
    info: 대추야자(Phoenix dactylifera)는 대추야자나무의 달콤한 열매다. 중동에서 수천 년 동안 주요 식량이었다. 당분이 60%가 넘어 에너지원으로 잘 알려져 있다.
  fruit.dragon_fruit:
    label: 용과
    summary: 흰 과육에 검은 씨가 박힌, 선인장에서 나는 분홍색 열대 과일.
    info: |-
      용과(피타야, Hylocereus)는 멕시코와 중앙아메리카가 원산지다.
      선명한 분홍색 껍질에 검은 씨가 박힌 흰 과육이 있어 매우 장식적이다.
      맛이 순하고 부드러우며 항산화 물질과 비타민C가 들어 있다.
  fruit.durian:
    label: 두리안
    summary: 강한 냄새를 풍기는 큰 가시투성이 열대 과일로 '과일의 왕'으로 불린다.
    info: |-
      두리안(Durio zibethinus)은 '과일의 왕'으로 불린다.
      강한 냄새 때문에 많은 아시아 호텔에서 반입이 금지되지만 매력적으로 여기는 사람도 많다.
      두꺼운 과육은 크림 같고 달며 견과, 바닐라, 치즈가 섞인 복합적인 맛이 난다.
      동남아시아에서 진미로 여겨진다.
  fruit.feijoa:
    label: 페이조아
    summary: 향이 진한 과육을 가진, 작고 초록색인 타원형 열매.
    info: 페이조아(Acca sellowiana)는 남아메리카가 원산지다. 파인애플과 구아바, 박하를 연상시키는 진한 향이 나며 뉴질랜드에서 가을에 특히 인기가 많다.
  fruit.fig:
    label: 무화과
    summary: 씨가 많고 달콤한, 물방울 모양의 무화과나무 열매.
    info: |-
      무화과는 사람이 재배한 가장 오래된 과일 중 하나로 약 1만 년 전까지 거슬러 올라간다.
      사실은 열매가 아니라 수많은 작은 꽃이 안에 든 꽃차례다.
      성경에서 아담과 하와가 몸을 가린 잎이 바로 무화과 잎이다.
  fruit.gooseberry:
    label: 구스베리
    summary: 정원에서 흔히 기르는, 작고 반투명한 둥근 열매.
    info: |-
      구스베리(Ribes uva-crispa)는 중부 유럽 정원에서 흔한 작은 열매다.
      초록, 빨강, 노랑 품종이 있다.
      비타민C가 풍부하다.
      예로부터 구스베리로 담근 술이 인기가 많았다.
  fruit.grape:
    label: 포도
    summary: 송이로 자라는 작고 둥근 과일.
    info: 포도(Vitis vinifera)는 초록에서 짙은 보라까지 다양한 색의 송이로 열린다. 날로 먹거나 건포도로 말리거나 포도주로 담근다.
  fruit.grapefruit:
    label: 자몽
    summary: 크고 새콤달콤한, 영양이 풍부한 감귤류 과일.
    info: |-
      자몽(Citrus paradisi)은 오렌지와 포멜로의 교잡종이다.
      17세기에 바베이도스에서 처음 기록되었다.
      분홍색, 붉은색 자몽에는 리코펜과 베타카로틴이 들어 있다.
      여러 약물과 상호작용하므로 복용 중인 사람은 의사와 상의해야 한다.
  fruit.guava:
    label: 구아바
    summary: 향이 강하고 흰색 또는 분홍색 과육을 가진 열대 과일.
    info: |-
      구아바(Psidium guajava)는 열대 아메리카가 원산지이며 지금은 열대 아시아와 아프리카에 널리 퍼져 있다.
      오렌지보다 비타민C가 더 많다.
      껍질과 씨까지 모두 먹을 수 있는 영양가 높은 과일이다.
  fruit.jackfruit:
    label: 잭프루트
    summary: 나무에서 열리는 세계에서 가장 큰 과일.
    info: 잭프루트는 열대 아시아가 원산지이며 인도와 방글라데시, 태국에서 주식으로 먹는다. 덜 익은 잭프루트는 맛이 담백해 채식주의자들이 고기 대용으로 쓴다.
  fruit.kiwi:
    label: 키위
    summary: 갈색 솜털 껍질에 초록색 과육을 가진, 비타민이 풍부한 열매.
    info: |-
      키위(Actinidia deliciosa)는 중국에서 유래했으며 그곳에서는 양타오(중국 다래)로 불렸다.
      뉴질랜드가 상업적으로 키우면서 국조인 키위새의 이름을 따 지금 이름이 되었다.
      비타민C가 오렌지의 두 배나 된다.
  fruit.lemon:
    label: 레몬
    summary: 시고 노란, 향이 진한 감귤류 과일.
    info: 레몬은 아시아에서 유래한 신맛 나는 감귤류다. 비타민C와 구연산이 풍부하다. 요리와 음료뿐 아니라 화장품과 세제에도 쓰인다.
  fruit.lime:
    label: 라임
    summary: 작고 새콤한 초록색 감귤류 과일.
    info: |-
      라임(Citrus aurantiifolia)은 신 즙과 향긋한 껍질을 가진 작은 초록색 감귤류다.
      멕시코와 태국, 베트남 요리에 빠지지 않는 재료다.
      레몬보다 비타민C는 적지만 향이 강하다.
      과거에는 뱃사람을 괴혈병에서 지켜 주었다.
  fruit.longan:
    label: 용안
    summary: 리치와 가까운, 작고 갈색인 열대 과일.
    info: |-
      용안(Dimocarpus longan)은 중국이 원산지인 열대 나무의 열매다.
      투명한 과육과 검은 씨 때문에 '용의 눈(龍眼)'이라는 이름이 붙었다.
      달콤하고 향긋하며 전통 한방에서는 혈액과 심장을 튼튼하게 하는 음식으로 여긴다.
  fruit.lychee:
    label: 리치
    summary: 껍질이 우툴두툴한 붉은, 투명한 과육의 열대 과일.
    info: |-
      리치(Litchi chinensis)는 중국에서 유래한 열대 과일이다.
      우툴두툴한 붉은 껍질 속에 반투명한 흰 과육이 들어 있다.
      달콤하고 향긋한 맛이 난다.
      중국에서는 행복과 번영의 상징으로 여겨진다.
  fruit.mango:
    label: 망고
    summary: 노란 주황색 과육이 풍부한 열대 과일.
    info: 망고는 '열대 과일의 왕'으로 불린다. 비타민A와 C가 풍부하며 남아시아에서 4천 년 넘게 재배되어 왔다.
  fruit.medlar:
    label: 서양모과
    summary: 작고 갈색이며 수확 뒤 물러야 먹을 수 있는, 사과 비슷한 과일.
    info: |-
      서양모과(Mespilus germanica)는 중세부터 재배된 오래된 과수다.
      수확 뒤 물러질 때까지 후숙해야 먹을 수 있다.
      폴리페놀과 비타민C가 풍부하며 셰익스피어 작품에도 등장하지만 오늘날에는 애호가들의 정원에 주로 남아 있다.
  fruit.melon:
    label: 멜론
    summary: 주황, 초록, 흰 과육을 가진 크고 달콤한 과일.
    info: 멜론은 아프리카와 아시아에서 유래한 과일로 전 세계에서 재배된다. 수분 함량이 매우 높아 몸의 수분을 잘 채워 준다.
  fruit.mulberry:
    label: 오디
    summary: 누에의 먹이가 되는 뽕나무의 짙은 색 열매.
    info: 오디는 뽕나무(Morus) 열매로 검은 오디가 가장 달다. 흰 오디와 붉은 오디도 있으며 뽕나무 잎은 비단 산업에서 중요한 역할을 해 왔다.
  fruit.nectarine:
    label: 천도복숭아
    summary: 껍질에 털이 없는, 달고 즙 많은 복숭아.
    info: |-
      천도복숭아(Prunus persica var. nucipersica)는 껍질이 매끄러운 복숭아의 자연 돌연변이다.
      보통 복숭아와 다른 점은 껍질에 털이 없다는 것뿐이다.
      맛은 비슷하지만 과육이 좀 더 단단하다.
      이름은 신들의 음료 넥타르에서 따왔다.
  fruit.orange:
    label: 오렌지
    summary: 향이 나는 주황색 껍질을 가진 둥근 감귤류 과일.
    info: 오렌지는 동남아시아에서 유래한 감귤류로 오늘날 전 세계에서 재배된다. 비타민C가 풍부하며 주스로도 인기가 많다.
  fruit.papaya:
    label: 파파야
    summary: 향긋한 주황색 과육을 가진 큰 열대 과일.
    info: |-
      파파야는 아메리카에서 유래한 열대 식물이다.
      단백질 소화를 돕는 파파인 효소가 들어 있다.
      비타민C와 베타카로틴, 항산화 물질이 풍부하며 덜 익은 파파야는 동남아시아 요리에서 채소처럼 쓴다(파파야 샐러드 등).
  fruit.passion_fruit:
    label: 패션프루트
    summary: 주름진 자주색 껍질 안에 향긋한 씨앗 과육이 든 열대 과일.
    info: 패션프루트(Passiflora edulis)는 열대 아메리카가 원산지다. 꽃 속에서 그리스도의 수난을 본 선교사들에게서 이름이 유래했다. 과육 속에는 향긋한 젤에 싸인 씨가 가득하다.
  fruit.peach:
    label: 복숭아
    summary: 부드러운 솜털이 있는 분홍빛 돌과일로 여름을 상징한다.
    info: |-
      복숭아(Prunus persica)는 중국에서 유래한 과일로 불로장생의 상징이다.
      부드러운 솜털이 난 껍질이 특징이다.
      흰 것과 노란 것이 있으며 천도복숭아는 껍질이 매끈한 변종이다.
      중국에서는 복숭아를 설날과 치유 신화에 등장시킨다.
  fruit.pear:
    label: 배
    summary: 방울 모양에 달고 부드러운 과일.
    info: 배는 사과와 가까운 배나무의 열매다. 과육이 부드럽고 즙이 많으며 식이섬유가 풍부하다. 수백 가지 품종이 있다.
  fruit.persimmon:
    label: 감
    summary: 토마토 모양의 주황색 열매로 잘 익으면 매우 달다.
    info: 감(Diospyros kaki)은 중국과 일본에서 유래한 과일이다. 덜 익으면 떫지만 잘 익으면 꿀처럼 달다. 비타민A와 C, 무기질이 풍부하다.
  fruit.pineapple:
    label: 파인애플
    summary: 가시 돋친 껍질과 노란 과육을 가진 열대 과일.
    info: 파인애플은 남아메리카가 원산지이며 지금은 세계의 열대 지역에서 재배된다. 소화를 돕는 브로멜라인 효소가 들어 있다.
  fruit.plum:
    label: 자두
    summary: 브랜디의 원료가 되는, 작고 타원형인 보라색 돌과일.
    info: 자두(Prunus domestica)는 중부 유럽의 대표적인 과일이다. 슬리보비츠라는 체코, 슬로바키아 전통 증류주의 원료이며 가을에 수확한다.
  fruit.pomegranate:
    label: 석류
    summary: 달콤한 씨가 수백 개 든, 다산의 상징인 붉은 열매.
    info: |-
      석류(Punica granatum)는 중앙아시아와 지중해 지역에서 유래했다.
      붉은 껍질 속에 투명한 붉은 알갱이가 600개 넘게 들어 있다.
      항산화 물질이 풍부하며 심장 건강과 항염 효과가 연구되고 있다.
  fruit.quince:
    label: 마르멜로
    summary: 사과와 비슷하고 단단해 보통 익혀 먹는 과일.
    info: |-
      마르멜로(Cydonia oblonga)는 사과, 배와 가까운 과일로 날로는 단단하고 시다.
      늘 익혀서 먹으며 잼이나 과실주로 만든다.
      펙틴이 많아 젤리 만들기에 좋으며 유럽 최초의 마멀레이드(15세기)도 이 열매로 만들었다.
  fruit.rambutan:
    label: 람부탄
    summary: 리치와 가까운, 붉고 털이 난 열대 과일.
    info: |-
      람부탄(Nephelium lappaceum)은 말레이시아에서 유래했으며 이름은 말레이어로 '털'을 뜻하는 rambut에서 나왔다.
      붉고 부드러운 털 같은 돌기가 난 껍질을 가졌다.
      과육은 투명하고 달며 리치와 비슷한 맛이 난다.
      칼슘과 철분 같은 영양소가 풍부하다.
  fruit.raspberry:
    label: 라즈베리
    summary: 여름 정원을 상징하는 붉은 복합 열매.
    info: |-
      라즈베리(Rubus idaeus)는 여러 작은 알갱이가 모인 복합 열매다.
      야생에서도 자라고 재배도 하며 여름과 가을에 수확한다.
      비타민C와 K, 망간, 항산화 물질이 풍부하다.
      잼이나 시럽으로도 많이 만든다.
  fruit.starfruit:
    label: 스타프루트
    summary: 자르면 별 모양이 되는 노란 열대 과일.
    info: |-
      스타프루트(Averrhoa carambola)는 남아시아와 동남아시아가 원산지다.
      가로로 자르면 완벽한 별 모양이 되어 '별 과일'로도 불린다.
      새콤달콤하고 상큼하며 비타민C가 많다.
      신장 질환자는 옥살산 성분 때문에 피하는 것이 좋다.
  fruit.strawberry:
    label: 딸기
    summary: 표면에 씨가 박힌, 붉은 하트 모양의 열매.
    info: 딸기는 장미과에 속하는 인기 있는 과일로 비타민C와 항산화 물질이 풍부하다. 여름에 수확하며 달콤하고 향긋하다.
  fruit.tamarind:
    label: 타마린드
    summary: 태국 요리의 기본 재료가 되는, 새콤한 갈색 꼬투리 과육.
    info: |-
      타마린드(Tamarindus indica)는 열대 아프리카가 원산지이며 지금은 세계의 따뜻한 지역에서 재배된다.
      과육은 매우 시고 달며 팟타이와 우스터 소스, 인도 처트니에 쓰인다.
      이름은 '인도 대추야자'를 뜻하는 아랍어에서 왔다.
  fruit.tangerine:
    label: 귤
    summary: 작고 달며 껍질이 잘 까지는 감귤류로 연말에 즐겨 먹는다.
    info: |-
      귤(Citrus reticulata)은 중국에서 유래한, 작고 껍질이 잘 까지는 감귤류다.
      중국 설날과 행운의 상징이다.
      유럽에서는 크리스마스를 대표하는 과일이다.
      비타민C와 항산화 물질, 플라보노이드가 들어 있다.
  fruit.watermelon:
    label: 수박
    summary: 초록 줄무늬 껍질 안에 붉은 과육과 검은 씨가 든 큰 과일.
    info: 수박은 아프리카에서 유래한 여름철 인기 과일이다. 92%가 물이며 붉은 색소인 리코펜이 들어 있다.
