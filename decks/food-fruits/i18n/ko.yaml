lang: ko
pivot: false
title: 과일
cards:
  fruit.ackee:
    label: ackee
    summary: 붉은 열대성 과일로서 한 입 크기이고, 그 안에는 노랑색 일러가 들어있다. 자메이카에서 국가적 상징 의미를 지닌 과실.
    info: '아키(Ackee)(학명: Blighia sapida)는 자메이카의 국과이다. 이 이름은 캡틴 블라이(1793년)에게서 유래되었다. 먹을 수 있는 것은 오직 익어 노란색 아릴(aril) 부분뿐이며 미숙하거나 과하게 익었으면 독성이 있다(hypoglycine A). ''Ackee와 소금 생선''은 자메이카 전통 요리로 알려져 있으며 원산지는 서부 아프리카다. 식민지화 시기에 대량 포박 무역으로 카리브해 지역에 도입된 것으로 추정된다.'
  fruit.apple:
    label: 사과
    summary: 달콤하고 산미가 있는 빨간색 또는 녹색의 둥근 과일입니다.
    info: 사과는 사과나무(Malus domestica)에서 나는 열매로 세계적으로 가장 많이 재배되는 작물 중 하나입니다. 비타민 C와 식이섬유를 함유하고 있으며, 현재까지 약 7,500개 이상의 품종이 존재합니다.
  fruit.apricot:
    label: 복숭아
    summary: ' 작게 생긴 오レン지를 모양을 한 작은 돌과일로서 맛있으며 신선합니다.'
    info: |-
      {"hint":"작은 주황색 돌과일","info":"복숭아(Prunus armeniaca)는 중앙 아시아에서 유래되었습니다。
      체코와 전유럽에서도 재배되며 가장 달콤한 것은 터키와 스페인의 것입니다。
      beta 카로틴 및 비타민A가 다량 함유되어 있습니다。
      건조 복숭아는 건강 간식으로 인기가 많습니다。","label":"복숭아","summary":"작고 오렌지 색깔 과실이며 단맛이 있고 삶입니다."}
  fruit.avocado:
    label: 아보카도
    summary: 크림 같은 맛의 열대성 구아카몰레 재료.
    info: |-
      아보카도(Persea americana)는 멕시코와 중미 원산지입니다.
      ботаниcznie 과일이지만 요리에서는 주로 채소처럼 사용됩니다.
      올리브 오일과 마찬가지로 건강한 단불포화 지방질인 올레ϊ노비케 산을 함유하고 있습니다.
      세계적으로 건강 식품으로 인기가 있으며, 아보카도 토스트는 현대 카페 문화의 상징적 음식입니다.
  fruit.banana:
    label: 바나나
    summary: 달콤한 살이 있는 노란 열대 과일입니다.
    info: 바나나는 열대 식물인 마우스과의 열매로, 칼륨과 천연 당분을 풍부하게 함유하고 있어 에너지를 빠르게 공급합니다.
  fruit.blackberry:
    label: 블랙베리
    summary: 가시덤불 나무 위에 나는 진한 보랏빛 복합 과일
    info: 블랙베리(Rubus fruticosus)는 가시덤불에 자라며 짙은 보라색을 띠고 있는 복합 열매입니다. 야생의 블랙베리는 숲 가장자리와 관목지대에서 발견됩니다. 비타민C, 카로틴 및 심장 건강에 좋은 항산화 물질이 풍부합니다.
  fruit.blueberry:
    label: blueberry
    summary: 짙은 청자색 열매로, 항산화제를 많이 함유하고 있는 슈퍼푸드입니다.
    info: 블루베리(Vacium myrtillus는 야생이고 Vacium corymbosum은 재배된 것임)(Blueberry)에는 항산화 물질인 안토시아닌이 풍부합니다. 이 성분들은 블루베리를 짙게 파란색으로 만들며 강력한 항산화 작용을 합니다. 연구에 따르면 인지 기능과 심장 건강에도 긍정적인 영향을 미칩니다. 정원에서 자라는 큰 크기의 고버스터(blueberries highbush) 종류가 숲속 작은 야생종보다 더 큽니다.
  fruit.cantaloupe:
    label: 칸탈루пе
    summary: 노란 갈색 무늬를 가진 메elon으로 짙게 주홍빛 육질을 가지고 있습니다.
    info: 칸탈루페(Canteloupes Cucumis melo var.cantalupensis)는 아시아에서 유래한 인기 있는 멜론 품종입니다. 이름은 로마 근처의 교황 궁전 칸탈로포(Cantalupo)에 기원합니다. 오렌지색 곡물이 베타카로틴과 비타민A가 풍부하며 가장 달콤한 종류 중 하나입니다.
  fruit.cherry:
    label: 체리
    summary: 쌍으로 자라는 작은 둥근 붉은 열매
    info: 체리는 여름철 인기 있는 과일로 항산화 물질과 멜라토닌을 함유하고 있습니다. 달콤한 품종과 새콤달콤한 체리류가 모두 존재합니다.
  fruit.coconut:
    label: 은
    summary: 섬세하고 단단한 외피에 흑색 고운살을 지닌 대규모 열대 신품종의 겹과입니다.
    info: '{"hint":"대형 열대 코코넛으로 섬유질 껍데기를 가진 것(Cocus nucifer)","info":""은 검징못횥쿏기잰쾨일쪽(헨쳠 Cocos nucifera); 생물학적으로는 겨자와 같지 않지만 과일이 아니라 종실이다."\n"미숙한 과일 안의 콩나무 물은 천연 이온 음료다."\n"콩나무 우유 및 기름은 동남아시아와 인도 요리에서 기본 재료가 된다."\n"콩나무 나무는 ''천 가지 용도를 갖춘 나무'' 또는 생명수로 불린다","label": "은", "summary": "섬세하고 단단한 외피에 흰 살을 지닌 대규모 열대 지역의 겉"'
  fruit.cranberry:
    label: kransberri
    summary: 산뜻한 빨간 작고 신맛 나는 열매이며, 미국의 전통적인 음식 재료이다.
    info: 크랜베리는 Vaccinium macrocarpon이라는 작은 산미가 있는 붉은 열매입니다. 미국식 감사절 요리인 크랜베리 소스로 전통적으로 사용됩니다. 이 과일에는 대장균이 방광과 같은 배뇨기 계열 벽에 달라붙는 것을 막아주는 프로안토시아니딘 성분을 포함하고 있으며, 비뇨 기도감염증 예방 효과를 과학적 연구에서 입증했습니다.
  fruit.currant:
    label: 리뷔츠
    summary: 가지 위에서 자라나는 작고 적색·흑색 혹은 백색 과일.
    info: 리비스(Ribes)는 이삭 모양의 무성한 작은 빨간색 또는 검은색 열매입니다. 가장 많은 비타민C를 함유하고 있는 것은 천천히 익어가는 검정 리비즈인 '검은 리브스'이며, 이 제품으로 만들어진 카시스 맛을 가진 잭슨과 영국음료 리벤에 사용됩니다. 붉은 리베르스는 젤리를 만들거나 디저트 장식용으로도 쓰이곤 합니다.
  fruit.damson:
    label: 담슨
    summary: 영국의 시골 정원에서 자라는 작은 어두운 색상의 살구
    info: 다마스커네 스베스트카(당손)는 작고 짙은 파랑에서 검정색으로 변하는 살구 품종입니다. 이름은 다마스크(Damaskus/Damasco)에서 유래되었으며 이 곳을 통해 열매가 유럽에 전해졌습니다. 생식에서는 강한 산미를 띠지만 젤리와 포도주인 당손 진(damson gin) 등 가공품에는 매우 적합합니다.
  fruit.date:
    label: 데이틀
    summary: 달甜美하고 갈색 타원형 형태로 된 데이트 나무(Pheonix Dactlyfera)의 과실이다.
    info: 데이트(Datle)(Phoenix dactylifera)는 낙타 무화과나무의 달콤한 열매입니다. 수천 년 동안 중동 지역에서 주요 식량으로 사용되었습니다. 당분 함유율이 60% 이상이며 에너지 공급원으로 널리 알려져 있습니다.
  fruit.dragon_fruit:
    label: 용과
    summary: 분홍빛 열대성 선인장의 과일이며 백반점 무늬가 나는 육즙.
    info: 용과(피타야 또는 하이로케루스(Hylocereus))는 멕시코와 중미 원산이다. 생동감 넘치는 분홍색 껍질에 검은 씨가 있는 흰 과육으로 매우 장식성이 높다. 맛있고 부드러운맛을 가지고 있으며 항산화 물질 및 비타민C를 함유하고 있다.
  fruit.durian:
    label: 두리안
    summary: 강한 향기와 가진 큰 첨단 모양의 열대과일로, '열대과일 중 황제'라고 합니다.
    info: 두리안(Durio zibethinus)은 열대 과일의 왕으로 불립니다. 강한 냄새는 일부에게 거부감을 줍나 다른 이들에게 매력적인 것으로 여겨지며 많은 아시아 호텔에서는 금연됩니다. 두꺼운 살코기는 크림색이고 달콤하며 복합적 맛(호두, 바닐라, 치즈)이 있습니다. 동남아에서 고급 요식품으로 소중하게 여기고 먹습니다.
  fruit.feijoa:
    label: pegoja
    summary: 향기로운 고형물이 있는 작은 타원형인 초록색 열매
    info: 페조아(Acca sellowiana 또는 Feijoa sellowiana)는 남미 원산지의 과일입니다. 그 육질은 강한 향이 나는 맛(파인애플과 비슷), 구아바와 멘톨을 연상시키며 뉴질랜드에서는 가을철에 매우 인기가 있습니다.
  fruit.fig:
    label: 피크
    summary: 야자수 피카스 카리파에 의해 생산되는 감 같은 모양의 달콤하고 씨앗 많은 열매.
    info: 인간이 키우는 가장 오래된 과일 중 하나로 기록은 약 1만 년 전까지 거슬러 올라갑니다. 사실 이 것은 열매가 아니라 수천 개의 작은 꽃으로 가득한 용기입니다. 성경 이야기에서 아담과 에바에게 덧대었던 나뭇잎들은 무화과나무 잎을 의미합니다.
  fruit.gooseberry:
    label: '"앙레슈트"'
    summary: '"작고 원형이며 반투명한 씨앗으로서 정원에 많이 재배됩니다."'
    info: |-
      {"hint":"작고 투명한 녹색 또는 렌즈 모양의 과일(Ribes uva-crispa)","info":"앙레슈트(Angrešt)( Ribes uva-crispa )는 중부 유럽 정원에서 특징적인 작은 열매입니다.
      녹색과 붉은 그리고 노란 종류가 있습니다.
      비타민C로 가득합니다.
      당근 와인처럼 앙레슈트를 사용하는 음료는 역사적으로 인기가 많았습니다."}
  fruit.grape:
    label: 포도
    summary: 덩이 모양으로 자라나는 작은 둥근 과일입니다.
    info: 와인 포도(Vitis vinifera)는 초록색에서 짙은 보라색까지 다양한 색의 덩어리를 생산합니다. 이 포도는 신선하게 먹거나 건포도로 말려먹을 수도 있고, 와인으로 눌러서 마실 수 있습니다.
  fruit.grapefruit:
    label: 그레이프푸르트
    summary: 크고 쓰면서 달콤한 귤류 과실이며 영양학적으로 우수하다.
    info: 그레이프푸르트(Citrus paradisi)는 오렌지와 풀라오의 하이브리드이다. 17세기에 바베도스에서 처음 기록되었다. 분홍색과 빨간 그레이프푸르트에는 리코펜 및 베타카로틴 성분이 들어 있다. 과일 주사는 많은 약물들과 상호작용하므로 환자는 반드시 의사에게 알려야 한다.
  fruit.guava:
    label: 과화
    summary: 향기 강하고 속살이 하얀색 또는 분홍빛인 열대 과일
    info: 과화(Guaya Guayaba)(학명 Psidium guajava)는 열대 아메리카에서 기원한 과일로 현재 열대아시아와 아프리카 전역에 널리 퍼져 있습니다. 오렌지보다 비타민C가 약간 더 많습니다. 껍질은 물론 씨도 모두 먹을 수 있으며 전체적으로 영양이 높은 식품입니다.
  fruit.jackfruit:
    label: 잭과일
    summary: 세상에서 나무에 자라는 가장 큰 과실인 커다란 첨두 모양 열대 과물.
    info: 잭과일은 열대 아시아 원산이며 인도와 방글라데시 및 태국에서 주식으로 먹는다. 미성숙한 잭과일의 질감이 중립적이어서 채식주의자들이 고기 대용품으로 사용한다.
  fruit.kiwi:
    label: 키위
    summary: 갈색이고 모직 같은 외피를 가진 녹내장 열매이며, 비타민이 풍부합니다.
    info: 키위(Actinidia deliciosa)는 중국에서 유래되었으며, 그곳에서는 양타오 또는 차이나 과일로 불립니다. 뉴질랜드가 상업적으로 개발하고 국조인 키와이새 이름을 따서 현재의 명칭으로 바꾸었습니다. 비타민C 함량은 오렌지보다 두 배나 됩니다.
  fruit.lemon:
    label: lemon
    summary: 산성이 짙고 노란색을 띠는 감귤류 과실로, 비타민C 및 특유의 향기를 제공하는 대표적인 심황향(에센셜 오일)
    info: 레몬은 아시아에서 유래한 산성 시트러스 과일입니다. 비타민C와 구연산이 풍부합니다. 요리나 음료뿐 아니라 화장품과 청소제에도 사용됩니다.
  fruit.lime:
    label: Limes
    summary: 작고 새콤달콤한 초록빛 귀요운 열대 식재
    info: '{"hint":"작은 녹색 산미 있는 시트러스 과일(Citrus aurantiifolia)","info":"라임(Limetka)은 신맛이 나는 즙과 향긋한 껍질을 가진 작은 초록빛 귤이다.\nmexico와 태국 그리고 베트남 요리에서 필수적인 재료다. \ncitron보다 비타민C가 적지만 강력한 냄새를 지닌다. \nlime의 섭취는 항해자들을 졸음병(비타민 부족으로 인함)으로부터 보호한다."}'
  fruit.longan:
    label: 롱간
    summary: 리치와 관련된 갈색 작은 열대 과실
    info: 롱간(Longgan)은 중국 원산지인 열대 나무의 과일입니다. 이름은 '룡안(龍眼)'으로 드래곤 눈을 의미하며 투명한 살과 검정 씨앗 때문에 붙여졌습니다. 달콤하고 방향이 나는 맛이며 전통적인 한약에서는 혈액 및 심장을 강화하는 음식으로 여겨집니다.
  fruit.lychee:
    label: 리치
    summary: 빨강색 작은 열대 곡물이며, 푸른 식감이 있는 것이 특징이다. 동아시아 지역에서 인기가 많다.
    info: '{"hint":"작고 빨간 표면이 거친 열대 과일로 투명한 살을 가지고 있음(Litchi chinensis)","info":"리치(lichi)(학명 Litchi chinensis)는 중국에서 기원된 열대과일입니다.\n거칠게 생긴 붉은 껍질 속에는 반투명하고 하얀살이 드러납니다.\n달콤하면서도 고혹적인 아ромATIC 맛을 지니며,\n중국에서는 행복과 번영의 상징으로 여겨집니다."}'
  fruit.mango:
    label: 망고
    summary: 열대 과일로 노란 주황색 육질이 풍부한 열매입니다.
    info: 인도 망고는 '열대 과일의 왕'으로 알려져 있습니다. 비타민 A와 C가 풍부하며 남아시아에서 기원전부터 4천 년 전부터 재배되어 왔습니다.
  fruit.medlar:
    label: mispul
    summary: 작고 갈색이며 사과에 닮았으며 수확 이후 익혀먹어야 합니다.
    info: 미스풀레(Mispelus germanica)는 중세부터 재배되어 온 오래된 과수원 작물입니다. 수확 후 부드러워질 때까지 숙성시켜야 먹을 만합니다. 이 과일은 폴리페놀과 비타민C가 풍부하며 셰익스피어의 '로메오와 줄리엣'에도 언급됩니다만 오늘날에는 정원사들의 애호 대상으로 남아 있습니다.
  fruit.melon:
    label: melon
    summary: 달콤하며 오렌지색이나 녹색 혹은 흰 색깔 육질을 가진 큰 과실입니다.
    info: 수박은 아프리카와 아시아에서 기원한 열대성 또는 서부열대성 과일로 전 세계적으로 재배되고 있습니다. 수분 함량이 매우 높으며 대부분의 종류는 물을 포함하고 있으며 이에 따라 체내를 효과적이고 잘 보충할 수 있는 특징을 가지고 있습니다.
  fruit.mulberry:
    label: 봉
    summary: 검푸른 색깔의 과일로, 모스 벌레에게 먹이가 된다.
    info: 뽕나무(Morus 종류)의 열매인 봉은 검정색으로 가장 달콤하다. 흰 뽕과 붉은 뽍도 있으며, 이들은 실크 산업에 중요한 역할을 해왔다.
  fruit.nectarine:
    label: 네타르이나
    summary: 털 없는 부드러운 과육으로 달콤하고 주스 많은 복숭아
    info: 네크타리나(Prunus persica var. nucipersica)는 매끄러운 표피를 가진 복숭아의 자연적인 돌연변이입니다. 일반 복숭아와 유일하게 다른 점은 피부가 매끄럽다는 것입니다. 맛은 비슷하지만 더 단단한 질감을 가지고 있습니다. 이름은 신들의 음료인 넥터에서 따왔으며 그 완벽함에 대한 인식을 반영합니다.
  fruit.orange:
    label: 오렌지
    summary: 향이 나는 주황색 껍질을 가진 둥근 시트러스 과일입니다.
    info: 오렌지는 동남아시아에서 유래한 시트러스 과일로, 오늘날 전 세계적으로 재배되고 있습니다. 비타민 C가 풍부하며 주스로도 인기가 많습니다.
  fruit.papaya:
    label: 파파야
    summary: 향긋한 주황빛 육체가 특징인 큰 열대 과일이다.
    info: '{"hint":"과즙이 풍부한 오렌지색 열대 과일","info":"파파야는 아메리카 지역에서 유래된 열대 식물입니다. 단백질 소화를 돕는 효소인 파바인이 포함되어 있습니다. 비타민C와 베타 카로틴 그리고 항산화 물질을 많이 함유하고 있으며, 미숙한 상태의 파파야는 동남아시아 요리를 위해 채소처럼 사용됩니다.(예: 생선 샐러드 등)","label":"파파야","summary":"향긋한 주황빛 육류가 특징적인 큰 열대 과실."}'
  fruit.passion_fruit:
    label: 과즙나무
    summary: 주름진 자홍색 외피와 풀향기 나는 종자 내용물을 지닌 열대 과일.
    info: 마치엔카(Passiflora edulis)는 열대 아메리카에서 기원한 식물입니다. 이름은 꽃 속에 그리스도의 고난을 상징하는 것으로 보았던 선교사들로부터 유래되었습니다. 과육 안에는 향긋한 젤 형태로 포장된 씨앗이 가득합니다.
  fruit.peach:
    label: 복숭아
    summary: 부드러운 황갈색 분홍빛 돌맹이 열매; 여름을 나타내는 식물.
    info: |-
      복숭아(Prunus persica)는 중국에서 유래된 과일로 불멸의 상징이다.
      그 부드러운 털이 있는 표면은 특별히 구분된다.
      흰색과 노란색 종류가 있으며, 넥타린(nectarines)은 매끄럽고 푹신한 변종이다.
      중국에서는 복숭아를 새해와 치유 신화에 포함시킨다.
  fruit.pear:
    label: 배
    summary: 눈 모양의 과일로 달콤하고 부드러운 맛이 난다.
    info: 배는 사과와 가까운 친척인 배나무에서 나는 열매입니다. 육질은 부드럽고 수분이 풍부하며 식이섬유 함량도 높습니다. 수백 가지 종류가 있습니다.
  fruit.persimmon:
    label: том멜
    summary: 토마토 모양의 주황색 열매이며 단맛 있고 씁쓸함.
    info: 톰멜(Diospyros kaki)은 중국과 일본에서 기원한 과일로 체코에서는 '야생 톰멜'으로 알려져 있습니다. 미성숙 상태의 텀 Mellon 을 삶아 먹을 수 있으며 성숙하면 꿀처럼 달콤합니다. 비타민 A와 C 그리고 무기질이 많이 들어있습니다.
  fruit.pineapple:
    label: 파인애플
    summary: 가시덤불 같은 외피와 노란 과육을 가진 열대과일.
    info: 파인애플은 남아메리카 원산이며 현재 세계의 열대지역에서 재배되고 있다. 소화를 돕는 효소 브로멜라이신이 들어있다.
  fruit.plum:
    label: 자두
    summary: фи알라 색깔의 작은 타원형 돌맹이 과실로서, 브랜디 및 포도 주스 제조 원료
    info: 체리과(Prunus domestica)인 자두는 중부 유럽의 대표적인 과일이다. 슬리보비차라는 전통 체코와슬로바키아 증류주를 만드는데 사용되며 가을 수확 시즌에 나는 특별한 열매다.
  fruit.pomegranate:
    label: гранатовое яблоко
    summary: 붉고 수천 개의 달콤한 씨가 있는 열매이며 생식력의 상징입니다.
    info: 그라나타 사과(Punicagranatum)는 중앙 아시아와 지중해 지역에서 기원합니다. 투명한 붉은 과육(알리스) 안에 무려 600개 이상의 씨앗이 들어 있습니다. 항산화 물질로 가득 차 있으며 식품과학 연구에서는 그 영향을 마음 건강 및 염증 방지 효과를 중심으로 조사하고 있습니다.
  fruit.quince:
    label: 쿠도레
    summary: 사과처럼 하얀색이고 딱딱한 외형을 지닌 고향은 일반적으로 조리를 통해 섭취된다.
    info: 과일인 쿠도레(Cydonia oblonga)는 사과와 배에 가까운 식물로 생으로 먹을 때에는 단단하고 신맛이 난다. 항상 열처리를 거쳐 소비되는데 예를 들어 멤프릴라 잼이나 포도주 및 즬화주는 모두 이 과실에서 만들어진다. 펙틴 함량이 높아 젤리류 제조에도 적합하다고 알려져 있으며 유럽 최초의 기록된 마멀레이드(15세기) 역시 이 곡물을 사용하였다.
  fruit.rambutan:
    label: 람부탄
    summary: 붉은색이고 수염처럼 생긴 열대 과일로 리치에 가깝습니다.
    info: |-
      람부탄(Nephelium lappaceum)은 말레이시아에서 유래되었으며 이름이 말라야어의 'rambut' 즉 ‘머리카락’을 의미합니다。
      그 열매는 붉고 부드러운 털 같은 돌기가 있는 껍데기를 가지고 있으며,
      과육은ใส고 달콤하며 리치와 비슷한 맛입니다。
      또한 라문타누스에는 칼슘과 철분 등 영양소가 많이 들어 있습니다.
  fruit.raspberry:
    label: strawberry
    summary: 복합적인 붉은 열매이며 정원에서 여름의 상징
    info: 딸기( Rubus idaeus )는 여러 작은 과실(drupplets)로 이루어진 복합과일이다. 약초처럼 자라기도 하고 재배되며 여름철이나 가을에 수확한다. 비타민C와 K, 망간 및 항산화 물질이 풍부하다. 딸기를 이용한 잼 또는 심지 않은 사과식초 같은 전통 음식도 있다.
  fruit.starfruit:
    label: 카арам볼라
    summary: 자른 후 병채 형태의 노란색 열대 과실
    info: 카람보라(Averrhoa carambola)는 남아시아와 동남아시아에서 기원한 열대 과일입니다. 횡단 방향으로 자르면 완벽하게 별 모양을 만들기 때문에 '별과일'로도 불립니다. 산미가 있는 달콤하고 상큼한 맛이 특징이며 비타민C 함량이 높습니다. 신장 질환자는 이 과일에 포함된 옥살산 성분때문에 섭취를 피하는 것이 좋습니다.
  fruit.strawberry:
    label: 장미
    summary: 표면에 씨가 있는 붉은 하트 모양의 열매입니다.
    info: 정원 장미는 루즈비타과에서 나는 인기 있는 과일로 비타민 C와 항산화 물질이 풍부합니다. 여름철에 수확하며 달콤하고 향긋한 맛을 가지고 있습니다.
  fruit.tamarind:
    label: 타amarin
    summary: 갈색 씹기 좋은 꽃다발 모양으로 신맛 나는 육질을 가진 것; 태국 요리를 위한 기본재료.
    info: 타마린드(Tamarhindu indica)는 열대 아프리카 원산이며 오늘날에는 전 세계의 온난 지방에서 재배됩니다. 과육은 매우 산미가 강하고 달콤하며 팟 타이와 Worcestershire 소스 및 인도 체니에 사용됩니다.'tamr hind'라는 단어는 '인도 낙지석류'를 뜻하는 고대 아랍 어휘입니다. 이 식물성 음식은 포트폴로(포르말데히드 성분), 비타민B군과 철을 풍부하게 함유합니다.
  fruit.tangerine:
    label: 귤
    summary: 작고 달콤하며 쉬게 깎아낼 수 있는 오렌지 형태의 감귤류로서, 연말 축하 행사에 자주 이용되는 식품.
    info: |-
      만다린( Citrus reticulata )은 중국에서 유래한 작고 쉽게 껍질을 벗길 수 있는 귤이다.
      이것은 중화 신년과 행운의 상징이며,
      체코에서는 전형적인 크리스마스트리 과일로 사용된다.
      비타민C와 항산화제 그리고 플라보노이드를 포함하고 있다.
  fruit.watermelon:
    label: 물melon
    summary: 녹색 줄무늬가 있는 큰 과일로 붉은 색의 육질과 검은 씨앗이 있다.
    info: 물melon은 아프리카에서 유래한 것으로 여름철에 인기 있는 과일이다. 이 과일은 92%가 물이며 레토필이라는 붉은 색소를 함유하고 있다.
