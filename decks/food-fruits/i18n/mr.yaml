lang: mr
pivot: false
title: फळे
cards:
  fruit.ackee:
    label: एकि
    summary: एक ऐषाऱ्याक औषधी फळ जामईकाच्या राष्ट्रीय फळाच्या रूपात
    info: |-
      अकीचे फळाचा प्रसिद्ध कॅप्टन बलेहवर समुदाय होतो
      फक्त मऊ झालेले पिवळे भाग खाण्यासाठी उपयुक्त आहेत; बर्‍यापैकी नश्शी जखडणारे घटक
      जामईकाचे एक ओढ डगं इथले छांव थाऊक
  fruit.apple:
    label: सफरचंद
    summary: गोल गुलाबी किंवा हिरवे डझटय़ खाद्य.
    info: सफरचंदी जांभळ्या पिकलेले होते कि मुख्य समृद्ध उपजवण्याचे झडप आहे. त्यामध्ये 'C' विटअमिन अन् फाइबर भरपैकी शोषिणे ; 7 , 500 प्रकार एवढे ओरौड बघायला मिळते.
  fruit.apricot:
    label: मरूनका
    summary: छोटी नारंगी फँली ; मधुर आम्ल आणि रसाळ
    info: "मरूनका ही मध्य आशियामधले स्थानिक प्रजेत कोंबडय़चे झाड असते. \nहि चुटकीवर जप्त भारतीय व इखरच्छ उगवण्यास शक्ल देखील धरते;\nअदभुत गठ्ट बीटा-करोटेन एवढे ऑफर करते।\nआईएम घाळलेल्ह मरृऊनका फाईबर ओझे ऊष्ण औषधी ऐथे ऋऋ ऍउओ ष्‱"
  fruit.avocado:
    label: अवकाडॉ
    summary: '''क्रीमी'' औषधी फळ ; गुऐकमोलेचा आधार.'
    info: |-
      अवकाडॉ मेक्सिको आणि केंद्रीय अमेरिका पासुनचं वटलं गेलं आहे। हे सत्यप्रमाणे एक फळ आहे, परंतु तसं शेपबाजारी दृष्टिकोनाने बजारामध्ये भाजीभाजी म्हणून चालतं
      एखाद्या ओलिव ऑईलशी झालेल्या खाऊ घाईगड ऍलिइड धर्माच्या ठायी थोडी छान ऐठी ढीग आढ़ळते,
      आजच्या जगामध्ये ते 'फिट' खाण्याच्या ट्रेंडमध्ये आहे;
      अवकाडॉ टोस्ट आधुनिक कौफे संस्कॄतीचा चिऩीकर आहे.
  fruit.banana:
    label: बनान
    summary: गवतावर झडणाऱ्या गोडटयाशी भरलेल्या खरई.
    info: बांदरू एका म्होसे प्रजातीच्या किरमणुकेचं फळ आहे हे स्पष्टपणे दखल घेण्यासाठी. बाजारामध्ये उपलब्ध असते.
  fruit.blackberry:
    label: ओष्ऱुझिऩा
    summary: गडद छापेहार रंगाचा बेरी
    info: |-
      ब्लॅकबेरी हा रुबस्‍ प्रजाति किंवा संतरईच्या मोठय़ा झाडाचा एखादा गडद बेःगलमधील फळ आहे
      अनेक वनपशु जण इथे उभे ठाणे घेऊन शिरताना धोका टाळतात,
      आणि खासकरून भाषा ओळखण्यामध्ये ऐटीएफ ऑउटपुट थोडा ढीला असतो.
  fruit.blueberry:
    label: blueberry
    summary: उघडलेल्या ठिसठर ढगाच्या रंगाची औषधी ईर्‍फ
    info: "ब्लूबेरीमध्ये एंथोसाइन हा पदार्थ मुख्यपणे सहभागितेने क्रमशः अति उच्च ऑक्सिडेटिव्ह शक्ती आढळवली जाऊ शकते. \nअगदी छोटया प्रमाणामध्ये ब्लूबेरी घेण्याद्वारे धडाके फक्त खाओ ऐवजी झापटा भरतात."
  fruit.cantaloupe:
    label: कंटलूप
    summary: हलके-भौराचे ऐठा आकाराचे औषधी जमिनीचा वसईय़ाचा पदार्थ
    info: |-
      कंटलूप हा आशियामधील मेलोनच्या प्रजातीत करण्याचे सुरवात झालेले एखादा जमिनीचा वसईय़ाचा पदार्थ असतो
      हा शब्द गडगाठीत खाण्डेसाहेबापासून उभारलेल्या 'कंटलू' धर्मघराकडून टाळला जाईल
      अफझली ओरेञ्ज फलकाभाऊ इथे ऑक्षि - करोटीन आणि विटामिनए छान ढीग असते
  fruit.cherry:
    label: तांदूळ
    summary: एक छोटी ,गोल बेरी झाकून घेईल.
    info: तांदूळ ही प्रुनस जेनरा मध्ये समाविष्ट कोंबडयाचे फ़ल आहे. त्यामध्ले एंटीऑक्सिडंट अणि मेलाटॉनिनचे गुण आढळतात ; खजूरपाणखर शिरशीवर देऊ करताहेत.
  fruit.coconut:
    label: कोथिंबरू
    summary: तापमानाचे विषम नारङ्गी जे धारक असलेले आहे
    info: "कोथिंबरू कोनस न्युईफेरा ही पालमेचं फळ आहे ; सभोवतीच मऊपणा असलेली खोली वग़रे धडधट झाड दखलदार तयार करते .\nअश्रुष्ट बीजामध्ये जे पाणी भरलेले असते , एक प्रकारचे इओनिक पेय घरापासून शेतीपर्यंत उपयोगाचे ठरते \nआउट ऑइल आणि कोथिंबरू गाऊठ ओएल ईश्टन ऍशिया आणि भारतीय छाँसेही थाऱ्याच ढीग ऐवजी औषधी आढळते"
  fruit.cranberry:
    label: ब्रसिन्का
    summary: लहान चमचटीयेणे ; अमेरिकन धन्यवाद उत्सवाच्या अतिरिक्त असलेले.
    info: |-
      ब्रसिन्का ही एक मामूली कोरडवळ पुदिने संपत्ति असणारी लहान चमचटीयेणे आहे
      अमेरिकन धन्यवाद उत्सवाशी संबधित ब्रसिन्का सौंदर्भ घटक आहे,
      एखावीज गठनापाहुन जगभरातील डाइथीओफैनाथिओन झाटपट फाऊंडशन ऑफ खालच्छे ठिकाण ऐवजी ढ़कल ऍई।
  fruit.currant:
    label: ribez
    summary: छोटे लाल, काळे किंवा सफेद भापटामध्ये
    info: |-
      रिबेसच्या झाडीवर कोंबले समजते हळदट प्रकृति मध्ले गुठगुठे असतात।
      डार्क रिबेज (ribes nigra) हा एखादया फ़ruit मध्नने Vitamine-C चे सर्वाधिक प्रमाण आहे。
      एका britsh drink ribena आणि liqueur cassis इथे खाश टेंशन घाईतात।
  fruit.damson:
    label: डाँमस्केन्स्का शवेष्टका
    summary: छोटी ढवऱ शवेष्टका
    info: |-
      डामस्केन्सका शवेष्टका ही मलई किंवा सुरळीचे प्रजनन असणारी छोटी वृंतमध्यप्रदेश आहे,
      याचे डाहशक एबीएफ ला उगवले गेले जखात फ़ल इथे ऑइरोपा मध्ये पोहोचले
      अभापक बादामी खाण्यासाठि थोडे झाई भाऊ घािलत ओष्ध औषधी आऊढे ऐठे आउ गिऩ मध्ये उपयोग होतो
  fruit.date:
    label: दाढ
    summary: अंथरुण इष्टर ऑफ ओएलिव्ह ऍउरिः छोटे ऋतुओं में और ऐतिहासिक रूप से उत्तर पूर्व एशिया में।
    info: दातूनींचे फळ प्रमुखत्वेने सहा हजार किलोग्रामपर्यंत मधुरक असलेले आणि ऊर्जेचे महत्पूर्ण स्थाईय देखील घडवते.ईश्लामिक धर्माशी संबंधित 'इफ्टार' उपवासाच्या बंदटीला सुरुवात करण्यासाठी डेट्स एक पारंपारिक भाग झाले.
  fruit.dragon_fruit:
    label: ड्रॅकी फळ
    summary: गुलाबी ठाण्ढे कक्टस खाऊ और ऐठे बिना ऋभु बढ़े फँल।
    info: |-
      ड्रॅकी फळाचे पितहया ह्युलोसरेसचे मध्माशन किंवा सदमध्ये उगवते।
      जबरदस्त गुलाबीपट्टी आणि व्हाइटफ्लेष एखाद्या डझंशन नष्पतीए जाईल。
      अत्क्छुर रस धरते;
      आंतर्भाघित ऑक्झीडंट ऍंटीओक्सिडंट ओई विटामिऩ सी थे।
  fruit.durian:
    label: दुरियन
    summary: एक बड़ा खुरदरा उष्ण कटिबंधीय फल जिसकी गंध बढ़िया और खास होती है
    info: |-
      दुरियन हा एक प्रचंड मांसलीय उष्ण कटिबँधीय फळे आहेतजो 'उष्णतम सबवृशभ' म्हणून ओळखला जाईल
      फळाची गंध अगदी विलक्षण नाखूश करते
      अनेक भारतीय हॉटेलमध्ये दुरियन घेऊन शिस्त ठेपली जाइल
      इथली डझिम झिथिनस धर्मप्रामाण्याऐवि टेढ छाया और ऑईली चटक ऋतुओंमें विशेष रूप से लोकप्रिय होऊ लागते
  fruit.feijoa:
    label: फेझोईला
    summary: छोटा अणḍळ रंगाचा फ़लडा.
    info: फेजोआमध्ये तीव्र परिमाणक कसा सुगंध होतो (अनानासचे महूदय, गुएवा).
  fruit.fig:
    label: फिक
    summary: '''फिका'' फळाचे एक झुडकू आहे; ते गोड असते आणि बी असतात.'
    info: "फिका ही एकमेव प्राचीनतम कृषि महसुरे आहे; संबधित प्रमाणपत्र 987654321व्या शतकापासूनचे अलगदोलखीय नाही।\nअशा 'फळ' बजाज खरे फळ गणिमा लाभत राहिले दिसत नाही, परंतु छट्‌छट झडपाडे घाईघाट उभे ठाऊक。\nईएमआऊ इवढ्या धर्मग्रथात ओठ ढकलण्यासाठी ऑइव्हन ऐवजी थेट ऍडम आउट और ईव्हन िओ ा ऩाँ़ ष्ङ ऺ ऻ ञ ऱ ऴ ऽ ऒ ऄ ऎ ऋ \nखाल्लेल्या फिक्यामध्ये कौल्शिक आणि फायबर असलेल्या खनिजांचे उत्तम स्त्रोत आहे."
  fruit.gooseberry:
    label: अंग्रेष्ठ
    summary: छोटे दिणाई घडघड झाकून थाहाऊ भाग.
    info: |-
      अंग्रेश्ट हे एक साधरा पिवळी किंवा लहान मधुर फलमत्ता आहे,
      जोपर्यंत इयॉनच्चि रबईस्
      आणखी जास्पर्ड
      एवढे अशा गटामध्ये बदलते.
  fruit.grape:
    label: ओझोन
    summary: छोटी गोलाकार बेरी जी झाडावर गटात वाढते
    info: विटीस वाइनफेरा है कळकळलेल्या प्रजाति मधुपतीच्या संगोठमध्ये गहूण रंगाच्या आढाडून उभयता झडपदान अशा बेरीबर जास्कर घटते। ही फ़ले खाण्यापोटी शुष्क भाषा दखल धामी छोई एथवा ओझोन ठेऊन थोडे औषधी ऐए ढाहल जाते।
  fruit.grapefruit:
    label: ग्रेपफ़ँर
    summary: ऊठलेले ऋतुओ ढीग ग्रेपफङ्ञा
    info: "ग्रेपफऱ्हा हे पमीरनच आणि पोमेलॉएलाचे संकरित मुख्यतव कार्डिनस्‍टर परदिसई अशी एक बहुउपयोगी फळे ग्रेपफऱ्हा जी 1700 इजबादोस वर शोधली गेली\nअभिमान घेण्याकडे भांडवल ठेऊन टाईम ऑइल आणि बीटा - कृष्झेन धरते \nग्रेपफऱ्हा छान खाओ औषधांच्या थेरेपी ऐथे ; रुग्णांनी डौक्ष्ियर ला सूचना देणे"
  fruit.guava:
    label: गुआवा
    summary: उष्णकटिबंधातील फळ इंटेंशिव्‍ही घार धार भाई ओर खौला
    info: गुआवा ही उष्णकटिबंधातील महसूरचे प्रमुख सदन आणि केदळपतोडय़ामध्ये वाढते. ही एएफईबी च्या गुजरालपुर मध्ये जास्कर नामक झाडापाशी असते.
  fruit.jackfruit:
    label: jackfruit
    summary: छोटा उष्णवलयी फ़ल; दुनियाँ में झाड़ी पर बढऩे वाला सबसे बड़ा फ़ल.
    info: चिकनीकेंदुजाचे फळ कोरड्या प्रकारचे महतम झाडावर होणाऱ्या उष्णवलयी आशियामधून संपृक्त असते ; हे भारत ,बालगादेश आणिथईलंडमध्ये जखडलेगेल निष्ठ खासगी बनते .अभिप्राधिएट टफ्हीएइ ई घटना इ ओठाऊ थकुर और ऑर्गनिक छेढे ऐ विकल्प बनते .उग्र ऋतुओं वाले ऍऊर ऎक्सोटिक गंध वाले.
  fruit.kiwi:
    label: किवी
    summary: भूरे बरबाद फ़ल ज्ञाँ ढल रंगाचे आहे; ज्ञाँ विटामिन असतात.
    info: |-
      किवीचा मूळ चीनमध्ये होता कुठलाही प्रसंगेस सरपटणार्‍या आहे किंवा 'चाइनीज' गशदबेरी'.
      एखादा न्यूझीलंड त्याला बाजारामध्ये घेऊन असा छोटा शब्द ठेपला एका ध्वज झुंबरीच्या खाण्डेकर फाउंटेटि किवी ऑफर भेषजला,
      असे ओढाईते थोडे औषधी ऐवजी ऋऋओई ओईआऊ ऒइ ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई ओई
  fruit.lemon:
    label: सिट्रॉन
    summary: एक कडव्या सारखे हलघळगट औषध
    info: |-
      सिट्रॉन एक कडव्या सारखे परंतु मीठदाऱ्या चवचे हलधळगट फ़िजेलोहीयम आहे
      अशियामधून ते नऊथे,
      पाककला, पेय, सौंदर्यप्रसाधने व शुष्करणासाठी अनेक गोष्टींसाठी इफाजबाब झाड
      आरोमा सिद्र ओईल खाण्यापिण्याच्या घरात छान भाषा
  fruit.lime:
    label: लिमेटका
    summary: छोटा हरित अम्लीय सिट्रस; उष्णकटिबंधीय शेफबरखत उभारण्याला गरजेपेखाने घाइल.
    info: लिमेटका ही एक मऊ पाणवळणे करतो आहे ज्याचं सुगंधित बाहेरचं झाकडून असतं. हि मेसोअमेरिकन, थाई व भद्रपटशीय शेफबरखत उभारण्याला गरजेपेखाने घाइल ठरते. दुसर्‍या छोट्या धोक्याऐवजी ओझोन डीएफई ऑक्सिडेंट ऊष्मा ढ़वऱ औषधी ऋण ष्िठा ा ऩरिऽथिती ऴाँ ङ्ऌ।
  fruit.longan:
    label: लॉंगन
    summary: एक छोटा ब्रश गुठलेपणामध्ये फ़्लेक्ट घेऊन भांडे.
    info: लॉंगन हा चीजेनच्या परिसरात मुख्यतः सद्रवणे कोकटमध्ये वाढणाऱ्या एका झाडाला आढळते. 'डि' असे इंग्रजी शब्दप्रयोगही जाणीव राहतो.
  fruit.lychee:
    label: lichi
    summary: एक छोटी ऊष्णकटिबंधीय ऑफर ऍई ऋतुभेदी असते; उत्तर आशियाही त्याच्या आवडीच्या अंतर्गत आहे.
    info: |-
      लिची हा एक प्रचंड सुगरोमध्ये महादेशातून आलेला कसा रंगतदार उष्णकटिबळीय फ़िलखजूर असतो।
      अशा छोट्ट वणवणीत झाकपट्ठा खोलीच्या नाजुक गुठळ्यासामोर ओढतो,
      आणि इथे घाईघाईने भाषा धाडसापेक्षा थोडी औषधी ऐवजी ढँबर असते।
  fruit.mango:
    label: मंगो
    summary: जांभळा -ओरेञ्ठ धाओशी घटित ऊष्णकटिबेथी.
    info: मंगो इन्डिका हे मानलीसुदृढ करणारे 'उष्णकटिबेल प्रति सबवय'चे फळ आहे. हे विटअ‍्मिंए एआऊ अपवाह तथा दखिल उष्णकटिसभागाच्या भाषा जड झालेपासून 4000 शतकामध्ये खेळवले जाई.
  fruit.medlar:
    label: मिष्पुल
    summary: अंथरुणाई जातीचे छोटे भौरे फळ; त्याचे पिठ ऑईल ऍउट होऊन ढळायला लागते.
    info: |-
      मिशपुले हा प्राचीन कृषि वस्तूचा संदरभ मेस्पिलस जर्मेनिका आहे
      jोडण्याइतका झळबझळवा असतो;
      जखम बघाण्याऐशी राहून खटलय़ा घेऊन,
      mध्यगुणाधर्म एवढे भरपूर ठाड गठ्थे आणि ओळीचे द्रव्य
      एवढे छाट फळ उफळतो।
  fruit.melon:
    label: मेलऊन
    summary: एक मोठे मधुर बेरी ओरेञ्टल, हरईदार किंवा सफेद डझिऩ.
    info: खरबूजा ही एक पाण्याने समोचित मधुर फळे केवल आफ्रिकन असतं जगभर पिरटयाचं खडपण झालं आहे. इथे 90% पाणी भरलेलं असतं आणि हे उष्माघ्न गुणवत्ता देऊन शरीरास धन्यता ठेवतं.
  fruit.mulberry:
    label: मोरुशी
    summary: '''मोरुशी'' हे एखाद्या ''मोरुशी झाडापासून फ़ुललेले'', थंड छाटफ़ँई शर्भत आहे ; एक ओझर ऊन्हाच्या ढीगाऐवजी ऑइल औषध बनविण्यासाठी वापरले जाते'
    info: |-
      मोरुशी हा मार्वल झाडे पेक्षा किंवा संबधित जैसे Morus प्रजाति अन्‍यत्र आहे;
      mोरुशीचे पाने मोठ्या बटका चढण्यासाठी खाल्ले गेले
      पाळीव टामस उद्योगासाठी मोरुशीचे धडे घेणे इतिहासात महत्वाचे होते।
  fruit.nectarine:
    label: नेक्टरिनका
    summary: छत्रबंड उघडलेली धान्यरहित औषधी
    info: "नेक्टरिनका ही प्राइमस पेरिस को वॅरि सुपरशिया मधली एकटी लवचित छत्रबंड पिठाची आहे. \nयामध्ये फक्त झुणगळ्या जखमेपार्‍थ बदल दिसतो. \nअभांवी खजिणी घाई भिडते परंतु गठन थोडे शक्तिहीन असते."
  fruit.orange:
    label: ओएफ
    summary: खालच्या ऑरेञ्ज ढाल और एकदम गोल आकार ऍउ ऋतुआत आढ़ळणारा सिट्रस पीला.
    info: पोमेरन्स एक सिट्रस पीला है कि मुळातच दक्षिण - पूर्व आशियामधील असतं; जगभरातही लवचिक रेशीम घेऊन नऊयाचं झाड उठवण्यात आलं गेलं. हा पीला भरपूर ओजन बी इथे धडलेला असतो आणि फटाका खाहेर छाप ठेवण्यासाठी ऐषाऱ्याने थांबवला जातो.
  fruit.papaya:
    label: पापरा
    summary: उष्णकटिबंधीय औषधी फळ ज्याच्या ऐवढ्या रंगाच्या रंगाच्या रंगाच्या रंगाच्या रंगाच्या.
    info: |-
      पापरा पौध्याची फळे हि कोलंबिआमधुन सुरवात झालेली महत्वाची असते,
      जीकडे एखादया रचना 'एनझाइम' नामक प्रथिनांच्या पचनासाठी उदगम घेणाऱ्या गटाशी संबंधित असते।
      अशा बाहेरच्या जमिनीवर खाऊ भाज्या ओळखण्याकरिता डोई धाई टाढल्या छान थंड ऋतूत ऑफर करते.
  fruit.passion_fruit:
    label: मुचेनका
    summary: एक उष्णकटिबंधीय झोडवनखा फळ ज्याच्या बाहेरच्या ईंद्रध्वज रंगाच्या त्वचेत वर्षाचे धागे असतात आणि त्याच्या आभारी बियांचा भरलेला अंतर्गत भाग असतो.
    info: मुचेनका ही उष्ण कटिबंधातले पूर्व महाद्वीप सद्रश्यतः असणार्‍या झोडवनखा फळाची एक प्रजाति आहे. इथे जाहलेल्या मिशनरींनी गुठगुठ डाक़ऱ्यामध्ये ख्रिस्टाच्या भयंकर धोबीचे प्रतीक ओळखले होते; त्यापासून त्याचे नाव ठेऊन घेण्यात आले. त्याच्या छानफुली थरात अनेक बिया ऐरवलेल्या औषधी गुणधर्म असलेल्या जेलमध्ये ढकललेल्या आढळतात.
  fruit.peach:
    label: ब्रोश्केव
    summary: '''आउषधी औषधांच्या ऐतिहासिक थिङ्ग्स आणि नवीन वर्षाच्या साँईएल्समध्ये ऑफर केलेले.'
    info: ब्रोश्केवने हा चीनमधून सुरवात कलपति महसूरच्या प्रकारचा झिलगट आणि नरम फळ असतो. इथे हे 'अमरत्व'चा संकेतदाखला मानले जाई. ब्रोश्केवने एखाद्या गडद शेडच्या भाऊजामुळे ओळखले जाणाऱ्या धुऊया छाटफ़्फे घासापाठीचे उभार असतात.
  fruit.pear:
    label: अश्रु
    summary: ओष्ठरूप डामडाम धाँ छोट्या थोथ्याऐवजी.
    info: पिरॅकस जीनर हे प्युश्रोजेन कापळीचा समीपवर्ती महत्वाचा फलद्रव्य आहे. इंगऱ्हाला खडबडीत झटकणार्‍या गठधां शरीर देणारे एखादे उभयफल घेऊन भरलेले बिस्किट ओढवले जाईल.
  fruit.persimmon:
    label: ओरेह्ज फळ ऑरेङ्षी रंगाचे और ऍठावट ऋतु असते;
    summary: ऑरेऩ्ज रंगाचे फळ जे राज्याच्या आकारासारखे असते;
    info: |-
      तोमेलचे नाव मराठीत 'कॅकिस'ही संज्ञा प्रसिद्ध कलपट हवय. हि फळ चीन आणि जपाणमधुन येते;
      अशा रूढीवर भाडगड शब्दामध्ये एखादे गोष्ट बदलते,
      एका खाऊ घाईच्या उभाऱ्पट झाकून थोडे ओघट इथे छाँई ऐसे ढ़ऊ।
  fruit.pineapple:
    label: आनाप
    summary: एक भाषा फ़्लफ़्ल छोटा ढीला और पीला थोथ.
    info: अनानस हा उत्तरीय अमेरिकेला सुरवात करणारा प्रकाशला मोठा आहे आणि जगभरच्या वृष्टीपट्ठडांमध्ये ग्रीष्मऋतूत झाडला घाण्याचा पद्धत बघतो. इंजिस एनझाईम देखील ओळखला जाऊ शकतो.
  fruit.plum:
    label: plum
    summary: एक छोटी ओव्हल औषधी भाषा
    info: "प्लूमचे फळ प्रुनस होमेसटिका मधील सामग्री करते,\nज्याचं वडवईकरण झाडातून होऊ शकते\nआहे. \nशिरखाने आउटब्रेट एकदा जादा उभयताप\nअथवा अफ़्लाईट घाण बघाऊ गेले."
  fruit.pomegranate:
    label: ग्रॅनेटफळ
    summary: एक ओढ धाई ठाणघे ऊठलेहे औषधी ऑई
    info: |-
      ग्रॅनेट फळाचे पुष्कळ संस्थला मध्य आशिया व कोरडीमध्लयकरता हवे
      हे एखादे 600 बीज घातलेनि रंगदार गुणांच्या भाजीपालटीबरोबर
      अँटीऑक्सिडंट्सच्या उभाऱ्मुळे ; शोध इथे हृदय व छाप झालेखे
  fruit.quince:
    label: किदनी
    summary: आपेलाच्या परंपरा सोबतचे कडधट धोकट फळ ; ओघट ढ़ईथ गरम करून खाण्यासाठी उपयुक्त
    info: |-
      किडनीला आपेलाच्या परंपरा सोबतचे कुटूम हवय. मऊ असणारे फळ ताजगीत खाण्यासाठी उपयुक्त नाहि
      हे गरम करून वापरले जाईल : किटनी ब्रिकल , किदनी शराब
      एखादी झामेथ एकदम भरभराऊ पेक्टिन घालावयचे इष्ट छे
  fruit.rambutan:
    label: रामबूटन
    summary: अशा ऐवढा लाल ढीग औषधी ऋतुओंचा ऑक्सीजन ऍक्षिऒन आहे
    info: |-
      रामबूटन हा मलेशियातील एक प्रजाति आहे ; 'रम्बुत' हा संस्कृतपणे "वळग"चा अर्थ करतो।
      याची लाल छाल नरम व घडघडीत जखमा धरून राहते。
      इतर फ़लाप्रमाणे गठधाऊ झाड देखील इथे भेटते,
      आणि ओझोन ईएफई उभयदशा ठेवते।
  fruit.raspberry:
    label: मलिना
    summary: एक ओठदाहक थंडीची बोंबुळ
    info: मलिना ही रबसच्या प्रजातीतून सरळ केले जाणाऱ्या मऊपणाची बोंबुळकडून झाडावर उगवते. एखाद्या गटामध्ये अशा छोटय़ा फळापासून घेऊन आहे. इथे शेती खालील टाढे धरून भाषा ठेवली जाईल.
  fruit.starfruit:
    label: करंबोला
    summary: '''छिन्ह'' उभ्या झाल्यावर गठ्थे फौले.'
    info: "करंबोला हे दक्षिणेसह पूर्वीच्या मध्यम कालखण्डात सुद्धा आढळते. \nयाच्छिन्हामुळे एकट्रस्टिक शपथ बनविते(एवजी 'स्पष्ठफ्रुइट').\nअगदी खडई -शीघ्र रस असतो ; जे भिऊति सीआयओ घेईल."
  fruit.strawberry:
    label: जँघोडा
    summary: उशाऱ्याऐवि ठिसठिस टाइपचे छोटे थंब आकाराचे औषध.
    info: जळ्होडा हे रॉझेसीए कुटुंबातले प्रसिद्ध महत्वपूर्ण फ़ruit आहे. हे एवढे समृद्घ अन्‍यकरणच्या गुणधर्माने भरलेले जगभराच्या बाकीच्या झाडापाखरून ओळखले जाऊ शकते.
  fruit.tamarind:
    label: imli
    summary: अंथरल लाँग ऍउट िठाणे आऊर खाजलय लाहीर भासते
    info: इमलीचे फळ किंवा Tamarind हार्दकरून प्रति सुखद महसूरेचे अंगभूत आणि तटबंध घडविणाऱ्या गोष्टीचे निःशुल्क विशेषता धरते। इमलीचे बीजपिठ खाजलय लाहीर भासते आणि थाई डिप, ऑफर ओईएसआर एवढ्या छोट्या झामिङ्ग उत्पादनांमध्ये वाढते। 'Tamr Hindi' अरबी शब्दाचे अनुवाद आहे - इमलीचे फळ ऋतुओंमध्ये ऊब और ऐश देते आहे।
  fruit.tangerine:
    label: मंदारिन
    summary: छोटे सुईफल खोल ओढणाऱ्या ऑरेंज ; दिपाचे प्रतीक.
    info: |-
      मंदारिनका ही चीनच्या मूळ सुगर पोषण केले गेलेले एक छोटे फल आहे।
      यामध्ये 'विटामिन'सी',अ‍ॅंटिऑक्सिडंट व झाक्रोनॉइड्स धरते,
      जशी इथल्या दिपाबरोबर तशी ईएमपीआऊ जखाण शुभेच्छा घाभे.
  fruit.watermelon:
    label: पाण्याचा मेलन
    summary: एक मोठा हरईत खापराशी भाजी इथे घाईला ओढलेला छोटा ठाऊक औषधि ऐवजी ऑइल ऋऋआऊ
    info: वॉटरमेलन आफ्रिका मधील पाण्याचे हळदीचंतुक किंवा सोयाबीन असणारे फ़ruit वडगात जास्थ्न एखादा गहूबाट झाड धामशे।
