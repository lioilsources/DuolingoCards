lang: mr
pivot: false
title: फळे
cards:
  fruit.apple:
    label: सफरचंदी
    summary: गोल लाल किंवा हिरवे फळ मधुर पण खट्टे स्वभावाचे.
    info: एक सफरचंदी एका सफरचंदीच्या झाडातून (मेलस डोमेस्टिक) आहे, जगामध्ये सर्वाधिक प्रतिशत उत्पादित बागायती उत्पादनांपैकी एक आहे. त्यामध्ये भविष्यकाळाचा विटामिन C आणि फाइबर असतो; 7,500 हून अधिक प्रजाती आढळतात.
  fruit.banana:
    label: बांदरू
    summary: गोड गुणधर्म असलेला पिवळा उष्णकटीय फळ.
    info: बांदरू हे एम्सा स्पेशीजच्या कुटुंबातील उष्णकटीय झाडाचे फळ आहे. बांदरू मध्ये पोटॅशियम आणि प्राकृतिक शर्करा भरपूर प्रमाणात असतात जे खूप जलद ऊर्जा देतात.
  fruit.cherry:
    label: तांदूळ
    summary: गोल लहान पिवळसर फळ केशी मध्ये झाडला जाणारा.
    info: तांदूळ हा सुकमेहच्या गुणधर्माचा एक अंडाकार ताजा उन्हाळी फळ आहे. त्यामध्ये ऍंटीऑक्सिडंट आणि मेलाटॉनिन असतात; त्याच्या मीठ आणि खोबरखोबर ब्रेडवेल जाती देखील आढळतात.
  fruit.grape:
    label: ग्रॅप
    summary: विणाच्या झाडावर कोमल प्रकारे बनणारी लहान गोल फळे.
    info: विटिस विनिफेरा ह्या जातीच्या विणांतून उभयतापेक्षा भिन्न रंगांचे ग्रॅप मिळतात - हिरव्यापासून खालस छटा आढळते. ही ग्रॅप ताजी खाल्ल्या जातात, सुकवून राशबे बनवली जातात किंवा त्यांच्या द्रव्यापासून शराब बनवला जातो.
  fruit.mango:
    label: मांगो
    summary: तropic फळ ज्याचे पिवळे-नारंगी सरस कडून होय.
    info: इंडिक मांगो हा 'ट्रॉपिकल फ्रुईटचा राजा' म्हणून ओळखला जातो. हे फळ विटअमिन A आणि C ने समृद्ध असते आणि हे दक्षिण आशियामधून आहे, जेथे इथे 4000 वर्षापासून शेती केली जाते.
  fruit.orange:
    label: पॉमेलो
    summary: गोल नारंगी सिट्रस फळ कोरड्या तुकड्यांचे असते.
    info: पॉमेलो हे मध्य पूर्व आशियामधून आलेले एक सिट्रस फळ आहे, जे आज जगभर शेती केले जाते. हे भविष्य च्या सी गुणधर्मासाठी ओळखले जाते आणि द्रव बनवण्यासाठी खूप लोकप्रिय आहे.
  fruit.pear:
    label: हार्दुक
    summary: तेंबूळ आकाराचे स्वादिष्ट मऊ फळ.
    info: हार्दुक हा पीरसच्या जातीचा झाडाचा एक प्रजाति असलेला बेरी आहे. इंगळीशी नातेसंबंध असलेल्या ह्या झाडामधून मऊ, गोड आणि शिकवटदार भाग तयार होतो. खोल आणि कमी ऊर्जा घेणाऱ्या अनेक जाती उपलब्ध आहेत.
  fruit.pineapple:
    label: अनानस
    summary: उष्णकटिबेला फळ ज्याची कोरड पांघरुणे असते आणि सुवर्ण रंगाची मास असते.
    info: अनानस हे उत्तर अमेरिकेमधून आलेले झाड आहे आणि आजच्या काळात जगभरातील उष्णकटिबंद प्रदेशात घेवाट देखील होऊ लागली आहे. इंग्लिश एनानसमध्ये ब्रोमेलईन नावाचा एनझाईम असतो जो पचनास मदत करतो.
  fruit.strawberry:
    label: जाहोडा
    summary: हृदयाच्या आकारातील लाल साजरे पिठ असलेले मधुर फळ.
    info: जाहोडा हे एक लोकप्रिय झाडफळ आहे जे गुलमहालच्या कुटुंबामध्ये येते. हे विटअमिन सी आणि ऍन्टीऑक्सिडंटांनी भरलेले असते; हे उन्हाळ्यात खेपले जाते आणि मधुर शुभ्र घ्याण्याची वैशिष्ट्य असते.
  fruit.watermelon:
    label: वॉटरमेलन
    summary: हिरव्या धागे असलेला मोठा प्रकारचा फळ कोरडी चुंबकासारखी बिया आणि लाल रंगाचे शरीर असते.
    info: वॉटरमेलन आफ्रिकेतून आला आहे आणि हे एक सुप्रसिद्ध उन्हाळी फळ आहे. इथे 92% पाणी आहे आणि ज्वारी नामक घटक आहे ज्यामुळे त्याला लाल रंग येतो.
