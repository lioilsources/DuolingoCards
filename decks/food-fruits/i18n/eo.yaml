lang: eo
pivot: false
title: Fruktoj
cards:
  fruit.ackee:
    label: aki
    summary: Rojanoranta tropikofruko kun edibileflavarkilas; nativ-fruko el Jamaiko.
    info: Akeo (Bligha sapida) estas la nativa frukto de Jamaiko kaj nomita post Kapteno Bligh en 1793. Nur maturigitaj flavecaj arkiloj eblas manĝi dum ke nematurafruktas aŭ tromaturas povas esti toksika pro enhavo hipoglucino-A. 'Aki kaj salhafisto' estas landmark-kuroro de Jamiako.
  fruit.apple:
    label: pomo
    summary: Runda ruĝa aŭ verda manĝemaĵo kun suka acida saboro.
    info: Pomo estas frukto de la arbutokultivo Malus domestika kaj unu el plej multekolektataj agrumoj en mondo. Ĝi enhavas vitaminon C kaj fibrion;
  fruit.apricot:
    label: aperoko
    summary: Pezma naranĝkolora pomo; sufra acida gusteco kun plentago.
    info: Aperokoto (prunu armeniaka) originas el centra Azio kaj estas kultivita en laĈeĥa Respubliko kaj tute Eŭropon. Plej dolĉaj fruktoj venas de Turkio kaj Hispanio. Merunkoj enhavas multekvanton da betakaroteno kaj vitaminon A.
  fruit.avocado:
    label: avo
    summary: Kremuma varmafruka persa bazo por guakamoli.
    info: Avo (perseo amerikanano) originas el Meksiko kaj Centra Aмерика. Botane ĝi estas fruktovo (perso), sed en la koktilarto oni uzas ĝin kiel legomo. En enhavo de sanaj mono-ne-saturitaj graso j (oliveola acido) similas al oliveolo.
  fruit.banana:
    label: banana
    summary: Flava tropika frukto kun dola maso.
    info: Bananas estas frukto de varmklima planto el la familio Bananaceae. Ĝi enhavas multe da kalio kaj nativajn sakaŭrojn kiuj donadas rapidan energion.
  fruit.blackberry:
    label: bluanegra mora
    summary: Blua-nigra kombinita bero el la rubuso.
    info: Mora blua-nigra de Rubus fruticosus kreskas sur spica arbusto. Ĝi enhavas grandan kvanton da vitaminoj C kaj K kaj fibrinojn.
  fruit.blueberry:
    label: bluegrosboono
    summary: Malverma azura frukto; nutraĵo plej rica pri antioksido.
    info: Blueberry enhancas la sanon de korpo per siaj potenculoj kontraŭ oksidado kun anthocyanojn kiuj donacas al ĝi malvarmaj bluoj kaj protektas niajn celerojn. Higbush-boruvko estas granda specio por hejmparto komparite kun tiuj el arbaro.
  fruit.cantaloupe:
    label: kanthalupe
    summary: Flava-reĝena retonita maruko kun viva-oranga pulmo.
    info: La kantalupe (cucurbita melea vario canthelupa) estas populara specio de maroko originanta el Azio. Ĝi ricevis la nomon pro papala rezidenco en Canthelepo apud Romo. La ora frukto enhavas plenigon da betakareteno kaj vitamino-A.
  fruit.cherry:
    label: ĉirispo
    summary: Mallonga ronda ruĝa sementofrukto kiun oni trovas en duoparo.
    info: Čerispo estas frukto de la birda ĉirkaŭo, populara somera manĝotero. En enhavas antioksidantojn kaj melan-tonon; ekzistas sukan kaj acidan tipojn.
  fruit.coconut:
    label: kokoso
    summary: Granda varmegregiona 'orecho' kun dura perdu kojnigas blankon meatan.
    info: La Kokoso (Cocus nuciferus) estas frukto de la kokospalmo; ĝi biologie temas pri semeno, sed ne pri šiaĵo, sed pri endospermo. La akvo en malplena frukto funkcias naturale kiel elektrolita trinkaĵo. Kokomlekeco kaj oljo formas bazon por sudorientazieca kaj hindua manĝado.
  fruit.cranberry:
    label: ribesarkesto
    summary: Malsa akridulo; tradicia komplemento al usonaj manĝiloj.
    info: Ribesarkto (Vacium microkarpo) estas maldika acida ruĝa bero. Ĝi tradicie uzatas en usona tago de dankemo por preparado da ribeskaro. En enhavas antociandinojn kiuj helpas ekzemple kontraŭteni la atakojn per Escherichia Coli sur urinaraj vojoj.
  fruit.currant:
    label: ribo
    summary: Malgrandaj ruĝaj, nigraj aŭ blankaj beroj en grumo.
    info: Ribo estas malgranda bero formiĝanta en klusteregojn. Nigra ribo enhavas plej multe da vitamino C inter ĉiam beroj. La sago 'ribena' uzita por brita trinkaĵo kaj la likiero "cassiss" havas grundan guston el nigra ribo.
  fruit.damson:
    label: Damaskega ŝveŝko
    summary: Mallongaj nigr-blauaj ŝveskoj origine el Damasco.
    info: La damaskega ŝveŝko estas mallonga blua-nigra frukto de la prunotipo Damasko el Arabio, kiuj estis konataj en Anglio ekde antikvo.
  fruit.date:
    label: dato
    summary: Suka bruna ovala fruko de data-palmo uzata ĉefe por nutriĝado sur Oriento.
    info: Datoj de Phoenix Dactylicra estas sukeraj fruktoj el la palmo da dato. Ili estabas baznutrimo en Mezoriento ekde milojarh' kaj enhavas super sesdek procentojn sukero kun alta nombro je energiaĵoj.
  fruit.dragon_fruit:
    label: drako frukt
    summary: Roskolora tropluma kakteofrukto kun blanka punktita maso.
    info: Drakfrukto (pithajua, Hylocereus) origineblas el Meksiko kaj Centrameriko. Ĝi havas vivan rozoran perdon kun blanka pulpo kaj nigraj semenoj kiuj estas tre decorativaĵo.Ĝia gustado estas subtila; enhavas antioksidantojn kaj vitaminon C.
  fruit.durian:
    label: Duriango
    summary: Granda spintruo elvarmklimo-plendo per fortega olfakso; reĝo inter varmaklimate frukteto.
    info: La duriano estas nomata reĝo de la varma klimato fruktoj. Ĝi havas fortan odoron kiun kelkaj trovas malagrablan sed aliaj atrektivan – en multe da azijaj hoteloj oni forbaris manĝi tiel. La interna duŝino estas kremonoforma kaj sukiĝema kun kompleksa gusto inkluzivante mandolnon, vainilon kaj formagon.
  fruit.feijoa:
    label: fejoa
    summary: Ovale verda aroma frukto kun interna arboreska strukturo.
    info: La fejoasukeraĵo havas intensivan aromatan guston konsistantan el anana, gojava kaj mentola notoj. Ĝi estas tre populara en Nova Zeelando kiel oktobra frukto.
  fruit.fig:
    label: figo
    summary: Peraformita frukto kun interna sago kaj multe da semenuloj.
    info: La figo estas unu el la plej malnovaj kultivatajn fruktojn en mondo; pruvo de ĝia uzado datigas al antaŭ centoj da jarcentoj. Tio efektive ne temas pri frukto sed pri speciega strukturo enhavanta milerojn da mikrofloroj. En Biblia rakonto Adam kaj Eko uziĝis foliilo por vesti sin post peĉato.
  fruit.gooseberry:
    label: grelbojo
    summary: malgrandeco rondformita transparenta sferulo ; favore al la jardino
    info: |-
      Grelbojo ( Ribis uva-krispe ) estas malgranda frukto karakteriza por ĉeĥaj kertoj en Eŭropo centra
      Ekzistas verda, ruĝa kaj flava varietato,
      Ĝi enhavas multan vitaminon c;
      kurkafino el grelbojo establiĝis historia populara trinkaĵo.
  fruit.grape:
    label: gluco
    summary: Runda frukteto kiun plenegas per similaj al gluckoj.
    info: La vitvo de Vitis Vinifera produktas diverskolorajn glukojn - el verda ĝis malvarma viola koloro. La gluko estas manĝata rekta el la planto, sekigita por formi datolojn aŭ presita en vinon.
  fruit.grapefruit:
    label: grepo
    summary: Grandega amare-duliga citrufrukt' kun nutraj valor'
    info: Grapo (citrono paradisio) estas hibrido de mandarinokaj pomelo. Ĝin priskribis en la 17-a jarcento sur Barbadiso. Rozgrapoj kaj rubinkoloraj grapoj enhavas likopenojn kaj betakarotenojn.
  fruit.guava:
    label: guaio
    summary: Ploda arboto kun forta odorato kaj blanka aŭ ruĝpala interneco.
    info: Guaio (psidiumpsidium guayawa) originas el Tropicauko kaj estas disvastigita tra tuta Aziao kaj Afriko. Ĝi enhavas 4 fojojn plu vitaminon C ol mandarinoj.
  fruit.jackfruit:
    label: breadfrukto
    summary: Enorma tropika frukto; mondo-rekonita pro esti la plej grandspeca fruko sur arbore.
    info: Breadfrukto (Artocarpus heterophyllo) produktas la plej grandan fruktostemon en arbaro; ĝia pezo povas atingi super 35 kilogramojn. Ĝi originadas el Tropika Azio kaj estas grava manĝaĵo en Indo, Barato kaj Tajlando. Neplena breadfrukto havas netuŝeman teksturon kaj uzatas kiel vegana anstataŭigilo por viando.
  fruit.kiwi:
    label: kipre
    summary: Malgranda bruna kapilara fruko kun verda interneco.
    info: Kiwio (actiniadio delikiosa) origine estas el Ĉino, kie oni nomas ĝin yangtao aŭ ĉinia marula birda frukto. Nov-Zelando popularigis la fruktion kaj renomnis ĝin post sia nativa bestaro - 'kivi'. Kiwifruko enhavas plenan dosieron de vitaminoj.
  fruit.lemon:
    label: limono
    summary: Acida flava citeruno kun aromo.
    info: Limo estas acida citeruna frukto el Azio. Ĝi enhavas multe da vitamino C kaj ankaŭ citratan acidon. Limo uzatas en manĝado, trinkaĵoj, kosmetiko kaj netra al meblaro.
  fruit.lime:
    label: limeo
    summary: Mallonge verdan acidan citerumenon uzatan por varmegradaj vivmanieroj.
    info: Limeo estas mallonga verda citerumo kun acida suko kaj aromata gluo. Ĝi gravas en meksika, tailanda kaj vjetnama manĝado pro sia forta aromaĵo eĉ se enhavante pli da vitamino C ol lemonoj.
  fruit.longan:
    label: longano
    summary: Runda malgranda tropika fruko rilatigita al litsio.
    info: La Longano (Dimocarpus longan) estas frukto de trojka arbo eloriginta en Ĉino. La nomo venas per la ĉina 'longyan' signifanta drakokulo por klarigi ties klarecon kun nigra semeno. Gxin havas sukan aromatan guston.
  fruit.lychee:
    label: licio
    summary: Runda roja tropika frukto per transparenta mezo; populara en Azio.
    info: Licjo (Litchi chinensis) estas troppiko frukto el Azie orientala landoj kiel ekzemple en la malnova tempopunkto de naskiĝo ĉe Ĉino. La ruza runda skapo havas glatigitan internon kun klareco por montri senpintajn blankajn strukturojn kiuj formas unuan parton de tiun specifan guston.
  fruit.mango:
    label: manogo
    summary: Varmaklimata manko kun ŝanĝanta oranĝokoloron suka mezo.
    info: La mango hindia estas tiel nomata 'reĝo de la varma-klimato fruktoj'. Ĝi enhavas multe da vitaminoj A kaj C kaj originas el suda Azio, kie oni kultivas ekde antaŭ 4 000 jaroj.
  fruit.medlar:
    label: quince
    summary: Koloreca bruna fruko simila al pompo kiun oni devas lasi ripeni antaŭ ol uzi.
    info: Quinces (Mesepilo germanyka) estas malnova ĉevala frukto kultivita ekde la mezepoko.Ĝi manĝebla nur post maldikigado per forlasis dum kelkaj tagoj por iĝu flanka. Ĝi enhavas multon de polifinoj kaj vitamino-C.
  fruit.melon:
    label: mezo
    summary: Granda dolĉa frukto per naranĝ-kolora internaĵo.
    info: Melo (cucurbita mele) estas varma kaj subvarmega frukto kun alta akvenhavo. Ĝi originas en Azio kaj Afrikao sed nuntempe kultivatas dum la tuta mondo. Meloj enhavas super 90% da akvo kaj ekzistas centeroj de diversaj species inkluzive de cantaloup, honedew, galia, karantajo.
  fruit.mulberry:
    label: moreo
    summary: Nigro-viola bobulo el arboro Moreo.
    info: Moreo el Morus estas granda nigra frukto de la morearbo; ĝi donas manĝon al buteloj kaj estis gravura por serkato en historia epoko. Ekzistas blankaj, ruĝaj kaj nigraroj; tiun lastan oni trovas plezurecon pli dolcegan ol la ceterajn.
  fruit.nectarine:
    label: nectarinia
    summary: Glaca plumo sen pelaco; suka kaj dolĉa.
    info: La Nectarina (Prunus persica var. nukipersika) estas natura mutanto de la periko kun glata epidermo. Ŝi diferencas sin nur en unu genu pri glateco de ekstera parto kompare al normalaj persikoj. Ĥavas similan guston sed pli dikan strukturon ol ordinaraj fruktoj el tiu specio.
  fruit.orange:
    label: mandarino
    summary: Runda aromema citeroflorkompatita kun peza naranĉokolora skelo.
    info: Mandarino estas citrusripo originanta el Sudorienta Azio kaj hodiaŭ ĉiampestrebla en la tuta mondo. Ĝi enhavas multe da vitamino-C kaj estadas populara pro sia junĝo.
  fruit.papaya:
    label: papanjo
    summary: Granda tropika fruko kun vivoranĝa pulpo.
    info: La papaio (Carica papaja) originas el Tropika Aŭstralio. Ĝi enhavas enzimon nomatan papajno kiun helpas digesti proteinojn. La frukto estas riĉa je vitamino C, betakaretenon kaj antioksidantoj.
  fruit.passion_fruit:
    label: muchajo
    summary: Frukto tutebla kun purpura peleton kaj aroma internaĵo.
    info: Muchejo (Passiflora edulis) originas en Tropika Sudameriko. Ĝia nomo devenis el misiistoj, kiuj rigardis la floron kiel simbolojn pri Kriŝto pasio. La fruktopado estas plena per semencapsuloj envoltaj kun aromata geleco.
  fruit.peach:
    label: periko
    summary: Flav-roza frukto en formo de pruno; signatono pri somero.
    info: La periko (prunu persika) originas el Ĉinio, de kiunde estas simbolo da nemorteco. Ĝi havas malfacile identeblan velvan eksteraĵon kun karakteriza subtila flandra surfaco. Ekzistas blankaj kaj flavaj varietoj; la negizanojn oni distingas pro glata senhara varianto.
  fruit.pear:
    label: piruo
    summary: Frukto en formo da lacrimitaĵo per dola sago.
    info: Piruo estas frukto de la specio pirua arbo, proksime rilata al pomoarboj. Ĝi havas maldikan kaj sukan internon kun alta fibra enhavo;
  fruit.persimmon:
    label: tomeleto
    summary: oranĝa frukto simila al papriko; suga kaj akra
    info: |-
      Tomeleto (Diospyros kaki) origineblas en Kina kaj Japanio; EnĈeĥujo oni nomas ĝin japania tomeleto
      Nenatura tomeleto estas acida kaj kruda; maturita havas meloman sagon
      Ĝi enhavas vitaminojn A,C kaj mineralo
  fruit.pineapple:
    label: pinego
    summary: Trojka frukto kun spintra kapo kaj flava interna parto.
    info: Pinego origino estas Sudameriko kaj ĝi nuntempe kultivatas en la tuta tropika zono de Tero. En enhavo troviĝas fermento nomita Bromelaîno, kiun helpas digestadon.
  fruit.plum:
    label: plumo
    summary: Viola pruno uzata por vinagreja alkonetro kaj kvina.
    info: Plumo (pruna domestiko) estas baza frukto de centra Eŭropo kaj la fonto por distilejo Slivojco en Ĉeĥio kaj Slovakio. Švejkokvino estas specifa tipo da pasteto farita el tiu frukto dum oktabro-aŭgusto periodo. Plur ol du miloj variaĵoj pri plumoj ekzistas interde landoj.
  fruit.pomegranate:
    label: roketpomo
    summary: Ruĝa fruktaro kun milero da sukecaj nukleoĵ; simbolo pri reproduktivo.
    info: Roketo de pomo punika originas el Mezio Azio kaj la Mediteranejo. Ĝi enhavas super 600 nukleoj en transparenta ruĝa maso nomata ariloj. Riĉa je antioksidantoj; esploro studias ties efikon sur koron kaj inflamojn.
  fruit.quince:
    label: quindo
    summary: Durpleno kun flava koloro rilatanta al la pomfrukto; ĉiam uzata post termika pritrakto.
    info: Quindo (cydoneo elongato) estas parente al perdo kaj pomo; ĝi havas duran kaj fibran strukturon en naturo. Ĝi devas esti varme traktita por manĝado ekzemple como membrilo - quindojama, quino-vina, distileto el quiño. Ĉar enhavas grandegan kvanton depektino bonadaptitan produktadon da jamo.
  fruit.rambutan:
    label: RamButano
    summary: Ruza kapra varma-zona frukto kun interna strukturo proksimume sama ol tiu de likio.
    info: La Rambutan (Nepheleiom lappaceum) originas en Malsio kaj ĝia nomo devenis el la mallaja 'rambut' signifanta harojn. Ĝia ruĝa gluo estas revoltita per molaj spiraloj similantaj al haroj. La duŝno estas klara kaj sagrama simila al likio.
  fruit.raspberry:
    label: jaskulo
    summary: Ruza kombinita frukto simbola por la varmeco de tagoj.
    info: Jaskulo (Rubus idaeus) estas kompeltita frukto farata el pluraj mallongaj duropoloj kaj ĝi povas kreski en la naturo sed ankaŭ establiĝis per agronomio dum somero kaj herausto. Jaskulfruktado enhavas grandan kvanton da vitamino C kaj K, managanon kaj antioksidantojn.
  fruit.starfruit:
    label: caramboldo
    summary: Juna tropika frukto kiun sekco formas stelon.
    info: La stelo-frukto (Averrhoa carambola) originas el Suda Azio kaj Sudoriento de Azio. Kiam tranĉita transverse ĝi formigas perfektan figuron en la formo da stelo (tial ankaŭ nomata 'stelfrukt'). Gxi havas acidan-duligan guston kaj estas riça pri vitamino-C. Personoj suferantaj per reno-malsanoj ne devus manĝi tiun fruktoton pro ties alto enhavo da oksalo.
  fruit.strawberry:
    label: strawberry
    summary: Red juicy berries shaped like hearts.
    info: Strawberry is a popular fruit belonging to the rose family that grows wild throughout Europe but was first cultivated for its fruits by Europeans who discovered it growing near their homes.
  fruit.tamarind:
    label: imbir
    summary: Kastana legomo kun acidula internen; baza elemento pri thaia kuino.
    info: Imbira (Tamarindus indica) originiĝis en Tropika Afroko sed nuntempe ĝi estas kultivita tra la tuta varma mondo. La pulpo de tiu frukto havas fortan acidan guston kun duligaĵo kiu uzatas por Thaiaj manĝoj kiel ekzemple pad thai, Worcestersire saŭco kaj hindua konfituro. La nomo venas el araba 'tamr hindi', signifanta indian date. Imbirfrukteto enhavas multe da natrium-acido, vitamin C, kaj ferio.
  fruit.tangerine:
    label: mandarinoko
    summary: Malsaĉa mandarinokvo kun facilman ŝelo por forigi.
    info: Mandarinokvaco (Citrus retikulato) estas mala kaj facile elŝirpema citruseko origine de Ĉinio.Ĝi simbolas la novjaron en ĉina kulturo kaj bonvolan fortucon.Generale oni manĝas ĝin dum Kristnadso enĈeĥuj,Cel entenas vitamino-C-on,kunfortojn kaj flavonojn.
  fruit.watermelon:
    label: '"dinjo de akvo"'
    summary: '"Granda verda-streĉita frukto kun roza interna parto"'
    info: '{"info":"La akva dinjono originiĝas el Afrikio kaj estas populara somera frukto. Ĝi konsistas el proksimume 92% da akvo kaj enhavas likopenidojn kiuj donacas al li la ruĝan koloron."}'
