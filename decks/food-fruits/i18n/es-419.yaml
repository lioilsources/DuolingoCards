lang: es-419
pivot: false
title: Frutas
cards:
  fruit.apple:
    label: manzana
    summary: Fruto rojo o verde con sabor dulce-agrio.
    info: La manzana es el fruto del árbol de manzano, una de las cultivos más cultivados en el mundo. Contiene vitamina C y fibra; existen más de 7 500 variedades.
  fruit.banana:
    label: plátano
    summary: Fruto tropical amarillo con pulpa dulce.
    info: El plátano es el fruto de una planta tropical perteneciente a la familia de las musaceas. Es rico en potasio y azúcares naturales que proporcionan energía rápida.
  fruit.cherry:
    label: cereza
    summary: Pequeña fruta roja y redonda que crece en parejas.
    info: La cereza es el fruto del duraznero común, un popular fruto de verano. Contiene antioxidantes y melatonina; hay variedades dulces y ácidas (como las ciruelas).
  fruit.grape:
    label: uva
    summary: Pequeña fruta redonda que crece en racimos.
    info: La vid produce uvas de varios colores, desde el verde hasta el morado oscuro. Las uvas se comen frescas, se secan para hacer pasas o se exprimen para elaborar vino.
  fruit.mango:
    label: mango
    summary: Fruta tropical con pulpa jugosa de color naranja amarillento.
    info: El mango es conocido como el "rey de las frutas tropicales" y está rico en vitaminas A y C. Proviene del sureste asiático, donde se cultiva desde hace más de 4 000 años.
  fruit.orange:
    label: naranja
    summary: Fruto cítrico redondo con una fragante piel naranjada.
    info: La naranja es un fruto cítrico originario de Asia del Sureste y hoy cultivado en todo el mundo. Es rica en vitamina C y muy popular como jugo.
  fruit.pear:
    label: pera
    summary: Fruta en forma de lágrima con sabor dulce y suave.
    info: La pera es el fruto del árbol de la pera común, estrechamente relacionado con las manzanas. Tiene una pulpa jugosa y tierna, así como un alto contenido de fibra; existen cientos de variedades.
  fruit.pineapple:
    label: piña
    summary: Fruta tropical con corona espinosa y pulpa amarilla.
    info: La piña proviene de América del Sur y ahora se cultiva en la zona tropical de todo el mundo. Contiene una enzima llamada bromelina que ayuda al proceso digestivo.
  fruit.strawberry:
    label: fresa
    summary: Baya roja jugosa con forma de corazón.
    info: La fresa es un fruto popular perteneciente a la familia de las rosáceas. Es rica en vitamina C y antioxidantes; se cosecha en verano y tiene un aroma dulce.
  fruit.watermelon:
    label: sandía
    summary: Fruta grande de piel verde rayada con pulpa roja jugosa.
    info: La sandía proviene de África y es una fruta popular en verano. Está compuesta por un 92% de agua y contiene licopeno, que le da su color rojo.
