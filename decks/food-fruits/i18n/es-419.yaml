lang: es-419
pivot: false
title: Frutas
cards:
  fruit.apple:
    label: manzana
    summary: Una fruta redonda roja o verde de sabor dulce y ácido.
    info: La manzana es el fruto del manzano, uno de los cultivos más extendidos del mundo. Contiene vitamina C y fibra; existen más de 7.500 variedades.
  fruit.banana:
    label: banana
    summary: Una fruta tropical amarilla de pulpa dulce.
    info: La banana es el fruto de una planta tropical de la familia de las musáceas. Es rica en potasio y azúcares naturales que dan energía rápida.
  fruit.orange:
    label: naranja
    summary: Un cítrico redondo de cáscara anaranjada y aromática.
    info: La naranja es un cítrico originario del sudeste asiático, hoy cultivado en todo el mundo. Es rica en vitamina C y muy apreciada en jugo.
  fruit.strawberry:
    label: fresa
    summary: Una baya roja, jugosa y con forma de corazón.
    info: La fresa es una fruta muy apreciada de la familia de las rosáceas. Es rica en vitamina C y antioxidantes, y se cosecha en verano.
  fruit.grape:
    label: uva
    summary: Una baya pequeña y redonda que crece en racimos.
    info: La vid produce uvas de distintos colores, del verde al morado oscuro. Las uvas se comen frescas, se secan como pasas o se prensan para hacer vino.
  fruit.watermelon:
    label: sandía
    summary: Una fruta grande con rayas verdes y pulpa roja y jugosa.
    info: La sandía viene de África y es una apreciada fruta de verano. Está compuesta en un 92 % por agua y contiene licopeno, que le da el color rojo.
  fruit.mango:
    label: mango
    summary: Una fruta tropical de pulpa jugosa entre amarilla y anaranjada.
    info: Al mango se le llama el rey de las frutas tropicales. Rico en vitamina A y C, viene del sur de Asia, donde se cultiva desde hace 4.000 años.
  fruit.cherry:
    label: cereza
    summary: Una pequeña drupa roja y redonda que crece en pares.
    info: La cereza es el fruto del cerezo dulce, una apreciada fruta de verano. Contiene antioxidantes y melatonina; existen variedades dulces y ácidas.
  fruit.pear:
    label: pera
    summary: Una fruta con forma de gota de sabor dulce y suave.
    info: La pera es el fruto del peral, pariente cercano de la manzana. Tiene pulpa blanda y jugosa y un alto contenido de fibra; existen cientos de variedades.
  fruit.pineapple:
    label: piña
    summary: Una fruta tropical con una corona espinosa y pulpa dorada.
    info: La piña viene de Sudamérica y hoy se cultiva en los trópicos de todo el mundo. Contiene la enzima bromelina, que ayuda a la digestión.
  fruit.lemon:
    label: limón
    summary: Un cítrico amarillo y ácido; fuente de vitamina C y aroma.
    info: |
      El limón es un cítrico ácido originario de Asia.
      Es rico en vitamina C y ácido cítrico.
      Se usa en la cocina, en las bebidas, en la cosmética y en los productos de limpieza.
      La cáscara del limón contiene un aceite esencial de característico aroma a limón.
  fruit.lime:
    label: lima
    summary: Un pequeño cítrico verde y ácido; ingrediente clave de la cocina tropical.
    info: |
      La lima es un pequeño cítrico verde de jugo ácido y cáscara aromática.
      Es imprescindible en la cocina mexicana, tailandesa y vietnamita.
      Contiene menos vitamina C que el limón, pero un aroma más intenso.
      Comer lima protegía a los marineros del escorbuto gracias a la vitamina C.
  fruit.kiwi:
    label: kiwi
    summary: Una fruta marrón y peluda de pulpa verde; rica en vitaminas.
    info: |
      El kiwi viene de China, donde se le llama grosella espinosa china.
      Nueva Zelanda lo comercializó y lo rebautizó con el nombre de su ave nacional, el kiwi.
      Contiene el doble de vitamina C que una naranja.
      La pulpa es de un verde brillante; también existen variedades doradas (amarillas).
  fruit.peach:
    label: durazno
    summary: Una drupa aterciopelada entre amarilla y rosada; símbolo del verano.
    info: |
      El durazno viene de China, donde es símbolo de inmortalidad.
      Su piel suave y aterciopelada es característica.
      Existen variedades blancas y amarillas; la nectarina es la variante lisa, sin vello.
      En China los duraznos forman parte del Año Nuevo y de la mitología curativa.
  fruit.plum:
    label: ciruela
    summary: Una drupa morada; base del aguardiente y del dulce de ciruela.
    info: |
      La ciruela es una fruta fundamental de Europa central.
      El slivovitz (aguardiente de ciruela) es un destilado tradicional checo y eslovaco.
      El dulce de ciruela es un producto típico de la cosecha de otoño.
      En el mundo existen más de 2.000 variedades de ciruela.
  fruit.apricot:
    label: damasco
    summary: Una pequeña drupa anaranjada; dulce, ácida y jugosa.
    info: |
      El damasco viene de Asia central.
      Se cultiva en toda Europa; los más dulces vienen de Turquía y España.
      Es rico en betacaroteno y vitamina A.
      Los damascos secos son un apreciado bocadillo saludable.
  fruit.raspberry:
    label: frambuesa
    summary: Una baya compuesta roja; símbolo del jardín de verano.
    info: |
      La frambuesa es una baya compuesta por muchas pequeñas drupas.
      Crece silvestre y cultivada; la cosecha cae en verano y otoño.
      Es rica en vitaminas C y K, manganeso y antioxidantes.
      La mermelada y el vinagre de frambuesa son golosinas tradicionales.
  fruit.blueberry:
    label: arándano
    summary: Una baya azul oscuro; un superalimento lleno de antioxidantes.
    info: |
      El arándano es rico en antocianinas, pigmentos de fuertes propiedades antioxidantes.
      Las antocianinas le dan el color azul oscuro.
      Los estudios indican un efecto positivo en las funciones cognitivas y en la salud del corazón.
      Los arándanos cultivados son más grandes que los silvestres.
  fruit.blackberry:
    label: mora
    summary: Una baya compuesta morada oscura de la zarza.
    info: |
      La mora es una baya compuesta morada oscura que crece en un arbusto espinoso.
      La mora silvestre crece en los bordes de los bosques y en la maleza.
      Contiene mucha vitamina C, vitamina K y fibra.
      La mermelada, la compota y el licor de mora son productos tradicionales.
  fruit.coconut:
    label: coco
    summary: Una gran nuez tropical de cáscara dura y pulpa blanca.
    info: |
      El coco es el fruto de la palmera de coco; botánicamente es una drupa, no una nuez.
      El agua de coco del fruto verde es una bebida isotónica natural.
      La leche y el aceite de coco son la base de la cocina del sudeste asiático y de la India.
      A la palmera de coco se le llama el árbol de los mil usos.
  fruit.papaya:
    label: papaya
    summary: Una gran fruta tropical de pulpa anaranjada intensa.
    info: |
      La papaya viene de la América tropical.
      Contiene la enzima papaína, que favorece la digestión de las proteínas.
      Es rica en vitamina C, betacaroteno y antioxidantes.
      La papaya verde se usa como verdura en la cocina del sudeste asiático (en la ensalada som tam).
  fruit.guava:
    label: guayaba
    summary: Una fruta tropical de aroma intenso y pulpa blanca o rosada.
    info: |
      La guayaba viene de la América tropical y se ha extendido por la Asia y la África tropicales.
      Contiene cuatro veces más vitamina C que una naranja.
      La cáscara y las semillas son comestibles; toda la fruta es nutritiva.
      El jugo y la mermelada de guayaba son productos populares en los países tropicales.
  fruit.pomegranate:
    label: granada
    summary: Una fruta roja de mil semillas dulces; símbolo de fertilidad.
    info: |
      La granada viene de Asia central y del Mediterráneo.
      Contiene más de 600 semillas envueltas en una pulpa roja translúcida (arilos).
      Es rica en antioxidantes; los estudios investigan su efecto sobre el corazón y las inflamaciones.
      Simboliza fertilidad y abundancia en muchas culturas.
  fruit.fig:
    label: higo
    summary: Una fruta con forma de pera de la higuera; dulce y llena de semillas.
    info: |
      El higo es una de las frutas cultivadas más antiguas; sus rastros se remontan a 11.000 años.
      En realidad no es una fruta, sino una envoltura llena de miles de pequeñas flores.
      Las hojas de higuera de Adán y Eva en el relato bíblico son hojas de la higuera.
      Los higos secos son una excelente fuente de calcio, potasio y fibra.
  fruit.date:
    label: dátil
    summary: Un dulce fruto ovalado y marrón de la palmera datilera; alimento básico de Oriente Medio.
    info: |
      Los dátiles son los dulces frutos de la palmera datilera.
      Desde hace miles de años son un alimento básico de Oriente Medio.
      Contienen más del 60 % de azúcar y son una marcada fuente de energía.
      En el islam los dátiles se comen tradicionalmente primero al romper el ayuno del Ramadán (iftar).
  fruit.melon:
    label: melón
    summary: Una fruta grande y dulce de pulpa anaranjada, verde o blanca.
    info: |
      El melón es una fruta tropical o subtropical de alto contenido de agua.
      Viene de África y Asia; hoy se cultiva en todo el mundo.
      Está compuesto en más del 90 % por agua y es muy refrescante.
      Existen cientos de variedades, entre ellas el cantalupo, el melón de invierno y el galia.
  fruit.cantaloupe:
    label: melón cantalupo
    summary: Un melón reticulado de pulpa anaranjada intensa.
    info: |
      El melón cantalupo es una apreciada variedad de melón originaria de Asia.
      El nombre viene de la residencia papal de Cantalupo, cerca de Roma.
      La pulpa anaranjada es rica en betacaroteno y vitamina A.
      Es una de las variedades de melón más dulces.
  fruit.grapefruit:
    label: toronja
    summary: Un gran cítrico agridulce; una estrella de las dietas.
    info: |
      La toronja es un cruce entre naranja y pomelo.
      Fue descrita en Barbados en el siglo XVIII.
      La toronja rosada y roja contiene licopeno y betacaroteno.
      El jugo de toronja interactúa con muchos medicamentos; los pacientes deben informar a su médico.
  fruit.tangerine:
    label: mandarina
    summary: Un pequeño cítrico dulce de cáscara suelta; símbolo de la Navidad.
    info: |
      La mandarina es un pequeño cítrico fácil de pelar, originario de China.
      Es símbolo del Año Nuevo chino y de la buena suerte.
      En muchos países es una típica fruta navideña.
      Contiene vitamina C, antioxidantes y flavonoides.
  fruit.passion_fruit:
    label: maracuyá
    summary: Una fruta tropical de cáscara arrugada y pulpa aromática llena de semillas.
    info: |
      El maracuyá viene de la Sudamérica tropical.
      Su nombre proviene de los misioneros que vieron en la flor los símbolos de la pasión de Cristo.
      La pulpa está llena de semillas envueltas en un gel aromático.
      Es una excelente fuente de vitamina C, fibra y antioxidantes.
  fruit.lychee:
    label: lichi
    summary: Una pequeña fruta tropical roja de pulpa translúcida; apreciada en Asia.
    info: |
      El lichi es una fruta tropical originaria de China.
      Su áspera cáscara roja se pela con facilidad y revela una pulpa blanca translúcida.
      Tiene un sabor dulce y finamente aromático.
      En China es símbolo de buena suerte y prosperidad.
  fruit.dragon_fruit:
    label: pitahaya
    summary: Una fruta tropical rosada de cactus con pulpa blanca moteada.
    info: |
      La pitahaya (fruta del dragón) viene de México y Centroamérica.
      Su cáscara rosa intenso y su pulpa blanca con semillas negras son muy decorativas.
      Tiene un sabor suave y contiene antioxidantes y vitamina C.
      Con ella se hacen jugos, batidos y postres decorativos.
  fruit.starfruit:
    label: carambola
    summary: Una fruta tropical amarilla que forma estrellas al cortarse.
    info: |
      La carambola viene del sur y el sudeste de Asia.
      Cortada de través forma una estrella perfecta, de ahí el nombre inglés starfruit.
      Tiene un sabor dulce y ácido y es rica en vitamina C.
      Las personas con enfermedad renal no deben comerla por los oxalatos.
  fruit.avocado:
    label: aguacate
    summary: Una cremosa drupa tropical; base del guacamole.
    info: |
      El aguacate viene de México y Centroamérica.
      Botánicamente es una fruta (una drupa), pero en la cocina se usa como verdura.
      Contiene grasas monoinsaturadas saludables (ácido oleico), como el aceite de oliva.
      Es un alimento saludable de moda en todo el mundo; la tostada de aguacate es un ícono de la moderna cultura de los cafés.
  fruit.persimmon:
    label: caqui
    summary: Una fruta anaranjada parecida al tomate; dulce y astringente.
    info: |
      El caqui viene de China y Japón; también se le llama kaki.
      El caqui verde es rico en taninos y astringente; maduro es dulce como la miel.
      Es rico en vitamina A y C y en minerales.
      En Japón es una tradicional fruta de otoño.
  fruit.mulberry:
    label: mora de árbol
    summary: Una baya morada oscura de la morera; alimento del gusano de seda.
    info: |
      La mora de árbol es el fruto de la morera; las hojas de la morera son el alimento del gusano de seda.
      Existen moras blancas, rojas y negras; la negra es la más dulce.
      En la historia, el cultivo de la morera fue crucial para la producción de seda.
      Las moras de árbol son ricas en resveratrol, vitamina C y hierro.
  fruit.cranberry:
    label: arándano rojo
    summary: Una pequeña baya roja y ácida; tradicional ingrediente estadounidense.
    info: |
      El arándano rojo es una pequeña baya roja y ácida.
      Es una parte tradicional del Día de Acción de Gracias estadounidense (salsa de arándanos rojos).
      Contiene proantocianidinas, que impiden que las bacterias Escherichia coli se adhieran a las paredes de las vías urinarias.
      El efecto del arándano rojo en la prevención de las infecciones urinarias está científicamente comprobado.
  fruit.gooseberry:
    label: grosella espinosa
    summary: Una pequeña baya redonda y translúcida; favorita de los jardines.
    info: |
      La grosella espinosa es una pequeña fruta típica de los jardines de Europa central.
      Existe en variedades verdes, rojas y amarillas.
      Es rica en vitamina C.
      El vino de grosella espinosa es una bebida apreciada históricamente.
  fruit.currant:
    label: grosella
    summary: Una pequeña baya roja, negra o blanca en racimo.
    info: |
      La grosella es una pequeña baya que crece en racimos.
      La grosella negra contiene más vitamina C que cualquier otra baya.
      La grosella negra es la base del sabor del licor de cassis y de la bebida británica Ribena.
      La grosella roja se usa en mermeladas y como decoración de postres.
  fruit.quince:
    label: membrillo
    summary: Una fruta amarilla y dura emparentada con la manzana; siempre se come cocida.
    info: |
      El membrillo está emparentado con la manzana y la pera; crudo es duro y astringente.
      Siempre se procesa con calor en dulce de membrillo, vino o aguardiente de membrillo.
      Contiene mucha pectina, apta para hacer mermeladas.
      La mermelada más antigua documentada en Europa (siglo XVI) se hacía de membrillo.
  fruit.jackfruit:
    label: yaca
    summary: Una enorme fruta tropical; la fruta más grande del mundo que crece en un árbol.
    info: |
      La yaca produce las frutas más grandes que crecen en un árbol; pueden pesar más de 35 kg.
      Viene de la Asia tropical y es un alimento básico en India, Bangladés y Tailandia.
      La yaca verde tiene una textura neutra y se usa como sustituto vegetariano de la carne.
      Los trozos amarillos maduros son dulces y aromáticos.
  fruit.durian:
    label: durián
    summary: Una gran fruta tropical espinosa de olor fuerte; el rey de las frutas tropicales.
    info: |
      Al durián se le llama el rey de las frutas tropicales.
      Su fuerte olor es repugnante para algunos y tentador para otros; en muchos hoteles asiáticos está prohibido.
      La pulpa es cremosa y dulce, con un sabor complejo a almendra, vainilla y queso.
      En el sudeste asiático se lo aprecia como un lujo refinado.
  fruit.rambutan:
    label: rambután
    summary: Una fruta tropical roja y peluda, parecida al lichi.
    info: |
      El rambután viene de Malasia; el nombre proviene del malayo rambut, que significa cabello.
      Su cáscara roja está cubierta de suaves prolongaciones en forma de gancho.
      La pulpa es translúcida y dulce, como la del lichi.
      Es rico en vitamina C y hierro.
  fruit.longan:
    label: longan
    summary: Una pequeña fruta tropical marrón, emparentada con el lichi.
    info: |
      El longan es el fruto de un árbol tropical originario de China.
      El nombre proviene del chino long yan, que significa ojo de dragón, por la pulpa translúcida con una semilla negra.
      Tiene un sabor dulce y aromático.
      En la medicina tradicional china se considera un alimento que fortalece la sangre y el corazón.
  fruit.tamarind:
    label: tamarindo
    summary: Una vaina marrón de pulpa ácida; base de la cocina tailandesa.
    info: |
      El tamarindo viene del África tropical; hoy se cultiva en todos los trópicos.
      La pulpa es muy ácida y dulce; se usa en el pad thai, en la salsa Worcestershire y en el chutney indio.
      La palabra viene del árabe tamr hindi, que significa dátil indio.
      Es rico en ácido tartárico, vitaminas del grupo B y hierro.
  fruit.nectarine:
    label: nectarina
    summary: Un durazno liso y sin vello; jugoso y dulce.
    info: |
      La nectarina es una mutación natural del durazno con piel lisa.
      Se distingue del durazno solo por el gen de la lisura de la piel.
      Tiene un sabor parecido, pero una estructura más firme.
      El nombre proviene del néctar de los dioses y da fe de su supuesta perfección.
  fruit.damson:
    label: ciruela damascena
    summary: Una pequeña ciruela oscura, típica de los jardines rurales ingleses.
    info: |
      La ciruela damascena es una pequeña variedad de ciruela de color azul-negro oscuro.
      El nombre damson viene de Damasco, de donde la fruta llegó a Europa.
      Cruda es muy ácida, pero excelente en mermeladas, compotas y ginebra (damson gin).
      En la tradición inglesa se cultiva desde la antigüedad.
  fruit.medlar:
    label: níspero
    summary: Una pequeña fruta marrón emparentada con la manzana; debe madurar tras la cosecha.
    info: |
      El níspero común es una antiquísima planta de jardín cultivada desde la Edad Media.
      Solo es comestible tras ablandarse (blandeo), es decir, tras madurar después de la cosecha.
      Es rico en taninos y vitamina C.
      Shakespeare lo menciona en Romeo y Julieta; hoy es más bien una curiosidad para jardineros.
  fruit.ackee:
    label: akí
    summary: Una fruta tropical roja de arilos amarillos comestibles; fruta nacional de Jamaica.
    info: |
      El akí es la fruta nacional de Jamaica; recibió su nombre del capitán Bligh (1793).
      Solo los arilos amarillos maduros son comestibles; la fruta verde o demasiado madura es tóxica (hipoglicina A).
      El ackee and saltfish es el plato nacional de Jamaica.
      Viene de África occidental y fue llevada al Caribe a través de la trata de esclavos.
  fruit.feijoa:
    label: feijoa
    summary: Una pequeña fruta ovalada y verde de pulpa aromática.
    info: |
      La feijoa viene de Sudamérica.
      Su pulpa tiene un intenso sabor aromático a piña, guayaba y menta.
      Es muy popular en Nueva Zelanda como fruta de otoño.
      Es poco conocida en Europa, pero apreciada en los países de origen.
