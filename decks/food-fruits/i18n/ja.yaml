lang: ja
pivot: false
title: 果物
cards:
  fruit.apple:
    label: リンゴ
    summary: 甘酸っぱい味の、丸い赤や緑の果物。
    info: リンゴはリンゴの木の果実で、世界で最も広く栽培される作物の一つ。ビタミンCと食物繊維を含み、7,500以上の品種がある。
  fruit.banana:
    label: バナナ
    summary: 甘い果肉を持つ黄色い熱帯の果物。
    info: バナナはバショウ科の熱帯植物の果実。カリウムと、すばやくエネルギーになる天然の糖が豊富である。
  fruit.orange:
    label: オレンジ
    summary: かんきつ類の丸い果物で、香りのよいオレンジ色の皮を持つ。
    info: オレンジは東南アジア原産のかんきつ類で、今は世界中で栽培される。ビタミンCが豊富で、ジュースとして親しまれている。
  fruit.strawberry:
    label: イチゴ
    summary: 赤くみずみずしい、ハート形の果物。
    info: イチゴはバラ科の人気の果物。ビタミンCと抗酸化物質が豊富で、夏に収穫される。
  fruit.grape:
    label: ブドウ
    summary: 房になって実る、小さく丸い果実。
    info: ブドウの木は、緑から濃い紫までさまざまな色のブドウを実らせる。ブドウは生で食べたり、干してレーズンにしたり、しぼってワインにしたりする。
  fruit.watermelon:
    label: スイカ
    summary: 緑の縞模様のある大きな果物で、赤くみずみずしい果肉を持つ。
    info: スイカはアフリカ原産で、人気の夏の果物。92%が水分で、赤い色のもとになるリコピンを含む。
  fruit.mango:
    label: マンゴー
    summary: みずみずしい黄橙色の果肉を持つ熱帯の果物。
    info: マンゴーは熱帯果実の王と呼ばれる。ビタミンAとCが豊富で、南アジア原産。そこでは4,000年にわたり栽培されてきた。
  fruit.cherry:
    label: サクランボ
    summary: 対になって実る、小さく丸い赤い核果。
    info: サクランボは甘果桜の果実で、人気の夏の果物。抗酸化物質とメラトニンを含み、甘い品種と酸っぱい品種がある。
  fruit.pear:
    label: 洋ナシ
    summary: 甘くやさしい味の、しずく形の果物。
    info: 洋ナシはリンゴに近い西洋梨の果実。やわらかくみずみずしい果肉と高い食物繊維を持ち、数百の品種がある。
  fruit.pineapple:
    label: パイナップル
    summary: とげのある冠と黄金色の果肉を持つ熱帯の果物。
    info: パイナップルは南アメリカ原産で、今は世界中の熱帯で栽培される。消化を助ける酵素ブロメラインを含む。
  fruit.lemon:
    label: レモン
    summary: 黄色くて酸っぱいかんきつ類で、ビタミンCと香りの源。
    info: |
      レモンはアジア原産の酸っぱいかんきつ類である。
      ビタミンCとクエン酸が豊富である。
      料理、飲み物、化粧品、洗剤に使われる。
      レモンの皮には、独特のレモンの香りを持つ精油が含まれる。
  fruit.lime:
    label: ライム
    summary: 小さく緑で酸っぱいかんきつ類で、熱帯料理の要となる材料。
    info: |
      ライムは酸っぱい果汁と香り高い皮を持つ、小さな緑のかんきつ類である。
      メキシコ、タイ、ベトナムの料理に欠かせない。
      レモンよりビタミンCは少ないが、香りは強い。
      ライムを食べることで、船乗りはビタミンCのおかげで壊血病を防いだ。
  fruit.kiwi:
    label: キウイ
    summary: 茶色く毛の生えた、緑の果肉を持つ果物で、ビタミンが豊富。
    info: |
      キウイは中国原産で、そこでは中国スグリと呼ばれる。
      ニュージーランドがこれを商品化し、国鳥のキーウィにちなんで改名した。
      オレンジの二倍のビタミンCを含む。
      果肉は鮮やかな緑色で、黄金色(黄色)の品種もある。
  fruit.peach:
    label: モモ
    summary: ビロードのような黄桃色の核果で、夏の象徴。
    info: |
      モモは中国原産で、そこでは不老不死の象徴である。
      やわらかくビロードのような皮が特徴である。
      白い品種と黄色い品種があり、ネクタリンは毛のないなめらかな品種である。
      中国では、モモは正月と癒やしの神話の一部となっている。
  fruit.plum:
    label: セイヨウスモモ
    summary: 紫の核果で、プラムブランデーとプラムジャムのもと。
    info: |
      セイヨウスモモは中央ヨーロッパの基本の果物である。
      スリヴォヴィッツ(プラムブランデー)は、チェコとスロバキアの伝統的な蒸留酒である。
      プラムジャムは秋の収穫の代表的な産物である。
      世界には2,000以上のスモモの品種がある。
  fruit.apricot:
    label: アンズ
    summary: 小さなオレンジ色の核果で、甘酸っぱくてみずみずしい。
    info: |
      アンズは中央アジア原産である。
      ヨーロッパ全域で栽培され、最も甘いものはトルコとスペインから来る。
      ベータカロテンとビタミンAが豊富である。
      干しアンズは、人気の健康的なおやつである。
  fruit.raspberry:
    label: ラズベリー
    summary: 赤い集合果で、夏の庭の象徴。
    info: |
      ラズベリーは多くの小さな核果からなる集合果である。
      野生でも栽培でも育ち、収穫は夏と秋である。
      ビタミンCとK、マンガン、抗酸化物質が豊富である。
      ラズベリーのジャムと酢は、伝統的なごちそうである。
  fruit.blueberry:
    label: ブルーベリー
    summary: 濃い青色の果実で、抗酸化物質に満ちたスーパーフード。
    info: |
      ブルーベリーは、強い抗酸化作用を持つ色素アントシアニンが豊富である。
      アントシアニンが濃い青色をもたらす。
      研究は、認知機能と心臓の健康への良い効果を示している。
      栽培ブルーベリーは、野生のものより大きい。
  fruit.blackberry:
    label: ブラックベリー
    summary: とげのある低木になる、濃い紫の集合果。
    info: |
      ブラックベリーは、とげのある低木に実る濃い紫の集合果である。
      野生のブラックベリーは、森のふちや茂みに生える。
      ビタミンC、ビタミンK、食物繊維を多く含む。
      ブラックベリーのジャム、コンポート、リキュールは伝統的な産物である。
  fruit.coconut:
    label: ココナッツ
    summary: 硬い殻と白い果肉を持つ、大きな熱帯の果実。
    info: |
      ココナッツはココヤシの果実で、植物学的には核果であり、ナッツではない。
      未熟な果実の中のココナッツウォーターは、天然の等張飲料である。
      ココナッツミルクとオイルは、東南アジアとインドの料理の基本である。
      ココヤシは千の用途を持つ木と呼ばれる。
  fruit.papaya:
    label: パパイヤ
    summary: 濃いオレンジ色の果肉を持つ、大きな熱帯の果物。
    info: |
      パパイヤは熱帯アメリカ原産である。
      たんぱく質の消化を助ける酵素パパインを含む。
      ビタミンC、ベータカロテン、抗酸化物質が豊富である。
      未熟なパパイヤは、東南アジア料理で野菜として使われる(ソムタムのサラダなど)。
  fruit.guava:
    label: グアバ
    summary: 香りが強く、白またはピンクの果肉を持つ熱帯の果物。
    info: |
      グアバは熱帯アメリカ原産で、熱帯アジアとアフリカに広まった。
      オレンジの四倍のビタミンCを含む。
      皮も種も食べられ、果物全体が栄養に富む。
      グアバのジュースとジャムは、熱帯の国々で人気の産物である。
  fruit.pomegranate:
    label: ザクロ
    summary: 千の甘い種を持つ赤い果物で、豊穣の象徴。
    info: |
      ザクロは中央アジアと地中海地域の原産である。
      透明な赤い果肉(仮種皮)に包まれた600以上の種を含む。
      抗酸化物質が豊富で、心臓や炎症への効果が研究されている。
      多くの文化で、豊穣と豊かさの象徴である。
  fruit.fig:
    label: イチジク
    summary: イチジクの木になる洋ナシ形の果物で、甘く種が多い。
    info: |
      イチジクは最も古い栽培果実の一つで、その痕跡は1万1千年前にさかのぼる。
      実は果物ではなく、何千もの小さな花が詰まった袋である。
      聖書の物語のアダムとエバのイチジクの葉は、イチジクの木の葉である。
      干しイチジクは、カルシウム、カリウム、食物繊維のすぐれた供給源である。
  fruit.date:
    label: デーツ
    summary: ナツメヤシになる、甘い茶色の楕円形の果実で、中東の主食。
    info: |
      デーツはナツメヤシの甘い果実である。
      何千年もの間、中東の主食であった。
      60%以上の糖分を含み、際立ったエネルギー源である。
      イスラム教では、デーツは伝統的にラマダンの断食明け(イフタール)に最初に食べられる。
  fruit.melon:
    label: メロン
    summary: オレンジ、緑、白の果肉を持つ、大きく甘い果物。
    info: |
      メロンは水分の多い、熱帯から亜熱帯の果物である。
      アフリカとアジアの原産で、今は世界中で栽培される。
      90%以上が水分で、とてもみずみずしい。
      カンタロープ、ハネデュー、ガリアなど、数百の品種がある。
  fruit.cantaloupe:
    label: カンタロープ
    summary: 網目模様の皮と、濃いオレンジ色の果肉を持つメロン。
    info: |
      カンタロープはアジア原産の人気のメロンの品種である。
      名は、ローマ近郊の教皇の別荘カンタルーポに由来する。
      オレンジ色の果肉はベータカロテンとビタミンAが豊富である。
      最も甘いメロンの品種の一つである。
  fruit.grapefruit:
    label: グレープフルーツ
    summary: 大きく甘苦いかんきつ類で、ダイエットの花形。
    info: |
      グレープフルーツはオレンジとブンタンの交配種である。
      18世紀にバルバドスで記載された。
      ピンクと赤のグレープフルーツはリコピンとベータカロテンを含む。
      グレープフルーツジュースは多くの薬と相互作用するため、患者は医師に伝えるべきである。
  fruit.tangerine:
    label: ミカン
    summary: 皮のむきやすい、小さく甘いかんきつ類で、クリスマスの象徴。
    info: |
      ミカンは中国原産の、皮のむきやすい小さなかんきつ類である。
      中国の旧正月と幸運の象徴である。
      多くの国で、クリスマスの代表的な果物である。
      ビタミンC、抗酸化物質、フラボノイドを含む。
  fruit.passion_fruit:
    label: パッションフルーツ
    summary: しわのある皮と、種の多い香り高い果肉を持つ熱帯の果物。
    info: |
      パッションフルーツは熱帯南アメリカの原産である。
      その名は、花にキリストの受難の象徴を見た宣教師に由来する。
      果肉は、香り高いゼリーに包まれた種でいっぱいである。
      ビタミンC、食物繊維、抗酸化物質のすぐれた供給源である。
  fruit.lychee:
    label: ライチ
    summary: 透明な果肉を持つ、小さく赤い熱帯の果物で、アジアで親しまれる。
    info: |
      ライチは中国原産の熱帯果実である。
      ざらついた赤い皮は簡単にむけ、透明な白い果肉が現れる。
      甘く、繊細な香りの味である。
      中国では、幸運と繁栄の象徴である。
  fruit.dragon_fruit:
    label: ドラゴンフルーツ
    summary: 白い斑点のある果肉を持つ、ピンクの熱帯サボテンの果実。
    info: |
      ドラゴンフルーツ(ピタヤ)はメキシコと中央アメリカの原産である。
      鮮やかなピンクの皮と、黒い種の入った白い果肉はとても装飾的である。
      味はおだやかで、抗酸化物質とビタミンCを含む。
      ジュース、スムージー、飾りのデザートにされる。
  fruit.starfruit:
    label: スターフルーツ
    summary: 切ると星形になる、黄色い熱帯の果物。
    info: |
      スターフルーツは南アジアと東南アジアの原産である。
      横に切ると完全な星形になり、そこから英名スターフルーツがついた。
      甘酸っぱい味で、ビタミンCが豊富である。
      腎臓病の人は、シュウ酸のため食べてはいけない。
  fruit.avocado:
    label: アボカド
    summary: クリーミーな熱帯の核果で、ワカモレのもと。
    info: |
      アボカドはメキシコと中央アメリカの原産である。
      植物学的には果物(核果)だが、料理では野菜として使われる。
      オリーブオイルと同じく、健康的な一価不飽和脂肪(オレイン酸)を含む。
      世界中で流行の健康食で、アボカドトーストは現代のカフェ文化の象徴である。
  fruit.persimmon:
    label: カキ
    summary: トマトに似たオレンジ色の果物で、甘く渋い。
    info: |
      カキは中国と日本の原産で、kakiとも呼ばれる。
      未熟なカキはタンニンが多く渋いが、熟すと蜜のように甘い。
      ビタミンAとC、ミネラルが豊富である。
      日本では、カキは伝統的な秋の果物である。
  fruit.mulberry:
    label: クワの実
    summary: クワの木になる濃い紫の果実で、カイコの餌。
    info: |
      クワの実はクワの木の果実で、クワの葉はカイコの餌である。
      白、赤、黒のクワの実があり、黒が最も甘い。
      歴史上、クワの栽培は絹の生産にとって重要だった。
      クワの実はレスベラトロール、ビタミンC、鉄が豊富である。
  fruit.cranberry:
    label: クランベリー
    summary: 小さく赤く酸っぱい果実で、アメリカの伝統的な材料。
    info: |
      クランベリーは、小さく酸っぱい赤い果実である。
      アメリカの感謝祭の伝統的な一部である(クランベリーソース)。
      大腸菌が尿路の壁に付着するのを防ぐプロアントシアニジンを含む。
      尿路感染症の予防におけるクランベリーの効果は、科学的に裏付けられている。
  fruit.gooseberry:
    label: セイヨウスグリ
    summary: 小さく丸い半透明の果実で、庭で人気。
    info: |
      セイヨウスグリは中央ヨーロッパの庭に典型的な小さな果物である。
      緑、赤、黄色の品種がある。
      ビタミンCが豊富である。
      セイヨウスグリのワインは、歴史的に親しまれてきた飲み物である。
  fruit.currant:
    label: スグリ
    summary: 房になる、小さく赤・黒・白の果実。
    info: |
      スグリは房になって実る小さな果実である。
      クロスグリは、すべての果実の中で最も多くのビタミンCを含む。
      クロスグリは、リキュールのカシスと、イギリスの飲み物ライビーナの味の基礎である。
      アカスグリは、ジャムやデザートの飾りに使われる。
  fruit.quince:
    label: マルメロ
    summary: リンゴに近い硬く黄色い果物で、いつも加熱して食べる。
    info: |
      マルメロはリンゴやナシに近く、生では硬く渋い。
      いつも加熱してマルメロゼリー(メンブリージョ)、ワイン、ブランデーにする。
      ペクチンが多く、ジャム作りに向いている。
      ヨーロッパで記録された最古のジャム(16世紀)は、マルメロで作られた。
  fruit.jackfruit:
    label: ジャックフルーツ
    summary: 巨大な熱帯の果物で、木になる世界最大の果実。
    info: |
      ジャックフルーツは木になる最大の果実を実らせ、35キロを超えることがある。
      熱帯アジア原産で、インド、バングラデシュ、タイの主食である。
      未熟なジャックフルーツは中立的な食感で、菜食の肉の代わりに使われる。
      熟した黄色い部分は甘く香り高い。
  fruit.durian:
    label: ドリアン
    summary: 強い匂いのある、大きくとげのある熱帯の果物で、熱帯果実の王。
    info: |
      ドリアンは熱帯果実の王と呼ばれる。
      その強い匂いは、ある人には不快で、ある人には魅力的である。多くのアジアのホテルで持ち込みが禁じられている。
      果肉はクリーミーで甘く、アーモンド、バニラ、チーズのような複雑な味がする。
      東南アジアでは、洗練されたぜいたく品として珍重される。
  fruit.rambutan:
    label: ランブータン
    summary: ライチに似た、赤く毛の生えた熱帯の果物。
    info: |
      ランブータンはマレーシア原産で、名はマレー語で毛を意味するランブットに由来する。
      赤い皮は、やわらかいかぎ形の突起におおわれている。
      果肉は透明で甘く、ライチのようである。
      ビタミンCと鉄が豊富である。
  fruit.longan:
    label: リュウガン
    summary: ライチに近い、小さく茶色の熱帯の果物。
    info: |
      リュウガンは中国原産の熱帯の木の果実である。
      名は中国語の竜眼に由来し、黒い種の入った透明な果肉から、竜の目を意味する。
      甘く香り高い味である。
      中国伝統医学では、血と心臓を養う食べ物とされる。
  fruit.tamarind:
    label: タマリンド
    summary: 酸っぱい果肉を持つ茶色いさやの果実で、タイ料理の基礎。
    info: |
      タマリンドは熱帯アフリカ原産で、今は熱帯全域で栽培される。
      果肉はとても酸っぱく甘い。パッタイ、ウスターソース、インドのチャツネに使われる。
      この語はアラビア語のタムル・ヒンディー(インドのナツメヤシの意)に由来する。
      酒石酸、ビタミンB群、鉄が豊富である。
  fruit.nectarine:
    label: ネクタリン
    summary: 毛のないなめらかなモモで、みずみずしく甘い。
    info: |
      ネクタリンは、皮のなめらかなモモの自然な突然変異である。
      皮のなめらかさを決める遺伝子だけがモモと異なる。
      味は似ているが、より締まった食感である。
      名は神々のネクタルに由来し、その完璧さとされるものを物語る。
  fruit.damson:
    label: ダムソンスモモ
    summary: イギリスの田舎の庭に典型的な、小さく色の濃いスモモ。
    info: |
      ダムソンスモモは、濃い青黒色の小さなスモモの品種である。
      ダムソンの名は、果物がヨーロッパへ伝わったダマスカスに由来する。
      生ではとても酸っぱいが、ジャム、コンポート、ジン(ダムソンジン)にすると絶品である。
      イギリスの伝統では、古代から栽培されてきた。
  fruit.medlar:
    label: セイヨウカリン
    summary: リンゴに近い小さく茶色い果物で、収穫後に追熟させなければならない。
    info: |
      セイヨウカリンは、中世から栽培されてきた古い庭の植物である。
      やわらかくなって(ブレッティング)から、つまり収穫後の追熟の後にはじめて食べられる。
      タンニンとビタミンCが豊富である。
      シェイクスピアは『ロミオとジュリエット』で言及している。今日ではむしろ園芸家の珍品である。
  fruit.ackee:
    label: アキー
    summary: 食べられる黄色い仮種皮を持つ赤い熱帯の果物で、ジャマイカの国果。
    info: |
      アキーはジャマイカの国果で、ブライ船長(1793年)にちなんで名づけられた。
      熟した黄色い仮種皮だけが食べられ、未熟または熟しすぎた果実は有毒である(ヒポグリシンA)。
      アキー・アンド・ソルトフィッシュは、ジャマイカの国民食である。
      西アフリカ原産で、奴隷貿易を通じてカリブ海に運ばれた。
  fruit.feijoa:
    label: フェイジョア
    summary: 香り高い果肉を持つ、小さく楕円形の緑の果物。
    info: |
      フェイジョアは南アメリカ原産である。
      果肉は、パイナップル、グアバ、ミントのような強い香りの味を持つ。
      ニュージーランドでは、秋の果物としてとても人気がある。
      ヨーロッパではあまり知られていないが、原産国では親しまれている。
