lang: ja
pivot: false
title: 果物
cards:
  fruit.ackee:
    label: アキー
    summary: 赤みがかかった熱帯的な実があり、その中に食べられる黄緑色の種子を含むのが特徴である。これはまたジャマイカの象徴的果樹でもあるのです。
    info: アキ（学名：Blighia sapida）はジャマイカの国果物であり、キャプテン・ブレイにちなんで命名されました。食用になるのは熟した黄色い種子だけです；未成熟または過度に熟れた実は毒性があります（成分としてヒポグリシンＡが含まれます）。『アキーとソルトフィッシュ』という料理はジャマイカの国民食であります。
  fruit.apple:
    label: りんご
    summary: 丸くて赤色または緑色の、やさしく酸味のある果物。
    info: リンゴはマクス・ドメスティカという木からなる果実で、世界中で最も栽培されている果物の一つです。ビタミンCと食物繊維を含んでいます。7500種類以上の品種が存在します。
  fruit.apricot:
    label: プラム
    summary: 小さくオレンジ色をしていて、酸味があり果汁たっぷり
    info: '{"hint":"オレンジ色の小さな石果実（プルナス・アルメニアカ）","info":"梅（プルナス・アルメニアクア）は中央アジアが原産地です。チェコやヨーロッパ全体で栽培されており、最も甘いのはトルコとスペインからのものです。","beta-カロテンおよびビタミンAに豊富なため健康食品として人気があります。")'
  fruit.avocado:
    label: アボガド
    summary: アイコン的guacamole材料
    info: |-
      {"hint":"クリーム状の緑色果肉を持つ熱帯フルーツ（ペルセア・アメリカナ）","info":"バターアワーズ（学名：Persea americana）はメキシコと中央アメリカ原産です。
      植物的には実物であるが、料理では野菜として使われます。
      オリーブオイルと同じように健康的な単不飽和脂肪酸を含んでいます。世界中で健康食品トレンドとなっています；トーストに載せたアボカドは現代カフェ文化における象徴的な存在です。
  fruit.banana:
    label: バナナ
    summary: 黄色い果肉を持つ甘い熱帯の果物。
    info: バナナは、熱帯植物であるマスカット属（Musaceae）の果実です。カリウムと自然な糖分が豊富で、すぐにエネルギーを補給する効能があります。
  fruit.blackberry:
    label: オストロジナ
    summary: トゲのある木立ち上でのみ生じる深く青味がかった赤褐色の複合的な小粒
    info: |-
      {"hint":"暗紫色の黒いベリー（ルーブス・フルティコサス）","info":"ブラックベリーやフクシアなど、トゲのあるツタ植物に実る濃紺色から紫黑色をした複果。
      野生では森やジャングルで育つ。ビタミンCとKおよび食物繊維が豊富である。
      ジャムやコンポート、ラキールなどの伝統的な製品がある。
  fruit.blueberry:
    label: blueberry
    summary: 深く青紫色の果実； 抗氧化物質たっぷりスーパーサイズ食品
    info: |-
      {"hint":"小さな暗い青色のベリー（ Vaccinium corymbosum）","info":"ブルーベリ－（野生は Vaccinium myrtillus、園芸種では V.corymbosum）にはアントシアニンが豊富に含まれています。
       アントシアニンによってブルーベリ－がその濃紺色を持ち、強い抗酸化作用を示します。研究によると認知機能や心臓への有益な影響があることがわかっています。
       园芸用ブルーベリ－(highbush)は野生成れよりも大きく育つ傾向があります。
  fruit.cantaloupe:
    label: '"kanatalūpu"'
    summary: 黄褐色で網目調子な皮をした鮮烈な橙色の果肉を持ったメロン
    info: |-
      {"hint":"オレンジ色の果肉を持つネット状に模様のあるメロン（クウカムス・メリオン・ヴァリアブル・カンタルプエンシス）","info":"カンタループ（学名：Cucumis melo var. cantalupensi）は、アジアが原産地である人気あるメロンドモドキ。
      その名称はラーマ近郊にある教皇領キャンタルーから来ている。
      濃いオレンジ色の果肉にはベーターカロテンやビタミンAが多く含まれており栄養価が高い。
      これは最も甘味があるタイプのメロンとして知られている。"}
  fruit.cherry:
    label: サクランボ
    summary: ペアで生える小さな赤い丸い果実。
    info: サクランボは、鳥桃（ちょうとう）の木に実る人気のある夏の果物です。抗酸化作用を持つ成分やメラトニンを含んでいます。甘口と酸味がある品種があります。
  fruit.coconut:
    label: ヤギノミズキ
    summary: 硬い皮を持ち白く柔らかい肉が入った大きな熱帯の堅果です。
    info: "{\"hint\":\"大型の熱帯果実で繊維質な殻を持つ（コクナシ属）\",\"info\":\"ヤギノミズキ（学名：Cocus nucifera）は、椰子の木に結ぶ実であり植物的には種ではなく核である。\r\n未熟な実は内部には天然イオン飲料として知られる椰子水を含んでいる。\r\n椰子乳と油は東南アジアおよびインド料理において基本的な調味材料となる。\r\n椰子の木は「万能樹」や生命の木とも呼ばれる。\",\"label\":\"ヤギノミズキ\",\"summary\":\"硬い皮を持ち白く柔らかい肉が入った大きな熱帯の堅果\"}"
  fruit.cranberry:
    label: ブルシカ
    summary: 小型で酸味のある紅色な野菜であり、米国における感謝祭用料理として一般的なものだ。
    info: |-
      {"hint":"小さなタルトレッドベリー（ビーチクルマモン）","info":"ブルシカ（学名：Vacium macrocarpon）は、小さくて酸っぱい赤色の果実です。
      アメリカのお礼参り（クラムべリーソースとして使われる）に伝統的に含まれています。
      プロアントシアニジンを含んでおり、Eコリ菌が尿路壁にくっつくことを防ぎます。
      膀胱炎などの泌尿器感染症予防治療効果があることが科学的証拠によって確認されています。","label":"ブルシカ","summary":"小さい酸っぱい赤い野菜；米国の祝祭品である伝統的な食材"}
  fruit.currant:
    label: ルピアズ
    summary: 束になった形で生育する小さな赤色、黑色あるいは白色の実
    info: "{\"hint\":\"小さな赤、黒または白い実（リーベス）\",\"info\":\"ルビース（学名：リベス）はクラスター状に生える小粒の果物です。\r\nブラック・ルピアズ（リベス ニグロム）にはすべてのベリーの中で最も多くのビタミンCが含まれています。\r\nブラック・ルピアズは英国のお酒であるリベンやカシューという利尻酎などの基本的な風味として使われます。\r\nレッド・ルピアズはジャム作りにも利用されたりデザート類を飾るための装飾としても用いられます。\"}"
  fruit.damson:
    label: ダマスカーン・プリューム
    summary: 英国民家の田舎風ガーディングにおいて典型的な小ぶりな紫色のサクラナシ
    info: "{\"hint\":\"小型で暗い青黒色のプラム品種\",\"info\":\"ダマスカーン・プルーム（damson）は、小さな濃紺から黒に近い紫蘇葉のような実をつけるブドウモチ科の果樹です。\r\n名前はシリアの大都市ダマースクが語源であり、この果実はヨーロッパへと運ばれてきました。\r\n生では非常に酸味がありますが、ジャムやポワードル、ジン（特に damson ジンとして知られるものがあります）。またイギリス文化の中でも古代より栽培されており、伝統的な農村庭園にも見られます。\"}"
  fruit.date:
    label: '"deats"'
    summary: 「Date Palm」の甘くて茶色の卵型の果実； 中近東における基本的な食物
    info: |-
      {"hint":"date palmの甘い茶色で卵形の果実（Phoenix dactylifera）","info":"デーツ（Phoenix dactylifera）は、フィキア属に含まれる植物である。
      これらの果実は非常に甘く、エネルギー源として重要であり、中東地域では数千年前から主要な食料とされている。
      また、イスラム教においては、断食月ルームザーンが終わると伝統的に最初にお供えされる食べ物でもある。"}
  fruit.dragon_fruit:
    label: ドラキー・オヴォチェ
    summary: 淡紅色の熱帯サボテン果実で、白く斑入りな果肉があります。
    info: "{\"hint\":\"ピンクの熱帯サボテン果実で、白い斑点のある果肉（ヒロケルス）\",\"info\":\"ドラキー・オヴォチェ（ピタヤ、ヒロケレウス属）はメキシコおよび中央アメリカ原産です。\r\n鮮やかな桃色の皮と黒い種が入った白色の果肉があり非常に装飾的です。 \r\n味わいは繊細であり、抗酸化物質やビタミンCを含みます。\r\nジュースやフラペチェノ、デコレーションデザートに使われています。\",\"label\":\"ドラキー・オヴォチェ\",\"summary\":\"淡紅色の熱帯サボテン果実で、白く斑入りな果肉があります。"
  fruit.durian:
    label: ドリアン
    summary: 強烈なにおいを持つ大型トゲのある熱帯フルーツ；「熱帯果実の王者」として知られる
    info: ドリアン（学名：Durio zibethinus）は熱帯果物の王と呼ばれる。強い香りがあり、一部の人にとっては不快に感じるが他の人には魅力的で、多くのアジアホテルでは禁止されていることがある。
  fruit.feijoa:
    label: フィヨア
    summary: オвал型のかさばった緑色の香り高い実。
    info: |-
      フィヨア（学名：Acacia sellowiana、またはFeyoia sellowiana）は南アメリカ原産の果物です。
      その果汁にはパインやグァバ、メントールのような強い芳香があります。
      ニュージーランドでは秋に人気のある果物ですが、欧州での知名度は低く、故郷である国々で好まれています。
  fruit.fig:
    label: fig
    summary: 無花果属の木の梨状な果実である；味わいはとても甘くて種子が多い
    info: "{\"hint\":\"梨型の果物で中身は甘く（Ficus carica）\",\"info\":\"イチジク（学名：Ficus carica）は、栽培されている最も古いフルーツの一つであり；その証拠が一万年前まで遡ります。\r\n実際にはこれは果実はなく、千個以上の小さな花を含む容器です。\r\n聖書に出てくるアダムとエバの葉っぱはフィグツリーから来ています。\r\n乾燥させたイチジクはカルシウムやカリウムそして食物繊維にとっても良い栄養源になります。\"}"
  fruit.gooseberry:
    label: アンゲルシュト
    summary: 小型の丸くて透き通った実は、庭でもよく見かけるものです。
    info: |-
      {"hint":"小さな半透明の緑色または赤い実（リベス・ウバ＝クリスピア）","info":"アンゲルシュト（学名： Ribes uva-crispa）は、ヨーロッパ中部で庭に植えられる典型的な果物です。
      これはグリーンやレッド、イエローなどの品種があります。
      ビタミンCが豊富であるため知られています。
      伝統的に人気のある飲みものとして、この果物から作られたジンジャーウォーターがあります。","label":"アンゲルシュト","summary":"小型の丸くて透き通った実は、庭でもよく見かけるものです。"}
  fruit.grape:
    label: ぶどう
    summary: つるに房状の集まりで生える小さな丸い果実。
    info: ブドウ（学名：Vitis vinifera）は、緑色から濃い紫まで様々な色を持つ果実を房のようにつける植物です。新鮮なまま食べたり、干してレーズンにしたり、またワインとして搾り取ることもあります。
  fruit.grapefruit:
    label: グレープフルーット
    summary: 大きな甘酸っぱい柑橘；ダイエットスーパースター
    info: "{\"hint\":\"大粒で苦味のある柑橘類（シトラス・パラダイジ）\",\"info\":\"グレープフルーツはオレンジとポンカンの雑交種です。\r\n17世紀にバルバドスで記録されました。\r\nピンクや赤いグレープフルーツにはリコペンおよびベータカロテンが含まれています。\""
  fruit.guava:
    label: ぐあば
    summary: 強い香りを持つ白またはピンク色の中身を持った熱帯フルーツ
    info: |-
      グアバ（学名： Psidium guajava）は熱帯アメリカ原産で、現在では熱帯アジアやアフリカにも広く分布しています。オレンジの約4倍ものビタミンCを含んでいます。
      皮と種子も食べられ、果実は全体的に栄養価が高いです。
      グァヴァジュースやジャムなど加工品が熱帯地域の人々に人気があります。
  fruit.jackfruit:
    label: ジャックフルーツ
    summary: 世界でもっとも大きな木の上にある熱帯果物
    info: |-
      {"hint":"巨大な緑のトゲのある熱帯果物（アートカーポス・ヘテロフィラス）","info":"ジャックフルーツ（学名：Artocarpus heterophyllus）は、木に実る最大級の果物を生み出す。重さが35kgを超えることもある。
      これは東南アジア原産で、インドやバングラデシュおよびタイでは主食として食べられている。
      未熟なジャックフルーツには中性的な質感があり、ベジタリアン向けのお肉代わりとしても使われる。
      成熟した黄色い部分は甘く芳香がある。
  fruit.kiwi:
    label: きゅう
    summary: 赤みがかかったかためいた外皮を持った果実は中に青い柔らかい内側があり、ビタミンたっぷりです。
    info: |-
      {"hint":"小ぶりな茶色の毛深い果物で、鮮やかな緑色の中身を持っている（アクトニディウム・デリシオーサ）","info":"キウィベリー（アクチノジア・デリショーザ）は中国が原産地であり、ヤンタオまたはチャイナゴースベリーと呼ばれている。
      ニュージーランドによって商業化され、「国鳥であるキウィ」にちなんで名前を変えられた。
      オレンジよりもビタミンCを二倍含んでいる。
      中身は非常に明るいグリーン；黄金色（黄色）の品種も存在する。","label":"キウィ","summary":"褐色のかたい皮を持つ果実で中の肉質部分は青く、ビタミン豊富"}
  fruit.lemon:
    label: '"レモン"'
    summary: 「酸味のある黄色な柑橘；ビタミンCと芳香成分の源」
    info: |-
      {"hint":"酸味のある黄色い柑橘系の果物（シトラス・リモン）","info":"レモンはアジア原産の酸っぱい柑橘類です。
      ビタミンCやクエン酸を豊富に含んでいます。
      料理、飲み物、化粧品および洗剤などにも使われます。
      アロマセラピーでは、レモングレイという香りが特徴的な精油があります。"}
  fruit.lime:
    label: ライム
    summary: 小型な青くて酸っぱい柑橘；熱帯食文化において重要な材料
    info: "{\"hint\":\"小ぶりで緑色の酸っぱい柑橘類（シトラス・オランティイフラリア）\",\"info\":\"ライムは、果汁が酸味があり芳香のある皮を持つ小さな緑色の柑橘です。メキシコ料理やタイ料理、ベトナム料理では欠かせない食材となっています。\r\nレモンよりもビタミンC含有量は少ないですが強い香りを持っています。\r\nライムを摂取することで船乗りたちはクルドジー病から守られました。（ビタミンCによるものです）。\",\"label\":\"ライム\",\"summary\":\"小型な青くて酸っぱい柑橘；熱帯食文化において重要な材料\"}"
  fruit.longan:
    label: ロンガーン
    summary: 小さな茶色の熱帯フルーツでライチに関係するもの
    info: |-
      {"hint":"","label":"lychee","summary":"熱帯の小型で丸い果物、リュウガンに似ている（ Dimocarpos longan）","info":"ルーガン （学名：ディモカーポス・ロングアン）は中国原産の中東や南アジア地域を含む世界中の熱帯地方で栽培される木の実です。
      「ドラゴネッズアイ」と呼ばれるのは透明な肉質と黒色種子から来ています。この名称は中国語『龍眼』が由来しています。
      甘く芳香のある味わいで知られています。
      伝統的な中医では血行促進効能があると考えられ健康食品として重宝されています。
  fruit.lychee:
    label: '"らいち"'
    summary: '"小さな赤い熱帯果物で、透明度がある実はアジア圏の人々に好まれています。"'
    info: |-
      {"hint":"小型の赤い粗肌質な熱帯果物で、透明感のある肉を持つ（リチシア・チャイネンシス）","info":"ライチ（学名：Litchia sinensis）は中国原産の熱帯フルーツです。
      そのザラついた赤色の皮を剥くと透き通った白い実が現れます。
      甘味があり、やさしい芳香があります。
      また、中国では幸福と繁栄の象徴でもあります。"}
  fruit.mango:
    label: マンゴー
    summary: 黄色いオレンジ色のジューシーな果肉を持つ熱帯果物。
    info: インドマングーは「熱帯果物の王」とも呼ばれる。ビタミンAとCが豊富で、南アジア原産であり、すでに4000年間栽培されている。
  fruit.medlar:
    label: みしぷれ
    summary: 梨によく似た褐色の小さな果実であり、収獲後にもさらに成熟する必要がある
    info: |-
      {"hint":"小ぶりな茶色のリンゴのような果物（ミスパルス・ゲルマニカ）","info":"ミシュプーレ（学名：Mespilus germanica）は中世から栽培されてきた古い園芸作物です。
      食べられるようになるまで熟成させる必要があります。収穫後に柔らかくなるまで置くのです。
      ポリフェノールやビタミンCが豊富に含まれています。
      シェイクスピアも『ロメオとジュリア』で言及しています；現代ではガーデナーたちにとって珍しい存在となっています。
  fruit.melon:
    label: メロン
    summary: 橙色、青色あるいは白色の果汁を持った大型の甘味のある果物である。
    info: '{"hint":"","label":"メロン","summary":"オレンジ色、緑または白の果肉を持つ大きな甘い実です。","info":{"definition": "メロン（学名：Cucumis melo）は熱帯から亜熱帯にかけて生育する高水分含有量を特徴とする果物です。","origin_and_distribution": "アフリカやアジアが原産地で現在では世界中で栽培されています。","nutritional_value": "水含量率が90％以上であり補水効能が高いことが知られています。","varieties": "種類も多くキャンタロープ・ハニーデュー・ガリア・シャランタイなどがあります。",},}'
  fruit.mulberry:
    label: マルシュ
    summary: 紫黑色で、マツバカエデという植物からの果物であり、サテンガエルにとって食物となる
    info: |-
      {"hint":"長くて暗い実、桑の木（モルス種）から","info":"マルシュはマツバカエデ属；マツバカエデの葉っぱはサテンガエルに食べられる。
      白・赤・黒があり、最も甘いのは黒色である。歴史上では、蚕を育てるために重要な役割を持った。
      マルシュにはレスベラトロールやビタミンCと鉄分が豊富にある。
  fruit.nectarine:
    label: nekatarinkka
    summary: 毛なしでツヤのある果実；ジューシーかつ甘美
    info: '{"info":"ネクタリンカ（学名：プルナス・ペリーカ バリアント・ヌキペリスクア）は、滑らかな皮を持つモモの自然な突然変異である。\n他のモモと唯一異なる点は肌がつるっとしているという遺伝子だけだ。\n味わいは似ているものの、よりしっかりとした食感を持っている。\nその名称は神々の飲み物「nectar」に由来し、「完璧さ」という印象を表すためにつけられた。'
  fruit.orange:
    label: オレンジ
    summary: 香ばしい橙色の皮を持つ丸い柑橘類の果実。
    info: オレンジは東南アジア原産の柑橘系の果物で、今日では世界中で栽培されています。ビタミンCが豊富に含まれており、ジュースとして人気があります。
  fruit.papaya:
    label: '"パパイユ"'
    summary: '"明るい橙色のかさを持つ大型の熱帯フルーツ。"'
    info: "{\"hint\":\"オレンジ色の熱帯果物（カーリア・パワヤ）\",\"info\":\"パパイヤは熱帯アメリカ原産です。\r\nたんぱく質消化を助ける酵素であるパパインが含まれています。\r\nビタミンC、ベーターカロテンおよび抗酸化成分も豊富に含みます。\r\n未熟な状態では東南アジア料理で野菜として使われることがあります。（例：サムタンサラダなど）。\"}"
  fruit.passion_fruit:
    label: '"mautchinka"'
    summary: 「熱帯のしわのある紫いぼと芳香的な内容を持つ果実」
    info: |-
      {"hint":"熱帯のつる性果物で、しわのある紫色の皮を持っている（Passiflora edulis）","info":"マッチェンカ（Passiflora edulis）は熱帯南アメリカ原産です。
      名前がつけられたのは使徒たちによって、花にキリストの苦難を象徴するものを見たからだそうです。
      その果汁の中には香り高いゼリー状の中に種々類が多く詰まっています。
      これはビタミンCや食物繊維・抗酸化成分などの優れた供給源でもあります。"
  fruit.peach:
    label: peach
    summary: 柔らかい赤みがかった黄色の果実；夏の象征
    info: "{\"hint\":\"柔らかくふわふわした黄色からピンク色の石のような果物（サクラ属・モモ）\",\"info\":\"桃（モモ、学名：Prunus persica）は中国原産で不老不死を象徴する。\r\nその滑らかなセーター状の皮が特徴的である。白や黄い品種があり；ネクトリンスという無毛な平たい変異もある。\r\n中国では新年と医療的な神話に使われる。"
  fruit.pear:
    label: なし
    summary: 涙の形をした、甘く穏やかな味わいの果物。
    info: ナシはリンゴに近縁な梨の木（学名：Pyrus）が結実する果物です。柔らかくて多汁で繊維質が多く含まれており、何百もの品種があります。
  fruit.persimmon:
    label: トメル
    summary: オレンジ色のかすかな赤みのある外観を持つ、トマトによく似た果物；非常に甘くて渇いた味わい
    info: |-
      {"hint":"オレンジ色のトマトのような果物（ディオスピロス・カキ）","info":"トメル（学名：Diopyros kaki）は中国と日本原産で、チェコでは「日本のトメル」として知られている。未熟なトメルは渋く酸っぱいが、成熟すると蜂蜜のように甘くなる。
      この果実はビタミンAやCおよび鉱物質を豊富に含んでいる。
      また、日本においては伝統的な秋の実りとして『かき』という名称でも親しまれている。
  fruit.pineapple:
    label: パイナップル
    summary: トゲのある冠と黄色い果肉を持つ熱帯の果物。
    info: パイナップルは南アメリカ原産で、現在では世界中の熱帯地域で栽培されています。消化を助ける酵素ブロメラインを含んでいます。
  fruit.plum:
    label: プラム
    summary: 紫色の小なり；スリボニツァやジャムなどの原料
    info: |-
      {"hint":"小さな楕円形の紫石のような果物（Prunus domestica）","info":"プラム（学名：Prunus domestica）は、ヨーロッパ中部で最も基本的なフルーツです。
      スリボニツァという伝統的なチェコとスロバキアのお酒に使われます。\r\nポイドゥラ・シュヴェストカもこの実から作られます。\r\n世界中には約2000種類以上の品種があります。
  fruit.pomegranate:
    label: グレープフルーティング
    summary: 千もの甘い種を持った赤色の果実で、豊穣や多子などの象徴とされています。
    info: '{"hint":"赤く、多数の種を持つ冠のような果物（Punica granatum）","info":"グレープフルーツは中央アジアおよび地中海地域が原産です。透明な赤い肉質部分に約600個以上の種を含んでいます。")'
  fruit.quince:
    label: かじらみ
    summary: リンゴによく似た堅い黄色な実は食用になる前に必ず加熱する必要があり、その加工品として有名なものにはジャムや酒類がある。
    info: |-
      {"hint":"黄色くて硬く、香りのある果物（クドリア・オブロンガ）","info":"カジラミはリンゴやナシに近い植物で；生では固く酸っぱい。
      常に熱処理されて使われる：カジラミジャム（メモブラッロ）、カジラミワイン、カジラミ焼酎などがある。
      ペクトインが多く含まれており、ジャム作りに向いている。
      ヨーロッパ最古のマーマレード記録（15世紀頃）もこのカジラミから作られていた。","label":"かじらみ","summary":"リンゴによく似た堅い黄色な実をつける木であるが、加熱調理して食べられる"}
  fruit.rambutan:
    label: ラムタン
    summary: 紅色のかわいた熱帯フルーツであり、ライチによく似た味を持っています。
    info: ランブータン（学名：Nephelium lappaceum）はマレーシア原産で、その名称は「髪」を意味するマレー語の『rambut』に由来します。赤い果皮には柔らかな棘状突起が生えています。果汁部分は透明できれいな甘さがありライチとよく似ており、ビタミンCや鉄分も豊富です。
  fruit.raspberry:
    label: マリン
    summary: 紅色の複合的 berries ; 夏を象徴する庭園の植物
    info: "{\"hint\":\"小粒の赤い実で、ドリュプレット（ルーブス・イデウス）からなる\",\"info\":\"ラズベリー（学名：Rubus idaeus）は多くの小さな果房（drupletts）によって作られる合成された berries。\r\n野生でも栽培され；収穫期は夏と秋です。\r\nビタミンCやK、マンガンおよび抗酸化物質が豊富に含まれています。\r\nラズベリージャムやラズベリー酢など伝統的な料理があります。\"}"
  fruit.starfruit:
    label: カランプオ
    summary: 切ると五角形になる黄緑色の熱帯フルーツ
    info: "{\"hint\":\"星型の黄色い熱帯果物（アヴェルローア・カラムボラ）\",\"info\":\"カルンポーラ（学名：アヴェルローア・カラムボラ）は、南アジアおよび東南アジア原産です。\r\n横切りにすると完璧なスター状になります。（それがスターフルーツと呼ばれる理由です。）\r\n酸味がありながらも甘く、ビタミンCが豊富です。\r\n腎臓病を持つ人々には含まれる草酸のために摂取を避けるべきです。"
  fruit.strawberry:
    label: いちご
    summary: 赤くてジューシーなハート型のベリー。
    info: イチゴはバラ科に属する人気のある果物で、ビタミンCや抗酸化物質が豊富です。夏に収穫され、甘く香ります。
  fruit.tamarind:
    label: タマリンド
    summary: 茶色の豆状の果物であり、中身はとても酸っぱくて、タイ料理において基本的な調理材料になります
    info: |-
      {"hint":"ブラウンの豆のような果実で、酸っぱいパルプ（タマリンドゥス・インディカ）","info":"タマルインド（学名：Tamarindus indica）は熱帯アフリカ原産ですが、現在では世界中の熱帯地域で栽培されています。
      その果汁は非常に酸味があり甘く、タイ料理Pad Thaiや Worcestershire ドレッシングおよびインド風チャツニーに使われます。語源は「tamr」がアラビア語から来ており、「hindi」というのはヒンズー人の意味です。「Indic dates（インドのドライフルーツ）」を指しています。
      またそれはグルタルアルギニクという酢酸とB群維生素そして鉄分も豊富なものです。
  fruit.tangerine:
    label: '"mandarin"'
    summary: ' "小振りで甘い外皮を持つ果実；クリスマスのシンボル."'
    info: |-
      {"hint":"小ぶりで甘く、皮が簡単にむけるオレンジ（柑橘類）","info":"マンダリンカクテルナシ（学名：Citrus reticulata）は中国原産の小さなスイートな柑橘です。
      これは中国正月と幸せを象徴しています。
      チェコでは典型的にクリスマス時期のお菓子として知られています。
      ビタミンCや抗酸化物質およびフラボノイドが多く含まれています。"
  fruit.watermelon:
    label: 水メロン
    summary: 緑の縞模様で赤いジューシーな果肉を持つ大きな果物。
    info: 水メロンはアフリカ原産の夏の果物であり、人気があります。水分が全体の92％を占め、赤色を与えるルテインを含んでいます。
