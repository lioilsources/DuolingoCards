lang: fr
pivot: false
title: Fruits
cards:
  fruit.apple:
    label: pomme
    summary: Un fruit rond, rouge ou vert, à la saveur aigre-douce.
    info: La pomme est le fruit du pommier domestique, l'une des cultures les plus répandues au monde. Elle contient de la vitamine C et des fibres ; il existe plus de 7 500 variétés.
  fruit.banana:
    label: banane
    summary: Un fruit tropical jaune à la chair sucrée.
    info: La banane est le fruit d'une plante tropicale de la famille des bananiers. Elle est riche en potassium et en sucres naturels qui procurent une énergie rapide.
  fruit.orange:
    label: orange
    summary: Un fruit d'agrume rond à l'écorce orange parfumée.
    info: L'orange est un agrume originaire d'Asie du Sud-Est, aujourd'hui cultivé dans le monde entier. Elle est riche en vitamine C et appréciée en jus.
  fruit.strawberry:
    label: fraise
    summary: Une baie rouge, juteuse et en forme de cœur.
    info: La fraise des jardins est un fruit apprécié de la famille des rosacées. Riche en vitamine C et en antioxydants, elle se récolte en été et dégage un parfum sucré.
  fruit.grape:
    label: raisin
    summary: Une petite baie ronde poussant en grappes.
    info: La vigne produit des raisins de couleurs variées, du vert au violet foncé. Le raisin se mange frais, se sèche en raisins secs ou se presse pour faire du vin.
  fruit.watermelon:
    label: pastèque
    summary: Un gros fruit vert rayé à la chair rouge et juteuse.
    info: La pastèque vient d'Afrique et est un fruit d'été apprécié. Elle est composée à 92 % d'eau et contient du lycopène, qui lui donne sa couleur rouge.
  fruit.mango:
    label: mangue
    summary: Un fruit tropical à la chair juteuse jaune-orangé.
    info: La mangue est surnommée la reine des fruits tropicaux. Riche en vitamines A et C, elle vient d'Asie du Sud, où on la cultive depuis 4 000 ans.
  fruit.cherry:
    label: cerise
    summary: Une petite drupe ronde et rouge poussant par paires.
    info: La cerise est le fruit du cerisier, un fruit d'été apprécié. Elle contient des antioxydants et de la mélatonine ; il existe des variétés douces et acides (griottes).
  fruit.pear:
    label: poire
    summary: Un fruit en forme de larme à la saveur douce et délicate.
    info: La poire est le fruit du poirier commun, proche parent du pommier. Elle a une chair tendre et juteuse et une haute teneur en fibres ; il existe des centaines de variétés.
  fruit.pineapple:
    label: ananas
    summary: Un fruit tropical à la couronne épineuse et à la chair dorée.
    info: L'ananas vient d'Amérique du Sud et est aujourd'hui cultivé dans toute la zone tropicale. Il contient une enzyme, la broméline, qui aide à la digestion.
  fruit.lemon:
    label: citron
    summary: Un agrume jaune et acide ; source de vitamine C et d'arôme.
    info: |
      Le citron est un agrume acide originaire d'Asie.
      Il est riche en vitamine C et en acide citrique.
      On l'utilise en cuisine, dans les boissons, en cosmétique et dans les produits d'entretien.
      L'écorce du citronnier (Citrus limon) contient une huile essentielle au parfum de citron caractéristique.
  fruit.lime:
    label: citron vert
    summary: Un petit agrume vert et acide ; ingrédient clé de la cuisine tropicale.
    info: |
      Le citron vert est un petit agrume au jus acide et au zeste aromatique.
      Il est indispensable dans les cuisines mexicaine, thaïlandaise et vietnamienne.
      Il contient moins de vitamine C que le citron, mais un arôme plus puissant.
      Manger des citrons verts protégeait les marins du scorbut (vitamine C).
  fruit.kiwi:
    label: kiwi
    summary: Un fruit brun et poilu à la chair verte ; riche en vitamines.
    info: |
      Le kiwi (Actinidia deliciosa) vient de Chine, où on l'appelle groseille de Chine.
      La Nouvelle-Zélande l'a commercialisé et rebaptisé d'après son oiseau national, le kiwi.
      Il contient deux fois plus de vitamine C qu'une orange.
      La chair est d'un vert vif ; il existe aussi des variétés dorées (jaunes).
  fruit.peach:
    label: pêche
    summary: Une drupe veloutée jaune-rosé ; symbole de l'été.
    info: |
      La pêche (Prunus persica) vient de Chine, où elle est un symbole d'immortalité.
      Sa peau douce et veloutée est caractéristique.
      Il existe des variétés blanches et jaunes ; la nectarine est la variété lisse, sans duvet.
      En Chine, les pêches font partie du Nouvel An et de la mythologie médicinale.
  fruit.plum:
    label: prune
    summary: Une drupe violette ; base de l'eau-de-vie de prune et de la confiture.
    info: |
      La prune (Prunus domestica) est un fruit de base de l'Europe centrale.
      La slivovitz (eau-de-vie de prune) est une eau-de-vie traditionnelle tchèque et slovaque.
      La confiture de prunes est un produit typique de la récolte d'automne.
      Il existe plus de 2 000 variétés de prunes dans le monde.
  fruit.apricot:
    label: abricot
    summary: Une petite drupe orange ; aigre-douce et juteuse.
    info: |
      L'abricot (Prunus armeniaca) vient d'Asie centrale.
      On le cultive dans toute l'Europe ; les plus doux viennent de Turquie et d'Espagne.
      Il est riche en bêta-carotène et en vitamine A.
      Les abricots secs sont un en-cas sain apprécié.
  fruit.raspberry:
    label: framboise
    summary: Une baie composée rouge ; symbole du jardin d'été.
    info: |
      La framboise (Rubus idaeus) est une baie composée de nombreuses petites drupéoles.
      Elle pousse à l'état sauvage et cultivée ; la récolte a lieu en été et en automne.
      Riche en vitamines C et K, en manganèse et en antioxydants.
      La confiture et le vinaigre de framboise sont des mets traditionnels.
  fruit.blueberry:
    label: myrtille
    summary: Une baie bleu foncé ; un superaliment plein d'antioxydants.
    info: |
      La myrtille (Vaccinium myrtillus sauvage, V. corymbosum cultivée) est riche en anthocyanes.
      Les anthocyanes lui donnent sa couleur bleu foncé et de fortes propriétés antioxydantes.
      Des études suggèrent des bienfaits pour les fonctions cognitives et la santé du cœur.
      Les myrtilles cultivées sont plus grosses que les sauvages des forêts.
  fruit.blackberry:
    label: mûre
    summary: Une baie composée violet foncé issue de la ronce.
    info: |
      La mûre (Rubus fruticosus) est une baie composée violet foncé poussant sur un buisson épineux.
      La mûre sauvage pousse en lisière de forêt et dans les broussailles.
      Elle contient beaucoup de vitamine C, de vitamine K et de fibres.
      La confiture, la compote et la liqueur de mûre sont des produits traditionnels.
  fruit.coconut:
    label: noix de coco
    summary: Une grosse noix tropicale à coque dure et à chair blanche.
    info: |
      La noix de coco (Cocos nucifera) est le fruit du cocotier ; botaniquement c'est une drupe, non une noix.
      L'eau de coco à l'intérieur du fruit non mûr est une boisson isotonique naturelle.
      Le lait et l'huile de coco sont à la base de la cuisine d'Asie du Sud-Est et indienne.
      Le cocotier est appelé l'arbre aux mille usages.
  fruit.papaya:
    label: papaye
    summary: Un gros fruit tropical à la chair orange vif.
    info: |
      La papaye (Carica papaya) vient d'Amérique tropicale.
      Elle contient une enzyme, la papaïne, qui favorise la digestion des protéines.
      Elle est riche en vitamine C, en bêta-carotène et en antioxydants.
      La papaye verte est utilisée comme légume dans la cuisine d'Asie du Sud-Est (salade som tam).
  fruit.guava:
    label: goyave
    summary: Un fruit tropical au parfum intense et à la chair blanche ou rose.
    info: |
      La goyave (Psidium guajava) vient d'Amérique tropicale et s'est répandue dans l'Asie et l'Afrique tropicales.
      Elle contient quatre fois plus de vitamine C qu'une orange.
      La peau et les graines sont comestibles ; le fruit entier est nutritif.
      Le jus et la confiture de goyave sont des produits populaires dans les pays tropicaux.
  fruit.pomegranate:
    label: grenade
    summary: Un fruit rouge aux mille graines sucrées ; symbole de fécondité.
    info: |
      La grenade (Punica granatum) vient d'Asie centrale et du bassin méditerranéen.
      Elle contient plus de 600 graines entourées d'une chair rouge translucide (arilles).
      Riche en antioxydants ; des études examinent ses effets sur le cœur et l'inflammation.
      Elle symbolise la fécondité et l'abondance dans de nombreuses cultures (grecque, juive, islamique).
  fruit.fig:
    label: figue
    summary: Un fruit en forme de poire du figuier ; sucré et plein de graines.
    info: |
      La figue (Ficus carica) est l'un des plus anciens fruits cultivés ; les traces remontent à 11 000 ans.
      En réalité ce n'est pas un fruit, mais un réceptacle rempli de milliers de minuscules fleurs.
      Les feuilles d'Adam et Ève dans le récit biblique sont des feuilles de figuier.
      Les figues sèches sont une excellente source de calcium, de potassium et de fibres.
  fruit.date:
    label: datte
    summary: Un fruit brun et ovale sucré du dattier ; aliment de base du Moyen-Orient.
    info: |
      Les dattes (Phoenix dactylifera) sont les fruits sucrés du palmier dattier.
      Elles sont un aliment de base du Moyen-Orient depuis des millénaires.
      Elles contiennent plus de 60 % de sucre et sont une source d'énergie remarquable.
      En islam, on mange traditionnellement les dattes en premier pour rompre le jeûne du ramadan (Iftar).
  fruit.melon:
    label: melon
    summary: Un gros fruit sucré à la chair orange, verte ou blanche.
    info: |
      Le melon (Cucumis melo) est un fruit tropical à subtropical à haute teneur en eau.
      Il vient d'Afrique et d'Asie ; on le cultive aujourd'hui dans le monde entier.
      Il contient plus de 90 % d'eau ; il est très désaltérant.
      Il existe des centaines de variétés, dont le cantaloup, le honeydew, le galia et le charentais.
  fruit.cantaloupe:
    label: cantaloup
    summary: Un melon brodé jaune-brun à la chair orange vif.
    info: |
      Le cantaloup (Cucumis melo var. cantalupensis) est une variété de melon appréciée, originaire d'Asie.
      Son nom vient de la résidence papale de Cantalupo près de Rome.
      La chair orange est riche en bêta-carotène et en vitamine A.
      C'est l'un des types de melon les plus sucrés.
  fruit.grapefruit:
    label: pamplemousse
    summary: Un gros agrume doux-amer ; star des régimes.
    info: |
      Le pamplemousse (Citrus paradisi) est un hybride de l'orange et du pomélo.
      Il a été décrit au XVIIIe siècle à la Barbade.
      Le pamplemousse rose et rouge contient du lycopène et du bêta-carotène.
      Le jus de pamplemousse interagit avec de nombreux médicaments ; les patients doivent en informer leur médecin.
  fruit.tangerine:
    label: mandarine
    summary: Un petit agrume sucré à l'écorce lâche ; symbole de Noël.
    info: |
      La mandarine (Citrus reticulata) est un petit agrume facile à éplucher, originaire de Chine.
      Elle est un symbole du Nouvel An chinois et de la chance.
      Dans de nombreux pays, c'est un fruit de Noël typique.
      Elle contient de la vitamine C, des antioxydants et des flavonoïdes.
  fruit.passion_fruit:
    label: fruit de la passion
    summary: Un fruit tropical à peau violette ridée et à pulpe aromatique pleine de graines.
    info: |
      Le fruit de la passion (Passiflora edulis) vient d'Amérique du Sud tropicale.
      Son nom vient des missionnaires qui voyaient dans sa fleur les symboles de la passion du Christ.
      La pulpe est pleine de graines enrobées d'un gel aromatique.
      C'est une excellente source de vitamine C, de fibres et d'antioxydants.
  fruit.lychee:
    label: litchi
    summary: Un petit fruit tropical rouge à la chair translucide ; apprécié en Asie.
    info: |
      Le litchi (Litchi chinensis) est un fruit tropical originaire de Chine.
      Sa peau rouge rugueuse s'épluche pour révéler une chair blanche translucide.
      Il a une saveur douce et délicatement aromatique.
      En Chine, c'est un symbole de bonheur et de prospérité.
  fruit.dragon_fruit:
    label: fruit du dragon
    summary: Un fruit de cactus tropical rose à la chair blanche tachetée.
    info: |
      Le fruit du dragon (pitaya, Hylocereus) vient du Mexique et d'Amérique centrale.
      Sa peau rose vif et sa chair blanche à graines noires sont très décoratives.
      Il a une saveur douce ; il contient des antioxydants et de la vitamine C.
      On en fait des jus, des smoothies et des desserts décoratifs.
  fruit.starfruit:
    label: carambole
    summary: Un fruit tropical jaune qui forme des étoiles à la coupe.
    info: |
      La carambole (Averrhoa carambola) vient d'Asie du Sud et du Sud-Est.
      Coupée en travers, elle forme une étoile parfaite (d'où starfruit).
      Elle a une saveur aigre-douce ; elle est riche en vitamine C.
      Les personnes atteintes d'une maladie rénale ne doivent pas en manger à cause des oxalates.
  fruit.avocado:
    label: avocat
    summary: Une drupe tropicale crémeuse ; base du guacamole.
    info: |
      L'avocat (Persea americana) vient du Mexique et d'Amérique centrale.
      Botaniquement c'est un fruit (une drupe), mais on l'utilise en cuisine comme un légume.
      Il contient de bonnes graisses mono-insaturées (acide oléique) comme l'huile d'olive.
      C'est un aliment santé à la mode dans le monde ; la tartine d'avocat est une icône de la culture café moderne.
  fruit.persimmon:
    label: kaki
    summary: Un fruit orange semblable à une tomate ; sucré et astringent.
    info: |
      Le kaki (Diospyros kaki) vient de Chine et du Japon ; on l'appelle aussi plaquemine.
      Le kaki non mûr est tannique et astringent ; mûr, il est sucré comme du miel.
      Il est riche en vitamines A et C et en minéraux.
      Au Japon, c'est un fruit d'automne traditionnel (kaki).
  fruit.mulberry:
    label: mûre du mûrier
    summary: Une baie violet foncé du mûrier ; nourriture du ver à soie.
    info: |
      La mûre du mûrier (Morus) est la baie du mûrier ; les feuilles du mûrier sont la nourriture du ver à soie.
      Il existe des mûres blanches, rouges et noires ; la noire est la plus sucrée.
      Dans l'histoire, la culture du mûrier fut essentielle à la sériciculture.
      Les mûres sont riches en resvératrol, en vitamine C et en fer.
  fruit.cranberry:
    label: canneberge
    summary: Une petite baie rouge et acide ; ingrédient américain traditionnel.
    info: |
      La canneberge (Vaccinium macrocarpon) est une petite baie rouge et acide.
      Elle est un élément traditionnel de Thanksgiving aux États-Unis (sauce à la canneberge).
      Elle contient des proanthocyanidines, qui empêchent la bactérie E. coli d'adhérer aux parois des voies urinaires.
      L'effet de la canneberge sur la prévention des infections urinaires est scientifiquement établi.
  fruit.gooseberry:
    label: groseille à maquereau
    summary: Une petite baie ronde et translucide ; appréciée dans les jardins.
    info: |
      La groseille à maquereau (Ribes uva-crispa) est un petit fruit typique des jardins d'Europe centrale.
      Elle existe en variétés vertes, rouges et jaunes.
      Elle est riche en vitamine C.
      Le vin de groseille à maquereau est une boisson historiquement appréciée.
  fruit.currant:
    label: groseille
    summary: Une petite baie rouge, noire ou blanche en grappe.
    info: |
      La groseille (Ribes) est une petite baie poussant en grappes.
      Le cassis (Ribes nigrum) contient le plus de vitamine C de toutes les baies.
      Le cassis est à la base de l'arôme du Ribena (boisson britannique) et de la liqueur de cassis.
      La groseille rouge s'utilise dans les confitures et comme décoration de desserts.
  fruit.quince:
    label: coing
    summary: Un fruit jaune et dur, proche de la pomme ; se consomme toujours cuit.
    info: |
      Le coing (Cydonia oblonga) est proche du pommier et du poirier ; cru, il est dur et astringent.
      On le transforme toujours à la chaleur ; confiture de coing (membrillo), vin et eau-de-vie de coing.
      Il contient beaucoup de pectine, idéale pour faire des confitures.
      La plus ancienne marmelade attestée en Europe (XVIe siècle) était faite de coings.
  fruit.jackfruit:
    label: jacque
    summary: Un fruit tropical énorme ; le plus gros fruit poussant sur un arbre au monde.
    info: |
      Le jacquier (Artocarpus heterophyllus) produit les plus gros fruits poussant sur un arbre ; ils peuvent peser plus de 35 kg.
      Il vient d'Asie tropicale ; c'est un aliment de base en Inde, au Bangladesh et en Thaïlande.
      Le jacque non mûr a une texture neutre et sert de substitut de viande végétarien.
      Les arilles jaunes mûrs sont sucrés et aromatiques.
  fruit.durian:
    label: durian
    summary: Un gros fruit tropical épineux à l'odeur forte ; le roi des fruits tropicaux.
    info: |
      Le durian (Durio zibethinus) est appelé le roi des fruits tropicaux.
      Son odeur forte est repoussante pour les uns, attirante pour les autres ; il est interdit dans de nombreux hôtels asiatiques.
      La chair est crémeuse et sucrée, à la saveur complexe (amande, vanille, fromage).
      En Asie du Sud-Est, il est prisé comme un luxe raffiné.
  fruit.rambutan:
    label: ramboutan
    summary: Un fruit tropical rouge et poilu, semblable au litchi.
    info: |
      Le ramboutan (Nephelium lappaceum) vient de Malaisie ; son nom vient du malais rambut = cheveux.
      Sa peau rouge est couverte de pointes molles et crochues.
      La chair est translucide et sucrée, semblable au litchi.
      Il est riche en vitamine C et en fer.
  fruit.longan:
    label: longane
    summary: Un petit fruit tropical brun, apparenté au litchi.
    info: |
      Le longane (Dimocarpus longan) est le fruit d'un arbre tropical originaire de Chine.
      Son nom vient du chinois long yan = œil de dragon, en raison de la chair translucide à graine noire.
      Il a une saveur douce et aromatique.
      En médecine traditionnelle chinoise, il est considéré comme un aliment qui soutient le sang et le cœur.
  fruit.tamarind:
    label: tamarin
    summary: Un fruit brun en gousse à la pulpe acide ; base de la cuisine thaïlandaise.
    info: |
      Le tamarin (Tamarindus indica) vient d'Afrique tropicale ; on le cultive aujourd'hui dans toute la zone tropicale.
      La pulpe est très acide et sucrée ; on l'utilise dans le Pad Thaï, la sauce Worcestershire et le chutney indien.
      Le mot vient de l'arabe tamr hindi = datte indienne.
      Il est riche en acide tartrique, en vitamines B et en fer.
  fruit.nectarine:
    label: nectarine
    summary: Une pêche lisse sans duvet ; juteuse et sucrée.
    info: |
      La nectarine (Prunus persica var. nucipersica) est une mutation naturelle de la pêche à la peau lisse.
      Elle ne diffère de la pêche que par le gène de la lisseur de la peau.
      Elle a une saveur semblable, mais une texture plus ferme.
      Son nom vient du nectar des dieux ; il témoigne de sa perfection perçue.
  fruit.damson:
    label: prune de Damas
    summary: Une petite prune foncée typique des jardins de campagne anglais.
    info: |
      La prune de Damas (damson) est une petite variété de prune bleu-noir foncé.
      Son nom vient de Damas, d'où le fruit a voyagé jusqu'en Europe.
      Crue, elle est très acide, mais excellente en confitures, compotes et gin (damson gin).
      Dans la tradition anglaise, on la cultive depuis l'Antiquité.
  fruit.medlar:
    label: nèfle
    summary: Un petit fruit brun apparenté au pommier ; doit mûrir après la récolte.
    info: |
      La nèfle (Mespilus germanica) est une très ancienne plante de jardin cultivée depuis le Moyen Âge.
      Elle n'est comestible qu'après blettissement, c'est-à-dire après avoir ramolli après la récolte.
      Elle est riche en tanins et en vitamine C.
      Shakespeare la mentionne dans Roméo et Juliette ; aujourd'hui, c'est plutôt une curiosité de jardinier.
  fruit.ackee:
    label: akée
    summary: Un fruit tropical rouge aux arilles jaunes comestibles ; fruit national de la Jamaïque.
    info: |
      L'akée (Blighia sapida) est le fruit national de la Jamaïque ; il porte le nom du capitaine Bligh (1793).
      Seuls les arilles jaunes mûrs sont comestibles ; le fruit non mûr ou trop mûr est toxique (hypoglycine A).
      L'ackee and saltfish est le plat national de la Jamaïque.
      Il vient d'Afrique de l'Ouest ; il a été amené aux Caraïbes par la traite des esclaves.
  fruit.feijoa:
    label: feijoa
    summary: Un petit fruit vert ovale à la chair aromatique.
    info: |
      Le feijoa (Acca sellowiana, aussi Feijoa sellowiana) vient d'Amérique du Sud.
      Sa chair a une saveur aromatique intense (ananas, goyave, menthe).
      Il est très populaire en Nouvelle-Zélande comme fruit d'automne.
      Peu connu en Europe, mais apprécié dans ses pays d'origine.
