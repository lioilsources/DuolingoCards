lang: uk
pivot: false
title: Фрукти
cards:
  fruit.apple:
    label: яблуко
    summary: Круглий червоний або зелений плід із солодко-кислим смаком.
    info: Яблуко — плід яблуні домашньої, однієї з найпоширеніших культур у світі. Містить вітамін C і клітковину; існує понад 7500 сортів.
  fruit.banana:
    label: банан
    summary: Жовтий тропічний плід із солодкою м'якоттю.
    info: Банан — плід тропічної рослини родини бананових. Багатий на калій і природні цукри, що дають швидку енергію.
  fruit.orange:
    label: апельсин
    summary: Круглий цитрусовий плід із запашною жовтогарячою шкіркою.
    info: Апельсин — цитрусовий плід родом із Південно-Східної Азії, нині вирощуваний по всьому світу. Багатий на вітамін C і улюблений як сік.
  fruit.strawberry:
    label: полуниця
    summary: Червона соковита ягода у формі серця.
    info: Суниця садова — улюблений плід родини розових. Багата на вітамін C і антиоксиданти; збирається влітку й солодко пахне.
  fruit.grape:
    label: виноград
    summary: Маленька кругла ягода, що росте гронами.
    info: Виноградна лоза дає виноград різних кольорів — від зеленого до темно-фіолетового. Виноград їдять свіжим, сушать на родзинки або пресують на вино.
  fruit.watermelon:
    label: кавун
    summary: Великий зелено-смугастий плід із червоною соковитою м'якоттю.
    info: Кавун походить з Африки й є улюбленим літнім плодом. Він на 92 % складається з води й містить лікопін, що надає йому червоного кольору.
  fruit.mango:
    label: манго
    summary: Тропічний плід із соковитою жовто-жовтогарячою м'якоттю.
    info: Манго індійське називають королем тропічних фруктів. Багате на вітаміни A і C, походить із Південної Азії, де вирощується вже 4000 років.
  fruit.cherry:
    label: черешня
    summary: Маленька кругла червона кістянка, що росте парами.
    info: Черешня — плід вишні пташиної, улюблений літній фрукт. Містить антиоксиданти й мелатонін; існують солодкі й кислі (вишневі) сорти.
  fruit.pear:
    label: груша
    summary: Плід у формі краплі із солодким ніжним смаком.
    info: Груша — плід груші звичайної, близької родички яблуні. Має ніжну, соковиту м'якоть і високий вміст клітковини; існують сотні сортів.
  fruit.pineapple:
    label: ананас
    summary: Тропічний плід із колючою короною й золотистою м'якоттю.
    info: Ананас походить із Південної Америки й нині вирощується в тропічному поясі всього світу. Містить фермент бромелайн, що допомагає травленню.
  fruit.lemon:
    label: лимон
    summary: Кислий жовтий цитрус; джерело вітаміну C і аромату.
    info: |
      Лимон — кислий цитрусовий плід родом з Азії.
      Він багатий на вітамін C і лимонну кислоту.
      Його використовують у кулінарії, напоях, косметиці й засобах для чищення.
      Шкірка лимонного дерева (Citrus limon) містить ефірну олію з характерним лимонним ароматом.
  fruit.lime:
    label: лайм
    summary: Маленький зелений кислий цитрус; ключовий інгредієнт тропічної кухні.
    info: |
      Лайм — маленький зелений цитрус із кислим соком і ароматною шкіркою.
      Він незамінний у мексиканській, тайській і в'єтнамській кухні.
      Він містить менше вітаміну C, ніж лимон, але сильніший аромат.
      Споживання лаймів захищало моряків від цинги (вітамін C).
  fruit.kiwi:
    label: ківі
    summary: Коричневий волохатий плід із зеленою м'якоттю; багатий на вітаміни.
    info: |
      Ківі (Actinidia deliciosa) походить із Китаю, де його називають китайським аґрусом.
      Нова Зеландія ввела його в продаж і перейменувала на честь національного птаха ківі.
      Він містить удвічі більше вітаміну C, ніж апельсин.
      М'якоть яскраво-зелена; існують і золоті (жовті) сорти.
  fruit.peach:
    label: персик
    summary: Оксамитова жовто-рожева кістянка; символ літа.
    info: |
      Персик (Prunus persica) походить із Китаю, де є символом безсмертя.
      Його ніжна оксамитова шкірка характерна.
      Існують білі й жовті сорти; нектарин — гладенький різновид без пушку.
      У Китаї персики — частина Нового року й цілющої міфології.
  fruit.plum:
    label: слива
    summary: Фіолетова кістянка; основа сливовиці й повидла.
    info: |
      Слива (Prunus domestica) — основний плід Центральної Європи.
      Сливовиця (сливовий дистилят) — традиційний чеський і словацький самогон.
      Сливове повидло — типовий продукт осіннього врожаю.
      У світі існує понад 2000 сортів слив.
  fruit.apricot:
    label: абрикос
    summary: Маленька жовтогаряча кістянка; солодко-кисла й соковита.
    info: |
      Абрикос (Prunus armeniaca) походить із Центральної Азії.
      Його вирощують по всій Європі; найсолодші — з Туреччини та Іспанії.
      Багатий на бета-каротин і вітамін A.
      Сушені абрикоси — популярна корисна перекуска.
  fruit.raspberry:
    label: малина
    summary: Червона збірна ягода; символ літнього саду.
    info: |
      Малина (Rubus idaeus) — збірна ягода з багатьох дрібних кістянок.
      Вона росте дикою й культурною; збір триває влітку й восени.
      Багата на вітаміни C і K, марганець і антиоксиданти.
      Малинове варення й малиновий оцет — традиційні ласощі.
  fruit.blueberry:
    label: чорниця
    summary: Темно-синя ягода; суперфуд, повний антиоксидантів.
    info: |
      Чорниця (Vaccinium myrtillus дика, V. corymbosum садова) багата на антоціани.
      Антоціани надають їй темно-синього кольору й сильних антиоксидантних властивостей.
      Дослідження вказують на позитивний вплив на когнітивні функції та здоров'я серця.
      Садова лохина більша за дику лісову.
  fruit.blackberry:
    label: ожина
    summary: Темно-фіолетова збірна ягода з куща ожини.
    info: |
      Ожина (Rubus fruticosus) — темно-фіолетова збірна ягода, що росте на колючому кущі.
      Дика ожина росте по узліссях і в заростях.
      Містить багато вітаміну C, K і клітковини.
      Ожинове варення, компот і лікер — традиційні продукти.
  fruit.coconut:
    label: кокос
    summary: Великий тропічний горіх із твердою шкаралупою й білою м'якоттю.
    info: |
      Кокос (Cocos nucifera) — плід кокосової пальми; ботанічно це кістянка, а не горіх.
      Кокосова вода всередині незрілого плоду — природний ізотонічний напій.
      Кокосове молоко й олія — основа південно-східноазійської та індійської кухні.
      Кокосову пальму називають деревом тисячі застосувань.
  fruit.papaya:
    label: папая
    summary: Великий тропічний плід із насичено-жовтогарячою м'якоттю.
    info: |
      Папая (Carica papaya) походить із тропічної Америки.
      Вона містить фермент папаїн, що сприяє перетравленню білків.
      Багата на вітамін C, бета-каротин і антиоксиданти.
      Незріла папая використовується в південно-східноазійській кухні як овоч (салат сомтам).
  fruit.guava:
    label: гуава
    summary: Тропічний плід з інтенсивним ароматом і білою або рожевою м'якоттю.
    info: |
      Гуава (Psidium guajava) походить із тропічної Америки й поширилася по тропічній Азії та Африці.
      Містить учетверо більше вітаміну C, ніж апельсин.
      Шкірка й насіння їстівні; увесь плід поживний.
      Гуавовий сік і джем — популярні продукти в тропічних країнах.
  fruit.pomegranate:
    label: гранат
    summary: Червоний плід із тисячею солодких зерен; символ родючості.
    info: |
      Гранат (Punica granatum) походить із Центральної Азії та Середземномор'я.
      Він містить понад 600 зерен, оточених прозорою червоною м'якоттю (арилусами).
      Багатий на антиоксиданти; дослідження вивчають його вплив на серце й запалення.
      Він символізує родючість і достаток у багатьох культурах (грецькій, юдейській, ісламській).
  fruit.fig:
    label: інжир
    summary: Грушоподібний плід фігового дерева; солодкий і повний насіння.
    info: |
      Інжир (Ficus carica) — один із найдавніших культурних плодів; свідчення сягають 11 000 років тому.
      Насправді це не плід, а вмістище, наповнене тисячами крихітних квіток.
      Листя Адама і Єви в біблійній оповіді — листя фігового дерева.
      Сушений інжир — чудове джерело кальцію, калію й клітковини.
  fruit.date:
    label: фінік
    summary: Солодкий коричневий овальний плід фінікової пальми; основна їжа Близького Сходу.
    info: |
      Фініки (Phoenix dactylifera) — солодкі плоди фінікової пальми.
      Вони тисячоліттями були основною їжею Близького Сходу.
      Вони містять понад 60 % цукру й є потужним джерелом енергії.
      В ісламі фініки традиційно їдять першими при завершенні посту Рамадан (іфтар).
  fruit.melon:
    label: диня
    summary: Великий солодкий плід із жовтогарячою, зеленою або білою м'якоттю.
    info: |
      Диня (Cucumis melo) — тропічний і субтропічний плід із високим вмістом води.
      Походить з Африки та Азії; нині вирощується по всьому світу.
      Містить понад 90 % води; чудово втамовує спрагу.
      Існують сотні сортів, серед них канталупа, ханідью, галія й шарантре.
  fruit.cantaloupe:
    label: канталупа
    summary: Жовто-коричнева сітчаста диня з насичено-жовтогарячою м'якоттю.
    info: |
      Канталупа (Cucumis melo var. cantalupensis) — популярний сорт дині родом з Азії.
      Назва походить від папської резиденції Канталупо поблизу Рима.
      Жовтогаряча м'якоть багата на бета-каротин і вітамін A.
      Це один із найсолодших типів дині.
  fruit.grapefruit:
    label: грейпфрут
    summary: Великий гірко-солодкий цитрус; дієтична суперзірка.
    info: |
      Грейпфрут (Citrus paradisi) — гібрид апельсина й помело.
      Його описали у XVIII столітті на Барбадосі.
      Рожевий і червоний грейпфрут містять лікопін і бета-каротин.
      Грейпфрутовий сік взаємодіє з багатьма ліками; пацієнтам слід повідомити лікаря.
  fruit.tangerine:
    label: мандарин
    summary: Маленький солодкий цитрус із вільною шкіркою; символ Різдва.
    info: |
      Мандарин (Citrus reticulata) — маленький, легко очищуваний цитрус родом із Китаю.
      Він символ китайського Нового року й удачі.
      У багатьох країнах це типовий різдвяний фрукт.
      Містить вітамін C, антиоксиданти й флавоноїди.
  fruit.passion_fruit:
    label: маракуя
    summary: Тропічний плід зі зморшкуватою фіолетовою шкіркою й ароматною насіннєвою м'якоттю.
    info: |
      Маракуя (Passiflora edulis) походить із тропічної Південної Америки.
      Її назву дали місіонери, які бачили у квітці символи страстей Христових.
      М'якоть повна насіння, загорнутого в ароматний гель.
      Це чудове джерело вітаміну C, клітковини й антиоксидантів.
  fruit.lychee:
    label: лічі
    summary: Маленький червоний тропічний плід із прозорою м'якоттю; улюблений в Азії.
    info: |
      Лічі (Litchi chinensis) — тропічний плід родом із Китаю.
      Його груба червона шкірка очищається, відкриваючи прозору білу м'якоть.
      Він має солодкий, тонко-ароматний смак.
      У Китаї це символ щастя й процвітання.
  fruit.dragon_fruit:
    label: драконів фрукт
    summary: Рожевий тропічний плід кактуса з білою крапчастою м'якоттю.
    info: |
      Драконів фрукт (пітая, Hylocereus) походить із Мексики й Центральної Америки.
      Його яскраво-рожева шкірка й біла м'якоть із чорним насінням дуже декоративні.
      Він має м'який смак; містить антиоксиданти й вітамін C.
      З нього роблять соки, смузі й декоративні десерти.
  fruit.starfruit:
    label: карамбола
    summary: Жовтий тропічний плід, що утворює зірочки при нарізанні.
    info: |
      Карамбола (Averrhoa carambola) походить із Південної та Південно-Східної Азії.
      Нарізана впоперек, вона утворює ідеальну форму зірки (тому starfruit).
      Вона має кисло-солодкий смак; багата на вітамін C.
      Людям із хворобами нирок не слід її їсти через оксалати.
  fruit.avocado:
    label: авокадо
    summary: Кремова тропічна кістянка; основа гуакамоле.
    info: |
      Авокадо (Persea americana) походить із Мексики й Центральної Америки.
      Ботанічно це плід (кістянка), але кулінарно використовується як овоч.
      Містить корисні мононенасичені жири (олеїнову кислоту), як оливкова олія.
      Це модний у світі корисний продукт; тост з авокадо — ікона сучасної кав'ярняної культури.
  fruit.persimmon:
    label: хурма
    summary: Жовтогарячий плід, схожий на помідор; солодкий і терпкий.
    info: |
      Хурма (Diospyros kaki) походить із Китаю та Японії; її називають і какі.
      Незріла хурма терпка й в'яжуча; стигла солодка як мед.
      Багата на вітаміни A і C та мінерали.
      У Японії це традиційний осінній фрукт (какі).
  fruit.mulberry:
    label: шовковиця
    summary: Темно-фіолетова ягода шовковичного дерева; їжа тутового шовкопряда.
    info: |
      Шовковиця (Morus) — ягода шовковичного дерева; листя шовковиці — їжа тутового шовкопряда.
      Існують біла, червона й чорна шовковиця; чорна найсолодша.
      В історії вирощування шовковиці було ключовим для шовківництва.
      Шовковиця багата на ресвератрол, вітамін C і залізо.
  fruit.cranberry:
    label: журавлина
    summary: Маленька червона кисла ягода; традиційний американський інгредієнт.
    info: |
      Журавлина (Vaccinium macrocarpon) — маленька кисла червона ягода.
      Вона традиційна частина американського Дня подяки (журавлинний соус).
      Містить проантоціанідини, що перешкоджають прилипанню бактерій E. coli до стінок сечовивідних шляхів.
      Вплив журавлини на профілактику інфекцій сечовивідних шляхів науково підтверджений.
  fruit.gooseberry:
    label: аґрус
    summary: Маленька кругла напівпрозора ягода; улюблениця садів.
    info: |
      Аґрус (Ribes uva-crispa) — дрібний плід, типовий для садів Центральної Європи.
      Існує в зелених, червоних і жовтих сортах.
      Багатий на вітамін C.
      Агрусове вино — історично популярний напій.
  fruit.currant:
    label: смородина
    summary: Дрібна червона, чорна або біла ягода в китиці.
    info: |
      Смородина (Ribes) — дрібна ягода, що росте колосоподібними китицями.
      Чорна смородина (Ribes nigrum) містить найбільше вітаміну C серед усіх ягід.
      Чорна смородина — основа смаку Ribena (британський напій) і лікеру касис.
      Червона смородина використовується в джемах і як прикраса десертів.
  fruit.quince:
    label: айва
    summary: Твердий жовтий плід, споріднений із яблуком; споживається завжди після теплової обробки.
    info: |
      Айва (Cydonia oblonga) споріднена з яблунею та грушею; сира вона тверда й в'яжуча.
      Її завжди обробляють теплом; айвовий джем (мембрильо), айвове вино й айвовий бренді.
      Містить багато пектину, придатного для приготування джемів.
      Найдавніший у Європі задокументований мармелад (XVI століття) робили з айви.
  fruit.jackfruit:
    label: джекфрут
    summary: Величезний тропічний плід; найбільший плід, що росте на дереві, у світі.
    info: |
      Джекфрут (Artocarpus heterophyllus) дає найбільші плоди, що ростуть на дереві; вони можуть важити понад 35 кг.
      Він походить із тропічної Азії; це основна їжа в Індії, Бангладеш і Таїланді.
      Незрілий джекфрут має нейтральну текстуру й використовується як вегетаріанська заміна м'яса.
      Стиглі жовті часточки солодкі й ароматні.
  fruit.durian:
    label: дуріан
    summary: Великий колючий тропічний плід із сильним запахом; король тропічних фруктів.
    info: |
      Дуріан (Durio zibethinus) називають королем тропічних фруктів.
      Його сильний запах для одних відразливий, для інших звабливий; у багатьох азійських готелях він заборонений.
      М'якоть кремова й солодка, зі складним смаком (мигдаль, ваніль, сир).
      У Південно-Східній Азії його цінують як вишукану розкіш.
  fruit.rambutan:
    label: рамбутан
    summary: Червоний волохатий тропічний плід, схожий на лічі.
    info: |
      Рамбутан (Nephelium lappaceum) походить із Малайзії; назва походить від малайського rambut = волосся.
      Його червона шкірка вкрита м'якими гачкуватими виростами.
      М'якоть прозора й солодка, схожа на лічі.
      Він багатий на вітамін C і залізо.
  fruit.longan:
    label: лонган
    summary: Маленький коричневий тропічний плід, споріднений із лічі.
    info: |
      Лонган (Dimocarpus longan) — плід тропічного дерева родом із Китаю.
      Назва походить від китайського long yan = око дракона, через прозору м'якоть із чорною кісточкою.
      Він має солодкий і ароматний смак.
      У традиційній китайській медицині його вважають їжею, що підтримує кров і серце.
  fruit.tamarind:
    label: тамаринд
    summary: Коричневий стручковий плід із кислою м'якоттю; основа тайської кухні.
    info: |
      Тамаринд (Tamarindus indica) походить із тропічної Африки; нині вирощується по всьому тропічному світу.
      М'якоть сильно кисла й солодка; використовується в Пад Таї, вустерському соусі й індійському чатні.
      Слово походить з арабської tamr hindi = індійський фінік.
      Він багатий на винну кислоту, вітаміни групи B і залізо.
  fruit.nectarine:
    label: нектарин
    summary: Гладенький персик без пушку; соковитий і солодкий.
    info: |
      Нектарин (Prunus persica var. nucipersica) — природна мутація персика з гладенькою шкіркою.
      Він відрізняється від персика лише геном гладкості шкірки.
      Має схожий смак, але щільнішу консистенцію.
      Назва походить від нектару богів; вона свідчить про його сприйману досконалість.
  fruit.damson:
    label: дамаська слива
    summary: Маленька темна слива, типова для англійських сільських садів.
    info: |
      Дамаська слива (damson) — маленький темно-синьо-чорний сорт сливи.
      Назва походить від Дамаска, звідки плід потрапив до Європи.
      Сира вона дуже кисла, але чудова в джемах, повидлі й джині (damson gin).
      В англійській традиції її вирощують з античності.
  fruit.medlar:
    label: мушмула
    summary: Маленький коричневий плід, споріднений із яблунею; має дозріти після збору.
    info: |
      Мушмула (Mespilus germanica) — найдавніша садова культура, вирощувана від Середньовіччя.
      Вона їстівна лише після розм'якшення (блетингу), тобто відлежування після збору.
      Багата на дубильні речовини й вітамін C.
      Шекспір згадує її в «Ромео і Джульєтті»; нині це радше дивовижа садівників.
  fruit.ackee:
    label: акі
    summary: Червоний тропічний плід зі їстівними жовтими арилусами; національний плід Ямайки.
    info: |
      Акі (Blighia sapida) — національний плід Ямайки; названий на честь капітана Блая (1793).
      Їстівні лише стиглі жовті арилуси; незрілий або перестиглий плід отруйний (гіпогліцин A).
      Ackee and saltfish — національна страва Ямайки.
      Він походить із Західної Африки; у Кариби його завезли работоргівлею.
  fruit.feijoa:
    label: фейхоа
    summary: Маленький овальний зелений плід з ароматною м'якоттю.
    info: |
      Фейхоа (Acca sellowiana, також Feijoa sellowiana) походить із Південної Америки.
      Її м'якоть має інтенсивний ароматний смак (ананас, гуава, м'ята).
      Вона дуже популярна в Новій Зеландії як осінній фрукт.
      Мало відома в Європі, але улюблена в країнах походження.
