lang: hi
pivot: false
title: फलों के बारे में
cards:
  fruit.ackee:
    label: एकी
    summary: '''एकी'', ऐशियाई ऑउटर्स के रूप में जमैका के राष्ट्रीय फल के रूप में प्रख्यात होता है।'
    info: |-
      अकी के पेड़ से लाभदायक हरितलवनुओं में जमैका का राष्ट्रीय फल 'एकी' प्रसिद्धि प्राप्त होता है।
      फटे हुए बच्चों के अपवहन के उपरान्त इसके खासकर पके हुए पीले गुणधर्मों के आगमन के वजह से एकी के शब्द के घटना के छोडऩे के ऊष्णकटिबंधीय और झील के ठीठ ढंग से थोथिकता के ओझल हो जाते हैं।
  fruit.apple:
    label: सेब
    summary: गोल लाल या हरे फल मीठे कड़वे स्वाद का।
    info: एक सेब घरेलू सेब के पेड़ का एक फल है, जो दुनिया में सबसे अधिक उत्पादित फलों में से एक है। इसमें विटामिन C और रेशा होता है; 7,500 से भी अधिक किस्में मौजूद हैं।
  fruit.apricot:
    label: apricot
    summary: छोटा naranji पथरदार खजूर; madhur लेकिन kshariya बहुत शुद्धि
    info: |-
      अरमेनियाका प्रुनस के फल मध्यपूर्वी एशिआ से होते हैं।
      चेक गणराज्य और पूरी इटली में उगाते हैं;
      türkiye अउ spain सबके सभी स्पष्टि होते हैं。
      beta-carotene ओर vitamin A से भरपूर होते हैं।
  fruit.avocado:
    label: आवोकाडो
    summary: खच्चरी के लिए ठीठ झाड़
    info: |-
      अवोकाडो मेक्सिको और के स्रोत है।
      यह पुष्पीय फल हैंगा लेकिन खाद्य उद्देश्यों के रूप में एक सब्ज़िए के तौर पर इस्तेमाल किया गया है。
      इनमें स्वास्थ्यकर अणुओं के साथ टूटे हुए चरबी (ऑलिओफिब्रिक ऐसिड ) होते हैं जैसे कि ऑलिव आईल
      जहाँ भी ध्यान दिया जाता है वहाँ यह घड़ी के ऊपर छात्र है ; अवोकाडो टोस्ट आधुनिक कैफे सभ्यता के एक चिह्न है
  fruit.banana:
    label: केला
    summary: एक पीला उष्णकटिबंधीय फल है जो मीठे गूदे से भरपूर होता है।
    info: केला एक उष्णकटिबंधीय पौधे का फल है जो धार्मिक परिवार के अनुसार आता है। यह पोटैशियम और प्राकृतिक शर्करा से भरपूर होता है, जो त्वरित ऊर्जा प्रदान करता है।
  fruit.blackberry:
    label: blackberry
    summary: एग्ज़ॉथर्स
    info: ब्लैकबेरी का विटामिन सी, प्रोटीन और महत्वपूर्ण हेडरलस तत्वों का एकमुश्किल स्रोत है।
  fruit.blueberry:
    label: blueberry
    summary: इसका डार्क ब्लू रंग होता है ; ऐसा घटिया खाद्य जो एंटीऑक्सिडेण्ट से भरा होता है
    info: "ब्लूबेरीज़ काफी एंटिऑकसडेन्ट होता है।\nएनथोशयन मुख्य रूप से प्रदाता ब्लूबेरीज़ कलर और उच्च अवधि के विशेषण होते हैं। \nअभ्यास दिखाओगे कि इम कहाँ से जाकर आई कौशल गतिमापन और हृदय के स्थिति के ऊपर ध्यान भी छोड़ देता है।"
  fruit.cantaloupe:
    label: कंतलुप
    summary: चमड़ी छोटे चिह्नों ओर ऊष्ण ऑरेञ्ज डफळ
    info: "कंतलुप कैन्थेलिपोसीज़ एशिया से महाद्वीपीय हरबरमवान प्रकार का खटखटाहुआ तरबूज है।\nइसका नाम गृहनगर कंथलुपो से आए हुए जि इटली के पास है। \nभौरदार फली बीटा - कॅरोटीन और भिटाकिण C से धनी है।"
  fruit.cherry:
    label: चेरी
    summary: छोटा गोलाकार लाल पत्थर का फल जो युगल में उगता है।
    info: चेरी बरसिम के पेड़ से निकलने वाला एक लोकप्रिय गर्मी का फल है। इसमें एंटीऑक्सिडेंट और मेलाटोनिन होता है; चीड़े के खट्टे भी आवश्यक होते हैं।
  fruit.coconut:
    label: कोकोनट
    summary: बड़ा ऊष्णकटिबंधीय खामखाह सफेद छिलका धारी
    info: "कोयला केसीनस न्यूजिफेरा पादप से हुआ है।\nअमतुष्क मटर के अंदर कच्चे बीज के रूप में आईओएनिट ड्रिप होता है। \nकोकोनट मिल्क और तेल एशिया गणराज्य भाइवहन व्‍यवहार शिषि के उत्थान के घटनाओं हैं।"
  fruit.cranberry:
    label: भ्रषिणा
    summary: छोटा एवं खट्टा लाल ड्राइफ्रूट; अमेरिकी घटना का पारंपरिक भाग
    info: |-
      बैरीनियम मेक्रोकार्पन के छोटा हलचलदार संतुलित पीला फल।
      यह अमेरिकी धन्यवाद उपस्थिति का पारंपरिक भाग है。
      इसमें प्रोएथोग़्लोज़ईडिन शामिल होते हैं, जो बैक्टीरिआल इ॰ कोली के मूत्र वाहिओं के चारों और ठीठ करने से रोकते हैं।
  fruit.currant:
    label: blackcurrant
    summary: छोटे लाल , काळे छोडऱ घट्ट शेढऺ
    info: "रिबेस एक प्रजाति है। कलसनुमा संगठन मे लघुत्म गोलीय फल उगते हैं।\nब्लॅक करेंट(ribes Nigrom), सभी berry में Vitamine-C के सबसे ज़्यादा मानवशरीर के आहार में होता है। \nएक ribena (अंग्रेजी पेय )और Cassis liqueur के खुद के स्वाद के चढऩे के लिहाज से इसका ध्यानपूर्ण भाषण है।"
  fruit.damson:
    label: डमन प्रकार का आलूवटो मिट्ठा
    summary: एक छोटा अँधेरा शहतौत जोईया इंग्लिस गावों के उपजाऊ खेतों में पाया जाथे।
    info: डामस्केन बेरी का संबुद्धि है।
  fruit.date:
    label: खजूर
    summary: एगो छोटा,भौर घना विषम उष्णकटिसि धरणीफल
    info: |-
      खजूर के पेड़ से लंबा मीठा हल्के भापुकोनियम फल।
      यह हजारों सालों से पश्चिमी एशिआई देशों के खानपान का मुख्य अवयव है。
      इसमें 75% तक ग्लूकोज होता है और ऊर्जा का बड़ा स्रोत है।
  fruit.dragon_fruit:
    label: ड्रैगन फल
    summary: गुलाबी उष्णकटिबंधीय कछुआओं के फल जिसके ऋण बिंदु भरे हवे
    info: |-
      ड्रैगन फल के मुख्य संबोधित हाइलोकरीयस पश्चिमेशिएमा और मध्यअमेरिका के मूल निवासी है।
      इसकी ज़ोरदार गुलाबी छपाऊ भतई अउ लहरदार डज़िएटिप दिखने ओवल आऊर काळे धाँचे घलघल ढंग से उभरत हवे。
      फल के स्वाद टेहठा हवे ऐ ऑक्सीडेण्ट अउ विटामिन सी थे झािक ठार हवे।
  fruit.durian:
    label: डूरिएन
    summary: एशिआइयाति रहस्प्रम्
    info: डूरियन के फल में सफ़ेद हुई प्लवकता होती हैं।
  fruit.feijoa:
    label: फीजोआ
    summary: '''अच्छा'', ''ग्रीष्ट'' आउटडोर फल'
    info: फीजोआ एक पौधा है जिसे 'एस्का सेललवानियन' कहते हैं। इसमें मुख्य रूप से अदरक, गुइयबे और धनिमेड़ियम के सभी तत्व होते हैं।
  fruit.fig:
    label: इफिक्षण
    summary: एक ऐसा झड़ जो ठठापन ढंग से ऋतुओं के अधिकतर भागों में ऑयल और बीज देता है।
    info: |-
      अंगूर के आकार में होना, प्यासी सतह और असलिएँ नहि बल्कि फुटबोल भरपूर छोटे -छोटे ग्रामजन।
      ईशवर के लिखे जमाओ तथा ईष्वर के चिह्ण इफिटिड द्वारा उच्च शुद्धि घटकों के सभी ऊपर थे।
  fruit.gooseberry:
    label: अंग्रेश्ट
    summary: |-
      एक गोल आकार की अदृश्य जड़िया चना;
      pार्कों में इसकी खूब डाउज देखी जाती है।
    info: |-
      अंग्रेश्ट यूरोप के मध्य पार्कों में समझा हुआ एक छोटी फलिस्तानी हर।
      iयह हरा, लाल और पीला भी होता है。
      iइसमें विटामिन-C बहुत होता है।
  fruit.grape:
    label: अंगूर
    summary: एक छोटा गोल फल होता है जो कीट में समूह में पाया जाता है।
    info: विटिस विनिफेरा के झाड़ियाँ अंगूर के बुश के रूप में उगती हैं और इनके लाल, हरे या गहरे बैंगनी रंग होते हैं। अंगूर खाए जाते हैं, उन्हें शर्करा में सूखा दिया जाता है या वाइन बनाने के लिए दबाया जाता है।
  fruit.grapefruit:
    label: ग्रेपफ़्रॉट
    summary: भाजपा नहीं - एक अद्भुत आहार
    info: |-
      ग्रेपफ़्रूट का विस्तारक पोमेरनज़ियस हलवी संतरा और मुईए।
      इसे 1700 के दशक में बाहबडोस पर लिखा गया था।
  fruit.guava:
    label: अमरूद
    summary: उष्णकटिबंधीय रहस्यवाही गंध तथा सफेद या ऊखले आई टिष्ठा
    info: "अमरूद के पेड़ उष्णकटिबंधीय सामग्री में होता है।\nइसमेने ऑरेज के मुकावला 4 x अधिक एचएनडब्ल्यूजी चीजेस होते हैं। \nफल के छिपकले और दाँत खाशवे भी होते हैं;\nपूरा फल पोषणशील होता है।"
  fruit.jackfruit:
    label: जैकफ्रूट
    summary: एक आकर्षक और ऊष्णकटिसभी छोटे झुंड के चढ़े हुए घने धारीदार ओझे
    info: |-
      चिल्हावनीक जो कि पौधा हेटेरोफ़्लस से महत्तवपूर्ण फल उगाया गया है।
      इंडोनेशिएमुख्य रूप से भारत,
      बाङ्कदश
      औरथाइलॅण्ड में खाद्मान बना हुआ है।
  fruit.kiwi:
    label: कीवी
    summary: भूरे फल के छोटे खड़े ऊष्मा वाहक गहरे हरे आईएफओ हैं।
    info: कीवी चिया के मूल हैं। न्यूज़ीलॅण्ड इसे प्रचारित करने और समुदायों के लिए उपयुक्त बनाकर 'कीवी' भेजता है।
  fruit.lemon:
    label: एगर नींबू का
    summary: ईडिबल जौजफ़्रूट ; इमलीबख़र देखने वाला
    info: |-
      सिट्रोन एक क्षारीय संतरे पैदा हुआ मेवा है।
      इमलीबख़र और सीट्रिक अम्ल के साथ यह आवश्यक तत्वों से भरपूर है।
  fruit.lime:
    label: लीमेटका
    summary: एक नाज़ुक हरित क्षारयुक्त संत्री; उष्णकटिबंधीय खाद्य पदार्थों का आवश्यक घटक
    info: लीमेटका एक हरित क्षारयुक्त संत्री पौधे होता है। महसूस करने में इसका अपवाह और गंधदायक छिलका होता है।
  fruit.longan:
    label: लॉन्गान
    summary: छोटा भूरा ऊष्णकटिबंधीय फल शीखर छोटा टमाटर के झाकि
    info: "लॉन्गान एक हरित के पेड़ से महसूर कीमतवंद्रुपयोगीफल है।\nइसका चीजीएच भाषा से 'लॉन्ग' + 'आई', जिसका अर्थ है ''ड्रैगन आई'' ,अब इसके बीज के कारण यह लोकप्रिय हो गया है। \n वह मधुर और खुशबूदार स्वाद है।"
  fruit.lychee:
    label: लिची
    summary: छोटा लाल उष्णकटिबंधीय फल जिसका शरीर पारदर्शी होता है ; एशिया में बहुत पसंद किया जाता है।
    info: "लिची एक हाथ के पैर समान महत्वपूर्ण उष्णकटिबंधीय फल होता है।\nइसकी लाल और खुरदरी छेदवारी त्वचा आसानी से अलग हो जाती है और इनड़िएशन या ग्रीजी शरीर के सफेद भाग को ढके हुआ होता है। \nअब डिस्टिक्षन घुल जाता है और ऐसा ध्यान देने योग्य होता है कि इसका स्पष्ठ झुठलाहट ओर ऊष्मा ऋण ऑथोरिटी के साथ एक अभिन्न भाग होता है।"
  fruit.mango:
    label: अमरूद
    summary: एक उष्णकटिबंधीय फल है जो पीले-नारंगी रंग का और गुणवत्ता से भरपूर होता है।
    info: इसे 'उष्णकटिबंधीय फलों का राजा' कहा जाता है। इसमें विटामिन A और C प्रचुर मात्रा में पाया जाता है और दक्षिण एशिया में 4000 साल से अमरूद की खेती की जा रही है।
  fruit.medlar:
    label: मिष्पुल
    summary: छोटा छाँव धारी ऊष्णकटिबंधीय ठठ्ढा
    info: |-
      मिशपुले का फल प्राचीन सदृश्य हरड़ के मेस्पिलस जर्मेनिका को।
      यह खाद्य है और 'ब्लेट' करके -अवधि के बाद इसे तत्वगंभीर कर रखा गया है;
      इसमें एचएफईओटी अणु भी होते हैं आउर ओजन डी。
      शेक्सपियर उन्हें रोमियो ऐंड झौलिऑट में घोषित करता है;
  fruit.melon:
    label: खरबजा
    summary: गोल घण्टी शक्षा ऑर ऊभाड़ झाँझा ऐशा थोड़ा ढीला फल
    info: "खरबजा (कूकमिस मेलो), एक सुष्ठि के पादप हलचीनी और उपहलचीनी फल है।\nयह अफ्रीका तथा आसियानंद से विकसित हईत हवए जोड़े गइस हई। \nआज इओ पृथ्वी के चारों ओर बढ़ाऊ धधा भी खेमट छठि।"
  fruit.mulberry:
    label: मोरस
    summary: '''मोरस'' के जड़ीय पेड़ से निमोनट बेरी; टचवर्म के भोजन के अधिकाँश आउटपुट के लिए'
    info: मोरस एक मुलबेरी का हार्ड प्रजनन है। सभी प्रकार - सफेद, लाल और काला - होते हैं; काला सबसे मिठा होता है। इतिहास में मोरस कि खेती धागे के उद्योग के विकाश के लिए महत्वपूर्ण थी।
  fruit.nectarine:
    label: नेक्टरिनका
    summary: खुरदरे रहित चमकदार खरबौजा ; झाड़फल छाप
    info: "नेक्टरिनका प्राइमस फीचे सबवैरिएट कोशल मुतहद है।\nयह बड़े आंगूर के जीएमपीजी विशेषता के लिहाया अलग है। \nइसका स्वाद और गठि्णता भी उभयधर्मी है।"
  fruit.orange:
    label: पौमेरान्स
    summary: एक गोल सिट्रस फल है जिसमें महीन और पीच के रंग का छिलका होता है।
    info: पौमेरान्स एशिया के दक्षिण-पूर्व में मूल रूप से उगाया जाता है अब इसे दुनिया भर में बढ़ाया जाता है। इसमें विटामिन सी की खूब मात्रा होती है और इसे आमतौर पर जूस के रूप में पसंद किया जाता है।
  fruit.papaya:
    label: पाओईया
    summary: उष्णकटिबंधीय फल;अगर-ओरेञ्ग छाल
    info: "पापैया के पेड़ उष्णकटिबंधीय अमरीका से मुख्यतः होते है।\niसमें 'एनज़िइम' - प्रोटीन पचाने में सहारा देता है। \nविटामिऩ-C ,बीटा-कैरोटीन और एंटीऑक्सडेइंट्स के स्रोत के लिहाज से भी ध्वजदार है।"
  fruit.passion_fruit:
    label: मुचेनका
    summary: उष्णकटईय एक झड़बदर और आभासी श्छादक खोखला चीज के साथ ऊगा डाइल घेरा
    info: |-
      मुचेनका के फल में पीरियन स्कॉफ़ोलारा है।
      इसका तंत्रिमय गुणवत्‍ता वाला जेल बहुत सारे अपशष्टि भरे हए होते हैं।
  fruit.peach:
    label: परसिस ब्रोज़िएटा
    summary: चीन के एक अद्भुत लाखड़ी जैसे रंग के शरदऋतु के चिह्न
    info: |-
      ब्रोश्केवीवा परसियन फल के संयुक्त है।
      इसमें महानता के सभी गुण होते हैं।
  fruit.pear:
    label: सेब
    summary: एक आंसू के आकार का फल होता है जिसमें मीठा और नरम स्वाद होता है।
    info: आम पाइरस के प्रजाति का एक फल है जो सेब के खेल में अपने आवश्यकता के कारण घुटने वाला होता है। इसमें चिकनी, श्वेत भाग होता है और उच्च फाइबर की मात्रा होती है; सौ ओरड्रॉइड होते हैं।
  fruit.persimmon:
    label: ओरेंज
    summary: एक ऐसा ओरेंज गुणधर्मयुक्त बच्छा भी हो सकता है जबकि वह एक उदाहरण के रूप में डिऑस्कोइरोस क़ाख़ी के समान हो सकता है।
    info: टोमेलीला चाइना और जापान से मिट्ठा है। प्रकाश के रंगवश यह अपने आसपास के फलों के समानता दिखाता है।
  fruit.pineapple:
    label: अनानास
    summary: एक उष्णकटिबंधीय फल है जिसमें सुईदार मुकुल और पीला गूदा होता है।
    info: अनानस के दक्षिण अमेरिका से मूल विचार हैं और आज इसे पूरे विश्व के उष्णकटिबंधीय क्षेत्र में लगाया जाता है। इसमें एंज़ाइम ब्रोमेलेन होता है जो पाचन में सहायता करता है।
  fruit.plum:
    label: शवेस्टका
    summary: एक नीला छोटा गोलाकार पथरदान और शराब एवं पोइडला युक्ति
    info: बेरीज जैसा संतरारहित प्रकार का हल्का मुड़ा हआईटोन बगलेवाला फल।
  fruit.pomegranate:
    label: grapefruit
    summary: खैराटी डाठ घट झृझ॒र थे
    info: |-
      अंगूर के फल में स्पषटता होने वाली प्रसिद्ध चमकदार बुशवान गहरे भौपड़ीय छोई।
      इसमें 450 -780 अणुओं के आधार पर एंथोसाइएनिस के तत्काम और जबरदस्ति शाही खजाँची या उठाओ।
  fruit.quince:
    label: |-
      एप्पलसनटरचे मुख्य विशेषताः इसके फल अंगूठे के आकार के होते हैं, जबड़े के ऊपर और त्रि-शाखा बहुआयामी होते हैं।
      इसके उद्देश्य से गर्म भोजन लेकर चलाओ जाता है।
    summary: अधिकाँश टौफई घर पर छोटे ठण्ढे झाड़ियों के धारा में थोथे ऑक्सीजन के साथ बढ़ते हैं।
    info: किणवा के समान एक पेड़ होती है।
  fruit.rambutan:
    label: रैंबुटन
    summary: '''अदरक'', ऐसा छोटा टेढ़ा घन धन झाँझा ओर ठण्डा थोड़ा ऑफ ष्मिक ऋतुओं के लिए जाहिर करता है।'
    info: |-
      रैंबुटन (एक नेफलियम स्पीशीज़ का प्रजाति होता है। मलयसिए से इसकी उत्पत्ति हुई है और 'हेअर' के लिए मलय के शब्द 'रैंबुट' से आया है।
      इसकी चमड़ी बचपन में भीगी रखी जाती है व ऊष्णकटिसभीवी खाड़ी में गठित होती है।
  fruit.raspberry:
    label: अजवायन
    summary: हरे फल ले आओ
    info: |-
      रास्पबेरी एक संयुक्त प्रसव है जो कई छोटे मेवा (ड्रपलिट्स) से बनती है।
      इसमें खच्चरदार गठि्णएँ होती हैं;
      गर्मी और शरदऋतु में इसकी कटाई होती है।
  fruit.starfruit:
    label: कैरम्बोला
    summary: एक पीला ऊष्मद्‍य वनफल अच्छी खबर है।
    info: कैरम्बोला के फल में साइड्रिक पुष्टि होती है। यह एशिया के दक्षिणपृथवी और उसके आगे के कई भागों में ले जाता है।
  fruit.strawberry:
    label: ज़ाहरनी जाहोड़ा
    summary: लाल ह्रदय के आकार की एक स्वादिष्ट बेरी।
    info: ज़ाहरनी जाहोड़ा पौधों के परिवार में एक लोकप्रिय फल है। इसमें विटामिन C और एंटीऑक्सीडेंट पुष्किण होते हैं; गर्मी में काटा जाता है और इसका स्वाद मीठा और खुशबूदार होता है।
  fruit.tamarind:
    label: ईंठन / Tamarhindu
    summary: भोजपत्रिका जैसा खट्टा फल
    info: इमली के बॉक्सवुड पेड़ से हरा मसाला।
  fruit.tangerine:
    label: मन्दारिनका
    summary: एक खरबूज़ा जो चीन के त्योहारों का प्रतीक है
    info: मन्दारिनका एक सूखी हुई पतले कवच में लपटों वाला छोटा सिट्रस है।
  fruit.watermelon:
    label: पानी का तरबूज
    summary: एक बड़ा हरे रंग के समतलों वाला फल जिसमें चट्टखने वाली लाल माँसल भाग होती है।
    info: पानी का तरबूज अफ्रीका से आया हुआ है और एक पसंदीदा गर्मी का फल है। इसका 92% भाग पानी से बना होता है और यह लाइकोपीन शामिल है जो उसे लाल रंग देता है।
