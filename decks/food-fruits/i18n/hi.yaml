lang: hi
pivot: false
title: फल
cards:
  fruit.ackee:
    label: एकी
    summary: लाल उष्णकटिबंधीय फल जिसका केवल पका पीला गूदा खाया जाता है, जमैका का प्रतीक।
    info: |-
      एकी (Blighia sapida) जमैका का राष्ट्रीय फल है।
      इसका नाम कैप्टन ब्लाई के नाम पर पड़ा, जो इसे 1793 में लाया था।
      केवल पका हुआ पीला गूदा खाया जाता है, जबकि कच्चा या सड़ा फल ज़हरीला होता है।
      इसका मूल पश्चिम अफ्रीका है, और 'एकी और नमकीन मछली' जमैका का प्रसिद्ध व्यंजन है।
  fruit.apple:
    label: सेब
    summary: गोल लाल या हरा फल, मीठा या खट्टा।
    info: सेब सेब के पेड़ (Malus domestica) का फल है और दुनिया में सबसे अधिक उगाए जाने वाले फलों में से एक है। यह विटामिन C और रेशे से भरपूर है, और इसकी 7,500 से अधिक किस्में हैं।
  fruit.apricot:
    label: खुबानी
    summary: छोटा नारंगी गुठलीदार फल, मीठा।
    info: |-
      खुबानी (Prunus armeniaca) का मूल मध्य एशिया है।
      यह पूरे यूरोप में उगाई जाती है, और सबसे मीठी तुर्की और स्पेन की मानी जाती है।
      यह बीटा-कैरोटीन और विटामिन A से भरपूर है।
      सूखी खुबानी एक लोकप्रिय सेहतमंद नाश्ता है।
  fruit.avocado:
    label: एवोकाडो
    summary: मलाईदार गूदे वाला उष्णकटिबंधीय फल, गुआकामोले का मुख्य घटक।
    info: |-
      एवोकाडो (Persea americana) का मूल मेक्सिको और मध्य अमेरिका है।
      वनस्पति-विज्ञान की दृष्टि से यह फल है, पर रसोई में सब्ज़ी की तरह इस्तेमाल होता है।
      इसमें जैतून के तेल की तरह सेहतमंद एकल-असंतृप्त वसा (ओलिक अम्ल) होती है।
      एवोकाडो टोस्ट आधुनिक कैफ़े-संस्कृति का प्रतीक है।
  fruit.banana:
    label: केला
    summary: मीठे गूदे वाला पीला उष्णकटिबंधीय फल।
    info: केला केला-कुल के पौधे का फल है, जो पोटैशियम और प्राकृतिक शर्करा से भरपूर होकर तुरंत ऊर्जा देता है।
  fruit.blackberry:
    label: ब्लैकबेरी
    summary: काँटेदार झाड़ियों पर उगने वाला गहरा बैंगनी संयुक्त फल।
    info: |-
      ब्लैकबेरी (Rubus fruticosus) काँटेदार झाड़ियों पर उगने वाला गहरा बैंगनी संयुक्त फल है।
      जंगली रूप में यह जंगलों के किनारों और झाड़ियों में उगती है।
      यह विटामिन C, कैरोटीन और हृदय के लिए लाभकारी एंटीऑक्सीडेंट से भरपूर है।
  fruit.blueberry:
    label: ब्लूबेरी
    summary: एंटीऑक्सीडेंट से भरपूर गहरा नीला-बैंगनी सुपरफ़ूड फल।
    info: |-
      ब्लूबेरी में एंथोसायनिन नामक एंटीऑक्सीडेंट भरपूर होते हैं।
      यही रंगद्रव्य इसे गहरा नीला रंग और तेज़ एंटीऑक्सीडेंट गुण देता है।
      अध्ययनों के अनुसार यह याददाश्त और हृदय-स्वास्थ्य के लिए लाभकारी है।
      बगीचों में उगाई जाने वाली किस्में जंगल की छोटी जंगली किस्मों से बड़ी होती हैं।
  fruit.cantaloupe:
    label: कैंटालूप
    summary: जालीदार छिलके और नारंगी गूदे वाला खरबूजा।
    info: कैंटालूप (Cucumis melo var. cantalupensis) खरबूजे की एक लोकप्रिय किस्म है। इसका नाम रोम के पास पोप की जागीर कैंटालूपो के नाम पर पड़ा। इसका नारंगी गूदा बीटा-कैरोटीन और विटामिन A से भरपूर है, और यह सबसे मीठे खरबूजों में से एक है।
  fruit.cherry:
    label: चेरी
    summary: जोड़ों में उगने वाला छोटा गोल लाल फल।
    info: चेरी गर्मियों का लोकप्रिय फल है जिसमें एंटीऑक्सीडेंट और मेलाटोनिन होता है। इसकी मीठी और खट्टी दोनों किस्में होती हैं।
  fruit.coconut:
    label: नारियल
    summary: रेशेदार छिलके, सफेद गूदे और पानी वाला बड़ा उष्णकटिबंधीय बीज।
    info: |-
      नारियल (Cocos nucifera) वैज्ञानिक रूप से फल नहीं बल्कि एक बीज (गुठलीदार फल) है।
      कच्चे फल के भीतर का नारियल-पानी एक प्राकृतिक इलेक्ट्रोलाइट पेय है।
      नारियल का दूध और तेल दक्षिण-पूर्व एशिया और भारत की रसोई के मुख्य घटक हैं।
      उपयोगों की भरमार के कारण नारियल के पेड़ को 'हज़ार उपयोगों का पेड़' कहा जाता है।
  fruit.cranberry:
    label: क्रैनबेरी
    summary: अमेरिकी पारंपरिक व्यंजनों में इस्तेमाल होने वाला छोटा खट्टा लाल फल।
    info: क्रैनबेरी (Vaccinium macrocarpon) छोटा खट्टा लाल फल है। इसका इस्तेमाल परंपरागत रूप से अमेरिकी थैंक्सगिविंग की चटनी में होता है। इसमें ऐसे तत्व होते हैं जो जीवाणुओं को मूत्राशय की दीवार से चिपकने से रोकते हैं, इसलिए यह मूत्रमार्ग के संक्रमण से बचाव में मदद करता है, जैसा अध्ययनों में सिद्ध हुआ है।
  fruit.currant:
    label: करंट
    summary: गुच्छों में उगने वाले छोटे लाल, काले या सफेद फल।
    info: |-
      करंट (Ribes) गुच्छों में उगने वाले छोटे फल हैं, जो लाल, काले या सफेद होते हैं।
      विटामिन C में सबसे भरपूर काला करंट है, जिससे कैसिस पेय बनता है।
      लाल करंट का इस्तेमाल जेली बनाने और मिठाइयाँ सजाने में होता है।
  fruit.damson:
    label: डैमसन आलूबुखारा
    summary: बगीचों में उगने वाला छोटा गहरे रंग का आलूबुखारा।
    info: डैमसन आलूबुखारा आलूबुखारे की एक छोटी किस्म है जिसका रंग गहरा नीला से काला होता है। इसका नाम दमिश्क शहर से पड़ा, जहाँ से यह फल यूरोप पहुँचा। कच्चा खाने पर यह बहुत खट्टा होता है, पर जैम और डैमसन जिन में बढ़िया रहता है।
  fruit.date:
    label: खजूर
    summary: खजूर के पेड़ का मीठा, भूरा और अंडाकार फल।
    info: खजूर (Phoenix dactylifera) खजूर के पेड़ का मीठा फल है। यह हज़ारों साल से मध्य पूर्व का मुख्य आहार रहा है। इसमें 60% से अधिक शर्करा होती है और यह ऊर्जा का जाना-माना स्रोत है।
  fruit.dragon_fruit:
    label: ड्रैगन फल
    summary: गुलाबी उष्णकटिबंधीय कैक्टस फल जिसका सफेद गूदा बीजों से भरा होता है।
    info: ड्रैगन फल (पिताया, वंश Hylocereus) का मूल मेक्सिको और मध्य अमेरिका है। इसका छिलका चमकीला गुलाबी और गूदा सफेद होता है जिसमें काले बीज बिखरे रहते हैं, इसलिए यह बहुत सजावटी दिखता है। इसका स्वाद हल्का और मुलायम होता है और इसमें एंटीऑक्सीडेंट तथा विटामिन C होता है।
  fruit.durian:
    label: डूरियन
    summary: तेज़ गंध वाला बड़ा काँटेदार उष्णकटिबंधीय फल, जिसे 'फलों का राजा' कहते हैं।
    info: |-
      डूरियन (Durio zibethinus) को फलों का राजा कहा जाता है।
      इसकी तेज़ गंध कई लोगों को अरुचिकर लगती है, यहाँ तक कि एशिया के कई होटलों में इस पर रोक है, पर कुछ लोग इसे बहुत पसंद करते हैं।
      इसका गाढ़ा गूदा मलाईदार और मीठा होता है जिसमें मेवे, वनीला और पनीर मिला-जुला स्वाद आता है।
      दक्षिण-पूर्व एशिया में इसे स्वादिष्ट व्यंजन माना जाता है।
  fruit.feijoa:
    label: फ़ेजोआ
    summary: तेज़ सुगंध वाले गूदे वाला छोटा हरा अंडाकार फल।
    info: फ़ेजोआ (Acca sellowiana) का मूल दक्षिण अमेरिका है। इसकी तेज़ सुगंध अनानास, अमरूद और पुदीने की याद दिलाती है, और यह न्यूज़ीलैंड में पतझड़ के मौसम में बहुत लोकप्रिय है।
  fruit.fig:
    label: अंजीर
    summary: अंजीर के पेड़ का मीठा, बहुत बीजों वाला बूँद-आकार फल।
    info: अंजीर सबसे पुराने उगाए गए फलों में से एक है, जिसके प्रमाण लगभग 10,000 साल पुराने हैं। दरअसल यह फल नहीं बल्कि हज़ारों छोटे फूलों से भरा एक आवरण है। धार्मिक कथा में आदम और हव्वा ने जिस पत्ते से खुद को ढका था, वह अंजीर का पत्ता ही था।
  fruit.gooseberry:
    label: गूज़बेरी
    summary: बगीचों में खूब उगाया जाने वाला छोटा गोल, अर्धपारदर्शी फल।
    info: |-
      गूज़बेरी (Ribes uva-crispa) मध्य यूरोप के बगीचों का आम छोटा फल है।
      इसकी हरी, लाल और पीली किस्में होती हैं।
      यह विटामिन C से भरपूर है।
      इससे बना पेय पुराने समय से लोकप्रिय रहा है।
  fruit.grape:
    label: अंगूर
    summary: गुच्छों में उगने वाला छोटा गोल फल।
    info: अंगूर (Vitis vinifera) हरे से गहरे बैंगनी तक विभिन्न रंगों के गुच्छे देता है। इसे ताज़ा खाया जाता है, किशमिश बनाने के लिए सुखाया जाता है, या शराब बनाने के लिए निचोड़ा जाता है।
  fruit.grapefruit:
    label: ग्रेपफ्रूट
    summary: बड़ा खट्टा-मीठा, पोषण से भरपूर खट्टे-फल।
    info: |-
      ग्रेपफ्रूट (Citrus paradisi) संतरे और चकोतरे का संकर है।
      इसका पहला वर्णन 18वीं सदी में बारबाडोस में मिलता है।
      इसकी गुलाबी और लाल किस्मों में लाइकोपीन और बीटा-कैरोटीन होता है।
      इसका रस कई दवाओं के साथ प्रतिक्रिया करता है, इसलिए मरीज़ को अपने डॉक्टर को बताना चाहिए।
  fruit.guava:
    label: अमरूद
    summary: तेज़ सुगंध और सफेद या गुलाबी गूदे वाला उष्णकटिबंधीय फल।
    info: अमरूद (Psidium guajava) का मूल उष्णकटिबंधीय अमेरिका है और यह उष्णकटिबंधीय एशिया और अफ्रीका में फैल गया है। इसमें संतरे से अधिक विटामिन C होता है। इसका छिलका और बीज भी खाए जा सकते हैं, और यह पोषण से भरपूर फल है।
  fruit.jackfruit:
    label: कटहल
    summary: पेड़ पर उगने वाला दुनिया का सबसे बड़ा फल।
    info: कटहल का मूल उष्णकटिबंधीय एशिया है, और इसे भारत, बांग्लादेश और थाईलैंड में मुख्य आहार के रूप में खाया जाता है। कच्चे कटहल का स्वाद फीका होता है, इसलिए शाकाहारी इसे माँस के विकल्प के रूप में इस्तेमाल करते हैं।
  fruit.kiwi:
    label: कीवी
    summary: भूरे रोएँदार छिलके और हरे गूदे वाला विटामिन से भरपूर फल।
    info: कीवी (Actinidia deliciosa) का मूल चीन है, जहाँ इसे 'चीनी करौंदा' कहा जाता था। न्यूज़ीलैंड ने इसे व्यावसायिक रूप से विकसित किया और अपने राष्ट्रीय पक्षी कीवी के नाम पर इसका नाम रखा। इसमें संतरे से दोगुना विटामिन C होता है।
  fruit.lemon:
    label: नींबू
    summary: खट्टा, पीला और सुगंधित खट्टे-फल।
    info: नींबू एशिया का मूल खट्टा खट्टे-फल है। यह विटामिन C और साइट्रिक अम्ल से भरपूर है। इसका इस्तेमाल रसोई और पेयों के अलावा सौंदर्य-प्रसाधनों और सफ़ाई-उत्पादों में भी होता है।
  fruit.lime:
    label: कागज़ी नींबू
    summary: छोटा हरा खट्टा खट्टे-फल।
    info: |-
      कागज़ी नींबू (Citrus aurantiifolia) छोटा हरा खट्टे-फल है जिसका रस खट्टा और छिलका सुगंधित होता है।
      यह मेक्सिको, थाईलैंड और वियतनाम की रसोई का मुख्य घटक है।
      इसमें नींबू से कम विटामिन C होता है पर इसकी सुगंध तेज़ होती है।
      पुराने समय में यह नाविकों को स्कर्वी से बचाता था।
  fruit.longan:
    label: लोंगन
    summary: लीची से मिलता-जुलता छोटा भूरा उष्णकटिबंधीय फल।
    info: लोंगन (Dimocarpus longan) चीन के मूल उष्णकटिबंधीय पेड़ का फल है। इसके पारदर्शी गूदे और काले बीज के कारण इसे 'ड्रैगन की आँख' कहा जाता है। इसका स्वाद मीठा और सुगंधित होता है, और पारंपरिक चिकित्सा में इसे रक्त और हृदय को मज़बूत करने वाला आहार माना जाता है।
  fruit.lychee:
    label: लीची
    summary: खुरदरे छिलके वाला लाल उष्णकटिबंधीय फल जिसका गूदा पारदर्शी होता है।
    info: |-
      लीची (Litchi chinensis) चीन के मूल की उष्णकटिबंधीय फल है।
      इसके खुरदरे लाल छिलके के नीचे सफेद अर्धपारदर्शी गूदा होता है।
      इसका स्वाद मीठा और सुगंधित होता है।
      चीन में यह खुशहाली और समृद्धि का प्रतीक है।
  fruit.mango:
    label: आम
    summary: पीले-नारंगी रसीले गूदे से भरपूर उष्णकटिबंधीय फल।
    info: आम को 'उष्णकटिबंधीय फलों का राजा' कहा जाता है। यह विटामिन A और C से भरपूर है, और दक्षिण एशिया में इसकी खेती चार हज़ार साल से अधिक समय से हो रही है।
  fruit.medlar:
    label: मेडलर
    summary: सेब जैसा छोटा भूरा फल जो तुड़ाई के बाद नरम पड़ने पर ही खाया जाता है।
    info: मेडलर (Mespilus germanica) मध्य युग से उगाया जाने वाला एक पुराना फल है। तुड़ाई के बाद इसे नरम पड़ने तक रखा जाता है, तभी यह खाने योग्य होता है। यह पॉलीफ़ेनॉल और विटामिन C से भरपूर है, और शेक्सपियर की रचनाओं में भी इसका ज़िक्र है, पर आज यह मुख्यतः शौकिया बागवानों के बगीचों में मिलता है।
  fruit.melon:
    label: खरबूजा
    summary: नारंगी, हरे या सफेद गूदे वाला बड़ा मीठा फल।
    info: खरबूजा (Cucumis melo) अफ्रीका और एशिया का मूल फल है और पूरी दुनिया में उगाया जाता है। इसमें पानी की मात्रा बहुत अधिक होती है, इसलिए यह शरीर को अच्छी तरह तर रखता है।
  fruit.mulberry:
    label: शहतूत
    summary: शहतूत के पेड़ का गहरे रंग का फल, जो रेशम के कीड़े का भोजन है।
    info: शहतूत, शहतूत के पेड़ (वंश Morus) का फल है, और इसका सबसे मीठा रूप काला होता है। इसके सफेद और लाल रूप भी होते हैं, और शहतूत की पत्तियाँ रेशम के कीड़े का भोजन तथा रेशम-उद्योग का आधार हैं।
  fruit.nectarine:
    label: नेक्टरीन
    summary: बिना रोएँ वाली चिकनी त्वचा का, मीठा और रसीला आड़ू।
    info: नेक्टरीन (Prunus persica var. nucipersica) आड़ू का ही एक प्राकृतिक रूपांतर है जिसकी त्वचा चिकनी होती है। यह आड़ू से केवल इस बात में भिन्न है कि इसकी त्वचा पर रोएँ नहीं होते। इसका स्वाद मिलता-जुलता होता है पर गूदा थोड़ा अधिक कड़ा, और इसका नाम देवताओं के पेय 'नेक्टर' से आया है।
  fruit.orange:
    label: संतरा
    summary: सुगंधित नारंगी छिलके वाला गोल खट्टे-फल।
    info: संतरा दक्षिण-पूर्व एशिया का मूल खट्टे-फल है और आज पूरी दुनिया में उगाया जाता है। यह विटामिन C से भरपूर है और जूस के रूप में बहुत पसंद किया जाता है।
  fruit.papaya:
    label: पपीता
    summary: नारंगी सुगंधित गूदे वाला बड़ा उष्णकटिबंधीय फल।
    info: पपीता अमेरिका का मूल उष्णकटिबंधीय पौधा है। इसमें पपेन नामक एंज़ाइम होता है जो प्रोटीन के पाचन में मदद करता है। यह विटामिन C, बीटा-कैरोटीन और एंटीऑक्सीडेंट से भरपूर है, और कच्चे पपीते को दक्षिण-पूर्व एशिया की रसोई में सब्ज़ी की तरह इस्तेमाल किया जाता है (जैसे पपीता सलाद)।
  fruit.passion_fruit:
    label: कृष्णा फल
    summary: झुर्रीदार बैंगनी छिलके और सुगंधित बीजयुक्त गूदे वाला उष्णकटिबंधीय फल।
    info: कृष्णा फल (Passiflora edulis) का मूल उष्णकटिबंधीय अमेरिका है। इसका नाम उन मिशनरियों ने दिया जिन्होंने इसके फूल में ईसा के कष्टों के प्रतीक देखे। इसके गूदे में सुगंधित जेल में लिपटे बीज भरे होते हैं।
  fruit.peach:
    label: आड़ू
    summary: मुलायम रोएँदार गुलाबी गुठलीदार फल, जो गर्मियों का प्रतीक है।
    info: |-
      आड़ू (Prunus persica) चीन का मूल फल है और वहाँ अमरता का प्रतीक है।
      इसकी पहचान इसकी मुलायम रोएँदार त्वचा है।
      इसकी सफेद और पीली किस्में होती हैं, और नेक्टरीन इसका चिकना रूप है।
      चीन में आड़ू नववर्ष और उपचार की कथाओं में शामिल है।
  fruit.pear:
    label: नाशपाती
    summary: बूँद-आकार का मीठा और मुलायम फल।
    info: नाशपाती सेब से मिलते-जुलते पेड़ का फल है। इसका गूदा मुलायम और रसीला होता है और रेशे से भरपूर है। इसकी सैकड़ों किस्में हैं।
  fruit.persimmon:
    label: परसीमन
    summary: टमाटर जैसा नारंगी फल जो पकने पर बहुत मीठा होता है।
    info: परसीमन (Diospyros kaki) चीन और जापान का मूल फल है। कच्चा होने पर यह कसैला होता है, पर पकने पर शहद जैसा मीठा हो जाता है। यह विटामिन A और C तथा खनिजों से भरपूर है।
  fruit.pineapple:
    label: अनानास
    summary: काँटेदार छिलके और पीले गूदे वाला उष्णकटिबंधीय फल।
    info: अनानास का मूल दक्षिण अमेरिका है और अब यह दुनिया के उष्णकटिबंधीय इलाकों में उगाया जाता है। इसमें ब्रोमेलेन नामक एंज़ाइम होता है जो पाचन में मदद करता है।
  fruit.plum:
    label: आलूबुखारा
    summary: छोटा अंडाकार बैंगनी गुठलीदार फल जिससे ब्रांडी बनाई जाती है।
    info: आलूबुखारा (Prunus domestica) मध्य यूरोप का प्रमुख फल है। इससे चेक और स्लोवाकिया का पारंपरिक आसुत पेय 'स्लिवोविट्स' बनता है, और इसे पतझड़ में तोड़ा जाता है।
  fruit.pomegranate:
    label: अनार
    summary: सैकड़ों मीठे दानों वाला लाल फल, जो उर्वरता का प्रतीक है।
    info: अनार (Punica granatum) का मूल मध्य एशिया और भूमध्यसागरीय क्षेत्र है। इसके लाल छिलके के भीतर 600 से अधिक पारदर्शी लाल दाने होते हैं। यह एंटीऑक्सीडेंट से भरपूर है, और हृदय-स्वास्थ्य तथा सूजन कम करने में इसके लाभों पर शोध हो रहे हैं।
  fruit.quince:
    label: बिही
    summary: सेब जैसा कठोर फल जो आमतौर पर पकाकर खाया जाता है।
    info: बिही (Cydonia oblonga) सेब और नाशपाती से मिलता-जुलता फल है, जो कच्चा होने पर कठोर और खट्टा होता है। इसे हमेशा पकाकर खाया जाता है और इससे जैम व फल-शराब बनाई जाती है। यह पेक्टिन से भरपूर है जो जेली के लिए उपयुक्त है, और यूरोप में दर्ज पहला मुरब्बा (16वीं सदी) इसी से बना था।
  fruit.rambutan:
    label: रामबुटान
    summary: लीची से मिलता-जुलता लाल रोएँदार उष्णकटिबंधीय फल।
    info: |-
      रामबुटान (Nephelium lappaceum) का मूल मलेशिया है, और इसका नाम मलय शब्द 'रम्बुत' से आया है जिसका अर्थ है बाल।
      इसके लाल छिलके पर मुलायम बाल जैसे उभार होते हैं।
      इसका गूदा पारदर्शी और मीठा होता है और स्वाद में लीची जैसा।
      यह कैल्शियम और लोहे से भरपूर है।
  fruit.raspberry:
    label: रसभरी
    summary: बगीचे की गर्मियों का प्रतीक, लाल संयुक्त फल।
    info: रसभरी (Rubus idaeus) कई छोटे-छोटे दानों से बना संयुक्त फल है। यह जंगली रूप में भी उगती है और उगाई भी जाती है, और इसे गर्मी तथा पतझड़ में तोड़ा जाता है। यह विटामिन C व K, मैंगनीज़ और एंटीऑक्सीडेंट से भरपूर है, और इससे खूब जैम और शरबत बनाया जाता है।
  fruit.starfruit:
    label: कमरख
    summary: पीला उष्णकटिबंधीय फल जो काटने पर तारे के आकार का बनता है।
    info: कमरख (Averrhoa carambola) का मूल दक्षिण और दक्षिण-पूर्व एशिया है। इसे आड़ा काटने पर यह पूरे तारे के आकार में दिखता है, इसीलिए इसे 'स्टार फ्रूट' कहते हैं। इसका स्वाद खट्टा-मीठा और ताज़गी भरा होता है और यह विटामिन C से भरपूर है। गुर्दे के रोगियों को इसमें मौजूद ऑक्सैलिक अम्ल के कारण इससे बचना चाहिए।
  fruit.strawberry:
    label: स्ट्रॉबेरी
    summary: सतह पर बीजों वाला लाल दिल के आकार का फल।
    info: स्ट्रॉबेरी गुलाब-कुल का लोकप्रिय फल है जो विटामिन C और एंटीऑक्सीडेंट से भरपूर है। इसे गर्मियों में तोड़ा जाता है और यह मीठी तथा सुगंधित होती है।
  fruit.tamarind:
    label: इमली
    summary: फली के भीतर भूरा खट्टा गूदा, थाई रसोई का मुख्य घटक।
    info: इमली (Tamarindus indica) का मूल उष्णकटिबंधीय अफ्रीका है और अब यह गर्म इलाकों में उगाई जाती है। इसका गूदा बहुत खट्टा-मीठा होता है और 'पैड थाई', वॉर्सेस्टरशायर सॉस और भारतीय चटनी में इस्तेमाल होता है। इसके नाम का अर्थ अरबी में 'हिंद का खजूर' है।
  fruit.tangerine:
    label: कीनू
    summary: छोटा मीठा, आसानी से छिलने वाला खट्टे-फल, जो त्योहारों पर खाया जाता है।
    info: |-
      कीनू (Citrus reticulata) चीन का मूल छोटा, आसानी से छिलने वाला खट्टे-फल है।
      यह चीनी नववर्ष और सौभाग्य का प्रतीक है।
      यूरोप में यह क्रिसमस का ख़ास फल है।
      इसमें विटामिन C, एंटीऑक्सीडेंट और फ्लेवोनॉइड होते हैं।
  fruit.watermelon:
    label: तरबूज़
    summary: हरे धारीदार छिलके, लाल गूदे और काले बीजों वाला बड़ा फल।
    info: तरबूज़ गर्मियों का लोकप्रिय फल है जिसका मूल अफ्रीका है। इसमें 92% पानी होता है और लाइकोपीन नामक लाल रंगद्रव्य होता है।
