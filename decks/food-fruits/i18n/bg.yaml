lang: bg
pivot: false
title: Плодове
cards:
  fruit.apple:
    label: ябълка
    summary: Кръгъл червен или зелен плод със сладко-кисел вкус.
    info: Ябълката е плод на ябълковото дърво, една от най-отглежданите култури в света. Съдържа витамин C и фибри; съществуват над 7500 сорта.
  fruit.banana:
    label: банан
    summary: Жълт тропически плод със сладка вътрешност.
    info: Бананът е плод на тропическо растение от семейство бананови. Богат е на калий и естествени захари, които дават бърза енергия.
  fruit.orange:
    label: портокал
    summary: Кръгъл цитрусов плод с ароматна оранжева кора.
    info: Портокалът е цитрусов плод с произход от Югоизточна Азия, днес отглеждан по целия свят. Богат е на витамин C и обичан като сок.
  fruit.strawberry:
    label: ягода
    summary: Червен, сочен плод във форма на сърце.
    info: Ягодата е обичан плод от семейство розоцветни. Богата е на витамин C и антиоксиданти и се бере през лятото.
  fruit.grape:
    label: грозде
    summary: Малко кръгло зърно, което расте на гроздове.
    info: Лозата дава грозде в различни цветове, от зелено до тъмнолилаво. Гроздето се яде прясно, суши се на стафиди или се пресова за вино.
  fruit.watermelon:
    label: диня
    summary: Голям плод със зелени ивици и червена сочна вътрешност.
    info: Динята произхожда от Африка и е обичан летен плод. Състои се от 92% вода и съдържа ликопен, който ѝ придава червения цвят.
  fruit.mango:
    label: манго
    summary: Тропически плод със сочна жълто-оранжева вътрешност.
    info: Мангото наричат краля на тропическите плодове. Богато на витамини A и C, произхожда от Южна Азия, където се отглежда от 4000 години.
  fruit.cherry:
    label: череша
    summary: Малък кръгъл червен костилков плод, който расте по двойки.
    info: Черешата е плод на сладката череша, обичан летен плод. Съдържа антиоксиданти и мелатонин; съществуват сладки и кисели сортове.
  fruit.pear:
    label: круша
    summary: Плод с форма на капка, със сладък и мек вкус.
    info: Крушата е плод на крушовото дърво, близък роднина на ябълката. Има мека, сочна вътрешност и високо съдържание на фибри; съществуват стотици сортове.
  fruit.pineapple:
    label: ананас
    summary: Тропически плод с бодлива корона и златистожълта вътрешност.
    info: Ананасът произхожда от Южна Америка, а днес се отглежда в тропиците по целия свят. Съдържа ензима бромелаин, който подпомага храносмилането.
  fruit.lemon:
    label: лимон
    summary: Жълт и кисел цитрусов плод; източник на витамин C и аромат.
    info: |
      Лимонът е кисел цитрусов плод с произход от Азия.
      Богат е на витамин C и лимонена киселина.
      Използва се в готварството, в напитките, в козметиката и в почистващите препарати.
      Кората на лимона съдържа етерично масло с характерен аромат на лимон.
  fruit.lime:
    label: лайм
    summary: Малък зелен и кисел цитрусов плод; ключова съставка на тропическата кухня.
    info: |
      Лаймът е малък зелен цитрусов плод с кисел сок и ароматна кора.
      Незаменим е в мексиканската, тайландската и виетнамската кухня.
      Съдържа по-малко витамин C от лимона, но по-силен аромат.
      Яденето на лайм е предпазвало моряците от скорбут благодарение на витамин C.
  fruit.kiwi:
    label: киви
    summary: Кафяв космат плод със зелена вътрешност; богат на витамини.
    info: |
      Кивито произхожда от Китай, където го наричат китайско цариградско грозде.
      Нова Зеландия го комерсиализира и го преименува на националната си птица, кивито.
      Съдържа два пъти повече витамин C от портокала.
      Вътрешността е яркозелена; съществуват и златисти (жълти) сортове.
  fruit.peach:
    label: праскова
    summary: Кадифен жълто-розов костилков плод; символ на лятото.
    info: |
      Прасковата произхожда от Китай, където е символ на безсмъртието.
      Меката ѝ кадифена кожа е характерна.
      Съществуват бели и жълти сортове; нектарината е гладкият вариант без мъх.
      В Китай прасковите са част от Нова година и лечебната митология.
  fruit.plum:
    label: слива
    summary: Лилав костилков плод; основа на ракията и сливовото сладко.
    info: |
      Сливата е основен плод на Централна Европа.
      Сливовицата (ракия от сливи) е традиционна чешка и словашка спиртна напитка.
      Сливовото сладко е типичен продукт на есенната реколта.
      В света съществуват над 2000 сорта сливи.
  fruit.apricot:
    label: кайсия
    summary: Малък оранжев костилков плод; сладко-кисел и сочен.
    info: |
      Кайсията произхожда от Централна Азия.
      Отглежда се в цяла Европа; най-сладките идват от Турция и Испания.
      Богата е на бета-каротин и витамин A.
      Сушените кайсии са обичана здравословна закуска.
  fruit.raspberry:
    label: малина
    summary: Червен съставен плод; символ на лятната градина.
    info: |
      Малината е съставен плод от много малки костилкови плодчета.
      Расте дива и култивирана; беритбата е през лятото и есента.
      Богата е на витамини C и K, манган и антиоксиданти.
      Малиновото сладко и оцетът са традиционни лакомства.
  fruit.blueberry:
    label: боровинка
    summary: Тъмносиньо зърно; суперхрана, пълна с антиоксиданти.
    info: |
      Боровинката е богата на антоциани, пигменти със силни антиоксидантни свойства.
      Антоцианите ѝ придават тъмносиния цвят.
      Изследванията сочат положителен ефект върху когнитивните функции и здравето на сърцето.
      Култивираните боровинки са по-големи от дивите.
  fruit.blackberry:
    label: къпина
    summary: Тъмнолилав съставен плод от къпиновия храст.
    info: |
      Къпината е тъмнолилав съставен плод, който расте на бодлив храст.
      Дивата къпина расте по края на горите и в храсталаците.
      Съдържа много витамин C, витамин K и фибри.
      Къпиновото сладко, компот и ликьор са традиционни продукти.
  fruit.coconut:
    label: кокос
    summary: Голям тропически орех с твърда черупка и бяла вътрешност.
    info: |
      Кокосът е плод на кокосовата палма; ботанически е костилков плод, а не орех.
      Кокосовата вода от неузрелия плод е естествена изотонична напитка.
      Кокосовото мляко и масло са основата на кухнята на Югоизточна Азия и Индия.
      Кокосовата палма наричат дървото на хилядите приложения.
  fruit.papaya:
    label: папая
    summary: Голям тропически плод с наситено оранжева вътрешност.
    info: |
      Папаята произхожда от тропическа Америка.
      Съдържа ензима папаин, който подпомага храносмилането на белтъчините.
      Богата е на витамин C, бета-каротин и антиоксиданти.
      Неузрялата папая се използва като зеленчук в кухнята на Югоизточна Азия (в салатата сом там).
  fruit.guava:
    label: гуава
    summary: Тропически плод със силен аромат и бяла или розова вътрешност.
    info: |
      Гуавата произхожда от тропическа Америка и се е разпространила из тропическа Азия и Африка.
      Съдържа четири пъти повече витамин C от портокала.
      Кората и семената са годни за ядене; целият плод е хранителен.
      Сокът и сладкото от гуава са популярни продукти в тропическите страни.
  fruit.pomegranate:
    label: нар
    summary: Червен плод с хиляда сладки семена; символ на плодородието.
    info: |
      Нарът произхожда от Централна Азия и Средиземноморието.
      Съдържа над 600 семена, обвити в прозрачна червена вътрешност (арили).
      Богат е на антиоксиданти; изследванията проучват ефекта му върху сърцето и възпаленията.
      Символизира плодородие и изобилие в много култури.
  fruit.fig:
    label: смокиня
    summary: Крушовиден плод на смокинята; сладък и пълен със семена.
    info: |
      Смокинята е един от най-старите отглеждани плодове; следите ѝ водят 11 000 години назад.
      Всъщност не е плод, а обвивка, изпълнена с хиляди мънички цветчета.
      Смокиновите листа на Адам и Ева в библейския разказ са листа от смокинята.
      Сушените смокини са отличен източник на калций, калий и фибри.
  fruit.date:
    label: фурма
    summary: Сладък кафяв продълговат плод на финиковата палма; основна храна в Близкия изток.
    info: |
      Фурмите са сладките плодове на финиковата палма.
      От хиляди години са основна храна в Близкия изток.
      Съдържат над 60% захар и са изразен източник на енергия.
      В исляма фурмите традиционно се ядат първи при разговяването на рамазанския пост (ифтар).
  fruit.melon:
    label: пъпеш
    summary: Голям сладък плод с оранжева, зелена или бяла вътрешност.
    info: |
      Пъпешът е тропически до субтропически плод с високо съдържание на вода.
      Произхожда от Африка и Азия; днес се отглежда по целия свят.
      Състои се от над 90% вода и е много освежаващ.
      Съществуват стотици сортове, сред които канталупа, медено-росен пъпеш и галия.
  fruit.cantaloupe:
    label: пъпеш канталупа
    summary: Мрежест пъпеш с наситено оранжева вътрешност.
    info: |
      Пъпешът канталупа е обичан сорт пъпеш с произход от Азия.
      Името идва от папската резиденция Канталупо близо до Рим.
      Оранжевата вътрешност е богата на бета-каротин и витамин A.
      Той е един от най-сладките сортове пъпеш.
  fruit.grapefruit:
    label: грейпфрут
    summary: Голям горчиво-сладък цитрусов плод; звезда на диетите.
    info: |
      Грейпфрутът е кръстоска между портокал и помело.
      Описан е на Барбадос през 18 век.
      Розовият и червеният грейпфрут съдържат ликопен и бета-каротин.
      Сокът от грейпфрут взаимодейства с много лекарства; пациентите трябва да уведомят лекаря си.
  fruit.tangerine:
    label: мандарина
    summary: Малък сладък цитрусов плод с леко белеща се кора; символ на Коледа.
    info: |
      Мандарината е малък цитрусов плод, който лесно се бели, с произход от Китай.
      Тя е символ на китайската Нова година и на късмета.
      В много страни е типичен коледен плод.
      Съдържа витамин C, антиоксиданти и флавоноиди.
  fruit.passion_fruit:
    label: маракуя
    summary: Тропически плод с набръчкана кора и ароматна вътрешност, пълна със семена.
    info: |
      Маракуята произхожда от тропическа Южна Америка.
      Името ѝ идва от мисионерите, които виждали в цвета символите на Христовите страдания.
      Вътрешността е пълна със семена, обвити в ароматен гел.
      Тя е отличен източник на витамин C, фибри и антиоксиданти.
  fruit.lychee:
    label: личи
    summary: Малък червен тропически плод с прозрачна вътрешност; обичан в Азия.
    info: |
      Личито е тропически плод с произход от Китай.
      Грапавата му червена кора лесно се бели и разкрива прозрачна бяла вътрешност.
      Има сладък и фино ароматен вкус.
      В Китай е символ на късмет и благополучие.
  fruit.dragon_fruit:
    label: драконов плод
    summary: Розов тропически кактусов плод с бяла напръскана вътрешност.
    info: |
      Драконовият плод (питая) произхожда от Мексико и Централна Америка.
      Яркорозовата му кора и бялата вътрешност с черни семена са много декоративни.
      Има мек вкус и съдържа антиоксиданти и витамин C.
      От него правят сокове, смутита и декоративни десерти.
  fruit.starfruit:
    label: карамбола
    summary: Жълт тропически плод, който при разрязване образува звезди.
    info: |
      Карамболата произхожда от Южна и Югоизточна Азия.
      Разрязана напречно, образува съвършена звезда, откъдето идва английското име starfruit.
      Има сладко-кисел вкус и е богата на витамин C.
      Хората с бъбречно заболяване не бива да я ядат заради оксалатите.
  fruit.avocado:
    label: авокадо
    summary: Кремообразен тропически костилков плод; основа на гуакамолето.
    info: |
      Авокадото произхожда от Мексико и Централна Америка.
      Ботанически е плод (костилков), но в кухнята се използва като зеленчук.
      Съдържа здравословни мононенаситени мазнини (олеинова киселина), също като зехтина.
      Модерна здравословна храна е по целия свят; препечената филийка с авокадо е икона на съвременната кафе култура.
  fruit.persimmon:
    label: райска ябълка
    summary: Оранжев плод, подобен на домат; сладък и стипчив.
    info: |
      Райската ябълка произхожда от Китай и Япония; наричат я още каки.
      Неузрялата райска ябълка е богата на танини и стипчива; узрялата е сладка като мед.
      Богата е на витамини A и C и на минерали.
      В Япония е традиционен есенен плод.
  fruit.mulberry:
    label: черница
    summary: Тъмнолилаво зърно на черницата; храна на копринената буба.
    info: |
      Черницата е плодът на черничевото дърво; листата на черницата са храна на копринената буба.
      Съществуват бели, червени и черни черници; черната е най-сладка.
      В историята отглеждането на черницата е било ключово за производството на коприна.
      Черниците са богати на ресвератрол, витамин C и желязо.
  fruit.cranberry:
    label: червена боровинка
    summary: Малко червено кисело зърно; традиционна американска съставка.
    info: |
      Червената боровинка е малко кисело червено зърно.
      Тя е традиционна част от американския Ден на благодарността (сос от червени боровинки).
      Съдържа проантоцианидини, които пречат на бактериите Escherichia coli да се прикрепят към стените на пикочните пътища.
      Ефектът на червената боровинка за предотвратяване на инфекции на пикочните пътища е научно потвърден.
  fruit.gooseberry:
    label: цариградско грозде
    summary: Малко кръгло прозрачно зърно; любимец на градините.
    info: |
      Цариградското грозде е малък плод, типичен за градините на Централна Европа.
      Съществува в зелени, червени и жълти сортове.
      Богато е на витамин C.
      Виното от цариградско грозде е исторически обичана напитка.
  fruit.currant:
    label: френско грозде
    summary: Малко червено, черно или бяло зърно на гроздче.
    info: |
      Френското грозде е малко зърно, което расте на гроздчета.
      Черното френско грозде съдържа най-много витамин C от всички горски плодове.
      Черното френско грозде е основата на вкуса на ликьора касис и на британската напитка Ribena.
      Червеното френско грозде се използва в сладка и за украса на десерти.
  fruit.quince:
    label: дюля
    summary: Твърд жълт плод, сроден на ябълката; яде се винаги сготвен.
    info: |
      Дюлята е сродна на ябълката и крушата; сурова е твърда и стипчива.
      Винаги се обработва чрез топлина в желе от дюли (мембрильо), вино или ракия от дюли.
      Съдържа много пектин, подходящ за приготвяне на сладка.
      Най-старото документирано в Европа сладко (16 век) е било правено от дюли.
  fruit.jackfruit:
    label: джекфрут
    summary: Огромен тропически плод; най-големият плод в света, който расте на дърво.
    info: |
      Джекфрутът дава най-големите плодове, които растат на дърво; могат да тежат над 35 кг.
      Произхожда от тропическа Азия и е основна храна в Индия, Бангладеш и Тайланд.
      Неузрелият джекфрут има неутрална текстура и се използва като вегетариански заместител на месото.
      Зрелите жълти парчета са сладки и ароматни.
  fruit.durian:
    label: дуриан
    summary: Голям бодлив тропически плод със силна миризма; кралят на тропическите плодове.
    info: |
      Дурианът наричат краля на тропическите плодове.
      Силната му миризма е отблъскваща за едни и примамлива за други; в много азиатски хотели е забранен.
      Вътрешността е кремообразна и сладка, със сложен вкус на бадем, ванилия и сирене.
      В Югоизточна Азия го ценят като изтънчен лукс.
  fruit.rambutan:
    label: рамбутан
    summary: Червен космат тропически плод, подобен на личи.
    info: |
      Рамбутанът произхожда от Малайзия; името идва от малайската дума rambut, което означава косъм.
      Червената му кора е покрита с меки, кукести израстъци.
      Вътрешността е прозрачна и сладка, също като на личито.
      Богат е на витамин C и желязо.
  fruit.longan:
    label: лонган
    summary: Малък кафяв тропически плод, сроден на личито.
    info: |
      Лонганът е плодът на тропическо дърво с произход от Китай.
      Името идва от китайската дума long yan, което означава драконово око, заради прозрачната вътрешност с черно семе.
      Има сладък и ароматен вкус.
      В традиционната китайска медицина се смята за храна, която укрепва кръвта и сърцето.
  fruit.tamarind:
    label: тамаринд
    summary: Кафяв бобов плод с кисела вътрешност; основа на тайландската кухня.
    info: |
      Тамариндът произхожда от тропическа Африка; днес се отглежда из целите тропици.
      Вътрешността е силно кисела и сладка; използва се в пад тай, в сос Уорчестър и в индийско чътни.
      Думата идва от арабското tamr hindi, което означава индийска фурма.
      Богат е на винена киселина, витамини от група B и желязо.
  fruit.nectarine:
    label: нектарина
    summary: Гладка праскова без мъх; сочна и сладка.
    info: |
      Нектарината е естествена мутация на прасковата с гладка кожа.
      Различава се от прасковата само по гена за гладкостта на кожата.
      Има подобен вкус, но по-плътна структура.
      Името идва от нектара на боговете и свидетелства за предполагаемото ѝ съвършенство.
  fruit.damson:
    label: дамаскинска слива
    summary: Малка тъмна слива, типична за английските селски градини.
    info: |
      Дамаскинската слива е малък сорт слива с тъмен синьо-черен цвят.
      Името damson идва от Дамаск, откъдето плодът е стигнал до Европа.
      Сурова е много кисела, но отлична в сладка, компоти и джин (damson gin).
      В английската традиция се отглежда от древността.
  fruit.medlar:
    label: мушмула
    summary: Малък кафяв плод, сроден на ябълката; трябва да узрее след беритбата.
    info: |
      Мушмулата е древно градинско растение, отглеждано от Средновековието.
      Годна е за ядене едва след като омекне (отлежаване), тоест след дозряване след беритбата.
      Богата е на танини и витамин C.
      Шекспир я споменава в Ромео и Жулиета; днес е по-скоро любопитство за градинари.
  fruit.ackee:
    label: аки
    summary: Червен тропически плод с годни за ядене жълти арили; националният плод на Ямайка.
    info: |
      Акито е националният плод на Ямайка; кръстен е на капитан Блай (1793).
      Годни за ядене са само зрелите жълти арили; неузрелият или преузрял плод е отровен (хипоглицин A).
      Ackee and saltfish е националното ястие на Ямайка.
      Произхожда от Западна Африка и е пренесен в Карибите чрез търговията с роби.
  fruit.feijoa:
    label: фейхоа
    summary: Малък продълговат зелен плод с ароматна вътрешност.
    info: |
      Фейхоата произхожда от Южна Америка.
      Вътрешността ѝ има интензивен ароматен вкус на ананас, гуава и мента.
      Много е популярна в Нова Зеландия като есенен плод.
      Малко позната е в Европа, но обичана в страните на произход.
