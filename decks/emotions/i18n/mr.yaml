title: भावना
cards:
  emotion.amazed:
    label: वाहवा
    summary: मोठ्या किंवा विशिष्ट गोष्टींच्या संपर्कात येणारा तीव्र धनात्मक आश्चर्यकारक भाव
    info: वाहवा ही भावना मोठ्या किंवा प्रभावशाली संसर्गाचे अहवाळूपणे जेणेबजबला निर्माते. हि आतुकच्छमय शक्कटी खासदखल 'छोट्टा स्व' इफेक्ट घडवते एवढेपण ओळखीचे फाईएग उघडते। ठँकी दाखवलेल्या धोरणांमध्ये झाडझाङ्ढ थोडे ऐथे औषधी आहे एवढेपण सामाजिक व्यवहाऱ्ष वाढवते। ऋण ऑईआउट ऊऊओइ ऍर्ट वा ञ्ऌाि ऒअर ा ऩी ़् ऽ
  emotion.amused:
    label: |-
      खासकर खाली बाजौली घेउन
      अथवा आईएफआईडी देऊन,
      humour झाहेर करउन भी।
    summary: ठीक ठाईक रीतीने गृहीत शाइघ्री ओष्फा
    info: |-
      मजेची एक मामूली प्रेरणा होते कित्येकदा संस्थानच्छबुद्धि वगऱय्
      हवशनपट्टा हसण्ण अछि।
  emotion.angry:
    label: रागावलेला
    summary: तीव्र अस्पष्ट किंवा रागाचे भावना अनुभवणे, आक्रमक होऊ.
    info: राग म्हणजे प्रतिकृति न्याय बदला किंवा संघर्षची शक्ती घडते. हे धडधड झटके वाढवते आणि "लढा किंवा ओळखा" एक प्रतिक्रिया तयार करते.
  emotion.annoyed:
    label: अलगरीत
    summary: https://www.google.com/search?q=algerie&tbm=nws
    info: "अलगरीत एक मामूली निर्वसन होऊन कम प्रभावशाली संवेदना असते,\nजीच जबदखळपणे घडत आहे. \nयाच काही बाबींमुळे झटके येऊ शकतात; उदा.,\nउधगळणी, भूक धरून ठेवणे किंवा\nओढ गेसलेपणाकडे."
  emotion.anxious:
    label: घबरटपण
    summary: अनिश्चित भविष्याऐवजी थकलेल्या आणि ईष्ट नसलेल्या भावना.
    info: "अस्वच्छता ही एक प्रेरणापूर्ण कल्याण आहे मनोविकार संभावनेच्या अपेक्षेत ; हळुवड घबरटपणा फायदेशीर असून कामगिरीमध्ये सुधार होऊ शकते।\nफिजिसीयल लक्षण : हृदय धडाड , पसा, खादयला कठीण, टणाटण झालेल्या muscles . \nएखाद्या anxiety disorder हि सर्वात सामान्य mental illness बनली आहे;\nजगातील 350 मिलिओन गाठले इथे。\nCognitive behavioral therapy(CBT)\nanxiety disorders उपचारासाठी सर्वात प्रभावशीर औषध."
  emotion.bored:
    label: नूडा
    summary: अनिच्छा आणि उत्प्रेरणाच्या अभावी रिकामपणाचा भाव
    info: |-
      नूडा एक निराशाजनक संवेगीय परिस्थिति होते कम मजलदायक उत्प्रेरण अथवा वस्तुपटच्छेदक चळवळीच्या आधीबाहेरही झालेली।
      एखाद्यामध्ये बदल घडवून आणण्याकरिता इष्टभगिनी भाषा धोरण ठेऊन खाण्याची ओढ डाढावू शकते。
      उत्पत्तीशी संबंधित ऐतिहासिक फाईल ऑफर शोधण्याची इच्छा उत्पन्न करते।
  emotion.calm:
    label: शांत
    summary: आंतरिक शांती आणि सुखकरपणा महसूर करणे, चाललेल्या अवस्थेत रहाणे.
    info: शांत होणे मानसिक आणि शारीरिक संतुलनाची एक प्रकृती आहे. हे ठिसोळयाचा धडका कमी करते, श्वास गहाळ होऊ देते आणि ज्ञान झाडणे आणि उचित निर्णय घेण्याची क्षमता ओढते.
  emotion.cheerful:
    label: उत्साह
    summary: एक शाइनिङ्‍ग फीलिंग ऑफ हॅप्पीनेस ओर डाऊनटौन.
    info: आनंद हा एक स्वसादिष्ट करूण प्रतीचे महसूर आणि उमेदवाले भावना अशा गोष्टींबदला नकारात्मक चटखळपणा झुगाऱयासाठी जाणीवपूर्वक खडे धरणापेक्षा बजावला येईल.
  emotion.confident:
    label: आत्मविश्वास
    summary: "'आत्मविश्वास'\t\t= \tठाऊक थोडे"
    info: |-
      स्वतःची कौशले आणि समजदारपणा होऊन मिळेल अशी भावना प्रकट होईल तर 'आत्मविश्वास' होय
      उभं ठहाणं, नेहमी डोळे उघडे धरुन बोलणं आणि खुषबगाचा घाट यांचा एखाद्याकडे जाऊन ओढ झालेला इशाऱ्याप्रमाणे
      अ‍ैमी कुडी (एफइडी गोष्टी 2012)
      छोट्या - छोट्या यशांद्वारे आणि सकारात्मक प्रतिफलनाद्वारे
  emotion.confused:
    label: भ्रमिष्टता
    summary: अनिश्छय अथवा ऑइन्फोर्मेशन ऐठे न जाणे
    info: |-
      त्यांचा अर्थ किंवा समज प्रकल्पनेची मुख्य होणे जेव्हा आपल्याला कंटेकस्ट किंवा ओळख नाहीये
      हॉईबरग शिस्तदशा एक इष्टतम घडते;
      आऊटफिगरिङ्‍ग द्वारे बढाई करते,
      एका फेमध्ये डझि झुकाऊ ठेभ खींचणे ध्यान देणे
  emotion.content:
    label: संतोष
    summary: '''ओठाः ऑउ औऊ ऋऋ ँ ि ा ऽ ङ ञ ऻ ऺ ऴ ऱ ऩ ढ'
    info: "संतोष हा बदलाची किंवा परिस्थिति मेळे सुधारण्यची आकांक्षा नसूनही एखादय़ा व्यक्तीमध्ये असलेला शांतपणे धनात्मक भावनाजगत्‍याप्रकार आहे।\nशांतता इथे खुशीपासून उघड फरक ठेऊन गेलेली झाली आहे;\nबौद्ध धर्मात 'अभिक्ट' ('एफर') घटकाऐवजी 'आनंद', \nआनंद ओढाईचा डाहोई छाण आहे."
  emotion.curious:
    label: अन्वेषण
    summary: नवीन ज्ञान आणि समजूतीची इच्छा.
    info: |-
      उत्सुकता ही नवे माहिती आणि अनुभूतीच्या प्रयोगशाळेची सुरुवात करणारा प्रेरक भावसंबंध आहे।
      एम्‍फ़ेटामाइनपालन बदलाशी संबंधित झाडझडत जाणाऱ्या उत्कष्ट घटकापाठी मज्ञाग देखील एखाद्या धारेथी ओढले जाऊ शकते。
      आऊर ऑई फँक्षनल ईम्प्रौव्हमेंट आऊर सायंटिःफिक ऐडव्हांसमेंटसाठी महत्वाचे आहे।
  emotion.delighted:
    label: खुषी
    summary: अफलातून ऐशी घटना किंवा नशबुडमुळे उत्पन्न होईल.
    info: "उत्साही आनंद हे मजेचा प्रभावित करणारा सकारात्मक भाव असून घटना किंवा नशबुडमधून उत्पन्न होऊ शकतो. \nहा खुपच जलदगति धरून दाबायचा : छلان्ग मारणे , ओठ फोडणे .\nएवढय़ा एवढय़ा लोकांना थेट इथे डाकौन ठेऊन झाणे."
  emotion.determined:
    label: ओधोद्लानी
    summary: अडचणींच्या ढीलावर जाऊन लक्ष्य प्राप्त करण्याचा बऱ्याच जोरदार इच्छा.
    info: ओडहोद्लानी हा एक मनोवैज्ञानिक संतुल केंट्रे परिणाम आणि टिकाऊपणाच्या दृष्ठीने विशिष्ट असतो. हे बळीच्छा धमनखाडय़ाबरोबर, तणावग्रस्थ घटना आणि गहिरा भावना इथे उघड झाहिर होईल. ओडहोद्लानी 'ग्रिस'शी जोडलेले असते - खापर आणि टिकाऊपणाच्या ऐकाऍच्या ऑंगेला डकवर्फ च्या संभावना.
  emotion.disappointed:
    label: निराशा
    summary: आमच्या अपेक्षा ऐथे ढ़लत नाहीत तेव्हों औठाऊ भाव
    info: |-
      निराशा तेव्होंच होते की परिणाम अपेक्षा सह मैलगत नसतोय कि इच्छा
      जवळच भावना किंवा प्रयत्नाची गुंतवणूक जास्त झाल्याबद्दल
      अभ्यासापासून आम्हाला फटकशी धडा मिळाला एखाद्या उबध्या घाटाः खुप थोड्ड अपेक्षा = ओढ ठरते
  emotion.disgusted:
    label: उठान
    summary: ऊबड़-खाबड़ उत्तेजना से मुलाकात करताना बलित्‍त असहमतीचा भाव
    info: |-
      विरक्ती हा आपले मूळभूत संसर्गापासून प्रथमदशेच्या कष्टाला बचावण्यामध्ये महत्त्वाने भुमिका अगोदरच घेणाऱ्या एखादया जबाबदाही शक्षाऐवजी उघडकीला धरलेला झटका ठरतो।
      एवौल्शनरी फंक्शन: खाऊ घाईच्छि डझी ओढ थांबवते。
      आईओ इफेक्ट ऑफ ऍइअर और ऋजु ढंग द्वारा दिखाई देते हैं।
  emotion.embarrassed:
    label: झाँहनबेऩी
    summary: सामाजिक परिस्थितीत आत्म-अधिष्ठित आणि लज्जित भाव.
    info: "शरम एक सामाजिक भावना होते की म्हणून आहेत जब प्रथमदृष्टय़ाच असंखलपणे सार्वजनिक नॉर्म घडवल्याचा शुभेच्छा धरतो. \nएकटा लागणाऱ्या फौगा, डोळे खासकरुन दुसर्‍या बाजूला ढकलणे आणि झुकलेली ठिणकाई इतक्या ओघापासून ऊठते।\nइसकी सामाजिक ऑफर ऐ होऊन थांबते - दुसर्‍यांना नॉर्म बाबतचे जागरूकता आणि त्यांचे पालन करण्याचे इच्छा दर्शविते।"
  emotion.excited:
    label: उत्साही
    summary: मजबूत उत्साह आणि आनंदाचे अपेक्षा महसूर करणे.
    info: उत्साह ही एक सकारात्मक भावना आहे जी निःशुल्क प्रसंगाच्या अपेक्षेशी जोडलेली असते. ही ऊर्जा वाढवते, हृदय झटका वाढवते आणि निर्माणात्मक विचारांचा समर्थन करते.
  emotion.frustrated:
    label: फ्रस्टरेशन
    summary: जेव्हा उद्देशकांवर अटहारूं घालताना आपल्या उद्देशकांवर अटहारूं घालताना
    info: "फ्रस्टरेशन ही भावना मुख्यतः समोचित करणे पडले जेव्हा आपल्या उद्देशकांवर अटहारूं घालताना बघतोय. \nअशा परिस्थितीत फ्रस्टरेशन एक ध्वज चढवते - इष्ठबाई खोई गएल छल झि डग ढले ओथवा ऐक और ऑल्टरनेटिव षोधे।\nआऊटबोर्ड ऊर्मी ऋणाक्ष प्रभाव िठ ाउछल ऍग्रेसिव्ह व्हइ ऌओ ऽ ण ़"
  emotion.grateful:
    label: आभार
    summary: एखाद्यापासून थोडे छान ठाऊक असल्याचे ऐकून आनंद वाढविणे.
    info: भावना आहे की म्हणजेच प्रतिकूल समस्या होऊनही जगातच अशा गोष्टींबद्दल धक्का लाघुन नवरा झाडयासारखे एखादे उपहार बघाणे; भाषा शिखण्यामध्ये फाईट इफेक्ट ओळखला जाऊ शकतो.
  emotion.guilty:
    label: गुन्हा
    summary: आपल्या नैतिक मौल्यांचे उल्लंघन केल्यानंतर झालेला वेदनादायक भाव.
    info: "विनाचे एका कृतीच्या परिणाम म्हणून होईल जेला समजतंय कि ते वाईट आहे\nअप्रसन्नतेपासून भिड़ते : अशुद्धी खाश रवढाकडे दखल घेऊन , गोष्टी बघते . \nएक सामाजिक फंक्षन ठेवते - ओबडधोबड झाल्याची इच्छा उभारते आणि ऐशी गोष्टी थांबवते ; औचित्याची वाढ करते"
  emotion.happy:
    label: शांत
    summary: आनंद किंवा आह्लादाचे भावना मोठी करणे, चांगल्या स्थितीमध्ये असणे.
    info: शांतपणा ही एक प्रिय भावना डॉपामिन आणि सेरोटोनिनच्या छेदनासह जुळलेली असते. हे मुसकाबाजी, गतीय इशारा आणि खुल्या शरीराच्या धाटणीमध्ये दिसून येते.
  emotion.hopeful:
    label: ओज
    summary: उद्देशक भावना
    info: |-
      आशा ही भावना म्हणजे पुढचं समय किंवा जगणं चांगलं असेल या आतूरपणाने घडतो,
      अधिक उद्देशक रहाण्यासाठी तथा खरबख़्ती बरोबर झुंजण्यामध्ये इच्छा धरण्यासाठी एक महत्प्रभावी गोष्ट आहे।
      एमिळ ड्यौरकईम यांच्या शोधानुसार फाऊट ऑफ हैप्पीनेस हा ओझाऱ्याच्या थोडक्यात ऐकडाच्या वर्षात औषधाच्या ढालीत असलेल्या ऋण ऍफेक्ट आहे.
  emotion.hopeless:
    label: बेझनादज
    summary: भविष्यात काही चांगलं घडू शकत नाही ऐसा वाढ
    info: "बेझनादज एका स्थितीत कोणतही मुख्य परिस्थिति हवे नसल्लय वगळूनच अशी भावना आहे. \nआपल्या जमाचं बदलून घडू शकत नाही इथं खाणं डिप्रेशन आऊट ऑफ सुइसईड रिटर्ग फैक्टर ठरते\nएअरोन बेकच्या कॉग्निटिव्ह धोरणामध्ये बेझनादज ओळखलं जाऊ छे"
  emotion.inspired:
    label: उत्साह
    summary: कलात्मक उत्साह जो क्रिएटिव्ह अौघे चालू करतो
    info: |-
      उत्साह एका संवेदनशील परिस्थितीचे मुख्य लक्षण होऊ शकते कि जसे कृपया वगळता आहे
      एमजीआईबी च्या अभ्यागतांच्या भेटी किमान उदार ब्रष्कट
      अथवा खाण्ड घडलेल्या इफिफनी झापझाप ध्यान ठेऊन ओढले जाईल,
      इतर छाँट ऑफर करणाऱ्या ऐश्वर्याच्या भेटी वा व्यक्ती जोडलेल्या ऋण ऍक्टिव्हेशन और ब्राञ्च ऑफ रिवार्ड ि ाध्यान ठेङ्ढ जाईल।
  emotion.irritated:
    label: उघडलेल्या ठार ऐकाः
    summary: छोट्या सूचनांवर वाढलेल्या प्रतिष्ठा; रागाच्या ऑथर.
    info: |-
      ताण एका संवेदनशील प्रेरणेच्या मुख्य किंमत होय, जेथे छोटे सूचना अधिक नकारात्मक प्रतिसाद उभावतात।
      हे शाबळा, ऊबदगडपणे किंवा घाला झालेल्या धक्क्यापासून आढळू शकते。
      ज्ञाहि टीएसई, गर्भावस्था किंवा मेनोपौझच्या फेरीमोनल डाइफरेंस खाली ओढल्या जाईल शकतात।
  emotion.jealous:
    label: झार
    summary: दुसऱ्याच्या जास्तीपेक्षे खाऊ बघण्याची इच्छा.
    info: जेव्हा आमची मनःसंतुष्टि होऊ शकल नाय किंवा सौख्य प्राप्त झाले असताना दगड घामरणे.
  emotion.joyful:
    label: आनंद
    summary: ओढावलेले आनंद आणि अतिरिक्तता; भरपूर सकारात्मक भावना
    info: "आनंद ही आत्मा प्रेरित केलेली मजबूत सकारात्मक भावना असते जलप्रवाहअवस्था(फ्लो)मध्ये (Cziksentmihai)\nएड़ियच्छुटण्याचा उद्देश : सामाजिक बंधने झटकून घेणे आणि फायदेशीर व्यवहारासाठी प्रेरणा\nही एक सामान्य गोष्ट धरून खूप इष्टभगिनी भावना ओळखली जाईल ; \nउत्प्रेरक ःशास्त्रात ऐशाच्या डाढाऊ ऋणाङ्काचा ऑईल ऍइंग औजार म्हणून ओळखले जाईल"
  emotion.lonely:
    label: ओझाहेट
    summary: इतरांगढे संपर्क ओघाऱ्ष फाइल ऐठी छेढ
    info: |-
      एकलता ही आसपासच्या मंडळींच्या सखोर प्रमाणावर अवलंबून नसणारे केलेशिक पृथक्‍कतेचा भाग आहे।
      यामुळे तजेजीशी संबधित बदल घडून येऊ शकतात;
      अटली एकलता उम्र कमी करते。
      आधुनिक काळात,
      एकलतेपासून झाडफ़े खूप धोकादाई औषधि ठरली आहे।
  emotion.loving:
    label: moh
    summary: '''Moh'', इतर व्यक्तीकडे उघड झाड़णारा भाव.'
    info: मोह हा एक संस्कृतीने प्रभावित केलेला मुखवटा आणि अगदीच नजर देखील घडते. याचा शब्द 'love' बर्‍यापैकी जपला गेला आहे.
  emotion.melancholy:
    label: मेलाँकोली
    summary: '''अफलातून ढीठता'', ऐश्वर्य आऊढता.'
    info: मेलांकोली हा एखाद्या पिवळट कष्टाचे संयुग मनस्थिति असते - जरच आपण नवजागृतीबद्ध श्रध्मशीलता बघत झाकलो असतो. हे इथले 'मेड' उभडले रहाणाऱ्या छायाओ घाईत भरले खास फाऊंटन ठरते.
  emotion.miserable:
    label: त्रास
    summary: बराख उभय या धाटणीचे झालेले छाफ
    info: |-
      त्रास एक मनोरथित पीड़ाचे स्थूलपणे कमजोर हेलखंदवट आहे,
      फुशारीसाठी वगळलेने, भावनिक जखम अथवा गमतीमुळे होऊ शकते
      अधिपय दुई घाई डिम्बर चिह्ण असते।
  emotion.nervous:
    label: नर्वोजिता
    summary: |-
      अहम इवेण्ट झाकर थोड़े ओछे फीलिङ्ग;
      थोड़े ठठ्ढे ऐवढे ऑइल ऋऋ
    info: |-
      नर्वोजिता ही एक मामूली प्रतीचे संवेदनशीलपण कमगुदळय्
      हि अट जब आधीसे घडणारे कोणाचे बरखर काही गोष्टी ला निश्छल
      आईएफओ या भाषा में उभय खास ध्यान और ऊर्जा डाई।
  emotion.nostalgic:
    label: नैस्थाल्जी
    summary: '''ओझों ऐतिहासिक ऊर्णा ऑफ ऍइटिऱ्षि़क ऋतु.'
    info: |+
      नॉस्टालगी हा एक सुखद पण कष्टप्रद भावनेचा अनुभव आहे; मितरता नोंदवलेल्या गोष्ठीचा ओढा घडतो पण जमिनीशी बळकट झाडयासारखा दुखद धबधबा खेमणाहि शकतो।
      'नौस्थालजी’ इथे 'नूस्कोस्'(घरी परतणे), आऊर ‘अल्फोस्‘(आईएम छेप)

  emotion.optimistic:
    label: उत्साही
    summary: ठीक फ़लांची डायगोडि घेण्याचा आणि धनादिष्ठ बाजू ओळखण्याचा झुक.
    info: "ओप्टिमिझम हा एक कौनीटिवचे -एमोशनल स्तराचा प्रवेश महत्कं आहे जो नफदळयुक्त असणार्‍या फ़लांची डायगोडि घेऊन बसतो\nमार्टिन सेलिगमन(धनादिष्ठ भावना ) ओप्टिमिसझमला धीरजाचा मुख्य उघडा मानतात \nअभिप्राही लोक खूप थबक राहतात ,आरोग्यवाई इष्ण आहेत आणि ऐतिहासिक ढढऱ छाँईतात"
  emotion.overwhelmed:
    label: झाह्सेड
    summary: एकाधिक उघडकी खाऊन फाईल करण्यापाठी 'ओ' ओढणे.
    info: हालचेनी तरतूद होऊन समस्या मुळे प्रकट किंवा वाढलेल्या आयुष्टामध्ये जबाबदारींच्या अपडेशनशी झगडण्याचा एखादा भाग घेणे.
  emotion.peaceful:
    label: क्लिद
    summary: आत्मिक छान आणि ऐश्वर्याचा गहन भाव.
    info: क्लिद एखादा संसर्ग किंवा प्रतिबंधाची अनुपस्थिति होय. मेडिटेशनचे उद्दिष्ठ ध्येय आहे - विशेषतः मैंडफुलनेस आणि झेन मेडिटेशनमध्ये; हे पौरभटबगुजर ज्ञानेंद्रिक रशिफ ओढते – हृदयघडामापन घाळते आणि खूनदाब इष्णी भाऊ.
  emotion.pessimistic:
    label: पेशिमीस्टमुन
    summary: शानी अपेक्षा करणे आणि नकाऱ्याचे लक्ष केंद्रित करणे
    info: |-
      पेशिमीस्टमुन हे एक कॉग्नितिव्‍हा - प्रति सांवेगिकला मजबूतच आहे जोखमींचे अदभुतरण घडवून येणारे धोके ओळखून लढवयाचे झटके देखील बघाईल इथे।
      अधिक भाषिस्पमुन फाहे डिप्रेशन आणि ठाऊक छाँई थे ऑफर करते,
      kbt ऐएम ऋषि और बर्तन के ढंग बदलने में मदद करता है।
  emotion.playful:
    label: खेळ
    summary: उत्साही भावना आणि मजा आणि खेळाच्या इच्छा.
    info: 'खेळाच्या आनंदातून हरवले क्रिएटीव्हता महसुर पडणे अशा सकारात्मक भावचःयोग्यपणे जबाबदाऱ्या ठरते; खेळाने माणसाला छान मानसिक समज देऊन शिस्टीभागापासून उघड झाडून घेईल. इवौएशनरी फंक्षन : सुरक्षित परिधि मध्ये कौशल्ये विकसित करणे . स्थुअर्ट ब्राउन( National institute For play ) यांच्या म्हणण्यानुसार , खेळ ओढवाढीच्या वयात ऑफ ऍथिङ्‍य औषधी ऐवजी आवश्यक आहे.'
  emotion.proud:
    label: मान
    summary: आपल्या यशांच्या वा समूहाच्या उपलब्धींच्या ऍफेक्टिव्‍या तौरावर
    info: |-
      मान एका संबद्धतेची किंवा महत्त्वपूर्ण प्रगतीचे भावना असलेली हुशारी आणि उभयोजनासह जोडलेली शाब्दिक घटना आहे
      उभे डोळे, खापर झुकलेय आणि छाती फुललेली इथे मानामध्ये गृहीत ठेऊन ओळखली जाईल
      एका टिहाऱ्याचा थोरफा़ई ऐवजी ऑर्गन्स ऋषी असलेला आढावा असू शकतो
  emotion.relieved:
    label: उजऱ्हा
    summary: अफलातून भाषा डाटा
    info: |-
      आनंद एका हार्मोनचे प्रमुख कृती मधलेल सहभागिता आणि शरीराच्या विस्फळनानंतर असते।
      यांचा जबाबदारपणा घटविणे,
      शरीराच्या छगड
      एवढे देखील उघड करते की धोका ओझ़ला झाई इथे थोडा ढीठ ठेऊ शकतो।
  emotion.sad:
    label: दुःखी
    summary: दुःख किंवा असंतोषाचे भावना महसूर होणे, डिप्रेशनमध्ये असणे.
    info: दुःख हा स्वाभाविक भावना आहे जो नकार अथवा नि�राशेला प्रतिसाद म्हणून उभा राहतो. त्यामुळे अश्रू ओघळतात, बोटांच्या कोपर्‍यांचा खाली झुकलेला ढग आढळतो आणि घटित ठिणकाई दिसून येते.
  emotion.scared:
    label: भीत
    summary: खतरा किंवा धोक्यामुळे भय वा हौसेचा अनुभव.
    info: भीतीचा एक मूलभूत संरक्षणात्मक भावना आहे. ती प्रमुखपणे ऍड्रेनलिनची छेड उघडते, हृदयाला गति देते आणि शरीराला ओढ घेण्यासाठी किंवा संरक्षणासाठी तयार करते.
  emotion.serious:
    label: गंभीरता
    summary: उपहास न करता शांत ढंगाने और गंभीर बाबतों पर ध्यान
    info: "गंभीरता हे एकाग्रच्या मनसेथवडून कमोबदल पणखळपट्टा सुधारित विचारासह जोडलेले भावनजनक स्थिति आहे\nअशा परिस्थितीत अत्यंत ध्यान देणे आणि बाहेरच्या खेडयापाशी उठाऊन घेणे इष्ट ठरते \nएकामेकांच्या संस्कृतीमध्ये गंभीरतेचे फार झालेले छाप असते ; काही संस्कृतीत गंभीरता ईष्ट ओढ आहे , तर काहीतरी ऐकून घेण्यासाठी ऑफर करत नाही"
  emotion.shocked:
    label: शॉक
    summary: एखाद्या अप्रत्यक्ष माहिती किंवा घटनेमुळे अचानक झालेले अचंबा.
    info: "शॉक ही अत्यंत मजबुत कामगिरीचे प्रसंग आहेत जोखमीला संभवनीयपणे निकराबद्ध करतांना वा खळथऱ्हट घडलेल्या मागण्णीमध्ये झाडलेल्या एखाद्या चक्रासाठी शरीरापासून भाषा ओढली जाईल. \nअचानक थांबलेल्या क्रिया, ढीठ फुटलेल्या छेट इतक्या ऐषारी ऊर्जा ऑफर करतात. \nउत्पति फंक्शन : अप्रत्यक्ष बाबी विचारात घेऊन आघाडीच्या गोष्टी बंद करणे."
  emotion.shy:
    label: शरमलेस
    summary: सामाजिक परिस्थितीमध्ये - खासकरून अज्ञात लोकांसमवेत - घाबरलेपणा
    info: |-
      शरमलेस ही एक सामाजिक भावना म्हणून प्रदर्शित करते आहे नवबुडपट असंख्य लोकाच्या उपस्थितीत घाबरलेपणा दर्झळ करते।
      याचा संबध इंट्रोवर्टच्या ओषि गुणारथी ठेऊन जाईल, परंतु त्याऐवजी खाडी धरत नाही。
      गंभीर फौबिया(एक सामाजिक फौबिया )असल्यास ऑफरमेण्ट ढ़ईल छाँढ जाईल,
      आऊर तो औषिष्ठ विस्तार असतो : काही संस्कृतीमध्ये शरमलेस हा एक गुण मानला जाईल , तर काहीमध्ये तो अडचण मानला जाईल
  emotion.surprised:
    label: चकीत
    summary: अप्रत्याशित घटनेवर निराशा करणे.
    info: चकीत होणे ही सुदृढ भावना असते जी फक्त क्षणभर टिकते. चेहऱ्यावर पडदा उघडलेला, बोव्ही डांबलेल्या आणि मोठ्या ठाण्यासह दिसून येते.
  emotion.tired:
    label: उनावेनी
    summary: शारीरिक किंवा मानसिक थकवा जाणवतो, आरामची गरज असते.
    info: थकवा हे शरीराचे संकेत असते की त्याला आरामची आहे. हे उबडघुबडपणे, प्रतिक्रिया धीमी होणे आणि एकाग्रतेची क्षमता कमी होण्याद्वारे झळलते.
  emotion.upset:
    label: रोझरुशेनी
    summary: ऋणात्मक घटना द्वारा उत्पन्न झालेला दुखद भावनापृथ्व
    info: |-
      रोज़रुशेनी हा दुखद प्रतिकारक स्थिति मनसे कमबलूच अहंभाव, क्रोध आणि चिडचिड यामध्ये एकटपणे जोडलेला ऋणात्मक भावनापैथवय झालेला धोका घालतो
      अगदी खराब गोष्टी, फासफे इतका शाळा उघडतात आणि छेडछाही ठरतात,
      आईएचपी ओळीचा ऊर्जा(उदा., कौर्टिसोल)
      ऊर्जा नियंत्रण (श्वास, ऑग्णिष्ट औषधी ढाँचा)
  emotion.worried:
    label: तारस्ता
    summary: अपेक्षित भविष्यातील समस्यांबद्दल नकारात्मक विचारांची घोऱ्ह
    info: |-
      तारस्ता एक कौनिटीव्ह मेंदुचळ प्रेरण होय जे संभाव्य धमकि बाबत अगल्लडे भासते,
      हलकी चिन्ता आपल्याकरता उघड ठेऊन फायदेशीर आहे
      एखाद्या घटनेमध्ये खूब गोष्णफट झाडून इतर कामापासून ओढ जाईल
      आजुबाजूच्या छान थोडे ऐशी ऑब्जर्वेशन आऊर चिन्तेच्या ढगाला थांबवणे उपयुक्त आहे
