lang: mr
pivot: false
title: भावना
cards:
  emotion.angry:
    label: रागावलेला
    summary: तीव्र अस्पष्ट किंवा रागाचे भावना अनुभवणे, आक्रमक होऊ.
    info: राग म्हणजे प्रतिकृति न्याय बदला किंवा संघर्षची शक्ती घडते. हे धडधड झटके वाढवते आणि "लढा किंवा ओळखा" एक प्रतिक्रिया तयार करते.
  emotion.calm:
    label: शांत
    summary: आंतरिक शांती आणि सुखकरपणा महसूर करणे, चाललेल्या अवस्थेत रहाणे.
    info: शांत होणे मानसिक आणि शारीरिक संतुलनाची एक प्रकृती आहे. हे ठिसोळयाचा धडका कमी करते, श्वास गहाळ होऊ देते आणि ज्ञान झाडणे आणि उचित निर्णय घेण्याची क्षमता ओढते.
  emotion.excited:
    label: उत्साही
    summary: मजबूत उत्साह आणि आनंदाचे अपेक्षा महसूर करणे.
    info: उत्साह ही एक सकारात्मक भावना आहे जी निःशुल्क प्रसंगाच्या अपेक्षेशी जोडलेली असते. ही ऊर्जा वाढवते, हृदय झटका वाढवते आणि निर्माणात्मक विचारांचा समर्थन करते.
  emotion.happy:
    label: शांत
    summary: आनंद किंवा आह्लादाचे भावना मोठी करणे, चांगल्या स्थितीमध्ये असणे.
    info: शांतपणा ही एक प्रिय भावना डॉपामिन आणि सेरोटोनिनच्या छेदनासह जुळलेली असते. हे मुसकाबाजी, गतीय इशारा आणि खुल्या शरीराच्या धाटणीमध्ये दिसून येते.
  emotion.sad:
    label: दुःखी
    summary: दुःख किंवा असंतोषाचे भावना महसूर होणे, डिप्रेशनमध्ये असणे.
    info: दुःख हा स्वाभाविक भावना आहे जो नकार अथवा नि�राशेला प्रतिसाद म्हणून उभा राहतो. त्यामुळे अश्रू ओघळतात, बोटांच्या कोपर्‍यांचा खाली झुकलेला ढग आढळतो आणि घटित ठिणकाई दिसून येते.
  emotion.scared:
    label: भीत
    summary: खतरा किंवा धोक्यामुळे भय वा हौसेचा अनुभव.
    info: भीतीचा एक मूलभूत संरक्षणात्मक भावना आहे. ती प्रमुखपणे ऍड्रेनलिनची छेड उघडते, हृदयाला गति देते आणि शरीराला ओढ घेण्यासाठी किंवा संरक्षणासाठी तयार करते.
  emotion.surprised:
    label: चकीत
    summary: अप्रत्याशित घटनेवर निराशा करणे.
    info: चकीत होणे ही सुदृढ भावना असते जी फक्त क्षणभर टिकते. चेहऱ्यावर पडदा उघडलेला, बोव्ही डांबलेल्या आणि मोठ्या ठाण्यासह दिसून येते.
  emotion.tired:
    label: उनावेनी
    summary: शारीरिक किंवा मानसिक थकवा जाणवतो, आरामची गरज असते.
    info: थकवा हे शरीराचे संकेत असते की त्याला आरामची आहे. हे उबडघुबडपणे, प्रतिक्रिया धीमी होणे आणि एकाग्रतेची क्षमता कमी होण्याद्वारे झळलते.
