lang: sa
pivot: false
title: भावना संस्कृति
cards:
  emotion.angry:
    label: नाराज
    summary: शक्तिशाली असंतोष या क्रोध महसूर होणे, नाराज असलेले.
    info: क्रोध ही एक भावना आहे जी प्रतिकृति समजलेल्या अन्याय चे किंवा धोक्याबद्दलची प्रतिक्रिया आहे. तो हृदयगति वाढवतो आणि 'लढा किंवा पळा' अशा प्रतिक्रियेसाठी शरीराला तयार करतो.
  emotion.calm:
    label: क्लिदन्
    summary: अंतर्य मैत्री एवं सुखमय भावना करणे, शांति में होना।
    info: शांति मानसिक तथा शारीरिक संतुलन की अवस्था है। इससे हृदय की धड़कन धीमी पड़ जाती है, साँस गहरी हो जाती है और स्पष्ट चिंतन तथा उचित निर्णय लेने की क्षमता बढ़ जाती है।
  emotion.excited:
    label: उत्साहित
    summary: मजबूत उत्साह और प्रसन्नता के साथ अपेक्षा महसूस करना।
    info: उत्साह एक इंटीज़िव धनात्मक भाव है जो आने वाली खुशीदायक घटना के अपेक्षा से जुड़ा हुआ है। यह ऊर्जा बढ़ाता है, दिल की गति बढ़ाता है और रचनात्मक सोच को बढ़ावा देता है।
  emotion.happy:
    label: आनंदी
    summary: आनंद या सुखकर प्रसन्नता के महसूस होने का अनुभव।
    info: आनंद एक प्रिय भावना है जो डोपामाइन और सेरोटोनिन के मुक्ति से जुड़ी हुई है। आमतौर पर इसके लक्षण मुस्कान, उत्साही शरीरिक गतिविधि और खुले शरीर के रूप में प्रकट होते हैं।
  emotion.sad:
    label: दुःखित
    summary: दुःख या असंतोष महसूर करणे, डिप्रेशनमध्ये असणे।
    info: दुःख ही प्राकृतिक भावना आहे जी हार झाल्यास किंवा नि�राश झाल्याच्या प्रतिक्रियेमध्ये दिसून येते। त्याचे स्पष्टीकरण अश्रू, मुखाच्या कोपर्‍यांचे खाली घेणे आणि उभारलेल्या छाया यांच्या माध्यमातून होऊ शकते।
  emotion.scared:
    label: व्यस्त्राशन्
    summary: अपेक्षा अथवा संकट से भय या हरू की भावना महसूस करता है।
    info: भय एक प्रमुख रक्षामयी भावना होती है। इससे एड्रिनलिन का स्राव होता है, दिल की धड़कन बढ़ जाती है और शरीर भागने या सुरक्षा के लिए तैयार हो जाता है।
  emotion.surprised:
    label: अचंभित
    summary: अप्रत्याशित घटना पर अचम्बा होने की भावना।
    info: अचम्बा एक बहुत संक्षिप्त भावना है जो केवल कुछ सेकण्डों तक रहती है। इसके लक्छन मुँह खुला रखना, उठे हुए गाल पर और फैली हुई पुतलियां होती हैं।
  emotion.tired:
    label: उन्नावित
    summary: शारीरिक या मानसिक थकावट का अहस्सा करना, आराम के प्रति आवश्यकता होना।
    info: थकावट शरीर का संकेत है कि उसे आराम की आवश्यकता है। इसके लक्छन बुद्धि कमजोरी, प्रतिक्रिया की गति कम होना और एकाग्रता की क्षमता कम होना है।
