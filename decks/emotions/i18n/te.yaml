lang: te
pivot: false
title: భావనలు
cards:
  emotion.angry:
    label: ఎగ్రీజన్
    summary: కోపం లేదా కొట్టడంలైన బలమైన అసహనాన్ని అనుభవించడం.
    info: ఎగ్రీజన్ ఒక విలువ లేదా ధృవత నుండి ఉద్భవించే భావన ద్వారా తయారౌతుంది, ఇది శరీరానికి 'ఫైట్ ఆర్ రన్' స్థితిలోకి తీసుకురావడానికి గాను హార్మోన్‌లను పెంచుతుంది.
  emotion.calm:
    label: క్లిడ్నీ
    summary: అంతర్గత సమాధానం మరియు ఆరోగ్యంగా ఉండటం, క్లిద్ లో ఉండటం.
    info: క్లిద్ ఒక మానసిక మరియు శారీరక సమతుల్య పరిస్థితి. ఇది హృదయ బలిమిని తగ్గిస్తుంది, గాలి నువ్వులు చేస్తుంది మరియు స్పష్టమైన ఆలోచన మరియు బావుండే నిర్ణయాలకు అనుమతిస్తుంది.
  emotion.excited:
    label: ఉత్సాహంగా
    summary: నిలకడ లేని ఆనందం మరియు పోషక అభిప్రాయం.
    info: ఉత్సాహం ఒక బలమైన ధన్యవాదాలు కలిగించే విజృంభన తీసుకొచ్చే ఘటన ని ఎదురుచూడటంతో జత పెట్టబడిన శక్తిమంతమైన సానుకూల భావన. ఇది శక్తిని పెంచుతుంది, గుండె రుద్దడం వేగవంతం చేస్తుంది మరియు క్రియాత్మక దృక్పథాన్ని ప్రోత్సహిస్తుంది.
  emotion.happy:
    label: సుఖంగా ఉన్న
    summary: ఆనందం లేదా ఆలోకను అనుభవించడం, మంచి నాలుగులో ఉండడం.
    info: సుఖం డొపమిన్ మరియు సీరోటోనిన్ విడుదలతో కలిపే ఒక తృప్తి రాష్ట్రం. ఈ ధోరణి నవ్వు, జీవశక్తి గళితం మరియు ఓపెన్ బాడీ పోజ్ ద్వారా ఎందుకు కనబడుతుంది.
  emotion.sad:
    label: స్వల్పత
    summary: దిగుడు లేదా అనంతరమైన భావనను కలిగి ఉండటం, విలపన.
    info: స్వల్పత నష్టం లేదా ఆశించిన ఫలితం రాకపోవడం దృఢీకరణ గా ఒక సహజ భావన. ఇది తొణపులు, ఎండు బొటనబావ, జీవితం యొక్క డౌన్ స్థితి లో ప్రత్యక్షం.
  emotion.scared:
    label: వణుక
    summary: ప్రమాదం లేదా బలహీనత నుండి భయం లేదా వణుకు అనుభవిస్తున్నట్లుగా ఉంటుంది.
    info: వణుక ఒక ఆధారపోషక రక్షణ తో కలిపి ఉంటుంది. ఈ సమయంలో ఎథిలీన్ విడుదల చేయబడుతుంది, గొంతు వేగం పెరుగుతుంది మరియు శరీరం దౌర్జన్యం లేదా రక్షణ కోసం సిద్ధం అవుతుంది.
  emotion.surprised:
    label: షేక్
    summary: తలవైపు చూడని సమయంలో అచారణీయంగా ఆశ్చర్యపోవడం.
    info: ఆశ్చర్యం కొద్ది సేపు ఉండే ఒక విధమైన భావన ఇది. దీని లక్ఛణం గుండె తెరిచి నిలబడటం, బుడ్డిలు ఎత్తుకోవడం మరియు కళ్ళు విచ్చుకోవడం.
  emotion.tired:
    label: అలసిన
    summary: దృగ్విషయ లేదా మానసిక తీవ్రత నుండి బహిర్గతం కావడం, విశ్రాంతి పొందడం.
    info: అలసట దేహం విశ్రాంతి అవసరం ఉన్నట్లు చెబుతుంది. ఇది నిద్రగా ఉండటం, ప్రతిఫలనాలు ధీర్ఘం అయ్యేటట్లు చేయడం మరియు గమనించడం లో సామర్థ్యం తగ్గించడం లాంటి రూపంలో కనిపిస్తుంది.
