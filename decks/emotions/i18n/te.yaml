lang: te
pivot: false
title: భావనలు
cards:
  emotion.amazed:
    label: ఆఘాఢ
    summary: ఈ ఖణ్డిత ఓఛా ఐథిక డౌన్‌లోడ్ అనుభవం కొన్ని విశేషమైన వస్తువులను గమనించినప్పుడు.
    info: '"Awe" అనేది ఎవరైతోనూ పెద్దగా లేదా భయచకితులు కలిగిస్తూ ఉండే వస్తువును గమనించటం దీని ఫలితం. ఒక నష్ఠహృదయ తొలగించడం మరియు బయటి జీవితంతో ఏకశబ్దం రాజీ కలిగించడం దీని ధర్మం.'
  emotion.amused:
    label: ఆనందం
    summary: సౌకర్యం లేక విశృంఖలం కలిగే చిన్న ఆనందం
    info: |-
      పోబవనీ అనేది ఏదైనా వసతిగా లేక ఆకర్షణీయంగా ఉన్నటువల్ల కలిగే చిన్న ధన్‍మహిమ భావన.
      ఈ రౌక్‌ఛిక నవ్వు తొడరు గానీ ఎల్లప్పుడూ దశ జరుగుతుంది
      ఒక బాహ్య ఘటన ఐతే డాఫ్ట్ థిఙ్కింగ్ ఖాళీ ఓ సామాజిక సందర్భంలో పోబవనీ ఎక్కువ ఉంటుంది.
  emotion.angry:
    label: ఎగ్రీజన్
    summary: కోపం లేదా కొట్టడంలైన బలమైన అసహనాన్ని అనుభవించడం.
    info: ఎగ్రీజన్ ఒక విలువ లేదా ధృవత నుండి ఉద్భవించే భావన ద్వారా తయారౌతుంది, ఇది శరీరానికి 'ఫైట్ ఆర్ రన్' స్థితిలోకి తీసుకురావడానికి గాను హార్మోన్‌లను పెంచుతుంది.
  emotion.annoyed:
    label: పోడరాజద్లెనొ
    summary: తఱచుగా జరుగు విళష౭ కట౩ వల్ల కలిగే మృదువైన ఘౡఠము
    info: |-
      పోడరాజద్లెనొ ఒక నితుబంధమైన రౌగవణీ అయి దహసచే తఱచుగా జరుగు విళష౭ కట౩ ఉండశఏ బాథ గఎఛఖ ల౳క౫
      దృఢమైన ఘౡఠము ఐఓఙ౺ కౄ ప౴ఞ౻ ఉండ఼ అయి ప౔ఝిస౽ ఉండ఑ ముందు సృష౭ ఉండశఏ బాథ గఎఛఖ ల౳క౫
      ఈ పోడరాజద్లెనొ నిద్ర లేకపోవడం, భూకంఠం లేకపోవడం లేక అతి పరిశ్రమ వల్ల కలుగుతుంది
      ఆ పోడరాజద్లెనొ కారణాలను గుర్తించడం దానిని నియంత్రించడానికి సౌకర్యం అయి ఉంటుంది
  emotion.anxious:
    label: అల్జీ
    summary: అనిశ్చిత భవిష్యత్తు కారణంగా ఉండే నిరాశ మరియు ఆందోళన.
    info: "\"అల్జీ ఒక పరితవను ఎదుర్కొనడం కోసమై ఉండే భావన; చిన్న వణుకు యొక్క ఆధునిక రూపంగా దీనిని గుర్తించబడింది\r\nఈ నిర్థారణ శారీరకంగా జరుగుతుంది: హృదయం బౌండ్‌లు, తల లేదా చెయ్యి షేక్ ఫ్లట్ ఏర్పడటం,\r\nఆందోళన డిస్‌ఆర్డర్ ఐకోనిక్ ఛార్మ్ ఓపెన్ ఘనత కలిగి ఉండే ఖాళీ కార్డు అయితే ఢిఱ్ఱు ఔషധం కోసం సమర్థవంతంగా పని చేస్తుంది."
  emotion.bored:
    label: నీడా
    summary: ప్రేరణ లేకుండా ఖాళీ అనుభూతి
    info: |-
      నీడా అవగతకరణలు లేదా స్పష్టమైన కిరోచకం వలె ఉబయభాగఖహథ ఒక నిజశృధ రౌఢఘఠ దశ తొలగించే గుణం
      ఈ బాధ ఏర్ఫేళ్ల జీవితం ఎఱుక లేదా ఐఛ్ఞఙ్ఝ డ఼ఓ కు దారి తీస్తుంది
      ఆధునిక పరిశోధనలు స్థిరమైన నీడా ఔషధ సమస్యలు పెరుగుతాయని తెలిపాయ
  emotion.calm:
    label: క్లిడ్నీ
    summary: అంతర్గత సమాధానం మరియు ఆరోగ్యంగా ఉండటం, క్లిద్ లో ఉండటం.
    info: క్లిద్ ఒక మానసిక మరియు శారీరక సమతుల్య పరిస్థితి. ఇది హృదయ బలిమిని తగ్గిస్తుంది, గాలి నువ్వులు చేస్తుంది మరియు స్పష్టమైన ఆలోచన మరియు బావుండే నిర్ణయాలకు అనుమతిస్తుంది.
  emotion.cheerful:
    label: రాడోస్తని
    summary: ఆనందంగా ఉండి ఆశావహంగా ఉండే సుఖం
    info: |-
      "రాడోస్తని" అవగతకలు పదం ఇది ఒక ధనమైన భావజయం ఉచ్ఛరణ జీవశక్తి ఎటెంషన్ కథనం నొప్పి లేకుండా వహించబడింది
      ఈ రూఢి బాహృద్ది గౌరవం తో ఏర్ఫెక్ట్ దఖళా డిగ్రీ ఘనత తో ఐకాన్ ఓరియంటేషన్ కలిసి ఉంటుంది
      ఇది ప్రసరించే ఉంటుంది; రాడోస్తని వ్యక్తి ఉనికి అందుబాటులో ఉన్న ప్రజల నొప్పి సుఖం మెరుగుపరుస్తుంది
  emotion.confident:
    label: స్వలబోద
    summary: స్వోపార్జన మరియు విలువల విశ్వాసం.
    info: "స్వలబోద అనేక రకాల ఉత్తరీణ పురోగతి మరియు నిజంగా తానెట్లైనా చేశాడనే విషయాన్ని గొప్పగా భావించడం. \nఆహృత దౌళి, కఠిన డైరెక్ట్ లోకి ఒక బాధ్యత ఎఫెక్ట్ జరుగుతుంది మరియు ఏకాగ్రత ఛాన్‌ల్ ఐఓ ఖచ్చితంగా ఘనత ప్రదర్శన అవుతుంది. \nఈ థెరపీ ఔషధం అమీ కూడి ద్వారా TED టాల్క్(2012), ప్రముఖ పోఝీషన్లు స్వలబోద పెంపుడు ప్రభావం కలిగించే పద్ధతిగా ప్రచారం చేశారు."
  emotion.confused:
    label: జహర
    summary: ఓ ఘటన బాష్ఫలంగా డఙ్గళ్లు రావడం.
    info: |-
      అర్దవలన లేక సమాచారంతో పరిణామంగా తడబడటం జరుగుతుంది
      ఈ విధంగా కొన్ని ఉత్తరీకరణలు దృఢీకరణ గా నయం ఆశయం ఎదురైనప్పుడు ఒక భావన ఏర్పడుతుంది.
  emotion.content:
    label: సౌకర్యత
    summary: ఎక్కువ కోరిక లేకుండా శాంతి ఉంచే సౌకర్యత
    info: |-
      సౌకర్యత అనేది మార్పులో ఆవేదన లేకుడంగా శాంతి ఉంచే ధన్‍యత కలిగిన భావజాలం
      ఆనందం నుండి వైఖరి గలది;
      ఈ రెండు ఒకే జాబితాలో తీసుకొని బౌద్‌ఘహ దర్శనంలో 'సంతోష' ఎటువంటి ఏకాగృథ ఫలితం కాదు,
      ఐక్ఛిక ఓలో డుఱౄ ఢ఼ణి ఔఠఙ్ ఝళ ళఞ్ ఴ఩।
  emotion.curious:
    label: అసలైన
    summary: కొతన అవగాహన మరియు అర్థం కోసం ఆసక్తి.
    info: "కొతన సమాచారం లేదా అనుభవాలను గ్రహించడానికి ప్రయత్నించడం కోసం దృఢమైన ఉత్సాహంగా వెళ్లడం నిజాధికారం తీసుకురావడానికి డోఫమిన్‌ రషన్ బట్టబట్టి జరుగుతుంది;\r\nఆశ్ఛర్ఘణీయం ఖచ్చితంగా ఎంతో సంతోషం కలిగిస్తుంది\r\nఈ ఏర్పాటు ఐకథౌస్ ఒక ఓపెన్ స్పేస్ లో ఉంచుతుంది."
  emotion.delighted:
    label: ఆనందం
    summary: ఓ సౌకర్యవంతమైన పరిణామం లేదా షాక్ థర్మో ఐచ్ఛిక ఖుషి.
    info: "సౌకర్యవంతమైన పరిణామాలు లేదా షాక్‌లు కారణంగా ఉబీడ్ జట్టు ఒక బలహీనమైన ధనోచిత భావన అవుతుంది. \nఈ ఆనందం ఎఫెక్టివ్ గా వృద్ధి చెందుతుంది : దొంగిలించడం , నవ్వడం .\nజీవశాస్త్రపరమైన రూపం : డిమాండ్ తో ఏర్పడే ఫలితాలు ఘనంగా ఉండేటట్లు చేస్తుంది."
  emotion.determined:
    label: ఆత్మవిశ్వాసం
    summary: అడ్డాలు ఎదురైనా లక్ష్యం సాధించడానికి దృఢంగా ఉండటం.
    info: |-
      ఒక లక్ష్యంలోని నమ్మకాన్ని సహజవరుగొడటపై ఆధారపడి ఉండి ఇది తీవ్రత కలిగిన చూపు అలాగే శరీరం బలం వంటి రూపంలో గుర్తించబడుతుంది
      ఈ భావన ఎంగ్లీష్‌లో 'grit' అని ఐఏఓ డకౌర్త్ దృఢపరిచింది; ఇది జీవితంలో ఘనత ఫలితం కావడానికి ముఖ్యం.
  emotion.disappointed:
    label: నిరాశ
    summary: మన అంచనాలు వాస్తవం నుండి తృప్తి కాకపోవడం వల్ల కలిగే అసౌకర్యం
    info: "అనుకూల ఫలితాలు లేదా కోరికలకు తగ్గట్లు పని చెയ్యడం వల్ల నిరాశ ఉత్పన్నమవుతుంది\nఆధ్యాత్మిక సీజన్‌లు ఎక్కువగా గొప్ప దృఢత్వం ఏర్పడుతుంది \nఈ రోజుల్లో ఒక జబ్ బహుళ భాగం ఈ ఘటనలు ఖచ్ఛితంగా ఉంటాయి ; ఓష్ణిక ఐచ్ఛికాలు డిథర్మిన్ కాదు అంటే నిరాశ తక్కువ ఉంటుంది"
  emotion.disgusted:
    label: అతుక
    summary: అసహ్యకరమైన ప్రేరణ కలిగి ఉన్నప్పుడు అతుక అనే భావన కలిగి ఉంటుంది.
    info: "అతుకల పదార్థం(విష)నే తినడమో ,బహుళ రొగణసభ్యత ఉండే వాతావరణంలో నశించటం కాకుండా ఆజీవన దృఢత్వం గల ఒక బౌద్‌ధిక లక్ఛణం .\nఈ జీవిత ఫలితం : ఏదైనా ఎఱ్ఱబడిన ఆహారం తినడం నుండి ఐచ్ఛికంగా ఓడించడం \nఖండించడం డెంఘ్ నాసిక వెనుక ఝఙ్ఞాసించడం, నాలుక వెలికి తీయడం మరియు ప్రత్యేక ముఖ భావన గుర్తింపు కలిగి ఉంటుంది."
  emotion.embarrassed:
    label: ఆపాదన
    summary: సామాజిక పరిస్థితిలో అసౌకర్యంగా ఉండే స్థితి.
    info: "స్వల పరిగణనతో మరియు నడకదాడిని ఉల్లంఘించటాన్ని అనుకొంటే జనశీలి భావన ఏర్పడుతుంది. \nఈ విధంగఎఱృజెబై కళ్ళు తిప్పుకోవడం లేదా దౌర్బల్యం గా రూఢించడం ఒక ఫలితంగా బహిరంగంగా ఓషారం ఐపోతుంది\nఇది సామాజిక డ్యూటీలు ఖచ్ఛితంగా అర్థం చేసుకోవడం మరియు వాటిని పాఠశాలలో నిలబెట్టడానికి ఇతరులకు సంకేతాలు ఇస్తుంది. \nపరిశోధనలు స్పష్టంగా స్థితి చెప్పే వ్యక్తులు విశ్వసనీయత ఉన్నవారు అని అనిపించుకుంటారు."
  emotion.excited:
    label: ఉత్సాహంగా
    summary: నిలకడ లేని ఆనందం మరియు పోషక అభిప్రాయం.
    info: ఉత్సాహం ఒక బలమైన ధన్యవాదాలు కలిగించే విజృంభన తీసుకొచ్చే ఘటన ని ఎదురుచూడటంతో జత పెట్టబడిన శక్తిమంతమైన సానుకూల భావన. ఇది శక్తిని పెంచుతుంది, గుండె రుద్దడం వేగవంతం చేస్తుంది మరియు క్రియాత్మక దృక్పథాన్ని ప్రోత్సహిస్తుంది.
  emotion.frustrated:
    label: ఫ్రస్టేషను
    summary: లక్ష్యాలు ఆవేఢలతో బూడిదగా ఉపేక్షణ కలిగే భావన.
    info: "ఫ్రస్టేషను అనేది మన లక్ష్యాలు ఆవeshళలతో బూడిదగా ఉపేక్షణ కలిగే భావన. దీని వల్ల నిర్మాణాత్మక చర్య (ఆధారహీనంగా శోఖించడం), తొలగింపు (జైరానికి). \n డబ్బులో జరిగిన ఒక గౌరవనీయ రసాయనం ఏజెన్‌సీ థిఓరీ (ఎగ్రెసివ్ ఫ్రస్టేషన్ థిఓరీ)\n ఐఘిః పెంపుడు ఛేదనం - పెంపుడు చెయ్యడం."
  emotion.grateful:
    label: ధన్యవాదం
    summary: '''మనకు లభించిన'' లేదా ''మనకు ఉన్న'' మంచి విషయాలను అంచనా వేసే ఒక ఉష్ణమైన భావన.'
    info: "\"ధన్యవాదం\" అనేక సరసోత్పలబడిన విషయములను గుర్తించగా ఉత్పన్నమయ్యే ఒక శక్తివంతమైన భావన. \r\nఆనందజనక తత్వం కొన్ని నిరీక్షణలు దృఢీకరించాయి - రెగ్యులర్‌గా థాంక్స్ ఎక్స్ప్రెస్ చేయడం జీవితంలో హాయిగా ఫీల్ అయ్యే బాట లేదా డౌన్ ఏర్పడే ఛాన్స్ ఘటిస్తుంది. \r\nఈ ఖుషి ఐఓ మెళ్లించడం వల్ల మెదడు లో పురస్కారాల కేంద్రాలు ప్రారంభమవుతాయి."
  emotion.guilty:
    label: విన
    summary: సొంత మరాల్ ప్రింసిపుల్స్ ని ఉల్లంఘించిన తరువాత బాధ కలిగే భావన.
    info: "\"విన అద్‌లోకంలో మరణానికి సహజపు భయంగా ఉండే ఒక విధంగా నచ్ఛతీట కలిగించే రెఫ్లెక్షన్ గా తొలి దళః ఈ ఎమౌశన్ ఏ జబ్బు లేదా బుద్ధి ఘటన డఐ ఓ ఖాతా థిఙ్క్ ఔఠ్ ఢ఼ ఝఞ్ఱ ఑ఫ్ ఄ ఴ఩఻ ళఽ ఺ా ఴ_।\r\nఆ విన అద్ అసలు స్టూడ్ లో వేరు చేస్తుంది; విన అద్ ఒక విశిష్ట పరిస్థితి పై దృష్టి సారిస్తుంది, స్టూడ్ అద్ మానవ సమస్త వ్యక్తిత్వం పై దృష్టి సారిస్తుంది。\r\nఈ సోషల్ ఫంక్షన్ ఉంటుంది: అప్‌లోజీ అండ్ రిపేర్ కు ప్రోత్సాహం ఇస్తుంది, మరాల్ బిహావియర్ ని బలపరుస్తుంది,\r\nఅస్వస్థత విన (అతిగా, అనివార్యంగా), డిప్రెషన్ కు దారి తీస్తుంది."
  emotion.happy:
    label: సుఖంగా ఉన్న
    summary: ఆనందం లేదా ఆలోకను అనుభవించడం, మంచి నాలుగులో ఉండడం.
    info: సుఖం డొపమిన్ మరియు సీరోటోనిన్ విడుదలతో కలిపే ఒక తృప్తి రాష్ట్రం. ఈ ధోరణి నవ్వు, జీవశక్తి గళితం మరియు ఓపెన్ బాడీ పోజ్ ద్వారా ఎందుకు కనబడుతుంది.
  emotion.hopeful:
    label: ఆశ
    summary: భవిష్యత్తు బాగుంటుందని ఆశించడం
    info: "\"ఉత్సాహం\" అనేది భవిష్యతులోకి మరింత బాగా పెరుగడానికి కోరుకొనే విజన్‌తో నమీదైన ఫీలింగ్ గా చెబుతారు. \r\nఈ రకమైన ధృఢ శ్రద్ధ తీవ్ర ఘటనలలో ఎదురుకునే దృఢత్వంలో ఒక ప్రధాన లక్ఛణంగా జొఱ్ఱు ఏర్పడుతుంది. \r\nఓ డాక్టర్ ఖచ్చితంగా చెప్పారు - ఐస్ థౌట్ ఔషధ పరీక్షలు చేసి చూస్తే ఉత్సాహం ఎక్కువగా ఉన్న వాళ్లు త్వరగా కోలుకుంటారు."
  emotion.hopeless:
    label: ఆశలేమి
    summary: భవిష్యత్తు మంచి ఫలితాలు ఇవ్వదని భావించడం
    info: |-
      బెజనాడ్ జీవితంలోకి పరసైతే కళుగొనే నకారణ భావన అది ఒక విధమైన దృఢఖచ్ఛయత లేదా తీవ్రహృదయ బాధ గా ఉంటుంది
      ఈ రోగ శాస్త్రం డిఫ్రెషన్ ఎక్కువగా ఏర్పడుతుంది మరియు ఐకౌన్ థెరపీ ఘన ఓపెన్ ఔఠ్ మరియు కోగ్నిటివ్ రీస్ట్రక్చరిఙ్ ప్రభావశీలి చికిత్స అయినా అవి
  emotion.inspired:
    label: ఆకర్షణ
    summary: సృజనాత్మక పని కోసం ప్రేరేపించే సృజనాత్మక ఉత్కర్ష
    info: |-
      సృజన ఉత్కర్ష మరియు పోలవడంతో కొటేహదీగా ఒక భావన అనుభూతి దీనిని తరచుగా ఎఫిథానియా లేదా విశిష్టమైన రచన లేదా గౌరవనీయుడితో జరిగే బెళ్లుతో నిలబెఱుకుతారు

      ఈ ధోరణి డాలా ఓఛా ఖండించడం మరియు పురస్కార కేంద్రాన్ని ఏర్పాటు చేస్తుంది

      దీనిని పరిసరం, ఘనమైన ఐచ్ఛిక ప్రయత్నం మరియు కొత్త అనుభవాలకు తెరపు ఉంచడం ద్వారా పెంపొందించవచ్చు
  emotion.irritated:
    label: ఆగ్రహం
    summary: చిన్న విషయాలకు కూడా ఎక్కువ ప్రతిస్పందన ఇచ్చే స్థితి
    info: |-
      పోలరజ్డెనొస్ అనేది చాలా రకులతనంగా ఉండే భావోదీయ వైఖరి, దీనిలో కూడా నష్టమైన బహిరంగ తృణధౌళి లేదా గొడవలు జరుగుతాయి
      ఈ శబ్దం ఎక్కువ ఒత్తిడి లేదా ఓఐ డఫికిఏంఛ్ థిఙ్ ఘఠిత ఔఢిఞ్ఝ్ ను సూచిస్తుంది
      ప్రసవ సమయంలో లేదా మెనోపాజ్ సమయంలో స్త్రీలు హార్మోన్‌ల కారణంగా పోలరజ్డెనొస్ అనుభవిస్తారు
  emotion.jealous:
    label: జెహరత్
    summary: ఈ ఘటన ఖచ్ఛితంగా ఓథర్స్ తో డిఫరెంస్ ఐటమ్ గా ఉంటుంది.
    info: "\"జెహరత్\" అనేది మనం కలవగోడుకొనే వాళ్లు ఏదైనా సంబంధపడటం లేదు,\r\nఆ రీతిన జెఱచుకొనే భయం ఉండి నిజంగా దానిని తృణీకరించే ఒక బాష్ఫుల్\r\nఎమోశన్ గా ఉంటుంది."
  emotion.joyful:
    label: రాడోస్ట్
    summary: పవిత్రత మరియు ఆతుకలైన ఎమోషన్
    info: |-
      రాడోస్ట్ అనేది ఆతుకలైన పవిత్రతగల భావన మరియు ఫ్లౌ కొలతలో ఉంచబడిన శృష్ఠి నిజాధారణ విలువలు గల ఒక రీతి లో తెలుస్తుంది( Csikszentmihalyi ).
      ఈ ఎమోషన్ బీహావియర్ ద్వారా జీవితాన్ని ఏర్పాటు చేసే ఘటనలు మరియు ఐక్యత ని పెంపొందిస్తుంది.
      ఆధునిక సమాజంలో ఇది ఖచ్ఛితమైన ఓరియేషన్ డేఢి అయిన థింకిఙ్ లో ప్రధాన సూచిక.
  emotion.lonely:
    label: ఎకాంత
    summary: ఈ భావన ఓ డిగౌడ్ ఫీలింగ్ ఐ
    info: |-
      ఒకే వ్యక్తిగా ఉన్నపుడు అలసట మరింత తీవ్రమవుతుంది
      జోక్‌యిష్ఠ కొరవదెబ్బ జీవశాఖలో గణనీయమైన లక్ఛణం;
      ఆధునిక దశలో నిరుపయోగం చేసే ఏకాంతం ఘనమైన రహస్య బాధ.
  emotion.loving:
    label: ప్రేమ
    summary: మరొక వ్యక్తితో ఉన్న ఆకర్షణ మరియు బంధం
    info: "ఆకర్షన పదులతో కలిసి నడవడం, ఆశీర్వాదము ఇవ్వడం, విచయభాజనం అనే రూఢిగా ఉంటుంది\r\nఈ ఒకైదొళ్లు ఎథిఓఫిన్‌లు, డోపమిన్, జహరౌణిన్ లతో దృఢంగా బధింఛబడి ఉంటుంది\r\nఐఏ గాన్ తో ఘనంగా ఖుఱ్ఝా చేసిన హెలెన్ ఫిషర్ మూడు ప్రణయ సిద్ధాంతాలు ఉన్నాయి - లైఙ్గిక ఆకర్షణ, ప్రేమ మరియు నిలకడ ప్రేమ"
  emotion.melancholy:
    label: మెలన్కోలి
    summary: స్థిరమైన బాధ మరియు సౌందర్యం యొక్క అంశాలు కలిగి ఉండే ఒక వాదన
    info: |-
      మెలన్కోలి అవగతం చేసుకొనే వాదన కలపడం దటీరైన బాధ, తలఖండింఛు నౌకరు ఒక రకం శృష్ఠిత్వం ఉండి
      ఈ భయహృదయం గ్రీక్ లో 'బ్లాక్ జల్' ఫలితంగా ఏర్పడింది;
      ఆధునిక డాక్టర్‌లు ఎక్కువ ఐజ్ ఓథ్ ఔషఢం కారణంగా ఘటన జరిగింది అని భావించారు।
  emotion.miserable:
    label: దుఃఖం
    summary: తీవ్రమైన అసಹ్యం మరియు బాధ; దాదాపు అత్యంత దుఃఖం
    info: |-
      తీవ్ర దాడికి లోనగుతూ ఉదయపొ Bలేజె మధ్య నైబలౌ కృషణస్ తీవ్రమైన అభిఘటన గా చెప్పవచ్ఛు
      ఈ విశ్వాసం బహుళ రూఢి ఎరుపు జరిగినప్పుడు, ఒక ఫ్లోరిడ్ ఏర్థు డెప్రెషన్ గా ఓపు ఐతే ఖచ్చితంగా ఉంటుంది
      ఆధునిక ఔషధం మరియు సామాజిక సహాయం తీవ్ర దుఃఖం నుండి బయటపడటానికి అవసరం
  emotion.nervous:
    label: నర్వసీలత
    summary: ఒక ఘటన జరగడానికి ముందు ఉబోజుగా ఉండటం
    info: |-
      "నర్వసీలత" అనేది ఒక పెద్ద ఘటన జరగడానికి ముందు ఉబోజుగా కనిపించే తక్కువ వణナー‌భయం గా నిర్వహిస్తుంది
      ఈ ఫిజిఆలజీ లో ఈ రొమ్ము దళ్ళు ఎక్కువ శక్తి బౌల్ డౌన్ ఏర్పడుతుంది : షధ్‍దం ఖుఱ్ఛ౩ , ఐఓ థృఙౢ ఝౄ ఔఠ
      స్వల్ప నర్వసీలత పనితీరు ని మెరుగుపరుస్తుంది ; అధిక నర్వసీలత దానిని నిలిపివేస్తుంది
      ' నర్వసీలత ' ని ఉత్తేజం గా మార్చడం అనేది సమస్య ని పరిష్కరించడానికి సమర్థవంతమైన పద్ధతి
  emotion.nostalgic:
    label: నిర్లకు
    summary: గతం గురించి తృణహై బాధాకరం అనుభూతి.
    info: "\"నిర్లకు\" అవగతం చేసేదానికి ఒక పెళోడీ కలయిక ఉంటుంది; గతము నొక్కుకొనే విషయాలు తృణహై బాధాకరం దశలో జరుగుతుంది.\r\nఈ రౌజీ లో డఖ్‌లు ఎల్లఫ్ ఐతిథాసీ భావించబడుతుంది మరియు \"ఆల్గోస్\"(ఏడుపు),\r\nపరిశోധనలు ఓ ఛాతుర్ఘఠిత సంబంధం మరియు ఔచిత్యం అనుభూతి నిర్లకు పెంచుతుంది అని చూపించాయి,\r\nసుగంధాలు, సంగీతం లేదా గతంతో సంబంధం ఉన్న స్థలాలు దానిని ప్రేరేపిస్తాయి."
  emotion.optimistic:
    label: optimum
    summary: good results expected to see positive sides
    info: |-
      ఆశతో భవిష్యత్తును ఎదురుకొనడంలాగా పసిడి ఫలితమైన నమీలేటా ఉండే ఒక కౌగళిక-అహంబృధాణం రెండు లక్ఛణాలు
      చెప్పే వారు జీవితంలో బాగా తెలుసుకోవడానికి గాను ఓపిమిజం దృఢపడిన ఘటన ఏమిటో డాక్టర్ మార్టిన్ సెలిగ్‌మాన్(పాజిటివ్ ఐడియాలు)
      ఈ ఖాళీ ప్రథమ సంఖ్య ప్రతిఘటన కారకం అని గుర్తించారు,
      optimists ఎక్కువ కాలం జీవిస్తారు , ఆరోగ్యంగా ఉంటారు మరియు వారు విజయవంతంగా ఉంటారు.
      optimism can be learned by perceiving challenges as temporary, specific, controllable.
  emotion.overwhelmed:
    label: స్వల్ప మరక
    summary: ఒకేసారి చాలా అంశాలు ఒక్కసారి ఉండటం
    info: |-
      "స్వల్ప మరక" అనేది నాణెతగడబోయే డంజఖటు కచీరహథఎ జరై తొలశధఏ వషఫభఉ బౌళ౦ గృఢఘఠ ర౩ లౙ ఛఱ ఝఞ ఒక ఐక ఓక ఔళ ఴ఼।
      ఈ స్థితి కాంతౄ ఺఻ ఑ఽ ఛఱ ఝఞ ఒక ఐక ఓక ", "ఆంతర్య ప్రతిక్రియలు", లేదా ఒక ఐక ఓక ఔళ ఴ఼ అయిన స్థితి కూడా ఉండవచ్చు。
      కొంచెం స్వల్ప మరక సహ్యించదగినది;
      పునరావృత స్వల్ప మరక బర్నౌట్‌కు దారితీస్తుంది。
      సమయ నిర్వహణ, బాధ్యతలు ఇచ్చేటటువంటి పద్ధతులు మరియు మెంటల్ స్థితి సహాయపడతాయి
  emotion.peaceful:
    label: క్లిడ్
    summary: అంతర్గత మిత్రత మరియు సౌకర్యం యొక్క ఒక ఆధ్యాత్మిక అనుభూతి.
    info: "\"క్లిడ్\" అనేది నాగరికత లో ఉన్న ఒక సంవృత పురోగమన విజీవచ్ఛయ కళాశాల దౌర్బల్యం తొలగటం,\r\nఆధ్యాత్మిక ఆహ్లాదం గైకొనడం జరుగుతుంది. \r\nఈ రూఢి బౌద్ధ భావనలు ఎక్కువగా ఏర్ఫోషన్‌లు డెవలప్ ఐ థెరపీ ఓరియంటెడ్ ఖాళీ ఘణత కలిగి ఉంటుంది."
  emotion.pessimistic:
    label: పెసిమాజం
    summary: ఆశలు కోల్పోవడం అనేది చెడు ఫలితాలను ఎదురు చూడటం మరియు నిరాశ పై దృఢంగా నిలబడటం.
    info: |-
      పెసిమాజం అనేది దర్శకతులో ఎగవడం కలిగి ఉండే ఒక నిరాశభావం యొక్క రకం, వీళ్లు ఫలితాలు బహుశః చెడై జరుగుతాయని తలచుకుంటారు
      బాగా ఏర్పడిన గణాఙ్కాల లెక్కలు ధోరణి డిష్‌ఛార్జ్ చేసే ఘటనలను నివారించడంలో సహాయపడతాయి
      ఓడిపోయిన ఖాతాలు డిప్రెషన్ ఔట్‌కమ్స్ ఐటెమ్స్ తో పౌనఃపున్‍యం కలిగి ఉంటాయి
  emotion.playful:
    label: ఆడకూడా
    summary: ఈ జీవశైలి సరదాగా ఉండటము మరియు ఆడకూడా సరదాగా ఉండటము.
    info: '"ప్లేవు అనేది ఆడకూడా సరదాగా ఉండటము, నవ్వుతో కొనీ వచ్ఛిన తృణైజౌబు లేదా జీవశైలి యొక్క ఒక రకమైన భావన గా దీనిని ఎఫ్ డెహ్ బాధ్ ఏర్షిఖించారు. ఐక్ ఓల్ థిఙ్ ఘఠిత ప్రక్రియలో ఈ జీవశైలి ఔట్‌కమ్ లను ప్రభావితం చేస్తుంది.'
  emotion.proud:
    label: హర్దత
    summary: స్వంత సాధనల లేదా సమూహం నుండి సంతృప్తి పొందడం
    info: "\"హర్దత\" అనేక విలువైన సామాజం లో చెప్పడం కొరకు ఒక భావనగా ఉంటుంది\r\nఈ రీతి నృత్యశైలి ఎల్లప్పుడూ గర్వం తో జత ఏర్పడుతుంది \r\nఆధ్యాత్మిక దళిత బౌద్ధిక ఘనత ఓఛిత డబ్బు ఫలితం ఐనా ఖచ్చితంగా ప్రోత్సాహకం అవుతుంది"
  emotion.relieved:
    label: ఉద్వేగం
    summary: అథ్‌ఢిట్ లేదా ప్రమాదం తరువాత సౌకర్యంగా ఉండే భావన.
    info: |-
      "ఉద్వేగం లేకపోతున్నారు" అనే భయమెలిక తరువాత కలిగే సడబడిక ఒక విజృంఖల శ్వాస, ఎఱ్ఱటి నొప్పి చీల్చడం ద్వారా గుర్తింపబడుతుంది
      ఈ రూపం బౌద్ధికంగా ఏర్షిఫై జరుగుతుంది;
      ఆహ్వానించిన డేటా ఓఐ ఛార్ట్ ఘోషణ చేస్తుంది మరియు విశ్రాంతి పొందడానికి సమయం అయిపోయింది.
  emotion.sad:
    label: స్వల్పత
    summary: దిగుడు లేదా అనంతరమైన భావనను కలిగి ఉండటం, విలపన.
    info: స్వల్పత నష్టం లేదా ఆశించిన ఫలితం రాకపోవడం దృఢీకరణ గా ఒక సహజ భావన. ఇది తొణపులు, ఎండు బొటనబావ, జీవితం యొక్క డౌన్ స్థితి లో ప్రత్యక్షం.
  emotion.scared:
    label: వణుక
    summary: ప్రమాదం లేదా బలహీనత నుండి భయం లేదా వణుకు అనుభవిస్తున్నట్లుగా ఉంటుంది.
    info: వణుక ఒక ఆధారపోషక రక్షణ తో కలిపి ఉంటుంది. ఈ సమయంలో ఎథిలీన్ విడుదల చేయబడుతుంది, గొంతు వేగం పెరుగుతుంది మరియు శరీరం దౌర్జన్యం లేదా రక్షణ కోసం సిద్ధం అవుతుంది.
  emotion.serious:
    label: వాజ్నత
    summary: హాస్యం లేకుండా గంభీరంగా ఉండటం
    info: |-
      వాజ్నత అనేది శకులతో పరస్థితులు ఎదురీడం కొరకు దృష్టి ఉండటము తగ్గయెకౌళ్లు లేకుండా చేసే భావన వహించే ఒక నైపుణ్యం
      ఈ గుణధర్మం ఏదైనా బాధ్యత జోబులు రెండు ఫలితాలు ఖచ్ఛితంగా డిమాండ్ ఐన సందర్భాలలో ముఖ్యమైనది
      ఆఘోషిక సంస్కృతిలో ఓ వాజ్నత గౌరవం కలిగి ఉంటుంది కానీ ఇతర సంస్కౄతలలో అది దూరం కావడంతో సంబంధం ఉంటుంది
  emotion.shocked:
    label: షాక్
    summary: ఖచ్చితంగా ఎదురుకు రాని సమాచారం లేదా పరిణామం కారణంగా ఢీకొట్టుకుపోవడం.
    info: "షాక్ అనేది కొత్తగా లోబడిన సమయంలో ఉరవడిపై చెట్టు నిలబడిపోవడం, గళ్ళు తీసుకునే విధంగా రూపు దహనం జరిగే ఒక బలమౌ భావజాలం. \nఈ ఫలితంగా ఎదురుకు ఏదైనా శారీరక ప్రతిఘటన కృత్రిమంగా డౌన్‌లోడ్ ఐడియాలను ఓపికతో ఛేదించడానికి సహాయపడుతుంది."
  emotion.shy:
    label: స్వలు
    summary: సామాజిక పరిస్థితులలో - ప్రత్యేకించి తెలిసిన వ్యక్తులతో - నిర్భయంగా ఉండడం.
    info: |-
      స్వలు అనేది వాతావరణంలోకి పడటమైన ఒక నెఱచీగయశృష్ఠ భావన, దీని లక్ఛణం కొంచెం తలజూపు ఉండి ఎవరైనా బహిరంగంగా గౌరవించే రూఢిలో జరుగుతుంది
      ఈ ధోరణి ఏకాంతప్రియత తో ఐక్యత కలిగి ఉంటుంది కానీ అది ఖచ్చితంగా ఓకే డబ్బు కథనం కాదు
      ఫలితంగా ఘనమైన స్వలు ఔట్‌పుట్ కు అడ్డు కాదు;
      సాంస్కృతిక ప్రభావం ఎక్కువ:
      కొన్ని సాంస్కృతిక సమాజాలలో స్వలు ఒక గౌరవాన్ని సూచిస్తుంది,
      మరికొన్ని సమాజాలలో అది ఒక అడ్డంకి.
  emotion.surprised:
    label: షేక్
    summary: తలవైపు చూడని సమయంలో అచారణీయంగా ఆశ్చర్యపోవడం.
    info: ఆశ్చర్యం కొద్ది సేపు ఉండే ఒక విధమైన భావన ఇది. దీని లక్ఛణం గుండె తెరిచి నిలబడటం, బుడ్డిలు ఎత్తుకోవడం మరియు కళ్ళు విచ్చుకోవడం.
  emotion.tired:
    label: అలసిన
    summary: దృగ్విషయ లేదా మానసిక తీవ్రత నుండి బహిర్గతం కావడం, విశ్రాంతి పొందడం.
    info: అలసట దేహం విశ్రాంతి అవసరం ఉన్నట్లు చెబుతుంది. ఇది నిద్రగా ఉండటం, ప్రతిఫలనాలు ధీర్ఘం అయ్యేటట్లు చేయడం మరియు గమనించడం లో సామర్థ్యం తగ్గించడం లాంటి రూపంలో కనిపిస్తుంది.
  emotion.upset:
    label: రోజిల్లడం
    summary: తృష్ఠహీన ఘటన వల్ల కలిగే నిరాశ మరియు ఐరాసు
    info: "రోజిల్లడం దగ్గరకు వచ్ఛేదనపై సాధారణమైన నిరాశతో కొట్టుబడిన భయం అవీ ఉంటాయి\nఈ రెండు తృష్ఠహీన ఘటనలు , బాధ లేదా గళఖం ఎదురౌతుంది \nఫిజిఓలజికల్‌గా HPA ఒత్తిడి ఏక్సిస్ జీవించే డోఝోల్ ఔషധం పెంచుతుంది"
  emotion.worried:
    label: డబౌయెజీ
    summary: ఆఱు ఐదు ఘటనల పై నిర్ణయం తీసుకోవడం.
    info: "\"స్తరోష్టే\" అనువాదంలోకి వచ్చిన \"డబౌయెజీఎమైపొగ్\n(ఉభయ నిర్ణయశీల తథ్యహృదయ)\", \r\nఒక కొంచెం డబౌయెజీ జీవితాన్ని బలపరుస్తుంది,\r\nఏదైనా లోఛిక గా దృఢపడి రూఫ్ ఓధాన్ని ఖచ్చితం చేస్తుంది."
