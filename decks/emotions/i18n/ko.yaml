lang: ko
pivot: false
title: 감정
cards:
  emotion.angry:
    label: 화난
    summary: 강한 불쾌감이나 분노를 느끼거나 화가 난 상태이다.
    info: 분노는 인지된 부당함 또는 위협에 대한 반응으로서의 감정이며 심박수를 증가시키고 몸을 '싸우거나 도망치기'로 대처하도록 준비시킨다.
  emotion.calm:
    label: 안정된
    summary: 내면의 평화와 안정을 느끼고 편안함 속에서 머무르다.
    info: 안정은 정신적이고 육체적인 균형 상태를 의미합니다. 심장 박동이 느려지고 호흡이 깊어지며 명확한 사고와 올바른 판단이 가능해집니다.
  emotion.excited:
    label: 흥분된
    summary: 강한 흥분과 기쁜 예상감을 느끼다.
    info: 흥분은 즐거운 사건의 예고와 연결된 강렬한 긍정적 감정이다. 에너지를 높이고 심장 박동을 가속화하며 창의적인 사고를 촉진한다.
  emotion.happy:
    label: 행복한
    summary: 기쁨이나 즐거움을 느끼거나 좋은 기분이다.
    info: 행복은 도파민과 세로토닌이 방출되는 쾌悅감으로 연결된 감정입니다. 웃는 얼굴, 생동적인 제스처 그리고 열린 자세 등으로 표현됩니다.
  emotion.sad:
    label: 슬프다
    summary: 애도하거나 불만족스러움을 느끼거나 우울 상태에 빠지다.
    info: 슬픔은 상실이나 실망으로 인한 자연적인 감정 반응이다. 눈물, 입꼬리가 아래로 향하는 표정과 무기력한 자세 등이 그 특징이다.
  emotion.scared:
    label: 두려운
    summary: 위험이나 위협으로부터 두려움이나 공포를 느끼다.
    info: 공포는 기본적인 방어적 감정이다. 이 감정은 아드레날린 분비를 유발하고 심장을 빠르게 하며 몸을 도망하거나 보호하는 준비 상태로 만든다.
  emotion.surprised:
    label: 놀란
    summary: 예기치 못한 일에 대해 갑작스러운 놀라움을 느끼다.
    info: 놀람은 수초 동안 지속되는 매우 짧은 감정이다. 입이 벌어지고 눈썹이 올라가며 아이리스가 확장된 상태로 표현된다.
  emotion.tired:
    label: 피곤한
    summary: 신체적 또는 정신적인 피로를 느끼고 휴식이 필요하다.
    info: 피로는 몸이 쉬어야 한다는 신호입니다. 졸림, 반응 속도 저하 및 집중력 감소 등의 증상으로 나타납니다.
