lang: eo
pivot: false
title: Emocioj
cards:
  emotion.amazed:
    label: admiro
    summary: Pozitivo surprizanta sentimento dum interagado per ion eksterordinaran.
    info: Awe estas intensiva emo kiu ekestas dum renkontado kun io grandega aŭ impresiga. Ĝi malpligrandigas la senton pri propra graveco kaj plibonis konatancon al cirkonstancoj.
  emotion.amused:
    label: amuzemo
    summary: Mola agrabla senton da plezuro aŭ distreko.
    info: Amuzado estas mola poziiva emo cagita de io ridinda aŭ interesa. Ĝi diferenciĝas de riso – riso temas pri rezultato el amuzemo sed ne ĉiu amuzebleco kondukas al rido. Amusemo ankaŭ estas socie partoprenata emo; ni trovas ion pli rigindajn dum ili estos kun aliaj.
  emotion.angry:
    label: kolerema
    summary: Sentu fortan malplaĉecon aŭ koleron estante enragita.
    info: Rage estas emo kiam oni respondecas al percepcio de maleĝo aŭ minaco. Ĝi pligrandigas la pulson kaj preparas korpa respondon "pugnu aŭ fluku."
  emotion.annoyed:
    label: ireco
    summary: Malpli grava sento pri kolero farata per ripeta malebla stimuli.
    info: Ireco estas malfacila emo kaŭzita de ripetiĝanta malagrabla stimulo. Ĝi ofte antaŭas pli fortranĉantan koleron. Iam povas esti pro manko da dormo, famego aŭ superkargado.
  emotion.anxious:
    label: timemo
    summary: Neagrabeco pro neregula agado kaj konflikto kun negativa futuro.
    info: Timemo estas emo antaŭvidanta danĝeron; malpli grava timemo povas esti adapta kaj plibonigi efikecon. Ĝia fizika esprimo inkluzivas rapidan pulson, suadatan korpon, mallongan spirmon kaj tensigitajn muskolojn. Timemopatroco estas plej oftaj psikologia malsano kiu afektas super tricentmil homoj en la mondo.
  emotion.bored:
    label: senintereso
    summary: Senton de senatenteco kun malplena interno kiam ekzistas nenio por fari.
    info: Enemo estas negativa emocio kaŭzita per manko da stimuloj aŭ signifaj agoj. Ĝi povas konduki al serĉo pri novaĵoj aŭ kreiva pensado. El la perspektivo de evoluo tiun impulson oni rigardis pro ŝanĝokaptado.
  emotion.calm:
    label: kala
    summary: Sent'i internan pacon kaj konfortecon estanti en ripozo.
    info: Paco estas stato da psikologia kaj fizika ekvilibro. Ĝi malrapidigas la korbradon, profundigas spirmon kaj permesas klare pensadi kaj bone decidi.
  emotion.cheerful:
    label: glezeco
    summary: Bonkaptado kun feliĉecon kaj optimismo.
    info: Glezo estas pozitiva emacia stato karakterizita per aktiveco kaj bonhumoro. Ĝi rilatas al eksterturna persono kaj alta grado de pozitivo emo.Ĝi disvastiĝas facile; la proksimeco de gaje homo plibonigas la humorton en sia najbarojdo.
  emotion.confident:
    label: konfidiro
    summary: Fido pri viaj kapaboj.
    info: Aŭtonomio estas emocio de fido al siaj kapabloj kaj jukto. Redekla rigardo en la okulojn, rektuma posturo kaj ĉiela voĉo montras autonmion. Amy Cuddi popolarigis potencajn pòzadojn por pligrandiĝigi sian konfidenton.
  emotion.confused:
    label: konfuseco
    summary: Sentemo pri malcerteco rilate iun temon.
    info: Konfuzo okazas dum ni mankas la bezona senco aŭ scio por pridiskuti unu konkreton. Ĝi estas naturo en lernado - kognitive diskordaj impresojn alproksimiĝas respondoj serĉante klarigon de problemoj. Konfuza esprimeto montriĝas per turninta kapo kaj fronto plirektigita.
  emotion.content:
    label: kontento
    summary: Trankaŭla interna pacemo kun nenia dezirado plenumigi.
    info: Satisfakto estas trankvilaj positiva emocio sen bezono de ŝanĝo. Ĝi diferenciigas sin per feliĉeco – satisfako restas en paco dum la felicito donacas energiojn al vi. La buddhismo rigardas kontentemon (satosho) por estanta grava virtuo sur vojo al iluminacio.
  emotion.curious:
    label: kuriozo
    summary: Desireco trovi sciigon.
    info: Kuriozo estas motivanta stato kiu komencigas serĉadon de novaĵoj kaj vivantaj spertoj. Ĝi rilatas al la sistema reprezentado per dopamine pri ricevi placenton dum lernado. Kurioza persono volonte esploras noutaĵojn por akiri scion.
  emotion.delighted:
    label: eksalto
    summary: Intensa plaĉo elagrada evento aŭ surprizo.
    info: Ekstazo estas intensa poziiva emo kaŭzita per agrabaj okazoj aŭ surprizoj. Ĝi plenumas la evoluan rolon de fortiĝigo da konduto kondukanta al dezirindaj rezultatoj.
  emotion.determined:
    label: resoluceco
    summary: Pova dezirpunkto por atingi objektivo malgraŭ obstakloj.
    info: Resolucio estas motivita emocio konsiderata per fokusiĝo al celo kun persistemo. Ĝi montriĝas en malsemajgaj dentoj, tensigitaj korpo kaj intensa rigardo. Resoluceco rilatas proksime al la koncepto de 'grit' (laŭ Angela Duckworth), kiun formigas amaso kaj daŭrigado.
  emotion.disappointed:
    label: malsatisfilo
    summary: Neagrabema sento pro tio ke realeco ne respondigas niajn atendojn.
    info: Malsatifo okazuas dum rezulto malkongruas kun atendado aŭ dezirato. Ĝi estas pli forta se oni eldonis multe da emociojn aŭ laboron en la situacio. Esploro montras ke esceptoj havas gravan rolon – malaltaj esperoj kondukas al mallonga malsatifeco.
  emotion.disgusted:
    label: nekancec
    summary: Forta sento da repulso dum renkontigo kun maleblaj stimulo.
    info: Nekanceco estas baza emo protektanta nin de damaĝaj aferoj (toksigaj manĝaĵoj, malsanecoj). Evolua funkcio konsistas en malatragado el uzo de korumpita nutrojmaterialo. Ĝia manifestiĝas per frapigado la naso, lingvo eksteren kaj karakteriza esprimo.
  emotion.embarrassed:
    label: honto
    summary: Neagrabla sentimento en socio pro hontaĵoj.
    info: Hontemo estas socia emo kiun ni sentas dum ni pensas ke rompis la samsocii regulojn. Ĝin montras rubro de la vangoj, forturno da naskapto kaj malforta pozicio.Ĝi havas socian taskon - signali al aliaj nin memoradas pri tio kion oni devus fari kaj volontecon sekvi tiun.
  emotion.excited:
    label: entuziasmite
    summary: Sent'i fortan entu'zman kon'e plezurem ekspetkon.
    info: Ekzaltemo estas intensa poziiva emo ligita al atendado de agrabla okazo. Ĝi pligrandigas la energion, akcelas koron kaj helpas krea maniero pensi.
  emotion.frustrated:
    label: Frustumeco
    summary: Sentoregardo por malfacileco plenumi donitan taskon.
    info: La frustriĝo estas emo kiun ni sentas dum ŝanĝiĝadas per baroj al niaj celoj. Ĝi povas rezulti en agado kun efikeco (serĉante alternativecon), sed ankaŭ ebligas malbonajn reagojn ekzemple atakon. La Frustra-Agresiva Teorio estis grava psikologia instruo dum la dua duono da dudeko de lasta jarcento.
  emotion.grateful:
    label: gratulu
    summary: Kalka sentimento rilate aprezadon pri io bone ricevitaj.
    info: Gratulo estas poziiva emo kiun ni sentas dum ni rimarkigxas pri la bono en via vivo. Esploroj montras ke regula esprimado de gratulon pliigas kontentigon per vivanta aktivigo simil al fizika plezuro. Skribadi taglibron kun dankemojn temas unu el efektiveco tekniko por meliorigi sian humoron.
  emotion.guilty:
    label: vinuo
    summary: Dolora senco sekvas rompon al viajn moralecajn principoj.
    info: 'Vinulo estas emoĉo kiun oni sentas post agado, kiun ni rigardas kiel malbonan. Ĝi diferenciĝas de hontemo; vinuo fokusiĝas pri specifa konduto dum la persono mem temas pro hontemo. Vinuo havas socian rolon: ĝi povigas pardonpeton kaj riparadon da eraroj kaj forteskigu moralan konduton.'
  emotion.happy:
    label: feligula
    summary: Sentado da plezureco aŭ kontento estanteco en bona stato.
    info: Feliĉo estas agrabila emo ligita al liberigo de dopamina kaj serotonino. Ĝi montriĝas per ridetoj, vivigitaj gesticuloj kaj malfermita korpa pozicio.
  emotion.hopeful:
    label: espero
    summary: Pozitiva sento koncerne la estontecon.
    info: Espero estas emo kiu kunigas deziron pri pli bona estonteco kaj fidon en ĝian atingeblecon.Ĝi formas gravan elementon de rezistenca potenco dum malfacilaĵoj.Kutime montrite ke homoj kiuj havas grandan esperon restabiliĝas malpli rapidempe.
  emotion.hopeless:
    label: espero-malapero
    summary: Sentorego ke estonteco ne donos ion bonan.
    info: Espero nuligado estas malbonkvalita emocio karakteriza per konvingiĝo ke la situacio ne povas pliboni. Ĝi temas pri esenco da depresio kaj riskofaktoro por memmortigo. La modelo de Aarono Beck en kognitiveca kuracado difinis esperon malsuprenigan kiel kernan persuadincon.
  emotion.inspired:
    label: inpiro
    summary: Emocia stato stimulanta al trezora agado.
    info: Inspiro estas emocio karakterizita per subite motivaĵo kaj kreismeco. Ĝi establas rilaton kun eŭfania aŭ renkontado de ekzemplara verko aŭ persono. Nerveja scienco montras ke tio aktivas la antaŭfontan kortekson kaj premadon.
  emotion.irritated:
    label: irando
    summary: Emocia stato kun pli granda reago al malgranda stimuli.
    info: Irajdo estas emocio de pligrandigita respondecado dum kiun eĉ malgrandaj stimuloj kaŭzas fortan negativa respondiĝo. Ĝi povas estabili forton pro ekzemple trostreĉeco, manko da dormo aŭ akumulacii streĉecoj. Virinoj en la periodo pri adoleskeco, gravido aŭ menopozo havas hormone influatan irandon.
  emotion.jealous:
    label: envidia
    summary: Negaiva sentemo el konfrontado kun aliaj.
    info: Envidio estas emo pri la fakto ke alia havas ion tion kiun ni mem volus havi. Ĝi diferenciĝas de gelato; envido temas pri fremdaj avantaĝoj dum gelato rilatas al minaco por propra rilatumo. Envido povis estabili bonan agadon sed ankaŭ kaŭzi malamikecon.
  emotion.joyful:
    label: glejo
    summary: Pleneco da felicito kaj ekzubero; superfluanta positiva sentemo.
    info: 'Glejo estas intensa poziiva emo plena de feliĉo. Ĝi rilatas al interna motivaforio kaj fluado-stato ((Csikszentmihai)). Evolua funkcio: forteskigas socialan ligon kun homoj kaj la volanton agadi boneme.'
  emotion.lonely:
    label: solitudino
    summary: Dolora sentimento pro manko interhomo-kontakto.
    info: "Solitudino estas subjetiva sento de isolo kiu dependas nur malplene pri la nombro da homoj ĉirkaŭ vi. \nĜi fortes pridikatas sanitaj problemojn; kronika solitudo mallongigas vivon. \nLa cerbo respondas al socia doloro tiel sammaniere kiel fizikan dorlon."
  emotion.loving:
    label: amo
    summary: Profunda sento de afektivo kaj ligo por dua persono.
    info: 'Amo estas kompleksa emo kiun kunigas afekto, zorgemo, fido kaj intimeco. Ĝi rilate al neurokimio ligita al okscitocino, dopingo kaj serotonino. Helen Fischer distingis tri sistemon: seksan deziron, romanikan amon kaj plenigan atachmenton.'
  emotion.melancholy:
    label: melankolion
    summary: Trakta tristo kun elemento pri medito kaj belarto.
    info: Melnokolio estas pensema emo kiu kunigas triston, reflektadecon kaj certan dulcegon. Ĝi venas el la grekeca vorto por nigra hepato (mela kole) kaj antikvaj medicinoj atribuis ĝin al superfluigo da nigrulo. Kontraste al depresio, melankolio havas etikan elementon kaj artaĵoj ofte celebradas ĉar tia.
  emotion.miserable:
    label: doloreco
    summary: Ekstrema malkontento kaj suferado; plej alta grado de luto.
    info: Doloro estas intensa kaj malbonkvalita emocio karakterizata per profunda malsano kaj suferado. Ĝi povas esti kaŭzitaj fare de fizika doloro, psikologia vundo aŭ perdperdo. Konsiderinda nombro da homoj spertas kronikan dolorkonstantecon dum depresio.
  emotion.nervous:
    label: timemo
    summary: Malgranda angoro antaŭ iu evento
    info: 'La timemo estas malsanulo kaj malvarma emocio tipe ligit al atendado de grava okazo. Fiziologie ĝin montras pligrandiĝinta simpatia neŭra sistemoaktivajo: pulso batas rapide, oni transpiras. Malsa maniero helpas efikecon dum tro forta timemo interkovras la laboron.'
  emotion.nostalgic:
    label: nostalogio
    summary: Suĉa kaj trista senĝemoro por la pasinto.
    info: La nóstalgio estas emo per kiu oni sentas sukecon kun doloro pro la pasinteco; ĝiaj memoroj donas plezuron sed ankaŭ dolencon. La esprimo devenis el greko 'nostos' signifanta reeniro hejmpere al si mem kaj 'algos', simbolante doron. Studoj montras ke nostalgio fortigas socian ligitecon kaj sentimenton pri vivsignifo.
  emotion.optimistic:
    label: optismo
    summary: Atendo pri favorablaj sekvoj kun fokuso sur plenumeblo.
    info: Pozitivismo estas konata per atendado de bonaj rezultoj. Ĝi implicas videblan kapablon por trafiĝi al la plej bonega ebla efiko en diversspeca situaciojn.
  emotion.overwhelmed:
    label: overfluo
    summary: Sento ke tro multe venis samtempe.
    info: Overfluo okazas dum postuloj transpasigas niajn kapablojn por trakti ilin. Ĝi montriĝas per konata disvolviĝo de la pensado, emacia ekzalto aŭ rigido. Certa grado da superfluigo estas ebla regadi sed plenumita superfluigo povas kaŭzi elĉerpigon.
  emotion.peaceful:
    label: tranquilulo
    summary: Profunda sento pri interna pacemo kaj bonegono.
    info: En esperantisto ĝi estas positiva emocio sen streĉo kaj interrompiĝoj. Klareco aktivigas la parasimpatikan neronan sistemon per malpligrandigo de pulsofrekecon kaj sanguotenson.
  emotion.pessimistic:
    label: pessimismo
    summary: Tendance ekzpeti malplenumajn efektivecojn kaj fokusi sur négativo.
    info: Pesimo smo estas konata per emocio-kunligita stilo karakteriza pro atendado pri malbonaj rezultoj. Milda formo povas esti adapta - reale taksi riskoj helpas eviti danĝeran situaciojn. Tamen ĉeĥa forma ligit al pli granda risiko por depresioj kaj pioraj sanrezultatoj.
  emotion.playful:
    label: plenad
    summary: Vivo-emocie kun dezirado partopreni ludon.
    info: Plenado estas emocio karakterizita per gajeco pri ludoj, humuro kaj esplorado sen seriozo. Ĝi funkcias evolue por plenumigi teknikoj en sekura situacio kaj temas al la kreemo de Stuart Brown el Nacia Instituto por Ludo.
  emotion.proud:
    label: orgo
    summary: Poziiva sentimenteco de kontentigo pri siaj atingoĵoj.
    info: Orgo estas emo ligita al senti sukceson aŭ apartenadon al io valoran. Redektaj pozicioj, levigita kapo kaj plenumita torako montras universale la orgonojn. Ĝi povas esti salutema (motiveca por disvolviĝado) aŭ malsalutema (orgoneco). En Hinduismo oni rigardis orgon (ahamkar) kiel obstaklon spirite.
  emotion.relieved:
    label: libereco
    summary: Agabla sento post la finfine perdiĝanta tensio.
    info: Libereco estas emo ricevitaj kiam streĉo, timado aŭ doloro malaperas. Ĝin montras profunda elspirado, musolkontraktigo forigita kaj sento de varmeco. Evolue gravas pro tio ke indikas minaco pasis kaj oni povas relaksigi.
  emotion.sad:
    label: malgaja
    summary: Sentas tristecocon aŭ mispacocon estante en depreso.
    info: Tristo estas naturoza emo pro kaŭzo de perdo aŭ malplena eco. Ĝin montras lacrimadoj, malsupren turnita buŝo kaj mallarĝa korpo.
  emotion.scared:
    label: timema
    summary: Sentimo timorodan aŭ hororon pro danĝero aŭ minaco.
    info: Timoro estas baza defensiva emo. Ĝi kaŭzas liberigon de adrenalino kaj akcelas la koron por preparigi la korpon al fugado aŭ defendo.
  emotion.serious:
    label: graveco
    summary: Seria konduto sen humoro; koncentriĝante al gravaĵoj.
    info: Graveco estas emocio karakterizita per atentemo kaj manko de ludemececo. Ĝi gravas en situacioj kiun necesigas fokusiĝo kaj serioza pripensado.
  emotion.shocked:
    label: ŝoko
    summary: Subitaj emocia reago al atendota eventeco.
    info: Ŝoko estas intensa emo kaŭzita de netaksitebla kaj surprimanta evento aŭ informo. Ĝi montriĝas per subite kontraktigado kun malfermitaj buŝoj kaj dilatisintaj pupiloj. Evolua funkcio estis haltigi agadon por prokruti novinformaciojn.
  emotion.shy:
    label: shamemeco
    summary: Timema rezerveco en socio-situaciojn, plej oftas konfrontite kun fremdlingoj.
    info: "Shamefako estas socia emo primonita de neruzo kaj timemo en la ĉeesto da fremduloj. \nĜi asociigas kun interna personaro sed ili ne identecas inter si. \nPlejparte malforta formo el shamefakado estas normala konduto dum plenkreska homarĝo;\nen ekstrema stato tamen oni nomadas 'sociananofio', kiun efiko malhelpas ordinara funkcii.\nAnkaŭ diversaj kultra influoj gravas:\nkiam kelke kultrumoj honoras shafemon,\nalikaze aliaj rigardu ĝin kiel barieron."
  emotion.surprised:
    label: surbazita
    summary: Sentado de tujeca surprizo pro nelokata okazaĵo.
    info: Surbazo estas tre mallongdaŭra emo kiu daŭras nur kelkajn sekundojn. Ĝi montriĝas per malfermitaj buŝoj, levigitaj supraj palaĵetoj kaj dilatitaj pupiloj.
  emotion.tired:
    label: malstreĉa
    summary: Sentu fizikan aŭ mentalan eksterordinarigan forton perdiĝantan necesadon pri paco.
    info: Unaveco estas signalo de la korpuo ke ĝi bezonas riproĉon. Aperas kiel somneco, malpliiĝanta reflektivado kapablo kaj malmultigita atentemo.
  emotion.upset:
    label: sofreco
    summary: Neplua emo kaŭzita fare de nerealigis evento.
    info: Sofro estas ĝenerala negativa emocio kunmetanta tristeco, kolero kaj timemo. Ĝi okazas pro malagrablaj eventoj, malfeliĉo aŭ konfliktojn. Fiziologie aktivas stresecan akson HPA per pligrandigo de la korzolo.
  emotion.worried:
    label: stari
    summary: Ripetadaj malbonpensadoj rilate eblaĵojn en fremda tempo.
    info: Stariĝo estas konata emocio kun fokuso sur antaŭvidado eblaj danĝeroj. Malpli forta stario povas esti adapto kiu motivas al preparacio sed plenumita kronika stario interkovras ĉiutagan vivon per malsaneco nomita anksioza distordo. Mindfulneso kaj intence haltigi la cirklojn de pensusoj pri problemoj efike helpas.
