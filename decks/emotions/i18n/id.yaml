lang: id
pivot: false
title: Emosi
cards:
  emotion.angry:
    label: marah
    summary: Merasa sangat kesal atau marah, dalam keadaan geram.
    info: Marah adalah emosi yang muncul sebagai respons terhadap ketidakadilan atau ancaman yang dirasakan. Emosi ini meningkatkan detak jantung dan mempersiapkan tubuh untuk bereaksi dengan cara 'bertarung atau lari'.
  emotion.calm:
    label: tenang
    summary: Merasa damai dan nyaman secara internal, berada dalam keadaan tenang.
    info: Tenang adalah kondisi keseimbangan psikologis dan fisik. Ini memperlambat detak jantung, mengedepankan pernapasan yang lebih dalam, serta membantu berpikir jernih dan membuat keputusan yang baik.
  emotion.excited:
    label: bersemangat
    summary: Merasakan antusiasme yang kuat dan harapan bahagia.
    info: Antusias adalah emosi positif intens yang terkait dengan ekspektasi suatu peristiwa menyenangkan. Emosi ini meningkatkan energi, mempercepat detak jantung, serta mendukung berpikir kreatif.
  emotion.happy:
    label: bahagia
    summary: Merasa gembira atau senang, berada dalam suasana hati yang baik.
    info: Bahagia adalah emosi menyenangkan yang terkait dengan pelepasan dopamina dan serotonin. Emosi ini muncul melalui senyuman, gerak tubuh aktif, serta sikap terbuka.
  emotion.sad:
    label: sedih
    summary: Merasakan duka atau ketidakpuasan, berada dalam depresi.
    info: Sedih adalah emosi alami sebagai respons terhadap kehilangan atau kekecewaan. Emosi ini muncul dengan air mata, sudut mulut yang turun, dan sikap tubuh yang tertekuk.
  emotion.scared:
    label: terkejut
    summary: Merasa takut atau ketakutan karena ancaman atau bahaya.
    info: Ketakutan adalah emosi pertahanan dasar. Ia memicu pelepasan adrenalin, mempercepat detak jantung, dan menyiapkan tubuh untuk melarikan diri atau berlindung.
  emotion.surprised:
    label: terkejut
    summary: Merasa kaget atas kejadian yang tidak terduga.
    info: Kejutan adalah emosi singkat yang hanya berlangsung beberapa detik. Ditandai dengan mulut terbuka, alis terangkat, dan pupil mata melebar.
  emotion.tired:
    label: lelah
    summary: Merasa kelelahan fisik atau mental dan membutuhkan istirahat.
    info: Kelelahan adalah sinyal tubuh bahwa ia perlu beristirahat. Gejalanya meliputi kantuk, perlambatan respon, serta penurunan kemampuan berkonsentrasi.
