lang: ar
pivot: false
title: العواطف
cards:
  emotion.angry:
    label: غاضب
    summary: الشعور بانزعاج قوي أو غضب، كونك مُ勃怒.
    info: الغضب هو عاطفة تظهر كرد فعل على إدراك الظلم أو الخطر. يزيد الغضب من معدل ضربات القلب ويجهز الجسم للتفاعل "قاتل أو هرب".
  emotion.calm:
    label: هادئ
    summary: الشعور بالسلام الداخلي والراحة، أن تكون في حالة هدوء.
    info: الهدوء هو حالة توازن نفسي وجسدي. يُبطئ معدل ضربات القلب ويُعمق التنفس ويجعل التفكير واضحًا والقرار جيدًا.
  emotion.excited:
    label: متحمس
    summary: الشعور بanticipation قوية أو شغف كبير.
    info: المشاعر المتحمسة هي مشاعر إيجابية قوية مرتبطة باستقبالية حدث ممتع. تزيد من الطاقة، تسريع القلب وتشجع على التفكير الإبداعي.
  emotion.happy:
    label: سعيد
    summary: الشعور بالفرح أو المتعة، والوجود في حالة جيدة من النشاط العاطفي.
    info: السعادة هي عبارة عن مشاعر ممتعة مرتبطة بإفراز الدوبامين والسِروتونين. تظهر السعادة بابتسامة واسعة، حركة نشيطة، وضعية الجسم المفتوحة.
  emotion.sad:
    label: حزين
    summary: الشعور بالحزن أو عدم الرضا، كونه في حالة اكتئاب.
    info: الحزن هو عاطفة طبيعية تظهر كرد فعل على خسارة ما أو إحباط. يُعبّر عنه بالدموع وانحناء زوايا الفم والوقوف منكسِف الظهر.
  emotion.scared:
    label: مُرْعَب
    summary: الشعور بالخوف أو الرعب من خطر أو تهديد.
    info: الخوف هو عاطفة دفاعية أساسية. يطلق إفراز الأدرينالين، ويزيد معدل ضربات القلب، ويجهّز الجسم للفرار أو الدفاع.
  emotion.surprised:
    label: مُذهَل
    summary: الشعور بالاندهاش فجأةً إزاء حدث غير متوقع.
    info: يكون الاندهاش عاطفة قصيرة الأمد تستمر لبضع ثوانٍ فقط، ويظهر ذلك من خلال فتح الفم ورفع الحاجبين وتوسيع الحقول البصرية.
  emotion.tired:
    label: متعب
    summary: الشعور بالإرهاق الجسدي أو العقلي، والرغبة في الراحة.
    info: التعب هو إشارة من الجسم أنه يحتاج إلى راحة. يظهر على شكل نعاس، تباطؤ في الاستجابة، وانخفاض قدرة التركيز.
