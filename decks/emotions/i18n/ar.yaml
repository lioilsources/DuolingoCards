lang: ar
pivot: false
title: العواطف
cards:
  emotion.amazed:
    label: إعجاب
    summary: شعور إيجابي قوي ومفاجئ عند مقابلة شيء استثنائي.
    info: الإعجاب هو عبارة عن شعور قوي يُثيره التعرض لشيء هائل أو مذهل، ويقلّل من الشعور بالذات الصغيرة ويزيد الإحساس بالتواصل مع البيئة المحيطة. أظهرت الدراسات أن هذا المشاعر تخفف الضيق وتزيد السلوك الاجتماعي.
  emotion.amused:
    label: ضحك
    summary: شعور سار وخفيف من الترفيه أو الاستراحة
    info: |-
      الضحك هو عاطفة إيجابية خفيفة تُثيرها شيئًا مضحكة أو مثيرة للاهتمام
      يختلف عن الضحك؛ فالضحك نتيجة للضحك، ولكن ليس كل ضحك يسبب ضحكاً
      هو شعور اجتماعياً مشترك؛ فالأمور يبدو أنها أكثر طماعاً عندما نشاركها مع الآخرين
  emotion.angry:
    label: غاضب
    summary: الشعور بانزعاج قوي أو غضب، كونك مُ勃怒.
    info: الغضب هو عاطفة تظهر كرد فعل على إدراك الظلم أو الخطر. يزيد الغضب من معدل ضربات القلب ويجهز الجسم للتفاعل "قاتل أو هرب".
  emotion.annoyed:
    label: إحباط
    summary: شعور إحباط طفيف نتيجة لتحريش متعب يتكرر.
    info: الإحباط هو عبارة عن شعور سلبي خفيف يُثيره تحفيز مزعج متكرر، وغالباً ما يكون دليلاً على غضب أقوى قادم. يمكن أن يحدث بسبب نقص النوم أو الجوع أو الإجهاد الزائد.
  emotion.anxious:
    label: anxiety
    summary: Feeling unpleasant nervousness about an uncertain future.
    info: |-
      القلق هو عبارة عن شعور متوقع بالخطر؛ القلق الخفيف يُعتبر تكيفيًا ويحسن الأداء.
      it يظهر بشكل جسدي على أنه نبض قلبي سريع، رائحة العرق، تنفس مختصر وعضلات منتصبة.
      The اضطرابات الهلع هي أكثر الأمراض النفسية شيوعاً وهي تصيب ما يزيد عن ثلاثمائة مليون شخص.
      The المعالجة السلوكية المعرفية (CBT) هي أقوى طريقة للعلاج لاضطرابات القلق.
  emotion.bored:
    label: الملل
    summary: شعور بعدم الاهتمام والفراغ دون أي تحريض للتواصل.
    info: الملل هو حالة عاطفية سلبية تنتج عن نقص التحفيز أو النشاط المفيد، ويمكن أن يؤدي إلى البحث عن مغامرات جديدة أو فتح آفاق للتفكير الإبداعي. كما أنه من وجهة النظر التطورية يحفّز على اكتساب الفرص الجديدة. أظهرت الدراسات العلمية أيضًا أن الشعور بالملل لفترات طويلة قد يتسبب في زيادة خطر الاكتئاب.
  emotion.calm:
    label: هادئ
    summary: الشعور بالسلام الداخلي والراحة، أن تكون في حالة هدوء.
    info: الهدوء هو حالة توازن نفسي وجسدي. يُبطئ معدل ضربات القلب ويُعمق التنفس ويجعل التفكير واضحًا والقرار جيدًا.
  emotion.cheerful:
    label: فرحة
    summary: حالة لطيفة وممتعة تتضمن نظرة هادئة وإيجابية.
    info: الفرح هو حالة عاطفية إيجابية تتميز بالحيوية والإعجاب وحالة مزاج جيدة، ويتعلق بسمات الشخصية الانطوائية والعالية من العواطف الإيجابية. وهو معدي؛ فالوجود إلى جانب شخص فرح يحسّن المزاج العام للأشخاص حوله. كما أظهرت الدراسات أن الأشخاص الفرِحين يتمتعون بنظام المناعة القوي.
  emotion.confident:
    label: الثقة بنفسك
    summary: التقدير للقدرة الذاتية القيمة
    info: |-
      الثقة بالنفس هي حالة عاطفية تُظهر ثقة الشخص بقدراته وحكمته الخاصة
      الموقف المستقيم والاتصال البصري المباشر والعِبر الصوت الهادئ يعكسون الثقة بالذات
      أمي كودي (محاضرة TED عام ٢٠١٢) شجّعت على اتخاذ وضعيات قوية لزيادة الشعور بالثقة
  emotion.confused:
    label: الحيرة
    summary: شعور بعدم اليقين عند فقدان الفرد لموقف معطى أو المعلومات.
    info: تحدث الحيرة عندما تفتقر إلى السياق أو المعرفة لفهم الوضع، وهي جزء طبيعي من التعلم؛ إذ تحفّز عدم وضوح الأفكار البحث عن الإجابات. كما أنها معبَّرة عنها على الوجه بانحناء الرأس وتعرُج الجبين. قد تتسبب في سوء فهم أثناء التواصل؛ والحل هو طرح أسئلة.
  emotion.content:
    label: الرضى
    summary: هدوء داخلي واستبشار راضٍ بدون شوق إلى المزيد.
    info: الرضا هو حالة إيجابية هادئة من المشاعر دون الحاجة للتغيير، ويختلف عن السعادة؛ فالرضى يحمل طمأنينة بينما تتميز السعادة بالحيوية والنشاط. يعتبر البوذية الرضى أو 'سانتوسا' كفكرة أخلاقية أساسية على طريق الإضاءة الروحانية. كما بينت دراسات علم النفس في مجال سعادته أن الرضى أكثر استقرارًا ومتانة مقارنة مع الحالة المفرطة للسعادة.
  emotion.curious:
    label: فضول
    summary: شوق لتعلم شيء جديد.
    info: ال的好奇心 هي حالة تحفيزية تبدأ في البحث عن معلومات وتجارب جديدة، وهي مرتبطة بنظام المكافأة الدوباميني؛ فالفضول يجلب بالفعل الإشباع العاطفي والسعادة. كما أنها ضرورية للتقدم العلمي وللتطور الشخصي.
  emotion.delighted:
    label: فرحة شديدة
    summary: شعور بالسرور الشديد بسبب حدث جيد أو كشف.
    info: السعادة المُبهجة هي عاطفة إيجابية قوية تنتج عن حدث ممتع أو اكتشاف جديد، وهي أقوى من السعادة الأساسية وتشير إلى حركة نشيطة مثل القفز والصياح والنكات. كما أن لها دورًا في التطور لأنه يعزز السلوك الذي يؤدي النتائج المرغوبة، وتنتقل هذه المشاعر الاجتماعية بسهولة؛ فالفرح المشترك أكثر بكثير مما هو فرد.
  emotion.determined:
    label: تصميم
    summary: نية قوية لتحقيق هدف رغم وجود صعوبات.
    info: التصميم هو حالة عاطفية دافعة تتميز بالتركيز والعزيمة، ويُعبّر عنها بمضغ الفكين وشد العضلات وإظهار نظر حاد. وهو مرتبط ارتباطًا مباشرًا بمصطلح الجرأة أو الصبر القوي كما في دراسات أنجلو ديوكورث التي تعني الجمع بين الشوق والعزم على الاستمرارية. أظهرت الأبحاث أنه يتنبأ النجاح بشكل أفضل من الذكاء.
  emotion.disappointed:
    label: إحباط
    summary: مشعرٌ غير سار يحدث حينما تتعرض أحلامنا للتغيير.
    info: تحدث الإحباط عندما لا يتطابق الناتج مع التوقع أو الرغبة، ويزداد شدةً عند الاستثمار العاطفي أو الجهد المرتفعين. تشير الدراسات إلى أن التوقعات هي مفتاح؛ فالتوقّع الأدنى يؤدي إلى إحساس أقل بالإحباط. تعليم الذكاء العاطفي يتضمن العمل على التعامل مع المشاعر غير السارة مثل الإحباط.
  emotion.disgusted:
    label: إحباط
    summary: شعور قوي بعدم الرضا عند التعرض لمثيرات مؤذية.
    info: الغثيان هو عاطفة أساسية تحمي من الأشياء الضارة مثل الطعام السام أو الأمراض، ووظيفته التطورية هي حمايتنا من أكل طعام فاسد. يُظهر الغضب بالانحناق واللسان الممدود ومعبّر عن وجه مميز؛ كما يمكن أن يكون سلوكًا غير لائق اجتماعياً ويؤدي إلى تنظيمه.
  emotion.embarrassed:
    label: الحَرْج
    summary: مشاعر غير سارة من الشعور بعدم الأمان أو الخجل داخل موقف اجتماعي.
    info: الحُرج هو عاطفة اجتماعية تظهر عندما نعتقد أننا قد خرقنا المعايير الاجتماعية، وغالبًا ما يصاحبها الاحمرار والانحراف بالعينين وضعف في الحالة الجسدية؛ كما أنه يؤدي إلى إظهار التزامنا بمعايير المجتمع أمام الآخرين. الأبحاث أشارت أيضًا إلى أن الناس الذين يستحيون بشدة غالبًا يتم النظر إليهم باعتبارهم أكثر موثوقية.
  emotion.excited:
    label: متحمس
    summary: الشعور بanticipation قوية أو شغف كبير.
    info: المشاعر المتحمسة هي مشاعر إيجابية قوية مرتبطة باستقبالية حدث ممتع. تزيد من الطاقة، تسريع القلب وتشجع على التفكير الإبداعي.
  emotion.frustrated:
    label: إحباط
    summary: شعور بالانزعاج يحدث عند مواجهة حواجز تحول دون تحقيق الهدف.
    info: الإحباط هو عبارة عن شعور ناتج عندما تُسدَّد أهدافنا بحواجز، ويمكن أن يؤدي إلى إجراء بنائي مثل البحث عن خيارات أخرى أو دمارية كالأgression. كانت "نظرية الإحباط والأgression" من النظريات النفسية المؤثرة في العشرين عاماً الماضياً من القرن الماضي.
  emotion.grateful:
    label: الإحساس بالإمتين
    summary: شعور حار بتقدير ما لدينا أو نحصل عليه.
    info: الامتنان هو عاطفة إيجابية تظهر عندما ندرك الخير في حياتنا، ودراسات علم النفس الإيجابي أشارت إلى أن التعبير عن الامتنان بانتظام يزيد من مستوى الرضا الشخصي ويحفز مراكز المكافأة بالدماغ بطريقة مشابهة للملذات الجسدية، كما يعد كتابة دفتر امتناني يومياً واحدة من أكثر التقنيات فعالية لتحسين الحالة المزاجية.
  emotion.guilty:
    label: ذَنْب
    summary: شعور مؤلم يحدث عند خرق معايير أخلاقك الشخصية.
    info: الذنب هو عاطفة تنشأ بعد ارتكاب فعل نعتبره سيئًا، ويختلف عن الخجل؛ إذ يركز الذنب على السلوك المحدد بينما يتصلب الخجل في الشخص ككل. كما أنه يؤدي وظيفة اجتماعية لأنه يستثير الشعور بالاعتذار والتصحيح، مما يعزز السلوكيات الأخلاقية.
  emotion.happy:
    label: سعيد
    summary: الشعور بالفرح أو المتعة، والوجود في حالة جيدة من النشاط العاطفي.
    info: السعادة هي عبارة عن مشاعر ممتعة مرتبطة بإفراز الدوبامين والسِروتونين. تظهر السعادة بابتسامة واسعة، حركة نشيطة، وضعية الجسم المفتوحة.
  emotion.hopeful:
    label: التطلُّع للخير
    summary: شعور إيجابي بأن المستقبل سيكون جيدًا
    info: |-
      الرجاء هو عبارة عن شعور يجمع بين الرغبة في مستقبل أفضل والإيمان بتحقيقه قريبًا
      وهو عاملاً رئيسيّاً من مقاومة الصعب والتحديات المختلفة، ووجدت الدراسات أن المرضى الذين لديهم أكثر تفاؤل يتخلصون أسرع من الأمراض أو المشاعر السلبية
  emotion.hopeless:
    label: الياس
    summary: شعور بأن المستقبل لن يجلب شيئًا إيجابيا.
    info: القناعة بعدم وجود أمل تُعتبر حالة عاطفية سلبية مميزة بمعتقد أن الوضع لا يمكن تحسينه، وهي عنصر أساسي في الاكتئاب وعامل خطر للانتحار. نموذج العلاج السلوكي المعرفي لـ 'إيرون بيكس' حدد اليأس كمقنعة مركزية؛ حيث تعتبر التصورات والتعديل الإدرازي من الوسائل الفعالة للتداخل.
  emotion.inspired:
    label: إلهام
    summary: حالة حماس وإثارة تحفز على أفعال إبداعية.
    info: الإلهام هو حالة عاطفية تتميز برغبة ملحة في الإبداع والحماس، وغالبًا ما يرتبط بتجربة إدراك جديدة أو لقاء شخص استثنائي أو عمل فني خاص. علميًّا يؤدي إلى نشاط قشرة الجبهة الدماغية ومنطقة المكافأة.
  emotion.irritated:
    label: اضطراب عصبي
    summary: حالة ازدياد الحساسية للإثارة؛ حد الانفعال.
    info: التوتر العاطفي هو حالة من التفاعل المفرط، حيث تثير حتى الأحداث الصغيرة رد فعل سلبي قويًا. قد يشير إلى الإرهاق أو نقص النوم أو الضيق المتراكم. النساء في مرحلة البلوغ والحمل أو سن اليأس يمكن أن يكن معرضات للاضطراب الهرموني.
  emotion.jealous:
    label: الغيْرة
    summary: مشاعر سلبية نتيجة للمقارنَة بالناس.
    info: الغيرة هي عاطفة تظهر عندما نشعر أن شخصًا آخر يمتلك شيئًا نرغب فيه. تتباين عن الغضب من فقدان العلاقة الخاصة، فالإحساس بالغيرة متعلق بامتيازات الآخرين بينما يتصل الشعور بالإحباط أو التهديد في العلاقات القائمة على المقارنة مع غيرك.
  emotion.joyful:
    label: فرحة
    summary: إحساس سعادة قوية ومتفانية؛ وهو نوع غني من المشاعر الإيجابية.
    info: الفرح هو عبارة عن شعور إيجابي قوي يفيض بالسعادة، وغالباً ما يتم ربطه بمحفز داخلي والشعور بالمتعة الكاملة أثناء أداء مهمة معينة (كما في نظرية فلو من تشيكسنتميهاي). الوظيفة التطورية له هي تعزيز الروابط الاجتماعية وتقويم السلوك المفيد للجميع. كما أنه مشاعر اجتماعيا مقدرة جدا؛ وفي علم النفس الإيجابي فإنه مؤشر أساسي على جودة الحياة.
  emotion.lonely:
    label: ' الوحدة'
    summary: شعور متعب بغياب التواصل مع الآخرين.
    info: الوحدة هي شعور ذاتي بالعزلة مستقل عن عدد الأشخاص الفعليين المحيطين بك. إنها مؤشر قوي لمشاكل صحية؛ فالوحدة المستمرة تُقصر العمر. الدماغ يتفاعل مع الألم الاجتماعي بنفس الطريقة التي يستجيب بها للألم الجسدي.
  emotion.loving:
    label: Love
    summary: A profound feeling of attachment to another person.
    info: "{\"hint\":\"الشعور بالحب العميق؛ عيون القلب\",\"info\":\"إن الحب هو شعور معقد يجمع بين الانجذاب والاهتمام والتواصل العاطفي والأمان والعلاقة المقربة.\r\nمن الناحية الكيميائية المرتبطة بهكسامين الأوكسيتوسين، الدوبامين والمصلانرين.\r\nتنص هيلن فيشر على وجود ثلاث أنظمة مميزة للحالة النفسية : الرغبة الجنسية ومحبة الشريك الروماني ومدى الارتباط الجوهري\r\nوهو حالة نفسية مشتركة توجد جميع الثقافات رغم اختلاف طرق التعبير عنها.\"}"
  emotion.melancholy:
    label: ميلانكولي
    summary: حزن هادئ مع مزيج التفكير الجمالي.
    info: الميلانكوليا هي عاطفة تأملية تتكون من الحزن والتأمل وبعض اللطف، وتعود أصولها إلى الكلمة اليونانية التي تعني الصفراء السوداء؛ فقد اعتبر الأطباء القدامى أنها ناتجة عن فائض في الصفراء السمراء. على خلاف الاكتئاب فإن لها جانبًا جماليًّا يُحتفى به كثيرًا في الفن الموسيقى والأدب.
  emotion.miserable:
    label: عَذْبٌ مُوجِّعٍ
    summary: شدة الكآبة والحزن؛ أعلى درجات الحزن.
    info: |-
      العذاب هو حالة عاطفية سلبية قوية تتميز بالكآبة الشديدة والألم النفسي
      يمكن أن يسببه الألم الجسدي أو الإصابة العاطفية أو الخسارة
      يعد العذاب المزمن أحد أعراض الاكتئاب
  emotion.nervous:
    label: التعبير عن التوت
    summary: حالة من الذعر قبل الحدث مع مشاعر غريبة بالجوف.
    info: التوتر هو حالة قلق خفيفة ترتبط عادةً باستباق حدث مهم، ويُصاحبها ارتفاع في نشاط الجهاز العصبي الودي مثل تسارع ضربات القلب والعرق؛ يمكن أن يحسّن التوتر الخفيف الأداء بينما قد يؤثر بشكل سلبي إذا كان شديدًا.
  emotion.nostalgic:
    label: الحنين
    summary: شعور حلو مر للإشتياق للماضي
    info: |-
      الحنين هو عاطفة مليئة بالحلو المر؛ تذكّر الماضي ممتع، لكنه في نفس الوقت مؤلم
      يأتي المصطلح من الكلمة اليونانية 'نوسْتُس' التي تعني العودة إلى المنزل و'أَلِغوز' أي الألم
      تبين الأبحاث أن الحنين يزيد الشعور بالإنسجام الاجتماعي والمعنى
  emotion.optimistic:
    label: تفاؤلي
    summary: ميل لتوقع نتائج جيدة والرؤية الجانب الايجابي
    info: |-
      التفاؤل هو نمط إدراكي عاطفي مميز باستباق النتائج الإيجابية
      أشار مايكل سيلغمان إلى التفاؤل كعامل أساسي في المرونة النفسية، ووجد أن الأشخاص الذاكرين يعيشون لوقت أطول ويتمتعون بصحة أفضل وأكثر تقدمًا
      يمكن تعليم التفاؤل من خلال رؤية العقبات على أنها مؤقتة ومحددة ويمكن السيطرة عليها
  emotion.overwhelmed:
    label: الإرهاق
    summary: هو الشعور بأن الكثير يحدث في وقت واحد.
    info: تحدث حالة الارتباك عندما تتجاوز المتطلبات مواردنا للتعامل معها، وتشمل أعراضه فشلاً إدراكياً (عدم القدرة على التفكير بوضوح) أو انفجاراً عاطفيًا أو صمتاً شديد التركيز. يمكن التعامل مع درجة معينة من الإرهاق العصبي؛ بينما يؤدي الاستمرار فيه إلى الحروقة النفسية والجسدية. إدارة الوقت وإسناد المهام وممارسة اليقظة هى استراتيجيات فعالة.
  emotion.peaceful:
    label: هدوء
    summary: إحساس عميق بالنعومة الداخلية والاسترخاء.
    info: الهدوء هو حالة عاطفية إيجابية تخلو من التوتر والانزعاج، وغالبًا ما يكون الهدف الرئيسي في ممارسات المراقبة الذاتية مثل اليقظة العقلية وممارسة زين للتأمل. كما أنه يُشغّل النظام العصبي الباسط بالكامل مما يؤدي إلى خفض معدل ضربات القلب وتخفيف الضغوط الجسدية.
  emotion.pessimistic:
    label: Pessimism
    summary: The tendency to expect bad results and focus on negatives.
    info: '{"hint":"توقع الأسوأ؛ سحابة مظلمة فوق الرأس","info":"التشاؤم هو نموذج إدراكي عاطفي يتميز باستباق النتائج السلبية\nmожет يكون التشاؤم الخفيف تكيفيًا ؛ التقييم الواقع للمخاطر يساعد في الابتعاد عن المخاطر\nThe chronic pessimism is associated with an increased risk of depression and worse health outcomes\ncognitive behavioral therapy helps change the pattern of thinking about optimism."}'
  emotion.playful:
    label: اللّعب
    summary: مزاج حيوي وميلاً إلى المرح والاستمتاع
    info: |-
      المرح هو حالة عاطفية تتميز بالسعادة اللعب والفكاهة واختبار الأشياء الجديدة
       أنه مؤشر إيجابي على الإبداع وصحة نفسية جيدة لدى البالغين
       الوظيفة التطورية هي تنمية المهارات في سياق آمن
       يؤكد ستوارت براون معهد اللعب الوطني أن اللعب ضروري للوظائف الصحية في كل العمر
  emotion.proud:
    label: اعتزاز
    summary: مشعر موجب للرضا عن نتائجه الشخصية أو تعلقها بمجموعة.
    info: الاعتزاز هو عاطفة مرتبطة بشعور النجاح أو الانتماء إلى شيء ذي قيمة، وعادة ما يُعبّر عن الاعتزاز بالوقوف مستقيمًا مع رفع الرأس والصدر المتفجر. يمكن أن يكون صحيًّا ويحفز على التطور الشخصي، كما في حالة الشعور الإيجابي من إنجازاتك الخاصة؛ لكنه قد يؤدي أيضًا إلى الأناقة غير الصحية مثل الأنانية. وفي الثقافة الهندوسية، فإنَّ الاعتزاز المعروف باسم 'أهامكارا' يعتبر حاجزا أمام التنمية الروحية.
  emotion.relieved:
    label: استرخاء / راحة
    summary: إحساس ممتع ينتج عن انقضاء حالة ضغط أو خطر
    info: |-
      الراحة هي عاطفة تشعر بها بعد اختفاء التوتر أو القلق أو الألم
      تظهر من خلال الزفير العميق وانحلال الضغط العضلي والإحساس بالخفّة
      وهي مهمة على الصعيد التطوري؛ لأنها تعني أن الخطر قد انتهى ويمكن الاسترخاء
  emotion.sad:
    label: حزين
    summary: الشعور بالحزن أو عدم الرضا، كونه في حالة اكتئاب.
    info: الحزن هو عاطفة طبيعية تظهر كرد فعل على خسارة ما أو إحباط. يُعبّر عنه بالدموع وانحناء زوايا الفم والوقوف منكسِف الظهر.
  emotion.scared:
    label: مُرْعَب
    summary: الشعور بالخوف أو الرعب من خطر أو تهديد.
    info: الخوف هو عاطفة دفاعية أساسية. يطلق إفراز الأدرينالين، ويزيد معدل ضربات القلب، ويجهّز الجسم للفرار أو الدفاع.
  emotion.serious:
    label: جدية
    summary: هدوء بدون هزل؛ تركيز على الأمور الهامة
    info: |-
      الجدية هي ميل عاطفي يُعبّر عن تركيز وغياب الخفة
      إنها مهمة في المواقف التي تتطلب التركيز والتفكير الدقيق
      قد تختلف الجدية حسب الثقافة؛ فبعض المجتمعات تعتبرها احترامًا، بينما أخرى قد تكون مرتبطة بعدم الود
  emotion.shocked:
    label: صدمة
    summary: إحساس حاد بالدهشة نتيجة لمعلومات أو أحداث غير متوقع.
    info: الصدمة هي عبارة عن شعور قوي يُثيره حدث أو معلومة غير متوقعة، وغالباً ما تسبب صدماً نفسيًا كبيراً. وتظهر الصدمة بانقباض فجائي في الجسم مع اتساع الحواجب والعينين والمouth منفتحة. كما أن لها دوراً بيئياً يتمثل في إيقاف النشاط لمعالجة المعلومات المفاجئة.
  emotion.shy:
    label: الخجول
    summary: التimid والقلق الاجتماعي خصوصًا عند التعامل مع أفراد غير مألوفين.
    info: الخجل هو عبارة عن مشاعر اجتماعية تظهر على شكل قلق وتردد في وجود الأشخاص الآخرين، ويُربط هذا العاطفة مع الشخصية الانطوائية لكنهما ليسا متماثلين بالكامل؛ فالقليل من الخجل أمر طبيعي بينما الشدة منه مثل الفوبيا الاجتماعية قد يعوق الوظيفة اليومية بشكل كبير.
  emotion.surprised:
    label: مُذهَل
    summary: الشعور بالاندهاش فجأةً إزاء حدث غير متوقع.
    info: يكون الاندهاش عاطفة قصيرة الأمد تستمر لبضع ثوانٍ فقط، ويظهر ذلك من خلال فتح الفم ورفع الحاجبين وتوسيع الحقول البصرية.
  emotion.tired:
    label: متعب
    summary: الشعور بالإرهاق الجسدي أو العقلي، والرغبة في الراحة.
    info: التعب هو إشارة من الجسم أنه يحتاج إلى راحة. يظهر على شكل نعاس، تباطؤ في الاستجابة، وانخفاض قدرة التركيز.
  emotion.upset:
    label: إحباط
    summary: حالة إحباط نتيجة حدث سلبي.
    info: "{\"hint\":\"الشعور بالحزن وعدم الراحة\",\"info\":\"إن الإحباط هو حالة عاطفية سلبية تجمع بين الحزن والغضب والقلق.\r\nوهو رد فعل على أحداث غير مريحة أو خيبة أمل أو نزاعات\r\nمن الناحية الفسيولوجية، فإنه يُشغِّل محور التوتر (محور الدماغ - الغدة الصعترية - الكظرية)، مما يؤدي إلى ارتفاع مستوى هرمون كرتوزول.\",\"label\":\"إحباط\",\"summary\":\"حالة إحباط نتيجة حدث سلبي.\"}"
  emotion.worried:
    label: '"/starost"'
    summary: '{"summary":"تفكير سلبي متكرر حول مشاكل محتملة مستقبلًا."}'
    info: '{"info":"القلق هو حالة عاطفية إدراكية تركز على التنبؤ بالتهديدات المحتملة\nإن القلق الخفيف متكيف ويدفع إلى الاستعداد\nوالقلق المزمن (اضطراب قلقي) يعطل الأداء اليومي\nوالتواضع الذهني والتدخل العمد في دورة القلق هما تقنيتان فعالان"}'
