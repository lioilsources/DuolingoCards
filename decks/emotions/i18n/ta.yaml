lang: ta
pivot: false
title: உணர்வுகள்
cards:
  emotion.amazed:
    label: Awe(அசைவு)
    summary: '''ஓர் ஓரிடத்தில் இருப்பதை கண்டறியும் போது ஏற்படும் ஃபிரஷ் ஹங்கர்'''
    info: "அசைவு என்பது ஒரு மிகப் பெரிய அல்லது தாக்கமள்ள வஸ்துடன் சந்தி இயற்றும் உணர்வாகும்\nஇஃது 'எழுச்சின்மை' என்ற உணர்வை ஏற்படுத்தும் \nஆராய்ச்சிகள் அசைவு மன ஊർஜம் ஐ குறைத்து ஸஹனீகமான நடத்தையை அதிகரிக்கின்றது"
  emotion.amused:
    label: பசி
    summary: ஓரளவு நல்ல உணர்வு
    info: |-
      பொன்னில் ஒருவகைத் தடங்கல் அறிவும் சேர்ந்துள்ள பசி எண்ணம் மற்றும் ஆய்வு உணர்வு ஏற்படுத்தும் ஓரளவு நல்ல உணர்வு ஆகும்
      இது சிரியது என்பதன் வழியாக வேறுபடுகின்றது;
      அதாவது பசி எண்ணம் சிரியதை உருவாக்குகின்றது,
      ஆனால் அது எப்போதும் சிரியதை உருவாக்காது.
  emotion.angry:
    label: கோபமடைந்த
    summary: வலிமையான குற்றச் சாட்டு அல்லது ஆத்திரத்தை உணர்வது, எளிய இருப்பதற்கு மாறாக.
    info: ஆத்திரம் ஒரு நினைவு நீதி அல்லது ஆபத்து குறியீடாக செயல்பாடு எழுப்பும் ஒரு உணர்வு. இது இதயத்துடிப்பை அதிகரிக்கிறது மற்றும் 'போராடு' அல்லது 'ஓடு' என்ற பதில் நடவடிக்கைக்கு உடலை தயார் செய்கிறது.
  emotion.annoyed:
    label: ஆத்திரம்
    summary: ஓய்விழந்த நிலை அல்லது பசியில் அல்லது மன அழுத்தம் காரணமாக மீண்ண ஆத்திரம்
    info: "பொறாமை என்பது திரட்டி மண்‌கலர் களையாவது அசௌகரியம் ஏற்படுத்தும் ஒரு நிலையின் வழிமுறையாக உள்ளது\nஇது சிறிய ஆத்திரத்திற்கு இடைஞ்சல் ஏற்படுத்தும் \nஅஃது ஓய்விழந்த நிலை , பசியில் அல்லது   மன அழுத்தம் காரணமாக ஐயம் ஏற்படலாம்"
  emotion.anxious:
    label: அச்சம்
    summary: நிழல்
    info: "அச்சத்தின் உணர்வுகளைப் பார்க்கவும் ; மனநல அறியாமையில் , ஒரு ஆடி எழுதும் இடத்திற்கு ஏற்றுதல் .\nஇது உடல் ரீதியாக : \n\nஎட்டு ஹூஸ்,\nஆறு ஜோஹங்ஸ்,\nஓர் ஓட்டம்,\nமற்றும் ஊசி ஐயஞ்சல் ஆகியவை உள்ளன."
  emotion.bored:
    label: நுட்டை
    summary: எதிர்மறை உணர்வு மற்றும் பயன்களின்மை
    info: "நுட்டை எனப் பயன்களின்மைக்கும் அர்த்தவசதி செயல்வழியற்ற ஒரு இணைப்பு உணர்வுக்கும் ஏற்படும் ஓர் எதிர்மறை ஊக்கம் ஆகும்\nஇஃது புதிய அனுபவங்களை அல்லது படைப்பாற்றல் ஐயஞ்சியோ தூண்டும் \nஅறிவியல் ஆய்வுகள் நீடித்த நுட்டை மன நோய் அறிகுறியை அதிகரிக்கின்றது"
  emotion.calm:
    label: மென்மையான
    summary: அகப்புற அமைதி மற்றும் நல்லியல்பான உணர்வுடன் இருப்பது.
    info: மன மற்றும் தசை சமனை கொண்டுள்ளது. இது இதய துடிப்பை மெதுவடையச் செய்கின்றது, மூச்சை ஆழமாக்குகின்றது மற்றும் தெளிவான எண்ணம் மற்றும் நல்ல முடிவெடுப்பை அனுமதிக்கின்றது.
  emotion.cheerful:
    label: களிப்பு
    summary: ஓர் ஆரோக்கியமான மனநிலையில் களிப்பும் நல்ல நம்பிக்கையும்.
    info: |-
      களிப்பு எனப்படும் இந்தத் தொண்டரறி உணர்வு ஆசையுடன் கலங்கிய ஒருவழிமையான சீரில்லாத அனுபவமாகும்
      இஃது ஏற்ற ஓட்டமுள்ள மனஅமைப்புடன் தோராயமாக ஐந்து ரூபங்களை உள்ளடக்கின்றது,
      ஆரஞ்சு ஜீவசக்தியை வளர்த்து களிப்பு நிலையை உருவாக்குகின்றது.
  emotion.confident:
    label: தன்னம்பிக்கை
    summary: தன்னம்பிக்கை என்பது தன்னோடு ஐக்கியமாக இருப்பது.
    info: |-
      தன்னம்பிக்கை எண் தாழுகளில் உறவுபடி மற்றும் நல்வரவேற்புச் செயல்களியிருங்கள்
      அதன் அடிப்படையில் ஒரு மனிதன் தனது ஊக்கத்தை ஏற்படுத்தும் ஓர் உணர்வு ஆகும்,
      இது தன்னம்பிக்கை அதிகரிக்கும்.
  emotion.confused:
    label: குழப்பம்
    summary: இந்த நிலை ஞான விஷயங்களோடு தொடர்புடைய ஒரு சூழ்நிலை அல்லது தகவலை நாம் புரிந்து கொள்ள முடியாத போது நிலவும்.
    info: குழப்பம் என்றால் ஒரு சூழ்நிலையைத் தெளிவடையவசதி இல்லாமற் கண்டுபிடியாமை அல்லது முறையான உள்ளுறவு ஏதுமின்றி ஓர் ஊடக ரீதியான பிழை ஐயம்.
  emotion.content:
    label: சந்தோஷம்
    summary: எதையும் விரும்பாமல் அமைதியான மகிழ்ச்சி.
    info: |-
      சந்தோஷம் எனப்படுவது மகிழ்ச்சி அல்லது ஆர்வமற்ற ஒரு இயல்பான உணர்வாகும்
      இது களியாட்டத்தின் ஏதாவது ஓர் ஈடுபாடு இல்லாமல் ஊழியமாக இருப்பதை குறிக்கிறது,
      அஃது ஞானஸ்ரீத்தின் 'சங்கூ' ஐ குறிக்கிறது.
  emotion.curious:
    label: ஆர்வம்
    summary: புதிய அறிவு மற்றும் புரிதல் ஆசை
    info: |-
      குறிப்பான தேடல் மற்றும் அதன் வழி கண்டறியப்படுவது ஒரு ஆய்ந்த சோதனையின் உள்ளடக்கம்
      இது எச்ஸிரீனொடங்கில் ஏற்படும் ஓர் ஆர்வம்;
      அறிவியல் முன்னேற்றம் மற்றும் தனிப்பட்ட மூலையில் ஐஞ்ஜியல் கண்ணோட்டம்
  emotion.delighted:
    label: நெகிழ்வுற்ற மனப் பரவசம்
    summary: |-
      ஓர் அழுத்தமான
      ஆனந்தம்
    info: |-
      நெகிழ்வுற்ற மனப் பரவசம் எளிய இன்னலி கண்டதையொட்டிச் தோன்றும் ஒரு அழுத்தமான நல்ல உணர்வாகும். இது ஏறக்குறைய ஓர் ஐஞ்ஜிங்(இன்ப) ரீதியான செயல்களை முனைப்புடன் காட்டுகிறதுஃ தரையில் குதித்தல்,
      அலறி குரல் கொடுத்தல்
      என்பவை அடங்கும்.
  emotion.determined:
    label: ஆர்ஹோடல்னி
    summary: எதிர்ப்புகளுக்கு மதிப்பு கொடுத்து இலக்கு அடைவதற்கான வலிமை
    info: |-
      துறவின்மை எனப்படும் இந்தக் கருத்து ஒரு வளர்ச்சி அல்லது ஆழ்ந்த உணர்வுச் சூழலையும், ஏதோ ஓர் இலக்கு நோக்கி ஊக்கமுடன் முனைப்புடன் செயல்படும் தன்மையையும் குறிக்கிறது
      இதன் தீர்மானம் ஜஸ்ட் ரௌண்டு ஃபேஸ், உடல் தூக்கம், மற்றும் ஒரு கண்ணாடி ஐயோ யில் தெரிவிக்கப்படுகிறது
      அங்கிளா டக்ஸ்வோர்஥் என்பவரால் 'grit' என்று குறிப்பிடப்படும் ஒரு கருத்துடன் இது தொடர்புடையதுஃ காதல் மற்றும் துடிப்பு ஆகியவற்றின் கலவை
  emotion.disappointed:
    label: இசே
    summary: எதிர்பார்ப்புகள் அல்லது விழியங்கள் ஏற்றுக்கொள்ளப்படாத ஒரு குறிப்பிட்ட நினைவு.
    info: காமன் எண்ணிகையுடன் உளவறி வழிமுறைப் பதில்கள் தரும் நல்ல செயல்முறைகள்.
  emotion.disgusted:
    label: Disgusted
    summary: எதிர்ப்பு மிகுந்த உணர்வு
    info: "காய்சேரி நமது உடலில் பழுப்பனவற்றைச் செயலிழக்கச் செய்யும் ஒரு அடிப்படை தண்டுளூஸ்(disgust)ஆகும்\nஇதன் மீன் வளர்ச்சி : ஏற்றுக்கொள்ள எளிதான ரசங்களோடு ஓர் தடையாக செயல்படுகின்றது \nஅஃது மூக்கினை மடித்து , நீண்ட ஷௌர்ஸ் மற்றும் ஒரு குறிப்பிட்ட முக வெட்டு மூலம் காணப்படுகின்றது"
  emotion.embarrassed:
    label: சீரிழக்கம்
    summary: சமூக நிலையில் துன்புறுத்தும் ஞாலிடை
    info: "சோர்வு ஒன் சமயத்தில் நாம் கலப்படி மற்றும் அவமானகரமான உணர்வு ஆகும்\nஇது இளம் எழுச்சி(அடர்ரொஸ்ஸிங்) , கண்ணை ஓரமாக திருப்புதல் மற்றும் \nஎளிய நிலையின் ஏற்படுத்தும் ."
  emotion.excited:
    label: ஆரவை
    summary: அதிக ஆரவையுடன் மகிழ்ச்சி எதிர்பார்த்தல்.
    info: ஆரவை ஒரு நேர்மறையான உணர்வு ஆகும், அது ஏதாவது நல்ல நிகழ்வு நடப்பதை எதிர்பார்க்கும் போது ஏற்படுகிறது. இது உங்களுடைய ஆற்றலை அதிகரிக்கின்றது, இதயச் செல்லியை வேகமாக்குகின்றது மற்றும் கண்டுபிடிப்பு சிந்தனையை ஊக்குவிக்கின்றது.
  emotion.frustrated:
    label: ஃப்ரஸ்ஸ்டேஷன்
    summary: '''நோக்கு அடைய தடையால்'', கோபம் என்ற உணர்வு'
    info: "குறிப்பான தடையால் நமது இலக்குகள் மண்டபி வழியில் சரியாகச் செவ்வாக அடையாள்; ஒரு உணர்வு எழுகின்றது\nஇது கட்டுமான நடவடிக்கை(அதிர்ஷ்டமான ஏதாவது ஒன்றை நாடுதல்), அல்லது ஊழல் - ஐ உருவாக்கலாம் \n'ஃப்ரஸ்ஸ்டோரேஷன் திஹூரி'(எழுத்து ஓஹ்ஃ துரோஜன் ) , 'ஆக்ரீசன்'-ஐ குறிக்கும் ; 20 ஆம் நூற்றாண்டின் 20 ஆம் ஆண்டுகளில் ஒரு பங்கு விளையாடிய மனவியல் கோட்பாடு\nஉடலில் : கைகளை கொট்டி கொள்ளுதல் / கண்ணாடி காட்டும் குருதி / தசைகளில் தடை"
  emotion.grateful:
    label: அஹ்ஹ்ஸ்ஃ
    summary: எங்கள் வாழ்வில் நல்லது உள்ளது என்பதை உணர்ந்து நன்றி கூர்வது.
    info: காப்புறவில் நன்மையானதொரு உணர்வாகும்; எங்கள் ஆழ்தடி அலசி இருக்கும் சீர்யான ஒரு நன்றான ஏற்புடன் ஐஐஆர் ரசினஞ் ஜோடிட்டு ஓர் ஆராய்ச்சி காட்டுகின்றது.
  emotion.guilty:
    label: குற்றப்பூரிப்பு
    summary: என்னிடம் உள்ள தனிப்பட்ட குற்றநீதிகளை மீறியதன் பின் ஏற்படும் வலியான உணர்வு
    info: |-
      குற்றப் போதனமானது நாம் தவரிலி எண்ணியல் செயலைச் மேற்கொள்ளும் ஒடு உண்டாகும் ஓர் அழுத்ருத்வமாகும்
      இஃது ஏளனத்தினிழும் வேறுபடுகின்றது; குற்றப் பூரிப்பு குறிப்பிட்ட செயலில் குறிப்பிட்ட செயலில் குறிஞ்சு ஏளனம் முழு நபரை குறிக்கின்றது
      அது ஸஹஸ்ரிய ஃபங்ஷனை கொண்டுள்ளது; ஐயாக்கும் மற்றும் திருத்துவதற்கு ஊக்குவிக்கின்றது, ஜீவக்கௌரவமான செயலை வலிமைப்படுத்துகின்றது
  emotion.happy:
    label: நல்ல மனநிலை
    summary: களிப்பு அல்லது ஆரவாறு உணர்வது, திருப்பீடம் இல்லாமல் இருப்பது.
    info: சோகமின்றி களிப்பு அல்லது சந்தோஷம் ஒரு நல்ல மனநிலையை ஏற்படுத்தும். இது டொபாமின் மற்றும் சீரோட்டோனின் வெளியேற்றத்துடன் தொடர்புடையது.
  emotion.hopeful:
    label: நம்பிக்கை
    summary: எதிர்காலம் நல்லதாக இருக்கும் என்று நம்பும் ஒரு மன நிலை
    info: "நம்பிக்கை எனப் படுவது சிறந்த வரலாறுகளையும் அழியாச் செல்லும் மனஅமைப்பையும் ஒருங்கிணைத்து உணர்வு ஆகும்\nஇது இடி ஏற்புத்தின்மை(Resilience), ஓர் ஊக்கம் மற்றும் மன ரீதியான முன்னோட்டம் ஆகியவற்றை உருவாக்கும் \nஆராய்ச்சிகள் ஐஸ்ஸிள் நம்பிக்கை கூடிய நோயாளிகள் மிக வேகமாக குணமடைவார்கள்"
  emotion.hopeless:
    label: எதிர்பார்ப்பின்மை
    summary: நன்மை ஏற்பட வாய்ப்பில்லை என்று நினைப்பது
    info: "காவலின்றி இருப்பதையும், நன்மை ஏற்பட வழி கிடையாது என்ற தணியாச் சிந்தையையும் உள்ளடக்கிய ஒரு அழுத்ருப்பு ஆகும்\nஇது ஓட்ஃபில் மற்றும் தற்கொலை ஐஸ்ஸூவில் ஒரு முக்கிய காரணி ஆகும் \nஅஹோன் பீக் தனது ஞான மருத்துவ மாதிரியில் 'எதிர்பார்ப்பின்மை' என்பதை முதன்மை நம்பிக்கையாகக் கொண்டார்"
  emotion.inspired:
    label: அறியங்கள்
    summary: ஆற்ழூட்டும் சீரியல்
    info: |-
      திறனாய்வு நரம் மற்பொழி கட்டளைகள் தலைப்பகுதி சண்டைச் இடம் ஒவ்வோர் அறியஞ்ஜின் உள்ளது
      இது எஃகு ஆற்ரு ஏற்படுத்தும் ஓர் ஆற்றல் நிலையாகும்
  emotion.irritated:
    label: பொறாத்திரட்
    summary: எளிய குறிப்புகளுக்கு அதிக பதில் கொடுக்கும் நிலை
    info: "பொறாத்திரட் சுரண்டல் என்பது கவசமாக அதிகளவில் நினைவழி வயிற்று மனஅமைப்பு ஆகும், இது ஒரு உறுதியான குறிப்பிழக்கும் ஏற்படுத்தும். \nஇது ஓய்வின்மை, தூக்கமின்மை அல்லது குறிப்பிட்ட ஐரோஜன் ஹார்மோன்களின் மாற்றங்களை குறிக்கலாம்."
  emotion.jealous:
    label: ஆசூட்டி
    summary: மற்றவர்களுடன் ஒப்பிடும்போது ஏற்படும் குறைந்த உணர்ச்சி
    info: |-
      காமெட்டி எனப் பரிமறுதல் - நாம் விரும்புவதையும் ஒருவர் கொண்டிருக்கும்போது ஏற்படும் உணர்ச்சி
      இஃது தசேஜனியிலின் அளவு ஓரளவு வேறு; காமெட்டி ஹஸ்ஸிங் ஷிற்ஃ ஐஞ்ஜிள் வழியாக காமெட்டி வீட்டில் காணப்படும்,
      அது குறிப்பிட்ட உறவுகளை மிகவும் பாதிக்கும்
  emotion.joyful:
    label: '''ராதோஸ்த்'''
    summary: ஆழமான ஜொலிப்பு மற்றும் ஹஞ்சிஃ நல்லறிவு உணர்வு
    info: "களிப்பு எனப்படும் 'ராதோஸ்த்' ('радость') ஆழமான நல்லறி உணர்வு மற்றும் சீரியசாய் இருப்பவர்களின் அதிர்ஷ்டத்தின் ஒரு வடிவமாகும்\nஇது Csikszentmihalyi ஐ ஊக்குவிக்கும் ஓட்டம் - நிலை மற்றும் உள் ஊக்கத்துடன் தொடர்புடையது \nஅதன் ஏற்பாடுஃ ஸஹஜ பங்களிப்பு மற்றும் சமூக பிணைப்புகளை ஊக்குவிக்கின்றது"
  emotion.lonely:
    label: ஓஹ்மூலௌஸ்த்
    summary: ஆன்மிக தொடர்பு இல்லாததால் ஏற்படும் வலியான உணர்வு
    info: "ஒற்றைப் பிரச்னையும் மனதளவில் தலைகீழாக இருப்பதும் உண்டி வடிக்கும் சுற்றுப்புறத்தியில் நபர்களின் எண்ணிக்கையிலிருந்து அச்சிழிவில்லாமல் ஏற்படும் ஆன்மிக ஓட்டமாகும்\nஇது ஊக்கமில்லாமையோடு ஐஞ்ஜிங் பிளஸ் ஃபிஸிஷியல் ஹெல்த் பிரச்னைகளை கணிக்கும் \nஅடிக்கடி ஒற்றைப்பிரச்னை உடல் நலத்தை குறைக்கிறது"
  emotion.loving:
    label: அன்பு
    summary: இன்னொருவரை நோக்கி உள்ளத்தில் உள்ள ஆழ்ந்த நெருப்பு.
    info: நெருப்பின் கலவி ஒன்றுடன் இணக்வதற்கும், அளவுயான தன்மையோடு சொந்தச் சிலையை உருவாக்கவும், ஓஹியூட்டீன், ஃபெனெஃபிரிண், ஸரோடோனின் என்ற ஹார்மோன்கள் ஏற்படுத்தும்.
  emotion.melancholy:
    label: மெலான்கிரோசி
    summary: '''ஜூஹான்'', ''ஐஸ்ஸின்'' மற்றும் ''ஹஶ்ணிஃ'' ஆகியவற்றை கொண்ட அமைப்பு'
    info: |-
      மெலான்கிரோசி எடுத்துக் கண்டறியப்பட்ட மருத்துவம் 'இளம்' நிற சொய்வை ஒழுங்கு இல்லாமல் ஏற்படும் உணர்வு
      அஃது அழுகும் ஓர் ஐஸ்ஸின் கலப்பின் கலவையுடன் ஜீவியிழந்த ஞானம் மற்றும் ஹஷ்ணிஃஆக அமைகின்றது,
      எளிமையான வருத்தம் அல்லது குறைபாடு அல்லாமல் , இந்த உணர்வு கலை, இசை மற்றும் இலக்கியத்தில் மிகுந்த கவனத்தை ஈர்த்துள்ளது.
  emotion.miserable:
    label: துன்பம்
    summary: எளிய தொல்வி மற்றும் வருத்தம் ; வேதனையின் மிக மோசமான நிலை
    info: "குறிப்பான தொல்‍வி மற்றும் வருத்தப்படுதல் ஆயிருக்கும் ஒரு நச்சு எண்ணமளவு உணர்வு அழியா இடத்தில் ஏற்படுகின்றது\nஇது உடல் வலியால் , ஓர் உணர்வு ஈஸ்டு அல்லது இழப்பு காரணமாக ஐயருக்கும் \nஅழியா தீர்வினை மன நோயாற்றல் ஒரு ஜூஜிஸ்டங்களாக காணப்படுகின்றது"
  emotion.nervous:
    label: நெர்வியோசித்
    summary: ஒரு நினைவு ஏற்படுத்தும் நிலையில் மிகக் குறைந்த அளவு சீலி
    info: "'நெர்வியோசித்' எனப்படும் இதுவொரு மிகக் குறைந்த அளவு சீலி உணர்வு ஆகும், ஒரு முக்கியமான நினைவு ஏற்படுத்தும் நிலையுடன் தொடர்புடையது\nஇது ஃபிஸியோலஜிகல் ரூபத்தில் 'ஸிம்பாத்டிக் நரம்பு அமைப்பு' ஐ ஓட்டும் போது ஹிட்டர் -ஹெர்ஷ் , ஜீரணம் ஆகிறது \nஅழுத்தம் குறைவாக இருக்கும் போது செயல்பாடு மேம்படும் ; அதிகமாக இருக்கும் போது செயல்பாடு பாதிக்கப்படும்,\nஆனஞ்சியோசித்தை(Excite Reapraisal )என்ற தொழில்நுட்பம் ஒரு சிறந்த தொழில்நுட்பம்"
  emotion.nostalgic:
    label: நினைவு
    summary: எதிர்காலத்தில் இருந்து வந்து மனதை திரும்ப கொண்டு செல்லும் ஒரு மயக்கமான ஆனந்தம்.
    info: "நினைவு என்பது இணக்கமற்ற உணர்வுடன் தழுப்பி அலசும் ஒரு சில மயக்கமான ஆனந்தம் ; ஏற்கனவோ ஓர் ஊர் , யஞ்ஜனீஸ்(இளம் ரூபம் ) ஐக் கண்டு களிப்பும் வருத்தமும் கலந்து கொண்டு இருக்கும் .\nஅஃகிளிஸ் - ஃபிஷன் \nஆராய்ச்சிகள் நினைவு குறிப்பாக ஹௌஸ் என்ற நிழல் மூலம் மனிதர்கள் பொதுவாக கண்ணியமான தொடர்புகளை உருவாக்க உதவும் என்றும் பொருளுள்ள உணர்வை உருவாக்கும்."
  emotion.optimistic:
    label: ஓர் ஈடுபாடு
    summary: இனிய விழிப்புகளை எதிர்நோக்கும் குணம்
    info: |-
      மேலுயர்வான மனப் பழக்கத்தின் ஒருவடிவம் ஆணி எதிர்நோக்கும் சூற்றளவில் அச்சம் உள்ளது
      மார்டின் ஸீலிங்ஞான்(அச்சம் ஏற்பாடு)
      ஆணி யார்? ஓர் ஈடுபாடு ஐ ஊக்குவிக்கின்ற கஷ்டங்களை முறையாக கண்ணோட்டம் கொண்டு சமாளிக்கின்ற ஜீவிகள்
  emotion.overwhelmed:
    label: குழப்பம்
    summary: ஒரே நேரத்தில் பல விஷயங்கள் நிகழும் உணர்வு
    info: "குழப்பம் நிலையானதற்குள் தரவுச் சுமை உடலின் மணியிடல் வளங்களை அதிரவைக்கிறது\nஇது ஒரு ஆழ்ந்த எண்ணி இழப்பு(அறியாமை) , ஊக்கமிழப்பு அல்லது ஓட்டமில்லாமை ஏற்படுத்தும் \nஎதிர்கொள்ளக்கூடிய குழப்பம் உள்ளது ; நிலையான குழப்பம் தீவிரமான மன நோயை உருவாக்கும்\nநேரம் மேலாண்மை, பொறுப்பு மாற்றம் மற்றும் ஞான உணர்வு பயனுள்ள தந்திரங்களாகும்"
  emotion.peaceful:
    label: '''தெரிவால்'''
    summary: எளிய உள்நிலை மற்றும் நல்ல உணர்வு
    info: |-
      குளிர்ச்சி எனப்படும் 'தெரிவால்' - ஒழுங்கற்றவையும் மனஅச்சத்தும் இல்லாத நல்ல உணர்வு அடிப்படை நிலையின் ஓர் உணர்வாகும்
      இது ஞானஸ்தரிய ஊஹங்களோடு கூடிய மனவிழிப்பு மற்றும் ஜென் டிஸ்மீன் ஐ ஏற்றும் ஃபாராஃபிஷிக் நர்வஸ் சிஸ்டம் ஆகும்; இது ஹீர்ட் ரேட் மற்றும் பிளீட் பிரஷர் ஆகியவற்றைக் குறைக்கிறது
  emotion.pessimistic:
    label: பெசிமிசம்
    summary: மோசமான முடிவுகளை எதிர்பார்த்து கவனம் செலுத்துவது
    info: "பெசிமிசம் என்பது காணி நலக்கருத்துடன் இயற்றப்பட்ட ஒருவழி வளைவு அது ஏதோ உறுதியான கருத்து ரீதியான ஊகினூல் ஐ கொண்டுள்ளது\nஇது ஓரளவு லஞ்சம் கொடுக்கும் ;அபாயங்களை மதிப்பீடு செய்வது நல்லது \nஎப்போதும் பெசிஸம் கொண்டவர்கள் மன நோய் ,ஆரோக்கிய பிரச்சினைகள் ஆகியவை அதிகம்"
  emotion.playful:
    label: அசைவு
    summary: எளிய மனநிலை மற்றும் விருப்பம்
    info: |-
      அசைவு என்பது விளையாட்டில் இருக்கும் மகிழ்ச்சி, நல்லறியாமை அழகும் தொடர்புள்ள உணர்வுப் போக்காகும்
      இது ஆன்மீக நலம் மற்றும் கண்ணோட்டத்தின் ஒரு நல்ல ஞான ஏஜெண்டாக செயல்படுகிறது
      ஆன்மீக நலம் மற்றும் கண்ணோட்டத்தின் ஓர் அஸ்ஸெஸ்மென்ஷன்
  emotion.proud:
    label: ஹண்ட
    summary: இசை நீட்சிஃ
    info: '''மாற்றுதல்'' எனப்படுவது ''அகிம்கரா''(Ahamkarā), இசையில் ஒளி வழியாக தோன்றும் செயல்.'
  emotion.relieved:
    label: அமைதி
    summary: இது ஒரு சீரழியாச் செயல்
    info: நல்ல உணர்வுகள் மனதைப் பறித்தவுடன் அமையும் ஒரு சீரழியாச் செயல் குறிப்பாக இது எஸ்டி., ஏஜிர்ன் அல்லது ஞானத்திற்கு ஐயம் இல்லாமல் ஊஹிங் ஓர் ஜோல் ஹூஃப்ஃப்ளௌ ஸ்஥ானம்.
  emotion.sad:
    label: மகிழ்ச்சி இல்லாதவர்
    summary: சோகமடையும் அல்லது திருப்தி இல்லாமல் உணருதல், மனஅழுத்தம்.
    info: சோகம் ஒரு நல்வாழ்வின் பொதுவான காற்றாகும், ஏதேனும் இழப்பு அல்லது எதிர்பாராத தோல்வியின் பதிலளிப்பாக ஆகும். இதன் தெளிவான அறிகுறிகள் கண்ணிர், முறுக்கு முறுக்கான முகம் மற்றும் குறைந்த தன்மையான நடை.
  emotion.scared:
    label: அச்சம்
    summary: நிலையின் அல்லது ஆபத்திற்கு எதிராக பயம் அல்லது மனவளர்ச்சி உணர்வு.
    info: அச்சம் ஒரு அடிப்படையான பாதுகாப்பு உணர்வு ஆகும். இது ஏட்ரீனலின் வெளியேற்றத்தை ஊக்குவிக்கிறது, இதயத்தை வேகமாக ஓடச் செய்கிறது மற்றும் உடலை ஓட அல்லது பாதுகாத்துக் கொள்ள தயார் செய்கிறது.
  emotion.serious:
    label: நிர்மலமான உணர்வு
    summary: ஹாஸ்யமின்றி குறிப்பிட்ட விஷயங்களில் கவனம்
    info: |-
      நிலைத்தன் எண்ணமுடையவர் கலக்கப்படாமல் மற்றும் செளசூழி இல்லாமல் ஒரு விஷயத்தின் அடியோடு உணர்வு ஏற்படுத்தும் ஓர் உணர்வாகும்
      இது ஊக்கமுள்ள சூழ்நிலைகளில் முக்கியமானது,
      அது கலங்காமல் மற்றும் கவனமாக சிந்திக்க வேண்டிய சூழ்நிலைகளில் முக்கியமானது
  emotion.shocked:
    label: ஆச்சரியம்
    summary: திடீர் தகவல் / நிகழ்வு காரணமாக ஏற்படும் ஆச்சரியம்
    info: "ஷாக் என்பது திடீரெனச் சமயலறி அளவுடைய ஒரு உணர்வாகும், இது குழப்பத்தோ, மின்நொடியோ, ஏமாற்றத்தோ காரணமாக ஏற்படுகிறது\nஇதன் லட்சணங்கள் - திரைக்கண்ணாடியில் ஓர் அதிர்ச்சியை உண்டாக்கும்,\nஅதிர்ச்சியின் ஐரோப்பிய நோக்கம் : செயல்பாட்டை நிறுத்தி, \nஎதிர்பாராத தகவலை சிந்திக்க உதவும்"
  emotion.shy:
    label: ஞானமிழந்த
    summary: |-
      சமூக நிலைகளில் - குறிப்பாக தெரியாதவர்களிடம்,
      நர்வஸ் &amp;amp;&amp;amp;#47; தயக்கம்.
    info: "நடுவண் உணர்வைக் காறிலி மனதளவிற்கும் தயக்கத்தினோடும் சமூகச் செல்பாடுகளில் இழப்பது அஃது ஒரு எடுத்துக்காட்டு. \nஇங்கு ஏற்படும் ஓரளவு ஊடுருவாமை யாவரும் அனுபவிக்கும் ஒரு சாதாரண நிலை;\nஆனால் சமூக ரஸ்ஸா ஐயம்(அல்லது 'சமூக பீதி')என்ற வடிவில்\nஓர் ஆழ்ந்த நிலை கஷ்டங்களை ஏற்படுத்தும்."
  emotion.surprised:
    label: ஆச்சரியமடைந்த
    summary: திடீர் ஆச்சரியத்தை உணருவது.
    info: ஆச்சரியம் என்பது வினாடி மட்டுமே நீடிக்கக்கூடிய ஒரு குறுகிய உணர்வாகும். அது வாயைத் திறந்தபடி, கண்களை உயர்த்தியபடி மற்றும் கண்ணாடிகளை விரித்தபடி தொடங்கும்.
  emotion.tired:
    label: நிலைத்த பயன்
    summary: இறுமாப்பு அல்லது மனஅழுத்தம் உணரவும், ஓய்வு எடுக்க ஆசைப்படவும்.
    info: ஓய்வு இல்லாமை உடல் ஒரு சிறிய ஓய்வு தேவைப்படுவதைக் குறிக்கின்றது. இது ஊட்டமின்மை, பதில் நடவடிக்கைகளின் மீது குறைவான கவனம் மற்றும் குறைவான கவனம் ஆகியவற்றை ஏற்படுத்துகின்றது.
  emotion.upset:
    label: ஆத்திரம்
    summary: எதிர்மறையான நிகழ்வு காரணமாக ஐயமுறாமல் மன ஆத்திரம்.
    info: அழுக்கான நிலைமையோடுச் சரி ஆவதற்குப் பல வளைவுகள் உண்டு; இது மன அழுத்தத்தை ஏற்றுக்கொள்ளும் HPA என்னும் ஒஸ்(axis)-ஐ ஓட்டி ரூஃபீலியன் ஹார்மோனை உற்பத்தி செய்யும்.
  emotion.worried:
    label: கவலை
    summary: ஆவண்டு நிரப்பு ஐயம்
    info: |-
      கவலை என்பது சாமர்‍சியப் பண்ணையில் நடைபெறும் ஒரு உள்ளுறவு குழப்பி முன்னேற்றத்தை ஏற்படுத்தும்
      இது வாழ்விடத்தில் அச்சத்தை ஊகிக்கும் ஓர் உள்ளுறவு நிலையாகும்
      எளிய கவலை தன்மையில் மனஅமைப்பு முறையில் தயார் செய்ய ஊக்குவிக்கின்றது
