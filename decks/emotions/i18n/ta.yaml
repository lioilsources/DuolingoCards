lang: ta
pivot: false
title: உணர்வுகள்
cards:
  emotion.angry:
    label: கோபமடைந்த
    summary: வலிமையான குற்றச் சாட்டு அல்லது ஆத்திரத்தை உணர்வது, எளிய இருப்பதற்கு மாறாக.
    info: ஆத்திரம் ஒரு நினைவு நீதி அல்லது ஆபத்து குறியீடாக செயல்பாடு எழுப்பும் ஒரு உணர்வு. இது இதயத்துடிப்பை அதிகரிக்கிறது மற்றும் 'போராடு' அல்லது 'ஓடு' என்ற பதில் நடவடிக்கைக்கு உடலை தயார் செய்கிறது.
  emotion.calm:
    label: மென்மையான
    summary: அகப்புற அமைதி மற்றும் நல்லியல்பான உணர்வுடன் இருப்பது.
    info: மன மற்றும் தசை சமனை கொண்டுள்ளது. இது இதய துடிப்பை மெதுவடையச் செய்கின்றது, மூச்சை ஆழமாக்குகின்றது மற்றும் தெளிவான எண்ணம் மற்றும் நல்ல முடிவெடுப்பை அனுமதிக்கின்றது.
  emotion.excited:
    label: ஆரவை
    summary: அதிக ஆரவையுடன் மகிழ்ச்சி எதிர்பார்த்தல்.
    info: ஆரவை ஒரு நேர்மறையான உணர்வு ஆகும், அது ஏதாவது நல்ல நிகழ்வு நடப்பதை எதிர்பார்க்கும் போது ஏற்படுகிறது. இது உங்களுடைய ஆற்றலை அதிகரிக்கின்றது, இதயச் செல்லியை வேகமாக்குகின்றது மற்றும் கண்டுபிடிப்பு சிந்தனையை ஊக்குவிக்கின்றது.
  emotion.happy:
    label: நல்ல மனநிலை
    summary: களிப்பு அல்லது ஆரவாறு உணர்வது, திருப்பீடம் இல்லாமல் இருப்பது.
    info: சோகமின்றி களிப்பு அல்லது சந்தோஷம் ஒரு நல்ல மனநிலையை ஏற்படுத்தும். இது டொபாமின் மற்றும் சீரோட்டோனின் வெளியேற்றத்துடன் தொடர்புடையது.
  emotion.sad:
    label: மகிழ்ச்சி இல்லாதவர்
    summary: சோகமடையும் அல்லது திருப்தி இல்லாமல் உணருதல், மனஅழுத்தம்.
    info: சோகம் ஒரு நல்வாழ்வின் பொதுவான காற்றாகும், ஏதேனும் இழப்பு அல்லது எதிர்பாராத தோல்வியின் பதிலளிப்பாக ஆகும். இதன் தெளிவான அறிகுறிகள் கண்ணிர், முறுக்கு முறுக்கான முகம் மற்றும் குறைந்த தன்மையான நடை.
  emotion.scared:
    label: அச்சம்
    summary: நிலையின் அல்லது ஆபத்திற்கு எதிராக பயம் அல்லது மனவளர்ச்சி உணர்வு.
    info: அச்சம் ஒரு அடிப்படையான பாதுகாப்பு உணர்வு ஆகும். இது ஏட்ரீனலின் வெளியேற்றத்தை ஊக்குவிக்கிறது, இதயத்தை வேகமாக ஓடச் செய்கிறது மற்றும் உடலை ஓட அல்லது பாதுகாத்துக் கொள்ள தயார் செய்கிறது.
  emotion.surprised:
    label: ஆச்சரியமடைந்த
    summary: திடீர் ஆச்சரியத்தை உணருவது.
    info: ஆச்சரியம் என்பது வினாடி மட்டுமே நீடிக்கக்கூடிய ஒரு குறுகிய உணர்வாகும். அது வாயைத் திறந்தபடி, கண்களை உயர்த்தியபடி மற்றும் கண்ணாடிகளை விரித்தபடி தொடங்கும்.
  emotion.tired:
    label: நிலைத்த பயன்
    summary: இறுமாப்பு அல்லது மனஅழுத்தம் உணரவும், ஓய்வு எடுக்க ஆசைப்படவும்.
    info: ஓய்வு இல்லாமை உடல் ஒரு சிறிய ஓய்வு தேவைப்படுவதைக் குறிக்கின்றது. இது ஊட்டமின்மை, பதில் நடவடிக்கைகளின் மீது குறைவான கவனம் மற்றும் குறைவான கவனம் ஆகியவற்றை ஏற்படுத்துகின்றது.
