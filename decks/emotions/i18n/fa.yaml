lang: fa
pivot: false
title: احساسات
cards:
  emotion.amazed:
    label: عجاب
    summary: حس قوي، مثبت و تعجب انگيز وقتی با چیز غولپشتаз روسرخ میشويم.
    info: عیب‌انگیزی احساس شدیدی است که وقتی با چیز بزرگ و تأثیرزنده مواجه هستیم، به وجود آورده می‌شود. این حس خوشایند نفوذ درون فرد را کاهش داده و لطافت جویی با محیط زنده روزافزا می‌کند؛ پژوهشهای علمی ثابت ساخته است عجوبت ضررهای ذهنی را کاسته و عملکارهاي انساني را بالاتر بردم. ما اغلب طبيعت، موسيقى يا هنرايهاي زيباء را مشاهده كنيمى.
  emotion.amused:
    label: خوشحال
    summary: احساس تسرب خفيف يا كاريستي.
    info: پُوباونِی مانند احساس خنده کم‌عمق و تماشای جالب است؛ به طور واضح با خنده فرق دارد، زیرا هر پوَباونِی لزومًا منجر به خنده نمی‌شود. این حالت عاطفه‌ای اجتماعی است؛ ما بعضی موقعیت‌ها را وقتی آنهارا با سایر مردم درهم قرار بدهیم، شوخ‌طبع‌تر محسوس می‌کنیم.
  emotion.angry:
    label: ناพอใจ
    summary: احساس غضب عمومی است.
    info: ناراحتی احساس می‌شود به عنوان واکنش در مقابل نابرابری واقع شده، همراه با تحریکات فزایندۀ قلب که بدن را برای پاسخ «درگیر بشو» آماده می‌سازد.
  emotion.annoyed:
    label: ناچيز
    summary: حس ضعيف غصب براثر وجود انحصارهاي متكرر.
    info: ناراحتی ملایم است که با تحریکات دوباره‌شونده اتفاق می‌افتد و بسیار زود قبل از غضب شدیدتر رخ می‌دهد، نقص خواب، قحط عذره یا فشار بالا هر سه به عنوان منابع آن درنظر گرفته می‌شوند؛ تشخيص علل شخصي مهمترين مرحله جلوگيرى از حالت ناراحتي است.
  emotion.anxious:
    label: anxiety
    summary: احساس ناخوشاي ذهني بر اثر هراس و عدم يقين.
    info: انxiety احساسی است که تهدید آینده را پیش‌بینی می‌کند؛ درجه خفيف انxiety سازگار و بهبود دهندة عملكرد است. فشار قلب، عرق كردن، تنفس كوتاه شده و صافى بيشتر باعث نمایندي جسماني مي‌شوند.
  emotion.bored:
    label: نواد
    summary: احساس غیر تماسمند و بدون انگیزه.
    info: نودا حالت عاطفی منفی است که به دلیل عدم وجود تحریکات و فعالیت‌های معناگر می شود، این موضوع ممکن است باعث جستجو برای ساختار زندگی نو یا فکر خلاقانه بشود. در پژوهش ها آورده شدۀ است که بروز دائمی نودا ریسک بالقوه افسردگی را افزایش میدهد.
  emotion.calm:
    label: آروم
    summary: احساس هماهنگی داخلی و خلوت بدن با ذهن.
    info: کلید حالتی از تعادل روانی و جسمانی است که ضرب‌القلوب آرام می‌شود، نفس عمیق تر شده و به فرد در تفکر واضح و تصمیم سالم کمک می‌کند.
  emotion.cheerful:
    label: راست
    summary: وضعیت لذتبخش خوشحالی و روشن‌نمایی.
    info: رعدت نهاد احساسی مثبت است که با انگیزش زنده و خوب بودن همراه است، به شخصیت جذاب و سطح بالای عاطفه مثبت پیوند دارد؛ رعدت قابل تقلید است، حضور فرد رعدمند حال شما را بهتر می‌کند. بررسی‌ها نشان می‌دهد مردم رعدمند نظام منسجمی در مقابل آنتیبادی دارند.
  emotion.confident:
    label: خودباوری
    summary: اعتماد به نفس
    info: خودباوری حالت احساس باور به توانایی‌های خو و قضاوت شخص است، وضعیت مستقیم بدن، تماس نگاه مستمر و صدای آرام علائمی برای وجود داشتن خودباوری هستند، الی کُدر(سال ۲۰۱۲ سخنران TED ) محبوب شده است دربارۀ پوزهای فرمانروائي مثل روش جذب بالا بردن خودباوری
  emotion.confused:
    label: سردرگمی
    summary: احساس عدم قطعیت وقتی متوجه موقعیت یا اطلاعات مشخصی نشو
    info: |-
      حالت سردرگمی زمانی اتفاق می‌افتد که ما ندانیم درک صحیح وضعیت را داریم، به خاطر فقدان پسزمینه لازم و علم مناسب است؛ جزء طبیعی فراگیری هستش؛ تناقض شناختی باعث انگیزه برای رسیدن به جوابها میشه
      روی صورتمون روشن میشه با حمل سرش بطرف بالا و خطوط غلظته رو دورچشم
  emotion.content:
    label: خوشبختی
    summary: آرامش و سکوت با وجود لذت بدون تمایل به پوستارگی.
    info: خوشبختی، وضعیت عاطفی مثبت و آرام بدون نیاز به تغییر است. از خنده فرق دارد؛ خوشبختی آرامش را در بردارد، در حالی که خندیدن زنده‌تر است. بوداییسم خوشبختی (سانتوسا)، عنصر مهمی در جادهٔ روشن شدن قرار می‌دهد.
  emotion.curious:
    label: خواهش
    summary: تمایل به دانستن و درک چیزهای جدید.
    info: نوآوری احساس انگیزشی است که جستجو برای دانستن و تجربه‌های نو را آغاز می‌کند؛ با سامانه پاداش درونی به عنوان همراه، خود حالت شدید عشق فراهم می‌سازد. مهمترین نقشهٔ علمی و شخصیتی است. بچه‌ها طبیعتاً زحمت‌طلب هستند؛ نظام تحصیلی قادر به تقویت یا قمع این صفت.
  emotion.delighted:
    label: 悦
    summary: در حال حاضر، افراد تحت تأثير رویدادهای خاص و غافلت انداز، احساس عمومی زیباست.
    info: نادشنا رضایت احساسی قوی و مثبت است که به دلیل حوادث خوش‌آیند یا تعجب آور بوجود می‌آید، از شدت نسبتاً بالاتری در مقام با عشق سعادت برخوردار است و بصورت پویانه مثل جلوگیری، فراهم کردنش، خنداندن مشخص می‌باشد. عملکرد تکاملی آن شامل تقویت رفتارهاست که منجر به نتایج مطلوب می‌شود. همچنین اجتماعی واژگون است؛ لذت تقسیم شده بطور معناداری مضاعف می‌شود.
  emotion.determined:
    label: تعیُّم
    summary: هدف قوی برای رسیدن به چیزی بدون رعایت موانع.
    info: تعیین، حالت عاطفی انگیزش‌دهنده است که با هدایت متمرکز و پشتکار مشخص می‌شود. احساس آن شامل فشار دندانها، سفت شدن بدن و نگاه جدی است. تعیین به طور تنگاتنگی با مفهوم «خواست» (آنجلا درکوثر) مرتبط است؛ ترکیب عشق و مقاومت. بررسی‌ها نشان می‌دهند تعیین قادرتر از هوش در پیشبینی موفقیت است.
  emotion.disappointed:
    label: ناراحتی
    summary: احساس بد جانبهٔ عدم رضایتمندی از موقعیت فعلی.
    info: ناراحتی زمانی اتفاق می‌افتد که نتیجه با آرزوها و توقعات ما همخوانی نداشته باشد، به خصوص وقتی سرمایه‌گذاری عاطفی یا پشتکار بالاست. بررسی‌ها حائز قله است که توقعات نقش مهمی دارد؛ در صورت وجود توقعات کمتر، ناراحتی بسیار کاهش میابد.
  emotion.disgusted:
    label: ناخوش
    summary: احساس قدرتمندانه عدم تمایل به موقعیتهای بد.
    info: نفرت، احساس پایه‌ای است که ما را در برابر مواد مضر مثل غذاها و عفونتها حمراه باشد. عملکرد تکاملی آن جلوگیری از خوردن غذای فاسد است. نشان دهندهٔ آن سفت شدن انواع صفات مختلف هستند.
  emotion.embarrassed:
    label: زاهانبنِ
    summary: احساس غیرطبیعت دادن و عارف بودن در وضعیت اجتماعی.
    info: حالت خجالتی احساس می‌شود وقتی فکر کنید قوانین جامعه را نقض کردید، و با سرخ شدن رو به رو پل همراه است. حس بد در موقعیتهای اجتماعی.
  emotion.excited:
    label: ناراحت
    summary: احساس شدت نگرانی و لذت داشتن.
    info: شادی احساس عاطفه مثبت قوی‌ای است که با توقع رویداد خوب همراه است و انرژی را بالا برده، ضربان قلب را زودتر می‌کند و فعالیت ذهن خلاق را تسهیل می‌نماید.
  emotion.frustrated:
    label: afrostatcion
    summary: احساس خشم زمانی که رسیدن به هدف با مشکل رو به رو باشد.
    info: افروستاسیون احساس ناشایع است که وقتی هدف‌ها با موانع روبرو شود به وجود آمده و می تواند منجر به عملکرد سازنده مثل جستجو برای پیدا کردن جایگزین، یا غیرسازنده مثل عصبانیت بشود. فرضیه افرستاسیون - حمله در دههٔ بیستم قرن بیستم علم روانشناسی مؤثر بود.
  emotion.grateful:
    label: سپاس
    summary: احساس محترمانه تشکر برای چیزخوبی که داریم یا دریافت میکنیم.
    info: سپاسگزاری احساس مثبتی است که وقتی فهمیدن خوبی‌ها در زندگی ما را به وجود آورده، تحقیقات نشان داده که بروز منظم سپاسگذاری باعث بالاتر شدن رضایتمندی و همچون لذتهای جسمانی قطعات پاداش در مغز را فعال میکند.
  emotion.guilty:
    label: هم
    summary: احساس غم بعد انجام کنش بد.
    info: همیشه پس از کردن عمل‌های نادرست، حالت عاطفی به وجود میآید و با خجالت تفاوت دارد؛ همیشه بر رفتار مشخصی معطوف است در حالیکه خجالت شخص کلی را تحت الشعاع قرار میدهد. نقش اجتماعی آن فراوان است زیرا انگیزهٔ جلب موافقت و ساختن رفتار مناسب را القاء میکند ولی شدت بیشتریند.
  emotion.happy:
    label: خوشحال
    summary: احساس رضایت یا مشغولیت در حال جذاب.
    info: شادی حالت احساس خوب است که با آزادسازی دوپامین و سروتونین همراه می‌باشد، به شکل لبخند زدن، حرکات فعال بدن و وضعیت تشریفاتی نسبتاً باز.
  emotion.hopeful:
    label: hope
    summary: حس فراموش کردن مناسب برای آیندة جالb.
    info: امید عاطفه‌ای است که ترکیبی از خواستن برای آیند بهتر و باور به دسترسی پذیر بودن آن را شامل میشود، نقش مهمی در مقابله با شرایط سخت دارد. نتایج علمی نشان می‌دهند که بیمارانی که حس قوی‌تری از وجود امید دارند زودتر بهبod می‌گردند.
  emotion.hopeless:
    label: بداند
    summary: احساس عدم وجود آرزو برای زندگی.
    info: بی‌امیدگی حالت عاطفی منفی است که با این فرض شناخته میشود، وضعیت بهتر نمیشه. نقش مهمی در وابستگی دپرسیو و خطر انتحار دارد. الون بکس مدل رواندرمانی شناختی بی‌امیدی رو عنصر مرکزی تشخیص دادن.
  emotion.inspired:
    label: الهام
    summary: خوشحالی خلاقانه که عمل خلقی را القاء می‌کند.
    info: انشای احساسی است که با انگیزه و همراه خلاق شدید مشخص می‌شود، بخصوص وقتی شخص در تماس با آثار غیرعادی یا فرد معروف قرار دارد. به طور علمی نروتکنولوژی تقویت پرداخته سطح جلویی را فعال می‌سازد. محتمل برای توسعه در زمینه مناسب، تعقیب عمدی و باز به تجربه‌های جدید.
  emotion.irritated:
    label: ناراحتی شدید
    summary: حالة واکنش بالاتر به اندازه مواد؛ مرز غضب.
    info: |-
      ناراحتی شدید به حالت احساس عصبانیت و ناامonth است که حتی محرک‌های جزئی هم باعث واکنش منفی قویتری در فرد میشود
      ممکن است سرشار بخوابند، خستگی روزمره داشته باشد یا تجمع استرس قبلی وجود دارد
      زنها در دوران پسرفت، زمان بچهداری یا مردانگی ممکن است تحت تأثیر هورمونال برای ناراحتی آسیب پذیر باشند
  emotion.jealous:
    label: زنده
    summary: احساس منفي كه از مقايسه با ديگران بيرون ميافتد
    info: |-
      حس زایست از آن پدید می‌آیند که ما به نظر برسانم شخص دیگرچیزی را داردکه خودمان هم میخواهیم
      در مقابل حس جلاد است، زیرا زایست دربارهٔ برتری فرد دوم و جلاجت با تهدیدات عاطفی مناسب است
      ممکن است انگیزش عملکرد بهتر شما را القاء کند یا سبک غضب عميق رویتان را احساس کنيد
  emotion.joyful:
    label: رَضِی
    summary: شادی شدید و احساس فراوان؛ همراه با عاطفه مثبت قوی.
    info: 悦意是一种充满幸福的强烈积极情感。它与内在动机和心流状态（米哈里·契克森米海伊）相关联，进化功能在于加强社会联系并激励有益行为；这种情绪在全社会受到重视，在正向心理学中是幸福感的重要指标。
  emotion.lonely:
    label: تنهائى
    summary: احساس غم با عدم وجود تماس با دیگران
    info: |-
      تنهایی احساس عزلت است که مستقل از تعداد واقعی مردم در محیط فرد محسوس می‌شود؛ پیش بینن قوی مشکلات سلامتی است، زیرا تنهائی مداوم طول عمر را کاهش میدهد
      مغز به همان شکل بر روی درد جسمانی واکنش نشان داده و دردهای اجتماعی مثل آسیب فیزیکی عمل میکند
      در دوران حاضر، وبگرفتن تنهاءی موضوع مهمی در نظام عمومی سلامت است
  emotion.loving:
    label: عاشق
    summary: احساس عمیق علاقه و انگیزش برای شخص دوم.
    info: 'عشق احساسی پیچیده است که علاقه، مراقبت، اعتماد و نزدیکی را ترکیب می‌کند. به طور شناخته شده با هiptocine، دوپامین و سروتونین در انسانها متصل است. هلن فایشر سه نوع مختلف را تشخیص می‌دهد : تمایل جنسی , عاشق بودن معنوی و تعامل عمیق.'
  emotion.melancholy:
    label: меланхолия
    summary: غم خاموشاني كه ذهن فكروخواهد انداخت.
    info: مَلِنکُولی عاطفه‌ای تامل کرده است، شامل غمگین بودن و فکرشدن با زمزمه احساسات شیريني دارد. واژه آن از جمله «چرب» به معني سبز كمر در لغت يونان قديم مى رسد؛ پزشكهاي قديمي نيز وجود زيادتر اين مواد هضمى را براساس حالت شخص تعريف ميكردند.
  emotion.miserable:
    label: غم عمیق
    summary: حالت غم و رنج فوق العاده؛ مرحلۀ آخرین لحظات غم.
    info: |-
      کمرنگی احساس ترس و ناراحتی است که با عمق بسزای غم و رنج همراه می‌باشد،
      mی‌تواند به دلیل دردهای جسمی، زخم‌های قلبی یا خسارتهای معنوی باشد
      در صورت طولانی شدن آن، سبب فراموشی می‌شود؛ حمایت اجتماعی و مشاوره حرفه‌ای برای مقابله با وضعیت بد ضروریست
  emotion.nervous:
    label: ناراحت
    summary: اضطراب جزئی قبل از چیزی؛ موشهای داخل معده.
    info: ناراحتی معمولاً حالت اضطراب خفیفی است که به طور پرکران با توقع رویداد مهم همراه است. فizioloژيکا، نتیجهٔ فعال شدن سیستم عصبی سمپاتیک است؛ مثل ضربان قلب زیاد و لرزش دستان. در حد اعتدال عملکرد را بالا می‌برد ولی بسیار سنگین آن عملکرد را متلاطم می‌کند.
  emotion.nostalgic:
    label: نوستالژی
    summary: احساس شیرین و تلخ غرق در ذهن چارچوب زمان قبل
    info: |-
      نوستالژی احساس پر شیرین و تلخ است؛ به خاطر آوردن گذشته لذت‌بخش ولی همراه با درد نیز محسوب می‌شود
      این واژه را دو بخش تشکیل می‌دهند، «نوستوس» که معادل برگشت به منزل و «آلوس» به معنای درد است
      تحقیقات حاضر نشان می‌دهد که نوستالژی علاوه بر جوشیدن فرد با محیط اجتماعی، وجود شخص را قابل اندازه‌گیری ساخته
  emotion.optimistic:
    label: اُptonیسم
    summary: تمایل برای پذیرفتن جلوه‌های مطلوب و احساس اميدواری.
    info: اُptomیسم، سبک کوگنیتیو-انفعالی است که با انتظار نتایج مثبت مشخص شده‌است. مراد سلیمان در روانشناسی مثبت به عنصر مهم مقابله توجه داشته و آدمهاي اُptonیست براحتي زندگى بلندترى، سالمتر و مؤثرترى خواهد كرد. همچنين این قابل تحصيل است؛ فهمیدن چالش‌ها را به صورت موقتي، اختصاصي و تحت سيطره.
  emotion.overwhelmed:
    label: زلزن
    summary: احساس عدم تحمل تمام مشاغل موجود
    info: |-
      زهچنی هنگامی اتفاق می‌افتد که نیازها فراتر رفته و منابع ما برای مقابله با آن بسراستفاده شود
      نشان دهندهٔ خطا در توان ذهن، انفجار عاطفاً یا سکوت است
      در حد معین زهچنی قابل مدیرت است؛ ولی حالت طولانی مدت به مرور به جلوخوردگی منجر میشود
      مدیریت وقت، واگذاری و حالحالمندروزبندی راه حل موثر است
  emotion.peaceful:
    label: کلد
    summary: احساس عميق صلح داخلي و راحتى
    info: کلید به معنای حالت عاطفی مثبت بدون استرس و هراس است، این وضعیت در تمرینات مدیتاسیون خصوصاً مدیتاسیون زِن و فراگیر ذهن بالغ برآمد. باعث فعال شدن سامانهٔ نوروپاراسم‌патيک میشود که ضربان قلب را پائين آورده و فشارخون را تعدیل میکند.
  emotion.pessimistic:
    label: پسیمیسم
    summary: تمایل به انتظار نتايج ضعيف و تركيز روی نقاط ضعف.
    info: |-
      پسیمیسم سبک شناختی و هدفمندمان است که با انتظار نتایج منفی مشخص می‌شود
      نوع خفيف پسيميسيم مي تواند انطباق يافته باشد؛ ارزيابي رئالستيك ريشه به جلوگيري از خطر كمك مىكند
      پسیمیسم مداوم با بالا بردن خطر دچار شدن به فوت و بحرانهاي زيباسازي بدتر در مقام طبيعي همبند است
  emotion.playful:
    label: هرافوگی
    summary: حالت زنده و تمایل داشتن به سرگرمی و بازی.
    info: هرآفوگی، حالت احساساتی است که به خاطر بازی و هumor شادی می‌کند؛ در بزرگسالان پیش آهنگ مناسبی برای خلاقیت و رفاه ذهنی فراهم می‌کنند. تابع تحولی آن توسعه مهارت‌ها در محیط بدون خطر است.
  emotion.proud:
    label: خوشحال
    summary: احساس خشنودی از عملکرد شخصی یا گروه.
    info: غرور احساسی است که با حس موفقیت و تعلق به چیزی ارزشمند همراه است، وضعیت مستقیم بدن، سر بلند شده و قفسه‌سنگین دراز داده نمونه‌ای جهانی از علامات غرور است، غرور میتواند معافیت روحی(که انگیختن توسعه فردی را تسهیل میکند)، یا ضعف خودپسندانه باشد؛ در منظرشناسی هندوئیسم، غرور (آهمکارا) موانعتی برای پیشرفت ذهنی است.
  emotion.relieved:
    label: آسودگی
    summary: احساس خوب بعد از تموم شدن تنش یا خطر.
    info: |-
      نیرومند شدن احساس می‌شود وقتی استرس، نگرانی و دردها کم بشه
      این حالت با نفس عمیق فرورفتن عضلات تنش دار و لطافت همراسته است
      در طول زمان مهم است؛ به ما سخن می‌گوید خطر پشت سرتان رفت و حالا میتوان آرامش جلب کرد
  emotion.sad:
    label: سوگند
    summary: احساس غم یا عدم خشنده
    info: ناراحتی احساس طبیعی به عنوان واکنش در برابر ضایعه و ناامیدی است، که با دمدم‌ها، پائین رفتن زاویت لبان و تغیر حالت جسم مشخص می شود.
  emotion.scared:
    label: وستراشِنُ
    summary: احساس ترس یا حیرت به علت وجود خطر.
    info: ترس احساسی پایه‌ای است که بدن را در معرض خطر قرار دهد و باعث آزاد شدن هورمون تنش، سرعت بالاتر ضربان قلب و فعال شدگی جسم برای نجات یا مقابله بشود.
  emotion.serious:
    label: جدیت
    summary: وضعیت آرام بدون طنز؛ توجه به موضوعات مهم
    info: |-
      جدیت، حالت احساسی است که با تمرکز و عدم وجود سبک‌گیری مشخص میشود
      در موقعیتهاای مهم به دقت نیازمند هستند جلوه میدهد
      متفاوت فرهنگی در بعضی فرهنگها معنویت شناخته میشه ولی در برخی دیگر بعنوان دور رفتن
  emotion.shocked:
    label: صداع
    summary: درخورد ناگهنى به يك اتفاق ياخبر بيرون از حدثبود.
    info: شُک، احساسی شدید است که به‌واسطۀ دریافت جانبدار ناشناخته و غافلگیرنده بوجود میآید. علامات آن شامل توقف فورى حركت ها، باز رها كردن دندان ها و پهن شدن زرنیچه هاست. عملكردى كه برای متوقف كردن فعاليت و پردازندة يك خبر غيرمنتظره وجود دارد.
  emotion.shy:
    label: خجالت
    summary: ترسو بودن یا عدم تماس مناسب در موقعیتهای اجتماعی، بهخصوص با غریبستان.
    info: 'خجالت احساسی است که با ناراحتی و محدود شدن در حضور دیگران همراه است، به خصوص وقتی آشنا نباشدند. این موضوع بخش مهمی از شخصیت داخل‌نواخت را تشکیل میدهد ولی لازمًا معادل دقیق آن نیست؛ وجود سطح بالایی از خجالت عوارض جدی مثل اختلال فوبیای اجتماعی پس اندازمیانجامد. تأثیرات فرهنگی قوی بر نحوۀ تعامل با خجالت وجود دارد: بعضی فرهنگها این صفت را زشت میدانند، حال آنکه فرهنگهای دیگر آنرا ضرب الاجل محسوس میکنند.'
  emotion.surprised:
    label: صدام
    summary: احساس تعجب فوری در مقابل رویداد غافلگیر
    info: تعجب، احساسی کوتاه است که فقط به مدت ثانیه‌ها طول میکشد و با دهانت را باز نگهداشتن، بال بردن پلشت زهرای خود و تیر بستن عینک مشخص می شود.
  emotion.tired:
    label: فاقد انرژی
    summary: احساس خستگی جسمی یا ذهنی، لازمهٔ تعطیل.
    info: خستگی علامت بدن است که نشان میدهد به راحت شدنش و در حالت آرام باشد، این موضوع شامل خواب‌آلودگی، پاسخ سرعت کمتر و توانایی فکر کنندگی ضعیف ترش دارد.
  emotion.upset:
    label: اروَشُن
    summary: تغییرات عاطفه‌ای ناخوشایند باعث شدن رویدادهای منفی.
    info: روسوشِنی حالت عاطفه‌ای منفی کلی است که ترکیبی از غم، خشم و نگرانی محسوب می‌شود. واکنشی به حوادث بد، بدبینی یا درگیری است. فizioloژيکالاً محور استرس را فعال می‌سازد (Hpa)، هرمون قشر надانحتری مثل کرتوزول را بالابرده.
  emotion.worried:
    label: نگرانی
    summary: فکر منفی مرتب درباره مشکلات بعدی
    info: |-
      نگرانی حالت احساسی شناختی است که به پیش‌بینی تهدیدات ممکنه متمرکز هست
      نگرانی سطح بالا انطباقی بوده و باعث آماده شدن فرد میشه
      در صورت ناراحتی دائمی(اختلال عصبی)، عملکردهای روزمره تحت الشبه قرار میگیرند
      هوشاندیشی و متوقف کردن دلخواه دور زنجیره نگرانی، موثرترین روشه
