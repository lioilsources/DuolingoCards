lang: pt-BR
pivot: false
title: Emoções
cards:
  emotion.angry:
    label: irritado
    summary: Sentir forte descontentamento ou raiva, estar zangado.
    info: Raiva é uma emoção que surge como resposta a uma percepção de injustiça ou ameaça. Aumenta a frequência cardíaca e prepara o corpo para a reação "lutar ou fugir".
  emotion.calm:
    label: calmo
    summary: Sentir paz interior e bem-estar, estar em calma.
    info: Calma é um estado de equilíbrio mental e físico. Reduz a frequência cardíaca, aumenta a profundidade da respiração e permite pensamento claro e boa tomada de decisões.
  emotion.excited:
    label: entusiasmado
    summary: Sentir forte entusiasmo e antecipação alegre.
    info: Entusiasmo é uma emoção positiva intensa associada à expectativa de um evento prazeroso. Aumenta a energia, acelera o coração e estimula o pensamento criativo.
  emotion.happy:
    label: feliz
    summary: Sentir alegria ou prazer, estar de bom humor.
    info: Felicidade é uma emoção agradável associada à liberação de dopamina e serotonina. Manifesta-se com sorrisos, gestualidade animada e postura corporal aberta.
  emotion.sad:
    label: triste
    summary: Sentir luto ou insatisfação, estar deprimido.
    info: Tristeza é uma emoção natural como resposta à perda ou decepção. Manifesta-se com lágrimas, cantos da boca caídos e postura baixa.
  emotion.scared:
    label: assustado
    summary: Sentir medo ou terror diante de um perigo ou ameaça.
    info: O medo é uma emoção defensiva básica. Dispara o liberação de adrenalina, acelera o coração e prepara o corpo para fugir ou se proteger.
  emotion.surprised:
    label: surpreso
    summary: Sentir espanto súbito diante de um evento inesperado.
    info: Surpresa é uma emoção muito breve que dura apenas segundos. É expressa com a boca aberta, sobrancelhas levantadas e pupilas dilatadas.
  emotion.tired:
    label: cansado
    summary: Sentir cansaço físico ou mental e necessidade de descanso.
    info: O cansaço é um sinal do corpo indicando que ele precisa de repouso. Manifesta-se com sonolência, redução da velocidade das reações e diminuição da capacidade de concentração.
