lang: pt-BR
pivot: false
title: Emoções
cards:
  emotion.amazed:
    label: admiraçāo
    summary: Forte sentimentō positivo surpreendente quando alguém encontra algō extraordinário.
    info: Awe é uma emoção intensa causada ao encontrar algo imenso ou impressionante. Reduz o sentimento de importância pessoal e aumenta a sensação de conexão com os outros. Pesquisas mostram que sentir admiração reduz estresse e promove comportamentos pró-sociais.
  emotion.amused:
    label: entreter
    summary: Sensação suave de prazer ao assistir alguma diversão.
    info: O entretenimento é uma leve emoção positiva causada por algo engraçado ou interessante. Diferente da risada; rir pode ser um resultado do entretenimento, mas nem todo entretenimento resulta em gargalhadas. É uma emoção social compartilhável; coisas parecem mais divertidas quando compartilhamos com outras pessoas.
  emotion.angry:
    label: irritado
    summary: Sentir forte descontentamento ou raiva, estar zangado.
    info: Raiva é uma emoção que surge como resposta a uma percepção de injustiça ou ameaça. Aumenta a frequência cardíaca e prepara o corpo para a reação "lutar ou fugir".
  emotion.annoyed:
    label: ira
    summary: Sensação leve de irritabilidade causada pelo mesmo tipo de estimulo incômodo.
    info: Irritação é uma emoção ligeiramente negativa causada por estímulos perturbadores repetidos e frequentemente precede raiva mais intensa. Pode ser provocada pela falta de sono, fome ou sobrecarga mental.
  emotion.anxious:
    label: ansiedade
    summary: Sensação desconfortável causada pela preocupação com situações futuras incertas.
    info: Ansiedade é uma emoção que antecipa ameaças; um certo nível moderado pode ser benéfico e até melhorar o desempenho.
  emotion.bored:
    label: tedioso
    summary: Sentimento sem interesse nem algo com que se engajar.
    info: Tédio é um estado emocional negativo causado pela ausência de estímulos ou atividades significativas. Pode levá-lo à busca por experiências nuevas ou ao pensamento criativo e também motiva você do ponto de vista da evolução para buscar oportunidades. Pesquisas mostram que o tédio crônico aumenta os riscos de depressão.
  emotion.calm:
    label: calmo
    summary: Sentir paz interior e bem-estar, estar em calma.
    info: Calma é um estado de equilíbrio mental e físico. Reduz a frequência cardíaca, aumenta a profundidade da respiração e permite pensamento claro e boa tomada de decisões.
  emotion.cheerful:
    label: alegria
    summary: Estado prazeroso marcado pela animação e otimismo.
    info: Alegria é um estado emocional positivo caracterizado por uma energia vibrante e boa disposição. Está associada à personalidade extrovertida e ao alto nível de afecto positivo. É contagiosa; estar perto de alguém feliz melhora o humor das pessoas em sua volta.
  emotion.confident:
    label: autoconfiança
    summary: Crença na própria capacidade e valor.
    info: Confiança em si mesmo é um estado emocional de confiança nas próprias habilidades e julgamento. Postura ereta, contato visual direto e voz calma são expressões dessa característica. Amy Cuddy tornou famosas posturas poderosas como forma de aumentar sua autoconfiança.
  emotion.confused:
    label: confusão
    summary: Sentir incerteza sobre algo que não conseguimos entender.
    info: A confusão ocorre quando nos falta o contexto ou os conhecimentos necessários para compreender uma situação. É parte natural do aprendizado e pode estimular a busca por respostas através da discordância cognitiva. Na expressão facial, manifesta-se com inclinação de cabeça e franzimento de testa.
  emotion.content:
    label: contentez-se
    summary: Sentir paz interior através das coisas simples.
    info: |-
      Satisfação é um estado positivo de emoções calmas sem necessidade de mudança
      Diferente da felicidade que pode ser mais intensa ou animada,
      a satisfação traz uma sensação tranquila do bem estar;
      o budismo considera essa qualidade como santosha sendo essencial para o iluminamento espiritual.
      Estudos em psicologia mostram também que ter esse tipo de sentimento resulta num maior equilíbrio interno comparado com momentos efervescentes.
  emotion.curious:
    label: curiosidade
    summary: O desejo por novo conhecimento
    info: Curiosidade é um estado motivacional que impulsiona em busca de informações e experiências novas. Está ligada ao sistema mesolimbico da recompensa com o neurotransmissor dopamine - literalmente traz prazer intelectual. É importante para progresso científico e desenvolvimento pessoal.
  emotion.delighted:
    label: alegria extasiada
    summary: Forte sensação de bem estar diante um evento bom ou imprevisto.
    info: Alegria extasiada é uma emoção positiva intensa causada por eventos prazerosos ou surpresas. É mais forte que o simples sentimento de felicidade e manifesta-se com maior dinamismo como pulando, gritando rindo.Evolução funcional reforça comportamentos levando aos resultados desejados.
  emotion.determined:
    label: determinação
    summary: Intenção forte para alcançar uma meta apesar das dificuldades.
    info: Determinação é um estado motivacional e emocional caracterizado por foco no objetivo e persistência. Manifesta-se com mandíbula cerrada, corpo tenso e olhar intensivo. Está estreitamente relacionado ao conceito de 'grit' (de Angela Duckworth), que combina paixão pela meta e perseverança.
  emotion.disappointed:
    label: desapontamento
    summary: Sentimento indesejado causado pela falta da realização das nossas esperanças.
    info: Desapontamento surge quando os resultados não correspondem às expectativas ou desejos. É mais intenso com uma alta quantidade de emoções e esforço envolvidas. Pesquisas mostraram que as próprias expectativas são fundamentais; baixar suas expectativas resulta em menos decepcionantes.
  emotion.disgusted:
    label: nojo
    summary: Sentimento forte de aversão ao encontrar algo desprazeroso.
    info: Nojodo é uma emoção básica que protege contra coisas prejudiciais como comida tóxica ou doenças. Sua função evolutiva consiste em afastar o indivíduo da ingestão de alimentos estragados e pode manifestarse por meio do franzir das narinas, língua estendida e expressões faciais características. Também surge diante comportamentos moralmente repugnants funcionando com um mecanismo social regulador.
  emotion.embarrassed:
    label: rubor
    summary: Sensaçāo incômoda de vergonha numa situação social.
    info: O rubor é uma emoção social que surge quando cremos ter violado normas sociais. Manifesta-se com vermelhidão facial, desvio do olhar e postura encurvada. Tem função social de sinalizar às outras pessoas nosso reconhecimento das regras e disposição para segui-las.
  emotion.excited:
    label: entusiasmado
    summary: Sentir forte entusiasmo e antecipação alegre.
    info: Entusiasmo é uma emoção positiva intensa associada à expectativa de um evento prazeroso. Aumenta a energia, acelera o coração e estimula o pensamento criativo.
  emotion.frustrated:
    label: frustração
    summary: Sentimento irritado causado pela impossibilidade de alcançar um objetivo.
    info: A frustação é uma emoção que surge quando nossos objetivos são bloqueados por obstáculos. Pode resultar numa ação construtiva (busca de soluções alternativas), ou num comportamento destrutivo como agressão. A 'Teoria da Frustra-Agressão' foi influente no campo psicológico nos anos 20 do século XX.
  emotion.grateful:
    label: gratidão
    summary: Sensação acolhedora de apreciação pelo bom que possuímos ou recebemos.
    info: Gratidão é uma emoção positiva que surge quando reconhecemos o bem presente nas nossas vidas.
  emotion.guilty:
    label: culpa
    summary: Sensação dolorosa causada pela violação de princípios pessoais.
    info: Culpa é uma emoção que surge após cometermos algo considerado errado ou moralmente incorreto. Diferente da vergonha, ela foca no comportamento específico e não na pessoa como um todo; tem também função social ao nos incentivar para pedir desculpas e corrigirmos nossas atitudes, reforçando assim nosso comportamento ético.
  emotion.happy:
    label: feliz
    summary: Sentir alegria ou prazer, estar de bom humor.
    info: Felicidade é uma emoção agradável associada à liberação de dopamina e serotonina. Manifesta-se com sorrisos, gestualidade animada e postura corporal aberta.
  emotion.hopeful:
    label: esperança
    summary: Sentimento otimista sobre o futuro.
    info: Esperança é uma emoção que combina desejo por um futuro melhor e crença na sua acessibilidade. É fator-chave de resiliência diante das situações difíceis. Pesquisas mostram que pacientes com maior esperança recuperam-se mais rapidamente.
  emotion.hopeless:
    label: desespero
    summary: Sentimento de que o futuro nada bom trará.
    info: Desespero é um estado emocional negativo caracterizado pela convicção de que uma situação não pode melhorar. É um traço fundamental da depressão e fator do risco para o suicídio. O modelo cognitivo-t erápico desenvolvido por Aaron Beck identificou desespero como crença central.
  emotion.inspired:
    label: inspiração
    summary: Excitamento criativo que impulsiona para atividade criativa.
    info: Inspiração é um estado emocional caracterizado por uma motivação repentina e excitação criativa. Geralmente está associada com uma experiência reveladora ou contato com uma obra excepcional ou pessoa. Neurocientificamente ativa o córtex pré-frontal e os circuitos de recompensa.
  emotion.irritated:
    label: irritável forte
    summary: Estado caracterizado pela resposta exagerada diante de situações triviais.
    info: Irritabilidade é um estado de alta reatividade emocional em que até pequenos estímulos provocam fortes respostas negativas. Pode indicar fadiga, falta de sono ou acúmulo crônico de stress. Mulheres durante a adolescência, gravidez e climatério podem experimentar irritação causada por mudanças hormonais.
  emotion.jealous:
    label: ciúmes
    summary: Emoção negativa resultante do confrontamento com outras pessoas.
    info: Ciúmes é uma emoção que surge quando percebemos que outra pessoa possui algo que gostaríamos de ter também. Diferente da ciúme propriamente dita, o sentimento de inveja refere-se às vantagens alheias e não ao medo por relações próprias ameaçadas; pode servir como motivação para melhor desempenho ou causar ressentimentos profundos.
  emotion.joyful:
    label: alegria
    summary: Felicidade intensa com entusiasmo excessivo.
    info: Alegria é uma emoção positiva intensa que transborda felicidade e está associada à motivação interna e ao estado de fluxo segundo Csikszentmihalyi.
  emotion.lonely:
    label: solidão
    summary: Sensação dolorosa causada pela falta de contato com outras pessoas.
    info: Solidão é uma sensação subjetiva de isolamento independente do número real de pessoas ao redor. É um forte previsor de problemas à saúde e pode reduzir o tempo de vida quando crônica. O cérebro responde às feridas sociais da mesma forma que aos danos físicos.
  emotion.loving:
    label: amor
    summary: Sentimento forte de carinho e conexão com outra pessoa.
    info: 'O amor é uma emoção complexa que combina afeto, cuidado, confiança e intimidade. Neuroquimicamente está associada à oxitocina, dopamina e serotonina. Helen Fisherman diferencia três sistemas: desejo sexual, o amor romântico e um vínculo mais profundo.'
  emotion.melancholy:
    label: tristeza contemplativa
    summary: Trata-se de uma forma específica de luto combinada com meditações profundas.
    info: A melancolia é uma emoção pensativa que combina tristeza e reflexão com certa doçura. Deriva da palavra grega para bile negra ('mela choles'), sendo antigos médicos associavam isso ao excesso dessa substância no corpo humano.
  emotion.miserable:
    label: sofrer
    summary: Extrema mágoa e aflição; o pior grau da tristeza.
    info: Sofrimento é um estado emocional intensamente negativo caracterizado por profunda desagradabilidade e dor. Pode ser causado pela dor física, ferimentos emocionais ou perda. O sofrimento crônico pode indicar depressão.
  emotion.nervous:
    label: ansiedade
    summary: Leve tensão antes algum acontecimento
    info: |-
      A ansiedade é um estado leve de apreensão tipicamente associado à antecipação de uma evento importante.
      Fisiologicamente manifesta-se com aumento da atividade do sistema nervoso simpático: batimentos cardíacos acelerados e suor
      Ansiedades moderadas melhoram o desempenho enquanto que muito fortes prejudicam-no.
  emotion.nostalgic:
    label: saudade
    summary: Sentimento melancólico por algo no passado.
    info: A nostalgia é uma emoção cheia de doçura e amargor ao mesmo tempo; lembrar o passado pode ser prazeroso mas também doloroso. A palavra vem da combinação das palavras gregas 'nostos' que significa retorno para casa e 'algos', significando dor.
  emotion.optimistic:
    label: otimismo
    summary: Tendência para esperar bons resultados e ver aspectos positivos.
    info: O otimismo é um estilo cognitivo e emocional caracterizado por expectativas de resultados positivos. Martin Seligmann (psicologia positiva) identificou como fator-chave da resiliência. Otimosistas vivem mais tempo, são mais saudáveis e têm maior sucesso.
  emotion.overwhelmed:
    label: overload
    summary: Sensação causada pela sobrecarga excessiva simultânea.
    info: Overload ocorre quando os requisitos ultrapassam nossos recursos de lidar com situações. Manifesta-se por falhas cognitivas (incapacidade de pensar claramente), explosões emocionais ou congelamento. Um certo nível de overload é gerenciável; o overload crônico pode resultar em queima profissional.
  emotion.peaceful:
    label: calma
    summary: Profundo sentimento interno de paz.
    info: Calm é um estado positivo de ausência de estresse e perturbação. É o objetivo das práticas meditativas como atenção plena e meditações Zen. Ativa o sistema nervoso parasimpático reduzindo frequência cardíaca e pressão arterial.
  emotion.pessimistic:
    label: pessimismo
    summary: Tendência natural ou adquirida que faz você sempre antecipar coisas más.
    info: Pessimismo é um estilo cognitivo e emocional caracterizado por esperar resultados ruins. Um certo nível moderado pode ser útil para avaliar corretamente os perigos à sua volta. No entanto, pessimismo crônico está associado com maior chance de depressão e piora da saúde em geral.
  emotion.playful:
    label: brincadeira
    summary: Disposição animada e desejo por diversão e jogos.
    info: 'Brincadeira é um estado emocional caracterizado pela alegria no jogo, senso de humour e experimentalismo. Nos adultos, atua como previsor positivo da criatividade e bem-estar mental saudável. Função evolutiva: desenvolver habilidades em contexto seguro.'
  emotion.proud:
    label: orgulho
    summary: Sensação positiva da satisfação com os próprios sucessos
    info: |-
      Orgulhoso é uma emoção associada à sensação de sucesso ou pertencimento algo valioso
      Postura ereta, cabeça erguida e peito arqueado são expressões universais do orgulho
      Ele pode ser saudável motivando o desenvolvimento pessoal ou insalubre como arrogância
      Na visão Hinduismo o orgulho chamado Ahamkāra constitui um obstáculo ao crescimento espiritual
  emotion.relieved:
    label: alívio
    summary: Sensação prazeirosa causada pelo término de situações tensas
    info: Alívio é uma emoção sentida após o fim do estresse, da preocupação ou dor física. Manifesta-se com um suspiro profundo, alívio no tônus muscular e sensação de leveza corporal. É importante sob ponto de vista evolutivo pois indica que não há mais ameaça iminente permitindo ao corpo entrar num estado de repouso.
  emotion.sad:
    label: triste
    summary: Sentir luto ou insatisfação, estar deprimido.
    info: Tristeza é uma emoção natural como resposta à perda ou decepção. Manifesta-se com lágrimas, cantos da boca caídos e postura baixa.
  emotion.scared:
    label: assustado
    summary: Sentir medo ou terror diante de um perigo ou ameaça.
    info: O medo é uma emoção defensiva básica. Dispara o liberação de adrenalina, acelera o coração e prepara o corpo para fugir ou se proteger.
  emotion.serious:
    label: seriedade
    summary: Postura séria sem humor; atenção voltada para assuntos importantes.
    info: Seriedade é uma atitude emocional caracterizada por concentração e ausência de leveza ou brincadeira. É importante em situações que exigem foco e pensamento cuidadoso. Pode ser percebida diferentemente nas culturas; algumas valorizam muito a seriedade enquanto outras associam com falta de acessibilidade.
  emotion.shocked:
    label: choque
    summary: Reação emocional forte diante da recepção súbita de notícias impactantes.
    info: Choque é uma emoção intensa causada por informações ou situações imprevisíveis e surpreendentes que provocam reações como paralisar repentinamente com os olhos arreganhados e pupilas dilatas. Sua função evolutiva está ligada à interrupção de atividades para processamento dessa informação não esperada.
  emotion.shy:
    label: timidez
    summary: Ansiedade e comportamento retraído nas situações sociais.
    info: A timidez é uma emoção social que manifesta-se por meio da ansiedade e do receio na presença de estranhos ou pessoas desconhecidas. Ela está associada à personalidade extrovertida, mas não são exatamente o mesmo conceito. Uma certa dose de timidez pode ser normal, porém formas mais graves podem prejudicar significativamente os relacionamentos sociais.
  emotion.surprised:
    label: surpreso
    summary: Sentir espanto súbito diante de um evento inesperado.
    info: Surpresa é uma emoção muito breve que dura apenas segundos. É expressa com a boca aberta, sobrancelhas levantadas e pupilas dilatadas.
  emotion.tired:
    label: cansado
    summary: Sentir cansaço físico ou mental e necessidade de descanso.
    info: O cansaço é um sinal do corpo indicando que ele precisa de repouso. Manifesta-se com sonolência, redução da velocidade das reações e diminuição da capacidade de concentração.
  emotion.upset:
    label: distress
    summary: Desconforto emocional causado por evento negativo.
    info: Distress é um estado geral de emoção negativa que combina tristeza, raiva e ansiedade. É uma resposta para eventos desagradáveis, decepcionantes ou conflitos. Fisiologicamente ativa o eixo do estresse (HPO), aumentando cortisol.
  emotion.worried:
    label: ansiedade
    summary: Pensamentos repetidos sobre futuros problemas potenciais.
    info: Ansiedade é um estado cognitivo e emocional focado em antecipar possíveis ameaças.
