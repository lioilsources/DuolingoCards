lang: de
pivot: false
title: Emotionen
cards:
  emotion.angry:
    label: wütend
    summary: Starke Unmut oder Wut empfinden, ärgerlich sein.
    info: Wut ist eine Emotion als Reaktion auf wahrgenommene Ungerechtigkeit oder Bedrohung. Sie erhöht den Puls und bereitet den Körper auf die 'Kampf-oder-Flucht'-Reaktion vor.
  emotion.calm:
    label: ruhig
    summary: Inneren Frieden und Wohlbefinden fühlen, ruhig sein.
    info: Ruhe ist ein Zustand mentaler und körperlicher Ausgewogenheit. Sie verlangsamt den Herzschlag, vertieft die Atmung und ermöglicht klares Denken sowie gute Entscheidungen.
  emotion.excited:
    label: begeistert
    summary: Starke Begeisterung und freudvolle Erwartung fühlen.
    info: Begeisterung ist eine intensive positive Emotion, die mit der Erwartung eines angenehmen Ereignisses verbunden ist. Sie steigert die Energie, beschleunigt den Herzschlag und fördert kreatives Denken.
  emotion.happy:
    label: glücklich
    summary: Freude oder Vergnügen empfinden, gut gelaunt sein.
    info: Glück ist eine angenehme Emotion, die mit dem Ausschüttung von Dopamin und Serotonin verbunden ist. Sie äußert sich durch Lächern, lebendige Gestikulation und einen offenen Körpersprache.
  emotion.sad:
    label: traurig
    summary: Trauer oder Unzufriedenheit empfinden, depressiv sein.
    info: Traurigkeit ist eine natürliche Emotion als Reaktion auf Verlust oder Enttäuschung. Sie äußert sich durch Tränen, herabhängende Mundwinkel und einen hängenden Gang.
  emotion.scared:
    label: erschrocken
    summary: Angst oder Schreck vor Gefahr oder Bedrohung empfinden.
    info: Schreck ist eine grundlegende Abwehrreaktion. Er löst den Adrenalinspiegel aus, beschleunigt das Herz und bereitet den Körper auf Flucht oder Verteidigung vor.
  emotion.surprised:
    label: überrascht
    summary: Plötzlicher Staunen über eine unerwartete Situation.
    info: Überraschung ist eine sehr kurze Emotion, die nur Sekunden dauert. Sie äußert sich durch geöffnete Münder, gehobene Brauen und geweitete Pupillen.
  emotion.tired:
    label: ermüdet
    summary: Körperliches oder geistiges Erschöpfungsgefühl haben und Ruhe benötigen.
    info: Ermüdung ist ein Signal des Körpers, dass er Pause braucht. Sie äußert sich durch Schläfrigkeit, verlangsamte Reaktionen und eine verringerte Konzentration.
