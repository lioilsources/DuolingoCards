lang: ur
pivot: false
title: ہسی، غصہ، چکنی اور دل کے دوسرے جذبات
cards:
  emotion.amazed:
    label: عجب
    summary: جب کوئی عام طرح سے غیرمعمولی چیزوں کے سامنا کرو تو واقعتاً مثبت تعامل کا احساس
    info: |-
      عجوبہ ایک شدید جذبہ ہے، جو کسی بڑی چیز یا تباہ کن دھمکی سے ملاقات پر ظاہر ہوتا ہے۔
      یہ خود کی اہمیت کمزور کرتا ہے اور آپ کو حوالات سے منسلک کرنے والی فضا قائم کرتا ہے。
      تحقیق نشان دہتا ہے کہ عجوم زندگی کے استحکام کو کم کرتا ہے اور معصوم رویہ بڑھاتا ہے۔
  emotion.amused:
    label: پوباويني
    summary: خوشگوار حیرت يا فائدہ مند موڈ
    info: |-
      پوباوني مثبت جذبہ ہوتی ہے، کسی خوشگوار اور دلچسپ بات سے پیدا ہو۔

      اسکرخت نال مختلف؛ لحاف تھنواں روزانو واقعات ہندى ہت آؤ۔
  emotion.angry:
    label: غصّے میں
    summary: تند و تابکر جذبات کا احساس، غصہ یا بے حمدمحسوس کرنا۔
    info: غلطی یا خطرے کو دیکھنے پر غصہ ایک موٗڑ کی حیثیت سے اپنائے جانے والے جذبے کا نام ہے۔ یہ دل کی دھڑکن بڑھاتا ہے اور آپ کو 'قاتل یا فرار' کے رد عمل کے لئے تیار کرتا ہے۔
  emotion.annoyed:
    label: بُرا محسوس کرن
    summary: دوبارہ سے واقع ہونے والا بگڑا ہوا مواد، غصّے کا خفیف پچھتاوا حس قائم کرتا ہے
    info: پریشانی اکثر دوبارہ آنے والے تحریک کا نتیجہ بن جاتی ہے۔
  emotion.anxious:
    label: anxiety
    summary: مستقبل کے غیر واضح حالات کے باعث الجھنوں اور قلق کا منفعت عامہ
    info: |-
      انxiety ایک تشویش کے خوف سے پہلے محسوس شدہ جذبہ ہوتا ہے؛ نرم انxiety بین الاقوامی طور پر حوصلہ افزائی کرتی ہے۔
      anxiety فزیکس لحاظ سے دکھاتی ہے: دلوں کا زوروُرو، آنسوؤں کا رواج، تنگ نفسیت، مضبوط عضلات。
      mental disorder anxiety وبا چند لاکھ لوگوں کو متاثر کرنے والی ذہنی بیماری ہے۔
      cognitive behavioral therapy (CBT)، mental disorders کے علاج کے لئے سب سے مؤثر درمان ہے۔
  emotion.bored:
    label: ندا
    summary: غفلت اور واقفوں کی غلطی
    info: "نُدّا ایک منفی جذباتی حالت ہے، جو تحریرات کی عدم موجودگی یا معنوادار سرگرمی کی وجہ سے پیدا ہوتی ہے۔\n ندا شخص میں نئے تجربات کی طلب یا خلاقانہ فکر کو بڑھا سکتی ہے。\n ترقیاتی لحاظ سے دیکھنا تو یہ انفرادی قابلیتوں کی جانب راغب کرتی ہے۔ \nتحقیق کے مطابق دائمی ندا ذہنی تناسپ باعث بن سکتی ہے۔"
  emotion.calm:
    label: خیالی
    summary: اندرونی سکون اور آرام محسوس کرنا، خاموشی میں رہنا۔
    info: خیالی ذہنی اور جسمانی توازن کا حالت ہے۔ یہ دل کی دھڑکن کو کم کرتا ہے، سانس لینے کو گہرا کرتا ہے اور واضح سوچ اور بہتر فیصلہ کرنے کی اجازت دیتا ہے۔
  emotion.cheerful:
    label: ' радست '
    summary: مسرات فراخدلی اور مستقبل کے بارے میں اطمینان
    info: خوشی انسان کے مثبت جذباتی حالت، زندگی سے بھرپور دلچسپی لینا اور خوبصورت نالہ رکھنا۔ وہ عوامل جن پر انفرادی طبیعت باہمی تعلق قائم کرتی ہے اور مثبت موافقت کا تناسب بلند ہوتا ہے۔ یہ متاثرانہ ہے؛ خوش شخص موجود ہونے والے لوگوں کی نالہ بڑھاتا ہے۔ ماخذ کارروائی ظاہر کرنے والا ہے کہ خوش لوگوں کا مناعی نظام مضبوط ہوا کردتا ہے۔
  emotion.confident:
    label: خود اعتمادی
    summary: آپ کی صلاحتوں اور اقدار پر باوقعت یقین
    info: خود اعتمادی جذباتی حالت میں خود کے صلاحیتوں پر بھروسہ رکھنا اور فیصلوں پر یقین دلانا۔ سیدھی وضع، نظر آنچاند وضاحت اور توازن والی آواز خوداعتمادی کے علامات ہوتی ہیں۔ عامل کُڈی (ٹی‌ایم الگفوٗت ۲۰۱۲) قدرتی طاقت کی حرکتیں بنائے ہوئے اندازوں کو زندہ کرنے کا ذریعہ بتاتی ہیں۔ یہ چھوٹے قدموں میں کامرانی اور مثبت واپسی کے ذریعے تشکیل پاسکتا ہے۔
  emotion.confused:
    label: دشوارگزری
    summary: ایسا حال ہوجائے جب کسی صورتحال یا معلوم وضاحت موجود نہ ہوا
    info: ہمیں جب سمجھ نہ آئے اور معلومات کا فقدان رہے تو دشوارگزار حیرت پیدا ہوتی ہے۔ یہ تعلق فطری طریقوں کا حصہ ہوتا ہے؛ شناختی عدم تسلیم خود بخوبی جوابات کی تلاش کرنے کو متاثر کرتا ہے۔ چہرے پر، سروکار لینے والی حرکتوں کے ذریعے ظاہر ہوسکتا ہے۔ زبانی تعامل میں غلط فہمی وجود میں آسکتی ہے؛ استفسارات کرنا ضروری ہے۔
  emotion.content:
    label: سبکومجنست
    summary: زائد درخواست کے بغیر اطمینان کی چپ و غطا
    info: سکویونوسٹ سے مطلب اطمینان کا جذبہ، بنا تبدیلی کی ضرورت پڑھائی۔ یہ خوشی سے مختلف ہوتا؛ سکوئنوسٹ شانت ہوتا تو خوشی زندگی والی لگتا۔ بدھ مت میں سکوٗجِنوَنسْٹ (سانتوسا)، روشناس کی راستہ میں بنیادی فضیلت کے طور پر دیکھا جاتا۔ ذہنی حالت کے علم نامعلوم کارروائیوں کا اندازہ ہے کہ سکُوجِنوَنسْٹ عظیم الشان آزردگی سے قطع نظر مضبوط ہوتا
  emotion.curious:
    label: |
      زچداوسٹ
    summary: تازہ علم و غیرفہمی کی خاطر
    info: |-
      نوآوری کے حصول اور تجربات میں شامل رہنے کا آغاز کرنے والی مووٹائزنگ سطح۔
      یہ دوا پامینر نظام جاری کرتا ہے، زچداؤسٹی فطرتا خوشی لاتی ہے。
      علمی طور پر بڑھوتری اور ذاتی نشوونما کے لئے ضروی ہے۔
  emotion.delighted:
    label: خوشی کا شدید ذائقہ
    summary: پرسوز واقعات یا تعجب کے بعد غائب ہوا ہوا شدت اختیار کرتا ہے
    info: "نادشِنا ردوست ایک توانا مثبت جذبہ ہے، خوشگوار واقعات یا حیرت کے باعث پیدا ہوتا ہے۔\nاس سے عام خُوبصورتی زور دار طریقے سے ظاہر ہوئی چل بسر نظر آتا ہے، مثلًا قدم چھلانگ لینا، صدائیں بلند کرنام، ہنسی。\nایولوشنری فункشن: ان رویوں کو مضبوط بنانے والی جس سے مرغوبہ نتائج حاصل ہوجاتے ہیں۔ \nیہ سماجی طور پر عفونت والا؛ مشترکہ خوشی دوقتلہ سے زائد ہوسکتی ہے۔"
  emotion.determined:
    label: فطری طاقت
    summary: '''بلا روڑے آزمائیں کسی مقاصد کو حاصل کرنے کا مضبوط منصوبہ'
    info: 'یہ ایک محرک جذباتی حالت ہے، جو مقصد پر مرکوز رہنے کا تصور دیتی ہے۔ چہارم سختی، بدن کشادگی، اور شدید نظر کے ذریعے ظاہر ہوتا ہے۔ یہ ''grit'' (انجلہ ڈاک ورت) کے خیالات سے قرب لحوظ ہے: عشق اور استقامت کا تابعدار۔ تحقیقات کا اندازہ ہے کہ فطری طاقت کامرانی کا زیادہ صحیح پروجیشن فراہم کرنے والی صفت ہے۔'
  emotion.disappointed:
    label: ذکلمان
    summary: واقعیت آپ کی توقعات کو پورا نہ کرنے پر غیر حوصلہ افزاء محسوس ہونے کا احساس.
    info: ذکلماں اس وقت پیدا ہوتی ہے جب نتائج توقعات یا خواہش کو مطابق نہیں رہتا۔ واقعی زور دینے والی موشنز سخت متاثر ہوجاتی ہیں، بالخصوص جب عاطفی لگاؤ بڑھنے والا ہو۔ تحقیقات ظاہر کرتی ہیں کہ توقعات مرکزی عنصر ہیں؛ کم توقعات کم ذکلمان کا باعث بن سکتی ہیں۔
  emotion.disgusted:
    label: ذمٗ
    summary: جذباتی طور پر قابل ذکر عدم الرضّا کے موقع پر مضبوط رد عمل
    info: |-
      زچوکن بے ضرر اور نقصان دہ چیزوں جیسے زهريلे کھانے، مرض وغیرہ سے آپ کا تحفظ فراهم کرنے والی بنیادی موشنگ تاثرات ہوتا ہے۔
      ایولوشناٹل مقصد: خراب غذا استعمال کرتے روکتا ہے。
      اس وقت پیدا ہونوسنبھالتے رخسارہ، لبڑاتے منہ اور زبان باہر نکالتے ظاہر ہوجائے گا۔
  emotion.embarrassed:
    label: شمات
    summary: اجتماعی حالات میں غیر ضروری شرم کا محسوس
    info: "زہانبنی اجتماعی جذبے کا نام ہوتا ہے، جو پیدا ہوتا وقت وہ محسوس کر رہے ہوں کہ سماجی قوانین توڑ دئیس۔\nاسکا ظہور لالچھتائی، آنکھ بند کرناء تے خود کل حالت میں فرق کرونا شامل ہوندا ہِے۔ \nایݨ اُدّار اجتماعی مقصد رکھتا ہِے: لوگواں کول بتاتا ہِے کہ ہم سمانتقاعد قانوناں کول زبردستی مجبوتوں ہَن。\nتحقیقات کتبه ثابت کرتيا ہن کہ عام طور پر شرم کردؤلا شخص لاڈوار بندر ہن。"
  emotion.excited:
    label: enthused
    summary: خوشی کے انتظار یا بڑھتی خوشی کا محسوس کرنا۔
    info: enthousiasm زوردار مثبت جذبہ ہوتا ہے جو پسندیدہ واقعات کے امکان سے منسلک ہوتا ہے۔ یہ توانائی بڑھاتا ہے، دل کی دھڑکن تیز کرتا ہے اور خلاق ذہنی فعالیت کی حوصلہ افزائی کرتا ہے۔
  emotion.frustrated:
    label: فسطراچن
    summary: جتنے وقت آپ کے مقصد کمتر توانائی کی وجہ سے متاثر ہونے کے باوجود
    info: 'فرسٹریشن وہ جذبہ ہوتا ہے جو پیدا ہوتا ہے اگر آپ کے مقاصد راستے میں حائل تکالیف سے روک دئیے جائیں۔ یہ موثر عمل (ایلٹرن٩ کھوجنا) لانے والی بات بن سکتی ہے، یا نقصان دہ (غصّہ)، فرسٹریشن تھیوری (افسردگی - غضب کی عقلی تعلقات ) بالعصر صرف ایک نفسیاتی علمی نظام تھا۔ شارحی ظواهر : انگڑائی ختم کردینا , قرمزی ، مشق کشماشوں'
  emotion.grateful:
    label: شکرگزاری
    summary: اس وقت آرام دہ قدردانی کا محسوس کرنا جب ہمارے پاس موجود ہے یا ہمیں ملتا ہے
    info: "شکرگزاری وہ مثبت موqing ہوتا جو پیدا ہوتا ہے جب ہم اپن زندگی کے فائدے سمجھتے ہیں۔\n مثبت نفسیاتی تحقیق نظر ثانی کرتی ہے کہ شکرگزاری کا بار با ر ظاہر کردغناست خوشحالی کو بلند کرنے میں مدد دیتا ہے。\n یہ عقلمندی کے انعام مرکز کو حرکت دیتا، جس طرح جسمانی لطف کروانا۔ \n روزمرہ غور کتابچہ لکھنا حوصلہ افزائی کے درجہ کو بڑھانے کا سب سے مؤثر ذرائع میں سے ایک ہے۔"
  emotion.guilty:
    label: ذمہ
    summary: خود کے قدر مشینوں کی توڑفٹ کرنے والے بعد دردوئندھ کا احساس
    info: ذمہ ایک جذبہ ہوتا ہے، جو کسی برا عمل پر محسوس ہونے لگتا ہے۔ ذمہ عار سے مختلف ہوتا ہے؛ ذمّت خاص طور پر آدمی کے فعل پر مرکوز رہتی ہے، حالانکه شرم شخص کے حوالے سے عام چیز ہوتی ہے۔ یہ سماجی مقصد کی نزاکتوں کو مضبوط بناتا ہے، معافی مانگنے اور تبدیلی کرنے کی حرکت کو فروغ دیتا ہے۔ غیر صحت مند ذمہ (اوراق، دائمی)، deprssion کی جانب لے جاسکتا ہے
  emotion.happy:
    label: خوش
    summary: ریاضت یا خوشی کا احساس، بہتر مزاج ہونے کا معنی
    info: خوشی دوپامائن اور سروٹونین جیسے چمکدار مواد کے آزادانہ رہائش کے ساتھ منسلک ایک پرسکول عاطفی حالت ہوتی ہے۔ یہ مسکراہٹ، زندگی کی حرکتوں کے ذریعہ ظاہر ہوتی ہے اور باڈی لینگوئج کے کھلے انداز کے ساتھ۔
  emotion.hopeful:
    label: امید
    summary: مستقبل کے لئے مثبت الجھاؤ
    info: امید وہ جذبہ ہے، جو اچھی مستقبل کا خواہش مندگی اور اس پر قربانی سے ملکر بنتا ہے۔ مشکلات وقت میں استحکام کا حوالدار فرد ان لوگوں کو دنیا نظر آتا ہے جو زندگی کے تغیرات کو برداشت کرنے کی صلاحیت رکھتے ہیں۔ تحقیقات ظاہر کرتی ہیں کہ بالائے طاقت والے مریض زودتر شفایابی اختیار کرتے ہیں۔
  emotion.hopeless:
    label: بےنداں
    summary: مستقبل کچھ اچھا فراہم نہ کرسکتا ہے
    info: "بے ندامت ایک منفی جذباتی حالت ہوتا ہے، جس کو خصوصیت سمجھ لینا بڑا مشکل محسوس ہونے والی صورتحال تبدیل نہ ہونے پر قائل رہنا۔\n\nیہ deprssion کا مرکزی عنصر اور خودکشی کے خطرات کا عامل ہے。\naaron beck کے شعوری معالجہ کے ماڈل نے بے نداں کو بنیادی باور کار دیکھا۔ \nنظر ثانی اور شعوری تنظیم دونوں مؤثر طریقۂ عمل ہیں"
  emotion.inspired:
    label: روحن
    summary: تخلوقی وجد، جو عمل کرتے وقت حرارت پیدا کردیتا
    info: الروح محرک ایک جذباتی حالت ہے، جو فوراً موٹر کن خواہشات اور تخلّقی وجد سے مشابهت رکھتا۔ عام طور پر یہ قدمِ نظر یا عظیم الشان شخص یا آثار کے دیدار سے منسلک ہوتا ہے۔ علم ذہانت کے لحاظ سے، یہ قدامی صدارۂ بازوں اور انعام مرکز کو بڑھائپ زدگی دیتی ہے۔ اسے محیط، غرض شعوری تلاش کرنے والے روایتی نظام اور نئی تجربات کیلئے کھلنے والی دروازاں کے ذریعے تشغیل دی جاسکتی ہے۔
  emotion.irritated:
    label: سخت غصّہ
    summary: چھوٹی موٹی چیزوں پر زبردست واکاوݨ؛ غضب کی حد
    info: |-
      پریشانی اکثر جذبات کے طور پر بڑھتی ردعمل، تحریر میں ناگزیر رد عمل۔
      اس سے ذہنی تناؤٗ، خواب کم یا دبائو زائد کا اندازا لگایاجاتا ہے。
      جوان عورتوں، حاملہ یا وسط عمر والی عورتوں میں ہارمونل بنیادوں پر پریشانی عام ہوتی ہے۔
  emotion.jealous:
    label: جست
    summary: منفعت برائے جذبہ، جو دوسروں کے مقابلے سے وجود میں آئے
    info: "زہر ایک جذبہ ہوتا ہے، جو پیدا ہوتا ہے کسی دوسروں کو نظر آتا ہے وہ کچھ رکھتے ہیں جن سے ہم خواہش مند ہیں۔\n زہر حسد سے مختلف ہوتا ہے؛ زہر دوسروں کے فائدے سے متعلق ہوتا ہے تو حسد ذاتی تعلق کے بارے میں خطرات کے باعث ہوتا ہے。\n یہ لوگوں کو بہترین عمل کرنے کی طرف متوجہ کرسکتا ہے یا غصّہ اور بدظنی کا باعث بن سکتا ہے۔ \n عالمِ گلوبال ثقافتوں میں لُضروب صفت زہر کا عام معنوٰادی شمار ہوتا ہے۔"
  emotion.joyful:
    label: خوشی
    summary: شدید شوق اور زبردستی؛ مثبت حالتوں کا بروقت انحصار
    info: 'خوشی اکثر مثبت موٹوواشن سے جڑی ہوتی ہے، خاص طور پر فلو کی حالت (سزنتمحلائ)۔ ترقیاتی مقصد: رشتگان بندھن وں مضبوط بنانا اور نفع دیندغا لاء حرکت کرنے والی قوت چاہتا ہے۔ عام لوگوں کل آبادی کے ذرا عظیم الشان غصّہ؛ مثبت نفسیات میں یہ تحفظ (웰빙) کا مرکزی معیار ہوسکدا ہے۔'
  emotion.lonely:
    label: تنہائی
    summary: ذرا ذرا رابطہ قائم کرنے کی عدم موجودگی کی وجہ سے الجھن
    info: ہمیشہ کے لئے تنہائی محسوس کرنا صحت سے جڑا مسئلہ پیدا کرتا ہے اور زندگی کو ختم بھی کردیتا ہے۔ دماغ تعلقی درد اور فزکل دردونام و نسبت ایک جیسے رد عمل ظاہر کرتا ہے۔ موجودہ دور میں، عالمی طور پر لوگوں کی جانب سے منفعت حاصل کرنے والی غیر ضروری تنہائی عام مشکلات میں شامل ہوجاتی ہے۔
  emotion.loving:
    label: محبت
    summary: دُوسر شخص کے مقابلے میں زبردست موٗجِ رفاقت اور شدتِ تعامل
    info: محبت ایک پیچیدہ جذبہ ہے، جو مایوس کنگت، دلچسپی لینا، بھروسہ اور قرب وصل شامل کرتا ہے۔ نوروشیمئائی طور پر یہ آکسيٹوزائن، ڈوپامائن اور سروتونن سمیت مرعات سے منسلک ہوتا ہے۔ هلین فشر تین نظام تشخیص کرتی ہیں؛ جنسی خواہش، عاشقانہ محبت اور عميق الجذبہ۔
  emotion.melancholy:
    label: میلانکولی
    summary: ایک شام سنّاتے وقت کی اندرونی احساس
    info: میلانکولی افسردگی، غور کرنا اور خوبصورتی کے عوامل سے مل کر بنتا ہے۔ یہ قدیم یونانی لفظ 'ملن' جس کا معنی نالج وحشت ہوتا ہے، پر مشتمل ہے؛ قدیم طبی ماہرین تاریخی اعتبار سے چھائے والے زہر کو ذمہ دار قرار دیتے رہے۔ فرق تو دردگر آرت، موسيقى اور أدب اسے عام طور پر حواله دیتا ہے۔
  emotion.miserable:
    label: ترابیني
    summary: شديد ناخوشی؛ غم کا بدترین مرحلہ
    info: |-
      تڑپن ایک شدید منفی جذباتی حالت ہے، جو عميق ناگواری اور تکلifs سے مخصوص ہوتی۔
      اس کا باعث فزائی درد، موخرانہ زخم یا کسی قسم کھونا بھی ہوسکتا ہے。
      چرخ وار تڑپن دباؤ کا علامات ہوجاتا ہے۔
  emotion.nervous:
    label: نا روݙِٗزوَّ
    summary: ایسا غصّہ جب کچھ شروع ہونے والا ہوا کرے
    info: نارووزیتا معمولاً کسی اہم واقعے سے پہلے آئندہ وقوعات کا توقع لگانے والی حالت ہوتی۔ فزیولوجیک طور پر، نارووزیتائی جذباتی نظام کی بڑھوتری حرکت کا باعث بن جاتی ہے؛ دلوں کا زوروُ قطار، عرق خطا۔ درج ذیل حد تک نارووزٹا عمل کرنے کی صلاحیتوں کو بہتر کرتی ہے؛ لیکن انتہاء کردہ حالات عمل کروانے کی صلاحت کشتندا رہتی ہے۔ نارووزیتائی کو جوش وخروش میں تبدیل کرنے کی تقنية موثر حربہ ثابت ہوسکتی ہے
  emotion.nostalgic:
    label: نوسلوجی
    summary: غائبانہ دور حاضر کے بعد غلط موسم
    info: نوستالجی ایک محسوسات کا جذبہ ہے، پچھلے دنوں کی خاطر ناممکن لگتی ہے۔ یہ الفاظ قرون وسطی سے ماخوذ ہیں - 'نواسٹس' (واپس آنا)، اور 'آلوس' (درد)۔ تحقیق کے مطابق نوسلوجی رشتوں کو مضبوط بنانے اور معنی بخش زندگی کا احساس فراہم کرتی ہے۔
  emotion.optimistic:
    label: aoptimsmus
    summary: برحقائق بھروسہ کرنے والی تمعدّل
    info: "اُپتیمزم کوگنٹسواں اور جذباتی طریقہ زندگی چارکتر سے مخصوص مستقبل کے پازاتیو نتائج کے توقع۔\nmartin seligman(پوزاتیو نفسیات)، اُپتیمزم کلیدی عامل قوت مقاوَمت حساب دخول فرمایا。\noptimists،زندہ رہتا ہے، صحت مند ہونااور کامیاب ہونا۔ \naupتمسموس کوتعلیم دینا ممکن ہے: مشکلات کووقتی، خاص اور متاثرات وضاحت."
  emotion.overwhelmed:
    label: زہلچنی
    summary: ایسا موقع جب تمام چیزوں کا بوجھ ایک ساتھ ہمارے اوپر غالب ہوجائے
    info: زہلچنی اس وقت پیدا ہوتی ہے جب مانگ آپ کے ذرائع برداشت سے تجاوز کردیتی ہے۔ یہ شعوری ناقص عمل، موذون طوفان یا فرسٹ بن جانا ظاہر ہوسکتا ہے۔ زہلچنی کی خاص قسم تحمل کرنے لائق ہوئی؛ دیرینہ زہلچنی بروقت حوصلہ رفتن کی طرف جاتی ہے۔ وقتوں کا مناسب استعمال، معاملات تقسیم کرنا اور حالِ موجودہ کا علم مؤثر حربے ہیں
  emotion.peaceful:
    label: چین
    summary: دلوں کے اندر عمیق آرام اور تحمل کا احساس
    info: کلید ایک مثبت جذباتی حالت ہے، توانائی کا فقدان نہیں۔ یہ خصوصتاً منٹفولنسس اور زن مدٗتیشن کے ذریعے پایا جاتا ہے۔ یہ سبھوگتاؤ نظام فعال کرتا ہے، دماغ کی شرح اور بلڈ پروسوڑ رفتار کو کم کردیتا ہے۔
  emotion.pessimistic:
    label: حسرتوں کا احساس
    summary: منفی نتائج کی منتظری اور غلطیوں پر مرکوز ہوجانا
    info: نفیم کا تصور اکثر منفی نتائج کے بارے میں سوچنا، جس طرح دلبرداشتگی کا خوف رہتا ہے۔ حوصلہ شکنان ذہن عام طور پر زندگی کے مشکلات کا اندازہ لگانے میں مددگار ثابت ہوتا ہے۔ لیکن دائمی نامساعد رویہ فروتنی کے علاقوں میں شامل ہونے والے لوگوں کے درد اور صحت کے معاملات میں بدترین نقصانات کا باعث بن سکتا ہے۔
  emotion.playful:
    label: هراؤسٹ
    summary: ذمابد اور غیرملفوظ اندازنالج اور تفریح کے خواہش
    info: 'ہراؤسٹ جو ایک عاطفی حالت کا نام ہے، مزاحمت، تفریح اور آزمائش سے لطف اندوز رہنے والی خوشی پر مشتمل ہوتی۔ بالغ لوگوں میں یہ قدرتی طور پر استعدادِ فکر اور ذہین تناسق کا براجمان ثبوت ہوسکتا ہے۔ ترقیاتی مقصد: صلاحیتوں کو تحصیل کرنے کے لئے امن و سلامت کے مناسب ماحول میں۔ اسٹیوارٹ برائن (قومی دبستان معاملات)، بتلاتے ہیں کہ دبستن زندگی کے تمام مرحلوں میں صحیح عمل کروانے کے لئے ضروری چیزوں میں شامل ہے'
  emotion.proud:
    label: غلط
    summary: ایک مثبت لطف، ذاتی کامرانی یا تنظیمات سے
    info: "غرور ایک جذبہ ہے، کامیابی یا مفید چیزوں سے تعلق رکھنے والی خوشی۔\nسمت دانت بند کرنا، سراونٹو بنانا اور پستان وسعت دینا غرب نمائش کرنے کے عالمی طور پر عام انداز ہوتے ہیں。\nیہ صحت مند (توسعہ کی حوصلہ افزائی کرتا)، یا بدصورتحال (خودغرضی) ہوسکتا ہے۔ \nhindu فلسفہ میں غرور(احمکار) ذہنوں کے معراج کا روڑّا آگے بڑھانے والا ہے۔"
  emotion.relieved:
    label: نفاس
    summary: خطرے یا تناؤ کے بجھوتے وقت حصول نفاست کا محسوس کرنے والافرد
    info: نفاس ایک جذبہ ہے، تھوڑا سارا دم کرنا، مسلات آرام پانچنا اور خوشگوار لگتے روزمرہ مشغولیتوں کے بعد۔
  emotion.sad:
    label: غمگین
    summary: غم، ناراحتی محسوس کرنا یا افسردہ ہونے کی حالت۔
    info: غم ایک قدرتی جذبہ ہوتا ہے جو کسی کھوئی چیز یا خوشخبری پر رد عمل کے طور پر ظاہر ہوتا ہے۔ یہ آنسوؤں، منہ کے کناروں کے ڈالنے اور سر جھکانے کی شکل میں ظاہر ہوتا ہے۔
  emotion.scared:
    label: خوفزدہ
    summary: خطر یا خطرے کے باوجود سے خوف یا دھمکی محسوس کرنا۔
    info: خوف ایک بنیادی دفاعی جذبہ ہے۔ یہ آدمی کو فرار یا تحفظ کے لئے تیار کرنے کے لئے اдрینالائن کی رہائش، دل کی دھڑکن بڑھاتا ہے۔
  emotion.serious:
    label: جدیت
    summary: بدبختی؛ غفلت
    info: جدیت اکثر توجہ کے درخواست شدہ حالات میں ضروری ہوتا ہے۔ بعض ثقافتوں میں جدیت قدر سمجھا جاتا ہے، دوسری طرح ناممکن بنا رہتا ہے۔ حوصلہ و خوشگواری کا تعادل نفسانی انعطاف پذیری کا آسان بنایا جائے
  emotion.shocked:
    label: شاد
    summary: غیر متوقع خبر یا واقعہ کے ذریعے طاقتور دماغی عدم استعداد
    info: |-
      ہلاکت ایک شدید جذبہ ہے، غیر متوقع، حیران کن معلومات سے پروگھٹا۔
      اس کے علامات تیز رفتار تعجب، منحندرخ زبان بند نہ ہونا اور آنکڑوں کے وسعت اختیار کرنا شامل ہوتے ہیں。
      evolutionary مقصد: فعالیت روکنے اور غیر متوقع معلومات کو پروسیسر کرنے کے لئے
      جذباتی صدمہ (心理创伤)، دراز المدت نفسیاتی اثرات مرتب کرسکتا ہے
  emotion.shy:
    label: حیا
    summary: اجتماعی حالات، خصوصًا غیر معروف لوگوں کے ساتھ تعامل میں تشویش و عدم آزادی
    info: حیا اجتماعی جذبات کے طور پر ظہور پذیر ہوتی ہے، دوسروں کی موجودگی میں تشویش اور خاموشی سے۔ حیا عوامل کافی حد تک قومیتیاتی بناء پر مختلف ردعمل نمایان فراہم کرتی ہے؛ بعض ثقافتی نظاموں میں حیا بطور شائستگی منظور کی جاتی ہے تو دوسری صورتوں میں رواداری کی رکاوٹ کے طور پر درج ہوتی ہے۔
  emotion.surprised:
    label: ہچکی لگنے والا
    summary: غیر متوقع واقعات پر اچانک حیرت محسوس کرنا۔
    info: حیرت بہت چھوٹی موٹی جذباتی تحریک ہوتی ہے جس کا عرصہ صرف سیکنڈز تک رہتا ہے۔ اس کے ظہور کے طور پر منہ کھلا رہنا، آنکھوں کے بال بلند ہونا اور دید کشادہ ہوجانا شامل ہوتا ہے۔
  emotion.tired:
    label: تھکا
    summary: فِزیکل یا ذہنی طور پر تھکاوٹ محسوس کرنا، آرام کی ضرورت ہے۔
    info: تھکاوٹ جسم کا اشارہ ہوتا ہے کہ وہ آرام کی ضرورت رکھتا ہے۔ یہ سوئی کی لالچ، ردّ عمل کم ہونا اور توجہ دینے کی صلاحیت کم ہونا کے ذریعے ظاہر ہوتا ہے۔
  emotion.upset:
    label: غصّہ
    summary: منفعت مناسب موٞدن توَ لازمي حالِي درُونِى تبدیلی
    info: روزانہ زندگی کے ناخوش آئیندہ واقعات، خفافسانوں اور تنازعات سب پر غم، جذباتی عدم استحکام محسوس کرنے والی حالت ۔ فزیولوجیکل طور پر یہ دباﺅ کا مرحلہ شروع کرتا ہے جس میں قلب رت بڑھتا ہے۔ جذباتی تنظیم مثل نفسیاتی علاج اور ذہنی تعامل رواداری کو برقرار رکھنے میں مدد کرسکتی ہے
  emotion.worried:
    label: فکر
    summary: مستقبل کے مسائل کے بارے میں غلطی لاحق کرنے والی باربر فکر
    info: "چیزوں کے ممکنہ خطرات سوائے باربار فکر مند رہنا اور تشوّش۔\nmild anxiety adaptive ہوتا ہے جس سے آپ ذہنوں طرح پختگی حاصل کرتے ہیں。\ncronically worry (anxiety disorder)، دِروازۂ زندگی کام نقصان توڑتا، عام حالات سے دور\r\nmindfulnes اور عمدہ وضاحت والی قربت کھونے والا مشغلہ موثر تقنيات ہيں"
