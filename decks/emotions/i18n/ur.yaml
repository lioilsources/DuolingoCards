lang: ur
pivot: false
title: ہسی، غصہ، چکنی اور دل کے دوسرے جذبات
cards:
  emotion.angry:
    label: غصّے میں
    summary: تند و تابکر جذبات کا احساس، غصہ یا بے حمدمحسوس کرنا۔
    info: غلطی یا خطرے کو دیکھنے پر غصہ ایک موٗڑ کی حیثیت سے اپنائے جانے والے جذبے کا نام ہے۔ یہ دل کی دھڑکن بڑھاتا ہے اور آپ کو 'قاتل یا فرار' کے رد عمل کے لئے تیار کرتا ہے۔
  emotion.calm:
    label: خیالی
    summary: اندرونی سکون اور آرام محسوس کرنا، خاموشی میں رہنا۔
    info: خیالی ذہنی اور جسمانی توازن کا حالت ہے۔ یہ دل کی دھڑکن کو کم کرتا ہے، سانس لینے کو گہرا کرتا ہے اور واضح سوچ اور بہتر فیصلہ کرنے کی اجازت دیتا ہے۔
  emotion.excited:
    label: enthused
    summary: خوشی کے انتظار یا بڑھتی خوشی کا محسوس کرنا۔
    info: enthousiasm زوردار مثبت جذبہ ہوتا ہے جو پسندیدہ واقعات کے امکان سے منسلک ہوتا ہے۔ یہ توانائی بڑھاتا ہے، دل کی دھڑکن تیز کرتا ہے اور خلاق ذہنی فعالیت کی حوصلہ افزائی کرتا ہے۔
  emotion.happy:
    label: خوش
    summary: ریاضت یا خوشی کا احساس، بہتر مزاج ہونے کا معنی
    info: خوشی دوپامائن اور سروٹونین جیسے چمکدار مواد کے آزادانہ رہائش کے ساتھ منسلک ایک پرسکول عاطفی حالت ہوتی ہے۔ یہ مسکراہٹ، زندگی کی حرکتوں کے ذریعہ ظاہر ہوتی ہے اور باڈی لینگوئج کے کھلے انداز کے ساتھ۔
  emotion.sad:
    label: غمگین
    summary: غم، ناراحتی محسوس کرنا یا افسردہ ہونے کی حالت۔
    info: غم ایک قدرتی جذبہ ہوتا ہے جو کسی کھوئی چیز یا خوشخبری پر رد عمل کے طور پر ظاہر ہوتا ہے۔ یہ آنسوؤں، منہ کے کناروں کے ڈالنے اور سر جھکانے کی شکل میں ظاہر ہوتا ہے۔
  emotion.scared:
    label: خوفزدہ
    summary: خطر یا خطرے کے باوجود سے خوف یا دھمکی محسوس کرنا۔
    info: خوف ایک بنیادی دفاعی جذبہ ہے۔ یہ آدمی کو فرار یا تحفظ کے لئے تیار کرنے کے لئے اдрینالائن کی رہائش، دل کی دھڑکن بڑھاتا ہے۔
  emotion.surprised:
    label: ہچکی لگنے والا
    summary: غیر متوقع واقعات پر اچانک حیرت محسوس کرنا۔
    info: حیرت بہت چھوٹی موٹی جذباتی تحریک ہوتی ہے جس کا عرصہ صرف سیکنڈز تک رہتا ہے۔ اس کے ظہور کے طور پر منہ کھلا رہنا، آنکھوں کے بال بلند ہونا اور دید کشادہ ہوجانا شامل ہوتا ہے۔
  emotion.tired:
    label: تھکا
    summary: فِزیکل یا ذہنی طور پر تھکاوٹ محسوس کرنا، آرام کی ضرورت ہے۔
    info: تھکاوٹ جسم کا اشارہ ہوتا ہے کہ وہ آرام کی ضرورت رکھتا ہے۔ یہ سوئی کی لالچ، ردّ عمل کم ہونا اور توجہ دینے کی صلاحیت کم ہونا کے ذریعے ظاہر ہوتا ہے۔
