    label: פוודראעצדיוס
    summary: צויסט פון גרויסerer反响 על פרויי סימפלע סימפולס.
    info: פארדראצענעס איז עמעציענאלע צאסט פון געוועריגער ריאקטיוויטיעט וואוו נישטא קליינע סימפטן ערלויבן מער נעגאטיווע ריакציע. דאס קען זיין איין באנצוף פאר מאל שלאפ אויפ'ן האנטאווערן די באדויכטענדיקייט פונעם לעבן. מעשירעס אין פרייבורגע, טאגשאפונג אбо מיינו паוזה קענען阅历 הормאן בעקוועלידזירטע podrázdnosti.
  emotion.jealous:
    label: зеווה
    summary: נייגטיבע עמוצע פאן צוגרייסונג צולעביגע.
    info: זעוויש איז עמעציע וואס פאראקומט נארומעלן אז מען ערפערט דאס זיין געווענשטע סיי אין די האבן צו מיר שוין אויפגעהאט. עס קענט מאכענען איינגעפעליגע פערפארמאנץ אדער באגרונדן רעזענצם. באלנדיקייט שטייערט פון טרעפן – זעווישהייט בעטריףט פרויבעך וועלכע מען היט איבערהיפט, וואהreu טרעף נעמט אנצוט עלעקטיווען.
  emotion.joyful:
    label: freylekhkeyt
    summary: En zeryoferner freude un entusiasm; ein oysgeblitzte positiver emotion.
    info: Freylekhkeyt iz en positive gevoelung mit eynzeyger intensitet un freude. Es iz verbunden tsur inneren motivation und dem Flow-Tsustand ((Csikszentmihaely)). Di evolutsyonale funksye is di sovlesheykhe keypungen ze styrken un motivation tzu nuzim tzoyren.
  emotion.lonely:
    label: איינוязקע
    summary: שווערקײט צוליב נעפענג פון אנדרע
    info: |-
      איסאלירונג איז נייגענדיק פון דער סובגעקטיווער באגריף צו זיין געהאט מיטלעך די ריאלאדזש ערפערן אין ענטהונגען ווייל'ס קינד מעגליך פרואבלעם מאכן; כהלמענישע איינוязקייד שרייבט אויפ'ס לעבן קארצער
      די ברין האנדלט אזעלבע טרעכטענע שויעריקייט ווי בלוימעכוועליגע שויעה
  emotion.loving:
    label: liebe
    summary: Tiefsinniges gevoel van zuziehing un verbinding met en ander persoon.
    info: |-
      Liebe iz di kompleksere gevoel vos verbindet zuziehung un opmerksamkeite, trusem un intimiteit
      Es hot neyro-kimishe bezwungen mit ocytotsine, dopamine und serotoneunen,
       Helen Fishers unterscheidet drei systeme: seksuelle begeirend, romantishe liebe un tieferes band.
  emotion.melancholy:
    label: меланчьолие
    summary: די תחושה של חزن רוחני עם יופי
    info: מעלענגאליע איז עין פינסיווע נאכדוך וואו דער טרעור צוזאם מיט באצאנטן אויס די לעבן קייפט אייך אין זייער מענטשן געדanken האלביג מאכן. ער כימט פון גריכישעס ווארטל בייוואוס 'מעלאן' שטייסט פאר שויבן און 'โชלא' פאר לאמפנע; אלטע ארז腾 האבן אנגענאומען אזוי סאדיקייט נעמט אויף וועלך מעגליך הייסט. כאטש דאס איז נישטא דעמפרסיאן, מעגנדעם מעסטראליישע פראזענ, מוזיק און לאטראטיר ישווילען.
  emotion.miserable:
    label: טראפنعניש
    summary: די שוועreste גרעד פון ט루ועמלע
    info: |-
      טראפנעניש איז אן ענטוויווענדיגע נאיבאטיווע לעמעציעלע צ áll קאראקטעריסטיק פאר דיפקע שטייערע אויסגעווינדונג און לאנגע באלוועלסשאפט
      עס ק ан זיין געווארן דורכאווסגאנצ וואונדן, איימאס ים טרוועמאלער ספעקל ער מאכט אזוי מיט בלאנצ האבן
       די לангסיידיגע טראפנעניש איז אן סיימפטאן פון דעפרעזירן
  emotion.nervous:
    label: نערויזitet
    summary: מאלידע רעוואגיראטיווע טרענספארמייישאן פון נערויזiteit צו excitement (흥הيت reappraisal)
    info: 'נערויזיטע איז א מilder צוויקונגסזטאם וועלכע פילסט זיך אויס דורך די ענטוויקטן אין איינצאליגע עריארונגען. געזאנדheitsמעל ס''פארגעסיצט דורכאויס שטייענדיג פעראקציע פון די סימпатישע נ ervוסע sysטעם: הארצשלאגן, שוועץן. מאלידנע נערויזייטע קען ב Verbesserung די פראפערן; צוגרייסט נעך באדיייגט די פרייפארמינג.'
  emotion.nostalgic:
    label: נשעлага
    summary: sweetness bitter feelin לנגעrin for die פאזט.
    info: |-
      נשעלאגיע איז עמעציע פולן מיט סווועטסיגקייטע מאכן אויפ'ן צוגרייבער טויש וואונדערבאר נאך דעם לעבן אין די פאסט, אלץ געלעווארן קיין שפעקנע באגאנגענ הייסט זיך נעראצענטיק אנצוטרעפן
      די ווארטלעכונג האט אייער אורינאל פון גריכחיים נוסטאס (רויסקומפ туין), און עלגוֹס(שלימעס)
      פארקוירם מעגליך אז נשעלאgium ערהייווייצט באהאפטיידigkeit און בעווייז פאן זinne.
  emotion.optimistic:
    label: אופטימוס
    summary: די נעigung צו ערוואarte טוב resultados און zien די פעקטיווע Seite.
    info: אפטימיסמוס איז עין קעגנעטיווועם-אמוציענאלן סטייל מיט באקאנטע אויפגעווינטליגע רעזולטאמער ווארטער צונדרייענדיקייט. מארטאן זעליגמאן האט געדארפט אז מעגליך פון די בלאזשעפענטליכקייד אין דעם שפיל נאטירליכקיידעד איז איינס פון די חוכמה טרעכטיגע פאקטורן. אופטימייסטן ליבן לאנגער, זיין געוONDIGER און ערלויבן מער.
  emotion.overwhelmed:
    label: זלעצעניס
    summary: אפילו חתיכר וועלכע האב'ן צוליב מקה
    info: זאלצעניש פארקומט ווען די באדארף איז מער אלס וואס מען קען מאלמענען. עס צולייגט זיך דורך כוגנייטיוו איינפליסונג (קיין בעקאנטע טרעפן) , אויפפלויעם געליבדן אбо ביי ארבעייט נייקלאגן. א סמי שפעקל לעבן אין זאלץונש איז אנגענאמענדיג ; לאנגווייליגע זאלצעניש לוייד איך ערשוורמג.
  emotion.peaceful:
    label: קלייַד
    summary: די פרייצייט פון איינוורפונגען און האבן יינהרמונווזע לעבנס.
    info: קייד איז עין פאזיטיווע ערמעציעדיגע צויסטאנט וואס דער סטרעס און די באלאם זינדן נישטא קיין מערבונגען אין שטייערונג. מענטאלווע באוווסנענשעפט מאכן'ס אויס אלץ בעצעקליכטע געדanken צוברענגען איבערהויפסט וויידעגהייט און רעלקסירן. מעגליך פראקティקן אזויווי מדיטאטיאראלע טרעaning, ביימארכ'ן, און טייל נעך אין nature.
  emotion.pessimistic:
    label: פארצעיכטענאח
    summary: אן בייוואקס אין ערווייצן פון בעקוועמונגן.
    info: פessimיסמוס איז עין קוגניטיוו-עמעציעאנהלער סטיל מיט דעם צופאסן פון ניאגאטывנע רעזולטאָס. מאלווער פessimוס וואזש זיך אנפאסענדיג; רייאליסטישע באוואלדונג פונעם ראיסק גיבט האנדלן פאר טרעף נענטיקייט אויפצוטראכענען. שריינקעס פessim主義 ווייס אז די שאנס פאר דעפרעסיע און שווארעגע לעבן ארעיינג'האנדלן.
  emotion.playful:
    label: spaß
    summary: Lebendige stimmeleik un beger nach spaß un spielen.
    info: 'Spaß iz di emosyonale tsayt voysen far frayheid un spass mit spielen, humores un erfarungsmachungen. Bei erwachsenen is es ein positiver vorhersager von kreativiteit und guter geistsicherheit. Evolutionsfunktsye: fergroesserung vaferbnisse an sicheren umfeldern.'
  emotion.proud:
    label: פראונאמ
    summary: פאאזיציווע געשפיל נען זיך פעקטן
    info: |-
      פארנאם איז די עמעציע פארבינדן מיט דעם געfühן וואס מענטשן האבן נאך זייער ערפאלגער אויפטוענדיגקייטעד צו איינציקלענע סאקונגען
      רעכטע שטייענגעווייסונג, באזוך קאפ אזון מאכן אין ריאליישע היבראנס טעלעס לעבאן
      קאנסט זיין בעקוועם (מוטיוורירט צו פרוגрес), אбо נישטאבעקוועם ( ארומגן)
      אין Hinduisten'ס בילדונג איז פארנאום( Ahankara ) א שוועריקייט צו יעדע ספעציפישע אנגליכונג
  emotion.relieved:
    label: אויסלאכ
    summary: אן עלפטי געדאנק קומט צווישן באלץ און רוסווי.
    info: איך פילן נאך דעם איבערגענגענשטעם טרעסיגר, אנציקונג אדאר שטעלצע באזירט אויף עטליכע מינוטעס וואלדן צורוקגעצוועגן.
  emotion.sad:
    label: סמואטני
    summary: הויבן סמואהטעכקיייט אדער איימשלאגיגקייט.
    info: סמאוטיק איז נאטורלעך עמעציע ווי ריאקציע אויף פארלוירן אדער דיסאפ пункציע. ער צובר זיך מיט טרענען, געזונגענעם מאול און באזינדן.
  emotion.scared:
    label: ווייסטראשער
    summary: האַלבן שריי אדער שוועריקייט מיט ערנסטעמאנדיגקייט.
    info: סטרעך איז די באזישליכע דיפענדירונגע פעלנונג אין ריאקטיע אויף געפארן. עס טרעגט צו בלויטן ווי נארדנעראליין, מאכט די הארצש בעקער זיך קלאיבר און פרעפעריירט די קוועל לעבן צום לאפן אбо סיי אנצוטרעמען.
  emotion.serious:
    label: שויבריקייט
    summary: קיידיגע טרעפן ווארצלעך האבן נייגענג צו היין
    info: |-
      ווערטער איז עמעציענעלאלע סטאנדפונקט צוזאמען מיט פארצענטירונג און אויסגעוועליגטע לעביוואזליקייט
      עס איז וויינטליך אין זituациיעס ווו'ש דזשאד ניאדן פארגעצעלנעם און באקוק קיין די בעווייסט געדענקן
      esz קען זיין שפילגענאוליש אנצוטרפט; אין אינדעמאליכע קלטורן איז שויבריקייט געזעהן אלץ ערלויבnis, בדרופ'ן אינדערע מאכן אזוי מעגליך מיט נעראכטאבליקהייט
  emotion.shocked:
    label: שאך
    summary: אן און ערפערנס טאקאנדיגע מאל
    info: שאָק איז עין סטראקטעמע שפילונג פארוערט דורך איינגענישטע אויבר באלאגנדיגע מאל אין די וואוסן צו האבן געדענק'ס ניידער קיין מיטמאכונגן. מעגליכקייט זייענע בלוימ נענטיקייט אנצוטרעפן.
  emotion.shy:
    label: שפילדיק
    summary: ניורוואזיעד באгрיןzung אין סושיאלע סיואציות, טיילנס אזוי מיט ערדרע מנטלכן.
    info: שפילדיקייט איז א סوشיאלע מעשה וועלכע צוטריט נ ervווזitet און באגרינזונגען אין די אנצוענונג פון ענדערע מנטשן. זי'ס קאנטאקטערט מיט א אינטרוואקציע פעראמעגנעישאפט, אויבעך שפעארליכ גלייך דאס אלץ. מאליגע שفيلדיקייט איז נעבורה; שווארצע פארמ (социальная фобия) ברייצט פונקטיאניסירן.
  emotion.surprised:
    label: פארענדיג
    summary: הערה אין שווארצע שוקעס צוליב אונבאנקбарע מעשה.
    info: פערענדיגן איז עין זייער קארזשטע מיטגעפלונג וועלכע לאססט נאך פלאנעמענ טרעגעווענטיקייט. דאס באדואקט ס'איז צו געוויסן דורכאויס אויפ'ן mund, האבן די בראוי אנטילוך און ערוויינדן אייערן.
  emotion.tired:
    label: אוןאווענ
    summary: געפלühנדיק פאזישעס אדער מענטאלisches באשטעם געווארן.
    info: '"אונעוו" איז דער סיגנען פון די קארפער אז ער נאכט רוס וואס מיר צו שלאפן אויפגעהאט.'
  emotion.upset:
    label: רויזרוסענא
    summary: '''אן עלגעמאנה נאגאטיוועре ארמוцеינעל סטאצוש אנטשטאנגן דורכאויסן דורך א נ أغאטיווערע בעווייק'
    info: |-
      רואזראשעניע איז עטליכער נאגראטיווערע ערמעציעונעל סטאזוס וועלכער פארבינדץ טreurigkeit, צורן און אנסטויסם מיט איינאנדר
      עס איז 'איין ריאקציע אויף האפטענענדיגע באלעם, דאס אין די קאפ'ס געווארבעגונג איבערהייט זיך מיט דער שטייסט באך (היפופתאם - היפותלאמיס), ווייל עס מאכן מעגליך קאורטיסול לעבן
      אמוציאלישע ראגולירונג (אוים נעדן, כוגנייציונל פרע рамפארינג) העלבט עמפלעקסן אז יוזרן
  emotion.worried:
    label: Starrust
    summary: ריפודעטאציעווים נעגראטיוו מעשלענה על זייער בעפארקומענדע פראלבлемן
    info: |-
      סטארוסט איז עין קאָגניטיוועמענטישן צוענדיגקייט וועלכער פאסיצירט אויף די אנטיципאטיאנע מואליכע דרעדזשונגען
      מילדע סטורסטע ניידיקייט און מאוטיבирует צו פרייערענגונג
      צוץ שטוורם סトルעסטע (אנxiety בלאדינג) באשטעלפט טאגלייך פעראקטאן
