title: Emotions
cards:
  emotion.angry:
    label: angry
    summary: Feeling strong anger or irritation, being upset.
    info: Anger is an emotion triggered by perceived injustice or threat. It increases heart rate and prepares the body for a 'fight or flight' response.
  emotion.calm:
    label: calm
    summary: Feeling inner peace and comfort, being at ease.
    info: Calmness is a state of mental and physical balance. It slows down heart rate, deepens breathing, and allows for clear thinking and good decision-making.
  emotion.excited:
    label: enthusiastic
    summary: Feeling strong excitement and joyful expectation.
    info: Enthusiasm is an intense positive emotion associated with anticipating a pleasant event. It boosts energy, quickens the heart rate, and supports creative thinking.
  emotion.happy:
    label: happy
    summary: Feeling joy or pleasure, being in good spirits.
    info: Happiness is a pleasant emotion associated with the release of dopamine and serotonin. It manifests through smiling, lively gestures, and an open body posture.
  emotion.sad:
    label: sad
    summary: Feeling grief or dissatisfaction, being depressed.
    info: Sadness is a natural emotion as a reaction to loss or disappointment. It manifests through tears, downturned mouth corners, and a drooping posture.
  emotion.scared:
    label: frightened
    summary: Feeling fear or terror due to danger or threat.
    info: Fear is a basic defensive emotion that triggers adrenaline release, quickens the heart rate, and prepares the body for flight or protection.
  emotion.surprised:
    label: surprised
    summary: Feeling sudden amazement at an unexpected event.
    info: Surprise is a very brief emotion lasting only seconds. It manifests with open mouths, raised eyebrows, and dilated pupils.
  emotion.tired:
    label: tired
    summary: Feeling physical or mental exhaustion, needing rest.
    info: Fatigue is a signal from your body that it needs rest. It manifests as drowsiness, slowed reactions, and reduced ability to concentrate.
