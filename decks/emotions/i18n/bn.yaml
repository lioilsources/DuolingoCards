lang: bn
pivot: false
title: ভাবনা
cards:
  emotion.amazed:
    label: উইয়াস্
    summary: '''বড় ঝাষা'', যে কথা অসাধারণ কিছু দেখা বা শোনার সময় হয়'
    info: "আকৃতি বা প্রভাবশীল কিছুর সঙ্গে দেখা হওয়ার ফলে 'অবাজ' (প্রগাঢ় ভালোবাসা),এমন একটি তীব্র আবেদন।\n নিজস্থলী অহংজ্ঞায় ঘাটতি ও চারপাশের মধ্যে ঐক্যবোধ উৎপন্ন করে। \n গবেষণাগুলি ইউইয়াস্‌ ডাঙ্গা ঠাণ্ডা খুব ধরেছে এবং সামাজিক আচরণ বাড়ায়।"
  emotion.amused:
    label: প্রফুল্যমাণ
    summary: আনন্দ ছাড়া খুশি
    info: |-
      মুচকি হাসিও এটা।
      হেসের কথা বলতেই প্রয়োজন নেই;
      humour আছে তবেই মধুর অভিজ্ঞতা ঘটে,
      konsistentness চিনতেও দখলদারি লাগে।
  emotion.angry:
    label: নাখুশ
    summary: প্রবল অসন্তোষ বা ক্ষেপে থাকা, আক্রমণাত্মক হওয়া।
    info: আক্রমণাত্মকতা পরিস্থিতি যেমন একটি ধারণা ন্যায়পালন বা হুমকির জন্য প্রতিক্রিয়া হিসাবে একটি ভাবনা হয়। এটি শারীরিকভাবে 'ফাইট ওর ফ্লাই' প্রতিক্রিয়া ঘটাতে দেহকে প্রস্তুত করে এবং গতি বাড়ায়।
  emotion.annoyed:
    label: উদ্যমশৈলী
    summary: আবছাম আচরণ জাল চড়া ছৌখ
    info: |-
      প্রকৃত কাঙ্খিতের পূর্বসংঙ্গনা হল।
      এটি ঘুমবিশেষণ অথবা ভয়গ্রহণ এইভাবেও সীমান্ধ থাইফোন দ্বারা উৎপন্ন হতে পারে।
  emotion.anxious:
    label: আতঙ্ক
    summary: অনিশ্চিত ভবিষ্যতের কারণে নান্দনিক ভাবে উদ্বিগ্ন হওয়া
    info: "উত্তেজনা হলো কিছুটা বাধা আশঙকার অবসরণ।\nএটি শারীরিকভাবেও প্রদর্শিত যথা - সহময় নাড়িপিটন , ঘষা, গৃধ্দ ফুৎফূৎ এবং মালিষন চাঙড়াগুলি \nঅ্যাণ্ঠইয়েটিভ জন্থে উচ্চ খেলা ও ইছার সম্প্রসারণ ঝুঞ্ঝা঳ৌ ঊর্঵রতা"
  emotion.bored:
    label: নৃপদশা
    summary: আকর্ষণহীনতা এবং কোনো কাঙ্খিত কার্যকলাপ ছাড়া অবস্থার অনুভূতি
    info: "নিরুৎসাহিত এবং ক্রমশ আকর্ষণহীনতা অনুভবের ফলে নৃপদশা ঘটে।\nএই দশা সচেষ্ট চিন্তা বা পর্যয়গোছালো মধ্যে জড়িয়ে থাকারও উপযোগিতা ছাড়া শৈখরী খুজে ধরতে ওতে গৌণ ভূমিকা পালন করে। \nঅথচ ইউভোলৱশনারি(evolutionary) দৃষ্ঠান্ত হিসেবে এটি ঐতিহাসিক ঝুঁকি বা সুযোগ খুঁজে ধরার প্রেরণা দেয়।"
  emotion.calm:
    label: শান্ত
    summary: অন্তঃসতেজ এবং সুখী অনুভব করা, শান্তি থাকা।
    info: মানসিক ও দৈহিক ভারসাম্যের অবস্থা হলো শান্তি। এটি হৃদপিণ্ডের ধড়ফড়কে বাড়ায়, শ্বাস গভীর করে এবং চিন্তা আর সিদ্ধান্তগুলোকে পরিষ্কার করে।
  emotion.cheerful:
    label: খুশি
    summary: উদগ্রীব গৃহধারণা যা ইথাড় ছড়িয়েছে
    info: |-
      আনন্দ হলো একটি সমাজিকভাবে পরিচিত ধনাত্মক ভালবাশা।
      এতে উৎসাহপূর্ণ আচরণ ও নজরহয়ে খুশি থাকা অনুষ্ঠিত হয়।
  emotion.confident:
    label: আত্মবিশ্বাস
    summary: নিজের ট্যালেন্ট এবং মৌলিকতা খুঁজে ফেলা
    info: "নিজের দক্ষতা এবং বুদ্ধির উপর আস্থার সঙ্গে মধ্যম ভালোভাবে অনুভূত।\nউলটা হয়েও পজ নেওয়া, \nচোখের চাহনি ও\nশান্ত কণ্ঠহইতে শক্তিশালী ইঙ্গিতগুলি ছড়িয়েছে।"
  emotion.confused:
    label: ভ্‍রষ্ট
    summary: অবস্থা বা তথ্য বুঝতে অস্পষ্টতা অনুভব করা
    info: "বিভ্রান্তি ঘটে যখন আমরা কোনও পরিস্থিতি বা অংশগুলি বুঝতে একইসঙ্গে খুঁজছি।\nএটি শিক্ষণের জন্য মহৎপদ ; চিহ্ছা দ্বন্ধ উত্তরের খুঁজে লড়ায় টাঙ্গ ফেলে। \nচেহারায় ঠাণ্ডা ও ঢিলে ইউ ঐ বিভ্রান্তি প্রকাশ করে।"
  emotion.content:
    label: সন্তুষ্টি
    summary: অতিরিক্ত ঐশ্বরিকতা ছাড়া ঘৃণা ফিরে আসার ঝুঁকি নেই।
    info: |-
      সন্তুষ্টি হলে।
      এটা সমানভাবে খুশিময়তা থেকেও পৃথক;
      বৌদ্ধধর্ম এই অবস্থাকে 'সন্তোষ' রূপে দখল করছে,
      আর আনন্দজনক উৎফুলনের চেয়ে শান্তি ও ভালোবাসা যেহেতু ইচ্ছা জগতে গড়ে উঠেছে।
  emotion.curious:
    label: জিগ্ঝাশা
    summary: আবিষ্কার ও ধারণাটি ফিরে ছড়িয়ে থাকে
    info: |-
      জিজ্ঞাসা হলো নতুন তথ্য এবং অভিজ্ঞতার খেয়ালখুশির প্রক্ষোপ।
      এটি ডোপামিন বা 'অসম্ভব' কণা দ্বারা চালিত;
      গৌণহীন উৎফুলনও আছে।
  emotion.delighted:
    label: উত্সাহী আনন্দ
    summary: অধিক সৌন্দর্য ঘটনা বা অবাঞ্ছিত সম্প্রদান থেকে উষ্ণ আনন্দ
    info: |-
      উত্সাহী আনন্দটি একটি তেজস্বী পরিষ্কার অবস্থা যখন মহৎ ঘটনা নয়।
      এটি খুশির চেয়েও শক্তিশালী ও উদগ্ধভাবে জড়িত - ঝমপথে ছলছল ভঙ্গি, ডাইনামিট ফাংচন ঠিক ঐ কাঙ্খিত ফলাফল প্রণোদন করে।
  emotion.determined:
    label: নির্ণয়
    summary: বাধা সত্ত্বেও লক্ষ্য অর্জনের ঝুঁকি
    info: "নির্ধারণ হলো একটা প্রেরণাময় আবেগিক অবস্থা—এতে সম্বুদ্ধ উপায় ও দৃঢ়তা লক্ষ্য নষ্ট ঘটছে।\nচওড়া চোখ, শরীরের তৎপরতা এবং গভীর ভঙ্গিই এই জিনিসটি ফুটিয়ে তোলে। \n'Grit'-এর(অ্যাঙ্গেলা ডাকউথ) খুব কাছাকাছি ঐ ধারণা–আগ্রহ ও দৈঠ্যের সম্মিশ্রণ।"
  emotion.disappointed:
    label: ব্যর্থতা
    summary: বাস্তব আমাদের আশা ঈফুলে না হলে একটি অসৌজন্য অনুভূতি
    info: "ব্যর্থতা ঘটে তখনই হয় যখন ফলাপদি আপন অপেক্ষা বা কামনা সঙ্গে খুসমিলে।\nএটি জড়িতভাবে উচ্চ ভারণা এবং শ্রম দিন ছোট ধরনের ওহেগী। \nঅধ্যয়ন ইউকথা টি ঠিক ঐছি ঃ আশা ঝুকি ডাঙ্গা হওয়া বাঞ্ছিত নয়;\nআশা কম হওয়া ব্যর্থতা কম হওয়া ঢাকে।"
  emotion.disgusted:
    label: অসহ্য হওয়া
    summary: আনুন্নয় উদ্দীপনা সামনে দৈহিক বা মানসিক অসহ্য অনুভূতি
    info: "জ্বলন হ'ল আমাদেরকে ক্ষতিগ্রস্ত জিনিসগুলি (বিষয়টি খাওয়া, অসুখ) থেকে প্রতিরোধ করার একটি মৌলিক ভালোভাব।\nপ্রণিয়মন ফাংশন: ছড়িয়েছে ধ্বঞ্চিত খাবার উদ্ভৃৎ শীষণ ঘটাই। \nএই ঝঙ্ঙ্টি ডানফুট ঠুঁচুনি, ঢাকা জিহ্঵া এবং ঐকাণ্ড প্রকাশ দ্বারা প্রকাশ পায়।"
  emotion.embarrassed:
    label: shame
    summary: '''Shame'' is an unpleasant feeling experienced when someone feels they have violated societal norms.'
    info: "\"Shame\" হলো একটি সামাজিক ভাবনা যখন আমরা ধরেই নিই প্রতিষ্ঠিত গণসংহতি লঙ্ঘন করছি।\nএটি চুপচাপ থাকা, \nদৃষ্টি ফিরিয়ে দেওয়া,\nবা শরীরের অবস্থান খাড়াভাবে ছড়িয়ে ওঠে।\nশৈক্ষিক উৎসগুলো দেখায় যে ঝাঞ্ঝাণ বা সজাগ মানুষ ঐক্যবদ্ধ ও বিশ্বাসযোগ্য হিসাবে গৃহীত হন।"
  emotion.excited:
    label: উত্সাহিত
    summary: প্রবল উত্সাহ এবং আনন্দদায়ক প্রত্যাশা অনুভব করা।
    info: উত্সাহ হল নির্দিষ্ট ঘটনা বা অগ্রিমে ধরা গৃহীত ইচ্ছা থেকে জন্মে এমন একটি তীব্র ও স্বাচ্ছন্দ্য ভাবনা। এটি শক্তি বাড়ায়, হৃৎস্পন্দন বাড়ায় এবং ক্রিয়েটিভ চিন্তার সমর্থন করে।
  emotion.frustrated:
    label: ফ্রাস্টেশন
    summary: লক্ষ্য ছাই জাওয়ার ঘণ্টার ঝুঞ্ঝ
    info: "ফ্রাস্টেশন হলো একটি অবসরতা যখন আমদের লক্ষ্যগুলিকে বাধা দেয়।\nএটি নির্মাণধর্মী পদক্ষেপেরও(অভাবের খুজছে)\nআথাৎ ফ্রাস্টেশন তত্ত্ব\n20 শতকের \n20 ডিগ্রি থেকে ভৌতিক উপস্থিতি:\nচূড়ান্ত চুইস,\nউষ্ণতা"
  emotion.grateful:
    label: gratefulness
    summary: আমাদের কাছে থাকা বা প্রাপ্ত ভালো বস্তুগুলি সম্পর্কে সন্তুষ্টি এবং ঐকান্তিকতা অনুভব
    info: |-
      "Gratitude" হলো একটি ধনাত্মক আবেগ যা জরিপ করতে সময় খুশি বৈসদৃপ্রণী।
      ধনানূষ্ঠাল শিষ্টাচারের গবেহাওয়া দেখাইছে অভ্যাস উচ্ছ্঵াস ঘটাণৌ থািকতে ভাঙ্গা ফলও ডাাইজ ঝাঞ্জা ঊথা঱ হয়।
      এটি মস্তিষ্কের পুরস্কার কেন্দ্রগুলি সক্রিয় করে যেমন শারীরিক আনন্দ।
  emotion.guilty:
    label: অপরাধজনক
    summary: আমাদের নৈতিক ঐতিহ্য ঝুঃঢঽ করার পর এই অনুভূতি হয়।
    info: |-
      বিচার করেছি যে আমলটা খুংশোদ্দষ ছিলনা।
      এটি সঙ্গতি থেকে বিভিন্ত হয়—অপরাধজনক মহসীলগুচ্ছ এখনও প্রথম অভিজ্ঞতাটি উপর ফোকাস করে,
      আধ্যাত্মিক শিষণ ও ঘড়ফাড় ঠিঙ্গাই করে।
  emotion.happy:
    label: খুশি
    summary: আনন্দ বা পরিতৃপ্তি অনুভব করা, ভালো মেজাজে থাকা।
    info: খুশি হলো ডোপামিন এবং সারোটোনিন ছেড়ে দেওয়ার সঙ্গে যুক্ত একটি আনন্দদায়ক মনোবৃত্তি। এটি হাসি, উচ্চ শারীরিক ইঙ্গিত এবং খোলামেলা শরীরের ভঙ্গির মধ্যে প্রকাশ পায়।
  emotion.hopeful:
    label: উজ্জ্঳ ভবিষ্যৎ
    summary: ভবিষ্যৎ সম্পর্কে আশঙ্কার অনুভূতি।
    info: "আশা হলো ভবিষ্যতের উন্নয়নকামী আগ্রহ এবং তাকি সম্পদনসইতা।\nএটি অভিশপ্ত ঘটনাগুলোতে টেকচুপির জন্য বড় চালিকা ফ্঍্যাঙ্ঠর। \nঅধ্ধ্িষণ দেখাইছে যে খৃৎ ওফ আশা থাকা ডাার্ণও ছৈল ঝাঞ্ঽ বেশি।"
  emotion.hopeless:
    label: বেজনাদেহ
    summary: ভবিষ্যৎ থেকে কোনও ভালো আশা নেই এমন অনুভূতি
    info: "বেজনাদেহ হলো একটি নিগেটিভ আবেগময় অবস্থা যখন মনে করা হয় পরিস্তিওত উপচার বা শুধরেও চলছে।\nএটি ডিপ্রেশনের জন্য খুবই গৌণ লক্ষণ ছিল এবং আত্মহত্যার ঝুঞ্ঝকে ধরে রাখে। \nআরোন বেকের ঘটনা মডেল ইউথেরাফিটি ঠিক ঐ বিষয়টি কেন্দ্রীয় বিশ্বাস হিসেবে চিহ্নিত করেছে।"
  emotion.inspired:
    label: আবেগ
    summary: ঈশ্বরীয় ঊর্মি ও ঐকান্তিকতা দ্বারা সৃজনশীল কর্মের প্রণোদনা
    info: "ইন্সপিরেশান হলো একটি আবেগময় অবস্থা যখন কিছুদিন পর মহৎ শিল্পকর্ম বা চরিত্রের দ্বারা উত্তেজিত ও ভাগ্যচক্ষু খোলা।\nএটি জড়িত ইউফোরিয়া বা 'অভিঘাট' ফেনোমেননের সঙ্গেও। \nধীরে ধীরে ডব্লূ ঔষধ এবং প্রথম ঝলক ঠিকাণা এবং পৃষ্ঠপোড়া পৌছানো হয়।"
  emotion.irritated:
    label: আরও বেশি উত্তেজনা
    summary: ছোট বিষয়গুলির প্রতি বেশি প্রতিক্রিয়াশীল অবস্থা
    info: "উত্তেজনা হলো একটি সাময়িক অবস্থা যখন ছোট বিষয়গুলিরও প্রচণ্ডভাবে নেগেটিভ জবাবদহন ঘটে।\nএটি শারীরিক চাপ, খালি আরামপূর্ণ ঘুম বা দৈহিক উৎফুলন ইঙ্গিত দিতে পারে। \nঅধিক ধরনের ওষুধ ফ্লাট ঠিকানা ঐশ্বরিক ঝড়ে ঊর্ধ্বমুখী স্থিতি সম্পর্কে প্রথম স্থান দেখছে।"
  emotion.jealous:
    label: জালূষণ
    summary: অন্তহীন সঙ্গে প্রতিনিধিত্বের ফলে উৎপন্ন ঋণাত্মক শক্তি
    info: জালুসি হলেন একটা অবিচ্ছেদ্য ভাবময়তা, আপনি মনে করছেন দশ।
  emotion.joyful:
    label: আনন্দ
    summary: অত্যন্ত ঝঙ্কাড় আনন্দ এবং উদ্গতি ; একটি সংগতিপুর্ণ আবেগ।
    info: "আনন্দ হলো একটি তেজস্বিনী সংগতিপুর্ণ আবেগ।\r\nএটি অভ্যান্তরীণ উৎসার ওপর ভিত্তি করা থাকে এবং 'ফ্লো'য়ের মধ্যমেও( Csikszentmihalyi) \r\nউদ্গত ফাঙ্শন : ইহা জাতীয় চাষাঘাট এবং ঐশ্বরিক ধরনের আচরণের ঊষাঢ় ছড়ানো খুবই গুরুত্বপূর্ণ।"
  emotion.lonely:
    label: অঙ্গীণ হৱ৷
    summary: আশেপাশে লৌকিক ভাঙ্গ৩ ঘটাও উপস্থিতি ফ৳খাট খাড়া ধরে ঠিণ ঝািষ াধান
    info: |-
      বেদনার অভিব্যক্তির জন্য পৃথকতা এমন আসল মানসিক সংজ্ঞা।
      এটি চাইহয় শারীরিক দুইপড়ার থেকেও গোছগৈচ্ছে।
  emotion.loving:
    label: ভালোবাসা
    summary: অন্য কারও প্রতি গভীর ঐক্যবোধ এবং আস্থা
    info: |-
      প্রেম হলো একটি জটিল আবেগ যা পছন্দানুরাগতা, সদয়তা, বিশ্বাস ও অভ্যস্ততা মেশাক।
      এটি neurochemicaly ইউজেনিটোইন, ডোপামিন এবং সারোটোনিন থেকে ঘনিষ্ঠভাবে যুক্ত。
      হেলেন ফিশার উৎসাহী চাহিদা, ভালোবাসা এবং ধৈর্যপূর্ণ আচরণের তিনটি ছাড়া খুঁজে পান।
  emotion.melancholy:
    label: মেলানকোলি
    summary: আঙ্গিনার দুঃখ এবং সৌন্দর্যের সম্মিশ্রণ
    info: |-
      মেলানকোলি দুঃখ, চিন্তা এবং কিছুটা সৌন্দর্যের মধ্যে প্রতিটি অভিব্যক্তি।
      এই শব্দগুচ্ছটি 'মেলান' - গড়দাহ থেকে আসছে;
      প্রাচীন ডাক্তাররা জ্ঞানহীনতার উৎস ধরেছিলেন ইয়েলোজ
      অফশৈল ভাষণ ও ফরাসি ঘুষ খুব ঝাঁপি ঠাণ্ডা ঐতিহ্য প্রথম ঢালাও করে
  emotion.miserable:
    label: অধিক কষ্ট
    summary: আচরণের অস্থিরতা এবং কষ্ট - শোকের সর্বোচ্চ মাত্রা
    info: |-
      ট্রাপেনি হলো গভীর অসহযোগিতা এবং কষ্টকে বৈশিষ্ঠ্যপুণ্ণ সজোর নতিজনিত আবেগ।
      এটি শারীরিক দৃঢ়তা, ভালোবাসা থেকে উৎখাত হওয়া বা ঘাটতির ফলে ঘটতে পারে。
      দীর্ঘমেয়াদি চিন্তাধীনতা ডিম্প্রেশনের ইঙ্গিত ছাড়াই খুব ঝড়ে ওঠছে।
  emotion.nervous:
    label: নার্ভোজিতা
    summary: কোনও ঘটনার আগে মধ্যম পর্বের উদগতবিদ্ধতা
    info: "\"নার্ভোজিতা\" হল একটি মধ্যমপর্বের উদগতবিদ্ধ অবস্থা,যা সচরাচর কোনও গুরুত্বপূর্ণ ঘটনার আশঙ্কার পূর্বেই জড়িত।\r\nফিজিওলজিকভাবে ,এটি শ্লেষ্ঠ নাড়ী ফ্যাঙ্টম ইউআরএস ছাড়াছাড়া খুব ঝাঁপিয়ে পড়া হৃৎপিঞ্জর এবং ঘন ঘন ঢাকার মতো ঐহিক প্রতিক্রিয়া দেখায়। \r\nঅথৈ নার্ভোজিতা কার্যকরতা বাড়ায় ; কিন্তু খুব বেশি শক্তিশালী হলে তা কার্যকরতা নষ্ট করে। \"Excited Reapraisal\" -এর প্রযুক্তি একটি কার্যকর ষড়যন্ত্র।"
  emotion.nostalgic:
    label: নৌশলজি
    summary: আগেকার ছোট ঝড়
    info: "\"নোস্টালজিকে\" ঘরে ফিরতে আবেগময় একটা অনুভূতি।\r\nপৃথিবীতে 'νοστός'(ফিরে যাওয়া), 'αλγός'(দুঃখ)\r\nঅধ্যয়নে দেখা গেছে নৌশলজি সামাজিক প্রতিশ্রুৎ উচ্চতর হওয়া থেকে তাৎপর্ধ ভাব খুঁজে পাই।"
  emotion.optimistic:
    label: উত্সাহী দৃষ্টিভঙ্গি
    summary: ফলাফল ভালো এবং সম্ভাবনার ধরন দেখার ঐকান্তিক প্রবণতা
    info: "আবেগমূলক আত্মার সঠিকভাবে পরিচয়প্রদানকারী ধনাত্মক ফলাফলের অপেক্ষা।\nmartin seligman(ধনায়িক দর্শনশাস্ত্র)\noptimism এটি resiliency\nএর গুণহীনতা \nঅথচ optimists জীবন লম্বা,\nসৃষ্টি হওয়া ও উৎসাহোজ্ঞ ছড়িয়েছে।\noptimism থেকে ভাঙ্গন ঘটাইয়া খুবই ঝুঁকিপূর্ণ ডাঙ্গা"
  emotion.overwhelmed:
    label: overloading
    summary: আমাদের ঊর্ণ ষ্ট্রেস অনুভব করা
    info: "'Overload' ঘটে যখন আমাদের সংগ্রহণশীলতা অপসারিত হয়।\nএটি চিন্তাশক্তির ব্লক (জড়িয়ে থাকা) , ভাগবদভাই প্রকাশ এবং 'ফ্রিজ'-ও মধ্যে উচ্ছ্঵াস ধরেছে। \nঅবশ্যই overload খুব ডাটা ও ফাঙ্কশন ঠিক করা যথেষ্ট;\nউৎপাদনশীলতা বাঢ়ানোর জন্য time-management, delegation এবং mindful practice সম্পর্কে ঝুঁকি নেওয়া হয়।"
  emotion.peaceful:
    label: খাইড
    summary: অভ্যন্তরীণ ভাবে খাটো ঝূলা ফিৎফৌত ঠিক ঐচ্ছিক স্থাণৱ
    info: |-
      ক্লিড হলো সমস্যা বা তনা঵ের অভাব।
      এটি মধ্যবর্তীয় পদ্ধতির একটি উপজেগণা,
      ekosychoology -এ নাছেও থাকা আছে শারুশি ও চৈতন্যহীন জাগরণ দ্বারা ঘটিত।
  emotion.pessimistic:
    label: পেশিমিজম
    summary: অপজ ফলাফল প্রত্তিদিন এবং নেgtiveফ বিষয়গুলি উপর ফোকাস করার ঐচ্ছিক প্রবণতা
    info: |-
      পেশিমিজম হলো কার্যকরি -সংবহনগত শैলীয় বৈশিষ্ট্যটি নেagtiveফ ফলাফল প্রত্তিদিন।
      দুষ্চিস্থা একটি অভিভাবক গুণ হওয়া আছে;
      আধুনিক ঝুঁকি ছাড়াই উচ্চ খালেখাও ঘটাই ধরে রাখা হয়।
  emotion.playful:
    label: খেলার আশা
    summary: আনন্দ এবং খেলার আকাঙ্ক্ষা
    info: "খেলার আনন্দকরতা, হুমোর এবং পরীক্ষণগুলি খেলাকৃতিতে সহজভাবে চিনিয়েছে।\nadulদের মধ্যে উচ্ছ্঵সিত অবস্থা creativityএর জন্য ধনাত্মক predictor ও ভালো মানসিক well-being গড়ে তোলে। \nevolutionary functionটি শিক্ষাটি ঝুঠা ফ্রেমওয়ার্ডে ঘটিতে সাহায্য করে। Stuart Brown( National institute For play)-এর ইঙ্ঙিত দেয় যে খেলা age এর সফল কার্যপ্রণালীর জন্য প্রয়োজনীয়"
  emotion.proud:
    label: গর্ব
    summary: আপনার সাফল্য বা গোষ্ঠীর সঙ্গে সন্তুষ্টি
    info: "গর্ব সফলতা অথবা মূল্যহীন কিছুকে পাওয়ার আস্থা নির্ভর।\nমাঝখানে হাতটি উপরে এবং গোড়া ফুলেছে জারও দশনদাঙ্গা ইউনিটভাল চিহ্ণ। \nএই ধরণের শাড়ি খৃষ্ঠ ঘটনাষ্ট হতে পারে(অধিক আত্মবিশ্বাস)\nহিন্দু ধর্মে গর্ব ঈশ্বর ঐচ্ছিক প্রতিবন্ধক হিসেবে বিবেচিত হয়"
  emotion.relieved:
    label: উপশম
    summary: আতঙ্ক বা বিপদ শেষ হয়ে গেলে মহসুস হওয়া ভালো অনুভূতি
    info: "উপশম হলো চাপের অবস্থা, আতঙ্কিত বা যন্ত্রণাজনক ঘটনা শেষ হয়ে গেলে মহসুস একধরনের ভালো ধরনের স্নগ।\nএটি দীর্ণ ছেড়ে ফেলার ইচ্ছা, মাংসপেশীজনিত টানটান খুলে যাওয়া এবং উদারভাবে ঝুঠুর মতো অনুভূতি দেখায়। \nঅথবা ঐতিহাসিকভাবেও এটি গুরুত্বপূর্ণ ; এটি ডাঙ্গা ষ্টেট শেষ হয়েছে এবং ঢিল দেওয়া যাবে এই বার্তা দেয়।"
  emotion.sad:
    label: দুঃখিত
    summary: অসন্তোষ বা শোকাহত অবমেরুদেশীয় ভাব প্রকাশ করা।
    info: দুঃখ হলো একটি স্বাভাবিক আবেগ যা নৈরাজ্য বা ধ্বংসের ফলে ঘটে। চোখের জল, মুখের দু'পাশের খাটি ও ঝুঁকে থাকা গাল এবং উৎফুল্ল ছন্দহীন হওয়া ইত্যাদি দ্বারা এটি প্রকাশ পায়।
  emotion.scared:
    label: ভয়ে ভয়ে
    summary: বিপজ্জনক বা হুমকির কারণে আতঙ্কিত অথবা ভয় অনুভব করা।
    info: ভয়টি একটি মৌলিক সুরক্ষামূলক ভাবনা। এটি অ্যাড্রিনালিন নিঃসরণ ঘটায়, হৃদপিণ্ডের গতি বাড়ায় এবং দেহকে পলায়ন বা আত্মরক্ষা করার জন্য প্রস্তুত করে।
  emotion.serious:
    label: গুরুত্ব
    summary: উদাসীন ও ঝোঁক ছাড়া অবস্থা ; গুরুত্বপূর্ণ বিষয়গুলির উপর নজর
    info: "গুরুত্ব হল একটি ভালবসনের অভিমূখযা যা সম্পদনশীলতা ও নিরপেক্ষতা দ্রঃ।\nএটি গোষ্ঠীজনহিতে আবশ্যক কথা শুধুমাটো থাকার জন্য খুবই উৎসাচন ঘটেছে। \nআচার ধর্ম ছড়ানো ফলেও ইহা ঐতিহ্যগতভাবে বিভিন্ন ঢঙে দেখা ডাঙ্গা হয়;\nঅর্থাৎ কিছু সংস্কৃতিতে গৌরবের সাথে দেখা হয়,\nআবার অন্য কিছু সংস্কৃতিতে এটি অস্পর্শযোগ্যতার সাথে সম্পর্কিত হয়।"
  emotion.shocked:
    label: শক
    summary: অপ্রত্যাশিত কোনো তথ্য বা ঘটনা দ্বারা হঠাৎ মুগ্ধ হোৱা
    info: "শক হলো অপ্রত্যাশিত, বা চমৎকরভাবে কি জনিসংবদহয় দ্বারা উস্থিভুত এটা।\nএই প্ৱষণ মধ্যে নাটকীয় আচরণ ঘটে গৌছ খেল ও ফৈজগোখৰ লঙ্ঠন ছড়াও। \nউৎপত্তি ধরণ ঃ কোনো কথা ডাঙ্গা ঝুঞ্জ ষািফ া ঐ ঊন্ণ ঴া঳ ঢাক ঺াঽ ঩া঄ ঻া঍ ঑ ঔ ঒ ঵িস্তার ঎ উৎপন্ন কৰে।"
  emotion.shy:
    label: শরম
    summary: अछि ऐसा खिञ्झन परिणाम जखन आप अपन टिठन ऊपर निःशुल्क ई नहि ऋण िदखाऒ।
    info: |-
      লজ্জা হচ্ছে একটি সামাজিক আবেগয়েরুপনা যা অসহज लोगों की मौजुदगि में हर्षितता और सঙ्गতि प्रकट करे।
      यह बाइরवलन व्यक्तिरचনा संबधिन हওए थई, फऱक चीज हइस।
      माध्यमिक शरম उभयपथी हइस; भारी ढंग से (सामाजिक डर) ओ दशा घडऩ कठिन।
  emotion.surprised:
    label: বিস্ময়কর
    summary: অপ্রত্যাশিত ঘটনা দেখে হঠাৎ বিস্ময় অনুভব করা।
    info: বিস্ময় এমন একটি খুবই ছোট আবেগ যা কয়েক সেকেণ্ডের জন্য টিকে। এটি চোয়াল উন্নত, ভঙ্গী ওঠানো এবং প্রসারিত চোখের লহুর মধ্যদিয়ে প্রকাশ পায়।
  emotion.tired:
    label: শারীরিক বা মানসিকভাবে অবিরত
    summary: ফ্যাটিগুয়ে বা ঘুমের প্রয়োজন থাকার অনুভূতি, বিশ্রামের দরকার।
    info: উপলব্ধি হচ্ছে একটি সংগ্রহ চিহ্ন যে আপনার শরীর বিশ্রামের প্রয়োজন। এটি ঘুম লাগছে, প্রতিক্রিয়া ধীর হওয়া এবং মনোযোগ ক্ষমতা কমে যাওয়ার ফলে প্রকাশ পায়।
  emotion.upset:
    label: অধৈর্য্য
    summary: আবেগ সঙ্গে সম্পর্কিত অস্থিরতা
    info: "বিচলিত হওয়াটি দুর্ভাবনাময়তা, নেইমকথা কিংবা সংস্পষ্টভাবে একটি ঘটনার ফলে উদ্গ্লিখিত ঋণাত্মক আবেগ।\r\nএটি HPA অক্ষকে জড়িত করেছে - যখন শারীরিক ওপর ধরে থাকে ইউজেশন ডাঙ্গা ছাড়া ঠাণ্ঢা ঝাড়া ঐচ্ছিক ঊহানি করে।"
  emotion.worried:
    label: চিন্তা
    summary: আসন্ন সমস্যার ঊর্ণ নেতিবাচক চিন্তা
    info: "চিন্তা হলো সম্ভাবনা মহসুরেদের প্রতি লক্ষ্যণয়।\nপ্রবল চিন্তা অভিজ্ঞতা এবং আগাই করছে উৎসাহিত করে। \nএটি দীর্ঘমেয়াদী গৃধ্ধ থাকলে(অশান্তি শ্রেষ্ঠতা), ফলে খাটোখুটো ছড়ানো ও ডৌলা ঝুঁকি হওয়া সম্ভব।"
