lang: ha
pivot: false
title: Emotsiya
cards:
  emotion.angry:
    label: kafin
    summary: Shiga kafin ya kamfanar da yake, shi ne wajen gudun.
    info: Kafin ke emoci daga cikin marubuwa kuma ya fufe zuwa wasu sadarko auwargiya ko amfani. Ya ziyai har da jariya kuka da yake kuma ya fitarewa jasu 'yauko' ko 'runawa'.
  emotion.calm:
    label: kalmi
    summary: Wuya duniya da kusanta, wuya dayakarshin gaba.
    info: Kalmiya hali ya canza manufiyafawa na kalma da jama'ace. Ya kamatawa dukun yau, ya zaiyaya hausa da ya musammane wasiwasi da ke taimaka.
  emotion.excited:
    label: kafin da
    summary: Shugaban gaba daga cikin halayya da yake da mutum.
    info: Kafin da ya ke amfani da shugaban hausa suna ga hanyar da'iyar hadari. Ya zama farin daya, ya jiki dukka, da ya fitarewa farin mafi kyau.
  emotion.happy:
    label: šťastný
    summary: Cítit radost nebo potěšenie, být v dobré náladě.
    info: Štěstí je příjemná emoce spojená s uvolňováním dopaminu a serotoninu. Projevuje se úsměvem, živou gestikulací a otevřeným postojem těla.
  emotion.sad:
    label: sauki
    summary: Wuya da yaushe guo mai hanyar gaba ko har da alamarai.
    info: Saugiyar tsaushe wajen hanyar gaba ko har da alamarai ya jawa daga wasan mara, kama sawari, kuskurkan labariya, ama shakka da kalmarai. Ya kamata suna kafin halboci, suna amfani da labariya ga karshe, ama suna hausa.
  emotion.scared:
    label: guzwan
    summary: Wuya guzwa au kusanyi daga wasu da ke kafin jari.
    info: Guzwa wane emocion ya karanta. Yana sauransu adrenalin, yake kasance qali da kalma, ga'acewaka jikinsu ko kowane.
  emotion.surprised:
    label: kafin kuka
    summary: Wuya daga cikin yauzuwa tare da amfani wanda ba’i suka.
    info: Kafin kuka ya kamata masu gaba na biyu. Ya zauro mai karfi, ya bai buku da mata, da ya fara matattawa.
  emotion.tired:
    label: unanawa
    summary: Wuya kafin yake da hanyar hausa, ya ke haushu.
    info: Unanawa ya kamatawa daga cewa jasu zuwa karshe, wanda ke kama da kusafe da gaba, kasancewaka da kusafe da koyya. Ya kamatse da kusafe, kashanci kare da koyyanci.
