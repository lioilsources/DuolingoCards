lang: el
pivot: false
title: "Συναισθήματα / Σοβαρά συναισθηματικά ψεύδη που τώρα δεν είπα να αλέξω! \U0001F602"
cards:
  emotion.amazed:
    label: Θαύμα
    summary: Έντονη ισχυρή έκπληξη χαράς υπό την επαφή με κάτι εξαιρετικό.
    info: Το θαύμα είναι μια δυνατή συγκεράση που αποδόθηκε όταν κάποιος βλέπει το να γίνει κάτι φοβερό ή λαχταρωδώς.
  emotion.amused:
    label: Περπληγμός
    summary: Ένα ελαφρύ ως ικανοποιητικό συναίσθημα
    info: "Ο περπληγμός είναι μια ασθενής θετική συναισθηματική κατάσταση το γέλιο λόγω κάτι χαζό ή διασκεδαστικό\nΔιαφοροποιείται από το γέλιο· το γέλιο είναι αποτέλεσμα του περπληγμού , αλλά φυσικά όχι κάθε περπληγμός βγαίνει να γελάσει \nΕίναι μια κοινωνική συναισθηματική κατάσταση · πράγματα μας φαίνονται πιο διασκεδαστικά όταν τα συμμεριστούμε με άλλους"
  emotion.angry:
    label: ξαφνικό
    summary: Να νοιώθετε ισχυρός απογοήτευση η οργή, να είστε ενοχλημένο.
    info: Η θυμός είναι μια συναισθητική απάντηση προς τη νεφέλωση κατανομή δικαιοσύνης υποψίας ή για βλάβη. Διεγείρει τους λεπτοδείκτες και φροντίζει το σώμα για «χτύπησε».
  emotion.annoyed:
    label: Εκνευριστικότητα
    summary: Ένας ελαφρύς νόστος οργής που προκαλείται από ηχητικό ψευδορομφύλαιο.
    info: Η εκνευριστικότητα προέχουν από ένα συνεχίζως διαταράσσον ρομφύλαιο και μπορεί να φθάσει το λήγο για πιο ιδιώτη θυμό. Διαβιβάζεται συχνά από την ανεπαρκή ύπνο, την πείνα ή την υπερβολική βαρύτητα.
  emotion.anxious:
    label: άγχος
    summary: Δυσάρεστο νευρικό συναίσθημα και φόβος για αβέβαιο μέλλον.
    info: '{"hint":"ανησυχία από το νεύρικο στήθος","info": "Η άγξια είναι μια πάλη για κίνδυνο· όμως λίγη δέουσα φόβος βελτιώνει την απόδοση\nΕμφανίζεται φυσικά:\n - Γρήγορη καρδιακή ","label":"άγχος","summary":"Ανεπιθύμητο νεύρικο συναίσθημα και φόβος για αβέβαιο μέλλον."}'
  emotion.bored:
    label: Νύχτα
    summary: Ένα συναίσθημα απουσίας ενδιαφέροντος και αβάσταχτης απουσίας.
    info: "Η νύχτα είναι αρνητική συναισθηματική κατάσταση που οφείλεται στη διακοπή των μέσων υπόδειξης ή λειτουργιών για βιωματική δραστηριότητα\nΜπορεί να φέρει σε αναζήτηση νέων εμπειριών η να ενθαρρύνει τη δημιουργική σκέψη,\nΑπό εξελισσόμενη προοπτική , θέτει σε κίνδυνο την αναζήτηση ευκαιριών \nΣύμφωνα με τις έρευνες, η χρόνια νύχτα αυξάνει τον κίνδυνο κατάθλιψης"
  emotion.calm:
    label: Σταθερός
    summary: Αισθάνεστε εσωτερική ειρήνη και ηρεμία, να είστε σταθερός.
    info: '{"hint":"αίσθημα ειρήνης και χάλαρο άτε πίέση","info":"Η ακινησία συγχωρώντας τόσο μενταλ όπως φυσική λύση βαρύτητας· διαβρώνει γρήγορους νεφρούς, βαθαίνει αναπνοή και εξασφαλίζει σαφή σκέψη και καλή απόφαση.","label":"Σταθερός","summary":"Να αισθάνεσαι εσωτερική ειρήνη και ιδιοϊτεία, να είσαι σταθερός."}'
  emotion.cheerful:
    label: Χαρά
    summary: Ένας ευχάριστος κατάσταση για να βρίσκεται γήϊνος
    info: "Η χαρά είναι ένας ποζιτιβός συγκινησιακός κατάσταση με απώλεια δύναμης του φθέγγω να βρίσκεται γήϊνος και λαχανιασμένος \nΣχετίζεται με εξωφροσύνη και υψηλό επίπεδο ποζιτιβισμού\nΕίναι 'μεταδιδόμενη';\nΠρόσωπα που είναι όμορφα και ροΐζουν"
  emotion.confident:
    label: Εγωισμός
    summary: Πίστη στις ιδιαίτερες δυνατότητες και αξία.
    info: Ο εγωισμός αποτελεί συναισθηματική κατάσταση που βασίζεται στη δύναμη των ίδιών μας υπολογισμένων γνώσεων και λογικής. Δραστηριότητες όπως να φέρεται με αξιοπρεπή στάση, να έχει ευθύ οφθαλμικό επαφή και να μιλά με ήρεμη φωνή είναι εκφράσεις εγωισμού.
  emotion.confused:
    label: Σύγχυση
    summary: Ένδειξη αβεβαιότητας ως προς κάποια κατάσταση.
    info: Η σύγχυση προκαλείται όταν δεν έχουμε τις γνώσεις κάποιων εξ απέναντι νόημα μιας φθήνουσας λογικής· είναι βασικό μέρος της μάθησης.
  emotion.content:
    label: Σπονδύλωμα
    summary: Προσπαθώ να φτιάξω ένα υψηλότερο επίπεδο.
    info: Η ευχαρίστηση ή σπονδύλωμα αφορά τη δική μου χαϊδευτικό παιγνιώς καθημερινές για να βρω λύσεις.
  emotion.curious:
    label: Περιέργεια
    summary: Επιθυμία για νέες γνώσεις.
    info: Η περιέργεια είναι μοτιβωση για τη δόκιμα νέων συμπλήρως και αφού ξάδουλθε όχι φροντίζει.
  emotion.delighted:
    label: Ενθουσιαστική χαρά
    summary: Έντονη χαρά από θετικό γεγονός η εκπλήξη.
    info: Η ενθουσιαστική χαρά είναι μια έντονη και περιβόλως αποδυναμώνουσα συγκίνηση τύχης λόγω δέξιων γεγονότων ή εκπλήξεων· φαίνεται να βοηθά στην ενίσχυση συμπεριφορών που οδηγούν σε επιζητούμενα αποτελέσματα.
  emotion.determined:
    label: Αποφασιερμός
    summary: Δυνατή προθυμία να εξασφαλιστεί ένας στόχος λες και υπάρχουν εμπόδια.
    info: Η αποφασιερμός είναι μια συγκεκριμένη ψυχολογική κατάσταση που ξεχωρίζει για τη δύναμη να φροντίζει βλέψεις και να διώχνει εμπόδια.
  emotion.disappointed:
    label: Απογνώση
    summary: Δύσφορο νόημα για φαινόμενα που βρίζουν λιβερτάρι.
    info: Η απογνώση προκαλείται όταν το αποτέλεσμα δεν ικανοποιεί εύκολα μια συμπόνθωςή κάπου.
  emotion.disgusted:
    label: Απτή
    summary: Δυνατό συ feeling απόρριψης όταν συναντάται με αχαριστή διέγερση.
    info: Η απτή είναι βασικό συ feeling που μας προφύλαξε τη δημιουργία ζωώδε υλές και νοσημάτων. Δρα για να φθάσει από τη λήψη βλαβερών τροφών.
  emotion.embarrassed:
    label: Στίγμα
    summary: Δύσκομφο συναίσθημα στίγματος σε κοινωνική κατάσταση.
    info: Ο στίγμα είναι μια κοινωνική απάνθρωπη που δημιουργείται όταν νομίζουμε ότι έχουμε βλάψει τις κοινωνικές φυσικότητες. Δείξει με λύπη (φώναξη), γυρισμό του βλέμματος και συμβολική στάση.
  emotion.excited:
    label: Δέχεται
    summary: Νιώθετε ισχυρή Δέχεται και χαρούμενη αναμονή.
    info: '{"hint":"νιώθετε επουλογή ή μεγάλη πρόκληση","info":"Η δέξιας συμβολίζει τη ρύθμιση και αφορά στη λειτουργία φωτισμού για να βοηθήσει την προσαρμογή στο σκοτάδι.","label":"Δέχεται","summary":"Νιώθετε ισχυρή Δέχεται και χαρούμενη αναμονή."}'
  emotion.frustrated:
    label: Εκνευριστική
    summary: Πόνημα λόγω παρεμβολών για την επίτευξη στόχων.
    info: Η εκνευριστική συμπεριφορά παγίδεψε τους αξόνων μας και οι δύο χώρες βλέπουν να φθίνει.
  emotion.grateful:
    label: ευγνωμοσύνη
    summary: Ένα θερμό αίσθημα αναγνώρισης του καλού που έχουμε ή λαμβάνουμε.
    info: |-
      Η ευγνωμοσύνη προκαλείται όταν αποδιώχουμε το καθάρισμα στη ζωή μας·
      Σύμφωνα με διεξόδια γνωστικές φυλλάδες βεβαίως να λαμβάνουν ευγνωμοσύνη
      Αυξάνουν την ευτυχία,
      Ενεργοποιούν τις περιοχές του εγκεφάλου που σχετίζονται με την απόλαυση.
  emotion.guilty:
    label: ΜΕΤΑΝΟΙΑ
    summary: Δύσκολη αίσθηση ύστερα από την παραβίαση των δικών σας μοραλικών.
    info: 'Η μετάνοια είναι συναισθηματική απόκριση που δημιουργείται όταν κάνουμε το λάθος να θεωρήσουμε κάτι ως «λάθος». Διαφέρει από την αξία φρύδου : για την μετάνοια βασιζόμαστε στη συμπεριφορά , ενώ το φρίδι επηρεάζει την ολική προσωπικότητα .Έχει κοινωνική λειτουργία - μας ενθαρρύνει να προσκαλέσουμε και να διορθώσουμε το λάθος μας.'
  emotion.happy:
    label: ΕΥΦΟΡΙΑΚΟΣ
    summary: Να αισθάνεσαι χαρά ή ευχαρίστηση, να είσαι σε καλή διάθεση.
    info: '{"hint":"αισθάνομαι χαρά ή ευχαρίστηση, ακριβώς το περιέχω","info":"Η ευφορία συνδέεται με δύο νευροπλάγια - Δοπαμίνη και Σεροτονίνη για να βοήθουν στη λειτουργία της φόρμας. Γίνεται ορατή με ύψιστη όραση, εξεζητημένη γλώσσα σώματος και ανοιχτή στάση.","label":"ΕΥΦΟΡΙΑΚΟΣ","summary":"Να αισθάνεσαι χαρά η ευχαρίστηση, να είσαι σε καλή διάθεση."}'
  emotion.hopeful:
    label: Ελπίδα
    summary: Θετικό συναίσθημα ως προς το μέλλον.
    info: Η ελπίδα είναι μια συναισθηματική κατάσταση που αφορά τη δύναμη να θέλεις για καλύτερο μέλλον και να πιστεύεις ότι φτάνεται.
  emotion.hopeless:
    label: Απογνώσια
    summary: Έχει γνωρίσματα λύπης και φοβίας.
    info: Η απογνώσια είναι ένας δυσάρεστη συναισθήματο που χαρακτηρίζεται από την πεποίθηση ότι μια κατάσταση δεν μπορεί να βελτιωθεί.
  emotion.inspired:
    label: Εμπνοή
    summary: Δημιουργική Δράση
    info: Η εμπνοή είναι μια συγκεκριμένη ψυχολογική κατάσταση που διακρίνεται από ξαφνική λύψη των φραγών για να βρεθείς σε κατάσταση εξερεύνησης -δημιουργικής ενέργειας-. Γενικά συνδέεται με επιφάνεια ή συνάντηση με ιδιαίτερο έργο η πρόσωπο.
  emotion.irritated:
    label: Εκνευριστικότητα
    summary: Σύμβολο εκνευριστικότητας.
    info: Η εκνευριστικότητα αποτελεί σύμφωνο ψυχολογικής και φυσιολογικής διέγερσης που μπορεί να οδηγήσει το άτομο να αντιδρά βίαια για λίγο σε μικρά εξώθημα.
  emotion.jealous:
    label: Ζήλια
    summary: Αρνητική συναισθηματική αντίδραση που προκαλείται από τη σύγκριση με άλλους.
    info: 'Η ζήλια είναι συναισθηματικό αποτέλεσμα που δημιουργείται όταν νομίζουμε ότι κάποιος άλλος μας φτάνει τη γλώσσα -δηλαδή βρίσκει κάτι που θα ήψω λύβει και εγώ-. Διαφοροποιείται από την οξύτητα : η ιχνια αφορά τα πλεονεκτήματα των άλλων , ενώ η έντονη ίσως να μας κινητοποιήσει για καλύτερη απόδοση Ή να προκαλέσει αντιπαθία .Σε πολλές πολιτιστικές περιοχές το πράσινο χρώμα είναι σύμβολο Ζήλια.'
  emotion.joyful:
    label: Χαρά
    summary: Έντονη ευτυχία και εξοντωτική εμπειρία ; Περισυκλωμένη από το νόημα σχεδόν εγκαύματής δώρου λαβή για τη φυσική βοθήξη.
    info: "Η χαρά είναι μια έντονη και περισυκλωμένη από το νόημα σχεδόν εγκαύματής δώρου λαβή για τη φυσική βοθήξη·\nΣχετίζεται με εσωτερική αφομοίωση και κατάσταση «flow» · \nΕξελισσόμενη λειτουργία : Δυναμώνει τις κοινωνικές σχέσεις και την κίνητρο για ωφελιμότητα\nΑποτελεί ιδιαίτερα αξιοπρεπή συναισθηματική αντίληψη ; Γι' αυτό , στην θετική ψυχολογία είναι βασικός δείκτης ευεξίας."
  emotion.lonely:
    label: Μοναξιά
    summary: Πόνος από την απουσία επαφής με άλλους
    info: |-
      Η μοναξιά είναι έμπλουτη αἴσθηση διαχωρισμού που υφίσταται κε φυγή του σκέψεως για το νόμιμο βρώμη των ανθρώπων γύρω μας·
      Είναι ιδιαίτερα λεπτός προβλέπων των προβλημάτων χαρακτηριζόμενων· η ρηχή μοναξιά μειώνει την ζωή
      Ο εγκέφαλος αντιδρά στην κοινωνική πόνο όπως στην φυσική πόνο
  emotion.loving:
    label: Αγάπη
    summary: Βαθύ συναίσθημα προσήλωσης και λατρείας προς ένα άτομο.
    info: 'Η αγάπη είναι μια πολύπλοκη συναισθήματος η οποία χρεώνουμε τόσο για να δέχω και φροντίδα, όσο και για εμπιστοσύνη και ιδιωτικό βίβλο. Neurochemicaly συνδέεται με την οξυτοκίνη, dopamine και σεροτονΐνη· Helen Fisher distingueshes τρία systems: sexual desire, romantic love, deeper attachment. It is universal emotion present across all cultures although its expression varies.'
  emotion.melancholy:
    label: Μελαγχολία
    summary: Γλυκό ζεϊμπέκικο συνδυασμένο με λυρική αποξένωση
    info: |-
      Η μελαγχολία είναι συνδυασμός θρήνου και ρομάντικης αποξένωσης που φέρνει το νύφι δώρο για λυρική βαθύτητα·
      Προέρχεται από την ελληνική «μέλαν χολή», τη μαύρη χολή
      Σε αντίθεση με την κατάθλιψη, η μελαγχολία έχει αισθητικό υπόβαθρο,
      aρμονίζει με την περίοδο του φθινοπώματος
  emotion.miserable:
    label: Τράπτη
    summary: Εξαιρετική νέμεψη και μεγάλη λύπη · το ρημα «τράπτῃ» είναι το ύφεση.
    info: Ο τράπτης είναι ένα σοβαρό αρνητικό ψυχολογικό κατάστασ που δείχνει βαθύ νέμεψη και μεγάλη λύπη. Δύναται να προκληθεί από φυσική πόνωση, συναισθηματικό τραῦμα ή απώλεια· γι' αυτό ο χρόνιος τράπτης είναι συμφτωμα της υποδιαθέσεως.
  emotion.nervous:
    label: Νευροτικότητα
    summary: Ασθενής χάρτης πριν από οποιοδήποτε γεγονός · «ψεύτικα» στο στομάχι.
    info: Η νευροτικότητα είναι ένας ασθενής ψύχου πλέγμα κατά τη διάρκεια μια σπουδαία γεγονός. Δε βεβαιώνεται φυσιολογικά λόγω της αυξημένης δραστηριότητας του συμπαθητικού νευρικού συστήματος - π.χ., ταχύπνοια, ιδρωτικότητα. Γενικά, η ασφαλής νευροτικότητα βελτιώνει την απόδοση· αν όμως είναι πολύ θυμωμένη, μπορεί να την παρεμποδίζει.
  emotion.nostalgic:
    label: Νοσταλγία
    summary: Συναισθηματική ανάψυξη από το παρελθόν.
    info: Η νοσταλγία εμπεριέχει την ιδέα μικτής συναισθηματικότητας – αφ’ ενός πάγω γουστώ και χαϊδεύουμε φωτογραφικά λεπτά το παρελθόν, αλλά δεν βρίσκουμε τον εαυτό μας εκεί.
  emotion.optimistic:
    label: Αισιοδοχία
    summary: Προϋποθέτει βεβαιότητα για επιτυχία.
    info: Το αισιόδοξο είναι κυρίως σταθερή πλάγια θέα του μέλλοντος ως φύλλο για να δώσημο λογικό -προβλέψιμο.
  emotion.overwhelmed:
    label: Υπερφόρτωση
    summary: Συναισθηματική κατάσταση όπου πολλά πράγματα συμβαίνουν ταυτόχρονα.
    info: "Ο υπερφόρτωσης συμβαίνει ακριβώς τότε που οι δύο εξάγονται μέχρι να κλείσει γι' αυτή τη λειτουργία·\nΕκδηλώνεται με βλάβη στη σκέψη (αναθεώρηση) , φορτίο ή «παγωμένο» . \nΗ συγκεκριμένη μέθοδος χειρισμού είναι αποτελεσματική ; η ροζ είναι απαραϊτητή."
  emotion.peaceful:
    label: Κλίδ
    summary: Βαθύς αἴσθημα εσωτερικής ειρήνης.
    info: 'Η ησυχία είναι μια ποζερτιβή συγκινημένη κατάσταση απουσίας των χώδιν γύρω - δεν βλέψει να λειτουργεί ο παρασυμπαθητικός νευρικός σύστημα : φτιάξει ένας ρυθμός και πίεση.'
  emotion.pessimistic:
    label: Πεσιμισμός
    summary: Διάθεση να αναμένει κακά αποτελέσματα και να επικεντρώνεται στα αρνητικά.
    info: |-
      Το πεσιμιστικό είναι ένα κυριωδής σύγχρονη απάντηση χαρακτηριζόμενο με τη δέουσα να γίνει λήψη αρνητικών αποτελεσμάτων
      Η βαθύτερη φόβος μπορεί να είναι προσαρμοστικό· η πραγματική αξιολόγηση των κινδύνων βοηθά στην αποφυγή κινδύνων,
      Ο συνεχιζόμενος φόβος συνδέεται με αυξημένο κίνδυνο κατάθλιψης και υποδείξεις.
  emotion.playful:
    label: Παιχνιδοπόλεια
    summary: Ζωντανή διάθεση και επιθυμία για διασκέδαση.
    info: Η παιχνιδοπόλεια είναι μια συναισθηματική κατάσταση χαρακτηριζόμενη από την ικανοφορία για να παίξουμε, το δέος φωριών και τη βούληση να πειραματιστούμε· Για τους εγγεγονότες λειτουργεί ως θετικός προβλέψιμος παράγοντας της δημιουργικότητας και της καλής ψυχικής υγείας.
  emotion.proud:
    label: Υπερηφάνια
    summary: Θετικό συναίσθημα ικανοποίησης από τις δικές σου επιτυχίες.
    info: "Η υπερηφάνια είναι συναισθήμα που έχει νόημα με το αίτημα για δικές του καταγωγές ή τη λύπη για κάτι βλαβερό.\nΠρώτα φαίνεται με αξιοπρεπή στάση, ψηλαφισμένο κεφάλι και επεκτεταμένο στήθος,\nΕίναι χρήσιμη(διεγείρει), η αρνητική (αρχαιότητα). \nΣτην ινδική θρησκεία , ο όρος 'ahaṁkarā' είναι εμπόδιο για την πνευματική ανάπτυξη."
  emotion.relieved:
    label: Ανακούφιση
    summary: Πληροφορίες σχεδιασμένες για να βοηθήσουν τους φοιτητές να αναπτύξουν.
    info: Η ανακούφιση είναι μια συγκεκριμένη έμπτυχή που νιώθεται όταν το κόψω διάβαζε για λίγο.
  emotion.sad:
    label: θρηνώ
    summary: Να λυπάσαι ή να εχεις απώλεια.
    info: Το θρηνιμό είναι φυσική απάντηση σε μια πληγωδή κατάσταση όπου το νέφος δεν βγαίνει γρήγορα.
  emotion.scared:
    label: Φοβισμένος
    summary: Να αισθάνεται φόβο ή θρῆσιμο από κίνδυνο ή απειλή.
