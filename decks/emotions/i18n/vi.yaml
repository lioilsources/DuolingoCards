lang: vi
pivot: false
title: Cảm xúc
cards:
  emotion.angry:
    label: giận dữ
    summary: Cảm thấy bất bình hoặc giận dữ mạnh mẽ, tức giận.
    info: Giận dữ là cảm xúc phản ứng lại sự bất công được nhận thức hoặc mối đe dọa. Nó làm tăng nhịp tim và chuẩn bị cơ thể cho hành động 'chiến đấu hay bỏ chạy'.
  emotion.calm:
    label: thanh thản
    summary: Cảm thấy bình an và dễ chịu bên trong, ở trạng thái yên tĩnh.
    info: Thanh thảnh là trạng thái cân bằng tinh thần và thể chất. Nó làm chậm nhịp tim, tăng cường hơi thở sâu và giúp tư duy rõ ràng cũng như ra quyết định tốt.
  emotion.excited:
    label: hào hứng
    summary: Cảm thấy hào hứng và mong chờ vui vẻ.
    info: Hào hứng là cảm xúc tích cực mạnh mẽ liên quan đến việc mong đợi một sự kiện dễ chịu. Nó làm tăng năng lượng, tim đập nhanh hơn và thúc đẩy tư duy sáng tạo.
  emotion.happy:
    label: hạnh phúc
    summary: Cảm thấy niềm vui hoặc sự thỏa mãn, ở trong tâm trạng tốt.
    info: Hạnh phúc là cảm xúc dễ chịu liên quan đến việc giải phóng dopamine và serotonin. Nó thể hiện qua nụ cười, cử chỉ sống động và tư thế thân thiện.
  emotion.sad:
    label: buồn
    summary: Cảm thấy đau buồn hoặc không hài lòng, bị trầm cảm.
    info: Buồn là một cảm xúc tự nhiên như phản ứng với sự mất mát hay thất vọng. Biểu hiện bằng nước mắt, khóe miệng rủ xuống và dáng đi uể oải.
  emotion.scared:
    label: sợ hãi
    summary: Cảm thấy sợ hoặc kinh hoàng trước nguy hiểm hay mối đe dọa.
    info: Sự sợ hãi là một cảm xúc phòng vệ cơ bản. Nó kích hoạt việc giải phóng adrenaline, làm tim đập nhanh và chuẩn bị cho cơ thể để chạy trốn hoặc tự bảo vệ.
  emotion.surprised:
    label: ngạc nhiên
    summary: Cảm giác kinh ngạc trước một sự kiện bất ngờ.
    info: Ngạc nhiên là cảm xúc rất ngắn chỉ kéo dài vài giây. Biểu hiện của nó bao gồm há miệng ra, nhướng mày lên và đồng tử giãn rộng.
  emotion.tired:
    label: mệt mỏi
    summary: Cảm thấy mệt về thể chất hoặc tinh thần, cần nghỉ ngơi.
    info: Mệt mỏi là tín hiệu cơ thể cho biết nó cần được nghỉ ngơi. Triệu chứng bao gồm buồn ngủ, phản ứng chậm lại và khả năng tập trung kém hơn.
