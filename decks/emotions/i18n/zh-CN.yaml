lang: zh-CN
pivot: false
title: 情绪
cards:
  emotion.amazed:
    label: 敬畏
    summary: 遇到非凡事物时产生的强烈的积极惊喜感
    info: |-
      敬畏（惊讶）是一种由巨大或令人震撼的事物引发的强烈情绪。它会降低自我重要性的感觉，并增强与周围环境联系的感觉。
      研究表明，这种感受可以减轻压力并增加亲社会行为。
  emotion.amused:
    label: 愉悦
    summary: 一种轻松愉快的乐趣或者消遣的感觉
    info: 愉悦是一种由有趣或有意思的事物引发的轻微积极情绪。它与笑不同；笑声是愉悦的结果，但并非所有愉悦都会导致大笑。这是一种社会共享的情绪：当我们与其他分享时会觉得事情更有趣味性。同时也能体现智力水平——幽默感通常和发现矛盾的能力有关。
  emotion.angry:
    label: 生气的
    summary: 感到强烈的不满或愤怒，表示很恼火。
    info: 愤怒是一种对感知到不公或威胁的情绪反应。它会提高心率，并让身体做好“战斗还是逃跑”的准备。
  emotion.annoyed:
    label: 易怒
    summary: 由于反复出现的干扰性刺激引起的轻度生气感
    info: 烦躁是一种由重复的干扰刺激引发的轻微负面情绪。它通常会演变为更强烈的愤怒，并可能因睡眠不足、饥饿或压力过大而引起。
  emotion.anxious:
    label: 焦虑
    summary: 一种对不确定未来感到不安与担忧的不适感觉
    info: |-
      焦虑是一种预示威胁的情绪；适度的焦虑是适应性的，并能提高表现。其身体表现为心跳加速、出汗、呼吸急促和肌肉紧张。

      焦虑障碍是最常见的精神疾病，影响超过三亿人。认知行为疗法（CBT）是对治疗焦虑症最有效的方法。
  emotion.bored:
    label: 无聊
    summary: 对任何事物都不感兴趣且没有参与感的空虚感觉
    info: 无聊是一种由缺乏刺激或有意义活动引起的负面情绪状态。它可能导致人们寻求新体验或者创造性思维，从进化角度看则激励寻找机会的行为。
  emotion.calm:
    label: 平静的
    summary: 内心感到安宁和舒适，处于平静状态。
    info: 平静是一种心理与身体平衡的状态。它会减缓心跳、加深呼吸，并有助于清晰思考和做出良好决策。
  emotion.cheerful:
    label: 愉悦
    summary: 一种令人感到开心、乐观的心情
    info: 快乐是一种积极的情绪状态，其特征是充满热情和良好的心情。它与外向性格以及高度的正面情感有关，并且具有传染性；一个愉快的人的存在可以改善周围人的氛围。
  emotion.confident:
    label: self-efficacy
    summary: 相信自己的才能与价值
    info: '{"hint":"对自己的能力感到自信；挺拔的姿势","info":"自我效能感是一种对自己能力和判断的信任情感状态。\n笔直的姿态、直接的眼神接触和沉稳的声音都是自信心的表现形式。\n艾米·卡迪（2012年TED演讲）推广了权力姿态作为增强自尊的方法。\n它可以通过在小步骤中取得成功以及获得积极反馈来逐步建立起来。");'
  emotion.confused:
    label: 困惑
    summary: 对某种情况或者信息感到不确定的感觉
    info: |-
      困惑发生在我们缺乏理解情境的背景或知识时。它是学习过程中的自然组成部分；认知失调会促使人们寻找答案。
      在面部上表现为低头和皱眉的表情特征，沟通中出现混淆可能导致误解的关键在于提问。
  emotion.content:
    label: 满意
    summary: 一种宁静、安详地感到足够而不渴望更多的心情
    info: |-
      满足感是一种平静的积极情绪状态，不需要改变。它与幸福不同；满足是安静而平和的状态，而快乐则充满活力。
      佛教将这种满足（称为 santosa）视为通向觉悟的重要美德之一。
      幸福感研究显示：相较于狂喜而言，人们更容易保持长久且稳定的内心安宁。
  emotion.curious:
    label: 好奇
    summary: 渴望获得新的认识或理解
    info: 好奇心是一种激发寻找新信息和经验的动机状态。它与多巴胺奖励系统相关；字面意义上带来愉悦感，对科学进步和个人发展至关重要。
  emotion.delighted:
    label: 狂喜
    summary: 对令人高兴的事情或者意外之喜产生的强烈的欢乐
    info: |-
      狂喜是一种由愉快事件或惊喜引发的强烈积极情绪。它比基本快乐更加强烈，并以更加动态的方式表现出来，比如跳跃、呼喊和大笑。
      其进化功能是强化导致理想结果的行为；这种喜悦具有社会传染性：分享后的愉悦感会超过原来的两倍。
  emotion.determined:
    label: 决心
    summary: 尽管遇到障碍仍强烈希望实现目标
    info: |-
      决心是一种动机性的情感状态，其特征是专注的目标和毅力。表现为紧咬牙关、身体紧张以及目光坚定。它与“坚韧”（安吉拉·达克沃斯）密切相关：激情与坚持的结合体。
      研究表明，在预测成功方面，决定胜过智力。
  emotion.disappointed:
    label: disappointment
    summary: 当我们现实中的体验没有达到我们的希望和期盼值时所感受到的一种不舒服的感觉
    info: |-
      失望产生于结果不符合期望或愿望时。当情感投入较高或者努力较多的时候，这种情绪会更强烈。
      研究表明预期是关键因素；较低的期待会导致较小程度上的失落感。
      情商教育包括处理诸如沮丧等不愉快的情绪。
  emotion.disgusted:
    label: 恶心
    summary: 在遇到不愉快刺激时产生强烈的排斥感
    info: 厌恶是一种保护我们免受有害事物（有毒食物、疾病）的基本情绪。进化功能是阻止食用变质的食物；表现为皱鼻子，吐舌头和特有的表情，并且也会因道德上令人反感的行为而引发这种感觉，在社会中起到调节作用。
  emotion.embarrassed:
    label: shame
    summary: 在社交情境中产生的令人不适的羞愧感
    info: 羞耻是一种社会情绪，当我们认为自己违反了社会规范时产生。它表现为脸红、避开目光和低垂的姿势，并具有社交功能：向他人表明我们对规则的认知以及遵守它们的愿望。
  emotion.excited:
    label: 热情的
    summary: 感到强烈的热情和喜悦的期待。
    info: 热情是一种与期待愉快事件相关的强烈积极情绪。它能提升能量，加快心跳，并促进创造性思维。
  emotion.frustrated:
    label: 沮丧
    summary: 因达成目标遭遇困难所引发的不快感受。
    info: |-
      {"hint":"当无法实现某事时感到烦恼","info":"挫败感是一种情绪，当我们目标受阻于障碍物。\u005c
      它可能导致建设性的行动（寻找替代方案）或破坏性行为（攻击）。\u005c
      挫折理论是二十世纪二十年代有影响力的心理学说之一。\u005c
      身体表现包括：紧握拳头、脸红和肌肉紧张。","label":"沮丧","summary":"在追求目标遇到阻碍而产生的一种烦躁感觉。"
  emotion.grateful:
    label: 感恩
    summary: 对已有或所获之好事心怀感谢和赞赏的一种温暖感受
    info: 感恩是一种积极情绪，当我们意识到生活中存在的善与美好时就会产生这种感觉。正向心理学的研究表明经常表达感激之情可以提升幸福感，并且能激活大脑中类似身体愉悦的奖励中心区域。
  emotion.guilty:
    label: 罪恶感
    summary: 违反自己道德准则后产生的痛苦感受
    info: 内疚是一种情绪，产生于做了我们认为错误的事情之后。它与羞耻不同：内疚关注的是具体的行为，而羞耻则涉及整个人的自我评价。这种情感具有社会功能：促使人道歉和改正行为，并加强道德规范。
  emotion.happy:
    label: 快乐的
    summary: 感到高兴或愉悦，心情愉快。
    info: 快乐是一种与多巴胺和血清素释放相关的愉悦情绪。它通常表现为微笑、生动的手势以及开放的身体姿态。
  emotion.hopeful:
    label: hope
    summary: 对未来会变好的乐观感受
    info: 希望是一种情感，结合了对更好未来的渴望和相信其可实现性。它是面对困难时韧性（适应力）的关键因素；研究表明具有更高期望的患者康复得更快。
  emotion.hopeless:
    label: 绝望
    summary: 感觉未来不会带来任何积极的变化
    info: |-
      绝望是一种负面情绪状态，其特征是相信情况无法改善。它是抑郁症的核心症状和自杀风险的重要因素。
      aaron beck的认知疗法模型将绝望视为核心信念之一；认知重构等方法已被证明对干预有效。
  emotion.inspired:
    label: 灵感
    summary: 激发创造性行动的动力性创意激情
    info: 灵感是一种情感状态，其特征是突然的动机和创造性的兴奋。它通常与顿悟或遇到非凡的作品或人物有关。从神经科学的角度来看，它可以激活前额叶皮层和奖励中心。
  emotion.irritated:
    label: 强烈恼火
    summary: 一种因小事而产生过度敏感的情绪；接近愤怒的状态
    info: |-
      易怒是一种情绪状态，表现为对微小刺激的反应增强，并引发较强的负面回应。它可能表明疲劳、睡眠不足或压力累积所致。
      青春期女性以及怀孕期和更年期妇女可能会经历由荷尔蒙变化引起的烦躁。
  emotion.jealous:
    label: zhenxiang
    summary: 因与其他比较产生的负面情感
    info: '{"hint":"对他人优势感到嫉妒（绿色是嫉妒的颜色）","info":"羡慕是一种情绪，当我们认为别人拥有我们想要的东西时产生。\n它与吃醋不同：羡慕涉及他人的优点，而吃醋则关系到自己感情的威胁。\n它可以激励更好的表现或导致怨恨心理。\n在世界各地的文化中，绿色都是象征着嫉妒。");'
  emotion.joyful:
    label: 喜悦
    summary: 强烈的愉悦感及外溢的情绪表现
    info: 快乐是一种充满幸福感的强烈积极情绪。它与内在动机和心流状态（米哈里·契克森米哈伊）相关联，其进化功能是增强社会联系并激励有益行为；在全社会受到重视，在正向心理学中更是衡量幸福的重要指标。
  emotion.lonely:
    label: 孤独
    summary: 缺乏与其他人的接触而产生的痛楚感受
    info: 孤独是一种主观的孤立感，与周围实际的人数无关。它是健康问题的强大预测因素；慢性孤独会缩短寿命。大脑对社会性痛苦和身体疼痛作出相同的反应。
  emotion.loving:
    label: love
    summary: 对他人产生的深厚情感吸引力
    info: |-
      爱情是一种复杂的感情，结合了倾慕、关怀、信任和亲密。神经化学上它与催产素、多巴胺及血清素有关联。
      海伦·费舍尔区分出三种系统：性欲望、浪漫的爱以及更深层次的情感依附。
  emotion.melancholy:
    label: 忧郁
    summary: 一种带有深邃思考及美感特征的心境低落状态
    info: |-
      忧郁是一种结合了悲伤、沉思和某种甜蜜的情绪。它源自希腊语中表示黑胆汁（melan choles）的词；古代医生将其归因于体内过多的黑色苦味物质。
      与抑郁症不同，这种情绪包含美学成分，并常被艺术作品所赞美。
  emotion.miserable:
    label: 痛苦
    summary: 极度的不快与受苦；悲伤最严重的程度
    info: 痛苦是一种强烈的负面情绪状态，其特征是深深的不适和苦难。它可能由身体疼痛、情感伤害或失去所爱引起。
  emotion.nervous:
    label: 紧张
    summary: 某事发生前的一种轻度不安情绪；胃里有蝴蝶飞舞的感觉
    info: 紧张是一种轻微的焦虑状态，通常与重要事件之前的预期有关。生理上表现为交感神经系统活动增强：心跳加速、出汗等。 适度的紧张可以提高表现；过度则会干扰发挥 将紧张重新定义为兴奋（激发重评）是有效的策略。
  emotion.nostalgic:
    label: 怀旧
    summary: 对过去的甜美而略带痛楚的情绪感受
    info: 怀旧是一种充满甜蜜苦涩的情感；回忆过去是愉快的，但同时又令人痛苦。这个词来源于希腊语中的‘nostos’（回家）和‘algos’（疼痛）。研究表明，怀旧感能增强社会联系并提升生活的意义感。
  emotion.optimistic:
    label: 乐观
    summary: 倾向于期望好的结局并看到正面的一面
    info: |-
      乐观主义是一种认知情感风格，其特征是对积极结果的期待。马丁·塞利格曼（正向心理学）将乐观视为抗压能力的关键因素。
      乐天派活得更久、健康状况更好且更为成功。
      可以通过学习培养乐观：把挑战看作是暂时性的、具体的和可控制的事物。
  emotion.overwhelmed:
    label: 超负荷
    summary: 当太多事情同时发生而让人感到不堪重负的感觉
    info: 信息过载发生在需求超过我们的处理能力时。表现为认知障碍（无法清晰思考）、情绪爆发或僵化状态。
  emotion.peaceful:
    label: 安静
    summary: 一种深层内在平和舒适的感受
    info: 平静是一种积极的情绪状态，没有压力和干扰。它是冥想练习的目标，尤其是正念禅修与禅宗冥想的追求目标之一；它会激活副交感神经系统：降低心率及血压水平，在生态心理学中认为置身大自然是达到内心宁静最有效的方式。
  emotion.pessimistic:
    label: 悲观主义
    summary: 倾向于期待糟糕的结果并关注负面因素
    info: '{"hint":"预期最坏的情况；头顶乌云","info":"悲观主义是一种认知情感风格，其特征是对结果持消极态度。\n适度的悲观可能是适应性的：对风险进行现实评估有助于避免危险。\n慢性悲观与更高的抑郁和更差健康状况的风险相关联。\n认知行为疗法可以帮助改变这种悲观思维模式。"]'
  emotion.playful:
    label: 游戏
    summary: 充满活力的情绪以及对娱乐活动的兴趣
    info: |-
      游戏性是一种情绪状态，其特征是对玩耍、幽默和实验感到快乐。在成年人中是创造力与良好心理健康的积极预测因素。
      进化功能：在一个安全的环境中发展技能。
  emotion.proud:
    label: 自豪
    summary: 对自己成就感到满意的一种积极感受。
    info: |-
      自豪是一种与成功或归属有价值事物相关的感情。
      挺直的姿势、抬起头部和扩张胸部是普遍表现骄傲的方式。
      它可以是有益健康的（激励发展）或者有害健康（傲慢）。
      在印度教观念中，自大(ahamkāra)会阻碍精神的发展。
  emotion.relieved:
    label: 宽慰
    summary: 一种令人愉快的感觉，在紧绷或者危险解除之后产生
    info: 宽慰是一种在压力、担忧或疼痛消退后体验到的情绪。它表现为深呼吸，肌肉紧张的缓解和轻松感。从进化角度看很重要；表明威胁已经过去可以放松了。
  emotion.sad:
    label: 悲伤的
    summary: 感到哀伤或不满，处于抑郁中。
    info: 悲伤是一种自然的情绪反应，通常在失去某物或遭遇失望时产生。它表现为流泪、嘴角下垂和低落的姿态。
  emotion.scared:
    label: 害怕的
    summary: 对危险或威胁感到恐惧或惊慌。
    info: 恐惧是一种基本的防御性情绪。它会引发肾上腺素释放，加快心跳，并使身体做好逃跑或保护自己的准备。
  emotion.serious:
    label: '"seriousness"'
    summary: 安静的集合没有幽默感；专注于重要的事情
    info: '{"info":"庄重是一种情绪态度，其特点是专注和缺乏轻率。\n在需要集中注意力并仔细思考的情况下非常重要。\n它可能因文化而异；某些文化中重视严肃性，在其他一些则与难以接近相关联。\n平衡认真性和趣味性的关键在于心理灵活性。");'
  emotion.shocked:
    label: 震惊
    summary: 因突如其来的情报或事件而感到惊愕
    info: 震惊是由意外、令人惊讶或震撼的信息引发的一种强烈情绪。表现为突然僵住，嘴巴张开和瞳孔放大。进化功能：暂停活动并处理突如其来的信息。
  emotion.shy:
    label: shyness
    summary: 在社会场合尤其是面对陌生人时感到焦虑或胆小
    info: |-
      {"info":"羞怯是一种在他人面前表现出紧张和拘谨的社会情绪。\u005c
      它与内向性格有关，但并非完全相同。\u005c
      轻微的害羞是正常的；严重的形式（社交恐惧症）会影响正常功能发挥。\u005c
      文化影响显著：某些文化中将羞怯视为美德，在另一些则视其为障碍。");
  emotion.surprised:
    label: 惊讶
    summary: 对意外事件感到突然的惊奇。
    info: 惊讶是一种持续仅几秒的短暂情绪。表现为嘴巴张开、眉毛上扬和瞳孔放大。
  emotion.tired:
    label: 疲倦的
    summary: 感到身体或精神上的疲惫，需要休息。
    info: 疲劳是身体发出的信号，表示它需要休息。表现为困倦、反应变慢以及注意力下降的能力减弱。
  emotion.upset:
    label: 沮丧
    summary: 由消极经历引发令人不适的情感困扰
    info: 沮丧是一种普遍的负面情绪状态，结合了悲伤、愤怒和焦虑。它是对不愉快事件、失望或冲突的一种反应，在生理上会激活压力轴（下丘脑—垂体—肾上腺），增加皮质醇水平；情感调节方法如呼吸训练及认知重构有助于缓解这种不良的情绪。
  emotion.worried:
    label: 担忧
    summary: 反复思考可能发生的未来问题
    info: 担忧是一种认知性情绪状态，专注于对潜在威胁的预期。适度的担心是适应性的，并能促使人们做好准备；而慢性忧虑（焦虑障碍）则会干扰日常功能发挥。
