lang: zh-CN
pivot: false
title: 情绪
cards:
  emotion.angry:
    label: 生气的
    summary: 感到强烈的不满或愤怒，表示很恼火。
    info: 愤怒是一种对感知到不公或威胁的情绪反应。它会提高心率，并让身体做好“战斗还是逃跑”的准备。
  emotion.calm:
    label: 平静的
    summary: 内心感到安宁和舒适，处于平静状态。
    info: 平静是一种心理与身体平衡的状态。它会减缓心跳、加深呼吸，并有助于清晰思考和做出良好决策。
  emotion.excited:
    label: 热情的
    summary: 感到强烈的热情和喜悦的期待。
    info: 热情是一种与期待愉快事件相关的强烈积极情绪。它能提升能量，加快心跳，并促进创造性思维。
  emotion.happy:
    label: 快乐的
    summary: 感到高兴或愉悦，心情愉快。
    info: 快乐是一种与多巴胺和血清素释放相关的愉悦情绪。它通常表现为微笑、生动的手势以及开放的身体姿态。
  emotion.sad:
    label: 悲伤的
    summary: 感到哀伤或不满，处于抑郁中。
    info: 悲伤是一种自然的情绪反应，通常在失去某物或遭遇失望时产生。它表现为流泪、嘴角下垂和低落的姿态。
  emotion.scared:
    label: 害怕的
    summary: 对危险或威胁感到恐惧或惊慌。
    info: 恐惧是一种基本的防御性情绪。它会引发肾上腺素释放，加快心跳，并使身体做好逃跑或保护自己的准备。
  emotion.surprised:
    label: 惊讶
    summary: 对意外事件感到突然的惊奇。
    info: 惊讶是一种持续仅几秒的短暂情绪。表现为嘴巴张开、眉毛上扬和瞳孔放大。
  emotion.tired:
    label: 疲倦的
    summary: 感到身体或精神上的疲惫，需要休息。
    info: 疲劳是身体发出的信号，表示它需要休息。表现为困倦、反应变慢以及注意力下降的能力减弱。
