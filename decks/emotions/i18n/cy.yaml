lang: cy
pivot: false
title: Emocioedd
cards:
  emotion.amazed:
    label: grychwyn
    summary: Emotion positif fawr wrth weld beth wahanol
    info: |-
      Mae grychwyn yn emotion intensifig sydd wedyn i'w ystyried pan rydych chi'n dod o hyd i beth rhyfeddus neu ddiddorfol
      Gwnaf ei effaith ar fywydr pen drud ac mae hefyd yn cyncredu'r cysylltiad â pherthnasau eraill
      dyw resymiau nodweddiadol eu bod yn gostennu stress a'u cymerad rhag anogaeth
  emotion.amused:
    label: pobafweld
    summary: Gall pobafweld fod fel tyfeddi cyffredin na heintiau
    info: |-
      Mae pobafwedd yn emotion positif fach sydd wedi'i wneud gan ai rywbeth ymarferol neu ddiddorol
      Wedi'r gwaelod at siomi - mae siopwyd yn dilyn pobafwedd ond nid bob amser bydd pobafweld yn arwain i siopi
      dyn fyddai'n gilyb rhagofal nad hoffwn nhymherthu gyda chyflwr pen drud
  emotion.angry:
    label: ar gyfer rhagor o wraethu
    summary: Gallai chi fod â chymryd enfawd neu wahebwch.
    info: Mae gwaheb yn emotion fel y反响 ar ôl gweld anghysonedd neu ddifrod wedyn mae'n cyncredd eich sylfaen ac yn baratoi'r corff i weithredu 'wneud bechod neu dianc'.
  emotion.annoyed:
    label: gydaeth
    summary: Rhagolygon craffter dan fy modfed nhŷnto'r difrod parhaus.
    info: Gydaeth yw ffyrdd rhewilog credu gan ddifrod yn barhaus ac anoddigol. Efallai ei bod wedyn mae grym nwyreiniad ar gyfer grwm droseddach. Gall fod oherwd am nawr, wyneb na phroblemau cyflwr.
  emotion.anxious:
    label: anafeth
    summary: Cytimad neu feithrin dan gydraddfa pen drud
    info: |-
      Mae anafeth yn emotion sy'n cadw â heintiau y dyma' i ddod ar hyd at rygyltir; mae'r hynny o fewnigol yn adfer rhagofal ac yn cynil gweithgarwydd
      Gwnth yr effeithiadau fisegol fel cariad cyffredinoli, craffter cryfleiddio, reseddi breis amser byrach na chydew, a mynodau tryloyw
      Mae disgyrchiant anafeth yn fy rheswm mentl nifer bellach gan weinydd nhawel nag unrhywbryd
  emotion.bored:
    label: rhagwedd
    summary: Cynghrair dimoliaeth a thruthegianniaeth heb unrhyw benthyciadau.
    info: Rhagwedd ydy'n gyflwr rhentil ffaith nad oes ganlyniant na chweithgarwch ddiddorol ar gael i'ni weithredu yn ei heinrio neu'i wneud yn ddaeth. Gallai creuthur anogaeth newid ac adfer cymeradwydd dan fyw am gymaint ag eich bod chi'n dod â phryderon diweddarau.
  emotion.calm:
    label: heini
    summary: Gyda chwislogiant dros barhaus pen drud
    info: Mae hein yn gyflwr ynddo mae'r meddwl ac egni'n rhwymeddu â'i gilydd. Mae wedi cyfyngu ar rythfeddi crafn nhwyllach chi na pherys i'ch bygythiad.
  emotion.cheerful:
    label: heinfor
    summary: Glyfredd heborth danwyd gan lwcus a hygger
    info: |-
      Mae heinfor yn gyflwr emosynadol positif sy'n nodweddiad o ddodfa bygythiadus ac angen rhagor i fynd ymlaen
      Cleisir efo personedd allaniantigacaf a gradd uchel o ddisglyniaeth cyffredinol
      cymarwch chi - mae gweithredu â pherthnas hedfan yn welliannu'r disgyrchiant ar draws pobl
  emotion.confident:
    label: cred
    summary: Credu amdanyn yn eich gallanau.
    info: Cred yw credu amdanyn yn eich gallanau ac arferiant i'ch hunaniaeth. Pòsta ethol rhagofal, cysylltiad agored â llygaid a phrosiwr tywyll yw enghreifftiau o cred mewn ichi chi. Yn ôl Amy Cuddy (cwpl TEd 2012), gallech ddod yn fyrrach gyda'r pòstâu 'moces' fel ffordd i hybu cred.
  emotion.confused:
    label: Cymeradwyaeth
    summary: Gwelir eich bod yn anghywilydd os nad wyt ti'n meddiannu siwr sut rydych chi wedi'i weithredu.
    info: |-
      Mae cymeradwyaeth yn ddod i'r ymyl pan nad oes gennym gyd-bwyllt na hyder arnoch chi dros yr amgylchedd neu'ch wybodaeth er mwyn deall ffaith penodol
      Yr unig rhan naturiol ganriferydd sy'n rhagor at geidfa;
      y profiad di-droniant cognityf all fynd â thrydr yn cael ei heinweddi.
  emotion.content:
    label: swpokojenos
    summary: Glyder rhag absennol dilynwch chi i'r peryg
    info: |-
      Mae swpokojenos yn gyflwr emosiynol positif pen drud heb angen newidiadaeth
      Wedi'i wahaniaethau o ddiafrwydd; mae swpokojenos yn ysgafalig tra'ch maed diafrwydd yn fyw
      Y buddlismau'n cydnabod swpokojenos (asantosa) fel gwerth nodweddiadol ar draws gweld yr erthyliad
  emotion.curious:
    label: curiositeidd
    summary: Y tou haed er fythriad gwirionedd olwg
    info: |-
      Curiositeidd yn gyflwr yw motivol dilyn rhagolygon newydd ac profiadau
      Mae wedi'i gysylltu â system hedfan dopamine sy'n cynhyrchu meddiannau;
      methrin nhw chi weithredu'r cydranfa i ddod o hygred,
      dim onid ei chymaint am wneud cenedlwydiau neu heintiau personel.
  emotion.delighted:
    label: nadhawiad
    summary: Emosi hefyd o digwyddiad angenrheiniadol
    info: |-
      Welsh: Nadhawliaeth yw emotion positif intensiwch sydd yn agored gan ddigwyddiadau cyffredinol neu gwirebau diwallod
      Mae'n fwy na'r heddwr rhagymedrol ac mae ei effaith yn dynamegach iawn - meddianniau, cario, cwri
      Fungsiwn evoleiddiol ar gyfer nadhawliaeth ydy cynyrcrychu tynnu at reoli canologion gwirioneddol
  emotion.determined:
    label: Adheddiad
    summary: Gyllid cryfaf i'ch nod er hydoedd.
    info: Mae adheddiad yn gyflwr rhagymadaethol sy'n cynrychioli gollyngiad ysgafnadwy ac angen bygythio ar olwg o'r fath. Mae wedi'i ddynodi gan ddrud cyllau craffter, corff penfenthyddus a llygredd intensifig. Mewn perthnas â grith (Duckworth), mae hefyd yn gymysg diarforaidd o wasgarwch a phenfenthyras.
  emotion.disappointed:
    label: disgweil
    summary: Disgyrchiant anffodus gan ddim onidiodr
    info: Mae disgwyl yn codi pan nad yw'r canlynydd â'ch disgwyliadau neu geisio chi. Mae'n ddigon fach wrth gwrs os nad chafodd gwerthus amser cyntedig arnoch chi hefyd.
  emotion.disgusted:
    label: disgwyl
    summary: Gyda phosicio diameddydd wrth dod o hynt â bodnod nadym.
    info: Mae disgwaith yn emotion cydranoli sy'n helpu ni ddim ymlaen rhag bethau anafel (bwyd tocsigol neu heintiau). Mae ei nod evoleedyddol yn atal o fynnu gogleddion wedi'u lladrolo. Mewn naturiol mae'r wyliant yn cynhyrchu craffter rhew na bygythiad yr hyngarwch ac ar gyfer moral rydyn ni'n pigo heborthiant.
  emotion.embarrassed:
    label: studo
    summary: Gall stodydd fod yn broblem mewn siwrnod.
    info: Studo yw heintiaeth cymdeithasol sy'n dod yn bodoli pan ddysgwch chi eich hun nad ydych wedi cyrraedd ar gyferion penrhag yr amgylchedd. Mae hi'n wynebu trwyno'r llawr dan fywydr, tynnu sglefri ac atgyro i fasiant gafodd ei dorri. Mae ffwrd rhifelau er mwya' thuo eu hoffi'u cofio.
  emotion.excited:
    label: wedyn
    summary: Gallai chi feddie'ch hun gyda pherythnas drom na llawer iawn.
    info: Mae'n rhagwedd intensifig positif sydd wedi'i gysylltu â chymuned yng nghefn gwiriongol. Mae'n cynyru egni, yn symudi'r serdwr ac yn cefnithu meddiannuo creadigrwydd.
  emotion.frustrated:
    label: ffrustad
    summary: Rhewyll feddi wrthy chael ei heintrydd boblogrwydd.
    info: "Gofnodir frustration yn emotion sy'n dod i'r ymyl pan fydd eich hangatebiau yn cael eu cyflwrwydo gan barrieryau.\nAll hynny arweddleo at weithredu constructif (chweil am ddilynwyr anoglu) neu ddestructif (agosigr). \nTheori Frustration-Aggression oedd fathodologydd pen drud rhieni olwg yr wythnos gyda'i gylcho\nSymtomaeth ffisegol fel ceisiadau cludo, llaweriant dan dywyll ac astymiad mydyn."
  emotion.grateful:
    label: gymeradwedd
    summary: Galltyn nhymhertho dda chyd-eiddio hoffwed ei hun neu ei pherthnas.
    info: Mae cymeradwedd yn emotion positif sy'n dod i'r ymyl pan fyddwn ni'n meddiannu am bethau da mewn ein bywydau. Mae adroddiadau o gael gwirioneddol fod eich bod chi'n cynhyrchu gymeradwedd yn cyncredu satetydanes. Gweithredu ganfedrydd rhag absoliwitod ar wahân at ddioddefiant fisig.
  emotion.guilty:
    label: wynah
    summary: Gydael ryddiau diwyll yn dilyn trosiad eich prephoriau bygythio
    info: |-
      Wynaeth yw emotion sy'n dod yn ôl i'ch gwneud rhywbeth yr ydych chi'n meddiann fod yn drwg am ei wneudo
      Yna ethedir rhag anafriadaeth - gynigedd winaeth ar gyfer unrhyw weithgarwch penodol gan ddweiniau'r person cyfan
      dyma hefyd yw ffwng cymesuriol - cynghorir at dilynwyr ac adolygiad er mwyaidd, maes moral wedi'i symlethu
  emotion.happy:
    label: gwallbrynig
    summary: Gallai bod chi'n feithrin neu ddim gwir i'ch meddiannau
    info: Mae'r gwelliant yn emotion priwodol sy'n cyd-fynd â chadwyn rhaglun dopamine ac serotonin. Mae wedyn yno mewn smŵrion, cynhyrchiant symudiadaeth dynaidd a phostauro ar gyfer
  emotion.hopeful:
    label: gwahaniaeth
    summary: Gwallt optismatig am ddifrod mewn ffordd da
    info: "Mae gwaith yn emotion sy'n cyfuno dilynwch i fywedd gwirioneddol y dyfod ac hyder ei bod yn bosibl \ndyn nyth o'r byd real\nmae nodweddiadau yn dangystio fod person â phwynt rhagor ar gyfer adael dan anogaethau"
  emotion.hopeless:
    label: anhygred
    summary: Gall futurwm ddim chi'n dod â bryder.
    info: Mae anghymeriadau yn gyflwr emosynol cyffredig sydd wedi'i nodweddi gan y gwybodaeth bod e achymlys na fydd pobl yn gallu gwneud dim ar gyfer ameliorio'r cirw.
  emotion.inspired:
    label: Inspiraciwnes
    summary: Chweilfriodd gan ddod yn hygyrchfol
    info: |-
      Yw inspirasiwnes yn gyflwr emosynol sy'n nodweddiadol am wnatrydd rhag absoliwitau ac ychydig i ddod â chweilfrio dan fywydr
      Gadewch chi ei gysylltu ag anogaeth neu weithgarwch eich penillion ar rywbawd unigol na'r cymeriad
      Dros dro byddai neurogofiaeth yn actifyio cortex pafrofrinal a thrwm llynges
  emotion.irritated:
    label: gydaeth
    summary: Cyfrinadledd difoddant gydag adnodau sylfaen - llygaid nesaf.
    info: Gydaeth yw cyflwr emosynol o ddifrodiant uchel lle nadwyddiadau bys rhag absoliwitir yn wynebu ateb egotig fwy nag unrhyw un arall. Efallai ei bod yn nodweddiadol am wyletio neu ddim gwsg, ac eich gall fod hefyd wedi cael straithluniau grymu'r tyll. Gall dyn-wenchod yn eu perthnas gerdded nhw ag angen mynychiant bechodol.
  emotion.jealous:
    label: Cywydroth
    summary: Emotion negyddiol gan ddatblygu gymdeithas â chymru eraill
    info: "Mae cywaraeth yn emotion sy'n dod i'r ymyl pan fyddwn ni'n gweld bod rhywbawd arall wedi cael dim rydyn ni eisiau ei gael\nGan gywirio at heintiau mae hynny'n wahanol rhag gehefnogydd; maen cywarithau am bryderion allanol tra'ch yw gehefnoedd yn eu huned \nwedi'u brodig neu ddifrod"
  emotion.joyful:
    label: gweled
    summary: Heintynt ddyweddu'r diodheddiwr mewn tynnu
    info: Gwelad yw heintynt grefydd positif sy'n cymeradwy dan fydhau yn gyson rhagor o ddioddefiant. Mae wedi'i geisio at gymorth i bryderon cymdeithasol ac amheuaeth ar wahân i'ch hunfedd chi eich hun.
  emotion.lonely:
    label: uned
    summary: Cytundeb anafodd nad eich bod chi hefyd yn mynych.
    info: |-
      Uneddiad yw cymaint o ddod yn goll ar gyfer rhif gwirioneddol o boblog yr wyf i'nh glywed amdanyn nhw'n dod yn eu cyngres
      Ydy hynny mewn bygythiad drom wrth fynd trwy'r problemau gesygddydau;
      methiant unedig sydd wedi'u cael ei nodi fel synnwyr at lifo,
      a phroblemau pen drud agored gan waelhad social.
  emotion.loving:
    label: Carad
    summary: Gallai bod yn gryf amser ar wahân i ddigwydd
    info: "Mae Carad yn emotion cyfansawd sy'n cynnwys ysgafellter, gofal, hyder ac integritau\n Mae'r neurocymydeiriaeth ei gydnwys â'ch ôtocioen, dopamine ganwyddo a serotonine \n Yn rhannol Helen Fischer mabwedd tri system : hoffiant rhywirol , cariad romanti oesoedd a phynodion profaith"
  emotion.melancholy:
    label: melinchwrli
    summary: Tywydd tân ag elfenau o gogwyddrio a pherthnas
    info: "Melinchrwlyd ydy fydiant penfys sy'n cyfuno tywydd, gogwyddio ac unrhywbeth ddermfol\nGyniged yn yr oesoedd hynny gan geir Gymreeg ar gyfer 'myln' neu mynd rhew hefyd;\nlifogydd hedfan nhaw'r hen meddygion am gymaint nad angen ei ddod â llafn danwyn \nwedi'i dorri mae e nodweddiadau aesthetigol iawn - feithriniaid, cerddoriaeth a llesrychiad yn eu cymharu"
  emotion.miserable:
    label: Bodoliad
    summary: Nevyliadaeth ac ymylau cyson - cymes i'r gradd nwyraffach o ddysgu.
    info: Gallai bodoliad yn wyneb gwirioneddol gael ei achosi gan fygythiad rhag abseddi neu anafu emosynadol na thryloyddiant.
  emotion.nervous:
    label: gymerthnad
    summary: Cynhariaeth cyn geiniath ryngweledig
    info: |-
      Gymmysiad yw gyflwr o ddifrod rhag absoliwitau sydd yn gysyllt â chynghariad ar gyfer digwyd hadwaith pwriadol
      Yn gymoleg mae'n dod ag actifedd eang gan fy mindor feddal: ceryddiant corffiol fel craigluniau ac adfed
      Pryder llai all fuddsoddi hyntred chi ond pryder rhy hael gall ei droio i'r cydran
  emotion.nostalgic:
    label: nodosto
    summary: Prynhawl gy da phodlon danwyn ar ôl dyfyr
    info: |-
      Mae nôs-talgia yn emotion sydd â gwaith swyt ganwyll dda ac anhygredig; yw'r bygythiad am wynebu'n ddiddorol ond hefyd yn siogel iawn
      Gynhenir yr enw o Gymraeg nodosto ('talu') a thalgo ('siop'),
      wedi'u cymeri rhag grêmaethau Elen nhrechu ei wlad neu fathoedd.
  emotion.optimistic:
    label: optimsme
    summary: Gweithredu gyda'r creuddyn bod pethau'n dod i'ch cydnabod.
    info: Mae optymisme yn arferiad cognitiweddiadol sy'n cynnwys y gweddillion rhag absoliwitau positif. Mae Martin Seligmann wedi adrodd am ei hanfod mewn bygythio pen drwy ddarganfyddiaeth fod grefyddwyr yn fynd dros dro, yn fydrolach ac yn llai anafu na pherthnasau eraill.
  emotion.overwhelmed:
    label: Ymylo
    summary: Gall pob sylfaen fod yn wael os nad ydyn nhw'n cael eu rheoli.
    info: Mae'r ymyl yn digwydd pan fydd anogaethau drosedd rhag gyllid ein harferion ar gyrraedd. Mae'n dod dan yr un o ffyrdd - amheuaeth cogsigrifol neu ddigymdeithydd emosynadol. Gallai bod yn barod i'w heintio ond gall pobl pen drud creu problemau.
  emotion.peaceful:
    label: Heiniad
    summary: Gallai fod fel damywel ddyfn nhaw wneuthur.
    info: 'Mae hein yn gyflwr emosynol positif absenoli streseg ac arferiant. Mae''n nod y manylion - ganwyddo''r mynych chiwel i''w chweilfio neu gilymaeth Zen. Yn weithredu''r system syrthetig neryddus: yn gostrofo cyflyd rhewilog a phrosforiad sylfaenydd. Mewn eko-syghebodaeth mae bod am yr uned yn un o fforddoniau efyddiolaf i redeg einheid.'
  emotion.pessimistic:
    label: psywm
    summary: Tendency to expect bad outcomes
    info: |-
      Pesywmos ydy yn arferiad cogsedydd-gymeradwy sy'n nodweddiadol i weithredu gwaethaf nhag resymau anghywir
      Gallai psywm wag fod yn adatigrwyddol gan eich bod chi'n meddwl am fythrin rhyni er mwyr bygythio'r peryg
      Cysylltir Psywm gyson â risgoedd uchel dros drosoed ac effaith nesygryfwr wedi'u cyflwyno
  emotion.playful:
    label: Gweledigaeth
    summary: Nimeddan llesusac a chydnabyddiaeth â pherythnas.
    info: 'Mae gweledigaeth yn gyflwr emosynol sydd wedi''i nodweddi gan ddiddordeb i geirfa, ymylyniad ac arwain rhag absoliwitau. Mae''n cynghorydd positif o fympwyriaeth a hygred meddyliannol da am gymdeithiaid ifancen nhw. Cymhelliant penodol evoleedyddig: datblygu sgiliau mewn cyfamser diogel.'
  emotion.proud:
    label: anfer
    summary: Emocyn positif gan wneud cymuned eich hunoedd.
    info: |-
      Rhagwedd yw'r emocyn sydd wedi'i gysylltu â phryder neu gydnbyniad i beth byth rywbawr yn ei chaswi'n werth.
      Posurog rhew o dan yr ochlyn ac arafiant y mynyddau mae'n eu profi nhw fel synffrodion cysonol am ddod ag anferith.
      Gall fod yn bos na fyddai'n cynghori at feithrin ona'ch bod chi'n dod yn fwy hyggeredig.
  emotion.relieved:
    label: heimatawch
    summary: Emocio diogel naill ag unrhywbryd wedyn nad mae'n bodoli
    info: |-
      Mae heimatawch yn emotion sydd ei ystyried ar ôl i resedigrwydd neu anafriad ddod o hyd
      Gwnth yr un fath â gwaethredu'r mynyddoedd ac adfer rhagofio cyffredinol
  emotion.sad:
    label: smyte
    summary: Gall fod yn grymu oherwydd dargyliad cyffredinol.
    info: Mae smwthech yn emotion naturiol fel ymateb i golwg neu ddifrodiant. Mae'n dod dan fygythiad â llanforion, llinell rhagor ar ochrau'r geiriau ac amser anaml.
  emotion.scared:
    label: croesedig
    summary: Gweithredu tristiau neu hyrgorion oddi wrth peryntbiaeth.
    info: '{"hint":"gwneuthur y bygythiad neu gogwyddiant","info":"Mae groesi yn emotion cynyddol am ddisgariad rhag anafriadaeth. Mae''n arwain at ddifrod adrenaline gan yr unigraff, mae''r serdiynau yn fyr ac mae''r corpw ellyll yn barod i fynd dan agored oeddai hefyd yn cael ei alforio.","label":"groesedig","summary":"Gweithredu tristiau neu hyrgorion oddi wrth beryntbiaeth."}'
  emotion.serious:
    label: gwirfodd
    summary: Setiad serith heb egni tylltaro; cymeradwyaeth ar resymau pwysig
    info: |-
      Gwirfodd ydy atgyffrededd emosynol sydd yn nodweddiadol o ddifrodiant ac anweledigheit
      Ynddo'n bwysic ar gyfer sefydio rhaglennau sydd eu hangen i'ch adrodd am danwyd a pherthnasio grefydd
      Efallai ei bod wedi'i chymryd gwahanol gan fyrdodoli'r byd; mewn sawl celfydiaeth maes gwirfodd yn cael ei hymeno, ond yn eraill cynghori â heint
  emotion.shocked:
    label: shock
    summary: Shock ydy un nodiant cymharu dan yr enw 'sudden information'
    info: "Mae shock yn emotion intensifig sydd wedi'i wneud gan gynnwys ffaith anghydnol neu ddyn hoffeb ond nad ydyn nhw'n rhaglennu ei bod yn gyson ar eu sylfaen\nGwnaeth chi fynd i'r cyffredin am gymaint ag eich bygythiad ni chwith ac rybuddiau diwyll ddim yn dod â'ch cwbl \nCyllid pen dringo atal unrhywbeth newydd na allai fod yn bosibl"
  emotion.shy:
    label: ysgariad
    summary: Trethnas ganrifion neu gymaintiaeth yn gofalu am egni
    info: |-
      Yw ysgariad yn emotion penodol sy'n dod â threthnas ac anghofio pan rydych chi'n gartref i bobl arall.
      Mae wedi'i heffeithrio gyda phersonoli ddwyforfol ond ni chynig eu cydraniant
      Gyd-eich bod hi'n rhewch ddimau o'r un rym mewn bygythiad - er hyd at yr hafaliadau diweddar.
  emotion.surprised:
    label: gwsg
    summary: Gweledigaeth i geidw aderyn neu digwyll nodweddiadol.
    info: Mae gwsg yn ddiddoriant hirion angen rhag absoliwitau dros y byd am ryw eiliad ar unwaith. Mae'n cynnwys llygogydd agored, llifogydd gollyngedig ac allforion wedi'u heinio.
  emotion.tired:
    label: unanwedig
    summary: Gall fod yn ddifrod rhagodol neu'r gofalus dros dro.
    info: Mae unwaith yn siyniad y body ei angen am wasgfa. Mae'n dod â gos i'ch meddwl ac eich cymaint o fyw hedfan.
  emotion.upset:
    label: anhefoed
    summary: Glywed am hefeddi ar ôl hadleth nadal
    info: |-
      Mae anhefoedd yn gyflwr rhaglennfol cynefiniol ddifrifoli sy'n ychydig o lygredigrwydd, gwaethes ac angrywiaeth
      Ydy wedyn i digwyllau annhoradwy, dilynwyr neu dystaith
      dim onid fe fyddai'r system stress HPA yn cael ei weithredu fysiolegaidd gan geisio cortisol
  emotion.worried:
    label: stros
    summary: Gweinhadu cyson rhag problemau bosibl
    info: |-
      Wedi yw stros yn gyflwr emosynol sydd wedi'i nodweddiad ar grymu am groesi posiblau'r dyfrod
       Mae stres anaml yn adatrig ac yn cynghori i baratoi
      digwyddiant stros cronachnad (problem rhag absedd) dilynwch chi'n cael ei ddifrod gan weithgariaeth pob-dydd
