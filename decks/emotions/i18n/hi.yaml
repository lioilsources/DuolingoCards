lang: hi
pivot: false
title: भावनाen
cards:
  emotion.angry:
    label: नाराज
    summary: जब कोई शक्तिशाली असंतोष या क्रोध महसूर करे और नाराज हो जाए।
    info: क्रोध एक भावना है जो प्रतीत होने वाले अनुचितपने या संघर्ष के खतरे के प्रति प्रतिक्रिया होती है। इससे दिल की धड़कन बढ़ जाती है और आपके शरीर को 'लड़ें या भाग जाएं' की प्रतिक्रिया के लिए तैयार कर देता है।
  emotion.calm:
    label: शांत
    summary: आंतरिक शांति और सुख महसूस करना, चुपचाप होना।
    info: शांति मानसिक और शारीरिक संतुलन की अवस्था है। यह दिल के धड़कन को धीमा कर देता है, सांस गहरी हो जाती है और स्पष्ट सोच एवं अच्छे फैसले करने की अनुमति देता है।
  emotion.excited:
    label: उत्साही
    summary: मजबूत उत्साह और प्रसन्नता के साथ अपेक्षा महसूस करना।
    info: उत्साह एक तीव्र रूप से सकारात्मक भाव होता है जो किसी प्रिय घटना की उम्मीद से जुड़ा होता है। इससे ऊर्जा बढ़ती है, दिल की धड़कन तेज हो जाती है और श्रेणीबद्ध सोच को बढ़ावा मिलता है।
  emotion.happy:
    label: खुश
    summary: खुशी या मज़ा का अनुभव करना, ठीठे होना।
    info: खुशी डोपामिन और सेरोटोनिन के मुक्ति के साथ एक प्रसन्नता की भावना है। इसके लक्छन मुस्कान, जीवंत आहेंग और खुले शरीर की रचना में दिखाई देते हैं।
  emotion.sad:
    label: दुखी
    summary: असंतोष या मन के भारी होने की अवस्था महसूर करना।
    info: उदासी एक प्राकृतिक भावना है जो किसी नुकसान या निराशा के समय देखी जाती है। इसके लक्छन आँसू, मुंह के कोनों का ऊपर की ओर झुकना और बौखलाहट होती है।
  emotion.scared:
    label: डरा हुआ
    summary: खतरे या संकट के कारण डर या भय महसूस करना।
    info: भय एक प्राथमिक बचाव भावना होती है। इससे अद्वेष छोड़ा जाता है, दिल की धड़कन तेज हो जाती है और शरीर भागने या सुरक्षा के लिए तैयार हो जाता है।
  emotion.surprised:
    label: चकित
    summary: अप्रत्याशित घटना के संबंध में अचानक हर्ष की भावना।
    info: चकित होना एक बहुत कम लंबे समय तक रहने वाली भावना है जो केवल कुछ सेकंड चलती है। इसके प्रभाव के रूप में मुंह खुला रहता है, आँखें ऊपर की ओर उठ जाती हैं और पुतलियां फैल जाती हैं।
  emotion.tired:
    label: थका हुआ
    summary: शारीरिक या मानसिक थकावट का अनुभव करते हैं, आराम की जरूरत होती है।
    info: थकावट शरीर का संकेत होता है कि उसे आराम की आवश्यकता है। इसके प्रमुख लक्षण देरी से प्रतिक्रिया, ध्यान की कमजोरी और ऊब गए हुए महसूस होना होता है।
