lang: hi
pivot: false
title: भावनाen
cards:
  emotion.amazed:
    label: उथापन
    summary: आश्चर्य और झलक के साथ खास ढंग से कुछ ऐसे के साथ मिलने पर ऊबड़ फीलिङ जो ऑफर होती है।
    info: |-
      अवेष्टा एक मजबूत भावना हो सकती है जिसे कुछ प्रचंड या धमखेर चीज़ के साथ महसूस किया गया।
      इसके कारण आपकी अपनी महत्ता कम हो जाने लगती है और ओकरले दुनिया के साथ बढ़िए शिक्म घटभई हो जाता है。
      शोध इस बात की पुष्ठदाही करते हैं कि उठापन डर छोटा करता है और सामाजिक व्यवहार बढऩे में मदद करता है।
  emotion.amused:
    label: मजा
    summary: आनंद और छटपटाहट का गौरव
    info: |-
      मजा एक मामूली सुखद भावना होती है जिसे कुछ प्रसंगबध्द या रोचक चीज़ें उतपन्न करती है।
      यह हंसी से अलग होता है - हंसी मजा का परिणाम होता है, लेकिन हर मजा हंसी का कारण बनता नहीं है。
      एक साझा आवश्यक भावना है—अक्सर हमें तभी खुशी मिलती है जब हम इसे दूसरों के साथ साझा करते हैं।
  emotion.angry:
    label: नाराज
    summary: जब कोई शक्तिशाली असंतोष या क्रोध महसूर करे और नाराज हो जाए।
    info: क्रोध एक भावना है जो प्रतीत होने वाले अनुचितपने या संघर्ष के खतरे के प्रति प्रतिक्रिया होती है। इससे दिल की धड़कन बढ़ जाती है और आपके शरीर को 'लड़ें या भाग जाएं' की प्रतिक्रिया के लिए तैयार कर देता है।
  emotion.annoyed:
    label: उथला ठीठ
    summary: ऊब या असफलता के कारण दोहराहुआ उद्वेग जिससे एक छोटा झझखा होता है।
    info: |-
      चिड़चिड़ापन एक मामूली सेरेब्रल प्रतिक्रिया होती है जब कुछ ऐसा दोहराता है और आवश्यकता से अधिक उद्वेगजनक हो।
      यह घमंड भावना के लगभग रूढ़ियों के निशान के खास ढंग से ध्यान चुराओए छोटे झझखे के फलस्वरूप हो सकता है。
      अक्षमता के कई कारण हो सकते हैं - ऊब जाना, थकाप या इष्टतम नींद का अभाव।
  emotion.anxious:
    label: उत्सुकता
    summary: आई ऐसे झुकाव ऑर चिंता के अनुभव जो अनिश्चित भविष्य के कारण होता है।
    info: |-
      चिंता एक संवेदना है कि प्रभावी मुद्धरणे कोड़ालय।
      फजगटमेन्टस्‍पर भी यह शारीरिक तौर पर प्रकट होती है : बढ़े हुए जबड़े के साथ, पसीना, साँस लेने में कठिनाइयाँ, और छापे हुए पेशी。
      अधिकतर चिड़चिड़ापन अथवा उत्सुकता आम घटना है;
      इसके खुशखबरी फल गतिमान ऊर्जा ओर ठीक करने के काम आ सकते हैं।
  emotion.bored:
    label: बोर
    summary: उदासी आई भावना लगाहट देकर उठापने के छल के बिना
    info: |-
      नूडा एक ऋणात्मक संवेगीय क्रम होता है। इसे परिस्थिति महसूस करने या अर्थपूर्ण गतिविधि के अभाव में होता है।
      इसके कारण नएअनुभवों की खोज करने और बचाऊ चिंतन करने की ओर जाता है।
  emotion.calm:
    label: शांत
    summary: आंतरिक शांति और सुख महसूस करना, चुपचाप होना।
    info: शांति मानसिक और शारीरिक संतुलन की अवस्था है। यह दिल के धड़कन को धीमा कर देता है, सांस गहरी हो जाती है और स्पष्ट सोच एवं अच्छे फैसले करने की अनुमति देता है।
  emotion.cheerful:
    label: राडसटने्स्ट
    summary: एक प्रति-उपलब्ध अहंग और आशा
    info: खुशी एक स्थायी मनोवैज्ञानिक केंद्र है।
  emotion.confident:
    label: आत्मविश्वास
    summary: अपनी क्षमता ओर मौल्य पर जोर
    info: "आत्मविश्वास अपनी क्षमता और सुदृढ़ मसखेद पोजशन पे हकलहट कि भावना ह।\nऊंची पोजशन ,अग्रभाग आईयन एवं धीमी बोलना इसके लक्छण ह। \nएमी कडी(TED TALKS 2012 )इसे फैलाने में महत्त्पूर्ण योगदार डाली।"
  emotion.confused:
    label: उबड़ - хат
    summary: अधिकाँश इफोर्ड शिफ्ट ऑथोरिपेटिव ऐक्शन
    info: |-
      हमें भ्रम में पड़ने की स्थिति होती है जब हमारा संदरभ या एक स्थिति को समझने के लिए आवश्यक ज्ञान अपुष्ट हो।
      यह सीखने का एक प्राकृतिक घटक है;ज्ञानात्मक विसंगति उत्तर की खोज को बढाएगी。
      इसके चेहरे पर झुकाओ और गले के ऊपर के छोरों को सचेष्ठ करने के द्वारा प्रकट होता है।
  emotion.content:
    label: संतुष्टि
    summary: '''आई'', ''''ओ'''' और ''''उ'''' के लघु उच्चारण'
    info: "संतुष्टि एक समान प्रभावी केंद्रित मनोवृत्ति है।\niयह ख़ुशी से अलग है;\nsंतुष्टि शामथा है,\njबरख़्ज़िएड हाइपरटिक है। \nbौध धर्म\nअच्छी बात यह है कि 'संतोष' ('संतोष') ज्ञान के मार्ग पर आवश्यक चरण है।"
  emotion.curious:
    label: जिज्ञासा
    summary: ' चाहे ऐश्छिक ज्ञान और समझ के लिए'
    info: |-
      जिज्ञासा नए सूचनाओं औरअनुभवों की पहलके मध्यस्थ है।
      यह डेपामिलरम्‍बर इनामप्रणालि से एकत्रित है ; वाकई अद्भुत आनंद देखा गया है。
      इसके बग़ौर शैक्षिणिर उन्नति और व्यक्तिगत विकास कठिन है।
  emotion.delighted:
    label: ओत्साही खुशी
    summary: अच्छा घटना या आश्चर्यजनक वेळी उभयता एकमेकाता अधिक शक्ति
    info: |-
      उत्साही खुशी प्रसन्नकर किंवा संचलन होऊ लागणे मैदगढ़ घटना या आश्चर्यजनक वेळी उभयता एकमेकाता अधिक शक्ति।
      इहामध्ये बुडबुडीपणे राजखुशी इष्ट फलापर्यंत दृष्ठि भाषा धोरणाऐवजी छलछल करणे,
      आनंद डाढऽ झाणे थाऊक ओठ ऑफर करणे और हसणे ऍक्ऱ्‌एक ऋणात्मक रूप िथई।
  emotion.determined:
    label: ओधोद्लानी
    summary: अवश्य बाघों के भीषण रूप में आगे जाकर तय खुद के लक्छ्य को प्राप्त करने की ठठडऩी
    info: ओधोद्लानी एक प्रेरणा संबुद्ध हिम्मत की मनसूखि है। इसमें उच्च विशेषज्ञता और अटलपन के साथ गहरी फ़ोकस होती है।
  emotion.disappointed:
    label: वैफल्य
    summary: इष्टता न होने पर जो असहज भाव उत्पन्न होता
    info: "जब परिणाम आपकी समझे हुई कोशिशें या मनगढ़ंति अवधारणाओं से मेल नहींखाता, उस स्थिति में वैफल्य का भाव जाग्रत होता।\nयदि इच्छाएं बड़ी होंगी और ऊर्जा खर्च करना घटेगा ,उस स्थिति में ऐसा दुःख झेलना धीमा हो जाएगा। \nअभ्यास दर्शाते हैं कि फल ठीठे हुए डाटा के ढाँचे के अनुसार ;आओछापन बेहद महत्वपूर्ण है।"
  emotion.disgusted:
    label: अफबा
    summary: एक ऐसा मजबूत झटका जो घृणा उत्पन्न करे
    info: |-
      ज्वलन एक मूलभूत भाव हो सकड़े की प्रगति करेगा।
      इसमें आपको अविशुद्ध खाद्य और बीमारिओं से लडऩे के तरीके नहीं मिलते।
  emotion.embarrassed:
    label: झाँहबेनी
    summary: सामाजिक स्थिति में ऐसा ठीठी ढंढोर डर
    info: "जहांबेनी एक सोशल मन का हवस है जिसमे हम पर्यटकों के अपराध के बारे में विश्वास करते हुए।\nयह लालचड़ियों(खुद) ,आई देखने और झुके हुए तथा आग्रह के भाषण के उभरता है। \nइसका सामाजिक कार्य है :अन्य इंसानों को चिह्नित करे कि हमारे ऊपर गठन के ओछा छाप है और फिट होने की घोषणा करे।"
  emotion.excited:
    label: उत्साही
    summary: मजबूत उत्साह और प्रसन्नता के साथ अपेक्षा महसूस करना।
    info: उत्साह एक तीव्र रूप से सकारात्मक भाव होता है जो किसी प्रिय घटना की उम्मीद से जुड़ा होता है। इससे ऊर्जा बढ़ती है, दिल की धड़कन तेज हो जाती है और श्रेणीबद्ध सोच को बढ़ावा मिलता है।
  emotion.frustrated:
    label: फ्रस्टरेशन
    summary: लक्ष्य प्राप्ति में बाधा आने पर एक असंतोष की भावना
    info: "फ्रस्टरेशन एक भाव है जो पड़ता है जब किसी समस्या मे हमारे लक्ष्य बाधित हो जाते ह।\nयह निमंथि कारणवश अभिकरण (एलटरनेंट की खोज ) और उपचुद्रधिपक(अग्रेचन)\nआइईओ फ्रस्टरेशन - थ्िरी ( द्विःख्‍य आउटकम ग्राह्मी इन डीपीएम ऑफ ओरिऐंटेशन घटना ) \nऊष्णक छाँछ : झुठे , ऊष्णक ठंढे ढंग ऋणात्मक"
  emotion.grateful:
    label: उठापट्टी
    summary: अच्छाई के लेणे या प्राप्त करने के लेणे ऐसा अनुभव जो ऑफर करता है
    info: |-
      आभार एक स्थिति महसूर होती हैं जब हमें प्रेरणा के सामने हमारे लयवल में अच्छाइयों के बारे में ध्यान आता है।
      धनुपदशा विशेषज्ञता के खोजख़्तई दिखाओए कि उठापट्टी भागों के चिह्न घड़ी और फिक्रगाड़ी के झुकाऊ ठीथी ढढऩे के लेस।
  emotion.guilty:
    label: अपराधबोध
    summary: स्वयं के नृत्यशाला के उल्लघन के बाद एक अवचेतन आहति
    info: क्षमा करने और सुधार में प्रोत्साहित होने की सामाजिक भूमिका होती है।
  emotion.happy:
    label: खुश
    summary: खुशी या मज़ा का अनुभव करना, ठीठे होना।
    info: खुशी डोपामिन और सेरोटोनिन के मुक्ति के साथ एक प्रसन्नता की भावना है। इसके लक्छन मुस्कान, जीवंत आहेंग और खुले शरीर की रचना में दिखाई देते हैं।
  emotion.hopeful:
    label: उम्मीद
    summary: भविष्य के बारे में सकारात्मक महसूर
    info: "उम्मीद एक महसूर होता हैं जिसमें सुधार के भविष्य प्रति लगन और उसकी प्राप्ति पर विश्वास दोनों आए।\nयह कठिन परिस्थितिओं में टिकाऊपन का चाबक होता हैं। \nअध्ययन इंगित करते हैं कि अधिक उम्मीद वाले मरीज़ ठीक होने में धीरे - धीरे खड़े हो गए।"
  emotion.hopeless:
    label: उम्मीद छूट जाना
    summary: '''फुटर डोऊन फौर्थ कुछ अच्छा नहीं लाएगा'', ऐसा महसूस करना।'
    info: "बेझनादे एक निर्मल संवैगीय क्रम होता है जहां मुख्य परिणाम विश्लेषण कि स्थिति बदल भी नहीं सकती।\nइसे अपचाक़्षुकता और आत्मघाटी खतरे के चिह्न के रूप में उभरता देखा गया है। \nएड्रिऑन बेस्क के ध्यानशील इलाज के मॉडल में 'अज्ञाप' कई महत्वपूर्ण घटनाओं में से एक ठहराया गया है।"
  emotion.inspired:
    label: ईजाद
    summary: उत्कृष्ठ कलात्मक उमंग झुकाव ढंग
    info: "इंस्पिरेशन एक सामग्री महसूर होता है जब कलात्मक प्रेरणा और उमंग अचानक आपके भीतर बढ़िया।\nएक विचित्र काम या इंसान के साथ घटिटा लगभग ऐसा हुआ करता है। \nअध्ययन दशा में ध्यानदायक गतिविधि ओर ऑडवर्ड फ्रंटल कौर्स के खुलने के कारण ऊष्णता छोड़ता है।"
  emotion.irritated:
    label: जल्दबखरे प्रकोष्ठ
    summary: छोटी चीजों पर अधिक प्रभावशाली प्रतिक्रिया
    info: चिड़चिड़ापन एक संवेदी मानसिक क्षमता है।
  emotion.jealous:
    label: जाल
    summary: अन्य लोगों के साथ तुलना करने से उत्पन्न ऋणात्मक भावना
    info: |-
      जाल हम तब महसूर करते हैं जब हमें प्रतीयोगियों से कुछ चीज़ ऐसा भीषण दिखने वाला हो।
      इसके अलग रखवट उपद्मि के बाहर नए गठबंधनों के झौंड़े के आशंका से होता है; एक ओर इसका सभी फायदे के ऊपर ध्यान होता है, और दूसरी ओर घटिटा शुरूआत के डर से होता है。
      यह ठीक कार्य करने के छल के रूप में काम कर सकता है या नफरत का कारण बन सकता है।
  emotion.joyful:
    label: खुशी
    summary: एक ऊर्जा छोड़े ऐसा खुशी और ओछरपन; डाढ़गई ऋणात्मक भावना
    info: "खुशी एक मजबूत स्वसंग्रहित प्रेरणा को हवाबाज़ियाँ देने और 'फ्लो' की अवधि (चिकझेंटमिहली) के साथ घनिष्ठ रूप से आबद्ध भावना है।\nevolutionary function : इसका उद्देश्य सामाजिक बंधनों और फायदेमंद व्यवहार के खास चढ़ाऊ को मजबूत करना है। \nइस भावना को सभी साझा गठबंधनों में महत्व दिया जाता है ; positive psychology में well being के key indicator के रूप में इसका महत्व है।"
  emotion.lonely:
    label: अकेलापन
    summary: आइडिऑल अथवा ऊफः अधिक लोगों के साँथ अभाव के कारण दुखी महसूस करना
    info: "अकेलापन आसपास के व्यक्तिओं की सख़्ति पर निर्भर हुए बगैरा महसूस कई अलगाहट का एक ग्रामजनवादी धोखा है।\nयह स्वास्थ्छिक समस्याओं का शक्तिषण पौष्टक है; चरम अकेलापन जीवन को कम कर डाउटा है। \nदिमाघ फिझिकल और साइबिक ऐच्ञ के खिलाफ ठीठ ढंग से अभिक्रिया करता है।"
  emotion.loving:
    label: प्रेम
    summary: दृष्टि व्यक्ति के प्रति गहिरा भावनात्मक आकर्षण
    info: "प्रेम एक संयुक्त महसूर होती है जिसमे प्रवल कारण, देखभाल, विश्वास और गोचरता आदि भावनाओं का समाहार होता।\nइसके साथ ऑक्टोटोशिन, डोपामाइन अउ सेरोटोनिक चियँ बड़ी उबड़खाबड़ घटित होई। \nएचेलन फिशर ऊ छथी ऐगोज : सेण्ढिप्रेरणा ,अफेष्ठन झी प्रेम अऊ धीठ बधन छी।"
  emotion.melancholy:
    label: मेलाँखोलिया
    summary: '''उदासी'', ''भावना'' और ''सौंदर्य'' के ठीथी'
    info: "मेलांकोलिया एक पीछे करने वाली महसूर हैंजिसमें उदासीयता स्थिति औरएक निश्चिर खुशी के अवधारणा भी आई।\nइसकी जड़ ग्रीक बोलचाल के 'ब्लैक' इष्टपट द्वारा छोआ गया ; \nअगर डिप्रेषन से फर्क करे , तो ऐसा ध्मनी के घटना के ओर झुकाव भी होता है।"
  emotion.miserable:
    label: दुःख
    summary: अति गंभीर धीमी छाप
    info: |-
      दुख एक मजबूत सामंजस्यहीन प्रभाव होता है।
      यह किसी शरीर के दर्द, भावनात्मक चोट अथवा नुकसान के कारण हो सकता है。
      लम्बे समय तक जारी इस उपचार केलए साझेदारी और आधिकारिक सहायता आवश्यक है
  emotion.nervous:
    label: घबराहट
    summary: एक आगामी घटना से पहले थोड़ी चिंता
    info: |-
      नर्वोजिटा एक मामूली प्रतीक्षा के समय हुआ हुवा संबद्धि होता है।
      इसके शारीरिक लक्छण हेतु सहभागियों के न्यौछाँचपन के कारण होते हैं : दिल के झटके, पसीना。
      थोड़ी बढ़ी घबराहट प्रदरशन को ठीक करती है ; जबकि अधिक उठापटक हमारे प्रदरशन को खराब करती है।
  emotion.nostalgic:
    label: निस्तालजी
    summary: एक मधुरा खचखचा फीलिंग ओट डबल्ट
    info: निस्तालजी एक मधुरा प्रति कोशिश है। संस्कृति और अलगपने के बारे में यह भावना आमतौर पर गंदगीयों, धवनिमय नृत्य या इतिहास से जुड़े स्थानों द्वारा उभरती है।
  emotion.optimistic:
    label: आशा
    summary: भविष्य के ऊपर ध्वनि और चीजों की देखा
    info: अनुमान एक संज्ञात्मक प्रतिक्रिया है। मेटरन सीलगमॉन के अध्ययनों कहते हैं कि आशा लचीलापन का बड़ा कारण है।
  emotion.overwhelmed:
    label: ओझल
    summary: इस ऐसा भाव होता है जब हमारे ऊपर बहुत कुछ एक साथ हो जाता है।
    info: |-
      जब आपके पर मांगें हमारी संभाल क्षमता से अधिक होने लगती हैं, तो यह बुद्धि के विफलता (स्पष्ट नहीं) के भाव, एक ज़्यादा उच्च ऊर्मिसे और ठठडऩे के घटित हो।
      एक छोटी मात्रा में इसके खुशखबरी हो सकती है;
      अव्यवस्थित शुरुआत डिग्हई के ओर झुकाता है।
  emotion.peaceful:
    label: शान्ति
    summary: आभ्यंतर अहम् के सामञ्जस्वपूर्ण भागवट
    info: शांति एक स्थिर परीस्थिति है। मन के शुद्ध होना और चंचलता से मुक्ति प्राप्त करना
  emotion.pessimistic:
    label: निराशा
    summary: खराब परिणामों के उम्मीद करे और ऋणात्मक बातों पर ध्यान केंद्रित करे के रुझान
    info: |-
      निराशा एक संज्ञानात्मक-भावी प्रवृति होती है जो कमलेरहित परिणामों की उम्मीद में।
      एड़पटिसयुक्त भगवच्‍छब्द अधिक खतरे से बचाये ले आशंका के ठीक मौल्याङ्गन कर सकता हई。
      अस्थापिष्ट चिह्छा डिफ्रेसिओन के ऊंचे झोखिम और इलाज के घण्टा खराब परिणामों से जुड़े हई।
      CBT ऐसे धाँधली ढंग के बदले में मदद कर सकता हई।
  emotion.playful:
    label: हरावट
    summary: आओछा झुकाऊ और मजा लेङ्गे ढंग
    info: "हरावट एक संवेगीय हालत के प्रमुख चिह्नों में खेलना, मज़ाक और प्रयोगशाळा के आनंद के रूप में।\nबड़ों में यह कल्पनाशक्ति और अच्छी मस्टल बर्दास्करण के धन्माणकर्ता के भौतिक उभरा हए। \nउत्थाई फंक्षन :अधिज्ञाओं के डरफँई घटना में इसके विकास।"
  emotion.proud:
    label: अहंग्रह
    summary: '''आऊटफिट'', ''बच्चे के शरीर पर ड्रेप'', ''एक छोटे घर के फर्नीशर'' - इन सभी के उदाहरण'
    info: |-
      अहंग्रह एक सामूहिक मोज़े हुई कमीयता या पर्सनल लेबल है।
      इसके द्वारा आप अपने खुद के 'खड़े' नागरिक जीवन को चिह्ति करते हैं।
  emotion.relieved:
    label: उत्पाद
    summary: जब तनाव या खतरा खतम हो जाता है तो ऐसा अच्छा भावना महशूर होता है
    info: अनुकूलता तब महसूर की जाती हैंजब स्ट्रेस़्योग या पीड़ा खतम हो चुके।इसके लक्छन गहिरी साँस औरपेशीओं के ढीले हो जाने एवंभावना कि आप अच्छा महशूर कर रहे हैं।एटी बदलाओं के दृष्ठिकोण से भी इसका महत्व है कई क्षेम के उठ ऊपर झौंख डाले थे औरआप धीरे घुटने के लिहाफ तैयार हैं।
  emotion.sad:
    label: दुखी
    summary: असंतोष या मन के भारी होने की अवस्था महसूर करना।
    info: उदासी एक प्राकृतिक भावना है जो किसी नुकसान या निराशा के समय देखी जाती है। इसके लक्छन आँसू, मुंह के कोनों का ऊपर की ओर झुकना और बौखलाहट होती है।
  emotion.scared:
    label: डरा हुआ
    summary: खतरे या संकट के कारण डर या भय महसूस करना।
    info: भय एक प्राथमिक बचाव भावना होती है। इससे अद्वेष छोड़ा जाता है, दिल की धड़कन तेज हो जाती है और शरीर भागने या सुरक्षा के लिए तैयार हो जाता है।
  emotion.serious:
    label: गंभीरता
    summary: एक बिना मजाक के शांत अवधारणा ; गंभीर बातों पर ध्यान
    info: "गंभीरता एक सांवेगिक प्रस्थ के रूप में होती है जहाँ ध्यान केवल बुनियादी चीज़ों पर होता है।\nयह उन समयों में महत्त्वपूर्ण होती है जब लगातार और अच्‍छी शख्सियत आवश्यक होती है। \nअलग-अलग संस्कृति में इसका भिन्न ढंग से फौराहट होता है - कई संस्कॄतओं में ऐसा मामूली खिड़की घडऩा छद्म ओढ़ना है, जबकि दूसरों में ऊष्ठिष्टता के साथ झुठलापन जुड़ा होता है।"
  emotion.shocked:
    label: शॉक
    summary: अप्रत्याशित जानकारी या घटना के कारण ठीठी ऐसी थोथी
    info: |-
      चौंकना असामयिक हर्ष के समीपवर्ती प्रति में उबले हुए भावों के कारण होता है।
      इसके लक्छन एकदम से बंधगई गति,खुले मुँह और फैले हुए आंखों के होते हैं。
      अभियोजन कार्य : जटिल घटनाओं के द्वारा निश्चित ध्यान के झुकाऊ खड़ा करना।
  emotion.shy:
    label: शर्मिस्‍खलता
    summary: अधिकाँश घटनाओं में गृहिणि या चिढ़ उठे
    info: |-
      शर्म की एक सार्वजनिक महसूस होता हुआ प्रदर्शित होते हैं।
      यह आमतौर पर बचपन में दबले - पटवई और अभिभावकों के नए लोगों के साथ जुड़े होने के डर के कारण होता है।
  emotion.surprised:
    label: चकित
    summary: अप्रत्याशित घटना के संबंध में अचानक हर्ष की भावना।
    info: चकित होना एक बहुत कम लंबे समय तक रहने वाली भावना है जो केवल कुछ सेकंड चलती है। इसके प्रभाव के रूप में मुंह खुला रहता है, आँखें ऊपर की ओर उठ जाती हैं और पुतलियां फैल जाती हैं।
  emotion.tired:
    label: थका हुआ
    summary: शारीरिक या मानसिक थकावट का अनुभव करते हैं, आराम की जरूरत होती है।
    info: थकावट शरीर का संकेत होता है कि उसे आराम की आवश्यकता है। इसके प्रमुख लक्षण देरी से प्रतिक्रिया, ध्यान की कमजोरी और ऊब गए हुए महसूस होना होता है।
  emotion.upset:
    label: चिढ़ना
    summary: अशान्ति के कारण उबटन
    info: |-
      उदासी दुःख के संयोजन है।
      इसका प्रतिक्रिया में अपवाह और झगड़ा होता है।
  emotion.worried:
    label: चिंता
    summary: आगे के संभावित समस्याओं पर दोहरापूर्ण ऋणात्मक विचार
    info: "चिंता एक संज्ञानात्मक प्रभावी हालत है जो कि सम्भवनीय ख़तरे में आगे देखने पर केंद्रित होती है।\nहल्की चिंता अपशब्द है और यह बुख़्सड़ करने के इरादा को प्रेरित करती है。\nअटॉईएण्ट डिसऑर्डर (उध्गत रोग ) के साथ शाही चिंता दिनचर्या कार्य करने के क्षमता को घटा देती है। \nमेधिफुलनेस ओर झुकाऊ छोडऩे की ऐसी तकनीक बढ़िया है।"
