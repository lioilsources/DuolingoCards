lang: ru
pivot: false
title: Эмоции
cards:
  emotion.amazed:
    label: удивление
    summary: Сильная положительная реакция на необычайные вещи.
    info: Удивление вызывает сильное эмоциональное ощущение при встрече что-то грандиозного или потрясающего. Оно снижает чувство собственной важности и повышает чувства связи со средой вокруг себя.
  emotion.amused:
    label: побабоване
    summary: Легкое приятное ощущение развлечения
    info: |-
      Побавление - это легкая положительная эмоция вызвана чем то смешным или интересным
      Оно отличается от смеха; смеются из за побалования но не каждое заблуждение приводит к смеху
      Это социальное чувство мы находим вещи более веселыми когда делимся ими с другими
  emotion.angry:
    label: разгневанный
    summary: Ощущать сильное раздражение или гнев, быть злым.
    info: Гнев - это эмоция как реакция на воспринимаемую несправедливость или угрозу. Он повышает частоту сердечных сокращений и готовит тело к ответной реакции «бейся или беги».
  emotion.annoyed:
    label: ирридиентность
    summary: Слабое ощущение злости из-за повторяющегося раздражающего фактора
    info: |-
      Ирритация - это слабая негативная эмоция вызвана повторяющимся раздражающим стимулом
      Она часто предшествует более интенсивному гневу
      Может быть спровоцирована недостатком сна голода или перенапряжением
  emotion.anxious:
    label: страх
    summary: Неприятное ощущение нервозности и опасений относительно неопределенного будущего.
    info: Страх - это эмоция предвосхищающая угрозу; легкая тревога адаптивна и повышает производительность.
  emotion.bored:
    label: скука
    summary: Чувство безразличия и пустоты из-за нехватки возможностей для участия
    info: |-
      Скука - это негативное эмоциональное состояние вызвано отсутствием стимулов или осмысленной деятельности
      Она может привести к поиску новых впечатлений либо творческому мышлению,
      с точки зрения эволюции она побуждает искать возможности;
      Исследования показывают что хроническая скука повышает риск депрессии
  emotion.calm:
    label: спокойный
    summary: Ощущать внутренний мир и комфорт, быть в покое.
    info: Спокойствие – это состояние психической и физической балансировки. Оно замедляет сердцебиение, углубляет дыхание и позволяет мыслить ясно и принимать хорошие решения.
  emotion.cheerful:
    label: радостность
    summary: Приятное состояние веселого настроя и оптимизма.
    info: Радость - это положительное эмоциональное состояние с живым воодушевлением и хорошим настроем. Она связана со внешненаправленной личностью и высокой степенью позитивного аффекта.
  emotion.confident:
    label: самоуважение
    summary: Вера в свои силы и ценности.
    info: Самоуверенность - это эмоциональное состояние доверия к своим способностям и суждению.
  emotion.confused:
    label: смятённость
    summary: Ощущение неопределённости в ситуациях и информации.
    info: Смущение возникает тогда, когда нам не хватает контекста или знаний для понимания ситуации. Это естественная часть обучения; когнитивный диссонанс стимулирует поиск ответов.
  emotion.content:
    label: удоволтвие
    summary: Тише и мирнее чувство не требующее большего
    info: Спокойствие - это положительное эмоциональное состояние без необходимости изменений. Оно отличается от счастья тем что спокойствие тихое а счастье живое Бодхизм рассматривает удовлетворенность как ключевую добродетель на пути к просветлению Исследования в психологии благополучия показывают что удовольствии более устойчиво чем экстаз
  emotion.curious:
    label: любознательность
    summary: Желание узнать что-то новое.
    info: Через систему вознаграждения дофамина любопытство буквально приносит удовольствие и мотивирует на поиск новых знаний и опыта.
  emotion.delighted:
    label: радость
    summary: Сильное чувство удовольствия от хорошего события.
    info: Интенсивная положительная эмоция возникает в результате приятных событий или сюрпризов и выражается более активно по сравнению со стандартной радостью – прыжками, криком, смехом.
  emotion.determined:
    label: решение
    summary: Сильная решимость достичь цели несмотря ни на какие препятствия.
    info: Решимость - это мотивационное эмоциональное состояние с характерной сосредоточенностью и упорством. Она проявляется в зажатых челюстях, напряжённом теле и интенсивным взглядом. Решительность тесно связана со словом «пережиток» или термином «грипт», как его определила Анджела Даквортт – сочетание страсти и настойчивости.
  emotion.disappointed:
    label: разочарование
    summary: Неприятное чувство, которое появляется, если реальность не отвечает нашим ожиданиям.
    info: Разочарование возникает тогда, когда результат не соответствует ожиданиям или пожеланиям. Оно сильнее проявляется при высоком уровне эмоционального вовлечения и усилий. Исследования показывают важность ожиданий – чем они ниже, тем меньше вероятность разочарования.
  emotion.disgusted:
    label: отвращение
    summary: Сильное ощущение возмущения при встрече с раздражающим стимулом.
    info: Отвращение - это базовая эмоция защищающая нас от вредных вещей (токсичной пищей и болезнями). Эволюционная функция заключается в том чтобы избегать потребления испорченного продукта питания. Она проявляется морщинистым носом высовыванием языка и характерным выражением лица.
  emotion.embarrassed:
    label: стыд
    summary: Неприятное чувство стеснености во время общения
    info: |-
      Стыд - это социальная эмоция возникающая тогда когда мы думаем что нарушили общественные нормы
      Она проявляется покраснением от смущения и опусканием взгляда и позой тела
      Эта реакция выполняет важную функцию в общении она сигнализирует другим о нашем знании правил поведения и готовности их соблюдать
  emotion.excited:
    label: восторженный
    summary: Ощущать сильное возбуждение и радостное ожидание.
    info: Восторг — это интенсивная положительная эмоция, связанная с ожиданием приятного события. Он повышает энергию, ускоряет сердцебиение и способствует творческому мышлению.
  emotion.frustrated:
    label: фрустация
    summary: Ощущение раздражения из-за невозможности достичь поставленной цели.
    info: Фрустрация возникает тогда, когда наши цели блокируются препятствиями и могут привести к конструктивным действиям или агрессии.
  emotion.grateful:
    label: благодарность
    summary: Тёплое ощущение признания хорошего того чего у нас есть или получаем
    info: |-
      Благодарность – это позитивное чувство возникающее тогда когда мы осознаём добро в нашей жизни
      Исследования по положительной психологии показывают что регулярные проявления благодарности повышают удовлетворённость жизнью
      Оно активирует центры награды мозга подобным образом как физическое наслаждение
  emotion.guilty:
    label: вина
    summary: Негативное чувство по поводу своего недостойного или несправедливого деяния.
    info: Вина возникает после совершения действия, которое мы считаем плохим и вызывает неприятные эмоции при нарушении собственных моральных принципов.
  emotion.happy:
    label: счастливый
    summary: Чувствовать радость или удовольствие, быть в хорошем настроении.
    info: Счастье — это приятная эмоция, связанная с выбросом дофамина и серотонина. Оно проявляется улыбкой, живой мимикой и открытым телопостановлением.
  emotion.hopeful:
    label: надеюсь
    summary: Оптимистическое ощущение того что будущее будет хорошим.
    info: Надежда - это эмоция сочетание желания лучшего будущего и веры в его достижимость.
  emotion.hopeless:
    label: без надежды / беcнадёжно
    summary: Чувство того что будущее ничего хорошего нам не принесет
    info: |-
      Безнадеждность - это негативное эмоциональное состояние характеризующееся убежденностью в том что ситуация не может стать лучше
      Она является ключевым признаком депрессии и фактором риска суицидальных мыслей
      Модель когнитивной терапии Аарон Бека определил безнадежду как ядро проблемного восприятия
  emotion.inspired:
    label: вдохновение
    summary: Творческая активность под влиянием волны воодушевления.
    info: Вдохновение - это эмоциональное состояние с характерной внезапно возникающей мотивацией и творческим волнением. Оно обычно связано с озарением или встречей с выдающимся произведением искусства либо человеком.
  emotion.irritated:
    label: сильная раздражённость
    summary: Состояние высокой чувствительности к мелочам; граница ярости.
    info: Ирритабельность - это эмоциональное состояние повышенной реактивности, при котором даже незначительные стимулы вызывают более сильную отрицательную реакцию. Она может указывать на истощение организма или недостаток сна и скопление стресса в теле человека. Женщины во время подросткового возраста могут испытать гормонно обусловленный уровень раздражения.
  emotion.jealous:
    label: зависть
    summary: Негативная эмоция из сравнения себя с другими
    info: |-
      Зависть - это эмоция возникающая тогда когда мы замечаем что у другого есть то чего хотим сами
      Она отличается от ревности: зависть касается преимуществ других людей а ревность связана с ощущением угрозы собственным отношениям
      Может мотивировать на лучшую работу или вызвать обиду
  emotion.joyful:
    label: радость
    summary: Интенсивный подъем радости и энергия; переполняет позитивными чувствами.
    info: Радость - это интенсивная положительная эмоция, излучающая счастьем и связанная со внутренней мотивацией и состоянием потока согласно теории Чиксентмихайи. Эволюционное значение этой эмоции заключается в укреплении социальных связей и стимулировании полезного поведения.
  emotion.lonely:
    label: одиночность
    summary: Боль при недостатке общения
    info: Одиночество - это субъективное ощущение изоляции независимо от реального количества людей вокруг вас. Это мощный предиктор проблем со здоровьем и хроническое одиночество может укоротить жизнь человека. Мозг воспринимает эмоциональную боль одинаково как физическую.
  emotion.loving:
    label: любовь
    summary: Глубокое ощущение нежности к другому человеку.
    info: Любовь - это сложное чувство сочетание привязанности, заботы и доверия с интимностью. Нейрохемически она связана с окситоцином, дофамином и серотонином.
  emotion.melancholy:
    label: меланхолия
    summary: Тихая скорбь с элементами мудрения и красоты.
    info: Меланхолия - это задумчивое чувство эмоции сочетает грусть и размышление с определенной сладостью. Она происходит от греческого слова для черной желчи (мелин хоиле), древние врачи связывали ее со слишком большим количеством этой жидкости в организме человека.
  emotion.miserable:
    label: страдание
    summary: Глубочайшее чувство неудовлетворенности жизнью и боли на высшей степени выраженности
    info: |-
      Страдание - это интенсивное негативное эмоциональное состояние характеризующееся глубоким недовольством и страданием
      Оно может быть вызвано физической болью или травмой чувств либо потерей чего-то важного для человека
      Хроническое страдание является симптомом депрессии а социальная поддержка и профессиональная помощь играют ключевую роль в преодолении тяжелого состояния
  emotion.nervous:
    label: неподвижность
    summary: Легкая тревога перед событием
    info: Нервозность - это легкое тревожное состояние обычно связано с ожиданием важного события и физиологически проявляется повышенной активностью симпатической нервной системы в виде учащенного сердцебития или потливости. Незначительная степень возбужденности может даже повысить производительность труда, но слишком высокая мешает работе. Эффективным методом является переосмысление волнения как эмоциональный статус.
  emotion.nostalgic:
    label: навязчивая тяга к прошлому
    summary: Приятное но в то же время грустное переживание по минувшим временам
    info: |-
      Ностальгия – это эмоция со сладковато горьким вкусом; воспоминания о прошлом приятны и одновременно болезненны
      Слово происходит от греческих слов 'ностос' (возвращение домой) и 'алгос' (боль)
      Исследования показывают, что ностальгия усиливает чувство общественной связи и значительности жизни
  emotion.optimistic:
    label: оптимизм
    summary: Склонность ждать хороших исходов и видеть светлое будущее
    info: "Оптимизм - это когнитивно-эмоциональный стиль характеризующийся ожиданием положительных результатов\nМартин Селигманом определил его как ключевой фактор устойчивости в рамках позитивной психологии \nОптимисты живут дольше и здоровее а также успешнее"
  emotion.overwhelmed:
    label: перегрузка
    summary: Ощущение того, что слишком многое одновременно ложится на вас.
    info: Перегрузка возникает тогда, когда требования превышают наши возможности справляться с ними. Она проявляется когнитивным нарушением функций (невозможность ясно мыслить), эмоциональными всплесками или оцепенением. Некоторый уровень перегрузки можно преодолеть; хроническая же перегрузка может вызвать выгорание.
  emotion.peaceful:
    label: спокойствие
    summary: Глубочайшее ощущение внутреннего мира и комфорта.
    info: Спокойствие - это положительное эмоциональное состояние отсутствия стресса и помеховости. Это цель медитативных практик особенно осознанности и дзенской медитаціи.
  emotion.pessimistic:
    label: пессимистичность
    summary: Склонность ждать плохих последствий и фиксироваться на отрицательном.
    info: Пессимизм - это когнитивно-эмоциональный стиль характеризующийся ожиданием негативных результатов. Мягкий пессимизм может быть адаптивным; реалистическое оценка рисков помогает избегать опасности. Хронический пессимизм связан с более высокой вероятностью депрессии и худшими медицинскими исходами.
  emotion.playful:
    label: игривость
    summary: Жизнерадостная настроение желание веселиться
    info: Игривость - это эмоциональное состояние с радостью игры и юмора; она способствует развитию навыков в безопасной среде у взрослых как положительный предиктор креатива и хорошего психического здоровья.
  emotion.proud:
    label: гордость
    summary: Положительное чувство удовлетворения от собственных достижений
    info: |-
      Гордость - это эмоция, связанная с ощущением успеха или принадлежности к чему-то ценному
      Прямая позиция тела, поднятый взгляд и расправленные плечи являются универсальными проявлениями гордости
      Она может быть здоровой (стимулирует развитие), либо нездоровой (арогантность)
      В индуистской концепции гордыня является препятствием духовного развития
  emotion.relieved:
    label: облегчение
    summary: Приятное чувство освобождения от напряжения.
    info: Облегчение – это эмоция, испытываемая после ухода стресса или тревоги. Она проявляется глубоким выдохом и расслабленностью мышц с ощущением лёгкости в теле.
  emotion.sad:
    label: грустный
    summary: Ощущать скорбь или неудовлетворённость, быть в депрессии.
    info: Грусть — это естественная эмоция как реакция на потерю или разочарование. Она проявляется слезами, опущенными уголками рта и поникшей осанкой.
  emotion.scared:
    label: испуганный
    summary: Ощущать страх или ужас перед опасностью или угрозой.
    info: Страх – это базовая защитная эмоция. Он запускает выброс адреналина, ускоряет сердце и готовит тело к бегству или защите.
  emotion.serious:
    label: серьёз
    summary: Тихий набор без юмора; фокус на важных вещах.
    info: Серьезность - это эмоциональная позиция характеризующаяся сосредоточенностью и отсутствием легкомыслия.
  emotion.shocked:
    label: шок
    summary: Потрясающее ощущение из-за непредвиденной информации.
    info: Шок - это интенсивная эмоция вызвана неожиданной или шокирующей информацией и проявляется внезапным замеранием тела с открытым ртом и расширенными зрачками.
  emotion.shy:
    label: стыдливость
    summary: Нервное поведение во время социальных ситуаций особенно при взаимодействии с непривычными людьми
    info: |-
      Смущение - это социальная эмоция проявляющаяся тревожностью и застенчивостью в присутствии чужих людей
      Оно связано с интровертированной личностью, но не одно и то же
      Мягкое смущение нормально; серьезная форма (социофобия) нарушает функционирование
  emotion.surprised:
    label: удивлённый
    summary: Ощущение внезапного изумления перед неожиданным событием.
    info: Удивление — это очень кратковременная эмоция, длящейся лишь секунды. Она проявляется в раскрытом рту, поднявшихся бровях и расширенных зрачках.
  emotion.tired:
    label: уставший
    summary: Ощущать физическое или умственное истощение, нуждаться в отдыхе.
    info: Усталость – это сигнал организма о необходимости отдохнуть. Она проявляется сонливостью, замедлением реакций и снижением способности к концентрации.
  emotion.upset:
    label: разочарование
    summary: Нежелательная эмоционального беспокойства вызвано отрицательным событием
    info: |-
      Разочарование - это общий негативный эмоциональное состояние сочетает в себе грусть, ярость и тревогу
      Оно является реакцией на неприятные события, разочарования или конфликты
      Физиологически активирует ось стресса (ГПА), повышая уровень кортизола
  emotion.worried:
    label: заболочность
    summary: Повторяющееся негативное мышление о потенциально будущих проблемах
    info: |-
      Страх - это когнитивное эмоциональное состояние направлено на предвосхищение возможных угроз
      Минимальный уровень тревожности адаптивен и мотивирует человека готовиться
      Хроническая забота или беспокойство может прервать повседневную деятельность в виде фобии
