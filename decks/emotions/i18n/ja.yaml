lang: ja
pivot: false
title: 感情
cards:
  emotion.amazed:
    label: 畏れ
    summary: 非凡なものと出会った時に感じる強力でポジティブかつ驚きの感覚
    info: |-
      畏れ（awe）は、巨大なものや圧倒的なものを目にしたときに引き起こされる強い感情です。自分の重要性を小さく感じさせるとともに周囲とのつながりを感じやすくします。
      研究によれば、畏れによってストレスが減らされ親切行動が増えます。
      自然の中で音楽を聴いたときでも美しい芸術作品を見た時にも経験されます。
  emotion.amused:
    label: ポバヴェニ
    summary: 楽しいことや気分転換からくる快適で軽い気持ち
    info: |-
      ポバヴェニは、何か面白いまたは興味深いものによって引き起こされる軽い前向きな感情です。
      笑顔とは異なります。笑顔はこの感覚の結果ですが、すべてが必ずしも笑うわけではありません。
      これは社会的に共有された感情であり、他の人と一緒に楽しむことでより面白く感じられることがあります。
      知性に関する指標でもあり、ユーモアセンスと矛盾点を認識する能力に関連しています。
  emotion.angry:
    label: 怒っている
    summary: 強い不快感や怒りを感じている、または腹が立っている。
    info: 怒りは、感じられた不公正や脅威への反応として現れる感情です。心拍数を上げて、「戦うか逃げるか」の反応に備えます。
  emotion.annoyed:
    label: ストレス
    summary: 繰り返す邪魔な刺激による軽い怒りの感情
    info: '{"hint":"","content":{"label":"ストレス","summary":"繰り返される邪魔な刺激によって引き起こされた、軽い怒りの感覚です。","definition":["苛立ちとは反復的な妨害的刺激により生じる軽度の否定的感情である。", "これはより強い憤怒に先行する傾向がある。", "睡眠不足や飢え、過負荷が原因となることがある。", "自分のトリガーを認識することが良好な調節への鍵になる。"]},"type":0}'
  emotion.anxious:
    label: うあん
    summary: 不確実な未来に対する神経質さと恐れを感じる嫌悪感のある状態
    info: |-
      不安は脅威を予期する感情であり、軽度の不安感は適応的でパフォーマンス向上に役立ちます。身体的症状としては心拍数増加や発汗・息切れ・筋肉緊張などが現れます。
      不安障害が最も一般的な精神疾患となっており世界中で3億人以上がかかえています。
      kbt（認知行動療法）は不安症治療においてもっとも効果的な方法です。
  emotion.bored:
    label: ぬーだ
    summary: 興味もなければ何かに関わるべき刺激もない空虚さと無関心
    info: |-
      ヌーダは、刺激や意味ある活動の不在によって引き起こされる否定的な感情状態です。新しい経験を求める行動や創造的思考に導くことがあります。
      進化論的に見れば機会を探る動力になりますが、研究によると慢性的なヌード感はうつ病リスクを高めます。
  emotion.calm:
    label: 落ち着いた
    summary: 内面的な平和と快適さを感じ、平静である。
    info: 落ち着きとは精神的および身体的なバランスの取れた状態です。心拍を遅くし、呼吸を深め、明確な思考や良い判断力を可能にします。
  emotion.cheerful:
    label: ' радостность'
    summary: 愉快で楽観的であるという良好な精神状態
    info: 喜びとは、活気に満ちた情熱と良い気分を特徴とするポジティブな感情状態です。外向的な性格や高い肯定的感情のレベルに関連しています。感染力があり、楽しそうにしている人の存在は周囲の人々の気持ちも明るくします。研究によれば、楽しい人は免疫システムがより強化されています。
  emotion.confident:
    label: self-confidence
    summary: 自分に対する信念と価値
    info: '{"hint":"自分の能力に自信を持つこと；堂々とした態度","info":"自己確信とは、自身のスキルや判断力への信任という感情状態です。\n背筋を伸ばした姿勢・まっすぐな視線と落ち着いた声は、自己確信の一例です。\nアミー・カディ（TEDトーク 2012）が権威的なポーズを通じて自己確信を高める方法として注目されました。\n小さな成功体験や前向きなフィードバックによって徐々に育まれます。");'
  emotion.confused:
    label: 混乱
    summary: 状態や情報に対して不安定さを感じている感情
    info: |-
      {"hint":"何かを理解できない、または不確実な気持ち","info":"混乱は私たちが状況の文脈や知識に欠如しているときに起こります。\n学習過程における自然な一部であり；認知的不協和感覚は答えを探す行動を刺激します。
      表情上では頭部傾斜と眉間にしわ寄せによって現れます。
      コミュニケーションにおいて混乱があることは誤解につながる可能性があります；鍵となるのは質問することです。
  emotion.content:
    label: 満足
    summary: より多くを求めず、穏やかな静かな満足
    info: |-
      満足感とは、変化を求める必要がない平静でポジティブな感情状態です。幸せと異なります；満足は静かであるのに対し、幸福は活発的です。
      仏教では、満足（サントーサ）が悟りへの道における重要な徳として位置づけられています。
      幸福感に関する心理学的研究によると、満足感の方が興奮よりも耐性があることが示されています。
  emotion.curious:
    label: 興味
    summary: 新たな知識や理解を得たいという欲求
    info: 好奇心とは、新しい情報を求める行動を引き起こす動機付けの状態です。ドーパミンによる報酬システムと関係しており、実際に喜びを与えることがあります。科学的进步や個人的な成長にとって重要であり、子どもたちは自然にこの性質を持っていますが、教育制度によっては育てられることもあれば抑圧されることもあります。
  emotion.delighted:
    label: 感動的な喜び
    summary: 嬉しいことや驚きからくる強い喜び
    info: |-
      感動的な喜びは、愉快な出来事やサプライズによって引き起こされる強烈でポジティブな感情です。基本の喜びよりも強くダイナミックに現れます：ジャンプしたり叫んだり笑ったりします。
      進化論的機能としては、望ましい結果をもたらす行動が強調されます。
      また社会的に感染力があり、共有された喜びは二倍以上になります。
  emotion.determined:
    label: オドホドラニ
    summary: 障害があっても目標達成を目指す強い意思
    info: 決意は、動機付けの感情的状態であり、集中した目的と忍耐力が特徴です。顎を引き締めたり体を緊張させたりする様子や鋭い視線で現れます。「グリット（アングラ・ダックワース）」という概念とも密接に関係しており情熱と粘り強さとの組み合わせを持っています。研究では知能よりも決定の方が成功予測に適していることが示されています。
  emotion.disappointed:
    label: disappointment
    summary: 現実世界で私たちの期待が満たされないとき感じる悪い感覚です
    info: |-
      失望は、結果が期待や願望に応えないときに生じます。感情または努力への高い投資があるとより強く感じられます。
      研究によれば、期待値が高いほど失望も大きくなるため、低い期待を持つことで失望を減らすことができます。
      情緒知性の教育には、不快な感情である失望に対処する方法を取り入れることが含まれています。
  emotion.disgusted:
    label: 不快
    summary: 嫌悪を感じさせる刺激に対して強い反対意識を持つこと。
    info: |-
      不快感は、有害な物質（有毒食品や病気）から私たちを守る基本的な感情です。
      進化的機能としては腐敗した食べものを摂取することからの回避に役立ちます。
      鼻の皺めたり舌打ちしたりといった特徴的な表情とともに現れます。
  emotion.embarrassed:
    label: 耻
    summary: 社交的な状況での不快な羞愧感
    info: 恥ずかしさは、社会的規範を破ったと信じているときに生じる感情です。顔が赤くなる（ほおแดง）、目線をそらす、姿勢の崩れなどが現れます。他の人に自分のルールへの意識や従順さを見せることで機能します。
  emotion.excited:
    label: 熱心な
    summary: 強い興奮や喜びを伴う期待を感じる。
    info: 熱心さとは、快い出来事を予期して生じる強烈でポジティブな感情である。エネルギーが増し、脈拍が早まり、創造的な思考も促進される。
  emotion.frustrated:
    label: frustration
    summary: 目標達成への道筋で障碍があるとき感じる不快感
    info: 苛立ちとは、私たちの目標が障害によって妨げられたときに生じる感情です。建設的な行動（代替案を探す）や破壊的行為（攻撃性を示す）につながることがあります。「苛立つと攻撃する」という理論は20世紀に影響力のある心理学説でした。
  emotion.grateful:
    label: gratitude
    summary: We feel warm appreciation for what we have or receive.
    info: '{"hint":"感謝と感激を感じること","info":"満足感は、私たちの人生における善を意識するときに生じるポジティブな感情です。\nポジティブ心理学に関する研究では、定期的に感謝を表現することは幸福感を高めると示唆しています。\n脳内の報酬中枢が物理的な快楽と同じように活性化されます。\n毎日の感謝日記をつけることは気分改善において最も効果的である技法の一つです。","label":"gratitude","summary":"私たちは持っているものや受け取るものに対して温かい評価をする気持ちになります。'
  emotion.guilty:
    label: 罪悪感
    summary: 自分の倫理規範違反後の苦痛な気持ち
    info: |-
      罪悪感は、自分が悪いと判断する行動をした後に生じる感情です。恥とは異なります：罪悪感は特定の行為に焦点を当てますが、恥は全体的な自分自身に向かいます。
      社会的機能を持っています：謝りや補償への動機付けを行い、道徳的行为を強化します。
  emotion.happy:
    label: 幸せな
    summary: 喜びや楽しみを感じる、良い気分になっている。
    info: 幸せはドーパミンとセロトニンの放出に関連する快適な感情です。笑顔、活発なジェスチャー、開放的な体の姿勢として現れます。
  emotion.hopeful:
    label: hope
    summary: 将来は良くなるという楽観的な気持ち
    info: 希望とは、より良い未来への渇望とその実現可能性に対する信念を組み合わせた感情です。困難な状況における回復力（レジリエンス）の重要な要素であることが知られています。研究では、高い希望を持つ患者が早くから治癒する傾向があることを示しています。
  emotion.hopeless:
    label: beznaděj
    summary: 未来には何も良くなるものがないと考える気持ちです。
    info: '{"hint":"希望を感じない；絶望","info":"無力感は、状況が改善できないという確信を特徴とする否定的な感情的状態です。\nこれはうつ病の主要な症状であり自殺リスク要因でもあります。\nアーロン・ビックによる認知療法モデルでは、この無力感は核心となる信念とされています。\n見方や認知情報再構築（CBT）などの介入手段により効果があります。","label":"beznadezhej","summary":"将来に良いことが起こらないとの思い込みである感じること"}'
  emotion.inspired:
    label: インスピレーション
    summary: 創作活動への行動を促す創造的な感動
    info: |-
      インスピレーションとは、突然の創造的興奮と動機づけを特徴とする感情状態です。これはエピファニー（目覚め）や傑作または非凡な人物との出会いに関連しています。
      神経科学的には前頭葉皮質および報酬中枢が活性化されます。
      新しい体験を受け入れる環境で育まれたり、意識的に探求したりすることで養われます。
  emotion.irritated:
    label: 強く苛立つ
    summary: 小さな出来事にも敏感になる；怒りのはじまり
    info: |-
      イライラは感情の過敏な状態で、些細な刺激でも強い否定的な反応を引き起こします。これは疲労や睡眠不足、蓄積されたストレスが原因かもしれません。
      思春期・妊娠中・更年期にいる女性たちはホルモン変化によってもこうした感覚を感じることがあります。
      怒りとの区別をつけられることにより調節しやすくなります。
  emotion.jealous:
    label: '"zavist"'
    summary: 「他人との比較から生まれてくる否定的な感情」
    info: "{\"hint\":\"他人の利点に対して嫉妬する感情（緑は嫉みを表す色）\",\"info\":\"羨望とは、他の人が持っているものを自分も欲しがるときに生じる感情です。\r\nこれは怒りや憎悪と異なります：羡望では他者の利益に注目しますが、怒りでは自分の関係性への脅威を感じています。 \r\nそれはより良いパフォーマンスにつなげる動機にもなるし、不満感を与えることもあります。\r\n世界中の文化において緑という色彩は常にこの感情の象徴となっています。\"}"
  emotion.joyful:
    label: ' радость'
    summary: 強い幸せやエキサイティングさ；充実したポジティブ感情
    info: |-
      喜びは幸福感に満ちた強烈なポジティブ感情です。内在的動機とフロー状態（チクセンミハイ）に関連しています。
      進化の観点から見ると、社会的なつながりを強くし、有益な行動へのモティベーションも高めます。
      これは全体的に評価されている感情であり、ポジティブ心理学では幸福度（ウェルビーイング）における重要な指標でもあります。
  emotion.lonely:
    label: 孤独
    summary: 他の人との接触がないことによる悲しみ
    info: 孤独感は、周囲にいる人の数とは関係なく主観的な孤立の感覚です。慢性化した孤独感は健康問題を予測する強い指標であり、寿命にも悪影響を与えます。脳が社会的痛みと身体的痛みに対して同じように反応することも分かっています。
  emotion.loving:
    label: love
    summary: 他者に対する深い関心とつながりを持つ感覚です。
    info: |-
      {"hint":"強い愛情を感じる；ハートの目","info":"恋愛は好意、ケア、信頼と親密さを組み合わせた複雑な感情です。
      神経化学的にはオキシトシンやドーパミンおよびセロトニンに関連しています。
      ヘレン・フィッシャーによると、性欲、ロマンティックな恋愛そして深い結びつきという三つのシステムがあります。
      これはすべての文化に存在する普遍的な感情ですが表現方法には違いが生じます。","label":"love","summary":"他人への深く思いやりのある気持ち"}
  emotion.melancholy:
    label: メランコリー
    summary: 沈思と美しさを持つ静かな悲しみ
    info: |-
      {"hint":"憂いを感じる；郷愁的な","info":"メランコリーは、悲しみと思索そしてある種の甘美さを組み合わせた感情です。
      古代ギリシャ語で黒胆汁（melan choles）という言葉から来ています。古代医師たちがこの状態に黒胆汁過多症候群と考えていました。
      うつ病とは異なり美学的要素を持っていますので芸術や音楽・文学ではしばしば称賛されています。
      秋の自然だったり古い写真や哀しい曲によっても引き起こされます。
  emotion.miserable:
    label: トラペニ
    summary: 深く強い不快感と苦悩；最悪レベルの悲しさである。
    info: |-
      {"hint":"極度の不幸な気分","info":"トラペニは、深い不快感と苦しみを特徴とする強烈で否定的な感情状態です。
      身体的痛みや情緒的な傷つけられること、または喪失によって引き起こされることがあります。
      慢性的なトラペニはうつ病の一症状でもあります。
      社会的支持および専門家の助けが激しいトラペニに対処するためには不可欠です。","label":"トラペニ（苦しむこと）","summary":"深刻な不快さと苦痛；悲しみの中で最もひどい段階"}
  emotion.nervous:
    label: 不安
    summary: イベント前に感じるわずかな緊張；胃の中での蝶のように揺れるような感じ
    info: 不安は、一般的に重要な出来事の予期と関連する軽度のストレス状態です。生理的には交感神経系が活発になるため心拍数や汗が出ます。適切なレベルであればパフォーマンスを向上させますが、過剰になると妨げになります。「興奮として再評価（Excitement Reappraisal）」という技術的なアプローチで効果的に対処できます。
  emotion.nostalgic:
    label: ノストアルギー
    summary: 昔懐かしさからくる甘酸っぱさのある感覚
    info: |-
      ノスタルジは、甘くも切ない感情です。過去を思い出するのは快いですが同時に悲しくもあります。
      この言葉の語源である「nostalgia」（ドイツ語）には、「nostos」という故郷への帰りと「algos」という痛みが含まれています。
      研究によると、ノスタルジーによって社会的なつながりや意味を感じる力が高まります。
  emotion.optimistic:
    label: 楽観
    summary: 良い成果や前向きな側面を見いだすことを予期することへの傾向
    info: |-
      楽観主義とは、ポジティブな結果を期待する認知的・感情的なスタイルです。マーティン・セリグマン（肯定心理学）は、楽観主义が回復力の重要な要素であると指摘しました。
      楽天家の人々は寿命が長く健康で成功しやすい傾向があります。
      また、困難を一時的であり特定的かつ影響を与えることができるものとして捉えれば、楽観主义思想は学ぶことができます。
  emotion.overwhelmed:
    label: information overload
    summary: 一度に多くのことが押し寄せてくる感覚
    info: |-
      情報洪水とは、要求が自分の対処能力を超えたときに起こる状態です。認知機能の障害（明確に考える inability）、感情的爆発や麻痙のような症状として現れます。
      ある程度は管理可能な情報洪水ですが、慢性的な場合は燃え尽き症候群につながります。
      時間管理・委任作業とマインドフルネスは効果的な戦略になります。
  emotion.peaceful:
    label: 落ち着き
    summary: 深く内的に平安と快適さを感じていること。
    info: '{"hint":"平静で邪魔されることのない感覚","info":"落ち着きとはストレスや妨害が欠如しているポジティブな感情状態です。\nマインドフルネスや禅坐などの瞑想実践における目標とされています。\n副交換神経系を活性化させ、心拍数および血圧を低下させる働きがあります。\nエコ心理学では自然の中に滞在することが静けさを得る最も効果的な方法の一つだとされます。","label":"落ち着き","summary":"深い内面的平和と快適さを感じること。"'
  emotion.pessimistic:
    label: 悲観主義
    summary: 悪い結末を予測し、ネガティブ面に注目する傾向
    info: "{\"hint\":\"最悪を予想すること；頭上に暗雲が漂う\",\"info\":\"悲観主義とは、否定的な結果の期待という認知的・感情的なスタイルです。\r\n軽度な悲観は適応性があるかもしれません。リスク評価によって危険から回避できるためです。\r\n慢性的な悲観主义は抑うつ症や健康状態への悪い影響と関係があります。\r\n認知行動療法により悲観的な思考パターンを変えられることがあります。"
  emotion.playful:
    label: 遊び心
    summary: 活気に満ちた気分であり、楽しみや遊ぶことへの渇望があります
    info: |-
      遊び心とは、ゲームやユーモア、実験を楽しむ感情状態です。大人の場合には創造性と良好な精神的健康の良い予測因子となります。
      進化的機能としては安全な環境でスキルを開発することにあります。
      スタチュ・ブラウン（プレイ国立研究所）はあそびが人生のどの年齢でも健全な機能のために不可欠であることを示しています。
  emotion.proud:
    label: hurdošt
    summary: 自分の成果またはグループに対する満足感というポジティブな気持ち
    info: |-
      誇りは、成功や価値あるものへの所属感に関連する感情です。
      背筋を伸ばし頭を持ち上げ胸を張る姿勢などは普遍的な誘いの表現方法です。健康な場合は成長に向けた動機付けとなりますが不健全であれば傲慢になります。
      ヒンドゥー教では自己意識（アハムカラ）として捉えられ精神的発展にとって障害とされています。
  emotion.relieved:
    label: 安堵
    summary: 危険または緊迫した状況から解放された後の快適な開放感
    info: |-
      安堵感は、ストレスや不安が去った後に感じる感情です。深呼吸による吐息をつくこと、筋肉の緊張緩和と軽い感じとして現れます。
      進化的にも重要な役割があり、脅威が過ぎ去りリラックスできることを示しています。
      脳に関する研究では、安心感によって報酬と同じような領域が活性化することが分かっています。
  emotion.sad:
    label: さびしい
    summary: 悲しみや不満を感じている、またはうつ状態にある。
    info: さびしさは、喪失や失望への自然な感情反応です。涙を流し、口の端が下がり、背中が丸くなるなどの特徴があります。
  emotion.scared:
    label: 恐怖する
    summary: 危険や脅威から感じる恐れや絶望。
    info: 恐怖は基本的な防御的感情である。アドレナリンの放出を引き起こし、心拍数を速め、身体を逃げるか防衛する準備状態にする。
  emotion.serious:
    label: 真剣
    summary: ユーモアがない静かな態度；重要なことへの注力。
    info: |-
      真剣さとは、集中と軽率な態度の欠如を特徴とする感情的姿勢です。
      注意力や慎重な思考が必要な状況で重要となります。
      文化的には異なりますが、ある文化では真剣さが尊敬される一方、他の文化では手の届かないものとして見られることがあります。
      真剣さと遊び心とのバランスは心理的な柔軟性にとって鍵になります。
  emotion.shocked:
    label: ショック
    summary: 急いで受け取った意図しない情報またはイベントに対する感覚的な反応
    info: |-
      ショックは、予想外の驚くべき情報や出来事によって引き起こされる激しい感情です。突然体を動かさなくなること、口を開けたままであること、瞳孔が拡大することなどが特徴的です。
      進化的な機能としては活動の一時停止と意外性のある情報を処理するためと考えられています。
      また心理的な衝撃（トラウマ）として現れることもあり、長期にわたる精神的症状を持つ可能性があります。
  emotion.shy:
    label: shyness
    summary: 特に知らない人との間で起こる社会状況における神経過敏な抑圧感
    info: |
      {"hint":"社会的情境で不安や臆病を感じること","info":"恥ずかしさは、他人の前での緊張と抑制を示す社会的な感情です。\n内向的性質とは関連していますが同じではありません。\n軽度な羞恥心は普通のことですが、深刻な形態（社交恐怖症）では機能に障害が出ます。\nk文化によって影響を受けます：ある文化的には恥じらいは徳として扱われますが他の文化においてはある種の妨げとなります。
  emotion.surprised:
    label: 驚いた
    summary: 予想外の出来事に対して突然の驚きを感じる。
    info: 驚きは数秒だけ続く非常に短い感情です。口を開け、眉毛を上げ、瞳孔を拡大するなどの反応が現れます。
  emotion.tired:
    label: うなべんい
    summary: 身体的または精神的な疲労を感じ、休息が必要である。
    info: 倦怠感は体が休憩を必要としているサインです。眠気や反応の遅れ、集中力の低下といった症状があらわれます。
  emotion.upset:
    label: '"rozrušení"'
    summary: '"ネガティブな出来事が原因となって生じる不快な情緒的混乱。"'
    info: |-
      {"hint":"不快で不安を感じること","info":"混乱とは、悲しみ・怒り・焦燥感が混ざった一般的な否定的な感情状態です。\nこれは不愉快な出来事や失望、対立への反応として起こります。\n生理学的にはストレス軸（下垂体前葉－副腎皮質）を活性化させ、コルチゾール値の上昇につながります。
      呼吸法や認知的再構築などの情動調節はこの混乱に対処する助けになります。"}
  emotion.worried:
    label: heartfelt concern
    summary: 未来における可能性のある問題に関する繰り返し負の思考
    info: |-
      {"hint":"可能な問題に対する不安感；眉をひそめる","info":"心配は、潜在的な脅威への予測に焦点を当てた認知的情動状態です。
      軽度の心配は適応的であり準備行動へと導きます。
      慢性的な心配（うつ病）は日常機能を妨げます。
      マインドフルネスや意図的に心配が増幅する螺旋を止める方法は効果があります。"}
