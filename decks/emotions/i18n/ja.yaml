lang: ja
pivot: false
title: 感情
cards:
  emotion.angry:
    label: 怒っている
    summary: 強い不快感や怒りを感じている、または腹が立っている。
    info: 怒りは、感じられた不公正や脅威への反応として現れる感情です。心拍数を上げて、「戦うか逃げるか」の反応に備えます。
  emotion.calm:
    label: 落ち着いた
    summary: 内面的な平和と快適さを感じ、平静である。
    info: 落ち着きとは精神的および身体的なバランスの取れた状態です。心拍を遅くし、呼吸を深め、明確な思考や良い判断力を可能にします。
  emotion.excited:
    label: 熱心な
    summary: 強い興奮や喜びを伴う期待を感じる。
    info: 熱心さとは、快い出来事を予期して生じる強烈でポジティブな感情である。エネルギーが増し、脈拍が早まり、創造的な思考も促進される。
  emotion.happy:
    label: 幸せな
    summary: 喜びや楽しみを感じる、良い気分になっている。
    info: 幸せはドーパミンとセロトニンの放出に関連する快適な感情です。笑顔、活発なジェスチャー、開放的な体の姿勢として現れます。
  emotion.sad:
    label: さびしい
    summary: 悲しみや不満を感じている、またはうつ状態にある。
    info: さびしさは、喪失や失望への自然な感情反応です。涙を流し、口の端が下がり、背中が丸くなるなどの特徴があります。
  emotion.scared:
    label: 恐怖する
    summary: 危険や脅威から感じる恐れや絶望。
    info: 恐怖は基本的な防御的感情である。アドレナリンの放出を引き起こし、心拍数を速め、身体を逃げるか防衛する準備状態にする。
  emotion.surprised:
    label: 驚いた
    summary: 予想外の出来事に対して突然の驚きを感じる。
    info: 驚きは数秒だけ続く非常に短い感情です。口を開け、眉毛を上げ、瞳孔を拡大するなどの反応が現れます。
  emotion.tired:
    label: うなべんい
    summary: 身体的または精神的な疲労を感じ、休息が必要である。
    info: 倦怠感は体が休憩を必要としているサインです。眠気や反応の遅れ、集中力の低下といった症状があらわれます。
