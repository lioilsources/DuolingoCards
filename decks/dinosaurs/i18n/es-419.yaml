lang: es-419
pivot: false
title: Dinosaurios
cards:
  dino.t_rex:
    label: Tiranosaurio
    summary: Cretácico superior · carnívoro
    info: |
      El Tyrannosaurus rex medía hasta 12 metros de largo y vivía en América del Norte.
      Sus dientes eran tan grandes como plátanos, y tenía la mordida más fuerte de todos los animales terrestres.
      Sus brazos eran cortos, pero muy fuertes.
  dino.triceratops:
    label: Triceratops
    summary: Cretácico superior · herbívoro
    info: |
      El Triceratops medía unos 9 metros de largo y vivía en América del Norte.
      Su nombre significa «cara con tres cuernos», y sus dos cuernos de arriba medían cerca de un metro.
      Vivió en la misma época y en los mismos lugares que el Tiranosaurio.
  dino.stegosaurus:
    label: Estegosaurio
    summary: Jurásico superior · herbívoro
    info: |
      El Estegosaurio medía unos 9 metros de largo y vivía en América del Norte y en Portugal.
      Tenía grandes placas en la espalda y púas afiladas en la cola.
      Vivió hace tanto tiempo que está más lejos del T. rex en el tiempo que nosotros.
  dino.brachiosaurus:
    label: Braquiosaurio
    summary: Jurásico superior · herbívoro
    info: |
      El Braquiosaurio medía unos 22 metros de largo y vivía en América del Norte.
      Sus patas delanteras eran más largas que las traseras, así que alcanzaba hojas tan altas como un edificio de cuatro pisos.
      Su nombre significa «lagarto brazo».
  dino.velociraptor:
    label: Velociraptor
    summary: Cretácico superior · carnívoro
    info: |
      El Velociraptor medía solo unos 2 metros de largo, más o menos el tamaño de un pavo, y vivía en Mongolia y China.
      Estaba cubierto de plumas, pero no podía volar.
      En cada pata tenía una garra grande y curva para atrapar a sus presas.
  dino.ankylosaurus:
    label: Anquilosaurio
    summary: Cretácico superior · herbívoro
    info: |
      El Anquilosaurio medía unos 7 metros de largo y vivía en América del Norte.
      Su espalda estaba cubierta por una armadura de hueso, como un tanque viviente.
      Al final de la cola tenía un pesado mazo de hueso para defenderse.
  dino.spinosaurus:
    label: Espinosaurio
    summary: Cretácico superior · carnívoro
    info: |
      El Espinosaurio medía unos 14 metros de largo, incluso más que el T. rex, y vivía en el norte de África.
      Tenía una vela alta en la espalda y vivía cerca de los ríos, donde atrapaba peces.
      Sus primeros fósiles se destruyeron durante la Segunda Guerra Mundial.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Cretácico superior · herbívoro
    info: |
      El Parasaurolophus medía unos 9 metros de largo y vivía en América del Norte.
      Tenía una cresta larga y hueca en la cabeza y un pico como el de un pato.
      Soplando aire por su cresta, podía hacer sonidos fuertes, como de trompeta.
  dino.pteranodon:
    label: Pteranodon
    summary: Cretácico superior · carnívoro
    info: |
      El Pteranodon era un reptil volador, no un dinosaurio, y sus alas medían hasta 7 metros de punta a punta.
      Vivía en América del Norte y volaba sobre el mar para atrapar peces.
      Su nombre significa «ala sin dientes», porque tenía un pico sin dientes.
  dino.diplodocus:
    label: Diplodocus
    summary: Jurásico superior · herbívoro
    info: |
      El Diplodocus medía unos 25 metros de largo, tanto como dos autobuses, y vivía en América del Norte.
      Casi todo su largo era su cuello larguísimo y su cola delgada como un látigo.
      Tenía dientes pequeños como clavijas para arrancar las hojas de las plantas.
  dino.brontosaurus:
    label: Brontosaurio
    summary: Jurásico superior · herbívoro
    info: |
      El Brontosaurio medía unos 22 metros de largo y vivía en América del Norte.
      Su nombre significa «lagarto trueno», y pesaba más o menos lo mismo que tres elefantes.
      Durante más de 100 años los científicos creyeron que era un Apatosaurio, pero en 2015 recuperó su propio nombre.
  dino.iguanodon:
    label: Iguanodonte
    summary: Cretácico inferior · herbívoro
    info: |
      El Iguanodonte medía unos 10 metros de largo y vivía en Europa.
      Tenía una púa afilada en cada pulgar, que al principio los científicos creyeron que era un cuerno en la nariz.
      En 1825 se convirtió en uno de los primeros dinosaurios en recibir un nombre.
  dino.pachycephalosaurus:
    label: Paquicefalosaurio
    summary: Cretácico superior · herbívoro
    info: |
      El Paquicefalosaurio medía unos 4,5 metros de largo y vivía en América del Norte.
      El hueso de la parte de arriba de su cabeza tenía hasta 25 centímetros de grosor.
      Su nombre significa «lagarto de cabeza gruesa».
  dino.archaeopteryx:
    label: Arqueoptérix
    summary: Jurásico superior · carnívoro
    info: |
      El Arqueoptérix era más o menos del tamaño de un cuervo y vivía en lo que hoy es Alemania.
      Tenía plumas y alas como un ave, pero también dientes, garras en las alas y una cola larga de hueso.
      Nos muestra que las aves son los parientes vivos de los dinosaurios.
  dino.allosaurus:
    label: Alosaurio
    summary: Jurásico superior · carnívoro
    info: |
      El Alosaurio medía unos 9 metros de largo y vivía en América del Norte y en Portugal.
      Era el cazador más grande de su época y tenía pequeños cuernos sobre los ojos.
      Un fósil de Alosaurio tiene una herida hecha por la cola con púas de un Estegosaurio.
  dino.mosasaurus:
    label: Mosasaurio
    summary: Cretácico superior · carnívoro
    info: |
      El Mosasaurio era un reptil marino gigante, no un dinosaurio, de unos 13 metros de largo.
      Sus parientes son los lagartos y las serpientes, y tenía que subir a la superficie para respirar aire.
      Su primer fósil se encontró en los Países Bajos, cerca del río Mosa.
  dino.plesiosaurus:
    label: Plesiosaurio
    summary: Jurásico inferior · carnívoro
    info: |
      El Plesiosaurio era un reptil marino, no un dinosaurio, de unos 3 metros de largo.
      Tenía un cuello largo, una cabeza pequeña y cuatro aletas grandes para nadar.
      Su primer esqueleto completo lo encontró en Inglaterra la cazadora de fósiles Mary Anning.
  dino.ichthyosaurus:
    label: Ictiosaurio
    summary: Jurásico inferior · carnívoro
    info: |
      El Ictiosaurio era un reptil marino, ni dinosaurio ni pez, de unos 2 metros de largo.
      Se parecía a un delfín y tenía ojos muy grandes para ver en el agua oscura.
      En lugar de poner huevos, tenía a sus crías vivas en el mar.
  dino.dimetrodon:
    label: Dimetrodonte
    summary: Pérmico inferior · carnívoro
    info: |
      El Dimetrodonte no era un dinosaurio: vivió unos 40 millones de años antes de los primeros dinosaurios.
      Medía hasta 4 metros de largo, tenía una vela alta en la espalda y vivía en América del Norte y en Europa.
      Es más cercano a los mamíferos, como nosotros, que a los dinosaurios.
  dino.carnotaurus:
    label: Carnotauro
    summary: Cretácico superior · carnívoro
    info: |
      El Carnotauro medía unos 8 metros de largo y vivía en Argentina, en América del Sur.
      Su nombre significa «toro carnívoro», porque tenía dos cuernos sobre los ojos.
      Sus brazos eran diminutos, aún más pequeños que los del T. rex.
  dino.therizinosaurus:
    label: Therizinosaurio
    summary: Cretácico superior · herbívoro
    info: |
      El Therizinosaurio medía unos 9 metros de largo y vivía en Mongolia.
      Sus garras eran más largas que una regla escolar: las garras más largas de todos los animales conocidos.
      Aunque era pariente del T. rex, comía plantas.
  dino.gallimimus:
    label: Gallimimus
    summary: Cretácico superior · omnívoro
    info: |
      El Gallimimus medía unos 6 metros de largo y vivía en Mongolia.
      Se parecía a un avestruz grande, con un pico sin dientes y patas largas.
      Era uno de los corredores más rápidos entre los dinosaurios.
  dino.dilophosaurus:
    label: Dilofosaurio
    summary: Jurásico inferior · carnívoro
    info: |
      El Dilofosaurio medía unos 7 metros de largo y vivía en América del Norte.
      Tenía dos crestas delgadas en la cabeza, y su nombre significa «lagarto de dos crestas».
      En las películas escupe veneno y tiene una gorguera en el cuello, pero no hay pruebas de ninguna de las dos cosas.
  dino.styracosaurus:
    label: Estiracosaurio
    summary: Cretácico superior · herbívoro
    info: |
      El Estiracosaurio medía unos 5,5 metros de largo y vivía en Canadá.
      De la gorguera de hueso que rodeaba su cuello salían púas largas.
      También tenía un cuerno largo en la nariz, de hasta 60 centímetros.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Cretácico superior · carnívoro
    info: |
      El Quetzalcoatlus era un reptil volador, no un dinosaurio, y vivía en América del Norte.
      Sus alas medían unos 10 metros de punta a punta, y de pie en el suelo era tan alto como una jirafa.
      Su nombre viene de Quetzalcóatl, la serpiente emplumada, un dios de los aztecas.
  dino.compsognathus:
    label: Compsognathus
    summary: Jurásico superior · carnívoro
    info: |
      El Compsognathus medía solo 1 metro de largo, más o menos el tamaño de una gallina, y vivía en Alemania y Francia.
      Era uno de los dinosaurios más pequeños y corría rápido en dos patas.
      Un fósil todavía tiene una lagartija pequeña en el estómago: su última comida.
  dino.oviraptor:
    label: Oviraptor
    summary: Cretácico superior · omnívoro
    info: |
      El Oviraptor medía unos 2 metros de largo, tenía plumas y pico, y vivía en Mongolia.
      Su nombre significa «ladrón de huevos», porque lo encontraron sobre un nido de huevos.
      Después los científicos descubrieron que los huevos eran de su propia especie: era un padre cuidadoso, no un ladrón.
  dino.kentrosaurus:
    label: Kentrosaurio
    summary: Jurásico superior · herbívoro
    info: |
      El Kentrosaurio medía unos 4,5 metros de largo y vivía en Tanzania, en África.
      Era un pariente más pequeño del Estegosaurio, con placas en el cuello y púas largas en la espalda y la cola.
      Su nombre significa «lagarto puntiagudo».
  dino.microraptor:
    label: Microraptor
    summary: Cretácico inferior · carnívoro
    info: |
      El Microraptor medía menos de 1 metro de largo y vivía en China.
      Tenía alas de plumas en los brazos y también en las patas, así que tenía cuatro alas.
      Sus plumas eran negras y brillantes, como las de un cuervo.
  dino.protoceratops:
    label: Protoceratops
    summary: Cretácico superior · herbívoro
    info: |
      El Protoceratops medía unos 2 metros de largo, más o menos el tamaño de una oveja, y vivía en Mongolia y China.
      Tenía una gorguera de hueso y un pico como de loro, pero no tenía cuernos de verdad.
      Un fósil famoso muestra a un Protoceratops y un Velociraptor atrapados en plena pelea.
