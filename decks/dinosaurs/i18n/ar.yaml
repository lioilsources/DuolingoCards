lang: ar
pivot: false
title: الديناصورات
cards:
  dino.t_rex:
    label: تيرانوصور
    summary: العصر الطباشيري المتأخر · آكل لحوم
    info: |
      كان التيرانوصور ريكس يصل طوله إلى 12 مترًا، وعاش في أمريكا الشمالية.
      كانت أسنانه كبيرة مثل الموز، وكانت عضته الأقوى بين كل حيوانات اليابسة.
      كانت ذراعاه قصيرتين، لكنهما كانتا قويتين.
  dino.triceratops:
    label: ترايسيراتوبس
    summary: العصر الطباشيري المتأخر · آكل نباتات
    info: |
      كان طول الترايسيراتوبس نحو 9 أمتار، وعاش في أمريكا الشمالية.
      اسمه يعني "الوجه ذو القرون الثلاثة"، وكان طول قرنيه العلويين نحو متر.
      عاش في الزمن نفسه وفي الأماكن نفسها مع التيرانوصور.
  dino.stegosaurus:
    label: ستيجوسورس
    summary: العصر الجوراسي المتأخر · آكل نباتات
    info: |
      كان طول الستيجوسورس نحو 9 أمتار، وعاش في أمريكا الشمالية والبرتغال.
      كانت على ظهره صفائح كبيرة، وعلى ذيله أشواك حادة.
      عاش منذ زمن بعيد جدًا، حتى إنه أبعد عن التيرانوصور في الزمن مما نحن عنه.
  dino.brachiosaurus:
    label: براكيوسورس
    summary: العصر الجوراسي المتأخر · آكل نباتات
    info: |
      كان طول البراكيوسورس نحو 22 مترًا، وعاش في أمريكا الشمالية.
      كانت قائمتاه الأماميتان أطول من الخلفيتين، فكان يصل إلى أوراق بارتفاع مبنى من أربعة طوابق.
      اسمه يعني "السحلية ذات الذراع".
  dino.velociraptor:
    label: فيلوسيرابتور
    summary: العصر الطباشيري المتأخر · آكل لحوم
    info: |
      كان طول الفيلوسيرابتور نحو مترين فقط، أي بحجم ديك رومي تقريبًا، وعاش في منغوليا والصين.
      كان جسمه مغطى بالريش، لكنه لم يكن يستطيع الطيران.
      كان في كل قدم من قدميه مخلب كبير معقوف لاصطياد فرائسه.
  dino.ankylosaurus:
    label: أنكيلوصور
    summary: العصر الطباشيري المتأخر · آكل نباتات
    info: |
      كان طول الأنكيلوصور نحو 7 أمتار، وعاش في أمريكا الشمالية.
      كان ظهره مغطى بدرع من العظم، كأنه دبابة حية.
      وفي طرف ذيله كانت هراوة عظمية ثقيلة يدافع بها عن نفسه.
  dino.spinosaurus:
    label: سبينوصور
    summary: العصر الطباشيري المتأخر · آكل لحوم
    info: |
      كان طول السبينوصور نحو 14 مترًا، أي أطول حتى من التيرانوصور، وعاش في شمال أفريقيا.
      كان على ظهره شراع عالٍ، وعاش قرب الأنهار حيث كان يصطاد الأسماك.
      دُمّرت أولى أحافيره خلال الحرب العالمية الثانية.
  dino.parasaurolophus:
    label: باراصورولوفس
    summary: العصر الطباشيري المتأخر · آكل نباتات
    info: |
      كان طول الباراصورولوفس نحو 9 أمتار، وعاش في أمريكا الشمالية.
      كان على رأسه عرف طويل مجوف، وكان له منقار يشبه منقار البطة.
      كان ينفخ الهواء في عرفه فيُصدر أصواتًا عالية تشبه صوت البوق.
  dino.pteranodon:
    label: تيرانودون
    summary: العصر الطباشيري المتأخر · آكل لحوم
    info: |
      كان التيرانودون زاحفًا طائرًا وليس ديناصورًا، وكان طول جناحيه المفرودين يصل إلى 7 أمتار.
      عاش في أمريكا الشمالية، وكان يطير فوق البحر ليصطاد الأسماك.
      اسمه يعني "جناح بلا أسنان"، لأن منقاره كان بلا أسنان.
  dino.diplodocus:
    label: ديبلودوكس
    summary: العصر الجوراسي المتأخر · آكل نباتات
    info: |
      كان طول الديبلودوكس نحو 25 مترًا، أي بطول حافلتين، وعاش في أمريكا الشمالية.
      كان معظم طوله رقبته الطويلة جدًا وذيله الرفيع الذي يشبه السوط.
      كانت له أسنان صغيرة تشبه الأوتاد ينزع بها الأوراق عن النباتات.
  dino.brontosaurus:
    label: برونتوصور
    summary: العصر الجوراسي المتأخر · آكل نباتات
    info: |
      كان طول البرونتوصور نحو 22 مترًا، وعاش في أمريكا الشمالية.
      اسمه يعني "سحلية الرعد"، وكان وزنه يقارب وزن ثلاثة أفيال.
      ظن العلماء أكثر من 100 عام أنه أباتوصور، لكنه استعاد اسمه الخاص في عام 2015.
  dino.iguanodon:
    label: إغواندون
    summary: العصر الطباشيري المبكر · آكل نباتات
    info: |
      كان طول الإغواندون نحو 10 أمتار، وعاش في أوروبا.
      كانت في كل إبهام من إبهاميه شوكة حادة، ظنها العلماء في البداية قرنًا على أنفه.
      في عام 1825 صار من أوائل الديناصورات التي أُطلقت عليها أسماء.
  dino.pachycephalosaurus:
    label: باكيسيفالوصور
    summary: العصر الطباشيري المتأخر · آكل نباتات
    info: |
      كان طول الباكيسيفالوصور نحو 4.5 أمتار، وعاش في أمريكا الشمالية.
      كان سُمك العظم في أعلى رأسه يصل إلى 25 سنتيمترًا.
      اسمه يعني "السحلية سميكة الرأس".
  dino.archaeopteryx:
    label: أركيوبتركس
    summary: العصر الجوراسي المتأخر · آكل لحوم
    info: |
      كان الأركيوبتركس بحجم الغراب تقريبًا، وعاش في المكان الذي هو اليوم ألمانيا.
      كان له ريش وجناحان مثل الطيور، لكن كانت له أيضًا أسنان ومخالب على جناحيه وذيل عظمي طويل.
      وهو يُظهر أن الطيور هي الأقارب الأحياء للديناصورات.
  dino.allosaurus:
    label: ألوصور
    summary: العصر الجوراسي المتأخر · آكل لحوم
    info: |
      كان طول الألوصور نحو 9 أمتار، وعاش في أمريكا الشمالية والبرتغال.
      كان أكبر صياد في زمنه، وكانت له قرون صغيرة فوق عينيه.
      في إحدى أحافير الألوصور جرح سببه ذيل ستيجوسورس الشائك.
  dino.mosasaurus:
    label: موساصور
    summary: العصر الطباشيري المتأخر · آكل لحوم
    info: |
      كان الموساصور زاحفًا بحريًا عملاقًا وليس ديناصورًا، وكان طوله نحو 13 مترًا.
      أقاربه هم السحالي والثعابين، وكان عليه أن يصعد إلى سطح الماء ليتنفس الهواء.
      عُثر على أول أحفورة له في هولندا، قرب نهر الميز.
  dino.plesiosaurus:
    label: بليزيوصور
    summary: العصر الجوراسي المبكر · آكل لحوم
    info: |
      كان البليزيوصور زاحفًا بحريًا وليس ديناصورًا، وكان طوله نحو 3 أمتار.
      كانت له رقبة طويلة ورأس صغير وأربع زعانف كبيرة للسباحة.
      عثرت صائدة الأحافير ماري آنينغ على أول هيكل عظمي كامل له في إنجلترا.
  dino.ichthyosaurus:
    label: إكثيوصور
    summary: العصر الجوراسي المبكر · آكل لحوم
    info: |
      كان الإكثيوصور زاحفًا بحريًا، لا ديناصورًا ولا سمكة، وكان طوله نحو مترين.
      كان يشبه الدلفين، وكانت له عينان كبيرتان جدًا ليرى في الماء المظلم.
      كان يلد صغارًا أحياء في البحر بدلًا من أن يضع البيض.
  dino.dimetrodon:
    label: ديميترودون
    summary: العصر البرمي المبكر · آكل لحوم
    info: |
      لم يكن الديميترودون ديناصورًا، فقد عاش قبل أول الديناصورات بنحو 40 مليون سنة.
      كان طوله يصل إلى 4 أمتار، وعلى ظهره شراع عالٍ، وعاش في أمريكا الشمالية وأوروبا.
      وهو أقرب إلى الثدييات، مثلنا نحن، منه إلى الديناصورات.
  dino.carnotaurus:
    label: كارنوتورس
    summary: العصر الطباشيري المتأخر · آكل لحوم
    info: |
      كان طول الكارنوتورس نحو 8 أمتار، وعاش في الأرجنتين في أمريكا الجنوبية.
      اسمه يعني "الثور آكل اللحم"، لأنه كان له قرنان فوق عينيه.
      كانت ذراعاه صغيرتين جدًا، أصغر حتى من ذراعي التيرانوصور.
  dino.therizinosaurus:
    label: ثيريزينوصور
    summary: العصر الطباشيري المتأخر · آكل نباتات
    info: |
      كان طول الثيريزينوصور نحو 9 أمتار، وعاش في منغوليا.
      كانت مخالبه أطول من مسطرة المدرسة، وهي أطول مخالب لأي حيوان معروف.
      ومع أنه كان قريبًا للتيرانوصور، فقد كان يأكل النباتات.
  dino.gallimimus:
    label: غاليميموس
    summary: العصر الطباشيري المتأخر · يأكل كل شيء
    info: |
      كان طول الغاليميموس نحو 6 أمتار، وعاش في منغوليا.
      كان يشبه نعامة كبيرة، له منقار بلا أسنان وساقان طويلتان.
      كان من أسرع العدّائين بين الديناصورات.
  dino.dilophosaurus:
    label: ديلوفوصور
    summary: العصر الجوراسي المبكر · آكل لحوم
    info: |
      كان طول الديلوفوصور نحو 7 أمتار، وعاش في أمريكا الشمالية.
      كان على رأسه عرفان رفيعان، واسمه يعني "السحلية ذات العرفين".
      في الأفلام يبصق السم وله طوق حول رقبته، لكن لا دليل على أي من الأمرين.
  dino.styracosaurus:
    label: ستيراكوصور
    summary: العصر الطباشيري المتأخر · آكل نباتات
    info: |
      كان طول الستيراكوصور نحو 5.5 أمتار، وعاش في كندا.
      كانت أشواك طويلة تبرز من الطوق العظمي حول رقبته.
      وكان له أيضًا قرن واحد طويل على أنفه، يصل طوله إلى 60 سنتيمترًا.
  dino.quetzalcoatlus:
    label: كيتزالكواتلس
    summary: العصر الطباشيري المتأخر · آكل لحوم
    info: |
      كان الكيتزالكواتلس زاحفًا طائرًا وليس ديناصورًا، وعاش في أمريكا الشمالية.
      كان طول جناحيه المفرودين نحو 10 أمتار، وحين يقف على الأرض كان طويلًا مثل الزرافة.
      سُمّي باسم كيتزالكواتل، الإله الثعبان المريّش عند الأزتيك.
  dino.compsognathus:
    label: كومبسوجناثوس
    summary: العصر الجوراسي المتأخر · آكل لحوم
    info: |
      كان طول الكومبسوجناثوس نحو متر واحد فقط، أي بحجم دجاجة تقريبًا، وعاش في ألمانيا وفرنسا.
      كان من أصغر الديناصورات، وكان يركض بسرعة على قدمين.
      في إحدى أحافيره لا تزال سحلية صغيرة في معدته، وهي آخر وجبة أكلها.
  dino.oviraptor:
    label: أوفيرابتور
    summary: العصر الطباشيري المتأخر · يأكل كل شيء
    info: |
      كان طول الأوفيرابتور نحو مترين، وكان له ريش ومنقار، وعاش في منغوليا.
      اسمه يعني "سارق البيض"، لأنه وُجد فوق عش من البيض.
      ثم اكتشف العلماء أن البيض كان من نوعه هو، فقد كان أبًا حنونًا لا لصًّا.
  dino.kentrosaurus:
    label: كنتروصور
    summary: العصر الجوراسي المتأخر · آكل نباتات
    info: |
      كان طول الكنتروصور نحو 4.5 أمتار، وعاش في تنزانيا في أفريقيا.
      كان قريبًا أصغر حجمًا للستيجوسورس، له صفائح على رقبته وأشواك طويلة على ظهره وذيله.
      اسمه يعني "السحلية الشائكة".
  dino.microraptor:
    label: مايكرورابتور
    summary: العصر الطباشيري المبكر · آكل لحوم
    info: |
      كان طول المايكرورابتور أقل من متر واحد، وعاش في الصين.
      كانت له أجنحة من الريش على ذراعيه وعلى ساقيه أيضًا، أي أنه كان له أربعة أجنحة.
      كان ريشه أسود لامعًا، مثل ريش الغراب.
  dino.protoceratops:
    label: بروتوسيراتوبس
    summary: العصر الطباشيري المتأخر · آكل نباتات
    info: |
      كان طول البروتوسيراتوبس نحو مترين، أي بحجم خروف تقريبًا، وعاش في منغوليا والصين.
      كان له طوق عظمي ومنقار يشبه منقار الببغاء، لكن لم تكن له قرون حقيقية.
      تُظهر أحفورة شهيرة بروتوسيراتوبس وفيلوسيرابتور متشابكين في قتال.
