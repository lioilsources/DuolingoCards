lang: ko
pivot: false
title: 공룡
cards:
  dino.t_rex:
    label: 티라노사우루스
    summary: 백악기 후기 · 육식
    info: |
      티라노사우루스 렉스는 몸길이가 최대 12미터였고 북아메리카에 살았어요.
      이빨은 바나나만큼 컸고, 무는 힘은 육지 동물 중에서 가장 셌어요.
      앞다리는 짧았지만 힘이 셌어요.
  dino.triceratops:
    label: 트리케라톱스
    summary: 백악기 후기 · 초식
    info: |
      트리케라톱스는 몸길이가 약 9미터였고 북아메리카에 살았어요.
      이름은 "뿔이 세 개 달린 얼굴"이라는 뜻이고, 위쪽 두 뿔은 길이가 약 1미터였어요.
      티라노사우루스와 같은 시대에 같은 곳에서 살았어요.
  dino.stegosaurus:
    label: 스테고사우루스
    summary: 쥐라기 후기 · 초식
    info: |
      스테고사우루스는 몸길이가 약 9미터였고 북아메리카와 포르투갈에 살았어요.
      등에는 커다란 골판이, 꼬리에는 뾰족한 가시가 있었어요.
      아주 오래전에 살아서, 티라노사우루스와의 시간 차이가 티라노사우루스와 우리 사이보다 더 커요.
  dino.brachiosaurus:
    label: 브라키오사우루스
    summary: 쥐라기 후기 · 초식
    info: |
      브라키오사우루스는 몸길이가 약 22미터였고 북아메리카에 살았어요.
      앞다리가 뒷다리보다 길어서 4층 건물 높이에 있는 나뭇잎까지 닿을 수 있었어요.
      이름은 "팔 도마뱀"이라는 뜻이에요.
  dino.velociraptor:
    label: 벨로키랍토르
    summary: 백악기 후기 · 육식
    info: |
      벨로키랍토르는 몸길이가 약 2미터밖에 안 되는 칠면조만 한 공룡으로, 몽골과 중국에 살았어요.
      온몸이 깃털로 덮여 있었지만 날지는 못했어요.
      발마다 먹이를 잡는 크고 휘어진 발톱이 하나씩 있었어요.
  dino.ankylosaurus:
    label: 안킬로사우루스
    summary: 백악기 후기 · 초식
    info: |
      안킬로사우루스는 몸길이가 약 7미터였고 북아메리카에 살았어요.
      등이 뼈 갑옷으로 덮여 있어서 마치 살아 있는 탱크 같았어요.
      꼬리 끝에는 몸을 지키는 무거운 뼈 곤봉이 있었어요.
  dino.spinosaurus:
    label: 스피노사우루스
    summary: 백악기 후기 · 육식
    info: |
      스피노사우루스는 몸길이가 약 14미터로 티라노사우루스보다도 길었고, 북아프리카에 살았어요.
      등에 높은 돛이 있었고, 강가에 살면서 물고기를 잡아먹었어요.
      처음 발견된 화석은 제2차 세계 대전 때 파괴되었어요.
  dino.parasaurolophus:
    label: 파라사우롤로푸스
    summary: 백악기 후기 · 초식
    info: |
      파라사우롤로푸스는 몸길이가 약 9미터였고 북아메리카에 살았어요.
      머리에는 속이 빈 긴 볏이 있었고, 입은 오리처럼 부리 모양이었어요.
      볏에 공기를 불어 넣어 트럼펫 같은 큰 소리를 낼 수 있었어요.
  dino.pteranodon:
    label: 프테라노돈
    summary: 백악기 후기 · 육식
    info: |
      프테라노돈은 공룡이 아니라 하늘을 나는 파충류였고, 날개를 펴면 최대 7미터나 되었어요.
      북아메리카에 살았고 바다 위를 날며 물고기를 잡았어요.
      부리에 이빨이 없어서 이름이 "이빨 없는 날개"라는 뜻이에요.
  dino.diplodocus:
    label: 디플로도쿠스
    summary: 쥐라기 후기 · 초식
    info: |
      디플로도쿠스는 몸길이가 약 25미터로 버스 두 대만큼 길었고, 북아메리카에 살았어요.
      몸길이의 대부분은 아주 긴 목과 채찍처럼 가는 꼬리였어요.
      작은 말뚝 같은 이빨로 식물의 잎을 훑어 먹었어요.
  dino.brontosaurus:
    label: 브론토사우루스
    summary: 쥐라기 후기 · 초식
    info: |
      브론토사우루스는 몸길이가 약 22미터였고 북아메리카에 살았어요.
      이름은 "천둥 도마뱀"이라는 뜻이고, 몸무게는 코끼리 세 마리쯤 되었어요.
      100년 넘게 과학자들은 아파토사우루스와 같은 공룡이라고 생각했지만, 2015년에 자기 이름을 되찾았어요.
  dino.iguanodon:
    label: 이구아노돈
    summary: 백악기 전기 · 초식
    info: |
      이구아노돈은 몸길이가 약 10미터였고 유럽에 살았어요.
      엄지손가락마다 뾰족한 가시가 있었는데, 과학자들은 처음에 그것이 코 위의 뿔인 줄 알았어요.
      1825년에 세계에서 가장 먼저 이름이 붙은 공룡 가운데 하나가 되었어요.
  dino.pachycephalosaurus:
    label: 파키케팔로사우루스
    summary: 백악기 후기 · 초식
    info: |
      파키케팔로사우루스는 몸길이가 약 4.5미터였고 북아메리카에 살았어요.
      머리 꼭대기의 뼈는 두께가 최대 25센티미터나 되었어요.
      이름은 "머리가 두꺼운 도마뱀"이라는 뜻이에요.
  dino.archaeopteryx:
    label: 시조새
    summary: 쥐라기 후기 · 육식
    info: |
      시조새는 까마귀만 한 크기였고 지금의 독일 지역에 살았어요.
      새처럼 깃털과 날개가 있었지만, 이빨과 날개의 발톱, 뼈가 있는 긴 꼬리도 있었어요.
      시조새는 새가 공룡의 살아 있는 친척이라는 것을 보여 줘요.
  dino.allosaurus:
    label: 알로사우루스
    summary: 쥐라기 후기 · 육식
    info: |
      알로사우루스는 몸길이가 약 9미터였고 북아메리카와 포르투갈에 살았어요.
      그 시대에서 가장 큰 사냥꾼이었고, 눈 위에 작은 뿔이 있었어요.
      어떤 알로사우루스 화석에는 스테고사우루스의 가시 꼬리에 찔린 상처가 남아 있어요.
  dino.mosasaurus:
    label: 모사사우루스
    summary: 백악기 후기 · 육식
    info: |
      모사사우루스는 공룡이 아니라 몸길이가 약 13미터인 거대한 바다 파충류였어요.
      도마뱀과 뱀의 친척이고, 공기를 마시려면 물 위로 올라와야 했어요.
      첫 화석은 네덜란드의 뫼즈강 근처에서 발견되었어요.
  dino.plesiosaurus:
    label: 플레시오사우루스
    summary: 쥐라기 전기 · 육식
    info: |
      플레시오사우루스는 공룡이 아니라 몸길이가 약 3미터인 바다 파충류였어요.
      긴 목과 작은 머리, 그리고 헤엄치는 데 쓰는 커다란 지느러미발 네 개가 있었어요.
      처음으로 완전한 뼈대를 발견한 사람은 영국의 화석 사냥꾼 메리 애닝이에요.
  dino.ichthyosaurus:
    label: 익티오사우루스
    summary: 쥐라기 전기 · 육식
    info: |
      익티오사우루스는 공룡도 물고기도 아닌, 몸길이가 약 2미터인 바다 파충류였어요.
      돌고래처럼 생겼고, 어두운 물속에서도 잘 보이는 아주 큰 눈이 있었어요.
      알을 낳지 않고 바다에서 새끼를 직접 낳았어요.
  dino.dimetrodon:
    label: 디메트로돈
    summary: 페름기 전기 · 육식
    info: |
      디메트로돈은 공룡이 아니에요. 최초의 공룡보다 약 4000만 년 전에 살았어요.
      몸길이는 최대 4미터였고, 등에 높은 돛이 있었으며 북아메리카와 유럽에 살았어요.
      공룡보다는 우리 같은 포유류와 더 가까운 친척이에요.
  dino.carnotaurus:
    label: 카르노타우루스
    summary: 백악기 후기 · 육식
    info: |
      카르노타우루스는 몸길이가 약 8미터였고 남아메리카의 아르헨티나에 살았어요.
      눈 위에 뿔이 두 개 있어서 이름이 "고기를 먹는 황소"라는 뜻이에요.
      앞다리는 아주 작아서 티라노사우루스의 앞다리보다도 작았어요.
  dino.therizinosaurus:
    label: 테리지노사우루스
    summary: 백악기 후기 · 초식
    info: |
      테리지노사우루스는 몸길이가 약 9미터였고 몽골에 살았어요.
      발톱이 학교에서 쓰는 자보다 길었는데, 알려진 동물 중에서 가장 긴 발톱이에요.
      티라노사우루스의 친척이었지만 식물을 먹었어요.
  dino.gallimimus:
    label: 갈리미무스
    summary: 백악기 후기 · 잡식
    info: |
      갈리미무스는 몸길이가 약 6미터였고 몽골에 살았어요.
      커다란 타조처럼 생겼고, 이빨 없는 부리와 긴 다리가 있었어요.
      공룡 중에서 가장 빨리 달리는 공룡 가운데 하나였어요.
  dino.dilophosaurus:
    label: 딜로포사우루스
    summary: 쥐라기 전기 · 육식
    info: |
      딜로포사우루스는 몸길이가 약 7미터였고 북아메리카에 살았어요.
      머리에 얇은 볏이 두 개 있었고, 이름은 "볏이 두 개인 도마뱀"이라는 뜻이에요.
      영화에서는 독을 뱉고 목에 주름 장식이 있지만, 둘 다 증거가 없어요.
  dino.styracosaurus:
    label: 스티라코사우루스
    summary: 백악기 후기 · 초식
    info: |
      스티라코사우루스는 몸길이가 약 5.5미터였고 캐나다에 살았어요.
      목 둘레의 뼈 프릴에서 긴 가시들이 뻗어 나와 있었어요.
      코 위에도 길이가 최대 60센티미터인 긴 뿔이 하나 있었어요.
  dino.quetzalcoatlus:
    label: 케찰코아틀루스
    summary: 백악기 후기 · 육식
    info: |
      케찰코아틀루스는 공룡이 아니라 하늘을 나는 파충류였고, 북아메리카에 살았어요.
      날개를 펴면 약 10미터였고, 땅에 서면 기린만큼 키가 컸어요.
      이름은 아즈텍 사람들이 믿던 깃털 달린 뱀의 신 케찰코아틀에서 따왔어요.
  dino.compsognathus:
    label: 콤프소그나투스
    summary: 쥐라기 후기 · 육식
    info: |
      콤프소그나투스는 몸길이가 약 1미터밖에 안 되는 닭만 한 공룡으로, 독일과 프랑스에 살았어요.
      가장 작은 공룡 가운데 하나였고, 두 다리로 빠르게 달렸어요.
      어떤 화석의 배 속에는 마지막으로 먹은 작은 도마뱀이 아직 남아 있어요.
  dino.oviraptor:
    label: 오비랍토르
    summary: 백악기 후기 · 잡식
    info: |
      오비랍토르는 몸길이가 약 2미터였고, 깃털과 부리가 있었으며 몽골에 살았어요.
      알 둥지 위에서 발견되어서 이름이 "알 도둑"이라는 뜻이에요.
      나중에 그 알이 자기 종류의 알이라는 것이 밝혀졌어요. 도둑이 아니라 정성스러운 부모였던 거예요.
  dino.kentrosaurus:
    label: 켄트로사우루스
    summary: 쥐라기 후기 · 초식
    info: |
      켄트로사우루스는 몸길이가 약 4.5미터였고 아프리카의 탄자니아에 살았어요.
      스테고사우루스의 작은 친척으로, 목에는 골판이, 등과 꼬리에는 긴 가시가 있었어요.
      이름은 "가시 도마뱀"이라는 뜻이에요.
  dino.microraptor:
    label: 미크로랍토르
    summary: 백악기 전기 · 육식
    info: |
      미크로랍토르는 몸길이가 1미터도 안 되었고 중국에 살았어요.
      앞다리와 뒷다리 모두에 깃털 날개가 있어서 날개가 네 개였어요.
      깃털은 까마귀처럼 검고 반짝였어요.
  dino.protoceratops:
    label: 프로토케라톱스
    summary: 백악기 후기 · 초식
    info: |
      프로토케라톱스는 몸길이가 약 2미터로 양만 한 크기였고, 몽골과 중국에 살았어요.
      뼈 프릴과 앵무새 같은 부리가 있었지만, 진짜 뿔은 없었어요.
      유명한 화석 하나에는 프로토케라톱스와 벨로키랍토르가 서로 싸우던 모습 그대로 남아 있어요.
