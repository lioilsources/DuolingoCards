lang: ro
pivot: false
title: Dinozauri
cards:
  dino.t_rex:
    label: Tiranozaur
    summary: Cretacicul târziu · carnivor
    info: |
      Tiranozaurul avea până la 12 metri lungime și trăia în America de Nord.
      Dinții lui erau mari cât niște banane și avea cea mai puternică mușcătură dintre toate animalele de uscat.
      Labele din față erau scurte, dar puternice.
  dino.triceratops:
    label: Triceratops
    summary: Cretacicul târziu · ierbivor
    info: |
      Triceratopsul avea cam 9 metri lungime și trăia în America de Nord.
      Numele lui înseamnă „față cu trei coarne”, iar cele două coarne de sus aveau cam un metru.
      A trăit în aceeași perioadă și în aceleași locuri ca tiranozaurul.
  dino.stegosaurus:
    label: Stegozaur
    summary: Jurasicul târziu · ierbivor
    info: |
      Stegozaurul avea cam 9 metri lungime și trăia în America de Nord și în Portugalia.
      Avea plăci mari pe spate și țepi ascuțiți pe coadă.
      A trăit atât de demult, încât de tiranozaur îl despărțea mai mult timp decât ne desparte pe noi azi.
  dino.brachiosaurus:
    label: Brahiozaur
    summary: Jurasicul târziu · ierbivor
    info: |
      Brahiozaurul avea cam 22 de metri lungime și trăia în America de Nord.
      Picioarele din față erau mai lungi decât cele din spate, așa că ajungea la frunze înalte cât o clădire cu patru etaje.
      Numele lui înseamnă „șopârla-braț”.
  dino.velociraptor:
    label: Velociraptor
    summary: Cretacicul târziu · carnivor
    info: |
      Velociraptorul avea doar cam 2 metri lungime, cât un curcan, și trăia în Mongolia și China.
      Era acoperit cu pene, dar nu putea zbura.
      Pe fiecare picior avea o gheară mare și curbată, cu care își prindea prada.
  dino.ankylosaurus:
    label: Anchilozaur
    summary: Cretacicul târziu · ierbivor
    info: |
      Anchilozaurul avea cam 7 metri lungime și trăia în America de Nord.
      Spatele îi era acoperit cu o armură de os, ca un tanc viu.
      La capătul cozii avea o măciucă grea de os, cu care se apăra.
  dino.spinosaurus:
    label: Spinozaur
    summary: Cretacicul târziu · carnivor
    info: |
      Spinozaurul avea cam 14 metri lungime, chiar mai mult decât tiranozaurul, și trăia în nordul Africii.
      Avea o velă înaltă pe spate și trăia lângă râuri, unde prindea pești.
      Primele lui fosile au fost distruse în timpul celui de-al Doilea Război Mondial.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Cretacicul târziu · ierbivor
    info: |
      Parasaurolophus avea cam 9 metri lungime și trăia în America de Nord.
      Avea pe cap o creastă lungă și goală pe dinăuntru și un cioc ca de rață.
      Suflând aer prin creastă, putea scoate sunete puternice, ca de trompetă.
  dino.pteranodon:
    label: Pteranodon
    summary: Cretacicul târziu · carnivor
    info: |
      Pteranodonul era o reptilă zburătoare, nu un dinozaur, iar aripile lui măsurau până la 7 metri.
      Trăia în America de Nord și zbura deasupra mării ca să prindă pești.
      Numele lui înseamnă „aripă fără dinți”, pentru că avea un cioc fără dinți.
  dino.diplodocus:
    label: Diplodocus
    summary: Jurasicul târziu · ierbivor
    info: |
      Diplodocus avea cam 25 de metri lungime, cât două autobuze, și trăia în America de Nord.
      Cea mai mare parte din lungimea lui erau gâtul foarte lung și coada subțire ca un bici.
      Avea dinți mici ca niște țăruși, cu care smulgea frunzele de pe plante.
  dino.brontosaurus:
    label: Brontozaur
    summary: Jurasicul târziu · ierbivor
    info: |
      Brontozaurul avea cam 22 de metri lungime și trăia în America de Nord.
      Numele lui înseamnă „șopârla-tunet” și cântărea cam cât trei elefanți.
      Peste 100 de ani, oamenii de știință au crezut că este apatozaur, dar în 2015 și-a primit înapoi propriul nume.
  dino.iguanodon:
    label: Iguanodon
    summary: Cretacicul timpuriu · ierbivor
    info: |
      Iguanodonul avea cam 10 metri lungime și trăia în Europa.
      Pe fiecare deget mare avea un țep ascuțit, pe care oamenii de știință l-au crezut la început un corn pe nas.
      În 1825 a devenit unul dintre primii dinozauri care au primit vreodată un nume.
  dino.pachycephalosaurus:
    label: Pachicefalozaur
    summary: Cretacicul târziu · ierbivor
    info: |
      Pachicefalozaurul avea cam 4,5 metri lungime și trăia în America de Nord.
      Osul din creștetul capului avea o grosime de până la 25 de centimetri.
      Numele lui înseamnă „șopârla cu cap gros”.
  dino.archaeopteryx:
    label: Archaeopteryx
    summary: Jurasicul târziu · carnivor
    info: |
      Archaeopteryx era cam cât un corb și trăia pe teritoriul Germaniei de azi.
      Avea pene și aripi ca o pasăre, dar și dinți, gheare pe aripi și o coadă lungă și osoasă.
      El ne arată că păsările sunt rudele în viață ale dinozaurilor.
  dino.allosaurus:
    label: Alozaur
    summary: Jurasicul târziu · carnivor
    info: |
      Alozaurul avea cam 9 metri lungime și trăia în America de Nord și în Portugalia.
      Era cel mai mare vânător al vremii lui și avea coarne mici deasupra ochilor.
      O fosilă de alozaur are o rană făcută de coada cu țepi a unui stegozaur.
  dino.mosasaurus:
    label: Mozazaur
    summary: Cretacicul târziu · carnivor
    info: |
      Mozazaurul era o reptilă marină uriașă, nu un dinozaur, lungă de cam 13 metri.
      Rudele lui sunt șopârlele și șerpii, iar ca să respire aer trebuia să iasă la suprafață.
      Prima lui fosilă a fost găsită în Țările de Jos, lângă râul Meuse.
  dino.plesiosaurus:
    label: Plesiozaur
    summary: Jurasicul timpuriu · carnivor
    info: |
      Plesiozaurul era o reptilă marină, nu un dinozaur, lungă de cam 3 metri.
      Avea gâtul lung, capul mic și patru înotătoare mari.
      Primul lui schelet întreg a fost găsit în Anglia de căutătoarea de fosile Mary Anning.
  dino.ichthyosaurus:
    label: Ihtiozaur
    summary: Jurasicul timpuriu · carnivor
    info: |
      Ihtiozaurul era o reptilă marină, nu un dinozaur și nici un pește, lungă de cam 2 metri.
      Arăta ca un delfin și avea ochi foarte mari, ca să vadă în apa întunecată.
      În loc să depună ouă, năștea pui vii în mare.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Permianul timpuriu · carnivor
    info: |
      Dimetrodonul nu era dinozaur: a trăit cu circa 40 de milioane de ani înaintea primilor dinozauri.
      Avea până la 4 metri lungime, o velă înaltă pe spate și trăia în America de Nord și în Europa.
      Este o rudă mai apropiată a mamiferelor, ca noi, decât a dinozaurilor.
  dino.carnotaurus:
    label: Carnotaurus
    summary: Cretacicul târziu · carnivor
    info: |
      Carnotaurus avea cam 8 metri lungime și trăia în Argentina, în America de Sud.
      Numele lui înseamnă „taur mâncător de carne”, pentru că avea două coarne deasupra ochilor.
      Labele din față erau minuscule, chiar mai mici decât ale tiranozaurului.
  dino.therizinosaurus:
    label: Therizinosaurus
    summary: Cretacicul târziu · ierbivor
    info: |
      Therizinosaurus avea cam 9 metri lungime și trăia în Mongolia.
      Ghearele lui erau mai lungi decât o riglă de școală, cele mai lungi gheare ale oricărui animal cunoscut.
      Deși era rudă cu tiranozaurul, mânca plante.
  dino.gallimimus:
    label: Gallimimus
    summary: Cretacicul târziu · omnivor
    info: |
      Gallimimus avea cam 6 metri lungime și trăia în Mongolia.
      Arăta ca un struț mare, cu un cioc fără dinți și picioare lungi.
      Era unul dintre cei mai rapizi alergători dintre dinozauri.
  dino.dilophosaurus:
    label: Dilofozaur
    summary: Jurasicul timpuriu · carnivor
    info: |
      Dilofozaurul avea cam 7 metri lungime și trăia în America de Nord.
      Avea două creste subțiri pe cap, iar numele lui înseamnă „șopârla cu două creste”.
      În filme scuipă venin și are un guler în jurul gâtului, dar nu există dovezi pentru niciuna dintre ele.
  dino.styracosaurus:
    label: Styracosaurus
    summary: Cretacicul târziu · ierbivor
    info: |
      Styracosaurus avea cam 5,5 metri lungime și trăia în Canada.
      Din gulerul de os din jurul gâtului ieșeau țepi lungi.
      Avea și un corn lung pe nas, de până la 60 de centimetri.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Cretacicul târziu · carnivor
    info: |
      Quetzalcoatlus era o reptilă zburătoare, nu un dinozaur, și trăia în America de Nord.
      Aripile lui măsurau cam 10 metri, iar când stătea pe pământ era înalt cât o girafă.
      A fost numit după Quetzalcoatl, zeul-șarpe cu pene al aztecilor.
  dino.compsognathus:
    label: Compsognathus
    summary: Jurasicul târziu · carnivor
    info: |
      Compsognathus avea doar cam 1 metru lungime, cât o găină, și trăia în Germania și Franța.
      Era unul dintre cei mai mici dinozauri și alerga repede pe două picioare.
      O fosilă are încă în stomac o șopârlă mică, ultima lui masă.
  dino.oviraptor:
    label: Oviraptor
    summary: Cretacicul târziu · omnivor
    info: |
      Oviraptorul avea cam 2 metri lungime, avea pene și cioc și trăia în Mongolia.
      Numele lui înseamnă „hoț de ouă”, pentru că a fost găsit pe un cuib cu ouă.
      Mai târziu, oamenii de știință au aflat că ouăle erau ale speciei lui, deci era un părinte grijuliu, nu un hoț.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Jurasicul târziu · ierbivor
    info: |
      Kentrosaurus avea cam 4,5 metri lungime și trăia în Tanzania, în Africa.
      Era o rudă mai mică a stegozaurului, cu plăci pe gât și țepi lungi pe spate și pe coadă.
      Numele lui înseamnă „șopârla cu țepi”.
  dino.microraptor:
    label: Microraptor
    summary: Cretacicul timpuriu · carnivor
    info: |
      Microraptorul avea mai puțin de 1 metru lungime și trăia în China.
      Avea aripi cu pene și pe labele din față, și pe picioare, așa că avea patru aripi.
      Penele lui erau negre și lucioase, ca ale unei ciori.
  dino.protoceratops:
    label: Protoceratops
    summary: Cretacicul târziu · ierbivor
    info: |
      Protoceratopsul avea cam 2 metri lungime, cât o oaie, și trăia în Mongolia și China.
      Avea un guler de os și un cioc ca de papagal, dar nu avea coarne adevărate.
      O fosilă celebră arată un protoceratops și un velociraptor încleștați în luptă.
