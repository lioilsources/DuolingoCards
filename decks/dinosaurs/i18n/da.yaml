lang: da
pivot: false
title: Dinosaurer
cards:
  dino.t_rex:
    label: Tyrannosaurus
    summary: Sen kridttid · kødæder
    info: |
      Tyrannosaurus rex var op til 12 meter lang og levede i Nordamerika.
      Dens tænder var lige så store som bananer, og den havde det stærkeste bid af alle landdyr.
      Dens arme var korte, men de var stærke.
  dino.triceratops:
    label: Triceratops
    summary: Sen kridttid · planteæder
    info: |
      Triceratops var omkring 9 meter lang og levede i Nordamerika.
      Navnet betyder "ansigt med tre horn", og de to øverste horn var omkring en meter lange.
      Den levede på samme tid og de samme steder som Tyrannosaurus.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Sen jura · planteæder
    info: |
      Stegosaurus var omkring 9 meter lang og levede i Nordamerika og Portugal.
      Den havde store plader på ryggen og skarpe pigge på halen.
      Den levede så længe siden, at den er længere væk i tid fra T. rex, end vi er.
  dino.brachiosaurus:
    label: Brachiosaurus
    summary: Sen jura · planteæder
    info: |
      Brachiosaurus var omkring 22 meter lang og levede i Nordamerika.
      Forbenene var længere end bagbenene, så den kunne nå blade lige så højt oppe som et hus med fire etager.
      Navnet betyder "armøgle".
  dino.velociraptor:
    label: Velociraptor
    summary: Sen kridttid · kødæder
    info: |
      Velociraptor var kun omkring 2 meter lang, på størrelse med en kalkun, og levede i Mongoliet og Kina.
      Den var dækket af fjer, men den kunne ikke flyve.
      På hver fod havde den en stor, krum klo til at fange bytte med.
  dino.ankylosaurus:
    label: Ankylosaurus
    summary: Sen kridttid · planteæder
    info: |
      Ankylosaurus var omkring 7 meter lang og levede i Nordamerika.
      Ryggen var dækket af en panser af knogler, som en levende kampvogn.
      For enden af halen havde den en tung knoglekølle, som den forsvarede sig med.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Sen kridttid · kødæder
    info: |
      Spinosaurus var omkring 14 meter lang, endnu længere end T. rex, og levede i Nordafrika.
      Den havde et højt sejl på ryggen og levede ved floder, hvor den fangede fisk.
      De første fossiler af den blev ødelagt under Anden Verdenskrig.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Sen kridttid · planteæder
    info: |
      Parasaurolophus var omkring 9 meter lang og levede i Nordamerika.
      Den havde en lang, hul kam på hovedet og et næb som en and.
      Ved at puste luft gennem kammen kunne den lave høje lyde som en trompet.
  dino.pteranodon:
    label: Pteranodon
    summary: Sen kridttid · kødæder
    info: |
      Pteranodon var et flyvende krybdyr og ikke en dinosaur, og dens vinger var op til 7 meter brede.
      Den levede i Nordamerika og fløj over havet for at fange fisk.
      Navnet betyder "vinge uden tænder", fordi dens næb ikke havde nogen tænder.
  dino.diplodocus:
    label: Diplodocus
    summary: Sen jura · planteæder
    info: |
      Diplodocus var omkring 25 meter lang, lige så lang som to busser, og levede i Nordamerika.
      Det meste af længden var den meget lange hals og den tynde, pisklignende hale.
      Den havde små, stiftformede tænder, som den rev blade af planterne med.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Sen jura · planteæder
    info: |
      Brontosaurus var omkring 22 meter lang og levede i Nordamerika.
      Navnet betyder "tordenøgle", og den vejede omtrent lige så meget som tre elefanter.
      I over 100 år troede forskerne, at den var en Apatosaurus, men i 2015 fik den sit eget navn tilbage.
  dino.iguanodon:
    label: Iguanodon
    summary: Tidlig kridttid · planteæder
    info: |
      Iguanodon var omkring 10 meter lang og levede i Europa.
      Den havde en skarp pig på hver tommelfinger, som forskerne først troede var et horn på næsen.
      I 1825 blev den en af de allerførste dinosaurer, der fik et navn.
  dino.pachycephalosaurus:
    label: Pachycephalosaurus
    summary: Sen kridttid · planteæder
    info: |
      Pachycephalosaurus var omkring 4,5 meter lang og levede i Nordamerika.
      Knoglen oven på hovedet var op til 25 centimeter tyk.
      Navnet betyder "tykhovedet øgle".
  dino.archaeopteryx:
    label: Archaeopteryx
    summary: Sen jura · kødæder
    info: |
      Archaeopteryx var omkring lige så stor som en ravn og levede i det, der i dag er Tyskland.
      Den havde fjer og vinger som en fugl, men også tænder, kløer på vingerne og en lang hale af knogler.
      Den viser, at fuglene er dinosaurernes levende slægtninge.
  dino.allosaurus:
    label: Allosaurus
    summary: Sen jura · kødæder
    info: |
      Allosaurus var omkring 9 meter lang og levede i Nordamerika og Portugal.
      Den var sin tids største jæger og havde små horn over øjnene.
      Et fossil af en Allosaurus har et sår fra den piggede hale på en Stegosaurus.
  dino.mosasaurus:
    label: Mosasaurus
    summary: Sen kridttid · kødæder
    info: |
      Mosasaurus var et kæmpestort havkrybdyr og ikke en dinosaur, omkring 13 meter lang.
      Den var i familie med øgler og slanger og skulle op til overfladen for at trække vejret.
      Det første fossil blev fundet i Nederlandene, tæt ved floden Maas.
  dino.plesiosaurus:
    label: Plesiosaurus
    summary: Tidlig jura · kødæder
    info: |
      Plesiosaurus var et havkrybdyr og ikke en dinosaur, omkring 3 meter lang.
      Den havde en lang hals, et lille hoved og fire store luffer at svømme med.
      Det første hele skelet blev fundet i England af fossiljægeren Mary Anning.
  dino.ichthyosaurus:
    label: Ichthyosaurus
    summary: Tidlig jura · kødæder
    info: |
      Ichthyosaurus var et havkrybdyr, hverken en dinosaur eller en fisk, omkring 2 meter lang.
      Den lignede en delfin og havde meget store øjne til at se i mørkt vand.
      Den lagde ikke æg, men fødte levende unger i havet.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Tidlig perm · kødæder
    info: |
      Dimetrodon var ikke en dinosaur: den levede omkring 40 millioner år før de første dinosaurer.
      Den var op til 4 meter lang, havde et højt sejl på ryggen og levede i Nordamerika og Europa.
      Den er nærmere i familie med pattedyr, ligesom os, end med dinosaurer.
  dino.carnotaurus:
    label: Carnotaurus
    summary: Sen kridttid · kødæder
    info: |
      Carnotaurus var omkring 8 meter lang og levede i Argentina i Sydamerika.
      Navnet betyder "kødædende tyr", fordi den havde to horn over øjnene.
      Dens arme var bittesmå, endnu mindre end T. rex' arme.
  dino.therizinosaurus:
    label: Therizinosaurus
    summary: Sen kridttid · planteæder
    info: |
      Therizinosaurus var omkring 9 meter lang og levede i Mongoliet.
      Dens kløer var længere end en skolelineal, de længste kløer hos noget kendt dyr.
      Selvom den var i familie med T. rex, spiste den planter.
  dino.gallimimus:
    label: Gallimimus
    summary: Sen kridttid · altæder
    info: |
      Gallimimus var omkring 6 meter lang og levede i Mongoliet.
      Den lignede en stor struds med et tandløst næb og lange ben.
      Den var en af de hurtigste løbere blandt dinosaurerne.
  dino.dilophosaurus:
    label: Dilophosaurus
    summary: Tidlig jura · kødæder
    info: |
      Dilophosaurus var omkring 7 meter lang og levede i Nordamerika.
      Den havde to tynde kamme på hovedet, og navnet betyder "øgle med to kamme".
      I film spytter den gift og har en halskrave, men der er ingen beviser for nogen af delene.
  dino.styracosaurus:
    label: Styracosaurus
    summary: Sen kridttid · planteæder
    info: |
      Styracosaurus var omkring 5,5 meter lang og levede i Canada.
      Lange pigge stak ud fra knoglekraven rundt om halsen.
      Den havde også ét langt horn på næsen, op til 60 centimeter langt.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Sen kridttid · kødæder
    info: |
      Quetzalcoatlus var et flyvende krybdyr og ikke en dinosaur, og den levede i Nordamerika.
      Vingerne var omkring 10 meter brede, og når den stod på jorden, var den lige så høj som en giraf.
      Den er opkaldt efter Quetzalcoatl, aztekernes fjerklædte slangegud.
  dino.compsognathus:
    label: Compsognathus
    summary: Sen jura · kødæder
    info: |
      Compsognathus var kun omkring 1 meter lang, på størrelse med en høne, og levede i Tyskland og Frankrig.
      Den var en af de mindste dinosaurer og løb hurtigt på to ben.
      I et fossil ligger der stadig en lille øgle i maven, dens sidste måltid.
  dino.oviraptor:
    label: Oviraptor
    summary: Sen kridttid · altæder
    info: |
      Oviraptor var omkring 2 meter lang, havde fjer og næb og levede i Mongoliet.
      Navnet betyder "ægtyv", fordi den blev fundet på en rede med æg.
      Senere fandt forskerne ud af, at æggene var dens egen slags, så den var en omsorgsfuld forælder og ikke en tyv.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Sen jura · planteæder
    info: |
      Kentrosaurus var omkring 4,5 meter lang og levede i Tanzania i Afrika.
      Den var en mindre slægtning til Stegosaurus med plader på halsen og lange pigge på ryggen og halen.
      Navnet betyder "pigget øgle".
  dino.microraptor:
    label: Microraptor
    summary: Tidlig kridttid · kødæder
    info: |
      Microraptor var under 1 meter lang og levede i Kina.
      Den havde vinger med fjer på både armene og benene, altså fire vinger.
      Dens fjer var sorte og skinnende, ligesom en krages.
  dino.protoceratops:
    label: Protoceratops
    summary: Sen kridttid · planteæder
    info: |
      Protoceratops var omkring 2 meter lang, på størrelse med et får, og levede i Mongoliet og Kina.
      Den havde en knoglekrave og et næb som en papegøje, men ingen rigtige horn.
      Et berømt fossil viser en Protoceratops og en Velociraptor, der er låst fast i en kamp.
