lang: sk
pivot: false
title: Dinosaury
cards:
  dino.t_rex:
    label: Tyranosaurus
    summary: Neskorá krieda · mäsožravec
    info: |
      Tyranosaurus bol dlhý až 12 metrov a žil v Severnej Amerike.
      Jeho zuby boli veľké ako banány a hrýzol najsilnejšie zo všetkých suchozemských zvierat.
      Mal krátke predné končatiny, ale boli silné.
  dino.triceratops:
    label: Triceratops
    summary: Neskorá krieda · bylinožravec
    info: |
      Triceratops bol dlhý asi 9 metrov a žil v Severnej Amerike.
      Jeho meno znamená „trojrohá tvár“ a jeho dva horné rohy boli dlhé asi meter.
      Žil v rovnakom čase a na rovnakých miestach ako tyranosaurus.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Neskorá jura · bylinožravec
    info: |
      Stegosaurus bol dlhý asi 9 metrov a žil v Severnej Amerike a v Portugalsku.
      Na chrbte mal veľké platne a na chvoste ostré bodce.
      Žil tak dávno, že od tyranosaura ho delilo viac času ako nás dnes.
  dino.brachiosaurus:
    label: Brachiosaurus
    summary: Neskorá jura · bylinožravec
    info: |
      Brachiosaurus bol dlhý asi 22 metrov a žil v Severnej Amerike.
      Predné nohy mal dlhšie ako zadné, takže dosiahol na listy vysoko ako štvorposchodový dom.
      Jeho meno znamená „ramenný jašter“.
  dino.velociraptor:
    label: Velociraptor
    summary: Neskorá krieda · mäsožravec
    info: |
      Velociraptor bol dlhý len asi 2 metre, veľký ako moriak, a žil v Mongolsku a Číne.
      Bol pokrytý perím, ale lietať nevedel.
      Na každej nohe mal veľký zahnutý pazúr na chytanie koristi.
  dino.ankylosaurus:
    label: Ankylosaurus
    summary: Neskorá krieda · bylinožravec
    info: |
      Ankylosaurus bol dlhý asi 7 metrov a žil v Severnej Amerike.
      Chrbát mal pokrytý kosteným pancierom ako živý tank.
      Na konci chvosta mal ťažký kostený kyj, ktorým sa bránil.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Neskorá krieda · mäsožravec
    info: |
      Spinosaurus bol dlhý asi 14 metrov, ešte viac ako tyranosaurus, a žil v severnej Afrike.
      Na chrbte mal vysokú plachtu a žil pri riekach, kde lovil ryby.
      Jeho prvé skameneliny zničili počas druhej svetovej vojny.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Neskorá krieda · bylinožravec
    info: |
      Parasaurolophus bol dlhý asi 9 metrov a žil v Severnej Amerike.
      Na hlave mal dlhý dutý hrebeň a zobák ako kačica.
      Keď cez hrebeň fúkal vzduch, vydával hlasné zvuky podobné trúbke.
  dino.pteranodon:
    label: Pteranodon
    summary: Neskorá krieda · mäsožravec
    info: |
      Pteranodon bol lietajúci plaz, nie dinosaurus, a rozpätie jeho krídel bolo až 7 metrov.
      Žil v Severnej Amerike a lietal nad morom, kde lovil ryby.
      Jeho meno znamená „krídlo bez zubov“, lebo mal zobák bez zubov.
  dino.diplodocus:
    label: Diplodocus
    summary: Neskorá jura · bylinožravec
    info: |
      Diplodocus bol dlhý asi 25 metrov, ako dva autobusy, a žil v Severnej Amerike.
      Väčšinu tejto dĺžky tvoril veľmi dlhý krk a tenký chvost podobný biču.
      Mal malé kolíkovité zuby, ktorými obhrýzal listy z rastlín.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Neskorá jura · bylinožravec
    info: |
      Brontosaurus bol dlhý asi 22 metrov a žil v Severnej Amerike.
      Jeho meno znamená „hromový jašter“ a vážil asi toľko ako tri slony.
      Viac ako 100 rokov si vedci mysleli, že je to apatosaurus, ale v roku 2015 dostal svoje meno späť.
  dino.iguanodon:
    label: Iguanodon
    summary: Raná krieda · bylinožravec
    info: |
      Iguanodon bol dlhý asi 10 metrov a žil v Európe.
      Na každom palci mal ostrý bodec, ktorý vedci najprv považovali za roh na nose.
      V roku 1825 sa stal jedným z úplne prvých pomenovaných dinosaurov.
  dino.pachycephalosaurus:
    label: Pachycefalosaurus
    summary: Neskorá krieda · bylinožravec
    info: |
      Pachycefalosaurus bol dlhý asi 4,5 metra a žil v Severnej Amerike.
      Kosť na temene jeho hlavy bola hrubá až 25 centimetrov.
      Jeho meno znamená „hrubohlavý jašter“.
  dino.archaeopteryx:
    label: Archeopteryx
    summary: Neskorá jura · mäsožravec
    info: |
      Archeopteryx bol veľký asi ako krkavec a žil na území dnešného Nemecka.
      Mal perie a krídla ako vták, ale aj zuby, pazúry na krídlach a dlhý kostený chvost.
      Ukazuje, že vtáky sú žijúcimi príbuznými dinosaurov.
  dino.allosaurus:
    label: Allosaurus
    summary: Neskorá jura · mäsožravec
    info: |
      Allosaurus bol dlhý asi 9 metrov a žil v Severnej Amerike a v Portugalsku.
      Bol najväčším lovcom svojej doby a nad očami mal malé rožky.
      Na jednej skameneline allosaura je rana od bodcov na chvoste stegosaura.
  dino.mosasaurus:
    label: Mosasaurus
    summary: Neskorá krieda · mäsožravec
    info: |
      Mosasaurus bol obrovský morský plaz, nie dinosaurus, dlhý asi 13 metrov.
      Jeho príbuznými sú jašterice a hady a na nadýchnutie musel vyplávať na hladinu.
      Jeho prvú skamenelinu našli v Holandsku pri rieke Máza.
  dino.plesiosaurus:
    label: Plesiosaurus
    summary: Raná jura · mäsožravec
    info: |
      Plesiosaurus bol morský plaz, nie dinosaurus, dlhý asi 3 metre.
      Mal dlhý krk, malú hlavu a štyri veľké plutvy na plávanie.
      Jeho prvú celú kostru našla v Anglicku zberateľka skamenelín Mary Anningová.
  dino.ichthyosaurus:
    label: Ichtyosaurus
    summary: Raná jura · mäsožravec
    info: |
      Ichtyosaurus bol morský plaz, nie dinosaurus ani ryba, dlhý asi 2 metre.
      Vyzeral ako delfín a mal veľmi veľké oči, aby videl v tmavej vode.
      Namiesto kladenia vajec rodil v mori živé mláďatá.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Raný perm · mäsožravec
    info: |
      Dimetrodon nebol dinosaurus: žil asi 40 miliónov rokov pred prvými dinosaurami.
      Bol dlhý až 4 metre, na chrbte mal vysokú plachtu a žil v Severnej Amerike a v Európe.
      Je bližším príbuzným cicavcov, teda aj nás, ako dinosaurov.
  dino.carnotaurus:
    label: Karnotaurus
    summary: Neskorá krieda · mäsožravec
    info: |
      Karnotaurus bol dlhý asi 8 metrov a žil v Argentíne, v Južnej Amerike.
      Jeho meno znamená „mäsožravý býk“, lebo mal nad očami dva rohy.
      Predné končatiny mal maličké, ešte menšie, ako mal tyranosaurus.
  dino.therizinosaurus:
    label: Terizinosaurus
    summary: Neskorá krieda · bylinožravec
    info: |
      Terizinosaurus bol dlhý asi 9 metrov a žil v Mongolsku.
      Jeho pazúry boli dlhšie ako školské pravítko, najdlhšie zo všetkých známych zvierat.
      Hoci bol príbuzný tyranosaura, jedol rastliny.
  dino.gallimimus:
    label: Gallimimus
    summary: Neskorá krieda · všežravec
    info: |
      Gallimimus bol dlhý asi 6 metrov a žil v Mongolsku.
      Vyzeral ako veľký pštros, mal zobák bez zubov a dlhé nohy.
      Patril medzi najrýchlejších bežcov spomedzi dinosaurov.
  dino.dilophosaurus:
    label: Dilofosaurus
    summary: Raná jura · mäsožravec
    info: |
      Dilofosaurus bol dlhý asi 7 metrov a žil v Severnej Amerike.
      Na hlave mal dva tenké hrebene a jeho meno znamená „jašter s dvoma hrebeňmi“.
      Vo filmoch pľuje jed a má golier okolo krku, ale ani jedno nie je dokázané.
  dino.styracosaurus:
    label: Styrakosaurus
    summary: Neskorá krieda · bylinožravec
    info: |
      Styrakosaurus bol dlhý asi 5,5 metra a žil v Kanade.
      Z kosteného límca okolo krku mu trčali dlhé bodce.
      Na nose mal aj jeden dlhý roh, dlhý až 60 centimetrov.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Neskorá krieda · mäsožravec
    info: |
      Quetzalcoatlus bol lietajúci plaz, nie dinosaurus, a žil v Severnej Amerike.
      Rozpätie jeho krídel bolo asi 10 metrov a keď stál na zemi, bol vysoký ako žirafa.
      Pomenovali ho podľa Quetzalcoatla, opereného hadieho boha Aztékov.
  dino.compsognathus:
    label: Kompsognátus
    summary: Neskorá jura · mäsožravec
    info: |
      Kompsognátus bol dlhý len asi 1 meter, veľký ako sliepka, a žil v Nemecku a vo Francúzsku.
      Patril medzi najmenšie dinosaury a rýchlo behal po dvoch nohách.
      Jedna skamenelina má v žalúdku ešte malú jaštericu, jeho poslednú večeru.
  dino.oviraptor:
    label: Oviraptor
    summary: Neskorá krieda · všežravec
    info: |
      Oviraptor bol dlhý asi 2 metre, mal perie a zobák a žil v Mongolsku.
      Jeho meno znamená „zlodej vajec“, lebo ho našli na hniezde s vajcami.
      Neskôr vedci zistili, že to boli vajcia jeho vlastného druhu, takže to bol starostlivý rodič, nie zlodej.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Neskorá jura · bylinožravec
    info: |
      Kentrosaurus bol dlhý asi 4,5 metra a žil v Tanzánii, v Afrike.
      Bol menším príbuzným stegosaura, s platňami na krku a dlhými bodcami na chrbte a chvoste.
      Jeho meno znamená „ostnatý jašter“.
  dino.microraptor:
    label: Mikroraptor
    summary: Raná krieda · mäsožravec
    info: |
      Mikroraptor bol dlhý menej ako 1 meter a žil v Číne.
      Operené krídla mal na predných aj zadných končatinách, takže mal štyri krídla.
      Jeho perie bolo čierne a lesklé ako u vrany.
  dino.protoceratops:
    label: Protoceratops
    summary: Neskorá krieda · bylinožravec
    info: |
      Protoceratops bol dlhý asi 2 metre, veľký ako ovca, a žil v Mongolsku a Číne.
      Mal kostený límec a zobák ako papagáj, ale žiadne skutočné rohy.
      Jedna slávna skamenelina ukazuje protoceratopsa a velociraptora zakliesnených v boji.
