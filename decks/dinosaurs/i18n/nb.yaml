lang: nb
pivot: false
title: Dinosaurer
cards:
  dino.t_rex:
    label: Tyrannosaurus
    summary: Sen kritt · kjøtteter
    info: |
      Tyrannosaurus rex var opptil 12 meter lang og levde i Nord-Amerika.
      Tennene var like store som bananer, og den hadde det sterkeste bittet av alle landdyr.
      Armene var korte, men de var sterke.
  dino.triceratops:
    label: Triceratops
    summary: Sen kritt · planteeter
    info: |
      Triceratops var omtrent 9 meter lang og levde i Nord-Amerika.
      Navnet betyr «ansikt med tre horn», og de to øverste hornene var omtrent en meter lange.
      Den levde på samme tid og på de samme stedene som Tyrannosaurus.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Sen jura · planteeter
    info: |
      Stegosaurus var omtrent 9 meter lang og levde i Nord-Amerika og Portugal.
      Den hadde store plater på ryggen og skarpe pigger på halen.
      Den levde så lenge siden at den er lenger unna T. rex i tid enn vi er.
  dino.brachiosaurus:
    label: Brachiosaurus
    summary: Sen jura · planteeter
    info: |
      Brachiosaurus var omtrent 22 meter lang og levde i Nord-Amerika.
      Forbeina var lengre enn bakbeina, så den nådde blader like høyt oppe som et hus med fire etasjer.
      Navnet betyr «armøgle».
  dino.velociraptor:
    label: Velociraptor
    summary: Sen kritt · kjøtteter
    info: |
      Velociraptor var bare omtrent 2 meter lang, på størrelse med en kalkun, og levde i Mongolia og Kina.
      Den var dekket av fjær, men den kunne ikke fly.
      På hver fot hadde den en stor, krum klo til å fange byttedyr med.
  dino.ankylosaurus:
    label: Ankylosaurus
    summary: Sen kritt · planteeter
    info: |
      Ankylosaurus var omtrent 7 meter lang og levde i Nord-Amerika.
      Ryggen var dekket av en rustning av bein, som en levende stridsvogn.
      Ytterst på halen hadde den en tung beinklubbe som den forsvarte seg med.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Sen kritt · kjøtteter
    info: |
      Spinosaurus var omtrent 14 meter lang, enda lengre enn T. rex, og levde i Nord-Afrika.
      Den hadde et høyt seil på ryggen og levde ved elver, der den fanget fisk.
      De første fossilene av den ble ødelagt under andre verdenskrig.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Sen kritt · planteeter
    info: |
      Parasaurolophus var omtrent 9 meter lang og levde i Nord-Amerika.
      Den hadde en lang, hul kam på hodet og et nebb som en and.
      Ved å blåse luft gjennom kammen kunne den lage høye lyder som en trompet.
  dino.pteranodon:
    label: Pteranodon
    summary: Sen kritt · kjøtteter
    info: |
      Pteranodon var en flygeøgle og ikke en dinosaur, og vingene var opptil 7 meter brede.
      Den levde i Nord-Amerika og fløy over havet for å fange fisk.
      Navnet betyr «vinge uten tenner», fordi nebbet ikke hadde noen tenner.
  dino.diplodocus:
    label: Diplodocus
    summary: Sen jura · planteeter
    info: |
      Diplodocus var omtrent 25 meter lang, like lang som to busser, og levde i Nord-Amerika.
      Det meste av lengden var den svært lange halsen og den tynne, piskeaktige halen.
      Den hadde små, stiftformede tenner som den rev blader av plantene med.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Sen jura · planteeter
    info: |
      Brontosaurus var omtrent 22 meter lang og levde i Nord-Amerika.
      Navnet betyr «tordenøgle», og den veide omtrent like mye som tre elefanter.
      I over 100 år trodde forskerne at den var en Apatosaurus, men i 2015 fikk den sitt eget navn tilbake.
  dino.iguanodon:
    label: Iguanodon
    summary: Tidlig kritt · planteeter
    info: |
      Iguanodon var omtrent 10 meter lang og levde i Europa.
      Den hadde en skarp pigg på hver tommel, som forskerne først trodde var et horn på nesen.
      I 1825 ble den en av de aller første dinosaurene som fikk et navn.
  dino.pachycephalosaurus:
    label: Pachycephalosaurus
    summary: Sen kritt · planteeter
    info: |
      Pachycephalosaurus var omtrent 4,5 meter lang og levde i Nord-Amerika.
      Beinet oppå hodet var opptil 25 centimeter tykt.
      Navnet betyr «tykkhodet øgle».
  dino.archaeopteryx:
    label: Archaeopteryx
    summary: Sen jura · kjøtteter
    info: |
      Archaeopteryx var omtrent like stor som en ravn og levde i det som i dag er Tyskland.
      Den hadde fjær og vinger som en fugl, men også tenner, klør på vingene og en lang hale av bein.
      Den viser at fuglene er dinosaurenes levende slektninger.
  dino.allosaurus:
    label: Allosaurus
    summary: Sen jura · kjøtteter
    info: |
      Allosaurus var omtrent 9 meter lang og levde i Nord-Amerika og Portugal.
      Den var sin tids største jeger og hadde små horn over øynene.
      Et fossil av en Allosaurus har et sår etter den piggete halen til en Stegosaurus.
  dino.mosasaurus:
    label: Mosasaurus
    summary: Sen kritt · kjøtteter
    info: |
      Mosasaurus var et kjempestort havkrypdyr og ikke en dinosaur, omtrent 13 meter lang.
      Den var i slekt med øgler og slanger og måtte opp til overflaten for å puste.
      Det første fossilet ble funnet i Nederland, nær elva Maas.
  dino.plesiosaurus:
    label: Plesiosaurus
    summary: Tidlig jura · kjøtteter
    info: |
      Plesiosaurus var et havkrypdyr og ikke en dinosaur, omtrent 3 meter lang.
      Den hadde lang hals, lite hode og fire store luffer å svømme med.
      Det første hele skjelettet ble funnet i England av fossiljegeren Mary Anning.
  dino.ichthyosaurus:
    label: Ichthyosaurus
    summary: Tidlig jura · kjøtteter
    info: |
      Ichthyosaurus var et havkrypdyr, verken dinosaur eller fisk, omtrent 2 meter lang.
      Den lignet en delfin og hadde svært store øyne for å se i mørkt vann.
      Den la ikke egg, men fødte levende unger i havet.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Tidlig perm · kjøtteter
    info: |
      Dimetrodon var ikke en dinosaur: den levde omtrent 40 millioner år før de første dinosaurene.
      Den var opptil 4 meter lang, hadde et høyt seil på ryggen og levde i Nord-Amerika og Europa.
      Den er nærmere i slekt med pattedyr, som oss, enn med dinosaurer.
  dino.carnotaurus:
    label: Carnotaurus
    summary: Sen kritt · kjøtteter
    info: |
      Carnotaurus var omtrent 8 meter lang og levde i Argentina i Sør-Amerika.
      Navnet betyr «kjøttetende okse», fordi den hadde to horn over øynene.
      Armene var bitte små, enda mindre enn armene til T. rex.
  dino.therizinosaurus:
    label: Therizinosaurus
    summary: Sen kritt · planteeter
    info: |
      Therizinosaurus var omtrent 9 meter lang og levde i Mongolia.
      Klørne var lengre enn en skolelinjal, de lengste klørne hos noe kjent dyr.
      Selv om den var i slekt med T. rex, spiste den planter.
  dino.gallimimus:
    label: Gallimimus
    summary: Sen kritt · alteter
    info: |
      Gallimimus var omtrent 6 meter lang og levde i Mongolia.
      Den lignet en stor struts, med et tannløst nebb og lange bein.
      Den var en av de raskeste løperne blant dinosaurene.
  dino.dilophosaurus:
    label: Dilophosaurus
    summary: Tidlig jura · kjøtteter
    info: |
      Dilophosaurus var omtrent 7 meter lang og levde i Nord-Amerika.
      Den hadde to tynne kammer på hodet, og navnet betyr «øgle med to kammer».
      På film spytter den gift og har en halskrage, men det finnes ingen bevis for noen av delene.
  dino.styracosaurus:
    label: Styracosaurus
    summary: Sen kritt · planteeter
    info: |
      Styracosaurus var omtrent 5,5 meter lang og levde i Canada.
      Lange pigger stakk ut fra beinkragen rundt halsen.
      Den hadde også ett langt horn på nesen, opptil 60 centimeter langt.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Sen kritt · kjøtteter
    info: |
      Quetzalcoatlus var en flygeøgle og ikke en dinosaur, og den levde i Nord-Amerika.
      Vingene var omtrent 10 meter brede, og når den sto på bakken, var den like høy som en sjiraff.
      Den er oppkalt etter Quetzalcoatl, aztekernes fjærkledde slangegud.
  dino.compsognathus:
    label: Compsognathus
    summary: Sen jura · kjøtteter
    info: |
      Compsognathus var bare omtrent 1 meter lang, på størrelse med en høne, og levde i Tyskland og Frankrike.
      Den var en av de minste dinosaurene og løp fort på to bein.
      I ett fossil ligger det fortsatt en liten øgle i magen, dens siste måltid.
  dino.oviraptor:
    label: Oviraptor
    summary: Sen kritt · alteter
    info: |
      Oviraptor var omtrent 2 meter lang, hadde fjær og nebb, og levde i Mongolia.
      Navnet betyr «eggtyv», fordi den ble funnet på et reir med egg.
      Senere fant forskerne ut at eggene var av dens egen art, så den var en omsorgsfull forelder og ikke en tyv.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Sen jura · planteeter
    info: |
      Kentrosaurus var omtrent 4,5 meter lang og levde i Tanzania i Afrika.
      Den var en mindre slektning av Stegosaurus, med plater på halsen og lange pigger på ryggen og halen.
      Navnet betyr «piggete øgle».
  dino.microraptor:
    label: Microraptor
    summary: Tidlig kritt · kjøtteter
    info: |
      Microraptor var under 1 meter lang og levde i Kina.
      Den hadde vinger med fjær på både armene og beina, altså fire vinger.
      Fjærene var svarte og skinnende, som en kråkes.
  dino.protoceratops:
    label: Protoceratops
    summary: Sen kritt · planteeter
    info: |
      Protoceratops var omtrent 2 meter lang, på størrelse med en sau, og levde i Mongolia og Kina.
      Den hadde en beinkrage og et nebb som en papegøye, men ingen ekte horn.
      Et berømt fossil viser en Protoceratops og en Velociraptor som er låst fast i en kamp.
