lang: id
pivot: false
title: Dinosaurus
cards:
  dino.t_rex:
    label: Tyrannosaurus
    summary: Kapur Akhir · pemakan daging
    info: |
      Tyrannosaurus rex panjangnya sampai 12 meter dan hidup di Amerika Utara.
      Giginya sebesar pisang, dan gigitannya paling kuat di antara semua hewan darat.
      Lengannya pendek, tetapi kuat.
  dino.triceratops:
    label: Triceratops
    summary: Kapur Akhir · pemakan tumbuhan
    info: |
      Triceratops panjangnya sekitar 9 meter dan hidup di Amerika Utara.
      Namanya berarti "wajah bertanduk tiga", dan dua tanduk atasnya panjangnya sekitar satu meter.
      Ia hidup pada masa yang sama dan di tempat yang sama dengan Tyrannosaurus.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Jura Akhir · pemakan tumbuhan
    info: |
      Stegosaurus panjangnya sekitar 9 meter dan hidup di Amerika Utara dan Portugal.
      Di punggungnya ada lempeng-lempeng besar, dan di ekornya ada duri-duri tajam.
      Ia hidup begitu lama dulu sehingga jaraknya dari T. rex lebih jauh daripada jarak kita dari T. rex.
  dino.brachiosaurus:
    label: Brachiosaurus
    summary: Jura Akhir · pemakan tumbuhan
    info: |
      Brachiosaurus panjangnya sekitar 22 meter dan hidup di Amerika Utara.
      Kaki depannya lebih panjang daripada kaki belakangnya, jadi ia bisa meraih daun setinggi gedung empat lantai.
      Namanya berarti "kadal lengan".
  dino.velociraptor:
    label: Velociraptor
    summary: Kapur Akhir · pemakan daging
    info: |
      Velociraptor panjangnya hanya sekitar 2 meter, kira-kira sebesar kalkun, dan hidup di Mongolia dan Tiongkok.
      Tubuhnya tertutup bulu, tetapi ia tidak bisa terbang.
      Di setiap kakinya ada cakar besar yang melengkung untuk menangkap mangsa.
  dino.ankylosaurus:
    label: Ankylosaurus
    summary: Kapur Akhir · pemakan tumbuhan
    info: |
      Ankylosaurus panjangnya sekitar 7 meter dan hidup di Amerika Utara.
      Punggungnya tertutup baju zirah dari tulang, seperti tank hidup.
      Di ujung ekornya ada gada tulang yang berat untuk membela diri.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Kapur Akhir · pemakan daging
    info: |
      Spinosaurus panjangnya sekitar 14 meter, bahkan lebih panjang daripada T. rex, dan hidup di Afrika Utara.
      Di punggungnya ada layar yang tinggi, dan ia hidup di dekat sungai untuk menangkap ikan.
      Fosil pertamanya hancur pada masa Perang Dunia Kedua.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Kapur Akhir · pemakan tumbuhan
    info: |
      Parasaurolophus panjangnya sekitar 9 meter dan hidup di Amerika Utara.
      Di kepalanya ada jambul panjang yang berongga, dan paruhnya seperti paruh bebek.
      Dengan meniupkan udara lewat jambulnya, ia bisa membuat suara keras seperti terompet.
  dino.pteranodon:
    label: Pteranodon
    summary: Kapur Akhir · pemakan daging
    info: |
      Pteranodon adalah reptil terbang, bukan dinosaurus, dan lebar sayapnya sampai 7 meter.
      Ia hidup di Amerika Utara dan terbang di atas laut untuk menangkap ikan.
      Namanya berarti "sayap tanpa gigi", karena paruhnya tidak bergigi.
  dino.diplodocus:
    label: Diplodocus
    summary: Jura Akhir · pemakan tumbuhan
    info: |
      Diplodocus panjangnya sekitar 25 meter, sepanjang dua bus, dan hidup di Amerika Utara.
      Sebagian besar panjangnya adalah lehernya yang sangat panjang dan ekornya yang tipis seperti cambuk.
      Giginya kecil seperti pasak untuk melucuti daun dari tanaman.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Jura Akhir · pemakan tumbuhan
    info: |
      Brontosaurus panjangnya sekitar 22 meter dan hidup di Amerika Utara.
      Namanya berarti "kadal guntur", dan beratnya kira-kira sama dengan tiga ekor gajah.
      Selama lebih dari 100 tahun para ilmuwan mengira ia adalah Apatosaurus, tetapi pada tahun 2015 ia mendapatkan namanya kembali.
  dino.iguanodon:
    label: Iguanodon
    summary: Kapur Awal · pemakan tumbuhan
    info: |
      Iguanodon panjangnya sekitar 10 meter dan hidup di Eropa.
      Di setiap ibu jarinya ada duri tajam, yang awalnya dikira para ilmuwan sebagai tanduk di hidungnya.
      Pada tahun 1825 ia menjadi salah satu dinosaurus pertama yang diberi nama.
  dino.pachycephalosaurus:
    label: Pachycephalosaurus
    summary: Kapur Akhir · pemakan tumbuhan
    info: |
      Pachycephalosaurus panjangnya sekitar 4,5 meter dan hidup di Amerika Utara.
      Tulang di atas kepalanya tebalnya sampai 25 sentimeter.
      Namanya berarti "kadal berkepala tebal".
  dino.archaeopteryx:
    label: Archaeopteryx
    summary: Jura Akhir · pemakan daging
    info: |
      Archaeopteryx kira-kira sebesar burung gagak dan hidup di wilayah yang sekarang menjadi Jerman.
      Ia punya bulu dan sayap seperti burung, tetapi juga gigi, cakar di sayapnya, dan ekor bertulang yang panjang.
      Ia menunjukkan bahwa burung adalah kerabat dinosaurus yang masih hidup.
  dino.allosaurus:
    label: Allosaurus
    summary: Jura Akhir · pemakan daging
    info: |
      Allosaurus panjangnya sekitar 9 meter dan hidup di Amerika Utara dan Portugal.
      Ia adalah pemburu terbesar pada masanya dan punya tanduk kecil di atas matanya.
      Ada fosil Allosaurus dengan luka yang dibuat oleh ekor berduri Stegosaurus.
  dino.mosasaurus:
    label: Mosasaurus
    summary: Kapur Akhir · pemakan daging
    info: |
      Mosasaurus adalah reptil laut raksasa, bukan dinosaurus, panjangnya sekitar 13 meter.
      Kerabatnya adalah kadal dan ular, dan ia harus naik ke permukaan untuk menghirup udara.
      Fosil pertamanya ditemukan di Belanda, di dekat Sungai Meuse.
  dino.plesiosaurus:
    label: Plesiosaurus
    summary: Jura Awal · pemakan daging
    info: |
      Plesiosaurus adalah reptil laut, bukan dinosaurus, panjangnya sekitar 3 meter.
      Lehernya panjang, kepalanya kecil, dan ia punya empat sirip besar untuk berenang.
      Kerangka lengkapnya yang pertama ditemukan di Inggris oleh pemburu fosil Mary Anning.
  dino.ichthyosaurus:
    label: Ichthyosaurus
    summary: Jura Awal · pemakan daging
    info: |
      Ichthyosaurus adalah reptil laut, bukan dinosaurus dan bukan ikan, panjangnya sekitar 2 meter.
      Bentuknya seperti lumba-lumba, dan matanya sangat besar untuk melihat di air yang gelap.
      Ia melahirkan bayinya di laut, bukan bertelur.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Perm Awal · pemakan daging
    info: |
      Dimetrodon bukan dinosaurus: ia hidup sekitar 40 juta tahun sebelum dinosaurus pertama.
      Panjangnya sampai 4 meter, di punggungnya ada layar yang tinggi, dan ia hidup di Amerika Utara dan Eropa.
      Ia lebih dekat kekerabatannya dengan mamalia, seperti kita, daripada dengan dinosaurus.
  dino.carnotaurus:
    label: Carnotaurus
    summary: Kapur Akhir · pemakan daging
    info: |
      Carnotaurus panjangnya sekitar 8 meter dan hidup di Argentina, di Amerika Selatan.
      Namanya berarti "banteng pemakan daging", karena ia punya dua tanduk di atas matanya.
      Lengannya sangat kecil, bahkan lebih kecil daripada lengan T. rex.
  dino.therizinosaurus:
    label: Therizinosaurus
    summary: Kapur Akhir · pemakan tumbuhan
    info: |
      Therizinosaurus panjangnya sekitar 9 meter dan hidup di Mongolia.
      Cakarnya lebih panjang daripada penggaris sekolah, cakar terpanjang dari semua hewan yang kita kenal.
      Walaupun berkerabat dengan T. rex, ia makan tumbuhan.
  dino.gallimimus:
    label: Gallimimus
    summary: Kapur Akhir · pemakan segala
    info: |
      Gallimimus panjangnya sekitar 6 meter dan hidup di Mongolia.
      Bentuknya seperti burung unta besar, dengan paruh tanpa gigi dan kaki yang panjang.
      Ia adalah salah satu pelari tercepat di antara para dinosaurus.
  dino.dilophosaurus:
    label: Dilophosaurus
    summary: Jura Awal · pemakan daging
    info: |
      Dilophosaurus panjangnya sekitar 7 meter dan hidup di Amerika Utara.
      Di kepalanya ada dua jambul tipis, dan namanya berarti "kadal berjambul dua".
      Di film ia menyemburkan bisa dan punya kerah di lehernya, tetapi tidak ada bukti untuk keduanya.
  dino.styracosaurus:
    label: Styracosaurus
    summary: Kapur Akhir · pemakan tumbuhan
    info: |
      Styracosaurus panjangnya sekitar 5,5 meter dan hidup di Kanada.
      Duri-duri panjang mencuat dari kerah tulang di sekeliling lehernya.
      Ia juga punya satu tanduk panjang di hidungnya, panjangnya sampai 60 sentimeter.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Kapur Akhir · pemakan daging
    info: |
      Quetzalcoatlus adalah reptil terbang, bukan dinosaurus, dan hidup di Amerika Utara.
      Lebar sayapnya sekitar 10 meter, dan saat berdiri di tanah tingginya sama dengan jerapah.
      Namanya diambil dari Quetzalcoatl, dewa ular berbulu bangsa Aztek.
  dino.compsognathus:
    label: Compsognathus
    summary: Jura Akhir · pemakan daging
    info: |
      Compsognathus panjangnya hanya sekitar 1 meter, kira-kira sebesar ayam, dan hidup di Jerman dan Prancis.
      Ia adalah salah satu dinosaurus terkecil dan berlari cepat dengan dua kaki.
      Di perut salah satu fosilnya masih ada seekor kadal kecil, makanan terakhirnya.
  dino.oviraptor:
    label: Oviraptor
    summary: Kapur Akhir · pemakan segala
    info: |
      Oviraptor panjangnya sekitar 2 meter, punya bulu dan paruh, dan hidup di Mongolia.
      Namanya berarti "pencuri telur", karena ia ditemukan di atas sarang berisi telur.
      Kemudian para ilmuwan mengetahui bahwa telur itu milik jenisnya sendiri, jadi ia adalah induk yang penyayang, bukan pencuri.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Jura Akhir · pemakan tumbuhan
    info: |
      Kentrosaurus panjangnya sekitar 4,5 meter dan hidup di Tanzania, di Afrika.
      Ia adalah kerabat Stegosaurus yang lebih kecil, dengan lempeng di lehernya dan duri panjang di punggung dan ekornya.
      Namanya berarti "kadal berduri".
  dino.microraptor:
    label: Microraptor
    summary: Kapur Awal · pemakan daging
    info: |
      Microraptor panjangnya kurang dari 1 meter dan hidup di Tiongkok.
      Ia punya sayap berbulu di lengan dan juga di kakinya, jadi sayapnya ada empat.
      Bulunya hitam dan mengilap, seperti bulu burung gagak.
  dino.protoceratops:
    label: Protoceratops
    summary: Kapur Akhir · pemakan tumbuhan
    info: |
      Protoceratops panjangnya sekitar 2 meter, kira-kira sebesar domba, dan hidup di Mongolia dan Tiongkok.
      Ia punya kerah tulang dan paruh seperti burung beo, tetapi tidak punya tanduk sungguhan.
      Ada fosil terkenal yang menunjukkan Protoceratops dan Velociraptor sedang bertarung.
