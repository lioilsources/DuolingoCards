lang: tr
pivot: false
title: Dinozorlar
cards:
  dino.t_rex:
    label: Tyrannosaurus
    summary: Geç Kretase · etçil
    info: |
      Tyrannosaurus rex 12 metreye kadar uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Dişleri muz kadar büyüktü ve karada yaşayan hayvanlar arasında en güçlü ısırığa sahipti.
      Kolları kısaydı ama güçlüydü.
  dino.triceratops:
    label: Triceratops
    summary: Geç Kretase · otçul
    info: |
      Triceratops yaklaşık 9 metre uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Adı "üç boynuzlu yüz" demektir; üstteki iki boynuzu yaklaşık bir metre uzunluktaydı.
      Tyrannosaurus ile aynı zamanda ve aynı yerlerde yaşadı.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Geç Jura · otçul
    info: |
      Stegosaurus yaklaşık 9 metre uzunluktaydı ve Kuzey Amerika'da ve Portekiz'de yaşardı.
      Sırtında büyük plakalar, kuyruğunda sivri dikenler vardı.
      O kadar uzun zaman önce yaşadı ki T. rex'e zaman olarak bizden daha uzaktır.
  dino.brachiosaurus:
    label: Brachiosaurus
    summary: Geç Jura · otçul
    info: |
      Brachiosaurus yaklaşık 22 metre uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Ön bacakları arka bacaklarından uzundu, bu yüzden dört katlı bir bina yüksekliğindeki yapraklara uzanabilirdi.
      Adı "kol kertenkelesi" demektir.
  dino.velociraptor:
    label: Velociraptor
    summary: Geç Kretase · etçil
    info: |
      Velociraptor yalnızca yaklaşık 2 metre uzunluktaydı, yani bir hindi büyüklüğündeydi; Moğolistan'da ve Çin'de yaşardı.
      Vücudu tüylerle kaplıydı ama uçamazdı.
      Her ayağında avını yakalamak için büyük, kıvrık bir pençe vardı.
  dino.ankylosaurus:
    label: Ankylosaurus
    summary: Geç Kretase · otçul
    info: |
      Ankylosaurus yaklaşık 7 metre uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Sırtı kemikten bir zırhla kaplıydı, tıpkı canlı bir tank gibi.
      Kuyruğunun ucunda kendini korumak için ağır, kemikten bir topuz vardı.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Geç Kretase · etçil
    info: |
      Spinosaurus yaklaşık 14 metre uzunluktaydı, yani T. rex'ten bile uzundu; Kuzey Afrika'da yaşardı.
      Sırtında yüksek bir yelken vardı ve balık yakaladığı nehirlerin yakınında yaşardı.
      İlk fosilleri İkinci Dünya Savaşı sırasında yok oldu.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Geç Kretase · otçul
    info: |
      Parasaurolophus yaklaşık 9 metre uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Başında uzun, içi boş bir ibik ve ördeğinkine benzeyen bir gaga vardı.
      İbiğinden hava üfleyerek trompet gibi yüksek sesler çıkarabilirdi.
  dino.pteranodon:
    label: Pteranodon
    summary: Geç Kretase · etçil
    info: |
      Pteranodon bir dinozor değil, uçan bir sürüngendi; kanatlarının açıklığı 7 metreye kadar ulaşırdı.
      Kuzey Amerika'da yaşardı ve balık yakalamak için denizin üzerinde uçardı.
      Adı "dişsiz kanat" demektir, çünkü gagasında hiç diş yoktu.
  dino.diplodocus:
    label: Diplodocus
    summary: Geç Jura · otçul
    info: |
      Diplodocus yaklaşık 25 metre uzunluktaydı, yani iki otobüs kadar; Kuzey Amerika'da yaşardı.
      Boyunun büyük kısmını çok uzun boynu ve ince, kamçı gibi kuyruğu oluşturuyordu.
      Bitkilerden yaprak sıyırmak için küçük, çubuk gibi dişleri vardı.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Geç Jura · otçul
    info: |
      Brontosaurus yaklaşık 22 metre uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Adı "gök gürültüsü kertenkelesi" demektir ve yaklaşık üç fil kadar ağırdı.
      Bilim insanları 100 yıldan uzun süre onun Apatosaurus olduğunu düşündü, ama 2015'te kendi adını geri aldı.
  dino.iguanodon:
    label: Iguanodon
    summary: Erken Kretase · otçul
    info: |
      Iguanodon yaklaşık 10 metre uzunluktaydı ve Avrupa'da yaşardı.
      Her başparmağında sivri bir diken vardı; bilim insanları önce bunun burnundaki bir boynuz olduğunu sandı.
      1825'te ad verilen ilk dinozorlardan biri oldu.
  dino.pachycephalosaurus:
    label: Pachycephalosaurus
    summary: Geç Kretase · otçul
    info: |
      Pachycephalosaurus yaklaşık 4,5 metre uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Başının üstündeki kemik 25 santimetreye kadar kalındı.
      Adı "kalın kafalı kertenkele" demektir.
  dino.archaeopteryx:
    label: Archaeopteryx
    summary: Geç Jura · etçil
    info: |
      Archaeopteryx bir kuzgun büyüklüğündeydi ve bugünkü Almanya'nın bulunduğu yerde yaşardı.
      Bir kuş gibi tüyleri ve kanatları vardı, ama dişleri, kanatlarında pençeleri ve uzun, kemikli bir kuyruğu da vardı.
      Kuşların dinozorların yaşayan akrabaları olduğunu gösterir.
  dino.allosaurus:
    label: Allosaurus
    summary: Geç Jura · etçil
    info: |
      Allosaurus yaklaşık 9 metre uzunluktaydı ve Kuzey Amerika'da ve Portekiz'de yaşardı.
      Zamanının en büyük avcısıydı ve gözlerinin üstünde küçük boynuzları vardı.
      Bir Allosaurus fosilinde, bir Stegosaurus'un dikenli kuyruğunun açtığı bir yara var.
  dino.mosasaurus:
    label: Mosasaurus
    summary: Geç Kretase · etçil
    info: |
      Mosasaurus bir dinozor değil, yaklaşık 13 metre uzunluğunda dev bir deniz sürüngeniydi.
      Akrabaları kertenkeleler ve yılanlardır; hava solumak için su yüzüne çıkması gerekirdi.
      İlk fosili Hollanda'da, Maas Nehri'nin yakınında bulundu.
  dino.plesiosaurus:
    label: Plesiosaurus
    summary: Erken Jura · etçil
    info: |
      Plesiosaurus bir dinozor değil, yaklaşık 3 metre uzunluğunda bir deniz sürüngeniydi.
      Uzun bir boynu, küçük bir başı ve yüzmek için dört büyük yüzgeci vardı.
      İlk tam iskeleti İngiltere'de fosil avcısı Mary Anning tarafından bulundu.
  dino.ichthyosaurus:
    label: Ichthyosaurus
    summary: Erken Jura · etçil
    info: |
      Ichthyosaurus ne bir dinozor ne de bir balıktı; yaklaşık 2 metre uzunluğunda bir deniz sürüngeniydi.
      Bir yunusa benziyordu ve karanlık suda görebilmek için çok büyük gözleri vardı.
      Yumurta bırakmak yerine denizde canlı yavru doğururdu.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Erken Permiyen · etçil
    info: |
      Dimetrodon bir dinozor değildi: ilk dinozorlardan yaklaşık 40 milyon yıl önce yaşadı.
      4 metreye kadar uzunluktaydı, sırtında yüksek bir yelken vardı ve Kuzey Amerika'da ve Avrupa'da yaşardı.
      Dinozorlardan çok, bizim gibi memelilere daha yakın akrabadır.
  dino.carnotaurus:
    label: Carnotaurus
    summary: Geç Kretase · etçil
    info: |
      Carnotaurus yaklaşık 8 metre uzunluktaydı ve Güney Amerika'da, Arjantin'de yaşardı.
      Adı "et yiyen boğa" demektir, çünkü gözlerinin üstünde iki boynuzu vardı.
      Kolları minicikti, T. rex'inkilerden bile küçüktü.
  dino.therizinosaurus:
    label: Therizinosaurus
    summary: Geç Kretase · otçul
    info: |
      Therizinosaurus yaklaşık 9 metre uzunluktaydı ve Moğolistan'da yaşardı.
      Pençeleri bir okul cetvelinden uzundu; bilinen bütün hayvanlar arasında en uzun pençeler onundu.
      T. rex'in akrabası olmasına rağmen bitki yerdi.
  dino.gallimimus:
    label: Gallimimus
    summary: Geç Kretase · hepçil
    info: |
      Gallimimus yaklaşık 6 metre uzunluktaydı ve Moğolistan'da yaşardı.
      Dişsiz gagası ve uzun bacaklarıyla büyük bir devekuşuna benzerdi.
      Dinozorlar arasındaki en hızlı koşuculardan biriydi.
  dino.dilophosaurus:
    label: Dilophosaurus
    summary: Erken Jura · etçil
    info: |
      Dilophosaurus yaklaşık 7 metre uzunluktaydı ve Kuzey Amerika'da yaşardı.
      Başında iki ince ibik vardı; adı "iki ibikli kertenkele" demektir.
      Filmlerde zehir tükürür ve boynunda bir yaka vardır, ama bunların hiçbirinin kanıtı yoktur.
  dino.styracosaurus:
    label: Styracosaurus
    summary: Geç Kretase · otçul
    info: |
      Styracosaurus yaklaşık 5,5 metre uzunluktaydı ve Kanada'da yaşardı.
      Boynunun çevresindeki kemik yakadan uzun dikenler çıkıyordu.
      Burnunda da 60 santimetreye kadar uzayan tek bir uzun boynuz vardı.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Geç Kretase · etçil
    info: |
      Quetzalcoatlus bir dinozor değil, uçan bir sürüngendi ve Kuzey Amerika'da yaşardı.
      Kanatlarının açıklığı yaklaşık 10 metreydi; yerde dururken bir zürafa kadar uzundu.
      Adını Azteklerin tüylü yılan tanrısı Quetzalcoatl'dan aldı.
  dino.compsognathus:
    label: Compsognathus
    summary: Geç Jura · etçil
    info: |
      Compsognathus yalnızca yaklaşık 1 metre uzunluktaydı, yani bir tavuk büyüklüğündeydi; Almanya'da ve Fransa'da yaşardı.
      En küçük dinozorlardan biriydi ve iki ayağı üstünde hızla koşardı.
      Bir fosilin midesinde hâlâ küçük bir kertenkele, yani son yemeği duruyor.
  dino.oviraptor:
    label: Oviraptor
    summary: Geç Kretase · hepçil
    info: |
      Oviraptor yaklaşık 2 metre uzunluktaydı, tüyleri ve gagası vardı; Moğolistan'da yaşardı.
      Adı "yumurta hırsızı" demektir, çünkü bir yumurta yuvasının üstünde bulundu.
      Sonra bilim insanları yumurtaların kendi türüne ait olduğunu anladı; yani hırsız değil, şefkatli bir ebeveyndi.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Geç Jura · otçul
    info: |
      Kentrosaurus yaklaşık 4,5 metre uzunluktaydı ve Afrika'da, Tanzanya'da yaşardı.
      Stegosaurus'un daha küçük bir akrabasıydı; boynunda plakalar, sırtında ve kuyruğunda uzun dikenler vardı.
      Adı "dikenli kertenkele" demektir.
  dino.microraptor:
    label: Microraptor
    summary: Erken Kretase · etçil
    info: |
      Microraptor 1 metreden kısaydı ve Çin'de yaşardı.
      Hem kollarında hem bacaklarında tüylü kanatlar vardı, yani dört kanatlıydı.
      Tüyleri bir kargınınki gibi siyah ve parlaktı.
  dino.protoceratops:
    label: Protoceratops
    summary: Geç Kretase · otçul
    info: |
      Protoceratops yaklaşık 2 metre uzunluktaydı, yani bir koyun büyüklüğündeydi; Moğolistan'da ve Çin'de yaşardı.
      Kemikten bir yakası ve papağanınkine benzeyen bir gagası vardı, ama gerçek boynuzları yoktu.
      Ünlü bir fosil, birbiriyle dövüşürken kalakalmış bir Protoceratops ile bir Velociraptor'u gösterir.
