lang: el
pivot: false
title: Δεινόσαυροι
cards:
  dino.t_rex:
    label: Τυραννόσαυρος
    summary: Ύστερο Κρητιδικό · σαρκοφάγο
    info: |
      Ο τυραννόσαυρος ρεξ είχε μήκος έως 12 μέτρα και ζούσε στη Βόρεια Αμερική.
      Τα δόντια του ήταν μεγάλα σαν μπανάνες και είχε το πιο δυνατό δάγκωμα από όλα τα ζώα της ξηράς.
      Τα χέρια του ήταν κοντά, αλλά δυνατά.
  dino.triceratops:
    label: Τρικεράτωψ
    summary: Ύστερο Κρητιδικό · φυτοφάγο
    info: |
      Ο τρικεράτωψ είχε μήκος περίπου 9 μέτρα και ζούσε στη Βόρεια Αμερική.
      Το όνομά του σημαίνει «πρόσωπο με τρία κέρατα» και τα δύο πάνω κέρατά του είχαν μήκος περίπου ένα μέτρο.
      Ζούσε την ίδια εποχή και στα ίδια μέρη με τον τυραννόσαυρο.
  dino.stegosaurus:
    label: Στεγόσαυρος
    summary: Ύστερο Ιουρασικό · φυτοφάγο
    info: |
      Ο στεγόσαυρος είχε μήκος περίπου 9 μέτρα και ζούσε στη Βόρεια Αμερική και στην Πορτογαλία.
      Είχε μεγάλες πλάκες στην πλάτη και αιχμηρά αγκάθια στην ουρά.
      Έζησε τόσο παλιά, που απέχει χρονικά από τον τυραννόσαυρο περισσότερο απ' ό,τι εμείς.
  dino.brachiosaurus:
    label: Βραχιόσαυρος
    summary: Ύστερο Ιουρασικό · φυτοφάγο
    info: |
      Ο βραχιόσαυρος είχε μήκος περίπου 22 μέτρα και ζούσε στη Βόρεια Αμερική.
      Τα μπροστινά του πόδια ήταν πιο μακριά από τα πίσω, γι' αυτό έφτανε φύλλα τόσο ψηλά όσο ένα τετραώροφο κτίριο.
      Το όνομά του σημαίνει «σαύρα με χέρια».
  dino.velociraptor:
    label: Βελοσιράπτορας
    summary: Ύστερο Κρητιδικό · σαρκοφάγο
    info: |
      Ο βελοσιράπτορας είχε μήκος μόνο περίπου 2 μέτρα, περίπου όσο μια γαλοπούλα, και ζούσε στη Μογγολία και στην Κίνα.
      Ήταν σκεπασμένος με φτερά, αλλά δεν μπορούσε να πετάξει.
      Σε κάθε πόδι είχε ένα μεγάλο κυρτό νύχι για να πιάνει τη λεία του.
  dino.ankylosaurus:
    label: Αγκυλόσαυρος
    summary: Ύστερο Κρητιδικό · φυτοφάγο
    info: |
      Ο αγκυλόσαυρος είχε μήκος περίπου 7 μέτρα και ζούσε στη Βόρεια Αμερική.
      Η πλάτη του ήταν σκεπασμένη με κοκάλινη πανοπλία, σαν ζωντανό τανκ.
      Στην άκρη της ουράς του είχε ένα βαρύ κοκάλινο ρόπαλο για να αμύνεται.
  dino.spinosaurus:
    label: Σπινόσαυρος
    summary: Ύστερο Κρητιδικό · σαρκοφάγο
    info: |
      Ο σπινόσαυρος είχε μήκος περίπου 14 μέτρα, ακόμα πιο μακρύς από τον τυραννόσαυρο, και ζούσε στη Βόρεια Αφρική.
      Είχε ένα ψηλό πανί στην πλάτη και ζούσε κοντά σε ποτάμια, όπου έπιανε ψάρια.
      Τα πρώτα του απολιθώματα καταστράφηκαν στον Δεύτερο Παγκόσμιο Πόλεμο.
  dino.parasaurolophus:
    label: Παρασαυρόλοφος
    summary: Ύστερο Κρητιδικό · φυτοφάγο
    info: |
      Ο παρασαυρόλοφος είχε μήκος περίπου 9 μέτρα και ζούσε στη Βόρεια Αμερική.
      Είχε ένα μακρύ κούφιο λοφίο στο κεφάλι και ράμφος σαν της πάπιας.
      Φυσώντας αέρα μέσα από το λοφίο του, έβγαζε δυνατούς ήχους σαν τρομπέτα.
  dino.pteranodon:
    label: Πτερανόδοντας
    summary: Ύστερο Κρητιδικό · σαρκοφάγο
    info: |
      Ο πτερανόδοντας ήταν ιπτάμενο ερπετό, όχι δεινόσαυρος, και τα φτερά του είχαν άνοιγμα έως 7 μέτρα.
      Ζούσε στη Βόρεια Αμερική και πετούσε πάνω από τη θάλασσα για να πιάνει ψάρια.
      Το όνομά του σημαίνει «φτερό χωρίς δόντια», γιατί είχε ράμφος χωρίς δόντια.
  dino.diplodocus:
    label: Διπλόδοκος
    summary: Ύστερο Ιουρασικό · φυτοφάγο
    info: |
      Ο διπλόδοκος είχε μήκος περίπου 25 μέτρα, όσο δύο λεωφορεία, και ζούσε στη Βόρεια Αμερική.
      Το μεγαλύτερο μέρος του μήκους του ήταν ο πολύ μακρύς λαιμός και η λεπτή ουρά του, σαν μαστίγιο.
      Είχε μικρά δόντια σαν πασσαλάκια για να ξεκολλάει φύλλα από τα φυτά.
  dino.brontosaurus:
    label: Βροντόσαυρος
    summary: Ύστερο Ιουρασικό · φυτοφάγο
    info: |
      Ο βροντόσαυρος είχε μήκος περίπου 22 μέτρα και ζούσε στη Βόρεια Αμερική.
      Το όνομά του σημαίνει «σαύρα της βροντής» και ζύγιζε περίπου όσο τρεις ελέφαντες.
      Για πάνω από 100 χρόνια οι επιστήμονες πίστευαν ότι ήταν απατόσαυρος, αλλά το 2015 πήρε πίσω το δικό του όνομα.
  dino.iguanodon:
    label: Ιγκουανόδοντας
    summary: Πρώιμο Κρητιδικό · φυτοφάγο
    info: |
      Ο ιγκουανόδοντας είχε μήκος περίπου 10 μέτρα και ζούσε στην Ευρώπη.
      Είχε ένα αιχμηρό αγκάθι σε κάθε αντίχειρα, που οι επιστήμονες αρχικά νόμιζαν ότι ήταν κέρατο στη μύτη του.
      Το 1825 έγινε ένας από τους πρώτους δεινόσαυρους που πήραν όνομα.
  dino.pachycephalosaurus:
    label: Παχυκεφαλόσαυρος
    summary: Ύστερο Κρητιδικό · φυτοφάγο
    info: |
      Ο παχυκεφαλόσαυρος είχε μήκος περίπου 4,5 μέτρα και ζούσε στη Βόρεια Αμερική.
      Το κόκαλο στην κορυφή του κεφαλιού του είχε πάχος έως 25 εκατοστά.
      Το όνομά του σημαίνει «σαύρα με χοντρό κεφάλι».
  dino.archaeopteryx:
    label: Αρχαιοπτέρυξ
    summary: Ύστερο Ιουρασικό · σαρκοφάγο
    info: |
      Η αρχαιοπτέρυξ είχε περίπου το μέγεθος ενός κόρακα και ζούσε εκεί που σήμερα είναι η Γερμανία.
      Είχε φτερά και φτερούγες σαν πουλί, αλλά και δόντια, νύχια στις φτερούγες και μακριά κοκάλινη ουρά.
      Δείχνει ότι τα πουλιά είναι οι ζωντανοί συγγενείς των δεινοσαύρων.
  dino.allosaurus:
    label: Αλλόσαυρος
    summary: Ύστερο Ιουρασικό · σαρκοφάγο
    info: |
      Ο αλλόσαυρος είχε μήκος περίπου 9 μέτρα και ζούσε στη Βόρεια Αμερική και στην Πορτογαλία.
      Ήταν ο μεγαλύτερος κυνηγός της εποχής του και είχε μικρά κέρατα πάνω από τα μάτια.
      Ένα απολίθωμα αλλόσαυρου έχει μια πληγή από την αγκαθωτή ουρά ενός στεγόσαυρου.
  dino.mosasaurus:
    label: Μοσάσαυρος
    summary: Ύστερο Κρητιδικό · σαρκοφάγο
    info: |
      Ο μοσάσαυρος ήταν ένα γιγάντιο θαλάσσιο ερπετό, όχι δεινόσαυρος, με μήκος περίπου 13 μέτρα.
      Συγγενείς του είναι οι σαύρες και τα φίδια, και έπρεπε να βγαίνει στην επιφάνεια για να αναπνέει αέρα.
      Το πρώτο του απολίθωμα βρέθηκε στην Ολλανδία, κοντά στον ποταμό Μόζα.
  dino.plesiosaurus:
    label: Πλησιόσαυρος
    summary: Πρώιμο Ιουρασικό · σαρκοφάγο
    info: |
      Ο πλησιόσαυρος ήταν θαλάσσιο ερπετό, όχι δεινόσαυρος, με μήκος περίπου 3 μέτρα.
      Είχε μακρύ λαιμό, μικρό κεφάλι και τέσσερα μεγάλα πτερύγια για κολύμπι.
      Ο πρώτος ολόκληρος σκελετός του βρέθηκε στην Αγγλία από την κυνηγό απολιθωμάτων Μέρι Άνινγκ.
  dino.ichthyosaurus:
    label: Ιχθυόσαυρος
    summary: Πρώιμο Ιουρασικό · σαρκοφάγο
    info: |
      Ο ιχθυόσαυρος ήταν θαλάσσιο ερπετό, ούτε δεινόσαυρος ούτε ψάρι, με μήκος περίπου 2 μέτρα.
      Έμοιαζε με δελφίνι και είχε πολύ μεγάλα μάτια για να βλέπει στο σκοτεινό νερό.
      Γεννούσε ζωντανά μωρά μέσα στη θάλασσα αντί να κάνει αυγά.
  dino.dimetrodon:
    label: Διμετρόδοντας
    summary: Πρώιμο Πέρμιο · σαρκοφάγο
    info: |
      Ο διμετρόδοντας δεν ήταν δεινόσαυρος: έζησε περίπου 40 εκατομμύρια χρόνια πριν από τους πρώτους δεινόσαυρους.
      Είχε μήκος έως 4 μέτρα, ένα ψηλό πανί στην πλάτη και ζούσε στη Βόρεια Αμερική και στην Ευρώπη.
      Είναι πιο κοντινός συγγενής των θηλαστικών, όπως εμείς, παρά των δεινοσαύρων.
  dino.carnotaurus:
    label: Καρνόταυρος
    summary: Ύστερο Κρητιδικό · σαρκοφάγο
    info: |
      Ο καρνόταυρος είχε μήκος περίπου 8 μέτρα και ζούσε στην Αργεντινή, στη Νότια Αμερική.
      Το όνομά του σημαίνει «σαρκοφάγος ταύρος», γιατί είχε δύο κέρατα πάνω από τα μάτια.
      Τα χέρια του ήταν μικροσκοπικά, ακόμα μικρότερα από του τυραννόσαυρου.
  dino.therizinosaurus:
    label: Θεριζινόσαυρος
    summary: Ύστερο Κρητιδικό · φυτοφάγο
    info: |
      Ο θεριζινόσαυρος είχε μήκος περίπου 9 μέτρα και ζούσε στη Μογγολία.
      Τα νύχια του ήταν πιο μακριά από έναν σχολικό χάρακα, τα πιο μακριά νύχια από κάθε γνωστό ζώο.
      Αν και ήταν συγγενής του τυραννόσαυρου, έτρωγε φυτά.
  dino.gallimimus:
    label: Γαλλιμίμος
    summary: Ύστερο Κρητιδικό · παμφάγο
    info: |
      Ο γαλλιμίμος είχε μήκος περίπου 6 μέτρα και ζούσε στη Μογγολία.
      Έμοιαζε με μεγάλη στρουθοκάμηλο, με ράμφος χωρίς δόντια και μακριά πόδια.
      Ήταν ένας από τους πιο γρήγορους δρομείς ανάμεσα στους δεινόσαυρους.
  dino.dilophosaurus:
    label: Διλοφόσαυρος
    summary: Πρώιμο Ιουρασικό · σαρκοφάγο
    info: |
      Ο διλοφόσαυρος είχε μήκος περίπου 7 μέτρα και ζούσε στη Βόρεια Αμερική.
      Είχε δύο λεπτά λοφία στο κεφάλι και το όνομά του σημαίνει «σαύρα με δύο λοφία».
      Στις ταινίες φτύνει δηλητήριο και έχει γιακά στον λαιμό, αλλά δεν υπάρχει απόδειξη για κανένα από τα δύο.
  dino.styracosaurus:
    label: Στυρακόσαυρος
    summary: Ύστερο Κρητιδικό · φυτοφάγο
    info: |
      Ο στυρακόσαυρος είχε μήκος περίπου 5,5 μέτρα και ζούσε στον Καναδά.
      Μακριά αγκάθια ξεπρόβαλλαν από τον κοκάλινο γιακά γύρω από τον λαιμό του.
      Είχε επίσης ένα μακρύ κέρατο στη μύτη, μήκους έως 60 εκατοστών.
  dino.quetzalcoatlus:
    label: Κετσαλκόατλος
    summary: Ύστερο Κρητιδικό · σαρκοφάγο
    info: |
      Ο κετσαλκόατλος ήταν ιπτάμενο ερπετό, όχι δεινόσαυρος, και ζούσε στη Βόρεια Αμερική.
      Τα φτερά του είχαν άνοιγμα περίπου 10 μέτρα και, όταν στεκόταν στο έδαφος, ήταν ψηλός όσο μια καμηλοπάρδαλη.
      Πήρε το όνομά του από τον Κετσαλκόατλ, τον φτερωτό θεό-φίδι των Αζτέκων.
  dino.compsognathus:
    label: Κομψόγναθος
    summary: Ύστερο Ιουρασικό · σαρκοφάγο
    info: |
      Ο κομψόγναθος είχε μήκος μόνο περίπου 1 μέτρο, περίπου όσο μια κότα, και ζούσε στη Γερμανία και στη Γαλλία.
      Ήταν ένας από τους πιο μικρούς δεινόσαυρους και έτρεχε γρήγορα στα δύο πόδια.
      Ένα απολίθωμα έχει ακόμα μια μικρή σαύρα στο στομάχι του, το τελευταίο του γεύμα.
  dino.oviraptor:
    label: Ωβιράπτορας
    summary: Ύστερο Κρητιδικό · παμφάγο
    info: |
      Ο ωβιράπτορας είχε μήκος περίπου 2 μέτρα, είχε φτερά και ράμφος, και ζούσε στη Μογγολία.
      Το όνομά του σημαίνει «κλέφτης αυγών», γιατί βρέθηκε πάνω σε μια φωλιά με αυγά.
      Αργότερα οι επιστήμονες ανακάλυψαν ότι τα αυγά ήταν του δικού του είδους, άρα ήταν στοργικός γονιός και όχι κλέφτης.
  dino.kentrosaurus:
    label: Κεντρόσαυρος
    summary: Ύστερο Ιουρασικό · φυτοφάγο
    info: |
      Ο κεντρόσαυρος είχε μήκος περίπου 4,5 μέτρα και ζούσε στην Τανζανία, στην Αφρική.
      Ήταν ένας μικρότερος συγγενής του στεγόσαυρου, με πλάκες στον λαιμό και μακριά αγκάθια στην πλάτη και στην ουρά.
      Το όνομά του σημαίνει «αγκαθωτή σαύρα».
  dino.microraptor:
    label: Μικροράπτορας
    summary: Πρώιμο Κρητιδικό · σαρκοφάγο
    info: |
      Ο μικροράπτορας είχε μήκος λιγότερο από 1 μέτρο και ζούσε στην Κίνα.
      Είχε φτερωτές φτερούγες και στα χέρια και στα πόδια του, δηλαδή είχε τέσσερις φτερούγες.
      Τα φτερά του ήταν μαύρα και γυαλιστερά, σαν της κουρούνας.
  dino.protoceratops:
    label: Πρωτοκεράτωψ
    summary: Ύστερο Κρητιδικό · φυτοφάγο
    info: |
      Ο πρωτοκεράτωψ είχε μήκος περίπου 2 μέτρα, περίπου όσο ένα πρόβατο, και ζούσε στη Μογγολία και στην Κίνα.
      Είχε κοκάλινο γιακά και ράμφος σαν παπαγάλου, αλλά όχι πραγματικά κέρατα.
      Ένα διάσημο απολίθωμα δείχνει έναν πρωτοκεράτωπα και έναν βελοσιράπτορα πιασμένους σε μάχη.
