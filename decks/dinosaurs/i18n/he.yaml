lang: he
pivot: false
title: דינוזאורים
cards:
  dino.t_rex:
    label: טירנוזאורוס
    summary: קרטיקון מאוחר · טורף
    info: |
      הטירנוזאורוס רקס הגיע לאורך של עד 12 מטרים וחי בצפון אמריקה.
      השיניים שלו היו גדולות כמו בננות, והייתה לו הנשיכה החזקה ביותר מכל בעלי החיים ביבשה.
      הידיים שלו היו קצרות, אבל חזקות.
  dino.triceratops:
    label: טריצרטופס
    summary: קרטיקון מאוחר · אוכל צמחים
    info: |
      הטריצרטופס היה באורך של כ־9 מטרים וחי בצפון אמריקה.
      שמו פירושו "פנים עם שלוש קרניים", ושתי הקרניים העליונות שלו היו באורך של כמטר.
      הוא חי באותה תקופה ובאותם מקומות כמו הטירנוזאורוס.
  dino.stegosaurus:
    label: סטגוזאורוס
    summary: יורה מאוחר · אוכל צמחים
    info: |
      הסטגוזאורוס היה באורך של כ־9 מטרים וחי בצפון אמריקה ובפורטוגל.
      היו לו לוחות גדולים על הגב וקוצים חדים בזנב.
      הוא חי לפני כל כך הרבה זמן, שהוא רחוק בזמן מהטירנוזאורוס יותר מאיתנו.
  dino.brachiosaurus:
    label: ברכיוזאורוס
    summary: יורה מאוחר · אוכל צמחים
    info: |
      הברכיוזאורוס היה באורך של כ־22 מטרים וחי בצפון אמריקה.
      הרגליים הקדמיות שלו היו ארוכות מהאחוריות, ולכן הוא הגיע לעלים בגובה של בניין בן ארבע קומות.
      שמו פירושו "לטאת זרוע".
  dino.velociraptor:
    label: ולוצירפטור
    summary: קרטיקון מאוחר · טורף
    info: |
      הוולוצירפטור היה באורך של כ־2 מטרים בלבד, בערך בגודל של תרנגול הודו, וחי במונגוליה ובסין.
      הגוף שלו היה מכוסה נוצות, אבל הוא לא יכול היה לעוף.
      בכל רגל היה לו טופר גדול ומעוקל לתפיסת טרף.
  dino.ankylosaurus:
    label: אנקילוזאורוס
    summary: קרטיקון מאוחר · אוכל צמחים
    info: |
      האנקילוזאורוס היה באורך של כ־7 מטרים וחי בצפון אמריקה.
      הגב שלו היה מכוסה בשריון של עצם, כמו טנק חי.
      בקצה הזנב הייתה לו אלה כבדה של עצם כדי להגן על עצמו.
  dino.spinosaurus:
    label: ספינוזאורוס
    summary: קרטיקון מאוחר · טורף
    info: |
      הספינוזאורוס היה באורך של כ־14 מטרים, אפילו ארוך יותר מהטירנוזאורוס, וחי בצפון אפריקה.
      היה לו מפרש גבוה על הגב, והוא חי ליד נהרות ושם צד דגים.
      המאובנים הראשונים שלו הושמדו במלחמת העולם השנייה.
  dino.parasaurolophus:
    label: פרזאורולופוס
    summary: קרטיקון מאוחר · אוכל צמחים
    info: |
      הפרזאורולופוס היה באורך של כ־9 מטרים וחי בצפון אמריקה.
      הייתה לו ציצה ארוכה וחלולה על הראש ומקור כמו של ברווז.
      כשנשף אוויר דרך הציצה, הוא השמיע קולות חזקים כמו חצוצרה.
  dino.pteranodon:
    label: פטרנודון
    summary: קרטיקון מאוחר · טורף
    info: |
      הפטרנודון היה זוחל מעופף, לא דינוזאור, ומוטת הכנפיים שלו הגיעה עד 7 מטרים.
      הוא חי בצפון אמריקה ועף מעל הים כדי לצוד דגים.
      שמו פירושו "כנף בלי שיניים", כי היה לו מקור בלי שיניים.
  dino.diplodocus:
    label: דיפלודוקוס
    summary: יורה מאוחר · אוכל צמחים
    info: |
      הדיפלודוקוס היה באורך של כ־25 מטרים, כמו שני אוטובוסים, וחי בצפון אמריקה.
      רוב האורך שלו היה הצוואר הארוך מאוד והזנב הדק, שדומה לשוט.
      היו לו שיניים קטנות כמו יתדות, שבהן תלש עלים מצמחים.
  dino.brontosaurus:
    label: ברונטוזאורוס
    summary: יורה מאוחר · אוכל צמחים
    info: |
      הברונטוזאורוס היה באורך של כ־22 מטרים וחי בצפון אמריקה.
      שמו פירושו "לטאת הרעם", והוא שקל בערך כמו שלושה פילים.
      במשך יותר מ־100 שנה חשבו המדענים שהוא אפטוזאורוס, אבל ב־2015 הוא קיבל בחזרה את שמו.
  dino.iguanodon:
    label: איגואנודון
    summary: קרטיקון מוקדם · אוכל צמחים
    info: |
      האיגואנודון היה באורך של כ־10 מטרים וחי באירופה.
      בכל אגודל היה לו קוץ חד, שהמדענים חשבו בהתחלה שהוא קרן על האף.
      ב־1825 הוא היה אחד הדינוזאורים הראשונים שקיבלו שם.
  dino.pachycephalosaurus:
    label: פכיצפלוזאורוס
    summary: קרטיקון מאוחר · אוכל צמחים
    info: |
      הפכיצפלוזאורוס היה באורך של כ־4.5 מטרים וחי בצפון אמריקה.
      העצם בראש שלו הייתה בעובי של עד 25 סנטימטרים.
      שמו פירושו "לטאה עבת ראש".
  dino.archaeopteryx:
    label: ארכיאופטריקס
    summary: יורה מאוחר · טורף
    info: |
      הארכיאופטריקס היה בערך בגודל של עורב וחי במקום שהוא היום גרמניה.
      היו לו נוצות וכנפיים כמו לציפור, אבל גם שיניים, טפרים בכנפיים וזנב ארוך של עצם.
      הוא מראה שהציפורים הן הקרובות החיות של הדינוזאורים.
  dino.allosaurus:
    label: אלוזאורוס
    summary: יורה מאוחר · טורף
    info: |
      האלוזאורוס היה באורך של כ־9 מטרים וחי בצפון אמריקה ובפורטוגל.
      הוא היה הצייד הגדול ביותר בזמנו, והיו לו קרניים קטנות מעל העיניים.
      באחד ממאובני האלוזאורוס יש פצע מהזנב הקוצני של סטגוזאורוס.
  dino.mosasaurus:
    label: מוזאזאורוס
    summary: קרטיקון מאוחר · טורף
    info: |
      המוזאזאורוס היה זוחל ימי ענק, לא דינוזאור, באורך של כ־13 מטרים.
      קרוביו הם הלטאות והנחשים, והוא היה צריך לעלות אל פני המים כדי לנשום אוויר.
      המאובן הראשון שלו נמצא בהולנד, ליד נהר המָאס.
  dino.plesiosaurus:
    label: פלזיוזאורוס
    summary: יורה מוקדם · טורף
    info: |
      הפלזיוזאורוס היה זוחל ימי, לא דינוזאור, באורך של כ־3 מטרים.
      היו לו צוואר ארוך, ראש קטן וארבעה סנפירים גדולים לשחייה.
      השלד השלם הראשון שלו נמצא באנגליה על ידי ציידת המאובנים מרי אנינג.
  dino.ichthyosaurus:
    label: איכתיוזאורוס
    summary: יורה מוקדם · טורף
    info: |
      האיכתיוזאורוס היה זוחל ימי, לא דינוזאור ולא דג, באורך של כ־2 מטרים.
      הוא נראה כמו דולפין, והיו לו עיניים גדולות מאוד כדי לראות במים חשוכים.
      הוא ילד גורים חיים בים במקום להטיל ביצים.
  dino.dimetrodon:
    label: דימטרודון
    summary: פרם מוקדם · טורף
    info: |
      הדימטרודון לא היה דינוזאור: הוא חי כ־40 מיליון שנה לפני הדינוזאורים הראשונים.
      הוא היה באורך של עד 4 מטרים, היה לו מפרש גבוה על הגב, והוא חי בצפון אמריקה ובאירופה.
      הוא קרוב יותר ליונקים, כמונו, מאשר לדינוזאורים.
  dino.carnotaurus:
    label: קרנוטאורוס
    summary: קרטיקון מאוחר · טורף
    info: |
      הקרנוטאורוס היה באורך של כ־8 מטרים וחי בארגנטינה, בדרום אמריקה.
      שמו פירושו "פר אוכל בשר", כי היו לו שתי קרניים מעל העיניים.
      הידיים שלו היו זעירות, אפילו קטנות יותר משל הטירנוזאורוס.
  dino.therizinosaurus:
    label: תריזינוזאורוס
    summary: קרטיקון מאוחר · אוכל צמחים
    info: |
      התריזינוזאורוס היה באורך של כ־9 מטרים וחי במונגוליה.
      הטפרים שלו היו ארוכים יותר מסרגל של בית ספר, הטפרים הארוכים ביותר מכל בעל חיים מוכר.
      אף שהיה קרוב משפחה של הטירנוזאורוס, הוא אכל צמחים.
  dino.gallimimus:
    label: גלימימוס
    summary: קרטיקון מאוחר · אוכל הכול
    info: |
      הגלימימוס היה באורך של כ־6 מטרים וחי במונגוליה.
      הוא נראה כמו יען גדול, עם מקור בלי שיניים ורגליים ארוכות.
      הוא היה אחד הרצים המהירים ביותר בין הדינוזאורים.
  dino.dilophosaurus:
    label: דילופוזאורוס
    summary: יורה מוקדם · טורף
    info: |
      הדילופוזאורוס היה באורך של כ־7 מטרים וחי בצפון אמריקה.
      היו לו שתי ציצות דקות על הראש, ושמו פירושו "לטאה עם שתי ציצות".
      בסרטים הוא יורק ארס ויש לו צווארון, אבל אין שום הוכחה לאף אחד מהם.
  dino.styracosaurus:
    label: סטירקוזאורוס
    summary: קרטיקון מאוחר · אוכל צמחים
    info: |
      הסטירקוזאורוס היה באורך של כ־5.5 מטרים וחי בקנדה.
      קוצים ארוכים בלטו מצווארון העצם שסביב הצוואר שלו.
      הייתה לו גם קרן ארוכה אחת על האף, באורך של עד 60 סנטימטרים.
  dino.quetzalcoatlus:
    label: קצלקואטלוס
    summary: קרטיקון מאוחר · טורף
    info: |
      הקצלקואטלוס היה זוחל מעופף, לא דינוזאור, וחי בצפון אמריקה.
      מוטת הכנפיים שלו הייתה כ־10 מטרים, וכשעמד על הקרקע הוא היה גבוה כמו ג'ירפה.
      הוא נקרא על שם קצלקואטל, אל הנחש המנוצה של האצטקים.
  dino.compsognathus:
    label: קומפסוגנתוס
    summary: יורה מאוחר · טורף
    info: |
      הקומפסוגנתוס היה באורך של כמטר אחד בלבד, בערך בגודל של תרנגולת, וחי בגרמניה ובצרפת.
      הוא היה אחד הדינוזאורים הקטנים ביותר ורץ מהר על שתי רגליים.
      באחד המאובנים יש עדיין לטאה קטנה בקיבה שלו, הארוחה האחרונה שלו.
  dino.oviraptor:
    label: אוביראפטור
    summary: קרטיקון מאוחר · אוכל הכול
    info: |
      האוביראפטור היה באורך של כ־2 מטרים, היו לו נוצות ומקור, והוא חי במונגוליה.
      שמו פירושו "גנב ביצים", כי מצאו אותו על קן של ביצים.
      אחר כך גילו המדענים שהביצים היו של בני מינו, כך שהוא היה הורה דואג ולא גנב.
  dino.kentrosaurus:
    label: קנטרוזאורוס
    summary: יורה מאוחר · אוכל צמחים
    info: |
      הקנטרוזאורוס היה באורך של כ־4.5 מטרים וחי בטנזניה, באפריקה.
      הוא היה קרוב משפחה קטן יותר של הסטגוזאורוס, עם לוחות על הצוואר וקוצים ארוכים על הגב והזנב.
      שמו פירושו "לטאה קוצנית".
  dino.microraptor:
    label: מיקרורפטור
    summary: קרטיקון מוקדם · טורף
    info: |
      המיקרורפטור היה באורך של פחות ממטר אחד וחי בסין.
      היו לו כנפיים מנוצות גם בידיים וגם ברגליים, כך שהיו לו ארבע כנפיים.
      הנוצות שלו היו שחורות ומבריקות, כמו של עורב.
  dino.protoceratops:
    label: פרוטוצרטופס
    summary: קרטיקון מאוחר · אוכל צמחים
    info: |
      הפרוטוצרטופס היה באורך של כ־2 מטרים, בערך בגודל של כבשה, וחי במונגוליה ובסין.
      היו לו צווארון של עצם ומקור כמו של תוכי, אבל לא קרניים אמיתיות.
      מאובן מפורסם מראה פרוטוצרטופס ו־ולוצירפטור נעולים זה בזה בקרב.
