lang: ru
pivot: false
title: Динозавры
cards:
  dino.t_rex:
    label: Тираннозавр
    summary: Поздний мел · хищник
    info: |
      Тираннозавр рекс был длиной до 12 метров и жил в Северной Америке.
      Его зубы были размером с банан, а укус — самым сильным среди всех сухопутных животных.
      Лапы у него были короткие, но сильные.
  dino.triceratops:
    label: Трицератопс
    summary: Поздний мел · травоядный
    info: |
      Трицератопс был длиной около 9 метров и жил в Северной Америке.
      Его имя значит «трёхрогая морда», а два верхних рога были длиной около метра.
      Он жил в одно время и в тех же местах, что и тираннозавр.
  dino.stegosaurus:
    label: Стегозавр
    summary: Поздняя юра · травоядный
    info: |
      Стегозавр был длиной около 9 метров и жил в Северной Америке и Португалии.
      На спине у него были большие пластины, а на хвосте — острые шипы.
      Он жил так давно, что между ним и тираннозавром прошло больше времени, чем между тираннозавром и нами.
  dino.brachiosaurus:
    label: Брахиозавр
    summary: Поздняя юра · травоядный
    info: |
      Брахиозавр был длиной около 22 метров и жил в Северной Америке.
      Передние ноги у него были длиннее задних, и он доставал до листьев на высоте четырёхэтажного дома.
      Его имя значит «ящер-рука».
  dino.velociraptor:
    label: Велоцираптор
    summary: Поздний мел · хищник
    info: |
      Велоцираптор был длиной всего около 2 метров, размером с индюка, и жил в Монголии и Китае.
      Он был покрыт перьями, но летать не умел.
      На каждой ноге у него был большой изогнутый коготь для ловли добычи.
  dino.ankylosaurus:
    label: Анкилозавр
    summary: Поздний мел · травоядный
    info: |
      Анкилозавр был длиной около 7 метров и жил в Северной Америке.
      Его спину покрывала костяная броня, как у живого танка.
      На конце хвоста у него была тяжёлая костяная булава для защиты.
  dino.spinosaurus:
    label: Спинозавр
    summary: Поздний мел · хищник
    info: |
      Спинозавр был длиной около 14 метров, даже длиннее тираннозавра, и жил в Северной Африке.
      На спине у него был высокий парус, а жил он у рек и ловил рыбу.
      Его первые окаменелости погибли во время Второй мировой войны.
  dino.parasaurolophus:
    label: Паразауролоф
    summary: Поздний мел · травоядный
    info: |
      Паразауролоф был длиной около 9 метров и жил в Северной Америке.
      На голове у него был длинный полый гребень, а клюв — как у утки.
      Продувая воздух через гребень, он издавал громкие звуки, похожие на трубу.
  dino.pteranodon:
    label: Птеранодон
    summary: Поздний мел · хищник
    info: |
      Птеранодон был летающим ящером, а не динозавром, и размах его крыльев достигал 7 метров.
      Он жил в Северной Америке и летал над морем, чтобы ловить рыбу.
      Его имя значит «крылатый и беззубый», потому что в его клюве не было зубов.
  dino.diplodocus:
    label: Диплодок
    summary: Поздняя юра · травоядный
    info: |
      Диплодок был длиной около 25 метров, как два автобуса, и жил в Северной Америке.
      Большую часть его длины составляли очень длинная шея и тонкий хвост, похожий на кнут.
      Маленькими зубами-колышками он обдирал листья с растений.
  dino.brontosaurus:
    label: Бронтозавр
    summary: Поздняя юра · травоядный
    info: |
      Бронтозавр был длиной около 22 метров и жил в Северной Америке.
      Его имя значит «громовой ящер», а весил он примерно как три слона.
      Больше 100 лет учёные считали его апатозавром, но в 2015 году ему вернули собственное имя.
  dino.iguanodon:
    label: Игуанодон
    summary: Ранний мел · травоядный
    info: |
      Игуанодон был длиной около 10 метров и жил в Европе.
      На каждом большом пальце у него был острый шип — сначала учёные думали, что это рог на носу.
      В 1825 году он стал одним из самых первых динозавров, получивших имя.
  dino.pachycephalosaurus:
    label: Пахицефалозавр
    summary: Поздний мел · травоядный
    info: |
      Пахицефалозавр был длиной около 4,5 метра и жил в Северной Америке.
      Кость на макушке его головы была толщиной до 25 сантиметров.
      Его имя значит «толстоголовый ящер».
  dino.archaeopteryx:
    label: Археоптерикс
    summary: Поздняя юра · хищник
    info: |
      Археоптерикс был размером с ворона и жил там, где сейчас Германия.
      У него были перья и крылья, как у птицы, но ещё зубы, когти на крыльях и длинный костяной хвост.
      Он показывает, что птицы — живые родственники динозавров.
  dino.allosaurus:
    label: Аллозавр
    summary: Поздняя юра · хищник
    info: |
      Аллозавр был длиной около 9 метров и жил в Северной Америке и Португалии.
      Он был самым крупным охотником своего времени, а над глазами у него были маленькие рожки.
      На одной окаменелости аллозавра есть рана от шипастого хвоста стегозавра.
  dino.mosasaurus:
    label: Мозазавр
    summary: Поздний мел · хищник
    info: |
      Мозазавр был огромным морским ящером, а не динозавром, длиной около 13 метров.
      Его родственники — ящерицы и змеи, и он всплывал на поверхность, чтобы дышать воздухом.
      Его первую окаменелость нашли в Нидерландах, у реки Маас.
  dino.plesiosaurus:
    label: Плезиозавр
    summary: Ранняя юра · хищник
    info: |
      Плезиозавр был морским ящером, а не динозавром, длиной около 3 метров.
      У него была длинная шея, маленькая голова и четыре больших ласта для плавания.
      Его первый целый скелет нашла в Англии собирательница окаменелостей Мэри Эннинг.
  dino.ichthyosaurus:
    label: Ихтиозавр
    summary: Ранняя юра · хищник
    info: |
      Ихтиозавр был морским ящером — не динозавром и не рыбой — длиной около 2 метров.
      Он был похож на дельфина, а огромные глаза помогали ему видеть в тёмной воде.
      Он не откладывал яйца, а рожал живых детёнышей прямо в море.
  dino.dimetrodon:
    label: Диметродон
    summary: Ранняя пермь · хищник
    info: |
      Диметродон не был динозавром: он жил примерно за 40 миллионов лет до первых динозавров.
      Он был длиной до 4 метров, носил на спине высокий парус и жил в Северной Америке и Европе.
      Он ближе к млекопитающим, таким как мы, чем к динозаврам.
  dino.carnotaurus:
    label: Карнотавр
    summary: Поздний мел · хищник
    info: |
      Карнотавр был длиной около 8 метров и жил в Аргентине, в Южной Америке.
      Его имя значит «бык-мясоед», потому что над глазами у него были два рога.
      Передние лапы у него были крошечные, даже меньше, чем у тираннозавра.
  dino.therizinosaurus:
    label: Теризинозавр
    summary: Поздний мел · травоядный
    info: |
      Теризинозавр был длиной около 9 метров и жил в Монголии.
      Его когти были длиннее школьной линейки — это самые длинные когти среди всех известных животных.
      Хотя он был родственником тираннозавра, он ел растения.
  dino.gallimimus:
    label: Галлимим
    summary: Поздний мел · всеядный
    info: |
      Галлимим был длиной около 6 метров и жил в Монголии.
      Он был похож на большого страуса: беззубый клюв и длинные ноги.
      Он был одним из самых быстрых бегунов среди динозавров.
  dino.dilophosaurus:
    label: Дилофозавр
    summary: Ранняя юра · хищник
    info: |
      Дилофозавр был длиной около 7 метров и жил в Северной Америке.
      На голове у него было два тонких гребня, а его имя значит «двугребневый ящер».
      В кино он плюётся ядом и раскрывает воротник, но доказательств ни того, ни другого нет.
  dino.styracosaurus:
    label: Стиракозавр
    summary: Поздний мел · травоядный
    info: |
      Стиракозавр был длиной около 5,5 метра и жил в Канаде.
      Из костяного воротника вокруг его шеи торчали длинные шипы.
      А ещё у него был один длинный рог на носу — до 60 сантиметров.
  dino.quetzalcoatlus:
    label: Кетцалькоатль
    summary: Поздний мел · хищник
    info: |
      Кетцалькоатль был летающим ящером, а не динозавром, и жил в Северной Америке.
      Размах его крыльев был около 10 метров, а стоя на земле, он был ростом с жирафа.
      Его назвали в честь Кетцалькоатля — пернатого змея, бога ацтеков.
  dino.compsognathus:
    label: Компсогнат
    summary: Поздняя юра · хищник
    info: |
      Компсогнат был длиной всего около 1 метра, размером с курицу, и жил в Германии и Франции.
      Он был одним из самых маленьких динозавров и быстро бегал на двух ногах.
      В желудке одной окаменелости до сих пор лежит маленькая ящерица — его последний обед.
  dino.oviraptor:
    label: Овираптор
    summary: Поздний мел · всеядный
    info: |
      Овираптор был длиной около 2 метров, у него были перья и клюв, а жил он в Монголии.
      Его имя значит «похититель яиц», потому что его нашли на гнезде с яйцами.
      Позже учёные выяснили, что это были яйца его сородичей: он был заботливым родителем, а не вором.
  dino.kentrosaurus:
    label: Кентрозавр
    summary: Поздняя юра · травоядный
    info: |
      Кентрозавр был длиной около 4,5 метра и жил в Танзании, в Африке.
      Это был небольшой родственник стегозавра: пластины на шее и длинные шипы на спине и хвосте.
      Его имя значит «колючий ящер».
  dino.microraptor:
    label: Микрораптор
    summary: Ранний мел · хищник
    info: |
      Микрораптор был длиной меньше 1 метра и жил в Китае.
      Крылья из перьев были у него и на передних, и на задних лапах — целых четыре крыла.
      Его перья были чёрными и блестящими, как у вороны.
  dino.protoceratops:
    label: Протоцератопс
    summary: Поздний мел · травоядный
    info: |
      Протоцератопс был длиной около 2 метров, размером с овцу, и жил в Монголии и Китае.
      У него был костяной воротник и клюв, как у попугая, но настоящих рогов не было.
      Одна знаменитая окаменелость показывает протоцератопса и велоцираптора, сцепившихся в схватке.
