lang: zh-CN
pivot: false
title: 恐龙
cards:
  dino.t_rex:
    label: 霸王龙
    summary: 白垩纪晚期 · 肉食性
    info: |
      霸王龙身长可达12米，生活在北美洲。
      它的牙齿有香蕉那么大，咬合力是所有陆地动物中最强的。
      它的前肢很短，但是很有力气。
  dino.triceratops:
    label: 三角龙
    summary: 白垩纪晚期 · 植食性
    info: |
      三角龙身长约9米，生活在北美洲。
      它的名字意思是“长着三只角的脸”，上面两只角长约1米。
      它和霸王龙生活在同一时代、同一地方。
  dino.stegosaurus:
    label: 剑龙
    summary: 侏罗纪晚期 · 植食性
    info: |
      剑龙身长约9米，生活在北美洲和葡萄牙。
      它的背上有大大的骨板，尾巴上有尖尖的刺。
      它生活的年代非常久远，它和霸王龙相隔的时间，比霸王龙和我们相隔的时间还要长。
  dino.brachiosaurus:
    label: 腕龙
    summary: 侏罗纪晚期 · 植食性
    info: |
      腕龙身长约22米，生活在北美洲。
      它的前腿比后腿长，所以能吃到四层楼那么高的树叶。
      它的名字意思是“臂蜥蜴”。
  dino.velociraptor:
    label: 伶盗龙
    summary: 白垩纪晚期 · 肉食性
    info: |
      伶盗龙身长只有约2米，和火鸡差不多大，生活在蒙古和中国。
      它全身长满羽毛，但是不会飞。
      它的每只脚上都有一个弯弯的大爪子，用来抓猎物。
  dino.ankylosaurus:
    label: 甲龙
    summary: 白垩纪晚期 · 植食性
    info: |
      甲龙身长约7米，生活在北美洲。
      它的背上覆盖着骨质的铠甲，就像一辆活坦克。
      它的尾巴末端有一个沉重的骨锤，用来保护自己。
  dino.spinosaurus:
    label: 棘龙
    summary: 白垩纪晚期 · 肉食性
    info: |
      棘龙身长约14米，比霸王龙还要长，生活在北非。
      它的背上有一面高高的“帆”，住在河边，靠捕鱼为生。
      最早发现的棘龙化石在第二次世界大战中被毁掉了。
  dino.parasaurolophus:
    label: 副栉龙
    summary: 白垩纪晚期 · 植食性
    info: |
      副栉龙身长约9米，生活在北美洲。
      它的头上有一个又长又空心的头冠，嘴巴像鸭子的嘴。
      它往头冠里吹气，就能发出像小号一样响亮的声音。
  dino.pteranodon:
    label: 无齿翼龙
    summary: 白垩纪晚期 · 肉食性
    info: |
      无齿翼龙是会飞的爬行动物，不是恐龙，它的翅膀展开可达7米宽。
      它生活在北美洲，在大海上空飞翔，捕捉鱼类。
      它的嘴里没有牙齿，所以名字的意思是“没有牙齿的翅膀”。
  dino.diplodocus:
    label: 梁龙
    summary: 侏罗纪晚期 · 植食性
    info: |
      梁龙身长约25米，有两辆公共汽车那么长，生活在北美洲。
      它身体的大部分长度来自很长的脖子和像鞭子一样细长的尾巴。
      它长着像小木桩一样的牙齿，用来把植物的叶子捋下来吃。
  dino.brontosaurus:
    label: 雷龙
    summary: 侏罗纪晚期 · 植食性
    info: |
      雷龙身长约22米，生活在北美洲。
      它的名字意思是“打雷的蜥蜴”，体重大约相当于三头大象。
      一百多年来，科学家都以为它就是迷惑龙，但在2015年，它重新拥有了自己的名字。
  dino.iguanodon:
    label: 禽龙
    summary: 白垩纪早期 · 植食性
    info: |
      禽龙身长约10米，生活在欧洲。
      它的每个大拇指上都有一根尖刺，科学家起初以为那是长在鼻子上的角。
      1825年，它成为世界上最早被命名的恐龙之一。
  dino.pachycephalosaurus:
    label: 肿头龙
    summary: 白垩纪晚期 · 植食性
    info: |
      肿头龙身长约4.5米，生活在北美洲。
      它头顶的骨头最厚可达25厘米。
      它的名字意思是“厚头的蜥蜴”。
  dino.archaeopteryx:
    label: 始祖鸟
    summary: 侏罗纪晚期 · 肉食性
    info: |
      始祖鸟和乌鸦差不多大，生活在今天的德国一带。
      它像鸟一样有羽毛和翅膀，但也有牙齿、翅膀上的爪子和一条长长的骨质尾巴。
      它告诉我们，鸟类是恐龙现存的亲戚。
  dino.allosaurus:
    label: 异特龙
    summary: 侏罗纪晚期 · 肉食性
    info: |
      异特龙身长约9米，生活在北美洲和葡萄牙。
      它是那个时代最大的猎手，眼睛上方长着小小的角。
      有一块异特龙化石上留着被剑龙带刺的尾巴打出的伤口。
  dino.mosasaurus:
    label: 沧龙
    summary: 白垩纪晚期 · 肉食性
    info: |
      沧龙是一种巨大的海洋爬行动物，不是恐龙，身长约13米。
      它的亲戚是蜥蜴和蛇，它必须浮到水面上呼吸空气。
      第一块沧龙化石是在荷兰的默兹河附近发现的。
  dino.plesiosaurus:
    label: 蛇颈龙
    summary: 侏罗纪早期 · 肉食性
    info: |
      蛇颈龙是一种海洋爬行动物，不是恐龙，身长约3米。
      它有长长的脖子、小小的脑袋和四个用来游泳的大鳍。
      第一副完整的蛇颈龙骨架是化石猎人玛丽·安宁在英国发现的。
  dino.ichthyosaurus:
    label: 鱼龙
    summary: 侏罗纪早期 · 肉食性
    info: |
      鱼龙是一种海洋爬行动物，既不是恐龙也不是鱼，身长约2米。
      它长得像海豚，有一双很大的眼睛，能在昏暗的水里看清东西。
      它不下蛋，而是在海里直接生下宝宝。
  dino.dimetrodon:
    label: 异齿龙
    summary: 二叠纪早期 · 肉食性
    info: |
      异齿龙不是恐龙：它比最早的恐龙还要早大约4000万年。
      它身长可达4米，背上有一面高高的“帆”，生活在北美洲和欧洲。
      比起恐龙，它和像我们这样的哺乳动物关系更近。
  dino.carnotaurus:
    label: 食肉牛龙
    summary: 白垩纪晚期 · 肉食性
    info: |
      食肉牛龙身长约8米，生活在南美洲的阿根廷。
      它的眼睛上方有两只角，所以名字的意思是“吃肉的公牛”。
      它的前肢非常小，比霸王龙的前肢还要小。
  dino.therizinosaurus:
    label: 镰刀龙
    summary: 白垩纪晚期 · 植食性
    info: |
      镰刀龙身长约9米，生活在蒙古。
      它的爪子比学校用的直尺还长，是已知动物中最长的爪子。
      虽然它是霸王龙的亲戚，却以植物为食。
  dino.gallimimus:
    label: 似鸡龙
    summary: 白垩纪晚期 · 杂食性
    info: |
      似鸡龙身长约6米，生活在蒙古。
      它长得像一只大鸵鸟，有没有牙齿的喙和长长的腿。
      它是恐龙中跑得最快的之一。
  dino.dilophosaurus:
    label: 双脊龙
    summary: 侏罗纪早期 · 肉食性
    info: |
      双脊龙身长约7米，生活在北美洲。
      它的头上有两片薄薄的头冠，名字的意思是“有两个头冠的蜥蜴”。
      在电影里它会喷毒液，脖子上还有伞状的皮褶，但这两样都没有证据。
  dino.styracosaurus:
    label: 戟龙
    summary: 白垩纪晚期 · 植食性
    info: |
      戟龙身长约5.5米，生活在加拿大。
      它脖子周围的骨质颈盾上伸出许多长长的尖刺。
      它的鼻子上还有一只长角，最长可达60厘米。
  dino.quetzalcoatlus:
    label: 风神翼龙
    summary: 白垩纪晚期 · 肉食性
    info: |
      风神翼龙是会飞的爬行动物，不是恐龙，生活在北美洲。
      它的翅膀展开约10米宽，站在地上时和长颈鹿一样高。
      它的名字来自阿兹特克人信奉的羽蛇神克查尔科亚特尔。
  dino.compsognathus:
    label: 美颌龙
    summary: 侏罗纪晚期 · 肉食性
    info: |
      美颌龙身长只有约1米，和一只鸡差不多大，生活在德国和法国。
      它是最小的恐龙之一，用两条腿跑得飞快。
      有一块化石的肚子里还留着一只小蜥蜴，那是它的最后一餐。
  dino.oviraptor:
    label: 窃蛋龙
    summary: 白垩纪晚期 · 杂食性
    info: |
      窃蛋龙身长约2米，长着羽毛和喙，生活在蒙古。
      它被发现时趴在一窝蛋上，所以名字的意思是“偷蛋的贼”。
      后来科学家发现，那些蛋是它同类的蛋，所以它是一位细心的父母，而不是小偷。
  dino.kentrosaurus:
    label: 钉状龙
    summary: 侏罗纪晚期 · 植食性
    info: |
      钉状龙身长约4.5米，生活在非洲的坦桑尼亚。
      它是剑龙的小个子亲戚，脖子上有骨板，背上和尾巴上有长长的尖刺。
      它的名字意思是“长满尖刺的蜥蜴”。
  dino.microraptor:
    label: 小盗龙
    summary: 白垩纪早期 · 肉食性
    info: |
      小盗龙身长不到1米，生活在中国。
      它的前肢和后腿上都长着带羽毛的翅膀，所以它有四只翅膀。
      它的羽毛又黑又亮，就像乌鸦的羽毛。
  dino.protoceratops:
    label: 原角龙
    summary: 白垩纪晚期 · 植食性
    info: |
      原角龙身长约2米，和一只绵羊差不多大，生活在蒙古和中国。
      它有骨质的颈盾和像鹦鹉一样的喙，但没有真正的角。
      有一块著名的化石，保存了原角龙和伶盗龙扭打在一起的样子。
