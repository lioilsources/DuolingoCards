lang: bg
pivot: false
title: Динозаври
cards:
  dino.t_rex:
    label: Тиранозавър
    summary: Късна креда · хищник
    info: |
      Тиранозавърът рекс е бил дълъг до 12 метра и е живял в Северна Америка.
      Зъбите му са били големи колкото банани, а захапката му е била най-силната от всички сухоземни животни.
      Предните му крака са били къси, но силни.
  dino.triceratops:
    label: Трицератопс
    summary: Късна креда · тревопасен
    info: |
      Трицератопсът е бил дълъг около 9 метра и е живял в Северна Америка.
      Името му означава „лице с три рога“, а двата горни рога са били дълги около метър.
      Живял е по същото време и на същите места като тиранозавъра.
  dino.stegosaurus:
    label: Стегозавър
    summary: Късна юра · тревопасен
    info: |
      Стегозавърът е бил дълъг около 9 метра и е живял в Северна Америка и Португалия.
      На гърба си е имал големи плочи, а на опашката – остри шипове.
      Живял е толкова отдавна, че между него и тиранозавъра е минало повече време, отколкото между тиранозавъра и нас.
  dino.brachiosaurus:
    label: Брахиозавър
    summary: Късна юра · тревопасен
    info: |
      Брахиозавърът е бил дълъг около 22 метра и е живял в Северна Америка.
      Предните му крака са били по-дълги от задните и е стигал листа на височината на четириетажна сграда.
      Името му означава „гущер с ръце“.
  dino.velociraptor:
    label: Велоцираптор
    summary: Късна креда · хищник
    info: |
      Велоцирапторът е бил дълъг само около 2 метра, голям колкото пуйка, и е живял в Монголия и Китай.
      Бил е покрит с пера, но не е можел да лети.
      На всеки крак е имал голям извит нокът за хващане на плячка.
  dino.ankylosaurus:
    label: Анкилозавър
    summary: Късна креда · тревопасен
    info: |
      Анкилозавърът е бил дълъг около 7 метра и е живял в Северна Америка.
      Гърбът му е бил покрит с костна броня – като жив танк.
      В края на опашката си е имал тежък костен боздуган, с който се е защитавал.
  dino.spinosaurus:
    label: Спинозавър
    summary: Късна креда · хищник
    info: |
      Спинозавърът е бил дълъг около 14 метра – дори по-дълъг от тиранозавъра – и е живял в Северна Африка.
      На гърба си е имал високо платно и е живял край реки, където е ловял риба.
      Първите му вкаменелости са унищожени по време на Втората световна война.
  dino.parasaurolophus:
    label: Паразауролоф
    summary: Късна креда · тревопасен
    info: |
      Паразауролофът е бил дълъг около 9 метра и е живял в Северна Америка.
      На главата си е имал дълъг кух гребен, а човката му е била като на патица.
      Като е духал въздух през гребена, е издавал силни звуци, подобни на тромпет.
  dino.pteranodon:
    label: Птеранодон
    summary: Късна креда · хищник
    info: |
      Птеранодонът е бил летящ гущер, а не динозавър, и крилете му са били широки до 7 метра.
      Живял е в Северна Америка и е летял над морето, за да лови риба.
      Името му означава „крило без зъби“, защото човката му не е имала зъби.
  dino.diplodocus:
    label: Диплодок
    summary: Късна юра · тревопасен
    info: |
      Диплодокът е бил дълъг около 25 метра – колкото два автобуса – и е живял в Северна Америка.
      По-голямата част от дължината му са били много дългата шия и тънката опашка, подобна на камшик.
      С малките си зъби, подобни на колчета, е оскубвал листата от растенията.
  dino.brontosaurus:
    label: Бронтозавър
    summary: Късна юра · тревопасен
    info: |
      Бронтозавърът е бил дълъг около 22 метра и е живял в Северна Америка.
      Името му означава „гръмотевичен гущер“, а е тежал колкото три слона.
      Повече от 100 години учените са го смятали за апатозавър, но през 2015 г. той получава обратно собственото си име.
  dino.iguanodon:
    label: Игуанодон
    summary: Ранна креда · тревопасен
    info: |
      Игуанодонът е бил дълъг около 10 метра и е живял в Европа.
      На всеки палец е имал остър шип, който учените отначало са смятали за рог на носа му.
      През 1825 г. той става един от първите динозаври, получили име.
  dino.pachycephalosaurus:
    label: Пахицефалозавър
    summary: Късна креда · тревопасен
    info: |
      Пахицефалозавърът е бил дълъг около 4,5 метра и е живял в Северна Америка.
      Костта на темето му е била дебела до 25 сантиметра.
      Името му означава „гущер с дебела глава“.
  dino.archaeopteryx:
    label: Археоптерикс
    summary: Късна юра · хищник
    info: |
      Археоптериксът е бил голям колкото гарван и е живял там, където днес е Германия.
      Имал е пера и криле като птица, но също зъби, нокти по крилете и дълга костна опашка.
      Той показва, че птиците са живите роднини на динозаврите.
  dino.allosaurus:
    label: Алозавър
    summary: Късна юра · хищник
    info: |
      Алозавърът е бил дълъг около 9 метра и е живял в Северна Америка и Португалия.
      Бил е най-големият ловец на своето време и е имал малки рогца над очите.
      По една вкаменелост на алозавър има рана от шипестата опашка на стегозавър.
  dino.mosasaurus:
    label: Мозазавър
    summary: Късна креда · хищник
    info: |
      Мозазавърът е бил огромен морски гущер, а не динозавър, дълъг около 13 метра.
      Негови роднини са гущерите и змиите и е трябвало да излиза на повърхността, за да диша въздух.
      Първата му вкаменелост е намерена в Нидерландия, край река Маас.
  dino.plesiosaurus:
    label: Плезиозавър
    summary: Ранна юра · хищник
    info: |
      Плезиозавърът е бил морски гущер, а не динозавър, дълъг около 3 метра.
      Имал е дълга шия, малка глава и четири големи плавника за плуване.
      Първия му цял скелет е намерила в Англия събирачката на вкаменелости Мери Анинг.
  dino.ichthyosaurus:
    label: Ихтиозавър
    summary: Ранна юра · хищник
    info: |
      Ихтиозавърът е бил морски гущер – нито динозавър, нито риба – дълъг около 2 метра.
      Приличал е на делфин и е имал много големи очи, за да вижда в тъмната вода.
      Вместо да снася яйца, е раждал живи малки в морето.
  dino.dimetrodon:
    label: Диметродон
    summary: Ранен перм · хищник
    info: |
      Диметродонът не е бил динозавър: живял е около 40 милиона години преди първите динозаври.
      Бил е дълъг до 4 метра, имал е високо платно на гърба и е живял в Северна Америка и Европа.
      Той е по-близък роднина на бозайниците, като нас, отколкото на динозаврите.
  dino.carnotaurus:
    label: Карнотавър
    summary: Късна креда · хищник
    info: |
      Карнотавърът е бил дълъг около 8 метра и е живял в Аржентина, в Южна Америка.
      Името му означава „месояден бик“, защото над очите си е имал два рога.
      Предните му крака са били мънички, дори по-малки от тези на тиранозавъра.
  dino.therizinosaurus:
    label: Теризинозавър
    summary: Късна креда · тревопасен
    info: |
      Теризинозавърът е бил дълъг около 9 метра и е живял в Монголия.
      Ноктите му са били по-дълги от училищна линийка – най-дългите нокти от всички познати животни.
      Макар да е бил роднина на тиранозавъра, той се е хранел с растения.
  dino.gallimimus:
    label: Галимим
    summary: Късна креда · всеяден
    info: |
      Галимимът е бил дълъг около 6 метра и е живял в Монголия.
      Приличал е на голям щраус – с човка без зъби и дълги крака.
      Бил е един от най-бързите бегачи сред динозаврите.
  dino.dilophosaurus:
    label: Дилофозавър
    summary: Ранна юра · хищник
    info: |
      Дилофозавърът е бил дълъг около 7 метра и е живял в Северна Америка.
      На главата си е имал два тънки гребена, а името му означава „гущер с два гребена“.
      Във филмите плюе отрова и има яка около врата, но няма доказателства нито за едното, нито за другото.
  dino.styracosaurus:
    label: Стиракозавър
    summary: Късна креда · тревопасен
    info: |
      Стиракозавърът е бил дълъг около 5,5 метра и е живял в Канада.
      От костната яка около врата му са стърчали дълги шипове.
      Имал е и един дълъг рог на носа – до 60 сантиметра.
  dino.quetzalcoatlus:
    label: Кецалкоатъл
    summary: Късна креда · хищник
    info: |
      Кецалкоатълът е бил летящ гущер, а не динозавър, и е живял в Северна Америка.
      Крилете му са били широки около 10 метра, а изправен на земята е бил висок колкото жираф.
      Наречен е на Кецалкоатъл – пернатата змия, бог на ацтеките.
  dino.compsognathus:
    label: Компсогнат
    summary: Късна юра · хищник
    info: |
      Компсогнатът е бил дълъг само около 1 метър, голям колкото кокошка, и е живял в Германия и Франция.
      Бил е един от най-малките динозаври и е тичал бързо на два крака.
      В стомаха на една вкаменелост и до днес има малък гущер – последното му ядене.
  dino.oviraptor:
    label: Овираптор
    summary: Късна креда · всеяден
    info: |
      Овирапторът е бил дълъг около 2 метра, имал е пера и човка и е живял в Монголия.
      Името му означава „крадец на яйца“, защото е бил намерен върху гнездо с яйца.
      По-късно учените откриват, че яйцата са били на неговия вид – значи е бил грижовен родител, а не крадец.
  dino.kentrosaurus:
    label: Кентрозавър
    summary: Късна юра · тревопасен
    info: |
      Кентрозавърът е бил дълъг около 4,5 метра и е живял в Танзания, в Африка.
      Бил е по-малък роднина на стегозавъра, с плочи на врата и дълги шипове по гърба и опашката.
      Името му означава „бодлив гущер“.
  dino.microraptor:
    label: Микрораптор
    summary: Ранна креда · хищник
    info: |
      Микрорапторът е бил дълъг по-малко от 1 метър и е живял в Китай.
      Имал е пернати криле и на предните, и на задните крака – тоест четири криле.
      Перата му са били черни и лъскави, като на врана.
  dino.protoceratops:
    label: Протоцератопс
    summary: Късна креда · тревопасен
    info: |
      Протоцератопсът е бил дълъг около 2 метра, голям колкото овца, и е живял в Монголия и Китай.
      Имал е костна яка и човка като на папагал, но не и истински рогове.
      Една прочута вкаменелост показва протоцератопс и велоцираптор, вкопчени в схватка.
