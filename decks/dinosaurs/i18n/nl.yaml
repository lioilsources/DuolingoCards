lang: nl
pivot: false
title: Dinosaurussen
cards:
  dino.t_rex:
    label: Tyrannosaurus
    summary: Laat-Krijt · vleeseter
    info: |
      Tyrannosaurus rex was tot 12 meter lang en leefde in Noord-Amerika.
      Zijn tanden waren zo groot als bananen, en hij had de sterkste beet van alle landdieren.
      Zijn armen waren kort, maar wel sterk.
  dino.triceratops:
    label: Triceratops
    summary: Laat-Krijt · planteneter
    info: |
      Triceratops was ongeveer 9 meter lang en leefde in Noord-Amerika.
      Zijn naam betekent "gezicht met drie hoorns", en zijn twee bovenste hoorns waren ongeveer een meter lang.
      Hij leefde in dezelfde tijd en op dezelfde plekken als Tyrannosaurus.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Laat-Jura · planteneter
    info: |
      Stegosaurus was ongeveer 9 meter lang en leefde in Noord-Amerika en Portugal.
      Hij had grote platen op zijn rug en scherpe stekels aan zijn staart.
      Hij leefde zo lang geleden dat hij in tijd verder van T. rex af staat dan wij.
  dino.brachiosaurus:
    label: Brachiosaurus
    summary: Laat-Jura · planteneter
    info: |
      Brachiosaurus was ongeveer 22 meter lang en leefde in Noord-Amerika.
      Zijn voorpoten waren langer dan zijn achterpoten, zodat hij bij bladeren kon zo hoog als een huis met vier verdiepingen.
      Zijn naam betekent "armhagedis".
  dino.velociraptor:
    label: Velociraptor
    summary: Laat-Krijt · vleeseter
    info: |
      Velociraptor was maar ongeveer 2 meter lang, zo groot als een kalkoen, en leefde in Mongolië en China.
      Hij was bedekt met veren, maar kon niet vliegen.
      Aan elke voet had hij een grote, kromme klauw om prooi te vangen.
  dino.ankylosaurus:
    label: Ankylosaurus
    summary: Laat-Krijt · planteneter
    info: |
      Ankylosaurus was ongeveer 7 meter lang en leefde in Noord-Amerika.
      Zijn rug was bedekt met een pantser van bot, als een levende tank.
      Aan het eind van zijn staart had hij een zware knots van bot om zich te verdedigen.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Laat-Krijt · vleeseter
    info: |
      Spinosaurus was ongeveer 14 meter lang, nog langer dan T. rex, en leefde in Noord-Afrika.
      Hij had een hoog zeil op zijn rug en leefde bij rivieren, waar hij vis ving.
      Zijn eerste fossielen gingen verloren in de Tweede Wereldoorlog.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Laat-Krijt · planteneter
    info: |
      Parasaurolophus was ongeveer 9 meter lang en leefde in Noord-Amerika.
      Hij had een lange, holle kam op zijn kop en een snavel als een eend.
      Door lucht door zijn kam te blazen, kon hij harde geluiden maken als een trompet.
  dino.pteranodon:
    label: Pteranodon
    summary: Laat-Krijt · vleeseter
    info: |
      Pteranodon was een vliegend reptiel en geen dinosaurus, en zijn vleugels waren tot 7 meter breed.
      Hij leefde in Noord-Amerika en vloog boven de zee om vis te vangen.
      Zijn naam betekent "vleugel zonder tanden", want zijn snavel had geen tanden.
  dino.diplodocus:
    label: Diplodocus
    summary: Laat-Jura · planteneter
    info: |
      Diplodocus was ongeveer 25 meter lang, zo lang als twee bussen, en leefde in Noord-Amerika.
      Het grootste deel daarvan waren zijn heel lange nek en zijn dunne zweepstaart.
      Met zijn kleine, pinvormige tanden streek hij bladeren van de planten.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Laat-Jura · planteneter
    info: |
      Brontosaurus was ongeveer 22 meter lang en leefde in Noord-Amerika.
      Zijn naam betekent "donderhagedis", en hij woog ongeveer evenveel als drie olifanten.
      Meer dan 100 jaar dachten wetenschappers dat hij een Apatosaurus was, maar in 2015 kreeg hij zijn eigen naam terug.
  dino.iguanodon:
    label: Iguanodon
    summary: Vroeg-Krijt · planteneter
    info: |
      Iguanodon was ongeveer 10 meter lang en leefde in Europa.
      Op elke duim had hij een scherpe punt, die wetenschappers eerst voor een hoorn op zijn neus hielden.
      In 1825 werd hij een van de allereerste dinosaurussen die een naam kregen.
  dino.pachycephalosaurus:
    label: Pachycephalosaurus
    summary: Laat-Krijt · planteneter
    info: |
      Pachycephalosaurus was ongeveer 4,5 meter lang en leefde in Noord-Amerika.
      Het bot boven op zijn kop was tot 25 centimeter dik.
      Zijn naam betekent "dikkophagedis".
  dino.archaeopteryx:
    label: Archaeopteryx
    summary: Laat-Jura · vleeseter
    info: |
      Archaeopteryx was ongeveer zo groot als een raaf en leefde in wat nu Duitsland is.
      Hij had veren en vleugels als een vogel, maar ook tanden, klauwen aan zijn vleugels en een lange staart van bot.
      Hij laat zien dat vogels de levende familie van de dinosaurussen zijn.
  dino.allosaurus:
    label: Allosaurus
    summary: Laat-Jura · vleeseter
    info: |
      Allosaurus was ongeveer 9 meter lang en leefde in Noord-Amerika en Portugal.
      Hij was de grootste jager van zijn tijd en had kleine hoorns boven zijn ogen.
      Eén fossiel van een Allosaurus heeft een wond van de stekelstaart van een Stegosaurus.
  dino.mosasaurus:
    label: Mosasaurus
    summary: Laat-Krijt · vleeseter
    info: |
      Mosasaurus was een reusachtig zeereptiel en geen dinosaurus, ongeveer 13 meter lang.
      Hij was familie van hagedissen en slangen, en moest naar boven komen om lucht te halen.
      Zijn eerste fossiel werd gevonden in Nederland, vlak bij de Maas.
  dino.plesiosaurus:
    label: Plesiosaurus
    summary: Vroeg-Jura · vleeseter
    info: |
      Plesiosaurus was een zeereptiel en geen dinosaurus, ongeveer 3 meter lang.
      Hij had een lange nek, een kleine kop en vier grote flippers om mee te zwemmen.
      Zijn eerste complete skelet werd in Engeland gevonden door fossielenjager Mary Anning.
  dino.ichthyosaurus:
    label: Ichthyosaurus
    summary: Vroeg-Jura · vleeseter
    info: |
      Ichthyosaurus was een zeereptiel, geen dinosaurus en geen vis, ongeveer 2 meter lang.
      Hij leek op een dolfijn en had heel grote ogen om in donker water te kunnen zien.
      Hij legde geen eieren, maar kreeg levende jongen in de zee.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Vroeg-Perm · vleeseter
    info: |
      Dimetrodon was geen dinosaurus: hij leefde zo'n 40 miljoen jaar vóór de eerste dinosaurussen.
      Hij was tot 4 meter lang, had een hoog zeil op zijn rug en leefde in Noord-Amerika en Europa.
      Hij is nauwer verwant aan zoogdieren, zoals wij, dan aan dinosaurussen.
  dino.carnotaurus:
    label: Carnotaurus
    summary: Laat-Krijt · vleeseter
    info: |
      Carnotaurus was ongeveer 8 meter lang en leefde in Argentinië, in Zuid-Amerika.
      Zijn naam betekent "vleesetende stier", omdat hij twee hoorns boven zijn ogen had.
      Zijn armen waren piepklein, nog kleiner dan die van T. rex.
  dino.therizinosaurus:
    label: Therizinosaurus
    summary: Laat-Krijt · planteneter
    info: |
      Therizinosaurus was ongeveer 9 meter lang en leefde in Mongolië.
      Zijn klauwen waren langer dan een schoolliniaal, de langste klauwen van alle bekende dieren.
      Hoewel hij familie was van T. rex, at hij planten.
  dino.gallimimus:
    label: Gallimimus
    summary: Laat-Krijt · alleseter
    info: |
      Gallimimus was ongeveer 6 meter lang en leefde in Mongolië.
      Hij leek op een grote struisvogel, met een snavel zonder tanden en lange poten.
      Hij was een van de snelste lopers onder de dinosaurussen.
  dino.dilophosaurus:
    label: Dilophosaurus
    summary: Vroeg-Jura · vleeseter
    info: |
      Dilophosaurus was ongeveer 7 meter lang en leefde in Noord-Amerika.
      Hij had twee dunne kammen op zijn kop, en zijn naam betekent "hagedis met twee kammen".
      In films spuwt hij gif en heeft hij een nekkraag, maar voor geen van beide is bewijs.
  dino.styracosaurus:
    label: Styracosaurus
    summary: Laat-Krijt · planteneter
    info: |
      Styracosaurus was ongeveer 5,5 meter lang en leefde in Canada.
      Uit de kraag van bot rond zijn nek staken lange stekels.
      Hij had ook één lange hoorn op zijn neus, tot 60 centimeter lang.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Laat-Krijt · vleeseter
    info: |
      Quetzalcoatlus was een vliegend reptiel en geen dinosaurus, en leefde in Noord-Amerika.
      Zijn vleugels waren ongeveer 10 meter breed, en staand op de grond was hij zo groot als een giraf.
      Hij is genoemd naar Quetzalcoatl, een gevederde slangengod van de Azteken.
  dino.compsognathus:
    label: Compsognathus
    summary: Laat-Jura · vleeseter
    info: |
      Compsognathus was maar ongeveer 1 meter lang, zo groot als een kip, en leefde in Duitsland en Frankrijk.
      Hij was een van de kleinste dinosaurussen en rende snel op twee poten.
      In één fossiel zit nog een kleine hagedis in zijn maag, zijn laatste maaltijd.
  dino.oviraptor:
    label: Oviraptor
    summary: Laat-Krijt · alleseter
    info: |
      Oviraptor was ongeveer 2 meter lang, had veren en een snavel, en leefde in Mongolië.
      Zijn naam betekent "eierdief", omdat hij op een nest met eieren werd gevonden.
      Later ontdekten wetenschappers dat het eieren van zijn eigen soort waren: hij was dus een zorgzame ouder en geen dief.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Laat-Jura · planteneter
    info: |
      Kentrosaurus was ongeveer 4,5 meter lang en leefde in Tanzania, in Afrika.
      Hij was een kleiner familielid van Stegosaurus, met platen op zijn nek en lange stekels op zijn rug en staart.
      Zijn naam betekent "stekelhagedis".
  dino.microraptor:
    label: Microraptor
    summary: Vroeg-Krijt · vleeseter
    info: |
      Microraptor was nog geen meter lang en leefde in China.
      Hij had vleugels met veren aan zijn armen én aan zijn poten, dus vier vleugels.
      Zijn veren waren zwart en glanzend, net als die van een kraai.
  dino.protoceratops:
    label: Protoceratops
    summary: Laat-Krijt · planteneter
    info: |
      Protoceratops was ongeveer 2 meter lang, zo groot als een schaap, en leefde in Mongolië en China.
      Hij had een kraag van bot en een snavel als een papegaai, maar geen echte hoorns.
      Een beroemd fossiel laat een Protoceratops en een Velociraptor zien die met elkaar vechten.
