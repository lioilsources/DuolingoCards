lang: ja
pivot: false
title: 恐竜
cards:
  dino.t_rex:
    label: ティラノサウルス
    summary: 白亜紀後期 · 肉食
    info: |
      ティラノサウルス・レックスは全長が最大12メートルもあり、北アメリカにすんでいました。
      歯はバナナくらいの大きさで、かむ力は陸の動物でいちばん強かったのです。
      腕は短かったけれど、力は強かったのです。
  dino.triceratops:
    label: トリケラトプス
    summary: 白亜紀後期 · 草食
    info: |
      トリケラトプスは全長約9メートルで、北アメリカにすんでいました。
      名前は「3本の角がある顔」という意味で、上の2本の角は長さが約1メートルありました。
      ティラノサウルスと同じ時代に、同じ場所でくらしていました。
  dino.stegosaurus:
    label: ステゴサウルス
    summary: ジュラ紀後期 · 草食
    info: |
      ステゴサウルスは全長約9メートルで、北アメリカとポルトガルにすんでいました。
      背中には大きな板があり、しっぽにはするどいトゲがありました。
      とても昔の恐竜で、ティラノサウルスとの時代のへだたりは、ティラノサウルスとわたしたちのへだたりよりも大きいのです。
  dino.brachiosaurus:
    label: ブラキオサウルス
    summary: ジュラ紀後期 · 草食
    info: |
      ブラキオサウルスは全長約22メートルで、北アメリカにすんでいました。
      前あしが後ろあしより長いので、4階建ての建物ほどの高さの葉っぱにもとどきました。
      名前は「腕のトカゲ」という意味です。
  dino.velociraptor:
    label: ヴェロキラプトル
    summary: 白亜紀後期 · 肉食
    info: |
      ヴェロキラプトルは全長約2メートルしかなく、七面鳥くらいの大きさで、モンゴルと中国にすんでいました。
      体は羽毛におおわれていましたが、空は飛べませんでした。
      それぞれの足に、えものをつかまえるための大きなカーブしたかぎづめがありました。
  dino.ankylosaurus:
    label: アンキロサウルス
    summary: 白亜紀後期 · 草食
    info: |
      アンキロサウルスは全長約7メートルで、北アメリカにすんでいました。
      背中は骨のよろいでおおわれていて、まるで生きた戦車のようでした。
      しっぽの先には、身を守るための重い骨のこぶがありました。
  dino.spinosaurus:
    label: スピノサウルス
    summary: 白亜紀後期 · 肉食
    info: |
      スピノサウルスは全長約14メートルで、ティラノサウルスよりも長く、北アフリカにすんでいました。
      背中に高い帆があり、川の近くにすんで魚をとっていました。
      最初に見つかった化石は、第二次世界大戦のときにこわれてしまいました。
  dino.parasaurolophus:
    label: パラサウロロフス
    summary: 白亜紀後期 · 草食
    info: |
      パラサウロロフスは全長約9メートルで、北アメリカにすんでいました。
      頭には長くて中が空っぽのトサカがあり、口はアヒルのようなくちばしでした。
      トサカに息を通して、トランペットのような大きな音を出せました。
  dino.pteranodon:
    label: プテラノドン
    summary: 白亜紀後期 · 肉食
    info: |
      プテラノドンは恐竜ではなく空を飛ぶは虫類で、つばさを広げると最大7メートルもありました。
      北アメリカにすみ、海の上を飛んで魚をとっていました。
      くちばしに歯がなかったので、名前は「歯のないつばさ」という意味です。
  dino.diplodocus:
    label: ディプロドクス
    summary: ジュラ紀後期 · 草食
    info: |
      ディプロドクスは全長約25メートルで、バス2台分の長さがあり、北アメリカにすんでいました。
      体の長さのほとんどは、とても長い首と、むちのように細いしっぽでした。
      小さなくいのような歯で、植物の葉っぱをしごきとって食べました。
  dino.brontosaurus:
    label: ブロントサウルス
    summary: ジュラ紀後期 · 草食
    info: |
      ブロントサウルスは全長約22メートルで、北アメリカにすんでいました。
      名前は「かみなりトカゲ」という意味で、体重はゾウ3頭分くらいありました。
      100年以上もアパトサウルスと同じだと考えられていましたが、2015年に自分の名前を取りもどしました。
  dino.iguanodon:
    label: イグアノドン
    summary: 白亜紀前期 · 草食
    info: |
      イグアノドンは全長約10メートルで、ヨーロッパにすんでいました。
      親指にはするどいトゲがあり、科学者は最初、それを鼻の上の角だと思っていました。
      1825年に、世界でいちばん最初に名前がつけられた恐竜のひとつになりました。
  dino.pachycephalosaurus:
    label: パキケファロサウルス
    summary: 白亜紀後期 · 草食
    info: |
      パキケファロサウルスは全長約4.5メートルで、北アメリカにすんでいました。
      頭のてっぺんの骨は、厚さが最大25センチメートルもありました。
      名前は「厚い頭のトカゲ」という意味です。
  dino.archaeopteryx:
    label: 始祖鳥
    summary: ジュラ紀後期 · 肉食
    info: |
      始祖鳥はカラスくらいの大きさで、今のドイツにあたる場所にすんでいました。
      鳥のような羽毛とつばさがありましたが、歯や、つばさのかぎづめ、骨のある長いしっぽもありました。
      鳥が恐竜の生きている親せきだということを教えてくれます。
  dino.allosaurus:
    label: アロサウルス
    summary: ジュラ紀後期 · 肉食
    info: |
      アロサウルスは全長約9メートルで、北アメリカとポルトガルにすんでいました。
      その時代でいちばん大きなハンターで、目の上に小さな角がありました。
      あるアロサウルスの化石には、ステゴサウルスのトゲのあるしっぽでつけられたきずがあります。
  dino.mosasaurus:
    label: モササウルス
    summary: 白亜紀後期 · 肉食
    info: |
      モササウルスは恐竜ではなく、全長約13メートルの巨大な海のは虫類です。
      トカゲやヘビのなかまで、空気をすうために水面に上がってこなければなりませんでした。
      最初の化石は、オランダのマース川の近くで見つかりました。
  dino.plesiosaurus:
    label: プレシオサウルス
    summary: ジュラ紀前期 · 肉食
    info: |
      プレシオサウルスは恐竜ではなく、全長約3メートルの海のは虫類です。
      長い首と小さな頭、そして泳ぐための大きなヒレが4つありました。
      最初の完全な骨格は、イギリスで化石ハンターのメアリー・アニングが見つけました。
  dino.ichthyosaurus:
    label: イクチオサウルス
    summary: ジュラ紀前期 · 肉食
    info: |
      イクチオサウルスは恐竜でも魚でもなく、全長約2メートルの海のは虫類です。
      イルカのような形で、暗い水の中でも見えるとても大きな目をしていました。
      卵をうむのではなく、海の中で赤ちゃんをうみました。
  dino.dimetrodon:
    label: ディメトロドン
    summary: ペルム紀前期 · 肉食
    info: |
      ディメトロドンは恐竜ではありません。最初の恐竜より約4000万年も前に生きていました。
      全長は最大4メートルで、背中に高い帆があり、北アメリカとヨーロッパにすんでいました。
      恐竜よりも、わたしたち人間のようなほ乳類に近いなかまです。
  dino.carnotaurus:
    label: カルノタウルス
    summary: 白亜紀後期 · 肉食
    info: |
      カルノタウルスは全長約8メートルで、南アメリカのアルゼンチンにすんでいました。
      目の上に2本の角があったので、名前は「肉食の雄牛」という意味です。
      腕はとても小さく、ティラノサウルスの腕よりもさらに小さかったのです。
  dino.therizinosaurus:
    label: テリジノサウルス
    summary: 白亜紀後期 · 草食
    info: |
      テリジノサウルスは全長約9メートルで、モンゴルにすんでいました。
      かぎづめは学校で使うものさしよりも長く、知られている動物の中でいちばん長いかぎづめでした。
      ティラノサウルスのなかまなのに、植物を食べていました。
  dino.gallimimus:
    label: ガリミムス
    summary: 白亜紀後期 · 雑食
    info: |
      ガリミムスは全長約6メートルで、モンゴルにすんでいました。
      大きなダチョウのような姿で、歯のないくちばしと長いあしをもっていました。
      恐竜の中でも、とても足の速いもののひとつでした。
  dino.dilophosaurus:
    label: ディロフォサウルス
    summary: ジュラ紀前期 · 肉食
    info: |
      ディロフォサウルスは全長約7メートルで、北アメリカにすんでいました。
      頭に2枚のうすいトサカがあり、名前は「2つのトサカをもつトカゲ」という意味です。
      映画では毒をはいたり首にえりまきがあったりしますが、どちらも証拠はありません。
  dino.styracosaurus:
    label: スティラコサウルス
    summary: 白亜紀後期 · 草食
    info: |
      スティラコサウルスは全長約5.5メートルで、カナダにすんでいました。
      首のまわりの骨のフリルから、長いトゲがつき出ていました。
      鼻の上にも、長さが最大60センチメートルの長い角が1本ありました。
  dino.quetzalcoatlus:
    label: ケツァルコアトルス
    summary: 白亜紀後期 · 肉食
    info: |
      ケツァルコアトルスは恐竜ではなく空を飛ぶは虫類で、北アメリカにすんでいました。
      つばさを広げると約10メートルあり、地面に立つとキリンと同じくらいの高さでした。
      名前は、アステカの羽毛のあるヘビの神さま、ケツァルコアトルからつけられました。
  dino.compsognathus:
    label: コンプソグナトゥス
    summary: ジュラ紀後期 · 肉食
    info: |
      コンプソグナトゥスは全長約1メートルしかなく、ニワトリくらいの大きさで、ドイツとフランスにすんでいました。
      とても小さな恐竜のひとつで、2本のあしで速く走りました。
      ある化石のおなかの中には、最後に食べた小さなトカゲがまだ残っています。
  dino.oviraptor:
    label: オヴィラプトル
    summary: 白亜紀後期 · 雑食
    info: |
      オヴィラプトルは全長約2メートルで、羽毛とくちばしがあり、モンゴルにすんでいました。
      卵の巣の上で見つかったので、名前は「卵どろぼう」という意味です。
      あとで、その卵は自分のなかまの卵だとわかりました。どろぼうではなく、やさしい親だったのです。
  dino.kentrosaurus:
    label: ケントロサウルス
    summary: ジュラ紀後期 · 草食
    info: |
      ケントロサウルスは全長約4.5メートルで、アフリカのタンザニアにすんでいました。
      ステゴサウルスの小さななかまで、首には板が、背中としっぽには長いトゲがありました。
      名前は「トゲのあるトカゲ」という意味です。
  dino.microraptor:
    label: ミクロラプトル
    summary: 白亜紀前期 · 肉食
    info: |
      ミクロラプトルは全長1メートルもなく、中国にすんでいました。
      腕にもあしにも羽毛のつばさがあったので、つばさが4枚ありました。
      羽毛はカラスのように黒くてつやつやしていました。
  dino.protoceratops:
    label: プロトケラトプス
    summary: 白亜紀後期 · 草食
    info: |
      プロトケラトプスは全長約2メートルで、ヒツジくらいの大きさで、モンゴルと中国にすんでいました。
      骨のフリルとオウムのようなくちばしがありましたが、本物の角はありませんでした。
      有名な化石には、プロトケラトプスとヴェロキラプトルが戦ったままの姿で残っています。
