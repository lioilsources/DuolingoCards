lang: sl
pivot: false
title: Dinozavri
cards:
  dino.t_rex:
    label: Tiranozaver
    summary: Pozna kreda · mesojedec
    info: |
      Tiranozaver je bil dolg do 12 metrov in je živel v Severni Ameriki.
      Zobje so mu bili veliki kot banane, ugriz pa je imel najmočnejši med vsemi kopenskimi živalmi.
      Roke je imel kratke, a močne.
  dino.triceratops:
    label: Triceratops
    summary: Pozna kreda · rastlinojedec
    info: |
      Triceratops je bil dolg približno 9 metrov in je živel v Severni Ameriki.
      Njegovo ime pomeni »obraz s tremi rogovi«, zgornja rogova pa sta bila dolga približno meter.
      Živel je ob istem času in na istih krajih kot tiranozaver.
  dino.stegosaurus:
    label: Stegozaver
    summary: Pozna jura · rastlinojedec
    info: |
      Stegozaver je bil dolg približno 9 metrov in je živel v Severni Ameriki in na Portugalskem.
      Na hrbtu je imel velike plošče, na repu pa ostre bodice.
      Živel je tako davno, da ga je od tiranozavra ločilo več časa kot nas danes.
  dino.brachiosaurus:
    label: Brahiozaver
    summary: Pozna jura · rastlinojedec
    info: |
      Brahiozaver je bil dolg približno 22 metrov in je živel v Severni Ameriki.
      Sprednje noge je imel daljše od zadnjih, zato je segel do listja tako visoko kot štirinadstropna hiša.
      Njegovo ime pomeni »kuščar z rokami«.
  dino.velociraptor:
    label: Velociraptor
    summary: Pozna kreda · mesojedec
    info: |
      Velociraptor je bil dolg le približno 2 metra, velik kot puran, in je živel v Mongoliji in na Kitajskem.
      Pokrivalo ga je perje, vendar ni znal leteti.
      Na vsaki nogi je imel velik ukrivljen krempelj za lovljenje plena.
  dino.ankylosaurus:
    label: Ankilozaver
    summary: Pozna kreda · rastlinojedec
    info: |
      Ankilozaver je bil dolg približno 7 metrov in je živel v Severni Ameriki.
      Hrbet mu je pokrival koščen oklep, kot živemu tanku.
      Na koncu repa je imel težak koščen kij, s katerim se je branil.
  dino.spinosaurus:
    label: Spinozaver
    summary: Pozna kreda · mesojedec
    info: |
      Spinozaver je bil dolg približno 14 metrov, celo več kot tiranozaver, in je živel v severni Afriki.
      Na hrbtu je imel visoko jadro in je živel ob rekah, kjer je lovil ribe.
      Njegovi prvi fosili so bili uničeni med drugo svetovno vojno.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Pozna kreda · rastlinojedec
    info: |
      Parasaurolophus je bil dolg približno 9 metrov in je živel v Severni Ameriki.
      Na glavi je imel dolg votel greben in kljun kot raca.
      Ko je skozi greben pihal zrak, je oddajal glasne zvoke, podobne trobenti.
  dino.pteranodon:
    label: Pteranodon
    summary: Pozna kreda · mesojedec
    info: |
      Pteranodon je bil leteči plazilec, ne dinozaver, njegova krila pa so merila do 7 metrov v razponu.
      Živel je v Severni Ameriki in letal nad morjem, kjer je lovil ribe.
      Njegovo ime pomeni »krilo brez zob«, ker je imel kljun brez zob.
  dino.diplodocus:
    label: Diplodok
    summary: Pozna jura · rastlinojedec
    info: |
      Diplodok je bil dolg približno 25 metrov, kot dva avtobusa, in je živel v Severni Ameriki.
      Večino te dolžine sta predstavljala zelo dolg vrat in tanek rep, podoben biču.
      Imel je majhne zobe v obliki klinov, s katerimi je smukal listje z rastlin.
  dino.brontosaurus:
    label: Brontozaver
    summary: Pozna jura · rastlinojedec
    info: |
      Brontozaver je bil dolg približno 22 metrov in je živel v Severni Ameriki.
      Njegovo ime pomeni »gromovni kuščar«, tehtal pa je približno toliko kot trije sloni.
      Več kot 100 let so znanstveniki mislili, da je apatozaver, leta 2015 pa je dobil svoje ime nazaj.
  dino.iguanodon:
    label: Iguanodon
    summary: Zgodnja kreda · rastlinojedec
    info: |
      Iguanodon je bil dolg približno 10 metrov in je živel v Evropi.
      Na vsakem palcu je imel oster trn, za katerega so znanstveniki sprva mislili, da je rog na nosu.
      Leta 1825 je postal eden prvih dinozavrov, ki so sploh dobili ime.
  dino.pachycephalosaurus:
    label: Pahicefalozaver
    summary: Pozna kreda · rastlinojedec
    info: |
      Pahicefalozaver je bil dolg približno 4,5 metra in je živel v Severni Ameriki.
      Kost na vrhu njegove glave je bila debela do 25 centimetrov.
      Njegovo ime pomeni »debeloglavi kuščar«.
  dino.archaeopteryx:
    label: Arheopteriks
    summary: Pozna jura · mesojedec
    info: |
      Arheopteriks je bil velik približno kot krokar in je živel na območju današnje Nemčije.
      Imel je perje in krila kot ptica, pa tudi zobe, kremplje na krilih in dolg koščen rep.
      Kaže nam, da so ptice živi sorodniki dinozavrov.
  dino.allosaurus:
    label: Alozaver
    summary: Pozna jura · mesojedec
    info: |
      Alozaver je bil dolg približno 9 metrov in je živel v Severni Ameriki in na Portugalskem.
      Bil je največji lovec svojega časa in je imel nad očmi majhne rožičke.
      Na enem fosilu alozavra je rana, ki mu jo je zadal bodičasti rep stegozavra.
  dino.mosasaurus:
    label: Mozazaver
    summary: Pozna kreda · mesojedec
    info: |
      Mozazaver je bil ogromen morski plazilec, ne dinozaver, dolg približno 13 metrov.
      Njegovi sorodniki so kuščarji in kače, in da bi vdihnil zrak, je moral priplavati na površje.
      Njegov prvi fosil so našli na Nizozemskem, ob reki Meuse.
  dino.plesiosaurus:
    label: Pleziozaver
    summary: Zgodnja jura · mesojedec
    info: |
      Pleziozaver je bil morski plazilec, ne dinozaver, dolg približno 3 metre.
      Imel je dolg vrat, majhno glavo in štiri velike plavuti za plavanje.
      Njegovo prvo celo okostje je v Angliji našla zbiralka fosilov Mary Anning.
  dino.ichthyosaurus:
    label: Ihtiozaver
    summary: Zgodnja jura · mesojedec
    info: |
      Ihtiozaver je bil morski plazilec, ne dinozaver in ne riba, dolg približno 2 metra.
      Bil je podoben delfinu in je imel zelo velike oči, da je videl v temni vodi.
      Namesto jajc je v morju kotil žive mladiče.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Zgodnji perm · mesojedec
    info: |
      Dimetrodon ni bil dinozaver: živel je približno 40 milijonov let pred prvimi dinozavri.
      Bil je dolg do 4 metre, na hrbtu je imel visoko jadro in je živel v Severni Ameriki in Evropi.
      V bližjem sorodu je s sesalci, kot smo mi, kot z dinozavri.
  dino.carnotaurus:
    label: Karnotaver
    summary: Pozna kreda · mesojedec
    info: |
      Karnotaver je bil dolg približno 8 metrov in je živel v Argentini, v Južni Ameriki.
      Njegovo ime pomeni »mesojedi bik«, ker je imel nad očmi dva roga.
      Roke je imel drobcene, še manjše od tiranozavrovih.
  dino.therizinosaurus:
    label: Terizinozaver
    summary: Pozna kreda · rastlinojedec
    info: |
      Terizinozaver je bil dolg približno 9 metrov in je živel v Mongoliji.
      Njegovi kremplji so bili daljši od šolskega ravnila, najdaljši med vsemi znanimi živalmi.
      Čeprav je bil sorodnik tiranozavra, je jedel rastline.
  dino.gallimimus:
    label: Galimimus
    summary: Pozna kreda · vsejedec
    info: |
      Galimimus je bil dolg približno 6 metrov in je živel v Mongoliji.
      Bil je podoben velikemu noju, s kljunom brez zob in dolgimi nogami.
      Bil je eden najhitrejših tekačev med dinozavri.
  dino.dilophosaurus:
    label: Dilofozaver
    summary: Zgodnja jura · mesojedec
    info: |
      Dilofozaver je bil dolg približno 7 metrov in je živel v Severni Ameriki.
      Na glavi je imel dva tanka grebena, njegovo ime pa pomeni »kuščar z dvema grebenoma«.
      V filmih pljuva strup in ima ovratnik okoli vratu, vendar za nič od tega ni dokazov.
  dino.styracosaurus:
    label: Stirakozaver
    summary: Pozna kreda · rastlinojedec
    info: |
      Stirakozaver je bil dolg približno 5,5 metra in je živel v Kanadi.
      Iz koščenega ovratnika okoli vratu so mu štrlele dolge bodice.
      Na nosu je imel tudi en dolg rog, dolg do 60 centimetrov.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Pozna kreda · mesojedec
    info: |
      Quetzalcoatlus je bil leteči plazilec, ne dinozaver, in je živel v Severni Ameriki.
      Razpon kril je imel približno 10 metrov, ko je stal na tleh, pa je bil visok kot žirafa.
      Ime je dobil po Quetzalcoatlu, pernati kači, bogu Aztekov.
  dino.compsognathus:
    label: Kompsognat
    summary: Pozna jura · mesojedec
    info: |
      Kompsognat je bil dolg le približno 1 meter, velik kot kokoš, in je živel v Nemčiji in Franciji.
      Bil je eden najmanjših dinozavrov in je hitro tekel po dveh nogah.
      En fosil ima v želodcu še majhnega kuščarja, svoj zadnji obrok.
  dino.oviraptor:
    label: Oviraptor
    summary: Pozna kreda · vsejedec
    info: |
      Oviraptor je bil dolg približno 2 metra, imel je perje in kljun in je živel v Mongoliji.
      Njegovo ime pomeni »tat jajc«, ker so ga našli na gnezdu z jajci.
      Pozneje so znanstveniki ugotovili, da so bila to jajca njegove vrste, zato je bil skrben starš, ne tat.
  dino.kentrosaurus:
    label: Kentrozaver
    summary: Pozna jura · rastlinojedec
    info: |
      Kentrozaver je bil dolg približno 4,5 metra in je živel v Tanzaniji, v Afriki.
      Bil je manjši sorodnik stegozavra, s ploščami na vratu in dolgimi bodicami na hrbtu in repu.
      Njegovo ime pomeni »bodičasti kuščar«.
  dino.microraptor:
    label: Mikroraptor
    summary: Zgodnja kreda · mesojedec
    info: |
      Mikroraptor je bil dolg manj kot 1 meter in je živel na Kitajskem.
      Pernata krila je imel na rokah in na nogah, zato je imel štiri krila.
      Njegovo perje je bilo črno in sijoče kot vranino.
  dino.protoceratops:
    label: Protoceratops
    summary: Pozna kreda · rastlinojedec
    info: |
      Protoceratops je bil dolg približno 2 metra, velik kot ovca, in je živel v Mongoliji in na Kitajskem.
      Imel je koščen ovratnik in kljun kot papiga, pravih rogov pa ni imel.
      Znan fosil prikazuje protoceratopsa in velociraptorja, ujeta v boju.
