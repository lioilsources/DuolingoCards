lang: sr
pivot: false
title: Диносауруси
cards:
  dino.t_rex:
    label: Тираносаурус
    summary: Касна креда · месождер
    info: |
      Тираносаурус рекс био је дугачак до 12 метара и живео је у Северној Америци.
      Зуби су му били велики као банане, а имао је најјачи угриз од свих копнених животиња.
      Предње ноге су му биле кратке, али снажне.
  dino.triceratops:
    label: Трицератопс
    summary: Касна креда · биљождер
    info: |
      Трицератопс је био дугачак око 9 метара и живео је у Северној Америци.
      Име му значи „лице с три рога“, а два горња рога била су дуга око један метар.
      Живео је у исто време и на истим местима као тираносаурус.
  dino.stegosaurus:
    label: Стегосаурус
    summary: Касна јура · биљождер
    info: |
      Стегосаурус је био дугачак око 9 метара и живео је у Северној Америци и Португалији.
      На леђима је имао велике плоче, а на репу оштре шиљке.
      Живео је толико давно да је између њега и тираносауруса прошло више времена него између тираносауруса и нас.
  dino.brachiosaurus:
    label: Брахиосаурус
    summary: Касна јура · биљождер
    info: |
      Брахиосаурус је био дугачак око 22 метра и живео је у Северној Америци.
      Предње ноге биле су му дуже од задњих, па је досезао лишће на висини зграде од четири спрата.
      Име му значи „гуштер с рукама“.
  dino.velociraptor:
    label: Велоцираптор
    summary: Касна креда · месождер
    info: |
      Велоцираптор је био дугачак само око 2 метра, велик као ћурка, и живео је у Монголији и Кини.
      Био је прекривен перјем, али није могао да лети.
      На свакој нози имао је велику закривљену канџу за хватање плена.
  dino.ankylosaurus:
    label: Анкилосаурус
    summary: Касна креда · биљождер
    info: |
      Анкилосаурус је био дугачак око 7 метара и живео је у Северној Америци.
      Леђа су му била прекривена коштаним оклопом, као код живог тенка.
      На крају репа имао је тежак коштани буздован којим се бранио.
  dino.spinosaurus:
    label: Спиносаурус
    summary: Касна креда · месождер
    info: |
      Спиносаурус је био дугачак око 14 метара, чак дужи од тираносауруса, и живео је у Северној Африци.
      На леђима је имао високо једро и живео је поред река, где је ловио рибу.
      Његови први фосили уништени су током Другог светског рата.
  dino.parasaurolophus:
    label: Паразауролофус
    summary: Касна креда · биљождер
    info: |
      Паразауролофус је био дугачак око 9 метара и живео је у Северној Америци.
      На глави је имао дугу шупљу кресту, а кљун као у патке.
      Кад би дувао ваздух кроз кресту, правио је гласне звуке налик на трубу.
  dino.pteranodon:
    label: Птеранодон
    summary: Касна креда · месождер
    info: |
      Птеранодон је био летећи гмизавац, а не диносаурус, а крила су му била широка до 7 метара.
      Живео је у Северној Америци и летео изнад мора да би ловио рибу.
      Име му значи „крило без зуба“, јер у кљуну није имао зубе.
  dino.diplodocus:
    label: Диплодокус
    summary: Касна јура · биљождер
    info: |
      Диплодокус је био дугачак око 25 метара, као два аутобуса, и живео је у Северној Америци.
      Највећи део његове дужине чинили су веома дуг врат и танак реп налик на бич.
      Ситним зубима налик на клинове кидао је лишће с биљака.
  dino.brontosaurus:
    label: Бронтосаурус
    summary: Касна јура · биљождер
    info: |
      Бронтосаурус је био дугачак око 22 метра и живео је у Северној Америци.
      Име му значи „гуштер грома“, а био је тежак отприлике као три слона.
      Више од 100 година научници су мислили да је то апатосаурус, али 2015. године добио је назад своје име.
  dino.iguanodon:
    label: Игуанодон
    summary: Рана креда · биљождер
    info: |
      Игуанодон је био дугачак око 10 метара и живео је у Европи.
      На сваком палцу имао је оштар шиљак, за који су научници у почетку мислили да је рог на носу.
      Године 1825. постао је један од првих диносауруса који су добили име.
  dino.pachycephalosaurus:
    label: Пахицефалосаурус
    summary: Касна креда · биљождер
    info: |
      Пахицефалосаурус је био дугачак око 4,5 метра и живео је у Северној Америци.
      Кост на темену била му је дебела до 25 центиметара.
      Име му значи „гуштер дебеле главе“.
  dino.archaeopteryx:
    label: Археоптерикс
    summary: Касна јура · месождер
    info: |
      Археоптерикс је био велик као гавран и живео је на подручју данашње Немачке.
      Имао је перје и крила као птица, али и зубе, канџе на крилима и дуг коштани реп.
      Он показује да су птице живи рођаци диносауруса.
  dino.allosaurus:
    label: Алосаурус
    summary: Касна јура · месождер
    info: |
      Алосаурус је био дугачак око 9 метара и живео је у Северној Америци и Португалији.
      Био је највећи ловац свог доба и имао је мале рогове изнад очију.
      На једном фосилу алосауруса види се рана од бодљикавог репа стегосауруса.
  dino.mosasaurus:
    label: Мосасаурус
    summary: Касна креда · месождер
    info: |
      Мосасаурус је био огроман морски гмизавац, а не диносаурус, дугачак око 13 метара.
      Рођаци су му гуштери и змије, а морао је да излази на површину да удахне ваздух.
      Његов први фосил пронађен је у Холандији, поред реке Мезе.
  dino.plesiosaurus:
    label: Плезиосаурус
    summary: Рана јура · месождер
    info: |
      Плезиосаурус је био морски гмизавац, а не диносаурус, дугачак око 3 метра.
      Имао је дуг врат, малу главу и четири велика пераја за пливање.
      Његов први цео скелет пронашла је у Енглеској сакупљачица фосила Мери Анинг.
  dino.ichthyosaurus:
    label: Ихтиосаурус
    summary: Рана јура · месождер
    info: |
      Ихтиосаурус је био морски гмизавац – ни диносаурус ни риба – дугачак око 2 метра.
      Личио је на делфина и имао је веома велике очи да би видео у тамној води.
      Уместо да полаже јаја, рађао је живе младунце у мору.
  dino.dimetrodon:
    label: Диметродон
    summary: Рани перм · месождер
    info: |
      Диметродон није био диносаурус: живео је око 40 милиона година пре првих диносауруса.
      Био је дугачак до 4 метра, имао је високо једро на леђима и живео је у Северној Америци и Европи.
      Ближи је сисарима, попут нас, него диносаурусима.
  dino.carnotaurus:
    label: Карнотаурус
    summary: Касна креда · месождер
    info: |
      Карнотаурус је био дугачак око 8 метара и живео је у Аргентини, у Јужној Америци.
      Име му значи „бик месождер“, јер је изнад очију имао два рога.
      Предње ноге биле су му сићушне, чак мање него код тираносауруса.
  dino.therizinosaurus:
    label: Теризиносаурус
    summary: Касна креда · биљождер
    info: |
      Теризиносаурус је био дугачак око 9 метара и живео је у Монголији.
      Канџе су му биле дуже од школског лењира – најдуже канџе од свих познатих животиња.
      Иако је био рођак тираносауруса, хранио се биљем.
  dino.gallimimus:
    label: Галимимус
    summary: Касна креда · сваштојед
    info: |
      Галимимус је био дугачак око 6 метара и живео је у Монголији.
      Личио је на великог ноја, с кљуном без зуба и дугим ногама.
      Био је један од најбржих тркача међу диносаурусима.
  dino.dilophosaurus:
    label: Дилофосаурус
    summary: Рана јура · месождер
    info: |
      Дилофосаурус је био дугачак око 7 метара и живео је у Северној Америци.
      На глави је имао две танке кресте, а име му значи „гуштер с две кресте“.
      У филмовима пљује отров и шири крагну око врата, али за то нема доказа.
  dino.styracosaurus:
    label: Стиракосаурус
    summary: Касна креда · биљождер
    info: |
      Стиракосаурус је био дугачак око 5,5 метара и живео је у Канади.
      Из коштане крагне око врата вирили су му дуги шиљци.
      Имао је и један дуг рог на носу, дугачак до 60 центиметара.
  dino.quetzalcoatlus:
    label: Кецалкоатлус
    summary: Касна креда · месождер
    info: |
      Кецалкоатлус је био летећи гмизавац, а не диносаурус, и живео је у Северној Америци.
      Крила су му била широка око 10 метара, а кад би стајао на тлу, био је висок као жирафа.
      Добио је име по Кецалкоатлу, пернатој змији, богу Астека.
  dino.compsognathus:
    label: Компсогнатус
    summary: Касна јура · месождер
    info: |
      Компсогнатус је био дугачак само око 1 метар, велик као кокошка, и живео је у Немачкој и Француској.
      Био је један од најмањих диносауруса и брзо је трчао на две ноге.
      У стомаку једног фосила и данас се налази мали гуштер – његов последњи оброк.
  dino.oviraptor:
    label: Овираптор
    summary: Касна креда · сваштојед
    info: |
      Овираптор је био дугачак око 2 метра, имао је перје и кљун, и живео је у Монголији.
      Име му значи „крадљивац јаја“, јер је пронађен на гнезду с јајима.
      Касније су научници открили да су то била јаја његове врсте, па је био брижан родитељ, а не лопов.
  dino.kentrosaurus:
    label: Кентросаурус
    summary: Касна јура · биљождер
    info: |
      Кентросаурус је био дугачак око 4,5 метра и живео је у Танзанији, у Африци.
      Био је мањи рођак стегосауруса, с плочама на врату и дугим шиљцима на леђима и репу.
      Име му значи „бодљикави гуштер“.
  dino.microraptor:
    label: Микрораптор
    summary: Рана креда · месождер
    info: |
      Микрораптор је био дугачак мање од 1 метра и живео је у Кини.
      Имао је перната крила и на предњим и на задњим ногама, дакле четири крила.
      Перје му је било црно и сјајно, као код вране.
  dino.protoceratops:
    label: Протоцератопс
    summary: Касна креда · биљождер
    info: |
      Протоцератопс је био дугачак око 2 метра, велик као овца, и живео је у Монголији и Кини.
      Имао је коштану крагну и кљун као у папагаја, али није имао праве рогове.
      Један чувени фосил приказује протоцератопса и велоцираптора како се боре.
