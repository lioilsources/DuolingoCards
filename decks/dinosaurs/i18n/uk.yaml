lang: uk
pivot: false
title: Динозаври
cards:
  dino.t_rex:
    label: Тиранозавр
    summary: Пізня крейда · хижак
    info: |
      Тиранозавр рекс був завдовжки до 12 метрів і жив у Північній Америці.
      Його зуби були завбільшки з банан, а укус — найсильнішим серед усіх наземних тварин.
      Лапи в нього були короткі, але сильні.
  dino.triceratops:
    label: Трицератопс
    summary: Пізня крейда · травоїдний
    info: |
      Трицератопс був завдовжки близько 9 метрів і жив у Північній Америці.
      Його ім'я означає «трирога морда», а два верхні роги були завдовжки близько метра.
      Він жив у той самий час і в тих самих місцях, що й тиранозавр.
  dino.stegosaurus:
    label: Стегозавр
    summary: Пізня юра · травоїдний
    info: |
      Стегозавр був завдовжки близько 9 метрів і жив у Північній Америці та Португалії.
      На спині в нього були великі пластини, а на хвості — гострі шипи.
      Він жив так давно, що між ним і тиранозавром минуло більше часу, ніж між тиранозавром і нами.
  dino.brachiosaurus:
    label: Брахіозавр
    summary: Пізня юра · травоїдний
    info: |
      Брахіозавр був завдовжки близько 22 метрів і жив у Північній Америці.
      Передні ноги в нього були довші за задні, тож він діставав до листя на висоті чотириповерхового будинку.
      Його ім'я означає «ящір-рука».
  dino.velociraptor:
    label: Велоцираптор
    summary: Пізня крейда · хижак
    info: |
      Велоцираптор був завдовжки лише близько 2 метрів, завбільшки з індика, і жив у Монголії та Китаї.
      Він був укритий пір'ям, але літати не вмів.
      На кожній нозі в нього був великий вигнутий кіготь для ловлі здобичі.
  dino.ankylosaurus:
    label: Анкілозавр
    summary: Пізня крейда · травоїдний
    info: |
      Анкілозавр був завдовжки близько 7 метрів і жив у Північній Америці.
      Його спину вкривав кістяний панцир, наче в живого танка.
      На кінці хвоста в нього була важка кістяна булава для захисту.
  dino.spinosaurus:
    label: Спінозавр
    summary: Пізня крейда · хижак
    info: |
      Спінозавр був завдовжки близько 14 метрів, навіть довший за тиранозавра, і жив у Північній Африці.
      На спині в нього було високе вітрило, а жив він біля річок і ловив рибу.
      Його перші скам'янілості загинули під час Другої світової війни.
  dino.parasaurolophus:
    label: Паразауролоф
    summary: Пізня крейда · травоїдний
    info: |
      Паразауролоф був завдовжки близько 9 метрів і жив у Північній Америці.
      На голові в нього був довгий порожнистий гребінь, а дзьоб — як у качки.
      Продуваючи повітря крізь гребінь, він видавав гучні звуки, схожі на звук труби.
  dino.pteranodon:
    label: Птеранодон
    summary: Пізня крейда · хижак
    info: |
      Птеранодон був літаючим ящером, а не динозавром, і розмах його крил сягав 7 метрів.
      Він жив у Північній Америці й літав над морем, щоб ловити рибу.
      Його ім'я означає «крилатий і беззубий», бо в його дзьобі не було зубів.
  dino.diplodocus:
    label: Диплодок
    summary: Пізня юра · травоїдний
    info: |
      Диплодок був завдовжки близько 25 метрів, як два автобуси, і жив у Північній Америці.
      Більшу частину його довжини становили дуже довга шия і тонкий хвіст, схожий на батіг.
      Маленькими зубами-кілочками він обривав листя з рослин.
  dino.brontosaurus:
    label: Бронтозавр
    summary: Пізня юра · травоїдний
    info: |
      Бронтозавр був завдовжки близько 22 метрів і жив у Північній Америці.
      Його ім'я означає «громовий ящір», а важив він приблизно як три слони.
      Понад 100 років науковці вважали його апатозавром, але 2015 року йому повернули власне ім'я.
  dino.iguanodon:
    label: Ігуанодон
    summary: Рання крейда · травоїдний
    info: |
      Ігуанодон був завдовжки близько 10 метрів і жив у Європі.
      На кожному великому пальці в нього був гострий шип — спершу науковці думали, що це ріг на носі.
      1825 року він став одним із найперших динозаврів, які отримали ім'я.
  dino.pachycephalosaurus:
    label: Пахіцефалозавр
    summary: Пізня крейда · травоїдний
    info: |
      Пахіцефалозавр був завдовжки близько 4,5 метра і жив у Північній Америці.
      Кістка на маківці його голови була завтовшки до 25 сантиметрів.
      Його ім'я означає «товстоголовий ящір».
  dino.archaeopteryx:
    label: Археоптерикс
    summary: Пізня юра · хижак
    info: |
      Археоптерикс був завбільшки з крука і жив там, де тепер Німеччина.
      Він мав пір'я і крила, як у птаха, але також зуби, кігті на крилах і довгий кістяний хвіст.
      Він показує, що птахи — живі родичі динозаврів.
  dino.allosaurus:
    label: Алозавр
    summary: Пізня юра · хижак
    info: |
      Алозавр був завдовжки близько 9 метрів і жив у Північній Америці та Португалії.
      Він був найбільшим мисливцем свого часу, а над очима мав маленькі ріжки.
      На одній скам'янілості алозавра є рана від шипастого хвоста стегозавра.
  dino.mosasaurus:
    label: Мозазавр
    summary: Пізня крейда · хижак
    info: |
      Мозазавр був величезним морським ящером, а не динозавром, завдовжки близько 13 метрів.
      Його родичі — ящірки та змії, і він виринав на поверхню, щоб дихати повітрям.
      Його першу скам'янілість знайшли в Нідерландах, біля річки Маас.
  dino.plesiosaurus:
    label: Плезіозавр
    summary: Рання юра · хижак
    info: |
      Плезіозавр був морським ящером, а не динозавром, завдовжки близько 3 метрів.
      Він мав довгу шию, маленьку голову і чотири великі ласти для плавання.
      Його перший цілий скелет знайшла в Англії мисливиця за скам'янілостями Мері Еннінг.
  dino.ichthyosaurus:
    label: Іхтіозавр
    summary: Рання юра · хижак
    info: |
      Іхтіозавр був морським ящером — не динозавром і не рибою — завдовжки близько 2 метрів.
      Він був схожий на дельфіна, а величезні очі допомагали йому бачити в темній воді.
      Він не відкладав яєць, а народжував живих дитинчат просто в морі.
  dino.dimetrodon:
    label: Диметродон
    summary: Рання перм · хижак
    info: |
      Диметродон не був динозавром: він жив приблизно за 40 мільйонів років до перших динозаврів.
      Він був завдовжки до 4 метрів, мав на спині високе вітрило і жив у Північній Америці та Європі.
      Він ближчий до ссавців, таких як ми, ніж до динозаврів.
  dino.carnotaurus:
    label: Карнотавр
    summary: Пізня крейда · хижак
    info: |
      Карнотавр був завдовжки близько 8 метрів і жив в Аргентині, у Південній Америці.
      Його ім'я означає «бик-м'ясоїд», бо над очима в нього були два роги.
      Передні лапи в нього були крихітні, навіть менші, ніж у тиранозавра.
  dino.therizinosaurus:
    label: Теризинозавр
    summary: Пізня крейда · травоїдний
    info: |
      Теризинозавр був завдовжки близько 9 метрів і жив у Монголії.
      Його кігті були довші за шкільну лінійку — це найдовші кігті серед усіх відомих тварин.
      Хоча він був родичем тиранозавра, їв він рослини.
  dino.gallimimus:
    label: Галімім
    summary: Пізня крейда · всеїдний
    info: |
      Галімім був завдовжки близько 6 метрів і жив у Монголії.
      Він був схожий на великого страуса: беззубий дзьоб і довгі ноги.
      Він був одним із найшвидших бігунів серед динозаврів.
  dino.dilophosaurus:
    label: Дилофозавр
    summary: Рання юра · хижак
    info: |
      Дилофозавр був завдовжки близько 7 метрів і жив у Північній Америці.
      На голові в нього було два тонкі гребені, а його ім'я означає «двогребеневий ящір».
      У кіно він плюється отрутою і розкриває комір, але доказів ні того, ні іншого немає.
  dino.styracosaurus:
    label: Стиракозавр
    summary: Пізня крейда · травоїдний
    info: |
      Стиракозавр був завдовжки близько 5,5 метра і жив у Канаді.
      З кістяного коміра навколо його шиї стирчали довгі шипи.
      А ще він мав один довгий ріг на носі — до 60 сантиметрів.
  dino.quetzalcoatlus:
    label: Кетцалькоатль
    summary: Пізня крейда · хижак
    info: |
      Кетцалькоатль був літаючим ящером, а не динозавром, і жив у Північній Америці.
      Розмах його крил був близько 10 метрів, а стоячи на землі, він був заввишки з жирафу.
      Його назвали на честь Кетцалькоатля — пернатого змія, бога ацтеків.
  dino.compsognathus:
    label: Компсогнат
    summary: Пізня юра · хижак
    info: |
      Компсогнат був завдовжки лише близько 1 метра, завбільшки з курку, і жив у Німеччині та Франції.
      Він був одним із найменших динозаврів і швидко бігав на двох ногах.
      У шлунку однієї скам'янілості досі лежить маленька ящірка — його останній обід.
  dino.oviraptor:
    label: Овіраптор
    summary: Пізня крейда · всеїдний
    info: |
      Овіраптор був завдовжки близько 2 метрів, мав пір'я і дзьоб, а жив у Монголії.
      Його ім'я означає «викрадач яєць», бо його знайшли на гнізді з яйцями.
      Згодом науковці з'ясували, що це були яйця його родичів: він був турботливим батьком, а не злодієм.
  dino.kentrosaurus:
    label: Кентрозавр
    summary: Пізня юра · травоїдний
    info: |
      Кентрозавр був завдовжки близько 4,5 метра і жив у Танзанії, в Африці.
      Це був невеликий родич стегозавра: пластини на шиї та довгі шипи на спині й хвості.
      Його ім'я означає «колючий ящір».
  dino.microraptor:
    label: Мікрораптор
    summary: Рання крейда · хижак
    info: |
      Мікрораптор був завдовжки менше ніж 1 метр і жив у Китаї.
      Крила з пір'я були в нього і на передніх, і на задніх лапах — аж чотири крила.
      Його пір'я було чорним і блискучим, як у ворони.
  dino.protoceratops:
    label: Протоцератопс
    summary: Пізня крейда · травоїдний
    info: |
      Протоцератопс був завдовжки близько 2 метрів, завбільшки з вівцю, і жив у Монголії та Китаї.
      Він мав кістяний комір і дзьоб, як у папуги, але справжніх рогів не мав.
      Одна відома скам'янілість показує протоцератопса й велоцираптора, що зчепилися в бійці.
