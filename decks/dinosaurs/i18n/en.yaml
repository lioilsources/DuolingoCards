lang: en
pivot: true
title: Dinosaurs
cards:
  dino.t_rex:
    label: Tyrannosaurus
    summary: Late Cretaceous · carnivore
    info: |
      Tyrannosaurus rex was up to 12 metres long and lived in North America.
      Its teeth were as big as bananas, and it had the strongest bite of any land animal.
      Its arms were short, but they were strong.
  dino.triceratops:
    label: Triceratops
    summary: Late Cretaceous · herbivore
    info: |
      Triceratops was about 9 metres long and lived in North America.
      Its name means "three-horned face", and its two top horns were about a metre long.
      It lived at the same time and in the same places as Tyrannosaurus.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Late Jurassic · herbivore
    info: |
      Stegosaurus was about 9 metres long and lived in North America and Portugal.
      It had big plates on its back and sharp spikes on its tail.
      It lived so long ago that it is further away in time from T. rex than we are.
  dino.brachiosaurus:
    label: Brachiosaurus
    summary: Late Jurassic · herbivore
    info: |
      Brachiosaurus was about 22 metres long and lived in North America.
      Its front legs were longer than its back legs, so it could reach leaves as high as a four-storey building.
      Its name means "arm lizard".
  dino.velociraptor:
    label: Velociraptor
    summary: Late Cretaceous · carnivore
    info: |
      Velociraptor was only about 2 metres long, about the size of a turkey, and lived in Mongolia and China.
      It was covered in feathers, but it could not fly.
      On each foot it had a big curved claw for catching prey.
  dino.ankylosaurus:
    label: Ankylosaurus
    summary: Late Cretaceous · herbivore
    info: |
      Ankylosaurus was about 7 metres long and lived in North America.
      Its back was covered with bony armour, like a living tank.
      At the end of its tail it had a heavy bony club to defend itself.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Late Cretaceous · carnivore
    info: |
      Spinosaurus was about 14 metres long, even longer than T. rex, and lived in North Africa.
      It had a tall sail on its back and lived near rivers, where it caught fish.
      Its first fossils were destroyed during the Second World War.
  dino.parasaurolophus:
    label: Parasaurolophus
    summary: Late Cretaceous · herbivore
    info: |
      Parasaurolophus was about 9 metres long and lived in North America.
      It had a long hollow crest on its head and a beak like a duck.
      By blowing air through its crest, it could make loud trumpet-like sounds.
  dino.pteranodon:
    label: Pteranodon
    summary: Late Cretaceous · carnivore
    info: |
      Pteranodon was a flying reptile, not a dinosaur, and its wings were up to 7 metres wide.
      It lived in North America and flew over the sea to catch fish.
      Its name means "wing without teeth", because it had a beak with no teeth.
  dino.diplodocus:
    label: Diplodocus
    summary: Late Jurassic · herbivore
    info: |
      Diplodocus was about 25 metres long, as long as two buses, and lived in North America.
      Most of its length was its very long neck and its thin, whip-like tail.
      It had small peg-like teeth for stripping leaves from plants.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Late Jurassic · herbivore
    info: |
      Brontosaurus was about 22 metres long and lived in North America.
      Its name means "thunder lizard", and it weighed about as much as three elephants.
      For over 100 years scientists thought it was Apatosaurus, but in 2015 it got its own name back.
  dino.iguanodon:
    label: Iguanodon
    summary: Early Cretaceous · herbivore
    info: |
      Iguanodon was about 10 metres long and lived in Europe.
      It had a sharp spike on each thumb, which scientists first thought was a horn on its nose.
      In 1825 it became one of the very first dinosaurs ever named.
  dino.pachycephalosaurus:
    label: Pachycephalosaurus
    summary: Late Cretaceous · herbivore
    info: |
      Pachycephalosaurus was about 4.5 metres long and lived in North America.
      The bone on top of its head was up to 25 centimetres thick.
      Its name means "thick-headed lizard".
  dino.archaeopteryx:
    label: Archaeopteryx
    summary: Late Jurassic · carnivore
    info: |
      Archaeopteryx was about the size of a raven and lived in what is now Germany.
      It had feathers and wings like a bird, but also teeth, claws on its wings and a long bony tail.
      It shows that birds are the living relatives of dinosaurs.
  dino.allosaurus:
    label: Allosaurus
    summary: Late Jurassic · carnivore
    info: |
      Allosaurus was about 9 metres long and lived in North America and Portugal.
      It was the biggest hunter of its time and had small horns above its eyes.
      One Allosaurus fossil has a wound made by the spiked tail of a Stegosaurus.
  dino.mosasaurus:
    label: Mosasaurus
    summary: Late Cretaceous · carnivore
    info: |
      Mosasaurus was a giant sea reptile, not a dinosaur, about 13 metres long.
      Its relatives are lizards and snakes, and it had to come to the surface to breathe air.
      Its first fossil was found in the Netherlands, near the river Meuse.
  dino.plesiosaurus:
    label: Plesiosaurus
    summary: Early Jurassic · carnivore
    info: |
      Plesiosaurus was a sea reptile, not a dinosaur, about 3 metres long.
      It had a long neck, a small head and four big flippers for swimming.
      Its first complete skeleton was found in England by the fossil hunter Mary Anning.
  dino.ichthyosaurus:
    label: Ichthyosaurus
    summary: Early Jurassic · carnivore
    info: |
      Ichthyosaurus was a sea reptile, not a dinosaur or a fish, about 2 metres long.
      It looked like a dolphin and had very big eyes for seeing in dark water.
      It gave birth to live babies in the sea instead of laying eggs.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Early Permian · carnivore
    info: |
      Dimetrodon was not a dinosaur: it lived about 40 million years before the first dinosaurs.
      It was up to 4 metres long, had a tall sail on its back and lived in North America and Europe.
      It is more closely related to mammals, like us, than to dinosaurs.
  dino.carnotaurus:
    label: Carnotaurus
    summary: Late Cretaceous · carnivore
    info: |
      Carnotaurus was about 8 metres long and lived in Argentina, in South America.
      Its name means "meat-eating bull", because it had two horns above its eyes.
      Its arms were tiny, even smaller than those of T. rex.
  dino.therizinosaurus:
    label: Therizinosaurus
    summary: Late Cretaceous · herbivore
    info: |
      Therizinosaurus was about 9 metres long and lived in Mongolia.
      Its claws were longer than a school ruler, the longest claws of any known animal.
      Even though it was related to T. rex, it ate plants.
  dino.gallimimus:
    label: Gallimimus
    summary: Late Cretaceous · omnivore
    info: |
      Gallimimus was about 6 metres long and lived in Mongolia.
      It looked like a big ostrich, with a toothless beak and long legs.
      It was one of the fastest runners among the dinosaurs.
  dino.dilophosaurus:
    label: Dilophosaurus
    summary: Early Jurassic · carnivore
    info: |
      Dilophosaurus was about 7 metres long and lived in North America.
      It had two thin crests on its head, and its name means "two-crested lizard".
      In films it spits venom and has a neck frill, but there is no proof of either.
  dino.styracosaurus:
    label: Styracosaurus
    summary: Late Cretaceous · herbivore
    info: |
      Styracosaurus was about 5.5 metres long and lived in Canada.
      Long spikes stuck out of the bony frill around its neck.
      It also had one long horn on its nose, up to 60 centimetres long.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Late Cretaceous · carnivore
    info: |
      Quetzalcoatlus was a flying reptile, not a dinosaur, and lived in North America.
      Its wings were about 10 metres wide, and standing on the ground it was as tall as a giraffe.
      It was named after Quetzalcoatl, a feathered serpent god of the Aztecs.
  dino.compsognathus:
    label: Compsognathus
    summary: Late Jurassic · carnivore
    info: |
      Compsognathus was only about 1 metre long, about the size of a chicken, and lived in Germany and France.
      It was one of the smallest dinosaurs and ran fast on two legs.
      One fossil still has a small lizard in its stomach, its last meal.
  dino.oviraptor:
    label: Oviraptor
    summary: Late Cretaceous · omnivore
    info: |
      Oviraptor was about 2 metres long, had feathers and a beak, and lived in Mongolia.
      Its name means "egg thief", because it was found on a nest of eggs.
      Later scientists found out the eggs were its own kind's, so it was a caring parent, not a thief.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Late Jurassic · herbivore
    info: |
      Kentrosaurus was about 4.5 metres long and lived in Tanzania, in Africa.
      It was a smaller relative of Stegosaurus, with plates on its neck and long spikes on its back and tail.
      Its name means "spiky lizard".
  dino.microraptor:
    label: Microraptor
    summary: Early Cretaceous · carnivore
    info: |
      Microraptor was less than 1 metre long and lived in China.
      It had feathered wings on both its arms and its legs, so it had four wings.
      Its feathers were black and shiny, like a crow's.
  dino.protoceratops:
    label: Protoceratops
    summary: Late Cretaceous · herbivore
    info: |
      Protoceratops was about 2 metres long, about the size of a sheep, and lived in Mongolia and China.
      It had a bony frill and a beak like a parrot, but no real horns.
      One famous fossil shows a Protoceratops and a Velociraptor locked in a fight.
