lang: hi
pivot: false
title: डायनासोर
cards:
  dino.t_rex:
    label: टायरानोसॉरस
    summary: उत्तर क्रिटेशियस · मांसाहारी
    info: |
      टायरानोसॉरस रेक्स 12 मीटर तक लंबा था और उत्तरी अमेरिका में रहता था।
      इसके दाँत केलों जितने बड़े थे, और ज़मीन के सभी जानवरों में इसका काटना सबसे ताकतवर था।
      इसकी बाँहें छोटी थीं, लेकिन मज़बूत थीं।
  dino.triceratops:
    label: ट्राइसेराटॉप्स
    summary: उत्तर क्रिटेशियस · शाकाहारी
    info: |
      ट्राइसेराटॉप्स लगभग 9 मीटर लंबा था और उत्तरी अमेरिका में रहता था।
      इसके नाम का मतलब है "तीन सींगों वाला चेहरा", और इसके ऊपर के दो सींग लगभग एक मीटर लंबे थे।
      यह टायरानोसॉरस के समय में और उन्हीं जगहों पर रहता था।
  dino.stegosaurus:
    label: स्टेगोसॉरस
    summary: उत्तर जुरासिक · शाकाहारी
    info: |
      स्टेगोसॉरस लगभग 9 मीटर लंबा था और उत्तरी अमेरिका और पुर्तगाल में रहता था।
      इसकी पीठ पर बड़ी-बड़ी प्लेटें थीं और पूँछ पर नुकीले काँटे थे।
      यह इतने पहले रहता था कि यह टी. रेक्स से समय में उससे भी ज़्यादा दूर है जितना हम टी. रेक्स से हैं।
  dino.brachiosaurus:
    label: ब्रैकियोसॉरस
    summary: उत्तर जुरासिक · शाकाहारी
    info: |
      ब्रैकियोसॉरस लगभग 22 मीटर लंबा था और उत्तरी अमेरिका में रहता था।
      इसके आगे के पैर पीछे के पैरों से लंबे थे, इसलिए यह चार मंज़िला इमारत जितनी ऊँचाई की पत्तियों तक पहुँच सकता था।
      इसके नाम का मतलब है "बाँह वाली छिपकली"।
  dino.velociraptor:
    label: वेलोसिरैप्टर
    summary: उत्तर क्रिटेशियस · मांसाहारी
    info: |
      वेलोसिरैप्टर सिर्फ़ लगभग 2 मीटर लंबा था, यानी टर्की पक्षी जितना, और मंगोलिया और चीन में रहता था।
      इसका शरीर पंखों से ढका था, लेकिन यह उड़ नहीं सकता था।
      इसके हर पैर पर शिकार पकड़ने के लिए एक बड़ा मुड़ा हुआ पंजा था।
  dino.ankylosaurus:
    label: एंकिलोसॉरस
    summary: उत्तर क्रिटेशियस · शाकाहारी
    info: |
      एंकिलोसॉरस लगभग 7 मीटर लंबा था और उत्तरी अमेरिका में रहता था।
      इसकी पीठ हड्डियों के कवच से ढकी थी, बिल्कुल एक जीते-जागते टैंक की तरह।
      अपनी रक्षा के लिए इसकी पूँछ के सिरे पर हड्डी का एक भारी गदा था।
  dino.spinosaurus:
    label: स्पाइनोसॉरस
    summary: उत्तर क्रिटेशियस · मांसाहारी
    info: |
      स्पाइनोसॉरस लगभग 14 मीटर लंबा था, टी. रेक्स से भी लंबा, और उत्तरी अफ़्रीका में रहता था।
      इसकी पीठ पर एक ऊँचा पाल था और यह नदियों के पास रहकर मछलियाँ पकड़ता था।
      इसके पहले जीवाश्म दूसरे विश्व युद्ध के दौरान नष्ट हो गए थे।
  dino.parasaurolophus:
    label: पैरासॉरोलोफ़स
    summary: उत्तर क्रिटेशियस · शाकाहारी
    info: |
      पैरासॉरोलोफ़स लगभग 9 मीटर लंबा था और उत्तरी अमेरिका में रहता था।
      इसके सिर पर एक लंबी खोखली कलगी थी और इसकी चोंच बत्तख जैसी थी।
      अपनी कलगी में हवा फूँककर यह तुरही जैसी तेज़ आवाज़ें निकाल सकता था।
  dino.pteranodon:
    label: टेरानोडॉन
    summary: उत्तर क्रिटेशियस · मांसाहारी
    info: |
      टेरानोडॉन एक उड़ने वाला सरीसृप था, डायनासोर नहीं, और इसके पंख 7 मीटर तक चौड़े थे।
      यह उत्तरी अमेरिका में रहता था और मछलियाँ पकड़ने के लिए समुद्र के ऊपर उड़ता था।
      इसके नाम का मतलब है "बिना दाँत वाला पंख", क्योंकि इसकी चोंच में दाँत नहीं थे।
  dino.diplodocus:
    label: डिप्लोडोकस
    summary: उत्तर जुरासिक · शाकाहारी
    info: |
      डिप्लोडोकस लगभग 25 मीटर लंबा था, दो बसों जितना, और उत्तरी अमेरिका में रहता था।
      इसकी ज़्यादातर लंबाई इसकी बहुत लंबी गर्दन और पतली, चाबुक जैसी पूँछ की थी।
      पौधों से पत्तियाँ नोचने के लिए इसके छोटे-छोटे खूँटी जैसे दाँत थे।
  dino.brontosaurus:
    label: ब्रोंटोसॉरस
    summary: उत्तर जुरासिक · शाकाहारी
    info: |
      ब्रोंटोसॉरस लगभग 22 मीटर लंबा था और उत्तरी अमेरिका में रहता था।
      इसके नाम का मतलब है "गरज वाली छिपकली", और इसका वज़न लगभग तीन हाथियों जितना था।
      100 से ज़्यादा सालों तक वैज्ञानिक इसे एपेटोसॉरस समझते रहे, लेकिन 2015 में इसे अपना नाम वापस मिल गया।
  dino.iguanodon:
    label: इगुआनोडॉन
    summary: प्रारंभिक क्रिटेशियस · शाकाहारी
    info: |
      इगुआनोडॉन लगभग 10 मीटर लंबा था और यूरोप में रहता था।
      इसके हर अँगूठे पर एक नुकीला काँटा था, जिसे वैज्ञानिकों ने पहले इसकी नाक पर लगा सींग समझा था।
      1825 में यह उन सबसे पहले डायनासोरों में से एक बना जिन्हें नाम दिया गया।
  dino.pachycephalosaurus:
    label: पैकीसेफ़ैलोसॉरस
    summary: उत्तर क्रिटेशियस · शाकाहारी
    info: |
      पैकीसेफ़ैलोसॉरस लगभग 4.5 मीटर लंबा था और उत्तरी अमेरिका में रहता था।
      इसके सिर के ऊपर की हड्डी 25 सेंटीमीटर तक मोटी थी।
      इसके नाम का मतलब है "मोटे सिर वाली छिपकली"।
  dino.archaeopteryx:
    label: आर्कियोप्टेरिक्स
    summary: उत्तर जुरासिक · मांसाहारी
    info: |
      आर्कियोप्टेरिक्स लगभग एक कौवे जितना बड़ा था और उस जगह रहता था जो आज जर्मनी है।
      इसके पक्षी जैसे पंख और डैने थे, लेकिन साथ ही दाँत, डैनों पर पंजे और हड्डी वाली लंबी पूँछ भी थी।
      इससे पता चलता है कि पक्षी डायनासोरों के जीवित रिश्तेदार हैं।
  dino.allosaurus:
    label: एलोसॉरस
    summary: उत्तर जुरासिक · मांसाहारी
    info: |
      एलोसॉरस लगभग 9 मीटर लंबा था और उत्तरी अमेरिका और पुर्तगाल में रहता था।
      यह अपने समय का सबसे बड़ा शिकारी था और इसकी आँखों के ऊपर छोटे-छोटे सींग थे।
      एलोसॉरस के एक जीवाश्म पर स्टेगोसॉरस की काँटेदार पूँछ से लगा घाव है।
  dino.mosasaurus:
    label: मोसासॉरस
    summary: उत्तर क्रिटेशियस · मांसाहारी
    info: |
      मोसासॉरस एक विशाल समुद्री सरीसृप था, डायनासोर नहीं, और लगभग 13 मीटर लंबा था।
      छिपकलियाँ और साँप इसके रिश्तेदार हैं, और साँस लेने के लिए इसे पानी की सतह पर आना पड़ता था।
      इसका पहला जीवाश्म नीदरलैंड में मास नदी के पास मिला था।
  dino.plesiosaurus:
    label: प्लीसियोसॉरस
    summary: प्रारंभिक जुरासिक · मांसाहारी
    info: |
      प्लीसियोसॉरस एक समुद्री सरीसृप था, डायनासोर नहीं, और लगभग 3 मीटर लंबा था।
      इसकी लंबी गर्दन, छोटा सिर और तैरने के लिए चार बड़े फ़्लिपर थे।
      इसका पहला पूरा कंकाल इंग्लैंड में जीवाश्म खोजने वाली मैरी ऐनिंग को मिला था।
  dino.ichthyosaurus:
    label: इक्थियोसॉरस
    summary: प्रारंभिक जुरासिक · मांसाहारी
    info: |
      इक्थियोसॉरस एक समुद्री सरीसृप था, न डायनासोर और न मछली, और लगभग 2 मीटर लंबा था।
      यह डॉल्फ़िन जैसा दिखता था और अँधेरे पानी में देखने के लिए इसकी आँखें बहुत बड़ी थीं।
      यह अंडे देने के बजाय समुद्र में ही ज़िंदा बच्चों को जन्म देता था।
  dino.dimetrodon:
    label: डाइमेट्रोडॉन
    summary: प्रारंभिक पर्मियन · मांसाहारी
    info: |
      डाइमेट्रोडॉन डायनासोर नहीं था: यह पहले डायनासोरों से लगभग 4 करोड़ साल पहले रहता था।
      यह 4 मीटर तक लंबा था, इसकी पीठ पर एक ऊँचा पाल था और यह उत्तरी अमेरिका और यूरोप में रहता था।
      यह डायनासोरों से ज़्यादा स्तनधारियों का, यानी हमारा, करीबी रिश्तेदार है।
  dino.carnotaurus:
    label: कार्नोटॉरस
    summary: उत्तर क्रिटेशियस · मांसाहारी
    info: |
      कार्नोटॉरस लगभग 8 मीटर लंबा था और दक्षिण अमेरिका के अर्जेंटीना में रहता था।
      इसके नाम का मतलब है "मांस खाने वाला साँड", क्योंकि इसकी आँखों के ऊपर दो सींग थे।
      इसकी बाँहें बहुत छोटी थीं, टी. रेक्स की बाँहों से भी छोटी।
  dino.therizinosaurus:
    label: थेरिज़िनोसॉरस
    summary: उत्तर क्रिटेशियस · शाकाहारी
    info: |
      थेरिज़िनोसॉरस लगभग 9 मीटर लंबा था और मंगोलिया में रहता था।
      इसके पंजे स्कूल के स्केल से भी लंबे थे, किसी भी जाने-पहचाने जानवर के सबसे लंबे पंजे।
      टी. रेक्स का रिश्तेदार होने के बावजूद यह पौधे खाता था।
  dino.gallimimus:
    label: गैलिमिमस
    summary: उत्तर क्रिटेशियस · सर्वाहारी
    info: |
      गैलिमिमस लगभग 6 मीटर लंबा था और मंगोलिया में रहता था।
      यह एक बड़े शुतुरमुर्ग जैसा दिखता था, जिसकी बिना दाँत वाली चोंच और लंबी टाँगें थीं।
      यह डायनासोरों में सबसे तेज़ दौड़ने वालों में से एक था।
  dino.dilophosaurus:
    label: डाइलोफ़ोसॉरस
    summary: प्रारंभिक जुरासिक · मांसाहारी
    info: |
      डाइलोफ़ोसॉरस लगभग 7 मीटर लंबा था और उत्तरी अमेरिका में रहता था।
      इसके सिर पर दो पतली कलगियाँ थीं, और इसके नाम का मतलब है "दो कलगी वाली छिपकली"।
      फ़िल्मों में यह ज़हर थूकता है और इसकी गर्दन पर झालर होती है, लेकिन इन दोनों का कोई सबूत नहीं है।
  dino.styracosaurus:
    label: स्टाइराकोसॉरस
    summary: उत्तर क्रिटेशियस · शाकाहारी
    info: |
      स्टाइराकोसॉरस लगभग 5.5 मीटर लंबा था और कनाडा में रहता था।
      इसकी गर्दन के चारों ओर की हड्डी की झालर से लंबे काँटे बाहर निकले हुए थे।
      इसकी नाक पर एक लंबा सींग भी था, जो 60 सेंटीमीटर तक लंबा था।
  dino.quetzalcoatlus:
    label: क्वेट्ज़ालकोआटलस
    summary: उत्तर क्रिटेशियस · मांसाहारी
    info: |
      क्वेट्ज़ालकोआटलस एक उड़ने वाला सरीसृप था, डायनासोर नहीं, और उत्तरी अमेरिका में रहता था।
      इसके पंख लगभग 10 मीटर चौड़े थे, और ज़मीन पर खड़े होने पर यह जिराफ़ जितना ऊँचा था।
      इसका नाम एज़्टेक लोगों के पंखों वाले नाग देवता क्वेट्ज़ालकोआटल के नाम पर रखा गया।
  dino.compsognathus:
    label: कॉम्प्सोग्नाथस
    summary: उत्तर जुरासिक · मांसाहारी
    info: |
      कॉम्प्सोग्नाथस सिर्फ़ लगभग 1 मीटर लंबा था, यानी मुर्गी जितना, और जर्मनी और फ़्रांस में रहता था।
      यह सबसे छोटे डायनासोरों में से एक था और दो पैरों पर तेज़ दौड़ता था।
      इसके एक जीवाश्म के पेट में अब भी एक छोटी छिपकली है, जो इसका आख़िरी भोजन था।
  dino.oviraptor:
    label: ओविरैप्टर
    summary: उत्तर क्रिटेशियस · सर्वाहारी
    info: |
      ओविरैप्टर लगभग 2 मीटर लंबा था, इसके पंख और चोंच थी, और यह मंगोलिया में रहता था।
      इसके नाम का मतलब है "अंडा चोर", क्योंकि यह अंडों से भरे एक घोंसले पर मिला था।
      बाद में वैज्ञानिकों को पता चला कि वे अंडे इसकी अपनी जाति के थे, इसलिए यह चोर नहीं, बल्कि बच्चों की देखभाल करने वाला माता-पिता था।
  dino.kentrosaurus:
    label: केंट्रोसॉरस
    summary: उत्तर जुरासिक · शाकाहारी
    info: |
      केंट्रोसॉरस लगभग 4.5 मीटर लंबा था और अफ़्रीका के तंज़ानिया में रहता था।
      यह स्टेगोसॉरस का एक छोटा रिश्तेदार था, जिसकी गर्दन पर प्लेटें और पीठ व पूँछ पर लंबे काँटे थे।
      इसके नाम का मतलब है "काँटेदार छिपकली"।
  dino.microraptor:
    label: माइक्रोरैप्टर
    summary: प्रारंभिक क्रिटेशियस · मांसाहारी
    info: |
      माइक्रोरैप्टर 1 मीटर से भी छोटा था और चीन में रहता था।
      इसकी बाँहों और टाँगों दोनों पर पंखों वाले डैने थे, यानी इसके चार डैने थे।
      इसके पंख काले और चमकीले थे, कौवे के पंखों जैसे।
  dino.protoceratops:
    label: प्रोटोसेराटॉप्स
    summary: उत्तर क्रिटेशियस · शाकाहारी
    info: |
      प्रोटोसेराटॉप्स लगभग 2 मीटर लंबा था, यानी भेड़ जितना, और मंगोलिया और चीन में रहता था।
      इसकी हड्डी की झालर और तोते जैसी चोंच थी, लेकिन असली सींग नहीं थे।
      एक मशहूर जीवाश्म में एक प्रोटोसेराटॉप्स और एक वेलोसिरैप्टर आपस में लड़ते हुए जकड़े हुए हैं।
