title: Dinosauri
cards:
  dino.t_rex:
    label: Tiranosaurus
    summary: Kasna kreda · mesožder
    info: |
      Tiranosaurus je bio dug do 12 metara i živio je u Sjevernoj Americi.
      Zubi su mu bili veliki kao banane, a imao je najjači ugriz od svih kopnenih životinja.
      Ruke su mu bile kratke, ali snažne.
  dino.triceratops:
    label: Triceratops
    summary: Kasna kreda · biljožder
    info: |
      Triceratops je bio dug oko 9 metara i živio je u Sjevernoj Americi.
      Ime mu znači „lice s tri roga”, a njegova dva gornja roga bila su duga oko jedan metar.
      Živio je u isto vrijeme i na istim mjestima kao tiranosaurus.
  dino.stegosaurus:
    label: Stegosaurus
    summary: Kasna jura · biljožder
    info: |
      Stegosaurus je bio dug oko 9 metara i živio je u Sjevernoj Americi i Portugalu.
      Na leđima je imao velike ploče, a na repu oštre bodlje.
      Živio je tako davno da ga je od tiranosaura dijelilo više vremena nego nas danas.
  dino.brachiosaurus:
    label: Brahiosaurus
    summary: Kasna jura · biljožder
    info: |
      Brahiosaurus je bio dug oko 22 metra i živio je u Sjevernoj Americi.
      Prednje noge bile su mu dulje od stražnjih, pa je dosezao lišće visoko kao zgrada s četiri kata.
      Ime mu znači „gušter s rukama”.
  dino.velociraptor:
    label: Velociraptor
    summary: Kasna kreda · mesožder
    info: |
      Velociraptor je bio dug samo oko 2 metra, velik kao purica, i živio je u Mongoliji i Kini.
      Bio je prekriven perjem, ali nije znao letjeti.
      Na svakoj nozi imao je veliku zakrivljenu pandžu za hvatanje plijena.
  dino.ankylosaurus:
    label: Ankilosaurus
    summary: Kasna kreda · biljožder
    info: |
      Ankilosaurus je bio dug oko 7 metara i živio je u Sjevernoj Americi.
      Leđa su mu bila prekrivena koštanim oklopom, kao živi tenk.
      Na kraju repa imao je tešku koštanu toljagu kojom se branio.
  dino.spinosaurus:
    label: Spinosaurus
    summary: Kasna kreda · mesožder
    info: |
      Spinosaurus je bio dug oko 14 metara, čak dulji od tiranosaura, i živio je u sjevernoj Africi.
      Na leđima je imao visoko jedro i živio je uz rijeke, gdje je lovio ribu.
      Njegovi prvi fosili uništeni su u Drugom svjetskom ratu.
  dino.parasaurolophus:
    label: Parasaurolofus
    summary: Kasna kreda · biljožder
    info: |
      Parasaurolofus je bio dug oko 9 metara i živio je u Sjevernoj Americi.
      Na glavi je imao dugu šuplju krijestu i kljun kao patka.
      Puhanjem zraka kroz krijestu mogao je proizvoditi glasne zvukove poput trube.
  dino.pteranodon:
    label: Pteranodon
    summary: Kasna kreda · mesožder
    info: |
      Pteranodon je bio leteći gmaz, a ne dinosaur, a raspon krila bio mu je do 7 metara.
      Živio je u Sjevernoj Americi i letio iznad mora loveći ribu.
      Ime mu znači „krilo bez zuba”, jer je imao kljun bez zuba.
  dino.diplodocus:
    label: Diplodok
    summary: Kasna jura · biljožder
    info: |
      Diplodok je bio dug oko 25 metara, kao dva autobusa, i živio je u Sjevernoj Americi.
      Najveći dio te duljine činili su vrlo dugi vrat i tanki rep nalik na bič.
      Imao je male zube poput klinova kojima je trgao lišće s biljaka.
  dino.brontosaurus:
    label: Brontosaurus
    summary: Kasna jura · biljožder
    info: |
      Brontosaurus je bio dug oko 22 metra i živio je u Sjevernoj Americi.
      Ime mu znači „gušter gromova”, a bio je težak otprilike kao tri slona.
      Više od 100 godina znanstvenici su mislili da je to apatosaurus, ali 2015. vraćeno mu je vlastito ime.
  dino.iguanodon:
    label: Iguanodon
    summary: Rana kreda · biljožder
    info: |
      Iguanodon je bio dug oko 10 metara i živio je u Europi.
      Na svakom palcu imao je oštru bodlju, za koju su znanstvenici isprva mislili da je rog na nosu.
      Godine 1825. postao je jedan od prvih dinosaura koji su ikad dobili ime.
  dino.pachycephalosaurus:
    label: Pahicefalosaurus
    summary: Kasna kreda · biljožder
    info: |
      Pahicefalosaurus je bio dug oko 4,5 metra i živio je u Sjevernoj Americi.
      Kost na vrhu glave bila mu je debela do 25 centimetara.
      Ime mu znači „gušter debele glave”.
  dino.archaeopteryx:
    label: Arheopteriks
    summary: Kasna jura · mesožder
    info: |
      Arheopteriks je bio velik otprilike kao gavran i živio je na području današnje Njemačke.
      Imao je perje i krila kao ptica, ali i zube, pandže na krilima i dugi koštani rep.
      On pokazuje da su ptice živi rođaci dinosaura.
  dino.allosaurus:
    label: Alosaurus
    summary: Kasna jura · mesožder
    info: |
      Alosaurus je bio dug oko 9 metara i živio je u Sjevernoj Americi i Portugalu.
      Bio je najveći lovac svog vremena i imao je male rogove iznad očiju.
      Jedan fosil alosaura ima ranu koju mu je zadao bodljikavi rep stegosaura.
  dino.mosasaurus:
    label: Mozasaurus
    summary: Kasna kreda · mesožder
    info: |
      Mozasaurus je bio golemi morski gmaz, a ne dinosaur, dug oko 13 metara.
      Rođaci su mu gušteri i zmije, a morao je izranjati na površinu da udahne zrak.
      Njegov prvi fosil pronađen je u Nizozemskoj, uz rijeku Meuse.
  dino.plesiosaurus:
    label: Pleziosaurus
    summary: Rana jura · mesožder
    info: |
      Pleziosaurus je bio morski gmaz, a ne dinosaur, dug oko 3 metra.
      Imao je dugi vrat, malu glavu i četiri velike peraje za plivanje.
      Njegov prvi cijeli kostur pronašla je u Engleskoj skupljačica fosila Mary Anning.
  dino.ichthyosaurus:
    label: Ihtiosaurus
    summary: Rana jura · mesožder
    info: |
      Ihtiosaurus je bio morski gmaz, a ne dinosaur ni riba, dug oko 2 metra.
      Izgledao je kao dupin i imao je vrlo velike oči kako bi vidio u tamnoj vodi.
      Umjesto da nese jaja, rađao je živu mladunčad u moru.
  dino.dimetrodon:
    label: Dimetrodon
    summary: Rani perm · mesožder
    info: |
      Dimetrodon nije bio dinosaur: živio je oko 40 milijuna godina prije prvih dinosaura.
      Bio je dug do 4 metra, na leđima je imao visoko jedro i živio je u Sjevernoj Americi i Europi.
      Bliži je rođak sisavaca, poput nas, nego dinosaura.
  dino.carnotaurus:
    label: Karnotaurus
    summary: Kasna kreda · mesožder
    info: |
      Karnotaurus je bio dug oko 8 metara i živio je u Argentini, u Južnoj Americi.
      Ime mu znači „bik mesožder”, jer je iznad očiju imao dva roga.
      Ruke su mu bile sićušne, čak manje od tiranosaurovih.
  dino.therizinosaurus:
    label: Terizinosaurus
    summary: Kasna kreda · biljožder
    info: |
      Terizinosaurus je bio dug oko 9 metara i živio je u Mongoliji.
      Pandže su mu bile dulje od školskog ravnala, najdulje od svih poznatih životinja.
      Iako je bio rođak tiranosaura, jeo je biljke.
  dino.gallimimus:
    label: Galimimus
    summary: Kasna kreda · svežder
    info: |
      Galimimus je bio dug oko 6 metara i živio je u Mongoliji.
      Izgledao je kao veliki noj, s kljunom bez zuba i dugim nogama.
      Bio je jedan od najbržih trkača među dinosaurima.
  dino.dilophosaurus:
    label: Dilofosaurus
    summary: Rana jura · mesožder
    info: |
      Dilofosaurus je bio dug oko 7 metara i živio je u Sjevernoj Americi.
      Na glavi je imao dvije tanke krijeste, a ime mu znači „gušter s dvije krijeste”.
      U filmovima pljuje otrov i ima ovratnik oko vrata, ali za to nema nikakvih dokaza.
  dino.styracosaurus:
    label: Stirakosaurus
    summary: Kasna kreda · biljožder
    info: |
      Stirakosaurus je bio dug oko 5,5 metara i živio je u Kanadi.
      Iz koštanog ovratnika oko vrata stršale su mu duge bodlje.
      Na nosu je imao i jedan dugi rog, dug do 60 centimetara.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Kasna kreda · mesožder
    info: |
      Quetzalcoatlus je bio leteći gmaz, a ne dinosaur, i živio je u Sjevernoj Americi.
      Raspon krila bio mu je oko 10 metara, a kad je stajao na tlu, bio je visok kao žirafa.
      Ime je dobio po Quetzalcoatlu, pernatoj zmiji, bogu Asteka.
  dino.compsognathus:
    label: Kompsognatus
    summary: Kasna jura · mesožder
    info: |
      Kompsognatus je bio dug samo oko 1 metar, velik kao kokoš, i živio je u Njemačkoj i Francuskoj.
      Bio je jedan od najmanjih dinosaura i brzo je trčao na dvije noge.
      Jedan fosil još ima u želucu malog guštera, svoj posljednji obrok.
  dino.oviraptor:
    label: Oviraptor
    summary: Kasna kreda · svežder
    info: |
      Oviraptor je bio dug oko 2 metra, imao je perje i kljun i živio je u Mongoliji.
      Ime mu znači „kradljivac jaja”, jer je pronađen na gnijezdu s jajima.
      Kasnije su znanstvenici otkrili da su to bila jaja njegove vrste, pa je bio brižan roditelj, a ne kradljivac.
  dino.kentrosaurus:
    label: Kentrosaurus
    summary: Kasna jura · biljožder
    info: |
      Kentrosaurus je bio dug oko 4,5 metra i živio je u Tanzaniji, u Africi.
      Bio je manji rođak stegosaura, s pločama na vratu i dugim bodljama na leđima i repu.
      Ime mu znači „bodljikavi gušter”.
  dino.microraptor:
    label: Mikroraptor
    summary: Rana kreda · mesožder
    info: |
      Mikroraptor je bio dug manje od 1 metra i živio je u Kini.
      Pernata krila imao je i na rukama i na nogama, pa je imao četiri krila.
      Perje mu je bilo crno i sjajno, kao u vrane.
  dino.protoceratops:
    label: Protoceratops
    summary: Kasna kreda · biljožder
    info: |
      Protoceratops je bio dug oko 2 metra, velik kao ovca, i živio je u Mongoliji i Kini.
      Imao je koštani ovratnik i kljun kao papiga, ali nije imao pravih rogova.
      Jedan poznati fosil prikazuje protoceratopsa i velociraptora zaključane u borbi.
