lang: pt-BR
pivot: false
title: Dinossauros
cards:
  dino.t_rex:
    label: Tiranossauro
    summary: Cretáceo Superior · carnívoro
    info: |
      O Tyrannosaurus rex tinha até 12 metros de comprimento e vivia na América do Norte.
      Seus dentes eram do tamanho de bananas, e ele tinha a mordida mais forte de todos os animais terrestres.
      Seus braços eram curtos, mas eram fortes.
  dino.triceratops:
    label: Tricerátops
    summary: Cretáceo Superior · herbívoro
    info: |
      O Tricerátops tinha cerca de 9 metros de comprimento e vivia na América do Norte.
      Seu nome quer dizer "cara com três chifres", e os dois chifres de cima tinham cerca de um metro.
      Ele viveu na mesma época e nos mesmos lugares que o Tiranossauro.
  dino.stegosaurus:
    label: Estegossauro
    summary: Jurássico Superior · herbívoro
    info: |
      O Estegossauro tinha cerca de 9 metros de comprimento e vivia na América do Norte e em Portugal.
      Ele tinha placas grandes nas costas e espinhos pontudos na cauda.
      Ele viveu há tanto tempo que está mais longe do T. rex no tempo do que nós.
  dino.brachiosaurus:
    label: Braquiossauro
    summary: Jurássico Superior · herbívoro
    info: |
      O Braquiossauro tinha cerca de 22 metros de comprimento e vivia na América do Norte.
      Suas patas da frente eram mais compridas que as de trás, então ele alcançava folhas tão altas quanto um prédio de quatro andares.
      Seu nome quer dizer "lagarto braço".
  dino.velociraptor:
    label: Velociraptor
    summary: Cretáceo Superior · carnívoro
    info: |
      O Velociraptor tinha só uns 2 metros de comprimento, mais ou menos o tamanho de um peru, e vivia na Mongólia e na China.
      Ele era coberto de penas, mas não conseguia voar.
      Em cada pé ele tinha uma garra grande e curva para pegar suas presas.
  dino.ankylosaurus:
    label: Anquilossauro
    summary: Cretáceo Superior · herbívoro
    info: |
      O Anquilossauro tinha cerca de 7 metros de comprimento e vivia na América do Norte.
      Suas costas eram cobertas por uma armadura de osso, como um tanque de guerra vivo.
      Na ponta da cauda ele tinha uma clava de osso pesada para se defender.
  dino.spinosaurus:
    label: Espinossauro
    summary: Cretáceo Superior · carnívoro
    info: |
      O Espinossauro tinha cerca de 14 metros de comprimento, ainda mais que o T. rex, e vivia no norte da África.
      Ele tinha uma vela alta nas costas e vivia perto dos rios, onde pegava peixes.
      Seus primeiros fósseis foram destruídos durante a Segunda Guerra Mundial.
  dino.parasaurolophus:
    label: Parassaurolofo
    summary: Cretáceo Superior · herbívoro
    info: |
      O Parassaurolofo tinha cerca de 9 metros de comprimento e vivia na América do Norte.
      Ele tinha uma crista longa e oca na cabeça e um bico parecido com o de um pato.
      Soprando ar pela crista, ele fazia sons altos, parecidos com os de um trompete.
  dino.pteranodon:
    label: Pteranodonte
    summary: Cretáceo Superior · carnívoro
    info: |
      O Pteranodonte era um réptil voador, não um dinossauro, e suas asas tinham até 7 metros de ponta a ponta.
      Ele vivia na América do Norte e voava sobre o mar para pegar peixes.
      Seu nome quer dizer "asa sem dentes", porque ele tinha um bico sem nenhum dente.
  dino.diplodocus:
    label: Diplódoco
    summary: Jurássico Superior · herbívoro
    info: |
      O Diplódoco tinha cerca de 25 metros de comprimento, o mesmo que dois ônibus, e vivia na América do Norte.
      Quase todo o seu tamanho era o pescoço comprido e a cauda fina como um chicote.
      Ele tinha dentes pequenos em forma de pino para arrancar as folhas das plantas.
  dino.brontosaurus:
    label: Brontossauro
    summary: Jurássico Superior · herbívoro
    info: |
      O Brontossauro tinha cerca de 22 metros de comprimento e vivia na América do Norte.
      Seu nome quer dizer "lagarto trovão", e ele pesava mais ou menos o mesmo que três elefantes.
      Por mais de 100 anos os cientistas acharam que ele era o Apatossauro, mas em 2015 ele ganhou seu nome de volta.
  dino.iguanodon:
    label: Iguanodonte
    summary: Cretáceo Inferior · herbívoro
    info: |
      O Iguanodonte tinha cerca de 10 metros de comprimento e vivia na Europa.
      Ele tinha um espinho pontudo em cada polegar, que os cientistas primeiro acharam que era um chifre no nariz.
      Em 1825 ele se tornou um dos primeiros dinossauros a ganhar um nome.
  dino.pachycephalosaurus:
    label: Paquicefalossauro
    summary: Cretáceo Superior · herbívoro
    info: |
      O Paquicefalossauro tinha cerca de 4,5 metros de comprimento e vivia na América do Norte.
      O osso no alto da sua cabeça tinha até 25 centímetros de espessura.
      Seu nome quer dizer "lagarto de cabeça grossa".
  dino.archaeopteryx:
    label: Arqueópterix
    summary: Jurássico Superior · carnívoro
    info: |
      O Arqueópterix era mais ou menos do tamanho de um corvo e vivia onde hoje é a Alemanha.
      Ele tinha penas e asas como uma ave, mas também dentes, garras nas asas e uma cauda longa de osso.
      Ele mostra que as aves são as parentes vivas dos dinossauros.
  dino.allosaurus:
    label: Alossauro
    summary: Jurássico Superior · carnívoro
    info: |
      O Alossauro tinha cerca de 9 metros de comprimento e vivia na América do Norte e em Portugal.
      Ele era o maior caçador da sua época e tinha chifres pequenos acima dos olhos.
      Um fóssil de Alossauro tem uma ferida feita pela cauda com espinhos de um Estegossauro.
  dino.mosasaurus:
    label: Mosassauro
    summary: Cretáceo Superior · carnívoro
    info: |
      O Mosassauro era um réptil marinho gigante, não um dinossauro, com cerca de 13 metros de comprimento.
      Seus parentes são os lagartos e as cobras, e ele precisava subir à superfície para respirar.
      Seu primeiro fóssil foi encontrado na Holanda, perto do rio Mosa.
  dino.plesiosaurus:
    label: Plesiossauro
    summary: Jurássico Inferior · carnívoro
    info: |
      O Plesiossauro era um réptil marinho, não um dinossauro, com cerca de 3 metros de comprimento.
      Ele tinha pescoço comprido, cabeça pequena e quatro nadadeiras grandes para nadar.
      Seu primeiro esqueleto completo foi encontrado na Inglaterra pela caçadora de fósseis Mary Anning.
  dino.ichthyosaurus:
    label: Ictiossauro
    summary: Jurássico Inferior · carnívoro
    info: |
      O Ictiossauro era um réptil marinho, nem dinossauro nem peixe, com cerca de 2 metros de comprimento.
      Ele parecia um golfinho e tinha olhos muito grandes para enxergar na água escura.
      Em vez de botar ovos, ele dava à luz filhotes vivos no mar.
  dino.dimetrodon:
    label: Dimetrodonte
    summary: Permiano Inferior · carnívoro
    info: |
      O Dimetrodonte não era um dinossauro: ele viveu cerca de 40 milhões de anos antes dos primeiros dinossauros.
      Ele tinha até 4 metros de comprimento, uma vela alta nas costas e vivia na América do Norte e na Europa.
      Ele é parente mais próximo dos mamíferos, como nós, do que dos dinossauros.
  dino.carnotaurus:
    label: Carnotauro
    summary: Cretáceo Superior · carnívoro
    info: |
      O Carnotauro tinha cerca de 8 metros de comprimento e vivia na Argentina, na América do Sul.
      Seu nome quer dizer "touro comedor de carne", porque ele tinha dois chifres acima dos olhos.
      Seus braços eram minúsculos, ainda menores que os do T. rex.
  dino.therizinosaurus:
    label: Terizinossauro
    summary: Cretáceo Superior · herbívoro
    info: |
      O Terizinossauro tinha cerca de 9 metros de comprimento e vivia na Mongólia.
      Suas garras eram mais compridas que uma régua escolar: as garras mais longas de todos os animais conhecidos.
      Mesmo sendo parente do T. rex, ele comia plantas.
  dino.gallimimus:
    label: Galimimo
    summary: Cretáceo Superior · onívoro
    info: |
      O Galimimo tinha cerca de 6 metros de comprimento e vivia na Mongólia.
      Ele parecia um avestruz grande, com bico sem dentes e pernas compridas.
      Ele era um dos corredores mais rápidos entre os dinossauros.
  dino.dilophosaurus:
    label: Dilofossauro
    summary: Jurássico Inferior · carnívoro
    info: |
      O Dilofossauro tinha cerca de 7 metros de comprimento e vivia na América do Norte.
      Ele tinha duas cristas finas na cabeça, e seu nome quer dizer "lagarto de duas cristas".
      Nos filmes ele cospe veneno e tem um babado no pescoço, mas não há prova de nenhuma das duas coisas.
  dino.styracosaurus:
    label: Estiracossauro
    summary: Cretáceo Superior · herbívoro
    info: |
      O Estiracossauro tinha cerca de 5,5 metros de comprimento e vivia no Canadá.
      Espinhos longos saíam do babado de osso em volta do seu pescoço.
      Ele também tinha um chifre comprido no nariz, com até 60 centímetros.
  dino.quetzalcoatlus:
    label: Quetzalcoatlus
    summary: Cretáceo Superior · carnívoro
    info: |
      O Quetzalcoatlus era um réptil voador, não um dinossauro, e vivia na América do Norte.
      Suas asas tinham cerca de 10 metros de ponta a ponta, e em pé no chão ele era tão alto quanto uma girafa.
      Seu nome vem de Quetzalcoatl, um deus serpente emplumada dos astecas.
  dino.compsognathus:
    label: Compsognato
    summary: Jurássico Superior · carnívoro
    info: |
      O Compsognato tinha só cerca de 1 metro de comprimento, mais ou menos o tamanho de uma galinha, e vivia na Alemanha e na França.
      Ele era um dos menores dinossauros e corria rápido sobre duas patas.
      Um fóssil ainda tem um pequeno lagarto na barriga: sua última refeição.
  dino.oviraptor:
    label: Ovirraptor
    summary: Cretáceo Superior · onívoro
    info: |
      O Ovirraptor tinha cerca de 2 metros de comprimento, tinha penas e bico, e vivia na Mongólia.
      Seu nome quer dizer "ladrão de ovos", porque ele foi encontrado em cima de um ninho de ovos.
      Depois os cientistas descobriram que os ovos eram da sua própria espécie: ele era um pai cuidadoso, não um ladrão.
  dino.kentrosaurus:
    label: Kentrossauro
    summary: Jurássico Superior · herbívoro
    info: |
      O Kentrossauro tinha cerca de 4,5 metros de comprimento e vivia na Tanzânia, na África.
      Ele era um parente menor do Estegossauro, com placas no pescoço e espinhos longos nas costas e na cauda.
      Seu nome quer dizer "lagarto espinhoso".
  dino.microraptor:
    label: Microraptor
    summary: Cretáceo Inferior · carnívoro
    info: |
      O Microraptor tinha menos de 1 metro de comprimento e vivia na China.
      Ele tinha asas de penas nos braços e também nas pernas, então tinha quatro asas.
      Suas penas eram pretas e brilhantes, como as de um corvo.
  dino.protoceratops:
    label: Protocerátops
    summary: Cretáceo Superior · herbívoro
    info: |
      O Protocerátops tinha cerca de 2 metros de comprimento, mais ou menos o tamanho de uma ovelha, e vivia na Mongólia e na China.
      Ele tinha um babado de osso e um bico de papagaio, mas não tinha chifres de verdade.
      Um fóssil famoso mostra um Protocerátops e um Velociraptor travados no meio de uma luta.
