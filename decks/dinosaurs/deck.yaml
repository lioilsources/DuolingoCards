# dinosaurs — 30 dinosaurs and other prehistoric reptiles for kids 4-10.
# Briefs ask for modern, scientifically accurate reconstructions (feathers where
# current science supports them), full body in side view, in a natural setting.
# The non-dinosaurs (pterosaurs, marine reptiles, Dimetrodon) are kept on
# purpose — kids file them under "dinosaurs", and the info text sets it straight.
slug: dinosaurs
version: 1
tier: 1
brief_attrs: ["(scientifically accurate paleoart reconstruction:1.3)", "(full body side view:1.2)", "(realistic animal anatomy:1.2)", "(natural proportions:1.2)", "(highly detailed:1.1)"]
styles:
  - photo
default_style: photo

cards:
  - key: dino.t_rex
    hint: Tyrannosaurus rex, the huge two-legged meat-eating dinosaur with tiny arms
    image: dino.t_rex.png
    brief:
      subject: Tyrannosaurus rex
      attrs: [massive head, short two-fingered arms, scaly skin, walking on two legs, tail held level]
      setting: [Cretaceous forest clearing, ferns, morning light]
      avoid: [text, humans]

  - key: dino.triceratops
    hint: Triceratops, the plant-eating dinosaur with three horns and a bony frill
    image: dino.triceratops.png
    brief:
      subject: Triceratops
      attrs: [three facial horns, large solid bony neck frill, parrot-like beak, sturdy four-legged stance]
      setting: [open Cretaceous plain, low shrubs, warm daylight]
      avoid: [text, humans]

  - key: dino.stegosaurus
    hint: Stegosaurus, the dinosaur with tall plates along its back and a spiked tail
    image: dino.stegosaurus.png
    brief:
      subject: Stegosaurus
      attrs: [two rows of tall alternating back plates, spiked tail, small head held low, four-legged]
      setting: [Jurassic floodplain, cycads and conifers, soft sunlight]
      avoid: [text, humans]

