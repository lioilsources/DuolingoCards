# cars-iconic - 30 iconic world cars for kids 4-10 and car-loving adults.
# One concrete model and year per card, photographed whole in a plain studio, so
# FLUX draws a specific, heavily photographed car instead of a generic one (the
# 1937 Tatra 87 probe came back as a generic 1930s saloon and was left out).
# Side profile is the most reliable view; three-quarter front is used where the
# face or open doors carry the identity. Two Porsche 911 generations on purpose.
slug: cars-iconic
version: 1
tier: 1
brief_attrs: ["(professional automotive studio photography:1.3)", "(entire car in frame:1.2)", "(accurate proportions:1.2)", "(highly detailed:1.1)"]
styles:
  - photo
default_style: photo

cards:
  - key: car.ford_model_t
    hint: Ford Model T, the early 1900s American car that put the world on wheels
    image: car.ford_model_t.png
    brief:
      subject: 1915 Ford Model T touring car
      attrs: [black paint, open top with folding fabric roof, tall narrow spoked wheels, upright windscreen, brass radiator, side profile, whole car in frame]
      setting: [plain light grey studio background, soft even lighting, subtle floor shadow]
      avoid: [text, badges, logos, emblems, license plates, people]

