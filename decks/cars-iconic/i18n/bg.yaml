pivot: false
title: Известни коли
cards:
  car.ford_model_t:
    label: Форд Модел T
    summary: Колата, с която и обикновените семейства можеха да карат автомобил.
    info: |
      Форд Модел T се е произвеждал в САЩ от 1908 до 1927 г.
      Сглобявали са го на движеща се поточна линия, затова е бил евтин, и са направени над 15 милиона броя.
      Много години е можело да се купи само в черен цвят.
  car.vw_beetle:
    label: Фолксваген Костенурка
    summary: Малка кръгла кола, която хората са кръстили на животно.
    info: |
      Фолксваген Костенурка е от Германия и се е произвеждал от 1938 до 2003 г.
      Направени са над 21 милиона броя, повече от всяка друга кола с един и същ модел.
      Двигателят му е отзад, под задния капак.
  car.vw_bus:
    label: Фолксваген Транспортер
    summary: Дружелюбен бус за семейства, сърфисти и пътувания с палатка.
    info: |
      Фолксваген Тип 2 е от Германия и е направен за първи път през 1950 г.
      Първите модели са имали предно стъкло, разделено на две половини, и голямо V отпред.
      Много хора са го превръщали в малка къщичка на колела за пътуване.
  car.jeep_willys:
    label: Джип Уилис
    summary: Малка и здрава военна кола, която можеше да мине почти навсякъде.
    info: |
      Уилис MB се е произвеждал в САЩ за Втората световна война, от 1941 до 1945 г.
      Направени са стотици хиляди, за да возят войници по неравен терен.
      Той е дал името на всички джипове, които са дошли след него.
  car.land_rover_defender:
    label: Ленд Роувър Дифендър
    summary: Ъгловата британска кола, направена за каране през ниви и кал.
    info: |
      Ленд Роувър е от Обединеното кралство, а първият е направен през 1948 г.
      От 1990 г. се е наричал Дифендър и се е произвеждал до 2016 г.
      Използвали са го фермери, изследователи и спасители по целия свят.
  car.mini_cooper:
    label: Мини Купър
    summary: Мъничка британска кола, която беше изненадващо бърза.
    info: |
      Мини е от Обединеното кралство и се е произвеждал от 1959 до 2000 г.
      Двигателят му е напречно, затова в много късата кола се побират четирима души.
      Мини Купър S е спечелил прочутото рали Монте Карло през 1964 г.
  car.fiat_500:
    label: Фиат 500
    summary: Мъничка италианска кола за тесните градски улички.
    info: |
      Фиат 500 е от Италия и се е произвеждал от 1957 до 1975 г.
      Дълъг е по-малко от 3 метра, затова може да паркира почти навсякъде.
      Италианците го наричат „Чинквеченто“, което означава „петстотин“.
  car.citroen_2cv:
    label: Ситроен 2CV
    summary: Проста френска кола с покрив, който може да се навие.
    info: |
      Ситроен 2CV е от Франция и се е произвеждал от 1948 до 1990 г.
      Създаден е да вози фермери и стоките им по неравните селски пътища.
      Мекият му платнен покрив се навива като капак на консерва сардини.
  car.citroen_ds:
    label: Ситроен DS
    summary: Плавна френска кола, която изглеждаше като от бъдещето.
    info: |
      Ситроен DS е от Франция и се е произвеждал от 1955 до 1975 г.
      Специалното му окачване кара колата да се повдига и да се спуска, когато я запалиш.
      На френски „DS“ звучи като думата за „богиня“.
  car.mercedes_300sl:
    label: Мерцедес-Бенц 300 SL
    summary: Сребриста спортна кола с врати, които се отварят нагоре като крила.
    info: |
      Мерцедес-Бенц 300 SL е от Германия, а купето се е произвеждало от 1954 до 1957 г.
      Вратите му се отварят нагоре, затова хората го наричат „Крило на чайка“.
      По онова време е бил една от най-бързите коли, които можеше да купиш.
  car.jaguar_e_type:
    label: Ягуар E-Type
    summary: Дълга и стройна британска спортна кола.
    info: |
      Ягуар E-Type е от Обединеното кралство и се е произвеждал от 1961 до 1975 г.
      Има много дълъг преден капак с голям двигател под него.
      Много хора казват, че е една от най-красивите коли, правени някога.
  car.aston_martin_db5:
    label: Астън Мартин DB5
    summary: Елегантната британска кола на шпионина Джеймс Бонд.
    info: |
      Астън Мартин DB5 е от Обединеното кралство и се е произвеждал от 1963 до 1965 г.
      Става световноизвестен с филма за Джеймс Бонд „Голдфингър“ от 1964 г.
      Направени са само около хиляда броя.
  car.shelby_cobra:
    label: Шелби Кобра
    summary: Малка открита кола с огромен и шумен двигател.
    info: |
      Шелби Кобра е направена през 60-те години от американския състезател Карол Шелби.
      Той взел лека британска спортна кола и сложил в нея голям американски двигател на Форд.
      Тя е спечелила много състезания и и днес я копират.
  car.ford_mustang:
    label: Форд Мустанг
    summary: Спортна американска кола, кръстена на див кон.
    info: |
      Форд Мустанг е от САЩ и се продава за първи път през 1964 г.
      Бил е толкова популярен, че цяла група подобни коли е наречена на него „пони колите“.
      Мустанг се произвежда и до днес.
  car.corvette_c2:
    label: Корвет Стинг Рей
    summary: Американска спортна кола със задно стъкло, разделено на две.
    info: |
      Шевролет Корвет Стинг Рей е от САЩ.
      Само купето от 1963 г. е имало задно стъкло, разделено на две половини.
      Каросерията му е от фибростъкло вместо от стомана.
  car.cadillac_eldorado:
    label: Кадилак Елдорадо
    summary: Огромна американска кола с най-големите задни перки в историята.
    info: |
      Кадилак Елдорадо от 1959 г. е от САЩ.
      Високите му задни перки, оформени като ракета, са сред най-високите, слагани някога на кола.
      Дълъг е повече от 5 метра и половина.
  car.chevrolet_bel_air:
    label: Шевролет Бел Еър
    summary: Лъскава американска кола от 50-те години с хром и малки задни перки.
    info: |
      Шевролет Бел Еър от 1957 г. е от САЩ.
      С двуцветната си боя и много хром се е превърнал в символ на Америка от 50-те години.
      В Куба много такива стари коли и днес се движат по улиците.
  car.ford_gt40:
    label: Форд GT40
    summary: Много ниска американска състезателна кола, която победи Ферари.
    info: |
      Форд GT40 е създаден през 60-те години, за да спечели състезанието „24 часа на Льо Ман“.
      Печелил е Льо Ман четири години поред, от 1966 до 1969 г.
      Нарича се GT40, защото е висок само около 40 инча (1 метър).
  car.porsche_911_classic:
    label: Порше 911 Карера RS
    summary: Класическа германска спортна кола с малък спойлер „патешка опашка“.
    info: |
      Порше 911 е от Германия, а първото е направено през 1964 г.
      Карера RS от 1973 г. е лека и бърза версия, създадена за състезания.
      Малкият ѝ заден спойлер прилича на патешка опашка.
  car.porsche_911_modern:
    label: Порше 911
    summary: Модерната версия на спортна кола, която пази формата си от 60 години.
    info: |
      Порше 911 е от Германия, а тази версия излиза през 2019 г.
      Все още има кръгли фарове и двигател отзад, точно като първото 911.
      То е едно от най-дълго произвежданите семейства спортни коли в света.
  car.lamborghini_countach:
    label: Ламборгини Каунтач
    summary: Плосък и остър италиански суперавтомобил с врати, които се отварят нагоре.
    info: |
      Ламборгини Каунтач е от Италия и се е произвеждал от 1974 до 1990 г.
      Вратите му се вдигат нагоре и напред като ножица.
      Много деца са имали негов плакат на стената в стаята си.
  car.ferrari_testarossa:
    label: Ферари Тестароса
    summary: Широка червена италианска спортна кола с ивици отстрани.
    info: |
      Ферари Тестароса е от Италия и е направено за първи път през 1984 г.
      „Тестароса“ на италиански означава „червена глава“, защото горната част на двигателя му е боядисана в червено.
      Дългите ивици отстрани пускат въздух, който охлажда двигателя.
  car.ferrari_f40:
    label: Ферари F40
    summary: Червен италиански суперавтомобил с голямо крило отзад.
    info: |
      Ферари F40 е от Италия и се е произвеждало от 1987 до 1992 г.
      Направено е за 40-ия рожден ден на Ферари и оттам идва името му.
      Било е една от първите коли за път, които можеха да карат по-бързо от 320 км/ч.
  car.delorean:
    label: Делориън
    summary: Лъскава стоманена кола, която във филм стана машина на времето.
    info: |
      Делориън DMC-12 се е произвеждал в Северна Ирландия през 1981 и 1982 г.
      Каросерията му е от гола неръждаема стомана без никаква боя, а вратите му се отварят нагоре.
      Прочува се като машината на времето във филма „Завръщане в бъдещето“.
  car.london_taxi:
    label: Лондонско такси
    summary: Прочутото черно такси, което вози хората из Лондон.
    info: |
      Остин FX4 е от Обединеното кралство и се е произвеждал от 1958 до 1997 г.
      Може да обърне в много малък кръг, което помага по тесните улици на Лондон.
      Високият му покрив е направен, за да могат пътниците да седят вътре с шапка.
  car.toyota_land_cruiser:
    label: Тойота Ленд Крузър
    summary: Здрава японска кола, която минава през пустини и джунгли.
    info: |
      Тойота Ленд Крузър FJ40 е от Япония и се е произвеждала от 1960 до 1984 г.
      Продавала се е по целия свят и е известна с това, че много трудно се чупи.
      Много от тях и днес се движат по лоши пътища.
  car.mazda_mx5:
    label: Мазда MX-5
    summary: Малка весела японска двуместна кола с фарове, които изскачат.
    info: |
      Мазда MX-5 е от Япония и се продава за първи път през 1989 г.
      Първата версия е имала фарове, които изскачат от предния капак.
      Това е най-продаваната двуместна спортна кола в света.
  car.trabant:
    label: Трабант
    summary: Малка източногерманска кола с каросерия, направена отчасти от пластмаса.
    info: |
      Трабант е от Източна Германия и се е произвеждал от 1957 до 1991 г.
      Каросерията му е била от твърда пластмаса, смесена с памучни влакна, вместо от стомана.
      Хората често е трябвало да чакат много години, за да си купят такава кола.
  car.bugatti_veyron:
    label: Бугати Вейрон
    summary: Невероятно бърза кола, която може да кара над 400 км/ч.
    info: |
      Бугати Вейрон е от Франция и се е произвеждал от 2005 до 2015 г.
      Двигателят му има 16 цилиндъра и над 1000 конски сили.
      Когато излиза, е най-бързата кола за път в света.
  car.tesla_model_s:
    label: Тесла Модел S
    summary: Бърза американска кола, която се движи с ток вместо с бензин.
    info: |
      Тесла Модел S е от САЩ и се продава от 2012 г.
      Движи се с големи батерии под пода, затова няма ауспух.
      Тъй като отпред няма двигател, там има втори багажник.
