lang: zh-CN
pivot: false
title: 著名汽车
cards:
  car.ford_model_t:
    label: 福特T型车
    summary: 让普通家庭也能开上汽车的车。
    info: |
      福特T型车在美国制造，从1908年一直生产到1927年。
      它是在移动的流水线上组装的，所以很便宜，一共造了1500多万辆。
      很多年里，人们只能买到黑色的。
  car.vw_beetle:
    label: 大众甲壳虫
    summary: 一辆圆圆的小车，人们用一种昆虫给它起了名字。
    info: |
      大众甲壳虫来自德国，从1938年一直生产到2003年。
      它一共造了2100多万辆，比其他任何同一种设计的汽车都多。
      它的发动机在车尾，就在后盖下面。
  car.vw_bus:
    label: 大众面包车
    summary: 一辆亲切的面包车，适合全家出游、冲浪和露营。
    info: |
      大众Type 2来自德国，1950年第一次生产。
      早期的车前挡风玻璃分成左右两半，车头还有一个大大的V字。
      很多人把它改成了一座带轮子的小房子，开着它去旅行。
  car.jeep_willys:
    label: 威利斯吉普
    summary: 一辆小巧结实的军车，几乎哪里都能开。
    info: |
      威利斯MB是在美国为第二次世界大战制造的，从1941年生产到1945年。
      人们造了几十万辆，用来载着士兵穿过崎岖的地面。
      后来所有的吉普车，都是从它这里得名的。
  car.land_rover_defender:
    label: 路虎卫士
    summary: 一辆方方正正的英国车，专门用来穿过田野和泥地。
    info: |
      路虎来自英国，第一辆是1948年造的。
      从1990年起它被叫作“卫士”，一直生产到2016年。
      农民、探险家和救援队在世界各地都用它。
  car.mini_cooper:
    label: 迷你库珀
    summary: 一辆小小的英国车，却快得让人吃惊。
    info: |
      迷你来自英国，从1959年一直生产到2000年。
      它的发动机是横着放的，所以一辆很短的车里也能坐下四个人。
      1964年，一辆迷你库珀S赢得了著名的蒙特卡洛拉力赛。
  car.fiat_500:
    label: 菲亚特500
    summary: 一辆为城市窄街而造的意大利小车。
    info: |
      菲亚特500来自意大利，从1957年一直生产到1975年。
      它的长度不到3米，所以几乎哪里都能停。
      意大利人叫它“Cinquecento”，意思是“五百”。
  car.citroen_2cv:
    label: 雪铁龙2CV
    summary: 一辆简单的法国车，车顶可以卷起来。
    info: |
      雪铁龙2CV来自法国，从1948年一直生产到1990年。
      它是为了载着农民和他们的货物走颠簸的乡间小路而设计的。
      它柔软的布车顶可以卷起来，就像沙丁鱼罐头的盖子。
  car.citroen_ds:
    label: 雪铁龙DS
    summary: 一辆线条流畅的法国车，看起来像是从未来开来的。
    info: |
      雪铁龙DS来自法国，从1955年一直生产到1975年。
      它有特别的悬挂，启动的时候车身会升起来、沉下去。
      在法语里，“DS”听起来像“女神”这个词。
  car.mercedes_300sl:
    label: 奔驰300SL
    summary: 一辆银色跑车，车门像翅膀一样向上打开。
    info: |
      奔驰300SL来自德国，它的双门轿跑版从1954年生产到1957年。
      它的车门向上打开，所以人们叫它“鸥翼”。
      它是当时能买到的最快的汽车之一。
  car.jaguar_e_type:
    label: 捷豹E-Type
    summary: 一辆又长又流线的英国跑车。
    info: |
      捷豹E-Type来自英国，从1961年一直生产到1975年。
      它有一个很长的引擎盖，下面藏着一台大发动机。
      很多人说，它是有史以来最漂亮的汽车之一。
  car.aston_martin_db5:
    label: 阿斯顿·马丁DB5
    summary: 间谍詹姆斯·邦德开的优雅英国车。
    info: |
      阿斯顿·马丁DB5来自英国，从1963年生产到1965年。
      1964年，它在詹姆斯·邦德的电影《金手指》里出现后，变得世界闻名。
      它一共只造了大约一千辆。
  car.shelby_cobra:
    label: 谢尔比眼镜蛇
    summary: 一辆小小的敞篷车，装着一台又大又响的发动机。
    info: |
      谢尔比眼镜蛇是美国赛车手卡罗尔·谢尔比在20世纪60年代造的。
      他拿来一辆轻巧的英国跑车，给它装上了一台美国福特的大发动机。
      它赢过很多比赛，直到今天还有人照着它造车。
  car.ford_mustang:
    label: 福特野马
    summary: 一辆用野马命名的美国运动型汽车。
    info: |
      福特野马来自美国，1964年第一次上市。
      它太受欢迎了，后来一整类和它相似的车都跟着它被叫作“小马车”。
      直到今天，野马还在生产。
  car.corvette_c2:
    label: 科尔维特 Sting Ray
    summary: 一辆后窗分成两半的美国跑车。
    info: |
      雪佛兰科尔维特 Sting Ray来自美国。
      只有1963年的双门轿跑版，后窗是分成左右两半的。
      它的车身是用玻璃纤维做的，而不是钢。
  car.cadillac_eldorado:
    label: 凯迪拉克黄金国
    summary: 一辆巨大的美国车，有着史上最大的尾鳍。
    info: |
      1959年的凯迪拉克黄金国来自美国。
      它高高的尾鳍像火箭一样，是装在汽车上最高的尾鳍之一。
      它的长度超过5米半。
  car.chevrolet_bel_air:
    label: 雪佛兰贝莱尔
    summary: 一辆闪亮的20世纪50年代美国车，有镀铬装饰和小尾鳍。
    info: |
      1957年的雪佛兰贝莱尔来自美国。
      它有双色车漆和很多镀铬装饰，成了20世纪50年代美国的象征。
      在古巴，直到今天还有很多这样的老车在街上跑。
  car.ford_gt40:
    label: 福特GT40
    summary: 一辆很矮的美国赛车，它打败了法拉利。
    info: |
      福特GT40是在20世纪60年代为了赢得勒芒24小时耐力赛而造的。
      从1966年到1969年，它连续四年赢得了勒芒比赛。
      它叫GT40，是因为它只有大约40英寸（1米）高。
  car.porsche_911_classic:
    label: 保时捷911 Carrera RS
    summary: 一辆经典的德国跑车，有一个小小的“鸭尾”扰流板。
    info: |
      保时捷911来自德国，第一辆是1964年造的。
      1973年的Carrera RS是一款又轻又快的版本，是为比赛而造的。
      它车尾的小扰流板看起来像鸭子的尾巴。
  car.porsche_911_modern:
    label: 保时捷911
    summary: 一款外形60年都没变的跑车的现代版。
    info: |
      保时捷911来自德国，这一款是2019年推出的。
      它仍然有圆圆的大灯，发动机也还在车尾，和第一辆911一样。
      它是世界上生产时间最长的跑车系列之一。
  car.lamborghini_countach:
    label: 兰博基尼康塔什
    summary: 一辆又扁又尖的意大利超级跑车，车门向上打开。
    info: |
      兰博基尼康塔什来自意大利，从1974年一直生产到1990年。
      它的车门向前上方翻起，就像一把剪刀。
      很多孩子都在卧室墙上贴过它的海报。
  car.ferrari_testarossa:
    label: 法拉利Testarossa
    summary: 一辆宽宽的红色意大利跑车，车身两侧有条纹。
    info: |
      法拉利Testarossa来自意大利，1984年第一次生产。
      “Testarossa”在意大利语里的意思是“红色的头”，因为它发动机的顶部漆成了红色。
      车身两侧长长的条纹能让空气进去，给发动机降温。
  car.ferrari_f40:
    label: 法拉利F40
    summary: 一辆红色的意大利超级跑车，车尾有一个大尾翼。
    info: |
      法拉利F40来自意大利，从1987年一直生产到1992年。
      它是为了庆祝法拉利40岁生日而造的，名字就是这么来的。
      它是最早能跑到每小时320公里以上的公路汽车之一。
  car.delorean:
    label: 德罗宁
    summary: 一辆闪亮的钢制汽车，在电影里变成了时光机。
    info: |
      德罗宁DMC-12是在北爱尔兰制造的，生产于1981年和1982年。
      它的车身是裸露的不锈钢，一点漆都没有刷，车门向上打开。
      它因为在电影《回到未来》里当时光机而出了名。
  car.london_taxi:
    label: 伦敦出租车
    summary: 在伦敦载着人们到处跑的著名黑色出租车。
    info: |
      奥斯汀FX4来自英国，从1958年一直生产到1997年。
      它能在很小的圈子里掉头，这在伦敦狭窄的街道上很有用。
      它的车顶很高，是为了让乘客戴着帽子也能坐在里面。
  car.toyota_land_cruiser:
    label: 丰田陆地巡洋舰
    summary: 一辆结实的日本车，能穿过沙漠和丛林。
    info: |
      丰田陆地巡洋舰FJ40来自日本，从1960年一直生产到1984年。
      它卖到了世界各地，以非常不容易坏而出名。
      直到今天，还有很多辆在崎岖的路上跑。
  car.mazda_mx5:
    label: 马自达MX-5
    summary: 一辆快乐的日本双座小车，大灯可以弹起来。
    info: |
      马自达MX-5来自日本，1989年第一次上市。
      第一代的大灯可以从引擎盖里翻起来。
      它是世界上卖得最多的双座跑车。
  car.trabant:
    label: 特拉班特
    summary: 一辆东德小车，车身有一部分是塑料做的。
    info: |
      特拉班特来自东德，从1957年一直生产到1991年。
      它的车身不是用钢，而是用混有棉纤维的硬塑料做的。
      人们常常要等很多年才能买到一辆。
  car.bugatti_veyron:
    label: 布加迪威龙
    summary: 一辆快得惊人的汽车，时速能超过400公里。
    info: |
      布加迪威龙来自法国，从2005年一直生产到2015年。
      它的发动机有16个气缸，马力超过1000匹。
      它刚推出的时候，是世界上最快的公路汽车。
  car.tesla_model_s:
    label: 特斯拉Model S
    summary: 一辆用电而不是用汽油的快速美国车。
    info: |
      特斯拉Model S来自美国，2012年开始销售。
      它靠车底的大电池行驶，所以没有排气管。
      因为车头没有发动机，那里多了一个前备箱。
