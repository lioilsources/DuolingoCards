lang: ko
pivot: false
title: 유명한 자동차
cards:
  car.ford_model_t:
    label: 포드 모델 T
    summary: 평범한 가족도 자동차를 탈 수 있게 해 준 차예요.
    info: |
      포드 모델 T는 1908년부터 1927년까지 미국에서 만들어졌어요.
      움직이는 조립 라인에서 만들어서 값이 쌌고, 1500만 대가 넘게 만들어졌어요.
      오랫동안 검은색으로만 살 수 있었어요.
  car.vw_beetle:
    label: 폭스바겐 비틀
    summary: 사람들이 곤충 이름을 붙여 준 작고 동그란 차예요.
    info: |
      폭스바겐 비틀은 독일 차이고, 1938년부터 2003년까지 만들어졌어요.
      2100만 대가 넘게 만들어져서, 한 가지 디자인으로 만든 차 중에서 가장 많아요.
      엔진은 차 뒤쪽, 뒤 덮개 아래에 있어요.
  car.vw_bus:
    label: 폭스바겐 버스
    summary: 가족, 서핑하는 사람들, 캠핑 여행에 딱 맞는 다정한 승합차예요.
    info: |
      폭스바겐 타입 2는 독일 차이고, 1950년에 처음 만들어졌어요.
      초기 모델은 앞 유리가 두 쪽으로 나뉘어 있었고, 앞에 커다란 V 자가 있었어요.
      많은 사람들이 이 차를 여행을 위한 바퀴 달린 작은 집으로 바꾸었어요.
  car.jeep_willys:
    label: 윌리스 지프
    summary: 거의 어디든 달릴 수 있는 작고 튼튼한 군용차예요.
    info: |
      윌리스 MB는 제2차 세계 대전을 위해 1941년부터 1945년까지 미국에서 만들어졌어요.
      울퉁불퉁한 땅에서 군인들을 태우고 다니려고 수십만 대가 만들어졌어요.
      그 뒤에 나온 모든 지프 자동차는 이 차에서 이름을 따왔어요.
  car.land_rover_defender:
    label: 랜드로버 디펜더
    summary: 들판과 진흙길을 달리려고 만든 네모난 영국 차예요.
    info: |
      랜드로버는 영국 차이고, 첫 번째 차는 1948년에 만들어졌어요.
      1990년부터는 디펜더라고 불렸고, 2016년까지 만들어졌어요.
      농부, 탐험가, 구조대가 전 세계에서 이 차를 썼어요.
  car.mini_cooper:
    label: 미니 쿠퍼
    summary: 아주 작은데도 놀랄 만큼 빠른 영국 차예요.
    info: |
      미니는 영국 차이고, 1959년부터 2000년까지 만들어졌어요.
      엔진이 옆으로 놓여 있어서, 아주 짧은 차인데도 네 사람이 탈 수 있어요.
      1964년에는 미니 쿠퍼 S가 유명한 몬테카를로 랠리에서 우승했어요.
  car.fiat_500:
    label: 피아트 500
    summary: 좁은 도시 골목길을 위해 만든 아주 작은 이탈리아 차예요.
    info: |
      피아트 500은 이탈리아 차이고, 1957년부터 1975년까지 만들어졌어요.
      길이가 3미터도 안 돼서, 거의 어디에나 주차할 수 있어요.
      이탈리아 사람들은 이 차를 "친퀘첸토"라고 불러요. "오백"이라는 뜻이에요.
  car.citroen_2cv:
    label: 시트로엥 2CV
    summary: 지붕을 돌돌 말아 열 수 있는 단순한 프랑스 차예요.
    info: |
      시트로엥 2CV는 프랑스 차이고, 1948년부터 1990년까지 만들어졌어요.
      울퉁불퉁한 시골길에서 농부와 짐을 실어 나르려고 만들었어요.
      부드러운 천 지붕은 정어리 통조림 뚜껑처럼 돌돌 말려요.
  car.citroen_ds:
    label: 시트로엥 DS
    summary: 미래에서 온 것처럼 보이는 매끈한 프랑스 차예요.
    info: |
      시트로엥 DS는 프랑스 차이고, 1955년부터 1975년까지 만들어졌어요.
      특별한 서스펜션 덕분에 시동을 걸면 차가 위로 올라갔다가 아래로 내려가요.
      프랑스어로 "DS"는 "여신"이라는 말과 비슷하게 들려요.
  car.mercedes_300sl:
    label: 메르세데스-벤츠 300 SL
    summary: 문이 날개처럼 위로 열리는 은색 스포츠카예요.
    info: |
      메르세데스-벤츠 300 SL은 독일 차이고, 쿠페는 1954년부터 1957년까지 만들어졌어요.
      문이 위로 열려서 사람들은 이 차를 "걸윙"이라고 불러요.
      그 시절에 살 수 있는 가장 빠른 차 중 하나였어요.
  car.jaguar_e_type:
    label: 재규어 E-타입
    summary: 길고 날렵한 영국 스포츠카예요.
    info: |
      재규어 E-타입은 영국 차이고, 1961년부터 1975년까지 만들어졌어요.
      아주 긴 보닛이 있고, 그 아래에 커다란 엔진이 들어 있어요.
      많은 사람들이 지금까지 만들어진 차 중에서 가장 아름다운 차 중 하나라고 말해요.
  car.aston_martin_db5:
    label: 애스턴 마틴 DB5
    summary: 스파이 제임스 본드가 타는 우아한 영국 차예요.
    info: |
      애스턴 마틴 DB5는 영국 차이고, 1963년부터 1965년까지 만들어졌어요.
      1964년 제임스 본드 영화 "007 골드핑거"에 나와서 전 세계에 유명해졌어요.
      겨우 1000대쯤만 만들어졌어요.
  car.shelby_cobra:
    label: 셸비 코브라
    summary: 엄청나게 크고 시끄러운 엔진을 단 작은 오픈카예요.
    info: |
      셸비 코브라는 1960년대에 미국의 레이서 캐럴 셸비가 만들었어요.
      그는 가벼운 영국 스포츠카에 커다란 미국 포드 엔진을 달았어요.
      많은 경주에서 이겼고, 지금도 사람들이 따라서 만들고 있어요.
  car.ford_mustang:
    label: 포드 머스탱
    summary: 야생마의 이름을 딴 멋진 미국 차예요.
    info: |
      포드 머스탱은 미국 차이고, 1964년에 처음 팔리기 시작했어요.
      인기가 너무 많아서, 비슷한 차들을 이 차를 따라 "포니카"라고 부르게 되었어요.
      머스탱은 지금도 만들어지고 있어요.
  car.corvette_c2:
    label: 콜벳 스팅레이
    summary: 뒤 유리창이 두 쪽으로 나뉜 미국 스포츠카예요.
    info: |
      쉐보레 콜벳 스팅레이는 미국 차예요.
      뒤 유리창이 두 쪽으로 나뉜 것은 1963년 쿠페뿐이었어요.
      차체는 강철이 아니라 유리 섬유로 만들었어요.
  car.cadillac_eldorado:
    label: 캐딜락 엘도라도
    summary: 지금까지 가장 큰 꼬리 날개를 단 커다란 미국 차예요.
    info: |
      1959년 캐딜락 엘도라도는 미국 차예요.
      로켓 모양의 높은 꼬리 날개는 자동차에 달린 것 중에서 가장 높은 편이에요.
      길이가 5미터 반이 넘어요.
  car.chevrolet_bel_air:
    label: 쉐보레 벨 에어
    summary: 반짝이는 크롬 장식과 작은 꼬리 날개가 있는 1950년대 미국 차예요.
    info: |
      1957년 쉐보레 벨 에어는 미국 차예요.
      두 가지 색 페인트와 많은 크롬 장식으로 1950년대 미국을 상징하는 차가 되었어요.
      쿠바에서는 지금도 이런 오래된 차들이 많이 거리를 달리고 있어요.
  car.ford_gt40:
    label: 포드 GT40
    summary: 페라리를 이긴 아주 낮은 미국 경주용 차예요.
    info: |
      포드 GT40은 1960년대에 르망 24시간 경주에서 이기려고 만들었어요.
      1966년부터 1969년까지 4년 연속으로 르망에서 우승했어요.
      높이가 약 40인치(1미터)밖에 안 돼서 GT40이라고 불려요.
  car.porsche_911_classic:
    label: 포르쉐 911 카레라 RS
    summary: 작은 "덕테일" 스포일러가 달린 독일의 클래식 스포츠카예요.
    info: |
      포르쉐 911은 독일 차이고, 첫 번째 차는 1964년에 만들어졌어요.
      1973년 카레라 RS는 경주를 위해 만든 가볍고 빠른 모델이었어요.
      뒤에 달린 작은 스포일러가 오리 꼬리처럼 생겼어요.
  car.porsche_911_modern:
    label: 포르쉐 911
    summary: 60년 동안 모양을 지켜 온 스포츠카의 새로운 모델이에요.
    info: |
      포르쉐 911은 독일 차이고, 이 모델은 2019년에 나왔어요.
      첫 번째 911처럼 지금도 동그란 헤드라이트가 있고 엔진은 뒤에 있어요.
      세계에서 가장 오래 만들어지고 있는 스포츠카 시리즈 중 하나예요.
  car.lamborghini_countach:
    label: 람보르기니 쿤타치
    summary: 문이 위로 열리는 납작하고 날카로운 이탈리아 슈퍼카예요.
    info: |
      람보르기니 쿤타치는 이탈리아 차이고, 1974년부터 1990년까지 만들어졌어요.
      문이 가위처럼 앞쪽 위로 올라가며 열려요.
      많은 아이들이 이 차의 포스터를 방 벽에 붙여 두었어요.
  car.ferrari_testarossa:
    label: 페라리 테스타로사
    summary: 옆면에 줄무늬가 있는 넓적한 빨간 이탈리아 스포츠카예요.
    info: |
      페라리 테스타로사는 이탈리아 차이고, 1984년에 처음 만들어졌어요.
      "테스타로사"는 이탈리아어로 "빨간 머리"라는 뜻인데, 엔진 윗부분이 빨갛게 칠해져 있기 때문이에요.
      옆면의 긴 줄무늬로 공기가 들어가서 엔진을 식혀 줘요.
  car.ferrari_f40:
    label: 페라리 F40
    summary: 뒤에 커다란 날개가 달린 빨간 이탈리아 슈퍼카예요.
    info: |
      페라리 F40은 이탈리아 차이고, 1987년부터 1992년까지 만들어졌어요.
      페라리의 40번째 생일을 기념해서 만들어서 이런 이름이 붙었어요.
      시속 320킬로미터보다 빨리 달릴 수 있었던 최초의 도로용 차 중 하나예요.
  car.delorean:
    label: 드로리안
    summary: 영화에서 타임머신이 된 반짝이는 강철 자동차예요.
    info: |
      드로리안 DMC-12는 1981년과 1982년에 북아일랜드에서 만들어졌어요.
      차체는 페인트를 칠하지 않은 맨 스테인리스강이고, 문은 위로 열려요.
      영화 "백 투 더 퓨처"에서 타임머신으로 나와서 유명해졌어요.
  car.london_taxi:
    label: 런던 택시
    summary: 런던 곳곳으로 사람들을 태워 주는 유명한 검은 택시예요.
    info: |
      오스틴 FX4는 영국 차이고, 1958년부터 1997년까지 만들어졌어요.
      아주 작은 원을 그리며 돌 수 있어서, 런던의 좁은 거리에서 쓸모가 많아요.
      지붕이 높은 것은 손님이 모자를 쓴 채로 앉을 수 있게 하려고 그렇게 만든 거예요.
  car.toyota_land_cruiser:
    label: 토요타 랜드크루저
    summary: 사막과 정글도 달릴 수 있는 튼튼한 일본 차예요.
    info: |
      토요타 랜드크루저 FJ40은 일본 차이고, 1960년부터 1984년까지 만들어졌어요.
      전 세계에서 팔렸고, 아주 잘 고장 나지 않는 것으로 유명해요.
      지금도 많은 차가 험한 길을 달리고 있어요.
  car.mazda_mx5:
    label: 마쓰다 MX-5
    summary: 헤드라이트가 쏙 튀어나오는, 작고 신나는 일본의 2인승 차예요.
    info: |
      마쓰다 MX-5는 일본 차이고, 1989년에 처음 팔리기 시작했어요.
      첫 번째 모델은 헤드라이트가 보닛에서 위로 툭 올라왔어요.
      세계에서 가장 많이 팔린 2인승 스포츠카예요.
  car.trabant:
    label: 트라반트
    summary: 차체 일부가 플라스틱으로 된 동독의 작은 차예요.
    info: |
      트라반트는 동독 차이고, 1957년부터 1991년까지 만들어졌어요.
      차체는 강철 대신 면 섬유를 섞은 단단한 플라스틱으로 만들었어요.
      사람들은 이 차를 사려고 몇 년씩 기다려야 할 때가 많았어요.
  car.bugatti_veyron:
    label: 부가티 베이론
    summary: 시속 400킬로미터가 넘게 달릴 수 있는 엄청나게 빠른 차예요.
    info: |
      부가티 베이론은 프랑스 차이고, 2005년부터 2015년까지 만들어졌어요.
      엔진에는 실린더가 16개 있고, 1000마력이 넘어요.
      처음 나왔을 때 세계에서 가장 빠른 도로용 차였어요.
  car.tesla_model_s:
    label: 테슬라 모델 S
    summary: 휘발유 대신 전기로 달리는 빠른 미국 차예요.
    info: |
      테슬라 모델 S는 미국 차이고, 2012년에 팔리기 시작했어요.
      바닥 아래에 있는 커다란 배터리로 달리기 때문에 배기관이 없어요.
      앞쪽에 엔진이 없어서, 그곳에 트렁크가 하나 더 있어요.
