lang: ja
pivot: false
title: 有名な車
cards:
  car.ford_model_t:
    label: T型フォード
    summary: ふつうの家族でも車に乗れるようにした車です。
    info: |
      T型フォードはアメリカで、1908年から1927年までつくられました。
      動くベルトコンベアの上で組み立てたので安くでき、1500万台以上もつくられました。
      長いあいだ、色は黒しか買えませんでした。
  car.vw_beetle:
    label: フォルクスワーゲン・ビートル
    summary: 虫の名前をつけられた、小さくて丸い車です。
    info: |
      フォルクスワーゲン・ビートルはドイツの車で、1938年から2003年までつくられました。
      2100万台以上つくられ、ひとつの形の車としては、ほかのどの車よりもたくさんつくられました。
      エンジンは車のうしろ、うしろのふたの下にあります。
  car.vw_bus:
    label: ワーゲンバス
    summary: 家族やサーファー、キャンプ旅行にぴったりの、親しみやすいワゴン車です。
    info: |
      フォルクスワーゲン・タイプ2はドイツの車で、1950年に初めてつくられました。
      初期のものは、フロントガラスがまん中で2つに分かれていて、前に大きなVのマークがついていました。
      多くの人が、旅をするための車輪のついた小さな家に作りかえました。
  car.jeep_willys:
    label: ウィリス・ジープ
    summary: ほとんどどこでも走れる、小さくてじょうぶな軍用車です。
    info: |
      ウィリスMBは第二次世界大戦のためにアメリカで、1941年から1945年までつくられました。
      でこぼこの土地で兵士を運ぶために、何十万台もつくられました。
      そのあとに生まれたジープという車はみんな、この車から名前をもらっています。
  car.land_rover_defender:
    label: ランドローバー・ディフェンダー
    summary: 畑やどろの中を走るためにつくられた、四角いイギリスの車です。
    info: |
      ランドローバーはイギリスの車で、最初の1台は1948年につくられました。
      1990年からはディフェンダーとよばれ、2016年までつくられました。
      農家の人や探検家、救助隊が、世界中で使いました。
  car.mini_cooper:
    label: ミニ・クーパー
    summary: とても小さいのに、おどろくほど速いイギリスの車です。
    info: |
      ミニはイギリスの車で、1959年から2000年までつくられました。
      エンジンが横向きに置かれているので、とても短い車なのに4人乗れます。
      1964年には、ミニ・クーパーSが有名なモンテカルロ・ラリーで優勝しました。
  car.fiat_500:
    label: フィアット500
    summary: せまい町の道のためにつくられた、小さなイタリアの車です。
    info: |
      フィアット500はイタリアの車で、1957年から1975年までつくられました。
      長さが3メートルもないので、ほとんどどこにでもとめられます。
      イタリアの人は「チンクエチェント」とよびます。「500」という意味です。
  car.citroen_2cv:
    label: シトロエン2CV
    summary: 屋根をくるくる巻いて開けられる、シンプルなフランスの車です。
    info: |
      シトロエン2CVはフランスの車で、1948年から1990年までつくられました。
      でこぼこのいなか道で、農家の人と荷物を運ぶために考えられました。
      やわらかい布の屋根は、イワシのかんづめのふたのようにくるくる巻けます。
  car.citroen_ds:
    label: シトロエンDS
    summary: 未来からやって来たように見える、なめらかなフランスの車です。
    info: |
      シトロエンDSはフランスの車で、1955年から1975年までつくられました。
      とくべつなサスペンションのおかげで、エンジンをかけると車体が上がったり下がったりします。
      フランス語で「DS」は、「女神」という言葉と同じように聞こえます。
  car.mercedes_300sl:
    label: メルセデス・ベンツ300SL
    summary: つばさのように上に開くドアがある、銀色のスポーツカーです。
    info: |
      メルセデス・ベンツ300SLはドイツの車で、クーペは1954年から1957年までつくられました。
      ドアが上に開くので、「ガルウイング」とよばれています。
      そのころ買える車の中で、いちばん速い車のひとつでした。
  car.jaguar_e_type:
    label: ジャガーEタイプ
    summary: 長くてスマートなイギリスのスポーツカーです。
    info: |
      ジャガーEタイプはイギリスの車で、1961年から1975年までつくられました。
      とても長いボンネットがあり、その下に大きなエンジンが入っています。
      これまでにつくられた車の中で、いちばん美しい車のひとつだと言う人がたくさんいます。
  car.aston_martin_db5:
    label: アストンマーティンDB5
    summary: スパイのジェームズ・ボンドが乗る、上品なイギリスの車です。
    info: |
      アストンマーティンDB5はイギリスの車で、1963年から1965年までつくられました。
      1964年のジェームズ・ボンドの映画「007 ゴールドフィンガー」で、世界中で有名になりました。
      つくられたのは、およそ1000台だけです。
  car.shelby_cobra:
    label: シェルビー・コブラ
    summary: 大きくて音の大きなエンジンをつんだ、小さなオープンカーです。
    info: |
      シェルビー・コブラは1960年代に、アメリカのレーサー、キャロル・シェルビーがつくりました。
      軽いイギリスのスポーツカーに、アメリカのフォードの大きなエンジンをのせたのです。
      たくさんのレースで勝ち、今でもまねしてつくられています。
  car.ford_mustang:
    label: フォード・マスタング
    summary: 野生の馬の名前がついた、スポーティーなアメリカの車です。
    info: |
      フォード・マスタングはアメリカの車で、1964年に初めて売り出されました。
      とても人気が出たので、にた車のグループがこの車にちなんで「ポニーカー」とよばれるようになりました。
      マスタングは今もつくられています。
  car.corvette_c2:
    label: コルベット・スティングレイ
    summary: うしろの窓が2つに分かれた、アメリカのスポーツカーです。
    info: |
      シボレー・コルベット・スティングレイはアメリカの車です。
      うしろの窓がまん中で2つに分かれていたのは、1963年のクーペだけでした。
      車体は鉄ではなく、ガラス繊維でできています。
  car.cadillac_eldorado:
    label: キャデラック・エルドラド
    summary: これまでで最大のテールフィンがある、大きなアメリカの車です。
    info: |
      1959年のキャデラック・エルドラドはアメリカの車です。
      ロケットのような形の高いテールフィンは、車につけられたものの中でいちばん高いもののひとつです。
      長さは5メートル半以上あります。
  car.chevrolet_bel_air:
    label: シボレー・ベルエア
    summary: クロームメッキと小さなテールフィンがかがやく、1950年代のアメリカの車です。
    info: |
      1957年のシボレー・ベルエアはアメリカの車です。
      2色のぬり分けとたくさんのクロームメッキで、1950年代のアメリカのシンボルになりました。
      キューバでは、今でもこの古い車がたくさん町を走っています。
  car.ford_gt40:
    label: フォードGT40
    summary: フェラーリに勝った、とても低いアメリカのレースカーです。
    info: |
      フォードGT40は1960年代に、ル・マン24時間レースで勝つためにつくられました。
      1966年から1969年まで、4年続けてル・マンで優勝しました。
      高さが約40インチ（1メートル）しかないので、GT40という名前になりました。
  car.porsche_911_classic:
    label: ポルシェ911カレラRS
    summary: 小さな「ダックテール」のスポイラーがある、ドイツのクラシックなスポーツカーです。
    info: |
      ポルシェ911はドイツの車で、最初の1台は1964年につくられました。
      1973年のカレラRSは、レースのためにつくられた軽くて速いモデルでした。
      うしろの小さなスポイラーが、アヒルのしっぽのように見えます。
  car.porsche_911_modern:
    label: ポルシェ911
    summary: 60年間ずっと同じ形をたもってきたスポーツカーの、新しいモデルです。
    info: |
      ポルシェ911はドイツの車で、このモデルは2019年に登場しました。
      最初の911と同じように、今も丸いヘッドライトがあり、エンジンはうしろにあります。
      世界でいちばん長くつくられ続けているスポーツカーのシリーズのひとつです。
  car.lamborghini_countach:
    label: ランボルギーニ・カウンタック
    summary: ドアが上に開く、ひらべったくてとがったイタリアのスーパーカーです。
    info: |
      ランボルギーニ・カウンタックはイタリアの車で、1974年から1990年までつくられました。
      ドアは、はさみのように前に向かって上に開きます。
      たくさんの子どもたちが、この車のポスターを部屋のかべにはっていました。
  car.ferrari_testarossa:
    label: フェラーリ・テスタロッサ
    summary: 横にしまもようがある、はばの広い赤いイタリアのスポーツカーです。
    info: |
      フェラーリ・テスタロッサはイタリアの車で、1984年に初めてつくられました。
      エンジンの上の部分が赤くぬられているので、イタリア語で「赤い頭」という意味の「テスタロッサ」になりました。
      横の長いしまもようから空気が入って、エンジンを冷やします。
  car.ferrari_f40:
    label: フェラーリF40
    summary: うしろに大きなウイングがある、赤いイタリアのスーパーカーです。
    info: |
      フェラーリF40はイタリアの車で、1987年から1992年までつくられました。
      フェラーリの40さいの誕生日を記念してつくられたので、この名前がつきました。
      時速320キロより速く走れた、最初のころの市販車のひとつです。
  car.delorean:
    label: デロリアン
    summary: 映画でタイムマシンになった、ぴかぴかのステンレスの車です。
    info: |
      デロリアンDMC-12は北アイルランドで、1981年と1982年につくられました。
      車体はペンキをぬっていない、むき出しのステンレスで、ドアは上に開きます。
      映画「バック・トゥ・ザ・フューチャー」のタイムマシンとして有名になりました。
  car.london_taxi:
    label: ロンドンタクシー
    summary: ロンドンの町で人を運ぶ、有名な黒いタクシーです。
    info: |
      オースチンFX4はイギリスの車で、1958年から1997年までつくられました。
      とても小さな円をえがいてUターンできるので、ロンドンのせまい道で役に立ちます。
      屋根が高いのは、乗る人がぼうしをかぶったまますわれるようにするためです。
  car.toyota_land_cruiser:
    label: トヨタ・ランドクルーザー
    summary: さばくやジャングルも走れる、じょうぶな日本の車です。
    info: |
      トヨタ・ランドクルーザーFJ40は日本の車で、1960年から1984年までつくられました。
      世界中で売られ、とてもこわれにくいことで知られています。
      今でもたくさんの車が、でこぼこ道を走っています。
  car.mazda_mx5:
    label: マツダ・ロードスター
    summary: ヘッドライトがぱかっと出てくる、小さくて元気な日本の2人乗りの車です。
    info: |
      マツダ・ロードスター（MX-5）は日本の車で、1989年に初めて売り出されました。
      最初のモデルには、ボンネットからぱかっと起き上がるヘッドライトがありました。
      世界でいちばんたくさん売れている、2人乗りのスポーツカーです。
  car.trabant:
    label: トラバント
    summary: 車体の一部がプラスチックでできた、東ドイツの小さな車です。
    info: |
      トラバントは東ドイツの車で、1957年から1991年までつくられました。
      車体は鉄ではなく、かたいプラスチックに綿のせんいをまぜたものでできていました。
      1台買うのに、何年も待たなければならないことがよくありました。
  car.bugatti_veyron:
    label: ブガッティ・ヴェイロン
    summary: 時速400キロ以上も出せる、ものすごく速い車です。
    info: |
      ブガッティ・ヴェイロンはフランスの車で、2005年から2015年までつくられました。
      エンジンには16個のシリンダーがあり、1000馬力以上の力があります。
      登場したときは、世界でいちばん速い市販車でした。
  car.tesla_model_s:
    label: テスラ・モデルS
    summary: ガソリンではなく電気で走る、速いアメリカの車です。
    info: |
      テスラ・モデルSはアメリカの車で、2012年に売り出されました。
      床の下にある大きなバッテリーで走るので、マフラーがありません。
      前にエンジンがないので、そこにもうひとつトランクがあります。
