lang: sr
pivot: false
title: Чувени аутомобили
cards:
  car.ford_model_t:
    label: Форд модел Т
    summary: Ауто захваљујући коме су и обичне породице могле да се возе колима.
    info: |
      Форд модел Т прављен је у САД од 1908. до 1927. године.
      Склапао се на покретној траци, па је био јефтин, и направљено их је више од 15 милиона.
      Много година могао је да се купи само у црној боји.
  car.vw_beetle:
    label: Фолксваген буба
    summary: Мали округли ауто који су људи назвали по инсекту.
    info: |
      Фолксваген буба потиче из Немачке и прављена је од 1938. до 2003. године.
      Направљено их је више од 21 милион, више него иједног другог аутомобила истог облика.
      Мотор јој је позади, испод задњег поклопца.
  car.vw_bus:
    label: Фолксваген комби
    summary: Пријатељски комби за породице, сурфере и камповање.
    info: |
      Фолксваген тип 2 потиче из Немачке и први пут је направљен 1950. године.
      Први модели имали су шофершајбну подељену на две половине и велико V спреда.
      Многи људи су га претворили у малу кућицу на точковима за путовања.
  car.jeep_willys:
    label: Џип Вилис
    summary: Мали, издржљив војни ауто који је могао да прође скоро свуда.
    info: |
      Вилис MB прављен је у САД за Други светски рат, од 1941. до 1945. године.
      Направљено их је на стотине хиљада, да возе војнике по неравном терену.
      По њему су добили име сви џипови који су дошли после њега.
  car.land_rover_defender:
    label: Ленд ровер дифендер
    summary: Четвртасти британски ауто направљен за вожњу по њивама и блату.
    info: |
      Ленд ровер потиче из Уједињеног Краљевства, а први је направљен 1948. године.
      Од 1990. звао се дифендер и прављен је до 2016. године.
      Користили су га фармери, истраживачи и спасиоци широм света.
  car.mini_cooper:
    label: Мини купер
    summary: Сићушни британски ауто који је био изненађујуће брз.
    info: |
      Мини потиче из Уједињеног Краљевства и прављен је од 1959. до 2000. године.
      Мотор му стоји попреко, па у веома кратак ауто могу да стану четири особе.
      Мини купер S победио је на чувеном релију Монте Карло 1964. године.
  car.fiat_500:
    label: Фијат 500
    summary: Сићушни италијански ауто за уске градске улице.
    info: |
      Фијат 500 потиче из Италије и прављен је од 1957. до 1975. године.
      Краћи је од 3 метра, па може да се паркира скоро било где.
      Италијани га зову „Чинквеченто“, што значи „петсто“.
  car.citroen_2cv:
    label: Ситроен 2CV
    summary: Једноставан француски ауто с кровом који може да се смота.
    info: |
      Ситроен 2CV потиче из Француске и прављен је од 1948. до 1990. године.
      Направљен је да вози сељаке и њихову робу по квргавим сеоским путевима.
      Његов меки платнени кров смота се као поклопац конзерве сардина.
  car.citroen_ds:
    label: Ситроен DS
    summary: Углађен француски ауто који је изгледао као да је дошао из будућности.
    info: |
      Ситроен DS потиче из Француске и прављен је од 1955. до 1975. године.
      Његово посебно вешање подиже ауто и спушта га кад се упали.
      На француском „DS“ звучи као реч за „богиња“.
  car.mercedes_300sl:
    label: Мерцедес-бенц 300 SL
    summary: Сребрни спортски ауто с вратима која се отварају нагоре као крила.
    info: |
      Мерцедес-бенц 300 SL потиче из Немачке, а купе је прављен од 1954. до 1957. године.
      Врата му се отварају нагоре, па га људи зову „Галебово крило“.
      У своје време био је један од најбржих аутомобила који су могли да се купе.
  car.jaguar_e_type:
    label: Јагуар E-Type
    summary: Дугачак, витак британски спортски ауто.
    info: |
      Јагуар E-Type потиче из Уједињеног Краљевства и прављен је од 1961. до 1975. године.
      Има веома дугачку хаубу испод које је велики мотор.
      Многи кажу да је то један од најлепших аутомобила икада направљених.
  car.aston_martin_db5:
    label: Астон мартин DB5
    summary: Елегантни британски ауто шпијуна Џејмса Бонда.
    info: |
      Астон мартин DB5 потиче из Уједињеног Краљевства и прављен је од 1963. до 1965. године.
      Постао је светски познат у филму о Џејмсу Бонду „Голдфингер“ 1964. године.
      Направљено их је само око хиљаду.
  car.shelby_cobra:
    label: Шелби кобра
    summary: Мали отворени ауто с огромним, бучним мотором.
    info: |
      Шелби кобру направио је шездесетих година амерички возач трка Керол Шелби.
      Узео је лаки британски спортски ауто и уградио у њега велики амерички Фордов мотор.
      Победила је на многим тркама и још увек је копирају.
  car.ford_mustang:
    label: Форд мустанг
    summary: Спортски амерички ауто назван по дивљем коњу.
    info: |
      Форд мустанг потиче из САД и први пут се продавао 1964. године.
      Био је толико популаран да је по њему цела група сличних аутомобила названа „пони кола“.
      Мустанг се прави и данас.
  car.corvette_c2:
    label: Корвета стинг реј
    summary: Амерички спортски ауто са задњим стаклом подељеним на два дела.
    info: |
      Шевролет корвета стинг реј потиче из САД.
      Само купе из 1963. године имао је задње стакло подељено на две половине.
      Каросерија му је од фибергласа уместо од челика.
  car.cadillac_eldorado:
    label: Кадилак елдорадо
    summary: Огроман амерички ауто с највећим репним перајима икада.
    info: |
      Кадилак елдорадо из 1959. године потиче из САД.
      Његова висока задња пераја, у облику ракете, спадају међу највиша која је ауто икада имао.
      Дугачак је више од 5 и по метара.
  car.chevrolet_bel_air:
    label: Шевролет бел ер
    summary: Сјајан амерички ауто из педесетих с хромом и малим перајима.
    info: |
      Шевролет бел ер из 1957. године потиче из САД.
      Са двобојном фарбом и пуно хрома постао је симбол Америке педесетих година.
      На Куби многи такви стари аутомобили и данас возе по улицама.
  car.ford_gt40:
    label: Форд GT40
    summary: Веома низак амерички тркачки ауто који је победио Ферари.
    info: |
      Форд GT40 направљен је шездесетих година да победи на трци 24 сата Ле Мана.
      Побеђивао је у Ле Ману четири године заредом, од 1966. до 1969. године.
      Зове се GT40 зато што је висок само око 40 инча (1 метар).
  car.porsche_911_classic:
    label: Порше 911 карера RS
    summary: Класични немачки спортски ауто с малим спојлером „пачји реп“.
    info: |
      Порше 911 потиче из Немачке, а први је направљен 1964. године.
      Карера RS из 1973. године била је лака, брза верзија направљена за трке.
      Њен мали задњи спојлер личи на пачји реп.
  car.porsche_911_modern:
    label: Порше 911
    summary: Модерна верзија спортског аута који већ 60 година чува исти облик.
    info: |
      Порше 911 потиче из Немачке, а ова верзија изашла је 2019. године.
      И даље има округле фарове и мотор позади, баш као први 911.
      То је једна од најдуже прављених породица спортских аутомобила на свету.
  car.lamborghini_countach:
    label: Ламборгини каунтач
    summary: Пљоснат, оштар италијански суперауто с вратима која се отварају нагоре.
    info: |
      Ламборгини каунтач потиче из Италије и прављен је од 1974. до 1990. године.
      Врата му се подижу нагоре и унапред, као маказе.
      Многа деца су имала његов постер на зиду своје собе.
  car.ferrari_testarossa:
    label: Ферари тестароса
    summary: Широк црвени италијански спортски ауто с пругама са стране.
    info: |
      Ферари тестароса потиче из Италије и први пут је направљен 1984. године.
      „Тестароса“ на италијанском значи „црвена глава“, јер је врх његовог мотора обојен у црвено.
      Дугачке пруге са стране пуштају ваздух који хлади мотор.
  car.ferrari_f40:
    label: Ферари F40
    summary: Црвени италијански суперауто с великим крилом позади.
    info: |
      Ферари F40 потиче из Италије и прављен је од 1987. до 1992. године.
      Направљен је за 40. рођендан Ферарија, и одатле му потиче име.
      Био је један од првих аутомобила за пут који су могли да возе брже од 320 km/h.
  car.delorean:
    label: Делоријан
    summary: Сјајан челични ауто који је у филму постао времеплов.
    info: |
      Делоријан DMC-12 прављен је у Северној Ирској 1981. и 1982. године.
      Каросерија му је од голог нерђајућег челика, без икакве боје, а врата се отварају нагоре.
      Постао је познат као времеплов у филму „Повратак у будућност“.
  car.london_taxi:
    label: Лондонски такси
    summary: Чувени црни такси који вози људе по Лондону.
    info: |
      Остин FX4 потиче из Уједињеног Краљевства и прављен је од 1958. до 1997. године.
      Може да се окрене у веома малом кругу, што помаже у уским лондонским улицама.
      Висок кров направљен му је да би путници могли да седе унутра са шеширом.
  car.toyota_land_cruiser:
    label: Тојота ленд крузер
    summary: Издржљив јапански ауто који може да прође кроз пустиње и џунгле.
    info: |
      Тојота ленд крузер FJ40 потиче из Јапана и прављена је од 1960. до 1984. године.
      Продавала се широм света и позната је по томе што се веома тешко поквари.
      Многе од њих и данас возе по лошим путевима.
  car.mazda_mx5:
    label: Мазда MX-5
    summary: Мали, весели јапански ауто за двоје с фаровима који искачу.
    info: |
      Мазда MX-5 потиче из Јапана и први пут се продавала 1989. године.
      Прва верзија имала је фарове који су искакали из хаубе.
      То је најпродаванији спортски ауто са два седишта на свету.
  car.trabant:
    label: Трабант
    summary: Мали источнонемачки ауто чија је каросерија делом од пластике.
    info: |
      Трабант потиче из Источне Немачке и прављен је од 1957. до 1991. године.
      Каросерија му је уместо од челика била од тврде пластике помешане с памучним влакнима.
      Људи су често морали да чекају много година да би га купили.
  car.bugatti_veyron:
    label: Бугати вејрон
    summary: Невероватно брз ауто који може да вози више од 400 km/h.
    info: |
      Бугати вејрон потиче из Француске и прављен је од 2005. до 2015. године.
      Мотор му има 16 цилиндара и више од 1.000 коњских снага.
      Када се појавио, био је најбржи аутомобил за пут на свету.
  car.tesla_model_s:
    label: Тесла модел S
    summary: Брз амерички ауто који иде на струју уместо на бензин.
    info: |
      Тесла модел S потиче из САД и почео је да се продаје 2012. године.
      Покрећу га велике батерије испод пода, па нема издувну цев.
      Пошто спреда нема мотора, тамо има још један пртљажник.
