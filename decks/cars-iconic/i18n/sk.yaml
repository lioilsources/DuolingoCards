lang: sk
pivot: false
title: Slávne autá
cards:
  car.ford_model_t:
    label: Ford Model T
    summary: Auto, vďaka ktorému mohli jazdiť autom aj obyčajné rodiny.
    info: |
      Ford Model T sa vyrábal v USA od roku 1908 do roku 1927.
      Staval sa na pohyblivej montážnej linke, preto bol lacný, a vyrobilo sa ho viac ako 15 miliónov kusov.
      Dlhé roky sa dal kúpiť iba v čiernej farbe.
  car.vw_beetle:
    label: Volkswagen Chrobák
    summary: Malé okrúhle auto, ktoré ľudia pomenovali podľa hmyzu.
    info: |
      Volkswagen Chrobák pochádza z Nemecka a vyrábal sa od roku 1938 do roku 2003.
      Vyrobilo sa ho viac ako 21 miliónov kusov, viac než akéhokoľvek iného auta s jedným tvarom.
      Motor má vzadu, pod zadným vekom.
  car.vw_bus:
    label: Volkswagen Transporter
    summary: Priateľská dodávka pre rodiny, surferov a výlety pod stan.
    info: |
      Volkswagen Typ 2 pochádza z Nemecka a prvý raz sa vyrobil v roku 1950.
      Prvé kusy mali predné sklo rozdelené na dve polovice a vpredu veľké V.
      Veľa ľudí si z neho urobilo malý domček na kolesách na cestovanie.
  car.jeep_willys:
    label: Jeep Willys
    summary: Malé a odolné vojenské auto, ktoré prešlo takmer všade.
    info: |
      Willys MB sa vyrábal v USA pre druhú svetovú vojnu, od roku 1941 do roku 1945.
      Vyrobili ich stovky tisíc, aby vozili vojakov po nerovnom teréne.
      Podľa neho dostali meno všetky neskoršie autá Jeep.
  car.land_rover_defender:
    label: Land Rover Defender
    summary: Hranaté britské auto stavané na jazdu po poliach a blate.
    info: |
      Land Rover pochádza zo Spojeného kráľovstva a prvý sa vyrobil v roku 1948.
      Od roku 1990 sa volal Defender a vyrábal sa až do roku 2016.
      Používali ho farmári, cestovatelia aj záchranári na celom svete.
  car.mini_cooper:
    label: Mini Cooper
    summary: Maličké britské auto, ktoré bolo prekvapivo rýchle.
    info: |
      Mini pochádza zo Spojeného kráľovstva a vyrábalo sa od roku 1959 do roku 2000.
      Motor má uložený naprieč, a tak sa do veľmi krátkeho auta zmestia štyria ľudia.
      Mini Cooper S vyhral v roku 1964 slávnu Rallye Monte Carlo.
  car.fiat_500:
    label: Fiat 500
    summary: Maličké talianske auto do úzkych mestských uličiek.
    info: |
      Fiat 500 pochádza z Talianska a vyrábal sa od roku 1957 do roku 1975.
      Je kratší ako 3 metre, takže zaparkuje takmer kdekoľvek.
      Taliani ho volajú „Cinquecento“, čo znamená „päťsto“.
  car.citroen_2cv:
    label: Citroën 2CV
    summary: Jednoduché francúzske auto so strechou, ktorá sa dá zrolovať.
    info: |
      Citroën 2CV pochádza z Francúzska a vyrábal sa od roku 1948 do roku 1990.
      Navrhli ho tak, aby vozil farmárov a ich tovar po hrboľatých vidieckych cestách.
      Jeho mäkká látková strecha sa zroluje ako viečko konzervy so sardinkami.
  car.citroen_ds:
    label: Citroën DS
    summary: Hladké francúzske auto, ktoré vyzeralo ako z budúcnosti.
    info: |
      Citroën DS pochádza z Francúzska a vyrábal sa od roku 1955 do roku 1975.
      Má zvláštne odpruženie, vďaka ktorému sa auto po naštartovaní zdvihne a zase klesne.
      Po francúzsky „DS“ znie ako slovo „bohyňa“.
  car.mercedes_300sl:
    label: Mercedes-Benz 300 SL
    summary: Strieborné športové auto s dverami, ktoré sa otvárajú nahor ako krídla.
    info: |
      Mercedes-Benz 300 SL pochádza z Nemecka a kupé sa vyrábalo od roku 1954 do roku 1957.
      Jeho dvere sa otvárajú nahor, preto ho ľudia volajú „Gullwing“, čiže „čajčie krídla“.
      Vo svojej dobe patril k najrýchlejším autám, aké sa dali kúpiť.
  car.jaguar_e_type:
    label: Jaguar E-Type
    summary: Dlhé, štíhle britské športové auto.
    info: |
      Jaguar E-Type pochádza zo Spojeného kráľovstva a vyrábal sa od roku 1961 do roku 1975.
      Má veľmi dlhú kapotu a pod ňou veľký motor.
      Veľa ľudí hovorí, že je to jedno z najkrajších áut, aké kedy vzniklo.
  car.aston_martin_db5:
    label: Aston Martin DB5
    summary: Elegantné britské auto špióna Jamesa Bonda.
    info: |
      Aston Martin DB5 pochádza zo Spojeného kráľovstva a vyrábal sa od roku 1963 do roku 1965.
      Svetovo slávnym sa stal v bondovke „Goldfinger“ z roku 1964.
      Vyrobilo sa ho len asi tisíc kusov.
  car.shelby_cobra:
    label: Shelby Cobra
    summary: Malé otvorené auto s obrovským a hlučným motorom.
    info: |
      Shelby Cobru postavil v 60. rokoch americký pretekár Carroll Shelby.
      Vzal ľahké britské športové auto a dal doň veľký americký motor od Fordu.
      Vyhrala veľa pretekov a ľudia ju kopírujú dodnes.
  car.ford_mustang:
    label: Ford Mustang
    summary: Športové americké auto pomenované po divokom koňovi.
    info: |
      Ford Mustang pochádza z USA a prvý raz sa začal predávať v roku 1964.
      Bol taký obľúbený, že podľa neho nazvali celú skupinu podobných áut „pony cars“.
      Mustang sa vyrába dodnes.
  car.corvette_c2:
    label: Corvette Sting Ray
    summary: Americké športové auto so zadným oknom rozdeleným na dve časti.
    info: |
      Chevrolet Corvette Sting Ray pochádza z USA.
      Iba kupé z roku 1963 malo zadné okno rozdelené na dve polovice.
      Jeho karoséria je zo sklenených vlákien namiesto ocele.
  car.cadillac_eldorado:
    label: Cadillac Eldorado
    summary: Obrovské americké auto s najväčšími chvostovými plutvami v histórii.
    info: |
      Cadillac Eldorado z roku 1959 pochádza z USA.
      Jeho vysoké zadné plutvy v tvare rakety patria k najvyšším, aké kedy auto malo.
      Je dlhé viac ako 5 a pol metra.
  car.chevrolet_bel_air:
    label: Chevrolet Bel Air
    summary: Lesklé americké auto z 50. rokov s chrómom a malými plutvami.
    info: |
      Chevrolet Bel Air z roku 1957 pochádza z USA.
      S dvojfarebným lakom a množstvom chrómu sa stal symbolom Ameriky 50. rokov.
      Na Kube dodnes jazdí po uliciach veľa takýchto starých áut.
  car.ford_gt40:
    label: Ford GT40
    summary: Veľmi nízke americké pretekárske auto, ktoré porazilo Ferrari.
    info: |
      Ford GT40 vznikol v 60. rokoch, aby vyhral 24-hodinové preteky v Le Mans.
      Vyhral Le Mans štyri roky po sebe, od roku 1966 do roku 1969.
      Volá sa GT40, pretože je vysoký len asi 40 palcov (1 meter).
  car.porsche_911_classic:
    label: Porsche 911 Carrera RS
    summary: Klasické nemecké športové auto s malým spojlerom v tvare kačacieho chvosta.
    info: |
      Porsche 911 pochádza z Nemecka a prvé sa vyrobilo v roku 1964.
      Carrera RS z roku 1973 bola ľahká a rýchla verzia postavená na preteky.
      Jej malý zadný spojler vyzerá ako kačací chvost.
  car.porsche_911_modern:
    label: Porsche 911
    summary: Moderná verzia športového auta, ktoré má už 60 rokov ten istý tvar.
    info: |
      Porsche 911 pochádza z Nemecka a táto verzia prišla v roku 2019.
      Stále má okrúhle svetlá a motor vzadu, presne ako prvé 911.
      Patrí k najdlhšie vyrábaným rodinám športových áut na svete.
  car.lamborghini_countach:
    label: Lamborghini Countach
    summary: Ploché, ostré talianske superauto s dverami, ktoré sa otvárajú nahor.
    info: |
      Lamborghini Countach pochádza z Talianska a vyrábalo sa od roku 1974 do roku 1990.
      Jeho dvere sa vyklápajú nahor a dopredu, ako nožnice.
      Veľa detí malo jeho plagát na stene v izbe.
  car.ferrari_testarossa:
    label: Ferrari Testarossa
    summary: Široké červené talianske športové auto s pruhmi na bokoch.
    info: |
      Ferrari Testarossa pochádza z Talianska a prvý raz sa vyrobilo v roku 1984.
      „Testarossa“ znamená po taliansky „červená hlava“, lebo vrch jeho motora je natretý načerveno.
      Dlhé pruhy na bokoch púšťajú dnu vzduch, ktorý chladí motor.
  car.ferrari_f40:
    label: Ferrari F40
    summary: Červené talianske superauto s veľkým krídlom vzadu.
    info: |
      Ferrari F40 pochádza z Talianska a vyrábalo sa od roku 1987 do roku 1992.
      Vzniklo k 40. narodeninám Ferrari, odtiaľ má aj svoje meno.
      Bolo jedným z prvých cestných áut, ktoré dokázali ísť rýchlejšie ako 320 km/h.
  car.delorean:
    label: DeLorean
    summary: Lesklé oceľové auto, ktoré sa vo filme stalo strojom času.
    info: |
      DeLorean DMC-12 sa vyrábal v Severnom Írsku v rokoch 1981 a 1982.
      Jeho karoséria je z holej nehrdzavejúcej ocele bez akéhokoľvek laku a dvere sa otvárajú nahor.
      Preslávil sa ako stroj času vo filme „Návrat do budúcnosti“.
  car.london_taxi:
    label: Londýnske taxi
    summary: Slávne čierne taxi, ktoré vozí ľudí po Londýne.
    info: |
      Austin FX4 pochádza zo Spojeného kráľovstva a vyrábal sa od roku 1958 do roku 1997.
      Dokáže sa otočiť na veľmi malom kruhu, čo pomáha v úzkych londýnskych uliciach.
      Má vysokú strechu, aby v ňom cestujúci mohli sedieť aj s klobúkom na hlave.
  car.toyota_land_cruiser:
    label: Toyota Land Cruiser
    summary: Odolné japonské auto, ktoré prejde púšťou aj džungľou.
    info: |
      Toyota Land Cruiser FJ40 pochádza z Japonska a vyrábala sa od roku 1960 do roku 1984.
      Predávala sa po celom svete a je známa tým, že sa veľmi ťažko pokazí.
      Veľa z nich dodnes jazdí po zlých cestách.
  car.mazda_mx5:
    label: Mazda MX-5
    summary: Malé, veselé japonské dvojmiestne auto s vyklápacími svetlami.
    info: |
      Mazda MX-5 pochádza z Japonska a prvý raz sa začala predávať v roku 1989.
      Prvá verzia mala svetlá, ktoré sa vyklápali z kapoty.
      Je to najpredávanejšie dvojmiestne športové auto na svete.
  car.trabant:
    label: Trabant
    summary: Malé východonemecké auto s karosériou čiastočne z plastu.
    info: |
      Trabant pochádza z východného Nemecka a vyrábal sa od roku 1957 do roku 1991.
      Jeho karoséria bola namiesto ocele z tvrdého plastu zmiešaného s bavlnenými vláknami.
      Ľudia naň často museli čakať veľa rokov.
  car.bugatti_veyron:
    label: Bugatti Veyron
    summary: Neuveriteľne rýchle auto, ktoré dokáže ísť viac ako 400 km/h.
    info: |
      Bugatti Veyron pochádza z Francúzska a vyrábalo sa od roku 2005 do roku 2015.
      Jeho motor má 16 valcov a viac ako 1 000 koní.
      Keď prišlo na trh, bolo najrýchlejším cestným autom na svete.
  car.tesla_model_s:
    label: Tesla Model S
    summary: Rýchle americké auto, ktoré jazdí na elektrinu namiesto benzínu.
    info: |
      Tesla Model S pochádza z USA a začala sa predávať v roku 2012.
      Jazdí vďaka veľkým batériám pod podlahou, takže nemá výfuk.
      Keďže vpredu nie je motor, je tam druhý kufor.
