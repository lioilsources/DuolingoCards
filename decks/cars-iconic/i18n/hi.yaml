lang: hi
pivot: false
title: मशहूर कारें
cards:
  car.ford_model_t:
    label: फ़ोर्ड मॉडल T
    summary: वह कार जिसने आम परिवारों के लिए भी गाड़ी चलाना मुमकिन बनाया।
    info: |
      फ़ोर्ड मॉडल T अमेरिका में 1908 से 1927 तक बनाई गई।
      इसे चलती हुई असेंबली लाइन पर जोड़ा जाता था, इसलिए यह सस्ती थी, और 1.5 करोड़ से ज़्यादा बनाई गईं।
      कई सालों तक इसे सिर्फ़ काले रंग में ही खरीदा जा सकता था।
  car.vw_beetle:
    label: फ़ॉक्सवैगन बीटल
    summary: एक छोटी, गोल-मटोल कार, जिसका नाम लोगों ने एक कीड़े पर रखा।
    info: |
      फ़ॉक्सवैगन बीटल जर्मनी की कार है और 1938 से 2003 तक बनाई गई।
      2.1 करोड़ से ज़्यादा बनाई गईं, जो एक ही डिज़ाइन वाली किसी भी दूसरी कार से ज़्यादा है।
      इसका इंजन पीछे की तरफ़, पिछले ढक्कन के नीचे होता है।
  car.vw_bus:
    label: फ़ॉक्सवैगन बस
    summary: परिवारों, सर्फ़रों और कैंपिंग की सैर के लिए एक प्यारी-सी वैन।
    info: |
      फ़ॉक्सवैगन टाइप 2 जर्मनी की गाड़ी है और पहली बार 1950 में बनाई गई।
      शुरुआती गाड़ियों का सामने का शीशा दो हिस्सों में बँटा होता था और आगे एक बड़ा V बना होता था।
      बहुत से लोगों ने इसे घूमने-फिरने के लिए पहियों पर चलने वाला छोटा-सा घर बना लिया।
  car.jeep_willys:
    label: विलीज़ जीप
    summary: एक छोटी, मज़बूत फ़ौजी गाड़ी, जो लगभग कहीं भी चल सकती थी।
    info: |
      विलीज़ MB अमेरिका में दूसरे विश्व युद्ध के लिए 1941 से 1945 तक बनाई गई।
      ऊबड़-खाबड़ ज़मीन पर सैनिकों को ले जाने के लिए लाखों बनाई गईं।
      इसके बाद आई सभी जीप गाड़ियों को इसी से अपना नाम मिला।
  car.land_rover_defender:
    label: लैंड रोवर डिफ़ेंडर
    summary: खेतों और कीचड़ में चलने के लिए बनी एक डिब्बे जैसी ब्रिटिश कार।
    info: |
      लैंड रोवर ब्रिटेन की कार है; पहली गाड़ी 1948 में बनी थी।
      1990 से इसे डिफ़ेंडर कहा जाने लगा, और यह 2016 तक बनाई गई।
      किसानों, खोजकर्ताओं और बचाव दलों ने इसे पूरी दुनिया में इस्तेमाल किया।
  car.mini_cooper:
    label: मिनी कूपर
    summary: एक नन्ही-सी ब्रिटिश कार, जो हैरानी की हद तक तेज़ थी।
    info: |
      मिनी ब्रिटेन की कार है और 1959 से 2000 तक बनाई गई।
      इसका इंजन आड़ा रखा होता है, इसलिए बहुत छोटी कार में भी चार लोग बैठ जाते हैं।
      1964 में एक मिनी कूपर S ने मशहूर मोंटे कार्लो रैली जीती थी।
  car.fiat_500:
    label: फ़िएट 500
    summary: शहर की तंग गलियों के लिए बनी एक नन्ही इतालवी कार।
    info: |
      फ़िएट 500 इटली की कार है और 1957 से 1975 तक बनाई गई।
      यह 3 मीटर से भी कम लंबी है, इसलिए इसे लगभग कहीं भी खड़ा किया जा सकता है।
      इटली के लोग इसे "चिंक्वेचेंतो" कहते हैं, जिसका मतलब है "पाँच सौ"।
  car.citroen_2cv:
    label: सिट्रोएन 2CV
    summary: एक सीधी-सादी फ़्रांसीसी कार, जिसकी छत पीछे की ओर लपेटी जा सकती है।
    info: |
      सिट्रोएन 2CV फ़्रांस की कार है और 1948 से 1990 तक बनाई गई।
      इसे किसानों और उनके सामान को गाँव की ऊबड़-खाबड़ सड़कों पर ले जाने के लिए बनाया गया था।
      इसकी कपड़े की मुलायम छत सार्डीन मछली के डिब्बे के ढक्कन की तरह पीछे लिपट जाती है।
  car.citroen_ds:
    label: सिट्रोएन DS
    summary: एक चिकनी फ़्रांसीसी कार, जो ऐसी दिखती थी जैसे भविष्य से आई हो।
    info: |
      सिट्रोएन DS फ़्रांस की कार है और 1955 से 1975 तक बनाई गई।
      इसका ख़ास सस्पेंशन कार को चालू करते ही ऊपर उठाता और नीचे बैठाता है।
      फ़्रांसीसी भाषा में "DS" सुनने में "देवी" वाले शब्द जैसा लगता है।
  car.mercedes_300sl:
    label: मर्सिडीज़-बेंज़ 300 SL
    summary: एक चाँदी के रंग की स्पोर्ट्स कार, जिसके दरवाज़े पंखों की तरह ऊपर खुलते हैं।
    info: |
      मर्सिडीज़-बेंज़ 300 SL जर्मनी की कार है; इसका कूपे 1954 से 1957 तक बनाया गया।
      इसके दरवाज़े ऊपर की ओर खुलते हैं, इसलिए लोग इसे "गलविंग" यानी "सीगल के पंख" कहते हैं।
      अपने समय में यह उन सबसे तेज़ कारों में से थी जिन्हें खरीदा जा सकता था।
  car.jaguar_e_type:
    label: जैगुआर ई-टाइप
    summary: एक लंबी, छरहरी ब्रिटिश स्पोर्ट्स कार।
    info: |
      जैगुआर ई-टाइप ब्रिटेन की कार है और 1961 से 1975 तक बनाई गई।
      इसका बोनट बहुत लंबा है, और उसके नीचे एक बड़ा इंजन है।
      बहुत से लोग कहते हैं कि यह अब तक बनी सबसे सुंदर कारों में से एक है।
  car.aston_martin_db5:
    label: एस्टन मार्टिन DB5
    summary: जासूस जेम्स बॉन्ड की शानदार ब्रिटिश कार।
    info: |
      एस्टन मार्टिन DB5 ब्रिटेन की कार है और 1963 से 1965 तक बनाई गई।
      1964 की जेम्स बॉन्ड फ़िल्म "गोल्डफ़िंगर" से यह पूरी दुनिया में मशहूर हो गई।
      ऐसी सिर्फ़ लगभग एक हज़ार कारें बनाई गईं।
  car.shelby_cobra:
    label: शेल्बी कोबरा
    summary: एक छोटी खुली कार, जिसमें बहुत बड़ा और ज़ोरदार आवाज़ वाला इंजन है।
    info: |
      शेल्बी कोबरा को 1960 के दशक में अमेरिकी रेसर कैरोल शेल्बी ने बनाया।
      उन्होंने एक हल्की ब्रिटिश स्पोर्ट्स कार ली और उसमें फ़ोर्ड का एक बड़ा अमेरिकी इंजन लगा दिया।
      इसने कई रेस जीतीं, और आज भी इसकी नकल बनाई जाती है।
  car.ford_mustang:
    label: फ़ोर्ड मस्टैंग
    summary: एक जंगली घोड़े के नाम वाली स्पोर्टी अमेरिकी कार।
    info: |
      फ़ोर्ड मस्टैंग अमेरिका की कार है और पहली बार 1964 में बिक्री के लिए आई।
      यह इतनी पसंद की गई कि इसके जैसी कारों के पूरे समूह को इसी के नाम पर "पोनी कार" कहा जाने लगा।
      मस्टैंग आज भी बनाई जाती है।
  car.corvette_c2:
    label: कॉर्वेट स्टिंग रे
    summary: एक अमेरिकी स्पोर्ट्स कार, जिसकी पिछली खिड़की दो हिस्सों में बँटी है।
    info: |
      शेवरले कॉर्वेट स्टिंग रे अमेरिका की कार है।
      सिर्फ़ 1963 के कूपे की पिछली खिड़की दो हिस्सों में बँटी हुई थी।
      इसकी बॉडी स्टील की जगह फ़ाइबरग्लास से बनी है।
  car.cadillac_eldorado:
    label: कैडिलैक एल्डोराडो
    summary: एक विशाल अमेरिकी कार, जिसके पिछले पंख अब तक के सबसे बड़े हैं।
    info: |
      1959 की कैडिलैक एल्डोराडो अमेरिका की कार है।
      रॉकेट जैसे आकार के इसके ऊँचे पिछले पंख किसी कार पर लगे सबसे ऊँचे पंखों में से हैं।
      यह साढ़े 5 मीटर से भी ज़्यादा लंबी है।
  car.chevrolet_bel_air:
    label: शेवरले बेल एयर
    summary: 1950 के दशक की एक चमचमाती अमेरिकी कार, जिसमें क्रोम और छोटे पिछले पंख हैं।
    info: |
      1957 की शेवरले बेल एयर अमेरिका की कार है।
      दो रंगों वाले पेंट और ढेर सारे क्रोम के साथ यह 1950 के दशक के अमेरिका की पहचान बन गई।
      क्यूबा में आज भी ऐसी बहुत-सी पुरानी कारें सड़कों पर चलती हैं।
  car.ford_gt40:
    label: फ़ोर्ड GT40
    summary: एक बहुत नीची अमेरिकी रेस कार, जिसने फ़ेरारी को हराया।
    info: |
      फ़ोर्ड GT40 को 1960 के दशक में ले मां की 24 घंटे वाली रेस जीतने के लिए बनाया गया।
      इसने 1966 से 1969 तक लगातार चार साल ले मां जीती।
      इसे GT40 इसलिए कहते हैं क्योंकि यह सिर्फ़ लगभग 40 इंच (1 मीटर) ऊँची है।
  car.porsche_911_classic:
    label: पोर्श 911 कैरेरा RS
    summary: एक क्लासिक जर्मन स्पोर्ट्स कार, जिसमें छोटा-सा "बत्तख की पूँछ" वाला स्पॉइलर है।
    info: |
      पोर्श 911 जर्मनी की कार है; पहली गाड़ी 1964 में बनी थी।
      1973 की कैरेरा RS रेस के लिए बनाई गई एक हल्की और तेज़ गाड़ी थी।
      इसका पीछे लगा छोटा स्पॉइलर बत्तख की पूँछ जैसा दिखता है।
  car.porsche_911_modern:
    label: पोर्श 911
    summary: उस स्पोर्ट्स कार का नया रूप, जिसका आकार 60 साल से वैसा ही है।
    info: |
      पोर्श 911 जर्मनी की कार है, और यह रूप 2019 में आया।
      पहली 911 की तरह इसमें अब भी गोल हेडलाइटें हैं और इंजन पीछे है।
      यह दुनिया में सबसे लंबे समय से बन रही स्पोर्ट्स कारों के परिवारों में से एक है।
  car.lamborghini_countach:
    label: लैम्बोर्गिनी काउंटैक
    summary: एक चपटी, नुकीली इतालवी सुपरकार, जिसके दरवाज़े ऊपर खुलते हैं।
    info: |
      लैम्बोर्गिनी काउंटैक इटली की कार है और 1974 से 1990 तक बनाई गई।
      इसके दरवाज़े कैंची की तरह आगे की ओर ऊपर उठते हैं।
      बहुत से बच्चों ने इसका पोस्टर अपने कमरे की दीवार पर लगाया था।
  car.ferrari_testarossa:
    label: फ़ेरारी टेस्टारोसा
    summary: एक चौड़ी लाल इतालवी स्पोर्ट्स कार, जिसके किनारों पर धारियाँ हैं।
    info: |
      फ़ेरारी टेस्टारोसा इटली की कार है और पहली बार 1984 में बनाई गई।
      इतालवी में "टेस्टारोसा" का मतलब है "लाल सिर", क्योंकि इसके इंजन का ऊपरी हिस्सा लाल रंग से रंगा है।
      किनारों पर बनी लंबी धारियाँ इंजन को ठंडा करने के लिए हवा अंदर आने देती हैं।
  car.ferrari_f40:
    label: फ़ेरारी F40
    summary: एक लाल इतालवी सुपरकार, जिसके पीछे एक बड़ा विंग लगा है।
    info: |
      फ़ेरारी F40 इटली की कार है और 1987 से 1992 तक बनाई गई।
      इसे फ़ेरारी के 40वें जन्मदिन के लिए बनाया गया था, और इसका नाम भी वहीं से आया।
      यह उन पहली सड़क वाली कारों में से थी जो 320 किमी/घंटा से ज़्यादा तेज़ चल सकती थीं।
  car.delorean:
    label: डेलोरियन
    summary: स्टील की एक चमकती कार, जो एक फ़िल्म में टाइम मशीन बन गई।
    info: |
      डेलोरियन DMC-12 उत्तरी आयरलैंड में 1981 और 1982 में बनाई गई।
      इसकी बॉडी बिना पेंट वाले खुले स्टेनलेस स्टील की है, और इसके दरवाज़े ऊपर खुलते हैं।
      फ़िल्म "बैक टू द फ़्यूचर" में टाइम मशीन बनकर यह मशहूर हो गई।
  car.london_taxi:
    label: लंदन टैक्सी
    summary: वह मशहूर काली टैक्सी, जो लोगों को पूरे लंदन में घुमाती है।
    info: |
      ऑस्टिन FX4 ब्रिटेन की गाड़ी है और 1958 से 1997 तक बनाई गई।
      यह बहुत छोटे घेरे में घूमकर मुड़ सकती है, जो लंदन की तंग गलियों में काम आता है।
      इसकी छत ऊँची इसलिए बनाई गई ताकि सवारियाँ टोपी पहनकर अंदर बैठ सकें।
  car.toyota_land_cruiser:
    label: टोयोटा लैंड क्रूज़र
    summary: एक मज़बूत जापानी गाड़ी, जो रेगिस्तानों और जंगलों से होकर चल सकती है।
    info: |
      टोयोटा लैंड क्रूज़र FJ40 जापान की गाड़ी है और 1960 से 1984 तक बनाई गई।
      यह पूरी दुनिया में बिकी और बहुत मुश्किल से ख़राब होने के लिए जानी जाती है।
      आज भी इनमें से बहुत-सी ऊबड़-खाबड़ सड़कों पर चल रही हैं।
  car.mazda_mx5:
    label: माज़्दा MX-5
    summary: दो सीटों वाली एक छोटी, खुशमिज़ाज जापानी कार, जिसकी हेडलाइटें ऊपर उठ आती हैं।
    info: |
      माज़्दा MX-5 जापान की कार है और पहली बार 1989 में बिक्री के लिए आई।
      इसके पहले रूप में ऐसी हेडलाइटें थीं जो बोनट से पलटकर ऊपर निकल आती थीं।
      यह दुनिया में सबसे ज़्यादा बिकने वाली दो सीटों वाली स्पोर्ट्स कार है।
  car.trabant:
    label: ट्राबेंट
    summary: पूर्वी जर्मनी की एक छोटी कार, जिसकी बॉडी कुछ हद तक प्लास्टिक की बनी थी।
    info: |
      ट्राबेंट पूर्वी जर्मनी की कार है और 1957 से 1991 तक बनाई गई।
      इसकी बॉडी स्टील की जगह कपास के रेशों वाले सख़्त प्लास्टिक से बनी थी।
      एक कार खरीदने के लिए लोगों को अक्सर कई साल इंतज़ार करना पड़ता था।
  car.bugatti_veyron:
    label: बुगाटी वेरॉन
    summary: एक बेहद तेज़ कार, जो 400 किमी/घंटा से ज़्यादा की रफ़्तार से चल सकती है।
    info: |
      बुगाटी वेरॉन फ़्रांस की कार है और 2005 से 2015 तक बनाई गई।
      इसके इंजन में 16 सिलेंडर हैं और 1,000 से ज़्यादा हॉर्सपावर की ताक़त है।
      जब यह आई थी, तब यह दुनिया की सबसे तेज़ सड़क वाली कार थी।
  car.tesla_model_s:
    label: टेस्ला मॉडल S
    summary: एक तेज़ अमेरिकी कार, जो पेट्रोल की जगह बिजली से चलती है।
    info: |
      टेस्ला मॉडल S अमेरिका की कार है और 2012 में बिक्री के लिए आई।
      यह फ़र्श के नीचे लगी बड़ी बैटरियों से चलती है, इसलिए इसमें धुआँ निकलने वाला पाइप नहीं है।
      आगे इंजन न होने की वजह से वहाँ एक दूसरी डिक्की है।
