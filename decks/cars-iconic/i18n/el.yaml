pivot: false
title: Διάσημα αυτοκίνητα
cards:
  car.ford_model_t:
    label: Ford Model T
    summary: Το αυτοκίνητο που έκανε την οδήγηση δυνατή για τις απλές οικογένειες.
    info: |
      Το Ford Model T φτιαχνόταν στις ΗΠΑ από το 1908 έως το 1927.
      Το συναρμολογούσαν σε κινούμενη γραμμή παραγωγής, γι' αυτό ήταν φθηνό, και φτιάχτηκαν πάνω από 15 εκατομμύρια.
      Για πολλά χρόνια μπορούσες να το αγοράσεις μόνο σε μαύρο χρώμα.
  car.vw_beetle:
    label: Volkswagen Σκαθάρι
    summary: Ένα μικρό στρογγυλό αυτοκίνητο που ο κόσμος το ονόμασε από ένα έντομο.
    info: |
      Το Volkswagen Σκαθάρι είναι από τη Γερμανία και φτιαχνόταν από το 1938 έως το 2003.
      Φτιάχτηκαν πάνω από 21 εκατομμύρια, περισσότερα από κάθε άλλο αυτοκίνητο με το ίδιο σχέδιο.
      Η μηχανή του είναι πίσω, κάτω από το πίσω καπό.
  car.vw_bus:
    label: Volkswagen Transporter
    summary: Ένα φιλικό βανάκι για οικογένειες, σέρφερ και κάμπινγκ.
    info: |
      Το Volkswagen Type 2 είναι από τη Γερμανία και φτιάχτηκε πρώτη φορά το 1950.
      Τα πρώτα είχαν παρμπρίζ χωρισμένο στα δύο και ένα μεγάλο V μπροστά.
      Πολλοί το έκαναν ένα μικρό σπιτάκι με ρόδες για τα ταξίδια τους.
  car.jeep_willys:
    label: Willys Jeep
    summary: Ένα μικρό, γερό στρατιωτικό αυτοκίνητο που πήγαινε σχεδόν παντού.
    info: |
      Το Willys MB φτιάχτηκε στις ΗΠΑ για τον Δεύτερο Παγκόσμιο Πόλεμο, από το 1941 έως το 1945.
      Φτιάχτηκαν εκατοντάδες χιλιάδες για να μεταφέρουν στρατιώτες σε δύσβατο έδαφος.
      Από αυτό πήραν το όνομά τους όλα τα αυτοκίνητα Jeep που ήρθαν μετά.
  car.land_rover_defender:
    label: Land Rover Defender
    summary: Ένα τετράγωνο βρετανικό αυτοκίνητο φτιαγμένο για χωράφια και λάσπες.
    info: |
      Το Land Rover είναι από το Ηνωμένο Βασίλειο· το πρώτο φτιάχτηκε το 1948.
      Από το 1990 λεγόταν Defender και φτιαχνόταν μέχρι το 2016.
      Αγρότες, εξερευνητές και ομάδες διάσωσης το χρησιμοποιούσαν σε όλο τον κόσμο.
  car.mini_cooper:
    label: Mini Cooper
    summary: Ένα μικροσκοπικό βρετανικό αυτοκίνητο που ήταν απρόσμενα γρήγορο.
    info: |
      Το Mini είναι από το Ηνωμένο Βασίλειο και φτιαχνόταν από το 1959 έως το 2000.
      Η μηχανή του είναι τοποθετημένη πλάγια, έτσι χωράνε τέσσερις άνθρωποι σε ένα πολύ κοντό αυτοκίνητο.
      Ένα Mini Cooper S κέρδισε το διάσημο Ράλι του Μόντε Κάρλο το 1964.
  car.fiat_500:
    label: Fiat 500
    summary: Ένα μικροσκοπικό ιταλικό αυτοκίνητο για τα στενά δρομάκια της πόλης.
    info: |
      Το Fiat 500 είναι από την Ιταλία και φτιαχνόταν από το 1957 έως το 1975.
      Έχει μήκος κάτω από 3 μέτρα, γι' αυτό παρκάρει σχεδόν παντού.
      Οι Ιταλοί το λένε "Cinquecento", που σημαίνει "πεντακόσια".
  car.citroen_2cv:
    label: Citroën 2CV
    summary: Ένα απλό γαλλικό αυτοκίνητο με οροφή που τυλίγεται προς τα πίσω.
    info: |
      Το Citroën 2CV είναι από τη Γαλλία και φτιαχνόταν από το 1948 έως το 1990.
      Σχεδιάστηκε για να μεταφέρει αγρότες και την πραμάτεια τους σε ανώμαλους επαρχιακούς δρόμους.
      Η μαλακή υφασμάτινη οροφή του τυλίγεται προς τα πίσω σαν το καπάκι σε κονσέρβα σαρδέλας.
  car.citroen_ds:
    label: Citroën DS
    summary: Ένα κομψό γαλλικό αυτοκίνητο που έμοιαζε να έρχεται από το μέλλον.
    info: |
      Το Citroën DS είναι από τη Γαλλία και φτιαχνόταν από το 1955 έως το 1975.
      Η ειδική του ανάρτηση κάνει το αυτοκίνητο να ανεβαίνει και να κατεβαίνει όταν το βάζεις μπρος.
      Στα γαλλικά, το "DS" ακούγεται σαν τη λέξη για τη "θεά".
  car.mercedes_300sl:
    label: Mercedes-Benz 300 SL
    summary: Ένα ασημί σπορ αυτοκίνητο με πόρτες που ανοίγουν προς τα πάνω σαν φτερά.
    info: |
      Η Mercedes-Benz 300 SL είναι από τη Γερμανία· το κουπέ φτιαχνόταν από το 1954 έως το 1957.
      Οι πόρτες της ανοίγουν προς τα πάνω, γι' αυτό τη λένε "Gullwing", δηλαδή "φτερό γλάρου".
      Ήταν από τα πιο γρήγορα αυτοκίνητα που μπορούσες να αγοράσεις την εποχή της.
  car.jaguar_e_type:
    label: Jaguar E-Type
    summary: Ένα μακρύ, κομψό βρετανικό σπορ αυτοκίνητο.
    info: |
      Η Jaguar E-Type είναι από το Ηνωμένο Βασίλειο και φτιαχνόταν από το 1961 έως το 1975.
      Έχει ένα πολύ μακρύ καπό με μια μεγάλη μηχανή από κάτω.
      Πολλοί λένε ότι είναι από τα πιο όμορφα αυτοκίνητα που φτιάχτηκαν ποτέ.
  car.aston_martin_db5:
    label: Aston Martin DB5
    summary: Το κομψό βρετανικό αυτοκίνητο του κατασκόπου Τζέιμς Μποντ.
    info: |
      Η Aston Martin DB5 είναι από το Ηνωμένο Βασίλειο και φτιαχνόταν από το 1963 έως το 1965.
      Έγινε παγκοσμίως διάσημη με την ταινία του Τζέιμς Μποντ "Goldfinger" το 1964.
      Φτιάχτηκαν μόνο περίπου χίλιες.
  car.shelby_cobra:
    label: Shelby Cobra
    summary: Ένα μικρό ανοιχτό αυτοκίνητο με τεράστια, θορυβώδη μηχανή.
    info: |
      Το Shelby Cobra φτιάχτηκε τη δεκαετία του 1960 από τον Αμερικανό οδηγό αγώνων Κάρολ Σέλμπι.
      Πήρε ένα ελαφρύ βρετανικό σπορ αυτοκίνητο και του έβαλε μια μεγάλη αμερικανική μηχανή Ford.
      Κέρδισε πολλούς αγώνες και το αντιγράφουν μέχρι σήμερα.
  car.ford_mustang:
    label: Ford Mustang
    summary: Ένα σπορ αμερικανικό αυτοκίνητο που πήρε το όνομά του από ένα άγριο άλογο.
    info: |
      Η Ford Mustang είναι από τις ΗΠΑ και βγήκε πρώτη φορά στην αγορά το 1964.
      Έγινε τόσο αγαπητή, που μια ολόκληρη ομάδα παρόμοιων αυτοκινήτων ονομάστηκε από αυτήν "pony cars".
      Η Mustang φτιάχνεται ακόμα και σήμερα.
  car.corvette_c2:
    label: Corvette Sting Ray
    summary: Ένα αμερικανικό σπορ αυτοκίνητο με πίσω τζάμι χωρισμένο στα δύο.
    info: |
      Η Chevrolet Corvette Sting Ray είναι από τις ΗΠΑ.
      Μόνο το κουπέ του 1963 είχε πίσω τζάμι χωρισμένο σε δύο μισά.
      Το αμάξωμά της είναι από υαλοβάμβακα αντί για ατσάλι.
  car.cadillac_eldorado:
    label: Cadillac Eldorado
    summary: Ένα τεράστιο αμερικανικό αυτοκίνητο με τα μεγαλύτερα πίσω πτερύγια όλων των εποχών.
    info: |
      Η Cadillac Eldorado του 1959 είναι από τις ΗΠΑ.
      Τα ψηλά πίσω πτερύγιά της, σαν πυραύλου, είναι από τα ψηλότερα που μπήκαν ποτέ σε αυτοκίνητο.
      Έχει μήκος πάνω από πεντέμισι μέτρα.
  car.chevrolet_bel_air:
    label: Chevrolet Bel Air
    summary: Ένα γυαλιστερό αμερικανικό αυτοκίνητο της δεκαετίας του 1950 με χρώμια και μικρά πτερύγια.
    info: |
      Η Chevrolet Bel Air του 1957 είναι από τις ΗΠΑ.
      Με τη δίχρωμη βαφή και τα πολλά χρώμια, έγινε σύμβολο της Αμερικής της δεκαετίας του 1950.
      Στην Κούβα, πολλά από αυτά τα παλιά αυτοκίνητα κυκλοφορούν ακόμα στους δρόμους.
  car.ford_gt40:
    label: Ford GT40
    summary: Ένα πολύ χαμηλό αμερικανικό αγωνιστικό που νίκησε τη Ferrari.
    info: |
      Το Ford GT40 φτιάχτηκε τη δεκαετία του 1960 για να κερδίσει τον αγώνα 24 Ωρών του Λε Μαν.
      Κέρδισε στο Λε Μαν τέσσερα χρόνια στη σειρά, από το 1966 έως το 1969.
      Λέγεται GT40 επειδή έχει ύψος μόνο περίπου 40 ίντσες (1 μέτρο).
  car.porsche_911_classic:
    label: Porsche 911 Carrera RS
    summary: Ένα κλασικό γερμανικό σπορ αυτοκίνητο με μια μικρή αεροτομή "ουρά πάπιας".
    info: |
      Η Porsche 911 είναι από τη Γερμανία· η πρώτη φτιάχτηκε το 1964.
      Η Carrera RS του 1973 ήταν μια ελαφριά, γρήγορη έκδοση φτιαγμένη για αγώνες.
      Η μικρή πίσω αεροτομή της μοιάζει με ουρά πάπιας.
  car.porsche_911_modern:
    label: Porsche 911
    summary: Η σύγχρονη έκδοση ενός σπορ αυτοκινήτου που κρατάει το ίδιο σχήμα εδώ και 60 χρόνια.
    info: |
      Η Porsche 911 είναι από τη Γερμανία, και αυτή η έκδοση βγήκε το 2019.
      Έχει ακόμα στρογγυλά φανάρια και τη μηχανή πίσω, ακριβώς όπως η πρώτη 911.
      Είναι μία από τις οικογένειες σπορ αυτοκινήτων που φτιάχνονται για περισσότερο καιρό στον κόσμο.
  car.lamborghini_countach:
    label: Lamborghini Countach
    summary: Ένα χαμηλό, μυτερό ιταλικό σούπερ αυτοκίνητο με πόρτες που ανοίγουν προς τα πάνω.
    info: |
      Η Lamborghini Countach είναι από την Ιταλία και φτιαχνόταν από το 1974 έως το 1990.
      Οι πόρτες της σηκώνονται προς τα πάνω και μπροστά, σαν ψαλίδι.
      Πολλά παιδιά είχαν μια αφίσα της στον τοίχο του δωματίου τους.
  car.ferrari_testarossa:
    label: Ferrari Testarossa
    summary: Ένα φαρδύ κόκκινο ιταλικό σπορ αυτοκίνητο με ρίγες στα πλάγια.
    info: |
      Η Ferrari Testarossa είναι από την Ιταλία και φτιάχτηκε πρώτη φορά το 1984.
      "Testarossa" στα ιταλικά σημαίνει "κόκκινο κεφάλι", επειδή το πάνω μέρος της μηχανής είναι βαμμένο κόκκινο.
      Οι μακριές ρίγες στα πλάγια αφήνουν αέρα να μπει και να δροσίσει τη μηχανή.
  car.ferrari_f40:
    label: Ferrari F40
    summary: Ένα κόκκινο ιταλικό σούπερ αυτοκίνητο με μεγάλη αεροτομή πίσω.
    info: |
      Η Ferrari F40 είναι από την Ιταλία και φτιαχνόταν από το 1987 έως το 1992.
      Φτιάχτηκε για τα 40ά γενέθλια της Ferrari, και από εκεί πήρε το όνομά της.
      Ήταν από τα πρώτα αυτοκίνητα δρόμου που μπορούσαν να πάνε πάνω από 320 χλμ./ώρα.
  car.delorean:
    label: DeLorean
    summary: Ένα γυαλιστερό ατσάλινο αυτοκίνητο που έγινε χρονομηχανή σε μια ταινία.
    info: |
      Το DeLorean DMC-12 φτιάχτηκε στη Βόρεια Ιρλανδία το 1981 και το 1982.
      Το αμάξωμά του είναι από γυμνό ανοξείδωτο ατσάλι, χωρίς καθόλου μπογιά, και οι πόρτες του ανοίγουν προς τα πάνω.
      Έγινε διάσημο ως η χρονομηχανή στην ταινία "Επιστροφή στο μέλλον".
  car.london_taxi:
    label: Ταξί του Λονδίνου
    summary: Το διάσημο μαύρο ταξί που γυρίζει τον κόσμο στο Λονδίνο.
    info: |
      Το Austin FX4 είναι από το Ηνωμένο Βασίλειο και φτιαχνόταν από το 1958 έως το 1997.
      Μπορεί να κάνει στροφή σε πολύ μικρό κύκλο, και αυτό βοηθάει στους στενούς δρόμους του Λονδίνου.
      Η ψηλή του οροφή φτιάχτηκε για να κάθονται οι επιβάτες μέσα φορώντας καπέλο.
  car.toyota_land_cruiser:
    label: Toyota Land Cruiser
    summary: Ένα γερό ιαπωνικό αυτοκίνητο που περνάει από ερήμους και ζούγκλες.
    info: |
      Το Toyota Land Cruiser FJ40 είναι από την Ιαπωνία και φτιαχνόταν από το 1960 έως το 1984.
      Πουλήθηκε σε όλο τον κόσμο και είναι γνωστό ότι χαλάει πολύ δύσκολα.
      Πολλά κυκλοφορούν ακόμα και σήμερα σε κακούς δρόμους.
  car.mazda_mx5:
    label: Mazda MX-5
    summary: Ένα μικρό, χαρούμενο ιαπωνικό διθέσιο με φανάρια που πετάγονται προς τα πάνω.
    info: |
      Το Mazda MX-5 είναι από την Ιαπωνία και βγήκε πρώτη φορά στην αγορά το 1989.
      Η πρώτη έκδοση είχε φανάρια που σηκώνονταν μέσα από το καπό.
      Είναι το σπορ διθέσιο με τις περισσότερες πωλήσεις στον κόσμο.
  car.trabant:
    label: Trabant
    summary: Ένα μικρό ανατολικογερμανικό αυτοκίνητο με αμάξωμα εν μέρει από πλαστικό.
    info: |
      Το Trabant είναι από την Ανατολική Γερμανία και φτιαχνόταν από το 1957 έως το 1991.
      Το αμάξωμά του ήταν από σκληρό πλαστικό ανακατεμένο με ίνες βαμβακιού αντί για ατσάλι.
      Ο κόσμος συχνά περίμενε πολλά χρόνια για να αγοράσει ένα.
  car.bugatti_veyron:
    label: Bugatti Veyron
    summary: Ένα απίστευτα γρήγορο αυτοκίνητο που πάει πάνω από 400 χλμ./ώρα.
    info: |
      Η Bugatti Veyron είναι από τη Γαλλία και φτιαχνόταν από το 2005 έως το 2015.
      Η μηχανή της έχει 16 κυλίνδρους και πάνω από 1.000 ίππους.
      Όταν βγήκε, ήταν το πιο γρήγορο αυτοκίνητο δρόμου στον κόσμο.
  car.tesla_model_s:
    label: Tesla Model S
    summary: Ένα γρήγορο αμερικανικό αυτοκίνητο που κινείται με ρεύμα αντί για βενζίνη.
    info: |
      Το Tesla Model S είναι από τις ΗΠΑ και βγήκε στην αγορά το 2012.
      Κινείται με μεγάλες μπαταρίες κάτω από το πάτωμα, γι' αυτό δεν έχει εξάτμιση.
      Επειδή δεν έχει μηχανή μπροστά, έχει εκεί και δεύτερο πορτμπαγκάζ.
