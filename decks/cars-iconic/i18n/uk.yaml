lang: uk
pivot: false
title: Відомі автомобілі
cards:
  car.ford_model_t:
    label: Форд Модель T
    summary: Машина, завдяки якій автомобіль з'явився у звичайних родин.
    info: |
      Форд Модель T випускали в США з 1908 до 1927 року.
      Його збирали на рухомому конвеєрі, тому він був дешевим, і загалом зробили понад 15 мільйонів машин.
      Багато років його можна було купити тільки чорного кольору.
  car.vw_beetle:
    label: Фольксваген Жук
    summary: Маленька кругла машина, яку люди назвали на честь комахи.
    info: |
      Фольксваген Жук родом із Німеччини, його випускали з 1938 до 2003 року.
      Таких машин зробили понад 21 мільйон — більше, ніж будь-якої іншої моделі одного дизайну.
      Двигун у нього ззаду, під задньою кришкою.
  car.vw_bus:
    label: Фольксваген Транспортер
    summary: Привітний мікроавтобус для родин, серферів і походів з наметами.
    info: |
      Фольксваген Тип 2 родом із Німеччини, його почали випускати 1950 року.
      У перших машин лобове скло було розділене на дві половинки, а спереду була велика літера V.
      Багато людей перетворювали його на маленький будиночок на колесах для подорожей.
  car.jeep_willys:
    label: Вілліс
    summary: Маленька й міцна армійська машина, яка проїжджала майже всюди.
    info: |
      Вілліс MB робили в США для Другої світової війни, з 1941 до 1945 року.
      Їх збудували сотні тисяч, щоб возити солдатів бездоріжжям.
      Він дав ім'я всім джипам, які з'явилися після нього.
  car.land_rover_defender:
    label: Ленд Ровер Дефендер
    summary: Кутаста британська машина, створена для їзди полями й багнюкою.
    info: |
      Ленд Ровер родом із Великої Британії, перший такий автомобіль зробили 1948 року.
      З 1990 року його почали називати Дефендер, і випускали його до 2016 року.
      На ньому їздили фермери, мандрівники та рятувальники по всьому світу.
  car.mini_cooper:
    label: Міні Купер
    summary: Крихітна британська машина, яка виявилася напрочуд швидкою.
    info: |
      Міні родом із Великої Британії, його випускали з 1959 до 2000 року.
      Двигун у нього стоїть упоперек, тому в дуже короткій машині вміщаються четверо людей.
      Міні Купер S переміг у знаменитому ралі Монте-Карло 1964 року.
  car.fiat_500:
    label: Фіат 500
    summary: Крихітна італійська машина для вузьких міських вуличок.
    info: |
      Фіат 500 родом з Італії, його випускали з 1957 до 1975 року.
      Він коротший за 3 метри, тому може припаркуватися майже будь-де.
      Італійці називають його «Чінквеченто», що означає «п'ятсот».
  car.citroen_2cv:
    label: Сітроен 2CV
    summary: Проста французька машина з дахом, який можна згорнути.
    info: |
      Сітроен 2CV родом із Франції, його випускали з 1948 до 1990 року.
      Його придумали, щоб возити фермерів та їхні товари вибоїстими сільськими дорогами.
      Його м'який тканинний дах згортається, як кришка бляшанки із сардинами.
  car.citroen_ds:
    label: Сітроен DS
    summary: Плавна французька машина, яка виглядала, ніби з майбутнього.
    info: |
      Сітроен DS родом із Франції, його випускали з 1955 до 1975 року.
      Він має особливу підвіску, тому, коли машину заводять, вона піднімається й опускається.
      Французькою «DS» звучить як слово «богиня».
  car.mercedes_300sl:
    label: Мерседес-Бенц 300 SL
    summary: Срібляста спортивна машина з дверима, що відчиняються вгору, як крила.
    info: |
      Мерседес-Бенц 300 SL родом із Німеччини, купе випускали з 1954 до 1957 року.
      Його двері відчиняються вгору, тому його називають «Крило чайки».
      Свого часу це була одна з найшвидших машин, які можна було купити.
  car.jaguar_e_type:
    label: Ягуар E-Type
    summary: Довга й струнка британська спортивна машина.
    info: |
      Ягуар E-Type родом із Великої Британії, його випускали з 1961 до 1975 року.
      У нього дуже довгий капот, а під ним великий двигун.
      Багато хто каже, що це одна з найкрасивіших машин, які будь-коли створили.
  car.aston_martin_db5:
    label: Астон Мартін DB5
    summary: Елегантна британська машина шпигуна Джеймса Бонда.
    info: |
      Астон Мартін DB5 родом із Великої Британії, його випускали з 1963 до 1965 року.
      Він прославився на весь світ у фільмі про Джеймса Бонда «Голдфінгер» 1964 року.
      Таких машин зробили лише близько тисячі.
  car.shelby_cobra:
    label: Шелбі Кобра
    summary: Маленька відкрита машина з величезним і гучним двигуном.
    info: |
      Шелбі Кобру зробив у 1960-х роках американський гонщик Керролл Шелбі.
      Він узяв легку британську спортивну машину й поставив у неї великий американський двигун Форд.
      Вона виграла багато перегонів, і її копіюють досі.
  car.ford_mustang:
    label: Форд Мустанг
    summary: Спортивна американська машина, названа на честь дикого коня.
    info: |
      Форд Мустанг родом із США, його почали продавати 1964 року.
      Він був такий популярний, що на його честь цілу групу схожих машин назвали «поні-карами».
      Мустанг випускають і досі.
  car.corvette_c2:
    label: Корвет Стінг Рей
    summary: Американська спортивна машина із заднім склом, розділеним на дві частини.
    info: |
      Шевроле Корвет Стінг Рей родом із США.
      Тільки в купе 1963 року заднє скло було розділене на дві половинки.
      Його кузов зроблений зі склопластику, а не зі сталі.
  car.cadillac_eldorado:
    label: Кадилак Ельдорадо
    summary: Величезна американська машина з найбільшими хвостовими плавцями.
    info: |
      Кадилак Ельдорадо 1959 року родом із США.
      Його високі задні плавці, схожі на ракету, — одні з найвищих, які будь-коли були в машин.
      Він довший за 5 з половиною метрів.
  car.chevrolet_bel_air:
    label: Шевроле Бел Ейр
    summary: Блискуча американська машина 1950-х із хромом і маленькими плавцями.
    info: |
      Шевроле Бел Ейр 1957 року родом із США.
      Завдяки двоколірному фарбуванню й безлічі хрому він став символом Америки 1950-х.
      На Кубі багато таких старих машин досі їздять вулицями.
  car.ford_gt40:
    label: Форд GT40
    summary: Дуже низька американська гоночна машина, яка перемогла Феррарі.
    info: |
      Форд GT40 збудували в 1960-х роках, щоб перемогти в перегонах «24 години Ле-Мана».
      Він вигравав Ле-Ман чотири роки поспіль, з 1966 до 1969 року.
      Він називається GT40, бо його висота лише близько 40 дюймів (1 метр).
  car.porsche_911_classic:
    label: Порше 911 Каррера RS
    summary: Класична німецька спортивна машина з маленьким спойлером «качиний хвіст».
    info: |
      Порше 911 родом із Німеччини, перший такий автомобіль зробили 1964 року.
      Каррера RS 1973 року була легкою і швидкою версією для перегонів.
      Її маленький задній спойлер схожий на качиний хвостик.
  car.porsche_911_modern:
    label: Порше 911
    summary: Нова версія спортивної машини, яка вже 60 років зберігає свою форму.
    info: |
      Порше 911 родом із Німеччини, а ця версія з'явилася 2019 року.
      У неї досі круглі фари й двигун ззаду, як у найпершого 911.
      Це одна з родин спортивних машин, які випускають найдовше у світі.
  car.lamborghini_countach:
    label: Ламборгіні Каунтач
    summary: Плаский і гострий італійський суперкар із дверима, що відчиняються вгору.
    info: |
      Ламборгіні Каунтач родом з Італії, його випускали з 1974 до 1990 року.
      Його двері піднімаються вгору й уперед, як ножиці.
      У багатьох дітей на стіні в кімнаті висів його плакат.
  car.ferrari_testarossa:
    label: Феррарі Тестаросса
    summary: Широка червона італійська спортивна машина зі смугами на боках.
    info: |
      Феррарі Тестаросса родом з Італії, її почали випускати 1984 року.
      «Тестаросса» італійською означає «руда голова», бо верх її двигуна пофарбований у червоний колір.
      Довгі смуги на боках пропускають повітря, яке охолоджує двигун.
  car.ferrari_f40:
    label: Феррарі F40
    summary: Червоний італійський суперкар із великим крилом ззаду.
    info: |
      Феррарі F40 родом з Італії, її випускали з 1987 до 1992 року.
      Її зробили до 40-річчя Феррарі, звідси й назва.
      Це була одна з перших дорожніх машин, які могли їхати швидше за 320 км/год.
  car.delorean:
    label: Делоріан
    summary: Блискуча сталева машина, яка в кіно стала машиною часу.
    info: |
      Делоріан DMC-12 випускали в Північній Ірландії 1981 і 1982 року.
      Його кузов із голої нержавкої сталі зовсім не пофарбований, а двері відчиняються вгору.
      Він прославився як машина часу у фільмі «Назад у майбутнє».
  car.london_taxi:
    label: Лондонське таксі
    summary: Знамените чорне таксі, яке возить людей Лондоном.
    info: |
      Остін FX4 родом із Великої Британії, його випускали з 1958 до 1997 року.
      Він може розвернутися на дуже маленькому колі, і це допомагає на вузьких вулицях Лондона.
      Високий дах йому зробили, щоб пасажири могли сидіти всередині в капелюсі.
  car.toyota_land_cruiser:
    label: Тойота Ленд Крузер
    summary: Міцна японська машина, яка проїде пустелями й джунглями.
    info: |
      Тойота Ленд Крузер FJ40 родом з Японії, її випускали з 1960 до 1984 року.
      Її продавали по всьому світу, і вона славиться тим, що її дуже важко зламати.
      Багато таких машин досі їздять поганими дорогами.
  car.mazda_mx5:
    label: Мазда MX-5
    summary: Маленька весела японська двомісна машина з висувними фарами.
    info: |
      Мазда MX-5 родом з Японії, її почали продавати 1989 року.
      У першої версії були фари, які піднімалися з капота.
      Це найпопулярніша за продажами двомісна спортивна машина у світі.
  car.trabant:
    label: Трабант
    summary: Маленька машина з НДР із кузовом, частково зробленим із пластику.
    info: |
      Трабант родом зі Східної Німеччини, його випускали з 1957 до 1991 року.
      Його кузов робили не зі сталі, а з твердого пластику, змішаного з бавовняними волокнами.
      Щоб купити таку машину, людям часто доводилося чекати багато років.
  car.bugatti_veyron:
    label: Бугатті Вейрон
    summary: Неймовірно швидка машина, яка може їхати понад 400 км/год.
    info: |
      Бугатті Вейрон родом із Франції, його випускали з 2005 до 2015 року.
      Його двигун має 16 циліндрів і понад 1000 кінських сил.
      Коли він з'явився, це була найшвидша дорожня машина у світі.
  car.tesla_model_s:
    label: Тесла Модель S
    summary: Швидка американська машина, яка їздить на електриці, а не на бензині.
    info: |
      Тесла Модель S родом із США, її почали продавати 2012 року.
      Вона працює від великих батарей під підлогою, тому в неї немає вихлопної труби.
      Спереду немає двигуна, тому там є другий багажник.
