lang: he
pivot: false
title: מכוניות מפורסמות
cards:
  car.ford_model_t:
    label: פורד מודל T
    summary: המכונית שאפשרה גם למשפחות רגילות לנסוע במכונית.
    info: |
      פורד מודל T יוצרה בארצות הברית משנת 1908 עד שנת 1927.
      היא הורכבה על פס ייצור נע, ולכן הייתה זולה, ויוצרו ממנה יותר מ־15 מיליון מכוניות.
      במשך שנים רבות אפשר היה לקנות אותה רק בצבע שחור.
  car.vw_beetle:
    label: פולקסווגן חיפושית
    summary: מכונית קטנה ועגלגלה שאנשים קראו לה על שם חרק.
    info: |
      החיפושית של פולקסווגן מגיעה מגרמניה, והיא יוצרה משנת 1938 עד שנת 2003.
      יוצרו ממנה יותר מ־21 מיליון מכוניות, יותר מכל מכונית אחרת בעיצוב אחד.
      המנוע שלה נמצא מאחור, מתחת למכסה האחורי.
  car.vw_bus:
    label: מיניבוס פולקסווגן
    summary: מיניבוס חביב למשפחות, לגולשים ולטיולי קמפינג.
    info: |
      פולקסווגן טייפ 2 מגיעה מגרמניה, והיא יוצרה לראשונה בשנת 1950.
      לדגמים הראשונים הייתה שמשה קדמית מחולקת לשני חצאים ואות V גדולה מלפנים.
      אנשים רבים הפכו אותה לבית קטן על גלגלים כדי לטייל.
  car.jeep_willys:
    label: ג'יפ ויליס
    summary: מכונית צבאית קטנה וחזקה שיכלה לנסוע כמעט בכל מקום.
    info: |
      ויליס MB יוצר בארצות הברית בשביל מלחמת העולם השנייה, משנת 1941 עד שנת 1945.
      יוצרו ממנו מאות אלפים כדי להסיע חיילים בשטח קשה.
      על שמו נקראו כל מכוניות הג'יפ שבאו אחריו.
  car.land_rover_defender:
    label: לנד רובר דיפנדר
    summary: מכונית בריטית מרובעת שנבנתה כדי לנסוע בשדות ובבוץ.
    info: |
      לנד רובר מגיעה מבריטניה, והראשונה יוצרה בשנת 1948.
      משנת 1990 היא נקראה דיפנדר, והיא יוצרה עד שנת 2016.
      חקלאים, חוקרים וצוותי חילוץ השתמשו בה בכל העולם.
  car.mini_cooper:
    label: מיני קופר
    summary: מכונית בריטית זעירה שהייתה מהירה באופן מפתיע.
    info: |
      המיני מגיעה מבריטניה, והיא יוצרה משנת 1959 עד שנת 2000.
      המנוע שלה מונח לרוחב, ולכן ארבעה אנשים נכנסים למכונית קצרה מאוד.
      בשנת 1964 מיני קופר S ניצחה בראלי מונטה קרלו המפורסם.
  car.fiat_500:
    label: פיאט 500
    summary: מכונית איטלקית זעירה שנבנתה לרחובות הצרים של העיר.
    info: |
      פיאט 500 מגיעה מאיטליה, והיא יוצרה משנת 1957 עד שנת 1975.
      האורך שלה פחות מ־3 מטרים, ולכן אפשר להחנות אותה כמעט בכל מקום.
      האיטלקים קוראים לה "צ'ינקוצ'נטו", שפירושו "חמש מאות".
  car.citroen_2cv:
    label: סיטרואן 2CV
    summary: מכונית צרפתית פשוטה עם גג שאפשר לגלגל לאחור.
    info: |
      סיטרואן 2CV מגיעה מצרפת, והיא יוצרה משנת 1948 עד שנת 1990.
      היא תוכננה להסיע חקלאים ואת הסחורה שלהם בדרכי כפר משובשות.
      הגג הרך שלה, מבד, מתגלגל לאחור כמו מכסה של קופסת סרדינים.
  car.citroen_ds:
    label: סיטרואן DS
    summary: מכונית צרפתית חלקה שנראית כאילו הגיעה מהעתיד.
    info: |
      סיטרואן DS מגיעה מצרפת, והיא יוצרה משנת 1955 עד שנת 1975.
      יש לה מתלים מיוחדים שגורמים למכונית להתרומם ולשקוע כשמתניעים אותה.
      בצרפתית, "DS" נשמע כמו המילה שפירושה "אלה".
  car.mercedes_300sl:
    label: מרצדס-בנץ 300 SL
    summary: מכונית ספורט כסופה עם דלתות שנפתחות למעלה כמו כנפיים.
    info: |
      מרצדס-בנץ 300 SL מגיעה מגרמניה, ודגם הקופה יוצר משנת 1954 עד שנת 1957.
      הדלתות שלה נפתחות כלפי מעלה, ולכן קוראים לה "כנף שחף".
      היא הייתה אחת המכוניות המהירות ביותר שאפשר היה לקנות בזמנה.
  car.jaguar_e_type:
    label: יגואר E-Type
    summary: מכונית ספורט בריטית ארוכה ואלגנטית.
    info: |
      יגואר E-Type מגיעה מבריטניה, והיא יוצרה משנת 1961 עד שנת 1975.
      יש לה מכסה מנוע ארוך מאוד, ומתחתיו מנוע גדול.
      אנשים רבים אומרים שהיא אחת המכוניות היפות ביותר שנבנו אי פעם.
  car.aston_martin_db5:
    label: אסטון מרטין DB5
    summary: המכונית הבריטית האלגנטית של המרגל ג'יימס בונד.
    info: |
      אסטון מרטין DB5 מגיעה מבריטניה, והיא יוצרה משנת 1963 עד שנת 1965.
      היא התפרסמה בכל העולם בסרט ג'יימס בונד "אצבע הזהב" בשנת 1964.
      יוצרו ממנה רק בערך אלף מכוניות.
  car.shelby_cobra:
    label: שלבי קוברה
    summary: מכונית פתוחה קטנה עם מנוע ענק ורועש.
    info: |
      את שלבי קוברה בנה נהג המרוצים האמריקאי קרול שלבי בשנות ה־60.
      הוא לקח מכונית ספורט בריטית קלה והכניס לתוכה מנוע פורד אמריקאי גדול.
      היא ניצחה במרוצים רבים, ועד היום בונים העתקים שלה.
  car.ford_mustang:
    label: פורד מוסטנג
    summary: מכונית אמריקאית ספורטיבית שנקראה על שם סוס בר.
    info: |
      פורד מוסטנג מגיעה מארצות הברית, והיא נמכרה לראשונה בשנת 1964.
      היא הייתה כל כך אהובה, שקבוצה שלמה של מכוניות דומות נקראה על שמה "מכוניות פוני".
      המוסטנג מיוצרת גם היום.
  car.corvette_c2:
    label: קורבט סטינגריי
    summary: מכונית ספורט אמריקאית שהחלון האחורי שלה מחולק לשניים.
    info: |
      שברולט קורבט סטינגריי מגיעה מארצות הברית.
      רק לדגם הקופה של 1963 היה חלון אחורי מחולק לשני חצאים.
      הגוף שלה עשוי סיבי זכוכית במקום פלדה.
  car.cadillac_eldorado:
    label: קדילק אלדורדו
    summary: מכונית אמריקאית ענקית עם סנפירי הזנב הגדולים ביותר אי פעם.
    info: |
      קדילק אלדורדו משנת 1959 מגיעה מארצות הברית.
      סנפירי הזנב הגבוהים שלה, בצורת סנפירים של טיל, הם מהגבוהים ביותר שהותקנו אי פעם על מכונית.
      האורך שלה יותר מחמישה מטרים וחצי.
  car.chevrolet_bel_air:
    label: שברולט בל אייר
    summary: מכונית אמריקאית נוצצת משנות ה־50, עם הרבה כרום וסנפירי זנב קטנים.
    info: |
      שברולט בל אייר משנת 1957 מגיעה מארצות הברית.
      עם הצבע הדו־גוני והרבה כרום, היא הפכה לסמל של אמריקה בשנות ה־50.
      בקובה, הרבה מהמכוניות הישנות האלה עדיין נוסעות ברחובות גם היום.
  car.ford_gt40:
    label: פורד GT40
    summary: מכונית מרוץ אמריקאית נמוכה מאוד שניצחה את פרארי.
    info: |
      פורד GT40 נבנתה בשנות ה־60 כדי לנצח במרוץ 24 השעות של לה מאן.
      היא ניצחה בלה מאן ארבע שנים ברציפות, משנת 1966 עד שנת 1969.
      קוראים לה GT40 כי הגובה שלה רק בערך 40 אינץ' (מטר אחד).
  car.porsche_911_classic:
    label: פורשה 911 קררה RS
    summary: מכונית ספורט גרמנית קלאסית עם כנף אחורית קטנה בצורת "זנב ברווז".
    info: |
      פורשה 911 מגיעה מגרמניה, והראשונה יוצרה בשנת 1964.
      הקררה RS משנת 1973 הייתה גרסה קלה ומהירה שנבנתה למרוצים.
      הכנף האחורית הקטנה שלה נראית כמו זנב של ברווז.
  car.porsche_911_modern:
    label: פורשה 911
    summary: הגרסה המודרנית של מכונית ספורט ששמרה על הצורה שלה 60 שנה.
    info: |
      פורשה 911 מגיעה מגרמניה, והגרסה הזאת יצאה בשנת 2019.
      עדיין יש לה פנסים קדמיים עגולים והמנוע שלה מאחור, בדיוק כמו ב־911 הראשונה.
      זו אחת ממשפחות מכוניות הספורט שמיוצרות הכי הרבה זמן בעולם.
  car.lamborghini_countach:
    label: למבורגיני קונטאש
    summary: מכונית-על איטלקית שטוחה וחדה, עם דלתות שנפתחות למעלה.
    info: |
      למבורגיני קונטאש מגיעה מאיטליה, והיא יוצרה משנת 1974 עד שנת 1990.
      הדלתות שלה מתרוממות למעלה ולפנים, כמו מספריים.
      הרבה ילדים תלו פוסטר שלה על הקיר בחדר.
  car.ferrari_testarossa:
    label: פרארי טסטרוסה
    summary: מכונית ספורט איטלקית אדומה ורחבה עם פסים בצדדים.
    info: |
      פרארי טסטרוסה מגיעה מאיטליה, והיא יוצרה לראשונה בשנת 1984.
      "טסטרוסה" פירושו באיטלקית "ראש אדום", כי החלק העליון של המנוע שלה צבוע באדום.
      הפסים הארוכים בצדדים מכניסים אוויר שמקרר את המנוע.
  car.ferrari_f40:
    label: פרארי F40
    summary: מכונית-על איטלקית אדומה עם כנף גדולה מאחור.
    info: |
      פרארי F40 מגיעה מאיטליה, והיא יוצרה משנת 1987 עד שנת 1992.
      היא נבנתה ליום ההולדת ה־40 של פרארי, ומכאן השם שלה.
      היא הייתה אחת ממכוניות הכביש הראשונות שיכלו לנסוע מהר יותר מ־320 קמ"ש.
  car.delorean:
    label: דלוריאן
    summary: מכונית פלדה מבריקה שהפכה למכונת זמן בסרט.
    info: |
      דלוריאן DMC-12 יוצרה בצפון אירלנד בשנים 1981 ו־1982.
      הגוף שלה עשוי פלדת אל־חלד חשופה, בלי שום צבע, והדלתות שלה נפתחות למעלה.
      היא התפרסמה כמכונת הזמן בסרט "בחזרה לעתיד".
  car.london_taxi:
    label: מונית לונדונית
    summary: המונית השחורה המפורסמת שמסיעה אנשים ברחבי לונדון.
    info: |
      אוסטין FX4 מגיעה מבריטניה, והיא יוצרה משנת 1958 עד שנת 1997.
      היא יכולה להסתובב במעגל קטן מאוד, וזה עוזר ברחובות הצרים של לונדון.
      הגג הגבוה שלה נבנה כך שנוסעים יוכלו לשבת בפנים עם כובע על הראש.
  car.toyota_land_cruiser:
    label: טויוטה לנד קרוזר
    summary: מכונית יפנית חזקה שיכולה לנסוע במדבריות ובג'ונגלים.
    info: |
      טויוטה לנד קרוזר FJ40 מגיעה מיפן, והיא יוצרה משנת 1960 עד שנת 1984.
      היא נמכרה בכל העולם, והיא ידועה בכך שקשה מאוד לקלקל אותה.
      הרבה מהן עדיין נוסעות היום בדרכים משובשות.
  car.mazda_mx5:
    label: מאזדה MX-5
    summary: מכונית יפנית קטנה ועליזה לשני נוסעים, עם פנסים שקופצים למעלה.
    info: |
      מאזדה MX-5 מגיעה מיפן, והיא נמכרה לראשונה בשנת 1989.
      לגרסה הראשונה היו פנסים קדמיים שמתרוממים מתוך מכסה המנוע.
      זו מכונית הספורט הדו־מושבית הנמכרת ביותר בעולם.
  car.trabant:
    label: טראבנט
    summary: מכונית קטנה ממזרח גרמניה שהגוף שלה עשוי בחלקו מפלסטיק.
    info: |
      הטראבנט מגיעה ממזרח גרמניה, והיא יוצרה משנת 1957 עד שנת 1991.
      הגוף שלה היה עשוי פלסטיק קשה מעורב בסיבי כותנה במקום פלדה.
      לעיתים קרובות אנשים היו צריכים לחכות שנים רבות כדי לקנות אחת.
  car.bugatti_veyron:
    label: בוגאטי וירון
    summary: מכונית מהירה להפליא שיכולה לנסוע יותר מ־400 קמ"ש.
    info: |
      בוגאטי וירון מגיעה מצרפת, והיא יוצרה משנת 2005 עד שנת 2015.
      למנוע שלה יש 16 צילינדרים ויותר מ־1,000 כוחות סוס.
      כשהיא יצאה, היא הייתה מכונית הכביש המהירה ביותר בעולם.
  car.tesla_model_s:
    label: טסלה מודל S
    summary: מכונית אמריקאית מהירה שנוסעת על חשמל במקום על בנזין.
    info: |
      טסלה מודל S מגיעה מארצות הברית, והיא נמכרת מאז שנת 2012.
      היא נוסעת על סוללות גדולות מתחת לרצפה, ולכן אין לה צינור פליטה.
      מכיוון שאין מנוע מלפנים, יש שם תא מטען נוסף.
