lang: ru
pivot: false
title: Знаменитые автомобили
cards:
  car.ford_model_t:
    label: Форд Модель T
    summary: Машина, благодаря которой автомобиль появился у обычных семей.
    info: |
      Форд Модель T выпускали в США с 1908 по 1927 год.
      Его собирали на движущемся конвейере, поэтому он был дешёвым, и всего сделали больше 15 миллионов машин.
      Много лет его можно было купить только чёрного цвета.
  car.vw_beetle:
    label: Фольксваген Жук
    summary: Маленькая круглая машина, которую люди назвали в честь насекомого.
    info: |
      Фольксваген Жук родом из Германии, его выпускали с 1938 по 2003 год.
      Таких машин сделали больше 21 миллиона — больше, чем любой другой модели одного дизайна.
      Двигатель у него сзади, под задней крышкой.
  car.vw_bus:
    label: Фольксваген Транспортер
    summary: Добрый микроавтобус для семей, сёрферов и походов с палатками.
    info: |
      Фольксваген Тип 2 родом из Германии, его начали выпускать в 1950 году.
      У первых машин лобовое стекло было разделено на две половинки, а спереди красовалась большая буква V.
      Многие люди превращали его в маленький домик на колёсах для путешествий.
  car.jeep_willys:
    label: Виллис
    summary: Маленькая и крепкая армейская машина, которая проезжала почти везде.
    info: |
      Виллис MB делали в США для Второй мировой войны, с 1941 по 1945 год.
      Их построили сотни тысяч, чтобы возить солдат по бездорожью.
      Он дал имя всем джипам, которые появились после него.
  car.land_rover_defender:
    label: Лэнд Ровер Дефендер
    summary: Угловатая британская машина, сделанная для езды по полям и грязи.
    info: |
      Лэнд Ровер родом из Великобритании, первый такой автомобиль сделали в 1948 году.
      С 1990 года его стали называть Дефендер, и выпускали его до 2016 года.
      На нём ездили фермеры, путешественники и спасатели по всему миру.
  car.mini_cooper:
    label: Мини Купер
    summary: Крошечная британская машина, которая оказалась удивительно быстрой.
    info: |
      Мини родом из Великобритании, его выпускали с 1959 по 2000 год.
      Двигатель у него стоит поперёк, поэтому в очень короткой машине помещаются четыре человека.
      Мини Купер S победил в знаменитом ралли Монте-Карло в 1964 году.
  car.fiat_500:
    label: Фиат 500
    summary: Крошечная итальянская машина для узких городских улочек.
    info: |
      Фиат 500 родом из Италии, его выпускали с 1957 по 1975 год.
      Он короче 3 метров, поэтому припарковаться может почти где угодно.
      Итальянцы называют его «Чинквеченто», что значит «пятьсот».
  car.citroen_2cv:
    label: Ситроен 2CV
    summary: Простая французская машина с крышей, которую можно скатать.
    info: |
      Ситроен 2CV родом из Франции, его выпускали с 1948 по 1990 год.
      Его придумали, чтобы возить фермеров и их товары по ухабистым сельским дорогам.
      Его мягкая тканевая крыша скатывается, как крышка банки с сардинами.
  car.citroen_ds:
    label: Ситроен DS
    summary: Плавная французская машина, которая выглядела как из будущего.
    info: |
      Ситроен DS родом из Франции, его выпускали с 1955 по 1975 год.
      У него особая подвеска, поэтому, когда машину заводят, она поднимается и опускается.
      По-французски «DS» звучит как слово «богиня».
  car.mercedes_300sl:
    label: Мерседес-Бенц 300 SL
    summary: Серебристая спортивная машина с дверями, которые открываются вверх, как крылья.
    info: |
      Мерседес-Бенц 300 SL родом из Германии, купе выпускали с 1954 по 1957 год.
      Его двери открываются вверх, поэтому его называют «Крыло чайки».
      В своё время это была одна из самых быстрых машин, которые можно было купить.
  car.jaguar_e_type:
    label: Ягуар E-Type
    summary: Длинная и стройная британская спортивная машина.
    info: |
      Ягуар E-Type родом из Великобритании, его выпускали с 1961 по 1975 год.
      У него очень длинный капот, а под ним большой двигатель.
      Многие говорят, что это одна из самых красивых машин на свете.
  car.aston_martin_db5:
    label: Астон Мартин DB5
    summary: Элегантная британская машина шпиона Джеймса Бонда.
    info: |
      Астон Мартин DB5 родом из Великобритании, его выпускали с 1963 по 1965 год.
      Он прославился на весь мир в фильме о Джеймсе Бонде «Голдфингер» в 1964 году.
      Таких машин сделали всего около тысячи.
  car.shelby_cobra:
    label: Шелби Кобра
    summary: Маленькая открытая машина с огромным и громким двигателем.
    info: |
      Шелби Кобру сделал в 1960-х годах американский гонщик Кэрролл Шелби.
      Он взял лёгкую британскую спортивную машину и поставил в неё большой американский двигатель Форд.
      Она выиграла много гонок, и её копируют до сих пор.
  car.ford_mustang:
    label: Форд Мустанг
    summary: Спортивная американская машина, названная в честь дикой лошади.
    info: |
      Форд Мустанг родом из США, его начали продавать в 1964 году.
      Он был так популярен, что в честь него целую группу похожих машин назвали «пони-карами».
      Мустанг выпускают до сих пор.
  car.corvette_c2:
    label: Корвет Стинг Рей
    summary: Американская спортивная машина с задним стеклом, разделённым на две части.
    info: |
      Шевроле Корвет Стинг Рей родом из США.
      Только у купе 1963 года заднее стекло было разделено на две половинки.
      Его кузов сделан из стеклопластика, а не из стали.
  car.cadillac_eldorado:
    label: Кадиллак Эльдорадо
    summary: Огромная американская машина с самыми большими хвостовыми плавниками.
    info: |
      Кадиллак Эльдорадо 1959 года родом из США.
      Его высокие задние плавники, похожие на ракету, — одни из самых высоких, какие только были у машин.
      Он длиннее 5 с половиной метров.
  car.chevrolet_bel_air:
    label: Шевроле Бел Эйр
    summary: Блестящая американская машина 1950-х с хромом и маленькими плавниками.
    info: |
      Шевроле Бел Эйр 1957 года родом из США.
      Благодаря двухцветной окраске и множеству хрома он стал символом Америки 1950-х.
      На Кубе многие такие старые машины до сих пор ездят по улицам.
  car.ford_gt40:
    label: Форд GT40
    summary: Очень низкая американская гоночная машина, которая обогнала Феррари.
    info: |
      Форд GT40 построили в 1960-х годах, чтобы победить в гонке «24 часа Ле-Мана».
      Он выигрывал Ле-Ман четыре года подряд, с 1966 по 1969 год.
      Он называется GT40, потому что его высота всего около 40 дюймов (1 метр).
  car.porsche_911_classic:
    label: Порше 911 Каррера RS
    summary: Классическая немецкая спортивная машина с маленьким спойлером «утиный хвост».
    info: |
      Порше 911 родом из Германии, первый такой автомобиль сделали в 1964 году.
      Каррера RS 1973 года была лёгкой и быстрой версией для гонок.
      Её маленький задний спойлер похож на утиный хвостик.
  car.porsche_911_modern:
    label: Порше 911
    summary: Новая версия спортивной машины, которая уже 60 лет сохраняет свою форму.
    info: |
      Порше 911 родом из Германии, а эта версия появилась в 2019 году.
      У неё по-прежнему круглые фары и двигатель сзади, как у самого первого 911.
      Это одно из семейств спортивных машин, которые выпускают дольше всех в мире.
  car.lamborghini_countach:
    label: Ламборгини Каунтач
    summary: Плоский и острый итальянский суперкар с дверями, которые открываются вверх.
    info: |
      Ламборгини Каунтач родом из Италии, его выпускали с 1974 по 1990 год.
      Его двери поднимаются вверх и вперёд, как ножницы.
      У многих детей на стене в комнате висел его плакат.
  car.ferrari_testarossa:
    label: Феррари Тестаросса
    summary: Широкая красная итальянская спортивная машина с полосками на боках.
    info: |
      Феррари Тестаросса родом из Италии, её начали выпускать в 1984 году.
      «Тестаросса» по-итальянски значит «красная голова», потому что верх её двигателя покрашен в красный цвет.
      Длинные полоски на боках пропускают воздух, который охлаждает двигатель.
  car.ferrari_f40:
    label: Феррари F40
    summary: Красный итальянский суперкар с большим крылом сзади.
    info: |
      Феррари F40 родом из Италии, её выпускали с 1987 по 1992 год.
      Её сделали к 40-летию Феррари, отсюда и её название.
      Это была одна из первых дорожных машин, которые могли ехать быстрее 320 км/ч.
  car.delorean:
    label: Делориан
    summary: Блестящая стальная машина, которая в кино стала машиной времени.
    info: |
      Делориан DMC-12 выпускали в Северной Ирландии в 1981 и 1982 годах.
      Его кузов из голой нержавеющей стали совсем не покрашен, а двери открываются вверх.
      Он прославился как машина времени в фильме «Назад в будущее».
  car.london_taxi:
    label: Лондонское такси
    summary: Знаменитое чёрное такси, которое возит людей по Лондону.
    info: |
      Остин FX4 родом из Великобритании, его выпускали с 1958 по 1997 год.
      Он может развернуться на очень маленьком пятачке, и это помогает на узких улицах Лондона.
      Высокую крышу ему сделали, чтобы пассажиры могли сидеть внутри в шляпе.
  car.toyota_land_cruiser:
    label: Тойота Ленд Крузер
    summary: Крепкая японская машина, которая проедет через пустыни и джунгли.
    info: |
      Тойота Ленд Крузер FJ40 родом из Японии, её выпускали с 1960 по 1984 год.
      Её продавали по всему миру, и она славится тем, что её очень трудно сломать.
      Многие такие машины до сих пор ездят по плохим дорогам.
  car.mazda_mx5:
    label: Мазда MX-5
    summary: Маленькая весёлая японская двухместная машина с выдвижными фарами.
    info: |
      Мазда MX-5 родом из Японии, её начали продавать в 1989 году.
      У первой версии были фары, которые поднимались из капота.
      Это самая продаваемая двухместная спортивная машина в мире.
  car.trabant:
    label: Трабант
    summary: Маленькая машина из ГДР с кузовом, частично сделанным из пластика.
    info: |
      Трабант родом из Восточной Германии, его выпускали с 1957 по 1991 год.
      Его кузов делали не из стали, а из твёрдого пластика, смешанного с хлопковыми волокнами.
      Чтобы купить такую машину, людям часто приходилось ждать много лет.
  car.bugatti_veyron:
    label: Бугатти Вейрон
    summary: Невероятно быстрая машина, которая может ехать быстрее 400 км/ч.
    info: |
      Бугатти Вейрон родом из Франции, его выпускали с 2005 по 2015 год.
      У его двигателя 16 цилиндров и больше 1000 лошадиных сил.
      Когда он появился, это была самая быстрая дорожная машина в мире.
  car.tesla_model_s:
    label: Тесла Модель S
    summary: Быстрая американская машина, которая ездит на электричестве, а не на бензине.
    info: |
      Тесла Модель S родом из США, её начали продавать в 2012 году.
      Она работает от больших батарей под полом, поэтому у неё нет выхлопной трубы.
      Спереди нет двигателя, поэтому там есть второй багажник.
