lang: nl
pivot: false
title: Beroemde auto's
cards:
  car.ford_model_t:
    label: Ford Model T
    summary: De auto waarmee gewone gezinnen ook konden autorijden.
    info: |
      De Ford Model T werd van 1908 tot 1927 in de Verenigde Staten gemaakt.
      Hij werd aan een lopende band gebouwd, daardoor was hij goedkoop, en er werden er meer dan 15 miljoen gemaakt.
      Jarenlang kon je hem alleen in het zwart kopen.
  car.vw_beetle:
    label: Volkswagen Kever
    summary: Een klein, rond autootje dat naar een insect is genoemd.
    info: |
      De Volkswagen Kever komt uit Duitsland en werd van 1938 tot 2003 gemaakt.
      Er werden er meer dan 21 miljoen gebouwd, meer dan van elke andere auto met hetzelfde ontwerp.
      De motor zit achterin, onder de achterklep.
  car.vw_bus:
    label: Volkswagenbusje
    summary: Een vrolijk busje voor gezinnen, surfers en kampeertochten.
    info: |
      De Volkswagen Type 2 komt uit Duitsland en werd voor het eerst gemaakt in 1950.
      De eerste busjes hadden een voorruit in twee helften en een grote V op de voorkant.
      Veel mensen maakten er een klein huisje op wielen van om mee te reizen.
  car.jeep_willys:
    label: Willys Jeep
    summary: Een kleine, stoere legerauto die bijna overal kon rijden.
    info: |
      De Willys MB werd voor de Tweede Wereldoorlog in de Verenigde Staten gemaakt, van 1941 tot 1945.
      Er werden er honderdduizenden gebouwd om soldaten over ruw terrein te vervoeren.
      Alle Jeep-auto's die daarna kwamen, zijn naar hem genoemd.
  car.land_rover_defender:
    label: Land Rover Defender
    summary: Een hoekige Britse auto, gemaakt om door velden en modder te rijden.
    info: |
      De Land Rover komt uit het Verenigd Koninkrijk; de eerste werd in 1948 gemaakt.
      Vanaf 1990 heette hij Defender, en hij werd gemaakt tot 2016.
      Boeren, ontdekkingsreizigers en reddingsteams gebruikten hem over de hele wereld.
  car.mini_cooper:
    label: Mini Cooper
    summary: Een piepklein Brits autootje dat verrassend snel was.
    info: |
      De Mini komt uit het Verenigd Koninkrijk en werd van 1959 tot 2000 gemaakt.
      De motor ligt dwars, daardoor passen er vier mensen in een heel korte auto.
      Een Mini Cooper S won in 1964 de beroemde Rally van Monte Carlo.
  car.fiat_500:
    label: Fiat 500
    summary: Een piepklein Italiaans autootje voor smalle straatjes in de stad.
    info: |
      De Fiat 500 komt uit Italië en werd van 1957 tot 1975 gemaakt.
      Hij is nog geen 3 meter lang, dus je kunt hem bijna overal parkeren.
      Italianen noemen hem de "Cinquecento", wat "vijfhonderd" betekent.
  car.citroen_2cv:
    label: Citroën Eend
    summary: Een eenvoudige Franse auto met een dak dat je kunt oprollen.
    info: |
      De Citroën 2CV, de Eend, komt uit Frankrijk en werd van 1948 tot 1990 gemaakt.
      Hij was bedoeld om boeren en hun spullen over hobbelige landweggetjes te vervoeren.
      Het zachte linnen dak rolt op zoals het deksel van een blikje sardines.
  car.citroen_ds:
    label: Citroën DS
    summary: Een sierlijke Franse auto die eruitzag alsof hij uit de toekomst kwam.
    info: |
      De Citroën DS komt uit Frankrijk en werd van 1955 tot 1975 gemaakt.
      Door zijn speciale vering gaat de auto omhoog en omlaag als je hem start.
      In het Frans klinkt "DS" als het woord voor "godin".
  car.mercedes_300sl:
    label: Mercedes-Benz 300 SL
    summary: Een zilveren sportauto met deuren die als vleugels omhoog opengaan.
    info: |
      De Mercedes-Benz 300 SL komt uit Duitsland; de coupé werd van 1954 tot 1957 gemaakt.
      Zijn deuren gaan omhoog open, daarom noemen mensen hem de "Gullwing", de meeuwenvleugel.
      Hij was een van de snelste auto's die je in die tijd kon kopen.
  car.jaguar_e_type:
    label: Jaguar E-Type
    summary: Een lange, slanke Britse sportauto.
    info: |
      De Jaguar E-Type komt uit het Verenigd Koninkrijk en werd van 1961 tot 1975 gemaakt.
      Hij heeft een heel lange motorkap met een grote motor eronder.
      Veel mensen zeggen dat het een van de mooiste auto's is die ooit zijn gemaakt.
  car.aston_martin_db5:
    label: Aston Martin DB5
    summary: De sierlijke Britse auto van de geheim agent James Bond.
    info: |
      De Aston Martin DB5 komt uit het Verenigd Koninkrijk en werd van 1963 tot 1965 gemaakt.
      Hij werd wereldberoemd in 1964 door de James Bond-film "Goldfinger".
      Er zijn er maar ongeveer duizend gemaakt.
  car.shelby_cobra:
    label: Shelby Cobra
    summary: Een kleine open auto met een enorme, luide motor.
    info: |
      De Shelby Cobra werd in de jaren zestig gemaakt door de Amerikaanse coureur Carroll Shelby.
      Hij nam een lichte Britse sportauto en zette er een grote Amerikaanse Ford-motor in.
      Hij won veel races en wordt nu nog steeds nagemaakt.
  car.ford_mustang:
    label: Ford Mustang
    summary: Een sportieve Amerikaanse auto, genoemd naar een wild paard.
    info: |
      De Ford Mustang komt uit de Verenigde Staten en kwam in 1964 voor het eerst te koop.
      Hij was zo populair dat een hele groep auto's die op hem leken, naar hem "pony cars" werden genoemd.
      De Mustang wordt nu nog steeds gemaakt.
  car.corvette_c2:
    label: Corvette Sting Ray
    summary: Een Amerikaanse sportauto met een achterruit in twee delen.
    info: |
      De Chevrolet Corvette Sting Ray komt uit de Verenigde Staten.
      Alleen de coupé uit 1963 had een achterruit in twee helften.
      Zijn carrosserie is van glasvezel in plaats van staal.
  car.cadillac_eldorado:
    label: Cadillac Eldorado
    summary: Een enorme Amerikaanse auto met de grootste staartvinnen ooit.
    info: |
      De Cadillac Eldorado uit 1959 komt uit de Verenigde Staten.
      Zijn hoge staartvinnen, in de vorm van een raket, horen bij de hoogste die ooit op een auto zijn gezet.
      Hij is meer dan vijfenhalve meter lang.
  car.chevrolet_bel_air:
    label: Chevrolet Bel Air
    summary: Een glimmende Amerikaanse auto uit de jaren vijftig met chroom en kleine staartvinnen.
    info: |
      De Chevrolet Bel Air uit 1957 komt uit de Verenigde Staten.
      Met zijn lak in twee kleuren en veel chroom werd hij een symbool van Amerika in de jaren vijftig.
      Op Cuba rijden nu nog steeds veel van deze oude auto's door de straten.
  car.ford_gt40:
    label: Ford GT40
    summary: Een heel lage Amerikaanse raceauto die Ferrari versloeg.
    info: |
      De Ford GT40 werd in de jaren zestig gebouwd om de 24 uur van Le Mans te winnen.
      Hij won Le Mans vier jaar achter elkaar, van 1966 tot 1969.
      Hij heet GT40 omdat hij maar ongeveer 40 inch (1 meter) hoog is.
  car.porsche_911_classic:
    label: Porsche 911 Carrera RS
    summary: Een klassieke Duitse sportauto met een klein "eendenstaartje" als spoiler.
    info: |
      De Porsche 911 komt uit Duitsland; de eerste werd in 1964 gemaakt.
      De Carrera RS uit 1973 was een lichte, snelle versie die voor races was gebouwd.
      Zijn kleine achterspoiler lijkt op het staartje van een eend.
  car.porsche_911_modern:
    label: Porsche 911
    summary: De moderne versie van een sportauto die al 60 jaar dezelfde vorm heeft.
    info: |
      De Porsche 911 komt uit Duitsland, en deze versie kwam uit in 2019.
      Hij heeft nog steeds ronde koplampen en de motor achterin, net als de eerste 911.
      Het is een van de sportautofamilies die het langst worden gemaakt in de wereld.
  car.lamborghini_countach:
    label: Lamborghini Countach
    summary: Een platte, puntige Italiaanse supercar met deuren die omhoog opengaan.
    info: |
      De Lamborghini Countach komt uit Italië en werd van 1974 tot 1990 gemaakt.
      Zijn deuren klappen naar voren omhoog, zoals een schaar.
      Veel kinderen hadden een poster van hem aan de muur van hun slaapkamer.
  car.ferrari_testarossa:
    label: Ferrari Testarossa
    summary: Een brede rode Italiaanse sportauto met strepen op de zijkanten.
    info: |
      De Ferrari Testarossa komt uit Italië en werd voor het eerst gemaakt in 1984.
      "Testarossa" betekent "rood hoofd" in het Italiaans, omdat de bovenkant van zijn motor rood is geverfd.
      Door de lange strepen op de zijkanten komt er lucht binnen die de motor koelt.
  car.ferrari_f40:
    label: Ferrari F40
    summary: Een rode Italiaanse supercar met een grote vleugel achterop.
    info: |
      De Ferrari F40 komt uit Italië en werd van 1987 tot 1992 gemaakt.
      Hij werd gemaakt voor de 40e verjaardag van Ferrari, en daar komt zijn naam vandaan.
      Het was een van de eerste gewone auto's voor de weg die harder dan 320 km/h konden.
  car.delorean:
    label: DeLorean
    summary: Een glimmende stalen auto die in een film een tijdmachine werd.
    info: |
      De DeLorean DMC-12 werd in 1981 en 1982 in Noord-Ierland gemaakt.
      Zijn carrosserie is van kaal roestvrij staal, zonder verf, en zijn deuren gaan omhoog open.
      Hij werd beroemd als de tijdmachine in de film "Back to the Future".
  car.london_taxi:
    label: Londense taxi
    summary: De beroemde zwarte taxi die mensen door Londen rijdt.
    info: |
      De Austin FX4 komt uit het Verenigd Koninkrijk en werd van 1958 tot 1997 gemaakt.
      Hij kan in een heel kleine cirkel keren, en dat helpt in de smalle straten van Londen.
      Zijn hoge dak was bedoeld zodat passagiers er met een hoed op in konden zitten.
  car.toyota_land_cruiser:
    label: Toyota Land Cruiser
    summary: Een stoere Japanse auto die door woestijnen en oerwouden kan rijden.
    info: |
      De Toyota Land Cruiser FJ40 komt uit Japan en werd van 1960 tot 1984 gemaakt.
      Hij werd over de hele wereld verkocht en staat erom bekend dat hij bijna niet kapot te krijgen is.
      Er rijden er nu nog steeds veel over ruwe wegen.
  car.mazda_mx5:
    label: Mazda MX-5
    summary: Een kleine, vrolijke Japanse tweezitter met koplampen die omhoog klappen.
    info: |
      De Mazda MX-5 komt uit Japan en kwam in 1989 voor het eerst te koop.
      De eerste versie had koplampen die uit de motorkap omhoog klapten.
      Het is de best verkochte tweezits sportauto ter wereld.
  car.trabant:
    label: Trabant
    summary: Een klein Oost-Duits autootje met een carrosserie die deels van plastic is.
    info: |
      De Trabant komt uit Oost-Duitsland en werd van 1957 tot 1991 gemaakt.
      Zijn carrosserie was van hard plastic met katoenvezels erin, in plaats van staal.
      Mensen moesten vaak vele jaren wachten voordat ze er een konden kopen.
  car.bugatti_veyron:
    label: Bugatti Veyron
    summary: Een ongelooflijk snelle auto die harder dan 400 km/h kan.
    info: |
      De Bugatti Veyron komt uit Frankrijk en werd van 2005 tot 2015 gemaakt.
      Zijn motor heeft 16 cilinders en meer dan 1000 pk.
      Toen hij uitkwam, was hij de snelste auto voor de weg ter wereld.
  car.tesla_model_s:
    label: Tesla Model S
    summary: Een snelle Amerikaanse auto die op stroom rijdt in plaats van op benzine.
    info: |
      De Tesla Model S komt uit de Verenigde Staten en kwam in 2012 te koop.
      Hij rijdt op grote accu's onder de vloer, dus hij heeft geen uitlaat.
      Omdat er voorin geen motor zit, heeft hij daar een tweede kofferbak.
