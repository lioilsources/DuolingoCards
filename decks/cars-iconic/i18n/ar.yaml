lang: ar
pivot: false
title: سيارات مشهورة
cards:
  car.ford_model_t:
    label: فورد موديل T
    summary: السيارة التي جعلت قيادة السيارات ممكنة للعائلات العادية.
    info: |
      صُنعت فورد موديل T في الولايات المتحدة من عام 1908 إلى عام 1927.
      كانت تُجمَّع على خط إنتاج متحرك، لذلك كانت رخيصة، وصُنع منها أكثر من 15 مليون سيارة.
      لسنوات طويلة لم يكن بالإمكان شراؤها إلا باللون الأسود.
  car.vw_beetle:
    label: فولكس فاجن الخنفساء
    summary: سيارة صغيرة مستديرة سمّاها الناس باسم حشرة.
    info: |
      الخنفساء من فولكس فاجن سيارة ألمانية، وصُنعت من عام 1938 إلى عام 2003.
      صُنع منها أكثر من 21 مليون سيارة، وهذا أكثر من أي سيارة أخرى بتصميم واحد.
      محركها في الخلف، تحت الغطاء الخلفي.
  car.vw_bus:
    label: حافلة فولكس فاجن
    summary: حافلة صغيرة لطيفة للعائلات وراكبي الأمواج ورحلات التخييم.
    info: |
      فولكس فاجن تايب 2 سيارة ألمانية، وصُنعت لأول مرة عام 1950.
      كان الزجاج الأمامي في النماذج الأولى مقسومًا إلى نصفين، وفي مقدمتها حرف V كبير.
      حوّلها كثير من الناس إلى بيت صغير على عجلات للسفر.
  car.jeep_willys:
    label: جيب ويليز
    summary: سيارة عسكرية صغيرة وقوية تستطيع السير في كل مكان تقريبًا.
    info: |
      صُنعت ويليز MB في الولايات المتحدة من أجل الحرب العالمية الثانية، من عام 1941 إلى عام 1945.
      صُنع منها مئات الآلاف لنقل الجنود فوق الأراضي الوعرة.
      ومنها أخذت كل سيارات الجيب التي جاءت بعدها اسمها.
  car.land_rover_defender:
    label: لاند روفر ديفندر
    summary: سيارة بريطانية مربعة الشكل صُنعت لتسير في الحقول والطين.
    info: |
      لاند روفر سيارة من المملكة المتحدة، وصُنعت أول واحدة منها عام 1948.
      ومنذ عام 1990 صار اسمها ديفندر، واستمر صنعها حتى عام 2016.
      استخدمها المزارعون والمستكشفون وفرق الإنقاذ في كل أنحاء العالم.
  car.mini_cooper:
    label: ميني كوبر
    summary: سيارة بريطانية صغيرة جدًا لكنها سريعة على نحو مدهش.
    info: |
      ميني سيارة من المملكة المتحدة، وصُنعت من عام 1959 إلى عام 2000.
      محركها موضوع بالعرض، لذلك يتسع أربعة أشخاص داخل سيارة قصيرة جدًا.
      فازت سيارة ميني كوبر S برالي مونت كارلو الشهير عام 1964.
  car.fiat_500:
    label: فيات 500
    summary: سيارة إيطالية صغيرة جدًا صُنعت لشوارع المدن الضيقة.
    info: |
      فيات 500 سيارة إيطالية، وصُنعت من عام 1957 إلى عام 1975.
      طولها أقل من 3 أمتار، لذلك يمكن ركنها في أي مكان تقريبًا.
      يسمّيها الإيطاليون "تشينكويتشينتو"، أي "خمسمئة".
  car.citroen_2cv:
    label: ستروين 2CV
    summary: سيارة فرنسية بسيطة لها سقف يمكن لفّه إلى الخلف.
    info: |
      ستروين 2CV سيارة فرنسية، وصُنعت من عام 1948 إلى عام 1990.
      صُممت لتنقل المزارعين وبضائعهم على طرق الريف الوعرة.
      سقفها من القماش الطري يُلفّ إلى الخلف مثل غطاء علبة السردين.
  car.citroen_ds:
    label: ستروين DS
    summary: سيارة فرنسية انسيابية تبدو كأنها جاءت من المستقبل.
    info: |
      ستروين DS سيارة فرنسية، وصُنعت من عام 1955 إلى عام 1975.
      لها نظام تعليق خاص يجعل السيارة ترتفع وتنخفض عند تشغيلها.
      في اللغة الفرنسية، تبدو كلمة "DS" مثل الكلمة التي تعني "إلهة".
  car.mercedes_300sl:
    label: مرسيدس-بنز 300 SL
    summary: سيارة رياضية فضية لها أبواب تُفتح إلى الأعلى مثل الأجنحة.
    info: |
      مرسيدس-بنز 300 SL سيارة ألمانية، وصُنعت النسخة الكوبيه منها من عام 1954 إلى عام 1957.
      أبوابها تُفتح إلى الأعلى، لذلك يسمّيها الناس "جناح النورس".
      كانت من أسرع السيارات التي يمكن شراؤها في زمنها.
  car.jaguar_e_type:
    label: جاكوار إي-تايب
    summary: سيارة رياضية بريطانية طويلة وأنيقة.
    info: |
      جاكوار إي-تايب سيارة من المملكة المتحدة، وصُنعت من عام 1961 إلى عام 1975.
      لها غطاء محرك طويل جدًا وتحته محرك كبير.
      يقول كثير من الناس إنها من أجمل السيارات التي صُنعت على الإطلاق.
  car.aston_martin_db5:
    label: أستون مارتن DB5
    summary: السيارة البريطانية الأنيقة للجاسوس جيمس بوند.
    info: |
      أستون مارتن DB5 سيارة من المملكة المتحدة، وصُنعت من عام 1963 إلى عام 1965.
      صارت مشهورة في العالم كله في فيلم جيمس بوند "غولدفينغر" عام 1964.
      لم يُصنع منها إلا نحو ألف سيارة.
  car.shelby_cobra:
    label: شيلبي كوبرا
    summary: سيارة مكشوفة صغيرة بمحرك ضخم وصاخب.
    info: |
      صنع سائق السباقات الأمريكي كارول شيلبي سيارة شيلبي كوبرا في ستينيات القرن العشرين.
      أخذ سيارة رياضية بريطانية خفيفة ووضع فيها محرك فورد أمريكيًا كبيرًا.
      فازت في سباقات كثيرة، وما زال الناس يصنعون نسخًا منها حتى اليوم.
  car.ford_mustang:
    label: فورد موستانج
    summary: سيارة أمريكية رياضية سُمّيت باسم حصان بري.
    info: |
      فورد موستانج سيارة أمريكية، وبدأ بيعها لأول مرة عام 1964.
      كانت محبوبة جدًا حتى إن مجموعة كاملة من السيارات الشبيهة بها سُمّيت على اسمها "سيارات المهر".
      وما زالت موستانج تُصنع حتى اليوم.
  car.corvette_c2:
    label: كورفيت ستينغ راي
    summary: سيارة رياضية أمريكية نافذتها الخلفية مقسومة إلى نصفين.
    info: |
      شيفروليه كورفيت ستينغ راي سيارة أمريكية.
      سيارة الكوبيه من عام 1963 وحدها كانت نافذتها الخلفية مقسومة إلى نصفين.
      هيكلها مصنوع من الألياف الزجاجية بدلًا من الفولاذ.
  car.cadillac_eldorado:
    label: كاديلاك إلدورادو
    summary: سيارة أمريكية ضخمة لها أكبر زعانف خلفية على الإطلاق.
    info: |
      كاديلاك إلدورادو من عام 1959 سيارة أمريكية.
      زعانفها الخلفية العالية التي تشبه زعانف الصاروخ من أعلى ما وُضع على سيارة.
      طولها أكثر من 5 أمتار ونصف.
  car.chevrolet_bel_air:
    label: شيفروليه بيل إير
    summary: سيارة أمريكية لامعة من الخمسينيات فيها كروم كثير وزعانف خلفية صغيرة.
    info: |
      شيفروليه بيل إير من عام 1957 سيارة أمريكية.
      بطلائها ذي اللونين وكثرة الكروم فيها، صارت رمزًا لأمريكا في الخمسينيات.
      في كوبا، ما زالت كثير من هذه السيارات القديمة تسير في الشوارع حتى اليوم.
  car.ford_gt40:
    label: فورد GT40
    summary: سيارة سباق أمريكية منخفضة جدًا تغلّبت على فيراري.
    info: |
      صُنعت فورد GT40 في ستينيات القرن العشرين للفوز بسباق لومان للتحمل 24 ساعة.
      فازت بسباق لومان أربع سنوات متتالية، من عام 1966 إلى عام 1969.
      اسمها GT40 لأن ارتفاعها نحو 40 بوصة فقط (متر واحد).
  car.porsche_911_classic:
    label: بورشه 911 كاريرا RS
    summary: سيارة رياضية ألمانية كلاسيكية لها جناح صغير يشبه "ذيل البطة".
    info: |
      بورشه 911 سيارة ألمانية، وصُنعت أول واحدة منها عام 1964.
      كانت كاريرا RS من عام 1973 نسخة خفيفة وسريعة صُنعت للسباقات.
      جناحها الخلفي الصغير يشبه ذيل البطة.
  car.porsche_911_modern:
    label: بورشه 911
    summary: النسخة الحديثة من سيارة رياضية حافظت على شكلها 60 عامًا.
    info: |
      بورشه 911 سيارة ألمانية، وظهرت هذه النسخة عام 2019.
      ما زالت لها مصابيح أمامية مستديرة ومحركها في الخلف، تمامًا مثل أول 911.
      وهي من أطول عائلات السيارات الرياضية إنتاجًا في العالم.
  car.lamborghini_countach:
    label: لامبورغيني كونتاش
    summary: سيارة إيطالية خارقة مسطحة وحادة، أبوابها تُفتح إلى الأعلى.
    info: |
      لامبورغيني كونتاش سيارة إيطالية، وصُنعت من عام 1974 إلى عام 1990.
      أبوابها ترتفع إلى الأعلى نحو الأمام، مثل المقص.
      علّق كثير من الأطفال ملصقًا لها على جدار غرفة نومهم.
  car.ferrari_testarossa:
    label: فيراري تستاروسا
    summary: سيارة رياضية إيطالية حمراء عريضة على جانبيها خطوط.
    info: |
      فيراري تستاروسا سيارة إيطالية، وصُنعت لأول مرة عام 1984.
      "تستاروسا" تعني بالإيطالية "الرأس الأحمر"، لأن أعلى محركها مطليّ بالأحمر.
      الخطوط الطويلة على جانبيها تُدخل الهواء لتبريد المحرك.
  car.ferrari_f40:
    label: فيراري F40
    summary: سيارة إيطالية خارقة حمراء لها جناح كبير في الخلف.
    info: |
      فيراري F40 سيارة إيطالية، وصُنعت من عام 1987 إلى عام 1992.
      صُنعت احتفالًا بعيد ميلاد فيراري الأربعين، ومن هنا جاء اسمها.
      كانت من أولى سيارات الطرق التي تستطيع السير بسرعة أكثر من 320 كم/ساعة.
  car.delorean:
    label: ديلوريان
    summary: سيارة لامعة من الفولاذ صارت آلة زمن في فيلم.
    info: |
      صُنعت ديلوريان DMC-12 في أيرلندا الشمالية عامَي 1981 و1982.
      هيكلها من الفولاذ المقاوم للصدأ المكشوف بلا أي طلاء، وأبوابها تُفتح إلى الأعلى.
      اشتهرت بأنها آلة الزمن في فيلم "العودة إلى المستقبل".
  car.london_taxi:
    label: تاكسي لندن
    summary: سيارة الأجرة السوداء الشهيرة التي تنقل الناس في أنحاء لندن.
    info: |
      أوستن FX4 سيارة من المملكة المتحدة، وصُنعت من عام 1958 إلى عام 1997.
      تستطيع أن تستدير في دائرة صغيرة جدًا، وهذا يساعدها في شوارع لندن الضيقة.
      صُنع سقفها عاليًا حتى يجلس الركاب في داخلها وهم يلبسون القبعات.
  car.toyota_land_cruiser:
    label: تويوتا لاند كروزر
    summary: سيارة يابانية قوية تستطيع عبور الصحاري والأدغال.
    info: |
      تويوتا لاند كروزر FJ40 سيارة يابانية، وصُنعت من عام 1960 إلى عام 1984.
      بيعت في كل أنحاء العالم، وهي معروفة بأنها صعبة الكسر جدًا.
      وما زال كثير منها يسير على الطرق الوعرة حتى اليوم.
  car.mazda_mx5:
    label: مازدا MX-5
    summary: سيارة يابانية صغيرة ومرحة بمقعدين، لها مصابيح أمامية تقفز إلى الأعلى.
    info: |
      مازدا MX-5 سيارة يابانية، وبدأ بيعها لأول مرة عام 1989.
      كانت للنسخة الأولى مصابيح أمامية تنقلب إلى الأعلى من غطاء المحرك.
      وهي السيارة الرياضية ذات المقعدين الأكثر مبيعًا في العالم.
  car.trabant:
    label: ترابانت
    summary: سيارة صغيرة من ألمانيا الشرقية هيكلها مصنوع جزئيًا من البلاستيك.
    info: |
      ترابانت سيارة من ألمانيا الشرقية، وصُنعت من عام 1957 إلى عام 1991.
      كان هيكلها مصنوعًا من بلاستيك قاسٍ ممزوج بألياف القطن بدلًا من الفولاذ.
      كان الناس كثيرًا ما ينتظرون سنوات طويلة ليشتروا واحدة.
  car.bugatti_veyron:
    label: بوغاتي فيرون
    summary: سيارة سريعة بشكل مذهل تستطيع السير بأكثر من 400 كم/ساعة.
    info: |
      بوغاتي فيرون سيارة فرنسية، وصُنعت من عام 2005 إلى عام 2015.
      لمحركها 16 أسطوانة وقوته أكثر من 1000 حصان.
      عندما ظهرت، كانت أسرع سيارة طرق في العالم.
  car.tesla_model_s:
    label: تسلا موديل S
    summary: سيارة أمريكية سريعة تسير بالكهرباء بدلًا من البنزين.
    info: |
      تسلا موديل S سيارة أمريكية، وبدأ بيعها عام 2012.
      تسير ببطاريات كبيرة تحت أرضيتها، لذلك ليس لها أنبوب عادم.
      ولأنه لا يوجد محرك في المقدمة، فهناك صندوق أمتعة ثانٍ.
