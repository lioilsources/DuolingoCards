lang: ar
pivot: false
title: الطقس
cards:
  weather.aurora:
    label: الشفق القطبي
    summary: ظاهرة ضوئية طبيعية ناتجة عن الرياح الشمسية داخل المغناطيسوسفير.
    info: |-
      تنتج الشفق القطبي، أو شرقية الأوركسترا في الشمال وجنوبية الأوركسترا بالجنوب عندما تتفاعل جسيمات الشمس المشحونة مع الغلاف الجوي الأرضي
      وتشكل أشرطة وأسلاكاً بألوان خضراء وزرقاء وبنفسجية حمراء
      من السهل رؤيته بشكل واضح المناطق القطبّة مثل النرويج واليوند وإلَندا وكُندا والأنتاركتيكا
  weather.avalanche:
    label: الانزلاقات الثلجية
    summary: كتلة ثلج وحصى تسقط من مسافات مرتفعة.
    info: تتحرك كميات كبيرة من الثلج بسرعة على المنحدرات الجبلية، وتُعرف هذه الظاهرة بالانزلاق الثلجي أو التدافع الثلجي. الأشد فتكاً هو تدافع الغبار الثلجي الذي يمكن أن يصل سرعته إلى أكثر من ٣٠٠ كلم في الساعة. يقتل هذا النوع حوالي ١٥٠ شخصًا سنويًا في جبال الألب.
  weather.blizzard:
    label: عاصفة ثلجية
    summary: عاصفة ثلجية قوية ذات أمطار غزيرة بالثلج ورياح تجعل الرؤية قريبة من الصفر.
    info: '{"hint":"عاصفة ثلجية شديدة مع رياح قوية ورؤية تكاد تكون صفرًا","info":"العواصف الثلوجية هي ظاهرة جوية قوية تتكون من تساقط كثيف للثلج والرياح القوية، مما يؤدي إلى انعدام الرؤية تقريبًا أو ما يُعرف بـ(White Out)، وتسبب أيضًا هبوبات كبيرة من التراكمات الجليدية على الأسطح المفتوحة. تاريخيًّا كانت العواصف الثلجية سببا في مقتل آلاف البشر بسبب عدم القدرة على التنقل خلالها. فمثلا عاصفة عام 1947 التي ضربت الولايات المتحدة دمرت مدينة نيويورك بأكثر من مترين من الغطاء الثلجي."}'
  weather.breezy:
    label: ريح خفيف
    summary: هو نسمة هادئة وممتعة تمدك بالإحساس البارد في يوم دافئ.
    info: الرياح الخفيفة هي رياح بسرعة تتراوح بين 6 إلى 11 مترًا بالثانية وفقاً لدرجة بافورت من المستوى الثالث أو الرابع، تسبب حركة الأوراق والشعر والأجسام خفيفة الوزن؛ كما أنها فسيولوجياً تعزّي الشعور بتقليل الحرارة عبر التبخر.
  weather.clear:
    label: جَسْنٌ
    summary: جو نقي تمامًا بدون أي غيوم.
    info: الطقس الصافي هو حالة جوية مع كمية سحب أقل من رُبع الثامن في السماء، مما يسمح بأقوى إشعاع شمسي وأفضل ظروف لرصد الفلك؛ وفي الليل تحت الظروف الجيدة يكون الإشعاع الحراري أقوى ودرجات الحرارة تنخفض بسرعة أكبر.
  weather.cloudy:
    label: غائم
    summary: السماء مُغطاة بسحب كثيفة دون وجود شمس مباشرة.
    info: تتكون السحب من تجمعات مرئية صغيرة من قطرات الماء أو بلورات الثلج. يظل أكثر من 60% من سماء الأرض دائمًا مغطى بالغيوم.
  weather.cold:
    label: شتاء
    summary: شدة برد مع درجات حرارة منخفضة جداً أقل بكثير من نقطة الصفر.
    info: البرد الشديد ينتج عن دخول الهواء القطبي إلى المناطق المعتدلّة، ويمكن أن يصل البارود الطبيعي على الأرض إلى درجة حرارة تصل لـ -89.2°م في محطة فوستوك بأنتاركتيكا. الجسم يستجيب للبرد بتقلص الأوعية الدمويَّة والاهتزازات العضلِّيَّة؛ وتحدث التهاب البرد عندما تنخفض الحرارة الجسدية تحت مستوى 35°C.
  weather.dew:
    label: رُسَّة
    summary: قطرات مائية تتكون نتيجة التبخر الليلي.
    info: تتشكل الرذاذ عندما يبرد السطح تحت نقطة الندى، مما يؤدي إلى تكثف بخار الماء في الهواء على الأسطح الباردة خلال الليالي الصافية والهدئة. وهو مصدر مهم للمياه للنباتات والحشرات وغيرها من الكائنات الحية في المناطق الجافة مثل صحراء أتاكانا حيث يستخدم البسطار الشباك لجمع مواردهم.
  weather.drizzle:
    label: مرهوين
    summary: ' "{summary":"الغيوم التي تحتوي على كمية كبيرة من المياه"}'
    info: '{"info":"إن المُرْهَوِين هو هطول مائي يتكون من قطرات صغيرة جدًا أقل من 0،5 مليمتر ولا يتشكل داخل السحب الركوية العالية بل في طبقات سحابية منخفضة ومستمرة مثل تلك الموجودة فوق البحار والأنقاض الجليدية. غالبًا ما تظهر هذه الأمطار الخفيفة على المناطق ذات المناخ القاري أو البحر الأبيض المتوسط."}'
  weather.drought:
    label: جفاف
    summary: ندرة طويلة الأجل لهطول الأمطار التي تسبب نقصًا للمياه.
    info: الجفاف هو حالة جوية تتميز بنقص طويل الأمد في هطول المطر، مما يؤدي إلى خسائر محصولية ونقص مائي وإشعال الحرائق. شهدت التشيك أسوأ حالات الجفاف بين عاميّ ٢٠١٥ - ٢٠٢٠ خلال الـ ٥٠٠ سنة الماضية.
  weather.dust_storm:
    label: عاصفة غبار
    summary: جدار من الغبار يتم دفعه بواسطة ريحاً قويّةٍ في المناطق الشاسعة.
    info: '{"hint":"حقل غبار ورمال كبير يُنفَث عبر المناطق الجافة","info":"تنتج عاصفة الغبار عندما ترفع رياح قوية جزيئات دقيقة من الأراضي اليابسة إلى الجو\nفي إفريقية الصحراوية، يعرف هذا الرياح باسم هارماتان\nيمتد الغبار الصحرائي بانتظام فوق المحيط الأطلسي ويصل إلى أمريكا؛ أظهر البحث تأثيره على غابة الأمزون\nكما أن العواصف الرملية في الولايات المتحدة (الصحراء الترابية)، التي حدثت خلال ثلاثينيات القرن الماضي، سببت كارثة بيئية شديدة في الوسط الغربي."}'
  weather.flood:
    label: فيضان
    summary: ارتفاع مستوى المياه عن مجاري الأنهار ليغطي المناطق الجافة.
    info: تحدث الفيضانات بسبب الأمطار الغزيرة أو ذوبان الثلج، كما يمكن أن تحدث نتيجة انهيار السدود. إنها الكارثة الطبيعية الأكثر كلفة في العالم. سببت الفوضيان اللتان وقعتا عامي ١٩٩٧ و٢٠٠٢ في التشيك خسائر بالمليارات وأرواحًا عديدة ضحى بها الماء والفيضان. يساعد اتخاذ إجراءات طبيعية مضادة للسيول مثل المستنقعات والأغطية النباتية على الحد من مخاطر حدوث السيول.
  weather.foggy:
    label: ضباب كثيف
    summary: ضباب كثيف يخفض مدى الرؤية.
    info: الضباب هو سحب منخفضة على مستوى الأرض تتكون من قطرات ماء صغيرة، وتحدث عندما تكون الرطوبة مرتفعة وتقلل الرؤية إلى أقل من كيلومتر.
  weather.freezing:
    label: صَقِيع
    summary: درجات حرارة تحت نقطة الانجماس التي تؤدي إلى تجميد المياه.
    info: يحدث الصقيع عند درجات الحرارة أقل من صفر مئوية، حيث تتحول الماء إلى ثلج. بيولوجياً يُهدد النباتات ويسبب الجليد حوادث مرورية. أشد فترات البرودة في التشيك عادة ما تكون يناير (الحد الأدنى التاريخية أكثر من -42°م بلغت عام ١٩٢٨ بـ ليفتينوفيتش). الثلوج هي حالة متجمدة للمياه؛ وتتأثر عملية نشوءها داخل السحب بالحرارة والكواشف الترسيبية.
  weather.frost_flowers:
    label: الزهور الجليديَّة
    summary: كристالات الثلج التي تتكون بأشكال زهرية على السطوح الباردة.
    info: تتشكل الزهور الجليدية كأبراز بلورية ناتجة عن تجمد الرطوبة على الأسطح الباردة جدًا، وعادة ما تكون هذه الأنماط البلورية معقدة في المحيط القطبي الشمالي. إنها جميلة بصريًّا بشكل استثنائي وتُعتبر من الموضوعات الشعبية لصور الطبيعة.
  weather.frosty:
    label: صباح بارد
    summary: جليد سطحي يتكون ليلاً ويغطي النباتات والأرض.
    info: تتشكل الجليد السطحي عندما تنخفض درجة حرارة الأرض تحت الصفر وتتكристال الرطوبة الهوائية، مما ينتج عنه أنماطاً جميلة على الأوراق والنوافذ وسطح التربة. تختلف عن الثلج المتجمّل؛ حيث إن هذا النوع هو جليد مكثف من الرياح بينما الثاني هو ندى متجمد.
  weather.gloomy:
    label: غيم
    summary: مناخ غامض مع جو كئيب.
    info: الطقس الغائم يتميز بسحب متدلية داكنة، ضوء خافت وجوًا شديد البرودة أو المطر؛ غالبًا ما يُربط بالحزن والخريف. اضطراب التأثير الفصولي هو حالة تحدث بسبب نقص الشمس في الشتاء.
  weather.hailing:
    label: تساقط حبيبات الجليد
    summary: هطول أمطار جلدية؛ يمكن لحبيبات الكريوبوت gây ضرر للمحصول أو المركبة.
    info: تتكون كرات الثلج من قطرات ماء تمر مراراً وتكرراً عبر الأجزاء الباردة والساخنة في السحب الرعدية، ويمكن أن يصل قياسها إلى أكثر من 10 سم مما يسبب أضرارًا كبيرة للمحاصيل ومركبات السيارات والسقوف.
  weather.haze:
    label: ضباب دخاني
    summary: انخفاض الرؤية بسبب الغبار والدخون والتلوث.
    info: الضباب الدخاني هو انخفاض في الشفافية الجوية الناتج عن الغبار أو أدخنة أو جسيمات دقيقة معلقة، ويختلف عنه الضباب العادي الذي يتكون من قطرات الماء بينما يتكوّن ضباب الدخان من أكاسيد صلبة أو سائلة تطفو بالهواء. عادة ما تكون المدن الكبيرة آسياويًا معروضة على خطر التلوث الهجين المعروف باسم سموج وهو اتحاد بين غازات ودخوم الصناعات.
  weather.heat_lightning:
    label: اشواش حرارية
    summary: flashes بعيده بدون رعد سمعي.
    info: تُشير مصطلحات 'الlashes حرارية' إلى ashwaqash التي تحدث في عاصفة بعيدة، حيث لا يمكن سماع صوت الرعد بسبب البُعدين الكبيرة بينكما. الاسم مضلل؛ لأنه ليس نوعًا معينًا من Ashwaaq ينتج عن الحرارة. نحن فقط قادرون على سماع الأashes حتى بعد ١٦ كم أما البعيدة أكثر فهي هادئة.
  weather.heat_shimmer:
    label: ماريني
    summary: انحراف بصري للهواء فوق-surfaces سطح دافيء؛ وهما حيلة بصريّة.
    info: الماريني هو ظاهرة بصريّة تُنتج عن انكسار الضوء في الهواء الدافئ الصاعد، حيث أن الهواء الساخن فوق الأسفلت أو الصحاري يكون أقل كثافة؛ مما يؤدي إلى ثني أشعة الضوء وخلق مظاهر خداعية مثل البقع المائية على الطريق الحارة. كما يسبب 'فاتا مورغانا' نوعًا معقدًا من هذه الأوهام البصرية الناتجة عن الانقلاب الحراري.
  weather.heatwave:
    label: جفاف
    summary: فتره طويله جداً للحر فوق المعدل الطبيعي؛ خطراً صحياً
    info: |-
      موجة جفاف هي فترة طويلة من الحر الشديد تتجاوز درجات حرارة الموسم العادية
      كانت موجتا الجفاف في أوروبا عام ٢٠٠٣ قد سببت أكثر من ٧٠ ألف وفاة زائدة
      وهي خطر صحي خاصة على كبار السن والأطفال والمصابين بأمراض
  weather.hot:
    label: 炎热
    summary: 极端的热引起不适和健康风险。
    info: "{\"hint\":\"الحر الشديد؛ أشعة الشمس المتأججة\",\"info\":\"يُعد الحر الشديد ظاهرة جوية تتميز بدرجات حرارة مرتفعة بشكل ملحوظ عن المتوسط الفصلي.\r\nوعند اتحاده الرطوبة، يمكن أن يؤدي إلى التعرض للضربة الحرارية التي تمثل خطرًا على الحياة\r\nفي التشيك سجلت درجات الحرارة خلال موجات الحرا أكثر من ٣٨°م.\r\nكما يزيد الاحتباس الحراري العالمي من كثافة وشدّة هذه الأمواح.\"}"
  weather.humid:
    label: رطوبة
    summary: هو هواء مشبع ببخار مائى؛ شعور حراري مرتفع وجاف.
    info: |-
      تُقيس الرطوبة كمية البخار المائي في الهواء
      الرطوبية النسبية بنسبة ١٠٠% تعني اشباع الهواء، وعند تجاوز هذه الحدود يتكثف الماء
      ارتفاع الرطوبة يجعل الشعور بالحرارة أقوى لأن العرق لا يتعرّض للتبخر
  weather.hurricane:
    label: إعصار
    summary: إنها عاصفة استوائية كثيفة جداً بسرعة هواء فوق 74ميل لكل ساعة
    info: |-
      الإعصار هو إعصارة دافئة في المحيط الأطلسي والجزء الشرقي من المحيط الهادئ مع رياح تزيد عن 74 ميلًا بالساعة
      يُعرف أيضًا باسم الإعصار أو الدمار، اعتماداً على المنطقة الجغرافية مثل جنوب شرق آسيا والمحيط الهודי
      تحتوي طاقة الرياح العاتية فيه إلى ما يعادل عدة قنابل ذرية يوميا
  weather.ice_storm:
    label: عواصف جليدية
    summary: تساقط مطر متجمد يجعل كل شيء محاطًا بط층 رفيع واضح.
    info: تُحدث عاصفة الجليد عندما يسبب الهواء الدافئ فوق طبقة باردة أمطاراً تجمّع فور سقوطها، مما يؤدي إلى غمامة الأغصان والأسلاك وسط النقلة تحت طبقة واضحة من الثلج المتراكم. يمكن أن تتلف الشبكة الكهربائية بسبب وزن هذه الطبقة وتؤدي لانقطاعات في التيار.
  weather.icy:
    label: الجلاد
    summary: ثلغ خطر يسبب انزلاقات.
    info: يتشكل الجليد الناتج عن تجميد قطرات المطر أو ذوبان الثلج على الأسطح الباردة، وهو من أكثر الحالات الشتوية خطورة بالنسبة للنقل. سبب الانزلاق هو طبقة رقيقة من المياه السائلة الموجودة على سطحه.
  weather.lightning:
    label: برق
    summary: تفريغ إلكتروستاتيكي بين السحب والأرض أو بين السحب.
    info: |-
      البرق هو تفريغ كهربائي قوي يحدث عندما يصل فرق الشحنات في سحابة العواصف إلى قيمة حرجة
      سرعة البرق حوالي ثلثي سرعة الضوء
      تضرب الأرض مائة شوكة من البرق كل ثانية تقريبًا
  weather.misty:
    label: ضباب
    summary: رؤية منخفضة نظرًا للغيوم الخفيفة أو ضباب خفيف.
    info: يحدث الطقس الضبابي بسبب تكاثف بخار الماء في طبقة الهواء السطحية، ويختلف عن الضباب الكثيف بأن الرؤية محدودة ولكنها لا تنخفض تحت كيلومتر واحد. غالبًا ما يتشكل فوق الأنهار والبحيرات ووديان خلال الليالي الباردة.
  weather.monsoon:
    label: موَّزْن
    summary: تقلب الفصلي للرياح الذي يسبب فترة أمطار شديدة.
    info: يُعتبر الموظون ظاهرة مناخية تنتج عن عكس فصول الرياح بين المحيط والبراري، ويجلب موسم الأمطار الشديد إلى المناطق الاستوائية.
  weather.muggy:
    label: دفء
    summary: هو هواء حار ومليئ برطوبة جوية غير مرغوب فيها.
    info: الدفء هو تجميع درجات الحرارة المرتفعة والرطوبة النسبية العالية، حيث يمنع الهواء الرطب بخار عرق الجلد من التبخر وبالتالي لا يمكن للجسم أن يكون قادرًا على خفض حرارته بشكل فعال. مؤشر الحرارة يستخدم مزيجاً بين درجة الحرارة ودرجة الرطوبه لتحديد شعور الإنسان بالحر.
  weather.overcast:
    label: '"مغطي"'
    summary: '{"summary":"السماء كاملة الغطاء بغيوم رمادية دون وجود شمس مباشرة"}'
    info: '{"info":"تظهر السماء المغطاة بنسبة سبع أو ثماني من ثمانية أجزاء غيوم، حيث يكون الضوء متناثرًا وغير قادر على إنشاء ظلال. يلعب نقص الشمس دوراً محورياً في اضطراب الاكتئاب المرتبط بالفصول الجغرافي والموسمي المعتمد عليه مثل متلازمة القلق الفصلي (SAD). تُحاكي العلاجات النهارية ضوء الشمس وتخفّف الأعراض."}'
  weather.partly_cloudy:
    label: الجو شبه مشمس
    summary: سماء جزئياً متغمة بسحب؛ انتقال الشمس والظل.
    info: يُعد نصف الجليد حالة جوية مع غطاء سحابي يتراوح بين ثلث ونصف الغلاف السماوي، ويصنف كواحد من أكثر أنواع الأحوال المناخية متعة للأنشطة الخارجية. يحتوي على تشكيلات ضبابية مثل الضباب الكومولوس التي تتكون في أجزاء النهار الأكثر دفئاً؛ حيث يقوم المترولوجيون بملاحظة التغطيّة السَّحابة بالوحدات أوكتالية (أوكتا واحدة تعادل الثمن من السماء المتغيرة)
  weather.rainbow:
    label: قوس قزح
    summary: قوس ملون في السماء بعد المطر عندما يشرق الشمس.
    info: يظهر القوس القزح بسبب انكسار وانعكاس ضوء الشمس في قطرات المطر. ويحتوي على سبع ألوان وهي الحمراء، البرتقالية، الصفراء، الزرقاء، البنفسطية، وال بنفسجية.
  weather.rainy:
    label: مطر
    summary: تنزّل قطرات ماء من السحب كمطر.
    info: يتشكل المطر عن طريق تكثف بخار الماء في السحب. وهو ضروري لملء الأنهار والبحيرات ومخازن المياه الصالحة للشرب؛ يتساقط المطر عادةً بسرعة 9 أمتار بالثانية.
  weather.sandstorm:
    label: عاصفة رملية
    summary: جدار كبير يتكون من غبار ورمال ناتج عن سرعان عالية في المناطق الصحراوية.
    info: تتشكل عاصفة رملية عندما ترفع الرياح القوية كميات هائلة من الغبار والرمال، وعادة ما تكون مصحوبة بجدار ضخم يتحرك معها. 'هابووب' هو نوع خاص من العواصف الرملية التي تصيب السافل والأراضي العربية. يمكن لهذه العاصوف أن تمطر القرى وتسبب مشاكل تنفسية للسكان.
  weather.shower:
    label: رعدية
    summary: مطر سريع وكثيف ناتج عن سُحوبَتِنٍ راكمة.
    info: '{"hint":"مطر قصير لكنه أحيانًا شديد","info":"الرعدية هي هطول مطري كثيف من سحابة تراكمية أو ركامية عاصفة، وتحدث فجأة وتنتهي خلال دقائق إلى ساعات وهي متكررة في الصيف حيث يؤدي التسخين الشمسي إلى الحركة الدوارة والتكوين السحب الركامية العواصف بعد الظهر وقد يصاحبها ظهر القوس الملون."}'
  weather.sleet:
    label: مطر متجمّد
    summary: خليط بين الأمطار والثلج؛ حبيبات ثلوج ذائبة جزئيا.
    info: يتشكل المطر المتجمد عندما تمر بلورات الثلج عبر طبقة من الهواء الدافئ وتذوب جزئياً، مما يغطي الأسطح بطبقة رقيقة من الجليد أو ما يعرف بالصقيع. وهو خطير على السفر.
  weather.slush:
    label: ثلج مذاب
    summary: خليط من ثلوج نصف مصابة بالذوبان مع المياه؛ طبقة زلة غير مرغوبة خلال فصل الشتاء.
    info: يتشكل الثلج المذاب جزئياً عندما ترتفع درجة الحرارة قليلاً فوق نقطة التجمد، مما يؤدي إلى ذوبانه وتشكيل خليط مائي على الأرضية. إنه سلس جداً ويعد خطراً كبيراً للسائقين والمشاة. كما أنه يسبب انزلق الإطارات وتقليل الالتصاق بها عند وجود رشح في الطريق.
  weather.snowy:
    label: تساقط الثلج
    summary: تُساقِط السحب بللَ ثلجيًا أبيض.
    info: ينتج عن تجمّد قطرات الماء في الغيوم إلى بلورات جليدية على شكل وردات ثلجية. كل قطعة من هذه الوردات لها شكل متناظر فريد.
  weather.stormy:
    label: عاصفة
    summary: طقس درامي مع برق ورعد وأمطار غزيرة.
    info: تتشكل العواصف في سحب كومولونيمبوية عالية. البرق هو تفريغ كهربائي؛ والرعد هو صوت ناتج عن تسخين سريع للهواء المحيط بالبرق.
  weather.sunny:
    label: مشمس
    summary: سماء صافية مع شمس مشرقة، بدون سحب.
    info: يحدث الطقس المشمس عندما لا تعيق السحب الإشعاع الشمسي. توفر الشمس الضوء والحرارة الضروريان للحياة على الأرض.
  weather.sunrise:
    label: السطوت
    summary: لحظة ارتقاء شمس النهار فوق الحافة.
    info: يحدث السطوع عندما يرتفع قرص الشمس فوق الأفق، ولونه البرتقالي أو الوردي ناتج عن تشتت رايلي للضوء. في المناطق القطبية يحدث هذا خلال موسم معين مثل اليوم والليل القطبيان. وميض اللون الأخضر هو ظاهرة بصريّة نادرة يمكن مشاهدتها أثناء السطوة بشرط أن تكون الجو واضحًا.
  weather.sunset:
    label: غروب الشمس
    summary: لحظة اختفاء الشمس خلف الحدود عند نهاية اليوم.
    info: غروب الشمس هو لحظة تختفي فيها الشمس تحت الأفق بسبب دوران الأرض، وتنتج عنها لوحة ألوان مميزة مثل البرتقالي والأحمر البنفسجي نتيجة انتشار ضوء الشمس في الغلاف الجوي. يُعتبر غروب الشمس الأكثر جمالاً بعد الانفجارات الفعّالة التي تسهم بزيادة كثافة اللون من خلال زيادة الرماد والجزيئات الدقيقة داخل الجو.
  weather.thunderstorm:
    label: عاصفة
    summary: ظاهرة أرصادية قوية مع برق وصواعق وهطول أمطار وزوابع.
    info: تتشكل العواصف في السحب الركوية الضخمة التي تصل ارتفاعها إلى أكثر من كيلومتر واحد، وهي عبارة عن خلل كهروستاتيكي؛ حيث يسخن البرق الهواء ليصبح درجة حرارته نحو ثلاثين ألفاً مئويّة خلال جزء صغير جداً من الثانية. الصوت الناجم هو نتيجة انفجار سريع للهواء المُحْمر.
  weather.tornado:
    label: تورنادو
    summary: هو هبوب دمار هوائي دوراني يتراوح بين السحب والأرض.
    info: تُشكّل الأعاصير الرعدية عمودًا سريع الدوران من الهواء يلامس سطح الأرض، ويمكن أن تصل скорости الرياح إلى أكثر من ٥٠٠ كيلومتر في الساعة. غالبًا ما يحدث ذلك في منطقة 'alley' التورنادو بالولايات المتحدة الأمريكية مثل ولايتي كانساس وأوكلاهوما وتكاس. كما يوجد أيضًا أعاصير رعدية بسيطة في جمهورية التشيك على الرغم ندرتها؛ ففي صيف عام ٢٠٢١ ضرب عاصفة قوية جنوب موروافيا.
  weather.typhoon:
    label: тай фун
    summary: إعصارة استوائي يحمل رياحًا أسرع من ١٢٠ كم / ساعة ويوجد جنوب غرب المحيط الهادئ.
    info: تاي فون هو اسم للعاصفة المدارية في الفلبين والصين و اليابان ومنطقة محيطة بها، تُضرب الفلبين بـ ٢٠ عواصف من هذا النوع سنوياً على المتوسط. سببت العاصفة نينا عام ١٩٧٥ سيولاً كبيرة بالصين أدّت إلى أكثر من ٢٢٩ ألف قتيلا.
  weather.waterspout:
    label: دورة بحرية
    summary: هو عمود دوراني للمياه المتصلة بالبحر أو البركة مع الغيمة.
    info: تُشكِّل عاصفة مائية دوَارًا هوائيًّا فوق سطح الماء، وتسمى هذه الظاهرة 'الدودة البحرية'. قد تتشكل الدودات من العواصف الرعدية القوية أو السحب الكومولونيمبوس الأقل قوة في الطقس الجيد. يمكن لهذه الدوران أن يجذب الأسماك والحيوانات الأخرى ويرفعها إلى اليابسة.
  weather.whiteout:
    label: الظلام الأبيض
    summary: حالة طقس شديد البرودة ناجمة عن العواصف القطبيّة التي يؤدي فيها التأثير البصري للتغطيـَة الثلجيّة إلى انعدام كل المعايير المرئيّة.
    info: تظهر ظاهرة البياض عندما تسبب عاصفة ثلجية وانعكاسات الثلوج في اندماج السماء والأرض لتشكل حقلًا أبيض واحدًا، مما يوفر رؤيّة صفرية وتوجه خاطئ. إنها خطيرة للغاية بيئة قطبية أو جبلية حيث يمكن أن تتعرض الطيارون للإرباك أثناء الظاهرة وي فقدان مرجعيتهم الأفقية.
  weather.windy:
    label: رعدية
    summary: حركة هواء قوية تُقوس الأشجار وتنقل أوراقها.
    info: تنتج الرياح من تسخين سطح الأرض بشكل غير متساوٍ، مما يسبب حركة الهواء من المناطق ذات الضغط العالي إلى تلك ذات الضغط المنخفض.
