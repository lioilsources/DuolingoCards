lang: ko
pivot: false
title: 날씨
cards:
  weather.aurora:
    label: 북극빛
    summary: 태양 바람이 자기층을 통해 일으키는 자연적인 빛현상이다.
    info: 북극광(오로라 보레알리스는 북쪽에서 나타나고 오로라 아우스트랄리는 남쪽에 발생함), 이 현상은 태양의 전하 입자와 대기권이 상호작용할 때 생긴다. 녹색과 자주색 그리고 붉은 색으로 된 커튼이나 나선형 형태를 만든다. 극지방 지역(Norway, Iceland, Canada 및 Antarctica 등)에서는 가장 잘 볼 수 있다. 원주민들은 이를 조상을 추모하는 축제처럼 움직이는 영혼이라고 여겼었다.
  weather.avalanche:
    label: avalanche
    summary: 산 언덕에서 굴러내리는 대량의 얼음과 눈.
    info: |-
      아발란체는 산 경사면에서 빠르게 움직이는 눈 덩어리입니다.
      가장 위험한 것은 시속 300km 이상으로 이동하는 가루눈 아вал란체이며,
      알프스 지역에서는 연간 평균적으로 약 150명이 목숨을 잃습니다.
      설상지대에선 비퍼(아 вал란체 탐색기의 신호음) 장비 사용은 의무적입니다.
  weather.blizzard:
    label: 눈보라
    summary: 강풍과 짙게 퍼지는 눈 그리고 균일하게 맑지 않은 조건을 특징으로 하는 격렬한 눈폭우.
    info: 눈보라란 강한 바람과 함께 많은 눈이 내리는 현상으로 거의 시야가 차단되는 상태를 동반한다. 이로 인해 '화이트아웃' 효과와 높은 쌓인 눈을 유발할 수 있다. 역사적으로도 눈보라는 천 명 이상의 사망자를 낸 적이 있으며, 미국에서는 19세기 말에 발생했던 대형 눈보라도 네바다 주에서 기록적인 폭설량을 남겼고, 특히 뉴욕 지역에는 약 한 미터 반(약 51英寸) 가까운 눈이 쏟아졌다.
  weather.breezy:
    label: 미풍
    summary: 따뜻한 날씨를 더 산뜻하게 만들어주는 기분 좋은 바람.
    info: 바람이 살짝 불 때는 시속 약 6~11m의 속도로 부는 Beaufort 척도 상 등급 3 또는 4에 해당하는 미풍입니다. 잎과 머리카락 그리고 가벼운 물체들이 흔들리는 정도이며, 땀 증발을 통해 열감각을 생리적으로 줄여줍니다.
  weather.clear:
    label: 맑음
    summary: 하늘이 완전하게 깔끔하고 단 하나라도 흐린구름 없이 보임
    info: 맑음은 구름이 하늘의 1/8 미만으로 덮이는 기상 조건입니다. 이 상태에서는 가장 강한 태양 복사가 이루어지고 철저히 우주 관측에 적합합니다. 밤에는 맑을 때 열복사는 더 세고 온도는 빠르게 내려갑니다.
  weather.cloudy:
    label: 구름 많음
    summary: 하늘 전체가 짙은 구름으로 덮여 있고, 직사광선이 없습니다.
    info: 구름은 수증기나 얼음 결정의 작은 입자들이 모여 보이는 덩어리입니다. 지구의 하늘 중 약 60%는 항상 구름에 의해 가려져 있습니다.
  weather.cold:
    label: 겨울
    summary: 녹음 이상으로 매우 낮아지는 온도를 동반하는 심각한 한파.
    info: 극한의 추위(빙설 현상이 발생함)는 북쪽 극지방에서 온 공기가 중간 위도 지역으로 침입할 때 생깁니다. 지구 상 가장 낮은 기록된 자연온도는 남극 보스토크 연구소에서 측정되어 –89.2°C입니다. 신체가 춥다고 느끼면 혈관 수축과 떠들림을 유발합니다. 체온이 섭씨 35도 이하로 내려갈 경우 저혈당증에 걸릴 수 있습니다.
  weather.dew:
    label: 로사
    summary: 추운 밀착 지표상에서 발생하는 미세수방울
    info: |-
      로사는 고요한 밤 동안 공기에서 표면에 응결된 물입니다.
      표면이 이슬점 아래까지 식으면 형성됩니다.
      건조 지역의 생물들에게 중요한 수분 원천이며,
      아타카마 사막에서는 목동들이 아침露를 체인으로 받아 마십니다.
  weather.drizzle:
    label: 미스트
    summary: 매우 작고 부드러운 빗방울 형태로 내리는 약한 비.
    info: 미스텔레는 직경이 0.5mm 미만인 매우 작은 방울로 이루어진 강수이다. 대류성 쿠멜론imbus에서 발생하지 않고 낮은 전층운(stratiform cloud)으로부터 생긴다. 주로 해양 기후 지역(영국과 프랑스 북서부)에 특징적이다. 그의 가느달음에도 불구하고 풍요롭게 축축해질 수 있다.
  weather.drought:
    label: 가뭄
    summary: 장기간 비 내림 없음으로 인해 발생하는 물 부족 현상
    info: 가뭄은 오랫동안 강수가 부족한 기상 상황입니다. 작물 수확량 감소와 물 부족 및 화재를 유발합니다. 체코에서는 2015년에서 2020년까지의 가뭄이 지난 500년 동안 가장 심했습니다. 전 지구적 온난화는 세계 여러 지역에 있는 가뭄을 악화시키고 있습니다.
  weather.dust_storm:
    label: 황사
    summary: 강풍과 함께 말린 지방 위를 휘몰아치는 벽처럼 생긴먼지는.
    info: 황사 현상은 강한 바람이 건조 지역의 미세 입자를 공기 중으로 들어올릴 때 발생합니다. 사하라 아프리카에서는 이 먼지를 'harmaatan'이라고 부르며 정기적으로 대서양을 가로질러 미국에 도달하며 연구들은 아마존 우림에도 영향을 주는 것으로 나타났습니다. 특히 20 세기에 미국에서 일어난 황폐화 사건(Dust Bowl)은 서부 중심지역 에코시스템에 큰 재앙을 초래했습니다.
  weather.flood:
    label: 홍수
    summary: 물길에서 물이 넘쳐나서 보통 건조했던 지역으로 흘러 들어오는 현상.
    info: 홍수는 과도한 강우량이나 눈이 녹거나 댐의 붕괴로 인해 발생합니다. 홍수는 전 세계적으로 가장 비용 많이 드는 자연 재앙입니다. 체코에서는 1997년과 2002년에 일어난 홍수가 수십억 유럽화를 송두리째 파손시키고 수많은 사망자를 낳았습니다. 생태적인 방재 조치(습지와 숲 등)가 위험을 줄이는 데 도움됩니다.
  weather.foggy:
    label: 안개
    summary: 짙은 지면 안개로 인해 시야가 제한된다.
    info: 안개는 지표면 수준에서 형성된 물방울로 구성된 구름입니다. 습도가 높을 때 발생하며, 가시 거리를 1km 미만으로 줄입니다.
  weather.freezing:
    label: 냉각
    summary: 영점 아래온도로 인한 수분 동결
    info: -42°C 이하의 영하 온도에서 물이 얼어붙는 현상입니다.
  weather.frost_flowers:
    label: 얼음 꽃
    summary: 추운 곳에 생기는 아름답고 독특한 얼음 결정.
    info: 꽃 무늬와 같은 얼음 결정이 매우 추운 표면에서 형성된다. 이 현상은 극지방 해역에서도 볼 수 있으며 정교한 형태의 냉각된 결정 구조를 만든다.
  weather.frosty:
    label: 아침 서릿불
    summary: 지표면의 서릿불; 아이스 크라이스트럴들이 심장들을 덮습니다.
    info: 결빙 현상은 지표면 온도가 동점 이하로 떨어지고 공기 중 습기가 결정화될 때 발생합니다. 잎과 유리 표면 및 흙에 아름다운 무늬를 만듭니다. 결빙현상을 얼음이 아닌 서릿발(한국식 표현)와 구분할 수 있습니다. 한글에서는 '서릿방'으로 번역되며, 서릿불은 응축된 안개입니다.
  weather.gloomy:
    label: 흐림
    summary: 우울하고 짙게 맑지 않은 하늘 상태.
    info: 흐린 날씨는 어두운 저기압 구름과 희미한 빛 그리고 추위나 비가 오는 대기를 특징으로 합니다. 이와 관련되어 멜랑콜리아(melancholia), 가을에 연관됩니다. SAD(계절성 우울 장애)란 겨울철의 태양 부족 때문에 생기는 질병입니다. 고딕 문학 및 음악은 이러한 헤비한 기상 조건에서 영감을 얻습니다.
  weather.hailing:
    label: hojsl
    summary: 얼음 알갱이 형태의 강수; 벼락알은 농작물과 차량을 파손시킬 수 있음
    info: 호이슬 폭우는 천둥번개 구름에서 생성된 얼음 알갱이(벼락알)로 이루어진 강수이다. 벼락알은 물방울들이 차가운 층과 따뜻한 층 사이를 반복적으로 지나면서 생긴다. 이들은 직경으로 최대 약 10cm까지 자라서 작물이나 차량 및 옥상에 심각한 손상을 줄 수 있다. 기록 상 가장 큰 크기의 호이슬 알맹이는 20cm 이상인 경우도 있었다.
  weather.haze:
    label: 안개
    summary: 미세 먼지, 연기 또는 공기에 의한 시야 저하.
    info: 안개는 미세먼지나 연기 또는 에어로졸 입자에 의해 대기를 투과하는 능력이 감소한 상태입니다. 안개와 구름은 다릅니다; 구름은 물방울로 이루어져 있고, 안개는 고체 혹은 액적 형태의 에어로솔을 포함합니다. 아시아 주요 도시간에는 스모그(공해 현상으로 인한 안개 및 산업 오염물질 혼합현상)가 자주 발생하며 건강 문제를 유발할 수 있습니다.
  weather.heat_lightning:
    label: ' Тепловые молнии'
    summary: 청음 가능한 우박 없이 원거리에서 관찰되는 번개.
    info: 열번개는 멀리 떨어진 폭풍우에서 보이는 번갯불이며, 거리를 감안할 때 천둥 소리는 들을 수 없다. 이름이 혼동을 일으킬 수 있는데 특별히 열로 인한 특정 유형의 번개를 의미하지 않는다. 우리는 최대 약 10마일(약 16km) 이내에 발생하는 번개만 듣고 그보다 더 먼 곳에서는 조용하다. 맑은 여름 밤 하늘에는 지평선 너머에서도 볼 수 있는 자연 현상으로 간주된다.
  weather.heat_shimmer:
    label: 미러리
    summary: 더운 표면 위공기에서 생긴 시각적인 외관변화
    info: 마레니(mirage)는 열기로 인해 상승하는 공기에 의해 빛이 굴절되어 발생하는 광학적 현상입니다. 아스팔트나 사막 위의 더운 공기는 밀도가 낮아지며, 이에 따라 빛은 휘게 됩니다. 이러한 효과 덕분으로 우리는 무언가 물웅덩이는 것처럼 보일 수 있습니다(Fata Morgana).
  weather.heatwave:
    label: heatwave
    summary: 평균보다 훨씬 따뜻하고 건강 문제를 일으킬 수 있는 장기간의 고온.
    info: 더위의 물결은 정상적인 계절 온도를 초과하는 극심한 더움이 지속되는 현상을 말한다. 유럽에서 발생했던 2003년 대형 더위는 약 7만 명 이상의 과열로 인해 사망하게 되었으며 특히 노인층이나 어린아이들 및 질병을 가진 사람들에게 위험하다고 알려져 있다. 기후 변화에 따른 전반적 높아지는 평균기온으로 이러한 열대가 더욱 오래지나오며 강력히 나타난다.
  weather.hot:
    label: 무더위
    summary: 불편함과 건강 문제로 인해 걱정되는 심각한 과열 상태
    info: 극한의 더위는 계절 평균보다 훨씬 높은 온도를 동반하는 기상 현입니다. 습기와 함께 있을 경우 생명을 위협할 수 있는 열사병(중暑)으로 이어질 수 있습니다. 체코에서는 무더운 날씨에 최고온이 섭氏 38°C 이상까지 오르기도 합니다. 지구 올림픽현상을 통해 극심한 고온날씨가 더욱 자주 발생하고 있으며 그 강도 또한 증대되고 있습니다.
  weather.humid:
    label: 습도
    summary: 수증기를 많이 함유하고 있는 공기로 인해 덥고 답답하게 느껴집니다.
    info: |-
      습도는 공기 중 수증기의 양을 측정합니다.
      상대 습도가 100%이면 공기가 포화 상태이며 이 값을 넘으면 물이 응축됩니다.
      높은 습기는 땀이 증발하지 않아 더위를 더욱 느끼게 합니다.
      열대 지방에서는 연중 고온 다습한 환경이고 우리 지역에서도 여름철에 가장 습기가 많습니다.
  weather.hurricane:
    label: 허 리 케 언
    summary: 강렬한 열대 성층 운동체로 시속 120킬로미터 초과의 바람을 가진다.
    info: 태풍은 대서양과 태평양 서부에서 발생하며 시속 120km 이상의 바람을 동반하는 열대성 폭우이다. 인도양에서는 사이클론으로 불린다. 하루에 수십 개 원자폭탄 분량의 에너지를 방출한다. 가장 강력한 허리케인은 제5등급이며 최고시속이 약 250km를 넘는 경우가 있다.
  weather.ice_storm:
    label: 얼린 바람
    summary: 물체들을 반투명하거나 완벽히 보이는 상태의 얇은 아이슬레이어로 감싸주는 형광 효과.
    info: 눈이 오지 않고 빗방울 형태로 내리는 강수 현상인 얼음비는 따뜻한 공기가 차가운 지표면 위를 덮을 때 발생합니다. 이 과정에서 비가 즉시 동결되어 나무 가지와 전선 그리고 도로 표면에 두꺼우면서 투명한 물길라틴층으로 쌓입니다. 특히나 이런 상황은 에너지를 소모하는 부담스러움과 함께 대규모 정전 사태도 유발할 수 있습니다.
  weather.icy:
    label: 빙판
    summary: 표면을 덮는 희미하게 반짝이는 아이스가 만들어내는 매우 위험하고 미끄럽게 만드는 현상
    info: |-
      빙판은 추운 표면 위의 비나 눈이 얼거나 녹아 생깁니다。
      이는 교통에 가장 위험한 겨울 상황 중 하나입니다。
      얼음 미끄러짐 원인은 그 표면 위 얇고 액체 상태 물 층 때문이며,
      소금이나 모래로 뿌리는 방법으로 미끄럼 방지 효과를 줄일 수 있습니다.
  weather.lightning:
    label: 번개
    summary: 구름과 흙 사이 또는 두 구름 간 일어나는 정적방전.
    info: 번개는 폭풍우 구름 안에서 전하 차이가 임계값에 도달할 때 발생하는 강력한 방전 현상입니다. 번갯불의 속도는 빛의 약 세 분之一이며 지구에서는 초당 대략 백 개 정도의 번개가 내립니다. 천둥을 막기 위해 프랭클린(1752년)은 과학적으로 설계된 최초 보호 장치를 만들었습니다.
  weather.misty:
    label: 薄雾
    summary: 얇거나 약간 끌어 모여 있는 구름 또는 안개 때문에 시력 감각이 줄어든 상태
    info: 안개 낀 하늘은 지표면 공기층에서 수증기가 응축되어 생긴다. 짧고 가벼운 안개와 달리 시야는 제한되지만 최소 한 킬로미터 이상 보인다는 점이 다르며 주로 강가나 저수지 근처 그리고 추운 밤의 계곡 위에 자주 형성된다.
  weather.monsoon:
    label: 모onsoon
    summary: 계절적 바람 전환으로 열대 지방에 집중 호우기를 가져오는 자연현상
    info: 몬수는 해양과 대륙 사이의 계절별 바람 방향 변화로 인한 기후 현상입니다. 이슬라마바드와 파키스탄 지역에서 매년 여름철인 6월부터 9월까지 약 70~90%에 달하는 연간 강우량을 제공합니다. 수천만 명이 농업 활동에 몰수가 의존하고 있으며, 만약 예측보다 미약하게 나타나면 가뭄으로 고통받고, 너무 세게 오르면 홍수 피해를 입습니다.
  weather.muggy:
    label: душ
    summary: 불쾌감을 주며 숙박된 공기로 인해 답답함을 유발하는 따뜻하고 젖기가 많은 상태
    info: 더위는 고온과 높은 상대 습도의 조합입니다. 높은 수분 함량으로 인해 몸에서 발한이 증발하지 못하여 체내가 효과적으로 심장되지 않습니다. 열 지수(Heat Index)는 온도와 습기를 결합시켜 실제 느끼게 되는 기후를 표현합니다.
  weather.overcast:
    label: 흐린 날
    summary: 하늘 전체가 회색 구름에 의해 덮여 있고 직사광 없음.
    info: 구름이 대부분 차오르면(7분의 6~전부), 빛은 확산되어 그림자를 만들지 않는다. 지리적으로 영향을 받는 우울 장애(SAD)에서는 태양 부족이 주요한 역할을 하며 광선 요법으로 햇빛 효과를 시뮬레이션하여 도움을 준다.
  weather.partly_cloudy:
    label: half-clear
    summary: 하늘이 부분적으로 구름으로 덮여 있어 태양과 그림자가 번갈아 나타납니다.
    info: 반명절(polojasno)은 구름량이 전체 하늘의 약 4분의 1에서 절반이 되는 기상 상황입니다. 이 날씨 유형은 실외 활동에 매우 편안한 것으로 알려져 있습니다. 주로 아침보다 더 따뜻할 때 형성되는 쿤누스(cloudus) 형태의 뭉친구름을 포함합니다.
  weather.rainbow:
    label: 무지개
    summary: 비가 오고 태양이 떨어질 때 하늘에 나타나는 아름다운 곡선 모양의 무늬입니다.
    info: 무지는 비 방울 속에서 태양빛이 굴절되고 반사되어 만들어집니다. 무지개에는 붉은색, 주황색, 노란색, 초록색, 파랑색, 청자색, 보라색 등 일곱 가지 색이 포함됩니다.
  weather.rainy:
    label: 비
    summary: 구름에서 물방울 형태로 비가 내린다.
    info: 비는 구름 속의 수증기가 응결되어 생긴다. 강과 호수를 채우고 마실 수 있는 물을 공급하는 데 필수적인 역할을 한다. 평균적으로 비는 초속 9미터의 속도로 지면에 도달한다.
  weather.sandstorm:
    label: 사구폭풍
    summary: 강력한 바람에 의해 흘러가는 모래벽은 주요 지표다.
    info: 사막의 강한 바람이 엄청난 양의 먼지와 모래를 들어 올려 발생하는 것이 사구 폭풍이다. 하부는 특별히 사헬 지역과 아랍 반도에서 나타나는 특정 유형이며 마을 전체가 매몰되고 호흡기 문제로 이어질 수 있다.
  weather.shower:
    label: '"rain shower"'
    summary: 대류성 구름으로부터의 짧은 집중 호우
    info: "{\"hint\":\"짧지만 때때로 강한 비\",\r\n\"info\":\"우천은 대류성 구름(층적구름 또는 층상낙뢰운)에서 일어나는 짧고 집중적인 강수이다.\",\r\n\r\n\"이러한 현像是 빠르게 시작되어 분이나 시간 안에 사라진다.\",\r\n\"\")"
  weather.sleet:
    label: 동결비
    summary: 비와 눈의 혼합물이며, 부분적으로 녹아버린 눈 결정이다.
    info: 동결 비는 눈송이가 따뜻한 공기층을 통과하면서 부분적으로 녹아서 생긴다. 표면에 얇은 얼음 층(빙설)로 덮인다. 교통에는 위험하다.
  weather.slush:
    label: 로즈브레드리 스니흐
    summary: 부분적으로 녹아 물과 혼합된 상태인 슬러시 형태의 겨울 표층.
    info: |-
      녹아내린 눈(눈물탕)은 섭씨 영상으로 온도가 약간 상승하여 눈이 녹기 시작할 때 생긴다.
      이는 보행자와 운전자 모두에게 미끄럽고 위험하다.
      길에서는 수면현상을 유발하고 타이어의 접지력을 감소시킨다.
      보통 염화나트륨이나 모래를 뿌려 주차력 향상을 위해 사용된다.
  weather.snowy:
    label: 눈
    summary: 구름에서 흰 눈송이가 떨어진다.
    info: 눈은 구름 속의 물방울이 얼음 결정인 눈송이로 동결될 때 생긴다. 각각의 눈송이는 고유한 대칭적인 형태를 가지고 있다.
  weather.stormy:
    label: 폭풍우
    summary: 번개와 천둥, 강한 비가 동반되는 극적인 날씨입니다.
    info: 폭풍우는 고층의 쿤누보운에서 발생합니다. 번개는 전기 방전 현상이며, 천둥은 번개 주변 공기가 급격히 가열되어 생기는 소리입니다.
  weather.sunny:
    label: 맑음
    summary: 하늘에 구름이 없고 뜨거운 햇빛이 비추는 날씨.
    info: 태양광선을 가리지 않는 구름이 없는 상태에서 맑은 날씨가 발생합니다. 태양은 지구 생명체에게 꼭 필요한 빛과 열을 제공합니다.
  weather.sunrise:
    label: sunrise
    summary: 태양이 새벽 시간대에 수직면 상단에서 보이는 첫 번째 모습
    info: 아침에 지평선 위로 태양이 떠오르는 순간을 아스트로서티즘의 시점으로 정한다. 이때 나타나는 오렌지색이나 분홍빛은 라일레 경사 산란 현상 때문이다. 극 지역에서는 특정 계절(극야와 밤) 동안 일어난다.
  weather.sunset:
    label: 태양 저림
    summary: 하루 종일 후 태양이 지구 표면 밑에서 멈추어 버리는 시점
    info: |-
      해지는 것은 하루의 끝에 태양이 지평선 아래로 사라지게 되는 순간입니다.
      oranże색과 붉은 색 그리고 보라색 같은 다양한 톤들은 태양빛 산란 현상으로 인한 것입니다.
      화산 폭발 이후 대기 중 먼지를 통해 강조된 샘들의 아름다움을 볼 수 있는 해질무렵도 있습니다.
  weather.thunderstorm:
    label: 폭풍
    summary: 번쩍거림과 우박 그리고 바람을 동반하며 강력하게 나타나는 대규모 지구 물리현상.
    info: 천둥이 나는 폭우는 쿠مول니imbus라는 높이는 수만 미터에 달하는 거대한 구름에서 발생한다. 번개 방전은 정적 전하의 간섭이며, 이로 인해 공기가 일초 안에 섭씨 온도 기준 최고 5436°F(약 3000°C)까지 가열된다. 천둥 소리는 이러한 과정으로 열린 공기의 급격한 팽창 현상이다.
  weather.tornado:
    label: ' тор나도'
    summary: 구름부터 지상까지 이어지는 파괴적인 회전 공기 열
    info: 태풍은 폭우에서 발생하여 지표면과 접촉하는 빠르게 회전하는 공기둥입니다. 바람 속도는 시속 500km를 초과할 수 있습니다. 미국의 톤네이도 알리(Tornado Alley) 지역(캔자스주, 오클라호마주,텍사스 주 등)에서는 가장 자주 관측됩니다. 체코에는 태풍이 있지만 드물며, 특히 2021년 여름에 남부 모라도바 지역을 강력하게 덮쳤습니다.
  weather.typhoon:
    label: 타임푼
    summary: 북서쪽 태평양 지역에서 시속 120km 초과 강바람을 동반하며 일으키는 열대성 사이클론.
    info: 태풍은 필리핀, 중국 및 일본에서 사용하는 허 리케인의 이름입니다. 평균적으로 매년 약 20개의 태풍이 필리핀을 덮칩니다. 1975년에 발생한 태풍 린다는 중국 내 홍수로 인해 생명 손실 수백 명 이상을 기록했습니다. 이 단어는 아마도 큰 바람이라는 의미를 지닌 중문 '대봉'으로부터 유래되었습니다.
  weather.waterspout:
    label: 물스파우트
    summary: 바다는 아니거나 호수를 구름과 연결시키며 회전하는 물의 기둥입니다.
    info: 물 위에 있는 회전하는 공기둥인 물스파우트는 폭풍에서 형성되는 강력한 토네이도나 쿤룰로니imbus(적층운)로부터 발생할 수 있습니다. 이 현상은 어류나 다른 동물을 빨아들여 육지까지 운반시킬 수도 있으며 아드리아해와 플로리다 주변에서는 상대적으로 자주 관측됩니다.
  weather.whiteout:
    label: 흰빛
    summary: 눈보라 동안 눈 때문에 모든 대비를 잃는 북극 지방 날씨 상태
    info: 화이트아웃은 폭설과 눈의 반사로 인해 하늘과 땅이 하나의 흰색 공간으로 합쳐지는 현상입니다. 이 상태에서는 시야가 완전히 막혀 방향 감각을 잃게 되며 극지나 고산 지역에서 치명적인 위험 요소가 됩니다. 항공기 조종사는 화이트아웃 상황 속에서 수평선에 대한 기준점을 잃고 혼란스러워질 수도 있습니다.
  weather.windy:
    label: 바람이 많이 불다
    summary: 강한 바람은 나무를 휘게 하고 잎을 날려 보낸다.
    info: 바람은 지표면의 온도 차로 인해 발생하며, 이는 고기압 지역에서 저기압 지역으로 공기가 움직이는 현상을 일으킨다.
