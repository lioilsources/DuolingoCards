lang: ur
pivot: false
title: ماوسم
cards:
  weather.aurora:
    label: قطبی روشنی
    summary: ایک قسم کی ذاتی روشنی کا معروضی نظام ہے جو سوراخی ہوا کے تحت متاثر ہوتا ہے۔
    info: قطبی روشنیاں (شمال میں آورورا بوروالس اور جنوب میں آورورا اواسٹرلئسس)، سوائے کہ وہ نجوماتی ذرات توانائی فراہم کرتے ہیں، انفرادی طور پر رنگین لکیریں ظاہر ہوتی ہیں۔ چونکہ شمالی علاقوں میں دیدہ بلندی حاصل ہوسکتی ہے تو یہ مناظر خاص طور پر قطبی خطوط مثلاً ناروے، آئسلینڈ، کیندا اور براعظم زردان کے مقامات پر واضح ہوجاتے ہیں۔ قدامت پسندر لوگوں کے اعتقاد کے مطابق یہ ماوراء الاطلاق وجودوں کے حرکتوں کا باعث بن جاتے ہیں۔
  weather.avalanche:
    label: لاونا
    summary: ایک ہِلّہ اَتّہ ذروتوں توں نیچے اک جھݩک لگاندی ا 
    info: لیونا اک سرعت وار موومنٹ آف سنہ د‏‏ی مقدار اُتے پہاڑ توں نیچے اک جھݨک لگاندی ا‍ء۔ برف کمپن تقریباً ٣٠٠ کلوميٗٹر فیر حسین رفتار والی لیوانز قاتل ہندی نيں، جو عام طور اُتے الپس وچ سالويٗ ١۵٠ لوک موت دا شکار ہوجاندے نيں۔ لیوا اندازن د‪‘’‬ زبردستی استعمال کيتا جاندا ا‍ء تے اسيں ضلع لاولنا وچ اجنبىٔ برآمد ہوسکدن۔
  weather.blizzard:
    label: برست
    summary: زور شدہ بَرست جو غلظت والی برف اور ہوا کے ساتھ قرب صفر دشت توں روشنائی کا حوالہ دیتا
    info: بُرست برف ایک تیز رفتار موسم کا واقعہ ہے جو زوردار سفید پنیراور طوفانی ہوا شامل ہوتی ۔ یہ قریباً صفر دشت توں روشنائی اور بلند بر فبارشات کا باعث بن جاتا ہے۔ در حقیقت، آثار بتاتے ہیں کہ ماضی میں برسوں لاٹھ لوگ مرچکے ہیں۔ انڈس کے علاقوں میں ۱۸۹ء کی بَرست نے نِوٗ لاءرک میتبر ف کے ذخائر کو ۳۰ سینٹیمیتر تک بڑھادیا
  weather.breezy:
    label: وئترنک
    summary: ایک خوشگوار معتدل موسم درجۂ حرارت کو مناسب بناتا ہے۔
    info: ویتربک اوسط سے تھوڑا زور دار، مہلک نہیں بلند فضا کا جس کی رفتار 6 لے 11 میٹر / ثانیہ ہوتی ہے۔ یہ پتوں، بالوں اور آسان وسائل کو حرکت دیتا ہے۔ طبی اعتبار سے گرمی کم کرنے والی حالت بنتی ہے۔
  weather.clear:
    label: جشنو
    summary: فلاسفٗ‏ن شافع فضاؤں بلݙ اَک واحد بالغ
    info: |-
      جشنو میٹئورالوجک سطح کا اس قسم کے صورت حال جہاں آب حالت فضا زیرِ انگشتان تھر دواونچل وارن بطور پوشیده نظر رہندی۔
      ایسا موسم سورج کرن کے مضبوط ترین روشنائی لاتا ہے، ستاروں کے مشاہدے کے براہرس موقع توڑتا ہے。
      رات وقت جشنا کے دوران حرارتی روشنائی زبردست طاقت والی بن جانتي؛ درجوں کمّيت سريعتر ہوتى۔
  weather.cloudy:
    label: بادل
    summary: آسمان بادلوں سے ڈھکا ہوا، بغیر سورج کی سیدھی روشنی۔
    info: بادل دیکھنے میں پانی کے نچوڑ یا جمے ہوئے بلور کے گروپ کی طرح نظر آتے ہیں۔ زمین کا 60% سے زائد حصہ ہمیشہ بادل سے ڈھکا رہتا ہے۔
  weather.cold:
    label: سرما
    summary: درجۂ حرارت مذاب نقطہ سے دور ہوا
    info: بہت زیادہ سردی، جس میں برف اور دم کے ذرات نظر آجاتے ہیں، تو پیدا ہوتی ہے جب قطبائی فضا درمیانی وسعتوں تک رسائی حاصل کرتی ہے۔ زمین پر اندازہ شدہ طاقتور سردی کا رقبہ منفی ٨۹٫۲°c والاسٹون اسٹیشن،antarctica میں موجود ہے۔جسم تناسب کا رد عمل سردی کے خلاف حرارت بنانے کے لئے خون کے عروق کو تنگ کرنے اور تھندر کے ذریعے ظاہر ہوسکتا ہے۔ چند معاملات میں جسم کی درجۂ حرارت 35°C سے کم ہوجانا hypothermia کہلاتا ہے۔
  weather.dew:
    label: روزا
    summary: سرد رات میں مواد پر مشتمل ہوݨ والا آب کا قطر
    info: روزا فضائی آب کے بخارات سرد اور پرسکون راتوں میں مواد کا حامل خشک表面上 تبدیل ہوتے وقت تشکیل پانچتا ہے۔ جب مواد کا درجۂ حرارت دم dew point) نامعلوم نقطہ )سے زیر طاری ہوجاتا تو روزا بنن شروع ہوجاتا ہے، گرماپنا علاقوں میں لوازم وحشت اور حیوانات کے لئے یہ آب کا ضروری ذرائع ہے۔ اتاقاما صحراء میں قوم لو ٹھوس شب کے بعد سوراخ والی سطحوں کے استعمال سے صبح کے روزا کو جذب کرتے ہیں
  weather.drizzle:
    label: مروله لائن
    summary: دراز قدر کمزور برسات
    info: مروہلینی اس بارش کو کہتے جن میں قطرات نصف ملی میٹر سے زائد درجہ حرارت پر موجود نہیں رہتے۔ یہ تھرمال حجمی فرشتوں سے نہیں بلکہ مقامی طور پر تشکیل دئيے گئے موسمی نظام سے وجود میں آتا ہے۔ عموماً چند واقعات شمالی برطانیہ، شمالی فرانس سمیت عالمی صفوں والے خطوط میں مشترک ہوتے ہیں۔
  weather.drought:
    label: خشک
    summary: درآمد کمی کے درازافصل کا فقدان پانی کی عدم فراخدلان کا سبب
    info: سکھو ایک متورولوجی کی صورتحال ہے جب برسات مسلسل قلت سامنے آتی رہتا۔ چاول، پانی کمی اور آگ لگنے والے واقعات کا باعث بن سکتا۔ 2015 تا 2020 کے دوران چیش ناطرل سب سے زیادہ خشک دوروں کا شوق منظرنداز ہوا۔ عالمی طاقت حارمت انقلاب مختلف حصوں میں موجود خشکی کو بدترین کردیتی ہے۔
  weather.dust_storm:
    label: ذراتی چلتان
    summary: شمالی خطوط میں قوتِ وزَّانٗ سے حرکت کرنے والا ذرا
    info: ریت اور مٹی کے بڑھاوا دباؤ والوں سمندروں پار جاتا رہتا ہے، خاص طور پر شمالی آفریقہ سے لے کر براعظم عالمگیر تک۔ حمل و نقل شدہ زمیندار مواد عام طور پر انڈس فلاتن کے درختوں کے نظام کو متاثر کرتا ہے۔
  weather.flood:
    label: زلم
    summary: جس وقت پانی عام طور پر خشک مقامات پر غلبہ حاصل کردیتا ہے تو اسے طغاوت کہا جاسکتا ہے
    info: "بارش کی زائد مقدار، برف کے پگھلنے اور جالوں کے تباہ ہونے سے طغوط آتا ہے۔\nطغاوت قدرتی حادثات میں دنیا کا سب سے خطرناک واقعہ ہے۔ \nچیک رپبلک میں 1997ءاور 2002 ءمیں طغاوت نے لاکھوں روایتی فروخت کر دی اور درجنوں لوگوں کی جان لے لی。\nmangrove بالائی علاقوں اور جنگلات قدرتی طرح سے طغاوت کے خطروں کو کم کرنے میں مدد کرتے ہیں"
  weather.foggy:
    label: ملہو
    summary: زمینی سطح پر اکٹھا ہونے والی موٹی بادل کی دھند جس سے رؤیت کم ہوتی ہے۔
    info: دھند زمین کی سطح پر موجود آبی قطراتوں سے تشکیل پانے والا بادلوں کا ایک حلقہ ہے۔ یہ بالعموم خشکی میں نمی کے زیادہ ہونے کی وجہ سے وجود میں آتا ہے، اور رؤیت کو ایک کلومیٹر تک کم کردیتا ہے۔
  weather.freezing:
    label: مرݨد
    summary: پانئ کے درجۂ حرارت کمزور ہونے والا
    info: ہریس تو اب وقت میں پانچ کے نشان سے زیر تبدیل ہو جاتا ہے۔ حفظان صحت کے لحاظ سے باغستان کھربزائی، راستوں پر غلط فہمی کارگردان حوادث بننے والی ہوتی ہے۔ چک کے قومی دفتر آلات وسائل کے طور پر جناور اندازوں کے ذخائر کے تحت مندرج ہوا ہے۔
  weather.frost_flowers:
    label: برف کی پھلو
    summary: سرد поверхностوں پر تشّکِل پذیر قُدرتی بلور
    info: |-
      برف کی پھولوں سے مراد اسٹرکم خشک موسم میں بہت زیادہ سردسطحوں پر نمی جمائنے سے بننے والے بلور حامل شکلیات ہوتا ہے۔
      arctic دریاؤں میں دیدناک بر ف کے بلور وار آرا تعمیر ہوجائے
      ان کی تصاویر لینا طبعی عکاسی کا مشہور موضوع ہے، ان کی موجودگی صرف خصوصی حالتوں میں ہوسکتا ہے: چند حرارت والا رطوبت والاصفحہ اور بڑی حد تک سرد هوای
  weather.frosty:
    label: صبح کا مرزا
    summary: سطحی جنوواتکا؛ ہلاکرنے والے ہلدائن کے بلبلے گنداروں اور زمین کو ڈال دیتے
    info: جینوواٹکا اس وقت پیدا ہوتی ہے جب سطح کی درجہ حرارت فرزنگ نقطہ سے نیچے آجائے، اور دم خشکت میں منجمد ہوجائے۔ یہ لیفروں، شیشوں اور زمین کی سطحوں پر حیران کن نقاشیات بناتا ہے۔ یہ برف (فرز) سے الگ ہوتا ہے؛ جنوواتکا ہوا کے ذرات سے تشکّل پذیر رقبہ ہے، جبکہ فرز ترشح ہونے والی عرقِ شب ہے۔ جنوواتکا غذا کے لئے خطرناک ہوسکتا ہے؛ فلاسفر وضاحت کرتے ہیں کہ انھیں روایت کے تحفظ کے مقصد سے ماپا جاسکتا ہے۔
  weather.gloomy:
    label: چمرون
    summary: ذراخواص طاقتدار درجندي موسيقي
    info: چمرونه وار موسم تان کمزور روشنی، سبز رنگ دھوپ اُتے مبنی نقل آہدی ہئي۔ جس توں ذہني خرابيء‏اں لاءَ منسلک ہوندا ا‏غٗر۔ SAD (موصولی عطائش زخم)، شامݨ والے سورج د‏‏ی قلت د‏‏ی وجہ توں پیدا ہونوالی بيماري ا‏غٗر۔ غوثقائي فلسفہ ادب اوّل حالت توں متاثر ہندى نيں۔
  weather.hailing:
    label: کروبوئٹ
    summary: سرما کے ذرات؛ کروبز فصل اور ماڈولوں کو نقصان پہنچاسکتے
    info: کروپوبیتِ کس طرح ابروں میں برفانہ حبّے سے تشکیل پاتا ہے۔ ان حبّوں کا وجود آنچھوں کے تودرتو جذب و خشک فضا میں حرارت زدگی سے نمٹنا، دوروں میں ہوتا رہتا ہے۔ بعض اوقات یہ حبّے ۱۰ سم سے زائد قطر والے ہونے لازم ہیں اور محصولات، موڑ توؤں اور چُتراؤں کو شدید نقصان پہنچاسکتے ہیں۔ عالمگیر درجۂ علم میں قائم تمام وقت کا بزرگترین ہائلو صفر سانتیمیٗٹر سے زائد قطر والا ثابت ہوا
  weather.haze:
    label: اور
    summary: دما، جھانسہ یا آلودگی کی وجہ سے رؤیت کمزور
    info: اُمار ایک تاروں والے دم، جھانسہ کن آسمان میں فلرائٹ پاؤڈر سے بنتا ہے۔ چونکہ واقعاتی طور پر حیرت انگیز نظرآتا ہے لہٗذا اسے خصوصی طور پر غلط سمجھنا ضروی ہوتا ہے۔
  weather.heat_lightning:
    label: حر برق
    summary: دور کے طوفون کے باوجود سنا جاسکنے والا حجم.
    info: حر برق ایک دور کے طوفون میں دھواں جو آسمان پر نمایاں رہتا ہے، لیکن حجم زوردار تماشائی سبز روشنی کی وجہ سے سنائی نہیں دیتی۔ حر برق واقعی خاص قسم کا بجلی کا شعلہ نہیں بلکہ صرف دور کے علاقے سے ظاہر ہوتا ہے۔ عام طور پر چودہ کلو میٹروں سے زائد فاصلے والے برق غائب ہوجاتے ہیں۔
  weather.heat_shimmer:
    label: مارنی
    summary: حرارت والی سطحوں کے اوپر ہونے والا بصری خلل؛ بصراو رؤی.
    info: مارنی اسپشل آبہوا کے ساتھ حرارت زخم، مارگرینا نامی جدید تصور)، دکھائو فلم پانی کے طور پر چمکتی ہوتی ہے۔
  weather.heatwave:
    label: گرمی کا طوفن
    summary: معمول سے زائد گرمی کا طول العمر دور؛ صحت کے لحاظ سے خطرہ
    info: گرمی کے طوفن معمول سے زائد موسم گرما کا اکتاہٹ دینے والا دور ہوتا ہے۔ ٢۰۰۳ء کا یورپی گرمی کا طوائف لامحدود تعداد میں جان لے چکا، خصوصًا بزرگ لوگ، نوملائس اور مریض فرد متاثر رہتے ہیں۔ عالمی درجۂ حرارت کمتر پڑھنا ان واقعات کی لمبائی اور شدت دونوں کو بڑھارہا ہے۔
  weather.hot:
    label: حرارت
    summary: زبردست گرمی ذہنی عدم تحفظ اور صحت کے خطرات کا باعث بن سکتی ہے
    info: بہت زیادہ دھوپ اور حرارت کا ماحول موسم سے براجمان حالت ہوتی جس میں درجۂ حرارت فصلی تخمینے سے واضح طور پر اوپر رہتا ہے۔ نمی والے حالات میں گرمی کے باعث قلب و عروق، خون کی شارٹنگ اور بالآخر چکر آنا شامل عمومی صحت کے لحاظ سے سنگین مشکلات پیدا ہوسکتی ہیں۔ چیک جمهوریہ میں گرمی کے دوران درجۂ حرارت ۳۸°س سے زائد رہا۔
  weather.humid:
    label: ولوموسٹي
    summary: پانی کے بخار سے بھرتی ہوئی فضا؛ گرم اور تنفس مشکلات
    info: رطوبت ایک فضا میں پانی کے بخارات کا حجم اندازہ لگاتی ہے۔ رلٹوائس ولوموسٹي ١٠٠٪ سے زائد نمایدۂ فضاؤں کے شبع، جب تھنڈرو وارش چلنے والی آوازوں کے طور پر موجود ہوتا ہے۔ بالعموم، بلند رطوبت درج حرارت کا خوددار ذرا دبا دینے والا ہوتا ہے؛ کیونکہ عرق نہیں ہوجاتا۔ گرم موسمی خطوط عام طور پر سال بھر بلند رطوبت کا باعث بنے ہوئے ہیں؛ جبکہ ہمارے یہاں صرف گرمیوں میں ہوتا ہے
  weather.hurricane:
    label: ہریکن
    summary: بڑا موذی گردشی طوفون
    info: ہریکن اطلس کے سمندر مغرب پاسفک جھیل تند چلن والی بادوں کا حلقہ بناتا ہے۔ ان فوران زمین و آسمان دونوں کو متاثر کرتے روزانہ دستبرداری کرنے والا طاقتور نظام ہوتا ہے، بعض وقت تو خطرناک حد تک قابل ذکر شدت اختیار کرسکتے ہیں۔
  weather.ice_storm:
    label: لیدووا بورے
    summary: جذباتی برسات تمام چیزوں کو واضح آئس کی مختلف ضخامت والا لاولہق کرتی ہے
    info: لیڈووا بورے کا اطلاق ان مہم جوش دھندلوں پر ہوتا ہے، جبکہ سرد لایت والے فضا میں حرارت زدگان درختوں، تاروں اور راستوں کو موٹی شفاف چادر نما آئس کے طور پر چڑھاتے ہیں۔ الیکٹرانک نظام لوادروں کے وزن برداشت نہ کرنے کی وجہ سے بلاکاؤٗٹز متاثر ہوجائے ہیں۔ قوبے کے علاقے میں واقع 1998ء کی لیدووا بورے خاصا مشہور ہے، جو کینیڈا کی تاریخ میں بدترین حادثات کا باعث بنی。
  weather.icy:
    label: نالدِي
    summary: سطحی علاقوں پر موجود خطرناک لمف
    info: |-
      برف کے پانی سے برش جا رہا اور موسم خشک میں درختوں کے تھنروں کا لگنا، نالدٗی بناتا ہے۔
      ٹرافک کے لئے زمستان کی حالتوں میں یہ سب سے خطرناک حالت ہوتی ہے。
      لذّت انخلاس کمپن والے آب کی دباﺅ سطح کی وجہ سے چلتی ہے۔
  weather.lightning:
    label: برقت
    summary: زمین اور بادروں یا دونوں بادروں کے درمیان الیکٹروسٹیٹک برقا
    info: برق کا ایک قوت وارسا الیکٹرک برقا جب تھنڈربولت میں موجود ناقابل ذکر سے زائد فرق حساس حد پہنچ جاتا۔ برقت رفتار روشنائی کا تہای ثلث ہو۔ دنیا بھر میں لگ بھگ ١٠٠ برقت در секوند طلباء۔ آسمان والے خطرناک عمارتوں، انفراسودس، ۱۷۵۲)، علمی طور پر بنائے گئے تحفظ نظام کا پہلا ماخذ
  weather.misty:
    label: ملحو
    summary: تنگ ملز یا روشن ملز کی وجہ سے دکھائی دینے والا حجم
    info: "ملہواوی موسم اس وقت پیدا ہوتا ہے جب زمین کے قریب موجود فضا میں آبی بخارات کثافت اختیار کرتے ہیں۔\nچھائج سے مختلف ہونے کی وجہ یہ ہے کہ دکھنے والی رفتار محدود تو ہوتی لیکن ایک کلو میٹر تک نہیں، \nعام طور پر درختوں، تالابوں اور وادیوں کے اوپر خاص طور پر سرد شاموں میں بناتا ہے۔"
  weather.monsoon:
    label: مونزون
    summary: فصلی حوالہ آباد علاقوں میں شدید بارشوں کا دور.
    info: "موسمی بارش کا موذون اقیانوس اور زمین مابین فصلی طوفن سے واقعہ ہوتا۔\n انڈو پاکستان موذون جون ترزاول ماہ میں سالانہ برسات کا ۷۰ لے ٩٠% لاوا دتا۔ \n کروڑوں لوگوں کا زراعت موذون پرااعتماد رخنا۔"
  weather.muggy:
    label: دشمنی
    summary: نامعلوم طرح سے گرم اور مرطب فضاؤں کے باوجود قابو پانے کا احساس
    info: دشمنی اس وقت پیدا ہوتی ہے جب درجۂ حرارت بڑھ کر زیادہ رطوبت والی فضا ملتی ہو۔ بال بلند سمت میں توانائی ختم نہیں ہونے دیتا، لہٰذا آپ کم موثر طور پر شکل اختیار کرنے کی صلاحیت حاصل نہیں کرتے۔ گرمی کا انڈیکس (حرارت کا معامله) درجۂ حرارت اور رطوبت دونوں کوملا کر واقعاتی درجۂ حرارت ظاہر کرتا ہے۔ دشمنی عام طور پر ٹروپیکل علاقے اور ذیلی چولہا خطوط میں گئرز محسوس ہوا
  weather.overcast:
    label: غُبراء
    summary: آسان بالکل غیر واضح ہوتا ہے، بلند بادل درست سورج کی روشنی کو روکتا ہوا
    info: بادلوں کی مقدار 7 فلوراکس اور آٹھ فلوراکس تک پہنچ جاتی ہے۔ روشنی مختلف شعوں میں تقسیم رہتی ہے، لہٰذا سائے نظر نہیں آتے۔ ذہنی تناسپ باوجود علاج (ایس اینڈ ڈی)، خصوصی طور پر زمینی واقفانہ دباﺅ والی حالت میں سورج کی عدم موجودگی مرکزی عنصر بن جاتی ہے۔ روشنی کا علاج سورج کی روشنی کو شبیه بنا کر صحت مند موسم کی قدر کو واصل کرتا ہے۔
  weather.partly_cloudy:
    label: نصف روشن
    summary: آسان کچھ حد تک بادلوں سے ڈھکلا؛ سورج اور سائب کدروں
    info: |-
      پولو جسنو میں موسم شناسان اکائٹا کے ذریعہ بادل دی تعداد نظر رکھتے ہن، جتھ‏ٔ ساتھ وچ آوازاں۔
      ایسا موسم عام طور پر خارجی فعالیتوں لئی سب تو زیادہ مناسب حالتاں وچوں اک ا‍ ء。
      اس وقت کمیونوبوس بادلوں دا وجود گرم حصّہ بندا ا‍ 
  weather.rainbow:
    label: دُھا
    summary: بارش کے بعد آسمان پر دیکھنے والی رنگین تار، جب سورج چمکتا ہے۔
    info: دُھا بوند میں سورج کی روشنی کے خمش اور عکس کے نتیجے میں وجود میں آتی ہے۔ اس میں سات رنگ شامل ہوتے ہیں - لال، نارنجی، زرد، سبز، نیلا، انڈیگو اور بنفشی۔
  weather.rainy:
    label: بارش
    summary: بادر میں پانی کے گرنے سے بارش ہوتی ہے۔
    info: بارش ابروں میں موجود پانی کی تراکیم کے نتیجے میں ہوتی ہے۔ یہ دریاؤں، تالابوں اور پینے کے پانی کی فراہمی کے لیے ضروری ہے؛ عام طور پر بارش 9 میٹر فی سیکنڈ کی رفتار سے ہوتی ہے۔
  weather.sandstorm:
    label: پیسنچن٘ا بوُرس
    summary: خوشحال مقامات میں تند وتر زور دار بادلوں کے ذریعے حرکت کرنے والا ریت اور غبار کا دیوار
    info: رملی طوفان اس وقت پیدا ہوتے ہیں جب تند وتر زور دار بادل کثیر مقدار میں ریت اور خشک موذائی سامنا کرتے ہیں۔ حابوب، صحراء خطّو اور عرب شبه قطعہ میں آنے والے رملی طوفون کی نوعیت اختصاصی ہے۔ ان کے باوجود گاؤں مدفون ہوسکتے ہیں اور تنفسی مشکلات بھی پیدا ہوجاتی ہیں۔ امریکی ریاست ایرزوان میں حابوب نایاب فطری منظر عام ہیں۔
  weather.shower:
    label: burst
    summary: ابرشدّت سے نسبتاً لمبا برسات واقع ہوا۔
    info: بُرست، کانویکٹائوز مین سے بارش ہوتی ہے جس میں ابر Cumulus یا Cumulonimbus شامل رہتے ہیں۔ یہ تیزی سے آتا ہے اور منٹ لگاتا ہے۔ صبح دن کے وقت عام طور پر موسم خزاں میں چمکدار سورج حرارت کونوسشن بناتا ہے۔
  weather.sleet:
    label: بُرف والی بارش
    summary: بارش اور برف کا مخلوط؛ پچاس فیصد ذوب شدہ برف کے حطیمات
    info: ہریس کا بارش اور تودوں سے مل جانا، نمایاندگی دکھاتا ہے۔
  weather.slush:
    label: سلاش
    summary: آدھا پانی سمیت حل شدہ موسمِ سرمایہ؛ غسل آلود واقف
    info: روزبردل سی نہ کا ابھار جب درجۂ حرارت پانی کے مکمل ذوبنے والے نقطے تقریباً اوپر بڑھتا ہے تو بناتا ہے۔ یہ خستگی، لوٹنے اور دوروں دونوں کے لئے خطرناک ہوتا ہے۔ راستوں پر یہ آقوا پلاننگ کا باعث بنتا ہے اور فلائت زمینداری کو متاثر کرتا ہے۔ عام طور پر نمک یا رسند کے استعمال کے ساتھ شامل کردیا جاتا ہے تاکہ قابض حالت میں بهتری لا ئی جاسکے。
  weather.snowy:
    label: برف باری
    summary: بار کے خرچوں سے سفید بروفلکس گرنے لگتے ہیں۔
    info: برف اس وقت پیدا ہوتی ہے جب بادلوں میں موجود پانی کی گولیاں جم کر ہائیلین کرسٹلز - برافلکس بن جاتی ہیں۔ ہر برافلکس کا منفرد متوازن شکل ہوتا ہے۔
  weather.stormy:
    label: بادل
    summary: دراماتیک موسم سے بجلی، گرج اور شدید بارش کا تجربہ ہوتا ہے۔
    info: بادل بلند کمولا نمبو کے بادلوں میں پیدا ہوتا ہے۔ بجلی الیکٹرک چھلنی ہے؛ جبکہ گرج وہ آواز ہوتی ہے جو بجلی کے گرد ہوا کو تیزی سے گرم کرنے سے پیدا ہوتی ہے۔
  weather.sunny:
    label: سورجی
    summary: واضح آسمان جس پر سورج روشن ہو، بادل کے بغیر۔
    info: سورجی موسم ابھرتا ہے جب بادلوں کا نہ ہونا سورج کی تابکاری کو بلاک نہ کرے۔ سورج زمین پر حیات کے لیے ضروری روشنی اور گرمی فراہم کرتا ہے۔
  weather.sunrise:
    label: صبح
    summary: '''صبح'' اُجاولے کے آغاز میں سورج کے افق پار ہونے والا موقع'
    info: سورج ابھرنے کا زمانہ جیسے آفتاب دکھائی دینے لگتا، وہ سماوٰت میں سورج کا حلقہ فضا پر قابض رہنے والے موڑ کو عبور کرتا۔ اس وقت نور کا رلے روشناسپرد تبدیلی کے باعث مختلف رنگوں (آلومنٹ، لاالو) کا ظہور ہوتا۔ شمالی خطوط میں صبح کا دورانیہ خاص طرح کے موسم میں(شمالی دن اور شب)، موجود ہوتا۔ 'سبز شعلہ' (Green Flash) بظاہر غیرمعمولی مشاہداتی معاملہ چمکدار فضا میں صرف افق پر وجود میں آئے گا۔
  weather.sunset:
    label: غرب الظلام
    summary: دن کے آخر میں سورج افق سے ڈوب جانا
    info: غروب آفتاب دن کا وہ وقت ہے جب سورج افق سے نیچے گرتا ہے۔ رنگوں کا پینلٹون (سائмон، لال، بنفشی) خورشیدی روشنی کے بکھراؤ کे باعث ہوتا ہے۔ زمینداران حادثات کے بعد غروب آفتاب کافی تماشا ملتا ہے کیونکہ فضا میں موجود شعلہ ان رنقوں کو مضبوط کردیتے ہیں۔ قدامت سے غروب آفتم قائم مقام اختتام، صحت مندی اور عشق کا علمبردار رہا ہے
  weather.thunderstorm:
    label: storm
    summary: 一种伴随有闪电、打雷和强风的大规模天气事件
    info: |-
      暴风雨在积雨云中形成，这些巨大的云层高度超过十公里。闪电是静电放电现象；一道闪电能在一秒钟的几分之一时间内将空气加热到三万摄氏度以上。
      雷声是由受热膨胀迅速产生的声音效果。
      夏季阳光照射地面产生对流气流时会引发风暴。
  weather.tornado:
    label: ترناڈو
    summary: خراب کرنے والی چلتی ہوا کا ستون بلندِ درجات سے لے کر زمین تک
    info: |-
      تارنाडو باد کے تیز رفتار جھومکا اور طوفان سے پیدा ہوتا ہے، جس میں زمین کے سطح کو شامل ہونا ضروری ہے۔
      بافتن کی رفتار 480 کلو میٹر فی گھنٹہ سے آسانی سے اوپر نکل سکتی ہے。
      امریکی موسمی علاقوں خصوصتاً Kansas، Oklahoma اور Texas میں ان کی موجودگی عام دیکھائی دیتی ہے۔
  weather.typhoon:
    label: тайفون
    summary: ' شمال مغربی دور دراز علاقے میں واقع موسمی حادثات'
    info: |-
      тайفون فلیپائن، چین اور جاپان میں طوفن کو سمجھاجاتاہے۔
      فلیپائنز عام طور پر تقریباً صد باقاعدگی سے متاثر رہتی ہے。
      ٹائفون نِنا(١٩٧٥)، چین میں بارش کا ذمہ دار تھا جسکب وجہ سے زائد ۲ لاکھ لوگ لقمۂ اجل بن گئے۔
  weather.waterspout:
    label: واݙر سموش
    summary: بحر يا درياهه د‏‏ي سطح توں بلبل د‏‏ي متاثرت ہوتيلائي اک روتن والا فضا
    info: "واٹر سپائوٽ اک آبی جگہ کے اوور وچ رُولن فاصلاءَ د‏‏ی برفاندھ ہندی ا‍۔\n\nخطرناڪ تارنوالا واٹر سپائوٽ طوفان توں بندا ا‍، معمولي موسم والا کمولا نمبئس توں。\nاس د‏‏ي وجہ توں ماڻ سميت مختلف حيوانات زمين لوي منشتو اندر داخل ٿينديون ا‍۔ \nجڈین اتے فلاڊفيا جلخليط پرواز عام طور اترن ا‍۔"
  weather.whiteout:
    label: سفید درندگی
    summary: '''واح'' کے موسمی حالات میں، برستی ہوئی برف تمام مقابلے کو ضائع کر دیتی ہے۔'
    info: |-
      وائٹ آؤٽ اس وقت پیش آتا ہے جب برف کا طوفان اور سفید تھنکل کی واپسي، زمین اور آسمان دونوں کو ملا دیتی ہے۔
      ایسا صفر نظریاتی حالت قائم کرتا ہے اور لوگ غلط فہمی میں رہتے ہیں。
      اس حوالے سے شمالی علاقائی یا پہاڑی وارنا انداز میں خطرناک چیزوں کا باعث بن سکتا ہے۔
  weather.windy:
    label: ہوا
    summary: تیز حرکت والی ہوائیں جن سے درخت ٹھنڈے اور پتوں کا برقعہ چل رہا ہوتا ہے۔
    info: زمین کی سطح کے مختلف طریقے سے گرم ہونے سے ہوا پیدا ہوتی ہے، جس سے دباؤ کے زیادہ علاقوں سے کم دباؤ والے علاقوں میں ہوا کی حرکت ہوتی ہے۔
