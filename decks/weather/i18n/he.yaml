lang: he
pivot: false
title: מזג האווירה
cards:
  weather.aurora:
    label: זרת כוכבים
    summary: явление אור טבעי שנוצר על ידי רוח השמש במגניטוספרה.
    info: záרה קוטביתה מתרחשת כאשר חלקיקי שמש טעוניםتفاعלים עם האטמוספירה ומייצרים גווני ירוק, סגול ואדום בצורות של חגורות או ספירלות בשמיים הליליים. היא נראית הכי טוב באזור הקוטב הצפון והדרום כמו בנורוויה, איסלנד, קנדה ולאנטארקטיקה.
  weather.avalanche:
    label: лавיינה
    summary: מסה של ערפל וקרח נופלת מעוטפו הר.
    info: לָווינَا הינה מסה של שער פוגעת במורד עטף ההר במהירות רבה מאוד. האיום הגדול ביותר מגיע מלויינות אבק השן המגיעות למהירויות מעל ל - 300 קמ
  weather.blizzard:
    label: סופה שלגים
    summary: סופת רעמים עם ענני בוץ צפוף וחוסר נראיות
    info: |-
      סופת שלג היא תופעת מזון חמורה המורכבת מממטר שולחן ורוח חזקה
      היא גוברת על הראות כמעט אפסית (ווייטאווט) והצטברויות גדולות של השלג
      במהלך ההיסטוריה סערות קרח גרמו למותם של אלפים אנשים
  weather.breezy:
    label: brisah
    summary: רוח נעימה ומגניבה שמקררת יום חמים.
    info: בריזה היא רוח עדינה במהירות של 6–11 מטר לשנייה (באופרט 3–4). היא גורמת לנועם של עלים, שיער ופריטים קלה. פiziולוגית, היא מקטינה את תחושת החום על ידי איבוד הזיעה.
  weather.clear:
    label: ברור
    summary: 하늘 완전히 맑고 구름 한 조각 없음.
    info: ברור הוא מצב מетеוריולוגי שבו יש פחות מחצי שעה של ענן בשמיים. מאפשר את האירוח השמשי החזק ביותר ואת תצפיות האסטרונומיה הטובות ביותר. בליל ברורים קרינת חום חזקה יותר וטמפרטורות יורדות מהר יותר.
  weather.cloudy:
    label: 흐림
    summary: 하늘이 짙게 낀 상태로 태양빛을 직접 볼 수 없습니다.
    info: 구름은 지표면에서 보이는 수증기의 작은 방울 또는 얼음 결정 덩어리입니다. 항상 약 60% 이상이 구름으로 뒤덮여 있습니다.
  weather.cold:
    label: חורף
    summary: קר קיצוני שבו הטמפרטורות יורדות מתחת למפתיע.
    info: קר קיצוני נובע מחדירת אוויר ארקטי לאזורים טרופיים או subtropicals ויכולה לגרום למזי רחמים ולנשימה可见ית בקור. הטמפרטורה הנמוכה ביותר שנמדדה על פני כדור הארץ היא -89.2°C בסנטורווסטוק באנתארקטיקה. הגוף מתמודד עם הקירבה באמצעות סגירה של כלי דם והתפרצות של שivering.
  weather.dew:
    label: רוסה
    summary: כפסיות מים שמתקפכות בפני משטחים במהלך הלילה הקר.
    info: росה היא מים שנמספגו מהאוויר על פני השטח הקרים בלילה שקט. נוצרת כאשר הטמפרטורה של המשטח יורדת מתחת לנקודת露점 (точка росы). זהו מקור חשוב للمים עבור צמחיה וחיות באזורים יבשניים; פועלי הפארמה בסלע האטאקה מאספים רוסה בשחר עוזר באמצעות סיכי תולעת.
  weather.drizzle:
    label: '"מָט"'
    summary: '"מטר קל מאוד בטיפות קטנות"'
    info: '{"info":"מְרוֹהוּלֶן הוא תופעה של ניקוז עם טיפות מים זעירות בגודל קטן יותר משני миллиเมตร אחד. התופעה לא מגיעה מקונ베קציה או עננים קיימונים אלא מאבקת הענן השכמיונית הנמוכה. היא שכיחה בمنطقة אוקיאנית כמו בריטניה הגדולה וצפון המערב הצרפתי. למרות גבישיה יכולה לגרום לחוסר שיווי המשקל."}'
  weather.drought:
    label: gusho
    summary: מחסור ארוך בממטרים יוצר חוסר במים
    info: |-
      גשוח הוא מצב מזonic עם מחסור ממושך במשקעים
      הוא גורם לאובדן庄稼, לחוסר המים ול שריפות
      בצ'כיה היה הגשח בין השנים 2015–2020 הגרוע ביותר מזה yü Jahr
  weather.dust_storm:
    label: סופת 먼
    summary: جدול שער עם זרימת אוויר חזקה באזורים חסרי המים.
    info: '{"hint":" עננה גדולה של אבק וرمال נושבת באזורים יבשים","info":"סופות רעמים מתרחשות כאשר הרוח הגדולה מעלאת חלקיקי ארץ דקים לאויר.\nThe Sahara Africa מכונה "harmattan" ל먼שיה. \nThe Sahara האבק פוגעת באופן קבוע באוקינוס השקט ומגיעה אמריקה; מחקרים מצביעים על ההשפעה שלה על茂密的亞馬遜雨林。\nThe American Dust Bowl בסופת העפר ב -30 השנים האחרונות גרמה катастрофа ecologyית במרכז צפון אמריקה.'
  weather.flood:
    label: 플루다바
    summary: 물길 바닥으로부터 정상적으로 건조했던 지역에 물이 넘쳐 흘러 들어오는 현상.
    info: |-
      홍수는 과도한 강우나 눈이 녹거나 댐 붕괴로 인해 발생한다.
      홍수는 세계에서 가장 비용 많이 드는 자연 재난이다.
      체코에서는 1997년과 2002년의 홍수가 수십억 유럽화폐 단위 손실을 초래했으며 수많은 사망자를 냈다.
      자연적인 방재 조치(습지와 숲 등)가 위험성을 줄이는 데 도움된다.
  weather.foggy:
    label: smog
    summary: ענן נמוך דק שמפחיד בראיה.
    info: смог הוא עננים ברמה של פני הקרקע המורכבים מנקודות מי גלגלים שנוצרות בהumedת אוויר גבוהה ומקטינים את ראיית הדרך מתחת לקילומטר.
  weather.freezing:
    label: meitza
    summary: temperot ma'avak shelo lizmoat atzemey mayim.
    info: geli meitzarim ba'ad she'ein ham'tzora etzel merkaz ha-midbar shel tzafon ve-ha-kadmah shel yisrael.
  weather.frost_flowers:
    label: ג빙 פלוורס
    summary: גבישי קרח יפים המופיעים לפני פני משטחות.
    info: ג빙 פלוורס (פרחים של קרח), הם מבנים גבישיים שנוצרו על ידי הקפאת לחות בפני עצמות קר מאוד. בים הארקטי נוצרים דפוסי אבן ערבובית מורכבים וברורים יותר ממה שקיים בטבע אחר. פרחי הקרח ידועים כנראים במיוחד מהירים והם צילום טבע רגיל.
  weather.frosty:
    label: בוקר קריר
    summary: קיפאון משני ; פסי קרח покрыти растения и землю.
    info: גינואטקה מתרחשת כאשר הטמפרטורה של פני השטח יורדת מתחת נקודת הקפיאה והرطوبة באוויר מתגבנת לึกרים. היא יוצרת דפוסים מקושטים על עלים זכוכית ופני האדמה. גינאטיקה שונה מאינהי (קריסל קרח) - הגינאטה הוא אבקה של רטוב שמתעבה ישירות מהגז לנוזל ללא מעבר דרך מצב נוזלי.
  weather.gloomy:
    label: חמורן
    summary: מזג אוויר כביכול עם אווירה דיכאונית.
    info: สภาพอากาศหม่นมืดเกิดจากเมฆสีดำต่ำ ๆ เงาที่อ่อนลง และบรรยากาศเย็นหรือฝนตก สภาพนี้เชื่อมโยงกับความเศร้าและฤดูใบไม้ร่วง SAD (โรคซึมเศร้านอกฤดูกาลตามช่วงเวลาในปี) เป็นภาวะแทรกศัพท์จากการขาดแสงแดดในหน้าหนาว อุปรากรแบบโกลธิกและการเขียนบทกว่าโกลธิคได้นำเอาอารมณ์ของสภาพอากาศหม่นมาใช้อย่างแพร่หลาย
  weather.hailing:
    label: גראני
    summary: סופי גרעיני קרח; גرانוס יכול להרוס את הפירות ואת כלי הרכב.
    info: |-
      גרניט הוא סופות שנוצרת על ידי גרanos של קרח הנוצרים ב구름 רעמים。
      The granos נוצרים כאשר טיפות מים עוברות חזרה וחוזר חלק קר וחלק חמימות בגובה התרחבות.
      הם יכולים להגיע לרוחב מעל 10 ס
  weather.haze:
    label: ऑपर
    summary: धूल, भाप या प्रदूषण के कारण दृश्यता कम हो जाती है
    info: |-
      ओपर हवा में धूल के साथ प्रकाश की दिखने क्षमता को कम करने वाले छोटे अयसज़िएशन कण होते हैं।
      इसमें घुलहर के बरखबड़ जल के टॉईफल नहीं होते; ओपर ठोस या तरल एअरोसोल होते हैं。
      एशिआई गढ़ेगठन चौदहरा स्मॉग से प्रभारिक होते हैं - इसमें ऑपर और फैक्सचर के मिश्रण होते हैं।
  weather.heat_lightning:
    label: ברקי חום
    summary: 一闪的雷暴，其闪电可见但无法听到轰鸣
    info: שיטפונות חום הםashes של סופות רחוקות שאינן נשמעים כי הצלצול לא מגיע בשל המרחק הגדול. השם מטעה - זה איננו סוג מסווג של בرق שנוצר על ידי לחץ גבוה או תקיפות حرارية. אנו שומעים רק ברקים עד מרחק של כ-10 מייל; אלו הרחוק יותר נראים אך אינם נשמעים.
  weather.heat_shimmer:
    label: מארני
    summary: העיווי האופטי שנוצר עקב טמפרטורת אוויר גבוהה
    info: מרניא הוא תופעה אופטית הנובעת מקיפאון אור באוויר חם שמתפזר למעלה. האוור החמים מעל צלחות אוทะเล ייבש פחות מאויר קר וכתוצאה מכך התקרות נוטים להישבך. זה גורר את הявление של בועת מי דמיונית על כביש חם.
  weather.heatwave:
    label: גאל חם
    summary: תקופת טרוף חמים ממושכת; סיכון בריאות
    info: |-
      גלות חום הן תקופת קיץ ארוכה של אקלים חריף המتجاوز את הטמפרטורות הסaisonיות הרגילה
      האולטרה גל החם באירופה ב - 2003 גרמה ליותר מ - 70,000 מוותי נסיבות
      הוא במיוחד מסוכן לקשישים, ילדים וمرضנים
  weather.hot:
    label: חום
    summary: תנאי קיצוניים יוצרים סיכון בריאותי ותחושת אי בנוח.
    info: גזרה חמה היא תופעה מזונטית עם טמפרטורות גבוהות משמעותית מהממוצע העונה. במקביל לחום יכולה להיגרם אשליה של זיעה נוראית שמזיקה לבריאות ולחיים. בטמפראטורה המוגלת באירופה עלו הטמפרטוראות לגובה מעל 38‏°ס.
  weather.humid:
    label: לחות
    summary: هواء مشبع ببخار الماء؛ إحساس بالحر والضيق.
    info: رלוואטיוו הומידיטי של百分之 hundred פירושה שירוק האורח רווי במקסימום אפשרי - כל עודף יתעמעם למים. לחץ גבוה מוסיף תחושת חום כי הזיעה לא מתאיברת מהר מספיק. אזורים טרופיים מאופקים בחמימות ולחות לאורך השנה בעוד באזורנו הגבוה ביותר הוא בסתיו.
  weather.hurricane:
    label: טורנדו
    summary: סופת טרפית גדולה עם רוחות מהירות של מעל ל -120 קילומטר לשעה.
    info: טornado הוא סופת טרופית באוקיינוס האטלנטי ובפסיפיק המזרחי עם רוחות חזקות יותר מ -120 קמ"ש. גם נקראים אונספוגון (הפסיפיגק המערבי), או צירכון (אוקיאנוס ההודי). אנרגיית הטורנדו שווה לעשרות פצצות אтомיות ביום.
  weather.ice_storm:
    label: סופה של קרח
    summary: גשם מתجمדר יוצר כיסוי דקה של קרח על כל דבר.
    info: סופת קרח מתרחשת כאשר אוויר חם מעל שכבה 차ה גורמת לישלול שמחממים מיידית. כתוצאה מהדבר ענפים, תילים ורחובות נ履ים בשכבת קרח שקורה ונשכחת. רשת החשמל המתחילה מתחת משקל הקירח יכולה לגרום לחוסר זרם. סופת הקרח בקוו벡 בשנת 1998 גרמה לתקריב הגדולה ביותר בהיסטורייה加拿דית.
  weather.icy:
    label: נעלוד
    summary: Led מסוכנת שמתחבר לשפות ולמשטים.
    info: נַלְעֵד מתרחש כאשר טיפות גשם או שלג נמסים על משטחים קרים ונแขדים לגלעין שקוף. זהו אחד המצבים האסורים ביותר בזימן עבור תנועת רכב ווליכה. היות שקרני המים יוצרים שכבה דקה של מי חם מעל פני השטח.
  weather.lightning:
    label: 번개
    summary: 공중에서 일어나는 갑작스러운 정전기 방전
    info: |-
      번개는 폭풍구름 안에서 전하 차이가 임계값에 도달할 때 발생하는 강한 정전기 방출입니다。
      번개의 속도는 빛의 약 세 분之一정도이며,
      지구에서는 초당 대략 백 개 정도 번개가 내립니다。
      번개를 막아주는 첫 과학적 설계 보호 장치인 감뢰기는 프랭클린(1752년)이라는 이름으로 알려져 있습니다。
  weather.misty:
    label: מעון
    summary: رؤية منخفضة بسبب ضباب خفيف أو غيوم.
    info: מזג אוויר מעונן מתרחש עקב קיבוע של אדי המים בשכבת האוויר הנמוכה ביחס לพืח. הוא שונה מהעננה הצפופה בכך שראות נפגעת אך לא מתחת לקילומטר אחד.
  weather.monsoon:
    label: มอนซูน
    summary: การเปลี่ยนแปลงของลมตามฤดูกาลที่นำมาสู่ช่วงฝนตกหนัก
    info: מונסון הוא תופעה אקלימטית הנובעת מהפיכה עונה של רוחות בין היבשה לים. המonsoon ההודי והפקיסטני מביא כ־65–85% משיעור הגשמים השנתיים מינואר עד ספטמבר. שבעה yüz מיליון אנשים תלויים במונים用于 חקלאיות.
  weather.muggy:
    label: душן
    summary: هواء חמים ונוכך גורם לתחושת דחיסה.
    info: דוסנו הוא שילוב של טמפרטורה גבוהה וرطوبة יחסית מוגזמת. רטיבות רבה עוצרת את איבוד הזיעה ולכן הגוף לא יכול להקרר ביעילות. מד לחום משלב בין הטמפרטורת לרוטב כדי לתאר את הощущש החם.
  weather.overcast:
    label: สภาพอากาศหมอกควัน
    summary: สวรรค์ถูกปกคลุมไปด้วยเมฆเท่ากับดวงจันทร์โดยตรง
    info: "bầuฟ้าที่มีเมฆครึ้งเกิดขึ้นเมื่อมีความเข้มของเมฆอยู่ระหว่าง 7 ใน 8 และ 8 ใน 8\nแสงจะกระจายตัวและไม่สร้างเงาใด ๆ \nในภาวะผู้ป่วยโรคซ้ำซ้อนทางภูมิศาสตร์เช่นอาการวิตกกังวลจากฤดูกาล (SAD)\nการขาดแคลนแดดเป็นสาเหตุหลัก การบำบัดด้วยแสงสามารถเลียนแบบแสงอาทิตย์ได้อย่างสมจริง"
  weather.partly_cloudy:
    label: 폴오야스노
    summary: שמיים חלקית כיסוי בעננים ; החלפה של אור וצל
    info: |-
      פולויעסנו הוא מצב מזג אוויר עם עננות של בין 3 ל -5 אוקטאות
      זה אחד מה.tipי המזון הנוחים ביותר לאקטיביות חיצוניות
      הוא כולל ענן קומולוס שמתפתחות בחלקים החמים יותר ביום
  weather.rainbow:
    label: קשת רAIN
    summary: איקס קירח עם מימדים בצבעי גוונים שנראים לאחר הגשם כאשר الشمس מאירה.
    info: קשת בענן נוצרת על ידי שבירת האור והפיזורים של אור השמש בדופנות המים. היא מכילה семь צבעים - אדום, כתום, ירוק, כחול, תכלת ו بنفسן.
  weather.rainy:
    label: גשם
    summary: מימות הסבך יורד גושמי מי
    info: גשם נוצר על ידי קירור של אדי מים בسحب. גשמים הם הכרח כדי למלא נהרות ובריכות במياه לשתייה והפקת מים.
  weather.sandstorm:
    label: סופת חול
    summary: جدפת חול ואבק הנעשית על ידי הרוח החזק באזורים מדבריים
    info: |-
      סופות חול נוצרות כאשר רוח חזקה מעלאת כמות גדולה של אבק וחול
      האבוב הוא סוג מסווג של סופת חל ב-Sahel ובشبه המדבר הערבי
      הוא יכול להטמין יישורים גבוליים ולגרום לבעיה נשימה
  weather.shower:
    label: '"shbara peligi"'
    summary: A short intense shower originating from a cumulonimbus cloud.
    info: '{"hint":"סערה קצרה אךบาง פעמים חמורה של גשם","info":"שבר פליגי הוא סופת מים קצרצרה ומיידית שמתרחשת מהענן הקונ베קטיבי (קומולוס או קוּמולהו נימבו).\nThe storm develops rapidly and disappears within minutes to hours. \"It is typical for summer when solar heating causes convection leading to formation of cumulonimbi during afternoons." After such showers it might appear rainbow.'
  weather.sleet:
    label: גשם קפוע
    summary: 혼합 비와 눈; 부분적으로 녹은 눈송이
    info: |-
      גשם קפוא נוצר כאשר גושים של눈 עוברים דרך שכבה חמה של אוויר ומסיסים חלקית.
      it מכסה משטחים בשכבת איזור דקה
      הוא מסוכן לתחבורה
  weather.slush:
    label: שלג מלוח
    summary: שלג חלק עם מי קרח; שכבה יבשה מסכנת ונוזלת
    info: |-
      שלג מละח נוצר כאשר הטמפרטורה עולה מעט מעל נקודת הקפיאה והשען מתחיל להתמוסס
      הוא חסר תraction ומסוכנת עבור הולכי רגל ודרכנים כאחד
      על נתיבי רכב הוא גורם ל-aquaplane ולירידה ב-adhesion שלยาง
  weather.snowy:
    label: שֶׁלֵף
    summary: ממעי הענן יורדות קפלי שן לבנים.
    info: שלג נוצר כאשר טיפות מים ב구름 קופאים לึก גביש - פרחים שלגים. כל פירח השלג יש לו צורה סימטרית ייחודיות.
  weather.stormy:
    label: סופת רעמים
    summary: מזג אוויר דрамטי עם סופי מזג אווירים וסערות.
    info: סופות נוצרות ב구름ים גבוהים של קומולונimbus. 번개 הוא התפרצות חשמלית והרעם היא צליל שנגרםจากการתחממות מהירה באוויר סביב הפעולה החשמלית.
  weather.sunny:
    label: แจ่มใส
    summary: ฟ้าสางพร้อมดวงอาทิตย์สดใสราวกับมีเมฆเลย
    info: สภาพอากาศแจ่มใสเกิดขึ้นเมื่อไม่ได้มีเมฆบังแสงอาทิตย์ สุริยะให้ความสว่างและความอบอุ่นที่จำเป็นต่อชีวิตบนโลก
  weather.sunrise:
    label: זְרוּיחוֹת
    summary: רגע בו שמיימדים מעל האופק בהתחלה היום.
    info: הזריחה היא רגע אסטרונומי שבו עיגול השמש חוצה את האופק. הצבעים שלה (כתום וורוד), נובעים מהפיזורה של ריילי אור הגל geli. באזור הקוטב מתרחשת זריחה בתקופה מיוחדת (יום קוטבי ולילה). פלא ירוק הוא תופעת оптика ייחודית שנראית במהלך הזרחות באטמוספרה чистая.
  weather.sunset:
    label: שקיעה
    summary: רגע בו الشمس מתבדרת מתחת לאופק בסוף היום.
    info: |-
      שקיעה היא רגע של יום שבו השמש מתרחקת מתחת לירחון.
      The פlettא של צבעים (כתום, אדום, סגול) נוצרה על ידי הפיזור אור שמיימי.
      one הרגע הכי יפה שקיעות קורים אחרי פריצתי געש כאשר האבק באטמוספירה מחזק את הצבעים.
  weather.thunderstorm:
    label: бурма
    summary: явление אטמוספרי עז עם סגנונות, ברקים, גשם ורוח
    info: |-
      бурמה נוצרת במעיינות קומולונimbus עצומים reaching מעל 10ק"מ altitude
       разряд молнии הוא electrostatic discharge המתחם את האוויר ל -30 מעלות צלזיוס תוך שבר שנייה
       רעש התרסקות הוא תופעת звук מהיר של הרחבת אוויר חמים
  weather.tornado:
    label: טורנדו
    summary: עמוד אויר מסתובב הרסני המחבר את הoblako לאדמה
    info: טורנדו הוא עמוד אוויר סיבוב מהיר שנוצר ממעלפת ומחבר בין הענן לพื้ן האדמה. רוחות בטורנדו עשויות להגיע למהירות של מעל 500 קמ
  weather.typhoon:
    label: ไตphoon
    summary: טורפקאי קירלון בצפון המזרח הפסיפי עם רוחות חזקות מעבר לקוֹ
    info: |-
      טיפון הוא שם אחר להוריקן בפיליפינים, סין וژאפו前后。
      The Philippines נפגשות בממוצע כ־20 טיפות בשנה.
      הטיפה נינה (1975) גרמה לשיטפונות בסין שגרמו למותם של יותר מـ229,000 אנשים.
      השם ככל הנראה בא מהסינית 'тай פונג' (רוח גדולה)
  weather.waterspout:
    label: water spout
    summary: Водяное облако соединяет море или озеро с тучей.
    info: водяной смерч - это вращающийся столб воздуха над водой. Опасный торнадообразный водяной смерч формируется из грозы, а более слабый дневной водяной смерч возникает из кумулонаимба. Он может всасывать рыбу или других животных и переносить их на берег.
  weather.whiteout:
    label: צ'אט דק
    summary: ה황מה של暴风雪 פולרית שבה הסנף מאבד כל קונטרסט.
    info: במצב של וויטאאוט (white out) סופת השלג וה반สะלע מהשלג גורמים לשמיים ומהארץ להסתלבש למשטח לבן אחד. מצב זה מספק זיהוי אפסי וחוסר תיאום מרחבי. הוא极具 опасות בمناطق קוטבית או górתי. טייסים עשויים להיות חסרי התמצאות ולтраוח את קו האיזון.
  weather.windy:
    label: ลมแรง
    summary: การเคลื่อนไหวของอากาศหนักบิดขี้เล่นกับต้นไม้และการพัดเศษกระดาษไปด้วยลม
    info: '{"hint":"\"אוויר חזק נייד יוצר סערות ועצי עץ","info":"הרוח מתרחשת על ידי חימום לא שווה של פני השטח הארציים, מה שמוביל לזרימת אוויר מאזורים עם לחץ גבוה לאזורי לחץ 낮.","label":"ลมแรง","summary":"การเคลื่อนที่ของอากาศอย่างรุนแรงทำให้ต้นไม้มีความโค้งและใบปลิว."}'
