lang: fa
pivot: false
title: آب و هوا
cards:
  weather.aurora:
    label: تابش قطبی
    summary: چشم انداز طبیعی ناشی از واكنش ذرات باردار خورشيد با غلاف زميني.
    info: طبیعی‌ترین نورهای رنگارسپند در آسمان شب به دلیل باد خورشیدی است که با مغناطیس فضائی اثر متقابل می‌کند و پرده‌ها، سهموی ها و جلوه‌های قرمز، بنفش و سبز تولید می‌نماید.
  weather.avalanche:
    label: лавین
    summary: جرم برف و یخ فروافتادنی از شیب کوه.
    info: لاروینا حرکت سریع جرم برف روی شیب کوه است، خطرناک‌ترین نوع لاروینای پودرن ابرف با سرعت بالاتر از ۳۰۰ کیلومتر در ساعت محسوب می‌شوند و به طور متوسط هرساله ١٥٠ نفر را در آلپس می‎کشدند.
  weather.blizzard:
    label: ابرشَبه
    summary: افسانه‌وارترین نوع ابرشنه با بارش غرقابی و وزش بالا که دید را به حداقل محدود می‌کند.
    info: سیل ابرشنبه، پدیدۀ قوی‌ای است که بارش شن و ماس با وزش جیرجاه را ترکیب می‌کند. منجر به دید نزدیک صفر (واحِت سفید) و زمین‌گرفتهٔ سنگین می‌شود. در طول سابقه، توفان‌های ابرشنبه هزاران مردم را فوت داده‌است؛ برای مثال «توфан ابرشنبه» آمریکا در سال ۱۸۸۸ شهر نیویورک را تحت حملات چهل انچ لغزنده قرار داد.
  weather.breezy:
    label: بافورتو
    summary: نوعی باد لطیف و پوسته‌دار هوا
    info: باد ملایمی با سرعت بین شش تا ۱۲ کیلومتر در ساعت است و برگ‌ها، موها و اجسام نازک رانده می‌شوند. فizioloژيکاً دما حسی زمستان را به خاطر جذف عرق بالا می‌برد.
  weather.clear:
    label: روشن
    summary: در هوای عالی تمامی آسمان تمیز است.
    info: آب و هوا با ابری بسیار کمتر از ۱/۸ پوشش آسمان است، به‌طوری که قوی‌ترین نور خورشید را تامین می‌کند و شرایط مناسب برای مشاهدات ستونی فراهم می‌نماید؛ در شب بدون ابر زمانی که دما سردتر است، حرارت جلوگیری از رسوب صبحگاهی مواد غذائی روی محصولات کشاورزی مفید است.
  weather.cloudy:
    label: barani
    summary: آسمان با لایه ضخیم ابر بدون نور مستقیم خورشید.
    info: '{"hint":"آسمان پوشیده از ابر، خاکستری و تار","info":"ابرها جمع‌شدهٔ ذرات کوچک آب یا بلورهای یخ هستند. بیشتر از ۶۰ درصد آسمان زمین همواره تحت پوشش ابر قرار دارد.","label":"بارانی","summary":"آسمان با لایه ضخیم ابر بدون نور مستقیم خورشید."}'
  weather.cold:
    label: سرما
    summary: دمای بسیار بالاتر از نقطه انجماد
    info: |-
      سالنی سخت و مرازها زمانی اتفاق می‌افتد که هوا آرکتیک به مناطق معتدل نفوذ می‌کند
      پایین ترین دمای طبیعی ثبت شده روی خاک جمهوری فوستوك در قطب جنوب است، حدود منهای ۸۹٫۲ درجه سانتيگراد
      بدن با تنگ کردن رگ ها و لرزاندن عضلات برداشتن حرارت پاسخ می‌دهد
  weather.dew:
    label: رش
    summary: نقطه های آب حاصل از انعقاد لحظات قبل از طلوع خورشید.
    info: روش به عنوان آبی است که از هوای سرد در شب‌های بی‌دردگرم روی پوسته تشکیل می‌شود، زمانی رخ میدهد که دمای سطح فراتر از نقطه شبنم برود و منبع مهمی از تأمین نیاز جاندارها و گیاهان خصوصاً در محیط های خشک باشد.
  weather.drizzle:
    label: بَرِف
    summary: برف خيلي سبك با ذرات ريز.
    info: برف‌باری با قطره‌های بسیار رنین کمتر از ۰٫۵ میلی‌متر است و ناشی از ابري سطحی پائين نيست، بلکه از لایه‌های فشردهٔ ابر در مناطق تابش زدگانه به وجود مي آيد. اين نوع برفياري عموماً در محلي كه دما بالاست مثل جغرافياي انگلستان يا شمال غرب فرانسه ديدي ميشود.
  weather.drought:
    label: خشک
    summary: عدم پدیدارشدنش بارش طوالانی علت فقرآبی میباشد.
    info: خشکی وضعیت هواشناسی است که با وجود عدم بارندگی طولانی مدت رخ میدهد و منجر به از دست دادن محصول، قحطی آب و حریقها میشود. در جمهوری چک خشکسالی سالهای ۲۰۱۵ تا ۲۰۲۰ بدترین حالت برای ٥٠٠ سال قبل بود. گرم شدن عمومی زمین نیز خشکسالی را در مناطق متعدد روی زمین وخیم‌تر میکند.
  weather.dust_storm:
    label: بوزورخ غبر
    summary: پله غبر سنگین تحت تاثير وزش قوي بادي
    info: |-
      بازانگی در مناطق خشک به‌وجود میآید وقتی باد شدید ذرات را از زمین بلند کنده و بالاتر برود
      در آفریقا، بازار ساحلی نام دارد
      ذرات غبار حوضهٔ صحرای عربستان همواره روی جغرافیای استوائی تأثیر میگذاشت؛ پژوهشهای علمی فرضیه وجود نقش موثر رابطهٔ طولانی مدت را ثابت کرد
  weather.flood:
    label: زاگربلاو
    summary: پراچاری آب از داخل حوضه‌های آبهای دائمی به عرصه‌های عموماً خشک
    info: |-
      سیل آب در اثر بارش‌های شدید، ذوب سفته و ترک دامنه‌ها به وجود می‌آید
      در جهان، سیلاب هزینه برتر فجائی طبیعی است
      در کشور ما زاگربلاو روزنبرت نقص با خطرات بالغ قتل و صدمه‌های غیرقابل اندازه‌گیری رقم پولی در سال‌های ۱۹۹۷ و ۲۰۰۲ روی داد
      روشهای محیط زیستی ضد سیل مثل مراعی و جنگلهای مناسب نقش مهمی در کاهش خطر دارد
  weather.foggy:
    label: مه
    summary: پوشش پایین ضخیم ناشی از ماه باعث کاهش بصری تابستان می‌شود.
    info: ماه هو ابری است که در سطح زمین تشکیل شده و شامل قطرات آب معلق است، هنگام رطوبت بالا به وجود می‌آید و دید راندوزتر از ۱ کیلومتر می‌سازد.
  weather.freezing:
    label: یخ زدگی
    summary: دمای پائین‌تر از نقطهٔ انجماد باعث میشود آب بیفروشد.
    info: "{\"label\":\"یخ زدگی\",\"summary\":\"دمای پائین‌تر از نقطهٔ انجماد باعث میشود آب بیفروشد و همه جا منجمم شود.\",\"info\":\"در دماهای کمتر از صفر درجه سانتی‌گراد، آب به لغزنده تبدیل میشود. \nاز نظر زیست محیطی خطرات را برای گیاهان فراهم میکند؛ وجود چربنده روی جادهها حادثه حرکتی را افزایش میدهد. \nقویترین یخ زدنی‌ها در چکسلوواک عمومًا در ژانوار است(حداقل سابقه ثبت شده حدود -۴۲°C در شهر لتونوفس در سال ۱۹۲۹). \nبرف حالت جامد آب است؛ تشکیل آن در ابرها به دما و ذرات مشخص تعتمد دارد.\"}"
  weather.frost_flowers:
    label: گل‌های یخ
    summary: البته مناسبترین حالت لخته کردن آب برروى سطوح سرد.
    info: |-
      گل‌های یخ به دانش تبدیلات تشکیل شده از رطوبت مراحل سرد بر روی پوسته ها بسیار خنک است
      در درياي قطب شمال، الگوهاي کريستالي جذاب و نازك يخي وجود دارد
      آنها با زيبائي غيرمعمول بصري مشاهدات فتوچرافي طبيعي را تحت الشعور قرار مي دهد
  weather.frosty:
    label: صبح یخزنده
    summary: پراشتارس جینوواتکا؛ بلورهای یخ روستاهای گیاهان و زمین.
    info: جینوواتکا زمانی اتفاق می‌افتد که دمای سطح به زیر نقطهٔ انجماد برسد و رطوبت هوا منقرض شود، باعث تشکیل الگوهای خوش در روی برگها، پنجره‌ها و سطوح مختلف می‌شود. جینوواتکا تفاوت مهمی با چرم فصلی مثل یخزدن دارد؛ جینوواتکا یخبندان هوائی است ولی یخزدن ناشی از انجماد قله آب است.
  weather.gloomy:
    label: ابر
    summary: آب‌وهوای غلیظ و داغ با جوا روح‌خوش.
    info: هوای تاریک و ابرفراش با نور کم، همراسته سرد شدن هوا یا باران است. به عنصر ملالنچولی در فصل پائیز معروف است. اختلاص موسمی SAD عامل آن وجود خورشید زدگی طولانیتر در زمستان است.
  weather.hailing:
    label: کروبوبيتي
    summary: بارش حباب منجمد؛ این حباب‌ها ممكن است فصل غذا و ماشين رو بشكن.
    info: کرُپوبیتِ ته نزول ذرات جامد اسحاق‌بندان لَذّاتاً در بادلاب هست که به صورت سرمایش و حرارت متناوب قطرات آب داخل ابرها تشکیل شده است. اندازة این حبات ممکن است بالغ بر دهم سانتیمترا باشد، و خطرناكترین ضربه را به محصولات زراعي، ماشين‌آلات و پوششهای ساختماني وارد کنه.
  weather.haze:
    label: اُوارِر
    summary: تقليل ديد بر اثر غبار، دود ياآلودگي.
    info: اُوَارِر به معنای کاهش دید ناشی از ذرات ریز، سیلاب و آلودگی هواست. تفاوت آن با مه مشخص است؛ زیرا مه شامل قطرات بخار آب در هواست ولی اُوارِر حاوی ذرات جامد یا مايع پراکنده شده در فضا مى‌باشد. شهرهاي عظيم آسيا عمومًا تحت خطر سمّوژ(ترکيب اُوارِر و صناعت) قراردارند.
  weather.heat_lightning:
    label: برق‌گوشتِ گرم
    summary: چشم انداختن به جرثقالت بدون وجود صدات
    info: |-
      بازتاب‌هایی از رعد و برق دوردست هستند که صوت آن به دلیل فاصله زیاد قابل شنو نمی باشد
      عنوانشان مخدوشکن است؛ ولی نوع خاصی از جرثقیله علت حرارتی ندارد
      ما فقط تا پانصدسومتر جلو،جرثقالها رو بشنو می‌کنیم؛ بلعمرخدا ساکت‌ترین هاست
      در شب‌های تابستان در هوائی تمیز بر حاشیهٔ افق مشاهده میشه
  weather.heat_shimmer:
    label: مرین
    summary: تغییرات بصری بالای پوسته های گرم؛ خطاهای نظر.
    info: مَرِنی به معنای جلوه‌گرانش نور در هوای داغ است که باعث ایجاد تصاویر غلط مانند حوضچه روی سطح خاکستر و آسفالت هوازد تابستان می شود.
  weather.heatwave:
    label: حر
    summary: دوره‌ای طولانی از هوای فوق العاده گرم؛ تهدید بهداشت.
    info: موج های کوچک طولانی مدت از دماهای بسیار بالا است که فراتر رفته نسبت به دمای عادی فصل، در سال ۲۰۰۳ موج حرارتی اروپا باعث مرگ و میر حدود ٧٠هزار تن شد. خطرات زیستن برای پسران جوان، والدين كهن و بيماريها وجود دارد.
  weather.hot:
    label: دردم
    summary: حرارتشد مرتفع برخورد به عدم راحتی و خطرات بهداشتی.
    info: گرما بیش از حد، پدیده‌ای هواشناسی است که دمای آن به طور قابل توجهی بالاتر از متوسط فصل باشد. در تلفظ با رطوبت نسبی می‌تواند منجر به حالت جوش شدن و خطر زندگی بشود. در چک سلسول حرارتی دمای هوای بالا از ۳۸ درجه سانتی‌град عبور کرد.
  weather.humid:
    label: رطوبت
    summary: هواءاشبوع از بخورآب؛ حساسیت حرارتی پوست
    info: |-
      رطوبت مقدار بخار آب در هوا را اندازه‌گیری می کند
      درصد نسبی رطوبت به معنای اشباع هوادارد؛ وقتی فراتر برود، آب تقطیر خواهد شد
      رطوبت بالا باعث حس داغ و سوزان است زیرا عرق جذف نمیشود
  weather.hurricane:
    label: هریکن
    summary: چرخند جغرافیائی قوتمندانه با بادها بالاتر از ١٢٠ كيلومتر في ساعته.
    info: طوفان هریکن در اقیانوس آتلانتیس و شرق پاسیفیک است با بادهای فراتر از ۱۲۰ کیلومتر بر ساعت، نام‌گذاری دوباره به عنوان تاجُون (در غرب پاسیفیک)، یا سِیرَج (اقیانوس مندIBLE). انرژی طوفان هریکن معادل صدها بمبهای اتمی روز میباشد.
  weather.ice_storm:
    label: برف يchie
    summary: بارش يخب كشيدي كل شيرو تو لايه اي ديفركت يخ.
    info: سیلاب یخ‌گرفته زمانی اتفاق می‌افتد که هواي گرم روی لایۀ سرد باعث بارش شود و آب به طور فوري منجمد شده است، در نتیجهٔ این حالت تمامی چيزها مثل شاخه‌ها، رساناکنندگان الکتریکی و جادو بر لایة ضخيم پرشفاف يخي قرار دارد؛ شبكة توزيع انرژى الكتريكي تحت وزنش بشدت خسته شده و بلاتوك ميشه.
  weather.icy:
    label: نالدي
    summary: توليد يك ضروري كليزي موثر در مناطق سرد.
    info: یخ‌زدگی اغلب به دلیل جم شدن قطرات باران و تبدیل خاکستر سفید در روی پوسته های فروزنده تشکیل میشود، که باعث افزایش خطر برای حملونقل در زمستان می‌شود. لغزندگی ناشی از وجود لااقل عمق آب روان روی صفحه است.
  weather.lightning:
    label: بازرد
    summary: جرقه الکترواستاتیک بین ابرها با زمین.
    info: برق‌گرما زمانی اتفاق می‌افتد که اختلاف بار الکتریکی در ابر توفان به حد نقدی رسد و جرقه قوی تولید شود، سرعت برقتقریباً ثلث سرعت نور است. همچنین روی زمین فرضاً صدها برقة در ثانیة ضرب می‌شوند.
  weather.misty:
    label: ملحاف
    summary: در هوائی که قابل مشاهده ضعف وجوددارد، به دلیل ذرات غبار یا بلندی مواد آلاینده.
    info: آب‌های بخار در لایۀ هوا به صورت ملایم کنده شد، باعث ایجاد آسمان پر از ناپختگی و تاری است. فرق مهمش اینجاست که دید ما فقط کاهش میابد ولی زیر ۱کیلومتر نمی رود؛ بنابراین جلوگرفتن خوب برقرار نیست. عمدتاً روی سطوح آب مثل رودخانه‏ها، لاچینو و حوضه‏های طولانی بعدازشب سرد تشکیل میشه.
  weather.monsoon:
    label: مونسون
    summary: تغییرات فصلی وزش بادها باعث بروز طوفان‌های سنگین بارانی می‌شود
    info: |-
      موسم شرقی، پدیده‌ای اقلیمی است که به دلیل معکوس بودن جریان هوا در فصول مختلف مابین آب و خشکی رخ می‌دهد
       موسم شرقی منطقۀ حوزة هندوستان باعث تولید ۷۰ الی ۹۰٪ سالانه بارش در دوره زمانی ژون تا شهریور می‌گردد
       حداقل ٧٠٠ میلیون نفر بر روی موسم شرقی برای کشاورزی متکی هستند
  weather.muggy:
    label: دش‌نو
    summary: هوای گرم و مرطوب غلیظ سبب حالت فشار در نفس کردن می‌شود.
    info: دش‌نوا، ترکیب دمای بالا و رطوبت نسبی زیاد است. رطوبت بسیار باعث جلوگیری از تبخّص عرق می‌شود که بدین طور بدن قادر به خنک شدن موثر نخواهد بود.
  weather.overcast:
    label: پوشیده
    summary: همۀ آسمان با ابرهای قهوه‌ای بدون نور مستقیم خورشید پوشیده شده.
    info: آسمان پوشیده زمانی اتفاق می‌افتد که نسبت ابرکرده برابر با ۷/۸ یا هشت به هشت است، و در آن حالت نور دیفروز شدید وجود دارد ولی سایه تشکیل نمی‌شود. عدم رسیدن مستقیم خورشید نقش مهمی در اختلالات فراموگرفته جغرافیائی مثل سندرم روز طولانی (ساد) دارند؛ بنابراین تابش نوروتنچ مرتبه بالاست.
  weather.partly_cloudy:
    label: parvo jashno
    summary: آسمان جزوئالاً تحت پوشش ابر؛ تعامل خورشید و سایه.
    info: پارو جاسنو حالتی هواشناسانه است که در آن ابر بین سوم تا پنجم از قسمت‌ها وجود دارد. بهترین نوع شرایط هوائی برای فعالیتهای بازدستانی محسوب میشود و شامل ابر انباشتگانه(کامولوس)است، که در نسخهٔ چرب روز تشکیل میشوند.
  weather.rainbow:
    label: دوها
    summary: پس از باران وقتی که خورشید روشن باشد، منحنی رنگارنگی برروی آسمان مشاهده می‌شود.
    info: دایره‌ی رنگارنگ دوها به علت شکست و بازتاب نور خورشید در قطرات بخار آب تشکیل می‌شود. این پدیده شامل هفت رنگ قرمز، سرخابی، زرد، سبز، آبی، بنفش و فرابنفشه است.
  weather.rainy:
    label: baran
    summary: در حالت عادی، قطرات آب از ابرها به عنوان باران فرو می‌پاشند.
    info: باران از کنденس شدن بخار آب در ابرها به وجود می‌آید و برای پرکردن رودخانه ها، استخرهای طبیعی و منابع ذخیره سازی آب نوش جداسازی نشده ضروری است؛ فشار متوسط باران با سرعت حدود ۹ متر بالاتر از زمین قرار دارد.
  weather.sandstorm:
    label: تُفَّاحِل
    summary: جدول سنگین از ذرات غبار و سمنت حمل شده با وزش قویتر طرف صحراء
    info: |-
      بوفه از زمانی که باد شدید مقدار عظیمی پر و سمن را بلند می‌کند، به وجود آمد
      حبوب نوع خاصی از توفان های نسوز در مناطق صحرائی است
      در بعضی مواقع می تواند روستاهای فراموششودن جغرافیایی را دفن کرد
  weather.shower:
    label: باران
    summary: سرماخوردگی طولانی ولی سنگین
    info: گرفتگی ابرهای کونوکتیو به‌صورت مختصر و شدید است، مثل سرماخوردگی در فصل تابستان ناشی از حرارت خورشید باعث تشکیل ابرهای Cumulo-nimbus بعدازظهر می‌شود. باران پس از آن روز دارد.
  weather.sleet:
    label: بَرفِ سُروخ
    summary: ترکیبی از باران و برف؛ ذرات برف نصف حل شد.
    info: برف‌بارانی که در هنگام عبور از لایۀ هوائی داغ به جوش می‌آید، بارش سرد نام دارد و باعث پوکر شدن زمین توسط چرباله می‌شود. خطرات حملونقل را فراهم آورده است.
  weather.slush:
    label: برف ترشح
    summary: لایه مرتبه زمستانی غیرقابل تحمل شامل برف و مواد آبی.
    info: برف ترشحی زمانی اتفاق می‌افتد که دمای هوا به طور خنثا بالاتر از نقطه انجماد باشد و برف شروع به ذوب شدن کند، نتیجه آن سطح لغزنده است که برای پیاده روها و رانندگان خطرناک است؛ در جلوتر ماشین‌ها منجر به فعالیت آبی می‌شود و قدرت عامل تماس لاستیک را کاهش می‌دهد.
  weather.snowy:
    label: بارش برف
    summary: ذرات رزینک بر روی خانواده نازل می‌شوند.
    info: برف زمانی اتفاق می‌افتد که قطرات آب در ابرها به صورت بلورهای یخ تبدیل شوند - فرفره ها. هر ذره برف دارای ساختار متقارن منحصر به فرد است.
  weather.stormy:
    label: 暴雨
    summary: 有闪电、打雷和强降雨的剧烈天气现象
    info: 暴风雨是在高积雨云中形成的。闪电是电流；雷声是由闪电周围空气迅速加热而产生的声音。
  weather.sunny:
    label: آفتابی
    summary: سماء پرتوان بدون ابر.
    info: هواي آفتابی وقتی اتفاق می‌افتد که غمگین نباشد و تابش خورشید را ببلاکه نکند، در اين حالت فضا باز است و دسترسی به طولانیترین زمان برای لذت بردن از شعاع هاي حرارتی وجود دارد.
  weather.sunrise:
    label: سواد
    summary: لحظهٔ ظاهر شدن خورشید از افق در اوّل شب.
    info: سَواد کردن زمانی اتفاق می‌افتد که دایرهٔ خورشید به سمت بالا از خط افق عبور کند و نخستین لحظات روز آغاز شود، همراه با تغییر فصل در مناطق قطبی مثل «روز طولانی» و «شب بلند». پدیدهٔ غرق شدن ذرات جلوتر بر روشن بارنگی محصولِ انحراف نور است؛ بنابراین رنگ‌های مختلفی مثل نارنجی و صبحک مشاهده می‌شوند.
  weather.sunset:
    label: ذوب شديد
    summary: لحظه اي كه خورشيد تحت خط افق غروب ميكند.
    info: ذوب‌شدن خورشید زمانی است که نجوم به سمت افق پایین میرود و در آن لحظه، طيف رنگي شامل تونرهاي نارنجي، قرمز و بنفش وجود دارد كه باعث شدفتي نوري ميشود. جلوه هاي برجسته ذوب شديدها بعد از فعاليت هاي مايعات منجمد مثل انفجار يك فيلتر صاف بر روشي ديگر حساسيت بالائي به تصوير ميارند.
  weather.thunderstorm:
    label: بوفرکا
    summary: 一种伴有闪电、雷声和强降雨及大风的强大大气现象
    info: |-
      暴风雨在积雨云中形成，这些巨大的云层高度可达超过十公里。
      闪电是静电放电现象；一道雷光可在一秒钟的几分之一时间内将空气加热至三万摄氏度。
      轰鸣声是由热空气中迅速膨胀所产生的声音效果。夏季时太阳照射地面并引发对流气流从而产生风暴。
  weather.tornado:
    label: تورناتو
    summary: توتندا ستون هوائی مرگباری است که از ابر تابستانی به طرف زمین حرکت می‌کند.
    info: تORNADO از بادهایی تشکیل شده که با سرعت بالا در جو حرکت می‌کنند و به زمین متصل هستند، عمومًا ناشی از توفان است. سرعت وزش آب تقریباً ۵۰۰ کیلومتر بر ساعت را دارد. پدیدارشدنش فراوان‌تر در منطقۀ آلِ لُردَس در امریکاست؛ البته در جمهوری چک نیز وجود دارد ولی خودرو تنها حالت غیرمعمولی است.
  weather.typhoon:
    label: تايفون
    summary: تصنيفاتي سيكلوني در شمال غربي پاسifik با وزش بزرگتر از ٧٥ ميله ساعتي.
    info: تایفون نامی است برای اعصار در فلیپین، چین و جاپان. به طور متوسط هر ساله بیشتر کم‌کنند تعداد دوادسده حملات تائوفون را تحمل می‌نمود. تاءفوُن نِنا (۱۹۷۵)، منجر شد به سیلاب در چین با خروج زمانی بالغ بر ٢٣٩٬٠١٨ قربان.
  weather.waterspout:
    label: سُرمَهٔ آب
    summary: ستون هوائی درحال حرکت برجوشِ دريا يا لايه اي را به ابر متصل مي كرد.
    info: یک سُر مه به صورت ستون هوا در حال دوران روی منطقۀ آبی است، که از طوفن‌ها شروع میشود؛ نوع ضعیف ترش با عارضۀ جوئی خوب ناشی از کومولونimbus است و قادر به بلند کردن ماهی ها و حیوانات دیگر برای پرواز به زمین فراخاست.
  weather.whiteout:
    label: تاری شب
    summary: وضعیت طوفان قطبی است که منجر به فقدان تمام مقادیر عمق تصاویر می‌شود.
    info: واحدهای سفید رخ می‌دهد وقتی توفان برف و بازتابش آن افق زمین و آسمان را در یک پوسته سفید ترکیب کند، همانطور که نام انگلیسی «white out» به خوبی مشخص می‌کند. این حالت دارای عدم دید قطعی است و فرد شما را جابجا می‌کند؛ بنابراین برای وجود در محیط‌های قطبی یا کوهستانی مرگبار است.
  weather.windy:
    label: برف
    summary: حرکت قوی هوای موجود حول محور درختان.
    info: باد به دلیل تفاوت در حرارت سطح زمین اتفاق می‌افتد که باعث جابجایی هوا از مناطق فشار بالا به مناطق فشار پائین شده و نتیجه آن بارش، خمش درختان و بلند کردن برگها است.
