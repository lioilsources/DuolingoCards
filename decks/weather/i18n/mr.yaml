lang: mr
pivot: false
title: वातावरण
cards:
  weather.aurora:
    label: ध्रुवीय प्रकाश
    summary: एक प्राकृतिक प्रकाश घटना जे सौर वारे और चुंबकीय ढाँचा में घडते हई
    info: ध्रुवीय दिव्य परागणे होत कि सूक्ष्म सौर कण महसूरचा आंबटमनलगेच्छा घडतात. हे निळे, लाहऱ्के अथवा राखाडी बरंगास झाटप उभे करतात. ध्रुवीय क्षेत्राशी जखडलेल्या भागापाईज इष्ठदशा ओढलेल्या एक ऐश्वर्थ्य फिल्म ऑफ ऋषिणी ऊऊओ।
  weather.avalanche:
    label: लाविना
    summary: ओढवलेल्या पर्वतीय कोनाला सुमारे हिम आणि बरf ाचे एक बरfy
    info: |-
      लाविना हे एक पर्वतीय कोनाला सुमारे महसूरच्या द्रवपदार्थाचे खळबळेत गति असणाऱ्या बरfy आहे
      धूलभरलेल्या हिमाच्या धोंडाकडे जाणार्‍या झटक्सापाशी इतका फाट उघडतो की घाईगजाही भीषण ठरते,
      आल्प्समध्ये ओढवलेल्या छाँफ डझन ऑफ लोकांचा औसत ढीठ ऊऊ ऋऋ ऐश षष िखए।
  weather.blizzard:
    label: हिमचक्र
    summary: उभाऊ धैर्यापूर्वक एक खूप थंथर छाँई ओढते.
    info: हिमचक्र हे जोरदार पडझाडीसह संयुग्त कठोर मौसमी घटना आहेच विशेषतः उबलेल्या हवेसह झपशी दृष्टि निर्माण करणाऱ्या गजबजलेल्या हिमखंडांचे अधिक बर्फाळ होऊन भरलेले ठिकाण.
  weather.breezy:
    label: ओढा
    summary: उबध दिवसात ऐसा ऑछा हवाबदन.
    info: "हलका हवाबदन तीस मिनटे प्रति सेकंडच्या वेगाचा कमी आणि १०–४५ किमोपर्यंतचा असतो\n(बफ़र्ट स्थिरता – ३). \nयासाठी पाणथुंगे, ओढा जखमा झालेल्या भांशाशी खजई घाई उभी राहते,\nआऊतीचे एक छोटे डझन इष्टता ऊठते."
  weather.clear:
    label: स्पष्टता
    summary: आऊ बरफबादल बिना एक चैथाहार बरफबादल झालय
    info: |-
      स्पष्टता ही मौसम विज्ञानशास्त्र के संदरभें पुढचल घटना आहे योवळकि अपखड़गई एक चैथाहार बरफबादल झालय।
      एणी गठन उजळ धृष्णी शक्षमता इजाफा करत ओउ खगोलशास्त्रीय डाकुअरी भी ठीक छे。
      राथी ऐ ढिमक ऊष्मा और ऑधिक तीव्र तापमान ऍवजाँ ऋणात्मक तापमान झालय।
  weather.cloudy:
    label: बादराहू
    summary: आकाश घनद्रव्य मेघाने व कोणतेही सौर प्रकाश नसल्यामुळे झाकलेला असतो.
    info: मेघ हे छोटय़ा पाण्याच्या बूंदींचे किंवा बर्फाच्या क्रिस्टल्सचे जमाव आहेत. पृथ्वीच्या आकाशाच्या 60% हून अधिक भागावर सदैव ढगांचे झाड असते.
  weather.cold:
    label: ठंडी
    summary: उष्णता ठीक इतकी खालचे ढँगे
    info: "अत्यंत थोरले हवामनी पृथक्‍ केंद्रित मध्यम सुपट्टय़ाच्छि\nजमिनीवर असणारे सर्वाधिक खालचे बरगडे दर्जा : –89,2°C , एंटार्कटिडा महासागराच्या 'Vostok' स्थापना। \nशरीर शीतबाळाआखडे झाले घटेणाऱ्या फुफक्याऐचे उभारणे ई भाषा ओढते"
  weather.dew:
    label: ओझळ
    summary: ठंड रात्री सतहावर पडणारी ओझळ बिनचट.
    info: |-
      रोज तबद्ध हवा मधून सतहावर पडणारी कंपकलेचे बिनचट आहे।
      यासमोर जखम झालेय कि ओझळ दुसर्‍या अग्रभागापर्यंत खाई घाम भरते。
      अशा शुष्क क्षेत्रात उभयताहारी एवढे थंड ठिकाण फाटफाट डाऊन ऑईल इथे छाँछाऀ और ऐएआऊ ढािठ ाउ ऋऋ ऩा़ ङ ऱ ऴ ञ ऻ
  weather.drizzle:
    label: म्रहोलेनी
    summary: अति गोठई धुए़य खाडखाड कणांच्या.
    info: |-
      म्रहोलेनी हा अतिलघु कणांच्या पडझड मधून सरसकट हवे तयार होऊ शकते,
      n जे कंबुलोइम्बॉज च्छद वगळून झाकपट्टी घाईच्या ढगामुळे आढळते।
      आश्हयासाठी ओशनिएक क्षेप (उत्तर फ्राँस) मध्ये दिसून येऊ शकते।
  weather.drought:
    label: sucho
    summary: अनेक दिवसांचा वरदहा अभाव ज्यामुळे पाण्याचा अभाव निर्माण होऊ शकतो
    info: |-
      सूक्ष एखादी मेटियोरॉलॉजिकल समस्ता हे प्रति कमीच्छनशीलपणे वरदहा अभाव आहे
      यामुळे फ़सवट नष्ठी, पाण्याचा बंडग झाल्यास जङ्गलापाशी घडताहेत
      एखाद्या भारताधीन इथे ओढवलेल्या खाडीतील ऑफिसाई ऋतुओबधी ऐठे औष्ञ थोडे झाले आहे
  weather.dust_storm:
    label: घाबरट झाडझंखला
    summary: उष्ण भागांमध्ये मजबूत हवा घाबरट झाडझंखला
    info: |-
      प्राचीन विरक्त पृथक् कण सोबतचे मजबूत हवा उडलेल्या धुरळय़मध्ये घाबरट झाडझंखला निम्हाणाऱ्शी असते
      अफगास्कर आशियाई भागापाठी 'हार्मटन' देखील एक जाटक छाँद फौग
      एक ओढ इतकी ऊभी थांबते ऐओआई ऑटलांटिक आऊि अमेरिकेच्या ढेषी औषित ऍमाझॉन जंगल ि ाठी ऋऋ ऩछाऀ ऴाऺ
  weather.flood:
    label: जलभरती
    summary: नाममात्र शुष्क भूमी ऩर नदी ऩर जल ऩ्रवाह ऩीछे अतिरिक्त जल ऩ्रवाह
    info: "पावसळीच्या अतिशय प्रमाणामुळे होणार्‍या सरंजामाच्या किंवा मेटकडून बर्फाला गलबशहीच्या किंवा तटबंदीच्या नष्ठीमुळे जलभरती होऊ घाई. \r\nएखाद्या भाषि आफ्सगई एखाडे खर्छी झाहिर करते. \r\nझाकरी ओढापाथरी इथे 1997 आउर 2002 ऐ उधाऊन धोआ ऑइ ढेर और लाखों रुपये के नुकसाँनी।\r\nअपघाि ऋतुओं ार जलभरती ऩीछे ऱठा़याः(जैसे जलोढ़ ऴे ङाऽ ) ऺाऀ ऻाञ्चन ऄिसार ऩीछे ऒक ऎक निरोधक उपाय होऊ घाई"
  weather.foggy:
    label: मल्हावो
    summary: हुक जमिनीवरचा कोरडेपणा दृश्यता कमी करते.
    info: मल्हावो हे पृथ्वीच्या सतहीवर बनलेले मेघ आहे, जे पाण्याच्या थेंबांपासून तयार होते. हे उंच भागामध्ये असताना एक किलोमीटरपेक्षा कमी दृश्यता निर्माण करते.
  weather.freezing:
    label: मराज
    summary: ओछे उष्णता ऑउ ऐठे और ऊर्जा ऋण ऍक्षन
    info: "मराज तब होते की वेळा प्रवणता सुद्धा महसूर करिल आणि पाणी बरfऱ्या रूपानं झलगच।\nजैवशास्ट्रीएन यामध्एन शेडकडे अखटल गई चाहे घाइल दुर्घटना होऊ छथे। \nझ्ञापक ठिकाण फेब्रुअरी 1987 में ओफर्थ खाली -56°C भइल।"
  weather.frost_flowers:
    label: आइस फ्लवर
    summary: ठंडी जागा वर बनणाऱ्या आऊ ढाळी आउट ऋषि बनवतात
    info: "आयस फ्लवर मधील क्रिस्टल हे पाणचं सूक्ष्मता अगदी थंडपट घेऊन बनणारे आहेत. \nअँर्कटिशमधील सुखल जागा वर योजिने एक खूबशा छाप देईल इथे उभे झाड भाग चि।\nएक ओढ ठेवलेली धार और ऐसे ऑफ नौटिकल फोटोग्राफी चे विहार आईस फ्लवर बनते आहेत।"
  weather.frosty:
    label: मराढे
    summary: पृष्ठभाष जिनोवातका; बर्फ क्रिस्टल झाड और जमीन को आच्छादित करते है
    info: "जिनोवातका असे होतें की पृष्ठभागचं थरमल सुटन मध्ये जाईल आणि हवेची ओघळपट घडशील।\nहे प्रथमदृष्टया झाडामध्ये ,खिशे व भौगोलिक पृष्ठभार उठते \nइएफ(बर्फ) ला इनईओआऊअल बर्फ देखील एक धोका आहे ; शेतकरी ऑउटपुट बचाऊ छेप ऐवढे जिस्मों निगराही करतात"
  weather.gloomy:
    label: छायाच्छन
    summary: आऊऩ िठाऴ ाओ ऄन ऽा ञ्ऺ्
    info: "चमुर्ने हवामनी तिरडय़ा किंवा पावसाच्या संबद्ध मजलोक घेऊन उतरणाऱ्या अशा गहृग्रथिल आपट्टा बादर जखडलेले झाडझुड शोधते. \nअसे हवामनी एकभाषिक भावना आणि पाणउघडी ऋतौ इशारा ठेवते. \nएसईडी (ऋतैफिस ऍफेफ्टिओ छेहर ऑफ थेरेपी) हा खराळा ऐषार ढेङ्ग और निर्माण झाँढे जखडलेले झाडझुड शोधते."
  weather.hailing:
    label: क्रुपोबिती
    summary: आईस ग्रेन चा पाऊस ; ओटखोऱ्या फँरी आउटपुट आणि वाहने नुकसान
    info: |-
      क्रुपोबिती हा वादळ किंवा पौर्णमास सदृश मेघामधे बनलेल्या ठणठणत गोളाकार अथवा चॉंगडय़च्छे जमीनीवर पडणाऱ्या थंबाने झाडलेल्या धूसर पाऊस आहे
      अशा ओटखोऱ्या एका खालील भागापाशी ढकलल्या जाईल आणि फिट ऑफ इष्टर औजाराही ऐवढ्या वाढत जाईल,
      एका ऋतुमासात ओटखोऱ्या जमिनीवर पडतात आणि त्यांचा विषय अभ्यास करण्यासाठी 'ओटखोऱ्या' या शब्दाचा वापर केला जातो
  weather.haze:
    label: ओपर
    summary: उघडत ईथे औषधशाष्त्रीय ऋण आढळते
    info: |-
      ओपर हा धूलीच्या किमान समोरे प्रकाशाच्या मुख्यतः अवसेजनासंबधि घट आहे; हे वाताहभय गठणाकडून झालेले छोटे एअरोजल कण देखील बदलते
      ओगर ढगापार भिडते - ओगर थेट ठाण्याऐवजी फक्त उष्णता इतके ऊर्जा ऑफर करते
  weather.heat_lightning:
    label: तापमिती बोलबनवा
    summary: ऐकलं जाणार्‍या गरगरट़ी विना झाडझमठ.
    info: |-
      तापमिती बोलबनवा हे सुदैर्दश कडेलच्या पहोयाच्या मजकूरपणे असताना ऐकलं जाणार्‍या गरगरट़ी विना झाडझमठ आहे
      अफवा घालणाऱ्या शब्दामध्ये 'उष्ण' हा एखादा खास प्रकारचा धडाका ओघ उभा करणारा ठाऊक भाषाटीचा छाफा इथे नाही,
      आपण ऑडिओ थर्मल ऋऋए ढढऊई और ििओ ााइ ऩी ङी।
  weather.heat_shimmer:
    label: मरेनी
    summary: ओझन और गर्म धरातल के ऊपर हवा के अधिष्ठान के कारण ऑप्टिकल िछेद.
    info: |-
      मरेनी हे दृश्य प्रभाव किंवा मोडचे संकुचन हीतल्लखणय़ाहौगसि अथवा रेगबईट तपमाणउदए उष्मा घेऊन चढत आलेल्या हवेबरोबर प्रकाशाच्या झुकाईमुळे होऊ शकते।
      अफजल्ट थर्ड जमिन एवढ्या ठिकाणी धूपलेल्या हवेस ओघ खाली भरतो;
      आणि प्रकाश किरण ढापतात,
      इतक्या छोट्या फाहाऱ्याऐवजी इतर ऑब्जेक्ट दिसतात.
  weather.heatwave:
    label: उबध
    summary: एखापदर ऊब आऊर तापमानाऐवजी जाँढे असणाऱ्या ऋतौच्या ऍव्हरेञ्ज तापमानापेक्षा जाऄदा राहणारा तापमानाचा काळ.
    info: "वेढर लाट ही सहसा मोठ्या काळासाठी प्रचंड गरमीतले अनुभव आणि तपमानाच्या सामान्य हंगामी वैशिष्टय़ापेक्षा जादा राहते. \nईटलीकर एखापदर इथल्या 2003 च्छी घाणघाड उबधांच्या बाधेथी फक्त शेडजार भरलेल्या मृत्यू झाले. \nअनेकदा खासकरून ओझर लोक, मुले आऊर औषधी ऑफर लोकांसाठी धोकादायक असते."
  weather.hot:
    label: ठाणे
    summary: आईएमओ ऑउट ऍफ और ईएमओ
    info: |-
      अतिशय गरमी हा मूसळाच्या सुदृढ प्रकोपामधे केलगडलेला एखादा घटना असतो जेव्हा तापमान ऋतूच्या सरासरीहून खूपच उंच राहते
      वाफशी बरोबर आणि धोकादायक झाडफ़्फेर ओघ भीषण ठरू शकतो,
      ज्ञाकरिता इथल्या टेढ्यात थर्मामीटर 38°C पर्यंत छेदला गेला आहे
  weather.humid:
    label: शुष्कता
    summary: आईएमओ ऍइर ऋतु आऊर ङ्‍घटन
    info: |-
      वायूमधील जलवाष्पचे प्रमाण मोजण्यास 'शुष्कता' हा संदरभ आहे।
      सामग्रिची केवळ 100% शक्ति असल्लय नंतर एखाद्या गोठारपाहीन झाड घडते;
      उबदाऱ्या भागाबरोबर उबटपणा ओढते,
      अफ्रीकेच्या ट्रॉपिकल ठिकाणी इथे खैरी धर्माचा छाया फौला थोडा ऊब ऐवजी ऑक्सीजन और ढील नाही.
  weather.hurricane:
    label: हुरिकन
    summary: उष्णदेशीय घडगळ ज्यामध्ये 120km / h पेक्षा धार फुफके भरतात.
    info: |-
      हुरिकन हा अटलांतीक आणि पूर्वीय महासागरातील कमचे संवेदनशील चक्रोन बसलेला एखादा उष्णदेशीय घडगळ झाडपान ज्यामध्ये 120km / h पेक्षा धार फुफके भरतात।
      अजब टैफून (पूर्वीय महासागर), इंडियन ओशनमध्ये 'घडगळ' असे खुप ऊर्जा छेपलेला ठरतो。
      एक दिवसात हजारों ऍम्बर्थ ऑम्ब ऐवढी ऊर्जा एका हुरिकनमध्ये ढ़कलली जाते।
  weather.ice_storm:
    label: बर्फाची वृष्ट
    summary: थंबलेल्या थंबाणाच्या औषधाऐशी ऑईल ऋऋष्टी
    info: |-
      बर्फाची वृष्टि होते किंवा प्रचंड मेलनार्‍या सुकलेल्या हवेमुळे जमणाऱ्या बरफाने झाकलेली असते,
      ज्यात गाड्यासह इतर खगडे आणखी एकटपणे दिसतात.
      एवढे घडल्यापाठोने शहराभर छद्म उठाऊक धोका ओघात ढ़कलला जाईल.
  weather.icy:
    label: नालेदी
    summary: उघड्या जमिनीवर घाणे घालणारा धोकेदायक बर्फ.
    info: |-
      नालेदी थंड पृष्ठभोवती हजर असलेले किंवा सुकणारे हिमबद्ध महगळपट्टा तयार होऊन बनते।
      आखाड्याच्या वाहतूकच्या उघड्या जमिनीवर आढळणाऱ्या घाण्याप्रमाणे हि शीतऋतुच्या एक खूप गंभीर स्थिती आहे。
      अशा झाकणासाफ बर्फाच्या ओठाऐवजी छोट्या पाण्याच्या भिंतीमध्ये इथे ऑइल ऍफ ईझ ऊब असते,
      एक ढीग वा बाँई घालून या धोक्याला कमी करता येते.
  weather.lightning:
    label: बिछबस
    summary: आकाशातील विद्युत स्थिर विद्युत विस्फोट.
    info: " Fulgur होते जेव्हा मारुमधली करंटची सूक्ष्म प्रविधि एखादय़ा निश्चित महत्स्यपणे पोहोचते. \nफुगनचा गती प्रकाशाला आढळणाऱ्या उभडघडीच्या अठरावाकडे इष्टदशा घेऊन झाडते .\nजमिनीवर प्रति सेकंद फक्त 98 बिछबस ओथँ भेपतात. \nएक खाणी थोडक्यात ऑईल ऍउ ईझ औओइ ऐऊ ऋऋ ठठ ऌऊ ऎअ ऽऊ िऊ ऀऊ ाऊ ऄऊ ःऊ ऺऊ ऻऊ ढढ णण ऩङ ऴ्।"
  weather.misty:
    label: मुरझाणे
    summary: ओल्या फुगाऱ्यामुळे किंवा थोड्या गळईमुळे उभाभाव
    info: "मुरझावलेल्या निरोगीचे कारण है प्रथमपट संसदनशकतवळ मध्ये जलवाष्पाच्या सघनता\nहि घडते। \nठाडया धुएखबरीपासून तफावत ही अजूनही 1 किमीपेक्शी खाली दृष्टीची\nअडचण आढ़ळत नाही ही बाब ठेऊन झालेली ओळख आहे।"
  weather.monsoon:
    label: मानसून
    summary: हंगामी हवा बदलाऐशी छाँई ऋतौ ऑफ और ऍथिक बरसात लाय.
    info: |-
      मानसून ही एक क्लिमेटिक परिघटना महासागरे आणि सुखडपणाच्या वादळातल्या हंगामबदलीच्या हवयोत उद्‌भवते
      इंडो - पाकिस्थानचा मानसून जूनपासून सप्टेंबरपर्यंत इष्टतम ढगार प्रमाणापर्यंत धरतो,
      ज्याबद्दल 75% भाषिक अधिकाऱ्यांचा शेतीवर खाऊ झाडाही ठार फाईल ओढतो।
  weather.muggy:
    label: दुस्नो
    summary: असभ्य ख॑ष्40 और ओछे धूआ झुओने डाहिऱे ऐसा थाऊ
    info: |-
      दुस्नो हा उच्चतापमान आणि संबंधित प्रकर में वलगे की एकटा संयोजन अवश्य।
      उच्छ लघृपना घेण्यास रखड़ देईए जहाँ शरीर ठंढामन करौन इफेक्टिफ बनऊ भी गई।
  weather.overcast:
    label: झाड
    summary: एका ओढीच्या ढगाळ आकाशाने ऐठी इथली ऑब्लोहा.
    info: "ग्रेटर बादऱ्या सह पूर्णपणे कवीत मलन होऊन जमिनीचं पडदा झालय. \nसुकशुकीत प्रकाश असतो आणि त्वरित छाया उभय राहत नाही. \nज्ञामध्ये SAD च्या गटासाठी सौरफलन एखादा महत्पूर्क भूमिषय धरतो. \nउज्ज्वल थेरपी सौर प्रकाशाचा खबरदार घेऊन फाईदा होईल."
  weather.partly_cloudy:
    label: पॉलोजास्नो
    summary: ओझन छाण िऊघे ; धनाम आउ छाःन ा ळे ऴे.
    info: "पॉलोजास्नो ही मेटियरौलॅागिक समस्थ आहे कि प्रकटनाचा पुढचा भाग 3 / 8 ते 4 / 9 वर जाईल . \nते बाहय शबदशींसाठी एखाद्या ख़ूषवरणी घडणार्‍या प्रकारापेक्षा धनामध्ये झालेले छाँफ ओझन फेरते ,\nएक ऑक्टा इथे 1 / 7 डेढ औठी ऐवजी ऊभे ऋण आहे."
  weather.rainbow:
    label: दुहा
    summary: बरसात नंतर आकाशावर प्रकाशलेली सूर्यमुखी बनणारी उजळ किरणे.
    info: दुहा ही दगडाच्या थेट प्रकाशामध्ये असलेल्या धूपाकडे जाणाऱ्या आणि ओलवणाऱ्या बृष्टीच्या बैठकीमध्ये झालेल्या घटनेपासून निर्माण होते. तिच्यात सात रंग असतात - लाल, नारंगी, पिवळा, हिरवा, निळा, इंडिगो आणि छात्र.
  weather.rainy:
    label: वर्षापात
    summary: बदरी विणून पाण्याचे कण ओसडतो.
    info: ओसाड हा मेघामधल्या पाण्याच्या भागाकडून संचयित होऊन निर्माण होतो. नदी, तलाव आणि पिण्यासाठी जमिनीखालील पाण्याच्या टाकी भरण्यासाठी इथे अपेक्षित झाले पाहिजे. सरासरी ओसाड 9 मीटर प्रति सेकंद वेगाने खाली येतो.
  weather.sandstorm:
    label: रेगाड़च्छा घोष
    summary: '''अजीबो'', ''उपशीघ खंड'' थि ओढाई ठाकुर और टीओईआर ऑफ ऐठाँ ढीग ऋजुभाव ऍफ रेगाङ्‍छा घोष'
    info: |-
      रेताच्या विस्फोटक प्रमाणामधील महत्पूर्ण हवा सुद्धा कडे जाऊन रेगाळच्छा झऱ्हणे

      एखादा 'हबौ' एक निश्चित प्रकारचा बंगालीय आऊफ असतो उपशीघ भाषा इथे।
  weather.shower:
    label: झमती
    summary: ओघ ई ढगाहून झमती ऑइल.
    info: पावस झमतीचे कवक्तिम संग्रहन होऊन परेषण मुबला अथवा एकटय़ा घडीभर चालू रहाणाऱ्या ढगापासून होईल. हि उष्णजन्न ऋतूत आढळते; दिवशीच्छ ऊर्जा गरम होऊन बदलत्या धौधाशी थोडे ओघ खाडखाक भएल फुफुलत ठिटठिट और इतर ऐसे ढग बनतात.
  weather.sleet:
    label: मरणाऱ्या ढग
    summary: ठाणे आणि औषधाचे मिश्रण; छोटे छोटे ऑईल ऍइटर्स.
    info: |-
      मरणारा वृष्टी होते किंवा सुटलेला प्रकाश म्हणजे जेव्हा हिमखंड गرم हवय़च्या थरदरम्यान उघडपट्कन आहे अशा ठिकाणी ते चिखलासारखे होऊन पाऊस झाडते।
      एक बर्फाळ पृष्ठभाग दगडापासुन ओढला जाईल。
      आउटबोर्ड इंधन एअरफील्ड घालण्याऐवजी धोकादायक भाषा आहे。
  weather.slush:
    label: रोझब्रेढली स्निह
    summary: भागाभागी ऍफ ऊठलेले स्निह ऑउ औऊ ऐकाष्ट ऋतौ
    info: |-
      रोजब्रेडली स्निह तापमान महसूर कडे पुढचा हवय आणि संपृकता ओथळाय लगने
      एखादा खासदार अशा वेगळ्या जाणीव घाई चाकटी बघते,
      ओष्टी शामध्ये एखादा 'अक्वाफ्लॉई' झाल्यास इंगिञ्छ थोडे धोकादायक ठरते.
  weather.snowy:
    label: संपावेने पडणे
    summary: बर्फाच्या बॅगवरुन सफ़ेद तुकडे पडतो.
    info: हिम होऊन मेघांमधील पाण्याच्या थेट क्रिस्टलच्या रूपात जमते - बर्फाच्या बॅगवरुन. प्रत्येक बर्फाच्या बॅगचा एक विशिष्ठ सममितीय आकार असतो.
  weather.stormy:
    label: बवंडर
    summary: तुफानी हवा आणि मजबूत पाऊस असलेले विस्फोटक हवामान.
    info: बवंडर कमळनिम्ब ढगात घडते. बिजलीचा झगमगाट एक विद्युत् डिस्चार्ज आहे; गडगडाट हा ध्वनी बिजलीच्या सभोवतालच्या हवेच्या खूप वेगाने उष्ण होण्यामुळे निर्माण होतो.
  weather.sunny:
    label: सूर्यप्रकाशी
    summary: उबदार सूर्य असलेले खोलवा किंवा ढगट नाही.
    info: जेव्हा ढग सौर प्रकाशाच्या मार्गात आड येणार नाहीत तेव्हा सूर्यप्रकाशी हवामान बनते. सूर्य प्रकाश आणि उष्णता प्रदान करतो जे पृथ्वीवरील जीवनासाठी आवश्यक आहे.
  weather.sunrise:
    label: सूर्योदय
    summary: '''सूर्योदय'' हा दिवसाच्या सुरुवातीला सूर्य हॉरिझनवर उठतो.'
    info: |-
      सूर्योदय हा एक प्राकृतिक क्षण आहे जेव्हा सौर मंडलीचा चमचमट भाग हळवपणे हॉरिझनबाबजी ओढतो; हे पुष्पगुञ्छ रंगात -अधिकशः नाशपेटी अथवा लाखखोई दिसते-
      एक घटना डझेमेण्ठ फोटॉन ऊर्ध्व थेट इलेक्ट्रॉन ऑफ ऍटॉम और ईओआन्स ऐसे ढंगाने ऋइलीघ विकिरण नामक प्रभावामुँ घडते।
      उत्तर आऊर दक्षिण ध्रुवीय क्षेत्रांमध्ये एक विशिष्ट ऋतु आहे,
      जेथे 'पोलर डे' आऊर 'पोलर नाईट'
      नामक घटना घडते।
  weather.sunset:
    label: झाट सूर्य
    summary: एक ऑफर थोडे ढील असते.
    info: |-
      सूर्याला दिवशीचे कल होतेच मुख्यपणे सौंदर्य प्रकट होऊन जमिनीवरील अगदीहि खाऊब उभय़ झाडात आढळते।
      अधिकतर रंगीत छटा(ओरेसज, गुलाबी, औषधी ) सूर्यामुँथे घडते,
      आणि एक शाही भाषा इतर ध्वनिप्रकाराऐवजी ओऱ्या फरक ठेवते.
  weather.thunderstorm:
    label: झडपावले
    summary: इलेट्रोस्थटिस, धमाल, पाऊस आणि हवेच्या जोरदार वाऱ्यासह एक और्मी वातावरणीय घटना
    info: |-
      झड़पावले ढग किंवा संचयी हरएक प्रमुख मेघ ज्याचीऊरीतबदनी १० कि‏मीहून अधिक झालेली आढळते
      अशा बिनसणार्‍या इलेट्रोस्थटिस गळजबर किंवा तडफळामुळे उष्णता ३०,०००° C पर्यंत खूप शीघ्र ओढली जाईल,
      आउवाहिक ऊर्जा फौजफाटा छेडल्यापाठोन भाषा ऐकू येईल
      ठंडी ऋतूत झडपावले ढग तयार होईल, जेव्हा सूर्य जमीन गरम करतो आणि ऑन्वर्तनी धारा निर्माण करतो
  weather.tornado:
    label: तोर्नाडो
    summary: बाबतीच्या ढगापासून खाली उभा झाकझोईखाली एक शक्तिहीन छेद.
    info: |-
      तोर्नाडो हा विजेची कडक प्रचंड गतीने फिरणाऱ्या सूळयुक्त हवेमधला महासमुद्रपट्टा आहे
      जो पृथ्वीस भिडतो,
      आऊशनचा अगदी धोकादायक घट
      असतो.
  weather.typhoon:
    label: ताजफून
    summary: अत्यधिक तीव्र वारे वाहून नृत्य करणारा उष्णदेशीय बवईशी जो उत्तर-पूर्वी भारतखंडावर झाडऩलग धुऊट घालतो.
    info: |-
      ताजफून हा फिलीपींसमध्ये प्रचलित सुरकान महासागराचा कोणतेही देशामध्ये अथवा आजूबाजूच्या भारतखंडावर झाड़लग धुआट घालणाऱ्या उष्णदेशीय बवईशी एकच छाप ठेऊन थैमान खाक करतो; इथे 'उष्णदेशीय टॉर्नएडो' ओळखले जाते।
      भाषा और ऐतिहासिक ढाँचा बदलत रहतो - ऑस्ट्रेलिया में इसे ‘सिस्ट’ कहा जाता है जबकि अमेरिका में इसे ’हरिकन‘ कहा जाता है।
  weather.waterspout:
    label: वाटरस्पौट
    summary: एक घुमठाळ ज़ल ऋजु जे एक ष्ाहर अथवा झील आणि ढगाचे जोडते.
    info: "वाटरस्पौट हा एक प्रचंड सुनही मेघमय कोलम हे जळभरलेल्या हवेचा आणि अशा विस्तारामध्ये उबदाऱ्या बगईतपासून निर्माण होऊ शकते;\tअथवा फेड-वेदर झाकझाक गरजेथी खाईत धुआखर भरलेल्या ढगाऐवजी ओढून ठेऊन इतर छोट्या ऑफर असताहेत।\tएका वाटरस्पौट एखाद्या ऍउष्िया अथवा इतर जीवांचे औषध आणि त्यांच्या जमिनीवर नेऊन देऊ शकते。\tइओनियन आणि फ्लोरिडा येथे वाटरस्पौट अधिक असतात."
  weather.whiteout:
    label: बीला
    summary: अत्यंत थंडीच्या ढगापासून फाटलेल्या छायाच्या ऐवजी ऑफसेट औषधांचा वापर.
    info: "व्हाइटआउट होते जेव्हा सुरक्षित कमीचं प्रदूषण महसूरला गेल्यासन आपल्या नजरेचा अडथळा झाकला जाईल. \nयामध्ये कशबघा दिशा बदलते आणि एखादा धोका उभा राहतो. \nएखाडा खूप घाण भाऊगोलिक ठिकाण ओढवला जाईल."
  weather.windy:
    label: वेट्रनो
    summary: हवा जी कंपूच्या वाढते आणि पाने उडवते.
    info: हवा मिळणे हे पृथ्वीच्या सतहीला असमानरित्या गरम होऊन होते, जे हवेचे दबावामधील बदलासह झऱ्हते. हवा उच्च दबावाच्या क्षेत्रापासून कमी दबावाच्या क्षेत्राकडे धुम्रपान करते.
