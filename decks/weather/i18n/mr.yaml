lang: mr
pivot: false
title: वातावरण
cards:
  weather.cloudy:
    label: बादराहू
    summary: आकाश घनद्रव्य मेघाने व कोणतेही सौर प्रकाश नसल्यामुळे झाकलेला असतो.
    info: मेघ हे छोटय़ा पाण्याच्या बूंदींचे किंवा बर्फाच्या क्रिस्टल्सचे जमाव आहेत. पृथ्वीच्या आकाशाच्या 60% हून अधिक भागावर सदैव ढगांचे झाड असते.
  weather.foggy:
    label: मल्हावो
    summary: हुक जमिनीवरचा कोरडेपणा दृश्यता कमी करते.
    info: मल्हावो हे पृथ्वीच्या सतहीवर बनलेले मेघ आहे, जे पाण्याच्या थेंबांपासून तयार होते. हे उंच भागामध्ये असताना एक किलोमीटरपेक्षा कमी दृश्यता निर्माण करते.
  weather.rainbow:
    label: दुहा
    summary: बरसात नंतर आकाशावर प्रकाशलेली सूर्यमुखी बनणारी उजळ किरणे.
    info: दुहा ही दगडाच्या थेट प्रकाशामध्ये असलेल्या धूपाकडे जाणाऱ्या आणि ओलवणाऱ्या बृष्टीच्या बैठकीमध्ये झालेल्या घटनेपासून निर्माण होते. तिच्यात सात रंग असतात - लाल, नारंगी, पिवळा, हिरवा, निळा, इंडिगो आणि छात्र.
  weather.rainy:
    label: वर्षापात
    summary: बदरी विणून पाण्याचे कण ओसडतो.
    info: ओसाड हा मेघामधल्या पाण्याच्या भागाकडून संचयित होऊन निर्माण होतो. नदी, तलाव आणि पिण्यासाठी जमिनीखालील पाण्याच्या टाकी भरण्यासाठी इथे अपेक्षित झाले पाहिजे. सरासरी ओसाड 9 मीटर प्रति सेकंद वेगाने खाली येतो.
  weather.snowy:
    label: संपावेने पडणे
    summary: बर्फाच्या बॅगवरुन सफ़ेद तुकडे पडतो.
    info: हिम होऊन मेघांमधील पाण्याच्या थेट क्रिस्टलच्या रूपात जमते - बर्फाच्या बॅगवरुन. प्रत्येक बर्फाच्या बॅगचा एक विशिष्ठ सममितीय आकार असतो.
  weather.stormy:
    label: बवंडर
    summary: तुफानी हवा आणि मजबूत पाऊस असलेले विस्फोटक हवामान.
    info: बवंडर कमळनिम्ब ढगात घडते. बिजलीचा झगमगाट एक विद्युत् डिस्चार्ज आहे; गडगडाट हा ध्वनी बिजलीच्या सभोवतालच्या हवेच्या खूप वेगाने उष्ण होण्यामुळे निर्माण होतो.
  weather.sunny:
    label: सूर्यप्रकाशी
    summary: उबदार सूर्य असलेले खोलवा किंवा ढगट नाही.
    info: जेव्हा ढग सौर प्रकाशाच्या मार्गात आड येणार नाहीत तेव्हा सूर्यप्रकाशी हवामान बनते. सूर्य प्रकाश आणि उष्णता प्रदान करतो जे पृथ्वीवरील जीवनासाठी आवश्यक आहे.
  weather.windy:
    label: वेट्रनो
    summary: हवा जी कंपूच्या वाढते आणि पाने उडवते.
    info: हवा मिळणे हे पृथ्वीच्या सतहीला असमानरित्या गरम होऊन होते, जे हवेचे दबावामधील बदलासह झऱ्हते. हवा उच्च दबावाच्या क्षेत्रापासून कमी दबावाच्या क्षेत्राकडे धुम्रपान करते.
