lang: zh-CN
pivot: false
title: 天气
cards:
  weather.aurora:
    label: 极地之辉
    summary: 由磁层中太阳能风引起的一种自然光学效应
    info: '{"hint":"极光；夜空中彩色的光芒","info":"北极光（在北半球称为Aurora Borealis，在南半球则为Aurora Australis）是由于带电太阳粒子与大气相互作用而产生的。\n它会形成绿色、紫色和红色等颜色组成的帘幕状或螺旋形图案。\n最常出现在两极地区，如挪威、冰岛、加拿大以及南极洲等地可见到此现象。\n印第安人认为这是祖先灵魂跳舞的表现形式。");'
  weather.avalanche:
    label: avalanche
    summary: 从山坡滚落下来的冰雪团块
    info: '{"info":"雪崩是山体上快速移动的积雪山坡。\n最危险的是速度超过每小时300公里粉状雪雪崩，每年在阿尔卑斯山区平均导致约150人死亡；因此，在有发生雪崩风险地区使用探测器发出信号是一种强制性装备。'
  weather.blizzard:
    label: 暴风雨
    summary: 一种伴随着大量雪花、强劲的大风吹拂并导致近乎于无视线的强大天气事件
    info: '{"hint":"伴有强风和接近零能见度的严重暴风雪","info":"暴风雨是一种强烈的降雪现象，结合了密集的下雪和大风。\u5bfc\u7f6a\u4eba\u9cde\uff08Whiteout）\u548cm\u7ea6\u9ero\u80af\u7684\u8d \u53ca\u9ad8\u9cd \u7684\u9cb7\u9cd \u3002\u53eb\u53f2\u5df7\u53bf\u53ef\u4ee5\u5bc6\u5ba6\u4e00\u5341\u4e07\u4eba\u7684\u6b7 \uff0cu\u5982\u5c0f\u5fb7\u56fd\u7684\u6bd \u53bf\u53ef\u4ee5\u5bc6\u5ba6\u4e00\u5341\u4e07\u4eba\u7684\u6b7 ","label":"blizzard","summary":"伴随强烈积雪和几乎为零可见性的强大风暴。");'
  weather.breezy:
    label: 微风
    summary: 令人愉悦且柔和的风吹拂着温暖的日子
    info: 微风是速度为每秒6至11米的温和气流（蒲福级数第3到4级）。它会引起树叶、头发和轻质物体轻微移动。从生理上讲，通过蒸发汗水来降低炎热感。
  weather.clear:
    label: 晴
    summary: 完全清澈无任何乌云的天空
    info: |-
      晴朗是气象学中云量少于天空八分之一的状况。它允许最强劲的日晒和最佳天文观测条件。
      在夜晚，如果天气晴朗，则热辐射较强；温度下降较快。
      在捷克语里，“晴天”与舒适感以及户外活动的良好环境联系在一起。
  weather.cloudy:
    label: 多云
    summary: 天空被密集的云覆盖，没有直射阳光。
    info: 云是由可见的小水滴或冰晶聚集而成。地球上的天空有超过60%始终处于云层覆盖之下。
  weather.cold:
    label: 冬天
    summary: 极度严寒导致气温远在结冰点之下。
    info: '{"hint":"极低温度；可见霜和呼吸","info":"极端寒冷（冰冻）发生时，北极空气会渗透到温带地区。\r地球上自然测量的最低气温是南极洲沃斯托克站记录下的零下89度摄氏度。\r生物体会通过血管收缩以及颤抖来应对低温。\r当体温降至低于三十五度摄氏度以下就会出现失热症候群。","label":"冬天","summary":"极度严寒导致气温远在结冰点之下。"'
  weather.dew:
    label: 露
    summary: 寒冷夜间凝聚于物体上的小液滴
    info: 露水是空气中的水分在平静的夜晚凝结到冷表面上形成的。当表面温度降至露点以下时，就会形成露珠。它是干旱地区动植物的重要水源，在阿塔卡马沙漠中放牧的人会用网来收集清晨的露水。
  weather.drizzle:
    label: 毛毛雨
    summary: 以微粒形态出现的小型降雨
    info: 毛毛雨是一种降水形式，其水滴非常细小（小于0.5毫米）。它不是由积云形成的，而是来自低层的层状云。这种天气在海洋性气候中较为典型（如英国和法国西北部）。
  weather.drought:
    label: 干旱
    summary: 长时间缺乏降雨导致的水资源短缺
    info: 干旱是一种气象状况，由长期降水不足引起。会导致作物歉收、缺水和火灾的发生。
  weather.dust_storm:
    label: 樯察
    summary: （在巫亭地区）被快风投成的樯察
    info: '{"hint":"大型尘沙云被吹过干旱地区","info":"当强风吹起细小的陆地颗粒到空中时，就会形成沙暴。在撒哈拉非洲，这种风被称为harmattan。盘哉 樯察宣嫔，并从而寒对篨泰没有影响。在约竹，油波每年都会必然循环，巧建人经德可拿天泄后到绍淘地区。"}'
  weather.flood:
    label: 洪水
    summary: 河流等水源中的水分流至平常干旱地区的情况称为洪水。
    info: |-
      {"hint":"水溢出覆盖通常干燥的土地","info":"洪水由过量降雨、积雪融化或堤坝失效引起。\r
      洪水是世界上最昂贵的自然灾害之一。\r
      在捷克，1997年和2002年的洪灾造成了数十亿美元损失并导致多人死亡。\r
      天然防洪措施（湿地、森林）有助于降低风险。","label":"洪水","summary":"水流从河床漫到正常情况下干涸的地面上。
  weather.foggy:
    label: 雾
    summary: 浓雾降低能见度。
    info: 雾是贴近地面的云，由水滴组成。当空气湿度高时形成，并将能见度降至1公里以下。
  weather.freezing:
    label: 霜冻
    summary: 当温度降到冰点以下会导致水体发生冻结现象的过程称为霜冻过程或称作出现霜冻情况等描述方式之一种表达方法而已并非专业术语定义本身内容也无实际意义可言只是语言习惯用法罢了并不需要特别注意理解即可掌握运用自如程度为止才算是真正意义上的完全掌握了该词汇含义及其相关知识背景信息资料等等一切相关内容之后才能做到准确理解和正确使用这个词语来完成各种任务目标要求了！
    info: '{"hint":"温度低于零度；所有东西结冰","info":"在捷克，霜冻通常发生在气温低于摄氏零下时，在这种情况下水会变成冰。\n生物上威胁植物，并且导致交通意外的黑冰形成。\n最严重的霜冻出现在一月（历史最低记录是1929年利托维诺夫市达到负四十二摄氏度）。\n雪是一种固态形式的水分状态；其云中生成取决于空气中的湿度和凝核条件。","label":"霜冻","summary":"低温造成水中冻结的现象。"'
  weather.frost_flowers:
    label: 冰花
    summary: 美丽的冰结晶体，在寒冷表面生成
    info: 冰花（霜晶）是在极冷表面上因湿度结冻而形成的晶体结构。在北极海域会形成复杂的水晶图案，它们视觉上非常美丽，并且是自然摄影的热门主题。
  weather.frosty:
    label: 寒冷早晨
    summary: 地面积雪现象描述
    info: '{"hint":"表面霜；冰晶覆盖植物和地面","info":"当地表温度降至零度以下时，空气中的湿度会结晶形成白霜。\n它会在叶子、玻璃窗以及土壤表面上形成立体的图案。\n与结露（即凝华）不同：白霜是空气中水蒸气直接升华形成的固态冰晶体，而结露则是冷凝液滴冻结而成。\n对农作物来说是有害且危险的现象之一，在农业上农民们密切监测其发生以保护作物收成。");'
  weather.gloomy:
    label: 多雨
    summary: 带有抑郁气氛的黑暗阴沉天气
    info: |-
      阴天天气的特点是低矮的乌云、昏暗光线和寒冷或下雨的大气。它常与忧郁情绪以及秋季联系在一起。
      季节性情感障碍（SAD）是由冬季缺乏阳光引起的一种心理疾病。
      哥特文学和音乐则从这种灰暗氛围中汲取美学灵感。
  weather.hailing:
    label: 冰雹
    summary: 以冰颗粒形式出现的降雪；冰雹可能会损坏庄稼与汽车
    info: |-
      冰雹是在积雨云中形成的由小块冰晶（即冰粒）组成的降水。当水滴在冷热区域之间反复循环时，就会形成这些冰粒。
      它们的直径可能超过十厘米，并对农作物、车辆和屋顶造成严重损害。
  weather.haze:
    label: 雾霾
    summary: 由于粉尘、烟雾或者污染造成的可见光减弱现象
    info: |-
      {"hint":"由于细尘、烟雾或污染导致的能见度降低","info":"雾霾是因灰尘、烟雾或微小气溶胶颗粒引起的空气透明性下降。\n它与雾不同：雾由水滴组成，而霾则主要来自固体和液体气溶胶粒子。\n亚洲大都市常受灰霾（即雾霾与工业排放结合）威胁。
      PM25等细微污染物在空气中对呼吸系统健康构成风险。"}
  weather.heat_lightning:
    label: 热闪电
    summary: 在远方看到但没有可听见声音的雷电
    info: |-
      热闪电是远处雷暴的闪光，由于距离太远听不到雷声。名称具有误导性；它并不是由热量引起的特定类型的闪电。
      我们只能听到大约16公里以内的雷声，在更远的距离就无声了。
  weather.heat_shimmer:
    label: 海市蜃楼
    summary: 热表面之上的气流导致视错觉
    info: '{"hint":"由于空气温度，热表面上方的视觉扭曲","info":"海市蜃楼（光晕、幻象）是一种光学现象，由温暖上升空气中光线折射引起。\n沥青或沙漠上方的暖空气密度较低；光线发生弯曲。\n这会导致在炎热道路上出现虚假水洼的现象。（即为常见的海市蜃楼）。\n法塔·莫尔加娜是更复杂的海市蜃楼类型，通常是由气温逆增引起的。",'
  weather.heatwave:
    label: 热浪
    summary: 超长时期的异常高溫气候现象；對健康构成威胁
    info: |-
      热浪是持续时间较长的极端高温天气，其温度超过正常季节水平。欧洲在2003年的热浪导致了逾七万例过早死亡案例；对老年人、儿童和病人尤其危险。
      global变暖正在使炎热天数延长并加剧。
  weather.hot:
    label: horko
    summary: 造成不适和健康风险的过高的热量
    info: 极端高温是一种气象现象，气温明显高于季节平均值。与湿度结合时可能导致危及生命的中暑（热射病）。在捷克共和国的炎热波浪期间温度超过了38°C。
  weather.humid:
    label: 湿度
    summary: 充满大量水汽的潮湿闷热感
    info: 湿度测量空气中的水蒸气含量。相对湿度达到百分之百表示空气中已饱和；超过时水分会凝结成液体形式出现，例如露珠或雨水等现象发生。高湿环境让人感觉更热是因为汗水不容易蒸发掉。
  weather.hurricane:
    label: 飓风
    summary: 以中心附近最大平均风力达或超十二级以上为特征的强大热带性低气压系统
    info: |-
      飓风是大西洋和东太平洋中一种热带气旋，其最大持续风速超过每小时120公里。它在西太平洋被称为台风，在印度洋则称为气旋。
      一个飓风一天内释放的能量相当于数十颗原子弹的爆炸能量
      最强级别的五级飓风暴可达到时速250多千米。
  weather.ice_storm:
    label: 结冰风暴
    summary: 融化的雪水在物体表面迅速冷却成薄而光滑的一层玻璃状物质
    info: |-
      {"hint":"冰冻雨会覆盖一层透明的冰","info":"当温暖空气层位于寒冷气流之上时，就会形成结冰风暴（冻结降雨暴），导致雨水立即凝固。其结果是树枝、电线和道路被厚厚的透明冰壳所包裹，在积压下电网瘫痪并引发大范围停电事故。

      1998年魁北克省发生的严重结冰天气造成了加拿大历史上最严重的灾难之一。"}
  weather.icy:
    label: 结霜
    summary: 造成路面打滑的有害冰雪
    info: 结冰是由于雨水滴或雪在寒冷表面上融化后冻结而形成的。这是冬季交通中最危险的情况之一，因为其滑溜性是由表面一层薄水造成的。
  weather.lightning:
    label: 闪电
    summary: 在云与地之间或两片云之间的静电放电现象
    info: 闪电是在雷暴云中电荷差异达到临界值时产生的强烈电流。它的速度大约是光速的三分之一，地球上每秒约有100次闪电击落地面。避雷针（富兰克林于1752年发明）是最先科学设计的安全防护装置。
  weather.misty:
    label: 有轻雾
    summary: 因稀疏雾霾和轻微起雾导致低可见性
    info: |-
      薄雾天气是由于水蒸气在近地面空气层中凝结形成的。与浓雾不同，此时能见度受限但不会低于1公里。
      它常出现在寒冷的夜晚、河流上空或山谷里。
  weather.monsoon:
    label: 季风
    summary: 随着季节改变方向，并为热带区域带来更多降水量的一种特定类型的风
    info: '{"info":"季风是一种气候现象，由海洋和陆地之间的季节性风吹变化引起。\u5b89 德巴德斯坦的夏季从六月到九月带来百分之七十至九十的年降雨量；七亿人依赖于这种雨进行农业活动。如果季风雨不足会导致干旱饥荒、过强则导致洪水。","label": "季风","summary": "随季节而变向并给热带地区带去大量降水之风."}'
  weather.muggy:
    label: 闷热
    summary: 令人不适地又热又有潮湿空气引起的窒息感觉
    info: |-
      闷热是高温和高相对湿度的结合。 高湿会阻止汗水蒸发，因此身体无法有效降温。
      热量指数（Heat Index）将温度与湿度结合起来表示体感温度。
  weather.overcast:
    label: 多云
    summary: 天空完全被灰色云层覆盖而没有直晒太阳
    info: |-
      阴天通常出现在云量达到7/8或满布的天气条件下。光线是漫射型，不会产生阴影。
      在地理依赖性抑郁障碍（季节情感症）中缺乏阳光起着关键作用
      光疗模拟了自然日光照亮效果并有助于治疗。
  weather.partly_cloudy:
    label: 半晴
    summary: 部分被云遮盖的蓝天；阳光和阴影交替出现
    info: 半晴天气是一种气象状况，云量占天空的3到5个八分之一。这是最适合户外活动的一种舒适性气候类型；它包含积状（卷）云，在一天中较温暖的部分发展形成。气象学家通过观察“八分法”来衡量云层覆盖情况。
  weather.rainbow:
    label: 彩虹
    summary: 雨后天空中出现的彩色光弧，此时阳光照射。
    info: 彩虹是由于太阳光在雨滴中的折射和反射而形成的。它包含七种颜色——红色、橙色、黄色、绿色、蓝色、靛蓝和紫色。
  weather.rainy:
    label: 下雨
    summary: 雨水以水滴的形式从云中落下。
    info: 雨是由于云中的水蒸气凝结而形成的。它是河流、湖泊和饮用水储备充满的必要条件；平均降雨速度为每秒9米。
  weather.sandstorm:
    label: sandstorm
    summary: 沙漠中由强劲风吹动产生的巨大墙状沙土
    info: 沙尘暴是由强风卷起大量灰尘和砂砾形成的。哈布（haboob）是撒赫勒地区及阿拉伯半岛特有的一种沙尘暴，它可能掩埋村庄并引发呼吸系统问题；在美国亚利桑那州的 haboobs 是罕见而壮观的大自然奇观。
  weather.shower:
    label: 雷阵雨
    summary: 从积雨云中产生的短时间内暴雨
    info: '{"hint":"短暂但有时强烈的降雨","info":"雷阵雨是来自积云或积雨云的短时强降水。\u005cr\u005c它迅速发生，并在几分钟到几小时内消散，常见于夏季：太阳加热导致午后形成对流和积雨云。\r\n雷阵雨后可能会出现彩虹。");'
  weather.sleet:
    label: 冻结降雨
    summary: 混合了雨水和雪；部分融化的雪花颗粒
    info: 冰雹（冻雨）形成于雪花穿过温暖空气层并部分融化时。它会在表面覆盖一层薄的结霜或冰晶，对交通有危险性，在捷克语中被称为冻结降雨或者云破。
  weather.slush:
    label: 融化的雪
    summary: 部分熔化并与水分混合；一种在冬季地面上形成、光滑且令人不适的地表层
    info: 融雪（冰泥）是在气温略微升至零度以上时，积雪开始融化而形成的。它非常滑，并对行人和机动车都构成危险，在道路上会导致水漂现象并降低轮胎的附着力。通常会撒盐或沙子来改善牵引力。
  weather.snowy:
    label: 下雪
    summary: 从云中飘落白色的雪花。
    info: 当云中的水滴冻结成冰晶——雪花时，就会形成雪。每一片雪花都有独特的对称形状。
  weather.stormy:
    label: 雷暴
    summary: 伴有闪电、雷鸣和强降雨的剧烈天气。
    info: 雷暴通常在高耸的积雨云中形成。闪电是电流放电现象，而雷声则是由于闪电周围空气迅速受热产生的声音。
  weather.sunny:
    label: 晴朗
    summary: 阳光明媚的天空，没有云。
    info: 晴天是指云层未阻挡太阳辐射的情况。太阳为地球上的生命提供必要的光和热。
  weather.sunrise:
    label: 黎明
    summary: 白天开始的时候太阳升起超过水平面的一刻
    info: 黎明是天文学中太阳圆盘越过地平线的时刻。其颜色（橙色、粉红色）是由瑞利散射引起的光现象，在极地区域，由于特定季节的影响会出现特殊的白昼和黑夜；绿色闪光是一种罕见的现象在清洁的大气条件下可以在日出时看到。
  weather.sunset:
    label: 日落
    summary: 一天即将结束之际，当太阳消失在地面之下的那一刻就是所谓的‘黄昏’
    info: 日落是白天的一个时刻，太阳会下沉到地平线以下。色彩斑斓的调色板（橙红色、紫色）是由阳光散射造成的现象；火山喷发后最美丽的夕阳会出现于大气中尘埃增强颜色时的情况之下，在古代以来它一直象征着结束与宁静以及浪漫。
  weather.thunderstorm:
    label: 暴风雨
    summary: 一种强烈的气象事件伴随有闪电、打雷、降雨以及狂风吹袭
    info: "{\"hint\":\"伴有雷电、暴雨和大风的强风暴\",\"info\":\"暴风雨形成于积雨云中，这些巨大的云层高度可达超过10公里。\\n闪电是静电放电现象；一道闪电能在几秒钟内将空气加热到三万摄氏度以上。\\n轰鸣声是由热空气中迅速膨胀产生的声音效果。\\n夏季阳光强烈照射地面并引发对流气流时会生成这种天气现象。\r\n\"}"
  weather.tornado:
    label: 龙卷风
    summary: 毁灭性的自云端至地表旋绕气流
    info: 龙卷风是快速旋转的空气柱，从雷暴云中延伸到地面。其最大时速可达每小时500公里以上，在美国中部地区（堪萨斯州、俄克拉荷马州和德克萨斯）最为常见；在捷克虽然也有发生但较为罕见。
  weather.typhoon:
    label: 台风
    summary: 在北纬西太平洋形成的热带气旋风暴，伴随时速超一百二十余公里的大风
    info: 台风是西北太平洋地区对飓风的称呼，常见于菲律宾、中国和日本等地。每年平均有约二十场台风袭击菲律宾。“妮娜”号台风（1975年）引发了中国的洪水灾害，并导致超过两万两千九百人丧生。”该名称可能源自中文“大风”的发音。
  weather.waterspout:
    label: water spout
    summary: 一种从海洋或湖泊到云层之间的旋转空气流
    info: '{"hint":"旋转的水柱，将水面与云连接起来","info":"海龙卷是一种在水域上空盘旋上升的大气漩涡。危险的风暴型海水龙卷由雷暴形成；较弱的好天气型则来自积雨云。");它可能吸入鱼类或其他生物并将其带到陆地。";亚得里亚海和佛罗里达州附近海域相对常见这种现象。'
  weather.whiteout:
    label: 白雪盲
    summary: 一种北极风暴状态，其中的降雪会导致所有对比完全消失
    info: 白化现象发生在暴风雪和积雪反射导致天空与地面融合成一片白色区域时。它会提供零能见度并造成方向感丧失，在极地或山区环境里可能致命，飞行员在遭遇这种天气可能会迷失方位。
  weather.windy:
    label: 有风
    summary: 强风吹弯树木并卷起树叶。
    info: 风是由于地球表面受热不均而产生的，这种温差导致空气从高压区向低压区流动。
