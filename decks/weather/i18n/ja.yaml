lang: ja
pivot: false
title: 天気
cards:
  weather.aurora:
    label: オーロラ
    summary: 磁界圏内で太陽風によって引き起こされる自然な光る現象
    info: オーロラ（北極ではアウロラ・ボレアリス、南半球ではアウロラ・アルタリスク）は太陽から放出された帯電粒子が大気と反応して発生する現象です。緑や紫、赤色の光のかさなり合いをつくります。特に高緯度地域で見られやすく（ノルウェーやアイスランド、カナダなど）、先住民たちはこれを祖先霊たちによる踊りとして信じていました。
  weather.avalanche:
    label: ラヴィナ
    summary: 山の斜面上から降り注ぐ雪や氷の大規模な塊です。
    info: |-
      {"hint":"山の斜面を突然に流れる雪と氷","info":"ラビナは、山岳地帯で急な傾斜を持つスキー場などで発生する大量の雪が高速度で滑落すること。
      特に危険なのは粉雪崩（パウダーラン）であり時速300キロメートル以上にも達することがある。
      アルプスでは年間平均して約150人が犠牲になる。
      アイゼナーなどの装備品には検知器である「ビーぺラー」信号装置が必要不可欠だ。","label":"ラヴィナ","summary":"山の斜面上から降り注ぐ雪や氷の大規模な塊"}
  weather.blizzard:
    label: スノー・ブラスト
    summary: 非常に強い雪嵓で、密な雪や風によるほぼ零に近い可視度があります。
    info: '{"hint":"強風とほぼゼロの視界を伴う激しい雪嵐","info":"スノーブラストは、強い降雪と強く吹く風が組み合わさった現象です。これにより、白い靄（ホワイトアウト）によってほとんど何も見えなくなります。","label":"スノー・ブラスト","summary":"非常に強い雪嵗で、密集した雪や風のために見えるものが殆どありません。'
  weather.breezy:
    label: ヴエトラーク
    summary: 暖かい日を爽快にする心地よい穏かな風
    info: |-
      ヴェトリークは、時速6〜11メートル（ボーフォートスケールのレベル3～4）程度の中強度な風です。葉や髪、軽い物を揺らすほどの力を持っています。
      生理的に汗が蒸発することで暑さを感じにくくします。
      ボーフォート・スケールとは1806年に制定された風力を表すための基準で、最大で12段階に分類されます。
  weather.clear:
    label: 晴
    summary: 完全に澄み切った空で、一つもない雲はありません。
    info: |-
      晴れは、雲量が空の1/8未満である気象状態です。太陽放射を最も強く受け止めることができ、天文観測にも最適な条件となります。
      夜間には晴れた条件下では熱放出が多くなり温度低下も早まります。
      チェコ語において「晴れ」は快適さや屋外活動に好ましい環境と結びつけて理解されています。
  weather.cloudy:
    label: 曇り
    summary: 空が厚い雲で覆われており、直射日光がない。
    info: 雲は目に見える水の小さな滴や氷の結晶のかたまりです。地球の天気では常に60％以上の空が雲に覆われています。
  weather.cold:
    label: 冬
    summary: 融けないほどの低温
    info: |-
      極寒（氷点下）は、北極圏の空気が温帯に侵入したときに発生します。
      地球上で観測された最も低い自然温度：南極のヴォストーク基地での－89．2℃です。
      体は冷たい環境に対し血管を収縮させたり震え始めます。
      体温が35度以下になると低体温症になります。
  weather.dew:
    label: rosa
    summary: 寒い夜中に表面に凝結してできる小さな水粒
    info: |-
      {"hint":"水滴が表面に夜間に凝縮したものです","info":"露は、静かな夜の間空気から冷たい表面上で発生する水分です。\nそれは表面温度が露点を下回ったときに形成されます。\n乾燥地域では植物や動物にとって重要な水源となります。
      アタカマ砂漠での牧畜者は網を使って朝の露を集めることがあります。
  weather.drizzle:
    label: ミロレニ
    summary: 非常に微かな小粒の雨水
    info: '{"hint":"非常に細かい雨粒や霧のようなとても軽い雨","info":"ミロレニは、直径が0.5mm未満の極めて小さな水滴からなる降水です。\nこれは対流性積乱雲ではなく低空層状雲によって生じます。\n典型的なのは海洋気候（イギリス本土・フランス北部西岸）で見られます。\nその繊細さにもかかわらず、強い湿りを引き起こすことがあります。"]'
  weather.drought:
    label: drought
    summary: 継続的ないくらえがないために水分不足になること。
    info: |-
      {"hint":"降雨が長期間欠如し、水不足を引き起こす状態","info":"乾燥は気象上長期にわたる降水量の不足によって生じます。作物への被害や水源枯渇および火災につながります。
      チェコでは2015年から2020年にかけて過去500年の間で最も深刻な干ばつがありました。
      世界中の多くの地域において地球温暖化によりこのような現象が悪影響を与えています。","label":"drouxht","summary":"持続的な降水不足による水分供給問題です。
  weather.dust_storm:
    label: 尘暴
    summary: 強風によって運ばれる干ばつの領域にある壁状のホコリ
    info: |-
      {"hint":"砂漠や乾燥地域で風によって巻き上げられた大きなほこりと砂の雲","info":"嵐のような強い風が、細かい陸地由来の粒子を空に持ち上げることで塵暴（じんぼう）は発生します。
      サハラアフリカではこの現象には「harmattan」という名前があります。
      時折、サハラから吹いた粉塵は大西洋上を通ってアメリカ大陸まで届くことがあり、研究によればその影響がアマゾン熱帯雨林にも及んでいるとのことです。
      米国における塵暴（特に1930年代のダストボウル期）により中西部地方での生態系の大災害が引き起こされました。"
  weather.flood:
    label: 洪水
    summary: 河川などからの水があふれて普通は乾いた場所を浸す現象である。
    info: |-
      {"hint":"水が通常乾燥している土地を覆うような溢れ","info":"洪水は過剰な降雨、雪解けやダムの破損によって発生します。\n洪水は世界で最も費用のかかる自然災害です。
      チェコでは1997年と2002年の洪水により数十億ユーロもの被害があり、多くの死者が出ました。
      天然防洪対策（湿地帯・森林）はリスク軽減に役立ちます。","label":"洪水","summary":"河川などの溝から干地へ流れ出た状態"}
  weather.foggy:
    label: 霧
    summary: 濃い地上の霧で視界が遮られる。
    info: 霧は、地面に近い場所にできる水滴からなる雲です。湿度が高いときに発生し、視界を1km未満まで悪化させます。
  weather.freezing:
    label: 霜
    summary: 氷点以下の低温により起こる現象で、水が凍ることになる
    info: 氷点下の気温では水が凍り、植物に生物学的な脅威をもたらし、道路状況によって交通事故につながることがある。チェコで最も強い寒波は通常一月であり（歴史的最低値であるマイナス42°Cは1929年にリトヴィノビツェ記録された）。雪とは固態になった水分であり、雲中での形成には温度と凝結核による影響がある。
  weather.frost_flowers:
    label: 氷の花
    summary: 美しい氷の結晶を寒い表面上に作る
    info: 氷の花（アイスフラワー）は、極めて冷たい表面で湿気が凍結してできる晶質構造です。北極海では複雑な氷の結晶体パターンが形成されます。これらは視覚的に非常に美しく自然写真撮影の人気対象となっています。
  weather.frosty:
    label: 朝霜
    summary: 地表上の霜；水晶のような構造で草木と地面を覆います
    info: |-
      霜は、表面温度が凍結点を下回り空気中の湿気が凝華したものです。葉やガラスの上に美しい模様を作ります。
      氷（いね）とは異なります：霜は昇華してできた大気中から直接生じた氷であり、氷は露が凍ったものであることを意味します。
      植物にとって有害なため農家は作物保護のためにこの現象を見張っています。
  weather.gloomy:
    label: 曇
    summary: 抑うつ的な大気が漂う暗く覆われた天候
    info: 曇り空は暗い低雲、柔らかい光と寒さや雨の雰囲気で特徴づけられる。憂鬱感や秋に連想される。冬季における日照不足によって引き起こされる季節性感情障害（SAD）も関係する。ゴシック文学および音楽ではこの曇天美学を引用している。
  weather.hailing:
    label: ひょう
    summary: 氷の粒子による降水；雹によって農産物や自動車などへの損害が出ることがあります
    info: |-
      氷の粒（ひょう）が嵐雲から降り注ぐ現象です。雹は、水滴がクラウド内の冷たい部分と温かい部分を繰り返して通ることで形成されます。
      直径10cm以上になり作物や車両・屋根に深刻な被害を与えることがあります。
      記録された最大サイズでは直径20cmを超えました。
  weather.haze:
    label: オパール
    summary: 粉じん、煙又は公害によって生ずる能見距離の短縮
    info: |-
      {"hint":"微細なほこり、煙や汚染による視界の低下","info":"オパールとは、塵埃・煤煙あるいは極めて小さなエアロゾル粒子によって引き起こされる大気透過度の減少である。霧との区別は重要で：霧は水滴から成るが、オパールは固体または液体状態にあるエアロズルに起因する。
      アジアの大都市ではスモッグ（オパールと工業活動）により健康被害が出やすい。
      PM25以下の超微小粒径物質(PM)を含むようなオパールは呼吸器系へのリスクがある。
  weather.heat_lightning:
    label: '"heat lightning"'
    summary: 「Heat Lightning」と呼ばれるものとは、聴覚的に捉えられないほどの距離にある暴風雨による視認可能な稈光のことです。
    info: |-
      {"hint":"遠くから見える雷鳴が聞こえない稟光","info":"熱波の稟は、非常に遠方に存在する嵐からの閃きであり、その音である雷鳴を聞くことはできない。
      名前こそ誤解を与えやすいが、「暑さ」によって引き起こされる特定種類ではないことを意味しているわけではない。
      私たちは最大で約10マイル（約16キロ）以内に発生した稟や雷だけを感じ取ることができる；それより遠ければ静かになる。
      晴れた夏夜には地平線近くで見られるこの現象はまるで野外劇場のように楽しめる。"}
  weather.heat_shimmer:
    label: マレニ
    summary: ホットな表面上で起こるオプティカル・イリュージョン；光学的錯覚
    info: '{"hint":"","content":{"front":{ "text":["熱による空気温度の変化によって、温かい表面上に生じる視覚的な歪みです。"]},"back":{"title":"マレニ（Heat Shimmer）","subtitle":"光学現象","description":["アスファルトや砂漠などの上で暖まった空気は密度が低くなります。光線が屈折することで見かけ上の水たまりを発生させます。（幻日と呼ばれる）。",""]}},{"type":"flashcards"}'
  weather.heatwave:
    label: heat wave
    summary: 平均を上回る高い温度が長期的に続き健康リスクがあります
    info: 猛暑波とは、通常の季節的な気温を超える極端な高温が長期間続く現象です。ヨーロッパでは2003年の猛暑によって死者数は7万人を超えました。高齢者や子ども、病弱者は特に危険にさらされます。地球温暖化により、このような熱帯夜とその影響が強まっています。
  weather.hot:
    label: 猛烈な暑さ
    summary: 快適でない感覚や健康リスクを引き起こす過度な高温です。
    info: |-
      極端な暑さは気象現象であり、温度が明確に季節平均を上回るものです。湿度と組み合わると生命に関わる熱中症の原因となることがあります。
      チェコでは猛暑波によって気温が38°Cを超えることもあります。
  weather.humid:
    label: 湿度
    summary: 水蒸気によって満たされた空気；暑く閉塞感のある印象
    info: |-
      {"hint":"高温多湿の空気で、水蒸気が多い状態","info":"湿度は大気に含まれる水分量を測定します。
      相対湿度が100％になると空気が飽和し、それ以上では凝縮が始まります。
      高い湿度により汗が出にくくなり暑さを感じやすくなります。
      熱帯地方では年間を通じて高湿度ですが、日本では夏に最も高く感じられます。"}
  weather.hurricane:
    label: ハリケーン
    summary: 時速120km以上の風をもつ大きな熱帴嵐
    info: |-
      {"hint":"巨大な熱帯嵐で、穏やかな目を中心に渦巻く風を持つ","info":"ハリケーンは大西洋および西太平洋における時速120kmを超える風を伴う熱帯低気圧です。
      また、同じ現象が東アジアでは台風（たいふう）、インド洋ではサイクロンと呼ばれます。
      ハリケーンのエネルギー量は毎日数十個分の原子爆弾に相当します。
      最も強力なハリケーンは第5カテゴリまで達し、最大瞬間風速は時速250キロメートルを超えます。"}
  weather.ice_storm:
    label: アイスストーム
    summary: すべてものを透過性のある薄い氷の層で包み込むような冷たい雨
    info: 氷点下の気温の中で、暖かい空気が上層部にあり雨が降ると即座に凍結する現象を「アイスストーム」と呼ぶ。この結果として木々や電線そして道路は厚く透明な氷で覆われる。重い氷による負担により停電も引き起こされることがある。
  weather.icy:
    label: 凍結
    summary: 表面において滑ることになる害のある氷
    info: |-
      {"hint":"表面が透明な氷で覆われて非常に滑りやすくなる状態","info":"凍結は、雨粒や雪の融解によって冷たい表面上に発生します。
      これは交通にとって最も危険な冬のシチュエーションの一つです。
      氷のすべらかさはその上層部にある薄い液体水層によるものです。
      塩または砂を振り撒くことでスリップするリスクが減少されます。","label":"凍結","summary":"表面における滑る原因となる有害な氷"}
  weather.lightning:
    label: 稙
    summary: 雲と地面または雲同士との間での静電放出
    info: |-
      {"hint":"大気中の突然な静電荷放电","info":"稟光は、雷雲内の帯電の差が臨界値に達したときに発生する強い電流です。稈光の速度はほぼ光速の三分の一で、地球上では一秒間に約百本もの稉光があります。

      避雷針（フランクリン，1752）は最初に科学的に設計された保護装置でした。
  weather.misty:
    label: 曇り
    summary: 薄く漂う靄または明るいうすぎにより視認性が低下する
    info: |-
      もやけいは、地表近くの空気層で水蒸気が凝縮して発生します。濃霧とは異なり、視界が遮られますが距離にして1km未満にはなりません。
      寒い夜に川沿いや池畔・谷間などでよく見られます。
  weather.monsoon:
    label: モンスーン
    summary: 季節によって変わる風による激しい雨期をもたらす現象
    info: モンスーンは、海洋と陸地の間で季節ごとに風が逆転することで引き起こされる気候現象です。インド・パキスタン地域では6月から9月にかけて年間降水量のかなりの割合（約70〜90％）を占めます。7億人もの人々にとって農業上重要な存在であり、その失敗により干ばつや飢饉につながる一方で強力すぎると洪水にもなる。
  weather.muggy:
    label: うだつの
    summary: 不快なほど暖かく湿りた空気が窒息感を与える現象です。
    info: |-
      湿気と高温が組み合わさった状態を指します。湿度が高いことで汗の蒸発が妨げられ、体が効果的に冷えません。
      熱指数（ヒートインデックス）は温度と湿度から計算された感覚的な暑さを示すものです。
  weather.overcast:
    label: 曇っている
    summary: 灰色の雲で全天が隠れていて直接的な日照なし。
    info: |-
      {"hint":"完全に灰色の雲で覆われており、まだ雨は降っていないが霞んでいる","info":"曇り空になるのは、8分の7または満天の雲量です。
      光は拡散されており影を作らず見えます。
      地理的に関連する抑うつ状態（季節性感情障害）では太陽不足が重要な役割を果たします。
      光線療法により日射のような明かりを模倣し助けとなります。","label":"曇っている","summary":"天空全体が灰いんげきな雲によって遮られ直射日光がない状況です。"}
  weather.partly_cloudy:
    label: 半晴れ
    summary: 空を部分的に覆う雲があり；太陽光と影が交互になる
    info: |-
      ポロヤスノは、雲量が3分の8から5分の8である気象状況です。屋外活動には最も快適な天候タイプの一つとされています。
      kumulové（積乱）雲が昼間の温かい時間帯に発達します。
  weather.rainbow:
    label: 虹
    summary: 雨上がりに空に現れる七色の光の弧。
    info: 虹は、太陽の光が雨粒で屈折し、反射されることによって生じます。赤・橙・黄・緑・青・藍・紫の7つの色からなっています。
  weather.rainy:
    label: 雨
    summary: 雲から水滴として降る。
    info: 雨は、雲の中で水蒸気が凝縮してできる。川や湖、飲料水の補給に不可欠である；平均的な雨が落ちてくる速度は秒速9メートルである。
  weather.sandstorm:
    label: 砂嵐
    summary: 強い風により沙漠地域での砂やほこりの壁
    info: 砂嵐は、強風によって大量の塵と砂が巻き上げられて発生します。ハブーとはサヘルおよびアラビア半島で見られる特定種類です。村を埋めたり呼吸器系に問題を引き起こすことがあります。
  weather.shower:
    label: '"クレモナ"'
    summary: '"カムルノンボウブクロウより発生する短時間大雨。"'
    info: |-
      {"hint":"短いが時折強烈な雨のしこり","info":"クレモナは、対流雲（積乱雲や積雲）からの短期間で激しい降雨である。\n突然起こって数分から時間以内に終わる。\nこれは夏によく見られる現象であり、太陽熱によって午後に対流と積乱雲ができるためだ。\nクレモナ後に虹が出ることがある。
      "}
  weather.sleet:
    label: 凍結雨
    summary: 雨と雪の混合物；一部解かれた雪の粒子
    info: 凍結雨（スリート）は、雪の粒が暖かい空気層を通過して部分的に溶けたときに発生します。表面に氷の薄い膜を作り出します。交通には危険です。
  weather.slush:
    label: 溶けてきた雪
    summary: 水との混合した部分的に解いた雪；寒い季節における滑って気持ち悪い地表層
    info: 融けかけた雪（スラッシュ）は、温度が氷点下からわずかに上昇し始めると発生します。歩行者やドライバーにとって非常に滑りやすく危険です。道路上ではウォーターピランイングを引き起こしてタイヤの接地性も低下させます。通常塩または砂と併用されトラクション改善のために撒かれています。
  weather.snowy:
    label: 雪
    summary: 雲から白い雪の結晶が降ってくる。
    info: 雪は、雲の中の水滴が凍って氷の結晶—雪花になることで生じます。それぞれの雪花には独特で対称的な形があります。
  weather.stormy:
    label: 嵐
    summary: 雷、稲妻、そして強雨を伴う劇的な天気。
    info: 嵐は高い積乱雲の中で発生します。稲妻とは電荷の放电現象であり、雷はその周囲の空気が急速に加熱されることによって起こる音です。
  weather.sunny:
    label: 晴れ
    summary: 雲ひとつない、明るい太陽が輝く青空。
    info: 晴れた天気は、雲が太陽光を遮らないときに発生します。太陽は地上の生命に必要な光と熱を与えます。
  weather.sunrise:
    label: 朝焼け
    summary: 日の出始めとして太陽が水平面を越えて見える瞬間
    info: 朝焼けは、太陽の円盤が地平線を超える天文的な瞬間である。その色（オレンジやピンク）はレイリー散乱によるものだ。極地方では特定の季節に起こる現象で、「白夜」などと呼ばれることがある。「緑光」という光学的現象もまれだが見られる。
  weather.sunset:
    label: 日の入り
    summary: 一日の終わりに太陽が見えなくなる瞬間
    info: |-
      夕暮れの太陽が地平線に沈む現象です。オレンジ色、赤や紫などのカラーパレットは、光散乱によって引き起こされます。
      火山噴火後の塵により大気中の色彩強調され、最も美しい日没を見ることができます。
      古代からこの自然現象は終わり・静けさとロマンスを表すシンボルとなっています。
  weather.thunderstorm:
    label: storm
    summary: 稲妻や雷、そして強い降雨・強風などを含む激しく大規模な天候変動
    info: |-
      {"hint":"雷、稲妻、大雨と風を伴う激しい嵐","info":"暴风雨は積乱雲という高さが10kmを超える巨大な雲から発生します。
      稲妻の放電現象では静電気による破壊があり、稲妻によって空気が一瞬で約3万度に加熱されます。
      雷鳴とは高温になった空気が急速膨張することで起こる音です。
      夏場には太陽により地面が暖められることで対流性の流れができて、これに基づいて暴風雨が形成されるのです。","label":"storm","summary":"稲妻や雷、そして強い降雨・強風などを含む激しく大規模な天候変動"}
  weather.tornado:
    label: トルナード
    summary: 雲から地上へ達する破壇的な回る空気柱
    info: "{\"hint\":\"地面と接触した暴風の回転列\",\"info\":\"竜巻は、嵐から生じて地表に触れる速く旋廻する空気柱です。\r\n風速が時速500キロを超えることもあります。\r\n最も多く発生するのはアメリカ合衆国のトーナド・アレー（カンザス州やオクラホマ州など）ですがチェコではまれであります。特に2021年の夏には南モラヴァ地方を襲った強力な竜巻がありました。"
  weather.typhoon:
    label: тайфун
    summary: 北西太平洋における時速120キロ以上の風を伴う熱帴旋
    info: |-
      タイフーンはフィリピン、中国、日本および周辺地域でハリケインと呼ばれる熱帯低気圧です。
      フィリピンでは年間平均して約20回の台風が発生します。
      1975年の台風ニナによって洪水があり、それにより中国人およそ2万2千人以上が死亡しました。
      この名称はおそらく「たいふう（大きな風）」という中国語に由来しています。
  weather.waterspout:
    label: water spout
    summary: 海水または湖水上で旋回して雲につながる水の流れ
    info: |-
      {"hint":"水を含んだ空気の回転する列が水面上に形成される","info":"ウォータースパウトは、水域上の回転する風柱です。
      危険な竜巻状のウォータースパウトは嵐から発生し；比較的弱い晴天時のスパウトは積乱雲からのものです。
      魚や他の動物を取り込み陸地へ運ぶことがあります。
      アドリア海とフロリダ周辺ではウォータースパウトが多く見られます。"}
  weather.whiteout:
    label: 白色化
    summary: 極寒での暴風時に発生する状態であり、雪によりすべてのコントラストが消失します
    info: ホワイトアウトは、雪の嵐と雪山からの反射によって空と地面が一つの白い領域に溶け合う現象です。視界を完全に遮り方向感覚を失わせます。極地や山岳地域では致命的な危険があります。飛行機パイロットもホワイトアウトで混乱し水平線を見誤ることがあります。
  weather.windy:
    label: 風
    summary: 木を曲げ、葉っぱを飛ばす強い空気の動き。
    info: 風は地球表面が不均等に暖められることによって生じます。これにより、高圧地域から低圧地域へと空気が移動します。
