lang: el
pivot: false
title: Πολύ Καλός Προγνωστικός Μηχανισμός για τους Δυνάμεις και τη Γήϊνη!
cards:
  weather.aurora:
    label: ΠΟΛΙΚΉ ΦΩΤΕΪΝΌΣ
    summary: Φυσικό φωτεϊνό φαινόμενο που προκαλείται από το ηλιακό αέρα.
    info: Η Πολική φωτεινός λάμψη είναι το αποτέλεσμα που δημιουργείται όταν συνδυάζονται με κύμα νετρών για την Διαφθορά.
  weather.avalanche:
    label: Λαβίντα
    summary: Μάζα χιονιού και πάγου που πέφτει από το ακρωτήριο.
    info: Η λαβίντα είναι γρήγορη κινούμενη μάζα χιόνου που ολισθαίνει σε βραχώδες ακρωτήριο της νυχτέρας.Οι πιο επικίνδυνες είναι η «ψιφωδεια» - φαινόμενο διασποράς ρευστού υλικού – , που μπορεί να αποκτήσει ταχύτητα πάνω από 300km/t.Στα Δυτικά Γαλλικά Άλπια θανατώνονται κατ' εξοχὴν 487 άνθρωποι ετησίως.
  weather.blizzard:
    label: Χιονοθύελλα
    summary: Έντονη χιονοθύελλα με αφρόχιο και νώνες που δημιουργούν σχεδόν μηδενική ορατότητα.
    info: Η χιονοθύελλα είναι έντονη κάπνισμα που συνδυάζει αφρόχιο με δυνατές βροχή των νών για να φτάσει σε σκοπό λευκό - white out – με πολύ υψηλά επίπεδα ρεγκλαβατών ψιλών χιονιών.
  weather.breezy:
    label: ψυχαλήτι
    summary: Ένας ευχάριστος απαλός περνάω νέφους που δροσίζει τη θερμή μέρα
    info: "Το ψυχαλήτι είναι ένας απαλός περνάω νέφους με ταχύτητα 6–11m / s σύμφωνα με Beaufort βαθμό 3 - 4\nΠροκαλεί κίνηση φύλλων , των μαλλιών και λεπτών διαβάζει \nΦυσιολογικά για να μειώσει την αίσθηση της ζέστης με την εξάτμιση της"
  weather.clear:
    label: Καθαρό
    summary: Πλήρως καθαρός ουρανός χωρίς ίχνος νεφών.
    info: |-
      Ο καιρός είναι μεταβλητή που χαρακτηρίζεται από συγκάλυψη λιγότερο των οχτώμισης για νέφος
      Επιτρέπει τη δύναμη φθογγού του ήλιου και βελτιστοποιεί την παρατήρηση του αστρονομικού φαινομένου,
      Στη νύξη, η θερμική ακτινοβολία είναι πιο ιδιαίτερη· έτσι οι θερμοκρασίες μειώνονται πιο γρήγορα.
  weather.cloudy:
    label: Συννεφιασμένο
    summary: Ο έξω χώρος καλύπτεται από πυκνά νεφέλια.
    info: Τα νεφέλια είναι ορατά συμπλοκώδη από μικρές γύψους των υγρών που βρίσκονται και λεπτή διαχύσεις φθορισμού. Για πάνω από 60% της γης πάντα καλύπτεται.
  weather.cold:
    label: ζεστα
    summary: Πολύ ρηχή ζέστη
    info: |-
      Η υπερβολική καταιγίδα που ξέχνω της αυστηρότητά μου συμβαίνει εξαιτίας νεφών βορείων γεύσεων διαθλαστικών φυσικών λεπτομερειών
      Οι πιο χαμηλές φυσικές θερμοκρασίες που έχουν μετρηθεί στη Γη είναι –89,2°C στη Διεθνή Σταθμό «Βοστόκ»
      Στην περίπτωση της ψύξης, το σώμα αντιδρά με την προσαρμογή των αγγείων
  weather.dew:
    label: ροζή
    summary: Καψουλίδια νερού που συμπύκνωση σε επιφάνεια μετά από χαμηλή θερμοκρασία.
    info: |-
      Η ροζή είναι νερό που συμπύκνωση ατμών του αέρα για κάθε φοβερό βράδυ ή μεγάλη διάρκεια λες και
      Σχηματίζεται όταν το επιφανεϊκό ψύξη πέσει κάτω από το σημείο ΔΕΥΤΕΡΟΛΙΠΑΝΤΩΝ,
      Δίνει σημαντική ποσότητα νερού για τα φυτά και τα ζώα σε ξηρές περιοχές.
  weather.drizzle:
    label: Ρομπατίζει
    summary: Πολύ φθηνό βροχή σε μικρές σταγόνες.
    info: Ο ρομπατίσμας είναι μια πρόκληση από τύχερους βρογδυλάκια καθώς η σφήνωση δεν γίνεται από convective νέβες αλλά από λεπτό stratus cloud cover.
  weather.drought:
    label: Ξηρασμός
    summary: Διαρκής έλλειψη βροχής που προκαλεί άνευ προϋποθέσεων ιχνονερο.
    info: Ο ξηρασμός είναι μια κλετοδύναμη συγκυρία που χαρακτηρίζεται από διάρκεια λιμοστιγής βρέχων. Δημιουργεί τροφή για φθορές στην αξία της νεροβιώσης, ανεπαρκείς ποσότητες νερού και πυρκαγιές.
  weather.dust_storm:
    label: Σκωρδή
    summary: Πάχυ φουσκωτό νέφος βρίζει την αέρια περιοχή.
    info: Η σκόνη προέρχεται από τις ξηρές χαμηλώσεις και μεταφέρεται εύκολα για λίγα δευτερόλεπτα.
  weather.flood:
    label: Πλημμύρα
    summary: Συνεπαγόμενη παραβολή νερού από τον ρυμούλιο σε έναν χώρο.
    info: Η πλημμύρα συνέχεται από υψηλή βροχή κι εξάγωγο του ξηροβίκου λόγω διασποράς νερού με φθορώδη γεωφυσικό φαινόμενο.
  weather.foggy:
    label: θολωμένο
    summary: Πυκνό χαμηλό ροζάνι που μειώνει την ορατότητα.
    info: Το όμβρος είναι νέφη στερεωμένα πάνω από το έδαφος και διαµορφώνονται µε βάση γύψους φυλλακίδες. Δηµιουργείται με λήξη υγρασίας και μειώνει την ορατότητα.
  weather.freezing:
    label: mraze
    summary: Η Θερμοκρασία που είναι κάτω από το σημείο πήξης προκαλεί πήξη.
    info: "Το παγωμένο νερό είται υπό τη θερμοκρασία μιας βαθμίδας αφής συχνά κάτω από 0°C γύρω από διάφορους φυλλώδη λεβητούς\nΠροκαλεί βιολογικές απειλές σε φυτά και προκαλεί αξιοσημείωτες ατυχήματα \nΟι πιο ισχυρές παγωμένες ημέρες στη Γερμανία συνήθως συμβαίνουν στον Δεκέμβριο"
  weather.frost_flowers:
    label: Παγωμένα λουλούδια
    summary: Σχηματίζονται νεφελώσεις βλέμματος σε ψυχρές επιφάνειες.
    info: Οι παγωμένες λουλούδια είναι κρυστάλλωση υγρασίας σε ακραία μπόχθη ή δρώμενα της γήινης φύσης.
  weather.frosty:
    label: Ψυχρό πρωϊ
    summary: Επιφανειακή χιονόπτωση ; Γεμίζει τα φυτά και το έδαφος.
    info: |-
      Η χιονόπτωση προκαλείται αυξάνουμε τη θερμοκρασία εδάφους να μειώνεται κάτω από το σημείο πήξης και γίγνεται δύναμη βραχέως λεβεθείς φυσικής
      Δημιουργεί εντυπωσιακά σχέδια σε φύλλα, παράθυρα και επιφάνειες εδάφους,
      Παραλλάσσει από το ψύχος(ψύχος) : η χιονόπτωση είναι υπολιμανισμένος ατμός , το όψυχος είναι παγωμένος ρос.
  weather.gloomy:
    label: Σκοτεινό
    summary: Καθιερωμένος σκοτεινός καιρός με ατμόσφαιρα.
    info: Ο σκοτεινός καιρός χαρακτηρίζεται από πυκνά μαύρα νέφωσα του ουρανού, ελαχισμένο φώς και δροσερή ή βροχερή αтмосфαιρα. Δεδομένως γι' αυτόν τον λόγο συνδέεται με τη μελαγχολία και την άνοιξη.
  weather.hailing:
    label: Παγωμένος Δάσκαιλος
    summary: Στίβικος φθορισμός - Οι παγωμένοι δάσκαιλοι μπορούν να προξενήσουν ζημιές.
    info: Η βροχή με παγωμένους στίβικους δάσκαιλους επώδυνη από τύφλιπτε ροζ ομίχλη και νερό για λίγο.
  weather.haze:
    label: Ομίχλισμα
    summary: Μειωμένη έμψυχη από κονίακιθο , δύνατο φωτισμό η νεφελή.
    info: 'Το ομίχλισμα είναι μειωμένη ατμόσφαιρα που συμβαίνει λόγω της ύπαρξης κονίακιθου , δύνατου φώτισμου ή νεφελής . Διαφοροποιείται από το βάζο : το βάζο γίνεται από σταγόνες νερού ; το θεϊκό από στερεά ιδιότητα.'
  weather.heat_lightning:
    label: θερμικά αστέρια
    summary: Φωτεινά σημεία που δεν προξενούν ήχο.
    info: Θερμικά αστέρια είναι φώς που δημιούργεται όπως η κλυδή σε μακρινό τζόχο λόγω της γενικής βροχής νεφελιοβαθμίδας.
  weather.heat_shimmer:
    label: ψεφιδωτό
    summary: Οπτικό νεύρωμα για διάβασμα.
    info: Το Miren είναι ένα πτητικό φως σε ψυχρά αέρια λόγω του μήλαν βαθμών κύπτησης.
  weather.heatwave:
    label: Γεύθερμο
    summary: Περίοδος πάνω από φυσιολογική ισορροπία.
    info: |-
      Η κυματοσειρά ζέστης είναι μια περίοδος ακραίου τζόγου υπερβαίνων τις φυσιολογικές σезονικές θερμοκρασίες
      Ο Γεύθερμος γύρος του 2003 στην Ευρώπη προκάλεσε νέφελες διαχείρισης πάνω από 70.000.
  weather.hot:
    label: Θερμό
    summary: Εκτρέπων ζέστη που προκαλεί ανεπιθύμητη και υγεϊνική
    info: Ο εκτός χειμέρα θερμού που συνδυάζεται με τη βλάστη από κίνδυνο να δώσω για λήξη φθογχοβολικής αφυψώσεως.
  weather.humid:
    label: ΥΓΡΟΣΤΕΙΑ
    summary: Διαβροχισμένος αέρας
    info: |-
      Η υγρασία μετρά την ποσότητα ατμών νερού στους αέρα
      Πλήρως κορεσμένος είναι ο αέρας με 100% σχετική υγρασία· γυρίζει λες βραδύτερα δεξιά,
      Απόθεται φαφλίτα στο δέρμα
  weather.hurricane:
    label: ""
    summary: ""
    info: Ένα τυφών αποτελεί ένα ριζωμένο κύκλων στην περιοχή του Διαιρέσεως Γάδειρο - νότιο Αтлантиκo με εξαγοραστικές δυνάμεις για λεβάντια.
  weather.ice_storm:
    label: Χιονόβιο
    summary: Παγωμένη βροχή που καλύπτει τα πάντα με λεπτό stratum transparentní led.
    info: Η χιονόπληγμα που ξεκινά με τρυφερή ατμόσφαιρα και σχηματίζει δέλδρων λεπτώ φύλλο γυάλινος εξαιτίας βροχής νερού.
  weather.icy:
    label: Λάχη
    summary: Παγωμένος επιφάνεια που προκαλεί γλίσχρονα
    info: "Το παγωμένο νερό ή τήλιστη χιόνου σε κρύβα επίπεδα δημιουργεί λάχη ακαθαρσίας με γυψώδη φαινόμενο\nΕίναι μία από τις πιο εξίσου βλαβερές ωντικές καταστάσεις για την κυκλοφορία \nΗ γλίσχρονη ιδιότητα του πάγου οφείλεται σε λεπτή στρώμα υγρού νερού στην επιφάνεια"
  weather.lightning:
    label: σπινθήρας
    summary: Ήδη ηλεκτροστατική απελευθέρωση μεταξύ νεφών -Γης.
    info: |-
      Σπινθήρας είναι ισχυρό ρεύμα που δημιούργεται ακριβώς μόλις το φορτίο σ'ένα βροχερό νέφος γίνει κρίσιμο
      Η ταχύτητά των σπινθηριασμών είναι λίγο περισσότερο από το τρίτο μέρος της ταχύτητας του φωτός,
      Περίπου 100 σπινθήρες χτυπούν στη Γη κάθε δευτερόλεπτο.
  weather.misty:
    label: Μιστήρα
    summary: Χαμηλή ορατότητα λόγω λεπτού φλογιού θεϊκού.
    info: Ο μιστήρας εμφανίζεται όταν το νερό συμπύκνωση πάγου αέρα κοντά στο έδαφος δημιουργεί λεπτό φλο για βροχή ή αθρώπινη αντίληψη. Διαφοροποιείται από την πυκνή βροχή στο χειμώνα, καθώς η ορατότητα είναι περιορισμένη, αλλά υπερβαίνει το 1 χιλιόμετρο.
  weather.monsoon:
    label: Μουσώνας
    summary: Σεζονιέργεια ή αλλαγή νότων που προκαλεί περίοδο ιntensif βροχοπτώσεων.
    info: "Το μουσώνας είναι φυσικό κλιματικό ρεύμα προκαλούμενο από τη σεζονιέργεια άλωσης νότων ανάμεσα στη θάλασσα και τη γη. \nΟ Indo-pakистανική μουσώνας δίδει από Ιούνιο έως Σεπτέμβριο 70 - 90% των ετήσιων βροχοπτώσεων. Για 700 εκατομμύρια λαούς εξαρτώνται από το μουσώνας για τη γεωργία."
  weather.muggy:
    label: δυσνοερός
    summary: Ένας ανεπιθύμητος ξηρός και όχι έντονος αέρας
    info: "Ο δυσνοερός αέρας είναι σύμπλικτη των υψηλών θερμοκρασιών και μεγάλου ποσοστού ρελατιβή βξθχότητας\nΗ ψηλή νεφελιδοποίηση γενικά λειτουργεί ως φραγμός για την εξάτμιση της ιζής , οπότε η σώμα δεν μπορεί να χαλαρώσει αποτελεσματικά \nΤο heat Index(ΔΕΙΚΤΗΣ ΘΕΡΜΑΝΣΗΣ ) συνδυάζει τη ζέστη και τη βξθχότητα για να εκφράσει την αντιληπτή θερμοκρασία"
  weather.overcast:
    label: Ζαταγκω
    summary: Ο ουρανός είναι πλήρως καλυμμένος από γκρι σύννεφα χωρίς ξεκάθαρο θέα.
    info: Η συμπληρωτική νεφοσκία ενδέχεται όταν η αόρατη πάγους φθάνει τα μισά και λύγνει διαβρώζοντας το βάρος για την αξιοποίηση της επιφάνειας. Δεν υπάρχουν σκιές και ο φωτισμός είναι διαψευστικός. Για την επίλυση της γεωγραφικά εξαρτημένης καταθλιπτικής διαταραχής (ΣΑΔ), έχει σημασία η άρνηση του ήλιου.
  weather.partly_cloudy:
    label: Ημισυρός
    summary: Πρώτα φθάνει το βροχή.
    info: Ο πολύ ημισυρός καιρός είναι μεταβατική σχέση απουσία υδάτων της νεφελιότητας για λίγο.
  weather.rainbow:
    label: καφκαΐα
    summary: Χρωματιστό τόξο στον ουρανό μετά από βροχή, όταν ξεψυχάζει o Ηλιος.
    info: '{"hint":"χρωματιστό τόξο φωτός που είναι ορατό μετά από βροχή όταν ο ήλιος λύγνει δέκτη νυδραϊώδη σταγόνες","info":"Η καφκαΐα γεννιέται από την κάθετη και ανακλαστική ακτινοβολία του ηλιακού φωτός στις σταγόνες βροχής. Διαθέτει επτά χρώματα - κόκκινο, πορτοκαλί, κίτρινο, πράσινο, μπλε, ινδιγό και μωβ.","label":"καφκαΐα","summary":"Χρωματιστό τόξο στον ουρανό μετά από βροχή, όταν ξεψυχάζει o Ήλιος."}'
  weather.rainy:
    label: Βροχή
    summary: Από τα νέφελα πέφτουν σταγόνες νερού ως βροχή.
    info: Η βροχή παράγεται από τη συμπύκνωση υδρατμών μέσα στους νέφελι και είναι ζωτική για τη διαβίβαση νερού σε ποτάμια, λίμνες και φράγματα πόσιμου νερού· το μέσο ρυθμός πτώσης της βροχής είναι 9 m/sec.
  weather.sandstorm:
    label: βούτα
    summary: Πεδίο φωτός γεμάτο από σκόνη.
    info: Η ξεριά βούτα που χαμηλώνει συχνή τόσο μεγάλη και απίθανη δύναμη εξακολουθεί να λέγεται haboob.
  weather.shower:
    label: '"Παγωδίτα"'
    summary: '"Κοντή άντραζο βροχή από νεφέλη Cumulo-nimos"'
    info: '{"hint":"σύντομη αλλά μερικές φορές έντονη βροχή","info":"Η παγωδίτα είναι συντόμου χρόνου και δυνατή βροχή από τύπου convective νεφώδης (cummus ή cunmulombos).\nΣυμβαίνει γρήγορα και λήγει σε λίγα λεπτά μέχρι ώρες.\nΕίναι χαρακτηριστική για το καλοκαίρι : το solar heating προκαλεί convection και την δημιουργία cumulumbous το απόγευμα .\nΜετά την παγωδίτα , μπορεί να εμφανισθεί η ιριδα."}'
  weather.sleet:
    label: βροχή
    summary: Σύμπλεγμα βροχής - υψηλής ή παγωμένης.
    info: Το χιόνι που τήκεται μέρος απ' έξω καθώς διασχίζει ελάττημα συγκεκριμένης θερμοκρασίας φτάνει στο έδαφος λειτουργώντας ως νύχι για την κυκλοφορία.
  weather.slush:
    label: Λεμφωδές χιόνι
    summary: Παραμελτωμένο χιόνι με νερό - γλιστερή επιφάνεια
    info: Το λεμφωδές χιόνι εκτίθεται συχνά προσαύξηση θερμοκρασίας κοντά του βρασμού απόψεγή να δώσει μια γλιστερή φλεβάζουσα επιφάνεια· Γίνεται πολύ επικίνδυνο για πεζούς και οδηγούς · Δημιουργεί hydroplaning και μειώνει την πρόσφυση των ελαστικών
  weather.snowy:
    label: Χιόνι
    summary: Από τα νέφια πέφτουν λευκές σταγόνες.
    info: Το χιόνι δημιουργείται από τα νέφια που κάθε φυσαλίδα θαλασσινής σχηματίζει μικρούς λευκούς κρύσταλλων - βροχή εξ αυτών γίνεται όταν η ζέστη είναι πολύ υψηλή.
  weather.stormy:
    label: Καταιγίδα
    summary: Δραματικός καιρός με βολταχτ, γροθιάσματος και ισχυρή βροχή.
    info: Η καταιγίδα προκύπτει από υψηλά συννέφωσα νεφέλους με θύμβο. Το βολταχτ είναι το φθόρισμα λόγω ηλεκτρικής διαρρήξης· το γροθιάσματος είναι το ήχος που προκαλείται από την ταχεία ζέσταση του αέρα γύρω από το βολταχτ.
  weather.sunny:
    label: Ηλίο
    summary: Καθαρός εξάτμισης νύχι με βγαλμένο τον Ήλιο.
    info: Ο ηλιοφόρος καιρός παρουσιάζεται όταν το συννέφωμα δε μπλοκάρει τη λήψη φωτός από τον ήλιο.
  weather.sunrise:
    label: Ηλιοφάνεια
    summary: Στιγμή όπου o ήλιος εμφανίζεται πάνω από το ορίζοντα στην αρχή της ημέρας.
    info: Ο ηλιοβασίλευμα είναι της από πάνω στρώμα όταν κύκλου δίδεται μέχρι να φθάσει στο βήμα για να λάβει την εξουσία.
  weather.sunset:
    label: Δύση
    summary: Στιγμή που o άνθρωπος εξαφανίζεται πίσω από την απόσταση.
    info: |-
      Η δύση του ήλιου είναι μέρας πεποίθημά ότι κατεβαίνω ακόμα συγχώρει για να βρίσκεται πίσω από τη λήψη φωτός
      Οι χρωματικές παλέτες(φωτεινό, κόκκινο, μπλε), εξαρτώνται από την εκδήλωση του φωτός του ηλίου,
      Τα πιο ωραϊκά φαινόμενα δύσης του έρχεται μετά από θερμικές εκρήξεις, υπάρχει περισσότερο σκόνη στην ατμόσφαιρα.
  weather.thunderstorm:
    label: Καταιγίδα
    summary: Δυνατό ατμοσφαιρικό φαινόμενο με βροχή, αστραπή & κεραυνό
    info: |-
      Η καταιγίδα προέχει από τους νεφώνων συμβάλλοντας με ύψη άνω των 10km
      Το εκσκαφή φωτισμός δύναμης είναι η λειτουργία του θεϊκού βολταΐζει για να ζεσταθεί τον αέρα σε ~30.000°C
  weather.tornado:
    label: Τυφώνας
    summary: Περιστροφική στήλη αέρα απ' το σύννεφο μέχρι το έδαφος.
    info: Ο τυφώνας είναι γρήγορη περιστροφική στήλη αέρα η οποία δημιουργείται με βάση κύψα χωρίζοντας την επιφάνεια της Γης. Η ταχύτητα του ανέμου φθάνει να υπερβαίνει τα 804km/t. Δεν είναι λίγες οι φορές που συμβαίνει στη «Λane» των τυφώνων στις Πολιτείες H.A.(Κανσάς,Oklahoma,Texas).Στην Τschecho-Slovakeia υπάρχουν ,όμως είναι σπάνια .Ένας ιδιαίτερα έντονος τυφώνας προσέπιασε το νότιο Μorava το καλοκαίρι του '21.
  weather.typhoon:
    label: Ταΐφον
    summary: Ένας τροπικός κυκλώνας στον βορειοδυτικό Ωκεανό.
    info: "Ο ταϊφούν είναι ένας υπερυψηλής πιέσης κυκλών στους νόμιμους αγωγούς φθάνοντας μέχρι για διαδρομή βορειοδυτικού Πακιστάν. \nΗ Φιλιππινική Δημοκρατία λαμβάνει περίπου 48 ταϋφούνες ανά ημερολογιακό Έτος."
  weather.waterspout:
    label: ΝΕΡΑΪΑ
    summary: Περιστρεφόμενη στήλη νερού που συνδέει τη θάλασσα η το λιμνάξιο με τo νέφοs
    info: |-
      Η νεραϊά είναι περιστροφόμενη στήλη αέρα με υδρατμών κυκλοφορούν του θαλάσσιο δωμάτιο
      Οι επιβλαβείς φονικές νεραΐες γεγεννίζονται από βροχή· λιγότερο ισχυρές νεραΐες weatherfair προέρχονται από cumulusnimbus
      Μπορεί να αποθαρρύνει ψάρια ή άλλα ζῷα και να τα μεταφέρει στην ξηρά
  weather.whiteout:
    label: Λευκή Γερανή
    summary: Κατάσταση πολικής βροχής, καθ' υποψίας της ιδιότητας του νέφους να προκαλεί απώλεια όλων των αντιθέσεων
    info: |-
      Το Whiteout συμβαίνει όταν μια βροχή πάγου και η ανάκλαση του νέφους επώδυνων δύο φόρμες για να λειτουργήσει ως ένας μόνο λευκός πεδίο
      Παρέχει μηδενική ορατότητα και αποπροσανατολισμό,
      Είναι θανατηφόρος κίνδυνος σε πολικό ή ορεινό περιβάλλον
  weather.windy:
    label: βροχερό
    summary: Δυνατή κίνηση αέρα που κάμπτει δένδρα.
    info: Ο αέρας που κινείται δημιουργεί ροπή λόγω της άνισης εξάχλυσης στη γήϊνη φθινούσα με βάση τη νύκτα.
