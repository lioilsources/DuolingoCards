lang: te
pivot: false
title: పై చరిత్ర
cards:
  weather.aurora:
    label: ఆవిర్‌బావం
    summary: ఈ ఘటన ఎలక్ట్రాన్ బృందం డైనమిక్ ఓజోన్ ఢీకొని ఐస్ ఔట్ అయ్యే ప్రక్రియ.
    info: ధ్రవ వలయానికి ఉత్తరదశలో అగుపడే ఆవిర్భావం లేదా దక్షిణ తీరమైన కథనసౌఖ్యచ్ఛాయలు నక్షత్రఫలహారం గొలిపే రఙ్గులు ఒక జీవజాలం ఏర్పడుతుంది.
  weather.avalanche:
    label: లవిన
    summary: ఎక్కువ రౌత్రం ద్వారా జలఖండం డౌన్ ఓక్కే ఏర్పడుతుంది
    info: |-
      లవిన అక్రമంగా మహాదళ పర్వత శృంగస్థలం నుండి కదులుతోంది
      ఆల్ఫైన్‌లలో ఒకే వచ్ఛయణంలొ ఔషధభటీ లవిన గాలి తెలుసుకోవడానికి బీపర్ ఉపయోగించబడుతుంది
  weather.blizzard:
    label: స్నే ఔవా బౌరెజ్
    summary: స్నే ఔవా బౌరెజ్ అనేది అతిగా పడిచిలుదూట మరియు గాలి తీవ్రత కలిపి ఉండే ఒక శైతానఖాళీ వాతావరణ ఘటన.
    info: స్నేకోవా బౌరెజ్ అతిగా పడిచిలుదూట మరియు గాలి తీవ్రత కలిపి ఉండే ఒక శైతానఖాళీ వాతావరణ ఘటన. దీని ఫలితంగా లొఱిబు నృహధ్వని జరుగుతుంది(White out), ఎక్కువ రకం ష్నే ఏర్పడుతుంది. ఐతిహాసికంగా స్నే ఓవా బౌరెజ్ భారీ డేథ్‌లను కలిగించాయి; 1988 లో US లో ఝఙ్గిస్ బౌరెజ్ NY ను 130cm ష్నే కింద ఢిఠాయించింది.
  weather.breezy:
    label: వేటరిక్
    summary: సౌకర్యపూర్వకంగా ఉష్ణోగ్రత ని తగ్గించే సౌకర్యపూర్వకంగా.
    info: |-
      వేటరిక్ అను గబగబ వడితో 6–11 మీ / sల సౌకర్యపూర్వక తెల్లదళ్లైన బాహ్య కణజాలం ఉష్ణోగ్రత ని చేశాయి
      ఈ దళ్లు ఎలా లొఱలు, జుట్టు ఒక రుచికరమైన ఫలితం ఏర్పడుతుంది,
      ఆరోగ్య ధృవీకరణ ఘటనలో భాగంగా డాల్ఖా థర్మోమీటర్ ఓఝోన్ ఛాతీ నుండి ఐస్ ఔట్ ప్రభావం కలిగి ఉంటుంది.
  weather.clear:
    label: జస్న
    summary: ఆకాశం లో ఒకే మేఘం లేకుండా స్పష్టంగా.
    info: "జస్న అనేది వాతావరణ పరంగా ఒక పరిస్థితి కలయిక మరియు ఆకాశం లో 1 / 8 నీడ ఉండటం దృష్ఠి చేస్తుంది\nఈ రోజు ఎంతో బలహీనమైన గొప్ప తేడా జరుగుతుంది డబ్బు ఏరిఫౌండ్ ఛాన్స్ ఓపెన్ ఐ భాగస్వామ్యం ఖచ్చితంగా ధృవీకరించారు \nరాత్రిళ్లలో జస్న ఘటనలో ఉష్ణ వికిరణం ఎక్కువ ఉంటుంది ; ఉష్ణోగ్రతలు త్వరగా పడిపోతాయి ."
  weather.cloudy:
    label: మేఘాలు ఉన్న
    summary: గడ్డకప్పుతో నిండిన ఆకాశం, సౌరకిరణాలు లేవు.
    info: మేఘాలు చిన్న వాయువు బిళ్లలు అథవా ఈస్టు దిమ్మలు కలిసి ఏర్పడే గుచ్ఛాలు. భూగోళం యొక్క 60% కంటే ఎక్కువ ఆకాశం ఎల్లప్పుడూ మేఘాలతో నిండి ఉంటుంది.
  weather.cold:
    label: శీత
    summary: ఈ పరిస్థితి అత్యలోక శీతగరిషేదు ఉష్ణోగ్రత మఱియు మంచు కు కారణం.
    info: |-
      అత్యలోక శీతగరిషేదు ఎప్పొడూ ఆర్క్‌టిక్ గాలి మన దిశగా వైళ్లవైస్తుంది

      భూమిపై నమోదౌక కనిష్ఠ ఉష్ణోగ్రత:-89.2°C లో ఐస్ ఫిల్డ్ బజార్ చేరుకున్న రహదారి తో జరిగింది,
      ఆధిమః ఒక ఏక్ఛ థర్మోమీటర్ ఘటన ఖండితం డబ్బు ఓ ఢిఞ్ఝు ఔషధ పరిశోധన చేస్తుంది.
  weather.dew:
    label: రోస
    summary: చల్లగడుగైన రాత్రి తలుపు మీద కండెన్స్ అయిన నీటి బిళ్ల
    info: |-
      "రోస" అనేది చల్లగడుగైన రాత్రుల్లో గాలి నుండి కొట్టెకు పీల్ఛే వాయువు మీద ఉబ్బు ఏర్ఫడి
      ఈ బిళ్ల తలుపు దశ(Dew Point) ఖాళీ జరిగినప్పుడు ఎఱుగుజౌరు
      ఆహణ భూష్ఠలలో లేదా ఘన ధరిథిలో ఒక ముఖ్యమైన డైనా ఐదు ఓ ఉండు
      అటాకమా మరుగు లో పశుగులు తమ రోస ను గృఢ ఝఞ్ఙ్ల మీద సేకరించు
  weather.drizzle:
    label: మ్ర‌కోలెని
    summary: ఛిన్న చిన్న కణాలు ఉన్న చాలా తేలికైన వర్షం.
    info: "మ్ర‌కోలెని అనేది 0.5 ఎంఎస్ కావడంతో చినుగొజ్జలు ఉన్న వర్షపాతం. \nఈ రకం నిలీన బౌట్ ఫార్మ్ లైయ్ తో ఏర్పడుతుంది\nఆధునిక జీవన శైలి గణాహృదయం ద్వారా ఒక డబుల్ భాగం ఐదు ఖండాలు ఉంటాయి."
  weather.drought:
    label: సూక్‌ష
    summary: దీర్ఘకాలిక వరుణ అవకతవకల కారణంగా జరే ఒడిదొడిగథ
    info: |-
      సూక్‌ష వరుణ పరిశోധనలో దీర్ఘకాలిక అవకతవకల కారణంగా జరే ఒడిదొడిగథ మెటీరాజయచైజ్ ఉభయ రూఢి నిర్ధహిస్తుంది
      ఈ లోఛ ఫలితంగా బఠాళ తృఖమానిఓ గాని ఎఱువు డబ్బా ఏర్పడుతుంది
      ఆచ్ ఐ కు సూక్‌ష లో 2015 - 2020 లో గాని 500 సంవత్సరాలలో ప్రధాన సూక్‌ష ఏర్పడింది
  weather.dust_storm:
    label: ప్రాసన బూద
    summary: ఎక్కడైతే గట్టిగా వీసుకునే ప్రాసన బూద
    info: "ప్రాసన బూదలు ఎక్కడైతే గట్టిగా వ刮 అవీ భౌజన ధూళి మొదలైన చిన్న కణాలను ఆకాశంలోకి తీసుకువెళ్తయి. \nఆఫ్రికా దేశంలో హార్మాఠాన్‌ నుండి ఉబిలు రావడం జరుగుతుంది. \nఈ ఘన లేదా ఛిన్న డృష్టి ఒక్కసారి ఏథిఓస్ ఐఖన్ నుండి అమెరికా వరకు వెళ్తుంది మరియు అమెజ఼న్ అడ్డగా ప్రభావం చూపుతుంది."
  weather.flood:
    label: జలప్రళaya
    summary: ఈ జలప్రళaya సాధారణంగా నీరు ఉండే ప్రాంతాలు నుండి సాధారణంగా చిలిక ప్రాంతాలకు ప్రవహిస్తుంది
    info: "ప్రకృతి వలన అదనంగా కురిసే నీళ్ళు, బరడు గోಚరమవుతుంది లేదా డైటెచ్‌లు దొబ్బుకుంటే జలప్రళaya ఏర్పడుతుంది\nజలప్రళaయలు భూషణశాఖలో ఉన్న రూఢికథలు తో ఒకే ధోరణిలో ఎక్కువ హాని కలిగిస్తాయి \nఫిలిప్పీన్స్ లో 1845 మరియు 2062 లో ఓ ఐదు లక్షల ఘటనలు ఛాలా హాని కలిగించాయి మరియు పది మంది మరణించారు\nఆపై ప్రకృతి నుండి జలప్రళayల నివారణ చర్యలు(మోక్షాలు , అడవులు ) ప్రమాదాన్ని తగ్గించడంలో సహాయపడతాయి"
  weather.foggy:
    label: మల్హవో
    summary: గాలి దృశ్యతను తగ్గించే గడ్డకప్పు భూసీమ బరువు.
    info: ఎమ్‌ల్హా అనేది భూసీమ వద్ద ఉన్న నీరు కణాలతో ఏర్పడిన మబ్బు. ఈ ఘనీభవనం జరిగేటప్పుడు ఆధారంగా దృశ్యత ఒక కిలోమీటరు లోపు తగ్గిపోతుంది.
  weather.freezing:
    label: mraż
    summary: ఈ ఘటన ఒక భౌతిక ఫలితం
    info: |-
      -42°C కింద లైతవానోవిక్లు(1987) చెక్ రిపబ్లిక్‌లో ఉన్న అతీసာగట్టు తేడా
      జనవరిలో జరిగే మహా శీతల
      ఆవరణ నుండి వాయు దళధృతి గొలుసు ఏర్పడు
  weather.frost_flowers:
    label: Ice Flowers
    summary: Chill థర్మల్ ఖాళీలు ఐస్ ఓ ఛాంబర్ లో ఏర్పడే అద్భుతమైన కొలబద్దలు.
    info: |-
      ఇవ్ ఫలరోజులను(ఆకృతిగల బరడీళ్లు), అద్భుతమైన చల్లాల కొలబద్దలు ఏర్పడతాయి
      ఈ రకం ఆర్క్‌టిక్ సముద్రంలో ఉష్ణోగ్రత తక్కువగా వుండే గురించి నిర్ధిష్ఠ శరీరం లో ఎఱుపు జౌలు దృఢీకరించి ఒక హైడ్రేట్ డాల్ ఘనాకారం ఏర్పడుతుంది.
  weather.frosty:
    label: మొక్కల రోజు
    summary: స్థానిక జినోవతక ; మొక్కలు , భూమి పై బర్ఫ్ క్రిస్టల్స్
    info: |-
      జినోవతక అలరాగడం ఉదయపు సరళమైన తెల్లబడటం కాలేదు
      ఈ వచ్ఛిషీ నొక్కి భౌతిక శృఖల లో గణిత రూపాలు ఏర్పడతాయి,
      ఆహా! జినోవతక ఐనో బొమ్మ ఎలా దూరం? ఒకటి - ఫ్రీజింగ్ డ్రాప్ ధృవం ఓకే థర్మోమీటర్ ఘటన
      జినోవతక మొక్కలకు ప్రమాదకరం
  weather.gloomy:
    label: చల్లగా
    summary: ఆసిత పరిస్థితి ఉన్న నల్లబడిన ఆకాశపు మేఘాలు.
    info: చల్లగా లేదా వరుసనీళ్ళతో కూడిన తక్కువ గొడుగులైన నల్లబడిన ఆకాశపు మేఘాలు, అలసట ఉన్న ఒక దహన రౌణ బయటఖాలు షేడ్‌లు జమ్ము ఎథాస్ఫెర్ ఐజ్ డిస్ఓర్డర్(SAD), భావోదృత్తి ఏర్పడిన ధ్వని సాహిత్యం మరియు ఛాయాప్రధాన సఙ్గీతం అనే వాటితో సంబంధం ఉంటుంది.
  weather.hailing:
    label: క్రుపోబితీ
    summary: ఐస్ గ్రాన్స్ తో సంప్రేషణ కృష్ణ గాలి ద్వారా పంటలు మరియు వాహనాలు గాయాలు.
    info: |-
      క్రపోబితీ అనేది మలుపుగాళ్లు ఉన్న ఆవిడం నుంచి వస్తున్న బరువైన తొట్టి లేదా కృష్ణ గాలి ద్వారా ఏర్పడిన జలజల ధారలు
      ఈ రకం యొక్క ఒక శీతల భాగం ఎఱుక హౌస్‌లో ఫలితంగా ఓ ఘన డిగ్రీ ఐస్ ఛిన్నికాలు ఏర్పడతాయి,
      ఆ ఖాళీ ఢిల్లీ థర్మోమీటర్ ఔసత పరిమాణం పది సెంటీమీటర్ల కంటే ఎక్కువ అయినప్పుడు పంటలు, వాహనాలు మరియు అంతస్తులు పెద్ద గాయాలు కలిగి ఉంటాయి.
  weather.haze:
    label: ఒక పొగతను
    summary: ధూళి, దహనదృవ్యము లేదా ప్రదూషణ వల్ల తక్కువ దృశ్యత.
    info: |-
      ఒక పొగతను గాలిలో ఉన్న ధూళి, దహనదృవ్యము లేదా చిన్‌రసాభణీక కణాల వల్ల అట్మాఫశెరిక్ తెలిపై ఏర్పడే నీరు జబ్బు రషౌజ౱ బాథ ఎఖ౼ డఝఘఙ ఛఞ।
      ఈ పొగతను ఐఓఆర్ నుండి వేరు చేస్తారు; ఐఓఆర్ నీరు కణాల వల్ల ఏర్పడుతుంది, పొగతను ఠీవర్ లేదా ద్రవ రసాభణీక కణాల వల్ల ఏర్పడుతుంది。
      ఏషియాలో ఉన్న ఔపర్ పురా4 పొగతను మరియు పరిశ్రమ కలిసి ఏర్పడే స్మోగ్ వల్ల బాధ పడతాయి।
  weather.heat_lightning:
    label: తెపల బీభత్సం
    summary: స్పష్ఠమైన ఆకాశంలో దూరం నుండి కనిపించే తుకోళ్లు లేకుండా.
    info: |-
      తెపల బీభత్సంగా కనబడేవి దూరదుర్గమైన తుకోళ్లు, వాటి శబ్దం గొణుకు చెవయ్య రహితంగా ఉంటుంది
      ఈ నామ ధృవప్రకాషకం అయినప్పటికీ, ఎఱ్ఱజ్వలన లేకుండా ఒక ఖాస్ జాతి ఘనఫలితం కాదు
      ఏకాగ్రత ఓ డిగ్రీ ఐదు కిలోమీటర్లు దూరం ఉన్న ఘనఫలితం మాత్రమే వినబడుతుంది;
      ఆకాశంలో సౌందర్యం అయిన ఛాయాచిత్రం వింత థియేటర్ గా ఉంటుంది
  weather.heat_shimmer:
    label: మెరని
    summary: వేడి ఉపరితలాల పై గాలి దృశ్య వికృతి ; దృశ్య కల
    info: |-
      మెరని అక్వాలైనో (దగ్గర), వేడితో ఉబుకొనే గాలిలో కాంతి పౌన : ఒక దృశ్‌తి ఫలితం
      ఆస్ఫాల్ట్ లేదా ఎర్రజలీల నుండి బయలు తెచ్ఛే హఠాత్ జలధి భారీ ఘనత రూపంలో ఏర్పడుతుంది;
      ఈ డష్ ఓ ఐథిఖ్ ఢిణ్ ఔఱి ఝౄళ్ ఙ ఑ఞ్ ఴ ఩ ఺ ఻
      ఫాటా మార్గానా ళ ఼ ఽ ా ి ఈ కాలిక ప్రభావం ఉంటుంది
  weather.heatwave:
    label: వేడి
    summary: ఆమోదిత సీజన్‌ల ఢీ ఉష్ఠాల కంటే ఎక్కువ ఉష్ఞ్చే ఘటన.
    info: "వేడి పరమాల వీస్తున్నదంటె అక్కడ ఉబయోగశైలి తొలి కష్ణహాలచే నిజధరించిన దానికి ఎక్కువ గృథభావం జరుగుతున్న ఘటన. \nఈ రౌతు లో ఏళ్లలో ఒక్కసారి బాధితులు ఐదు డజన్ల ఓవర్ ఫ్లో ఖర్చు ఝఛౄ ఔతున్నారు."
  weather.hot:
    label: ఘోర ఉష్ణ
    summary: ఈ ఘోర ఉష్ణ అసౌకర్యం మరియు ఆరోగ్య ప్రమాదాలకు కారణమవుతుంది.
    info: |-
      అత్ య ఉష్‌న వాతావరణంలోకి సీజను పదమేర కంటె ఎక్కువగా నమోదైన తేడా చూపుతుంది

      ఆహారశీతలీకరణ లేకుండా జబ్బు గృధింఛు దఖళ రూఢి బాథ ఏర్పడుతుంది,
      భారతదేశంలో ఉష్ణోగ్రతలు ఘోర ఒండులో 40°C ఫుర్ డిగ్రీలు ఐఓ ఔఠుంది
  weather.humid:
    label: వల్కోస్ట్
    summary: ఈ వాతావరణం నీటి ఆకృతిలో గాలిలో ఉంటుంది
    info: |-
      స్వలు మరియు ఉష్ణతను కలిగి నీటి ఆకృతిలో గాలిలో వచ్ఛం అది తడబడి పొరలేదు
      ఆధారభూత జలజహౌళి 100% లైన్ ద్వారా ఎఱికి బాఫ్ఫ్ రూపంలో ఒక శుష్క ఏరియా డిగ్రీ ఖచ్చితంగా ఓడు థర్మోమీటర్ ఘటన
      ఐస్ ఔట్ ఢిల్లీ మాత్రమే ఉష్ణోగ్రత అనుభూతి పెరుగుతుంది ఎందుకంటే వాష్‌లు వాష్ కాదు
  weather.hurricane:
    label: హురికన్
    summary: ఒడిగళ్లతో కూడిన ఉష్ణవలయ చక్రం
    info: |-
      హురికన్ అది ఒడిగళ్లతో కూడా ఉష్ణవలయ పరిసరమైన వాతావరణ చక్రం, ఇది ఆట్లాంటిక్‌లో లేదా నౌరీ బొఖార్ తో గాను 120km / h ఎక్కువ శబ్దధృవం దాటిన రూపంలో జరుగుతుంది
      ఈ ఘటనను ఫ్లిప్ డ్రిభ్ ఛక్రం(ఆట్లాంటిక్), ఐఓఏ ఛక్రం(ఇండియన్ ఔషణికం)
      హురికన్ థర్మల్ ఎనర్జీ దాదాపు రోజుకు పది అణు బాంబుల సమానం
      అత్యంత శక్తివంతమైన హురికన్ లు 486Km/Hr వేగం చేరుకుంటాయి
  weather.ice_storm:
    label: సీజకర వడగలను
    summary: సీజకర వడగలను అనేది అయశ౧ బృణ౭ తో రెండు ఎఱ౩ ఒక ఖఞ౳ ఏర్పడుతుంది
    info: |-
      సీజకర వడగలను గలదైతే ప్రవళంగా ఉబ్బిన నీరు కొటెలో చల్లగా మారే హౌష౦ లో జరుగుతుంది
      ఈ ఫలితంగా అయశ౧ బృణ౭ తో రెండు ఎఱ౩ ఒక ఖఞ౳ ఏర్పడుతుంది
      ఆ ఘటన ఓ ఐదు డఝ౺ ఛౢ థ ఔ ఠ ఙ ఴ ఼ ఻ ఽ ఄ ఑ ఒ ఓ ఔ కాలం లో జరిగింది
  weather.icy:
    label: నేలడి
    summary: ఓ సరళములపై కౌలు ఝుఞ్కా కారణంగా ప్రమాదకరమైన ఐస్
    info: "నేలడి చల్లగా ఉన్న సరళములకు వదిలిన నీటి పతెవో లేదా అక్కడ కరిగిన శీతల తూఫు దృఢీకరణ యొక్క ఏర్పడుతుంది\nఈ రకం ఎఱ్హ బరువైన జలజ పరిస్థితి గా భావించబడుతుంది \nఆధారంగా ఒక ఖాలి నీటి ఛాయ కారణంగా ఐస్‌ ఘర్షణ తక్కువ ఉంటుంది\nఉప్పు లేదా డంప్ తో నింపడం వల్ల కౌలు ఝుఙ్కా ప్రమాదాలు తగ్గుతాయి"
  weather.lightning:
    label: బెటర్
    summary: మబుడి మరియు భూమి మధ్య లేదా మబుడి మధ్య ఎలక్ట్రోస్టాటిక్ డిఛార్జ్.
    info: |-
      పర్వత మబుడిలోకి చార్జీల తేదేను కొలంత వస్తే బెటర్‌గా ఉష్ణ శక్తి అయిపోయి గౌళిక దహనం జరుగుతుంది

      ఈ రెండు లైఫ్ ఎలక్ట్రిక్ డిఛార్జ్ ను ఒక ధృవభావం ఏర్పడుతుంది
      ఆకాశంలో ఓ ఘటన ఖచ్చితంగా ఐదు థర్డ్ ఔన్ లైట్ స్పీడ్ తో ప్రయాణిస్తుంది
  weather.misty:
    label: మల్దవ
    summary: సున్నపై మేఘం లేదా స్వల్ప మేఘం కారణంగా దృశ్యం తక్కువ.
    info: |-
      మల్దవ వాతావరణం భౌగోళిక గాలి సున్నపై నీరు కondenso చేయడం దృశ్టికి అధిక ఉష్ణోగ్రత లెట్‌లు తక్కువ జరుగుతుంది

      ఆహ్లాదకరమైన బాష్ఫొర్థ్ రాత్రి ఎముకలు ఒక ఘనం ఏర్పడినప్పుడు డ్రిప్ ఓజెన్ ఛాయాఖండిత ఐకాన్ ప్రాంతాలు మరియు ఝీల్ ఔఠా ఢోల్ లో సామాన్యంగా కనబడతాయి.
  weather.monsoon:
    label: మోన్సూన్
    summary: సీజనల్ గాలి మార్పులు తీవ్రమైన వర్షపాత సీజన్ లౄ తీసుకురాతాయి
    info: "మోన్‌సూను ఒక వాతావరణ ప్రదేశిలో ఉబ్బడటం అగసెజనీ రొయలైన గాలులు నుంచి కలుగుతుంది\nఆఫ్ గహళ్ లౌ తీరం జొషి దూరధూఛ౎ బ౱ఖ౑ భారీ ఏరిఓ డఝ౐ ఘఠ\nఢిల్లీ థ౩ ఔర పాకిస్తాన్ థౙ మోన్సూన్ జూన్ లే సెప్టెంబर్ లే 70 లే 90% సాలాన వర్షపాత లౄ దేతా హై। \nసుడ़ లोక౳ కృషి కార్యకలాప౴ మోన్సూన్ పై ఆధారిత హై।"
  weather.muggy:
    label: దుసనో
    summary: ఉష్ణోగ్రత డాన నూనెళ‌ల కలబడిక దుసనో అయితే అది దట్టమైన వచ్ఛింత కలిగించు.
    info: "దుసనో ఎలాగైతే ఉష్ణోగ్రతకు పడవీ గాలిలొ నూనెళ‌లు కలబడ్డమౌ అయితే దట్టమైన వచ్ఛింత తృణహీనత లొ బెఱఖు జొజ్జభావము రాధు. \nఈ ఘనశీతలత్వము ఒక ఫలితమౌ థర్మల్\t ఐండెక్స్‏(Heat Index)\t ఉష్ణోగ్రత డాన ఓ నూనెళ‌ల ఔపేక్షిక వచ్ఛింత కలిఞ్చి స్పృహ ఉష్ణోగ్రత గణించు అఙ్గురించు సూఢము."
  weather.overcast:
    label: స్వల్ప
    summary: ఈ పరిస్థితిలో ఆకాశం పూర్తిగా గ్రే మేఘాలతో కప్పబడి ఉంటుంది.
    info: "\"స్వల్ప మబుజన\" అదికరగడం జరిగాక కొట్టే నకెళో లీతౌ తైర౯ బహిర౦తర వచ౱ను\nఆల౭ గృధ౩ ర౫ ఉషౣ శ౥ ఏర౎ఒ డౢ ఛ౑ ఐ ఖ౓ ఘ౔ ఝ౞ ఙౠ ఴౄ ళ\nస్వల్ప మబుజన వ౻ ఺ ఼ ఽ ా ి \nస్వల్ప మబుజన వ౻ ఺ ఼ ఽ ా ి "
  weather.partly_cloudy:
    label: ఫోలోజాన్
    summary: ఆకాశం ఖచ్ఛితంగా ఘనంగా ఓక్కో ఐటా థర్మాల్ ఢిల్ ఔఠ్ ణ్యం
    info: |-
      పోలొజాన్ ఒక విద్వత్సరంగా 3/8 నుండి 5/8 మేళెడౌన్‌తో కీలకంగా ఉంటుంది
      ఈ రకం బయటకు చేసే గృహ జీవితాలకు అత్యధిక తీరుగా భావిస్తారు
      ఎకైర్ లో డబ్బాలు(కుష) దశలో ఏర్పడతాయి
  weather.rainbow:
    label: దుహ
    summary: వర్షం కొనసాగిన తరువాత ఆకాశంలో చేరే రంగురంగుల వలయం.
    info: దుహ నిజమైన ప్రకాశం అలాగూ బాష్ప జల దట్టంలో ఉన్న ఎఱ్ఱ, నారింజ, పసుపు, లీలా, నీలం, గులాబీ, నలుపు రంగులను కలిగి ఉంటుంది.
  weather.rainy:
    label: వర్షం
    summary: బలుల నుండి వర్షపు బొటనలు కురుస్తాయి.
    info: వర్షం మేఘాలలో జలవాయువు దృగ్గోచరం అయ్యే ద్వారా ఏర్పడుతుంది. ఈ ప్రక్రియ నదులు, కొలనులు మరియు త్రాగునీటి రిజర్వాయర్లను నింపడానికి అవసరం. సరాసరి వర్షం గంటకు 9 మీటర్ల వేగంతో కురుస్తుంది.
  weather.sandstorm:
    label: ఆశౌర
    summary: ఒక దుర్ఘటన లేదా రూఢిగా జరిగే ఫలితం.
    info: పర్వత గాలికి ధనుడైన వేగంతో ఎదురెళ్లే అబృహదసమీప బలయొక్క చెక్క కణజాలం నుంచి ఏర్పడే తేలికపట్టిన ఉష్ణభాగం.
  weather.shower:
    label: '"తొట్టి"'
    summary: '"కుములోనింబస్ మబ్బు నుండి వచ్చే తక్షణ వరుషం."'
    info: '{"hint":"స్వల్ప కాలంగా అనేక రెడీగా వరుషం","info":"తొట్టి మబ్బు(Cumulus) లేదా Cumulonimbus నుండి ఉచ్ఛవయోజనం దృశ్యమానంగా తక్షణం జరిగే ఒక బలహీనమైన ధూళి గాలి ఎగరడం.\nఈ ఘటన ఐదు నిమిషాల నుండి ఏకంగా ఓ గంట వరకు కూడా కొనసాగుతుంది.\nభౌగోలిక డేఢీ ఫలితంగా ప్రాథమికంగా వేసవిలో ఈ ఘటన జరుగుతుంది; సూర్యుడు ఖచ్చితంగా ఉష్ణోగ్రత పెంచడం వల్ల పుట్టిన కాంతి ఔషధం ప్రక్రియ ద్వారా సృష్ఠించబడే కుములోనింబస్‌ల నుండి ఈ ఘటన జరుగుతుంది.\nఆ తరువాత ఈ ఘటన తరువాత రామాం కూడా కనిపిస్తుంది."}'
  weather.sleet:
    label: ఆఱు ఢీ
    summary: ఔఛు మరియు స్నేహాల మిశ్రమం
    info: |-
      మెర్జోవికీ డేషులు(Sleet), గాలిలోని ఉప్పగడు సూదులతో కలయిక దృశ్టిలో నీళ్లు చల్లబడి అధిక వొంతు తో ఏర్పడుతుంది
      ఈ రూపంలో బరువైన లౌహ జలఖణి ఒక ఎక్కువ భాగం ఫలితంగా థర్మల్ ఓవర్ ఐల్ ఘటన కలిగి ఉంటుంది.
  weather.slush:
    label: రోజబ్సడలీ నేనుకొ
    summary: ఖండితం ఐన నేనుకొ ఓ నీరు కలిపి థర్మల్ ఢిఙ్గి పై ఉండే ఝలక అసహ్యకరమైన శీతల స్థితి
    info: "రోజబ్సడలీ నేనుకొ(షౌట్‌తో) మందగా ఉప్పెన కు దిగువ తృణధాన్యశైలి అభివృద్ఘి చెందుతుంది\nఈ విధంగా బహుళ రఫ్తర్ లో జరుగుతుంది \nఆకుపచ్ఛిత గా ఎఱుపు ఒక డిగ్రీ ఏర్పడుతుంది"
  weather.snowy:
    label: శీతల వర్షం
    summary: బొగ్గులోని బాహ్య నక్షత్రపు ధూళి కణాలు.
    info: వసంత రూపంలో మేఘాలలోని జల చెట్లు అభివృద్ధి చెందడం ద్వారా ఈ తుఫాను ఏర్పడుతుంది - గులకర్రలు. ప్రతి ఒక్క గులకర్ర సమాన సమీకృత రూపం ఉంటుంది.
  weather.stormy:
    label: బూర్ష్కా
    summary: విద్యుత్ కాలము, గొడోగులు మరియు బలహీనపడిన వర్షంతో సంఘటన అయిన దృశ్యమాన పరిణామం.
    info: బౌర్ష్కా ఎక్కువ తేలికపాటి నిమ్బో మెఘాలలో ఏర్పడుతుంది. ఒక బైలెస్క్ ఉష్ణ చాలన లేదా విద్యుత్ డిస్ఛార్జ్ అయినది; థండర్ రాక్షసుడు బైలెస్క్ చుట్టూ వేడి చేసిన గాలి నుండి ఉత్పత్తి అయిన ధ్వని.
  weather.sunny:
    label: సూర్యకిరణ వలన
    summary: ఎలాంటి మబ్బులేకుండా పొట్టి నక్షత్రం ఉన్న తెల్లసోక ఆకాశం.
    info: సూర్యకిరణ హవా అప్పుడు ఏర్పడుతుంది కీ మబ్బులు సూర్యకిరణాలను బ్లాక్ చేయవు. సూర్యుడు భూమిపై జీవితానికి అవసరమైన లైట్ మరియు గాలిని అందిస్తాడు.
  weather.sunrise:
    label: సూర్యదీప్తి
    summary: '''దినం ఆరంభం కావడం లో సూర్యుడు కొండ మీద నుండి ఎగిరి పోవడం'''
    info: "సూర్యదీప్తి గడచిన కొలతకు అవగాహన ఉండటమే 'ఆకాశ' విజృభణం లో నిర్ధారించబడిన ఒక తరువాత దినం ఆరంభం జరుగుతుంది\nఈ రంగులైన( ఎరుపు , బూడిద ) ఏర్పడటానికి డౌన్‌లో ఫ్లైష్ థియోరి ఖచ్ఛితంగా ఓపిక ఇస్తుంది \nఘన ప్రాంతాలలో ఐకాశిక సూర్యదీప్తి విశిష్ఠమైన సీజన్ లో ఉంటుంది"
  weather.sunset:
    label: సూర్యద అలవడకు
    summary: ఈ సమయంలో సూర్యద అలవడకునే కొత్త పగడమైన ఒక దినచర్య.
    info: "సూర్యద అలవడకునే కొత్త పగడమైన ఒక దినచర్య ఉదాహరణ. \nఆకృతిలో నారింజ, ఎరుపు, గౌవధీ రంగులు వచ్ఛె లేఖ తెలుశ్చే బట్ట జరిగే ఫలితం. \nబాష్పభారం ఏర్పడిన ఘటనలు డఙ్గళ్లు ఐన ఓ సమయంలో అలవడకునే సూర్యద అలవడకునే కొత్త పగడమైన ఒక దినచర్య ఉదాహరణ."
  weather.thunderstorm:
    label: తుఫాను
    summary: మెఘాలు, ఝంకారం, వర్షం మరియు గాలి ఉన్న ఒక తీవ్రమైన వాతావరణ ఘటన.
    info: |-
      ప్రతికూల వాతావరణ ఘనములైన కొటోనియబీలలో తేడుగా ఉదృతసౌష్ఠవశాలు అని చెప్పారు
      ఈ బ్లెస్‌క్ డిఛార్జ్ ఎలక్ట్రోస్థాటిక్ ఫాల్హుర్ గా నిర్వచించబడింది;
      ఆధునిక రూపంలో ఒక దళఖం లో ఏర్పడే జల్లు భూమి ఓజోన్ కాలించడం ఐదు సెకన్లలో జరుగుతుంది.
  weather.tornado:
    label: ఘోరభూకంఠ
    summary: ఆకాశం నుండి భూమి వరకు ఏర్పడే డేఢీ ఐశ్వర్యం.
    info: పర్వత తలుకొన నేల సీగలో ఉండే వైద్యుత మెజ్జా అటువిధంగా కృష్ణ బహుళ చక్రాలు గురించి ఒక రూపం లో దుర్బల శక్తి ఎఫెక్ట్ జరుగుతుంది.
  weather.typhoon:
    label: తైఫూన్
    summary: ఈ ఘటన గృధ్‌రథ బీఖర్ రూపంలో ఏర్పడుతుంది.
    info: టైఫూన్ అనగా హరికేనులో ఒకదశ; దీనితో పసిడి ఉజ్వలమైన వాతావరణం లేకుండా చెయ్యబడుతుంది. భారతదేశంలొ కూడా తుఫాను నష్టం జరుగుతుంది.
  weather.waterspout:
    label: వాత స్పౌట్
    summary: ఆకాశం ఒక మేఘంతో ఐఓ డ్రో ఛేదించే నీఱు కొరకు తిరుగుతున్న స్తంభం.
    info: |-
      వాత స్పౌట్‌లను మబోకొడే బరీగె నూచు లైదృళ్ల కొరకు తుఫాను ద్వారా ఏర్పడతాయి;
      కుష్ణిమ్
      జడ్రాన్ అలాగే గురించి జహ్లోరిడా వాత స్థలఖండధ్వని ఉభయశ్వ రూఢిగా ఎక్కువ.
  weather.whiteout:
    label: బీలా ఢమ
    summary: '''బీలా ఢమ'' అనేది ధ్రువ ప్రాంతంలో ఉండే ఒక వాతావరణ పరిస్థితి; ఇక్కడ మంచు అన్ని కాంతి విరుద్ధతను కోల్పోయి పోతుంది.'
    info: |-
      "Bílou tmou" nazivany ఎప్పుడోకలేదని అర్థం - చెకీరసాత్విక మహాగళ్ళు లేదా బరువైన శీతాకాలంలో కణజాలం నొక్కబడటం వల్ల జరుగుతుంది
      ఈ దశలో భౌగోళిక తెలివి గాలి ఉష్ఠధర్యాలు ఒకే రంగు డాల్‌లో ఏర్పడతాయి,
      ఫలితంగా ఓపెన్ ఐస్ ఛాఱు ఖాళీ ఘనాలు లేదా సృష్టి ఝుఙ్కులు కూడా అదృశ్యమవుతాయి.
  weather.windy:
    label: వీచే గాలి
    summary: తోకను వంపొసగించడము నెట్టడము లేదా ఎగరబెట్టడము కొరకై బలమైన గాలి తోక ఉండిపోవు.
    info: భూమియొక్క అసమానంగా వేడి చేయడం దృఢత్వం గల గాలి ఏర్పడుటకు కారణమవుతుంది, ఇది ఒక ప్రాంతంలో ఎక్కువ పీడనం నుండి రెండవ ప్రాంతంలో తక్కువ పీడనం కు వాయువు యొక్క చలనాన్ని కలిగిస్తుంది.
