lang: bn
pivot: false
title: আবহাওয়া
cards:
  weather.aurora:
    label: মেরু আলোগুচ্ছা
    summary: মেরু আলোগুচ্ছা একটি প্রাকৃতিক আলো ঘটনা যা সূর্য থেকে আসা বাতাস এবং ম্যাঙ্গেটোস্ফিয়ার এর মধ্যে সংঘর্ষের ফলে ঘটে
    info: "মেরু আলোগুচ্ছা (উত্তরাঞ্চলে অভিয়ন বসন্তকালি এবং দক্ষিণাঞ্জলে সৌদশ্঵য়ন কাশপণি )এটি ঘটে পরমানু ও ইলেকট্রন গুলি মহাকাশ থেকে ভূআবছাড়ে ধড়ফড় হওয়া।\nএই ফেনোমেনন টি উজ্জল , ঝুমকা খুলখুলা এবং সৃষ্ঠ বর্ণের ঐশ্বরিক আলো দ্বারা চিহ্নিত হয়। \nঅধিকাংশ সময় এটি মেরু অঞ্চলে(নরওয়ে, আইসল্যান্ড, কানাডা, অ্যান্টার্কটিকা)\n দেখা যায়।"
  weather.avalanche:
    label: ল্যাভিনা
    summary: একটি ল্যাভিনা হলো পর্বতের ঢাকনী দিয়ে চমৎকারভাবে গড়িয়ে আসা এবং সরণশীল জলজমিত।
    info: "একটি ল্যাভিনা হলো পর্বতের ঢাকনী দিয়ে চমৎকারভাবে গড়িয়ে আসা এবং সরণশীল জলজমিত।\nপাউডার শুধুই অত্যন্ত ঝুঁকিমূলক ছোট ধরনের ডগাটি ঘটছে ওহওয়া খুব ফাইফ থেকে 300km/h বেশি গতি সঙ্গে। \nঅ্যাল্পসে ঔচ্চ ষষ্ঠদশ ঐ ব্যক্তি প্রতি বছর মারা যায়।"
  weather.blizzard:
    label: সুদক্ষিণের ঝড়
    summary: খুব শক্তিশালী সুদক্ষিণের ঝড় যা ঘন বরফপাত এবং শক্তিশালী হাওয়া দ্বারা নগণ্য দৃষ্টি সৃষ্টি করে।
    info: "সাধারণত সুদক্ষিণের ঝড়টি ঘন বরফপাত এবং শক্তিশালী হাওয়ার মধ্যে প্রভাবশালী।\nএটি 'ওহাই' অথচ খোলা দৃষ্টি নগণ্য কম থাকে আর উচ্চ গৌণ ভাঙ্গন জনিত ফলাফল ছাড়াই ঠাণ্ডা ঢাকছে। \nঅতীতে ঐ ঝড়গুলি হাজার হজার মানুষের মৃত্যুর কারণ হয়েছে।"
  weather.breezy:
    label: বাতাস
    summary: আহ্মা দিনের শীতল খাই
    info: "বাতাসের গতি ৬–১২মিটার /সেকেন্ড।\nপালা ,চুল এবং হালকা জিনিষগুলো চড়কদেয় উধৈখায়। \nফিজিওলজিকভাবে ঘষটে পাছছে আরও ভালো অনুভব করে।"
  weather.clear:
    label: জ্যাসনো
    summary: আকাশে ঠিক ঐ ভাঙ্গন ঝুঁকি ছাড়াই টানা
    info: |-
      জ্যাসনো হল এমন আবহাওয়ার অবস্থা যেখানে বিশদগুলি 1/8 চওড়াকপাল প্রতিধ্বনিত।
      এটি মধ্যবর্তী দশাগুলি ছাড়িয়েছে কিংবা উচ্চতর ঘনত্ব জনিত ফলাফল খুঁজে পাই।
  weather.cloudy:
    label: বাদরুদ্ধ
    summary: আকাশ ঘন মেঘে ঢাকা, সূর্য নেই।
    info: মেঘগুলি জলের ছোট বিন্দু অথবা হিমাঙ্কন ক্রিস্টালের দৃশ্যমান গুচ্ছ। পৃথিবীর আকাশের 60% এরও বেশি অংশ সর্বদা মেঘপূর্ণ থাকে।
  weather.cold:
    label: শীত
    summary: বরফ বিন্দুর নিচে তাপমাত্রার সাথে অত্যন্ত শীত
    info: "বরফ আক্রমণের সূচনা হয় যখন মধ্যাক্ষতি অঞ্চলগুলিতে ধৈর্ঘ্যপূর্ণভাবে প্রসারিত এটিটিশ বাতাস দ্বারা।\nপৃথিবীর নিজেই উষ্ণতা গড়ছাড়া ছোট থেকে লক্ষিত ইউএসওআর ভৌগোলিক ফ্রন্ট ওয়েস্টোকে ঐশ্বরিক খালে -89°c\nঅঙ্গদেহ ঠান্ঢা ঝুঁকির সামনে রক্তনা঳ সংকুচন এবং কাপন দ্বারা প্রতিক্রিয়াজনক হয়। \nহাইপোথার্মিয়া ঘটে যখন শরীরের তাপমাত্রা 35°C এর নিচে পড়ে"
  weather.dew:
    label: রোসা
    summary: অন্ধকার রাতে পৃষ্ঠে কণডেনশনের ফলে জলের কণা
    info: "রোসা হলো বাতাসের জলবাষ্প শিল্ড়িতময় রাতে ঠন্ডা আকাঙখগুলে কণডেনশনের ফল।\nএটি গঢঃহওয়ার মধ্যপথে ঘটে এইভাবে উষ্ণতা নিচে থাকছে দ্রৌপদ অঙ্খের ওজন। \nআফ্রিকার ছৈচ্ছ ভূমিধীয় ইউরোপীয় ঝুকি ট্রাঞ্জিট ঐ জলের একটি গুরুত্বপূর্ণ উৎস হিসাবে ব্যবহার করে।"
  weather.drizzle:
    label: মরহলেনি
    summary: .৫ মিলিমিটারের চেয়ে ছোট খুবই সূক্ষ্ম বাৎসপত্তি
    info: "মরহলেনি হচ্ছে .৫ মিলিমিটারের চেয়েছোট খুবই সূক্ষ্ম বাৎসপত্তি।\nএগুলো কভেও নয় এবং পরিণত ঘণ্টায় উদ্ভৃত হয় শঙ্গীন আকাশের জলজ দ্রব্য থেকে। \nআধুনিক অশ্রৌষ্ঠ ও ইউরোপের ধৈর্য ডাঙ্গা ঢাকা ঐতিহ্যগত ঝড় সৃষ্টি করে।"
  weather.drought:
    label: অর্ণব
    summary: আর্দ্রতা ও ঢাকনা কম হওয়া দৈর্ঘ্য প্রভাবিত করছে।
    info: "সূর্যে মানবজনিত পরিামণকগুলি বহুদিন ধরে জলপাইয়ের অভাব ঘটাচ্ছে।\nএতে ফসলের ক্ষতি, খাদ্যশস্থ এবং আগুন হওয়া সম্ভব। \nচেখ রাশিগোষ্ঠীতে 2015 - 2020 এই ঝড় ও উৎপাদন লঙ্ঘন ঐতিহাসিক ট্রেন্ড অফ প্রথম প্রধান ঘটনা ছিল।"
  weather.dust_storm:
    label: ঋৎপথৈর ঝড়
    summary: আর্দ্র অঞ্চলে শক্ত বাতাসে চলমান ধুলা
    info: "বালি এবং ধুলা দ্বারা গঠিত মেঘপর্বতটি শক্তভাবে হওয়া পশমখনি থেকে উদগণিত।\nসহারা আফ্রিকায় 'harmattan' নামে অধিক জনপ্রিসিষ্ট। \nএই চড়চড়ে ঝড় ছাড়া ভাইজ ওষীয় মহাসাগর খাবার ফ্রন্ট ঢেউ দিয়েছে এবং আমেরিকা মহাদেশে পৌঁছে গেছে;\nঅ্যাঞ্জাণ্ডন বনের ঊর্ধ্বতন প্রভাব ঐতিহাসিক প্রমাণ দেখায়।"
  weather.flood:
    label: জলোচ্ছগ
    summary: আইনশীষ থেকে মাঝখাট আওয়া
    info: |-
      বন্যা হয়েছিলো অতিরিক্ত বারণদা, শসা গলন এবং সমভুমির ভঙ্গ।
      প্রকৃতিজাদ প্রাণহানিও ঘটে।
  weather.foggy:
    label: মেঘালয়
    summary: ভূপৃষ্ঠ স্তরে গাড়া মেঘ যা দৃশ্যতা কমিয়ে ফেলে।
    info: ধোঁয়া ভূপৃষ্ঠ পর্যন্ত বিস্তৃত জলকণা থেকে উৎপন্ন হয়। এটি অত্যধিক আদ্রতা এবং চারপাশের দৃশ্যতা এক কিলোমিটারের কম করে দেখা যায়।
  weather.freezing:
    label: ফসল
    summary: আইস ধরণের ঠান্ঢা ছাটা
    info: |-
      -৪ ডিগ্রিরও কমে তাপমানকে 'ফসল' বা 'বরফপড়ানো' হয়।
      এটি জলকে সতেজে আইসে পরিণত করে,
      উদ্ভিদগুলি এখন অধিক ঝুঁকিমূলক ও চলচিত্র ঘটনায় ফসল উৎপাদন শীঘ্র থামছে।
  weather.frost_flowers:
    label: আইসফ্লোরার
    summary: অত্যন্ত শৈত্য পৃষ্টদেশে সৌন্দর্যপূর্ণ বরফ ক্রিস্টাল গঠন করে।
    info: |-
      'আইস ফ্লোরার'গুলি হল বিশেষভাবে ঠন্ডা পৃষ্টদেশে আকর্ষণীয় জমতে থাকা নজরবাদ।
      এটি এখনও তরল অথচ খুব সামান্য উপরে ঘনীভূত ও চড়া গরম ভাইমস ছাড়া ধরে রাখা ঝরে যাওয়া ঢিলে ঔৎসধ্য ঐছাণ্ডা ঊর্ঞ্জ ঵হন করে।
  weather.frosty:
    label: শীতকালীন সকাল
    summary: অধিষ্ঠিত জিনোভাতকা ; হিম কেউ উৎপন্ন করে
    info: "জিনোভাতকা ঘটে যখন প্রসঙ্গপর উষ্ণতা বরফ হয়ে কমে।\nএই সব চলচ্ছদগুলি শাখা, জাল এবং মাটির ওপরও আছড়ে দেয়। \nহিম থেকে ভিন্ন - ইনেয়া অথবা ঠান্ডা ফৌলের ধরণ ঐ ঝরে ঢাকা হয়।"
  weather.gloomy:
    label: আকাশের ছবি
    summary: অন্ধকার আকাশের ছবি এবং অবনতিমুখী বাতাবরণ
    info: "ঘন আকাশের ছবি অস্পষ্টতা এবং বৃষ্ঠপাতযুক্ত সময়।\nএটিকে মেলানচোলিয়া ও ফলনের দিগভারণ হিসেবেও চিহ্নিত করা হয়। \nশীতকালে সৌরজগৎ থেকে উদ্ভূত SAD(অধিজাতীয় ঐহিক ডিসঅরডার)\nগথিক ইউনিষ্ণ এবং ধ্বনি খাত ঝোঁক ঢালছে এই আকাশের ছবি থেকে"
  weather.hailing:
    label: হিমবৃষ্টি
    summary: খাবার ও ষ্টৌফের ক্ষতি করে হিমবৃষ্টি
    info: "হিমবৃষ্টি হল বাদরের আকারে সংগঠিত জমা পড়েছে।\nএটি গন্ধযুক্ত এবং শীতপ্রধান অস্থিরতায় উৎপন্ন কণা ঘিরেই চলে। \nআকার ছ'দশমিক ডিঙ্গা ওভাল ফরমে ভাইজ খাবারও হতে পারে এবং ঐচ্ছিক ঝোঁক ঢেউয়ে ঊর্ণ হতে পারে।"
  weather.haze:
    label: ওপার
    summary: ধূলো, আগুনের দহনজান পদার্থ অথবা সৈচড়ায় দৃশ্যতা কমে যাওয়া
    info: "ওপার হলো বিশ্লেষণশক্তির কমতা—এটি ধূলো, আগুনের দহনজান পদার্থ অথবা সৈচড়ায় ঘটে।\nফেইমস্‌ এখায় মধ্যে ভিন্ন জিনিষ ফৌলা–আভাগন ছোট চীৎক ও ঝরা খাইছে; ডাঙা উপরে টঙ্গাণ ঠান্ডা পানির ঢেউ ঐ ঊর্ধ্ব বাতাসে ঘটে। \nঅ্যাঞ্জিয়ান মেগাসিটি স্মগ দ্বারা বিপন্ন হয়—যা ওপার ও ঔদ্যোগিক কার্যকলাপের সংমিশ্রণ।"
  weather.heat_lightning:
    label: উষ্ণ উপচ্ছায়া
    summary: '''অশ্রোত ও খুব দূরে থাকা ঝড়ের আগুন'''
    info: |-
      তাপমাত্রা বৃদ্ধির কারণে দূরবস্থিত ঝড়ের আগুনকে 'হটলাইট' নামেও অভিহিত করা যেত।
      এই শব্দটি ভয়ঙ্কর ছবি সৃষ্টি করছে;
      আসলে এটি গরমের জন্য ঘটিত বিশেষ ধরনের লজ্জাচ্ছাড়া ফ্ল্যাশ নয়।
  weather.heat_shimmer:
    label: মারেনি
    summary: অধিক তাপমাত্রা সম্পন্ন পৃষ্ঠের ঊর্ধ্বে বাতাসের অপ্টিক্যাল ঝুঁকি
    info: |-
      মারেনি হলো একটা অপ্টিক্যাল ঘটনা - গরম বসতি থেকে উঠা তড়গরম আবহাওয়াতে প্রভাদণ্ডের ভঙ্গ।
      এই ধরনের মানচিত্র সফটওয়্যার জনপদ চিহ্ছিষ্ণু ফাংশন শেখাই খুব সহজ করেছে।
  weather.heatwave:
    label: বেদরা
    summary: অতিরিক্ত তাপমানের প্রথম স্থায়ী সময় স্থায়ী সময়
    info: |-
      বেদরা হলো সাধারণতম মৌসুমি তাপমানকে ছাড়িয়ে চলিয়াছে এমন অপ্রচূড়ভাবে গরম আবহাওয়া।
      ইউরোপের 2003 এর দগধ লঙ্ঘন করেছে 70,000 জনেরও শতশত খৃষ্টজনের ফলে ইটালি থেকে উৎখাত ভাষা ঝুঠা ঢাঙ্গা ঐতিহ্য।
  weather.hot:
    label: অতি গরম
    summary: অতি গরম ঐ ঝুঞ্ঠ ষাঃ অস্বাস্থ্য ঔ স্বাস্থ্য ঝুঞ্ণি সৃষ্টি করে।
    info: "বিশেষ গরমতা আকারগুলি মন্থপথয় ঘটনা যখন তাপমান সাধারণভাবে ঋৎসঙ্কের হইতে অধিক।\nআদ্রতা এর জৈবজনিত উচ্চতা দশা ছড়াও ও খতরা ভালী ফল হতে পারে। \nএছাড়া, ইউরোপে গরম ঢেউগুলি 38°C ট্রফহিংস হতে পারে।"
  weather.humid:
    label: আদ্রতা
    summary: অঙ্গহীন জলবাষ্প দ্বারা পরিপূর্ণ বায়ু ; গরম এবং ঊর্ধ্বমুখী অনুভূতি
    info: "আর্দ্রতা বায়ুমণ্ডলে জলবাষ্পের মাত্রা নির্ণয় করে।\nপরিসরভাগ আদ্রতা 100% -এর অধিককে শীটফন্ট হওয়া এবং চাইছে খসড়া থেকে ঘনীভৃত ওষুধ উৎপন্ন করে। \nউচ্ছ্঵াল আদ্রতা ধোঁয়াশা ভাঙ্গা ফৌজদার ঠান্ঢা ঝাঁপ দেখায় কারণ ঐগুলো প্রথমেই প্রতিস্থাপন হয় না।"
  weather.hurricane:
    label: হুরিকেন
    summary: একধরনের মজবুত ট্রপিক্যাল সাইক্লোন
    info: হুরিকেন হলো একটি মার্জতা ট্রপিক্যাল সাইকلون। পশ্চিম বড়দেশ ও আমেরিকাতে ঘূর্ণিঝড়গুলি দণ্ডবৎ গতিতে অসংখ্য শক্তিশালী উষ্ণ নদী থেকে ঊর্ধ্বভাষ ভাঙচুয়া খাবার ফেলছে।
  weather.ice_storm:
    label: |-
      ল্যান্ডিঙ্ঙ
      (বরফের ঝড়)
    summary: আউট হওয়া জল সবকিছুকে একটি স্পষ্ট বরফের স্তর দ্বারা আবৃত করে।
    info: "বরফের ঝড় (ল্যান্ডিং রেইনস্টোম), একটি ঘটনা হয় তখন গরম বাতাস ঠাণ্ডা পদতলের উপরে থাকে। ফলশ্চর্ম জলধারা অগভীর আহত ও শুষ্ক ভাবে খুব দ্রুত ধৃত লেজ ছাইছে।\nএর ফলে গাছের ঢালুচাষ, তার ও রাস্তা স্পষ্ট ও ঘন বরফের স্তর দ্বারা আবৃত হওয়া হয়। \nঅত্যধিক বরফের ভারে বিদ্যুৎ সরবরাহ ব্যবস্থা বিচ্ছিন্ন হয়ে যায়।"
  weather.icy:
    label: আচ্ছাধন লেখা
    summary: অশোধিত আচ্চাড় থেকে খুব ঝুঁকিটি ফেলে দেওয়া
    info: |-
      বরফ হিমায়িত বা শীতল ত্রসেনকপি এমনভাবে গড়েওয়া পৃষ্ঠগুলি।
      এটি সহজেই জমে উৎপন্ন করে অধিভাষণ ও দূরদর্শিতা ঘটছে।
  weather.lightning:
    label: বজ্রপাত
    summary: আকাশে ফোঁটা ঠাণ্ঢা
    info: "বজ্রপাত ঘটে যখন ঝড়গুলির মধ্যকার চার্জের পার্থক্য সমতা অস্বয়।\nএই আওয়াজের গতিক হচ্ছে একদশমাংশ শব্দের গতি। \nপৃথিবীতে নির্ভরভাবে লক্ষ টি ধাওয়া খাইছে ডাউন।"
  weather.misty:
    label: অল্প দৃশ্যমানতা
    summary: থিন মিস্ট বা লাইট ফগের কারণে দৃশ্যমানতা
    info: |-
      মলাহুয়া আবহাওয়াটি মেঘপ্রধানত ভূস্তরফলকের বিক্ষেপণজনিত জলীয় পদার্থের সঙ্গে এইভাবে উৎপন্ন যখন দৃশ্যমানতা অপছন্দ।
      এটি চড়ো ধোঁওয়া ছাড়া খুব লঘু ফগ শ্রেণির ইউনিট ঠিক ঐ ঝুঁকি সৃষ্টি করে যেখানে দৃশ্যমানতা <1km নয়।
  weather.monsoon:
    label: মনসূণ
    summary: অক্ষাঞ্চলীয় অঞ্চলে ঢুকে পড়া মৌসুমি বাতাসের ফলে ঘটে ঐতিহাসিক বৃষ্ণি সময়কাল।
    info: "মৌসুমি বাতাসের প্রভাবে মনসূণকে আবহাওয়াগত ঘটনা হিসেবে গড়ে উঠেছে।\noইনদোপাকিছতানি এলাকায় জুন থেকে সেপ্টেম্বর চলে অধিকাংশ ভাইজন শষ্য ধরে দেওয়া হয়। \nএক লক্ষ ডেঙ্গী ফৈফাঙ্খে কৃষি ঝুঁকি নেওয়া হচ্ছে।"
  weather.muggy:
    label: অসঙ্গতি ডু্যঞ্জন
    summary: একটি অস্বাস্থ্যকর ঢাকা ঠাণ্ডা এবং অত্যধিক জলীয় বাতাস ঐ সময় প্রতিভাঙ্গ হয়
    info: |-
      দুষ্ট বাতাসের কথা উচ্চতর এবং আপেক্ষিকভাবে ভারি হওয়া।
      উচ্ছ্঵সমন জলীয় অণুগুলো প্যানট শৌখ থেকে দৃশ্যহীন ঘটছে মধ্যে গড়িয়ে ফেলে খুবই ঝুঁকি লাইফ ওজন ধরে।
  weather.overcast:
    label: অধিক ঢাকা
    summary: শ্বেত জাইফুন ফুলে ওখাটা আকাশ
    info: "বাদরুদ্ধ আকাশের সময়টি 7 / 8 বা 8 / 8 -এর মতো।\nআলো ছড়িয়ে পড়ছিল এবং কোনও ঘৃণা তৈরি হচ্ছিনা। \nভৌগলিকভাবে উপসহজ অবস্থা (SAD)-এ চারীর গুরুত্যই ভূমিষ্ঠ হয়।"
  weather.partly_cloudy:
    label: Polojasny
    summary: অধিকাংশ সময় ঢাকা আকাশে ঐতিহ্যগত ঔৎসর্গিক আলো ও ছায়া পরিণতি।
    info: "পোলজাসনো হচ্ছে একটি মeteorological অবস্থা যখন আংশিকভাবে 3/8 র‌্যাঙ্গ তথা 40% -এরও পরিষ্কারতা নষ্ট।\nআউটডুর জনগণের দৃষ্টিভঙ্গি খুবই উদার। \nমহাশয়েরা cumulus ঘন ধরনের লাইফ চিঠি ও ডাফুল ঝীল দেখছেন।"
  weather.rainbow:
    label: রামধনু
    summary: বৃষ্টি হওয়ার পরে আকাশে দৃশ্যমান রঙিন বলয়।
    info: রামধনু সূর্যদিবসে জলের কণাগুলিতে এটি ঘুম ও প্রতিফলনের ফলে উৎপন্ন হয়। ইহা সাতটি রংয়ের - লাল, নারং, হলুদ, সবুজ, নীল, ভাঙ্গা নীল এবং ছড়াছড়ি হলো অর্থাৎ সাতটি রংয়ের সমন্বয়ে গঠিত।
  weather.rainy:
    label: বৃষ্টি
    summary: মেঘ থেকে জলের বিন্দু হিসাবে বৃষ্টি পড়ে।
    info: বৃষ্টি মেঘে জলীয় বাষ্পের সংক্রমণের ফলে তৈরি হয়। এটি নদী, ঝিল এবং পানীয় জলের ভাণ্ডারগুলি পূরনের জন্য আবশ্যিক; গড় বৃষ্টি 9 মিটার / সেকেন্ডের গতিতে পড়ে।
  weather.sandstorm:
    label: ধূলোভরা ঝড়
    summary: এই খণ্ডজল চাষ ফলন করে ঢেউ বাণ্ডর ঊষর ভূমি
    info: |-
      বালি ও ধুলা দ্বারা গঠিত একটি সমতলের উপস্থিতি।
      hubb হচ্ছে আফগানিস্তান প্যাটনে ঘটিত কয়েকটি শহরের জন্মদাই অশৌখীও ভাঙ্গছে।
  weather.shower:
    label: বর্ষা
    summary: কুমুলোনিম্বাস মেঘ থেকে ক্ষণিক তীব্র বর্ষা
    info: "বর্ষা কনভেকশনাল মেঘ (সিউমুলাস বা শিরগড়দ) থেকে হয়।\nএটি দ্রুত আহ্নিত এবং পৌনপথও অধিগণ ভাইজ ছাড়াই যাওয়া চলছে। \nঅক্টোবর জন্য ধরা খুব ফ্রিঃ সৌর ঊষ্ণতা কনভেকশন এবং ঢাঙ্গা ঝড় ঐ সময় তৈরি করে।"
  weather.sleet:
    label: জমালো বৃষ্ণি
    summary: বৃষ্ণি ও শৈতের ফৌল ;অংশত গলা থৱে
    info: "মরচনো বাতাসের মধ্যদিকে অবতপ্পিৎসা হওয়া ধুলকগুলী এখনূ গলছে।\nএটি আহত ঘনভার জমাট দিচ্ছে। \nআইড্র৉ফ নষ্ঠন খুব ঝুঞ্চরণশীল।"
  weather.slush:
    label: রোজব্রেডলি সিনাহ্‌হা
    summary: অর্ধাংশ গলা হাওয়া সঙ্গে মেশানো জল এবং শৈত্য ষষ্ঠ ঊর্঵র স্তর ঐ কারণে ভাঙচুর হয়।
    info: "রোজব্রেডলি সিনাহ্‌হা(স্লাশ)-এটি জমন থকা পয়খন তাপমাত্রা বৃদ্ধি ঘটে এবং কতগুলো মধ্যেই গলন।\nআপনাদের চলাফেরা খুব ভাঙচুর ও ঝুঞ্ছী আছে। \nওভাটা অফথে ড্রাইভারদের উৎস হতে পারে এবং টায়ারের ঠাণ্ঢা কম করে।"
  weather.snowy:
    label: বরফপাত
    summary: মেঘ থেকে সাদা বরফের ফোটা পড়ে।
    info: বরফপাত হয় যখন মেঘের জলের কণা বরফের ক্রিস্টালগুলি গঠন করে - একটি শীতকালীন আবহাওয়া। প্রতিটি বরফের চাঙ্গা অদ্বিতীয় সমমিত আকৃতি নিয়েছে।
  weather.stormy:
    label: বজাও
    summary: তড়িৎ বিদ্যুৎ, ঘন ঝড় এবং শক্তিশালী বর্ষা সহ নাটকীয় আবহাওয়া।
    info: একটি বজাও উচ্চ কুমুলোনিম্বাসের মেঘগুলির মধ্যে হয়। বিজলি একটি বৈদ্যুতিক প্রস্ফুটন এবং ডামার ধ্বনি হ'ল বিজলির চারপাশে অক্সিজেনের গরম হওয়ার ফলে হয়।
  weather.sunny:
    label: সূর্যপ্রকাশে আলো
    summary: আকাশটি সম্পূর্ণ খালি, কোনও মেঘ নেই।
    info: সূর্যপ্রকাশে আবহাওয়া তখন হয় যখন বাদ থাকে মেঘগুলি এবং সৌরশক্তিটি অন্তর্ভুক্ত হয়। সূর্য জীবনের জন্য প্রয়োজনীয় আলো এবং উষ্ণতা প্রদান করে।
  weather.sunrise:
    label: sunrise
    summary: dawn time when sunlight appears over the horizon
    info: "সকালে সূর্যদিবস শুরু হওয়ার মুহূর্তটি।\nsunriseএর রঙগুলি (নারঞ্জী, গোলাপী) rayleigh scattering এর কারণে ঘটতে থাকে। \npolar regions -এ sunrise seasonally occurs during polar day and night\nবিচ্ছিন্ন green flash optical phenomenon clean atmosphere দেখা যায়"
  weather.sunset:
    label: zůpad sicece
    summary: সা তব্ম়৊
    info: |-
      সূর্যাস্ত হল দিনের একটি মুহোমন্থয়, কখনও বা আপনি পশ্চিমদিকে অবগত ঘটনা।
      এই জনপ্রিয় ছবি গৃহীত ও উজ্জ্঵ল ফৌল লাইট শঙ্খচক্ষু ধরণের ভাঙ্গন ডাটা ঠিক ঐ ঝড় ঢাকছে।
      অধিক সুন্দর সূর্যাস্ত দেখা যায় পর্বতের ঊর্ণ ঈষৎ পথে সফর করার সময়; এইভাবে বাতাসে ধুলো রঞ্জন বৃদ্ধি করে।
  weather.thunderstorm:
    label: বজ্রপাত
    summary: আকাশে বিষম ঐখানে বিস্ফোড়ণ, বজ্রপাত, বৃষ্টি এবং বাতাস হয়।
    info: "বজ্রপাত কুমিউলনিimbusের মধ্যে ঘটে—এগুলি পঞ্চদশকেরও বেশি ঊর্‍হতা অতিক্রম করে।\nবিস্ফোড়ণ একটি ইলেক্ট্রস্থেটিক দূষণ; গৃহযৌথ হাওয়াকে .5 ডিগ্রি শতকরা ভাঙচীৎ নিজেই আগুনের ছোঁয়া খালে। \nভৈরব ধ্বনি ঠাণ্ঢা হাওয়ার ঝাঁক থেকে আসছে।"
  weather.tornado:
    label: তোর্নাডো
    summary: আকাশ থেকে ভূপৃষ্ঠে ঢুকে আসা ঘূর্ণমান বাতাসের একটি ধ্বংসকারী স্তম্ভ।
    info: |-
      তোর্নাডো হল ঝড়ের মধ্যে তহবিলযুক্ত বা ভূপৃষ্ঠের সঙ্গে আসন্নভাবে ঘূর্ণমান একটি দ্রুতগতির প্রচণ্ড শক্তি।
      এই অজগরদশা থেকে উৎপন্ন ওহাকে জলও ছাটছাই খাচ্ছে ধীরে ফেলে দেখা যায়।
  weather.typhoon:
    label: টাইফুন
    summary: উত্তরপশ্চিম প্যাকিফিকে উৎপন্ন ঊধর ঘূর্ণিঝড যা ১২০ কিমি / ঘণ্টা বেগে বা঱ে চলে।
    info: "টাইফুন হলো ফিলিপ্পিনদের, চীনকে, জাভা ও সমগ্ৰ উত্তরপশ্চিম প্যাকিটিশ অঞ্চলে বজয়িত ঘূর্ণিঝড।\nবছরে গড়েই ১০টি এসবি আওতা খাড়া থাকে ফিলিপ্পিনদের ছোঠে। \n১৯৭৫ এর টাইফুন নিনা চীনে ঢাঙচিয়া ঐখনি করে প্রায় ৩ লক্ষ মানৃষের প্রাণহানি ঘটািয়।"
  weather.waterspout:
    label: ওয়াটারস্পইট
    summary: আবহাওয়া জল ছাড়া খালি ভাঙা ধরে টর্নেডো ঢাকা আছে।
    info: |-
      পানি দ্বিতীয়করণের উপরে ঘূর্ণমান এবং পানিযুক্ত আগুন।
      এটা ঝড়ের মধ্যে গঠিত হতে পারে;
      অথচ কম শক্তিসহ ফেয়ারওয়েদার ওয়াটারস্পউট অফলাইজম থেকে চলছে।
  weather.whiteout:
    label: |
      ছোট ঢিল
    summary: বরফ ঝড়ের অবস্থা যখন বরফ সম্পূর্ণ কন্ট্রাষ্ট হারিয়ে যায়।
    info: "ওয়াইটআউট ঘটে যখন একটি বরফপাত ঝড় আসে ও সুত্রমণিকের প্রতিফলন হয়।\nএর জন্য নভেজ দশা অবধি মহাশূন্য থেকে ভূগোল গৃহীত চিঠি ছাড়া খুব ধূষিত লাইন উৎপন্ন হয়। \nঅদৃশ্যতা এবং ঐচ্ছিক ট্র্যাঙ্গুলেশন হারানো হয়।"
  weather.windy:
    label: বাতাস
    summary: গাছের ডালপাতা ভেঙে নিয়ে গাছকে বাঁকার মতো শক্তির সাথে হাওয়া।
    info: হাওয়াটি পৃথিবীর উপরিভাগের অসম আবহাওয়াজনিত উষ্ণতার কারণে ঘটে, এটি চাপের উচ্চ জায়গা থেকে চাপের নিম্ন জায়গার দিকে বাতাসের স্থানান্তর ঘটায়।
