lang: hi
pivot: false
title: मौसम
cards:
  weather.aurora:
    label: ध्रुवीय शिखर
    summary: इस अथृत आऊरा भाइओनिस डेटा ऑफ ओशनिक ऐरिपोर्ट छोटे झुंड ठीठी
    info: ध्रुवीय चमक का परिघटना होता है। स्थानीय महसूस के उपलब्धि के लेकर 'उत्तरी' और 'दक्षिणी', जो विद्युतचुंबकीय कणों के सौर ऊष्मा के प्रभार के बरगड़ाए गई एटमॉज्फीअर के कारण होता है।
  weather.avalanche:
    label: लेविना
    summary: ऊचई के ढलाई से उठइ हरदमबन्दि ओर बरफ
    info: "एक लेविना पहाड़ी के मोड़ से हरदमबन्दि के संग्रथित बरफवृष्टि के एकत्रिकरण के रुप में।\nसभले धुआंधार जोखिम भरे अउ 300 किमी /घंटा से ऊपर के गति घलय। \nअल्प्स में औसतन प्रति वर्ष 150 आदमी मरज।"
  weather.blizzard:
    label: हिमपात की आत्मा
    summary: घुलमिट धुंध जिसमें गहरा हिमशरण छोटे झंझावात चल रहे होते हैं
    info: "हिमपात की आत्मा है सख्त प्रकोष्ठन में घुले हुए भारी हिमशरण और बवंडर।\nयह लगभग शून्य दृश्यता (सफ़ेदआउट) एवं ऊबड़-खाबड़ियों के कई ढेर उठाने के कारण होता है। \nइतिहास में हिमपात अज्ञात व्यक्तिओं की हजारों की मौत के कारण हुआ है।"
  weather.breezy:
    label: ब्रीज़
    summary: '''ब्रीज़'', शीतल छोटी हवा है जो ठंढक डालती है।'
    info: |-
      हल्की हवा के रूप में परिभाषित 'ब्रीज़' सुखद लगती है। यह 6–11 मीटर /सेकंड कमजोर हवा होती है।
      यह पत्तिओं, बालों और हल्के वस्तुओं को आनकाम गति देने में सक्षम होती है。
      फिजिएलजिस्ट अर्थ में इस हवा के कारण पसीना उभरता है जिससे ऊष्णता का धारण घटता है।
  weather.clear:
    label: जस्नो
    summary: अच्छी तरह से सफेद आकाश बिना किसी ढेर के
    info: |-
      जस्नो एक मौसमी स्थिति है जहां आवरण के प्रति 8 में से 1 से कम बदरखा हो।
      यह सबलगन धृष्टपुंजन और सर्वश्रेष्ठ खगोलीय अभ्यास की छटा देता है。
      रात में इस घटना में ऊष्मा रेड़िएशन शक्तिहर होता है; लघु चढ़ती भी गई है।
  weather.cloudy:
    label: बादरहित
    summary: आकाश घने बादलों से ढ़का हुआ, प्रत्यक्ष सूरज की कमी।
    info: बादरहित में आकाश गहरे रंग के बादलों से भरा होता है जो पानी की छोटी बूंदों या बर्फ के क्रिस्टलों के समूह होते हैं। पृथ्वी के लगभग 60% आकाश पर हमेशा बादरहित की परत होती है।
  weather.cold:
    label: ठंढा
    summary: ऊष्णता के भयंकर घटाओं के साथ एक चरम शीत
    info: |-
      अत्यधिक ठंडक होती है जब समुद्री मार के परिसर में आर्कटिक हवा पहुँचती है।
      पृथ्वी पर नजर लगने बादले तापमान का सबसे कम मामला : –89°c , अंटार्टिका में 'वोस्तो'क स्थिति पर।
  weather.dew:
    label: आशुरा
    summary: अछाते रात के दौरान सतह पर ऑफसेट होने वाले जल के कण।
    info: |-
      रोसा शाम के समय हवा में प्रचुरता से उपलब्ध नमी के कारण ठंडे सतहों पर बनती है।
      इसका गठित होना इसलिए होता है कि सतह ओज़ोन अंक (ओज़ोन पॉईंट) से भी ज्यादा घट जाती है。
      एटाकामा डेसर्ट में चराहे लोग आदिप्रभात में फंसे छोटे वाष्प के कारण खाँचे और ऊष्णकटिबंधीय झाड़ियों के लिए ऐसे थोथे के ढेर का उपयोग करते हैं।
  weather.drizzle:
    label: म्रहोलेनी
    summary: .5 मिमी से छोटी ठीठी बौछारों के साथ बहुत हल्का झोंझ
    info: "म्रहोलेनी एक प्रकार का सूर्य हवा में बनते हुए .5 मिमी से छोटी गड़गड़ियों के साथ होता।\nइसके उदभव के कारण अपशष्‍ठीय कमबुलों से शुरूआत तथा वजनी धुंध के आकार में घनघोर जलचर द्वारा भी हो सकता है। \nअक्सर इसका लक्षण ओशनिक खाड़ी में फ्राँस के उत्तर-पश्चिम और ब्रिटेन के ऊपर होता है।"
  weather.drought:
    label: सूखा
    summary: अवशिष्ठ धरापात ऋणात्मक डिऑफिसिट के कारण पानी की कमी
    info: "सूखा एक मेटियोरालजिकल स्थिति है जहाँ कम प्रतीचयने बरसाने के कारण दुःखद घटनाओं के अधिगम।\nइससे फसल के खपड़े, पानी की कमी और आग उठ सकती है। \n2015–2020 में चेझकी में सबसे भयावह सूखा 500 साल के इतिहास में शामिल है।"
  weather.dust_storm:
    label: घुल के बवंदर
    summary: '''घुल के बवंदर'', घुल कि ठीथ था जो एक तीखी हवा द्वारा ढके गइ जाहि'
    info: |-
      धूल के बवंडर होता हुआ समय में प्रबळ हवाओं द्वारा जीनसजित भौगोलिक कणकों को हवा में उठाने से बनता है।
      sहालचर अफ्रीका में 'harmattan' धूल के ऊपर एटलास के आए और इसे अमेरियों छू गई है;
      harmattan शोधों के चलते ऐमेझॉन फॉरेट्स पर खतरा डाल रहा है।
  weather.flood:
    label: बाढ़
    summary: अकेश भूखंड पर पारगमन द्धारा आउटफ्ट गठन
    info: |-
      बाढ़ अत्यधिक वरसों के समय हीलने पडऩा में हुआई है।
      प्रकृति के बचाने के लए जलविहीन कदम (जैसे - झील, घासभूमि), खतरे को कम करने में महत्त्वपूण है।
  weather.foggy:
    label: मिलहावो
    summary: घनी जमीन के स्तर पर मेघा दृश्यता कम करती है।
    info: कोहरा भूमि के स्तर पर बने छोटे पानी के बुंदों से बने बादल होते हैं। इसका उत्पादन अधिक आर्द्रता के कारण होता है और यह एक किमी से कम दृश्यता को कम कर देता है।
  weather.freezing:
    label: ठंड
    summary: -42°C तक कई घटनाओं के कारण शीघ्र गर्मी छोड़ धरती पर झाँख
    info: "हिमपात जब होता हैं जब प्रकटन के स्थल में 0°C से कम अवस्था हो।\nयह बर्फीले दशा में पानी के रुपावटि लगाए और पॉज़िशन के खतरे के चिह्य होते हैं। \nचेक में सबसे ठण्डा हिमपात आमतौर पर जनवरी में होता हैं (-42°C से भी कम)।"
  weather.frost_flowers:
    label: बर्फ़िए
    summary: ठंढे सतहों पर बने टेढ़े-मेड़े बर्फ़ियाँ
    info: |-
      बर्फ के तारा पैटर्न सुपीकतम ठंड में होने वले आसविक जगहों पर बरफ़ियाँ और अणुओं के द्वारा एकत्रित होते है।
      अधिसख उच्च गुणवत्य छविमय शृंखला इनके लक्षणों के ऊपर भी ध्यान खींचते है।
  weather.frosty:
    label: फ्रीजिंग मौर्निंग
    summary: भूआच्छादन ठण्डक; टेक्स्थर ऑउर जमीन को ऐसे बर्फ के क्रिस्टल ढक लेते हैं
    info: |-
      जिनोवातका उस समय होती हैं जब पर्वत के मुख्य भाग का तापमान बर्फ के अँगलन लेख से ऊपर चढ़ रहा हो।
      इसके द्वारा श्रद्धा और घटना कई आश्छाड़ित ढंग से एड़िए ओर इधर झुठलाहट करते हैं।
  weather.gloomy:
    label: घिट्‌ठाळ
    summary: उदासीन भाव के साथ ढके हुए फटे झाँई
    info: "चमकदार आसमन हल्के कुरूप मेघों से पहिया जबड़ी और ठण्डा अथवा बरसात के माहौल से चिन्हित।\nइसके साथ उत्सुकता एवं शरदऋतु के सामयिक संग्रह के साथ इशारा किया गए हैं। \n SAD(अवधि के लिखित व्यवहार दोष ) ऊजले धूप के छलफल के कारण होने वाला दोष है।"
  weather.hailing:
    label: कड़वाहट
    summary: आईस के टुकड़े ; इनके कारण फसल और वाहनों को नुकसान हो सकता है
    info: "कड़वाहट ऐसा होता हैं जब प्रचुर मात्रा में सिल्वन के बर्फीले टुकड़े एक छमगदार घनघोर आकाशीय झंझाओं में गिरते है।\nइन ठण्डे और उष्ण भागों में चढ़ते -उतरते द्रवपिसे अधिक नहीं खरखराये जाते है। \nएक इकाई धौंस के ऊपर 5cm ढँठ थे और ऑफ़िशिम ऋण और वाहनों को नुकसान पहुंचा सकते है।"
  weather.haze:
    label: ओपर
    summary: धूल, धुआँ या प्रदूषण के कारण दृश्यता कम होना
    info: |-
      ओपर धूल के महीन हवा सामग्री, पेट्रोलियम उत्पादों और अशुद्धि के कणों के कारण वातावरणीय पारदर्शकता के कमजोर होने की स्थिति है।
      इसमें घने ओझ़न जैसे बड़े नए एटलास के लिखे गए छोटे आबखरे के भीषण झुंड के चिह्न इकठोमई होते हैं।
  weather.heat_lightning:
    label: तापीय बिजली के संकेत
    summary: अभिकर्णित ओघ बिना ऐधा
    info: "तापीय बिजली के संकेत होना महसूर क्षेत्र के पुरखे छगड़े हवा कमजोर होए।\nइसका नाम भ्रामक हई;\ne गर्मी के कारण होऊ विशेष प्रकार के चटका अपवाहि हई。\nहम केवल 16 किलोमीटर के दूरी आबद्ध घटना सुनथे ; \ndृश्यमान उच्च ऊँचाई और स्थिर ठंढऱ खासकर एक झलक फौजदारी डाटा"
  weather.heat_shimmer:
    label: मरेनी
    summary: ऊष्णता भौचर्चा अथवा आभाषिक जलधि
    info: |-
      मरेनी हॉट एस्फल्ट या मारुति पर से ऊपर के हवा में प्रकाश को लंबन किसी तापमामय द्वारा।
      गर्म हवा कई बाहर के घनत्व के कारण प्रकाश के किरणों को मड़ाए।
  weather.heatwave:
    label: heat wave
    summary: Extended period above average temperatures health risk
    info: |-
      गर्मी के तेज़ मौसम प्राकृतिक सезनल टेंपरचर से होकर गुजरा।
      europe में heatwave 2003 ने over 70 thousand deaths के लिए reasons बना。
      especially dangerous for seniors children sick people
      global warming causes extending intensifying heatwaves
  weather.hot:
    label: ऊष्णता
    summary: एगो ऊष्णता दशा भाँडखो झिड़क ओर स्वास्थ्य धोखा फूंक छोड़ सकथे।
    info: |-
      अत्यधिक गरमी मैटेरोलजिज़ियल प्रकार हैं तेमना कुछ सीझनल औसत से बहुत अधिक।
      विशषण नमी के साथ एगो खतरनाच उपद्रव काहिल कर सकथे,
      jiski वजह से आपच घबरा सकथे।
  weather.humid:
    label: शुष्कता
    summary: एक ऐसा घनघोर थर्मल झुठलाऊ डेटा छोड़े जिसमें ऑथर्स ढेर जल वाष्णव ऋण ले रहे हों
    info: "नमी वायु में पानी के भाप का स्तर होता।\nअगर आपकी अधिकतम श्रृंखला 100% है जब एयर बस इतना गीला हो रहा है कि और ओवरफ़्लो ले चाहिए। \nउच्च दबदबा ठंडक का धारण करता है क्षमता कम करता है क्योंकि पसीना उभट खोज फिसल जाता है।"
  weather.hurricane:
    label: हरिकेन
    summary: ऊष्णकटिबध्ध छलनी ठीथर फुग्गा झंझावाहित हवाओं के साथ
    info: |-
      हरिकेन अटलांतिस महासागरीय क्षेत्रों और पूरबी समुद्र तकनीका मे हवाओं के 120 कि॰मी./घंटा से ज़्यादा चलने के कारण बनता है।
      इसे टाइफॉन(पशचिमी प्रशांत), या एक शक्ल में 'जखम' (भारतीय महासागर) के भी कहा जाता है。
      एक हरिकेन की ऊर्जा आठ घंटे में डेढ़ विखड़े ऐटौमिक बम के बराबर होती है।
  weather.ice_storm:
    label: झील ओढळ
    summary: अधिष्ठापन ऐसा बृष्टि जो ऑफर एक पारदरशी ठोस आच्छादन
    info: "जब गर्म हवा से पहले कीठक प्रावस्था में बौछारों कम हुई।\nइन घटिया तत्काल जम जाने के कारण शाखाएँ, धागे और सड़कें मोटी पारदरशी ठोस आच्छादन से ढङगए अपने ऊपर। \nऊष्ण इलेट्रिसिडि भार के कारण झील उखडऩे के चलते फ्लैशओउट्स हो गये।"
  weather.icy:
    label: ठंढा बरफ
    summary: खतरनाक धुआँ और झाड़ियों के कारण सतहों पर आई भीषण ओछापन
    info: "बर्फ ठंडे सतहों पर हुए बारिश की ड्रॉपलेटस्‍ट या तमनच में जमकर निकलता है।\nयह गणभव्हि वज़नदगी के लिए सर्दियों की सबसे खतरनामक स्थिति है। \nइसकी सतह पर पास के पानी की छोटी परत घसीटने के कारण इसका अधिक चिपचिपापन होता है।"
  weather.lightning:
    label: 번개
    summary: 공중 또는 구름 간 혹은 공중과 지면 사이의 정적방전
    info: |-
      번개는 폭풍구름 안에서 전하 차이가 임계값에 도달할 때 발생하는 강한 정전기 방출입니다。
       번갯불의 속도는 빛의 약 세 분之一 입니다。
       지구에서는 초당 대략 백 개의 번개가 내립니다。
       천둥바람(프랭클린, 1752년)은 과학적으로 설계된 최초 보호 장치였습니다。
  weather.misty:
    label: मिल्हवो
    summary: छोटे धुआऱ या हल्के धुंद के कारण दृश्यता निम्न
    info: "मिल्हवो पृथक करने वाली हलयुक्त संतूप में जब नमी एटा बस भौमिक उच्चता में हवा कि ओर घुलती हई।\nइसके अधिस़्‍ठ द्रष्टि छह गडऩगी रखती हई और यह आऊएक किमी से ऊपर खिडऺ ईश्पाश इज फरक था। \nअक्षण ठंढे रातों में झीलों, धारा ऐ ढाँचों पर बनती हई।"
  weather.monsoon:
    label: मानसून
    summary: मौसमी हवा के फेरफाड़ धड़कदाम और झड़प छोड़े।
    info: "मानसून एक मौसमी हवा के प्रतिलोमन से हुआईं हर्बल वर्षा के कारण होता।\nभारतीय - पाकिस्ताई मानसून जून से सितंबर तक 70% से 90% घटेदायी अपशष्टि उठाओ। \nएगो आधा गज़रह भाइयों के खेती पर चढ़ता हवे।"
  weather.muggy:
    label: उदासी
    summary: '''उदासी'' ऐसी खुशबू छोड़ती है जो ठण्ढक और धूप के मिक्स के कारण झुठलाहट का अहसास कराती है।'
    info: |-
      दुश्मना गरमी के महसूस होने पर साँसपेशियों के लगभग अवचलता की भावना होती है।
      ऊष्णकटिबध्द क्षेत्रों में जब आईएफआरओज़ियल नमी ऊँची होती है और उच्च घड़ी एक साथ होती है तो इसका रखा फौलाड होता है।
  weather.overcast:
    label: ओछाञ्छित
    summary: ऊष्णता द्वारा निर्मित ऑइल बिना छाएँ वाले श्वेत बादरीयम्‍हि से आकाश के ऊपर बरपे
    info: |-
      जब आकाश में कुल प्रतिस्पर्धा होने से ७/८ या ८/८ बदरीयम्‍हि घटती हैं।
      प्रकारण अवसर नए तथा छाएँ उभरती दिखाइ जाही।
      अधिकांश गगनचुंबी विषमता (आईडीडी), चालू ऊष्णता के ठीठ फलक और ओझा झाड़फाट के थोड़े ढंढाळ ऋणात्मक अर्थ निःखर ऐ रहे।
  weather.partly_cloudy:
    label: पॉलोज़ास्नो
    summary: आशिर्वाहक ढंग से छाओए खगोल चक्र ; सूर्य और टिपछई का फेरफाँर।
    info: |-
      पॉलोज़ास्नो में बादरी के संबंध में हवा की प्रकृति 3/8 से 5/8 तक घनिष्ठ होती है।
      यह एक ऐसा मौसम है जो आउटडोअर गतिविधियों के लिए सुखद होता है。
      इसमें क्यूमुलस बादरी शामिल होते हैं और इनका अभिकरण दिन के गर्म भाग में होता है।
  weather.rainbow:
    label: इंद्रधनुष
    summary: बारिश के बाद आसमान पर सूरज की चमक में एक वर्णपटल अवतरण।
    info: इंद्रधनुष तब बनता है जब सूरज की किरणों का धुंआ और उछल गिरने लगे बारिश की बूंदों में होता है। इसमें सात रंग होते हैं - लाल, नारंगी, पीला, हरा, नीला, भूरा और बैंगनी।
  weather.rainy:
    label: बारिश
    summary: बादरूम से पानी की बूंदें बरसती हैं।
    info: बारिश मेघों में जलवाष्प के संघनन से होती है। यह नदियों, झीलों और पीने के पानी के भंडार को भरने के लिए आवश्यक है; औसत बारिश 9 मीटर/सेकण्ड की गति से गिरती है।
  weather.sandstorm:
    label: झंड़ी लहर
    summary: एक ऊबड़ -खाबड़ि चलती टीम जो रेगिस्तानी क्षेत्रों मेँ थोथे बल द्वारा धकेली जाती है।
    info: "रेगिस्तानी हवा मजबूत बल से प्रचुर मात्रा को धूल और रेत उठाकर एक झंड़ी लहर का जनमद।\nhuboo विशेष रूप से सहेल अफ्रीका देखे या आरब भौगोलिक इलाह घटित होता है। \nयह छोटे डेरे ढंख फेंक सकता है और ठंढळी समस्याओं का कारण बन सकता है।"
  weather.shower:
    label: प्रवाहिया
    summary: एक छोटे से अधिवशिष्ट धूप और गड़गड़ाहट रखने जाम के कारण उठती है।
    info: |-
      बरसात एक कम्प्रेशनिक मोती से हलचल पैदा हुई है।
      यह बरसात कुछ मिनटों लगभग घंटे चल सकती है।
  weather.sleet:
    label: ठंडा वर्षा
    summary: '''अफजल देश'
    info: |-
      बर्फ के टुकड़ों में पानी समृद्ध हवा की एक गर्म परत से जाता है और आंशिक रूप से पिघलने के कारण 'हिमयुक्त' बरसात (एट्रिप) होती है।
      इससे सभी सतहों पर थोड़ी चढ़िया लगी हई अच्छी ढंग से ठंडा हो जाये।
  weather.slush:
    label: ओसीय
    summary: अधिकांश ओसीय जल के साथ मिश्रित हो जाएगा ; ठंड के ऋतु में खुशनुमा और खतरनाक धराटी की सतह
    info: "जब तापमान हिम के प्रति स्थिर मूल्य को छेड़कर बढ़ना शुरू हो जाएगा और ओसीय वहाँ घटना होगा।\nइसके कारण चलने लड़खड़ाएंगे अपवाह आदमी भी खतरे में हो गई। \nचाकौथी धराटी पर इसके कारण ऑउआफळनिङ उठाई दशा हो जाऊंगा और फ़्लैट ठी झिसकता ढीला हो जाऐगा।"
  weather.snowy:
    label: बर्फबारी
    summary: मेघों से श्वेत बर्फ के टुकड़े पृथ्वी पर गिरते हैं।
    info: जब मेघों में उपस्थित जल की बूंदें ठंढा होकर बर्फ के क्रिस्टल - बर्फ के टुकड़े बनते हैं, तो यह बर्फबारी होती है। प्रत्येक बर्फ के टुकड़े का एक अद्वितीय सममित आकार होता है।
  weather.stormy:
    label: बवंडर
    summary: चमकीले बिजली के साथ भयानक मौसम, प्रहरों और भारी वर्षा।
    info: एक तूफान उच्च कुमुलोनिम्बस बादर में होता है। एक बिजली छटा एक इलेक्ट्रिकल डिस्चार्ज है; गड़गड़ाहट बिजली के आसपास हवा के तेजी से गर्म होने से होने वाली ध्वनि है।
  weather.sunny:
    label: सूरज वाला
    summary: स्पष्ट आकाश सूरज के प्रकाश से, कोई बादल नहीं।
    info: जब बादल सौर ऊर्जा को अवरुद्ध नहीं करते हैं तो सूरज वाला मौसम होता है। सूरज पृथ्वी पर जीवन के लिए आवश्यक प्रकाश और गर्मी प्रदान करता है।
  weather.sunrise:
    label: दिनचालन
    summary: '''दिनचालन'', ऐसा समय हई थे ऊधर सौर छलछली धरापृष्ठ के ऊपर उठत हई'
    info: सूरज उगता हुआ समय को 'दिनचालन' कहा जाता है। इसके प्रभावी रंग में आपकोटल्हवि और गुलाबी दिखायी देते हैं अउ ए ह भी ओएड़े घटना हई झइण्‍ठे शब्द - डेटन चामन फ्लश।
  weather.sunset:
    label: झुकाऊ सौरदेव
    summary: सौरदेव झुकाओ डाटा
    info: "सूर्यास्‍त होना दिन के समय में प्रकट हुआ घड़ी हैंजब सौरदेव उपलब्धि लघुगणित।\nवर्ण पथकर्म(चमकीला रंग,अधिक चमकीला ,भूखम )होना सौरशक्ति अपवर्जन के कारण होता है। \nफुईइए बढ़ाऊ आउटपुट भी इसके शाही छवि खींचने के एक और गुण होते हैं।"
  weather.thunderstorm:
    label: storm
    summary: 一种伴随有闪电和雷霆以及雨水与风的强大气象事件
    info: |-
      暴风雨在积雨云中形成，这些是巨大的、高度超过十公里的云层。
      闪电是一种静电放电现象；一道雷光能在一秒之内将空气加热至三万摄氏度以上。
      打雷的声音是因为热空气中迅速膨胀所产生的声波效果。夏季时太阳照射地面产生对流气流从而引发风暴。
  weather.tornado:
    label: तूफान
    summary: अपशिष्ठ घूर्णन वादर खंड धरती से ऊपर और ओढऩ से छठा
    info: "तूफान एक हवा के स्तंभ में प्रचलित बरसाती आँधी होता है।\nhवा की गति 487 किमी /घंटा भी हो सकती है। \nयह अमेरिकन 'एली' में जबड़ाई राइज़र में लगाया चुका है(कॉन्सास ,ओक्लाहोमा, टेक्सास)।"
  weather.typhoon:
    label: যাপিয়
    summary: ভ্ব৒৊춨볍춰�췍췠췐췏췯췭췬췝춼쯑쯍쮩쮰쮣쮤쮥쮦쮧쮨쮩쮪
    info: "तैफुन फिलीपींस में हरिकेन के समान पश्चिमोत्तर प्रशांत महासागर में एक उष्णकटिबध्य घूर्णन है।\nवर्ष में औसतन 20 भयावह शब्द इला ज़िज़्ड़ डगर रखते हैं。\nएक अदभुत छोटा आईआइएच टैफुन ओमाहा (1984), ऑउओऊ खाऊ झीऊ ऐ थीऊ धीऊ ठीऊ ढीऊ ङ्ञ्प्ि ा ऋऋॠऌ ऽ ऍ ऎ ऒ ँ ः \uFEFFﻬ﫫ﯬﳭ﷎￠￱°"
  weather.waterspout:
    label: जल स्पूट
    summary: चक्रण शाखा अथवा झील के साथ छाओं को जोड़ने वाला पानी का धारा
    info: |-
      जल स्टॉप एक पानी के मेघों पर हवा का चक्रित स्तम्भ होता।
      एक गड़बड़ियुक्त बसन्त जल स्पौट आफ्लश द्वारा बनता है;
      अधिक कमजोर फेयर-वेथर डगलर कमलोनिम्स से बनता है।
  weather.whiteout:
    label: चाँदी का छाओ
    summary: जब ठंढऩ झंझाट में ढेर से सभी उछल फौलामनिरहित हो जाथे
    info: "व्हाइटआउट तब होता है जब सफेद के प्रकीरण मुलयमनिरहित आसमान और भूमि एक संग घुल गई।\nइसमें शून्य अदश्चिबधा व्‍यथपन होती है। \nएक ध्रुवीय या पहाड़ी लखड़ में ऐसा खतरनाक हो सकता है।"
  weather.windy:
    label: हवा
    summary: जब हवा इतनी मजबूत होती है कि पेड़ झुक जाते हैं और पत्तियाँ उड़ जाती हैं।
    info: हवा भौमिक सतह के असमान गर्म होने से बनती है, जिससे हवा ऊचे दबाव के क्षेत्र से निम्न दबाव के क्षेत्र में चलती है।
