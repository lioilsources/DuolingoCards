lang: ru
pivot: false
title: Погода
cards:
  weather.aurora:
    label: полярный свет
    summary: Естественный оптический эффект вызван солнечным ветром во магнитной сфере.
    info: Полярное сияние возникает при взаимодействии заряженных частиц от Солнца и атмосферы Земли. Оно создает зеленые, фиолетовые или красные полотна в небе над полярными регионами таких стран как Норвегия, Исландия, Канада либо Антарктида.
  weather.avalanche:
    label: лавин
    summary: Масса снега и льда спускается с холма или скалы.
    info: Снежавина - это быстрое движение снега по склону горы. Особенно опасны порошковые лавины со скоростью свыше 300 км в час; они убивают примерно 150 человек ежегодно во время зимних месяцев на Альпах.
  weather.blizzard:
    label: снежная буря
    summary: Мощная снежная бурса с густым снегом и ветром при практически нулевой видимости
    info: '{"hint":"сильный снегопад со шквалистыми ветрами и почти нуловой видимостью","info":"Снежная буря - это мощное погодное явление на Северном полюсе, объединяющее плотные метели и порывистые ветра\u5c4f\u76ae\u9ad8\u5ea6\. \"Белое пятно\" привело к тому что многие люди потеряли ориентацию из за плохой видимости\u5c4b\u5ca9\u5df1\u5de5\u5baa\u5ce1\u5cbf\u5dfe\u5def\u5bc6\u5fc3\u5faa\u5fb7\u5bf9\u5bb6\u5ec1\u5fd7\u5be6\u5eb8\u5ef6\u5ed3\u5ee3\u5efa\u5eff\u5fbd\u5ead\u5ff0\u5fcd\u5eab\u5fda\u5fac\u5fdd\u5ebb\u5fcc\u5eda\u5fab\u5faf\u5ecc\u5eee\u5efe\u5fff\u5fed\u5fee\u5ffe\u5ffc\u5ffd\u5ffb\u5ffa\u5fef\u5fec\u5fdf\u5feb\u5fea\u5fe9\u5fe8\u5fe7\u5fe6\u5fe5\u5fe4\u5fe3\u5fe2\u5fe1\u5fe0\u5fen\u5fmt\u5fnl\u5fmk\u5fjj\u5fiw\u5fix\u5fig\u5fir\u5foq\u5fpj\u5fps\u5frg\u5fqo\u5fsr\u5fti\u5fuw\u5fvx\u5fwz\u5fxa\u5fyb\u5fzc\u5fad\u5fbe\u5fcf\u5fdb\u5fgc\u5fhf\u5fib\u5ijc\u5ikd\u5ile\u5imf\u5ing\u5ioh\u5ipj\u5iqk\u5irl\u5ism\u5int\u5iou\u5ipv\u5iwq\u5ixr\u5iyw\u5izx\u5ja{\"label\":\"снежная буря\",\"summary\":\"Мощная снежная бурса с густым снегом и ветром при практически нулевой видимости\"}'
  weather.breezy:
    label: ветёрок
    summary: Приятный мягкий бодрящий воздух на тёплый день.
    info: Ветерок - это умеренный ветер со скоростью от 6 до 11 м/c по шкале Бофорта степеней 3–4. Он вызывает движение листьев и волос или перемещает легкие предметы. Физиологически он снижает ощущения жаркого дня за счёт испаряющейся пота.
  weather.clear:
    label: ясно
    summary: Доконально чистое небо без единого облака.
    info: Ясная погода - это метеорологическая ситуация с облачностью менее чем на одну восьмую покрытия неба. Это позволяет самому мощному солнечному излучению и лучшим астрономическим наблюдениям.
  weather.cloudy:
    label: пасмурно
    summary: Небо покрыто плотными облаками без прямого солнца.
    info: Облака представляют собой видимые скопления мелких капель воды или ледяных кристаллов. Более чем на 60% земное небо всегда покрыто облачностью.
  weather.cold:
    label: зима
    summary: Тепло очень сильно понижено до уровня ниже точки замерзания.
    info: Экстремально низкие температуры возникают тогда, когда арктический воздух проникает в умеренные широты. Самая низкая зарегистрированная на Земле естественная температура составила –89 °C и была зафиксирована станцией Восток в Антарктиде. Организм реагирует на холод сужением кровеносных сосудов и дрожью.
  weather.dew:
    label: роса
    summary: Капли конденсированной воды формируются на поверхности после прохладного вечера.
    info: Роса образуется из воды в воздухе на холодных поверхностях во время тихой ночи. Она появляется тогда, когда температура поверхности падает ниже точки росы. Это важный источник воды для животных и растений в засушливых регионах; например, скотоводов Атакамской пустоши собирают утреннюю росу с помощью сетей.
  weather.drizzle:
    label: морось
    summary: Осадок в виде тоненьких дождевых капель.
    info: Морось - это осадки с очень мелкими каплями размером менее 0,5 мм. Она не образуется из конвективных кумулонимбов, а возникает при низкой слоистой облачности и характерна для океанического климата таких мест как Великая Британия или Северная Франция.
  weather.drought:
    label: сушка
    summary: Длительный недостаток осадков вызывает нехватку воды.
    info: Сухость - это метеорологическая ситуация с длительным дефицитом осадков. Она приводит к потерям урожая, нехватке воды и пожарам.
  weather.dust_storm:
    label: прашная буря
    summary: Стена прахи, приведённая силным ветрением в сушей области.
    info: '{"hint":"\u043f\u043b \u0435\u043c\u044a\u0447\u043d\u044b\u0439 или песковый поток,железный ветерение","info":"Прашная буря возникается�когда мощный ветер поднимает мелкодисные песчаные частицы в воздух.\nВ Саидской Африке праху называют гаматтан.\nСаидский прах регулярно перекрывает Атлантику и достигает Америки;исследования показали его влияние на Амазонский лес.\nПрашные бури в США (Дустовая каша)в 30-е годах XX века вызвали экологическую катасфрофу на центральном западе."}'
  weather.flood:
    label: паводок
    summary: Переполнение воды из русел водотоков на обычно суходольные территории.
    info: Паводок возникает при обильных осадках или таянии снега и может быть вызван разрушением плотин. Поводни являются самыми затратными стихийными бедствиями в мире. В Чехии паводки 1997 года и особенно 2002 года привели к миллиардным убыткам и десятками жертвам.
  weather.foggy:
    label: туманно
    summary: Густой низкий туман у земли снижает видимость.
    info: Туман представляет собой облака на уровне поверхности Земли, состоящие из капелек воды. Он образуется при высокой влажности и снижает видимость до менее чем одного километра.
  weather.freezing:
    label: мороз
    summary: Температура под точкой замерзания водного пара способствует образованию льда.
    info: Мороз возникает при температуре ниже нуля градусов Цельсия и приводит к замерзанию воды в ледяное состояние. Биологически он опасен для растений, а гололёд может вызывать дорожные аварии. Самые сильные морозы на территории Чехии обычно случаются зимой – исторический минимум составил около −42 °C во Львовичах ещё в 1929 году.
  weather.frost_flowers:
    label: лёдцвет
    summary: Красивые ледяные кристаллы формируются на холодной поверхности.
    info: Ледяные цветы образуются при замерзании влаги на чрезвычайно холодных поверхностях и представляют собой кристаллические образования с изящными узорами льда. Они возникают только при определённых условиях – теплый влажный поверхности и очень холодном воздухе.
  weather.frosty:
    label: заморозочное утро
    summary: Поверхностный иней; ледяные кристаллы покрывают растения и землю.
    info: Иней образуется тогда, когда температура поверхности падает ниже точки замерзания и влажность воздуха кристаллизируется. Он создает красивые узоры на листьях, стекле и почве.
  weather.gloomy:
    label: пасмурно
    summary: Темная затянутая погода с депрессивной атмосферой.
    info: Суровая погода характеризуется низкими темными облаками и приглушенным светом в атмосфере мороза или дождя. Такую погоду связывают с тоской и осенью. Сезонное расстройство настроения вызвано недостатком солнца зимой.
  weather.hailing:
    label: град
    summary: Осадок из морозного дождика может повредить урожай.
    info: Град – это осадки в виде ледяных гранул или шариков, образующихся внутри облаков во время сильной бури и выпадающих на землю при этом явлении погоды.
  weather.haze:
    label: опар
    summary: Сниженная видимость вызванная пылью дымом или загрязнением
    info: Опар - это снижение атмосферной прозрачности из-за пыли дымом или мелкими частицами аэрозолями. Он отличается от тумана тем что туман состоит из капель воды тогда как опар образуют твердые либо жидкие аэрозоли Также крупные города Азии часто страдают от смога который представляет собой комбинацию загрязнения и индустриальных выбросов Микроочистка воздуха в виде UPM может представлять риск для здоровья особенно системы органов дыхания
  weather.heat_lightning:
    label: тёплый удар
    summary: Отдаленные вспышки бури без звука.
    info: Тепловые молнии - это вспышки отдалённой грозы, раскаты которой не слышны из-за большого удаления. Название может быть обманчивым, так как речь идёт о типичных разрядах, а не специфических вызванных жарой. Мы можем услышать только те молнии которые находятся на расстояние до шестнадцати километров; более дальнее расположение делает их тихими.
  weather.heat_shimmer:
    label: моариция
    summary: Оптикальное искажение светового потока при прохождении через разные температурные зоны
    info: Моарениями или оптическими иллюзиями являются явления света в воздухе под воздействием тепла от горячих поверхностей. Горячий воздух над асфальтом имеет меньшую плотность по сравнению с холодным окружающим его слоям - излучение преломляется на границах этих сред различной температуры.
  weather.heatwave:
    label: жара
    summary: Длительно протекающий период сверхвысоких температур; представляет риск здоровью.
    info: Волна жары - это длительный период экстремальной засушливой и очень высокотемпературной погоды выше обычных сезонных температурах. Европейская волна жары 2003 года привела к более чем семидесяти тысячам избыточным смертям. Особенно опасно для стариков детей и больных людей.
  weather.hot:
    label: жара
    summary: Интенсивное тепло, которое причиняет дискомфорт и представляет риск для здоровья.
    info: |-
      Экстремальная жара - это метеорологическое явление с температурой значительно выше сезонной средней
      В сочетании со влажностью может вызвать перегрев организма и угрожающий жизни теповой удар,
      в Чехии во время волн жары температура превышала +38 градусов Цельсия.
  weather.humid:
    label: влажность
    summary: Насыщенный паром атмосферный состав вызывает тепло и дыхательную тяжесть.
    info: Влажность измеряет содержание водяного пара в воздухе. Относительная влажность на уровне ста процентов означает полное насыщение воздушной среды – при превышении происходит конденсация воды. Высокая степень увлажнения усиливает чувство жаркого климата за счет того что пот не испаряется легко.
  weather.hurricane:
    label: урган
    summary: Огромная структура тропического циклона, характеризующаяся наличием спиралиющихся потоков воздуха около его безветренного ядра.
    info: '{"hint":"массивный тропический циклон со спиралевидными ветрами вокруг тихого глаза","info":{"label":"ураган","summary":"Могучий тропический ураган с ветром более чем на скорости 120 километров за час.","content": "Ураган - это тропический шторм в Атлантическом океане и западной части Тихого океана, где скорость ветра превышает 120 км / ч\nТакже называется тайфунами(западное побережье Тихого Океана), или же просто как циклоны(Индийский океан). \ nЭнергия урагана эквивалентна десятки атомных бомб в день. \ nСамые мощные из них достигают пятой категории по интенсивности, при этом скорость их ветра может составлять свыше 250км\/ч."}}'
  weather.ice_storm:
    label: лёдовая буря
    summary: Морось с низкой температурой оставляет на поверхности всё вещество тонким просветляющим слоем.
    info: Ледяной шторм возникает тогда, когда тёплый воздух над холодным слоем вызывает дождь, который мгновенно замерзает. В результате ветви деревьев, провода и дороги покрываются плотными прозрачными пластами льда. Перегруженная электросеть под давлением такого веса может выйти из строя.
  weather.icy:
    label: обледенение
    summary: Опасный лёд на поверхностях, вызывающий скольжение.
    info: Обледенение образуется при замерзании капель дождя или таянии снега на холодных поверхностях. Это одна из самых опасных зимних ситуаций для движения. Скользость льда вызвана тонкой пленой жидкой воды поверх него.
  weather.lightning:
    label: молния
    summary: Электростатический разряд между облаком и землей или между двумя облаками.
    info: Молния возникает при разнице зарядов в грозовых облаках и достигает критической величины. Скорость молнии составляет примерно треть скорости света; на Земле ударяет около ста молний за секунду. Молниеотвод Франклина изобрели еще в 1752 году как первое научное устройство для защиты.
  weather.misty:
    label: туманно
    summary: Низкая видимость из-за тонкого смога или свежего тумана.
    info: '{"hint":"низкая видимость из-за тонкого смога или легкой мглы","info":"Туманная погода возникает при конденсации водяного пара в нижнем слое воздуха.\u064f От плотной дымки она отличается тем, что видимость ограничена, но не менее чем на один километр.\u064f Часто образуется над реками и озерами за холодных ночей.\u064f Туманные утра над чешской местностью являются типичным образом осени."}'
  weather.monsoon:
    label: муссон
    summary: Сезонная переменность ветра приводящая к периоду обильных ливней.
    info: Муссон - это климатическое явление, вызванное сезонным изменением ветров между океаном и сушей. Индийский муссон приносит от июня до сентября 70–90% годовых осадков. О жизни около семи сотен миллионов людей зависит земледелие на основе дождей во время сезона циклона.
  weather.muggy:
    label: душный
    summary: Неприятное чувство жара от дыхательного воздуха.
    info: Душно из-за сочетания высокой температуры и влажности воздуха. Высокая влага мешает испарению пота на теле человека, что не позволяет телу эффективно охладиться.
  weather.overcast:
    label: облочно
    summary: Небо полностью покрыто серыми облаками без прямого воздействия солнца.
    info: Облачная погода наступает при облачности в размере от 7 до 8 баллов из возможных 8. Свет рассеянный и не создает теней. Недостаток солнца играет ключевую роль в географически зависимом депрессивном расстройстве света года (САD). Лечение световой терапией имитирует естественный солнечный свет.
  weather.partly_cloudy:
    label: полоясно
    summary: Небосвод частично затянуто облачностью; чередование света и тени.
    info: Полоясно - это метеорологическая ситуация с облаками в количестве от трёх до пяти октавных частей неба. Это один из самых приятных типов погоды для активного отдыха на свежем воздухе и содержит кучевые облака (кумулюсные), которые образуются во второй половине дня.
  weather.rainbow:
    label: радуга
    summary: Цветной арка на небе после дождя, когда светит солнце.
    info: Радуга возникает из-за преломления и отражения солнечного света в каплях дождя. Она состоит из семи цветов — красного, оранжевого, желтого, зеленого, голубого, индиго и фиолетового.
  weather.rainy:
    label: дождь
    summary: Из облаков падают капли воды как дождь.
    info: Дождь образуется конденсацией водяного пара в облаках. Он необходим для наполнения рек, озёр и запаса питьевой воды; средний дождь падает со скоростью 9 м/с.
  weather.sandstorm:
    label: песчаная буря
    summary: Стена из песка и пыли перемещается силами мощного ветра через засушливые регионы.
    info: Песчаная буря возникает тогда, когда сильный ветер поднимает огромное количество пыли и песка. Хабуб – это специфический тип песчаной бури на Сахеле и Аравийском полуострове; он может похоронить деревни целиком или вызвать проблемы дыхания у людей.
  weather.shower:
    label: '"порывистый дождь"'
    summary: «Краткие тучи»
    info: '{"hint":"Краткий но иногда сильный пролив дождя","info":"Порывистый дождь - это короткая интенсивная осадка из конвективного облака (кумулюсы или кумулонимбы).\nОн наступает быстро и проходит за минуты до часов.\nЭто типично для лета: солнечное нагревание вызывает конвекцию и образование кумулонимбов в полуденном время.\nПосле порыва может появиться радуга."}'
  weather.sleet:
    label: мёрзнущий дождь
    summary: Смеси дождя со снегом или частичного расплавления снежных хлопьев.
    info: Мрзнутий дощ возникает тогда, когда снежинки проходят через тёплый слой воздуха и частично плавятся.
  weather.slush:
    label: растопленый снег
    summary: Часть растянутого снега смешивается с каплями дождевой жидкости – это неприятное зимнее явление.
    info: Растаявший снег образуется тогда, когда температура поднимается чуть выше точки замерзания и начинает таять лёд или снежный покров на земле. Он очень скользкий для пешеходов и водителей машин в целом. На дорогах он вызывает эффект аквапланирующего движения колес автомобиля по поверхности воды между шинами и дорожным полотном.
  weather.snowy:
    label: снегопад
    summary: Из облаков падают белые снежинки.
    info: Снег образуется тогда, когда капли воды в облаках замерзают на ледяные кристаллы — снежинки. Каждая снежинка имеет уникальную симметричную форму.
  weather.stormy:
    label: гроза
    summary: Драматичная погода с молниями, громом и сильным дождем.
    info: Гроза возникает в высоких кумулонимбовых облаках. Молния – это электрический разряд; гром – звук, вызванный быстрым нагреванием воздуха вокруг молнии.
  weather.sunny:
    label: солнечно
    summary: Чистое небо с ярким солнцем, без облаков.
    info: Солнечная погода возникает тогда, когда облачность не блокирует солнечное излучение. Солнце обеспечивает свет и тепло необходимые для жизни на Земле.
  weather.sunrise:
    label: Заряд
    summary: Мгновение утром, когда Солнце поднимается над уровнем земной поверхности.
    info: Свечение - астрономический момент времени, когда солнечный диск пересекает горизонтальную линию. Его окраска зависит от длины волны света и вызван эффектом Рэлея; свечение может быть оранжевым или розовым цветовыми тенденциями. В полярных регионах это явление происходит только во время специфических сезонов из-за полюсного дня и ночи.
  weather.sunset:
    label: закат
    summary: Момент окончания дня, когда солнечное диско исчезает за линию горизонта.
    info: Закат солнца - это ежедневный момент, когда Солнце опускается под горизонт. Цветовая палитра заката объясняется рассеиванием света и включает оранжевые, красные и фиолетовые оттенки. Особенно красивые закаты происходят после извержений вулканов – частицы пепла усиливают насыщенность цветовой гаммы.
  weather.thunderstorm:
    label: гроза
    summary: Интенсивное атмосферное явление с молнией и громом, дождем и ветром.
    info: Гроза возникает в кумулонимбах - огромных облаках высотой более чем на 10 км. Молния – это электростатический разряд; молния нагревает воздух до температуры около 30 000 градусов за долю секунды. Гром является звуковым эффектом быстрого расширения горячего воздуха.
  weather.tornado:
    label: торнадо
    summary: Руйнирующее воздушный колонна от облака до Земля.
    info: Торнадо – это быстро вращающийся столб воздуха, возникающий из грозы и касающийся поверхности земли. Скорость ветра может превышать 500 км / ч. Чаще всего они встречаются на территории США пояса торнадо (Канзас, Оклахома, Техас). В Чешской республике бывают торнадо, но очень редко; летом 2021 года сильное торнадо поразило юг Моравии.
  weather.typhoon:
    label: тайфун
    summary: Мощный тропический циклон со скоростью ветра свыше 120 км / ч.
    info: Тайфун - это название урагана на Филиппинах, в Китае и Японии. В среднем ежегодно около двадцати таифунов поражают Филиппины. Тайфун Нинна (1975 г.) вызвал наводнение в Китае с более чем 229 тысячами жертв.
  weather.waterspout:
    label: водяной смерч
    summary: Скручивающаяся струна воды соединяет океан или пруд облаком.
    info: Водяной смерч – это вращающийся воздушный столб над водой. Опасные торнадообразные водяные смерчи образуются из грозы или слабые дневные солнечные смерчи формируются от кумулонимба. Они могут всасывать рыбу и других животных на берег.
  weather.whiteout:
    label: белая мгла
    summary: Состояние полярной бури, при котором снег приводит к потере всех контрастов.
    info: Белое безмолвие возникает тогда, когда снежная буря и отражение снега вызывают слияние неба и земли в одно белоснежное поле. Это обеспечивает нулевую видимость и дезориентацию.
  weather.windy:
    label: ветрено
    summary: Сильное движение воздуха, изгибающее деревья и уносящее листья.
    info: Ветер возникает вследствие неравномерного нагревания земной поверхности, что вызывает перемещение воздуха из областей высокого давления в области низкого давления.
