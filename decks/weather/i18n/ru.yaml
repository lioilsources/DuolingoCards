lang: ru
pivot: false
title: Погода
cards:
  weather.cloudy:
    label: пасмурно
    summary: Небо покрыто плотными облаками без прямого солнца.
    info: Облака представляют собой видимые скопления мелких капель воды или ледяных кристаллов. Более чем на 60% земное небо всегда покрыто облачностью.
  weather.foggy:
    label: туманно
    summary: Густой низкий туман у земли снижает видимость.
    info: Туман представляет собой облака на уровне поверхности Земли, состоящие из капелек воды. Он образуется при высокой влажности и снижает видимость до менее чем одного километра.
  weather.rainbow:
    label: радуга
    summary: Цветной арка на небе после дождя, когда светит солнце.
    info: Радуга возникает из-за преломления и отражения солнечного света в каплях дождя. Она состоит из семи цветов — красного, оранжевого, желтого, зеленого, голубого, индиго и фиолетового.
  weather.rainy:
    label: дождь
    summary: Из облаков падают капли воды как дождь.
    info: Дождь образуется конденсацией водяного пара в облаках. Он необходим для наполнения рек, озёр и запаса питьевой воды; средний дождь падает со скоростью 9 м/с.
  weather.snowy:
    label: снегопад
    summary: Из облаков падают белые снежинки.
    info: Снег образуется тогда, когда капли воды в облаках замерзают на ледяные кристаллы — снежинки. Каждая снежинка имеет уникальную симметричную форму.
  weather.stormy:
    label: гроза
    summary: Драматичная погода с молниями, громом и сильным дождем.
    info: Гроза возникает в высоких кумулонимбовых облаках. Молния – это электрический разряд; гром – звук, вызванный быстрым нагреванием воздуха вокруг молнии.
  weather.sunny:
    label: солнечно
    summary: Чистое небо с ярким солнцем, без облаков.
    info: Солнечная погода возникает тогда, когда облачность не блокирует солнечное излучение. Солнце обеспечивает свет и тепло необходимые для жизни на Земле.
  weather.windy:
    label: ветрено
    summary: Сильное движение воздуха, изгибающее деревья и уносящее листья.
    info: Ветер возникает вследствие неравномерного нагревания земной поверхности, что вызывает перемещение воздуха из областей высокого давления в области низкого давления.
