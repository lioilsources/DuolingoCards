lang: ta
pivot: false
title: நேர்காலி
cards:
  weather.cloudy:
    label: காற்றில் மூடப்படுதல்
    summary: மழுக்களால் நிரப்பப்பட்ட ஆனால் சூரிய ஒளி இல்லாத வளிமண்டலம்.
    info: மழுக்கள் தண்ணீரின் சிறிய துகள்கள் அல்லது பனிக்கச்சிகளின் குவிப்பாகும். பூமியின் குறைந்தது 60% வளிமண்டலம் எப்போதும் மழுக்களால் மூடப்பட்டுள்ளது.
  weather.foggy:
    label: மழுங்கல்
    summary: கணிசமான தரைத்தட்டு மழுங்கல் பார்வையைக் குறைக்கிறது.
    info: மழுங்கல் என்பது நிலப்பரப்பின் அளவில் உள்ள இருளிய ஆவி ஆகும்; இது நீரிழைகளால் ஆனது. அதிக ஈரப்பசையின் காரணமாக ஏற்படுகிறது மற்றும் 1 கிலோமீட்டருக்கும் குறைவான தூரத்தில் காணும் திறனைக் குறைக்கிறது.
  weather.rainbow:
    label: துகள்
    summary: மழை பிறகு சூரியன் ஒளி வாட்டும் காற்றில் தோன்றும் நிறப்பச்சை.
    info: துகள் மழை துளிகளில் சூரிய ஒளி எட்டுவதாலும் அதன் ஆடுவதாலும் உண்டாகின்றது. இது ஏழு நிறங்களைக் கொண்டுள்ளது - சிவப்பு, மஞ்சள், பச்சை, நீலம், கருநீலம், பூஞ்செஞ்சு மற்றும் பூச்சிரிவு.
  weather.rainy:
    label: மழை
    summary: குறிப்பாக மேகத்திலிருந்து வடஇரண்டு கொண்டுள்ள துளி செலவின் அளவு.
    info: மழை மேகங்களில் உள்ள நீர்நிறைவு காய்ச்சும் காற்றின் காரணமாக ஏற்படுகிறது. இதன் மூலம் ஆறுகள், குளங்கள் மற்றும் குடிநீர் எச்சில் நிரப்பப்படுகின்றன; சராசரி மழை ஒரு வேகத்தில் 9 மீ / வினாடி போகின்றது.
  weather.snowy:
    label: துரும்பொழிவு
    summary: காற்றில் இருக்கும் நீர்த்திரவிய துளிகள் உறைந்து பனி மணிகளாக ஆகின்றது.
    info: பனிச்சூட்டுகள் அல்லது பனிப்பொழிவுகள் எனப்படும் ஒவ்வொரு பனித்துருவின் வடிவமும் ஒரே மாதிரியான சீர்மையை கொண்டுள்ளது.
  weather.stormy:
    label: மின்மழை
    summary: இடி, குறள் இல்லாத பருவம் மற்றும் வலிமையான மழை ஆகியவை அடங்கிய திரட்டுப் பருவம்.
    info: மின்மழை உயர்ந்த சேருமிழிஞ்சல் மண்டலங்களில் ஏற்படுகிறது. ஒசியம் என்பது மின்னூட்ட வெடிப்பு ஆகும்; இடி என்பது ஒசியத்தின் சுற்றுப்புறத்தில் உள்ள காற்று வேகமாக வெப்பமடைவதால் ஏற்படும் ஒலி.
  weather.sunny:
    label: நன்கு பளிச்சென
    summary: வடிவம் இல்லாத தெரியும் கண்ணாடி.
    info: சூரிய ஒளி மழற்றுகள் அல்லது மேகங்கள் இல்லாமல் உயிரினங்களுக்கு தேவைப்படும் ஒளி மற்றும் வெப்பத்தை வழங்கும்.
  weather.windy:
    label: வெள்ளி
    summary: மரங்களை நகரச் செய்யும் மற்றும் இலைகளைத் தூக்கிப் போடும் வளைந்த காற்றின் உணர்வு.
    info: காற்று பரப்பில் ஏற்படும் அழுத்த மாறுபாடுகள் காரணமாக ஒரு பகுதியிலிருந்து மற்றொரு பகுதிக்கு காற்று நகர்வதன் மூலம் எழுகின்றது.
