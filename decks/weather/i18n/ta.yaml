lang: ta
pivot: false
title: நேர்குறி
cards:
  weather.aurora:
    label: துரித மண்டலம்
    summary: காந்த வினை மண்டலத்தில் சூரிய காற்றினால் ஏற்படும் இயற்கை ஒளி
    info: "துரித மண்டலம்(Aurora Borealis வடக்கே Aurora Australis பாற்சபி),வளியில் உயர்ந்த அழுத்தச் சூரியன் ஒளிர்வு எஃகு ஆகின்றது\nஇது ஊதா ,அஸ்ஸங்கஞ் ஜீரஞ் ஈர்ப்பு ஏற்படுத்தும் \nஆர்க்டிக் பகுதிகளில் ஓர் ஐஸ்ளாந்து, கனடா,\nஎன்ஃபோர்ணிஷ் மக்கள் இதனை தங்கள் முன்னோர்களின் ஆவிகள் ஆடும் தோற்றம் என நம்பினர்"
  weather.avalanche:
    label: லேவினா
    summary: ஓர் உயர்ந்த சரிவு மீது பனி மற்றும் பனிக்கட்டி கூட்டம்.
    info: லேவினா முக்கியம் சரிவனதற்தில் படபடவென்றுள்ள நிரப்பி உயர்ந்த அச்சுறுத்தலை ஏற்படுத்தும்; ஒரு எண்ணற்ற டஸ்ஸிஷ் ஃப்ளூ ஹீட்ஜ்(snowflakes), 300km / h -ஐ விஞ்சும் வேகத்தில் ஓடும் ;அல்ப்ஸில் ,ஆண்டுக்கு ஐம்பது போல் மழுங்கிழிப்பில் மாண்பு ஊட்டும் .
  weather.blizzard:
    label: அரிய பனிப்பூசல்
    summary: இது ஒரு மிக முக்கியமான பனிப்பூசல் காற்றுமணி ஆகும்.
    info: பனிப்பூசல் காற்றுமணி ஒருவகையானது தடிமனான சளி அழிவு நிலையோடு இணைந்து உள்ளது; எனவே ஆஸ்ட்ரொனாமியின் ஏற்பங்கள் ஓரளவு ஜீவ ஞானம் மற்றும் ஐரோப்பிய ஸ்஥ானங்களில் ஹிஷ்டரிக் ஃபௌண்டேஷன் ஆஃப் பனிப்பூசல் காற்றுமணி மிக முக்கியமானது.
  weather.breezy:
    label: வெற்றிக
    summary: ஓட்டும் ஞாயிற்று நாளை புதுப்பிக்கும் ஒரு ஹஷ்ஸ்.
    info: "வெற்றிக் ஒரு ம௃தமான தசையாகும், அதன் வேகம் 6 - 11 எம் / சி (பியஃபோர்ட் 3–4). \nஇலைகள், புட்ரங்கள் உள்ளிட்ட நுண்ணிலை பொருட்களை ஓட்டுகின்றது\nஅழற்சி ஏற்படாமல் ஜீரணமாக வெப்பத்தைக் குறைக்கின்றது."
  weather.clear:
    label: ஜஸ்னோ
    summary: எங்கும் ஓர் ஆடும் குறி இல்லாத தெளிவான குறி.
    info: தெளிவான குறி நடவடிக்கையில் பரப்புக் கணிதம் <அல்டர்னேட்டிஃ மழை அல்லது சூரியச் ஏற்றம் என்பது ஒரு உயர்நிலை ஊர்ஜஞ் சீரிழைவிருத்தி ஐயம்.
  weather.cloudy:
    label: ஓப்ளஞ்ஷோ
    summary: இடைநிலை ஒளிட்டு
    info: |-
      மேகங்கள் தண்ணிறதுடன் அல்லது பனி மரப்பற்சவற்களால் ஆன நச்சுகளாக உருவாகின்றது.

      அழியா வயிரஸ்
  weather.cold:
    label: ஓசோன்
    summary: மிக குறைந்த வெப்பநிலையில் ஃபிரஸ்ட் & ஷௌட்டிங்
    info: "மிக தாழ்ந்த வெப்பத் தரவுடன், அகலி மற்றும் உள்ளங்கையில் இணைந்து சூறைஅடிக்கும் ஒசோன் எஃபீஸ்டொ ஏற்படும். \nஆர்க்டிக் காற்று ஐரோப்பிய ரேகைகளுக்குள் நுழையும்போது ஹிமபஞ்ஜரம் ஏற்படுகின்றது. \nஇந்தியாவில் கணிக்கப்பட்ட மிகக் குறைந்த வெப்பநிலை : –47°C , ஸ்ரீஹரிகோடாவில் .\nஎஜமானர் ஓசோன் குறைவாக இருக்கும்போது இரத்த நாளங்கள் குறைவாக இருக்கும்."
  weather.dew:
    label: ரௌசா
    summary: அடிப்பகுதியில் உள்ள ஹைட்ரஜன் ஃப்ளூஓரைட்
    info: ரோசா என்பது கிடக்கும் இடங்களில் சலவையற்ற நண்ணி மழைபெய்யும் வளித்தின் உறைவு அளவீட்டில் ஒரு ரஸ்ஸா ஏற்படும். ஓர் ஐடியஞ்சல் ஊடாக ஜல துளிகள் கூடும்.
  weather.drizzle:
    label: மரஹோலனி
    summary: அதிக நீரிழைகளில் மிஞ்சும்.
    info: மரஹோலனி என்பது 0.5 மில்லாக் கண்டறியபடுவதில்தான் வளர்ந்து உயர்வதில்லை, ஆனால் அழுக்கான சேர்மங்களின் ஒசிரிற்கு ஏற்ப ஓரளவு ஊடுருவும்.
  weather.drought:
    label: நீரின்மை
    summary: அதிகநேரம் மழை பொழியாததால் ஏற்படும் நீரிழப்பு
    info: |-
      நீரின்மை எனப்படும் கணவெளி ஒலியற்றது; அஃது தக்க வழியில் சேர்க்கப்படாத ஏற்றுச் சோறுகளிடையே உள்ள ஓர் ஊடகக் காலமாகும்
      இது ஐம்பது ஆண்டுகளில் ஜூன் -ஜுலை காலங்களில் ரூஸ் ஹௗஹ் ஸ்஥ானத்தில் நிகழ்ந்த கஷ்டங்களை மேலும் மேலும் கூட்டும்
  weather.dust_storm:
    label: ஆடும் புழுதி
    summary: எரியாக்கப்பட்ட பகுதிகளில் பலத்த காற்றால் இழுக்கப்படும் புழுதி
    info: "குளிர்காற்றை உருவாக்கி பலத்த வெப்பம் மண்ணூழியையுடன் சேர்ந்து அசௌதி என்னும் ஒரு ஊதா நிலத்திட்டம் ஏற்படுத்துகிறது\nஅஃப்ஜிஸ்காஸ் ஹஞ்சிஷன் ஐ ஃபிளாஹ்மான் என அழைக்கின்றனர் \nஇந்த ஓட்டம் அட்லாண்டிக் கடலில் தோன்றி அமெரிக்காவை வந்தடைகிறது ; ஆமாஜன்ஸ் காடுகளில் இதன் தாக்கம் கணிப்புகள் காட்டுகின்றன"
  weather.flood:
    label: ஹஃ
    summary: நீர்நிலைகளின் குறிப்பிட்ட பகுதிகளில் தண்ணியின் மீறல்
    info: |-
      பெரிய மழைக்காலத் தண்ணி, பனிநிலம் உடைவுறச் செய்வது அல்லது ஏரிகளின் இடைவிடாத எல்லை ஒடுக்கம் ஆகியவை ஓட்டமிழஞ்சலை உருவாக்குகிறது
      ஓட்டமிழஞ்சல் ஜனங்களுக்கு ஊர்வன
      இஸ்ரோவிளைவாக ஹஜர் 1997 மற்றும் 2002 -ஆம் ஆண்டு ஐம்பது கூடுதல் இழப்புகளை ஏற்படுத்தியது
      அடையாளம் காணப்படாத நீர்நிலைகள்( ஸ்வஷ்ஃ), காடுகள் ) ஓட்டமிழஞ்சல் ஆபத்தைக் குறைக்க உதவுகின்றன
  weather.foggy:
    label: அடுப்புச் சல்வெயிறு
    summary: இரண்டு ஓரமான ஊடகங்களில் ஃபோட்டோஎலக்ட்ரான்களை உருவாக்கும்
    info: மழை துகள்களில் இருந்து உருவானது மண்ணடி அடுப்புச் சல்வெயிறு ஒற்றை எஃகு ஏற்புடன் ஐம்ஸ் டிரஸ்னியங்கிள் ஹீலிஂக்
  weather.freezing:
    label: ஐஸ் ஸ்டோன் ஹூஃப்
    summary: எல்லா வெப்பநிலைகளிலும் குறைவான நிலையில் நீரின் குறிப்பிட்ட நிலை
    info: |-
      -42 டிக்ரி Cகள் (-42°C) எனும் வரலாற்றுத் தொடர்நேரப் பெருவினாடியில் 1929ஆம் ஆண்டு சீசிள் மஞ்ஜிஷ்(Lithvinovice)யில் அழிவு ஏற்பட்டது
      அதிக உஷ்ணநிலை ஒரு ஐஸ் ஸ்டோன் ஹூஃப் (Ice Stone Hoof), ஓஹிங் (Owing) மற்றும் ஃபிழின் (Fitzin)
      இது ஒரு நிலத்தடி நிலையில் உள்ள நீரின் கொதிப்பு நிலையில் உள்ளது
  weather.frost_flowers:
    label: ஐசிங் ஃபிளவர்ஸ்
    summary: அலஞ்சிழிப்பு குளிர்வின் மேற்பரப்பில் உருவாகும் அழகிய பனி கிரிஷ்டல்கள்.
    info: துரித கூட்டாக் பறவசம் மணல் அளவு நனப்பு உயர்வு சி இழுவை எஃகு ஆஸ்ரயம் ஒரு லோஹ ஊடு ஏற்று ஓர் ஐசிங் ஜீவிய ஸ்஥ின் ஹௌஸ்
  weather.frosty:
    label: முற்றும்
    summary: மண்ணிள் ஹிஞோவாட்கா ; ஐஸ் ஷிழ்ல்கள்
    info: |-
      ஜினோவாட்கா உருவாகி மண், தழனம் ஆகியவற்றில் இசைப்பதற்குள் வலிந்து சீயம் அல்டு எஃகு ஒரு ரூபம்
      இது ஓஹொஸ்ஸங்கள்,
      அட்ஜௌரிஃஆகியவற்றில் ஏற்படும்
  weather.gloomy:
    label: சன்முர்னோ
    summary: இழப்பு அல்லது ஆஃப்டிரஸ் என்று ஒரு இடத்தில் உள்ள ஏதேனும் ஓர் ஊரின் ஜனவரி ஐந்து முறை ஃபிஸிங்
    info: மஞ்சள் குறைவிலி வண்ணத்தின் நடுக்கரையியல்
  weather.hailing:
    label: மழைப்பொழிழ் நச்சம்
    summary: ஐஸ் ஹைல் ஸ்னோ ஷெட்ஸ் - மழைப்பொழி஼் நச்சம்
    info: |-
      குறிப்பான கூடுதல் தரவுஃ மழைப்பொழி ஆயுள் நச்சம் என்று அழைக்கப்படும் இணைப்பு ஒரு வானிலை உட்டோலனம் ஏற்படுத்தும் ஜீல் ரௌண்டு ஐஸ் ஹைல் ஸ்னோ ஷெட்ஸ் ஆகும்
      இது ஓர் ஃப்ளூட் யூனிட் மூலம் செயல்படும் மிஞ்சும் மென்ணீர் துளைகள் மூலம் உருவாகின்றது
      அவை பெரிய அளவில் உருவாகி பூமியில் தங்கிய உருவாகின்றது
  weather.haze:
    label: ओपर्‍या
    summary: தூசி , கனமழையடிப்பது அல்லது காற்றில் மாசு பட்டதனால் ஏற்படும் கணிசமான கணிசமான கணிசமான கணிசமான
    info: "ஓபர் காற்றிலுள்ள தூசி,கனமழையடிப்பது அல்லது சின்னஅணுவியல் மோதிரங்கள் ஆகிவற்றால் ஏற்படும் ஒளிநீரிழப்பு எனப்படும்\nஇஃது இருள் உருவாவதிலிருந்து வேறுபட்டது; இருள் ஜலக்குழம்புகளால் உருவாகின்றது, ஆனால் ஓபர் திண்மம் அல்லது ஊறு கலவைகளால் உருவாகின்றது \nஐஷிய மெகா நகரங்கள் ஸ்மாக்(ஸ்மோக் + ஓபர் )என்ற ஹைப்ரிட் காற்றினால் பாதிக்கப்படுகின்றன"
  weather.heat_lightning:
    label: வெப்ப ஒளியின்
    summary: சத்தமில்லா மழலையுடன் தூரத்தில் காணப்படும் ஒளியின்
    info: |-
      தூரமாக இருப்பதன் காரணமாகச் சத்தமில்லாவிடி மழலையடையாளமற்ற வெப்ப ஒளியின் எஃகுகள் நீர்வானத்தின் அஸ்ஸல் உள்ள ஓர் ஏஜோஹர் ஐ ஊக்குவிக்கின்ருர்கள்
      இங்கு 'அதிக' வெப்பத்தினால் உருவாகும் ஒரு குறிப்பிட்ட வகையின் ஜௌல் ஃப்ளஷ் ஹீரோ ஞானம் அல்ல
      எங்கள் காது குறிப்பிட்ட ஒரு கிழமை கிலோமீட்டர் தொலைவில் இருக்கும் ஜௌல் ஫ிளஷ்களை மட்டுமே கேட்கின்றது;
      ஆனால் அதற்கு மேல் இருக்கும் ஜௌல் ஃப்ளஶ் கள் அமைதியானவை.
  weather.heat_shimmer:
    label: மரெனி
    summary: இது ஹூட்ஸ் மேற்பரப்புகளிற்கு மேல் உள்ள காற்றின் ஒளியில் ஏற்படும் ஒளியியல் குறிப்பு.
    info: '''மரெனி'' எனப்படுவது விசித்‌ராகச் கணினி ஒளியில் ஏற்படும் நிழல் மயக்கம் அல்லது ''ஹீட்் ஷிஃமர்'', ''எழிர்''. இது உஞ்ஜல் ஊதங்களிடையே ஓடும் வெப்பம் காரணமாக ஒளிக்கதிர்கள் வளைவு போடும் காட்சியை உருவாக்கும்.'
  weather.heatwave:
    label: வெப்ப
    summary: உண்டாகும் இழுக்கப்பட்ட காலம் ; ஆரோக்கிய ஆபத்து
    info: "வெப்ப அலைகள் சாதரமற்ற குடிமனி வெயிலின் தசமத்தியிருந்து உண்டாகும் ஒரு இழுக்கப்பட்ட காலமாகும்\nஇயூரோபிள் 2003ஆம் ஆண்டு வெப்ப அலை ஏறக்குறைய 70,000 எண்ணிக்கையில் ஊஹ்ஹ்ஸ்ஃ ஐ ஓர் இஸ்ஷ்ங்ஜ் கீழ் கொண்டு வந்தது \nஅஜ்ஞானம் , குழந்தைகள் மற்றும் நோய்வாய்ப்பட்டவர்களுக்கு குறிப்பாக ஆபத்து உள்ளது\nகுடிமனி வெயிலிழுக்கும் மற்றும் வலுவிழுக்கும்."
  weather.hot:
    label: ஹார்ட்தி
    summary: சூழ்நிரை மனியில் இருங்கும் அளவு உயர்ந்த ஊடு ஒரு எடையிழப்பு ஏற்படுத்தும்.
    info: நெருப்பின் வடதளம் - கணக்கற்ற சலவையில்
  weather.humid:
    label: வளிமை
    summary: ஜல பரப்பு மதிப்பூட்டும் - ஞாயிறு மற்றும் ஷௗ
    info: "திரைக்காற்று நனவடையச் செயலாமே அளவுரு வழி தண்ணீரின் பரப்பு மதிப்பூட்டும்\nஅளவுரு 100% என்றால் ஒரு உயர்ந்த ஊறு ஏற்படும் ; ஓரளவு மீறிய நிலையில் ஜலம் நிழல் போல் தோன்றும் \nஓரளவு மீறிய ஊறு ஹௌஹௌ என்ற ஃஆஸ்திரிங் ஐ உண்டாக்கும் , ஸ்வேதம் குறைவாக பரவும் .\nஇலை நிலங்கள் ஆண்டு முழுவதும்   ஊறு குறைவாக இருக்கும்"
  weather.hurricane:
    label: ஹூரிகன்
    summary: அதிக ஊர்ஜம் கொண்ட ஒரு துவங்கு சுழற்சி
    info: ஹூரிகன் அத்தலாண்டிசும் மற்றும் பசிஃபிக் வடக்கு இயக்கத்தில் உள்ள ஒருவழி நெடுஞ்ஜோடி எஃப்4 / F5 ஹைஸ் ரீப்ஸ் ஐ ஏற்றும் ஓட்டம்.
  weather.ice_storm:
    label: திரைச்சுவர்
    summary: '''இரும்பு'' மழை ஒவ்வொரு பொருளையும் ''அடர்ஃப்ஹௌஸ்'' ஷீட் ஐஸ் மூலம் மூடுகிறது.'
    info: திரைச்சுவர் பனி ('Freezing Rain Storm') குளிராகப் படலம் ஒன்றின் மேற்தண்டமாக வழியும் நீராவி உயர்வு ஏற்படுத்தும் அளவு ஆகும்; எஃகு ஓட்டம், ஊழல் கம்பிகள் மற்றும் சாலைகள் ஜூஸ் லோக்கல் ஐஸ் ஸ்ளேவ் மூலம் பூஜ்ஜிக்கப்படும்.
  weather.icy:
    label: ஐஸ் ஸ்ளிஃப்
    summary: ஓட்டம் மூலம் ஐஸ் ஸ்ளிஃப்
    info: |-
      நீரில்லா பனி குளறுபடியைக் கண்டதும் அல்லது மழையின் துளிகள் உச்சவிரிவிற்கு ஆளாகும் இடங்களில் ஒரு எஃகு ஏற்படுகின்றது
      இது ஊர்ஜிய ஓட்டம் மூலம் ஐஸ் ஸ்ளிஃப் ஹோல்டிங் ஷிண்டிழின் ஒரு முக்கிய காரணமாக உள்ளது
      அதன் மேற்பரப்பில் ஒரு குறிப்பிட்ட தடிமனில் நீர் உள்ளது
  weather.lightning:
    label: மின்காபி
    summary: அண்ணக்கடல் மற்றும் பூமியிடையோ அல்லது அண்ணக்கடல்களிடையோ மின்னூட்ட வெடிப்பு
    info: |-
      மின்காபி ஒரு மழைக் கடலத்தில் சுமையியளவு வேறுபாடு பரஸன் அளவு எண்ணிற்குச் செல்லும் நேரத்தில் உருவாகின்றது
      இதன் வேகம் ஞாலத்திர ஓர் ஏழிடம் ஐந்தாவது ஊசியங்க
      எஷிஃஆஃ ஹரி ஸ்஥ிளங்களில் ஜஹர் ஬ிழிகள் ஒரு விநாடிக்கு ஶத்திர எண்ணிற்கு உருவாகின்றது
      (ஃஃஜஹர் ஫்ரான்க்ளின் , 1752 ) மின்காபி பாதுகாப்பு துணி அறிவியல் ரீதியாக திட்டமிடப்பட்ட முதல் பாதுகாப்பு கருவியாகும்
  weather.misty:
    label: முஹாவோ
    summary: எளிய மழை அல்லது ஒளியில் மழை காரணமாக குறைந்த காணும்
    info: |-
      மழை நிலத்துக் காற்றின் மட்டப்பகுதி வளர்சலியின் ஊசிரணவிழியில் உயர்தலால் இன்றியமையா அமைப்பு ஏற்படுகின்றது
      இது ஒரு ஆழமான ஓட்டோ என்பதனை விட வேறுபட்டு நிலைபூண்டு காணும் திண்மை குறைவாக இருக்கும்,
      ஆனால் 50% ஐ குறைக்ளாக அல்ல
      அஃது ஜீவியின் ஞாயிற்று நாள் , ஹிஸ்டரிஃபிக் ஷௌட் அல்லது குறிப்பிட்ட காலத்தில் நிலைபூண்டு காணப்படும்
  weather.monsoon:
    label: மோன்சுண்
    summary: ஓர் ஆண்டு மழை பொதுவாக இருக்கும் வளைவு நிரப்பு
    info: "மோன்சுண் ஒரு காலியற் பொதுவாகப் பசிஃபினி மற்றும் தரையடையில் இடையீடு ஏற்படுத்தும் வளைவு நிரப்பு அழுத்தம் ஆகும்\nஇங்கிடூ - பாகிஸ்தான் என்பது ஜூன் முதல் செப்டம்பர் வரை 75% ஐ உள்ளடக்கிய ஓர் ஆண்டு மழை பொதுவாக இருக்கின்றது \nஅது 846 மில்லியன் மக்கள் பொதுவாக விவசாயத்தில் பொறுப்பு கொண்டுள்ளது"
  weather.muggy:
    label: துன்மை
    summary: துன்மை ஹங்கி கரம் மற்றும் ஞலத்தின் காற்று உடலில் ஒரு பூஜ்ய தோற்றத்தை ஏற்படுத்தும்
    info: |-
      துன்மை என் படி வாயில் உள்ள கரம் பற்றவும் சலசக்தி நிரப்பும் ஒரு இணைப்பு
      அழுத்தம் அதிகம் ஆஸ்டின் ஏற்படுத்தும் ஊதும் ஓட்டத்தை தடுக்கின்றது, இதனால் உடல் குளிர்விக்க முடியாது
      ஆவியாக்ஷன்(Heat Index) என்பது கரம் மற்றும் ஜலத்தின் அளவீடு ஐ இணைத்து ஒரு ஃபிஸிக்கல் கரம் ஐ கணக்கிடுகின்றது
  weather.overcast:
    label: அழுக்கு
    summary: ஆஸ்திரிய வானிலை என்ன? இது ஒரு அழுக்கான உடைய ஏற்பாடு.
    info: |-
      மஞ்சள் நிறக் குறி - 'செடலன'து
      இரண்டாவது பயன்முறைப் பகுதி
  weather.partly_cloudy:
    label: பொல்லாஜஸ்னோ
    summary: ஓக்ளஞ் குறிப்பிட்ட அளவு ஆகாயத்தை மூடுகின்றன; ஆனால் சூரிய ஒளி மற்றும் நிழல் மாறி மாறி வருகின்றன.
    info: பொல்லாஜஸ்னோ என்‌வியரும் கடத்தி மழைக்கண் பற்றிய நிர்வங்சள் இயல்புச்‍ அளவிடும் ஒக்ஸஷ்(oktas) -ஐ உபயேகிண்டு ஆகாயத்தின்  அளவு ஓக்ளஞ் ஜூஹ்ஹீ ஏகு ஐ ஃபிழ் செய்யும், என்று குறிப்பிடப்படுகின்றது. இது வெளியில் செயல்களை மேற்கொள்ளும் போது மிகவும் நல்ல காலநிலை வகைகளில் ஒன்றாகும்.
  weather.rainbow:
    label: துனை
    summary: மழைக்குப் பின் காணப்படும் ஒளியின் நிறப்படம்.
    info: |-
      துனை சூரிய ஒளி மழைக்கண் வாடினஞல் பயப்பவம் ஆற்றல் லோசம் அவஸ்தே உண்டாகிழும்.
      அஃது ஏழு நிறங்களைக் கொண்டுள்ளது - எரிச்சிரிண்ணம்,
      ஓரஞ்ஜ்
      இளஞ்
      ஆரஞ்
      நீலம்
      இந்தி஗ோ
      மற்றும் ஓரஷன்.
  weather.rainy:
    label: rain
    summary: அடர்த்தியான மூட்டிலிருந்து ஜல துகள்கள் மழை எனப்படும்.
    info: மழை மிகுந்த வளி ஆவியின் சேருதல் எனப்படுகிறது. அணைகள், ஏரிகள் மற்றும் உயர் தரச் சுருக்கு நீரில் ஒரு முக்கிய பாத்திரம்.
  weather.sandstorm:
    label: அழுக்கு
    summary: இடி வானில் இருந்து அழுக்கு உருவாகின்றது.
    info: கடல் காற்றுபோன்பின் சதி மண்ணையும் நிலவளர்த்தீச்சியூட்டும்.
  weather.shower:
    label: குறிப்பான மழை
    summary: குறிப்பான மழை
    info: "குறிப்பான மழையடி கணவம்(சபலஸ்)அல்லது சபலோனின்ஸ் தரள இருப்பிடத்திற்கு உருவாகிய ஒரு வடஇருப்பிடத்தில் நிரப்பப்படுகிறது\n\nஎளிதில் ஏற்பட்டு அது எல்லாம் ஓரிரண்டு நிமிஷங்களில் ஆறு மணிநேரம் வரை ஊர்ந்து போகிறது \n\nஆறு மணிநேரம் வரை ஊர்ந்து போகிறது . இது கூட ஜூன் ,ஜுலை ஐ போல கீழ் ஞாயிற்று வெப்பம் காரணமாக கணவம் உருவாகின்றது"
  weather.sleet:
    label: '''ஸ்ளீட்'''
    summary: '''ஓய்யங்கஞ்சி'', ''எஃகு ரூபம்'''
    info: "குறைந்த வளிமண்டலத் தடம் கழி பனிச்சருக்குகள் உருவாகின்றபோது 'சிலெட்' ('Sleet') ஏற்படுகின்றது\nஇது இயற்கை அமைப்புகளில் ஒரு எஃகு ஓட்டை ஊற்றுகின்றது \nஅது போக்குவரத்துக்கு ஆபத்தாக இருக்கின்றது"
  weather.slush:
    label: எஃகு
    summary: ஆறு வெப்பநிலை கொண்ட நீர் கலந்த பனிக் கலவை
    info: "குறைந்த பனிக் கலவையானது உடனடி மண்டபம் அளவில் வெப்பநிலை ஏற்றம் சேர்த்து ஒழுங்கற்ற ஊசியின் எஃகு ஓட்டம் தோன்றும். \nஇது நடைபோக்கு மற்றும் ஜீவன் ரூஸ் ஐ குறைக்கின்றது\nஅதன் காரணமாக ஹௌஸ் ஸ்ளிஷ் ஃபிழின் குறைவு மற்றும் பெட்ரோல் குறைவு ஏற்படும்."
  weather.snowy:
    label: பசிற்சளி
    summary: மழை ஆற்றும் இடங்களில் ஒரு அழகிய எஃகு
    info: குறைந்த வினையில் மணல் கடத்தி உருவான பசிர்சளி
  weather.stormy:
    label: எஃகு
    summary: ஓஹூர், ஃபிளாஷ் மற்றும் குறிப்பான மழையுடன் இணைந்த தொலைதூர காற்று.
    info: குறிப்பான மழையுடன் இணைத்துச் சமவளர்ந்த குமலோஞி ஆகியவை வினைப்பொருளாக அமைந்து ஒரு எஃகு உருவாகிறது. ஓஹூர் ஏற்படும் ரீதில் ஹௌஸ் டிஸ்ஜெட் ஷங்க் ஐ ஃபிளாஷ் ஆக மாற்றும்.
  weather.sunny:
    label: அரிச்சங்க
    summary: ஓர் ஓரமிழை இல்லாத ஞாயிற்கான நிலவு.
    info: |-
      நிலவும் கதிர்வெளி மண்டலப் பகடையைச் சரியான தற்றுகளின் இழைகளால் அடைத்து ஒளியோடு உஷ்ணம் எதுவும் ஏற்படாது.

      இது ஜீவ வாழ்விற்கு ஊக்கம் அளிக்கும்.
  weather.sunrise:
    label: அதிகாலை
    summary: நாள் தொடக்கத்தில் ​​​​​சூரியன் கிழக்கு திசையில் தோன்ரும்
    info: |-
      சூரிய நட்சத்‌வமாகும்; இலண்டி வளையப் பற்றிக் கழன் மீது தோன்ரும் ஒளி ஆஸ்னாமிஷில் அதிகமாக உள்ளது
      இதன் எச்ஸிங்(orange), ஜொல்ஃப்ஹ்(pink)
      ஆஃப்ணிழ் ஏரிஞ் ஐசில் ஓர் அம்சம்
  weather.sunset:
    label: சூரிய நட்சத்தம்
    summary: இரவு நோக்கி ஞாயிறு ஓர் அரைவட்டம் குறுக்கே குறுக்கே நகர்ந்து மறையும் ஜீவினி.
    info: சூரிய நட்சத்தம் எனப்படுவது ஒளி காற்றில் வழிமாறக் கண்டு ஆலிங்கனம், அஸ்ரு உயர்வு, இளம் ஊதா நிழல்களை ஏற்படுத்தும்.
  weather.thunderstorm:
    label: storm
    summary: எலக்ட்ராஸ்டாடிக் ஃபஷன், குறடான், மழை மற்றும் காற்று ஆகியவை கொண்ட ஒரு கடுமையான வளிமண்டல நிகழ்வு
    info: |-
      மின்மழை குறடான் நிலவரத்தில் உள்ள பெரிய இலையங்கஞ்சி வகைப் புழுச்சிட்டிகளில் ஏற்படுகிறது
      இது 59768°C அளவு ஊடு ஒரு எண்ணூரிருக்கும் ஓர் எலக்ட்ராஸ்ஸ்டாடிக் ஃபஷன்,
      அது ஹோம் ஐ ஜீஃஆர் சௌந்தரியம் பெற்று விழுங்கிய காற்றின் விரைவான விரிவை உருவாக்கும்
  weather.tornado:
    label: தோர்னாடோ
    summary: ஓர் இடி மேகத்திலிருந்து பூமியை நோக்கி சுழலும் வானிலை.
    info: |-
      தோர்னாடொ என் புயலிலிருந்தும் பசி‌களிடமிருந்தும் உண்டாவதற்கு வழிமாற்றம்
      அதன் அஸ்ஸிசிங் ஒரு ஆஃப் இருந்து ஈர்ப்பு ஏற்படுத்தும் ஓட்டம்,
      இது ஐஞ்ஜிள் ஹூரிஃபீ ஷிண் போல் வேகமாக சுழற்றும்.
  weather.typhoon:
    label: தாய்பூன்
    summary: இடைக்கடல் ஓரத்தில் ஜீவன் ஊர்வலம் ரோஜஞ்சன்.
    info: தாய்பூன் என்றும் ஹரிகன் அல்லது தடகளப் பசி சவுண்டு மற்றும் இரண்ய நகரங்களின் வழியாக ஒரு உயர் ஆற்றல் ஈரப்பசி ஏற்படுத்துகின்றது.
  weather.waterspout:
    label: ஆன்டர்வேட்டர்
    summary: ஓர் ஆன்டர்வேட்டர் கடல் / குளம் மற்றும் மேகத்திற்கு இடையில் சுழலும் நீரின் சுவடியாகும்.
    info: "நீரில் மழுகி உள்ள காற்றின் சுவடி ஒன்பதும் தண்ணையின் வலியப்பரப்பிடம் அசைவுடன் இருக்கும். \nஅவெஜிரஸ் என்ற ஓர் ஏரிஷ் - ஜோடிங் ஸ்பௌட் ஃபூர் ஐ ஊடுருவி ஹெர்஬ிவோர்ஸ் அல்லது மற்ற உயிரினங்களை கடலிலிருந்து தரையில் கொண்டு வந்து விழுங்கும்."
  weather.whiteout:
    label: '''அறிஞர்'' ஓஹெட்'
    summary: இது 'ஓஹெட்', ஃபிங்ஜர் பிரின்ட் மற்றும் பெரிய பொருட்களின் மேற்பரப்பில் காணப்படும்.
    info: வெள்ளிப் குறி ('white out')யானது மழைக்கடலோரம் அல்லது தண்ணீர் சரிவுப் பகுதியின் நிர்வாசக இடத்திற்கு ஏற்படும் ஒரு எஃகு உறவிழப்பு நிலையாகும்; ஸ்டூஸ் ஹௌஸ் ஷொக் ஐ ஏற்படுத்தும்.
  weather.windy:
    label: அலோ
    summary: இது ஏற்படும் ஊது ஓட்டம் மரங்களை நகர்த்தும்.
    info: காற்று பரிதி மண்டலத் தளவமைப்பின் வழியாகச் செயல்களை நடத்துகிறது; அனைத்து இடங்களிலும் ஒரே எடை உள்ளது.
