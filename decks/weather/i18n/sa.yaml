lang: sa
pivot: false
title: मौसमं अथवा प्रकृतिं
cards:
  weather.cloudy:
    label: ओब्लाचनो
    summary: आकाश घने बादरूप से प्रकट हुई कुछ अवस्था में है।
    info: मेघ जल की छोटी बूंदों या बर्फ के क्रिस्टलों के एकत्रित ढंग से आकार ले लेने के कारण दृश्य होते हैं। पृथ्वी के आकाश का लगभग 60% हमेशा मेघाच्छादित रहता है।
  weather.foggy:
    label: मल्हावो
    summary: घनी भूसतही मेघ जो दृष्टि क्षमता कम करिते।
    info: मल्हावो पृथ्वीक सतह पर हुए बने छोटे जलबिन्दुओं से बने मेघ हवे। ये उच्च आर्द्रता के कारण उत्पन्न होते हवे अउ एक किलोमीटर से कम दूरी पर दृष्टि क्षमता कम करिसकते हवे।
  weather.rainbow:
    label: दुहा
    summary: अविष्कार बादरे प्रकाशमय चपेटा सूर्य की ओर होता है।
    info: दुहा तब नज़र आती है जब वर्षा की बूंदों में सूर्य के प्रकाश का अपवर्तन और परावर्तन होता है। इसमें सात रंग होते हैं - लाल, नारंगी, पीला, हरा, नीला, एंडीगो और बैंगनी।
  weather.rainy:
    label: देश्तव
    summary: मरीचिमन जलकणाः पतन्ति।
    info: देश्तः मरुदोंशु कणा से वाष्प कणयों के संघटन द्वारा उत्पन्न होता है। यह नदियों, झीलों एवं पीने योग्य जल के भंडार को भरने के लिए आवश्यक है; औसत बरसात की गति 9 मी./से. होती है।
  weather.snowy:
    label: स्नेहनी
    summary: मेघांबरावले शुद्ध स्निग्धवृष्टि पतन करते हय।
    info: स्नेहनी मेघों में उपस्थित जलकणों के बर्फ के क्रिस्टलों - अफलज़ में ठंडा होने से बनती है। प्रत्येक स्निग्धवृष्टि का एक अद्वितीय सममित आकार होता है।
  weather.stormy:
    label: बौर्झका
    summary: विस्फोटक वातावरण जहाँ के बज़्यों, प्रकाश चमकने और भारी बारिश होती है।
    info: बौर्झका उच्च स्थिति में कुमुलोनिम्बस बादर में निर्मित होती है। एक प्रकाश चमकने घटना इलेक्ट्रिकल डिस्चार्ज है; गडगडाहट ध्वनि अपने आसपास के हवा के तेजी से गर्म होने के कारण होती है।
  weather.sunny:
    label: सूर्यप्रकाश
    summary: शुद्ध आकाश सूर्य के प्रकाश से जिसमें कोई बादर नहीं होता।
    info: जब बादर अवरोधन नहीं करते तो सौर विकिरण मुफ्त हो जाता है। सूर्य प्रकाश एवं ऊष्मा प्रदान करता है जो पृथ्वी पर जीवन के लिए आवश्यक है।
  weather.windy:
    label: वातयुक्त
    summary: बलिष्ठ वायुगति जो पेड़ मोड़े और पत्ती हटा सके।
    info: हवा का उद्गम भूपृष्ठ के असमान ऊष्मन से होता है, जो दबाव के उच्च क्षेत्रों से निम्न क्षेत्रों में हवा के प्रवाह का कारण बनता है।
