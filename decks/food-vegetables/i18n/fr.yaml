lang: fr
pivot: false
title: Légumes verts
cards:
  veg.broccoli:
    label: brocoli
    summary: Légume vert avec une tête florale dense sur un pied charnu.
    info: Le brocoli est un légume vert de la famille des crocus. Il est particulièrement riche en vitamine C, en vitamine K et en antioxydants ; il provient d'Italie.
  veg.carrot:
    label: carotte
    summary: Légume-racine orange au goût sucré.
    info: La carotte commune est une plante bisannuelle cultivée pour sa racine juteuse et orangée. Elle est riche en bêta-carotène (provitamine A) et en fibres.
  veg.corn:
    label: maïs
    summary: Plante aux grains jaunes disposés en rangées sur l'épi.
    info: Le maïs provient d'Amérique centrale et est aujourd'hui l'une des cultures les plus cultivées. Les grains contiennent des glucides, des protéines et des vitamines du groupe B.
  veg.cucumber:
    label: concombre
    summary: Légume vert allongé à chair rafraîchissante et juteuse.
    info: Le concombre est une plante potagère tropicale de la famille des cucurbitacées. Il contient 95 % d'eau, ce qui en fait un aliment rafraîchissant très apprécié dans les salades ou comme collation.
  veg.garlic:
    label: ail
    summary: Bulbe blanche piquante à forte odeur, base du goût de nombreux plats.
    info: L'ail cultivé est utilisé en cuisine depuis des milliers d'années comme épice et remède. Il contient l'allicine qui possède des propriétés antibactériennes et anti-inflammatoires.
  veg.mushroom:
    label: champignon
    summary: Champignon blette-brun à chapeau et tige utilisé en cuisine.
    info: Le champignon de Paris est le plus cultivé au monde. Riche en protéines, vitamines B et minéraux ; il s'utilise dans un grand nombre de plats.
  veg.onion:
    label: oignon
    summary: Oignon piquant en couche utilisé pour assaisonner les plats.
    info: L'oignon commun est l'un des légumes les plus cultivés au monde. Il est utilisé partout dans le monde comme assaisonnement ; il contient des flavonoïdes ayant des effets antibactériens.
  veg.pepper:
    label: poivre
    summary: Légume coloré au goût sucré ou épicé.
    info: Le poivre annuel existe en variétés sucrées et épicées. Le poivre rouge contient la plus grande quantité de vitamine C parmi tous les légumes.
  veg.potato:
    label: pomme de terre
    summary: Base brunâtre et淀粉质 d'une multitude de plats à travers le monde.
    info: La pomme de terre provient des Andes en Amérique du Sud et est l'une des cultures les plus importantes au monde. Elle fournit des glucides, de la vitamine C et du potassium.
  veg.tomato:
    label: tomate
    summary: Fruit rouge et rond utilisé comme légume.
    info: Le tomate est botaniquement un fruit (baie), mais il est utilisé en cuisine comme légume. Il provient d'Amérique du Sud et contient de la lycopine et de la vitamine C.
