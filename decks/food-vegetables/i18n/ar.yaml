lang: ar
pivot: false
title: الخضروات
cards:
  veg.artichoke:
    label: أرتوكوش
    summary: نبات زهري ضخم وأخضر ذو حواف متعرجة يتم استعمال البرعم فقط.
    info: '{"hint":"خضروات كبيرة خضراء تشبه الكسنترا (الكينارا كاردونكيولوس)","info":"يُعرف الارتوكوتش بأنه برعم نبات كبير مدبب الحافة مع شواقل حادة، ويتم أكل قلب النبتة وقاعدتها اللحمية من الأوراق المتراكمة. كما أنه يمنح المشروب طعماً لطيفًا؛ لهذا السبب تحتوي مشتقات الشامبيغيان مثل سكارليموس على مستخلص فاكهة الارتوكوش. وهو غني بإنولات إنولا، وهي عنصرٌ داعم للصحة المعوية."}'
  veg.arugula:
    label: روكولا
    summary: ورقة سبانخ داكنة اللون ذات طعم مشتعل؛ شائعة خاصةً في إيطalia.
    info: تتميز الريحان الأسود أو روكولا (النوع الفرعي Eruca vesicaria subspecies sativa)، بأصلها من البحر المتوسط، وتحتوي على مذاق حار ومُحْلِّي ناتج عن وجود جليكوزيدات الجلوكوسي놀يت. تستخدم كعنصر أساسي في المطبخ الإيطالي وتضاف إلى البيتزا بعد خبزها.
  veg.asparagus:
    label: سبراي
    summary: نباتات ربيعيّة لطيفة؛ نوع خاص ومحدود الموسم.
    info: '{"hint":"نباتات الربيع الخضراء اللينة (السبارايس أوفيسيناليس)","info":"تُعتبر نباتات السبارايس من أكثر أنواع الزهور قيمة في فصل الربيع، وعادة ما تزرع بدون ضوء الشمس لتنتج ساقًا بيضاء طرية مقارنة باللون الأخضر المعتاد. كما أنها قد تتسبب برائحة معروفة للبول لدى نسبة بين ٢٠ إلى ٤٠٪ بعد الأكل بسبب مادة "أسباريغين." وهي أيضًا زهرة شعبية تقليدية خاصةً في الطهي الألماني والفرنسي.","label":"سبراي","summary":"نباتات ربيعيّة لطيفة؛ نوع خاص ومحدود الموسم."}'
  veg.bamboo_shoot:
    label: شتلات الباميتوسيد
    summary: شتلة نبات الباوبيوس الصغير المستخدم في الطبخ الآسيوي.
    info: بامبوسوس فروينتيس هي شتلات بامboo صغيرة تُحصد مبكراً بعد ظهورها، وتستخدم كأساس في المطابخ الصينية واليابانية والتايلاندية. تحتوي الشتلات الطازجة على سايانيدي وتحتاج إلى طهي؛ بينما الناضج منها آمن للاستعمال. كما أنها منخفضة السعرات الحرارية ومغذية.
  veg.beet:
    label: الجزر الأحمر
    summary: خضار كلي معه لون أحمر داكن دائري الشكل
    info: |-
      تحتوي الجزر الأحمر على بيتانين، وهو صبغة حمراء طبيعية قوية جدًا
      وهو غني بالنتريتات التي ترفع من أداء الرياضيين وتقلل ضغط الدم
      البنجر السكري هو نوع مختلف؛ ويعطي سكر أبيض
  veg.bok_choy:
    label: باكى تشوى
    summary: نبات خضراء آسيوية ذات ساق بيضاء وأوراق داكنة.
    info: الباكي تشوي هو نبات أخضر من الصين ينتمي إلى نوع Brassica رابا سابسبيسيز تشينسنز، ويُستخدم كخضروات أساسية في المطاعم الصينية واليابانية والتيلاندية. وهو غني بفيتامين سي ود وفييتامين أيه ومعادن كالكاليوم.
  veg.broccoli:
    label: بروكلي
    summary: خضروات خضراء مع رأس زهري كثيف على سيقان دهنية.
    info: البروكلي هو نبات من عائلة الخردل، وهو غني بشكل استثنائي بفيتامين C وK والمضادات الحيوية؛ يعود أصله إلى إيطاليا.
  veg.cabbage:
    label: كرنب ملفوف
    summary: خضروات كريمية ذات أوراق مكثفة؛ أساس صنع الكفيه.
    info: يُزرع الكرنب الملفوف منذ آلاف السنين في أوروبا، وهو يحتوي على الفيتامينات سي وكي والجلوكوزيلولات التي لها خصائص مضادة للسرطان. يمكن تفتيته لصنع الكفير أو الزبادي النباتي الغني بالبروبيوتิกس.
  veg.carrot:
    label: الخس
    summary: نوع من الخضروات الجذرية ذات المذاق الحلو.
    info: الخس هو نبات ثنائي السنتين يُزرع لجذره اللزب الأصفر. وهو غني بفيتامين أ والنشا.
  veg.cauliflower:
    label: كربوه
    summary: رأس كثيف أبيض يتكون من العديد من الزهرات؛ استثمارات بلغيكية في الخضار البيضاء.
    info: |-
      الكرنب الأبيض هو نبات يشبه البروكلي ويُعرف علميًا باسم Brassica oleracea var. botrytis
      لونه الأبيض يحدث لأن أوراق النبتة تحميه من الشمس، مما يمنع إنتاج الكلوروفيل.
      توجد أيضًا أنواع بنفسجية وأخرى برتقالية وخضراء.
  veg.celeriac:
    label: كريفس كتوفي
    summary: جذر أبيض كبير على شكل كرة؛ أساس السلطات.
    info: الكرفس الكتاني هو نوع من الكرفس يُزرع لجذره، ويتميز برائحة وطعم قويين للكرفس. يستخدم كأساس في صنع الصلصات والسلطات مثل سلطة الكرفس (ريمولاد)، وفي الأطباق المشوية.
  veg.celery:
    label: الريحان
    summary: خضار أخضر كريش مع رائحة قوية.
    info: يُعتقد أن الريحان المقرمش يحرق أكثر سعرات حرارية مما يقدمها، لكن لم تثبت هذه الفكرة علمياً؛ وهو مكون أساسي في ثلاثية الطهي الفرنسي 'ميريبوا' التي تتضمن البصل والجزر ورقائق الخضراء.
  veg.chard:
    label: '"مانجولد"'
    summary: نباتي لون زاهٍ بالأوراق ذات السيقان المتعددة اللون.
    info: '{"hint":"خضروات أوراقية كبيرة وملونة مع سيقان حمراء أو قوسain المطر (بيتا فولجاريس)","info":"المانغولد هو نبات من نفس العائلة مثل الجزر الأحمر، ويوجد بألوان خضراء وأخرى حمراء وصفراء أو متعددة الألوان. وهو غني بفيتامين ك وفيتامين أي وفيتامين ج والمعادن كالبوتاسيوم والمغنيسيوم. كان يُزارع تقليديًا في التشيك؛ لكنه الآن عائد إلى مطاعم الطعام الحديث."}'
  veg.chickpeas:
    label: حمصة
    summary: حبة بيضاء دائرية؛ أساس صلصة الهوموس والفلافل.
    info: الحمص (Cicer arietinum) هي حبوب لُقمة شائعة في الشرق الأوسط وجنوبي آسيا. تستخدم كقاعدة للحummus والfalafel، وهي غنية بالبروتين النباتي وتكون جزءًا من النظام الغذائي الريفي أو نباتيّ الأصل. ماء الحمص 'أكوا فابا' يحل محل بياض البيضة عند الخَبْز.
  veg.chili:
    label: فلفل
    summary: فلفل أحمر أو أخضر يحتوى على مذاق مشتعل وهو أساس المطاعم النكهية.
    info: 'فلفل الحار (الكابسيوم أننويوم وغيرها) هو نوع حاد من الفليفلة، وتحمّله الكافيين؛ ويُقاس بدرجات سكوبله (الفلافيتو: ما بين ٢٥٠٠ إلى ٨٠٠٠ نقطة شو، فريس كاريولينا: أكثر من مليوني نقطة). تؤدي الوظيفة التطورية للكايبسين في طرد الثدييات وليس الطيور التي تسهم في نشر البذور.'
  veg.corn:
    label: ذرة
    summary: خضروات صفراء تحتوي على صفوف من الحبوب العصير.
    info: تُزرع الذرة الصفراء في أمريكا الوسطى، وهي اليوم واحدة من المحاصيل الزراعية الأكثر زراعةً. تحتوي حبوبها على كربوهيدرات وبروتينات وفيتامينات من مجموعة ب.
  veg.cucumber:
    label: خيار
    summary: خضروات خضراء طويلة ذات لب مبرد وعصير.
    info: الخيار الطويل هو نبات من الفصيلة القرعية المداري. يحتوي على نسبة تصل إلى 95% من الماء، وهو طازج ويُستخدم بكثرة في السلطات أو كوجبة خفيفة.
  veg.eggplant:
    label: ليله
    summary: نبات خضراء بنفسجي غامق الشكل دائمة الاستخدام الأساسية لمأكولات كموسىكا
    info: '{"hint":"خضروات بنفسجية داكنة ممدودة (سولانوم مايلونغينا)، تُعرف أيضًا باسم Aubergine","info": "الباذنجان أو ليلة النجم (سولانوم مايلونجا) ينتمي إلى الهند؛ ويزرع منذ آلاف السنين\nفي إيطاليا، يسمى الملانزانو، وفي فرنسا أوبيرجين،而在 الولايات المتحدة الأمريكية بيضة نبات\nويحتوي على أناسورين وهو مضاد للأكسدة قوي في القشر الداكن\nهو أساس الطهي المتوسط والشرق الأوسط مثل موسياكا وباباغانوش وكوسكوجريلا"}'
  veg.endive:
    label: شيكونا
    summary: نوع خفيف من الخضار الورقيّة ذو مذاق مر؛ يستخدم كأساس للسلطة.
    info: الخضروات الورقية البيضاء ذات الطعم المر تُنتج عن زراعة نبات الشيكوريوم في ظلام أو بدون أشعة الشمس، مثل شيكورية بلجيكا المعروف بـ 'ويتلووف'. يسبب حموضة إنطيبين طعمه المرة التي يمكن أن تنخفض من خلال التبييض.
  veg.fennel:
    label: الفنيكل
    summary: بصلة بيضاء ذات أطراف شعرية ولها نكهة حلاوة مشابة لرائحة عشبة الانيس.
    info: الفنيلكول أو الفينيقس يحتوي على طعم حلو مشابه للأنيس بسبب مادة الأنيثول، ويُستخدم جذره وبراعمه وأوراقه المفرومة في الطهي كجزء أساسي من الطبخ الإيطالي المتوسطي مثل الـ'بيستو' والسلطات والأطباق المشوية. كما أن بذور الفنيلكول تُعتبر بهارًا وتُستخدم أيضًا كمقوية هضمية خاصةً في الأطعمة الآسيوية والإيطالية.
  veg.garlic:
    label: ثوم
    summary: رأس أبيض حار ذو رائحة قوية، يُستخدم كأساس للنكهة في العديد من الأطباق.
    info: يتم استخدام الثوم المزروع منذ آلاف السنين في المطابخ ليس فقط كتوابل بل أيضًا كدواء. أنه يحتوي على مادة الاليسين التي تمتلك خصائص مضادة للبكتيريا ومضادة للالتهاب.
  veg.ginger:
    label: زنجبيل
    summary: جذرة بيضاء كريمية ذات طعم حار وجافر.
    info: الزنجبيل هو جذر نبات ينتمي إلى آسيا الاستوائية، ويحتوي على مادة تُسمى الجينجرول وهي المسؤولة عن الشعور بالحرقان والخصائص المضادة للالتهابات. أظهرت الدراسات فاعلية الزنجبيل في معالجة الغثيان وآلام الجهاز الهضمي.
  veg.green_beans:
    label: فلافل
    summary: فصوص طويلة خضراء ناعمة؛ تؤخذ قبل أن تنضج.
    info: يتم حصاد لُصَق الفول الأخضر غير الناضجة، وتسمى أيضًا باسم فاصولياء باريس أو فلفل أخضر طويل أو فواكه صغيرة من نوع البوببي. تحتوي على فيتامينات سي وكي والكثير من الأحماض الأمينية الدهنية مثل الكافيين.
  veg.kale:
    label: كابوستا مُعَجِّل
    summary: نوع خضراوات بلورية ذات أوراق زرقاء داكنة؛ طعام فائق.
    info: الكرنب الموجوع هو نبات أخضر غني بالعناصر الغذائية من نوع Brassica oleracea var. سابلليكا، وهو مصدر جيد لفيتامينات ك ود وك والمضادات الأكسدة. في العقدة ٢٠١٠ أصبح الكرنب رمزًا للطعام الصحي والمثالي بين النباتيين ومروحي الصحة.
  veg.kohlrabi:
    label: '"كرنب أسطواني"'
    summary: '"خضار بجذرة دائرية الشكل على السيقان؛ ذا علاقة بالكabbage."'
    info: '{"hint":"فانوس أزرق مخضر على الساق؛ ساق نبات الكabbage العائلي (براسيكا أوليراسي)","info":"الكرنب الأسطواني (براسيكا أواليروسيس غونغيلوديس) هو خضراوات ذو صلة بالكabbage\nيُؤكل الجذع والورقة \nلها طعم لطيف حلو وناعم ؛ نيئًا ومسلوقاً \nاسم مشتق من اللغة الألمانية : كاهل= الكرنب، رابي= جذر \nهو شائع في الهند وألمانيا والمجر."}'
  veg.leek:
    label: '"سبانخي"'
    summary: نبات كبير معتدل من العائلة الفلفلية؛ يستخدم أساساً للحساء والعصائر.
    info: "{\"hint\":\"خضروات من عائلة الثوم الكبيرة المعتدلة (الكليوم أمبيلوبراسون)\",\"info\":\"يُعتبر البصل الأحمر أو السبانخ (Allyum Ampeloprasum) قريبًا من الثوم والخردل،\r\nوهو رمز وطنى لويلز؛ حيث يرتديه الويلزيون في يوم القديس ديفيد\r\nويحتوى على ألينسين وفيتامين كـجاء جـ.\r\nوصفات شوربة الباكور هي تقليدية فى الطبخ البريطانى والفранسى والتشارى.\"}"
  veg.lentils:
    label: عدس
    summary: حبات صغيرة مستديرة تشبه القرص وهي مصدر رئيسي للبروتين الغذائي النباتي.
    info: العدس هو أحد أقدم أنواع الحبوب البقولية؛ يُزرع منذ أكثر من عشرة آلاف عام، ويوجد بسلالتين حمراء وخضراء وبنيّة وكهيئة بلوجا سوداء اللون. يمكن طبخ العدس دون غليان لمدة تتراوح بين عشرين إلى ثلاثين دقيقة وهو أسهل في الطهي مقارنة بالفاصولياء.
  veg.lettuce:
    label: خس
    summary: نبات أخضر كريش يدخل أساسًا في تحضير السلطات.
    info: يُزرع خس الرأس منذ العصور القديمة في مصر، ويتكون من أكثر من ٩٥٪ ماء؛ وهو نوع نباتات ذات سعر حراري قليل. يوجد منه العديد من الأصناف مثل الثلج والرومان ولولو وبترهيد وأوراق الجوز.
  veg.lotus_root:
    label: جذرة النيلوبما
    summary: قطعة تقطعها من الجذور الطويلة للنيلوبما مع الثقوب؛ يستخدم كطبق رئيسي في الطعام الآسيوي.
    info: جذع اللوتس الأرضي هو جذر نبات لوتس مقدس يُستخدم في المطاعم الآسيوية مثل الصينية واليابانية والإندونيسية، ويحتوي على ثقوب منتظمة عند قصه عرضياً. كما أنه غني بفيتامينات سي وبي6 وفيتامين البوتاسيوم ويمتلك تركيباً طرياً.
  veg.mushroom:
    label: فطر
    summary: فطر بني فاتح ذو قبعة مستخدمة في المطبخ.
    info: الفطر الدوائي هو الفطر الأكثر زراعةً في العالم. غني بالبروتينات وفيتامينات الـ B والمعادن؛ ويُستخدم في عدد لا يُحصى من الأطعمة.
  veg.okra:
    label: قرونبيا
    summary: حبوب خضراء ذات حوافة متعرجة ولمسة قشرتها سلسة جداً وتستخدم كأساس للطبق الشهير جومب.
    info: القرنابيا أو الموز الصيني تأتي من إفريقيا الاستوائية، وهي مكون أساسي في طبق الجومبو الأمريكي؛ حيث تعطي القوام اللزج للكريمات والصلصات. كما أن شرائحها العرضية على هيئة نجمة وتحتوي نسبة عالية من الألياف الغذائية وفيتامين سي وك والفولات.
  veg.onion:
    label: ثوم
    summary: نوع من الخضروات العطرية المكونة من طبقات تُستخدم في توابل الأطعمة.
    info: الثوم هو أحد أكثر الخضروات زراعةً في العالم، ويتم استخدامه لتوابل الطعام حول العالم؛ كما أنه يحتوي على فلافونويدات ذات آثار مضادة للبكتيريا.
  veg.parsley:
    label: ' parsley'
    summary: عشبة خضرا ة فاتحة اللون تُستعمل كزينة أو توابل.
    info: البقدونس هو نبات عشبة خضراء فاتحة تُستخدم بكثرة كتوابل وكمكون زخرفي في الأطباق، كما أنه يحتوي على نسبة أعلى من الفيتامين سي مقارنة بالأبرص البرتقالية حسب الوزن. هناك نوعان منه؛ أحدهما ذو أوراق مستوية والآخر متعرج الشكل، ويتم التفضيل بين الطهاة للشكل المستقيم بسبب طعمه القوي.
  veg.parsnip:
    label: _pastinak_
    summary: جذر أبيض مُكرِمٍ؛ وهو نوع قديم من الخضار الأساسية لأوروبا.
    info: الباستيناكا هو نبات خضروي من عائلة الجزر، يشبه إلى حد ما الجذور البيضاء الطويلة المدببة.( Pastinaca ساتيفا). كان هذا النبات مصدر غذاء أساسي في أوروبا قبل ظهور البطاطس؛ الآن أصبح أقل شيوعًا. له طعم حلو وقشري كريمي اللون.
  veg.peas:
    label: فاصولياء
    summary: حبات خضروات صغيرة داكنة اللون داخل الغلاف؛ رمز لفصل الربيع والرقة.
    info: الفول الأخضر هو نبات حبوب يُزرع منذ العصور القديمة، وقام غregor ميندل بدراسة الفول في تجاربه حول الوراثة من عامي ١٨٥٦ إلى ١٨٧٣. يمكن أكل قشر فول الثلج كاملاً بينما يكون فول السكر أكثر طراوة.
  veg.pepper:
    label: فلفل بابريكا
    summary: خضروات لامعة ذات طعم حلو أو مالح.
    info: الفلفل البابريكا السنوي يتوفر في أنواع حلوة وساخرة. تحتوي الفلفكات الحمراء على أعلى نسبة من فيتامين سي بين جميع أنواع الخضروات.
  veg.potato:
    label: بطاطس
    summary: جذر أرضي مُحْمَر يُستخدم كعنصر أساسي في العديد من الأطباق حول العالم.
    info: البطاطس تأتي من جبال الأنديز في أمريكا الجنوبية وهي واحدة من المحاصيل الزراعية الأكثر أهمية في العالم. إنها مصدر للنشويات وفيتامين سي والبوتاسيوم.
  veg.pumpkin:
    label: '"كيوا"'
    summary: ثمرة كبيرة شبه دائرية اللون الأحمر؛ رمز لعيد الهالوزيين وللطبخ الصيفي.
    info: '{"hint":"كوساً كبيرٌ أصفر دائري الشكل (من نوع كوكوربيتا ماكسما أو بيبو)","info":"تُنتج الكيويات من أمريكا، وهي غنية بالكاروتين والفيتامينات "A" و"C". تعود تقليد صناعة التماثيل في عيد المخابرات إلى إيرلندا. إن حبوب زيت الخضروات مصدر ممتاز للزنك والمغنيسيوم والبروتين النباتي."}'
  veg.radish:
    label: -radish
    summary: جذر صغير مقرمش أصفر؛ طبق خفيف ومغذا.
    info: الخرشوف الأحمر هو نبات سريع النمو ينتمي إلى عائلة الخرشافيات، وله جذور صغيرة حلوة اللون أحمر أو أبيض تُستخدم كخضار في الطهي.
  veg.spinach:
    label: سبنكس
    summary: نبات خضروي لحموي أغمق وأغنى بالنحاس.
    info: |-
      السبانخ هو نبات أخضر غني بفيتامينات ك، أيه، سي، وال엽وفور وحديد موجود منذ العصور الوسطى في بلاد فارس.
      popeye البحّارة الكاريكاتيرية دعا إلى السبانخ على أنه طعام ممتاز للأطفال من ثلاثينيات القرن الماضي.
      طهي السبناش يطلق حمض الأوكزاليك الذي يمكن أن يتصل بال كالسيوم والحديد.
  veg.spring_onion:
    label: بصل مقطوف صغير
    summary: نوع من البصل الرفيع ذو القاعدة البيضاء والأعناق الخضراء؛ يستخدم إضافته إلى السلطة
    info: |-
      البصل الأخضر هو نبات بصلة طويل ورفيع مع قاعدة بيضاء وأغصان خضرا، ويُحصد قبل النمو الكامل
      وهو أرق ولا يحتوي على رائحة أو طعم حار مثل البصل العادي
      يستخدم في المطبخ الآسيوي كزينة للطعام وفي السلطات والحساء
  veg.squash:
    label: كارنب
    summary: خضروات شتوية متنوعة الأشكال؛ عنصر أساسي في المطبخ الخريفي.
    info: "{\"hint\":\"melons الشتاء متعددة الأشكال (نوع الكوكوبيتا)\",\"info\":\"تعمل كرنبة الشتاء (كاكوبيتا) على توليد قشر صلب يحميها لأشهر عديدة؛ يمكن تخزينها طوال فصل الشتاء.\r\nإنها غنية بفيتامينات أ، ج ومضمون بي.\r\nلديها أهمية كبيرة في نظام الغذاء الهندي الثلاثي من الذرة والبازلاء والكرنب.\"}"
  veg.swede:
    label: توروتن
    summary: خضروات جذرية كبيرة البنفسجي والأصفر المائل إلى الأرجواني وهي مرافقة لطبق الهاغيس الاسكودي.
    info: التوتين هو عبارة عن تهجين بين الكرنب والبنجر، ويُعرف في أمريكا باسم روتاباجا؛ وفي اسكتلندا يرتبط بشكل لا يتجزأ مع هاغيس. له طعم حلو ومر من النوع اللطيف بعد الطهي.
  veg.sweet_potato:
    label: البطاطا الحلوة
    summary: جذر حلو بلون البرتقاني غير تقليدي لل بطاطس المُستخرج من المناطق الجافة
    info: |-
      يأتي البطاطا الحلوة من أمريكا الجنوبية؛ ولا علاقة له نباتياً بالبطاطس العادية
      وهو غني بمضاد أكسدة البيتا كاروتين، وفيتامينات الأ و سي والألياف الغذائية
      لون لبها البرتقالي يعود إلى محتواه العالي من البيتاكاروتين
  veg.taro:
    label: كاروت
    summary: حبيبات نشوية كبيرة ذات بقع بنفسجي ؛ مصدر غذائي أساسي للمزارعين.
    info: '{"hint":"كُتوم كبير مغذٍّ أرجواني اللون يحتوي على النشا"، "info": "يتم زراعة الكاسيا الصالحة للأكل منذ آلاف السنين في المناطق المدارية؛ وهي غذاء أساسي للجزر المتعددة والسودان وآسيا؛ ويصنع من الجزر الهواييان ''poi'' وهو كعكة تشبه المعجون يتم تخميرها. وللكراث طعم خفيف مثل البندق، وتظهر علامات بنفسجية داخل لحمه بشكل رمزي بصريًا. كما أن الكراث الخام تحتوي على حمض الأوكزاليتيك الذي قد يتسبب بالحرقة، لذلك يجب إعداد الطعام جيداً."}'
  veg.tomato:
    label: طماطم
    summary: ثمرة حمراء دائرية تُستخدم كخضروات.
    info: الطماطم نباتياً هي ثمرة (كبسولة)، لكن في المطبخ تُستخدم كخضروات. أصلها من أمريكا الجنوبية، وتحتوي على الليكوبين وفيتامين سي.
  veg.turnip:
    label: водница
    summary: نبات كرموبي فروضي بلون الأبيض والفلكوي؛ طعام قديم شائع بأوسط أوروڤا.
    info: |-
      البليتيسا هي نبات جذري أبيض إلى أرجواني يشبه الجزر، وتعود لعائلة النباتات Brassica رابا.
      كانت مصدراً غذائياً أساسياً في أوروبا قبل ظهور البطاطس من أمريكا الغربية.
      تحتوي على الفيتامين سي والكالسيوم والألياف؛ كما أنها بديل للحوم في النظام الغذائي الغيتوانحي.
  veg.watercress:
    label: '"ريزيكا المياه"'
    summary: '"عشب نبات صغير منخفض اللون الأخضر الداكن يعيش على أنهار المياه."'
    info: |-
      {"hint":"نبات مائي عشبة خضراء داكنة صغيرة حارة (ناستورتيوم أوفيسينالس)","info":"تُزرع الريحان المائي (نيستروتيوم أوسيفنسيل) في الأنهار والأنهار الصغيرة الباردة والمصادر.
      لها طعم مشابك وحار بسبب جليكوزيد السينيجرلين.
      وهي غنية بفيتامين سي، كيتون، وبتاكاروتين.
      إنها زينة تقليدية للساندويتش البريطاني؛ وهي أيضًا سلوطة فرنسية."}
  veg.yam:
    label: جام
    summary: جذر مطبوخ كبير غني بعنصر النشا يوجد بشكل خاص في المناقل الاستوائية.
    info: يُعرف الجام أو الحلوة الكبيرة بأنه جذع شتوي غني بالنشا ينتمي إلى نباتات نوع Dioscoreya ويوجد في المناطق المدارية من إفريقيا وآسيا والكاريبي، وهو مختلف عن البطاطا الشهِّيت؛ إذ إنه أكثر قساوةً وأكثر احتواؤًا للنشا وليس حلاويًا مثلها. يمكن أن يصل وزنه حتى ٧٠ كجم، كما أنه مصدر رئيسي للفطور في منطقة إفريقيا الجنوبية للمتوسط الأبيض حيث تنتج هذه المنطقة مايقرب الـ%٩٥من الإنتاج العالمي.
  veg.zucchini:
    label: '"كوزيتا"'
    summary: خيار صغير طويل الأخضر هو نبات طعام متعدد الاستخدامات يمكن إعداده بالطهي أو الخبز.
    info: '{"info":"كوزيتا (قُثْمَة بيبو)، هي نوع من التفاحات الصيفية يتم حصادها قبل النضج الكامل وطولها بين سبعة إلى خمسة والعشرين سنتمترًا، ويصل محتواها المائي أكثر من百分之 ninety percent وهي قليلة السعرات الحرارية. تأتي أصلاً من المكسيك؛ وقد شاع استخدامها في أوروبا على يد الإيطاليين. كما أنها موضوع دراسة كعنصر استبدال المعجنات مثل ''زودل'' لحميات لا تحتوي على الغلوتين."}'
