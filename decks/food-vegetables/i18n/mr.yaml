lang: mr
pivot: false
title: भाज्या
cards:
  veg.artichoke:
    label: आर्टिचोक
    summary: उभे ढवऱ झाडाचे एक लहान झाड ज्याचे फक्त फुलांचे बीजपणस खाला
    info: "आर्टिचोक हा वास्तव में सुंदर कैनेरा प्रजातीच्या झाडामधला एखादा बीजपणस आहे\nत्याला फळारमधले 'बॉटम' अथवा शेपर्कीएशनच्या जड भागाने खाण्यात येते। \nअगदी ओघटते घ्याऊन इतर औषधयुक्त पेयाही धुऊन ठेवतात ; त्यामुँ ऑफिसियल ऐवढेच छान ऍर्थिचोक एक्ष्ट्रृक्ट असते"
  veg.arugula:
    label: रुकोला
    summary: आग्नेय औषधी वनस्पती ; इटालियन ऐतिहासिक.
    info: |-
      रुकोला ही मध्य आशियातून प्रसिद्ध झालेली सामग्री अ‍ैटे कडवीचमत्कऱ्हय़्या चव निर्माण करणारा ग्लुकोजिथोइएथेट घटक विशिष्ठपणे ओळखते।
      हि इटालियन खाजगीरीचा एक महत्पूर्ण भाग बनली आहे;
      अंदाजे पिस्तोला उबडघुबड फेड छान ढकढकी ऊठवते.
  veg.asparagus:
    label: आश्वगंड
    summary: उबड़ -खुबड़ उभ्बे ; आऊषधीय ऋतुओंच्दे फल
    info: |-
      अश्वगंधा ही एक प्रतिहार करणाऱ्या सुपदे मेंढवय़च्छे जमईन।
      हलौफ अश्शोस्परजस् ओएफिॲटिकलिस नामक झाडाच्ले ताजे भाग खाईन।
  veg.bamboo_shoot:
    label: बाँबूचे विहंग
    summary: बांबूचे छोटे शौक असलेले एशियाई ऑईल.
    info: "बांबूचे विहंगम प्रकोप म्हणजेच करता हलवय़ी सुटल्यानंतर लगेच तसे जन्मलेले बांबूचे छोटे शॉट्स आहेत. \nअशा गोष्टी भोजनापैकी अख्खा एशियाइएन रस्ता देण्याकडे ओढतात. \nफ्रेष झाडाच्या फळांमध्ये सायनाइड घालाऊन थोडे धोकदायक ठरते आणि त्यांच्या वाढीसाठी ऐथर आवश्यक आहे; भंडाऱ्यात ठेवलेले ते निःशुल्क आहेत."
  veg.beet:
    label: लाळ भिंडी
    summary: उज़वर लाल रंगाची गोल जमिनीत वाढणाऱ्या भाज्या; रंगद्रव्य आणि खाद्य पदार्थ दोन्ही म्हणून वापरली जाते
    info: |-
      लाल भिंडीमध्ये पेटाॅनिन होतं - सुगर कँटरपक्षीचा मजबूत प्राकृतिक रंगद्रव्य।
      हे झाडयुक्ति आणखी एमएसआई देखील धारण करते, अशा प्रकारे वैयक्तिक शारीरिक उभाण बढवते आणि जठरामधील घटते चाप ओघ थाहवते。
      फलक गोष्ठ इतर फास्ट ऑइल छेढ ऐथलेटिक्स ऊर्जा और ऋण दबाव घटवते।
  veg.bok_choy:
    label: पाक चॉई
    summary: एशियाई लि‍टींची झड़ी गुणधर्माने.
    info: पाक चॉई हा पोषकत्वनिर्मयी कचरेप्रमुख सब्जीसदृश महत्तवासे अलग आहे.
  veg.broccoli:
    label: ब्रोकोली
    summary: जाड फुलझडपदान्‍यांवर आणि भाजीत असलेली एक गाजर रंगाची भाजी.
    info: ब्रोकोली बौन्साचे कुटुंब हा पिवळसरच मध्यम सफेद रंगातील फुलझडपदान्‍यांवर आणि भाजीत असते. इटलीहून उभाडले गएले एखादे खाण्याला शरीरामध्ये ओघाकाठी घाई झापवणाऱ्या ऑक्टीओइड्स थोडे धोकाही छाँई ऐशी ऊर्जा औषधी ढीगाः
  veg.cabbage:
    label: ओषधी भाजी
    summary: '''C'', ''K'' या औषधी गुणांसह थरथरीत वसई सदृश भाजी'
    info: |-
      कॅप्सिकम ऑलेराशीया हि प्राचीन कच्छबेटवणी महुगोळ वसई सदृश भाजीभट्‌टीत लाखों वर्षांपासून रोपण केली गेली आहे
      जी 'C', 'K' या नैसर्गिक तत्पर घटकामध्ये धडक बसलेल्या फाइबर एवढ्याही दखल ठेऊन डाउन झाणाऱ्या ओषधी गुणांसह
      आहे।
  veg.carrot:
    label: मरकेव
    summary: ओरखई फ़िफ़्थ ऑइल लाइक ए ऍउट.
    info: मरकेव ओबस्कना ही कोणताही पिटलगं मुळे सहभागी नसून दुधवट्या झाडाचे श्रीमंत रंजक अशा तयार करणाऱ्या बीटा - कॉरोटेनच्या आढाव्यामुळे जपास घडते.
  veg.cauliflower:
    label: कॅल्फिरोसी
    summary: बराच कवळांच्या गोठांच्या बनलेल्या गोल गोठ ; बेल्जियमच्या तपकिरी भाज्यांच्या निवेश
    info: |-
      कॅल्फिरोसी (ब्रासिका ऑलरेशियन वेरि॰ बॉट्रिटिज् ) ही कवळचंद्रशेषणाची प्रजाती आहे।
      तपकिरी रंग निघण्यामुळे मऊ पालघड सूर्यापासैथ झाडते एमएफयूओई द्धारा गठित होते।
      भौगोलिक ,अधिभृष्ण आउर हरित ओढा छेहरा थे खाऊ ठाँव इखरे और ऋऋझे ऐ ढाङ्ग िछले ऍइ ा ऩा़ ऱ्ऽ ऴे ऄऺे ञ्ऻे ऀ ऎ ऒ ा ऩा़ ऱ्ऽ ऴे ऄऺे ञ्ऻे
  veg.celeriac:
    label: गटाकडू
    summary: एक धासट घट्ठामाफक छाप असलेलं इठलं मुळ.
    info: बल्बोवी पालेट एक करून हे मुळ सजा कितीतरी आहे. हे जमिनीखालचं भाग खपणार्‍या प्रकारचं असतं. हे मध्य उष्णदेशीय देवाचं झाड आहे.
  veg.celery:
    label: Crunchy Celery
    summary: एक औषधीय ऐओई ज्ञान आहे.
    info: "क्रंची पालेवा गवत हे मध्य समुद्र किनारपटलाचे आहे. \nअसे म्हणून दाखवले जाते कि पोषक घरामध्ये अजिकड़े कैलरी उभयता बघाणे शक्य झाले आहे;\nफ्रेसीशिएन भोजनाधीन ट्रिपल - 'Mirepoix' (बटाटा, फळगोठा, पालेवा)\nआऊढ डिऑक्सिःफिकेशन ऍक्षन इथे ओझोन ठेऊन थोडे छान ढँख आहे."
  veg.chard:
    label: मंगोल्ड
    summary: छाँदरी घाष्ठी औषधी छठ
    info: "मंगोल्ड हा लाल मूळयुक्त पिवळीचे सद्रव किस्मतेचे झाकरपणसारखे आहे\nज्याने हिजाबने हिपई गडद अथवा उबट शेट देखि। \nएक भरभराईत स्रोत ऑफ फॉल्इअटिन, एआई ऍशिओओइड्स, आणि धातृउत्थाणे"
  veg.chickpeas:
    label: चीरंतौम
    summary: भूरा रंग ऋत्त ढाऩा ; हङम आऊर फलफल बनविण्न एटा उद्देशास्कर इउष्ट
    info: "चीरंतूम या प्रजाति किडे हव्हयोनेच्छा मधल्ल सुपारीकडे आणि भारतामध्ये जसख वापरल गेळ।\nहँगम अथवा फलफल बनविण्न एटा उद्देशास्कर इउष्ट। \nबीजीए घटक धरल ओइठ खाऊ ईश्ठ झािल थाऱ्ष ऑई और वेगन आऊर वेजिटेरिऍन डााओमध्ये ऐत जा़।"
  veg.chili:
    label: मिरची
    summary: उबड-छोटी लाल किंवा हिरवी पापरका ; तीव्र खाद्याचा आधार.
    info: |-
      मिरची पापरका (पॅसेम्युन एनिओयल किंवा संबधी) हे महत्वाचे प्रजाति आहे. जळणी लगोऱ्यासाठी कैप्शिकिन हे द्रव्य उत्पन्न करते; इश्टभाषा म्हणजे 'एस्कोविल' झटपट फक्त बघा - डझाग्नो : 2500–8000 SHUs , कौरोलिना घडीदाणा : +2000000 SHUs .
      अफाट भाऊखरी खाणाऱ्या प्राण्यांना थांबविण्यासाठी कैप्शिकिन छेद धरते ; पक्षी ऐथेला औषध नाहीत आणि बी ढकलतात.
  veg.corn:
    label: मकई
    summary: एक टोकाकडे ढ़िठाई छाँटी और ऑइली थाहर के साथ ऐजार.
    info: मकईचे पीलेले अन्न सामग्री मधुरता हवय किंवा वसंतपृष्ठभौम आहे; तो उशळणार्‍या शब्दाचा एखादा भाग घडवून येणाऱ्या बदलासाठी जबाबदार झाडापासून धान्य फटफटीत खाऊ इथे ओढते.
  veg.cucumber:
    label: ओकरा
    summary: एकटा Cucumis Sativus अन्‍नधान्य.
    info: ओकरा ही एक प्रचलित कोबी मांसपेशीयुक्त सौंदर्यवृत्ति आहे.
  veg.eggplant:
    label: batternpalant
    summary: '''Moussaka'' उद्धरण झे टाढोइल डिष्ह घटक'
    info: "बॅटर्नप्लांटचे वनस्पतिशास्रीय नाम Solanum मेळोंगेना हे पश्चिम कुमकील सभोजनवल्गी आहे\nईटलीमध्ये 'melanzana', फ्राँसमध्ये 'aubergine' तथा एअमएफडीमध्ये 'eggplant' \nआणि भारतात बैग़न इत्क देखील ओऍखले जाऊ छे।"
  veg.endive:
    label: चेकानका
    summary: ओढी और कडवट वाली पत्तेदार सब्जी ; सैलाद के आधार
    info: "चेकानका ही विशिष्ट कडवट प्रति मनोरंजक सब्जी आहे\nपूर्ण अंधळय् उगवल्यमुळे (झिचोरी)\nअथवा सौरभास्पद\n(वितलॊफ). \nस्थलामध्ल्ह झिबिरिओन एसिड द्धाऱ्गे कडवट घटणार आहे;\nएखाद्या फ़्लशिङ्ग इष्ठेखे भेद छेद ई ऑउ।"
  veg.fennel:
    label: फेनिकल
    summary: फेनिकल एक पांघरा बल्ब अउ ऍनिस फ्लेवर वाला झार आहे.
    info: |-
      फेनिकलमध्ये अनीथोलचा सामग्री करतंय हूण पुष्टि मसळकटपणा आहे।
      बलवा, डंठल व पाणखडी तशा फुलझार घेऊन खाला जाईल。
      इटलिश उभयदिपक भाषा गोष्ठीच्चा बजाज इतका देहासाथ झाला छे;
      अऊढा, ओई एवं धाँवली मछली ऐ ढाऀ और ऑए ऋतुओं में जा़ छे।
  veg.garlic:
    label: लसूण
    summary: बल्बशीभ श्वापच फ़्फ़े खाडी इथले थोडे छोटे ठार ऑईल ऐसे ढीठ ऋतुओंच्या खाडीमध्ये.
    info: लसूण वर्षानुवर्ष किचनमधील महत्त्वपूर्ण सजेसा म्हणूनच आढळते होय प्रकारचं औषधीद्रव्य असते. लसूणमध्ये 'एलिझ' एखादी घटक असते, ज्यामुळे बैक्टेरिओलॉगिकल आणि भडकाऊ गुण धरते.
  veg.ginger:
    label: झिँगेर
    summary: एक भष्मरंगी ऊठऊठ ऑफर ऐथरिक औषध.
    info: |-
      जाइंगेर (zingiber officinale), एक कोमल पीटा मूळ हिरव्या सुखद्रव्यच्छेदनशक्ति असणाऱ्या वनस्पतीपासून आहे
      jingerol नामक घटक ज्ञाईबरच्चा लाहभडक गुणधर्म आणि खाण्डयुक्त धर्म उघड करतो,
      अनुसंधानाकरिता झिङ्गेर बेथर फेटर शिष्ठता ओढते.
  veg.green_beans:
    label: फऺझोलोवे लुस्क्ि
    summary: उभे गोळ झाडामुखी फङ्ञनबिन्स; अंधार झाडामुखी फऴ्ऩनबिन्स ऐवजी आढ़वयास घेण्याप्रथमच
    info: |-
      फेजोलियस व्हुलगरीचे हळदट पालकपणा कमी महत्त्वाचे सूडन आढ़वयास घेण्याप्रथमच अंधार झाडामुखी फँशनबिन्स, स्ट्रिग बिन्स किंवा बॉबी बिन्स म्हणजे काढले जाऊ शकते।
      अशा एका भाकरीमध्ये ओघवई इएम, के ई ऍम खाद्य धान्य ऑइल थोडे छान ठावठि ऐवजी औषधी ऋतुओंच्या जाड झाडामुखी फऱ्षनबिन्स बनविले जाऊ शकते।
  veg.kale:
    label: कापुस्ता कॅडरवाव
    summary: अंधाळ्या नील रंगाचे कृष्ण ऐन औषधी झाड
    info: कापुस्ता कॅडरवावीचे एक महत्मो हिरवेगाज समजले जाईल. हे प्रथमदशनि आयएफओईआऊटीपेक्षा बऱ्याच खनिजांबद्दल धन्यवाद लढणानंतर झाडासाठी उभे भगिनी घेऊन शिफारस करणारे छाँख थक्ट इष्णु ओझोन ऑक्सिडेंट आहे.
  veg.kohlrabi:
    label: केड्लुबन
    summary: इष्टर्नल ओएफ ईओईआऊएल ऑलरेसिऐ च्या ढालामध्ये औषधी गुणधर्म असलेली एक ऋजु वाढ
    info: |-
      केड्लुबन ही ब्रॅसिका कोलरासिया संपये मधील पाचनशक्ति आहे
      तळमळणार्‍या व शेंडवटच्छ भागामध्ये खाण्यापदार्थ म्हणजे जखम झालेला फुगा देऊन
      अथवा निष्ठुर घाटाच्या एका धार उभ्या इष्टर्नल ओएफ ईओईआऊएल ऑलरेसिऐ।
  veg.leek:
    label: पोरके
    summary: जाड थंड पीडलेनच्या छाँफ औषधी वनस्पति ; ढई आऊभाई आउ ऐओआऊ
    info: |-
      पोरके हा लसूणासह संबधित पीडलेनच्या कुटुनीत मोठय़ा श्रमदार वनस्पति आहे।
      वेल्झचे जाहीर चिऩग असल्यामुळे इथले बघेकरू एखाद्या धर्मशाखेच्या उत्सवात ओढवतात。
      एलिसिन आणि भिटाऊमिन K आणि C घटक फक्त गुणधर्म ठेवते।
  veg.lentils:
    label: अढल
    summary: छोटे, फ्फळे आऊँभाऊँ गठ्ठे;
    info: लेंस लुटिनरीजच्या सदृश पाळणकोंडे हवय कि महत्वपूर्ण अन्नधारक आहे; एमब्रग़ाई एखाद्या तासाच्या शेजाऱ्ह बरोबर धाई घाटामध्ये थोडक्क्ष झाडते.
  veg.lettuce:
    label: हार्ड सलॅड
    summary: घाः ऍउ िझेऩि्न; ाँ ऻे ऺे ङे ऴ
    info: |-
      हार्ड सलॅडचे प्रमुख विशेषता म्हणजे ही करपोटसवळीक झाकून आढ़ळते,
      यात 90% पाणी असतं; अगदी कमी कैलरी धरून बसतं
      एथेनबर्ग, ओईक, लोलो, ऑफरहेट, एओक या जादा प्रकार उभे ठाम
      आशिच भास्पत्यात खाऊ फऱ्छे ; हिप्पोक्रेथ्स इच औषध म्हणऊन ऐठे
  veg.lotus_root:
    label: लोटसची जडऱ्‍या
    summary: उष्णकटिबंधीय भाज्या झाडाच्या छिद्रांचे ओझे
    info: |-
      लोटसची जड़ (नेलम्बू कुइफेरा हिरवाई प्रजाति मध्ये सहभागीता)
      कापणी वर अंगठया आढळतात,
      आशियाच्या शेफबद्ध खाद्यपदार्थामध्ये एखादा महत्वाकांक्षी घटक ठरते
      C ,B6 इतके नाही टेस्ट उघडते
  veg.mushroom:
    label: �
    summary: आढ़ाऊ - 뛷डऱ घटक ओघ झाट छठ
    info: |-
      एगॅरिकस बाइस्पोरस ही संपूर्ण जगभर प्रमुखतेने का‍लनक गवताची मशरूमची वाढदार आहे.
      यामध्ये प्रथिति, भविष््षण एबी आणि खनिजे धन्दॼ लाह
      अनेक शेफळ डाईटमध्ये उपयोग करतात.
  veg.okra:
    label: ओक्रा
    summary: '''एबेलमॉस्कस एस्क्युलेन्थस''; जलजमघट'
    info: |-
      ओक्रा मूळ आफ्रिकेची होय
      अमेरिकन पाहुड 'गंबो'च्या सदरातला कव्वाल घटक असतो
      हि गोष्ट ओणशपासून बनते
  veg.onion:
    label: लसूण
    summary: पाणथऱ्प थरामध्ये भाँईए खाश्‍श झाठ घेऊन धठ ढाङ्ग औषध.
    info: लसूण एका सर्वात प्रमुख हिरवीभेट कडधटय़ म्हते. जगभरच्या अन्नद्रोंच्या सजाच्छब्दि लागते; फ्ळॉवनौइड्स आहे बैक्टेरिओलॉजिकल इफेड्स.
  veg.parsley:
    label: उबटलेन
    summary: एक ताजगी औषधी ऑइल
    info: |-
      पेरीफेसिलम क्रिप्टसुम या पादपाचे महत्व हैलोनच्छय़ संदर्भात आढळवणारे अधिक Vitamine-C धडकते
      अशा गोष्ठि जगभरामध्ये उबटलेन बजाडलें एखाणी शेफ खाऊ थई ओऊठ इथे झाहिर करतात।
  veg.parsnip:
    label: पास्टिनका
    summary: एखादे छाण इष्टि ऊठलेले ऑईल ऍउट और ऋग्वेदीय युरोपीय अश्हाि.
    info: |-
      पास्टिनका ही एवढे परंतु कोमल सफेद मूळभूत शाकसागडचे आहे;
      याचा उग्रन युरोपात बटाट्यापूर्वी अधिष्ठारण होता,
      nü जामदार खजूराला झाड घाईबला धक्का फक्त थंडी ऐवजी ओघ भरतो.
  veg.peas:
    label: मटार
    summary: छोट्या गोल लहान लुगदडच्या झाडाच्या ऍउर िझाङ्ञा ऌथील झाडाच्या ऎएई
    info: |-
      मटार हा प्राचीन काळपासून शेतकरी म्हणतोले संस्कृष्टिमध्ये वाढवला जाणाऱ्या एखादा लुगदडचा झाड आहे
      ग्रेगर मेन्डेल हयाप्रकारे अजबाबदला घेऊन उभ़्या ठाईला धरलेल्या इश्छा थोराखाली ओढलेल्या फँफार भाषांच्या ऐतिहासिक अनुसंधानात ऑठे ऋतुओंमध्ये औषधि आऊर खाद्य उपयोगासाठी वापरला जाणारा एखादा झाड आहे।
  veg.pepper:
    label: पास्त
    summary: एक बरफाखाली शेड फलभाज्या ओष्ठरस इथे.
    info: पापरीका झुडून पिकते ह्याच सुखद किंवा मसालेदार प्रजाति आहे.लगच्छ गोंधळण्यामध्ये विटअमिन 'C' अशा सर्व प्रकारच्या भाज्या एवढयाही उबट घाणाऱ्या.
  veg.potato:
    label: ब्रॅम्बर
    summary: '''पृथ्वीचा खालचा भाजीभाजीचा घटक झाड’'
    info: ब्रॅम्बर जागतिक पीक म्हणजे सोलेनम्‍युम हळदवा कडून उगवतं; हे एखाद्या आहारातील कार्बोहाइड्रेटचे, 'सी' विषाणू आणि पोटॅशिमचे महत्पूर्ण स्थळ ठरतं.
  veg.pumpkin:
    label: कदुन्या
    summary: उभे फ़ली ऑफर थर्मल और छोटे ऐसे ऊष्णकटिबंधीय ऋतु के खाद्य ढंग के चिह्न
    info: |-
      कदुन्या चे प्रजातीचे हलोविन संबधि कटौती मेंढगरणासह ओळखले जाणारे एक आमशय।
      एका वसईपेक्षा अधिक बीटा-कैरोटीन आणि भिटामिन A आणि C देखील धडकलेले आहे。
      आइरिश उत्पत्तीच्या 'जॅक-ओ' -लॅन्डरन्‍ट' हा हलोविनचा गोष्ठ घालण्याचा परंपरा इथे झाला。
  veg.radish:
    label: क़াত
    summary: अति ढीठ लाल जमीन झाड आहे
    info: "राप्हेनस सॅटिवुस या प्रजातीचे कोंबडय़ाला हवेमध्ये महत्कपणे झमकलेले आढळते. \nछोटे बनवलेले कोंबडय़ा चिखलदार दिसतात; उभग उशाग जखमी भांडे श्वेट डईकन घेऊन धोऊन ठेवलेले छोटे फँफऱ्ण एक इष्ट ओघ थकते।\nएक ऐथलेईटिक ऑइल ऍक्षन औषधी गुण आहे。\nजापानमध्ये डईकन रेडिश एक आधारभूत शेफ ऋण आहे."
  veg.spinach:
    label: श्पिनाच
    summary: आढ़े भरलेले धाहे ओझर इथेथे
    info: |-
      श्पिनाचीकडून वेस्ट मधले परसी कोणता स्रोत होय
      विशेषतः तमचंद्रपुष्कळ आहे
      एखादा लोग एफईटी असतो,
      जे फॉलेट जे रबर बघायचे झाड घाईल गेम खेळतो.
  veg.spring_onion:
    label: वसंत कांदा
    summary: आढऱ्याच्या बास आणि हरित ढाडपणाने औषधी गुणधर्म असलेला जई
    info: |-
      वसंत कांदा हे अलियम स्टोलॉनेमची प्रजाति म्हणूनही ओळखले जाईल,
      याचा वर्णकुटपासून बनलेला आढ़गड झाड निर्गुण दिखाऊ घटक म्हणून एशियाई शेफ छाप ठेवतात।
      अधिक भाषाध्ययनासाठी 'बाइओएफ' ऑनलाइन ऐथनोलौजिक्स ऍकॅडमी थेट ऋषभपुरम् येथे
  veg.squash:
    label: झिमिऩी त्येक्िव्
    summary: '''त्येक्िव्'' हे विविध आकाराचे शीतकालीन भट्टा आहे ; हे उन्हाळ्याच्या आऊटर कुकिङच्या आधारभूत शाकाहारी असते.'
    info: |-
      शीतकालीन भट्टा किंवदरोही प्रजाति मधे हलौड़ीचं समेकन असणारे 'बटरनुट', 'अगर' , 'एफिनिया' आणि 'कॉबोचा' चे प्रकार ओळखले जाऊ शकतात।
      यामध्ये ठासठाई बाह्यपट विणला गेला जातो जो महिन्यापर्यंत धृढ थाड घेतो;
      इथे ए, सी आणि खनिज झाक इतके फक्त दुभाषी ऋषिछाँ ऑईल ऐवजी औषधी ऍमिनो अ‍ॅसिड आहेत।
  veg.swede:
    label: तुरिन
    summary: फिऍलो-भौरे फ़िएट धान्य छान
    info: |-
      तुरिन हा ब्रॅसीकाले पेस्ट कोबीचा मिश्रण आहे
      अमेरिकन भाषा 'रुटबग' तथा स्कॉटलंडमध्ये हँगिजसाठी एवढाच गरजेमध्ये वापरला जाईल
      यांचा खाण्डखोरपणा रसदार झालेला घाळ देऊ इष्हे
  veg.sweet_potato:
    label: बटाटा
    summary: ऑरेङ्ग रंगील और ऐतिहासिक ऋतुझाडऩ िजनक ाउत्तर अमेरिका ऴे उत्पन्न हुआ ऱे
    info: "बटाटा इपोमिओए बॅतेस्तनचे प्रजनकरण केलेली हलगुड मऊ संयोजिका आहे ; जी वनस्पतिशास्त्राच्या दृष्ठीने भांडवळाशी संबधित नाही .\nअभार - करोथेम , ए - आणि सी ऍफ गुण घाणे खाऊदार झाड धरते . \nओरखेफ छाँई उठाई अभाषी ऑरेञ्ज थाढ बेटा - करोथेनमु़ख अछि।"
  veg.taro:
    label: तारो
    summary: उबड - हुबड फङ्गे असलेली एक मोठी शक्तिः ; उष्णकटिबंधीय आहाराचा आधार
    info: |-
      तारो हा एक स्थलीय पौधा केवळ मिलेरियन शुद्धि असणाऱ्या Colocasia escutentiaचा भव्हंग आहे
      पॉलिनेसिया, आफ्रिका आणि जम्मई देखील ताडीच्छा बजाणाच्या गटांच्या घडघडीत ओढतात;
      अशा फ़्लेट झापखोरी इथे ठेऊन ऑइ ऐए ई ऍब्स ऋषभ और ढाँठ ष्ि।
  veg.tomato:
    label: टमाटर
    summary: एक गोल शेंगवड जी खाऊ घासामध्ये एखादी सब्जी म्हणून वापरली जाई.
    info: टमाटर बॉटनिकदृष्येने प्रकारचा मधुपती होय; किचनमध्ये सब्जीसाठीही वापरलं जातं. हे दक्षिण अमेरिकेला आढळणाऱ्या Solanaceae फ़िमिलीचं झाड आहे.
  veg.turnip:
    label: तुरटी
    summary: '''A'' टौएल ऑईल ओला छाळा'
    info: |-
      तुरटीका हे गोलाकृति किंवा प्येलसंच सफ़ेद -बगडमधील महामार्जन वनस्पती आहे
      याचा उपयोग पश्चिम अमेरिकेतून ब्रोक्सी एखाद्या भाषणानंतर इथल्या खाण्याच्या घटकाशी झाडले गेले,
      ज्यामध्ये 'C' फाईबर आणि कॅल्शियम धरले गेले आहे.
  veg.watercress:
    label: watercress
    summary: थंड झार आणि खडखड ओढणाऱ्या छोट्या फुफईशी शाही ऑइल.
    info: वॉटर क्रेसनचे पान थंड मोठ्या सुकलेल्या वसतिमधील हळदीमय चव असते, जी सिग्रिंग्लुकोजिक एसिडबद्दल आहे. हे भिटामिन सी, के आणि बीटा-कैरोटेनपासून धन्यवाद घेते.
  veg.yam:
    label: जाम
    summary: ओघट शकटणाचं मोठं ढीग; बराट ऐवजी वापरलं जाई
    info: |-
      जामने आफ्रिका, एशिया व कॅरेबीयनमध्ये पसरलेल्या हवाच्छडतुकळ भागात मोठं सखोल शकटण धरतं
      बराटच्या नांदगिरीपेक्षा जाम खरई, घटिणाऱ्या द्रव्यापेक्षा थोडं ओघट झाडत
      एकही फ़ल इतकं मोठं ठेऊ शकतं कि उभं 70 किलो वजन धरतं,
      उष्णकटिसीमाही आफ्रिकेत जाम आढळतं आणि ऑफ्रिकेत जगातील उत्पादनाच्या 95% जाम उत्पादित होऊ शकतं
  veg.zucchini:
    label: कुकेटा
    summary: एक प्रकारचे धोंडशेप थंडीचे शाक आहे
    info: |-
      कुकेटा ही एखाद्या प्रजाति कूकरबिटा मधले समोच्चन झालेले नव्हते आणि जुळवून घेण्यासहीय असलेले उष्मपटलीय शाकभाजी वगैरे खाऊदार भाग बनवते।
      इथले मुख्य ठिकाण मेक्सिको आहे;
      europe मध्ये इटलीने फौड डायट ओढवले आहे।
