lang: mr
pivot: false
title: भाज्या
cards:
  veg.broccoli:
    label: ब्रोकोली
    summary: तेलखंडावर गच्च पुष्पमसा असणारी हिरवी भाजी.
    info: ब्रोकोली हे कॉलफ्लाऊअरचे एक प्रकारचे हिरवे शाक आहे. हे खूप धन्य विटामिन सी, के आणि ऍँटीऑक्सिडंट म्हणजे इटलीमधून आले आहे.
  veg.carrot:
    label: मूळगाज
    summary: स्वादिष्ट गोडीकरण करणारे नाशपाती प्रकारचा मुलबटवाण भाजीपाला.
    info: मूळगाज हा एक द्विवर्षीय झाड आहे जेल ओंजनी रंगाचे खोदक उत्पादन करते. यामध्ये बीटा-कॅरोटीन (प्रोविटामिन A) आणि फाइबरचे समृद्ध प्रमाण आढळते.
  veg.corn:
    label: मकई
    summary: सुरील्या रंगाचे पिठासारखे कण सह एकट्रूप मोठय़ा हिरवय़ा पिक.
    info: ते मध्य अमेरिकेमध्ये उगवले गेले आणि ते आजच्या काळातील सर्वाधिक बाजारात घालण्यात आलेले पिक आहे. त्याचे शेण खनिजे, प्रथिने आणि भाइबी गटाचे जीवनसत्व यांचा समावेश आहे.
  veg.cucumber:
    label: काकडी
    summary: लांब गोंदर असणारी तृप्तिदायक पाणाची भाजी.
    info: काकडी हे Cucumis सैटिवुसचे एक उष्ण क्षेत्रीय फळ आहे आणि ते कौकुमिन मध्ये घालतात. त्यामध्ये 95% पाणी असते, ते थंडवा देऊन शरीरास ठावठिकाण देते आणि सलाडमध्ये किंवा मिटमेंट म्हणून खूप लोकप्रिय आहे.
  veg.garlic:
    label: लसूण
    summary: तीव्र वास असलेला पांढरा बुबूळकट भाजीपाला म्हणजे किचनमध्ये खूप आहारात उपयोग होणारा.
    info: लसूण हा सहस्र वर्षापासून गंध आणि औषध म्हणून वापरला जाणारा एक घटक आहे. त्यामध्ये ऍलिसिन नावाचा एक घटक असतो ज्यामध्ये दुच्छ बैक्टेरिया आणि फ्लेम झाडण्याचे गुण आहेत.
  veg.mushroom:
    label: हंगी
    summary: एक पांढरे-भूर्या रंगाची कपडेवजळची हंगी जी शेफमध्ये वापरली जाते.
    info: Agaricus bisporus ही दुसऱ्या स्पोरनिक ब्रशवर आधारित एक खाण्यास मिळणारी हंगी असते. ही जगामधील सर्वाधिक लोकप्रिय उत्पादित हंगी आहे. ही प्रथिने, भिटामिन B आणि खनिजांनी भरलेली असते आणि अनेक डिशमध्ये वापरली जाते.
  veg.onion:
    label: लसूण
    summary: तीव्र वर्गाचे पाककला सुधारण्यासाठी उपयोग होणारे बल्ब झिडकळ शाक.
    info: लसूण हे जगभर प्रमाणात लहान फळे म्हणून घेतले जाणारे एक अत्यंत प्रचलित भाजीपाला आहे. दुनियभरात खाद्य पदार्थांच्या स्वादामध्ये वाढ करण्यासाठी इच्छित असते; त्यात ऍंटीबॅक्टेरिओल गुणधर्म असलेले फ्लॅवोनॉइड्स असतात.
  veg.pepper:
    label: पाप्रिका
    summary: तेलखंड असलेली किंवा मधुर स्वाद असलेली चमकदार भूषण शाक.
    info: पाप्रिका हे पाळयात आहे आणि गोड आणि मसालेदार प्रजातीमध्ये उपलब्ध आहे. लाल पाप्रिकामध्ये सर्व शाकांच्या प्रकारांमध्ये विटामिन सीचा सर्वात जास्त प्रमाणात असतो.
  veg.potato:
    label: ब्रॅम्बर
    summary: जगभरातील अनेक व्यंग्यांचा हळदीसारखा मुख्य स्थानिक पाठशीरा.
    info: ब्रॅम्बर उत्तरी आणि दक्षिणी अमेरिकेच्या एंडीजपट्ट्यामधून आला आहे आणि जगातील सर्वाधिक महत्त्वाच्या फळझाडापैकी एक आहे. हा कार्बोहाइड्रेट्स, विटॅमिन C आणि पोटॅशियमचा खूप चांगला स्त्रोत आहे.
  veg.tomato:
    label: टोमॅटो
    summary: लाल गोल फळ जे भाजीपाला म्हणून वापरले जाते.
    info: टोमॅटो बॉटनिकदृष्ट्या एक फळ (बेरी) आहे परंतु रसविषयकदृष्ट्या भाजीपाला म्हणून वापरले जाते. हे दक्षिण अमेरिकेमधून आले आहे आणि इच्छा करते लायकोपेन आणि विटॅमिन सी.
