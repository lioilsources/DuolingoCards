lang: ru
pivot: false
title: Овощи
cards:
  veg.artichoke:
    label: артишок
    summary: Большая зеленая колючей овощ; мы едим только цветы.
    info: Артишок - это на самом деле бутон крупного шиповатого растения. Едят сердце и мясистые основания чешуи лепестков.
  veg.arugula:
    label: руколла
    summary: Жгущая темно-зеленая салатная травка; любимец итальянских блюд.
    info: Рукола (латинское название Eruca vesicaria subspecies sativa), родом из Средиземноморья и имеет характерный острый горьковато-жгучий вкус благодаря содержанию глюкозиранов. Это популярная зелень в итальянской кухне – ее добавляют сырую на пиццу после выпечки.
  veg.asparagus:
    label: аспирагус
    summary: Тонкие молодые побеги ранней весной; деликатесная сезонная продукция.
    info: Аспарагус официналис – одна из самых ценных весенних овощей. Белый аспаргус выращивается без солнечного света и мягче зелёного. После употребления он вызывает характерный запах мочи у 20–40% людей.
  veg.bamboo_shoot:
    label: bamboo shoots
    summary: Молодые побеги бамбука; хрупкая азиатская зелень.
    info: Бамбуковые побеги – это молодые ростки бамбука, собранные рано после прорастания. Они являются основой китайской, японской и таиландской кухни.
  veg.beet:
    label: красная свёкла
    summary: Тёмно-алый корневой овощ круглой формы; используется как окрашивающее вещество в пищевой промышленности.
    info: Красная свекла содержит бетанин – сильный натуральный красящий пигмент. Она богата нитратами, которые повышают спортивные результаты и снижают кровяное давление. Сахарная тростниковая свёкла является другой разновидностью растения Beta vulgaris и служит источником белого сахара.
  veg.bok_choy:
    label: пак чой
    summary: Азиатский листовой овощ со светлыми черешками и темными листями.
    info: |-
      {"hint":"Китайская листва с белыми стеблями (Brassica rapa подв. Chinensis)","info":"Пак чой / бок чой (Brassica rapа subsр. chinеnsis) происходит из Китая\r
      Это основной овощ кулинарии Китая, Японии и Таиланда\. Он богат витаминами С, К, А а также содержит кальций\r
      Быстрый способ приготовления:\rна сковороде вок с луком да зазверем за две минуты","label":"пак чой","summary":"Азиатский листовой овощ со светлыми черешками и темными листьями."}
  veg.broccoli:
    label: брокколи
    summary: Зелёная овощ с плотной цветочной головкой на мясистом стебле.
    info: Брокколи – зеленая овощ из семейства капустных. Она исключительно богата витаминами С и К, а также антиоксидантами; родом она из Италии.
  veg.cabbage:
    label: kapusta
    summary: Округлый вид зелени со стойкими листьями основной ингредиент для приготовления кислотного продукта.
    info: Капуста (Brassica оlerасеa) - древняя зелень выращиваемая в Европе тысячи лет. Содержит витамины C и К а также глюкозинолаты с противораковыми свойствами. При ферментации получается кислая капуста или шавермаут богата пребиотиками.
  veg.carrot:
    label: морковь
    summary: Оранжевая корнеплодная овощ с нежным вкусом.
    info: Обыкновенная морковь – двулетнее растение, возделываемое за сочный оранжевый корень. Она богата бета-каротином (провитамин А) и клетчаткой.
  veg.cauliflower:
    label: соцветие кочана
    summary: белая плотная масса из множества маленьких цветов белокочановая культура
    info: |-
      Цветная капуста (Brassica оleracea var. ботритис) родственна брокколи
      Белый цвет возникает потому что листья защищают голову от солнца предотвращая образование хлорофилла
      Существуют также фиолетовые желтые и зелёные разновидности
      Капуста в виде соцветий на диете без клейковины популярный заменитель муки и риса
  veg.celeriac:
    label: бульбовый сельдерей
    summary: Крупный белый клубневидный корень сельдерея; используется как базис приготовления различных соусов.
    info: Бульбовый сельдерей (Apium graveolens var. rapaceum), выращивается ради корня. Он обладает насыщенным ароматом и вкусом растения из семейства зонтичных культур. Это основной ингредиент для блюд вроде соусов крем-сельдерея или запекания.
  veg.celery:
    label: райкатая петрушка
    summary: Крышавое зеленое овоцеплодное растение с ядренным ароматом; нулевые калории?
    info: Райкатый петрушка (Аpiум grаviоlеns), происходит из Средиземноморья и является основой французской кухни тройки ингредиентов «мирпо» или мелкие нарезанные овощи в блюдах – лук, морковь, укроп. Также сок стебля этого растения популярен как детокс напиток.
  veg.chard:
    label: мангольд
    summary: Цветная листва с яркими полосками на листьях.
    info: |-
      Мангольд (Beta vulgaris subspecies cicla), родственник красной свеклы,
      имеет зелёные, красные или радужно окрашенные стебли.
      Он богат витаминами К и А а также минералами как калий и магний.
  veg.chickpeas:
    label: chichorica
    summary: Округлая светло-карамелизованные бобы; основной компонент хуммуса и фалеловы куличики.
    info: '{"hint":"округлые коричневато-бежевые бобовые семена (Cicer аrietинум)","info":"Чечевица (Cicer аrietinум) - популярная бобовая культура Ближнего Востока и Индии\nЭто основа хуммуса (чечевичный пюреобразный соус), фалафель (зажаренные шарики).\nБогата растительным белком; часто используется в строго вегетарианской диете или во всей веганской диете.\nВода из чечевицы (аквафааба) заменяет яичные желтки при выпекании","label":"чечевица","summary":"Круглая светло-коричневая бобы; базис для хуммуса и фалел."}'
  veg.chili:
    label: чили
    summary: Острая красная или зеленая паприка; основа острых блюд.
    info: Чили перец сладкий (Pepper Capsicum и др.). Это очень острый вид перца.
  veg.corn:
    label: кукуруза
    summary: Желтая овощная культура с рядами сочных зерен на початке.
    info: Столбовая кукуруза происходит из Центральной Америки и сегодня является одной из самых выращиваемых культур. Зерна содержат углеводы, белки и витамины группы В.
  veg.cucumber:
    label: огурец
    summary: Длинная зелёная овощ с освежающей сочной мякотью.
    info: Огурцы – тропический овощ из семейства тыковых. Они содержат 95% воды и являются освежающими; их любят в салатах или как перекус.
  veg.eggplant:
    label: баклажан
    summary: Тёмнофилёвая продолговатая овощная культура
    info: '{"hint":"темнофиолетовая вытянутая овощная культура (Solanum melongена), также называемая баклажаном","info":"Баклажаны происходят из Индии и возделываются уже тысячи лет\nВ Италии их зовут мелинзана или аубергиньен во Франции - эгпланте в США - яичный плод\nСодержат настуин мощного антиоксидантной темной корки\nИспользуются как основа средиземноморской кухни и Близкого Востока: муассака, баабаганиуш, рапателья"}'
  veg.endive:
    label: чеканка
    summary: Светлая лиственная зелень с горьковатым вкусом.
    info: Чеканка - это овощ с характерным горьким вкусом и белым цветом листьев, который появляется при выращивании в темноте или без прямого воздействия света от Солнца. Горечь вызвано интибиновыми кислотами, которые снижаются после бландирования.
  veg.fennel:
    label: фенхель
    summary: Белая «луковка» с перьевыми вершинками и приятным запахом аниса.
    info: Фенхель (латинское название Foenicolum vulgarе) имеет сладкий анисовый вкус благодаря содержанию анетола в составе растения. Съедобны корень фенхеля с белой кожурой и перистые листья. Это основной ингредиент средиземноморской кухни Италии – его добавляют во всевозможные соусы для песто или используют как украшение на зелёных салатах.
  veg.garlic:
    label: лук репчатый
    summary: Острые белые луковицы с выраженным ароматом, основа вкуса многих блюд.
    info: Репчатый лук используется на кухне уже тысячи лет как приправа и лекарство. Он содержит аллицин, который обладает антибактериальными и противовоспалительными свойствами.
  veg.ginger:
    label: имбирь
    summary: Корешковое растение со сладким ароматом.
    info: Имбирь (Curcuma longa), также известный как имбирное коренье или гингерберд, представляет собой растение тропической Азии с характерным оранжево-коричневым цветом и специфическим вкусовым профилем из-за содержания вещества под названием куркумин.
  veg.green_beans:
    label: фасолевые листья
    summary: Длинные зеленые семена фасоли; собранные незрелыми.
    info: Фасолевые бобы собирают еще несозревшими и их также называют французская фасоль или стручковая фасоль. Они содержат витамины С, К и фолиевую кислоту.
  veg.kale:
    label: капуста кудрявая
    summary: Темнозелёное растение из семейства Brassicaceae.
    info: Капуста кудрявая (Brassica оleracea var. sabellika), также известная как кейл или капуста сабеллика – это очень питательный темно-зеленый овощной продукт питания.
  veg.kohlrabi:
    label: кольраби
    summary: Овощ с округлыми корнеподобно выросшими побегами на стержне; относится к группам капустных.
    info: Кольраби (Brassica олерейция гонгилоидес), также известный как репа брюкколы или кочанная капуста с мясистым стеблем – это вид зелени из семейства Brassicaceae родственник обычной белокачановой капусты и других представителей этого же вида B.olerеacia. Его едят мячковатый утолщенный ствол вместе со льняными листьями. Он имеет мягкую сладко-хрустящее вкусовое восприятие при сырой подаче либо после термической обработки. Название происходит от немецкой комбинации слов «Kohl» - капуста + «Rabe/Rabie», что значит 'тугая масса', поскольку его плотность напомнила тогдашним аграриям тугие формы.
  veg.leek:
    label: poroi
    summary: Большая мягкая овощная зелень; основа для супов и раго
    info: '{"hint":"огурец","info":"Порей - родственник лука и чеснока\r\nЭто национальный символ Уэльса; уэльцы носят его в день святого Давида\. Он содержит аллицин и витамины К и С\. Пюре из порея традиционно используется во французской кухне\", "label": "порей"}'
  veg.lentils:
    label: чечевица
    summary: Маленькие плоские семена бобов; основное источник белка для безмясного питания.
    info: Чечевица - одна из древнейших бобовых растений, возделываемых уже более десяти тысяч лет. Существует в красной и зеленой разновидностих, а также коричневые и черные сорта чечевицы называются белуга или джиггера соответственно. Чечевичный горошек не требует замачивания перед приготовлением пищи на протяжение от двадцатки до тридцать минут, что делает его быстрее фасоли.
  veg.lettuce:
    label: луковый салат
    summary: Хрупкая лиственная зелень используется как основной компонент для приготовления различных видов салатов.
    info: Головка салата (латинское название Lactuca Sativa), выращивается в Египте уже давно и содержит более чем воды, что делает его низкокалиорийным овощем. Существует множество разновидностей головки салата – айсберга, романо, лолло, баттерхеда, дубового листа.
  veg.lotus_root:
    label: луковица лотоса
    summary: Разрез стебля лотоса со множественными дырками по центральной осевой части; популярная закуска в Азии.
    info: Лотосовый корень – это подземный побег священного лотуса Нелумбо нуцифера с характерными отверстиями на разрезе в виде узора. Он является важным компонентом азиатской кухни и используется во многих блюдах из Китая, Японии и Индии.
  veg.mushroom:
    label: гриб
    summary: Светло-коричневый шляпочный гриб, используемый в кухне.
    info: Груздь двузубковый – самый распространённый выращиваемый гриб в мире. Богат белками, витаминами группы В и минералами; используется во множестве блюд.
  veg.okra:
    label: абельмосх
    summary: Зелёные жилкованные стручки со смазистой консистенцией; база для гомба.
    info: '{"hint":"длинная зеленая ребристая семенная коробочка (Abelmoschus esculetus), пальцы дамы","info":"Окра (Abelmoschus esculentus) происходит из тропической Африки\r\nЭто основной ингредиент американского блюда гумбо; скользкая текстура загущает соусы\r\nПоперечный срез окры формирует звездочки\r\nВ ней много клетчатки и витамина С", "label": "окра"}'
  veg.onion:
    label: лук
    summary: Острые слоистые луковые овощи для приправления блюд.
    info: Лук репчатый является одной из самых выращиваемых овощей в мире. Он используется для придания вкуса блюдам по всему миру и содержит флавоноиды с антибактериальным действием.
  veg.parsley:
    label: петрушка
    summary: Ярно зеленая травянистое растение с плоскими или кудрявыми листьями.
    info: Петрушка используется как приправа и украшение блюд на кухне многих стран мира.
  veg.parsnip:
    label: пастинак
    summary: Белый кремовый корень; основной продукт питания Европы в Средневековье.
    info: Пастинака (латынь Pastinaca satива), также известная как пастернак или белая морковь - это овощ из семейства зонтичных растений с толстыми корнями и нежным вкусом.
  veg.peas:
    label: горох
    summary: Мелкие зелёные семена внутри стручка – символ весны.
    info: Горох выращивается с древних времен и является бобовой культурой. Грегор Мендель изучал горох в своих экспериментах по наследственности между 1856–1863 годами. Съедают весь стручок морковного гороха или сладкий сахарный горошок.
  veg.pepper:
    label: паприка
    summary: Светлая цветная овощ с сочным или острым вкусом.
    info: Паприку выращивают как в сладких, так и в горьких сортах. Красная паприка содержит больше всего витамина С среди всех видов овощей.
  veg.potato:
    label: картофель
    summary: Коричневая подземная основа множества блюд по всему миру.
    info: Картофель происходит из Анд в Южной Америке и является одной из важнейших культур мира. Это источник углеводов, витамина С и калия.
  veg.pumpkin:
    label: '"тыква"'
    summary: Крупный желтого цвета округлая тыквенная форма; символ Хеллуина и осенняя кухня.
    info: "{\"hint\":\"огурец оранжевый круглый тыквенный (Cucurbitа maxима или репо)\",\"infо\": \"Тыква (Cucurbита mахiма или реpo) происходит из Америки.\r\nОна богата бетакаротином и витаминами А и С.\r\nДекоративная традиция вырезания тыковок на Хэллоуина появилась во время Ирландии.\r\nСемена тыквы являются отличным источником цинка, магния и растительного белка.\"}"
  veg.radish:
    label: редис
    summary: Мелкая хрустящая красноватая или беловатая корневая зеленость
    info: Редис (raphanussativus), быстро растущая корнеплодная овощевода. Маленький садовый редис красного цвета, а большой зимний бывает белым (даикон). Содержит глюкозинолаты обладают антибактериальными свойствами.
  veg.spinach:
    label: шпинат
    summary: Темно зеленая листовая овощная культура с высоким содержанием железа.
    info: Шпинат происходит из древней Персии и содержит витамины К, А, С, фолиевую кислоту и железо.
  veg.spring_onion:
    label: весенний лук
    summary: Нежная зелень из белой основы и стеблей – дополнение ко всем видам салатов.
    info: Весенний лук растет еще не до конца созревшим и имеет более нежный вкус по сравнению со стандартным луком без острого запаха. Он используется в азиатской кухне как украшение блюд или добавка для салатов и первых блюд.
  veg.squash:
    label: тыквенная
    summary: Разнообразные формы зелени осенней кухни.
    info: |-
      Зимняя тыква (Curcurbica) включает сорта баттернута и акорн, деликатесную кабошку.
      Она образует твёрдую скорлупу для защиты на протяжении месяцев;
      ее можно хранить всю зиму.
      Это богата витаминами А, С и комплексом В.
  veg.swede:
    label: турьин
    summary: Большая фиолетово-желтая корнеплодная овощевода; компаньон шотландского хэгга.
    info: Турьин или брюква - это гибрид капусты и редиса. В Америке его называют «рутабага», а в Шотландии он является неразлучным спутником хэггиса. После приготовления имеет сладкий вкус с легкой пряностью.
  veg.sweet_potato:
    label: батат
    summary: Оранжевый сладковатый корнеплод
    info: Сладкий картофель или батат происходит из Южной Америки и не имеет никакого отношения к обычному картофелю с точки зрения растительного мира.
  veg.taro:
    label: таро
    summary: Великий шкорообный гриб с фиолетовым пятном; тепличная базовая пища.
    info: '{"hint":"Большой крахмалистый корнеплод с фиолетовыми пятнышками (Colocasia esculenta)","info":"Картофельное дерево или таро (Colocasia esculента) - тропическое растение из семейства ароидных, которое выращивается уже более 5 тысяч лет и является основным продуктом питания в Полинезии Азии и частично на Ближнем Востоке. Традиционно его едят как блюдо под названием ''poi'' после процесса ферментации. У него слегка ореховый вкус, характерные для этого фиалковые пятна являются отличительной чертой мякоти клубня. Сырый картофель содержит щавелевую кислоту которая может вызвать жжение во время употребления поэтому рекомендуется готовить перед поедание."}'
  veg.tomato:
    label: помидор
    summary: Красный круглый плод, используемый как овощ.
    info: Помидор ботанически является фруктом (ягодой), но на кухне используется как овощ. Он родом из Южной Америки и содержит ликопин и витамин С.
  veg.turnip:
    label: турнепс
    summary: Белофиолетовый круглый корень ; старое среднеевропейское блюдо
    info: 'Турнепс ( Brassica napus ) - корневая овощная культура из семейства капустных растений . Он был основной пищей Европы до прихода картофеля с западного полушария Америки . Содержит в себе аскорбиновую кислоту , кальций и клетчатку как питательные вещества ; блюдо на основе турнеца является популярным рецептом среди средиземноморских стран '
  veg.watercress:
    label: водный хрен
    summary: Мала темно зелена палива травища з водоносних джерел.
    info: '{"hint":"малая тёмно-зелёная острая водная трава (Nasturtium officinale)","info":"Водный горчица растёт в холодных потоках и родниках.\nУ нее жгучий перцевый вкус благодаря глюкозинолату сингрина. \ nОн богата на витамины С, К и бетакаротина."}'
  veg.yam:
    label: ямс
    summary: Крупный тропический корнеплод богатый крахмалом часто путают с картошкой.
    info: Ямс - это крупная крахмалистая клубня тропических районов Африки, Юго-Восточной и Восточной Азии а также Карибского бассейна. Он отличается от картошки тем что ямс суше содержит больше крахмала и менее сладкий. Его вес может достигать до семидесяти килограмм.
  veg.zucchini:
    label: кукета
    summary: Зелённая летняя тыква; универсальная продукция подходит на приготовление блюд разными способами.
    info: "{\"hint\":\"удлиненный зеленый летний тыквовый огурец (Cucurbita pepo), также кабачок\",\"info\":\"Кукета или патиссон (Cucurbita pepo) - это молодая летняя тыква урожай которой собирают ещё не до конца зрёлой размером от семи сантиметров до двадцати пятого;\r\nона родом из Мексики и в Европе популярна благодаря Италии;\r\nсодержит более девяносто процентов воды поэтому является низкой по содержанию калорий;\r\nпатиссоны исследуются как замена спагетти для без глютенных диет.\"}"
