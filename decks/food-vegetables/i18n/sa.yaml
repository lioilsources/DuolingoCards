lang: sa
pivot: false
title: शाकः
cards:
  veg.broccoli:
    label: ब्रोकोली
    summary: तेलयुक्त डंठल पर हरित फूल के सघन माथा वाली सब्जी।
    info: ब्रोकोली ब्रसिकेस परिवार की हरी सब्ज़ियों में से एक है। यह अद्भुत रूप से विटामिन C, K और एंटीऑक्सिडेंट से भरपूर होती है; इटली से आई है।
  veg.carrot:
    label: मूली
    summary: एक खस्ता स्वाद के साथ नारंगी मूल प्राप्ति हरियाली।
    info: मूली एक द्विवर्षीय फ़सल है जो शुद्धता और चटकनेवाले नारंगी मूल के लिए पाली जाती है। इसमें बीटा-कैरोटीन (प्रोविटामिन A) और आहार फाइबर की उच्च मात्रा होती है।
  veg.corn:
    label: कुकुरीस
    summary: प्रत्येक कलम पर रसदार बीजों के सूचिपूर्ण श्रृंखला वाला पीला हरित फलन।
    info: उष्णकटिबंधीय अमेरिका में उगाई जाने वाली गेहूँ की एक ऊँची घास की फसल (जीआईएमए) भी मकई कहलाती है। इसके बीज में चरबी, प्रोटीन और बी ग्रुप विटामिन होते हैं।
  veg.cucumber:
    label: ओकुर्का
    summary: दीर्घ विषाणु शाखा के संग्रह से पैदा होने वाली एक ताज़गी देने वाली फली।
    info: ओकुर्का ट्यूपिकल ग्रीष्मकालीन शाकसभ्यता में आवे और उनके अधिकाँश भार जल से बने हए। इ ठंडा और चबाऊ छलक वाली ओकुर्का आमतौर पर सलाड में या एक झटके के रूप में प्रयोग होथे।
  veg.garlic:
    label: लसुन
    summary: तीक्ष्ण गंध वाला सफेद बल्ब, कई पकवानों में स्वाद के आधार के रूप में।
    info: लसुन हजारों वर्षों से खाना पकाने में मसाला और दवा के रूप में उपयोग किया जाता है। इसमें एलिसिन होता है, जिसमें एंटीबैक्टीरियल और एंटीइन्फ्लेमेटरी गुण होते हैं।
  veg.mushroom:
    label: हंगी
    summary: खाद्य शैवाल के साथ पकोरा और छड़ी (उदाहरणतः बटन मशरूम, एगेरिकस बिसपोरस)।
    info: एगेरिकस बिसपोरस विश्व में सबले हुए खाद्य फंजस का सबले हुए उदाहरण है। इसमें प्रोटीन, विटामिन बी और खनिज पदार्थों की अधिकता होती है; इसका उपयोग अनगिनत भोजन में किया जाता है।
  veg.onion:
    label: कलई
    summary: पाचन वर्गीय प्रतिक्रिया के लिए उपयोग में आने वाली तीखी संस्तरित बूँदर जड़ी बूटी।
    info: कुछ अम्ल और फ्लवोनॉइड होते हैं जो इसे खाद्य पदार्थों में डालकर भोजन के स्वाद को बढ़ाने के लिए उपयोग करते हैं।
  veg.pepper:
    label: पाप्रिका
    summary: चमकदार बर्तन वलयी अथवा मसूर के स्वाद होता है।
    info: पाप्रिका प्रजाति के एक चमकदार घंटी के आकार के मिरचे (कैप्सियम एन्नुअम) के फल होते हैं जिन्हें कैप्सियम भी कहा जाता है। लाल पाप्रिका में सब्जियों में से विटामिन सी की सबसे ऊँची मात्रा होती है।
  veg.potato:
    label: ब्राम्बोर
    summary: दुनिया भर के अनेक व्यंग्यों में प्रयुक्त होने वाला सफ़ेद जड़ी खाद्य पदार्थ।
    info: ब्राम्बोर उत्तरी अमेरिका के एण्डीज़ से आहलाद है और इसे दुनिया की सबसे महत्वपूर्ण फ़सलों में से एक माना जाता है। यह शर्करा, विटामिन सी और पोटैशियम का एक महत्वपूर्ण स्रोत है।
  veg.tomato:
    label: राज्ञी
    summary: लाल गोल फल जिसे सब्ज़ि के रूप में प्रयुक्त किया जाता है।
    info: राज्ञी बोटनिक दृष्टिकोण से एक फल (फलदार) है, लेकिन खाना पकाने में इसे सब्ज़ि के रूप में प्रयुक्त किया जाता है। यह उत्तरी अमेरिका से आई है और इसमें लाइकोपीन एवं विटामिन सी होता है।
