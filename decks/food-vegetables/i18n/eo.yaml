lang: eo
pivot: false
title: Verdaĵoj
cards:
  veg.artichoke:
    label: artiko
    summary: Grandeco spino-verdumo elspinata el plena florkveto.
    info: Artičoko estas fakte embrio de granda spinaca planto kaj oni manĝas nur la koron kaj malsuperan parton kun ĝuste formitaj ŝveloj. Artichoke havas gustigon efikon al trunkamikejoj; tial ekzemple Cinzano kaj Cynar Vermuth enhavas artichoekstrakton.
  veg.arugula:
    label: Ruakolo
    summary: Akra nigrverda saletgarnito populara ekde antikva tempoj.
    info: La ruakolo (Brassica napus ssp. olerecea varietas "rupes") originas el la Mezegreko. Gasonitatoj donacas al ŝi karakterizan peperuman akran guston kun brulanta efiko en buŝo kaj guto. En Italio oni uzis ĉe prunso por longeco de tempo.
  veg.asparagus:
    label: aspergo
    summary: Delika frua vegetalaĵeto dum printempo.
    info: La Asparago (Asparagus officinalis) estas unu el la pleje valoraj printempa legomo. La blanka formo de ĉi tiama planto kreskas sen sunlumo kaj havas pli maldikan guston ol verda vario. Post manĝado karakterizigas odora urino por proksimume duondunono al dudekprocento da homoj kaŭze de substanco nomita 'aspargino'.
  veg.bamboo_shoot:
    label: výhunko
    summary: Junulo diarkeo uzata por azianta pano.
    info: Výhonko de bambuso estas junulo diarkeo el la subfamilio Bambusoideai kiun oni traktas frue post ke ĝi ekplenas sian vivon. Ili havas gravan rolon en tiama manĝado fare de ĉinoj, japanoj kaj tailandoj. La freŝe prenitaj enhavadas ciano devigas ilin esti kuiritaj dum preparado sed konservitaj ne plu posedas tiajn riskojn.
  veg.beet:
    label: rubra burako
    summary: Dense runda radiko legomo en donkera ruĝo.
    info: La rubra burako enhavas betaŭninon, fortikan nativan ruĝan pig menton. Ĝi estas riĉa pri nitratoj kiuj plibonisportman kapablon kaj malplilongigas sanguptenton.
  veg.bok_choy:
    label: bampagi
    summary: Azia legomo simila al brokolino sed pli maldika.
    info: Bambagia pakchoji/bokchoj estas varieto de Brassica napus origine el Azio. Ĝi havas blankan sternum kun mallongaj folijoj kaj establiĝis en la aziega dieto pro sia nutrovaloro enhavi vitaminojn B6,C,E,K,kaj mineralojn kiel kalcio,magnecio,fosforo,senoleja acido omega-3.
  veg.broccoli:
    label: brokeolo
    summary: Verda legomo kun densa florkapo sur grasa stomako.
    info: Brokeolo estas verda legomo el la familio de kviakabroloj. Ĝi havas eksterordinare altan enhavo da vitamino C, K kaj antioksidantoj; origine ĝi venis el Italio.
  veg.cabbage:
    label: gvarbelokaŭko
    summary: Runda legomo per malmole ligitaj foliaro;
    info: Gvarbelokaboko (B.) estas malnova legomo kultruita en Eŭropo dum miloj da jaroj. Ĝi enhavas vitaminon C, K kaj glikozidatojn kun kontrau-kancero efektoj. Fermentita formo nomiĝas sauerkaŭt, richeza pri pro-bakterio.
  veg.carrot:
    label: caroto
    summary: Naranca sakradika legomo.
    info: Carotum commune estas dujariga planto kultivita por ĝia sokaĝa naranĉokolora radiko. Ĝi enhavas plentempe beta-karotonon (provitamino A) kaj fibrion.
  veg.cauliflower:
    label: cauliflower
    summary: Blanka densa kapo el multe da flores.
    info: Cauliflora (Brassica oleracea var. botrytis) estas proksima al broccoli kaj havas blankan denson de florkapoj ĉar la folioj protektas tiun parton kontraŭ lumo por malhelpi formadon da klorofileto. Ankaŭ ekzistas violaĵ-koloritaj, naranĝkoloraj kaj verdkoloraj specimenoj.
  veg.celeriac:
    label: paprikaradioko
    summary: Granda blanka nodula paprikaradicokonstituo.
    info: Paprika-radiko de Apium graveolens varietato rapaceum estas ĉefe uzata por sennombra radikko kun fortika paprikan aromaĵo kaj gusto. Ĝi servas kiel bazo en sopoj, celera saŭtoj (ekzemple remoulade), kaj fritaj manĝaĵoj.
  veg.celery:
    label: petolaĉeza
    summary: Krunka verda legomo per intensiva aromaĵo; eble negativaj kalorioj?
    info: Cruncema petolaĉeza vegetablo el la Mittelmarbazo havas fortranĉan aromon kaj estas parto de triopeto en franca koktilado nomita 'mirapoŝ' kun luktiko kaj karoto. Ĝia suko estis populara detoksiiga bebo.
  veg.chard:
    label: betakukurbitaco
    summary: Kolorplena folia vegetalo per multikulorigaj trunkoj.
    info: Betavojo mangoldo (Beta vulgaris subspecio ciclo) estas proksima parenco de la rōĝa beetro. Ekzistas kun verdaj, ruĝaj, flavaĵoj kaj arkojn similantaj trunko. Mangoldsuperaĵo enhavas vitaminojn K, A kaj C kaj mineralojn (kalium, magnesio). En Bohemio establiĝe en tradicia agrikulturo dum longeco sed revenas al moderna gasto.
  veg.chickpeas:
    label: chickpea
    summary: Ronda beĝova semeno; fonto al humusoj kaj falafeleo.
    info: Chickpea (Cicer arietinum) estas popularo faskulo de la Mezoriento kaj Indio. Ĝi formas bazon por humuso (pastaĵo el chickpeas) kaj falafelejoj (frititaj pildoro). Plena pri plantan proteinton; tre uzata en veganismo kaj vegetarianismokvartalo. Akvo restanta post kuŝigo da chickpeas anstataŭigas ŝelon en panado.
  veg.chili:
    label: pepo
    summary: Varmega ruda aŭ verda peponaĵo uzata en akra kulinarartiko.
    info: La chilipaprio ( Capsicuma anua kaj aliaj specioj) estas tre varmegaja sorto de pepero. La varemecon kaŭzas kapzacinon, kiun oni mezuras per la Skowlel-skaleno (ekzemple jalapeños havas inter 2 500–8 000 SK-unuo j, dum karolinreperoj plenumas super 2 milionoj da unui). Ĝia evoluigita rolo establis forigi mamiferojn sed ebligu birdojn disvasti sian semenon. Azijaj, meksikaj kaj hindujaj manĝospicecoj sen chili estos nerealebla.
  veg.corn:
    label: maizo
    summary: flave-verdema legomo kun vicoj da suknuksoj ĉe la pano",
    info: '{"hint":"altigrasa herbo kun flava kernoj (Zea mays) ankaŭ nomata maizo","info":"Maizokultivo originiĝis en Mezameriko kaj estas hodiaŭ unu el plej multekultiigitaj plantospecioj. La fruktojn enhavas karbohydratojn, proteinojn kaj vitaminon grupo B.","label":"maizo","summary":"Flave verda vegetalo per rando de saĉetaj nuksoj sur spico."}'
  veg.cucumber:
    label: kukumo
    summary: Longa verda legomo kun refreŝiga malsața interno.
    info: Kuka mastruma estas trojika legomo el la familio de kalabasoj kaj enhavas proksimume 96% akvon; ĝi havas rafinan guston kaj ŝanĝatas teksturojn kiun oni plezure uzantas en sandviĉojn.
  veg.eggplant:
    label: Aubergine
    summary: Malvarma viola ovaligita legomo uzata por pladoj kiel Moussako kaj Ratatuj.
    info: |-
      Eggplano el Solanumo melongeno originas en Indo kaj estas kultivita ekde milojaroj
      En Italio ĝi nomatas 'melanzana', En Fratio - 'aubergine' Kaj En Usono - 'eggplan'.
      Ĝi enhavas nasoninojn – fortikantan antioksidanton trovebla je la malluma skalo.
  veg.endive:
    label: enda
    summary: Blankflora arbotaj legomaterialo kun malsaganta gusteco.
    info: Endivio (Cichorio intibus aŭ C.endivia) estas varmoklimata foliaj legomo kun karakteriza amara gusto. La blanka koloro rezultas el brakado en malvarmecon ĉe la radiko de plantejojn (ĉukoreto), aŭ forigite per sunlumo (blancendivo). Amareco kaŭzita pro acidoj kiuj nombras "intybino" reduktiĝis dum brako.
  veg.fennel:
    label: feno
    summary: Blankbulb plENA je perisimaj flankoj kun dolca aroma flavoro.
    info: Aneto (Foenicolum vulgarum) havas sukanan anizflavoron pro la prezenco de anetuolo. On manĝeblas ĝian buľbon, sternojn kaj perisimblaj folioj. Estas grava en itala mediteranea koktilado por preparaciojn kiel pesto, sandviĉoj kaj bakita fiŝo.
  veg.garlic:
    label: cibuken
    summary: Forvarmigita blanka bulbo per forta odorato baza por multaromigo de manĝado.
    info: Cibuka allia estas uzata en la kokejo ekde miloj da jaroj kiel aromo donanta kondimento kaj medicino. Ĝi enhavas alocinon kun antimikrobaj kaj anti-inflamaj proprecoj.
  veg.ginger:
    label: zingero
    summary: Nebula knopita korpo per varmema aromo.
    info: Ginger estas radiko de planto el Tropika Azio kiu enhavas ginerolojn – substancoj responcigantaj por la bruliga efekto kaj kontraŭ-inflamia agado. Esplorado montras ke ĝi povas helpi kun naûzo kaj stomakproblemoj.
  veg.green_beans:
    label: verda fasolo
    summary: Longaj verdaj fasolanuskularoj elklizotaj en malplena stato.
    info: Verdaj faskuloj de Phaseolus vulgaris estas trankviligitaj dum la nesupertua stadio. Ili ankaŭ nomiĝas francesaĵoj, lignofascio-fazojoj aŭ bobo-fasojoj kaj enhavas vitaminon C, K kaj folatidon. Blanchita kun mandeloj ĝi formas klason nord-amerikan akompanan manieron.
  veg.kale:
    label: sabiloka kapusto
    summary: Malhelblua frizita folialegomo kun fortika gusteco.
    info: Sabiloka kapusto (Brassica oleracea var. sabellica) estas tre nutra malhela verda legomo. Ĝi enhavas vitaminojn K, A, C kaj antioksidantojn. En la lastaj jardekoj ŝi fariĝis simbola 'supermaniero' por vegetarianuloj kaj movado pri sanitato.
  veg.kohlrabi:
    label: rabihokolo
    summary: Legomo kun rondetuberkulo sur sternekol; proksima parenco da kapuceto.
    info: |-
      Rabichokolo (Brassica oleracea gongylodes) estas legomo rilata al kaptelojaj brusokojoj.
      Oni manĝas la tuberkulon (grasekan sternkon) kaj foliojn;
      Ĝi havas delikatan sukecan guston kaj eblas konsumi ĝin kruda aŭ varma.
      La nomo devenis el germana lingvo:
      kohl signifas kapuceto,
      rabi - tuberkuло
      Estas populara en Indo, Germanio kajĈeĥio.
  veg.leek:
    label: porkejo
    summary: Mildigita bulboplanta vegetalo uzata ekde antikvaj tempoj.
    info: Porkejo estas proksima parento de la ĉebulo kaj piperko.Ĝi establiĝis kiel landa simbolo en Velso; welsanoj portas porkejon dum festivo al Sankta David. Porkejo enhavas aloinojn kaj vitaminojn A kaj B6.
  veg.lentils:
    label: lentilo
    summary: Platulo formata per semenoj da fagofito; fonto pri proteino por vegetarano.
    info: Lentilo (Lens culineria) estas unu el la plej malnovaj sencoj de fagonbestaĵoj; ĝin kultivas ekde plenum mil jarojn antau ol nune. Ekzistas rubra, verda, bruna kaj nigreca varietatoj. Sen maldriĝado oni povas kuiri en 20–30 minutoj; lentilokvarimo establiĝas rapidan ol fiŝfago.
  veg.lettuce:
    label: iceberg-salato
    summary: Crispa folia vegetalo uzata por verdaj salatoj.
    info: Iceberg-salato estas kultivita ekde la malnova Egipto. Ĝi enhavas pli ol 95% akvon kaj havas tre mallongan kaloricitan valoron. Ekzistas multaj varioj inkluzive de icebergo, ro-mano, lolo, buterhavo kaj qukofojaso.
  veg.lotus_root:
    label: lotosa radiko
    summary: Transversal-sekeca radikaĵo el belaj malfermoj; Aziana gastronomia precizeco.
    info: Lotusa radiko de Nelumbo nucifera estas subtera stokado de la sankta loto. Ĝi havas simetrikan patron kun foraj poroj en transversala sekcio. Uzata bazmaterialo en aziaj manĝospitalecoj inkluzive de ĉina, japanana kaj hindua.
  veg.mushroom:
    label: fungo
    summary: Pale-bruna ĉapeloforma fungo uzata por kuiri.
    info: Agariko kun du sporoformoj estas la pleje rozvastigita agrikultura fungo en mondo. Riĉa pri proteinojn, vitaminon B kaj mineralojn; uzata en multegho da manĝado.
  veg.okra:
    label: oka
    summary: Verda rigida frukto kun glata surfaco uzita en 'gumbon'.
    info: Oka (Abelmoschos esculentas) originas el Tropika Afroko. Ĝi estas bazo de la usona manĝaĵo 'gumbo'; ties glata teksto helpas malfini puronojn kaj plenigu ilin per masoj. En transversala sekcio oka formas steloj.
  veg.onion:
    label: allion
    summary: Forvarmiganta stratita bulbo-legomo de speco Allium cepa.
    info: La Allio Cepa estas unu el la plej multekultivate verdaj legomoj en mondo. Ĝi uzatas por donacii guston al manĝoj dum tuta tiu planedego kaj enhavas flavidonojn kun kontraŭbacteria efiko.
  veg.parsley:
    label: pețerelo
    summary: Brilante verdo herbo; aromo donanta adicio.
    info: Petrajo (Petrosalinium crispum) estas ĝenerale uzata por sazigi manĝaĵojn kaj dekoraci ilin. En maso per pezo enhavas pli da vitamin A ol mandarinoj. Ekzistas glatvariablo kun ebenaj folioj kaj kurba variablo - la unua havas fortikan guston kiu plezureblas al kokistoj.
  veg.parsnip:
    label: patino
    summary: Krem-kolora blank-radikmanĝaĵo uzita de mezepoko.
    info: Patinako (Pastinaco sativo) estas radiko vegetalo rilatanta al la patato kaj estis grava manĝaĵo en Eŭropo antaŭ ekzemple la kartofloj arancioj. Ĝi havas sukan, ŝeloforman guston kiun oni povas plifortigi per frostado.
  veg.peas:
    label: fasolia
    summary: Malgrandaj rondetaj verdafruktoj en ŝelo simbolo por varmeco.
    info: |-
      Fasoli (Pisum sativum) estas bobbesto kultivate ekde antikvaj tempoj
      Gregoro Mendelo studi fasolion en siaj hereditaĵaj esploradoj inter 1856–1863.
      Neeldanbluan fasolon manĝas oni la tuton de ĝia ŝelo; sukera fasolio havas plian sudecon.
      Ĝi enhavas abunde plantan proteinton, vitaminojn kaj fibrilon.
  veg.pepper:
    label: papriko
    summary: Brilanta multcolora legomo per sava aŭ pika gusto.
    info: Roja papriko havas ambaŭ sukan kaj pikantan variojn. Rojarojn paprikon oni trovas kun la plej alta enhavo de vitamino C inter ajna legomo.
  veg.potato:
    label: patatos
    summary: Kastana subtera radikora manĝaĵo uzata por multe da diversaj pietadoj inter ampleksa parto de homaro.
    info: Patatostokas originas el la Andoj en Suda Aмерiko kaj estas unu el plej gravaj agrarkulturoj de nia mondo. Ĝi donacas karbohidratojn, vitaminon C kaj kalium.
  veg.pumpkin:
    label: pumpko
    summary: Granda naranĝokolora cirkla tiĥeco; simbolo por Halloween kaj oktobra maniero kuiri.
    info: Pumpko (Cucurbita maxima aŭ pepe) originas el la Insularoj de Novameriko. Ĝi estas riĉa fonto pri betakaroteno kaj vitaminoj A kaj C. La halloween-tradicio kun skulptitaj pumpkoj havas irlandan originon.
  veg.radish:
    label: redko
    summary: Mallonga brulanta rubra korpo vegetalo; antapero kaj printempa delikeco.
    info: Radiko sațiva estas rapidgrasa radikoveĝetablo. Malgrandaj ĉevaloj devenas el la varmo estonteco ruza; granda hiberna radiko kutime blanko (daikon). En Japanio, daikon-radiko estas grava kulinaria ingredient.
  veg.spinach:
    label: paprikao
    summary: Dekarba verda legomo plena de fiero.
    info: Paprika estas originanta el malnova Perzio. Ĝi enhavas multe da vitaminoj K, A, C, fola acido kaj feron. Popeye la maristo popularigis paprikan kiel nutra potencon por infanoj ekde la 1930-jaroj.
  veg.spring_onion:
    label: printempo-kino
    summary: Malpeza kino kun blankbaza trunko kaj verda ŝtango; utiligita en saladeto.
    info: "Printempokino (Alicinium allii-fistuliolo neba Alicinium caepae) estas rekta antaux ol ĝi estis plene matura. \nĜi havas malpli fortan guston kompare al ordinaraj kinukoj kaj uzatas en azia maniero por sazonado de diversaj platenojn inkluzive de saladetoj kaj suproj."
  veg.squash:
    label: patida
    summary: Malsamanformita inveterpomo; baza legumo en okcidenta manĝado.
    info: Inverna patido (Kukurbito) inkluzivas butternut-, akorno-, delikato-kaj kabokho varietojn. Ĝi formigas duran ŝelon por protekti dum monatoj; eblas stoki tute la vinteron. Ĉi tiu estas riĉe plenplena de vitamino J, H kaj komplekso N.
  veg.swede:
    label: tuirino
    summary: Granda viol-koloreca rondformita radikovegetablo; akompanas la skotan hagison.
    info: Tuirino (Brassica napus) estas interkruciĝo de kapustaĵoj kaj repona rizo. En Nord-Eŭropo ĝi estadas populara pro sia sago kaj mola aromeco post kuŝigo.
  veg.sweet_potato:
    label: betatato
    summary: Orange dolĉraduko; tropika radukaĵo kun simila funkcio ol patato.
    info: Kassava (Ipomeea betatata) origineas en Sudafriko; ĝi ne estas rilatanta al patatoj el la sama plantofamilio. Ĝi enhavas multe da bêtakarotenojn, vitaminojn A kaj C kaj fibrion. La oranĝo interna koloro devenigas pro ekzisto de bêta karoteno.
  veg.taro:
    label: tarō
    summary: Granda ŝkarb-holda tuberino per violaj markitajoj; fundamenta alimento en varmzono.
    info: |-
      Tarō (colokasio eskulanta) estas varma-zona tubero kultivita ekde pli ol dekmil jaroj antaŭ nia epoko
      Ĝi formas la bazon por manĝado en Pollinezio, Azio kaj Afro-Europan regionoj; havaiana poī estabas fermite farbita el ĝi.
      Ripena tarō havas malvarmajn guston kun legomo-simila aromeco;
      La purpur-kolorigitaj makulojn sur internaj surfacoj funkcias simbole kiel identigilo.
  veg.tomato:
    label: tomato
    summary: Ruĝa ronda frukto uzata kiel legomo.
    info: Tomato estas botanical frukto kun bobuloj sed en la kuino ĝin uzas kiel legomojn. Tomatoes origine de Sudameriko enhavas likopeno kaj vitaminon C.
  veg.turnip:
    label: tuberulo
    summary: Runda blankofluorkolora radika legomo uzita jam longe en Centra Europo.
    info: Tubera vegetalo de la specio Brassica rapa kiu estas proksima al repao. Ĝi estis grava manĝo en Eŭropo antaŭ ol oni ekportas pataton el Okcidentameriko. Enhavas vitaminon C-a, kalcion kaj fibrion.
  veg.watercress:
    label: ranunkulo akvoka
    summary: Akvoherbo kun forta aromo el naskita herbejo.
    info: Ranunculus aquatika (Nasturtium officinale) kreskas en malvarmaj riveretoj kaj fontanoj. Ĝi havas varmeglan guston pro la gluksinolaato siningrino kaj estas riĉa pri vitaminoj A, B6, D kaj E.
  veg.yam:
    label: yama
    summary: Granda skrobhozeto el Tropiko.
    info: Yamas estas grandaj skrobhazoj el la regiono de Tropikaro en Azio, Afroka Karibo. Ili diferenciĝas per yamo pli sekha, malpli sukera ol patato. Pesa ĝis 70 kilogramoj.
  veg.zucchini:
    label: kukeko
    summary: Verda somera tyka por diversspeca kuiri kun multaj uzoj.
    info: Kukeko (Cucurbita pepo) estas varmklima vegetalo kaptita antaux ol maturiĝas (longeco inter 7–25 centimetroj). Ĝin origine uzis Meksikanoj sed en Eŭropo oni plejiĝigis la italan varianton de tiun planton. Kazeo enhavas pli ol 90% akvon kaj havas malaltan energiadenton.
