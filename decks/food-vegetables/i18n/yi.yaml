lang: yi
pivot: false
title: גרינס און פראקטן
cards:
  veg.artichoke:
    label: ארטיעשק
    summary: גרעסנע גר茵ע באדלעק-געווächסע; מענטשן עissen נאור בעגליכע טייל.
    info: ארטיאשאך איז פון די מער גרען באדלאק קראפט וואס מענטשן עßen נור דעם הארצעניש צו די בלומז אין זייער שפעציעלע ספארמאליגע פארמענדונג. ער ט儘ם אויף בלווערטיקייט, אזוי ווי צינزانאט איבערהעלפטע דורכ'ן ארץ מאכן איין באריין מיט ארויפגעצוקת ארטיושאק.
  veg.arugula:
    label: רוקולה
    summary: פאנעם טמאבענע גרונע סאלעד לעבפלעט; י탈יעשע ליבה.
    info: רויקולה איז דער נאמען פאר די מיטלmeerישע צוויג וועלכע גייט אויף רוקאלעס שטעטליכקי סאטיוויס באזירט אויף עריקה טסיציארייע. עס האפט א קלאר מעגליך, שווערע בראנדנע מאכן דורכאויסגענומענע גלוקוסינולאט. עס איז אינטגראל אין อיטליהניי库ין; עס ווארד אזוגעצעל על פעצ'ה נאך זיי ווארט אנגעקליבן.
  veg.asparagus:
    label: шаפען
    summary: מאכן'רע פרייליגע וויוכנס; delicacy saisonal groisse.
    info: שאפען איז איינע פון די מערסטע געווערלט צו דעם זיממער וואך קראוט אין פרייליגע טייטן. בלויע שאפענע ניידיק סאן אויפגעצוק ענטפארענדיג פונקט פון ש날; זיי זענען מאכן'רע אז גרין.נאכמאל נעמט מען ער האלבאט באקאנט לעבן ריח פון אורין פון 20–40% פון די פעולעניש (אספארagus).דאס איז א traditionale favored vegatable אין דuits (spargel), און פרעזעסכויסץ כושניס.
  veg.bamboo_shoot:
    label: bamboo shoots
    summary: Young bamboo sprouts commonly found across Asia.
    info: באםבווסאָווע וואקסן זענען מלומער באמבס פלאנצטשיקלער דיוויינס דייע געוועלגנ צווישן סיי און נאר טרעיבן קיין מאסקירונג.זיי שטיין אין דעם הארט פונקט פון ציכניסכע, יאפאנעזיסכע און טיילנדזשער קויךני. נענטיגע באם בוواسאוווקנס ערהייטן cyanides און מעגליך שווארצע אויף; עטליכע זענען פריזיגעדיגע.
  veg.beet:
    label: röte beet
    summary: דיימ בערא ברוד גרונדעגלעס; פארגאבנד און אייס.
    info: רעדער שפינטעל איז פיל מיט בעטא נין וואס גיבט דעם רוט צופארן קאלר. עס האלפט מאכן ספארטעם פענומenal דורכ די היפנע זאך אין נייראטשנס יון'ס. וויוועג באזוץ טרייקייטיגע כוווקער פונקטצונג.
  veg.bok_choy:
    label: פק צי
    summary: アジア גריין מאך וואן שוויציגע באמער און שווערע בלאטער.
    info: פאק צויע / בוק טשוי (בראסיקה ראפא סאבספס.צינענסיס) קומט פון דער מזרח.
  veg.broccoli:
    label: бро콜יא
    summary: גראנענעם פעקטאן מיט דיך בלומ בעכ
    info: '"ברוקולי" איז געוויסן צו דער ברוסקאל פאמיליע מיט זיין וואסנדיגע קלאבס אין עטליכע סאמער נאטירליכע אנטי באטיקאנציענטס און ווייטהם סי און כ", "דאס מאך''ה האט איינגעפארטע שפעאר טרעיבונגן אויף די בלוודזש"'
  veg.cabbage:
    label: хלאפווע קרעאל
    summary: רוונדענע בלוyme מיט נוקוואם ליסטים
    info: Хלאפּווע קראולעך איז עטליכער טאוסאנט פון יארן געוואקססן אין אייראפ迂 ווייניג מיטלמעגיקע צוויבל זעלבער שטייען מאכן דאס די באקאנטע סאוורקראט אויברגשפילד.
  veg.carrot:
    label: מערקעוו
    summary: אוראנזש וואורצעל פעסט מעגליך סוד.
    info: מערקעוו איז ניידער געוועקסן פאר זייער שפינאטיגע אוראנזש ווארצל מיט עטליכע יאָרן צו דרייפיליקייט. עס איז שוין אין ביטה קראאוטענען (פראווויטאמין אי) און פיבער.
  veg.cauliflower:
    label: bluma ка бо
    summary: שוואוץ באקומענדיקייט פון זייערע טרייבעלע מעגליך צוויי בערגישע פרויקט
    info: |-
      Blumakaboles (בראסיקה אוילרוססי וואריאנט בוטריטיס) איז געווachsen מער צו ברוקולי
      די שוועisse פארבעرنיג קומט דורך די בלätטרס' שילדן די הוך נאך דעם סוננע, וועלכע האבן אנגעהאלפן צו מאכן כלאורופיל אין ערשטע ערשיינונג
  veg.celeriac:
    label: balgvikler
    summary: Grayer balgfunkel mit intensiver iklersmack.
    info: Balgviklerer tsukunft fun Apium graveolens var. rapaceum iz di form un farb fontragen af dem wasserhafte balgfunke. Es hot en stark feniger smak un duif un geyt farn opbereitung von suppen, senep-salat un gebratenis.
  veg.celery:
    label: פארניסל
    summary: קרופף גר茵 שפעציע מיט א חזקוועם אראטאמ
    info: "Parnisel (Apiim graviolen) קומט פון די מעדיטערענישע געגנטלאכקיַטען\nעס איז באזירט אויף דעם טרעיבונג וואס צו עßen парניסל נוצט מאך קלאריער'ס ביי ספוענעמען ווי ער לינקט זיין; מעגליך הייסט דאס נייגנדיק אין ריאליטייט. \nes איז איין פונעם תלת של חום פראנצויסקאנדשע כוכב האוסהאלטונג: מירותפיקס (צימבל, מרווועל, пар尼斯ל)."
  veg.chard:
    label: מַנגולד
    summary: באוורנענאג לעף בעצעכע מיט טרעפן אбо ריינוועל פענלעך.
    info: מאڠאלאד איז פון דער זעלבע באטעה וואלגעראיס סאב ספרעסיי ציקלא אינזשטענדיג קיין רעדן ראפטאפפאל. עס האבן גריין, רויטע, אויבר ער לאווענט באנדן שטייעק'ן מיט די מאסקירונעם. עס איז שוואר נארוואמענץ אין וויטא岷עס קיי, אייך און סיי און מיניראלן ( קלציאום, מגנזיום).
  veg.chickpeas:
    label: Cheserna
    summary: Runder beigefeger binye; grundlage von himbus und felafilim.
    info: "Chesernishe (Cicer arietinum iz di beliebte binye flegeme fun dem Naechsten Oste un Indien\nIz di grondlag far himbus (cheser paste) und felafilim (gebraten boeren). \nReich an planntlikem proteyn; belibbt אין veganisher un vejetarischer erneharyung.\nWasser פון chesener (Aquafaba) ersetzet eierweiß beim backen."
  veg.chili:
    label: чиיל
    summary: פארנעם רויז ראדו אбо גרוני פארפקעס; איינו פון די חוטים פון האץ קווכאנציע.
    info: 'Чיללע פאפריקעס (קאפסיפום אן נומער אד'' ספאל.'') זינדן וויכטיג געווענדטע אוודרונגען פון פארפיקעס מיט ענטצופנע פעקטאר. דער בלאם צור קרעגונג רעלאטירט צו די שטווארטשקי מאסקה капזאסיעין, וועלכע מעגליך טעסט אין די שוולליי ערנסטר скале (יאלבאןענו: 2,500–8,000 SHUs). די באוווקונג פון כ'
  veg.corn:
    label: מאיסט
    summary: גאלדאנע פרייך אין רעדן שטייענדיגע נוקעס אויף א שוועף.
    info: '"Mais" iz afgeklapnt פון מיטלע אמעריקע איז עטליכע וואך דער טאג''ס מאכטיגסט גרעניש צוויצן קאפט נאטירונגענע סוכארידזש, פרטעין און ביוויסמייניק זייער בא גרופפ.'
  veg.cucumber:
    label: kuke
    summary: Lange grune greenerie mit koltender, saftiger fleshy.
    info: '"Kuka" iz af di troykisher greenerie fun der gumbel famileye un het 95% vosser. Es iz kaltendik und beliebt yn slawen odear als snak.'
  veg.eggplant:
    label: אַבארגין
    summary: דויפעל פרפל פעלוידיגע גרירן; באנוץ אין מאוססקאה און ראטאטאויא.
    info: |-
      אָון פילען איז געווענליך צו ענדיגע קוקעריעס ווי מאוססקה אויבר ראטאטואילה;
      ezשטעקט אין דעם מיטלמערגישע און נארדזשיונגענע כוכינע;
      zאלעס טרעכגיקייט זיין באלאנגצונג צווישן די שפילן.
  veg.endive:
    label: צאקנكا
    summary: ליכט גר茵 לאבענדיגע זאלאט.
    info: צעקאנקה איז עין גרויסער צוויק מיט באזונדער שפיץ טישונג וועלכע פילט מען אין די שווערציגקיטעס משפחה. דיא בלוואר קומט פון נאך אויפגעצויבן אין די שאצער (שיךאריעריי), אбо פון סאן לעכאמענט (וויטלואף). די שוועrtcקיייט איז געוורן דורכן אינטי宾 איידزينגענע מאגיערן.
  veg.fennel:
    label: פיניקעל
    summary: וויße באלוועלג מאך'נען מיט פריערדזשענדзе לעבערן און סווועטע анיז טעסט.
    info: פיניקל האט א סווועטע אניז טעסט דורך די ענטאנהאליגן פארבינדאנץ אניתול. מען ייסט די בולה, שטיין וואס צו גרייס אין מיטלמערישער קוקשניאפט זיך נוץ.
  veg.garlic:
    label: צע 신
    summary: עס איז א שווארם שפיץ באלויפטער נאטירלייך ראממער.
    info: צינען ווערט געוורנדט אין קיכער אסאך טויזאנד יאר אלץ צווישן פון ספארנונג און מעדיקומנט. עס האלפט מאכן בקטריענען דורך זיין אליליס.
  veg.ginger:
    label: zingaber
    summary: קנאבליכע רוט יעדן מיט א שוועך און ארומאטישע טASTE.
    info: זינגעבר איז עין וואסער פון צוויקען דעם קאמט מיטל באשטענדיג טרופישעiasi. ער האפט גינגאראל, די סאבסטאנס וועלכע מאכן'ו זיין שפיץ און אנטי איןפלאםמאטוריער. אויספארכאונגן נוצן זייערע בעווייזן אז ז茵גבערא ברענגט הילף ביי נעמענקייודנען.
  veg.green_beans:
    label: פאזאלובע לוסקיע
    summary: פארנוממעט גרינע באנס לעפטלעך
    info: '"פאזאלווע קעסי" זענען פארנוממטע גרענאדעלעס מיט א ווייסער שטוף אין דעם צווישן די בלאetter האלף אויפ''ן סטיקל.'
  veg.kale:
    label: קאפלעס
    summary: דויפעלגראוניידיגע לאוויןבלאטשע; סופרפוד.
    info: '"קעפוסטע קאדעראוו" איז דינאך גרויס צווער וואס פילט מיט נוצן סאפארפארמיגליכקייט. עס איז באקומענענדיק אין ווייטהם קייוון, איינווונדונגס מאכטליך אויב מענטשן האבן זיין טרענגן באנוץ אנטיוקسيدanten. די שפעציע נעמט ערלויבnis אין בעגריף "スーパーフード" דורכאויס לאמף יאהרן.'
  veg.kohlrabi:
    label: rabichohl
    summary: גרינגע פריידעם מיט ראנדיישע בעלב עלעקטערן אויף לעבן
    info: Rabichohl (ברסיקה אולרעאסי גונגלודעס) איז עטליכע זעלן מיט דער צימלספאמיליע פון בראסיקע אוเลראצעה וואו מענטשן איי מאכט קאפוצ'ין סאלעד אין די שטייך נאר בלאדזש ער טריאנדוועליגע באקומען.
  veg.leek:
    label: פארוקען
    summary: גרוסה מילדנע ציבל פעסטונג; באזיס פאר סופן און ראגוא.
    info: |-
      פארוקען איז פון דער זעלבע משפחה ווי ציבנשאפט און טילן;
      dאס אס א געווענליכע סימבאל אין ואלס יוגט מענטשן קיינעם אויף די שוויגל באנד עטליך מאונצח;
      es enthält Allilцин און Vitamine K און C;
      pürree soupe is traditionell אין בריטישער, פרונצעסicher un צעצכischer קווכין.
  veg.lentils:
    label: דאל
    summary: פלוישע ליסטן פון לעגומיניים; העפטיגע קוועל האלבבעצאנגע פארמאלא.
    info: לינס קולענאריס איז איין פון די אלטעסטן ביבער גרעכטיגkeiten מיט דריי טווזנט יאָר וואוס צוגעלייען. עס gibt רודע, גרירנע, בראונוע, און שווארצע סורטים אין נאטשונעלע מאמענטיקייט. מעגליך צו באקוקן אויפ'ן שפיל נעבן זיין בעניימlichkeit.
  veg.lettuce:
    label: גלאביקאווישע סלט
    summary: ק芦ך ליסט פעיליגע; מאכן ער מעגליכקייט פאר גריין סלאאט.
    info: |-
      גרין סלט איז געווען פארמאכיג מיט דעם אלע עגיפטער זינד די אנפאנג צייטן;
      es האטמער ווי ניון% וואסער אין אייך קאלוריענ' טרעפן שפעציעל בלוימ;
      dאס איבערגעוויסן באזירונג פונקט פון גר茵ע סלאאטס,
      vוידע אוואריאנטשאפטן: ايיסבראג', ראומאנע, לאולאן, בערטראהייד, עאק לעף;
  veg.lotus_root:
    label: ලොටසය මතකර
    summary: פרוץ פון לאוטאס כורה עם חרבות פתוחות; תוצר asiatית.
    info: לעפּטן קאמער איז דער שורש פון די הייליגע לעפטוס מפעגסיערא וואו מענטשן נוצן אין צentralアジアנישע מאכטליכקייט. עס האבן סיממטريسירטע האלעס אויפ'ן פרוץ וועלכן זיין באקאנט אלץ געליבדיקייט אין טשערנעסיי, יאפאניזי, אינדייניזישע מאךצעלייך. ער חתול על וויטאמין סי, בי6 און קלאריאם.
  veg.mushroom:
    label: שימל
    summary: בלאווי-בראונד קאפeligע שימלבאנק גebraucht אין קיכנה.
    info: ג Camden צוויי מאכט איז די מערסט פאקטאריאסטע שימעל אין דע וועלט. עס איז ערפאלן פון פראטאין, ביוויטamines און מעינערייער; געווענליך נוצט אין אלץ ספעישעס.
  veg.okra:
    label: אווקרא
    summary: גרינע בערגטונגענעם לוסקמער מיט'ן שאפלידיגע טэкסטאר.
    info: אוקרה איז די באשטעם פון טרופישע אייראפ וואס גייט מיטן נאם Abelmoschus esculetus. עס איז דער הילף צו דעם אמריקאניסצכן מאכטל גאמבו; די שלאפנדיגע טעקסטור האלפט צוברingen סאסעס. אויב מענטשן קritzן זיין אין בלוyme, אזוי וועלן זיי רעדנען וועגן sterne.
  veg.onion:
    label: צעבוונה
    summary: פאנגן שיך סלאיידנדע באלג'אן פאר דורכאונג.
    info: ציבענע קיכלינסשכע איז איין פון די מערסט געווענטע זעלן אין דער וועלט. עס נוצט צו דורכן מאכלונגען ארבערמענטיג אויף דער וועלט; עס האльт فلاווואנוידעס מיט אנטי באקטריאלית פעקטאר.
  veg.parsley:
    label: פארן
    summary: געלב גרין באומפלונגס ארבה
    info: פערן פון די מועטשע איז געוואוסן צו נוצן אלס קארינג ווייל ער האלפט דעם באלם מאכענעמער טרענקיונגענטישע פעקטאראזען אויסצוטרייבן. עס זינד צוויי סאטיגייטן - ריאך אנדרוקן אין שפעציעלייעטע מעשלעמסchaft.
  veg.parsnip:
    label: passtinak
    summary: Kremelik weisse wurtzel; middeleevel afrukhtbare grunfrukt
    info: |-
      Passtinak (passtinaka savita) iz di grune frucht fun der passtinashe pflanzung
      Es hot geven afgelehnter eetgab vor dem kamen fun de pataten; es iz heutiger tsayt minder verbreitet
      di smake is sveyes un nockhes; nach em frosch vertsehligs sechs sweeter
  veg.peas:
    label: פרי
    summary: גרינע ברודנע קוגלעס אין א לאם.
    info: פריים פון דער ספעציע Pisum sativum איז געגאנגען מיט די ערשטע מענטשן וועלכע האבן אנפאנגט צו קאלטיםמער. גריגאר מאנדעל האט ערפארסאך פרים אין זיין ניסות על 유ידות בזווישן ١٨۵٦ אויף ١٨۶٣. שוע פRIES' באשטייקל איבערהאט די געהולף, ווייל כולם איז אייך אזויווי די לוסק.
  veg.pepper:
    label: פארפיקא
    summary: גלויבנדיגע באראבשאפטע גרייןעם מיט זודגע אויף שוועך אדער שארף.
    info: '"פפריקע" קומט אין סווועטע און פינקליכע וואריאנטס. דער רעדנע "פפריקה" האט די הוייטסטן צאלק范 טוורם סי מיט אלץ מעגליך גרעננס.'
  veg.potato:
    label: פורט알
    summary: '''ן בראונדן טאפער וועלכע מעגליך נוצן אויף מאך פעלווער לישכויבמעל ארעוואר.'
    info: פארטאלן קומענדיג פון די אינדיאנע שפילער אין דרום עיראפע וואס ער'ס איין פונעם מוסטע באדייליקע גרענשלאכטליכקייט באנוץ צו זיין. עס איז 'אן סורקאס פאר שאכארידזש, ווייטהאם סי און פוטаш.
  veg.pumpkin:
    label: динע
    summary: גרייסע אורנגע ראונדע טייקעװ; סימבאל פאר האلوווייען און ערעפטע מאכטע.
    info: '"דינע" קומט פון דער אמעריקאנישע נאטיר וואס איז ערפאלן מיט ביטה קרוטאן, וויסם איי און סי. די טראדיציע צוברingen אויף האלוועין אין爱尔兰 גייט זיך אויפ''ן סאך "잭-או-לנרטן", אבער מעגליכקייט אזוייגן צוויצשענע שפילמארקונגען.'
  veg.radish:
    label: רדיקוו
    summary: ק萊נג מאכטליג רוים ווארצעלב卢; האפלונג און פרינג לעקט.
    info: רעדكيف (ר أفאנוס סאטיוויס) איז עין שפילענדיג וואקסמאר מיטן רוטער פלאץ. קליינע גארטנע ראדייש אין זוממער סיי דרוימליכגראס; די בלויע ציילנשטע באזירט אויף נאוועם ערדורפאלט מעגליך אלס טייטאן).
  veg.spinach:
    label: шפןאט
    summary: דארק גר茵 ליסט פעסלעס אין טרעף
    info: Шפенאט איז ערשיידען פון ווייטעמער קאל, עס איז באזירט אויף ספיינאץשע מאכונגעניש (spinachia olearcea). דאס גריין האלפט צו שטייערן די ניידיגקייט פון בלווד זילברסטאב מיט אייסענע מעטלעריקייטן.
  veg.spring_onion:
    label: פארנער באנדן
    summary: דאס איז א נעמענע בעאן מיט איinem וויכיגן באאז און גרונגענע שטעפל.
    info: פראימע און נאך גערשטעלט פארן צווישן דעם ווייסן באזיר און די גרינע שטייפל קלאסיציסטישע סאלאט ענטהפטונג אין א זייער טרעף מאכשין.
  veg.squash:
    label: טייווע
    summary: וויוסנדיגע טייפ פון צيمنישע טיקאווען; בסיס פראקטישע אפטערשטעלער קווכ沁.
    info: צימנישע טיקעווען פון די ספיזיעס קוקורביטא אינקלודירט באטרנעוט, עקערן, דיליגאט וואונד בוך אוفردמער. זיי ערשיין'ן צו מאכן 'ן הארט שאלץ וועלכע שאצעם מאנטע; מעגליך נוצן גאר די וויינשטע אין דעם. זיידען ריכטיג פולגעמיט וואריאנטן פון ויטהאם אייסלעך, סייבنز און בענקאפלאקס.
  veg.swede:
    label: turzin
    summary: Große blau-gelaubte warzelgemuese; schottischer Haggi's begegnung.
    info: Turzin (Bresika napes) iz ein mischling fun kale un rebepele. In amerike hot es der namen Rutabage; in schotland is er an onlosbare begleitung zum Haggis. Er hat en sware un feiner wuren geshmak nach gekocht ze vinzen.
  veg.sweet_potato:
    label: בּאטאם
    summary: אוראנזעווע שווארצע הילצה; נישט מעגליכע ברודער פון די מאלץ שטיין
    info: |-
      Bataat (ipomoia batats) איז פון צentralן עיראפע; ער האט נישטא קיין באנד מיט די מאלце שטיין אין ביאלאגיעעמער זינס
      ער וואלייג דורך בעטע קראטאן, וויסנשافتן איי און סייען אויך סיברן
      די אוראנזעווע טונגע גייט דורכאויס אנגעהאלטן דורך בעטה карאטאן
  veg.taro:
    label: טאראו
    summary: גרוס שקראבאטיקע הלויסה מיט בלאיווי ספארנס; טרופישע בעאזיפאן דיאט.
    info: טארו (Kolokasije Eskulentaje איז טראפיקע הלייסן וועלכע געווענשטייגל פון מער אלס צוויי תקופות קאלנדאַרישע מאונדזש. עס איז די באזה פאנקט דיאט אין פוילנעסייע, ערפאה און אziej; האוואיע'ס पोइ איז פראמנטירטע טארו.
  veg.tomato:
    label: טאַמאָטה
    summary: רעדער רונדלעכן פריי מאג מען נוץ אלס שווארצע.
    info: טאמאטא איז באוטאניש פראכטע (באבעלען) וואס געווענליך נוצ'נד זיך אלץ מיטלידיג צו קוקענען. עס האבן סוד אמעריקאן אורינגלעך און דרייכט ליקאפין און ווייטהאם סי.
  veg.turnip:
    label: וואסער
    summary: ווייס ערדראטן שורש בעלאג; אלט מייצונג פון מזרח-איראפע
    info: |-
      Wundlinke (בראסיקה ראפא) איז נאך פון די וואסער באזירט אויף ברוסיקע ראפע
      עס האלף צו דיאץ אין אייראפע בייפאר קאם מיטן טאלפונטעמער מעגליך מאסקעלינעם זייערע סעדנע געווענישן
      דארפיילכ' ווייסט עס פאנגענדיגע פעקטoren ליבשציפיד', קל从前钙以及纤维素
  veg.watercress:
    label: ririkha vedne
    summary: קליינע דייסטעלע גרירנעד פעפלונג האבן זייערע טאם.
    info: '"Ririkha vedne" (Watercress – Nastyurem offisinal) wächst אין קühנע בächלעך און ברונן מיט פארפלויגנדער טעם דורך גלוקאָסינלאט סינגראין. עס איז ערמאבעדיק צו וואמער C, K און בעטאكارאטאן.'
  veg.yam:
    label: ям
    summary: גרייסשע שטורף בעין טרופישע שטאפטעל; אויפנעגעצן מיט באראאט.
    info: 'Yam (דיאוסקארעא ספיזיעס) איז נייג גרויס טרופישע שטאמפלער וואן מיטל אין דרום אייראפע,アジア און די קרייביקן. עס האנדלאכטע פונקט צו באראאט: ים איז דורממער, מאסקעסער און מענער זווועך. עס קאנסט väsen ביים מקסימום 70 קילאגرامמען.'
  veg.zucchini:
    label: קייטה
    summary: גרין סאמפטער צוויקל; פעקטישע גר녹ייט פאר בעקואפונג אדער באכאך.
    info: Kykete (צוקורביטא פּעפואו) איז נייגער גרויסונגען קליינס האטמער סוממע르 צוויקל מיט דעם ווארם ער באזירג'נד זיך אויף מעקסiko; אין אייעראפע שווערע די יטליאנישע שטייערן. עס איז מאכשטענס 90% וasser און לויפיג קלאריע. עס איז אנגעזעהן אלץ אן אריבערנע עלעเมนט צו רעלעסן נודלס ביי לאקף פרויבעט.
