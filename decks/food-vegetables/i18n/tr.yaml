lang: tr
pivot: false
title: Sebze
cards:
  veg.broccoli:
    label: brokoli
    summary: Yağlı gövdede yoğun çiçek başı olan yeşil sebze.
    info: Brokoli, lahana familyasından bir yeşil sebzedir. Vitamin C ve K ile antioksidan açısından çok zengindir; İtalya'dan köken alır.
  veg.carrot:
    label: ıspanaklı
    summary: Tatlı bir portakal rengi köklü sebze.
    info: Ispanaklı genellikle turuncu renkte salatalık köküne sahip iki yıllık bitkidir ve lif ile beta-karotene (provitamin A) zengindir.
  veg.corn:
    label: mısır
    summary: Sarımsı renkte, yumuşak ve suyuğu dolu taneler taşıyan bitki.
    info: Mısır Orta Amerika'dan gelir ve günümüzde en çok ekilen tarım ürünlerinden biridir. Taneleri şekerler, proteinler ve B grubu vitaminleri içerir.
  veg.cucumber:
    label: salatalık
    summary: Soğukkanlı ve suyu bol olan uzun yeşil bir sebze.
    info: Salatalık, tropikal bir sebzeye ait Cucumis sativus türünden gelen, kabuklu meyvelere benzeyen bir bitkidir. Yüzde 95 oranında sudan oluşur; bu nedenle yenildiğinde serinletici etki yapar ve salata ya da atıştırmalık olarak tüketilir.
  veg.garlic:
    label: sarımsak
    summary: Ağır kokulu ve pırtı hissi veren beyaz bir soğan, birçok yemeğe tat katmak için temeldir.
    info: Binlerce yıldır mutfağımda hem baharat olarak hem de ilaç olarak kullanılan sarımsakta antibakteriyal ve anti-inflamatuar etkisi olan allysin içerir.
  veg.mushroom:
    label: mantar
    summary: Sarı-kahverengi bir başlıklı mantar türüdür.
    info: Agaricus bisporus olarak bilinen bu yemeklik mantar dünyada en yaygın şekilde yetiştirilen mantardır. Proteinler, B vitaminleri ve mineraller açısından zengindir; birçok yemekte kullanılır.
  veg.onion:
    label: soğan
    summary: Yemeklerde baharat olarak kullanılan keskin tatlı katmanlı soğan bitkisi.
    info: Soğanlar dünyada en çok yetiştirilen sebzelerden biridir. Yemeklere eklenerek lezzet verilir ve antibakteriyel etkilere sahip olan flavonoidleri içerir.
  veg.pepper:
    label: biber
    summary: Yüzeyi parlak olan, tatlı ya da acı bir tada sahip renkli sebze.
    info: Kapsiyum olarak da bilinen paprikalar hem tatlı hem de acılı türlerde bulunur. Kırmızı biber tüm sebzeler arasında en yüksek C vitaminine sahiptir.
  veg.potato:
    label: patates
    summary: Kahverengi bir kök bitkisi olup dünyada birçok yemeğin temelini oluşturur.
    info: Patates Güney Amerika'nın And Dağı'ndan gelir ve dünyanın en önemli tarımsal ürünlerinden biridir. Karbonhidratlar, C vitamini ve potasyumun kaynaklarıdır.
  veg.tomato:
    label: domates
    summary: Yemek olarak salatalık olarak kullanılan kırmızı yuvarlak bir meyve.
    info: Domates botaniksel olarak bir meyvedir (çekirdekli meyve) ancak mutfakta salata bitkisi gibi kullanılır. Güney Amerika'dan gelir ve lütin ve vitamin C içerir.
