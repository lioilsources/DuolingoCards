lang: el
pivot: false
title: Λαχανικά
cards:
  veg.artichoke:
    label: Αρτίχωκα
    summary: Μεγάλο λαχανικό βλαβερό - φυτό · φαΐνε τα νεαρά σπόρια.
    info: Το αρτίχωκα είναι σπόρι του μεγάλου θυμέλαιου φυτού και γεύση δριμώδης ραφή ποτώ· γι' αυτό το Cinzano και το Cynar martini περιέχουν εξώθημα αρτίχωκα.
  veg.arugula:
    label: ροκόλα
    summary: Πολύχρωμη φύλλωδης χλωδή.
    info: Η ροκόλα είναι από τη Μεσόγειο και γνωρίζουμε στη Γερμανία πώς να λέγεται με βάση τη δυτική φύλλωδη χλωδή.
  veg.asparagus:
    label: Ασπράγιντα
    summary: Λεπτός ψυχρός νιφάδι· Δημοφιλής εποχιακός φύκων
    info: |-
      Το ασπράγιντας είναι μία από τις πλουσιέστερες χειμερυθή φύκων στη θρεπτική αξία και γεύση
      Ο λευκός νιφάδι διαχειρίζεται όπως βοτανικό αντιβιώτικο;
      Είναι πιο εύκαμπτος από τον πράσινο,
      Προκαλεί υψηλότερο ρυθμό αντίδρασης στην ούρηση (~5%) μετά την κατανάλωση
  veg.bamboo_shoot:
    label: βλάστημα
    summary: Νεαρά βλάστημα του μπούνικ· ασιατικό λαχανικό.
    info: Τα βλάστημα του μπούνικ είναι νεαρές ρίζες που συγκομίζονται λίγο αφότου φυτρώσουν και θεωρούνται διαχρονική γεύση στην κινεζική, japonική και tailaνδική κουζίνα.
  veg.beet:
    label: Κόκκινη ραφάνι
    summary: Σκούρο κόκκινο στρογγυλό υψηλό φυτό · χρωστικό & τρόφιμο.
    info: |-
      Η κόκκινη ραφάνι αποτελεί πρωτεΐνη του βήματος Beta vulgaris είχνει να έχει μέσα συγκεκριμένο φύλλο για λεβάντισμα διαιτητικών προϊόντων
      Είναι πλούσια σε νιτρικά, τα οποία βελτιώνουν την αθλητική απόδοση και μειώνουν την πίεση του αίματος,
      Ο καστανός σάκχαρος είναι διαφορετική ποικιλία· είναι πηγή λευκού σακχάρου.
  veg.bok_choy:
    label: pak choi
    summary: Ασιατική λαχανόκουμπά με λευκό στέλεχος και σκούρα φύλλα.
    info: Το pak choi ή bok choy είναι μια πράσινη λαχανόκουμπά των αυτούς χώρες και συγκεκριμένα βλήθηκε να φτιάξει για δύο λεπτά σε ένα wok με σκordó και καφέ.
  veg.broccoli:
    label: Βρόκολος
    summary: Φυτό με πυκνή ανθηφόρους κεφαλές σε παχύ στέλεχος.
    info: '{"hint":"πράσινο λαχανικό με πυκνή ανθηφόρους κεφαλές","info":{"label":"βρόκολος","summary":"Πράσινο φύτο των βρώμηδων χρίζει σε ιταλικές εξαιρετικές διαγραμμίσεις για να περιέχει βιταμίνη Γ,Κ & antioksidants"}, "info": {}}'
  veg.cabbage:
    label: Λαχάνο
    summary: Σφαιρική φυσική βλάστηση με δέρμα.
    info: Ο λαχάνος είναι μια πρωτόγονη χλωρίδα του Brassica oleraceae καλλιεργούμενη στη Ευρώπη για αιώνες.
  veg.carrot:
    label: αγγουριά
    summary: Κόκκινο ψητό φυτεμένο χλωρίδιο.
    info: '{"hint":"πορτокαλί διαισθητικό φυτεμένο ρίζωμα","info":"Η αγγουριά είναι πολύχρονη βλάστης τη θήβα για να μαγειρεφτεί στο κόκκινο λιμώξιδο. Διαθέτει πολύ βιταμίνη C(ΠΡΟΒΙΤΑΜΊΝΗ Α) & ίνες.","label":"αγγουριά","summary":"Κόκκινο υψηλό φυτεμένο χλωρίδιο."}'
  veg.cauliflower:
    label: Λάχανο
    summary: Πολύψηφος λευκός «βοτανικός» ; Γερμανική εξέλιξη.
    info: Το λάχανο κουκιού ή χρυσόλεπτη είναι συγγένς των βρώμηδων παθήτων αφού δε μπορεί να φωτοσυνθέσει γλυκόζη όπως τα φυτά - το λευκό χρώμα του οφείλεται σ' αυτό.
  veg.celeriac:
    label: Παγκάρδι
    summary: Μεγάλο λευκό φλοιώδες βύσμα απιμού· βάση για διάφορα φαγητά.
    info: Το παγκάρδι της Μεσόγειου είναι μια καλλιέργεια απιμου στήθων για να χρησιμοποιηθεί το βύσμα του.
  veg.celery:
    label: Ραπικάτο
    summary: Κρουπαφή πράσινη λαχανική που περιέχει ιώδες;
    info: Το ραπικάτο παγωμένο λεβάνι είναι αυθεντικό του Μεσογεϊκού και σχηματίζει μέρος της βάσης για φρέσκα νήματα - διαδικασία που δεν έχει επιβεβληθεί.
  veg.chard:
    label: Μανγκολ
    summary: Πολύχρωμη λαχανική φυτική με υποκατηγορίες ως προς το ύψος.
    info: Το Mangold είναι συγκριτικό της κόλασ πεπούνου βάζων από μέχρι να χρώμα ή διψήφιο φύλλο για λιβαδικό ροϊκό. Διαθέτει πράσινα, κόκκινα, κίτρινα η «αξιοθρήνη» ψηλότερα στον κορμό.
  veg.chickpeas:
    label: Γαλούχη
    summary: Κυκλικό φυσικό λουστενόβιο - βάση για Hummus & Falafel.
    info: Η γαλούχη αράκνι ή Cicer arietinum είναι δημοφιλής λουστενόβια σπέρμα που χρησιμοποιείται κυρίως τη νότια Γκάζα μεγέθους βλαστών.
  veg.chili:
    label: Χίλι
    summary: Πικάντα κόκκινη η πράσινη πικάντα· βασικό συστατικό της πικάντας.
    info: 'Η πικάντα της χίλι ή αφγανιστάν κόκκινο μπρουμέ σχήμα είναι δύνατες φυτώξεις βαθμωδού νερού Capsicum annuum. Η γεύση λόγω capsaicin, μετράται από τη Skovill scale - jalapeno: 2500–8000 SHUs, Carolina Reaper > 2 million SHUs). H evolutική λειτουργία του capsaicin είναι να αποβάζει από θηλαστικά, αλλά όχι από πтиγκάδες.'
  veg.corn:
    label: Γαϊδουρίς
    summary: Πολύ χρὼμα ἂν ἢν ἁπλῶς ẫὰν ἓχῃ ᯖὐρᾴδᾱς ἅπαν Ἐπὶ Ἔρρῳ.
    info: '{"hint":"πολύ ψηλό φυτό σιταρένιου με κίτρινα δάχτυλα των αμερικανών ιθαγενών ποσειδῶνων","info":"Η γαϊδουρίζεται εξ Αμερικής νὰ βρίσκῃ ἀφ᾽ ὧν ᾿ἐστὶ λεῖψις ἐπὶ πᾶσιν τῇ ἄγρῳ· ὔπὲρ τῆς ἰδίᾳ Ỵὸν ἔχει σακχαρίδας, πρωτεΐνας καὶ βιταμίνας τῆς Γραμμῆς Β.","label":"Γαϊδουρίς","summary":"Κίτρινὴ ḱρῑ̃νη ἡ ἥλῐ ἦν ἕκᾰστον ẗϲ ᶠᾷ̣ν ᵮὺν ᶈῤῥῷ."}'
  veg.cucumber:
    label: Αγγούρι
    summary: Δροσιστικό λαχανικό με ροζ πράσινο ύφος.
    info: '{"hint":"μακρός πράσινος κυλινδρικό φύτεψη θέρους","info":"Η αγγουρί των χώρων είναι μια βότανο σποροφύτων από τη νήσο Cucurbitaceae. Διαθέτει 95% νερό, δροσιστικό γεύση και λαχανικό σαλάτα ή ως snack.","label":"Αγγούρι","summary":"Μακρό πράσινο λαχανικό με ψυχρό, υγρό σάρκα."}'
  veg.eggplant:
    label: Αγριελαιατό / Aubergine
    summary: Φυτό της Βόρειας Εβραΐδας
    info: |-
      Το Αγριελαιατό απέκτησε το όνομά του στη Γαλλία και πήζεται εδώ για δύο με τρία αιώνες
      Συχνά φτιάχνεται σε λεϊψάνωμα ντομάτας,
      Ο βαθύς μαύρος χρωματισμός του οφείλεται σ' ένα φυτοξανθίνη
  veg.endive:
    label: Αχίλη
    summary: Πρώτο βήμα στην εξίσωση.
    info: Η Αχίλης εμφανιστήκε στο πρώτο μέγιστο του από κάθε φύλλο όπως δεδομένο για να λυθεί.
  veg.fennel:
    label: φινίκλι
    summary: Λευκή βούτυρο με πέριβλαστρα και γλυκή ανθρακόχους.
    info: Το φινίκλι ή Foenicolum vulgaris χρωστεί τη γλυκή ανθρακόχους στο περιεχόμενο εξάνθρακο και μπορεί να δώσει λύγισμα στο σώμα.
  veg.garlic:
    label: Φέτα
    summary: Σπόρος Allium sativum - βασικό συστατικό της γεύσης πολλών πιάτων.
    info: '{"hint":"πικρούν ρόδα λευκή που χρησιμοποιείται για ελάφρως τζίντο και αγώγιμο σκοπό (Allium sativum)","info":"Το φέτα θεραπεία με βάθος διαχρονική να υποβαθμίσει την προϊόντας ως σπόρος και φάρμακο.")","label":"Φέτα","summary":"Πικρούν ρόδα με έντονη οξύτητα, βασικό συστατικό της γεύσης πολλών πιάτων."}'
  veg.ginger:
    label: Ζινγκίμπερ
    summary: Κομβώδης χρωματιστής όρχις με αδραχτική και αρωματική γεύση.
    info: Το ζινγκίμπερ είναι ρίζα της φυτωσύλου που καλλιέργεται στη νότια Ασία· αφθονεί με γινγκερόλ, δραστήριο σώμα που βάψει την αδραχτική λειτουργία και τις αντι - φλεγμονώδεις ιδιότητες · Διεξάγονται πολλές έρευνες που αποδεικνύουν την αποτελεσματικότητα του ξινγκίμπερ στην αϋπνία και την αδυναμία.
  veg.green_beans:
    label: Φάβα
    summary: Μακρά πράσινα φάβα·
    info: Τα φάσολι σπόνγυρες αφαιρούνται πρίν ωριμάσουν και είναι γνωστά με τη λέξη english peas ή snap beans.Περιέχουν βιταμίνες Γκ ,ΚΑΙ folic acid .Ένα δημοφιλές νήμα σε αμερικανικό γεύμα είναι το green bean casserole.
  veg.kale:
    label: Καπουστά
    summary: Σκούρο ροζ σβούρα φυλλωδής λαχανική διατροφή.
    info: Η καπουστά με την ελαιούχικη φυλλωδή πρόσθεση αφίγγουμένης ή βλανσιρώνοντας για να λιγοστεύσει.
  veg.kohlrabi:
    label: Rabarbaro
    summary: Λαχανικό με γκρίζο – πράσινο βολβό στα στελέχη ; συγγένης του πάσπλου.
    info: "Το κενταύριουμ είναι λαχανικό συγγένης του πάσπλωμα χαϊδεβών ή βρασικής αφθονίας γονιμοποιημένης με διαφορετικό φυτολογικό νούμερο Brassica oleraceae gonglyodes). \nΦαγοντίζεται το βολβός -ξυλώδης στέλεχος-, αλλά και τα φύλλα\nΈχει εύκολη γλυκο-ψιλή γεύση· τρώγεται ψητό η βραστό,\nΗ ονομασία προέρχεται από τη Γερμανία · «Κούλ»= πάσπλο,«Ράμπι»= βολβό.\nΕίναι δημοφιλές στην Ινδία ,Γερμανία & Σλοβακία."
  veg.leek:
    label: Παρσίμινθος
    summary: Μεγάλο ελαφρύ φυτό μπύζης.
    info: Το παρσίμινθος είναι συγγενές του κόκκινου μπύζη ή αδάτων. Δρώντας ως δική τους φυλλοβολία για να βάφουν λευκόχριστα αξιώματα.
  veg.lentils:
    label: Σους
    summary: Πολύ βαζμένες λυκήθρες· ντεφέρβατος πρωτεΐνης.
    info: Η σους είναι μια από τις πολύ γηράτερες λυκήθρες· καλλιεργείται χωδέψ έξι δώδεκα φορέσ.
  veg.lettuce:
    label: Λαχάνι
    summary: Πράσινο φυτικό τρόφιμο· βασικό συστατικό πράσινων σαλατών.
    info: Το λαχάνι πρωτεύουσας μπλέκε έγινε γνωστό από την εφημεία στη Γιβυδή και χρησιμοποιείται διατροφικά από νεώτερες φθινοπωρινές περιόδους. Διαθέτει πάνω από 95% νερό και είναι βασικό συστατικό των πράσινων σαλατών.
  veg.lotus_root:
    label: Ρίζα λοτού
    summary: Προσεγγιστική τομή της ρίζας του λοτού με όμορφα ανοίγματα · ασιατικό επιπλέον.
    info: Η ρίζα του λοτός εμφάνιση συγκεκριμένων απλών που έχουν διάταξη με κύκλους για να φανεί η βοτανική της δομή· χρησιμοποιείται στην ασιατική κουζίνα -Κινέζικη, Γιαβαϊκή &amp; Ινδική-. Διαθέτει υψηλή περιεκτικότητα σε Vitamin A,C,B6.
  veg.mushroom:
    label: μύκης
    summary: Παλιρροϊκό - καφέ φυτώργιο μύκης που χρησιμοποιείται στην κουζίνα.
    info: Το χαμπιγκρόν βίσφερ είναι το πλέον διαδεδομένο φυτώργιο μύκης σ' ολόκληρο τον κόσμο. Δουλεύει για να αξιοθάζω λιβήχια, βιταμίνες Β και μέταλλα· χρησιμοποιείται σε πολλαπλά φαγητά.
  veg.okra:
    label: Οκρά
    summary: Πράσινοι λεπτοί στενοί σπόροι με λεΐχοτεξτουρ · βασικό συστατικό του Gumbo.
    info: |-
      Το οκρά είναι από τη νότια Γλυσμές και περιβάλλους χώρων στη βόρεια Αφρική
      Είναι μια γνωστή φύτεψη στη διαδικασία λεγόμενη «gumbo»· το λεϊχότεξτουρ του υποστηρίζει τα σαλάτια,
      Στο cross-sections oκρά form stars.
  veg.onion:
    label: '"cebola"'
    summary: '"Παϊχτική βρύων συζητημένος λαχανικά για να δώσει ώφελεια σ'' φαγήθη"'
    info: '{"info":"Η Cebula είναι μια από τις περισσότερο καλλιεργημένες λαχανικά στον κόσμο Χρησιμοποιείται για να δώσει ωφέλεια σε φαγήθη σ’ όλο τον κόσμο· περιέχουν flavioids με antiβακτηριδιακές επιδράσεις."}'
  veg.parsley:
    label: παρμεζάνη
    summary: Φυτό με καθαρό πράσινο ροϊκό
    info: |-
      Η παρμεζάνη είναι συχνή χρήσιμος γλύκιστρο και διόρθωση του φαγητού
      Περιέχει μεγαλύτερη απόφθειρμα Βιταμίνη Γ' από ντομάτες βάρους,
      Υπάρχει λεία(διαβασμένη), και κουρτώνεται - οι συνταξιούχοι προτιμούν την λεία για την πιο ισχυρή γεύση
  veg.parsnip:
    label: Patinaka
    summary: Λεύκωμα χρωματισμένο ως «παστίνα», μια μεσαιωνική βασική λαχανική.
    info: Το pastinak είναι ριζώδες λαχανικό συγγένη του πατάτα και ήταν βασική διατροφική απαραίτητη για την Ευρώπη μέχρι να φθάσουν τα καλαμπόκια· σήμερα είναι λιγότερο κοινό.
  veg.peas:
    label: Φασόλι
    summary: Πράσινο λουλούδι βρίζει να φτάσει στην άνοιξη.
    info: Το φασόλι είναι μικρή κυκλική πράσινη σπέρματα αγχοβόλου των Pisum Sativum η χύθεις διαφορών γεύσεων.
  veg.pepper:
    label: παπρικά
    summary: Γλαστερή λαχανική με γλυκή η picante γεύση.
    info: '{"info":"Η παπρικά είναι χρωματιστό κολυβέδες μήλου αφγανικό ή σχηματιζών φύλλο της βοτανικής γένος Capsicum annuum", "info": "Παπρικά διαθέτει sweetie και hot varieties. Red paprika has highest vitamin c content among all vegetable types."}'
  veg.potato:
    label: Πατάτι
    summary: Ένα λευκό ριζώδες ντουφέξ
    info: '{"info":"Το πατάτι έρχεται από τους Aνδών και είναι μία από τις σημαντικότερες γεωργικές φυλλώσεις υψηλής δύναμης βιταμινών.'
  veg.pumpkin:
    label: '"ΔΥΝΙΣ"'
    summary: ΜΕΓΑΛΗ ΠΟΡΤΟΚΑΛΙ ΓΩΝΙΑ ΤΎΧΏΝ ; ΣYMBOL HALLOWEEN KAI EΦΉΒΟΣ
    info: |-
      {"hint":"μεγάλη πορτокαλί σφαιρική τύχων από κουκουβέρδα ή μεξικάνα","info":"Η δυνίς είναι φυσική βοτανική χώρα από τη νότια Δυτική Αμερική\r
      Περιέχει πολύ βιταμίνη B-carotene,A,C,Zinc,Magnesium,Roasted Protein\r
      Το Halloween Jack-O-Lantern tradition προέρχεται από την Irlandia\r
      Οι λουθέριες δυνίς είναι γεμάτες με Zinck,Magnessium & Plant Proteins"}
  veg.radish:
    label: red pepper
    summary: Μικρό αγχωτικό μπαζοκορνόβο εδώ για να διαθέτεις βαριά και εαρινή παραγωγή.
    info: '{"hint":"μικρός στεφανωτός κοκκίνου ή λευκού χρώματος τάξιδλη φυσική πέπερ'
  veg.spinach:
    label: Σπινατί
    summary: Φυλλώδες λαχανικό με πολύ σίδηρο
    info: Το σπινατί αρχικά προέρχεται από τη μεσαιωνική Περσία και είναι φυλλώδες λαχανικό όπου βρίσκεται γύρω από το νιτρικό, το βιταμίνη Α,C,K ,φολικό οξύ και σắto.Ο Popeye(θαλασσοβεγγαλιάς διαστημελλητικό ) προώθησε το σπινατί ως υψηλής ποιότητας τροφή για παιδιά από τη δεκαετία του '30 .Η πέψη του σπινατί απελευθερώνει oxalic acid
  veg.spring_onion:
    label: Φύνδαινα
    summary: Πιο δелиκάτη φύνδαινα με λευκή βάση και πράσινα στέλεχη.
    info: Η παγκόσμια μπρόκολου ή λευκή κάτω βάση της φύνδαινας χρησιμοποιείται σχεδόν αφέθει για να εξελιχθεί.
  veg.squash:
    label: Τυξέβα
    summary: Πολύτιµη φυτική µορφή ως βασικό λαχανικό της φθινοπωρινής νутριτικής.
    info: Η χειμωνιάτικη τυχέβα ή κολοκύθα είδους Cucurbita περιλαμβάνει σόργο μπουτέρνιουτ, ασφόδελο, δелисαιτα και καμπότζα γενετικής βλαστών.
  veg.swede:
    label: Rutubaka
    summary: Πολύ ωραία υψηλής ποιότητας ψυχαγωγία.
    info: Το Tuřín ή Rutabaga είναι μια πράσινη ρίζα τύπου Brassica napus από κυβέλες σχήματος βγαλμένες για να φωτίσουν δώδεκα λεπτά. Διαφορετικά από την παθητική συμπεριφορά των σπόρων, το tuřín έχει μια ιξώδη, χρωματιστή εμφάνιση.
  veg.sweet_potato:
    label: βατάτι
    summary: Πορτοκαλών λευκό εξοθεντικό νεύρο ;
    info: Το βατάτιουμ προέρχεται από τη Νότια Αмерική και δεν συγγενίζεται με τη ραφανωδή γλύκας φυσιολογικά.
  veg.taro:
    label: '"ΦΥΤΩΝ"'
    summary: '"Μεγάλη σταχυωδής ρίζα με κόκκινη ίνα; Διαβροχή βασικό τρόφιμο."'
    info: |-
      {"hint":"μεγάλος σταχυωδής κόκκινη ρίζα με θρύψα που αποτέλεσμα της Colocasia esculenta","info":"Ο βαθύφυτος φυτών είναι διαβροχή για λευκό νόστιμο που παρασκευάζεται από την Colocasia escutella;
      Είναι βασικό τρόφιμο στην Πολυνησία, την Αφρική και την Ευρώπη ;
      Η Havajian Poi είναι φυτών που έχει submerge;
      Έχει ελαφρώς αμύγδαλο γεύση; ","label":"ΦΥΤΩΝ","summary":"Μεγάλη σταχυωδής ρίζα με κόκκινη ίνα; Διαβροχή βασικό τρόφιμο."}
  veg.tomato:
    label: tomata
    summary: Κόκκινο σφαιρικό φρούτο που χρησιμοποιείται ως λαδών.
    info: Ο τομάτας είναι φυσικό αρχεγόνωμα που χρησιμοποιείται στη κουζίνα μέσω λαδών ή γλύκανσής του. Διαφθερετικά δεν βρίσκεται στη νότια Αμερική και περιέχει λυκοπένη και βιταμίνη Γ.
  veg.turnip:
    label: Ραφάνι
    summary: Λευκό - φιαλή αγγελιστική βοτανική διαθεσιμότητα ; γνωστή νοτιοβαλκανική λεϊξ.
    info: Η ραφάνια της Ευρώπης είναι μέλος που σχετίζεται κονδύλωμα Brassica rapa.
  veg.watercress:
    label: '"βουτυρωπούγκα"'
    summary: '"Πολύ μικρός σκούρα πράσινη ποντικό φυτό από νερό."'
    info: '{"hint":"μικρός σκούρα πράσινη ωφέλεια νερού με ξίδι γευστική φυτών","info":"Η βουτυρωπούγκα αξιοθέατη είχνε το Nasturtium officinale και διαβαίνει στα λευκά ποτάμια και πηγάδια\nΈχει ποντικό, πιπερίζικο γεύμα λόγω glycoside sinigrine\nΕίναι πλούσιο σε vitamin C, K & beta-carotene\nΣτη Βρετανία είναι traditional sandwich sauce; Γαλλία potage au cresson"}'
  veg.yam:
    label: Για
    summary: Μεγάλη σταρχωδής τροπική λεμφοεξαγωγείο.
    info: Το Jam είναι μεγάλη σταρχωδής ριζώμα που βρίσκεται κυρίως τις θερμότερες γεύσεις από τη Διαφορέτικα φυτά διαβάθης.
  veg.zucchini:
    label: Κούκιτα
    summary: Πράσινη ζεϊγκ η οποία χρησιμοποιείται για την προετοιμασία τροφίμων.
    info: Η κούκιτα είναι μια λεπτή τυχέβου πράσινη θερμόφθωλλη φυτών Cucurbitaceae από τη νοτιοδυτική Μεξική όπου διατηρεί σχεδόν γυμνός βλαστός.
