lang: ja
pivot: false
title: 野菜
cards:
  veg.artichoke:
    label: アールキチョック
    summary: 大型で緑色の棘を持つ野菜；花びら部分だけではなくて、その下にある芯と厚みのある茎の根元のみを食べる
    info: |-
      {"hint":"大型のグリーンヒスイドローブのような野菜（セナラ・カードンクルス）","info":"アーキチョークは、大きなトゲのある植物であるセナラ・カードンクルスの芽です。
      中心部と葉っぱの太い基部を食べます。
      味に香りづけとして使われるのでジナンツォやシナーなどのヴェルムートにはアールキチョックエキスが含まれています。
      インウリンという腸内環境改善効果があるプレバイオティクス成分が多く含まれています。"}
  veg.arugula:
    label: ルコラ
    summary: 火傷するような暗緑色のサラダ用葉物；人気があるイタリア風
    info: |-
      ルコラ（学名：エリカ・ベシカラリア）は地中海原産の野菜です。
      glucosinolateという成分により、特有なピーテンスで辛みのある味を持っています。イタリア料理では基本的な食材であり、焼いた後に生の状態でピザに添えられます。
  veg.asparagus:
    label: キャベツ
    summary: しなやかな春の新芽；希少性が高い季節限定のお野菜
    info: "{\"hint\":\"柔らかく緑色の春の若芽（アスパラギンス・オフィциナリス）\",\"info\":\"キャベツ（アスピラガス・オフィシナルイス）は、最も高価な春野菜の一つです。\r\n白いキャベツは太陽にさらされずに栽培されるため、緑よりも繊細でやわらかい味がします。\r\n摂取後に尿中に特徴的なにおいを発生させるのは人口の約20〜40％であり、「アスペルジニーン」という物質によるものです。\r\nドイツ料理とフランス料理では伝統的に人気のある食材として親しまれています。\""
  veg.bamboo_shoot:
    label: bamboo shoots
    summary: 竹の若葉；アジアウッディーベジタブル
    info: |-
      {"hint":"アジア料理で使われる若い竹の新芽（バムブソイデー）","info":"バンバスコエ・ヴィホンキは、発芽直後に収穫される若き竹の新芽です。\n中国や日本のタイなどの料理では基本的な食材とされています。\n生の新芽にはシアン化物が含まれており調理が必要ですが加工済みのは安全です。
      カロリーが低く食物繊維豊富な特徴があります。
  veg.beet:
    label: ビート
    summary: 暗く赤くて丸い根野菜；着色料および食材
    info: |-
      ビーツ（ベータ・ヴルガリス）は、βタニンという強い天然の赤色色素を含んでいる。硝酸塩分が豊富で運動能力向上と血圧低下に効果がある。砂糖用甜菜とは別の品種であり白い砂糖を得るためである。
      食用として摂取した後にピンク色尿が出ることがあるがこれは無害な現象だ。
  veg.bok_choy:
    label: パクチー
    summary: アジアから来た青菜で、黒っぽい葉と白い茎を持っているものです。
    info: '{"hint":"中国原産の白い茎を持つ葉物野菜（ Brassica rapa subsp. chinensis）","info":"パクチー／ホクトウジロ（Brassica rapa subsp. chinensis）は、中国が起源です。\nこれは中華料理・日本食およびタイ料理で基本的な食材となっています。\nビタミンCやK、Aとカルシウムを豊富に含んでいます。","label":"パクチー","summary":"アジア発祥の暗緑色の葉っぱを持ち、白色な茎がある植物。'
  veg.broccoli:
    label: ブロッコリー
    summary: 太い茎に集まった密な花の頭を持つ緑色野菜。
    info: ブロッコリーはキャベツ科の緑色野菜です。ビタミンCやK、抗酸化物質が豊富で、イタリアが起源地です。
  veg.cabbage:
    label: キャベツ
    summary: 葉っぱが固く丸い形をしており、ザワークラウトなどのベースになる野菜。
    info: |-
      キャベツ（学名：Brassica oleracea）は、ヨーロッパで何千年も栽培されてきた伝統的な野菜です。
      ビタミンCやKを含み、抗がん作用を持つグリコシノレートという物質もあります。
      発酵させるとザワークラウトとなり、プロバイオティクス豊富な食品になります。
      ドイツ料理では副菜として基本的であり、韓国風のキムチにも使われます。
  veg.carrot:
    label: ニンジン
    summary: 甘い味わいでオレンジ色の根菜。
    info: 普通のニンジン（ダウカス・カロタ）は、ジューシーなオレンジ色の根を持つ二年草で、パースnipではありません。ベータカロテン（プロビタミンA）や食物繊維が豊富です。
  veg.cauliflower:
    label: カリフラワー
    summary: 多数の小かさからなる白く密着した球状体；ベルギー原産のホワイトベジタブルとして有名である。
    info: '{"hint":"白くて密な花の頭を持つ野菜（ブロッコリー属 Brassica oleracea var. botrytis）","info":"カリフラワー（Brassica oleracea var. botrytis）は、ブロッコリーよりも親近感のある植物です。\r\n白色になるのは葉が太陽から頭を守るためでクロロフィル生成を防いでいます。\r\n紫やオレンジ色および緑などの品種もあります。\r\nグルテンフリーでは小麦粉と米に代わって人気があります。","label":"カリフラワー","summary":"多くの花びらによって作られた密集した白い塊；ベルギー発祥のホワイトベジタブルとして知られています。'
  veg.celeriac:
    label: バルブヴォイ・セレル
    summary: 大きな白く節のある芹菜の根；ポトフなどの基本材料
    info: バルブヴォイ・セレル（学名：アピウム・グラベオレンス・バリエタス・ラパーセウム）は、根を食べるセルリの品種です。濃いグリーンハーブのような香りと味を持っています。ポトフやキャロットサラダ（レモールァド）、焼いた料理に使われます。地中海が原産でチェコ語、フランス語、ドイツ語圏では人気があります。
  veg.celery:
    label: パースレー
    summary: シャクリットな香りのある緑色の野菜；ゼロカロリー？
    info: |-
      {"hint":"しゃきっとした緑の茎を持つ野菜（アピウム・グラヴォレンス）","info":"パースレ一(Apium graveolens)は地中海地方が原産です。
      セロリを摂取することで、消化に消費されるカロリーが多いという主張があります。しかし実際にはそのような証拠はありません。
      フランス料理における基本的なトリオであるミルポワックス(タマネギ、ニンジク、セロリ)の基盤となっています。
      セロリジュースはデトキシファイティングドリンクとして人気がある飲み物です。
  veg.chard:
    label: mangold
    summary: Stem color that varies between green to vibrant shades like red, yellow, or even multicolored patterns on its leaves makes it unique among greens.
    info: |-
      {"hint":"redやrainbow色の茎を持つ、大きなカラフルな葉物野菜（Beta vulgaris）","info":"マングルド（Beta vulgaris subspecies cicla）は赤キャベツに近い。
      緑・赤・黄または虹のような色合いを持った茎がある。
      vitamin K,A,Cと鉱物質（カリウム、マグネシウムなど）が豊富である。チェコでは伝統的に栽培されていた；今日ではファッショングルメとして再評価されている。","label":"mangold","summary":"多様で鮮明な色彩をした茎を持つ葉もの野菜"}
  veg.chickpeas:
    label: チャイナ
    summary: 丸くてべージュ色の種子；hummusとfalafelの主な原料
    info: |-
      チャイナ（学名：Cicer arietinum）は、中東およびインドで人気のある豆類です。
      hummus（ペースト状の料理）やfalafel（揚げた小玉）などの基本的な材料となります。植物性タンパク質が豊富であり、ベジタリアンやビーガン食に広く使われています。
  veg.chili:
    label: チリ
    summary: 赤または緑色のとても辛い唐辛子；辛辣な調理法において基本的な食材となる
    info: |-
      チリペッパ（カピシウム・アニュームなど）は非常に辛い唐辛子の品種です。 辛さを引き起こすのはコハク酸で、スコービル尺度によって測定されます。（ジャローペノ：2,500～8,000SHU、カリナ州レイパー：2,000,000＋SHU）。 コハク酸進化上の役割としては哺乳類から離れさせることであり、鳥がその代わりに種を持ち運ぶようにするためです。
       アジア料理やメキシカン料理およびインド料理では、このチリなしには考えられないほど重要です。
  veg.corn:
    label: トウモロコシ
    summary: 黄色い実を束状につけた高さのある穀物。
    info: トウモロコシは中米が原産で、現在では最も栽培されている作物の一つです。その粒には炭水化物、タンパク質およびB群ビタミンが含まれています。
  veg.cucumber:
    label: キュウリ
    summary: 長くて緑色の、さっぱりとしたジューシーな果肉を持つ野菜。
    info: キュウリ（学名：Cucumis sativus）は熱帯原産のかぼちゃ科の野菜です。水分を約95％含み、さわやかな味で、サラダや軽食として人気があります。
  veg.eggplant:
    label: りれく
    summary: 濃紺のような紫の楕円型の野菜；モーサックやラタトゥイユの主要成分となるものです。
    info: |-
      {"hint":"暗紫色の長細い野菜（学名：Solanum melongena）；別称はアブジジャン。
      ","info":"ナス科に属するリレク（Solanum melongena）はインド原産で、何千年も栽培されています。イタリアではメランザーナと呼ばれ、フランス語圏やアメリカではそれぞれ「aubergine」と「eggplant」が使われます。皮には強い抗酸化作用を持つサニチンを含みます。地中海料理および中東料理において基本的な食材であり、「モウッサカ」「ババ・ガヌーシュ」「ラタトゥユエール」などの定番ディッシュにも用いられます。","label":"リレク","summary":"深紫色の卵形の植物性食品；モウッサカやラタトゥユエールといった料理における主な材料です。
  veg.endive:
    label: チャカーンカー
    summary: 淡くほんわりとした葉もの野菜で、苦みがあり；サラダなどの基本的な材料となる
    info: |-
      {"info":"チコリウム属（特にCichorius intybusやC. endivia）の植物であるチャカーンカーは、特有な苦味を持つ葉物野菜です。
      白い色調は暗所栽培または日光遮断によって得られます。（例：ヒトローフなど）。この独特な風味成分をもたらすのはインティビン酸であり、これを減らして柔らかさを持たせるためにブランシエという方法が用いられています。ベルギー産のチャカーンカー（通称ウィットループ）は春に収穫されるデリケートで高級感のある食材としてフランスおよびベルギーなどで人気があります。
  veg.fennel:
    label: フェンキル
    summary: 白い玉ねぎ状態の球根を持ち、羽のように広がった葉があり、甘くアニス風な香味があります。
    info: |-
      フェンキル（Foeniculum vulgare）は、アニスのような香りと味を持つ植物で、その成分にはアナトールが含まれています。
      球根の部分だけでなく茎や葉も食用にされます。
      これはイタリア南欧料理において基本的な食材であり、ペーストーやサラダ、焼いた魚などさまざまな料理に使われます。
      また、フェンキルシードという種子をアジアおよびイタリア料理では調味料として使用し、消化促進にも役立ちます。
  veg.garlic:
    label: にんにく
    summary: 刺激的な香りを持つ白い玉状の根菜で、多くの料理の基本的な味付けとなる。
    info: 栽培されたニンニクは数千年来調理と薬として使われてきた。アリシンという成分を含んでおり、抗菌作用や抗炎症効果がある。
  veg.ginger:
    label: しょうか
    summary: 火傷のような感覚を与える辛味があり香りが高いノドグロ状の根
    info: '{"info":"ジンジャーオフィシナリス（ショクヨウセンニョ）は、熱帯アジア原産の植物の根です。\ngingerolという物質を含み、刺激性と抗炎症作用を持つ原因となっています。\n研究では生姜が吐き気や胃痛に効果があることが示されています。\nジンジャー・ティー、ジンガークラフトビール、ジンガーブレッドなどの商品も人気が高いものです。'
  veg.green_beans:
    label: ファズル
    summary: 長くて細い緑色の豆；未成熟時に採れる
    info: ファズル（Phaseolus vulgaris）は未熟なうちに収穫される長い緑色の豆荚です。フレンチビーン、ストリング・ピークスまたはボビー・ピースと呼ばれることもあります。この食品にはCおよびKなどの維生素や葉酸が含まれています。「グリーン・ブイヨレ」として知られるアメリカ風料理ではこれを煮てマッシュ入りクリームソースで仕上げます。
  veg.kale:
    label: カプスタ・ケデラヴァ
    summary: 濃紺色のかなりしわがある葉っぱ；スーパー食材
    info: |-
      {"hint":"暗い青緑色のしわのある葉物野菜（ブロッコリー）","info":"キャベツは非常に栄養価が高く、深く緑色した野菜です。\nビタミンＫ，Ａ，Ｃや抗酸化成分を豊富に含んでいます。\n2010年代にはヴェーガンと健康運動の人々にとって象徴的なスーパーフードとなりました。\n生で食べると苦味がありますので、油を使ってマッサージしたり Blanching を行ったりすることで風味をおさめます。
      "}
  veg.kohlrabi:
    label: ケドルベン
    summary: 球状の茎を持ち、ブロッコリーなどの近縁種
    info: |-
      {"info":"ケドルベン（学名：Brassica oleracea var\. kohlrabi）は、キャベツ科の野菜で、茎と葉を食用とする。太った茎部が特徴であり、やわらかく甘みがあり歯ごたえがある味を持つ。
      生でも加熱しても食べられる。
      この名称はドイツ語に由来し、「コール＝キャベツ」「ラビ＝根」からなっている。
      インド・ドイツ・チェコなどで人気のある食材である。
  veg.leek:
    label: ポレック
    summary: 大きな甘くて穏やかな香味を持つ根菜で、スープや煮込み料理などを作るための基材となるものです。
    info: "{\"hint\":\"大さじの辛味が少ない玉ねぎ科野菜（アリウム・アンペロプラスモン）\",\"info\":\"ポレック（学名：Allium ampeloprasum）は、ニンニクやタマネギと近い植物です。\r\nウェールズでは国際的な象徴として扱われており、聖デイヴィッド祭に人々が身につける習慣があります。\r\nこれはアルリシンという成分およびビタミンKとCを含んでいます。\r\nポルコ鍋料理は英国風、フランス風そしてチェコ風の伝統的調理法としても知られています。\",\"label\":\"ポレック\",\"summary\":\"大きな甘く柔らかい根菜；シチューまたはラグーなどの基本食材\"}"
  veg.lentils:
    label: レンズ豆
    summary: 小さな平らな形をしたマメ科植物の种子；無肉食において主要なタンパク質供給元
    info: "{\"info\":\"レンズ豆（Lens culinaris）は、最も古い食用マメ科植物の一つで、一万年前から栽培されています。赤・緑・茶色・黒（ベルーガ）などの品種があります。\r\n水にさらさずに煮ると約20〜30分かかります；これはイングリッシュピークスよりも早いです。\r\nインド料理では主なタンパク質源であり、「ダル」や「デール」として使われています。"
  veg.lettuce:
    label: アイスバーガーリーフ
    summary: サラダに使う葉っぱ状の柔らかい緑黄色野菜
    info: アイスバーグレタス（ラクチュカ・サティヴァ）は、古代エジプトから栽培されてきた野菜です。水分を含んでおり、低カロリーの特徴があります。品種にはアイスバーグやロメインなどがあり、ギリシャでは供え物として使われていました。
  veg.lotus_root:
    label: ロータス コーン
    summary: 美しい穴を持つ蓮根の断面部；アジアンデリカシー
    info: |-
      {"hint":"穴があいた蓮の茎切り身；アジア料理（ Nelumbo nucifera）で使用","info":"ロータスコーン（学名：Nelumbo nucifera）は、聖なる蓮の地下部に位置する器官です。
      断面には対称的な孔がパターン状になっています。これは中国・日本・インドなどの東南アジア諸国の基本食材であります。
      ビタミンCやB6およびカリウムを含み、歯ごたえのある食感を持っています。","label":"ロータス コーン","summary":"美しい穴を持つ蓮根の断面部；アジアンデリカシー"}
  veg.mushroom:
    label: きのこ
    summary: 淡い茶色の傘状の食用菌で、料理に使われる。
    info: アガリクス・ビスポロスは世界中で最も栽培されているキノコです。たんぱく質やビタミンB類、鉱物分が豊富であり、さまざまな料理に使用されます。
  veg.okra:
    label: オクラ
    summary: 滑りやすい食感を持つ緑色の肋のある豆荚；ガムボの基本材料
    info: |-
      {"hint":"長くて緑色の肋がある種子果実（アベルモスコウスク・エスキレンタ）；レディファインガー","info":"オクラ（学名：Abelmoschus esculentus）は熱帯アフリカ原産です。
      アメリカ料理「ガムボ」に欠かせない食材であり、滑らかな質感でソースをとろみづけます。
      断面には星型が現れます。
      食物繊維やビタミンC、Kおよび葉酸が多く含まれています。"}
  veg.onion:
    label: にんにく
    summary: 香辛料として料理に使用される刺激的な層状の玉ねぎ。
    info: ニンニクは世界で最も栽培されている野菜の一つです。全世界の料理に風味付けや調理に使われており、抗菌作用を持つフラボノイドを含んでいます。
  veg.parsley:
    label: パースニップ
    summary: 明るい緑色のハーブで、調理用および芳香性添加物としても使用される
    info: セロリ（学名：Petroselinum crispum）は、香辛料や装飾として広く使われている。オレンジよりもビタミンCを多く含む（重量ベース）。葉の形によって平たいものとカールしたものがあり、料理人はより強い風味を持つ平坦な品種が好まれる。古代ギリシャではセロリは死に関連付けられていた；葬儀にはセロリが棺に置かれた。
  veg.parsnip:
    label: パストリナ
    summary: クリーム色の白い根野菜であり、中世ヨーロッパにおける主要な食物であったものです。
    info: |-
      パストリナカ（学名：Pastinaca sativa）は、ニンジクに似た根菜類です。
      ジャガイモがヨーロッパへ導入される前から基本的な食材でした；現在ではあまり一般的ではありません。
      甘く、堅い味わいで、霜を受けるとさらに甘くなります。グラタンやポタージュで美味しく食べられ、英国の伝統料理であるサンデー・ロースにも使われます。
  veg.peas:
    label: エンドウ
    summary: 小さな緑の球状の種子； 春の優しさのシンボルとして知られているものです。
    info: |-
      {"hint":"小粒の緑色の豆種子、莢の中（ピセウム・サチバム）","info":"エンドウ（学名：Pisum sativum）は古代から栽培されているマメ科植物です。
      グレゴール・メンデルが遺伝に関する実験で使用しました。（1856～1863年）。
      モロヘイヤのような食用荚を持つ「雪えんどう」や甘味のある「シュガー・スナップ」といった品種もあります。
      また、この作物には豊富な植物性タンパク質とビタミン類および食物繊維を含みます。","label":"エンドウ","summary":"小さな緑の球形の种子；春に象徴される柔らかさ"}
  veg.pepper:
    label: パプリカ
    summary: 光沢のある色とりどりの野菜で、甘味または辛味があります。
    info: パプリカ（学名：Capsicum annuum）は、彩鮮やかなベル形のピーマンであり、「キャプシクム」とも呼ばれます。これは甘口と辛口の品種が存在します。また、赤いパプリカには他のすべての野菜よりもビタミンCが多く含まれています。
  veg.potato:
    label: じゃがいも
    summary: 世界中の多くの料理の基本となる茶色の地下茎。
    info: ジャガイモは南アメリカのアンデス山脈原産で、世界でもっとも重要な作物の一つです。炭水化物やビタミンC、カリウムを含む栄養源として知られています。
  veg.pumpkin:
    label: かぼちゃ
    summary: 大きな橙色で球形な果物；ハロウィーンおよび秋料理の象徴
    info: |-
      {"hint":"大型のオレンジ色で丸いズッキーニ（クキュルビータ・マックスイマまたはペポ）","info":"カボチャはアメリカ原産です。
      β−カルテンやビタミンA、Cが豊富に含まれています。ハロウィーンに関連する彫刻伝統であるジャック＝オー＝ランタンはアイルランド起源です。
      カボチャのかぼちゃ種子は亜鉛とマグネシウムそして植物性たんぱく質を含む優れた栄養源になります。
  veg.radish:
    label: れっけつ
    summary: 小型の辛味のある赤い根野菜；アペタイザーや春の美味しい食べ物としても親しまれているものです。
    info: '{"hint":"小さなサクランボ色または白い根菜（ラパヌス・サティバス）","info":"ニンジコウ（学名：Raphanus sativus）は成長が早い根野菜です。\n小ぶりの庭用に植えられるものは赤く、大振りで冬を越すのは白色になります。（ダイコン）。\n抗菌作用を持つグリコシノレートという成分を含んでいます。\n日本ではダイコンと呼ばれるこのキャベツ類は料理において基本的な食材となっています。","label":"れっけつ","summary":"小型の辛味のある赤い根野菜；アペタイザーおよび春の美食として知られています。'
  veg.spinach:
    label: ほうれんそう
    summary: 暗緑色で鉄分が多い野菜
    info: |-
      ほうれん草（学名：Spinacia oleracea）は中世ペルシアが原産です。
      vitamin K、A、Cや葉酸と鉄分を豊富に含んでいます。
      poppeaというコミックの海賊船乗りが、子供たちのためにほうれん草をスーパーフードとして広めたのは1930年代のことでした。
  veg.spring_onion:
    label: 春葱
    summary: 白い根元と緑色の葉を持ち、サラダなどによく使う繊細なニンニク
    info: |-
      {"hint":"長くて細い、白い根と緑の茎を持つ玉ねぎ（アリウム・フィストロサラ）","info":"春葱（学名：Allium fistulosumまたはAllium cepa）は未熟なうちに収穫される。
      通常のタマネギよりも柔らかく刺激が少ない。
      アジア料理では装飾用やサラダおよびスープに使われる。
      生でも加熱調理しても美味しく食べられる。"}
  veg.squash:
    label: かぼちゃ
    summary: さまざまな形状をした冬のかぼちゃ；秋料理における基本的な野菜
    info: |-
      {"hint":"さまざまな形の冬カボチャ（クスクビータ属）","info":"冬季用カブース（Cucurbita）には、バターナットやアコーニューム・デリカテスおよびカラボーが含まれます。
      硬い皮を持つため数ヶ月間保存でき、一冬中保管可能です。
      これはAとCそしてB複合体に豊富です。
      「トゥリー・シスターズ」システムでは重要な食材でした。
  veg.swede:
    label: トゥリーン
    summary: 大きな紫色から黄緑色までの球形根野菜；スコットランド料理ハギスのお供
    info: |-
      {"hint":"大型の紫黄色で丸い根菜（キャベツ属）；ルタバーガ","info":"トゥリーンはブロッコリーとダイコンとの交配種です。
      アメリカでは"rutabaga"、スコットランドではハギスに欠かせない添え物として知られています。茹でると甘くやさしい香味があります。ビタミンCと食物繊維が豊富であり、北欧の人々にも人気がある作物です。
  veg.sweet_potato:
    label: さつまいも
    summary: オレンジ色の甘い块茎；亜熱帯地域から来たじゃが芋ではない作物です。
    info: |-
      {"hint":"オレンジ色のデンプン質塊根（イポメア・バタータス）","info":"サツマイモ（学名：Ipomoea batatas）は南アメリカ原産で、植物的にはジャガイモとは関係ありません。
      βカロテンやビタミンAとC、食物繊維が豊富です。
      果肉の橙色はβカロテンによるものです。
      何世紀にもわたってアフリカン料理、アジア料理およびラティノアメリカ料理において基本的な食材となっています。","label":"さつまいも","summary":"オレンジ色の甘い块茎；亜熱帯地域に生息する非伝統的じゃが芋類"}
  veg.taro:
    label: 芋
    summary: 大きなでんぶん質の紫斑を持つ块茎；熱帯地方における主要食料作物です。
    info: |-
      {"hint":"大粒の紫斑のあるでんぷん質塊茎（コロカシア・エスキュレンタ）","info":"芋（コロカシア・エスキュレンタ）は、熱帯地域に生育する約一万年間栽培されてきた根菜である。
      ポリネジアやアフリカおよびアジアでは基本的な食物であり；ハワイ語でのpoiとは発酵させた芋のことだ。
      ほのかなナッツのような味わいがあり；果肉の中にある紫色スポットが視覚的象徴となる。
      生食用には草酸カルシウムを含み火傷のように感じるため加熱調理が必要不可欠なのである。"}
  veg.tomato:
    label: トマト
    summary: 赤くて丸い果物で、野菜として使われる。
    info: トマトは植物学的には果実（漿果）だが、料理では野菜として使用される。南アメリカ原産であり、ルテインとビタミンCを含んでいる。
  veg.turnip:
    label: タマネギ
    summary: 白色・紫色のかたちよい球状の根野菜であり、中欧では昔ながらの食材として親しまれています。
    info: |-
      {"hint":"丸くて白紫の根菜（ Brassica rapa）","info":"タマネギ（Brassica rapa）は、ダイコンに近い根野菜です。
      西アメリカからのジャガイモが到来する前からヨーロッパで基本的な食物でした。
      ビタミンCやカルシウムと繊維を含んでいます。ベジテリアン向け肉代替品；タマネギポタージュスープは中央ヨーロッパ伝統レシピです。
  veg.watercress:
    label: ウォータークレイヴェット
    summary: 水流から来る小さな暗緑色の刺激のある植物
    info: |-
      {"hint":"小さな暗緑色の辛い水生ハーブ（ニガウリ）","info":"ウォーターソースネル（ニグマ・オフィシナレ）は、冷たい川や湧き出る泉で育ちます。
      グルコシンナートであるジナイグラインのおかげでピカッとした唐辛子のような味を持っています。
      ビタミンCとKおよびベータカロテンが豊富です。
      イギリスでは伝統的なサンドウィッチソースとして使われており；フランス語だとポテージュ ア ユー クレスソンと言います。"}
  veg.yam:
    label: '"jam"'
    summary: 「熱帯地方の大サイズデンプン質根菜；バークルートとは混同されやすい」
    info: |-
      {"hint":"大型のデンプン質熱帯塊茎（ディオスコレア属）","info":"ジャム（ディオスコレア）は、アフリカ・アジアおよびカリブ海地域に分布する大きなデンプン質の地下茎です。
      バータと区別されます：ジャムの方が乾燥しており、よりデンプンっぽく、甘味が少ないのが特徴です。
      重さは最大で70kgにもなります。
      サハラ以南アフリカでは主食として栽培されており、世界生産量のおよそ95％を占めています。"}
  veg.zucchini:
    label: ズッキーニ
    summary: 緑色の夏カボチャ；調理にも焼き物にも使える多用途な野菜
    info: "{\"hint\":\"長く緑色の夏カボチャ（キュクルビタ・ペポ）；またズッキーニと呼ばれる\",\"info\":\"グリーンピース（Cucurbita pepo）は、まだ熟していない状態で収穫される夏用ナス科野菜です。（全長：約７〜２５cm）。\r\nメキシコが原産地でありヨーロッパではイタリアによって広まりました。\r\n水分含有量９０％以上を占め低カロリーであるため健康食品としても注目されています。\r\nグルテンフリーな食生活のためにマカロンやヌードル類に代わる食材として研究も進められています。\"}"
