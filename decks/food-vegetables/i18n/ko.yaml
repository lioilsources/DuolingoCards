lang: ko
pivot: false
title: 채소
cards:
  veg.artichoke:
    label: 아르티초크
    summary: 큰 논나무잎 모양 씀씀이는 우리가 꿈틀꽃 앙상블만 섭취한다는 점에서 특별한 의미를 지닌다.
    info: '아르티초크(학명: Cynara cardunculus var. scolymus)는 실제로 큰 가시덤불 식물의 묶음 꽃받침 형태이다. 우리는 그 중심부인 ''가슴''과 두꺼운 줄기를 먹으며 이 물질은 음료에 풍미를 더하기 때문에 진자노와 카이나르 버모트에는 아르티 초 크 추출물을 첨가한다. 또한 프리바이오틱스로 장 건강을 지원하는 인ูล린 성분으로도 유용하다.'
  veg.arugula:
    label: rucola
    summary: 매콤하고 짙은 녹색 샐러드 잎이며 이태리 음식에 자주 활용됩니다.
    info: |-
      루콜라(Eruca vesicaria subspecies sativa)는 지중해 지역에서 유래한 식물입니다.
      glucosinolate 성분으로 인하여 특유의 매운 맛과 쓴맛을 가지고 있습니다.
      이탈리아 요리를 기반으로 사용되며 피자를 구우고 난 후에는 생식 상태로 올려 먹습니다.
  veg.asparagus:
    label: 채스트
    summary: 부드러운 초록색 봄 식재료; 고급 계절 과실.
    info: 아스파라거스(Asparagus officinalis)는 가장 비싼 봄철 채소 중 하나이다. 햇빛 없이 재배된 밀색 아스파라거스가 녹색보다 더 부드럽다. 소비 후에는 약물인 '에이서바신(Aspargin)'으로 인해 사람의 20~40%에서 특유의 요도 냄새를 유발한다. 독일식(Sparge)과 프랑스 음식에서는 전통적으로 사랑받은 채소로 알려져 있다.
  veg.bamboo_shoot:
    label: bamboo shoots
    summary: 새롭게 자라난 방울나무 줄기이며 아시아 지역에서 많이 머금는 야채다.
    info: 방초류의 어린 싹은 봄에 챙겨 수확한 방울나무 새싹이다. 중국 요리와 일본 및 태국 음식에서 중요한 재료로 사용된다. 신선하게 생긴 이 나뭇잎에는 시안화물이 포함되어 있어 조리를 해야 하며 소독된 것은 안전하다.
  veg.beet:
    label: 적근
    summary: 짙게 붉고 동그란 근채류로서 식품 및 착즙료로 사용된다.
    info: 적근( Beta vulgaris )은 베타닌이라는 강력한 천연 붉은색 색소를 함유하고 있다. 질산염이 풍부하여 운동 성과를 높이고 혈압을 낮춘다. 설탕용 사탕무는 다른 품종으로서 백당의 원천이다. 적근 소비 후 발생하는 분홍빛 요증(beeturia) 현상은 무해하다.
  veg.bok_choy:
    label: 복조기
    summary: 아시아 지역의 흰 줄기가 있는 어두운 잎을 지닌 녹색채소.
    info: |-
      배추(중국산), 또는 복조기(Brassica rapa subsubsp. chinensis)는 중국에서 기원한 채소입니다.
      이것은 한국어와 일본식 그리고 태국 요리의 기본적인 생선 재료 중 하나이며,
      vitamin C, vitamin K, 비타민A 및 칼슘으로 가득합니다.
      빠른 조리법: 두 분 동안 웍에 마늘과 고수를 사용하여 데치세요.
  veg.broccoli:
    label: 브로콜리
    summary: 굵은 줄기에 밀집된 꽃 모양의 머리를 가진 녹색 채소입니다.
    info: 브로콜리는 고추냉이과에 속하는 녹색 채소입니다. 비타민 C와 K 그리고 항산화 물질이 풍부합니다. 이탈리아에서 유래되었습니다.
  veg.cabbage:
    label: 크레미스
    summary: 잎들이 단단하게 밀착되어 있는 둥근 형태의 채소이며, 사우어 kraut(발酵 억새채소) 제조에 기초 물질이다.
    info: 크레미스 카피타타(Brassica oleracea var italica)는 수천 년 동안 유럽에서 재배된 고대 채소입니다. 비타민 C와 K 그리고 항암 성분인 글루코시놀레이트를 함유하고 있습니다. 발효하면 프로바이오티카가 풍부한 사우어кра웃으로 만들어집니다. 독일 요리에서는 크림을 기본 반찬으로 제공하며 한국의 김치에도 사용됩니다.
  veg.carrot:
    label: 당근
    summary: 달콤한 맛의 주황색 뿌리 채소입니다.
    info: 일반 당근은 풍부한 베타카로틴(프로비타민 A)과 식이섬유를 함유하고 있으며, 즙이 많은 오렌지 색깔의 뿌리를 가진 이년생 작물이다.
  veg.cauliflower:
    label: kvetak
    summary: 꽃 모음에서 이루어진 밀집된 하얀머리는 벨기에가 개발한 과학적 접근법에 의해 만들어졌습니다.
    info: 콜라비(Kale)는 브로컬리와 관련이 있습니다. 흰색은 잎들이 태양으로부터 머리를 보호함으로써 엽록소 생성을 방지하여 생깁니다. 자주색과 주황색 그리고 녹색의 종류도 존재합니다.
  veg.celeriac:
    label: 불브보비 셀러
    summary: 큰 무늬가 있는 하얀색 시더뿌리로 수프를 만드는데 기본이 됩니다.
    info: 불브보비 셀러(Apium graveolens var. rapaceum)는 뿌리를 생산하기 위해 재배되는 파의 품종입니다. 강한 시저향과 맛을 가지고 있으며 수프와 리모라드(셀러 샐러드), 구운 요리에 사용됩니다. 지중해 지역에서 유래했으며 체코어 프랑스 및 독일 음식에서도 인기가 있습니다.
  veg.celery:
    label: 파프리카
    summary: 크런치한 녹색 줄기가 담긴 풍부한 아로마가 나는 암생식물; 영칼로리?
    info: |-
      파프리카 셀러리는 지중해 지역에서 유래했습니다。
      셀러리를 섭취하는 데 소화에 더 많은 칼로리를 사용한다는 주장이 있지만 사실상 입증되지 않았습니다。
      파프리카는 프랑스 요리의 기본 재료인 미르피유(mirepoix)(양파, 당근, 파프리카)를 구성합니다。
      샐러드 주사는 인기 있는 해독 음료입니다。
  veg.chard:
    label: 망골드
    summary: 꽃무늬 줄기를 가진 다채로운 잔치나물
    info: |-
      망골드(Beta vulgaris subsp. cicla)는 빨간 당근과 관련된 채소입니다.
      잎은 녹색이고 줄기는 붉거나 노란 샛길이 있는 형태로 다양합니다.
      vitamin K와 vitamin A 그리고 vitamin C가 풍부하며鉀(칼륨), 鎂(마그네슘) 같은 미네랄도 많이 들어 있습니다.
  veg.chickpeas:
    label: cierna
    summary: 둥근 갈색 잎을 가진 씨앗이며, hummus와 falafel 제조에 기본 재료로 이용됩니다.
    info: |-
      치즈나(Cicer arietinum)는 중동과 인도에서 널리 사랑받는 콩류이다.
      hummus(치즈너 페이스트), falafel(fried balls)의 주재료이다.
      식물성 단백질이 풍부하며 비건 및 베지테블 식단에 자주 사용된다.
      cierna 수분인 aquafaba는 빵 굽기 시 달걀흰자 대용으로 활용될 수 있다.
  veg.chili:
    label: 마늘
    summary: 매콤한 붉거나 초록색 고추이며 풍미 있는 음식에 기본 재료다.
    info: '체리 고추(고추속)는 매우 매운 종류의 파프리를카이다. 화학물질 캡사이신이 맵기를 일으키며 스코빌 척도로 표시된다.(자바네노: 2,500~8,000SHU, 칼라이나 리퍼: 2백만 이상 SHU). 진화적 기능은 포유동물을 멀어지게 하면서 새들에게는 해가 없도록 하는 것이다. 아시아와 멕시코 그리고 인디안 요리는 이 고추를 빠트릴 수 없다.'
  veg.corn:
    label: 옥수수
    summary: 가시에 수분이 풍부한 곡물들이 줄지어 있는 노란 작물입니다.
    info: 옥수수는 중미에서 유래했으며 오늘날 가장 많이 재배되는 작물들 중 하나입니다. 씨알에는 당질, 단백질과 비타민 B군이 들어 있습니다.
  veg.cucumber:
    label: 오이
    summary: 시원하고 씨가 많은 긴 녹색 채소.
    info: 오이는 열대지방의 야채로, 호박과에 속합니다. 물을 제외하면 대부분 수분으로 이루어져 있으며, 상큼한 맛 때문에 샐러드나 간식으로 인기가 많습니다.
  veg.eggplant:
    label: eggplant
    summary: 짙게 보랏빛 타원형 채소이며, 마슈까 및 래타투엘레를 만드는데 사용됩니다.
    info: |-
      라일락(Solatum melongena)은 인도에서 유래된 것으로 수천 년 동안 재배되어 왔습니다。
      이탈리아에서는 멜랑자나(melanzana), 프랑스어로는 아베르지네(aubergine), 미국에는 에그플랜트라고 부릅니다。
      껍질에 담긴 안토시아닌이라는 강력한 항산화 물질을 함유하고 있습니다。
      중동과 지중해 요리를 기반으로 하는 레코드인 모우사카와 라따뚜예의 기본 성분입니다.
  veg.endive:
    label: 척이나
    summary: 밝고 잎이 많은 싱싱한 곡물이며, 고급 샐러드를 만든다.
    info: 체칸카(Chichorium intybus 또는 C.endivia)는 특유의 쓴맛을 가진 야채입니다. 흰색은 어둠속에서 재배되거나 태양으로부터 생기며, 이른 브뤼셀 척이나(witloof)로 알려져 있습니다. 이러한 씁쓸함은 인티빈산에 의해 발생하며, 불리시면 줄어듭니다.
  veg.fennel:
    label: 페니클
    summary: 깃털 같은 낙엽과 함께 하얀 양파처럼 보이며 단맛 나는 앵두향.
    info: 페니크อล(Foeniculum vulgare)은 아네틸이라는 물질로 인해 달콤한 애너이스 맛을 가지고 있습니다. 뿌리채와 줄기 그리고 깃털 모양의 잎 모두를 먹습니다. 이탈리아 지중해 요리를 기반으로 사용되며 풀라소(pesto), 샐러드 및 구운 생선에 넣어 씁니다. 또한 아시아와 이탈리아 음식에서 조미료나 소화제로도 자주 이용됩니다.
  veg.garlic:
    label: 쪽파
    summary: 자극적인 냄새를 가진 흰색 알로, 다양한 요리의 기본 맛을 내는 재료입니다.
    info: 쪽파는 수천 년 동안 조미료와 약으로 사용되어 왔습니다. 알리신이라는 성분이 들어 있어 항균 및 소염 작용이 있습니다.
  veg.ginger:
    label: 생강
    summary: 자극적이면서 향긋한 맛을 가진 고무처럼 덩어리를 이루고 있는 근.
    info: 생강(Zingiber officinale)은 열대 아시아 원산의 식물 뿌리입니다. 생강올이라는 물질을 함유하고 있으며 이는 자극성과 항염증 작용에 기여합니다. 연구들은 구토와 위장 불편감 완화를 위해 생강이 효과적임을 입증했습니다. 생강차나 생강맥주 그리고 생가브레드(gingerbread) 같은 제품들이 인기 있습니다.
  veg.green_beans:
    label: 파졸로프
    summary: 길고 가느달며 초록색으로 생긴 파졸루(lusky); 미숙한 시기에 수확한다.
    info: 파졸로프 베이비(Phaseolus vulgaris)는 아직 익지 않은 상태에서 수확된다. 프렌치 빈즈(french beans), 스트링빈스(string beans), 보비빈스(bobby beans)라고도 불린다. 비타민 C와 K 그리고 엽산을 함유하고 있다. 섬유효소 처리 후 마늘과 함께 볶아 머스타드 소스를 곁들이면 미국의 전통적인 반찬인 그린빈 캐서롤(green bean casserole)이다.
  veg.kale:
    label: ' куд리 kapust'
    summary: ' 짙은 파란빛을 가진 куд리 잎채소 ; 스타일러'
    info: ' куд리 капуста(Brassica oleracea var. sabellica)는 매우 영양가 있는 어두운 녹색 채소입니다. 비타민 K와 A 그리고 항산화 물질이 풍부합니다. 2010년대에 이 식물은 베지테리언과 건강 운동의 대표적인 슈퍼푸드로 각광받았습니다. 생으로 먹을 때는 약간 매워진 맛인데 기름이나 블랜시를 통해 부드럽게 만들 수 있습니다.'
  veg.kohlrabi:
    label: ' kedluben'
    summary: 가지 위에 구형 덩굴을 가진 초록색 껍질과 비슷한 식물
    info: |-
      케들루벤(Brassica oleracea gongylodes)은 콜리플라워와 관련된 야채입니다.
      줄기(두꺼운 줄기가 있는 부위)와 잎을 먹습니다.
      단맛이 나고 바삭한 맛이며 생으로나 끓여서 모두 좋습니다.
      이름의 유래는 독일어에서 온 것입니다: '코흘(Kohl)'은 배추를 의미하고 '라이비(Rabi)'는 두꺼운 줄기를 나타냅니다.
      인도, 독일 및 체체스lovak에서는 인기가 있습니다.
  veg.leek:
    label: poerek
    summary: 크고 부드러운 채소로 수프나 스튜 만들기 위한 기본 재료
    info: |-
      포렉(Allium ampeloprasus)는 양파와 마늘과 관련된 식물입니다.
      wales의 국가적 상징이며 웨일스 사람들은 세인트 데이비드 축제에 이 것을 착용합니다.
      aalicin 및 비타민K,C를 함유하고 있습니다.
      porekovy polvoky는 영국식, 프랑스식 그리고 체코 요리에서 전통적인 음식이 됩니다.
  veg.lentils:
    label: 렌즈콩
    summary: 작고 평평한 씨앗 형태의 채소류; 육계 없는 음식에 필수적인 단백질 원천입니다.
    info: |-
      렌즈콩(Lens culinaris)은 가장 오래된 콩 중 하나로, 약 1만 년 전부터 재배되었습니다。
      적색, 초록색, 갈색 및 검정(벨루가) 품종이 있습니다。
      불리지 않고도 조리 시간이 20~30분 정도이며 빨강 두부보다 더 빠릅니다。
      인도 요리는 무육식 식단에서 단백질의 주요 공급원으로 사용됩니다。(달(dal), 다할(dhal))
  veg.lettuce:
    label: 샐러드
    summary: 부서지는 잎채소이며 녹색 샐러드 기본재료
    info: 로메인 케일은 고대 이집트에서부터 재배되어 왔습니다. 물이 전체의 약 95%를 차지하며 칼로리가 낮아 건강한 샐러드 성분으로 넓게 사용됩니다. 다양한 품종들이 존재하는데, 아이스버그, 로마인, 롤로(Romano), 버터헤드(Butterhead), 오크 리프(Oak Leaf 등)입니다.
  veg.lotus_root:
    label: 로터스 루트
    summary: |-
      연뿌리를 가른 단면에 아름다운 구멍들;
      아시안 요리는 필수품.
    info: |-
      로터스 뿌리(Nelumbo nucifera)는 신성한 연꽃의 지하 줄기입니다.
      단면에는 대칭적인 구멍들이 패턴을 이루고 있습니다.
      중국어와 일본식 및 인도 음식에서 기본 재료이며,
      vitamin C, vitamin B6 그리고 칼륨이 들어 있고 씹히는 질감은 탱글탱글합니다.
  veg.mushroom:
    label: 버섯
    summary: 연한 갈색 모자 형태의 주방에서 사용되는 버섯입니다.
    info: Agaricus bisporus는 세계에서 가장 널리 재배되는 버섯으로 단백질과 비타민 B, 미네랄이 풍부합니다. 다양한 요리에 활용됩니다.
  veg.okra:
    label: 오크라
    summary: 녹색 줄무늬 씨앗 껍데기 형태이고 미끌어지는 질감; 감보 음식에 사용됩니다.
    info: |-
      옥라는 열대 아프리카에서 기원한 식물입니다.
      미국 요리인 감보의 기본 재료이며, 그 미끄러운 질감은 소스를 더 풍부하게 만듭니다.
      가로 절단면에서는 별 모양을 형성합니다.
      이것은 섬유질과 비타민C와 K 그리고 엽산으로 가득 차 있습니다.
  veg.onion:
    label: 양파
    summary: 맛을 더하기 위해 사용하는 자극적인 층이 있는 양파류 채소입니다.
    info: 요리에서 가장 많이 재배되는 채소 중 하나인 양파는 전 세계적으로 음식의 풍미를 높이는 데 사용됩니다. 항균 효과가 있는 플라보노이드 성분을 함유하고 있습니다.
  veg.parsley:
    label: 파สล리
    summary: 밝은 녹색 야생 식물이며 조미료 및 장식 용도.
    info: Пет로셀리움 크립스텀(Petroselinum crispum), 즉 파슬리는 향신료와 장식용으로 널리 사용된다. 오렌지보다 무게당 비타민C 함량이 더 높다. 매끄럽고 평평한 형태의 것과 кудрявый(구불거린) 종류가 있으며 요리사들은 맛있기 때문에 평탄한 것을 선호한다. 고대 그리스에서는 죽음과 연관되어 묵직하게 운반되는 관 위에 올려졌다.
  veg.parsnip:
    label: 파스티나크
    summary: 연한 밀가루 색깔의 흰 줄기 모양 루트 베지타블로 중세 시대에는 유럽에서 중요한 음식으로 사용되었습니다.
    info: 파스티나카(Pastinaca satива)는 당근과 관련된 흰색 뿌리 채소입니다. 감자 도입 이전에 유럽의 주요 식량이었으며 현재보다 덜 일반적입니다. 달콤하고 견과류 같은 맛을 가지고 있으며 서리를 만나면 더 단맛이 강해집니다.
  veg.peas:
    label: 빈트
    summary: 줄기 안에 작은 논두알 모양으로 자라는 초록빛 알갱이는 아름다움의 상징.
    info: |-
      빈트는 고대부터 재배된 콩과 식물이다.
      그레고르 멘델은 유전학 실험(1856~1863년)에서 빈트를 연구했다.
      녹색 외피 전체가 먹을 수 있는 눌름빈트와 달콤한 맛의 당근빈트도 있다.
      식이섬유 및 비타민 그리고 단백질로 가득 차있다.
  veg.pepper:
    label: 파프리카
    summary: 빛나는 색을 지닌 단맛 또는 매운 맛의 채소입니다.
    info: '파프리카(학명: Capsicum annuum)는 달콤한 종과 매운 종이 모두 존재합니다. 빨간 파프리카는 모든 채소 중 비타민 C 함량이 가장 높습니다.'
  veg.potato:
    label: 감자
    summary: 세계各地에서 다양한 요리의 주요 재료인 갈색 뿌리 식물.
    info: 감자는 남아메리카 안데스 산맥에서 유래하며 세계에서 가장 중요한 작물 중 하나입니다. 탄수화물과 비타민 C, 칼륨을 함유하고 있습니다.
  veg.pumpkin:
    label: ' 호박'
    summary: 크고 주황색의 구형 채소이며, 할러윈 및 가을 요리를 상징한다.
    info: 호박(Cucurbita maxima 또는 pepo는 아메리카 원산이다. 베타 카로틴과 비타민 A와 C가 풍부하다. 할러윈 조각 전통인 '잭 오 랜턴'은 아이reland에서 유래했다.
  veg.radish:
    label: 무
    summary: 작고 매운 붉은 근채 채소이며 전용 애페티자 및 봄철 특선 음식으로도 즐길 수 있는 식품
    info: 무우(radish Raphanus sativus)는 빠르게 자라는 근채 채소입니다. 작고 붉은 샐러드 무와 대형 흰색 겨울 무(daikon)가 있습니다. 항균 성분인 글루코시놀레이트를 함유하고 있으며 일본에서는 다이кон 무가 기본 요리 재료로 사용됩니다.
  veg.spinach:
    label: 상추
    summary: 철분이 많은 짙은 녹색 잔디 채소입니다.
    info: |-
      상추(스피나치아 올레라cea)는 중세 페르시아에서 유래했습니다。
      비타민K, 비타민A, 비타민C, 엽산 및 철분이 풍부합니다.
      팝 아이(Pepeye), 즉 만화 속 해군은 1930년대부터 상추를 어린이에게 좋은 슈퍼푸드로 홍보했죠.
      삶을 때 산패브록산이라는 물질이 방출되어 칼슘과 철의 결합에 영향을 줄 수 있습니다.
  veg.spring_onion:
    label: 봄양파
    summary: 흰색 줄무늬 기반과 초록빛 줄기를 가진 섬세한 형태의 채소로 주로 샤슬릿 재료이다.
    info: '봄양파(학명: Allium fistulosum 또는 Allium cepa)는 아직 익지 않은 상태에서 수확된다. 일반 양파보다 부드럽고 자극이 적다. 아시아 요리에서는 장식용으로 사용되며 샐러드와 스튜에 넣기도 한다.'
  veg.squash:
    label: 티케브
    summary: 모습과 형태는 다양하며 가을 요리를 위한 기본 채소.
    info: |-
      {"hint":"다양한 모양의 겨울 호박(Cucurbita 종)","info":"겨울호박은 버터넛, 아코른, 딜리카타 그리고 카보차 품종을 포함한다.
      경화된 껍질 덕분에 수개월 동안 보관할 수 있으며, 한동 안 내내 저장이 가능하다.
      비타민 A와 비타민 C 및 복합체 B가 풍부하게 들어있다.
      세 자매(옥수수·콩·호박) 시스템에서 원주민들의 식생활에서 중요한 역할을 하였다."}
  veg.swede:
    label: 루타바카
    summary: 크고 보라색과 노란색을 가진 원형 근채류; 영국 해글레(Haggles) 요리 재료
    info: 튜린(Brassica napus)은 배추와 당근의 교배종이다. 미국에서는 루타바가라고 불리며 스코틀랜드에서 하기스(haggis)에 필수적인 부식으로 사용된다. 삶으면 달콤하고 고소한 맛이 난다. 비타민C와 식이섬유를 풍부하게 함이며 북유럽 지역에서 인기가 있다.
  veg.sweet_potato:
    label: sweet potato
    summary: 오렌지 색감 있는 단맛 나는 죽순; 서브트롭에서 온 전통적인 감자의 가족.
    info: |-
      사탕무(Ipomoea batatas)는 남아메리카 원산이며 식물학적으로 감자와 관련이 없습니다.
      beta 카로틴과 비타민 A 및 C 그리고 섬유질을 풍부하게 함으로써 유용합니다.
      orange색의 고형분은 베타카로텐에 의해 인해 발생됩니다.
      african, 아시안, 라티노아메리칸 요리는 수세기 동안 기본 음식입니다.
  veg.taro:
    label: 상수芋
    summary: 보라색 반점을 가진 대형 전분질 채소;열대 지역의 기본적인 곡물.
    info: |-
      {"hint":"대형 전분질 보라색 반점이 있는 뿌리줄기(Colocasia esculента)","info":"상수芋(Maniok)(Colocasia esculenta)는 열대지방에서 수천 년 동안 재배된 식품입니다.
      폴리네시아와 아프리카 및 아시아의 주식이며 하와이는 발효한 상수芋을 'poi'로 소비합니다.
      약간 견과류 향기를 지니며 고유하게 생긴 보랏빛 줍은 것은 시각적 특징입니다.
      생으로 먹으면 산화작용에 의해 화끈거리는 느낌이 있으므로 반드시 익혀먹어야 합니다."
  veg.tomato:
    label: 蕃茄
    summary: 빨간 둥근 과일로 채소처럼 사용된다.
    info: 蕃茄는 식물학적으로 과일(덩이과)이지만 주방에서는 채소로 사용됩니다. 남아메리카에서 유래하며 리코펜과 비타민 C를 함유하고 있습니다.
  veg.turnip:
    label: 타구니
    summary: 흰색-보라색 원형 루트 베지터블로 오래전부터 중앙 유럽 음식.
    info: |-
      타구니(Brassica napus ssp.)는 당근과 관련된 뿌리 채소이다.
      서아메리카에서 감자가 도입되기 전에 유럽의 주요 식량이었다.
      vitamin C와 칼슘 그리고 섬유질을 함유하고 있다.
      채식주의자의 고기 대안으로 사용되며 타구니 수프는 중부 유럽 지역의 전통적인 요리다.
  veg.watercress:
    label: watercress
    summary: 물을 따라 나는 짠하고 쓸모 있는 초록색 야생식물
    info: 물蔊초(학명 Nasturtium officinale)는 시원한 계곡과 샘에서 자라는 식물입니다. 이 향신료 같은 맛은 글루코시놀레이트인 신이그린 덕분으로 매운 고추맛을 냅니다. 비타민 C와 K 그리고 베타카로틴 함량도 매우 큽니다.
  veg.yam:
    label: Jama
    summary: 열대지역에 있는 큰 전분 성 분홍색 털이 많은 채소
    info: ' Jamaica(Dioscoreya)는 아프리카와 아시아 그리고 카리브해 지역의 열대 지방에서 나는 큰 전분성 뿌리다. 바테타(Batata)랑 구별된다: 자마니어(Jamienye)는 더 건조하고 고운 감자이며 덜 달콤하다. 무게가 최고로 70kg까지 나간다.'
  veg.zucchini:
    label: 쿠크테
    summary: 녹색 여름용 채소로서 요리는 물론 베이킹에도 다양하게 활용된다.
    info: 쿠케타(Cucurbita pepo)는 여름용 тыква로 아직 익지 않은 상태에서 수확하며 길이는 약 7~25cm이다(주요 특징). 멕시코 원산이며 유럽에서는 이탈리아가 널리 퍼뜨렸다. 물이 전체의 90% 이상을 차지하고 있으며 치료적 가치도 있다. 글루텐 없는 식단에 사용하기 위해 라면 대체품으로 연구되고 있다.
