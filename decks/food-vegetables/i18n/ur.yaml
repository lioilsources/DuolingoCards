lang: ur
pivot: false
title: سبزیاں
cards:
  veg.artichoke:
    label: آرٹائشوك
    summary: ایک لمبا زرد نمومۂ؛ صرف فولوں کے آغاز کو خورد.
    info: ارٹیچوک اصل میں بڑے جھاگ والی پودوں کا تازہ سبزی ہوتا ہے۔ عام طور پر ان کے دلوں (نیچلی حصہ) اور موٹی شاخوں کو استعمال کرتے ہیں۔ یہ ذائقہ بنانے والا ہونے لگتا، تو 'سینزان' او ر'Cynar' ورمات عرق حفاظت شامل ہوتا ہے۔
  veg.arugula:
    label: روکولا
    summary: ایک زبردست ذوق و شعاع والا تارو غصّائی سلاد
    info: روکولا، ایتالین کُھانے میں استعمال ہونے والی تازگی دہن سبزی ہے۔ یہ مدتوں علاحدہ طور پر بطور خوش ذائقہ سلاد لفافا جانا جاتا رہا ہے۔
  veg.asparagus:
    label: سربرا
    summary: تندّر سبز فصليٖ بوٹيٖ؛ موسميٖ غذائى سبزي
    info: |-
      سپاراگوس اُفیشینلز، جو کہ سبز فصل کے پھول محسوب ہوتا ہے۔ نرم رنگ والے سبراسکرچ کو سورج کے بغیر تازہ حالت میں زمین دی جاتی ہے؛ لہٗذا وہسبز قسم سے بڑھ کر خوش ذوق ہوتا ہے۔ ۲۰ - ۴۰٪ لوگوں کے درمیان ان کے استعمال کرنے کے بعد شناختی عرق آتا ہے(ایسپراݔرسائن)

      جرمن (سربروئل)، فرانسوی طرزِخوردن میں عام طور پر مقبول سبزی ہے۔
  veg.bamboo_shoot:
    label: bamboo shoots
    summary: جوان بامبو کے شاخیں؛ ایشین سبزی
    info: بامبو کے جوان پودا اس وقت توڑ لیئے جاتے ہیں جب وہ نکل رہے ہوتے ہیں۔ ان سے مغرب آسٹریلو، جاپان اور تھائی خصوصی غذاؤں بنائی جاتی ہیں۔ تازہ بامبو کے جوانوں میں ساینڈ موجود ہوتا ہے، اس وجہ سے انہیں ضرور پکانا چاہئے؛ دبا حالت میں محفوظ ہونگے۔ یہ کم حرارت والی قسم ہے اور فائبرز سے زائد ہے
  veg.beet:
    label: چرورنیا رِپا
    summary: تمواً چرنّوؤَ کُردلا ؛ علامتی حالت اور غذاییت.
    info: چرورنیا رِپا، بیٹا وولگارس کے نام سے جانی جاتی ہے اور اس میں بتائینائن موجود ہوتا ہے۔ یہ قواعد طبیعی آکھروالا پودا ہے۔ یہ دلائل فراوان ہونے والی غذا ہے جو تربیت زندگی کو بڑھاتی ہے اور خون کے دباﺅ کم کرتی ہے۔ شوق لاءٗ کی روغن تو مختلف نوعیت کی ہوتی ہے؛ یہ سفید چینی کا ذخیرہ ہے۔
  veg.bok_choy:
    label: paek cay
    summary: اسيوياوي ليست ويݢينا جيسنى بيلى شاخ ديروارلي ليسن توں مشتمل
    info: پاک چوئی، جسے بھو کائويٰ بہم ترجمانى ساتھ دنيا ميں پذيرائي حاصل ہے اور واقعی چائنيز Brassica رَبا subspecies chinensis کا نام ہے۔ یہ زردچوبه فرانسيسى خصوصيات والى چين، جابون اور تيلند کيشني کيبودى بناء ہوتا ہے۔ یہ وٹامنز سي، كاي، اي اور كالشيم سميت متعدد ضروري غذايتي عناصر سے لبرت ہوا ہے۔
  veg.broccoli:
    label: بروکولی
    summary: ایک سبز فصل جس کا گلابنوبہ موٹے پتّے والے تار میں چمکتا ہے۔
    info: بروکولی براسیکا اولریسس سے تعلق رکھنے والی ایک سبز فصل ہے۔ یہ وٹامن سی، کے اور آنتی اوکسائڈینٹس کا بڑا ذخیرہ ہے؛ یہ اطالیہ سے تعلق رکھتی ہے۔
  veg.cabbage:
    label: ہلايكوي زدي
    summary: اس کا استعمال مختلف قسم کے غذا مثلاً ساريركراؤچٔ بنانے ميں ہوتا ہے
    info: ہلائیکووا زدّی کا ایک قدیم سبزی ہے جسے لاشعور مغرب تھousand برس قبل پالا جاتا رہا۔ یہ وٹامن سي، كي اور انٹر کینسر خصوصتوں والے گلوکوزينوليت حامل ہوتا ہے۔ وقت آمارشان نتئج فروتنى ساريركراٗچٖ، جود يه شيداء لَبرتيت هستند۔
  veg.carrot:
    label: گاردن کریٹر
    summary: ایک نمکین ذائقہ والی آرنسج زمیندار اُگ۔
    info: گارڈن کریٹر دو سالہ پودا ہے جسے رس دار آرنسج جڑ حاصل کرنے کے لئے پروان چڑھایا جاتا ہے۔ یہ بیتا کاروٹن (پروفائٹامن A) اور فائبر سے بھرپور ہوتی ہے۔
  veg.cauliflower:
    label: کیلن
    summary: بڑے عدد میں بوتل کا سفید مواد؛ برسلز کا سفید سبزی منصوبہ
    info: کیلر کے قارب بروکولی سے تعلق رکھتا ہے۔ اس کا پانچرا رنگ، ورقوں کی وجہ سے سورج کی روشنی سے نمٹتے وقت حلوائین فورمول جذب کرنے میں آسانی کام لاتا ہے۔ یہ بلیڈز، انرجنس اور زرد درجوں میں موجود ہوتا ہے۔ غیر مرطوب خوردہ میں کیلن ایک عام طرح دال یا چاول کا عوض بنایا جاسکتا ہے۔
  veg.celeriac:
    label: بلوفووي سروجه
    summary: سبزی کا لمبا سنتری سا سفید جذر؛ زردحشر کے انعامات کا بازن
    info: |-
      بُلْوَفِ کی سرکه اسٹم جڑ، آئیوم گراورولنس وار۔ راپاسےام)، پودہ نجات دینے والی لالچن معدنیت والا باغ تھلاں کی قسم ہوتی ہے
      ایسا شدید خوشبو اور ذائقہ والی سروجان ہوتی ہے。
      یہ زردحشر تو فوج، سروجن کے سلوش (رمولاڈ) اور درازان حضرات کے غذائی طبع کے بنیادی عنصر ہوتا ہے۔
      سرخند کے علاقے سے منشا؛ چیک، فرانسوی اور جerman کثیر استعمال کرتے ہیں
  veg.celery:
    label: راݙِشوَ‏
    summary: ایک قدرتی عطر والی کُجھال حلال ہندوانہ سبزی
    info: پارمیڈین کرنشن اسکواش، جو Apium graveolens سے تعلق رکھتا ہے، دریائے وسطی مشرق سے آیا۔ بعض لوگوں نے دعویٰ کیا ہے کہ پانچل کھانا بنا توڑتی وقت زائد حرارت ختم کرتا ہے؛ لیکن حقائق ثابت نہیں کئے گئے۔ فرانسوی غذا کے بنیادی عنصر 'Mirepoix' (بٹّا، مرغوب، پانچل)، جس میں یہ شامل ہوتا ہے۔ پانچلوں کا رس عام طور پر صحت مند مشروبات کے طور پر استعمال ہوتا ہے۔
  veg.chard:
    label: منقلد
    summary: بڑی برقع دانش مندانہ تازه فصل
    info: |-
      مینگولڈ، سرخ ریپ کا اہل قرابت ہے۔
      ایک زرد، لال، پھلوار جاتوں والی نسلا وجود میں آتا ہے。
      اس میں وٹامنز K,A,C اور خوبصورت عنصر(سوڈیم، ماچ)
      mوجود ہوتا ہے۔
  veg.chickpeas:
    label: چِزرنَ
    summary: بُرا آورو رنگ کی گولا دال؛ حمّوس اور فالفل کا بنیاد
    info: چِزرنا، ایک محبوب دال کا پودو جسے بالعموم قرطبہ ساحل اور بھارت میں استعمال کیا جاتا ہے۔ یہ حمص (دال والی عرقان) اور فلفل (غیر زنگین تاراول)، دونوں کا بنیادی عنصر ہوتا ہے۔ یہ روایتی طور پر نباتي ذخائر کا منبع ہونے کی وجہ سے ویجنس اور شاق لاء غذاؤں میں عام ہے۔
  veg.chili:
    label: چلی
    summary: شعلہ دار لال یا سبز پودیندر؛ زبردست معطر غذا کا بازن
    info: 'چلی لال اور سبز رنگ کا تکوں مہم جوش پودیندرا (capsicum annum) ہوتا ہے۔ شعلہ دار خصوصت کپسائسن نامی مرکبات کی وجہ سے ہوتی ہے، جس کا اندازاً اسکولبل فریم ورک استعمال کرتے وقت حساباتی طور پر بنا ہوا ہے؛(جلاپائنؤ: ٢۵۰۰ - ٨٠٠٠ SHU)، (کیرولا روئرب: + ٣١٤٥٦٧٩٪٥٦٧٨٩٠SHU )۔ کپسايسين کا ترقّی آفتاب: جانوروں کو دور کرنے کے لئے، بلکہ بالغندروں کو نہیں، جو بذرات کو پھیلاتے ہیں۔ عالمِ غرب، ماکسکو اور بنگال کے غذا کے بغیر چلی قابل ذکر نہیں۔'
  veg.corn:
    label: کوکوریس
    summary: ذرت کا ایک پود سبزی جس میں زرد دانے ہوتے ہیں۔
    info: ذرت وسطی امریکا کی قسم ہے اور آج یہ سب سے زیادہ فصلوں میں شامل ہے۔ ذرتوں میں شکر، پروٹین اور وٹامن بی کی موجودگی ہوتی ہے۔
  veg.cucumber:
    label: کوکوربیا
    summary: ایک لمبی سبز سبزی جس میں تازہ اور رس دار گوشے ہوتے ہیں۔
    info: کوکوربیا ایک گرم علاقوں کی سبزی ہے، جو پھلیاں والی فصل کے خاندان سے تعلق رکھتی ہے۔ اس میں 95% پانی موجود ہوتا ہے، یہ تازہ لگاتی ہے اور سالڈ یا ناشتے کے طور پر بہت پسند کی جاتی ہے۔
  veg.eggplant:
    label: eggplant
    summary: '''Melanzane'', ''aubergines'', aur ''eggsplants'''
    info: "لائلک سولانوم میلوݙجنا، بھارت کے علاقہ توں تعلق رکھن والا اُگردا؛ لاکھوں سال پیدوار جاری۔\niتاليا وچ 'ملازنزا' فرانس وچ 'آبِرجین' اور نام\nامریکا وچ انڈے د‏‍ لَٹّي دا ناں۔ \nاس وچ قوت خاص طاقتواں والا آنتائؤئٽس ماوجود ا‏‍ء۔ \nتماترا زرد روپ وچ موجود۔"
  veg.endive:
    label: چیکانکا
    summary: روشن پتوؤں والا عضو جس میں ترش حلاقوں کا وجود ہو؛ سالاد کی تشکیل کا آغاز
    info: "چیکانکا (سائنسی ناماتم کے سبز فصلوں میں ایک خصوصی ترش حلقہ والی پودی، جنر وار انٹابس یا سی۔ایندورجا ) شامل ہوتا ہے۔\nپھلوں کا رنگ روشن بننا برقعہ لگا کر زراعت کرنے (جیسا کہ چِکوری)، یا سورج کی طرف سے (واٹلوف) کرتے وقت ہوتا ہے。\nترش قسم کی غذا 'انٹربائن' ایسڈ کی وجہ سے ہوتی ہے؛ بلینشرمنگ کے ذریعے یہ ترشی کم ہوجاتی ہے۔ \nبلجئیم چیکانکا(واٹلوف) موذون برادری کی دلچسپ فصل ہے، جو فرانس اور بلجئیم دونوں ممالک میں مشہور ہے۔"
  veg.fennel:
    label: فنبل
    summary: ایک سفید لعل جس کے بالغندم پروٹھے ہوا ہوئے ہیں اور زائل مچھر دان کی مثل الذوق
    info: فینیکل (Foenum graecum)، اس کا ذائقہ مچھر دان سے مشابه، جو اناتول نامی تازگی والی غذائیت کی وجہ سے ہوتا ہے۔ فنبل کی بلوط، پتوں اور شاخیں دونوں قابل خورد ونوش ہیں۔ یہ عربی دریائی طرزِ حلقہ کے بنیادی عنصر ہے؛ استعمال ہوتا ہے پستو، سالڈز اور آتشبازی روشناݪ میں۔
  veg.garlic:
    label: لہسن
    summary: تیز خوشbow، سفید گوٹھ والا جڑی بوٹی جس کا استعمال بہت سے پکائے ہوئے غذا میں ذائقہ کے طور پر کیا جاتا ہے۔
    info: لہسن کو ایک تاریخی وقت سے روزمرہ کے پختہ کام میں نہ صرف ذائقہ بلکہ دوا کے طور پر بھی استعمال کیا جاتا ہے۔ یہ الائیسن شامل ہوتا ہے، جو انتباہ کن اور ضد آبشاری خصوصیات کا حامل ہوتا ہے۔
  veg.ginger:
    label: زاݙزر
    summary: ایک شمع کی طرح بنی جلد والا جڑ، جس میں تند اور خوشbowd بوخوبصورت وجود
    info: زائزوور جو ایک تپتہ علاحدگان کا جڑ ہے، مغربی آسٹرلیشین سبزی کمبوچن باغات سے نکالا۔ یہ زِنجبرول شامل ہوتا ہے، وہ مواد جو دردناک پروڈکشن اور ضد انفلاممتھ فطرت کے لئے ذمہ دار ہے۔ تحقیقات ثابت کرتی ہیں کہ زائزوور قحط طاقت اور معده غیر حاضر رہنے والی صلاحیتوں کے خلاف مؤثر ہوسکتا ہے۔
  veg.green_beans:
    label: فَيزُلُوز ولْݢرس کے زرد حوض
    summary: لمبا سبز فازولوم؛ نارمل طور پر بالغ شدہ
    info: فیزولوس ولگریس کے لمبے اور پتلے سبز دانہ والے بینسن جنھें فرنچ بنس، استربنز یا بوبي بنس کے نام سے بھی جانا جاتا ہے۔ ان میں وٹامن سي، كي اور فيو لک موجود هوتا ہے۔ منڈلوں سمیت بلنشن اور باشپن رستوان تاليف عام آمریکائی غذا (جِين بيئن قسم کاسرويل) ہے۔
  veg.kale:
    label: کاپوستا کادروآ
    summary: تماوٗ اندازر توڑنا چھلنی والی سبزی؛ سوبرفوڈ
    info: "کاپوستا کادراوا (براسسیکا اولرئسسے وار۔ سابلليچيا)، بہت غذائیت والی تازہ سبزی ہوتی ہے。\nایسا فائدہ مند خوردنی Vitamins-K، -A، -C اور آنتioxیدنٹس میں پانی ہوتا ہے۔\n2010ء کی دہائی میں جماعتوں نے اس کو صحتمندانه زندگی کا علامات بنالیا۔ \nسوراخ شدہ کائل حلقہ والا؛ ترش لفظی طور پر مطلب روزمرہ استعمال کرتے وقت ضبط کرنے کے بعد ذائقہ عام ہوجاتا ہے۔"
  veg.kohlrabi:
    label: کدلوبن
    summary: سبزی جس کا تندرست حصہ چونچلے فطرت میں ہوتا؛ زلف کے قرب میں
    info: کیڈلووبن کا علمی نام Brassica oleracea gongylodes ہے، جو پتّاجوشملہ سبزی کی اقسام میں شامل ہوتا۔ گائولسٹر اندازمیں تھلایا چڑوا دینے والاتار واقع ہوتااوراس کے پتوں کانھال بھی لیجاتاہے۔ یہ خوردنی حالت میں براحت کے ساتھ استعمال کیاجاتاہے یاعادتاً پختہ شدہ صورت میں۔ اسماءصلح عام طورپرنماذش ہم زبان لوگوں کے درمیان مشترک ہے 'Kohl' جوزلف کومقابلہ رابی(خندق)، معروف ہے۔ یہ بالخصوص آئرشنا، جermenies اوروکرجن کے علاقوں میں مقبول ہے۔
  veg.leek:
    label: پوورک
    summary: ایک لمبا آرام دہ چرب زمیندار سبزي؛ شوروء اور قائم مقام کا بناء
    info: پوورک، ایلئوم انمولو پراسومن کا نام علمي ہے۔ چھال لگن والی سبزی جس میں ترش حالت موجود ہوتی ہے۔ ویلنڈر فطرت کا علامات ہے؛ ولش لوگ دوسرے روزانہ کارروائی کے موقع پر استعمال کرتے ہیں۔ اس میں اليسین اور وٹامنز کے ساتھ ساتھ سی بھی شامل ہوتا ہے۔ برطانويه، فرانسيسي اور چيك خصوصيت کے طور پر مشترکہ غذا میں عام ہے۔
  veg.lentils:
    label: چوکنڈا
    summary: صاف، چھوٹی لمبندی شکل والی لوستئنس؛ وقفہ حلال غذاء کا ضروری پرو١تن ذخائر
    info: چوکنڈا ایک قدیم دانہ جاتی لوبیائیں ہے، جس کاشت 10,000 سال پرانی ہے۔ یہ قرمزی، سبز، براون اور بلواگا (سوراخدار رنگ) نسل میں موجود ہوتی ہے۔ بغیر تر کرنے کے آپ اسے 20–30 منٹ میں پختہ کرسکتے ہیں؛ یہ فاسولہ سے زود خرد ہوتی ہے۔ یہ بالخصوص انڈین غذافت میں پروٽین کا بنیادی ذخائر ہے (دل، дал)، جو عام طور پر وقفہ حلال غذا میں استعمال ہوتا ہے。
  veg.lettuce:
    label: ہلائیکووا سلاٹ
    summary: خوش ذائقہ وادھارا بالغ شراکت
    info: ہلائیکووا سلاٹ کا علمبردار نام لاتچوئس اے۔ انگور، رومان، لو لا، بٹرهد، آک لف متنوع قسمیں موجود ہن۔ مصر میں قدامت پسنداً فصل تھي؛ جبکہ ۹۵% پانی والی ایندھن حامل دالیت زمبوڑيا۔
  veg.lotus_root:
    label: لیٹوس کا جڑ
    summary: لیٹوس کے جڈ़ کا عبور؛ حسن مندوب سوراخ والا ایشان غذاء
    info: |-
      لیٹوس کا جڑ، نلمبو نکفیرہ اسپرولوں والے پامن لاتو س کا زمیندار حصہ ہوتا ہے۔
      اس میں قطعات دکھائی دئيں گے تو آسان انداز میں ترتیب وار سوراخ ظاہر ہونگے。
      ایشان خوردنی فرانسواءٗچ، جاپانی اور براجمند ذائقہ میں استعمال ہوتا ہے۔
  veg.mushroom:
    label: ماکھن کا قطیہ
    summary: ایک سفید-بھوری چوڑی والی قطب جسے پختہ میں استعمال کیا جاتا ہے۔
    info: دو وٹرائی اگاریکس دنیا بھر میں زیر تعلق سب سے عام قطب ہے۔ یہ پروٹین، وٹامن بی اور خشکالوں سے بھرا ہوا ہوتا ہے؛ یہ درجنوں پختہ میں استعمال ہوتا ہے۔
  veg.okra:
    label: octra
    summary: سبز زرد خطوط والے لمبے قسم کے بالجات، جوم بو کا حواله
    info: "اُکرا، جس کو ایبل موش سکسلینٹس بھی کہتے ہیں، تپص دار آفریقہ ملک سے منگنالی۔\noctra عام طور پر امریکی غذا 'gumbo' بنانے کے لئے استعمال ہوتا ہے؛ اس کی نمکین خاصیت انڈسن کو مضبوط کرتی ہے。\noncuta کے علاقوں میں ستاروں کی شکل ظاہر ہوسکتی ہے۔ \noneka فائبر، وٹامنز سي اور كي، اور فيوليك ايسيড سے بھروسا چڑوا رکھتا هے"
  veg.onion:
    label: لائل
    summary: پالیو والی لائی کھس مصالحہ جات کے ساتھ پکوانوں کو تازہ کرنے کے لئے استعمال ہوتا ہے۔
    info: لائل دنیا بھر میں زیادہ پیداوار والی سبزیوں میں سے ایک ہے۔ اسے دنیا بھر میں پکانے کے وقت میں خوشگوار ذائقہ شامل کرنے کے لئے استعمال کیا جاتا ہے؛ اس میں اینٹی باکٹیریل اثرات والے فلاونوئڈ موجود ہوتے ہیں۔
  veg.parsley:
    label: پیٹرچل
    summary: ایک روشن سبز بوتل؛ غذا کو سنوارنے اور معطر بنانے کا عنصر
    info: پیٹرچل کو اکثر مسالہ بنا کے استعمال کرتا جاتا ہے۔ آنگوروں سے زائد وٹامن سي پائیدار وزن کے حساب سے موجود ہوتا ہے۔ نرم، تختہ شکل والی اور موڑدار قسم وجود رکھتی ہے؛ خاص طباقۂ ذوق کشادہ لطافت والا تختہ شکل والی فصل کو منتخب کرنے کا عزم رکھتا ہے۔ قدیم یونان میں لوگ مردن کے ساتھ منسلک ہوا کردروں کو دفناء کے وقت لاڈوں کے روپ میں شامل کئے جاتے تھے۔
  veg.parsnip:
    label: پاستیناک
    summary: سفید قشتری درجہ قدیم یورپی ضروری طعام
    info: |-
      پاسٹیناک ساتیوا کے نام سے جاننے والی اس لالچدار، برفیلا حلقہ وادھل معدوم زمینی تازگی آرنسوں کے خاندان سے تعلق رکھتی ہے۔
      برطانیہ کے روایتی سنڈے روست کا بنیادی عنصر؛ پخته شدہ یا دودھ کے ساتھ بنا ہوا غذا میں عمدہ استعمال ہوتا ہے。
      بندروں کے بعد اور فصل کے آخر میں اس کا ذائقہ مزید مِلتار ہوجائے گا۔
  veg.peas:
    label: لوبیاء
    summary: '''لوبیاء'' موسم خزاں کا علامت نرمی کے طور پر معروف'
    info: چھوٹی سبز دانے والی فصل جس کا علم وراثت میں اہم مقام رکھتا، لفظ 'پسلوم' انگور کے پودے کو بھی ظاهر کرتا۔
  veg.pepper:
    label: پیppersکا
    summary: چمکدار رنگ کی سبزی جس میں تلخ یا زور دار ذائقہ ہوتا ہے۔
    info: پیppersکا ایک سالانہ پودا ہے، جو خوشہ والی اور تلخ قسموں میں موجود ہوتا ہے۔ لال پی peppersکا وٹامن سی کے حامل تمام سبزیوں میں سے سب سے زیادہ مقدار ہوتی ہے۔
  veg.potato:
    label: برامبُر
    summary: دُنیا بھر میں کئی پکوانوں کے بنانے کا بنیادی سبزی جڑ۔
    info: برامبُر جنوبی امریکہ کے انڈیز سے تعلق رکھتا ہے، اور دنیا کی اہم فصلوں میں سے ایک ہے۔ یہ شکردار، وٹامن سی اور پوٹاشیم کا ذخیرہ ہوتا ہے۔
  veg.pumpkin:
    label: دؤن٘ئ
    summary: ہللوونز د‏‏ي قسم د‏‏ي طاقتور سوراخ والی زرد رنگ د‏‏ي چھلانگ؛ موسم گرم د‏‏ي بالخصوص غذاء د‏‏ي شناخت
    info: تربوں کی اصل آمریکا سے ہوتی ہے۔ یہ بیٹا کاروٹین، وٹامن انگورجس اور جی میں پانچ شامل ہے۔ خالوان نما عید الاضحی کی روایات (جاک او لیرن)، ترکیب اُترائواݨ د‏‏ي فضا تو‏ں مشروط ہندی اے۔
  veg.radish:
    label: ردکفا
    summary: چھوٹی لال جڑ کی سبزی؛ انعامی مشروبات اور بہار کا عمدہ قدر
    info: |-
      ریڈکووا رافانس ساتوس نام کا تیزی سے پھلنا والی جڑ کی اُگ ہوتی ہے۔
      چھوٹی باحاحط زرعی ریڈکوف ونسل، بڑی موسم خزاں کی ریڈکف عام طور پر داغدار(داائون)
      ایسا غلوکوزینولیئت حاوی ہوتا ہے جس میں ضدباکتریال صفت موجود
      جاپان میں داءؤن ریڈکفووا بنیادی آشپز فصل ہے
  veg.spinach:
    label: سبنات
    summary: آہن والی تازگی زادہ سبزی
    info: "سبناتٹس (شپینیکا اولرئیسسہ) قدیم فارس کے علاقوں سے تعلق رکھتا ہے۔\nاس میں وٹامنز، جیسے 'K'، 'A'، 'C'، فالوچور اور آهن بڑی مقدار میں پایا جاتا ہے۔ \n1930ء کی دہائی میں نسل درندہ (انقلابی شخصیت) نے سبزی کو بچوں کے لیے صحت مند غذارت طور پر عام کرنے میں اہم роль ادا کیا۔"
  veg.spring_onion:
    label: جرنٔ سبزي
    summary: ایک لمبا، نازک لال سبزی جو بالخصوص انڈائنا کے علاقوں میں عام ہے۔
    info: جَرْنِی سبزی کا اُگ جس میں نمکین خوشہ، پتّوں والے حصہ اور تندروست قسم شامل ہوتی ہے۔ آئشان بچھوان وغیرہ میں استعمال ہونے والا یہ فصل دلدار طرز حاضر رہتا ہے۔
  veg.squash:
    label: تکوا
    summary: '''تری خواتین'' نظام (ذرة فول اور تکوا) کا حصّہ ہونے کے علاوه اُن کا غذا میں بڑا اهمیت ہے۔'
    info: زمستانی تکوے کا مطلب اس سبزی کی مختلف قسموں جیسا کہ بٹر نات، آچارن، دلائیتاؤ اور کابوشا شامل ہوتا ہے۔ ان کی مضبوط پھلوں والی زمین بنیادی طور پر ماہوں تک حفاظت کرتی رہتی ہے؛ اس لئے وہ بالکل موسم گرما کے دوران ذخیرہ کردہ جاسکتے ہیں۔ یہ وٹامنز اے، سي اور بي کمپلس کے منفرد ذرائع ہیں۔
  veg.swede:
    label: ترائن
    summary: بڑا بنفشہ-زرد الجذع زرعی محصول؛ سکالش حطب معروف
    info: "تُرِنٍ (براسسکا نیبس)، کچھل اور رائپ کے مابین جنس پیداوار ہوتا۔ \nامریکا میں اسے روٹبیگا کہا جاتا، سکارز ووڈ حطّس کے لازمی تفصیلات کے طور پر استعمال ہوا۔\nبالآخر بخار دینے والی خوشبو آتا ہے۔\nvitamin c اور فایبر کا ذخیرہ؛ شمالی یوروپ میں مشہور"
  veg.sweet_potato:
    label: باتاٰت
    summary: '''اورنج'' حلووا؛ برطرف زميني انگوروں سے متصل علاقوں میں عام.'
    info: "بیٹا کاروٹین، وٹامن اے اور سی پر مشتمل باتاٰت جنوبی آمریکہ میں نشو دان بالائی تھی۔ \nبرطوار زمینی انگوروں سے الگ فطرتاً مختلف ہوتا ہے۔\noranj رنگ شیرينى بتاء كروتين لئي。\nافريقيه، ايسيويه، اور لا틴 امريكا کُچِنيَّہ ميں صدحي عمر بنجر غذائيتي ضرورييت هوندي."
  veg.taro:
    label: تراو
    summary: بزرگ چربی والا ڈبل روشن حصّہ؛ تروپیکل مناسب غذا
    info: تارو کی اک تروپیکل جڑ، جس دنیا بھر میں سوا لہݙے سال پیداوار وچ استعمال ہوندی۔ آفتاب، افریقہ او راسیاء د‏‍ نمایاں غذائیت؛ هاوئین 'poi' فرسٹولان تراو توں بندا۔ اُس دا ذائقہ خوشگوار ہندی؛ شاخدار علامات اندر حلقہ والی تصویر شامل ہِن۔ تازہ تراو میں قسم دے سنترخ زخم دا باعث ہوسکدن؛ پخت ضروری ہَي
  veg.tomato:
    label: ٹماٹر
    summary: چارمیں رنگ کا گول فروٹ جو سبزی کے طور پر استعمال ہوتا ہے۔
    info: ٹماٹر باتانکلی اُوند (ایک قسم کا میوہ) ہوتا ہے، لیکن آشپذیری میں اسے سبزی کے طور پر استعمال کیا جاتا ہے۔ یہ شمالی امریکا کا مقامی پودا ہے اور اس میں لاکھ تومین اور وٹامن سی موجود ہوتا ہے۔
  veg.turnip:
    label: tamaska
    summary: سفيد -بنفسجى گول جُزردار سبزي؛ قدامت پسنديه مرغوم تعويض
    info: "تامسکا قدرے سفید اور بنفشی رنگ کوئلہ جڑ والی پھلوار، ترقوں سے متعلق ہوتی ہے۔\neurope مغربی آمریکا سے آٹو لائنس برابر انداز میں فصل قبل حبوبات کی بنیادی غذارتی ضمانت تھی۔ \nاس میں وٹامن سي، کلسیم اور الیاف موجود ہوتی ہے。\n\nایک نباتي دال کی طرح استعمال؛ تماشکا کچلنا central europe کا روایتي رسپِسٗ هَے"
  veg.watercress:
    label: رِشچا
    summary: درختي نظام وچ وجود رکھوا چھوٹا، تارا خضابات والا، تند ذائقه والا بوتل
    info: "ریشچا وودنے رُد ناستورتئم آفِسینل کول سرد درہوں اَور پانی د‏‍ ناکلوں وچ بݨدا ا ۔\nاس د‏  مزہ تند، مرچ جیسا ھوندا ا ۔ اس وجہ توں غلوجوسائنسلاٹس انگریزوال سنیجرائن\nاس وچ وٗٹامنز سيّ، كى اَور بتا-كاروتين زائد موجود ھن۔ \nبرطانیہ وچ اسنو ں روایتي طور اُتے سینڈويچ د‑   لاء استعمال کيتا جاندا ا ؛ فرانس وچ 'پوٹج' اُتوں رِشچا شامل ھوندي ا 。"
  veg.yam:
    label: جام
    summary: ایک درخت کی لمبی چوبناواں جڑ؛ عام طور پر براؤٹ سمجھ لیتا ہے
    info: چانسیا جام، افریقہ، آئرین کے تپش بند علاقوں میں پائی جاتی ہے۔ یہ براؤٹ سے مختلف ہوتی ہے؛ جام زیادہ خشک، شوگراور کم حلوارنما ہوتی ہے۔ یہ بالعموم ۷۰ کلو وزن تک رکھتی ہے۔ یہ غرب الماس فرعونی دشت کے لحاظ سے بنیادی طعام ہے، جہاں ٩٥% نمونہ واردات انڈمان کرتا ہے۔
  veg.zucchini:
    label: کیوئٹا
    summary: ایک زرد لطافت؛ آپ کو خوبصورت انداز میں پختگی دینے والی
    info: کیوئٹا کے نام سے جانی جاتی ایک تازہ مچھر، جس کا علمبردار باغبانی کرتا رہتا ہے۔ وہ پودین کے طور پر استعمال ہوتی ہے۔
