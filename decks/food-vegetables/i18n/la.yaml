lang: la
pivot: false
title: Hortus Vegetabilis
cards:
  veg.broccoli:
    label: caulis broccoli
    summary: Virides herba cum capite flore densa super pedicellum crassi.
    info: Caulis broccoli est viride legume ex familia Brassicaceae. Est particulariter dives in vitaminis C et K atque antioxidants; originatur ab Italia.
  veg.carrot:
    label: carota
    summary: Ornata dulcis radicis hortensia.
    info: Carota vulgaris est biennis culta pro sapor dulci et succos radice ornato. Est abundans in beta-carotenum (provitaminum A) et fibras.
  veg.corn:
    label: mais
    summary: Planta cum granis dulcibus in spiculis.
    info: Mais originatur ex America Media et hodie est unum ex fructibus agriculturarum frequentissime colatarum. Granorum continet saccharidos, proteinas et vitaminae B.
  veg.cucumber:
    label: cucumber
    summary: Long green vegetable with cool juicy flesh.
    info: The cucumber is a tropical vegetable belonging to the gourd family. It contains 95% water, making it refreshing and popular in salads or as a snack.
  veg.garlic:
    label: allium
    summary: Picantem bulbum album cum odore intenso, fundamentum saporem multarum ciborum.
    info: Allium sativum usus est in culina pro milia annos tamquam aromatum et medicamentum. Continet allixin, quod habet proprietates antibacteriales et anti-inflammatorias.
  veg.mushroom:
    label: fungus
    summary: Pallidus-fuscus fungo-capillatus utilis in culinaria.
    info: Agaricus bisporus est omnium cultorum fungi saeculi communissimus. Est rutilus proteinis, vitaminis B et mineralibus; ad infinitatem ciborum usus fit.
  veg.onion:
    label: cepa
    summary: Picantem bulbus stratificatus pro condimentum alimentorum.
    info: Cepa culinaris est una ex hortensibus cultis saepe iam orbis terrarum. Ad gustum alimentorum per totum mundum adhibetur et flavonoidea bactericida continent.
  veg.pepper:
    label: capsica
    summary: Luceat colorata hortensia cum sapore dulci aut acris.
    info: Capsicum annum annua est in speciebus dulcibus et piccantibus. Rubrum capsicum maximum continet vitaminum C inter omnes species leguminum.
  veg.potato:
    label: batata
    summary: Tuber subterraneum ex Solanaceis, cibus principalis multorum gentium.
    info: Batata Americae Australis Anderum origo est et inter fructus culturales maximas importantes mundi numeratur. Est fontem saccharidorum, vitaminis C ac kalii.
  veg.tomato:
    label: tomatum
    summary: Rubrum rotundum fructus ut vegetabilis usus.
    info: Toma tum botanicē est fructus (bubula) sed culinariter sicut hortensia utilisatur. Originat ab America Meridiana et carotenum Lycopenum cumque vitam C continet.
