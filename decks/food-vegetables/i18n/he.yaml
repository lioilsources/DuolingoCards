lang: he
pivot: false
title: ירקות
cards:
  veg.artichoke:
    label: _artichoke_
    summary: ירקות ירוקים גדולים בצורת פרחים עם גוון לבן פנים
    info: ארטיקוק הוא זיגוג של צמח בדול גדול שמיוצר מהשורש הפנימי שלו והחלקים הדרמטיים ממנו. מצריכים את הלב ובסיסי העלים המוצמדים ללב. תערובת ארטישק משמשת כטעם בכמה דリンクיס כמו קינזאנו וכיןר Vermouth מכילים חומר זה.
  veg.arugula:
    label: רוּקוֹלוָ
    summary: צומח ירוק עם טעם חם ואיכות ייחודיות - רוכך של השף האיטלי.
    info: |-
      רואקולה (Eruca vesכאריה סאבספ. سابטיקה) היא צמח מזרחי שמקורו במזרח התיכון והים הדרומי.
      it מאופיינת בטעם חריף ומריר במיוחד thanks to גלוקוסינולטים.
      היא נחשבת לאחד המרכיב המרכזי באוכל האיטלקי ונשאפת לרוב על פיצה לאחר אפייתها.
  veg.asparagus:
    label: špergal
    summary: 嫩春季芽；時令蔬菜。
    info: שפרגל הוא אחד המטעמים היקרים של האביב. שפיגל לבן נращים ללא אור השמש והוא עדין יותר מהירוק. לאחר אכילה שלו יש ריח מיוחד לשתיה אצל כ -25% מאוכלוסיית האדם.
  veg.bamboo_shoot:
    label: بمبوسوبأ
    summary: צמחים נוערניים מבמפוס - ירקות חלביים באסיה.
    info: במבוסובע הם צמחים נежיים של במבוס שנאספים מוקדם לאחר שורשם.הם מהווים בסיס למטבח הסיני, היפני והתאילנדי.צרכם טרי מכילים קינון ויש צורך לבשל אותם לפני אכילה; תוצר דחוס הוא בטוח לאוכל.
  veg.beet:
    label: חזרת אדומות
    summary: ירקות עגול כבוש באפור דומה לצבע
    info: |-
      חזרת אדומה (beta vulgaris) מכילה ביטאנין - צבע כתום טבעי חזק מאוד
      היא עשירה בנטריתים שמעצים את הביצוע הספורטיבי וниיחדים לחץ הדם
      שיטה סוכר היא גזע אחר והיא來源 לסוכרים לבנים
  veg.bok_choy:
    label: פוקצ'וואי
    summary: ירק עלים סיני בצבעי ירוק בהירים ולובן
    info: פק צ'וי הוא ירק עלים אסייתי עם ניצני וורדים לבנים ודשא מטושח. זהו מקור חשוב של חומצות B6 וב12 וכן פוליפנולים אנטיออกסידנטיים.
  veg.broccoli:
    label: բրոկոլի
    summary: Բաղձանքը՝ հետևյալ գծերով․ «Կապույտ» մթերք է։
    info: '{"hint":"ירוק שורש עם ראש פרחים צפוף (ברסיקה אולרייסיא)","info":"בрокולי הוא ירק ירוק מהמשפחה של האבקת השדה. הוא غني بشكل استثنائي בוויטמין סי וקי ואנטואקסידאנטים؛ מקורו באיטליה.","label":"ბროკოლი","summary":"ירקות ירוקים עם ראש הפרח הצפיפה על עמודה מותכת."}'
  veg.cabbage:
    label: carrot
    summary: תוצר ירוק בצורת חנית עם листья плотно прилегающие друг к другу; основной компонент для получения ферментированного картофеля.
    info: |-
      כרובים (ברסיקה אולרוסה) הוא ירק עתיק שגדל באירופה已有천년이상。
      מכיל ויטמינים C,K ve גלוקוזינולים עם תכונות אנטי סרטניות。
      במצב של קמח מתקבל סאוארקראוט (שומשום גרמני),غني בפרוביוטיקים。
      בתוך האוכל הגרמני כרובים היא מאכל בסיסי;
      b Koree הצפונית יש לו גם את השם Kimchi.
  veg.carrot:
    label: גרד
    summary: ירק גזע אורנג'בי עם טעם מתוק.
    info: גזר הוא צמח דו שנתי שנращים בשלשונו האורנז'ב המọng. זהו מקור עשיר לבטאكارוטן וסיב.
  veg.cauliflower:
    label: קנז'אק
    summary: ראש צפוף לבן של许多 פרחים
    info: קנבס (ברסיקה אולרייסיאה וריאנט בוטרטיס) הוא קרוב לכרובלה. הצבעה הלבנה נוצרת מכיוון שהעלים מכסים את הראש מה太陽, דבר שמונע ייצור כלורופיל.קיימות גם גרסאות סגולות, כתומות וחוצנות.
  veg.celeriac:
    label: 块状芹
    summary: 一種大型球形白色的芹菜根；用作調味料的基本原料
    info: |-
      芹菜根（學名：Apium graveolenes var. rapaceum）是一種專門為了其塊狀的白色大根而栽培的小茴香品種。
      它具有濃郁的芹香味和味道，常用於湯、芹菜沙拉（Remoulade），以及烤製食品中。這種植物原產地中東海沿岸，在捷克、法國及德國料理中最受歡迎。
  veg.celery:
    label: קריית פרח
    summary: תבואה ירוקה עם תחושת נשימה חדה ואroma עוצמית; האם יש בה כלל קלוריות?
    info: פרצ'י קריוטה (Apium graveolens) מגיע מהים התיכון. טוענים כי אכילת כריתה צורך יותר קלוריות במטבוליזם מאשר מוסיפה; טענה זו לא הוכחה מדעית. הוא אחד המרכיבים המרכזיים של הקומבינציה הצפונית האירופאית - Mirpoux (שעועית, גזר וכריטה). סודה קריתי היא משקה פופולארי לניקוז.
  veg.chard:
    label: מאנゴールד
    summary: ירוק שיח באפנון מגוון טרנקי
    info: מנגולד הוא צמח ירוק עם עליים דקים וtronks אדומים או בצבעי קשת. זהו מין של משפחת הורדת השדה (בֵטא פוליגאריס), ובמיוחד תת המינים 'סיקלה'. הצומח غنى בוויטמינים כמו K, A ו-C וכןแรשים כדוגמת鉀 וแมגנזיום.
  veg.chickpeas:
    label: חזר
    summary: зерני לבן עגול; בסיס לhommos yafflel.
    info: חזה (Cicer arietinum) היא פולי מלחמה נפוצה במזרח התיכון ובהודו. זהו הבסיס להומוס (פסטה של חזרים) ולפלפלל (דבש מסוקי). עשירה בחלבון צמחוני; אוכלת מקובלת באכילה טבעונית ובאוכלים רастונים.
  veg.chili:
    label: חציל
    summary: 플פר חם או ירוק עם טעם חריפה; הבסיס של מאכלים חמימים.
    info: פלפר חום חריף מאוד (כגון Capsicum annuum). החריפות נובעת מקפסאין, שנמדד בסולם סקוביל (יאלפינו - בין שני אלפים וחמש מאות לשמונה אלפי שיוואן ידועים, קרוליינה ריפר – מעל שני מיליון שיווונים). התפקיד האבולוציוני של הקפסיין הוא להרחיק млוי חיים mammals ולא ציפורניים birds), שמפיצות את זיגוגי המיניין. במטבח אסיהית, מексicana וอינדו-הודי לא ניתן לדמיין מתכונים בלי פל퍼.
  veg.corn:
    label: תירסה
    summary: צמח ירוק בצבע הזהבה עם рядי גרנולות רכות בכותר.
    info: '{"hint":"محصول עשב גבוה עם גרעינים צהובים (زע מאייס)، נקרא גם תירס","info":"תירסת ארה"ב מגיעה ממזרח אמריקה והיא אחת המטעמים הנפוצים ביותר כיום. הגרעיני התירס מכילים סוכרים, חלבונים וויטמינים מהקבוצה ב.","label":"תירסה","summary":"צמח ירוק בצבע זהבה עם שורות של זרעים טריירים על קנה."}'
  veg.cucumber:
    label: "\U0001F952"
    summary: 一種長且綠色的新鮮蔬果
    info: "{\"hint\":\"חסה ירוקה גלילית ארוכה (Cucumis sativus)\",\"info\":\"\U0001F952黄瓜是葫芦科的一种热带蔬菜，含有高达95%的水分。它清脆多汁，在沙拉中很受欢迎或作为零食食用。\n\",\"label\":\"黄瓜\",\"summary\":\"一种长而绿色、具有清凉口感和丰富果汁的蔬菜.\"}"
  veg.eggplant:
    label: לילק
    summary: 深紫色的椭圆形蔬菜；Moussaka 和 Ratatouille 的基础材料
    info: לילק הוא נبات עגול אפור כה שמקורו באינדיה ומשורש כבר אלפי שנים. ביטלס יתוגדר לילה, בלועז - מلانצנה ובאיטליה - מלנזנצ'ה, ברוסית - דיריאן,而在美国被称为eggplant。它的外皮含有抗氧化剂纳素宁，是地中海和中东菜肴的基础食材：如 Moussaka、Baba Ganoush 和 Ratatouille。
  veg.endive:
    label: çekanka
    summary: יריית שיח לבנה עם טעמה מר
    info: צ'קאנקה היא ירק עלים עם טעם מר מובהר שנוצר על ידי גידול בחשכה או באור השמש בהתאם לסוג הירקות. המרה נובעת מהומלטים של חומצה אינטיבית ויכולה להוזן באמצעות בלנישורה.
  veg.fennel:
    label: פֶניְכּלו
    summary: תעלה לבנה בצורת עץ עם גבעולי פרחים מעוטמים ולטעמו מתוק וניחוח.
    info: פניקולוס (Foeniculum vulgaris), מכונה גם פניקל או אניז ים, הוא צמח עם טעם דומה לאנז' שמקורו באנתולה - חומר אורגаниי מצופה על ידי האן. חלקים שונים של הצומח משמשים למטבח – הבולים שלו נאכלות כמו תבלינים, העלים הירקותיים והעטומים משמשים כפרווה וסיבולת, ובשיטה המזרחית הם מוכרים כסילקון. זרעים של הפינקל משמשים כתבילה במטבח אסייתי ואיטלי.
  veg.garlic:
    label: צלופח
    summary: צ'יף חריפה עם אroma חזקה, הבסיס לטעמים רבים במזון.
    info: '{"hint":"bulb לבן חד עם טעם עוצמתי","info":"שעועית צלופח משמשת במטבח אלפי שנים כבישול וגם כדواء. היא מכילה אלילין שהוא בעל תכונות אנטי חיידות וمضגנויות.","label":"צלופח","summary":"צ''יפס חדה עם ריח ניכר, בסיס הטעם של הרבה מנות."}'
  veg.ginger:
    label: GINGER
    summary: גזר בגון לבן עם טעם חם ומריח חריף
    info: ג'ינเจอ
  veg.green_beans:
    label: فיסטוקי פאזולה
    summary: לחיות ירוקות ארוכות של פנזולה שנאספות כשהן עדיין לא בשלות.
    info: פיסטוקים של פאזוולוס וולגריס נאספים לפני שהופכים לחוורים. הם גם ידועים כפיסטוקי פרנש, סטרינג בינס או באבי בנז. מכילים חומצה אскорביגית, ויטמין ק"ף וחומר הגלובין.
  veg.kale:
    label: капуста кадеравая
    summary: צהובה כחולה שורשים סופרגרש
    info: |-
      קפסולה קדרוואה (Brassica oлерасе ור. سابלлицה) היא ירק טרי עשיר מאוד בזיהום ירוקים темיירים。
      זה כולל חומצות B, א', ג' והגנה על תאים עם אנטיוקסידנטים.
      בשנות ה -twenty ten הפכה ליריית מרכזית של צמחוניים וחובבי בריאות.
  veg.kohlrabi:
    label: kedluven
    summary: ירוק עם בולים מעגליות על שтокים; קרובי משפחה לכabbage.
    info: קֶדלוּבֵן הוא ירק שנמצא במשפחה של כרובית הזרע (ברסיקה אולריאcea). מצרפים את הבולה העגولة והлистים למאכילים. טעם רך ומריר מעט, מתאימה לאكل ג сыр או מבושלת. השם נגזר מהשפה האלמנזית - 'קויל' פירושו קציצת עלים ואורז', כלומר תǔrin.
  veg.leek:
    label: פורק
    summary: צמיחת אליום גדולה ומildה המשמשת כבסיס לסירופי תיבול
    info: פּוֹרֶק הוא צמח משפחת האליאום המכיל אליכין ו維生素K,C. פורקים משמשים בסיס לסלטים ובאכילה טрадיצונלית בבריטניה, צרפת והチェ코סלוובאקיה.
  veg.lentils:
    label: חומוס
    summary: зерновые бобовые семена в форме плоских дисков; основной источник белка для растительного питания.
    info: לינס קולינו里斯 הוא אחד הפסטורים המבוקשים ביותר בעולם והם נращים אותם כבר seit עשרת אלפים שנה. יש זרעים בצבע אדום, ירוק, חומה ולבן כמו גם שחור (בלוגה), והוא נחשב לזרע פסטור מהיר יותר מ빈ות כי ניתן לבשל אותו ללא ייבוש ב -20 עד 30 דקות בלבד.
  veg.lettuce:
    label: סלק
    summary: שיקית ירקות טרי用于 salads.
    info: סלט עגול (Latuca Sativa), נמשך ממצרים הקדומה ונחשב כירקות קלוריים עם מעל ל -%95 חומר רטוב. קיימות מגוון דגמים של סלטים כמו איסברגר ורומין.
  veg.lotus_root:
    label: לָאוֹטוּס
    summary: פריט טריוויאלי עם פנים יפות ונעימות
    info: שורש הלוטוס הוא ניצוץ תחתוני של לוטוס святой ומכיל חורים סימטריים בצורת פרצוף על פני השטח שלו. זהו מרכיב בסיסי במטבח האסייתי - הסיני, היפני והهنדי.
  veg.mushroom:
    label: '"chamar"'
    summary: '"Chama'' beyla ad daqa nutza baofek.",'
    info: '{"hint":"גזרה עם כובע וסاق אוכלית (למשל פטריית בוטון, Agaricus bisporus)","info":"פטרייה דו-שושנית היא הפטריה החקלאית הנפוצה ביותר בעולם. עשירה בשומנים, חלבונים, מינרלים ובויטמינים; משמשת במגוון רחב של מאכלי","label":"חמר","summary":"חמרה בהלה לבנה עד דקה נמצאת באופק."}'
  veg.okra:
    label: 옥라
    summary: פירות זיגוגיים ירוקים עם תקופתי texture; רכישת האוכל האמריקאית.
    info: |-
      אוקרה (Abelmoschus esכלנטוס) היא צמח טרופי מאפריקה המזרחית והדרומית.
      האורגניזציה הבינלאומית להערכה של מזון משתמשת באוגר כמרכיב בסיסי במטבח האמריקאי - ג'מבו;
      texture הרגילה שלו עוזרת ללחמם את הסלטים וסוחות אותם,
      והצורתו על פני השטח דומה לכוכבים.
  veg.onion:
    label: \"\u05da\u05bc\"
    summary: '{\"\u05f6\u05dd\u05bb\u05bd\"}'
    info: '{"\u05e9\u05d4}\" \": {\"\u05ea\u05dc\u05de\", "\u05db\u05be\u05df\u05b8}"}'
  veg.parsley:
    label: פטרוזילית
    summary: ירק ירוק בהירות המשמש גם תיבוק וגם צבעון
    info: פרצ'ל (פטרוסליום קריסיפיום) משמשת כבישול ו데korציה במטבחים רבים. היא מכילה יותר חומצה אسكורבית ממנגו או תפוזים למשקל זהה. קיימות שני טипות - ישרה ומגופפת; שפיםชอบ את הגרסה הישרה בשל המאכזבת החמה שלה.
  veg.parsnip:
    label: _pashtinanek_
    summary: שורש לבן צבעוני כמו חלב; מקורו במימי הביניימין באירופה.
    info: _pastinak_ (_pashtinanaka savita_) הוא ירק שורש קרוב ל감בה. היה מרכיב בסיסי בדיאטה האירופאית לפני הגעת البطاطה; כיום הפך פחות נפוץ. טעמו מתוק ומרומם עם תוספת של עץ גבינה; לאחר ברידים הטעמה נעלה עוד יותר.
  veg.peas:
    label: פצלי
    summary: פרחים צבעוניים עם ששת פרחי תכלת
    info: פצלים הם פלפלית שנוצרת משורשים של עשבים וגדלים על קוצים או סולמות כדי לתמוך בהם. התרחבותם נקרה לרוב בקיץ אך ניתן למצוא אותם גם בחודשי החורף אם מותאמים לסביבה המקומית.
  veg.pepper:
    label: פטריית פרי
    summary: ירק צבעוני עם טעם מתקדם או חריף.
    info: פפריקה שורשה קיימת גם בסוגות מתוקות וגם חמות יותר. פטרית הפירות האדומה מכילה את רמת הוויטמין סי הגבוהה ביותר מכל המיני ירקים.
  veg.potato:
    label: '"aubergine"'
    summary: '"בסיס בצבע 갈색 של מגוון רחב של מאכלות ברחבי العالم."'
    info: '{"hint":"תבלין תחתית סטארכיה (סולנום טוברוסאם) המהווה מזון בסיסי","info":"aubergine מגיע מהאנדים באמריקה הדרומית ושייך לקультיבלים החשובים ביותר בעולם. זהו מקור לסוכרים, חלבונים וחומר אדיש.","label":"aubergine","summary":"ฐาน בצבע 갈색 של מגוון רחב של מאכלות ברחבי העולם."}'
  veg.pumpkin:
    label: '"דייני"'
    summary: '"תירס אורנז''י עגול большой; סמל לעיד ההאלווון ולמטבח הסתיו."'
    info: '{"hint":"תירס אורנג''י עגול גדול (Cucurbita maxima או Pepo)","info":"דיניה (Cucurbita maxima או Pepo) מגיעה מאמריקה. היא עשירה ב베탾 קארוטן وفيיטמינים א וסי. המסורת של חיתוך דניעים לعيد האלולין נגזרה מהודו הסקandinביו. זרעים מדינה הם מקור מצוינות לצинф ומagne슘 והם מכילים גם פrotein צמחוני."}'
  veg.radish:
    label: רדיווייס
    summary: ירק השורשים הקטנים בצבעים חמים
    info: |-
      רדיוויס הוא ירק שורש נפוץ וצומח מהר מאוד。
      r> רדיבוيس קטן אדווה – כתום או أحمر;
      r> רדיווויס גדול יותר - לבן כמו דאייקון,
      r> שנמצא בעיקר ביפן כמרכיב בסיסי באוכלญ
  veg.spinach:
    label: شׂפּעַט
    summary: ירוק כרמל מרוכז בגופו ובברזל.
    info: שניצן הוא עשב ירוק מזרחי שמקורו בפרס העתיקה. זהו מקור غنى של ויטמינים K, א', סי, פולאט וגם ברזל.
  veg.spring_onion:
    label: שעועית
    summary: הבצל העדין עם בסיס לבן וניצני עלים ירוקים הוא תוספה מצוינת לסנדוויץ'ים.
    info: |-
      שעווה קיימונית (allium Fistulosum או allium Cepa) נאספת עוד לפני שהגיעה ל בשלות מלאה
       היא עדינה יותר ופחות חדה מהבצל הרגיל,
      ומ运ת בשקעת האסיה כחומר מזון ב السلطات והטמפרטורות.
  veg.squash:
    label: '"蕃瓜"'
    summary: '"各種形狀的冬用蕃瓜；秋季烹飪的基本蔬菜。"'
    info: '{"hint":"蕃瓜（南瓜屬）的多種形狀","info":"冬季蕃瓜（Cucurbita）包括奶油栗子、胡桃皮、精緻和卡波奇亞品種。\n它形成堅硬外殼，可保護數月；可以在整個冬天儲存。\n富含維生素A、C及B族複合體。\n在三姐妹系統中的印第安人飲食中佔有重要地位。（玉米—豆類—番瓜）。"}'
  veg.swede:
    label: تورין
    summary: שורש פוליאו-זהוב גדול עם טעם חמוד
    info: תורין הוא צמח שדה שנוצר מהצלבה בין עשבים לזרעיות. בארצות הברית ידוע כ'רוטאבאגה'; בסקטלאנד משמש כתוספת בלתי נפרדת להגיס. לאחר אפייה יש לו טעם מתוק ומעט חריף.
  veg.sweet_potato:
    label: בטאטה
    summary: גזר אורנג'י עם תכולה עשיריה – גידול טרופיות שאינו שייך לקדם משפחת הגמוצות.
    info: |-
      בָטַאט (Ipoamea Batats) מגיע מדרום אמריקה ולא קשור צמחית ל감자ים;
      it غنى בبيتاكارוטן وفيتامינים א' וס', וכן סיב식ת;
      The اللون האדום כתומה של הבשר נובע מה베탐קרוטן.
  veg.taro:
    label: ג'וקו
    summary: głeba purpurowa i bogata w澟; podstawowy pokarm w klimacie gorącym.
    info: |-
      ג'וקו (Colocasia esculenta) הוא גזר טרופי שנращают כבר יותר מ־10,000 שנים.
      is הפולינזיה האפריקאית והאסיאתית תופסים אותו כמאכל בסיסי; פוי ההיילני מיוצר מהכנת ג'וקוא מעורר.
      The הגבינה שלו היא קלילה עם ניחוח של שמן עץ קוסם; סימן ידוע הן כתמים אפורים בגוף המטומatoes.
      The ג'וקואה לא מבושל מכילים חומר אורגני שיכול לגרום לכאב בגרון ולכן יש לבשל את זה תמיד.
  veg.tomato:
    label: תירס
    summary: פּוֹל תכולה אדום משמש כמו חסה.
    info: תירס הוא פירות מבחינה ביולוגית אך בשימוש במטבח כחסה. התירס מגיע מאמריקה הדרומית ומכיל ליקופן וניאכין.
  veg.turnip:
    label: водница
    summary: ירק עגולי בצבעים של בלבול בין צלף לסגול; מנה טיפוסית במזרח אירופאי.
    info: ורודינץ' (ברסיקה רפס') היא ירק שדה דומה לזרע אדום עם גוון לבן עד סגול. הוא היה מזון בסיסי באירופה לפני הגעת البطاطה מאמריקה המערבית. הورודינציה מכילה ויטמין סי, קальций והיבט.
  veg.watercress:
    label: '"ריריכת מים"'
    summary: '"צמחי בר ירוק כהה חם וקטן מצורות מים"'
    info: '{"hint":"작은 어두운 녹색 매콤한 물 허브(Nasturtium officinale)","info":"물蔊초( Nasturtium officinale )는 시원하고 맑은 계곡과 샘에서 자랍니다.\n글루코시놀레이트인 신이그린 덕분에 화끈거리고 고추 같은맛을 가지고 있습니다\. \n비타민C,K 그리고 베타카로틴으로 가득합니다\. 영국에서는 전통적인 샌드위치 소스이며 프랑스어로 ''포테 아우 크레송''이라고 합니다","label":"물蔊초","summary":"물을 따라 나는 작은 짙푸른 매워 보이는 식용식물입니다."}'
  veg.yam:
    label: جام
    summary: שורש טרופי גדול ועטוף משקים
    info: ג'ם הוא שורש טרופי עשיר בשקדים הנפוץ באפריקה הדרומית של המדבר, בדרום אסיה ובקריביים. גימ отличается от батата тем что он суше и менее сладкий.
  veg.zucchini:
    label: אורבוקита
    summary: טירת אורבוקיטה ירוקה עם מגוון שימושים במטבח
    info: גזרת האורבוקיטה (Cucurbita Pepo) היא תירס קיץ שנאסף לפני בשלוותו (길ות בין 7 ל -25 ס
