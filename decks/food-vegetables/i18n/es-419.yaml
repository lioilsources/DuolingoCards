lang: es-419
pivot: false
title: Verdura
cards:
  veg.broccoli:
    label: brócoli
    summary: Verdura verde con una cabeza de flores densa en un tallo grueso.
    info: El brócoli es una hortaliza verde perteneciente a la familia de las cruciferas. Es especialmente rica en vitaminas C y K, así como antioxidantes; proviene de Italia.
  veg.carrot:
    label: zанdía
    summary: Verdura raíz de sabor dulce y color naranja.
    info: La zanahoria común es una planta biénna que se cultiva por su jugoso raíz naranja. Es rica en beta-caroteno (provitamina A) y fibra.
  veg.corn:
    label: maíz
    summary: Verdura amarilla con filas de granos jugosos en la espiga.
    info: El maíz alto proviene de América Central y es hoy uno de los cultivos más cultivados. Los granos contienen carbohidratos, proteínas y vitaminas del grupo B.
  veg.cucumber:
    label: calabacín
    summary: Verdura verde larga con pulpa refrescante y jugosa.
    info: El calabacín es una hortaliza tropical de la familia de las cucurbitáceas. Contiene un 95 % de agua, es refrescante y popular en ensaladas o como snack.
  veg.garlic:
    label: ajo
    summary: Bulbo blanco picante con aroma intenso, base del sabor de muchos platos.
    info: El ajo ha sido utilizado en la cocina durante miles de años como especia y remedio medicinal. Contiene alicina, una sustancia que posee propiedades antibacterianas y antiinflamatorias.
  veg.mushroom:
    label: hongo
    summary: Hongo de color claro-marrón con forma de copa utilizado en cocina.
    info: El champiñón dos esporas es el hongo cultivado más extendido del mundo. Rico en proteínas, vitaminas B y minerales; se usa en una infinidad de platos.
  veg.onion:
    label: cebolla
    summary: Vegetal picante y en capas para sazonar comidas.
    info: La cebolla común es una de las hortalizas más cultivadas del mundo. Se usa como condimento en todo el planeta; contiene flavonoides con efectos antibacterianos.
  veg.pepper:
    label: pimentón
    summary: Verdura colorida brillante con sabor dulce o picante.
    info: El pimentón anual existe en variedades dulces y picantes. El pimentón rojo tiene el mayor contenido de vitamina C de todos los tipos de hortalizas.
  veg.potato:
    label: papa
    summary: Tubérculo subterráneo con almidón que forma la base de muchos platillos en todo el mundo.
    info: La papa proviene de los Andes en Sudamérica y es una de las culturas más importantes del mundo. Es una fuente de carbohidratos, vitamina C y potasio.
  veg.tomato:
    label: tomate
    summary: Fruto rojo y redondo utilizado como verdura.
    info: El tomate es botánicamente un fruto (baya), pero en la cocina se usa como una verdura. Proviene de América del Sur y contiene licopeno y vitamina C.
