lang: fa
pivot: false
title: سبزیجات
cards:
  veg.artichoke:
    label: ارتيشك
    summary: سبزي زيادي كه زيتوني را با لبه هاي تيز ديديمي.
    info: آرتسیچوک به عنوان جنین از درختان تاج بزرگ است که شبیه سبزلی هستند، و قسمت مصرف شده آن شامل دم‌ها و پایۀ ضخیمشان است. عصارهٔ آرتیشوك برای طعم دادن نوشابه‌ها مثل سنتزو و سِناور موجود است؛ بنابراین نوع خاصی از فرومول حاوی این عصاره است.
  veg.arugula:
    label: رُكُلا
    summary: سبزی تازه تیره و عطرمندانه؛ معروف در ایتالیا.
    info: روکولا، به دلیل وجود ماده‌ای به نام گلوکوزینولات، طعم تند و سوختنی خاصی دارد که از مناطق مدیترانه آمده است. در غذای ایتالیا نقش مهمی بازی می‌کند؛ پس از فراموش شدن روی زاویهٔ قارچها، روكولا به صورت خرد شدۀ جوان بر روی انداخته می‌شود.
  veg.asparagus:
    label: اسباترس
    summary: رشته‌های سبز ظریح بهار؛ سبزی موسمی لذت بخش.
    info: سبزی جوشاده بهار، که ارزشمندترین سبزی فصل است؛ نسخهٔ سفید آن در تاریکی و بدون خورشید پرورانده می‌شود و رنگ زرد دارد. همچنین حدود ۲۰ الی ۴۰٪ مردم بعد از خوردن آن بوی غلیظی در ادرار تشخیص می‌دهند (اسپارتام).
  veg.bamboo_shoot:
    label: بومبوسوئ
    summary: گوشت فلفل قرمز
    info: ساقه‌های جوان بامبو که به زودی پس از رشد برداشت میشوند، در آشپذیری چینی و تایلندی استفاده می شوند. ساکن هستند و حاوی مواد سمی مثل سانیدر نیز هستند؛ بنابراین قبل از خوردن غذا داغ باشند.
  veg.beet:
    label: بروکولا
    summary: سبزی جذری قهوه‌ای؛ مواد غذا و رنگ.
    info: سرکه قرمز، به دلیل وجود بتانین که رنگدان خودرو است و از نوع باتا ول透明س محسوب می‌شود، غذایی فراوان با نتائج سبز در تقویت عملکرد ورزشی و پایین آوردن فشارخون هستند. بندهای شیرین مثل چغندر برای تولید قارچ سفید مناسبترند.
  veg.bok_choy:
    label: چشم پارس
    summary: سبزی خاورمیانه با ریشه‌های نازل به شمار می‌آید.
    info: پاک کوئی از سبزیهای محبوب در آشپذیری هنگام، ژاپن و تайлند است. این سبزی حاوی ویتامین‌های C، K، A و مواد غذایی مهم دیگر مثل کلسیم است.
  veg.broccoli:
    label: بروکلی
    summary: سبزی سبز با کلنچ های فشرده روی تنه اصلی ضخیم.
    info: '{"label":"بروکلی","summary":"سبزی سبز با کلنچ های فشرده روی تنه اصلی ضخیم.","info":{"persian": "بروکلی، نوعی سبزی جدید است و به خانواده بروکولوفت متعلق شده. منابع غذائی مهم برای حاوی آنتوساکسانتها، ویتامین‌C و -K روزمره نشستن دارد؛ در ابتدا در ایتالیا پرورش داده شد."},"lang":"Persian"}'
  veg.cabbage:
    label: برقاب
    summary: سبزی مستحکم دورتر لистدار؛ بنیان ساویر kraut.
    info: سیب‌زمینی کلم، جنس Brassica oleracea است و در اروپا هزاران سال پرورش داده شده است. حاوی مواد مغذی مثل ویتامین C، K و گلوکوزینولات با خواص ضدسرطانی است؛ زمانی که فرسوده می‌شوند به عنوان «ساوئِركراوت» معروفند که منبع غنی برای بیوترهاست. نمک ترش راهنمای مهم غذاهای آلمانی و کره‌ای مثل کچلی.
  veg.carrot:
    label: سرخاب
    summary: سبزی جذری نردبان با طعم خوش.
    info: سیب زمینی عموماً دو ساله است و برای ریشه‌ی شیرین قرمز تولید میشود، غنی از بتاکاروتان (پروتامین آ)، فیبر.
  veg.cauliflower:
    label: گلهای تازه
    summary: سر فشرده ای از گلهای زرد روشن.
    info: گلکبریسیا (Brassica oleracea var.botrytis)، مرتبط با بروکولی است، رنگ سفید آن به دلیل این که برگ‌ها نور خورشید را جلوگیری و تشکیل کلاروفيل را متوقف می‌کند؛ همچنین وجود دارد در انواع بنفش، پرتقالی وسبز.
  veg.celeriac:
    label: سلر تخم‌برگ
    summary: جذر سفید بزرگ با حالت توسعه؛ بنچینه مهم غذا.
    info: |-
      سیلر تخم‌برگ، به نام علمی Apium graveolens var. راپاسهوم، نوعی سبزی است که برای جذرش پرتقالی شکل و بزرگ فروش می‌دهد
      دارای عطر قوی و طعم خاص این مرغوب از سیلر است
      در آماده سازی غذاها مثل سالات سیلر(رمولاد)، دسر ها و انواع مختلف درخواست زیادی وجود دارد
  veg.celery:
    label: سرخال
    summary: سبزی با طعم برجسته و بدون مواد مغذی؟
    info: سیرکی سبز در حال رشد که اصلش متوسط‌اسفند است، به عنوان قسمتی اساسی از ترکیبات غذای فرانسوی مثل «مِروپوآ» شناخته می‌شود و شامل پیازچه، هویج و خردل زمستانی است؛ عصاره آن نوش جات دetoxi مشهور هست.
  veg.chard:
    label: منقل
    summary: سبزی خورشتی رنگارنگ با ساقهٔ رنگارنگ.
    info: |-
      مَنگُلِد (بیتا وولکارس سبسپ۔ سایکلا)، نزدیک‌الرقم به ریحان قرمز است。
       این گیاه با زیرهای، قرمز، طوسی یا دوخت جلو متفاوت وجوددارد
       منابع غذائی مهم آن شامل ویتامین های کشمش، الافا و تاتا و موادمعدنی مثل پتاسیوم و فسفر است
       در قدیم بطور متداول در صوف مصرح شده ولی الان برخاسته است.
  veg.chickpeas:
    label: چیرزا
    summary: دانة قرمز زرد؛ مادهٔ اوليهٔ حمص و فلفل.
    info: چیزرنا، لوسته‌نین معروف بومی خاورمیانه و هند است که مبنای پاستۀ حمص و فلفل سبز در غذافت جوشیده شده است. این محصول به دلیل تامین مناسب پروتئین گیاهی، در رژیم غذاهاي نباتى و گیاهخوار عموميت دارد.
  veg.chili:
    label: qaynat
    summary: فرمول قرمز يا سبز در حال خراشي يك نوع مهم اصلي.
    info: "{\"hint\":\"فلفل قرمز و سبز کوچک، تند و داغ\",\"info\":{\"label\":\"قاینات فلفلیان انسوم\n( Capsicum annuum )\").\"شماره\": \"توضیح:\")\nپالینگر نسخه‌ای است بسیار زشت از پاپرکا.\nدرجه حرارت را ماده شمابده باعث می‌شد؛ به مقیاس اسکولله انداخته می‌شود (جالاپنو: ۲٫۵ هزار الی ٨هزار واحد اسکولله، کارولاينا ريبير: بالاي ٢ميليون واحد). \nوظيفة تحولاتي مادة شما بدست حيوانها جلوگيري كنيم، البته طيور نيستند (كه بذرهائي منتشر ميشوند).\nآسياء، المكسيكوي و الهند بدون قاینات غذا تعبيه."
  veg.corn:
    label: ذرت
    summary: سبزی جوجه کنده با تعداد بسیار بالا از دانه های شیرین در داخل پوشش.
    info: '{"label":"ذرت","summary":"سبزی زرد با رد های مقواره ای حاوی دانه روغنی بر روی خوشه","info":{"type": "object", "properties": {"hints":[{"language":"cs-Cz","value":"محصول علوفه‌ای بلند با دانه‌های سفید کرکره، نام علمی Zea Mays و معروف به ذرت"}],"translations":[],"definition":{"partOfSpeech":"noun","text":"ذرت","examples":[{},{},{}]}},"required":["translation"]}}'
  veg.cucumber:
    label: سگوچ
    summary: سبزی طولانی رنگ سبز با لختهٔ شیرین و مرطوب.
    info: سگوچه ایست که در خانوادۀ بلوط است و حاوی ۹۵٪ آب می‌باشد، تازه است و به عنوان سالاد یا غذای دسر پرطرفدار است.
  veg.eggplant:
    label: لبید
    summary: سبزی جوشاده زرد؛ مواد خام برای غذاهای مثل مووساقا و راتاتوئ.
    info: لیلهکه از هند مبدأ دارد و قرن‌ها است کشاورزان آن را پرورش می‌دهند. در ایتالیای به «melanzana»، فرانسه «aubergine» و امریکا «eggplant» معروف است. لبیدین حاوی ناسونین، ضد عفونی طاقتمندی است که روی سطح تیرهٔ محصول وجود داشته باشد.
  veg.endive:
    label: چکانکا
    summary: سبزی سبز با عطر مرغوب و جوشاده؛ بنیان مهم سالاته.
    info: چکانکا، به معنای سبزی تازه ای با طعم بسیار کمرنگ و ملخ است؛ رنگ سفید آن ناشی از پرورش در شرایط خموده (چِکُروئی)، یا بدون وجود نور مستقیم (وَتلووف). طعّمت غرقابی این سبزی به دلیل حضور اسیدات انْته‌بنی موجود در آن است که همزمان قابل کاهش با فراهم کردنش روشنی مناسب برای بلونیراساندن است.
  veg.fennel:
    label: فنیقل
    summary: سبزی با بلوطه سفید و برگ‌های نرم شبیه جوندوز و طعم زلال انیزو.
    info: فینیکل دار فانریولوم ولگرا به خاطر اتانول، طعم شیرین و عطر انیزو را میدهد. بُلوطه‌ای آن، ساقه‌ها و برگ‌های پروشنه مثل همراه غذای استفاده میشه. در کوچینه ایتالیایی مدیترانئوس مهمه؛ مثل صوص الائس، سبزجات تازه و ماهی روست.
  veg.garlic:
    label: سیر
    summary: گلبول براق زودبخت با عطر قابل توجه، مبنای طعم غذاها.
    info: سوسیو درآوردن به عنوان ادویه و دارو برای هزاران سال استفاده شده‌است، حاوی اللیسن که خاصیت ضد باکتری و پادزهردار را دارد.
  veg.ginger:
    label: زردو
    summary: رشته خمیری با طعم فلفلی و بو.
    info: زنجبیل از ریشه‌های گیاهی است که در آسیا جنوبی پدیدار شده است و مادهٔ زینژبرول، عامل تحریک‌آور و ضد التهاب وجود دارد. بررسی نشان دهندهٔ موثر بودن زنجبیل به عنوان تسکین دهنندهٔ سردردمعده و حالت بد معده هست.
  veg.green_beans:
    label: فاسو
    summary: لبدرزنه بلند و ضخامت بالا؛ قبل از رسیدن برداشت می‌شوند.
    info: لوبیای جوانه‌دار، هنگام استفاده نارس محسوب شده و به فرانسوشلوها، لوبیا رشته ای یا بابی تسمه داده می‌شود. حاوی ویتامین سی، کائولکان و فولات می باشد. پخته شدن آب در حال حرارت زدایی و روغن خوراکی با انارچه، غذای جانبی معروف آمریکایی «جوجه مرغ» است.
  veg.kale:
    label: کاهو
    summary: سبزی تیره با لوبیان منحنی؛ غذا فوق العاده.
    info: کاهو کدره‌ای (براسیس اولرئوسا وار. سابلليكا)، سبزی تازه با رنگ قهوه‌ای مات است، غذائی بسیار پرجوش نسبت به دیگران هستند؛ حاوی فولات بالاست، مواد ضد oxidant در آن وجود دارد. در دههٔ جدید شده است معروفترین نوع خوردن طبعانه برای مردم علاقمندان به زندگی سالم.
  veg.kohlrabi:
    label: کدلووبن
    summary: سبزيي با بولاو محكم رووي عروق؛ نيزلتي.
    info: 'کدلووبن (براسیسائ اولراسيه کانجيلودز) سبزيي است كه با زليت نسبتي مرتبط است. هم تنه بولاو واقعي (توالع ضخيم) را خورده، هم برگ‌هاي آن. طعم لطيف شيرين - جوشادار دارد؛ به صورت پخته يا生鲜 قابل غذاست. عنوان اصلي اش از زبان انكليسالي بدست آميده است: «كوهل» يعني زليت، «رابي» معني توسعه يافته. در الهند، ايسلند و تسكي مشهور است.'
  veg.leek:
    label: پورک
    summary: سبزی طعمدار بدون قهوه ای استفاده شده در عصاره‌ها و انواع مختلف غذا.
    info: پورک از خانواده سیب زمینی است و به عنوان نماد ملی ولسم در آمدگاه فرهنگی شناخته می‌شود؛ مردم ولسوم هر سال با جشنواره بزرگداشت داuid برای تجلیل از او، پارچ روزمره کشاورزان را به تصویر می‌آوردند. حاوی الائوسین و مواد غذایی مهم مثل ویتامین K و C است.
  veg.lentils:
    label: لوبیاچینه
    summary: لبد جانداران بدون گوشت.
    info: لوبیاچینه (Lens Culinaris)، از قدیم‌ترین سبzl هاست که دو هزار و ۱۰۰ میل تاریخ پرورش آن وجود دارد، در نژادهای قرمز،سبز،قهوه‌ای و مشکی به اسم لوبیاسفید معروف است. بدون غرقابودن مدت زمان شیرین خوردنش حداقل بسته به نوع اندازهٔ ۲۰ الی ۳۰ دقیقه راه باشد؛ سرعت فراموش کردنش بالاتره از لوبیاها. منبع عمدهٔ پروتئین برای طبخات حلالندوز در عربستان.
  veg.lettuce:
    label: salat
    summary: سبزی جنسن به عنوان بنچهر زلفاق.
    info: خیار سبز در مصر باستان کاشته می‌شد و امروزه نسالت های مختلفی مثل آйبرگ، رومان، لالو، باترهد و برگ تاک وجود دارد. خصوصیت عمدهٔ فراموش شدنی است؛ حدود ۹۵٪ حجمش از آب تشکیل شده و انرژی پائینی دارد.
  veg.lotus_root:
    label: لتوس
    summary: برش ریشه لوتاس با حفره‌های زیبا؛ تازه‌ترین طعم منطقۀ آسیاست.
    info: ریشه لوتوس، که به نام علمی Nelumbo nucifera شناخته می‌شود، ساقه زیرزمینی از گونه پاک و معنوی لوط است. برش عرضی آن الگوهای متقارن با سوراخ‌ها را در خواهد داد. اساس مهم غذائی فرهنگ هندوچین شامل چینی، جاپانی و هندی است.
  veg.mushroom:
    label: قارچ
    summary: قهوه‌ای روشن رنگ با ساقه كوتاه برای خوردنت.
    info: ماکرورم دو اسپوری پرچه محبوبترین قارچ کاشت شده در جهان است، غنی از پروتئين ها و موادمعدنى؛ به عنوان نمونه‌ای از تعداد زائد طبخهاى مختلف استفاده ميشه.
  veg.okra:
    label: کراچه
    summary: دانه زرد نرم با ظاهر ستاره‌مانند بریده شده؛ عامل مهم در جمع‌آوری مواد خام.
    info: کراچه از تریاکوست آفریقا مبدأ دارد و به عنوان پایه غذای جومبو در استفاده قرار می‌گیرد؛ بافت لغزندهٔ کراچه سس را ضخیم می‌کند، هنگام برش شانه تشکیل می‌شود. این محصول حاوی الیاف طبیعی بالاتنه، ویتامین C، K و فولات است.
  veg.onion:
    label: سبزی
    summary: سبزی لایه‌دار پر طعم برای به همانند باربردن مواد غذائی.
    info: '{"info":"سیب زمینی کوچک از جمله محبوب‌ترین سبزیجات دنیاست و برای تازه نگاهداشتن غذا در تمام نقاط جهان استفاده می شود؛ حاوی فلاونوئید با خواص ضدباکتریال است.'
  veg.parsley:
    label: پطرفل
    summary: گیاه زرد روشن با لباده هموار یا منحنی.
    info: کریترل به عنوان ادویه و تزیین غذا استفاده می‌شود، حاوی بیشتر فرومون سی نسبت به پرتقال ها در وزن خاص آنهاست. دو نوع صاف(مستقیم) و کج وجوددارد؛ رانچران عمدتاً نوع مستقیم را برای طعم قدرتمندسازی مورد علاقه قرار میدهد.
  veg.parsnip:
    label: _pestanaka_
    summary: سبزی خورشیدی زرد روشن؛ مواد غذائی مهم دوران قدیم.
    info: _pastınak_ (_Pestanaka savita_) سبزی جذری است که به هویج مرتبط است و طعم شیرین، دانه‌ای دارد؛ پس از فرسدگی ناشاخص تر باشد. در قاره اروپا قبل از آمدن картوف غذاء اصلی بود ولی الان رواج کمتری دارد.
  veg.peas:
    label: هرچ
    summary: سبزی لختهٔ توخالی
    info: گوجه‌های سبز کوچکی هستند، این محصول درون دانه به شکل پودر است و قارچ آن نرم محسوب میشود؛ علاوه بر اهمیت غذائی بالا، مندل با تحقیقات خود روشن کرد که رشد گروه جدیدی از فناوریها مثل زراعت هوشمندانه بوجود میآورد.
  veg.pepper:
    label: pastrama
    summary: سبزی جذاب با طعم شیرین یا تند.
    info: پاپریکای سالانه در نسخه‌های شیرین و تند وجود دارد. پاپریکای قرمز بالاترین مقدار vitaminC را از بقیۀ انواعسبزیجات به خود اختصاص میدهد.
  veg.potato:
    label: سیب زمینی
    summary: تامه سفید مورد استفاده در بسیاری از غذاها در تمام جهان.
    info: '{"label":"سیب زمینی","summary":"تامه سفید مورد استفاده در بسیاری از غذاها در تمام جهان.","info":"برگل به دنیای ما از کوه‌های آند در قطب جنوبی آمریکا رسید و مهمترین محصولات دنیاست، منبع عالی هیدرات کربن، ویتامین C و پوتمassium.'
  veg.pumpkin:
    label: دینه
    summary: تخم مرغ قرمز بزرگ؛ نماد مهم هللوئن و پختن توپر.
    info: خیار زرد بزرگ و دایره‌ای از آمریکا مبدأ است، غنی از بتا کاروتن و مواد مغذی مثل ویتامین های A و C است. سنت نقاشی خانه جعبه بر روی تخم مرغ در مناسبت هللوئن به عنوان نماد معروف شده است. حبوبات داخلش علاوه بر پروتئین گیاهی، فراوردهٔ بافت طلائی روزماجسته اند.
  veg.radish:
    label: سرکه
    summary: سبزی قرمز فلفلی کم اندازه برای صبحانه و لذت توأم با بهار.
    info: سرکه کره‌ای به سرعت رشد می‌کند و جنس آن از خانواده Raphanace است، در زمستان بزرگتر شده و دارای پوست سفید با نام «داچون» می‌شود. حاوی مواد غذایی ضدباکتریال مثل گلوکوزینولات ها است؛ در ژاپن، داجون نقش مهمی در تهیه طبخانه اصلی دارد.
  veg.spinach:
    label: سبینات
    summary: سبزی تازه و زودروشد با عصاره بالای آهن.
    info: سبینات از پارسی باستان مبدأ دارد و غنی از فولات، آهن، ویتامین های کاپکه‌ای، سیانوبوتیریک و جذب موادمعدنی است. در قرن بیستم به عنوان منبع تغذیه برتر شناخته شد و نقش مهمی را در توسعه نگاه طولانی مدت به خوردن سبزیجات لистدار ایفا کرد.
  veg.spring_onion:
    label: جُرنْدِلّهٔ بهاره
    summary: برداشت قابل ذکر با بندهای سفید و بلند؛ عنصر مهم در سلمان.
    info: |-
      چیبولا بهاره (االئوم فستولوسام یا االئوم سِپَو) قبل از رسیدن کامل جمع‌آوری میشود و نسبت به پری، تازگی بیشتری دارد و خوشمزۀ‌تر است
      در غذای آسیایی برای زینت دادن به مواد غذائی، در سالمان ها و شیرجه ها استفاده میشود
      خوبی روزمره و با حرارت لطافت داشته باشد
  veg.squash:
    label: اسپر
    summary: سبزی خورشت جوجه‌مرغ با ظاهر متعدد.
    info: تیکو زمستانه به انواع مختلف اسپرس هستند، مثلاً باترنوت و آکرون و دلیسا و کابوشا رایج است. پوست سختش در طول تاریخ برای حفظ غذاها مهم شده؛ قابل نگهداری تمام فصل زمستان است.
  veg.swede:
    label: توورين
    summary: سبزي كره اي قرمز - زرد با عطر كوچك.
    info: توروین (براسیکا نابوس) ترکیبی از سبزی و ریشه است. در آمریکا به عنوان روتاباگ شناخته می‌شود؛ در اسکاتلند بخش جدایی‌نепذیر غذاهای هاجgis است. پس از پخت، طعم خوشمزه و کمی فلفلی دارد.
  veg.sweet_potato:
    label: باتاته
    summary: برفراوردى نارانژى ; عضو غير متداول خودمانى بر رووى خطوط معبدى.
    info: بَتات (Ipoemea batata)، از آمریکای جنوبی نشأت می‌گیرد و در زمینهٔ باغبانی با سیب زمینی ها رابطه‌ای ندارد؛ غذائی است که حاوی بتاكاروتن، فرومونهاي A,C و الیاف طعامى بالاست.رنگ نارنجى لوله داخلى به دلیل وجود بتا كرتوتين است. قرن ها توسط مردم آفریقا، شرق دور و لوئس آمریكا به عنوان مواد غذاىى پایه استفاده شده.
  veg.taro:
    label: تارو
    summary: رزماهای بزرگ با الگوهای فرومونی؛ غذاء اصلی منطقۀ گرم.
    info: |-
      تارو، که به نام علمی Colocasia esculenta شناخته می‌شود، رزمندهای استاندارد در مناطق حوض خلیج فرانسه و آسیا بزرگتر از هزار سال پرورش داده شده است؛ جزو غذاهای بنچین برای مردم هلندنوسیاس، آفریقا و آسیاست؛ تخم مرغ هوآئی باکره از طریق ذوب زدن تارو بدست می‌آید
      طعم لطافت محصولات قهوه ای مثل ژوزف وجود دارد؛ نقاط صافی روشن داخل عضله به عنوان نماد تصاویری عمل می‌کنه
      تازه کردن تارو شامل مواد شیمیائی موجود در اندازه بالا است که باعث حرارت میشه؛ پخت ضروری ست.
  veg.tomato:
    label: گوجه
    summary: ميوه قرمز كروي ايست كه مثل سبزي استفاده ميشود.
    info: گوجه از نظر باتانیک میوه‌ای است، ولی در آشپذیری به عنوان سبزیجس استفاده می شود و این محصول جنوب آمریکا روز با لycopene و vitaminC فراهم کرده.
  veg.turnip:
    label: run
    summary: سبزی جذری با پوست زرد-بنفش ؛ غذا قدیمی اروپای مرکزی.
    info: |-
      تامسکیا رابا)، که به عنوان «رُن» نیز شناخته می‌شود، سبزی جذری است شبیه خردل و بلوط.
      این غذاء اصلی در قاره اروپا قبل از آمدن هویج امریکای غربی وجود داشته است.
      منبع عالی ویتامین C، منیزium و فیبر؛ همچون جانورداری گوشتی عمل می‌کند؛ تَماستِ لازانیا نوع طبخ قدیمی مرکز اروپاست.
  veg.watercress:
    label: رهراشا واوني
    summary: سبزي تند و سبزتيمره اي کوچک از طرف آبي.
    info: |-
      {"hint":"گیاه تند و سبزتیره کوچک آبی، ادویات زودنارس","info":"رئِرشا رَوانی (نوستورتم офيسینال) در جای‌جاشاند با دمای پائین و منابع می روید.
      طعم شلغم نظیرش به خاطر وجود گلوکوزونولاتهٔ سائنیقرین است.
      منبع غذایی قدرتمند برای فرومون های C ,K و بتا_کاروتين محسوب ميشه.
      در انگلستان مثل عادت مردم به عنوان صافقه سانويچ مشهوره؛ ولی در فرانسه «پُتوآژ او كرسون» معروفتره.
  veg.yam:
    label: جا
    summary: تاموستروپیکال
    info: جام، هلوهای ترشی است که در مناطق معتدل آفریقا و جنوب شرقی اسیا رشد می‌کند. به دلیل طعم خوشمزه و سبز بودنش، برخی مردم فراموش نمی‌کنند که با حواشان غذا بگیرد.
  veg.zucchini:
    label: سَلاد
    summary: سبزی خوشمزه برگردان؛ برش دوم روزمره.
    info: کوکتایا به معنی تازه و سبز است، که این مغذی با فصل پرورش در مناطق مختلف جمع‌آوری شده است.
