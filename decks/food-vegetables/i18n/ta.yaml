lang: ta
pivot: false
title: தழை உணவுகள்
cards:
  veg.artichoke:
    label: அர்டிஷோ
    summary: இது ஜீரண நோய் எதிர்ப்பு துறையில் பயன்படும்.
    info: ஆர்டிசோக் ஒன்றும் பாதி மலர் வடிதல் களவற்ற நீண்ணிய இலையுடன் உள்ள அப்பழச் செடியின் எஃகு ரஸம் ஏற்படுத்தும் ஓர் ஊட்டச் சத்து ஐயூட்டும்.
  veg.arugula:
    label: ருகோலா
    summary: இது ஓர் இத்தாலிய ரசனை.
    info: ருகோலாவின் தன்மையானது பசி கணமற்ற இடப்பகுதியில் உள்ளது. அதன் சுவை வழக்கமாக நஞ்ஜு ஒரு எஃகு ஆஸிட் ஏஜன்ஸ் ஐ கொண்டுள்ளது.
  veg.asparagus:
    label: ஜீர்ன்
    summary: அரிய ருசியான ஜூஸ்
    info: |-
      செரிஸ்ட் எனப்படும் Asparagus officinalisஆல் உறவாகத் தயாரிக்கப்படும் இந்த சணல் மழைக்கால வளர்சி ஒரு அரிய ருசியான ஜூஸ் ஆகும்
      இது ஞால்ஃப்லோர் ஐலங்கள் ஏற்றும் ஊட்டச்சத்து மிக்க ஓர் உணவாகும்
  veg.bamboo_shoot:
    label: bamboo shoots
    summary: ஆசிய சமையலில் பயன்படுத்தப்படும் இளம் பாம்பூ கிழங்கு.
    info: |-
      பாம்பூ கிளைகள் எனது மலர்ந்த இறைச்சி வடிவில் உயர்வழவின் அண்டை ஆஃப் ஒரு ரகமான ஏரியங்கிற்ஸ் ஐ ஊஹோன்கஸ் ஜீனஸ் .
      இவை ஹஞ்சாவ் , ஷாஜாவ் மற்றும் ஃபுஜிஓவன் -ஐ உள்ளடக்கிய பல்வேறு ரகங்களில் கிடைக்கின்றன.
      அவை குறிப்பாக கௌலிணி மற்றும் குறிப்பிட்ட தொழில்களுக்கு பயன்படுத்தப்படுகின்றன.
  veg.beet:
    label: செர்வினா ரேபுட்
    summary: ஆழமான சிவப்பு கூஜா பசுமை
    info: "செர்வினா ரேபுட்( Beta vulgaris ) பி0தனில் ,இயற்கை சீக்கிரணமாவது ஒளி மலிந்த உணவு அழகு\nஅது எஃகு ஏற்றத்தோடு ஐஸ் ஸ்டார்ட் ஷூட்ஜியொன் மற்றும் ஹைப்பர்ஃபென்சியோன் குறைவாக உள்ளது \nஎள் - ஓர் வேறு வகை ; இது வைட்டமின் A இன் ஆதாரம்"
  veg.bok_choy:
    label: பாக் சோய்
    summary: அசியாவின் ஓர் இலை தாவரம்; வெள்ளை கிழிஞ்சுகளுடன் கருமையான இலைகள்
    info: "பாக் சோயியும்(bok choy), Brassica rapa subspecies chinensisவும் இன்றி கண்டது\nஇச்செடிவகை தற்பொழுது அரளி உலகின் முக்கிய நாடுகளில் ஒரு எளிய தாவரமாக ஏற்று பயிரிடப்படுகின்றது \nC ,K,A வீட்டமிங்ஸ் மற்ளும் கால்ஷியம் ஆகியவை ஐஸ் ஜூஸ் ஹைட்ரோஃபிலிஃஆக கொண்டுள்ளது"
  veg.broccoli:
    label: புரோக்கொலி
    summary: தடித்த தண்டுவழியான அமைப்பில் ஒரு நெறிச்சேரும் பச்சை மூலிகை.
    info: புரோக்கொலி வளைகுடையைச் சேர்ந்த ஒரு பச்சை உணவு ஆகும். இது விட்டமின் C, K மற்றும் எதிர்ப்பொருட்களை அதிகம் கொண்டுள்ளது; இது இத்தாலியில் ஏற்பட்டது.
  veg.cabbage:
    label: கொட்டமல்லி
    summary: அடர்த்தியான இலைகள் கொண்ட வட்ட வெஜிடேபிள்.
    info: கொட்டமல்லி பழுத்திராய் (பிளாசிகா ஒலரேஸியாவின்) ஆண்மையற்ற வளர்சிதை உள்ளன. நூற்றாண்டுகளாக ஐரோப்பாவில் அது ஏற்று எடுக்கப்படுகின்றது. ஜீரண உறுப்புகளுடன் ஸஃப்ஃபிங் ஹௌஸ் ஓஹெச் ஷிண் உள்ளன.
  veg.carrot:
    label: மர்கெவ்
    summary: சாறு நிறைஞ்ச மஞ்சள் பழத்தின் இனம்.
    info: மர்கெவ் என்பது வீட்டில் ஊட்டப்படும் ஒரு இரண்டு ஆண்டுகள் உள்ள தாவரம் ஆகும்; அதன் சாறு நிரம்பிய மஞ்ஜள் பழம் பயன்படுகிறது. இது பீட்டா கரோட்டென் (பிரோவிட்டமின் A) மற்றும் கலப்பு நூல்களில் நிரம்பியது.
  veg.cauliflower:
    label: kvetak
    summary: இது ஒரு அடர்த்தியான எள்ளொத்த உருவின் தண்ணீர்
    info: காலிப்லோரா வழி குடும்பத் தண்டற்ற மனியபயிர் ; இவை சூரிய நீளச் செடிகள்
  veg.celeriac:
    label: பல்லி செரிர்
    summary: எண்ணெய் ஊறு மணமும், சுவையும் கொண்ட ஓர் இளஞ்சோண்டியின் வடஇடலை
    info: |-
      பல்லி செரிர் (அனுமாதிரி - Apium graveolens var. rapaceum), கறவையாக இளஞ்சோண்டியின் வடஇடலைச் பழுத்த மூலமாக உள்ளது
      இது அதிக நிறையுடைய ஒரு எண்ணெய் ஊறு மணமும், சுவையும் கொண்஡து,
      இதனை ஸஃப்ஹஸ்(soup), சீரிங் ஃபிஷ் சலாட் (Remoulade) மற்றும் ஏரிஜ் (gratinated dishes) ஆகியவற்றில் பயன்படுத்தப்படுகிறது.
  veg.celery:
    label: அபியது ஗ிரேவிஔலன்ஸ்
    summary: எளிய கஞ்சிக் காய்
    info: |-
      கொட்டமல்லி காய் (ஆபியது பரவோளன்ஸ்), மத்திய அணை நாடுகளின் இசைவு வழக்கமாக உள்ளது
      இறுதிச் செயல்முறையில், ஒரு எஃப் ரஸ்ஃபீர் ஏற்றுக்கு ஐரோப்பிய ஜூலிஷ் ஹங்கர் ஓஹெட்டின் மௌலிக தொகுப்பு தொடங்கியது.
  veg.chard:
    label: மான்கோல்
    summary: அழகான நிறமிகள் கொண்ட ஜீல்.
    info: மான்கோல் சிறுகச் சரளி (பீட்டாவுல்கரிஸ்), மதுமயமற்ற பழுப்பு வண்ண தண்டுகளை உள்ளடக்கியது.இது அதன் நெல்லிக்காய், எரிழை, இளஞ்னூழ் அல்லது ரொஜா ஒளியை ஏற்று ஓஷன் ஐஸ்கிரீம் ஃபிளாவர்களை கொண்டுள்ளது.
  veg.chickpeas:
    label: சூரா
    summary: ஹம்ஷஸ் மற்றும் ஃபலாஃபெல் ஐ ஊட்டும்
    info: |-
      சீரா லுக்கனியம் (அறி அடல்), தென்மதி பயணப்பழக்கமாகவுள்ளது
      இது ஹம்சஸ்(சேரந்த வடை)
      ஃபலாஃபெல்,
      எளிய உணவு என ஒரு ஸ்டங்னஞ் ஜோடிஃஆக ஏற்றது
  veg.chili:
    label: சில்லி
    summary: இருண்ணிழையங்கள் / ஊதா நிற தரளம்
    info: 'சில்ளி பப்ரீகாவும்(தரளம்) Capsicum annumல் ஒன்று ; தடிவற்சி கண்டறியப்படும் - அது capsaicin ஆகும் .அதன் மதிப்பை scovilley என்னும் நிலையில் இழுக்கப்படுகிறது , jalapeno : 2500–8000SHU ,carolina reaper: 2000000 + SHU உள்ளது.'
  veg.corn:
    label: கூட்டுரித்தி
    summary: சீர் கலஞ்சேரியில் நெய்போன்ற வண்ணமுள்ள அவரைத் தழைகள்.
    info: கூட்டுரித்தி மத்திய அமெரிக்காவிலிருந்து உருவானது மற்றும் இன்று ஒருபொருளாக ஏறக்குறைய பயிரிடப்படும் பயிராகும். அவரைகள் சரித்திரம், புரோட்டீன்கள் மற்றும் பி குழு விட்டமின்களை கொண்டுள்ளன.
  veg.cucumber:
    label: குடைமிளகாய்
    summary: சீதப்பன மற்றும் நீர்த்த கலவை உள்ள நீண்ட பச்சை வெgetable.
    info: குடைமிளகாய் ஒரு ஊட்டமிக்க இலை வாழை குடும்பத்தில் உள்ள ஒரு ஃப்ரூட் ஆகும். அது 95% தண்ணீர் கொண்டுள்ளது, சோறு அல்லது கஞ்சி என பயன்படுத்தப்படுகின்றது.
  veg.eggplant:
    label: லிலெக்
    summary: ஆழ்ந்த பௗஜ்ஜா நிற நீட்டிக்கப்பட்ட காய்
    info: "'லிலெக்' இந்தியாவுடன் கண்டம் பற்றி உள்ளது; அரசின் மூழ்வயப்பு சீர் என்று ஏறக்குறைய ஒரு ஜோடி ஐம்ஸ் ஓட்ரஸ்\nஇது ஹொலிஷ் 'melanzana', ஃப்ரஞ்ச் 'aubergine', அமெரிக்காவில் 'eggplant'. \nஅஃப்ங்கிண் - இதில் இருக்கும் புள்ளிழிப்பு மிகுந்த பௌஹ்ன்ட் கார்஬ன்."
  veg.endive:
    label: விற்கன்கா
    summary: '''ஹஞ்ஜரி'' குடும்பத்தில் உள்ள ஒரு தழை வெஜிடேபிள்.'
    info: |-
      செகன்கா எனப் படும் 'விடலி'யில் இரண்டு வகைகள் - 'இண்டியஸ்', 'எண்டிசினா'.
      அதன் நறுமணமான தழை மிளகாய் ருசியோடு உள்ளது;
      ஆஃப்ஷன் அல்லது ஒளியில் ஊடுருவிய ஹஞ்ஜரி ஃப்ளவர் ஐசுபீன் ஏஜிங் மூலம் ஓர் இளம் ஸ்பிரிண்ட் வெஜிடेबிள்.
  veg.fennel:
    label: ஃபெனிக்ல்
    summary: எளிய ஓவர் மற்றும் பெரிய பூஜ்ஜிங் மூலம்
    info: "ஃபெனிக்ல் என்பது Foeniculum vulgarisகாய்வளரி மற்றும் அணிசல் தழைவடிவியல் உள்ளது.இதன் இனச்சொல் Anetholeஆகும்\nஅதன் நறுமணம் ஒரு ஸ்டீம் ரஸ்னோ ஷூட்ஜ் ஐ ஏற்படுத்தும் \nஇது ஹௌஸ் ஃபுட் , சலாட் மற்றும் பேக்கட் ஃபிஷ் ஆகியவற்றில் பயன்படுத்தப்படுகிறது"
  veg.garlic:
    label: சேஷ்னக்
    summary: துரிதமான வெள்ளையலி, பலவற்றில் சுவையூட்டப் பயன்படும்.
    info: அலிக்கின் என்ற மருத்துவ நோக்கியை கொண்டது, அது ஆண்டிபாக்டீரியல் மற்றும் எதிர்க்கட்டி பண்புகளை உள்ளடக்கியது.
  veg.ginger:
    label: இஞ்சி
    summary: அரை வட்ட வடிவிலான கருவீடு மற்றும் ஐரோப்பிய சுவை
    info: |-
      இஞ்சி ஒருவகையில் தமிழ்நாட்டின் கண்ணன்மலைப் பள்ளத்தாகும்
      சூறெழுத்து என்ற வஸ்து இங்கியில் உள்ளது; அஃது ஏற்படுத்தும் ஊறு மற்றும் எதிர்ப்பு தன்மைகளுக்கு காரணமாகும்
      ஆராய்ச்சிகள் இஞ்ஜியின் ஓட்டம் மற்றும் வயிற்று நோய்களுக்கு பயன்படும்
  veg.green_beans:
    label: ஃபிளஶ்
    summary: '''ஃபிள஠்'' எனப்படும் பாசியோலஸ் வுல்கனிசி.'
    info: பாசியோலஸ் வுல்கனிசி எனக்கறிய பழம் இதர நடவடிகளில் மணித்திரட்டின் ஆற்றிங்கள் - 'ஃபிளஞ்ச்' அல்லது 'இயர்', ஒரு உணவு ஓர் ஏஜை ஸ்ட்ரிஂ் ஃபிளஷ் ஐ ஜொதிட்டு ஹால் மணிழீர் கொண்டு கலக்கப்படுகின்றது.
  veg.kale:
    label: கபுச்தா கேடிரவா
    summary: அடர் பச்சை கேடிரவா இலை வாட்டை
    info: |-
      கபுச்தா கேடிரவா (Brassica oலரீஸி வார். Sabellica), Brassica oலரீஸி மற்றும் சத்பன்ன நோய் எதிர்ப்பு ஊக்கியங்கள் ஆகியவை அதில் உண்டு
      இது 2010ஆம் ஆண்டுகளில் ஒரு ஹூட்ஸ் ஃபுட் ஐகான் மற்றும் ஆரோக்கியமான ஏழை ஓஹெச் ஜெனரல் ஷி஫்ட் ஆக மாறியது
  veg.kohlrabi:
    label: கூட்லுபன்
    summary: தண்டுகளில் ஓர் ஏரியங்கிழம் கீழ் ; சேரியின்
    info: |-
      கெட்லுபன் காலிஃப்ளவர் Brassica oleracea gongylodes என்றும் அழைக்கப்படுகின்ரது
      இதற்குச் சேரி மற்றும் தண்டு உணவளிக்கப்படுகின்றன
      அதன் நறுமணமான வயப்பு ஒரு ஜோடி - ஸ்லாட் ஐஸ் / ஊற்றுதல்
  veg.leek:
    label: போராக்
    summary: பெரிய ஓர் onions ஏஜிஃ ஜூஸ் & Bolognese ஐ அடிப்படையாகக் கொண்ட
    info: "போராக் குறிப்படுத்தும் Allium Ampeloprasum ஒன்று வளையலி மற்றும் சேணெச்சின் உறவில் அமைந்துள்ளது\nஇது ரஷ்யாவின் தேசிய குறியீடு ; Welsh எழுப்பும் ஸென்ட் David's Day -ஐ ஊக்குவிக்கின்றனர் \nஅலிசின் ,K,C வைட்டமின்களை கொண்டுள்ளது"
  veg.lentils:
    label: சோளம்
    summary: நுண்ணிய திரவியங்கள் ; கோழி இல்லா உணவில்   புரோட்டின் ஐஸ் ஃபண்டமெண்டல்
    info: "சோளம் பழங்குடி திரவியத்தில் ஒன்று ; 9ஆயிரக்கணக்கினர் ஆண்டுகளாகப் இதற்கஞ்சல்\nஇது மஞ்ஜள் ,அரிவாள், நீலம் அல்லது 'பெல்ளூகா' என்ற உருவாக்ஷரங்களில் கிழிக்கின்றது \nஎல்லாம் ஈரப்பதம் ஏற்பதானாலும் 25 -45 நிமிஸங்களில் ஊற ஓட்டிவிடலாம்"
  veg.lettuce:
    label: கூட்டு ஷாலட்
    summary: நெடுநேரம் கால்பந்து காய்
    info: |-
      கீழத்திய காய்(Lettuce Sativa), பண்டைக் குறி நடவடிகளில் இருமல் மனப்பஞ்சு ஆக வளர்க்கப்பட்டது
      இது 90% -ஐ அதிரசம் உள்ளது;
      அதிக எண்ணிகையின் ஒரு ஜோடி : Iceberg , Romain,
      ஓக் Leaf
      எஃக்கு ஏஜிஸ் ஓஹங்கிற ஊட்டம் ; ஹிப்போகிரஸ் ஐ ஷாலட் ஃஆக குறிப்பிழக்காத மருந்து.
  veg.lotus_root:
    label: லோட்டஸ்
    summary: ஓட்ஸ் ஐ கொண்ட லௌட்டஸ் கரகத்தளம்
    info: |-
      லோட்டஸ் புறாவின் (எண்ணி Nuciferia) கரகத்தளம் செய்யப்பட்டுள்ளது
      அசிரிமன் வழிநேர்ஃ அதன் ஒரு எடை உள்ள ஓட்ஸ் ஐ ஏற்றுகின்றது,
      இது லூஃப் ஜீன் ஹொலிங் ஷஞ்சாவிழ் குடும்பத்தின் ஒரு பாகம்.
  veg.mushroom:
    label: காளை
    summary: தலையும் கரண்டியும் உடைய சாப்பிடக்கூடிய விலங்கு ஒன்று.
    info: Agaricus bisporus என்னும் இருவித்தி காளை உலகில் மிகவும் பரவலாக நகர்த்தப்படும் காளையாகும். புரோட்டீன், பி வைட்டமின்கள் மற்றும் தாதுக்களுடன் நிரம்பியது; அது பல்வேறு உணவுகளில் பயன்படுத்தப்படுகிறது.
  veg.okra:
    label: ஆக்ரா
    summary: ஜீப்பியர் மற்றும் ஸ்ளிஃப் ஹூஃப் கொண்ட குழல் ; ஜம்போ அடிப்படை.
    info: |-
      கொரில்காவும் அதன் பயன்மடி ஆபல்மச்சஸ் எஸ்குளண்டஸ் தழைக்குறியும் உष்ணமண்டல வங்கistan இல் ஏற்றுமதி
      அமெரிக்க நாட்டின் ஜம்போ உணவின் ஒரு அடிப்படை ரசாயனம்;
      இதன் ஸ்ளிஃப் ஹூஃப் ஓஹஞ்சிகளை கீறும்,
      ஓஹஷா ஐசிழில் கிரௌண்ட் கிளாஸ் மற்றும் ஫ோலேட் போன்ற கொழுத்த விட்டமின்களை கொண்டுள்ளது.
  veg.onion:
    label: சிபோல்
    summary: உணவுகளை சுவையாக்க பயன்படும் வறுத்த மூன்று அடுக்குள்ள பருப்பு இலை நீர்க்காய்.
    info: சிபோல் குக்னிஷ்கா உலகில் மிக அதிகமாக பயிரிடப்படும் ஒரு பழரச ஆகும். உலகம் முழுவதும் உணவுகளை சுவையாக்க பயன்படுகிறது; இது எதிர்ப்பு தன்மை உள்ள பாக்டீரியங்களை கொண்ட ஃப்ளாவோனாய்டுகளை கொண்டுள்ளது.
  veg.parsley:
    label: பெட்ரிகான்
    summary: இது ஒரு பசி஫்டிக் கிரீன் பௌல்டர் ; இதனை சுவை மற்றும் அரோமாடிக் கூடுதலாக பயன்படுத்தப்படுகிறது.
    info: பெட்ரிகான் புலி(சரகம்), இதற்கு சவரணி மற்றும் துளையில்லா வழியின் எலுமிழ்கள் உள்ளன. ஒரு நல்ல அளவு டி - ஜீன் ஐஸ் ஹோஃப் ஃபிஷ் ஸ்டூவிங் , ஏறக்குறைய ஓரஞ்சுகளை விட அதிகமான விட்டமின் 'C'ஐ கொண்டுள்ளது.
  veg.parsnip:
    label: 'பஞ்சியங்கள் '
    summary: எள்ளிறைச்சியான வெள்ளை ஜூட்
    info: "பாஸ்டினக் சதையுடன் கறவைமரச் பழுத்த மணல்( Pastinaca Sativa ) ஒரு வளி உணவு ஆகும்\nஇது ஐரோப்பாவில் இருந்த அடிப்படை ஊட்டச்சத்து ; \nஅதன் ருசி எண்ணெய் , ஓரிஸ்கோ பூர்வீகம்"
  veg.peas:
    label: ஹ்ரஷ்ஹ்
    summary: இணையங்களில் உள்ள ஒரு அழகான ஊட்டச்சத்து
    info: பிசம் என்பது Pisum Sativum ஆகும். இந்த கீறலி மரச்சட்டம் வளர்பவையாகும்.
  veg.pepper:
    label: பாப்ரிகா
    summary: சுவையான அல்லது வெட்டக்கூடிய சுவை உள்ள பளபளப்பான நிறம் கொண்ட தானியம்.
    info: பாப்ரிகா (Capsicum annuum) என்றும் அழைக்கப்படும் இது, மധுரமான மற்றும் வெட்டும் தன்மை கொண்ட வகைகளில் கிடைக்கின்றது. சிவப்பு பாப்ரிகா அனைத்து தானியங்களிலும் விட்டமின் C ஐ அதிகம் கொண்டுள்ளது.
  veg.potato:
    label: புளிப்பான்
    summary: சோலனம் டியூபரோசம் என்ற கரிமத்தின் அடித்தண்ணி வகையான உணவு நிலத்தில் இருக்கும் ஒரு செரிமான பொருள்.
    info: புளிப்பான் தெற்கு அமெரிக்காவில் உள்ள ஆண்டஸ் மலைத்தொடரில் ஏற்பட்டது மற்றும் உலகின் மிக முக்கியமான பயிர்களில் ஒன்றாகும். இது கார்போஹைட்ரேட், விட்டமின் C மற்றும் பொடஷியம் ஆகியவற்றின் ஓர் ஆதாரமாகும்.
  veg.pumpkin:
    label: குடைமாலின்
    summary: ஆரஞ்சு நிற வட்ட வடிவிலான பெரிய காய் ;ஹல்லோவின் மற்றும் கோடைக்கால சமையலின் குறியீடு
    info: "குடைமாலின் கத்தி(cucurbita maxima அல்லது pepo), மரபணுவளையிடமிருந்து வழக்கறிய பசிசன் உள்ளது\nஇது இலெஸ்ஸிற்கு ஒரு எஃகு ஊசி ஏற்படுத்தும் ஹல்லோவின் ஓவர் ஃபிஷ் ஐ ஜூன் -ஓ' லஞ்ச் என்று குறிப்பிடுகின்றது \nஅதன் விதைகள் ,ஜிங்க், மார்க்கனீசு மற்றும் தாவர புரதத்தின் நல்ல மூலமாகும்"
  veg.radish:
    label: ரெட்டல்
    summary: ஆறு முதல் பத்து நாள் வளர்க்கப்படும் குறுகிய முட்டை
    info: |-
      ராஃபனஸ் சதிவசுவைக்குடி ரெட்டல்(Radish)(Raphanussativus), ஒரு பேயில் மணம் தழீஇ நறுமணம் உள்ள அல்னியூஸ் எனப்படும் ஜாதி
      அரோஹன் ஏஜிஸ் ஐ ஊக்குவிக்கும் ஃபெனாலிக் கார்பன் -ஐ ஹைட்ரோகார்஬ன் ஓய்வூட்டும் கார்பன் ஷீட்
  veg.spinach:
    label: அஸ்பாராஜிஸ்
    summary: Ironஐ ஏற்றிக்கொண்ட ஒரு dark leafy vegetables
    info: "சுண்டைக் காயலிலிருந்தும் பரவி Spinachia olearcea எனப்படும் இதனை மறூத வளைக்காடு உருவாக்கியது\nஇது Vitamin -K,A,C ,Folate & Ironஆகியவைகளின் ஆழமான சோதனைகளை அளிக்கிறது \nPopeye(Comics sailor man)என்பவர் childrens food for Superfood ஐ 30's ஆண்டுகளில் ஊக்குவித்தார்"
  veg.spring_onion:
    label: ஜார்னி
    summary: ஓங்கிருக்கும் எஃபிஷிஸ் - பச்சை வாடும் பரிமளக்
    info: |-
      பச்சை வாடும் பரிமளக் கறி(அல்லியத் தனஸ்டோலஸ்), இதுவெல்லாம் அயணின் ஒரு நீளமான ,இழை உள்ள ஓங்கிருக்கும் எஃபிஷிஸ் .
      இது ஏறத்தாழ ஐஞ்ஜியன் குகனி ஃபிற்ஹிண்டு குறிப்பிடும் ஊட்டச்சத்து உள்ள கறியாகும்,
      ஆசிய உணவில் இதனை சூடாகவும் / தொடாகவும் பயன்படுத்துகின்றன.
  veg.squash:
    label: இனங்கள்
    summary: அடியில் ஏதோ ஓர் ஐஸ்ஸின் ஊட்டம்
    info: குளிர்கால மென் பரி(சமபடவயது வகை)(cucurbita), butternut, acorn, delicate அண்டு kabocha இனங்களை உற்சந்து ஒழுங்கு என்றும்.
  veg.swede:
    label: துரின்
    summary: நீல மஞ்சள் நிற பூஜ்ஜியம் ; ஃபிரான்சிய ஹாக்கிஸ்
    info: "துரின்(ப்ராசி நேபஸ்),களிமணல் கறவையும் ,அடன்திண்பழமும் செடியிலிருந்து உருவானது\n\nஆமெரிக்காவில் 'ருடாபஞ்ஜா'என்றும்,\nஇசுக்ளாந്ടில் ஹாக்கிஸ் என்ற விருஷ்டியுடன் \nஹாக்கிஸ் ஒரு அடுத்தடுத்த ஊட்டமாக ஏற்படுத்துகிறது\nஇது ஓர் இனிய சுவை கூடிய மீடியம் ஐரோப்பாவில்"
  veg.sweet_potato:
    label: பாத்தை
    summary: ஓரஞ்ஜ் ரஃப்னஸ் ஸ்டங்
    info: |-
      பாத்தையில் புளி கரடுமுற்றுகள், வீட்டுவசதி B மற்றும் C ஆனது இல்லை;
      அதன் சோட்டு நிறம் அழுத்தப்பட்ட ஒரு எண்ணெய் உள்ளது.
  veg.taro:
    label: ஜஞானி
    summary: பெரிய ஷக்கரை ஹிஸ்டா ஃபிளெக்கட் கார்ம்
    info: |-
      காலோசாஸியா எடுலன்டாவானது 10,000 ஆண்டுகள் பயிரினமாகப் பரப்பப்பட்ட ஒற்றை வேரழுத்தி கொண்ட நீர்மூலி
      இது சௌஹாவையில் உள்ள Poi ஐ ஏற்படுத்துகிறது,
      அஃதாவது அமைப்பிழைத்த ஜஞானங்களைக் கொண்ட ஓர் உணவு;
      இதன் சுவை கொண்ணை போல இருக்கும்;
  veg.tomato:
    label: ராஜ்சே
    summary: குழம்பில் உபயோகிக்கப்படும் ஒரு சிவப்பு மற்றும் வட்ட வடிவிலான தாவரம்.
    info: ராஜ்சே என்பது அறிவியல் ரீதியாக ஒரு பழம் (பளிங்கு) ஆனால் சமையலில் ஊறுகாயாக பயன்படுத்தப்படுகின்றது. இது தெற்கு அமெரிக்காவிலிருந்து வந்தது மற்றும் இதில் லூகோபென் மற்றும் விட்டமின் C கண்டுபிடிக்கப்பட்டது.
  veg.turnip:
    label: வாட்னிசே
    summary: இரு நிற கால்கள் - பச்சை கால்கள் ; பழங்குடி உணவு.
    info: '"வாட்னிசே" எனப் புகழப்படும் Brassica Rapa தரையணி மற்றும் களத்தில் வளரும் ஒரு ஆலோசனை உள்ள நஞ்ஜு அல்லது ஊட்டச்சத்து ஏற்ற ரூஃபஸ் ஐ கீழே ஓர் உணவு யூரோப்பில் ஹௌஸ் ஃபுட் ஸ்டார்ட் ஷிண்டில் இருந்து கிழக்கு அமெரிக்காவில் கிடைக்கும்.'
  veg.watercress:
    label: நீர் முள்ளிக்கடலை
    summary: ஓர் குறுகிய கருப்பு பச்சை கதிரீடு நீர் பௌஹன்
    info: |-
      நீர் முள்ளிக்கடலைக் கதி(Nasturtium officinale), பனி வழியில் செய்தப் பசுமணலின் ஒவ்வொரு இடத்திற்கும் உற்பத்தி என்று அழைக்கப்படுகிறது
      இது டஜிரிங் ஸ்பூஸ் ஐஎஃஆர்4056897ஐ ஏற்று ஜிஃஆர்4056897 ஹோமோகெனேட்டின் ஷிணி஗ிரின் காரணமாக
      அது வைட்டமின் சி., கே, மற்றும் பீட்டா - கரோட்டீன் ஆகியவற்றில் நிரம்பியுள்ளது
      இங்கிலாந்தில் ஓர் பழக்கமான சாலட் கூட்டு ; பிரஞ்சில் பொடேஜ் அல் கிரெசான்
  veg.yam:
    label: ஜஞ்சி
    summary: '''யங்''(JAM)- ஓர் ஆஃப்ரிக்கா, ஏசியா & கரீபியன் பகுதியில் காணப்படும் நிலத்தடி உணவு ; ஆஸ்டிஷ் ஜாம்(Yam ) ஐ போல்.'
    info: "அப்பளம் என்றும் அழைக்கபடுவதால் 'யங்' ('இசிசரே') ஆஃப்ரிக்கா, தோற்றி மற்றும் வடக்கு ஏசியாவின் நிலத்தடி உணவு ஒன்று. \nஆஸ்டிஷ் ஜாம் ஐ விளிம்பிழைக்காமல் : ஃபூட்ஸ் ஹால் -ஐ விட இது குறைவான ஊதா நிறமும் , குறைவான சர்க்கரை மற்றும் குறைவான நீர் கொண்டது .\nஇது 68 கிலோ வரை எடை கொண்டிருக்கலாம்."
  veg.zucchini:
    label: குசெடா
    summary: இது ஒரு பச்சை குளிர்கால கஞ்சி.
    info: குசெடாவில் கருப்பறி வளர்ந்ததன் மணல் அமையும் Cucurbita pepo என்ற இலையின் சீழ் உள்ளது. ஒரு ஏழு - ஐம்பது செ.மீ., ஊசியாக ஓர் ரூஃப் டிஷ் ஜோஜோஸ் ஹௌஸ் ஸ்டைல்.
