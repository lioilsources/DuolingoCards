lang: ta
pivot: false
title: தழை உணவுகள்
cards:
  veg.broccoli:
    label: புரோக்கொலி
    summary: தடித்த தண்டுவழியான அமைப்பில் ஒரு நெறிச்சேரும் பச்சை மூலிகை.
    info: புரோக்கொலி வளைகுடையைச் சேர்ந்த ஒரு பச்சை உணவு ஆகும். இது விட்டமின் C, K மற்றும் எதிர்ப்பொருட்களை அதிகம் கொண்டுள்ளது; இது இத்தாலியில் ஏற்பட்டது.
  veg.carrot:
    label: மர்கெவ்
    summary: சாறு நிறைஞ்ச மஞ்சள் பழத்தின் இனம்.
    info: மர்கெவ் என்பது வீட்டில் ஊட்டப்படும் ஒரு இரண்டு ஆண்டுகள் உள்ள தாவரம் ஆகும்; அதன் சாறு நிரம்பிய மஞ்ஜள் பழம் பயன்படுகிறது. இது பீட்டா கரோட்டென் (பிரோவிட்டமின் A) மற்றும் கலப்பு நூல்களில் நிரம்பியது.
  veg.corn:
    label: கூட்டுரித்தி
    summary: சீர் கலஞ்சேரியில் நெய்போன்ற வண்ணமுள்ள அவரைத் தழைகள்.
    info: கூட்டுரித்தி மத்திய அமெரிக்காவிலிருந்து உருவானது மற்றும் இன்று ஒருபொருளாக ஏறக்குறைய பயிரிடப்படும் பயிராகும். அவரைகள் சரித்திரம், புரோட்டீன்கள் மற்றும் பி குழு விட்டமின்களை கொண்டுள்ளன.
  veg.cucumber:
    label: குடைமிளகாய்
    summary: சீதப்பன மற்றும் நீர்த்த கலவை உள்ள நீண்ட பச்சை வெgetable.
    info: குடைமிளகாய் ஒரு ஊட்டமிக்க இலை வாழை குடும்பத்தில் உள்ள ஒரு ஃப்ரூட் ஆகும். அது 95% தண்ணீர் கொண்டுள்ளது, சோறு அல்லது கஞ்சி என பயன்படுத்தப்படுகின்றது.
  veg.garlic:
    label: சேஷ்னக்
    summary: துரிதமான வெள்ளையலி, பலவற்றில் சுவையூட்டப் பயன்படும்.
    info: அலிக்கின் என்ற மருத்துவ நோக்கியை கொண்டது, அது ஆண்டிபாக்டீரியல் மற்றும் எதிர்க்கட்டி பண்புகளை உள்ளடக்கியது.
  veg.mushroom:
    label: காளை
    summary: தலையும் கரண்டியும் உடைய சாப்பிடக்கூடிய விலங்கு ஒன்று.
    info: Agaricus bisporus என்னும் இருவித்தி காளை உலகில் மிகவும் பரவலாக நகர்த்தப்படும் காளையாகும். புரோட்டீன், பி வைட்டமின்கள் மற்றும் தாதுக்களுடன் நிரம்பியது; அது பல்வேறு உணவுகளில் பயன்படுத்தப்படுகிறது.
  veg.onion:
    label: சிபோல்
    summary: உணவுகளை சுவையாக்க பயன்படும் வறுத்த மூன்று அடுக்குள்ள பருப்பு இலை நீர்க்காய்.
    info: சிபோல் குக்னிஷ்கா உலகில் மிக அதிகமாக பயிரிடப்படும் ஒரு பழரச ஆகும். உலகம் முழுவதும் உணவுகளை சுவையாக்க பயன்படுகிறது; இது எதிர்ப்பு தன்மை உள்ள பாக்டீரியங்களை கொண்ட ஃப்ளாவோனாய்டுகளை கொண்டுள்ளது.
  veg.pepper:
    label: பாப்ரிகா
    summary: சுவையான அல்லது வெட்டக்கூடிய சுவை உள்ள பளபளப்பான நிறம் கொண்ட தானியம்.
    info: பாப்ரிகா (Capsicum annuum) என்றும் அழைக்கப்படும் இது, மധுரமான மற்றும் வெட்டும் தன்மை கொண்ட வகைகளில் கிடைக்கின்றது. சிவப்பு பாப்ரிகா அனைத்து தானியங்களிலும் விட்டமின் C ஐ அதிகம் கொண்டுள்ளது.
  veg.potato:
    label: புளிப்பான்
    summary: சோலனம் டியூபரோசம் என்ற கரிமத்தின் அடித்தண்ணி வகையான உணவு நிலத்தில் இருக்கும் ஒரு செரிமான பொருள்.
    info: புளிப்பான் தெற்கு அமெரிக்காவில் உள்ள ஆண்டஸ் மலைத்தொடரில் ஏற்பட்டது மற்றும் உலகின் மிக முக்கியமான பயிர்களில் ஒன்றாகும். இது கார்போஹைட்ரேட், விட்டமின் C மற்றும் பொடஷியம் ஆகியவற்றின் ஓர் ஆதாரமாகும்.
  veg.tomato:
    label: ராஜ்சே
    summary: குழம்பில் உபயோகிக்கப்படும் ஒரு சிவப்பு மற்றும் வட்ட வடிவிலான தாவரம்.
    info: ராஜ்சே என்பது அறிவியல் ரீதியாக ஒரு பழம் (பளிங்கு) ஆனால் சமையலில் ஊறுகாயாக பயன்படுத்தப்படுகின்றது. இது தெற்கு அமெரிக்காவிலிருந்து வந்தது மற்றும் இதில் லூகோபென் மற்றும் விட்டமின் C கண்டுபிடிக்கப்பட்டது.
