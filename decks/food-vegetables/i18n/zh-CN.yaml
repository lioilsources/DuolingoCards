lang: zh-CN
pivot: false
title: 蔬菜
cards:
  veg.artichoke:
    label: artichoke
    summary: 一种大而绿色、有尖刺状蔬菜特征的食物
    info: 洋蓟（刺菜属球茎变种）实际上是大型带刺植物的花蕾。我们食用的是它的中心部分和肥厚鳞片基部。它能赋予饮品风味；因此金巴利苦艾酒含有洋蓟提取物，是富含菊粉的一种益生元食品。
  veg.arugula:
    label: rocket
    summary: 一种辣味深绿色沙拉叶，是意式料理中的常见配料。
    info: |-
      火箭菜（学名：Eruca vesicaria）原产于地中海地区。
      它因含有硫代葡萄糖苷而具有独特的辛辣、苦味的口感。
      它是意大利美食的基础食材；通常在披萨烤好后撒上生食。
  veg.asparagus:
    label: 芦笋
    summary: 嫩而鲜美的春天新芽；一种珍贵季节性的青菜
    info: 芦笋（天门冬）是一种最昂贵的春季蔬菜。白芦笋在无阳光条件下种植，比绿芦笋更细腻。食用后会导致约百分之二十到四十的人尿液有特殊气味（因含有天门冬酰胺）。它是德国和法国传统上广受欢迎的一种时令性精致绿色植物。
  veg.bamboo_shoot:
    label: 竹笋
    summary: 一种亚洲常见的脆口蔬菜
    info: 竹笋是刚发芽后不久采摘的嫩竹茎。它们是中国、日本和泰国烹饪的基础食材之一，新鲜的竹笋含有氰化物必须煮熟食用；而罐装或加工过的则较为安全且方便使用。
  veg.beet:
    label: 甜菜
    summary: 一种深色圆形根茎类蔬菜；既是着色剂也是食物原料
    info: "甜菜（拉丁学名：Beta vulgaris）含有甜菜苷，这是一种强效的天然红色色素。它富含硝酸盐，有助于提高运动表现并降低血压水平。\t糖用甜菜是另一种品种；它是白砂糖的主要来源之一。\t食用红甜菜后尿液呈粉红色的现象称为甜菜素尿症，在医学上属于无害现象。"
  veg.bok_choy:
    label: 小白菜
    summary: 一种亚洲叶类绿蔬具有白色茎部及深色叶子
    info: "小白菜（ Brassica 芥蓝亚种 chinensis）原产于中国。\n它是中餐、日式和泰式的常见蔬菜，富含维生素C、K、A以及钙质。 \n快速烹饪方法：在炒锅里用大蒜与姜片爆香两分钟。"
  veg.broccoli:
    label: 西兰花
    summary: 一种绿色蔬菜，具有致密的花头和粗壮的茎。
    info: 西兰花是一种来自十字花科的绿色蔬菜。它富含维生素C、K以及抗氧化剂；起源于意大利。
  veg.cabbage:
    label: 包心菜
    summary: 一种圆型、叶子紧实的绿叶蔬菜；也是制作腌制食品的基础原料
    info: "{\"info\":\"卷心菜（甘蓝）是一种古老的蔬菜，已在欧洲种植了数千年。它富含维生素C和K以及具有抗癌特性的葡萄糖苷类物质。\r\n通过发酵可制成酸白菜（德国泡菜），其中含有丰富的益生菌。\r\n在德国家庭烹饪中是基本的配餐；而在韩国则被称为韩式辣酱（Kimchi）。\",\"hint\":\"大型圆形叶状植物，叶片紧密排列。（学名：Brassica oleraceae）\"}"
  veg.carrot:
    label: 胡萝卜
    summary: 一种甜味的橙色根茎类蔬菜。
    info: 普通胡萝卜是一种两年生植物，因其多汁的橙色块状根而被种植。它富含β-胡萝卜素（维生素A前体）和膳食纤维。
  veg.cauliflower:
    label: 花椰菜
    summary: 由许多小花朵组成的紧密白头；比利时对这种白色的蔬菜进行了投资
    info: |-
      花椰菜（Brassica oleracea var.botrytis）与西兰花是近亲。白色是因为叶子保护了头部，避免阳光照射从而抑制叶绿素的形成。
      也有紫色、橙色和绿色品种存在。
      在无麸质饮食中，它常被用作面粉或米饭的一种替代品。
  veg.celeriac:
    label: ball-rooted parsley
    summary: 一种大型白色块状芹菜根；用于做各种浓汤等基础材料
    info: 球茎芹菜（Apium graveolens var. rapaceum）是一种为了收获根部而种植的芹菜品种。它具有浓郁的芹菜香味和味道，是制作汤、芹菜沙拉（如雷莫拉德酱）以及烤制菜肴的基础原料之一；起源于地中海地区，在捷克语境中也深受喜爱，并且在法国与德国料理里也很受欢迎。
  veg.celery:
    label: 带茎芹菜
    summary: 具有强烈芳香气味的一种爽口绿叶蔬菜
    info: '{"info":"芹菜（学名：Apium graveolens）原产于地中海地区。\n据说吃芹菜在消化过程中消耗的热量比它提供的多；但这一说法尚未得到证实。\n它是法式烹饪基础三件套之一——Mirepoix（洋葱、胡萝卜和芹菜）。\n芹菜汁是一种流行的排毒饮料。","label","总结": "一种带有浓郁香气的脆嫩绿色蔬菜，零卡路里？"'
  veg.chard:
    label: 甘蓝芥
    summary: 一种颜色丰富的绿叶植物带有彩色的茎
    info: "{\"hint\":\"大型色彩鲜艳的叶类蔬菜，茎部为红色或彩虹色（甜菜）\",\"info\":\"甘蓝芥（ Beta vulgaris subspecies cicla ) 是红萝卜的一种变种。\\u005c\n它有绿色、红色、黄色或者七彩条纹状的梗。\x7F\\u005c\n富含维生素K,A,C和矿物质(钾与镁）。n\\u005c\n在捷克传统上种植；如今又重新流行于时尚餐饮界。\"}"
  veg.chickpeas:
    label: 鹰嘴豆
    summary: 圆形浅褐色种子型豆科作物；用于制做Hummus与Falafel等食物
    info: |-
      鹰嘴豆（学名：Cicer arietinum）是中东和印度地区广受欢迎的豆类。它是制作希腊酸奶酱（hummus，即鹰嘴豆浆糊状物）以及炸丸子食品falafel的主要原料之一；富含植物性蛋白质，在素食主义及纯素饮食中非常流行。
      此外其煮熟后剩余之水——称为Aquafiba，则可作为烘焙时替代鸡蛋蛋白的一种材料。
  veg.chili:
    label: 辣椒
    summary: 一种红色或绿色、味道极辣的小型辣椒，在亚洲和印度菜肴中不可或缺
    info: 辣椒（包括 Capsicum annum 及其变种）是一种非常辛辣的甜椒品种。辣味由辣椒素引起，通常用斯科维尔标度来衡量（例如：墨西哥胡椒为 2500–8000 SHU；卡罗莱纳死神辣椒超过两百万 SHU）。从进化角度看，辣椒素的作用是驱赶哺乳动物而非鸟类——因为后者有助于传播种子。
  veg.corn:
    label: 玉米
    summary: 一种带有黄色多汁籽粒穗的高草作物。
    info: 玉米原产于中美洲，如今是种植最广泛的农作物之一。其籽粒含有碳水化合物、蛋白质和B族维生素。
  veg.cucumber:
    label: 黄瓜
    summary: 一种长绿色多汁的蔬菜。
    info: 黄瓜是一种热带葫芦科植物，含水量高达95%，口感清爽，在沙拉中很受欢迎或作为零食。
  veg.eggplant:
    label: 茄子
    summary: 暗紫色卵形植物；马萨卡及拉塔图耶的主要材料
    info: '{"info":"茄子（学名：Solanum melongena）起源于印度，已有数千年的种植历史。\n在意大利称为melanzana，在法国叫aubergine，在美国称eggplant。\n其含有丰富的花青素——一种强效抗氧化剂存在于深色外皮中。\n是地中海和中东饮食的基础食材之一，并用于制作如 Moussaka、Baba Ganoush 和 Ratatouille 等菜肴。","label":"茄子","summary":"暗紫色椭圆形蔬菜；Moussaka 及 Ratatouille 的主要原料。"'
  veg.endive:
    label: endive
    summary: 浅绿色、略带苦味的基础生食蔬菜
    info: "{\"hint\":\"淡色叶类蔬菜，味道苦涩；菊科植物（Chicory）\",\"info\":\"Endive （学名：Cichorius intybush 或者 C.endiva），是一种具有明显苦味的绿叶菜。其白色外观是通过在黑暗中种植获得的（如 Chicory 菊苣）。这种苦味来源于 Intibin 酸成分，在进行焯水处理后可以降低它的苦度。\r\n比利时 Endive 又称 Witloof 是一种精致春季沙拉材料，并且深受法国和比利时人民的喜爱。"
  veg.fennel:
    label: 茴香
    summary: 一种白色洋葱形状植物带有羽状叶片，并且有甜美类似甘草的味道
    info: |-
      茴香（Foeniculum vulgar）因其含有甲基胡椒酚而具有甜美的甘草味。它的球茎、叶柄和羽毛状叶子都可以食用，是意大利地中海饮食的基础食材；常用于制作青酱、沙拉以及烤鱼等菜肴。
      在亚洲及意大利的烹饪中，其种子被用作调味料或助消化剂。
  veg.garlic:
    label: 大蒜
    summary: 一种辛辣的白色球茎，具有明显气味，是许多菜肴的基本调味品。
    info: 栽培的大蒜在厨房中被用作香料和药物已有数千年历史。它含有大蒜素，这种物质具有抗菌和抗炎特性。
  veg.ginger:
    label: 姜
    summary: 具有刺激性和芳香味道的小块状褐色香料性根茎
    info: |-
      姜（Zingiber officinale）是一种来自热带亚洲的植物根。它含有生姜辣素，这种物质负责其辛辣和抗炎特性。
      研究表明，姜对恶心、胃部不适有效果。
      姜茶、姜啤酒以及姜饼干是广受欢迎的产品。
  veg.green_beans:
    label: 青豆
    summary: 一种长长的绿色扁平状蔬菜；在尚未完全熟透的时候就被采收了
    info: |-
      {"hint":"长而细的绿色豆荚（Phaseolus vulgaris）","info":"青豆荚（Phaseolus vulgaris）是在未成熟时采摘。
      它们也被称为法国菜豆、四季豆或小宝宝豆。\r
      含有维生素C和K以及叶酸。\r
      用沸水焯过并加入杏仁烘烤，是经典的美国配餐菜肴之一——绿豌豆砂锅炖饭。（Green Bean Casserole）。"}
  veg.kale:
    label: 卷心叶
    summary: 暗蓝色波浪状叶片绿叶蔬菜；超级食材
    info: |-
      卷心菜（甘蓝变种 sabellifica）是一种非常有营养的深绿色蔬菜。它富含维生素K、A和C以及抗氧化剂。
      在2010年代，这种食物成为素食主义者与健康运动中的标志性超级食品。
      生吃时味道较苦；通过用油按摩或焯水可以改善口感。
  veg.kohlrabi:
    label: rabarbar
    summary: 一种具有圆形球形肉质茎的绿色植物，属于十字花科家族中的芸苔属作物之一
    info: 芜菁（学名：Brassica oleracea var. gongylodes）是一种与卷心菜相关的蔬菜。人们食用其膨大的茎和叶子，味道细腻、略带甜味且脆嫩；既可以生吃也可以煮熟后食用。“Rabarber”一词源自德语，“Kohl”的意思是“甘蓝”，而“raber”则表示根部或块状物的含义。它在印度、德国以及捷克地区非常受欢迎。
  veg.leek:
    label: 圆葱
    summary: 一种大型温和的大葱类蔬菜，用于制作汤品及炖菜的基础材料。
    info: |-
      圆葱（学名：Allium ampeloprasum）是洋葱和大蒜的近亲。
      它是威尔士的国家象征；威尔士人会在圣大卫日佩戴它。
      其含有蒜素以及维生素K与C。
  veg.lentils:
    label: 扁豆
    summary: 一种小而平盘状的大豆种子，在印度饮食中作为蛋白质的主要来源
    info: 扁豆（Lens Culinaris）是世界上最古老的食用植物之一，种植历史已有上万年。它有红色、绿色和黑色等不同品种；不需要浸泡即可在二十到三十分钟内煮熟，并且比大多数其他种类的豆类烹饪时间更短。
  veg.lettuce:
    label: 生菜
    summary: 一种脆嫩叶类蔬菜；绿色沙拉的基础材料
    info: |-
      生菜（拉丁学名：Lactuca Sativa）自古以来就在埃及种植。它含有超过百分之九十五的水分，是一种低热量蔬菜；有许多品种如冰山、罗马、罗洛、奶油头和橡树叶型等。
      在希腊时期是祭祀用的食物之一，并且希波克拉底推荐其作为镇静剂。
  veg.lotus_root:
    label: lotosový kořen
    summary: 带有美丽空洞结构的莲根剖视图：亚洲美食佳品
    info: 莲藕（ Nelumbo Nuci fera）是圣莲花的地下茎。横切面显示出对称孔洞图案，是一种中国、日本和印度菜肴的基础食材，并富含维生素C与B6及钾元素；口感爽脆。
  veg.mushroom:
    label: 蘑菇
    summary: 一种灰褐色的伞状可食用真菌，常用于烹饪。
    info: 双孢蘑菇是世界上最广泛种植的蘑菇。富含蛋白质、维生素B和矿物质；被用于无数菜肴中。
  veg.okra:
    label: 秋葵
    summary: 绿色带肋果荚具有粘性口感，在制作Gumbo时常用作基础材料
    info: |-
      秋葵（锦葵属）原产于热带非洲。
      它是美国菜肴gumbo的基础食材；其滑腻的质地可使酱汁浓稠。
      切开后，可以看到它形成星星状结构。富含膳食纤维、维生素C和K以及叶酸。
  veg.onion:
    label: 洋葱
    summary: 一种辛辣的层状葱属蔬菜，用于调味。
    info: 洋葱是世界上最广泛种植的蔬菜之一。它在全球范围内被用来为菜肴增添风味，并含有具有抗菌作用的类黄酮化合物。
  veg.parsley:
    label: 香菜
    summary: 明亮绿色草本植株；既可作为菜肴点缀也可提供芳香风味
    info: 香菜（欧芹）常被用作调味料和装饰品。它每单位重量的维生素C含量甚至比橙子还高；有平叶型与卷曲两种品种，厨师更偏爱味道浓郁、叶片扁平的一种。在古希腊时期人们将这种植物同死亡联系在一起，在棺材上会铺放大量的此物。
  veg.parsnip:
    label: 过去纳卡
    summary: 一种奶油色白色的块状植物；中世纪时为重要的基础食材
    info: |-
      洋蓟（学名：Pastinaca sativa）是一种与胡萝卜相关的白色根茎类蔬菜。
      在土豆传入欧洲之前，它是主要的粮食作物；如今则较为少见。它具有甜美的坚果味，在霜冻后味道会更甜美
      烤制或用于浓汤都非常出色，并是英国传统周日炖菜的重要组成部分。
  veg.peas:
    label: 豌豆
    summary: 绿色小圆种子长于果壳内，在春天象征着温柔
    info: 豌豆（ Pisum Sativum）是一种自古以来就被种植的豆类。格雷戈尔·孟德尔在遗传学实验中研究了豌豆，时间从公元一八五六年到六三年止；甜脆豌豆整颗荚都可食用、糖豌豆则更甜美些。它富含植物蛋白和维生素以及纤维。
  veg.pepper:
    label: 甜椒
    summary: 一种有光泽的彩色蔬菜，味道可以是甜味或辣味。
    info: 甜椒既有甜品种也有辣品种。红色甜椒在所有蔬菜中维生素C含量最高。
  veg.potato:
    label: 马铃薯
    summary: 棕色块茎是世界各地许多菜肴的基础。
    info: 土豆原产于南美洲的安第斯山脉，是世界上最重要作物之一。它富含碳水化合物、维生素C和钾元素。
  veg.pumpkin:
    label: 南瓜
    summary: 大型橙色圆形葫芦；象征着万圣节与秋季烹饪
    info: '{"info":"南瓜（学名：Cucurbita maxima 或 Cucurbita pepo）原产于美洲。它富含β胡萝卜素以及维生素A和C。").万圣节雕刻传统，即“杰克灯”起源于爱尔兰。南瓜籽是锌、镁及植物蛋白的优质来源。'
  veg.radish:
    label: 胡萝卜
    summary: 一种小而辛辣、呈鲜红色的小型块状植物；开胃菜和春季美食
    info: 萝卜（Raphanus sativus）是一种生长迅速的根茎类蔬菜。小型园艺用红萝卜是红色，大型冬季白萝卜通常是白色（如大葱）。它含有具有抗菌特性的葡萄糖苷酸盐化合物，在日本，作为基础烹饪原料的大葱被广泛使用。
  veg.spinach:
    label: 菠菜
    summary: 一种含丰富铁质深绿色蔬菜
    info: |-
      菠菜（学名：Spinacia oleracea）起源于中世纪的波斯。它富含维生素K、A、C，叶酸和铁元素。
      从上世纪三十年代开始，《大力水手》漫画中的角色将菠菜宣传为儿童的理想营养食品。
  veg.spring_onion:
    label: 春葱
    summary: 一种带有白色根部与绿色茎秆且质地细腻的小型洋葱；用于制作沙拉等菜肴
    info: |-
      春葱（学名：Allium fistolus 或 A. cepa）是在未成熟时采摘的。
      它比普通洋葱更细嫩，辣味也较轻。
      在亚洲烹饪中常被用作装饰、沙拉和汤中的配料。无论是生吃还是加热食用都非常美味。
  veg.squash:
    label: 南瓜
    summary: 形状各异的冬季南瓜，在秋季烹饪中的基本蔬菜
    info: '{"hint":"多形冬南瓜（葫芦科）","info":"冬季南瓜包括布特努特、橡果瓜、德尔尼塔和卡波奇亚品种。\n它们形成坚硬的外壳，可以保护数月；整个冬天都可以储存。\n富含维生素A、C及B族复合体。\n在‘三姐妹’体系中对印第安人的饮食有重要意义。（玉米—豆类—南瓜系统）。"}'
  veg.swede:
    label: ru-ta-bag-a
    summary: 一种大型紫黄色块根蔬菜与苏格兰haggis搭配食用
    info: |-
      芜菁（芸苔属）是甘蓝和芥菜的杂交品种。在美国被称为rutabaga；在苏格兰则是哈吉斯必不可少的一种配餐食材。
      它煮熟后味道甜美，略带辛辣味
      富含维生素C及膳食纤维，在北欧地区广受欢迎。
  veg.sweet_potato:
    label: 红薯
    summary: 一种来自亚热带地区的甜味橙黄色根状作物，并非传统意义上的土豆亲属。
    info: '{"hint":"红薯（橙色块茎，学名 Ipomoea batatas）","info":"甘薯原产于南美洲；在植物分类上与马铃薯无关。\n它富含β胡萝卜素、维生素A和C以及膳食纤维。\n其果肉的橘红色是由于含有丰富的 β 胡萝卜素所致。\n数百年来一直是非洲菜系中不可或缺的基础食材，在亚洲及拉丁美洲饮食文化里也占据重要地位。":["label": "红薯", "summary": "一种来自亚热带地区的甜味橙黄色根状作物，并非传统意义上的土豆亲属。"]'
  veg.taro:
    label: 芋
    summary: 一种具有紫色条纹的大颗薯状食物
    info: '{"hint":"大型含淀粉的紫色斑点球茎（芋头）","info":"芋类植物(学名：Alocasia macrorrhiza)，是一种热带块根作物，已有上万年的种植历史。\nPoi是夏威夷的一种发酵食品主要由芋制成，在波利尼西亚、非洲和亚洲都是重要的主食；生吃时会有轻微坚果味，并且果肉中带有明显的紫红色花纹图案作为视觉标志物之一。未经煮熟直接食用会因含有草酸而引起灼烧感。'
  veg.tomato:
    label: 番茄
    summary: 一种红色圆形果实，用作蔬菜。
    info: 从植物学上讲，番茄是水果（浆果），但在烹饪中被当作蔬菜使用。它原产于南美洲，并含有番茄红素和维生素C。
  veg.turnip:
    label: 芜菁
    summary: 一种白色带紫色斑点圆形块状植物性食材，在中东地区历史悠久
    info: |-
      芜菁（芸苔属）是一种与萝卜相关的根茎类蔬菜。
      在西美洲的马铃薯传入欧洲之前，它是欧洲的主要食物之一。
      它含有维生素C、钙和膳食纤维。作为一种素食替代品；芜菁汤是中欧的传统食谱。
  veg.watercress:
    label: 水上芥末草
    summary: 来自水流中的小株型暗绿辣味香草
    info: '{"hint":"小型深绿色辛辣水生植物（豆瓣菜）","info":"水上芥末草（Nasturtium officinale）生长在寒冷的小溪和泉水中。\n它因含有黑芥子糖苷而具有刺激性、胡椒味的口感，富含维生素C、K以及β胡萝卜素。\n英国传统上将其作为三明治调味酱；法国则用来制作cresseau汤。");'
  veg.yam:
    label: 山药
    summary: 一种大的热带淀粉类根茎植物
    info: '{"info":"山药（薯蓣属）是非洲、亚洲和加勒比海地区热带地区的大型淀粉块茎。\n它与木薯不同： 山药更干燥，更有粉状感且不那么甜； 它的重量可达70公斤。\n它是撒哈拉以南非洲的主要粮食作物，在那里种植了全球产量超过百分之九十五。"]'
  veg.zucchini:
    label: 西葫芦
    summary: 绿色的夏用瓜菜，在烹饪和烘焙中用途广泛
    info: 西葫芦（南瓜属）是一种未完全成熟的夏季瓜类蔬菜，长度为7至25厘米。原产于墨西哥；在欧洲由意大利推广普及。其含水量超过百分之九十，并且热量较低。
