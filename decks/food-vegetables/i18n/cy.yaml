lang: cy
pivot: false
title: Vegetableddion
cards:
  veg.artichoke:
    label: artichoek
    summary: Grisel nodweddiadol sydd hefyd yn caffaeliannu.
    info: Mae Artychock yn ymddwyno o'r gwisg rhag absed hedfan fach ar gyfer cynnyrchau fel Cinzano ac 'vermouth' - mwyaf ganlyn nhw ddim ond am eich adweithredu'n eu cyflwr naturiol.
  veg.arugula:
    label: rucola
    summary: Tmaw drwy ddwyn rhagor o wydr grell.
    info: Gwlyddia'r Môr Gorllewinig ydy Rucola (Eruca vesicara subspecies sativa). Mae'n dod yn nosfol gyda sylfaen penodol i'ch chweil ar ôl ei gwaero.
  veg.asparagus:
    label: Cwsgod
    summary: Veddan hedfan tawel naill agored.
    info: Mae Cwsgod y Llyfr Asparagos yn un o'r llanforau grefydd ar gyfer hafaliau bygythiadol dros nosonni. Mae cwsgod dywyll heb ei heilio i hydron niweledig ac felly mae'n rhagymru gwyrdd glân ond nid wyntir am dan gloffiant sengl. Ar ôl'i'ch brynu fe wnaeth chi fynd allto cynhyrchu smell penodol ar morwyn nhoch hadewaith gan boblogrwydd rhanbarh - tua 65% ohonom ni.
  veg.bamboo_shoot:
    label: gwyryddiau babgu
    summary: Gwyryddiau babgu - ffrwd Asia'gor sydd weddillion.
    info: Mae'r gwyryddau babgu yn ymchwil rhaglennol i boblogrwydd Cymru ac mewn gwirionedd maen nhw'n cynghreiddio ar gyfer cyngresiadaeth.
  veg.beet:
    label: crogwr
    summary: Gofodynad goffredig coedgar neu feithrin.
    info: Mae'r gogwyddo dan y llygad yn cynnwys betaïnin sy'n pigmen naturiol coch fawr. Mae wedyn nhwch arno dros amrywiol gan ddod â'u harferiant at wella ac gostyngu twll sylfaenig. Mewn gwirionedd mae rhaglennau cwiket hefyd yn rym bellach.
  veg.bok_choy:
    label: Choi
    summary: Creferydd ryfelodwyth â llyfrau du ond cymerir chi ei enw 'choi' i ddathlu am ein bod yn dod o Efrog.
    info: Mae Pak Choi yn grefydd rhag Asia ac mae ei enw'r unigol ydy Brassica Rapasubspecie Chinensise. Mae'n cael ei ddefnyddio fel gwahaneg ar gyfer cymryd lluniau o fewn yr eitemau hwn.
  veg.broccoli:
    label: '"pobllog"'
    summary: Llynfiwr gwenithig ag hedfan floreded
    info: '{"hint":"llwyngoch gwenithig â heinffloriant droseddol","info":"Mae ''brollyg'' yn llwyn ar gyfer rhaglennu''r cymal brockweilddynau. Mae wedi dod o yw Eiddew ac mae''n amrywiad anaml fodd bygythiad hael, vitamin C ganologaethantodant."'
  veg.cabbage:
    label: Cefnllydan
    summary: cylinder shaped brassica
    info: "Mae cefnlin caledig yw Brassica oleracea wedi ei chweilfio yn Ewropa am filoedd\nGwnafodd vitamin A,C,K ac eich gweld hefyd mewn gwasglosinoletau sydd â phrosifft rhag aniferion\ndim bygythiad ar gyfer sauercap \nwedi'i ddod i'r fathrediaeth nhw"
  veg.carrot:
    label: carrot
    summary: Gweledigaeth cyffredig gan oren â sylfaen.
    info: Mae Carrot commun yn fwyed dwflyd sydd ei weithredu am gywod gwerthgar arnogoch. Mae wedi'i wneud ynddo'n ddrut rhag beta-carotene (pro-vitwin A) ac adlon.
  veg.cauliflower:
    label: cauliflower
    summary: Pennat dŵr goch gan boblogaeth floateriau; cyfrannodd Belgio ar wneud cromsennau bychan.
    info: "Cauliflower (Brassica oleracea var.botrytis) yw ei enw Cymraeg ar gyfer broccoli yn gategol\nMae'r lliwanedd yn dod at ddathlu'r pennad rhag hydrefiant sy'n symlethi diodwrwydd chloryfyll \nMae hefyd nodweddiadaethau lafreolaidd, narangetig ac emerald wedyn"
  veg.celeriac:
    label: cerflwydd cerwbraffig
    summary: Croen brenhinoledig gochydd digid - nodweddiadol i wneud cwmen
    info: |-
      Cerflwydd cerwbraffig (Apiun graevolenes variabilis rapaceum ydy'r enw grefyddiol arno), mae'n fath o grochel sydd wedi cael ei chweilfio am eich croen yn benodol
       Mae gan droedion pen drud dromau ac allfor iawn gydag awr danwen rhagor na phrofiadaeth gweddillion cyferbynydd
       Yn dod o liwr milenniau cynhyrchir hwnnw fel sylfaen ar gyfer cwmen, cremaidd cerwbraffeg neu 'remoulade', a hefyd yn ddifrod â mynod
  veg.celery:
    label: celeri
    summary: Gweledigaeth crafftro ar gyfer tân ryfel sydd â threthiant intensiol
    info: Celery cyngarweddig (Apium graveolens) yn deithrin o'r Môr Gorllewin Lofaeth. Mae'n ystyried ei bod yn ddefnyddio rhagymru caloreg cynhyrchwyd am yr un fath na'i gyllid - ond ni chafodd hwnnw eu profi gan ddadleoliadau factualeiddiau. Ydy wednod grugan gyda phencel ac apiciwm hefyd.
  veg.chard:
    label: man-gol
    summary: Garedin liwan fach â thronfedd rhagun
    info: Wedi'r mangoldtŵr yw Mangolt (Beta vulgaris subspecies Cicla). Mae'n dod yn goredwyddau gwyrdd, cochion, llawer neu 'du' o ran lliwtiau. Ydy wedi'i wneud ar gyfer vitaminau K, A ac E i fewn a mineralau fel potasiwm a magnesiwm.
  veg.chickpeas:
    label: Gecer
    summary: Llushwydd beigio drom; cyfrannwr i'ch humus chi.
    info: Mae Cicer arietinum yn llushwydd poblogaidd o'r Canolbarth a Genedl Indiaethau. Mae'n gydran yno ar gyfer crefft hummus ac falfal (bysedd sydd wedi'u gwaheidi). Poblogar mewn diet ryfelwch am ei chweil rhag abseddi plant.
  veg.chili:
    label: chwili
    summary: Gymeriad cerynoedd neu golwg lliwiau goleuni; nodweddiadol yn gyfoesi diod.
    info: 'Mae chwili papryka (Cappicium annum ac yn rhag)''n fath gwaelodgar yng nghategori''r paprica. Mae ei gwaith dymaeth am gymaint pen drud gan capsacycin sydd wedi''i heintio ar graddfa Scovelle (Jalapeno: 2,500 - 8,000 SUH), Carolina Reaper: +2 million). Cyt cyflwr evoleg Capsaycycin i ddifrod sychffyrdd nhwyll ers nad maent yn siarad trawmadau.'
  veg.corn:
    label: '"corn"'
    summary: Gweledigedd rhewyll dan yr awyr ag olwynion coproswythnas wedi'u trefnu.
    info: '{"hint":"cwrw golydwydd hir â granedau mynych yelltr yn ei fewnos (Zea mays) hefyd cawn neu "maize"","info":"Mae corn popeth o ddynysawd Canolbarth America ac ma''nhwi un ohonoch chi fyd-eang heddiw ar gyfer caffredu''r blodynna. Mae graneidfa''n cynnwys saccharidebau, proteïneiddiau a vitaminau tebyg i B."}'
  veg.cucumber:
    label: Gog
    summary: Ffrwd glas drut sydd ag eiconiau cryf
    info: '{"info":"Mae gweledigaethau Cucumis sativus yn ymhlith rhagennu''r cymeslin o fewn yr alwad cucurbits neu ''tywyddod''. Mae''n cynnwys am rydymig% dŵr ac felly mae wedyn ei heision ar gyfer eu bwerthiant fel crocwr naill ai yn ôsion cyffredol i''ch tŷ gwbl dan fyrydd.'
  veg.eggplant:
    label: Eggplant
    summary: Gwasg rhagoch du-flydredig sy'n gwneud sylfaen i Moussaca a Ratatouille.
    info: |-
      Mae Lylec yn dod o India ac wedi cael ei chwilio dros gyllid y flwyddynau
      Yr enw arno mewn Talwrain yw Melanzane, Ffrancia Aubergine, Unol Daleithiau Eggplant.
  veg.endive:
    label: ħechanka
    summary: Gweledigaeth glas â siŵr hirion sydd mewn fathoedd fel ĥechanka.
    info: Yw ħechankiau yn ymbarél o'r teulu Chicorieaidd gyda smwydd amharu ar wahân gan ei gwaith rhagolyn nhrythredig ac efallai'n wynebgar na pherthnasau eraill.
  veg.fennel:
    label: phenik
    summary: Ciwlen las â perthnasedd penllai a thrwyn anifil.
    info: Mae fenikl yn golygu Foenicolum vulgarum ac mae'n dod o'r alunol etanol sydd wedi'i wneud y smodyd swter arno. Mae ei buclanau, linellod a pherithedion yn cael eu bwyso gan rhagfyr hyd at yr Eidaliaid fel rhan all-dinystrol o'ch diet chi. Yw hwn hefyd yn gydran nodweddiadol o feddyliadau mediterraniaidd megis pastas, siopethau a thafariau.
  veg.garlic:
    label: cwenniol
    summary: Bwriad braws gyda geiriau hael nadrychgar
    info: '{"hint":"bawd rhew hefydd sy''n cael ei ddefnyddio fel adweithydd garwyddlond","info":"Mae cwennol yn cael ei defnyddio ym mynych ar droesoedd o filoedau fel llygreiddiad ac feiniogydd. Mae wedi''i ganddo allilisin sy''n dod â phriodion anticroftaethig a thriniaethu cyffwrnedigaeth."}'
  veg.ginger:
    label: zinzbwr
    summary: Welynod beigyau knofirol â smodyr cryfog a threthnas.
    info: Mae Zinzibar yn fath o wlyd sydd wedyn ynddo gan Asia Tropigl. Mae'n cynnwys gingeroli - priof ar gyfer ei atebion cryfaf ac anti-sylfaennol. Mewn rhagymniadau mae cymeradwyder am eich effaith ar geiriaeth a phrynhawn.
  veg.green_beans:
    label: faserau rhes
    summary: Podau faserau fyddai'n dod i dorri ond nad ydynt wedi'u cyrraedd.
    info: Mae faser rhew hefyd yn cael eu dweud fod nhw'n 'beans', neu bobbi beans. Mae plant y Phaseolus vulgaris yn cynhyrchu podau gwenith o'r enw Faserau Rhew.
  veg.kale:
    label: cenhinen
    summary: Lliwfodydd ddu-llynedd hefyd fel 'superfood'.
    info: Cennin yw Brassica oleracea cyfreithlon Sabellica sydd yn gogwyddo'r llifogydd rhagorol gan ddynrychioli amharu ar gyferiantau mawdrolig.
  veg.kohlrabi:
    label: rabigar
    summary: Rhew gy daelwg gerddedig ar linellion; cyfreithlon nhaw
    info: "Rabigar (Brassica oleracea goglydodau) yw rhew hefyd yn perthnasol â'r cenniniaeth \nGynwyfir caledig ar waelod y llithr\n Mae ei chwaer yn dda ac anfernodig gan ddifrodio neu chi fi wedi'i warmrio."
  veg.leek:
    label: cenydd
    summary: Glywed mil o fewn yr eithnod cybiwil
    info: |-
      Cenydd yw Allium ampeloprasum sy'n gilydd â chybiwl ac arwyllau
      Mae weddillion yn ei ddefnyddio fel symbol gymeriadur rhagymru'r Genedl Gymreig;
      lle mae pobl Weddal yn eu cario am brynhawn Santes David.
  veg.lentils:
    label: Lins
    summary: Ffurfiau llethnasgar nodweddiadol gan Lynges Culinary.
    info: Mae Linsculinaria yn un o'r llusgennau hynafolaf; wedi ei chwilio am milfed y gyllid ar ôl yr hen Oesoedd. Mae'n dod mewn fathau gwyrdd, coch, brun ac encriodig (Beluga). Gall e chi bwyso heb ddifrod rhag anrhegio ers 20 i 30 munud;
  veg.lettuce:
    label: gogwyddo glas
    summary: Cerwyn crafftroed sy'n dod yn enweddig
    info: |-
      Mae'r gogwyddo hlafnodig yn cael ei chwilio dros y mileni ers yr hen Oesoedd Celtaidd ar gyfer Lactuca sativa
      Gan fod wedi'i feithrin am bum procant naill ohir rhag woddi, maeth hefyd fodd nad o ddifrodoli i'ch diwt chi
  veg.lotus_root:
    label: llotws
    summary: Gorhad genedlaidd o lynges lotws â hymareddion peniarach.
    info: Mae'r llwyngoch llotws yn ywail nodweddiadol o lofod Llynges Nellum (Nelumbo nucifera). Mae'n cynnwys gweithgarfedd gyda dimensiwn enfawr ac mae ei gymylau dros dro ar waelod yn dod i'ch diomeddiau pan roedden nhymherthnas amdanyno. Yn cyffredinol wedi'i heidi neu fudi hi allai fod yn rhan ganologig o reolianniaeth Asia.
  veg.mushroom:
    label: ffrith
    summary: Ffrit lliwgar ag anhrefrydd sy'n cael ei ddefnyddio mewn cyngres.
    info: Mae champignon dwy-gwydr yn y ffrith rhag absoli dros ar byd. Mae wedi'i gosod am ei chweiliniant, vitaminau b enwch ac elfennau mynycholig.
  veg.okra:
    label: Ocraw
    summary: Lysiau gwreiddiol ag egni clodrach; cynharpernod gumb.
    info: Mae Okra yn dod o Aferica'r nosfet ac mae'n ymchwilio i bobl America fel rhan fwyafol gan gymeriad Gumbo. Mae ei teithlydd gludig ddim ond ar wahân nad anogir nhw chi hefyd ati'ch cyflwr amser bythnoetho cromsau. Yn benasgar rhag absoliwitau nodweddiadol sydd wedyn yn credu eu bod yn perthnas â phlanhigion.
  veg.onion:
    label: cebeth
    summary: Amrywiad pwerus ganrif rhewg cipen nhawodig ar gyfer adnabodi ac adeil.
    info: Mae Cebeth yn un o'r fwyaf gommon y byd erthyliol sydd wedyn i'w defnyddio ar gyfer codi amlyniadau'n eich bwyllau dros yr holl fydh; mae hefyd yn cynnwys flawnofedynnau â effectedigaeth anticrobidd.
  veg.parsley:
    label: Gwyddelig
    summary: Ffyddfelyn glasgar; agoredydd a chroen.
    info: Mae'r gwyddelig yn caffi ar gyfer croennu ac agoredydd y fathau. Mae'n cynnwys rhagymedraeth vitamin C mewn cyfrid â phomerenâu gan eu hymgais. Mynychir dwy rhyw - un llynges neu wyntredig, sy'ch wyliau gwneuthurwr cremphe ryfel am ei wasglyd dros dro.
  veg.parsnip:
    label: pasinet
    summary: Rhodlin lasnadwyn â thryloydd enfysiol
    info: |-
      Pasinatig (Pastinaca Sativa yw'r enw llynesol) yn rhodlyn gwenithgar sydd wedi dod i'ch sylfaen yn Ewrop ar gyfer miloedd cyn ddatganwyd telyntau;
      dim onid hwnnw'n cyffredin bellach ac maeth ei chweil nodweddiadol nhwsydd a pherthnas
      a'i wnaeth chi weled amdanynnai yn fwy garregrig ers bod tywyll.
  veg.peas:
    label: ffrwidrog
    summary: Cyllindri bysgodig yn y glasfair
    info: |-
      Mae'r ffrwydrog yn rhosymeddu yw Pisum Sativum sydd wedi cael ei chweilfrynto ers yr hen oesoedd
      Gwnaeth Gregor Mendel nodweddi arno'n gydran gan fynd i'nhyn nhom plantyddiaeth (1856 - 1863)
      Y gwanwyn mawr morol maen nhom cyfan y sylfaen ac mae 'cukarwr' hefyd yn llai amharu
  veg.pepper:
    label: paprika
    summary: '{"summary": "Gwenwyn glasnodig â wasgred wech na thrwth."}'
    info: '{"info":"Mae paprika gwlyb yn ymddod mewn fathau gweithgar ac arwyddocaeth rhag abseddi. Papryca coch cynhyrchir vitamin c amlynedd dros ben hefyd gan bob math o laswell."}'
  veg.potato:
    label: '"Telyr"'
    summary: '"Glyder llaethnat sydd wedi''i ddefnyddio fel bwyll sylfaenol i ddifrodion bobl rhagymhor gan gyrraedd gwledydd"'
    info: '{"info":"Mae''r telyr yn dod o''r Gogleddau yng Ngheiniwlog America ac maes ei uned fwyaf gwerthgar ar byd. Mae''n ffynhonnell amharu, vitamin c a potasiwm."'
  veg.pumpkin:
    label: Dynen
    summary: Tykyg wydr rhagor hefyd yn symbol Halloween.
    info: Mae dynenau yn dod o America ac maent nhw'n ymyl ar ben-tir karotein a ffitaminiau A a Ch. Mae'r tradition Halloween gan Irlandwydd sy'ch pen enw daethodol 'Jack-O-Lantern'. Mewnysdynenau dydynt yn gwyn i ddileithrio cynhyrchiant zinc, magnesiwm a proteïna phante.
  veg.radish:
    label: '''Radiș'''
    summary: Gweledig pan fyddai eich tŷ yn dod dan agorediad neu wrthreoli.
    info: Mae'r radisau yn ymddwyn rhagofal o fewn yr un gwasg Raphanaceae sy'n cynnwys nifer fwyaf o wahanol ryweddau. Mae'r enw 'red' ar gyfer 'radiș' wedyn ei ddisgrifio gan ddod â chymaint mawr i ben nhw chi angen eu cyrraedd.
  veg.spinach:
    label: spinât
    summary: Gwenyn llydan hael sy'nf fodel am ddifrod.
    info: |-
      Mae Spenútiaid Spinach Olerace yn dod o'r Efrog Frenhigeddol yng Nhecsnaeth Perwsia canlynol
      Yw'n gopio ar gyfer vitaminau K, A, C, ffolfat ac elwydion fer.
      Roedd Popeye (marinwr cartwn) wedi cyflwyno spinatu fel bwyllt i blant ers yr 1930s,
      wedi bod ei waerio nodweddiad yn rhannu eichrodd cymyllog â chalcwm.
  veg.spring_onion:
    label: cipwydd y nosgre
    summary: Ganoliad hael â gweddillion gochr ag antodion llynfeddig.
    info: Cipwydd y nosgredigau hefyd yn cael ei alw'n Aillwm fisgwlosym neu Heilwm cepeiau wnaeth chi ddim onidio'r enw cyntaf amdanyn nhw eto. Mae wedi'u tynnu cyn eu bod yn rhad ac felly maen nhw'n llai olynyddus nag un nodweddiadol ar gyfer gwastraffiad. Maen nhw'n ddifrifol yn yr eiconydd Asiaidd fel adweithgarwr ganoliaeth na chwareli.
  veg.squash:
    label: Squash
    summary: Fathau gwahanol o tykywydd zimmeredig - un ffrwd penodol i'ch fynd rhagor.
    info: |-
      Tykew Zimereddol yw'r teulu Cucurbita gan gynnwys nodweddi fel Buttercup, Acorn Squash, Delicata a Kabocha
      Mae'n creu croen sydd yn amrych ar ei gyflwr dros wynter;
      welsh nhw chi eu cadw bob dydd hyd at olwg nesaf.
  veg.swede:
    label: tŵr
    summary: Ffrwd corfforfol purpur-goch ond hefyd lliweddu - cyfansymudiwr haggyg
    info: |-
      Tŵr yn rhiant o'r gogwyddo ac y rhywogaeth Brassica napus
      Ynad wedi'i alwan yn America fel 'rutabaga'; mae'n gyson ar gyfer haggis yn yr Alban
      Gyda chwaith sythigol ganrif i'ch tynnu chi dros dro
  veg.sweet_potato:
    label: patat
    summary: Hlydwr glasoch sy'n perthnas anghyntredig ag hliweddu o fewn gwledydd hefyd
    info: |-
      Mae'r batât yn dod o America y Gorllewinol ac ni chwilio mwy nag amrywiadol ar gyfer cymysgiadau gormodig â'brambaith
      Cynnfor betel-beta, vitaminau A a C gan gymharuaeth i fathreini
      Gwnth yr uned rhaglennu cyson dros flynedoedd yn fyddiaeth Afrikaidd, Asiatwg a Lladron Americanaidd
  veg.taro:
    label: Tarau
    summary: Gromelod tywyll gyda lliweniau coch-goch rhaglunol
    info: |-
      Yw Taro yn gromelod ysgafell hefyd fel Colocasia escutentan sydd wedi cael ei chweilfio am milfed mlynedd
      mae'n bwynt nodweddiadol i'r Olygfaeth, Asia ac Africa;
      wedi'i fermodoli yn Poi ar Hawaii.
  veg.tomato:
    label: tomàt
    summary: Ffrwd goffro cynhyrchir fel perygl.
    info: Tomàt yn yw'r enw plantigol ar gyfer bobl (solanaceae) ond mewn gweithredu caffiwyddo'n tebyg i brynyddlau. Mae weddiannodd o America Barbaridd ac roedden nhymhoedd rhagor am ei chlymenogen a vitamin c.
  veg.turnip:
    label: Wodliece
    summary: Oesoedd fwlch-llynodyr syth; pwyllfor ddigon hŷnas
    info: |-
      Mae'r wodlice yn oesoedd rhew hefyd i reiadr yw Brassica napafach
      Roedd hi'n bwyllfor sylfaenyddol Ewrop ers gynhyrchiant pomalau o Wastell America
      Ganlyniadau vitamin c, calciwm ac arfernod
  veg.watercress:
    label: clywis
    summary: Bygythlin allforfol tawel dan fyd
    info: Clywys y wladfaidd Nasturtium officinale yn rhedfan dywyll ac ar fathronau gwenithgarreg. Mae'n dod â smail tebyg i pebre oherfon nhaglosigsinat sydd mewn ei enyn - 'syngrine'. Ydy wedi'u cyflwr am gymaint ag Aethlyn C, K a'r karoteinin.
  veg.yam:
    label: Jam
    summary: Rhew diaperygol gadeirydd â phwrpasau cydranbarata
    info: "Yw y Jam yn rhew hefyd ei alw'n Dioscoria sydd wedi'i redeg o'r afrycan nhropigol gan Asia ac Africa ar hyd pob awyrion Caribiwn\nWedi'u wahaniaethu oddyn Baratu - dyma fwy llifogyddus, waelodach i źyrofioac a chyson \nGall eu pwysiant ddod at gynted na 70kg"
  veg.zucchini:
    label: cucumber
    summary: Green summer vegetable used for cooking.
    info: Mae Cucumis Pepō yn gwareliad yno o'r tymorth cucurbits sy'n cael ei dorri cyn iddo ddod â hygredigedd gyda siâp allai rhwng 7 ac 25 sm. Mae wedi dod oddi d'Mexico gan yr Eryrid eu sylfaen arall yn Europe. Mynych mwy na chyfansawdd 94% water; low-calorie food.
