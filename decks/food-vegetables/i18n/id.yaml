lang: id
pivot: false
title: Sayuran
cards:
  veg.broccoli:
    label: brokoli
    summary: Sayuran hijau dengan kepala bunga padat pada batang tebal.
    info: Brokoli adalah sayuran hijau dari keluarga kubis-kubisan. Ia sangat kaya akan vitamin C dan K serta antioksidan; brokoli berasal dari Italia.
  veg.carrot:
    label: wortel
    summary: Sayuran akar berwarna oranye dengan rasa manis.
    info: Wortel biasa adalah tanaman dua tahun yang ditanam untuk akarnya yang juicy dan berwarna oranye. Ia kaya akan beta-karoten (previtamin A) dan serat.
  veg.corn:
    label: jagung
    summary: Sayuran kuning dengan baris biji berair pada tongkol.
    info: Jagung tumbuh pertama kali di Amerika Tengah dan sekarang menjadi salah satu tanaman pangan terpenting. Bijinya mengandung karbohidrat, protein, serta vitamin grup B.
  veg.cucumber:
    label: timun
    summary: Sayuran hijau panjang dengan daging segar yang berair.
    info: Timun adalah sayuran tropis dari keluarga labu-labuan. Mengandung 95% air, menyegarkan dan populer dalam salad atau sebagai camilan.
  veg.garlic:
    label: bawang putih
    summary: Bulat berwarna putih dengan aroma kuat yang menjadi dasar rasa banyak masakan.
    info: Bawang putih telah digunakan selama ribuan tahun dalam memasak sebagai bumbu dan obat-obatan. Mengandung allicin yang memiliki sifat antimikroba dan anti-inflamasi.
  veg.mushroom:
    label: jamur
    summary: Jamur cokelat muda yang digunakan dalam masakan.
    info: Agaricus bisporus adalah jamur tertanam terbesar di dunia. Kaya akan protein, vitamin B dan mineral; digunakan dalam berbagai hidangan.
  veg.onion:
    label: bawang bombai
    summary: Sayuran bawang berlapis pedas untuk menambah rasa makanan.
    info: Bawang bombai adalah salah satu sayuran paling banyak ditanam di dunia. Digunakan sebagai penyedap masakan di seluruh dunia; mengandung flavonoid yang memiliki efek antimikroba.
  veg.pepper:
    label: paprika
    summary: Sayuran berwarna cerah dengan rasa manis atau pedas.
    info: Paprika tahunan tersedia dalam varietas yang manis maupun pedas. Paprika merah memiliki kandungan vitamin C tertinggi di antara semua jenis sayuran.
  veg.potato:
    label: kentang
    summary: Dasar umbi berwarna cokelat dari banyak hidangan di seluruh dunia.
    info: Kentang berasal dari Pegunungan Andes di Amerika Selatan dan merupakan salah satu tanaman pangan terpenting di dunia. Kentang adalah sumber karbohidrat, vitamin C, dan kalium.
  veg.tomato:
    label: tomat
    summary: Buah merah bulat yang digunakan sebagai sayuran.
    info: Tomat secara botani adalah buah (biji), tetapi di dapur digunakan seperti sayuran. Tomat berasal dari Amerika Selatan dan mengandung likopen serta vitamin C.
