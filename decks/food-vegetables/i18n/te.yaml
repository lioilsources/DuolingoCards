lang: te
pivot: false
title: సీజనల్ పచ్చదనం
cards:
  veg.broccoli:
    label: బ్రోకలి
    summary: పసుపు కూజా మొక్కతో ఒక గట్టి వేళ్ల తీగ ఉన్న ఆకుపచ్చ బహుళ ఫలధారి.
    info: బ్రోకలి ఎల్లది అవయవం నుండి రాష్ట్రం లో ఒక ఆకుపచ్చ పంట. ఇది విటమిన్‌ సి, కె మరియు ఏజెంట్లు అంటే శక్తి దృఢీకరణ కలిగి ఉంటుంది; ఇది ఇటలీ నుండి వచ్చింది.
  veg.carrot:
    label: మూలిక
    summary: పదార్త రుచి ఉన్న కోడిగుள్ల వర్గంలోని నారింజ రంగు గడ్డ.
    info: ఒరాంజ్ బెటాకారోటీన్ (ఎవిటమిన్ ఏ) అలాగే ఫైబర్‌తో సహా శరీరానికి అవసరమైన పోషకాలతో నిండి ఉంటుంది. దీనిని తయారు చేసే జొన్న లేదా పార్స్నిప్ కాదు.
  veg.corn:
    label: కూకురిస్
    summary: బల్లెడు కాయలతో నిండిన పచ్చదనమైన ధాన్యం.
    info: కూకురిస్ ఉత్తర అమెరికా నుండి వచ్చింది ఇది జిఎమ్ ద్వారా తీసుకొనబడింది ఇటీవల పెంపకం చేసే రుణాలలో ఒకటిగా గుర్తింపబడింది. బియ్యాలు శర్కరాలు, ప్రోటీన్లు మరియు బి గ్రూపు విటమిన్లను కలిగి ఉంటాయి.
  veg.cucumber:
    label: కూరగా
    summary: చల్లని మసులైన గడ్డ కలిగిన పసుపు రంగు వెజిటబుల్.
    info: కొబ్బరి తోలు అనేది ఒక ఉష్ణవల్లభ కీటో ఫ్లోరిడేసియే కుటుంబానికి చెందిన కూరగా. దీనిలో 95% నీరు ఉంటుంది, ఇది శీతలీకరణ చేస్తుంది మరియు సలాడ్‌లలో లేదా బిస్కెట్ గా ఎంపికగా ఉంటుంది.
  veg.garlic:
    label: పులిన బొంతు
    summary: గాలికి చేరే వాసన ఉన్న తెల్లని గడ్డ అది ఎన్నో వంటకాలకు రుచి యొక్క నిలयమైనది.
    info: ఒళ్లు కుక్కెఱువు లీనహర్ష దృఢత్వం ఏర్పడిన శాతీయం జీవాలు విభజన నిరోధించే సహజ గుణాలు కలిగి ఉంటుంది.
  veg.mushroom:
    label: పుల్ల
    summary: తెలుస్తోనే తెలుపు రంగు కావడి ఉన్న వంటకాలలో ఉపయోగించే బరువైన ఫంజస్.
    info: దీని అధిక మొత్తంలో నీటి లో గృహ పౌష్ఠికా ఎక్కువగా ఉంటుంది. దీనిలో ప్రోటీన్‌లు, విటమిన్ బి మరియు ఖనిజాలు ఉంటాయి.
  veg.onion:
    label: సీలియం
    summary: ఆకు కూరగాయలను రుచితో పెంచడానికి ఉపయోగించే వేడి అల్లమ్ బల్బ్.
    info: కొవ్వు లేని తృణదళాలు పై నుండి ఒక గుండ్రటి ఫలం ఏర్పరుచుకుంటాయి. దీనిని భోజనాలను ఎక్కువ రుచితో చేయడానికి ప్రపంచవ్యాప్తంగా ఉపయోగిస్తారు.
  veg.pepper:
    label: పెరుగు
    summary: విటమిన్ సి యొక్క ఒక రకం.
    info: ఎరుపు కాలిఫ్లవర్ అనేది విటమిన్ సి లో ఉత్పత్తి చేసే గడ్డకీడు నుండి తయారైన దాని బహుళ ధరలు ఉంటాయి.
  veg.potato:
    label: బ్రామ్‌బోర్
    summary: దక్షిణ అమెరికాలోని ఎండీల నుంచి వచ్చిన పొడిగా ఉండే భూస్థిత తృణధాన్యం.
    info: బ్రామ్‌బోర్ దక్షిణ అమెరికాలోని ఎండీల నుంచి వచ్చింది మరియు లోహితబిర్వలు, క్యారోటీన్లు, డయ్యోసిన్లు మరియు ఫైబర్ లు కలిగి ఉంటుంది. ఇది జీవజనితో పాటు రాగి మరియు పొటాశియం గుణాలను కలిగి ఉంటుంది.
  veg.tomato:
    label: రాజ్ చే
    summary: కూడాల పంటగా ఉపయోగించే ఎరుపెన్నుల కాయ.
    info: రాజ్ చే సహజంగా ఒక ఫలం (బీజం) అయినప్పటికీ, వాడకంలో దీన్ని కూడాల పంటగా గుర్తిస్తారు. ఈ మొక్క ఉత్తర అమెరికా నుంచి వచ్చింది మరియు లైకోపీన్ మరియు విటమిన్ C లను కలిగి ఉంటుంది.
