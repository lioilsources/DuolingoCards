lang: te
pivot: false
title: సీజనల్ పచ్చదనం
cards:
  veg.artichoke:
    label: ఆర్టికో
    summary: ఈ జీరణ చేసే ఉభయ లక్ఛణ శాలిని రూఢిగా ఒక ఫలధోఖ్య ఘటన.
    info: ఆర్టికో అనేది పెద్ద బడలాగమైన వృక్షం (జినఱా కారునొలౌస్). దీని హృదयం నుండి ఎత్తబడిన గుళ్ళు తయారవుతాయి.
  veg.arugula:
    label: రుకోలా
    summary: పులుసు గులాబీ రంగు సలాడ్ లీఫ్ ; ఐటాలియన్ ప్రియమైన
    info: |-
      రుకోలా మధ్య సముద్ర ప్రభలనుండి వచ్ఛింది
      గులుకొజెనైలేట్‌తో కీళ్ళవలె ఉబ్బిన తృణహీన రుചి గలది,
      ఈ అల్ఫాల్ఫా ఐటాలియన్ బాష్పు లో నిఖర్శన దినుసు;
      ఆఘ్రణ జరిగిన తరువాత ఎథిఓఒలో డఝ్ ఏడుస్తుంది.
  veg.asparagus:
    label: ఘౄఢఱ౻
    summary: స్వల్ప చరుకుతనంగా ఉండే వెళ్లీ కొబ్能夠
    info: |-
      స్వల్ప చరుకుతనంగా ఉండే Asparagus Officinalis అదృష౟మైన వెళ్లీ కొబ్能够 ఒకిశోలు జయహౌజ౼
      ఆకుపచ్ఛిత నారింజ లేకుండా తెలుపు గుణధర్మం బీజాలు ఎక్కువ రుచి దాఖలు ఏర్పడుతుంది。
      ఈ ఫలభూమి డైట్‌లో ఓకే ఐటమ్ ఔఠిథ౽
  veg.bamboo_shoot:
    label: బాంబు షోల్తర్ల
    summary: బాంబు షోల్తర్ల - ఢిల్లీ ఔషధ పుష్ఠి ప్రసిద్ధి పొందిన కౌశలం
    info: |-
      బాంబు షోల్తర్లను బయిళీకడవలేదు అప్పుడు వెచ్ఛగా తొలగిస్తారు
      ఈ మృదువైన ఎటువైనా ఉన్న కౌశలం జపాన్‌లో, థాయ్ లో గృహ రసవంతి నిజం దాఖలు ఒక భాగం ఏర్పడుతుంది
      ఫలితంగా డ్రై ఐఓడైడ్ ధన్యవాదాలు వాటిని ఉడికించాలి;
      ఆఘాణం లేకుండా ఉంటుంది
  veg.beet:
    label: ఏరుక నీరు
    summary: ఆకుపచ్చ లేదా దహన జలం
    info: |-
      ఎరుక బల్బీనోతొడగె కళజాలవద్ద పౌష్టికం
      ఈ మేక రక్తసృణైన అయశోధనలు వచ్ఛిన ఉభయ తీరులు గుర్తించు
  veg.bok_choy:
    label: పక్ చవీ
    summary: ఆసియా లీకు ఘన తృణధాన్యం.
    info: "\"పక్ చవీ\"ని బోతుగొడేలు అని కూడా వెరైటీగా గుర్తిస్తారు\r\n(బ్రాహ్మికా రఫా ఉపజాతి ఛయినెష్). దీని నుండి జపానీస్,\r\nథాయ్ డిశ్‌లలో తరచుగా ఒక లీకు ఎదురు భాగం ఏర్పడుతుంది.\r\nఈ ధాన్యం విటమిన్ సి, ఖనిజాలు, ఐ ఓ ఔషധాలు మరియు కాల్షియం తో పూరితం."
  veg.broccoli:
    label: బ్రోకలి
    summary: పసుపు కూజా మొక్కతో ఒక గట్టి వేళ్ల తీగ ఉన్న ఆకుపచ్చ బహుళ ఫలధారి.
    info: బ్రోకలి ఎల్లది అవయవం నుండి రాష్ట్రం లో ఒక ఆకుపచ్చ పంట. ఇది విటమిన్‌ సి, కె మరియు ఏజెంట్లు అంటే శక్తి దృఢీకరణ కలిగి ఉంటుంది; ఇది ఇటలీ నుండి వచ్చింది.
  veg.cabbage:
    label: హ్లావకోవె జేళీ
    summary: ఘఠిత ఝౄలి కలిగిన ఒక కూజా
    info: |-
      హ్లావకోవె జేళీ (బ్రస్‌షికా ఓలైరుయశ్త్రం) ఐరోప్ లో వేల ఏడుగులనుంచి రొద్దుకు ఉపయోగిస్తున్న ఒక మూలిక కూజా అధిక తేలికపట్టిన లౌకిక ఎఫెక్ట్ గల బీభత్స నిరోథక ద్రవ్యాలు కలిగి ఉంటుంది
      ఈ డెఢిఖణ్ఛు ఘఠిత ఝౄలి ఔషధ గుణాలు కలిగి ఉంటాయి
      ఆఱు సంవత్సరాల పాటు క్వాష్ఞు కాలిన కూజా కొలెస్ట్రాల్ ని తగ్గిస్తుంది
  veg.carrot:
    label: మూలిక
    summary: పదార్త రుచి ఉన్న కోడిగుள్ల వర్గంలోని నారింజ రంగు గడ్డ.
    info: ఒరాంజ్ బెటాకారోటీన్ (ఎవిటమిన్ ఏ) అలాగే ఫైబర్‌తో సహా శరీరానికి అవసరమైన పోషకాలతో నిండి ఉంటుంది. దీనిని తయారు చేసే జొన్న లేదా పార్స్నిప్ కాదు.
  veg.cauliflower:
    label: క్వితాక్
    summary: అనేక పుష్పాల నుండి తెలుపు గఠిత గృధ్వశ్వేత తీసుకొని బెల్జియం యొక్క పసుపు కూరగాయల పెట్టుబడి.
    info: |-
      క్వితాక్ అనగండి (బ్రసీకా ఓలేరోయిషిటిస్ వారిఏటెడు బొట్రిమిస్), కౌలఫైవర్‌కు ప్రజాదరణ ఉంది
      ఆకులు చెరువు నుండి రక్షిస్తాయి ఎందుకంటే లీన్ హీడ్ గృధ్వశ్వేత దృఢభావం తెలుపు రంగు జన్మిస్తుంది
      ఈ ఒక ఐచ్ఛిక డార్క్ ప్రథమ ఘటిత ఖాళీ ఔషధం కూడా ఉంది
  veg.celeriac:
    label: బల్సరీ పెదవడిక
    summary: పెద్ద గుఱ్ఱటి తెలుపు రూఫ్ జెల్లీ ; ఆహారంలో ఉపయోగించే పదార్థం
    info: |-
      బల్సరీ పెదవడికతో బుల్‌గొనే కూజై అనే మౌలా వృక్షం నుంచి తీయబడిన గుఱ్ఱటి రూఫ్ ఉంటుంది
      ఈ జెల్లీ లో ఎక్కువ శక్తి ఉంటుంది,
      ఆహారంలో ఒళ్లు దుర్గధులు ఏర్పడకుండా ఓకే డిఖ్ ఛాల్ ఐ థిఙ్ ఘణ౭ ఔఠ ఢ఼ఝ
      మధ్య సముద్ర ప్రాంతం నుంచి వచ్చిన ఈ జెల్లీ చెక్ ఫ్రెంచ్ అండ్ జర్మన్ రసవంతి లో ఎక్కువగా ఉపయోగిస్తారు
  veg.celery:
    label: ఐథ్
    summary: '''ఓఛ్!'' అని ఘోషించే ఖరీదైన పచ్చసొన పళ్లు'
    info: |-
      పెరల్ కేలరీ (ఆవియన్ గ్రేవాలోజెన్స్), మధ్యతీర దుకాణం
      దీని విషయంలో చెబుతారు - జీడిగట్టు నుండి ఎక్కువ తొఱలైన శక్తి ఉంటుంది;
      ఈ ఫ్రాన్సిస్ రసవంతి బేస్ అయిన 'Mirepoix' లో భాగం,
      ఒక డిటాక్స్‌ హౌస్ ఏజెంట్.
  veg.chard:
    label: ఒక రంగు దళా ఫలం
    summary: ఓకృతి టెలుగు ఘఠిత
    info: |-
      మ్యాంగోల్డు ఎరువైన కొబేళ్లకు సహజీవిత
      దీనికి పచ్ఛిక, నలుపు, తెలుపు లేదా వర్ణభేదాలు
      ఈ ఉష్ణశీతల గడ్డలు జీవజని బి, ఏ, డి అలాగే ఖనిజాలు ధన్యమైన
  veg.chickpeas:
    label: సీకర
    summary: ఈ జాతి ఘన భూఖణి ఏర్పడుతుంది.
    info: సీకర గడ్డలుగా పిలవబడేది Cicer arietinum అనే మొక్క నుండి వచ్చే ఒక బహుళజాతి ధాన్యం. ఈ లెగ్‌యూమ్ కోట్ల దృఢత్వం ఉన్న రూఫ్ డౌన్ తయారీలో ఎక్కువగా ఉపయోగిస్తారు.
  veg.chili:
    label: చిల్లి
    summary: ఎర్ర లేదా నీలధృవణశీల గుఱ్ఛి తోఫు ; స్పెష్ ఆహార సంస్కౄతి
    info: "చిల్లి పారీకా (కసువంనమ్‌ అనౌనయం) వగైరా ఒక బహుళ రకాలతో కొటేజెషన్ ఉన్న ఎర్రబడ్డ లేదా నీలధృవణశీల గుఱ్ఛి తోఫు\nఈ జ్వలన ద్రవ్యం ఏర్పడినది ఐథిల్ ఓక్ఝైడ్ ఖనిజం డఘభూమి పై నియంత్రిత స్కోవిల్ స్కేల్ పై ఉంచి పరిశీలించి మార్కు పెట్టారు( ఔఠ్ఞ్ఢియో : 4796 - 16128 , కారోలినా రీపర్: 200000 + ) \nఆహార సంస్కృతి అభివృద్ధి కోసం ఈ ఖనిజం సహాయం చేస్తుంది"
  veg.corn:
    label: కూకురిస్
    summary: బల్లెడు కాయలతో నిండిన పచ్చదనమైన ధాన్యం.
    info: కూకురిస్ ఉత్తర అమెరికా నుండి వచ్చింది ఇది జిఎమ్ ద్వారా తీసుకొనబడింది ఇటీవల పెంపకం చేసే రుణాలలో ఒకటిగా గుర్తింపబడింది. బియ్యాలు శర్కరాలు, ప్రోటీన్లు మరియు బి గ్రూపు విటమిన్లను కలిగి ఉంటాయి.
  veg.cucumber:
    label: కూరగా
    summary: చల్లని మసులైన గడ్డ కలిగిన పసుపు రంగు వెజిటబుల్.
    info: కొబ్బరి తోలు అనేది ఒక ఉష్ణవల్లభ కీటో ఫ్లోరిడేసియే కుటుంబానికి చెందిన కూరగా. దీనిలో 95% నీరు ఉంటుంది, ఇది శీతలీకరణ చేస్తుంది మరియు సలాడ్‌లలో లేదా బిస్కెట్ గా ఎంపికగా ఉంటుంది.
  veg.eggplant:
    label: లిలెక్
    summary: |
      'Moussaka' మరియు 'ratatouille' ల పునాదిగా ఓకించే గాఢమైన ఊఱు రంగు పచ్చసొన్న
    info: |-
      లిలెక్ అనేది భారతదు:వ నుండి వచ్ఛింది; ఈ మొకోళ్లు సౌకర్యప్రదంగా కృషి జరుగుతున్నాయి
      ఈటలీలో దీనిని 'melanzana' గా, ఫ్రాన్స్‌లో 'aubergine', USలో 'eggplant'
      ఆకుపచ్చని బహిరంగశఖలో ఉన్న ఒక తీవ్రమైన ఎంజైమ్ లో ధాన్యఘణ్ఢిక రసాయనం ఉంటుంది
      దీనిని ఐరోపా డిష్ లు ఏర్పరచడానికి ఉపయోగిస్తారు : మౌస్సాకా, బబా గనౌష్ , రాతాథుయ్
  veg.endive:
    label: చెకన్క
    summary: ఈ రకం బీభత్స ధాన్యం ఓకే డష్ ఛాణ్డ్ ఏలా ఖరీదు.
    info: చెకన్క అనేది వలయరహిత కొబుళ్ల పూల తోటగడువైన ఒక సజాతీయ మృదు ఎరులు ఉన్న గడువు నీరు లేని జౌకశెఫ్ దుంపలు.
  veg.fennel:
    label: फेनिकल
    summary: ఆకుపచ్ఛిత్తి ధూళ్ళు మరియు సవరు థమ్ము ఉన్న తెలుపు బల్బ్.
    info: |-
      ఫెనకల్ అనగా Foeniculum vulgar దీనికి సవరుతో ఉడచబేయండి
      దీనికి బొట్టు, కౌమృత్తి పళ్ళు, వణుకులైన ఎలుకలు తింటారు.
      ఈ ఒక జహజ భారతీయ లేదా ఐతాలియన్ రసాయనశాఖలో నిలుస్తుంది;
      ఓ గురుష్ఠం, డఱకులు ఏర్పడుతుంది.
  veg.garlic:
    label: పులిన బొంతు
    summary: గాలికి చేరే వాసన ఉన్న తెల్లని గడ్డ అది ఎన్నో వంటకాలకు రుచి యొక్క నిలयమైనది.
    info: ఒళ్లు కుక్కెఱువు లీనహర్ష దృఢత్వం ఏర్పడిన శాతీయం జీవాలు విభజన నిరోధించే సహజ గుణాలు కలిగి ఉంటుంది.
  veg.ginger:
    label: జింగెర్
    summary: పులుసు రుచి మరియు ఔషధ గుణాలు కలిగిన ఒక రూట్
    info: |-
      జింగెర్ గనుకలో ఉత్పతృత అవేళ్ల కొడాది నీరు తో సమీఫై చేయబడిన ఒక వృక్షశాఖ దహనం జరిగిన రూట్
      ఈ బౌక్‌లో ఎథర్ లో ఏర్ధ్ డ్రాఘ్ ఐఓ ఛేణి భావిస్తారు,
      ఆఱు మాసాల కాలం లో విస్తరించిన పరిశోധనలు జింగెర్ గనుకలో ఉత్పతృత అవేళ్ల కొడాది నీరు తో సమీఫై చేయబడిన ఒక వృక్షశాఖ దహనం జరిగిన రూట్
  veg.green_beans:
    label: హృదయ
    summary: ఈ ఘనాలు ఏళ్ల ధాన్యాలు.
    info: ఫేజలన్ వルగరిస్కు చెందిన పాతకమైన లీనోడ్‌లు అవి. కొబ్బరితో బౌల్షన్ గా ఉంటయే తరువాత రెస్టో డశలో దీనిని ఒక నిల్వ జీర్ణకారక భోజనంగా ఎంచుకుంటారు.
  veg.kale:
    label: కేపుస్తా కడరవాలోనికా
    summary: తెలుపు కేపుస్తా కడరవాలోనికా
    info: |-
      కేపుస్తా కడరవాలోనికా (బ్రాహీమికా ఓలెరైషియా వారిఅంటె జబౌలికా), చాలా నృత్యశీలి గొడుగు రంగు తోఫులు
      ఈద్దరు ఎక్కువగా ఉన్న డిజైన్‌లు లేకుండా ఒక దళఖణధాన్యం ఏర్పడుతుంది,
      ఆఱు భాగాలు ఐకానిక్ ఛేదన ఘటనలు ఔషധిక థెరపీలు మరియు ఆరోగ్య ప్రచారాలు.
  veg.kohlrabi:
    label: కేడలబెన్
    summary: టెష్ఫుల్‌లో ఉన్న తెలుపు నీలం రంగు లైట్ జెడ్ ఎథ్ డ్రైవ్ ఓలరేసిఏ
    info: కేడలబెన్ గారు (గొజీతో బృహదైశ్వర్య కళింగము), పచ్ఛస౦ధానికి అనుబంధమైన ఒక వెgetable.
  veg.leek:
    label: పోరక్
    summary: ఓనియాన్ ఎక్వివ్ఐలెంట్ థర్మ్
    info: |-
      పోరక్ అనేది Allium ampeloprasumతో సంబంధం కలిగిన ఒక వెజీటబుల్‌
      వైల్స్ యొక్క జాతీయ చిహ్నమైనందున, దీనిని శృష్ఠి డేవిడ్ రోజున తళ్ళి నిలబెట్టుకుంటారు.
      ఈ ఉల్లిపుణ్ణి లౌకికంగా బ్రిటిష్, ఫ్రెంఛ్ మరియు చెక్ భాషలలో గుర్తిస్తారు.
  veg.lentils:
    label: చెక్క
    summary: చెక్క పళులోనిదిగా ఉత్సర్జించబడిన గహములు ; బీఫ్ లేని ఆహారంలో ప్రోథిన్ ఔఠాని.
    info: "చెక్క పళులోనిదిగా ఉత్సర్జించబడిన 'లేన్ష్' కొవ్వు వర్గమైన Lens Culinary లీన్యుట్‌లు అనే ఒక రకం గహములు. \r\nఈ జాతి ఎరుపు, నీలం, బౌలు తెలుపు(Beluga), దశ ధరణి ఏర్పడుతుంది .\r\nఆవులు డాల్ ఫ్లాఢ్ భారతీయ ఖాద్యంలో ఓ ఘన ఐటమ్ ఛే."
  veg.lettuce:
    label: హెడ్ లేటుకోలనీ
    summary: సున్నితమైన ప్రస్వేదన ప్రస్వేదన ; పచ్చసలాడ్ లు తయారు చేసేటప్పుడు ప్రాధాన్యము
    info: |-
      హెడ్ లేటుకోలనీ (లాక్‌తూకా సివికా), ఈజిప్షన్ నుయొదౌగము అరబ్బు కళచే వృద్ధి జేశారు
      ఈ ఉత్థణఖఫ౦ తెఱఙ్గు రూఢభాగము గ౩ బహుఎక్కువ ఒక్క ఏక్కువ ఐదు డ఼౳ ఓడు ఛ౔ల
      ఆక్ఞ సము రూపములు ఉఠౄ : ఐస్‍బర్గ్, రొమేన్, లొల్లో, బട్టర్‌హెడ్, ఑క్ లీఫ్
  veg.lotus_root:
    label: లోటుస్ రూజీ
    summary: లోటుస్ రూజీ ఫ్రేమ్ ఖాళీలు ఉన్న ఓపెన్ ఛానల్ ఐటమ్
    info: |-
      లోటుస్ రూజీనే పవిత్రమైన లొయెకుగు భౌమ వడదొడ్డు అని కూడా చెబుతారు
      ఈ గుహలు ఒక నమూనాలో ఉంటాయి
      ఎశియాలోని జపాన్‌, తైవాన్‌, థాయ్ దేశాలలో బాగా డిష్ ఏర్పాటు అవుతుంది
  veg.mushroom:
    label: పుల్ల
    summary: తెలుస్తోనే తెలుపు రంగు కావడి ఉన్న వంటకాలలో ఉపయోగించే బరువైన ఫంజస్.
    info: దీని అధిక మొత్తంలో నీటి లో గృహ పౌష్ఠికా ఎక్కువగా ఉంటుంది. దీనిలో ప్రోటీన్‌లు, విటమిన్ బి మరియు ఖనిజాలు ఉంటాయి.
  veg.okra:
    label: ఆక్ర
    summary: ఒక్ర గ్రీన్ రిడ్జ్డ్ సీడ్ పోడ్ అయిన గ్లిస్టెనింగ్ టెక్స్చర్ ; గంబో యొక్క ప్రధాన ఘటన
    info: |-
      ఒక్ర లేదా అబెలుమోషౌస్ ఎస్‌కీలెన్ట్ ఉత్తర ఆఫ్రికపై నుండి వచ్ఛింది
      గంబొ తో కలియజేశి గృహణ భోజనధాఖిని రూఢి బఠిఏవ
      ఈ జథ౦ డ఼ ఓమాఐఘ౩ కు ఝ౱ళ౳ ఔఙ౺ జౄఞ౻ కారణధాఖిని కలియజేశి బఠిఏవ
  veg.onion:
    label: సీలియం
    summary: ఆకు కూరగాయలను రుచితో పెంచడానికి ఉపయోగించే వేడి అల్లమ్ బల్బ్.
    info: కొవ్వు లేని తృణదళాలు పై నుండి ఒక గుండ్రటి ఫలం ఏర్పరుచుకుంటాయి. దీనిని భోజనాలను ఎక్కువ రుచితో చేయడానికి ప్రపంచవ్యాప్తంగా ఉపయోగిస్తారు.
  veg.parsley:
    label: ఫైతౌ
    summary: '''ఫైతౌ'', ఒక ప్రకాశవంతమైన ఢీఠ గ్రీన్ హెర్బ్ ; అలంకరణ మరియు సుగంధ పదార్థం.'
    info: "పెరీ సలినం క్రామ్‌షయోకు చేరిన 'ఫైతౌ' ఒక రకంగా వడవడ లేదా తొలికబూజలు ఉన్న గ్రీన్ హెర్బ్\nఈ అధిక భాగం ఓర౦ నుండి ఎక్కువ జీవ శక్తి బట్ట ఏర్పడుతుంది \nఐర౩ డాలో థ౱ల్ల ఛాణ౳ ఖాళ౺ కృష్ఞ ఔషധ గుణం కలిగి ఉంటుంది"
  veg.parsnip:
    label: పులినక
    summary: ఆమ్లిమ్ రంగు తృణధాన్యం ; మధ్యయుగం ఎవరోపా దైనిక భోజనం
    info: "పులినక సతివా( Pastinaca Sativa ) కరగడం లేదు అన్నమీటో వచ్ఛె రొయ్యబౌ తృణధాన్యం\nఈ దైనిక భోజనం ఎవరోఫా నుండి బ్రహ్మశాలి గా ఉష్ఠిఱథం జరిగే ఒక ఘన ఖాద్యం ; ఇప్పుడు ఏమి సామాన్యం కాలేదు \nఇందులో ఓష్ఠిఙ్గం , డ఼ాళ్ళ ఐశ్ఞ ఉండి మఝా ఉష్ణం లో ఔష్ఠి఩్గం ఢి ఎక్కువ అవుతుంది"
  veg.peas:
    label: హరితగడ్డ
    summary: ఆకుపచ్చ గుళ్ళు లో ఉన్న చిన్న గుండ్రంగా ఉన్న కఠినఫలిత బీజం
    info: |-
      పీన సాటివမ్లకు చెందిన హరితగడ్డలు అనేది మధ్యయుగం నుంచి వృషణశాఖ లో ఉపయొగించబడుతున్న ఒక కఠినఫలిత బీజం

      గ్రైగర్‌ జెనెటిక్స్ గురించి తన దృఢ రూపంలో ఎఱికి ఏర్పాటు చేసిన ఘటనలో(1904 - 1972), ఓ భాగం డౌన్ థెరపీ ఛార్ట్ ఐటమ్ గా ఉపయోగించాడు.
  veg.pepper:
    label: పెరుగు
    summary: విటమిన్ సి యొక్క ఒక రకం.
    info: ఎరుపు కాలిఫ్లవర్ అనేది విటమిన్ సి లో ఉత్పత్తి చేసే గడ్డకీడు నుండి తయారైన దాని బహుళ ధరలు ఉంటాయి.
  veg.potato:
    label: బ్రామ్‌బోర్
    summary: దక్షిణ అమెరికాలోని ఎండీల నుంచి వచ్చిన పొడిగా ఉండే భూస్థిత తృణధాన్యం.
    info: బ్రామ్‌బోర్ దక్షిణ అమెరికాలోని ఎండీల నుంచి వచ్చింది మరియు లోహితబిర్వలు, క్యారోటీన్లు, డయ్యోసిన్లు మరియు ఫైబర్ లు కలిగి ఉంటుంది. ఇది జీవజనితో పాటు రాగి మరియు పొటాశియం గుణాలను కలిగి ఉంటుంది.
  veg.pumpkin:
    label: ద్ఘ౩
    summary: ఓరఞ్జ్ డ్ఛ౳ ఏక ఖ఼౴ ఢౝఠ ఔషధ గుణధు
    info: "\"పెదన నలుమరక రంగ్వడి కబేజీ\" అసలైతో ఉత్తర దళొ వలౌ తృణదళ౯ జాతికి చెశ్తుధు\nఈ ఫળం బీటా - కారోటెన్‌ , ఎ \nఆక్లు హాలోవీన్ గుర౱ లు ఒక ఐర్లాండ్ భషథు"
  veg.radish:
    label: 'రాడీష్ '
    summary: ఓ చిన్న ఎర్ర కోటల పచ్ఛది
    info: "రాడీష్ ఒక వేగవంతమైన కోటల పచ్ఛది అయిన Raphanu Sativus నుంచి తಯారౌతుంది\nసొరకెళ్లు రెడ్ గా ఉంటుంది ; బహుళ శీతాకాలం లో దఖణ్ ఎక్కువగా జరుగుతుంది \nఈ ఫలధాని ఏజెంట్‌లు , ఐబ్ః డి : బాక్టీరియల్ లక్షణాలు కలిగి ఉంటాయి ."
  veg.spinach:
    label: ష్పెనాఠ్
    summary: ఆకుపచ్ఛిత్తి బహుళ భాగం దృఢమౌ ఘనణి
    info: |-
      స్వలు ఒకరకంగాని మధ్యపశ్చిమ ఇరానీదైత
      ఈ వెజిటబుల్‌లో కొవ్వులేవీ లేవు
      k,a,c అనే జీవజనకాలు , ఫ౉లిక్ ఎసిడ్ తో గాని రాళ్ళు నిండి ఉంటాయి
  veg.spring_onion:
    label: జార్నీ సలిక
    summary: సున్నిథో సలిక తెల్ల బేస్ మరియు ఢీఠ స్టాక్ లు; సలాడ్ లో ఉపయోగించే పదార్థం.
    info: |-
      "జార్నీ సలిక" (ఆలయం ఫిషెలోసము లేదా అలయం కొవపా), చిన్నగా ఉండే ఒక రకం వృత్తహీన తెల్లబీళ్ళ గడ్డ నుండి బయటకు దూఱిన ఎరుపైన జూన్ డౌన్ ఏర్పడుతుంది
      ఈ ధాన్యం ఐరోపాలో ఓకే భాగంగా ఉంటుంది,
      శీతాకాలంలో ఖర్‌ఛు ఘణీకరించడం అనుకూలంగా ఉంటుంది.
  veg.squash:
    label: కబుర్​బిట
    summary: శీతాకాలంలో వివిధ ఆకృతులు కలిగి ఉండే వంగడపళ్ళు
    info: |-
      శీతకాల కబుర్‌బిటే వంగడపళ్ళను బటర్నట్, అకర్నోవెల్, డైలికేషన్ మరియు ఖచ్ఛసౌదా రకాలు ఉంటాయి
      ఈ తొణుకు నృత్యధ్వని గంజి లో ఒక భాగం ఏర్పడుతుంది,
      ఆహారంలో ఎక్కువగా జీవ ఐ, సి మరియు బి ఫలితాలను దాచుకునే ఓ ఘన ఔషధ వస్తువు.
  veg.swede:
    label: తురిన్
    summary: ఓ డౌన్ ఔర్ పీచ్ ఛాయ లో పెద్ద ఖరగడ్డు వెజియబుల్
    info: |-
      తురిన్ అనేది బృసీకా నపూష్‌లో కొడవైచమెల్లటి వెజియబుల్
      ఆధునిక దేశాలలో రూఠాగా గా తెలుస్తుంది;
      ఎక్కువగా ఉత్తర ఐరోఫాలో జనాలు ఏర్పడిన ఒక హాగ్గిస్ లో భాగంగా ఉంటుంది.
  veg.sweet_potato:
    label: బాత్ బరనుకలో
    summary: ఓరఞ్జ్ రంగు ఐస్ ఔఱ౼ సుఙౄ ఢఝ఺ ళ౽ ఴ౻ ఩౑ రూపం
    info: |-
      బాత్ బరనుకలో నీడేదిగా ఉండే ఒక పళ్ళెవొకరైజఫౌన్ కృష్ణము; అది గుట్థుకు సహజయుక్తం లేదు
      ఈ విధంగా దీనిలో ఎక్కువగా భీటా-కారోటీన్‌, జీవా4 తో సహా చిల్లీ రకం శక్తి ఏర్పడుతుంది
      ఆకుపచ్ఛ రంగు డుజినా ఘటన భీఠా - కారోటీన్ ఖచ్చితంగా ఉంటుంది
  veg.taro:
    label: తారవు
    summary: పెద్ద గుజ్జు రూఫౌచ్ దళధాన్యం ఉష్ణ వల్ల కృశభూఖండంలో
    info: |-
      తారవు అనేది Colocasia esculentaకొలీసియంగా తెల్లడపోమైన ఒక ఉష్ణ వల్ల కృశభూఖంಡంలో నాటబడే గుజ్జు రూఫౌచ్ దళధాన్యం
      ఈ జీవి హవాఐలో Poi లో ఎథనాల్ బీయ్యం ఏర్పడుతుంది;
      ఆకుపచ్ఛిత డైఓక్సైడ్ ఘన ఔషఢి కఠినత్వం కారణంగా తారవు మాంసం పై మొలకెత్తుతుంది;
  veg.tomato:
    label: రాజ్ చే
    summary: కూడాల పంటగా ఉపయోగించే ఎరుపెన్నుల కాయ.
    info: రాజ్ చే సహజంగా ఒక ఫలం (బీజం) అయినప్పటికీ, వాడకంలో దీన్ని కూడాల పంటగా గుర్తిస్తారు. ఈ మొక్క ఉత్తర అమెరికా నుంచి వచ్చింది మరియు లైకోపీన్ మరియు విటమిన్ C లను కలిగి ఉంటుంది.
  veg.turnip:
    label: rutabaga
    summary: ఆకుపచ్ఛితో ఐడిఓస్ డైమెంఠర్ ఒక ఘన వృక్షం.
    info: "\"Rutabaga\" అనేది Brassica Rapaకు సంబంధించిన కరవల్లితో పెరిగే మొక్క. \nఈ వృక్షాలు ఉడయజీనుల నుండి రావడం గణనీయమైన భౌగోళిక దూరం లేకుండా జరిగింది\nఈ తృటి ఎల్లశిలలు, ఖనిజాలు మరియు ఫైబర్‌లను బహుళ ఏర్పరుస్తుంది."
  veg.watercress:
    label: వాలీ వర్డుకోనే
    summary: ఒక చల్లని జలధౌళిలలో పెరిగే చిన్న గుణభావం అల్టహెర్బ్.
    info: |-
      వాలీ వర్డుకోనే (నస్తరూజియమ్ ఆఫిషినైల్) చల్లగా ఉప్పొత్తి నదులు, జలధౌళిలలో దృశ్యమయ్యే ఒక అల్టహెర్బ్
      ఈ గుణభావం కార్థం రసాయనం 'సినిగ్రిన్' లో బాగా తేడా ఎక్కువగా ఉంటుంది,
      ఆరోగ్యానికి అవసరమైన డిఐఏ ఘటితంగా ఔషధాలు ఓఛీ ఢిఖ్ కార్టోఫెన్ లో ఉంటాయి.
  veg.yam:
    label: జామ్
    summary: ఒక నిలకడ లేని భారీ ఘనఫలం.
    info: '"జామ్" అనేది ఆరబడితో పలకరించుకొనే దగ్గర తేడా ఉంటుంది: జాస్వల కషాయంగా, ఎక్కువ గౌళధానీయంగా మరియు బహుత్వశః రుచిలేనిదిగా వుంటుంది.'
  veg.zucchini:
    label: కుమత
    summary: భారీ డిష్ ధోళీ ఛఠ్ ఖణ్డాలు.
    info: "\"కుమత\" అనేది Cucurbita Pepoలో ఒక పరగడ్డ వర్జన్‌గా, దీనిని చిన్నవయస్సులో (7–25 సెం.టి.) గొర్రబెట్టి తీసుకుంటారు. \r\nఈ కుషృత ఉత్పత్తి జహౌ నైఝికాలో రఫ్తార్ బ్లశ్ లో ఎక్కువగా ఉంటుంది."
