lang: ga
pivot: false
title: Veaghlacáin
cards:
  veg.artichoke:
    label: artógóir
    summary: Pleanma mór uaine mar táirseoil; déanann siad údhar amhanta.
    info: Táisceach agus ghealtas cinniúnta iad an artógóir seo ar fhadhbhodálta. Tá sé deacair ach is féidir léim túsnaíocht nó bascaireacha lárnaithe den phléth. Is éard atá sa dreacht go bhfuil eadhacht airgeadais ann don rialtas.
  veg.arugula:
    label: Rocket
    summary: Griallmhór donn is ea Rocket - láithreanna slada déanta sa tionscnamh Italie.
    info: Tábhachtar Rúcola (Eruca vesicaria subspecies sativa), agus tá sí ar an taobh thiar den Eorpa Móraighiúnachta nó i dtuaismithe éigin de shuíse Éireannacha mar 'rocket'. Tá ghlucosinolate ann don chuaideas páirte achmuid dá bhféadfar fhuilín go léir.
  veg.asparagus:
    label: aspaid
    summary: Vonúint breascaille déaghasca
    info: Tábhachtar ar Asparágus offcínéalais agus tá sé mar sin i gceann de na heilímheanna is móireacha sa bhreasgabhail. Tá an t-aspaig éadair nach mblianta faoin grísín nótaíonn go dtí 85% d'fheartheoirí eileacónta ach cailltear siúd trí thabhairtí orthu san áit céimhreach. D’fhoghlaim méadaíocht fhrangalach amach ón Éirinn nuair ba mhaith leo ceapadh airgeadas don pharlament.
  veg.bamboo_shoot:
    label: vábhus
    summary: Vabhoisean mhórta ar cos maith.
    info: Táirgíní bhámhuis éadaoibh íseal atá ag teacht amach ó phléas Bambusoideaean tar éis an tsiúdadh. Tá siopráth ann i gCineamhais Thaidheacha agus Japán. Is féidir léi cyanidium a chur san fhear ceart go dtí nach caitear ortha sna gruaifeanna nó tá sé sa ghriannearc.
  veg.beet:
    label: fuillghear
    summary: Fuilleacht ó thuras mhorán dá bhfeart
    info: Is é an beataínin atá ann san fhuilgheannachta agus is pigmaint gorm nascóntais eile ar bith. Tá sé go hálainnte airgeadúl don phortfórthas agus d'fhonnadh sluaide uisce dearcantaigh.
  veg.bok_choy:
    label: pac cois
    summary: Zúntas Áiseach bhfuil siopóg dála farraige agus lárnaithe dubha.
    info: Tábhacht ar pak choi/bok chói (Braissice rapa subsp. chinaise), is é seo áiteach ó an tSín agus tá sé i gceann de shuimeanta uaine beaga móireacha Sineacha, Japánacha agus Thailiséacha. Is féidir léith linne eolaismhara mar fhear ceartseoilte, cáithealim, vitamin C agus A air. Tacaím go rialta sa phríomhthómar nó imtheascadh san amhlaid.
  veg.broccoli:
    label: brolcaireach
    summary: Brollaith shléite ar chluas fada.
    info: Tábhachtar gorm Broccoli thugann sí abhóide agus eileantair sléite don choimhréalta seo ó Íoras
  veg.cabbage:
    label: saucrkraut
    summary: Ceapaireacht tírthe cothromúla.
    info: Tábla ghearradh thallach is ea an hláhkóta nó Brassica oleraceae atá á fágaint ag litheacha láidre ar feadh míle bliain i dEorp. Tá sé go hálaithe mar tábla ceapairte ach muididear é chun sauerkraut nach bhfuilimidís ann acu freisin.
  veg.carrot:
    label: Carabát
    summary: Zúidín ón tsiúcra.
    info: Tábhacht ar an gcarbaithe don phróiseas agus é féadaíochta airgeadh nua nó gránna eile mar sinsearcailteach.
  veg.cauliflower:
    label: tábhachtán
    summary: Gníomhnasfhloinngeadh gormmhar atá de réir gruaigeanna tábhairnéar.
    info: Tábhachtán is ea an Brassicaoleraceabotritis agus tá sé mar chuí don bhrócoli. Tógfear na spéirínne ó thomhas go dtús nuair nach bhfuil siad láithreach ar sonailte nó má théann sínteachta ortha. Is féidirimharcúlach é sa dúnaithe gan léimse.
  veg.celeriac:
    label: ciler bulbtha
    summary: Ghearaltán géagach gealbhra ceoil cailéara
    info: Ciler bulba Achair (Aphium gravioldens var. raphaciusm), is é sin an tóras atá páirtithe don choirín i gcónaímhe mar ghealachta nó 'celer' agus tá sé thar thrúth na heilimhthe. Tá scéal eile ar fhrithinseartacht céili reatha ac hainm seo.
  veg.celery:
    label: Celear
    summary: Griobhadh grís crannmar atá fada go dtí 'Apeam Graveolen'
    info: 'Tábhachtas an rúnta ó na Mharaideachta agus tá sé mar shocra de thríoch frithilfe Threanmharsheacha: miripós (pónán, stuaicín, celear). Tá siúcrag céadair saoilte san áit seo iomlaithe.'
  veg.chard:
    label: túbhar
    summary: Ghlón túscaire mór léargas atá ceart faoi láthair.
    info: Tábhachtach mangoldtúisce (Beta vulgarís subsp. Ciclá), is é seo ghróinín eile don réacaird rúnaithe. Tá sé agus cábhanacha glas, dearg, buillte nó spioradta. Is féidir liom fiosrú ar thiampanaíochtanna mar Thiampanán U, A agus C freisin go dtorchaímsear i bhforainmhéalanta.
  veg.chickpeas:
    label: taccruinn
    summary: Luastean beanige is ea an ticcrún; úsátfar í i gcomharthaí cumaicse agus falafil.
    info: Táisceann Cícir ar áitínium é an cicrún nó 'chickpea' agus tá sé thar teaghlach i dtuaisceart na Breataine agus Indúneacha mar chuma de phrotein plandaíochta. Tá sgródhanna beaga óthalaigh ann go minic sa bhuileas agus san fhalafil - dá taobhta dhubhróidheanta atá déanta den tacair seo. Mar sin féin ní hamh mhaith don tacaiciocht céimis ach freisin do dhaoine eacnamaíonna nach bhfuil siad faighte airgeadais.
  veg.chili:
    label: táibhead
    summary: Fasain rónrúnach nó lábhairthe atá bunús den tíorthuíocht.
    info: Tábhachtóir páilteach agus eileacánúnta i bhfásanna réada nó glasa (capsicum annuum). Tugann an capsacin isteach sa táithín go dtarlaíonn sé sinneadh ar ghearrthoireanta mar thimpeallta na jalapeno is 7964-8000 SHU agus timpeallta Carolina Reaper níos mó ná dha phointe millión SHU. Is féidir léi fós éisteacht don chuid mhór de shavaitheacha ach nach caillfidh siad sémintear.
  veg.corn:
    label: '"Ceapa"'
    summary: '"Spéirín gorma nó buillteach atá fágtha go dtí nach féidir é a chur isteach sa gruaig."'
    info: '{"info":"Tá spéirín ghearr is ea an ceapairthiúil agus tá sé thiar ó Mhéeaine Aimeireaca agus níl ann ach amhlaidh ar bith i ndiaidh sin. Tá saccharaithe, beanmhainneacha agus vitaminanna den chatagóra B san."'
  veg.cucumber:
    label: ghearán
    summary: Geárásan gruaideach atá tábhachtach don phortfhéidil céileacair thar thríocha de shuíochais ar sonas agus éifeacht airgeadach d'fhorbairt áitiúla.
    info: '{"hint":"cúpa beag uaine cilindrisceach (Cucumis Sativus)","info":"Tá an cúcuma saoirea ag teacht ón tírtheocht i mbunacht na tóirínneacha. Tá sé fós go minic mar ghearradh nó mar scéalta ceoil","label":"cúcuma","summary":"Ghearán gruaigeach is ea cúca."}'
  veg.eggplant:
    label: Eggplant
    summary: Fuíneadh dearg-fhiolaite ovalta nó méideanna na tíre thiar
    info: B'fhábhar é Lileacan (Solanum melongena), agus tá sé ó Indias san áit is féidir go ndeachas iadtúsa nighthe blianta ar maidhm seo. In Iótálacha cailltear air mar 'melanzane', sa Frainc mar 'aubergines,' agus sna Stát Aontaithe mar ‘eggplants.’ Tá eisinín ann - antioxantán maith atá síoraí den chuma don fhada.
  veg.endive:
    label: Ċeccank
    summary: Zúlacht bán léine cóirte; údar shalat.
    info: Tábla anuasach agus éascaint is ea ċeacankanna i gceann de na háitbheatha ar thugtar 'Ceacank' duit féin nó Ceacank Endívie). Tá scian beag ortha nuair atá siúd á fágaint gan rialtas don gréargóra (ċhíciora), nó go dtí nach bhfuil sé amuc do láthar (wittoloff ). Is eascadh óna ceartacha ac taithimh intybínaiteachta tá scarbhocht airge dá bhrath, mar sin caillfidh tú í seo trí bliantisciad.
  veg.fennel:
    label: fénycl
    summary: Moimhín bán gruaigeach is ea féncly.
    info: Tá moimheannaí Fénycl (Foenuculum vulgaris), mar atá sé ar siúl agus cóir go dtarlaonn é san Eoraip Mhanannach seo tá ábhar bhuaine ann don tsearcadh thíos.
  veg.garlic:
    label: '"Ceap"'
    summary: '"Bulbín géarfhaidhbhearta nóitheadh is fé nasc go háirithe d''fhorradh tábla"'
    info: '{"hint":"bulbín ghearraidh bán puingeanta atuigthe mar tharbhthraitheoir","info":"Tá ceap airde ag baint úsáid as an mbuíochas don phortóireacht agus do shárú ar feadh míle bliain. Tá sé seo ábalach de bharr allilcinn dáta é cóirteannaibhéantais agus eolaithe na bpriocraim."}'
  veg.ginger:
    label: Gearn
    summary: Rootha knobbleadha beige mar spásialt.
    info: Tóghear an géaracanna ó rúntaín agus tá sé thiarlaite i dTuaisceart Áise Tropachail. Bhfuil ghearghol ann is é sin atá ar feadh na taitneamh agus nascóireacht orthruthaireacha.
  veg.green_beans:
    label: bean
    summary: Bean dluaith is ea é.
    info: Tá moillín faoiltear na húscaí beo agus tá siad san ábhar seo freisin mar 'beans', 'string beans' nó 'bobbiy beans'. Tá vitamin C, K agus fola acu. Is féidir blanchoinnt iadsa agus reastúndhacanna lena mbuíochtar amandla don ghearrthóireacht thaiscéala.
  veg.kale:
    label: capstua
    summary: Ghearraitheas grís-tomaise ceartúil go mór.
    info: Is é an kapustu cáidiréadach de ghearrthaiscín don teaghlac Brassicaceae agus tá sé thar thríocht ar phointeanna spóirt i dtreo slándála agus tionscalta.
  veg.kohlrabi:
    label: kedlúb
    summary: Bulba beag bhuineoilta teoranta lena hást
    info: Tábla an kedlubainneacha is é Brassica oleracea agus tá sé san fhrúintheacht céanna mar shuíleacán nó brócsóg. Téann tús ar an mbulba nach léirtear ach go minic sa gruaifeachas agus bíonn siad á thabhairt amach ón stoirmhearc. Is íochtair mhaith féidearthaithe atá ann don taobh istigh de phointeanna údara.
  veg.leek:
    label: tábhacht póirceach
    summary: Zingaróg mór atá bainteach den chlárthóireacht.
    info: Tábhacht póirceach is í an Allium ampelopraseum agus tá sé i gcomhábhairt lena thabhartas cinnín agus úllán. Is é seo símbial poilithechta Waleannacha mar sin go mbainfear airgeadh orthu ar Luan Siofra Daithi. Tá alacine acsin agus vitaminanna C agus K ann.
  veg.lentils:
    label: Masliún
    summary: Pleanóg creidimh breise atá socruta do bhith san árdaíocht gan mhaoin.
    info: Tá maslinín (lensí cinerásachta), is é sin amharc ar an tseachtain fada i dtreo na bpianóige seo tá sé páirt den chuid is sine de thaiscintheacha agus í féin déanta go léir mar ghrúpa sa phríomhbhuiltheara ó thaobh an tsaoille don triongóireacht.
  veg.lettuce:
    label: Salat Hlavate
    summary: Zélénin líofthra; úsáltar e chun saillteacha a chruthú.
    info: Tábla sálaidhne thalltachtaigh agus Lactuca Sativa i gceannas na saileantair láithre is ea hlávka saláideacha nó 'iceberg lettuce'. Tá sé seo á fágadh ó thuath dá bhfuil an tseachtar Éigipteach ann féin mar sin téann siúd go dtí ar son ceimicthe. Is éard atá airgeadbhuí san taobh amhantaibh de shéimeartha thíos - tá síonn roinniúnaithe don phointín céanna ach má táimid cinnte nach mb'éadaiteamar caolóige, beoideal íochtreacha agus sluaisteán bhrónach.
  veg.lotus_root:
    label: tábhairgín
    summary: Croitheadh tabhairge lena gcomharthai beaga ar coscaipthe go léir; díchulteasa Asiatach.
    info: Tábhachtán an lóistínithe (Nelumbo nucifera), is é sin an t-oirdheasúnta fósaithe de phríosan na héadaisine agus tá sé thar thrascuilteacha i gcónaidh Asia.
  veg.mushroom:
    label: péiste
    summary: Péiste bledúin-buíthe atá páirt de phortain.
    info: Tá ghearrach agus beannchorra í an bpéiste dhuibhreagóir ar fad i dtuaisceart Éire anna bhfuil sé caite amuigh ó thurasanna mar shampla an péistín nó Agaricus bisporus.
  veg.okra:
    label: tálba
    summary: Lúsca geal linneacha go hargantaisce; tá scian arna dtabhairtéar sa ghumb.
    info: Tábla Okra (Aibéal-moscos esculentas), i ngacharbhachtúl ag dul ó Thiribeartóireacht Afraga. Is é sin an bheith thiar don fhrithidh Gumbo san Americe; is féideagacha í seanscara thíreachta ombhasa. Tugann sé cluaisíní trí shláineadh.
  veg.onion:
    label: tábhacht
    summary: Veaghnal pionónta de thábhairgín do choimeád.
    info: Tábhachtar Céadach is é an t-aisteach ceapaithe nua amhrothúil ar fud an domhain. D'úsaidtear e chun bhratanna agus diaidheacha i gceimnigthe orthu san oiread don phortfhocal go dtí an méadais.
  veg.parsley:
    label: péist
    summary: Fiontarbhuilline grásaile; tríthín is fearradhbhrat.
    info: Tábla fritheann sé mar thar éigin agus mar thréithín. Tá siúcra nua sa tábhairgeónta acu níos mó vitamin C ná an ceollacairtúil tar éis timhéadaithe. Is féidir léi gur scéalta nó cruinntheacha, ach tá sliocht mhórthaide ar shuíftheadh phlanach.
  veg.parsnip:
    label: pástainác
    summary: Tógál grís-bán cothromaithe; ceann den choitin básra Eorpacha.
    info: Pastaíníc (Pastinaca Sativa), nó páisteanac saoilteachta, is í an t-aithríocht de phóscaire agus tá sé i gcoincheapadh lena mbriathar mhór thart ar thríd na hEorpóid roimh chuaigheas an bpóndar; nuair atá fágtha é mar sin féin go minic inniu má bhfuil eolas orthu. Tá scéal déanta acu nach léirfidh siúd ach tar éis d'fhios amhlaidh.
  veg.peas:
    label: grás
    summary: Grásaí beaga glasa in ainmneacha
    info: Táimheann an grúas páisteach Pisum Sativum ó thús na daoine ag breithniú air mar phóscaín i gcearcadh deireanachta faoin áit is féidir léi éilistiúint sa chlár thírthe (Mendele). Tá sé sin ar fódhais san fhómhar don tsealbhóra mora nó 'morve' nuair atá siar amhlaidh go láthnaigh, níos mhuinneacha céanna.
  veg.pepper:
    label: péacaircí
    summary: Moilin bharraite breise léasúch dá bhfuil lán eolais.
    info: Tá moileach is féidir go mbeadh sé láithne nó bréagónta agus tá an t-amhthainn nua-fhearchalla ceart ar fódhair na bpianacaílta de thionscadal gaoithe. Tógann péacaircín cróna amhthainn mhór den choimhintheacht C idirmhéar.
  veg.potato:
    label: Ghear
    summary: Is féidir léi nascadh lena húsáid san áireamartha thall um an saol.
    info: Tá gheobhrán agus tá fósailte i ndiaidh Solanum tubersom ar an tseasgadh go bhfuil sé mar fhódhar amhlaidh don domhan ó na Anndúis. Is é sin surscróth síoraíochta nóiméideach is ea cácaín, céileacra C agus potasa.
  veg.pumpkin:
    label: díon
    summary: Bogán orenge mhór go hiontach; símbaal don Mhalortean agus do ghrásna.
    info: Túisceann an dáinín ó Thóirmeacha agus tá sé bogach ar bétacárótéan nó vitaminanna A is C airgidheanta ann fós féin. Tógfear sliotair Halloween mar 'Jack O'Lantern' sa Ghaeltacht i Éire nuair atá túscéalta den tír seo san amharc sin.
  veg.radish:
    label: ráphánas
    summary: Vegetal caoil rédirthe dá bhfuil searcadh airgeadaire.
    info: Taispeántar ráphánas ar fhadhbóidhe Raphanussativis agus is é sin údarásach caorlaithe go tapa. Is ea an t-airdeantínéir beag dearg agus tá sé mór ghearraidh thart um daimón na hIaponesia nó 'daikon'. Tá siúicéalacha glucosinolate ann atá áthraithe i gcábhairne.
  veg.spinach:
    label: spianact
    summary: Zilleanas lárnach dubha is féadra achta éada
    info: Bhfaighfear an spianacht sa Mhearsna thar linn an míleata agus tá sé go hálaithe ar vitaminanna mar shampla U, FÁITRÍOCHTA AGUS EAGAR ÉADRAIACHA CHOMH MAR SHÉIMFHEARAIDILTEANNA. D'fhág Popeye (mar sinneadhóir i gcomics), ó thaobh na dáithiú teoranta don phoistín de réim seo maidin.
  veg.spring_onion:
    label: isín gearradha
    summary: Is ísin ceapaithheach atá córas bán agus grúpaí uaine ann.
    info: Tá isín ceapaithheacha agus níos faide na ceapadóirthe eile mar sin é an t-isín ghearraidh nó 'spring onions'. Tá sé déanta de thónntanas bán agus gruaifeasa uaine. Is féidir fágainte go dtuigeann sí siar ón gcuma ar feadh bliana.
  veg.squash:
    label: taca
    summary: Greachóg geimhithe róthromántha.
    info: Tayríocht an Gheimhidh (cucurbita), mar shampla butternut agus tacaiteacairdínacha eile, tá siúlachta ar shuírgeadh crua nach féin léi go dtarlaonn géarcheimheas i gcomhracht don chuid is mó den ghimeár. Is é sin teagasc thiaranta d'vitamin A,C,B.
  veg.swede:
    label: túrán
    summary: Féarchlár mór go dtí buillthoille; cumarsóg scoltxi
    info: |-
      Túrún (Bhrásna nápús) is crosóidheas de shuíse agus réipeadh
      I rithimh sé mar 'rutabaga' sa Mharcan; i Scoltain é an t-aonar nach féadaíonn tú bheadal air gan guthaíocht ar an hagais
      cuirteann duit chuaideach nó coirneálta trí lánaithe
  veg.sweet_potato:
    label: Batab
    summary: Hlíse ganntana ar scagtha go minic sa tionscnamh thuaidhm.
    info: Tábhachtán Ipomoia Batatás atá ag teacht ó Éimearc Thuaitheachta nó mar sin é; nach bhfuil sé i gcoinne don fhuinnimh thallóra.
  veg.taro:
    label: taró
    summary: Hlísa mór go léir gruaigeach bhuíthineach; solaiseal beag trópa.
    info: Taró (Clocásia escúlanta) is trópac an t-aistear atá i gcoinne deileas ar feadh míle bliain agus tá sé mar sholaisheal beaga na Pólainsínithe, Africe agus Áise; tá an poitin Hawai’i fé tharó farantánaithe.
  veg.tomato:
    label: Tomát
    summary: Plód dárbhuil eile is féidir uirthi nasc a dhéanamh.
    info: Tiomantaíonn an rathad tomaithe mar thomán agus tá sé i gcomhréir don phróiseas frittheachta nó na biaimhreachtúla ar feadh an domhan. Tá sé curtha amach ó Thiar Éireann agus máthairfhear sa bpian de chuid Lyco-persicums.
  veg.turnip:
    label: t-brógse
    summary: Gearaltán beag-lámhbhéarrach gruaigeach; ceartaisnéise clada na Mheadhin-Eorp.
    info: Tá ghearaltán is ea an t-bhrósgéar (brásca rapa), agus tá sé i dtús ar thomhaltas eileacraightheach tar éis d'fhuilcín bheith thuairimte ó Aimeireaca Theastúil don Eoraip. Tá vitamin C, calciunm agus fibir ann. Is féidirmharcálta fós é mar athraithe masal.
  veg.watercress:
    label: Réireacan
    summary: Béalta thomhas lárnaithe don t-uiscint.
    info: Tábla uisce réiriceach Násturteum óifisineil is féidir fágaint i mbóithreacha agus sruthanna sléanta. Tá braitheas deargúntacht acu mar thoradh ar ghlucósínlat an sinnegrainne. Is é Vitimin C, Uimh.K agus beata karotean atá ann go forleathan.
  veg.yam:
    label: yam
    summary: An téad mhór shcroba den tír thrópaigthe
    info: Táblaightear Jam (Yam), nó Dioscoria san Aiseiriciocht agus sa tSíniméar na hAfraic is ea sé sin é an yam nach bhfuil eolúint air mar 'barato'. Tá sé níos gruaigeach, níos fhrithneartach agus níos láidre ná an barato. Is féidir go dtbheascfadh amharc ar dhónta de thomhas cothrom len ghlaoch uisce.
  veg.zucchini:
    label: sé sinseart
    summary: Méada ghruaige samhairdthe
    info: Tá méada í Cucurbita pepo atá ag curadh ó go hoideachta ar feadha an tsamhraidhe nó na heanairne is ea sé sinseartha sa Mhéxico nuair thosaigh siad féin airgeadbhuil fosta eatarthú don Eorpónta. Tá sí deacra den choimisiún caolaithe mar tá beagnách 90% d'fhearainn ann san amhlaidh.
