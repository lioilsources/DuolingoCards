lang: pt-BR
pivot: false
title: Verdura
cards:
  veg.broccoli:
    label: brócolis
    summary: Verdura verde com cabeça de flores densa em um caule carnoso.
    info: O brócolis é uma verdura da família das cruciferas. É excepcionalmente rico em vitamina C, K e antioxidantes; originário da Itália.
  veg.carrot:
    label: cenoura
    summary: Legume de raiz laranja com sabor doce.
    info: A cenoura é uma planta biológica cultivada por sua raiz suculenta e colorida em tons de laranja. É rica em beta-caroteno (pro-vitamina A) e fibras.
  veg.corn:
    label: milho
    summary: Planta de grãos amarelos com fileiras suculentas em uma espiga.
    info: O milho provém da América Central e é hoje um dos cultivos mais cultivados no mundo. Os grãos contêm carboidratos, proteínas e vitaminas do complexo B.
  veg.cucumber:
    label: pepino
    summary: Legume verde alongado com carne refrescante e suculenta.
    info: O pepino é uma hortaliça tropical da família das cucurbitáceas. Contém 95% de água, sendo refrescante e muito usado em saladas ou como lanche.
  veg.garlic:
    label: alho
    summary: Bulbo branco picante com aroma forte e intenso, base de sabor em muitos pratos.
    info: O alho tem sido usado há milênios na cozinha como tempero e remédio. Contém alicina, uma substância que possui propriedades antibacterianas e anti-inflamatórias.
  veg.mushroom:
    label: Cogumelo
    summary: Cogumelo castanho claro com chapéu e caule usado em cozinha.
    info: O cogumelo champignon é o fungo cultivado mais comum no mundo. Rico em proteínas, vitaminas do complexo B e minerais; utilizado em uma infinidade de pratos.
  veg.onion:
    label: cebola
    summary: Vegetal picante e em camadas usado para temperar pratos.
    info: A cebola comum é uma das hortaliças mais cultivadas do mundo. É usada para dar sabor aos alimentos em todo o globo; contém flavonóides com efeitos antibacterianos.
  veg.pepper:
    label: pimentão
    summary: Legume colorido brilhante com sabor doce ou picante.
    info: O pimentão anual existe em variedades doces e picantes. O pimentão vermelho tem a maior concentração de vitamina C entre todos os tipos de legumes.
  veg.potato:
    label: batata
    summary: Tubérculo subterrâneo amarelado e base de muitas refeições em todo o mundo.
    info: A batata originou-se dos Andes na América do Sul e é uma das culturas mais importantes do mundo. É fonte de carboidratos, vitamina C e potássio.
  veg.tomato:
    label: tomate
    summary: Fruto vermelho e redondo usado como vegetal.
    info: O tomate é botanicamente um fruto (baga), mas na cozinha é usado como uma hortaliça. Ele vem da América do Sul e contém licopeno e vitamina C.
