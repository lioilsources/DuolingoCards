lang: hi
pivot: false
title: सब्जियाँ
cards:
  veg.artichoke:
    label: आर्टिशोक
    summary: एक प्रचुर मात्रा में हरे रंग के बड़े पतलवाहट वाले पौधे कि सब्जी है।
    info: आर्टिचोक एक सब्जी है।
  veg.arugula:
    label: रूकोला
    summary: ऊष्ण धूप ढंग के सफेद थाली ऑउट ईतालवी ऐसा जोरदार
    info: |-
      रूकोला एशियाई मध्य समुद्र के प्रति हज़ारीबेड़ा।
      इसमें ग्लूकोसिनोलेट के कारण विशिष्ठ तंगनाकर और खटखटाहट चखने की बहुत अच्छी भाँप होती है。
      यह इतालवी आहार का जड़ है;
      अथवा पिझ्जः उष्ण द्वारा फिसले घाम के ऊपर ओढ़ाए जाते हैं।
  veg.asparagus:
    label: च्रेश्ट
    summary: एक नरम आईडिकल फल
    info: |-
      अस्परागुस ऑफिसीनलिज के सूखा हरा प्रकोष्ठवहि में उगता है।
      यह एकमात्र ऐशबरज़ीन युक्त वनस्पति है और इसके खपटने के बाद 20–40% लोगों में मूत्र की अद्भुत घनता होती है।
  veg.bamboo_shoot:
    label: बैंगुसोए के वाइनकें
    summary: छोटे झाओओआऊ के धारा; ऐशिऑन ऊष्णकटिबध्ञ ठठा
    info: "बैंगुसोए के वाइनकें स्थलीय प्रजातियों का हरा महत्वपूरण भवन है।\nचीनी, जापानी और टेली के खाद्में में बड़ी मदद मिलती है। \nअम्फटि अभ्कथन गई चीजें आइसिड रखती हैं एवं उन्हें पकाना चाहिए;\nफिसले हुए शाँत घर में छोड़े जा सकते हैं।"
  veg.beet:
    label: लाल चुथड़िया
    summary: बीटा एवं भोजन
    info: |-
      लाल गोभी के पौधा में बिटएनिन होता हैं।
      यह स्पर्शक वज़न और रक्तचाप कम करने में मददगार होता है।
  veg.bok_choy:
    label: पाक चोई
    summary: ओरिएंटल लीफवीज़ सब्जी ग्रीष्मकालीन डमरूख
    info: |-
      पाक चोई हैंगचुनिस के प्रकरण में सब्जी है।
      यह एशिया के रसोइए में बड़ी मात्रा में उपलब्ध है।
  veg.broccoli:
    label: bokoli
    summary: छोटे ढीले झण्डे पर घनी चमकदार आऊटफिट के साथ ठठाकर दिखने वाला ऑथर्प्ि
    info: '{"info":"ब्रोकली बूजवेटिस परिवार का हरे ताजगोभी सम्मुचय है। यह खनिज मौसमीति, एंटीऑक्सिडेन्ट और अद्भुत ऊष्ण उपलब्धि के लिहाफ़ाओं से ओढ़े हए गई है ;इसकी शुरुआत इटली से हुई।","label":"brussels sprouts","summary":"खड़े छोटे झण्डे पर घनी चमकदार आउटफिट के साथ ठठाकर दिखने वाला ऑथर्प्ि ऐश्ष्।"}'
  veg.cabbage:
    label: हलवा कचुआई
    summary: (ब्रसिसका ओलेरेज़िया)
    info: गोल शाक के सख्त पत्तियों में हरीपन है।
  veg.carrot:
    label: Gajar
    summary: एक खट्टा रंगवाही सब्झ़िया
    info: गाजर एक प्रचलित सब्जी है और कोमलता में नस्ले।
  veg.cauliflower:
    label: फूलों के सिर
    summary: एक घना सफेद तथा भाप आउटपुट डाइजेटिम खाद्य पदार्थ
    info: |-
      गुलाबी फूलों के सिर में प्रकाशन हरा च्यवनप्रश्नतम।
      बहस के लिए गुड़िया अधिक जटिल और उच्छ्वासदाई होती है।
  veg.celeriac:
    label: अनेज़् सेलेरी
    summary: एक ठठड़ीदार, चमत्कारी शहद वाली गवाह और एक खट्टा स्पष्ट नीचे की ओर आधारभूत घटक है।
    info: |-
      बल्बस अपियम कोरीया है।
      इसके मुख्य प्रजाति Apium graveolens var. rapaceum हैं।
  veg.celery:
    label: ढीला फलीदार सब्जी
    summary: खुशबौदार छोटे हरे पौधे के दाढ़ी के ऊपर के झाड़ियों के ठण्डा ओझल
    info: "जैतून के तटवर्ती प्राचीन समुदायों में हलका सब्जियों के उपयोग कि शुरुआत।\nएड़ी के खाने से अधिक कैलोरी बचाए गई है ऐसा कहा भी लेकिन इसकी पुष्टि वास्तविकता में नहीं हुई। \nफ्राँसीसी रसोइ में 'Mirepoix' - आउट, घी, और डामर के संयोजन के आधारभूत धरोहर।"
  veg.chard:
    label: मंगोल्ट
    summary: ऊष्णकटिबध्द भृश्छाप अथवा उठाऊ फलीदार घाँस
    info: |-
      मंगोल्ड लाल मूली के सबसपेसिएज़ है।
      iयह प्रकरणा, नारंगी, पीले या वरदनुभवी तखतों के साथ होता है।ि
      इसमें जटिल खनिज (पोटेशिम्‍स), आईएचडी और चिकित्सा गुण होते हैं।
  veg.chickpeas:
    label: chīzarnā
    summary: ऊढ़ा घोंसला फलिपथी; hummus अउ falafel के आधार
    info: "चीज़रना एक प्रसिद्ध मध्यपूर्व और हिन्दुस्तान के समोआहारी खेल।\nhummus (एगों के पेस्ट) अउ falafels(फलवति गोलकटों ) के आधार। \nयह पौद्यबी ऊष्मा से भरपैठई ; बीघलखण्‍डी ओर शाकाहारी डाइट मेँ जाणे चली।"
  veg.chili:
    label: चिली
    summary: गर्म भड़कदार आईटम
    info: मिर्ची के पापरका जैसे महत्वपूर्ण सबज़ियों हेतु एवलनशनरी फंक्शन कॅप्सएइसिन होता है।
  veg.corn:
    label: '"ऊर्टिओ"'
    summary: '"पीले रंग का एक पृष्ठ जिस पर ऊर्टिओ के छोटे -छोटे डंठल झड़े हए होते है।"'
    info: '{"hint":"लंबा घास के पौधों से हरित फसल में पीले बुद्धि के अनाज (ज़ीया मेयम) ,अक्सर मकई कहते है।","info":"उच्च ग्रामीण कटान दक्षिणपश्चिमी एशिआवी भारतीय मूल के है और वर्तमान में इसकी खेती लगभग सभी उष्णकटिबंधीय शुष्क क्षेत्रों में होती है| छोटे -छोटे डंठलों में झड़े हए ऊर्टिओं में थोड़ा ठोस ढंग से ऐथिऑलिप्ह ऍफइओलिऒ और बी ग्रुप के विटामिऩ होते है।"}'
  veg.cucumber:
    label: ओखरा
    summary: एक लंबी हरित सब्ज़ी चिमढ़ी आहार घनत्व के साथ।
    info: '{"hint":"लंबी हरित बेलनाकृति सब्ज़ी (कुकमेरस सैटिवस)","info":"ओखरा कोशिशवान प्रजाति में एक उष्णकटिसभ्य सब्ज़ी है। इसमें 95% पानी होता है, ठण्डक देने और सलाद में अथवा खचड़ी के रूप में भी ओखरा पसंद किया गया है।","label":"ओखरा","summary":"एक लंबी हरित सब्ज़ी चिमढ़ी आहार घनत्व के साथ।"}'
  veg.eggplant:
    label: बैंगन
    summary: अधिकतर बौछार आओर घुघराओर शाही ठठाऊ के आधारभूत
    info: "बैंगन का उत्पादन हज़ारों साल पहले भारत में हुआ।\nइटली में 'मिज़्यानच' ,फ्राँस में 'एवर्गिस',अमेरिका में 'ईग्डप्लाण्ट'कहा जाता है। \nउसमें एण्टीऑक्सडेइट - अश्विथियामिन होता है और फलीदार खोखली छिलका में"
  veg.endive:
    label: चेकनका
    summary: छाँव के फलीदार झाड़ी जो कड़वी होती है
    info: "चेकनका एक हॉर्सविटल के पारिवारिक संस्पष्ठतः कड़वी महुआयुक्त शाक होती है।\nप्रकाशमान अथवा छायादार बढ़ाए जाने पर इसका चटगा भाग सफेंदी ले आऊर ओजखि घट जाथे। \nइसकी कड़वई 'इण्डब' ऐसिमेण्ड से ऊपर और धधराहट करने से खत्म हो जाथे।"
  veg.fennel:
    label: फेनिथल
    summary: एक सफेद लहसुन बच्चा अपने पंखदार शीश एवं खट्टे आयथ के स्वाद के सामग्री
    info: |-
      अनीठा फेनिकल के स्वाद में होता है।
      anethol
      इसके प्रमुख भाग जड़, तना और पंखदार पत्ति होते हैं।
  veg.garlic:
    label: एशचिचक
    summary: खदबद श्वेष टप्पा भाहर आऊर घनी धाऊंघ ओष झठ छोटे ठथे
    info: लॉसन के लिए हजारों साल पहले मसाला और दवा की तुलना में खाना बनाया। इम्म्स के अतिक्रमणकारी गुणधर्मों के साथ ज़ियाड़ाटिव फँड़गई है।
  veg.ginger:
    label: जाइंगरबेर
    summary: एक गोल बीजी जड़ जिसके चटपटा और गंध वाला स्वाद होता है
    info: "जाइंगरबेर ऑफिसीनलेज़ कोई है एक प्रकार स्पष्टता मुख्य तथा गरम चटपटा स्वाद।\niयह उच्छवस्थिक अशिआ के ले नए बढऩे घनि शामिल भांडे के खण्‍ड ओठाहि। \nअध्ययन और ध्यान डाँट फौदे झि ऊऊ ठाणि ढे ऐउ ऋतुओं में उछल िइ षाळ ा ऱ ऽ ङ ऴ"
  veg.green_beans:
    label: फेसोलोवे बीन्स
    summary: '''पेशोलिओस वुल्गरिस'' के हरे छोटे डण्ठे'
    info: |-
      फेजोलियस वुल्गरीज़ के हरा पतले लंबे मटर के सूड़े।
      इनको 'फ्राँच मटर', 'ढळगे' और 'बॉबी मटर' भी कहा जाता है。
      ये एविटमिन-C, -K अउ फोलेट सभके स्रोत हई।
  veg.kale:
    label: कैपुस्टा केडरवावा
    summary: '''अधिक ऊर्ध्वापर्षी'', घने फलदार पत्ती इओर झाँखी ऐ ठी'
    info: |-
      कैपुस्टा केडरवावा एक महत्वपूर्ण पोषणयुक्त हरी सब्ज़ि है।
      iमे बिल्कुल भीटामिन K,A,C और ऑन्थोज़्एंट्स होते हैं।
      2010 के दशक में यह शाखा आइकॉनिक 'सुपरफूड' रौग्राहिओं अउ स्वच्छ चलन के गठन हुई।
  veg.kohlrabi:
    label: केद्लुबन
    summary: चटानदार आकाशीय झाँढ़ी घास जो उष्णकटिबध्ध ढलानों पर पाई जाती है
    info: "केड्लुबन कोशिमेरी ब्रैसिका साइमपलेटिफ़िया प्रजाति है।\nइसमें मटभईड़ा (गहरा छत्ता), जंखणवार और चटानदार गठन होता है। \nएक खुशबूदायक अथवा एंटीऑक्सिडेंट वाला भोजन है।"
  veg.leek:
    label: पोरक
    summary: एक बड़ी मजबूत गाजर और रखट की चीज
    info: |-
      पोरक एलियम अंबेलॉफ्रासस है।
      iया के स्थानीय पुष्पन में वेल्श इसे पहचानते हैं;
      sवाति सदग़्ध के दिन भी ऐसा करते हैं।
  veg.lentils:
    label: चणा
    summary: छोटे फ्लैश डिस्क शेपडः बिहिन भोजन में प्रोटीन का महत्वपूर्ण स्रोत
    info: लेंस कुलिनेरीज़ मक्खन एमोंग सबसे प्राचीन दाल है।
  veg.lettuce:
    label: हल्दी लेटूका
    summary: खसखस चाहे गई छोटी सब्जी
    info: "हल्दी लेटूका सामन के प्रजनन में हमेशा से मिस्र में।\nयह पानी करोड़पति 95% ; यह कम कैलोरी वाली सब्जी हैं। \nईसराइटी, रोमेडुएन, अगवच्‍छद, बटरहेड, ओक फॉइल - एक तथा आधा भिन्नताः हैं।"
  veg.lotus_root:
    label: लोटस के झाँग
    summary: छेने के ऊपर के धागे से ढंग से ठीक ऐसे ऑट्थे; एशिएटिक डिष्णि बखरे।
    info: |-
      लोटस का जड़ीभूत हिस्सा पवित्र लाइलेट मुकुन्द से होता है।
      अपने कर्ड अंदर कई समयचक्र छेने के रहस्यशील आकार को खोजता है。
      एशिएटिक व्हीफः चीनी,
      जापानी और भारतीय शेफः के बेसबोल गेम के उठाओं में घुल जाता है।
  veg.mushroom:
    label: शौफँज़्वन
    summary: खासे गृह आउषधि में चढ़ाई लाल-भूरी छतरीदार कटहर
    info: एगेरिकस बाइस्पोरस संसार में प्रचलन की दृष्टि से सबसे अधिक हुई कटहरा है। यह प्रथकतः प्रोटीन, विटमिन और खनिजों से भरपूर होती है ;इसका उपयोग घड़ाभर डिशों में किए जाते हैं
  veg.okra:
    label: ऑक्रा
    summary: छोटे हरे झुंडदार ऊखले जिनमें ऐशियाई ठील था
    info: "ओक्रा की उत्पति सबसे पहले मानवनिर्मित हरियों अफ़्रीका के शुष्क जैगरेट वनमय क्षेत्रों में हुई।\nअपने चिसोटे और लचीले गठन के कारण ओक्रा एशिआइज़ड फौएगेड बनाने में भी इस्तेमाल होता है। \nऊपर से काटकर देखने पर ऑक्रा के छिद्र ध्रुवीय ढंग से घुमाहट बनाते हैं।"
  veg.onion:
    label: lal adaraka
    summary: Jahar gun aur sharir ke ushma ka liye chashma ghollane wali ghillake vaale sabzi
    info: '{"info":"लाल अदरक के सब्जियों में से प्रमुख है। इसका उपयोग दुनिएभर में खाना बनाते समय मसाला की भाँति किया जाता है ;इसमें ऐंटीबैक्टीरिआल प्रभाव फ़्लवोनौएड्स होते हैं।","label":"अदरक","summary":"जहार गुण और शरीर के ऊष्मा के लिए चश्मा घोलने वाली छिलके वाली सब्जी"}'
  veg.parsley:
    label: अजमोदा
    summary: ऊषण ऊष्ण झाड़ियाः ध्वनि थीम और एरोमेटिक ऍडऑन।
    info: "अजमोदा पेट्रोसिलीनल कर्सपुम है जबकि महत्वपूर्ण सामग्री और सजाबंदी के रूप में उच्च तथा।\niय नींबू की अधिक भाग में एविटाइटीएसई की मात्रा होती है। \nइसके दो प्रकार होते हैं - सभी फ़्लैट या कड़वे पत्ते ; खाशखाओओ आमतौर पर ठठाड़ी छाँई के लिहाज से ऐशिपरफ़ेर ऑउट।"
  veg.parsnip:
    label: पास्टिनौक (पास्टिनैका सेवी)
    summary: खुशदिल श्वेत मुलई; उष्णकटिपथीय धरती के छोटे ठण्ढे ऋतुओं के लिहाज से आधार खाद्मार
    info: |-
      पास्टिनैका सेवी एक मुलई के प्रजाति हवय।
      इसने बरमूड़ों के आगमन से पहले यूरोप के लिहाज से खाद्मार के भाग के रूप मेँ काफी अधिकता से प्रचलन था;
      अब इसके उपभोग कम हो चुकल हवए。
      इसके मीठे और डाऊटे झाि हवए,
      mरझे के बाद ओ घुल जाऐ हवए।
  veg.peas:
    label: matar
    summary: एक पखुड़ी में छोटे हरे गोल लहसुन
    info: |-
      मटर के बीजों में प्राचीन सभ्यता से हलयुक्त फ़सल।
      gregor mendal ने अपने आनुवंशिकि प्रयोगों में मटर का उपयोग किया (१८४० - १८७३)
      mattar ke phaliyakaran ko pura khaya jaata hai aur sugar snaps mei adhik madhumehriya hote hai।
  veg.pepper:
    label: मिरचा
    summary: एकत्रित बनेकुछ भी
    info: पीला प्याज एक सरसों के मिरचे है।
  veg.potato:
    label: आलू
    summary: एकदम सफेट जमीनी गठन धरती के खाने के चारोंओर घुसे हुए छोटे डब्बे
    info: आलू दक्षिणी अमेरिका के एंडेस से होने वाला महत्तपूर्ण प्रजाति है। यह शुगर, आयोड़ और पोटॉशिम का भी बचवा होता है।
  veg.pumpkin:
    label: टमाटरी
    summary: ऊष्णकालीन चिपचिपाहट छद्म धड़ के फलने के ऐतिहासिक ढंग के डबल ओउआन ऑफ़ थीम के झण्डे
    info: "टमाटरी गोल प्रकृति का स्कवश है।\nयह मुख्य रूप से अफ़गानिस्तान और उसके आसपास के क्षेत्रों से लाए जाते हैं। \nइनमें बीटा - कैरोटीन विशेषज्ञता होती है इसके अलावा भी विटामिन 'ए' और ‘सी’ कई खाद्य घटकों के ऊष्णकालीन चिपचिपाहट छद्म धड़ के फलने के ऐतिहासिक ढंग के डबल ओउआन ऑफ़ थीम के झण्डे के ठीठ ऋण भी होते हैं।"
  veg.radish:
    label: रडिश
    summary: एक छोटी आग देखने और घाटी इष्टपाषण
    info: |-
      राफेनस सैटिवुस के त्वचा मोल हरी प्रजनक।
      छोटी बग़िया रडिश लाल होती हैं; ठण्डा ऋतुवासी भेंबदाक चमकदार होती हैं。
      इसमें एंटीबॉईओटिक गुणधर्मों युक्त जौहर अभिप्राण होते हैं।
  veg.spinach:
    label: पालक
    summary: '''ईरन''में भरपूर डार्ग्रीन फूड'
    info: "पालक के अंगूरीबेटा प्रजनन स्पिनेसिया ओलेरेशिए।\nयह विटमिनों -K,A,C ,फोलेक और आयरन में हुआता है। \nएवढ़िसी(टॉमच बौखदर )शिरकत के 'ऊर्जा'भोजन घोषणा करे थे"
  veg.spring_onion:
    label: एशिआईय ग्रीष्मऋतु के प्याज़
    summary: गहरे हरे बचड़ों ओर छोटे श्वेतमृदु भाग घिसे हुआ
    info: वसंत के प्याज़ में एक सॉफ्टर और हल्का तीखा स्वभाव होता है। इन्हें अपने निर्माण के चरण में ही कटाल दिया जाता है।
  veg.squash:
    label: बैंगन
    summary: विषमआकारी सरदी के बृश्स ; ओउ धरती के थोर ढाँचा
    info: |-
      सरदी के बैंगन (क्युकरबिटा में सभी प्रजाति ) हलवा ,अखरोट, डेलिकता और कबोचा कई प्रकार कहलाए जाने।
      यह ठठाम खछड़ी अपने भीतर घंटों चढ़ाए गइ ; इमे पौरे सरदी आसानी से छोड़ देवा झा सकथे。
      ये ऊष्णकरण शरीर के लिहाफा उपयोगी होऊ।
  veg.swede:
    label: टूरीन
    summary: फिट - पीला छोई कच्चा फल; स्पष्ठ हँगिस
    info: "टूरीन के बारहा हल्दियों से प्रजनकता में उगया।\nअमेरिका में 'रुटबेग' के नाम से जाति और स्थलवर्षीय भावना में हँगिस के साइड कपड़ा है। \nइसका स्वाद मधुर एवं धीमे अदरक लगभग चखने आए।"
  veg.sweet_potato:
    label: खरबूजा
    summary: हरितचक्र में खरबूजा - लाओशिम रूढ़ियों के चिह्न
    info: |-
      स्वादिष्ट गुलाबी सबज़ियों के पौधा हरितचक्र में एमपोएओन जैविकता के अग्रणी।
      इसमें भीटा-कॉरोटीन, आईडीआई और फाइबर धन्यवाददान होता है।
  veg.taro:
    label: तरबूजी मुल्ले
    summary: एशिया, अफ़्रीका और पॉलेनेशिआन के समष्टि खाद्य के बड़े गठित फँसवाहरा
    info: टारों का एक प्रजाति है Colocasia escutentia।
  veg.tomato:
    label: टमाटर
    summary: एक लाल गोल फल जिसे सब्ज़ी के रूप में प्रयुक्त किया जाता है
    info: टमाटर बॉटनिकली सब्ज़ियों के रूप में प्रयुक्त होता है।
  veg.turnip:
    label: टमाटर
    summary: एक सफ़ेद - बैंगनी गोल नाभिहीन आइडिओट; जुआओई डी ऑउटरोप
    info: टमाटर के उत्तरी अफ्रिका से पहले मध्ययूरोप में मुख्य खाद्य हथअन। विलक्षण विशेसंगठि जसे 'C' और कैल्सिम एवं फाइबर के सभी रचय।
  veg.watercress:
    label: जलीय रेशिचा
    summary: ठंढे पानी के धारा में उगे वाला ठंढे हरित ऐतिपर ऑर्गनिक ढंग
    info: |-
      जलीय रेशिचा हर्बसनुमे सूक्ष्म कालो प्रहरणत् मध्ये नदि आऊँ झरे में उगत।
      इसके मसाहट वाळा गंभीर तथा मिरचबखत खासिए जेकड़ा अपवशिट डीएफईआईओएन फाइटोकेमिकल सिनिग्रिन देई।
      अउ ओ भीतर ऊष्णकर घटक छल जेथे विटामिन सी, के और बीटा - कैरोटीन।
  veg.yam:
    label: जामनीकरण
    summary: एशिया आउंद्र उच्च ऊंचाइयों पर खेति कई गठन
    info: |-
      जामनीकरण एफ्रिका के सबसहेल्स में पौष्टिक हल्दीयुक्त जड़ोंवाला फल।
      इसमें बटारत के विपरीत अधिक शुगर और घनपन होता है।
  veg.zucchini:
    label: खीरगढ़दल
    summary: इंडियन खीरगढ़दल ; एक व्हीलबेडळ और रसभरी चीज
    info: कुएटा के नाम से पहचानी जाती है। यह मेक्सिको से आई है; इसे ओरमें अति लोकप्रिय बनाया गया है।
