lang: hi
pivot: false
title: सब्जियाँ
cards:
  veg.broccoli:
    label: ब्रोकली
    summary: एक हरा सब्ज़ियां जिसमें मोटे पुष्प के बने सिर होते हैं।
    info: ब्रोकली एक हरी सब्ज़ियां है जो गोभी के परिवार से संबंधित है। यह असाधारण रूप से विटामिन C, K और एंटीऑक्सिडेंट से भरपूर होती है; इटली से आई है।
  veg.carrot:
    label: गाजर
    summary: मीठे स्वाद का नारंगी मूलीबोटन।
    info: सामान्य गाजर एक बहुवर्षीय पौधा है जिसे श्लेष्म भरे नारंगी जड़ के लिए उगाया जाता है। इसमें बीटा-कैरोटीन (प्रोविटामिन A) और फाइबर की अच्छी मात्रा होती है।
  veg.corn:
    label: मकई
    summary: एक पीला फलियांवाला सब्जी जिसमें कण्डरे में रसदार बुंध होते हैं।
    info: मकई एक ऊँची घास की फसल है जो मध्य अमेरिका से आया है और आज इसकी खेती विश्वभर में की जाने वाली फसलों में से एक है। इन दानों में चरबी, प्रोटीन और भगोड़े B के विटामिन होते हैं।
  veg.cucumber:
    label: कद्दू
    summary: लंबी हरी सब्ज़ी जिसमें ठंडाकरने वाला रसीला माँस होता है।
    info: खुशबूदार कद्दू एक उष्णकटिबंधीय सब्ज़ी है जो प्रसव के परिवार से संबंधित है। इसमें 95% पानी होता है, यह अपने शीतल प्रभाव के कारण खजूर और सलाड में पसंद की जाती है।
  veg.garlic:
    label: लहसुन
    summary: तीखे सफेद गोला के साथ मजबूत खुशबू, कई पकवानों के स्वाद का आधार।
    info: लहसुन हजारों सालों से खाना पकाने में मसाला और दवा के रूप में उपयोग किया जाता है। इसमें एलिसिन होता है, जिसमें एंटीबैक्टीरियल और एंटीइंफ्लेमेटरी गुण होते हैं।
  veg.mushroom:
    label: चमकदार चॉपस्टिक
    summary: एक प्रकाशहीन-भूरे छत का सब्ज़ियों में इस्तेमाल होने वाला फंगस।
    info: Agaricus bisporus दुनिया भर में सबसे अधिक बढ़ाई गई एवं खाई गई घटिया है। यह प्रोटीन, विटामिन बी और खनिजों से भरपूर होती है; इसका उपयोग अनगिनत डिश में किया जाता है।
  veg.onion:
    label: लस्सन
    summary: खाद्य पदार्थों के स्वाद बढ़ाने के लिए उपयोग होने वाली तेज महक वाली गुच्छित फली।
    info: लस्सन दुनिया की सबसे अधिक खेती की जाने वाली सब्जियों में से एक है। इसका उपयोग पूरी दुनिया में भोजन के स्वाद बढ़ाने के लिए किया जाता है; इसमें ऐंटीबैक्टीरियल प्रभाव वाले फ्लैवोनॉइड्स होते हैं।
  veg.pepper:
    label: पीपरका
    summary: चमकदार बने हुए सब्जियों में मीठा या कड़वा स्वाद।
    info: लाल पीपरका सभी प्रकार की सब्जियों में विटामिन C की सबसे अधिक मात्रा रखता है।
  veg.potato:
    label: आलू
    summary: दुनिया भर के कई पकवानों में ही उपयोग होने वाला स्टारची जमीनी गुड़िया।
    info: आलू दक्षिण अमेरिका के एंडीज़ से आता है और इसे दुनिया की सबसे महत्वपूर्ण फसलों में से एक माना जाता है। यह कार्बोहाइड्रेट, विटामिन C और पोटैशियम का एक महत्वपूर्ण स्रोत है।
  veg.tomato:
    label: टमाटर
    summary: लाल गोल फल जिसे सब्जी के रूप में प्रयुक्त किया जाता है।
    info: टमाटर वनस्पति शास्त्र में एक फल (जामुन) है, लेकिन खाना बनाने में इसे सब्ज़ी के रूप में प्रयोग किया जाता है। यह दक्षिण अमेरिका से आया है और इसमें लाइकोपीन और विटामिन C होता है।
