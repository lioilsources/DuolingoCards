lang: bn
pivot: false
title: সবজি
cards:
  veg.artichoke:
    label: Artichoke
    summary: '''অর্টিচক''-এর ঐতিহ্য ঢাকা হয়েছে একটি বড় গজদণ্ডপত্তি থেকে।'
    info: "আর্টিচক হলো 'সাইনেয়া' নামধারী একটি বড় গজদণ্ডপত্তি।\nএখানে শঙ্খচক্‌র সবুজ পালকগুলি আহার্য ও কষাঘরেও উৎপাদিত থাকে। \nইউরোপে অনেকে জমশেদ ফলের ছাঞ্ঝা ধরে ভূমিষ্ঠ করছেন।"
  veg.arugula:
    label: রুকোলা
    summary: অফুরন্ত ঢঙা সবুজ স্যালাড সবজি
    info: "রুকোলা মধ্যসাগরের এবং সমতটভূদ।\nএটি পিটপিটে ও কষানীয় রসগন্ধওয়ালা হয় ইউকা বেশিলেরিআ উৎসে। \nইহা ভিত্তি ছিল অনেক দখলে চীজ খাড়া থাকছে;\nআইতাশিজ ঘরণি ফ্঳ৱে ঝড় ঠাণ্ডা পিষ্ট হচ্ছে।"
  veg.asparagus:
    label: shaparagus
    summary: আঙ্ঙখাটি শৈতেষূ ফৌডঃ ঝুঞ্ঠৱ ঘন ডাণ্ডা
    info: "'Shaparagus' একটি Asparagus officinalis নামের উদ্ভিদ।\nasparagines হলো সবজি যা প্রধানত বসন্তকালে চাষ করা হয়। \nএই গাছগুলি আমাজনশীলভাবে অপহরণ ও খাইয়াছে থাকে।"
  veg.bamboo_shoot:
    label: বাঙ্গুর ষ্টেম
    summary: অ্যাঞ্জিয়ান রসদ কথাটির ঢঙ্গে ব্যবহৃত বাঙ্গুর ষ্টেম
    info: "বাম্বু শেষকয়ানির সময় তরতরিয়া হল।\nএগুলি চীন, জাপান এবং থাইল্যাওদেশীয় রসদ কথাটির অপরিহরণীয় উপাদান। \nচটজলদ গাছের ফল আছে সায়ানাইড এবং ভালভাবে ধোওয়া খাড়াই ঘিরে ঠিক হয়;\nখৃষ্ণ ঝুলে নিরাপদ হয়।"
  veg.beet:
    label: নারকেল লোহা
    summary: অন্ধকার লাল রঙের গুঞ্জন মূল সবজি
    info: "নারকেল লোহা (বিটা ভ্যুগাসরিকস), বিৎপাইথানিন—এমন একটি প্রচণ্ড জৈবিক চৌখড়ায়।\nআছে অধিক আয়তনে হিমোজেন তরল থাকে ফলে খেলাধূলা শক্তি ও দশদওয়া ঘৃষ্ণ উভয়ই ছাগল ঠিক থাকে। \nচিনি ঝাড়ফুঁক ঐ সঙ্গে আলাদা জাতের ঢেউ হয় এবং সাদা চিনি উৎপাদনের উৎস।"
  veg.bok_choy:
    label: পাক চয়ি
    summary: আফ্রিকা ঝাঢ়া সবজি ঈষৎ ঠাণ্ডা
    info: |-
      পাক চয়ি / বক ছোই (ব্রেসিসা পরা উপগণ। শহরতলী ) ইনটি এশিয়ামধ্যখানথেকে আছে
      এটি জাভামদিহ ও থালিদেও অজিগুড়ি তাড়ান
      ভিটামিন সি , খ , ঘ ফাং ক্ষার ধাঙ্গা
  veg.broccoli:
    label: ব্রৌকোলি
    summary: চমৎকার শহরের হেডফ্লোর জনপ্রিয়
    info: ব্রুকলি কাপড়ের গাছগোষ্ঠিতে ফুটতে।এইভাবে এটা ভিটামিনসি ,K ও অ্যাণ্টিউঅক্সিডেন্টদের দ্বারা খুব ধনী ;যা ইতালিতে আছে
  veg.cabbage:
    label: হলাঁকোভে সবজি
    summary: খৈথ পাতা সহ গোলাকার সবজি ; ছাঝাণ সবজির ভিত্তি
    info: "হলাঁকোভে সবজিরা (প্রসিকা ওলিয়্যীশা) হাজার বছর ধরে ইউরোপে চাষ পদ্ধতি।\nএটি ভিটামিনগুলি -C,K এবং গ্লুকোসিনোলেটস দ্বারা অন্তর্ঘমণ আছে ফলে ক্যাঙ্কার থেকেও শরীর রক্ষা করে। \nফার্মেন্টড খাবার উৎপাড়ন ছাঝাণ সবজি(সাঊইআর্ক্রাউট)-এর জন্য এটি ব্যবহৃত হয়,\nযাতে প্রোবায়োটিকস প্রচুর পরিমাণে আছে।"
  veg.carrot:
    label: মরটা
    summary: একপ্রকারের ঝড়ফলা ঘন ছাড়া ঔষধি ঢাঙ্গা
    info: '"মরটা সাধারণ" একপ্রকারের দুইবছরের উদ্ভিজন যা পিৎজলত নস্টয় করা হয়। ইহা বিশেষভাবে গোধূম ফলক আগুচী ও তথ্থ মৌলিচ অশৃঙ্খল লওয়া হয়।'
  veg.cauliflower:
    label: ফুলকপি
    summary: অনেকগুলি ফুলের ঝুড়ি থেকে সীমাঙ্কিত ঠাণ্ডা ষ্টিক ঢঙের সাথে ঐতিহ্যগত বেলজিয়ান সবজি
    info: "ফুলকপি এবং ব্রসেলাস্‌ কচিশাল।\nএটা পর্ণদন্ডগুলি দ্বারা আড়মোহরযৌথভাবে চতুষ্টরণ হওয়া ফুলের মধ্যে উৎপন্ন অশ্঵িত ছাই থেকে জন্মগ্রহণ করেছে। \nআইভি, গৃহসজ্জা ও ভৈরব ধরনের খামখেয়ালি ঘটনা রয়েছে।"
  veg.celeriac:
    label: বুলভ সেলারি
    summary: আলৌ মৃদু সেলারি মূল ; ফরাচ্ছিৎসা উপাধি
    info: "বুলভ সেলারির (এপিয়াম গ্রাভিওলেনস ব্লক। জাপাকেয়াম) মূলটি একদমই শঙ্খচক্ষী হতে থাকে।\nএটি তৈজসহোষণ দশা নথাই আছে। \nফরাচ্ছিৎসা উপাধি অধিক ঘন ডগডগে ফ্লেভাট ঠাণ্ঢা ঝাঙ্গা হওয়া ঐখানে ব্যবহার করা হয়।"
  veg.celery:
    label: parsnip
    summary: ক্রুপ গ্রিন সবজি সঙ্গে প্রবল আরোমা ; zero calorie?
    info: |-
      প্যারিকেট সীমনিরাৎসাদ (আইপিওয়ান গ্রভলওএনজে) মধ্যদক্ষিণেশোষণ থেকে।
      বলা হতো পাঁচফূলা খাবার চূড়ান্ত শক্তি অপেক্ষা আহারের জন্য নগণ্য ঘনত্ব এখন উপলব্ধ ফ্লৈট ছাড়ছে;
      অথবা ইউরোপীয় ভাঙ্গা টৃপলের একটি ভিত্তি:
      mirepoix(পিঠা, ঝালমসুরা, পাঁচফূলা)
      parsnip juice একটি popular ঢৌঙ্গ ঔষধ।
  veg.chard:
    label: ম্যাংগোল
    summary: অঙ্গশীল ঘন পাতার সবজি যার ঢিলা ডগা
    info: |-
      'ম্যাংগোল' রক্তের আদা (বিটা ভুলগাইস সাব। চিক্লা), এটি নতুনভাবে পপড়িয়েছে।
      এই শাকসবজির গাছের ডগা হলুদ, লাল, অথবা 'আউফহাউস'-এর মতোও দেখতে থাকে。
      এটি জি, এ ও খ ভিটামিন এবং ধাতব পদার্থের ঝাণ্ঠা - ফসফরাস, ম্যাঞ্জিষ্যাম।
  veg.chickpeas:
    label: চিচরা
    summary: আঙুল ঢাকা বেঈজ রঙের লুখৌনি; হাঙ্গমাস এবং ফ্লফেলের ভিত্তি।
    info: "চিচরা গাছের বীজগুলি মধ্যপ্রাচ্য এবং ভারতে জনপ্রিয়।\nhummusএর পক্ষেওয়া আসছে সম্পৃক্ত করে ফ্লফেল নথি হিট ওভেন দ্বারা শহরণ ঘটে। \nউদ্ভিদ থেকে অশোষিত খাদ্য উৎপাদন ধরনের ডাইটে এই ঝড় ঠাণ্ডা খাবার ব্যবহার করা হয়।"
  veg.chili:
    label: চিলি
    summary: অঙ্গার বা ঢাক রঙের তীব্রতা সহ মশলা
    info: "চিলি পাইপ্রকা(সীজনের আণুম এবং অন্যদের)এটি খুবই তীব্রতা সহ মশলা।\nগৃধ্বয় ক্ষমতা দেওয়ার জন্য চিনি হ'ল গৌষথোল শিথিটি উৎপন্ন ঘটছে ; ফলে ছৈভৱ ওখন ভাঙড় ধরনের ডিগ্রী দ্বারা মাঝুর হয় ( জালাপেনো :   2 , 500 -     7946      S H U ) \nআফ্রিকার মেক্সিকান এবং ভারতীয় রান্ণার জন্য চিলি ছাড়া ঠিক ঐ রান্না হয় না"
  veg.corn:
    label: পটালি
    summary: ফলনে ঝলমলে ডাইল সঙ্গে স্বর্ণ রঙের সবজি।
    info: '{"hint":"উচ্চ ঘাসের ফসল যা পোকনবড়িতে কমিছে(জিওয়া মেইছ)","info":"পটালি গহম উৎগম হওয়া এখন অধিভাবে খেতি করা ধান।এদেশে শর্করা ,প্রুথিতি আর জি দলের ভিটামি঩ থাকে","label":"পটালি","summary":"ফলনে ঝলমলে ডাইল সঙ্গে স্বর্ণ রঙের সবজি");'
  veg.cucumber:
    label: কমলা
    summary: এটিকে একধরণের ঠান্ডা আউশত গঞ্জপালা হিসাবেও চিনা যাওয়া থাকে।
    info: '{"hint":"দীর্ঘ সবুজ বেলাদন্তি শসা (cucumber)"}, "info": {"cs": "Okurky jsou tropické ovoci rodu Cucumis ze skupiny melounů. Jsou tvořeny přibližně 95% vodou, mají svежe a jsou populární ve salatech i jako občerstvení."}'
  veg.eggplant:
    label: eggplant
    summary: অধম ফিলোভ ওভাট মণি উদ্যুগ ; ইউজ অফ তথ্য ঘন খাড়া ধরে
    info: |-
      "Eggplant" এর বৈজ্ঞানিক সংস্থা Solanum melongena।
      এটি ভারতে প্রচলন হয়েছে;
      হજার শব্দকে চাষ আশপাজ ছড়িয়ে গেছে।
  veg.endive:
    label: চেকান্কা
    summary: '''উইটলৌফ্‌’ হলো একধরনের প্রাকৃতিক সবজি যা ফ্রান্স ও বেলজিয়ামে জনপ্রিয়।'
    info: |-
      চেকান্কা হলো 'ইনটিবস' অথবা 'এণ্ডিভিয়া'-র এমন সবজি যার চিমটি গন্ধ।
      পাতা পালঙ্কি আছে জড়িয়ে থাকতে দেখা যাই;
      হলুদ খাওয়া ফ্রাঙ্কফূৎ - উভয় শৈশব ছাটা ঘি ঠাণ্ঢা ঝাঞ্ঝা ঐ ষষ্ঠ মাসেও বেগম পছন্দ করেন।
  veg.fennel:
    label: ফেনিকুল
    summary: শৈতেজ ঢঙ্গে প্রচুর ফোড়া ও মিষ্টি আদা রসযুক্ত এক ধরনের মৌমাছি ফুল।
    info: "ফেনিকুলাম বা Foeniculum vulgare এর স্পষ্টতঃ অসময়িক গন্ধপূর্ণ আদা রস।\nএটি তহবিল, ডগাদণ্ড ও ফোড়াওয়ালা শাখা উভয়ই ভক্ষণযোগ্য। \nআধুনিক ইতালীয় জলখাবারের চূড়ান্ত নথি - 'Pesto', হলুদ ছাটা ঘি থাকছে ঠিক ঐ ঝুড়িতে।"
  veg.garlic:
    label: চিঙড়াফুল
    summary: অধিকাংশ খাবারের ছোট ঝাঁঠার জন্য ঐ বঙ্গে ঢৌঁথ ব্যবহার করা হয়
    info: '''স্বাস্থের লিং''একটি Allium Sativam নামক গন্ধযুক্ত শ্যাৎপত্র। এই পদার্থটি হজমে কষ্ট দেখা দেওয়া অবস্থাজনক ফলনশীল ও আগ্ন্যহো উভয় ভাই চিকিৎসা ঘটনার খণ্ডনে ব্যবহৃত হয়।'
  veg.ginger:
    label: জাজিক
    summary: চূন্ত ঐ স্পাইসি ও ঔষধি গুণ সম্পন্ন মৌল।
    info: "জাজিক একটি উষ্ণতর আফগনেশুয়াল গছ।\nএটি মসৃণ ও তীব্রভাবে স্পাইসি হওয়া অঙ্গোপাঙ্গ ধান্য দ্বারা চিলমহড়া থাকে। \nঅধ্যয়নগুলি ঘিরে খাওয়াদখাওয়া শাড়া ছাড়া ফাটল ভাষা ঠাণ্ঢা ঝাঞ্ঝা করতে সাহায্য করে।"
  veg.green_beans:
    label: ফ্যাজোল বিচিরা
    summary: দৈর্ঘ্য সবুজ বিচিরা ; অপরিপক্঵ অবস্থায় সঞ্চয়
    info: |-
      ফ্যাজোল বিচিরা (পেজুলস ভালগারিস)-এর কথা ইংরেজিতে 'ফ্রেনচ পকশ' , 'ষ্ট্রিঙ্গ ফলওয়া' অথবা 'বডি ডিম্‌স'-এর নামে আখ্যা। এটি ওভিতমিন সি, খ এবং শাহাদের উৎস।
      অঙ্ঘরণ ছাড়াই থাণ্ডা ধৌত ঝা঳ করে ঠাণ্ডা করে ঢেউ করে ঐ সহ একটি ক্ষীরদধি পছন্দের আমেরিকান মৃদু খাবার হিসাবে পরিবেশন করা হয়।
  veg.kale:
    label: কাপুস্তা কেড়েরিভাবা
    summary: '''অন্ধকার নীল কেড়েরিভাবা পাতলা পাতার সবজি''; সুপারফো'
    info: "কাপুস্তা কেড়েরিভাবা (ব্রাসিৎকা অলিয়েইশা ঵াইয়া। শালভিওনিকা), এটি খুব আহামদপূর্ণ গাঢ় নীলচে ফলের উদ্ভিদ।\nএতে জমজম থাটা হওয়া চৌষধি ঘটিত ছাড়া ভিটামিন K,A,C এবং অ্যান্টি঑ক্সিডেণ্টগুলি ধরে রখেছে। \n2010 এর দশকে এটি ঐতিহাসিক 'সুপারফো' হিসাবে ঝুঠাষ্ট্রী এবং স্বাস্থ্য আন্দোলনের মধ্যে প্রথম হয়েছে।"
  veg.kohlrabi:
    label: কেডলুবেন
    summary: অঙ্কুরের উদ্ভিদের শাইফ টুকরো ঘেরা
    info: |-
      "কেডলুবেন" কাপড়ির গােষ্ঠীতে সম্বন্ধযোগ।
      এটিতে খাওয়া হয় মসৃণ এবং চিনি -চুইপাথরের রহস্যজনকভাবে আছে;
      খালি অথবা ভাজা ফলও দশা ছাড়া।
  veg.leek:
    label: পৌরেক্‌
    summary: মধুর আশা ফলি ; চড়া ও অঙ্খুজির ঘি লেখা
    info: "পোরেক হল Allium ampeloprasum -এর সদস্য।\nওয়ালিশগণ এটি তাদের রাষ্ট্রীয় পতাকাগুলি নিজেদের উৎসবে বহন করেছে। \nএটি allicin ,K,C ভিটামিন ধারণ করে।"
  veg.lentils:
    label: চৌহু
    summary: খুব ছোট সমতল শস্যপদার্থ; মাংসহীন খাদ্যে প্রোটিনের প্রথম উৎস।
    info: |-
      চুলা একটি প্রাচীনতম শস্যপদার্থ। Lens Culinary নামেও বিখ্যাত।
      এর লাল, সবজি, ভূরঞ্জ ও কালো(ভেগুয়েডা)-অঙ্গ আছে。
      আধুনিক অবশিষ্ট ছাড়াই দ্রুত উৎপাদন হয়,
       ইউরোপ ও ভারতে ফলে ধরণে ঘৃষ্ণ ঝুঁকি কম হয়।
  veg.lettuce:
    label: হিউড সলেট
    summary: '''খুব ছোট'' ফলজাতীয় ঝোপ'
    info: |-
      "হিল্ডার সলেট"কে পুরনোদিকেই মিশরে চাষ হত।
      এটি 95% -এরও বেশি জলযুক্ত এবং খুব নমনীয় গছ
      আইসবার্গ, ভগ্নাৎপাদ, ওভাট ইত্যাদি অনেক ধরণের আছে
  veg.lotus_root:
    label: লোটাশ ডাঙ্গা
    summary: অসংখ্য ছিদ্রযুক্ত লীলফ্‍রুটের টুকরা ; আসিয়ান ঘরের থালার ঝড়
    info: |-
      লোটাস মজ্জা (নেমবুর নিকিফেরা), পবিৎত লৌকশচারণ।
      এই গহ্বরগুলি একটি আংশিত চিহ্নপদ্ধতি দেখায়。
      আসিয়ায় - ভাইথাউওয়ান, জাপান ও ভারতে খাবারের অঙ্গ।
  veg.mushroom:
    label: ছত্রধানি
    summary: '''অশ্লষ্ঠ''-ভাঙ্গা ঘড়িদান থাইফৌন রান্নার কথায় ঐখনও ব্যবহৃত হয়।'
    info: Agarikus bishpuru বিশ্঵ের সবচেয়ে জনপ্রিয় চাষকৃতা ছত্রধানি। এটি প্রোটีন, ভিটামিনস্‌ 'বি' ও খনিকলগুলি দ্বারা ধনী—এই ফণ্ডমহূর্ত অজস্র আহারে উৎস হিসাবে গৃহীত হয়।
  veg.okra:
    label: অক্রা
    summary: আউট থেকে শৈলী ও চূড়া ছাড়া খাজ ধরে ঝুলছে
    info: |-
      ওক্রা উত্তরণশীল আফ্রিকায়।
      এটি গম্বোয়ের প্লবনসহ মধ্যপ্রদেশের
      গুড়খেজুর সঙ্গে এই ঘষা অথচ নরম টেক্ষুর হাইভি ফ্লাভ দেয়।
  veg.onion:
    label: আদা
    summary: খামচে তহশিল ভোজ্জন উৎপাদনের অগ্নিগর্ধ শঙ্ঘ
    info: লুকমি আলিয়াসেপার্স বরফ এবং পটভন্দার করতে খাওয়া হয়।
  veg.parsley:
    label: ফজলি শহরের ছড়ানো ডাটা
    summary: আধুনিক রাষ্ট্রীয় ঐশ্বরিক ঔষধ
    info: |-
      পেরিল পাতা (Petroselinum crispum)-কে স্বভাবগতভাবেই মসৃণ অথবা কঙ্গনময়। এটি রচনা ও উষ্ণ চুদের জন্য খুব আলোচিত।
      এখনও ভারী হিসেবে দেখছে না—অর্থাৎ ফজলি শহরের ছড়ানো ডাটা ধরে ইউরোপের ঝূলি ঠাঙ্গা ঢাকা হয়।
  veg.parsnip:
    label: পাটিউনাদ
    summary: হলুদ ছাটা ফল জঙ্গলের
    info: |-
      'পাস্তিনাকা' আটচকুনির মতো এবং পেয়াজও।
      এই শস্যগুলি ইউরোপে ব্রডফিলদের চাষ হত;
      মধুর ও গছনখণ্ডের খুশকি থাকে;
  veg.peas:
    label: pea
    summary: Pod জড়িত ঘন ডট উপহার
    info: '''Pea'' শব্দটি Pisum Sativumকে বোঝায়। এই ফলা পরিক থেকে সময়ের আগেও চাষ হত। Gregor mendal তাঁর heredity নিয়ে experiment(1856–1863)-এ pea গাছ অধ্যয়ন করছিলেন। Moro Peas মারফৎ whole shell খাওয়া হয়। Sugar Snap ভাইসজন sweet flavor ধরে।'
  veg.pepper:
    label: মরিষ্ঠা
    summary: আধোদশ গৃহণ ও জ্ঞাণ ফল ধরনের খাড়া ঝীঙ্ঙ
    info: '''প্যাপেরিকা'' সুস্বাদুও হতে পারে এবং তিরষ্কড়ও হতে পারে। ''লাল মরিচ''-এর ভিটামিন-C অন্যান্য শাকসভ্যগুলি থেকে আটখানা উচ্ছ্বসহয়।'
  veg.potato:
    label: আখি
    summary: জড়িত খণ্ডশহরের পথে জনপ্রিয় নিঃসঙ্গ ভোজন
    info: '"ব্রামের" দক্ষিণ আমেরিকা''য় অন্ধুলি থেকে উৎপত্তি।এটি বিশ্বের সবচেয়ে গুরুত্বপূর্ণ ফসলগুলির একটি হওয়াছে।'
  veg.pumpkin:
    label: টমেটো
    summary: খুব বড় ইউরঙ্গী ঘূর্ণিঝাষা খাবার ; হ্যালৌওঈন ও শরত্কালীন রান্নার প্রতীক।
    info: "টমেটো কিউকারবিৎসা ম্যাক্সিনা অথবা পেপোর একটি ফল।\nএতে বিটা-ক্লুচন ও ভিতামিন A আর Cয়ের ধরণগুলো থাকে। \nহ্঍যালৌওইন ছড়াছড়ি হওয়ার ঐতিহ্য (জ্যাক-অফ-ল্যাণ্ডার)\nআইরল্যান্ডের শৈশবদিন গৃহীত চিঠি দ্বারা জানা হয়।"
  veg.radish:
    label: রাদিশ
    summary: খুবই ঢিলে লাল রঙের সবুজ ফলে এবং স্বাদ এবং শীতকালীন সভ্যতা
    info: "রাদিশ একটি Raphanus Sativus প্রজননের কোমলতা।\nছোট বাগানের মধ্যে সবুজ হয় লাল ;এগুপী জাতীয় অথচ ঠাণ্ডা আসে ছোট থেকে চওড়া ও ধূসর ফলে। \nফলে ইহা ভাষণ উদ্ভিদ খাদ্য ঘটিত ট্রাঞ্চ ঐশ্বরিক ঈষৎ ঝাঁঝ আছে।"
  veg.spinach:
    label: শ্বেতলা
    summary: আইরণে অভিজাত গাঢ় শঙ্খচক্ষী কাপড়
    info: |-
      শ্পিনাচ মধ্যযুগের ফারসি থেকে উৎপন্ন।
      এটি ভিটামিন K, A, C, এবং লৌহ সমৃদ্ধ।
  veg.spring_onion:
    label: শীতকালের পিয়াজ
    summary: বাদামী ঢেউ এবং সবুজ ষ্ঠা সহ একটি সৈথিল পিয়াজ ; স্যৌৎসে ব্যবহার
    info: "শীতকালের পিয়াজ (অ্যলিউম ফিসটুলসাম বা অ্যলিওয়ান চেপা)-এখনও আধা গড়িয়ে না হওয়াভাবেই কাটা ধরণ।\nএটি একদম শহরগোছের ছোট রঙচূনি থাকে তবে খুব জ্বালাই ভাব দেয় না। \nআফগান রান্নাঘরে ডিশের ঝোঁপে বা স্যৌৎস এবং সূপে ব্যবহার করা হয়।"
  veg.squash:
    label: অঙ্কুরভৃৎ
    summary: উষ্ণ ঠাণ্ডা আলুহস্তি; গৌধ ষ্টৈফ ঢাঙ্গ স্বাদের মৌসুমী শাক.
    info: "শীতকালের আলูহস্তি (পিটা), বটারনিউট, একর্ন, ডেলিকাস্‌ ও খবচঘেয়ে প্যাচ।\nএগুলি শক্ত ছাই দিয়েছে মাঝখানে অথবা জমা থাকতে হয় গোটা শীতকালের জন্য। \nআইওডি঩, ভিটামিন এ, সি এবং ফজলদণ্ড ধরা রয়েছে।"
  veg.swede:
    label: টুরিন
    summary: '''ফিফ্‌থ''-হাগগিস ঘনিষ্ঠ'
    info: |-
      টুরিন হল (ব্রাসিৎকা এনাপাউস), কচি আমেওয়ড়া ও মূল।
      এই গছগোষ্ঠীতে শপথ দেখা যাবে;
      অধিকাংশ অ্যাটলাণ্ডিতে 'রুটাভাজ' ছাড়া চলে না,
      আর ইউরোপের উত্তরভাগে খুব লজ্জা থাকে।
  veg.sweet_potato:
    label: ব্যাঙ্গড়া
    summary: অফূগণি হলৌদ ছাড়া জামা খাঞ্ঘি
    info: "\"ব্যাটাৎ\" দক্ষিণ আমেরিকা'য় উতপন্ন।\nএটি বোটালজিতে শুধুমাথা পটাঠলের সঙ্গেই মিলছে এখনও অসদশ্চর্যা রয়েছে। \nআহারে ভিটামিন ও ফাইবারে ধনী।"
  veg.taro:
    label: তালৈও
    summary: একটি শ্বেতসারজাতীয় অঙ্গুলি থাকা টারো ঘন ঢাকনো ঝাঙ্গি ; ঊষ্ণ ক্ষেত্রে ঐ জাতীয় খাদ্য জাতীয় ফসল।
    info: তারোগা হল Colocasia escutentiaর একটি উষ্ণমণ্ডলীয় কন্দ। পুলিনেশিয়া, আফ্রিকা ও মধ্যপ্রদেশে বহুবছর ধরে চাষ হচ্ছে। ইহা সাভাগৌড় খাদ্য জাতীয় ফসল।
  veg.tomato:
    label: টমেটো
    summary: লাল ফল যা সবজি হিশেবে ব্যবহার করা হয়
    info: টমেটো গাছপ্রতিককেরাৎসি বংশজ।এখনও এইভাতে লাইকুয়েন ও ভিটামিন-C পড়ে
  veg.turnip:
    label: rutabaga
    summary: ফুলচন্দন - ঐতিহ্যবাহী মধ্য ইউরোপীয় খাবার
    info: "\"Rutabaga\" একটি মূলশাকের প্রজন।\nএটা ইউরোপে আমদানিতে বড় গাজরগুলোর চেয়েও অধিকতর সহজভাবে উৎসব হিসেবে খাওয়া শুরু হইছিল। \nআমরা ভিটামিন-C , দৃঢ় যৌথ ফলক থেকে ছাড়া পাঠাষণ ঘটিত ধাতু এবং ঝীল পাই।"
  veg.watercress:
    label: রেঁশিচা ওডনালি
    summary: খুবই ছোট অন্ধকার সবুজ ঝাঙ্গা ঢেউ জলের নদী
    info: "রেঁশিচা ওডনালি( Nasturtium officinale ) ঠান্ডা পোকারওপর এবং উৎসগুলোতে বেড়ে।\niটি তীব্রভাবে মরিয়মাছির স্বাদযুক্ত কাশিগুণ আছে জৈব অঙ্গজ ঘটক হিসাবে ভৌগোলিক ফল থেকে ধারণ করে। \nএটি খনিজদ্রব্য ইউচি , টি এবং বিষ্ণু -কারোটেন দ্বারা ঐষধী হয়।"
  veg.yam:
    label: জাম
    summary: অঙ্গুলি দ্বারা ঐচ্ছিক পথে ঊর্ধ্বগামী উষ্ণকণ্ড উদ্ভিদ
    info: "জাম হলো আফ্রিকা, এশিয়া ও ভেসপিরিসয়নদের উষ্ণকণ্ড অবস্থিত Dioscoria প্লান্ট।\nএটি বাইগনিলতেও ছুটছে— জাম শুষ্ক, চিষ্ঠমধ্যহইন এবং খুব দৃঢ়ভাগী। \nআউটে ফলে ঘড়ি ধরে ঝুলে থাকে।"
  veg.zucchini:
    label: আঙশীজাম্‍
    summary: অথচ অণূ থেকেই শৃষ্টি
    info: কুমেটা হল Cucurbita Pepo -এর একধরন। ইহাকে গ্রিনবিৎস বা সাদা আখতেওয়া পদ্ধতিতে চাষ ও উপভোগ করা যায়।
