lang: bn
pivot: false
title: সবজি
cards:
  veg.broccoli:
    label: ব্রুস্কলি
    summary: চর্বিয়ক স্টেমে ঘন ফুলের মাথা নিয়ে একটি লতে শাক।
    info: ব্রোকোলি আইতালিতে উৎপন্ন হয়েছে এবং ভিটামিন সি, কে এবং অ্যান্টিওক্সিডেন্টগুলির জন্য খুব ধনী। এটি গাছের পরিবারের একটি সবজি।
  veg.carrot:
    label: মরটা
    summary: নারং কেবুজ গাছের মিষ্টি স্বাদ।
    info: মরটা একটি দ্বিবার্ষিক উদ্ভিদ যা রসযুক্ত নারং ফলন জন্য চাষ হয়। এটি প্রোভিটামিন এ অথবা বিটা-ক্যারোটেন এবং আহার ফাইবারে ধনী।
  veg.corn:
    label: মকরধান্য
    summary: গোলাপি ফসলের সারিবদ্ধ কনা থাকে।
    info: মকরধান্য মধ্য আমেরিকা হতে উৎপন্ন এবং তা আজকে অন্যতম জনপ্রিয় ফসল। এটি শর্করা, প্রোটিন ও ভিটামিন গ্রুপ-B দ্বারা সমৃদ্ধ।
  veg.cucumber:
    label: কাঁচা কোশাবেগন
    summary: একটি দীর্ঘ সবুজ শস্য যাতে ঠান্ডা এবং জলযুক্ত মাংসভাগ রয়েছে।
    info: তরমুজ হল উষ্ণ অক্ষাংশের ফল আঁটুর পরিবারের অধীনে। এটি 95% জল ধারণ করে, এটি খাওয়ার জন্য উপদ্রবহীন এবং স্যালাডে বা চাটনিতে ব্যবহার করা হয়।
  veg.garlic:
    label: লসনি
    summary: তীব্র সাদা বুদ্ধির প্রকট গন্ধের কিছু খাবারের মূল উপাদান।
    info: হাজার হাজার বছর আমলে লসনি রান্নায় তৈয়ারি ও ঔষধ হিসেবেও ব্যবহৃত হয়ে এসেছে। এটি অ্যালিচিন ধারণ করে, যার ব্যাকটেরিয়া ঘৃণা এবং প্রতি-অগ্নিক্ষয়ী বৈশিষ্ট্য রয়েছে।
  veg.mushroom:
    label: হাঙ্গি
    summary: একটি ধূসর-বাদামী চুপড়াযুক্ত হাঙ্গি, রান্নায় ব্যবহৃত।
    info: Agaricus bisporus প্রজাতির এই খাওয়া শৈবালের সমগ্র জগৎ জোখে অনেক বেশি ফলন করা হয়। এটি প্রোটিন, ভিটামিন বি এবং খনিজদ্রব্যে সমৃদ্ধ; এটি আউট থেকে অসংখ্য রান্নাঘরে ব্যবহৃত হয়।
  veg.onion:
    label: পেঁয়াজ
    summary: খাবার তৈরির জন্য স্পষ্টকণ্ঠে চিহ্নিত করা এবং গোলাপী শেতুরা ফল।
    info: স্থানীয়ভাবে খাওয়া অথবা আহারের উদ্দেশ্যে পেঁয়াজটি বিশ্বের সবচেয়ে বেশি চাষ করা সবজির মধ্যে একটি। এটি বিশ্বব্যাপী খাবারগুলি ঢেউ দেওয়ার জন্য ব্যবহৃত হয়; এটি ব্যাকটেরিয়া ধ্বংসের ক্ষমতা সম্পন্ন ফ্লাভনয়েড ধারণ করে।
  veg.pepper:
    label: পাপ্রিকা
    summary: চকচকে বর্ণময় সবজি, যাতে মধুর অথবা ঝালনাটে স্বাদ থাকে।
    info: পাপ্রিকা (Capsicum annuum) নামেও পরিচিত। এটি গৃহসজ্জা ও শাক উভয়ই হতে পারে। লাল পাপ্রিকার ভিটামিন-C এর পরিমাণ সবগুলো সবজির মধ্যে সর্বোচ্চ।
  veg.potato:
    label: পটাটো
    summary: বিশ্বজুড়ে অনেক খাদ্যের ভিত্তি হওয়া এক ধরনের গৃহস্থালির পণ্য।
    info: পটাটো উত্তর আমেরিকার অ্যান্ডেস অঞ্চল থেকে উৎপন্ন এবং সমগ্র বিশ্বের মধ্যে সবচেয়ে গুরুত্বপূর্ণ ফসলগুলির মধ্যে একটি। এটি শর্করা, ভিটামিন সি এবং পটাশিয়ামের একটি জনশক্তি হিসাবে কাজ করে।
  veg.tomato:
    label: টমেটো
    summary: এক ধরনের লাল গোলাকার ফল যা সবজি হিসেবে ব্যবহৃত হয়।
    info: টমেটো একটি বাউদ্ধানুগ ফল (ফলের প্রকার) তবে রসদখানায় এটি সবজি হিসেবে ব্যবহৃত হয়। এটি দক্ষিণ আমেরিকা থেকে আসে এবং এতে লাইকোপেন ও ভিটামিন সি রয়েছে।
