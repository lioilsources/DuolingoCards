lang: he
pivot: false
title: חלקים בגוף האדם
cards:
  body.ankle:
    label: עקיבה
    summary: מפתח שמחבר את העקב עם הברך; המקור לפציעות רבות.
    info: העקב הוא מפרק המחבר בין הרגל לברך ומכיל שלוש עצמות. הוא מאפשר תנועת רגליים כלפי מעלה ולמטה וכן התנגדות לתנועות צדדיות קלות. פיצוץ בעקבה הוא הפציעה הספורטיבית הנפוצה ביותר.
  body.arm:
    label: แขน
    summary: จากไหล่ถึงข้อมือ
    info: '팔은 어깨에서 손까지 이어지는 상지로 세 부분으로 구성된다: 팔뚝(상완), 전완부(경전근골절), 그리고 손이다. 약 30개 이상의 근육과 뼈 및 인대가 움직임을 가능하게 한다. 팔꿈치 관절에서는 팔뼈와 반骨干이 연결되어 있다.'
  body.back:
    label: הגבע
    summary: الجزء האחורית בגוף; קבוצה גדולה יותר משרירים.
    info: הגב הוא החלק האחורי של גוף האדם מהצוואר ועד לירך כולל את הגבשושיים (33 חוליות צווחת), שמכוסים על ידי שרירי הכתפיים והגבה. כאבי גבו הם אחת הסיבות הנפוצות ביותר להיעדרי עבודה.
  body.belly_button:
    label: עורית
    summary: צלקת שנוצרת במרכז האגן לאחר גישור החוט הרגלי
    info: העטרה היא צלקת המקום שבו מחובר חוט הבטן של העובר לאמו כדי לקבל תזונה. הצורה שלה - אם היא שקועה או מתרוממת - تعتمדת על הדרך שבה נ発現. העatra מספקת בית למיקרואורגניזמים ייחודיים; חוקרים זיהיו חיידקים אקראיים ומיוחדים שם.
  body.bone:
    label: עצם
    summary: רקמת חיבור קשה שמייצרת את הקסוס
    info: העצם הוא רקמה קשיחה המורכבת מחלקי עצמות ומלחים מינרליים כמו кальций ומagnezium. בקיסוס של מבוגרים יש 206 עמודי צלעות而在 tuổi trưởng thành còn trẻ em có hơn 300 xương vì nhiều cái sẽ mọc lại và kết hợp với nhau khi lớn lên. Tủy xương sản xuất hồng cầu, bạch cầu и tiểu cầu.
  body.brain:
    label: мозг
    summary: מרכז השליטה לגוף; מבנה ביולוגי самый מורכב ביקום.
    info: |-
      המוח האנושי שוקל כerca ל -קילוגרם ומכיל יותר מ -86 מליארד נוירונים
      הוא מחולק לשתי חצאים; הצד השמאלי של המוח управ את צד ימין של הגוף וההפך הוא верный.
      מозג צורך 20% מהאנרגיה הכללית בגוף למרות שהוא מהווה רק 2% ממשקל גוף האדם.
  body.calf:
    label: 랫ק
    summary: الجزء האחורי של הסاقة תחת הברך.
    info: הלטיק הוא שריר בחלק האחורי של הרגל הנמוכה בין הברך לכתף. השם המדויק שלו הוא גסטרוקנימיוס והוא מאפשר עמידה על קצות האצבעות והדקה בעת דילוגים. הלטיקה חשוב גם להחזרת الدم מהסاقיות לב.
  body.cheek:
    label: פינה
    summary: אזור שמן בצידי הפנים; מבטא רגשים דרך 붙ון.
    info: ה얼굴 הוא האזור על צדדיו של הפנים המכיל את העצמות הלחיות והשומן הרגשי. איריתם – סימני 붉ון בפנים – היא תגובה פיזיולוגיית אוטמטית לרגש כמו חרדה או עונג. פני תינוקים הם מכוונים להיות קטנים ושמamy יותר כדי לעורר רגשות דружתיים אצל ההורים.
  body.chest:
    label: חזה
    summary: الجزء הקדמי לגופו המכיל את הלב ולungs.
    info: הpectoralis הוא החלק الأمامي של גוף האדם הנמצא בין 목 השלב ומעיים הבטן ומוגבל על ידי צלעות, חזה ואגן הגב. החדר הזה מכיל איברים חיוניים כמו לב וכלי דם ריאניים. קשת הצלע מורכבת מזוגות של צלעות, עצמות האנוש והחלקים העליונים של עמוד العمود.
  body.chin:
    label: 颐
    summary: الجزء התחתון של פני האדם מתחת לשפתו התחתונית.
    info: ה颐 הוא החלק התחתון ביותר של הפנים המורכב מהסן התחתוני. لدى בני אדם颐 היא תכונה ייחודית בעולם החיות – חיות אחרות אינן מחזיקות בה. הסיבה שבגינה יש לנו颐 עדיין נמצאת בוויכוח מדעי.
  body.ear:
    label: אוזן
    summary: אורган חוש השמיעה בצד הראש.
    info: '{"hint":"הعضو המושמע על צד הראשה","info":"الأذن تلتقط موجات صوتية وترسلها كإشارات عصبية إلى الدماغ، كما تحتوي على جهاز التوازن.'
  body.elbow:
    label: עגול
    summary: 관절 펴는 팔의 중간 부분
    info: |-
      העגיל הוא אמצע החיבור בין הזרוע והיד מבחוץ
      הוא מאפשר גירור וסיבוב של יד זוויות שונות
      מעניין לדעת שהעור בעיגול אינו מכיל תאי מגע
  body.eye:
    label: عين
    summary: אורган חוש البصر כולל קרנית צבעונית.
    info: '{"hint":"הعضو החישה של הראייה","info":"העין האנושית יכולה להבחין בערך בـ 10 מיליון צבעים וצללי צבע שונים. הרשת מכילה מקלות לرؤية באור חלש וחוטי שיער לתיאום ראייתי לצבעים.","label":"عين","summary":"אורגון חוש הבصر עם קornea בצבע."}'
  body.eyebrow:
    label: חָבוּשׂ
    summary: שורש השיערเหนי כל אוגען הוא קריטיות לבטא את הפנים.
    info: الحاجبين هן שורת השיער מעל העין העליונה של כל עינו. הן חשובות לתקשורת невווטיבית - תנועת החבורה מבטאת טווח רחב יותר של רגשות. פונקציונית ה eyelashes מגינה על האuge מפני הזיעה וגשם.
  body.eyelash:
    label: רסנה
    summary: רשימה של שיערות מעוקלים שמגינים על האuge
    info: ресנות הן שערות קצרות ומעוגלות הנצפות לאורך קצה העין והנמצאות על עפעפיים. רסנות מגינות את הตา בפני אבק, זיעה ואובייקטים חיצוניים אחרים. אדם מבוגר יש לו בין מאה ל-150 ריסיות בעיפוד העליון ובינן חמישים עד семь וחמש בתחתון.
  body.finger:
    label: אצבע
    summary: אחד מחמישה אצבעות על ידידה; כל זרוע מורכבת משני אושלוש частויות.
    info: אצבע יד היא אחת מחמש האצבעות; אגודל יש لديه שני חלקי גידים ואחריות שלושה חלקים. כל אחד מאיתנו מקבל עשר אצבעות – תנועתן מאפשרת את היעילות ב拎东西、 מוזיקה וכתיבה. טביעי אצבע הםเอกריים לכל אדם.
  body.foot:
    label: רגל
    summary: الجزء السفلي من القدم، الذي نقف ونمشي عليه.
    info: '{"hint":"הסاق התחתונה שלרגל מתחת לברך","info":"הלבלב נושא את משקל הגוף ומאפשר הליכה על שתיים. יש לו כוויות רבות - 26 עצמות , מفاصل多达 33 ומאות שרירים וחוטי עצבים.","label":"רגל (לב לב)","summary":"חלק תחתון של רגליים בהם אנו עומדים והולכים."}'
  body.forehead:
    label: forehead
    summary: الجزء الأمامي من الجمجمة فوق الحاجبين؛ منطقة تعبير عن المشاعر
    info: |-
      הגוון הוא החלק הקדמי של череп מעל העיניים וниżeј מהקו השיער
      זהו אחד האזורים הנראים ביותר בביטוי רגשות; קמט额头 מבטא דאגה או חשש
      במehr תרבויות סימניות על forehead היו משמעותיות לתרבות כמו נשבע אמונים或将来的社會地位
  body.hair:
    label: שערות
    summary: סיבים הנצפים מהעורית בשורשי המרחוץ
    info: |-
      שיער הוא סיבים של קרטאין שגדלים מפוקולוס השיער ב머חץ הראש
      אדם ממוצע יש לו כ -100,000 תresses על ראשו; ביום נופל להם בין חמישים למאתיים מהם
      הוא גדל בערך 1.25 ס
  body.hand:
    label: '"יד"'
    summary: '{ "summary": "جزء של זרוע מסתיים בخمس אצבעות." }'
    info: '{"info":"היד האנושית היא כלי יוצא דופן עם אגודל יכולת היפוך. הוא מאפשר תנועות מוטוריות עדינות כמו כפל עפרון, צייר או חياול."}'
  body.head:
    label: 머ח
    summary: الجزء העליון בגוף שבו נמצא המוח וה חושים.
    info: ה머ח מכיל מוח, עיניים, אוזניים,⿓ schnitz⿒ ופה. המозг ב 먅 הוא מרכז השליטה של כל הגוף והוא מעבד את ההשפעות החושיות.
  body.heart:
    label: לב
    summary: שריר שמoving דם לכל גבורה ללא פוג暂停ת.
    info: '{"hint":"הعضو המכווץ דם בדרכו בגוף","info":"לב הוא שריר ריקן באורך כף היד שמתנדנד בממוצע 70 פעמים לדקה. לאורך כל חייך יumpt את الدم מרחק השווה לשלוש סיבובים של עולם הארץ.","label":"قلب","summary":"שריר מumpingדם בכל הגוף ללא הפסק."}'
  body.heel:
    label: עקב
    summary: الجزء האחורי הנמוך של גót השוק נושא את המשקל הכללי בגוף.
    info: העקב הוא העצם הגדול ביותר ברגל ומשדר את משקל הגוף במהלך הליכה או 서ת. עצם הירך מחובר לקוונמה של אخيلס והponsible על תפקוד מכאני חשוב.
  body.hip:
    label: бедро
    summary: אזור סובע בפין; המפרק הגדול ביותר נשאщий את המשקל של הגוף.
    info: |-
      הбедר הוא האזור סביב מفصل העצם הירחיים (articulus femoris acetabularis) שמחבר את עצמות הנ่อง עם골반。
      זהו אמצעי קשר כדוריות נושאת משקל הגוף במהלך הליכה.
      נשים יש בממוצע גבינה רחבה יותר מאשר לגברים בגלל לידה,
      m置换髋关节是骨科最常见的手术之一。
  body.jaw:
    label: челюсть
    summary: תנועת הפה והאכילה
    info: |-
      הסנ一口齿（下顎骨）是頭蓋骨中唯一可移動的骨骼。
      它允許咀嚼、吞嚥和說話的功能。
      tmj （颞頜關節） 是人體中最複雜的關節之一。 頏痛可能是由於磨牙或関節炎症引起的。
  body.kidney:
    label: 腎臓
    summary: 血液をろ過し尿を作り出すペアの臓器
    info: |-
      콩 모양의 쌍으로 배치된 신장은 복강 뒷부분에 위치한다.
      하루 약 180리터 이상의 혈액을 여과하고 하루 최대 1~2 리터의 소변을 생성하며 수만 개의 필터 단위인 세뇨관(신경)이 포함되어 있다.
      또한 혈압 조절 및 전해질 균형 유지와 적혈구 생산에도 관여한다.
  body.knee:
    label: אגן
    summary: המפרק הגדול של גלגלי השוק
    info: הירך הוא המفصل הגדול ביותר בגוף האדם ואחד מהמפלסים ה복קדיים ביותר. הוא כולל את האגן הפנימי והחיצוני, הדיסקים הגומי, החוטשים הצולבים וחוטי הצד שלו. מותאם ל נשיאת משקל הגוף במהלך הליכה וריצה.
  body.leg:
    label: нога
    summary: אגן תחתונה Starting from knee till ankle.
    info: הנוקשה מורכבת מהбедר, הרגל והסاق. היא מותאמת להליכה דו קרסתית ומכילה את שרירי הגב העוצמתיים ביותר (שריר הרבע). עצם הבידון הוא הארכה הארוכה והמתחזקת nhất בגוף.
  body.lip:
    label: שפה
    summary: אחת משתי החצאי המוצת של פתח העדשה.
    info: שפת הפה היא אחת משתי הרקמות הגמישה והשרירית שמסביבות את האליפוף. הן מכילות נוודות עצבים רבים וочויות רגישות רבה. צבע השפתיים מושפע מהדם הזורם בהן; שפות כחוליות עשויות להעיד על מחסור באוקסיגן.
  body.liver:
    label: كֶסַף
    summary: הג'ירaffe הגדולה במעי של הגוף; מעבד כימיה ביולוגי.
    info: הכבד הוא האיבר הפנימי הגדול ביותר ומשקלו עולה על קילוגרם וחצי. מבצעים יותר מ־500 פונקציות – מסנן דם, מייצר צלעון, סינתזת חלבונים וכותב גליקוגן. זהו האורגאן היחיד שיכול להתחדש לחלוטין מתוך רקמה שנשארה.
  body.lung:
    label: pľúca
    summary: אבר זוגי של חלל החזה המקבלออกסיגן מהهواء
    info: ה płice הן איבר זוגי ב空腔 של החזה המורכב ממליוני בליטות ריריות פולשניות (אליווליים). שטח פני השטח הכולל של האלויוולים באברי הפלוח הוא כ -70 מטר מרובע. אדם מבוגר נושם בין 12 ל -20 פעמים לדקה ומקבל 500 מ
  body.mouth:
    label: פה
    summary: פתח בפנים המשמש לאכילה, שתייה ודיבור.
    info: הפה מתחיל את תהליך העיכול - שיניו מטילות ועושות חתיכים, והסлюנות שלו פועלים על ידי פרוק כימי. זהו גם האבزار המרכזי לדבר ולתקשורת.
  body.muscle:
    label: 근육
    summary: 몸의 운동을 허락해주는 수축성 조직
    info: |-
      근육은 수축이 가능한 조직으로 몸의 움직임을 가능하게 합니다。
      인체는 체중의 약 40%를 차지하는 코스터(골격 근육)로 구성된 600개 이상의 근육을 가지고 있습니다。
      가장 강력한 근육은 저작근(masseter)이고 가장 작은 것은 중이에 있는 고막 인대입니다。
      근육에는 빌려쓰기용 골격근과 내부 기관에서 사용되는 평활근 그리고 심장을 위한 심근 세 가지 종류가 있습니다。
  body.nail:
    label: נח
    summary: פליטה קשית מקוורטין בסוף אגרופי ידיים ונעליים.
    info: נֵחוֹת הוא פליזה קשיחה של קוורטין בסיום כל אצבע ורגול. הם מכסים את האזור הרגיש באפסון ומגבילים טוב יותר חפצים קטנים. נחיתות בממוצע כ -3 מילימטר בחודש; הנחי על יד רастים מהרより מאלו שעל הרגלים.
  body.neck:
    label: צואר
    summary: חלק בגוף המקשר את הראש לגופה; מכיל כליเลือด חשוב.
    info: הצוואר הוא האזור ביןกะבוק הראש לصدر ומכיל שבעת העמודי השן הצוואיים. דרך הצלעות עוברותโครงיות חיוניות כמו עורקים, מנהיג המעיים, חוט דם והשדרה. במקביל יש שם שרשרת של 근육 that allow turning and tilting of the head.
  body.nose:
    label: אף
    summary: عضو השמיעה וה נשpiration במרכז הפנים.
    info: האף מסנן ומעלים את الهواء שנשpired ונעכר אותו. הוא יכול להבחין ביותר ממיליארד ריחות שונים והוא קשור קשר הדוק לזכרון ואלרגיות.
  body.palm:
    label: دalan
