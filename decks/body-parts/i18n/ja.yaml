lang: ja
pivot: false
title: 体の部位
cards:
  body.ankle:
    label: かんせっ
    summary: 脚部と下腿との結合に関与する関節；怪我が多い
    info: 足関節は、脛骨と距骨の間に位置し、ふくらはぎからつま先への接続を担う三つの骨によって形成される。この関節により、足裏が上下に動いたりわずかな横方向へ移動したりすることができる。捻挫（外反）した足首はスポーツで最も一般的なけがである。
  body.arm:
    label: arm
    summary: 肩から手首までの上半身
    info: |-
      腕は上肢で、三つのセグメントから成る：肩と手の間。この部位には運動を担う約30個以上の筋肉や骨格および腱が含まれている。
      humero（肱骨）という肘上の骨と前腕部に位置する尺骨・橈骨といった二種類の骨は関節によって結合されている。
  body.back:
    label: back
    summary: 体幹の背面；全身最大の筋肉グループ
    info: |-
      背中は首から臀部までの体幹後面です。脊柱（33個の椎骨）が筋肉に囲まれています。
      腰痛や肩こりなどの背部痛みは、仕事不能になる主な原因の一つとなっています。
      背中の主要な筋群には僧帽筋と広背筋があり、これらによって上半身で最も大きな筋グループを形成しています。
  body.belly_button:
    label: 臝
    summary: 臚帯が切断された後のお腹の中央部の瘢痕
    info: '{"hint":"おへそ（臍）の中央にある小さなくぼみや盛り上がった部分","info":{"label":"脐","summary":"母から栄養を受け取るために胎児がつながっていた臍帯を切り離した跡。","info":"臥室は、母親からの栄養分を取り入れるための臍帯に接続されていた傷痕です。その形態（凹んでいるか凸になっているか）は治癒方法によって異なります。臘には特有な微生物群集があり；研究ではユニークな細菌が確認されています。世界中の文化において臙は象徴的および精神的な意味を持っています。"'
  body.bone:
    label: bone
    summary: 体幹部を作る硬く結合性のある組織；造血を行う生きている器官
    info: 骨は、骨細胞と鉱物塩（カルシウムやリン）によって構成される硬い組織です。成人の人体には206本の骨がありますが、子どもではその数が300を超えます（多くのものが成長とともに融合します）。骨髄は赤血球・白血球および血小板を生成しています。
  body.brain:
    label: 脳
    summary: 体内の中枢部；宇宙で最も複雑な生物学的構造
    info: |-
      人間の脳は約1.4kgあり、86億以上の神経細胞を含んでいる。左右に分かれた半球から構成されており、左側が体の右側を制御し、その逆も同様である。
      全体重のおよそ2%しかないにも関わらず、全身エネルギー消費量のうち20％を使用している。
      痛みを感じない唯一の組織であり（痛覚受容器を持たず）、これは他のどの身体部位とも異なる特徴だ。
  body.calf:
    label: ふくらはぎ
    summary: 膝からくるぶしまでの下半身後面
    info: "{\"hint\":\"膝の下、脚裏側部分\",\"info\":\"ふくらはぎとは太ももの付け根からくるぶしまでのかかとのうしろにある筋肉組織です。\r\n主なふくらはぎの筋（腓腹筋）によりつま先立ちやジャンプ時の反発が可能になります。 \r\n足部からの静脈血を心臓に戻す循環において重要な役割を持っています。\r\n妊娠中の女性とアスリートではふくらはぎのけいれんが多く見られます。"
  body.cheek:
    label: 顔
    summary: 顋に位置する脂肪組織；羞恥などの感情によって紅潮することがあります
    info: 顔（頬）は、顎の両側にある脂肪と骨で構成された部分です。頬が赤くなる現象や感情表現として重要な役割を果たします。
  body.chest:
    label: 胸
    summary: 胸は心臓と肺を持つ胴体の前面部です。
    info: 胸郭は肋骨、 sternum（縦隔軟骨）、および脊柱によって囲まれた体幹の前側部分です。心臓や肺といった生命に必要な器官を保護しています。胸腔には12対の肋骨とsternum、そして胸部分の背骨が含まれます。
  body.chin:
    label: あご
    summary: 上唇より下方にある顔の最下部
    info: ヒゲの下は顎によって形成される、顔の最も低い部分です。人間には発達したあご（mentum prominence）があり、これは動物界で唯一見られる特徴であり、他の霊長類ではみられません。「chin up」という英語表現は楽観的な態度を促すために使われます。
  body.ear:
    label: 耳
    summary: 頭の側面にある聴覚器官。
    info: 耳は音波を捕らえ、それを神経信号として脳に送ります。また平衡感覚を司る装置（前庭系）も含まれています。
  body.elbow:
    label: '"elbow"'
    summary: 「Elbow」は、「弓（luk）から来ている」という意味で、腕を折りたためるように動かす関節のことです。
    info: |-
      {"hint":"上腕の中央にある関節","info":"肘は、前腕と下腿をつなぐ外側に位置する関節です。\n手首の曲げ伸ばしや回旋動作が可能になります。面白い点として挙げるべきことは、肘には触覚細胞がないことです。尺骨神経を通る打撃によって典型的な刺痛感を感じることがあります。
      "}
  body.eye:
    label: 目
    summary: 虹彩を持つ色を識別する感覚器官。
    info: 人間の目は約1000万種類もの色彩の微妙な違いを見分けることができる。網膜には暗所視に適した棒体細胞と、色を認識する錐体細胞が含まれている。
  body.eyebrow:
    label: 眉毛
    summary: 各眼の上の毛の帯；顔の表情にとって不可欠なものです。
    info: '{"hint":"目の上にある髪の帯","info":"眉毛は目のかさぶたの上の毛束です。\n非言語的なコミュニケーションにおいて重要な役割を果たし、眉の動きによってさまざまな感情表現を行います。\n機能的には汗や雨から目に守る働きがあります。","label":"眉毛","summary":"それぞれの目の上で顔の表情に重要である毛の帀。'
  body.eyelash:
    label: 睫毛
    summary: 瞼の端にある曲った毛で目の保護をしている
    info: |-
      まつ毛は、瞼の縁から生えている短くてカールした毛です。ほこりや汗、異物などによる目へのダメージを防ぎます。
      大人では上瞼に約100～150本、下瞼には約50〜75本あります。
      まつげ全体が再生されるまでにはおよそ4週間から8週間かかります。
  body.finger:
    label: 「hand finger」
    summary: 「右手に存在する五本の指の内の一本；それぞれに関節が三個ある。」
    info: |-
      {"hint":"手の五本の中指の一","info":"手指は5つのうち一つであり、親指には関節が二つあり他の三つがある。
      私たちは常に十本の指を持ち：それらを動かすことで道具を使うことや音楽と文字を作ることができる。
      指紋は人によって異なり一意である。
      触覚受容器が多くあるため、指は体の中で最も敏感な部分のひとつだ。"}
  body.foot:
    label: 足
    summary: 立ち、歩くための足の下部。
    info: 足は全体の体重を支え、二足歩行が可能にします。26本の骨、33個の関節と100を超える筋肉や腱、靭帯を持っています。
  body.forehead:
    label: 額
    summary: 眉毛上の頭部前面；感情表現用表面
    info: "{\"hint\":\"眉の上にある顔の部分\",\"info\":\"額は頭蓋骨の前側で、眉毛より上で髪が生えるラインよりも下に位置しています。感情表現において最も目立つ領域であり、しわを寄せた表情は不安や困惑を感じさせます。\r\n多くの文化では、この部位への印付け（誓約・身分）など象徴的な意味を持ちました。\r\n神経学的には、脳における上前頭葉と関係があり、計画的行動および意思決定に関与します。\",\"label\":\"額\",\"summary\":\"眉毛上の頭部前面；感情表現用表面\"}"
  body.hair:
    label: 髪
    summary: 頭部の表皮組織から成長する線状構造
    info: |-
      髪は頭皮の毛穴から生えているケラチン繊維です。人間には平均して約1万本の髪があり、毎日50〜100本が抜けます。
      月に約1.25cm伸びるといわれています。
      髪色を決めるのはメラニンという色素であり、白髪になる原因は毛根でメラニンを作らなくなることです。
  body.hand:
    label: 手
    summary: 腕の終わりにあり、五本の指がある。
    info: 人間の手は反対動作ができる親指を持ち、書くことや描くこと、縫うことができるような繊細な運動を可能にする非常に器用な道具である。
  body.head:
    label: 頭
    summary: 脳と感覚器官が含まれる体の上部。
    info: 頭には、脳、目、耳、鼻、口などが含まれています。頭にある脳は全身をコントロールする中枢であり、すべての感覚情報を処理します。
  body.heart:
    label: 心臓
    summary: 全身に血液を連続して送る筋肉。
    info: 心臓は握り拳大の空洞な筋肉で、平均的に毎分70回拍動します。一生を通じて、地球を三周する距離ほどの血液をポンプしています。
  body.heel:
    label: かかと
    summary: 立っているときに身体全体の重量を持ち上げる足の底部の部位です。
    info: '{"hint":"足の裏側後部","info":"踵（かかと）は、最も大きな足の骨です。\n立ち姿勢では体全体の重さの大半を支えています。\n踵の骨はアキレス腱に接続されています。\n足底痛や炎症性疾患である足底筋膜炎がよく見られる症状です。","label":"かかと","summary":"立つときには全身の体重を受け持つ、足の下にある部分です。}'
  body.hip:
    label: 腰
    summary: 体全体の重さを受け持つ最大級の荷重用関節である骨盤周辺領域
    info: 太ももの付け根の関節（大腿骨と股関節）は、歩行時に体重を支える球状の関節です。女性の場合には出産のために男性よりも平均的に骨盤が広い傾向があります。人工膝関節置換術は整形外科で最も一般的な手術の一つとなっています。
  body.jaw:
    label: あご
    summary: かじるときとしゃべっているときに動きを生む顔面の低い部分の骨
    info: |-
      顎（下顎骨）は頭蓋骨の中で唯一動くことができる骨です。噛み、飲み込みや話すことを可能にします。
      tmj(颞下颌関節)は体の中でもっとも複雑な関節の一つであります。顔の痛みは歯ぎしり(bruxismus)または関節炎によって引き起こされることがあります。
  body.kidney:
    label: 腎
    summary: 血液をフィルタリングして尿を作るペアの器官
    info: |-
      腎臓は、腹部の後ろ側に位置する豆のような形をした一対の器官です。
      毎日約180リットルもの血液を通し、尿として1〜2リットルを作り出します。また、それぞれが百万以上の濾過単位（ネフロン）を持っています。
      腎臓には血圧調整や電解質バランス維持および赤血球生成といった機能があります。
  body.knee:
    label: ひざ
    summary: 太ももの下とすねとのつながっている身体最大の関節
    info: |-
      {"hint":"ふくらはぎの中央にある関節","info":"膝は人間の体で最も大きな関節であり、複雑な構造を持っています。
      それは大腿骨頭蓋部（つぼみ）、半月板、十字靭帯および側副靱帯から成り立っています。
      これは歩行や走る際における体重を支えるために適応しています。
      膝の怪我はスポーツ事故の中で非常に一般的です。","label":"ひざ","summary":"太ももの下とすねとのつながっている身体最大の関節"}
  body.leg:
    label: ' нога'
    summary: 膝蓋骨からつま先までの下半身
    info: |-
      脚（下肢）は太ももの大腿骨、ふくらはぎの脛と腓従骨、足裏を含む。これは二本足での歩行に適応しており、体の中で最も強力な筋肉である四頭筋を持っている。
      股関節からくるぶしまでが含まれる。
  body.lip:
    label: くちびる
    summary: 口を開ける際につなげるふたつの軟部器官
    info: |-
      唇は、口を囲む二つの柔らかい筋肉組織の一つです。多くの神経終末が存在し非常に敏感であるため触覚に適しています。
      色調は血液循環によって決まります；紫がかっていると酸素不足かもしれません。
      表情やキスだけでなく子音「ｐ」「ｂ」「ｍ」などの発声にも重要な役割を持っています。
  body.liver:
    label: 肝臓
    summary: 体の中で最も大きい内部器官；身体の中での化学工場です
    info: '{"hint":"腹部にあり血液をろ過する大きな臓器","info":"肝臓は体内最大の内蔵で、重さが1.5kg以上あります。\n約500もの機能を持ちます：血中の毒素を取り除き、胆汁を作り出し、たんぱく質を合成し、グリコーゲンとしてエネルギーを蓄えています。\n他のどの器官よりも残った組織から完全な再生ができる唯一無二のものです。\n大量のお酒や毒物によって門脈症候群（いわゆる「脂肪肝」）などの病気になります。");'
  body.lung:
    label: 肺
    summary: 空気中の酸素を取り込むための胸腔内の一対の臓器
    info: 肺は胸腔内の対器官であり、何百万もの気胞（アルベオロ）から成っています。肺の全体表面積は約70平方メートルです。成人の人間は分速で呼吸を12回〜20回行い、それぞれ息ごとに大体500ミリリットルの空気が取り込まれます。
  body.mouth:
    label: 口
    summary: 食べ物や飲み物を取り込み、話すための顔の開口部。
    info: 口は消化プロセスを開始する入り口です。歯で食物を噛み砕き、唾液がそれを分解します。また、言語とコミュニケーションの主な手段でもあります。
  body.muscle:
    label: muscle
    summary: 身体運動のために収縮できる組織
    info: |-
      筋肉は収縮可能な組織であり、体の動きを可能にします。
      人間には体重のおよそ4割を占める約600個以上の筋があります。最も強力なのは咬筋（マスセター）で、最小のものは中耳にある錘骨筋です。
      筋肉は三種類あり：随意的な「横紋筋」、内臓器官に関与する「平滑筋」と心臓専用の「心筋」が含まれます。
  body.nail:
    label: 爪
    summary: 手と足の指先についた堅いケラチン製プレート
    info: |-
      爪は、各指の先端にある角質からなる硬い板です。感覚的な指尖を保護し、小さな物を持ちやすくします。
      平均して毎月約3mm成長しており、手足に比べて手指の方が速く伸びます。
      爪の状態には健康情報が反映されており、白斑や溝、色調変化などが病気のサインになることがあります。
  body.neck:
    label: くび
    summary: 頭から胴体へつなぐ身体部分；命に関わる血管などを内包している
    info: |-
      首は頭蓋骨と胸の間にある領域で、７つの頸椎を含んでいる。生命に必要な構造物が通っている：動脈・食道・気管および脊髄である。また、頭部を回転させたり傾けたりするための筋肉群も含まれている。
      キリンには人間に同じ数（七つ）の頚椎がある。
  body.nose:
    label: 鼻
    summary: 顔の中央にある匂いや呼吸の器官。
    info: 鼻は吸入する空気をろ過し、温め、湿らせる役割を持っています。10億種類以上のにおいを区別でき、記憶や感情と密接に関係しています。
  body.palm:
    label: 掌
    summary: 手の中でも最も多くの感触を感じ取れる部分
    info: |-
      {"hint":"手の内側の平らな表面","info":"掌は指と手首との間にあり、非常に密接した触覚受容器（マイセン体）を持つ。
      掌には毛包や皮脂腺が存在しない。
      占いとして行われる手掌相撫（キロマントリー）は古代からある運命を線に読む習慣である。"}
  body.shoulder:
    label: 肩
    summary: 身体で最大の可動域を持つ、腕と胴体との接合部となる関節です。
    info: 肩関節は、上腕骨の頭と鎖骨の窪みによって形成される球臼型の関節であり、体の中で最も大きな運動範囲を持っています。しかし不安定であるため脱臼しやすい傾向があります。「回旋筋群」と呼ばれる一連の筋肉がこの関節を安定させます。
  body.skin:
    label: かわら
    summary: 身体で最も大きい器官；保護・温度調整および感覚
    info: |-
      皮膚は人間の体の中で最大のおもいであり、約2平方メートルを覆っている。感染症や紫外線から守る働きがあり、体温調節と触覚を感じ取ることに役立つだけでなくビタミンDを作り出す機能もある。
      外側の層が更新されるにはおよそ2〜4週間かかる。
  body.spine:
    label: 腰
    summary: 髄液を守りながら身体を支えている33節分の脊柱です。
    info: '{"hint":"背中の脊柱をなす椎骨の列","info":"腰は頭蓋と仙骨をつなぐ、計33個からなる椎骨の列である。\u005Cn髄液を保護し、体全体に主たる支持を与える役割がある。\u005Cn各々の椎骨間には衝撃吸収材として働く椎間板が存在する。\u005Cn自然的な湾曲（前弯・後弯）は直立歩行への適応だ。","label":"腰","summary":"髄液を守りながら身体を支えている33節分の脊柱。"'
  body.stomach:
    label: おなか
    summary: 胸部以下の胴体前面部；俗称として「胃」も指す
    info: "{\"hint\":\"腹部；腹の領域\",\"info\":\"おなかは、胸と骨盤との間に位置する体の前側部分です。\r消化器系：胃・腸・肝臓・膵臓および脾臓を含みます。 \r腹筋（腹部）は脊柱を安定させ器官を保護します。\r胃袋(gastrum)とは消化システムにおける筋肉質な臓器のことです。"
  body.temple:
    label: temple
    summary: 額の両サイド、頬の上にあるやわらかな区域
    info: |-
      テンプルは、頬の骨（顎）と耳の前の頭部側面にある領域です。
      解剖学的にここはより柔らかい部分で、衝撃に対して脆弱なスカモーズ構造を持っています。
      太い動脈である颞动脉が鼓動を感じ取ることができます。
      咀嚼に必要な筋肉である庁下筋もこの部位についています。
  body.thigh:
    label: thigh
    summary: 足の付け根から膝までの部位；最大級の筋肉を持つ
    info: |-
      太ももは股関節と膝の間にある下肢部分です。身体の中で最も強力な筋肉群である大腿四頭筋（だいたいとうたつきん）やハムストリングスを含んでいます。
      ふくらはぎ骨（腿骨、フェメル）は体の中でもっとも長くて丈夫な骨であり、これが損傷すると移動能力が大きく制限されます。
  body.throat:
    label: 喉
    summary: 口腔から食道および気管へつなぐ腔
    info: |-
      喉頭（のど）は、鼻と口の後ろにある空気や食物を通る空間です。免疫システムの一環として扁桃腺を含んでいます。
      喉反射によって異物が誤って吸入されることが防かれます。
      咽頭炎や喉の炎症などは子どもによく見られる病気です。
  body.thumb:
    label: 親指
    summary: 厚くて短い手の第１指；親指の反対運動により握りが可能になる
    info: 親指は、手の第一関節が短く太いことで他の指と対照的に動かすことができる。この反対動作（オポジション）によって道具を操作する人間特有の適応能力を得た。進化の中で発展し、チンパンジーなどの霊長類にのみ見られる。
  body.toe:
    label: 足の指
    summary: 足には5つの中で重要な役割を持つのが親指です；特に歩くときに重さを受け持ちます
    info: "{\"hint\":\"足の五本ある指の一つ\",\"info\":\"脚趾は、人の足に存在する5つの指状突起器官である。大拇趾（ hallux）は歩行時のバランスと推進力にとって重要であり、体重のかかる最も大きな部分を担っている。\r\n\");\r\n\r\n人間の大拇趾は霊長類のように対向動作を行うことができない。\r\n健康的な足の爪の状態は全体的な身体健康度の目安となる。"
  body.tongue:
    label: 舌
    summary: 口の中にある味や咀嚼・語りをするための筋肉組織
    info: 舌は味蕾（約一万個）で覆われた筋肉の器官です。甘さ、塩辛さ、酸っぱさ、苦み、そしてうま味という五つの基本的な味覚を識別します。言葉を発する際の音声形成に不可欠であり、飲み込む動作にも役立ちます。また、体の中で最も速く動ける筋肉でもあり、時速百キロメートルを超える速度での動きも可能です。
  body.tooth:
    label: 歯
    summary: 食べ物をかむために口の中にある硬い構造
    info: |-
      歯はエナメル質（体の中で最も硬い組織）、象牙質、および髄腔からなる硬い構造です。人間の永久歯には全部で32本あります。一度失われたエナメル質は再生されませんので予防が重要になります。
      人類史上最も古い保存された歯は二百万年以上前からのものであり進化を再現する助けになっています。
  body.vein:
    label: '"靜脈"'
    summary: 脱酸素された血液を心臓へと導く管；特に手首部分では見られる。
    info: |-
      {"hint":"心臓に向かって血液を運ぶ血管","info":"静脈は、体から戻ってくる血を集めて心臓に送る役割を持つ。
      動脈とは異なり、静脈には逆流防止の弁が備わっている。
      手首で見える青白い色調は光学的効果であり、実際の中身の血液は暗赤ではなく紫色である。
      つまら（れん）じようなどもこの弁機能障害によって引き起こされる。"}
  body.wrist:
    label: 手首
    summary: 手と前腕を結ぶ関節であり、細かい運動能力にとって重要です
    info: 手首は、8つの小さな骨（掌骨）によって形成され、腕と前腕をつなぐ領域です。この構造により、4方向への動きや回転が可能になります。「カルパルトンネル症候群」の原因となる狭い通路である「カルパルトンネル」という管があります。脈拍を感じ取るには内側に位置する部分で簡単に確認できます。
