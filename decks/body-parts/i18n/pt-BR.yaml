lang: pt-BR
pivot: false
title: Partes do corpo
cards:
  body.ear:
    label: ouvido
    summary: Órgão sensorial para audição no lado da cabeça.
    info: O ouvido capta ondas sonoras e as transmite como sinais nervosos para o cérebro. Também contém o aparelho vestibular responsável pelo equilíbrio.
  body.eye:
    label: olho
    summary: Órgão sensorial para visão com íris colorida.
    info: O olho humano consegue distinguir aproximadamente 10 milhões de nuances de cor. A retina contém bastonetes (para visão em baixa luminosidade) e cones (para visão em cores).
  body.foot:
    label: pé
    summary: Parte inferior do pé sobre a qual nos apoiamos e caminhamos.
    info: O pé suporta o peso inteiro do corpo e permite a locomoção bípede. Ele possui 26 ossos, 33 articulações e mais de 100 músculos, tendões e ligamentos.
  body.hand:
    label: mão
    summary: Parte do braço terminada com cinco dedos.
    info: A mão humana é uma ferramenta excepcionalmente ágil com polegar capaz de oposição. Permite movimentos finos como escrever, desenhar ou costurar.
  body.head:
    label: cabeça
    summary: Parte superior do corpo onde está localizado o cérebro e os sentidos.
    info: A cabeça contém o cérebro, os olhos, os ouvidos, o nariz e a boca. O cérebro na cabeça é o centro de controle do corpo todo e processa todas as sensações dos sentidos.
  body.heart:
    label: coração
    summary: O músculo que bombeia sangue continuamente por todo o corpo.
    info: O coração é um músculo oco do tamanho de uma mão fechada e bate em média 70 vezes por minuto. Ao longo da vida inteira, ele bombeará sangue numa distância equivalente a três voltas ao redor da Terra.
  body.mouth:
    label: boca
    summary: Abertura no rosto usada para comer, beber e falar.
    info: A boca é o início do processo digestivo – os dentes mastigam, enquanto a saliva ajuda na decomposição dos alimentos. É também uma ferramenta principal para comunicação por meio da fala.
  body.nose:
    label: nariz
    summary: Órgão do olfato e respiração localizado no centro do rosto.
    info: O nariz filtra, aquece e umidifica o ar inspirado. Consegue distinguir mais de um bilhão de cheiros diferentes e está estreitamente ligado à memória e aos sentimentos.
