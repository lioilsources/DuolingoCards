lang: ur
pivot: false
title: جسم کے حصے
cards:
  body.ear:
    label: کان
    summary: سرو کے ایک طرف سناہٹنے کا حسگانہ آلہ۔
    info: کان آواز کی لہریں قبول کرتا ہے اور انہیں عصبی نشانات کے طور پر دماغ میں منتقل کرتا ہے۔ یہ برابری کا نظام (ویسٹیبلار سسٹم) بھی رکھتا ہے۔
  body.eye:
    label: نکتہ
    summary: ایک حس کا آلہ جو رنگین پٹی والے نکتہ سے دیکھتا ہے۔
    info: انسانی آنکھ تقریباً 10 ملین رنگ کے شدید فرق کو پہچانتی ہے۔ روشنی کے ذریعے دیکھنے کے لئے چمکدار اور رنگارنگ دیکھنے کے لئے چوبند شامل ہوتے ہیں۔
  body.foot:
    label: پیر (چودیدلو)
    summary: وہ جگہ جس پر ہم کھڑے رہتے اور چلتے ہیں
    info: ایک پیر سارے بدن کا وزن برداشت کرتا ہے اور دو قدموں پر چلنے کی اجازت دیتا ہے۔ اس میں 26 ہڈیاں، 33 جوائنٹس اور 100 سے زائد ماسلون، لائگامانٹس اور ٹینڈنز شامل ہیں۔
  body.hand:
    label: ہاتھ
    summary: 팔 کا حصہ جو پانچ انگلیوں سے ختم ہوتا ہے۔
    info: ایک انسانی ہاتھ مخصوص طور پر توانا آلہ ہے، جس میں دانت کی قابلیت رکھنے والی انگلی موجود ہے۔ یہ نرم حرکتوں کی اجازت دیتا ہے، جیسا کہ لکھنا، نقاشی یا سیّت۔
  body.head:
    label: سر
    summary: جسم کا اوپری حصہ جس میں دماغ اور حواس موجود ہوتے ہیں۔
    info: سر میں دماغ، آنکھیں، کان، ناک اور منہ شامل ہوتے ہیں۔ سر کا دماغ پورے بدن کا مرکزی نظام چلاتا ہے اور تمام حسی تجربات کو پروسیس کرتا ہے۔
  body.heart:
    label: دلو
    summary: دلو ایک سارا جسم میں خون کو پمپ کرنے والے عضلات کا آلہ ہوتا ہے۔
    info: دلو فسٹ کے سائز کا ایک گھنا عضلاتی آہو ہوتا ہے، جو عام طور پر منٹ میں 70 بار دھڑکتا ہے۔ زندگی کے دوران دلو خون کو تین زمینوں کے چکروں کے برابر فاصلے تک پمپ کرتا رہتا ہے۔
  body.mouth:
    label: منہ
    summary: چہرے پر کھانے، پینے اور بولنے کیلئے استعمال ہونے والا سوراخ۔
    info: منہ پکڑنے کا عمل شروع کرتا ہے - دانت کھانا توڑتے ہیں جبکہ آنسو اسے تحلیل کرتے ہیں۔ یہ بولاوٗ اور رابطے کا مرکزی آلہ بھی ہوتا ہے۔
  body.nose:
    label: نose
    summary: چہرے کے درمیان میں واقع خوشبو اور سانس لینے کا آلہ۔
    info: نوک نفخ کردہ ہوا کو فلٹر، گرم اور مرطوب کرتا ہے۔ یہ ایک ارب مختلف خوشبوعون کو پہچانتا ہے اور ذہنی حافظہ اور جذبات سے قریبی تعلق رکھتا ہے۔
