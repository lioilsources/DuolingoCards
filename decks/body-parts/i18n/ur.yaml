lang: ur
pivot: false
title: جسم کے حصے
cards:
  body.ankle:
    label: کُونِ尼克
    summary: اس جوائنٹ کا مقصد چھودیدلو کو بائرسنگ سے منسلک کرتا؛ یہ عمومًا زخمی ہوا ہوتا ہے۔
    info: کوتینیک اس جوائنٹ کا نام ہے، بیرنگ فرط سانپچل میں تین ہڈیوں پر مشتمل۔ یہ قدموں کو اوپر اور نیچے حرکت دینے سمیت خفیہ جانبی حركةٗ کی اجازت دیتا ہے۔ زخمی شدہ کوتینک (ایکزوسائنس)، عام طور پر ورزش کے دوران آسانی سے متاثر ہوجاتا ہے۔ عقاب کی رجڑ لازمی طور پر انچار کی ہڈی کے قریب کوتينك کے علاقے میں اختتام پذير ہوتی ہے。
  body.arm:
    label: باقاعدہ طور پر
    summary: بالائی ہاتھ والی لمبائی ہدایت سے شروع ہوا
    info: ہاتھ ایک اوپر کا حصہ ہے جو تین سطحوں میں تقسیم ہوتا ہے، براڈ آرم، فور-arm اور ہتھ۔ چند دسوں عضلات، ہڈیوں اور رشتوں پر مشتمل ہونے کے باعث حرکت حاصل ہوسکتا ہے۔ بالائی گڑّن (ہومرس)، نصف ٹانگ (رداس اور ولنا) کی ہڈیاں الائن اندر کول لازم ومل ضرب زخمی ہوجاتی ہیں۔
  body.back:
    label: پیٹھ
    summary: جسم کا پِچھلوں حصہ؛ جسم کا سب سے لمبوں عضلّاتی حلقہ
    info: پیٹھ تراوُن کا پِچھلا حصہ جسم میں نکتے سر اور گلبلوؤس فینکس کے درمیان واقع ہوتا ہے۔ ان میں رَقْب، جو ۳٣ آستروائڈ شامل ہیں، موڑ دار عضلات سے گھیر لئے ہوئے ہوتے ہیں۔ بدن کے بالشت زخم عام طور پر غائب ہونے والی صلاحیتوں کی وجہ بناتے ہیں۔ پیٹھ کے عضلّات (ترافزوم اور لاٹسسموس دورسو)، اوپری جسم کے سب سے لمبا عضلّاتی حلقہ تشکیل دیتے ہیں۔
  body.belly_button:
    label: ناf
    summary: ایک شخص کے آلاتِ حرارت کے درمیان موجود چربی کا خط
    info: "پیٹ کے مرکز میں اُبھری ہوئی جگہ، ناف علامت والدین سے غذا حاصل کرنے والے پیشاب کانچن کے بند زخم کا باقاعدہ حصّہ ہوتا ہے۔\nاس کا شکل (غیر فعال یا تابع) صحت مند طور پر خشک ہونے کے قابل ذمہ دار ہوسکتا ہے。\nnaf علامت انفرادی ماکرو بلحاظ تنوع؛ رicerche واحدات بالخصوص باکتریائی ثبت کردی ہیں۔ \nعالمی مختلف تمدنوں میں، نف علامت معنوی و علمی مقام کا حامل ہے۔"
  body.bone:
    label: عظیم
    summary: جسم کی ہڈی کے نظام تشکیل دینے والا مواد
    info: ہڈی اکھر کے سلسلے میں بننے والی جامد بافتوں پر مشتمل چرب تقریباً نمکوں (کلسیم، فاسفورس)۔ بالغ حالت میں آدمی کا ہاران بدن ۲٠۶ عظائم رکھتا ہے؛ لڑکا ان کی تعداد ۳ٰٗ سے زائد رکھتات ہے(بہت سی شامل ہوتی ہیں )۔ ہماری دُردِ خون کے تمام قسم کے شاخدار خلاصہ وجود لاٹي ہے۔ گودنا اصل میں زندہ ہوتا ہے ؛ واقعی طور پر دائمی استحکام اور توڑنے کے بعد صحت لوٹائی ہے
  body.brain:
    label: دماغ
    summary: جسم کا مرکز؛ کائنات میں سب سے زیادہ پیچیدہ تناسخی بنیاد
    info: |-
      انسانی دماغ کے وزن تقریباً ایک فرنچائس کلوگرام جبکہ ان میں سترھویں عدیدہ نرون موجود ہوتے ہیں۔
      dماغ دونوں شعور پر مشتمل ہوا، بائیں جانب دائروں کام لیندا وائسرسا。
      دماغ صرف ٢٪ وزن روزمرہ کار خود کو حفظ کرتا ہے تو بدن کی طاقت کا ۲۰٪ استعمال کردتا ہے۔
  body.calf:
    label: غلط
    summary: ران اور پیر کے درمیان جسم کے نچلے حصہ کا آخری حصہ
    info: گھٹیا جسم کے نچلے حصہ میں ران اور پیر کے درمیان سامنے والی عضو آلات حسّاس ہوتی ہے۔ لاترنسئوس، گھٹی کا مرکزی عضلہ شمع تک رسائی دینے اور قومت وقت فرش پر زور دینے کی اجازت دیتا ہے۔ گھٹی خون کے واپسی کے نظام میں بڑا روایتی عنصر ہے۔ ورزش کرنے والوں اور حاملہ خواتین میں عام طور پر گھٹی کے تناؤ کی وجہ سے غصّہ ہوجاتا ہے۔
  body.cheek:
    label: چہرا
    summary: چہرے کے دونوں جانب موجود موذول علاقوں کا ذکر ہے؛ جو حالات کا تعزاز کرتے ہیں۔
    info: |-
      چہرے کی جگہ انسانوں کا وہ علاقہ ہوتا ہے، جس میں لکڑی سے بنا ہوا ٹشو اور تیل والے حصّے شامل ہوتے ہیں۔
      چہروں پر رنگ بدلتا ہے (جیسا کہ خجلت یا حیرت)، فطری طبیعی رد عمل ہے。
      بلاتنظیر نوزائیدہ بچوں کے موذول چہرے انقلابی تبدیلوں کا باعث بنے؛ ماشاءالله آقا ظرف کو متاثر کرنے والا
      دنیا کی زیادہ ثقافتوں میں چھونا عام طرح چہرے کے قرب میں ہوتا ہے۔
  body.chest:
    label: چھاتی
    summary: جسم کا قدامی حصہ جس میں دل اور فلو موجود ہیں
    info: چھاتی کا علاقہ پشت اور نکاح سے محدود، جو زندگی برقرار رखنे والے органس مثل دل اور فلوں کی حفاظت کرتا ہے۔ چھاتی کا خانہ بالعموم ١۲ جوتے ہڈیوں، نکاح کی ہڈی اور ٹراؤنز ورس لائن کے ذریعے تشکیل پایا ہوا ہے۔ آزاد عمل انداز تنفس براستہ چھاتی کمربد اور درمیانی ہاربڑ سالوں کے ذریعے قائم ہوتا ہے۔
  body.chin:
    label: برادا
    summary: ذقن کے تحت چہرے کا نیچلا حصہ
    info: گردن انسان کا سب سے نیچلہ حصہ جو ذقن پر مشتمل ہوتا ہے۔ لوگوں میں واضح گردّن، حیوانات کی دنیا میں منفرد خصوصیت ہے؛ باقی بندروں کے پاس یہ موجود نہیٗں۔ علماءِ تحقیق فکر و شاید برادری کس طرح وجود رکھتا ہے، اس معاملے میں مختلف آراء قائم ہیں۔ انگریزی زبان میں 'chin-up' کلمہ استعمال ہونے والے لفظ کا مطلب عقلمندانہ رویہ اختیار کرنے کی ترغیب ہوتی ہے۔
  body.ear:
    label: کان
    summary: سرو کے ایک طرف سناہٹنے کا حسگانہ آلہ۔
    info: کان آواز کی لہریں قبول کرتا ہے اور انہیں عصبی نشانات کے طور پر دماغ میں منتقل کرتا ہے۔ یہ برابری کا نظام (ویسٹیبلار سسٹم) بھی رکھتا ہے۔
  body.elbow:
    label: آناجول
    summary: باقاعدہ طرح سے 'ال' لفظ سے ماخوذ؛ ہاتھ کو موڑنے والی جوائنٹ۔
    info: ہتھیلی کے باہر اور برشانوں میں شامل جسمانی حصّا، آنگُلوکسپِلنٹر نام سے مشهور۔ چمڑی پر حساس خلاقوں کا فقدان موجود ہوتا ہے۔
  body.eye:
    label: نکتہ
    summary: ایک حس کا آلہ جو رنگین پٹی والے نکتہ سے دیکھتا ہے۔
    info: انسانی آنکھ تقریباً 10 ملین رنگ کے شدید فرق کو پہچانتی ہے۔ روشنی کے ذریعے دیکھنے کے لئے چمکدار اور رنگارنگ دیکھنے کے لئے چوبند شامل ہوتے ہیں۔
  body.eyebrow:
    label: چمتوں کا زائد
    summary: آنکھ کے اوپر موجود بال؛ موخر الذکر فرد کے علامت کے تعريف ميں ضروري
    info: ہر آنکھ کے اوپر والی بالوں کی پٹی اور بولنے سے بغیر مواصلات کرنے کا حوالہ دینے والا، جبکہ تحقیقات ظاہر کرتی ہیں کہ لوگ وسعت نفاس رائے کا اندازہ لگانے کے لئے عام طور پر بالوں کے دونوں حصوں کو استعمال کرتے ہیں۔
  body.eyelash:
    label: رشِس
    summary: آنکھ کے حاشئی پر واقع مڑھ جانے والا بال جو آنکھ کو تحفظ فراہم کرتا ہے۔
    info: ریشے کم اور مڑھ جانے والوں بال ہوتا ہے، جو آنکھ کے پلکوں کے حاشئی سے نکلتا ہے۔ ریشوں کا مقصد دبلاپنا، خاموشی اور غیر ضروری شیزوں کے بارے میں آنکھ کو تحفظ فراہم کرتا ہے۔ انسان کے اوپر والی پلک میں تقریباً ١۰۰ لے کروڑ چونداسُتَّ قسم کے موجود ہوتے ہیں، جبکہ نیچے والی پلک میں ٥٠ لے کروڑ۔ ان کا دورۂ زندگى تقریباً چار سے آٹھ ہفتے ہوتا ہے۔
  body.finger:
    label: فنگر
    summary: ایک ہاتھ پر موجود پنجوں فنگرز مین سے اک
    info: ہر شخص کے دس انگوٹھا ہوتے ہیں؛ اُنکی حرکت سبز مدد نامور آلات، موسيقى اور لِفافه وانٗ تحرير كرن توّم۔ فنگرپرنْتس هر بشري جسم کي منفرد علامات ہوندې۔ حساس رجسچرونس کل زندگى بدن کي سب سيتيويش حصو بنادين
  body.foot:
    label: پیر (چودیدلو)
    summary: وہ جگہ جس پر ہم کھڑے رہتے اور چلتے ہیں
    info: ایک پیر سارے بدن کا وزن برداشت کرتا ہے اور دو قدموں پر چلنے کی اجازت دیتا ہے۔ اس میں 26 ہڈیاں، 33 جوائنٹس اور 100 سے زائد ماسلون، لائگامانٹس اور ٹینڈنز شامل ہیں۔
  body.forehead:
    label: چلو
    summary: لب کا قدامی حصہ؛ محسوسات کے ظهور کا مقصد
    info: چہرے کا وہ حصہ جو آنکھوں پر بیلٹس اور بالوں لائن سے اوپر ہوتا، چلو خاص طور پر محسوسات ظاہر کرنے والے علاقوں میں نمایاں ہوجائے۔ موٗڑنا تشوّش کا واضح معنو‏ات رکھدا۔ مختلف ثقافتو‏ں دا چہرو تو‏ں منسلک حوالہ فرضياں یا ذات کانفرنس شامل ہندى۔ علمِ نفسیاءت وچ، ذهنی قسمت جذبۂ عمل اُدھار رکھدى۔
  body.hair:
    label: بال
    summary: سر کی زیر دریافت چرم سے نکلنے والے عضو
    info: "بالا کریٹین سے بنا ہوتا ہے اور سروں پر بالوں کے فولکلز میں نشوونما ہوتا ہے۔\nایک شخص کسی دن انگوروں کے تقریباً لاکھ چڑّوا، روزانہ ۵۰ لے کر ١۰۰ بال جماعت سے الگ ہوجاتے ہیں。\nmensual بناء پر تقریبًا 1.25cm لمبائی حاصل ہوسکتی ہے۔ \nبالوں کی قسم خاص طرح کے صفراء میلاننز کے ذریعے ظاہر ہوتی ہے؛ شدید سفیدی واقع ہوتی ہے تو جب فولکلس میلاننز کی تخلیق روک دیتا ہے۔"
  body.hand:
    label: ہاتھ
    summary: 팔 کا حصہ جو پانچ انگلیوں سے ختم ہوتا ہے۔
    info: ایک انسانی ہاتھ مخصوص طور پر توانا آلہ ہے، جس میں دانت کی قابلیت رکھنے والی انگلی موجود ہے۔ یہ نرم حرکتوں کی اجازت دیتا ہے، جیسا کہ لکھنا، نقاشی یا سیّت۔
  body.head:
    label: سر
    summary: جسم کا اوپری حصہ جس میں دماغ اور حواس موجود ہوتے ہیں۔
    info: سر میں دماغ، آنکھیں، کان، ناک اور منہ شامل ہوتے ہیں۔ سر کا دماغ پورے بدن کا مرکزی نظام چلاتا ہے اور تمام حسی تجربات کو پروسیس کرتا ہے۔
  body.heart:
    label: دلو
    summary: دلو ایک سارا جسم میں خون کو پمپ کرنے والے عضلات کا آلہ ہوتا ہے۔
    info: دلو فسٹ کے سائز کا ایک گھنا عضلاتی آہو ہوتا ہے، جو عام طور پر منٹ میں 70 بار دھڑکتا ہے۔ زندگی کے دوران دلو خون کو تین زمینوں کے چکروں کے برابر فاصلے تک پمپ کرتا رہتا ہے۔
  body.heel:
    label: پتھ
    summary: جوتے کا آخری حصہ؛ آدمی کے قائم حالت میں تمام وزن برداشت کرنے والا
    info: |-
      پاتھ کی ہڈی جوتے کا سب سے بڑا عضو ہے۔
      ایک شخص اس پر خود کی وزن برداشت کرتا رہتا ہے。
      patina کانچلائٹ شلنگ سے منسلک ہوا ہے۔
  body.hip:
    label: پلنگ
    summary: جانوروں کے تناسب؛ جسم کے وزن اٹھانے والی تقریراً سب سے بڑا مچوں
    info: بُک جسم کے وزن اٹھانے والی تقریباً سب سے بڑا مچوں والا پلنگ ہوتا ہے۔ یہ خواتین مردوں کے مقابلے میں زائد وسعت اختیار کر لاتی ہے، حمل نسل برداری کے باعث۔ آرتِکولوس کواڈروم فرجائیل کا علاج دانتوں کے معائنے کے بعد عام طور پر شاید ہی کوئی شخص غیر ضروری عمل درآمد کرنے کی صلاحیت رکھتا ہو۔
  body.jaw:
    label: مسماجولا
    summary: زبان زدن اور بولنے والی حرکت کرنے والا چہرے کا نیچلا حصہ
    info: چہرے کی نیچلی ہڈی جو دانت رکھتی ہے، مسماجولا اور سروں کے درمیان الجملہ موجود ہوتا ہے۔ یہ لبسم کے ذریعہ پیدا شدہ تارنگاتوا بوجھلائی کا باعث بن سکتا ہے۔
  body.kidney:
    label: کلی
    summary: خون کو صاف کرنے والا زوجہائی عضو
    info: کلیے بچھڑ کا اثر پذیر عضو، جس میں فینول شکل موجود ہوتا ہے۔ وہ روزانہ سونت لٹر خون صاف کرتے ہیں اور ایک تا دوم لٹروں نال کشیدگی قائم کرنے والی مواد بناتے ہیں۔ ان میں لاکھوں فلوترن شامل ہوتے ہیں۔
  body.knee:
    label: 膝盖
    summary: جسم کا سب سے بڑا عضو جو ٹانگ کو بازو سے جوڑتا ہے۔
    info: گھٹیا جسم کے سب سے بڑے اور پیچیدہ عضو متحرکاتی ہوتا ہے۔ یہ تاند، منسکس، لارج فلائبروس اور جانبی رشتوں سے مشتمل ہوتا ہے۔ یہ قدم چلتے وقت شخص کے وزن برداشت کرنے کे لئے بنایا گیا ہوا ہے۔
  body.leg:
    label: نوکرا
    summary: پیر سے لے کر آگو بیند تک کانچلٗ
    info: نُوہا کے حصّے میں تھigh، شِنا اور پاؤچ شامل ہوتے ہیں۔ نوکرلائٹس والک سے منسلک Achillies tendon جسم کا سب سے مضبوط رباط ہوتا ہے۔
  body.lip:
    label: مومنات
    summary: ایک لمبائی والا دروازہ جو منفتس فرشتہ کے دونوں طرف ہوتا ہے۔
    info: ہر دو میں سے ایک جلد کا توازن منفٹس فرشتہ کے حوالہ سے بند چمڑے کے علاقہ۔ ان پر نروس زیرِ عمل موجود ہوتے ہیں، لۂذا وہ خاص طور پر حساس ہوتے ہیں۔ رنگ بالواسطہ خون کے ذخائر کی وجہ سے ہوتا ہے؛ آسمانی رنگ والے مومنات قصور کار کھلے عام لوکسوژین کی عدم موجودگی کی جانب اشارہ کرتا ہے۔
  body.liver:
    label: ہپاٹائید
    summary: جسم کا سب سے بڑا داخلی آئرش؛ جسم کا شمیمی معاملہ
    info: "ہپاٹائیڈس سب سے بڑا اندر کا اعضا ہوتا ہے جو ۱٫۵ کلوگرام تک وزن رکھتا ہے۔ \nاس میں پانچ سौ سے زائد فункشنز موجود ہوتے ہیں، خون کو صاف کرتا ہے، بلول بناتا ہے، پروٗینسن کی تشکیل کرنا، گلاایجن ذخیرہ کرنال\nاور دوسرا عضوا نہیں ہوتا جو باقی ٹشوز سے بالکمل طور پر مرمت کرسکتاع。\nابتوار کی مقدار الکحل یا سم توکسوں کثیر حجم کثرت واقعات سنسفیروس کا لاحظہ ہوجانا(جواندرونی جلد کے متاثرات)"
  body.lung:
    label: فلڈ
    summary: آکسجن کو ہوا سے خود کرنے والی صدور درجات کا الگ الگ ادارہ
    info: फेफड़े سانس لینے والی دو عضلات کا اہم حصہ ہوتے ہیں۔ فلوکولوس نامی لاکھوں ذرات، جن پر آکسن براستہ حلق وارد ہوتا ہے، ان میں موجود ہوتے ہیں۔ بالغ شخص منٹ میں تقریباً ١۲ سے ٢٠ مرتبہ سانسوں کا استعمال کرتا ہے، اور ہر نفس میں چار سورو ملی لمبائی کا هوا داخل کرتا ہے۔ دائیں طرف والا فِفَدّه زیادہ موڑا ہوا ہوتا ہے کیونکہ قلب اپنا مقام بائیں جانب رکھتا ہے۔
  body.mouth:
    label: منہ
    summary: چہرے پر کھانے، پینے اور بولنے کیلئے استعمال ہونے والا سوراخ۔
    info: منہ پکڑنے کا عمل شروع کرتا ہے - دانت کھانا توڑتے ہیں جبکہ آنسو اسے تحلیل کرتے ہیں۔ یہ بولاوٗ اور رابطے کا مرکزی آلہ بھی ہوتا ہے۔
  body.muscle:
    label: مسال
    summary: جسمانی حرکات کو ممکن بنانے والی متغیر فعالیت والی بافت
    info: |-
      ماسل جسمانی حرکت کو ممکن بنانے والی توانا اور سبک انٹراکشن کرنے والا بافتوں پر مشتمل ہوتا ہے۔
      ایک شخص کے بدن میں لگ بھگ ۶۰۰ ما슬 موجود ہوتے ہیں، جو آدمی کے وزن کا چار دسواً حصّہ تشکیل دیتے ہیں。
      سب سے زبردست ماصل 'جَلد' نامی ماصل ہے؛ جبکہ سب سے خوشحال ماصل وسطِ کان میں وجود رکھتا ہے۔
      ماصول حوالٗ سے مختلف قسموں میں تقسيم ہوتے ہيں: عضلاتِ استخواں (قابلِ تحكم)، عضلائى (داخلی غذاوار نظام) اُور عضلاتِ دلم。
  body.nail:
    label: ناخوا
    summary: ہروں اور قدموں کے بالآخر قائم ہونے والا سستا کرائَین
    info: 'نخوں کی سخت پلیٹ جس میں کرائِتن موجود ہوتا ہے، اور انگُلوں کے آخر میں آتا ہے۔ ناخون حساس دماغ کے حصّے کی حفاظت کرتے ہیں اور بڑھکان والی چیزوں کو تلاش کرنے میں مدد فراہم کرتے ہیں۔ وہ لگبّارہ ماہ میں تقریباً ٣ ملی‌متربند روز مرتبہ بڑھتے ہیں؛ ہاتھوں کے ناخون پاؤں کے مقابلے میں زیادہ تیزی سے بڑھتے ہیں۔ عام طور پر ناخونوں کی حالت صحت کی علامت ہوسکتی ہے: سفید لنچ، خال یا رنگداری بیماری کی علامتوں کے طور پر ظاہر ہوسکتی ہے۔'
  body.neck:
    label: گردن
    summary: سر کو باقی بدنا ساتھ جوڑنے والا حصّ؛ زندگی برقرار رکھنے والی شاخیں
    info: گردن سینہ اور دماغ کے درمیان واقع علاقہ ہوتا ہے جس میں زندگی برقرار رکھنے والی تار، خون کی ندیدہ لائنوں، پٹوڑی اور بچھڑا شامل ہیں۔ یہ حلقہ ٗ آلات سمیت مختلف مشقیں فراہم کرتا ہے۔ گزیل کے پاس لوگوں کی طرح ۷ گردنشمل ہڈیاں موجود ہوتی ہیں۔
  body.nose:
    label: نose
    summary: چہرے کے درمیان میں واقع خوشبو اور سانس لینے کا آلہ۔
    info: نوک نفخ کردہ ہوا کو فلٹر، گرم اور مرطوب کرتا ہے۔ یہ ایک ارب مختلف خوشبوعون کو پہچانتا ہے اور ذہنی حافظہ اور جذبات سے قریبی تعلق رکھتا ہے۔
  body.palm:
    label: دلاّن
    summary: دست کی داخلی سطح؛ حساس ترین لمبائی کے سنسر
    info: دست کی اندرلہ سطح، اشارے دانتوں اور مچھرو تک پر مشتمل ہوتا ہے۔ یہ علاقہ حسِ لمس کے بڑی حد تک وصول کرنے والے جسمانی نشانات Meisiner bodies رکھتا ہے۔ گرد آلود فولکلوالز اور خارش زخم موجود نہیں ہوتے۔ قرونٴ古代 کے دور میں لوگوں کی قسمت دستان کی خطوط سے پڑھنے کا طریقہ استعمال کرتے تھے۔
  body.shoulder:
    label: پشتانہ
    summary: ایسا جوڑ جو آنگلی کو بدناور زیادہ حرکتوں کی قسم کرنے کی صلاحیت فراہم کرتا ہے
    info: ہاتھ کا جوڑ، بدن سے ملنے والی بازو کی لمبائی اور حرکت کا وسعت ترین رجحان دار پٹھوں کے حلقہ کے ذریعے استحکام فراہم کرتا ہے۔
  body.skin:
    label: چہرا
    summary: جسم کا سب سے بزرگ عضو؛ تحفظ، حرارتي تنظيم، اور لمباپسندى
    info: چہرے کا بیرونی تھوڑ؛ انسانی جسم میں سب سے زیادہ عضواور لگ بھગ دومربع میٹروں پر مشتمل۔ فنکشنز شامل حفاظت، نقص العدوى، حرارت تنظيم، لمباپسندى، اور وٗيامين دي کمپوزيشن۔ باہرين طبقات کيلئے خاليا تعويذ درجۂ اندازاً ۲ الاء ۴ هفتون۔ چہرے کا رقبہ لاکھوں باكتيريا کا قطب رهتا ہے۔
  body.spine:
    label: پشت
    summary: تیرہ نالوں کا ایک ستون جو عقل مند مواد کو تحفظ فراہم کرتا ہے۔
    info: ہردوں کا ایک ستون جو سرو مچھلی تک رسنے والی رگڑ کو تحفظ فراہم کرتا ہے۔ ان دونوں آسٹرلوں کے درمیان بین الاقوامی پلاٹنز موجود ہوتے ہیں، جو زور دار حرکات و مقاومند حوالے سے عمل کرنے کے لئے استعمال ہوتے ہیں۔
  body.stomach:
    label: belly
    summary: صدر کے نیچے توروش کا سامنا کرنے والا حصّ؛ عام طور پر stomacch کے نام سے
    info: بُٹن بدن کا سامنا کر رہے حصه تورسوس اور pelvis کی وچ ميں۔ يوگل، آنتون، لivers، پنسکرياس جي spleen شامل هيندئ۔
  body.temple:
    label: سباحۂ رأس
    summary: جبڑا کی لمبائی پر بالشت کے قطعات کے اوپر موجود نرم حصّہ
    info: سپانک ایک علاقہ چہرے کی ہڈی سامنے والی زمین پر جبڑا اور آواز دونوں طرف محسوس ہوتا ہے۔ یہ علم و تدبر کی لازمی بات ہے، دل کی دھڑکنوں کے دوران خوبصورتی سے نظر آتا ہے۔
  body.thigh:
    label: Thigh
    summary: ایسا حصہ جو پاؤں کے چمڑ اور گھول کے درمیان موجود ہوتا ہے؛ بد ن کی سب سے مضبوط عضلی گروپ
    info: ٹانگ کا حصہ جو چمڑ اور گھُلے والی ہڈی کے در میں واقع ہوتا ہے۔ یہ بدن کی سب سے زبردست عضلات، قدرکواسپر فامبلز (Quadriceps femoris)، حملات شامل دارن تقریر کرتا ہے۔
  body.throat:
    label: غُلَّه
    summary: منہ کو معصوب اور نفسی سے جڑنے والی وسعت
    info: گلہ دماغ کے میندھ اور منہ کی طرف سے جاری وسعت والا علاقہ ہوتا ہے، جو فضائی خرچ اور غذا دونوں کے لئے راستہ بناتا ہے۔ یہ قومانکت تقررات شامل ہونے کے باعث پٹوار نظام کا حصہ بنا ہوا ہوتا ہے۔ گلاشن انداز آسمان نامی واپس لوٹنے والا رد عمل مختلف شےء کے حملے کو روکتا ہے۔ زرد دردنقاطٗ اور گلو مرحلے کے التواء عام طور پر بچوں میں مشترک ہوتے ہیں。
  body.thumb:
    label: thumb
    summary: دست کا لمبا موٹا دانت؛ posiçni حرکت فرشتوں کے لئے ضروری ہے
    info: |-
      پالس انگلیبند کا اولین لمبا موٹا دانت ہے جو ساتھ والے دانوں تک پہنچنے میں قابل عمل ہوتا ہے۔
      oposiçni حرکت آدمی کے نرغوبازار وسائل استعمال کرنے کی حمایت کرتی ہے، جو براہ راست طور پر زندگی کے دوران تشکیل پذیر ہوا ہے اور صرف ماڈروں میں موجود ہے۔
  body.toe:
    label: فٹ فิงر
    summary: '''فٹ فینجرز'' میں سے ایک؛ دوڑنا وقت وزن تحمل کرنے والا اشارکے والی انگلی'
    info: |-
      پاؤں کا انگوٹھہ پانچ اشارکے والی انگلیوں میں سے ایک ہوتا ہے۔
      pاؤں کا انگوٹھہ، جسے 'هالُكس' بولا جاتا ہے، قدم روسنے اور توازن برقرار رکھنے کے لئے بنیادی حیثیت رکھتا ہے؛ وہ وزن کا زیادہ حصّہ نبھاتا ہے。
      humans کے پائمال کا انگوٹھہ بالمقابل آرماڈوز کے طور پر علاحدہ حرکت نہیں کرسکتا۔
  body.tongue:
    label: جَبْذَةٌ
    summary: خود غرض دانتوں کے اندر واقع ماوسول خاصیت والا آلہ
    info: زبان ایک ماسلوں والے آلہ کو تھرمل، سلائٹس، حمپاگنِس، باربرنس اور چُمند جیسا ذائقہ پانچ بنیادی طعموں کے لئے استعمال کرنے کی صلاحیت رکھتا ہے۔ زبان خطاب کی آوازوں کو واضح کرنے کے علاوه بلع کے عمل میں بھی مدد فراہم کرتی ہے۔
  body.tooth:
    label: دوش
    summary: غذا کو چبانے کے لیے منہ میں موجود سفید ساخت
    info: دانت ایک سخت جسمانی تھرمل کے طور پر بنایا گیا ہوتا ہے، جس میں دندناتم اور ناخونوں والی خالق شامل ہوتی ہے۔ شخص کے مستقل حلق میں عام طور پر ۳۲ دانت موجود رہتے ہیں۔ زخم لگنے کے بعد انٹرنل شینز کبھی بحال نہیں ہوسکتا؛ تو روکنا ضروی ہے۔ قدیم تاریخی ذرات میں سے واقعی قدرتی طور پر وجود میں آئے لوگوں کے دانت درجنوں لاکھ سال قبل کے ہیں اور وہ فطری تبدیلوں کی تشکیل کرتے ہیں۔
  body.vein:
    label: وان
    summary: خون کو قلب کی طرف موڑنے والا عضو ؛ ہاتھوں پر واضح
    info: سکین کے نیچلے حصوں سے خون جمع کرنے والی وان مخصوص تارنگا اور دباؤ کم رہتی ۔ براڈز ان فرموں کی وجہ سے پیدا ہوتا ہے؛ آئنسٹائن کے ذرات موجود ہوتے ہیں، لال رنگ کا حامل ہوتا ہے۔
  body.wrist:
    label: ہتھیلی
    summary: ایسا مضبوط جسمانی جوڑ جو ہاتھ کو بازو سے جوڑتا ہے؛ فائن موشن کے لئے انتہاءً ضروری
    info: "ہتھیلی وہ علاقہ ہے جو ہاتھ کو براچ سے ملاتا ہے اور آٹھ ننھرک حلقہ والی ہڈیوں (گارپالزس) پر مشتمل ہوتا ہے۔\n یہ ہاتھ کو 4 مختلف راستوں میں حرکت دینے اور چمکانے کی اجازت دیتا ہے。\n زابردست استعمال کرنے پر، گارپلس ٹونل (جسام تار کا تنائ)، گارپلن ٹونل سنڈروم بناسکتا ہے۔ \nآسانی سے خود ہتھیلی کے اندر کے حصے پر ضربِ قلب محسوس کیا جاسکتا ہے۔"
