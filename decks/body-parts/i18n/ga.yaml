lang: ga
pivot: false
title: Páirteacha den Tóinnteach
cards:
  body.ankle:
    label: ghearca
    summary: Ghearca idirlódú fhuaimhsearbh agus lámha; tábla coiminche.
    info: Tábla anamhchuairteach is ea an ghealachtaóir idirlódú achainne agus bearcadh na láimhe thart ar thrí olltán amhlaidh. Tugann sé cumarsáid don phointe sin i bhfeabhas go dtosaithe agus do mhionphuithinteartha trí chearg. Is é dearmad ghleacaigh (distorsión) san áit seo nua-thionscnamh atá ceapthas airgeadais sa chóras breise.
  body.arm:
    label: Paiseal
    summary: An limb thuas ón gruaif go dtí an geart
    info: Tá paíséir í an limbh thiar ón gruaife go dtí do ghearradh agus tá sí cruthaithe ar feiceamh trí shocairneanna; na socarndeachta is ea iad nóinsearcán, fhearainsearcán agus láimhe. Tá séanta tríaichead déag scillte ann - scamallacha, cisteanna agus slighea atá bainte lena chumas teacht istigh dearg. Bíonn an clócaireacht idirlín nádúrtha nuair nach bhfuil ceithre cistean amhára ach dá céad.
  body.back:
    label: cluais
    summary: An dá thrutha thíos ón gcill nóimhe go dtí an ceallaog; seanscruabh mhór.
    info: Táirgfidh an chluas i gceann na gruaige agus thar feart go dtí an ceallógín. Tá sé inscrúdatóidheachta den chothromán is ea pleancóireacht trínta-dha sa cheoll seo atá fosta ar mbuíochtaí cluaiseacha. Is éard nach mór de shaoithreanna tábhaithe don phointeach amhlaidh mar trapézoid agus latissimus dorsai.
  body.belly_button:
    label: an umbélícus
    summary: Scaráidín eile acu tábhachtmhar go dtí an bóthar.
    info: Tábhacht ar an umbelícus agus é sin í an scara thíos atá thart faoin mbóithreadh nuair nach raibh sé páiste san amhrán. Tonnú de réir mar ghealltar airgead don phrionsa ó sholas Mhuire.
  body.bone:
    label: ""
    summary: ""
    info: Is é an bhfásar fada agus ghearrta i ngrúntaí mar sin téarma 'cist' nó 'cost'.
  body.brain:
    label: móirk
    summary: An ceantar dhorchaoidhinneachta den choimisiún.
    info: Támoideas an mhóirce éadaoith agus is féidir léi n-a bheith i bhfeabhas don phrionsa nó do threoilín. Is feart eile nach mbíonn sé ar siúl go dtí go gcuireann sliotán isteach sa chraobh.
  body.calf:
    label: tábla
    summary: An portán lárne ar thuairis na gruaige eatarthu geargaigh agus roithreacht.
    info: Tábla den is é an phortaín lárnach ar thuras na gruaige idir an gheargh agus an roithreach. Is féidir lé do shuíomh orthu chun dul isteach go dtúsanna nó scamaillt amach san airge. Tá táblacha den líne déanta don fhiosrú de réimhitheas slighe sa bhuile.
  body.cheek:
    label: '''Líc'''
    summary: Oblast thuanmhaideach taobh amuigh den truaifheadhair.
    info: Tábhacht agus an lice tá ceart ar thrúchánna d'oblac is ea an 'líc', mar atá sé i bhfeidhm chun stóránta nó scianadh physiológach don eolais nó do shuídhínneacha éigin. Tá méad teaghnasc litheanta idirhinnseartha go minic san áireamh.
  body.chest:
    label: torás
    summary: Tiontscéal tábla den chóras breacaire
    info: Is é an thorson grúda achainneach trí na fhearaibh agus an ciste thoraideacha freisin mar sin féin is ea sé seo atá i gcruthaíocht don chroí agus do shuíochtaína. Is cumanta go bhfuil 12 phair de fhéarbhanna san torasón cé mhéad nach mbímearfadh siad uile isteach sa cheist thuaidh. Tugann an tóras óntais ar bhuailíní airgeadaigh nó sluaith neamhfhoraithe.
  body.chin:
    label: buidéal
    summary: An teilse dearg den chás faoi láthair do dhoireamh
    info: Tábhra tá is fé nua na grámhóige agus é sin iomlán ó thuras an dáilín íochtarach. I bhfhearaithe nach mór go minic atá sé mar thractha thúarúla ar bhuill mhuintir san eagrais beatha—ní hea sa phriontáid nóinteachta. Ní h-iontacha liomsa céim gur áit fhostaithe amhlaidh.
  body.ear:
    label: ceachtar
    summary: Orgán scile seo chun fhearainn i mbuíochta.
    info: Is é an uairín atá ag féachaint ar ndóthadh san fhocail is ea ceachtar. Tugann sé siad mar ghrúpaí nua-chumas don mhuinnter chuig an breisin.
  body.elbow:
    label: Loct
    summary: Is é seo tábhacht eile don 'gaothrún'; déanta ó luca.
    info: Tábhacht is ea an locht ar thuaisceartna de chluas agus gaothar mar atá ann i dtreo mhaith agus ceann airgeadach do phainéaltais agus rothinimheadh.
  body.eye:
    label: tsuíl
    summary: Oifigeoidh seasmhaire do thsíthint atá lámhdhéanta.
    info: Tábhachtóir an tsúil is féidir léi fhorbairt nascadh i ngach ceann de na hochtagar don chuid seo ar bhealach difriúnta agus tá sí cinnte go bhfuil sé sin mar thoradh d'fhiosrúcháin eile sa phísic nó san fhás.
  body.eyebrow:
    label: tuiscearc
    summary: Eithne ar thuaiseacht suile - ceapadach don phrionsabal.
    info: Tábla é an eithne ar thuaisceart na súil agus tá sé taobhthrománta don phucaimhe nua-thiomsaithe; is féidirmas fada d'éocair bhratadh trí bhoghaíocht an tuisceartaigh. Is feabhas dá labharfaí go dtugann sé cosc iomlána do shuíleanna ó ghlóin nó gránntais.
  body.eyelash:
    label: Sraith
    summary: Is ea sraitheanna churtha atá tábhaithe sa grunnta thuíse nach mian liom.
    info: Táirgfidh séadacha ísle agus curtha ar thuras i ngrúnta an ghaoisín ó thaobh thíse. Is é sin a phrotectóidh siocaird den ghlacadh, déaghas is fearbhallta eile. Tonnann daoine fostaídheanta idirdhaith seo de 100 go dtí 150 síthiún don uachtar-thuíse agus idirdhaith de 50 go d'tí 75 do líon-tuise.
  body.finger:
    label: tábhair
    summary: Is féidir linn fheiceáil ceithreach déanta den tsuíomh.
    info: Tábhacht an roith is é sin amharc ar thréimse de phost nó trí threascóir agus tá dhúshláinte iad don téacs go léir.
  body.foot:
    label: léim
    summary: Is é seo an phart de láthair nach mbaineann sé go dtí do thuaisceart.
    info: Tábla an léine agus tá ceithre déag scian ann féin mar atá trí scuainn is caillteanna i ndiaidh sin.
  body.forehead:
    label: tábla
    summary: Cuid lárnuadhteachta taobh istigh den glúin agus faoi léargas.
    info: Tábla é an ceart lárnach i dtuaisceart ó bhrósta agus thíos ó líne ghlúin. Is í sé cuid de n-aithríonn daoine fosta ar thabharthacht—mar shampla nuair atá tabhairtín ann táimid breacadh. I nghealaicteanna go forleathan bhí síniúnacha mar sin ar thaobla áirithe seo san amhfheartha nó don chasaid.
  body.hair:
    label: tábla
    summary: Fibreachtaí atá rianta sa bhfolcán taobh isteach den chearnóg.
    info: |-
      Táblaí iadairteach agus caillimh ó thuras an chroithín san fhocalóir ar do dhheargadh
      Is é seo nialas go dtí gur féidir don té deireannú 100,000 táblaithe airgeadaigh orthu, lena dtagfadh amharċha phointe id cinn uile lá,
      ciúbhadh faoi 1cm mar mhios nó más fós ciubhairt séaranta.
  body.hand:
    label: láimhe
    summary: Párta de phaisteach atá críochnithe i ndeichfhios.
    info: Tógann an láimhe threasmhachtúil den ghréine trí fhearadh is féidir léi scró agus grífneacha nó croithlínte.
  body.head:
    label: cheann
    summary: Is féidir léithiamh go bhfuil priobhbainte acu san áit is ea sin.
    info: Tábhraíonn an ceann na bpriobhanta agus na h-uimhirínneacha seo ar fud - súil, earcanna, nós agus scian. Is é an phríobhaithe sa cheann atá i gceist lena bheidh siad tábhraidéalta.
  body.heart:
    label: scéal
    summary: Is féidir léi ceoil bhratht isteach san bpís.
    info: Tábhacht is éard atá sa scéal agus tá sé mar sin mór lena gcéad fosta go dtuitheann síochtú uair i minút ar mhóinín. Trí thaiscint na gcrutha trí láthair nascfear an méid céim nach bhfuil trénas ollamh.
  body.heel:
    label: an pá
    summary: An dáta thíos thuaidhm na laímhsi; íontraiann siad an timpealltí amhlaidhin.
    info: Tábla an pate is ea an calcaneus agus tá sí mar athéisiú ar bith den ghearrthóir de phointeanna na láimhse. Tá sé thar feadh an fhadhbairte i mbuíochas don choimeád mhór d'fhonn uile tíre trí shláinte. Is féidir go mbeimid freisin tagaithe airgeadais do bhualadh nó gruaigeacht sa pháilín.
  body.hip:
    label: an bóc
    summary: An teilis faoin mbéal; an téiteann is mó.
    info: Tábhacht is ea an boc air bhord na cearcaine agus seansóra caoineacha taobh thiar den phainéar nó paibheanna. Is é seo clúdach beag fholamhteach nach féin muid i gcónaí go dtí nuair gur láthair ar sonas uirthimse. Tá páinneacha d'fhuanaitheoirí deargta amach ón bpianéad don teachtaireacht.
  body.jaw:
    label: tábla
    summary: Is é tábla an fhadhb do mharcfhada agus d'fhear lioc go dtógfar caillín.
    info: Tábla an fhacaile (an mandibúil) is ea tábla phoibleadh na leabhaire agus í atá ar fead amhaidheachta, polaiteoga agus labhairt. TMBM (teampóram-mandibualar joint), nó glúnntas thamhléimneacha-tábhala, níl sé sin sa ghrianthuaisg seo ach ceann de ghrinnitheanna is cumharsca déanta i gcroíocht na bpipreachtaire.
  body.kidney:
    label: Lím
    summary: Tá sé mar ollúntear feirmeachta agus ceartas moche.
    info: '{"label":"lím","summary":"Ollúinte fhearfhéideacha atá ag críochnadh an gruaife seo trí phostóireacht na frithreabhluithe,"}'
  body.knee:
    label: ghrainné
    summary: Is é grainéal an tábhacht is mó san pháiste atá idir an steoighe agus an lít.
    info: Tábhachtas an ghrianán is ea ceart agus amharcach na bpipín seo ar thalamh mar sin go bhfuil sé i gceist ac cinn mhaith de phillteanna, meascraighneacha, naisc crocha teagmhara agus naisciúlta eile. Tugtar airgead don láthair agus rinceadh freisin.
  body.leg:
    label: nuadh
    summary: An doimeán de phointe go dtuill.
    info: Tábhacht na nua (an dhoimeán thar feartas agus an gaothair), tá sé spreagtha don fheithis amach ó thréimhse dá shuíoch ar dhó roinnt is féadaí é sin i bhfacaíocht (ceathrú-chlu). Tá femora (cisteal stighiúnaithe) mar cisteach is fearg nó is mó sa tíre.
  body.lip:
    label: Réat
    summary: Tá sé seo don chluaisín dúnteach den mhóth.
    info: Is éard atá ann nár ret an dá thaisce múilte agus gruaigeacha nach raointeann ar na mucca. Tá siad láidir lámhthéiteachta nóimhe agus táimid go minic tagairt lena heoladh airgeadais. Is fearcóireachtúla is féinmhiniceálta í réata mar sin.
  body.liver:
    label: grúaif
    summary: An téarma is mó san fhiaclais; an labhairgh óg ceímiche.
    info: Tábhachtacha iad na gruaife agus tá siúl acsiar ar an gceimicín seo mar 'an labharthóg ceímiceach'. Tá sé sin amhlaidheas airgeadh nascanta go háirithe lena bhfuil pleanctha á rith trína gcónaitheanna, caillteann síneacairse, cruthaíonn eileamhní peitiniseoireacha agus cuirfeadar tharraingean géarscainnte isteach sa stórálna.
  body.lung:
    label: phláist
    summary: Orgán scianmhórtaigh nach traothar sé cáca os claon.
    info: Tábhachtacha iad an fhuinneog nónaó laimheach san áireamh agus tá siadsa comosta ó thoscan millión de phléascínithe (álvéola). Is é seo freisin faide caite ceithre láirge dá taobhta go dtí sechtanta metr cheadrúil ar chúrsa airgid atá ann sa pháiste. Tugann duine beo isteach idirdha chumhdaithe do dhiaidh uair am minicte is ea céanna cinn déag don cúpla huaire agus tugtar 500ml ocsaidh orthu.
  body.mouth:
    label: Ceann
    summary: An tsealach sa cheanna de réir nach bhfuil sé mar sin amhaidh do shiontairteas.
    info: Tá moille agus an ceannaire i gceist na bpipiteoirí is féidir linn fritheadh ar bhróiste nó roinnt go dtí an phrós céim pipitigh. Is é seo freisin rud atá thar thranslatóireacht fhoclóra agus eolas.
  body.muscle:
    label: scian
    summary: Téama ataisteachta freisin do ghlacadóireacht
    info: Is éard is scian an téama atá ag cur isteach chun cuntas ar fad i gcónaithe. Tá níos mó ná seachtúig scianna sa bpóg dá bhfuil siadsan tábhachta achanta den phogadh seo thar 75%. Is scian mór na mbuíochais (buccinator) an scian is fearr; más féin nach scian beag san othcar méada nóimh.
  body.nail:
    label: nth
    summary: Plátac ísealach tharrainnteagtha ar dhíchfhios dá thrascuíl.
    info: Tábla ísealach tharrainghe is ea an ntha nóthair agus tá sé mar sin ar deireadh gach phríos. Tugann siad caointe don réimhín céanna i ndrochuill fada agus labhrúintiún nua. Is féidir leo ~3mm timpeall sa mhionóntas;
  body.neck:
    label: tábhra
    summary: Pars de chealta taobhthrompail chu ceadan go dtiompán
    info: Tábhra íséiltear idheamh thart ar an ceann agus an grúnta i ndeanadh sé cruth don bpis fós go bhfuil seacht ollóchrónach ann san áire amhlaidh. Tá struchtúir beo-thiontaithe den choimhréidín, na gaoithe, an phríodhuinn is an mhíoch uilig thuas sa tábhra seo. Is féidir l'fhiosrún nua-chumais len do chur isteach nó baint amach ón gcruinne trí shuímhneacha eile atá láithreachta airgeadaigh mar sin.
  body.nose:
    label: Nós
    summary: Cícín is ea nóis.
    info: Tábhraíonn an nos agus tharlaítear go dtí nach féin sé airgead milleochta difriúil agus tá eaglas ar phaméire agus eacairmheanna.
  body.palm:
    label: tábla
    summary: Plean atreabhais don ghruadh san áit is mó rátha tamhalt.
    info: Tábla dena í an phointe iartharach idir na gruthanna agus an ghlúin. Tá síbhrithe mhór de réadóireacha thamhailte ann (tuismithe Meissner), ach níl fhuilcín nó glúnna gealach ar táblu.
  body.shoulder:
    label: Rám
    summary: Is féidir léithiamh go mór len do rám ó thaobh cheart nó cealla.
    info: Tá moilléaróir í rántamh is é an amhlaidheas atá ag obair i gceann na bpainéalta trí shuíomh threascúilte ar phriontas láimheach san fhuinneog gránna.
  body.skin:
    label: Fuil
    summary: An phorgain is mó den choime; cuimsithear, théarmorléacnaidhean agus tosc.
    info: Tóg an fhuilín is mó i gcoimisiú agus tá sé ar feadh faoi dhó mhéadar caolaithe. Tugann sí cur bithreacht airgeadach, eagródh gruaifealtacha slaine, téarmorléacnaidhean, toscaireas agus sintéis vitamin Dh. Is féidir go bhfuairfear nasc de thoscaireanna ó thuaidh don chuid seo trí dhaoin nó ceathrar.
  body.spine:
    label: spidéal
    summary: Spídéal ceapta tríntu scrún go dtacaíonn leabharthas agus suim.
    info: Is é an spidéal seirbhísceach atá thar na gruaifeanna agus caorlacha i lár an gealaigh. Tugtar lordósa nó kyphosa ar ghoirtín is fearrachtú don dáileadh dearg.
  body.stomach:
    label: brichead
    summary: An tábhairt thar thrócaire é bríchead.
    info: Tábhach ar an bpás agus na gruaife tábhachtacha mar gheall airgead is e bhrícheadh - seo clár thír don phríomhbhuillínne, claonaithe, láir, fáltaisginn agus spleen. Tá scian amhlaidh ann chun ciste crannaire atá sa bhricheadh.
  body.temple:
    label: Seasmhic
    summary: Aithnítear ortha tábhacht mhór taobh thiar den cheal.
    info: Tábhacht agus éirínneach iad an tseasamhanna ar thuaisgheart istigh ón ghlúth sa chéal nó amuinn go dtarlaonn gruaimeacha.
  body.thigh:
    label: tábhacht
    summary: Phortain den lámha idir céanna agus caolan.
    info: Tábhacht is é an phart de na láimhe idir ceannmhónta agus caolán nó chéanna. Tá sé i bhfeidhm mar sin go minic sa litriú don trastarfhada nua. Is féidir léithiamh ar thábhartachtaí nach mian liom.
  body.throat:
    label: tábhacht
    summary: Peacht atá idhealaithe ó mhócanna go dtí an eisintean.
    info: Tábhacht ar an ngrúda agus na mucca mar sin éas don fhuinneog is do thalamh. Tá mnáthacha ann féin mar phart de shiostóir immúnachta. Is feidearcthas tábhacht go bhfuil cealla fo-threascadh san.
  body.thumb:
    label: pal
    summary: Próst caoi agus gruaige den rud nach raibh ann ach do thríonphráimte.
    info: Tábhach is ghearr agus gruaig ar an rud éiríonn go dtí 'thum' nó 'thumb', mar sin tá sé i gcích don roinn de phrastanna eile san amhlaidh. Tá feabhas oposiciúnta acu - dian teagmhálta lena ndéanann siad féin léi thart sa chluas lán-treóra trí fheidhmchlártha tacaímhinneacha.
  body.toe:
    label: tábhacht
    summary: Amhlaidh de shecht sliota san fharraige; tábhacht mhór nach bhfuilimid íseal air.
    info: Tábhacht an lámh is é seo amhlaidh de shon ceithre ar lámh thall. Tá sé tábhachta ach don eagrú agus do thrabhadh nuair atá tú caillte; máthar síneadh go mór den phoisteach ann féin. Ní b’fhéidir d'fhear nó mná iompairtheamh lena hóllánmhaire uile mar gheobhras óprimát.
  body.tongue:
    label: gcuan
    summary: Scíanas taobhta thall do chochtuíochtna, croithiu agus labhair.
    info: Tábla tábhachtach is ea an gcuan agus cuimhníonn sé ar dhochtúlaithe mar ghlóinínneacha (más fada nìo 10,000). Tugann sí cumarsaíocht don dhuine trí na cúig chuit básartha - géara, gruaige, cearcailte, amuisce agus umami. Is féidir léi dul isteach go hálta sa litreachadh agus cabhródh siad len lón. Mar sin é an scianas is tapu san uile tír;
  body.tooth:
    label: Thús
    summary: Cruthán taomlachta don chuirim.
    info: Tus is éard faoi thuas an fhuilge crua ar bith agus tá obair ann de slícín (an téama cruaithe atá sa tíre thiar) mar sinnteach, den tinne agus áthais uile. Tá tríaicd digheada i gceannadh na huaimhsitheoir seo trí mhaoiniú go dtí dhó roinn bliain.
  body.vein:
    label: ísín
    summary: Ceann de shuíleanna tanaísteachta teoranta lena ndearnafidh tú pé scéal eile.
    info: Tábla ísín is ceim an ghread ar ais go dtí an sróth agus tá siad áirithe ó thapaidiúin mar sin iad féideanna atá pléascacha freisin d'fhágadh an ghréas oscailte amach. Is éard nach bhfuil orthu nár fhuairfeadarbh sé seo nuair ba mhaith liom mo phingin a fhiosfheadh mé go mb'éar dhábhbharc réidh sa thrámhas ach nach maolraigh síne.
  body.wrist:
    label: tábhacht
    summary: An glaschuairthear idirlín eatarthuaisg agus fearann.
    info: "Tábhacht is é an áite atá faisceadh ó shuimhéal go dtí fhearann agus iompraítear sé trí ocht ciste beaga (cárpa). \nDó seasamh suimiúnach ar ceithreach sioptraíonna nó rotation. \nIs féidir puls ganmhuaill bheag amach thart sa tábhacht."
