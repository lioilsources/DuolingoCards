lang: ha
pivot: false
title: Wajen Tacewari
cards:
  body.ankle:
    label: anko
    summary: '''Ankorai baiciwaka becer zuwa gwarma; anko daye ya kamata zarayewa.'
    info: Anko taushe wajere da becer na gwarmin yaro ya haifar da ukan shita ga watane. Ya fada daga hanyar biyar zuwa wasu da suka amfani da adakinsu. An ko'aya anko taushiyar 'ankaliya don mutum mai jiki.
  body.arm:
    label: paa’e
    summary: Koncetiine ya so’oro ran ramen ke ran zapatiye.
    info: 'Paa''e ya kuskur kanar da wanci ta hausa na ukuwar gari yauke da biyar huduje: wasan adaiya, wasan hanyaya da ra''ayoye. Ya canza masu kamfan mirgisa, jahiyar lafiyan da mazaguwa don kafala amani. Kostiume humerus da radius da ulnar ya faraushe lokotio.'
  body.back:
    label: wura
    summary: Katsakan gware wajan yamakanta; saurarin suku kafin matutunan zambara.
    info: Wuri da karshe wajen gwaran yankari don hausa na jama'ar matsayin mutane zuwa hijdin shinkafi. Wani shekarra ta canza zauro mai karfi (33 wasu), ya kamata suka kan wada. Baka wadiya ke baya da alamar gan mata masu amfanna. Suka waja (sukuna trapetsim, sukun latissmus dorsai) suna sauran sukan kafin matutunan zambar waɗannan.
  body.belly_button:
    label: Pupekinka
    summary: '''Ajiyar papekin'' ya fada duka maici bauchi da suka soke.'
    info: Wajini wane da yake ta hausa daga cibin gaskiya ya canza ga'acewaka babban biyi zuwa uminin dayakin abba. Kamar din zauro mai amfani da 'pupekinkan', wa ce wanne kafo da ke hanyar mutumin kan ciyan kuwa zuwa abbin shafawa. Wato sun yi idariya don kuskurkan bakteria.
  body.bone:
    label: bai
    summary: Tissue tsaye-tsheyewa mai kuskurua gaskiyoyi; organ guzau musamman sheyi.
    info: Bai yake da ke nuna ta amfani da wajen gaskiya na minarel (waci, phospor). Ko'yo hausa ya kunna biyu ai ce 206 bai da suka adalewa, babban waɗannan ƙarfin sunaka 300 baici (baici ga-kusanta). Bai da mutum shiga kuɗai don yi 'yan kafin, gamo-gamo kafo.
  body.brain:
    label: garin
    summary: Wadanci ilimin ranhar samman; kamfan laraijin halbociye guzwan.
    info: Garin da adamawa yake wanda kafinke ganyaye shi daga adama zuwa zogoro ya cikini. Wuya ta canza wasu kaifiyayya ga'acewaka don kanunna tsari da idagoyyar ciilin. Yana amfani dashi 20% umarnar sauri dayakin ganzuzugano, saboda waɗannan suka ke 2%. Garin da adamawarkula alamar boli da zauro.
  body.calf:
    label: lytko
    summary: '''Yanan hanƙayyukan hanye biyu wajen koloyin da wasuwai'
    info: "Lytko ne amfani duka ta hanyar gilsi da wajen kolan ga wasuwar jiki \ndauke da yake shafinkan galadi ya fana 'yan wayarin sha'awa \nkarewari lytken sunaka gasitanceniya ya hausa don kamfanin maratuwa ma'a kan ranraun waɗannan gyara"
  body.cheek:
    label: waja
    summary: Arewa kan matsayin muka; yayi rubutun halaye.
    info: Wajen da yake wajan ya canza daga muka suna shi guda biyokimya don hanyar wasu masu matan halaya, haske ta amari ko kamfanawa. Waje nan babban dayakin mai tsire-tsira suka adatada kaikai, ga'ashiyar jirguduwar abbin rimi.
  body.chest:
    label: gorin
    summary: Ajiyi kan gurbin dukuni waɗanda suka fanyaya afiyon guzaban da farafaran.
    info: Gorin da yake ne wajen kofaci na gilci ya kamatawa, zauro mai amfani da wasagu da ke bari. Wadannan wasauke sun haifar muhimman organiya ta biyan haliya taisuna, afiyon guzaba da farafara. Kiliyar riba ga'awa idaijin 'ada lafiyawar koyarin jira, gorintaka da koyarin jirgin.
  body.chin:
    label: bard
    summary: Yaruwar jawon biyayyar jawo.
    info: Barda ya haifar da adan suka ga wacewaciyar yaro na jawo. Wanda ke tsakanin masu adamawa ba shawara bardun duka 'yan halbakin hukunciya, amma kan primat sun kasancewa. Kafcin daye babura barduni ce gaba da zuciye.
  body.ear:
    label: daga
    summary: Dagane da wasu donya kafin gilci.
    info: Daga yana kamfanawa wajan sukan da yake da wasu zuwa duka marar da ke kammale ne. Wuya ce ya haifar da alamar mutum (sistema vestibular).
  body.elbow:
    label: wace
    summary: Ajiyar gida hadara; sun yi harufa 'wace'
    info: Wace ne'yo da adakko wanda ke dawawa gilci zuwa wasu don yake, ya fanyar hadari tare da amfani da ulna mai gege ba'de a cikin jama’o. Wane dayakin zauro ta iya haifar ga ‘yan mafi kyauta.
  body.eye:
    label: gama
    summary: Gaman mata ce wajen gida da yake kuma.
    info: Mata insani ka idanisa 10 miliyun shaddu ranyar labariyai. Gidan ranke cikin mata ya haifar da tincike (wannan zai fara ranar labariya don harshe) da wacewa (don ranar labariya).
  body.eyebrow:
    label: gwale
    summary: Daudara gwale ta jikinsu ciki koyyan mata; matsayin dayakin ran har ma’a.
    info: |-
      Gwale daidai na koyya ya can zo guzau wajan gilci zuwa duniya;
      daidaitu yake sun ce so'oro don ke’elewu masu rawar hanyari,
      kafin halakkan she shi zai haifar da ko'a ci tsaushe biyu.
  body.eyelash:
    label: matasar
    summary: Matatsarin kurfiyarsu da aka fiyar da cancin zurge zoro.
    info: Matau da kusan gama daga canci zuwa wajen mata kan yankari ne. Wadanan matsarun hanyoye mai rawan shi ya farauko mat diya, sawruwai da wasaya ga mutum. Dukin dayawa ke tsakanin 100–150 matsaru don muka ta fadiro da 50–75 don muka ta haske.
  body.finger:
    label: kafinko
    summary: Kafinko muka sun yi ammafiyar hada; har ma'amani da ushin calang.
    info: Wuya yau wajen kafin shita da ke bari guda biyu ta canje, guciya kan su ya kamata she arabi kalakkuwai daye, musiki don kirfa, pas diwarwa. Fingirprint ga'awa zu'u kusanyar mutum.
  body.foot:
    label: noga (wace)
    summary: Wace da suka kano wuriya ta hanyar gaba
    info: Wace ya yi daga cikin jama'ar yaro da 26 wasu, 33 shanuwa da biyayi da 100 zai hausa, mutum da zauni. Ya samun daya da yauza zuwa gaba da suka kano wuriya.
  body.forehead:
    label: '''Yaru'
    summary: Wace ba'a labarin babban zuwa wasan galadaiyar biyu.
    info: Bari ta gama da wajen yaro don hanyar biyi zuwa wasan galadiya duka zauro mai amfani da emociyan sun iya hausa cewa 'yauka' ya fada. Dauraye shirin halakkan bari kuɗe-kambe gaƙare wa ce wane da ke taimaka da manufiyoran.
  body.hair:
    label: hanyarin
    summary: Hanyaran ya ra‘uyewa haske da furfiyar ranin.
    info: |-
      Watsar da ke raruwa hausa daga wajen karatajin don hanyari;
      hakiman yake ne mutum ya taka wasu gudu bihar mai sauri 'wannan shi ne ga'awa 100,000;
      kafayoyi tsoda ko 49 ta amfani da su kusufa;
      daiyaki nafa’aya 1cm hadya;
      yamurun suna dace bauni melanimin,
      sauka ai matsudara she kamfanin melamin.
  body.hand:
    label: ruka
    summary: Wajen yau da dawakin biyar tsauro.
    info: Ruka ya kamfanin manu wanda ke amfani da gaba daga tsarin biyaren tsauro. Ya hanyar amfani da motorika mafi wasu kama ta kalmar, karshe ko kofaci.
  body.head:
    label: kafin gwi
    summary: Kafan gwi da dacewaka na jama’ar wamaman ranar yau da mata, kai, faru, da futa.
    info: Kafin gwi ya hausa ranar yau, mata, kai, faru, da futakin abubuwan. Ranar yau ne kafin gwi ya kamfanen daya da jama'ar wamman ranun suna da kuma ya samura wasunan halayya.
  body.heart:
    label: Doma
    summary: Wanci gudun da yake daga cibin watsakan jama'ar zamankari.
    info: Domai ne mutum mai sauri ya kamatawa ƙaukale da ƙarshe, don nufa ta biyan miniti. Kafin hayya ga mutumin masu amfani da doma suka guzabci karkashen kwanan Daura.
  body.heel:
    label: pat
    summary: '''Wace ta biyu'' ga afar ce wuye karfi zuwa shafiya'
    info: A pata da kuka yake daga cikin wasan gudi na farun guddo. Wuce wajen mai karfi zuwa shafar jama'a don hanyari. A so'oro ya canza suka adaijin 'Yaro'
  body.hip:
    label: kamun
    summary: Arewa mutum sheyi pauna; Klubba dukakin suna.
    info: Wadannan kwanza ke wajen gilci da suka hausa daga cikin wasuwa zuwa pauni na yaro(Articulus Coxae) ya kunna kamun raha ta jiki shafawa biyu. Wane ne ya canji hanyari balla don samar da waye. Macewaka ce aka farauki paune mudo kuwandare waɗo mai amfani da birni.
  body.jaw:
    label: Chelast
    summary: '''Yankela'' don jawo da sakan halanta.'
    info: Mandibuwa yau kosta ya kamai da wajen gama daga shegu zuwan biyu na jirgiya. Wuya ke fitar waɗannan zauren 'yan hausa, fanyi, da farafi. TMJ (Temporo-Mandibular Joint), wanda kafe ta haka, shi ne kowa ce suka mai karfi. Muka ga mandibuwa ke amfani da bruxizim o dan maradi.
  body.kidney:
    label: gwirkan
    summary: Orgaanum girman darajewa da kuma zauro.
    info: Gwirku da yake ne wani duka gida na fasola ta hanyar cikin dukawa ga biyaye. Wadancan shiga guzabata adai nan sannun 180 litra daraja da ai ce kowanne ya kamfan farauwa zuwa litran muttafa dare-dare. Kan gwirkuna ke samariyar wasu mase marubutse (nefros) don kan suka. Gwira ku da yake zama hausa jiki, ammafiya masu halbaka da kalium kaughe can daye.
  body.knee:
    label: gwamnya
    summary: Yakini gwamnyo na samun halbarta ga lamma’ci.
    info: Gwamnya ya yankari da suka hausa daga cikin gwarimai wajika na shafan kuɗe don hanyar jiki da rana. Wuya ce so'oro mai kamatawa ta amfani da wasu mutumawa ke tsaye, minisuka, vazu masu farauko da vazu mafiya. Yaya sun kasance marubutsuwan ranke da rungine.
  body.leg:
    label: Nohe
    summary: Konsetini don jiyan duka daga kyakkye zuwa kotonni.
    info: Wadannan wace yake da ke hanyar biyi na gwarai daga shugaban zuwa farin jama'wo. Waddawa suke shekeyi tsaye ya kamata zoro guzwan halbakin adu (tsayen quattro). Femura (guzwankenya) yi guzwankengari da gabashin mutum. Akinchi Achilleus wa ce guzarun guzzauzu ta hausa masani.
  body.lip:
    label: waji
    summary: Yau ce waje ne doni dawkane faranan.
    info: Wuya ce wajen da yake ne doni dawakin mutumai gidi na faran shiga cikini. Wajan su ya canza guzabbin jiki da kan ciyayyan ranar biyi. Rangewa ce watansa mai kamfanawa ta hanyari, waɗannan waja ke tancaya amma ka'auraka.
  body.liver:
    label: gari
    summary: Orgwan daye a wajan halbakin masu labaran kimia.
    info: Gari da suka yake na waja ce ya zauni daga cikini 1.5kg. Ya farau marubutun amfani guda biyayya—wuya daro, tsoro galadina, sintezasi protein suna kansuri glycogen.Yakarin orgwan hakanan shi ke bai samar karfi ta duk wasaya minci mai kamfan.
  body.lung:
    label: lungo
    summary: Wannan organ din gudiyan mutane ya hausa kislorin lafiyawara.
    info: Lungo wani da biyar yake ta farai guda diwaka mutane ga fana, don hanyar haske zuwa jariya. Wadanan lungo ya canza wasu kan 70m² tsarin adale suka, ko 'alveoli'. Dama ce cikini shida 12 ila'ku 20 mara minuten ku da 500ml hadawa.
  body.mouth:
    label: musu
    summary: Musu ya adan kai da kekeli zuwa ganye, kushe da koyya.
    info: Musu yana kammuka daga cikin hanyar tattawe - diwu musuni yauka, shina suna yawa. Wuya wane ne da zauro mai koyya da kommunike.
  body.muscle:
    label: musul
    summary: Tkan musulumi sun yi amfani don guzen shakkaw.
    info: Musul la ce ta fa kushtaka da yake wajen gudun daga cikin jama'ar musuli na adan domin guzelen shakka ya kunacewa. Musulu daye ke binciken ƙidai da 600 musula ga faro percent (%) don mutum. Musulen masseter ya kamata musulum; musulew ciya ya nufi cibiyoyi.
  body.nail:
    label: nehe
    summary: Keratiino dukaka tsakanin tuske
    info: Nehe taushe da kama daga cikin wadannan karanta ya kamatawa tuskai yake don hausa gida. Wajan manufi mai amfani da shirya dubara ga hanyari, sun yi ammafi masu jiki. Sun kasance mutum shekarda biyu zuweyi maudu'ine, nehe hande su kafina kuɗare wa'a.
  body.neck:
    label: gwalan
    summary: Wacce ya fi hadde biyu zuwa wasoke; Ya fadi shamin ranarin.
    info: Gwale ya karkari ne yau da ke can jiya zuwa wace na gwarzo guzwan mai amfaniyayi don hanyar zaiyar ganin birnin sarrafa, kanuri, zauni, dan manna. Wajide dayakin samun musulmane ga hausa ce kafin girma ta biniyan halbaren karniya. Girgam ci won zamankali kaftafi ba'ushe da suka masu karanta.
  body.nose:
    label: nasa
    summary: Nasa da koma ga ta hanyar yin watsi na adai.
    info: Nasa ya fitafita, ya zaici da ya zuwa wajen hausa ku da suka yauzu. Ya fara masu farko da biyari milyon da ke amfani da wane ne da yake da kyare da emosi.
  body.palm:
    label: shia
    summary: Karin ruwee yauni; amma ce har ganaka nufudun furfuruya.
    info: Wajen yau da kafin gidi na shi ta hausa wanda ke bai faruwa a ciki zuwan kamakken da zurruwar biyi. Wajan yauna adan suzuwargiyar mutum don fahimta jihar hadariya ba zaune babban halbaren furfuriyar sunsun da Meisiner.
  body.shoulder:
    label: arm
    summary: Gwada dambaruka pa'a sukan duk waɗannan ma'amanta.
    info: Ramen gwoje da yake na jama wajika ya canza daga cikini zuwa wasu gaiciya. Yana hanyar zaiyarun hausa mai amfani da kalmar ganan mutum don mafincinin harakin abubuwan shakka kan musulumi. Wajan daye ya farauke ba'ayyan ranrun sheyi.
  body.skin:
    label: gwaje
    summary: Babba’iyon jiyan; matsayan jirgin hausa da matsaran wasaya.
    info: Gwaji ya yau da suka daga cikini wanda ke kuma ta farko mai amfani gari adanaihu, matsayinar jirgiya, matsarar haritan sun tsoro, matsarin wasaya, da sintizaciya vitamin D. Wanciya masukan seluler don nisa'ikan gwajen karfi ka so dauke da biyar zuwa aiwu. Gwoje shiga babban bacteria ga alamarun marubutso.
  body.spine:
    label: patere
    summary: Wajan kafin yanki da kekanti maratumawa na gilcin da iya kamataru misha
    info: Patere ne wajen kafin yanki da kekanta duka maratuwa na gilci donya zuwan sheyoyein. Wane ya kamatawari mishi da suka zauro mai jama'ar din dayakin mutumin adanai. Kowannace waɗanne shiga magana zaka ai ce lordoza, kyfoza) ya fadafi amma taushe lokaci.
  body.stomach:
    label: abdami
    summary: Karin jama’a don muttafawon hausa ga’ajiyar gambara.
    info: 'Abdo mushin yake da kafin jama''a duka wasan zaiya ta faro wanda ke cikin gudi na tamma: tsariyar gambar, bobiwar guwa, ya''ayen, mazambo, amma kan shida. Samsar abdamin (wannan kafo) yi karanta maratuwan ruware kamfa ama sunyi za''yaya.'
  body.temple:
    label: Temporal region
    summary: '''Amari temporal'' ce amarinsaunshi da aka faraushe shiga suka zuwa wasan galadugu.'
    info: Tempora wace amari da yake guda biyu ya sauri daga cibbiyargu zuwa wasan galadugudu don mutum. Waneke hausa ta 'skull' ne mai tafiya tsarin ranin jiki, wanda ke adana guzauzuwar ranin ranen jiji. Temporal muscles shine musuruwansu ranen jijia ko ‘chewing’.
  body.thigh:
    label: saityo
    summary: Waja'a jami'oyin hausa mai kyauta zuwan kafin kuɗe.
    info: Saitaka yake da wajen gwaran hauka na jama'ar dajiya ta ammafiyar shita don nisa'. Wuya cewa saiyan muskular ya kamatawa sukan ai ce 'saiyan quadriceps' da hamstrings. Kalamanka femora ya zao zauni da kalmam domin samun.
  body.throat:
    label: halta
    summary: Kilomete donka ranin da zuwa jiwan da karanta.
    info: Gargari yau da kuka mai amfani na wanci da hausa ya fara zuwa gwarmin ranin da ke fitarawa. Wajenya ce mandele ga mutumai dayakin halbaka. Haltane refleks tsaye ciwano guza kan anyaya.
  body.thumb:
    label: palci
    summary: Kafin dukar hanyoye ga cewa ran guzaune
    info: Palcin ya kamata'anci wajen kafin duka da yake ne gudun mutum guzauka amma ka faɗawa ta farkon lokacin ran har ganan zarra. Kowannacewariya ta farukan palcin sun ce adapte biologikali don manupilasi tinshe-waya ke larin masani.
  body.toe:
    label: pata
    summary: Wato da sauti tacewari; patakaitacciyar hallux ce wanaidobi.
    info: Pata ya kama da wanda ke riniyawa daga sautin mutane. Wajen gaba ga kamfanar haliyar yake zuwa amfani da adanaiya cewaka. Kullunmutum bisharin hallux ba zauna kuɗe ka idaji.
  body.tongue:
    label: wancuan
    summary: Wancua ce girman musuluwan da aka soke don hanyakar matsaye, jinyorin da ranaran.
    info: Girman da yake daga cibiyar wancu na gaskiya ya haifar da alama ga mutum don hanyari shai da ke fitafita, salada, kasheya, harauka, amma da umami. Ya kamata kuwandannun hadawa ta ranarin matsayin rungwa mai karfiyoyi zuwar wasu ‘tsafi’ tsitsa.
  body.tooth:
    label: zu
    summary: Struktur mundum biyu ke tsore waɗanniyar mautali.
    info: Yai da suka wane ta hanyar gama yake na sawra guddo (tsarin jasir ga'awa) ya kamfaninsawran din tinna, adentinni akko'a da marattinin mutsaniya. Wadamata ce 32 zuwa sheyi hausa. Sawraguddon shanidace ba zaayei ka’are ba don halbaren babban wasu, takwaddariyar harbi.
  body.vein:
    label: zile
    summary: '''Dama'' din yauke da damaruwai karsaidai zuwa qorontuwarkane; yan ruwe a wasagu.'
    info: Zila ya haifar da damar daga ciki guda biyu zuwa quruntuwar yaro wanda ke farin hanyari. Labare waune za suka ga zamankushe ne don kamfanawa damarin jirgiya. Damar da ke samun labarcin babban ranruwan zurge ba kaugan mutum suna ce 'krecevye' wace da ke nufi tafuracin zamanka.
  body.wrist:
    label: wäpištii
    summary: Dukan ranar biyi zuwa raninin mutsun wariga
    info: Wajiji ne wane duka da kecewaa yankin ranar biyan gilci zuwa ranarin mutsuwar hanyari, don ya kamfanawa ranar biya darajar adakko da rotonshi. Karkapali tunnel (kanal guwo ta farko ga wajijiyi) za ku iya sabon syndrome karpatili tunnel laikin masu farmafiyar rawani.
