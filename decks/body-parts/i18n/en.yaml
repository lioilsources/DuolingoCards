lang: en
pivot: false
title: Parts of the Body
cards:
  body.ear:
    label: ear
    summary: Sense organ for hearing on the side of the head.
    info: The ear captures sound waves and transmits them as nerve signals to the brain. It also contains the balance system (vestibular system).
  body.eye:
    label: eye
    summary: Sense organ for vision with a colored iris.
    info: The human eye can distinguish approximately ten million color shades. The retina contains rods (for low-light vision) and cones (for color vision).
  body.foot:
    label: foot
    summary: The part of the foot on which we stand and walk.
    info: The sole supports the weight of the entire body and enables walking upright on two legs. It has 26 bones, 33 joints, and over 100 muscles, tendons, and ligaments.
  body.hand:
    label: hand
    summary: Part of the arm ending in five fingers.
    info: The human hand is an exceptionally dexterous tool featuring a thumb capable of opposition. It enables fine motor skills such as writing, drawing, or sewing.
  body.head:
    label: head
    summary: The upper part of the body where the brain and senses reside.
    info: The head contains the brain, eyes, ears, nose, and mouth. The brain inside the head is the control center for the entire body and processes all sensory experiences.
  body.heart:
    label: heart
    summary: Muscle pumping blood continuously throughout the entire body.
    info: The heart is a hollow muscle about the size of a fist that beats an average of 70 times per minute. Over its lifetime, it pumps blood over distances equivalent to three Earth circumferences.
  body.mouth:
    label: mouth
    summary: Opening in the face used for eating, drinking, and speaking.
    info: The mouth initiates the digestive process – teeth chew food while saliva breaks it down. It is also the primary tool for speech and communication.
  body.nose:
    label: nose
    summary: Organ for smelling and breathing located on the center of the face.
    info: The nose filters, warms, and humidifies inhaled air. It can distinguish over one billion different scents and is closely linked to memory and emotions.
