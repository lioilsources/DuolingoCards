title: Parts of the Body
cards:
  body.ankle:
    label: ankle
    summary: Joint linking the heel bone to the shinbone.
    info: The ankle is formed by three bones connecting the lower leg to the sole of the foot. It allows movement upwards and downwards along with slight side-to-side motion. Ankle sprains are among the most common sports injuries.
  body.arm:
    label: arm
    summary: Upper body appendage extending all way down towards wrists.
    info: 'The arm is an upper extremity composed of three segments: forearm above elbow joint area called ''nadloctí'', lower part known as wrist (''předloktí''), followed by hands themselves; it contains over thirty muscles along their respective bones which facilitate movement through tendons connecting them together at joints like elbows where humerus connects radius & ulna.'
  body.back:
    label: back
    summary: Posterior portion of body's core structure.
    info: The back is located at the posterior part of the trunk extending from the neck to the hips. It contains the spine made up of thirty-three vertebrae surrounded by muscles such as those found on the backside itself.
  body.belly_button:
    label: bellybutton
    summary: Scar on your stomach after cutting off the umbilical chord.
    info: The belly button is an scar at the site where the umbilical cord was attached to provide nutrients for the fetus during pregnancy.
  body.bone:
    label: bone
    summary: Hard connective tissue making up the skeletal system.
    info: Bone is made up of bone cells and mineral salts such as calcium and phosphorus. The adult human body has 206 bones while children have over 300 that fuse together later on. Bone marrow produces red blood cells, white blood cells, and platelets.
  body.brain:
    label: brain
    summary: Control center for bodily functions; most complex biological structure known.
    info: The human brain weighs approximately 1.4 kilograms and contains over 86 billion neurons. It is divided into two hemispheres—the left hemisphere controls movement on the right side of the body and vice versa—while it consumes about 20% of the entire body's energy despite making up only around 2% of its mass.
  body.calf:
    label: Calf
    summary: Posterior section of the lower leg located beneath the knee.
    info: The calf is the posterior muscular portion of the lower leg between the knee and ankle. The main muscle of the calf (gastrocnemius) allows standing on tiptoes and jumping propulsion. Calf muscles play an essential role in returning blood to the heart through veins.
  body.cheek:
    label: cheek
    summary: Fatty region flanking both sides near mouth corners showing emotions via blushed coloration.
    info: The cheek is an area located at each side of the face containing facial bones such as the malar bone along with fatty pads that give it its plump appearance. Blushing cheeks indicate emotional responses like shyness or excitement due to physiological reactions involving blood flow changes under skin layers where capillaries dilate automatically without conscious control over them by brain signals sent through autonomic nervous system pathways which regulate involuntary bodily functions including heart rate adjustments during stress situations when people experience strong feelings about something happening around themselves.
  body.chest:
    label: chest
    summary: Anterior part of the trunk containing vital organs such as心脏和肺.
    info: The chest is bounded by ribs, sternum, and spine on its anterior part of trunk body section area region location position orientation direction alignment shape form structure composition arrangement organization system network pattern layout design plan scheme model framework skeleton architecture blueprint template format style appearance look feel vibe essence core heart soul spirit mind brain thought idea concept notion belief opinion view perspective angle approach method technique strategy tactic policy rule regulation law statute ordinance decree commandment instruction guideline manual guidebook handbook user's manual operating instructions directions guidelines rules regulations laws statutes ordinances decrees commands instructions directives guidance manuals handbooks guides books texts documents records files data information knowledge wisdom understanding insight awareness perception cognition recognition identification detection sensing feeling emotion mood state condition status situation scenario context environment setting backdrop background foreground middle ground near field far distance horizon skyline landscape scenery vista outlook prospect expectation anticipation hope optimism pessimism fear anxiety worry concern care attention focus concentration effort energy strength power force might influence impact effect consequence result outcome product yield return profit gain benefit advantage edge superiority dominance leadership authority control management administration governance oversight supervision monitoring evaluation assessment judgment decision choice selection option alternative possibility probability likelihood chance opportunity window opening door passage gateway portal entrance exit way path route trail track trace line lineage descent ancestry heritage legacy inheritance succession continuation sequence series chain link connection relation relationship association correlation dependency reliance dependence trust confid