lang: vi
pivot: false
title: Các phần của cơ thể
cards:
  body.ear:
    label: tai
    summary: Cơ quan cảm giác nghe ở bên đầu.
    info: Tai thu nhận sóng âm thanh và chuyển chúng thành tín hiệu thần kinh gửi đến não bộ. Nó cũng chứa cơ chế cân bằng (hệ thống tiền đình).
  body.eye:
    label: mắt
    summary: Cơ quan cảm giác để nhìn thấy với màng bồ đào có màu.
    info: Mắt người có thể phân biệt khoảng mười triệu sắc độ màu khác nhau. Màng lưới của mắt chứa các tế bào que (dùng để nhìn trong bóng tối) và các tế bào nón (dùng cho thị lực màu).
  body.foot:
    label: chân (bàn chân)
    summary: Phần dưới của chân mà chúng ta đứng và đi lại.
    info: Bàn chân chịu trọng lượng toàn bộ cơ thể và cho phép đi bằng hai chân. Nó có 26 xương, 33 khớp và hơn 100 cơ, gân và dây chằng.
  body.hand:
    label: tay
    summary: Phần tay trên kết thúc bằng năm ngón tay.
    info: Tay người là công cụ đặc biệt khéo léo với cái姆 có khả năng đối lập. Nó cho phép các kỹ năng vận động mịn như viết chữ, vẽ hoặc may vá.
  body.head:
    label: đầu
    summary: Phần trên của cơ thể chứa não và các giác quan.
    info: Đầu bao gồm não, mắt, tai, mũi và miệng. Não trong đầu là trung tâm điều khiển toàn bộ cơ thể và xử lý tất cả các cảm giác.
  body.heart:
    label: tim mạch
    summary: Cơ quan bơm máu liên tục khắp cơ thể.
    info: Tim là một khối cơ rỗng có kích thước bằng nắm đấm, thường đập khoảng 70 lần mỗi phút. Trong suốt cuộc đời, tim sẽ bơm máu đi được quãng đường tương đương ba vòng trái đất.
  body.mouth:
    label: miệng
    summary: Khe hở trên mặt dùng để ăn uống và nói chuyện.
    info: Miệng bắt đầu quá trình tiêu hóa – răng nhai thức ăn, nước bọt phân hủy chúng. Miệng cũng là công cụ chính trong giao tiếp bằng lời nói.
  body.nose:
    label: mũi
    summary: Cơ quan khứu giác và hô hấp ở giữa khuôn mặt.
    info: Mũi lọc, làm nóng và giữ ẩm cho không khí hít vào. Nó có thể phân biệt hơn một tỷ mùi hương khác nhau và liên kết chặt chẽ với trí nhớ cũng như cảm xúc.
