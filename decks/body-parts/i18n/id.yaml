lang: id
pivot: false
title: Bagian Tubuh
cards:
  body.ear:
    label: telinga
    summary: Organ indra pendengaran di sisi kepala.
    info: Telinga menangkap gelombang suara dan mengirimkannya sebagai sinyal saraf ke otak. Telinga juga memiliki sistem keseimbangan (sistem vestibular).
  body.eye:
    label: mata
    summary: Organ indra untuk penglihatan dengan iris berwarna.
    info: Mata manusia dapat membedakan sekitar 10 juta nuansa warna. Retina mata mengandung batang (untuk melihat dalam keadaan redup) dan kerucut (untuk penglihatan berwarna).
  body.foot:
    label: kaki (telapak kaki)
    summary: Bagian bawah kaki yang digunakan untuk berdiri dan berjalan.
    info: Telapak kaki menopang seluruh berat tubuh dan memungkinkan jalan dengan dua kaki. Ia memiliki 26 tulang, 33 sendi, serta lebih dari 100 otot, tendon, dan ligamen.
  body.hand:
    label: tangan
    summary: Bagian lengan yang berujung dengan lima jari.
    info: Tangan manusia adalah alat yang sangat cekatan dengan ibu jari mampu melakukan oposisi. Ini memungkinkan gerakan motorik halus seperti menulis, menggambar, atau menjahit.
  body.head:
    label: kepala
    summary: Bagian atas tubuh yang berisi otak dan indra.
    info: Kepala mengandung otak, mata, telinga, hidung, dan mulut. Otak di kepala adalah pusat pengendali seluruh tubuh dan memproses semua input sensorik.
  body.heart:
    label: jantung
    summary: Otot yang memompa darah secara terus-menerus ke seluruh tubuh.
    info: Jantung adalah otot berongga sebesar ukuran kepal tangan yang berdetak rata-rata 70 kali per menit. Sepanjang hidupnya, jantung akan memompa darah sejauh tiga putaran Bumi.
  body.mouth:
    label: mulut
    summary: Lubang di wajah yang digunakan untuk makan, minum dan berbicara.
    info: Mulut memulai proses pencernaan—gigi mengunyah makanan, air liur mencerna bahan makanan tersebut. Mulut juga merupakan alat utama dalam berbicara dan berkomunikasi.
  body.nose:
    label: hidung
    summary: Organ penciuman dan pernapasan di tengah wajah.
    info: Hidung menyaring, menghangatkan, dan mengembunkan udara yang dihirup. Mampu membedakan lebih dari satu miliar aroma berbeda dan erat kaitannya dengan ingatan serta emosi.
