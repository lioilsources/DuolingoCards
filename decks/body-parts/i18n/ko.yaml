lang: ko
pivot: false
title: 신체 부위
cards:
  body.ankle:
    label: 족부
    summary: 다리를 따라 다리와 발 사이를 잇고자 하는 관절; 자주 상처받습니다.
    info: 발목은 종아리 근육과 발을 연결하는 세 개의 뼈로 구성된 관절입니다. 이는 발이 위 아래와 약간 옆으로 움직일 수 있도록 합니다. 비틀린 발목(관절 탄성 손상)은 가장 흔한 스포츠 부상 중 하나이며 아킬레스 건도 여기에 있는 족저뼈까지 도달합니다.
  body.arm:
    label: 팔
    summary: 손목부터 어깨까지 연결된 상체 부위.
    info: '팔은 어깨에서 손까지 이어지는 상지로 세 부분으로 구성되어 있다: 팔뚝(상완), 전완부와 끝에 있는 손이다. 약 30개 이상의 근육과 뼈 그리고 인대가 움직임을 가능하게 한다. 상완뼈(humerus)는 주먹이 잡히고 턱받이는 엉덩이처럼 생긴 모양이고 반면 외골(radius)과 내골(ulna)이라는 두 개의 작은 빛나는 골격 구조를 가진다.'
  body.back:
    label: 등
    summary: 몸 앞면이 아닌 상반신 후방 부위로, 몸 전체 최대 크기의 근육 집합 지역이다.
    info: 등은 목에서 엉치까지 퍼지는 상체의 뒷부분입니다. 척추(척주 포함 총 33개 추간판으로 구성됨), 그리고 등 근육에 의해 감싸여 있습니다. 요통은 일상적인 병가 사유 중 가장 일반적으로 보고되는 문제이며, 삶의 질에도 영향을 줄 수 있는 대표적 증후입니다.
  body.belly_button:
    label: 배꼽
    summary: 태어날 때 자른 뱃줄기 때문에 생긴 흉터.
    info: 명치(복부 중심의 작은 오목하거나 볼록한 부분)는 태아가 어머니로부터 영양분을 받아들이던 배꼽이 위치하는 곳입니다. 명치 형태(오목 또는 볼록)는 치유 방식에 따라 달라집니다. 명지는 특별한 미생물 공동체를 포함하며 연구에서 독특한 박테리아들을 기록했습니다. 세계 여러 문화에서는 명지가 상징적이고 정신적인 의미도 지닙니다.
  body.bone:
    label: bone
    summary: 골격을 이루고 있는 단단하고 생체 활동하는 기관.
    info: 뼈는 뼈 세포와 무기염(칼슘과 인)으로 구성된 단단한 조직입니다. 성인의 골격에는 총 206개의 뼈다가 있습니다만 아기는 그보다 더 많은 약 300개를 가지고 있으며 이 중 일부는 시간이 지나면서 서로 붙어붙습니다. 빗장은 적혈구·백혈구 및 혈소판을 생성합니다. 뼈는 살아있는 조직이며 항상 재생되고 손상 후 회복됩니다.
  body.brain:
    label: 뇌
    summary: 몸의 조절 센터이자 우주 최고 복잡한 생물학적 구조
    info: 인간의 뇌는 약 1.4kg에 달하며 수십억 개 이상의 신경 세포를 포함하고 있다. 두개골 안에서 왼쪽 반구와 오른쪽 반구로 나뉘어 있으며 각각 몸의 대칭되는 쪽을 제어한다. 전체 체중 중 단지 2%만 차지하지만 전신 에너지를 사용하는 비율은 무려 20%이다.
  body.calf:
    label: 종아리
    summary: 무릎 아래쪽부터 발목까지 오는 다리 끝 부분
    info: |-
      종아리는 무릎과 발목 사이의 다리 뒷부분에 있는 근육이다.
      주요 종아리 근육인 햄스트링은 족저로 서는 것과 점프 시 이륙을 가능하게 한다.
      종아리는 하지에서 정맥혈이 심장으로 돌아오는 데 중요한 역할을 한다.
      운동선수와 임신한 여성에게 종아릿 cramped가 자주 발생한다.
  body.cheek:
    label: 볼
    summary: 눈 주변 및 입 위아래의 살결이며 감정 표현 시 붉게 변할 수 있음
    info: 얼굴은 얼굴 양쪽에 있는 육체적인 부위로 턱뼈와 지방 조직을 포함합니다. 뺨이 붉어지는 현상(홍반)은 수치심이나 들뜬 감정과 같은 정서적 반응으로 인한 생리학적 자동 작용입니다. 아기의 볼살은 의도적으로 통통하고 작은 형태를 취하며 이는 진화 적응 과정에서 발생하는 친부모애 유발 기능을 가지고 있습니다.
  body.chest:
    label: 가슴
    summary: 심장을 포함한 가슴 앞쪽 부위
    info: 가슴은 늑골과 흉부 척추에 의해 경계되는 상체의 전면 부분입니다. 심장과 폐와 같은 생명을 유지하는 중요한 기관들을 보호합니다.
  body.chin:
    label: 턱
    summary: 하악 밑으로 위치한 얼굴 하부
    info: 턱은 아래아래 턱뼈로 구성된 얼굴의 가장 낮은 부분입니다. 사람들은 동물계에서 유일하게 두드러진 털을 가졌으며 다른 영장류는 이 특징이 없습니다. 왜 우리는 풀어질 수 있는지에 대해서도 과학자들이 여전히 논쟁 중입니다.
  body.ear:
    label: 귀
    summary: 머리 측면에 있는 듣는 감각 기관입니다.
    info: 귀는 소리를 파동으로 받아들이고 이를 신경 신호로 뇌에 전달합니다. 또한 균형을 유지하는 시스템(전정계)도 포함하고 있습니다.
  body.elbow:
    label: elbow
    summary: 손목에서 굽히는 관절; 이름은 '곡선'이라는 뜻인 단어에서 유래했습니다.
    info: 팔꿈치는 팔의 외측에 위치한 상완과 전완 사이 관절입니다. 손을 구부리고 펴며 회전시키게 합니다. 흥미로운 점은 팔뚝에는 감각 세포가 없으며 신경(정중신경)이 통하는 곳으로 타격 시 기분 좋은 쏘아지는 느낌을 줍니다.
  body.eye:
    label: 눈
    summary: 색이 있는 결막을 가진 시각 기관입니다.
    info: 인간의 눈은 약 1천만 개의 색조를 구분할 수 있습니다. 망모세포는 어두운 곳에서 보게 도와주는 틸과, 색을 인식하는 채로가 포함되어 있습니다.
  body.eyebrow:
    label: 미간
    summary: 각 쪽 눈 위로 가는 머리카락 줄이며 표정 전달에 중요한 역할을 합니다.
    info: 눈꺼풀 위에 있는 털 줄이 눈을 보호하고 비와 땀으로부터 방어합니다. 이마를 통해 감정의 폭넓은 범위를 표현할 수 있으며 연구들은 미간 없는 얼굴보다 눈 없는 얼굴인 경우 인식하기가 더 어렵다는 것을 나타냅니다.
  body.eyelash:
    label: lashes
    summary: 곡선형으로 된 눈꺼풀 가장자리를 따라 있는 여러 개의 작은 솜털로 시야를 맑게 유지하고 외부 물체 침입 방어 역할
    info: 눈꺼풀 가장자리에서 자라나는 짧고 곡선 모양의 털입니다. 눈을먼지와 땀 그리고 이물질로부터 보호합니다. 성인은 상안검에 약간씩 다르지만 평균적으로 100~150개 정도이고 하안검에는 대략 50~75개 있습니다.
  body.finger:
    label: 손가락
    summary: 오른쪽 또는 왼쪽 손에서 각각 다섯개씩 존재하는 것으로서 일반적으로는 총 십개이다.
    info: 손가락은 손에 있는 다섯 개의 지체 중 하나이며, 엄지는 두 마디이고 나머지 넷은 세 마디입니다. 우리는 항상 열 개인 손가락을 사용하며 이들의 움직임으로 도구를 조작하고 음악과 글쓰기를 할 수 있습니다. 사람마다 다른 무늬이기 때문에 지문 인식 기술로 신원 확인도 가능합니다.
  body.foot:
    label: 발 (족)
    summary: 서 있고 걷는 다리의 아랫부분
    info: 발은 전체 몸무게를 지탱하고 이족보행을 가능하게 합니다. 총 26개의 뼈와 33개의 관절 그리고 100개가 넘는 근육과 인대, 힘줄로 이루어져 있습니다.
  body.forehead:
    label: 이마
    summary: 눈썹 위 두개골 앞부분; 감정보현 시 중요한 지역.
    info: 전두엽은 이마 위쪽 두개골의 전면 부분으로 머리카락 라인 아래에 위치한다. 감정 표현에서 가장 눈에 잘 보이는 부위 중 하나이며, 찌푸린 미간이 걱정이나 불안을 나타낸다. 많은 문화권에서는 이마를 상징적으로 표시하는 것이 있었으며(예언자 서약 또는 계급 구분 등) 신경학 분야에서도 전두엽과 같은 대뇌 영역은 결정 내리는 능력 및 행동 기획 역할을 한다.
  body.hair:
    label: 헤어
    summary: 머리를 덮고 있는 표피층 위를 따라 나는 실 같은 조직.
    info: 머리카락은 헤드 피부의 모낭에서 자라나는 케르아틴으로 구성된 섬유입니다. 사람들은 평균적으로 머리에 약 10만 개의 손톱이 있으며 하루에 대략 50~100개가 빠집니다. 매달 약 1.25cm 정도 성장합니다. 머릿결 샘색은 멜라닌이라는 색소로 결정되며, 백발 현상은 이 물질을 더 이상 생성하지 않는 경우 발생합니다.
  body.hand:
    label: 손
    summary: 팔의 끝에 있는 다섯 손가락이 달린 부분입니다.
    info: 인간의 손은 반대 움직임을 할 수 있는 엄지손가락을 가진 특별히 민첩한 도구이다. 쓰기, 그리기 또는 바느질과 같은 미세 운동 기능을 가능하게 한다.
  body.head:
    label: 머리
    summary: 뇌와 감각 기관이 있는 몸의 윗부분입니다.
    info: 머리는 뇌, 눈, 귀, 코, 입을 포함합니다. 머릿속에 있는 뇌는 전신의 중심 역할을 하며 모든 감각 정보를 처리합니다.
  body.heart:
    label: 심장
    summary: 혈액을 몸 전체로 끊임없이 펌프하는 근육.
    info: 심장은 주먹 크기의 중공된 근육으로 평균 분당 70회 정도 박동한다. 인생 동안 심장은 혈액을 지구를 세 바퀴 돌만큼 긴 거리에다가 퍼umps.
  body.heel:
    label: heel
    summary: 서 있는 동안에 전신무게를 견디며 발바닥 아래쪽 후방 부위
    info: 발의 아치를 형성하는 가장 큰 뼈는 발목뼈(踵骨)이다. 서 있을 때 몸 전체 무게 중 상당 부분을 지탱한다. 이 빌레트와 건은 연결되어 있다. 힘줄과 함께 엄지 발가락 쪽으로 갑작스럽고 심한 통증이 느껴지는 경우도 있으며, 이러한 증상은 매우 일반적인 문제다.
  body.hip:
    label: 허벅지
    summary: 골반이 있는 부위; 몸무게를 지탱하는 가장 큰 인대
    info: 엉덩이 주변의 뼈와 관절은 고관절(articulo coxa)을 구성하며 종아리뼈를 골반에 연결합니다. 이는 걷기 중 체중을 지탱하는 구형 연골입니다. 여성들은 출산 때문에 남성보다 평균적으로 더 넓고 납작한 엎드리 형태의 헤르니스가 있습니다.
  body.jaw:
    label: 하악
    summary: 씹거나 말하면서 이동하는 얼굴 아래쪽 뒤뼈.
    info: 하악(구개골)은 유일하게 움직이는 두경의 뼈입니다. 씹기와 삼키고 말하기를 가능케 합니다. TMJ는 체내에서 가장 복잡한 관절 중 하나이며, 치아 간격 문제(bruxismus), 또는 염증으로 인해 통증이 발생할 수 있습니다.
  body.kidney:
    label: 콩
    summary: 혈액을 걸러내고 요리를 만드는 두개의 쌍생기관
    info: 신장은 복강의 뒷부분에 위치한 콩 모양의 한쌍 기관입니다. 하루 약 180리터 이상의 혈액을 여과하여 소변으로 변환하며, 매일 최대 1~2 리터를 생성합니다. 신장에는 각각 수백만 개가 넘는 필터 단위인 세뇨관이 포함되어 있습니다.
  body.knee:
    label: 무릎
    summary: 다리의 허벅지와 종아리를 연결하는 몸통 최대 크기의 관절
    info: 무릎은 신체에서 가장 큰 관절이며 복잡한 구조를 가지고 있습니다. 무릅蓋와 반월상 연골 그리고 십자 인대 및 측면 인대로 구성되어 있으며 걷거나 뛰는 동안 체중을 지탱하도록 설계되었습니다. 스포츠 부상을 일으키는 주요 요인 중 하나입니다.
  body.leg:
    label: leg
    summary: 엉덩이부터 무릎까지 다리를 구성하는 하반신
    info: 다리(하체)는 허벅지와 종아리 그리고 발을 포함한다. 이들은 두발로 걷기 위해 적응되어 있으며 몸의 가장 강력한 근육인 네 먹줄근이 있다. 대퇴골은 체내에서 가장 길고 튼튼하며 아킬레스 건은 종아릿살과 굽뼈를 연결하는 가장 단단하고 강인한 인대이다.
  body.lip:
    label: 입술
    summary: 입 구멍 주변의 두 육두문자 중 하나
    info: 입술은 입을 둘러싼 두 개의 부드럽고 근육질 조직 중 하나입니다. 많은 신경 종말로 가득 차 있어 매우 민감합니다. 입술 색깔은 혈액 순환에 의해 결정되며 파란색 톤이 산소 결핍 상태를 나타낼 수 있습니다.
  body.liver:
    label: 간
    summary: 혈액 정화와 다양한 화학 반응이 일어나는 신체 최대 크기의 내장.
    info: 간은 체중의 약 4%를 차지하는 가장 큰 내부 기관으로서 혈액을 여과하고 담즙 생성, 단백질 합성 및 글리코겐 저장 등의 수많은 생체기능을 수행합니다.
  body.lung:
    label: 폐
    summary: 공기로부터 산소를 흡수하는 가슴 공동 내 짝지어진 기관.
    info: 폐는 가슴 공동에 위치한 쌍으로 된 기관이며 수백만 개의 폐포로 구성되어 있습니다. 폐 속 알브레올리스(air sacs)들의 표면적은 약 70제곱미터입니다. 성인 사람은 분당 12~20회 숨을 쉬며 매번 호흡할 때 대략 500ml 공기를 들이마십니다.
  body.mouth:
    label: 입
    summary: 식사, 음료 섭취 및 말하기에 사용되는 얼굴의 구멍입니다.
    info: 입은 소화 과정을 시작합니다—이빨로 음식물을 씹고 침으로 분해합니다. 또한 언어와 의사소통의 주요 도구이기도 합니다.
  body.muscle:
    label: muscle
    summary: 신체 운동을 허용하는 수축 가능한 조직
    info: |-
      근육은 수축할 수 있는 조직으로 신체의 움직임을 가능하게 합니다。
      인간 몸에는 체중의 약 40%를 차지하는 총 600개 이상의 근육이 있습니다。
      가장 강력한 근육은 저작근(masseter)이고 가장 작은 것은 중이에 위치한 보경골입니다。
      근육은 뼈격근(자율적 제어), 평활근(내부 기관), 심실근 세 가지로 나뉩니다。
  body.nail:
    label: 네일
    summary: 팔다리 각 마디 끝에서 발견되는 단단한 코티닌 판.
    info: 손톱과 발가락 끝에 있는 단단한 킬라틴 덮개는 민감하고 작은 물체를 잡을 때 도움이 되며 손끝의 감각 부위를 보호합니다. 매달 약 3mm씩 자라고, 손톱은 발톱보다 더 빠르게 성장합니다. 건강 상태와 관련하여 색소 침착이나 주름 등 변화로 질병 여부를 알 수 있습니다.
  body.neck:
    label: 목
    summary: 머리와 몸통 연결하는 신체 부분으로 중요한 협소한 통로들이 존재.
    info: 목은 두개골과 가슴 사이의 부위로 일곱 개의 목뼈를 포함한다. 생명에 필수적인 구조물인 혈관, 식도, 기관지 및 척수가 이곳을 지나간다. 또한 머리를 회전시키거나 술려는 동작이 가능한 근육들을 가지고 있다. 기린은 사람처럼 같은 수(일곱)의 목뼈가 있지만 훨씬 긴 것뿐이다.
  body.nose:
    label: 코
    summary: 얼굴 중앙에 있는 냄새와 숨을 감지하는 기관입니다.
    info: 코는 들이마신 공기를 여과하고 가열하며 습도를 조절합니다. 수십억 개의 다양한 냄새를 구별할 수 있으며 기억력과 감정과 밀접하게 연결되어 있습니다.
  body.palm:
    label: palma
    summary: 내부에 가장 많은 감촉수용체들이 있는 속살.
    info: |-
      손바닥은 손가락과 손목 사이의 손 안쪽 평평한 표면입니다.
      매우 밀집된 촉각 수용체(미셀러 소체)를 포함하고 있습니다.
      팔다리에는 모낭이나 피지선이 없습니다.
      dlane에서 운명을 읽는 행운타로기(chiromancy)는 고대 시절부터 이어지는 관습적인 실천 방식입니다.
  body.shoulder:
    label: 팔꿈치
    summary: 가장 큰 범위에서 움직이는 팔과 가슴 사이를 잇는 관절.
    info: 어깨 관절은 팔을 몸에 연결하는 볼록한 형태의 구조로 구성되며, 가장 넓게 움직일 수 있는 신체 부위이다. 이는 상완골 머리와 어깨 봉 모양으로 된 견갑골 홈이 결합하여 이루어진다. 그러나 안정성이 낮아 탈구되기 쉬운 특징도 가지고 있으며, 회전근 헌터라는 근육 그룹이 이러한 불안정성을 보상해 주고 있다.
  body.skin:
    label: 피부
    summary: 몸의 최대기관이며 보호와 온도조절, 촉감 수행
    info: 피부는 인체에서 가장 큰 기관으로 약 2제곱미터의 면적을 덮고 있으며 감염과 자외선 방사로부터 보호하고 체온 조절 및 촉각 그리고 비타민D 합성을 담당합니다. 외층 세포 재생은 대략 2~4주가 걸리며 피부 표면에만 폭넓게 분포된 박테리아 수백 만개를 포함하고 있습니다.
  body.spine:
    label: 척수
    summary: 총 33개의 척주가 모여서 만들어지는 것이며, 이곳에서는 수막이 보호되고 신체 지원에도 도움된다.
    info: 척추는 머리蓋와 뒷다리를 연결하는 총 33개의 척주로 이루어진 기둥이다. 수막을 보호하고 몸에 대한 주요 지지 역할도 한다. 각각의 척주는 충격 터널인 추간판으로 구분되어 있다. 자연적인 곡률(전만증과 후 만 증)은 서 있는 자세를 위한 적응 현상이다.
  body.stomach:
    label: 배
    summary: 가슴 아래 몸통 전면 부위로 풀어서 '속'이라고도 함.
    info: |-
      복부는 가슴과 골반 사이에 있는 상체 앞쪽 부분이다.
      소화 기관인 위와 장 그리고 간, 췌장 및 비장을 포함한다.
      복근은 척추를 안정시키고 내부장기를 보호하는 역할을 한다.
      위(gastrum)는 소화계의 근육질기관으로 식사를 섭취하고 응어리지게 만든다.
  body.temple:
    label: 스파넥
    summary: 얼굴 볏뼈 위로 위치하며 머리를 감싸고 있는 비교적 덧살 같은 영역
    info: 템포럴(temporal region 또는 tempora)는 귀 앞 쪽 얼굴 뼈 위 머리의 양쪽 평평한 부위이다. 해부학적으로 이 부분은 두개골에서 상대적으로 더 연하고 충격에 취약하다. 템퍼러널 혈관(temperal artery)이 맥동으로 인해 손끝을 대면 잘 느껴질 수 있으며, 저작근(musculus temporalis)도 여기서 체결되어 껌무는 기능을 한다.
  body.thigh:
    label: thigh
    summary: 엉덩이와 무릎 사이에 있는 하체 부위로, 신체 내 가장 큰 근육 집합을 가지고 있다.
    info: 허벅지는 고관절과 무릎 관절 사이의 다리 부분입니다. 몸에서 가장 강력한 근육 그룹인 대퇴사두근(quadriceps femoris) 및 햄스트링(hamstrings)이 포함되어 있습니다. 그리고 빌(femoral bone 또는 just femur?)은 체내 최장 급이며 가장 튼튼한 끝뼈입니다.
  body.throat:
    label: glot
    summary: 입과 식도 및 기관지를 연결하는 공동.
    info: |-
      목구멍(후두)은 코와 입 뒤에 있는 공간으로서 공기뿐만 아니라 음식물의 통로 역할을 합니다.
      imune system의 일부인 편도가 포함되어 있습니다.
      hltanovy reflex는 이질 물체를 들이마시지 않도록 방어합니다.
      glottis염과 목 부위 염증은 어린아이들 사이에서 가장 일반적인 질병 중 하나입니다.
  body.thumb:
    label: 엄지
    summary: 짧고 두꺼운 손 끝 관절 지체로, 대립운동(기타 손가락 접촉) 기능이 있으며 잡는 동작에 필수적이다.
    info: 엄지는 짧고 굵은 손가락으로 다른 손가락과 마찰할 수 있는 반대 움직임(opposition movement)이 가능하다. 엄지의 이와 같은 운동 능력은 도구 조작을 위한 인간 적응에 핵심적인 역할을 하며 진화 과정에서 발달하였다. 이러한 특성은 유인원류에게만 나타난다.
  body.toe:
    label: 발가락
    summary: 다섯 개인 발가락 중 하나이며, 특히 걸으며 체중을 받치고 있는 중요한 기관이다.
    info: 발가락은 다섯 개의 발지느러미 중 하나입니다. 인간의 큰 발가락(할럭스)은 걷기 시 균형과 밀어내는 힘을 위해 필수적이며 가장 많은 무게를 지탱합니다. 영장류와 달리 사람은 발로 반대쪽으로 움직이는 동작(opozice)이 불가능하며 건강한 손톱 상태는 전반적인 신체 건강에 대한 단서 역할을 합니다.
  body.tongue:
    label: 혀
    summary: 입속에서 느끼고 말하고 소화에 도움이 되는 근관 구조
    info: 혀는 수천 개의 미뢰를 가진 근육 조직으로 다섯 가지 기본 맛인 단맛, 짠맛, 신맛, 쓴맛 그리고 윤미( savory) 를 감지할 수 있다. 언어 발음과 삼키기에도 중요한 역할을 한다.
  body.tooth:
    label: 이
    summary: 식사를 하기 위해 입 안에서 사용하는 단단한 기관.
    info: 이빨은 에나멜(몸의 가장 단단한 조직), 덴틴 및 구치강으로 구성된 단단한 구조입니다. 사람들은 영구 치아로 총 32개의 이를 가집니다. 손상되면 다시 자라지 않는다는 점에서 예방이 매우 중요합니다. 보존되어 있는 최고령인 인류 역사에 남겨진 오래된 이는 약 두백만 년 전 것으로 진화 연구에도 도움을 줍니다.
  body.vein:
    label: 정맥
    summary: 산소가 부족한 피를 심장으로 운반하는 관상혈관계 중 하나인 정맥은 특히 손목에서 잘 드러납니다.
    info: 정맥은 심장으로 피를 되돌리는 혈관입니다. 동과 달리 정맥에는 역류 방지를 위한 판막이 있습니다. 손목에 보이는 파란색빛의 정맥은 광학적 효과이며 실제로는 어두운 붉은 색을 띱니다. 치핵성 정맥은 이러한 판막 기능 장애로 인해 발생합니다.
  body.wrist:
    label: 팔다리
    summary: 팔과 손 사이를 잇고 미세 운동 기능에 중요한 관절입니다.
    info: 손목은 손과 전완을 연결하는 부위로, 여덟 개의 작은 뼈(골수뼈)가 구성되어 있습니다. 이는 네 방향으로 팔 움직임 및 회전이 가능하게 합니다. 골수 터널이라는 좁은 통로를 통해 신경이 지나므로 과도한 사용 시 '골수 챌린드 증후군'에 걸릴 수 있으며, 맥박은 손바닥 내측에서 쉽게 확인할 수 있습니다.
