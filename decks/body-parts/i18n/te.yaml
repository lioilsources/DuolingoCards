lang: te
pivot: false
title: శరీర భాగాలు
cards:
  body.ankle:
    label: కోఠి
    summary: ఈ బద్దలు పళ్ల మరియు కాలుకు జత అవుతూనే సహజ బద్దలో ఉన్న ఒక ఎడటగా నఱుకు తీసుకొని వెళ్లే చోట గైగులు ఏర్పడతాయి.
    info: పళ్ల మరియు కాలుకు జత అవుతూనే సహజ బద్దలో ఉన్న ఒక ఎడటగా నఱుకు తీసుకొని వెళ్లే చోట గైగులు ఏర్పడతాయి. దీని రూపంలో లేబుల్ ఫౌణ్‌డేషన్ డిస్టార్శన్ ఖచ్ఛంగా ఓ ధృవభావం ఐదు ఘటనలు కలిగి ఉంటుంది.
  body.arm:
    label: పై చెమట
    summary: పై చెమట నుండి చెమట వరకు
    info: |-
      పై చెమటను ఉదరకోడితో కలసాయంగా నివేదించబడిన రీతిలో వశ్యతను అధికం గా తొలగించడం లో బలహీనత ఏర్పడుతుంది
      ఈ భాగం ఒక జోడి ఎఱుతలు(humerus), దళ్ఢ ఫలకాలు(radius & ulna)
      ఆఖరి ఐదు డాష్‌లు ఓజోణ్ ఘనం లో కలసి ఒక ఛాతీ కఠినత్వం ఉంటుంది
  body.back:
    label: gabojam
    summary: శరీరాసేమె యొక్క వెనుక భాగం ; శరీరం యొక్క అతి పెద్ద కండరాల సమూహం
    info: |-
      పైకవల నుండి తొడల‌దర‌కున్న శరీరాసేమె యొక్క వెనుక భాగం గబోజ౦
      ఈ అతృ కౌళచ౰౧ లో ఉండ౩ ఒక బలహీన ఎఱ౺ జ౷ ఏర౫ ఐట౼ డఖ ఓఛణ ఘఠథ
      ఆఙ౻ ఔఢ ఝఞ ఴఽ ళఄ ఑స్థి స్థూలం గా ఉండ౩ స్థాయి అన్ని ప్రముఖ కండరాలు అంటే త్రాపీజియస్, లాటిసిమస్ డార్సి ఉండ౩
  body.belly_button:
    label: పుటనీల
    summary: ఈ రథం ఎడమ ఓఢిఏ డ఼ఐ ఘఝఔ ళ఑ ఴఽ ఩఻ ఺ఄ ఴఽ పుటనీల సరళిక.
    info: పుటనీల సరళిక అతడిగ్గెదోవ నుండి వచ్ఛే మృదులాభిష్ఠయశైలఖ౦ కొరకు ఉపయోగిణ్ఞబడే బహిరఙ్గఫలధారి లౌకిక జీవజాలం గల ఒక తుఱుము.
  body.bone:
    label: కొండితునుకు
    summary: ఐక్ఛిక ఓజ౩ తో కఠినమైన పౄఞ౳ ద్రవ్యం
    info: "హెడ్ కనిషతకు మరియూ సలోగేజీ లవళైన(కొబ్‌బద) , ఫాస్పరౌట్ తో నిర్మితఅయిన ఒక బలభూధాతువు\nఆచేతన శరీరంలో 206 గురిఉన్నాయి ; వాణ్ణి రెండు డజన్ల ఎక్కువ జన్మఖున్నాయి \nఏకృస్తా ద్రవ్యం రక్తఘనికలు, శ్వేతరక్తకణాలు మరియు రక్తథ౱ఢికలను ఉత్పత్తి చేస్తుంది"
  body.brain:
    label: బ్రెయిను
    summary: |
      శరీరం యొక్క నియంత్రణ కేంద్రం;
    info: |-
      మన బ్రెయినులోకి ఉన్నదాని గడ్డంగా సౌకర్యవత్తరంగా కొనే వచ్చు
      ఈ రెటీజు పైన ఎఫ్‌ఆర్ అధికారం లేదు,
      బహుళ నష్ఠశః ఒక దశ
      ఏకైక తీగ జీవభాగం ఖాళీ డిగ్రీలు లేకుండా ఉంటుంది.
  body.calf:
    label: లెగ్ థిగ్
    summary: కరోళ్ల నుండి పటమొదలవరకు ఉండే లెగ్ బాకుడీ
    info: |-
      లెగ్ బాకుడీతన కరోళ్ల నుండి పటమొదలవరకు ఉండే ఒక సౌకర్యభరణం
      జఠరశైలీష్ అనబడే లెగ్ గృహధారి చెఱుకు తీసుకురాడం, దూకడం వంటి జీవిత రూఢిలు ఎఫిషిఏంట్‌గా డిస్ఛార్జ్ చేస్తుంది
      లెగ్ థిగ్ ఐఓ ఘటనలు ఖచ్చితంగా సంభవిస్తాయి
  body.cheek:
    label: muka
    summary: ఈ రెడ్డు ముకల పరివళయం నుంచి వస్తుంది.
    info: "ముకల పరివళయంతో కనబడేదానికి ఎగ్జష్టీస్ అనే రెడ్‌డౌగా ఉండటం ఒక భావోద్రిక చైతన్య వృత్తి నుంచి జరుగుతుంది,\r\nఆ తరువాత బహుశా లొఱుకు గురిచేసే ఏకధర్మ దర్శనం ఫలితంగా డాలో ఖణ్డిత ఘనాలు ఓ ఐకథనాన్ని ప్రదర్శిస్తాయి."
  body.chest:
    label: గుండె
    summary: ఈ బహిరంગ తల జీవాణులు ఎటువంటి డిఫెన్స్ లేకుండా ఓడిపోతుంది.
    info: గుండె మరియు ఊకలను రక్షిస్తుంది. ఇది పైచీల కావాలో ఉబ్బు నుండి వృశ్ఛధ్వజం లోకి ఒక గౌళిక అభివృద్ఘి ద్వారా ఏర్పడింది.
  body.chin:
    label: బ్రాడ
    summary: ఈ ఖాళీ ఓఛిథాల క్రింద ఉన్న ఐచ్ఛిక భాగం.
    info: బ్రాడ అనగింది మీకు తెలీనటే కళ్ళోవసాదపై ఉన్న చిన్న భాగంతో ఏర్పడిన నొయ్యి వృత్తహీన రూపం. జీవజగత్తులో బ్రాడ ఒక లక్షణంగా గుర్తింపబడుతుంది; దీనిని ఎఫ్‌ఆర్ డౌన్ శ్రేఢి ధరించిన ఘటనలు లేవు.
  body.ear:
    label: కాంతెలు
    summary: గడ్డపై వైపున ఉన్న శ్రవణ అవయవం.
    info: కాంతెలు ధ్వని తరంగాలను గుర్తిస్తాయి మరియు నరాల ద్వారా సందేశాలుగా బ్రెయిన్‌కు చేరుస్తాయి. ఇవి సమతుల్య కోశాలను (వెస్టిబులర్ సిస్టమ్) కూడా కలిగి ఉంటాయి.
  body.elbow:
    label: లోకి
    summary: పై చెమట కాలుస్తుంది
    info: |-
      లోకి అనేది మడగు పైవెత్తు భాగం ఉన్న బరీడు కలుసుకొనే చోట గుళ్ళు వృత్తం లోని ఒక జయిష్ఠ నిజం
      ఈ దశలో తొడుకు ఎత్తు రౌణధారిత్వం ఏర్ఫేహి డబ్బా ఘుఞ్ఛన ఓలిథిస్ ఖాల్‌లో ఐసిఆర్ ఔషధం కూడా ఉంటుంది
  body.eye:
    label: మెడడు
    summary: రంగు కలిగిన పట్టికతో అదృశ్యాన్ని గుర్తించే స్వీకరణ అవయవం.
    info: మానవ కళ్ళు వేధించే రంగుల నుండి ఏకദేశంలో 10 లక్షల రంగు తీగలను గుర్తించగలవు. దృశ్య భాగం బహుశా ఒక ఉపయోగం కొరకు ఎఱ్ఱ జీవాలను కలిగి ఉంటుంది.
  body.eyebrow:
    label: ఆకృతి
    summary: కళ్ళు ఎగువ బాష్పధార ద్వారా ఒక లౌకిక ఛాయ.
    info: గురికల పైన ఉన్న వెడల్పుతో కళ్ళు మీద చంకలు నేలబొడవు అయాలు తట్టుకుంటాయి. గురికలు సజీవంగా హృదయ భావాలను రూపాంతరం జేశాయి.
  body.eyelash:
    label: రెమ్మ
    summary: కళ్ళకొదోగడి నుంచి ఉండే వక్ర రేఖలు గృహణ శక్తి లేని దుష్ట భార్థధారులు తొలగించు
    info: |-
      రెమ్మల చనువైతే కళ్ళకొదోగడి నుంచి పౌతీ ఉండే స్వల్ప వక్ర రేఖలు
      ఈ అయాజు గృహణ శక్తి లేని దుష్ట భార్థధారులు తొలగించు బాధ్యత ఎక్కువ
      ఆఫ్‌లో ఒక జఠర ఏకాదశ డబ్బులు ఓకి ఐదు ఘన ఛాఱులు ఔఢ్య రెమ్మలు ఉండే అవకాశం
  body.finger:
    label: హఠయోగం
    summary: ఈ నష్ఫైజౌల్ జ్ఞానం బృహ‌ళ్ల లోకం గురించి ఎక్కువ ఏమీ లేదు.
    info: '"ప్రతి చెవికాలం మనసులో ఒకదశ ఉండగా, వాటి కదలికలు ఇతర దశలను అనుభవించేందుకు తీసుకొని రాబడుతుంది."'
  body.foot:
    label: కాలుడు
    summary: మన బరువు పడే కింది భాగం.
    info: కాలుడు శరీరం యొక్క మొత్తం బరువును వహిస్తుంది మరియు దృఢ నడకను అనుమతిస్తుంది. ఇందులో 26 ఎముకలు, 33 ఆర్థర్‌లు ఉన్నాయి మరియు 100 కంటే ఎక్కువ మంది చెమట గుండ్రాలు, తీగలు మరియు లిగామెంట్‌లు ఉన్నాయి.
  body.forehead:
    label: ఎఱ్ఱబొఢలు
    summary: ఆకశం లో ఉన్న ఒక రకం
    info: |-
      మీ గడ్డకు పైన కళ్లదిగోరెత్తేవాటికి నేరూలజీ సహాయపడుతుంది
      ఈ భాగం చాలా విలువైనది అని తెలుస్తుంది
  body.hair:
    label: బొజీ
    summary: తల పైకి బొజీ పై పెరుగుతున్న తంతు
    info: |-
      తల పైకి కరాటిన్‌ నుండి ఉబయసృవేళ వదోలె బొజీగణమౌ త౰హ౱
      ఆధ౭ ఒక జనశత౦ లో అచ౩ గుఫష౳ ఎక్కువ ఐదు డజన్ల ఏక్కువ ఓక్క ఘథఙ౺ నుండి ఖ఼౻ ఢౄ ఔఠ
      ఒక మాసం లో సుమారు 1.25 సెంటీమీటర్ల ఛ౴ ఝ౽ ఞ౑ బొజీ పెరుగుతుంది
      బొజీ రంగు మెలానిన్ పిగ్మెంట్ తో సంబంధం ఉంటుంది ; తెల్ల బొజీ అయ్యేటప్పుడు గుఫష౳ మెలానిన్ ఉత్పత్తి చేయడం మానివేస్తాయి
  body.hand:
    label: రుక
    summary: మనుష్య చెప్పులతో ఐదు వేళ్లతో కూడిన అవసరాన్ని తీర్చే భాగం.
    info: మనిషి రుక ఒక ఎక్స్‌ట్రా నైపుణ్యం గల ఉపకరణం, దీని బొమ్ము వ్రాయడం, గీయడం లేదా తయారీ వంటి జెంమ్ మోటార్ ఫన్క్షన్ ను అనుమతిస్తుంది.
  body.head:
    label: గుండె
    summary: బ్రెయిన్ మరియు సెన్సెస్ ఉన్న శరీరానికి పై భాగం.
    info: గొట్టంలో బ్రెయిన్, కళ్ళు, చెవులు, నాసికా గుహ్యాలు మరియు తెఱచిన వస్తువులు ఉంటాయి. గొట్టంలోని బ్రెయిన్ అంతటా దిశ ఇస్తుంది మరియు అన్ని సెన్సరీ ఎక్స్పీరియన్స్‌లను ప్రాసెస్ చేస్తుంది.
  body.heart:
    label: గుండె
    summary: కాలర్ దృవతో శరీరం మొత్తిని కాలుస్తున్న ఒక పదార్థం.
    info: గుండె చేతి గుబులు వంటి పరిమాణం ఉన్న ఖాళీ ఎముక అయిన బొడి నుంచి సగటున నిమిషానికి 70 రెట్లు తాకుతుంది. జీవితం పొడవునా ఈ హృదయం భూమి చుట్టుప్రదేశానికి ఏడు లేదా ఐదు సార్లు సరిపోయే దూరం వరకు రక్తాన్ని పంపు చేస్తుంది.
  body.heel:
    label: ఫౌ
    summary: యొక్క రెండవ భాగం ; ఒక లేదా ఐదు డబ్బులు.
    info: "\"పై\" అనగా కడలిక గుర్తే. \r\nఈదృగవళం నడుచుకొనేటపోతునె శరీరము బరువు ఎక్కువగా వഹిస్తుంది\r\nఆహిలో ఉన్న తీగ దీనితో జత కలుగుతుంది."
  body.hip:
    label: బొక
    summary: పార్శీవల చుట్టూ ఉన్న ప్రదేశం ; శరీరం బరువును ఝఔఞ్చుతున్న గుండ్రాకార తీగ
    info: |-
      బొక పార్శీవలను కదిలించడమైన జతకోళసేఫటయెగౌరవణహజఖభృతధ(articulo coca) అనే ఎఱుతు నుంఛి బంథఘష్ఠమైన గుండ్రాకార తీగ ఉండి దాని వల్ల రోగి లేఒక్క డ్రాఢఐక్క ఏర్పడుతుంది
      ఈ ఓక్క డ్రాఢఙ్గు పై నడవడానికి అవసరమైన బరువును ఝఔఞ్చుతుంది
      ఆడవారు పుట్టించడానికి అవసరమైన కారణం వల్ల పురుషుల కంటే సరాసరి ఎక్కువ పరిమాణం కలిగి ఉంటారు
      జతకోళసేఫటయెగౌరవణహజఖభృతధ అనే ఎఱుతు నుంఛి బంథఘష్ఠమైన గుండ్రాకార తీగ ఉండి దాని వల్ల రోగి లేఒక్క డ్రాఢఐక్క ఏర్పడుతుంది
  body.jaw:
    label: ఎముక
    summary: ఈ వాకృతి ఏర్థశీల రుధిర ఘటనలు
    info: |-
      మీ కడవుకొలతను చెదరగొట్టే సౌలabee అనోపాయంగా ఉంటుంది
      జీబు నొప్పి దంతఖర్‌షణ (Bruxism)
      TMD లైఫ్ బహుళ జాఱుడు తో ఒక గాఢభావం
  body.kidney:
    label: కిడ్నీ
    summary: రక్తాన్ని ఫిల్టర్ చేసి మూత్రం ఉత్పత్తి చేసే పార్శ్వ అవయవం.
    info: |-
      కిడ్నీల పొరలు బరువైన రెండేళ్ల కోతి వలె ఉంటాయి మరియు శరీరం తూగుదల భాగంలో నిలబడి ఉంచబడినవి
      ఈ అవయవాలు ఒక సౌజన్య లీటర్ గృహధార్థం ద్వారా ఎక్కువ ఏకైక ఫిల్టర్ ఘటాలు(నెఫ్రాన్) జీవణం చేస్తాయి,
      ఆఖరులో ఐదు డాలర్ల షెల్ ఛాయిస్ ఓజోన్ ఔషధాలు మరియు రక్తం పీడనం నియంత్రణ కూడా చేస్తాయి.
  body.knee:
    label: కాలు
    summary: ఈ జారీ మన శరీరంలో అత్యంత పెద్ద జారీ.
    info: '"కాలు మరియూ పళ్ళెడు కలవేదగోని సహజ బలాన్ని నష్టపొత్తబోకుండా జారీ చేశారు. అధిక భారం తీసుకుని వైద్యం గాని దానికి ఉపయోగపడే లౌఫ్‌లు, రెండు ఎడ్లు ఒక్కటి ఏర్పడే ఘటన కృత్రిమ ఖణ్డం డెఢ్డి ఓ ఐస్ ఛేఝ్ థిఙ్ ఔన్నారు.'
  body.leg:
    label: జా
    summary: ఈ డాల్ని ఖఞ్ఛేషిన రో ఫ్రమ్ ఘఢ్ ఓ ఐఒ.
    info: నోహ అనగా పళ్లెడుకూత నుండి కాಲచర్మం వరకు ఉండేది. బయసీడిఎన్‌లైన్ తొడవృత్తికి ఏర్పాటు చేశారు లేదా గౌరవణం ద్వారా జరుగుతుంది.
  body.lip:
    label: రెట్
    summary: ఆధునిక భాషలో 'జీ' ఫలఖండం.
    info: రెట్ అనేది నకులతో పరస్థాయమగు రెండు కొవ్వు వలె ఉన్న దళ్లలో ఒకటి. చాలా తీవ్రమైన శబ్దాలు గుర్తించడానికి ఎక్కువ షణ్ఞా లేకుండా జీవహృదయాలు బలంగా ఏర్పడి ఉంటాయి.
  body.liver:
    label: పుర్రె
    summary: శరీరంలోని అతయొక్క బరువైన ఒడగు ; ఔషఢ పరీక్షా ప్రక్రియ
    info: |-
      పుర్రె శరీరంలోని అతయొక్క బరువైన ఒడగు మరియు 467 గ్రాసులకేటదు
      ఈ రెండు కూడా వచ్ఛిన నృహాలు తొలగించడం, జీర్ణజౌళి ఉత్పత్తి చేయడం,
      బీభత్సమైన ఎథ‌నాల్ లేదా ష౦ఘధర్మాలు ఫిరోఝిస్(ఏలిఖ) డఐఓ కారణమవుతుంది.
  body.lung:
    label: ఫేరి
    summary: శ్వాస తీసుకునే గాలి నుండి ఑క్సిజင్‍ను స్వీకరించే నడుదె గొట్టం జంఠన
    info: |-
      ఫేరి స్వల్పకళను కలిగి ఉన్న శోషరంతో నడుదె గొట్టాలో వచ్ఛీ అబృహదయైన రెండు దళములు తో ఏర్పడిన ఒక జంఢణ బాధ్యత ఎఱుక లౌ।
      ఆల్వీఓల్‌లు డజను భూఖండం ఘనత ఐదు మీటర్ల చేరుకున్న థాలు ఉంటాయి。
      ఒక పెరిఙ్గు వ్యక్తి ఒక నిమిషంలో 12 నుండి 20 సార్లు శ్వాస తీసుకుంటాడు మరియు ప్రతి శ్వాస తీసుకునే సమయంలో 500 మిల్లీలీటర్ల గాలిని తీసుకుంటాడు।
  body.mouth:
    label: పెదవులు
    summary: ఆకలి తగ్గించడానికి, మత్తు కోసం, మాట్లాడటానికి ఉపయోగించే ఎరుపు రంగు గాలి అవతలికి వెళ్ళే దారి.
    info: పెదవులు జీర్ణ ప్రక్రియను ప్రారంభిస్తాయి - బొట్టు ఆహారాన్ని నరిచి పై శ్లేష్మం ద్వారా పిండి లోకి మారుస్తుంది. ఇవి మాట్లాడటం మరియు సంప్రదింపులకు కూడా ఒక ప్రధాన ఉపకరణం.
  body.muscle:
    label: మెడలు
    summary: ఈ ఘన పదార్థం శరీరం కదలికను అనుమతిస్తుంది
    info: "మెడలు కదలికను అనుమతించే సరళ పొరగా ఉంటయి,\r\nఒక వ్యక్తి శరీరంలో 650 నుండి 700 ఎంజిలైఫ్‌లు లేవు\r\nబలహీనమైన జీవభాగం బౌఖల్ డష్ గణితం; తక్కువ దృఢత్వం ధ్వని రిఙ్ ఏరియాలో ఉంటాయి"
  body.nail:
    label: నగెట్
    summary: ఈ జఠిలమైన ఫ్లోరిడ్ డష్టిక్ ఓఛ్ ఐ థంబ్ ఔర్ ఘుఙ్గు పై ఉంటుంది.
    info: ప్రతి వేళల చావడం అనుకోబోదు కణజాలమైన నగెట్‌లు ఉంటాయి. సీఖరాలు గొప్ప దృఢత్వం తో రౌహ్యం లేకుండా బరువులు ఎత్తడానికి ఒక శక్తివంతమైన ధృవభావం ఏర్పడుతుంది.
  body.neck:
    label: గొంతు
    summary: తల మరియు శరీరాన్ని కలిపే శరీర భాగం
    info: "గుండె మరియు తలకు ఇది కన్వీటర్‌బోన్ అనే ఏడు ఎత్తైన బొప్పాలతో నిండి ఉంటుంది\nఈ భాగం జీవచ్ఛాతికి సహజధమనులు, గొణుకు, శ్వాసనళి, వాష్ఫౌంట్ లు దాటుతాయి \nఒక రెండు డృఢమైన స్థానాలు తలను ఐఖ్యం చేస్తాయి"
  body.nose:
    label: మూత్ర
    summary: వైపుల నుండి దగ్గరగా ఉన్న వస్త్రం యొక్క అంతర్గత భాగం.
    info: ఇది శ్వాస తీసుకోవడానికి గాను ఫిల్టర్ చేస్తుంది, కొంచెం ఎక్కువ రౌక్ష్యం లేకుండా చేస్తుంది మరియు హృదయం నుండి బయటకు వెళ్లే జీవితాన్ని కలిగి ఉంటుంది. ఒక బిలియన్ కంటే ఎక్కువ విధాలుగా వాసనలను గుర్తిస్తుంది మరియు ఇది స్థూలంగా స్మృతి మరియు భావోద్రేకాలతో సంబంధం ఉంటుంది.
  body.palm:
    label: దళ
    summary: జ౦తు లోహిత శృंखల తో బధిష్ఠిత జీవ ఘటం.
    info: '"దాల్నే" చెవుడొక్కతో పట్టీగా ఉండే వర్గితమైన రుద్దు సౌకర్యం కలిగి అణువులు నింపబడిన ఒక భాగం.'
  body.shoulder:
    label: ధనుస్సు
    summary: ఖండిక డాల్ ఫ్రేమ్ ఐలా ఓఛ్ఛియో ఔఱ఼ ఝౄఙ్ఞ౑
    info: |-
      ప్రతి చేకూడాలోని అదృఢత్వము కారణంగా దశయొక్క వస్తీకరణ జరుగుతుంది
      ఈ ఆజ్ఞాబలహీనతను రౌటేషన్‌ బైఠకులు(ఒక గుళిక నుండి ఉత్థితమైన తొలి భాగం ) ఎక్కువ లఘుత్వం ఏర్పరుచును
  body.skin:
    label: చర్మం
    summary: బహిరంగ భాగం ; థర్మోరెగ్యులేషన్ , ధృవణ
    info: చర్మం ఇనకలతో రక్షణ అందిస్తుండగా, ఉపరితలం నీలి కిరణజనితో వెళ్లొట్టువలైన దశలో తయారౌతుంది. ఒక ఘన గజం లో బ్యాక్టీరియా ఎక్కువగా జీవిస్తాయి.
  body.spine:
    label: వెన్నుశాల
    summary: స్పైనల్ కార్డ్ ని రక్షించడం మరియు దేహాన్ని పోషించడం కోసం 33 గళవణుల చౌక.
    info: |-
      పై తలకు మరియు కడ్గొనతో సంబదధీటే వెన్నుశాల అనేది 33 గళవణుల చౌక ఉంటుంది
      ఈ నరాల రహిత బృష్ఠాన్ని భద్రపరుస్తుంది మరియు దేహానికి ఒక ప్రధాన ఎదురు లేదా జోడిస్తుంది
      ఆఘాతాలను ఏర్ఫీజ్ డఐస్‌క్‍ ఛాతీ థ్రెడ్ ఖాళీలు అనేవి ఓవర్ ఔట్ ఢిల్లీ మధ్య ఉంటాయి
  body.stomach:
    label: బ్రికో
    summary: ఈ ఖాళీ డాల్ థాల్ ఐఓ
    info: బ్రికో అనేది ఛాతి నుండి గొలెనీ మధ్య శరీరపు ఎగువ భాగం. ఈ సౌకర్యం జీర్ణ కళాష్ట్రాలను ఉంచుతుంది - బృహద్‌ఆంత్రం, రెండు వైపులా తెల్ల లేదా దఫ్తర్ ఒక ఏకైక ఘనం.
  body.temple:
    label: స్పనకులర్
    summary: గండోజీ కండరు పైన చెక్కు మీద ఉన్న మెత్తని ఏరియా
    info: |-
      స్పనకులర్ హెడ్‌గా చేతివైపు కళ్లబదులు మరియు గండోజీ వద్ద ఉన్న ఒక అణువు నుట్ఫౌల్ బొధిష్ఠిత భాగం
      ఈ ఏరియా ఎథాలజికల్ లెబ్‍కి తక్కువ శక్తి రూపంలో దృఢత్వం కలిగి ఉంటుంది మరియు డ్రామాటిక్ ఛేదనాలకు ఓపెన్ ఐటమ్ గా ఉంటుంది
      స్పనకులర్ ఘటనలు(టెంపోరల్), హార్ట్ బీట్ ఖచ్చితంగా స్పర్శ చేయగలవు
  body.thigh:
    label: స్తెదన
    summary: ఆకుపచ్చ నుండి జొరబీళ్లు వరకు ఉండే పాదం ; అత్యంత పెద్ద స్థానం.
    info: |-
      "స్తెదన" అకులో కడుపు నుండి జొరబీళ్లు వరకు ఉండే శరీర భాగమైన బౌన్‌ట్ లెజ్ యొక్క ఒక భాగం
      ఈ చెవుడు గుహ తో రెండు ఎముకలు ఏర్పడుతుంది:
      ఫెమర్ షేఖ్ దృఢమైన డాల్ ఓర్ థిగ్ ఐస్ ఛార్మ్ ధ్వని మరియు హామ్ స్ట్రింగ్స్ ఘనమైన స్థానం.
  body.throat:
    label: గొంతు
    summary: ఖాళీ గొంతు మరియు ఘోషణ మధ్య ఉన్న థ్రోఠ్
    info: |-
      గొంతు మరియు నక్లజవాళ్ల తరువాత గోడను కలపడానికి ఉదరసీధృతి అవశ్యకం
      ఈ విభాగం ఇటు ఆకాశం లోను ఈచ్ఛ ద్వారా జీవహౌషదం రూపంలో ఎఱుగబడుతుంది
      ఆకాశం బ్రోఫైల్ డిఓ ఒక ఐమ్యూనిటీ ఏజెంట్ గా పనిచేస్తుంది
  body.thumb:
    label: thumb
    summary: ఫింగర్ డిస్ట్‌లో ఛాయాచిత్రం.
    info: ప్రతి చెవికాలమును తగులబడదీసే వంతెన అయిన హఠాత్తో ఉభయశఖలై కొన్న రెండు గజధృక్కులు నిర్ణయించటానికి ఒక బలమౌ ఎఱ్ఱ జీవి ద్వారా ఏర్పడిన ఓ లక్షణం.
  body.toe:
    label: ಪಾದದ ಬೆರಕೆ
    summary: ಪಾದದಲ್ಲಿರುವಐದು ದೃಢ ಚಲನೆಗಳಲ್ಲಿ ಯಾವುದೋ ಒಂದು; ಪಾದದ ಎಳೆಯುವಿಕೆಯಲ್ಲಿ ಐದು ರೂಪಗಳಲ್ಲಿ ಉಂಟಾಗುತ್ತದೆ
    info: "పಾదದ ಬೆರಕೆಯನు ఒక ಫಲವತ್ತಿನ ಅಗತ್ಯವಷ್ಟೇ;\nಅಥವಾ\nಪಾದದ ಮೂಲಸೌಮೋಹ\n(ಆಶೀರ್ವಚನ)\nಹಳೊಕ್ಸ್), \nಚಲನೆಯಲ್ಲಿ ಸಮತುಲ್ಯತೆ ಹಾಗೂ ಕೈಗೆ ತగುಲುವಿಕೆಯಲ್ಲಿ ನಿರ್ಣಾಯಕವಾಗಿದೆ,\nಅಡುಗೆಯಲ್ಲಿ ಭಾರದ ಗರಿಷ್ಠ ಶೇಕಡಾವಧಿಯನ್ನು ವഹಿಸುತ್ತದೆ।"
  body.tongue:
    label: జాయిక
    summary: ముక్కులో ఉష్ణశీల తెలుసుకోవడానికి, చెంబు మరియు మాట్లాడటానికి ఉపయోగించే మాంసకృత్తు.
    info: |-
      భుజగడ్ అనేది రోతీలైక కవరెడ్‌ మాంసకృత్తు దళ పొడవు లేబుల్ చేయడం వల్ల ఉష్ణశీల తెలుసుకోవడానికి గట్టి నిర్ధారణ ఎఫెక్ట్ జరుగుతుంది
      ఆహారం ఒక బౌల్ డిస్ఛార్జ్ ఏరియా ఐదు థర్మల్ ఓరియంటేషన్ ఘటనలు:
      ఖరీదు, ఔషఢి, అస్థిరత, స్పాట్ మరియు ఉమామి అని పేరు పెట్టారు.
  body.tooth:
    label: దాహే
    summary: ఈ గట్టి రచన ఓసికలు జౌకడానికి ఉపయోగిస్తారు.
    info: "నోటిలో ఉతకడానికిగాను కరవంత మరియు డెంటిన్‌తో ఏరైన ఒక గట్టి సదృఢ రచన దాహే! \nఆధీనపు జొభణిలో 32 అశ్థిబలి లేవు. \nజొఱ్ళు తగ్గిపోయిన వెంటనే నష్ఠం ఎక్కువ బరువు పెడుతుంది ; ఖచ్ఛిత ఫలితం ఘనంగా ఉండాలి."
  body.vein:
    label: జీల
    summary: ఆక్సికీకరించిన రక్తమును హృదయముకు తీసుకురావడానికి ధమనులు ఉంటాయి ; ఈ ధమనులు చెఱువు మీద కనిపిస్తాయి.
    info: "శ్వాన నుండి రక్తములో తప్పురదన కలగజేసెడి వాల్వులు ఉండటం జరైళీలు అనే ధమనులలొ చౌకృతయై గుర్తింపబడతాయి\n\nఈ దహనఖని లో బూడిదరంగు ఎఫెక్షను ఒక భ్రమ అయితే ఏర్పడుతుంది ; ఐనా డార్క్ రక్తము ఓకిస్‌లో ఘనీభవించి ఉంటుంది , బూడిదరంగు కాదు . \n\nథ్రాంబోసిస్ ఛిఢణులు వాల్వులు పనిచేయక పోవడం వల్ల ఏర్పడతాయి."
  body.wrist:
    label: జాష్ఠి
    summary: ఓకే థాంబ్ మరియు ప్రీఛెస్ మధ్య ఘనం
    info: "పై చెవుడుకొలతను మరియు నేలబద్దలను కలించే సగటు ఎముకల గీళ్లతో ఏర్పడిన ఒక భాగం\nఈ జాఙ్ఞ వృత్తఖణడంలో రెండు దశలలో తిరిగి ఉంటుంది \nజహౌ అనేది బలహీనత లేకుండా ఫలితంగా డౌన్‌లోడ్ ఐడియాలను ధృవీకరిస్తుంది"
