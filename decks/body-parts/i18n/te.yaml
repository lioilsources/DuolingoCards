lang: te
pivot: false
title: శరీర భాగాలు
cards:
  body.ear:
    label: కాంతెలు
    summary: గడ్డపై వైపున ఉన్న శ్రవణ అవయవం.
    info: కాంతెలు ధ్వని తరంగాలను గుర్తిస్తాయి మరియు నరాల ద్వారా సందేశాలుగా బ్రెయిన్‌కు చేరుస్తాయి. ఇవి సమతుల్య కోశాలను (వెస్టిబులర్ సిస్టమ్) కూడా కలిగి ఉంటాయి.
  body.eye:
    label: మెడడు
    summary: రంగు కలిగిన పట్టికతో అదృశ్యాన్ని గుర్తించే స్వీకరణ అవయవం.
    info: మానవ కళ్ళు వేధించే రంగుల నుండి ఏకദేశంలో 10 లక్షల రంగు తీగలను గుర్తించగలవు. దృశ్య భాగం బహుశా ఒక ఉపయోగం కొరకు ఎఱ్ఱ జీవాలను కలిగి ఉంటుంది.
  body.foot:
    label: కాలుడు
    summary: మన బరువు పడే కింది భాగం.
    info: కాలుడు శరీరం యొక్క మొత్తం బరువును వహిస్తుంది మరియు దృఢ నడకను అనుమతిస్తుంది. ఇందులో 26 ఎముకలు, 33 ఆర్థర్‌లు ఉన్నాయి మరియు 100 కంటే ఎక్కువ మంది చెమట గుండ్రాలు, తీగలు మరియు లిగామెంట్‌లు ఉన్నాయి.
  body.hand:
    label: రుక
    summary: మనుష్య చెప్పులతో ఐదు వేళ్లతో కూడిన అవసరాన్ని తీర్చే భాగం.
    info: మనిషి రుక ఒక ఎక్స్‌ట్రా నైపుణ్యం గల ఉపకరణం, దీని బొమ్ము వ్రాయడం, గీయడం లేదా తయారీ వంటి జెంమ్ మోటార్ ఫన్క్షన్ ను అనుమతిస్తుంది.
  body.head:
    label: గుండె
    summary: బ్రెయిన్ మరియు సెన్సెస్ ఉన్న శరీరానికి పై భాగం.
    info: గొట్టంలో బ్రెయిన్, కళ్ళు, చెవులు, నాసికా గుహ్యాలు మరియు తెఱచిన వస్తువులు ఉంటాయి. గొట్టంలోని బ్రెయిన్ అంతటా దిశ ఇస్తుంది మరియు అన్ని సెన్సరీ ఎక్స్పీరియన్స్‌లను ప్రాసెస్ చేస్తుంది.
  body.heart:
    label: గుండె
    summary: కాలర్ దృవతో శరీరం మొత్తిని కాలుస్తున్న ఒక పదార్థం.
    info: గుండె చేతి గుబులు వంటి పరిమాణం ఉన్న ఖాళీ ఎముక అయిన బొడి నుంచి సగటున నిమిషానికి 70 రెట్లు తాకుతుంది. జీవితం పొడవునా ఈ హృదయం భూమి చుట్టుప్రదేశానికి ఏడు లేదా ఐదు సార్లు సరిపోయే దూరం వరకు రక్తాన్ని పంపు చేస్తుంది.
  body.mouth:
    label: పెదవులు
    summary: ఆకలి తగ్గించడానికి, మత్తు కోసం, మాట్లాడటానికి ఉపయోగించే ఎరుపు రంగు గాలి అవతలికి వెళ్ళే దారి.
    info: పెదవులు జీర్ణ ప్రక్రియను ప్రారంభిస్తాయి - బొట్టు ఆహారాన్ని నరిచి పై శ్లేష్మం ద్వారా పిండి లోకి మారుస్తుంది. ఇవి మాట్లాడటం మరియు సంప్రదింపులకు కూడా ఒక ప్రధాన ఉపకరణం.
  body.nose:
    label: మూత్ర
    summary: వైపుల నుండి దగ్గరగా ఉన్న వస్త్రం యొక్క అంతర్గత భాగం.
    info: ఇది శ్వాస తీసుకోవడానికి గాను ఫిల్టర్ చేస్తుంది, కొంచెం ఎక్కువ రౌక్ష్యం లేకుండా చేస్తుంది మరియు హృదయం నుండి బయటకు వెళ్లే జీవితాన్ని కలిగి ఉంటుంది. ఒక బిలియన్ కంటే ఎక్కువ విధాలుగా వాసనలను గుర్తిస్తుంది మరియు ఇది స్థూలంగా స్మృతి మరియు భావోద్రేకాలతో సంబంధం ఉంటుంది.
