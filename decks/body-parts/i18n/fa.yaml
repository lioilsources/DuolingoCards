lang: fa
pivot: false
title: نمونه کارت های بدن部位的身体卡片
cards:
  body.ankle:
    label: پاشنه
    summary: اتصال قسمت زیر نعل تا عضله درونش؛ شدیدترین آسیب خوردن.
    info: چرخش پا به بالا و پایین، همراه با حرکت‌های ملایم جانبه را فراهم کند؛ سه استخوان تشکیل دهنده اتصال بین لگن و قدمو وجود دارد.
  body.arm:
    label: แขน
    summary: จากบ่าไปจนถึงข้อมือ
    info: '팔은 세 부분으로 구성된 상지로 어깨에서 손까지 이어집니다: 팔뚝(상완부), 전완부 그리고 손입니다. 약 30개 이상의 근육과 끈적끈적한 조직이 움직임을 가능하게 합니다. 팔뼈와 고정관절인 엉치는 수동적인 관절에 연결되어 있습니다.'
  body.back:
    label: زنگ
    summary: قسمت پسین تنه؛ بزرگترین گروه عضلی بدنساز
    info: پشت بدن قسمت پسین تنه از ناحیه سرگرم به ران است و شامل ستون فقرات که با عضلات پوست محاصره شده‌است، می‌شود. درد های دنده جزو مهمترین دلائل غیرقابل حاضرانی برای کار محسوب می‌باشد.
  body.belly_button:
    label: نافل
    summary: جای خال مرکزی بعد از قطع نخ رحم.
    info: نافلوبندیکه جای خال اتصال نخ رحم است، مسیر تأمین مواد غذائی برای بچه در دوران زمان حاملگی به وجود آمده‌است. شکل آن(واروند یا پروازدار)، وابسته به نحوه تماس با دوباره ساختن است. منطقه نفوس فعال همزمان با کشتار موجودات ماکروبیوم مشخص؛ تحقیقات ثبت انحصاری باکتریها.
  body.bone:
    label: bone
    summary: بافت پیوندی محکم تشکیل دهندهٔ قفسه تناسلی
    info: استخوان بافت سختی است که از سلول‌های استخوانی و مواد معدنی مثل منگنز، فسفر تشکیل شده است. در بزرغسالان دندان ها حدود ۲۰۶ عدد وجود دارد؛ ولی نوزادها بالاتر از ۳۰۰ تا دارند(چون بعضی از آنها بهم متصل میشوند).髓 عضو خون را شامل میشه.
  body.brain:
    label: مغز
    summary: مرکز فرامین بدن؛ پیچیده‌ترین ساختار زیستی موجود.
    info: مغز انسانی حدوداً ۱٫۴ کیلوگرم وزن دارد و بیشتر از هشتادو شصت میلیون نورون را شامل می‌شود. به دو قسمت تقسیم می‌شود؛ سمت چپ، طرف راست بدن را کنترل می‌کند و بالعکس است. با وجود آنکه فقط درصد دوم جثتش توسط بدن تشکیل می‌شود، انرژی ٪۲۰ تمام بدن خود را صرف می‌کند.
  body.calf:
    label: لیتکو
    summary: قسمت پشت ساق پا بین زانو و مچ.
    info: لیتکو قسمت عضلانی پشت ساق پا بین زانو و مچ است، اصلی‌ترین عضله لیتکو به نام gastrocnemius که توانایی بلند شدن روی انگشتهای پاهنده را فراهم می‌سازد و هم در جابجاشی حین پریدن نقش دارد. عملکرد مهم لیتکو شامل بازگشت خون از پاورقی به قلب است.
  body.cheek:
    label: لیسه
    summary: بافت پوشانندة منطقۀ جانبی صفت؛ باعث ظاهر شدن ردّافتهای موذون بر وجود هست.
    info: چرخه شامل استخوان لیس و توده‌های گرد فاقد عضله در دو طرف صورت محسوب میشود. قرمز شدن چهره ناشی از واکنش جسم به هراس، خجالت یا انفعالات مشابه است که بطور غیرمستقیم تحت kontrole سامان حلقهٔ رنالدین زده میشود.
  body.chest:
    label: qafese sinay
    summary: بخش جبهه‌ای تنه که قلب و ششها را داخل خو رفته.
    info: قفسه سینه‌ای بخش جلوی تنه است که با ستون فقرات، دنده و قسمت پشتی را محدود می‌کند. ارگان های حیاتی مثل قلب و شش در آن نگهداری می‌شود. قفسه سینه شامل ۱۲ زوج реб بهمراه دستگاه عضلانی و غضروفی تشکیل شده.
  body.chin:
    label: بردا
    summary: قسمت پائینِ لثۀ تحتانی روی صفت.
    info: دندانچه پایینی، قسمت اصلی تشکیل‌دهندهٔ بخش زیرتر جلو صورت است. در میان موجودات دیگر نزدیک به ما مثل سوپرانوا وجود برادا را فراموش کردند و تنها خاصیت منحصر به فرد حوزهٔ طبیعت هستیم؛ بنابراین علت آن توسط علممندان باقیمانده است.
  body.ear:
    label: گوش
    summary: سازه حواس پنجگانه برای شنو فرامو قراردادن روی سرت.
    info: گوش صداها را جذب کرده و به عنوان سیگنال های عصبی آن‌را انتقال میدهد، در داخلش نیز دستگاه تعادل وجوددارد.
  body.elbow:
    label: لُوقِت
    summary: جفت در محل مرتعش؛ اسم آن از «لَقْط» مشتق شده.
    info: локت جایی است که بازو و مچ به هم متصل شده‌اند، این قسمت توانائی خمش دست را فراهم میکند و برشتهٔ پشت سر لب نام دارد.
  body.eye:
    label: چشман
    summary: حس چشم، عضو مهم برای دیدن با قاعدهٔ فرفره آلت زرداست.
    info: '{"hint":"سازگار با دیدن","info":"چشم انسان تقریباً میلیون ها رنگ مختلف را تشخیص می‌دهد. شبکه شامل استوانه‌ها برای مشاهده در حالت کم نور و مخروط‌ها برای دیدن رنگ وجود دارد.","label":"چشمان","summary":"عضو جذب شناخته شده به عنوان ساختار بصری با پوست مردمک."}'
  body.eyebrow:
    label: ریم
    summary: پهنۀ مو روی هر سرتاسر چشم؛ ضروری برای فعالسازی ظاهر.
    info: ریم به مجموعه‌ای از موها بالای پلک فوقانی چشم اشاره دارد و نقش کلیدی در انتقال غیرلفظی احساسات با حرکت آن را بر عهده دارد؛ همراه با برجستگی قابل توجه، عملکرد حفاظتی نسبتاً مهمترین است که شامل جلوگیری از رسیدن قطرات باران و شدت خروج لختهٔ صورتی به داخل چشم می‌باشد.
  body.eyelash:
    label: ريسه
    summary: سرراست موهاي منحنى اي روي لبة پلك كه چشم را محافظت ميكند.
    info: ریس‌ها موهای کوتاه و خمیده اند که روی لبه پلک رشد می‌کنند، چشم آب شستگان، عرق و جسم ها ناخواسته را در برابر حفظ می‌نمائند. فرد بالغ دارای صد تا۱۵۰ عدد ریسه بر روی پلت فوقانی و پنجادتا٧٥عدد ریسه زیرین است. دوره به وجودآمدن ریس‌ها حدود چهارتاآتاق هفتگي طول مى كشيد.
  body.finger:
    label: انگشت راست
    summary: هر یک از پنج انگشت روی دستان ما ؛ همه شامل سه بخش.
    info: |-
      انگشت دست، از پنج انگشتش؛ ناخن آنها به سه بخش تقسیم می‌شود
      همواره ده انگشت وجود دارند که ترکیب حرکات آنها باعث قابلیت استفاده از وسائل، خواندن موzyk و نوشتن می شود
      چاپ انگشت همانطور که منحصر به فرد برای تمام افراد جامعه است
  body.foot:
    label: پاه (نوک)
    summary: قسمت تحتانی پا در جلوه به ما اجازه میدهد که روی ان قرار بگیریم و حرکات.
    info: پا بار کل بدنه را تحمل می‌کند و پرچینگ دو نعلی انسان را فراهم می‌سازد. آن شامل ۲۶ استخوان، ۳۳ تendon و بالای صده عضله، tendon و ligament می باشد.
  body.forehead:
    label: جَبْحِد
    summary: قسمت جبهه‌ای بالاتر از ریم؛ منطقهٔ تعابیر عاطفی.
    info: چلو قسمت جبهه‌ای است که بالاتر از ریم و پائین خط مو قرار دارد، به عنوان یکی از مهمترین نقاط برای نشان دادن عواطف شناخته می‌شود؛ تاول در بخش جبهدار مشخص خجالت یا هراس است. در فرهنگ‌های مختلف نقشه‌برداری روی جبهه معنوی باشد مثل سوگندخوردن یا طبقه‌ها.
  body.hair:
    label: مو
    summary: رشتة اي كه از جلد موئين بالاي سرتان رشد ميكند
    info: |-
      موها از کراتین ساخته شده و در فولیکولا مو روی سر رشد می‌کنند
      مردگان به طور متوسط دارای حدود صد هزار تا مو برسر خواهند بود؛ پنجاه الی сто عدد آن، هروقت افتاده است
      حدود يك سيسيمتر نيم در مايه رشته مي كند
      رنگ موها با وجود پىgmentومelanin تعريف ميشود؛ وقتى follicles توليد melanim را متوقف كردند، موها قرمز ميكنند
  body.hand:
    label: دست
    summary: قسمت بالایی بازو پنج انگشتدار.
    info: دست انسان وسیله‌ای برجسته با انگشت شصت است که توانائی حرکات متقابل را دارد، به همین خاطر فعالیتهای ظرافتش مثل نوشتن، نقاشی یا سوزن زدن مقدور میشود.
  body.head:
    label: سر
    summary: قسمت بالایی بدن جاهاییست که مغز و حواس قراردارد.
    info: سر شامل مغز، چشم‌ها، دوگوش، بینی و لب است. مغز در سر مرکز کنترل تمام بدن باشد و همهٔ حس‌های اطراف را پردازنده.
  body.heart:
    label: قلب
    summary: عضلۀ منتشرکنندۀ دائمی خون در تمامِ بدن.
    info: قلب عضله‌ای توخالی به اندازه دست است که در متوسط هر دقیقه حدود ۷۰ بار ضربان پیدا می‌کند و طول زندگی خون را تقریباً سه دور جغرافیایی زمین انتقال می‌دهد.
  body.heel:
    label: پاته
    summary: قسمت آخر پاش؛ تمام وزنه بدنش رو موقع ایستادن برداشت.
    info: پاتا، بزرگ‌ترین استخوان پای میلاد را تشکیل می‌دهد و در حالت ایستاده وزن غالب بدن را تحمل کند. همچنین به تاندون آخلس متصل شده و عارضۀ التام فاسس ناحیۀ دنبالۀ پا باعث سوزش در منطقۀ زیر پوستی قسمت جلوی پاهای خفیف می‌باشد.
  body.hip:
    label: بُوَر
    summary: منطقة اطراف لگدم؛ مهم‌ترین مفصل حامل وزن.
    info: بُوَر، منطقه‌ای است کنار مفاصل رانی (articularis coxa)، که عضله ساق پا و حوض را به هم متصل می‌کند. این مفصل نوعی مفصل توپول شناور بوده و وزن بدنه در زمان حرکت را تحمل می‌نماید. خانومها نسبتاً دارای فرجِ بالاتری نسبت به مردان هستند تا برای جوانمردن آسانتر باشد.
  body.jaw:
    label: چانه
    summary: استخوان پائین صفت هستش که وقتی تماشاگران روزمرز شوند حرکت می‌کنه.
    info: چانه‌ها، کمربندی اسکلت سر است و تنها عضو متحرّک در لبده جا دارد. به خوردن غذا با فشار مناسب، بلعیدن مواد غذایی و صحبت کردن کامل کمک می‌کند.
  body.kidney:
    label: کلیه
    summary: اندامی است برای تصفیه خون و تولید ادرار
    info: |-
      کلیه‌ها اندام فازولی شکله دوست به درون قسمت پشت بدن هستن که خون رو تصفیه می‌کنه و مواد زائدش رو مثل نمک، رطوبت و سایر عناصر مهم بدین حساب می‌گیره
      هرروز حدوداً ۱۸ لتر خون رو ترشح می‌کنه و چند صد الی چندهزار واحد جذب داخل بافت کبد وجودداره
  body.knee:
    label: پا
    summary: بزرگترین جوش خورده بدنت که لاغربالغرا را متصل میکند.
    info: گردن پا بزرگترین مفصل انسان است و به عنوان یکی از ساختارهای پیچیده‌شناخته شده، شامل قسمت فمورو تibiaو دندانه هاست. بافت کراسل در آن وجوددارد و نوار جانبی رابط مناسب برای تحمل وزنه زمان حرکات عادی مثل پیاده روی و دونفرست.
  body.leg:
    label: نог
    summary: ساق پائينى از زانوى كلى تا آلت.
    info: پا شامل ساق پایینی، بالشت و کف است. انسان‌ها قادر به حرکت دوچرخه هستند و عضلات قدرتمند بدن را در خود جاساز می‌شوند(عضله صاف). فمور نمونه طولانی ترین و ضخیمترین استحکامات داخل بدنه است.
  body.lip:
    label: رت
    summary: هر كدام از دو ضلع چربِّى فرجام حلق.
    info: رَت به هر کدام از دو لایه‌ی ماندگار و عضلاندار مرزدهندة فُردۀ منتهى به حلق می‌پردازند، پوشیده شده توسط نخستین بافت زخمی بدن؛ غنى از سلول‌هاى درشت رشدکننده بر جذب موادغذايى.
  body.liver:
    label: کبد
    summary: بزرگترین اندام در بدنه؛ مرکز شیمیائی موجود.
    info: کبد بزرگترین اندام داخلی است که وزن آن بالای ۱٫۵ کیلوگرم می‌رود و تقریباً پانصد عملکرد دارد، جمله فیلتر کردن خون، ساختن صفرا، سنتز پروتئین ها و ذخیره قند شوکره. تنها اندامی است که قادر به بازنمایش کامل از باقیمانده بافت است.
  body.lung:
    label: ریه
    summary: پذیرفته کنندة اکسیژن از هوا
    info: ریه‌ها اندام دوگانه‌ای در حفرة سینه هستند که متشکل از صدها میلون روزنهٔ پارچه‌ای (آلوئول) است، و به طور تقریبی ناحیه جمع آلوئول‌ها برابر با ۷۰ مترمربع است. فرد بالغ حدود ۱۲ الی ۲۰ نفس در دقیقه تنفس می‌نماید و هنگام زدن هر نفس هوادخواهی حدود ۵۰۰ میلی لیتري اله قطع مي شود.
  body.mouth:
    label: ปาก
    summary: بازو در صورت برای خوردنه، نوشتن و حرف زدن
    info: دندان‌ها غذا را فشرده می‌کنند و ترشحات دهان آن را شروع به پوسیدن می‌کنند، همچنین اصلیترین ساز جهت صحبت کردن است.
  body.muscle:
    label: عضله
    summary: بافت انقباضی برای حرکت بدن
    info: ماهیچه بافت قابل انقباض است که حرکت بدن را امکان‌پذیر می‌سازد. بدنه انسان دارای بالاتر از ششصد عضله و تشکیلدهندهٔ درصد۴ وزنش است؛ قویترین آنها، ماشه هستند؛ ضعیفترین نیز تردرو به طول سانتی‌مترباست وجود دارد. نوعهای مختلف عضلات شامل پوشالدار(قابل kontroly)، لخت(داخل оргان‌ها) و قلبی میباشد.
  body.nail:
    label: ناح
    summary: صفحه‌ای محکمهٔ کرتون برروي انتهاء انگسات دست و پاي.
    info: نیخ، تخته‌ای سفت از کراتین در پایان هر انگشت است. آنها نوک حساس انگشتها را محافظت می‌کند و دسترس به جسمانه‌های باریکتر را تسهیل می‌نماید. نمو ناخوت حدوداً ۳ میلیمتر در ماه؛ ناخوها روی دستان زودتر از ناخوهای فراموش رشد می‌کنند.
  body.neck:
    label: سر
    summary: قسمت متصل شدهٔ سرش با بدنه؛ شامل مویرگها مهم.
    info: گردن بخشی است که مابین جمجمه و سینه قرار دارد، شامل هفت پوزان گردنشی می‌باشد. در این ناحیه ساختارهای حیاتی مثل عروق خونی، مردمک، راه هوائی و طنطراش وجود دارند. به تعداد زیادی عضلات برای حرکت دادن و دور انداختن سرتقرار دارد.
  body.nose:
    label: نوسلط
    summary: سازمان جذب بوی و نفس کردن در قسمت مقابل صورت.
    info: انف هوا ورودی را فیلتر، تصفіه و مرطوب می‌کند. قادر به تشخیص بیش از یک ماہ دلفن عطر مختلف است و با حافظه و حالات نگرش عمومی پیوند تنگاتنگی وجود دارد.
  body.palm:
    label: دست‌زنگان
    summary: قسمت مرکزی دوطرف بازو؛ محل عبور فشارها.
    info: دست‌زنگانه قسمت داخلی دستان است که بین انگشتان و مچِ دست جای گرفته است. این ناحیه حاوی تعداد زیادی سلول لامسهٔ Meisiner هستند، به طوریکه پراکندهترین منطقه برای دریافت تماس وجود دارد.
  body.shoulder:
    label: آرتروز
    summary: اگرچه پهنترین فعالیت حرکتی وجوددارد ولی ضعف طبیعتی بر روی خطر جداشدنش عمل می‌کند.
    info: در میان تمام استخوان‌های بدن، آرتروز شانس دارای بالاترین انعطاف حرکتی است و اتصال بازو به سمت جعبه قفسه تنظیم می‌شود. این نوع کلاوید شامل تاج عضلانی ناحیه روتور در حال حفاظت از ثبات زاویه هست.
  body.skin:
    label: پوست
    summary: بيشترين ارگاني؛ محافظتي، تنظيم حرارتي و لمس.
    info: پوست بزرگ‌ترین ارگان بدنه است و مساحتی در حدود دومترمربع را پوشش میدهد. کارکرد آن شامل حفاظت مقابل عفونت، تابش فروسرخ، تنظیم حرارت، لامسه و سنتز ویتامینD میباشد. بهبodی خلیهای لايه بيرونى طول عمرحدود هفتاد الي سيصد روز ميبرد.
  body.spine:
    label: ستون فقار
    summary: ستون فقار حاوی ۳۳ عدد فقره است که نخاع را محافظت می‌کند و بدنه را پشتوبر می‌گیرد.
    info: سرایکس از ستونی تشکیل شده است که شامل سه‌صد وسه فقره مفصل باشد، جمجمه را به تاندون متصل می‌نموده و نخاع را در بر دارد. بین هر قسمت از آن غضروف وجوددارد که ضربات زدن را تسهیل می‌کند. انحناء طبیعی ساق پشتی مثل لوردوزو و کیفوازو عادتهٔ حرکت مستقیم است.
  body.stomach:
    label: شکم
    summary: بخش قدامی تنه زیر سینه؛ چنانچه عامباً معده نيز خواندن.
    info: بازوی جگر، معده و روده‌ها در ناحیۀ شکم قرار دارد؛ این منطقه بخش قدامی تنه است که مابین سینه و لان هستد. عضلات شکمشما به عنوان حفاظت برای اندام‌ها عمل می‌کنند و ستون فقرات را پشتیبانی می‌نمائید.
  body.temple:
    label: spanek
    summary: ناحیه نسبتاً نازک برروي دوطرف جبهه،بالاي استخواى لبان.
    info: سپانک ناحیه‌ای روی دو طرف سر بالای استخوان لب و پشت گوش محسوب میشود. این قسمت به صورت آناتومی بخش نرم ترا بافت جمجمه را تشکیل میدهد(بخش کفوتوز الستون فارنسی). همچنین در مقابل ضربه حساستر است.
  body.thigh:
    label: ران
    summary: بخشی از پا بین لگن و زانو؛ جمعیت عضلولی بزرگ.
    info: ساق پا بخشی از عضو تحتانی است که مابین مفصل ران و زانو قرار دارد. شامل توده‌ای عضلانی درشتتر از همه، به نام ساعدچارگاهی فمورال و حملات بالائی بازوهاست. استخوان ران (فمور)، بلندترین و سنگین‌ترین استخوان بدنه است.
  body.throat:
    label: حفره
    summary: فضا متصل کننده منفذهای ذهن به معده.
    info: حلق، فضایی است که پشت دندان‌ها و بین نоздوان قرار می‌گیرد و به عنوان راه برای هوا و غذا عمل می‌کند. شامل تامورهاست که جزء سیستم ایمنی باشند. واکنش حلق (پاسخ زدن)، در مقابل عبور خارج شونده اتفاق می‌افتد.
  body.thumb:
    label: انگشت
    summary: انگشت ضخیم روباه؛ حرکت اُزون عامل تعویض موثر.
    info: انگشت بزرگ دست، اولین انگشتش است که می‌تواند با سایر انگشتان تماس برقرار کند و به نام «اپوزِس» شناخته می‌شود. حرکت اُزوَن در جهت مقابل پیدایش مهمترین تطبیق فضایی برای قدرت حمل و ذخیره آبجکت هاست. این خاصیت طی تحولات زیاد توسعه یافته و فقط در موجودات مشابه ما وجود دارد.
  body.toe:
    label: انگشت پا
    summary: هر شخص برای هر قدماً 5 عدد انگشت دارد؛ به خصوص انگشت شمارهٔ اول حامل وزن زمان حرکات قدمزنی است.
    info: انگشت پا، از میان پنج انگشتن که روی هر فرد وجود دارند است؛ ناخن‌ها و سلامت آن در تعادن عمومی بدن نقش مهمی را بازی می‌کنند.
  body.tongue:
    label: زبان
    summary: عضو عضلی داخل دهان برای تمایز مزه، جویدن مواد غذائی و صحبت.
    info: زبان انسان ساختاری عضلانی است که با برجستگی‌های حس طعم پوشیده شده و به تشخیص پنج نوع مزۀ اصلی شامل خُب، نمکین، ترش، مر، و اومامی کمک می‌کند. نقش مهمی در فرآوردن زنده روزانه دارد و همزمان برای بلع غذا ضروری است؛ همچنین قابلیت حرکات فوق العاده سریع آن وجود داشته و قادر است با سرعت بالغ بر صد کیلومتر در ساعت عمل کند.
  body.tooth:
    label: دندان
    summary: ساختمان فلزي داخل دهان براي ريزكردن مواد غذايي.
    info: دندان ساختاری محکم است که از جنس دنین، ماتریس و لایه‌ای به نام انمار تشكيل شده است. انسان در حالت دائمي ۳۲ عدد دندان دارد. پوستهٔ خارجی دندان كه انمار ناميده ميشود بعد از آسيب ديگر قابل بازيافت نيست؛ بنابراين پشتكاف مهمتر از معالجه است.
  body.vein:
    label: ورید
    summary: عروسک فلزی حامل خون بدون اشباع به طرف قلب ؛ در محل پالکان قابل مشاهده
    info: |-
      رگ، عروقی هستند که خون را به سمت قلب باز می‌فرستد
      در برابر شرایط مشابه آرتريها دارنده دروازه‌های جلوگیری از برگشت خون است
      رنج نمودن زرد تقریباً روی پالکان وجود دارد؛ ولی واقعاً خون موجود داخل رگ‌ها قرمز تیره است
  body.wrist:
    label: بازوی دست
    summary: محور متصل کنندهٔ دستان به پالوتِ بالا؛ نقش مهمی در حرکات ظریف دارد.
    info: بازوی دست، ناحیه‌ای است که با هشت استخوان رز به وجود آمده و بین پاولت تا جلوتر ارتباط برقرار می‌کند؛ حرکات چارگاهی و دوران درونی دارد. لقمهٔ زنبرکی (مسیر تنگ داخل بازوی دست)، علت سندروم لقمهٔ زنبرکی وقتی فشار شدید روی ان قرار گرفته باشد. ضربان قلب راحتی در سمت خلفی بازوی دست حس میشود.
