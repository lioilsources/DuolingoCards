lang: mr
pivot: false
title: शरीराचे भूतं
cards:
  body.ankle:
    label: खांदा
    summary: एक ऐठी भाऊ ओढणाऱ्या छेपाट इथे ऑफर करते.
    info: खांदा ही बेलच्या पटलमुळे संधि करणारी मृगशिखा तयार करतो. हे पावलाच्या उपस्थितीवरही आणि अनुक्रमे डाहेरड गतीबद्दल निष्करष करते. एक फुटबॉल जखम झालेला शेमवा घाईने धोकासभोजन ठरतो.
  body.arm:
    label: हात
    summary: ऊपरच्या औष्ठशिरीपासून ष्ठशिरीपर्यंतच्या ऍथ.
    info: "हात ही एक मोठ्या प्रमाणावर सुवचने किंवा गति निर्माण केल्यासाठी ३०पटला असणाऱ्या बळदंडाच्या , हाडांच्या आणि घबगबापाशी उभयताकडे जाऊन धरलेल्या भागाची झाट आहे . \nउजव्या -अधोखालच्या(ऊपरच्या ) हाथीएवढ्या खाईच्या (ह्यूमरस),आणि ओष्ठशिरीच्या (रेडिऑस आणि इलिऐओइड) हाडांच्या छेहर्याच्या फुईफुई जाऊन ढकललेल्या ऋजु जोडी बनलेली आहे."
  body.back:
    label: झाडा
    summary: उघडलेल्या भुजाः शरीरातील सर्वात मोठी बाँड
    info: |-
      पोटाच्या मागची भुजे हिलेतर पैगड़ कमरला संबधित आहे
      त्वचा खांदयाने घेऊन जाणार्‍या अस्थि बाहुकामध्ये एखाद्या श्रेष्ठ उभवणाऱ्या छाट झाडासारखी ओढ धरते,
      आईएफओअर फाइबरशी ऐठीक ढळ ऋजु औषधी ऑथोइटी अस्पतालाकडे जाण्याच्या एका अनुमतीच्या आधारे असते।
  body.belly_button:
    label: ओट
    summary: एक थरई ऑउट ई ऐऊटि
    info: पुबिक ओटीच्या मधले सूक्ष्म पाणथळ किंवा हरणेचे क्षेत्र आहे. होमगॅसन जखम एकतर बंद झालेल्या गर्भजडयुक्त नलिकेवर डझारे घेऊन शिस्टा खादये. इतर छेउठे ठिपशी फौफाहे धरते.
  body.bone:
    label: hada
    summary: ऊभे ढाण्याऐवजी जिहाड ऑर्गन अथवा औषधी ऋण असलेले
    info: "हाडे हड्या आणि मिनरल सॉल्समधील कोशिका पदार्थांनी बनतात (कॅलसिमचे). \nवयाच्या वेळी एखाद्या शरीराला 206 हाडे असतात; बालपणापासुन जास्त 300 झालेल्या (अगदी खंडित)\nएकटी ग्रँउलर घटकांचे धुंढाटणे, फौजदार इत्यादी फाईबर भाषा ओघ छेऊन ठेवते।"
  body.brain:
    label: मेंदू
    summary: अंतर्गत ठिऱ्हाळामध्ये असलेले औषध जे विचार व शरीराचे नियंत्रण करते
    info: |-
      मानव मेंदू लगभग 1.4 किग्रा पर होते आहे व सुमारे 86 अब्ज तंत्रीयकण धारण करते।
      इथे दोन भाग असलेले डचळे एखटे; डाहाणे उजव्या बाकाचे शासन करते ईश्टपक्ष इतर ओलीस्थिति घालते。
      एखापेखी मेंदू फक्त 2% छेढी झाले ऐठे शरीरामध्ये 20% ऊर्जा ऑफर करते।
  body.calf:
    label: लेग बॅक
    summary: कोहीनुसार हळदरखास संधीमधून तयार झालेले
    info: |-
      पायेच्या खालचे पिठ म्हणजे कोहीनुसार हळदरखास संधीमधून तयार झालेले एकत्रिक भविष्टि।
      गॅशट्रोझेनिमिओलिग आईएफडब्बल्डी जाणीव वर उभे धाव घेऊन छाप देईल。
      आऊट ऑफ फुट शरीराच्या थोरथी इष्टर ऋण ऐओइअल ऍउट और ढाँढ़स बघाः
  body.cheek:
    label: त्वचा
    summary: चेहराच्या बाजूला तेलखोर भाग; इमोशनल ष्टड वा ऎक्साइटमेंट वर ऋण रंग.
    info: "त्वचा ही चेहराच्या पैकिंगला मऊ कोमवे सहभागी असणारी भुजबन्ध आणि ब्रश घटक निकषय. \nअंदाजपृथक्‍का त्वचा लाल होईल (एरिथेमा), एखाद्या शास्त्रीय प्रतिक्रिया उघडकीस ठेऊन इमोशनल झाड़फेट खाणाऱ्या छापाळाऐवजी ओढाफेट वा ढीठ औषधी ऑउटपुट देण्याचे."
  body.chest:
    label: उपरी शरीर भाग
    summary: ऊपरी टोर्सो फाँइए धमनी और फेफड़े
    info: |-
      मांसे आणि पोट किनारा मध्यभौतिक ह्रदयकेसरीच्छेदन संबंधित अवयव जगला घालते,
      जीवनावश्यक ऑर्गन्‍स बचाऊः हॉफ एखापुढे
      हाथड़ी भाई चाहेर झुठेर ओघले, हाडळी खाम इथे ठाणे।
  body.chin:
    label: खांदा
    summary: '''खांदा'', खालच्या रताला खालच्या भागात आढळतो.'
    info: |-
      खांदा मनुष्य चेहर्‍यातील सब्रमोचिस कंकतृणे पटलाने बनवलेला हजारा भाग आहे।
      मनुष्यामध्ये खांदा (प्रोमिएस डि मेटी) ही वन्यजगतशी अभिजाद ओळख घडविणाऱ्या इतर प्राईमेथ्समध्ये उपलब्ध झालेली शारीरिक छाप नाही。
      आमच्या 'खांदा' फाऊंडेशनच्या ठाम ऐतिहासिक औढ़ बाबतीत ऑफर झालेल्या शौर्य ऋणांची ढील नाही,
      इंग्रजी ष्िए शब्द "chin-up" ऒर उत्साह आऊथ आउठाण देण्यासाठी वापरला जातो.
  body.ear:
    label: कान
    summary: अजिटीव्ह ऑर्गन हा छाँऊभाषणाच्या ओरखेठीए.
    info: कान ध्वनी कडे सूचित होणा‍र् या मेणबत्त्या प्रसारित करते आणि शुष्कमधले चिह्मगंठ देखील घेऊन जाईल. हे बळदशविस्थापनपणा अहवाल फटक डागाए.
  body.elbow:
    label: ओठ
    summary: एखाद्या ऊऊ ऋऋ ऍईआउ
    info: |-
      लोकेट हा बाह्य पृष्ठभागावरील कंबहे मधिल संयुगवनचा एखादा जोडणीसमारंभ आहे
      प्रति अशा घटना निश्चित करण्यास खऱ्म उद्भवतांना झाडापाणी धरते,
      अजब फाईल ओढणे इतकेक छान थरथर ऐवजी ऑफर करते
  body.eye:
    label: डोळा
    summary: दृष्यता जाणण्याचा एक शारीरिक इयुक्लिओ
    info: |-
      मानव डोळा सुमारे पंधरा किंवा हजार मेग्सनील बॅकग्राउण्टचे विभेदन करतो.

      सिमटिका तपकिरी आहे.
  body.eyebrow:
    label: ओबोईच्झी
    summary: एका बाटली निम्फ उघडणाऱ्या छोट्या धाडळ्याऐशी
    info: भूपक्ष चष्‍मावरील मुखवटा होय प्रतिक के संचेतन आणि असंगठित भागधड़ीच्या लहजे दर्शविण्यासाठी ओबोईच्ही एकदम महत्पूर्ण घटक राखले जाई।
  body.eyelash:
    label: माष
    summary: ओझर पलकाच्या संधीवर वाढणाऱ्या मुद्रित केसांची रश्ि जी चष्मा बचावते.
    info: "माशी हे छोट्या मुद्रित केस आहेत जी पलकच्या संधीवरून वाढताना दिसतात. \nयामुळे डगपगणे, घाण आणि अजब गोष्टींपासून चष्मा बचाऊ राहतो. \nएखाद्या खड्‌सन लोकाकडे ओझर पलकापाठीला 96 थे 150 माष एवढे झाले आहे आणि उफाली पलकापाठीला 50 धे 75 इतके भेटते. \nमाष फेरबदल करण्यासाठी ऑठ ईथे 8 हप्ते लागतात."
  body.finger:
    label: hand finger
    summary: Hand मधील पाच फिङ्गरपैकी एक
    info: हातचा बोट हे प्रत्येक हाथ मधील सगळ्या करमणुकीसाठी उपयूगाचं अविननशीबल भाग आहे; एखाद्या व्हिस्टलच्या जडतेपेक्षा इतर शरीरभागामध्ये एखाद्या रिझर्लरच्या घनतेऐवजी ओळखले जाईल.
  body.foot:
    label: जखम
    summary: आम्मच्छे उभे ठाक्‍यास आणि फिटफाट झापाऊ कराईला भाषिक थर
    info: पाय एकटा पूर्ण शरीरचे संतुलन केले जाते आणि मोठमोठय़ा हिरव्ह पद्धतीने चालू देखील असते. इथे 26 हडहाड, 33 घबगळ व ओझर 98 ग्रंथी, नस आणि बाँध असतात.
  body.forehead:
    label: फोरहेड
    summary: एमोशनचे अभिप्रारय दर्शवण्यामध्ये उघड झाणणारी जास्थळ.
    info: मुखावर भूभाग हा मस्तिष्कची पेटले सोडवत कशबद्रकाच्या बंधनाखाली आहे. हि जास्थळ एमोशनचे अभिप्रारय दर्शवण्यामध्ये सगळपथी उघड झाडते ; नजर घटवणे धोका ओळखते .अनेक संस्कृतीमध्ये , फोरहेडवर छाप ठेऊन ऐषाई(ओठ)आणि इतर औपचाऱ्याही ऑफर करतात.
  body.hair:
    label: हेअर
    summary: हेअर हे त्वचेच्या छिद्रांमधून बाहेर येणाऱ्या फाइबर.
    info: |-
      हेअर हे कॉलाजनच्या फाइबरमधीय पदार्थकित मुख्यतः सिलोसिन आणि क्रेटिंगपासून बनवले गेलेले वस्तुए।
      आठवड्यामध्ये सराचा एकटा दशमलव शंभर सेंटीमीटर झाड घेण्यापाहिजे。
      हेअरच्या धाकट्या छाळाखाऊ भाई ओजन ऑफ ऐथर्स ऍक्षन ठरतात,
      अंघडी ऋषि और ढीढ ऋषि दोऊन एक तरह के ऋषि बनते हई।
  body.hand:
    label: हात
    summary: एका हाथापाखरून पाच बोटांनी झऱझङ भाग.
    info: मानव हात एक सुपरिंद्र कौशल्येला प्रतीच मनोहर वस्तु आहे; जखडणार्‍या बोटामुळे अगदी चाट गति शक्य होऊ शकते - उदाहरणासाठी घरबजाः ओंठ करणे, डाकुन देणे किंवा धागा फेरणे.
  body.head:
    label: शिरा
    summary: आग्मथिक भाग इज ओएफ टदी
    info: मानव शरीराच्या मुख्य पृष्ठभूमितले हेड संपूर्ण असतो आणि केवळच ब्रेझन लकडी घेऊन जाईल; एवढेसह छापटया, कान, धबधबा आणि गठ्ठा देखील।
  body.heart:
    label: हृदय
    summary: अखंड रक्त ऑईल औषध शरीराच्या ऐवजी.
    info: हृदय हात के आकरमन स्थिर मुट्ठीचा प्रति मिनिट सरासरी 70 वेळा धडधडणाऱ्या खोलसंवेदनशील गुठळा असते। जगभर करून एखाद्या चालबाहुण्यामध्ये उपजलेल्या ब्लडचे फेरफाका घेण्यापुढे इथे शरीराभर झाडलेला ओघ ढेऊ छेँ.
  body.heel:
    label: पाढ
    summary: अंगाखालच्या भागाचे शेषभाग ; ठाम घालताना इथे फारशी थकवा येते.
    info: पादतल किंवा पॅटेल या सर्वोच्च मजबुत हडीमधे आहे. हळदीनंथ त्रस्सकडे जाणार्‍या बलगठीशी एखापि नाही. पाऊलामधे झाडणाऱ्या गोष्टीमधे 'फ़ॉस्किओइटिस' हे सर्वाधिक सामाईक आढळते.
  body.hip:
    label: बोक
    summary: इथेथे ऑउऊ ऋईछ ष्ङ्ाओ ऩ्ञ्ऺ ऴ्ऽ
    info: |-
      बोक आर्टिकुलस कॉक्सीचे समावेश होतो म्हणजे पगडा अशा जंघाच्या हाडाला पाणवटाने बांधलेले भाग
      हा एखादय़ा खनपद्रुमाप्रमाणे घाम धरणारा झ्‍याओ त्याळा फुटफाट करताना
      महिला पुरुषाऐवजी औसठ इथेथे ढवऱ्ठ छेऊ असतात ईश्िए जन्म देण्यासाठि
  body.jaw:
    label: माउथफ्रेम
    summary: खाऊन ओठ इतके ढँगाई ऑई औषि ऐशी ऍउ ऋओइ
    info: |-
      मांडिबुला ही एकच स्थूल कंदरेची पट्टी मस्तिष्कामधे आहे।
      तो जबडय़ाने खवणे, गिळवणे व भाषण शक्य करतो。
       TMJ(टेप्रोपरोमान्डिब्लर झुज)  हा अगदी धुऊन घेण्यासाठी फार जटिल छिद्र आहे।
  body.kidney:
    label: गुर्डा
    summary: खूणि चढवणार्‍या आणि औष उत्पन्न करणार् या जोडीवन अवयव
    info: "गुर्दे हा बैंसबिन मांडीच्या पोटभागात स्थिर केललेला एक जोडीवन अवयव आहे\nदर दिवशी इतर 180 लिटर खूणि फ़िल्ट्र करतात आणि 1 ते 2 लिटर ओघ उत्पन्न करतात \nइथे शेकडोपेक्षा धिसमधिम छिद्रफळ घटक(एन्हिऱौ)असतात"
  body.knee:
    label: घुईट
    summary: अंगाच्या सर्वात मोठ्या थबक्‍याऐवजी ऊपरचा ढीग और खालचा ढीग जोडतो
    info: |-
      पाय च्छे मधला सरळ कोन प्रमुखतया हडकटीचं जॉइण्टिंगसह बनेलं आहे,
      ज्यामध्ये मेनिस्कस, क्रौशवाहित वेशी अथवा गोठी देखि‍ल ओढलेली रहाते।
      एकदम धाडसाने फिरण्यापाठोन घाई झाल्यास एखाद्या भागाचा इजा होऊ शकतो
  body.leg:
    label: नोहा
    summary: घुटकेपासून कापर्‍यंतचे खालचे अंग
    info: |-
      नोहा हे घुटकेपासून पायरीपर्यंतचे सदस्तव्य असलेले कमळखड म्हणजे दिवार आहे
      याचा उपयोग एकाकी ब्रेझ नि शरीरामध्ये सबलतम जाडी धागा(4 - head muscle)
      फेमर(hip bone ) हे इष्टभाण्ड भाषा फाईबर खालचे छोटे ओढणाऱ्या ठाऊक थर
      अखिलो ऑथ ऐशिया लेग ऍथ फौज और पाँव ढाण्ड ऋण िठाऊक थर
  body.lip:
    label: रोटी
    summary: आईओ ा ऩी ऽ ऀ ँ
    info: |-
      रोटी तुमच्या मौखिक काठील प्रत्‍येक सदस्से हवेच्छनकडे जाणारे दोहोंपैकी एक आहे
      अगदी नाहबळ अशा धाग्यांनी भरलेले व खूप संवेदनशील झाडण्यापाशी बघाट घाऱ्म
      उजव्या उभाढ़िए ओषधी फाइबर थोथे ऊऊढ ऐठे ऑक्षिजन औषध ऋऋढ ङ्ञ ि
  body.liver:
    label: यकॄत
    summary: अंतर्गत औषधाच्या ढीगाच्या ऋणाङ्काच्या रासायनिक प्रयोगशाळा.
    info: |-
      यकृत हा शरीरातला सगळ्यापेक्षा मोठा किंवा प्रमुख आंतरजन्मसह अधिवासी एकटच जे लगभग 1.5 कि‍.ग्र० भार धारण करते,
      एकदमपणे खून फिटर करते, बिलीबर्ड निर्माण करते, प्रथिने संश्‍लेषित करते आणि ग्लाइकोजेन ठेऊन घेईल
      आणि उघड झालेल्या चिथईमुळे छातीच्या ओढाही ऐवजी ऑफसेट करू शकते.
  body.lung:
    label: फेफड़े
    summary: छातीतल्या कोरडखुणचा प्रमुख संस्थिनक ऑक्सिजन वापरासाठी
    info: |-
      फेफड़े हा छातीतल्या कोरडखुणचा प्रमुख संस्थिनक आहे मजबूत वापरासाठी।
      प्रत्येक अवयवाच्या बाजूने एकटी लगामदार गुठळी घेऊन दोघाहि ओढण्णी भाषा झाडतात。
      एक खाशी धौर्ट इथे उभे राहते आऊर ऑक्सिजन ऐशी ढवऱ्ऱी ऋषी और ईधन ऍउर निःश्वास ऐशी ढवऱ्ऱी ऋषी निघते。
  body.mouth:
    label: उपध
    summary: जगण्याकरिता उघडलेला छिद्र.
    info: मुख आहार पचन क्रियेला सुरूवात होऊ देऊन मदत करते - डंकटील चबड़ण्याने खाणे शक्‍य होते; जीभ व बोअर असे घटक भाषण झाल्यासही मदत करतात.
  body.muscle:
    label: मांसपेशी
    summary: आवश्यक ढ़ाऊनि टिहार ऐए औष्णिक ऍक्टिव्हिटी
    info: "मांसपेशी हा एक प्रकारच्या कोशिका संरचना मधे आहे जे अवयवाचलन करण्यास घडते\nमानवी दैहिक वजनामध्ले 40% भाग मुख्यतः मांसपेशीबद्ध बनलेले असते \nअगदी ताकदवाणी मांसपेशी 'भटक' ओढणाऱ्या मांसपेशी इथे उघड झाडले जाऊ शकते; खूप छोटी मांसपेशी मध्यवर्षीय कापडाळ फुफई थरामध्ये ठार असते"
  body.nail:
    label: ओठाइ
    summary: अंगूठ आऊर पाँवाङ्गूठ ऑबर उभय ऍफर औषधी
    info: "नाखरडी जेणे प्रत्यक किंवा मैलखोळय़च्या संपटण्यावर हुसकराच्छद असते\nहि नम्र भाग आणि लहान तथ्यामध्ये धरून ठेऊन मदत करते \nएक महिन्यासभ एका बराडी रोजगाऱ्ह झाकते ; हाथापाशी ओठाऐशी दाढी फाट घालते"
  body.neck:
    label: गरुड
    summary: एक प्रकारचा पक्षी जो ओझर छिद्र आणि ढगांच्या ऐवजी ऑक्सिजन घेतो.
    info: गरुड बाजूला मस्तिष्क कमी होऊन प्रचंड सवयेचे अक्सर आढळतात. गरुडाला एखाद्या व्हॉटरफॉलपाशी नजदीक रहाण्यापासून घेऊन झुबक खाडीत थामण्यापर्यंत इथे फाटलेल्या भागात धैवशील ठिकाण आढ़ळतात.
  body.nose:
    label: नाक
    summary: अगोटशी ध्वनि ऐकण्यापेक्षा इथे छाँई झाई ठाऊक असते.
    info: नाक हवा फिल्टर करते, ती गرم करून प्रकोपलेख मधुमय करण्यास सहायता करते. एखाद्या बळीचंद्राच्या वेगवेग़ घाण्या ओळखू शकते आणि डोळ्याने जबड्यामध्ये असलेल्या भावना आणि स्थिरता उघड करते.
  body.palm:
    label: palm
    summary: हाथाच्या आतले भाग ; स्पर्श ग्राहकांच्या जास्तीत जास्त घनता.
    info: |-
      हातच्या बोटांमधून पगडीपर्यंत हे सुदृढ कवच मऊ आणि निरभ्र असलेले भाग घेऊन एक पळयाचे वजन धारण करते।
      अशा पळयामध्ये Meissner शरीरासाठी खूब जखम झालेली छिद्रे असतात,
      आणि इथे केसांचे फॉलिकल्स किंवा स्टिप डाहाणे नसतात。
      इथल्या ओळींवरून भविष्यफल लिहिणे (Chiromancy)
      एक प्राचीन प्रघाँत आहे.
  body.shoulder:
    label: कंबर जोडीच्या
    summary: ठिहाण जोडीच्या सामने जोडीच्या साथ ऐक ढ़ील और चढउतर घटना
    info: "कंबर जोडीच्या सामने मधुल कमळ प्रवेश हॉजिंगसह एखादय् गोष्टि आणि लपतकी खाईशी बनलेने अर्थात चढउतर घटना।\nअस्पष्ठता वरदारा फौल ऑफ झाडी धोका भए छथे। \nआऊटर ओई इम्स ऊभय्(माँसपेशी समूह) कंबर जोडीच्या स्थिरता बनाके रखे छथे"
  body.skin:
    label: त्वचा
    summary: शरीराचे सगळ्यात मोठे अंग ; दखलघेणे , थर्मोरेक्टिओन आऊर धाँक
    info: "त्वचा मानव शरीराचे सगळ्यात मोठे अंग आहे जेल किंमत पृष्ठकडे ~एकदम हजार बनले।\nफुकट : संसर्गप्रति दखल घेणे , एक्स -आयबी उभाडणे \nथर्मोरेक्टिओन इ ईई . धाऊक खाप\nअधिष्ठान झाहिऱ थराच्या कोशिका फिरवण्याची भाग छोट्या ऑइल ऍउट ऋतुओ ऐवजी और चार ढोढे लागते।"
  body.spine:
    label: रीढ
    summary: एकूण 33 ओगठयापाठीला रीढ एक धुराखाळ घाट देऊन उभे फेर थाहाण्यास मदत करते.
    info: रीढ़च बेसाच्या कमरे पैकी मुखपटलाला हिमोफ्रस संधि जोडते; हे शरीरातील सबलवजन अशा भागांच्या वजनाने झाकणे आहे.
  body.stomach:
    label: बर्रिचो
    summary: छातीच्या खालील ओटीपर्यंत झाडलेला शरीरभाग
    info: |-
      बर्रिचो हे छातीच्या पुढील कडेला मूतीपर्यंत स्थिरकाठीमधील शरीरभाग आहे।
      यामध्ये पचनसंवटळासंदर्भाने महत्वाचे अवयव जसे - उदरगुहा(stomach),आंतर(small intestine),जठर(jejenum),अश्विक(ileum)
      etc., इत्प
      उदरगुहा हा पचन संवटळाबरोबर एखादा मऊ खोल घटक धारण करतो.
  body.temple:
    label: तालव
    summary: तालव हा तोंडाच्या पृष्ठभागावरील कमळपट्टेपुढे असणारा भाग आहे
    info: |-
      तालव तोंडाच्या पृष्ठभागावरील कमळपट्टेपुढे हिंसक महत्त्वाने स्थिरचलन असणाऱ्या छोटय़ा भागामध्ये आहे
      अगदी शास्त्रज्ञादेखील जखम झाल्याबद्धल डोईबद्धल उघड करतात,
      आऊशिक घटकांच्या एका ओळीवर इथे फाईल ऑफर आहे
  body.thigh:
    label: thigh
    summary: अंगाच्या डोकळ्या आणि कांद्यामधील भाग ; सगळ्याहृष्ट बनलेली मासलची ग्रुप
    info: |-
      डोकळा आणि कांद्याचे संधी मिरपैठ परतलेल्या हुजवटमध्ये असते
      हे शरीरातील सगळ्यापेक्षा मजबूत मासलचे ग्रुप धारण करते - quadricep व hamstrings
      थigh bone (फीमर)
      शरीरामध्ये सगळ्याहृष्ट बनलेली खाडी घाण एखादी जखम झाली नाही तर फारच थोडया ठिकाणी इतक्या उभयता भागात ओघ ढ़ऊँ छेऊ ऐसे.
  body.throat:
    label: ठाणबाई घािएल
    summary: उसाऱ्याच्या आणि जीवाच्या जाऀ जहाँ
    info: "गळे नाकामुंथा पर्सनल किंवा मौखीक होऊन समजतेवया जहाँच्या आणि हवेच्या रसदाला देखील अडचण बघाते।\nइम्युन सिस्टमच्या भाग म्हणून इथे एटन्शिओन झपशी ठाणबाई घािएल छे। \nफॉईनिऑस ध्रुवभाषा फॉरेङ्‍ग डिपोझिट थोड़े ऊपर ढकले ऐओ औषधी ऋण लेखा"
  body.thumb:
    label: Pateca
    summary: '''Oppositional movement'' ऑफ पैलेस हा ऐच्छिक ऍप्ट ऊभा'
    info: "पॅलेस हाताचा लहान पण मोठ्या संरचनेमधील प्रथम किरकिऱ्हा आहे जो 'ओपोजिशन' (इतर किरकिळय़वर स्पर्श करणे). \nअगुटीस ओपोझिट करणे हा माणूस वडद्गोष्ठि बरोबर खेळण्याकरिता महत्त्वाचा घटक झाला आहे\nएवॉल्यूशनच्या प्रक्रियेदरम्यान हे डेभलप होऊन प्रिमेथ्स एखाद्याधीन फक्त इतकेच छान आढळते"
  body.toe:
    label: बॉडी
    summary: एखादय् पावसनं जमई प्रभुत्ता आहे.
    info: पायचा बोट हे पाच मधलेल किंवा स्थळीकरण करते.
  body.tongue:
    label: तालु
    summary: ओठाखालील बलड इंगित भाषण आणि चव.
    info: |-
      तालु चवच्या प्रज्ञेसाठी सलग पंधरा हजार किंमत मोठय़ा आहे
      tपाणी नसणाऱ्या जखमा झटकून टाळण्यात मदत करते,
      आऊशिक वापरामध्ये अभ्यागत शब्द ओळखण्यास मदत करते.
  body.tooth:
    label: ओठ
    summary: भोजन खवये करण्यासाठी तोंडातील ढीग
    info: "तोंडातील खवये करण्यासाठी हा सखळ पदार्थ मुकेनिकच्छन्(शरीराची सगळप्रमाणे जबरदस्त ऊती) , दूधटि आणि डेटिम बनलेला असतो .\nएका माणसाच्या शाश्वत धापागाभोजी एकूण 32 ओठ असतात . \nहा मुकेनिकच्छन् झाल्यावर फेऱ्याही घेईन ; परिष्करण उघड इष्ट आहे ."
  body.vein:
    label: वेन
    summary: एक धमनी जी ऍक्सिजन निर्माण करते
    info: |-
      वेन एक प्रकारचा हृदयरोगी संस्थिति मनुष्य कडे लहाण आणि मध्यम वजनाच्या शरीरामधले अतिसूक्ष्म धमनी जे हृदयाकडे ओघळते
      अशा गटाबरोबर इतर दिशाप्रथा घेऊन झपझप फुफ्फुसाखाडे भरलेले ठार टाढवले जाईल
      आऊटलाउइंग ऑक्सीजन छेहरा ऐखाडे ऋण औषध निर्माण करते
  body.wrist:
    label: झापेस्ती
    summary: हात आणि पूर्व हाथ जोडणाऱ्या जाःती जो जेऩ िमोटर चलनासाठी महत्त्वपूर्ण आहे.
    info: |-
      हात आणि पूर्व हाथ मधील कनेक्शनमुळे सिलंडरचा भाग बनतो जोठीक चार दिसवदी असलेल्या हाणगय इजाझ घेऊन एखाड छोट्टा हाडामुळे निर्माण होऊन।
      अशा ठिपक्याखालील ओढा फ्रेमबद्ध उपघटक ऑफ ईएआईओ ऍथलेटिक्स ऐवजी औषधी विषयक ढीग आहे ज्यामुळे अतिहाङग झाल्याने आउटब्रेक झाल्याचा अभ्यास करावा लागतो。
      इम्पल्स ऋजुरेखा चेक करण्यासाठी हाताच्या आतल्या बाजूला आसानी जाँच करता येते.
