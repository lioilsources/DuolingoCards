lang: mr
pivot: false
title: शरीराचे भाग
cards:
  body.ear:
    label: कान
    summary: मुख्य ऐशनेस संस्थान हैडच्या पार्श्वभागीला आहे.
    info: कान ध्वनि तरंग ओळखतो आणि मज्जाचे दिशा बदलतो की ते तंत्रिका चिह्नांच्या रूपात मज्जामध्ये पोहोचविले जाऊ शकतात. त्यात एक संतुलन उपकरणही असते.
  body.eye:
    label: डोळा
    summary: रंगीबेरंगी आयरिश असलेला दृष्टीचा संवेदनात्मक अवयव.
    info: मानवी डोळा एकूणप्रमाणे पावर मिलियन रंगाचे छटा ओळखतो. जास्तीत जास्त उजेडात बघण्यासाठी फुगाकंद आहेत आणि कमी उजेडात बघण्यासाठी खालचे भाग आहेत.
  body.foot:
    label: पाय (फुट)
    summary: आमच्या उभे रहाण्या आणि पाऊल ठेवण्याची खालची भाग.
    info: पाय मनुष्य किंवा सजीवाचं संपूर्ण शरीर धारण करतो आणि दुसऱ्या बाजूच्या पायाने चालण्यास अनुमती देतो. हा 26 हाडांचा, 33 संधींचा आणि 100 हून अधिक प्रकारच्या मांसल घटकांचा बनलेला असतो.
  body.hand:
    label: हात
    summary: पाच बोटांनी संपन्न होणारा पगडा.
    info: माणूस हात मुरबतला किंवा विपरीत जास्त असलेल्या आकर्षक उपकरणामधे आहे. ते लेखन, चित्रण किंवा शिकणे इच्छित गोष्टी करण्यासाठी फारशी धावपळ देऊ शकते.
  body.head:
    label: तोंड
    summary: मानव शरीराच्या वरच्या भागात मेंदू आणि संस्कार असतात.
    info: तोंड हे मेंदू, डोळे, कान, नाक आणि ओठ धरून बसलेले असते. मेंदू हे पुरे शरीराचे नियंत्रक केंद्र असून जास्तीत जास्त संस्कार घटनाही उघड करते.
  body.heart:
    label: हृदय
    summary: अंतःकरणामध्ये रक्त प्रवाहित करणारा सालचा मुख्य अवयव.
    info: हृदय हा एक खोलटा आहे, जो चेंडूसारखा आकाराचा असतो आणि सरासरीपणे प्रति मिनिट 70 वेळा धडकत असते. इतकेच नव्हे तर त्याच्या संपूर्ण जीवनात रक्ताचे प्रमाण भूगोलाच्या तीन फेरी झाल्याप्रमाणे दूर ढकलते.
  body.mouth:
    label: खाल
    summary: चेहर्यावर खाणे, पिणे आणि बोलण्यासाठी असलेला उघडा मार्ग.
    info: खाल हा पचन प्रक्रियेचा सुरूवात करतात - दात खाडय़ाला फोडतात, एम त्याचे विघटन करतात. हे बोलण्याचे आणि संपर्काचे मुख्य धोरणही आहे.
  body.nose:
    label: नाक
    summary: चिखल आणि स्वरूप या मुखाच्या केंद्रभागी असलेला श्वासोच्छवासाचा अंग.
    info: नाक हे श्वास घेतलेल हवेमध्ये फिल्टर, उबड-हुबड बनवते आणि नमी देऊन पाहते. एक अब्ज भिन्न गंध ओळखू शकते आणि इयत्ता आठवणी आणि भावना यांशी घटित असते.
