lang: zh-CN
pivot: false
title: 身体部位
cards:
  body.ear:
    label: 耳朵
    summary: 头部侧面的听觉器官。
    info: 耳朵捕捉声波，并将其作为神经信号传递给大脑。它还包含平衡系统（前庭系统）。
  body.eye:
    label: 眼睛
    summary: 具有彩色虹膜的视觉感觉器官。
    info: 人眼能分辨大约一千万种颜色。视网膜包含杆细胞（用于暗光下视力）和锥细胞（用于色觉）。
  body.foot:
    label: 脚（足）
    summary: 我们站立和行走的脚部下端。
    info: 脚承载着整个身体的重量，并使双足行走成为可能。它有26块骨头、33个关节以及超过100条肌肉、肌腱和韧带。
  body.hand:
    label: 手
    summary: 上肢末端带有五个手指的部分。
    info: 人类的手是一种异常灵活的工具，具有能够对握的大拇指。它使精细的动作成为可能，例如书写、绘画或缝纫。
  body.head:
    label: 头
    summary: 头部是身体的上部，包含大脑和感官器官。
    info: 头包括脑、眼、耳、鼻和口。头里的大脑是整个身体的控制中心，并处理所有的感觉信息。
  body.heart:
    label: 心脏
    summary: 持续将血液泵送至全身的肌肉。
    info: 心脏是一个大小如拳头的心腔状肌肉，平均每分钟跳动70次。它一生中会把血液泵送到相当于地球绕行三圈的距离。
  body.mouth:
    label: 嘴
    summary: 用于进食、饮水和说话的面部开口。
    info: 嘴巴是消化过程的起点——牙齿咀嚼食物，唾液分解其成分。同时，它也是语言交流的主要工具。
  body.nose:
    label: 鼻子
    summary: 面部中央的嗅觉和呼吸器官。
    info: 鼻过滤、加热并湿润吸入的空气。它能区分超过一万亿种不同的气味，并且与记忆和情感密切相关。
