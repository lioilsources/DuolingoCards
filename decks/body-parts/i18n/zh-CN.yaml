lang: zh-CN
pivot: false
title: 身体部位
cards:
  body.ankle:
    label: 脚踝
    summary: 将腿部与足部分开的关节；最容易受到伤害的地方
    info: 脚踝是由三块骨头组成的关节，连接小腿和足部。它允许足部落地并轻微侧向移动，并且是运动中最常见的受伤部位之一。
  body.arm:
    label: arm
    summary: 从肩膀到手腕的上肢体段
    info: |-
      手臂是由三个部分组成的上肢：上臂、前臂和手。它包含超过三十块肌肉、骨头和肌腱，负责运动功能。
       上臂骨（肱骨）与前臂的两根长骨（尺骨和桡骨），通过肘关节连接在一起。
      由于拇指可以对握的能力使人类的手成为进化史上最精妙的设计之一。
  body.back:
    label: back
    summary: 身体上最大的一块肌肉位于躯干部位后面
    info: 背部是躯干从颈部到臀部的后侧部分，包含被背肌包围着的一条脊柱（共三十三节）。腰痛是最常见的导致工作能力丧失的原因之一。背部肌肉群包括斜方肌和阔筋膜张肌等大块肌肉。
  body.belly_button:
    label: 肚脐
    summary: 断掉脐带之后留在身体正中心位置上的伤疤
    info: '{"hint":"腹部中央的小凹陷或凸起区域","info":{"label":"肚脐","summary":"断开胎盘后在肚子中间留下的疤痕。\"info\": \"肚脐（医学上称为脐）是连接胎儿与母亲的脐带被剪断后的痕迹，通过它胚胎从母体获取营养物质。其形状取决于愈合方式而呈现内陷或者外突的状态；此外还寄居着特定微生物群落，并且研究已经记录到其中存在独特的细菌种类，在世界各地文化中都具有象征意义和精神层面的重要性。")."'
  body.bone:
    label: bone
    summary: 构成骨架的一种坚硬结缔组织；含有活体器官——骨髓
    info: 骨头是一种由骨细胞和矿物质（如钙、磷）组成的硬组织。成年人的骨骼系统有206块骨头，而婴儿则超过300块（许多会融合）。 骨髓产生红血球、白血球以及血小板。
  body.brain:
    label: brain
    summary: 人体中枢神经系统的核心部分
    info: |-
      人脑重约1.4公斤，包含超过860亿个神经元。它分为两个半球；左半控制身体右侧反之亦然。
      尽管只占体重的百分之二却消耗了全身能量的大约百分之二十。
      大脑是体内唯一不会感到疼痛（没有痛觉受体）组织。
  body.calf:
    label: 小腿
    summary: 大腿下方，膝关节与踝关节之间的小腿部
    info: |-
      小腿后侧是位于膝盖和脚踝之间的肌肉部分。主要的小腿肌（腓肠肌）使人们能够踮起脚尖并跳跃时产生弹力。
      小腿在将血液从下肢回流至心脏的静脉循环中起到关键作用。
  body.cheek:
    label: 脸颊
    summary: 脸颊是指分布在人脸两旁、含有软组织及脂肪层的一块肥厚部位，并且能够通过发红来表达情感
    info: '{"hint":"面部两侧的肉质区域","info":"脸颊（脸）是位于脸部两边包含颧骨和脂肪垫的部分。\r\n面红潮红是一种对羞耻或激动等情绪自动产生的生理反应。\r\n婴儿的脸颊故意设计得小巧而丰满；这是一种进化上的适应，能激发父母的喜爱之情。\r\n在世界大多数文化中，在脸上亲吻是很常见的习俗。");'
  body.chest:
    label: 胸部
    summary: 包含心臟和肺的身體上半部分
    info: 胸腔是位于肋骨、胸骨和脊柱之间的躯干前部。它保护着生命重要的器官：心脏和肺脏。
  body.chin:
    label: 下巴
    summary: 脸下面部的一部分，在嘴唇之下
    info: |-
      下巴是面部最下方的部分，由下颌骨构成。在人类中，突出的下巴（mentum prominence）是在动物界独一无二的特点；其他灵长类没有这个特征。
      为什么我们有下巴仍然是科学争论的话题。
  body.ear:
    label: 耳朵
    summary: 头部侧面的听觉器官。
    info: 耳朵捕捉声波，并将其作为神经信号传递给大脑。它还包含平衡系统（前庭系统）。
  body.elbow:
    label: elbow
    summary: 使手臂能够弯曲的手背；名称来源于弓形结构
    info: 肘部是连接上臂和前臂的外侧关节。它允许手臂弯曲、伸展以及旋转手腕。有趣的是，手背上没有触觉细胞。
  body.eye:
    label: 眼睛
    summary: 具有彩色虹膜的视觉感觉器官。
    info: 人眼能分辨大约一千万种颜色。视网膜包含杆细胞（用于暗光下视力）和锥细胞（用于色觉）。
  body.eyebrow:
    label: 眉毛
    summary: 每只眼睛上的毛发带，在面部表情中有重要作用
    info: 眉毛是位于眼睑上方的一条毛发带。它在非语言交流中起着关键作用；通过抬眉或皱眉等动作，我们可以表达更广泛的情感范围。
  body.eyelash:
    label: 睫毛
    summary: 位于眼皮边的一排弯形小绒毛用来防护眼球
    info: |-
      睫毛是生长在眼睑边缘的短而弯曲的小毛发。它们保护眼睛免受灰尘、汗水和异物的影响。
      成年人上眼睑有大约100到150根睫毛，下眼睑则为约50至75根。
      睫毛每四到八周会自然更新一次。
  body.finger:
    label: hand finger
    summary: 手上五只手指中的一个
    info: "{\"info\":\"手指是手上的五个指头之一；拇指有两个关节，其余三个。我们共有十根手指：它们的运动组合使使用工具、演奏音乐和书写成为可能。\r\n指纹对每个人来说都是独一无二的。由于触觉感受器密集分布，手指被认为是身体最敏感的部分之一。"
  body.foot:
    label: 脚（足）
    summary: 我们站立和行走的脚部下端。
    info: 脚承载着整个身体的重量，并使双足行走成为可能。它有26块骨头、33个关节以及超过100条肌肉、肌腱和韧带。
  body.forehead:
    label: 额头
    summary: 头部前方位于眉毛之上的部分；用于表情达意的重要部位
    info: 额头是头骨上位于眉毛上方、发际线下方的前部区域。它是表达情绪时最显眼的部分之一；皱眉表示担忧。在许多文化中，额头上做标记具有象征意义（如誓言或种姓）。从神经学角度看，大脑的额叶与计划和决策有关。
  body.hair:
    label: 头发
    summary: 从头皮上生出来的丝状物
    info: |-
      头发是从头部毛囊中长出的角质纤维。平均来说，一个人头上有大约十万根头发；每天会掉落五十到一百根。
      它们每月生长约一厘米半左右
      发色由黑色素决定当毛囊停止产生色素时就会变灰白。
  body.hand:
    label: 手
    summary: 上肢末端带有五个手指的部分。
    info: 人类的手是一种异常灵活的工具，具有能够对握的大拇指。它使精细的动作成为可能，例如书写、绘画或缝纫。
  body.head:
    label: 头
    summary: 头部是身体的上部，包含大脑和感官器官。
    info: 头包括脑、眼、耳、鼻和口。头里的大脑是整个身体的控制中心，并处理所有的感觉信息。
  body.heart:
    label: 心脏
    summary: 持续将血液泵送至全身的肌肉。
    info: 心脏是一个大小如拳头的心腔状肌肉，平均每分钟跳动70次。它一生中会把血液泵送到相当于地球绕行三圈的距离。
  body.heel:
    label: 跟骨
    summary: 足部后面；在站着的时候支撑整个体重
    info: '{"hint":"脚的后底部部分","info":"跟骨（heel bone）是足部最大的骨头。\n站立时，它承担了身体大部分重量。\n该骨骼通过阿基里斯腱连接到小腿肌肉组织上。\n跟痛症候群或称作足底筋膜炎是最常见的足病之一。");'
  body.hip:
    label: 臀
    summary: 位于骨盆侧边；人体最大的负重大关节
    info: |-
      臀部是围绕髋关节（artculus coxae）的区域，连接股骨与盆腔。它是一个球窝状承重结构，在行走时支撑身体重量。
      女性平均而言比男性拥有更宽大的骨盆以适应分娩需要。
      人工置换髋关节约为最常见的矫形外科手术之一。
  body.jaw:
    label: 下颌
    summary: 面部下方在进食及言语时活动的骨骼
    info: |-
      {"info":"下颌骨（下巴）是头骨中唯一可移动的骨头。\n它使咀嚼、吞咽和说话成为可能。\n颞下颌关节(TMJ，位于耳朵前方与颅底连接处) 是人体中最复杂的关节之一。
      下颌疼痛可能是由于磨牙症或关节发炎引起的。
  body.kidney:
    label: 肾脏
    summary: 一种成对存在的排泄器脏，负责过滤血液并制造尿液
    info: 肾脏是位于腹腔后部的成对豆形器官。它们每天过滤超过180升血液，产生约1到2升尿液，并含有数百万个滤过单位（肾小球）。此外，肾脏调节血压、电解质平衡和红细胞生成。
  body.knee:
    label: 膝
    summary: 连接大腿与小腿的最大且最重要的关节
    info: 膝盖是人体最大的关节之一，也是最复杂的结构。它由股骨、半月板和交叉韧带组成，并适应于行走与跑步时支撑身体重量。
  body.leg:
    label: leg
    summary: 从臀部到踝关节的部分
    info: '{"info":"腿（下肢）由大腿、小腿和脚组成。\u005Cn它适应于双足行走，并含有身体最强壮的肌肉群(股四头肌）。\u005Cn股骨是人体最长且最坚固的一根骨头，而连接腓肠肌与跟骨之间的阿基里斯腱则是全身中最坚韧有力的一种筋膜组织"}'
  body.lip:
    label: 嘴唇
    summary: 口部开口处两个肉质边缘中的一个
    info: |-
      嘴唇是围绕嘴巴的两种柔软肌肉组织之一。它们富含许多神经末梢，因此非常敏感。
      唇色由血液供应决定；发蓝可能表明缺氧。
  body.liver:
    label: 肝脏
    summary: 身体的最大内部器官；生物体内的化学实验室
    info: "{\"hint\":\"过滤血液的腹部大器官\",\"info\":\"肝脏是体内最大的内脏，重量超过1.5公斤。它执行了大约500种功能：包括滤血、产生胆汁、合成蛋白质以及储存糖原。\r\n它是唯一一个能够从剩余组织中完全再生的身体器官。\r\n大量酒精或毒素可能会导致肝硬化（即肝脏出现瘢痕性损伤）。\"}"
  body.lung:
    label: 肺
    summary: 接受空气中氧气并位于胸部空隙中的配对组织
    info: 肺是胸腔内的成对器官，由数百万个称为肺泡的小气囊组成。肺中所有肺泡的总表面积约为70平方米。成年人每分钟呼吸约12到20次，并在每次吸气时吸入大约500毫升空气。
  body.mouth:
    label: 嘴
    summary: 用于进食、饮水和说话的面部开口。
    info: 嘴巴是消化过程的起点——牙齿咀嚼食物，唾液分解其成分。同时，它也是语言交流的主要工具。
  body.muscle:
    label: muscle
    summary: 可产生紧缩以实现肢体活动的身体软质构造
    info: |-
      肌肉是一种能够收缩的组织，使身体运动。人体有超过六百块肌肉，占体重的大约百分之四十。
      最强壮的是咬肌（masster），最小则是中耳内的镫骨肌。
  body.nail:
    label: 指甲
    summary: 位于手脚指尖端部坚硬的角蛋白片状结构
    info: |-
      指甲是覆盖在每个手指和脚趾末端的硬角质板。它们保护敏感的手指末梢，并有助于抓取小物体。
      每月大约生长3毫米；手上的指甲比脚上长得快。
      指甲的状态可以反映健康状况：白色斑点、沟壑或变色可能表明疾病。
  body.neck:
    label: 脖子
    summary: 连接脑袋到身体的部分，并含有重要的血管等器官
    info: |-
      脖子是位于头骨和躯干之间的区域，包含七个颈椎。通过它的结构对生命至关重要：动脉、食道、气管以及脊髓都经过这里；它还含有一系列使头部旋转与倾斜的肌肉组织。
      长颈鹿拥有跟人类一样数量（共七节）但长度远超于人的颈椎。
  body.nose:
    label: 鼻子
    summary: 面部中央的嗅觉和呼吸器官。
    info: 鼻过滤、加热并湿润吸入的空气。它能区分超过一万亿种不同的气味，并且与记忆和情感密切相关。
  body.palm:
    label: 手掌
    summary: 手部内部区域；拥有最稠密的感受点
    info: 手掌是手指和手腕之间的手内侧平面。它含有非常密集的触觉感受器网络（梅氏小体）。掌面没有毛囊或皮脂腺。
  body.shoulder:
    label: 肩膀
    summary: 连接手臂与躯干、具有最大运动幅度的一个重要关节点
    info: 肩关节由肱骨头和胛骨的凹槽组成，是全身活动范围最大的一个球窝状结构。由于其不稳定性而容易脱臼；旋转袖肌群（一组肌肉）则负责稳定这个部位。
  body.skin:
    label: 皮肤
    summary: 体内最大器官；提供防护功能并进行温度调控与感官接触
    info: |-
      皮肤是人体最大的器官，覆盖面积约为两平方米。它具有保护身体免受感染、紫外线辐射的功能，并调节体温以及感知触觉和合成维生素D。
      表层细胞的更新大约需要两周到四周时间。每平方厘米表面有超过一百万细菌栖息。
  body.spine:
    label: 脊柱
    summary: 由三十三个椎组成以保护神经系统及支持躯干
    info: 脊柱是由连接颅骨和骶部的三十三块椎体组成的列。它保护着神经并作为身体的主要支撑结构，相邻两个椎之间有起缓冲作用的功能性软垫间盘；自然弯曲（如腰前凸、胸后弯）是直立行走的一种适应。
  body.stomach:
    label: 腹部
    summary: 胸部下方的躯干部位；也可通俗地指代胃
    info: 腹部是躯干前部位于胸腔和骨盆之间的部分，包含消化器官：胃、肠子、肝脏、胰腺以及脾脏。腹肌（即核心肌肉）稳定脊柱并保护内脏。
  body.temple:
    label: 太阳穴
    summary: 额头侧面、颧骨之上的柔软部位
    info: |-
      太阳穴是头部两侧位于颧骨上方和耳朵前方的区域。从解剖学上讲，这是颅骨较软的部分（鳞状颞骨），容易受到撞击伤害。
      当心跳时可以清楚地摸到这里的颞动脉搏动。
      咬肌附着于此处，并用于咀嚼。
  body.thigh:
    label: thigh
    summary: 腿上从臀部到膝盖的部分；最大的一块腿部肌肉
    info: 大腿是下肢的一部分，位于髋关节和膝关节之间。它包含身体中最强大的肌肉群：股四头肌（quad）以及腘绳肌。股骨是最长且最坚固的骨骼。
  body.throat:
    label: 咽喉
    summary: 连接口腔与食道及气管的空间
    info: 咽喉是位于鼻子和嘴巴后方的腔体，既是空气通道也是食物通过的地方。它包含作为免疫系统一部分的扁桃腺（咽鼓管）。喉反射可防止异物吸入；喉咙炎和其他疾病是最常见的儿童病症之一。
  body.thumb:
    label: 拇指
    summary: 手上较厚实的第一根手指；其对立动作关键用于抓握
    info: 拇指是手上的短而粗的第一个手指，能够进行对掌运动（接触其他的手指）。这种对手指尖部的动作对于人类使用工具的能力至关重要。在进化过程中逐渐形成，并且只存在于灵长类动物中。
  body.toe:
    label: 脚趾
    summary: 足上的五根脚趾中的一个；走路时大脚趾支撑重量
    info: |-
      脚趾是足部的五个手指之一。大拇指（ hallux）对行走时的身体平衡和推动力至关重要；它承担了最大的体重部分。
      与灵长类动物不同，人类的大脚指无法进行对立动作。
      健康的指甲状态可以反映身体的整体健康状况。
  body.tongue:
    label: 舌头
    summary: 口中的肌肉器官，负责尝味、咀嚼与言语
    info: '{"hint":"口腔内用于品尝和说话的肌肉器官","info":"舌头是覆盖着味蕾（超过一万）的肌性组织。\r它使我们能够感知五种基本味道：甜、咸、酸、苦以及鲜美。\r它是语言发音的关键，并有助于吞咽过程。\r舌是最快速度的身体肌肉；在以每小时一百公里以上的速度讲话时也在工作。");'
  body.tooth:
    label: 牙齿
    summary: 用于咀嚼食物的一种口腔中的白色坚固构造物
    info: |-
      牙齿是一种由牙釉质（人体最坚硬的组织）、牙本质和髓腔组成的硬结构。人类恒齿共有三十二颗。一旦失去，牙釉质无法再生；因此预防至关重要。
      保存下来的最早的人类牙齿已有超过两百万年历史，并有助于重建进化过程。
  body.vein:
    label: 静脉
    summary: 输送缺氧之血液至心臟的管道，在手部可见其轮廓。
    info: '{"info":"静脉是将血液送回心脏的血管。\n与动脉不同，静脉有瓣膜防止血流倒灌。\n手腕上青色的外观是一种光学效应；静脉中的血液其实是暗红色而非蓝色。\n静脉曲张是因为瓣膜功能失效引起的。","label":"静脉","summary":"输送缺氧之血液至心臟的管道，在手部可见其轮廓。"'
  body.wrist:
    label: wrist
    summary: 将手臂与手指相连；对精细动作至关重要
    info: |-
      手腕是连接手和前臂的区域，由八块小骨头（腕骨）组成。它使手掌能在四个方向上移动并旋转。
      wrist
      狭窄的手部通道称为腕管，在过度使用时可能导致腕隧道综合征。
