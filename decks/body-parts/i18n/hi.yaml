lang: hi
pivot: false
title: शरीर के अंग
cards:
  body.ear:
    label: कान
    summary: सिर के ओर सुनने का ज्ञानेंद्रिय अंग।
    info: कान ध्वनि तरंगों को पकड़ता है और उन्हें मस्तिष्क में एक तंत्रिका संकेत के रूप में पहुंचाता है। इसमें शामिल भी होता है वेस्टिबुलर सिस्टम (अवधान नियंत्रण)।
  body.eye:
    label: आंख
    summary: रंगीन आइरिस के साथ दृष्टि का ज्ञानेंद्रिय अंग।
    info: मानव आंख प्रकाश के लगभग 10 मिलियन रंगों के छाया को भेद सकती है। रेटिना में गोलिकाएँ (धुंधले प्रकाश में देखने के लिए) और चपटे ऊतक (रंगीन दृश्य के लिए) होते हैं।
  body.foot:
    label: पैर (चारु)
    summary: वह नीचला हिस्सा जिस पर हम खड़े और चलते हैं।
    info: चारु पूरे शरीर का भार सहने में मदद करता है और दोनों पैरों पर चलने की अनुमति देता है। इसमें 26 हड्डियाँ, 33 संधियाँ और 100 से अधिक मांसपेशियाँ, लटके और बंधन होते हैं।
  body.hand:
    label: हाथ
    summary: ब्रेस के अंत में पाँच उंगलियों से जुड़ा हुआ भाग।
    info: मनुष्य का हाथ एक विशिष्ट रूप से चतुर औजार है जिसमें विपरीतता करने में सक्षम तंबू होता है। इससे लेखन, बनाना, या सीवन जैसी धीमी गति के आंदोलन संभव होते हैं।
  body.head:
    label: सिर
    summary: शरीर का ऊपरी हिस्सा, जहां मस्तिष्क और संवेदनाएँ स्थित होते हैं।
    info: सिर में मस्तिष्क, आंखें, कान, नाक और मुंह होते हैं। सिर में मस्तिष्क पूरे शरीर का नियंत्रण केंद्र होता है और सभी अनुभवजनक उत्तेजनाओं को प्रक्रमित करता है।
  body.heart:
    label: हृदय
    summary: शरीर में लगातार खून पंप करने वाला स्नायु।
    info: हृदय हथेली के आकार का एक गोलाकार स्नायु होता है जो औसतन प्रति मिनट 70 बार धड़कता है। इसके पूरे जीवन में खून को पम्प करने की दूरी पृथ्वी के तीन चक्कर के बराबर होती है।
  body.mouth:
    label: मुंह
    summary: चेहरे में खाने, पीने और बोलने के लिए उपयोग होने वाला छेद।
    info: मुंह पाचन प्रक्रिया की शुरुआत करता है - दाँत भोजन को टूटते हैं जबकि लार इसे पचाती है। यह बोलने और संचार का मुख्य अवलोकन भी है।
  body.nose:
    label: नाक
    summary: चिह और सांस का अंग मुँह पर।
    info: नाक श्वास के हवा को फ़िल्टर करती है, गरम करती है और नम करती है। यह एक बिलियन भिन्न खुशबूओं के बीच अंतर कर सकती है और इसका घनिष्ठ संबंध स्मृति और भावनाओं से है।
