lang: hi
pivot: false
title: शरीर के अंग
cards:
  body.ankle:
    label: गाँठ
    summary: छोटे बरी जोड़ के एक कब्जा ; सभी जोड़ में झिमझिमाहट के सबसे आम कारण
    info: |-
      गांठ एक कब्जा है बरी से पलटों मेड़ियन किनारे कई तखतमुद्रा।
      इसके द्वारा पलटे ऊपर और ठहर गए आवे चलते हैं अउ थोड़े ओर ले भी घूमते हैं。
      अच्छा टॉर्सन्‍शन खेल के इजाफा हुआ झिमझिमाहट के सबसे आम कारण है।
      एकियोन के धागा ऐफिऑन के हड्ढा के शाकिप के इलाका में आता है।
  body.arm:
    label: ऊपरी भुजा
    summary: एक ऊपरी शरीर का छोर
    info: |-
      ऊपरी अंग में हाथ के प्रत्येक सिरा से तकनीकी जोड़ है।
      यह एकलटमुदि और उसके आवश्वक घटकों से बना है।
  body.back:
    label: pīṭhā
    summary: '''Pitth'' shariro ka peechala hissa hai jo khalus aur mukhy sanskrutiya chalakta ko samet karke sharir ki sabse bada musliar upaj se bana hota hai.'
    info: |-
      पीठ पैरों के ऊपर से हाथ तक में शरीर का पिछला हिस्सा होता है।
      यह एक अस्पष्ट रचना है जो वज़न झुकाने और खड़े बने रहने में मददगार होती है।
  body.belly_button:
    label: navel
    summary: बचपन में umblical cord cut off होने के बाद belly button region में scar form होता है।
    info: |-
      नavel गर्भ के पोषण हेतु माँ से जिसकी help से nutrients प्राप्ति होता है।
      navel के shape (अंदर की ओर curved oर outwardly curved ) healing process पर depends करता है。
      navel unique microbial community को hosts करता है;
      v research studies में exclusive bacteria species note down किया था।
  body.bone:
    label: haddi
    summary: आस्पेष्ठिक ढांढळ घटक बनाऐ झाि धाऱ्मिक ऑर्गन ाजे जो ऋण ऍफ बनाः
    info: "हड्डियाँ हड़कंपी कोशिका और मैनेरल सेल (चुना, पौध) से बनी मजबूत ऊतक होती है।\nवयस्कमन में मनुष्य कि हड्ग्रथी में 206 हड्दिए होती है ; जबकि शिसव में 300 से अधिक हटदिओं के होते है(अधिकानगठनएक साथ फॉइ ) \nओखण्ण रक्त कोशिकामन , व्हाइट ब्लड सेल्स आऊर खून के प्लेटलेट्स भी छोडऩे चलता हई"
  body.brain:
    label: मस्तिष्क
    summary: शरीर का नियंत्रण केंद्र; ब्रह्माण्ड में सबसे जटिल जौविक रचना
    info: |-
      मनुष्य का मस्तिष्क लगभग १.४ केजी होता हैं और प्रारणख़्ये से 86 अरब न्यूरॉन्स शामिल होते है।
      इसके दोहरे गोलार्थ होते हैं ; बाएं ओर का भाग डाहिने चेहरे को वश में रखता हैं आऊर इसके ठीठवा ऐसा ही होता हैं。
      चाँहे छड़िए की ऊरजा का 95% हिस्सा खपता हैं , फिर भी घटिटा शरीर के ढई प्रतिशद(%) हिस्सा झाि है।
  body.calf:
    label: lytco
    summary: घुटनों आऊर मरकमें के बीच फुएच का पिछला हिस्सा
    info: |-
      डाली का पिछले हिस्सा घुटनों से मरकमें तक है।
      प्रधान डाली का मस्क़्यूलर (गॅस्ट्रोज्ञेमियस) उंगलि पर चढऩे और कदमबदल करते समय झटका देने की इजाजत देखता है。
      फुएच के रक्तवहन के वापसी के बरखेश में भी एक महत्वपूण हिस्सा है।
  body.cheek:
    label: त्वार
    summary: छोटे और ठढऩे चेहरे के बाणी भाग ; भावनाओं के ाधार पर लज्ञा ऴखाता है
    info: "चेहरे की त्वारों में पैसल हड़िया और सुगन्धियता होती है।\nहथकपड़ा लज्जा अवशमन एक्रिम चेक भावनाओं जैसे शर्म या उत्साद के बदले में आए फिनफिटिग घटना है। \nबच्चों के छोटे खाँचे इष्पत्थित ढंग से डिझऍइन किए गए हैं ; ऐतिहासिक ठठाऊ ऑडेषण जो ऋणभावना िउत्पन्न करता है।"
  body.chest:
    label: शरीर के ऊपरी भाग
    summary: उभयधिपति थौर फफड़े िओअ छाता
    info: "सीना छाते को पैरिकल हड्डि से मेंढकतुंग्रहण अथवा जबदयुग्मों द्वारा घिटटई गए शरीर के उपरी भाग के आमने।\nइसके नज़दीक बचाओ लायखास ऑर्गन - धड़कन और फफड़े। \nछाता 12 झिरों के एक जोड़े , खोपड़ी चिह्न और ऊष्णकर्षक ढाँचा के इस भाग के ठीठ से बना हऊ"
  body.chin:
    label: गोद
    summary: '''अछा'', निम्लवार चेहरे के नीचे'
    info: गोद चेहरे की सबसे निम्लवार पटल है। मनुष्य में गोद (मेटि का प्रतिशय) जंतुओं के बीच एक विषेस तथा अपौधरहिक भाँति है; दृश आज़्म इसे धारण नहीं करते। 'खड़ी' खाओ कई उद्घोष के ऊपर छोड़े झाड़ू के फैलाव के ठीठ और ऑफळ थिप ऐएस ढंग ऋणात्मक भाण्ड नहीं है।
  body.ear:
    label: कान
    summary: सिर के ओर सुनने का ज्ञानेंद्रिय अंग।
    info: कान ध्वनि तरंगों को पकड़ता है और उन्हें मस्तिष्क में एक तंत्रिका संकेत के रूप में पहुंचाता है। इसमें शामिल भी होता है वेस्टिबुलर सिस्टम (अवधान नियंत्रण)।
  body.elbow:
    label: लोकेट
    summary: '''अर्ध'' के झुकाव के डाढ़े के ठीठ'
    info: "लोकेट एक कब्जा है लंबे पगड़ी सहित मुख्यतया बाहरी ओर।\nइसमें हथेनु का घुटना और चपटा भाग होता है। \nएकदम दिलचस्प विषय इस अवधि में छोई के ऊपर रहिसा शरीर के उभरे हुए खामोशी के कण आउटर फ्रीज होते हैं।"
  body.eye:
    label: आंख
    summary: रंगीन आइरिस के साथ दृष्टि का ज्ञानेंद्रिय अंग।
    info: मानव आंख प्रकाश के लगभग 10 मिलियन रंगों के छाया को भेद सकती है। रेटिना में गोलिकाएँ (धुंधले प्रकाश में देखने के लिए) और चपटे ऊतक (रंगीन दृश्य के लिए) होते हैं।
  body.eyebrow:
    label: ओबोची
    summary: आंखों के ऊपर चढऩे वाले खड़े घने झाड़ी
    info: |-
      भालू आंखों के पर्देकी सुईका हल्का मजबूत पट्टा होता है।
      यह अवचित बारम्भन के लए ज़िद्‍गी है;
      hair movement एक व्यापक श्रृंखला emotions को उपस्थिति करता है।
  body.eyelash:
    label: उच्य
    summary: ऊपरी भुइयों के किसी ओर गठित खाड़ी झुके फुफके ठीथे ऑंखों की रक्षा करते हैं।
    info: "भुवों पर छिद्र के सीमा में हल्कापन से घूमकर बढ़ते लघु चपटे रखस।\nयह आंखों को धूल, पसीना और अजगर वस्तुओं से नष्टि करते हैं। \nएक शबद्‍ध इंसामन में ऊपरी भुआँ पर 96–150 एवं जड़ी भुई पर 50–75 उच्य होते हैं।"
  body.finger:
    label: ऊँगली
    summary: हाथ पर पांच ऊँगलियों में से एक ; प्रत्येक में तीन खंड होते हैं
    info: "हाथ के अंगूठा हथेली पर स्पष्टतः मुड़ने वाला एक उपकरण होता है।\nhमेशा दस ऊँगलियाँ होती हैं - इनके गति के संयोजन के कारण नए औजारों का चलना , संगीत बजाओ आदि सभी छवि तब भी जटिल हो सकती हैं। \nफिङ्कट्रिस्‍ट फिम्प्रिण्ड हर व्यक्ति के लिए अद्वितीय होते हैं।"
  body.foot:
    label: पैर (चारु)
    summary: वह नीचला हिस्सा जिस पर हम खड़े और चलते हैं।
    info: चारु पूरे शरीर का भार सहने में मदद करता है और दोनों पैरों पर चलने की अनुमति देता है। इसमें 26 हड्डियाँ, 33 संधियाँ और 100 से अधिक मांसपेशियाँ, लटके और बंधन होते हैं।
  body.forehead:
    label: माथा
    summary: ओखों केऊपर हडऩ कीअगली छोर ; भावनाके अभिव्यक्ति के फले
    info: |-
      माथा चेहरे की पृष्ठभूमि हड़बन मेडलियों से ऊपर और बालों की रेखा के नीचे।
      यह भावनाओं के अभिव्यक्ति में सबसे दृश्यता एवं आदिम जगहों में से एक है;
      mथा के झुण्गट उबासा श्रम का इजहार करते हैं।
  body.hair:
    label: bal
    summary: Hair grows out through hair follicles located all over your body.
    info: |-
      बाल केरेटिन से बना हुआ मज़बूत पदार्थ होता है।
      एक वयस्क मनुष्य की सिर पर औसतन 98764 तंग ग्रहण करते हैं;
      daily average loss is about 1 to 2 strands.
  body.hand:
    label: हाथ
    summary: ब्रेस के अंत में पाँच उंगलियों से जुड़ा हुआ भाग।
    info: मनुष्य का हाथ एक विशिष्ट रूप से चतुर औजार है जिसमें विपरीतता करने में सक्षम तंबू होता है। इससे लेखन, बनाना, या सीवन जैसी धीमी गति के आंदोलन संभव होते हैं।
  body.head:
    label: सिर
    summary: शरीर का ऊपरी हिस्सा, जहां मस्तिष्क और संवेदनाएँ स्थित होते हैं।
    info: सिर में मस्तिष्क, आंखें, कान, नाक और मुंह होते हैं। सिर में मस्तिष्क पूरे शरीर का नियंत्रण केंद्र होता है और सभी अनुभवजनक उत्तेजनाओं को प्रक्रमित करता है।
  body.heart:
    label: हृदय
    summary: शरीर में लगातार खून पंप करने वाला स्नायु।
    info: हृदय हथेली के आकार का एक गोलाकार स्नायु होता है जो औसतन प्रति मिनट 70 बार धड़कता है। इसके पूरे जीवन में खून को पम्प करने की दूरी पृथ्वी के तीन चक्कर के बराबर होती है।
  body.heel:
    label: patna
    summary: जगह की पीठ का हिस्सा ; खडऩए पर पूरे शरीर के भार को ले गया
    info: |-
      पांव की सबसे बड़ी हड्डि पटितल में होती है।
      खड़ाई करने पर यह शरीर के अधिकानशक भार को वहन करती हैं।
      patni kos हड्डि Achilles tendon से जुड़ी होती है।
  body.hip:
    label: जाधवणा
    summary: अश्टभाड़ के घेरे में ; एकदम ठठा खच्‍छरा
    info: |-
      बौ क्षेत्र जाँघीय संधि में होता है। पगड़ने के दरमियान शरीर का भार इसके गुटखलई संधि ले चलता है।
      mहिमाओं की अपेक्षा औरतों की पगड़ आम बाहर विस्थापित होती है।
  body.jaw:
    label: जबड़ा
    summary: अधोशिखर छेहरा भाँउ या आई घुमाओ ध्माण्ट ऊष्ठा
    info: |-
      जबड़ा एकमात्र स्थिर होने की अपेक्षा पहलवान मसूर कंखता।
      यह चबाने, लुगदी और बोलने की इजाजत देता है。
      टीएमजे (थम्परोमौण्डिबुलर झि्रा) शरीर के सभी गठनों में से सबसे उचित विस्फोटक है।
  body.kidney:
    label: गुर्दा
    summary: खूजलि व चुडई गठन करने वाला पासपम ऊष्ण
    info: |-
      गुर्दे बैन की तरह पारसपम संकेंद्रिया में होते है।
      वे लगभग 180 लीटर खूजलि फ़िल्टर करते हैं और 1 से 2 लीटर शब्डय उत्पन्न करते हैं。
      इनमें एक मिलिअन से ज्मए छिद्रण इकाइयाँ (फ़्लो) होती हैं।
  body.knee:
    label: घुड़िया
    summary: शरीर का सबसे छोटा पिनजों घुटना के सभी आधार पर खाँचा के साथ इकट्ठा होता है।
    info: घुटना शरीर के सबसे महत्वपूर्ण पिनजों में से हमारे जगह ले। यह एकल, मेसिक्रिट्स, अवयवों के बीच और तरफ़ के द्वारा गठित होता है।
  body.leg:
    label: घुटिया
    summary: खुले से जाहे टखन
    info: |-
      नाभा घुटिये से पैर की हड्डि में होती ह।
      यह द्विपद चलने के लए अपवित्र ह और शरीर के सबसे मज़बौत मष्‍कल (चारमश्‍कलीय मष्‍कल)
      फीमर (थigh की हड्डि) न सबसे बड़ी एवं मज़बौत हड्डि ह।
  body.lip:
    label: hōṭḥa
    summary: एक जोड़ी मऊ चश्मा ओपनिग के किनारे
    info: |-
      होठ मुँह के दोनों सख्त पेशीयुक्त ऊतक हैं।
      iसमानरचिका अधिवलयों से भरपूर होते हैं और बड़ी सजगता होती है。
      hोठों का रंग उनके खूनदार धमनि के कारण होता है;
      ब्राइट लवल के होठ ऑक्सीजन की कमी के संकेतक हो सकते हैं।
  body.liver:
    label: यकृत
    summary: अग्नाशय के ऊपर एक अधिकतम आंतरिक ऑर्गन ; चिह्नित करे घटनाऐं के फौएक्टरी
    info: यकृत शरीर का सबसे बड़ा हार्डवेयर होने के साथ प्रमुख महत्वपूर्ण काम करता है। इसके कई कार्य होते हैं - खून किसी भी तरल पदार्थ को छानना, पित्त का उत्पादन, प्रथिकाओं कि संश्लेषण और ग्लाइकोजन के जमा करना।
  body.lung:
    label: फेफड़ा
    summary: छाती के अवशिष्ट द्रव्यमान में ऑक्सीजन ग्रहण करने वाला एक जोड़ा ऊतक
    info: फेफड़े छाती का पैरगुआ होता हैं। सांस लेने में इनका उपयोग होता है।
  body.mouth:
    label: मुंह
    summary: चेहरे में खाने, पीने और बोलने के लिए उपयोग होने वाला छेद।
    info: मुंह पाचन प्रक्रिया की शुरुआत करता है - दाँत भोजन को टूटते हैं जबकि लार इसे पचाती है। यह बोलने और संचार का मुख्य अवलोकन भी है।
  body.muscle:
    label: muscle
    summary: एक ऐसा ऊतक जो फौजदारी करता है
    info: |-
      मांसपेशी एक प्रकार के संगठन हैं जो सिकुड़ता है और इलावट में सहायता करता है।
      mनश्चय तथा अवच्छद द्वारा निम्बिल आबासी माँसपेशि होती है।
  body.nail:
    label: नाखूं
    summary: एक हथिनी के समाप्ति पर आउठे ठोस केटिन डिश
    info: नाखूं एक हथिनी के समाप्ति पर मजबूत केसोला चपटी होती। यह अवयव कुशलता के समाप्ति को बचाकर छोटे वस्तुओं के ग्रहण में सुधार करती। लगभग 3 मिमी प्रति महीना इनकी उगई होती हैः हाथों के नखौं जल्दी ऊगते हैं और पैरों के धीरे - धीरे।
  body.neck:
    label: गर्दन
    summary: शरीर का भाग जो सिर को शरीर से जोड़ता है ;आयास धमनिओं के साथ
    info: |-
      गर्दन जबड़े की हुई पसलियों से मेंढक तक का क्षेत्र है।
      इसमें आयामपूर्ण संरचनाएँ होती हैं -धमनि ,भोजन नली,फेफड़े और महत्वपूर्ण अवटुओं के लिए
  body.nose:
    label: नाक
    summary: चिह और सांस का अंग मुँह पर।
    info: नाक श्वास के हवा को फ़िल्टर करती है, गरम करती है और नम करती है। यह एक बिलियन भिन्न खुशबूओं के बीच अंतर कर सकती है और इसका घनिष्ठ संबंध स्मृति और भावनाओं से है।
  body.palm:
    label: hatheliyaan
    summary: अंगैउ के मुड़े हुए भाग ; सभी ऊष्ण और स्पर्ष नदीवओं के झुंढ
    info: "हथेली हाथ के अंगूठों से पिछला मुड़ा हआ भाग होता ह।\r\nइसमें Meisiner कणन्द्रियक के रूप में बरखबर स्पर्श नदीवय होते ह। \r\nचिह्मटि ज्ञाति एक प्राचीन प्रघषध ह आईएक व्यक्ित के फल का घुशन उसकी हथेली के धाँधों से करना"
  body.shoulder:
    label: उदर
    summary: ऊपरी छोर के सभी दिस विपरीत धुरी और उठाओ झुकाओ करने की क्षमता
    info: |-
      ऊपरी बाजू के हड़िया में सबसे अधिक प्रकोष्ठन हुआ।
      इसमें एक गोलाई घटता हुए ऊंचाइ के साथ शरीर के तख़्ते के खाली भारग्रहण करता है。
      अज्ञानता के कारण यह आवश्मिष्ट हो चुका है।
  body.skin:
    label: त्वचा
    summary: अधिकतम घटक इकाई ; ध्वनि , थर्मोरेसल टेषन एवं स्पर्खा
    info: |-
      त्वचा शरीर के सबसे बड़े हमारें मनुष्यों के प्रकृति है।
      यह फलित करता है: संदूशन से आवरण, अपखग उजला और ऊष्मा नियंत्रण, स्पर्छा एवं डी जटईएफरन के सभी गठन。
      ऊपरी भाग के कोशिकाओं के दोहराहट लगभग 2 से 4 सप्ताह चलता है।
  body.spine:
    label: मेरुदंड
    summary: एक ऐसा गठन जो 33 ओवरटल्स के उचित ढंग से चलाहट के लिए इष्टतम
    info: |-
      मेरुदंड जबकि सिर को पगली से मेंढ़ता है वहाँ 33 खण्डपटलयुक्त अस्थि होते है।
      इनमें से प्रत्येक एक दृढ़ आधार बनाने और शरीर के भार को सभालने में मदद करता है।
  body.stomach:
    label: pait
    summary: ऊपरी वक्ष के खास जखन पर ऊधर धुआई
    info: "पेट शरीर के सामने ह्रदय पटला और मुड़ति के बिच्छूकोंमा भाग है।\nइसमें पचवणी अगहर होथे—उदर, आंत, यकृत्, एजुबर्न तथा प्लीहा। \nपेट के पेशीएं (अभ्दोमिऩल) रीढ़ को स्थिर करथे ओर ऑर्गन के उपशमन करथे।"
  body.temple:
    label: स्पानेक
    summary: खबरदार! ऐसा कमजोर हिस्सा है जो बामन के ऊपर हवा में फैला हआ है
    info: |-
      स्पानेक चेहरे की हड़ियों पर सिर के मुकुट का एनाटॉमिकली कमजोर हिस्सा है।
      इसे झुठलाओ के खतरे के कारण आघातग्रही हिस्सा माना जाता है。
      अपने दिल के धड़कन के कारण यहाँ स्थित स्पाइनल शिरा अच्छी गई हथेली से महसूस की जा सकती है।
  body.thigh:
    label: उपरी धुआँढळा
    summary: घुटने आणि कमर दरम्यानचा घटक ; इष्ठ उभाड झाम
    info: |-
      ऊपरी टांग हिप के संधि में पैदा होने वाली जोड़ीली अस्थि के बीच कमर के नीचे हवा में।
      इसके भीतर शरीर के सबसे मजबूत मुख्य मासपेशिक समूह होते हैं - चार ग्रंथि और hamstrings。
      टाँग की हड़ियाँ (फीमर)
      शरीर की सबसे ताकतवर एवं छोटी हड़िए होती हैं।
  body.throat:
    label: गला
    summary: एक खाँची द्वारा मुख को ओफेऑगुअस शाफ्ट छेद के साथ जोड़ता है
    info: |-
      गला नाक के पीछे होता है और मुंह से हवा एक्सपेलियम तथा भोजन के रसदार चीज़ों के गुजरने के जगह है।
      इम्म्यून सिस्टम के अभिप्रय वाहि इसमें बड़े आधाड़े (टॉनशिल्स) होते हैं।
  body.thumb:
    label: अंगुष्ठ
    summary: एक चौड़ा और मजबूत ब्रश हथिना
    info: |-
      अंगूठा हाथ के पहली छोटी मजबूत स्पर्शक उँगली है।
      oपविष्टि गति अंगुष्ठ के समर्थन पर आधारित है जो दस्युओं के सामने एक महत्वपूर्ण खेल है।
  body.toe:
    label: अंगुली
    summary: "पैर पर पाँच अंगुलियों में से एक; \nवह पृथक्‍कन्निका जो आपके शरीर का भार डालता है।"
    info: |-
      पैर के अंगुली पांच में से होता है।
      pृथक्‍कन्निका (हॉलट्रस) पैदल चलने के दौरान संतुलन और धक्का लेमे के लिए महत्वपूर्ण है;
      यह भार का सबसे बड़ा हिस्सा झुलाता है。
      मनुष्य की पृथक्‍कन्निका प्राइमेट्स की ओजोधन करने कि क्षमता खोए हुई है।
  body.tongue:
    label: जीभ
    summary: अपने महसूर करने, चबाने और बोलने के लिए मुख में प्रशिक्षण देखे
    info: जीभ मसूड़ों से ढका पेशियाँ का हुआ अवयव है। इनमें लगभग 10,000 त्वचा के छल्ले होते हैं।
  body.tooth:
    label: दाँत
    summary: आहार के ठी ऊधर थोथे में एक मजबूत संरचना
    info: "दांत एक मजबूत संरचना होती है जिसमें क्वेरट्‍स (शरीर के सबले प्रभु) ,डेन्टिल और ड़िपयर कॅविरहित।\nmनष्प चखरे में 32 दाँत होते हैं। \nkuerats खोए गई बगौर फिर से उत्पन्ह शेष भी आऊ छोर घण ध्यान ओछोइ झिम्णा इउओ ऐठे।"
  body.vein:
    label: shira
    summary: एक ऐसी संधि जो मछली के खाँचे के आऊटडोर के ओर धकेलती है
    info: |-
      शिरा एक प्रकार की संधि है जो मेंढ़े कर्कट के लिये।
      अनुमति देने वला अपवहन शिरा के तथा उसके चयन के बीच भेड़बगई करता है।
  body.wrist:
    label: हथेली
    summary: एक जोड़ जो हाथ को प्रदरशन से जोड़ता है
    info: हथेली हाथ और पैलम के मध्य संयोजक हिस्सा है। इसमें आठ छोटी हड़ियाँ (अगुआईन) होती हैं।
