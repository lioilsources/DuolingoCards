lang: ta
pivot: false
title: உடலின் பகுதி
cards:
  body.ear:
    label: காது
    summary: மூளையின் பக்கவாட்டில் உள்ள ஒலி மனப்பாங்கு அறியும் உறுப்பு.
    info: செவி சத்தம் அலைகளை நரம்பு குறியீடுகளாக மாற்றி மூளைக்கு அனுப்புகிறது. இது சமனொழிவு அமைப்பு (வஸ்திபுலர் சிஸ்டம்) எனப்படும்.
  body.eye:
    label: கண்
    summary: நிறமுள்ள கரைசல் உடன் பார்வையின் மண்டை அமைப்பு.
    info: மனித கண்ணாடி சுமார் 10 மில்லியன் நிறத்தின் நிழல்களை ஒழுங்கு செய்கின்றது. இரட்டை நிரப்புகள்(அறியாமையில் பார்வையை ஏற்படுத்துவதற்கு) மற்றும் குறிப்புகள் (நிறப்பார்வையை ஏற்படுத்துவதற்கு) என்பவை கண்ணின் பொறியில் உள்ளன.
  body.foot:
    label: கால் முடி
    summary: நிற்பதற்கும் நடைபெறவும் உள்ள காலின் கீழ் பகுதி.
    info: கால் முடி முழு உடல் எடையை தாங்கி இரு கால் நடையை அனுமதிக்கிறது. இதில் 26 எலும்புகள், 33 சேருகள் மற்றும் 100 விட்டுச் சொறியாத தசைகள், நார்கள் மற்றும் நார்கள் உள்ளன.
  body.hand:
    label: கை
    summary: ஐந்து விரல்கள் முடியும் பற்றி அமைப்பு.
    info: மனிதர்களின் கையானது எதிர்ப்புச் செயல்களைச் செய்லும் இடைவிரலுடன் ஒரு குறிப்பிடத்தக்க திறனான கருவியாகும். எழுதுதல், ஓவியம் உருவாக்குதல் அல்லது துணி குறுக்கு வைத்தல் போன்ற நுண்ணிய இயக்கங்களை அனுமதிக்கிறது.
  body.head:
    label: தலை
    summary: முகம் மற்றும் திரிகள் அடங்கிய உடலின் மேல் பகுதி
    info: தலையில் மணிக்கண், கண்கள், செவிகள், மூச்சுப் பை மற்றும் வாய் உள்ளன. தலையிலுள்ள மணிக்கண் உடலின் முழு நரம்பு செயல்பாடுகளையும் ஒழுங்கு செய்கிறது மற்றும் எல்லா உணர்வு அனுபவங்களையும் செயலிழக்காமல் செயல்படுத்துகிறது.
  body.heart:
    label: நெடுங்குழல்
    summary: முழு உடலிலும் இரத்தத்தை முழுவதுமாக பம்பியோடு செயல்படும் தசை.
    info: நெடுங்குழல் ஒரு விரிவான தசை அறைபோல் உள்ளது, இது நிறுத்தாமல் எட்டு நிமிடங்களில் ஏறக்குறைய 70 முறை துடிக்கின்றது. முழு வாழ்விலும் இது இரத்தத்தை பூமி மீது மூன்று முறை சுற்றி ஓட்டும்.
  body.mouth:
    label: நுரையீறு
    summary: தின்பவும் குடிப்பவும் மற்றும் பேசுவதற்குப் பயன்படும் முகத்தில் உள்ள வழி.
    info: நுரையீறு செரிமான செயல்முறையைத் தொடங்குகிறது - பற்கள் உணவை அறுக்கின்றன, நீராவி அதனை சேர்க்கின்றது. இது பேசுவதற்கும் ஒரு முக்கிய கருவியாகும்.
  body.nose:
    label: மூக்கு
    summary: நெறியில் உள்ள மணத்திற்கான அவயவம் மற்றும் சுவாசம்.
    info: நோஸ் இருப்பிடத்தின் வழி ஊசி வடிகட்டி, சூடாக்கி மற்றும் ஈவு செய்யப்படுகிறது. ஒரு பில்லியன் வெவ்வேறு நறுமணங்களை ஏற்பதில் உதவுகிறது மற்றும் ஞாபகம் மற்றும் உணர்வுகளுடன் நெருக்கமாக இணைக்கப்பட்டுள்ளது.
