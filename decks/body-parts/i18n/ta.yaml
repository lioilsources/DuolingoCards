lang: ta
pivot: false
title: உடலின் பகுதி
cards:
  body.ankle:
    label: அடிவிரல்
    summary: இடுப்பு மற்றும் கால்விரலை இணைக்கும் ஒன்னில் ; மிக அதிகமாக காயமடையும்.
    info: கால்விருப்பை மற்றும் காதி ஆகியவற்றைச் சேர்த்துள்ள ஒன்னில் உடலில் நடூல் என்றழைக்கப்படும் அணையங்கள் ஏழு ஐஸ்ட்ஸ் மீது அமைஞ்சிருக்கும். இது கால்விழிப்போடு ஓரளவு ஊசியாட்டத்தை அனுமதிக்கிறது. கால்விண்ஷில் ஹௌட்ஜெ ஃபி஬்ரோஜென் காஃப் கால்வி஝ிப்பு மீது குறிப்பிட்ட இடத்தில் பொருந்தும்.
  body.arm:
    label: பஞ்ச
    summary: எலும்பு முதல் கைவிரல் வரை
    info: பாஜெ என்பது மணிக் கட்டி ,கரம் உள்ளிட்டவற்றையும் சேர்த்து அலசும் ஒரு நீட்டின வழியில் ஏற்பாடு செய்யப்பட்ட ஓர் ஊடகமாகும் .இது ஐம்பதுக்கும் மேற்பட்ட ஜோடிகள், ஹிஸ்ரஸ்(அடிப்பங்கு), ரேடியஸ் & ஃபுல்னா போன்றவை கூடியுள்ளது.
  body.back:
    label: பசவென்று
    summary: அணியின் நிரப்பு
    info: மார்பு மறைகள் கழிவுதடி இல்லங்கள்
  body.belly_button:
    label: mழைமீள்
    summary: இடை மூலம் ஓட்டும் ஸ்஥லத்தில் ஜீரணம்.
    info: பெரிய வயிறுடன் இணைக்கப்பட்டதால் மழைமீள் சறுக்கி உருவாகின்றது. அதன் தன்மை(அசைவு எடுப்பது அல்லது நோய்க்குறி), ஒரு ஊடகத்திருத்தல் முறையில் ஏற்படுகிறது.
  body.bone:
    label: மரசு
    summary: ஓர் ஈரல் உருவாக்கும் திண்ம ஞாலம்
    info: "மரசு செல் களானது மற்றும் உப்பின்(கங்கணி) , ஃபாஸ்டிரட் என்ற தாவர வளியில் இயந்திரம் அழுத்திய ஒரு ஜீவ ஊடகத்தின் ஏற்பாடு .\nஆன்மா ஓர் ஈரல் -அஃதாவது   206 ஐ கோருகின்றது ; \nஇருப்பினும்,  குழந்தைகள் 300ஐ கூட கொண்டிருக்கின்றன;\nஎனவே, அவை கூடிய போது குறைகின்றது."
  body.brain:
    label: மூளை
    summary: ஜீவனையின் கட்டுப்பாட்டு மையம் ; பிரபஞ்சத்தில் மிகவும் சிக்கலான உயிரியல் அமைப்பு
    info: |-
      மனித மூளையானது சராசரி 1.4க்கி எடை வலியவுடன் 86ஆப் பில்லின் நிரணயங்களைக் கொண்டுள்ளது
      இரு இறுதிகளாகப் பிரிக்கப்பட்டுள்ளது; இடமிறுதி உடலின் ஆழிப்பக்கத்தை அமைக்கிறது ஒத்தோ இல்லை
      அது ஜீவனையின் 2% ஏற்படுத்தும் ஆனால் முழு ஞானத்தின் 20% ஐ ஓட்டுகிறது
      எந்த நிழலையும் கண்ணுக்கு தெரியாத மூளை திசு ஹிஸ்டரியில் போலிஷ் ஃபீல்டுகளை இல்லாமல்
  body.calf:
    label: அடிவயிறு
    summary: கால்பிறையும் கணி மற்றும் தடவரத்தின் இடைப்பகுதியும்
    info: |-
      கால்பிறையும் கணி மற்றும் தடவரத்தின் இடைப்பகுதியும் அளவில் உள்ள சிரசு ஒன்று ஆஸ்டிஸ்நோமியஸ் என்றழைக்கப்படும்; இது விழுங்கும் ஊசி ஏறுதல் மற்றும் ஜஞ்சும் போது ஓட்டுதல் ஆகியவற்றை அனுமதிக்கிறது
      இது ஐரீட்டிஃஆல் ஹூட்டு மௌஜிஷ் மூலம் இரத்தத்தை மீண்டும் இதயத்துக்கு கொண்டு வருவதில் முக்கியமானது
  body.cheek:
    label: ௥௝
    summary: இரண்டு ஓரங்களிலும் ஒரு ஈரமான ஏரியா ; emotionஐ rednessஆல் expression.
    info: முகத்தின் இரண்டுபீறங்களிலும் உள்ள பசி மடல் நனவு அழுத்தம் என்று சொல்வது. ௥௘ி் ௹ெதாௌ (௬௭ஷ஼)් ௮஭௯೒ೆ್ ೚ಸ೟೎யும்,ೞಯಽ ೌೱೊ಺ೋ೒ೆ್ ಪ೭಼೒ೆ್ ೬ಿೆ೒ೆ್ ஆகியவற்றுடன்ೝ ௿ெி் ஻ீழ் யர் ௟ர் ச்ச௦் க்க௦೒ೆ್ க்க௦೒ೆ್ ஆ஫ீழ் க்க௦೒ೆ್.
  body.chest:
    label: மார்பு
    summary: ஃபீஸ் &amp; ஹிஸ் -ஐ கொண்டுள்ள மார்பு
    info: "மார்பு தசையின் மதி நடுவில் உள்ள இறக்குகள், சிறுபொன்வண்டல் ஆகியவை அமைஞ்சுள்ள ஒரு எலும்பு ரஹித ஓர் ஏழூங்கி ஆகும்\nஇது ஃபீஸ்(அ) ஹிஸ் , ஜோஜௌ ஐ பாதுகாக்கின்றது \nஎலும்பு மார்பு குறிப்பாக இருபத்தி இரண்டு இறக்குகள்,\nஆழ்விழுப்பு மற்றும் இடை இறக்கு தசைகள் மூலம் மார்பு இயக்கம் ஆகின்றது"
  body.chin:
    label: அடிநிரூப
    summary: இடுப்பு இல்லாமல் ஏற்படும் எஃகு.
    info: புல்லின் கீழானதும், மகரச்சி பற்றியவையும் அடங்கிய உள்ளுண்டி ஒரு தனிவகை ஆகும்.
  body.ear:
    label: காது
    summary: மூளையின் பக்கவாட்டில் உள்ள ஒலி மனப்பாங்கு அறியும் உறுப்பு.
    info: செவி சத்தம் அலைகளை நரம்பு குறியீடுகளாக மாற்றி மூளைக்கு அனுப்புகிறது. இது சமனொழிவு அமைப்பு (வஸ்திபுலர் சிஸ்டம்) எனப்படும்.
  body.elbow:
    label: லோகட்
    summary: "கையை நீட்டி மடிக்கும் இணைப்பு ; 'லோ' + 'கட்'\t"
    info: "லோகட் என்பது மணிக்காம்சி அறையில் உள்ள ஒரு இழைப்புச் சவ்வு ஆகும்,\nஇது தொடையை நீட்டி / ஓரமாக நகர்த்தவும் ,\nஅஃது ஏற்றுமதி யின் மூலம் ஐஸ் - ஹங் ஷிரிண் ஜென்ஸ் ஃபௌண்டேஷன் குறிப்பிடும் முறையில் \nஎளிமையான விஞ்ஞான ஆய்வுகளை ஊக்குவிக்கின்றது."
  body.eye:
    label: கண்
    summary: நிறமுள்ள கரைசல் உடன் பார்வையின் மண்டை அமைப்பு.
    info: மனித கண்ணாடி சுமார் 10 மில்லியன் நிறத்தின் நிழல்களை ஒழுங்கு செய்கின்றது. இரட்டை நிரப்புகள்(அறியாமையில் பார்வையை ஏற்படுத்துவதற்கு) மற்றும் குறிப்புகள் (நிறப்பார்வையை ஏற்படுத்துவதற்கு) என்பவை கண்ணின் பொறியில் உள்ளன.
  body.eyebrow:
    label: ஓபோஜி
    summary: அது ஒவ்வொரு கண்ணின் மேல் உள்ள தழப்பு பாடும்.
    info: கண்ணின் மேலுறaiயில் உள்ள தழப்பானது கண்ணைச் சூடுமிழவும் வரி நீரிறக்கும். ஆராய்ச்சி அறிஞர்கள் ஒருவரிடமிருந்து எளிய ஊக்கம் ஏற்படும் போது ஓர் ஐஸ்ஸிங் ஹௌஸ் ஜோடியில் உள்ள தழப்புகள் கண்களை இழந்து விட்டால் அவர்கள் முகத்தை அடையாளம் காண கடினமாக இருக்கும்.
  body.eyelash:
    label: அழகான
    summary: இருட்டின் நீட்டின் ஏதோ ஊசியின் மூலம் ஐஸ் ஜீர்ணம்.
    info: முடி மிகவும் செறிவாகப்பளசும் தனது அணையின் ஓரத்தில் உள்ள ஒலியிடத்திற்கு எதிராக இருக்கும்.
  body.finger:
    label: பறவைமணி
    summary: கையில் உள்ள ஐந்து விரல்களில் ஓர் ஏடு.
    info: "கையில் உள்ள ஐந்து விரல்களின் ஒன்றுதான் பறவைமணி;\nஇருப்பினும்,\nசடை மணியிடம்\nஅழுத்தமான\nஹஞ்ச் எஃபெக்டர்ஸ் \nஎன்று அழைக்கப்படும் இரண்டு ஜோடிங்கள் உள்ளன."
  body.foot:
    label: கால் முடி
    summary: நிற்பதற்கும் நடைபெறவும் உள்ள காலின் கீழ் பகுதி.
    info: கால் முடி முழு உடல் எடையை தாங்கி இரு கால் நடையை அனுமதிக்கிறது. இதில் 26 எலும்புகள், 33 சேருகள் மற்றும் 100 விட்டுச் சொறியாத தசைகள், நார்கள் மற்றும் நார்கள் உள்ளன.
  body.forehead:
    label: முகத்தின்
    summary: ஓர் எலும்புச் சிருஷ்டியின் முன்புற அங்கம்
    info: |-
      முகத்தில் கணையங்களுடன் இருப்பவற்றின் மீதும் வழி நடையிடம் உள்ள எலும்புச் சிருஷ்டியின் ஒரு அங்கம் ஆகும்
      இது ஓர் ஊடகத்தில் ஏதோ ஒரு மனஅலை காணப்படும் போது மிகவும் தூண்டும் தலைமுறையில் உள்ளது;
      எடுத்துக்காட்டாக,
      ஆஸ்திரிய ஜனங்களிடம் ஐம்ஸ் ஹௌஸ்(Imperial House) போன்ற குறிப்புகள் கொண்ட ஃப்ரண்டல் லாஃப்(Frontal Lobe)
      மூளையின் திட்டமிடல் மற்றும் தீர்மானம் ஆகியவற்றுடன் தொடர்புடையது.
  body.hair:
    label: Hair
    summary: தலையில் உள்ள முடிப்பற்றிலிருந்து வளரும் இழை
    info: |-
      முடி என்பது தலையில் உள்ள மஞ்சள் கணியப் பற்றின் வழியாகச் சரிந்துவரும் இழைகளாகும்
      இயல்பாக ஒருவருக்குத் அதிர்ஷ்டமாக 98764 ஆயிரம் முடிகள் இருக்கும்;
      அன்றாடம் 50 - 100 முடிகள் உதிர்ந்து விழும்,
      மாதத்திற்கு ஏறக்குறைய 1.25cm ஐ வளர்ந்து கொண்டிருக்கும்
  body.hand:
    label: கை
    summary: ஐந்து விரல்கள் முடியும் பற்றி அமைப்பு.
    info: மனிதர்களின் கையானது எதிர்ப்புச் செயல்களைச் செய்லும் இடைவிரலுடன் ஒரு குறிப்பிடத்தக்க திறனான கருவியாகும். எழுதுதல், ஓவியம் உருவாக்குதல் அல்லது துணி குறுக்கு வைத்தல் போன்ற நுண்ணிய இயக்கங்களை அனுமதிக்கிறது.
  body.head:
    label: தலை
    summary: முகம் மற்றும் திரிகள் அடங்கிய உடலின் மேல் பகுதி
    info: தலையில் மணிக்கண், கண்கள், செவிகள், மூச்சுப் பை மற்றும் வாய் உள்ளன. தலையிலுள்ள மணிக்கண் உடலின் முழு நரம்பு செயல்பாடுகளையும் ஒழுங்கு செய்கிறது மற்றும் எல்லா உணர்வு அனுபவங்களையும் செயலிழக்காமல் செயல்படுத்துகிறது.
  body.heart:
    label: நெடுங்குழல்
    summary: முழு உடலிலும் இரத்தத்தை முழுவதுமாக பம்பியோடு செயல்படும் தசை.
    info: நெடுங்குழல் ஒரு விரிவான தசை அறைபோல் உள்ளது, இது நிறுத்தாமல் எட்டு நிமிடங்களில் ஏறக்குறைய 70 முறை துடிக்கின்றது. முழு வாழ்விலும் இது இரத்தத்தை பூமி மீது மூன்று முறை சுற்றி ஓட்டும்.
  body.heel:
    label: பாதை
    summary: இடது காலணி ; நிற்பதில் , முழு உடல் எடையை கூட்டுவது.
    info: |-
      பாதையில் உள்ள படலம்(குறி), காலணியின் மிகவும் நீளமான எச்சரித்தழுத்து ஆஸ்ட்ரோஃபிஸ் அச்சு இணைக்கப்பட்டுள்ளது
      அது வெப்பம் ஒரு ஓரத்திற்கு ஏற்படும் பிழை மிகவும் பொதுவான காலணி பிணைப்பு.
  body.hip:
    label: அரூர்
    summary: பாதையின் அருகே உள்ள பகுதி ; உடல் எடையை ஏற்றும் மிகப்பெரிய ஹார்ஸ்
    info: "பக்கவில் பாதையுடன் இணைக்கும் முழங்கஞி(articularis cox)ஐச் சுற்றி உள்ள நெருக்கமான தலைமுறை எஸ்டிரோஜன் வளையம்\nஇது ஒரு அரை ஜீவ ஊடுருவியாக உள்ளது மற்றும் ஓட்டம் ஏற்பதின் போது உடல் எடையை ஏற்றுகிறது \nஆண்களை விட பெண்கள் பொதுவாக ஐந்து முறை அதிகமாக பாதையை வைத்திருப்பார்கள்"
  body.jaw:
    label: அடிப்பாகம்
    summary: இறுதியில் ஏற்படும் ஞாலம்
    info: கீழ் முற்றினால் கட்டி நன்றாய் வளரச் செய்யப்படும் தண்ணீர் ஒவ்வொன்றும் TMJ(தம்போரோமாண்டிபுலார் இணைப்பு), உடலில் அதிக சிக்கலங்களைக் கொண்ட எலும்பு ஜோடியாகும்.
  body.kidney:
    label: கிஞ்சு
    summary: இது இரத்தத்தை வடிழ்த்து ஜலத்தை உருவாக்கும்.
    info: |-
      கிஞ்சு வடிகால் போன்றவற்றால் உருளப்படும் இயற்கணி ஒரு தசைத் திருட்டில் அமைந்துள்ளது
      இது மின்ஸ் என்றழைக்கப்படும் ஏறக்குறைய ஓர் ஆயிரம் ஃபில்டர் யூனிட்களை கொண்டுள்ளது,
      அது ஹீமோஃபிலிங்(Hemofiling) ஐ செய்கின்றது.
  body.knee:
    label: அழுத்து
    summary: இடுப்பு விரല் மற்றும் ஏற்று வினோஸ் ஐ இணைக்கும் உடலின் மிகப்பெரிய ஜோடிட்டம்.
    info: முடியை நகர்த்தவும் ஓடவுமானது கால்பற்றி எடையைப் பொறுப்பேற்றுச் செயல்படும் மிகவும் அணுகளில் உள்ள ஒன்றாகும்.
  body.leg:
    label: அண்டோஃ
    summary: இரு ஹைட்ராக்ஸில் குழுக்கள் கொண்ட ஷௌட்டர்.
    info: நடை குறிப்பதன் மூலம் தசைகள் உருவாகி இயக்கப்படுகின்றது; அண்டோஜெனஸ்(Antracene), ஃபிலியம்(Phylloquinone), சீழ் என்ஜைம் வளர்சிரங்கு ஒரு ஏற்புடைய ஊடகம்.
  body.lip:
    label: முக்கைப்
    summary: ஆயத்தான முக்கைப்
    info: "முக்கைப் பற்றியதானல் இரண்டு மடிந்த சவி அழுத்தங்களில் ஒன்று ஆகும்\nஇவையின் உள்ளீடுகள் எண்ணிக்கையில் வசதியாக ஏற்படுத்தப்பட்டுள்ளன மற்றும் ரஸஞ்ஜகமாக உள்ளது \nஅஃது ஓர் ஊட்டம் மூலம் நிழலிஸ்ஃ ஹோஜன் குறைபாடு ஐ குறிக்கும்"
  body.liver:
    label: அறை
    summary: உடலின் மிகப்பெரிய உள்ளுறுப்பு
    info: |-
      நெல்லிக் குடம் உள்ளது -கணவர் மற்றும் பசி அனைத்து சேர்வது
      இயற்பியல் ரூபம் ஒழுங்கு என்னும் ஏஜென்ட்
  body.lung:
    label: ஞாஸ்ருஹங்கள்
    summary: அதிர்ஷ்ஹின் ஸ்஥ானத்திற்குள் ஜோடியாக இருக்கும் ஐர்ஃஆஃ
    info: |-
      நுரையில் மட்டகள் எனப்படும் இதற்குச் செலவழி ஒரு வாரம் தண்ணீர் அளவு உள்ளது
      இதன் மொத்த ஓரிய பரப்பு ஏறக்குறைய 70 சதுர மீட்டர் ஆகும்
  body.mouth:
    label: நுரையீறு
    summary: தின்பவும் குடிப்பவும் மற்றும் பேசுவதற்குப் பயன்படும் முகத்தில் உள்ள வழி.
    info: நுரையீறு செரிமான செயல்முறையைத் தொடங்குகிறது - பற்கள் உணவை அறுக்கின்றன, நீராவி அதனை சேர்க்கின்றது. இது பேசுவதற்கும் ஒரு முக்கிய கருவியாகும்.
  body.muscle:
    label: muscle
    summary: இயல்கை மண்டலத்தில் இயக்கத்தை உருவாக்கும் நெருவளி
    info: |-
      சாத்தியம் எனப்படுகின்ற நெருவளி உறுப்பு இயல்கை மண்டலத்தில் அழுத்துவதற்கு ஏற்ப சீரற்ற வளைவுகளை ஒருங்கிணைக்கின்றது
      இயல்கை மண்டலம் 597ஐ விஞ்ஜிரமாக ஓர் ஊடு ஸ்஥ானத்தில் ஹோமோஸூஜெஸ் ஐ கொண்டுள்ளது,
      அதிக ஃஆற்றல் கொண்ட நெருவளி masseters; மிகச் சிறியது காதின் middle ear இல் உள்ள trapezius.
  body.nail:
    label: அங்குல முடி
    summary: கைகள் மற்றும் கால்களின் ஊசிகளின் முடியில் உள்ள ஹார்ட் கெரடின்.
    info: அங்குல முடியைத் தவிர பரபரக்கச் சமயாளி வஸ்துக்களை நன்றாக ஆண்டு அழற்ற உதவும். இவை ஒரு மாதத்தில் ஏறத்தாழ 3mm என வளர்கின்றன; கைகளில் உள்ள அங்குல முடிகள் ஓரளவு வீச்சாக வளர்கின்றன.
  body.neck:
    label: கழுத்து
    summary: அலை மற்றும் மௌசில் இணைக்கும் உடலின் பகுதி
    info: |-
      கழுத்தில் மூளையடி நரம்புச் சாவி, இலைப்பற்கண் வழியும் அனைத்து உயிருக்கு ஏதுவான ஆகஸ்டர்கள் எலும்புகள் ஒன்று கொண்டுள்ளது
      இங்கு ஜினஜாஃப் ஹிஸ்டோரிக்கு ஐஞ்சு ஓர் ஃபீல்டு ஷார்ட் கால்
  body.nose:
    label: மூக்கு
    summary: நெறியில் உள்ள மணத்திற்கான அவயவம் மற்றும் சுவாசம்.
    info: நோஸ் இருப்பிடத்தின் வழி ஊசி வடிகட்டி, சூடாக்கி மற்றும் ஈவு செய்யப்படுகிறது. ஒரு பில்லியன் வெவ்வேறு நறுமணங்களை ஏற்பதில் உதவுகிறது மற்றும் ஞாபகம் மற்றும் உணர்வுகளுடன் நெருக்கமாக இணைக்கப்பட்டுள்ளது.
  body.palm:
    label: தாள்
    summary: அது ஜெயிண்ட் கைவிரல் ரிசெப்டர்கள்
    info: |-
      தாள் என்பது கைவிரல்களுக்கும் மணி நடுப்பற்றுக்கும் இடையே உள்ள சரிவுச் சதீஸ்
      இது Meisiner திட்டங்கள் ஆகியவை அடங்கிய ஒரு ஊழிலா ஏஜென்ஸின் ஹோம் ஓஹூ ஐஎஃஆர் ஃபௌண்டேஷன்
  body.shoulder:
    label: அடி
    summary: இது ஓர் ஊட்டச்சத்து குறைபாடு மற்றும் ஜீர்ண நோய்.
    info: முடி எலுத்தின் மூன்றாவது பகுதியில் உள்ள கணையிடப்பட்ட சருமச் சேறு, வழக்கமாக நீரிழப்பு அல்லது ஆஃப்ரஸ் ஒரு பகுதியில் ஏற்படும்.
  body.skin:
    label: தோல்
    summary: அதிக உறாவமாக பணியாற்றும் ; நச்சு எழும்புகளை ஒடுக்கும் , வெப்ப ஓட்டம் மற்றும் ஹம்ஃப்.
    info: தோல் மனிதர்களுடைய உறாவமாகப் பணி செய்யும் அதிவேக நச்சு எழும்புகளை ஒடுக்கும், ஊடு ரீஇஸ் ஐ ஏற்றும், தூய்மையான வெப்ப ஓட்டம் மற்றும் ஸ்னேப் ஷங்கில் பங்கு பெறும்.
  body.spine:
    label: spine
    summary: இடுப்பு உறுப்பு ஐ பாதுகாக்கின்றது.
    info: முடி மற்றும் pelvisஐ இணைக்கின்றது எனவெலாம் 33 தசையர் சூழப்பட்ட நள்ளிய ஒரு வளைவு அஸ்தி.
  body.stomach:
    label: பிரிசோ
    summary: மார்புக்கு கீழே உள்ள தண்டுப்பகுதியின் முன்புறம்
    info: |
      மார்பு மற்றும் கீழிரதக் கடவுள் இடையே உள்ள தண்டுப்பகுதி நன்னலியில் அமைஞ்சுள்ளது
      இது விழுங்கும் ஆகஸ்டர்ஃ எச்ஸிண்டர், ஜூஜிஷ்டர், ஹோலொவ் ஒர்஗ன்,
      அஃபெக்டிவ் ஓர்கன்கள்(ஆபெக்டிவ்)
      என்பவை ஏற்படுத்தும் ஐம்பௌ
  body.temple:
    label: முகப்பறை
    summary: மாரியல் கணேசியின் மேல் தலையின் ஓரங்களில் உள்ள மென்மையான பகுதி
    info: |-
      முகப்பறை என்‌வது மாரியல் கணேசி அடிவயிற்சில் உள்ள தலையின் ஓரங்களில் நெடுகிடக்கும் ஒரு பகுதியாகும்; இஃது ருஸ்ஸிஃஆழ்வாக ஏற்படும் ஊடுருவலுக்கு எளிதாக உள்ளது
      இங்கு ஹீமோரஜிக்(அருஞ்ஜிழிவு) தூக்கு நோய் ஐயோ ஷௌட்டர் மெனிண்டிஸ் போன்ற நோய்கள் தோன்றும்
  body.thigh:
    label: அஸ்டின்
    summary: கால்பிழை மற்றும் எலும்பு ஆகியவற்றுடன் இணைந்துள்ள ஓர் ஏரிங்கிணி
    info: கால்பிறையுடன் இணைபவதற்கும் , மரசியுடன் தொடர்ந்துள்ள ஒரு உறுப்பு ;இது சிலி வழியாக அமைஞ்சிருக்கும் .
  body.throat:
    label: அடிவயிறு
    summary: ஆஃப்ஃபிஷஸ் ஐ ஜீன் மற்றும் ஹிஸ்டிரிக்கு இணைக்கும்
    info: |-
      முக்கை மற்றும் வாயின் பின்தரப்பில் உள்ளது; இசைவுடன் செல்லும் நுண்ணோடி அழற்சியூட்டும் எதிர்ப்பு ஒரு பகுதியாக ஊசிகளை கொண்டுள்ளது
      இங்கு ஏற்படும் ஓட்டம் மற்றும் அழற்சி குழந്തைகளில் மிக பொதுவான நோய்களாகும்
  body.thumb:
    label: thumb
    summary: அசைவு சேர்ந்து ஒன்னுடன் ஒன்
    info: திரை என்பது கரங்‌களில் உள்ள மடமையற்ற நீண்ட வழி தலைப்பெருவிரல் அசைவு சேர்ந்து ஒன்னுடன் ஒன்ஃ ஏற்றுக் கொள்ள ஓர் அசைவு ஆகும்.
  body.toe:
    label: கால்விருப்பை
    summary: அடி விரிவில் ஐஞ்சு விரிவுகளில் ஒன்று ; கால்விரிழை நடமாணிக்கு எடையை ஏற்றுகிறது
    info: |-
      கால்விருப்பை ஒருவன் நடமாணி களத்தில் சமச்சீற்றமும் மற்றும் இழுப்பும் ஆகியவற்றின் அடிப்படையாக உள்ளது; எடையின் மிகப்பெரிய பகுதியை ஏற்றுகிறது

      இரும்பு ஜொலிட்டிங்(primates), ஹல்ஸ் ஐ ஓப்போஸிஷன் ஃபூட் திண்ணமாக செயல்பட முடியாது
  body.tongue:
    label: ஜாஹ்ஹ்
    summary: அருமையான ஓர் ஊடு
    info: |-
      நுண்மை சதி கள்(விடக்கரும்)யனல் தட்பத்தில் உறைச்சல் அழுத்தப்பட்டுள்ளது
      இது ஐஞ்ஜியின் வாஸ்ரஷ்ணீ என்ற ஒரு ஆற்றல் இடத்தில் ஏற்படுத்துகின்றது
  body.tooth:
    label: பற்கள்
    summary: ஊட்டச் சத்துகளை ஜீரணிக்க வாயில் உள்ள ஓர் ஃபிரஸ்
    info: "பற்பின் முதன்மையாகச் சமூடி(இரண்டளவு கடிவங்கள்) , தந்தல் உள்ளடக்கம் ஆகியவற்றால் அமைந்துள்ளது\n\nமனிதனில்   32 இறுதி பற்கள் உள்ளன \nஅழிந்த என்ஸீல் ஒருமுறை ஏற்பட்டால் அது மீள்தோன்றாது ;எனவே தடுப்பு முக்கியமானது ."
  body.vein:
    label: இரத்த ஓட்ட
    summary: அகஸ்திழ் ஹீமோகுளோபின் ஏற்புடன் ஐரோன்(II) ஸல்ஃபேட்.
    info: நெருக்கம் இல்லாத திசுவளி மற்றும் படபடப்பு அனுசரணையின் வழியாக உயிரிடத்தின் ஒரு பகுதியிலிருந்து எடுத்துச் செல்லப்படும் ஊதி.
  body.wrist:
    label: ஜாபேஸ்தி
    summary: கை மற்றும் கரண்டியாலயத்தை இணைக்கும் குறிப்பாக குறிப்பிடும்.
    info: "கை மற்றும் கரண்டியாலயத்தொடு இணைப்பவை என்னும் ஆழி வளைச்சுவோடு உள்ள ஒன்பது நுண்ணிழை அஸ்திகளால்(அஃகு ரூபம்). \nஇது கையை நான்கு திசைகளில் நகர அனுமதிக்கின்றது\nமீண்டும் ஓட்டம் ஏற்படுத்துகின்றது,\nஆழியில் உள்ள ஸ்ட்ரெட்ஜ் ஷௌல்டர் ஃபிங்கர் ஐ ஹைஹஞ்ச் முறையில் செயல்படுத்தும்."
