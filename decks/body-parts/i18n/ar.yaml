lang: ar
pivot: false
title: أجزاء الجسد
cards:
  body.ankle:
    label: مفصلكعب
    summary: المفاصل التي تُركِّز بين ساقي الرجلين؛ أكثر المفاصيل إصابة.
    info: الكاحل هو مفصل يربط الساق بالقدم ويتكون من ثلاث عظام، ويجعل القدم قادرة على الحركة لأعلى ولأسفل والتحرك جانبًا ببطء. كسر الكاحل أو تشويهه يحدث بشكل شائع في الأنشطة الرياضية. تصل العضلة Achilles إلى عظمة الجذع عند منطقة الكاحل.
  body.arm:
    label: الذراع
    summary: عضو أعلى يتراوح بين الكتف وإصبع الإبهام.
    info: الذراع هو العضو الأعلى المكون من ثلاثة أجزاء؛ وهي الجذعية، والساعد، والإبهام. يحتوي على أكثر من ثلاثين عضلًا وعظمًا وأربطة تسمح بالحركة. تتصل عظام الذراع العليا (عظمة الساعد)، والسفلية (نصف دائرة الشرايين والعناصر الأخرى) في مفصل المرفق.
  body.back:
    label: الظهر
    summary: الجزء الخلفي من جسم الإنسان؛ أكبر مجموعة عضلية في الجسم.
    info: الظهر هو الجزء الخلفي من الجذع، يمتد من الرقبة إلى الفخذين. ويحتوي على العمود الفقري المكون من ثلاث وثلاثين عظمة مغطاة بالعضلات الظهارية.
  body.belly_button:
    label: البطنة
    summary: ندبة موجودة وسط البطن نتيجة لقص الحبل السري.
    info: البُطّة هي ندبة توجد في مكان ارتباط الحبل السري، والذي كان ينقل العناصر الغذائية للجنين من الأم. يمكن أن تكون البطن محدباً أو مقعراً حسب طبيعة التئام الجرح بعد قص الحبل السري. تحتوي هذه المنطقة على مجتمعات دقيقة من الميكروبات؛ وقد سجلت الدراسات وجود بكتيريا فريدة.
  body.bone:
    label: عظم
    summary: أنسجة ضامة قوية تشكِّل الهيكل؛ وهي عنصر نشط يتضمَّن النُّخام.
    info: العظام هي أنسجة صلبة تتكوّن من خلايا عظمية وملح معدني مثل الكальسيوم والفوسفور، ولها دور في إنتاج كريات الدم الحمراء والبيضاء وأجسام الصفائح الدمويَّة عبر النخاع العظمي. لدى الإنسان البالغ ٢٠٦ عظمة بينما يولد الطفل بحوالي ٣٠٠ عظمة تتجمع مع مرور الزمن إلى عدد أقل. كما أن العضلات والعناصر الأخرى المرتبطة بالهيكل الهيكلي تعمل على حفاظته وتقويمه.
  body.brain:
    label: المخ
    summary: مركز التحكم الرئيسي في الجسد، وهو أعقد بنية بيولوجية موجودة.
    info: |-
      يبلغ وزن الدماغ البشري حوالي كيلوغرام ونصف ويحتوي على أكثر من 86 مليار عصبون.
      it ينقسم إلى نصفتين؛ النصف الأيسر يتحكم في الجانب الأيمن للجسم والعكس صحيح.
      الدماغ يستهلك نسبةً تصل إلى ٢٠٪ من طاقة الجسم بالكامل رغم أنه لا يتكون سوى بنسبة ٢٪ من الوزن الكلي.
      The brain is the only tissue in the body which does not feel pain itself because it lacks receptors for detecting painful stimuli.
  body.calf:
    label: لَبْطِق
    summary: الجزء الخلفي من سفلي الرجل بين ركبتيها.
    info: الربلة هي العضلات الخلفية في الساق تحت الركبة وتحت المعصم. عضلاتها الرئيسية، مثل الرباطي الكبير والصغير، تسمح بالوقوف على أطراف الأصابع وإطلاق القفزات بفعالية. كما أن للربكة دورًا أساسيًّا في إرجاع الدم من القدمين إلى قلب الإنسان.
  body.cheek:
    label: خَدّ
    summary: منطقة دهنية موجودة جانبًا من وجه الإنسان؛ تعبر عن المشاعر عبر احتوائها.
    info: الوجه هو المنطقة على جانبي الوجه تحتوي عظام الخد والكيس الشحمي، واحمرار الجلد في هذه المناطق يُعرف باسم الإحمرار وهو رد فعل فسيولوجي تلقائي للعواطف مثل الحرج أو الانفعالات العاطفية. أما خصل الأطفال فإنها مصغرة وممتلئة عمداً كأنماض لتطور التعلق الأبوة.
  body.chest:
    label: الصَدْر
    summary: الجزء الأمامي من الجسم الذي يحتوي على قلبٍ ولungs.
    info: يُكوّن الصدر جزءًا أمامياً من الجذع محدوداً بالأضلاع وعظم القفص والعمود الفقري، وهو يحمي الأعضاء الحيوية مثل القلب والأجسام التنفسية. يتكون الهيكل العظمي للصدر من زوجين اثني عشر ضلعاً وأسفل عظمة القفص والعظام الفقرية في منطقة الصدر.
  body.chin:
    label: الحاجز
    summary: الجزء الأسفل من الوجه تحت الشفة السُّفلى.
    info: الحافة هي الجزء الأدنى من الوجه المكون بواسطة الفك السفلي، وهي ميزة فريدة لدى البشر في عالم الحيوان؛ فالرئات الأخرى لا تمتلكها. سبب وجود الحاجز ما زل موضوع جدل علمي.
  body.ear:
    label: الأذن
    summary: عضو حسي للسماع على جانب الرأس.
    info: تلتقط الأذن موجات الصوت وترسلها كإشارات عصبية إلى الدماغ. كما تحتوي أيضًا على جهاز التوازن (النظام الظفري).
  body.elbow:
    label: elbow
    summary: المفصل المسؤول عن انثناء الذراع؛ أصل الكلمة يأتي من كلمة 'قوس'.
    info: المرفق هو مفصل يقع على الجانب الخارجي من نقطة الاتصال بين الذراع والساعد، ويعمل كمفصلي للذراع مما يسمح بالانحناء والإطالة وإمكانية دوران الساعد حوله. ومن المثير للاهتمام أن الجلد في المرفق لا يتضمن خلوي حاسة اللمس. ضرب العصب尺状神经 الذي يعبر المرفق يؤدي إلى شعور غريب مشابه لمزق النحل.
  body.eye:
    label: العين
    summary: عضو حسي للرؤية يحتوي على بُطانة ملونة.
    info: تحتوي العين البشرية على القدرة على التمييز بين حوالي 10 ملايين درجة لون مختلفة. تحتوي الشبكية على خلايا عصبية تسمى قضيبيات (للحصول على الرؤية في الإضاءة الخافتة) وخلايا مخرومية (للرؤية بالألوان).
  body.eyebrow:
    label: الحاجب
    summary: شريطاً من الشُعرِ أعلى كل عينا؛ مهما في التعبيرعن الملامح.
    info: الحواجب هي شريط من الشعر فوق الجفن العلوي للعين، وهي ضرورية للتواصل غير اللفظي حيث نعبر عن نطاق واسع من المشاعر عبر تحركات الحاجبين. كما أنها تحمي العين من الرذاذ والطّمّ اللَّزج.
  body.eyelash:
    label: رَمْلُوش
    summary: سلسلة شعيرات مقوسة موجودة عند حافة جفن تحافظ على سلامتها.
    info: الرموش هي خصلات قصيرة من الشعر المنحني تنمو على حواف الجفون، وتحمي العين من الغبار والعرق والأجسام الاجنبية. لدى الإنسان البالغ ما بين ١٠٠ إلى ١٥٠ رمش في الحاجب الأعلى وما بين ٥٠ إلى ٧٥ رمشًا في الحافة السفلية. تستغرق الرموش حوالي أربعة أسابيع حتى ثمانية لتجديد نفسها.
  body.finger:
    label: '"الإصباع"'
    summary: «أحدها من بين خمسة أصابع باليد»
    info: '{"hint":"واحدة من الخمس أصابع في اليد","info":"إن إصبع اليد هو واحدٌ من خمسةِ أصابع؛ الإبهام يحتوي على رابطتين، والباقي ثلاثَ كلُّها. نملك دائمًا عشرةً من الأصابع؛ تتحرك بشكل متنوع مما يجعل استخدام أدوات وكتابة الموسيقى أو الكتابة أمرًا ممكنًا. بصمات الأصابيع هي فريدة لكل شخص. إن للأيدي حساسية عالية بسبب كثافة مستشعرات اللمس بها وهي واحدة من أكثر جزء الجسم تحسسا."}'
  body.foot:
    label: القدم
    summary: الجزء السفلي من القدم، الذي نقف ونمشي عليه.
    info: تتحمل القدم وزن الجسم بأكمله وتسمح بالمشي على قدمين. تحتوي على 26 عظماً و33 مفصلاً وأكثر من 100 عضلة ورباط وتمزق.
  body.forehead:
    label: الجبهة
    summary: الجزء الأمامي من الجمجمة أعلى الحاجب وهو مساحة للتعبير عن العواطف.
    info: الجبهة هي الجزء الأمامي من الجمجمة فوق الحاجبين وتحت خط الشعر، وهي واحدة من أكثر المناطق ظهورًا في التعبير عن المشاعر؛ حيث يعبر تجعدها عن القلق أو الانزعاج. كما كانت علامات على الجبهة ذات دلالة رمزية لدى العديد من الثقافات مثل اليمين والطائفة الاجتماعية.
  body.hair:
    label: ' الشعر '
    summary: خيط ينمو من جلد فروة الرأس
    info: |-
      الشعر عبارة عن خيوط من الكيراتين تنمو من بصيلاتها في الرأس
      لدى الإنسان حوالي ١٠٠ ألف شعرة على رؤوسهم؛ تسقط يوميًا ما بين ٥٠ إلى ١٠٠ منها
      تُنتج كل شعيرة طولها نحو سنتيمتر وربع تقريبًا خلال الشهر
  body.hand:
    label: اليد
    summary: جزء من الذراع ينتهي بخمسة أصابع.
    info: اليد البشرية هي أداة مذهلة قابلة للحركة مع إبهام قادر على التقابل. تسمح بالتحكم الدقيق مثل الكتابة أو الرسم أو الخياطة.
  body.head:
    label: الرأس
    summary: الجزء العلوي من الجسم، حيث يقع الدماغ والأعضاء الحسية.
    info: يحتوي الرأس على الدماغ والعينين والأذنين والأنف والفم. الدماغ الموجود في الرأس هو مركز التحكم في كامل الجسد ويعالج جميع الإدراكات الحسية.
  body.heart:
    label: القلب
    summary: عضلة تضخ الدم في جميع أنحاء الجسم باستمرار.
    info: القلب عبارة عن عضلة فارغة حجمها يعادل قبضة اليد، وتمضي حوالي 70 مرة بالدقيقة. خلال الحياة كلها، ستضخ القلب كمية من الدم تعادل ثلاث مرات حول الأرض.
  body.heel:
    label: '"كعوب الأقدام"'
    summary: الجزء الخلفي من قدم؛ تحمل الوزن الكامل لجسم الإنسان أثناء الوقف.
    info: |-
      {"hint":"الجزء السفلي الخلفي من القدم","info":"هي عظمة الكعب هي أكبر عظم في الجزء السفلي من الجسم.
      تحمّل معظم وزن الجسد عند الوقوف.
      تربط هذه العظام مع كاحله Achilles.
      الآلام الناتجة عن الكتفة أو التهاب Fascia Plantaris هو أحد أكثر المشاكل شيوعًا للقدمين."}
  body.hip:
    label: الفخذي
    summary: منطقة الحوض؛ أكبر مفصَلٍ يحمل الوزن.
    info: البطن هو المنطقة حول مفصل الفخذ، وهو يربط عظمة الساق بالحوض. إنه من المفاصل الكروية التي تحمل وزن الجسم أثناء المشي. تميل النساء إلى أن يكنّ لهن حوضًا أوسع في المتوسط عن الرجال بسبب الولادة.
  body.jaw:
    label: الفك
    summary: عظم الوجه السفني الذي يتحرك أثناء المضغ والتواصل.
    info: الفك السفلي هو العظم الوحيد المتحرك في الجمجمة، ويسمح بالمضغ والبلع و الكلام. يُعتبر مفصل الفك والساعي من أكثر المفاصل تعقيدًا في الجسم.
  body.kidney:
    label: الكلى
    summary: عضو زوجي ينقى الدم ويولد البول.
    info: الكلى عبارة عن أعضاء على شكل فول مُثبتة في الجزء الخلفي من تجويف البطن، وتنقي أكثر من ١٨٠ لترًا من الدم يومياً وتنتج بين литر إلى ٢ ليتром من البول. تحتوي كل كليّة على مليون وحدة تنقية تقريباً (نفرونات)، كما تقوم الكلى بتنظيم ضغط الدم والموازنة الإلكترولتيتكس والإنتاج خلايا الدم الحمر.
  body.knee:
    label: الركبة
    summary: أكبر مفصلي يربط الفخذ بالساق.
    info: الركبة هي أكبر مفصل في جسم الإنسان وأيضًا أحد أكثرها تعقيداً، وتتكون من عظم الركبة والغضاريف العضلية والأربطة المتقاطعة والأربطة الجانبية. وهي تُصمم لتتحمل وزن الجسم أثناء المشي أو الجري.
  body.leg:
    label: ساق
    summary: الجزء الأسفل من الجسم بين الورك والساعدين.
    info: تشمل الساق من الفخذ إلى الكاحل والقدم، وهي مُعدّة للسير على قدمين وتحتوي عضلاتها القوية مثل العضلة ذات الرأس الأربعة التي تدعم الحركة بشكل فعَال.
  body.lip:
    label: شَفةٌ واحدةُ فقط
    summary: أحد الجانبيْن المتماسّيْن لمدخل الفِك.
    info: الشفاه هما من الأنسجة العضلية الناعمة التي تحيط بالفم، ويوجد بها الكثير من نهايات أعصاب حساسة جدًا؛ لون الشفتين يعتمد على الدورة الدموية، ويمكن أن يكون اللون البنفسجي دليلًا نقص أكسجين في الجسم. كما أنها مهمة للتعبير عن المشاعر والقبلات ولفظ الحروف مثل 'ب' أو 'م'.
  body.liver:
    label: ' الكبد'
    summary: أكبر عضو في الجسم؛ مختبر كيميائي للكائن الحي.
    info: الكبد هو أكبر عضو داخلي يزن أكثر من كيلوجرام ونصف، ويؤدي حوالي خمسمائة chức năng مثل تنقية الدم وإنتاج العصارة الصفراوية والبروتينات المُنتَجة فيه وخزنه للجلوكوز على هيئة جليكوجن. كما أنه الوحيد القادر على التجدد الكامل حتى لو تبقى منه نسيج قليل فقط.
  body.lung:
    label: الرئة
    summary: عضو رئوي زوجي موجود بتجوف الصدور يستقبل الأكسجين الموجود بهواء.
    info: الرئة عضو زوجي في تجويف الصدر يتكون من ملايين الحويصلات الهوائية (الفجوات الرئوية). المساحة الكلية للسطح الخارجي للفتحات الموجودة داخل الرئة حوالي ٧٠ متراً مربعاً، الشخص البالغ يتنفس بين ١٢ إلى ٢٠ مرة بالدقيقة ويستنشق ما يصل إلى ٥٠٠ مليлитروهواء مع كل نفس.
  body.mouth:
    label: الفم
    summary: فتحة في الوجه تُستخدم للأكل والشرب والتحدث.
    info: يبدأ الفم عملية الهضم، حيث تقوم الأسنان بمضغ الطعام بينما يحلل اللعاب المواد الغذائية. كما أنه الأداة الرئيسية للحديث والتواصل.
  body.muscle:
    label: عَضْلُة
    summary: نسيج قابل للانكماش لتمكين الحركة
    info: |-
      العضل هو نسيج قادر على الانقباض، مما يسمح بالحركة في الجسم
      يحتوي جسد الإنسان على أكثر من 600 عضلة تشكل حوالي ٤٠٪ من وزن الجسد
      أقوى العضلات هي عضلتي المضغ؛ وأضعفها حجمًا هو عصب السمع الصغير الموجود في الأذن الوسطى
  body.nail:
    label: نَخْر
    summary: قطعة كثيفة المكونة من الكيتوسين تتواجد بأطراف اليدين والأقدام.
    info: الظفر هو قطعة صلبة من الكيراتين في نهاية كل أصبع، ويساعد على حماية الأطراف الحساسة للأصابع ويحسن الإمساك بالأشياء الصغيرة. ينمو الظفروان حوالي ٣ مم شهريًا؛ حيث تطول الأظفار الموجودة بالأيدي بشكل أسرع مما هي عليه تلك التي تكون موجودة باليدين والقدمين.
  body.neck:
    label: عنق
    summary: الجزء الذي يربط الرأس بالجذع؛ ويحتوي على أوعية دموية حياتية.
    info: الرقبة هي المنطقة الواقعة بين الجمجمة والصدر وتحتوي على سبع فقرات عنقية، وهي تحوي تركيبات حيوية مهمة مثل الشرايين والمريء والعناصر الهوائية والنخاعيّن العظمين. كما تحتوي الرقبة عدداً من العضلات التي تسمح بتدوير وإمالَتِ الرأس إلى الأمام أو الجانبين.
  body.nose:
    label: الأنف
    summary: عضو الشم والتنفس في وسط الوجه.
    info: يقوم الأنف بتصفية الهواء الداخل، وتلميه وإحمائه. يمكنه التمييز بين أكثر من مليار رائحة مختلفة وهو مرتبط ارتباطًا وثيقًا بالذاكرة والعواطف.
  body.palm:
    label: دَلْوِي
    summary: الجزء المسطّح داخل اليد؛ منطقة تضم أكثف حساسيتها.
    info: اليد هي السطح الداخلي للذراع بين الأصابع و المعصمين، تحتوي على شبكة كثيفة من مستشعرات اللمس مثل أجسام ميسنر المستخدمة في الشموع الحساسة لقراءة الطاقة أو التنبؤ بالمستقبل.
  body.shoulder:
    label: الكتف
    summary: مفصل يربط ذراع بالجذع ويتميز بأكبر مدى الحركات.
    info: يحتوي مفصل الكتف على أكبر نطاق حركة من جميع المفاصل في الجسم، وهو عبارة عن مفصلاً كروياً يتكون من رأس العضد وحفرة الظفان. إن عدم استقرار الذراع يجعله قابلاً للخلع بسهولة.
  body.skin:
    label: الجلد
    summary: أكبر عضو في الجسد؛ يوفر الحماية وتوازن حراري واستشعار اللمس.
    info: 'الجلد هو أكبر عضو في جسم الإنسان ويغطي مساحة تبلغ حوالي مترين مربعين، ويفعّل الوظائف التالية: حماية الجسم من العدوى والإشعاع فوق البنفسجي والحفاظ على درجة الحرارة والاستشعار بالملامسة وإنتاج الفيتامين د. يستغرق استبدال خلايا الطبقة الخارجية للبشرة ما بين أسبوعين إلى أربعة أسابيع تقريبًا.'
  body.spine:
    label: العمود الفقري
    summary: سلسة تتكون من 33 عمودًا تنظم حماية الحبل الشوخي والدعم الجسم.
    info: تتكون العمود الفقري من سلسلة مكونة من 33 عظمة تربط الجمجمة بالعظام الصدفية، وتحمي الحبل الشوكي وتُعتبر الدعم الرئيسي للجسم. بين الفقرات هناك أقراص فقرية تعمل كامتصاص للاهتزازات.
  body.stomach:
    label: '"البطن"'
    summary: الجزء الأمامى من الجسم تحت الصدر
    info: '{"hint":"البطن؛ منطقة البelly","info":"يعتبر الظهر الأمامي هو الجزء الأمي من الجذع بين الصدر والحوض، ويتكون هذا المنطقة من الأعضاء الهضمية مثل المعدة والأمعاء والكبد والبنكرياس والطحال. تُعتبر عضلات البطن ضرورية لدعم العمود الفقري وتوفير الحماية للأعضاء الداخلية."}'
  body.temple:
    label: ساخطة
    summary: منطقة طرية تقع جانبًا إلى الجانب الآخر أعلى خديّ الرأس.
    info: الساقط هو المنطقة المسطحة على جانبي الجبهة فوق الخد، وهو عبارة عن منطقة مفتوحية في العظم الصفيحي من القحف وقابل للإصابة بالضربات والجروح؛ كما أن الشرايين الساخطين هما واضحتان عند نقر قلبك، ويتم الارتباط هنا ب근 سقاطي يخدم عمليةمضغ الطعام.
  body.thigh:
    label: فخد
    summary: جزء القدم بين فخذي الوركين إلى أسفل؛ أقوى مجموعة عضلية.
    info: الفخذ هو جزء من الساق بين مفصل الفخذ و الركبة، ويحتوي على مجموعة عضلية قوية في الجسم وهي العضلة ذات الأربع رؤوس والعضلات الخلفية للساق. هيكل عظمي يُعرف بالعظام الأقوى والأطول داخل الجسد.
  body.throat:
    label: الحنجر
    summary: تجويف يتصل الفم بالمري و القصبة الهوائية.
    info: الحلق هو تجويف خلف الأنف والفم ويستخدم كمسار للهواء والطعام، كما يحتوي على الزائدة الليمفاوية التي تعتبر جزءًا من الجهاز المناعي. انعكاس الحلق أو ما يعرف بانعكاس التقيؤ يعمل لمنع دخول الأجسام الغريبة إلى الرئتين.
  body.thumb:
    label: السباحة
    summary: أصبع قصير وسميكة في اليدين؛ تحركها هو العنصر الجوهري لحركة الإمساك.
    info: السبابة هي أصبع قصير سمين على اليد قادر على الحركة المقابلة (لمس الأصابع الأخرى). إن حركة مواجهة السبابة تُعتبر التكيف الأساسي الذي يسمح للإنسان بالتعامل مع أدواته، وقد ظهرت خلال عملية التطوير وهي موجودة فقط لدى الرئيسيات.
  body.toe:
    label: إصبع قدم
    summary: أحد خمسة أصابع موجودين بالقدم؛ الإبهام ناقل للوزن خلال السير.
    info: '{"hint":"واحدة من الخمس أصابع في القدم","info":"إن إصبع القدم هو أحد الأصابع الخمسة على القدم\npinky القدم (Hallux) ضروري للحفاظ على التوازن والانطلاق أثناء المشي؛ فهو يحمل جزءاً كبيراً جداً من الوزن\. وعلى عكس الرئات، لا يمكن لإبهام الإنسان أن يؤدي الحركة المعاكسة\. وحالة صحة الأظافر تشير إلى حالة الصحة العامة لجسم الشخص"}'
  body.tongue:
    label: اللغة
    summary: عضو العضل داخل الفم المستخدم للتذكير بالنكهة والتواصل.
    info: اللسان عضوٌ لحمي مغطى ببصيلات الذوق (أكثر من 10 آلاف). يسمح بإدراك خمسة أنواع أساسية للطعم هي الحلو، المالح، الرطب، المرّ والأسفيري. وهو ضروري لتوضيح الكلام ويساعد في البلع.
  body.tooth:
    label: سن
    summary: هيكلٌ معدني داخل الفم لเคء الطعام.
    info: الأسنان هي هياكل صلبة تتكوّن من المينا (أصلب أنسجة الجسم)، والدentin، وتجويف العَظمِي. لدى الإنسان في أسنانه الدائمة اثنان وأربعون سنًا. لا تتكون طبقات جديدة بعد فقدانها؛ لذلك الوقاية مهمة جدًّا. أنقى الأسنان البشرية القديمة التي تم الحفاظ عليها يزيد عمرها عن مليونين سنة وتُساعد على إعادة بناء التطور.
  body.vein:
    label: الشعير
    summary: أنابيب تحمل الدِّماء غير المشعَّعة نحو قلبه ؛ مرئي في معصمه.
    info: |-
      الشريان هو عبارة عن أوعية دموية تنقل الدم إلى القلب، و على خلاف الأوردة فإن الشرايين تحتوي على صمامات لمنع العودة مرة أخرى للدم من أن يعود إلى الوراء
      لونها البنفسجي الذي نراه في المعصم مجرد إحساس بصري؛ فالدَّم الموجود داخل هذه الأوعية ليس بلونه بنفسجياً وإنما أحمر غامق جداً
      The varicose veins occur due to failure of these valves.
  body.wrist:
    label: الكاحل
    summary: فصل يتصل بين الذراع والساق؛ مهم للتحكم الحركي.
    info: الكاحل هو المنطقة التي تربط اليد بالذراع السفلي وتتكون من ثماني عظام صغيرة (عظام الكارب). يسمح بحركة اليدين في أربع اتجاهات والدوران، كما أن نفق العضد الضيق يمكن أن يؤدي إلى متلازمة النفق عند الإجهاد الزائد. ويمكن ملاحظة ضربات القلب بسهولة على الجانب الداخلي للكاحل.
