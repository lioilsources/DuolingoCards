lang: ru
pivot: false
title: Части тела
cards:
  body.ankle:
    label: лодыжка
    summary: Соединение ноги со ступнёй; самый часто повреждаемый сустав.
    info: Лодыжка - это сустав между голенью и стопой, состоящий из трех костей. Он позволяет двигать ступней вверх и вниз а также выполнять небольшие боковые движения. Перелом лодыжки является наиболее распространенной спортивной травмой.
  body.arm:
    label: рука
    summary: Верхняя конечность от шеи до запястья.
    info: 'Рука - это верхняя конечность из трех сегментов: плеча, предплечья и руки. Она содержит более тридцати мышц, костей и связок для обеспечения движения.'
  body.back:
    label: спину
    summary: Задняя часть тела выше пояса.
    info: Спина - это задняя часть туловища от шеи до бедер и содержит позвоночник из тридцати трёх позвонков с мышцами спины вокруг него. Болезни спины являются одной из самых распространённых причин потери трудоспособности.
  body.belly_button:
    label: пуп
    summary: Рубцовая ткань на животе после перерезания пуповины.
    info: Пупок - это рубец в месте прикрепления пуповины, через которую плод получал питательные вещества от матери.
  body.bone:
    label: кость
    summary: Твёрдый вид соединительной ткани образующий скелет
    info: Кость - это твердая ткань из костных клеток и минеральных солей (кальций, фосфор). У взрослого человека скелет состоит из 206 костей; у ребенка их более трехсот (многие со временем спаиваются вместе). Красный мозг производит красные кровяные тельца, белые кровяные телецкии тромбоциты.
  body.brain:
    label: мозг
    summary: Центр управления телом; самая сложная биологическая структура во Вселенной.
    info: |-
      Человеческий мозг весит около 1,4 килограмма и содержит более 86 миллиардов нейронов
      Он разделен на две полушария; левое управляется правой стороне тела и наоборот,
      он потребляет до 20% энергии всего организма при том что составляет лишь 2 процента массы тела.
  body.calf:
    label: голень
    summary: Задний участок нижней части бедра ниже колена
    info: |-
      Голень - это задняя мышечная часть нижней ноги между коленом и лодыжкой
      Основной мышца голени обеспечивает возможность стоять на цепочках и отскакивать при прыжке
      Голень играет ключевую роль в обратном кровотоке из нижних конечностей к сердцу
  body.cheek:
    label: лице
    summary: Жирная зона по сторонам от лица выражающая через румянец чувства
    info: |-
      Лицо - это область на боках лица содержащая щечную кость и жировые подушечки
      Румянец в лице является автоматической физиологической реакцией на эмоции такие как стыд или возбужденность
      У младенцев лицо намеренно маленькое и толстое что представляет собой адаптацию вызывающую родительскую привязанность
  body.chest:
    label: грудина
    summary: Передняя часть туловища содержащая сердце и лёгкие
    info: |-
      Грудная клетка - передняя часть туловища ограниченная ребрами, грудиной и позвоночником
      Она защищает жизненно важные органы сердце и легкие
      Коробчатая форма образуется из двенадцати пар рёберных костей связок мышечной ткани
  body.chin:
    label: подбородок
    summary: Нижняя часть лица ниже нижнего рта.
    info: Подбородок - это самая нижняя часть лица, образованная нижней челюстью у людей и некоторых животных. У человека выраженный подбородок является уникальной чертой в царстве животных, которую не имеют другие приматы. Почему мы имеем подбородки до сих пор остается предметом научного спора.
  body.ear:
    label: ушко
    summary: Орган слуха на стороне головы.
    info: Ухо ловит звуковые волны и передает их как нервные сигналы мозгу. Оно также содержит орган равновесия (вестибулярная система).
  body.elbow:
    label: локтевой
    summary: Сустав для скручивания ручки; название происходит от слова «лук».
    info: Локоть - это сустав на внешней стороне соединения предплечья и плеча. Он позволяет изгибать руку в ладонной части тела или разгибаться полностью, а также поворачивать переднюю часть рукой вокруг оси своей длины.
  body.eye:
    label: глаз
    summary: Орган зрения с цветной радужкой.
    info: Человеческий глаз различает около 10 миллионов оттенков цвета. Сетчатка содержит палочки (для видения в сумерках) и колбочки (для цветного зрения).
  body.eyebrow:
    label: брёвна
    summary: Полоски волос над каждым глазом важны для передачи информации через лицо.
    info: Брови – это полоска волос над верхним веком глаза. Они играют ключевую роль в невербальной коммуникации и позволяют выражать широкий спектр эмоций с помощью движений бровей.
  body.eyelash:
    label: ресница
    summary: Стройка закруглённых волосянок у кромки века для защиты глаз.
    info: Ресницы – это короткие изогнутые волоски на краях век. Они защищают глаза от пыли, пота и посторонних предметов. У взрослого человека их количество составляет около ста до полутораста штук сверху и примерно пятьдесят до семидесяти снизу.
  body.finger:
    label: пятак
    summary: Один из пять пальцем на одной руке каждый из которых имеет три части
    info: |-
      Палец руки - один из пяти пальцев на каждой руке человека и обычно имеет три фаланги или сегмента за исключением большого пальца который состоит всего лишь двух частей
      Человек всегда обладает десятью различными типами движений рук которые позволяют ему управляться инструментом играть музыку и даже печатать тексты
      Отпечаток пальца уникален для каждого отдельного человека так как он содержит особую структуру кожи которая не повторяется ни в ком другом
  body.foot:
    label: нога (ступня)
    summary: Нижняя часть ноги, на которой мы стоим и ходим.
    info: Ступня несёт вес всего тела и позволяет двуногому передвижению. У неё 26 костей, 33 сустава и более 100 мышц, связок и腱ов.
  body.forehead:
    label: лоб
    summary: Передняя часть головы выше бровей.
    info: Лоб - это передняя часть черепа над бровями и под линией волосости. Это одна из самых заметных зон при выражении эмоций; морщины на лице могут показать беспокойство или концентрацию внимания.
  body.hair:
    label: волосы
    summary: Нити, растущие из кожи головы
    info: |-
      Волосы – это волокна из кератина растущие из фолликулов на голове
      У человека обычно около ста тысяч волосков на голове; ежедневно выпадает от пятидесяти до сотни штук
      Он вырастает примерно один с четвертью см за месяц
  body.hand:
    label: рука
    summary: Часть руки заканчивается пятью пальцами.
    info: Людская рука - это исключительно гибкий инструмент с большим пальцем, способным к противопоставлению. Это позволяет выполнять тонкую моторику, такую как письмо, рисование или шитье.
  body.head:
    label: голова
    summary: Верхняя часть тела с мозгом и органами чувств.
    info: Голова содержит мозг, глаза, уши, нос и рот. Мозг в голове является центральным органом управления всем телом и обрабатывает все ощущения от органов чувств.
  body.heart:
    label: сердце
    summary: Мышца, перекачивающая кровь по всему телу непрерывно.
    info: Сердце – это полый мышечный орган размером с кулак, который бьётся в среднем 70 раз в минуту. За всю жизнь оно прокачивает кровь на расстояние, соответствующее трём окружностям Земли.
  body.heel:
    label: пята
    summary: Задняя часть ноги подошвы; опора всего веса тела во время движения.
    info: Пясть - это самая большая кость стопы и при ходьбе несёт основную массу тела. Пятка соединена с ахилловым腱ом.
  body.hip:
    label: бедра
    summary: Область около тазового скелета; наибольший нагрузочный сустав.
    info: Бедро – это область вокруг тазобедренного сустава (articularis coxaе), соединяющего бёдровую кость и тазовую. Это шаровой опорный сустав для веса тела при ходьбе. У женщин в среднем более широкий таз по сравнению с мужчинами из-за родов.
  body.jaw:
    label: челюсть
    summary: Нижняя косточка лица движется во время пережёвывания пищи.
    info: Челюсть - это единственная подвижная кость черепа; она позволяет жевать и говорить. TMЖ является одним из самых сложных суставов тела.
  body.kidney:
    label: почка
    summary: Органы для очистки крови и производства мочи.
    info: Почки - это парный орган бобовидной формы, расположенный в задней части живота и отвечающий за фильтрацию крови и выработку мочи.
  body.knee:
    label: колено
    summary: Самый крупный сустав соединяющий бедро и голень.
    info: Коленный сустав - это самый большой и один из самых сложных в теле человека; он состоит из бедренной кости, менисков, перекрёстных связок и боковых связок. Он приспособлен для поддержания веса тела при ходьбе или пробежке.
  body.leg:
    label: нога
    summary: Долняя конечность от колена до лодыжки.
    info: Нога состоит из бедра, голени и стопы. Она адаптирована к двуножной ходьбе и содержит самые сильные мышцы тела - четырехглавую мышцу ноги.
  body.lip:
    label: губа
    summary: Одна из двух мясистых краев устья.
    info: Губа - это одна из двух мягких мышечных тканей, ограничивающих рот. Они богаты нервными окончаниями и очень чувствительны.
  body.liver:
    label: печень
    summary: Самый крупный внутрьенный орган организма
    info: Печень - самый большой внутренний орган весом более чем в полкило грамма и выполняет около пяти сотен функций таких как фильтрация крови производство желчи синтез белков хранение гликогена Она единственный орган способный к регенерации из оставшейся ткани Большое количество алкоголя или ядов может вызвать цирроз
  body.lung:
    label: лёгкое
    summary: Парный орган грудного отдела тела для получения кислорода.
    info: Лёгкие - это парной орган в груди и состоят из миллионов воздушных мешков (альвеол). Общая площадь поверхности альвеол составляет около 70 квадратных метров. Взрослый человек дышит от 12 до 20 раз за минуту; при каждом вздохе он получает примерно пол литра воздуха.
  body.mouth:
    label: рот
    summary: Отверстие на лице для еды, питья и речи.
    info: Рот начинает пищеварительный процесс — зубы пережёвывают пищу, а слюна расщепляет её. Он также является основным инструментом речи и общения.
  body.muscle:
    label: мышца
    summary: Ткани позволяющие двигаться
    info: |-
      Мышца - это ткань способная к сокращению и обеспечивающая движение тела
      У человека более чем шестьсот мышц составляющих около百分之四十 массы тела
      Самая мощная мышца – жевательная; самая маленькая находится в среднем ухе
  body.nail:
    label: ногти
    summary: Твердые кутикулярные плиты в виде покрытия на каждом пальце ручек и ножек.
    info: Ноготь - это твёрдая пластинка из кератина на конце каждого пальца или ногтя. Он защищает чувствительные кончики пальцев и улучшает хватание мелких предметов.
  body.neck:
    label: шея
    summary: Часть тела соединяет голову с туловищем; содержит жизненно важные сосуды.
    info: 'Шея - это область между черепом и грудью, содержащая семь шейных позвонков. Через неё проходят жизненно важные структуры: артерии, пищевод, трахею и спинной мозг. Она содержит ряд мышц, позволяющих поворачивать голову.'
  body.nose:
    label: нос
    summary: Орган обоняния и дыхания посередине лица.
    info: Нос фильтрует, подогревает и увлажняет вдыхаемый воздух. Он различает более одного триллиона различных запахов и тесно связан с памятью и эмоциями.
  body.palm:
    label: ладонь
    summary: Внутренняя поверхность руки; область самых густых тактильных рефлексоров.
    info: Пясть - это внутренняя часть руки между пальцами и запястью. Она содержит очень плотную сеть осязательных рецепторов (тела Мейсснера). На ладони нет волосяных фолликулов или потовых желез.
  body.shoulder:
    label: плечо
    summary: Сустав объединяющий руку с туловищем обладающим максимальным объемом движения
    info: Плечевой сустав имеет наибольший диапазон движений из всех телесных сочленений и представляет собой шаровидный тип костного стыка между головкой плечевой кости и ямочком лопатки; его нестабильность делает предрасположенным к вывихам.
  body.skin:
    label: кожа
    summary: Самый крупный орган организма; защитная роль, регулировка температуры и тактильное восприятие.
    info: Кожа – это самый большой орган человеческого тела и покрывает площадь около 2 м². Она выполняет функции защиты от инфекции, ультрафиолетового излучения, терморегуляцию, осязание и синтез витамина Д.
  body.spine:
    label: позвоночный
    summary: Столбик из тридцати трех позвонков, поддерживающий тело и защищая спинной мозг.
    info: Позвоночник - это столб из 33 позвонков соединяющих череп с крестцем и защищающий спинной мозг от повреждений. Он служит основой опоры тела в вертикальном положении.
  body.stomach:
    label: живот
    summary: Передняя часть туловия ниже грудины или же название самого желуика на бытовом уровне речи.
    info: '{"hint":"животная полость","info":"Живот - это передняя часть туловища между грудью и тазом\rОн содержит пищеварительные органы такие как желудок кишечник печень поджеллодочная железа селезенка \"Брюшной пресс стабилизирует позвоночник и защищает внутренние органы Желудок является мышечным органом системы пищеварения ", "label": "живот", "summary": "Передняя часть туловия ниже грудины также может обозначать сам желудок в разговорном языке."}'
  body.temple:
    label: темя
    summary: Мягкий участок по сторонам лба выше щеки.
    info: Теменная область находится на боках головы над скулой и перед ушами. Это анатомически более мягкая часть черепа (шиловидная доля теменной кости), которая подвержена травмам при ударах.
  body.thigh:
    label: бедро
    summary: Часть ноги от крестца до колена; крупная группа мышц.
    info: 'Бедро – это часть нижней конечности между тазобедренным и коленным суставами. Оно содержит самую мощную группу мышц в теле: четырехглавая мышца бедра (квадрицепс), а также подколенные сухожилия.'
  body.throat:
    label: горлóо
    summary: Полость соединяющая рот с глоткой и дыхательными путями
    info: |-
      Горло - это полость за носом и ртом служащая как путь для воздуха и пищи
      Оно содержит миндалины в качестве части иммунной системы
      Рефлекс горла предотвращает попадание чужеродных тел
  body.thumb:
    label: большой палец
    summary: Короткое мощное ребро на руке; возможность опозиционного движения большого пальца важна при захватывании.
    info: Большой палец – это короткий и толстый первый палец руки способный к противопоставлению другим пальцам. Противоположное движение большого пальца является ключевой адаптацией для человеческой манипуляции с инструментами. Оно развилось в процессе эволюции и присутствует только у приматов.
  body.toe:
    label: палец ноги
    summary: Один из пяти пальцев на ноге; большой палец выносит нагрузку во время движения.
    info: Палец ноги - это один из пяти пальцев на стопе человека. Большой палец играет важную роль в поддержании равновесия и отталкивания при ходьбе, так как он несёт наибольшую часть веса тела.
  body.tongue:
    label: язык
    summary: Мышечный орган во рту для ощущения вкуса жевания и говорения
    info: Язык - мышечный орган покрытый вкусовыми сосочками более чем в количестве десяти тысяч штук обеспечивает восприятие пяти основных видов вкуса сладкого соленого кислого горького и умами является ключевым для артикеляции речи помогает при глотании язык это самая быстрая мускула тела работает даже во время разговора со скоростью превышающей стопуд километров на час
  body.tooth:
    label: зуб
    summary: Твердый орган в ротовой полости для пережёвывания пищи
    info: |-
      Зуб - это твёрдая структура из эмали (самой прочной ткани организма), дентина и пульпарная камера
      У человека во взрослом возрасте насчитывается тридцать два зуба
      Эмаль не восстанавливается после потери поэтому профилактика играет ключевую роль
  body.vein:
    label: венула
    summary: Кровоносный сосуд переносящий дезоксигенизированную кровь к сердцу; заметна на уровне запястия
