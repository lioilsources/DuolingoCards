lang: la
pivot: false
title: Partes corporis
cards:
  body.ear:
    label: auris
    summary: Organum sensus auditus lateralis capitis.
    info: Auris sonoras undas captat et eas ut signa nervosa cerebro transmittit. Similiter continet apparatus equilibrii (systēma vestibularium).
  body.eye:
    label: oculus
    summary: Organ sensus visus cum pupilla colorata.
    info: Oculus humanum distinguere potest approxime decem milliones umbrarum coloris. Retina bacillos continet (ad videndum nocturne) et coni (ad colores conspicuos).
  body.foot:
    label: pēs
    summary: Inferior pars cruris, qua ambulamus et stationem habemus.
    info: Pēs pondus totius corporis sustinet et possibilitatem ambulationis bicipitam dat. Habet 26 ossa, 33 artaculae et plus quam centum musculi, tendinae et ligamina.
  body.hand:
    label: manus
    summary: Partis brachii terminans cum quinque digitis.
    info: Manus humana est instrumentum exceptionáliter versátile cum pollici capax oppositionis. Permittere motricitatem finam ut scribere, pingere vel texere.
  body.head:
    label: caput
    summary: Part superior corporis ubi sunt cerebrum et sensus.
    info: Caput continet cerebrum, oculos, auriculas, nasum et os. Cerebrum in capite est centrum regens totum corpus et processat omnes impressiones sensoriales.
  body.heart:
    label: cor
    summary: Musculus incessanter pulsans sanguinem per totum corpus.
    info: Cor est musculus cavus magnitudinis palmae manus, qui bat medie 70 vicibus pro minuta. Per totam vitam sanguinem ad distantiem triplicis circumferentiae Terrae propellere poterat.
  body.mouth:
    label: ora
    summary: Aperitūra in facie ad cibum sumendum et loquendum.
    info: Ora digestīonem incipiunt – dentes cibi fractio sunt, sāliqua eorum resolvunt. Item instrumentum primum sermonis atque communicationis sunt.
  body.nose:
    label: naris
    summary: Organ olfactionis et respirationis in medio faciei.
    info: Nasus aer inspiratum filtra, caloret et humidificat. Differentiat plus unius billionis odorum distinctorum et cum memoria et affectibus strictim coniunctus est.
