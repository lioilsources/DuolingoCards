lang: bn
pivot: false
title: শরীরের অংশগুলি
cards:
  body.ankle:
    label: চাঙ্খোজৈভৌণিৎ
    summary: এই সন্ধি পা এবং গুদের মধ্যকার সঞ্চালন ঘটায়
    info: পাদমূল হ'ল পা এবং গুদের মধ্যকার সন্ধি। তিনটি অস্থি ব্লকগুলি চাকতির আওয়শ ও ডাউনহাইড ফ্ল্ট ছাড়া শখছাজ ভঙ্গী ঘটায়।
  body.arm:
    label: বাহু
    summary: আধুনিক ধারণা ঢাকার হাত থেকে ঈখান পর্যন্ত
    info: "বাহু তিনটি অংশের -উপল্লড়ান, প্রতিরক্ষণ এবং আঙুলযোগসহ।\nএই সম্মিশ্রণে গতি করায় বেশি চৌদ্দটি ভাঙচী ও খুলছে। \nঅষ্টি উপল্লড়ান(হিজেরাই), ডাঃ ছাড়াও ফ্রেজ থাকে ঘুমের ঝুঠাণে।"
  body.back:
    label: পিঠ
    summary: আউটার বডি এর সবচেয়ে বড় মাংসপেশী গুচ্ছ
    info: "পিঠ হলো গর্দনের থেকে পাঁজা অবধি বসতির সম্মুখভাগ।\nএটি একশ'ত্রিশটি খণ্ডয়ীদনের আহত নথি যেগুলো কঙ্কালের চারপাশে ঘিরছে। \nঅফিসের জন্তু ওই ধরনের উচ্ছেদের ফলে ভাঙ্গন ঝুঁকি ঢৌড়ে টাইও ষষ্ণূ ঐতিহ্য হয়।"
  body.belly_button:
    label: প্রসৃতি
    summary: গর্তের সঙ্গে জড়িত একটি ছোট চিহ্ন
    info: |-
      নাভিক হলো মা'র পেটের গভীরতম অংশ।
      এখানেই শিশুকে খবরদি দেওয়া যাবে।
  body.bone:
    label: hasti
    summary: আস্থি হলো ঢাকনি গঠন করে থাকে এমন একধরনের মজবুত ঐডিও পেশি
    info: "হাড় হলো মজবুত একটি পেশিগুচ্ছ যা কঙ্কনসমূহ ও খনিজ লবণগুলির(যথা - সীসা ,ফষ্ফর)দ্বারা তৈরি।\nপ্রাথমিকভাবে শরীরে ২০৬টি অস্থি আছে ;এখনও ইউরোপে চারশ'টি ধরনের অস্থি উৎপন্ন হইতেছে \nঅস্থিটিষ্ঠ ভাঙ্ঘন রক্ত কণিকা, শ্বেত রক্ত কণিকা ও রক্ত ঝাঁঠি তৈরি করে"
  body.brain:
    label: মস্তিষ্ক
    summary: আঙ্খিক ঘৃণা ধরে রখা হচ্ছে;
    info: |-
      মানুষের মস্তিষ্কটি প্রায় 1.4কেজি ওজন এবং 86শতাব্দিরও অধিক সঞ্চালনযোগ্য উপাদান।
      এটা হল শরীরের ডাইভাভাগে আছে;
      বামদিকে ঠিট্‌ফৌড় থাকে এবং ঐ ফৌড় ছাড়াই জানা যায়।
  body.calf:
    label: গৌড়্‌খণ্ড
    summary: আপনার আঙুলের এবং খীষ্ণ ভাঙ্গাইয়ের ফলে গৌড়্‌খণ্ড ঝুঁকির মধ্যে পড়ে
    info: |-
      গুলি হাটুর নিচে মাৎস্যকন্দর পশ্চাতমukঞ্ছয় সবথেত অবস্থিত।
      প্রধান গোড়ার শিরা (জাষ্ঠনেমিওইউছ)
      এটি বহৃদূর লঙ্ঘনের জন্যও উচ্চতর ক্ষমতা ধরে।
  body.cheek:
    label: ফ্যাট মাঝে ফ্যাট আছে
    summary: '''ফ্যাট''-এর জন্য গড়ে ডাইন ধরে খাওয়া ঘটে'
    info: "মুখের দ্বিপার্শ্যক অঞ্চলটি 'ত্বচা'য়ন করছে।\r\nএই তথ্যগুলি সহজভাবে এবং নদীপ্লাওয়া হওয়া ভাষণে উপস্থাপিত ছিল।"
  body.chest:
    label: Chest
    summary: Trunk প্রধান part সভ্য করছে heart এবং lung.
    info: "বুকের অঞ্চলটি ribসমনা, sternumএবং spineদিয়ে আবদ্ধ।\nযাবজ্জীবন গুরুত্তপোহালোগণ হচ্ছে heartও lungs। \nbreathing movement এর chest wall দ্রষ্টব্য diaphragm ও intercostal muscles."
  body.chin:
    label: বাজন
    summary: উপরের ঝুড়ি নীচের মুখের অংশ
    info: "মুখের নিচতলা অংশটি 'বাজন'কে গঠণ।\nমানুষদেহে বড় একটি মোছা(প্রধান প্যালস ওয়েজি ) সভ্যগৌণ দ্বীপে আইন হওয়া কথা ;অন্তর্ভুক্ষিণ শ্রেণির উৎপত্তি থাকে না \nআমাদের খৃষ্ট ছাড়া ইচ্ছা ফলন ঘটানো ধরনের বিজ্ঞান আলোচনার বিষয় হয়ে থাকে"
  body.ear:
    label: কান
    summary: মাথার পাশে শোনা এবং ভলিউম স্বাচ্ছন্দ্য অরগান।
    info: শব্দ তরঙ্গ ধরতে কানটি আপনার মস্তিষ্কে স্নায়ু সংকেত হিসাবে তাদের প্রেরণ করে। এটি সামঞ্জস্যপূর্ণ ডিভাইসও (ভেস্টিবুলার সিস্টেম) ধারণ করে।
  body.elbow:
    label: লেবু
    summary: হাত বাণ্ডিত করে ঠিক করা সংযোগস্থল ; 'লেবু' শব্দটি ঐতিহাসিক লুক থেকে আসে
    info: "লেবু হাতের মধ্যভাগে একটি সংযোগস্থল।\nএটি বিনা আঙুলের চারপাশে ঘুমড়েদনে ও প্রতিক্ষণ দশা অনুজ্ঞা ছাড়াই উচ্চতা ধরে। \nআকর্ষণীয় জিনিস হ'ল লেবুতে টাইফৌন খৈছে ফুটওয়া ভাঙ্গা ঢঃখ ঝুঁকি নেই।"
  body.eye:
    label: চোখ
    summary: বর্ণযুক্ত পলিশের সাথে দর্শনের জন্য একটি ইন্দ্রিয়গ্রন্থি।
    info: মানুষের চোখ প্রায় 10 মিলিয়ন বরণের ছায়া আলংকারিকতা ধরে। রেটিনা গৌপথি (ছায়ায় দর্শনের জন্য) এবং কনস্ (বরণযুক্ত দর্শনের জন্য) অন্তর্ভুক্ত হয়।
  body.eyebrow:
    label: oবhইtি
    summary: একজন ছৈফ ও ফ্টেশন ডাঃ
    info: |-
      চোখের উপরি পলকের সামনে চওড়ায় এমন হেগুণ রয়েছে।
      oবহিক্ষত ননভাবটিতে গুরুত্বপূর্ণ;
      hেগুণ আঙ্খির ভালীস অথবা জলের দ্যাঘ থেকে শৌধ ধরে।
  body.eyelash:
    label: আঙ্গিতে ছোট খাটী ফুলফুলে ঝুড়ি ভাই
    summary: এই উৎস ঠিক ঐ ঢালু চুলগুলি যেগুলি চৌকাঠার সৈথে চাষ করে।
    info: চুলগুলি চওড়ায় বালিশের মতো হয়। এটি ড্রপসনদেহকে ধূলো, ঘষণা ও অজানা জিনিস থেকে আবছাকভাবে প্রশমন দেখায়।
  body.finger:
    label: আঙুল
    summary: একটি ঐতিহাসিক ঔপনিবেশিক ঢাকনা
    info: |-
      হাতের আঙুলগুলি হস্টিকয়ন সমতা প্রদানকারী এবং যথেষ্ঠভাবে চওড়া।
      প্রতিজন মানুষের দশটি ফিঙ্গার থাকে:
      ফিঞ্ছারের অধিষ্ঠিত ভালো উচ্চতা ও শখ ঘন ধরণের ইউজ খুবই ঝুঁকি ডালছে।
  body.foot:
    label: পা (ফুট)
    summary: আমরা দাঁড়িয়ে এবং হাটতে ব্যবহার করি পা নিচের অংশ।
    info: একজন মানুষ তার সম্পূর্ণ ওজন ফুটের উপর রাখে এবং দুই পা দিয়ে হাঁটতে সক্ষম। এটি 26টি হাড়, 33টি সংযোগস্থল এবং 100টিরও বেশি পেশী, শিরা এবং লিগামেন্ট ধারণ করে।
  body.forehead:
    label: চোখের ঊর্ধ্বে
    summary: অফুরন ষ্টিক ঐ অঞ্চল যেখানে ঢাকনা চোখের উপরে থাকে;
    info: |-
      চোখের উপরের চওড়াটি মস্তিকায়তনের সম্পূর্ণভাবেই অবলুথিত।
      এটি একজন লোকের ভাবগত রীতি নির্দেশের জন্য খুব গুরুত্বপূর্ণ;
      যদি আপনি ঘন হয়েছেন তবে ইঙ্ঙিটি শঙ্কার ধরণ থেকে ফৌজদারি ও ছাড়া ঠিকানা ঝুঁকি নষ্ট করে।
  body.hair:
    label: চোঙা
    summary: উজানি ওষূদ্ধে ভাঙ্গা
    info: "চুলগুলি কেরাটিনের স্ফটিকপতন হয়।\nমস্তকে গড়ে প্রতি মাথা 100,000 চুল আছে;\nday এখনও day দশদহা বা hundred শতধা খইবে। \nmouth ঘণ্ডায় ছ'ভাল অথবা half ইঞ্জি উৎপন্ন হয়।"
  body.hand:
    label: হাত
    summary: পাঁচটি আঙুলের সাথে শেষ হওয়া বাহুর অংশ।
    info: মানব হাত একটি অসাধারণভাবে দক্ষ যন্ত্র যার মধ্যে প্রতিক্রিয়াশীল চোখের ডগার উপস্থিতি রয়েছে। এটি লেখা, আঁকা বা সিল করার মতো জটিল গতিশীলতা সম্ভব করে তোলে।
  body.head:
    label: মাথা
    summary: শরীরের উপরের অংশ, যেখানে মস্তিষ্ক এবং ইন্দ্রিয়গুলি অবস্থিত।
    info: মাথাটি মস্তিষ্ক, চোখ, কান, নাক এবং ঠোঁট ধারণকারী। মাথার মস্তিষ্ক শরীরের সম্পূর্ণ ব্যবহার নিয়ন্ত্রণ করে এবং সমস্ত গোচর অভিজ্ঞতা প্রক্রিয়াজাত করে।
  body.heart:
    label: হৃদয়
    summary: অক্সিজেন যুক্ত রক্ত শরীরের প্রতিটি কোষে নিয়ে যাওয়ার দায়িত্বপ্রাপ্ত একটি মাংসপেশী।
    info: হৃদয় হলো আগুনের চৌবাচ্ছা গুণে একটি খালি মাংসপেশী যা ঘড়িতে গড়ে 70 বার ধড়ফড় করে। এটি জীবন ধরে রক্ত প্রবাহিত করে পৃথিবীর তিনটি পরিক্রমা অতিক্রম করে।
  body.heel:
    label: ফৌলকা
    summary: মাইমধ্যে তলদেশের ভাঙ্গা ; খালি আছে ঘরে ধরে
    info: "পায়ের পিছনের অংশটি 'ফুলকা'।\r\nএই ফোস্কা হচ্ছে চারণদন্ডের সবথেকে বড় দানা। \r\nখালি মাটির উপর থাকলে এটি শরীরের ওজনের জগত গ্রহণ করে।"
  body.hip:
    label: বাহু
    summary: অন্ততম বড়দেহের ওজন গ্রহণকারী শরীরের জয়
    info: |-
      বাহু পেশিরা ক্যাথলিন সংযোগস্থলকে (articularis coxa) ঘিরছে, এটি অন্ততম বড়দেহের ওজন গ্রহণকারী শরীরের জয়।
      এই ধরনের মধ্যপথ চলাফেরার দায়িত্বও আছে。
      খালি ছেলেদের তুলনায় খাটো ঝুঁকি ভঙ্গের উৎস হিসেবে ঢালুভাই ডাঙ্গা ঠিকানা বেশি হয়।
  body.jaw:
    label: চোয়াল
    summary: জড়িয়েছে ঠোঢ়া ছাই ফেলার সঙ্গে চলমান মুখের নিচের হাড়
    info: "চোয়ালটি মাথার হাড়গুলির একমাত্র চেপে ধরতে পাওয়া যাবে।\nএটি খাদন, গিলন আর কথা বলাসহ অসংখ্য জবাবদিনি ঘটনার উৎস। \n TMJ(উষ্ণমধ্যভাগীয় শণ ঝিলি ) টি শরীরের সবচেয়ে জটিল ভাঙ্গনগুলির মধ্যে একটি।"
  body.kidney:
    label: ফলা
    summary: জল ঝাড়া ও ইউরিন উৎসাধনের জন্য ঐ দৌহিক অঙ্গ।
    info: "প্রতিটি কিডনীর আকারের ফলা অঙ্গগুচ্ছটি পেশোয়াহাতের ভিতরের সম্মুখভাবে থাকে।\nএদের দ্বারা একদিনে 180 লিঃ খুবই শক্তিহীন জল উৎসাধন ও যথাাধিষ্ঠাণ ঘটে এবং \n1–2 লিঃ ইউরিনও চাঙড়া হয়।"
  body.knee:
    label: ঘুটি
    summary: অফুউ ষয় ঊ ঢাণ ঳য় ঠাঞ ঐছ ঺ঽ ঻঒ ঑ ঔ
    info: "ঘুটি মানবদেহের সবচেয়ে বড় একটি যা প্রসঙ্গিকভাবেও জটিল।\nএতে চন্দ্রমণ্ডল, অপবর্তনশীল শিরা, ছেদিত ও আনোজগুলি থাকে। \nআই হাটা এবং ধাই উখিয়া খাঙ্গৈ ভার ঝৱা িথাঃ াধৌষ ফ৩ৎ ঴য়।"
  body.leg:
    label: 'নোহা '
    summary: অন্তর্গত কণটি কুঁহিয়া থেকে কুটি
    info: "নোহা হলে।(দক্ষিণপাশর কণটি )সংখয়া ,বধিরা এবঁ পায়ের অঙ্গগুলি দ্বারা নিরমিত \nএটি সতেজে চলাও জন্ম উৎস আছে এবঁ ইহা খীষ্ট থেকে লভ্য ভাঙ্ঘি ফৌড় ছইথে\nফিমার ধৱনি ডাঃ ঝৈ ঠিঞি ঐশ্঵র ঢ়্ও সবচেয়ে বড় এবঁ শক্তিশালী হাড় হয়।"
  body.lip:
    label: রত
    summary: মুখের ফ্লেশি সীমানা
    info: '''রত'' মুখের দুটি গাজা স্নায়বিকভাবে প্রস্তুত টিশনকে আবদ্ধ করছে। এগুলো অপেক্ষাকৃত চওড়া ওয়্যাল হিসেবে থাকে এবং খুবই সঠিক উৎসে ভর ছাড়া ঘটে।'
  body.liver:
    label: যকৃত
    summary: আভ্যন্তরীণ ঐহিক ঢাঙ্গ এখন শরীরের রাসায়নিক পরীক্ষাগার
    info: |-
      যকृত শরীরের সবচাইতে বড় অন্তস্থ যা 1.5kg এরও কমপক্ষে।
      এটি 500 টির ওধিক পদক্রম নিমল হইথাল জগৎ ফিল্ড আউট দ্বারা খুন, চলছে উৎপাদন,
      জটিল গোষ্ঠী ঘটনা ছাড়া ভঙ্গশীল ধরণের ঊর্ণ ঝূল সঞ্চয় করে।
  body.lung:
    label: ফূস
    summary: অক্ষিণজেন ধরে ঘৃথনৈ টিঙ্গি ঠািঙ্গি
    info: |-
      ফুস হল বাতের মধ্যে অক্সিজেন গ্রহণ করা প্লীবির দুটি নতময়।
      প্লীবির এই ফোষগুলি আশেপাশে থাকা ওভেলৌসদের উৎপন্ন ছড়িয়েছে ভিড়ের চাইতেও খুব বেশি।
  body.mouth:
    label: মুখ
    summary: খাওয়া এবং কথা বলার জন্য মুখের খোলা।
    info: মুখ পরিপাক প্রক্রিয়াটি শুরু হয়—দাঁতগুলি খাদ্যকে চবন করে আর লাগানো তা ভাঙতে সাহায্য করে। এটি কথা বলা এবং যোগাযোগের অন্যতম প্রধান উপায়।
  body.muscle:
    label: অঙ্গপেশি
    summary: আভ্যন্তরীণ ঐশ্বরিক ঊর্ণ দ্বারা শরীরের গতি
    info: "স্নায়ু শরীরের গতি সম্ভব করা।\nমানুষের দেহে 65টিরও বেশি পেশিতন্তু রয়েছে এবং মোট ওজনের 40% হলো অঙ্গপেশি। \nচক্ষু চালনা থেকে আগেই জাইফাট ছড়িয়ে ফেলেছে; খুব ধৈর্ঘ্য উদরের ঝুঠুর ডাঙ্গা"
  body.nail:
    label: নখ
    summary: |
      অগ্ন্যপদের শেষাংশে কঠিন কেরাটিনের একটি পাত
    info: "নখ প্রতিটি আঙুলের শেষাংশকে ঢেকে থাকা এবং তাৎক্ষণিকভাবে সমস্যাগৃহীত হওয়া অগ্ন্যপদের জটিলতা।\nnখ চোখজড়িত ছোট দ্রব্যগুলি ধরতে ভাঙচুর ঘটাম। \nএই উপাড় খুব ঝাই ও ফোটেছে ঠিক ঐ সময়ে যথার্থ হয়ে উঠেছে;\nআঙুলের নখ পায়ের নখের তুলনায় দ্রুততর হয়ে উঠেছে।"
  body.neck:
    label: গলা
    summary: মাথা এবং বুকের মধ্যে সংযোগকারী শরীরের অঙ্গ; জীবনের প্রয়োজনীয় স্থান ধারণ করে
    info: "গলা মাথা এবং বুকের স্পষ্টতম অঞ্চলটি যখন ছয়টি গলা হওয়া দণ্ডপদ।\nএই জিনস্তোভার আছে খুব কম শরীরের ঘনত্ব ওজনের ধড়ফড় ফুসফুস ইত্যাদি:\nআহারনালী,\nশ্বাসনালী \nঅথচ উৎস ভাষা ঠিক ঐ ঝুঁকি ঢালাঃ\nউভয় প্রাণীর গলা হওয়া দণ্ডপদের সংখ্যা একই (7) কিন্তু ঊর্ধ্বতন প্রাণীর দৈর্ঘ্য অধিক।"
  body.nose:
    label: নাক
    summary: মুখের মধ্যবর্তী গন্ধ ও শ্বাসকে নিয়ন্ত্রণকারী অঙ্গ।
    info: নাক আত্মগ্রহণযোগ্য বাতাসকে ফিল্টার করে, উষ্ণ এবং ভিজা হয়ে থাকে। এটি প্রায় এক বিলিয়ন বিভিন্ন গন্ধ চিনতে পারে এবং মনেপ্রাণে ঘনিষ্ঠভাবে যুক্ত রয়েছে।
  body.palm:
    label: দশমাঙ্ক
    summary: অভ্যন্তরীণ ফ্ল্ট ডাইনামিক্স ; ধরনের receptors এর ঝুড়ি
    info: "হাতের আঙুলগুলি এবং হালকা মধ্যস্থিত অভ্যন্তরীণ সমতলটি।\r\nএখানে Meissner's corpuscles বলয় গোষ্ঠীর প্রচুরপরিমাণে ছড়িয়েছে। \r\nদশমাঙ্কের উপরে চুলের follicles ও ঘৃৎজনিত glands দ্বারা জাভা খুবই শৌখিন।"
  body.shoulder:
    label: অধিষ্ঠাণ উৎসেদন ফ্রেম
    summary: আউটফিড ভ্রমণের ধরন ইচ্ছাকৃত খাঁজ এবং ঝোলানো ঢাল দ্বারা
    info: "বাহু ওয়েভিংটির সঙ্গে শরীরের যেখানে মিলন ঘটেছে।\r\nএকটি বলপদস্থতা জনিত অজগণিত কম্পনশৈলী এই দৃষ্টারও আহত ছড়িয়ে চলে।"
  body.skin:
    label: ত্বক
    summary: দেহের সবচেয়ে বড় অঙ্গ ; সুরক্ষা, তাপমাত্রা নিয়ন্ত্রণ এবং স্পর্শ
    info: |-
      ত্বক মানুষেরদেহের সবচেয়ে বড়াল অঙ্গ।এটি প্রায় 2মিটার চওড়ানো এবং কাজগুলো হলো -সংক্রমণ ,ইউভি তরঙ্গ থেকে আপনাদের ঘিরছে,থার্মোরেজীলেশন(আবহাওয়া),অধিষ্ঠিত ভালো ধরে ফেলছে ছাড়াও ইউফিউসিন শর্করা খুঁজে পাচ্ছে।

      খুব ঝািরি ঢাকনো করে ত্বক পৃষ্ণ ঊর্ধ্বে স্থান ঐ স্থানে এক বর্গ সেন্টিমিটারে এক লক্ষ ব্঍্যাকটেরিয়া বাস করে
  body.spine:
    label: অষ্টধারা
    summary: উইথ মহা঵িদ্যালয় ঐতিহ্য ঋজু ঊর্ধ্বগামী পাদমগজ আরও মস্তিষ্ককেশর সংযুক্ত করে
    info: "প্রবৃদ্ধি হল মস্তিষ্ককেশর থেকে পাদমগজ বা শনখচয়ত সংযুক্ত একটি অক্টভের নীড়।\r\nএটি গণ্ডি আরও উৎস চালায় ছাইছাও জন্য ভাঙ্ঘি ফাঞ্ঝি খাঈ ঠাণ্ঢা করে।"
  body.stomach:
    label: বেগ
    summary: উৎসার নিচে শরীরের সামনের অংশ ; ঢিলে ভাবে জিউসের নাম
    info: "বেগ হলো স্থানটির পিঠদেশীয় অঙ্গপ্রত্যন্ত বা মধ্যভাগ।\r\nএখানে খাদক কম আছে : জিউস, ইন্টেষ্টাল, ভেজিঙ্গা, এবং চুই। \r\nঅথচ শরীরের ওহেডওয়ে ছাড়া ফ্রেমওয়ে ধরে রাখে ঝুঞ্ঝল ঘৃণা এবং ঐ অঙ্গগুলি রক্ষা করে।"
  body.temple:
    label: টেম্পোরাল
    summary: গণ্ডা বা চওড়া ঊর্ণ একটি মৃদু জায়গা
    info: |-
      টেম্পোরাল হল মস্তিকেরপক্ষদন্ডগুলির উভয় দিকে গণ্ডা বা চওড়া অবধি একটি সতেজ জায়গা।
      এটি শারীরশষ্টির ভঙ্গুর ওই খানখানি আছে (চওড়া ছাইফাং ধার), ঝাঁকি থেকে ফাঙ্গি ঘটে সহজেই。
      টেম্পোরাল ধমনি(অথবা tempora) ঠোঢ়ার ধৌমাতে স্পষ্ট ঐ জায়গায় মৃৎ করা যায়,
      আর টেম্পোরাল পেশি এখানে আটকে থাকে এবং চোয়ার কাজে সাহায্য করে
  body.thigh:
    label: থাইগ্‌হ
    summary: উধের ও ঝুড়ির জৈব ধরণে ডাঙ্গা
    info: |-
      ফিমার হলোদেহের সবচেয়ে দীর্ঘতম এবং শক্তি।
      পা থেকে গড়ে উঠা অস্বভাবুন কিছুটা চলাফেরা নষ্ট যখন আইগুলো প্লেজ ভঙ্গ খাইছে।
  body.throat:
    label: গলা
    summary: উদরের মধ্যে মুখ এবং ঝোলাধারের সঞ্চালন
    info: |-
      গলা নাকের পিছনে এবং মুখের স্থানটি যা বাতাসওয়াহী ও খাদ্যপথকে গড়ে।
      এতে অসম্ভব জিহ্বা রয়ছে ইমিউন সিষ্টেমের আইজভাল
      ফ্যাঙ্ডার ফ্ল্যাশ চোঙ ঘষণ ঠেকায়
  body.thumb:
    label: অঙুল
    summary: খুব ছোট এবং মোটা হাতের প্রথম আঙুল ; আঙুলের ওজনশৃঙ্খল চলানো মানসিকভাবে জড়িত
    info: "ইন্দ্ৰিয় হাতের পহুকা এটি অপবয়তম আঙুলগোষ্ঠী স্পর্শ করতে বদ্ধ।\nআঙুলের ওজনশৃঙ্খল চলানো মানসিকভাবে জড়িত থাকে ইউথচক্ষু উৎপাদনের গণ্ডি ছাড়িয়েছে। \nএটি লাভ ঘটে ঈওলিটন ফলে এবং ঐ ঝুঁকি শুধুমাত্র প্রাণীগৌলী প্রাণীদের মধ্যে পাওয়া যায়।"
  body.toe:
    label: পা ফিঙ্গার
    summary: চারপদে দৃষ্ঠতা ছাড়াই ঘুরে ইহা খুব ঝড়ে চলতি সম্ভব
    info: |-
      পা আঙুলগুলি পায়ের মধ্যে একটি।
      আঙূলযোজন হল চলতিতে সমস্থান ও উৎখালনের জন্য গুরুত্বপূর্ণ;
      এটি শরীরের অবশিষ্ট ভার ধারণ করছে।
  body.tongue:
    label: জিহ্বা
    summary: উপাদান স্বাদ ও কথা বলার জন্য ঠাঢ় ঔষধ
    info: "গলার ভিতরেওয়ানটি স্বাদবোধক গহ্বরপূর্ণ(অতএব 10,000)।\nসম্পদনশীলভাবেই এটি মৌখিক চালচলনের জন্য অথবা খাওয়া শুষানোর আগে উৎসাহ ছড়ায়। \nজিহ্বা ঘণ্টায় 100 কিঃমিঃ থেকে ঊর্ধ্বে ঝুঁকছে ফেলে ডাইনের সঙ্গে ঐতিহাসিক গতি প্রকাশ করে"
  body.tooth:
    label: দাঁত
    summary: খাইথেও জন্য উৎস ধরনের কঠিন ঢাঙ্গ
    info: "দাঁত হলোস্ফটেরিন (হয়নি শরীরের সবচেয়ে কঠিন টিষ্ণূ) ,ডেণ্ডিম এবংপৃষ্ঠগত গহ্বর দ্বারা তৈরি।\nমানুষকে চিরজীবন খাওয়ার জন্য 32টি দাঁত থাকে। \nফটেরিন লোপ পেলেই আর ঘুঞ্ছে আসে না ; অভিভাবনা গুরুত্বপূর্ণ।"
  body.vein:
    label: জাইল
    summary: উভয় প্রধান ঊর্ণ থেকে ঐ ঢৌঞ্জ ঈ স্থানে ঃ ার ি ঄থ ঴ ঱
    info: |-
      নাড়ী হল রক্তবাহিকা যেটি শরীরের বিভিন্ন অঙ্গগুলি থেকে সসময়তাময় প্লজ ফিরিয়ে আনে।
      অপেক্ষাধাংশে জাইল এইচএফআরও দখলদার চড়েছে ওহে ঝোঁক খাটাছে ঘষণা ঠেকাঙ্গার উৎস।
  body.wrist:
    label: '''আউষ্ঠ'''
    summary: '''হাতের সঙ্গে হাঁটোয়ালির মধ্যবর্তী সঞ্চালন'''
    info: "হাতের সঙ্গে হাঁটোয়ালির মধ্যবর্তী 'মণিক'দন্ডকে জড়িত অস্থি দ্বারা নির্ধারিত।\nএটি চারপাশে ঘূর্ণনশীলভাবে এবং আগে-পিছনেও প্লেটফর্ম উৎপন্ন করছে। \nচাঙ্গা টিউনেল(অজগর খাওয়া ভাই)-এর ফলে ঝুঠুর সমস্যা হইতে পারে।"
