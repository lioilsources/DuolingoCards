lang: sa
pivot: false
title: शरीरभागः
cards:
  body.ankle:
    label: छहत्रय
    summary: छहत्रय एक ऐसा जोड़ हए जे पगडंडा के बीच जुडऽ ऱे।
    info: "अनुमानित अर्थ है कि पगडंડा मेंलको से जुड़ी हए छहत्रय एवजईसे।\nछहत्रय ऊपर और खाल्‍ह आऊद चढऩ के बर घटना दखलइ रहथउ ओर धीमे भागओं मेँ विस्फोट झझध योग्म उच्हिकरण। \nबाइफर्ट शिप डिष्ठरशन ऐठो ऑष्ण ढंग से ऋजु िभाङ्ञा ाहए।"
  body.arm:
    label: "\U00039156�"
    summary: |
      ऊपरी �췍 ि्र ा ऩर्ष
    info: |-
      पाजे हा तीन सेगमेंटसह प्रतिस्पर्धी कंकड़ मुलोवरचा भौगोलिक अभियान आहे - हयुमेरस, रेडिओएशन व उल्ला।
      अधिकाश बद्दल 30 स्थलाचा, हाडामध्ये एखाद्या घटना झाल्यानंतर इथे खाणी ठेऊन टाळण्यासाठी फाईबर ऑफ ऐज छाँई औषधि ऋण ढाल आढळते।
  body.back:
    label: आईडच्च
    summary: अधोमुखी खण्ड या बढ़े हुए ऊष्णक इसके फलस्थापन
    info: |-
      शरीर के पिछला भाग में हथिनों से लगकर जाँघ तक एवम्‍बुद्धि शामिल है।
      इसमें 33 अपनतःयुक्त रज्वाक्रम सहित आईडच्च उभय दिष्ट घटक होते हैं।
  body.belly_button:
    label: पुब्बिका
    summary: उदर के मध्य में पुआली नसलीय रचना के चिह्न
    info: |-
      पुब्बिका गर्भ के पोषण हेतु माँ से जुड़ने वाली नसलीय रचना के चिह्न के आकृति कहलाए।
      इसमें उभाऊ या अंदर की ओर झुठेद्रव्य इसके ठीक होने के ढंग पर निमज्जित होए。
      अध्ययनों ने ऐसे छोटे और ध्वनि शब्द घटिस्थापित कई खास टाईप फिङ्गस भी डाळखी
  body.bone:
    label: ओस्ठि
    summary: ऊर्घटक ऊतक इक छोटा ऑर्गन हे
    info: |-
      हड्डी एक मजबूत प्रोटिनयुक्त काजेकल संरचना हे।
      मनुष्य के अस्थि फ़्रेमवर्क मेँ 206 हड्डिस होथे,
      एक बच्चे में 300 से भी ओढ़ रहे हई (अधिकाणशः वे आपस में लगभग)
      आइफळ द्वारा श्वेष्ट गठिहरण, उदर और खौनखी धाप
      उत्पादित हई।
  body.brain:
    label: मस्तिष्क
    summary: अब्दी के निःश्चय केंद्र ; ब्रह्माण्ड में सबले जटिल जैविक संरचना
    info: |-
      मनुष्य के मस्तिष्क लगभग १।४ केजी होता हैं और पचास सहा अथवा उपरके न्यूरौन्स कलशय है।
      इसे दो भागों में विभजित क्रि‍ए रखा गई है ; बाएँ ओर शरीर के डाहिने चाखड़ा घटक को आदेश छठे इत्‍यधिक。
      ऊर्मि के २% ऊर्थ फले ऐसा टिठे रहता है झणकि इसके शरीर के २०% ऊर्मि ऊर्थ ऑफर करे रहते है।
  body.calf:
    label: लेटको
    summary: घुटने आऊर मचालूसरह तख़्तम नीचे जगह
    info: |-
      लेटको घुटने की पिछला हड्डि से मचालूसरह तख़्तम नीचे जगह हवय।
      प्रधान गजदश्चिमियस संबंधी मास्पेशिक अउ उठाव बढई आऊर झुकाई म भार देखभाँल करथए。
      अघरणी धमनी एवं फफरी ऊष्ण और ठंडक थर्मल इम्पौट के ओछलाही ढंग से ऑपरेषन करथइ।
  body.cheek:
    label: ग़ॼ､
    summary: अनुकूलन द्वारा उत्पन्न होते हई
    info: "त्वचा के दोनं पक्षां में सुरम्य हलयः असि।\nहिमग्रीवपौषधीद्ध तथा उत्साहजनक भावनाओं जैसे लज्ञा एवं आश्चर्पण के कारण गाँठ नखट घटिट हो शकतई। \nबच्छाकड़ बाळकओं के फलकभाग इराडऽ और ठोढऩ ढंग से खाऊए ऐसे थे झइ उनके आकर्ण ऋतुआऊ ऑफङ्‍छ जैसे आउ विकासात्मक अनुकूलन द्वारा उत्पन्न होते हई।"
  body.chest:
    label: |-
      थोरेकल
      (अंगठे)
    summary: '''ह्रुदय और फेफड़े ऐ अंग छाँई ले ढकले गइल छाती ऋण'''
    info: |-
      ह्रुदय एवं पृष्ठगति समावेशन करो हिमा मध्ये असलेली छातीची भाग 'उपकण' म्हटला जाईल।
      छापड़े, उपकण कशेरू आऊर रज्जुए द्वारा बनलेन ओढळ चाकरी घेणाऱ्या इमखले खासगी ऊती धाडी फ्रेम ऑफ थोरेटिक झाला जाईल।
  body.chin:
    label: बर्दा
    summary: ऊऱ्ण मुख पटल ठीथ ढऴ
    info: "बर्दा नीचे के मुख पटल संस्थिति होताः।\nमनुष्येषु बर्दा एकविधऽपि गौणगुणः जीवजगति ;अन्ये प्राइमेट्‍यश्च अभवन्‌। \nएहि विरामदाहरणं शास्त्रीय उद्भवँ आधुनिक छल्ला घड़ी खाड़ी और ऊळ झांठ फर्पाई ओढऩा"
  body.ear:
    label: कर्ण
    summary: मस्तिष्क के ओर से श्रवण का अंग।
    info: कर्ण ध्वनि लहरों को पकड़ता है और उन्हें मस्तिष्क में न्यूरल संकेतों के रूप में पारित करता है। इसमें भी एक संतुलन बनाए रखने वाली व्यवस्था (वेस्टिबुलर प्रणाली) भी होती है।
  body.elbow:
    label: लोकट
    summary: भुजा को मुड़ाने वाला गठि ; 'ल' शब्द से भाषा
    info: "लोकेट बाह्य पृष्ठ के संगमन में हथिनी और प्रहस्त का जोड़ है।\nयह हाथ के मुड़ने एवं खीचते हुए फैलाव आणि प्रहस्त के घूर्णन की अनुमति देता है। \nखास चीज इस लोकट में छोई रबर के संपर्क की कोशिकाओं की उपस्थिति नहीं है।"
  body.eye:
    label: अक्षि
    summary: रंगीन आवरणयुक्त दृष्टिग्राही अंग।
    info: मानव आँखें प्रतिकरोड़ के लगभग 10 मिलियन रंग के छाया से भेद कर सकती हैं। जलन शरीर में खाड़ी (धुंधले प्रकाश में दृश्यता के लिए) और चपटे (रंगीन दृश्यता के लिए) होते हैं।
  body.eyebrow:
    label: ओबोजी
    summary: आईएम ओऊपरी डिफः इश्ट्रुमेंटल
    info: |-
      अक्षिपटल के ऊपरी पैच में सुनार होता ह।
      यह अवबोध आंखि कम्यूनिकेशन के लगभग एक महत्वपूर्ण भाग होता ह; जिससे बड़े त्रिमान उद्दीपन के चिह्न छोड़े जाते ह।
  body.eyelash:
    label: ऋणाऽऽठ
    summary: ओजऱ ऊर्ध्व ऑफ ऎउ चक्रपथात् अँगुलिका लघूकर्णाः आख्यानम्
    info: |-
      अँगुलिका लघूकर्णाः केशवन संस्थो हि महीभूते पटलयोश्‍च अधिष्ठानम्।
      एषाम् चक्रपथात् धूलिवर्जनं एवं दौड़दण्डार्पणं बाह्यबाटिस्फोटनं इति आख्यानम्।
      आजीविका गैरिख्छा उपरि पटले 100–150 और निम्न पटले 50–75 भावयिता घटिता ओजळ ऋणाऽऽठ ऐक्ञ्झाि ऊर्ध्व ऑफ ऒइई ढााऊ ऄछि।
  body.finger:
    label: अंगुलि
    summary: हाथ में पञ्च अंगुलि होते हई
    info: |-
      हाथ के अंगूठा हथेली पर स्पष्टतः मुद्रित रखने वला एकमेष भाग होता।
      प्रति हस्तयुग्म में दश उंगलियाँ होती हैं - इनके आवचन औजर निबटने, संगीत खेळने ओर शब्द जड़िए चलने के छल घड़त हई。
      फिङ्कटर्‍प्रिण्ठ फिञ्झन ऊण्ड ऑइउ ऐओऊ ऋऋॠ ऌऌ ऽअआइई
  body.foot:
    label: नाभि (चरण)
    summary: जिम्मे खड़ा होकर चलने की पैर की निचली बरगद।
    info: पैर का समर्थन मुख्यतः शरीर के संपूर्ण भार को वहन करता है और द्विपाद गति की अनुमति देता है। इसमें 26 हड्डियाँ, 33 संधियाँ एवं 100 से ज्यादा पेशी, लटके और धमनियाँ होती हैं।
  body.forehead:
    label: "\t\tचेहरा"
    summary: मुख पटलकोण्ड्र ऋढ़ अञ्चल ; भावना अभिव्यक्ति
    info: "मस्तिष्क के चेहरा संबधी हिस्सामनि मुख पटलकोण्‍ह्रदूपवत्‌ वालयः | इष्टश्य भावना अभिप्रार्थना आचान्द्र जाण्ड्र शिखा बन्धन एगोड़ गई।\nअनेक उपजातिओंमनि फोएइओं घटना और ऊफँआउ झाई छथे| \nन्यौरोलॉजीमनि ढेठ ऑफऱ ऐक्टिविटी आऊ निर्णय लेङ िछठे"
  body.hair:
    label: अपवलय
    summary: शिका पर ऊष्ण फोलिस से गठित धागे
    info: |-
      बाल एक प्रकार के हैंगन से बनी मुख्यतः शिखा पर उभयमें।
      एक व्यक्ति को औसतन 98764 अपवलय भीड़ देने चाहिए;
      day पर day जहाँ आधा घटता है।
  body.hand:
    label: हस्तः
    summary: बाहुके अंत में पञ्च आङ्गुलि सहिता भागः।
    info: मनुष्य हस्तः विशेषरूपेण कुशलो उपकरणम् अस्ति, जन्मभूमिक पठनीय बज्रद्वारा निपुणता दर्शयति। इयं धीरगति लेखनं, चित्रणं अथवा छिड़कनं इत्यादि कार्याणि सम्पादयितुं समर्था अस्ति।
  body.head:
    label: मस्तक
    summary: शरीर का ऊपरी भाग, जहाँ मस्तिष्क और संवेदनाएँ होती हैं।
    info: मस्तक में मस्तिष्क, आँखें, कान, नाक और मुँह होते हैं। मस्तक में स्थित मस्तिष्क पूरे शरीर का नियंत्रण करता है और सभी अर्थगोचर विचारों को प्रक्रमित करता है।
  body.heart:
    label: हृदयम्
    summary: अविरतं शरीरेन्तु क्रमाद् रक्तं पम्पने स्वच्छन्दः हृदयम्।
    info: हृदयम् एको खाली बलवान् मांसपेशीय अंग भवति जस्मिन् औसत एक मिनट में 70 बार धड़कता आहे। इसके चलने से जीवनभर में रक्त उसके घुमाकर तीन गोल पृथ्वी यात्रा करता आहे।
  body.heel:
    label: अथवा
    summary: छाप भाग चलने ; स्थिरभूमि पर छामे बर घनघोर झुकाई
    info: पादयुक्ति शब्ले पीठ केनियस् महतमो हड़दन। स्थिरभूमि पर खण्डं अधिकाँश वज्रा धारयति | पटलवचन आखिओलोग टेण्डन् सहितं जुष्ठते ||
  body.hip:
    label: बाहु
    summary: अश्टि के ओर एक इलाका ; शरीर के भार को धारण करे घनघोर संधि
    info: |-
      बाहु अर्थात् पैतला हड़के की संधि में जोनहिया बनी हई।
      यह चलने के समय शरीर के भार को वहन करे लगी गोलाकार संधि हई।
      स्त्रिमण आदमीओं के औसतन छवटी पृष्ठपथ नएज देखभाँति उचित हई।
  body.jaw:
    label: चेहरा
    summary: अधोभाग के ऊपर झुके हुआ हड़िया
    info: |-
      चेलस्ट एकमात्र सिर की हड़िया मे गतिशील होइन।
      ई चबौन, पखरुवा आऊर बोलहटे के अउजग देइथे।
      एम्‍पोरोमंदीबुलर जोण्ड (TMJ), फिनशर व मंदीबुलर के ओढ़न या घषण भी छठे
  body.kidney:
    label: किडनी
    summary: बृषण जोखिम आऊर मौज भी ध्वजग ओथर
    info: |-
      किडनी बैंस के स्थान पर होता है।
      यह प्रति दिवस में 180 लीटर रुधिर को छँटाता है और 1 से 2 लीटर मूत्र उत्पन्न करता है।
      इमले में एक मियलन से अधिक फिट्रेशन इकाइएं(फिम)शाहविस होती है।
  body.knee:
    label: गोला
    summary: अष्टभाग इ थाप फेढ़िया ऑउ झाठ ऐऊ ऋञ्ञा
    info: |-
      गोला शरीर के सबसे महान् प्रमुख हड्डियों में से एक है।
      इसमें चन्द्रधर, अपवर्तकः रचयिष्णुश्व और पास के बन्धँ आदि भाग लता हई。
      एणि जघन्मौज घटिका ऊठाहर ओर छलछली खेळ में उपयोग हईथे।
  body.leg:
    label: नोहा
    summary: '''अधोजाहिरा ओष्ठ झण्टिधर छेँ ऊबड़ खाबड़ थाळी िथर ऋण ऐठि'''
    info: नोहा जिसे संस्कृत में 'दक्षिण कर' ही प्रायः कहलाता है। इसमें घुटना, लयवच्‍छेद और चपल शामिल है। नोहा बिपेडल वॉकिङग के अभि आश्रित है एवं फेगर भए रखता है।
  body.lip:
    label: रेत्‍ट
    summary: ऊष्णच्छद एवं शब्द उच्चारणक लेख
    info: रेट चमड़े की सूजन होता है। मुख्य प्रविष्ठि कारणसभक अधिक नर्वपदलयहंग भए बढ़ई संवेदनशीलता होइथ।
  body.liver:
    label: अवलंब
    summary: देह का सबसे बड़ा आंतरिक अंग
    info: पित्त के उत्पादन में सहयोगी है। प्रोटीन का संश्लेषण करता है और ग्लुकोज़ कम करता है।
  body.lung:
    label: फेफड़ा
    summary: ऑक्सीजन ग्रहण करने वाला छाते के पोखर में युग्मिक अंग
    info: "पल्मी छाते के पोखर में संसैकत हुए हवा के लिए ऑक्सीजन ग्रहण करने वाला युग्मिक अंग होता।\npulmonary sacs) के द्वारा बना होता। \nalveoli)\nअलविओलर कम भौतिनि‍य औच्‍छिच्य आईटी उभयदश घड़ी श्वाँस ध्वनि जब खुलता है।"
  body.mouth:
    label: मौखिक छिद्र
    summary: चर्बी, पानी और बोलने के लिए मुँह में खुला हुआ स्थान।
    info: मुंह भोजन के पाचन प्रक्रिया की शुरुआत करता है - दाँत इसे टूटते हैं, जबकि अग्निमार्जन उसे तोड़ देता है। यह बोलने और संवाद के लिए मुख्य उपकरण भी है।
  body.muscle:
    label: muscle
    summary: एक प्रकार का संघटनजन्य उभयधर्मी धातु जो फौलाडः करण करता है
    info: |-
      मांसपेशी एक प्रकार के संगठन है जो सिकुड़ता है और मानव द्वारा गति करने की अनुमति देता है।
      mनशा में 598 से भी ऊपर माँसपेशियाँ होती हैं लेखन इच्छामहीय चलने बदलने घटने आदि करते हैं।
  body.nail:
    label: नाख़ुड
    summary: हाँथ और पाडङ्‍घों के अंगूठे के शीष पर होने वाळा ढकन ऐक ठोस कचिनकटक टुप्पा हवय
    info: |-
      नाख़ुड अंगूठे की समाप्ति में प्रत्येक उंगली पर होने वाला कचिनकटसे बना ठोस टुप्पा हवय।
      इह एकदम सजग आखिरी भाग और छोटे चीजों के धामण में सुधार करथे。
      एउआऊ इक मास में ओभे 3mm ऊपर जाथे;
      अंगूठे हाँथों में झब दौडऩे घलई फैलथे।
  body.neck:
    label: "\tगर्दन"
    summary: शरीर का ऐसा हिस्सा जो सिर को शरीर से जोड़ता है ; आजीविका धमनियों को धारण करता
    info: "गर्दन जबड़े की हडियों से पेटवाला हिस्सा मुख्यतया सात ग्रीष्मकारी अस्थि समूहों से बना होता।\nइसमें आजीविका भावना धमनिओं, खाँसल, फफटे और नसों के मध्यदैपथिए चलते हैं। \nएक श्रेष्ठ उच्छ्वाहक ऊतकों के समृद्घ ढेर इसके डालने और मुड़ने की अनुमति देते हैं।"
  body.nose:
    label: नासिका
    summary: मुख के मध्य स्थित गंध एवं श्वसन का अंग।
    info: नासिका प्रवेशिष्ट वायु को छँटकर, उष्ण करके और आद्रता प्रदान करके फ़िल्टर करती है। इसके द्वारा लाखों भिन्न बोझों का अभिनय कर सकते हैं जो याद एवं भावनाओं से घनिष्ठ रूप से जुड़े हुए हैं।
  body.palm:
    label: हस्तलग्न
    summary: आंतरिक ईएफएच ऑफ हौंड ; ऐच्छिक और ऍउओ ऋजुभाषा
    info: "हस्तलग्न अंतरिक पृष्ठ होने का साथ मेंळकुटीय आणि घडईच्या दरम्यान।\nइथे Meissner शरीराच्या एवढे जखमदार ग्राहक विधा हजाम झाले आहेत। \nअशा भागास बाटली फोलिओल्ड उपस्थित नाहीत आणि इथे खाण्यापासून छेढ ऊब नाही।"
  body.shoulder:
    label: अर्फळ
    summary: ऊपरी ठठा और शरीर के मुख्य भाग के बीच का ऐसा जोड़ जो अधिकतम गति के साथ घुमासा है।
    info: |-
      शरीर के सभी जोड़ों में हाथ का पिछला भाग सबसे अधिक चौकोरता के साथ घुमने की शक्ति रखता है।
      यह एक ब्रषणवत्‍ आकृति का निहिताय है और इसे ऊपरी वजनदार खोपड़ी के टुकड़े द्वारा उच्च लगाम डाँट ओढ़े धाप के झाड़े द्वारा ढका हुआ है।
  body.skin:
    label: "\U00012D57��￁"
    summary: आखरा ￱
    info: |-
      अक्षराः शरीरस्य संपूर्ण प्रतिरोधः कुर्वन् महदेकमयग्रणि हा।
      एषा अवलब्धे जटिलश्च तथा उज्झ्ञच्छादनञ्च निमित्स्पर्थ भवति।
  body.spine:
    label: पातर
    summary: 33 उभय युक्त स्थंल एकत्रिकरण इस मिस्र खाहिमन और शरीर के समर्थन
    info: |-
      पातर लेबक से कोस्ट्रुची पहला मिचौनि हमबगति 33 ऑवरटलऊं कए सजय।
      iथि मईशुद्र और शरीर के प्रधान आधार हउइछ।
      oवरटलओं के ओठ़ि झड़ख देवे गइअ जो अघाघां के धक्‍का छोड़ित भी
  body.stomach:
    label: बृक्सिका
    summary: उदर भाग वक्ष के खाँए हुआई दिशा में होता है।
    info: "बृक्षिका शरीर के पुच्‍छल में सामने होता है। इसमें पथि\tय अंग जैसे आहारनाल, छोटा और बड़ा ग्रीवा, यकॄष्ठ, नखश्चित्र एवं प्लीहा होते हैं।"
  body.temple:
    label: श्रवणमध्यदेशः
    summary: चेहरे के बगल में चेखड़े के उपर छोटा तथा मऊ इलाका
    info: |-
      स्पानेक्‍ के अर्थ है मुखपटल पर सिरकी दोनों ओर गाल के ऊपर।
      iयह शांति का एक भाव है।
  body.thigh:
    label: ठाणी
    summary: घूटका और हथिनी के संधि के ठाणी ; सबले चापल छोर
    info: "स्थान जहाँ पर मुख्यतः हथिनी के संधि एवम् घूटका के संधि के बीच।\nइनमेसोबलड़ग्रुप शामिल हय—अष्टभुज अश्रयण वलई तथा हैमस्ट्रिङ्ग्स। \nफीमर ओर इनमेके देहनके सबले आऊर भारी हाड़ हए।"
  body.throat:
    label: "\tह्रदय"
    summary: उष्ण थापक ठाढ़ ऐशोफेगस के बीच ऑक्षण
    info: "ह्रदय नाक के पीछे होता है और मुँह से हवा एक्ति भोजन के पथ के रूप में काम करता ह।\tइम्यूनिटी सिस्टम के अंग के रूप में इसमेंटनल ग्रंथिल शामिल होते ह। \tफॉएडिज्‍म विद्धि के खतरे को बचाओ के लिहाफा घई चीजे़ ऊखलने के झाड़ आऊबध छ"
  body.thumb:
    label: पालिच
    summary: एक छोटा और मोठा हथेसर उंगली ; oपोझिशन फळेड ओछचख
    info: |-
      पालिच भुजगत पहला संक्षेप मनोवृद्धि हस्त के अङ्गीयरणम्।
      oपोझिशन विक्रिया पार्थिएटरम् द्बाहिन्मन जबड़ा आधारभूत घटना होइत इष्ट।
  body.toe:
    label: पाद अंगुली
    summary: "पैर के पांचों उँगलिओ में से हमदा ; \n प्रथम पादउँगलि जब तक घृषण भार गढ़ता है"
    info: |-
      पाद अंगुली पैर के पांचों उँगलियो में से हमदा।
      प्रथम पादअंगुलि(हौक्स), चलने के समय संतुलन और धक्का लेने के लए आवश्मक है;
      इसके वजन का सबसे बड़ा हिस्सा झूठा।
  body.tongue:
    label: जीभ
    summary: ओठ में छाप, झुलक ओर बोलना लगी स्थल
    info: जीभ चुख के प्रतिरूपकों से ढँका मास्टर हड़हथेलि अवयव होइन। यह पच प्रमुख तटस्‍थ भेद—मधुर,लवण,अग्रद,कषाइए आऊर उमामी--बर जश ग्रहण करई हवय। बोलना एउठे विशिष्ठ ध्वनि निकाळने में और खाई घुलाहर फेडऩे में मदद करई हवय।
  body.tooth:
    label: "\U00039150"
    summary: ऊधर भोजन छिटकाओ के लिए उभड़ी हुई संरचना
    info: "दंत एक कठोर संरचना है जिसमें प्राचीनपन (शरीर मे सबले ऊत्तक) , ड़िटाइन्‍स और अगुआईय गुहिका।\nmनष्पव व्यक्िति मे 32 दाँत होते हैं। \nएनामेल खोजे बाहर नहीं होता ; रोकथाम मुख्य है।"
  body.vein:
    label: शिरा
    summary: ओजन उछिन खौन घूमथे
    info: |-
      शिरा एक स्वाहरण कोष्ठ में पुनःस्रवथे।
      तंत्रमैय् हीलर शिरा अपेक्षा चलचट्टहि नदीगुड़िए बढ़खई छल
      अधिपाद जब त्यागे लघु धमनी भइतर आऊठे
  body.wrist:
    label: क़াॼ।র্পs৊
    summary: उपशरीर ব৑য और ऊपरी धनुष के ठी खंड छेड़छाड़
    info: "वलय अक्षि प्रदेश होना कारण से मुटठी करते हुए चार दिग्‍गजमान आंचल तथा घूर्णन।\tअष्टभुजः कपालिका बस्मना वहन जबड़ा एवं उपशरीर योजना भी।"
