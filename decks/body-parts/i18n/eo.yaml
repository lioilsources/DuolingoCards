lang: eo
pivot: false
title: Partoj de la korpo
cards:
  body.ankle:
    label: malpiedo
    summary: Artikulaĵo interligante piedplaton kaj gambon; plejmalfacila trafendota loko.
    info: La malpiedo estas artikulo kuniganta la gambon al piedoplato formita de tri ostoj. Permesas movadon supren kaj malsupre kaj mallongan flankmovadojn. Malfermitaj malpiegoj establas pleje oftaj atletaj traumoj.
  body.arm:
    label: braketo
    summary: Supra ekstremitato inter lango kaj mano.
    info: 'La brako estas la supera membro formita el tri partoj: supra avolto, subavolo kaj manko. Ĝi enhavas pli ol tridek musoletojn, ostojn kaj tendenojn por movado. La osto de la supra avolto (humero), kune kun tiuj de la subavo (radio kaj ulno), koneksigis en laktilo.'
  body.back:
    label: Dorso
    summary: Malantaŭa parto de trunko; plej granda grupo da muskuloj en alto.
    info: La dorso estas la malantaŭa parto de korpo inter kolo kaj butoj. Ĝi enhavas la spinon kun 33 vertebrilojn envoltitaj per dorsaj muskloj. Dorsaj doloroj konstante kaŭzas laboran malfartigon.
  body.belly_button:
    label: Umblikuso
    summary: Ciko meze de korpo restantas post trançiĝinta pubeĉna ligo.
    info: "La umblikus estas la cico formita en punkto de atakiĝado al patrino per pubeĉno ŝnuro dum infaneco por ricevi nutraĵon el ĉe paŭlo. \nJe dependas de maniero kuraciganta se tiel estos konkava aŭ konveksa. La umbilkuso ankaŭ havas proprajn mikroborganismojn kun esceptemaj bakteroformoj registritaj fare sciencistoj. En diversspecaj mondo-kulturoj oni donacas simbolika signifo spiriteco."
  body.bone:
    label: osto
    summary: Rigarda ligo-tkaneo formas la skelon; vivanta organismo enhavante kontran.
    info: Oso estas rigida ŝtato formita per osteocitoj kaj mineraloj (kalcio, fosofo). La homa skeplo havas 206 ostoj en plenaĝo; infanojn ekzistas super 300 el ili (multaj kunligiĝos). Oskontraŭ produktas ruĝecglukulojn, blankegluilojn kaj trombokitetojn.
  body.brain:
    label: cerbo
    summary: Reganta centro por korpoprocesado; plej kompleka bio-strukturo interstelare.
    info: La homa cerbo pezas proksimume 1,4 kaj enhavas pli ol 86 milionoj da neuronojn. Ĝi estas dividita en du poluspartojn; la maldekstra regadas la dekan flankon de korpo kaj inverse. La cerbo uzantas 20% el tut-korpenergio kvankam temas nur pri 2% pese al korpon.
  body.calf:
    label: porio
    summary: Malantaŭa parto sub la genuo kiu finiĝas antaŭ ol oni iris al la artikulot.
    info: La malantaŭa muskoligita parto de la malsupra gambo inter la genuo kaj artikulo estas nomata porio. Ĝia plej grava musolo - gastroknemieus permesas al ni levadi piedojn sur siajn piedpintoj kun saltado ebliga forpuŝiĝon el tiu pozicio dum saltoj; ankaŭ gravas pri vena refluksigo de sangokontenteco en infernorakaj ekstremitatoj direkte hejmpreter korpo. Krampetoj okazantaj tie estas tre oftaj amasaĵo atletoj sed anke dumgravidigitaj virinoj.
  body.cheek:
    label: lico
    summary: Plenaĵa regiono flanke de la faco esprimanta emocion tra ruĝeco.
    info: La lico estas la malsupra parto de via frunto ĝis subviaj buŝo kun graso kaj musolo por protekti ilin kontraŭ varmeco perdo. Kiam vi sentas honton aŭ timon, viajn licojn venas rubro pro dilatado de sango-vajoj en respondo al tiu emo. Bebateto havas plenkrumajn licojn kiun ni trovas atrekteca kio helpigas infanadonsorgemon.
  body.chest:
    label: torak
    summary: Antaŭa parto de trunko enhavanta sercon kaj pulmon.
    info: La torako estas la antaŭa parto de korpo limigita per riboj, sternumo kaj lumbospino. Ĝi protektas gravan organojn inkluzive al serco kaj pulmoj. La krurkoŝto formas el duobledekimo da paroj de riboj, sternumon kaj dorslombospondron.
  body.chin:
    label: pomo
    summary: Subparto de la facio post la malfermo.
    info: La pomo estas la plej malsupra parto de la vizaĝo formita per suba manko. Ĉe homoj ekzistas distingiva proeminenco en tiun direkton unika inter animaloj - aliaj primatecaĵoj havas sian butonmankon sen plenumado elstarante forten. Kial ni posedas pomon restas temo por sciencista diskuto.
  body.ear:
    label: orelho
    summary: Organo por audiado sur flanko de kapo.
    info: La orelho kaptas sonoondojn kaj transdonas ilin al la cerbo per nura signalo. Ĝi ankaŭ enhavas ekilibran aparaton ( vestibula sistemo ).
  body.elbow:
    label: gomo
    summary: Articulado por movi armon; nomita el arc.
    info: La gomilo estas artikulaĵo sur la ekstera flanko de koneksio inter supermara brako kaj submara parto. Ĝi permesas flekton kaj etendon de la manoj kaj turnadon de la antebraĥo. Interesa fakto pri tio ke ne havas taktilajn ŝelojn en tiu regiono.
  body.eye:
    label: okulbildo
    summary: Okula sensilo kun fargoformita iris.
    info: La homo havas okulojn kiuj povoras distingi ĉirkaŭ dekmilionoj da koloraj tonaloj. La reto enhavas bastonetojn por nivelo-sensacio je malplena lumo kaj konuskorpojn por barvidaĵo.
  body.eyebrow:
    label: supercilio
    summary: Ŝrangeto el haroj ĉe ambaŭ flankoj de via frunto uzita por emocio.
    info: La supercilioj estas ŝrango da haroj supre de la supra palpebro kiu funkcias por protekti la okulon kontraŭ sudo kaj pluvo. Ili ankaŭ ludas gravan rolon en nerilata interago per emoĵo esprimita tra movado.
  body.eyelash:
    label: rimeo
    summary: Serio da kurbitaj haroj flanke de la paŝmon por defendado de l'okulo.
    info: Rimoj estas mallongaj kurbaj haroj kiuj naskiĝas je la rando de la paŝmoj. Ili protektas la okulon kontraŭ pundo, sudo kaj eksterenaj objektetoj. Granda homo havas inter cento ĝis cent kvindek rimak sur supera paŝmo kaj inter kvindeko ĝis sepdek pri suba unu; ili refariĝas en proksimume kvar al ok semajnoj.
  body.finger:
    label: manofingo
    summary: Unu el la kvin fingeroj sur mano kun tre trionartikulitaj.
    info: Mano fingero estas unu el la kvin fingeroj ĉe manoj; malgranda figuro havas du artikulojn kaj aliaj tri. Ni ambaŭ havadas dek fingeroj por movado per iloj, muziko kaj skribado. Fingera printigoj diferenciigas personon pro sia individualismo.
  body.foot:
    label: piedo
    summary: Suba parto de la gambo sur kiun ni staras kaj promenas.
    info: La piedo portas la pezon de la tuta korpo kaj ebligas dujaran marŝadon. Ĝi havas 26 ostojn, 33 artikulojn kaj pli ol cent musoloj, tendenoj kaj ligamentoj.
  body.forehead:
    label: fronto
    summary: Antaŭa parto de la skapo super la suprpaĝetoj; surfaco por emo-esprimo.
    info: La frunto estas la antaŭa parto de la kapkoŝto super la supraj paĝetoj kaj sub la harlinio. Ĝi estas unu el plej videblaj lokoj por esprimado da emocioj; krinkigo de fronto montras koncernon. En multeglektro kulturoj simbolismo estis uzita sur fonto (promesoj, kastaro).
  body.hair:
    label: pelo
    summary: Fibrilaraj strukturoj spirantaj eksteren per epidermo.
    info: Peloj estas fibriloj el keratino kiuj naskiĝas en pelefolikoĵoj sur la kapo de homo. Homo havas averaĝe centmil pelojn pri sia kapo; ĉiu tagon foriras kvindek al cent da ili. Ruliĝado okazigas proksimume unu duono-centimetrojn monate.
  body.hand:
    label: Mano
    summary: Parto de la brako finita per kvin fingroj.
    info: La homa mano estas malfacile manĝema ilo kun kontraŭebla malgranda fingero. Ĝi ebligas detalan movadkapablon kiel skribado, desegno aŭ ŝtalo.
  body.head:
    label: kapo
    summary: Supra korparto kun loĝejo por la cerbero kaj sensoj.
    info: La kapo enhavas la cerbron, okulojn, orelojn, nazon kaj buŝon. La cerebro en la kapo estas reganta centro de tutkorpora funkcio kaj procezoras ĉiujn sencojn.
  body.heart:
    label: korpo
    summary: Neinterrompe pompante sangon tra la tuta korpoproceso.
    info: La korpo estas malferma muskolo grandeco de manpugilo, kiun ĉiasube batas proksimume cent sepdekfoje en minuto dum la vivo. Dum tutvivo serĉos sangon distanco egalanta triorbito al Tero.
  body.heel:
    label: kalkano
    summary: Posta parto de piedo; ĝi transportas tutan korpon dum starado.
    info: La pata kosto estas la plej granda osto de piedo. Ĝi portas pluegon da pezo dum starado kaj konektita al tendono Achilles-aŭto. Dolor en la planto (planta faszioenflamo) estas unu el la plejege okazantaj problemoj pri piedo.
  body.hip:
    label: Articuli Coxae Region
    summary: Regiono ĉe lateralo de pavo; grandeco de pezportanta junko.
    info: La bokaĵo estas la regiono ĉe artikulo de koxa, kiun kunigas femuro al la malfermo per bulboformaj ligoj portantaj korpon dum marŝado. Virinoj havas pli larĝan pavenon ol viroj pro partorio. Anstataŭigo de femur-artikula punkto establis inter plej oftaj operacioj en ortopedia.
  body.jaw:
    label: Mandibo
    summary: Suba ostofragmento por apogo al subaj dentoj.
    info: La mandibo estas la sola moviĝanta osto de la kranio. Ĝi permesas mastriĝon, trinkadon kaj parolon. La TMK (temporo-mandroplar artikulo) estas unu el plej kompleksaĵoj en nia korpo.
  body.kidney:
    label: reno
    summary: Duorgano por filtrado de sanco kaj produto de urino.
    info: Renoj estas duorgano en formo de fasoneto situanta je la malalta parto de la korpa interna spaco. Ili purigas pli ol centokcdek litrojn da sango ĉiu tago kaj produktas unu al dua litron da urino; enhavante plurmilionojn filtradunuitatoj (renaloj). La renoj regulas sangpremon, ekilibraĵon inter elektrisalt'elementoj kaj kreton de ruĝeceluloj.
  body.knee:
    label: gamboartiko
    summary: Plej grava ligo inter fermo kaj malfermo
    info: La gambo artikulas estas la plej granda en homo kaj unus el plurangulecaĵoj plenumas kompleksan rolon por movado de nocio al piedo per du partoj - femuro kaj fibula. Ĝin formas diversaj strukturoj inkluzive de rotulo, mensekiĝoj, krucigitaj ligamentoj kaj flankaj tendinoj kiuj donacas fortikecon kontraŭ gravito dum marŝado kaj kuradon.
  body.leg:
    label: nog
    summary: Malsupera parto inter kelko kaj artiko.
    info: La noga (malsupra membro) konsistas el la gambo, malantaŭparto de piedo kaj piedo. Ĝi estas adaptita por duopaksa marŝado kaj enhavas la plejmalfortikajn musolojn en korpo (kvadriceps). La femuro (stegnopieda ostelo) estas la plendika kaj fortika osto en korpon.
  body.lip:
    label: lipo
    summary: Unu el la du mallarĝigitaj randoj ĉirkaŭanta la buŝon.
    info: La lipoj estas unu el la du mollegaj muskulaj ŝanĝoj limigantaj la buŝon. Ili havas multe da nervalinioj kaj tre sentemaj. La koloro de lipoj dependas de sangado; bluaĵo povus indiki mankon deoksigeni.
  body.liver:
    label: hepto
    summary: Plej grava enekstro korpa parto; biologia laborkamera.
    info: La hepato estas la plej granda interna organsmo pezanta pli ol 1,5 kilogramojn. Ĝi havas pli ol kvincent taskojn inkluzivante sanguan purigon, biliferon produktadon, proteinojn sintezo kaj glikozeno stokado.Ĝi unike povas reprodukti sin komplete el restantaj ŝrankvoj post damaĝo.
  body.lung:
    label: pulmon
    summary: Duobla organo por akcepti oksigenon el aera.
    info: La pulmoj estas duoblorgano en la torakoduto formita de millionoj da blankuloj (alkvoloj). La totala surfacareo de alkvoliloj en la pulmoj egalas proksimume 70 kvadratmetrojn. Granda homaripenas inter 12 ĝis 20 fojojn dum minuto kaj ricevas po 500 millilitrojn da aero per unua spirado.
  body.mouth:
    label: buŝo
    summary: Apero en la faco uzata por mangxi, trunki kaj paroli.
    info: La buŝo inicias la digestian procezon - per dentoj ĝi krakigas manĝon, salkaĵoj dismetegas ĝin. Ankaŭ estas plej grava instrumento por parolado kaj interparoli.
  body.muscle:
    label: musol
    summary: Kunpresanta strukturo permesante korpa agado.
    info: Musko estas konsiderata la strikteco-tkanono kapabila al kunpremo por ebligi korpon moviĝon; homaj korpo havas pli ol sescent muskolojn formantaj ĉirkaŭ dudekkvar procentecon el nia maso. La plejmalforta malsano estas masseter dum la malpleja estas unuo en meza orelo nomita stirpino-muskolero.
  body.nail:
    label: unguo
    summary: Duro kerato kunŝuto fine de fingroj.
    info: Unghio estas dura tabulo el kerno en la fino de ĉiu fingro. Ili protektas sensitivaj finoj de fingroj kaj helpas pli bone preni malgrandaj objektoj. Unghioj grandegas proksimume 3 milimetrojn monatektempe; ungujoj sur manoj grandiĝas rapidemore ol tiuj pri piedo.
  body.neck:
    label: kolono
    summary: Parto konektante la korpon al la trunko; entenas gravajn tubero.
    info: La kolo estas la regiono inter kapo kaj torako enhavitanta sep cervikale bonbonojn. Tra ĝi pasas vitalaj elementaroj inkluzive de arterioj, degelo, traheo kaj medulo. En tiun zonon troviĝas serio da muskloj permesantaj turnado kaj inklini la hejmpostancon.
  body.nose:
    label: nazono
    summary: Organeno de la嗅觉及呼吸位于面部中央。
    info: La nazo filtras, varmigas kaj humidigas enspiritan aeron. Ĝi distingas pli ol unu billion diversajn odoronjanojn kaj estas proksime ligita al memoro kaj emocioj.
  body.palm:
    label: palo
    summary: Interna parto de manorando kun plej dense aranĝitaj taktilaj sensoroj.
    info: La palo estas la interna surfaco de la mano inter fingroj kaj malalta brako. Ĝi enhavas tre densan reton da taktilaj receptoroj (meisnerkorpo), sed nenia kapilarfoliko nor oleoglandulojn troviĝas tie.
  body.shoulder:
    label: Ŝultero
    summary: Unu el plenumadoj interbraki trunkon kun maksimuma movada ampleksigo.
    info: La ŝulterbordo havas la plej grandan movadon de ĉiu korpklavoj.Ĝi estas bolformita kunigilo formata per kapo de brakokosto kaj foso en spico. La nestabileco faras ke facile disŝaltiĝas.
  body.skin:
    label: skino
    summary: Plejaorgano por protekcio, varmregulado kaj takto.
    info: La karno estas la plej granda organsimo de l'humano kaj plenumas funkciojn inkluzivante protektadon kontraŭ infekcioj kaj ultra-viola radiado, reguligon da temperaturo, taktilan sentemon kaj sintezon de vitaminulo D.
  body.spine:
    label: spinarko
    summary: Kolono el 33 kostroj protektanta la medulan substancon kaj donante strukturan stabilecon.
    info: La spinarko estas kolono de 33 vertebrkostroj konektantaj la kranon al la sakrumo. Ĝi protekteblas per la medula spinala kaj servas kiel prunalo por apogo pri la korpo. Intervertebro interligilo diskoj funkcias kiel amortizero kontraŭ ŝokoj.
  body.stomach:
    label: ventro
    summary: Antaŭa parto sub brusto en korpoparto.
    info: La bokso estas la antaŭa parto de korpo inter torako kaj pelvis. Ĝi enhavas digestintan sistemon kun stomaketoj, intestinojn, hepaton, pancreaton kaj splenon.
  body.temple:
    label: Temporo
    summary: Malplastika regiono sur lateraloj de la fronto supre de la lica košton.
    info: La temporo estas la flata surfaco de ambaŭ flankoj ĉe la frunto super la lico. Anatomie temas pri pli malvarma parto de la kapkoŝto (skalpoza parto de la temporala osto), kiun eblas facile ataki per putoj. La temporalaj arterioj klare sentas pulson.
  body.thigh:
    label: gambe
    summary: Parto de piedo inter inkio kaj genokruto; granda grupo da musolo.
    info: 'La gambeo estas la parto de la nuko inter la finkaĵoj kaj kelkofinkoj. Ĝi enhavas la plejmalfortan musolkolon en korpo: kvadricipitan femoran mion kun pluraj subpartoj kaj hamstrings-on. La femuro establas plenumon el la plejmpolgama osaro.'
  body.throat:
    label: Guto
    summary: Kava spaco koneksanta buŝon kun duodukto kaj trakeo.
    info: La guto estas kava spaco post la nazo kaj buŝo funkcianta kiel pasejo por aero kaj manĝado. Ĝi enhavas amigdalojn kiuj apartenas al la immunologia sistemo de korpo. La reflekso de gagto protektas kontraŭ enspiradon da eksteren objektoj.
  body.thumb:
    label: palco
    summary: Mallongigita forta fingero sur la mano; kontraŭmetiĝada ago de la palco gravas en preno.
    info: Palco estas mallonga kaj masiva unua fingero de la mano kapabla al kontraŭmetiĝado (kontaktante ĉiun el la ceteraj fingroj). La movokapablo por kontraŭmetiĝadi estis esencevolviĝinta adapto permesanta homojn manupuli ilojn dum evolesko kaj ekzistas nur inter simioj.
  body.toe:
    label: piedfingo
    summary: Unu el la kvin fingroj sur piedoj; la grandpiedo portadas pezon dum paŭdo.
    info: Piedfingro estas unu el la kvin fingroj de piedo. La grandpiedo (halukso), kiu portas plej gravan parton da pezo dum marŝado, havas esencan rolon en ekilibriĝo kaj forpuŝiĝo. Kontraste al simioj, homa grandpiedo ne povas efektivi ĉefopaciun.
  body.tongue:
    label: lingvo
    summary: Musola orgono inter nukso por gusto, mastriki kaj paroli.
    info: 'La lingvo estas musola organsimo revoluita per gustaj bukojn plenkaptante ĉirkaŭ dekon milojon da tiuj. Permesas la perceptron de kvin bazgustoj: saĝulo, salda, acida, amara kaj umami-a.Ĝi ludas gravan rolon en paroli kun artekulacio kaj helpas dum deglutiado.'
  body.tooth:
    label: denteto
    summary: Malsa ĉevala strukturo por mastmiki manĝon.
    info: Denteto estas malmola konstrukcio formita per enanmo (plej malfacila ŝelo de la korpo), odonto kaj pulpa spaco. Homoj havas permanente tridekjumlembrajn dentojn. Enamo post malperdo restadas senpova regeneriĝi; prevento gravas escepteme.
  body.vein:
    label: veno
    summary: Kondukas desoksigenitan sangron ĉirkaŭ rigardante la korpon.
    info: Veno estas sangokondukilo transportanta la sanĝon reen al korpo. Kontraste kun arterioj havas venoj klapidojn por malpermesi reverkan fluadon de sangro. La blua videbleco en via mancheto nur ŝanbas pro lumo; interna sangro ne establas verda sed malluma rano.
  body.wrist:
    label: manento
    summary: Artikulo ligante la manon al la antibrakko; esenceco por finmotiko.
    info: La maneto estas la regiono koneksanta la manon kun la antibrako formita de ok malgrandaj ostoj (karpo). Permesas moviĝi en ĉu tri direkciojn kaj turni ginekeblecon. La karpana tunnelo (streĉa kanalo en la maneno) povus kaŭzi sindronmon de la karpa tunnelo per superŝarĝado.
