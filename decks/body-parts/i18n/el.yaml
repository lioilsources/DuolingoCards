lang: el
pivot: false
title: Μέρη του σώματος
cards:
  body.ankle:
    label: μηριαὶ
    summary: Σύνδεσμος τῷ βάσκαμα.
    info: Η μηριαίος συνδέεται του βάσκαμα και η πλαγιών επ' αόβαθρον χωρίζεται δύο λόγχες· νῦν γὰρ ἀφῆκα φῶς ὑπὲρ τὴν ῥῖνα.
  body.arm:
    label: Παζέ
    summary: Ανώτερη βραδύβαση από το φρύδι.
    info: Η παλάμη είναι η ανώτερη κονχή τις συγκροτημένων με τρία διπλόστροφους χύθρους νεύρων για τη λειτουργία της.
  body.back:
    label: Μπάσες
    summary: Πλαγιοκάθητη τμήμα σώματος· μεγαλύτερη μυϊκή ομάδα.
    info: Οι μπάσες είναι η πλαγιοκάθητη τμήμα αυχένων και ωρύδων σώματός μας. Διαθέτουν νωτιαίο δίσκο (33 φυσαρχίδες), γεμάτο από μυϊκά βραβεία. Πόνος λόγω μπάζων είναι μια από τις πιο συχνές αφορμές αναπαραγωγικής αναπηρίας.
  body.belly_button:
    label: Πλατυσμένι
    summary: Ρήξη στο κέντρο του κοιλιακού.
    info: |-
      Το πλατυσμένι είναι η ρήξη στο μέρος του αγκάθεπό γύρω κατ' αφρώδες δέρμα να φτάνει λιχνίζει από τη µητέρα
      Η µορφή του - εµβρυϊκό ή βρεφικό – εξαρτάται από τον τρόπο επούλωσης,
      Συχνά φιλοξενεί µια συγκεκριµένη µικροβιακή κοινότητα·
  body.bone:
    label: Αρθρικό
    summary: Πολύπλοκη ζωντανή ή πολύψηφη Αρθρική
    info: "Η αρθρική οστία επάγεται σχηματοποιώντας τους πλέγμα χόνδρων και με λύσεις νευρικών φυσαλίδων (ασβέστιο, φωσφόρο). \nΟ δεξιός γραμματικός έχει 206 ημιτελείς βραχίονες στην ενηλικίωση· το παιδί θα ξεπεράσει τις 300 (πολλές ισχύουν). \nΤο ίδιο το άρθρο παράγει ερυθροκύτταρα, λευκοκύτταρα και αιμοπετάλια."
  body.brain:
    label: Εγκέφαλος
    summary: Κεντρικός φορέας λειτουργίας του σώματος · η πιο πολύπλοκη βιολογική δομή στο σύμπαν.
    info: Το ανθρώπινο εγκέφαλος ζυγίζει περίπου 1,4 κιλά και περιέχει πάνω από 86 δισεκατομμύρια νευρώνες. Διαιρείται σε δύο υποδοχείς· την αριστερή για τον έλεγχο της δεξιάς μεριάς του σώματος και αντίστροφα.
  body.calf:
    label: γάστρα
    summary: Πλευρική λεμφαδένα.
    info: Ο γάστρας είναι το πλευρικό μύς στη θέση από κάτω δεξιά χώρα.
  body.cheek:
    label: ώμβρο
    summary: Περιοχή στα δύο του απέκρυθρων μέλη.
    info: Η όμβρος είναι η περιοχή στα δύο του απέκρυθρων μέλη κάθε γόνατος λόγω της φυσικής βλάστησης.
  body.chest:
    label: Ρινοχηλίδα
    summary: Περιοχή του προσώπου που λειτουργεί ως φωτιζόμενος φίλτρο.
    info: Η ρινοχηλίδα εμπεριέχεται από τους πλάγιους μύες και συσκευή οφθαλμών για να βοηθήσει στη διαβίβαση φωτός.
  body.chin:
    label: γνάθος
    summary: Κάτω μέρος του προσώπου
    info: "Η γνάθος είναι η πιό κατώτερη μέρος του χείλους σχηματισμένο από το κάτω δόγκο. \nΣτους νήφυρες βρίσκουμε φανερή γνάθο (proeminence menti), ιδιότητα μοναδική στo βασίλειο των ζώων· Δεν την έχουν ούτε άλλα πριμάτες .\nΓιατί θέλουμε γνάθο , εξακολουθεί να είναι λόγος επιστημονικής συζήτησης."
  body.ear:
    label: Αυτί"}
    summary: '"Σύστημα ακρώτηρα ακούστικού οργάνου."'
    info: '{"hint":"το όργανο ακύρωσης στο πλευρό του κεφάλι ήχου","info":"Ο φαινόμενος λέπτος είδος μήτρας δέξιος για να βρίσκεται στον ακρώτηρα του αυτιού· Διαθέτει επίσης το σύστημα ισοζυγίου.'
  body.elbow:
    label: Αγκώνι
    summary: Κάπτρωση για το βραχίονα· το όνομα προέρχεται από το «λόκ».
    info: Το αγκώνι είναι ένας κάπτρωση στη δεξιόλευκή πλευρά του χέρι για να μπορεί να φθάνει το βραχίονας και να λύνει το ρόμβο. Δίδει τη δυνατότητα να σφίγγει και να ανοίγει το όργανο και να στρέφει το υποχέρι. Ενδιαφέρον είναι το γεγονός ότι στο αγκώνι δεν υπάρχουν αισθητικές κύψες.
  body.eye:
    label: μάτι
    summary: Αισθητήριο όργανο για την όραση με βαφτό."}
    info: '{"hint":"το όργανο της θέασης","info":"Ο ανθρώπινος μάτι διακρίνει περίπου εβδόμη σχεδόν και νύξη για φως λυχνίας.'
  body.eyebrow:
    label: βλεφαρίδι
    summary: Λωρίδα τριχών πάνω από κάθε μάτι· κεντρικός στοιχείος για την έκφραση.
    info: Ο βλεφαρίδιο είναι μια λωρίδα τριχών πάνω από κάθε άνω ρогή. Δημιουργεί συστέγαζε για να διακρίνουμε πιο εύκολα τις εξωτερικές φράσεις.
  body.eyelash:
    label: Μαλάκα
    summary: Σειρά κυρτών χριστών στη ζώνη του ματιού.
    info: Οι μαλάκες είναι σύντομα κυρτωπό ρέστα που βγαίνουν από τη θήκη για να προφυλάξουν το μάτι από σκόνη, δάχτυλα λίπους και φθορές.Ένας ενήλικας έχει 100–150 μαλάκες στο πάνω μάτι και 50–75 στο κάτω.
  body.finger:
    label: Δάχτυλο
    summary: Είναι η πρώτη από τις πέντε νύσσες.
    info: Ένας δάχτυλο του χεριού είναι ένα από πέντε συνολικά· μόνο o κώδωνas φέρει δύο νύσσες για λόγους βολήματος.
  body.foot:
    label: Πόδι
    summary: Το κάτω μέρος του ποδιού, πάνω στο οποίο στέκουμε.
    info: '{"hint":"η κάτω άκρη του ποδιού από μεσα στο γόνατο","info":"Η ρίγχος φέρει βάρος όλου του σώματος και εξυπηρετεί δίποδη πορεία .Έχει 26 οστά ,33 αρθρώσεις και πάνω από 100 μύες νήματα λώροι."}'
  body.forehead:
    label: Μύτη
    summary: Πρόσωπο της κεφαλής πάνω από τους γρουγκούς· επιφάνεια έκφρασης συναισθημάτων.
    info: Η μύτη είναι το πρόσωπο αυτής η κεφαλική σχάρα υψώματος γρουγκών και βρίσκεται πάνω απ' το φέρεγγα διπλανό να τη λεξιβάθμιδα των μαλλιών. Διαδραματίζει σημαντικό ρόλο στην έκφραση συναισθημάτων - οι σταυρωμένες μύτες εκφράζουν ανησυχία.
  body.hair:
    label: Μάλλινα
    summary: Συρματοειδή που βγαίνουν από την επιδερμίδα του κεφαλιού
    info: |-
      Τα μάλλινα είναι συρματοειδή από κερατίνη που βγαίνουν από τα λοβές ριζών θρύψων στο κεφάλι
      Έχουμε φυσικά γύρω στα δέκα χιλιάδες νύχια στο κεφάλι· καθ’ ημέρα πέφτουν περίπου πενήντα έως εκατό,
      Αυξάνονται περίπου 1,25cm τον μήνα.
  body.hand:
    label: Χέρι
    summary: Η τµήµα µανίσκας που τελειώνει µε πέντε δάχτυλα.
    info: Το ανθρώπινο χέρι είναι ιδανικό και περήφανο μηχάνημα του σώματος για να δύνεται να λευκωλογείσει βαρβάζοντας φράγκα, όπως γράψιμο, ζωγραφική ή ραΐσιμο.
  body.head:
    label: κεφαλή
    summary: Θηλυκό πρόσωπο που ανήκει σ' έναν άνθρωπο.
    info: '{"hint":"η κορυφαία μέρους του ανθρώπινου σώματος περιλαμβάνωντας εγκέφαλο και όργανο","info":"Η ΚΕΦΑΛΗ περιλαμβάνει νύχια για φόδρα διαστήματος λεξιλογίου· ΔΥΟ ΓΙΝΟΜΕΝΩΣ ΑΠΌΔΡΟΜΟΥ ΠΟΤΕΡΟΥ ΜΕΓΑΛΉΣ ΕΚΒΆΣΕΩΣ.","label":"κεφαλή","summary":"Ένα βασικό μέρος του σώματος."}'
  body.heart:
    label: Καρδιά
    summary: Μύς που αντλεί αίμα σ' όλο το σώμα συνεχώς.
    info: '{"hint":"το όργανο που απεικονίζει τη δύναμη συσπάσεως και ελέχθη με βάση έξι φόρμουλες","info":"Ο γυμναστής λειτουργεί ως νεφρώδης αποβλήτιση - αποτελείται από μια σειρά από αντιστάσεις που επιτρέπουν την απορρόφηση των αποβλήτων.","label":"Γυμναστής","summary":"Σύστημα αποβλήτισης που χρησιμοποιεί αντιστάσεις."}'
  body.heel:
    label: πατούσινγκ
    summary: Το πίσω μέρος του σπάθου · Δέχεται το βάρος του σώματος
    info: |-
      Η πατούσινγκ είναι η μεγαλύτερη κόκκαλο του σπάθου γυμνής νύχας χέρι απ' τη βάση δωδεκαβάφτιζε φυλλώματος·
      Στη λειτουργία του στήριξης φορτίζει το μεγαλύτερο μέρος του βάρους
      Ο πατούσινγκ είναι συνδεδεμένος με την τενόντωση Achilles,
      Πόνος στην πατούσινγκ (Plantar Fasciosis), είναι μία απ’ τις πιο συχνές παθήσεις του σπάθου
  body.hip:
    label: Πλάγιο
    summary: Η περιοχή που βρίσκεται λίγο πάνω από τη μαστοκυφική σύμβαση.
    info: Το πλάγιο είναι η περιοχή γύρω από τη μαστοκυφική σύμфизη όπου καθώς φέρνει βάρος διαδραματίζει σημαντικό ρόλο κατά τη νύξη.
  body.jaw:
    label: Μάγος
    summary: Κάτω κόκκαλο του προσώπου που κινείται κατά την χύβιση.
    info: Η μάγος είναι η πιό σημαντική κινητή του αρχέλευση όπως λέγεται γι' αυτό δύνεται να φθάνει σε βαφτιζόμενες στον πρώτο θάλαμο.
  body.kidney:
    label: Νεφρό
    summary: Ζευγαρωτό όργανο που διοξύνει το αίμα και παράγει ούρα.
    info: Οι νεφροί είναι ζευγαρωτά όργανα σχήματος φασκόλου που βρίσκονται μπροστά από τη κοιλιακή δέσμη. Διοξύνουν περισσότερα από 180 λίτρα αίμα την ημέρα για να παράγουν 1–2 λίτρα ούρων.
  body.knee:
    label: Γόνατο
    summary: Πρώτο αρθρωτικό σημείο που συνδέει την ποδιά με τον γονατο.
    info: Το γόνατο είναι το μεγαλύτερο αρθρωτικό σημείο που υπάρχει και ένας από τους πιο δυσδιάκριτους φυσικές λεπτομέρειες. Αποτελείται από τη βήτα, τα νεφρώδη, τα διαβαζόμενα και τα πλευρικά συνδετικά.
  body.leg:
    label: ΠΟΔΙΑ
    summary: Το κάτω μέρος του σώματος από την κύστη.
    info: Η ποδιά έχει τρία μέλη - γόνατος, σκύλος και χέρι απ' το δώμα -, εξωγήσου να βαθυβάζει λεφτά φραγκάκια.
  body.lip:
    label: Ρόγχος
    summary: Ένα από τα δύο σφικτά άκρα της στοματικής περιοχής.
    info: To ρόγχος είναι ένα από τα δύο σφικτά μυϊκά πλέγματα που φράσεψη το στόμα και βρίσκονται γεμάτα νευρώνων λήξεις, κάνοντας τα πολύ ευαίσθητα· η χρωματική τους απόδοση οφείλεται στην αιμάτωση · πράσινοι ρόγχοι μπορεί να δείξουν ιατρικό πρόβλημα.
  body.liver:
    label: Ήπαρ
    summary: Το μεγαλύτερο εξωτερικό όργανο - «Χημικό εργαστήριο».
    info: Ο ήπαρς είναι το μεγαλύτερο όργανό σου και βάζει πάνω από 1,5 κιλά. Δημιουργεί λέπτο για να διασπά τη φυσική, καθώς επίσης σχηματίζει πρωτεΐνες και αποθηκεύει glycogeno. Είναι το μόνο όργανο που μπορεί να αναδομηθεί πλήρως από το υφιστάμενο μέρος.
  body.lung:
    label: ӈ
    summary: ""
    info: Οι πνεύμονες είναι ζευγαρωτά όργανα στη μπρόστα του σώματος και αποτελούνται από εκατομμύρια φυσαλίδες - λέχθυγξες. Το συνολική διάμετρος των λέβητων στους νεφρούς είναι γύρω στα 70m².
  body.mouth:
    label: Stoma
    summary: Πόρος στο πρόσωπο που χρησιμοποιείται για να φάγετε, να πιετε και να μιλήσετε.
    info: '{"hint":"το άνοιγμα στη γεύση που χρησιμοποιείται για τη φάγω και να μιλήσω","info":"Ο αυχένας εκκινεί διαδικασία - Δόντια βοηθούν να λύσουν, η σάλια το διαφθείρει.Είναι επίσης το κύριο εργαλείο για να μιλώ και να επικοινωνώ.","label":"Στόμα","summary":"Άνοιγμα στο πρόσωπο που υπηρετεί για να φάγω , να πιω και να μιλήσω."}'
  body.muscle:
    label: ΜΥΣ
    summary: Η συρρίξιμη ίνα που επιτρέπει την κίνηση.
    info: "Ένα μυς είναι ιστός που συρρικνώνεται και δημιούργων την απαραίτητη ώθηση για να λάβει φυσική κίνηση. \nΟ ανθρώπινος σώμα έχει περισσότερους από 600 μύς – το 40% βάρους του σώματος -\nΑπό αυτούς , o masseter(διψφαγέτης ) είναι ο πλέον ισχυρός μυς,\no μικρότερος είναι η στρόφυλος μύς."
  body.nail:
    label: Νύξ
    summary: Σκληρή πλάκα από κατσούφι στο τέλος των δακτύλων.
    info: Οι νύχες είναι σκληρές πλάκες από κατσούφι στο τέλος όλων των δακτύλων μας· Προστατεύουν τα ευθραυστά λοβάδια των δακτύλων και βελτιώνουν τη γραμμή φραγμού για μικρά αντικείμενα.
  body.neck:
    label: Λαιμός
    summary: Η περιοχή που συνδέει το κεφάλι με το σώμα.
    info: Το λαιμός είναι η περιοχή μεταξύ του κρανίου και της σπλάγνων ακριβώς όπως γράφεται.
  body.nose:
    label: νόσος
    summary: Όργανο αξιολόγησης της μυρωδιάς και αναπνοής στη μέση του προσώπου.
    info: '{"hint":"ο όργανο που αισθάνεται τη μυρωδιά και βρίσκεται στο εμπρός μέρος του έχει δύο λειτουργίες","info":"Το νос φίλτραρε ,ζεβγήνει και γεμίζει με υγρασία το αναπνεόμενο αέρα . Διακρίνει πάνω από ένα δισεκατομμύριο διαφορετικές μυρώδιες και είναι στενά συνδεδεμένο με τη μνήμη και τις συναισθηματικές αντιδράσεις.","label":"νόσος","summary":"Οργανο αξιολόγησης της μυρωδιάς και αναπνοής στη μέση του προσώπου."}'
  body.palm:
    label: Παλάμη
    summary: Εσωτερική επιφάνεια του χεριού
    info: Η παλάμη είναι το μέρος από κει έξω στη ρύγκου γυμνή δέρμα να φθάσει στο λώρο· Διαχειρίζεται βαφτιστικό δίκτυο από αισθητήρες αγγίγματος - Meissner's corpuscles · Δεν υπάρχουν τρίχες ή σβεδία.
  body.shoulder:
    label: ΩΜΟΣ
    summary: Γάλακτας που συνδέει τη χείρα με το σώμα.
    info: Το ώμος έχει τη μέγιστη εύρεση κίνηση από παντού στους γάλακτες των δυνατών βδομάδων. Διαθέτει λεβήτα φαινόμενο από την κεφαλή της χείρας και τη νύξη της σκάφης.
  body.skin:
    label: χ
    summary: Μεγαλύτερος οργανισμός ; προστασία, θερμορύθμιση & αίσθηση
    info: "Η δερματική επάγλυφος πόρτη του σώματος και η μεγαλύτερη ανθρωπίνη όσγα να φέρει γι' αυτό λεχτερια βάζει περίπου 2m² \nΠροσφέρει προστασία από λοιμώξεις ,UV ακτινοβολία,διατηρεί τη θερμοκρασία του σώματος, αισθητική αντίληψη και σύνθεση Vitamin-D\nΟι κύτταροι της εξωτερικής στιβάδας ανανεώνονται περίπου 2 - 4 εβδομάδες .\nΣε κάθε τετραγωνικό εκατοστό επιφάνειας ζουν πάνω από ένα εκατομμύριο βακτήρια."
  body.spine:
    label: Σπονδύλι
    summary: Ένας ράβδος από 33 φτερωτά για να βγάζει λύσεις.
    info: Η σπονδύλια είναι ένας ράβδος από τρισήμερους μηχανικές πυθμένων και δομών.
  body.stomach:
    label: Γαστρικός
    summary: Το μέρος του σώματος που βρίσκεται από κάτω από τη στήθιγχμα.
    info: Ο γαστρικός χώρος είναι το μέρος που βρίσκεται από κάτω από τη στήθιγχμα έως τη λευκόδερμη δύναμη· φυλασσει τα νεφρά, το στομάχι, τον ήπαρ, την πάγκρεας και την σπλήνα.
  body.temple:
    label: Σπάνο
    summary: Μαλακή περιοχή στα πλάγια του μετωπιαίου βραχίονα.
    info: Η περιοχή στα μπουμπούκια της κεφαλής είναι ανατομικά η λέξωση ως «θυγατρώδη» δομή του γονίου φλοιού του κρανίου – μια ασθενέστερη περιοχή που είναι ευάλωτη σε νευροϊόν.
  body.thigh:
    label: Μηρός
    summary: Τμήμα πόδι μεταξύ γονάτιδα & γόνατος· δυνατότερη νεφρή.
    info: Ο μηρός είναι το κάτω άκρο απ' όλα σώμα που βρίσκεται μεταξύ της γονάτιδας και του γόνατος. Διέθετε τη δυνατότερη νεφρή φυγάδα του σώματος - το quadriceps λεχτικό και hamstrings.
  body.throat:
    label: Λαιμός
    summary: Η κοιλότητα που συνδέει το στόμα με το στομάχι.
    info: Το λαιμός είναι η κοιλότητα που βρίσκεται μπροστά από το σώμα γλωσσής ρέθβης και διαδραματίζει ρυθμιστικό ρόλο στη νύχτα φαγητού και την αναπνοή.
  body.thumb:
    label: Δάχτυλο
    summary: Σύντομο, παχύ δάχτυλο στο χέρι· H κινηματική βολή των δακτύλων είναι κλειδί για την ανθρώπινη χειραγώγηση.
    info: "Το δάχτυλο είναι το μικρό και παχύ πρώτο χέρι σε θέση να γίνει απήχης (δηλαδή να φτάνει στους λοιπούς). \nΗ κινηματική βολή των δακτύλων είναι κλειδί για την ανθρώπινη χειραγώγηση με εργαλεία,\nΠροέρχεται από την εξέλιξη και είναι παρούσα μόνο στα πρωτεΐδια."
  body.toe:
    label: Δάχτυλο ποδιού
    summary: Ένα από τα πέντε δάχτυλα του ποδιού · το λάθος φροντίζει για την ορθή πορεία
    info: |-
      Πέος του πόδα είναι ένα από τα δύο χιλιάρικτες νυχισμένα και μη σφαιρωτή γιγνώσκοντα βλέψεις·
      Το λάθος φροντίζει για την ισορροπία και την αξιοποίηση
      Σε αντίθεση με τα πρωτότυπα ΔΕΝ μπορεί να κάνει «opposition»
  body.tongue:
    label: Γλώσσα
    summary: Μυϊκό όργανο στο στόμα για γεύση, χειρισμό τροφής και λόγο.
    info: Η γλώσσα είναι μυϊκό όργανο που καπελωμένη από τις οχήτες γεύσης (πάνω από 10.000). Διευκολύνει στη διαφοροποίηση των βασικών γεύσεων - γλυκό, αλμύριστο, νιτριδικό, πικρό και umami – και φέρνει λεξιλογική ανάπτυξη.
  body.tooth:
    label: Δόντι
    summary: Σκληρή περιοχή στο στόμα για το ρίψιμο.
    info: Ένα δόντι είναι μια σκληρή περιοχή αποτελουμένη από τσάμβα ή λεγόμενο χώδως φθορίτη (η πιο σκληρή βιοϊστία) και νυφτίτη· γύρω απ' αυτό υπάρχει η περιφερειακή κοιλότητα. Ένας άνθρωπος έχει 32 δόντια στο σταθερό του χείλιο. Δεν αναπτύσσεται πάλι τσάμβας μετά από απώλεια – οι προληπτικές προσπάθειες είναι απαραίτητες.
  body.vein:
    label: Φλέβα
    summary: Αγγειοτράχη που μεταφέρει αξιοποιημένο αίμα στη καρδιά · Φαίνεται στο λεπτό
    info: "Η φλέβα είναι αγγειοτράχη που μεταφέρει το αίμα ξανά στη καρδιά\nΔιαφορετική δόση ως από νωθρών γυάλινες βαλβίδες που εμποδίζουν την αντίστροφη ροή του αίματος,\nΟ μπλεύψη φλεβών στο λεπτό είναι οπτικό φαινόμενο·\nΤο αίμα στις φλέβες είναι σκούρο κόκκινο, \nΌχι μπλε"
  body.wrist:
    label: Σύνδεσμος
    summary: Κλειδί για την ακριβή κινητική.
    info: Ο σύνδεσμος που επιτρέπει τη μετακίνηση και ρόλω η αγχίνη δυο φορά γίνεται από τον βραχιώνα λόγω της σύνθεσής του από νφβξ οστά.
