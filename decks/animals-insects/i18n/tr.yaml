lang: tr
pivot: false
title: Böcekler
cards:
  insect.ant:
    label: karınca
    summary: Koloniler halinde yaşayan küçük bir toplumsal böcek.
    info: Karınca, görevlerin paylaşımıyla büyük koloniler oluşturan bir böcektir.
  insect.bee:
    label: balıç
    summary: Çiçekleri tozlayan ve bal üreten sarışın böcek.
    info: Bal arısı (apis mellifera), sadece bal yapmakla kalmaz aynı zamanda çiçeklerin tozu ile bitkiler arasında polen taşıyan önemli bir rol oynar.
  insect.butterfly:
    label: kelebek
    summary: Büyük renkli kanatlı uçan böcek.
    info: Kelebekler genellikle dikkati çeken renkli iki çift tınlı kanata sahip olan böcektir.
  insect.dragonfly:
    label: sivrisinek
    summary: Uzun bedenli ve iki çift büyük şeffaf kanatlı böcek.
    info: Sivrisinekler su kenarlarında avlayan gözleriyle dikkat çeken yırtıcı böceklerdir.
  insect.ladybug:
    label: böcek
    summary: Küçük yuvarlak kırmızı böcek siyah noktalarla.
    info: Böcek, bitlerle beslenir ve bahçede faydalıdır.
