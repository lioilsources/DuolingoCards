lang: tr
pivot: false
title: Böcekler
cards:
  insect.butterfly:
    label: kelebek
    summary: Büyük renkli kanatları olan uçan bir böcek.
    info: Kelebek, çoğu zaman canlı renklere sahip, pullarla kaplı iki çift kanadı olan bir böcektir.
  insect.bee:
    label: arı
    summary: Çiçekleri tozlaştıran ve bal yapan sarı-siyah bir böcek.
    info: Bal arısı, kovanlarda yaşayan ve nektar toplayan sosyal bir böcektir.
  insect.ladybug:
    label: uğur böceği
    summary: Siyah noktalı, küçük, yuvarlak, kırmızı bir böcek.
    info: Uğur böceği, yaprak bitleriyle beslenen ve bahçede faydalı olan küçük bir kın kanatlıdır.
  insect.dragonfly:
    label: yusufçuk
    summary: Uzun gövdeli ve iki çift saydam kanatlı bir böcek.
    info: Yusufçuk, su yüzeyi yakınında avlanan, mükemmel görüşe sahip bir yırtıcıdır.
  insect.ant:
    label: karınca
    summary: Kolonilerde yaşayan küçük, sosyal bir böcek.
    info: Karınca, iş bölümüyle büyük koloniler oluşturan bir böcektir.
  insect.beetle:
    label: kın kanatlı böcek
    summary: Kın kanatlılar, 400.000'den fazla tanımlanmış türle böceklerin en büyük takımını oluşturur.
    info: |
      Kın kanatlı böcek, Coleoptera takımına aittir ve tanımlanmış tüm böcek türlerinin yaklaşık %40'ını oluşturur.
      Gerçek uçuş kanatlarını gizleyen sert kanat kılıflarıyla (elitra) tanınır.
      Geyik böceği, Avrupa'nın en büyük kın kanatlısıdır; erkeği boynuza benzeyen güçlü çeneler taşır.
      Kın kanatlılar, tropiklerden kutup bölgelerine kadar hemen her ortamda yaşar.
  insect.grasshopper:
    label: çekirge
    summary: Uzun arka bacakları ve cırıltılı sesi olan zıplayan bir böcek.
    info: |
      Çekirge, gövde uzunluğunun yirmi katına varan sıçramalar yapabilen güçlü arka bacaklara sahip, Orthoptera takımından bir böcektir.
      Erkekler, bacaklarını kanatlarına sürterek karakteristik bir ses (stridülasyon) çıkarır.
      Bitkilerle beslenir ve büyük sürüler halinde ekinlere zarar verebilir.
  insect.cricket:
    label: cırcır böceği
    summary: Erkeklerinin ötüşüyle ünlü, gece etkin bir böcek.
    info: |
      Tarla cırcır böceği, Orthoptera takımından gece etkin bir böcektir.
      Erkekler, dişileri çekmek ve bölgelerini işaretlemek için kanatlarını birbirine sürterek öter.
      Asya'da cırcır böcekleri, ötüşleri için eskiden beri evcil hayvan olarak beslenir.
      Birçok kültürde ayrıca ev huzurunun ve şansın simgesidir.
  insect.mosquito:
    label: sivrisinek
    summary: İki kanatlı bir böcek; dişisi kan emer ve hastalık bulaştırabilir.
    info: |
      Sivrisinek, Culicidae familyasından iki kanatlı bir böcektir.
      Dişiler, yumurtaların gelişimi için gereken proteini almak üzere hayvanların kanını emer; erkekler nektarla beslenir.
      Sivrisinekler sıtma, dang humması ve zika gibi tehlikeli hastalıkları bulaştırır.
      Dünyada 3.500'den fazla sivrisinek türü vardır.
  insect.fly:
    label: sinek
    summary: Bakteri taşıyabilen, çok yaygın iki kanatlı bir böcek.
    info: |
      Karasinek, insan konutlarında en yaygın iki kanatlı böcektir.
      Petek gözleri, çevresinde neredeyse 360 derece görmesini sağlar.
      Hem atıklara hem de yiyeceklere konduğu için bakteri taşır.
      Yalnızca bir çift işlevsel kanadı vardır; ikinci çift (denge organları) uçuş sırasında dengeyi korumaya yardımcı olur.
  insect.moth:
    label: gece kelebeği
    summary: Kelebeğin gece etkin akrabası; ışığa uçar ve tüylü antenleri vardır.
    info: |
      Gece kelebekleri, gündüz kelebeklerinin aksine dinlenirken kanatlarını gövdenin yanlarına katlayan gece etkin pul kanatlılardır.
      Birçok tür yapay ışığa çekilir.
      Doğal ipeği ipek böceğinin tırtıllarına borçluyuz.
      Ay kelebeği (luna), dünyanın en güzel gece kelebeklerinden biridir.
  insect.caterpillar:
    label: tırtıl
    summary: Bir kelebeğin larvası; yaprak yer ve pupa olmaya hazırlanır.
    info: |
      Tırtıl, bir kelebeğin larva evresidir ve yaşamını çoğunlukla, dönüşüm için enerji biriktirmek amacıyla yaprak yiyerek geçirir.
      Bazı tırtıllar, zehirli olduklarını yırtıcılara bildiren çarpıcı renklere sahiptir.
      Pupa olurken, tam dönüşümün (başkalaşımın) yetişkine dek gerçekleştiği bir pupa (koza) oluşturur.
  insect.praying_mantis:
    label: peygamber devesi
    summary: Dua eder gibi duran ve yıldırım hızıyla saldıran yırtıcı bir böcek.
    info: |
      Peygamber devesi, Mantodea grubundan yırtıcı bir böcektir.
      Adını, ön bacaklarını dua eder gibi katlı tuttuğu duruştan alır.
      Usta bir avcıdır; saniyenin bir kesrinde avına vurup onu yakalar.
      Dişi, çiftleşmeden sonra bazen erkeği yer, ancak bu her zaman olmaz.
  insect.stick_insect:
    label: çubuk böceği
    summary: Bir dalı ya da yaprağı kusursuzca taklit eden bir böcek.
    info: |
      Çubuk böceği, Phasmatodea grubuna aittir ve kamuflaj ustasıdır; gövdesi dalları ya da yaprakları kusursuzca taklit eder.
      Tehlike anında tamamen hareketsiz kalır.
      Bazı türler, yani erkek olmadan, tek eşeyli üreme (partenogenez) ile çoğalır.
      Kolay bakımları sayesinde popüler egzotik ev hayvanlarıdır.
  insect.firefly:
    label: ateş böceği
    summary: Eş çekmek için biyolüminesans ışıkla parlayan bir kın kanatlı.
    info: |
      Ateş böceği, karnında soğuk ışık (biyolüminesans) üretebilen, Lampyridae familyasından bir kın kanatlıdır.
      Erkekler ve dişiler, birbirlerini tanımak ve çekmek için farklı desenlerde parlar.
      Işık, lusiferinin lusiferazla girdiği kimyasal tepkimeyle denetlenir.
      Ateş böcekleri, temiz bir çevrenin göstergesidir.
  insect.wasp:
    label: yaban arısı
    summary: Kâğıt yuvalar yapan, sokan sarı-siyah bir böcek.
    info: |
      Adi yaban arısı, tipik sarı-siyah uyarı renklerine sahip, Vespula grubundan sokan bir böcektir.
      Çiğnenmiş odun hamurundan kâğıt yuvalar yapar.
      Balarısının aksine, yaban arısı defalarca sokabilir.
      Zararlı böceklerin doğal düzenleyicisi olarak faydalıdır.
  insect.cockroach:
    label: hamam böceği
    summary: Hızlı, gece etkin, her şeyi yiyen bir böcek; çok dayanıklı ve uyumlu.
    info: |
      Hamam böceği, dünyanın en dayanıklı böceklerinden biridir; radyasyona ve başka hayvanları öldürecek koşullara dayanır.
      4.500'den fazla tür vardır, ancak yalnızca 30 kadarı insanın yakınında yaşar.
      Eski bir böcektir; hamam böcekleri 300 milyon yıldan uzun süredir vardır ve dinozorlardan sağ çıkmıştır.
      Hızlıdır ve saatte 5 km'den fazla koşabilir.
  insect.spider:
    label: örümcek
    summary: Böcek yakalamak için ağ ören, sekiz bacaklı bir örümceğimsi.
    info: |
      Örümcek, sekiz bacaklı ve iki parçalı gövdesi olan, Araneae takımından bir örümceğimsidir (böcek değildir).
      Avlanmak ya da yumurta kozalarını sarmak için ağlar ördüğü ipek üretebilir.
      Dünyada 48.000'den fazla örümcek türü yaşar.
      Bütün türler zehir üretir, ancak büyük çoğunluğu insan için zararsızdır.
  insect.scorpion:
    label: akrep
    summary: Kıskaçları ve kıvrık zehirli kuyruğu olan zehirli bir örümceğimsi.
    info: |
      Akrep, tipik kıskaçları ve zehirli bir iğneyle biten kıvrık kuyruğu olan bir örümceğimsidir (böcek değildir).
      Eski bir hayvandır; en eski akrep fosilleri 430 milyon yıldan yaşlıdır.
      Karanlıkta morötesi ışık altında floresan verirler.
      Yaklaşık 2.500 türden yalnızca 25 kadarı insan için tehlikelidir.
  insect.centipede:
    label: kırkayak
    summary: Her gövde halkasında bir çift bacağı olan bir çok ayaklı.
    info: |
      Kırkayak, Chilopoda sınıfına aittir ve her gövde halkasında bir çift bacağı vardır (İngilizce adının ima ettiği gibi yüz bacağı yoktur).
      Böcekleri, solucanları ve küçük omurgalıları yakalayan hızlı bir yırtıcıdır.
      İlk bacak çifti, avı felç eden zehirli pençelere dönüşmüştür.
      Bazı tropik türler 30 cm'den uzun olur.
  insect.flea:
    label: pire
    summary: Memelilerin ve kuşların kanını emen minik, zıplayan bir asalak.
    info: |
      Pire, asalak yaşama uyum sağlamış, Siphonaptera takımından kanatsız bir böcektir.
      Güçlü arka bacakları, gövde uzunluğunun 150 katından fazla sıçramalar yapmasını sağlar.
      Memelilerin ve kuşların kanını emer ve hastalık bulaştırabilir; tarihte pireler vebayı yaymıştır.
      Pireler, böcekler dünyasının akrobatlarıdır.
  insect.termite:
    label: termit
    summary: Topraktan devasa tepeler inşa eden sosyal bir böcek.
    info: |
      Termit, hamam böcekleriyle uzaktan akraba olan, Isoptera grubundan sosyal bir böcektir.
      Bir kral, bir kraliçe, askerler ve işçilerle kolonilerde yaşar.
      Kendi havalandırma sistemi olan, tropiklerde 9 metreye kadar yükselen karmaşık termit yuvaları inşa eder.
      Odunun önemli ayrıştırıcıları olarak, tropik ekosistemlerde kilit rol oynar.
  insect.bumblebee:
    label: bombus arısı
    summary: Derin bir vızıltısı olan büyük, tüylü bir arı; önemli bir tozlaştırıcı.
    info: |
      Bombus arısı, bal arısıyla akraba olan, Bombus cinsinden büyük ve tüylü bir böcektir.
      Özellikle arıların daha az uçtuğu daha soğuk iklimlerde önemli bir tozlaştırıcıdır.
      Uçuş kaslarını titreterek ısınabilir, böylece soğukta bile uçar.
      Bombus arıları, yaban arılarından daha uysaldır ve yalnızca doğrudan tehdit altında sokar.
  insect.hornet:
    label: eşek arısı
    summary: Güçlü iğnesi ve yüksek vızıltısı olan Avrupa'nın en büyük yaban arısı.
    info: |
      Eşek arısı, Avrupa'nın en büyük sosyal yaban arısıdır ve 3,5 cm'den uzun olur.
      Ağaç kovuklarında ya da çatı altlarında kâğıt yuvalar yapar.
      İğnesi yaban arılarınınkinden uzun, sokması daha acı vericidir, ancak eşek arısı yalnızca doğrudan tehdit altında saldırır.
      Başka böceklerin önemli bir yırtıcı düşmanıdır.
  insect.cicada:
    label: ağustos böceği
    summary: Sıcak günlerde yüksek sesli ötüşüyle ünlü bir böcek.
    info: |
      Ağustos böceği, tüm böcekler arasındaki en yüksek seslerden biriyle ünlü, Cicadoidea üst familyasından bir böcektir.
      Erkekler, dişileri çekmek için karınlarındaki özel zarlarla (timbal) sesi üretir.
      ABD'deki bazı türlerin on yedi ya da on üç yıllık gelişim döngüleri vardır.
      Larvalar yıllarca toprak altında yaşar ve köklerle beslenir.
  insect.locust:
    label: göçmen çekirge
    summary: Milyonlarca bireyden oluşan yıkıcı sürüler oluşturan göçmen bir çekirge.
    info: |
      Göçmen çekirge, belirli koşullar altında devasa göçmen sürüler oluşturan bir çekirge türüdür.
      Bir sürü milyarlarca birey sayabilir ve tek bir günde binlerce hektardaki ekinleri yok edebilir.
      Afrika ve Asya ülkelerinde çekirgeler, tarihsel olarak en büyük tarım felaketlerinden biridir.
      İncil'de Mısır'ın on belasından biridir.
  insect.aphid:
    label: yaprak biti
    summary: Bitki saplarındaki minik, emici bir böcek; ballı çiy üretir.
    info: |
      Yaprak bitleri, bitki özsuyuyla beslenen, Aphidoidea üst familyasından küçük emici böceklerdir.
      Karıncaların koruma karşılığında baktığı tatlı bir ballı çiy üretirler.
      Son derece hızlı çoğalırlar; tek bir dişi bir yılda yüz milyonlarca döle yol açabilir.
      Tarım ekinlerinin önemli zararlılarıdır.
  insect.earwig:
    label: kulağakaçan
    summary: Karnının ucunda kıskaçları olan uzun bir böcek.
    info: |
      Kulağakaçan, karnının ucunda savunma ve çiftleşme için kullanılan kıskaçlarla (serkus) tanınan, Dermaptera takımından bir böcektir.
      Adı, insanların kulağına girdiği batıl inancından gelir; bu bir efsanedir.
      Dişi kulağakaçanlar, yumurtalara ve genç larvalara baktıkları için sıra dışıdır; bu, böcekler arasında nadirdir.
      Çatlaklarda, taşların altında ve döküntü tabakasında yaşarlar.
  insect.silverfish:
    label: gümüşçün
    summary: Evlerde kitapların ve kâğıtların yanında bulunan, kanatsız hızlı bir böcek.
    info: |
      Gümüşçün, konutlarda yaşayan, Zygentoma takımından ilkel ve kanatsız bir böcektir.
      Nişasta, kâğıt, ciltçi tutkalı ve tekstil lifleriyle beslenir.
      Adı, gümüş renginden ve balığımsı hareketinden gelir.
      En eski böcek takımlarından birine aittir ve 300 milyon yıldan uzun süredir neredeyse değişmeden yaşar.
  insect.water_strider:
    label: su yürüteci
    summary: Yüzey gerilimi sayesinde su yüzeyinde yürüyen bir böcek.
    info: |
      Su yürüteci, bacaklarındaki su itici kıllar ve suyun yüzey gerilimi sayesinde su üstünde yürüyebilen, Gerridae familyasından bir böcektir.
      Suya düşen böcekleri avlar; onları yüzeydeki titreşimlerden tanır.
      Hızlıdır ve su üstünde saniyede gövde uzunluğunun 150 katından fazla kayabilir.
  insect.dung_beetle:
    label: gübre böceği
    summary: Gübre topları yuvarlayan, Antik Mısır'da kutsal sayılan bir kın kanatlı.
    info: |
      Kutsal bok böceği, gübreyi toplar halinde şekillendirip gömmek ve içine yumurta bırakmak için yuvarlayan, Scarabaeidae familyasından bir kın kanatlıdır.
      Antik Mısır'da güneşin ve tanrı Khepri'nin simgesiydi.
      Samanyolu'na göre yön bulan az sayıda hayvandan biridir.
      Besin maddelerinin döngüsüne ve toprağın havalanmasına yardımcı olur.
  insect.stag_beetle:
    label: geyik böceği
    summary: Avrupa'nın en büyük kın kanatlısı; erkeği boynuza benzeyen çenelere sahip.
    info: |
      Geyik böceği, Avrupa'nın en büyük kın kanatlısıdır ve 7 cm'den uzun olur.
      Erkeği, dişiler için yapılan dövüşlerde kullanılan, boynuza benzeyen kocaman çenelere sahiptir.
      Larvası, çürümüş meşe odununda 7 yıla kadar yaşar ve mantarlarla beslenir.
      Eski ormanların ve ölü odunun yok olması nedeniyle ciddi biçimde tehdit altındadır.
  insect.atlas_moth:
    label: atlas kelebeği
    summary: Kanatları yılan deseniyle süslü, dünyanın en büyük gece kelebeklerinden biri.
    info: |
      Atlas kelebeği, 30 cm'ye varan kanat açıklığıyla dünyanın en büyük gece kelebeklerinden biridir.
      Kanat uçları, yırtıcıları korkutan yılan başlarına benzeyecek biçimde renklidir.
      Yetişkinlerin ağzı yoktur ve hiç beslenmez; yalnızca birkaç gün yaşarlar.
      Güneydoğu Asya'nın tropik ormanlarından gelir.
  insect.weevil:
    label: hortumlu böcek
    summary: Karakteristik uzun bir hortumu olan küçük bir kın kanatlı.
    info: |
      Hortumlu böcek, 60.000'den fazla türle dünyanın en büyük hayvan familyası olan Curculionidae familyasından bir kın kanatlıdır.
      Karakteristik uzun hortumu (rostrum), tohumları, meyveleri ve gövdeleri delmeye yarar.
      Bazı türler, pamuk hortumlu böceği gibi ciddi tarım zararlılarıdır.
      Başka türler tek bir bitki türünde uzmanlaşmıştır.
  insect.lacewing:
    label: dantel kanatlı böcek
    summary: Saydam damarlı kanatları olan narin bir böcek; larvaları yaprak bitlerini avlar.
    info: |
      Dantel kanatlı böcek, narin, saydam damarlı kanatları ve altın rengi gözleri olan, Chrysopidae familyasından bir böcektir.
      Larvaları yırtıcıdır ve muazzam miktarda yaprak biti yiyerek bitkilerin doğal koruyucusu olur.
      Yetişkinler nektar ve polenle beslenir.
      Işığa çekilirler ve sağlıklı bir çevrenin göstergesidir.
  insect.crane_fly:
    label: tipula
    summary: Aşırı uzun bacaklı, sivrisineğe benzeyen büyük bir sinek.
    info: |
      Tipula, dev bir sivrisineğe benzeyen, ancak sokmayan ve asalaklık etmeyen, Tipulidae familyasından iki kanatlı bir böcektir.
      Aşırı uzun bacakları kolayca kopar; bu bir savunma düzeneğidir (otomi).
      Yetişkinler yalnızca birkaç gün yaşar ve ya beslenmez ya da nektarla beslenir.
      Larvaları toprakta yaşar ve köklerle beslenir.
  insect.mayfly:
    label: mayıs sineği
    summary: Yetişkin ömrü en kısa olan böcek; yalnızca saatler ya da günler yaşar.
    info: |
      Mayıs sineği, Ephemeroptera takımından bir böcek ve gelip geçiciliğin simgesidir; yetişkinler yalnızca saatler ya da günler yaşar.
      İşlevsel ağız organları yoktur ve hiç beslenmez.
      Larvaları 1 ila 3 yıl su altında yaşar.
      Mayıs sineklerinin kitlesel sürü uçuşu büyüleyici bir doğa gösterisidir; Macaristan'da Tuna üzerinde eşsiz bir olaydır.
  insect.damselfly:
    label: kızböceği
    summary: Yusufçuğun ince akrabası; dinlenirken kanatlarını gövde boyunca katlar.
    info: |
      Kızböceği, yusufçuklarla akraba, ancak daha ince bir böcektir ve büyük yusufçukların aksine dinlenirken kanatlarını gövdeye paralel katlar.
      Yırtıcıdır ve küçük böcekleri uçarken avlar.
      Larvaları suda yaşar ve su ekosistemlerinin önemli bir parçasını oluşturur.
      Su yollarının kalitesinin göstergesidir.
  insect.robber_fly:
    label: haydut sinek
    summary: Başka böcekleri tam uçuşta yakalayan yırtıcı bir sinek.
    info: |
      Haydut sinek, başka böcekleri doğrudan uçarken yakalayan, Asilidae familyasından yırtıcı iki kanatlı bir böcektir.
      Avı kavramak için güçlü bacakları ve felç edici zehir enjekte etmek için sokucu bir hortumu vardır.
      Bazı türler, yırtıcılara karşı korunmak için bombus ya da yaban arılarının görünümünü taklit eder.
      Böcek popülasyonlarının doğal düzenleyicisi olarak faydalıdır.
  insect.ground_beetle:
    label: yer böceği
    summary: Taşların altında ve döküntü tabakasında yaşayan hızlı yırtıcı bir kın kanatlı.
    info: |
      Yer böceği, Carabidae familyasından bir kın kanatlıdır; türlerin çoğu, başka böcekleri, solucanları ve salyangozları yakalayan etkin gece yırtıcılarıdır.
      Hızlıdırlar ve tehlikeden hızla kaçarlar.
      Mor yer böceği gibi bazı türler, güzel bir metalik parlaklığa sahiptir.
      Sağlıklı toprağın ve doğal tarımın göstergesidir.
  insect.tiger_beetle:
    label: kaplan böceği
    summary: Mükemmel görüşe sahip, hızlı, metalik renkli bir kın kanatlı.
    info: |
      Kaplan böceği, olağanüstü hızı, uçma yeteneği ve keskin görüşüyle ünlü, Cicindelinae alt familyasından bir kın kanatlıdır.
      O kadar hızlı koşar ki, hareket görme sistemi için fazla hızlı olduğundan durup yeniden yön bulmak zorundadır.
      Güzel renkli metalik gövdeleri (yeşil, mavi, kırmızı) ve büyük gözleri vardır.
      Larvaları toprakta dikey tüneller kazar ve girişte av bekler.
  insect.hoverfly:
    label: çiçek sineği
    summary: Yaban arılarının ve arıların renklerini taklit eden bir sinek; bahçelerin tozlaştırıcısı.
    info: |
      Çiçek sineği, sokmamasına rağmen yırtıcılara karşı korunmak için yaban arılarının ve arıların renklerini taklit eden (Bates taklitçiliği), Syrphidae familyasından iki kanatlı bir böcektir.
      Önemli bir tozlaştırıcıdır; arılardan daha çok bitki türünü ziyaret eder.
      Yetişkinler nektar ve polenle beslenir.
      Bazı türlerin larvaları yaprak bitlerini avlar ve böylece bahçede yardımcı olur.
  insect.whirligig_beetle:
    label: girdap böceği
    summary: Su yüzeyinde sürüler halinde dönen küçük bir kın kanatlı.
    info: |
      Girdap böceği, yüzeyde yaşayan, Gyrinidae familyasından bir su kın kanatlısıdır ve sürüler halinde dönmesi yırtıcılardan kaçınmasına yardımcı olur.
      Gözleri iki parçaya bölünmüştür; biri suyun üstünü, diğeri altını görür.
      Yüzeydeki, yiyecek ya da tehlike işaret eden dalgacıkları algılar.
      Gündüz döner, gece uçar.
  insect.louse:
    label: bit
    summary: Memelilerin derisinde ve tüylerinde yaşayan minik, kanatsız bir asalak.
    info: |
      Bit, konağın derisinde ve tüylerinde ya da saçında yaşayan, Phthiraptera takımından kanatsız asalak bir böcektir.
      Kan emer ve kaşıntıya yol açar.
      Baş biti tüm dünyada bulunur ve hijyen koşullarından bağımsız olarak çocukları etkiler.
      Tarihte bitler tifüsü ve başka hastalıkları bulaştırmıştır.
  insect.bedbug:
    label: tahtakurusu
    summary: Geceleri kan emen yassı bir asalak; mobilyaların çatlaklarında saklanır.
    info: |
      Tahtakurusu, çoğunlukla geceleri etkin, Cimicidae familyasından yassı ve oval bir böcektir.
      Uyuyan konağı ısırır ve kanını emer.
      Yatağın çatlaklarında, mobilyalarda ve duvar kâğıtlarının ardında saklanır.
      Son on yıllarda, uluslararası seyahatler sayesinde tüm dünyaya yayılmıştır.
  insect.antlion:
    label: karınca aslanı
    summary: Kumda karıncalar için huni biçiminde tuzaklar kazan bir larva.
    info: |
      Karınca aslanı, kuru kumda koni biçiminde huniler kazan, Myrmeleontidae familyasından bir böceğin larvasıdır.
      Bir karınca tuzağa kaydığında, karınca aslanı onu çeneleriyle yakalar ve sindirim sıvıları enjekte eder.
      Yetişkinler göze çarpmaz, yusufçuklara benzer ve geceleri uçar.
      Larvalar, yıllarca yemeden toprak altında yaşayabilir.
  insect.goliath_beetle:
    label: golyat böceği
    summary: Tropik Afrika'dan, dünyanın en büyük ve en ağır böceklerinden biri.
    info: |
      Golyat böceği, dünyanın en büyük böceklerinden biridir; erkekleri 100 grama kadar ağırlıkta ve 11 cm'den uzun olur.
      Ekvator Afrikası'nın tropik yağmur ormanlarında yaşar.
      Yetişkinler meyve ve ağaç özsuyuyla beslenir.
      Afrika'da çocuklar onları bazen oyuncak olarak tutar ve bazıları koleksiyonculara satılır.
  insect.bombardier_beetle:
    label: bombardıman böceği
    summary: Savunma için kaynar zehirli bir karışım fışkırtan bir kın kanatlı.
    info: |
      Bombardıman böceği, benzersiz bir yolla savunma yapan, Brachininae alt familyasından bir kın kanatlıdır; karnında iki kimyasal maddeyi karıştırır ve bu, 100 dereceyi aşan patlayıcı bir tepkimeye yol açar.
      Çok yakıcı buhar, saniyede 500 kez yüksek bir patlamayla fışkırtılır.
      Doğadaki en büyüleyici kimyasal savunma örneklerinden biridir.
  insect.diving_beetle:
    label: dalgıç böceği
    summary: Yüzeyin altında yüzen yırtıcı bir su kın kanatlısı.
    info: |
      Sarı kenarlı dalgıç böceği, göletlerde ve durgun sularda yaşayan, Dytiscidae familyasından yırtıcı bir su kın kanatlısıdır.
      Kürek gibi işleyen yassı arka bacakları sayesinde ustaca yüzer.
      Yüzeyde soluk alır ve kanat kılıflarının altında hava depolar.
      Böcekleri, larvaları, küçük balıkları ve iribaşları avlar.
  insect.velvet_ant:
    label: kadife karınca
    summary: Karıncaya benzeyen, kanatsız turuncu-siyah bir yaban arısı.
    info: |
      Kadife karınca aslında Mutillidae familyasından bir yaban arısıdır; dişileri kanatsızdır ve karıncalara benzer.
      Uyarı olarak çarpıcı kırmızı ya da turuncu tüyleri vardır.
      Dişilerin, "inek öldüren" lakaplı, son derece güçlü bir iğnesi vardır.
      Bombus arılarının yuvalarında asalaklık ederler.
