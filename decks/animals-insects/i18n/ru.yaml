lang: ru
pivot: false
title: Насекомые
cards:
  insect.butterfly:
    label: бабочка
    summary: Летающее насекомое с большими цветными крыльями.
    info: Бабочка — насекомое с двумя парами чешуйчатых крыльев, часто ярко окрашенных.
  insect.bee:
    label: пчела
    summary: Жёлто-чёрное насекомое, опыляющее цветы и производящее мёд.
    info: Медоносная пчела — общественное насекомое, живущее в ульях и собирающее нектар.
  insect.ladybug:
    label: божья коровка
    summary: Маленький круглый красный жук с чёрными точками.
    info: Божья коровка — крошечный жук, питающийся тлёй и полезный в саду.
  insect.dragonfly:
    label: стрекоза
    summary: Насекомое с длинным телом и двумя парами прозрачных крыльев.
    info: Стрекоза — хищное насекомое с превосходным зрением, охотящееся у водоёмов.
  insect.ant:
    label: муравей
    summary: Маленькое общественное насекомое, живущее колониями.
    info: Муравей — насекомое, образующее большие колонии с разделением труда.
  insect.beetle:
    label: жук
    summary: Жуки образуют крупнейший отряд насекомых — более 400 000 описанных видов.
    info: |
      Жук относится к отряду жесткокрылых (Coleoptera) и составляет около 40 % всех описанных видов насекомых.
      Он отличается твёрдыми надкрыльями (элитрами), под которыми спрятаны настоящие лётные крылья.
      Жук-олень — крупнейший жук Европы; у самца мощные рогоподобные челюсти.
      Они живут почти во всех средах — от тропиков до арктических областей.
  insect.grasshopper:
    label: кузнечик
    summary: Прыгающее насекомое с длинными задними ногами и стрекочущей песней.
    info: |
      Кузнечик — насекомое отряда прямокрылых с мощными задними ногами, позволяющими прыгать до двадцати длин тела.
      Самцы издают характерный звук (стрекотание), потирая ноги о крылья.
      Питается растениями, а в больших стаях может повреждать урожай.
  insect.cricket:
    label: сверчок
    summary: Ночное насекомое, знаменитое стрекотанием самцов.
    info: |
      Полевой сверчок — ночное насекомое отряда прямокрылых.
      Самцы стрекочут, потирая крылья друг о друга, чтобы привлечь самок и обозначить территорию.
      В Азии сверчков традиционно держат как питомцев ради их пения.
      Во многих культурах они также символ домашнего уюта и удачи.
  insect.mosquito:
    label: комар
    summary: Двукрылое насекомое; самка сосёт кровь и может переносить болезни.
    info: |
      Комар — двукрылое насекомое семейства кровососущих комаров.
      Самки сосут кровь животных, чтобы получить белок для развития яиц; самцы питаются нектаром.
      Комары переносят опасные болезни — малярию, лихорадку денге и вирус Зика.
      В мире существует более 3500 видов комаров.
  insect.fly:
    label: муха
    summary: Обычное двукрылое насекомое, способное переносить бактерии.
    info: |
      Комнатная муха — самое распространённое двукрылое насекомое в жилищах людей.
      Фасеточные глаза позволяют ей видеть почти на 360 градусов вокруг.
      Она переносит бактерии, потому что садится и на отходы, и на еду.
      У неё лишь одна пара функциональных крыльев; вторая пара (жужжальца) помогает удерживать равновесие в полёте.
  insect.moth:
    label: мотылёк
    summary: Ночной родственник бабочки; летит на свет и имеет перистые усики.
    info: |
      Мотыльки — ночные чешуекрылые, которые, в отличие от дневных бабочек, в покое складывают крылья по бокам.
      Многие виды притягиваются искусственным светом.
      Натуральным шёлком мы обязаны гусеницам тутового шелкопряда.
      Сатурния луна — одна из самых красивых ночных бабочек мира.
  insect.caterpillar:
    label: гусеница
    summary: Личинка бабочки или мотылька; поедает листья и готовится к окукливанию.
    info: |
      Гусеница — личинка бабочки или мотылька, проводящая жизнь в основном за поеданием листьев, чтобы накопить энергию для превращения.
      У некоторых гусениц яркая окраска, предупреждающая хищников о ядовитости.
      При окукливании она образует куколку (хризалиду), в которой происходит полное превращение (метаморфоз) во взрослую особь.
  insect.praying_mantis:
    label: богомол
    summary: Хищное насекомое с молитвенной позой и молниеносным броском.
    info: |
      Богомол — хищное насекомое из группы Mantodea.
      Своё название он получил за позу, в которой держит передние ноги сложенными, как в молитве.
      Это мастер охоты; он наносит удар и хватает добычу за долю секунды.
      Самка иногда съедает самца после спаривания, хотя это случается не всегда.
  insect.stick_insect:
    label: палочник
    summary: Насекомое, идеально имитирующее веточку или лист.
    info: |
      Палочник относится к группе привиденьевых (Phasmatodea) и является мастером маскировки; его тело идеально имитирует веточки или листья.
      При опасности он остаётся совершенно неподвижным.
      Некоторые виды размножаются партеногенезом, то есть без самца.
      Это популярные экзотические питомцы благодаря простоте содержания.
  insect.firefly:
    label: светлячок
    summary: Жук, производящий биолюминесцентный свет, чтобы привлечь партнёра.
    info: |
      Светлячок — жук семейства светляков, способный производить холодный свет (биолюминесценцию) в брюшке.
      Самцы и самки светятся разными узорами, чтобы узнавать и привлекать друг друга.
      Это управляется химической реакцией люциферина с люциферазой.
      Светлячки — индикатор чистоты окружающей среды.
  insect.wasp:
    label: оса
    summary: Жёлто-чёрное жалящее насекомое, строящее бумажные гнёзда.
    info: |
      Обыкновенная оса — жалящее насекомое из группы Vespula с типичной жёлто-чёрной предупреждающей окраской.
      Она строит бумажные гнёзда из пережёванной древесной массы.
      В отличие от пчелы, оса может жалить многократно.
      Она полезна как естественный регулятор насекомых-вредителей.
  insect.cockroach:
    label: таракан
    summary: Быстрое ночное всеядное насекомое; очень выносливое и приспосабливаемое.
    info: |
      Таракан — одно из самых выносливых насекомых в мире; он переживает радиацию и условия, которые убили бы других животных.
      Существует более 4500 видов, но лишь около 30 живут рядом с людьми.
      Это древнее насекомое; тараканы существуют более 300 миллионов лет и пережили динозавров.
      Он быстрый и может бегать со скоростью более 5 км/ч.
  insect.spider:
    label: паук
    summary: Восьминогое паукообразное, плетущее сети для ловли насекомых.
    info: |
      Паук — паукообразное (не насекомое) отряда Araneae с восемью ногами и телом из двух частей.
      Он умеет производить шёлк, из которого плетёт сети для охоты или для обёртывания коконов с яйцами.
      В мире обитает более 48 000 видов пауков.
      Все виды производят яд, но подавляющее большинство безвредно для человека.
  insect.scorpion:
    label: скорпион
    summary: Ядовитое паукообразное с клешнями и изогнутым ядовитым хвостом.
    info: |
      Скорпион — паукообразное (не насекомое) с типичными клешнями и изогнутым хвостом, оканчивающимся ядовитым жалом.
      Это древнее животное; древнейшие ископаемые скорпионы старше 430 миллионов лет.
      В темноте они флуоресцируют под ультрафиолетовым светом.
      Из примерно 2500 видов лишь около 25 опасны для человека.
  insect.centipede:
    label: сороконожка
    summary: Многоножка с одной парой ног на каждом сегменте тела.
    info: |
      Сороконожка относится к классу губоногих (Chilopoda) и имеет по одной паре ног на каждом сегменте тела (а не 100 ног, как подсказывает название).
      Это быстрый хищник, охотящийся на насекомых, червей и мелких позвоночных.
      Первая пара ног превращена в ядовитые когти для парализации добычи.
      Некоторые тропические виды вырастают длиннее 30 см.
  insect.flea:
    label: блоха
    summary: Крошечный прыгающий паразит, сосущий кровь млекопитающих и птиц.
    info: |
      Блоха — бескрылое насекомое отряда блох (Siphonaptera), приспособленное к паразитическому образу жизни.
      Её сильные задние ноги позволяют прыгать более чем на 150 длин тела.
      Она сосёт кровь млекопитающих и птиц и может переносить болезни; исторически блохи разносили чуму.
      Блохи — выдающиеся акробаты мира насекомых.
  insect.termite:
    label: термит
    summary: Общественное насекомое, строящее огромные земляные холмы.
    info: |
      Термит — общественное насекомое из группы Isoptera, отдалённо родственное тараканам.
      Они живут колониями с царём, царицей, солдатами и рабочими.
      Они строят сложные термитники, в тропиках до 9 метров высотой, с системой вентиляции.
      Как основные разрушители древесины они играют ключевую роль в тропических экосистемах.
  insect.bumblebee:
    label: шмель
    summary: Крупная мохнатая пчела с низким гудением; важный опылитель.
    info: |
      Шмель — крупное мохнатое насекомое рода Bombus, родственное медоносной пчеле.
      Это важный опылитель, особенно в более холодном климате, где пчёлы летают меньше.
      Он умеет согреваться, вибрируя лётными мышцами, поэтому летает даже в холодную погоду.
      Шмели более мирные, чем пчёлы, и жалят только при прямой угрозе.
  insect.hornet:
    label: шершень
    summary: Крупнейшая оса Европы с мощным жалом и громким гудением.
    info: |
      Шершень — крупнейшая общественная оса Европы, вырастает более 3,5 см в длину.
      Он строит бумажные гнёзда в дуплах деревьев или под крышами.
      Его жало длиннее, чем у ос, и укус болезненнее, но шершень нападает лишь при прямой угрозе.
      Это важный хищник других насекомых.
  insect.cicada:
    label: цикада
    summary: Насекомое, знаменитое громким стрекочущим пением в жаркие дни.
    info: |
      Цикада — насекомое надсемейства Cicadoidea, знаменитое одним из самых громких звуков среди всех насекомых.
      Самцы производят звук особыми мембранами (тимбалами) в брюшке, чтобы привлечь самок.
      Некоторые виды в США имеют семнадцати- или тринадцатилетние циклы развития.
      Нимфы годами живут под землёй, питаясь корнями.
  insect.locust:
    label: перелётная саранча
    summary: Перелётная саранча, образующая разрушительные стаи из миллионов особей.
    info: |
      Перелётная саранча — вид кузнечиков, который при определённых условиях образует гигантские мигрирующие стаи.
      Стая может насчитывать миллиарды особей и уничтожить целые посевы на тысячах гектаров за день.
      В странах Африки и Азии саранча исторически — одно из крупнейших сельскохозяйственных бедствий.
      В Библии она — одна из десяти казней египетских.
  insect.aphid:
    label: тля
    summary: Крошечное сосущее насекомое на стеблях растений; производит падь.
    info: |
      Тли — мелкие сосущие насекомые надсемейства Aphidoidea, питающиеся соком растений.
      Они производят сладкую падь, за которой ухаживают муравьи в обмен на защиту.
      Они размножаются чрезвычайно быстро; одна самка может дать за год сотни миллионов потомков.
      Это важные вредители сельскохозяйственных культур.
  insect.earwig:
    label: уховёртка
    summary: Продолговатое насекомое с клещами на конце брюшка.
    info: |
      Уховёртка — насекомое отряда кожистокрылых (Dermaptera), отличающееся клещами (церками) на конце брюшка, служащими для защиты и спаривания.
      Название происходит от поверья, будто она заползает людям в уши; это миф.
      Самки уховёрток исключительны тем, что заботятся о яйцах и молодых личинках, что редкость среди насекомых.
      Они живут в щелях, под камнями и в опавшей листве.
  insect.silverfish:
    label: чешуйница
    summary: Бескрылое быстрое насекомое, встречающееся в домах у книг и бумаги.
    info: |
      Чешуйница — примитивное бескрылое насекомое отряда Zygentoma, живущее в жилищах.
      Она питается крахмалом, бумагой, переплётным клеем и текстильными волокнами.
      Название происходит от её серебристой окраски и рыбоподобного движения.
      Это один из древнейших отрядов насекомых, живущий почти неизменным более 300 миллионов лет.
  insect.water_strider:
    label: водомерка
    summary: Насекомое, ходящее по поверхности воды благодаря поверхностному натяжению.
    info: |
      Водомерка — насекомое семейства Gerridae, способное ходить по воде благодаря гидрофобным волоскам на ногах и поверхностному натяжению воды.
      Она охотится на упавших в воду насекомых, которых определяет по колебаниям поверхности.
      Она быстрая и может скользить по воде со скоростью более 150 длин тела в секунду.
  insect.dung_beetle:
    label: жук-навозник
    summary: Жук, катающий шарики навоза, священный в Древнем Египте.
    info: |
      Священный скарабей — жук семейства пластинчатоусых, формирующий навоз в шарики и катающий их, чтобы закопать и отложить яйца.
      В Древнем Египте он был символом солнца и бога Хепри.
      Это одно из немногих животных, ориентирующихся по Млечному Пути.
      Он помогает перерабатывать питательные вещества и рыхлить почву.
  insect.stag_beetle:
    label: жук-олень
    summary: Крупнейший жук Европы; у самца рогоподобные челюсти.
    info: |
      Жук-олень — крупнейший жук Европы, вырастает более 7 см в длину.
      У самца огромные рогоподобные челюсти, используемые в боях за самок.
      Личинка живёт до 7 лет в трухлявой древесине дубов и питается грибами.
      Он находится под критической угрозой из-за исчезновения старых лесов и мёртвой древесины.
  insect.atlas_moth:
    label: павлиноглазка атлас
    summary: Одна из крупнейших ночных бабочек мира, с крыльями в змеиных узорах.
    info: |
      Павлиноглазка атлас — одна из крупнейших ночных бабочек мира, с размахом крыльев до 30 см.
      Кончики её крыльев окрашены так, чтобы напоминать головы змей, что отпугивает хищников.
      У взрослых особей нет рта, и они вовсе не питаются; они живут лишь несколько дней.
      Она происходит из тропических лесов Юго-Восточной Азии.
  insect.weevil:
    label: долгоносик
    summary: Маленький жук с характерным вытянутым хоботком.
    info: |
      Долгоносик — жук семейства Curculionidae, крупнейшего семейства животных в мире с более чем 60 000 видов.
      Его характерный вытянутый хоботок (рострум) служит для бурения семян, плодов и стволов.
      Некоторые виды — серьёзные сельскохозяйственные вредители, например хлопковый долгоносик.
      Другие виды специализированы на одном виде растений.
  insect.lacewing:
    label: златоглазка
    summary: Нежное насекомое с прозрачными жилковатыми крыльями; личинки охотятся на тлю.
    info: |
      Златоглазка — насекомое семейства Chrysopidae с нежными прозрачно-жилковатыми крыльями и золотистыми глазами.
      Личинки — хищники и поедают огромное количество тли, становясь естественными защитниками растений.
      Взрослые особи питаются нектаром и пыльцой.
      Их притягивает свет, и они — индикатор здоровой среды.
  insect.crane_fly:
    label: комар-долгоножка
    summary: Крупная похожая на комара муха с чрезвычайно длинными ногами.
    info: |
      Комар-долгоножка — двукрылое насекомое семейства Tipulidae, внешне похожее на гигантского комара, но не кусающее и не паразитирующее.
      Его чрезвычайно длинные ноги легко отламываются; это защитный механизм (автотомия).
      Взрослые особи живут лишь несколько дней и не питаются или питаются нектаром.
      Личинки живут в почве и питаются корнями.
  insect.mayfly:
    label: подёнка
    summary: Насекомое с самой короткой взрослой жизнью, живущее лишь часы или дни.
    info: |
      Подёнка — насекомое отряда Ephemeroptera и символ мимолётности; взрослые особи живут лишь часы или дни.
      У них нет функциональных ротовых органов, и они вовсе не питаются.
      Нимфы живут от 1 до 3 лет под водой.
      Массовый лёт подёнок — захватывающее природное зрелище; в Венгрии их массовый лёт на Дунае — уникальное явление.
  insect.damselfly:
    label: стрелка
    summary: Стройная родственница стрекозы; в покое складывает крылья вдоль тела.
    info: |
      Стрелка — насекомое, родственное стрекозам, но более стройное, и в покое складывает крылья параллельно телу, в отличие от больших стрекоз.
      Это хищник, охотящийся на мелких насекомых в полёте.
      Нимфы живут в воде и являются важной частью водных экосистем.
      Они — индикатор качества водотоков.
  insect.robber_fly:
    label: ктырь
    summary: Хищная муха, ловящая других насекомых прямо в полёте.
    info: |
      Ктырь — хищное двукрылое насекомое семейства Asilidae, охотящееся на других насекомых прямо в полёте.
      У него сильные ноги, чтобы схватить добычу, и хоботок, чтобы впрыснуть парализующий яд.
      Некоторые виды имитируют облик шмелей или ос как защиту от хищников.
      Он полезен как естественный регулятор популяций насекомых.
  insect.ground_beetle:
    label: жужелица
    summary: Быстрый хищный жук, живущий под камнями и в листве.
    info: |
      Жужелица — жук семейства Carabidae; большинство видов — активные ночные хищники, охотящиеся на других насекомых, червей и слизней.
      Они быстрые и стремительно убегают от опасности.
      Некоторые виды, например жужелица фиолетовая, имеют прекрасный металлический блеск.
      Они — индикаторы здоровой почвы и естественного земледелия.
  insect.tiger_beetle:
    label: жук-скакун
    summary: Быстрый жук металлической окраски с превосходным зрением.
    info: |
      Жук-скакун — жук подсемейства Cicindelinae, знаменитый исключительной быстротой, способностью летать и острым зрением.
      Он бегает так быстро, что вынужден останавливаться и заново ориентироваться, потому что движение слишком быстро для его зрительной системы.
      У него великолепно окрашенные металлические тела (зелёные, синие, красные) и большие глаза.
      Личинки роют вертикальные туннели в земле и подстерегают добычу у отверстия.
  insect.hoverfly:
    label: журчалка
    summary: Муха, имитирующая окраску ос и пчёл, опылитель садов.
    info: |
      Журчалка — двукрылое насекомое семейства Syrphidae, имитирующее окраску ос и пчёл как защиту от хищников (бейтсовская мимикрия), хотя и не жалит.
      Это важный опылитель; она посещает больше видов растений, чем пчёлы.
      Взрослые особи питаются нектаром и пыльцой.
      Личинки некоторых видов охотятся на тлю, помогая тем самым в садах.
  insect.whirligig_beetle:
    label: вертячка
    summary: Маленький жук, кружащий стаями по поверхности воды.
    info: |
      Вертячка — водный жук семейства Gyrinidae, живущий на поверхности, и кружение стаями помогает ему избегать хищников.
      Его глаза разделены на две части; одна видит над водой, другая под водой.
      Он улавливает рябь на поверхности, сигнализирующую о еде или опасности.
      Днём он кружит, ночью летает.
  insect.louse:
    label: вошь
    summary: Крошечный бескрылый паразит, живущий на коже и волосах млекопитающих.
    info: |
      Вошь — бескрылое паразитическое насекомое отряда Phthiraptera, живущее на коже и в шерсти или волосах хозяев.
      Она сосёт кровь и вызывает зуд.
      Головная вошь распространена по всему миру и поражает детей независимо от условий гигиены.
      Исторически вши переносили тиф и другие болезни.
  insect.bedbug:
    label: постельный клоп
    summary: Плоский паразит, сосущий кровь ночью; прячется в щелях мебели.
    info: |
      Постельный клоп — плоское овальное насекомое семейства Cimicidae, активное прежде всего ночью.
      Он кусает и сосёт кровь спящего хозяина.
      Он прячется в щелях матраса, мебели и за обоями.
      В последние десятилетия он распространился по всему миру благодаря международным путешествиям.
  insect.antlion:
    label: муравьиный лев
    summary: Личинка, роющая в песке воронкообразные ловушки для муравьёв.
    info: |
      Муравьиный лев — личинка насекомого семейства Myrmeleontidae, роющая конические воронки в сухом песке.
      Когда муравей соскальзывает в ловушку, муравьиный лев хватает его челюстями и впрыскивает пищеварительные соки.
      Взрослые особи невзрачные, похожие на стрекоз, и летают ночью.
      Личинки могут годами жить под землёй без пищи.
  insect.goliath_beetle:
    label: жук-голиаф
    summary: Одно из крупнейших и тяжелейших насекомых мира, из тропической Африки.
    info: |
      Жук-голиаф — одно из крупнейших насекомых мира; самцы весят до 100 граммов и достигают более 11 см в длину.
      Он живёт в тропических дождевых лесах экваториальной Африки.
      Взрослые особи питаются фруктами и древесным соком.
      В Африке дети иногда держат их как игрушки, и их продают коллекционерам.
  insect.bombardier_beetle:
    label: жук-бомбардир
    summary: Жук, выстреливающий кипящую ядовитую смесь в качестве защиты.
    info: |
      Жук-бомбардир — жук подсемейства Brachininae, защищающийся уникальным способом; он смешивает два химических вещества в брюшке, вызывая взрывную реакцию с температурой более 100 градусов.
      Высокотоксичный пар выстреливается с громким хлопком до 500 раз в секунду.
      Это один из самых удивительных примеров химической защиты в природе.
  insect.diving_beetle:
    label: плавунец
    summary: Хищный водный жук, плавающий под поверхностью.
    info: |
      Плавунец окаймлённый — хищный водный жук семейства Dytiscidae, живущий в прудах и стоячих водах.
      Он плавно плавает благодаря плоским задним ногам, работающим как вёсла.
      Он дышит на поверхности и хранит воздух под надкрыльями.
      Он охотится на насекомых, личинок, мелких рыб и головастиков; активен и в воде, и летает ночью.
  insect.velvet_ant:
    label: оса-немка
    summary: Бескрылая оранжево-чёрная оса, похожая на муравья.
    info: |
      Оса-немка на самом деле оса семейства Mutillidae; самки бескрылые и похожи на муравьёв.
      У них заметные красные или оранжевые волоски как предупреждение.
      У самок чрезвычайно мощное жало, прозванное убийцей коров.
      Они паразитируют на гнёздах шмелей.
