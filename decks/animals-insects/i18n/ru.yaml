lang: ru
pivot: false
title: Насекомые
cards:
  insect.ant:
    label: муравей
    summary: Малый социальный насекомый, живущий в колониях.
    info: Муравей – это насекомое, образующее большие колонии с разделением труда.
  insect.bee:
    label: пчела
    summary: Жёлто-черное насекомое, которое опыляет цветы и производит мёд.
    info: Пчела медоносная – это социальное насекомое, живущее в ульях и собирающее нектар.
  insect.butterfly:
    label: бабочка
    summary: Летающее насекомое с большими окрашенными крыльями.
    info: Бабочка – это насекомое с двумя парами чешуйчатых крыльев, часто ярко окрашенных.
  insect.dragonfly:
    label: вазка
    summary: Насекомое с длинным телом и двумя парами прозрачных крыльев.
    info: Вазка – хищное насекомое с отличным зрением, охотящееся возле водной поверхности.
  insect.ladybug:
    label: берушика
    summary: Маленький круглый красный жук с чёрными пятнышками.
    info: Берушка – это маленький жук, питающийся тлёй и полезный в саду.
