lang: ru
pivot: false
title: Насекомые
cards:
  insect.ant:
    label: муравей
    summary: Малый социальный насекомый, живущий в колониях.
    info: Муравей – это насекомое, образующее большие колонии с разделением труда.
  insect.antlion:
    label: муракольный
    summary: личинка, которая рыла пастевые ямы для муравьёв в песке
    info: '{"hint":"вредитель насекомых личинка выкапывает ямы для захвата муравьев","info":"Мурашник - это гусеница членистоногих из семейства Myrmeleontidae, которая копает конические капканы в сухой песок\nКогда мишка скользит по засаде, мураколев удерживает его челюстью и инъекторами пищевых ферментов \"Доросшие особи не являются заметными, подобно стрекозам, летают ночью\"Личинки могут жить годами на поверхности без еды","label":"муракольный","summary":"Гусеницы, которые роют наклонные ямки для сбора муровиков."}'
  insect.aphid:
    label: тля
    summary: Мелкие сосущие насекомые на стеблях растений; вырабатывают медовый воск.
    info: '{"hint":"маленький комарообразный насекомый", "info": "Тля - это маленькое кровососущее насекомое из надсемейства Афидойдае, питающееся соками растений. Они производят сладкую мёдную смолу, которую ухаживают муравьи в обмен на защиту. Тли размножаются чрезвычайно быстро; одна самка может дать начало сотнями миллионов потомков за год. Это важные вредители сельскохозяйственных культур."}'
  insect.atlas_moth:
    label: атлантский шелкопряд
    summary: Один из крупнейших в мире мотов со структурой на крыльях похожей на узоры змей.
    info: '{"hint":"один из крупнейших в мире мотыльков (Atactus атлас)","info":"Атласский бабочка - один из самых больших ночных бабочек мира с размахом крыльев до 30 см.\nКрая его крыльев окрашены так, чтобы напомнить голову змеи, что отпугивает хищников.\nВзрослые особи не имеют рта и вообще ничего не едят; живут всего несколько дней как взрослыe.\nОни происходят из тропических лесов Юго-восточной Азии."}'
  insect.bedbug:
    label: щенец
    summary: Плоский кровсосущий паразит днем спрятан между швах мебели.
    info: Щенец домашний – это плоский овальный насекомое из семейства щеницовых, активное в первую очередь ночью.
  insect.bee:
    label: пчела
    summary: Жёлто-черное насекомое, которое опыляет цветы и производит мёд.
    info: Пчела медоносная – это социальное насекомое, живущее в ульях и собирающее нектар.
  insect.beetle:
    label: жука
    summary: Жуки образуют самый большой порядок насекомых со свыше четыреста тысячью описанными видами.
    info: '{"hint":"жесткокрылый насекомый","info":"Жуки относятся к отряду жуков и составляют около 40% всех описанных видов членистоногих животных. Они отличаются твердыми покровами крыльев (эликтра), под которыми скрываются настоящие летательные крыла. Самец дубового усача - крупнейший европейский жук с мощными рогообразными клыками. Живут почти во всех средах от тропиков до арктических регионов."}'
  insect.bombardier_beetle:
    label: стрекозник артиллерийский
    summary: Жук выстреливает кипящую ядовитую жидкость как средство защиты.
    info: 'Стрекозник артиллерийский – жук из подсемейства Брахининаэ, который защищается уникальным способом: смешивает две химические вещества в задней части тела, что вызывает взрывную реакцию с температурой более чем на 100 градусов Цельсия.'
  insect.bumblebee:
    label: чмель
    summary: Большая ворсистая пчела с глубоким жужжанием
    info: Чмелёк - это крупное пушистое насекомое из рода Бомбуса и родственник пчелы медоносной.
  insect.butterfly:
    label: бабочка
    summary: Летающее насекомое с большими окрашенными крыльями.
    info: Бабочка – это насекомое с двумя парами чешуйчатых крыльев, часто ярко окрашенных.
  insect.caterpillar:
    label: гусеница
    summary: Личинка бабочки или мотылья; питается растениями и готовится к метаморфозе.
    info: Гусеница - это личинка бабочки или моли и большую часть жизни проводит поеданием листвы для накопления энергии перед превращением в куколку. Некоторые гусеницы имеют яркие цвета как предупредительный сигнал о своей токсичности хищникам.
  insect.centipede:
    label: многоножка
    summary: Членистоногое животное из класса Чилопода со множественными парами ног.
    info: Многоножка относится к классу Челоподы и имеет один пар ног на каждом сегменте тела (не сто ног, как может подразумевать название). Это быстрый хищник, охотящийся за насекомыми, червями и мелкими членистоногоными. Первую пару ног она приспособила в виде ядовитых клешней для обездвиживания добычи.
  insect.cicada:
    label: циклада
    summary: насекомые известны своими громкими песнями во время солнечных дней
    info: '{"hint":"громкое насекомое-певец; самцы издают громкий жужжащий звук","info":{"label":"циклада","summary":"Насекомые известные своим громким пением в теплый день","content":{}}}'
  insect.cockroach:
    label: таракан
    summary: Быстро передвигающийся ночное всёярное насекомое с высокой стойкостью.
    info: '{"hint":"быстрый ночной хищник и всеядный насекомое (Blattodea)","info":"Таракан - одно из самых живучих насекомых на Земле; он выживает при радиации или условиях среды, которые убили бы других животных.\nСуществует более чем 4 500 видов тараканов, но только около тридцати обитают в близости к людям.\nЭто древнее насекомое - тараканы существуют уже больше трёхсот миллионов лет, пережив динозавров.\nОн быстро двигается по земле со скоростью свыше пяти киллометров за час."}'
  insect.crane_fly:
    label: типула
    summary: Большая муха подобная комарику со сверхдлинненогими.
    info: '{"hint":"муха с длинными ногами похожая на гигантского комара","info":"Типула - двукрылое насекомое из семейства Типулид которые визуально напоминают огромного комаров но не кусаются и не паразитируют\nЕё чрезвычайно длинные ножки легко отламываются что является защитным механизмом \(автотомия\).\nВзрослые особи живут всего несколько дней они либо вообще ничего не едят либо питаются цветочным медком\nЛичинки \"дратвурмы\'
  insect.cricket:
    label: самец
    summary: Ночное насекомое известное своим стридулационным щебетанием у мужских особей.
    info: Полевая саранча - это ночное насекомое из отряда прямокрылых. Мужские особи производят звуки трением крыльев друг о дружку для того чтобы заманивать самок и обозначать территорию. В Азии традиционно разводили кузнечиков как домашних питомцев за их пение.
  insect.damselfly:
    label: стрекотка
    summary: Стихийный соседство пчелиной мухи; во время отдыха сложить крыло рядом с корпусом.
    info: Стрекоза - насекомое родственное жукам, но более стройная и при отдыхе складывает крылья параллельно телу в отличие от бабочек.
  insect.diving_beetle:
    label: водяной охотник
    summary: Хищное насекомое плывущее под поверхностью воды.
    info: Большой водный жук семейства коромысловых живет в прудах и стоячей воде.
  insect.dragonfly:
    label: вазка
    summary: Насекомое с длинным телом и двумя парами прозрачных крыльев.
    info: Вазка – хищное насекомое с отличным зрением, охотящееся возле водной поверхности.
  insect.dung_beetle:
    label: скарабеи
    summary: Жук, перекатывающий комья навоза; святилище во времена древнего египта.
    info: Священный скарабей - жук из семейства Жуки-скапариусы, который формирует навоз в шарик и катит его для закопывания яиц. В Древнем Египте он был символом солнца и бога Хеприя.
  insect.earwig:
    label: скорионова
    summary: Узкотелесное насекомое со щупальцами на кончике задней части тела.
    info: Скорпионовка – насекомое отряда Dermaptera с клешнями на конце хвоста для защиты и спаривания. Название происходит из мифа о том, что они ползают в уши людям, это неправда. Самки скорионовых вынашивают яйца и заботятся об имаго личинок, чего редко бывает среди других членистоногих.
  insect.firefly:
    label: светодиод
    summary: Жук вырабатывающий биолюминесценцию для привлечения партнёра.
    info: Светляк – жук из семейства светляковых способный производить холодное свечение в задней части тела за счёт химической реакции люциферина и люцеразы.
  insect.flea:
    label: вши
    summary: Мелкие прыгающие кровососущие вредители млекопитающих и птиц.
    info: Вши - это бесплодные насекомые из отряда Сифонаптера с паразитическим образом жизни.
  insect.fly:
    label: муха
    summary: Распространенное двухкрылые насекомых способны переносят бактерии.
    info: Домашняя муха - самый распространенный двукрылый насекомое в человеческих жилищах. Ее составные глаза позволяют видеть почти на 360 градусов вокруг себя.
  insect.goliath_beetle:
    label: голиат
    summary: Один из самых больших и тяжелых жуков мира с тропической Африки.
    info: Гигантский гольяшь - один из крупнейших насекомых мира; самцы весят до ста граммов и достигают длины более 11 см.
  insect.grasshopper:
    label: кузнечик
    summary: Прыгающий насекомый с длинными задними лапами.
    info: Самцы кузнечиков издают характерный звук трением бёдер о крылья и могут прыгать на расстояние до двадцати раз длины тела благодаря длинным задним ногам.
  insect.ground_beetle:
    label: стревлика
    summary: Быстро движущийся хищный жук живет под камнями.
    info: Стривлик – жук из семейства перелётных бронзовок; большинство видов являются активными ночными хищниками и охотятся на других насекомых, червей и улиток.
  insect.hornet:
    label: оса
    summary: Самый большой европейский вид пчелы имеет мощный шип и звуки от бабочки.
    info: Оса обыкновенная – крупная социальная оса длиной более чем на 3 см и самая большая в Европе; она строит бумажные гнезда внутри деревьев или под крышей дома. У неё длинное жало по сравнению с осыми, укус болезненный но атакует только при прямой опасности для себя.
  insect.hoverfly:
    label: пестренка
    summary: Муха с яркой раскраской подобной осым или пчелам, которая помогает оплетать растения.
    info: Пестренка – двукрылое насекомое из семейства пыльцеедов, которое имитирует окраску ос и пчёл в качестве защиты от хищников (батавская мимикрия). Хотя сама не жалит, она является важным опылятелем цветков растений.
  insect.lacewing:
    label: золотая головка
    summary: Хрупкая бабочка с переплетённым полупрозрачных крыло; гусеницы собирают медведку.
    info: '{"hint":"хрупкий насекомое с большими прозрачными сетчатыми крыльями (Chrysopidae)","info":"Златоокка - это насекомое из семейства Chrysopidae со тонкими и прозрачно жилкованными крылами и золотистыми глазами\nЛичинки являются хищниками и потребляют огромное количество тлей, что делает их естественными защитниками растений\nВзрослые особи питаются нектаром и опытом\nОни привлечены светом и служат индикатором здоровой среды","label":"золотая головка","summary":"Тонкие насекомых с прозрачной ветвящейся крылом; личинки охотятся на мух."}'
  insect.ladybug:
    label: берушика
    summary: Маленький круглый красный жук с чёрными пятнышками.
    info: Берушка – это маленький жук, питающийся тлёй и полезный в саду.
  insect.locust:
    label: перелётный жук
    summary: Переходящий жук создающий разрушительную группировку миллионов особей.
    info: '{"hint":"саранча, образующая огромные разрушительные стаи","info":"Кобылка перелетная - вид кузнечиков, который при определенных условиях формирует гигантские мигрирующие табуня.\nТабун может состоять из миллиардов особей и уничтожить всю культуру на тысячах гектаров за день.\В африканских и азиатских странах саранчавые волны исторически были одной из самых больших земляных катастроф.\Сарафаны являются одним из десяти египетских наказаний во Второзавете."'
  insect.louse:
    label: пидика
    summary: Мелкий бескрылый организм, обитающий в коже и волосах млекопитающих.
    info: Педикул – это беспозвоночный паразитический насекомый из отряда Phtiriaptera живущий на коже и шерсти или волосах хозяев. Он пьёт кровь и вызывает зуд.
  insect.mayfly:
    label: майфла
    summary: Насекомое с самым коротким периодом взрослой жизни, которая длится всего несколько часов до нескольких дней.
    info: Майфла - насекомое из отряда Ephemeroptera и символ скоротечности жизни; взрослые особи живут только часы или дни.
  insect.mosquito:
    label: комарь
    summary: Двукрылое насекомое; самки сосут кровь у живых организмов.
    info: Муха двукрылая из семейства комаров. Самицы пьют кровь животных для получения белков необходимых при развитии яиц; самцы питаются нектарами растений и не требуют крови от людей или других существ.
  insect.moth:
    label: мура
    summary: Вечерний родственник бабочки летает к свету и имеет перья на усиках
    info: |-
      Муры - это ночные бабочки из отряда Чешуйковые крылья, которые в отличие от дневных бабочек имеют сложенные по сторонам крыла во время отдыха
      Некоторые виды привлекаются искусственным светом
      Из гусениц шелкопрядов мы получаем натуральное шёлк
  insect.praying_mantis:
    label: кудланка
    summary: Хищный насекомый со статуей в виде молитвы и быстрым ударом.
    info: Кудланка молитвенно складывает передние ноги и получила своё название из-за этого положения тела. Это мастер охоты – она бросается на добычу с невероятной скоростью за долю секунды. Иногда самки поедают самцов после спаривания, хотя это не происходит всегда.
  insect.robber_fly:
    label: стрехатка
    summary: Хищная муха ловит других насекомых на лету.
    info: Стрекоза – хищное двукрылое насекомое из семейства Азилид, охотящееся за другими насекомыми прямо в полёте.
  insect.scorpion:
    label: скорпион
    summary: Ядрышный арахнида с кривыми щупальцами и зигзагообразным стержнем.
    info: |-
      Скорпион - членистоногое из класса паукообразных с характерными клешнями и хвостом в виде дуги заканчивающимся ядовитым жалом.
      Это древнее животное; самые старые окаменелости скорпиона имеют возраст более чем 430 миллионов лет.
      В темноте они светятся под ультрафиолетовым освещением.
  insect.silverfish:
    label: рыбёнок
    summary: Бесполый быстрый жук найденный дома у книг и бумаги.
    info: Рыбенка - примитивное бесплодное насекомое из отряда Zygoptera живущее в домах и квартирах. Оно питается крахмалом бумагой клеем для книгопечатания и текстильными нитями.
  insect.spider:
    label: паук
    summary: Черепахи имеют восьми конечностей; они строят сети для охоты на насекомых.
    info: '{"hint":"восьминогое членистоногое из класса паукообразных", "info": "Паук - это представитель отряда клещей и скорпионы с восемью ногами и двумя частями тела. Он способен производить шелк для построения ловушек или обертывания коконов со яйцами. В мире существует более чем 48 тысяч видов пауков."}'
  insect.stag_beetle:
    label: рогач
    summary: Крупный европейский жук; у самца есть рожковые кусалка.
    info: Обыкновенный рогач - крупнейший европейский жук длиной более 7 см. Самцы имеют огромные рожковидные нижние челюсти для борьбы за самок. Личинки живут до семи лет в гнилых сухих деревьях и питаются грибами.
  insect.stick_insect:
    label: страшилка
    summary: Насекомое точно подражающее ветке или листву.
    info: Страшилка – это насекомое из группы Phasmatodea и мастер мимикрии; её тело идеально имитирует веточки или листья.
  insect.termite:
    label: термит
    summary: Социальное насекомое строящее огромные глинянные муравьиники.
    info: Термиты - это социальные насекомые из группы Изоптера и отдалённые родственники саранчи. Они живут в колониях у которых есть царь, королева, воины и рабочие особи. Строят сложные муравейнике высотой до девяти метров в тропиках, оснащенные системами проветривания.
  insect.tiger_beetle:
    label: полевка
    summary: Металлически окрашеный быстрый жук со стольным зраком.
    info: Полевка - жук из подсемейства Cicindelinae известный исключительной скоростью бега и полетом с острым зрением. Он так быстро бежит что ему приходится останавливаться чтобы снова ориентироваться потому что движение слишком быстрое для его визуальной системы.
  insect.velvet_ant:
    label: муравьиная волхвовка
    summary: Оранжево-черная бескрылая осы выглядит как муравей.
    info: Муравьиная волхвовка на самом деле является осой из семейства Мутиллидые; самки безкрылые и напоминают муравьев.
  insect.wasp:
    label: оса
    summary: Желтое и чёрное жалающее насекомое сооружает бумажные гнезда.
    info: |-
      Обыкновенная оса - жалющая насекомое из рода Vespa с характерной желточернёй предупреждающей окраской
      Осы строят бумажные гнезда из перетёртой древесины,
      в отличие от пчел осы могут ужалить несколько раз,
      они полезны как естественный регулятор вредных насекомых.
  insect.water_strider:
    label: водомерка
    summary: Насекомые бегают по поверхности воды благодаря поверхностному напряжению.
    info: Водомерка - это насекомое из семейства Gerromorpha, способное ходить по поверхности воды благодаря гидрофобным волоскам на ногах и поверхностному натяжению жидкости. Оно охотится за утопленными насекомыми, которые обнаруживаются с помощью вибраций水面. Водомерки очень быстрые; они могут скользить по водной поверхности со скоростью более чем в сто пятьдесят раз превышающей длину тела в секунду.
  insect.weevil:
    label: носатый
    summary: Мелкий жук с характерной длинным носом.
    info: Носатик – жук из семейства куркулионидов, самого крупного на свете животных с более чем шестьюдесятью тысячами видами. Характерная вытянутая головка служит для высверливания в зернах и плодах.
  insect.whirligig_beetle:
    label: вирник
    summary: Жучок, который двигается по окружностям рядом с другими особями на поверхности водоемов.
    info: '{"hint":"жук вращается по кругу на поверхности воды (Gyrinidae)","info":"Вирник - водный жук из семейства Gyrinidae, живущий на поверхности и кружение стаями помогает ему уклоняться от хищников\nЕго глаза разделены на две части: одна видит над водой, другая под водой\nОн обнаруживает рипплы (волны), которые сигнализируют о пище или опасности\nДнем он делает повороты, ночью летает","label":"вирник","summary":"Мелкий жук движется группами по поверхности воды."}'
