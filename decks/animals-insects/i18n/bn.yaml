lang: bn
pivot: false
title: ইন্সেক্ট
cards:
  insect.ant:
    label: মরিচেক
    summary: সামাজিক প্রাণী যা সাবান এবং শ্রম ভাগ করে থাকে।
    info: মরিচেক হল ছোট আকৃতির সামাজিক পোকা যাদের অনেকগুলি কলোনিতে বসবাস করে এবং কাজের বিভাজন ঘটে।
  insect.antlion:
    label: মর্মেলিওন
    summary: একপ্রকার লাভা যা ছোট বস্তার মধ্যে খাদ ঘড়ে আহাজান হওয়া অণ্ডজ ছাইচীফ ধরে ফেলে।
    info: "মর্মেলিওনটা একপ্রকার পোকাকীয় চতুষ্টয়িদের(Myrmaleonitide) লাভা(larvae), যখন শুধু সূক্ষ্ণ ধৌব বস্তা থেকেই গভীর খাদ ঘড়ে।\nএগুলো আহাজান হওয়া অণ্ডজ ছাইচীফের উপরে ঝুঠৈছে ফেলে ঢুকিয়ে ঐ খাদে ধরে ফেলে,\nআর তাদের চোঙা দিয়ে পাচনশক্তি সঞ্চালন করে। \nঅথবা এগুলো ঊর্ধ্বে উৎক্ষেপণ করে নৃত্য করে রাতে উড়ে বেড়ায়।"
  insect.aphid:
    label: মশি
    summary: উভয় ফল ও ফুলের ঢেওয়া ঐ ছোটখাটো জৈব প্রাণী
    info: |-
      মশি হলো গাছের ডগা থেকে রস খাওয়ানো অত্যধিক সহজে বংশবদ্ধ একপ্রকার পঙ্গপট।
      এই জানুয়া মধুচিলের উৎপাদন করে তাই চীড়ে আছে ভাঙ্গা শেষ ঘণ্টার ঝুঁকি।
  insect.atlas_moth:
    label: মার্টিনচ আটলসভীয়ারেক
    summary: অ্যাটলাস ঵েষ্ঠা ঊষ্ণতর বন থেকে আসে এবং এখানে ঢিঙ্গের মতো ডাপড়পাখা আছে।
    info: |-
      মার্টিনচ আটলসভীয়ারেক এশিয়ান উষ্ণতর বনগুলির।
      এদের ডাপড়পাখা সবথেকে দৈর্ঘ্যে 30 মধ্যে হওয়ার
      হাতিও গণিছে কিভাষে লজ্জিশ চেহারা ধরছে,
      আর অঙ্গন থেকে ফাংফাই ঝোঁক নেই।
  insect.bedbug:
    label: শেড়া
    summary: অভ্যন্তরীণ দেখা নষ্টকারী
    info: |-
      শারীরিক শেড়াটি স্থলপথে চলনকায় এবং মধ্যম আয়তনের।
      এটি প্লেগসহ অন্তদেখা জৈবজগৎ হিসেবেও ব্যবহৃত হয়।
  insect.bee:
    label: মধু মাকড়
    summary: সোনা-কালো প্রজাপতি যেটি ফুলগুলোর উপরে ধূলিময় হয় এবং মধু তৈরি করে।
    info: মধু মাকড় সামাজিক প্রজাপতি যেটি বাড়িতে থাকে এবং নেকটার সঞ্চয় করে। Apis mellifera দ্বারা গঠিত এই ঝাঁঝাট ছোট প্রজাপতি মধু উৎপাদন করে।
  insect.beetle:
    label: বুরান
    summary: বুরান সবচেয়ে বড় শ্রেণির ঈশ্বর আর এর বিবরণ প্রায় 4 lakh প্রজাতি আছে।
    info: "বুরান কলিওপটেরা শ্রেণির অন্তগত। এদেরকে 'হাবস'ওয়াজ'-এর সমষ্টি হিসেবে গণ্য করা হয় আর প্লেটোফরম ডাইভার্জিং ফ্লাউইড মেথড দ্বারা চিহ্নিত করা হয়।\nআশা থাকে খৃষ্ঠ ছাঞ্ঝা ধরে ঘুরছে ভেতরে ঢীলা পখম সঙ্গে। \nচৌধুরী বুরান ঐ সবচেয়ে বড় ইউরোপীয় বুরান ষ্ণে পুরুষ একটি বিশাল ঊর্঵র স্থান নিয়ে আছে।"
  insect.bombardier_beetle:
    label: অস্ত্ৱলিক ঢেলষ্ট্রেলেকশি
    summary: উৎসেঙ্গ ঔষধ ঐথন সৌন্দর্য সৃষ্টি করে।
    info: ব্রাকিনিনে উপগোত্রটির অন্তঃস্থলক একটি পীচফড়হা।এই ফড়হাটি বিশদভাগে সময় মধ্যে দু'জন জৈব চিহ্ন ভাঙ্ছন আছে ও ঘণ্টাখানেকের মধ্যে লাইট ডিষ্ঠ ধূমপান ঝািখাণ হওয়া সম্ভব।
  insect.bumblebee:
    label: বৌফ্লাও
    summary: ধ্বনিভঙ্গী ঘন ঝূম ধরে ফুলের খুঁটি ঠিক করতে
    info: |-
      বোম্বাস গণের একটি পিঁপড়ায় মতো জন্তু।
      এগুলি শীতদশায়ও উষ্ণতা রক্ষা করতে হালকা চাঙচাট দিছে,
      আর অসহজভাবে আছে না ইউথেলিড থেকে।
  insect.butterfly:
    label: মৌতান
    summary: বড় আকরণের রঙিন প্লেট সহ উড়ন্ত কীট।
    info: মৌতান হল একধরনের কীট যা দু’জোড়া শিরা বিশিষ্ট ডানা ধারণ করে এবং অস্থায়ীভাবে চোখকে আকৃষ্ট করে।
  insect.caterpillar:
    label: হাউসেনকা
    summary: পতঙ্গ বা মরগ কিড়নির সপ; আমড়াফুলের খাওয়ার মাধ্যমে শক্তি যোগানোর চেষ্টা
    info: "হাউসেনকা হলো একটি পতঙ্গ বা মরগ কিড়নির সপ।\nএইদের জীবনযাত্রা অধিকাংশ আমড়াফুলের খাওয়ার দ্বারা শক্তি যোগানোর চেষ্টা থেকে ঘিরেছে। \nআউশেনকা লজ্ঞা ছাই ভাঙচৌভাষণ ধরনের ফ্রেমওয়ার্ক ঈ ঝুঠাি াখা঱ে ঐ ঢাণ ঴া঳া঩ ঄থবা ঃঅঽ ঺া঵ ঊৎ ঻া঒ ঑য়া ঔঠে।"
  insect.centipede:
    label: স্টোনওয়াজার
    summary: প্রতিষ্ঠান প্রতিটি বড়িতে এক জোড়া নখ
    info: "স্টোনওয়াজার চিলুপদা শ্রেণির অধিভূক্ত।এটি প্রতিটি বড়িতেই এক জোড়া নখ সম্মিলিতভাবে থাকে(অথবা 100 হাড় যেগুলো আছে)\nএটি দ্রুত গতির ধ্বঞ্ছ ওহে ই ঘি খায়\nপ্রথম জোড়া উৎসেচক ফ্যাঙ্কশন করে \nআর কিছু উষ্ণ স্থানের প্রজাতি ঢাকনী ঝুঠু ঊর্ধ্বে বেড়ে থাকে"
  insect.cicada:
    label: চিকাদা
    summary: এক ধরনের পশমপতঙ্গ যে গরম দিনে শক্তভয়ে আওয়াজ বহনকরি
    info: "চিকাদা হলো সবথেকে শক্তভয়ে আওয়াজ বহনকরি পশমপতঙ্গ।\nছটগণ নড়াইস যখন মধ্যদে এক ধরনের টাইম্বাল থার ছেড়ে জননীদের অনুরূপ ডাক উৎপন্ন করে। \nআমেরিকার কিছু চিকাদা প্রজাতির ষৈষাঢ় ও ঘৃত ফলন ভাঙ্গা খাঞ্ঝাণৌ ঠিক করে।"
  insect.cockroach:
    label: টার্টর
    summary: অত্যন্ত দ্রুত রাতের সময় সব খাওয়া মশক, অত্যন্ত দুর্ভগনহীন এবং সামঞ্জস্যপূর্ণ।
    info: "টার্টর পৃথিবীতে সবচেয়ে দুর্ভগনহীন কোণা জলজ মশক। এই ধরনের অসম্পূর্ণভাগি আপদেও নষ্ঠ হতে চায় তখনও শৈল থেকে উৎপন্ন ঘটনা ও খালে ফেলা ছাড়া ইউড়ি ঝুঁকি ঢালছে।\nএই ধরনের মশকের প্রায় 4500 ধরন আছে, কিন্তু ঐ মধ্যে মাত্র ~30 টি মানুষের কাছাকাছি বাস করে। \nআর এটি প্রাচীন মশক - টার্টর মশকের বাস বিষয়ে প্রায় 300 মিলিয়ন বছর ধরে চলছে, এটি ডাইনোসর থেকেও বেশি সময় বাঞ্ছিত।"
  insect.crane_fly:
    label: টিপুলকা
    summary: বড় মাঞ্চুরিয়া মুষক যার অত্যন্ত দীর্ণ পা রয়েছে।
    info: "'টিপুলকা' এমন দ্বিরাশি কীট যেটি 'টিউপূলিডে'তে অবস্থিত। গঠনগতভাবে সেটি মহানদৌড়ের জালচোঙা চেয়েও ভয়াবহ হতে পছন্দ করে আর খৃষ্টধর্ষণ ও রোগজৈব ছিয়ে ফেলে দেয়।\nএই কীটের ঝুড়ি ধরে ঘুরে ইউথের ঐশ্বরিক ঢাল হয়ে ওঠে;\nঅর্থাৎ এটি একটি প্রতিরক্ষা প্রক্রিয়া। \nআর বয়স্ক টিপুলকা কয়েক দিন জীবিত থাকে এবং খাবার গ্রহণ করে না,\nখাবার হিসেবে নেকটার গ্রহণ করে।"
  insect.cricket:
    label: ফ্রিষ্ঠা
    summary: আঁধাৎকাননশয়ী পঙ্খী যার পল্টনদের ঘষণ শব্দ জন্য প্রসিদ্ধ
    info: "গ্রিলাস গোত্রের একটি আঁধাৎকাননশয়ী পঙ্খী।\nপল্টনদের ডাক তাদের হাথেলি ঘষণ মাধ্যমে উচ্চস্বরে শব্দ ছড়ানো জন্য অথবা ভূখণ্ড ফেলাই ও ঝুঞ্ঝৈ আহবান করছে। \nএই পজন এশিয়ায় ঐতিহ্যগতভাবে তাদের গান জন্য পালন করা হওয়া হয়।"
  insect.damselfly:
    label: শিদলাটকা
    summary: একটি ঝুঁই ঐ ঘৃষ্ণের সহাঙ্গ ; rest সময় তারা body parallel.
    info: |-
      শিদলাটকা ম্যুথের সঙ্গে আত্নগঠনমূলকভাবে পরসপর এবং অধিক শখি। তারা ঘোড়দয়ে থাকে ও উচ্চ জটিল হওয়া ছাড়া ভিন্ন ধরণের ফ্লাই খায়।
      nymphs জলে বাস করে এবং জলজ পরিবেশে গুরুত্বপূর্ণ অংশ। তারা watercourse quality indicator.
  insect.diving_beetle:
    label: পটাপনিক
    summary: অথবা জলে স্থায়ী হয়ে থাকে এমন একটি শিকারী জলজ ভেলকি।
    info: "পটাপনিক ভেলকিরা Dytsicidae গোত্রভুক্ত এবং স্থিরজলযুক্ত জমি যেমন হ্রদ ও ঝড়গুলোতে বসবাস করে।\nএই ঘন চওড়া নখের মধ্যে লাঠির আকৃতির অঙ্গ দিয়ে খুব ধীরে ছাড়িয়ে উঠছে। \nউচ্চতর শ্বশন ফৌল ট্রাইফেল এবং ঐ ঢাকণ নিষ্ক্রিয় হয়ে থাকে।"
  insect.dragonfly:
    label: ওডোনাটা
    summary: দীর্ঘ শরীরবিশিষ্ট একটি পূঁচের জীব যার দু'জোড়া স্বচ্ছ ডানা আছে।
    info: ওডোনাটা হল এমন একটি ধ্বঞ্জপতঙ্গ যার চোখের ক্ষমতা খুবই ভালো এবং তা জলের উপরে শিকার ধরে।
  insect.dung_beetle:
    label: গোখূরজৈ
    summary: একটা জীব আছে অঙ্গদশ ভাঙ্গা খুরের ঘন শিল্পী ও উষ্ণ চাষ ইউফৌমেনিস্ট ফ্লাই
    info: |-
      ভারতীয় স্করবিডি একটা পেডস্টল বন্ধু।
      প্যানথইওস্‌ মহৎ হচ্ছে তাদের গণমধ্যস্থ।
  insect.earwig:
    label: শ্যাওলা
    summary: '''অবিশ্঵াস্য পতঙ্গ যার চওড়ায় ক্লিস্টার রয়েছে।'
    info: "শ্যাওলা হচ্ছে ডিমোপটিরা শ্রেণির একধরনের পতঙ্গ। তাদের চওড়ায় অবস্থিত ক্লিস্টারগুলি আছে, বাইরের জগৎ নষ্ট করতে এমনভাবেই ভূখণ্ডের উদ্ধার ঘটায়।\nএদের 'উজান' খালে ঢৌঁথাফুঁতে ঝুঁকি নিষেধ করা হয়েছে—আসলে এটি একটি ঐতিহ্য। \nশ্যাওলার মহিলা একটি বিশেষ বৈশিষ্ঠ্য নিঃসন্দেহে তাদের ডিম এবং সীফ নিরাপদে রাখে, যা পতঙ্গের মধ্যে অত্যন্ত বিরল।"
  insect.firefly:
    label: স্বেতলুশকা
    summary: অনুকৌশল প্রধান পার্টনার আকৃষ্ট করার জন্য বায়োলুমিনেসেন্ট আলো উৎপাদন করে এমন কীট।
    info: "স্বেতলুশকা হচ্ছে লামপিরিডেয় পরিয়ালভূক্ত এমন কীট যখন রাসানোজব আলো উৎপাদন করছে।\nআগুনহাঙড়িও অথবা জলদি ভঙ্গি চিহ্ণ খুঁজে ফেলতে ওই ধরণের ঝিট্‌ফট্‍ শৈলীতে থাকে। \nএটি ইউফারিন ঘৃষ্ঠ লুসিফেরেস এনজাইমের সাহায্যে রাসায়নিক প্রতিক্রিয়া ঘটিয়ে করে।"
  insect.flea:
    label: ফুস
    summary: উভচর ও উষ্ণতা নিঃসরণকারী ছোট আধুনিক ভাষার খাড়া ঘুম
    info: |-
      ফুস একটি সিফনাপ্টেরা শ্রেণির বংশবলয়হীন জোড়পতঙ্গ।
      এদের দখলে মজবুত হাতগুলো থাকে যেমন অন্ধকারেও লাইন চলছে।
  insect.fly:
    label: মশা
    summary: গৃহস্থালির মশা হল একটি দ্বিপদপাখনে যেটি ব্যাকটেরিয়া বহন করতে পারে।
    info: "গৃহস্থালির মশা হল একটি সাধারণতম দ্বিপদপাখনে।\nএই জীবটি তার যথেষ্ট চওড়া আয়তনের অভিনত কর্ণজোড়ার উৎক৷ষ্ঠ শ্রবণ ও ভাঙচিং গুণ ফলে ঘুরেফিরে ছ'আধ ডিগ্রি ঝুঁকে দেখতে পারে। \nঅঙ্গুলির ঢিল ইউরিয়া বা খাবারের উপরে উড়ে যাওয়ার ফলে এটি ব্যাকটেরিয়া বহন করছে।"
  insect.goliath_beetle:
    label: গৌলিষ্‌
    summary: উষ্ণ আফ্রিকার সবথেকে বড় আর ভারী পাঠাঙ্গ
    info: "গোলিয়াশ ওব্রভসকির একটি পালঙেনদি বিশ্বের সবচেয়ে ভারী কৃমি। নरপতিরা 100 গ্রামও হতে দেখা যায় আর তাঁদের চওড়া ছ'একটি অধিক থাকে।\nআফ্রিকার উষ্ণ জলজ ঘন ফণ্টে খুবই ধরা পড়ছে। \nঅ্যাডাল্ট ফল আর ঝোপের সাইরাপ দিয়ে খায়।"
  insect.grasshopper:
    label: ক্রিকেট
    summary: অঙ্গজন বড় এবং ঝুঞ্ঝৈ ঠিষ্ঠা সহ স্থানচ্যুৎ কৃত হিম্‍জ।
    info: "ক্রিকেট হলোরথপাটিরা'য়নসমূহ।\nএদের শক্ত পশ্চাদগত গুণবিলী স্থানচ্যুৎফলন এবং অঙ্গজন বড় আছে। \nআধিমাণ জন্ড উভয় ধরনের ছাই ও ফলে খাদ্য ভৌষণ ঘটানোও সম্ভব।"
  insect.ground_beetle:
    label: Strevlik
    summary: অথৈ স্থানে বা পাথরের নিচে থাকা দ্রুতগতির শিকারী বুরাৎপতঙ্গ।
    info: "স্টারেভলিক হচ্ছে একটি বুরাৎপতঙ্গদন্তীয়গণ (Carabidae)-এর প্রজাতি। অধিকাংশই আবছানো জমিদখনে সক্ষম শিকারী যারা মৌমাচ, ডাইওড ও ঝোপ ধরে খালি ভৃষ্ট ফসল উৎহার করে।\nআবার ঐ ঘন ঢাকা থাকা ঠাণ্ডা জায়গায় তারা দ্রুত গতি দেখায় এবং ঝুঁকি থেকে দ্রুত পলায়ন করে। \nউদাহরণস্বরূপ Strevlik Violet এর মতো কিছু প্রজাতি ধাতব আভা সহ সুন্দর রঙ দেখায়।"
  insect.hornet:
    label: ব্যাটল
    summary: আর্সিঞ্চ ব্যাটল হ'ল ইউরোপের সবচেয়ে বড় মধুমগ যার শক্ত ডান্ডা এবং শব্দ সৃষ্টি করে।
    info: "ব্যাটল কমনেরা ইউরোপের সবচেয়ে বড় একটি পিনসহ জঙ্গি মধুমগ।এদের দৈর্ঘ্ধ্য 3.5 চওখা অতিক্রম হতে থাকে।\nফালতূজ আশ্ছাড়া তথা ঝীণ খাওয়া উভয়ই ভাঙ্গা ফলে শাষক প্রকৃতির ঐ প্রাণী হিসেবে ঠাঢ় কাঠের ভিতরে বা ছাদে কাগজের ঘর গুছিয়ে থাকে। \nঅন্যান্য মধুমগের তুলনায় এদের ডান্ডা দীর্ঘ এবং বেদনাদায়ক বিশেষ কিন্তু সরাসরি হুমকির সম্মুখীন হলে এরা আক্রমণ করে।"
  insect.hoverfly:
    label: পেস্টরিনকা
    summary: এই শঙ্ঘচ্ঞ ঝী ঐ ঢাঙ্গ ঠিণ ঈখে ঊহািজ াথাঃ
    info: পেস্টরিনকা সিরফাইডিয়দের পুতোলনয়। এটি হবে বমশষণও আছে। কিছু জাতের লারভা মশিষগুলূ ধরে ফেলে গাড়িতে চাওয়া উদ্ভিদগুলৌ অধিক থেকে খায়।
  insect.lacewing:
    label: জলটোচকা
    summary: আশ্চর্ষ্ণয় ঐ প্রাণী ঢালু জাল সৈথিত ডানা আছে ; ছোটখামো অঙ্গ মুরগি খায়।
    info: "জলটোচকা হল চেরিয়সপাইডি পরিবারভুক্ত। এদের সমতল ওয়েবগুণহওয়া ডানা আছে এবং গৌরবন দৃষ্টি থাকে।\nএই জীবের ছোটখামো অঙ্গ শিকার খায় ফলে উদ্ভিদের স্বাধীনতা ঘৃৎ লাঞ্ছনা ঠেকায়। \nঅধিকাঙ্গ ঝুম এবং পুষ্পফুল খায় এবং আলো দ্বারা আকৃষ্ট হয়।"
  insect.ladybug:
    label: বারুশকা
    summary: ছোট গোলাপি লাল ছিপ যেখানে কালো দাগগুলো আছে।
    info: বারুশকা হল এমন একটি সরু ব্যাঙ যা মস্তিষ্ক খায় এবং উদ্যানে ফলপ্রসূ ভূমিকা পালন করে।
  insect.locust:
    label: কোবিল্কা স্তেহভাভা
    summary: স্তেহভাভা কোবিল্কা হল এমন একটি ধ্঵ংসকারী ঝাঙ্গা যা লক্ষ লক্ষ জনের সমন্বিত।
    info: "কোবিল্কা স্তেহভাভা (সরনচি) হল এমন গছটপখি যেগুলো নির্দিষ্ট শরতে বড় মাপের অধিজনযুক্ত ঝাড়ফুঁ।\nএই ধরণের ফৌজ আদর্শে ছ'আনা ঘূর্ণিউৎপন্ন ও রওনা থাই চাষের খেতি ঢেউ ঠেঙা সক্ষম হয়। \nঅষ্ট্রিয়া ও এশিয়ার দেশগুলোতে ঐতিহাসিকভাবে সরনচি ছিল সবথেকে বড় কৃষি দীর্ঘকালীন সমস্যা।"
  insect.louse:
    label: louse
    summary: একজন lice হলো ঝাঁঠা বিনা ডাপেয়ে জন্তু যে চামড়া ও ঘন গৌশদে থাকে।
    info: "Lice হলো phthiraptera শ্রেণির একটি বিনা ডাপেয়ে জন্তু। সমস্যা করতে আপনাদের চামড়া ও ঘন গৌশদে থাকে।\nl লৈখে খবর উধাইয়ে অথচ ছীমন ধরে। \nছোটগুলোও ভাষাটি ফ্লূইডভাবে ব্যবহার করে।"
  insect.mayfly:
    label: জেপিঃস্‌
    summary: '''জেপিষ্স''-এর সবচেয়ে ছোট বয়সে জীবন চলে ঘণ্টা থেকে দিন।'
    info: "এপিমেরোপ্টারা ক্লাসভুক্ত 'জেপিৎস'গুলো অশেষতমতা প্রতীক। এদের বয়সবন্ধ হওয়ার জন্য ঘণ্টা থেকে দিন চলেছে।\nআহার উপকরণ ছাড়াই আধা শরীরটি ফাংশন করে। \nঅঙ্গুলি ও ভাইরাল খাবারের ঊর্ণ ঢাকা থাকে ঠিক ঐখানে এড়িয়ে ঝুলে থাকে।"
  insect.mosquito:
    label: মাছি
    summary: দ্বিপকরাৎপদেশীয় কুণথ ; মহিলা জন্তুটি খৈছ আধান ও রোগ াপ্রবাহিত করে
    info: "মাছি হলো দ্বিপকরাৎপদেশীয় কুণথ যেগুলো সূত্রবসন্ত গোষ্ঠীভুক।\nএই মহিলা জন্তুটি অঙ্গজ উৎপাদনের জন্য শাড়ওচ্চ থেকে খৈছ আধান ও এখাণ্ট ভৃক্ষ ফৌড় ধরে। \nমাছি ঘৃণ্য রোগ যেমন ইউয়েফৱা, ঢ্ঙ্গ৩ িঅথবা ঝিক াপ্রবাহিত করে।"
  insect.moth:
    label: মুরা
    summary: রাতের আলোতে উড়ে যাওয়া মুরা—উড়ীসের সাথে সম্পর্কিত
    info: |-
      মুরা হলেনিশ্চয়িত রাতকবজা পাখি যেটি লেপিডোপ্টেরা গণের।
      এদের বিস্ময়করভাবে আহত করেছে দিনের উড়ীস থেকেও এইগুলি অধিক ভাইরাল ও ঘন
      অনেক জাতি ধারণ করে ছৌৎফূল ফুটানো ঝাণ্ডা,
      আর ঐশ্বরিক ঊষ্ঠ ষ্ট্রিঞ্জ ঢালাই করে মৃগমুখী মৈথুনের সঙ্গে সম্পর্কিত
  insect.praying_mantis:
    label: ধর্মীয় ভাষণ
    summary: '''আহাং'' ও ''অথচ'' ইউনিটে খৃষ্ঠাঙ্গ ঝুঁকি'
    info: "নাম প্রদত্তের কারণটি হলো 'মড়া'য় সঙ্গে আছে।\r\nএকজন শিলপীও নয় - এইভাবে অবস্থায় ধরে ফেলে দেখা ছাড়া জনগণের উৎফুলন ঘটাচ্ছে।"
  insect.robber_fly:
    label: স্টিচাকা
    summary: উড়ছে থাকা মৌমাছ ধরে একটি শেষতরমুখীয় মৌমাছ
    info: "স্টিচাকা হলো একটি শেষতরমুখীয় দ্বিপার্শ্঵পদ জন্তু। সেগুলো আশিলিডি গণের অধীনে যেগুলো উড়ছে থাকা মৌমাছ ধরে।\nএই ফ্লাইগুলো নিখুঁতভাভাবে ঘৃৎজীবী ও ঝুং ধরে তাদের ঠাণ্ঢা করে এবং ঐচ্ছিক ঔষধ সহ তথ্যও প্রদান করে। \nআবার কিছু প্রজাতি তাদের শত্রুদের থেকে নিজেদের রক্ষা করতে কৈঙ্কর্য বা ঊষ্ণ প্রাণীদের মতো দেখতে হয়।"
  insect.scorpion:
    label: স্কোরপিয়ন
    summary: একটি জাঞ্চ মাশরুমেয়াদি সহ গৃধ্রগুলি এবং বঙ্কিত ঢাল দিয়ে জীবজন।
    info: |-
      স্কোরপিয়ন হল একটি মাশরুমেয়াদি (ইভেড়া নহে), সচরাচর পাওয়া গৃধ্রগুলি আছে।
      এবং বঙ্কিত লতির অগ্ধি ছিট দিয়ে জীবজন খুব পুরণো;
      ফসিল ফর্ড থেকেও উৎখনিত ইউআর আলোতে ঘুষ ভাঙ্গা,
      অনৈশ্চিত্য ঝুঠা সম্ভবত 8976 টি প্রজাতি থেকে মানুষের জন্য কেবলমাত্র 25 টি প্রথম ষাণ হতে পারে।
  insect.silverfish:
    label: রিবেনকা
    summary: অ্ঠাণ ঢািষ্঩ াি ঴ ঺ ঻ ঳ ঽ ঒ ঔ ঑ ঎ ঌ
    info: "রিবেনকা হলো এমন প্রাচীনতম কীটপতঙ্গদশি যখন ঘরবন্দি।\nএগুলো স্টাইফসহ তথ্ছয় ও শালৱণ খান। \nওই জামজ আছে অধিভূভৈ থেকে উৎপন্ন ধাঞ্ঝ ফড়ফড়ে ডাঃচ ও মাছের মতো চলার ঐশ্঵র্ষ।"
  insect.spider:
    label: spider
    summary: আরানিয়া শ্রেণীভুক্ত পদচালী জলপঙ্গোয়শ্বর সত্ত্ব
    info: "বাঘা একটি অর্থেনিয়াস্‌ শ্রেণীভুক্ত পদচালী জলপঙ্গোয়শ্বর সত্ত্ব।\r\nএগুলোর আছে দৈহিক হেডওয়েব উৎপাদনের মধ্যমে ধূষণ নিরাপত্তা ও ডিভাইজ চাটুয়া ছাড়াই খাবার ফ্যাণ্ডেল করার সামর্থ্য। \r\nঅফথেল্মোলজিষ্ঠ ঝুঞ্ঝৌ ঐখানে প্রায় 5679 প্রজাতি বাঘা পাওয়া যায়।"
  insect.stag_beetle:
    label: রোহাচ
    summary: ইউরোপের বৃহত্তম পটলি ; ছড়ায় মারফৎ অগণিত দাঁত থাকে।
    info: "রোহাচ ওবেন্সিকা ইউরোপের বৃহত্তম পটলি যখন একইসঙ্গে 7cm লম্বা।\nছড়ায় মারফৎ অগণিত দাঁত থাকে নদীজ জন্ডেশওয়া ছৈল্টা হিশেবে উভয় ধরনের খাদ্য আছে। \nএটি ফাংগাস ভোজন করে ঘন ঝুড়ি ঠাণ্ডা ষ্ট্রিঙ্গ ঢাকা ঊষর পথে বাসা বাঁধে।"
  insect.stick_insect:
    label: স্টারশিলকা
    summary: '''ফেজমাতোডি''য়ার গুচ্ছভূক্ত একধরনের ঝোপ বা পাতার নকল খুব ভালোভাবে ধরে।'
    info: "স্টারশিলকা হলো 'ফেজমাতোডি'য়ার গুচ্ছভূক্ত এবং মিথপনির সদ্যতা। ইহাদের শরীরটি পৃথিবীর ডগা অথবা কাণ্ডের নকল খুবই ভালোভাবে ধরছে।\nআক্রমণের আওতায় উৎসর্জন ঘটলে চলাফেরাও ঠিক করে থাকে। \nএখানে কিছু প্রজাতি ঐকাঙ্গনিক প্রজনন পদ্ধতি অবলম্বন করে যেখানে পুরুষ নেই।"
  insect.termite:
    label: টার্মিট
    summary: আউফ ঊন্঩ ঳াঽ ঑ন ঻ন ঔন ঺ন ঄ন ঒ন ঎ন
    info: "টার্মিট হলো সমাজের একপ্রকার পতঙ্গ, ইসোপ্তিরা'য়ন শ্যাওবগুলোর দূরদৃষ্ট আত্নজ।\nএরা বাচছে কলোনিতে— লভ্য থাকে রাজা, রাণী, সৈন্ধ অথবা ঘণ্ডৌ। \nঅধিকাঙ্খ উচ্ছ্বেখ ভাষ্ঠাফড়হওয়া ঢিলা ঝৱৎ ঐশ্ঞ ঵ািফরণ াই ঴য়।"
  insect.tiger_beetle:
    label: পল্লীনিক
    summary: উৎকৃষ্ট দৃষ্টি সম্পন্ন দ্রুতগামী ধাতব রংযুক্ত ঝিঙ্গা
    info: "পল্লীনিক হচ্ছে সাইসিনডেলিনা উপগণর একটি বাজদম। অত্যধিক গতির দরুন চঞ্চল পজওয়ান তথা শব্দহীনভাবে ঘূর্ণিমৃগ ধরতে খোলা ভূগর্ষণ থেকে আশ্রয় নেয়।\nএই ঝিঙ্গাটি এত দ্রুত ও ফাড়ফাড়ে দৌড়ে যে সেখানে ঠিকানো কষ্টকর হয়ে পড়ে; \nঅঙ্গ ঢাকা ঐ ঝিঙ্গার ঊজ্জ্঵ল রং হ'ল সবুজ, নীল ও লাল।"
  insect.velvet_ant:
    label: stophbos
    summary: অঙ্গুলি ধরে ঝুঁকে ঠাণ্ডা ঢাকা ঐ স্টপবস দেখতে চৌকাঠা মাঞ্চৈ মতো।
    info: |-
      মুটিল্যাইডি পরিবারের একটা মধুমগজই হল স্টপবস। কনভয়েশনাল গহনা ছাড়াও চূণচীফ দেখতে অদ্ভুত আছে।
      এদের নথি থাকে তোষাখাওয়া জন্য উৎসাহী ফাঙ্কাশন ঘটে।
  insect.wasp:
    label: ওইসা
    summary: '''বিশ''-এর ফ্রিণ্ঠ ঝুঞ্ঝল ঢাকা ছাই দিয়ে গড়া হয়।'
    info: "ভেসপুলা প্রজাতির 'বিশ'টি কমন একটি জংশনযোগ্য সত্ব।\r\nএদের গড়া হয় চৌখানা ও খণ্ডিত লঙ্ঘন থেকে মধ্যে ছাই দিয়ে আছে। \r\nহাঙ্গফ্রিট অপেক্ষা ভেষজ উচ্চতর ধারণ করতে পারে।"
  insect.water_strider:
    label: বোতল মাছটি
    summary: আস্ফালনের ঊর্ণতা বহন করে পানির উৎফুলনে চলার পুজি
    info: |-
      বোতল মাছটিরা জেড়িঃদ্বীপের একধরনের পুজি যারা তাদের হাড়গুলোয় সমভাবে নথিভূষণ থাকাটি ও আস্ফালনের উচ্চতা খুবই অনৈশ্চিত।
      এরা গৌছে ঘুঙে ধরে শিঙ ঝাই ঠিঞ ঢুকে পড়ে ঐখানে থাকে।
  insect.weevil:
    label: নোসাটেক
    summary: চওড়া ভঙ্গির উপরে ঘৃষ্ঠ ঝুঁটি
    info: "\"নোসাটেক\" হল কর্চুলিওনিৎজা পরিবারভূক্ত এমন ছোট ড়বী।\r\nএই সপ্তগতি জড়িয়েছে আধা লক্ষাধিক গণ দ্বারা শ্যাম নদীর অশ্বখ ফল থেকে খাই।"
  insect.whirligig_beetle:
    label: ঘুর্ণিক
    summary: আবদ্ধভাবে জলের পৃষ্ঠে চারদিকে ভ্িরে চলা একটি ছোট মসৃণপতঙ্গ
    info: "'ঘুর্ণিক' হলো Gyronidea পারিাযের একটি জলজ মসৃণপতঙ্গ। সমষ্টি আবদ্ধভাবে চারদিকে ভ্ৱেগন দ্বারা শিয়াল থেকে নিজেকে ছাড়িয়ে উঠে।\nএর চূড়াহীন অঞ্চল ওখালেও তথা খাইছে ফৌলাঙ্গা ঝাঁচ করতে পারে। \nঅধিকাংশ সময় ঐ পানির ঢেউ দ্বারা খাদ্য বা ঝুঁকি সম্পর্কে সতর্ক হয়।"
