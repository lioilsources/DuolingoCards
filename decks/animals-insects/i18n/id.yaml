lang: id
pivot: false
title: Serangga
cards:
  insect.ant:
    label: semut
    summary: Serangga sosial kecil yang hidup dalam koloni.
    info: Semut adalah serangga yang membentuk koloni besar dengan pembagian kerja. Mereka hidup secara bersamaan dan bekerja sama untuk kelangsungan hidup koloni.
  insect.antlion:
    label: antlion
    summary: Larva yang membongkar perangkat penangkap semut di atas permukaan pasir.
    info: |-
      {"hint":"larva serangga yang menggali perangkap lubang untuk menangkap semut","info":"Antlion adalah larva serangga dari keluarga Myrmeleontidae yang membuat jebakan berbentuk kerucut di pasir kering.
      Saat seekor semut tergelincir ke dalamnya antlion akan mencengkeram dengan rahim dan menyuntikkan cairan pencernaan.
      Individu dewasa tidak begitu nyata bentuknya mirip seperti libellula tetapi mereka aktif pada malam hari.
      larvae dapat hidup bertahun-tahun tanpa memperbaiki dirinya sendiri."}
  insect.aphid:
    label: afide
    summary: Insek usil nan memakan getah tumbuh-tumbuhan pado batang-batangan tanamannya.
    info: '{"hint":"serangga penghisap nektar kecil yang hidup di batang tanaman","info":{"label":"aphis","summary":"Serangga penghisap cairan tumbuhan pada batas daun dan cabang-cabangnya; menghasilkan madu."},"detail":{}}'
  insect.atlas_moth:
    label: kepiting atlas
    summary: Salah satu kupu-kupu hutan terbesar dengan pola warna seperti kepalan ular.
    info: |-
      {"hint":"satu dari kupu-kupu malam terbesar di dunia","info":"Kepiting Atlas adalah salah satu kupu-kupu hutan yang paling besar dengan rentang sayap mencapai 30 sentimeter.
      Ujung sayarnya berwarna sedemikan rupa sehingga menyerupai kepala ular untuk mengusir predatornya.
      Individu dewasa tidak memiliki mulut dan sama sekali tidak memakan apa pun serta hanya bertahan hidup beberapa hari sebagai individu dewasa.
      Mereka berasal dari hutan-hutan tropis Asia Tenggara."}
  insect.bedbug:
    label: nyamuk
    summary: Parasit darah mengisap pada waktu tidur
    info: Nyamuk kecoa datar adalah serangga pipih berbentuk lonjong dari kelompok Cimicidae yang aktif terutama di malam hari.
  insect.bee:
    label: lebah
    summary: Serangga hitam-kuning yang mengadakan penyerbukan bunga dan membuat madu.
    info: Lebah madu adalah serangganya sosial yang tinggal di sarangnya dan mengumpulkan nektar dari tanaman untuk dibuat menjadi madu.
  insect.beetle:
    label: kumbang
    summary: Ordo ini merupakan kelompok serangga terbesar dengan jumlah individu melebihi empat ratus ribuan.
    info: Kumbang termasuk dalam ordo Coleoptera dan membentuk kurang lebih 40% dari semua spesies serangga yang telah diidentifikasi. Mereka memiliki sayap keras berlapis elytron dengan sayap terbang sesungguhnya tertutup di bagian bawahnya. Kumbang jantan rusa adalah jenis kumbang paling besar di Eropa; betinanya tidak mempunya tanduk.
  insect.bombardier_beetle:
    label: kecoa strevlik
    summary: Sejenis kecoa mengeluarkan uap beracun sebagai bentuk perlindungan.
    info: Kecoa strevlik artileri adalah kecoa dari tribus Brachininae yang memiliki cara pertahan diri unik dengan mencampur dua senyawa kimia di bagian belakang tubuhnya sehingga terjadi reaksi eksotermis melepaskan panas lebih tinggi dari suhu air mendidih.
  insect.bumblebee:
    label: bumblebee
    summary: Lebih besar dan lebih bulum daripada lebah biasa; membantu menyebarluaskan bunga.
    info: '{"hint":"tawar","konteks":{"judul":null,"isi":["Bombyx adalah serangga berambut tebal dari suku Bombycidae yang mirip dengan lebah madu.", "Ini merupakan penyerbu penting terutama di iklim dingin tempat lebah tidak banyak beterbangan.", "Ia bisa menghangatkannya sendiri melalui getaran otot sayapnya sehingga dapat terbang meskipun cuaca dingin."]},'
  insect.butterfly:
    label: lepidoptera
    summary: Serangga terbang dengan sayap berwarna besar.
    info: Lepidoptera adalah serangga yang memiliki dua pasang sayap bersisik, sering kali berwarna mencolok.
  insect.caterpillar:
    label: ulat
    summary: Larva kupu-kupu atau ngengik; makannya daun-daunan sambil siap-siap jadi imago.
    info: |-
      Ulat adalah larva kupu-kupu atau ngengik dan menghabiskan kebanyakan hidupnya dengan memakai daun untuk menyimpan energi menuju metamorphosis lengkap.
      Beberapa ulat memiliki warna mencolok yang berfungsi sebagai peringatan bagi pemangsa bahwa mereka bersifat racunius.
      Saat menetas dari telur menjadi pupa, ia membentuk kubah chrysallis di mana terjadi transformasi total tubuh hingga dewasa.
  insect.centipede:
    label: cingcer
    summary: Hewan bertubuh berselip dengan sepasang kaki pada masing-masing selip.
    info: '{"hint":"arthropoda berkaki banyak dengan satu pasang kaki pada setiap segmen tubuh","info":"Cacing berbuku termasuk ke dalam kelas Chilopoda dan memiliki sepasang kaki di tiap bagian badannya (tidak sampai seratus seperti yang disarankan namanya).\nIni adalah predator cepat yang memburu serangga, cacing tanah serta vertebrata miniatur lainnya.\nPasangan pertama kakinya dimanfaatkan sebagai belalang racun untuk melumpuhkan mangsa.\nBeberapa spesies dari daerah tropis bisa mencapai panjang lebih dari 30 sentimeter."}'
  insect.cicada:
    label: Belalang
    summary: Seranggaa pengganggu yang dikenal karena bunyi bernyanyinya di siang hari yang hangat.
    info: '{"hint":"serangga penyeray kuat yang berisik; jantan menghasilkan lagu berdengung keras","info":{"label":"belalang","summary":"Serangga terkenal dengan suara nyanyian berdecap pada hari-hari panas.","detail":{}}}'
  insect.cockroach:
    label: kecoa
    summary: Serangga nokturnal karnivor atau omnifagus yang sangat tangguh serta mudah menyesuaikan dirinya.
    info: |-
      {"hint":"hewan serangga pemakan bangkai malam hari yang cepat","info":"Kecoa adalah salah satu serangga paling tahan banting di dunia; ia bisa bertahan hidup dari radiasi dan kondisi-kondisi ekstrem yang akan membunuh makhluk lainnya.
      Lebih dari 4.500 spesies kecoa ditemukan secara alami tetapi hanya sekitar 30 jenis saja yang tinggal dekat manusia.
      Ini juga merupakan serangga purba—kecoa telah ada selama lebih dari 300 juta tahun lalu bahkan mampu melewati zaman dinosauri.
      Mereka sangat lincah karena dapat bergerak dengan kelajuan mencapai lima kilometer per jam."}
  insect.crane_fly:
    label: cicada
    summary: Serangga mirip nyamuk beserta ciri-cirinya.
    info: '{"hint":"nyamuk raksasa dengan kaki panjang","info":{"label":"cicada","summary":"Kecoa besar yang menyerupai nyamuk dan memiliki sayap transparan serta tubuh bersegmen tiga bagian utama."},"data":[{"question":"Apa itu cicadas?","answer":"Cicadas adalah serangga dari kelompok Orthoptera atau belalang berkaki kuat seperti kecoa tetapi tidak bisa terbang karena hanya punya dua pasang sayap di depan saja."},{"question":"Bagaimana siklus hidupnya?","answer":"Mereka melewati fase larva selama beberapa tahun sampai akhirnya menjadi dewasa setelah mengelami metamorfosis lengkap yaitu telur - nimfa/nimfoid - imago/imaga."}],"meta":{}}'
  insect.cricket:
    label: belalang
    summary: Serangga nokturnal dengan karakteristik nyanyian laki-lakinya.
    info: Belalang medan adalah serangga malam dari ordo Orthoptera yang dikenal karena suaranya saat berkicau di malam hari.
  insect.damselfly:
    label: capung kecil
    summary: |-
      Hewan mirip capung tapi bentuknya jauh lebih ramping,
      melipat sayapnya rapat-rapat selama masa istirahat.
    info: |-
      {"hint":"kerabat ramping dari capung yang beristirahat dengan sayap terlipat","info":"Capung kecil adalah serangga kerabat capung tetapi lebih langsing dan saat istirahat melipat sayapnya sejajar tubuh mereka, tidak seperti capung pada umumnya.","label":"capung kecil","summary":"Kerabat langsing capung;
      saat istirahat menggulungkan sayap secara paralel."}
  insect.diving_beetle:
    label: kecoa
    summary: Serangga predator yang berkembang biak dalam air.
    info: |-
      {"hint":"laron predator yang berenang di danau","info":"Kecoa air besar adalah serangga pemakan buah dari keluarga Dytiscidae hidup di kolam renang alami atau genangan air tenang.
      Ia dapat mengapung dengan mudah karena kakinya belakangnya datar seperti dayung.
      Dia bernapas melalui permukaan air dan menyimpan udara dibawah tubuhnya untuk pernapasan saat tenggelam.
      Mereka memburu nyamuk kecil serta muda burung laut lainnya baik siang maupun malam hari."}
  insect.dragonfly:
    label: libelula
    summary: Serangga dengan tubuh panjang dan dua pasang sayap transparan.
    info: Libelula adalah serangga pemangsa dengan penglihatan yang sangat baik, berburu di dekat permukaan air.
  insect.dung_beetle:
    label: Vru
    summary: Seekor kupu penggulung bulatan tinja; suci pada zaman Mesir purba.
    info: |-
      Kumbang Vruba adalah kupu dari kelompok Scarabaeidae yang membentuk feses menjadi bola dan menggelindingkan ke dalam tanah untuk menyetel telur mereka di sana
      Di Mesir Kuno ia merupakan simbol matahari serta dewa Khafre.
      Ia salah satu hewan langka yang berorientasi dengan Bima Sakti,
      dan juga mempercepat daur ulang nutrisi serta menyediakan udara bagi tanah.
  insect.earwig:
    label: kecoa
    summary: Serangga panjang dengan klitriks di ujung belakang.
    info: '{"hint":"serangga memanjang dengan cakar di bagian ekor","info":"Kecoa berbulu adalah serangga dari ordo Dermaptera yang memiliki klitrik pada akhir tubuhnya untuk pertahanan dan perkawinan\rNama berasal dari mitos bahwa mereka merayap ke dalam telinga manusia; ini merupakan kesalahpahaman\. Betina kecoa unik karena mengasihani telur-telurnya sendiri serta awal tahapan metamorfosisnya, sesuatu yang langkah bagi para serangga\\"}'
  insect.firefly:
    label: kepiting
    summary: Belukang memancarkan sinar biru sebagai daya tarik pasangan.
    info: |-
      {"info":"Kepinding adalah belukang dari kelompok lampiridae yang mampu menghasilkan cahaya dingin melalui proses biofluoresensi di bagian perutnya.
      Jantan dan betina menyalakan cahaya dengan pola berbeda untuk saling pengenal dan tarikan satu sama lain.
      Pola ini dikendalikan oleh reaksi kimia antara lusifern dengan enzim liseras.
      Kehadiran keping juga menjadi penunjuk tingkat keragaman lingkungan."}
  insect.flea:
    label: lice
    summary: Serangga kecil penggigit dengan gaya hidup parasitis pada mamalia dan unggas.
    info: |-
      Lice adalah serangga tanpa sayap dari urutan Siphonaptera yang hidup secara parasitis.
      Kaki belakangnya yang kuat memungkinkan melompat lebih dari 150 kali panjang tubuh mereka.
      Mereka menghisap darah mamalia dan burung serta dapat menularkan penyakit;
      historis lice pernah menyebabkan wabah pes.
  insect.fly:
    label: lalat
    summary: Serangga dua-sayap biasa yang dapat menyebar bakteri.
    info: Lalat rumah adalah serangga dua sayap yang paling umum ditemukan di lingkungan manusia. Matanya komposit memungkinkannya melihat hampir seluruh area sekelilingnya dalam radius kurang lebih 360 derajat. Lalat ini membawa dan menyebarkan bakterinya karena suka mendarat pada limbah maupun bahan makanan.
  insect.goliath_beetle:
    label: kumbang
    summary: Salah satu kumbang paling besar serta beratnya tertinggi berasal dari daerah hutan hujan tropis Afrika.
    info: Kumbang Goliat raksasa adalah salah satu serangga terbesar di dunia dengan jantan yang bisa mencapai berat sampai 100 gram dan panjang lebih dari 11 sentimeter.
  insect.grasshopper:
    label: Belalang
    summary: Hewan serupa belalang yang bisa meloncat sangat tinggi karena kakinya yang besar serta mengeluarkan bunyi dengungan dari gesekkan sayapnya.
    info: '{"hint":"serangga melompat dengan kaki belakang yang panjang","info":{"label":"belalang","summary":"Serangga pemberi suara berdengung dan berkaki kuat untuk lompatan jauh","detail":{}}}'
  insect.ground_beetle:
    label: strevlik
    summary: Ulat pencakar aktif malam hari yang memakan serangga lainnya seperti cacing tanah serta siput.
    info: '{"hint":"cacing predator yang cepat berjalan dari keluarga Carabidae ditemukan di balik batu","info":{"label":"strevlik","summary":"Kecoa pemangsa liar yang tinggal di bawah bebatuan dan daun."}}'
  insect.hornet:
    label: syrphen
    summary: Lebah besar dengan sengat kuat yang menghasilkan suara mendesis keras.
    info: Lebah sosial terbesar di Eropa ini bisa mencapai panjang lebih dari 3,5 sentimeter dan membangun sarang berbentuk kertas dalam lubang pohon atau atap bangunan.
  insect.hoverfly:
    label: pesťenka
    summary: Serupa dengan lebah atau tawon dalam penampilan eksterior.
    info: Bombyliidae adalah serangga berdada dua dari familia Syrphidae yang meniru warna tawon dan lebah sebagai perlindungan terhadap predatornya (bromelia mimicry) meskipun tidak memiliki sengat sendiri.
  insect.lacewing:
    label: kupu-kupa emas
    summary: Serangga cantik dengan sayap transparan bertekstur seperti anyaman.
    info: '{"hint":"serangga halus dengan sayap transparan berbentuk anyaman besar","info":"Kupu-kupa emas adalah serangga dari kelompok kupu-kupa yang memiliki sayap tipis dan bening serta mata keemasannya. Larvanya bersifat predator dan memakan banyak kutu daun sehingga menjadi pengendali alami bagi tanaman-tanaman tersebut. Dewasa mengonsumsi madu dan debu bunga."}'
  insect.ladybug:
    label: kelelawar
    summary: Kecil bulat merah dengan titik hitam.
    info: Kelelawar adalah kumbang kecil yang memakan kutu dan berguna di taman.
  insect.locust:
    label: Belalang Migratorius
    summary: Spesies belalang ini terkenal karena kemampunya menciptakan kawanan raksasa dengan jumlah hingga trilyunan ekor setiap tahunnya.
    info: '{"hint":"belalang yang berkembang biak secara bergerombol membentuk gumpalan besar dan merusak","info":{"label":"Belalang Migran","summary":"Belalang migrasi adalah jenis belalank yang di bawah kondisi tertentu dapat menghasilkan rombongan masif yang bisa menyerap jutaan individu dalam satu hari saja untuk memporamakan seluruh hasil panen pada ribuan hektar lahan pertanian."}}'
  insect.louse:
    label: Lintah
    summary: Hama kecil tidak bersayar yang tinggal pada tubuh mamalia.
    info: Lintah rambut adalah serangga tanpa sayap dari ordo Phthirakteria yang hidup di kulit dan buluh atau helai rambut tuan rumahnya.
  insect.mayfly:
    label: ephemeron
    summary: Insekta yang memiliki masa hidup sebagai individu dewasa paling pendek—hanya bertahan selama beberapa jam atau hari saja.
    info: '{"hint":"serangga singkat yang berkumpul di dekat sungai","info":{"label":"ephemeron","summary":"Serangga dengan kehidupan dewasa terpendek hidup hanya beberapa jam sampai hari."},"data":{}}'
  insect.mosquito:
    label: nyamuk
    summary: Serangga berkaki panjang dengan sayap kecil; apabila betina bisa membawa serta menyeberangkan beberapa macam penyakit tertentu kepada manusia melalui gigitannya.
    info: |-
      {"hint":"serangga penyerap darah yang terbang","info":"Nyamuk adalah serangga berdada dua dari keluarga Culicidae.
      Betina nyamuk mengisap darah makhluk hidup untuk mendapatkan protein dalam pengembangan telur mereka; jantan memakan madu bunga.
      Beberapa jenis nyamuk menyebarkan penyakit seperti malaria dan demam chikungunya atau Zika virus.
      Di seluruh dunia ada lebih dari tiga ribu lima ratus spesies nyamuk.","label":"nyamuk","summary":"Serangga berkaki panjang dengan sayap kecil;
      apabila betina dapat menyebar penyakit."}
  insect.moth:
    label: '"kupuk"'
    summary: '{"summary":"Rekan malam kupu-kupu; terbang menuju lampu dan memiliki antena bersisik"}'
    info: '{"info":"Kupang adalah kupuk malam dari urutan Lepidoptera yang berbeda dengan kupu-kupu siang karena saat istirahat mereka melipat sayapnya ke samping.\nBeberapa spesies tertarik pada cahaya buatan manusia.\nPupa ulat sutra menghasilkan bahan alami yaitu sutra.\nCecropia atau kupuk bulan merupakan salah satu jenis kupuk paling indah di dunia."}'
  insect.praying_mantis:
    label: belalang
    summary: Serangga predator dengan posisi tangan diibaratkan sedang bersujud atau melafalkan dzikir.
    info: Belalang ibadah adalah serangga pemangsanya dari kelompok mantodea yang mendapat namanya karena sikapnya dengan kedua kakinya depan disilangkan seperti dalam doa. Ia ahli berburu dan dapat menyerang serta menggenggam mangsa hanya dalam waktu pecahan detik.
  insect.robber_fly:
    label: leprosia
    summary: serangga perampas memakan serangganya sendiri dengan cara mengambil mangsatnya selama penerbangan mereka.
    info: '{"hint":"lalat pemangsa yang menangkap serangga di udara","info":"Leprosia adalah lalat dua sayap dari kelompok Asilidae yang berburu serangga lain langsung saat terbangnya masih aktif.","label":"leprosia","summary":"Serangga perampas memakan serangga lain secara langsung."}'
  insect.scorpion:
    label: skorpi
    summary: Arthropod berbisa dengan capit dan ekor lengkung menusuk.
    info: '{"hint":"scorpion beracis dan ekor menyengat melengkung","info":"Scorpions adalah artropoda yang memiliki ciri khas sisir belakang serta ekor bercabang dengan duri racun di ujungnya.","label":"škrábky","summary":"Hewan bertubruh segmen dengan sirip pectoral."}'
  insect.silverfish:
    label: kutu buku
    summary: Serangga tanpa sayap yang terlihat aktif diketemui dekat tempat penyimpanan dokumen atau barang-barangan bertulisan.
    info: '{"hint":"serangga tanpa sayap yang cepat bergerak (Lepisma saccharina), ditemukan di dalam rumah","info":"Kutu buku adalah serangga purba tak bersayap dari kelas Zygentoma hidup di lingkungan perumahan. Mereka memakan pati, kertas, lem buku dan benang tekstilnya sendiri. Namanya berasal dari warna keperakannya serta gerakkannya mirip ikan. Ini salah satu jenis tertua dari kelompok serangganya dengan bentuk fisik tidak banyak mengalami perubahan selama lebih kurang tiga ratus juta tahun lamanya."}'
  insect.spider:
    label: labah-labah
    summary: Arthropoda dengan delapan kaki ini menciptakan jala-jalanya sendiri.
    info: '{"hint":"arakhno delapan kaki yang memproduksi jaring","info":{"label":"labah-labah","summary":"Labah-labah memiliki delapan kaki dan membuat sarang untuk menangkap serangga atau melindungi telur mereka dalam kapsul berbulu. Lebih dari 48 ribu spesies labah-labah hidup di dunia; semua menghasilkan racun tetapi sebagian besar tidak membahayakan manusia."}}'
  insect.stag_beetle:
    label: kecoak tanduk
    summary: Seekor belatung besar dengan rahang seperti tanduk.
    info: Kecoa rusa adalah kecoa Eropa terbesar yang bisa mencapai panjang lebih dari 7 sentimeter. Jantan memiliki rahang besar berbentuk tanduk untuk bertanding memperebutkan betina. Larvenya hidup selama tujuh tahun di kayu oak busuk dan mengonsumsi jamur.
  insect.stick_insect:
    label: strawilka
    summary: Serangga imitator batang dan dedaunan secara sempurna.
    info: '{"hint":"insekta tersembunyi yang menyerupai ranting atau daun","info":{"label":"ulat semut","summary":"Insektusah mengimitasi cabang atau daun dengan sempurna.","detail":{}}}'
  insect.termite:
    label: rayap
    summary: Hewan serupa belalang dengan struktur tubuh kecil dan ramping serta sayap transparan atau bercak hitam pada bagian depannya.
    info: '{"hint":"serangga pemakan kayu sosial yang membangun gundukan besar","info":{"label":"rayap","summary":"Serangga sosial pembuat sarang tanah raksasa di daerah beriklim hangat."},"data":{}}'
  insect.tiger_beetle:
    label: carabida
    summary: belukang logam bernilai tinggi karena matanya yang hebat
    info: '{"hint":"kecebakan bercahaya cepat predator","info":"Carabida adalah belukang dari subfamili Carabinae yang terkenal dengan kecepatannya luar biasa dan kemampuan untuk melompat serta penglihatan akutnya.","label":"carabida","summary":"Belukang logam warnanya indah dengan mata sangat baik."}'
  insect.velvet_ant:
    label: vespa bulu sutra
    summary: Vespa coklat-oranye tanpa sayap yang terlihat seperti semut.
    info: Tawon berbulu velvet dari kelompok Mutillidae ini tidak memiliki sayap dan menyerupai semut.
  insect.wasp:
    label: lebah
    summary: Serangga penusuk warna cokelat-hitam membawa membuat sarang karton.
    info: Lebah biasa adalah serangga penusuk dari kelompok Vespa dengan peringatan hitam dan kuning khasnya yang membangun sarang berbentuk karton terbuat dari kayu yang dikunyah ulang.
  insect.water_strider:
    label: semut_air
    summary: Serangggaa yang bisa jalan-jalan di atas air karena ada tegangan permukaannnya.
    info: |-
      {"hint":"serangga yang berjalan di permukaan air menggunakan tegangan permukaan","info":"Semut air adalah seranggaa dari kelompok Gerridae mampu melangkah pada permukaan karena bulu hidrofoba pada kaki dan tegangan permukaan airnya.
      Mereka memburu serangga terbenam dengan mendeteksinya melalui getaran permukaannya.
      Ia cepat dan dapat menggeser dirinya sepanjang permukaan dengan kecepatan lebih dari 15 kali panjang tubuh perdetik."}
  insect.weevil:
    label: bekicot hidung
    summary: Serangga kecil bekicot dengan ciri-cirinya memiliki moncong memanjang.
    info: Bekicot hidung adalah belatung dari keluarga Curculionidae yang merupakan salah satu famili hewan terbesar di dunia dengan lebih dari 60 ribu spesiesnya. Ciri utamanya berupa moncong panjang atau rostrum digunakan untuk menggerogoti biji-bijian dan buah serta batang tanaman.
  insect.whirligig_beetle:
    label: vírník
    summary: Serangga kecil yang berkumpul dengan cara bergerak secara spiral diatas genangan air.
    info: |-
