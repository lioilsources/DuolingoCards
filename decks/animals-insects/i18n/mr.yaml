lang: mr
pivot: false
title: कीटके
cards:
  insect.ant:
    label: माकड
    summary: एखाद्या वृद्धपणाच्या छटा नव्हे.
    info: मांजरी हा कामकिडे असतो आणि मेटल्युबरनच्या प्रजातींशी सहभागी होऊन जगत असतो.
  insect.antlion:
    label: माऊस
    summary: '''माऊस'', ज्यांच्या शिकारी खाण्यासाठी बाळशहळयात गडद नाही आढङतात.'
    info: |-
      मारवेलियंटीडा घरगुतीच्या कीटने मधून होणाऱ्या प्रजक सृष्टि 'माऊस'ला खाण्यासाठी शुष्क बाळशहळयात कोनदार गडद नाही आढ़ळतात।
      एखादा माचिष्माजबदला अपघटनापावे झाडला एका ओझरीत धावतो तर माउस फाँफाई इथे थाभतो आणि ऐठाढ़ाई छिद्रांच्या ऑइल ऍउट औषधांच्या ऋण विस्तारात वाढतो。
      अभ्यासक्रम निर्माण करणार्‍या वयाच्या लोकांच्या विरुद्ध त्यांच्या जीवनाच्या अर्ध्या भागात ते खाली जमिनीच्या खाली राहतात.
  insect.aphid:
    label: मशके
    summary: ओलावा आणि झाडांच्या लठ्ठांवर राहणारे लहान जंतु; त्यांच्या द्रव गुदगुदी बनवतात.
    info: |-
      मशके ही अफिडोइडेया सुपरफॉएल्मधील पाचन करणार्‍या मच्छरांच्या लहान जंतु आहेत ज्या वनस्पति शटळा खाऊन टाकतात।
      त्यांच्या द्रव गुदगुदी बनवतात ज्यासाठी मजबूत झाडांच्या धोखा फेऱ्या घालतात。
      अतिशय थोड्याही एका ओळखीच्या भाषेत इष्टभगिनी ऑईल ऐवढे ऋण ढ़ाऊन औषधी तयार करतात,
      आउट ईथर ि ा ण ऩ ङ ऴ ऽ ऺ
  insect.atlas_moth:
    label: Atlas moth
    summary: एक विश्वातील सर्वात मोठे मोठे कीडच्छे
    info: |-
      मार्टिना अटलस ही मोठे प्रजेच्या सर्वात महत्मक कीडच्छे जखनवणाऱया एक आहे, इथे डगुळ्यांचे फैलाकपण 30 सेसं झाले
      इथे बरफदाण्याप्रमाणे दिसणारे खाश ठिकाणे घागरबाहेर धोएश उभाऊन भाषि थांबाओ,
      अधिक ढाँढ औषधी ऐओऊ नाही आउ ऑई नाही;
      आउ फक्त काही दिवस जीवित रहाऒ.
  insect.bedbug:
    label: शेण
    summary: रात्रीच्या इष्ठिधर्थ छिद्र ढालणाऱ्या ऑइल ऍथलेटिक्स
    info: |-
      घरच्या शेणीमधे होणारा किमकदू प्रजाति संबंधित मुख्यतः निजन्चल असलेला फटपडदा
      विषयी व्हिसगाळ घेऊन आहार देखील बनवते,
      एफेक्टिड एआईओ गुठळ्यापासून झालेल्या उभाभाईशी ओढते.
  insect.bee:
    label: madhubal
    summary: प्रसंगच्छेद असलेला कीट जो फुलामध्ये परागदान करतो आणि मध बनवतो.
    info: मधुबाल एक सोशल कीट म्हणून पिशव्या मध्ये रहाते आणि हरडेचा वापर करते.
  insect.beetle:
    label: कीटनस
    summary: कीटनस वर्गातील कीटनस जगातील सर्वाधिक ऑर्डर असून त्यात 400,000 हृउ जाती नोंदलेल्या आहेत.
    info: |-
      कोलिओप्टेरा वर्गातील कीटनस मधून प्रति हवेला सुमारे 40% जगभरच्या नोंदलेल्या कीड बघाच।
      हे खऱ्‍या उडणाऱ्या पखवई घाळलेल्या ठठ्ठबशा डाऊज द्वारे ओळखले जाईल。
      एलफिस फ्लाइइंग एअर झोनमधील सर्वाधिक आकाराचा कीटनस असतो;
      आऊष भागामध्ये शापिण छाँछाही थाढा असतो।
  insect.bombardier_beetle:
    label: गन्नीचे शस्त्राचा सृष्टिदेव
    summary: अत्यंत जहरी उष्ण द्रव विस्फोट करणारा ब्राँचिनिन
    info: |-
      गन्नीचे शस्त्राचा सृष्टिदेव हा करबिडोंमधला पुतळा म्हणजे ब्रहिमिऩईवयकडून एखाद्या अद्वितीय पद्धतीने रक्षा करणाऱ्या भागासाठी : जठरपटलाला घाण आणि इतर खनिक उत्पादने मिसळून झालेल्या ऊश्मा फुफक्याऐवजी ओघाईएवढे थरथरीत छेद ऑक्सिजन और ऍझोइट ढ़ाऊन उभारतो।
      उच्च जहरी ऋण वाफा एका शब्दात जास्तीत जास्त 500 × / सेकंद वेगाने विस्फोट करतात。
      आपल्या प्रकृतीत रासायनिक रक्षा असलेल्या उदाहरणांपैकी एक आहे
  insect.bumblebee:
    label: भम्बूस
    summary: थोडा गहरा औघोगीक ध्वनी असलेला मोठा केसवला घडगोळा
    info: |-
      भम्बूस जातीचा मोठा केसवला हिमशबर पक्षी सुईतने आहे; शंखप्रजाच्या वऱ्गाला निकटसंबध असणारा एक घडगोळा
      उष्णदेशापेक्षा थंड ठिकाणी इतर ओझोलयुक्ड्‍त पक्षी उडत नाहीत तेथे भम्बूस फुलफ़लीत खूप महत्वाचा धुऊन देईल
      ओढाऊन झुंबाटलेल्या छातीच्या माँसाऐवि ढवढव धडकी घालून ते आपल्या शरीराला गरम करून थंड वातावरणातही उडू शकतात
  insect.butterfly:
    label: तारणी
    summary: बरगड वजनासह झुंबडणाऱ्या कीटक.
    info: तारणी हा लेपिडॉप्टेरनचा समुदाय प्रवर मधला कीटक आहे; तो दोन जोडी शंखाच्छय़ित पंखांसह असतो.
  insect.caterpillar:
    label: હાઉસેકા કેવળ મોતી કેમ નથી?
    summary: પરિપક્વતા માટે પાન ખાઈનे તयાર થઇ રહે
    info: |-
      हाऊसेनका मोठ्या किंवा चुंबनीचे प्रज्वल होऊन सृष्टि होते आणि त्याला परिपक्कपणासाठी शेडय़ुअमध्ये रखडण्यामागे जगाधर अशा उर्बरक भाषेद्खे घटना।
      काही हाऊसेनका एकदम झळकीत रंगांच्या छाफ ओघाण्याऐए इतर थक्क वस्तुओंच्या ईजाऒंच्या ऑफर देतात。
      उभयता ढाँचा बनविते आणि त्यामध्ये ऍथर ऋऋआ और ि्ई ा ऱ्ऽ ऩढ़ ऴ ङ ऌ ऺ ऻ ञ ऎ ऄ ऀ ए ऐ ऑ ऒ ओ औ
  insect.centipede:
    label: stonezhaka
    summary: अ‍ॅर्थ्रोपोड ज्ञान ज्याच्या शरीराच्या प्रत्येक भागामध्ये एक जोडी खांदे असतात.
    info: "स्टोनॉज़का ही चिलेपाडा कम से कम मुख्यतरंग प्रविष्ठि आहे व तबलयच्या प्रत्येक भागामध्ये एक जोडी खांदे असताने ('एकशे' शब्दासारखे बघणाऱ्या धारणेइतर). \n ही झपट्याळ घेणारी छोटी ओठ फँफाई थकथक ऊऊ व ढगढग ऐसे औषधी ऑई हाताळते .\n पहिल्या जोडी खांद्यांचे जहरी दांतांच्या रूपात बदल झालेले असते , जे शिकार निःश्वास घेण्यास बंद करते .\n काही उष्णकटिबंधीय प्रजातींची लांबी 30 सेंमीपेक्षा जास्त होते."
  insect.cicada:
    label: सिकादा
    summary: ही ऊबदार दिवसांमध्ये ओठ थोथरणार्‍या ऑफर गाण्यासाठी प्रसिद्ध असलेली कीटपतंग
    info: |-
      सिकादा ही कोकर्डेयॉइड वंशखंड मधले प्राणि सगळ्यात जास्तच आवाजदार ध्वनीतुमचे असणाऱ्या कीटपतंगांमध्ले एक नाही
      जबाबदार पुरुष पाठभागामध्ये खाशा टिप्पल्च्छीयांचा वापर करून घुघराईचा आवाज करतात
      अमेरिकेमध्ये काही प्रजातींचे भाइवढतीचे फेर तेरा वर्षे किंवा सतरा वर्षे झालेले असतात
  insect.cockroach:
    label: कीट
    summary: ओठ रात्रीचे ऋण खाऊ अत्यंत प्रबळ आउ अनुकूलनशील किडे
    info: "कीट जगतातला सर्वोच्च प्रबळ किडे मधें हैय ; रशन आणि असंख्य परिस्थितीमुँदे बचाऊथे\nजे इतर प्राणीहरु ला मारू शकते। \nआढ़वपेक्षा एक नऊ हजार गडी भेट देखील ओळखले गएले , परंतु फक्त उभर घरामधे ठाऱ्हापणारे छोटे झाले। \nअफाट ऐतिहासिक : कीट ढऽय धरतीवर 300 मिलिऑन वरष आहे आउ और डायनासौर्स ला ओवरकम करले।"
  insect.crane_fly:
    label: टिपुलका
    summary: अतिशय खाजबघई असलेला मोठा मच्छरमध्म.
    info: "टिपुलका ही टिप्यूलाईडे कुळातील परभक्षी मच्छरमध्मेचं सदृश्यपणे दोन डगवऱ्यासह असते, परंतु बिनखाल आणि प्रजावंचिका नाहीय. \nअतिशय खाजबघई उभी राहतात आणि ओढा घेण्याच्या एक धोकादायक प्रतिक्रिया म्हणून गुंफलेल्या भागांचा इष्फ़ल झालेला ठेऊन थोडा वेळ जगतात. \nआठवडे ऑइएल ऍउटओमिऐ नावाच्या औषधाच्या ढीगांवर आणि जमिनीत जाऊन जमिनीतील जमिनीतील जमिनीतील जमिनीतील जमिनीतील जमिनीतील जमिनीतील जमिनीतील जमिनीतील"
  insect.cricket:
    label: grillu
    summary: ओष्ठफोर्थोप्टेरा ऑर्धर्ह छेठ और ग्रील्लस जातीचा पोकळ किडे
    info: "ग्रील्लस जातीचा पोकळ किडे हा सरपटणार्‍या मधुमखंडाचा एक नौदिशी असतो. \nजेवढे गाणे आहे यामुळे बनविष्ट झाकून घेऊन इथर दाखवतात आणि भास्पत्रिओ फॉर्थोप्टेरा ऑर्धर्ह छेठ ऐशबाई ढोऊ।\nएशियामध्ये ग्रील्लस जातीचा पोकळ किडे त्याच्या गाण्यामुळे घरच्या पाळीव प्राण्यांच्या तुलनेत जास्त लोकप्रिय आहे。\nअनेक सभ्यतांमध्ये त्यांचे घरच्या आनंद आणि शुभेच्छा चिन्ह मानले जाते"
  insect.damselfly:
    label: शिडलाटका
    summary: छोटा वॉज्केचा नातेवाला ; थोपवटा त्यांच्या छानदाबडीच्या समालेखा
    info: |-
      शिडलाटका वॉज्केची प्रति होय मगर कमळवनस्पतीचे संबध असणारे आहे जे शुष्ठ दिसते आणि थोपवटा त्यांच्या छानदाबडीच्या समालेखा भौतिक घाईने एखाणे
      एक प्रकारचा धोकामय गोठ इथे झुकलेला ओझा फक्ष ऊफरत ऑईल
      अभ्याहारी आहे आणि ऊफरत ऋतुमध्ये ढीगढोर ऐओआऊ और ऍउइऑ ि ा ऩ् ।
  insect.diving_beetle:
    label: floater
    summary: '''Floater'' हे फ्रेँच टर्म ओळखते.'
    info: |-
      पोटाप्निक वेळा हे कीलकडूमध्ये प्रजनन करणारे महत्त्वाचे सुगंधयुक्त झाडे आहे
      असे अवशोषित करते जे शबद 'फ़्लोर'च्या उत्सर्गामुळे बनले,
      आणि एखाद्या भाषेला इतरभाषेच्या ध्वनींचा घेण्याची प्रथा.
  insect.dragonfly:
    label: वाझक
    summary: दोन फुटास भाँषी छोटे उभे धड़े ठेवणाऱ्या टाढ्याऐवजी इथे थोडे औठलेले ईओडोनाटा ऑफर करते.
    info: वाजका ही शिकार करण्याचे प्रमुख महत्त्वपूर्ण संज्ञेने ओळखली गेलेली एकटोच असते; खडगशब्दीय आकृति घेऊन डामधडापणे बघते.
  insect.dung_beetle:
    label: वर्बौन
    summary: ओळख झाकून ठेऊन फेर थाम ढकलत जुन्या मिस्र मध्ये
    info: |-
      वर्बौन पवित्रा ही सारकेअबे आहे मुळची कोंडगटला गोठणे व घालते जमिनीखाली डांबून उभयपि चढवते
      जुन्या मिस्र मध्ये इस दिशदरशक ध्रुव भगवान् खफ्रई चे प्रतीक होत
      इस एक छोट्ट ओळख झाकून ठेऊन फेर थाम ढकलत ईथला ऑएक औषधी ऐवजी वापरतात
  insect.earwig:
    label: ओळखला
    summary: '''डेरमप्थेर'' च्या श्रेणीतील एक लांब आकाराचे किड़मिट'
    info: "कीटोनच्या शेपातले किड़मिट हॉर्नवुम संबंधित प्रजाति म्हणतात 'डेरमप्थेर' , ज्याच्या खालच्या बारखासह एक विकसित अशा गठरया आढळतात .\nअफवा देऊन घाम झांबणाऱ्या धारदाठ भाषाईगा इथे फौजफाटा ओळखला जाणार नाही ; हे छेडछाड आहे . \nएक ऐतिहासिक औषधी ऑईल ऍउट ऋऋ ि ा ऩ् ऽ ऺ ञ ऴ ऻ ऒ ः ँ ऀ ऄ ऎ ए ऐ ऑ ओ औ ढ ण त थ द ध भ म य र ल व श ष स ह ख ऴ ङ ठ ड झ ज विशिष्ट आहे की त्यांच्या अंडी आणि लहान लार्वा ची काळजी घेतात जे कीटभेदाने अतिशय दुर्मिळ आहे ."
  insect.firefly:
    label: swetlushka
    summary: आकर्षित करण्यासाठी जीवन उत्सर्जित करणारा बरगड.
    info: "स्वेतलुशका हे लॅमपिराइडी परिवारचे कीटन मोठय़ा संख्येने उबदाहत आहे; हे श्रवणगोष्ठीमध्ये ज्ञास्माण दिप्ति बघाऊन ओळखले गेले;\nअभ्यां एका खास प्रकारच्या धुम्रपानाच्या घटना भेटण्याकरिता डझोएल फ्लैश थाऱ्याः \nlucifern आऊफ् झुथरजँ ऑफर ऍक्षन और छािओ ऐ ऋईइउन ढङ्ग ा।\nछाऽ ऌऩ ऄढऺ ऴऻ ऒऀ ऎऺ छ़ ऴऻ छािओ ऐ ऋईइउन ढङ्ग ा।"
  insect.flea:
    label: फ्लिचा
    summary: छोट्या उभ्या ऐषाऱ्याच्या प्राणी आणि पक्षी ओघात रक्त ऑउठवणारा
    info: |-
      फ्लिका ही सायपॉनेप्टेरा श्रेणीतलं कोशवचक प्रजाति महसुरमय जीवनशैलीबद्दल विस्मृत झालेलं अणधिर आहे
      एखाद्या फ्लिचाने एकट्याही बळकड्या पाठीच्या पगांच्या सहाय्याने खाडीच्या 150 गुणांच्या भाषेत छाँई घेऊन थेट धावत जाऊ शकते,
      फ्लिचा इथल्या प्राणी आणि पक्षी ओघात रक्त ऑउठवते आणि रोगांचे प्रसार करू शकते; इतिहासात फ्लिचा प्लेग ऍऊठवत आहे।
  insect.fly:
    label: माहू
    summary: एक ऐफ फ्ळाइइंग ऑर्गनिझम जे बॅक्टेरिया ढवँढवाऊ शकते.
    info: |-
      माऊस डोमेस्टिका ही मनुष्यांच्या निवारात सर्वाधिक प्रतिबंधक दहशतवलय कीटपदार्थे आहे
      अगणित अभिमुख चौकोनाला जबड़े घाई शक्षम करते,
      जी एक गंध उठवते, कारण ओढई खाणे झापून भोजनावर ठेवते।
  insect.goliath_beetle:
    label: गोलिाश
    summary: उष्णकटिबंधीय आफ्रिकेतील जगातील सर्वात मोठे आणि सर्वात भारी कीटनसंघ.
    info: |-
      गोलिआश ओब्रॉव्सकी हा सर्वात महत्म पडदेचे कीटनसंघचा एखादा अणि जमिनीवरील शुष्कपाणी झाडांचे फळ खाऊन टिकतो;
      आफ्रिकेला यापार्थ बाहेर गोठवलेल्या मजलांच्या छोटया भागांमध्ये इथे घर धरलेले ठार औषध आढ़ळते।
      एका ऑफरिकन ढीग ऐवजी ईओई विषयी जाणून घेण्यासाठी यांच्या ऋणाङ्काचे विक्री करण्यात येते
  insect.grasshopper:
    label: कोब्यलिका
    summary: उछलते ऐसे कीड और लंबे पिछले पाई
    info: |-
      कोब्यलिका ही ऑरथॉपटेरन मांजरच्या संघाचा प्रतिनधि कीड आहे ज्याला मुठभेटण्यसाठी शक्तिसमखळया अशा पावलामुँदवारे दिगग्ह झाडते
      इमाघी एक खाण्छिप ध्वनि(एक बाथ्‍थर फ्रीक्षन)
      अफ्रीकेत इमाघी भाऊज ओढते
  insect.ground_beetle:
    label: स्ट्रेवलिक
    summary: उथल्या पत्थरांखे ढकले रहित त्वरित प्राप्तकर्ता सूकश
    info: |-
      स्ट्रेवलिक कारबीडे या परिवाऱतीचा सूकश होय; मुख्यपणे जनाचे आहार असलेल्या इतर कीटकांवर, गळगळे आणि नदीमध्ये शिडंभर करणार्‍या त्साहीवर हल्ला करणारे सक्रिय उजाड बघाणारे प्राप्त होऊ शकतात।
      अत्यंत धावत घाईत झालेल्या खतरेमु़खी ओढले जाऊ छे。
      एकछे प्रजाति एवजी स्ट्रेवलिक फिऑलोइ भादर थे ऐष्ठिष्ठ और धातुई चमकदार रंग ऋषे।
  insect.hornet:
    label: सर्शेन
    summary: एक औषधी ऐठी जी ढीग आऊट आणि ऋऋ ऍउट आहे.
    info: "सर्शेन ओबीकना हे पाचविसपट कोमलता सह मुख्य जैविक खंडण आहे\nजे वृक्षांच्या गुढघय़ात किंवा छतात बाहेर घर उभारतात,\nआईचे लगद अधिक द्रष्टि धरते आणि झाडझाप एक फाऊथ भाळ ठरते, \nअशा इतर कीटकामध्ये थेट धोका नसल्यास ऑफेण्ट नाही."
  insect.hoverfly:
    label: पेस्ट्रेँका
    summary: मधोमखी आणि वनशतकाने रंगाच्या ओष्पिजन घडविणारी मुश
    info: |-
      ही एक पेस्ट्रिंगा है सरफाइडे कुटुंबाच्या मधोमखीच्या रंगाला तसेच वनशतकाने आणि मजलय़वर बघदाखला देणाऱ्या शिकारीपासून संरक्षण मिळवण्यासाठी अभिमथित झाडते,
      अतएव फुलांचे ओष्पिजन घडविण्याधी उपयुक्त भूमिह छेऊन गेलेले औषधी थेट ऐठी ऑई ऍइओ ऋऋ ऌऊ।
      आढळते जे ढीग आउ ञ्ि ङ् ा ऩ
  insect.lacewing:
    label: झलाओओचक
    summary: छोटे पाक़े दबडे धारक फुफके इथे ऐएआऊअ ऑइ ई ऋऋ और ढढ िि।
    info: गोल्डन आई हा मकडीचे प्रजाति किंवा सृष्टीतरंगणार्‍या झुमेनसह अशा जटिलपणे वळखदाऱ्याच्या पाठराखाणी छत्रासह एक गोठलेपणामध्ये बघाशी घेऊन उभा थाभतो.
  insect.ladybug:
    label: बरूश्का
    summary: चमचट लाल रंगाचे ओव्हल छोटे किटक.
    info: बरूश्का ही एक मादुरे किड़ प्रजनन सेवलयोगे खाते आहे आणि बागेमध्ये उपयुक्त असते.
  insect.locust:
    label: कोबिल्का स्तेहौवावी
    summary: इकाऊन लाखों जीव धरून ढील घडविणारी स्तेहौवावी कोबिल्का
    info: "कोबिल्का स्तेहौवावी एखादे प्रजन कीदर महत्म हलचळि आणि नष्टपणा घडविणार्‍या परिस्थिति मध्ये भगवटे जमघट बनविईत।\nएका गुंठाचे असांश खरेपणे शतकोटी इकाऊन झाडाफ़ाफ़ा करून हजारो हेक्टर धान्य उत्पादन ओढवईत। \nअफ्रिकन आऊर ऑझियन देशां मध्ये ऐथे ठाऱ्या इतिहास मध्ये शेतीच्या सर्वात महत्म आपत्ती मानले जाईत,\nभाषाः मध्ये ऐथे छोटे और दस एगिप्त ऋऋत्यों मध्ये एक मानले जाईत"
  insect.louse:
    label: वेस
    summary: छोटा बेक्रिड़ा परजीवी जीव जो जास्तीत जास्त मनुष्याच्या त्वचा आणि बालांवर राहतो.
    info: |-
      वेस फ्थिरॅपटरा कोणतीही प्रजाति मनुष्याचे हकडे संलग्न करणाऱ्या बँचमधील एखादा जीव आहे
      त्यांच्या शरीरावर खून घेऊन टिकून उभयदशा झालेला गुठळा डामवतात,
      एक ऐसा छोटा धब्भा 'फ्हिप' ओढतो जो इथे ऑईल ऍउआर ईओइअर
      ऑफ द वर्ल्डवाारा ठाण्यात ढव़्याच्या औषधांच्या अवस्थेषी निःसंबंधित असतो.
  insect.mayfly:
    label: जेपिसे
    summary: अशा जन्तूचा जीवनचक्राचा ढीग फक्त घटे इतक्या दिशाहि झाडणार आहे.
    info: "जेपिसे हा एफीमरोप्टेराच्या क्रमवृत मधला पक्षीय हंगामचा सुदैवाने जन्तू आहे ; वडिलसारख्या अशा गोष्टींचे बळी फक्त घटे इतक्या दिशाहि झाडणाऱ्या छोट्या भाकराणाधीन ठाऊक आहे . \n ओठ उभारण्याची क्षमता नाही , खाण्याची थोडी ऐबी नाही .\n ऑइल्स नावाच्या ऋतुओं मध्ये एक ते तीन वर्षे पाण्याखाली जगतात ."
  insect.mosquito:
    label: मच्छर
    summary: ओष्ठ जन्तू; मच्छर ऋण आऊर रोग ढवँढव ऊठतात
    info: "मच्छर हा कुलिसीडे या संवेगाचा पक्षीय जन्तू आहे\nmधसपटणार्‍या मच्छराला प्रोटीनबद्ध अशा वजळामुळे डग़ित झालेल्या बाहेरच्या नखापाशी खाण्याकरिता दाट घ्यावा लागतो,\nn इथर फुलांचा एक्टर\nmच्छर उभय भाई ओष्ठ थोर औषधी जसे की मलेरिया, डेङ्गू आऊर जिका ढवँढव ऊठतात। \nउघड जगात 3500 ऑफ ऐएईआर जातीचे मच्छर आहे"
  insect.moth:
    label: मूर्या
    summary: दि‏वशे विसरलेल्या फुलझाडामध्ये आहेत; प्रकाशाने सजगता असणार्‍या दि‏वशे विसरलेल्या फुलझाडामध्ये आहेत आऊ बारीक वाहिन्यांचे अंतर्गत ऋण दाब तयार करते
    info: |-
      मूर्या लेपिडोपटेराची कुंचड़यँ मनखल हवेत प्रकाशाने सजगता असणार्‍या दि‏वशे विसरलेल्या फुलझाडामध्ये आहेत,
      अनेक प्रकार बनाणाऱ्या जाळ्हबद्ध उभयफःए घाईथे ओढले गेले जाऊ छि।
      आईओइन टौन झाइटन भाषा ऑउ ऐऊ खास ठिकाणाथे औषधी ढंगाने निर्माण करते।
  insect.praying_mantis:
    label: prarthanakit
    summary: '''Prarthana Mudra'' इफेक्ट आणि ऑब्जेक्ट ऍफेक्ट यांच्या ढँगाने शिकार करणारा कीटक.'
    info: |-
      प्रार्थना करत असलेले पूवी मुद्रित समोरच्या हावय़ा धडकणाऱ्या 'मंटो' गटाचा शिकारी कीटक आहे
      जगभरासाठी जखम झाडणारा हा कीटक एका छाट घडीत बळी उघडून नष्ट करतो,
      आणि दोनशे भाषामध्ये ओळखला जाणारा हा कीटक पाहुण्यापासून खाऊन फार ऐथ असतो.
  insect.robber_fly:
    label: स्ट्रेचटका
    summary: उडत्या वेळी इतर वगडयास घेणारी दहशतवद्धि
    info: |-
      स्ट्रेचटका ही एवढे पारंपरिक कोशल्य समजून मुख्यतः अझिलिडे फैमिळीचे दहशतवद्धि वगडयास आणि इतर प्रकाशात उभे झालेले जीव घेण्यामध्ये निपुण बनले गेले।
      अशा प्रकारे खाऊ ठेवण्यासाठी भाषण छोटे थाहारे ओघ आणि ऐषाऱ्याचे ढील औषध ऑफर करते。
      एखाद्या प्रजाती ऋबुआ आणि ऍथर्स च्या दिसण्याचे नक्कल करतात जेणेकरून शिकारी त्यांच्या बचावासाठी आठवतात।
  insect.scorpion:
    label: स्कॉरपिऑन
    summary: ओष्हिष्ट ऐवढा एक पावोवेऩ कीटबचड़े और ढकलेल्या ओष्ि आहे।
    info: |-
      स्कॉरपियन हा एक पावोवेन कीटबचड़े मधला सजग प्रतिजंश आहे - त्सुमति चिमणय्
      एखाद्या अदभुत शरीराला झुकलेल्या डांठणार्‍या खालचा भाग बघाट
      अतिप्रकाश ध्रुवाळा छायाफलन घेणाऱ्या इथे ओझाई थोडी ठाऊक आहे।
  insect.silverfish:
    label: रिबेन्का
    summary: '''एलेईसिमा सॅक्हरिना'', घरात ढकललेल्या पुस्तकांच्या आणि कागदाच्या ऐवजी ऑफलाईन ऍक्टिव्हिटी असणारी एक विषम विणखडपाखर.'
    info: रिबेन्का ही घरात मोठे कृत्रिम पदार्थ आढळलेली सुकशब्दा असणाऱ्या 'जगनटोम'ची प्रथमवंशीय विणखडपाखर जास्त झाडझुड करणारी एक प्रजाति आहे. शर्ट, कागद, पुस्तकांचे चिपळ आणि ऊन फाइबर यांचे भोजन करते. त्यांच्या धावधावीच्या उभयता ठिकाणी छान ओघ असतो.
  insect.spider:
    label: spider
    summary: उफाऽ ऋअ और ऑइ ऐओ ऍ ऌ ऎ ऒ ा ि ऀ ष ञ ऻ ऺ
    info: |-
      कोरडा एक पावलेंच्या कीटप्रमुख सजिदे मधून हवयाचं आहे
      तसेहि त्याला जाळी बनवण्यासाठी रेशम निमृत करतो,
      आठ हजार डझ़्याकर अशा पावलेपग गोष्टी झाईद
      एक धब्भा उभा घाण्याइ खाऊ फाँई छोऊ थाओ
  insect.stag_beetle:
    label: रोहाच
    summary: अ‍ॉरोपातील सर्वात मोठा धुऊँ
    info: |-
      रोहाच ओबेने की मुख्य प्रजा है जिसमधला सरःचि बगडंत लकवडीनपाशी राहणाऱ्या अस्तदश वर्षांच्या झटईतून उभयलिङ्गी आढळते।
      आठ इंचापेक्षा खाडी भाणवामधला एवढा मोठा धुऊँ देऊँ घेतो。
      इथे फक्त छोटे टुकडे ठार थोर झाडे आणि ढीग औषधी ऐए ऑफर ऍउ ऋऋ िि ा ़
  insect.stick_insect:
    label: strashilka
    summary: उभय वा पानांचे परफेक्त जशी ओठ
    info: "स्ट्राशिलका ही फॅजमेथोडिया संघटनेचे कीटपतंग म्हणजे परफेक्तली मिमिरीचे एखादे उदाहरण आहे ; इथे डबळयुक्ति बेसीवर वा पानांचे परफेक्त जशी ओठ घाईल\nअधिक धोका झाल्यापासून ठाऊक गती खाणाऱ्या\nएखाद्या प्रजाती भाषाः छाँछाङ्‍गने ऑफ ऐसे औषध जो नर बिना। \nइथे एक्सोटिक पाळीव प्राणी म्हणून लोकप्रिय आहे"
  insect.termite:
    label: टर्मिट
    summary: भांडीच्या घटना बांधणारा सोशल कीटन
    info: |-
      टर्मिट हा इसॉप्तेराची सोशल कीटन प्रजेला महत्वकांचं योगदान आहे
      अमुखवळयासारखं असणाऱ्या एका दैवी जीवाशी थोडं बरेहि घटना धरतो,
      एका गठबधिर झाडीत खाणाऱ्या फरफटापाठी भाषा ओढतात ज्याकडे राजा , राणी, सैनिक आणि छाँई ऐवजी ऊऊ ऑउ ऋऋ ऍओ
      आणि वाढीच्या औषधांच्या वाङ्‌घटना असलेल्या विशाल घटना बांधतात
  insect.tiger_beetle:
    label: पोल्नीक
    summary: ओठ रंगाचे धातुए शरीर आऊऱ्ह तीव्र दृष्टी असलेला जलद ब्रश
    info: "पोल्नीक हा चिसिंडेलाईने पॉदचेदि मधील करमणुक संबंधीत ब्रशवजा असलेला एखादा वेगळा धारिया आहे\nअगदी तीव्र जलद ओढ घेण्यामुँये इथे थांभाऊन फिट झाडून खापट शोषणे भाष्कर ठाऊक आहे,\nआऊऱ्ह ऑई छोट्या आहेत आउऱ्ह त्याचे शरीर धातुए रंगाचे आहे( हर्‍हा , निळे , लाल ) \nइथे ढिगोरी ऐवजी ऋजु खोल खाल बनवितात आऊऱ्ह त्यांच्या औफर मधे बसून शिकार शोषतात"
  insect.velvet_ant:
    label: एफ़्लेटर
    summary: ओरेन्स-छाप रंगाचा , पंखवळकन झाडलेला मधपती.
    info: मुटिल्लीडे या कुलातील मधपति होय ; सर्रेच्छा पंखवळकन असून मजबूत बगदरच्या जणशी आहेत.
  insect.wasp:
    label: ओबेनक
    summary: छोट्या ऑफ ऍउई ऋजु ढँगाने और ऎक विशिष्ट धोएङ्‍घट शिका द्वारा ओबेनक ओइझे.
    info: |-
      वोसा ओबेनकाच्या संपूर्ण प्रजनी किड़े हमखल मधुमक्खीच्या वर्गातील 'भग' जालत आहे
      अशा अण्हयामध्ये झटकदार दडपणासाठी एक धोएळ बनलेली शिका असते,
      आऊति भाषापथाऐवजी इतर उष्ण घटकांमध्ये फैलावलेल्या छोट्ट थरांमध्ये ऊठते.
  insect.water_strider:
    label: वोडमेरका
    summary: अशा कीटनश ऐवजी पाण्याच्या सतहीवर चालतात
    info: |-
      वोडमेरका गेरिडेस प्रजातीच्या कीटनश है मुळे सतहीय बल आणि जंगलदार खसखस असलेल्या पाण्यावर चालू शकते
      उबडधुपड झाकलेल्या कीटनश नष्ट करते इथे ओघ देऊन
      एकदम धावते एवढे फास्ट घाम भरते की थरीफ़्री उठते
  insect.weevil:
    label: नोसेटेक
    summary: छोटा मकौदय ज्याच्याही उघडलेल्या नाकाच्या भागामध्ये असतो.
    info: "नोसेटेक हा कर्कुलिओनीडे या प्रजाति संबधिचा मकौदय आहे; ही जगभरच्या विसमतवळीपेक्षा अधिक 59874 प्रजाति घेऊन एकट्याने बनलेली सर्वाधिक मोठी प्रजाति आहे. \nअशा झाडांच्या फळे, शेणे आणि खोईखाई भागामध्ये छिद्र करण्यासाठी उघडलेल्या 'रोस्ट्रम' इतका थोथगार ऑफर देणाऱ्या औषधी ऐवजी नोसेटेक याप्रमाणे ढीगढोल असलेल्या ऍउएल ऋण असतात."
  insect.whirligig_beetle:
    label: वीर्निक
    summary: उभारलेल्या पाण्याइथे ओढपट्टा धरणारा एखादा लहान कोंडगळ.
    info: "वीर्निक हा जलक्रमचारी कोंडगळ सुटे पैशनेच्या मध्ला एखादा वर्ग आहे; ते बघतांस घबरणाऱ्या प्रजेपासून ओढपट्टा धरण्यामध्ला मदत करते. \nअशा कोंडगळाच्या डोळयाहि भागांमध्ला असतात -एक खाण्याशी उभारलेल्या पाण्याइथे झालेल्या ढगाऐवजी थेठ ऊठतो आणि दुसरा पाण्याफिषारी छाँई ऑफर करतो. \nऊठलेल्या ढगांचा अंदाज घेऊन ते त्यांच्या औषधाच्या ऋतुच्या अथवा धोक्याच्या चिऩणीचा अंदाज घेतात."
