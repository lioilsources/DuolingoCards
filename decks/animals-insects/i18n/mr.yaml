lang: mr
pivot: false
title: कीटक
cards:
  insect.ant:
    label: माहू
    summary: कॉलनीमध्ये राहणारा सोशल किडनेट प्राणी.
    info: माहु हा मोठ्या गटात जगत असलेला किडनेटचा प्राणी आहे ज्यामध्ये कामाचे वर्गीकरण असते.
  insect.bee:
    label: मधबिन
    summary: हा पांढर-काळच असलेला कीटन हप्ते व मध बनवतो.
    info: मधबिन हा सोशल कीटन आहे जो शेडरूममध्ये राहतो आणि गुठळ्याचा एक्टर भेटतो. हा पुष्पांचे परागण करतो आणि मध तयार करतो.
  insect.butterfly:
    label: मोथ्यल
    summary: रंगीत पांख असणारा उडविणारा कीटक.
    info: मोथ्यल हे सहा जोडी शुपनाच्या पाख्यासह लेपिडॉप्टेरा मधील एक विमान आहे.
  insect.dragonfly:
    label: वाजका
    summary: दीर्घ शरीर आणि प्रतिस्पर्शी कडे असलेल्या मोठय़ा झुडूपाचा संगोपन हमीचा वर्ग.
    info: वाजका हा एक दीर्घशरीरीय धोकादायक हमीचा वर्ग आहे ज्याने उत्कृष्ट दृष्टी असते आणि त्यामुळे पाण्याच्या भागात बरखडत राहते.
  insect.ladybug:
    label: बेरूश्का
    summary: लहान गोल लाल किडीत सुटके म्हणजे बेरूश्का.
    info: बेरूश्का ही एक प्रकारची छोटी किडी आहे जी मेढय़ांवर खाते असून उभयपादाच्या शेतीमध्ये उपयुक्त ठरते.
