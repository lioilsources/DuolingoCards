lang: en
pivot: true
title: Insects
cards:
  insect.butterfly:
    label: butterfly
    summary: A flying insect with large colorful wings.
    info: The butterfly is an insect with two pairs of scaly wings, often strikingly colored.
  insect.bee:
    label: bee
    summary: A yellow-black insect that pollinates flowers and makes honey.
    info: The honeybee is a social insect living in hives and gathering nectar.
  insect.ladybug:
    label: ladybug
    summary: A small round red beetle with black spots.
    info: The ladybug is a tiny beetle that feeds on aphids and is useful in the garden.
  insect.dragonfly:
    label: dragonfly
    summary: An insect with a long body and two pairs of transparent wings.
    info: The dragonfly is a predatory insect with excellent eyesight that hunts near bodies of water.
  insect.ant:
    label: ant
    summary: A small social insect living in colonies.
    info: The ant is an insect that forms large colonies with a division of labor.
  insect.beetle:
    label: beetle
    summary: Beetles form the largest order of insects, with over 400,000 described species.
    info: |
      The beetle belongs to the order Coleoptera and makes up about 40% of all described insect species.
      It is characterized by hard wing cases (elytra) beneath which the true flight wings are hidden.
      The stag beetle is the largest European beetle; the male has massive antler-like mandibles.
      They live in almost all environments, from the tropics to the Arctic.
  insect.grasshopper:
    label: grasshopper
    summary: A jumping insect with long hind legs and a chirping call.
    info: |
      The grasshopper is an insect of the order Orthoptera with powerful hind legs allowing jumps up to twenty times its body length.
      Males produce a characteristic sound (stridulation) by rubbing their legs against their wings.
      It feeds on plants and in large swarms can damage crops.
  insect.cricket:
    label: cricket
    summary: A nocturnal insect famous for the chirping stridulation of males.
    info: |
      The field cricket is a nocturnal insect of the order Orthoptera.
      Males chirp by rubbing their wings together to attract females and mark territory.
      In Asia, crickets are traditionally kept as pets for their song.
      They are also a symbol of domestic comfort and luck in many cultures.
  insect.mosquito:
    label: mosquito
    summary: A two-winged insect; the female sucks blood and can spread diseases.
    info: |
      The mosquito is a two-winged insect of the family Culicidae.
      Females suck the blood of animals to obtain protein for developing eggs; males feed on nectar.
      Mosquitoes transmit dangerous diseases such as malaria, dengue, and Zika.
      There are over 3,500 species of mosquito in the world.
  insect.fly:
    label: fly
    summary: A common two-winged insect capable of carrying bacteria.
    info: |
      The housefly is the most common two-winged insect in human dwellings.
      Its compound eyes let it see almost 360 degrees around itself.
      It carries bacteria because it lands on both waste and food.
      It has only one pair of functional wings; the second pair (halteres) helps it keep balance in flight.
  insect.moth:
    label: moth
    summary: A nocturnal relative of the butterfly; flies toward light and has feathery antennae.
    info: |
      Moths are nocturnal lepidopterans that, unlike day butterflies, hold their wings folded to the sides at rest.
      Many species are attracted to artificial light.
      We owe natural silk to the caterpillars of the silkworm moth.
      The luna moth is one of the most beautiful moths in the world.
  insect.caterpillar:
    label: caterpillar
    summary: The larva of a butterfly or moth; eats leaves and prepares to pupate.
    info: |
      The caterpillar is the larva of a butterfly or moth and spends its life mainly eating leaves to store energy for its transformation.
      Some caterpillars have bright colors warning predators of their toxicity.
      When pupating it forms a chrysalis, in which the complete transformation (metamorphosis) into an adult takes place.
  insect.praying_mantis:
    label: praying mantis
    summary: A predatory insect with a praying posture and lightning-fast strike.
    info: |
      The praying mantis is a predatory insect of the group Mantodea.
      It got its name from the posture in which it holds its front legs folded as if in prayer.
      It is a master hunter; it strikes and seizes prey in a fraction of a second.
      The female sometimes eats the male after mating, though this does not always happen.
  insect.stick_insect:
    label: stick insect
    summary: An insect that perfectly imitates a twig or leaf.
    info: |
      The stick insect belongs to the group Phasmatodea and is a master of mimicry; its body perfectly imitates twigs or leaves.
      When threatened it stays completely motionless.
      Some species reproduce by parthenogenesis, that is, without a male.
      They are popular exotic pets thanks to their easy care.
  insect.firefly:
    label: firefly
    summary: A beetle that produces bioluminescent light to attract a mate.
    info: |
      The firefly is a beetle of the family Lampyridae able to produce cold light (bioluminescence) in its abdomen.
      Males and females glow in different patterns to recognize and attract each other.
      It is governed by the chemical reaction of luciferin with luciferase.
      Fireflies are an indicator of a clean environment.
  insect.wasp:
    label: wasp
    summary: A yellow and black stinging insect that builds paper nests.
    info: |
      The common wasp is a stinging insect of the group Vespula with a typical yellow-black warning coloration.
      It builds paper nests from chewed wood pulp.
      Unlike the bee, the wasp can sting many times.
      It is useful as a natural regulator of insect pests.
  insect.cockroach:
    label: cockroach
    summary: A fast, nocturnal, omnivorous insect; very tough and adaptable.
    info: |
      The cockroach is one of the toughest insects in the world; it survives radiation and conditions that would kill other animals.
      There are over 4,500 species, but only about 30 live near humans.
      It is an ancient insect; cockroaches have existed for over 300 million years and survived the dinosaurs.
      It is fast and can run at over 5 km/h.
  insect.spider:
    label: spider
    summary: An eight-legged arachnid that builds webs to catch insects.
    info: |
      The spider is an arachnid (not an insect) of the order Araneae with eight legs and a two-part body.
      It can produce silk, from which it weaves webs for hunting or to wrap egg cocoons.
      There are over 48,000 species of spider in the world.
      All species produce venom, but the vast majority are harmless to humans.
  insect.scorpion:
    label: scorpion
    summary: A venomous arachnid with pincers and a curved venomous tail.
    info: |
      The scorpion is an arachnid (not an insect) with typical pincers and a curved tail ending in a venomous stinger.
      It is an ancient animal; the oldest fossil scorpions are over 430 million years old.
      In the dark they fluoresce under UV light.
      Of about 2,500 species, only about 25 are dangerous to humans.
  insect.centipede:
    label: centipede
    summary: A myriapod with one pair of legs on each body segment.
    info: |
      The centipede belongs to the class Chilopoda and has one pair of legs on each body segment (not 100 legs, as the name suggests).
      It is a fast predator that hunts insects, worms, and small vertebrates.
      The first pair of legs is modified into venom claws to paralyze prey.
      Some tropical species grow over 30 cm long.
  insect.flea:
    label: flea
    summary: A tiny jumping parasite that sucks the blood of mammals and birds.
    info: |
      The flea is a wingless insect of the order Siphonaptera specialized in a parasitic way of life.
      Its strong hind legs allow jumps over 150 times its body length.
      It sucks the blood of mammals and birds and can spread diseases; historically fleas spread the plague.
      Fleas are outstanding acrobats of the insect world.
  insect.termite:
    label: termite
    summary: A social insect that builds huge mounds of earth.
    info: |
      The termite is a social insect of the group Isoptera, distantly related to cockroaches.
      They live in colonies with a king, a queen, soldiers, and workers.
      They build complex mounds, up to 9 meters tall in the tropics, with a ventilation system.
      As primary decomposers of wood, they play a key role in tropical ecosystems.
  insect.bumblebee:
    label: bumblebee
    summary: A large furry bee with a deep buzz; an important pollinator.
    info: |
      The bumblebee is a large furry insect of the genus Bombus, related to the honeybee.
      It is an important pollinator, especially in colder climates where bees fly less.
      It can warm itself by shivering its flight muscles, so it flies even in cold weather.
      Bumblebees are gentler than bees and sting only when directly threatened.
  insect.hornet:
    label: hornet
    summary: The largest European wasp with a powerful sting and loud buzz.
    info: |
      The hornet is the largest European social wasp, growing over 3.5 cm long.
      It builds paper nests in tree hollows or under roofs.
      Its sting is longer than a wasp's and the sting is more painful, but the hornet attacks only when directly threatened.
      It is an important predator of other insects.
  insect.cicada:
    label: cicada
    summary: An insect famous for its loud stridulating song on hot days.
    info: |
      The cicada is an insect of the superfamily Cicadoidea famous for one of the loudest sounds of all insects.
      Males produce the sound with special membranes (tymbals) in the abdomen to attract females.
      Some species in the USA have seventeen-year or thirteen-year development cycles.
      The nymphs live for years underground, feeding on roots.
  insect.locust:
    label: migratory locust
    summary: A migratory grasshopper that forms devastating swarms of millions.
    info: |
      The migratory locust is a species of grasshopper that, under certain conditions, forms giant migrating swarms.
      A swarm can number billions of individuals and destroy entire crops over thousands of hectares in a day.
      In African and Asian countries, locusts are historically one of the greatest agricultural disasters.
      In the Bible they are one of the ten plagues of Egypt.
  insect.aphid:
    label: aphid
    summary: A tiny sucking insect on plant stems; produces honeydew.
    info: |
      Aphids are small sucking insects of the superfamily Aphidoidea that feed on plant sap.
      They produce sweet honeydew, which ants tend in exchange for protection.
      They reproduce extremely quickly; a single female can give rise to hundreds of millions of descendants in a year.
      They are important pests of agricultural crops.
  insect.earwig:
    label: earwig
    summary: An elongated insect with pincers at the end of its abdomen.
    info: |
      The earwig is an insect of the order Dermaptera characterized by pincers (cerci) at the end of the abdomen, used for defense and mating.
      The name comes from the superstition that it crawls into people's ears; that is a myth.
      Female earwigs are exceptional in that they care for the eggs and young larvae, which is rare among insects.
      They live in cracks, under stones, and in leaf litter.
  insect.silverfish:
    label: silverfish
    summary: A wingless, fast insect found in homes near books and paper.
    info: |
      The silverfish is a primitive wingless insect of the order Zygentoma living in homes.
      It feeds on starch, paper, bookbinding glue, and textile fibers.
      Its name comes from its silvery color and fish-like movement.
      It is one of the oldest insect orders, living almost unchanged for over 300 million years.
  insect.water_strider:
    label: water strider
    summary: An insect that walks on the water's surface thanks to surface tension.
    info: |
      The water strider is an insect of the family Gerridae able to walk on water thanks to the hydrophobic hairs on its legs and the surface tension of the water.
      It hunts insects that have fallen into the water, which it detects by vibrations of the surface.
      It is fast and can glide across the water at over 150 times its body length per second.
  insect.dung_beetle:
    label: dung beetle
    summary: A beetle that rolls balls of dung, sacred in ancient Egypt.
    info: |
      The sacred dung beetle is a beetle of the family Scarabaeidae that shapes dung into balls and rolls them to bury them and lay eggs.
      In ancient Egypt it was a symbol of the sun and the god Khepri.
      It is one of the few animals that navigate by the Milky Way.
      It helps recycle nutrients and aerate the soil.
  insect.stag_beetle:
    label: stag beetle
    summary: The largest European beetle; the male has antler-like mandibles.
    info: |
      The stag beetle is the largest European beetle, growing over 7 cm long.
      The male has huge antler-like mandibles used for duels over females.
      The larva lives up to 7 years in the rotting wood of oaks and feeds on fungi.
      It is critically endangered by the disappearance of old forests and dead wood.
  insect.atlas_moth:
    label: atlas moth
    summary: One of the largest moths in the world, with wings adorned with snake-like patterns.
    info: |
      The atlas moth is one of the largest moths in the world, with a wingspan of up to 30 cm.
      The tips of its wings are colored to resemble snake heads, which scares off predators.
      Adults have no mouth and do not feed at all; they survive only a few days as adults.
      It comes from the tropical forests of Southeast Asia.
  insect.weevil:
    label: weevil
    summary: A small beetle with a characteristic elongated snout.
    info: |
      The weevil is a beetle of the family Curculionidae, the largest family of animals in the world with over 60,000 species.
      Its characteristic elongated snout (rostrum) is used to bore into seeds, fruit, and trunks.
      Some species are serious agricultural pests, such as the cotton weevil.
      Other species are specialized on a single plant species.
  insect.lacewing:
    label: lacewing
    summary: A delicate insect with transparent veined wings; larvae hunt aphids.
    info: |
      The lacewing is an insect of the family Chrysopidae with delicate, transparently veined wings and golden eyes.
      The larvae are predators and consume huge amounts of aphids, making them natural protectors of plants.
      Adults feed on nectar and pollen.
      They are attracted to light and are an indicator of a healthy environment.
  insect.crane_fly:
    label: crane fly
    summary: A large mosquito-like fly with extremely long legs.
    info: |
      The crane fly is a two-winged insect of the family Tipulidae visually resembling a giant mosquito, but it does not bite or parasitize.
      Its extremely long legs break off easily; this is a defense mechanism (autotomy).
      Adults live only a few days and do not feed, or feed on nectar.
      The larvae (leatherjackets) live in the soil and feed on roots.
  insect.mayfly:
    label: mayfly
    summary: An insect with the shortest adult life, living only hours to days.
    info: |
      The mayfly is an insect of the order Ephemeroptera and a symbol of transience; adults live only hours to days.
      They have no functional mouthparts and do not feed at all.
      The nymphs live 1 to 3 years underwater.
      The mass swarming of mayflies is a captivating natural spectacle; in Hungary their mass swarming on the Danube is a unique phenomenon.
  insect.damselfly:
    label: damselfly
    summary: A slender relative of the dragonfly; at rest it folds its wings along its body.
    info: |
      The damselfly is an insect related to dragonflies, but slimmer, and at rest it folds its wings parallel to its body, unlike dragonflies.
      It is a predator and hunts small insects in flight.
      The nymphs live in water and are an important part of aquatic ecosystems.
      They are an indicator of the quality of watercourses.
  insect.robber_fly:
    label: robber fly
    summary: A predatory fly that catches other insects in mid-flight.
    info: |
      The robber fly is a predatory two-winged insect of the family Asilidae that hunts other insects directly in flight.
      It has strong legs to grasp prey and a proboscis to inject a paralyzing venom.
      Some species mimic the appearance of bumblebees or wasps as protection from predators.
      It is beneficial as a natural regulator of insect populations.
  insect.ground_beetle:
    label: ground beetle
    summary: A fast predatory beetle living under stones and in leaf litter.
    info: |
      The ground beetle is a beetle of the family Carabidae; most species are active nocturnal predators hunting other insects, worms, and slugs.
      They are fast and quickly flee from danger.
      Some species, such as the violet ground beetle, have a beautiful metallic sheen.
      They are indicators of healthy soil and natural farming.
  insect.tiger_beetle:
    label: tiger beetle
    summary: A metallic-colored fast beetle with excellent eyesight.
    info: |
      The tiger beetle is a beetle of the subfamily Cicindelinae famous for its extraordinary speed, ability to fly, and sharp eyesight.
      It runs so fast that it has to stop and reorient, because the movement is too fast for its visual system.
      It has splendidly colored metallic bodies (green, blue, red) and large eyes.
      The larvae dig vertical tunnels in the ground and wait in ambush at the opening for prey.
  insect.hoverfly:
    label: hoverfly
    summary: A fly that mimics the colors of wasps and bees, a garden pollinator.
    info: |
      The hoverfly is a two-winged insect of the family Syrphidae that mimics the coloration of wasps and bees as protection from predators (Batesian mimicry), although it does not sting.
      It is an important pollinator; it visits more plant species than bees.
      Adults feed on nectar and pollen.
      The larvae of some species hunt aphids, thus helping in gardens.
  insect.whirligig_beetle:
    label: whirligig beetle
    summary: A tiny beetle that circles in swarms on the water's surface.
    info: |
      The whirligig beetle is an aquatic beetle of the family Gyrinidae that lives on the surface, and circling in swarms helps it avoid predators.
      Its eyes are divided into two parts; one sees above the water, the other below.
      It detects ripples on the surface that signal food or danger.
      By day it circles, at night it flies.
  insect.louse:
    label: louse
    summary: A tiny wingless parasite living on the skin and hair of mammals.
    info: |
      The louse is a wingless parasitic insect of the order Phthiraptera living on the skin and in the fur or hair of hosts.
      It sucks blood and causes itching.
      The head louse is common worldwide and affects children regardless of hygienic conditions.
      Historically, lice transmitted typhus and other diseases.
  insect.bedbug:
    label: bedbug
    summary: A flat parasite that sucks blood at night; hides in furniture cracks.
    info: |
      The bedbug is a flat oval insect of the family Cimicidae active mainly at night.
      It bites and sucks the blood of a sleeping host.
      It hides in the cracks of mattresses, furniture, and behind wallpaper.
      In recent decades it has spread worldwide thanks to international travel.
  insect.antlion:
    label: antlion
    summary: A larva that digs funnel traps for ants in the sand.
    info: |
      The antlion is the larva of an insect of the family Myrmeleontidae that digs conical funnels in dry sand.
      When an ant slides into the trap, the antlion seizes it with its mandibles and injects digestive juices.
      Adults are inconspicuous, similar to dragonflies, and fly at night.
      The larvae can live for years underground without feeding.
  insect.goliath_beetle:
    label: Goliath beetle
    summary: One of the largest and heaviest insects in the world, from tropical Africa.
    info: |
      The Goliath beetle is one of the largest insects in the world; males weigh up to 100 grams and reach over 11 cm in length.
      It lives in the tropical rainforests of equatorial Africa.
      Adults feed on fruit and tree sap.
      In Africa children sometimes keep them as toys and they are sold to collectors.
  insect.bombardier_beetle:
    label: bombardier beetle
    summary: A beetle that shoots a boiling toxic mixture as defense.
    info: |
      The bombardier beetle is a beetle of the subfamily Brachininae that defends itself in a unique way; it mixes two chemicals in its abdomen, creating an explosive reaction at over 100 degrees.
      The highly toxic vapor is fired with a loud bang up to 500 times per second.
      It is one of the most fascinating examples of chemical defense in nature.
  insect.diving_beetle:
    label: diving beetle
    summary: A predatory aquatic beetle that swims below the surface.
    info: |
      The great diving beetle is a predatory aquatic beetle of the family Dytiscidae living in ponds and still water.
      It swims smoothly thanks to its flat hind legs functioning as oars.
      It breathes at the surface and stores air under its wing cases.
      It hunts insects, larvae, small fish, and tadpoles; it is active both in water and flies at night.
  insect.velvet_ant:
    label: velvet ant
    summary: An orange-black wingless wasp that looks like an ant.
    info: |
      The velvet ant is actually a wasp of the family Mutillidae; the females are wingless and resemble ants.
      They have conspicuous red or orange hairs as a warning.
      The females have an extremely powerful sting nicknamed the cow killer.
      They parasitize the nests of bumblebees.
