lang: en
pivot: false
title: Insects
cards:
  insect.ant:
    label: ant
    summary: Small social insect living in colonies.
    info: An ant is an insect forming large colonies with division of labor.
  insect.antlion:
    label: antlion
    summary: A larvae digging funnel-shaped pits for catching ants.
    info: Antlion is an insect larva belonging to family Myrmeleonitdae which excavates conical pitfalls on dry sand. When an ant slides down its trap, it gets caught by mandibles while digestive fluids get injected inside. Adults resemble dragonflies but lack distinct features; they fly at night.
  insect.aphid:
    label: aphids
    summary: Tiny sap-sucking insects on plant stalks that produce honeydew.
    info: Aphids are small sucking pests belonging to superfamily Aphidoidea which feed off plant juices. They excrete sweet honeydew around them for ants who protect aphids in return. Their reproduction is extremely fast—one female can give rise to hundreds of millions of offspring within just one year.
  insect.atlas_moth:
    label: Atlas moth
    summary: One of the world’s biggest silkmoths with wing patterns resembling snake heads.
    info: The Atlas moth is among the largest nocturnal butterflies globally, boasting wingspans up to 30 centimeters long. The tips of its wings feature coloration that mimics serpent heads—an adaptation designed to deter predators. Adults do not have mouths at all—they neither feed nor consume anything—and survive only for several days after reaching maturity.
  insect.bedbug:
    label: bedbug
    summary: Flat parasite that feeds on human blood at night; hides in furniture cracks.
    info: The common bed bug is flat and oval-shaped insect belonging to family Cimicidae active mainly during nighttime hours. It bites sleeping hosts for their blood supply while hiding within mattress seams, wooden furnishings gaps behind wallpaper layers worldwide due international travel over recent decades.
  insect.bee:
    label: bee
    summary: Yellow-and-black insect that pollinates flowers and produces honey.
    info: The honey bee is a social insect living in hives and collecting nectar.
  insect.beetle:
    label: beetle
    summary: Beetles form the largest order of insects with over four hundred thousand described species.
    info: The beetle belongs to the order Coleoptera and makes up approximately forty percent of all known insect species. It is characterized by hardened wing covers called elytra that protect its true flying wings underneath. The stag beetle is Europe's largest beetle—the male has large antler-like mandibles—and they live nearly everywhere across environments ranging from tropical regions to Arctic areas.
  insect.bombardier_beetle:
    label: cannonball beetle
    summary: Beetle firing boiling toxic mixture for defense.
    info: The cannonball beetle is an insect belonging to the subfamily Brachininae; it defends itself uniquely by mixing two chemicals inside its body cavity, creating explosive reactions with temperatures exceeding 100°C. The highly toxic vapor is ejected at loud bursts up to 500 times per second.
  insect.bumblebee:
    label: bumblebee
    summary: Large hairy bumblebee producing deep buzzing sound; important pollinator.
    info: A bumblebee is large fluffy insect belonging to the Bombus genus related to honeybees. It plays an essential role in pollination especially where cooler climates limit bees' activity since it can warm itself by shivering its flight muscles allowing for flying even on cold days Bumblebees compared to wasps tend not be aggressive stinging only when directly threatened.
  insect.butterfly:
    label: butterfly
    summary: Flying insect with large colorful wings.
    info: A butterfly is an insect with two pairs of scaly wings, often strikingly colored.
  insect.caterpillar:
    label: caterpillar
    summary: Caterpillar is larvae of butterflies or moths that eats leaves to prepare for metamorphosis.
    info: A caterpillar is the larval stage of either a butterfly or a moth and spends most of its life eating leaves so it can accumulate energy needed for transformation. Some have bright colors warning predators about their toxicity. During pupation they form chrysalis where full change happens.
  insect.centipede:
    label: centipede
    summary: Many-legged arthorpod with one leg-pair on each body segment.
    info: Centipedes belong to class Chilopoda and have one pair of legs for every section along their bodies—not necessarily 100 pairs despite its name. They are fast predators that hunt insects, worms, and small vertebrates. The first set of limbs is modified into venomous claws used to immobilize prey. Some tropical species can grow over 30 centimeters long.
  insect.cicada:
    label: cicada
    summary: Insect known for its noisy songs on hot days.
    info: The cicada is an insect renowned for producing some of the loudest sounds among all insects. Males create sound using specialized membranes called timbals located at their abdomen to attract females. Some species found in North America have seventeen-year or thirteen-year developmental cycles; nymphs live underground for years feeding off plant roots.
  insect.cockroach:
    label: cockroach
    summary: Fast nocturnal omnivorous insect that is highly resilient.
    info: Cockroaches are among the most durable insects on Earth—they can survive radiation levels and conditions lethal for other animals. Over 4,500 species have been identified, but only about thirty live near humans. These ancient creatures existed over three hundred million years ago—long before dinosaurs—and remain adaptable survivors.
  insect.crane_fly:
    label: crane fly
    summary: Large crane-like fly with extremely long legs.
    info: The crane fly is a two-winged insect belonging to the family Tipulidae that visually resembles an enormous mosquito but does not bite nor parasitize anything. Its exceptionally long legs break off easily—a defensive behavior known as autotomy—while adults live only for several days without feeding on food except possibly some nectar.
  insect.cricket:
    label: cricket
    summary: Night-dwelling insects known for males' chirring sounds.
    info: Field crickets belong to the order Orthoptera and are active at night. Males produce their characteristic sound by rubbing wings together against each other; they use it both to attract females and mark territory boundaries. In Asia, these creatures have traditionally been kept domestically not only because people enjoy listening but also due cultural associations with domestic comfort & happiness.
  insect.damselfly:
    label: damselfly
    summary: Slendrier cousin to damselflies rest their wings parallel to body at rest.
    info: Damselflys resemble dragonflies but have slimmer bodies and fold their wings alongside them when resting, unlike dragonflies which hold theirs open like sails. They hunt small insects mid-flight while adults live near water where nymphs develop underwater playing an important role within aquatic ecosystems by serving also indicators for stream health.
  insect.diving_beetle:
    label: diving beetles
    summary: Aquatic predator diving under water to hunt.
    info: Large diving beetles belong to family Dytiscidae living in ponds and still waters. They swim smoothly thanks to their flat hind legs acting like oars while breathing at surface level with air stored underneath elytra. These predators catch insects larvae small fish even snails being active both underwater during day time flying nocturnally.
  insect.dragonfly:
    label: dragonfly
    summary: Insect with long body and two pairs of transparent wings.
    info: A dragonfly is a predatory insect with excellent vision that hunts near water surfaces.
  insect.dung_beetle:
    label: scarabeid beetle
    summary: Beetle rolling dung balls, sacred in ancient Egypt.
    info: The scarabeid is an insect belonging to the family Scarabaeidae; it forms feces into spheres which it pushes for burial purposes where eggs can be laid inside them. In Ancient Egypt, they were symbols representing both sun worshiping practices associated with god Kheperu/Khopri among other deities within their mythology system.
  insect.earwig:
    label: earwig
    summary: Elongated insect with forceps on its hind-end.
    info: Earwigs belong to order Dermaptera and have distinctive pinchers called cerci near their tails used for defense and mating. The name comes from an old myth that they crawl inside people's ears—this is false. Female earwigs stand out because they care for eggs and young larvae—a rare behavior among insects.
  insect.firefly:
    label: firefly
    summary: Beetle producing bioluminescent light to attract mates.
    info: Fireflies belong to the family Lampyridae and can produce cold light through their abdomen via biochemical reactions involving luciferasse with luciferin. Both males and females emit different patterns for mutual recognition and attraction. Fireflies serve as an indicator species reflecting environmental cleanliness.
  insect.flea:
    label: flea
    summary: Tiny blood-sucking parasite that jumps on mammals and birds.
    info: A flea is wingless insects belonging to order Siphonaptera specialized for an ectoparasitic lifestyle. Its strong hind legs allow it to jump over 150 times its body length. Fleas feed by sucking blood from both mammals and birds while also being capable disease carriers historically responsible for spreading plague.
  insect.fly:
    label: housefly
    summary: Common dipterous fly capable of spreading bacteria.
    info: The common housefly is the most prevalent winged insect found around human dwellings. Its compound eyes allow it to see nearly all directions at once—almost 360 degrees—and its habit of landing on waste materials makes it an effective carrier for disease-causing germs which can then be transferred onto food sources when they land there next.
  insect.goliath_beetle:
    label: bog
    summary: One of the largest and heaviest beetles found in tropical Africa.
    info: The Goliath beetle is among the biggest insect species globally with males weighing up to 100 grams and reaching lengths over 11 centimeters long. They live exclusively within rainforests across equatorial regions throughout sub-Saharan countries where they feed primarily on fruits along side tree sap consumption patterns observed during adult stages.
  insect.grasshopper:
    label: grasshopper
    summary: Jumping insect with long hind legs that can jump up to twenty times its body length.
    info: A grasshopper is an orthopteran insect with strong rear legs enabling jumps up to twentyfold their body's length. Males produce characteristic sounds by rubbing their thighs against wings. They feed on plants; large swarms may cause damage to crops.
  insect.ground_beetle:
    label: ground beetle
    summary: Fast-moving predatory beetles living among rocks and leaf litter.
    info: Ground beetles belong to the family Carabidae; most species are active nocturnal predators that hunt other insects, worms, and snails. They move quickly and flee rapidly when threatened. Some species like the violet ground beetle have stunning metallic coloration. These beetles serve as indicators of healthy soil conditions and natural agriculture.
  insect.hornet:
    label: bald-faced hornet
    summary: The largest European wasp with a strong sting and loud buzz.
    info: Bald-faced hornets are Europe's biggest social wasps growing up to over 3.5 cm long. They build paper nests inside tree hollows or on rooftops. Their stinger is longer than that of regular wasps, making their sting more painful; however, they only attack when directly threatened. The species also plays an important role by preying upon other insects.
  insect.hoverfly:
    label: hoverfly
    summary: Fly resembling wasps and bees colors, garden flower pollinator.
    info: Hoverflies belong to family Syrphidae and mimic bee coloration for protection against predators through Batesian mimicry despite not stinging themselves. They play an important role in pollination by visiting more plant species than honeybees do while feeding on nectar and pollen when adult. Larvae of some hoverfly species hunt aphids which helps control pests gardens.
  insect.lacewing:
    label: green lacewing
    summary: Delicate insect with translucent veined wings that hunt aphids.
    info: Green lacewings belong to the family Chrysopidae and have delicate, see-through wing veins along with golden eyes. Their larvae actively prey on vast numbers of aphids, making them natural protectors for plants. Adults feed primarily on nectar and pollen.
  insect.ladybug:
    label: ladybug
    summary: Small round red beetle with black spots.
    info: A ladybug is a small beetle that feeds on aphids and is useful in gardens.
  insect.locust:
    label: desert locust
    summary: The desert locust forming devastating swarms with millions of individuals.
    info: Desert locust is an insect species capable of creating enormous migratory swarms under certain conditions. A single swarm can contain billions of insects and destroy entire crops across thousands of hectares within just one day. In African and Asian countries, these plagues have historically been among the worst agricultural disasters.
  insect.louse:
    label: lice
    summary: Tiny wingless parasite that lives on mammals' skin and fur.
    info: Lice belong to the order Phthiraptera; they live embedded within their hosts’ hairs by feeding off blood which causes itching sensations across affected areas like scalp regions where head louse infestations commonly occur globally among children regardless hygiene standards followed at home.
  insect.mayfly:
    label: mayfly
    summary: Insect with the shortest adult lifespan, living only hours to days.
    info: Mayflies belong to the order Ephemeropterans and represent transience; adults live for just hours up to several days without eating at all due to their non-functional mouthparts. Their nymphs spend between one to three years underwater before emerging.
  insect.mosquito:
    label: mosquito
    summary: Two-winged fly that feeds on blood to develop eggs.
    info: Mosquitos belong to the family Culicidae among two-winged insects. Female mosquitoes feed on animal blood for protein needed during egg development while males consume nectar instead. Mosquito bites can transmit dangerous diseases such as malaria, Dengue fever, or Zika virus.
  insect.moth:
    label: moth
    summary: Nighttime relative of butterflies that flies toward light with feathered antennae.
    info: Moths are nocturnal butterflies belonging to order Lepidoptera who differ visually by folding their wings sideways when resting compared to daytime moths. Many species attract artificial lights at night for mating rituals while silkworm caterpillars produce natural silk used globally across industries like fashion & textiles.
  insect.praying_mantis:
    label: praying mantis
    summary: A predatory insect that holds its front legs together like it's praying.
    info: The praying mantis is an ambush predator known for holding its long hind limbs folded at rest resembling hands clasped during worship; they strike their prey within milliseconds using powerful raptorial forelimbs designed specifically for capturing live insects mid-air.
  insect.robber_fly:
    label: robberfly
    summary: Predatory fly catching other insects mid-flight.
    info: A robberfly is an ambush predatory insect belonging to the family Asilidae; it hunts its prey while both animals are flying through the air simultaneously using powerful legs for grasping victims along with piercing mouthparts capable of injecting paralysis-inducing venom directly upon capture without prior contact on surfaces like plants where many similar species might wait patiently until something edible comes within reach instead.
  insect.scorpion:
    label: scorpion
    summary: Venomous arachnid with pincers and a curled venomous tail.
    info: Scorpions belong to spiders (not insects), have characteristic pinchers called pedipalps, and possess tails that curve backward ending in an aculeus containing poison glands. They're ancient creatures—fossils over 430 million years old exist—and they glow under ultraviolet light when it's dark due to fluorescent properties on their exoskeletons.
  insect.silverfish:
    label: silverfish
    summary: Wingless rapid insect commonly encountered near books and paper.
    info: The silverfish is an ancient winged-less insect belonging to order Zygoptera that lives inside homes. It feeds on starch-based materials like paper, bookbinding glue, fabric fibers, and similar substances. Its name comes from its silvery coloration and fish-like movement.
  insect.spider:
    label: spider
    summary: Eight-legged spiders build silk traps to catch insects.
    info: Spiders belong to class Arachnida (they're not real bugs/insects), have eight legs and two-part bodies. They produce spider silk used for weaving hunting nets or egg sacs. Over 48 thousand species exist worldwide; all secrete venom but most pose little threat.
  insect.stag_beetle:
    label: stag beetles
    summary: The largest European beetle species has males with horn-shaped jaws.
    info: Stag Beetles (Lucanus cervus) can grow up to over seven centimeters long—making them Europe's biggest beetles. Males have large, antler-like mandibles used for fighting other males during mating season. The larvae live inside rotting oak wood for nearly six years before emerging adults feed on fungi.
  insect.stick_insect:
    label: stick bug
    summary: Insect that perfectly resembles a branch or leaf.
    info: Stick insects belong to the order Phasmatodea and master mimicry by having bodies shaped like twigs or leaves. When threatened they remain completely still without moving at all.
  insect.termite:
    label: Termite
    summary: Social insects that build massive clay nests.
    info: A termite is a social wooden-digesting insect belonging to the order Isoptera; it's distantly related to cockroaches. They live in colonies with kings, queens, soldiers, and workers who perform specific roles within society.
  insect.tiger_beetle:
    label: tiger beetle
    summary: Metallic-colored fast-running beetles with excellent vision.
    info: Tiger beetles belong to subfamily Cicindelinae known for their exceptional speed, flight ability, and sharp eyesight. They run so quickly that they must stop periodically to reorient themselves because movement is too rapid for their visual system. These insects have beautifully colored metallic bodies—green, blue, red—and large compound eyes.
  insect.velvet_ant:
    label: velvet ant
    summary: An orange-black wingless wasp resembling an ant.
    info: The velvet ant is actually a wasp belonging to the family Mutillidae; females lack wings and resemble ants. They have striking red or orange hairs serving as warning signals. Females possess extremely strong stingers nicknamed 'the cow killer'.
  insect.wasp:
    label: wasp
    summary: Yellow and black paper wasp that builds nests.
    info: The common wasp is an acrid-winged insect belonging to the Vespa family with typical yellow-and-black warning coloration. It constructs its nest out of wood pulp chewed by workers. Unlike bees, it can sting multiple times because their stingers do not get left behind after each strike.
  insect.water_strider:
    label: water strider
    summary: Insect walking on the water's surface due to surface tension.
    info: A water strider is an insect belonging to the family Gerridae capable of walking across liquid surfaces thanks to its waterproof leg hairs and the surface tension of water. It hunts submerged insects by detecting vibrations caused through the ripple patterns they create. The creature moves swiftly along these waves at speeds exceeding fifteen times their body length per second.
  insect.weevil:
    label: weevil
    summary: Small beetle with characteristic elongated snout.
    info: A weevil is an insect belonging to the family Curculionidae—the largest animal family on Earth containing over 60,000 species. The distinctive extended beak-like structure called a rostrum serves for drilling holes into seeds, fruits, and stems. Some species cause significant agricultural damage—such as cottonseed weevils—while others specialize exclusively in feeding upon specific plant types.
  insect.whirligig_beetle:
    label: whirligig beetle
    summary: Small beetles circling together across still waters.
    info: Whirlygigs belong to family Gyrinidae; they live at pond surfaces where their swirling movements help avoid predators by confusing them with group patterns.
