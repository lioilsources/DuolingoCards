lang: ko
pivot: false
title: 곤충
cards:
  insect.ant:
    label: 개미
    summary: 군집을 이루어 사는 작은 사회성 곤충.
    info: 개미는 명확한 분업 체계를 갖춘 대규모 군집을 이루는 곤충이다.
  insect.antlion:
    label: 개미귀신
    summary: 모래에 깔때기 모양 함정을 파고 미끄러져 들어오는 개미를 잡는 유충.
    info: |-
      개미귀신은 명주잠자리과 곤충의 유충으로 마른 모래에 원뿔형 함정을 판다.
      개미가 미끄러져 들어오면 큰 턱으로 붙잡아 소화액을 주입한다.
      성체는 잠자리와 비슷하게 생겼으며 저녁에 날아다닌다.
      유충은 먹이 없이도 땅속에서 여러 해를 버틸 수 있다.
  insect.aphid:
    label: 진딧물
    summary: 식물 줄기에서 수액을 빨아먹으며 단물을 배출하는 작은 해충.
    info: |-
      진딧물은 식물의 즙을 빨아먹는 작은 곤충으로 진딧물상과에 속한다.
      단물이라는 달콤한 물질을 배출하며 그 대가로 개미의 보호를 받기도 한다.
      번식력이 매우 뛰어나 암컷 한 마리가 짧은 기간에 수많은 개체로 늘어날 수 있다.
  insect.atlas_moth:
    label: 아틀라스나방
    summary: 날개 무늬가 화려하고 세계에서 가장 큰 나방 중 하나.
    info: |-
      아틀라스나방은 날개 폭이 최대 30cm에 이르는 세계에서 가장 큰 나방 중 하나다.
      날개 끝은 뱀 머리처럼 보이도록 무늬가 있어 포식자를 위협한다.
      성체는 입이 없어 전혀 먹지 못하며 며칠밖에 살지 못한다.
      동남아시아의 열대 우림에 서식한다.
  insect.bedbug:
    label: 빈대
    summary: 밤에 피를 빨고 가구 틈에 숨는 납작한 기생충.
    info: |-
      빈대는 주로 밤에 활동하는 흡혈 곤충으로 잠든 숙주를 문다.
      매트리스와 가구의 틈, 벽지 뒤에 숨는다.
      최근 수십 년간 국제 여행으로 전 세계에 다시 퍼지고 있다.
  insect.bee:
    label: 꿀벌
    summary: 꽃가루를 옮기고 꿀을 만드는 황갈색 곤충.
    info: |-
      꿀벌(Apis mellifera)은 벌집에서 무리를 이루어 사는 사회성 곤충으로 꿀을 만든다.
      식물의 수분에 매우 중요한 역할을 하며 위협을 느끼면 침으로 방어한다.
  insect.beetle:
    label: 딱정벌레
    summary: 알려진 종이 40만 이상으로 곤충 중 가장 큰 목을 이룬다.
    info: |-
      딱정벌레는 알려진 동물 종의 약 40%를 차지하는, 곤충 중 종이 가장 많은 목(딱정벌레목)이다.
      단단한 겉날개(딱지날개) 아래에 진짜 비행용 날개가 접혀 있다.
      열대 우림부터 극지방 근처까지 거의 모든 환경에 서식한다.
  insect.bombardier_beetle:
    label: 폭탄먼지벌레
    summary: 끓는 유독 물질을 뿜어 방어하는 딱정벌레.
    info: |-
      폭탄먼지벌레는 배 끝에서 두 가지 화학 물질을 섞어 100도가 넘는 뜨거운 분사액을 뿜는다.
      이 유독한 분사는 폭발음과 함께 짧은 순간에 여러 번 발사될 수 있다.
      포식자를 쫓는 매우 효과적인 방어 무기다.
  insect.bumblebee:
    label: 호박벌
    summary: 굵게 윙윙거리며 중요한 수분을 담당하는 털 많은 벌.
    info: |-
      호박벌은 뒤영벌속(Bombus)에 속하는 털이 많은 벌로 꿀벌과 가깝다.
      추운 기후에서 특히 중요한 수분 매개자다.
      날개 근육을 떨어 체온을 높일 수 있어 추운 날에도 날 수 있으며 꿀벌보다 온순하다.
  insect.butterfly:
    label: 나비
    summary: 크고 화려한 날개를 가진 주행성 곤충.
    info: 나비는 대개 화려한 색을 띤, 비늘로 덮인 두 쌍의 날개를 가진 곤충이다.
  insect.caterpillar:
    label: 애벌레
    summary: 나비나 나방의 유충 단계로 잎을 먹으며 변태를 준비한다.
    info: |-
      애벌레는 나비나 나방의 유충으로 주로 잎을 먹으며 에너지를 축적해 변태를 준비한다.
      일부는 독이 있음을 알리려고 눈에 띄는 색을 띤다.
      번데기(고치) 안에서 완전변태가 일어난다.
  insect.centipede:
    label: 지네
    summary: 몸마디마다 한 쌍씩 여러 다리를 가진 절지동물.
    info: |-
      지네는 몸마디마다 다리 한 쌍을 가진 순각류로 이름과 달리 다리가 꼭 100개는 아니다.
      빠른 포식자로 곤충과 지렁이, 작은 척추동물을 사냥한다.
      첫 번째 다리 쌍은 독을 주입하는 발톱으로 변형되어 있다.
      일부 열대종은 길이가 30cm를 넘기도 한다.
  insect.cicada:
    label: 매미
    summary: 여름철 큰 소리로 우는 것으로 유명한 곤충.
    info: |-
      매미는 여름날 가장 시끄러운 곤충 중 하나다.
      수컷은 배에 있는 특수한 발음 기관으로 암컷을 부르는 소리를 낸다.
      북미의 일부 종은 13년 또는 17년 주기로 나타난다.
      유충은 여러 해 동안 땅속에서 나무뿌리의 즙을 먹으며 산다.
  insect.cockroach:
    label: 바퀴벌레
    summary: 야행성으로 무엇이든 먹는 끈질기고 적응력 강한 곤충.
    info: |-
      바퀴벌레는 극한 환경에서도 살아남는 매우 강인한 곤충 중 하나다.
      전체 종은 4천 종이 넘지만 사람 곁에 사는 것은 약 30종뿐이다.
      공룡보다 앞선 수억 년 전부터 존재해 온 오래된 곤충이다.
  insect.crane_fly:
    label: 각다귀
    summary: 다리가 매우 긴, 큰 모기처럼 생긴 파리.
    info: |-
      각다귀는 큰 모기와 비슷해 보이지만 물지도 기생하지도 않는다.
      매우 긴 다리를 가지며 위험할 때 다리를 쉽게 떼어내는 방어 습성이 있다.
      성체는 며칠밖에 살지 않으며 거의 먹지 않는다.
  insect.cricket:
    label: 귀뚜라미
    summary: 수컷이 날개를 비벼 우는 것으로 알려진 야행성 곤충.
    info: |-
      귀뚜라미는 메뚜기목에 속하는 야행성 곤충이다.
      수컷은 날개를 서로 비벼 암컷을 부르고 영역을 알리는 소리를 낸다.
      아시아에서는 예로부터 그 울음소리를 즐기려고 집에서 기르기도 했다.
  insect.damselfly:
    label: 실잠자리
    summary: 잠자리와 비슷하지만 가늘고 약하게 나는 곤충.
    info: |-
      실잠자리는 잠자리와 가까운 친척이지만 더 가늘고 쉴 때 날개를 몸과 나란히 접는다.
      비행 중 작은 곤충을 사냥하는 포식자이며 유충은 물속에서 산다.
      수질 상태를 알려 주는 지표종이기도 하다.
  insect.diving_beetle:
    label: 물방개
    summary: 물속을 헤엄치며 먹이를 사냥하는 물속 딱정벌레.
    info: |-
      물방개는 연못이나 고인 물에 사는 헤엄치는 포식성 딱정벌레다.
      납작한 뒷다리를 노처럼 저어 매끄럽게 헤엄친다.
      수면에 나와 딱지날개 밑에 공기를 저장하며 곤충과 유충, 작은 물고기를 사냥한다.
  insect.dragonfly:
    label: 잠자리
    summary: 긴 몸과 두 쌍의 투명한 날개를 가진 곤충.
    info: 잠자리는 시력이 뛰어난 포식성 곤충으로 물가에서 사냥한다.
  insect.dung_beetle:
    label: 쇠똥구리
    summary: 똥을 공처럼 굴리는, 고대 이집트에서 숭배받던 딱정벌레.
    info: |-
      쇠똥구리는 소똥구릿과의 곤충으로 배설물을 공 모양으로 뭉쳐 굴린 뒤 땅에 묻고 알을 낳는다.
      고대 이집트에서는 태양과 케프리 신의 상징으로 숭배받았다.
      은하수의 빛을 길잡이로 삼아 방향을 잡는 것으로 알려진 유일한 동물이다.
      영양분을 순환시키고 토양을 기름지게 하는 데 이바지한다.
  insect.earwig:
    label: 집게벌레
    summary: 꼬리 끝에 집게가 달린 길쭉한 곤충.
    info: 집게벌레는 사람 귀로 들어간다는 속설이 있지만 실제로는 근거 없는 이야기다.
  insect.firefly:
    label: 반딧불이
    summary: 스스로 빛을 내어 짝을 부르는 곤충.
    info: |-
      반딧불이는 반딧불잇과의 곤충으로 배 끝에서 열이 거의 없는 차가운 빛을 낸다.
      암수가 서로 다른 발광 패턴으로 상대를 알아보고 유혹한다.
      루시페린이 효소와 반응하며 빛이 만들어진다.
      깨끗한 자연환경을 알려 주는 지표종이다.
  insect.flea:
    label: 벼룩
    summary: 포유류와 새의 피를 빨며 멀리 뛰는 작은 기생 곤충.
    info: |-
      벼룩은 날개가 없는 흡혈 곤충으로 강한 뒷다리로 몸길이의 수백 배를 뛸 수 있다.
      포유류와 새의 피를 빨며 질병을 옮기기도 한다.
      역사적으로 흑사병을 퍼뜨린 매개체로 알려져 있다.
  insect.fly:
    label: 집파리
    summary: 쓰레기를 옮겨 다니며 병균을 퍼뜨릴 수 있는 흔한 파리.
    info: |-
      집파리(Musca domestica)는 사람이 사는 곳에서 가장 흔한 파리다.
      겹눈으로 거의 360도를 볼 수 있다.
      쓰레기와 음식에 앉으며 세균을 옮긴다.
      날 수 있는 날개는 한 쌍뿐이고 나머지 한 쌍은 비행 균형을 잡는 데 쓴다.
  insect.goliath_beetle:
    label: 골리앗꽃무지
    summary: 아프리카에 사는, 지구에서 가장 무거운 곤충 중 하나.
    info: |-
      골리앗꽃무지는 세계에서 가장 무거운 곤충 중 하나로 수컷은 무게가 약 100그램, 길이는 11cm를 넘기도 한다.
      아프리카 적도의 열대 우림에 산다.
      성체는 과일과 나무 수액을 먹으며 수집가들 사이에서 인기가 많다.
  insect.grasshopper:
    label: 메뚜기
    summary: 긴 뒷다리로 멀리 뛰는 초식 곤충.
    info: |-
      메뚜기는 튼튼한 뒷다리를 가진 메뚜기목 곤충으로 몸길이의 수십 배를 뛸 수 있다.
      수컷은 뒷다리를 날개에 비벼 특유의 소리를 낸다.
      초식성이며 큰 무리는 농작물에 큰 피해를 줄 수 있다.
  insect.ground_beetle:
    label: 먼지벌레
    summary: 돌이나 낙엽 밑에 사는 빠른 야행성 포식 딱정벌레.
    info: |-
      먼지벌레는 딱정벌레과에 속하는 곤충이다.
      대부분 활발한 야행성 포식자로 다른 곤충과 지렁이, 달팽이를 사냥한다.
      빠르게 움직이며 위험이 닥치면 재빨리 달아난다.
      금속광택이 나는 아름다운 종도 있으며 건강한 토양을 알려 주는 지표종이다.
  insect.hornet:
    label: 장수말벌
    summary: 독침이 세고 요란하게 윙윙거리는 유럽에서 가장 큰 말벌.
    info: |-
      장수말벌은 유럽에서 가장 큰 사회성 말벌로 길이가 약 3.5cm에 이른다.
      나무 구멍이나 지붕 밑에 종이 재질의 집을 짓는다.
      침은 보통 말벌보다 길고 아프지만 직접 위협받을 때만 쏜다.
      다른 곤충을 잡아먹는 중요한 포식자다.
  insect.hoverfly:
    label: 꽃등에
    summary: 벌처럼 생겼지만 쏘지 않는, 정원의 중요한 수분 매개 파리.
    info: |-
      꽃등에는 벌이나 말벌의 색을 흉내 내 포식자를 피하는 파리다(베이츠 의태).
      실제로는 쏘지 않는다.
      꽃가루받이를 돕는 중요한 수분 매개자이며 벌보다 다양한 꽃을 찾는다.
      일부 종의 유충은 진딧물을 잡아먹는다.
  insect.lacewing:
    label: 풀잠자리
    summary: 투명한 그물맥 날개를 가지며 유충이 진딧물을 잡아먹는 곤충.
    info: |-
      풀잠자리는 투명한 그물맥 날개와 금빛 눈을 가진 곤충이다.
      유충은 진딧물을 많이 잡아먹어 자연적인 해충 방제 역할을 한다.
      성체는 꿀과 꽃가루를 먹으며 불빛에 잘 모여든다.
  insect.ladybug:
    label: 무당벌레
    summary: 붉은 바탕에 검은 점이 있는 작고 둥근 곤충.
    info: 무당벌레는 진딧물을 잡아먹어 정원에 이로운 곤충이다.
  insect.locust:
    label: 풀무치
    summary: 거대한 무리를 이루어 농작물을 휩쓰는 메뚜기.
    info: |-
      풀무치는 특정 조건에서 거대한 이동 무리를 이루는 메뚜기다.
      한 무리에 수십억 마리가 모이기도 하며 하루에 넓은 농경지를 초토화할 수 있다.
  insect.louse:
    label: 이
    summary: 날개가 없고 숙주에 붙어 사는 작은 기생 곤충.
    info: |-
      이는 숙주의 피부와 털, 머리카락에 사는 날개 없는 기생 곤충이다.
      피를 빨아 가려움을 일으킨다.
      머릿니는 전 세계에 흔하며 위생 상태와 관계없이 아이들에게 잘 옮는다.
      역사적으로 발진티푸스 같은 질병을 옮기기도 했다.
  insect.mayfly:
    label: 하루살이
    summary: 성충의 수명이 몇 시간에서 며칠뿐인 곤충.
    info: |-
      하루살이는 덧없음의 상징으로 성충은 몇 시간에서 하루 정도밖에 살지 못한다.
      성충은 입이 퇴화해 전혀 먹지 못한다.
      유충은 물속에서 1년에서 3년 정도 산다.
  insect.mosquito:
    label: 모기
    summary: 암컷이 피를 빨고 질병을 옮길 수 있는 두 날개 곤충.
    info: |-
      모기는 모깃과에 속하는 두 날개 곤충이다.
      암컷은 알을 만들 단백질을 얻으려고 피를 빨고 수컷은 꽃꿀을 먹는다.
      말라리아나 뎅기열 같은 위험한 병을 옮기기도 한다.
  insect.moth:
    label: 나방
    summary: 주로 밤에 활동하며 쉴 때 날개를 옆으로 펼쳐 접는 나비류.
    info: |-
      나방은 나비와 가까운 나비목 곤충으로 쉴 때 날개를 몸 옆으로 펼쳐 접는 점이 나비와 다르다.
      많은 종이 인공 불빛에 모여든다.
      누에나방의 애벌레는 명주실을 자아낸다.
      달나방(루나 모스)은 세계에서 가장 아름다운 나방으로 꼽힌다.
  insect.praying_mantis:
    label: 사마귀
    summary: 기도하는 듯한 자세와 번개 같은 사냥 솜씨를 가진 포식 곤충.
    info: |-
      사마귀는 앞다리를 모은 자세가 기도하는 모습 같다고 해 붙은 이름의 포식 곤충이다.
      순식간에 앞다리를 뻗어 먹이를 낚아챈다.
      짝짓기 뒤 암컷이 수컷을 잡아먹는 종도 있다.
  insect.robber_fly:
    label: 파리매
    summary: 공중에서 다른 곤충을 낚아채 잡아먹는 포식성 파리.
    info: |-
      파리매는 파리맷과에 속하는 포식성 파리로 공중에서 다른 곤충을 사냥한다.
      먹이를 붙잡는 튼튼한 다리와 마비 독을 주입하는 뾰족한 입을 가졌다.
      일부 종은 몸을 지키려고 벌이나 다른 파리를 닮았다.
  insect.scorpion:
    label: 전갈
    summary: 집게발과 독침이 달린 구부러진 꼬리를 가진 거미류.
    info: |-
      전갈은 집게발과 끝에 독침이 달린 구부러진 꼬리를 가진 거미류다(곤충이 아니다).
      약 4억 3천만 년 전 화석이 있을 만큼 아주 오래된 동물이다.
      자외선을 받으면 몸이 빛난다.
      약 2,500종 가운데 사람에게 위험한 것은 25종 정도뿐이다.
  insect.silverfish:
    label: 좀
    summary: 집 안 책이나 종이 근처에서 흔한, 날개 없는 작고 재빠른 곤충.
    info: |-
      좀은 집 안에 사는 날개 없는 원시적인 곤충이다.
      녹말과 종이, 책 풀, 섬유를 먹는다.
      은빛 몸과 물고기처럼 꿈틀거리는 움직임에서 이름이 유래했다.
      수억 년 동안 거의 변하지 않은 가장 오래된 곤충 중 하나다.
  insect.spider:
    label: 거미
    summary: 다리가 여덟 개이고 거미줄을 치는 절지동물.
    info: |-
      거미는 거미강에 속하는 절지동물로(곤충이 아니다) 다리가 여덟 개이고 몸은 두 부분으로 나뉜다.
      먹이나 알을 감싸고 그물을 치려고 거미줄을 자아낸다.
      전 세계에 약 4만 8천 종이 있다.
      모든 종이 독을 지니지만 대부분 사람에게는 무해하다.
  insect.stag_beetle:
    label: 사슴벌레
    summary: 수컷의 큰 턱이 특징인, 유럽에서 가장 큰 딱정벌레.
    info: |-
      사슴벌레(Lucanus cervus)는 길이가 최대 약 7cm에 이르는 유럽에서 가장 큰 딱정벌레다.
      수컷은 암컷을 두고 다툴 때 쓰는 사슴뿔처럼 큰 턱을 가졌다.
      유충은 썩은 참나무 목재 속에서 최대 7년까지 산다.
  insect.stick_insect:
    label: 대벌레
    summary: 나뭇가지나 잎을 감쪽같이 흉내 내는 곤충.
    info: |-
      대벌레는 대벌레목에 속하는 의태의 달인이다.
      몸이 나뭇가지나 잎을 완벽하게 닮았다.
      위협을 받으면 꼼짝하지 않고 멈춘다.
      수컷 없이 번식하는 종도 있으며 관찰용 반려곤충으로 인기가 있다.
  insect.termite:
    label: 흰개미
    summary: 흙으로 거대한 탑 모양 집을 짓는 사회성 곤충.
    info: |-
      흰개미는 개미와는 먼 친척인 사회성 곤충이다.
      왕과 여왕, 병정, 일꾼으로 이루어진 군집을 이루어 산다.
      열대 지방에서는 높이가 약 9미터에 이르고 환기 구조까지 갖춘 복잡한 집을 짓는다.
  insect.tiger_beetle:
    label: 길앞잡이
    summary: 매우 빠르고 시력이 뛰어난, 금속광택이 나는 포식 딱정벌레.
    info: |-
      길앞잡이는 빠른 달음질과 비행 능력, 예리한 시력을 가진 포식성 딱정벌레다.
      너무 빨라 달리는 중에는 앞이 잘 보이지 않아 멈춰 서서 방향을 다시 잡는다.
      초록, 파랑, 빨강의 금속광택이 나는 아름다운 몸과 큰 두 눈을 가졌다.
      유충은 땅속에 수직 굴을 파고 입구에 숨어 먹이를 기다린다.
  insect.velvet_ant:
    label: 개미벌
    summary: 강렬한 색의 털로 뒤덮이고 매우 아픈 침을 가진, 날개 없는 암컷 벌.
    info: 개미벌은 벨벳 같은 털로 덮인, 날개 없는 암컷이 개미처럼 보이는 말벌류다(Mutillidae).
  insect.wasp:
    label: 말벌
    summary: 노랑과 검정 무늬에 종이 집을 짓는, 침을 가진 곤충.
    info: 말벌은 노랑과 검정의 경고색을 띠고 쏘는 곤충으로 종이 재질의 집을 짓는다.
  insect.water_strider:
    label: 소금쟁이
    summary: 표면장력을 이용해 고인 물 위를 걷는 작은 곤충.
    info: 소금쟁이는 잔털로 덮인 다리로 표면장력을 이용해 물에 가라앉지 않고 물 위를 걷는 곤충이다.
  insect.weevil:
    label: 바구미
    summary: 특유의 긴 주둥이를 가진 작은 딱정벌레.
    info: |-
      바구미는 동물계에서 종이 가장 많은 과의 하나인 바구밋과에 속하며 6만 종이 넘는다.
      특징적인 긴 주둥이로 열매와 나무 줄기에 구멍을 뚫는다.
      목화바구미처럼 중요한 농업 해충인 종도 있고 특정 식물만 먹는 종도 있다.
  insect.whirligig_beetle:
    label: 물맴이
    summary: 물 위에서 무리 지어 빙글빙글 도는 물속 딱정벌레.
    info: |-
      물맴이는 물 표면에서 무리 지어 빙빙 돌며 사냥하고 포식자를 피하는 수생 딱정벌레다.
      눈이 위아래 두 부분으로 나뉘어 있어 물 위와 물속을 동시에 볼 수 있다.
