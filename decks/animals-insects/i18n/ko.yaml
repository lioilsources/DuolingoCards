lang: ko
pivot: false
title: 곤충
cards:
  insect.ant:
    label: ants
    summary: 집단에서 사는 작은 사회성 곤충.
    info: "\U0001F41C 개미는 일정한 노동 분담을 갖춘 대규모 집단을 형성하는 곤충입니다."
  insect.antlion:
    label: antlion
    summary: 모래 위를 기어가는 개미들을 위한 구덩이 트랩을 만드는 벌레 유충.
    info: 안개나비과의 곤충 유충인 안개벌레는 마른 모래 속에 원뿔형 덫을 파낸다. 개미가 미끄러져 들어오면 이빨로 잡아먹고 소화액을 주입한다. 성체들은 눈으로 잘 보이지 않고 종루와 비슷하며 밀림에서 날린다. 이러한 유충은 먹이 없이 땅속에서 수년 동안 살아갈 수도 있다.
  insect.aphid:
    label: aphids
    summary: 작고 줄기를 따라 사냥하는 과일과 채소 작물을 해치우며, 달콤한 점액을 배출합니다.
    info: 蚜虫은 식물 줄기에 붙어 있는 작은 수액을 빨아먹는 곤충으로서 주로 벌레의 일가인 아피도이데에 속한다. 이들은 꿀 같은 물질인 메드오니스를 생산하며, 이를 위해 포유류와 교환하여 보호받기도 한다. 그들의 번식률은 매우 높으며 한 마리 암컷만 있어도 하루 안에도 수백 만 개체까지 증체할 수도 있다.
  insect.atlas_moth:
    label: '"마르팅악 알타서보"'
    summary: '"하디한 패턴으로 장식된 나이프로 세상에서 가장 크고 두드러진 모양새를 지닌 과일박쥐."'
    info: |-
      {"hint":"세계에서 가장 큰 나방 중 하나(아틀라스 아티커)","info":"마틴악 알타소비는 날개 폭이 최대 30cm에 달하는 세계적으로 매우 커다란 박쥐나방이다.
      날개 끝은 악어의 머리처럼 생기게 색칠되어 포식자들을 겁내도록 만든다.
      성충들은 입을 가지고 있지 않으며 전혀 음식물을 섭취하지 않고 며칠 동안만 살아간다.
      남동쪽 아시아 열대 우림지역 출신이다."}
  insect.bedbug:
    label: 흡혈벌레
    summary: 밤 동안 피를 마시며 가구 갈라진 부분 속에서 숨기는 평평한 기생충
    info: 가정 벌레는 주로 밤에 활동하는 흡혈 골조류이며 잠든 숙주에게 물린다. 매트리스와 가구의 귀퉁이 그리고 태피스트리를 뒷받침하여 숨기게 된다. 지난 수십 년간 국제 여행으로 인해 전 세계적으로 확산되고 있다.
  insect.bee:
    label: 벌
    summary: 황갈색 곤충으로 꽃가루를 옮기고 꿀을 만든다.
    info: 아피스 멜리페라(Apis mellifera)는 벌집에서 사는 사회적 곤충이며 달콤한 꿀을 생산한다. 이들은 화학물질인 포르말린과 같은 자극성 물질로 방어하며, 식물의 수분에 중요한 역할을 한다.
  insect.beetle:
    label: 벼룩
    summary: 벼룩은 현재 알려진 벌레들 가운데 40만 이상의 다양한 종류로 이루어지는 가장 큰 목이다.
    info: 개미핥기는 곤충 중 가장 많은 종을 차지하는 코레오테라(鞘翅목)에 속하며 전체 기술된 과학적 개체의 약 40%를 구성한다. 이들은 단단한 날갯죽지를 가진 특징이 있으며 그 아래에는 실제 비행용 날개가 숨겨져 있다. 유럽에서 최대 크기인 사슴벌레는 수컷에게서 거대하고 뿔 모양의 입으로 구별된다. 열대 지방부터 극북 지역까지 거의 모든 환경에서 서식한다.
  insect.bombardier_beetle:
    label: 포탄 쥐나무
    summary: 끓고 있는 톡신성 혼합물을 방어 수단으로 분출하는 베짱이다.
    info: 포탄 쥐나무는 브라키니누스 아과에 속하는 곤충으로 독특한 방어 방법을 가지고 있습니다. 꼬리 부분에서 두 가지 화학 물질이 반응하여 섭씨 100도 이상의 폭발적 반응을 일으킵니다. 매우 유독한 증기가 소리를 내며 초당 최대 500회까지 발사됩니다.
  insect.bumblebee:
    label: 벼룩
    summary: 깊은 윙윙 소리를 내며 중요한 수분자 역할을 하는 풍성한 펨프.
    info: |-
      브อม버스 속에 포함된 큰 털이 있는 곤충인 벌개미는 꿀벌과 관련되어 있다.
      추운 기후에서 특히 중요한 수분 매개체이며, 날아다니지 않는 꿈틀을 보완한다.
      날갯 근육의 진동으로 체온을 올릴 수 있어 추위에도 비행할 수 있으며,
      꿀벌보다 부드럽고 위협받았을 때만 쏘게 된다.
  insect.butterfly:
    label: 나비
    summary: 큰 색이 있는 날개를 가진 비행 곤충.
    info: 나비는 두 쌍의 깃털 모양 날개를 가진 곤충으로, 종종 눈에 띄게 색이 침착합니다.
  insect.caterpillar:
    label: 유충
    summary: 나비 또는 모기의 래브라; 잔디와 같은 식물을 섭취하고 결절화할 수 있도록 준비하는 단계.
    info: 벌레의 유충은 나비나 모기의 라르바이며 주로 잎을 먹으며 생활하며 에너지를 축적하여 변태를 준비한다. 일부 벌레들은 독성이 있음을 경고하기 위해 눈에 잘 보이는 색상을 가지고 있다. 쿠쿨리스(크라이살리드) 안에서 완전한 변화인 대사변태(metamorphosis)가 일어난다.
  insect.centipede:
    label: 蚰蜒
    summary: 체절당 하나씩 다리를 가지며 몇 개의 다리로 구성된 동물
    info: |-
      蚰蜒는 체절마다 한 쌍의 다리를 가진 흥분류(Chilipoda)에 속하며 이름에서 암시되는 것처럼 100개가 아니라 더 적은 수의 다리만 가지고 있습니다.
      이들은 빠른 포식자로서 곤충과 지렁이 및 작은 척추동물을 사냥합니다.
      첫 번째 다리는 마비시키기 위한 독액 주사용 발톱으로 변형되어 있습니다.
      일부 열대 종에서는 길이가 30cm 이상까지 자랍니다.
  insect.cicada:
    label: 시카다
    summary: 여름철 고막 같은 용량으로 노래하는 것으로 알려진 곤충
    info: '{"hint":"소리 나는 곤충; 수컷은 시끄러운 소리를 낸다","info":"시카다는 여름날 가장 큰 소음을 내는 과의 벌레이다\.\n수컷들은 뒷부분에 있는 특별한 부위를 이용해 암컷을 유혹하는 소리를 만든다\.\n미국 일부 종류에는 일곱이나 열세 년 주기로 발달한다\.\n유충(니مف)은 몇 해 동안 지하에서 살며 식물 줄기를 먹이로 산다\.'
  insect.cockroach:
    label: 개미핥기
    summary: 야간 활동하는 고기를 잡아먹거나 머드러운 것을 좋아하는 끈적하고 유연하며 적응 능력이 훌륭하다.
    info: '{"hint":"빠른 야행성 포식 곤충(등가리목)","info":"개미핥기는 세계에서 가장 강한 곤충 중 하나로 방사선이나 다른 동물들을 죽일 수 있는 극단적인 조건에서도 살아남을 수 있다.\n전체 종은 4천 개 이상이지만 인간 주변에 사는 것은 대략 30종뿐이다.\n고대의 곤충으로서 개미핥기들은 공룡보다도 오래 전인 최소 한 산만 년 전부터 존재해 왔다.\n그들의 속력은 시속 5킬로를 넘으며 매우 높게 나타난다."}'
  insect.crane_fly:
    label: 팁울라
    summary: 극장난 다리를 지닌 큰 나방 같은 파리.
    info: 티푸스카는 티풀리다과에 속하는 이족의 곤충으로 거대한 모기와 비슷해 보이지만 물지도 않고 기생하지 않는다. 극단적으로 긴 다리를 가지고 있으며 쉽게 떨어지는 방어 메커니즘(자체절제 현상)을 가진다. 성숙 개체들은 며칠 동안만 생존하며 음식이나 꿀물을 섭취하지 않으며 살아간다.
  insect.cricket:
    label: 크리커
    summary: 수컷이 낯 떨림으로 인해 알려진 박쥐 모양의 과도다.
    info: 야행성의 직립귀류에 속하는 곤충이다. 수컷은 날개를 서로 문질러서 암컷을 유혹하고 영역 표시한다. 아시아에서는 전통적으로 이러한 개미핥기들의 노래 소리를 듣고 집에서 기르기도 한다.
  insect.damselfly:
    label: 드론파리
    summary: 날벌레처럼 보이나 흐린 낯으로 낮게 나는 과거 종류
    info: 등나비의 가까운 친척이지만 더 날렵하고 휴식할 때는 몸과 평행하게 날개를 접습니다. 등나비와 달리 말입니다. 이들은 비상 중에 작은 곤충을 사냥하는 포식자이며 유충은 물속에서 생활하며 수중생태계의 중요한 구성요소로도 작용합니다. 또한 강물 등의 수질 상태 지표가 됩니다.
  insect.diving_beetle:
    label: 잠수충
    summary: 표면 아래로 수영하면서 먹이를 찾아 다니는 포식 성향의 물방석
    info: 대형 잠수충은 수영하는 포식성 물방석으로서 연못과 정체된 물에서 서식한다. 평평한 뒷다리가 노처럼 작동하여 매끄럽게 헤엄을 친다. 표면에 나와 숨 쉬고 낀 속에 공기를 저장하며 파리를 포함해 곤충, 유생 및 작은 어류를 사냥한다.
  insect.dragonfly:
    label: 바이즈카
    summary: 긴 몸과 두 쌍의 투명한 날개를 가진 곤충.
    info: 바이즈카는 수면 근처에서 사냥하는 시력이 뛰어난 포식성 곤충입니다.
  insect.dung_beetle:
    label: 콩나방
    summary: 배설구슬을 굴리는 벌레로 고대 이집트에서 숭앙받았다.
    info: 신성한 콩나방은 스카라바에이데 가족의 곤충으로서 배설물을 구슬 모양으로 만들고 굴려 묻어 알을 낳는다. 고대 이집트에서는 태양과 치프리 신상을 상징했다. 수많은 동물 중 유일하게 은하수를 이용해 방향 감각을 갖춘 생물이다. 영양분 재활용 및 토양 화학적 성질 개선에도 기여한다.
  insect.earwig:
    label: 가시나방
    summary: 꼬리 끝에 핀서를 달고 있는 길쭉한 곤충.
    info: 가시나방은 흔히 가려움증을 유발한다고 알려져 있지만 실제로는 근거 없는 신화입니다.
  insect.firefly:
    label: světluška
    summary: 생물발광 현상을 통해 짝사를 유인하는 벌레.
    info: 점등풍뎅이는 램피리다과에 속하는 곤충으로 꼬리를 이용해 차가운 생체 발광을 할 수 있다. 암수 모두 서로 다른 패턴의 불빛을 내어 상대를 인식하고 유혹한다. 이는 리시핀이 리시라아제와 화학 반응하면서 일어난다. 점등풍뎅이는 깨끗한 자연환경 지표이다.
  insect.flea:
    label: 벼룩
    summary: 포유류 및 새들의 혈액을 먹고 사냥하는 작은 건강에 해롭게 작용하는 기생 동물.
    info: 벼룩은 흡혈 생활을 전문으로 하는 무익의 곤충이며, 강력한 뒷다리로 몸 길이보다 최대 150배까지 점프할 수 있다. 포유류와 조류에게서 피를 마시며 질병도 옮길 수 있으며 역사적으로 검버섯과 같은 병균을 매개했다는 것이 알려져 있고, 벼룩들은 곤충 세계에서 유능한 균형 운동가들이다.
  insect.fly:
    label: 가정 파리
    summary: 쓰레기를 운반하며 전염병이 될 수 있는 집쥐
    info: 집파리(Musca domestica)는 인간 거주지에서 가장 흔한 두 날개 곤충이다. 복합안을 통해 거의 360도를 시야로 확보할 수 있다. 쓰레기와 음식물에 착륙하면서 세균을 옮긴다. 기능하는 날개 한쌍만 가지고 있으며 다른 하나의 낯은 비행 중 균형 유지용으로 사용된다.
  insect.goliath_beetle:
    label: 거저미
    summary: 열대지방 아프리카 출신인 지구상 가장 크고 무거운 곤충들 중 한 종류
    info: 골리아스 거저미는 세계에서 가장 큰 곤충 중 하나로 수컷은 무게가 최대 약 100그램이며 길이는 11cm 이상입니다. 이들은 열대 우림이 있는 아프리카 적도 지역에 서식하며 성체 개체는 주변의 과일과 나무 즙액을 먹습니다. 일부 어린 아이들이 이러한 골리아스를 장난감으로 키우기도 하며 수집가들에게 판매되기도 합니다.
  insect.grasshopper:
    label: grasshopper
    summary: '"긴 후반지를 가지며 씀씀이는 도약곤충이다."'
    info: |-
      {"hint":"점프하는 곤충으로 긴 뒷다리가 있는 것(직각형목)","info":"개미핥기는 강한 다리를 가진 직각형목의 과에 속하며 몸길이의 스무 배까지 점프할 수 있다.
      수컷은 날갯짓과 허벅지 마찰로 특징적인 소음을 내는 stridulation 을 한다.
      식물성 식성을 가지고 있으며 큰 무리는 작물을 파괴시킬 수 있다","label":"grasshopper","summary":"긴 후반지를 가지며 씨름을 하는 도약곤충."}
  insect.ground_beetle:
    label: strrevlik
    summary: 바위나 잎 아래에서 살아가는 빠른 속도로 다니며 머리 씨앗 따먹으려는 구더기 모방하는 개미핥기.
    info: 스트레브ليك은 카라비다과의 곤충입니다. 대부분 활발한 야행성 포식자로서 다른 벌레와 지렁이 및 달팽이를 사냥합니다. 그들은 빠르게 움직이며 위험으로부터 즉시 도망갑니다. 보라색 스트레블릭 같은 일부 종류는 아름답고 금속적인 광택을 가지고 있습니다. 이들은 건강하고 자연스러운 토양 상태에 대한 생물지표종 역할도 합니다.
  insect.hornet:
    label: 오르셰니
    summary: 독한 침과 시끄러운 윙윙거림으로 알려진 최대 크기의 유럽 벌.
    info: 오르셰니 오브첸아는 유럽에서 가장 큰 사회성 벌로 길이가 약 3.5cm에 달한다. 나무의 구멍이나 지붕 위에 종이는 둥지를 만든다. 그들의 독침은 일반적인 파리벌보다 더 깁고 아프지만 직접적으로 위협을 느낄 때만 공격한다고 한다. 이들은 다른 곤충들을 중요한 포식자이다.
  insect.hoverfly:
    label: 페스트렌카
    summary: 여蜂 및 여왕벌의 외형을 닮았지만 실제 찢지는 않는 파리이며 정원에서 중요한 황금미르 역할도 수행합니다.
    info: 벌과 모기의 색상을 흉내 내어 포식자로부터 자신을 보호하는 두 날개 곤충이다(바테즈 밀크라). 하지만 실제로는 쏘지 않는다. 이들은 꽃가루와 수분에 의한 중요한 암수 교배를 돕으며, 벌보다 더 많은 식물 종류를 방문한다. 성체 개체는 주로 농축된 즙이나 가시꽃에서 영양소를 얻고 있으며 일부 유아종은 진딧물을 잡아먹기도 한다.
  insect.lacewing:
    label: goldspot
    summary: 투명하게 주름난 날개를 가지며 유충들이 진딧물을 잡아먹습니다.
    info: 금눈벌레는 투명하고 네트 모양의 주름이 있는 날개와 금색 눈을 가진 과에 속하는 벌레입니다. 유충은 포식자이며 거미나 진딧물을 많이 먹어 자연적인 식물 보호자가 됩니다. 성체들은 꿀과 수분으로 생활하며 빛에 끌리며 건강한 환경 지표가 되기도 합니다.
  insect.ladybug:
    label: 버러스카
    summary: 작고 둥근 붉은빛을 가진 검은 점이 있는 곤충.
    info: 버러스카는 작은 나방을 먹으며 정원에서 유용한 곤충이다.
  insect.locust:
    label: 이동개미
    summary: 수많은 개체로 구성된 파괴적인 대규모 군집을 이루며 움직이는 곤충.
    info: 이동하는 개미하나는 특정 조건에서 거대한 이주 무리를 형성한다. 한 무리는 수십억 마리의 개체를 포함할 수 있으며 하루 안에 천 헥타르 이상을 파괴시킬 수 있다.
  insect.louse:
    label: 귀주
    summary: 소형 비날개 포피터라목 과에서 오래 살아가는 작은 기생곤충.
    info: 진드기는 주인의 피부와 털 또는 머리카락에 사는 무익한 기생 곤충입니다. 피를 빨아들여 가려움을 유발합니다. 어린이 진드기(머릿속 진드기)는 전 세계적으로 널리 분포되어 있으며 위생 상태와 관계없이 아이들을 감염시킵니다. 역사상으로도 이 귀주는 천연두 및 기타 질병 등을 옮겼습니다.
  insect.mayfly:
    label: 기생충
    summary: 가장 짧은 생애를 가진 과정 중 하나로서 몇시간 또는 며칠만 지낸다.
    info: 이들은 기생충류(Ephemeroptera)에 속하는 곤충으로 일시성의 상징이며 성체는 수 시간에서 하루까지밖에 살지 않는다. 어른 개체에는 먹을 만한 구강기관도 없으며 전혀 섭식하지 않다. 유어(나무늘보 모양 냉혈동물) 형태로 물속에서는 약 한 해에서 세 년 동안 산다.
  insect.mosquito:
    label: 벼룩
    summary: 두 날개를 지닌 벼락이며, 암컷이 혈액을 흡수하고 병균도 전염할 수 있음.
    info: 모기는 두 날개를 가진 곤충으로, 쿨리시다에 속한다. 암컷은 단백질을 얻기 위해 동물의 피를 빸으며 수컷은 꽃가루로 생활한다. 모기는 말라リア나 덩어열병과 같은 위험한 질환들을 옮길 수도 있다.
  insect.moth:
    label: moth
    summary: 밤 활동하는 나방과 치밀한 관계이며 꼬리가 깔끔하게 생겼고 눈부신 조명 아래서 비행한다.
    info: |-
      모라(moths)는 낮에 나는 나비와 관련된 밤나방(Lepidoptera), 이들은 휴식 시 날개를 옆으로 접은 반면 낮의 모기는 그렇지 않다.
      많은 종이 인공광을 끌어당긴다.
      housena는 자연 실타래 생산자이다.
      lunar moth(달빛 모라)는 세계에서 가장 아름답다고 여겨지는 모라이기도 하다.
  insect.praying_mantis:
    label: 쿠들랑카
    summary: 기도하듯 보이는 자세와 번개 같은 공격력을 가진 포식 성향의 과일곤충
    info: 신이 기도하는 것처럼 전지가 마치 합쳐진 듯한 자세를 하고 있는 맨타데아에 속해 있으며 포식성 곤충이다. 이름은 앞다리를 모달 때의 모습에서 유래했다. 사냥에서는 빠른 반응으로 몇 초 안에 먹잇감을 잡는 것으로 알려져 있다.
  insect.robber_fly:
    label: 스트레이하트카
    summary: 공중에서 직접 다른 과정들을 붙잡아 죽이는 포식적인 모기는 스เตร히트카입니다.
    info: 스테레차트카는 아실리다과에 속하는 두 날개를 가진 포식 곤충으로 공중에서 다른 곤충을 사냥합니다. 먹이 잡기 위해 강한 다리를 가지고 있으며 마비 독소 주입용의 뾰족한 구조도 있습니다. 일부 종은 예로부터 보호하기 위해서 벌이나 파리와 비슷하게 생겼습니다.
  insect.scorpion:
    label: 蝎
    summary: 핀처와 굴곡난 독성 꼬리로 알려져 있는 유독성을 지닌 거피류.
    info: 蝎은 거미류(곤충이 아님), 특징적인 핀chers와 구부러진 끝에 독침을 가진 꼬리를 가지고 있습니다. 이 동물들은 매우 오래된 종으로서 가장 고대의 화석화 된 설탈류는 약 4억 3천만 년 전입니다. 어둠 속에서 자외선 아래 발광합니다. 대략 2,500개종 중 인간에게 위험한 것은 단지 약 25가지만 됩니다.
  insect.silverfish:
    label: '"리벤카"'
    summary: '"집 안 도서나 문서 근처에서 흔히 볼 수 있는 낯빛 없으며 활발한 작은 곤충"'
    info: '{"hint":"날지 않는 빠른 곤충(Leptisima saccharina), 주로 실내에서 발견됨","info":"리벤카는 집안에 사는 원시적인 날팁 없는 과(Zygoptera)의 곡물이다.\n전분과 종이와 책 접착제 그리고 섬유질을 머금고 산다.\n그 이름은 은색 색상과 물고기처럼 웅크리는 동작 때문에 유래되었다.\n이는 수천만 년 전부터 거의 변함없이 존재해온 가장 오랜 역사를 지닌 벨레다 중 하나이다."}'
  insect.spider:
    label: spider
    summary: 팔발 곤충인 거미는 벌레 사냥용 격자를 만드는데 사용된다.
    info: |-
      거미는 거미목에 속하는 패리포다(곤충이 아님), 다리를 여덟 개 가지고 있으며 몸은 두 부분으로 나뉜다.
      그들은 먹이나 알을 감싸기 위해 실타래를 생산하고 그물망을 짠다.
      세계에는 약 4만 8천 종의 거미가 존재한다.
      모든 종류는 독소를 생성하지만 대부분 사람에게 무해하다.
  insect.stag_beetle:
    label: 뿔벌레
    summary: 유럽에서 제일 커다란 벼룩이며 수컷에게서 특징적인 손톱 같은 침.
    info: 루카누스 세르바우스는 길이가 최대 약 7cm에 달하는 유럽에서 가장 큰 곤충이다. 수컷은 암컷을 둘러싼 싸움에서 사용되는 거대한 송곳니 모양의 쌍颚를 가지고 있다. 번데기는 버려진 단풍나무 목재 안에서 최장 7년 동안 살며 균류로 생존한다.
  insect.stick_insect:
    label: страшилка
    summary: 가지를 또는 나뭇잎처럼 정교히 사본하는 과정.
    info: 스트라시르카는 파스마토데아 그룹에 속한 곤충으로 미미크리의 달인입니다. 몸은 가지나 잎을 완벽하게 모방합니다. 위협받으면 전혀 움직이지 않습니다. 일부 종들은 수컷 없이 무성생식으로 번식하며, 관찰용 애완동물로 인기가 있습니다.
  insect.termite:
    label: 螱
    summary: 흙벽돌로 거대한 벙커를 짓는 사회적인 과밀 생활 하는 곡물 머리 기생충.
    info: |-
      螱은 등각목(Isopter)에 속하는 사회적 곤충으로 개미와 원거리 친족 관계이다.
      군집 형태로 살며 왕과 여왕, 병정 및 일꾼이 존재한다.
      복잡한 빌딩을 건설하며 열대 지방에서는 최고 약 9 미터까지 자라나 환기 시스템도 갖추어져 있다.
  insect.tiger_beetle:
    label: 포신
    summary: 아주 강렬하게 반짝이는 왜곡된 체질로 인하여 잘 알려져 있고 매우 민첩하고 정확한 시각을 자랑하는 벌레.
    info: 폴니크는 빠른 속도와 비행 능력 그리고 예리한 시력을 가진 포식성 곤충입니다. 너무나 빨라서 자신의 눈으로 따라가지 못해 멎어 서 있어야 방향을 다시 잡습니다. 녹색과 파랑 및 붉은 색의 아름다운 길이 있는 몸체를 가지고 있으며 큰 두 개의 안구를 지닙니다. 유충들은 흙속에서 수직형 동굴들을 만들고 구멍 밖에 숨어서 먹잇감을 기다립니다.
  insect.velvet_ant:
    label: 갈털벌
    summary: 붉은 또는 주홍빛의 눈에 띠는 솜털이 있는 쥐장난 크기와 비슷한 형태를 지닌 꿀범으로서, 이들은 곤충 중 가장 강력하고 유명한 독침을 소유합니다.
    info: 모피처럼 보이는 갈색 털을 가진 무익 암컷 벌(Mutillidae과)입니다.
  insect.wasp:
    label: 벌
    summary: 종이로 만든 둥지를 짓는 노란색과 흰색을 지닌 찔끔 벼락곤충.
    info: 황색과 검정 색상의 경고 표시를 가진 Vespa 속에 속한 찌르는 곤충입니다.
  insect.water_strider:
    label: 바다거리
    summary: 표면 장력 덕분에 흐르지 않는 물에서 움직일 수 있는 과도한 형태로 생긴 작은 벌레.
    info: 바다거리는 물방울 모양의 다리에 수직을 유지하는 능력으로 인해 표면장력을 이용하여 바닥이 아닌 물 위를 걷는 곤충입니다.
  insect.weevil:
    label: 노샷
    summary: 특색 있는 날카로운 입喙을 가진 작고 짧게 생긴 벌레입니다.
    info: 노샛은 세계에서 가장 큰 동물 계열인 커큐리오니다과의 작은 곤충으로서 약 6만 종 이상이 존재합니다. 특징적인 긴 코(로스트럼)는 열매와 나무 줄기에 구멍을 뚫기 위해 사용됩니다. 일부종들은 예를 들어 멕시코 옥수수가루벌레처럼 중요한 농업 해충이며 다른 몇몇 종류는 특정한 식물을 전문적으로 먹습니다.
  insect.whirligig_beetle:
    label: 휘르니크
    summary: 물 위로 작은 벌레들이 모여서 회전하면서 움직인다.
    info: 휘르니크는 물 표면에서 무리를 지어 돌며 사냥하고 포식자로부터 자신을 보호하는 가족의 수생 곤충이다. 그들의 눈은 두 부분으로 나뉘는데 하나는 공기 중 시야를 제공하며 다른 하나는 물 속에 있는 것을 볼 수 있도록 해준다.
