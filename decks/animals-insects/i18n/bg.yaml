lang: bg
pivot: false
title: Насекоми
cards:
  insect.butterfly:
    label: пеперуда
    summary: Летящо насекомо с големи цветни крила.
    info: Пеперудата е насекомо с два чифта крила, покрити с люспи, често с ярки цветове.
  insect.bee:
    label: пчела
    summary: Жълто-черно насекомо, което опрашва цветята и произвежда мед.
    info: Медоносната пчела е социално насекомо, което живее в кошери и събира нектар.
  insect.ladybug:
    label: калинка
    summary: Малко кръгло червено бръмбарче с черни точки.
    info: Калинката е малък бръмбар, който се храни с листни въшки и е полезен в градината.
  insect.dragonfly:
    label: водно конче
    summary: Насекомо с дълго тяло и два чифта прозрачни крила.
    info: Водното конче е хищник с отлично зрение, който лови край водната повърхност.
  insect.ant:
    label: мравка
    summary: Малко социално насекомо, което живее в колонии.
    info: Мравката е насекомо, което образува големи колонии с разделение на труда.
  insect.beetle:
    label: бръмбар
    summary: Бръмбарите образуват най-големия разред насекоми, с над 400 000 описани вида.
    info: |
      Бръмбарът принадлежи към разред Coleoptera и съставлява около 40% от всички описани видове насекоми.
      Разпознава се по твърдите надкрилия (елитри), които скриват истинските летателни крила.
      Еленовият рогач е най-големият бръмбар в Европа; мъжкият има мощни челюсти, наподобяващи рога.
      Бръмбарите живеят в почти всички среди, от тропиците до арктическите области.
  insect.grasshopper:
    label: скакалец
    summary: Скачащо насекомо с дълги задни крака и стържещ звук.
    info: |
      Скакалецът е насекомо от разред Orthoptera с мощни задни крака, които позволяват скокове до двайсет пъти по-дълги от тялото.
      Мъжките издават характерен звук (стридулация), като търкат краката си о крилата.
      Храни се с растения и на големи ята може да унищожи посевите.
  insect.cricket:
    label: щурец
    summary: Нощно насекомо, известно със свиренето на мъжките.
    info: |
      Полският щурец е нощно насекомо от разред Orthoptera.
      Мъжките свирят, като търкат крилата си едно о друго, за да привлекат женските и да отбележат територията си.
      В Азия щурците отдавна се държат като домашни любимци заради песента им.
      В много култури те са и символ на домашния уют и късмета.
  insect.mosquito:
    label: комар
    summary: Двукрило насекомо; женската смуче кръв и може да пренася болести.
    info: |
      Комарът е двукрило насекомо от семейство Culicidae.
      Женските смучат кръвта на животните, за да получат белтъчините, нужни за развитието на яйцата; мъжките се хранят с нектар.
      Комарите пренасят опасни болести като малария, треска денга и зика.
      В света съществуват над 3500 вида комари.
  insect.fly:
    label: муха
    summary: Много разпространено двукрило насекомо, което може да пренася бактерии.
    info: |
      Домашната муха е най-разпространеното двукрило насекомо в човешките жилища.
      Сложните ѝ очи ѝ позволяват да вижда почти 360 градуса около себе си.
      Пренася бактерии, защото каца както върху отпадъци, така и върху храна.
      Има само един чифт работещи крила; вторият чифт (халтери) помага да пази равновесие по време на полет.
  insect.moth:
    label: нощна пеперуда
    summary: Нощен роднина на пеперудата; лети към светлината и има перести антени.
    info: |
      Нощните пеперуди са нощни люспокрили, които, за разлика от дневните, в покой държат крилата си сгънати покрай тялото.
      Много видове се привличат от изкуствената светлина.
      Естествената коприна дължим на гъсениците на копринената пеперуда.
      Лунната пеперуда (луна) е една от най-красивите нощни пеперуди в света.
  insect.caterpillar:
    label: гъсеница
    summary: Ларва на пеперуда; яде листа и се подготвя за какавидиране.
    info: |
      Гъсеницата е ларвният стадий на пеперудата и прекарва живота си главно в ядене на листа, за да натрупа енергия за преобразяването.
      Някои гъсеници имат ярки цветове, които предупреждават хищниците, че са отровни.
      При какавидирането образува какавида (пашкул), в която протича пълното преобразяване (метаморфоза) във възрастно насекомо.
  insect.praying_mantis:
    label: богомолка
    summary: Хищно насекомо с молитвена поза и светкавична атака.
    info: |
      Богомолката е хищно насекомо от групата Mantodea.
      Дължи името си на позата, в която държи предните си крака сгънати като за молитва.
      Тя е майстор на лова; напада и хваща плячката за части от секундата.
      Женската понякога изяжда мъжкия след чифтосването, макар това да не се случва винаги.
  insect.stick_insect:
    label: пръчковидно насекомо
    summary: Насекомо, което перфектно имитира клонка или лист.
    info: |
      Пръчковидното насекомо принадлежи към групата Phasmatodea и е майстор на маскировката; тялото му перфектно имитира клонки или листа.
      При опасност остава напълно неподвижно.
      Някои видове се размножават чрез партеногенеза, тоест без мъжки.
      Те са популярни екзотични домашни любимци заради лесната грижа.
  insect.firefly:
    label: светулка
    summary: Бръмбар, който свети с биолуминесцентна светлина, за да привлече партньор.
    info: |
      Светулката е бръмбар от семейство Lampyridae, който може да произвежда студена светлина (биолуминесценция) в коремчето.
      Мъжките и женските светят с различни модели, за да се разпознават и привличат.
      Светлината се управлява от химичната реакция на луциферин с луцифераза.
      Светулките са показател за чиста околна среда.
  insect.wasp:
    label: оса
    summary: Жълто-черно жилещо насекомо, което строи хартиени гнезда.
    info: |
      Обикновената оса е жилещо насекомо от групата Vespula с типичните жълто-черни предупредителни цветове.
      Строи хартиени гнезда от сдъвкана дървесна маса.
      За разлика от пчелата, осата може да жили многократно.
      Полезна е като естествен регулатор на вредните насекоми.
  insect.cockroach:
    label: хлебарка
    summary: Бързо, нощно, всеядно насекомо; много издръжливо и приспособимо.
    info: |
      Хлебарката е едно от най-издръжливите насекоми в света; преживява радиация и условия, които биха убили други животни.
      Съществуват над 4500 вида, но само около 30 живеят близо до човека.
      Тя е древно насекомо; хлебарките съществуват от над 300 милиона години и са преживели динозаврите.
      Бърза е и може да тича с над 5 км/ч.
  insect.spider:
    label: паяк
    summary: Осмокрак паякообразен, който плете мрежи, за да лови насекоми.
    info: |
      Паякът е паякообразен (не насекомо) от разред Araneae с осем крака и тяло от две части.
      Може да произвежда коприна, с която плете мрежи за лов или обвива пашкули с яйца.
      В света живеят над 48 000 вида паяци.
      Всички видове произвеждат отрова, но огромното мнозинство са безвредни за човека.
  insect.scorpion:
    label: скорпион
    summary: Отровен паякообразен с щипки и извита отровна опашка.
    info: |
      Скорпионът е паякообразен (не насекомо) с типични щипки и извита опашка, завършваща с отровно жило.
      Той е древно животно; най-старите вкаменени скорпиони са на над 430 милиона години.
      На тъмно флуоресцират под ултравиолетова светлина.
      От около 2500 вида само около 25 са опасни за човека.
  insect.centipede:
    label: стоножка
    summary: Стоножка с един чифт крака на всеки телесен сегмент.
    info: |
      Стоножката принадлежи към клас Chilopoda и има един чифт крака на всеки телесен сегмент (не сто крака, както подсказва английското име).
      Тя е бърз хищник, който лови насекоми, червеи и дребни гръбначни.
      Първият чифт крака е преобразуван в отровни нокти, които парализират плячката.
      Някои тропически видове достигат дължина над 30 см.
  insect.flea:
    label: бълха
    summary: Мъничък скачащ паразит, който смуче кръвта на бозайници и птици.
    info: |
      Бълхата е безкрило насекомо от разред Siphonaptera, специализирано за паразитен начин на живот.
      Мощните задни крака позволяват скокове над 150 пъти по-дълги от тялото.
      Смуче кръвта на бозайници и птици и може да пренася болести; исторически бълхите са разнасяли чумата.
      Бълхите са акробатите на света на насекомите.
  insect.termite:
    label: термит
    summary: Социално насекомо, което строи огромни могили от пръст.
    info: |
      Термитът е социално насекомо от групата Isoptera, далечен роднина на хлебарките.
      Живеят в колонии с цар, царица, войници и работници.
      Строят сложни термитници, в тропиците високи до 9 метра, със собствена вентилационна система.
      Като важни разлагачи на дървесина, те играят ключова роля в тропическите екосистеми.
  insect.bumblebee:
    label: земна пчела
    summary: Голяма космата пчела с дълбоко бръмчене; важен опрашител.
    info: |
      Земната пчела е голямо космато насекомо от рода Bombus, сродно на медоносната пчела.
      Тя е важен опрашител, особено в по-студен климат, където пчелите летят по-малко.
      Може да се затопли, като кара летателните си мускули да вибрират, така че лети дори в студ.
      Земните пчели са по-кротки от осите и жилят само при пряка заплаха.
  insect.hornet:
    label: стършел
    summary: Най-голямата оса в Европа с мощно жило и силно бръмчене.
    info: |
      Стършелът е най-голямата социална оса в Европа и достига дължина над 3,5 см.
      Строи хартиени гнезда в хралупи на дървета или под покриви.
      Жилото му е по-дълго, отколкото при осите, а ужилването по-болезнено, но стършелът напада само при пряка заплаха.
      Той е важен хищнически враг на другите насекоми.
  insect.cicada:
    label: цикада
    summary: Насекомо, известно със силното си свирене в горещите дни.
    info: |
      Цикадата е насекомо от надсемейство Cicadoidea, известно с един от най-силните звуци сред всички насекоми.
      Мъжките издават звука с помощта на специални мембрани (тимбали) в коремчето, за да привлекат женските.
      Някои видове в САЩ имат цикли на развитие от седемнайсет или тринайсет години.
      Ларвите живеят с години под земята и се хранят с корени.
  insect.locust:
    label: прелетен скакалец
    summary: Прелетен скакалец, който образува опустошителни ята от милиони.
    info: |
      Прелетният скакалец е вид скакалец, който при определени условия образува огромни прелетни ята.
      Едно ято може да наброява милиарди индивиди и за един ден да унищожи посеви върху хиляди хектари.
      В африканските и азиатските страни скакалците са исторически едно от най-големите земеделски бедствия.
      В Библията те са една от десетте египетски напасти.
  insect.aphid:
    label: листна въшка
    summary: Мъничко смучещо насекомо по стъблата на растенията; произвежда медена роса.
    info: |
      Листните въшки са дребни смучещи насекоми от надсемейство Aphidoidea, които се хранят с растителен сок.
      Произвеждат сладка медена роса, за която мравките се грижат за тях в замяна на защита.
      Размножават се изключително бързо; една-единствена женска може за година да даде начало на стотици милиони потомци.
      Те са важни вредители по земеделските култури.
  insect.earwig:
    label: щипалка
    summary: Удължено насекомо с щипки в края на коремчето.
    info: |
      Щипалката е насекомо от разред Dermaptera, разпознаваемо по щипките (церци) в края на коремчето, които служат за защита и чифтосване.
      Името на английски идва от суеверието, че пълзи в ушите на хората; това е мит.
      Женските щипалки са необичайни, защото се грижат за яйцата и младите ларви, което е рядкост сред насекомите.
      Живеят в пукнатини, под камъни и в постелята от листа.
  insect.silverfish:
    label: сребърна рибка
    summary: Безкрило бързо насекомо, което се среща в домовете при книгите и хартията.
    info: |
      Сребърната рибка е примитивно безкрило насекомо от разред Zygentoma, което живее в жилищата.
      Храни се с нишесте, хартия, книговезко лепило и текстилни влакна.
      Името идва от сребристия ѝ цвят и рибешкото ѝ движение.
      Принадлежи към един от най-старите разреди насекоми и живее почти непроменена от над 300 милиона години.
  insect.water_strider:
    label: водомерка
    summary: Насекомо, което ходи по водната повърхност благодарение на повърхностното напрежение.
    info: |
      Водомерката е насекомо от семейство Gerridae, което може да ходи по водата благодарение на водоотблъскващите власинки по краката и повърхностното напрежение на водата.
      Лови насекоми, паднали във водата, които разпознава по трептенето на повърхността.
      Бърза е и може да се плъзга по водата с над 150 пъти дължината на тялото си в секунда.
  insect.dung_beetle:
    label: торен бръмбар
    summary: Бръмбар, който търкаля топчета от тор, свещен в Древен Египет.
    info: |
      Свещеният скарабей е бръмбар от семейство Scarabaeidae, който оформя тора на топчета и ги търкаля, за да ги зарови и снесе яйца в тях.
      В Древен Египет е бил символ на слънцето и на бог Хепри.
      Той е едно от малкото животни, които се ориентират по Млечния път.
      Помага за кръговрата на хранителните вещества и за проветряването на почвата.
  insect.stag_beetle:
    label: еленов рогач
    summary: Най-големият бръмбар в Европа; мъжкият има челюсти като рога.
    info: |
      Еленовият рогач е най-големият бръмбар в Европа и достига дължина над 7 см.
      Мъжкият има огромни челюсти, наподобяващи рога, използвани в битки за женските.
      Ларвата живее до 7 години в изгнилата дъбова дървесина и се храни с гъби.
      Той е сериозно застрашен от изчезването на старите гори и мъртвата дървесина.
  insect.atlas_moth:
    label: атлас пеперуда
    summary: Една от най-големите нощни пеперуди в света, с крила, украсени с шарка на змия.
    info: |
      Атлас пеперудата е една от най-големите нощни пеперуди в света, с размах на крилата до 30 см.
      Върховете на крилата ѝ са оцветени така, че приличат на змийски глави, което плаши хищниците.
      Възрастните нямат уста и изобщо не се хранят; живеят само няколко дни.
      Произхожда от тропическите гори на Югоизточна Азия.
  insect.weevil:
    label: дългоносик
    summary: Малък бръмбар с характерна удължена муцунка.
    info: |
      Дългоносикът е бръмбар от семейство Curculionidae, най-голямото семейство животни в света, с над 60 000 вида.
      Характерната удължена муцунка (рострум) служи за пробиване на семена, плодове и стъбла.
      Някои видове са сериозни земеделски вредители, като памуковия дългоносик.
      Други видове са специализирани за един-единствен вид растение.
  insect.lacewing:
    label: златоочка
    summary: Нежно насекомо с прозрачно жилковани крила; ларвите ловят листни въшки.
    info: |
      Златоочката е насекомо от семейство Chrysopidae с нежни, прозрачно жилковани крила и златисти очи.
      Ларвите са хищници и поглъщат огромни количества листни въшки, с което стават естествени защитници на растенията.
      Възрастните се хранят с нектар и прашец.
      Привличат се от светлината и са показател за здравословна околна среда.
  insect.crane_fly:
    label: типула
    summary: Голяма муха, наподобяваща комар, с изключително дълги крака.
    info: |
      Типулата е двукрило насекомо от семейство Tipulidae, на вид като гигантски комар, но не жили и не паразитира.
      Изключително дългите ѝ крака лесно се откъсват; това е защитен механизъм (автотомия).
      Възрастните живеят само няколко дни и или не се хранят, или се хранят с нектар.
      Ларвите живеят в почвата и се хранят с корени.
  insect.mayfly:
    label: еднодневка
    summary: Насекомо с най-краткия възрастен живот, който трае само часове до дни.
    info: |
      Еднодневката е насекомо от разред Ephemeroptera и символ на преходността; възрастните живеят само часове до дни.
      Нямат работещи устни органи и изобщо не се хранят.
      Ларвите живеят от 1 до 3 години под водата.
      Масовото роене на еднодневки е завладяваща природна гледка; по Дунав в Унгария това е уникално явление.
  insect.damselfly:
    label: водна девойка
    summary: Стройна родственица на водното конче; в покой сгъва крилата покрай тялото.
    info: |
      Водната девойка е насекомо, сродно на водните кончета, но по-стройно, и в покой сгъва крилата успоредно на тялото, за разлика от големите водни кончета.
      Тя е хищник и лови дребни насекоми в полет.
      Ларвите живеят във водата и са важна част от водните екосистеми.
      Те са показател за качеството на водните течения.
  insect.robber_fly:
    label: хищна муха
    summary: Хищна муха, която хваща други насекоми в пълен полет.
    info: |
      Хищната муха е хищно двукрило насекомо от семейство Asilidae, което хваща други насекоми направо в полет.
      Има силни крака за захващане на плячката и пробождащ хоботек за впръскване на парализираща отрова.
      Някои видове имитират външния вид на земните пчели или осите като защита от хищници.
      Полезна е като естествен регулатор на популациите от насекоми.
  insect.ground_beetle:
    label: бегач
    summary: Бърз хищен бръмбар, който живее под камъни и в постелята от листа.
    info: |
      Бегачът е бръмбар от семейство Carabidae; повечето видове са активни нощни хищници, които ловят други насекоми, червеи и охлюви.
      Те са бързи и бързо бягат от опасност.
      Някои видове, като виолетовия бегач, имат прекрасен метален блясък.
      Те са показатели за здрава почва и природосъобразно земеделие.
  insect.tiger_beetle:
    label: бързобегач
    summary: Бърз бръмбар с метален цвят и отлично зрение.
    info: |
      Бързобегачът е бръмбар от подсемейство Cicindelinae, известен с необичайната си бързина, способност за летене и остро зрение.
      Тича толкова бързо, че трябва да спира и да се преориентира, защото движението е твърде бързо за зрителната му система.
      Има прекрасно оцветени метални тела (зелени, сини, червени) и големи очи.
      Ларвите копаят вертикални тунели в земята и дебнат плячка при входа.
  insect.hoverfly:
    label: сирфидна муха
    summary: Муха, която имитира цветовете на осите и пчелите; опрашител на градините.
    info: |
      Сирфидната муха е двукрило насекомо от семейство Syrphidae, което имитира цветовете на осите и пчелите като защита от хищници (Бейтсова мимикрия), макар да не жили.
      Тя е важен опрашител; посещава повече видове растения от пчелите.
      Възрастните се хранят с нектар и прашец.
      Ларвите на някои видове ловят листни въшки и така помагат в градината.
  insect.whirligig_beetle:
    label: въртящ бръмбар
    summary: Малък бръмбар, който се върти на ята по водната повърхност.
    info: |
      Въртящият бръмбар е воден бръмбар от семейство Gyrinidae, който живее на повърхността, а въртенето на ята му помага да избягва хищници.
      Очите му са разделени на две части; едната вижда над водата, другата под нея.
      Усеща вълничките по повърхността, които сигнализират храна или опасност.
      През деня се върти, през нощта лети.
  insect.louse:
    label: въшка
    summary: Мъничък безкрил паразит, който живее по кожата и в космите на бозайниците.
    info: |
      Въшката е безкрило паразитно насекомо от разред Phthiraptera, което живее по кожата на гостоприемника и в козината или косата му.
      Смуче кръв и предизвиква сърбеж.
      Главовата въшка се среща по целия свят и засяга децата независимо от хигиенните условия.
      Исторически въшките са пренасяли петнист тиф и други болести.
  insect.bedbug:
    label: дървеница
    summary: Плосък паразит, който нощем смуче кръв; крие се в пукнатините на мебелите.
    info: |
      Дървеницата е плоско овално насекомо от семейство Cimicidae, активно главно нощем.
      Хапе и смуче кръвта на спящия гостоприемник.
      Крие се в пукнатините на дюшека, в мебелите и зад тапетите.
      През последните десетилетия се разпространи по целия свят благодарение на международните пътувания.
  insect.antlion:
    label: мравколъв
    summary: Ларва, която копае фуниевидни капани за мравки в пясъка.
    info: |
      Мравколъвът е ларва на насекомо от семейство Myrmeleontidae, която копае конусовидни фунии в сухия пясък.
      Когато мравка се плъзне в капана, мравколъвът я хваща с челюстите си и впръсква храносмилателни сокове.
      Възрастните са невзрачни, приличат на водни кончета и летят нощем.
      Ларвите могат да живеят с години под земята без храна.
  insect.goliath_beetle:
    label: голиатов бръмбар
    summary: Едно от най-големите и най-тежки насекоми в света, от тропическа Африка.
    info: |
      Голиатовият бръмбар е едно от най-големите насекоми в света; мъжките тежат до 100 грама и достигат дължина над 11 см.
      Живее в тропическите дъждовни гори на екваториална Африка.
      Възрастните се хранят с плодове и с дървесен сок.
      В Африка децата понякога ги държат като играчки, а някои се продават на колекционери.
  insect.bombardier_beetle:
    label: бръмбар бомбардировач
    summary: Бръмбар, който за защита изстрелва вряла отровна смес.
    info: |
      Бръмбарът бомбардировач е бръмбар от подсемейство Brachininae, който се защитава по уникален начин; смесва в коремчето две химични вещества, което поражда експлозивна реакция при над 100 градуса.
      Много разяждащата пара се изстрелва с гръмък пукот до 500 пъти в секунда.
      Той е един от най-завладяващите примери за химична защита в природата.
  insect.diving_beetle:
    label: плавунец
    summary: Хищен воден бръмбар, който плува под повърхността.
    info: |
      Обточеният плавунец е хищен воден бръмбар от семейство Dytiscidae, който живее в блата и застояли води.
      Плува ловко благодарение на плоските си задни крака, които действат като весла.
      Диша на повърхността и складира въздух под надкрилията.
      Лови насекоми, ларви, дребни риби и попови лъжички.
  insect.velvet_ant:
    label: кадифена мравка
    summary: Безкрила оранжево-черна оса, която прилича на мравка.
    info: |
      Кадифената мравка всъщност е оса от семейство Mutillidae; женските са безкрили и приличат на мравки.
      Имат натрапващи се червени или оранжеви власинки като предупреждение.
      Женските имат изключително мощно жило с прякор убиец на крави.
      Паразитират в гнездата на земните пчели.
