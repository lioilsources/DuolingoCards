lang: ha
pivot: false
title: Insha'au da Karruwa
cards:
  insect.ant:
    label: ant
    summary: Small social insect living in colonies.
    info: An ant is an insect forming large colonies with division of labor.
  insect.bee:
    label: wace
    summary: Kafin da yake kuka ta gudi matsammanwa da suka hausa.
    info: Wace ya zaiyayya daga Apis mellifera wanda ke nemi nektari don kowanni matsammanwan. Ya bini matsammanwa kuma ya samu hausa.
  insect.butterfly:
    label: motyel
    summary: Haihuwa yake da wace suka zuwa ran ran da kariyar kudun duka.
    info: Moto'elew wani haiwu da mutum mai karfi da zauro ya kamata, don kuma ya farau da ran ran da kariya. Wanci motyel sun ga'awa ran ran da kariyar da ke amfani da labarcen.
  insect.dragonfly:
    label: waziki
    summary: Mai amura da wace gida da duka koma ta yawa da mutum koma.
    info: Waziki ne mai amura da ya farau da amura sai ya canza shi don hanyar ganuwa, ya canza don ranarin biyaye.
  insect.ladybug:
    label: beruška
    summary: Wurukewa duka da kafin yauwa kan Coccinellidae.
    info: Beriška ya biyaye wato da msitu na gari da ke haifar da kusokin zuwa gari.
