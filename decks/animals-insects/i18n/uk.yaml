lang: uk
pivot: false
title: Комахи
cards:
  insect.butterfly:
    label: метелик
    summary: Летюча комаха з великими барвистими крилами.
    info: Метелик — комаха з двома парами лускатих крил, часто яскраво забарвлених.
  insect.bee:
    label: бджола
    summary: Жовто-чорна комаха, що запилює квіти й виробляє мед.
    info: Медоносна бджола — суспільна комаха, що живе у вуликах і збирає нектар.
  insect.ladybug:
    label: сонечко
    summary: Маленький круглий червоний жук із чорними цятками.
    info: Сонечко — крихітний жук, що живиться попелицями й корисний у саду.
  insect.dragonfly:
    label: бабка
    summary: Комаха з довгим тілом і двома парами прозорих крил.
    info: Бабка — хижа комаха з чудовим зором, що полює біля водойм.
  insect.ant:
    label: мураха
    summary: Маленька суспільна комаха, що живе колоніями.
    info: Мураха — комаха, що утворює великі колонії з поділом праці.
  insect.beetle:
    label: жук
    summary: Жуки утворюють найбільший ряд комах — понад 400 000 описаних видів.
    info: |
      Жук належить до ряду твердокрилих (Coleoptera) і становить близько 40 % усіх описаних видів комах.
      Він вирізняється твердими надкрилами (елітрами), під якими сховані справжні льотні крила.
      Жук-олень — найбільший жук Європи; у самця потужні рогоподібні щелепи.
      Вони живуть майже в усіх середовищах — від тропіків до арктичних областей.
  insect.grasshopper:
    label: коник
    summary: Стрибуча комаха з довгими задніми ногами й сюрчанням.
    info: |
      Коник — комаха ряду прямокрилих із потужними задніми ногами, що дозволяють стрибати до двадцяти довжин тіла.
      Самці видають характерний звук (стридуляцію), тручи ноги об крила.
      Живиться рослинами, а у великих зграях може шкодити врожаю.
  insect.cricket:
    label: цвіркун
    summary: Нічна комаха, славетна сюрчанням самців.
    info: |
      Польовий цвіркун — нічна комаха ряду прямокрилих.
      Самці сюрчать, тручи крила одне об одне, щоб привабити самиць і позначити територію.
      В Азії цвіркунів традиційно тримають як улюбленців заради їхнього співу.
      У багатьох культурах вони також символ домашнього затишку й удачі.
  insect.mosquito:
    label: комар
    summary: Двокрила комаха; самиця смокче кров і може переносити хвороби.
    info: |
      Комар — двокрила комаха родини кровосисних комарів.
      Самиці смокчуть кров тварин, щоб отримати білок для розвитку яєць; самці живляться нектаром.
      Комарі переносять небезпечні хвороби — малярію, лихоманку денге й вірус Зіка.
      У світі існує понад 3500 видів комарів.
  insect.fly:
    label: муха
    summary: Звичайна двокрила комаха, здатна переносити бактерії.
    info: |
      Кімнатна муха — найпоширеніша двокрила комаха в людських оселях.
      Фасеткові очі дозволяють їй бачити майже на 360 градусів навколо.
      Вона переносить бактерії, бо сідає і на відходи, і на їжу.
      Вона має лише одну пару функціональних крил; друга пара (дзижчальця) допомагає утримувати рівновагу в польоті.
  insect.moth:
    label: нічний метелик
    summary: Нічний родич метелика; летить на світло й має пірчасті вусики.
    info: |
      Нічні метелики — нічні лускокрилі, які, на відміну від денних метеликів, у спокої складають крила по боках.
      Багато видів приваблюються штучним світлом.
      Натуральним шовком ми завдячуємо гусеницям тутового шовкопряда.
      Сатурнія-місяць — один із найгарніших нічних метеликів світу.
  insect.caterpillar:
    label: гусениця
    summary: Личинка метелика; поїдає листя й готується до заляльковування.
    info: |
      Гусениця — личинка метелика, що проводить життя переважно за поїданням листя, щоб накопичити енергію для перетворення.
      У деяких гусениць яскраве забарвлення, що попереджає хижаків про отруйність.
      Під час заляльковування вона утворює лялечку, у якій відбувається повне перетворення (метаморфоз) на дорослу особину.
  insect.praying_mantis:
    label: богомол
    summary: Хижа комаха з молитовною позою та блискавичним кидком.
    info: |
      Богомол — хижа комаха з групи Mantodea.
      Свою назву він дістав за позу, у якій тримає передні ноги складеними, наче в молитві.
      Це майстер полювання; він завдає удару й хапає здобич за частку секунди.
      Самиця іноді з'їдає самця після парування, хоча це трапляється не завжди.
  insect.stick_insect:
    label: паличник
    summary: Комаха, що досконало імітує гілочку або листок.
    info: |
      Паличник належить до групи паличкоподібних (Phasmatodea) і є майстром маскування; його тіло досконало імітує гілочки або листя.
      За небезпеки він залишається цілком нерухомим.
      Деякі види розмножуються партеногенезом, тобто без самця.
      Це популярні екзотичні улюбленці завдяки простоті утримання.
  insect.firefly:
    label: світлячок
    summary: Жук, що виробляє біолюмінесцентне світло, щоб привабити партнера.
    info: |
      Світлячок — жук родини світляків, здатний виробляти холодне світло (біолюмінесценцію) у черевці.
      Самці й самиці світяться різними візерунками, щоб упізнавати й приваблювати одне одного.
      Це керується хімічною реакцією люциферину з люциферазою.
      Світлячки — показник чистоти довкілля.
  insect.wasp:
    label: оса
    summary: Жовто-чорна жалка комаха, що будує паперові гнізда.
    info: |
      Звичайна оса — жалка комаха з групи Vespula з типовим жовто-чорним попереджувальним забарвленням.
      Вона будує паперові гнізда з пережованої деревної маси.
      На відміну від бджоли, оса може жалити багато разів.
      Вона корисна як природний регулятор комах-шкідників.
  insect.cockroach:
    label: тарган
    summary: Швидка нічна всеїдна комаха; дуже витривала й пристосовна.
    info: |
      Тарган — одна з найвитриваліших комах у світі; він переживає радіацію та умови, що вбили б інших тварин.
      Існує понад 4500 видів, але лише близько 30 живуть поряд із людьми.
      Це давня комаха; таргани існують понад 300 мільйонів років і пережили динозаврів.
      Він швидкий і може бігати зі швидкістю понад 5 км/год.
  insect.spider:
    label: павук
    summary: Восьминога павукоподібна істота, що плете павутину для лову комах.
    info: |
      Павук — павукоподібна істота (не комаха) ряду Araneae з вісьма ногами й тілом із двох частин.
      Він уміє виробляти шовк, з якого плете павутину для полювання або для обгортання коконів із яйцями.
      У світі мешкає понад 48 000 видів павуків.
      Усі види виробляють отруту, але переважна більшість нешкідлива для людини.
  insect.scorpion:
    label: скорпіон
    summary: Отруйна павукоподібна істота з клешнями та вигнутим отруйним хвостом.
    info: |
      Скорпіон — павукоподібна істота (не комаха) з типовими клешнями та вигнутим хвостом, що закінчується отруйним жалом.
      Це давня тварина; найдавніші викопні скорпіони старші за 430 мільйонів років.
      У темряві вони флуоресціюють під ультрафіолетовим світлом.
      З приблизно 2500 видів лише близько 25 небезпечні для людини.
  insect.centipede:
    label: стонога
    summary: Багатоніжка з однією парою ніг на кожному сегменті тіла.
    info: |
      Стонога належить до класу губоногих (Chilopoda) і має по одній парі ніг на кожному сегменті тіла (а не 100 ніг, як підказує назва).
      Це швидкий хижак, що полює на комах, черв'яків і дрібних хребетних.
      Перша пара ніг перетворена на отруйні кігті для паралізації здобичі.
      Деякі тропічні види виростають довшими за 30 см.
  insect.flea:
    label: блоха
    summary: Крихітний стрибучий паразит, що смокче кров ссавців і птахів.
    info: |
      Блоха — безкрила комаха ряду бліх (Siphonaptera), пристосована до паразитичного способу життя.
      Її сильні задні ноги дозволяють стрибати понад 150 довжин тіла.
      Вона смокче кров ссавців і птахів і може переносити хвороби; історично блохи розносили чуму.
      Блохи — видатні акробати світу комах.
  insect.termite:
    label: терміт
    summary: Суспільна комаха, що будує величезні земляні пагорби.
    info: |
      Терміт — суспільна комаха з групи Isoptera, віддалено споріднена з тарганами.
      Вони живуть колоніями з царем, царицею, солдатами й робітницями.
      Вони будують складні термітники, у тропіках до 9 метрів заввишки, із системою вентиляції.
      Як основні руйнівники деревини вони відіграють ключову роль у тропічних екосистемах.
  insect.bumblebee:
    label: джміль
    summary: Велика волохата бджола з низьким гудінням; важливий запилювач.
    info: |
      Джміль — велика волохата комаха роду Bombus, споріднена з медоносною бджолою.
      Це важливий запилювач, особливо в холоднішому кліматі, де бджоли літають менше.
      Він уміє зігріватися, вібруючи льотними м'язами, тож літає навіть у холодну погоду.
      Джмелі лагідніші за бджіл і жалять лише за прямої загрози.
  insect.hornet:
    label: шершень
    summary: Найбільша оса Європи з потужним жалом і гучним гудінням.
    info: |
      Шершень — найбільша суспільна оса Європи, виростає понад 3,5 см завдовжки.
      Він будує паперові гнізда в дуплах дерев або під дахами.
      Його жало довше, ніж в ос, і укус болючіший, але шершень нападає лише за прямої загрози.
      Це важливий хижак інших комах.
  insect.cicada:
    label: цикада
    summary: Комаха, славетна гучним сюрчанням у спекотні дні.
    info: |
      Цикада — комаха надродини Cicadoidea, славетна одним із найгучніших звуків серед усіх комах.
      Самці видають звук особливими мембранами (тимбалами) у черевці, щоб привабити самиць.
      Деякі види в США мають сімнадцяти- або тринадцятирічні цикли розвитку.
      Німфи роками живуть під землею, живлячись корінням.
  insect.locust:
    label: перелітна сарана
    summary: Перелітна сарана, що утворює руйнівні зграї з мільйонів особин.
    info: |
      Перелітна сарана — вид сарани, що за певних умов утворює гігантські мігруючі зграї.
      Зграя може налічувати мільярди особин і знищити цілі посіви на тисячах гектарів за день.
      У країнах Африки й Азії сарана історично — одне з найбільших сільськогосподарських лих.
      У Біблії вона — одна з десяти єгипетських кар.
  insect.aphid:
    label: попелиця
    summary: Крихітна сисна комаха на стеблах рослин; виробляє падь.
    info: |
      Попелиці — дрібні сисні комахи надродини Aphidoidea, що живляться соком рослин.
      Вони виробляють солодку падь, за якою доглядають мурахи в обмін на захист.
      Вони розмножуються надзвичайно швидко; одна самиця може дати за рік сотні мільйонів нащадків.
      Це важливі шкідники сільськогосподарських культур.
  insect.earwig:
    label: вуховертка
    summary: Видовжена комаха з кліщами на кінці черевця.
    info: |
      Вуховертка — комаха ряду шкірястокрилих (Dermaptera), що вирізняється кліщами (церками) на кінці черевця, які слугують для захисту й парування.
      Назва походить від повір'я, ніби вона залазить людям у вуха; це міф.
      Самиці вуховерток винятково піклуються про яйця та молодих личинок, що рідкість серед комах.
      Вони живуть у щілинах, під камінням і в опалому листі.
  insect.silverfish:
    label: лусочниця
    summary: Безкрила швидка комаха, що трапляється в оселях біля книжок і паперу.
    info: |
      Лусочниця — примітивна безкрила комаха ряду Zygentoma, що живе в помешканнях.
      Вона живиться крохмалем, папером, палітурним клеєм і текстильними волокнами.
      Назва походить від її сріблястого забарвлення й рибоподібного руху.
      Це один із найдавніших рядів комах, що живе майже незмінним понад 300 мільйонів років.
  insect.water_strider:
    label: водомірка
    summary: Комаха, що ходить по поверхні води завдяки поверхневому натягу.
    info: |
      Водомірка — комаха родини Gerridae, здатна ходити по воді завдяки гідрофобним волоскам на ногах і поверхневому натягу води.
      Вона полює на комах, що впали у воду, яких визначає за коливаннями поверхні.
      Вона швидка й може ковзати по воді зі швидкістю понад 150 довжин тіла за секунду.
  insect.dung_beetle:
    label: жук-гнойовик
    summary: Жук, що котить кульки гною, священний у Стародавньому Єгипті.
    info: |
      Священний скарабей — жук родини пластинчастовусих, що формує гній у кульки й котить їх, щоб закопати й відкласти яйця.
      У Стародавньому Єгипті він був символом сонця й бога Хепрі.
      Це одна з небагатьох тварин, що орієнтуються за Чумацьким Шляхом.
      Він допомагає переробляти поживні речовини й розпушувати ґрунт.
  insect.stag_beetle:
    label: жук-олень
    summary: Найбільший жук Європи; у самця рогоподібні щелепи.
    info: |
      Жук-олень — найбільший жук Європи, виростає понад 7 см завдовжки.
      У самця величезні рогоподібні щелепи, що використовуються в боях за самиць.
      Личинка живе до 7 років у трухлявій деревині дубів і живиться грибами.
      Він перебуває під критичною загрозою через зникнення старих лісів і мертвої деревини.
  insect.atlas_moth:
    label: сатурнія атлас
    summary: Один із найбільших нічних метеликів світу, з крилами у зміїних візерунках.
    info: |
      Сатурнія атлас — один із найбільших нічних метеликів світу, з розмахом крил до 30 см.
      Кінчики її крил забарвлені так, щоб нагадувати голови змій, що відлякує хижаків.
      У дорослих особин немає рота, і вони зовсім не живляться; вони живуть лише кілька днів.
      Вона походить із тропічних лісів Південно-Східної Азії.
  insect.weevil:
    label: довгоносик
    summary: Маленький жук із характерним видовженим хоботком.
    info: |
      Довгоносик — жук родини Curculionidae, найбільшої родини тварин у світі з понад 60 000 видів.
      Його характерний видовжений хоботок (рострум) слугує для свердління насіння, плодів і стовбурів.
      Деякі види — серйозні сільськогосподарські шкідники, як-от бавовниковий довгоносик.
      Інші види спеціалізовані на одному виді рослин.
  insect.lacewing:
    label: золотоочка
    summary: Ніжна комаха з прозорими жилкуватими крилами; личинки полюють на попелиць.
    info: |
      Золотоочка — комаха родини Chrysopidae з ніжними прозоро-жилкуватими крилами й золотистими очима.
      Личинки — хижаки й поїдають величезну кількість попелиць, стаючи природними захисниками рослин.
      Дорослі особини живляться нектаром і пилком.
      Їх приваблює світло, і вони — показник здорового довкілля.
  insect.crane_fly:
    label: комар-довгоніжка
    summary: Велика схожа на комара муха з надзвичайно довгими ногами.
    info: |
      Комар-довгоніжка — двокрила комаха родини Tipulidae, зовні схожа на гігантського комара, але не кусає й не паразитує.
      Його надзвичайно довгі ноги легко відламуються; це захисний механізм (автотомія).
      Дорослі особини живуть лише кілька днів і не живляться або живляться нектаром.
      Личинки живуть у ґрунті й живляться корінням.
  insect.mayfly:
    label: одноденка
    summary: Комаха з найкоротшим дорослим життям, що живе лише години чи дні.
    info: |
      Одноденка — комаха ряду Ephemeroptera і символ швидкоплинності; дорослі особини живуть лише години чи дні.
      Вони не мають функціональних ротових органів і зовсім не живляться.
      Німфи живуть від 1 до 3 років під водою.
      Масовий літ одноденок — захопливе природне видовище; в Угорщині їхній масовий літ на Дунаї — унікальне явище.
  insect.damselfly:
    label: стрілка
    summary: Струнка родичка бабки; у спокої складає крила вздовж тіла.
    info: |
      Стрілка — комаха, споріднена з бабками, але стрункіша, і в спокої складає крила паралельно тілу, на відміну від великих бабок.
      Це хижак, що полює на дрібних комах у польоті.
      Німфи живуть у воді й є важливою частиною водних екосистем.
      Вони — показник якості водотоків.
  insect.robber_fly:
    label: ктир
    summary: Хижа муха, що ловить інших комах прямо в польоті.
    info: |
      Ктир — хижа двокрила комаха родини Asilidae, що полює на інших комах прямо в польоті.
      Він має сильні ноги, щоб схопити здобич, і хоботок, щоб упорснути паралізуючу отруту.
      Деякі види імітують вигляд джмелів або ос як захист від хижаків.
      Він корисний як природний регулятор популяцій комах.
  insect.ground_beetle:
    label: туруна
    summary: Швидкий хижий жук, що живе під камінням і в листі.
    info: |
      Туруна — жук родини Carabidae; більшість видів — активні нічні хижаки, що полюють на інших комах, черв'яків і слимаків.
      Вони швидкі й стрімко тікають від небезпеки.
      Деякі види, як-от туруна фіолетова, мають чудовий металевий блиск.
      Вони — показники здорового ґрунту й природного землеробства.
  insect.tiger_beetle:
    label: скакун
    summary: Швидкий жук металевого забарвлення з чудовим зором.
    info: |
      Скакун — жук підродини Cicindelinae, славетний надзвичайною швидкістю, здатністю літати й гострим зором.
      Він бігає так швидко, що мусить зупинятися й наново орієнтуватися, бо рух заскорий для його зорової системи.
      Він має чудово забарвлені металеві тіла (зелені, сині, червоні) і великі очі.
      Личинки риють вертикальні тунелі в землі й підстерігають здобич біля отвору.
  insect.hoverfly:
    label: дзюрчалка
    summary: Муха, що імітує забарвлення ос і бджіл, запилювач садів.
    info: |
      Дзюрчалка — двокрила комаха родини Syrphidae, що імітує забарвлення ос і бджіл як захист від хижаків (бейтсівська мімікрія), хоча й не жалить.
      Це важливий запилювач; вона відвідує більше видів рослин, ніж бджоли.
      Дорослі особини живляться нектаром і пилком.
      Личинки деяких видів полюють на попелиць, допомагаючи тим самим у садах.
  insect.whirligig_beetle:
    label: вертячка
    summary: Маленький жук, що кружляє зграями по поверхні води.
    info: |
      Вертячка — водяний жук родини Gyrinidae, що живе на поверхні, і кружляння зграями допомагає йому уникати хижаків.
      Його очі розділені на дві частини; одна бачить над водою, інша під водою.
      Він уловлює брижі на поверхні, що сигналізують про їжу або небезпеку.
      Удень він кружляє, уночі літає.
  insect.louse:
    label: воша
    summary: Крихітний безкрилий паразит, що живе на шкірі й волоссі ссавців.
    info: |
      Воша — безкрила паразитична комаха ряду Phthiraptera, що живе на шкірі й у шерсті або волоссі хазяїв.
      Вона смокче кров і спричиняє свербіж.
      Головна воша поширена в усьому світі й уражає дітей незалежно від умов гігієни.
      Історично воші переносили тиф та інші хвороби.
  insect.bedbug:
    label: постільний клоп
    summary: Плоский паразит, що смокче кров уночі; ховається в щілинах меблів.
    info: |
      Постільний клоп — плоска овальна комаха родини Cimicidae, активна передусім уночі.
      Він кусає й смокче кров сплячого хазяїна.
      Він ховається в щілинах матраца, меблів і за шпалерами.
      В останні десятиліття він поширився по всьому світу завдяки міжнародним подорожам.
  insect.antlion:
    label: мурашиний лев
    summary: Личинка, що риє в піску лійкоподібні пастки для мурах.
    info: |
      Мурашиний лев — личинка комахи родини Myrmeleontidae, що риє конічні лійки в сухому піску.
      Коли мураха зісковзує в пастку, мурашиний лев хапає її щелепами й упорскує травні соки.
      Дорослі особини непримітні, схожі на бабок, і літають уночі.
      Личинки можуть роками жити під землею без їжі.
  insect.goliath_beetle:
    label: жук-голіаф
    summary: Одна з найбільших і найважчих комах світу, з тропічної Африки.
    info: |
      Жук-голіаф — одна з найбільших комах світу; самці важать до 100 грамів і сягають понад 11 см завдовжки.
      Він живе в тропічних дощових лісах екваторіальної Африки.
      Дорослі особини живляться фруктами й деревним соком.
      В Африці діти іноді тримають їх як іграшки, і їх продають колекціонерам.
  insect.bombardier_beetle:
    label: жук-бомбардир
    summary: Жук, що вистрілює киплячу отруйну суміш як захист.
    info: |
      Жук-бомбардир — жук підродини Brachininae, що захищається унікальним способом; він змішує дві хімічні речовини в черевці, спричиняючи вибухову реакцію з температурою понад 100 градусів.
      Високотоксична пара вистрілюється з гучним ляском до 500 разів на секунду.
      Це один із найдивовижніших прикладів хімічного захисту в природі.
  insect.diving_beetle:
    label: плавунець
    summary: Хижий водяний жук, що плаває під поверхнею.
    info: |
      Плавунець облямований — хижий водяний жук родини Dytiscidae, що живе у ставках і стоячих водах.
      Він плавно плаває завдяки плоским заднім ногам, що працюють як весла.
      Він дихає на поверхні й зберігає повітря під надкрилами.
      Він полює на комах, личинок, дрібних риб і пуголовків; активний і у воді, і літає вночі.
  insect.velvet_ant:
    label: оса-німка
    summary: Безкрила оранжево-чорна оса, схожа на мураху.
    info: |
      Оса-німка насправді оса родини Mutillidae; самиці безкрилі й схожі на мурах.
      Вони мають помітні червоні або оранжеві волоски як попередження.
      У самиць надзвичайно потужне жало, прозване вбивцею корів.
      Вони паразитують на гніздах джмелів.
