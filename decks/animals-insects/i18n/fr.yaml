lang: fr
pivot: false
title: Insectes
cards:
  insect.butterfly:
    label: papillon
    summary: Un insecte volant aux grandes ailes colorées.
    info: Le papillon est un insecte doté de deux paires d'ailes couvertes d'écailles, souvent aux couleurs vives.
  insect.bee:
    label: abeille
    summary: Un insecte jaune et noir qui pollinise les fleurs et produit du miel.
    info: L'abeille domestique est un insecte social qui vit dans des ruches et récolte le nectar.
  insect.ladybug:
    label: coccinelle
    summary: Un petit coléoptère rond et rouge à points noirs.
    info: La coccinelle est un petit coléoptère qui se nourrit de pucerons et est utile au jardin.
  insect.dragonfly:
    label: libellule
    summary: Un insecte au corps allongé et à deux paires d'ailes transparentes.
    info: La libellule est un insecte prédateur à l'excellente vue qui chasse près des points d'eau.
  insect.ant:
    label: fourmi
    summary: Un petit insecte social vivant en colonies.
    info: La fourmi est un insecte qui forme de grandes colonies avec une division du travail.
  insect.beetle:
    label: coléoptère
    summary: Les coléoptères forment le plus grand ordre d'insectes, avec plus de 400 000 espèces décrites.
    info: |
      Le coléoptère appartient à l'ordre des Coleoptera et représente environ 40 % de toutes les espèces d'insectes décrites.
      Il se caractérise par des étuis alaires durs (élytres) sous lesquels sont cachées les véritables ailes.
      Le lucane cerf-volant est le plus grand coléoptère d'Europe ; le mâle possède d'énormes mandibules en forme de bois.
      Ils vivent dans presque tous les milieux, des tropiques aux régions arctiques.
  insect.grasshopper:
    label: sauterelle
    summary: Un insecte sauteur aux longues pattes arrière et au chant strident.
    info: |
      La sauterelle est un insecte de l'ordre des Orthoptères aux puissantes pattes arrière permettant des sauts jusqu'à vingt fois la longueur du corps.
      Les mâles produisent un son caractéristique (stridulation) en frottant leurs pattes contre leurs ailes.
      Elle se nourrit de plantes et, en grands essaims, peut endommager les cultures.
  insect.cricket:
    label: grillon
    summary: Un insecte nocturne réputé pour la stridulation des mâles.
    info: |
      Le grillon champêtre est un insecte nocturne de l'ordre des Orthoptères.
      Les mâles stridulent en frottant leurs ailes l'une contre l'autre pour attirer les femelles et délimiter leur territoire.
      En Asie, les grillons sont traditionnellement élevés comme animaux de compagnie pour leur chant.
      Ils sont aussi un symbole de bien-être domestique et de chance dans de nombreuses cultures.
  insect.mosquito:
    label: moustique
    summary: Un insecte à deux ailes ; la femelle suce le sang et peut transmettre des maladies.
    info: |
      Le moustique est un insecte à deux ailes de la famille des Culicidés.
      Les femelles sucent le sang des animaux pour obtenir les protéines nécessaires au développement des œufs ; les mâles se nourrissent de nectar.
      Les moustiques transmettent des maladies dangereuses comme le paludisme, la dengue et le Zika.
      Il existe plus de 3 500 espèces de moustiques dans le monde.
  insect.fly:
    label: mouche
    summary: Un insecte commun à deux ailes capable de transporter des bactéries.
    info: |
      La mouche domestique est l'insecte à deux ailes le plus courant dans les habitations humaines.
      Ses yeux composés lui permettent de voir presque à 360 degrés autour d'elle.
      Elle transporte des bactéries car elle se pose aussi bien sur les déchets que sur la nourriture.
      Elle n'a qu'une seule paire d'ailes fonctionnelles ; la seconde paire (haltères) l'aide à garder l'équilibre en vol.
  insect.moth:
    label: papillon de nuit
    summary: Parent nocturne du papillon ; il vole vers la lumière et a des antennes plumeuses.
    info: |
      Les papillons de nuit sont des lépidoptères nocturnes qui, contrairement aux papillons de jour, gardent leurs ailes repliées sur les côtés au repos.
      De nombreuses espèces sont attirées par la lumière artificielle.
      Nous devons la soie naturelle aux chenilles du ver à soie.
      Le papillon lune est l'un des plus beaux papillons de nuit du monde.
  insect.caterpillar:
    label: chenille
    summary: La larve d'un papillon ou d'un papillon de nuit ; elle mange des feuilles et se prépare à la métamorphose.
    info: |
      La chenille est la larve d'un papillon et passe sa vie surtout à manger des feuilles pour accumuler de l'énergie en vue de sa transformation.
      Certaines chenilles ont des couleurs vives qui avertissent les prédateurs de leur toxicité.
      En se nymphosant, elle forme une chrysalide, où s'opère la transformation complète (métamorphose) en adulte.
  insect.praying_mantis:
    label: mante religieuse
    summary: Un insecte prédateur à la posture de prière et à l'attaque fulgurante.
    info: |
      La mante religieuse est un insecte prédateur du groupe des Mantodea.
      Elle doit son nom à la posture dans laquelle elle tient ses pattes avant repliées comme en prière.
      C'est une redoutable chasseuse ; elle frappe et saisit sa proie en une fraction de seconde.
      La femelle dévore parfois le mâle après l'accouplement, bien que cela n'arrive pas toujours.
  insect.stick_insect:
    label: phasme
    summary: Un insecte qui imite à la perfection une brindille ou une feuille.
    info: |
      Le phasme appartient au groupe des Phasmatodea et est un maître du camouflage ; son corps imite parfaitement des brindilles ou des feuilles.
      En cas de danger, il reste complètement immobile.
      Certaines espèces se reproduisent par parthénogenèse, c'est-à-dire sans mâle.
      Ce sont des animaux exotiques de compagnie appréciés pour leur élevage facile.
  insect.firefly:
    label: luciole
    summary: Un coléoptère qui produit une lumière bioluminescente pour attirer un partenaire.
    info: |
      La luciole est un coléoptère de la famille des Lampyridés capable de produire une lumière froide (bioluminescence) dans son abdomen.
      Mâles et femelles brillent selon des motifs différents pour se reconnaître et s'attirer.
      Le phénomène est régi par la réaction chimique de la luciférine avec la luciférase.
      Les lucioles sont un indicateur d'un environnement propre.
  insect.wasp:
    label: guêpe
    summary: Un insecte piqueur jaune et noir qui construit des nids de papier.
    info: |
      La guêpe commune est un insecte piqueur du groupe Vespula à la coloration d'avertissement jaune et noire typique.
      Elle construit des nids en papier à partir de pulpe de bois mâchée.
      Contrairement à l'abeille, la guêpe peut piquer plusieurs fois.
      Elle est utile comme régulateur naturel des insectes nuisibles.
  insect.cockroach:
    label: cafard
    summary: Un insecte omnivore, nocturne et rapide ; très résistant et adaptable.
    info: |
      Le cafard est l'un des insectes les plus résistants au monde ; il survit aux radiations et à des conditions qui tueraient d'autres animaux.
      Il existe plus de 4 500 espèces, mais seulement une trentaine vit près des humains.
      C'est un insecte ancien ; les cafards existent depuis plus de 300 millions d'années et ont survécu aux dinosaures.
      Il est rapide et peut courir à plus de 5 km/h.
  insect.spider:
    label: araignée
    summary: Un arachnide à huit pattes qui tisse des toiles pour capturer les insectes.
    info: |
      L'araignée est un arachnide (et non un insecte) de l'ordre des Aranéides, dotée de huit pattes et d'un corps en deux parties.
      Elle sait produire de la soie avec laquelle elle tisse des toiles pour chasser ou pour envelopper les cocons d'œufs.
      Il existe plus de 48 000 espèces d'araignées dans le monde.
      Toutes les espèces produisent du venin, mais la grande majorité est inoffensive pour l'humain.
  insect.scorpion:
    label: scorpion
    summary: Un arachnide venimeux à pinces et à queue recourbée venimeuse.
    info: |
      Le scorpion est un arachnide (et non un insecte) doté de pinces typiques et d'une queue recourbée se terminant par un dard venimeux.
      C'est un animal ancien ; les plus vieux scorpions fossiles ont plus de 430 millions d'années.
      Dans l'obscurité, ils deviennent fluorescents sous la lumière ultraviolette.
      Sur environ 2 500 espèces, seules 25 environ sont dangereuses pour l'humain.
  insect.centipede:
    label: mille-pattes
    summary: Un myriapode avec une paire de pattes par segment du corps.
    info: |
      Le mille-pattes appartient à la classe des Chilopodes et possède une paire de pattes par segment du corps (et non 100 pattes, comme le suggère son nom).
      C'est un prédateur rapide qui chasse insectes, vers et petits vertébrés.
      La première paire de pattes est transformée en crochets à venin pour paralyser la proie.
      Certaines espèces tropicales dépassent 30 cm de long.
  insect.flea:
    label: puce
    summary: Un minuscule parasite sauteur qui suce le sang des mammifères et des oiseaux.
    info: |
      La puce est un insecte sans ailes de l'ordre des Siphonaptères spécialisé dans un mode de vie parasitaire.
      Ses puissantes pattes arrière lui permettent des sauts de plus de 150 fois la longueur de son corps.
      Elle suce le sang des mammifères et des oiseaux et peut transmettre des maladies ; historiquement, les puces ont propagé la peste.
      Les puces sont des acrobates hors pair du monde des insectes.
  insect.termite:
    label: termite
    summary: Un insecte social qui construit d'énormes termitières de terre.
    info: |
      Le termite est un insecte social du groupe des Isoptères, lointainement apparenté aux cafards.
      Ils vivent en colonies avec un roi, une reine, des soldats et des ouvrières.
      Ils construisent des termitières complexes, hautes jusqu'à 9 mètres sous les tropiques, dotées d'un système de ventilation.
      En tant que principaux décomposeurs du bois, ils jouent un rôle clé dans les écosystèmes tropicaux.
  insect.bumblebee:
    label: bourdon
    summary: Une grosse abeille velue au bourdonnement grave ; un pollinisateur important.
    info: |
      Le bourdon est un gros insecte velu du genre Bombus, apparenté à l'abeille domestique.
      C'est un pollinisateur important, surtout dans les climats plus froids, où les abeilles volent moins.
      Il peut se réchauffer en faisant vibrer ses muscles de vol, si bien qu'il vole même par temps froid.
      Les bourdons sont plus doux que les abeilles et ne piquent que s'ils sont directement menacés.
  insect.hornet:
    label: frelon
    summary: La plus grande guêpe d'Europe, au dard puissant et au bourdonnement fort.
    info: |
      Le frelon est la plus grande guêpe sociale d'Europe et dépasse 3,5 cm de long.
      Il construit des nids de papier dans les creux des arbres ou sous les toits.
      Son dard est plus long que celui des guêpes et la piqûre est plus douloureuse, mais le frelon n'attaque que s'il est directement menacé.
      C'est un important prédateur d'autres insectes.
  insect.cicada:
    label: cigale
    summary: Un insecte réputé pour son chant strident et puissant les jours de chaleur.
    info: |
      La cigale est un insecte de la super-famille des Cicadoidea réputé pour l'un des sons les plus forts de tous les insectes.
      Les mâles produisent le son grâce à des membranes spéciales (cymbales) dans l'abdomen pour attirer les femelles.
      Certaines espèces aux États-Unis ont des cycles de développement de dix-sept ou treize ans.
      Les nymphes vivent des années sous terre en se nourrissant de racines.
  insect.locust:
    label: criquet migrateur
    summary: Un criquet migrateur formant des essaims dévastateurs de millions d'individus.
    info: |
      Le criquet migrateur est une espèce de criquet qui, dans certaines conditions, forme de gigantesques essaims migrateurs.
      Un essaim peut compter des milliards d'individus et détruire des cultures entières sur des milliers d'hectares en une journée.
      Dans les pays d'Afrique et d'Asie, les criquets sont historiquement l'une des plus grandes catastrophes agricoles.
      Dans la Bible, ils sont l'une des dix plaies d'Égypte.
  insect.aphid:
    label: puceron
    summary: Un minuscule insecte suceur sur les tiges des plantes ; il produit du miellat.
    info: |
      Les pucerons sont de petits insectes suceurs de la super-famille des Aphidoidea qui se nourrissent de la sève des plantes.
      Ils produisent un miellat sucré dont les fourmis prennent soin en échange de protection.
      Ils se reproduisent extrêmement vite ; une seule femelle peut donner naissance à des centaines de millions de descendants en un an.
      Ce sont d'importants ravageurs des cultures agricoles.
  insect.earwig:
    label: perce-oreille
    summary: Un insecte allongé muni de pinces au bout de l'abdomen.
    info: |
      Le perce-oreille est un insecte de l'ordre des Dermaptères caractérisé par des pinces (cerques) au bout de l'abdomen, utilisées pour la défense et l'accouplement.
      Son nom vient de la superstition selon laquelle il rampe dans les oreilles des gens ; c'est un mythe.
      Les femelles perce-oreilles sont exceptionnelles car elles prennent soin des œufs et des jeunes larves, ce qui est rare chez les insectes.
      Elles vivent dans les fissures, sous les pierres et dans la litière de feuilles.
  insect.silverfish:
    label: poisson d'argent
    summary: Un insecte sans ailes et rapide, trouvé dans les maisons près des livres et du papier.
    info: |
      Le poisson d'argent est un insecte primitif sans ailes de l'ordre des Zygentoma vivant dans les habitations.
      Il se nourrit d'amidon, de papier, de colle de reliure et de fibres textiles.
      Son nom vient de sa couleur argentée et de son mouvement semblable à celui d'un poisson.
      C'est l'un des plus anciens ordres d'insectes, vivant presque inchangé depuis plus de 300 millions d'années.
  insect.water_strider:
    label: gerris
    summary: Un insecte qui marche sur la surface de l'eau grâce à la tension superficielle.
    info: |
      Le gerris est un insecte de la famille des Gerridés capable de marcher sur l'eau grâce aux poils hydrophobes de ses pattes et à la tension superficielle de l'eau.
      Il chasse les insectes tombés à l'eau, qu'il détecte par les vibrations de la surface.
      Il est rapide et peut glisser sur l'eau à plus de 150 fois la longueur de son corps par seconde.
  insect.dung_beetle:
    label: bousier
    summary: Un coléoptère qui roule des boules de bouse, sacré dans l'Égypte antique.
    info: |
      Le bousier sacré est un coléoptère de la famille des Scarabéidés qui façonne la bouse en boules et les roule pour les enterrer et y pondre.
      Dans l'Égypte antique, il était le symbole du soleil et du dieu Khépri.
      C'est l'un des rares animaux qui s'orientent grâce à la Voie lactée.
      Il aide à recycler les nutriments et à aérer le sol.
  insect.stag_beetle:
    label: lucane cerf-volant
    summary: Le plus grand coléoptère d'Europe ; le mâle a des mandibules en forme de bois.
    info: |
      Le lucane cerf-volant est le plus grand coléoptère d'Europe et dépasse 7 cm de long.
      Le mâle possède d'énormes mandibules en forme de bois, utilisées pour les combats pour les femelles.
      La larve vit jusqu'à 7 ans dans le bois pourri des chênes et se nourrit de champignons.
      Il est en danger critique en raison de la disparition des vieilles forêts et du bois mort.
  insect.atlas_moth:
    label: papillon atlas
    summary: L'un des plus grands papillons de nuit du monde, aux ailes ornées de motifs de serpent.
    info: |
      Le papillon atlas est l'un des plus grands papillons de nuit du monde, avec une envergure atteignant 30 cm.
      Le bout de ses ailes est coloré pour ressembler à des têtes de serpent, ce qui effraie les prédateurs.
      Les adultes n'ont pas de bouche et ne se nourrissent pas du tout ; ils ne survivent que quelques jours.
      Il vient des forêts tropicales d'Asie du Sud-Est.
  insect.weevil:
    label: charançon
    summary: Un petit coléoptère au rostre allongé caractéristique.
    info: |
      Le charançon est un coléoptère de la famille des Curculionidés, la plus grande famille d'animaux au monde avec plus de 60 000 espèces.
      Son rostre allongé caractéristique sert à percer graines, fruits et troncs.
      Certaines espèces sont de graves ravageurs agricoles, comme le charançon du coton.
      D'autres espèces sont spécialisées sur une seule espèce de plante.
  insect.lacewing:
    label: chrysope
    summary: Un insecte délicat aux ailes nervurées transparentes ; les larves chassent les pucerons.
    info: |
      La chrysope est un insecte de la famille des Chrysopidés aux ailes délicates aux nervures transparentes et aux yeux dorés.
      Les larves sont prédatrices et consomment d'énormes quantités de pucerons, devenant des protectrices naturelles des plantes.
      Les adultes se nourrissent de nectar et de pollen.
      Elles sont attirées par la lumière et sont un indicateur d'un environnement sain.
  insect.crane_fly:
    label: tipule
    summary: Une grande mouche ressemblant à un moustique aux pattes extrêmement longues.
    info: |
      La tipule est un insecte à deux ailes de la famille des Tipulidés ressemblant à un moustique géant, mais qui ne pique ni ne parasite.
      Ses pattes extrêmement longues se détachent facilement ; c'est un mécanisme de défense (autotomie).
      Les adultes ne vivent que quelques jours et ne se nourrissent pas, ou se nourrissent de nectar.
      Les larves vivent dans le sol et se nourrissent de racines.
  insect.mayfly:
    label: éphémère
    summary: Un insecte à la vie adulte la plus courte, ne vivant que quelques heures à quelques jours.
    info: |
      L'éphémère est un insecte de l'ordre des Éphéméroptères et un symbole de fugacité ; les adultes ne vivent que quelques heures à quelques jours.
      Ils n'ont pas de pièces buccales fonctionnelles et ne se nourrissent pas du tout.
      Les nymphes vivent de 1 à 3 ans sous l'eau.
      L'essaimage massif des éphémères est un spectacle naturel fascinant ; en Hongrie, leur essaimage massif sur le Danube est un phénomène unique.
  insect.damselfly:
    label: demoiselle
    summary: Une svelte parente de la libellule ; au repos, elle replie ses ailes le long du corps.
    info: |
      La demoiselle est un insecte apparenté aux libellules, mais plus svelte, et au repos elle replie ses ailes parallèlement au corps, contrairement aux libellules.
      C'est un prédateur qui chasse de petits insectes en vol.
      Les nymphes vivent dans l'eau et constituent une part importante des écosystèmes aquatiques.
      Elles sont un indicateur de la qualité des cours d'eau.
  insect.robber_fly:
    label: asilide
    summary: Une mouche prédatrice qui capture d'autres insectes en plein vol.
    info: |
      L'asilide est un insecte prédateur à deux ailes de la famille des Asilidés qui chasse d'autres insectes directement en vol.
      Il a des pattes robustes pour saisir sa proie et une trompe pour injecter un venin paralysant.
      Certaines espèces imitent l'apparence des bourdons ou des guêpes comme protection contre les prédateurs.
      Il est bénéfique comme régulateur naturel des populations d'insectes.
  insect.ground_beetle:
    label: carabe
    summary: Un coléoptère prédateur rapide vivant sous les pierres et dans la litière.
    info: |
      Le carabe est un coléoptère de la famille des Carabidés ; la plupart des espèces sont des prédateurs nocturnes actifs chassant d'autres insectes, vers et limaces.
      Ils sont rapides et fuient vite le danger.
      Certaines espèces, comme le carabe violet, ont un magnifique éclat métallique.
      Ce sont des indicateurs d'un sol sain et d'une agriculture naturelle.
  insect.tiger_beetle:
    label: cicindèle
    summary: Un coléoptère rapide aux couleurs métalliques et à l'excellente vue.
    info: |
      La cicindèle est un coléoptère de la sous-famille des Cicindelinae réputé pour son extraordinaire rapidité, sa capacité de vol et sa vue perçante.
      Elle court si vite qu'elle doit s'arrêter et se réorienter, car le mouvement est trop rapide pour son système visuel.
      Elle a un corps métallique aux couleurs splendides (vert, bleu, rouge) et de grands yeux.
      Les larves creusent des tunnels verticaux dans le sol et guettent leur proie à l'ouverture.
  insect.hoverfly:
    label: syrphe
    summary: Une mouche qui imite les couleurs des guêpes et des abeilles, pollinisatrice des jardins.
    info: |
      Le syrphe est un insecte à deux ailes de la famille des Syrphidés qui imite la coloration des guêpes et des abeilles comme protection contre les prédateurs (mimétisme batésien), bien qu'il ne pique pas.
      C'est un pollinisateur important ; il visite plus d'espèces de plantes que les abeilles.
      Les adultes se nourrissent de nectar et de pollen.
      Les larves de certaines espèces chassent les pucerons, aidant ainsi au jardin.
  insect.whirligig_beetle:
    label: gyrin
    summary: Un petit coléoptère qui tournoie en essaims à la surface de l'eau.
    info: |
      Le gyrin est un coléoptère aquatique de la famille des Gyrinidés qui vit à la surface, et tournoyer en essaims l'aide à échapper aux prédateurs.
      Ses yeux sont divisés en deux parties ; l'une voit au-dessus de l'eau, l'autre en dessous.
      Il détecte les rides à la surface qui signalent nourriture ou danger.
      Le jour, il tournoie ; la nuit, il vole.
  insect.louse:
    label: pou
    summary: Un minuscule parasite sans ailes vivant sur la peau et les poils des mammifères.
    info: |
      Le pou est un insecte parasite sans ailes de l'ordre des Phthiraptères vivant sur la peau et dans le pelage ou les cheveux des hôtes.
      Il suce le sang et provoque des démangeaisons.
      Le pou de tête est répandu dans le monde entier et touche les enfants quelles que soient les conditions d'hygiène.
      Historiquement, les poux ont transmis le typhus et d'autres maladies.
  insect.bedbug:
    label: punaise de lit
    summary: Un parasite plat qui suce le sang la nuit ; il se cache dans les fentes des meubles.
    info: |
      La punaise de lit est un insecte plat et ovale de la famille des Cimicidés, actif surtout la nuit.
      Elle pique et suce le sang de l'hôte endormi.
      Elle se cache dans les fentes du matelas, des meubles et derrière le papier peint.
      Ces dernières décennies, elle s'est répandue dans le monde entier grâce aux voyages internationaux.
  insect.antlion:
    label: fourmilion
    summary: Une larve qui creuse des pièges en entonnoir pour les fourmis dans le sable.
    info: |
      Le fourmilion est la larve d'un insecte de la famille des Myrmeleontidés qui creuse des entonnoirs coniques dans le sable sec.
      Lorsqu'une fourmi glisse dans le piège, le fourmilion la saisit avec ses mandibules et injecte des sucs digestifs.
      Les adultes sont discrets, semblables à des libellules, et volent la nuit.
      Les larves peuvent vivre des années sous terre sans se nourrir.
  insect.goliath_beetle:
    label: scarabée Goliath
    summary: L'un des insectes les plus grands et les plus lourds du monde, d'Afrique tropicale.
    info: |
      Le scarabée Goliath est l'un des plus grands insectes du monde ; les mâles pèsent jusqu'à 100 grammes et atteignent plus de 11 cm de long.
      Il vit dans les forêts tropicales humides d'Afrique équatoriale.
      Les adultes se nourrissent de fruits et de sève d'arbre.
      En Afrique, les enfants les gardent parfois comme jouets et ils sont vendus aux collectionneurs.
  insect.bombardier_beetle:
    label: coléoptère bombardier
    summary: Un coléoptère qui projette un mélange toxique bouillant comme défense.
    info: |
      Le coléoptère bombardier est un coléoptère de la sous-famille des Brachininae qui se défend de manière unique ; il mélange deux substances chimiques dans son abdomen, provoquant une réaction explosive à plus de 100 degrés.
      La vapeur hautement toxique est projetée avec une forte détonation jusqu'à 500 fois par seconde.
      C'est l'un des exemples les plus fascinants de défense chimique dans la nature.
  insect.diving_beetle:
    label: dytique
    summary: Un coléoptère aquatique prédateur qui nage sous la surface.
    info: |
      Le dytique est un coléoptère aquatique prédateur de la famille des Dytiscidés vivant dans les mares et les eaux stagnantes.
      Il nage avec aisance grâce à ses pattes arrière plates fonctionnant comme des rames.
      Il respire à la surface et stocke l'air sous ses élytres.
      Il chasse insectes, larves, petits poissons et têtards ; il est actif dans l'eau et vole la nuit.
  insect.velvet_ant:
    label: fourmi de velours
    summary: Une guêpe sans ailes orange et noire qui ressemble à une fourmi.
    info: |
      La fourmi de velours est en réalité une guêpe de la famille des Mutillidés ; les femelles sont sans ailes et ressemblent à des fourmis.
      Elles ont des poils rouges ou orange voyants en guise d'avertissement.
      Les femelles possèdent un dard extrêmement puissant surnommé le tueur de vaches.
      Elles parasitent les nids des bourdons.
