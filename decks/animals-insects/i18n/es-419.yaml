lang: es-419
pivot: false
title: Insectos
cards:
  insect.ant:
    label: hormiga
    summary: Insecto social pequeño que vive en colonias.
    info: La hormiga es un insecto que forma grandes colonias con división del trabajo.
  insect.bee:
    label: abeja
    summary: Insecto amarillo y negro que poliniza flores y produce miel.
    info: La abeja melífera es un insecto social que vive en colmenas y recolecta néctar de las plantas para producir miel.
  insect.butterfly:
    label: mariposa
    summary: Insecto volador con grandes alas coloridas.
    info: La mariposa es un insecto con dos pares de alas escamasadas, frecuentemente colores llamativos.
  insect.dragonfly:
    label: libélula
    summary: Insecto con cuerpo largo y dos pares de alas trasparentes.
    info: La libélula es un insecto carnívoro con una vista excelente que caza cerca de cuerpos de agua.
  insect.ladybug:
    label: beruška
    summary: Pequeño escarabajo rojo y redondo con manchas negras.
    info: La beruška es un pequeño insecto que se alimenta de cochinillas y resulta útil en el jardín.
