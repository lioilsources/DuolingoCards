lang: de
pivot: false
title: Insekten
cards:
  insect.butterfly:
    label: Schmetterling
    summary: Ein fliegendes Insekt mit großen bunten Flügeln.
    info: Der Schmetterling ist ein Insekt mit zwei Paar beschuppten Flügeln, oft auffällig gefärbt.
  insect.bee:
    label: Biene
    summary: Ein gelb-schwarzes Insekt, das Blüten bestäubt und Honig herstellt.
    info: Die Honigbiene ist ein soziales Insekt, das in Bienenstöcken lebt und Nektar sammelt.
  insect.ladybug:
    label: Marienkäfer
    summary: Ein kleiner runder roter Käfer mit schwarzen Punkten.
    info: Der Marienkäfer ist ein winziger Käfer, der sich von Blattläusen ernährt und im Garten nützlich ist.
  insect.dragonfly:
    label: Libelle
    summary: Ein Insekt mit langem Körper und zwei Paar durchsichtigen Flügeln.
    info: Die Libelle ist ein Raubinsekt mit ausgezeichnetem Sehvermögen, das an Gewässern jagt.
  insect.ant:
    label: Ameise
    summary: Ein kleines soziales Insekt, das in Kolonien lebt.
    info: Die Ameise ist ein Insekt, das große Kolonien mit Arbeitsteilung bildet.
  insect.beetle:
    label: Käfer
    summary: Käfer bilden die größte Insektenordnung mit über 400.000 beschriebenen Arten.
    info: |
      Der Käfer gehört zur Ordnung der Coleoptera und macht etwa 40 % aller beschriebenen Insektenarten aus.
      Er ist durch harte Flügeldecken (Elytren) gekennzeichnet, unter denen die eigentlichen Flugflügel verborgen sind.
      Der Hirschkäfer ist der größte Käfer Europas; das Männchen hat mächtige geweihartige Mandibeln.
      Sie leben in fast allen Lebensräumen, von den Tropen bis in arktische Regionen.
  insect.grasshopper:
    label: Heuschrecke
    summary: Ein springendes Insekt mit langen Hinterbeinen und zirpendem Gesang.
    info: |
      Die Heuschrecke ist ein Insekt der Ordnung Orthoptera mit kräftigen Hinterbeinen, die Sprünge bis zum Zwanzigfachen der Körperlänge ermöglichen.
      Die Männchen erzeugen einen charakteristischen Laut (Stridulation), indem sie die Beine an den Flügeln reiben.
      Sie ernährt sich von Pflanzen und kann in großen Schwärmen Ernten schädigen.
  insect.cricket:
    label: Grille
    summary: Ein nachtaktives Insekt, berühmt für das Zirpen der Männchen.
    info: |
      Die Feldgrille ist ein nachtaktives Insekt der Ordnung Orthoptera.
      Die Männchen zirpen, indem sie die Flügel aneinander reiben, um Weibchen anzulocken und ihr Revier abzugrenzen.
      In Asien werden Grillen traditionell als Haustiere für ihren Gesang gehalten.
      Sie sind auch ein Symbol für häusliches Wohl und Glück in vielen Kulturen.
  insect.mosquito:
    label: Stechmücke
    summary: Ein zweiflügeliges Insekt; das Weibchen saugt Blut und kann Krankheiten übertragen.
    info: |
      Die Stechmücke ist ein zweiflügeliges Insekt der Familie Culicidae.
      Die Weibchen saugen das Blut von Tieren, um Eiweiß für die Entwicklung der Eier zu gewinnen; die Männchen ernähren sich von Nektar.
      Stechmücken übertragen gefährliche Krankheiten wie Malaria, Dengue und Zika.
      Weltweit gibt es über 3.500 Stechmückenarten.
  insect.fly:
    label: Fliege
    summary: Ein häufiges zweiflügeliges Insekt, das Bakterien übertragen kann.
    info: |
      Die Stubenfliege ist das häufigste zweiflügelige Insekt in menschlichen Behausungen.
      Ihre Facettenaugen ermöglichen es ihr, fast 360 Grad um sich herum zu sehen.
      Sie überträgt Bakterien, weil sie sich sowohl auf Abfall als auch auf Nahrung setzt.
      Sie hat nur ein Paar funktionsfähiger Flügel; das zweite Paar (Halteren) hilft ihr, im Flug das Gleichgewicht zu halten.
  insect.moth:
    label: Nachtfalter
    summary: Nachtaktiver Verwandter des Schmetterlings; fliegt zum Licht und hat gefiederte Fühler.
    info: |
      Nachtfalter sind nachtaktive Schmetterlinge, die im Gegensatz zu Tagfaltern ihre Flügel in Ruhe seitlich angelegt halten.
      Viele Arten werden von künstlichem Licht angezogen.
      Die natürliche Seide verdanken wir den Raupen des Seidenspinners.
      Der Luna-Falter ist einer der schönsten Nachtfalter der Welt.
  insect.caterpillar:
    label: Raupe
    summary: Die Larve eines Schmetterlings oder Nachtfalters; sie frisst Blätter und bereitet sich auf die Verpuppung vor.
    info: |
      Die Raupe ist die Larve eines Schmetterlings und verbringt ihr Leben hauptsächlich damit, Blätter zu fressen, um Energie für die Verwandlung anzusammeln.
      Manche Raupen haben leuchtende Farben, die Fressfeinde vor ihrer Giftigkeit warnen.
      Bei der Verpuppung bildet sie eine Puppe (Chrysalide), in der die vollständige Verwandlung (Metamorphose) zum erwachsenen Tier stattfindet.
  insect.praying_mantis:
    label: Gottesanbeterin
    summary: Ein Raubinsekt mit betender Haltung und blitzschnellem Zuschlagen.
    info: |
      Die Gottesanbeterin ist ein Raubinsekt aus der Gruppe der Mantodea.
      Ihren Namen verdankt sie der Haltung, in der sie die Vorderbeine wie zum Gebet gefaltet hält.
      Sie ist eine meisterhafte Jägerin; sie schlägt zu und ergreift ihre Beute im Bruchteil einer Sekunde.
      Das Weibchen frisst das Männchen manchmal nach der Paarung, wenn auch nicht immer.
  insect.stick_insect:
    label: Stabschrecke
    summary: Ein Insekt, das einen Zweig oder ein Blatt perfekt nachahmt.
    info: |
      Die Stabschrecke gehört zur Gruppe der Phasmatodea und ist ein Meister der Tarnung; ihr Körper ahmt Zweige oder Blätter perfekt nach.
      Bei Gefahr bleibt sie völlig regungslos.
      Manche Arten pflanzen sich durch Parthenogenese fort, also ohne Männchen.
      Sie sind beliebte exotische Haustiere wegen ihrer einfachen Haltung.
  insect.firefly:
    label: Glühwürmchen
    summary: Ein Käfer, der biolumineszentes Licht erzeugt, um einen Partner anzulocken.
    info: |
      Das Glühwürmchen ist ein Käfer der Familie Lampyridae, der kaltes Licht (Biolumineszenz) im Hinterleib erzeugen kann.
      Männchen und Weibchen leuchten in unterschiedlichen Mustern, um sich zu erkennen und anzuziehen.
      Es wird durch die chemische Reaktion von Luciferin mit Luciferase gesteuert.
      Glühwürmchen sind ein Indikator für eine saubere Umwelt.
  insect.wasp:
    label: Wespe
    summary: Ein gelb-schwarzes stechendes Insekt, das Papiernester baut.
    info: |
      Die Gemeine Wespe ist ein stechendes Insekt der Gruppe Vespula mit typischer gelb-schwarzer Warnfärbung.
      Sie baut Papiernester aus zerkauter Holzmasse.
      Im Gegensatz zur Biene kann die Wespe mehrmals stechen.
      Sie ist nützlich als natürlicher Regulator von Insektenschädlingen.
  insect.cockroach:
    label: Kakerlake
    summary: Ein schnelles, nachtaktives, allesfressendes Insekt; sehr widerstandsfähig und anpassungsfähig.
    info: |
      Die Kakerlake ist eines der widerstandsfähigsten Insekten der Welt; sie überlebt Strahlung und Bedingungen, die andere Tiere töten würden.
      Es gibt über 4.500 Arten, aber nur etwa 30 leben in der Nähe von Menschen.
      Sie ist ein uraltes Insekt; Kakerlaken existieren seit über 300 Millionen Jahren und haben die Dinosaurier überlebt.
      Sie ist schnell und kann mit über 5 km/h laufen.
  insect.spider:
    label: Spinne
    summary: Ein achtbeiniges Spinnentier, das Netze webt, um Insekten zu fangen.
    info: |
      Die Spinne ist ein Spinnentier (kein Insekt) der Ordnung Araneae mit acht Beinen und einem zweigeteilten Körper.
      Sie kann Seide erzeugen, aus der sie Netze zum Jagen oder zum Umhüllen der Eikokons webt.
      Weltweit leben über 48.000 Spinnenarten.
      Alle Arten erzeugen Gift, aber die allermeisten sind für den Menschen harmlos.
  insect.scorpion:
    label: Skorpion
    summary: Ein giftiges Spinnentier mit Scheren und gekrümmtem Giftschwanz.
    info: |
      Der Skorpion ist ein Spinnentier (kein Insekt) mit typischen Scheren und einem gekrümmten Schwanz, der in einem giftigen Stachel endet.
      Er ist ein uraltes Tier; die ältesten fossilen Skorpione sind über 430 Millionen Jahre alt.
      Im Dunkeln fluoreszieren sie unter ultraviolettem Licht.
      Von etwa 2.500 Arten sind nur etwa 25 für den Menschen gefährlich.
  insect.centipede:
    label: Hundertfüßer
    summary: Ein Vielfüßer mit einem Beinpaar pro Körpersegment.
    info: |
      Der Hundertfüßer gehört zur Klasse Chilopoda und hat ein Beinpaar pro Körpersegment (nicht 100 Beine, wie der Name vermuten lässt).
      Er ist ein schneller Räuber, der Insekten, Würmer und kleine Wirbeltiere jagt.
      Das erste Beinpaar ist zu Giftklauen umgewandelt, um die Beute zu lähmen.
      Manche tropischen Arten werden über 30 cm lang.
  insect.flea:
    label: Floh
    summary: Ein winziger springender Parasit, der das Blut von Säugetieren und Vögeln saugt.
    info: |
      Der Floh ist ein flügelloses Insekt der Ordnung Siphonaptera, spezialisiert auf eine parasitische Lebensweise.
      Seine kräftigen Hinterbeine ermöglichen Sprünge von über dem 150-Fachen der Körperlänge.
      Er saugt das Blut von Säugetieren und Vögeln und kann Krankheiten übertragen; historisch übertrugen Flöhe die Pest.
      Flöhe sind hervorragende Akrobaten der Insektenwelt.
  insect.termite:
    label: Termite
    summary: Ein soziales Insekt, das riesige Erdhügel baut.
    info: |
      Die Termite ist ein soziales Insekt der Gruppe Isoptera, entfernt mit den Kakerlaken verwandt.
      Sie leben in Kolonien mit einem König, einer Königin, Soldaten und Arbeiterinnen.
      Sie bauen komplexe Bauten, in den Tropen bis zu 9 Meter hoch, mit einem Belüftungssystem.
      Als wichtigste Zersetzer von Holz spielen sie eine Schlüsselrolle in tropischen Ökosystemen.
  insect.bumblebee:
    label: Hummel
    summary: Eine große pelzige Biene mit tiefem Brummen; ein wichtiger Bestäuber.
    info: |
      Die Hummel ist ein großes pelziges Insekt der Gattung Bombus, verwandt mit der Honigbiene.
      Sie ist ein wichtiger Bestäuber, besonders in kälteren Klimazonen, wo Bienen weniger fliegen.
      Sie kann sich durch Vibrieren der Flugmuskeln aufwärmen, sodass sie auch bei kaltem Wetter fliegt.
      Hummeln sind sanfter als Bienen und stechen nur bei direkter Bedrohung.
  insect.hornet:
    label: Hornisse
    summary: Die größte Wespe Europas mit kräftigem Stachel und lautem Brummen.
    info: |
      Die Hornisse ist die größte soziale Wespe Europas und wird über 3,5 cm lang.
      Sie baut Papiernester in Baumhöhlen oder unter Dächern.
      Ihr Stachel ist länger als der von Wespen und der Stich schmerzhafter, aber die Hornisse greift nur bei direkter Bedrohung an.
      Sie ist ein wichtiger Räuber anderer Insekten.
  insect.cicada:
    label: Zikade
    summary: Ein Insekt, berühmt für seinen lauten zirpenden Gesang an heißen Tagen.
    info: |
      Die Zikade ist ein Insekt der Überfamilie Cicadoidea, berühmt für einen der lautesten Laute aller Insekten.
      Die Männchen erzeugen den Laut mit speziellen Membranen (Tymbalen) im Hinterleib, um Weibchen anzulocken.
      Manche Arten in den USA haben siebzehn- oder dreizehnjährige Entwicklungszyklen.
      Die Nymphen leben jahrelang unter der Erde und ernähren sich von Wurzeln.
  insect.locust:
    label: Wanderheuschrecke
    summary: Eine wandernde Heuschrecke, die verheerende Schwärme aus Millionen bildet.
    info: |
      Die Wanderheuschrecke ist eine Heuschreckenart, die unter bestimmten Bedingungen riesige wandernde Schwärme bildet.
      Ein Schwarm kann Milliarden von Individuen zählen und ganze Ernten auf Tausenden Hektar an einem Tag vernichten.
      In afrikanischen und asiatischen Ländern sind Heuschrecken historisch eine der größten landwirtschaftlichen Katastrophen.
      In der Bibel sind sie eine der zehn Plagen Ägyptens.
  insect.aphid:
    label: Blattlaus
    summary: Ein winziges saugendes Insekt an Pflanzenstängeln; produziert Honigtau.
    info: |
      Blattläuse sind kleine saugende Insekten der Überfamilie Aphidoidea, die sich vom Pflanzensaft ernähren.
      Sie produzieren süßen Honigtau, den Ameisen im Austausch für Schutz pflegen.
      Sie vermehren sich extrem schnell; ein einziges Weibchen kann in einem Jahr Hunderte Millionen Nachkommen hervorbringen.
      Sie sind wichtige Schädlinge landwirtschaftlicher Kulturen.
  insect.earwig:
    label: Ohrwurm
    summary: Ein längliches Insekt mit Zangen am Ende des Hinterleibs.
    info: |
      Der Ohrwurm ist ein Insekt der Ordnung Dermaptera, gekennzeichnet durch Zangen (Cerci) am Ende des Hinterleibs, die zur Verteidigung und Paarung dienen.
      Der Name stammt vom Aberglauben, er krieche den Menschen in die Ohren; das ist ein Mythos.
      Ohrwurm-Weibchen sind außergewöhnlich, da sie sich um die Eier und jungen Larven kümmern, was bei Insekten selten ist.
      Sie leben in Spalten, unter Steinen und im Laub.
  insect.silverfish:
    label: Silberfischchen
    summary: Ein flügelloses, schnelles Insekt, das in Häusern bei Büchern und Papier zu finden ist.
    info: |
      Das Silberfischchen ist ein primitives flügelloses Insekt der Ordnung Zygentoma, das in Wohnungen lebt.
      Es ernährt sich von Stärke, Papier, Buchbinderleim und Textilfasern.
      Sein Name stammt von seiner silbrigen Farbe und seiner fischartigen Bewegung.
      Es ist eine der ältesten Insektenordnungen und lebt seit über 300 Millionen Jahren fast unverändert.
  insect.water_strider:
    label: Wasserläufer
    summary: Ein Insekt, das dank der Oberflächenspannung auf der Wasseroberfläche läuft.
    info: |
      Der Wasserläufer ist ein Insekt der Familie Gerridae, das dank der hydrophoben Härchen an seinen Beinen und der Oberflächenspannung des Wassers auf dem Wasser laufen kann.
      Er jagt ins Wasser gefallene Insekten, die er an den Vibrationen der Oberfläche erkennt.
      Er ist schnell und kann mit über dem 150-Fachen seiner Körperlänge pro Sekunde über das Wasser gleiten.
  insect.dung_beetle:
    label: Mistkäfer
    summary: Ein Käfer, der Dungkugeln rollt, im alten Ägypten heilig.
    info: |
      Der heilige Pillendreher ist ein Käfer der Familie Scarabaeidae, der Dung zu Kugeln formt und rollt, um sie zu vergraben und Eier abzulegen.
      Im alten Ägypten war er ein Symbol der Sonne und des Gottes Chepri.
      Er ist eines der wenigen Tiere, die sich an der Milchstraße orientieren.
      Er hilft, Nährstoffe zu recyceln und den Boden zu belüften.
  insect.stag_beetle:
    label: Hirschkäfer
    summary: Der größte Käfer Europas; das Männchen hat geweihartige Mandibeln.
    info: |
      Der Hirschkäfer ist der größte Käfer Europas und wird über 7 cm lang.
      Das Männchen hat riesige geweihartige Mandibeln, die für Kämpfe um die Weibchen genutzt werden.
      Die Larve lebt bis zu 7 Jahre im morschen Holz von Eichen und ernährt sich von Pilzen.
      Er ist durch das Verschwinden alter Wälder und Totholz stark gefährdet.
  insect.atlas_moth:
    label: Atlasspinner
    summary: Einer der größten Nachtfalter der Welt, mit schlangenartig gemusterten Flügeln.
    info: |
      Der Atlasspinner ist einer der größten Nachtfalter der Welt mit einer Flügelspannweite von bis zu 30 cm.
      Die Spitzen seiner Flügel sind so gefärbt, dass sie Schlangenköpfen ähneln, was Fressfeinde abschreckt.
      Die erwachsenen Tiere haben keinen Mund und fressen überhaupt nicht; sie überleben nur wenige Tage.
      Er stammt aus den tropischen Wäldern Südostasiens.
  insect.weevil:
    label: Rüsselkäfer
    summary: Ein kleiner Käfer mit charakteristischem verlängertem Rüssel.
    info: |
      Der Rüsselkäfer ist ein Käfer der Familie Curculionidae, der größten Tierfamilie der Welt mit über 60.000 Arten.
      Sein charakteristischer verlängerter Rüssel (Rostrum) dient zum Bohren in Samen, Früchte und Stämme.
      Manche Arten sind schwere landwirtschaftliche Schädlinge, wie der Baumwollkapselkäfer.
      Andere Arten sind auf eine einzige Pflanzenart spezialisiert.
  insect.lacewing:
    label: Florfliege
    summary: Ein zartes Insekt mit durchsichtig geäderten Flügeln; die Larven jagen Blattläuse.
    info: |
      Die Florfliege ist ein Insekt der Familie Chrysopidae mit zarten, durchsichtig geäderten Flügeln und goldenen Augen.
      Die Larven sind Räuber und vertilgen enorme Mengen an Blattläusen, wodurch sie zu natürlichen Schützern der Pflanzen werden.
      Die erwachsenen Tiere ernähren sich von Nektar und Pollen.
      Sie werden vom Licht angezogen und sind ein Indikator für eine gesunde Umwelt.
  insect.crane_fly:
    label: Schnake
    summary: Eine große mückenähnliche Fliege mit extrem langen Beinen.
    info: |
      Die Schnake ist ein zweiflügeliges Insekt der Familie Tipulidae, das einer riesigen Stechmücke ähnelt, aber weder sticht noch parasitiert.
      Ihre extrem langen Beine brechen leicht ab; das ist ein Verteidigungsmechanismus (Autotomie).
      Die erwachsenen Tiere leben nur wenige Tage und fressen nicht oder ernähren sich von Nektar.
      Die Larven leben im Boden und ernähren sich von Wurzeln.
  insect.mayfly:
    label: Eintagsfliege
    summary: Ein Insekt mit dem kürzesten Erwachsenenleben, das nur Stunden bis Tage lebt.
    info: |
      Die Eintagsfliege ist ein Insekt der Ordnung Ephemeroptera und ein Symbol der Vergänglichkeit; die erwachsenen Tiere leben nur Stunden bis Tage.
      Sie haben keine funktionsfähigen Mundwerkzeuge und fressen überhaupt nicht.
      Die Nymphen leben 1 bis 3 Jahre unter Wasser.
      Das massenhafte Schwärmen der Eintagsfliegen ist ein fesselndes Naturschauspiel; in Ungarn ist ihr Massenschwärmen an der Donau ein einzigartiges Phänomen.
  insect.damselfly:
    label: Kleinlibelle
    summary: Eine schlanke Verwandte der Libelle; in Ruhe legt sie die Flügel längs des Körpers an.
    info: |
      Die Kleinlibelle ist ein Insekt, das mit den Libellen verwandt ist, aber schlanker, und in Ruhe legt sie die Flügel parallel zum Körper an, anders als die Großlibellen.
      Sie ist ein Räuber und jagt kleine Insekten im Flug.
      Die Nymphen leben im Wasser und sind ein wichtiger Teil der aquatischen Ökosysteme.
      Sie sind ein Indikator für die Qualität von Fließgewässern.
  insect.robber_fly:
    label: Raubfliege
    summary: Eine räuberische Fliege, die andere Insekten im Flug fängt.
    info: |
      Die Raubfliege ist ein räuberisches zweiflügeliges Insekt der Familie Asilidae, das andere Insekten direkt im Flug jagt.
      Sie hat kräftige Beine, um die Beute zu greifen, und einen Stechrüssel, um ein lähmendes Gift einzuspritzen.
      Manche Arten ahmen das Aussehen von Hummeln oder Wespen als Schutz vor Fressfeinden nach.
      Sie ist nützlich als natürlicher Regulator von Insektenpopulationen.
  insect.ground_beetle:
    label: Laufkäfer
    summary: Ein schneller räuberischer Käfer, der unter Steinen und im Laub lebt.
    info: |
      Der Laufkäfer ist ein Käfer der Familie Carabidae; die meisten Arten sind aktive nachtaktive Räuber, die andere Insekten, Würmer und Schnecken jagen.
      Sie sind schnell und fliehen rasch vor Gefahr.
      Manche Arten, wie der Violette Laufkäfer, haben einen wunderschönen metallischen Glanz.
      Sie sind Indikatoren für gesunden Boden und natürliche Landwirtschaft.
  insect.tiger_beetle:
    label: Sandlaufkäfer
    summary: Ein schneller metallisch gefärbter Käfer mit ausgezeichnetem Sehvermögen.
    info: |
      Der Sandlaufkäfer ist ein Käfer der Unterfamilie Cicindelinae, berühmt für seine außerordentliche Schnelligkeit, Flugfähigkeit und scharfe Sicht.
      Er läuft so schnell, dass er anhalten und sich neu orientieren muss, weil die Bewegung für sein Sehsystem zu schnell ist.
      Er hat prächtig gefärbte metallische Körper (grün, blau, rot) und große Augen.
      Die Larven graben senkrechte Tunnel im Boden und lauern der Beute an der Öffnung auf.
  insect.hoverfly:
    label: Schwebfliege
    summary: Eine Fliege, die die Farben von Wespen und Bienen nachahmt, Bestäuberin der Gärten.
    info: |
      Die Schwebfliege ist ein zweiflügeliges Insekt der Familie Syrphidae, das die Färbung von Wespen und Bienen als Schutz vor Fressfeinden nachahmt (Bates'sche Mimikry), obwohl sie nicht sticht.
      Sie ist eine wichtige Bestäuberin; sie besucht mehr Pflanzenarten als Bienen.
      Die erwachsenen Tiere ernähren sich von Nektar und Pollen.
      Die Larven mancher Arten jagen Blattläuse und helfen so im Garten.
  insect.whirligig_beetle:
    label: Taumelkäfer
    summary: Ein kleiner Käfer, der in Schwärmen auf der Wasseroberfläche kreist.
    info: |
      Der Taumelkäfer ist ein Wasserkäfer der Familie Gyrinidae, der an der Oberfläche lebt, und das Kreisen in Schwärmen hilft ihm, Fressfeinden zu entkommen.
      Seine Augen sind in zwei Teile geteilt; einer sieht über Wasser, der andere darunter.
      Er erkennt Wellen an der Oberfläche, die Nahrung oder Gefahr signalisieren.
      Tagsüber kreist er, nachts fliegt er.
  insect.louse:
    label: Laus
    summary: Ein winziger flügelloser Parasit, der auf der Haut und im Haar von Säugetieren lebt.
    info: |
      Die Laus ist ein flügelloses parasitisches Insekt der Ordnung Phthiraptera, das auf der Haut und im Fell oder Haar der Wirte lebt.
      Sie saugt Blut und verursacht Juckreiz.
      Die Kopflaus ist weltweit verbreitet und befällt Kinder unabhängig von den Hygienebedingungen.
      Historisch übertrugen Läuse Typhus und andere Krankheiten.
  insect.bedbug:
    label: Bettwanze
    summary: Ein flacher Parasit, der nachts Blut saugt; versteckt sich in Möbelritzen.
    info: |
      Die Bettwanze ist ein flaches ovales Insekt der Familie Cimicidae, vor allem nachts aktiv.
      Sie sticht und saugt das Blut des schlafenden Wirtes.
      Sie versteckt sich in den Ritzen von Matratze, Möbeln und hinter Tapeten.
      In den letzten Jahrzehnten hat sie sich dank internationaler Reisen weltweit ausgebreitet.
  insect.antlion:
    label: Ameisenlöwe
    summary: Eine Larve, die im Sand Trichterfallen für Ameisen gräbt.
    info: |
      Der Ameisenlöwe ist die Larve eines Insekts der Familie Myrmeleontidae, die kegelförmige Trichter in trockenen Sand gräbt.
      Wenn eine Ameise in die Falle rutscht, packt der Ameisenlöwe sie mit seinen Mandibeln und spritzt Verdauungssäfte ein.
      Die erwachsenen Tiere sind unauffällig, den Libellen ähnlich, und fliegen nachts.
      Die Larven können jahrelang unter der Erde ohne Nahrung leben.
  insect.goliath_beetle:
    label: Goliathkäfer
    summary: Eines der größten und schwersten Insekten der Welt, aus dem tropischen Afrika.
    info: |
      Der Goliathkäfer ist eines der größten Insekten der Welt; die Männchen wiegen bis zu 100 Gramm und erreichen über 11 cm Länge.
      Er lebt in den tropischen Regenwäldern des äquatorialen Afrikas.
      Die erwachsenen Tiere ernähren sich von Früchten und Baumsaft.
      In Afrika halten Kinder sie manchmal als Spielzeug und sie werden an Sammler verkauft.
  insect.bombardier_beetle:
    label: Bombardierkäfer
    summary: Ein Käfer, der als Verteidigung ein kochend heißes giftiges Gemisch verschießt.
    info: |
      Der Bombardierkäfer ist ein Käfer der Unterfamilie Brachininae, der sich auf einzigartige Weise verteidigt; er mischt zwei Chemikalien in seinem Hinterleib, wodurch eine explosive Reaktion mit über 100 Grad entsteht.
      Der hochgiftige Dampf wird mit einem lauten Knall bis zu 500-mal pro Sekunde verschossen.
      Er ist eines der faszinierendsten Beispiele chemischer Verteidigung in der Natur.
  insect.diving_beetle:
    label: Gelbrandkäfer
    summary: Ein räuberischer Wasserkäfer, der unter der Oberfläche schwimmt.
    info: |
      Der Gelbrandkäfer ist ein räuberischer Wasserkäfer der Familie Dytiscidae, der in Teichen und stehenden Gewässern lebt.
      Er schwimmt geschmeidig dank seiner flachen Hinterbeine, die wie Ruder funktionieren.
      Er atmet an der Oberfläche und speichert Luft unter den Flügeldecken.
      Er jagt Insekten, Larven, kleine Fische und Kaulquappen; er ist sowohl im Wasser aktiv als auch fliegt nachts.
  insect.velvet_ant:
    label: Ameisenwespe
    summary: Eine flügellose orange-schwarze Wespe, die wie eine Ameise aussieht.
    info: |
      Die Ameisenwespe ist in Wirklichkeit eine Wespe der Familie Mutillidae; die Weibchen sind flügellos und ähneln Ameisen.
      Sie haben auffällige rote oder orange Härchen als Warnung.
      Die Weibchen haben einen extrem starken Stachel, der Kuhtöter genannt wird.
      Sie parasitieren die Nester von Hummeln.
