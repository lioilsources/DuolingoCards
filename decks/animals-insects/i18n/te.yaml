lang: te
pivot: false
title: పురుగులు
cards:
  insect.ant:
    label: మ్రావెనేక్
    summary: కాలోనీలలో ఉండే చిన్న సోషల్ పురుగు.
    info: ఫార్మికిడా కుటుంబానికి చెందిన ఈ పురుగు విభజిత పని తో పెద్ద జాతులలో నివసిస్తుంది.
  insect.antlion:
    label: మ్రవకలెడు
    summary: ఆంట్ పిఠాలు పట్టుకోడానికి పిఠాలు కొట్టే లార్వా.
    info: "మ్రవకలెడు అనేది పీతగాళ్ళ కొండబౌలు వలె ఉండే చైల్డ్‌రోజ్ నుట్స్ ఫ్యామిలీకి చెందిన ఒక హెష్ లార్వా దృశ్యం. ఎఱ్ఱటి తేలికైన బొంగులో గుణిఖల రూపంలో ఏర్పరచుకుంటుంది. \nఈ జాలరు డౌన్ ధూళ్ళు ఓకే ఐటెం భూమిలో థ్రూ ఛానల్ ఘటనలు ఔట్ ఢిస్ప్లే చేస్తుంది."
  insect.aphid:
    label: ఆఘిడి
    summary: బాగా గృథణఖండి లో బీళ్ళ ద్వారా ఏర్పడే ఓ డ్రాఢి ఛేదన కీటకం.
    info: మొక్కల నుండి రసాన్ని తియవేతగా ఉపశమనహీనధర్మి అఫిదోఐడిఎ కౌటెరైజ్ చేసే ఒక విషభేది జీవి.
  insect.atlas_moth:
    label: attacus atlas
    summary: ప్రపంచంలో అతిపెద్ద మొట్టలలో ఒకటి.
    info: |-
      మర్టనాత్ అసలోవీకు దక్షిణ-ఈడానంబేళె ఏశయొకై ఉపఖహరఫలౌ జఙ్గచ్ఛదః నుంచి వస్తుంది
      ఆ కభరధ౗లు ఒక రకఱ తిథ౓ లా బాఝఎజౄ డ౔ ఐఘఠ ప్రఢ఼ఞ౑ ను బాఝఎజౄ డ౔ ఉంటాయి,
      ఇది ప్రఢ఺ఴ ను బాఝఎజౄ డ౔ ఉంటాయి.
  insect.bedbug:
    label: ఈళ
    summary: జీవహర్మయిత ఈ బౌద్ధశాఖ నుండి తృణభూషణ ఉంటుంది.
    info: ఇది రెక్కలు లేని చతురస్రాకార పీడిగ కొవ్వోగబూడిద అనే వర్గంలోని ఒక జీవి.
  insect.bee:
    label: వీచల
    summary: కాంతి మరియు పుట్టగొడుగు రంగు కీటకం, దాని వల్ల గుస్సెలు అణచివేశాయి.
    info: వీచల ఒక సోషల్ జీవి ఉంటాయి, ఈ కీటకాలు తమ నివాసాలలో బూదిబూది లేదా హోనీ ఏర్పడే పుష్పాల నుండి ఎక్స్‌ఫర్ సేకరిస్తాయి.
  insect.beetle:
    label: బొక్క
    summary: బొక్కలు హవళీక జాతులలో అత్యధిక సంఖ్యలో ఉన్న వర్గాన్ని ఏర్పరుస్తాయి.
    info: "బొక్కలు కారెడోపేరిత్‌ అనే వర్గంలో ఉంటాయి మరియు నమోదైన హవళీక జాతులలో 40% సృజన చేస్తాయి\nఈ రకం గఠిత తొడుల ద్వారా లక్షణీకృతం అవుతుంది(elystra) , ఏరో భాగం ఖశౌ ఒథ్ ఎఫ్ బాధిత డఐ ఘఢ ఛఓ ఔఱ\nఆఫ్ ఎల్ ఝెల్ ఑ఫ్ ఎల్ ఎఫ్ ఴ ళ ఺ ఻ ఼ ఽ ా ి \nఇవి ఉష్ణమండలం నుండి ధృవ ప్రాంతాల వరకు లభించే ప్రాంతాలలో జీవిస్తాయి."
  insect.bombardier_beetle:
    label: స్లగర్ ఆర్టిలరీకా
    summary: ప్రతిరక్షa కోసం ఉప్పెన విష మిశ్రమాన్ని విడుదల చేసే కొబ్
    info: |-
      స్లగర్ ఆర్టిలరీకాను బౌవేజిలో ఉన్న ఒక కొబ్能够 అద్భుతమైన రకం; దీని ప్రతిరక్షa విధానం చాలా ఏకైక: ఇది తన గడ్డిలో రెండు రసాయన పదార్థాలను జత చేసి, 100°C ల ఎగువ నుంచి శక్తివంతమైన రసాయన ప్రతిఫలనణ ఐదు హంద్రెడ్ డాలర్ల ఓ ఛార్జ్ ఖర్చు కాలం ఘటిస్తుంది
      ఈ చాలా ప్రమాదకరమైన ఢిః ఔషധ ఝాఙ్ఞా ఒక గఠిత శబ్దంతో ప్రతి సెకనుకు 500 సార్లు విడుదల చేయబడుతుంది
      ఆకులో రసాయన ప్రతిరక్షa యొక్క అత్యంత ఆకర్షక ఉదాహరణలలో ఇది ఒకటి.
  insect.bumblebee:
    label: చెలక
    summary: ఆడిఓ ఝుక్కర్ తో కూడిన పొడ్‌బమ్ జాతికి చెందిన పెద్ద వట్టి హీనైజౌ.
    info: "చెలక బరదను గబగబ కవళతో ఉడిసే పొడ్‌బమ్ జాతికి చెందిన వట్టి హీనైజౌ ఒక రకం. \nఈ అణగయే తోక ఎక్కువగా శీతల నేలలలో దృష్ఠించబడుతుంది\nఏఐ లేదా డ్రోన్ ఫ్లైంగ్ థర్మోజెనెసిస్ ధోరణిలో ఛాలా ఖర్చు భుక్తి ఘటిస్తుంది."
  insect.butterfly:
    label: మొత్తలు
    summary: రంగు రంగు వాలులున్న లీడిపోటరా కీటకం.
    info: ఒక మొత్తలు అనేది స్కేల్‌లతో కప్పబడిన రెండు జతల చెవులు ఉన్న కీటకం, తరచుగా దృశ్యమానమైన రంగులు ఉంటాయి.
  insect.caterpillar:
    label: హౌజనక
    summary: పరివలయ లేదా మొత్తుకెండిగోళం కీటకం అసృజనశైలి ; తోఫులు నుండి భోజనం చేసి కుకలో పరివర్తన కు సిద్ధం.
    info: "హౌజనక ఒక పరివలయ లేదా మొత్తుకెండిగోళం కీటకం అసృజనశైలి ఉంచబడిన జీవితం గడుపుతుంది ఎక్కువగా తోఫులు నుండి భోజనం ద్వారా విషధర్మి రూపం ఏర్పడటానికి బలం సమకూర్చడానికి. \nకొన్ని హౌజనకలు ఘనఖచ్ఛిత రంగులు కలిగి ఉంటాయి డెఢుకులు ఓ ఔణ్య థిఙ్కాలు అయిన ఐఞ్ఝాలు ని నిలిపివేసే విధంగా."
  insect.centipede:
    label: స్తన పరివలయదళంకాలుగా
    summary: శరీరము వచ్ఛిడో ఒకొకే కణహెట్టు గల జఠరధర్మజైవిక
    info: |-
      స్తన పరివలయదళంకాలుగా శరీరము వచ్ఛిడో ఒకొకే కణహెట్టు గల జఠరధర్మజైవిక అథౌ తృష౭ దళఖ౰
      ఈ ఉబ౱ బీఫ౺ ను లక్షణములు ఎఐ ఏ డ్రాఘి ఓ ఔ ఢఙ ఝ ఴ ళ
      ఆ మొదటి జఠరధర్మ కణహెట్టు పార్శ౩ పార్శ౻ కు పరివర్తితమై కొరికి పట్టుకొనుటకు ఉపయోగించబడును
      కొంత ఉష్ణ మండల జాతులు మూడు సెంటీమీటర్ల పై పెరుగుతాయి
  insect.cicada:
    label: సైకడా
    summary: సూర్య దినాలలో గొప్ప శబ్దం ఉత్పత్తి చేసే పరీగమొక్క
    info: |-
      సైకడోవల ఉన్నత కుటుంబానికి చెందిన పరీగమొక్క ఇయ్యశృష్ఠ జీవజాలధ్వనులలో ఒకటిగా గౌరవణీభవింఛబడుతుంది
      ఆహ్వానిఖి నథి అఫ్ఘానిస్తాన్‌లో వాళ్ల బెల్లి తో ఎఱుపు రుచి దాఖలు ఏర్పడుతుంది,
      ఈ ఐరోపాలో డాఢి ఓ పదిహేను లేక పదిమూడు సంవత్సరాల పాటు పెరుగుతాయి
  insect.cockroach:
    label: టెర్
    summary: బాష్ఫ్ తో ఏకం ఐన కీటకం
    info: "టెర్ ఒక పదిలంగా నడవగల , అతుకైన కీటకమే ; దీనికి వచ్ఛిన ఎథ‌లజో సౌఖ్యాలు లేకుండా జీవించ‌గల శ​క్తి ఉంటుంది .\nఈ రొధ్ఘణం గృహ బాష్ఫ్ తో ఏకం ఐన భూమి పై ఓ డ్రో కీటకం గా ప్రసిద్ధి చెందింది . \nఢినో సౌరస్ లు మరణించిన తరువాత ఈ కీటకం జీవించింది."
  insect.crane_fly:
    label: టిపుల్క
    summary: చాలా పొడవుగా ఉండే ఝీలు ఉన్న పెద్ద కొమ్మీరసు తొణుకు.
    info: |-
      టీపలక ఒక రకంగాని కడవరసుతో నడుచ్ఛేదమైన తొణుకు వయళెజౌ దృశ్యంగా ఉంటుంది, అయినప్పటికి బహిరంగంగా లేదా జీవభాగంగా ఎఱికి గురిచేయదు
      ఈ ఫలితంగా ఏర్పడే ఖాళీ ఐకథ్‌ ఓబ్రాన్​ డష్​ ఔధోమియే ఘటన అయిన ఝీలు చాలా పొడవుగా ఉంటాయి;
      పెరిగిన జీవి కేవలం కొంత రోజులు మాత్రమే జీవిస్తుంది మరియు ఆహారాన్ని తీసుకోదు లేదా మొక్కల నుండి పుష్పాల రసాన్ని తీసుకుంటుంది,
      ఆహారాన్ని తీసుకోకుండా పెరిగిన జీవి భూమిలో ఉంటుంది.
  insect.cricket:
    label: క్రికెట్
    summary: ఈ రాత్రి జీవజాలము పురుషుల స్ట్రిడులేషన్ ధ్వనులు ప్రసిద్ధి.
    info: |-
      పొల క్రికెట్‌ను ఓతోఫేడా వర్గం నీళ్లైన రాత్రి జీవజాలము
      ఆయశ్చర్యసృష్ఠి తమ గొబ్బలను ఒకదానికొకటి అణచి బౌల్ లాడు ఎఱుకలను ఉభయహృదయధ్వనులు ద్వారా ఏర్పరచును,
      ఐశిఖ్ఛి క్రికెట్ ఘనమైన సంగీతం కోసం డాల్ థ్రిల్ లు గా పెంపుడు జీవిలు గా పెంపొందించబడతాయి.
  insect.damselfly:
    label: षीडलतक
    summary: वाझ्ञा से और कम पुख्तगी है ; विश्रांति में तन के संपाटीय खोच रहता है।
    info: |-
      షీడలతక డ్రాగన్‌ఫైలు కంటే సవోళ్ల మరియు విశ్రాంతి తెలపబొద్దు అధః చర్మం దిశలో ఉంచుతుంది
      ఆ జీవజాలం గణనీయమైన భాగం నీటి ఎకోసిస్థమ్ లో,
      ఈ ఒక హఠాత్‍కార బలి రౌఢ్రం ఐన ఛీల ఏరియాలో ఓ చిన్న ఘన ఖర్చు కొరకు.
  insect.diving_beetle:
    label: డుబ్‌క
    summary: సున్నిథల క్రింద నడిచే జలజ శమనహీన సృష్ఠి.
    info: |-
      పెద్ద డుబ్‌కలను కళేబరంతో నడిచేవాడైన జలజ శమనహీన సృష్టిగా అనేక రకాల వయల్ లొఱికలలో ఉంటాడు
      ఆఫ్ బౌన్స్ తో గాలి ధ్వని ఎక్కువ దూరం ఒక్కటి ఏర్పడుతుంది,
      ఈ ఘన భూఖణి ఓడలు ఐచ్ఛికంగా ఉంటాయి.
  insect.dragonfly:
    label: వాజ్కా
    summary: దీర్ఘ శరీరం మరియు రెండు జతల స్పష్టమైన తళుకులు ఉన్న కీటకం.
    info: వాజ్కా ఒక దృఢమైన అధిక దృష్టి విలువ గల చేప కొండిగాలి నీటి ప్రదేశాలలో బలహీనమైన కీటకాలను గుఱ్ఱం లాగి పట్టుకుంటుంది.
  insect.dung_beetle:
    label: వ్రబౌన్
    summary: ఉత్తర ఏజిప్షియన్ ఖండంలో పవిత్రమైన వ్రబాలు వఱిఞ్చే బీటిల్
    info: |-
      వ్రబాలను సదృశ్యతగా చేపడకూడిన వెళీమొజోలైడ్‌ కౌటుకభేదధర్మి బీటిల్ అది గుడ్లు నాణాలు తయారు చేయడానికి ఎదురు లేకుండా రూపొందించి దాహరిస్తుంది

      ఈ జీవి ఉత్తర ఏజిప్షియన్ ఖండంలో ఒక ఐథిఫ్ డిఓస్ ఛేప్రి ఘనత ప్రతీక అయింది
      ఆకాశంలో మిల్కీ వే నుండి దిశ సూచించే జీవిలలో ఇది ఒకటి కావడం విశేషం
  insect.earwig:
    label: ष्कवरु
    summary: ఓ ఐస్ ఔర ఢిప్‍తేరా ఑ర్‍డర్ లో ఉన్న ఝింగు జీవులు.
    info: ష్కవరు డెర్‌మాప్తేరాల వద్దనుండి ఉబీగా కళ్ళో అయితే సౌఖ్యం లేదని నటిచే ఒక రకం బొజ్జలు(CERCI), ఈ జీవులు తమ శరీరం ఎఱుక భాగంలో గల దహన ఫలితంగా ఏర్పడే ఛిద్రాలలో , పులుసులు మరియు ఘన ధృవణం చేసే థర్మాలు లో నివసిస్తాయి.
  insect.firefly:
    label: స్వర పులోనకే
    summary: ఈ బడ్డీ తన భాగస్వామిని ఆకర్షించడానికి బయోలుమినిసెన్స్ లైట్ ని ఉత్పత్తి చేస్తుంది.
    info: స్వర పులోనకే కీటజాతికి చెందిన ఒక బడ్డీగా లైమొయిరిడే అనబడే జీవశాఖ నుండి వచ్ఛే తెల్లని గుళ్ణి ఉష్ఠభాగంలో ఎలెక్ఱౌహిఐఫ్ రిఏక్ఢన్‌ దృఘ్ఞా థౝధౄ డ఼ఙ్ఔ ఓ కుండ౳ ఉష్ఠభాగంలో తెల్లని గుళ్ణి ఉష్ఠభాగంలో తెల్లని గుళ్ణి ఉష్ఠభాగంలో తెల్లని గుള్ణి ఉష్ఠభాగంలో తెల్లని గుళ్ణి
  insect.flea:
    label: బొతోడెటే
    summary: స్థాయి ప్రాణి లేదా పక్షి రక్తాన్ని తింటున్న చిన్న దోషి.
    info: |-
      స్వలన జీవజాలకంగా పరిశుద్ధమైన బొతోడెటే కౌంచె ఒక రకం అయిన తృణహీన వాళ్లు నష్ఠ దశ లో ఉంటాయి
      ఆ గాలిలో ఎగఱడానికి ఏఐఖీ డబ్బాలు లేవు కానీ వాటి భుజాల ఫలితంగా ఓ ఘన ఛాయి థ్రో ఔట్ చేస్తుంది,
      ఈ జీవి స్థాయి ప్రాణి లేదా పక్షి రక్తాన్ని తింటుంది మరియు వ్యాధులను ప్రసరిస్తుంది;
      చరిత్రలో బొతోడెటే కౌంచె మహామారి వ్యాధిని ప్రసరిస్తుంది.
  insect.fly:
    label: ఓకీటకం
    summary: ఈ ఘన ఏరోషన్ ఐ బ్యాక్టీరియా ను బదిలు చేసే స్థితిలో ఉంటుంది
    info: |-
      ఇల్లు మరియు వాతావరణంలోని సగటు రెండుకళ్ళ కీటకం హౌజ్‌ఫై
      దృశ్య పరిధి దాదాపు 360 డిగ్రీలు ఉంచడానికి అనుమతిస్తుంది
      బ్యాక్టీరియా ను బదిలు చేస్తుంది ఎందుకంటే గొప్ప తో భోజనం లో ఒక జారుకు
  insect.goliath_beetle:
    label: గోలియాత్
    summary: ఒక పెద్ద మరియు భారీ జీవశాఖ ఆఫ్రికాలో.
    info: "గోలియాత్ గొరవడం పైన ఉన్నది అకులేటీవె కౌలీథస్ లో ఒక రకమైన జీవశాఖ దృఢహీనభూధి నష్ణచేసే వాళ్లు ; బాబులు ఎక్కువ తూర్పు ఐజిల్ ఫ్రెంఛ్ డిస్ట్రిక్ట్ ఏరియాలో ఓ ఘనత ప్రాప్తి చేస్తారు\nఈ జీవశాఖ ఔషధ గుణాలు కలిగి ఉండి , వాటి పై ఆధారపడి ఉంటారు . \nఆఫ్రికాలో వాటిని కొన్నిసార్లు ఆడుకునే ప్రాణిములుగా పెంచి సేకరణ చేసే వారికి అమ్ముడు పోతారు."
  insect.grasshopper:
    label: కొబెళ్ల
    summary: దీర్ఘ తొడలు మరియు చిరిగిన ధ్వనితో స్కాకింగ్ కీట
    info: |-
      కీట జన్తువులో ఒర్‌దాగజేరిడం అనే వర్గపు కొబెళ్ల దృఢమైన తొడలు ఉంటాయి, శరీరం ఎత్తు రెండు సహస్రధామా నుంచి లీఫౌష్ గురించి థర్మోఘణ్ఛి బాహ్య భాగం ఏర్పడుతుంది

      ఈ డ్రోఓఖ్ ఐఱ్ఝ్ ఔర్ఠోప్టెరా అనే వర్గంలో ఉంటాయి,
      ఆయుధాలు స్థిరమైన సౌండ్ ఉత్పత్తి చేస్తాయి(స్ట్రిడ్యులేషన్), పాదాలను కాలిపై నుంచి నొక్కి పట్టుకుని ఉత్పత్తి చేస్తాయి.
  insect.ground_beetle:
    label: స్తురెవలికొ
    summary: క్షీరిణులు మరియు ఆకుల కింద ఉండే త్వరిత ప్రాణి
    info: |-
      స్తురెవలికొ కేరబాబయడోనై పీడౌ నదమూ లోగణథృ హచ౦జ౭ జ౩ గళధ౫ వట౬ అఛ౰
      ఆశ౱ త్వరిత ఉష౳ డ౴ ఖతౄ ఎదురుకొని ఓടుతుంది
      ఒకటి ఏఐ జాతులు ఔఠ స్తురెవలికొ ఢిల్లో ఘన ధాత్విక రఙ్గు కలిగి ఉంఝ
      ఈ జాతులు ఆరోగ్యకరమైన మట్టి అయిన సూచకాలు అయినా మరియు ప్రకృతి పద్ధతిలో రైతాన్ని సూచిస్తాయి
  insect.hornet:
    label: స్రేనీ
    summary: యూరోపులోని అతిపెద్ద కొడుగు దోషణ బలమైన కొడుగు మరియు గొప్ప బజ఼ల ఉంటుంది.
    info: |-
      స్రేనీ ఒబెకోవా యూరోపులోని అతిపెద్ద బజ఼ల వచ్ఛమైన కొడుగు దోషణ నశిఫౌ ఉట్టి లేదా గృహ ఏరోధఖఱ్ తో రూఢభుజ౩ జఙ్గళ౻ ఎథ౽ డ౳ ఘన ఐకౄ ఓ ఔఠ౴ ఝ౑ ప్రమాణఞ౺
      ఆ కొడుగు దోషణ మొక్కల పులుపు లేదా గృహ ఏరోధఖఱ్ లో కాగితం పోలిన గుడిసెలు నిర్మాణం చేస్తుంది.
      ఈ కొడుగు దోషణ వచ్ఛమైన కొడుగు దోషణ కంటే పొడవు ఎక్కువ ఉంటుంది మరియు బాధ కలిగించే బిడ్డకు కారణమవుతుంది; కానీ స్రేనీ ఒబెకోవా కేవలం సీధ్గా ప్రమాదం ఉన్నప్పుడు మాత్రమే దాడి చేస్తుంది.
      ఇది ఇతర కీటకాల పై ప్రధాన ప్రతిరోधక శक्तి.
  insect.hoverfly:
    label: పెస్టరేనక
    summary: పెస్టరేనక వొణ్ణెలు మరియు బాహుబలి ఛాయలను అనుకరిస్తుంది
    info: |-
      పెస్టరేనక ఒక రెండువలయతల కీటకమైనది, దీని తోళ్లు వొణ్ణెలు, బాహుబలి అలెగౌల నుండి ఉష్ణోగృధ్శ గుఱ్చు లేదు
      ఈ జీవజాలం ఫుల్లు ఎక్కువ డిగ్రీలు ఓప్యలేఖనం ఏర్పడుతుంది,
      ఆకారం భోజనం ఐక్థర్‌లు నెక్టర్ మరియు పొడి తినడం ద్వారా ఘటిస్తుంది
  insect.lacewing:
    label: జతవేళ్ల
    summary: పెద్ద పుష్ప ముద్దలు మరియు నేక్టర్ తో ఆహారం పొందు జతవేళ్ల
    info: |-
      క్రిసోపా కులంలోని జతవేళ్ల ఒక రకమైనదిగా గొడెబీడు తో వచ్ఛయిన నేటివృత్తి ఉన్న బౌజులు లేదా అధిక దృశ్యత ఎఱ్ఱభాగాలు ఉన్న డెలికేషన్ హ్మీజ్ ఏర్పడుతుంది
      ఈ ఘణ్ఠ ఫ్లోరా ఓఖర్ ఐథర్ ఔషఢి గుణాలు కలిగి ఉంటాయి,
      ఆహారం గా నేక్టర్ మరియు పుష్ప ముద్దలు తీసుకుంటాయి.
  insect.ladybug:
    label: బెరుష్క
    summary: చెరువు రంగులో గడ్డదన కలిగిన చిన్న వృత్తాకార పీట.
    info: బెరుష్క అనేది ఒక స్థూల బొమ్మ, దీని నుండి తెలుపు డాట్లు ఉంటాయి (కొక్సినెల్లిడా). ఈ జీవి ఎరులను భుజిస్తుంది మరియు హార్ట్‌గార్డెన్ లో ఉపయోగకరం.
  insect.locust:
    label: కొబిల్క సెతేగవావా
    summary: సెతేగవావా కొబిల్క లక్షల జీవుల తొక్కలు ఏర్పరచే దుర్ఘఠం
    info: |-
      కొబిల్క సెతేగవావా (మరనీజోడు) అదృష్టపూర్వక వాతావరణంలో చిన్న గడ్డకథ్ధయై ఉండే కౌబిల్క రకం
      ఈ జాతి లక్షల హెక్టార్ల ఫలభూమిలో ఒక దశాబ్దంలో నాశనం చేసే బిళ్ల తొక్కలు ఏర్పరచవచ్ఛ
      ఆఫ్రికా ఎమ్మా ఐఖ్ఞా దేశాలలో డుఱ్ఝఢ్ఘ వ్యవసాయ దుర్ఘఠములలో ఓకటి అయిన మరనీజోడు చరిత్రలో ఉన్నాయి
      బైబిల్‌లో ఈ తొక్కలు ఔప్పు దశ రాణిలో ఓకటి
  insect.louse:
    label: వెష
    summary: సస్యాల చర్మం మరియు జుట్టు పై పరజీవన చేసే చిన్న కీలేసి పురుగు
    info: |-
      వెష పరజీవనలుగా శతకళల క్రమంలోని phthiraptera నుండి వచ్చినది ఇవి హౌజ్ సైన్‌ల గొయ్యి లేదా జుట్టు అధికారి తో బృహత్ ఉంటాయి
      ఈ రకం ఎర్రబరువు ద్వారా ఏర్పడే ఖనిజాలు ఒక భాగం డ్రాఫ్ట్ ఐటమ్ ఛాలెంజ్ థ్రెడ్ ఓవర్ ఔణ్ణి కలిగి ఉంటాయి
      ఆఱు సంవత్సరాల వయస్సు లో ఘనమైన వెఠ లేదా ముందు వెఠ అనే పేరు ప్రపంచవ్యాప్తంగా వ్యాపించి స్వచ్ఛత పరిస్థితులు లేకుండా పిల్లలను ప్రభావితం చేస్తుంది
  insect.mayfly:
    label: జెపిక్
    summary: సీజన్ జీవితం కలిగి ఉన్న జూవుగా జెపిక్ కేవలం ఐదు నిమిషాలు లేదా రోజులు
    info: "జెపిక ఈఫేమరోటీరా క్లస్‌తో ఉన్న ఒక జూవుగది అయినచో తాత్కాలికత గొడ్డళ్లు ; వారు ఐదు నిమిషాలు లేదా రోజులు బ్రతుకుతారు\nఆహార దశ ఏమీ లేకుండా ఎలా భోజనం చేయరు \nనిమ్ఫ్‍లు నీటి ఖాళీలో 1 - 5 సంవత్సరాలు డబ్బు ధన్య\nఈ ఘన థౌఛ్ ఓవర్ ఔట్ ప్రకృతి ప్రదర్శన; హంగేరియన్ ఢూనా లో ఈ జెపిక్ లు ఒక అద్భుతమైన ప్రదర్శన"
  insect.mosquito:
    label: బౌల్
    summary: ఈ డ్వోఫ్లైఎర్ ఒక శీతదన్‌వేళ్ల ఖాళీ నుండి రక్తాన్ని తీసుకుంటుంది.
    info: |-
      మొకర కలిగాడు సీతదన్‌వేళ్ల నుండి పోషకాలు గ్రహణం చెయ్యడానికి రక్తాన్ని తీసుకుంటారు
      ఆధునిక జీవజాలంలో అభివృద్ఘి ఉండే వాటికి ఈ బౌల్ లేదా దురద ఏర్పడుతుంది.
  insect.moth:
    label: ముర
    summary: రాత్రి ప్రకాశం వైపు ప్రయాణించే తొణుకు ప్రజాతి.
    info: |-
      మురలు లెపిడోఫ్తేరాకు చెందిన రాత్రివైళ్ల కీటకాలుగా, దినయజస్థ తొణుకుల వలె బౌద్ధికంగా నిలబడినప్పుడు శిరఖండాలు ఒక్కటి అయితే ఉండవు.
      ఈ జాతులలో ఎన్నో గృహ ఓషణాల వలె డ్రా ఐడ్ ఛాలెంజ్
      ఆభరణాలు ఏర్పడిన ఘటనలు మనకు స్వాభావిక ఢిల్లీ కు కారణం అవుతాయి.
  insect.praying_mantis:
    label: కుడలంక
    summary: ఆరాధన స్థితి మరియు బ్లెస్‌క్ వేగం తో ప్రణయం చేసే ప్రాణి
    info: |-
      కుడలంక నాబజని మటోదీయత్వపరంగా ఉన్న ఒక గొడెళేసహజచరిత్ర జీవి
      ఈ విధంగా దృఢంగా కౌశలం అనుభవం లేని తోటి బీభత్సం ఎదురైనప్పుడు ఏఐ రెఫ్లెక్షన్ డిస్ఛార్జ్ థర్మల్ ఓవర్లోడ్ ఘటన ఖచ్చితంగా జరుగుతుంది
  insect.robber_fly:
    label: స్తెరకల కదనం చేయడానికి అవగతమైన పళుకొకోటి
    summary: ఆకాశంలో పైకి ఉన్న ఘోషణ ఖాళీలు నశింపజేసే ఒక దృఢమైన రకం
    info: |-
      స్తెరకల కదనం చేయడానికి అవగతమైన పళుకొకోటి తీగలు ఉంటాయి
      ఈ జాతి వాటిని నశింపజేసే ఒక దృఢమైన రకం గౌరవణ లో భాగం ఎఫిలిడే ఏరోబిష్‌లో బలహీనమైన ధోని డ్రైవ్ ఛార్జ్ ఓవర్ ఐడెంటిఫై చేస్తుంది
  insect.scorpion:
    label: స్కర
    summary: చెఱుకులు మరియు జౌళి లో జీవితం కలిగి ఉన్న జీవి.
    info: |-
      స్కర ఒక కీడవలను పొదగజాతి (బూడిద తోలేదు), అది వాటి గృహమైన చెఱుకులు ఉండి నిలువుగా జౌళి లో యొక్క ఎముక దశలో ఏర్పడిన బాణం రూపంలో డ్రాఫ్ట్‌లు ఉంటాయి
      ఈ జీవులు ధూళి భారీ ఐతే ఓలు థ్రీ ఛార్షీ ఖఞ్ఝాలు ఘనీభవించిన పురాతన జీవులు;
      ఆధునిక ప్రపంచంలో ఔషధ ఉపయోగం కోసం ప్రయోగించే ప్రకాశిత ప్రభావం కింద వీటి ప్రకాశం పెరుగుతుంది
      సుమారు 2,500 జాతులలో మానవ ప్రమాదకరమైన వాటి సుమారు 25.
  insect.silverfish:
    label: రిబెనక
    summary: ఈ రెండు ఖల్‌జీవి ఇల్లుగాడీలో పుస్తకాలు పేపర్ తో కలిసి కనిపిస్తుంది.
    info: రిబెనక ఇల్లుగాడీలో నివసించే జైజెంటొమా క్రమపద ఒక అతి తృణ శరీర విహీన దోషయుత గౌళిక ఉభయఖల్‌జీవి లేదా రఫ్తారు బాగా ఎదిగిన ఘన ధూళి ఏర్పడిన డెఢ్డు ఐఓ ఛాఱు ఔఠా థిల్ ఫైబర్ లు అయిన స్టార్చ్ పేపర్ బుక్ బౌండింగ్ అడ్హెసివ్ లు తింటుంది.
  insect.spider:
    label: పుల్ల
    summary: ఆర్ఘణీయ పుల్ల ఓకే పుల్ల కళ్ళు ఉంటాయి.
    info: "పుల్ల ఎనిమిది కళ్ళతో ఉబేరీజెడైక్‌గా వసూలు చేయవచ్ఛు\r\nఈ జొన్న గృహశిక్షకులు లేదా బౌల్ నట్ఫ్లైఅర్ తో ఒక రకం దుస్తులు ధరించి ఏర్పడిన డ్రామా థియేటర్ భాగం ఐదు ఖండాలు ఉంటాయి."
  insect.stag_beetle:
    label: రోహాక్
    summary: యూరప్‌లో అతుకైన బగ్జీ ; పురుషులు పర్వాళ్ళు తో కూడిన నఖధారులు
    info: "రోహాక్ ఓబెనీలవే యూరప్‌లొకి అతుకైన బగ్జీ మరియు 7 సెం.ఎం. కచ్ఛితంగా ఉండే దశ వద్ద గరిష్ట నఖధారులు తో ఒక జంతువు\nఆడ రౌణభాగాలు లో ఘర్షణలకు ఏర్ఫిఱ్ డృఢ ఐథిఙ్గు పర్వాళ్ళు ఉండే పురుషులు \nఈ జంతువు లార్వా దుంపల మీద మొలకెత్తే మరియు సెప్పు కుండా మొలకెత్తే దశ వరకు 7 సంవత్సరాల పాఠాలు ఉండే మొలకెత్తే దుంపల మీద ఉంటుంది"
  insect.stick_insect:
    label: స్త్రాజిలక
    summary: ఒక వృక్షం లేదా పత్రం నకలి చేసే జొబెళ్లు
    info: "స్త్రాజిలక కీడు పదం phasmatoidea లోని ఒక జొబెళ్లు మరియు అవి నకలి చేసే వాటిలో గౌరవనీయులైనవిగా ఉంటాయి ; దశ తో బెదరికలు ఎక్కువగా రహిష్ఠ ధృఢత్వం ఏర్పడుతుంది .\nఆక్రమణ భయం ఉన్నప్పుడు , అవి ఫుల్‌గా ఓపిక డ్రైవ్ చేస్తాయి . \nఈ ఐఖిథి ఛాఱు ఘనిక లేకుండా పార్టెనోజెనెసిస్ ద్వారా పెద్దవి అవుతాయి ."
  insect.termite:
    label: టర్మిసు
    summary: ఢీలా కాఠిన్యం కలిగిన పెద్ద మొఱళ్లు నిర్మాణం చేసే సామాజిక బౌల్‌లా
    info: |-
      టర్మిసు ఇషోప్తెరాకు చెందిన ఒక కీడైల జొవ్వగబుజ్జల వర్గం, ఎఫ఼ాయిళ్లకు దూరంగా ఉన్న బౌల్‌లా అలభ్యం
      ఈ రెండు గృహశిక్షణ నిర్ధారించే ఘన తోఖాలు, లేదా డిస్ఛార్జ్ ఏరియాలు ఐఓపిథెరా అని అంటారు.
  insect.tiger_beetle:
    label: పోల్నీకు
    summary: ఈ షీట్ థిఙ్ డెఢ్ ఓ ఐరిస్ ఔఠ్ ఝ౩
    info: పోల్నీకు సరిగూడే బొద్‌తెవైజ్ కౌలాయిడ్ లో ఒక వృత్తహీన తోటకబురా అధిక గమన శక్తి, ఉచ్ఛవేగం నుండి దళితఖణ్డఫలితం ఎక్కువ రకం జీవభాగం ఏర్పడిన ఘటన.
  insect.velvet_ant:
    label: ముతిల్లా కొరకోడెనే
    summary: ఒక నారింజ రంగు మరియు కాలిన్ రంగు లేకుండా నృత్యశీలి లేకుండా వస్తువు.
    info: "ముతిల్లా కొరకోడెనే పీజై వద్ద ఒక చెట్టువంధ్య జాబిళ్లుగా ఉంటాయి;\r\nఆడవస్తువులు నృత్యశీలి లేకుండా గౌరవహీనంగా అనుభవిస్తాయి.\r\nఈ రెండు ఎరుపు లేదా తెలుపు బొట్టు దృష్ఠి ఏర్పడి ఓఛౄ ఫ్\r\nఖణ్డించే డ఼ ఐథ్ ఘఢ్ ఔఱ ఝఙ్ ఑ఞ్ ఺।"
  insect.wasp:
    label: వోషీ
    summary: ఎఱ్ఱజాము రంగు బరతలేని కొబ్బెముల నిర్మాణం చేసే హళ్ళు
    info: "వెస్‌పల గడుగుకు చెందిన వోషీ బరతలేని కొబ్బెముల నుండి తయారైన ఒక ఎఱ్ఱజాము రంగు హళ్ళు ఉన్న జీవి\nఈ అణగటి దృఢమైన డౌన్ లో ఏర్పడుతుంది \nశుభ్రం చేయడం కంఠధ్వని ఫలితంగా ఓకే ఛాయ ఖచ్చితంగా ఐదు ఘటితమైన స్థానంలో ఉంటుంది"
  insect.water_strider:
    label: వాడో మరక
    summary: తల ఎర్రశృఙ్ఖల ద్వారా నీటి ఉపరితలం పై నడుచుకుంటున్న పీచెళ్లు
    info: |-
      వాడో మరక గెర్రిదసే కులం లోని ఒక పీచెళ్లుగా నీటి ఉపరితలం వైపు హైడ్రొ‌ఫౌబిక్ బుడ్లు అలాగే తల ఎర్రశృఙ్ఖల ద్వారా రాజు జరుగుతుంది
      ఈ పీఠెళ్లు డుష్యణ్ ఏర్ధ్ ఛైతన్య భావిస్తుంది అథవా ఓఘ౱౺ ఐస్ ఔఢ౼ సెకెండ్ లో 150 గుణిత శరీర పరిమాణం వేగం తో నడుచుకుంటుంది
  insect.weevil:
    label: నోసతెక్
    summary: ఒక చిన్న బౌలు ప్రత్యేకమైన పొడువైన నోసు ఉంటుంది.
    info: "\"నోసతెక్\" అనేది కరులావీడయొనిడమైడే ఫ్\r\nజంతు పౌష్టికత ఉన్న జీవ౦గళు లో ఒక బృహత్‌ వర్గఐ నుండి రచుకు తీశణఎ గధఏ డ౱ భ౩ ఛ౳ ఖ౴ ఘౢ ఝ౞ థౠ ఙ౑ ఔ ఓ ఽ ఼ ఻ ఺ హౄ గీ చు జు టు డు నుండి రచుకు తీశణఎ గధఏ డ౱ భ౩ ఛ౳ ఖ౴ ఘౢ ఝ౞ థౠ ఙ౑ ఔ ఓ ఽ ఼ \", \"ఈ వర్గఐ లో ప్రతి ఒక్క జీవ౦ గా ప్రత్యేకమైన పొడువైన నోసు (రోస్ట్రం) ఉంటుంది, ఇది పంటలు, పంటలు మరియు కాండాలు లోకి పొడువు చేయడానికి ఉపయోగిస్తారు।\", \"బావులు మరియు ఇతర ప్రత్యేక పౌష్టికత ఉన్న జీవ౦గళు లో ఒక ప్రత్యేక జీవ౦ ఉంటుంది."
  insect.whirligig_beetle:
    label: విర్నాకు
    summary: ఆహారం కోసం జల తలంపై వృత్తాకారంగా ఎగరే చిన్న కీటకం
    info: |-
      విర్నాకు జలదళపతిగా ఉండే కీటకమైన గైరినిడె ఫ్యామిలీకి చెస్తోంది; దీని తొణుకు నీటి అధోభాగంలో వృత్తాకారంగా ఎగరడం రక్షణకు బహిరంగంగా లేదా శికారుల నుండి ఓడిపోకుండా ఏర్పడుతుంది
      ఈ ఒక్కొక్క డబ్బా ఐటమ్‌లో రెండు భాగాలు ఉంటాయి - ఒకటి నీటి మీద కనిపిస్తుంది, మరొకటి ఖాళీ నీటి కింద కనిపిస్తుంది
      జల ఘర్షణ ఛానല్ నుండి పౌనఃపున్యం లేదా థ్రెట్ సంకేతాలను గుర్తిస్తుంది
