lang: ar
pivot: false
title: الحشرات
cards:
  insect.ant:
    label: نملة
    summary: حشرة اجتماعية صغيرة تعيش في مستعمرات.
    info: النملة حشرة تكوّن مستعمرات كبيرة ذات تقسيم واضح للعمل.
  insect.antlion:
    label: أسد النمل
    summary: يرقة تحفر فخًّا مخروطيًّا في الرمل لاصطياد النمل المنزلق.
    info: |-
      أسد النمل يرقة حشرة تحفر فخًّا مخروطيًّا في الرمل الجاف.
      عندما ينزلق النمل إلى الحفرة تمسكه بفكّيها الكبيرين وتحقنه بعصارة هاضمة.
      يشبه البالغ اليعسوب ويطير عند المساء.
      يمكن لليرقة أن تعيش سنوات في التراب دون طعام.
  insect.aphid:
    label: المَنّ
    summary: حشرة صغيرة تمتص عصارة سيقان النبات وتفرز الندوة العسلية.
    info: |-
      المَنّ حشرات صغيرة تمتص عصارة النبات وتنتمي إلى فوق فصيلة المنّيات.
      تفرز مادة سكرية تُسمّى الندوة العسلية يحرسها النمل مقابلها.
      تتكاثر بسرعة هائلة حتى تصير أنثى واحدة أعدادًا كبيرة في وقت قصير.
  insect.atlas_moth:
    label: عثة أطلس
    summary: من أكبر العثث في العالم، بأجنحة ذات نقوش لافتة.
    info: |-
      عثة أطلس من أكبر العثث في العالم، إذ يصل باع جناحيها إلى 30 سم.
      أطراف الجناحين ملوّنة لتبدو كرأس أفعى فتُخيف المفترسات.
      البالغة بلا فم فلا تأكل إطلاقًا وتعيش أيامًا معدودة فقط.
      تعيش في الغابات الاستوائية بجنوب شرق آسيا.
  insect.bedbug:
    label: بق الفراش
    summary: حشرة مسطّحة تمتص الدم ليلًا وتختبئ في شقوق الأثاث.
    info: |-
      بق الفراش حشرة تنشط ليلًا وتعضّ المضيف النائم لتمتص دمه.
      يختبئ في شقوق المراتب والأثاث وخلف ورق الجدران.
      عاد إلى الانتشار عالميًّا في العقود الأخيرة بسبب السفر الدولي.
  insect.bee:
    label: نحلة
    summary: حشرة بنّية مصفرّة تنقل حبوب اللقاح وتصنع العسل.
    info: |-
      نحلة العسل (Apis mellifera) حشرة اجتماعية تعيش في خلايا وتصنع العسل.
      تؤدّي دورًا بالغ الأهمية في تلقيح النبات وتدافع عن نفسها بلسعتها عند التهديد.
  insect.beetle:
    label: خنفساء
    summary: تشكّل أكبر رتبة في الحشرات بأكثر من 400 ألف نوع موصوف.
    info: |-
      الخنافس أكبر رتبة حشرية على الإطلاق وتشكّل نحو 40% من كل أنواع الحيوان الموصوفة.
      لها غطاءان صلبان للجناحين تختبئ تحتهما أجنحة الطيران الحقيقية.
      تعيش في كل البيئات تقريبًا من الغابات الاستوائية إلى حافة المناطق القطبية.
  insect.bombardier_beetle:
    label: الخنفساء القاذفة
    summary: خنفساء تدافع بقذف خليط سامّ يغلي.
    info: |-
      الخنفساء القاذفة تمزج مادتين كيميائيتين في مؤخّرتها فتُطلق رذاذًا حارًّا تتجاوز حرارته 100 درجة.
      يخرج هذا الرذاذ السامّ بصوت انفجاري وعلى دفعات متتالية سريعة.
      وهو سلاح دفاعي بالغ الفعالية ضد المفترسات.
  insect.bumblebee:
    label: النحلة الطنانة
    summary: نحلة كثيفة الوبر ذات طنين عميق ودور مهمّ في التلقيح.
    info: |-
      النحلة الطنانة (جنس Bombus) نحلة كثيرة الوبر قريبة من نحلة العسل.
      وهي ملقِّح مهمّ خصوصًا في المناخات الباردة.
      تستطيع رفع حرارة جسمها بارتعاش عضلات الطيران فتطير في البرد، وهي أهدأ من نحلة العسل ولا تلسع إلا عند الخطر.
  insect.butterfly:
    label: فراشة
    summary: حشرة طائرة ذات أجنحة كبيرة ملوّنة.
    info: الفراشة حشرة لها زوجان من الأجنحة المكسوّة بالحراشف، وغالبًا ما تكون زاهية الألوان.
  insect.caterpillar:
    label: يرقة
    summary: طور يرقيّ للفراشة أو العثّة يأكل الأوراق ويتهيّأ للتحوّل.
    info: |-
      اليرقة الطور اليرقيّ للفراشة أو العثّة، تأكل الأوراق وتخزّن الطاقة استعدادًا للتحوّل.
      بعضها زاهي الألوان تحذيرًا من سُمّيّته.
      يحدث التحوّل الكامل داخل الشرنقة.
  insect.centipede:
    label: حريش
    summary: مفصليّ ذو زوج أرجل واحد في كل حلقة من جسمه.
    info: |-
      الحريش من عديدات الأرجل، له زوج أرجل واحد في كل حلقة، وعدد أرجله ليس مئة بالضرورة رغم اسمه الأجنبي.
      وهو مفترس سريع يصطاد الحشرات والديدان والفقاريات الصغيرة.
      تحوّل زوج أرجله الأول إلى مخالب تحقن السمّ.
      تتجاوز بعض الأنواع الاستوائية طولًا قدره 30 سم.
  insect.cicada:
    label: الزيز
    summary: حشرة تشتهر بغنائها العالي في أيام الصيف.
    info: |-
      الزيز من أعلى الحشرات صوتًا في أيام الصيف.
      يُصدر الذكر صوته بعضو خاصّ في بطنه لجذب الأنثى.
      لبعض الأنواع في أمريكا دورة حياة مدتها 13 أو 17 عامًا.
      تعيش الحوريات سنوات في التراب تتغذّى على عصارة الجذور.
  insect.cockroach:
    label: صرصور
    summary: حشرة ليلية نهمة شديدة التحمّل والتكيّف.
    info: |-
      الصرصور من أشدّ الحشرات تحمّلًا، ويصمد في ظروف قاسية تقتل غيره.
      تتجاوز أنواعه 4000 نوع لكن نحو ثلاثين منها فقط يعيش قرب البشر.
      حشرة قديمة موجودة منذ مئات ملايين السنين قبل الديناصورات.
  insect.crane_fly:
    label: ذبابة الرافعة
    summary: ذبابة كبيرة تشبه بعوضة عملاقة بأرجل طويلة جدًّا.
    info: |-
      ذبابة الرافعة تشبه بعوضة عملاقة لكنها لا تعضّ ولا تتطفّل.
      لها أرجل طويلة جدًّا تنفصل بسهولة كوسيلة دفاع.
      تعيش البالغة أيامًا معدودة ولا تكاد تأكل.
  insect.cricket:
    label: الجُدجُد
    summary: حشرة ليلية يشتهر ذكرها بالصرير.
    info: |-
      الجُدجُد حشرة ليلية من رتبة مستقيمات الأجنحة.
      يفرك الذكر جناحيه ليُصدر صريرًا يجذب الأنثى ويحدّد منطقته.
      يُربّى في آسيا منذ القديم للاستمتاع بصوته.
  insect.damselfly:
    label: اليعسوب الرشيق
    summary: يشبه اليعسوب لكنه أنحف ويطوي جناحيه عند الراحة.
    info: |-
      اليعسوب الرشيق قريب من اليعسوب لكنه أنحف، ويطوي جناحيه بموازاة جسمه عند الراحة.
      وهو مفترس يصطاد الحشرات الصغيرة طيرانًا، وتعيش يرقاته في الماء.
      يُعدّ مؤشّرًا على نقاء الماء.
  insect.diving_beetle:
    label: خنفساء الغوص
    summary: خنفساء مفترسة تسبح تحت سطح الماء بحثًا عن الفريسة.
    info: |-
      خنفساء الغوص خنفساء مفترسة سبّاحة تعيش في البرك والمياه الراكدة.
      تعمل أرجلها الخلفية المفلطحة كالمجاديف فتسبح بسلاسة.
      تصعد إلى السطح لتخزّن الهواء تحت جناحيها، وتصطاد الحشرات واليرقات والأسماك الصغيرة.
  insect.dragonfly:
    label: اليعسوب
    summary: حشرة ذات جسم طويل وزوجين من الأجنحة الشفافة.
    info: اليعسوب حشرة مفترسة حادّة البصر تصطاد قرب المسطّحات المائية.
  insect.dung_beetle:
    label: الجُعران
    summary: خنفساء تدحرج كرات الروث، وكانت مقدّسة في مصر القديمة.
    info: |-
      الجُعران خنفساء من فصيلة الجُعرانيّات، تُشكّل الروث كراتٍ تدحرجها ثم تدفنها وتضع فيها بيضها.
      كان رمزًا للشمس وللإله خبري في مصر القديمة.
      وهو الحيوان الوحيد المعروف الذي يهتدي بضوء درب التبّانة.
      يسهم في تدوير المغذّيات وتحسين التربة.
  insect.earwig:
    label: أبو مقص
    summary: حشرة مستطيلة لها كمّاشة في طرف بطنها.
    info: أبو مقص حشرة يُشاع أنها تدخل الأذن، لكن هذا مجرّد خرافة لا أساس لها.
  insect.firefly:
    label: اليراعة
    summary: حشرة تُصدر ضوءًا حيويًّا لجذب الشريك.
    info: |-
      اليراعة حشرة من فصيلة اليراعيّات تُصدر ضوءًا باردًا من طرف بطنها.
      يستخدم الذكر والأنثى أنماط وميض مختلفة للتعارف والتجاذب.
      ينشأ الضوء من تفاعل مادة اللوسيفيرين مع إنزيم.
      وهي مؤشّر على نظافة البيئة الطبيعية.
  insect.flea:
    label: البرغوث
    summary: حشرة طفيلية صغيرة تمتص دم الثدييات والطيور وتقفز بعيدًا.
    info: |-
      البرغوث حشرة عديمة الأجنحة تقفز بأرجلها الخلفية القوية مئات أضعاف طول جسمها.
      يمتص دم الثدييات والطيور وقد ينقل الأمراض.
      عُرف تاريخيًّا بنقله وباء الطاعون.
  insect.fly:
    label: الذبابة المنزلية
    summary: ذبابة شائعة تحمل الأوساخ وقد تنقل الأمراض.
    info: |-
      الذبابة المنزلية (Musca domestica) أكثر الذباب شيوعًا حول مساكن البشر.
      ترى بعينيها المركّبتين نحو 360 درجة تقريبًا.
      تنقل الجراثيم إذ تحطّ على القمامة والطعام.
      لها زوج أجنحة طائر واحد، والزوج الآخر يوازن الطيران.
  insect.goliath_beetle:
    label: خنفساء جالوت
    summary: من أضخم وأثقل حشرات الأرض، موطنها أفريقيا الاستوائية.
    info: |-
      خنفساء جالوت من أثقل حشرات العالم، إذ يبلغ وزن الذكر نحو 100 غرام وطوله أكثر من 11 سم.
      تعيش في الغابات الاستوائية بأفريقيا الاستوائية.
      تتغذّى البالغة على الفاكهة وعصارة الأشجار، وهي مرغوبة لدى هواة الجمع.
  insect.grasshopper:
    label: الجُندب
    summary: حشرة عاشبة تقفز بأرجلها الخلفية الطويلة.
    info: |-
      الجُندب حشرة من مستقيمات الأجنحة ذات أرجل خلفية قوية تقفز بها أضعاف طول جسمها.
      يُصدر الذكر صوتًا مميّزًا بفرك فخذه بجناحه.
      وهو عاشب، وقد تُلحق أسرابه الكبيرة ضررًا بالمحاصيل.
  insect.ground_beetle:
    label: خنفساء أرضية
    summary: خنفساء مفترسة سريعة تعيش تحت الحجارة والأوراق.
    info: |-
      الخنفساء الأرضية من فصيلة الخنافس الأرضية.
      معظمها مفترسات ليلية نشطة تصطاد الحشرات والديدان والحلزون.
      تتحرّك بسرعة وتهرب فورًا عند الخطر.
      لبعض الأنواع بريق معدنيّ جميل، وهي مؤشّر على تربة سليمة.
  insect.hornet:
    label: الدبّور
    summary: أكبر زنابير أوروبا، قويّ اللسعة عالي الطنين.
    info: |-
      الدبّور أكبر الزنابير الاجتماعية في أوروبا ويبلغ طوله نحو 3.5 سم.
      يبني عشّه الورقيّ في تجاويف الأشجار أو تحت السقوف.
      لسعته أطول وأشدّ إيلامًا من الزنبور العاديّ لكنه لا يلسع إلا عند التهديد المباشر.
      وهو مفترس مهمّ لحشرات أخرى.
  insect.hoverfly:
    label: ذبابة الأزهار
    summary: ذبابة تشبه النحل لكنها لا تلسع، وملقِّح مهمّ في الحدائق.
    info: |-
      ذبابة الأزهار تقلّد ألوان النحل والزنابير لتتّقي المفترسات (تقليد باتيسي).
      لكنها في الحقيقة لا تلسع.
      وهي ملقِّح مهمّ يزور من الأزهار أكثر مما يزوره النحل.
      تتغذّى يرقات بعض الأنواع على المَنّ.
  insect.lacewing:
    label: أسد المَنّ
    summary: حشرة ذات أجنحة شبكية شفافة، ويرقاتها تأكل المَنّ.
    info: |-
      أسد المَنّ حشرة ذات أجنحة شبكية شفافة وعيون ذهبية.
      تفترس يرقاتها المَنّ بكثرة فتكون مكافحًا طبيعيًّا للآفات.
      تتغذّى البالغة على الرحيق وحبوب اللقاح وتنجذب إلى الضوء.
  insect.ladybug:
    label: الدعسوقة
    summary: حشرة صغيرة مستديرة حمراء ذات بقع سوداء.
    info: الدعسوقة حشرة نافعة في الحدائق إذ تتغذّى على المَنّ.
  insect.locust:
    label: الجراد
    summary: جندب يشكّل أسرابًا مدمّرة من ملايين الأفراد.
    info: |-
      الجراد جندب يكوّن في ظروف معيّنة أسرابًا مهاجرة هائلة.
      قد يضمّ السرب مليارات الأفراد ويُتلف مساحات زراعية شاسعة في يوم واحد.
  insect.louse:
    label: القملة
    summary: حشرة طفيلية صغيرة عديمة الأجنحة تعيش على المضيف.
    info: |-
      القملة حشرة طفيلية عديمة الأجنحة تعيش على جلد المضيف وشعره.
      تمتص الدم وتسبّب الحكّة.
      قملة الرأس منتشرة عالميًّا وتصيب الأطفال بصرف النظر عن النظافة.
      نقلت تاريخيًّا أمراضًا مثل التيفوس.
  insect.mayfly:
    label: ذبابة مايو
    summary: حشرة لا يعيش بالغها إلا ساعات أو أيامًا.
    info: |-
      ذبابة مايو رمز للزوال، فالبالغ لا يعيش إلا ساعات إلى يوم.
      فمه ضامر فلا يأكل إطلاقًا.
      تعيش الحورية في الماء من سنة إلى ثلاث سنوات.
  insect.mosquito:
    label: البعوضة
    summary: حشرة ذات جناحين، تمتص أنثاها الدم وقد تنقل الأمراض.
    info: |-
      البعوضة حشرة ذات جناحين من فصيلة البعوضيّات.
      تمتص الأنثى الدم لتحصل على بروتين البيض، ويتغذّى الذكر على رحيق الأزهار.
      تنقل أمراضًا خطيرة كالملاريا وحمّى الضنك.
  insect.moth:
    label: العُثّة
    summary: قريبة الفراشة، تنشط ليلًا وتطوي جناحيها جانبًا عند الراحة.
    info: |-
      العُثّة قريبة من الفراشة من رتبة حرشفيات الأجنحة، لكنها تطوي جناحيها جانبيًّا عند الراحة بخلاف الفراشة.
      ينجذب كثير منها إلى الضوء الاصطناعيّ.
      تنتج يرقة دودة القزّ خيط الحرير الطبيعيّ.
      وتُعدّ عثّة القمر من أجمل العثث في العالم.
  insect.praying_mantis:
    label: فرس النبي
    summary: حشرة مفترسة بوضعية تشبه الصلاة وضربة خاطفة.
    info: |-
      فرس النبي حشرة مفترسة سُمّيت بذلك لأنها تضمّ قائمتيها الأماميتين كأنها تصلّي.
      تمدّ قائمتيها في لمح البصر لتخطف الفريسة.
      في بعض الأنواع تأكل الأنثى الذكر بعد التزاوج.
  insect.robber_fly:
    label: الذبابة اللصّة
    summary: ذبابة مفترسة تخطف الحشرات الأخرى في الجوّ.
    info: |-
      الذبابة اللصّة ذبابة مفترسة تصطاد الحشرات الأخرى وهي طائرة.
      لها أرجل قوية تمسك بها الفريسة وفم مدبّب يحقن سمًّا مشلًّا.
      تقلّد بعض الأنواع النحل أو الزنابير حماية لنفسها.
  insect.scorpion:
    label: العقرب
    summary: عنكبوتيّ ذو كمّاشتين وذيل منحنٍ سامّ.
    info: |-
      العقرب من العنكبوتيّات (وليس حشرة)، له كمّاشتان وذيل منحنٍ ينتهي بإبرة سامّة.
      حيوان قديم جدًّا، فأقدم أحافيره يعود إلى نحو 430 مليون سنة.
      يتوهّج تحت الأشعّة فوق البنفسجية.
      من نحو 2500 نوع لا يشكّل خطرًا على الإنسان سوى 25 نوعًا تقريبًا.
  insect.silverfish:
    label: سمكة الفضة
    summary: حشرة صغيرة سريعة بلا أجنحة تكثر قرب الكتب والورق داخل المنازل.
    info: |-
      سمكة الفضة حشرة بدائية عديمة الأجنحة تعيش داخل المنازل.
      تتغذّى على النشا والورق وغراء الكتب والألياف.
      اسمها من لونها الفضّيّ وحركتها المتموّجة كالسمكة.
      وهي من أقدم الحشرات إذ لم تكد تتغيّر منذ مئات ملايين السنين.
  insect.spider:
    label: العنكبوت
    summary: مفصليّ ذو ثماني أرجل ينسج شباكًا لاصطياد الحشرات.
    info: |-
      العنكبوت من العنكبوتيّات (وليس حشرة)، له ثماني أرجل وجسم من جزأين.
      ينتج خيطًا حريريًّا ينسج به شباكه ويغلّف فرائسه وبيضه.
      يوجد في العالم نحو 48 ألف نوع.
      كلها تنتج سمًّا لكن معظمها لا يؤذي الإنسان.
  insect.stag_beetle:
    label: خنفساء الأيّل
    summary: أكبر خنفساء في أوروبا، ولذكرها فكّان كالقرنين.
    info: |-
      خنفساء الأيّل (Lucanus cervus) أكبر خنفساء في أوروبا ويصل طولها إلى نحو 7 سم.
      للذكر فكّان ضخمان كقرني الأيّل يستخدمهما في القتال على الإناث.
      تعيش اليرقة حتى سبع سنوات داخل خشب البلّوط المتحلّل.
  insect.stick_insect:
    label: حشرة العصا
    summary: حشرة تحاكي الغصن أو الورقة محاكاة دقيقة.
    info: |-
      حشرة العصا من رتبة الشبحيّات وهي بارعة في التمويه.
      يحاكي جسمها الأغصان والأوراق محاكاة تامّة.
      تبقى ساكنة تمامًا عند الخطر.
      تتكاثر بعض أنواعها دون ذكور، وتُربّى للمشاهدة.
  insect.termite:
    label: النمل الأبيض
    summary: حشرة اجتماعية تبني تلالًا ضخمة من الطين.
    info: |-
      النمل الأبيض حشرة اجتماعية تربطها قرابة بعيدة بالنمل.
      يعيش في مستعمرات فيها ملك وملكة وجنود وعمّال.
      يبني في المناطق الاستوائية أعشاشًا معقّدة يصل ارتفاعها إلى نحو 9 أمتار ولها نظام تهوية.
  insect.tiger_beetle:
    label: خنفساء النمر
    summary: خنفساء مفترسة سريعة جدًّا حادّة البصر ذات بريق معدنيّ.
    info: |-
      خنفساء النمر خنفساء مفترسة تجمع بين سرعة العدو والطيران وحدّة البصر.
      من فرط سرعتها يغيب عنها البصر أثناء الجري فتقف لتعيد التوجيه.
      لها جسم برّاق بألوان خضراء وزرقاء وحمراء وعينان كبيرتان.
      تحفر يرقاتها أنفاقًا عمودية في التراب وتكمن عند فوّهتها لتصطاد الفريسة.
  insect.velvet_ant:
    label: النملة المخملية
    summary: أنثى دبّور بلا أجنحة مكسوّة بوبر زاهٍ ولها لسعة موجعة جدًّا.
    info: النملة المخملية في الحقيقة أنثى دبّور بلا أجنحة (فصيلة Mutillidae) مكسوّة بوبر يشبه المخمل وتبدو كالنملة.
  insect.wasp:
    label: الزنبور
    summary: حشرة لاسعة صفراء وسوداء تبني أعشاشًا ورقية.
    info: الزنبور حشرة لاسعة بألوان تحذيرية صفراء وسوداء تبني عشّها من مادة ورقية.
  insect.water_strider:
    label: عدّاء الماء
    summary: حشرة صغيرة تمشي على سطح الماء الراكد بفضل التوتّر السطحيّ.
    info: عدّاء الماء حشرة تمشي على سطح الماء دون أن تغوص بفضل التوتّر السطحيّ وأرجلها المكسوّة بوبر طارد للماء.
  insect.weevil:
    label: السوسة
    summary: خنفساء صغيرة ذات خرطوم طويل مميّز.
    info: |-
      السوسة خنفساء صغيرة من فصيلة السوسيّات، وهي من أكبر فصائل الحيوان بأكثر من 60 ألف نوع.
      تستخدم خرطومها الطويل المميّز لثقب الثمار وسيقان الأشجار.
      بعض الأنواع آفات زراعية مهمّة كسوسة القطن، وبعضها يتخصّص في نبات واحد.
  insect.whirligig_beetle:
    label: الخنفساء الدوّارة
    summary: خنفساء مائية صغيرة تدور في جماعات على سطح الماء.
    info: |-
      الخنفساء الدوّارة خنفساء مائية تدور في جماعات على سطح الماء تصطاد وتتّقي المفترسات.
      عينها مقسومة قسمين، قسم يرى فوق الماء وآخر يرى تحته.
