lang: ar
pivot: false
title: الحشرات
cards:
  insect.ant:
    label: نمل
    summary: حشرة اجتماعية صغيرة تعيش في مستعمرات.
    info: النمل هو حشرة تشكل مستعمرات كبيرة مع تقسيم للعمل، وتعيش هذه الحشرات الاجتماعية الصغيرة ضمن مجموعات منظمة.
  insect.antlion:
    label: خنافس النمل
    summary: يرسم خنفساء يحفّ في الرمال لصنع فكاك للنحل.
    info: |-
      الخمفيس هو طور حشرة من عائلة المايكيلونتيدي، حيث تُحفر كهوفًا مخروطية داخل رماد جافة.
      عندما تسقط نحلة إلى الفكيكة، فإن الخمفيس يستخدم أسنانها لتثبيت الضحية وحقنة بسائل هضمي
      而成虫则不显眼，类似蜻蜓，并在夜间飞行。
      这些幼虫可以在没有食物的情况下，在地下存活多年。
  insect.aphid:
    label: المن
    summary: حشرة صغيرة تسمس على سيقان النباتات؛ تنتج عسلًا.
    info: إن المن حشرات دقيقة تنتمي إلى فئة الأفيدويديا، وتتغذى على العصارة النباتية. أنها تُنتِج شمعًا لزجًا يهتم به اليراعون مقابل الحماية من أعدائها. كما أن هذه الكائنات قادرة على التكاثر بسرعة هائلة حيث يمكن لإحدى الإنثى إنتاج ملايين الصغار خلال عام واحد فقط.
  insect.atlas_moth:
    label: مارتيناتش أطلسوفي
    summary: أحد أكبر فراشات الليل في العالم مع جناحين يحملان نقشاً على هيئة رؤوس الثعابين.
    info: |-
      يُعتبر مارتيناته تش الأتلانتشي واحداً من أعظم حشرات الفراغ ليليًا، حيث يصل امتداد الجناح إلى ما قيمته حتى ٣٠ سم.
      تتميز حواف جناحيه بلون يجعلها تشبه رأس ثعبان؛ مما يساعد على طرد المفترسين.
      الكبار لا يتغذى إطلاقاً لأن لديهم أفواجاً ويعيش فقط عدة أيام كبالغين.
      وهو موجود بالفعل بداخل غابة استوائية آسيوية.
  insect.bedbug:
    label: البرغية
    summary: كائن مسطح يمص الدم ليلاً؛ يستتر في شقوق الأثاث.
    info: البرغية المنزلية هي حشرة مستديرة ومسطحة تنتمي إلى عائلة Cimicidae، وهي نشطة بشكل رئيسي خلال الليل. تعض الضيف النائم وتسحب دمه. تستر نفسها داخل الشقوق الموجودة بالمراتس والأثاث والجدران المبطنة. انتشرت هذه الحشرة على نطاقٍ عالمي بسبب السفر الدولي.
  insect.bee:
    label: نحل
    summary: حشرة صفراء داكنة تُخصب الزهور وتنتج العسل.
    info: النحلة المُعسليّة هي حشرة اجتماعية تسكن في الأعشاش وتحصل على عصير النباتات، كما أنها تلعب دورًا مهمًا في عملية التلقيح.
  insect.beetle:
    label: بُرُوك
    summary: يتشكل البروك من أكبر رتبة في الحشرات، وتحتوي على أكثر من ٤٠٠ ألف نوع موصوف.
    info: البروك ينتمي إلى الرتبة كوليوبيتيرا ويشكل حوالي ٤٠٪ من جميع أنواع الآفات الموصوفة. يتميز بجناحين صلبين قويين (الأليتر)، تحتهما توجد الجناحان الحقيقيتان الطائرتين. إن جَيلِنيا هو أضخم براغيث إروبا؛ الذكر لديه فكّان كبيران شبه خفافيش. تسكن هذه الكائنات تقريبًا كل البيئات بدايةً من المناطق الاستوائية حتى الأراضي القطبية.
  insect.bombardier_beetle:
    label: الدودة المدفعية
    summary: حشرة تطلق خليطاً سامًا مغلياً كوسيلة دفاع.
    info: |-
      تُعد الدودة المدفعية نوع من البرمائيات تنتمي إلى فئة الـ Carabidae، وتفترس بطريقة غير عادية؛ حيث تمزج بين عنصرين كيميائين في جسمها لتكوين رد فعل انفجار يولد حرارة أعلى من درجة الحرارة بمئتين درجة مطلقة.
      بخار السمية العالية يتم طرده بسرعة هائلة حتى ٥٠٠ مرة بالثانية مع إصدار صوت قوي.
      وهي واحدة من أمثل الأمثلة على الدفاع الكيمياوي داخل الطبيعة.
  insect.bumblebee:
    label: نحل بومبوس
    summary: 벌레 크고 털 많은 벌로 깊은 윙윙 소리를 내며 중요한 수분자이다.
    info: |-
      النحلة من نوع Bombyx هي حشرة كبيرة وعديمة الشعر تنتمي إلى جنس البومة، وهي قريبة من النحلة العاملة في تربية الشمع.
      إنها مُلقِّحة مهمة خصوصًا المناخات الباردة حيث لا تستطيع النمل أن تطير كثيراً هناك.
      يمكن للبومة التدفئة عن طريق ارتعاش عضلات الطيران حتى أنها يمكن طيارتها تحت ةظروف البرودة.
      مقارنة بالنحالة فإن نحل البومة أكثر هدوءاً ولا يلدغ إلا عند الخطر المباشر.
  insect.butterfly:
    label: نَمْلَق
    summary: حشرة طائرة لها أجنحة ملونة كبيرة.
    info: النملق هو حشرة تملك زوجين من الأجنحة المغطاة بالشُّعَب، وغالباً ما تكون هذه الأجنحة لونها بارز.
  insect.caterpillar:
    label: حُوشَنْكَا
    summary: يراع لطراشة أو مورّي؛ تأكل الأوراق وتستعد للتحول إلى كوكولا.
    info: |-
      الحوشنكة هي يراعة طاراشية أو موري، وتقضي معظم حياتها بتناول أوراق النباتات لتجميع الطاقة اللازمة للتغيير الجذري في شكلهـا.
      بعض الحوشكنت لها الوان جلية تحذر منها المفترسون من سميتهما
      عند التكوكيول فإنها تصمم الكوكولة حيث يحدث فيها تعديل كامل على الشكل ليصبح ناضجًا.
  insect.centipede:
    label: ستونوژكا
    summary: كائن من الفصيلة المفصليّة له زوج واحد من الأرجل في كل قطعة جسمية.
    info: الستونوچا تنتمي إلى فئة الشيلوبودا ولها زوج واحد فقط من الساقين على كل حلقة بدلاً من مائتي ساقة كما يشير الاسم، وهي كائنٌ سريع يتغذى بالحشرات والديدان وحيوانات صغيرة أخرى. تتحول أول زوج من أقدامه إلى أسنان مشقوقة لحقن الضحايا بسامة لتثبيتها.
  insect.cicada:
    label: الصراصير
    summary: حشرة معروفة بغناءها العالي في الأيام الحارة.
    info: |-
      تُعتبر الصراصر حشرات من الفرعينيّا 'سيكادوييد' تشتهر بإنتاج أقوى الأصوات بين جميع أنواع الحشرات.
       الذكور تنتج صوتًا عاليًا باستخدام غشاء خاص يسمى التيمبال على ظهورهم لجذب الإناث.
       بعض الأنواع الموجودة بالولايات المتحدة الأمريكية لها دورة حياتية مدتها سبع عشر أو ثلاثة عشر عامًا.
  insect.cockroach:
    label: خنفساء
    summary: حشرة ليلية سريعة الأكل، مقاومة جدًا وقابلة للتكيف.
    info: |-
      الخنافس واحدة من أكثر الحشرات تحمل الظروف على الأرض؛ يمكنها الصمود أمام الإشعاع والبيئات التي ستقتل الكائنات الأخرى.
      هناك ما يزيد عن ٤٥٠٠ نوع، لكن فقط حوالي ثلاثين منها تعيش بالقرب من البشر.
      it is an ancient bug - cockroaches have existed for over three hundred million years, surviving dinosaurs.
  insect.crane_fly:
    label: تيبيولكا
    summary: ذبابة كبيرة تشبه البعوضة ذات أرجل طويلة بشكل استثنائي.
    info: |-
      تيبولا هي حشرة ثنائية الأجنحة من عائلة التيوبيليدا، وتشبه بصريًا بعوضة عملاقة ولكنها لا تمتص الدم ولا تتغذا كطفيلي.
      a أن ساقيها الطويلتين جدًّا يمكن فصلهما легко؛ وهو آلية دفاعية (الانفصال الذاتي). يعيش البالغون فقط عدة أيام دون تناول طعام أو يتغذيون على العسل النحل.
      a أما اليراعيات (أو الخيوط الأرضية)، فإنها تسكن في التربة وتتناول الجذور.
  insect.cricket:
    label: خنفساء
    summary: حشرة ليلية معروفة بنباح الذكور.
    info: |-
      الخنفساء الحقلية هي حشرات ليلاوية تنتمي إلى رتبة الأورثوبتيرا.
      ينبах ذكر الخنفساء عن طريق فرك جناحيه، مما يجذب الإناث ويحدد أراضيه.
      في آسيا يتم تربية خنافس تقليدياً كأصدقاء منزليين بسبب نباحها الجميل.
      كما أنهم يعتبرون في العديد من الثقافات رمزاً للراحة المنزلية والسعادة.
  insect.damselfly:
    label: شيدلاته
    summary: كائن مشابه للوافلة ولكنه أ修长؛ يطوي جناحيه بشكل متوازي مع الجسم أثناء الراحة.
    info: الشيذلات هي حشرات تشبه الوافلات، لكنها أكثر نحافة وعندما تستريح فإنّها تطي الجوانب موازيةً لجسمها على عكس الوافلات. إنها كائن مفترس ويصطاد الحشرات الصغيرة في الجو. أما فراхиدها فقد تسكن المياه وهي عنصر مهم من نظام البيئة المائية وتستخدم أيضًا كمؤشر لمدى صفاء التدفق المائي.
  insect.diving_beetle:
    label: الغواصة
    summary: نملية مفترسة تسبح تحت سطح الماء.
    info: الغواص الكبير هو نمليّة مُرَوِّي من عائلة الدايتيسكيداي يعيش في البرك والمياه الثابتة، وينتقل بسلاسة بسبب أقدامه الخلفية العريضة التي تعمل كمجاديف. يستنشق الهواء على السطح ويحتفظ به أسفل جناحيه لتنفسه تحت المياه. يتغذى على الحشرات واليراع الصغار وبعض الأسماك وحتى الديدان؛ وهو فعّال سواءً كان غارقاً أو طائراً ليلا.
  insect.dragonfly:
    label: ذُبَابَة الْوَجِيز
    summary: حشرة ذات جسم طويل وفتاتين من الأجنحة الشفافة.
    info: ذُبابَة الْوَجِيز هي حشرة مفترسة تتميز برؤية ممتازة، وتتغذى قرب المسطحات المائية.
  insect.dung_beetle:
    label: الدودة المقدسة
    summary: حشرة تُكوّن كريات من فضلات الحيوانات وتتحرك بها، وتعتبر مقدَّساً في مصر القديمة.
    info: |-
      الدودة المقدسة هي حشرية تنتمي إلى عائلة سكاراباييداى التي تقوم بتشكيل الفضلات لكرات صغيرة وإدارتها للburying والوضع البيوض.
      كانت رمزاً للمشمس والإله خبيروفي مصر القديمة.
      وهي واحدةٌ نادرة جداً من الكائنات الحيَّة القادرة على التوجيه باستخدام درب السماء.
      تساعد هذه الدودة أيضاً إعادة دورة المواد الغذائية وتهوية الأرض.
  insect.earwig:
    label: الشَّقْرُور
    summary: حشرة ممدودة مع خصلات على نهاية الظهر.
    info: يتميز الشقرورو بخصلاته المميزة، والتي تستخدم للدفاع والتكاثر؛ يعتقد الناس أن هذه الحيوانات تسكن في الأذن وهذا غير صحيح. إن الإنثى من هذا النوع فريدة لأنها تحافظ على البيض ويربي صغارها وهو أمر نادر بين الحشرات. ويوجدون عادةً داخل الفتحات أو تحت الصخور وأيضًا ضمن أكوام الأعشاب.
  insect.firefly:
    label: سَمُوكة
    summary: حشرة تنتج ضوءًا بيولوجيًّا لجذب الشريك.
    info: |-
      السموك هي حشرات من فصيلة اللامبيريداي قادرة على إنتاج نور بارد يشبه الضياء البيولوجيا في مؤخرتها،
      كلا الجنسين الذكر والأنثى يستخدمان أنماط مختلفة للضوء للتعرف ولفت الانتباه إلى بعضهما البعض،
      ويتم التحكم بهذا الإضاءة عبر رد فعل كيميائي بين مادة الليسيفيرن مع إنزيم الليسيراز.
      The glow is controlled by chemical reactions involving luciferin and luciferas.
  insect.flea:
    label: نملة
    summary: حشرة صغيرة تกระت وتسايل الدم من الثدييات والطيور.
    info: النَّمْلُ حِرَاشٌ مخصص للعيش كفطريات، يفتقر إلى الأجنحة ويتميز بقدرات قفز عالية جداً نسبيًا لحجمه الصغير. يمكن أن يتخطى النمل فترات طويلة أثناء القفز بأطرافه الخلفية المتينة. كما أنه يستنزف دماء الحيوانات العليا والنعامين، وقد يكون سببا في انتقال الأمراض؛ حيث كانت هذه الكائنات قد أثرت على إصابة البشر بالوباء عبر التاريخ.
  insect.fly:
    label: الدودة
    summary: حشرة ثنائية الأجنحة شائعة قادرة على نقل البكتيريا.
    info: تعتبر الدودة المنزلية أكثر حشرات الأمراض شيوعاً في المساكن البشرية، وعينها مركبة تسمّن لها برؤية ما يقارب الـ٣٦٠ درجة حول جسدها. كما أنها تحمل الجراثيم لأنها تنزل على النفايات والأطعمة أيضاً.
  insect.goliath_beetle:
    label: جولياث
    summary: أحد أكبر وأثقل الحشرات في العالم من الأماكن المدارية الإفريقية.
    info: يُعتبر جولياتس الجبلي أحد أضخم حيوانات الهواء على مستوى الأرض؛ حيث يبلغ وزن الذكور ما يصل إلى ١٠٠ غرام ويصل طولها لأكثر من ١١ سم، وتعيش هذه الكائنات الضخمة داخل الغابات الاستوائية الرطبة بأفريقيا. تأكل البالغة منها الفواكه والصفراء النباتية التي تتراكم تحت الشجر.
  insect.grasshopper:
    label: كُوبِيلْكا
    summary: حشرة تกระم بالرغم من أنها طويلة وذات أقدام خلفية قوية.
    info: |-
      الكوبيلَكة هي حشرة تنتمي إلى رتبة الأورثوبرا، ولها ساقان مؤخرتان قويتين تسعيين للكرم حتى مرتين أو ثلاث مرات طول جسدها.
       الذكور ينتجون صوتًا مشابهًا للصياحة عن طريق فرك الفخذين على الجناحين.
       إنهم يتغذون على النباتات؛ ويمكن أن تتسبب كتاف كبير في إلحاق الضرر بمحصول.
  insect.ground_beetle:
    label: الذُّبَابِيَة
    summary: نملية بطيئة تعيش تحت الحجارة والأوراق.
    info: "تتميز الذبابية بأنها نمليات من عائلة الديدان؛ معظم الأنواع هي فرائد ليلية متنقلة تتغذى على حشرات أخرى، والدوديات والعناكب الأرضية.\r\nإنها سريعة الجرى وتفارق الخطر بهروب سريع.\r\nبعض أنواع مثل الزهراوي يمتلكون ألوانًا رائعة ومعدنية."
  insect.hornet:
    label: السُرْشَنِيّة
    summary: أكبر نوع من النحل في أوروبا يمتلك شوكة قوية ونبضات عالية.
    info: |-
      تبلغ السرشنية طولًا أكبر من الـ ٣،٥ سم وهي النوع الأكبر للفيلة الاجتماعية بأوروبيا.
      tتفضل بناء أعشاشها المصنوعة من الورق داخل ثقوب الشجر أو على سطح المنازل.
      إن خصلتها تطول أكثر مما هو الحال مع الفيل وال وخزها مؤلم لكن لا تنقض إلا عند التهديد المباشر لها.
      it is an important predator for other insects.
  insect.hoverfly:
    label: بُسْرَنْكَا
    summary: ذات بارقة تشبه ألوان النحل والعث، وتعتبر ملقحًا في الحدائق.
    info: البسرينكا هي حشرة ذات جناحين تنتمي إلى عائلة السيرفيديا التي تقليّ الألوان المميزة للعث والنحل كوسيلة لحماية نفسها من الكائنات المفترسة رغم أنها لا تمزق بأنيابها. كما أن لها دور مهم في التلقيح؛ إذ تستضيف أكثر عددٍ من نباتات ما يزيد عن العسليات. تتغذى البالغين منها على الرحيق والحبوب اللطيفة. أما صغار بعض الأنواع فتشكل ضدهم طريدةً لمصائد الآفات مما يجعلهم помощين طبيعيين في الزهور.
  insect.lacewing:
    label: زلاط العين
    summary: حشرة رفيعة مع أجنحة شفافة مُشبَّعة بالشرايين؛ اليراع تأكل الح벌ات.
    info: الذوات عيون زرقاء هي حشرات من فصيلة كريسيوبيدا، لها جناحان ناضمان وشفافان يحتويان على شبكة دقيقة ومحددة الشكل، ولها عينا ذهبيتان بارزان. إن صغار هذه الكائنات هجينة وتتغذى بكثرة كبيرة جداً من النملي الأسود مما يجعلهم دفاعًا طبيعيًا عن النباتات. أما البالغون فيتناولون الرحيق والطلع ويتم الجذب إلى الضوء وهذا مؤشر للحفاظ على البيئة السليمة.
  insect.ladybug:
    label: النملة الحمراء
    summary: حشرة صغيرة مستديرة حمراء اللون ذات بقع سوداء.
    info: النملة الحمراء هي نوع من البراغيث تأكل الديدان وتساعد في الحدائق.
  insect.locust:
    label: كوبيلكا ستيهوفافا
    summary: كوبيلا تشكل أسرابًا مدمرة تتكون من ملايين الأفراد.
    info: القُرَّادة المهاجرة هي نوع من القُرَّادات التي تحتوي على ظروف معينة لتشكيل كتل هائلة ومتحركة جدًّا، يمكن أن يحتوي هذا الكتلة إلى مليارات الفرد وتدمير كامل المحصول في آلاف الهكتares خلال يوم واحد. تاريخياً كانت هذه الحشرات واحدة من أكبر الكوارث الزراعية في الدول الإفريقية والآسيوية.
  insect.louse:
    label: نملة
    summary: حشرة صغيرة لا جناحين تعيش على الجلد والشعر لدى الثدييات.
    info: |-
      النَّمْلُ حِرَاشٌ مِن رتبة الفثيرابتراء يعشى بدون أجنحة، ويوجد في الشعر أو الشعيرات وجلد المضيفين
      يشفط الدم ويسبب الحكة
      تنتشر نحلة الرأس عالمياً وتؤثر على الأطفال بغض النظر عن الظروف الصحية
      كانت النامليا تحمل الطاعون والأوبئة الأخرى تاريخيا.
  insect.mayfly:
    label: جبيصة
    summary: حشرة تعيش في مرحلتها البالغة لساعات أو أيام فقط.
    info: تُعتبر الجباصيَّة حشرةً من رتبة Ephemeroptera ورمزًا للعابرة؛ حيث يعشش الكبار ساعات إلى أيام، ولا يتمتعون بأجهزة هضمية قابلة للعمل وبالتالي لا يستهلكون شيئًا على الإطلاق. أما نمفاتها فتشير تحت الماء لمدة تتراوح بين سنة واحدة حتى ثلاث سنوات. إن إنتاج أعداد كبيرة منها هو عرض طبيعي مذهل جدًا؛ إذ تعد ظاهرة انتشار هذه الحشرات بشكل كثيف بنيوب الدانويب بمجر أن تكون حدثاً طبيعياً فريداً.
  insect.mosquito:
    label: ناموس
    summary: حشرة طائرة ماصة للدماء؛ الإناث تنقل الأمراض.
    info: النَّمُوص حِرْشَةٌ من فصيلة النَّموسيات، وله جناحان فقط. تتغذى الأنثي على دماء الحيوانات لاستخراج البروتين اللازم لإنتاج البيض بينما يتغذى الذكر عادةً على العسل أو نكتر الأزهار. يحمل بعض أنواع النَّموس أمراضاً خطيرة مثل الملاريا والحمى الصفرية وفيروس زيكا.
  insect.moth:
    label: مُورَة
    summary: كائن ليلي من عائلة الفراشات؛ يطير نحو الضوء ويملك شعيرات متطايرة.
    info: |-
      المُوِر هي فراشات ليلاوية تعود إلى رتبة اللبيديوبتيرا، وتنبسط أجنحتها جانبيان في حالة الراحة على خلاف نظائرهن النهارية.
      many species are attracted by artificial light.
      The silk produced by silkworm caterpillars is used for natural fabric production.
      The Luna Moth هو أحد أنقى المخلوقات التي يمكن العثور عليها حول العالم.
  insect.praying_mantis:
    label: كودلانيكا
    summary: حشرة مفترسة ذات وضعية صلا وضربات سريعة.
    info: الكُدْلانِكة النَّابوطة هي حشرة فجاعة تعود إلى مجموعة المانتويديا، وتسمى بهذا الاسم بسبب طرقتها في الوقوف مع ثني الأقدام الأمامية كأنها تصلي. إنها خبيرة بالصيد حيث تستطيع ضرب الفريسة والقبض عليها بسرعة لا يصدق فيها العين.
  insect.robber_fly:
    label: الصقر الطائر
    summary: نحلة مفترسة تلتقط حشرات أخرى أثناء الطيران.
    info: الصقور الجوية هي نحل ثنائية الأجنحة من عائلة الأسيليدا، والتي تتغذى على الحشرات الأخرى مباشرة في الجو بينما تكون طائرة. لديها أقدام قوية لالتقاط فرائها وإبر لإدخال سامة معطلة للعضلات داخل جسم الفريسة. بعض أنواع الصقار تعاني من التمثيل الظاهري لمظهر النمل أو العدّوا كوسيلة دفاع ضد المُهددين.
  insect.scorpion:
    label: سحلية
    summary: حشرة سامة تابعة لفصيلة العنكبوت لها فكين وذيل منحنٍ مُسمم.
    info: |-
      السحلية هي حيوان ينتمي إلى الفصائل التي تتبع للعناكب وليس الحشرات، ولها قبضتان وأطراف ذيل مرنة ومزودة ببرميل سمّي.
      إن هذا الكائن عمره طويل؛ حيث أن أقدم الأحفوريات المعروفة عن السحلية يصل تاريخها لأكثر من 430 مليون سنة
      وتحت ضوء فوق البنفسجي تنبعث منها إضاءة خفيفة في الظلام.
  insect.silverfish:
    label: السمكة
    summary: حشرة سريعة الحركة بدون أجنحة توجد في الأماكن الداخلية بالقرب من الكتب والورق.
    info: ' السمكة حشرة بدائية لا تحتوي على جناحين تنتمي إلى رتيب زيجنتوما وتُعثر عليها داخل المنازل، وتعيش حولها. تتغذى هذه الحشرات على النشا والألياف الورقية ولصقات المكتبات وأخشاب الملابس. يعود اسمها لون فضيه مشابه للأسماك ومظهر تحركاتها.'
  insect.spider:
    label: عنكبوت
    summary: العناكب حيوانات ثمانية الأرجل تصنع شبكات لصيد الحشرات.
    info: |-
      هو عنكبوتي من رتبة العناكب وليس نوعًا نملّيً، وله ثماني أقدام وجسم مكوَن من جزأين فقط.
      it لديه القدرة على إنتاج حرير يُستخدم في صنع الشبكة للصيد أو لتغليف البيض داخل كبسولات.
      هناك أكثر من ٤٨ ألف نوع معروف من العناكب حول العالم.
      al جميعها سامة ولكن معظم أنواعها غير ضارة بالإنسان.
  insect.stag_beetle:
    label: النملة المزودة بالقرنيين
    summary: أكبر حشرة في أوروبا؛ الذكر يملك فكًا قرنيًّا.
    info: |-
      يصل النمَلُ القرني إلى طولٍ يصل لـ 7 سم وهو أكبر بعوضة في القارة الأوروبية.
      The male has enormous horn-shaped jaws used for fighting over females.
      يرتبط اليراع حتى سبع سنوات داخل الخشب المتحلل للحشائش ويتغذى على الفطريات.
      it is critically endangered due to loss of old forests and dead wood.
  insect.stick_insect:
    label: خيوط
    summary: حشرة تشبه الفرع أو الورقة بدقة.
    info: الخيط هو حشرة من مجموعة فاسماتوديا ومحترف في التقليد؛ جسده يحاكي بشكل دقيق الأغصان والsheetsات الخضراء. عندما يتعرض للخطر، فإنه يبقى ثابتًا تمامًا دون أي تحرك. بعض أنواعها تناسلية بطريقة التكاثر الذاتي بدون ذكور.
  insect.termite:
    label: صراصير
    summary: حشرات اجتماعية تبني أعشاشًا ضخمة من الطين.
    info: |-
      الصرصور حشرة اجتماعية تنتمي إلى مجموعة الإسوبتيرا، وتعيش في مستعمراتها مع ملكها ومملكتها وجناحيها العامل والجندي.
      tقائدة بناء أشجار تعقد أنظمة التهوية داخل الأعشاش المعروفة باسم المداور التي يمكن أن يصل طول بعض منها حتى تسعة أمتار في المناطق الاستوائية.
      تلعب الصراصير دوراً محوريّا كمُحللات أولية للأخشاب ضمن النظم البيئية الاستوائية.
  insect.tiger_beetle:
    label: بُرْوَكٌ مِن بَعْض الـ Cyclinderidae
    summary: ذات لون فلزي وسرعة كبيرة وبصر حاد.
    info: |-
      البروك يعود إلى الفئة تحتية من سكاندلينا، وهو معروف بالسرعة الاستثنائية وقدرات الطيران والرؤية الحادة للغاية.
      يرتبط هذا البروك بأنه سريع جداً أنه يحتاج للوقوف والتوقف لإعادة التوجيه لأن السرعة تفوق قدرة نظامه البصري على التعامل معها
      له جسم كلاسيكي اللون بألوان زاهية مثل الزهراء والأزرق والحمراء ولديه عيون ضخمة.
  insect.velvet_ant:
    label: نملية فروة
    summary: حشرة نحل ذات لون برتقالي وأسود، تشبه النمّال ولا تحتوي على أجنحة.
    info: |-
      إن النملية الفرَوِيَّة هي في الواقع نوع من أنواع النحلة العائلة المُتيلليديا؛ الإناث لا يمتلكان جناحين ويتشابه شكلها مع النمّل.
      تحتوي هذه الحيوانات على خصلات حمراء أو البرتقالية مكشوفة ك告诫.
      للأنثى سهم قوي للغاية يتم تعريفه باسم «قاتل البقر» بسبب القوة الكبيرة فيه
      تعيش بشكل طفيلي داخل أعشاش الخنفساء.
  insect.wasp:
    label: نحلة
    summary: حشرة ناقصة صفراء وسوداء تبني أعشاشًا من الورق.
    info: |-
      النحل الأصلي هو حشرة مُنقِّسة تنتمي إلى مجموعة Vespa ولها لون أخضر وأسود ك警示标志。
      تبنى أعشاشاً على شكل ورق باستخدام مواد خشبية تمضغتها.
      على عكس النمل، يمكن للعث أن يعض أكثر من مرة في المرة الواحدة.
      وهي فائدة لأنها تحافظ بشكل طبيعي على التوازن بين الحيوانات الضارة.
  insect.water_strider:
    label: الحشرة المائية
    summary: هو حيوان يمشي على سطح المياه بفضل قوة الشد السطحي.
    info: تُعرف الحشرات من عائلة جيريدا بأنها تتحرك فوق سطح الماء باستخدام الشعر الهيدروفوبية الموجودة في أقدامها وقوة شدّه المائي. هذه الكائنات تتغذى على الأحياء الغارقة، وتكتشف ارتعاشات النشاط عبر طبقة الماء لتحديد فريستها. كما أنها متناثرة بشكل سريع ويمكن أن تنزلق على سطح الماء بمعدل أكثر من مرة واحدة كل ثانية.
  insect.weevil:
    label: نُسَاتِك
    summary: حشرة بياض صغيرة ذات أنف ممدود خاص.
    info: |-
      النساط هو نوع من البق الذي ينتمي إلى عائلة كوركيونيدا، وهي أكبر مجموعة حيوانية في العالم بأكثر من ٦٠ ألف نوع.
      The طويل الأنف الممتد (الأذن) يستخدم لاختراق البذور والفاكهه والأغصان.
      certain بعض الأنواع تسبب ضرراً زراعياً كبيراً مثل نساط القطنية.
      others أصناف أخرى متخصصة فقط على نوع واحد من النبات.
  insect.whirligig_beetle:
    label: الدودة الدوارة
    summary: حشرة صغيرة تدور في مجموعات على سطح الماء.
    info: |-
      الدوَّار هو حشرة مائية من الفصيلة الجيرينيدا، تسكنها السفوح العلوية وتدور بشكل جماعي لتجنب الحيوانات المفترسة.
      tتتميز عيناها بأنهما مقسمتان إلى قسم يرى فوق المياه والآخر تحته.
      كما أنها تستشعر الاهتزازات الصغيرة أو الأمواج التي قد تكون مؤشراً للطعام أو الخطر.
      تعيش دوراتها النهارية بينما تقوم بالتحليق ليلا.
