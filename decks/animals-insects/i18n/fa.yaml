lang: fa
pivot: false
title: آفت ها
cards:
  insect.ant:
    label: ماورانک
    summary: حشره اجتماعی کوچکی است که در جوامع زندگی می‌کنید.
    info: ماورانک، حشره‌ای است که جوامع بزرگی با تقسیم کار تشکیل می‌دهد.
  insect.antlion:
    label: merzeh-khor
    summary: لاروا که در شن پرهول مناسب برای صيد مرزان است.
    info: مرزه‌خور، لاروی حشرات از خانواده میرملئونتیدا هستند که در نوار سبک به شن تراشند و فرشهای مخروطی برای جذب مرزها بسازند. وقتی مرزن داخل پله قرار میگیرد، آن را با دندانه‌هایش زمزمه می‌کند و عصاره معده‌ای به او می‌فرماید.
  insect.aphid:
    label: ماوس
    summary: حشرة کوچک روی لوبیج؛ ترشحات قنددار.
    info: "میشک‌ها حشرات کوچک جذب شیره از نژاد آفیدودئا هستند، که با خوردن عصاره درختان غذا می‌گیرند. \nاین موجودات ترشحات قند دار به اسم مدوز را تولید می‌نماید و برخی زنبورهای سرخرگان وجود دارد که فرومون این مواد را تشخيص ميدهند و براي پيدا كردن منابع جديد استفاده ميشوند."
  insect.atlas_moth:
    label: مارتناتس آتلانتوس
    summary: برخی از لرزش ها شامل الگوهای مشابه خفاش هستند.
    info: '{"hint":"یکی از پروانه‌های بزرگ جهان","info":"مارتیناتس آتلانتوس، یکی از انواع مور درخشش دهنده است که بال ها به طول حداکثر سر و صدف نوارها شباهته با فرم خاردار وجود دارد .\nنقطه شروع تقریباً مثل سرشاخه های مواد غذائی بر روی زمین قرار دارد \nدر حال حاضر فقط روز بعد از مرحلهٔ رسیدن به سن بالغ مراقبت می‌کند؛ تنها چند روز عمر می‌کنند.\nمنطقه اصلی اقامت در مناطق جنگلی گرمسیری شرق دورتر از آسیاست."}'
  insect.bedbug:
    label: کنه
    summary: پارازیت بدون عضله در شب؛ در سوراخ های نجف وجود دارد.
    info: کنه خانگی حشره‌ای تقریباً دوست به شکل بادام و فاقد عضلات است که در شب فعال می‌شود، از طریق سوزن زدن مواد غذائی لازم را جمع آوری می‌نماید و پس از نخوردنش با قرار گرفتن در سوراخ های ماتresses، نقاشی ها و داخل محصولات مختلف انبار می‌شود.
  insect.bee:
    label: bچلە
    summary: حَشِرَ دُكْ خۆروى، بلوتنې يوازي لخواتلى دي او عَصَلَ فرمَايه‌دى .
    info: '{"hint":"فرازی از حشره تیره کن و سازندهٔ عسل است (apis Mellifera)","info":"بچله میدونوس به عنوان جانور اجتماعي در زغالها زندگي ميکنه و نектار رو جمع آوري ميكني","label":"bچلە","sumary": "حشرة اي با رنگ قهوه اي -سياه كه گل ها را پوسته ميكند وعسلتوليدميكرد."}'
  insect.beetle:
    label: خراف
    summary: خرف ها بزرگترین رده حشرات با بیش از ٤٠٠٬١٢٣ نوع مشخص.
    info: '{"hint":"حشره‌ای با پوست سخت و محکم، رده کولئوپتر)، بیشترین تعداد گونه دارد","info": "خراچ ها در ردۀ کلئوپترا قرار می‌گیرند و حدود百分之۴۰ از تمام حشرات شناخته شده را تشکیل میدهد. خواص آنها شامل بالهای جانباز استوارد(الوتر) به صورت زبر رو بر بالهای لذعه فعال تحت نظر است. خرخره عظیمه بزرگترین خارج اروپاست؛ مردانه اش بالشتک‌های ضربه‌زن مهماندار داشته باشد. وجود دارد تقریباً در تمام مناطق از خطوط معادله تا نقاط شمالی."'
  insect.bombardier_beetle:
    label: سیاه ماشین توپخانگ
    summary: بروك كه مخلوط گرم و سمی را به عنوان دفع علیه دشمنان خروج میدهد.
    info: "سیاه‌ماهی توپخانگی از زیر خانوادهٔ برکیناین، با روش منحصر به فرد دفاع می کند؛ ترکیب شدن دو مواد شیمیائی در ناحیة پشت ساققه آتش بار و واكنش انفجاری حاصل با حرارت بالاتر از ۱۰۰ درجهٔ سانتي گراد است. \nبا صدای بلند همزمان جنبش داخل لوله، هواء سمی فوق العاده قدرتمند با سرعت چهلصد مرتبه در ثانية منتشر می شود."
  insect.bumblebee:
    label: چمناک
    summary: زنجرهٔ بلند و شلخال با صداي عميق كه نقشي مهم در غذريابى داريد.
    info: چمناک، حشره‌ای با موی درشت از جنس بومبوس است که به میدوست نزدیکتر است و نقش مهمی روزانه دارد خصوصاً در مناطق سرد هوا که زنبورها تقریبا فعالیت نمی‌کنند. قادر به حرارت دادن بدنش با لرزش عضلات پروازی آن است بنابراین حتی در هوای سرد نیز قابل پرواز است.
  insect.butterfly:
    label: '"موتل"'
    summary: '{"hints": "حشره لخت با بال‌های رنگارنگ"}'
    info: '{"hint":"فلاوره زنده با بال‌های بزرگ الگوی دار و پوشیده از نخستین فرفره ها","info":"بروز کافئه موتل به عنوان فلاورها، حشراتی است با جفت بال شانسکال، غالباً رنگ‌آمیز."}'
  insect.caterpillar:
    label: گُزن
    summary: جوجهٔ مَلق؛ روی برگ‌ها غذا می‌دهد و قبل از فرونشیندن موادغذائی ضروری را جمع می‌آورد.
    info: گوزن جوجه‌ای ملخ است و بیشتر عمر خود را با غذادهی به برگها سپرده تا انرژی لازم برای تحول کامل را ذخیره نماید، بعضی از آن ها دارای رنگ های پرتابان هستند که شکارچیان را در مقابل سموم حفظ می کنند.
  insect.centipede:
    label: سن
    summary: پستانداری شباهت زیادی به سن دارد.
    info: "سُنَّگان در ترکیب کلاسهای مارمرغ‌ها قرار دارد و همانطور که نامش پیشنهاد میدهد، به جز سِرو اصلی آن فقط ۱۰۰ فرد وجود داشته باشد؛ بلکه بر روی تمام بدن خود شامل چندین زوج بال است. \nمارمرغ‌ها شاخصترین حشرات روز مرطوب هستند و غذای عمدهٔ آنان عبارت است از موشهای مختلف مثل لارو، انفجارهای ذرت، ماوس و ... .\nدر بعضی اوقات، آخرین زوج بال به عنوان سموم طولانی عمل می‌نماید."
  insect.cicada:
    label: سيكادا
    summary: حشرة اي كه معروف به خواندن يك نوع آهنگ بلند در روزهای گرم است.
    info: سیکادا حشره‌ای از نژاد سِرَدُوئید با بلندترین صداها در میان تمام حشرات است. آمراس دارای تومبال هستند که به منظور جذب عروس، زمزمه شنوا و پرجوش را فعال می‌نمائند. برخی گونه‌ها در قسمت شمال غربی آمریکا دورهٔ عمرشان برابر با ۱۷ یا ۳ سال است.
  insect.cockroach:
    label: شواب
    summary: حشره شب غذخوار، فوق العاده محکم و انعطاف پذیر.
    info: "کرم شب‌نما از پرقدرت ترین حشرات جهان است؛ میتواند در برابر نور و شرایطی که دیگر موجودات را از بین میدهد مقاومنداشد. \nبیشتر از ۴ هزار نوع وجود دارد، ولی فقط حدود سی عدد آنها به مردم زندگی خوب با قربت دارند\nدر حالی که قدیمی است - کرم شب‌نما برای بیش از ٣٠٠ میلیون سال وجود داشته و فراموش کردنشان قبل از منقرض شدن دوستدارانش."
  insect.crane_fly:
    label: تيبولا
    summary: موشي مشابه مچوق با ساققات بسيار بلند.
    info: تیپولکا حشره‌ای دو بال با خانواده تیلوالید، شباهت ظاهری به مچوق زنده بزرگ اما نبته و پارازیت نمی‌باشد. ساققه طولانی آنها راحت جدا شوند؛ که جزء الگوهای مقابله است(اتوتوم). فردین بالغ فقط برخاستند و غذاء نمی‌برند یا عسل مصرف می‌شود. لاروها در داخل خاک قراردارند و از ريشه ها تغذيه مي كنيم.
  insect.cricket:
    label: سرخچ
    summary: حشرة شبی معروف به ضرب المثل و غلغلش نر.
    info: سوسک مزرعه‌ای حشری از راستۀ آورتوپتر است که در شب فعالیت دارد و نرها با سفت شدن بال به هم، صدای خاصی تولید می‌کنند تا اناث جذب شوند و مرز منطقهٔ زندگیشان تعیین بشود. در آسیا، سوزنک‌ها به طرز سنتی پرداخته می‌شدند تا بعنوان موجودات خانوادگی برای لحن عالیشان مورد علاقه قرار بگیرند.
  insect.damselfly:
    label: شیدлатکا
    summary: همسال فرشته؛ وقتی درحال راهنمائی نباشد، بالهای خود را موازی با تنه می‌پوشاند.
    info: شیدلاتکا حشره‌ای است کمی شبیه وازدوز، اما باریکتر و وقتی در حال راهنمون نبوده پرهای خود را موازی با بدنش می‌گیرد، برخلاف وازدوها. شکارچی هستند و جونداران دوسر به صورت هوادارد قربانی می‌کنند. لاروها آب زیسته و نقش مهمی در ساماندهی منابع آبرسان داشته و معیاری برای تعیین کیفیت منابع آبرسان هستند.
  insect.diving_beetle:
    label: کاواچ
    summary: خزنده اقتصادی زیرآبی
    info: کاواچ بزرگ، جانوری مفتر در خانواده دایتِسیدائ واقع شده است که در ابستره ها و آبهای ثابت زندگی می‌کنند. به علت پاهای عقب تختش مثل قطب لندر سرعت بالایی بر روی آب حرکت می‌کند. هواسازی روزمره با لمس سطح آب صورت می‌پذیرد و نسبتاً هواء داخل حلقه فروبرداری می‌نمود. غذا شامل حشرات، لاولارها، ماشه ها و موشوارها میباشد؛ شبها فعالیتش تحت آب و همراه با پرواز وجود دارد.
  insect.dragonfly:
    label: زنده
    summary: حشرات طولانی دوجفت بال شفاف دارد.
    info: '{"info":"سازمان زنبورهای مفتری با بینائی عالی هستند که در نزدیک مناطق آبی شکار می‌کنند.","label":"زنده","summary":"حشرات طولانی دو جفت بال شفاف دارد."}'
  insect.dung_beetle:
    label: خرچंگ
    summary: بروز فعالیت خردسال در مصر قدیم.
    info: خودکار مقدس، کرمی از خانوادهٔ ساрабائیدئوس است که مواد دام را به توپ‌ها تبدیل و آن‌را برای مدفون کردن و جوجه‌گذاری هل می‌دهد. در مصر باستان نماد خورشید وخداعصر بود. یکی از اندر زندگیات هستند که با شیرابه ماشه راهنمایی می‌کنند.
  insect.earwig:
    label: شکور
    summary: حشرة بلند با خراطين در آخر قسمت زانو.
    info: شکور حشره‌ای از راستۀ درماپتر است که دارای خراطینیم به نام سرچ ها روی پشت آن مخصوصان برای جنس و مقابله وجود دارد، اسم شکور از باور قدیمی منشاء گرفته است که فرض میشد داخل گوش مردم حرکت میکند؛ ولی این موضوع غلط است. تخمها و لاروها بوسیلۀ انوثاهای شکور مراقبت میشود که امری عجیب در مجموعه حشرات است.
  insect.firefly:
    label: چروند
    summary: بروز دارای اندازه مناسب برای جلب پartner.
    info: سوسک نورانی از خانواده لامپیریدا مجهز به توانایی تولید نور سرد در قسمت شمارگر است که باعث برجستن آب‌وهوا و جذابیت برای همراهش می‌شود، واکنش شیمیایی لوسرفین با لوسرفازا راهنمائی می‌دهد.
  insect.flea:
    label: بلق
    summary: حشرةٔ کوچکِ پرش‌زن بر روی پستاندارها و مرغوط.
    info: بزاق، حشره‌ای بدون بال از راستۀ سیفوناپتررا است که در زندگی پارازیت متخصص شده است. با فرجام قوی خود می‌تواند بیش از صدو پنجاه برابر طول بدنش نجات دهد و به مواد غذائی موجود در جسم پستاندارها و مرغان علاقمند است؛ همچنین نقش مهمی در منتقل کردن بیماری‌ها مثل بلدرمس تاریخی دارد.
  insect.fly:
    label: ماوس
    summary: پروانهٔ دوبالهٔ متداول قابلیت انتقال باکتری
    info: |-
      زنبور خانگی، پروانه‌ای دو بال با ساققه است که در منازل انسان زندگی می‌کنند و بهترین نمونه آن Musca Domestica است
      چشم ترکیبی او قادر به مشاهده بسیار شبیه ۳۶۰ درجه حول محور بدنش است
      به علت فعال شدن روی مواد ضدعفونی شدۀ غذایی همراه با انبارها، باکتری را منتقل می‌نمود
      تنها جفت بال عملکردی وجود دارد؛ جفت بعدی (بال‌های تعادل)، برای حمل و نقل هوشمندانه طراحی شده
  insect.goliath_beetle:
    label: گُلِئَت
    summary: جاذبه ترین نوع حشرات است
    info: |-
      گولیاش بزرگ‌السال جزو حشرات عظیم دنیا محسوب میشود؛ نرها توانند به وزن بالغ بر صد گرم و طول فراتر از سیصد و هفتاد میلیمت رسیده باشد، در مناطق مرکز آفریقا زندگانی می کنند
      و مواد غذایی خود را از میوه و شیره درختان بدست میآورند.
  insect.grasshopper:
    label: سرماکوب
    summary: حشرهٔ پرنده با پاهای بلند و صوت تشخیص.
    info: |-
      سرماکوب، حشره‌ای از راستۀ آرتوپتر با پاهای عقبی قوی که بهش ممکن است بتابد تا دوازده برابرش طول بدنش رو جلو برود
      مردان سرمакوب صدا خاصی (تاریدولاسیون) فراموش نشه وقتی لگنهاشان رو در تماس با بالهایشان می‌چینند
      روبرو شدن و غذاء کردن؛ هجوم زیاد میتونه ضربات سنگینی به محصولات کشاورزان وارد کنه
  insect.ground_beetle:
    label: استرویلک
    summary: بُرون قوم جذع لجمنده است.
    info: سَتِرْویلک از خانوادهٔ کارابیدا، حشرات شکارچی هستند؛ بزرگترین نژادها شب‌نشین و فعال به عنوان مفتری بر دیگر زنبورها، راهنماها و حلzemان باشند. آنان سرعت بالایی در حرکت داشته و پاسخ مناسبی مقابل تهدید نموده‌اند.
  insect.hornet:
    label: سرشن
    summary: بزرگترین نوع سوسک اوروپائی با فرماندهی پرانرژی.
    info: سروشنه عام به‌عنوان بزرگترین سوسک اجتماعی در اوروز، طول آن ممکن است بالای ۳٫۵ سانتی‌مترا باشد و تخم‌های خود را روی کف جعبه‌ها نزدیک زیردرختان قرار دهد. فرماندهی بلندتر از سوسمار وجود دارد و عضلمندان هستند ولی فقط وقتی حمله می‌کنند که مستقیماً تحت تأثیر قرار گرفته باشند.
  insect.hoverfly:
    label: پسترنکا
    summary: زن جذاب مثل زنبورعسل و غذاهای گلستان.
    info: "پسْتِرَنکا حشره‌ای دو بال از خانوادۀ سرفیدائی است که رنگ و همراه با عسل، زنبورها شباهت می‌دهد تا در برابر شوالیه‌ها محافظت کند(موثّق نما)، البته خودش فرس ندارد. \n نقش مهمی در پاشنه بردن دارد؛ به اندازه‌ای مختلف چوب لازم آب می‌خورد که حتی زنبوروں از آن فراتر است."
  insect.lacewing:
    label: zlatočка
    summary: حشره ظریف با بال‌های شفاف شبشبی؛ جوجه‌های آن سوسک را صید می‌کنند.
    info: زاتوچکا حشره‌ای از خانواده زلاتودید است که بال‌های شفاف و شبیه تار مشبک دارد، همراه با عینک طلائی رنگش؛ جوجه‌ها مفترجند و به اندازه بسیار زیادی سوسک نابود می‌کنند، بنابراین محافظت طبیعی گیاهان هستند.
  insect.ladybug:
    label: بروسشكا
    summary: بزرگترین قرمز رنگ دایروار با نقاط سیاه.
    info: '{"info":"کوچوله از خانواده کاوشینلید، حشراتی است با تغذیه مگس‌ها و بهره بردار در باغ.'
  insect.locust:
    label: کُربَلا
    summary: جمعیت عظیمِ زردچین براساس نسل میلیون.
    info: |-
      کوبیلکا ستوه‌واواف، که به معنای زردچین است، نوعی حشره مهاجرانه اس که در شرائط خاص جمعیت هائل و حرکت دار را تشکیل میدهد.
      jamie ممکن است شامل میلیارد ها فرد باشد و محصولات تمام مناطق هزاران هلکتر برازدرو غرق آب قراردهد.
      in afriq va asia، sarancha تاریخی یکی از مهمترین بلاءهای کشاورزی بودند.
  insect.louse:
    label: پسه
    summary: حشره‌ای عالق بر پوست و مو موجودات.
    info: "پشه، حشره‌ای نرمال بدون بال از راستا فتیراترا است که روی پوست و مو مامن خودش زندگی میکنه. \nخون جذب میکنه و سوز دم در بدن باعث میشه. \npediculus humanus capitis به طور جهانی شناخته شده و همه سنین مختلف مردم رو تحت تأثیر قرار میده حتی تو محیط تمیزها هم وجود داره."
  insect.mayfly:
    label: جپیس
    summary: حشره با عمر بالغ کوتاهترین است، تنها ساعات تا روزها.
    info: جپیس ها حشرات از ردهٔ Ephemeroptera و نماد فانی بودنند؛ بالغ‌ها فقط ساعت تا روز زندگی می کنند، دهان غذایی عملکردی برخوردار نیستند و خودشان به طوری کلی غذا نمی خوردند. لارو جپیسه در پائین آب سال تا سه سال زندگی می کنند.
  insect.mosquito:
    label: موچوز
    summary: حشرةٔ دوبال؛ مادگان آب ماوراء جسم و میتوانند بدخواست منتقل نمایند.
    info: ماکن به زبان فارسی، حشره‌ای دو بال از خاندان کولی سیدا است. مادگان آب ماوراء جسم موجودات برای دریافت پروتئین لازم برای تخم رفتن و نرها با شیرآبل قند غذافته می‌شوند. موچوز عامل بدخواست همانند مالاریا، دونق و زیکا منتقل می‌نمود.
  insect.moth:
    label: مُؤْرا
    summary: شب‌زندهٔ دوراه؛ وقتی که نور حرارتی داشته باشد پرواز می‌کند.
    info: |-
      {"info":"ماوران حشرات پروازی شب‌نشین از راسته لپیدوپتر، که در مقابل مرغان روزنامه دارند بال های خود به سمت جلو می باشند
      برخی نژادها تحت تأثیر قرار میگیرد و جذب شده توسط روشنایی صنعتی است
      تعداد زیادی مواد غذائی برای ماوران وجود دارد
      لناکس فرفره ای بزرگترین نوع ماورا است"}
  insect.praying_mantis:
    label: کودلنka
    summary: حشرة شکارچي با موقعیت شبیه معبد و حمله سریع.
    info: کودلanko نابوژنی از جنس حشرات شکارچی است که به خانواده مانتُدِا تعلق دارد و اسمش را براساس وضعیت قرارگیری پاهای قدامی‌اش در همانند آرزو، بازتاب میدهد. این موجود متخصص در صيد غذاست؛ فوراً ضربه زده و طعمهٔ خود را در عرض لحظات برمی‌دارد.
  insect.robber_fly:
    label: سگوک
    summary: ماوس شکارچی که حشرات رو مستقیم بالا در حال پرواز می‌زن
    info: |-
      سگوک بر کرم دوازیستانه اهل خانوادهٔ آسلیدا، حشرات شکارچی هستند که در هوای باز به جول و سرخر رفتن می‌پردازد.
      دارنده پاهای قدرتمند برای فشاردن غذایشون و تخم مرغی بزرگ برای انژکت کردنه مواد سم نوروتوکسین است
      برخی از گونه‌ها ظاهر شبیه زنبور عامل یا لاله رو طبیعی می‌تونن تو محاسبه حرمت خودرو
  insect.scorpion:
    label: سکورپیون
    summary: جانور سم‌زا با لباده‌های نازک و ذُل منحنی.
    info: سکورپیون جانداری از خانوادهٔ پاگوش‌ها است با دست‌های کوبنده و ذُل مقوّم به عنوان سلاح تاج شارژشده با سم، قدیمیترین فسیلهای آن بزرگتر از ۴۳۰ میلون سال هستند.
  insect.silverfish:
    label: ribenka
    summary: حشرات بدون بال سریع الحركة داخل خانه
    info: ریبینکا حشره اولوگن بدون بال و با حرکت سریع است که در خانه‌ها زندگی می‌کند، عضو ردهٔ زاینتوما محسوب می‌شود. غذای آن شامل نشا، کاغذ، جوجه‌زنده پارچه‌سازی و الیاف پنبه‌ای است. اسم این موجود به دلیل فاموش براقش شبیه طلا و همراه با تحرّک مشابه ماهی‌هاست.
  insect.spider:
    label: سوسک
    summary: زنده‌داران با هشت لاغر و شبکه‌ساختن برای صيد حشرات.
    info: پارازیت ها جانورهای شش پوچرمه نبودن و از ردهٔ آرانئ به وجود میآیند که دوتنه بدن، هشت فقرات ساقط و توانائی در تولید الافون برای زندگي استفاده میکنند. تمام انواع با سم خطرناک عمل میکنند ولی فقط قسمتهایی انسانها رو تحت تأثیر قرار میدهد.
  insect.stag_beetle:
    label: روهات
    summary: مورچ بسيار بيزي؛ جنس مردغالدار.
    info: روهاتچ اوبتني نخستين مورچ بزرگ در اوروپا است كه طولش تجاوز از هفت سانتيمتر دارد. جنسي مردغال با فرجه‌هاي عظيمي به شكل قرون وجود دارند كه برای منازعه با ديگران و جذب زنده استفاده ميشود. لاروا آن بين هيويادو هفته درختان خشك و سنديماني، مثل غاري رشد ميكند.
  insect.stick_insect:
    label: استراشیلکا
    summary: حشره ای است که دقیقا مثل برگ یا شاخه ظاهر می شود.
    info: ستراشیلکا حشره‌ای از دسته فاسماتودئ و به خوبی مامور؛ بدن آن کمپرس شاخه ها را شبیه سازی می کند، در صورت تهدید تماماً حرکت نخواهد کرد.
  insect.termite:
    label: تَرْمِته
    summary: حشرات اجتماعی ساخته کنندهٔ جاهای ذخیره عمومی.
    info: تارمیتها حشرات اجتماعی هستند که به خانواده‌ایزوپتر متعلق و در رابطه دور با سوسکها قرار دارند، زاگردها با پادشاه، ملکه، نظامیان و نوازنده‌ها تولید می‌شوند. آنها بناهای مرغوب مثل انبارهای عظیم طبیعی با استفاده از مواد رسدار میسازند که بعضی وقتاً بالاخص در مناطق گرمخوره تا ۹ متربالا فراهم شود.
  insect.tiger_beetle:
    label: کاراگوست
    summary: بروك كاموفاتي سريع البالغة با بصارت فوق العادة.
    info: کاراگوست با کلاد سیسیندلا از پایلو زیرخانوادهٔ بروک‌ها است و به دلیل سرعت بالاست، توانایی پرواز و حواس تصاحران خوبش معروف هستند. انقدر سریع می‌دوچن که نمیتونن حرکت رو متوقف کنن و جور درست بشون؛ بنابراین برای فعالیتشون قطعاً لازمه تو راه عقب برن. بدنشون مثل سنگ آهنی شده و رنگ‌برفته‌اش شامل سبز، آسمانی و قرمز وجود دارد. صفت مرحلۀ لاواپشتِ اونها عمودی داخل زمین سوراخ میزنن و بعد از طرف منافذ منتظر غذا میمونن.
  insect.velvet_ant:
    label: کوزادهٗ موهای نرم
    summary: زنbor بدون بال قهوه‌ای روشن ظاهری مثل کوروش.
    info: کوزادهٔ موهای نرم واقعاً نوعی زنبور از خانوادهٔ متیلیدا هستند؛ حشرات انثی فاقد بال‌ها بوده، شباهت به کوروش دارند. آن‌ها مواف قرمز رنگ یا سرخابی با الگوها برای ترساندن شناخته شده است.
  insect.wasp:
    label: زنبر
    summary: حشرةٌ قرمز ومشکی که غنچهٗ کاغذی می‌سازد.
    info: زنبور سفید و مشکی از جنس والسولا است که دارای هشدار طبیعی زرد و سیاه محسوب می‌شود، تخم در غنچهٔ کاغذی بافت شده از مواد خردهٔ فرسوده را بنا نمی‌گیرد. برخلاف عسل به عنوان تنظیم کنندهٔ طبیعی حشرات آزاردهنده عمل می‌نمایند.
  insect.water_strider:
    label: كفوتن
    summary: حشرة اي كه به دليل نيروي سطفي قابليت پيمودن سطح آب را دارد.
    info: "کفوتون، حشره‌ای از خانوادهٔ جریدائی است که می‌تواند روی سطح آب پا بگذارد به دلیل وجود موهاي ضدآب بر روي لاغري و فشار سطحي آب. \nآن هارش غذا با شنيدن تابش ناشي از حرکت موجودات در زير آب صورت مي‌پذیرد\nدر عين حال سريع عمل مي‌كند و قادر است باسرعت بالاي ۱۵۰برابر طول بدنش در ثانيه روی سطح آب حرکت كند."
  insect.weevil:
    label: نوستات
    summary: حشرة کوچکی با مشخصه لاله بلند.
    info: نوساتک از خانواده کورکولیونیدا، بزرگترین جنس حشرات دنیاست با تعداد بالای شصت هزار نژاد مختلف است. ویس به طول آمده‌ش برای سوراخ زدن در میوه‌ها، سبزیجات و رشد روی بلندی مناسب است. بعضی از انواع مهم مثل عروس قارچی ضررهای فراوانی در محصولات کشاورزی می‌زنند.
  insect.whirligig_beetle:
    label: ویرنیک
    summary: خرچه‌اي کوچك که روی سطح آب به صورت گروهي دور می‌زنَد.
    info: |-
      ویرنیک، خرچه‌ای آبی از تراکم جِرنیدائی است که روی سطح مایع زندگی و با حرکت دوار در هماندوزان به منظور فرار از شوالیه‌ها عمل می‌نماید.
      oشلخهٔ او به طرفین تقسیم شده؛ بخشی برای مشاهده بالاتر از پوشش آب و ناحیۀ دوم تحت لایهٔ مايع قابل رؤیا است.
      در حالت عادى، انحرافات موجود در سطح مایع را تشخيص مي‏دهد که غذا يا خطر وجود دارد.
      روزانه دور می‌زنَد ولی شب‌ها پرواز می‌کند.
