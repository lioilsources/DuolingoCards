lang: zh-CN
pivot: false
title: 昆虫
cards:
  insect.butterfly:
    label: 蝴蝶
    summary: 有大而色彩鲜艳翅膀的飞行昆虫。
    info: 蝴蝶是一种有两对覆盖鳞片翅膀的昆虫，通常色彩醒目。
  insect.bee:
    label: 蜜蜂
    summary: 为花授粉并酿蜜的黄黑相间的昆虫。
    info: 蜜蜂是一种群居昆虫，住在蜂巢里，采集花蜜。
  insect.ladybug:
    label: 瓢虫
    summary: 一种小而圆的红色甲虫，带有黑色斑点。
    info: 瓢虫是一种以蚜虫为食的小甲虫，在花园里很有益。
  insect.dragonfly:
    label: 蜻蜓
    summary: 一种身体细长、有两对透明翅膀的昆虫。
    info: 蜻蜓是视力极佳的捕食者，在水面附近捕猎。
  insect.ant:
    label: 蚂蚁
    summary: 一种群居的小型社会性昆虫。
    info: 蚂蚁是一种组成大型群体并进行分工的昆虫。
  insect.beetle:
    label: 甲虫
    summary: 甲虫构成昆虫中最大的目，已描述的种类超过40万种。
    info: |
      甲虫属于鞘翅目，约占已描述昆虫物种的40%。
      它以坚硬的鞘翅（前翅）为特征，鞘翅遮盖着真正用于飞行的后翅。
      锹甲是欧洲最大的甲虫，雄性有像鹿角般强壮的大颚。
      甲虫几乎生活在所有环境中，从热带到北极地区。
  insect.grasshopper:
    label: 蚱蜢
    summary: 一种善跳的昆虫，有长长的后腿和鸣叫声。
    info: |
      蚱蜢是直翅目昆虫，强壮的后腿使它能跳到体长二十倍远。
      雄性用后腿摩擦翅膀发出特有的声音（摩擦发声）。
      它以植物为食，成群时会毁坏庄稼。
  insect.cricket:
    label: 蟋蟀
    summary: 一种夜行性昆虫，以雄性的鸣声闻名。
    info: |
      田野蟋蟀是直翅目的夜行性昆虫。
      雄性通过摩擦双翅鸣叫，以吸引雌性并标示领地。
      在亚洲，蟋蟀因其鸣声自古被当作宠物饲养。
      在许多文化中，它也是家庭安宁与好运的象征。
  insect.mosquito:
    label: 蚊子
    summary: 一种双翅昆虫，雌性吸血，可传播疾病。
    info: |
      蚊子是蚊科的双翅目昆虫。
      雌性吸取动物的血，以获得卵发育所需的蛋白质，雄性则以花蜜为食。
      蚊子传播疟疾、登革热和寨卡热等危险疾病。
      世界上有3500多种蚊子。
  insect.fly:
    label: 苍蝇
    summary: 一种非常常见的双翅昆虫，可传播细菌。
    info: |
      家蝇是人类居所中最常见的双翅目昆虫。
      复眼让它几乎能看到周围360度。
      它既停在垃圾上又停在食物上，因此传播细菌。
      它只有一对有功能的翅膀，第二对（平衡棒）帮助它在飞行中保持平衡。
  insect.moth:
    label: 蛾
    summary: 蝴蝶的夜行性亲戚，向光飞行，触角呈羽状。
    info: |
      蛾是夜行性的鳞翅类，与白天的蝴蝶不同，休息时把翅膀平放在身体两侧。
      许多种类会被人造光吸引。
      天然的丝来自家蚕的幼虫。
      月神蛾（luna）是世界上最美丽的蛾之一。
  insect.caterpillar:
    label: 毛毛虫
    summary: 蝴蝶或蛾的幼虫，吃叶子并准备结蛹。
    info: |
      毛毛虫是蝴蝶或蛾的幼虫阶段，一生主要靠吃叶子来为蜕变积蓄能量。
      有些毛毛虫有鲜艳的颜色，警告捕食者它们有毒。
      结蛹时它会形成蛹（茧），在其中完成蜕变为成虫的完全变态。
  insect.praying_mantis:
    label: 螳螂
    summary: 一种有祈祷姿势和闪电般攻击的捕食性昆虫。
    info: |
      螳螂是螳螂目（Mantodea）的捕食性昆虫。
      它得名于把前腿像祈祷般合拢的姿势。
      它是狩猎高手，在一瞬间出击并抓住猎物。
      雌性交配后有时会吃掉雄性，但并不总是如此。
  insect.stick_insect:
    label: 竹节虫
    summary: 一种能完美模仿树枝或叶子的昆虫。
    info: |
      竹节虫属于竹节虫目（Phasmatodea），是伪装高手，身体能完美模仿树枝或叶子。
      遇到危险时它会完全不动。
      有些种类通过孤雌生殖繁殖，也就是不需要雄性。
      因为容易饲养，它是受欢迎的异宠。
  insect.firefly:
    label: 萤火虫
    summary: 一种发出生物荧光来吸引配偶的甲虫。
    info: |
      萤火虫是萤科的甲虫，能在腹部产生冷光（生物荧光）。
      雄性和雌性以不同的模式发光，以相互辨认和吸引。
      光由荧光素与荧光素酶的化学反应控制。
      萤火虫是环境洁净的标志。
  insect.wasp:
    label: 黄蜂
    summary: 一种会蜇人、黄黑相间、用纸筑巢的昆虫。
    info: |
      普通黄蜂是胡蜂类会蜇人的昆虫，有典型的黄黑警戒色。
      它用嚼碎的木浆筑起纸质的巢。
      与蜜蜂不同，黄蜂能反复蜇刺。
      它作为害虫的天然调节者很有用。
  insect.cockroach:
    label: 蟑螂
    summary: 一种快速、夜行、杂食的昆虫，极其顽强且适应力强。
    info: |
      蟑螂是世界上最顽强的昆虫之一，能在会杀死其他动物的辐射和环境中存活。
      已知有4500多种，但只有约30种生活在人类附近。
      它是古老的昆虫，蟑螂已存在3亿多年，比恐龙还长寿。
      它行动迅速，奔跑速度可超过时速5公里。
  insect.spider:
    label: 蜘蛛
    summary: 一种结网捕捉昆虫的八足蛛形动物。
    info: |
      蜘蛛是蛛形纲蜘蛛目（Araneae）的动物（不是昆虫），有八条腿和分为两部分的身体。
      它能产丝，用丝织网捕猎或包裹卵茧。
      世界上生活着4万8千多种蜘蛛。
      所有种类都产毒，但绝大多数对人无害。
  insect.scorpion:
    label: 蝎子
    summary: 一种有螯和弯曲毒尾的有毒蛛形动物。
    info: |
      蝎子是蛛形动物（不是昆虫），有典型的螯和一条以毒刺结尾的弯曲尾巴。
      它是古老的动物，最古老的蝎子化石有4亿3千万年以上的历史。
      在黑暗中，它们在紫外线下会发出荧光。
      在约2500种中，只有约25种对人危险。
  insect.centipede:
    label: 蜈蚣
    summary: 一种多足动物，身体每节有一对足。
    info: |
      蜈蚣属于唇足纲（Chilopoda），身体每一节有一对足（并非像英文名暗示的一百只脚）。
      它是行动迅速的捕食者，捕食昆虫、蚯蚓和小型脊椎动物。
      第一对足已变成能麻痹猎物的毒爪。
      有些热带种类体长超过30厘米。
  insect.flea:
    label: 跳蚤
    summary: 一种吸食哺乳动物和鸟类血液的微小跳跃寄生虫。
    info: |
      跳蚤是蚤目（Siphonaptera）的无翅昆虫，专营寄生生活。
      强壮的后腿使它能跳到体长150倍以上的距离。
      它吸食哺乳动物和鸟类的血，并可传播疾病，历史上跳蚤曾传播鼠疫。
      跳蚤是昆虫界的杂技演员。
  insect.termite:
    label: 白蚁
    summary: 一种用泥土筑起巨大蚁丘的社会性昆虫。
    info: |
      白蚁是等翅目（Isoptera）的社会性昆虫，与蟑螂是远亲。
      它们成群生活，有蚁王、蚁后、兵蚁和工蚁。
      它们筑起复杂的白蚁丘，在热带高达9米，并有自己的通风系统。
      作为重要的木材分解者，它们在热带生态系统中起关键作用。
  insect.bumblebee:
    label: 熊蜂
    summary: 一种嗡嗡声低沉、体大多毛的蜂，是重要的传粉者。
    info: |
      熊蜂是熊蜂属（Bombus）体大多毛的昆虫，与蜜蜂近缘。
      它是重要的传粉者，尤其在蜜蜂较少飞行的寒冷气候中。
      它能靠振动飞行肌来给身体加温，因此即使在寒冷中也能飞。
      熊蜂比黄蜂温和，只有在受到直接威胁时才蜇人。
  insect.hornet:
    label: 大黄蜂
    summary: 欧洲最大的黄蜂，有强有力的螫针和响亮的嗡嗡声。
    info: |
      大黄蜂是欧洲最大的社会性黄蜂，体长超过3.5厘米。
      它在树洞中或屋檐下筑起纸质的巢。
      它的螫针比黄蜂更长，蜇刺更痛，但大黄蜂只有在受到直接威胁时才攻击。
      它是其他昆虫的重要天敌。
  insect.cicada:
    label: 蝉
    summary: 一种以在炎热日子里高声鸣叫而闻名的昆虫。
    info: |
      蝉是蝉总科（Cicadoidea）的昆虫，以所有昆虫中最响亮的声音之一而闻名。
      雄性用腹部特殊的膜（鼓膜）发声，以吸引雌性。
      美国有些种类的发育周期为十七年或十三年。
      若虫在地下生活多年，以树根为食。
  insect.locust:
    label: 蝗虫
    summary: 一种结成数百万只毁灭性群体的迁飞蝗虫。
    info: |
      飞蝗是一种蝗虫，在特定条件下会结成巨大的迁飞群体。
      一个蝗群可达数十亿只，一天之内就能毁掉数千公顷的庄稼。
      在非洲和亚洲各国，蝗虫历来是最大的农业灾害之一。
      在《圣经》中，它们是埃及十灾之一。
  insect.aphid:
    label: 蚜虫
    summary: 一种在植物茎上的微小吸汁昆虫，会分泌蜜露。
    info: |
      蚜虫是蚜总科（Aphidoidea）的小型吸汁昆虫，以植物汁液为食。
      它们分泌甜甜的蜜露，蚂蚁则以保护它们作为回报。
      它们繁殖极快，一只雌虫一年内可繁育出数亿后代。
      它们是农作物的重要害虫。
  insect.earwig:
    label: 蠼螋
    summary: 一种腹部末端带钳的细长昆虫。
    info: |
      蠼螋是革翅目（Dermaptera）的昆虫，以腹部末端的钳（尾铗）为特征，用于防御和交配。
      它的英文名源于它钻进人耳的迷信，这只是一个传说。
      蠼螋的雌性会照料卵和幼虫，这一点很特别，在昆虫中很少见。
      它们生活在缝隙里、石头下和落叶层中。
  insect.silverfish:
    label: 衣鱼
    summary: 一种无翅、行动迅速的昆虫，在家中书籍和纸张旁出现。
    info: |
      衣鱼是缨尾目（Zygentoma）的原始无翅昆虫，生活在住所中。
      它以淀粉、纸张、书籍胶和纺织纤维为食。
      它的名字来自银色的体色和像鱼一样的动作。
      它属于最古老的昆虫目之一，3亿多年来几乎没有变化。
  insect.water_strider:
    label: 水黾
    summary: 一种借助表面张力在水面行走的昆虫。
    info: |
      水黾是黾蝽科（Gerridae）的昆虫，靠腿上的疏水绒毛和水的表面张力在水上行走。
      它捕食落入水中的昆虫，靠水面的振动来发现它们。
      它行动迅速，每秒能在水面滑行超过体长150倍的距离。
  insect.dung_beetle:
    label: 屎壳郎
    summary: 一种滚粪球的甲虫，在古埃及被视为神圣。
    info: |
      圣甲虫是金龟子科的甲虫，把粪便做成球并滚动，用来埋藏并在其中产卵。
      在古埃及，它是太阳和凯布利神的象征。
      它是少数依靠银河来辨别方向的动物之一。
      它有助于养分循环和土壤通气。
  insect.stag_beetle:
    label: 锹甲
    summary: 欧洲最大的甲虫，雄性有像鹿角般的大颚。
    info: |
      锹甲是欧洲最大的甲虫，体长超过7厘米。
      雄性有像鹿角般巨大的大颚，用于争夺雌性的争斗。
      幼虫在腐朽的橡木中最长可活7年，以真菌为食。
      由于古老森林和枯木的消失，它受到严重威胁。
  insect.atlas_moth:
    label: 乌桕大蚕蛾
    summary: 世界上最大的蛾之一，翅膀上有蛇形花纹。
    info: |
      乌桕大蚕蛾是世界上最大的蛾之一，翅展可达30厘米。
      它翅尖的颜色酷似蛇头，用来吓退捕食者。
      成虫没有口器，完全不进食，只能活几天。
      它来自东南亚的热带森林。
  insect.weevil:
    label: 象鼻虫
    summary: 一种有特有长喙的小甲虫。
    info: |
      象鼻虫是象甲科（Curculionidae）的甲虫，是世界上最大的动物科，有6万多种。
      它特有的长喙（口吻）用来钻进种子、果实和树干。
      有些种类是严重的农业害虫，如棉铃象甲。
      另一些种类只专门取食某一种植物。
  insect.lacewing:
    label: 草蛉
    summary: 一种有透明网状翅膀的纤弱昆虫，幼虫捕食蚜虫。
    info: |
      草蛉是草蛉科（Chrysopidae）的昆虫，有纤细、透明网状的翅膀和金色的眼睛。
      幼虫是捕食者，会吃掉大量蚜虫，因而成为植物的天然保护者。
      成虫以花蜜和花粉为食。
      它们会被光吸引，是健康环境的标志。
  insect.crane_fly:
    label: 大蚊
    summary: 一种像蚊子的大型蝇类，有极长的腿。
    info: |
      大蚊是大蚊科（Tipulidae）的双翅目昆虫，外形像巨大的蚊子，但既不叮咬也不寄生。
      它极长的腿容易脱落，这是一种防御机制（自切）。
      成虫只活几天，要么不进食，要么以花蜜为食。
      幼虫生活在土壤中，以植物根为食。
  insect.mayfly:
    label: 蜉蝣
    summary: 成虫寿命最短的昆虫，只能活几个小时到几天。
    info: |
      蜉蝣是蜉蝣目（Ephemeroptera）的昆虫，是短暂的象征，成虫只活几个小时到几天。
      它们没有能用的口器，完全不进食。
      若虫在水中生活1到3年。
      蜉蝣的大规模群飞是迷人的自然奇观，在匈牙利的多瑙河上是独特的现象。
  insect.damselfly:
    label: 豆娘
    summary: 蜻蜓纤细的亲戚，休息时把翅膀沿身体合拢。
    info: |
      豆娘是与蜻蜓近缘但更纤细的昆虫，与大蜻蜓不同，休息时把翅膀平行于身体合拢。
      它是捕食者，在飞行中捕捉小昆虫。
      若虫生活在水中，是水生生态系统的重要组成部分。
      它们是水体水质的指示物种。
  insect.robber_fly:
    label: 食虫虻
    summary: 一种在飞行中捕捉其他昆虫的捕食性蝇类。
    info: |
      食虫虻是食虫虻科（Asilidae）的捕食性双翅目昆虫，直接在飞行中捕捉其他昆虫。
      它有强壮的腿用来抓住猎物，还有刺吸式的口器注入使猎物麻痹的毒液。
      有些种类模仿熊蜂或黄蜂的外形，以防御捕食者。
      它作为昆虫种群的天然调节者很有用。
  insect.ground_beetle:
    label: 步甲
    summary: 一种行动迅速的捕食性甲虫，生活在石头下和落叶层中。
    info: |
      步甲是步甲科（Carabidae）的甲虫，大多数种类是活跃的夜行性捕食者，捕食其他昆虫、蚯蚓和蜗牛。
      它们行动迅速，遇险时会迅速逃走。
      有些种类，如紫步甲，有美丽的金属光泽。
      它们是健康土壤和自然农业的标志。
  insect.tiger_beetle:
    label: 虎甲
    summary: 一种行动迅速、有金属光泽、视力极佳的甲虫。
    info: |
      虎甲是虎甲亚科（Cicindelinae）的甲虫，以非凡的速度、飞行能力和敏锐的视力闻名。
      它跑得太快，以致必须停下重新辨向，因为动作对它的视觉系统来说太快了。
      它有色彩美丽的金属光泽身体（绿、蓝、红）和大大的眼睛。
      幼虫在地里挖垂直的隧道，在洞口伏击猎物。
  insect.hoverfly:
    label: 食蚜蝇
    summary: 一种模仿黄蜂和蜜蜂颜色的蝇类，是花园的传粉者。
    info: |
      食蚜蝇是食蚜蝇科（Syrphidae）的双翅目昆虫，虽不蜇人，却模仿黄蜂和蜜蜂的颜色来防御捕食者（贝氏拟态）。
      它是重要的传粉者，比蜜蜂拜访更多的植物种类。
      成虫以花蜜和花粉为食。
      有些种类的幼虫捕食蚜虫，因而在花园里有益。
  insect.whirligig_beetle:
    label: 豉甲
    summary: 一种在水面成群旋转的小甲虫。
    info: |
      豉甲是豉甲科（Gyrinidae）的水生甲虫，生活在水面，成群旋转有助于它躲避捕食者。
      它的眼睛分为两部分，一部分看水上，一部分看水下。
      它能感知水面的涟漪，从中察觉食物或危险。
      白天旋转，夜晚飞行。
  insect.louse:
    label: 虱子
    summary: 一种生活在哺乳动物皮肤和毛发上的微小无翅寄生虫。
    info: |
      虱子是虱目（Phthiraptera）的无翅寄生昆虫，生活在宿主的皮肤和毛发或头发中。
      它吸血并引起瘙痒。
      头虱遍布全世界，无论卫生状况如何都会侵染儿童。
      历史上，虱子曾传播斑疹伤寒等疾病。
  insect.bedbug:
    label: 臭虫
    summary: 一种夜间吸血的扁平寄生虫，藏在家具的缝隙里。
    info: |
      臭虫是臭虫科（Cimicidae）扁平的椭圆形昆虫，主要在夜间活动。
      它叮咬并吸食熟睡宿主的血。
      它藏在床垫的缝隙里、家具中和墙纸后面。
      近几十年来，它借助国际旅行传遍了全世界。
  insect.antlion:
    label: 蚁狮
    summary: 一种在沙中挖漏斗形陷阱捕蚂蚁的幼虫。
    info: |
      蚁狮是蚁蛉科（Myrmeleontidae）昆虫的幼虫，在干沙中挖出圆锥形的漏斗。
      当蚂蚁滑入陷阱，蚁狮用大颚抓住它并注入消化液。
      成虫不起眼，像蜻蜓，在夜间飞行。
      幼虫能在地下数年不进食地活着。
  insect.goliath_beetle:
    label: 歌利亚大角花金龟
    summary: 世界上最大最重的昆虫之一，产于热带非洲。
    info: |
      歌利亚大角花金龟是世界上最大的昆虫之一，雄性重达100克，体长超过11厘米。
      它生活在赤道非洲的热带雨林中。
      成虫以水果和树液为食。
      在非洲，孩子们有时把它们当玩具，有些还被卖给收藏者。
  insect.bombardier_beetle:
    label: 放屁甲虫
    summary: 一种为防御而喷出滚烫有毒混合物的甲虫。
    info: |
      放屁甲虫是气步甲亚科（Brachininae）的甲虫，以独特的方式自卫，它在腹部混合两种化学物质，引发温度超过100度的爆炸性反应。
      极具腐蚀性的蒸气伴随巨大的爆裂声喷出，每秒可达500次。
      它是自然界化学防御最令人惊叹的例子之一。
  insect.diving_beetle:
    label: 龙虱
    summary: 一种在水面下游泳的捕食性水生甲虫。
    info: |
      黄缘龙虱是龙虱科（Dytiscidae）的捕食性水生甲虫，生活在池塘和静水中。
      它靠像桨一样的扁平后腿灵活地游泳。
      它在水面呼吸，把空气储存在鞘翅下面。
      它捕食昆虫、幼虫、小鱼和蝌蚪。
  insect.velvet_ant:
    label: 蚁蜂
    summary: 一种像蚂蚁的无翅橙黑色黄蜂。
    info: |
      蚁蜂其实是蚁蜂科（Mutillidae）的黄蜂，雌性没有翅膀，像蚂蚁。
      它们有醒目的红色或橙色绒毛作为警戒。
      雌性有极强的螫针，绰号“杀牛者”。
      它们寄生在熊蜂的巢中。
