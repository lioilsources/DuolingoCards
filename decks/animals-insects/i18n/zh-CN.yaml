lang: zh-CN
pivot: false
title: 昆虫
cards:
  insect.ant:
    label: 蚂蚁
    summary: 一种生活在群体中的小型社会性昆虫。
    info: 蚂蚁是一种形成大型群体并有明确分工的昆虫。它们以高度组织化的社会结构而闻名，通常包括工蚁、兵蚁和繁殖蚁等不同角色。
  insect.antlion:
    label: 蚁狮
    summary: 在沙地中挖掘陷阱捕捉蚂蚁的昆虫幼虫。
    info: |-
      蚁狮是脉翅科（Mymeleontidae）昆虫的一种，它们会在干燥的沙滩上挖出圆锥形陷坑。
      当工蜂滑入这些陷阱时，蚁狮会用口器抓住它并注入消化液。成年个体则不显眼、类似蜻蜓，并且夜间飞行；而这种幼虫可以在没有食物的情况下，在地下存活多年。
  insect.aphid:
    label: 蚜虫
    summary: 植物茎上吸汁的小型昆虫；产生蜜露。
    info: |-
      蚜虫是属于蚧总科的微小植食性害虫，以吸取植物液为生。它们会分泌出甜美的蜜露，并由蚂蚁照料作为保护交换。
      繁殖速度极快：一只雌蚜一年内可繁衍数百万后代。
      它们对农作物造成重要危害。
  insect.atlas_moth:
    label: Atlas天蚕蛾
    summary: 一种翅膀上带有蛇形图案的世界最大飞蛾之一。
    info: |-
      Atlas天蚕蛾是世界上最大的夜行性蝴蝶种类，翼展可达30厘米。
      它的翅尖颜色类似毒蛇头部的形状设计用来吓退捕食者。成虫没有嘴巴也不进食；作为成熟个体只能存活几天时间。
      这种昆虫原产于东南亚热带雨林地区。
  insect.bedbug:
    label: 臭虫
    summary: 夜间吸血的扁平寄生昆虫；藏身于家具缝隙中。
    info: 家栖床虱是一种属于臭虫科（Cimicidae）的小型、椭圆形且无翅害虫，主要在夜晚活动。它会叮咬并吸取宿主血液，并隐藏在床上弹簧缝合处、家具和墙纸后面等地方。在过去几十年里由于国际旅行而全球传播开来。
  insect.bee:
    label: 蜜蜂
    summary: 一种黄黑相间的昆虫，能为花朵授粉并制造蜂蜜。
    info: 蜜蜂（学名：Apis mellifera）是一种生活在蜂巢中的社会性昆虫，它们采集花蜜。这种毛茸茸的会蜇人的昆虫以生产蜂蜜而闻名，并在生态系统中扮演着重要的传粉者角色。
  insect.beetle:
    label: 甲虫
    summary: 甲虫是昆虫中种类最多的目，已描述的物种超过四百万种。
    info: |-
      鞘翅目的甲壳类昆虫构成了所有被记录下来的约百分之四十的昆虫。它们的特点是有坚硬的保护性前翼（称为鞘翅），其下隐藏着真正的飞行翅膀。
      鹿角象鼻虫是最具代表性的欧洲大型甲虫之一；雄性能长出巨大的类似犄角般的口器结构来吸引配偶或争夺领地资源等用途。
      从热带地区到北极圈内几乎所有的生态环境里都能发现这类生物的存在踪迹
  insect.bombardier_beetle:
    label: 火炮甲虫
    summary: 一种喷射沸腾有毒混合物作为防御的甲虫。
    info: 火炮甲虫是一种属于隐翅目的鞘翅目昆虫，它以独特的方式进行自我防卫：在尾部将两种化学物质相互作用产生爆炸性反应，并释放出超过摄氏一百度高温。这种高度毒性的蒸汽能每秒最多发射五百次并伴随响亮的声音，在自然界中是极具代表意义的一种生化自卫方式之一
  insect.bumblebee:
    label: 熊蜂
    summary: 一种大型毛茸茸的蜜蜂，发出低沉嗡鸣声的重要传粉者。
    info: |-
      熊蜂是属于Bomhus属的大而多毛昆虫类群，与蜂蜜蜂有亲缘关系。它们在较寒冷气候中是非常重要的授粉媒介，在这种环境中蜜蜂数量较少。
      通过振动飞行肌肉来产生热量的能力使它即使天气冷也能飞翔；相比起其他种类来说性情温和得多，并且只有当直接受到威胁时才会蜇人
  insect.butterfly:
    label: 蝴蝶
    summary: 有大而彩色翅膀的飞行昆虫。
    info: 蝴蝶是一种拥有两对鳞翅的昆虫，这些翅膀常常色彩鲜艳。它们属于鳞翅目动物。
  insect.caterpillar:
    label: 毛虫
    summary: 蝴蝶或蛾的幼虫；吃树叶并为化蛹做准备。
    info: |-
      毛虫是蝶类或者蛾类昆虫的一种，它们主要通过啃食叶子来获取能量以完成蜕变。
      一些颜色鲜艳的毛虫会用这种特征警告捕猎者自己是有毒性的。
      在结茧时它形成一个蛹（即羽化的中间阶段），在这个过程中将完全转变为成年个体。
  insect.centipede:
    label: 蜈蚣
    summary: 一种每一体节具有一对足的多足类动物。
    info: 蜈蚣属于唇足纲，每个体段只长一对脚（并非如名字暗示有100条腿）。它们是快速捕食者，以昆虫、蚯蚓和小型脊椎动物为猎物。第一对步肢演化成毒颚用于麻痹猎物。一些热带种类可长达超过30厘米。
  insect.cicada:
    label: 蝉
    summary: 一种以在炎热的日子里发出响亮鸣叫声而闻名的昆虫。
    info: |-
      蝉是属于同翅目的一类著名昆虫，以其所有虫种中最为嘹亮的声音著称。雄性通过腹部特殊的鼓膜（音钹）产生嗡嗡声来吸引雌性。
      美国的一些种类具有十七年或十三年的生命周期周期。
      幼体(若虫)会在地下生活多年，并靠吸食植物根部为生。
  insect.cockroach:
    label: 蟑螂
    summary: 快速的夜间杂食性昆虫，非常耐受且适应性强。
    info: |-
      蟑螂是世界上最顽强的昆虫之一；它能承受辐射和极端环境条件，在这些条件下其他生物会死亡。目前已知有超过四千五百种蟑螂物种存在，但只有大约三十个种类生活在人类附近。
      这种古老的虫类已经生存了三亿年以上，并在恐龙灭绝时存活下来。它们移动迅速——逃跑速度可达到每小时五公里以上。
  insect.crane_fly:
    label: 摇蚊
    summary: 一种拥有极端长腿的大型类似蚊子的大飞虫。
    info: |-
      摇蚊是一种双翅目昆虫，属于摇蚊科。它们在外观上类似于巨大的蚊子但不会叮咬或寄生。
      其极长腿部很容易断裂脱落；这是自我保护机制（自切）的一种表现形式。
      成年个体只存活几天，并不进食或者仅以花蜜为食
      幼体(俗称地老虎)，生活在土壤中并摄取植物根部作为食物来源
  insect.cricket:
    label: 蟋蟀
    summary: 一种以雄性摩擦翅膀发出鸣叫而闻名的夜行昆虫。
    info: |-
      田蟋是一种属于直翅目的夜间昆虫。雄虫通过互相磨擦其翼来吸引雌性和标记领地。
      在亚洲，人们传统上饲养蟋蟀作为宠物欣赏它们的声音。
      在中国和其他许多文化中，蟋蟀也象征着家庭幸福和好运。
  insect.damselfly:
    label: 薄翅蜻蜓
    summary: 一种身形纤细的类似豆娘昆虫，休息时翅膀与身体平行。
    info: |-
      薄翼类是类似于豆娘的一种虫子，但更瘦长，在静止状态下会将翅膀折叠并与躯干保持一致。它们在飞行中捕食小型飞虫并作为掠夺者存在。
      幼体生活在水中，并且对水生生态系统至关重要。
      这些生物还是水流质量的重要指标物种。
  insect.diving_beetle:
    label: 潜水甲虫
    summary: 在水面下游泳的捕食性水生甲虫。
    info: |-
      大潜水甲虫是一种属于隐翅目（Dytiscidae）家族、生活在池塘和静水中肉食性的水栖昆虫。
      它能够顺畅地游动，因为其扁平后足像船桨一样起作用。它们会在表面呼吸，并将空气储存在鞘翅下方以供使用。
      这种生物会捕捉其他小昆虫、幼虫、小型鱼类甚至跳蚤；无论是在水中还是夜间飞行时都十分活跃。
  insect.dragonfly:
    label: 蜻蜓
    summary: 身体细长、有两对透明翅膀的昆虫。
    info: 蜻蜓是一种视力极佳的捕食性昆虫，常在水域附近活动。它们属于古翅目（Odonata），以快速飞行和精准捕捉猎物而闻名。
  insect.dung_beetle:
    label: 屎壳郎
    summary: 滚动粪球的甲虫，古埃及视为神圣。
    info: |-
      圣金龟子是鞘翅目的一类昆虫，它会将动物排泄物滚成圆球并埋入地下用于产卵。在古代埃及时期被视为太阳和神祇凯布利斯（Khepri）象征之一。
      它是少数几种能依靠银河系导航的生物之一，并有助于营养物质循环及土壤通气作用。
  insect.earwig:
    label: 石蛃
    summary: 细长的昆虫，尾部有钳状器官（ cerci）。
    info: |-
      石蛃是缨翅目的一种节肢动物。它们在尾巴末端有一对用于防御和交配的小夹子。
      这种名字来源于一种迷信：人们认为它会爬进耳朵里；这其实是个误解。
      雌性石蛃非常特别地照顾自己的卵与幼虫，在昆虫中较为罕见。
      它们通常生活在裂缝、石头下或落叶堆中。
  insect.firefly:
    label: 萤火虫
    summary: 一种能发出生物荧光以吸引伴侣的甲壳类昆虫。
    info: |-
      萤火虫是属于灯科的一种能够在其腹部产生冷光源（即生物发光）的甲壳动物。雄性和雌性通过不同的闪光模式来识别彼此并相互吸引，这种现象由化学物质luciferin与酶luciferas之间的反应控制。
      它们也是环境清洁度的重要指标物种。
  insect.flea:
    label: 跳蚤
    summary: 一种吸食哺乳动物和鸟类血液的小型跳跃寄生昆虫。
    info: 跳蚤是属于鞘翅目（Siphonaptera）的无翼小虫，专门以寄生方式生活。它们强壮有力后腿能使其弹起超过身长一百五十倍的距离；通过吸取温血脊椎动物与鸟儿体内的鲜血为生存手段，并且能够传播疾病，在历史上曾导致瘟疫流行开来。这些微型生物堪称节肢类中的杂技高手
  insect.fly:
    label: 苍蝇
    summary: 一种常见的双翅目昆虫，能够传播细菌。
    info: 家蝇是人类居住环境中最常见的双翼类飞虫。其复眼几乎能提供全方位的视野（接近360度）。由于经常落在垃圾和食物上，它会携带并传播各种病菌；它的第二对翅膀退化为平衡器，在飞行中帮助保持稳定。
  insect.goliath_beetle:
    label: 巨人天牛
    summary: 来自热带非洲的一种世界上最大最重的昆虫。
    info: 巨大型的雄性个体重量可达约一百克，体长超过十一厘米。它们生活在赤道地区的热带雨林中；成虫以水果和树液为食，在部分地区儿童会将这种巨型甲壳类生物当作玩具饲养并卖给收藏家
  insect.grasshopper:
    label: 蝗虫
    summary: 能跳跃的昆虫，有长后腿和鸣叫声。
    info: |-
      蚱蜢是属于直翅目的一类具有强壮后肢、能够跳起达体长达二十倍距离的小型节肢动物。
      雄性通过摩擦腿部与翅膀发出特有的声音（称为擦音）来交流。
      它们以植物为食；在大规模群聚时可能对农作物造成严重损害。
  insect.ground_beetle:
    label: 石叩头虫
    summary: 一种快速奔跑的捕食性甲壳类昆虫，生活在石头和落叶下。
    info: 石叩头虫属于步甲科（Carabidae）；大多数种类是活跃的夜间掠食者，以其他昆虫、蚯蚓及蜗牛为猎物。它们行动迅速，在遇到危险时会立即逃跑。一些品种如紫斑叩头虫拥有美丽的金属光泽外表。这些生物还是土壤健康与自然农业状况良好的指标物种。
  insect.hornet:
    label: 大胡蜂
    summary: 欧洲最大的拥有强健尾刺和响亮嗡鸣声的蜜蜂。
    info: |-
      普通虎头蜂是体型超过三厘米半长、在树洞或屋顶上筑造纸质巢穴的最大型社会性欧洲蜂种。
      其毒针比一般黄蜂更粗壮，蜇人时疼痛感更强烈；不过除非受到直接威胁否则不会主动攻击
      它也是其他昆虫的重要捕食者。
  insect.hoverfly:
    label: 花虻
    summary: 一种模仿胡蜂和蜜蜂颜色的蝇类，是花园中的传粉者。
    info: 花虻是一种双翅目食蚜蝇科昆虫，它们通过模拟胡蜂与蜜峰的颜色来躲避捕食者的攻击（贝茨拟态），尽管本身并不会蜇人。它是重要的授粉媒介；访问植物种类的数量甚至超过蜂蜜。成虫以吸吮花蜜为生，并采集花粉。某些物种幼虫会捕捉蚜虫，在园艺中起到积极作用。
  insect.lacewing:
    label: 金龟子
    summary: 一种具有透明网状翅的昆虫；幼虫捕食蚜虫。
    info: 金龟子属于脉翅目草蛉科，拥有纤细且半透明、带有明显网络纹路的大翅膀和金色眼睛。其幼虫是肉食性生物，并会大量吞吃蚜虫，在自然中扮演着植物保护者的角色。成年个体则以花蜜与花粉为食物来源。它们会被光源吸引并被视为生态环境健康的指标物种之一。
  insect.ladybug:
    label: 瓢虫
    summary: 小型圆形红色甲壳类昆虫，带有黑色斑点。
    info: 瓢虫是一种小甲虫，以蚜虫为食，在花园中非常有用。
  insect.locust:
    label: 迁徙蝗虫
    summary: 形成毁灭性百万只群体的迁移型蝗虫。
    info: 沙漠飞蝗是一种在特定条件下会组成巨大移动种群的蚱蜢。一个族群可能包含数十亿个体，能在一天内摧毁数千公顷范围内的全部作物。历史上，在非洲和亚洲地区，这种昆虫是最大的农业灾难之一；《圣经》中它也是埃及十灾其中之一。
  insect.louse:
    label: 虱子
    summary: 一种寄生在哺乳动物皮肤和毛发上的无翅小虫。
    info: |-
      虱是一种属于甲壳纲的微小型无翼寄生病媒，生活在宿主皮下或其体表。它们吸血并引起瘙痒感。
      头虱（儿童常见）在全球范围内广泛存在，并且无论卫生条件如何都会感染孩子。
      历史上，虱曾传播伤寒和其他疾病。
  insect.mayfly:
    label: 蜉蝣
    summary: 成年寿命最短的昆虫，仅存活几小时到几天。
    info: |-
      蜉蝣属于蜻蜓目（古翅类），象征短暂的生命；它们只活几个小时至数天。
       成虫没有功能性口器，并不进食。幼体生活在水下一年半载。
       蜉蝣的大规模羽化是一种迷人的自然现象，在匈牙利多瑙河上的集体繁殖是独一无二的现象。
  insect.mosquito:
    label: 蚊子
    summary: 双翅目昆虫；雌性吸血并可能传播疾病。
    info: |-
      蚊是属于库蠓科的双翼飞行害虫。
      雌蚊吸取动物血液以获取蛋白质用于产卵，雄蚊则主要靠花蜜为食。
      蚊可以传播危险性疾病如疟疾、登革热和寨卡病毒等。
      全球已知有超过三千五百种不同的蚊。
  insect.moth:
    label: 蛾
    summary: 夜间活动的蝴蝶近亲；在光线下飞行并有羽毛状触角。
    info: |-
      蛾是属于鳞翅目（Lepidoptera）的一类夜行性飞虫，与白天活跃、休息时翅膀展开的日间蝶不同的是它们通常将双翼折叠靠拢。
      许多种类会被人造光源吸引。我们所使用的天然丝绸来自蚕蛹阶段的丝茧。
      月神蛾就是世界上最美丽的蛾之一。
  insect.praying_mantis:
    label: 螳螂
    summary: 具有祈祷姿势和闪电般攻击速度的捕食性昆虫。
    info: 螳螂是一种属于等翅目的掠食性昆虫。它的名字来源于其独特的姿态，前肢合拢仿佛在祷告一般。它们是狩猎高手：能在瞬间迅速出击并抓住猎物；有时雌虫会在交配后吃掉雄虫，但这种情况并非总是发生。
  insect.robber_fly:
    label: 长脚蝇
    summary: 一种在飞行中捕捉其他昆虫的掠食性苍蝇。
    info: 长脚蝇是属于寄生蜂科的一种捕猎双翅目害虫，它们直接通过空中狩猎来抓捕其它小飞虫。这种生物拥有强壮有力足部用于抓住猎物，并且具备能够注入麻痹毒液的能力；某些种类甚至模仿黄蜂或蚂蚁的样子以避免被天敌发现。作为自然控制昆虫种群数量的重要角色之一，在生态系统中有积极作用
  insect.scorpion:
    label: 蝎子
    summary: 一种有毒的节肢动物，有螯钳和弯曲带毒尾刺。
    info: |-
      蝎属于蛛形纲（而非昆虫），具有典型的螯足以及末端带有毒性针状器官的弯尾巴。
      它们是古老的生物；最老的化石可追溯到超过四亿三千万年前的历史。在黑暗中会因紫外线照射而发出荧光。
      约两千五百种之中只有大约二十五个物种对人类构成危险性。
  insect.silverfish:
    label: 银鱼
    summary: 一种无翅的快速昆虫，常见于室内书籍和纸张附近。
    info: |-
      书虱是一种原始且没有翅膀的家庭内常见的节肢动物。它们以淀粉、纸质材料、装订胶水以及纺织纤维为食源。
      其名称来源于它那类似鱼类的动作及闪亮如白银般的体色特征；
      它是现存最古老的虫类之一，在过去三亿年中几乎没有发生过显著变化
  insect.spider:
    label: 蜘蛛
    summary: 有八条腿的蛛形纲动物，编织网捕捉昆虫。
    info: |-
      蜘蛛属于节肢动物门中的蛛形纲（不是真正的昆虫），拥有八只脚和两部分身体。
      它们能够制造丝线，并用其织成捕猎或包裹卵茧所需的网络结构。全球已知约存在超过四万八千种不同的蜘蛛种类。
      所有品种都会分泌毒液但绝大多数对人类无害。
  insect.stag_beetle:
    label: 鹿角锹形虫
    summary: 欧洲最大的甲壳类昆虫；雄性拥有类似鹿角的下颚。
    info: |-
      普通鹿角锹形虫是体型超过七厘米、在全欧最大型的一种甲壳动物。雄性的巨大鹿状口器用于争夺雌性时进行战斗。
      幼虫可在橡树腐烂木材中生存长达七年，并以真菌为食。
      由于古老森林和枯木数量减少，这种生物已被列为极度濒危物种。
  insect.stick_insect:
    label: 竹节虫
    summary: 一种完美模仿树枝或树叶的昆虫。
    info: "竹节虫属于无翼目，是拟态大师；其身体能够完全模拟枝条或者叶子。当受到威胁时会一动不动保持静止状态。\r\n一些种类通过单性生殖繁殖（即不需要雄性的参与）\r\n由于饲养简单且具有异域风情而成为受欢迎的家庭宠物"
  insect.termite:
    label: 白蚁
    summary: 一种社会性昆虫，用泥土建造巨大的巢穴。
    info: |-
      白蚁是等翅目的一种群居节肢动物，与蟑螂有较远的亲缘关系。
      它们生活在由雄虫、雌王（后）、兵蚁和工蚁组成的群体中。
      会修建复杂的土丘，在热带地区甚至高达九米，并配有通风系统。作为木材的主要分解者之一，其在热带生态系统中有重要作用。
  insect.tiger_beetle:
    label: 田虎
    summary: 金属色的快速奔跑甲虫，拥有敏锐视力。
    info: |-
      田虎是一种属于拟步甲科（Carabidae）下的猛兽型昆虫。它以惊人的速度、飞行能力和锐利视觉而闻名。
      它的跑动非常迅速以至于需要停下来重新定位方向——因为其运动太快了超过了自身视网膜处理信息的速度；
      它们有着绚丽多彩且带有光泽感的身体颜色(如绿色或蓝色)，以及大眼睛;
      幼虫则会在土壤中挖掘垂直隧道并在洞口等待猎物出现捕食之.
  insect.velvet_ant:
    label: 绒毛蚁蜂
    summary: 一种橙黑色无翅的蚂蚁状胡蜂。
    info: |-
      绒毛蚁蜂实际上是属于蚁蜂科（Mutillidae）的一种胡蜂；雌性没有翅膀，外形类似蚂蚁。它们有显眼红色或橘色体毛作为警告信号。
      雌性的毒刺极其强大，并被戏称为‘牛杀手’(Cow Killer)，寄生在马蜂巢中。
  insect.wasp:
    label: 黄蜂
    summary: 黄色和黑色的刺痛昆虫，建造纸巢。
    info: |-
      常见的胡蜂属于 Vespa 属的一种典型的黑黄警示色刺虫。
      它们用咀嚼过的木屑建造成纸质状的窝穴。
      与蜜蜂不同的是它能够多次叮咬人。作为天然控制害虫数量的角色而具有益处作用
  insect.water_strider:
    label: 水黾
    summary: 利用水面张力在水上行走的昆虫。
    info: |-
      水黾是一种属于 Gerridae 科的小型昆虫，能够通过脚上的疏水性毛发和水流表面张力，在液面上自由移动。它们以沉入水中但未完全溺死的其他小虫为食，并能感知到液体波动来捕猎目标。
      这种生物行动迅速且滑行速度惊人——每秒可达自身身体长度的一百五十倍以上。
  insect.weevil:
    label: 象鼻虫
    summary: 一种具有特征性长喙的小型甲壳类昆虫。
    info: |-
      象鼻虫是属于世界上最大的动物科——象鼻虫科的甲壳纲生物，该家族拥有超过六万个物种。其标志性的细长得像鼻子的部分（口器）用于钻入种子、果实和树干中取食。
      一些种类如棉铃象鼻虫对农业造成严重危害；另一些则专门依赖某一类植物生存。
  insect.whirligig_beetle:
    label: 涡流甲虫
    summary: 一种在水面成群旋转的小型水生昆虫。
    info: 涡流甲虫是属于吉里尼科（Gyrinidae）家族的水栖小甲壳类，它们生活在湖面或池塘表面，并通过群体性地绕圈来躲避捕食者。它的复眼分为两部分：一部分用于观察水上环境，另一部则用来探测水中情况；它能感知到由食物或者危险带来的涟漪变化，在白天进行这种旋转型移动时还会飞行于夜间活动之中
