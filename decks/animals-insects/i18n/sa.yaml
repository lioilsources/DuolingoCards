lang: sa
pivot: false
title: कीटनाम
cards:
  insect.ant:
    label: म्रग्नक
    summary: सामाजिक कीट जो समूह में रहता है।
    info: एक प्रकार के चींटियाँ बड़े समुदायों में रहते हैं और उनमें कार्य का विभाजन होता है।
  insect.bee:
    label: मधुमक्खी
    summary: पीला कालो जिमखारू मधुनिर्माण करत हवे संग पुष्प ओपियलन करे।
    info: मधुमक्कि एक सामाजिक छेड़छाड़ वाला शहद बनाने वाला जानवर हवे जे अण्डर में रहे तथा नेक्टर इकट्ठा करे।
  insect.butterfly:
    label: मोतील
    summary: विमान चलने वाला कीट जिसके प्रच्छद में सुंदर रंग होते हैं।
    info: एक मोतील दो युग्म शुपणात्मक प्रच्छदों वाला कीट होता है, अक्सर उभरे हुए रंगों के साथ।
  insect.dragonfly:
    label: वाजका
    summary: दीर्घ शरीर एवं प्रतिलोम कृष्ण पखें वाला हमीन।
    info: वाजका दुःसह अणले से युक्त एक मारक हमीन होइत जे जलयुक्त स्थलों में भोजन खोजत हई। इसके चार पखे होथे, जे बड़े आकार के एवं पारभासी होथे।
  insect.ladybug:
    label: बरूश्का
    summary: नीले धब्बों वाला छोटा गोल लाल कीड़ा।
    info: बरुष्का एक निर्मल कीड़ा है जो मस्तिष्क पर भोजन करता है और उद्यान में फायदेमंद होता है।
