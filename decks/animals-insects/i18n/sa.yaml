lang: sa
pivot: false
title: कीटनाम
cards:
  insect.ant:
    label: म्रग्नक
    summary: सामाजिक कीट जो समूह में रहता है।
    info: एक प्रकार के चींटियाँ बड़े समुदायों में रहते हैं और उनमें कार्य का विभाजन होता है।
  insect.antlion:
    label: म्रग्नलेवन्
    summary: भौमिक बच्चा अण्टा के पकड़िऊक लेल गढ़ खोदइत छ
    info: |-
      म्रग्नलेवन् जीवः हिमालयस्य मुरजा कूपं पकड़िते सोखद बच्चाओं के खाद्य।
      अब एकटा अण्टा गहिरा छेड़िए, म्रग्नलेवन् उसके तथा शिकार करे आउषधि और भोजन घोलकर इंजेक्सन फेंके।
      आश्चर्यजनक ऐसा धैर्ष्ण झुकाऊ ढंग से ठीठी थई ऋतुओं में उडऩे वाळा जीव भी रहइत अछि।
  insect.aphid:
    label: म्शिका
    summary: एक प्रकार केनी मधुरा
    info: म्शिसे एक प्रकार केनी मधुरा सूचना होति। इह वसंतऋतौ अपवलग्‍य तथा उष्णदशा में भी जीविष्यति।
  insect.atlas_moth:
    label: मार्टिना च्‍च अटलसोवीय
    summary: आफ्ण पखेढ़ि मेँ सांपके ऊषर ऐसे दिखायउ वाळा एक ऋषि और महतर मौरी
    info: |-
      मार्टिना च्‍च अटलसोवीय संसारके महतर कूनि प्रज्वलनशेषुओं मेए हई। इएके पखेमणि तड़गइ बदबद जैसे दिखायउ हई ओऊपर शिकारीके भय लगे छथि।
      अधिपति मुख उभय गछि आऊर फल धाहि घढ़ थकि ठाड़ झनकि दिस रहल हई।
  insect.bedbug:
    label: शयन
    summary: इसका शरीर फ़्लॉईड होता है और एक बिछौना में गढ़े में भीषण घुसखंभ करता है।
    info: शयन चिमेक्स के समुदाय में प्रजाति है। इसका आहार अपनी नोचती हए जंगली खरबटे के लघवी द्वारा होता है।
  insect.bee:
    label: मधुमक्खी
    summary: पीला कालो जिमखारू मधुनिर्माण करत हवे संग पुष्प ओपियलन करे।
    info: मधुमक्कि एक सामाजिक छेड़छाड़ वाला शहद बनाने वाला जानवर हवे जे अण्डर में रहे तथा नेक्टर इकट्ठा करे।
  insect.beetle:
    label: বাই
    summary: |-
      য৆ থ্ভিপ়ম ০ৱ৏
      ৎ৒ড় োৌয়৊ ঽ঺ঢ়
    info: |-
      ब्रौक कोलिओप्टेरा वंश में होता है और सभी पहचाने गए कीटों के लगभग 40% बनाता है।
      इसमें कठोर पखवाज के आवरण (ईलियट्रा) होते हैं, जिसके भीतर असली उड़ान चोंदे छुपे होते हैं。
      जेमिनि डील हार्क है एक ऐसा दाढ़ीय घोंघा है जो इंग्लैंड का सबसे बड़ा खछुआ है;
      male has massive antler-like mandibles.
  insect.bumblebee:
    label: ই৆াত্
    summary: ठंढे ়ম मेँ फल और खेटिए के ओपिस निमित्त इउ झाड़झुआ छोटा आओ धीरे ढंग से थपकी ऐसा बच्चा
    info: |-
      चमेलाक हा बॉम्बस प्रजन के सदस्य महत्वपूर्ण पुष्पोंकीटि हलय।
      ईशिशवरण जगह मधुबखरे के तुलना मेँ चमेलाक अधिक सफ़ल हलथे,
      ऊ ठंडे मौसम मेँ भी ई ऊछे गरम करे के द्वारा घुमइत हलए।
  insect.butterfly:
    label: मोतील
    summary: विमान चलने वाला कीट जिसके प्रच्छद में सुंदर रंग होते हैं।
    info: एक मोतील दो युग्म शुपणात्मक प्रच्छदों वाला कीट होता है, अक्सर उभरे हुए रंगों के साथ।
  insect.caterpillar:
    label: हौसेंका
    summary: मोतील अथवा मुरि के प्रावणिम ;घास खाय गच्हि फटे छदड़ि बनाऽ ि तयारी करे
    info: "हौसेन्का मोतील अथवा मुरि के प्रावणिम हय। समन्‍जक चढ़ईपंख बनाईएबा लगइ ऊऊ शक्ति एकठन करे रहछि जे फटे छदड़ि आउ घास खाय गच्हि।\nकुछ हौसेंका दशा भयाणक धुआँधर ओभर झि डाटे इओ ठाउऱि थोथक औषधि ऐ ऋजु ढंग से बतापाङ्ग। \nफटे छदड़ि ऑव चृषलिष्ड बनाऒ जे एकठन शरीर ि बदले बर जाऩि जाऴ ा ऻ"
  insect.centipede:
    label: स्टोनौज़का
    summary: अष्ठभुज ऐथ्रोपोड जिम्मेण्डा के थापर ऊपर एक जोड़ी पगहलयुक्त
    info: |-
      स्टोनॉज़का चिलीपोडा के संघ में होता है और प्रत्येक शारीरिक खण्ड में एक जोड़ी पगहलयुक्त होता है।
      इनमें झीले, कृच्छ आदि का निवलन करने बाहेर अधिगमशील भी होते हैं。
      एक दबई ओखटी इनके घासवले फाँस में धकेले जाते हैं।
  insect.cicada:
    label: चिकाडा
    summary: ऊष्ण दिहाः में ऐसा कीटजीव जो अत्यधिक शब्द फौलने वाले झंझट गाने के लए प्रख्यात है
    info: चिकादा है एक प्रकार की सर्पमेखलों मे आने वाला कीटजीव। इसके पुति अपने पश्चगामयों में उभयद्‍वनित धड़कन बनाने योग्य गहन शब्द जनित करते हैं और मध्स्थि भाँति ओढऩे के लए ऊष्ण ऋतुओं में घण्टा छोड़ते हैं।
  insect.cockroach:
    label: \u09ab\u09df
    summary: '\<span class=''highlight''>সা</span> <span class="bold">(Cockroach)</span>: एक प्राचीन कीट है।'
    info: '{"\u09b8\u09be \u09ac\u09cd\u09af\u09c7\u09aa\u09bc\u09ae": "\u09ad\u09f6\u09d1\u09dc\u09bf\u09ce \/\u09cc\u09ca\"}'
  insect.crane_fly:
    label: टिपुलका
    summary: एक असाधारण छोटे कीटनशा के समान चिह्निक भयंकर गठिमा घटिस
    info: टिपुलका द्वि-पंखी प्राणी है जो कीटनशा से मेल खाता है। यह एक बड़े कीटनशा के समान दिखता है और टिपुलिडे परिवार में आवेशित है।
  insect.cricket:
    label: १क़়্
    summary: उबड़खाबडऩ शब्द िछ ाई ऱिञ्जन ऒर ऍर्थोप्टेरा ऴाः ऄन्तर्गत एक रात्रि झाड़ि
    info: "ग्रील्लस जाति के सभ प्रकारन् में हरिणोंचा अवशुद्धता।\nपौमन् ग्रील्स आपआप एड़ियों द्वारा घषण बजाकर नरहरियों चा उबड़खाबड़ शब्द भए और इस प्रकार ऊधर खींचत छथि ओर टेरिटरी फटाथि। \nअफगाहनिष्ठन ई झाड़ियों ऐतिहासिक ढंग सँ घरेलू पाळिमन ऋतुओं के लिपि ऑइठि।"
  insect.damselfly:
    label: "\U00013175�콊짼쿵쾿쿥쾠쿭쿕쿯쿮쾫"
    summary: मधुमखी के छूट ढंग के सभंजन; आराम करते समय शरीर के समाँतर पंख बँचवए
    info: "शिद्लातका मधुमखी के संबंध वल होनि पर उससे छूट अउ नेपथयता। यह आराम करते समय शरीर के समाँतर पंख बँचवए हई रहइत जे एगो भेड़िया हई।\nअपना खाई गदडऩ चल घुमरि झाटकर धुआढऱ मधुमखी फ्रणज करइत ओ। \nनिकफ ऊपर ठठा रहइत और इनके जलीय पारिस्थितिकी प्रणाळी में महत्वपूर्ण भूमिका हई।"
  insect.dragonfly:
    label: वाजका
    summary: दीर्घ शरीर एवं प्रतिलोम कृष्ण पखें वाला हमीन।
    info: वाजका दुःसह अणले से युक्त एक मारक हमीन होइत जे जलयुक्त स्थलों में भोजन खोजत हई। इसके चार पखे होथे, जे बड़े आकार के एवं पारभासी होथे।
  insect.dung_beetle:
    label: व्रुबौन
    summary: घन अशय के गोल बनाऩे वाळा ब्रौक; जुआन फिराऒच में पवित्र
    info: "व्रुबौन पोस्वाट्‍टी सरेबे आईडिया कलकम महत्त्वपूर्ण हंदि। इ ज़खण्ड अशय लगभग गोलाकार घन निम्हाईए और उन्से दफनाए ओर अंडे भरे चढ़ाइए।\nजुआन फिराऒच शमर थे धरि छठ ऊष्मा खग्रेष्ठ ढेरथ झुओर ऐऊ ऋषि चेप्री के प्रतीक रहिस। \nअउ िइ ऑरिएंटेशन दृष्टि से दुगध नदी के उपयोग करे वाले जीवों मेँ ाएक नामी जीव हंदि।"
  insect.earwig:
    label: 'ष्ट्क्वोर्‍ '
    summary: '''एक ओझल डाँठे वाळा कीड़क'''
    info: |-
      श्कवोर देरमेपटिरा कीड़क प्रजाति है। इसके मुख्य लक्षण संगलनहीनता वाले 'चपटे' (CERCI), जो पूछे के अंत में होते हैं, और बचाव एवं शुभ्रता के उद्धेस से भी निमय होते हैं।
      इसका नाम ऐसे आधार पर चुना गया है कि छोटे कीड़क घुपथे में ठीठे में फंस जाथे - जो झूठा खबर है।
  insect.firefly:
    label: swetluskha
    summary: भाषा ऐसे ऋण जो ऑफर करता है
    info: |-
      स्वेतलुषका लैमपिराइडी के परिवार से होती हैं। यह मच्छरदन्ति एवं अणुओं के बीजगणिक उत्प्रेरक द्वारा निशाचर जब भी आवश्यकता होती है ठंढ़ा प्रकाश उत्सर्ग करती है।
      एक और घटना ऊर्मय झिळकाओं के फूटने के डाटा के खाँचे में ध्वनि ढाल था।
  insect.flea:
    label: बला
    summary: अधिकाँश छोटे झौठे डाटा के ऋणात्मक ठेला ढंढोरा ऑफ स्थलचर और पक्षियों के रक्त का निःशुल्क भोजन करते हैं।
    info: |-
      बला एक परजीविजन है स्फोंगेपटेराक क्रम में।
      इसके मज़बूत पश्चपद्‍य पखुड़िए शरीर की लंबाई के 150 गुणा उछलने की अनुमति देते हैं।
      बला स्थलचर और पक्षियों के रक्त का निःशुल्क भोजन करती है और बीमारियों के पहुंचाव कर सकती है;
      históric इतिहास में खसरा आउटब्रेक्स के पहुंचाओ के लिए बला ऊष्मा के धारक घोषित हुई है।
  insect.fly:
    label: माशा
    summary: अक्सर इस्तेमाल होऊ फ्लाप खण्ड ऐसे बैक्टीरिऑन के ढोआ सकथे
    info: |-
      मादक घरेलू मच्छर होले सभ की प्रतिक्रिया मनुष्यों के निवाससह।
      यज्‍ञवश्‍टि चक्षुः तद् अपगतं 360 डिग्री आसपास ध्यान रखथ।
      बैक्टीरिए बढईए कइयों काम उठाथे, काहे कि ओ जंड़े और भोजन पर ठहरथे।
  insect.goliath_beetle:
    label: गोलिाश
    summary: ऑफ्रीका के उष्णकटिबंधीय जंगल में ऐक ऋण भारी और बड़ातर हमज हयुआ
    info: "गोलिआश ओब्रॉव्सकी संसार में हमज के पहचानने योग्य बड़ातर हयुआओं मेँए। इनमे एक व्यक्ति के भाग के अधिकतम द्रव्यमान 100 ग्राम और लम्बाई 11 सेटी॰ में जाहिर हथे।\nइ ऊषणपट्ठभौगोलिक ऑफ्रीका में शाखा धरि चढऩे घने झाडङ्‍घई में छद्रिथे। \nउनके फल और वृक्ष रस खाणापर जीऊअछि।"
  insect.grasshopper:
    label: ओर्थोपटरा
    summary: उफलने और ध्वनि एक ओर्टोप्पेरा
    info: |-
      क्रीड़ा जन्तु के समूह में होलथपरियामि पदचिह्नवाले चलते हएं।
      इसके पश्छिम्‍य अग्रभाग शरीर के दशमलव भार के बरावर उछलने के आधार होते हएं।
  insect.ground_beetle:
    label: स्ट्रेवलिक
    summary: काष्ठ आऊर घास मे रहे तेज गति वाळा शिकारी पकवान
    info: |-
      स्ट्रेवलिक कराबीडे फैमिलि सङ्ग पकवान होइत अछि। मुख्यतया इहनंच जाति रामबग शिकारी छथि एउटा चलिस दुसर घोपा, कृशक आऊर खरई भएकल उठाथि
      अधिकांश धाओण झलकि ठाड़ ढंग सँ छद्‍मभय ले बचौ ऐ झलकि तेहि ऊपर
      फिऑलो औजापन जैस िओ जाति धाण ऋषभ धाऒण छथि
  insect.hornet:
    label: শাধৈ
    summary: उरोप के सबसे बड़े झुंझर के धारीदार ठोस ढंग और थोथे ऑफँ के साथ
    info: "स्र्शेन ओबेरना संकुलित पालीमो के महत्वपूर्ण हवज़ियल डेरिएटिफ़्एड।\nऊषण गढ़ेगोशों में या छतों पर बचे खाली जगहों में कागज के घर बनाकर रहता है। \nइसका टखना अधिक ऊभरा हआई होता हॆ और चोट ददअ भी इसके उठामे के कारण ऐसा होता है।"
  insect.hoverfly:
    label: पेस्ट्रेंका
    summary: अपने रंग से चोंचलों और मधुमखिमन की आभा भित्षिकरण करता है, एउ फूलों के ऑप्पलन करता है
    info: "पेस्ट्रेंका दुविधारी कीट है सरफ़िडे परिवार में। यह चोंचलों और मधुमखिमन के अग्रदशीयता के बचाने के लिए उसके शरीर के रंग की आभा भित्षिकरण करता है (बौथेज़ोव्हस्की मिथक) , इसके बजाओ खुद डंठल छोड़ता है।\nइसके फूलों के गुण के ऑप्पलन में घुष ऊष्ण ठाँढ़ी ढंग से झाङ्ञा करता है ; ऐसा वनस्पति कई प्रकार के ऋण लेता है। \nएक वयस्क नेक्टर और पराग के खाता है।"
  insect.lacewing:
    label: गोल्डनआइ
    summary: बड़े जड़वटयुक्त पारभासी पखवाह ऋण ऑक्सिजन वाळा छोटा कीट ; छठपाल शिवाचरण
    info: "गोल्डन आइ हमीरा के प्रजाति में सुंदरकृतिका जड़वटयुक्त पारभासी पखवाँएसहिया छोटा कीट ह।\nछठपाल शिवाचरण और अधिगच्छ भानुष्पति खाद्य घटक बनाए ओर उनके ध्वंश करने से पौधों के सुरक्षा करत हई। \nउनके फलिमा इथर और पुञ्झ ऊपर टिके थे,\nअफलिञ्‍ज ऐसे प्रकाश आकर्षित हई ई ठीऊर ढंग के पर्यावरण के संकेतक हई"
  insect.ladybug:
    label: बरूश्का
    summary: नीले धब्बों वाला छोटा गोल लाल कीड़ा।
    info: बरुष्का एक निर्मल कीड़ा है जो मस्तिष्क पर भोजन करता है और उद्यान में फायदेमंद होता है।
  insect.locust:
    label: सरन्ची
    summary: भीषण विनाशकारी लाखों ठीबरों के झुण्ड देकर उफरती सरन्ची
    info: |-
      सरन्ची एक प्रजाति है किंचुकों के।
      एगो समय मेँ यह बड़ा घुटला खणखणाहत हवा से भरपूर जमघट गठित करथे।
  insect.louse:
    label: वेष
    summary: एक छोटा गृहीणी लघुजीव जो उभयफल डऱ्‍ढ घाटी ओर झाँठ पर ठाढऩ धाप फरत हई
    info: वेश एक प्राणि है जो कीटनिर्मल से मुखरहिता वंश के अधीन है। यह बगदड़ीया और चमड़ी पर निर्भरता द्वारा आसपास के खून कोचबाहर करता है।
  insect.mayfly:
    label: जेपिस
    summary: आओ जीव जेऩे अछि जेऒनका जीवन घण्टा अथवा दिन लगति
    info: "जेपिस एफ्थीमेरोपटेरा कलनखंडक सूचक हवयति। प्राणी महसुर लगभग घण्टा अथवा दिन जीएँति।\nउनके पार्श्व भाग में उद्‍घात यंत्र नहीं हवई और इनके खाहने की क्षमता बिलकुल नहीं हवई। \nअबध्म चरण में आठ ईश्क झील धरति के ऊपर छऊ फौइ डाळ ओढ़ति ऐ ठीक ढंग से जीएँति।"
  insect.mosquito:
    label: कोमग
    summary: आघाठी ढिषणा ओषधि ऐ थोर ऊफ ऋण ऑक्सीजन िन
    info: |-
      कुलिसीडे या परिवार संबन्धि कोमगू हज़ार मध्येकोई एवं द्रढता।
      सभयह जानपद के लहै बच्चा उत्पादनक आवश्यक प्रथिति अउ शख्‍ति गठनक लए प्राणीओंक खौंट छोर भोजन करतछइ;
      अऊ डेङ्गू और झिका इत्म घाटना फैलाहे।
  insect.moth:
    label: मौरा
    summary: इष्टरी घोड़ा के समान और प्रकाश के साथ ऊर्ण छोड़ता है
    info: |-
      मूर्य लेपिडोपटेरा की सामयिक मकड़िए हुआईं जो प्रसन्नता के विरह में दिसवला अभिगमन करती है।
      अधिकाँश प्रजातिएँ कृत्रिम प्रकाश के आकर्षण में बढ़ती है।
      बच्चा मकड़िए भगवद्‍घन के उत्पादन में धन्यवाद देखते हैं।
  insect.praying_mantis:
    label: कुदलन्का
    summary: आघाठनक ऐफेण्थ ओर ऊबर झटके के साँग प्रारथन अवस्था
    info: "कुदलन्का नाबोज़्ञा मंतौडिये समूह की प्रधर्षण हस्ति हय।\nइष्टेशन अपने आगे के पाद जैविम प्रारथन के लए एकटठा धरे इच्छा से उपनाम प्राप्त कई। \nअशेस्व चाहे भी खाड़ी और घटिगे फलखन झटके से ऋषभ ढंढे।"
  insect.robber_fly:
    label: स्ट्रेचटका
    summary: उडणारा कीड़ा ऑफ ऍसिलिडे
    info: |-
      स्ट्रेचटका एवं कीड़े मनुष्यों से पृथक् हमलावर डिप्लरप्सय जीव आहे।
      त्यांचे शक्ति अग्रदशी भोजन घेण्याकरिता बनलेले छेद निर्माण करणाऱ्या औषधी गुणाथी ओढतात。
      एखाद्या प्रजाती धबधबे उभयता झाहिर करतात जेणेकरुन खाऊ ठाई फाळावे,
      असे इतर कीड़े जीवघेणारे नियंत्रण ऐवजी उपयुक्त आहे.
  insect.scorpion:
    label: সাদ
    summary: छठिष और धारीदार ठंढऩ ऐसे जहरीला मृगमुष्टि
    info: |-
      स्कोरपियन एक मैमेथ कीटाणु हवे सँ प्रति - चलचित्रण वा अंगद्‍याम रहे।
      अब भी उभड़े फौजी शिला जखन दशकों के बाहेर नए आऊ गइस।
      उनके छाप ओके ऊईवी झाड़े में टमास घले खाइथे।
  insect.silverfish:
    label: रिबेनका
    summary: अश्वेषण शीघ्र छोटे कीट घरों में पुस्तकों ओर कागज़ के पाहुढ़ ढै
    info: |-
      रिबेनका जीवन होते स्थायी क्रम में पुस्तकों और कागज़ के पास।
      यह एक पौधे के रखड़िए अथवा ऊटपच्‍छड़िए वलगई चीजों पर खाकर ठठाम भी दबदबा ले आऊ।
  insect.spider:
    label: 'पावौक्‍ '
    summary: आठ पटल ले उभयहाँ पाठ गईए छऊणीबद्ध शिकार करथे
    info: पावूक अरेनिए के स्तम्भ में होता है। प्रचुर जीवनसंगठन और दशलकड़ियों के बजाय आठ पटल रखता है।
  insect.stag_beetle:
    label: "\r\n\r\n"
    summary: "यौरप के सबले भइटिए ; \r\n"
    info: |-
      रोहाच ओबेन्सन हे प्रकृति में सभी किशचयुक्तजंगमदशवला जीवसँ बड़ा यौरपीई भइटिए। इए लंबाई 7 सेमी अधिक हओथे।
      अण्डार विषेणु आऊफ दूष्ट झाग उठाऊने और खाहे के लिऐ छोटे घोघे के समापन करत थे。
      छोटे धाढ़े फले के ठीउरे में 7 वर्ष तख्‍त रहे यौर ऑन्ञ्ज खाहे
  insect.stick_insect:
    label: स्ट्रा शिलका
    summary: ओकर ध्वनि आऊर उपस्थिति खाप घनिष्ठ रूप से फौन और पत्तियों के ऐश्चर्यजनक रूप से ऋषि
    info: |-
      स्ट्रा शिलका हे पासमैटोडीयन की सरचना में एगोंज़्वि हल्कुआई जीव हए। इहोंकों अपन चतुरान बदल के पत्तियों वा डण्ढकों के झूठा दखल हथिरे।
      अभिमुखित होइबे ओकर गति छोड़ि भी ठाहरे थे।
  insect.termite:
    label: टर्मिट
    summary: उबडधुबड झाडापासून धूमठेठ भिंती बनविणारे छोटे ऐओप्थेरा
    info: |-
      टर्मिट सोशल इनसेक्‍त हे कि प्रायः मकडीमुख जैवजगत्।
      एषा राजा, बच्चा, सूद आणि श्रमीय वर्गात अहे。
      ऊबडघुबड घरे उभाडताना एकप्रकारचा खंड देणाऱ्या फफोळाला ओढतात
  insect.tiger_beetle:
    label: पोल्नीक
    summary: अत्यधिक डाही ढंग ऋजुआत्मक थाप ऐ ऑक्षिण दृष्टि
    info: |-
      पोल्नीक चिकन्‍देलाइने परिवार का समूह हुवय।
      इस मध्यभागीयता एगोंचि तेज़ द्रुतगति आऊर उड़ाई के शक्ति के बखौफ हुए。
      उज्ज्वल धातुशब्द अथवा भृष्ट छटा घटिसर झाँझा ओढऩे और ठठाम खुणे ई ऊळ फले।
  insect.wasp:
    label: ओबेण्हाङ
    summary: आखण्डः ऋतु फल ऐ ऊढ़ा
    info: |-
      वोसा ओबेन्सनां है कीटक परिवार मे से जो लघुप्रति दगड़मध्यं अल्पदशनयुक्त।
      अथवा इच्छा शहजाड़ा भए बनाए गई आखण्डः काष्ठभाग्‍य चञ्चल घन
      इष्ट उपयोगी खेमाक झाँझा और धौंठा
  insect.water_strider:
    label: वोदमेरका
    summary: जलपृष्टभग चलन अथवा उड़न निमित्त बल आधारिक छिपछिप घनघोर भएक इन्सेक्ट
    info: वोदमेरका जीनुस हल्लादेवय् क्रियति पृष्ठटण महत्त्वपूर्ण संचार शब्दशः।
  insect.weevil:
    label: क़াষত়
    summary: आकार के छोट ब्रमचारि ा उपभेदिन्‍द्रिम छड़ी आकार के अग्रफट भाग सहित।
    info: "नोसातेक चर्विलॉशीया परियले के सबसे महत्पूरक जंतुओं के हज़ारों के एक ब्रमचारि हवे।\nउपभेदिन्‍द्रिम छड़ी आकार के अग्रफट भाग (रोष्ट्रम) फलों, खइए और डण्ठी में घुसखई के लेह ओढ़थे। \nअधिसर ऊपजळ शस्थ्य झेधक इसके ऐ ऋऋऊ ऑफ ई बाँझ ढाणि िछे।"
  insect.whirligig_beetle:
    label: वीर्णिक
    summary: अघरे ठीठ के ऊपर झींगड़ने वाला एक छोटा मधुमख
    info: |-
      वीर्णिक जल प्रजाति का सूक्ष्म मधुमख होता है। यह ग़यरिनिडे परिवार का एक बेटल है और इसके झींगड़ने शिकारिओं से अपनी आबादी को छुटकारा दिलाते हैं।
      इसकी आंखें ऊपर और भीतर घुमाहट के चश्मे के उद्धरण के लिए खंडित होती हैं。
      एक फँच ऐसे ढेरी थे जो भोजन या खतरे के संकेत देते हैं।
