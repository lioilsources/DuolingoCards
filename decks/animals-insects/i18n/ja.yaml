lang: ja
pivot: false
title: 昆虫
cards:
  insect.butterfly:
    label: チョウ
    summary: 大きく色鮮やかな翅を持つ、飛ぶ昆虫。
    info: チョウは鱗粉におおわれた二対の翅を持つ昆虫で、多くは目を引く色をしている。
  insect.bee:
    label: ミツバチ
    summary: 花を受粉させ、蜜を作る黄色と黒の昆虫。
    info: ミツバチは巣に暮らし、花の蜜を集める社会性昆虫である。
  insect.ladybug:
    label: テントウムシ
    summary: 黒い斑点のある、小さく丸い赤い甲虫。
    info: テントウムシはアブラムシを食べる小さな甲虫で、庭で役に立つ。
  insect.dragonfly:
    label: トンボ
    summary: 細長い体と二対の透明な翅を持つ昆虫。
    info: トンボは優れた視力を持つ捕食者で、水面近くで狩りをする。
  insect.ant:
    label: アリ
    summary: 集団で暮らす小さな社会性昆虫。
    info: アリは分業を行う大きな集団をつくる昆虫である。
  insect.beetle:
    label: 甲虫
    summary: 甲虫は昆虫で最大の目を成し、40万種以上が記載されている。
    info: |
      甲虫は鞘翅目(コウチュウ目)に属し、記載されている全昆虫種の約40%を占める。
      本物の飛ぶ翅を隠す硬い前翅(鞘翅)によって見分けられる。
      クワガタムシはヨーロッパ最大の甲虫で、雄は角のような強い大あごを持つ。
      甲虫は熱帯から北極圏まで、ほぼあらゆる環境に生息する。
  insect.grasshopper:
    label: バッタ
    summary: 長い後脚と鳴き声を持つ、跳ねる昆虫。
    info: |
      バッタは直翅目(バッタ目)の昆虫で、体長の二十倍まで跳べる強い後脚を持つ。
      雄は脚を翅にこすりつけて独特の音(発音)を出す。
      植物を食べ、大群になると作物に被害を与えることがある。
  insect.cricket:
    label: コオロギ
    summary: 夜行性の昆虫で、雄の鳴き声で知られる。
    info: |
      コオロギは直翅目(バッタ目)の夜行性昆虫である。
      雄は翅どうしをこすり合わせて鳴き、雌を引き寄せ、なわばりを主張する。
      アジアでは古くから、その鳴き声のためにコオロギがペットとして飼われてきた。
      多くの文化で、家庭の安らぎと幸運の象徴でもある。
  insect.mosquito:
    label: 蚊
    summary: 二枚の翅を持つ昆虫で、雌は血を吸い、病気を媒介することがある。
    info: |
      蚊はカ科の双翅目の昆虫である。
      雌は卵の発育に必要なたんぱく質を得るために動物の血を吸い、雄は花の蜜を食べる。
      蚊はマラリア、デング熱、ジカ熱などの危険な病気を媒介する。
      世界には3,500種以上の蚊がいる。
  insect.fly:
    label: ハエ
    summary: きわめて一般的な双翅目の昆虫で、細菌を運ぶことがある。
    info: |
      イエバエは人間の住まいで最も一般的な双翅目の昆虫である。
      複眼のおかげで、周囲をほぼ360度見渡すことができる。
      ごみにも食べ物にも止まるため、細菌を運ぶ。
      機能する翅は一対だけで、二対目(平均棍)は飛行中の平衡を保つのを助ける。
  insect.moth:
    label: ガ
    summary: チョウの夜行性の仲間で、光に向かって飛び、羽毛状の触角を持つ。
    info: |
      ガは夜行性の鱗翅類で、昼のチョウとは違い、休むときに翅を体の両脇にたたむ。
      多くの種が人工の光に引き寄せられる。
      天然の絹はカイコガの幼虫から得られる。
      オオミズアオ(ルナ)は世界で最も美しいガの一つである。
  insect.caterpillar:
    label: イモムシ
    summary: チョウやガの幼虫で、葉を食べてさなぎになる準備をする。
    info: |
      イモムシはチョウやガの幼虫期で、変態のためのエネルギーを蓄えようと、おもに葉を食べて過ごす。
      一部のイモムシは、有毒であることを捕食者に警告する鮮やかな色をしている。
      さなぎになるとき、繭(さなぎ)を作り、その中で成虫への完全変態が行われる。
  insect.praying_mantis:
    label: カマキリ
    summary: 祈るような姿勢と電光石火の攻撃を持つ捕食性の昆虫。
    info: |
      カマキリはカマキリ目(Mantodea)の捕食性昆虫である。
      前脚を祈るように折りたたむ姿勢から、その名がついた。
      狩りの名手で、一瞬のうちに獲物を打ち、つかまえる。
      雌は交尾のあとに雄を食べることがあるが、いつもそうとは限らない。
  insect.stick_insect:
    label: ナナフシ
    summary: 小枝や葉を完璧にまねる昆虫。
    info: |
      ナナフシはナナフシ目(Phasmatodea)に属し、擬態の名人で、体が小枝や葉を完璧にまねる。
      危険が迫るとまったく動かなくなる。
      一部の種は単為生殖、つまり雄なしで繁殖する。
      世話が簡単なため、人気のあるエキゾチックなペットである。
  insect.firefly:
    label: ホタル
    summary: 生物発光する光で相手を引き寄せる甲虫。
    info: |
      ホタルはホタル科の甲虫で、腹部で冷たい光(生物発光)を作ることができる。
      雄と雌は互いを見分け、引き寄せ合うために、異なるパターンで光る。
      その光は、ルシフェリンとルシフェラーゼの化学反応によって制御される。
      ホタルは清らかな環境の指標である。
  insect.wasp:
    label: アシナガバチ
    summary: 紙の巣を作る、黄色と黒の針を持つ昆虫。
    info: |
      アシナガバチはスズメバチ科の針を持つ昆虫で、典型的な黄色と黒の警告色をしている。
      かみくだいた木の繊維から紙の巣を作る。
      ミツバチと違い、何度でも刺すことができる。
      害虫の自然な調整者として役に立つ。
  insect.cockroach:
    label: ゴキブリ
    summary: すばやく夜行性で雑食の昆虫で、非常に丈夫で適応力が高い。
    info: |
      ゴキブリは世界で最も丈夫な昆虫の一つで、他の動物なら死ぬような放射線や環境にも耐える。
      4,500種以上いるが、人間の近くで暮らすのは約30種にすぎない。
      古い昆虫で、ゴキブリは3億年以上前から存在し、恐竜を生きのびた。
      すばやく、時速5キロ以上で走ることができる。
  insect.spider:
    label: クモ
    summary: 昆虫をとらえる網を張る、八本脚のクモ類。
    info: |
      クモは八本の脚と二部に分かれた体を持つ、クモ目(Araneae)のクモ類(昆虫ではない)である。
      糸を作ることができ、それを網に織って狩りをしたり、卵の繭を包んだりする。
      世界には4万8千種以上のクモが生息する。
      すべての種が毒を持つが、大多数は人間に無害である。
  insect.scorpion:
    label: サソリ
    summary: はさみと、湾曲した毒のある尾を持つ有毒なクモ類。
    info: |
      サソリは特徴的なはさみと、毒針で終わる湾曲した尾を持つクモ類(昆虫ではない)である。
      古い動物で、最古のサソリの化石は4億3千万年以上前のものである。
      暗闇では紫外線の下で蛍光を発する。
      約2,500種のうち、人間に危険なのは約25種にすぎない。
  insect.centipede:
    label: ムカデ
    summary: 体の各節に一対の脚を持つ多足類。
    info: |
      ムカデはムカデ綱(Chilopoda)に属し、体の各節に一対の脚を持つ(英名が示すような百本の脚はない)。
      昆虫、ミミズ、小さな脊椎動物をとらえるすばやい捕食者である。
      最初の一対の脚は、獲物をまひさせる毒の爪に変化している。
      一部の熱帯種は体長30センチを超える。
  insect.flea:
    label: ノミ
    summary: 哺乳類や鳥の血を吸う、跳ねる極小の寄生虫。
    info: |
      ノミはノミ目(Siphonaptera)の翅のない昆虫で、寄生生活に特化している。
      強い後脚により、体長の150倍以上を跳ぶことができる。
      哺乳類や鳥の血を吸い、病気を媒介することがある。歴史上、ノミはペストを広めた。
      ノミは昆虫界のアクロバット選手である。
  insect.termite:
    label: シロアリ
    summary: 土で巨大な塚を築く社会性昆虫。
    info: |
      シロアリはシロアリ目(Isoptera)の社会性昆虫で、ゴキブリの遠い親戚である。
      王、女王、兵、働きアリからなる集団で暮らす。
      独自の換気システムを備えた複雑なシロアリ塚を築き、熱帯では高さ9メートルに達する。
      木材の重要な分解者として、熱帯の生態系で重要な役割を果たす。
  insect.bumblebee:
    label: マルハナバチ
    summary: 低い羽音を立てる大きく毛深いハチで、重要な送粉者。
    info: |
      マルハナバチはミツバチに近い、Bombus属の大きく毛深い昆虫である。
      とくにハチがあまり飛ばない寒冷な気候で、重要な送粉者となる。
      飛翔筋を震わせて体を温められるので、寒さの中でも飛べる。
      マルハナバチはスズメバチよりおとなしく、直接おびやかされたときだけ刺す。
  insect.hornet:
    label: スズメバチ
    summary: 強い針と大きな羽音を持つ、ヨーロッパ最大のハチ。
    info: |
      スズメバチはヨーロッパ最大の社会性のハチで、体長3.5センチを超える。
      木の洞や屋根の下に紙の巣を作る。
      針はほかのハチより長く、刺されるとより痛いが、スズメバチは直接おびやかされたときだけ攻撃する。
      ほかの昆虫にとって重要な捕食者である。
  insect.cicada:
    label: セミ
    summary: 暑い日に大きな声で鳴くことで知られる昆虫。
    info: |
      セミはセミ上科(Cicadoidea)の昆虫で、すべての昆虫の中でも最も大きな音の一つで知られる。
      雄は雌を引き寄せるため、腹部の特別な膜(発音膜)で音を出す。
      アメリカの一部の種は、17年または13年の発生周期を持つ。
      幼虫は何年も地中で暮らし、根から栄養をとる。
  insect.locust:
    label: トビバッタ
    summary: 数百万匹の壊滅的な群れをつくる渡りのバッタ。
    info: |
      トビバッタは、ある条件下で巨大な渡りの群れをつくるバッタの一種である。
      群れは数十億匹に達することがあり、一日で数千ヘクタールの作物を食いつくす。
      アフリカやアジアの国々では、バッタは歴史上最大の農業被害の一つである。
      聖書ではエジプトの十の災いの一つとされる。
  insect.aphid:
    label: アブラムシ
    summary: 植物の茎につく極小の吸汁性昆虫で、甘露を出す。
    info: |
      アブラムシはアブラムシ上科(Aphidoidea)の小さな吸汁性昆虫で、植物の汁を吸って生きる。
      甘い甘露を出し、その見返りにアリが保護してくれる。
      繁殖は非常に速く、一匹の雌が一年で数億匹の子孫を生み出すことがある。
      農作物の重要な害虫である。
  insect.earwig:
    label: ハサミムシ
    summary: 腹部の先にはさみを持つ細長い昆虫。
    info: |
      ハサミムシはハサミムシ目(Dermaptera)の昆虫で、腹部の先にあるはさみ(尾角)が特徴で、防御や交尾に使われる。
      英名は人の耳に入りこむという迷信に由来するが、これは俗説である。
      ハサミムシの雌は卵や幼い幼虫の世話をする点で珍しく、これは昆虫では稀なことである。
      すき間や石の下、落ち葉の中で暮らす。
  insect.silverfish:
    label: シミ
    summary: 家の中の本や紙のそばに見られる、翅のないすばやい昆虫。
    info: |
      シミは住まいで暮らす、シミ目(Zygentoma)の原始的な翅のない昆虫である。
      でんぷん、紙、製本用のり、繊維を食べる。
      名は銀色の体色と魚のような動きに由来する。
      最も古い昆虫の目の一つに属し、3億年以上ほとんど変わらぬ姿で生きている。
  insect.water_strider:
    label: アメンボ
    summary: 表面張力のおかげで水面を歩く昆虫。
    info: |
      アメンボはアメンボ科(Gerridae)の昆虫で、脚の撥水性の毛と水の表面張力のおかげで水面を歩ける。
      水に落ちた昆虫を、水面の振動から感じ取って狩る。
      すばやく、一秒間に体長の150倍以上を水面で滑ることができる。
  insect.dung_beetle:
    label: フンコロガシ
    summary: 糞の玉を転がす甲虫で、古代エジプトでは神聖とされた。
    info: |
      聖なるスカラベはコガネムシ科の甲虫で、糞を玉に丸め、埋めて中に卵を産むために転がす。
      古代エジプトでは太陽と神ケプリの象徴だった。
      天の川を頼りに方向を定める数少ない動物の一つである。
      栄養の循環と土壌の通気を助ける。
  insect.stag_beetle:
    label: クワガタムシ
    summary: ヨーロッパ最大の甲虫で、雄は角のような大あごを持つ。
    info: |
      クワガタムシはヨーロッパ最大の甲虫で、体長7センチを超える。
      雄は角のような巨大な大あごを持ち、雌をめぐる争いに使う。
      幼虫は朽ちたナラの木の中で最長7年生き、菌類を食べる。
      古い森や枯れ木の消失によって深刻に脅かされている。
  insect.atlas_moth:
    label: アトラスガ
    summary: 翅にヘビの模様を持つ、世界最大級のガの一つ。
    info: |
      アトラスガは世界最大級のガの一つで、翅の開張は30センチに達する。
      翅の先はヘビの頭に似せて色づいており、捕食者を追い払う。
      成虫は口を持たず、まったく食べない。生きるのはわずか数日である。
      東南アジアの熱帯林に生息する。
  insect.weevil:
    label: ゾウムシ
    summary: 特徴的な長い口吻を持つ小さな甲虫。
    info: |
      ゾウムシはゾウムシ科(Curculionidae)の甲虫で、6万種以上を擁する世界最大の動物の科である。
      特徴的な長い口吻(吻)は、種子や果実、幹に穴をあけるのに使う。
      ワタミハナゾウムシのように、深刻な農業害虫となる種もいる。
      ほかの種は、ただ一種の植物に特化している。
  insect.lacewing:
    label: クサカゲロウ
    summary: 透明な網目状の翅を持つ繊細な昆虫で、幼虫はアブラムシを狩る。
    info: |
      クサカゲロウはクサカゲロウ科(Chrysopidae)の昆虫で、透明な網目状の繊細な翅と金色の目を持つ。
      幼虫は捕食者で、大量のアブラムシを食べるため、植物の自然な守り手となる。
      成虫は花の蜜と花粉を食べる。
      光に引き寄せられ、健全な環境の指標となる。
  insect.crane_fly:
    label: ガガンボ
    summary: 極端に長い脚を持つ、蚊に似た大きなハエ。
    info: |
      ガガンボはガガンボ科(Tipulidae)の双翅目の昆虫で、見た目は巨大な蚊に似ているが、刺しも寄生もしない。
      極端に長い脚は簡単に取れる。これは防御の仕組み(自切)である。
      成虫はわずか数日しか生きず、何も食べないか花の蜜を食べる。
      幼虫は土の中で暮らし、根を食べる。
  insect.mayfly:
    label: カゲロウ
    summary: 成虫の寿命が最も短い昆虫で、数時間から数日しか生きない。
    info: |
      カゲロウはカゲロウ目(Ephemeroptera)の昆虫で、はかなさの象徴である。成虫は数時間から数日しか生きない。
      機能する口を持たず、まったく食べない。
      幼虫は1〜3年、水中で暮らす。
      カゲロウの大量発生は心奪われる自然の光景で、ハンガリーのドナウ川では独特の現象となる。
  insect.damselfly:
    label: イトトンボ
    summary: トンボのほっそりした仲間で、休むときに翅を体に沿ってたたむ。
    info: |
      イトトンボはトンボに近い昆虫だがよりほっそりしており、大きなトンボと違って休むときに翅を体と平行にたたむ。
      捕食者で、飛びながら小さな昆虫を狩る。
      幼虫は水中で暮らし、水の生態系の重要な一部となる。
      水域の水質の指標である。
  insect.robber_fly:
    label: ムシヒキアブ
    summary: 飛んでいる最中にほかの昆虫をとらえる捕食性のハエ。
    info: |
      ムシヒキアブはムシヒキアブ科(Asilidae)の捕食性の双翅目の昆虫で、飛行中にほかの昆虫を直接とらえる。
      獲物をつかむ強い脚と、まひさせる毒を注入する刺す口を持つ。
      一部の種は、捕食者から身を守るためにマルハナバチやスズメバチの姿をまねる。
      昆虫の個体数を自然に調整する役に立つ。
  insect.ground_beetle:
    label: オサムシ
    summary: 石の下や落ち葉の中で暮らす、すばやい捕食性の甲虫。
    info: |
      オサムシはオサムシ科(Carabidae)の甲虫で、多くの種はほかの昆虫やミミズ、カタツムリをとらえる活発な夜行性の捕食者である。
      すばやく、危険からすぐに逃げる。
      スミレオサムシのように、美しい金属光沢を持つ種もいる。
      健全な土壌と自然な農業の指標である。
  insect.tiger_beetle:
    label: ハンミョウ
    summary: すぐれた視力を持つ、すばやく金属光沢のある甲虫。
    info: |
      ハンミョウはハンミョウ亜科(Cicindelinae)の甲虫で、並外れた速さ、飛翔力、鋭い視力で知られる。
      あまりに速く走るため、動きが視覚系に速すぎて、いったん止まって向きを取り直さなければならない。
      美しく色づいた金属光沢の体(緑、青、赤)と大きな目を持つ。
      幼虫は土に縦の穴を掘り、入り口で獲物を待ち伏せる。
  insect.hoverfly:
    label: ハナアブ
    summary: スズメバチやミツバチの色をまねるハエで、庭の送粉者。
    info: |
      ハナアブはハナアブ科(Syrphidae)の双翅目の昆虫で、刺さないのに、捕食者から身を守るためスズメバチやミツバチの色をまねる(ベイツ型擬態)。
      重要な送粉者で、ミツバチより多くの植物種を訪れる。
      成虫は花の蜜と花粉を食べる。
      一部の種の幼虫はアブラムシを狩り、庭で役に立つ。
  insect.whirligig_beetle:
    label: ミズスマシ
    summary: 水面を群れで旋回する小さな甲虫。
    info: |
      ミズスマシはミズスマシ科(Gyrinidae)の水生甲虫で、水面に暮らし、群れで旋回することで捕食者を避ける。
      目は二つに分かれており、一方は水上を、もう一方は水中を見る。
      水面のさざ波を感じ取り、食べ物や危険を察知する。
      昼は旋回し、夜は飛ぶ。
  insect.louse:
    label: シラミ
    summary: 哺乳類の皮膚や毛に暮らす、翅のない極小の寄生虫。
    info: |
      シラミはシラミ目(Phthiraptera)の翅のない寄生性昆虫で、宿主の皮膚や体毛、髪の中で暮らす。
      血を吸い、かゆみを引き起こす。
      アタマジラミは世界中にいて、衛生状態にかかわらず子どもに寄生する。
      歴史上、シラミは発疹チフスなどの病気を媒介した。
  insect.bedbug:
    label: トコジラミ
    summary: 夜に血を吸う平たい寄生虫で、家具のすき間に隠れる。
    info: |
      トコジラミはトコジラミ科(Cimicidae)の平たい楕円形の昆虫で、おもに夜に活動する。
      眠っている宿主にかみつき、血を吸う。
      マットレスのすき間や家具、壁紙の裏に隠れる。
      ここ数十年、国際的な旅行によって世界中に広がった。
  insect.antlion:
    label: アリジゴク
    summary: 砂の中にアリ用のじょうご形のわなを掘る幼虫。
    info: |
      アリジゴクはウスバカゲロウ科(Myrmeleontidae)の昆虫の幼虫で、乾いた砂に円錐形のじょうごを掘る。
      アリがわなに滑り落ちると、アリジゴクは大あごでつかまえ、消化液を注入する。
      成虫は目立たず、トンボに似ていて、夜に飛ぶ。
      幼虫は何も食べずに何年も地中で生きられる。
  insect.goliath_beetle:
    label: ゴライアスオオハナムグリ
    summary: 熱帯アフリカ産の、世界最大最重量級の昆虫の一つ。
    info: |
      ゴライアスオオハナムグリは世界最大級の昆虫の一つで、雄は最大100グラム、体長11センチを超える。
      赤道アフリカの熱帯雨林に生息する。
      成虫は果実や樹液を食べる。
      アフリカでは子どもがおもちゃにしたり、収集家に売られたりすることがある。
  insect.bombardier_beetle:
    label: ミイデラゴミムシ
    summary: 防御のために煮えたぎる有毒な混合物を噴射する甲虫。
    info: |
      ミイデラゴミムシはホソクビゴミムシ亜科(Brachininae)の甲虫で、独特の方法で身を守る。腹部で二つの化学物質を混ぜ、100度を超える爆発的な反応を起こす。
      非常に腐食性の高い蒸気が、大きな破裂音とともに一秒間に最大500回噴射される。
      自然界の化学的防御の最も驚くべき例の一つである。
  insect.diving_beetle:
    label: ゲンゴロウ
    summary: 水面下を泳ぐ捕食性の水生甲虫。
    info: |
      ゲンゴロウはゲンゴロウ科(Dytiscidae)の捕食性の水生甲虫で、池や止水に暮らす。
      オールのように働く平たい後脚のおかげで巧みに泳ぐ。
      水面で呼吸し、前翅の下に空気をたくわえる。
      昆虫、幼虫、小魚、オタマジャクシを狩る。
  insect.velvet_ant:
    label: アリバチ
    summary: アリに似た、翅のないオレンジと黒のハチ。
    info: |
      アリバチは実際にはアリバチ科(Mutillidae)のハチで、雌は翅がなくアリに似ている。
      警告として、目立つ赤やオレンジの毛を持つ。
      雌は非常に強力な針を持ち、「牛殺し」の異名がある。
      マルハナバチの巣に寄生する。
