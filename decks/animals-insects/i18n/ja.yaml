lang: ja
pivot: false
title: 昆虫
cards:
  insect.ant:
    label: アリ
    summary: 群れで生活する小さな社会性昆虫。
    info: アリは、労働の分業によって大きな群れを形成する昆虫です。
  insect.bee:
    label: ミツバチ
    summary: 黄色と黒色の昆虫で、花を受粉させ蜂蜜を作ります。
    info: アピス・メリフェラというミツバチは、巣箱に住む社会性を持つ昆虫であり、樹液を集める習性があります。
  insect.butterfly:
    label: チョウ
    summary: 大きな色とりどりの翅を持つ飛ぶ昆虫。
    info: チョウは、ふたつの対の鱗片状の翅を持ち、その多くが目立つように彩色されている飛ぶ昆虫です。
  insect.dragonfly:
    label: ワカバリ
    summary: 長く伸びた体と二対の透明な翅を持つ昆虫。
    info: ワカバリは、優れた視力を備えた肉食性の昆虫で、水面近くを狩り場として活動します。
  insect.ladybug:
    label: べるしゅか
    summary: 小さな丸い赤いカブトムシで、黒い斑点がある。
    info: べるしゅかは小型の昆虫であり、アブラナムシを捕食して庭に役立つ。
