lang: ja
pivot: false
title: 昆虫
cards:
  insect.ant:
    label: アリ
    summary: 群れで生活する小さな社会性昆虫。
    info: アリは、労働の分業によって大きな群れを形成する昆虫です。
  insect.antlion:
    label: アリトラップワーム
    summary: 砂地でアリを捕まえるために穴の罠を作る幼虫。
    info: |-
      アリトラップワームは、昆虫であるミルメレントイデ科に属する種類の幼蟲であり、乾燥した砂地中に円錐形の落とし穴を作ります。
      アリがその罠の中に滑り込むと、口器を使って捕らえられ消化液も注入されます。成虫になると蛾のような外見になり夜間に飛行します。
      これらの幼虫は食事を摂らず何年間土の中でも生き続けることができます。
  insect.aphid:
    label: アブラムシ
    summary: 植物の茎に見られる小さな吸汁性昆虫で、はちみつのような物質を分泌する。
    info: |-
      アブラムシ（科：アブロイド）とは、植物から液状栄養分を摂取する小型の虫である。
      それらが産生するのは甘い蜜露であり、これを餌としてミツバチやクモなどが保護してくれる代わりに提供している。
      繁殖力も非常に強く；一匹の雌だけでも年間数百数十万個体もの子孫を持つ可能性がある。
      農業作物にとって重要な害虫とされている。
  insect.atlas_moth:
    label: アトラスシロチョウ
    summary: 世界最大級の夜行性ガモドキで、ヘビのような模様が翅に描かれている。
    info: アジア東南部の熱帯林原産であり、翼幅は最長で約30cmにも達する。その翅には蛇のように見える柄があり、捕食者を威嚇するために進化したとされている。成虫になると口を持たず食物を取り入れることなく過ごし、寿命も数日程度である。
  insect.bedbug:
    label: シマクサダニ
    summary: 夜間に血液を吸う平らな寄生虫で、家具のすき間などに隠れる。
    info: |-
      家ヒゼンムシ（学名：Cimex lectularius）は、主におよそ卵形の扁平面体を持つカメノコガ科の昆虫であり、特に夜間に活動する。
      眠っているホストから血を刺して飲みます。
      ベッドや家具・壁紙裏などの隙間に潜みます。
      近年では国際的な旅行によって世界中へ広がっています。
  insect.bee:
    label: ミツバチ
    summary: 黄色と黒色の昆虫で、花を受粉させ蜂蜜を作ります。
    info: アピス・メリフェラというミツバチは、巣箱に住む社会性を持つ昆虫であり、樹液を集める習性があります。
  insect.beetle:
    label: かさ虫
    summary: カサミシは、記載されている昆虫の約40％を占める最大級の目です。
    info: |-
      甲虫（Coleoptera）という硬い翅を持つ昆虫で構成され、その多くが記録されています。
      特徴的なのは堅く保護された鞘翅であり、真上の飛行用翼に覆われています。
      エリノセラス・ゲルマニクスはヨーロッパ最大のかさみしで、オスには大きな角状突起があります。
      熱帯から極地までほぼすべての環境において生息しています。
  insect.bombardier_beetle:
    label: 砲兵歩甲虫
    summary: 沸騰した有毒な液体を噴射して防御するカブトムシ。
    info: |-
      砲兵歩甲虫は、ブラキニーナー亜科に属し独特の方法で防衛します。尾部において二種類の化学物質が混ざり合い爆発的な反応をおこし、温度は100°C以上になります。
      非常に毒性のある蒸気は音とともに最大秒速500回まで放出されます。
      自然界における最も興味深い化学的防衛の一例です。
  insect.bumblebee:
    label: ミツバチ
    summary: 大きな毛深い蜂で、深く唸るような音を立てて飛ぶ。重要な受粉者である。
    info: |-
      ミツバチは Bombus 属に属する大型の毛虫のような昆虫であり、ハチと近い関係にある。
      寒帯や気温が低い地域では働き蜂よりも活動的で、植物にとって重要ないわき役となる。
      その特徴的な点として、翼筋を使って体を震えさせることによって体温調節を行うため、冷たい天候でも飛び立つことができる。
      一般的には温和な性質だが、直接脅かされた場合には刺すこともある。
  insect.butterfly:
    label: チョウ
    summary: 大きな色とりどりの翅を持つ飛ぶ昆虫。
    info: チョウは、ふたつの対の鱗片状の翅を持ち、その多くが目立つように彩色されている飛ぶ昆虫です。
  insect.caterpillar:
    label: 毛虫
    summary: 蝶や蛾の幼虫；葉を食べて繭に備える。
    info: |-
      毛虫は、蝶または蛾の幼虫であり、主におもな生活活動として葉っぱを食べることによってエネルギーを集めます。一部の毛虫には有毒であることを捕食者に警告する目立つ色を持っています。
      蛹になる際にはカクモ（化蛹）を作り上げて完全変態を通じて成虫へと変わる準備を行います。
  insect.centipede:
    label: 蜈蚣
    summary: 体の各セグメントに一対ずつ脚を持つ節足動物。
    info: |-
      蜈蚣は、Chilopoda（単眼目）という分類群に属し、身体のそれぞれの区画には一つだけ脚が付いています。名前から「百本足」と思われますが実際はそうではありません。
      これは速く動ける捕食者で昆虫やミミズおよび小型脊椎動物を狩ります。
      最初の一組の脚は毒針として変化しており獲物を麻痺させます。
      熱帯地方では最大でも約30cmを超える種も存在します。
  insect.cicada:
    label: セミ
    summary: 暑い日に有名な大声の鳴き声を出す昆虫。
    info: |-
      セミは、すべての中でも最も大きな音を作り出さることで知られる翅を持つ昆虫です。
      雄たちはお尻にある特殊な膜（ティンパリー）を使って雌をおびき寄せようとするためのうるさい唸りのような歌声を作るのです。アメリカには十七年または十三年の発育サイクルを持った種も存在します。
      幼虫であるニマイチドロバエタカマキリは地中に何年間もいて根から栄養を取ります。
  insect.cockroach:
    label: コウロク
    summary: 夜間に活動する肉食性の昆虫で、非常に強く適応力が高い。
    info: |-
      コウロクは世界でも最も頑丈な昆虫の一つであり、放射線や他の動物を殺すような過酷な環境にも耐えられる。
      約4,500種が存在しているうち、人間近くに住むのはわずか30程度である。
      この古くからある昆虫は既に3億年以上生き延びており、恐竜よりも長寿だ。また走る速さも早く時速5キロメートル以上出せるという特徴もある。
  insect.crane_fly:
    label: チプルカ
    summary: 極端に長い脚を持つ巨大な蚊のようなハエ。
    info: |-
      チプルカは、ティピュリダエ科の二重翅目昆虫で見た目が巨大会虫と似ています。しかし刺したり寄生することはありません。
      非常に長く細い足を持ちやすく折れますがこれは防衛的な自己切断（オートトミー）です。
      成虫は数日間しか生きず餌を摂取せずまたは蜜だけを取ります。
      幼虫であるドロームワームは土の中で根っこを食べて生活します。
  insect.cricket:
    label: セミ
    summary: オスが翅をこすって鳴くことで知られる夜行性の昆虫。
    info: |-
      ポリフィラス・グリッルス属に分類されるこのカナブンは、直腸目（オーソプテラ）の夜間に活動する虫である。雄たちは自分の翼同士を擦り合わせて音を立てており、これによってメスを引き寄せたり縄張り意識を示したりしている。
      アジアでは伝統的にこれらの声を持つカナブンたちをペットとして飼育することもある。
      多くの文化においても家の中での幸せや幸運の象徴とされている。
  insect.damselfly:
    label: 鞘翅虫
    summary: エビナガヒラタの近縁種で、休息時に体と平行に羽を折りたためる。
    info: |-
      鞘翅虫はトンボ科とは関係があるがより細長く、休憩時には翼を身体と同じ方向へ並べて畳む。ドローナッグとは異なります。
      捕食者であり空中での小昆虫狩猟を行います。
      幼虫（ニマイ）は水中生活をしており水生生態系において重要な役割を持っています。
      また川などの水质状態を示す指標生物でもあります。
  insect.diving_beetle:
    label: 潜水甲虫
    summary: 水面下で泳ぐ捕食性の水生コウチューブユンタマゴ。
    info: |-
      大型潜行者は、プールや停滞水域に住むドロクサカセキショ科の肉食昆虫です。
      平らな後脚が櫂のように機能し、滑るように泳ぎます。
      表面から呼吸を取り込み、翅下面に空気を保持します。
      蚊類・幼虫・小魚などさまざまな獲物を狩り、水中だけでなく夜間には飛翔も可能です。
  insect.dragonfly:
    label: ワカバリ
    summary: 長く伸びた体と二対の透明な翅を持つ昆虫。
    info: ワカバリは、優れた視力を備えた肉食性の昆虫で、水面近くを狩り場として活動します。
  insect.dung_beetle:
    label: 聖なるカミキリムシ
    summary: 糞の玉を転がす甲虫で、古代エジプトでは神々しい存在とされた。
    info: 聖なるカミキリムシ（学名：Scarabeidae）は、動物のフンを集めて球状にまとめ、それを運びながら埋め込み卵を産む昆虫です。この種類は古くからエジプトにおいて太陽やケプリスという神との関連性を持つ象徴として崇拝されていました。またこれは非常に珍しくて銀河を使って方向を見極める生き物でもあります。さらに土壌中の栄養素再利用および通気促進にも役立っています。
  insect.earwig:
    label: しょくそう
    summary: 尾の先に鋏を持つ細長い昆虫。
    info: |-
      シクソウ（鞘翅目）は、体の末端にある钳のような器官「ケルキス」で特徴づけられる昆虫であり、防衛や交配にも使われる。その名前が由来する都市伝説では、「人の耳の中に入る」とされているがこれは誤解である。

      雌のシクソウには珍しく卵と幼虫を世話をする習性があり、他の昆虫とは異なる点だ。
      彼らは岩の下・葉っぱの中で生活していることが多いです。
  insect.firefly:
    label: ホタル
    summary: パートナーを引きつけるために発光する甲虫。
    info: |-
      ホタルは、尾部から冷たい光（生物由来の輝き）を作り出すことができるランピリダイ科に属す昆虫です。
      雄と雌が異なるパターンで点滅し合いながらお互いを見分けて惹かれ合うようにしています。この現象にはルシフェリンという物質と酵素であるルセファーゼとの化学反応によって制御されています。
      また、ホタルは環境中の清潔さや良好な生態系状態を示す指標となる存在でもあります。
  insect.flea:
    label: ノミ
    summary: 哺乳類や鳥の血液を吸う小さなジャンプする寄生虫。
    info: |-
      ノミは、シホンアテラ目に属し、無翅で体長が非常に短い寄生昆虫です。その強力な後脚により自らの体長のおよそ150倍もの距離まで跳躍できます。
      彼らは主として哺乳動物と鳥から血を啜り取ります。また病気も媒介します；歴史上ではペストなどの感染症伝播に関与していました。
      このようにして見事なアクロバティック能力を持つ昆虫界の一員でもあります。
  insect.fly:
    label: ムカデ
    summary: 人間の住居でよく見られる二対翅を持つ昆虫であり、細菌を運ぶことができる。
    info: |-
      家蠅は人の居住地において最も一般的な二対翅を持った虫である。
      複眼によってほぼ360度周囲を見渡すことができるようにしている。
      ごみや食べ物に止まるため、病原性のあるバクテリアなどを媒介する。
      機能的な翼を持っているのは一組だけだが、もう一つのペア（バランス用）がある。
  insect.goliath_beetle:
    label: ゴリアス
    summary: アフリカ熱帯地域の世界最大級の大昆虫。
    info: ゴリアトヒルサ（学名：Goliathus）は、体長が最も多いで11cmを超え、オスでは体重が約100グラムに達する。エクアドル・アフリカの熱帯雨林地帯を生息域としており、成虫は果物や樹液などを食べる。一部地域では幼児たちによってペットのように扱われたりして捕獲され、コレクター向け市場にも流通しているという報告がある。
  insect.grasshopper:
    label: カマキリ
    summary: 長く太い後脚と鳴き声で特徴的なジャンプする昆虫。
    info: カマキリは、オトメガ科に属し、強力な後肢を持ち、体の長さのおよそ二十倍まで跳躍できる。オスは腿を翅にこすって独特の音（ストリダルション）を作り出す。植物食性であり、大群れになると作物への被害を与えることがある。
  insect.ground_beetle:
    label: ストレヴリク
    summary: 岩や葉の下に生息する速く動ける捕食性コガネムシ。
    info: |-
      スルビリスク（streblík）はカーバィド科の甲虫で、多くの種が昆虫・ミミズ・ナメクジなどを狩る夜行性的な積極的な捕食者です。
      彼らは非常に素早く動き、危険からすぐに逃げます。
      一部の種類例えば紫光りクロカメハゼのような美しい金属質を帯びた色調を持つものもあります。
      これらの生物は健康な土壌と自然農法のある環境における指標となる存在でもあります。
  insect.hornet:
    label: オオスズメバチ
    summary: ヨーロッパ最大の蜂で、強力な針と大きな唸り声を持つ。
    info: |-
      オオスズメバチ（学名：Vespa crabro）は体長が3.5cmを超えるヨーロッパ最大級の社会性ハチである。木々の中や屋根裏などの空間に紙のような巣を作成する。
      一般的なスズメバチよりも長い刺があり、その刺し傷もより痛みを感じるが、人間への攻撃行動を起こすのは直接的な脅威があるときだけだ。
      他の昆虫に対して重要な捕食者として機能していることも特徴的である。
  insect.hoverfly:
    label: ペスチェンカ
    summary: ハチやミツバチの色を真似たムシで、庭園などで花粉媒介を行う。
    info: ペステンカーは双翅目のヒメマルモドキ科に属する昆虫であり、捕食者から身を守るために蜂やミツバチのような模様をしているが刺すことはない（保護的な擬態）。重要な媒介虫として多くの植物種類を訪れる。成虫は蜜とポレンを食べて生きている。一部の種では幼虫がアオムしを狩ることもあり、家庭菜園でも役立つ。
  insect.lacewing:
    label: 黄金目
    summary: 大きな透明な網状の翅を持つ繊細な昆虫；幼虫はアブラムシを捕食する。
    info: |-
      黄金目のチョウ（ゼンゴクテンチョ）は、大型で透過性のあるネットのような脈を持った翼と金色の目に特徴づけられるセミナイト科に属す昆虫です。
      その幼虫は肉食であり、大量のアブラムシを消費し植物にとって自然な防衛者となります。
      成蟲は花蜜や粉塵によって栄養を得ます。光線が引き寄せられることから環境良好度の指標となる種でもあります。
  insect.ladybug:
    label: べるしゅか
    summary: 小さな丸い赤いカブトムシで、黒い斑点がある。
    info: べるしゅかは小型の昆虫であり、アブラナムシを捕食して庭に役立つ。
  insect.locust:
    label: 移動性のカマキリ
    summary: 大量個体が群れを作り、破壊的な被害をもたらす飛蝗。
    info: |-
      飛蝗（かまきり）は特定条件下で巨大な遊牧する群れを作る昆虫です。
      一つの群れには数十億もの個体が含まれており、数千ヘクタールにわたる収穫物全体を一日以内に破壊することがあります。アフリカやアジアでは古くから農業にとって最大級の大災害とされています。
      聖書の中でもエジプトにおける十つの罰の一環として記録されております。
  insect.louse:
    label: ノミ
    summary: 哺乳類の皮膚や毛に生息する小さな翅を持たない寄生虫。
    info: |-
      ヒゼンダニは、ホスト動物（主として人）の肌と髪または体毛の中に住み着く無翼で寄生的な昆虫であり、目立つ特徴です。
      この生物は血液を吸ってかゆみなどの症状を与えることがあります。
      特に「頭垢」と呼ばれる子供用タイプは世界中どこでも見られ、衛生意識とは関係なく子どもたちによく発症します。歴史上では伝染病であるチフスなど他の疾患も媒介していたことが知られています。
  insect.mayfly:
    label: 石蛃
    summary: 成虫の寿命が最も短く、数時間から数日しか生きない昆虫。
    info: |-
      石蛃は蜉蝣目に属する昆虫であり、「無常」を象徴しています。 成虫になると機能的な口器を持たず、食事を摂ることはありません。 幼体（ニームファ）は水中で生活し、その期間は約1〜3年間続きます。
      大量発生した際には美しい自然現象となり、ハンガリーではドナウ川での群れ飛び立ちは特異な風物詩です。
  insect.mosquito:
    label: 蚊
    summary: 二対の翅を持つ昆虫で、メスは血液を吸って病気を媒介する。
    info: |-
      蚊（か）とは、コウモリダニ科に属し、翼を持ち飛ぶことができる双翅目の虫です。雌が動物から血を吸うのは卵を作るために必要なたんぱく質を得るためであり、雄は蜜を使って生きています。

      蚊によってマラリアやデング熱、ジカウィルスなどの危険な感染症が広まることもあります。
      世界には約三千五百種類以上の異なる蚊が存在しています。
  insect.moth:
    label: 夜蛾
    summary: 蝶の仲間で、光に向かって飛行し、羽状触角を持つ。
    info: |-
      夜に活動する夜蛾は鱗翅目（レピドプテラ）昆虫であり、昼間に活発なチョウとは異なり休息時に翼を横方向へ折りたためる。
      mūra
      多くの種類が人工的な光源に引き寄せられる。繭を作るのは蚕である。
      ルナモスカムシなど美しい夜蛾も存在している。
  insect.praying_mantis:
    label: カドランカー
    summary: 祈りの姿勢と素早い攻撃を持つ捕食性昆虫。
    info: カドランカーは、前肢を祈祷のように組んでいることからその名がついた捕食用昆虫です。獲物に対して瞬時に反応し、一瞬で捕まえることが可能です。交尾後にはメスがオスを食べることもありますが、必ずしもそうではありません。
  insect.robber_fly:
    label: スリケンバエ
    summary: 飛んでいる昆虫を捕える肉食のハチ目。
    info: |-
      スリケンバエはアシル科に属する二翅目の肉食性昆虫で、空中での獲物狩りを行います。
      強力な脚を持ち、獲物をつかみやすくするために使われており、毒針を使って麻痺させる毒素も注入します。一部種類ではミツバチやトコジラ미のような外見をしており、これによって天敵から身を守ります。
      これは害虫駆除のために役立つ自然発生的な調節者として重要です。
  insect.scorpion:
    label: トビハリケ
    summary: 毒を持つクモの仲間で、足と曲がった尾を持っている。
    info: |-
      トビハリケは昆虫ではなく節足動物に属し、典型的な8本脚を持ち、湾曲した尾には毒針がある。
      化石記録によると、最も古いものは約4億3千万年前まで遡る。暗闇では紫外線によって発光する特性もある。
      世界中にあるおよそ2500種の中で人間に危険を及ぼすのはわずか25程度である。
  insect.silverfish:
    label: シロバエ
    summary: 書物や紙の近くで見られる、翅を持たない速く動く昆虫。
    info: シロバエは家庭内で生息する原始的な無翼類の昆虫であり、ゾイゲントマ目に属しています。澱粉・紙・糊・繊維などを餌としています。名前は銀色をした体と魚のような動きから来ています。これは最も古い昆虫目の一つで、約3億年間ほとんど変化することなく存在し続けてきました。
  insect.spider:
    label: クモ
    summary: 八本足の節足動物（昆虫ではない）で、巣を織る。
    info: |-
      クモはアラキダエに属する無脊椎動物であり、八つの脚と二つからなる体を持っています。
      hempのような糸を使って獲物や卵嚢のために網を作ることができます。世界には約4万8千種類以上のクモが生息していますすべての品種は毒を持つものの、そのほとんどは人間にとって害はありません
  insect.stag_beetle:
    label: トノサマゾルム
    summary: ヨーロッパ最大のカブリバチ；オスは角のような顎を持っている。
    info: |-
      トノサマゾルム（学名：Lucanus cervus）は、体長が7cmを超えるヨーロッパで最も大きな昆虫である。雄にはメスを巡る闘争のために巨大な鹿のように分岐したような顎がある。
      幼虫期にオークなどの朽ちた木の中では最長で七年間過ごし、キクラダケなどを食べて育つ。
      しかし古き良き森や枯れた木材といった生息環境の消失により絶滅危惧種とされている。
  insect.stick_insect:
    label: ストラシルカ
    summary: 枝や葉を完璧に模倣する昆虫。
    info: |-
      ス トラーシルカーは、フェアマトーデアのグループに属し、ミメクリー（擬態）が得意な虫です。その体形は完全に小枝や葉っぱのように見えます。
      脅かされたときは全く動かないことで捕食者から身を守ります。
      一部の種類ではオスなしで繁殖することもあります。
      飼育にもあまり手間がかからないため人気のあるエキゾチックペットとして親しまれています。
  insect.termite:
    label: 白蟻
    summary: 巨大な泥の巣を建設する社会性昆虫。
    info: |-
      白蟻はイソプテラ目に属し、クモ類と遠い親戚関係にある。王・女王・兵士・労働者からなる群れで生活している。
      複雑な構造を持つ巣を作り上げており、熱帯地方では最大９メートルもの高さになることもあるが、通気システムも備えている。
      木質などの一次分解を行うことで、熱帯生態系において重要な役割をしている。
  insect.tiger_beetle:
    label: ポーリーク
    summary: 金属的な色合いの速いカブトムシで、優れた視力を持っている。
    info: |-
      ポーリークはサイシンデリネ亜科に属する捕食性の甲虫であり、異常に早い走行速度や飛翔能力と鋭い目を持つことで知られている。
      彼が動くのがあまりにも早く、再び方向を確認するために止まらなければならないほどである。
      体には美しい青・緑・赤などの金属光沢があり、大きな目の特徴がある。その幼虫は地面の中で垂直なトンネルを作り、穴の中に隠れて獲物を待ち伏せしている。
  insect.velvet_ant:
    label: 毛虫のようなヒメマル蜂
    summary: オレンジ色と黒の無翅で、アリのように見える。
    info: |-
      サマエダチハナムグリ（Eumeninae）は実際にはユスランチョウ科に属する一種である。雌個体は翼を持たず、その外見からミツバチやクモを彷彿させる。
      赤または橙色の目立つ毛が特徴であり警告として機能している。
      雌は非常に強力な刺を持つことで知られ、「牛殺し」とも呼ばれる。
      彼らはドロップアウトしたニホンカワゲラなどの巣を利用して寄生生活をする。
  insect.wasp:
    label: アシナガバチ
    summary: 黄色と黒色の刺のある昆虫で、紙のような巣を作ります。
    info: |-
      一般的なスズメバチ（学名：Vespidae科）は黄・黒の典型的警告模様を持つ刺を持った虫です。
      木質を噛み砕いて作られたような紙製の巣を使います。
      ミツバチとは異なり複数回刺すことができます。
      hmyzích škůdcůとして害虫駆除にも役立ちます。
  insect.water_strider:
    label: 水歩虫
    summary: 表面張力を活用して水面を歩いて移動する昆虫。
    info: 水歩虫（すいほちゅう）は、ゲリダエ科に属し、脚の撥水性毛によって体全体が濡れることなく動き、その結果として水面を自由自在に歩くことができる。獲物となる溺れた昆虫などを、水面からの振動で感知しながら捕食します。また非常に速さがあり、秒間あたり自分の体長のおよそ150倍もの距離を滑るように進むことができます。
  insect.weevil:
    label: ノサテツ
    summary: 特徴的な長い口器を持つ小さなカミキリムシ。
    info: |-
      ノサテクスは、世界で最も種数の多い昆虫類であるコウチュウ科（約6万を超える）に属する小型のカミキリムシです。顕著な長く伸びた吻（ロストラム）を使って実や果物および木幹を貫いています。
      一部の種は重要な農業害虫であり、「綿花ナメクジ」がその例ですが、他のいくつかの種は特定の一植物だけを利用するように特殊化しています。
  insect.whirligig_beetle:
    label: 回り虫
    summary: 水面で群れを作って旋廻する小さな昆虫。
    info: |-
      回り虫はコガネムシ科の水生甲殼類であり、捕食者から身を守るために水面に集まって旋廬します。
      その目は水中と水上を見分けるために二分割されています。また表面張力や波紋によって餌や危険が近づいていることを感知できます。
      昼間には泳ぎながら旋廃し、夜になると飛行して活動を行います。
