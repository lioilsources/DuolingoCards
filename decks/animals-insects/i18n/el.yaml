lang: el
pivot: false
title: Έντομα
cards:
  insect.butterfly:
    label: πεταλούδα
    summary: Ένα ιπτάμενο έντομο με μεγάλα πολύχρωμα φτερά.
    info: Η πεταλούδα είναι έντομο με δύο ζεύγη φτερών καλυμμένων με λέπια, συχνά με έντονα χρώματα.
  insect.bee:
    label: μέλισσα
    summary: Ένα κιτρινόμαυρο έντομο που επικονιάζει τα άνθη και παράγει μέλι.
    info: Η μέλισσα είναι κοινωνικό έντομο που ζει σε κυψέλες και συλλέγει νέκταρ.
  insect.ladybug:
    label: πασχαλίτσα
    summary: Ένα μικρό στρογγυλό κόκκινο σκαθάρι με μαύρες βούλες.
    info: Η πασχαλίτσα είναι μικρό σκαθάρι που τρέφεται με αφίδες και είναι χρήσιμο στον κήπο.
  insect.dragonfly:
    label: λιβελλούλη
    summary: Ένα έντομο με μακρύ σώμα και δύο ζεύγη διάφανων φτερών.
    info: Η λιβελλούλη είναι αρπακτικό με εξαιρετική όραση που κυνηγά κοντά στην επιφάνεια του νερού.
  insect.ant:
    label: μυρμήγκι
    summary: Ένα μικρό κοινωνικό έντομο που ζει σε αποικίες.
    info: Το μυρμήγκι είναι έντομο που σχηματίζει μεγάλες αποικίες με καταμερισμό εργασίας.
  insect.beetle:
    label: σκαθάρι
    summary: Τα σκαθάρια αποτελούν τη μεγαλύτερη τάξη εντόμων, με πάνω από 400.000 περιγεγραμμένα είδη.
    info: |
      Το σκαθάρι ανήκει στην τάξη Coleoptera και αποτελεί περίπου το 40% όλων των περιγεγραμμένων ειδών εντόμων.
      Αναγνωρίζεται από τα σκληρά έλυτρα (καλυπτικά φτερά) που κρύβουν τα πραγματικά πτερύγια πτήσης.
      Ο ελαφοκάνθαρος είναι το μεγαλύτερο σκαθάρι της Ευρώπης· το αρσενικό έχει ισχυρές σιαγόνες που μοιάζουν με κέρατα.
      Τα σκαθάρια ζουν σχεδόν σε όλα τα περιβάλλοντα, από τους τροπικούς έως τις αρκτικές περιοχές.
  insect.grasshopper:
    label: ακρίδα
    summary: Ένα πηδηχτό έντομο με μακριά πίσω πόδια και τερετισμό.
    info: |
      Η ακρίδα είναι έντομο της τάξης Orthoptera με ισχυρά πίσω πόδια που επιτρέπουν άλματα έως και είκοσι φορές το μήκος του σώματος.
      Τα αρσενικά παράγουν χαρακτηριστικό ήχο (στρίγκλισμα) τρίβοντας τα πόδια στα φτερά.
      Τρέφεται με φυτά και σε μεγάλα σμήνη μπορεί να καταστρέψει τις καλλιέργειες.
  insect.cricket:
    label: γρύλος
    summary: Ένα νυκτόβιο έντομο, ξακουστό για το τερέτισμα των αρσενικών.
    info: |
      Ο γρύλος του αγρού είναι νυκτόβιο έντομο της τάξης Orthoptera.
      Τα αρσενικά τερετίζουν τρίβοντας τα φτερά μεταξύ τους για να προσελκύσουν τα θηλυκά και να ορίσουν την επικράτειά τους.
      Στην Ασία οι γρύλοι διατηρούνταν από παλιά ως κατοικίδια για το τραγούδι τους.
      Σε πολλούς πολιτισμούς είναι επίσης σύμβολο οικιακής θαλπωρής και καλής τύχης.
  insect.mosquito:
    label: κουνούπι
    summary: Ένα δίπτερο έντομο· το θηλυκό ρουφά αίμα και μπορεί να μεταδίδει ασθένειες.
    info: |
      Το κουνούπι είναι δίπτερο έντομο της οικογένειας Culicidae.
      Τα θηλυκά ρουφούν το αίμα των ζώων για να πάρουν τις πρωτεΐνες που χρειάζονται για την ανάπτυξη των αυγών· τα αρσενικά τρέφονται με νέκταρ.
      Τα κουνούπια μεταδίδουν επικίνδυνες ασθένειες όπως η ελονοσία, ο δάγκειος πυρετός και ο ιός Ζίκα.
      Στον κόσμο υπάρχουν πάνω από 3.500 είδη κουνουπιών.
  insect.fly:
    label: μύγα
    summary: Ένα πολύ διαδεδομένο δίπτερο έντομο που μπορεί να μεταδίδει βακτήρια.
    info: |
      Η κοινή μύγα είναι το πιο διαδεδομένο δίπτερο έντομο στις ανθρώπινες κατοικίες.
      Τα σύνθετα μάτια της της επιτρέπουν να βλέπει σχεδόν 360 μοίρες γύρω της.
      Μεταδίδει βακτήρια επειδή προσγειώνεται τόσο σε απορρίμματα όσο και σε τρόφιμα.
      Έχει μόνο ένα ζεύγος λειτουργικών φτερών· το δεύτερο ζεύγος (αλτήρες) βοηθά στη διατήρηση της ισορροπίας κατά την πτήση.
  insect.moth:
    label: νυχτοπεταλούδα
    summary: Ο νυκτόβιος συγγενής της πεταλούδας· πετά προς το φως και έχει φτερωτές κεραίες.
    info: |
      Οι νυχτοπεταλούδες είναι νυκτόβια λεπιδόπτερα που, σε αντίθεση με τις πεταλούδες της ημέρας, στην ηρεμία κρατούν τα φτερά διπλωμένα στα πλάγια.
      Πολλά είδη προσελκύονται από το τεχνητό φως.
      Το φυσικό μετάξι το οφείλουμε στις κάμπιες του μεταξοσκώληκα.
      Η πεταλούδα-φεγγάρι (luna) είναι μία από τις ομορφότερες νυχτοπεταλούδες στον κόσμο.
  insect.caterpillar:
    label: κάμπια
    summary: Η προνύμφη μιας πεταλούδας· τρώει φύλλα και προετοιμάζεται για τη χρυσαλλίδα.
    info: |
      Η κάμπια είναι το προνυμφικό στάδιο μιας πεταλούδας και περνά τη ζωή της κυρίως τρώγοντας φύλλα, για να αποθηκεύσει ενέργεια για τη μεταμόρφωση.
      Ορισμένες κάμπιες έχουν έντονα χρώματα που προειδοποιούν τους θηρευτές ότι είναι δηλητηριώδεις.
      Κατά τη χρυσαλλίδωση σχηματίζει χρυσαλλίδα (κουκούλι), μέσα στην οποία γίνεται η πλήρης μεταμόρφωση σε ενήλικο.
  insect.praying_mantis:
    label: αλογάκι της Παναγίας
    summary: Ένα αρπακτικό έντομο με στάση προσευχής και αστραπιαία επίθεση.
    info: |
      Το αλογάκι της Παναγίας είναι αρπακτικό έντομο της ομάδας Mantodea.
      Οφείλει το όνομά του στη στάση στην οποία κρατά τα μπροστινά πόδια διπλωμένα σαν σε προσευχή.
      Είναι δεξιοτέχνης του κυνηγιού· χτυπά και αρπάζει τη λεία του σε κλάσμα δευτερολέπτου.
      Το θηλυκό ενίοτε τρώει το αρσενικό μετά το ζευγάρωμα, αν και αυτό δεν συμβαίνει πάντα.
  insect.stick_insect:
    label: έντομο-κλαδί
    summary: Ένα έντομο που μιμείται τέλεια ένα κλαδάκι ή ένα φύλλο.
    info: |
      Το έντομο-κλαδί ανήκει στην ομάδα Phasmatodea και είναι δεξιοτέχνης του καμουφλάζ· το σώμα του μιμείται τέλεια κλαδάκια ή φύλλα.
      Μπροστά στον κίνδυνο μένει εντελώς ακίνητο.
      Ορισμένα είδη αναπαράγονται με παρθενογένεση, δηλαδή χωρίς αρσενικό.
      Είναι δημοφιλή εξωτικά κατοικίδια χάρη στην εύκολη φροντίδα.
  insect.firefly:
    label: πυγολαμπίδα
    summary: Ένα σκαθάρι που λάμπει με βιοφωταύγεια για να προσελκύσει σύντροφο.
    info: |
      Η πυγολαμπίδα είναι σκαθάρι της οικογένειας Lampyridae που μπορεί να παράγει ψυχρό φως (βιοφωταύγεια) στην κοιλιά.
      Τα αρσενικά και τα θηλυκά λάμπουν με διαφορετικά μοτίβα για να αναγνωρίζονται και να προσελκύονται.
      Το φως ελέγχεται από τη χημική αντίδραση της λουσιφερίνης με τη λουσιφεράση.
      Οι πυγολαμπίδες είναι δείκτης καθαρού περιβάλλοντος.
  insect.wasp:
    label: σφήκα
    summary: Ένα κιτρινόμαυρο έντομο με κεντρί που χτίζει χάρτινες φωλιές.
    info: |
      Η κοινή σφήκα είναι έντομο με κεντρί της ομάδας Vespula, με τα τυπικά κιτρινόμαυρα προειδοποιητικά χρώματα.
      Χτίζει χάρτινες φωλιές από μασημένη ξυλόμαζα.
      Σε αντίθεση με τη μέλισσα, η σφήκα μπορεί να τσιμπήσει πολλές φορές.
      Είναι χρήσιμη ως φυσικός ρυθμιστής των επιβλαβών εντόμων.
  insect.cockroach:
    label: κατσαρίδα
    summary: Ένα γρήγορο, νυκτόβιο, παμφάγο έντομο· πολύ ανθεκτικό και προσαρμοστικό.
    info: |
      Η κατσαρίδα είναι ένα από τα πιο ανθεκτικά έντομα στον κόσμο· επιβιώνει από ακτινοβολία και συνθήκες που θα σκότωναν άλλα ζώα.
      Υπάρχουν πάνω από 4.500 είδη, αλλά μόνο περίπου 30 ζουν κοντά στον άνθρωπο.
      Είναι αρχαίο έντομο· οι κατσαρίδες υπάρχουν πάνω από 300 εκατομμύρια χρόνια και επέζησαν των δεινοσαύρων.
      Είναι γρήγορη και μπορεί να τρέξει με πάνω από 5 χλμ/ώρα.
  insect.spider:
    label: αράχνη
    summary: Ένα οκτάποδο αραχνοειδές που υφαίνει ιστούς για να πιάνει έντομα.
    info: |
      Η αράχνη είναι αραχνοειδές (όχι έντομο) της τάξης Araneae, με οκτώ πόδια και σώμα από δύο μέρη.
      Μπορεί να παράγει μετάξι με το οποίο υφαίνει ιστούς για κυνήγι ή τυλίγει κουκούλια με αυγά.
      Στον κόσμο ζουν πάνω από 48.000 είδη αραχνών.
      Όλα τα είδη παράγουν δηλητήριο, αλλά η συντριπτική πλειονότητα είναι ακίνδυνα για τον άνθρωπο.
  insect.scorpion:
    label: σκορπιός
    summary: Ένα δηλητηριώδες αραχνοειδές με δαγκάνες και κυρτή δηλητηριώδη ουρά.
    info: |
      Ο σκορπιός είναι αραχνοειδές (όχι έντομο) με τυπικές δαγκάνες και κυρτή ουρά που καταλήγει σε δηλητηριώδες κεντρί.
      Είναι αρχαίο ζώο· οι παλαιότεροι απολιθωμένοι σκορπιοί είναι πάνω από 430 εκατομμύρια ετών.
      Στο σκοτάδι φθορίζουν κάτω από υπεριώδες φως.
      Από τα περίπου 2.500 είδη, μόνο περίπου 25 είναι επικίνδυνα για τον άνθρωπο.
  insect.centipede:
    label: σαρανταποδαρούσα
    summary: Μια σαρανταποδαρούσα με ένα ζεύγος πόδια σε κάθε τμήμα του σώματος.
    info: |
      Η σαρανταποδαρούσα ανήκει στην κλάση Chilopoda και έχει ένα ζεύγος πόδια σε κάθε τμήμα του σώματος (όχι εκατό πόδια, όπως υπονοεί η αγγλική ονομασία).
      Είναι γρήγορο αρπακτικό που πιάνει έντομα, σκουλήκια και μικρά σπονδυλωτά.
      Το πρώτο ζεύγος πόδια έχει μετατραπεί σε δηλητηριώδη νύχια που παραλύουν τη λεία.
      Ορισμένα τροπικά είδη ξεπερνούν τα 30 εκ. σε μήκος.
  insect.flea:
    label: ψύλλος
    summary: Ένα μικροσκοπικό πηδηχτό παράσιτο που ρουφά το αίμα θηλαστικών και πουλιών.
    info: |
      Ο ψύλλος είναι άπτερο έντομο της τάξης Siphonaptera, εξειδικευμένο σε παρασιτικό τρόπο ζωής.
      Τα ισχυρά πίσω πόδια επιτρέπουν άλματα πάνω από 150 φορές το μήκος του σώματος.
      Ρουφά το αίμα θηλαστικών και πουλιών και μπορεί να μεταδίδει ασθένειες· ιστορικά οι ψύλλοι διέδωσαν την πανώλη.
      Οι ψύλλοι είναι οι ακροβάτες του κόσμου των εντόμων.
  insect.termite:
    label: τερμίτης
    summary: Ένα κοινωνικό έντομο που χτίζει τεράστιους λόφους από χώμα.
    info: |
      Ο τερμίτης είναι κοινωνικό έντομο της ομάδας Isoptera, μακρινός συγγενής των κατσαρίδων.
      Ζουν σε αποικίες με βασιλιά, βασίλισσα, στρατιώτες και εργάτες.
      Χτίζουν πολύπλοκες τερμιτοφωλιές, στους τροπικούς ύψους έως και 9 μέτρων, με δικό τους σύστημα εξαερισμού.
      Ως σημαντικοί αποικοδομητές του ξύλου, παίζουν καίριο ρόλο στα τροπικά οικοσυστήματα.
  insect.bumblebee:
    label: μπάμπουρας
    summary: Μια μεγάλη τριχωτή μέλισσα με βαθύ βουητό· σημαντικός επικονιαστής.
    info: |
      Ο μπάμπουρας είναι μεγάλο τριχωτό έντομο του γένους Bombus, συγγενικό με τη μέλισσα.
      Είναι σημαντικός επικονιαστής, ιδίως σε ψυχρότερα κλίματα όπου οι μέλισσες πετούν λιγότερο.
      Μπορεί να ζεσταθεί κάνοντας τους μυς πτήσης να δονούνται, ώστε να πετά ακόμη και στο κρύο.
      Οι μπάμπουρες είναι πιο ήρεμοι από τις σφήκες και τσιμπούν μόνο σε άμεση απειλή.
  insect.hornet:
    label: σέρσηκας
    summary: Η μεγαλύτερη σφήκα της Ευρώπης με ισχυρό κεντρί και δυνατό βουητό.
    info: |
      Ο σέρσηκας είναι η μεγαλύτερη κοινωνική σφήκα της Ευρώπης και ξεπερνά τα 3,5 εκ. σε μήκος.
      Χτίζει χάρτινες φωλιές σε κουφάλες δέντρων ή κάτω από στέγες.
      Το κεντρί του είναι μακρύτερο από των σφηκών και το τσίμπημα πιο επώδυνο, αλλά ο σέρσηκας επιτίθεται μόνο σε άμεση απειλή.
      Είναι σημαντικός αρπακτικός εχθρός άλλων εντόμων.
  insect.cicada:
    label: τζιτζίκι
    summary: Ένα έντομο ξακουστό για το δυνατό του τερέτισμα τις ζεστές μέρες.
    info: |
      Το τζιτζίκι είναι έντομο της υπεροικογένειας Cicadoidea, ξακουστό για έναν από τους δυνατότερους ήχους ανάμεσα σε όλα τα έντομα.
      Τα αρσενικά παράγουν τον ήχο με ειδικές μεμβράνες (τύμβαλα) στην κοιλιά για να προσελκύσουν τα θηλυκά.
      Ορισμένα είδη στις ΗΠΑ έχουν κύκλους ανάπτυξης δεκαεπτά ή δεκατριών ετών.
      Οι προνύμφες ζουν χρόνια κάτω από το χώμα και τρέφονται με ρίζες.
  insect.locust:
    label: αποδημητική ακρίδα
    summary: Μια αποδημητική ακρίδα που σχηματίζει καταστροφικά σμήνη εκατομμυρίων.
    info: |
      Η αποδημητική ακρίδα είναι είδος ακρίδας που, υπό ορισμένες συνθήκες, σχηματίζει τεράστια αποδημητικά σμήνη.
      Ένα σμήνος μπορεί να αριθμεί δισεκατομμύρια άτομα και σε μία μέρα να καταστρέψει καλλιέργειες σε χιλιάδες εκτάρια.
      Στις χώρες της Αφρικής και της Ασίας οι ακρίδες είναι ιστορικά μία από τις μεγαλύτερες γεωργικές συμφορές.
      Στη Βίβλο είναι μία από τις δέκα πληγές της Αιγύπτου.
  insect.aphid:
    label: αφίδα
    summary: Ένα μικροσκοπικό μυζητικό έντομο στα στελέχη των φυτών· παράγει μελιτώδη δρόσο.
    info: |
      Οι αφίδες είναι μικρά μυζητικά έντομα της υπεροικογένειας Aphidoidea που τρέφονται με τον χυμό των φυτών.
      Παράγουν γλυκιά μελιτώδη δρόσο, για την οποία τα μυρμήγκια τις φροντίζουν σε αντάλλαγμα προστασίας.
      Αναπαράγονται εξαιρετικά γρήγορα· ένα μόνο θηλυκό μπορεί σε έναν χρόνο να δώσει ζωή σε εκατοντάδες εκατομμύρια απογόνους.
      Είναι σημαντικοί εχθροί των γεωργικών καλλιεργειών.
  insect.earwig:
    label: ψαλίδα
    summary: Ένα επίμηκες έντομο με τσιμπίδες στο άκρο της κοιλιάς.
    info: |
      Η ψαλίδα είναι έντομο της τάξης Dermaptera, αναγνωρίσιμο από τις τσιμπίδες (κέρκοι) στο άκρο της κοιλιάς, που χρησιμεύουν για άμυνα και ζευγάρωμα.
      Το όνομα σε ορισμένες γλώσσες προέρχεται από τη δεισιδαιμονία ότι μπαίνει στα αυτιά των ανθρώπων· αυτό είναι μύθος.
      Τα θηλυκά της ψαλίδας είναι ασυνήθιστα επειδή φροντίζουν τα αυγά και τις νεαρές προνύμφες, κάτι σπάνιο ανάμεσα στα έντομα.
      Ζουν σε χαραμάδες, κάτω από πέτρες και στο φυλλόστρωμα.
  insect.silverfish:
    label: ασημόψαρο
    summary: Ένα άπτερο γρήγορο έντομο που βρίσκεται στα σπίτια κοντά σε βιβλία και χαρτί.
    info: |
      Το ασημόψαρο είναι πρωτόγονο άπτερο έντομο της τάξης Zygentoma που ζει στις κατοικίες.
      Τρέφεται με άμυλο, χαρτί, βιβλιοδετική κόλλα και υφασμάτινες ίνες.
      Το όνομα προέρχεται από το ασημένιο χρώμα του και την ψαρίσια κίνησή του.
      Ανήκει σε μία από τις παλαιότερες τάξεις εντόμων και ζει σχεδόν αμετάβλητο πάνω από 300 εκατομμύρια χρόνια.
  insect.water_strider:
    label: νεροπάτης
    summary: Ένα έντομο που περπατά στην επιφάνεια του νερού χάρη στην επιφανειακή τάση.
    info: |
      Ο νεροπάτης είναι έντομο της οικογένειας Gerridae που μπορεί να περπατά στο νερό χάρη στα υδρόφοβα τριχίδια των ποδιών του και στην επιφανειακή τάση του νερού.
      Κυνηγά έντομα που έπεσαν στο νερό, τα οποία αναγνωρίζει από τους κραδασμούς της επιφάνειας.
      Είναι γρήγορος και μπορεί να γλιστρά στο νερό με πάνω από 150 φορές το μήκος του σώματός του ανά δευτερόλεπτο.
  insect.dung_beetle:
    label: σκαθάρι της κοπριάς
    summary: Ένα σκαθάρι που κυλά μπαλίτσες κοπριάς, ιερό στην αρχαία Αίγυπτο.
    info: |
      Ο ιερός σκαραβαίος είναι σκαθάρι της οικογένειας Scarabaeidae που πλάθει την κοπριά σε μπαλίτσες και τις κυλά για να τις θάψει και να αποθέσει μέσα τους αυγά.
      Στην αρχαία Αίγυπτο ήταν σύμβολο του ήλιου και του θεού Χεπρί.
      Είναι ένα από τα λίγα ζώα που προσανατολίζονται με τον Γαλαξία.
      Βοηθά στην ανακύκλωση των θρεπτικών ουσιών και στον αερισμό του εδάφους.
  insect.stag_beetle:
    label: ελαφοκάνθαρος
    summary: Το μεγαλύτερο σκαθάρι της Ευρώπης· το αρσενικό έχει σιαγόνες σαν κέρατα.
    info: |
      Ο ελαφοκάνθαρος είναι το μεγαλύτερο σκαθάρι της Ευρώπης και ξεπερνά τα 7 εκ. σε μήκος.
      Το αρσενικό έχει τεράστιες σιαγόνες που μοιάζουν με κέρατα, τις οποίες χρησιμοποιεί σε μάχες για τα θηλυκά.
      Η προνύμφη ζει έως και 7 χρόνια στο σαπισμένο ξύλο βελανιδιάς και τρέφεται με μύκητες.
      Απειλείται σοβαρά από την εξαφάνιση των παλιών δασών και του νεκρού ξύλου.
  insect.atlas_moth:
    label: πεταλούδα άτλας
    summary: Μία από τις μεγαλύτερες νυχτοπεταλούδες στον κόσμο, με φτερά στολισμένα με μοτίβο φιδιού.
    info: |
      Η πεταλούδα άτλας είναι μία από τις μεγαλύτερες νυχτοπεταλούδες στον κόσμο, με άνοιγμα φτερών έως και 30 εκ.
      Οι άκρες των φτερών της είναι χρωματισμένες ώστε να μοιάζουν με κεφάλια φιδιών, κάτι που τρομάζει τους θηρευτές.
      Τα ενήλικα δεν έχουν στόμα και δεν τρέφονται καθόλου· ζουν μόνο λίγες μέρες.
      Προέρχεται από τα τροπικά δάση της Νοτιοανατολικής Ασίας.
  insect.weevil:
    label: ρυγχωτό σκαθάρι
    summary: Ένα μικρό σκαθάρι με χαρακτηριστικό επιμήκη ρύγχος.
    info: |
      Το ρυγχωτό σκαθάρι είναι σκαθάρι της οικογένειας Curculionidae, της μεγαλύτερης οικογένειας ζώων στον κόσμο, με πάνω από 60.000 είδη.
      Το χαρακτηριστικό επίμηκες ρύγχος (rostrum) χρησιμεύει για να τρυπά σπόρους, καρπούς και κορμούς.
      Ορισμένα είδη είναι σοβαροί εχθροί των καλλιεργειών, όπως το ρυγχωτό σκαθάρι του βαμβακιού.
      Άλλα είδη είναι εξειδικευμένα σε ένα μόνο είδος φυτού.
  insect.lacewing:
    label: χρυσώπα
    summary: Ένα λεπτό έντομο με διάφανα νευρωμένα φτερά· οι προνύμφες κυνηγούν αφίδες.
    info: |
      Η χρυσώπα είναι έντομο της οικογένειας Chrysopidae με λεπτά, διάφανα νευρωμένα φτερά και χρυσά μάτια.
      Οι προνύμφες είναι αρπακτικά και καταβροχθίζουν τεράστιες ποσότητες αφίδων, γινόμενες φυσικοί προστάτες των φυτών.
      Τα ενήλικα τρέφονται με νέκταρ και γύρη.
      Τα προσελκύει το φως και είναι δείκτης υγιούς περιβάλλοντος.
  insect.crane_fly:
    label: τιπούλα
    summary: Μια μεγάλη μύγα που μοιάζει με κουνούπι, με εξαιρετικά μακριά πόδια.
    info: |
      Η τιπούλα είναι δίπτερο έντομο της οικογένειας Tipulidae, που μοιάζει με γιγάντιο κουνούπι, αλλά δεν τσιμπά και δεν παρασιτεί.
      Τα εξαιρετικά μακριά πόδια της σπάνε εύκολα· αυτό είναι μηχανισμός άμυνας (αυτοτομία).
      Τα ενήλικα ζουν μόνο λίγες μέρες και είτε δεν τρώνε είτε τρέφονται με νέκταρ.
      Οι προνύμφες ζουν στο έδαφος και τρέφονται με ρίζες.
  insect.mayfly:
    label: εφήμερο
    summary: Ένα έντομο με την πιο σύντομη ενήλικη ζωή, που διαρκεί μόνο ώρες έως μέρες.
    info: |
      Το εφήμερο είναι έντομο της τάξης Ephemeroptera και σύμβολο του εφήμερου· τα ενήλικα ζουν μόνο ώρες έως μέρες.
      Δεν έχουν λειτουργικά στοματικά μόρια και δεν τρέφονται καθόλου.
      Οι προνύμφες ζουν από 1 έως 3 χρόνια κάτω από το νερό.
      Ο μαζικός σμηνισμός των εφημέρων είναι ένα συναρπαστικό θέαμα της φύσης· στον Δούναβη στην Ουγγαρία είναι μοναδικό φαινόμενο.
  insect.damselfly:
    label: λεπτή λιβελλούλη
    summary: Μια λεπτή συγγενής της λιβελλούλης· στην ηρεμία διπλώνει τα φτερά κατά μήκος του σώματος.
    info: |
      Η λεπτή λιβελλούλη είναι έντομο συγγενικό με τις λιβελλούλες, αλλά πιο λεπτό, και στην ηρεμία διπλώνει τα φτερά παράλληλα με το σώμα, σε αντίθεση με τις μεγάλες λιβελλούλες.
      Είναι αρπακτικό και κυνηγά μικρά έντομα εν πτήσει.
      Οι προνύμφες ζουν στο νερό και αποτελούν σημαντικό μέρος των υδάτινων οικοσυστημάτων.
      Είναι δείκτης της ποιότητας των υδάτινων ρευμάτων.
  insect.robber_fly:
    label: ληστρική μύγα
    summary: Μια αρπακτική μύγα που πιάνει άλλα έντομα σε πλήρη πτήση.
    info: |
      Η ληστρική μύγα είναι αρπακτικό δίπτερο έντομο της οικογένειας Asilidae που πιάνει άλλα έντομα κατευθείαν εν πτήσει.
      Έχει ισχυρά πόδια για να αρπάζει τη λεία και κεντρικό ρύγχος για να εγχέει παραλυτικό δηλητήριο.
      Ορισμένα είδη μιμούνται την εμφάνιση μπάμπουρων ή σφηκών ως προστασία από τους θηρευτές.
      Είναι χρήσιμη ως φυσικός ρυθμιστής των πληθυσμών εντόμων.
  insect.ground_beetle:
    label: τρεχαλάκι
    summary: Ένα γρήγορο αρπακτικό σκαθάρι που ζει κάτω από πέτρες και στο φυλλόστρωμα.
    info: |
      Το τρεχαλάκι είναι σκαθάρι της οικογένειας Carabidae· τα περισσότερα είδη είναι δραστήρια νυκτόβια αρπακτικά που πιάνουν άλλα έντομα, σκουλήκια και σαλιγκάρια.
      Είναι γρήγορα και ξεφεύγουν γρήγορα από τον κίνδυνο.
      Ορισμένα είδη, όπως το βιολετί τρεχαλάκι, έχουν υπέροχη μεταλλική λάμψη.
      Είναι δείκτες υγιούς εδάφους και φυσικής γεωργίας.
  insect.tiger_beetle:
    label: κικινδέλα
    summary: Ένα γρήγορο μεταλλικό σκαθάρι με εξαιρετική όραση.
    info: |
      Η κικινδέλα είναι σκαθάρι της υποοικογένειας Cicindelinae, ξακουστό για την ασυνήθιστη ταχύτητα, την ικανότητα πτήσης και την οξεία όρασή του.
      Τρέχει τόσο γρήγορα που πρέπει να σταματά και να επαναπροσανατολίζεται, επειδή η κίνηση είναι πολύ γρήγορη για το οπτικό του σύστημα.
      Έχει υπέροχα χρωματισμένα μεταλλικά σώματα (πράσινα, μπλε, κόκκινα) και μεγάλα μάτια.
      Οι προνύμφες σκάβουν κατακόρυφες σήραγγες στο έδαφος και παραμονεύουν τη λεία στην είσοδο.
  insect.hoverfly:
    label: συρφίδα
    summary: Μια μύγα που μιμείται τα χρώματα σφηκών και μελισσών· επικονιαστής των κήπων.
    info: |
      Η συρφίδα είναι δίπτερο έντομο της οικογένειας Syrphidae που μιμείται τα χρώματα σφηκών και μελισσών ως προστασία από τους θηρευτές (μιμητισμός Bates), αν και δεν τσιμπά.
      Είναι σημαντικός επικονιαστής· επισκέπτεται περισσότερα είδη φυτών από τις μέλισσες.
      Τα ενήλικα τρέφονται με νέκταρ και γύρη.
      Οι προνύμφες ορισμένων ειδών κυνηγούν αφίδες και έτσι βοηθούν στον κήπο.
  insect.whirligig_beetle:
    label: στροβιλόσκαθαρο
    summary: Ένα μικρό σκαθάρι που στροβιλίζεται σε σμήνη στην επιφάνεια του νερού.
    info: |
      Το στροβιλόσκαθαρο είναι υδρόβιο σκαθάρι της οικογένειας Gyrinidae που ζει στην επιφάνεια, και ο στροβιλισμός σε σμήνη το βοηθά να αποφεύγει τους θηρευτές.
      Τα μάτια του είναι χωρισμένα σε δύο μέρη· το ένα βλέπει πάνω από το νερό, το άλλο κάτω.
      Αντιλαμβάνεται τους κυματισμούς στην επιφάνεια που σηματοδοτούν τροφή ή κίνδυνο.
      Την ημέρα στροβιλίζεται, τη νύχτα πετά.
  insect.louse:
    label: ψείρα
    summary: Ένα μικροσκοπικό άπτερο παράσιτο που ζει στο δέρμα και στο τρίχωμα των θηλαστικών.
    info: |
      Η ψείρα είναι άπτερο παρασιτικό έντομο της τάξης Phthiraptera που ζει στο δέρμα του ξενιστή και στο τρίχωμα ή στα μαλλιά του.
      Ρουφά αίμα και προκαλεί φαγούρα.
      Η ψείρα του κεφαλιού απαντάται σε όλο τον κόσμο και προσβάλλει τα παιδιά ανεξάρτητα από τις συνθήκες υγιεινής.
      Ιστορικά οι ψείρες μετέδιδαν τον τύφο και άλλες ασθένειες.
  insect.bedbug:
    label: κοριός
    summary: Ένα πλατύ παράσιτο που ρουφά αίμα τη νύχτα· κρύβεται στις χαραμάδες των επίπλων.
    info: |
      Ο κοριός είναι πλατύ ωοειδές έντομο της οικογένειας Cimicidae, δραστήριο κυρίως τη νύχτα.
      Δαγκώνει και ρουφά το αίμα του κοιμισμένου ξενιστή.
      Κρύβεται στις χαραμάδες του στρώματος, στα έπιπλα και πίσω από ταπετσαρίες.
      Τις τελευταίες δεκαετίες εξαπλώθηκε σε όλο τον κόσμο χάρη στα διεθνή ταξίδια.
  insect.antlion:
    label: μυρμηγκολέων
    summary: Μια προνύμφη που σκάβει χωνοειδείς παγίδες για μυρμήγκια στην άμμο.
    info: |
      Ο μυρμηγκολέων είναι η προνύμφη ενός εντόμου της οικογένειας Myrmeleontidae που σκάβει κωνικά χωνιά στην ξηρή άμμο.
      Όταν ένα μυρμήγκι γλιστρήσει στην παγίδα, ο μυρμηγκολέων το αρπάζει με τις σιαγόνες και εγχέει πεπτικά υγρά.
      Τα ενήλικα είναι ασήμαντα, μοιάζουν με λιβελλούλες και πετούν τη νύχτα.
      Οι προνύμφες μπορούν να ζουν χρόνια κάτω από το χώμα χωρίς τροφή.
  insect.goliath_beetle:
    label: σκαθάρι γολιάθ
    summary: Ένα από τα μεγαλύτερα και βαρύτερα έντομα στον κόσμο, από την τροπική Αφρική.
    info: |
      Το σκαθάρι γολιάθ είναι ένα από τα μεγαλύτερα έντομα στον κόσμο· τα αρσενικά ζυγίζουν έως και 100 γραμμάρια και ξεπερνούν τα 11 εκ. σε μήκος.
      Ζει στα τροπικά δάση της ισημερινής Αφρικής.
      Τα ενήλικα τρέφονται με φρούτα και με χυμό δέντρων.
      Στην Αφρική τα παιδιά τα κρατούν ενίοτε ως παιχνίδια και μερικά πωλούνται σε συλλέκτες.
  insect.bombardier_beetle:
    label: βομβαρδιστικό σκαθάρι
    summary: Ένα σκαθάρι που για άμυνα εκτοξεύει βραστό δηλητηριώδες μείγμα.
    info: |
      Το βομβαρδιστικό σκαθάρι είναι σκαθάρι της υποοικογένειας Brachininae που αμύνεται με μοναδικό τρόπο· αναμειγνύει στην κοιλιά δύο χημικές ουσίες, κάτι που προκαλεί εκρηκτική αντίδραση σε πάνω από 100 βαθμούς.
      Ο πολύ καυστικός ατμός εκτοξεύεται με δυνατό κρότο έως και 500 φορές το δευτερόλεπτο.
      Είναι ένα από τα πιο συναρπαστικά παραδείγματα χημικής άμυνας στη φύση.
  insect.diving_beetle:
    label: δυτίσκος
    summary: Ένα αρπακτικό υδρόβιο σκαθάρι που κολυμπά κάτω από την επιφάνεια.
    info: |
      Ο δυτίσκος είναι αρπακτικό υδρόβιο σκαθάρι της οικογένειας Dytiscidae που ζει σε λιμνούλες και στάσιμα νερά.
      Κολυμπά επιδέξια χάρη στα πλατιά πίσω πόδια του που λειτουργούν σαν κουπιά.
      Αναπνέει στην επιφάνεια και αποθηκεύει αέρα κάτω από τα έλυτρα.
      Κυνηγά έντομα, προνύμφες, μικρά ψάρια και γυρίνους.
  insect.velvet_ant:
    label: βελούδινο μυρμήγκι
    summary: Μια άπτερη πορτοκαλόμαυρη σφήκα που μοιάζει με μυρμήγκι.
    info: |
      Το βελούδινο μυρμήγκι είναι στην πραγματικότητα σφήκα της οικογένειας Mutillidae· τα θηλυκά είναι άπτερα και μοιάζουν με μυρμήγκια.
      Έχουν εντυπωσιακές κόκκινες ή πορτοκαλί τρίχες ως προειδοποίηση.
      Τα θηλυκά έχουν εξαιρετικά ισχυρό κεντρί, με το παρατσούκλι «δολοφόνος αγελάδων».
      Παρασιτούν στις φωλιές των μπάμπουρων.
