lang: el
pivot: false
title: Έντομα
cards:
  insect.ant:
    label: '"Μύρμης"'
    summary: '{"summary": "Πολύ λεπτόκορφο φυσική γέννηση νευρωνικών κολωνιών.",}'
    info: '{"info":"Ο μύρμης είναι έντομο που σχηματίζει τεράστιες κολωνίες όπου αυξάνεται διαίρεση των βαθμών."}'
  insect.antlion:
    label: '"myrmaleon"'
    summary: Προνύμφη που υποβαθμίζει λαγωνιστές ant trap στο ψαμμο.
    info: |-
      {"hint":"προνύμφη εντόμου που χάκει λαγωνιστές για να αιχμαλώτευσε τα μύρμηγκα ή σκούδες","info":"Το myrmaleon είναι προνύμφη κάποιου φυλής εντόμων Myrmeleontidae , που δημιουργεί κωνικά «παγίδε» στοξερόψαμο .
      Όταν το μύρμηγκα βουλιάζει στην παγίδα, το myrmaleon το κρατά με τα δόντια του και εισάγει την πεπτική ραφή.
      The adults are inconspicuous similar to dragonflies flying at night.
      Λάθος μπορεί να ζήσει χρόνια underground without food intake."}
  insect.aphid:
    label: ἀφίδες
    summary: Μικρό ζῷον ἅρματος ἕξῃ ἰδίᾳ ἱχνοὺς ẗς γῆς.
    info: Οι αφίδες είναι μικρά έμπτυστα τηλεόψον που φέρονται στα βλαστή ριζών και διαβιούν κατ' εξοχὴν ἀπὸ τὰ νερᾶ λωρὶδα γῆς· ὑπὲρ τῶν ῥᾳθῦμον ᾧν παράγουσιν, ἐπιμελοῦνται μύρμηγκες ἄντεγνὼς ἡμῖν ἔρῳ προστασίας.
  insect.atlas_moth:
    label: '"Martyniak Atlas"'
    summary: Ένας από τους μεγαλύτερους ποδισμάκων στον κόσμο με φτερώματα που ξεκαθαρίζουν τα σχήματα των σανίδων.
    info: '{"hint":"ένας από τους μεγαλύτερους ποδισμάκων στη γη","info":"Το Martinat atlasowy είναι ένας από τους κυριότερους νυχθήμερους ψύλλους στον κόσμο με φτερώματα διάμετρο ίση με 30cm\nΟι λεβιές των φτερών του βαφτίζονται οξύτατα ώστε να μοιάζουν με κεφάλια σανίδων , προκειμένου να αποτρέψουν τους προϊστάμενους . \nΗ ενήλικη φάση δεν θέλει στόμα και δεν ζει ; περνά μόνο λίγες ημέρες ως ενήλικες . \"Προέρχεται από τα τροπικά δάση της νοτιοανατολικής Ασίας."}'
  insect.bedbug:
    label: Σφαγίτη
    summary: Πλατύ νώχευτικό φαγοβούτυρο; λανθάνει σε ρωγμές.
    info: Η Ενδομυική σφαγίτη είναι πλάσεως όρθιππο αύξον του γένους Cimicidae και δρα μόνιμα βράχιο.
  insect.bee:
    label: βόμβα
    summary: Φυτοφάγο οξύζωο που πολιῶνει τα λουλούδια.
    info: '{"hint":"ασπροκίτρινο έντομο που κάνει μέλι","info":"Η αγαπημένη συνήθως βόμβα είναι το νεφώδες όντα για λύχνο, διψασχημένο για νεκτάρ.","label":"βόμβα","summary":"Πολύχρωμο φυτοφάγο ζῷο που πολιῶνει τα λουλούδια."}'
  insect.beetle:
    label: Σκουλήφυτο
    summary: Η τάξη των σκουληφύτων αποτελεί τη μεγαλύτερη τάξη των εντομών με περισσότερα από 400.000 γνωστά είδη
    info: "Το σκουλήφυτο ανήκει στη τάξη Κόλεοπτερα και περίπου εμβώλιο μέσω όλων των γνωστών φύχων βγής δραστηριότητας \nΧαρακτηρίζεται από λεπτό χιτώνα προστασίας νευρώνων (ελυθρα) , που κρύβουν τα πραγματικά πτερύγια\nΟ Γεροδερματικός σκουλήφυτος είναι o μεγαλύτερος σκουλήφυτος της Ευρώπης· το αρσενικό έχει μεγάλα προϊόντα"
  insect.bombardier_beetle:
    label: Στρεβλίκ Δηλώ
    summary: Έντομο που εκτοξεύει βραστή δηλητηριώδη μίγμα ως προστασία.
    info: Το Strevlik Dělostrilec είναι έντομο από τη υποκαρυδιάσεως Brachininae που συγχέει δύο χημικές ουσίες με βλαβερή και φθορευτική λειτουργία για να προφυλάξει τον εαυτό του.
  insect.bumblebee:
    label: Καμενός
    summary: Μεγάλος μαλλιάρικος ντάφτης με βαρύ «ψιφγ» – σημαντικός λιπωτής.
    info: |-
      Το καμενός είναι έντομο του γένους Bombus προσβληθική συγγενική με τη ρόδωπη ντάντα απ' το βούραχο
      Είναι διαχειριστής λιπών φυτών - ιδιαίτερα σε ψυχρότερους κλίματα, όπου οι ντάντες περιορίζονται,
      kai μπορεί να θερμανθεί τρέμοντας τα μυϊκά του πτερύγια, άρα μπορεί να πετάξει ακόμα και σε κρύο.
  insect.butterfly:
    label: ψύλλο
    summary: Λέπτοτο κάραβο με μεγάλα χρωματιστά πτερύγια.
    info: '{"hint":"πτηνό κάραβο με τύμπανο σχέδιου πλαγίως φυλλώσεων εξ ακριβής θέσεως","info":"Το ψύλλο είναι νεφρίδιο δύο γραμμών λεπτών φθοριζόντων πτερύγων.","label":"ψύλλο","summary":"Πτηνό κάραβο με μεγάλα βαρύτητας πτερύγια."}'
  insect.caterpillar:
    label: Σκουλήφα
    summary: Λαρβά ενός πεταλούδας ή σκουλήφας· φυγούς φύλλα και προετοιμάζεται για metamorphosis.
    info: "Η σκουλήφα είναι το μετάθημα πρόσωπο έντομου κι αφιερώνει τη ζωή του να φυγούς λистέ για να διαχειριστεί ενέργεια ώστε να βγει από τη μεταβολή. \nΚάποιες σκουλήφες θέλουν ξεχωριστά χρώματα για να προειδοποιήσουν τους προΐσταμενους για την τοξικότητά τους. \nΠριν από την κατακράτηση, δημιουργεί μια chrysalis, όπου η μεταμόρφωση συμβαίνει."
  insect.centipede:
    label: '"Χιλέως"'
    summary: Πολύνηχρο αρθρόδερμα με ένα ζεύγος νήματος για κάθε λουφίζιο.
    info: '{"hint":"πολύνηχρο αρθρόδερμα με έξι πόδια και δυσκίνητο σώμα","info":"Η χιλέως είναι ταξινομημένη στην τάξη Chiropda και φέρει ζεύγος νήματος για κάθε λουφίζιο του σώματός της(όχι 64 νήματα , όπως υποδηλώνει το ψευδώνυμό της).Είναι ισχυρός πρόβος που βρίσκει τα θηλιά , τα σκώληκα και τα μικρά σπονδυλωτά .Το πρώτο ζεύγος νήματος ονομάζεται "ψευδονήμα" και χρησιμοποιείται για να παραλύσει το άϋπνο."}'
  insect.cicada:
    label: '"Σιγήλιδα"'
    summary: Έντομο γνωστό για την ξεχωριστή ίνταξη του σε ΖΕΡΒΙΛΕΣ.
    info: '{"hint":"προνύμφη που τα αρσενικά είται γνωστό ότι κάνουν θόρυβο","info":"Η σιγήλιδα είναι μέλος της νεχρών διαθεσης Cicadoidea φήμης λόγω ενός από τα πιο βραχνά ήχους απ'' όλα τα εντόμα\r\nΟι αρσενικοί παράγουν έναν ιδιαίτερο ηχητικό μηχανισμό (timbal), στο πλάϊ τους, για να προσελκύσουν τα οργανισμά τους\r\nΚάποιες είδη στις ΗΠΑ ζουν για δεκαεπτά ή δεκατρία χρόνια\r\nΤα νεαρά (nymphe) ζουν για ώρες κάτω από το άψεγο και τρέφονται από ρίζες."}'
  insect.cockroach:
    label: Κάστρο
    summary: Σαβουλωπίδιo νυκτερινό ημιφαγικό ή παντοφαγικό ιδιαίτερα ανθεκτικό.
    info: '{"hint":"Γρήγορο νυκτερινό σαβουλωπίδι έντομο","info":"Το κάστρο είναι μερικές από τις πιο δύσχρηστες χιλιοεφημερίδες στον κόσμο· γι'' αυτό βγαζει φθορά ακόμα και λόγω περιβαλλοντικών συνθηκών που θα ξεψύξαν άλλα ζώα\nΥπάρχουν πάνω από $ \$4\.500 είδη , αλλά μόνο περίπου $$30$$ οικονομούν σε περιοχές με ανθρώπους\nΕίναι παλιό έντομο - τα κάστρα υπάρχουν πάνω από $$$300$$ εκατομμύρια χρόνια · επιβίωσαν τους Δεινοσαύρους\nΈχει ταχύτητα · μπορεί να τρέχει με ταχύτητα πάνω από $$$5$$ km\/h"}'
  insect.crane_fly:
    label: tipula
    summary: Μεγάλο νυφοειδές θηλυκό με εξαιρετικά μεγάλα πόδια.
    info: Η tipula είναι έντομο διπλής περισκέψεως από τη φυλή Tipulidae και μοιάζει όχι σε γίγαντα νύφη, αλλά δεν λιθοδιώκει ούτ' εξαρτώνται βιολογικά· Διαθέτουν εξαιρετικά μεγάλα πόδια που μπορούν να αποβάλλονται εύκολα - η αυτοτομία είναι μέρος της αμυντικής τους στρατηγικής ·Οι ενήλικες ζουν μόνο μερικές ήμερες και δεν τρέφονται ιδιαίτερα ή παίρνουν τροφή από το νεκτάρ.
  insect.cricket:
    label: Βάτραχος
    summary: Φυγόβολος νυκτερινός υψηλός για τον γέφυρωσμα των ανδρών.
    info: "Το βάτραχος πεδινό είναι νυκτερινή χλώη από τη σειρά ΟΡΘΟΠΕРАΣΗΜΑΤΩΝ. \nΟι κύριοι γέφυρωσμα με διαθέσεις λουζέται φυγόβολο και προϊόν περιοχής. \nΣτην Ασία οι βάτραχοι παραδοσιακά φυλάγονται ως σπίτι μαΐστροι για τον τραγουδιστικό τους."
  insect.damselfly:
    label: Ζυγόπτερο
    summary: Λεπτός συγγενής του βαζιλιού· φθάνει να διπλώνει τα γονίδια παράλληλα.
    info: Η ζυγόπτερος είναι παχύδωση σχετική του κάμπιλου αλλά λεπτές μορφών όπου φθάνουν να διπλώνουν τα γονίδια παράλληλα με το σώμα τους, αντίθετα από τα βαζίλια.
  insect.diving_beetle:
    label: πόταπνικας
    summary: Χρυσὼφθαλμος ᾠν πλέει ὐπὲρ τῆς επιφάνειας
    info: "To μεγάλο πόταπνικας είναι ένσωμη χρυσώφθαλμο απ' τη φυλή Dyтисidае που βρίσκεται σε λίμνες και νερά δύναμης\nΠλέει γλιττά ως αποτέλεσμα των επίπεδων πλευρικών ποδιών του που λειτουργούν όπως οἱ ἀξίλῃ \nΦυσικὰ ὑπὸ τὴν επιφάνεια καὶ κρατᾷ τὸ αἰῶν ὅπῳ τῆς εὐχῇ"
  insect.dragonfly:
    label: '"λεπτοψάρι"'
    summary: '"Έντομο με μακρό σώμα και δύο χειριστές."'
    info: '{"hint":"μακροσώματο έντομο με δύο ράφια των πλέγματός του και φυσική αποχημίδα για να εξαθλιβάζει στα βαθιά","info":"Η λεπτοψάρια είναι η προϊόντας των αποχημιδών με εξαιρετική όραση, που "\"",'
  insect.dung_beetle:
    label: Προϊόν
    summary: Έντομο που κατασκευάζει μπάλες λύκου.
    info: Το Vravouon είναι έντομο της κατηγορίας Scarabaeidae που σχεδιάζει μπόλ ασβέστων για να ρυθμίσει λύκο και φώφες δια βίου. Διακρίνεται από την ικανότητα να προσανατολίζεται με βάση τη Γαλαξιακή Πορεία.
  insect.earwig:
    label: Ψέγδου
    summary: Δερμαπτηρόν με κλωνίσματα στο νύφιο.
    info: '{"hint":"παχύ σκορπιό με κλωνίσματα πάνω απ'' τη ουρά","info":"Το ψέγδου είναι έντομο της τάξης ΔΕΡΜΑΠΤΗΡΟΝ γνωστής διότι φέρει βραχίονες - λώβενα (cerci), στο νύφιο του τμήμα, που χρησιμοποιούνται για άμυνα και για την αναπαραγωγή\rΓια το όνομά του υπάρχει η παρανοϊκή πίστη ότι «θα τους πάψει» στα αυτιά· αυτό είναι μύθος\. Τα ωοφόρα θηλυκά είναι ιδιαίτερα για το γεγονός ότι φροντίζουν τα αυγά και τα νεαρά λαρυγγικά τους ζώα, πράγμα πολύ σπάνιο στα έντομα\.Ζουν σε ρωγμές , κάτω από πέτρες και φύλλα ","label": "Ψέγδου", "summary": "Δερμαπτηρόν με κλωνίσματα στο νύφιο."}'
  insect.firefly:
    label: Φωτεινή
    summary: Παραβολικός φωτισμός προϊόν βιοφωτισμού.
    info: Η φωτεινή σκουληφάς είναι ένα κρύο πρόσθεμα της απέχθειας βιοφώτα με δυνατότητα να λάμψει ροζ για να αξιολογήσει την απόδοση.
  insect.flea:
    label: Πετινή
    summary: Μικρό παρασιτικό ζῷο που θρέφεται µε αίµα από ιψιλῶντα.
    info: Η πετινή είναι ένα απολύμφωτο κάρβους της τάξης Siphonaptera με συγκεκριμένη διαχείριση για χώδικό φυσιολογικό βιοτικό λόγο. Διαθέτει δυνατά πίσω νογκάζια που της επιτρέπουν να πηδάει πάνω από 150 φορές το μήκος του σώματος της.
  insect.fly:
    label: Μουσκο
    summary: Συχνός δύο φτερά χελιδόνι που μπορεί να μεταβιβάζει βακτήρια.
    info: Η οικία των ντόμπερ μουσών είναι αυτή που συχνά βλέπονται δύο φτερά ψηφιδωτά κάθε λίγο γύρω.
  insect.goliath_beetle:
    label: Γκολιά
    summary: Ένα από τα μεγαλύτερα και βαρύτερα θηλυκά συνθηκώς που βρέχει δένδρων.
    info: Το Goliát είναι ένα από τα μεγάλτερα όντισμα συνθηκώς που βρέχει δένδρων και φρούτα για να λιβανήσει· οι αρσενικοί ζυγίζουν μέχρι 100 γραμμάρια και φτάνουν σε μήκος πάνω από 11 εκατοστά.
  insect.grasshopper:
    label: Κίγκλη
    summary: Πεταλούδι με μεγάλα πόδια και «χειροκρότημα».
    info: '{"hint":"πεταλούδι με πρόσθιους ανώμαλους φυλάκων","info":"Η Κίγκλη είναι όχι σφήκα της κατηγορίας Orthoptera με δυνατές γόνατα να βγάζει λεπτό ρόβο ίσο με το εξικό του μήκος\nΟι αρσενικοί παράγουν χαρακτηριστικό ήχο(Στριδουλασία), τρίψιμο των πλευρών τους στα πτερύγια \nΦαΐνει φυτά· σε μεγάλα σώματα μπορεί να προκαλέσει ζημιές στην απόδοση."}'
  insect.ground_beetle:
    label: Στρεβλίκι
    summary: Γρήγορος προϊστάμενος κάμπυλος ζωντανός μεταξύ πέτρες.
    info: Το στρεβλίκι είναι ένας κάμπυλο από τη φυλή Carabidae· πολύ δραστήριου νύχτων μέγεθος ψηφίζει για λούπηδα βάσεις, σκώληξ και αφεψίδια.Είναι γρήγοροι και τρέχουν γρήγορα από τον κίνδυνο.
  insect.hornet:
    label: crabro
    summary: Το μεγαλύτερο ταυρώμβα στην Ευρώπη με ισχυρό γυψοσανίδι.
    info: Η Vespa Crabro είναι η μεγαλύτερη κοινωνική ταυρώμπα στην Ευρώπη που φθάνει ακόμα ως τα 3,5cm. Δημιουργεί γυψοσανίδια νέφελα σε βρεχτά δέντρα ή σε τζάμπα λόγω της μεγάλης της μεγέθους.
  insect.hoverfly:
    label: Πεστρένκα
    summary: Ένημο που μιμείται χρώμα βούρσος &amp;amp; ντάντε - πολυβότανος.
    info: Η πεστρένκα είναι ένημο των διπλόγυφους απ' τη φυλή Syrphidae και μιμείται χρώμα σχήμα βούρσος και ντάντε για προστασία λόγω προδρομικών (βατζεψκ) μιμικρών, αν και δεν ψιθνίζει.
  insect.lacewing:
    label: ζωντανή προσέγιες
    summary: Λεπτό τηλεχάκι με διφθόρακες· οι νύμφες του τρώνε βράβο.
    info: |-
      Η ζωντανή προσέγιες είναι τηλεχάκι από τη φυλή Chrysopidae με λεπτους διφθόρακες και χρυσώ σμιξη
      Οι νύμφες της είναι γονίδια και τρώνε μεγάλες ποσότητες βράβοι, γεγονός που της κάνει φυσικό προστατευτικό των φυτών,
      Τα ενήλικα θρέφονται με νεκτάριο και πρόπολις
  insect.ladybug:
    label: '"βερούσκα"'
    summary: '{"summary":"Μικρό γκριζωπο αχνώδες άγριο λάκκο"}'
    info: '{"info":"Η βερούσκα είναι έντομο που τρέφεται με ψυλλιά και φθηνό σπήλαιο."}'
  insect.locust:
    label: Κοβίλκα στεγωμένη
    summary: Στεγωμένη κοβίλκα που δημιουργεί νενίδι
    info: |-
      Η Κοβίλκα στεγωμένη είναι μια φυσική που υπό κάποιες συνθήκες δημιουργεί τεράστια αφύδριχα γεώμενα νενίδια
      Ένα νενίδι μπορεί να αποτελείται από δισεκατομμύρια άτομα και να καταστρέψει μια συνολική βιοτική παραγωγή σε χιλιάδες εκτάρια λίγες ώρες
  insect.louse:
    label: Πτηρία
    summary: Ένα λεπτό, βρόχινο παράσιτο που ζει στην επιδερμίδα και στα μαλλιά των θηλαστικών.
    info: Η πτηρία είναι ένσωμος από τη φυλή Phtiriaptera κάθεται στους χώρικές μύγες για να διψώσει το αίμα τους.
  insect.mayfly:
    label: Επίβλιχθων
    summary: Έντομο με την πιο σύντομη άψυχη ιστορία—ζει μόνο ωρές ή ημέρες.
    info: Η εφήμερη πτώσια ανήκου στο τάξις Επίβλιχθων και χαρακτηρίζεται για μόνιμη φύση - τα δέρμα νυχτερίδας ζουν λίγες ώρες έως μερικές μόνο ημέρες. Δεν θέλουν τροφή – δεν οικοδομούν κανένα βιολογικό σύστημα γι’ αυτό. Οι νύμφες ζουν 1–3 χρόνια υπό νερό.
  insect.mosquito:
    label: κουνούπι
    summary: Δυσπλέγματα τριχοψάρια · Ταθήνες μαζεύουν φλεβώδη για να αναπτύξουν αυγά.
    info: '{"hint":"εμφαινός πτηκωδής έντομο(Culicidae)","info":"Τα κουνούπια είναι δυσπλέγματα τριχοψάρια από τη νidi Culicidae\nΟι χήνες μαζεύουν φλεβώδη για να λάβουν πρωτεΐνες στην ανάπτυξη βιολογικών αυγών· οι αρσενικοί τρέφονται με νεκτάρ\.\nΚουνούπια μεταφέρουν επικίνδυνα νοσήματα όπως malaria ,dengu ή Zika \nΥπάρχουν περισσότερα από 3500 είδη κουνουπιών στον κόσμο","label":"κουνούπι","summary":"Δυσπλέγματα τριχοψάρια ; Οι χήνες μαζεύουν φλεβώδη και μπορούν να μεταφέρουν νοσήματα."}'
  insect.moth:
    label: myros
    summary: Νυκτερινός συγγενής των βατραχιών· πετάει με φως και έχει πτερυγιωτούς αισθητήρες.
    info: Οι μύρες είναι νυκτερινά ταξίδια από τη φθορά Λέπιμπτερα που διαφοροποιούν σχήμα και χρώμα από τα ηλιόσβηστα βατράχια για λόγους προστασίας.
  insect.praying_mantis:
    label: Ναϊτίδα
    summary: Προΐσταμενος εξ αυτού του προσευχόμενου στάζει.
    info: Η Ναίτιδος ελεγχόμενη από τους πρώτους σκέλη ως μυστήριο και φθονεί γι' αυτό δύναται να λάβει την πρωτοφανή βολή.
  insect.robber_fly:
    label: Στρεχατκα
    summary: Δρομωδής που λογικά γονιμοποιώντας οποιοδήποτε βρώμιο
    info: |-
      Η στρεχατκα είναι ένης δρομωδής που απέλυσι τάξη Δύφιγγα με καθ' όλη τη φόρμα να λовεί γονιμοποιώντας άλλα βρώμια
      Έχει δυνατά πόδια για να πιάσει την πρόβα και ιϊζοντα να εισαγάψει παραλυτικό δηλητήριο,
      Κάποιες είδη μιμούνται την εμφάνιση των καντιδίων ή των μελισσών για προστασία από τους προΐσταμενους.
  insect.scorpion:
    label: Σκόρπιο
    summary: Δηλητηριασμένο αράχνη με λαβύρθων και φτιαγμένο δηλητηριασμένο βραχίονα.
    info: Το σκόρπιο είναι ένα αράχνη τύπου πλήμτων και όχι νευσών με δύο γραφιδές λαβύρθων και φτιαγμένο βραχίονα που τελειώνει σε δηλητηριασμένο γάϊδαρο. Διαθέτει παλαιά ίχνη· τα παλαιότερα από τα απολιθωμένα σκόρπια είναι περίπου 430 εκατομμύρια χρόνια παλιά.
  insect.silverfish:
    label: Ρίβενκα
    summary: Απ’ τα έξω από τα νοικοκυριά τα ώριμα και τα χαρτιά.
    info: |-
      Η ρίβενκα είναι πρωτόγονης φύσης άπτερο κάμπιδο απ' τη σειρά Zygentomata μέσα στους διαχειριστές νοικοκυριών
      Φτιάχνει βλήμα για λεφθέν, χαρτί, βερνίκι και υφαντικά νитρικά,
      Ο νόμισμα της προέρχεται από το ασημένιο ως ψυχρό όψιμο και τον ύποπτο τρόπο κίνησης.
  insect.spider:
    label: '"psifidh"'
    summary: «Psifides» me okta pedia gia to psilimata
    info: '{"hint":"Οκτάποδη αραχνική που συλλέγει τσίμβα","info":"Τα ρόδων ή και γνώριζα είναι μέλη της φθύγας διαφορετικής απ'' τα νηματόψυχα βαθμίδας Araneidae με οκτώ πόδια και δύο λοξές πλευρές σώματος\r\nΈχουν την ικανότητα να παράγουν νήματα, απ’ τα οποία κατασκευάζουν ΔΙΚΕΣ ΓΙΑ ΤΗΝ ΠΡΩΪΔΥΛΗ Ή ΑΠΛΏΣΜΑΤΑ ΚΟΚΚΊΝΩΝ ΜΕ ΩΆΓΟΝΑ\r\nΨηφίζουν περισσότερα από 48\.000 είδη ψηφίδων στον κόσμο\r\nΌλα τα είδη παράγουν δηλητήριο, αλλά το μεγαλύτερο μέρος είναι ανώδυνο για τον άνθρωπο."}'
  insect.stag_beetle:
    label: Ροχάτς
    summary: Πρόκειται για το μεγαλύτερο σκουλήφυ της Ευρώπης· ο αρσενικός γένος ιδιοποιείται από λεβιδωτά βλεννοξύλα
    info: "Το Lucanus cervus είναι το μεγαλύτερο σκουλήφυ που ζει στην Ευρώπη και φθάνει ακόμα ως τα 7cm σε διάμετρο\nΟ αρσενικός γένω να έχει λεβιδωτά βλεννοξύλα που τα χρησιμοποιεί για να αγωνιζόταν για τις θηλυκές \nΗ νύμφη ζει μέχρι και 7 χρόνια σε σαρψίματα Δρυών"
  insect.stick_insect:
    label: Φασμάτιδα
    summary: Ένης από τους προβλέψεων μυγκών που να λειτουργεί πλήρως ως βλαστός η φύλλο.
    info: Η φασμάτιδα είναι ένης από τους προβλέψεων μυγκών και γνήσιο χαϊδεύτη σχήματος δενδροφύλλων· το σώμα της να λειτουργεί πλήρως όπως βλαστούς ή φύλλα.
  insect.termite:
    label: Termite
    summary: Ένσημο που κατασκευάζει τεράστιες στήλες.
    info: |-
      Τα τερμίτια είναι κοινωνικά ένσηµα από τη συγχώρα Isoptera που υπήρξε µέλος των φθόριδων
      Ζουν σε μεγάλες γεύσεις διαφορετικών βαθμών -βασιλιά , βασίλισσα, νεαροί λεπτοί,
      Στρατιωτικά και εργαζόμενα .
      Κατασκευάζουν πολύπλοκες στήλες – στα τροπικά ίσως 9 μέτρα ύψος– με σύστημα αερισμού.
  insect.tiger_beetle:
    label: ΠΕΔΙΝΟΚΗΤΡΑΣ
    summary: Γρήγορος μεταλλικός εντομος
    info: "Το πεδινόκητρα είναι έντομο από τη υποφυλή Cycindelinae γνωστό για μεγάλη ταχύτητα και δεξιότητα στο πτώμα και φθορές βλέψης\nΚινείται τόσο γρήγορα που πρέπει να σταματήσει και να επανοριентωθεί λόγω της ταχύτητας \nΈχει μεταλλική χρωματιστή επιφάνεια( πράσινο , μπλε )"
  insect.velvet_ant:
    label: Σαμετένιος μύρμηξ
    summary: Πορτοκαλί - μαύρος βραχύγναθος τυχόσης.
    info: Το σαμετένιο μύρμηκάς είναι πραγματική τυχόση φωλιά από τη νοσηφθοριδή Μουτιλλίδα· όλες δεν κρατούν για λεβεντώνες.
  insect.wasp:
    label: μυρτωπίδα
    summary: Πορτοκαλί - μαύρο ζυγωπίδιο που σχηματίζει χαρτώνας.
    info: Η μυρτωπίδα είναι ένσικο κάμπιψη από τη γενιά Vespula που σχηματίζει χαρτώνας φωλές από δύσβαθρο λιγνίνης νερού. Διαφορετική από τη μέλισσα, μπορεί να βολιάσει πολλές φορές.
  insect.water_strider:
    label: Νεροπόδα
    summary: Έντομο που γυμνάζεται στην επιφάνεια του νερού.
    info: Η νεροπόδα είναι έντομο από τη φυλή Γκέρις που μπορεί να κάθεται στην επιφάνεια χωρίς να βυθίζεται λόγω των δύσχρηστων τριχών στα πόδια του και της επιφανειακής τάσης.
  insect.weevil:
    label: Νόσατες
    summary: Πολύ μικρό σκουλήφυ με χαρακτηριστικό προεξέχον «ρόστρουμ».
    info: |-
      Το νόσατες είναι ένα σκουλήφυ πρωτύτης της φυλήμπιδας Curculionidae, μιά απ' τις κυριώτερές γενεές όγχι διαβίζει βαθύτερα λεπτότερα με περισσότερα απ’ τα 59874 είδη·
      Η χαρακτηριστική προεξέχουσα 'ρόστρουμ', που είναι το μύτη του, υπολογίζει για να ρυψίσει στα σπόρια, τα φρούτα και τα δέντρα
      Κάποια είδη είναι σοβαρότερα γεωργικά ζημιοϋπόγεϊα, ως το νόσατες της βαμβακιέτας,
      Αλλά είδη είναι ειδικευμένα σε ολόκληρο είδος φυτού.
  insect.whirligig_beetle:
    label: viros
    summary: Μικρό σκουλήφυτο που περιστρέφεται σε ομάδες στην επιφάνεια
    info: "Το Vironis είναι νερό σκουλήφυτα από τη φυλή Τζιρινάϊδε που ζει και μέσω ρύθμισης για να δώσει λύγισμα στους προΐχνες\nΟι μάτια του βρίσκονται σε δύο μέρη : το ένα βλέπει πάνω από το νερό , το άλλο κάτω από το νερό .\nΑνιχνεύει ripples(ξέστρα ) στην επιφάνεια που δείχνουν τροφή ή κίνδυνο \nΚατ' ημέραν περιστροφή -βρίσκεται περιστροφή – κατ 'Εβδομάδα πτήση"
