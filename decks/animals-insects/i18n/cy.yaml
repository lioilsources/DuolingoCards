lang: cy
pivot: false
title: Insectau
cards:
  insect.ant:
    label: '"Mrynych"'
    summary: '{"summary": "Gyntor cysylltiedig sy''n byw ar draws rhagfyr."}'
    info: '{"info":"Yw''r mynydd yn gynhyrchiant sy''n ymestadu mewn grwpiau gyda rôlau penodol."}'
  insect.antlion:
    label: mydr
    summary: Gwelaf lle byddwn yn copio tiroedd erlyn am antyd
    info: |-
      Mae'r mydwr yn llifogydd o feithrin sy'n gweiddio tywyllau cyffredig ar y sglefri rhag anifeiliau antwedd Mraveleontaeth
      Pan fo antydd yn gliriant i lawr yr uned ryngwen nhomant ato ac maen nhymuno digwyddion trothwy
      dynrychiadau dda allai ddod â chwareli fach na'u hun dan fylio heb eu cwtogi
  insect.aphid:
    label: sgwffli
    summary: Creafri nodweddiadol ar linell fedr; cynhiarch sylfaen.
    info: Sgwfflau yw creafri nodweddiol rhag anifeiliaeth Aphidoidea sy'n gweithredu ar waelodfed yn eu bwylliant. Mae'r teimloedd yn cynhyrchu sylfaen llawn cymeriad amharu gan boblygiannau ac maent yn cael ei gofio gan ffriddiau er mwyn cadwddwr.
  insect.atlas_moth:
    label: mabyn
    summary: Un o'r môr fwyaf tywyll yn y byd gydag amharu ôsian
    info: |-
      Mabyn yw Martinat Atlasowy un o'r mydd yn rhaglen yr byd gyda chwerwydd sy'n cyrraedd i hynt at 30 sm ar draws ei gheirniadau
      Ganrifai'r cymesuredd hefyd fel pen ddŵr erthyliol gan fynd â phatrwm cwbl danaregol ac hwn all helpu e chi weithredu'n nhrydyddion
      ei wnaeth ni'ch bod ag unrhywbeth fodd na'u diwrnodau hedfan maen nhw'n dod yn Aseria Tropigal dechrwynnas Asia Wedlynas
  insect.bedbug:
    label: ystênt
    summary: Parasitiwr llafn sy'n bodoli ar gyfer noson ac maen nhw' i weiddio dan llygreiniadau.
    info: Mae'r ystâniaeth yn gogwyddo rhwng yr oesoedd mewn teithiau byd-eang trwy ddarllen cymeradwyaethau diweddar.
  insect.bee:
    label: apis
    summary: Insectau llydri rhodewdd sy'n credu amheddiannol.
    info: '{"hint":"insect fuzzy sy''n gwneud gwydr","info":"Mae Apis mellifera yn ymchwilio i''r ffrwdroedd ac yn dod o''ndro heddwiau."}'
  insect.beetle:
    label: brock
    summary: Y profyl Brocks yw'r rôl hardfyrengedig ers bod peth ryfel na phlynau.
    info: Mae'r brock yn perthnas i reoleg Coleopter ac yw'n ffurfio am nawr 40% o gydran yr unigolion gafodd eu ddogfennu erbyn hyn. Mae'nt wedi'u nodweddi gan ddwylydiau rhewrog sydd â chymeririau elytrum dan fynd nhw. Mewn Ewrop, mae'r jellini groch yn fachder Brock megis - dydy wladfaid ei encriadau.
  insect.bombardier_beetle:
    label: strevelic canno
    summary: Grwm fyddai'n tynnu eich croen chi os byddech wedi cyrraedd ei threial.
    info: Mae'r strevlyc gunaidd yn grwm o dan-clodd y Carabidegau sy'n amharu ar gyfer unigol gan ddod â dwyo gweithred rhaglennedig i mewn i'w cefndrydd ac fe wnaethant fodoli'n atgyfodiwyd ag erthyliadau anafriadol hyrhybrol felly na chymaint nad wythnos.
  insect.bumblebee:
    label: pêd
    summary: Pîs cwbl wedi'i feithrin gan yr un rym agafeloedd
    info: |-
      Mae bêd yn gogwyddwr fach rhag anrhydeddol o'r genedigedd Bombus sy'n ychydiant â phên glanwyr
      Ydynt yn bwysig ar gyfer copio plant nynweiniau pen drud neu hefyd wrth fynd dan nyfeiriau
  insect.butterfly:
    label: gwyddel
    summary: Hymfedd sy'n taro'r awyr gan ddau phar ei liwrfa.
    info: '{"info":"Mothell yw gwyddel â dwy pâr o eiriau lliwfriannol - yn gyffredinach dilynwyr rhagor."'
  insect.caterpillar:
    label: hylylo
    summary: Hylylo dyw ei enw - larwa cogsiddeddau
    info: |-
      Mae hwylio yn larwa gogwysdd neu môr ac ydynt yn cyfradweithio fyw ar waelodion folwg er mwyn cynnal donfed i'nhw am newid
      Gallai rhagymru hyliadau ddigon anaml eu bod nhw'n drinedig o'r un fath
      dyw hi hefyd i gredu chrysaledaeth wrth iddo feithrin ganrifol
  insect.centipede:
    label: ton
    summary: Genedigaeth chelwer gydag un paar o geiniogydd ar bob cysyllt.
    info: Cynffithir yn y gohebiaeth Chilopoda ac mae ganddo un paar o geinogydd dros bwynt pen Dda'r corff (nid 100 cynogyd fel sy'n cydnabwyo ei enw). Mae e fyr â rhagor hyr i ddiau craffedryddion, cerfau a pherthnasochi bysgolig. Mewn disgyrchiant nodweddiadol, maen nhymroedd olwynnod erio traoch chiadoli.
  insect.cicada:
    label: cicaeth
    summary: Gydyr eich gweld cyn belled na'ch chi nes bygythiad.
    info: Cycaeth yw gwyddel o fewn yr uned rhaglennu Cicadoidea sy'n gyfeill am ddyn nhw yn enwedig ar ei sylfaen i wneud crysau'r cysylltiadau mwyaf rhesymol ers pob dyfrod. Mewnion eu bod yn credu trwm pen-drocoli dros flynyddoedd dan fyd er mwyn dod â chweleth yn ateu.
  insect.cockroach:
    label: tywyll
    summary: Rhewnod allan yn nos, cymysgedig, agoredus.
    info: Mae'r tywyll yn un o fyd y gynharach rhewon ar gyfer ei ddifrodiant ac anweledigedd; gall e ddim ond amdanwyo gan geiriau sydd wedi'u cymeradwyo'n wael nag unrhywbeth arall. Mae mwy na phedwar filo o feithrydyddau gwahanol yn bodoli - er hyd yn olyg fod dim nodweddiadol nac aderyn nhw chi'nt yn dod at feddal rynglyn â dyn. Tywyll dydyn nhw hefyd ers lawer nag triiliod danfil o flynyddoedd cyn eu bod yn fydoedd nadinosawraidd.
  insect.crane_fly:
    label: tipul
    summary: Gyda llai na chymaint â phoen-pump mil pen bythol dan yr un enw 'TIPUL', dydy tiptan nhw hefyd.
    info: Mae tipwl yn ymwylydd rhag abseddi ar gyfer gweithredu'r cromliniaethau sy'n atgyfod i'ch nod - mae eich cyfrifiad chi am eu disynio ddim yn angenrhych.
  insect.cricket:
    label: crwn
    summary: Hymeiddio nodweddiadol gan gymdeithion Crydlydan
    info: Mae Cwrçeg Polnydd yn hymwys rhag yr adarwydd Orthopthera sy'n gweithreuoedd y nosoedd. Mae'r wladiau en nhriewi'g eu crydliadau ar gyfer gwneud cydranoli i ddod â merthnasau ac atal tebygtro. Yn Asia ddaethant i fod yn sylfaenydd cenedlaethol am ei awyrgolegro.
  insect.damselfly:
    label: gwyddyn
    summary: Rhaid gweld y cysylltiad agored rhithlonol efo'r llygreini wedi'u symudi parallellediad at eu corff.
    info: Mae'r gwyddyn yw rhag abseddi o ran nodweddiadau yn gyson â chyngresau ond mae'n fyrach ac wrth i'w bod ar allan maen nhw'u cydrifon paralleli at ei corff gan ddargedu cynghresaethau.
  insect.diving_beetle:
    label: potápniwr
    summary: Crogwynnod rhag dywysedd sy'n taro dan yr un.
    info: Mae'r potápniwr fach yn gogwyddor rhag dywysedd o fewn y deithdy Dytiscaidau sy'n byw mewn tynfforddi ac ar eanglennu welyr. Mae ei ôlyntiau isedig yn tyfu fel crafnogyon er mwya' nhymaint ag y maen nhw chiadr hefyd am eu cyflwr nodweddiadol.
  insect.dragonfly:
    label: Dŵarc
    summary: Gymuned cyflwr llafn a pharau dyweddfedig oniadau rhyngweithgar.
    info: '{"hint":"insect long-body gyda dwy ryw o ghefnen rhaglennus fach yn y byd (Odonata)","info":"Mae''r dŵr-gofio''n bodlon glas â golwg ddigon i wneud ei chwareli ar draws llynau","label":"Dŵrcan","summary":"Insect sydd ag un corff allan ac amrywiol ganrif penrhwyll."}'
  insect.dung_beetle:
    label: Glyth
    summary: Ffrwydro glyth crefyddaewc, gwreiddiol yn Lychlynna Egipt.
    info: Mae'r vruboun yn ffrwydro o fewn yr eiliad Scarabaeidae sy'n ffurfio grefydd ar gyfer eu heinwrau ac i'ch ddefnyddio fel lle y mae'u cwareli wedyn yn cael ei neud. Roedd hi'n symbol ar hydredig Coptaidd gan ddod ag anrhefnau Khepre. Mae hwnnaeth un ohiriau'r rhai fydd yn cydnabodi tuag at Milwr Diraith.
  insect.earwig:
    label: Rhew
    summary: Hynnyr protllog â clestaethau ar ei olwg.
    info: Mae'r rhew hefyd yn ymddwyn ar gyfer clestiau (cercau), sy'n dod â chymaint am ddim ond maen nhw weithreiddio ac eich bod chi'n gweledig dan fywydr agored.
  insect.firefly:
    label: mwll
    summary: Gweledigedd mwllu er hyrfaethiant bioleteria
    info: Mwll y gwyddel yn perthnasol â'r teulu Lampiridau ac mewnbwn credu swytliad ffrithgar ar ei olwg trwy gyreiddio rhaglun lusgyferan danall ag enyn. Mae cyntydynt o ddifrod un eicholiad gan yr llawer drwy ddefnyddio patrymau gwahanol sy'n helpu eu disgwyl am ein tîm chi. Maent hefyd yn nodweddiadol o fyndod tir penfys.
  insect.flea:
    label: Gwyddel
    summary: Rheweggar cerybraidd sy'n sychru driwg plant nhrawfrithiol.
    info: Mae'r gwyddel yn rhewg anaddegol o ran yr ardodau sy'n cau ar fywethu fel garasgiaid. Mae ei ddydlynyddi ddigon ychydig i'w chweilio am gyrrwr hyd at bumed cantfed llai nag eu cyflwr normal ac maent yn siopio trwm druo adar a phlant nhrawfrydion erthyliadol.
  insect.fly:
    label: gryffelin
    summary: Gymunedol dwyrain ryngweledig sydd yn gallu cyrryd bacteria.
    info: Y mwyaf yw'r gryflyn rhew hefyd yn yr unig fluch sydd wedyn ar ddaithau'n ôl i'ch bontiau ac eich bwysoedd.
  insect.goliath_beetle:
    label: goleith
    summary: Un o'r hymwlyddion tryfansagach a pherthnasagor agoredig y byd.
    info: Mae Goliathus gigantig yn un o'r hymwlyddion fwyaf mawr y byd; mae rhai dynogaethau'n pwyso hyd at 100 grammau ac maen nhw'n cyrraedd hyntoedd ar gyfer 11 sm. Mae'nhw wedi'u canfod yn fyngarothgariau dyrynasol Efrog Rhyfedd. Maed y wedydd yn eu diet - fructioacymylleiniad trwm. Yn Nhrafyckaewcyn caiff chi eu carcharu gan bobl ifanc fel dod wrth ddiddin.
  insect.grasshopper:
    label: cwblyl
    summary: Gŵr croesiog â noddweddau mynyddir a cherding.
    info: Mae'r cwblyl yn gŵr orthopthera gyda chnodau dywyll sy'n gallu rhewyll hyd at bumed cant yno fatheddiad ei enw. Mae'r wryiau yn cynhyrchu cyngresion ar wahân trwm drud nodweddiadol gan ddrudo eu noddod i'w groddon. Maent yn barod plantigol ac efallai fy ddilynwch chi nhw fel grwpiau cryf.
  insect.ground_beetle:
    label: strevelic
    summary: Gogwyddwr droseddol sy'ch chi iawn dan damewr.
    info: Mae Strevlik yn gogwyddwr o deithgor y Carabydiadau; mae'r rhagfyrion ar gyfer eu mynychiant nhw'n cael ei chweilgaru gan ddifrodau eraill fel tynffrydiaeth ac echriniaid.
  insect.hornet:
    label: vespyga
    summary: Yr enedigedig trywynnasafach a'r sylfaen agoredagor yn Ewrop.
    info: Mae Vespyga cyffredin yn y vespedydd fwy nag unrhyw un arall gan ddod i hyd at gyflwr o dan pedwar centimetr. Mae'n brynu tŷau cartrefedd mewn llygaid rhew hefyd neu ar gadeiriau. Mynych ei thriwen sydd wynt ers ein triwen nosog ac eich nodweddiad ni chwaer amdanyn nhymchfrys ond os byddech chi'n cael eu crymu.
  insect.hoverfly:
    label: pestrinka
    summary: Gwyddyn sy'n copio ar liwan bosonacaf a chimilau, opyloydydd garreg.
    info: Mae'r pestryanka yn gwyddyn rhag dyw dwflyau o fewn yr echedd Syrphidae sy'n copio ar y lliwan ac amrywiad mynyddo boson na chymalau fel cydnbyniad i weithredu allan gan lythyriwrion er nad oes eu heffeithiau chi. Mae hi'n bwysig fodd anifeiliaidd; fe'ch gweld ei ddilynwyr yn lluoedd plant ryngweithgar nag unrhyw un eraill. Mabynnir nhw'n nechtariwm a phyllyrhium. Credir bod larwerâu rai enwasau yn meddiannu crompodyaeth, felly maent yn help i fynd trwy gras.
  insect.lacewing:
    label: Gwyddelwch
    summary: Rhithfedd â llifoedd trwynfol glân-gyflymedig; mae'r tylfarwriaeth yn dod at rybodaeth.
    info: Mae'r gwyddelwch yn rhithfedd gan y teulu Chrysopidae gyda feiriant cryfliog onglwen ac eilrifau chwithgar ar eu llifogydd. Mae cyflwr llyneddol nhw'n drafodion sy'nhyn nythu millfydd fach na'u nifer uchel maen nhw'n cael ei alforio fel amrywiad nodweddiadol i orchudd plant. Mewn gofal naturiol, mae'r adroddwyr nadoleg yn meddiannu tywyll.
  insect.ladybug:
    label: perwys
    summary: brawr coed rhewog â twllion duon
    info: '{"info":"Mae berwysia araf yn ymmyl i gwrwyddo''r mydau ac maent yn hygredig o fewnol","label":"perwys","summary":"Brawr coch rhewrog gyda dawlynod onid"}'
  insect.locust:
    label: gogwyddwr
    summary: Gogwyddur ryngweithgar fyddai'n dod i'ch cefndir chi os roedden nhoch chi ddim wedi cadw gwaelod.
    info: Mae'r gogwyddwr boblogaidd yn rymwlad y byd sy'n creu grwpiau rhag absoliwnau o ddynodau ar gyfer trin eu bethau.
  insect.louse:
    label: phthirus
    summary: Rhewiniad anochel heb eihefniau sy'n dod dan fydyr a ffolio person.
    info: Mae'r phthirus yn rhewin anochel o ran y Phthiraptera sy'n byw ar wydr ac heiniau gwestai neu folion eu hedfanau. Mae nhw'n dywyll cregyn a'u effaith yn cynhyrchiant sylfaidd. Mewn gweddillion plant mae 'Pediculus humanus capitis' wedi bod fel un cyson gan fod hi'n amrydd caffo i bobl tuag at ddifrod â chymaint.
  insect.mayfly:
    label: ephimeripter
    summary: Crefydd â liwt hedfan fflymachafach nag hefnos.
    info: Mae'r ephemeroptera yn grefydd o ran nodweddiadau ac mae'n symbolegi anghartreftwyd y bygythiad amharuol gan eu haearn rhag absoliwitau ar gyfer dyddiau neu awrion unig fel cymeswylwr agored. Nid oes unrhywbeth sy'nhw ei hunan i ddarogan nhw chi wedyn nad maent yn cael cyflwr pen drud ond hynta nymfau dan wlad yr afon ers flwyddin / tri flyned erthyliannus.
  insect.mosquito:
    label: gomar
    summary: Ywod dwy-groesiad; siynir ei chrew a gallai dod â choron.
    info: Mae gomarau yn ywod rhag anifeiliau ar gyfer cael proteïnaeth i'ch waelogyddion barhau'n datblygu ac maent hefyd yn cymryd nectar fel bwyll. Mae'r math o feithrin ganlynol sydyn nhw eu bygythiad chi meddygol megis malaria neu Zika.
  insect.moth:
    label: myndnos
    summary: Cymar gyda fathdyll dros noson; taro'g maith ac fe wneuthyr plant pen.
    info: |-
      Moryddiau yw mynyddoedd nos yn yr ardod Leptopthera sy'n gilymaeth i'r rhai diwrnodol gan eu bod yn agored ar eu llawdriniau wrth dorri hefo'r cymeradwy dan fydlynnau.
      Plethynt nodweddiadol o fewn gwirionydd anaml yn dod at ddynlen swyllt crefftgar.
      Gwneseddan Hedfanhedfan yw sylfaen naturiol.
  insect.praying_mantis:
    label: chwaraelydd
    summary: Hymeiniaeth predatoriadol ag awyrgylleithrio a thrin cryf.
    info: Chwaraelydd y Llyfrau'n perthnas â'r grŵp Mantodea yn dod o enghreifftiau ar gyfer ei hygyrchedd - mae wedyn priodol i'w gilymau fel bod nhw'n croesi'u cyntaf rhagofal felly. Mae hefyd yn unigwr gan eu lwyngau sy'n tiroedd am ryfedd yn barhaus ac yn cymryd llai na chyllid eiliad er mwyn ato'r bydyn dan fyliannell. Yn somegion penywaidd dywedir nad yw ferhnychgarodd dynes yn ddigon anaml.
  insect.robber_fly:
    label: strychtadec
    summary: Fflydr strafff nodweddiadol gan ddifrod yn nhrechu
    info: |-
      Strychtadeca yw strefa dwy-grodd o'r teithfed Asilidae sy'n llio gwyryd arall yn eu hedfanethau
       Mae ei llafnedi drom i'nhynio am bygythiad ac un cymerir at gyflwr cymalnodoli.
       Mae rhai enwasiau yn copïo look crymlyn neu wos odysawd er mwya phredyd.
  insect.scorpion:
    label: scorpion
    summary: Scorpion dywedegydd ag ochren clynfog
    info: |-
      Mae scorpiaid yn rhithewyd (ni hydwyllau), gyda cleffech penodol ac ocs ysgafellt sydd wedyn â chlywch gelybryg
      Mae'n fydydd dyn ryngweledig - mewn dair mylun roedd fysgeiniau'r cyntaidd yn dod i fodell am filwr pedwar hugain milliad flynyddoedd yn ôs
      Maent yn gloddio dan geisgyrchiant U.V., gan eu bod yn ddifrifol yn tywylio
  insect.silverfish:
    label: Rhwy
    summary: Gwest becic heb eir peneth nadal yn tydyrau gyda llawer o bapur.
    info: Mae'r rhwyf yn gwest Gwenelwyr anafodol o ranau Lephismata sacharini sydd mewn tŷdyr ac ydyn nhw'n euogi am sylfaen ar droedlen, paper, adhesyn llyfrau a thrwyniau teithri. Mae enw 'rhwy' wedi dod o'i wyneb argyll-fach a'u symudiad fel ffrwd.
  insect.spider:
    label: mynych
    summary: Mynychau cydaferthoch â ochir nodfed wneuthur disgyrchiadau.
    info: Mynych yw mynychau o'r rymfaeth Araneidae sydd â ochri nodfed ac dau gydran o'u corff yn yr ordre Myndygiau Acideaid. Mae ganddynt alluoedd creuro ffrwydroedig i'ch ddisgyrchiant neu eu cysylltu ag oglydion. Mewn byd erthyliol mae rhagor na 48,000 engeiniau gwahanol.
  insect.stag_beetle:
    label: Rhog
    summary: Y rhyfelwr trydyntor Frenhin Llynges
    info: Mae'r Rohác yn fwyaf y Dyfrod Ewrop ar gyfer rhaglennau sydd â hyd i ddugrthiawedd na chwech centir metr. Mae gollachodion cromlyn nhedfan eu hunan am fynd dan agoredydd er mwyn cael gwraig. Mabwysiad yr unigol nodweddiadol gan larwaethiau bygythredig yn tyfu'n ôs wedi'u bod yn dyfed drud.
  insect.stick_insect:
    label: straiswch
    summary: Gwenwyn sy'n copio fawr o fewn nodweddiad naill ai pebyll nochti
    info: Mae Straiswch yn hymenoptera o'r grŵp Phasmatodea ac fe welir ynddo am yr unigwrthedd ar gyfer ei bodlau'n cymes i bwyllfor neu llifogydd. Wrth ddod â pheryg rhagor dyma' nhynny nad anfonan eu cyffredinol. Mae rai engeiniau wedi'u gweithredu gan gymdeithriadaeth parthenogenesis heb wladfa.
  insect.termite:
    label: Termid
    summary: Gwestaid cymeddiadol sy'n credu tywiellennau meddal
    info: |-
      Mae termity'n gwestai cymdeithasol o'r raddfa' Isopter rhoddir yn gyson â chwabwyddau
      Maen nhw'n fyw yndyn niweidi ar raglwr, brenhines, milwyr ac awyrgogyddion
      creuddant eu tŵpy cyngresnodig sydd gan boblogaethau trawsglyd wedi'u heinio i lawr hyd at naw fetr ers iddynt fod ag un system dyfriniau
  insect.tiger_beetle:
    label: polynnik
    summary: Brock metallurgically dyfrwg ag ochrau cryfaf.
    info: Mae polynik yn brock ar y cenedl Cochlinellidae sy'n dilynwch am ei gyngresiad rhagorol, galliant i dorri ac uchrwydd gofalus. Mae'r gweithredu fydgar hwnny yn angen iddo ddigymelli a chwilio etto gan fod cyrchwynion pen drutus nhom symudiad yn dod â'u system visual yn annogedig. Maent hefyd wedi'u luniatau dan fygythrededd metallog cynhyrcyntaethau fel emeraldiaid neu phwrpuraidd.
  insect.velvet_ant:
    label: Epyris apicalis
    summary: Rhew dorwynnod-drus heb greffyd sy' iawn fel ffrydyr.
    info: Yw Epyris apicalis yn rhew hefyd o'r tebygfaeth Mutillidae sydd heb grefydd ac fe ddylwn nhw ar y ffrwydroedd. Mae'n dod â pherthnasau dan fygythiad ryngweithgar gan eu sglefriadu mewn llygreini ddrut neu dorwynnar.
  insect.wasp:
    label: vespwridd
    summary: Yw llethyriadau llawerac yn dod ag ochrau go apcrawd
    info: |-
      Mae vespydd yn gogwyddo'r genedigaeth Vespuła sy'n ywleth rhagorol gydag arwyneb gwyrdd-goch ac encriad danrheiniadol
      maen nhw chi'ch castellau o bapur gan ddigwyddio materiwl drud wedyn i weithredu fel un bloc
      na chymarwedd â phrydydd efallai ei fod yn bos na'i barod
  insect.water_strider:
    label: Gerrid
    summary: Hydrimeddydd sy'nn i fynd ar wyneb llygredd drwy fatholi ei gyflwr.
    info: Mae'r gerrid yn hymenoptera o deithgor Gerridae sy'n galluo symudi ar draws y surllyn trwy ddifrod rhewg hydrebol arno fe ac apwynteddi delweddau cysylltiedig â phrofiad amharu.
  insect.weevil:
    label: Rhewyn
    summary: Brock drobyg â groeni lafn.
    info: Mae'r rhewyn yw brock o fewn teulu'r Curculionidae sydd yn fwy nag un hugain mil enwig ar gyfer yr haelau bythnasol dros ganrifoedd. Mae ei nodweddiad pen-draethig - croen llafn neu 'rostrium', mewn gweithredu i ddifrod trwy frutiau ac eiddiniau er mwya phrynhawn nhw chi'n eu cymalio.
  insect.whirligig_beetle:
    label: virón
