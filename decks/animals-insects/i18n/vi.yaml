lang: vi
pivot: false
title: Côn trùng
cards:
  insect.ant:
    label: kiến
    summary: Loài côn trùng nhỏ sống thành đàn.
    info: Kiến là loài côn trùng tạo ra các đàn lớn với sự phân chia công việc rõ ràng.
  insect.bee:
    label: včela
    summary: Sâu ong có sọc vàng đen, thụ phấn cho hoa và sản xuất mật ong.
    info: Ong mật là loài côn trùng xã hội sống trong tổ và thu gom dịch hoa. Chúng đóng vai trò quan trọng trong việc thụ phấn thực vật đồng thời tạo ra mật ong.
  insect.butterfly:
    label: bướm
    summary: Sâu bọ bay có cánh lớn màu sắc rực rỡ.
    info: Bướm là một loại sâu bọ với hai cặp cánh phủ vảy, thường có màu sắc nổi bật.
  insect.dragonfly:
    label: vážka
    summary: Sâu bọ có thân dài và hai cặp cánh trong suốt.
    info: Vážka là loài côn trùng săn mồi với thị lực tuyệt vời, thường săn mồi gần các vùng nước.
  insect.ladybug:
    label: bọ hung
    summary: Con bọ nhỏ tròn màu đỏ có chấm đen.
    info: Bọ hung là một loại bọ nhỏ ăn rệp và rất hữu ích trong vườn.
