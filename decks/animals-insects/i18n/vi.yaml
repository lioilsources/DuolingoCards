lang: vi
pivot: false
title: Côn trùng
cards:
  insect.butterfly:
    label: bướm
    summary: Một loài côn trùng biết bay với đôi cánh lớn nhiều màu sắc.
    info: Bướm là côn trùng có hai đôi cánh phủ vảy, thường có màu sắc rực rỡ.
  insect.bee:
    label: ong
    summary: Một loài côn trùng vàng-đen thụ phấn cho hoa và làm mật.
    info: Ong mật là côn trùng sống thành xã hội, sống trong tổ và thu thập mật hoa.
  insect.ladybug:
    label: bọ rùa
    summary: Một con bọ nhỏ tròn màu đỏ với những chấm đen.
    info: Bọ rùa là loài bọ nhỏ ăn rệp và có ích trong vườn.
  insect.dragonfly:
    label: chuồn chuồn
    summary: Một loài côn trùng thân dài với hai đôi cánh trong suốt.
    info: Chuồn chuồn là loài săn mồi có thị lực tuyệt vời, săn mồi gần mặt nước.
  insect.ant:
    label: kiến
    summary: Một loài côn trùng xã hội nhỏ sống thành đàn.
    info: Kiến là loài côn trùng tạo thành những đàn lớn với sự phân công lao động.
  insect.beetle:
    label: bọ cánh cứng
    summary: Bọ cánh cứng tạo thành bộ côn trùng lớn nhất, với hơn 400.000 loài đã được mô tả.
    info: |
      Bọ cánh cứng thuộc bộ Coleoptera và chiếm khoảng 40% tổng số loài côn trùng đã được mô tả.
      Chúng được nhận ra nhờ đôi cánh cứng che phủ (cánh cứng) giấu đôi cánh bay thật sự bên dưới.
      Bọ sừng hươu là loài bọ cánh cứng lớn nhất châu Âu; con đực có hàm khỏe giống như gạc.
      Bọ cánh cứng sống ở hầu hết mọi môi trường, từ vùng nhiệt đới đến vùng Bắc Cực.
  insect.grasshopper:
    label: châu chấu
    summary: Một loài côn trùng biết nhảy với đôi chân sau dài và tiếng kêu rả rích.
    info: |
      Châu chấu là côn trùng thuộc bộ Cánh thẳng với đôi chân sau khỏe cho phép nhảy xa gấp hai mươi lần chiều dài cơ thể.
      Con đực tạo ra âm thanh đặc trưng (tiếng ma sát) bằng cách cọ chân vào cánh.
      Châu chấu ăn cây cỏ và khi tập trung thành đàn lớn có thể phá hoại mùa màng.
  insect.cricket:
    label: dế
    summary: Một loài côn trùng sống về đêm, nổi tiếng với tiếng gáy của con đực.
    info: |
      Dế mèn là côn trùng sống về đêm thuộc bộ Cánh thẳng.
      Con đực gáy bằng cách cọ hai cánh vào nhau để thu hút con cái và đánh dấu lãnh thổ.
      Ở châu Á, dế từ lâu đã được nuôi làm thú cưng vì tiếng gáy của chúng.
      Trong nhiều nền văn hóa, dế còn là biểu tượng của sự ấm cúng trong nhà và may mắn.
  insect.mosquito:
    label: muỗi
    summary: Một loài côn trùng hai cánh; con cái hút máu và có thể truyền bệnh.
    info: |
      Muỗi là côn trùng hai cánh thuộc họ Culicidae.
      Con cái hút máu động vật để lấy protein cần cho sự phát triển của trứng; con đực ăn mật hoa.
      Muỗi truyền các bệnh nguy hiểm như sốt rét, sốt xuất huyết và zika.
      Trên thế giới có hơn 3.500 loài muỗi.
  insect.fly:
    label: ruồi
    summary: Một loài côn trùng hai cánh rất phổ biến, có thể lây lan vi khuẩn.
    info: |
      Ruồi nhà là loài côn trùng hai cánh phổ biến nhất trong nhà ở của con người.
      Đôi mắt kép cho phép nó nhìn gần 360 độ quanh mình.
      Ruồi lây lan vi khuẩn vì nó đậu cả trên rác lẫn trên thức ăn.
      Ruồi chỉ có một đôi cánh hoạt động; đôi cánh thứ hai (chùy thăng bằng) giúp giữ thăng bằng khi bay.
  insect.moth:
    label: bướm đêm
    summary: Họ hàng sống về đêm của bướm; bay về phía ánh sáng và có râu hình lông vũ.
    info: |
      Bướm đêm là các loài cánh vảy sống về đêm; khác với bướm ngày, khi đậu nghỉ chúng xếp cánh dọc theo hai bên thân.
      Nhiều loài bị ánh sáng nhân tạo thu hút.
      Tơ tự nhiên có được nhờ ấu trùng của bướm tằm.
      Bướm mặt trăng (luna) là một trong những loài bướm đêm đẹp nhất thế giới.
  insect.caterpillar:
    label: sâu bướm
    summary: Ấu trùng của bướm; ăn lá và chuẩn bị hóa nhộng.
    info: |
      Sâu bướm là giai đoạn ấu trùng của bướm và dành phần lớn cuộc đời để ăn lá nhằm tích trữ năng lượng cho quá trình biến đổi.
      Một số sâu bướm có màu sắc rực rỡ để cảnh báo kẻ săn mồi rằng chúng có độc.
      Khi hóa nhộng, nó tạo thành một cái kén (nhộng), nơi diễn ra quá trình biến thái hoàn toàn thành con trưởng thành.
  insect.praying_mantis:
    label: bọ ngựa
    summary: Một loài côn trùng săn mồi với tư thế cầu nguyện và cú tấn công nhanh như chớp.
    info: |
      Bọ ngựa là côn trùng săn mồi thuộc nhóm Mantodea.
      Nó có tên như vậy nhờ tư thế gập đôi chân trước lại như đang cầu nguyện.
      Nó là bậc thầy săn mồi; ra đòn và tóm lấy con mồi trong tích tắc.
      Con cái đôi khi ăn con đực sau khi giao phối, dù điều này không phải lúc nào cũng xảy ra.
  insect.stick_insect:
    label: bọ que
    summary: Một loài côn trùng bắt chước cành cây hoặc chiếc lá một cách hoàn hảo.
    info: |
      Bọ que thuộc nhóm Phasmatodea và là bậc thầy ngụy trang; cơ thể nó bắt chước cành cây hoặc lá một cách hoàn hảo.
      Khi gặp nguy hiểm, nó đứng yên hoàn toàn.
      Một số loài sinh sản bằng trinh sản, tức là không cần con đực.
      Chúng là thú cưng ngoại lai phổ biến nhờ dễ chăm sóc.
  insect.firefly:
    label: đom đóm
    summary: Một loài bọ phát ra ánh sáng phát quang sinh học để thu hút bạn tình.
    info: |
      Đom đóm là loài bọ thuộc họ Lampyridae có thể tạo ra ánh sáng lạnh (phát quang sinh học) ở bụng.
      Con đực và con cái phát sáng theo các kiểu khác nhau để nhận ra và thu hút nhau.
      Ánh sáng được điều khiển bởi phản ứng hóa học giữa luciferin và luciferase.
      Đom đóm là dấu hiệu của môi trường trong lành.
  insect.wasp:
    label: ong vò vẽ
    summary: Một loài côn trùng đốt màu vàng-đen xây tổ bằng giấy.
    info: |
      Ong vò vẽ thông thường là côn trùng đốt thuộc nhóm Vespula với màu cảnh báo vàng-đen đặc trưng.
      Nó xây tổ bằng giấy từ bột gỗ đã nhai.
      Khác với ong mật, ong vò vẽ có thể đốt nhiều lần.
      Nó có ích như một loài điều hòa tự nhiên của côn trùng gây hại.
  insect.cockroach:
    label: gián
    summary: Một loài côn trùng nhanh nhẹn, sống về đêm, ăn tạp; rất bền bỉ và dễ thích nghi.
    info: |
      Gián là một trong những loài côn trùng bền bỉ nhất thế giới; nó sống sót qua bức xạ và những điều kiện có thể giết chết các loài khác.
      Có hơn 4.500 loài, nhưng chỉ khoảng 30 loài sống gần con người.
      Gián là loài côn trùng cổ xưa; gián đã tồn tại hơn 300 triệu năm và sống sót qua thời khủng long.
      Gián nhanh nhẹn và có thể chạy hơn 5 km/h.
  insect.spider:
    label: nhện
    summary: Một loài nhện tám chân giăng lưới để bắt côn trùng.
    info: |
      Nhện là loài hình nhện (không phải côn trùng) thuộc bộ Araneae với tám chân và cơ thể chia làm hai phần.
      Nó có thể tạo ra tơ để giăng lưới săn mồi hoặc bọc kén trứng.
      Trên thế giới có hơn 48.000 loài nhện.
      Mọi loài đều tạo ra nọc độc, nhưng phần lớn vô hại đối với con người.
  insect.scorpion:
    label: bọ cạp
    summary: Một loài hình nhện có nọc độc với càng và chiếc đuôi cong chứa độc.
    info: |
      Bọ cạp là loài hình nhện (không phải côn trùng) với đôi càng đặc trưng và chiếc đuôi cong kết thúc bằng ngòi độc.
      Đây là loài vật cổ xưa; những hóa thạch bọ cạp lâu đời nhất có tuổi hơn 430 triệu năm.
      Trong bóng tối, chúng phát huỳnh quang dưới tia cực tím.
      Trong khoảng 2.500 loài, chỉ khoảng 25 loài nguy hiểm với con người.
  insect.centipede:
    label: rết
    summary: Một loài nhiều chân với một đôi chân trên mỗi đốt cơ thể.
    info: |
      Rết thuộc lớp Chilopoda và có một đôi chân trên mỗi đốt cơ thể (không phải một trăm chân như tên tiếng Anh gợi ý).
      Nó là loài săn mồi nhanh nhẹn, bắt côn trùng, giun và động vật có xương sống nhỏ.
      Đôi chân đầu tiên đã biến thành móng độc để làm tê liệt con mồi.
      Một số loài nhiệt đới dài hơn 30 cm.
  insect.flea:
    label: bọ chét
    summary: Một loài ký sinh biết nhảy nhỏ xíu hút máu động vật có vú và chim.
    info: |
      Bọ chét là côn trùng không cánh thuộc bộ Siphonaptera, chuyên sống ký sinh.
      Đôi chân sau khỏe cho phép nó nhảy xa hơn 150 lần chiều dài cơ thể.
      Nó hút máu động vật có vú và chim, và có thể truyền bệnh; trong lịch sử, bọ chét đã phát tán bệnh dịch hạch.
      Bọ chét là những nghệ sĩ nhào lộn của thế giới côn trùng.
  insect.termite:
    label: mối
    summary: Một loài côn trùng xã hội xây những gò khổng lồ bằng đất.
    info: |
      Mối là côn trùng xã hội thuộc nhóm Isoptera, họ hàng xa của gián.
      Chúng sống thành đàn với vua, hoàng hậu, lính và thợ.
      Chúng xây những tổ mối phức tạp, ở vùng nhiệt đới cao tới 9 mét, với hệ thống thông gió riêng.
      Là những loài phân hủy gỗ quan trọng, chúng đóng vai trò then chốt trong các hệ sinh thái nhiệt đới.
  insect.bumblebee:
    label: ong nghệ
    summary: Một loài ong lớn nhiều lông với tiếng vo ve trầm; là loài thụ phấn quan trọng.
    info: |
      Ong nghệ là côn trùng lớn nhiều lông thuộc chi Bombus, họ hàng của ong mật.
      Nó là loài thụ phấn quan trọng, đặc biệt ở những vùng khí hậu lạnh hơn nơi ong bay ít hơn.
      Nó có thể tự sưởi ấm bằng cách làm rung cơ bay, nhờ đó bay được ngay cả trong giá lạnh.
      Ong nghệ hiền hơn ong vò vẽ và chỉ đốt khi bị đe dọa trực tiếp.
  insect.hornet:
    label: ong bắp cày
    summary: Loài ong vò vẽ lớn nhất châu Âu với ngòi khỏe và tiếng vo ve lớn.
    info: |
      Ong bắp cày là loài ong vò vẽ xã hội lớn nhất châu Âu và dài hơn 3,5 cm.
      Nó xây tổ bằng giấy trong hốc cây hoặc dưới mái nhà.
      Ngòi của nó dài hơn ngòi ong vò vẽ và vết đốt đau hơn, nhưng ong bắp cày chỉ tấn công khi bị đe dọa trực tiếp.
      Nó là kẻ thù săn mồi quan trọng của các côn trùng khác.
  insect.cicada:
    label: ve sầu
    summary: Một loài côn trùng nổi tiếng với tiếng kêu inh ỏi vào những ngày nóng.
    info: |
      Ve sầu là côn trùng thuộc liên họ Cicadoidea, nổi tiếng với một trong những âm thanh lớn nhất trong tất cả côn trùng.
      Con đực tạo âm thanh bằng những màng đặc biệt (màng rung) ở bụng để thu hút con cái.
      Một số loài ở Mỹ có chu kỳ phát triển mười bảy hoặc mười ba năm.
      Ấu trùng sống nhiều năm dưới đất và ăn rễ cây.
  insect.locust:
    label: châu chấu di cư
    summary: Loài châu chấu di cư tạo thành những đàn tàn phá lên tới hàng triệu con.
    info: |
      Châu chấu di cư là một loài châu chấu, trong những điều kiện nhất định tạo thành các đàn di cư khổng lồ.
      Một đàn có thể lên tới hàng tỷ con và trong một ngày phá hủy mùa màng trên hàng nghìn héc-ta.
      Ở các nước châu Phi và châu Á, châu chấu trong lịch sử là một trong những thảm họa nông nghiệp lớn nhất.
      Trong Kinh Thánh, chúng là một trong mười tai họa của Ai Cập.
  insect.aphid:
    label: rệp vừng
    summary: Một loài côn trùng chích hút nhỏ xíu trên thân cây; tạo ra dịch mật.
    info: |
      Rệp vừng là những côn trùng chích hút nhỏ thuộc liên họ Aphidoidea, ăn nhựa cây.
      Chúng tạo ra dịch mật ngọt, nhờ đó kiến chăm sóc chúng để đổi lấy sự bảo vệ.
      Chúng sinh sản cực nhanh; một con cái có thể tạo ra hàng trăm triệu con cháu trong một năm.
      Chúng là loài gây hại quan trọng cho cây trồng nông nghiệp.
  insect.earwig:
    label: bọ đuôi kìm
    summary: Một loài côn trùng thân dài với cặp kìm ở cuối bụng.
    info: |
      Bọ đuôi kìm là côn trùng thuộc bộ Dermaptera, được nhận ra nhờ cặp kìm (đuôi kìm) ở cuối bụng, dùng để phòng vệ và giao phối.
      Tên của nó trong một số ngôn ngữ bắt nguồn từ mê tín rằng nó chui vào tai người; đó chỉ là chuyện hoang đường.
      Bọ đuôi kìm cái khác thường vì chúng chăm sóc trứng và ấu trùng non, điều hiếm gặp ở côn trùng.
      Chúng sống trong khe nứt, dưới đá và trong lớp lá mục.
  insect.silverfish:
    label: con nhậy
    summary: Một loài côn trùng không cánh nhanh nhẹn, thấy trong nhà gần sách và giấy.
    info: |
      Con nhậy là côn trùng không cánh nguyên thủy thuộc bộ Zygentoma, sống trong nhà ở.
      Nó ăn tinh bột, giấy, keo đóng sách và sợi vải.
      Tên của nó bắt nguồn từ màu bạc và cách di chuyển giống cá.
      Nó thuộc một trong những bộ côn trùng cổ nhất và sống gần như không đổi hơn 300 triệu năm.
  insect.water_strider:
    label: con gọng vó
    summary: Một loài côn trùng đi trên mặt nước nhờ sức căng bề mặt.
    info: |
      Con gọng vó là côn trùng thuộc họ Gerridae có thể đi trên nước nhờ những sợi lông kỵ nước ở chân và sức căng bề mặt của nước.
      Nó săn những côn trùng rơi xuống nước, nhận ra chúng qua rung động trên mặt nước.
      Nó nhanh nhẹn và có thể lướt trên nước hơn 150 lần chiều dài cơ thể mỗi giây.
  insect.dung_beetle:
    label: bọ hung
    summary: Một loài bọ lăn những viên phân, được tôn kính ở Ai Cập cổ đại.
    info: |
      Bọ hung thiêng là loài bọ thuộc họ Scarabaeidae, nặn phân thành viên và lăn chúng đi để chôn và đẻ trứng vào trong.
      Ở Ai Cập cổ đại, nó là biểu tượng của mặt trời và thần Khepri.
      Nó là một trong số ít loài vật định hướng theo Ngân Hà.
      Nó giúp tái chế chất dinh dưỡng và làm thoáng khí cho đất.
  insect.stag_beetle:
    label: bọ sừng hươu
    summary: Loài bọ cánh cứng lớn nhất châu Âu; con đực có hàm giống như gạc.
    info: |
      Bọ sừng hươu là loài bọ cánh cứng lớn nhất châu Âu và dài hơn 7 cm.
      Con đực có đôi hàm khổng lồ giống gạc, dùng trong các cuộc chiến giành con cái.
      Ấu trùng sống tới 7 năm trong gỗ sồi mục và ăn nấm.
      Nó bị đe dọa nghiêm trọng do sự biến mất của những khu rừng già và gỗ chết.
  insect.atlas_moth:
    label: bướm atlas
    summary: Một trong những loài bướm đêm lớn nhất thế giới, cánh trang trí hoa văn hình rắn.
    info: |
      Bướm atlas là một trong những loài bướm đêm lớn nhất thế giới, với sải cánh tới 30 cm.
      Đầu mút cánh của nó có màu sắc giống như đầu rắn, khiến kẻ săn mồi sợ hãi.
      Con trưởng thành không có miệng và hoàn toàn không ăn; chúng chỉ sống vài ngày.
      Nó đến từ những khu rừng nhiệt đới Đông Nam Á.
  insect.weevil:
    label: mọt vòi
    summary: Một loài bọ nhỏ với chiếc vòi kéo dài đặc trưng.
    info: |
      Mọt vòi là loài bọ thuộc họ Curculionidae, họ động vật lớn nhất thế giới với hơn 60.000 loài.
      Chiếc vòi kéo dài đặc trưng (rostrum) dùng để khoan vào hạt, quả và thân cây.
      Một số loài là loài gây hại nông nghiệp nghiêm trọng, như mọt vòi bông.
      Các loài khác chuyên biệt trên một loài cây duy nhất.
  insect.lacewing:
    label: bọ cánh gân
    summary: Một loài côn trùng mảnh mai với đôi cánh gân trong suốt; ấu trùng săn rệp.
    info: |
      Bọ cánh gân là côn trùng thuộc họ Chrysopidae với đôi cánh mảnh, gân trong suốt và đôi mắt vàng óng.
      Ấu trùng là loài săn mồi và ngốn một lượng rệp khổng lồ, nhờ đó trở thành người bảo vệ tự nhiên của cây cối.
      Con trưởng thành ăn mật hoa và phấn hoa.
      Chúng bị ánh sáng thu hút và là dấu hiệu của môi trường lành mạnh.
  insect.crane_fly:
    label: ruồi hạc
    summary: Một loài ruồi lớn giống muỗi với đôi chân cực dài.
    info: |
      Ruồi hạc là côn trùng hai cánh thuộc họ Tipulidae, trông giống một con muỗi khổng lồ, nhưng nó không chích và không ký sinh.
      Đôi chân cực dài của nó dễ gãy rời; đó là một cơ chế phòng vệ (tự cắt bỏ).
      Con trưởng thành chỉ sống vài ngày và hoặc không ăn hoặc ăn mật hoa.
      Ấu trùng sống trong đất và ăn rễ cây.
  insect.mayfly:
    label: phù du
    summary: Loài côn trùng có đời sống trưởng thành ngắn nhất, chỉ vài giờ đến vài ngày.
    info: |
      Phù du là côn trùng thuộc bộ Ephemeroptera và là biểu tượng của sự phù du; con trưởng thành chỉ sống vài giờ đến vài ngày.
      Chúng không có miệng hoạt động và hoàn toàn không ăn.
      Ấu trùng sống từ 1 đến 3 năm dưới nước.
      Cảnh phù du bay thành đàn hàng loạt là một cảnh tượng thiên nhiên mê hoặc; trên sông Danube ở Hungary, đó là một hiện tượng độc đáo.
  insect.damselfly:
    label: chuồn chuồn kim
    summary: Họ hàng mảnh mai của chuồn chuồn; khi đậu nghỉ xếp cánh dọc theo thân.
    info: |
      Chuồn chuồn kim là côn trùng họ hàng với chuồn chuồn, nhưng mảnh mai hơn, và khi đậu nghỉ nó xếp cánh song song với thân, khác với chuồn chuồn lớn.
      Nó là loài săn mồi và bắt côn trùng nhỏ khi đang bay.
      Ấu trùng sống dưới nước và là một phần quan trọng của hệ sinh thái nước.
      Chúng là dấu hiệu của chất lượng dòng nước.
  insect.robber_fly:
    label: ruồi cướp
    summary: Một loài ruồi săn mồi tóm bắt các côn trùng khác khi đang bay.
    info: |
      Ruồi cướp là côn trùng hai cánh săn mồi thuộc họ Asilidae, tóm bắt các côn trùng khác ngay khi đang bay.
      Nó có đôi chân khỏe để tóm con mồi và chiếc vòi chích để tiêm nọc gây tê liệt.
      Một số loài bắt chước hình dáng ong nghệ hoặc ong vò vẽ để tự bảo vệ khỏi kẻ săn mồi.
      Nó có ích như một loài điều hòa tự nhiên các quần thể côn trùng.
  insect.ground_beetle:
    label: bọ chân chạy
    summary: Một loài bọ săn mồi nhanh nhẹn sống dưới đá và trong lớp lá mục.
    info: |
      Bọ chân chạy là loài bọ thuộc họ Carabidae; phần lớn các loài là loài săn mồi ban đêm hoạt động, bắt các côn trùng khác, giun và ốc sên.
      Chúng nhanh nhẹn và chạy trốn nhanh khỏi nguy hiểm.
      Một số loài, như bọ chân chạy tím, có ánh kim loại tuyệt đẹp.
      Chúng là dấu hiệu của đất lành mạnh và nền nông nghiệp tự nhiên.
  insect.tiger_beetle:
    label: bọ hổ
    summary: Một loài bọ nhanh nhẹn màu ánh kim với thị lực tuyệt vời.
    info: |
      Bọ hổ là loài bọ thuộc phân họ Cicindelinae, nổi tiếng với tốc độ phi thường, khả năng bay và thị lực sắc bén.
      Nó chạy nhanh đến mức phải dừng lại và định hướng lại, vì chuyển động quá nhanh đối với hệ thị giác của nó.
      Nó có thân màu ánh kim đẹp mắt (xanh lá, xanh dương, đỏ) và đôi mắt to.
      Ấu trùng đào những đường hầm thẳng đứng trong đất và rình con mồi ở miệng hang.
  insect.hoverfly:
    label: ruồi hoa
    summary: Một loài ruồi bắt chước màu sắc của ong vò vẽ và ong mật; loài thụ phấn của khu vườn.
    info: |
      Ruồi hoa là côn trùng hai cánh thuộc họ Syrphidae, bắt chước màu sắc của ong vò vẽ và ong mật để tự bảo vệ khỏi kẻ săn mồi (bắt chước kiểu Bates), dù nó không đốt.
      Nó là loài thụ phấn quan trọng; nó ghé thăm nhiều loài cây hơn ong.
      Con trưởng thành ăn mật hoa và phấn hoa.
      Ấu trùng của một số loài săn rệp và nhờ đó giúp ích trong vườn.
  insect.whirligig_beetle:
    label: bọ xoáy nước
    summary: Một loài bọ nhỏ xoáy tròn thành đàn trên mặt nước.
    info: |
      Bọ xoáy nước là loài bọ nước thuộc họ Gyrinidae sống trên mặt nước, và việc xoáy tròn thành đàn giúp nó tránh kẻ săn mồi.
      Mắt của nó chia làm hai phần; một phần nhìn trên mặt nước, một phần nhìn dưới nước.
      Nó cảm nhận những gợn sóng trên mặt nước báo hiệu thức ăn hoặc nguy hiểm.
      Ban ngày nó xoáy tròn, ban đêm nó bay.
  insect.louse:
    label: chấy
    summary: Một loài ký sinh không cánh nhỏ xíu sống trên da và lông của động vật có vú.
    info: |
      Chấy là côn trùng ký sinh không cánh thuộc bộ Phthiraptera, sống trên da vật chủ và trong lông hoặc tóc của nó.
      Nó hút máu và gây ngứa.
      Chấy đầu có mặt khắp thế giới và ảnh hưởng đến trẻ em bất kể điều kiện vệ sinh.
      Trong lịch sử, chấy đã truyền bệnh sốt phát ban và các bệnh khác.
  insect.bedbug:
    label: rệp giường
    summary: Một loài ký sinh dẹt hút máu vào ban đêm; ẩn trong khe nứt của đồ nội thất.
    info: |
      Rệp giường là côn trùng dẹt hình bầu dục thuộc họ Cimicidae, chủ yếu hoạt động về đêm.
      Nó cắn và hút máu vật chủ đang ngủ.
      Nó ẩn trong khe nứt của đệm, trong đồ nội thất và sau giấy dán tường.
      Vài thập kỷ gần đây, nó lan ra khắp thế giới nhờ du lịch quốc tế.
  insect.antlion:
    label: kiến sư tử
    summary: Một ấu trùng đào những cái bẫy hình phễu để bắt kiến trong cát.
    info: |
      Kiến sư tử là ấu trùng của một loài côn trùng thuộc họ Myrmeleontidae, đào những cái phễu hình nón trong cát khô.
      Khi một con kiến trượt vào bẫy, kiến sư tử tóm lấy nó bằng hàm và tiêm dịch tiêu hóa.
      Con trưởng thành không nổi bật, trông giống chuồn chuồn và bay về đêm.
      Ấu trùng có thể sống nhiều năm dưới đất mà không ăn.
  insect.goliath_beetle:
    label: bọ goliath
    summary: Một trong những loài côn trùng lớn và nặng nhất thế giới, từ châu Phi nhiệt đới.
    info: |
      Bọ goliath là một trong những loài côn trùng lớn nhất thế giới; con đực nặng tới 100 gram và dài hơn 11 cm.
      Nó sống trong những khu rừng mưa nhiệt đới của châu Phi xích đạo.
      Con trưởng thành ăn quả và nhựa cây.
      Ở châu Phi, trẻ em đôi khi giữ chúng làm đồ chơi, và một số được bán cho nhà sưu tập.
  insect.bombardier_beetle:
    label: bọ pháo thủ
    summary: Một loài bọ, để tự vệ, phun ra một hỗn hợp độc sôi nóng.
    info: |
      Bọ pháo thủ là loài bọ thuộc phân họ Brachininae tự vệ theo một cách độc đáo; nó trộn hai chất hóa học trong bụng, gây ra một phản ứng nổ ở nhiệt độ hơn 100 độ.
      Luồng hơi ăn mòn mạnh được phun ra với tiếng nổ lớn tới 500 lần mỗi giây.
      Nó là một trong những ví dụ hấp dẫn nhất về phòng vệ hóa học trong tự nhiên.
  insect.diving_beetle:
    label: niềng niễng
    summary: Một loài bọ nước săn mồi bơi dưới mặt nước.
    info: |
      Niềng niễng viền vàng là loài bọ nước săn mồi thuộc họ Dytiscidae, sống trong ao và vùng nước tù đọng.
      Nó bơi khéo léo nhờ đôi chân sau dẹt hoạt động như mái chèo.
      Nó thở ở mặt nước và trữ không khí dưới cánh cứng.
      Nó săn côn trùng, ấu trùng, cá nhỏ và nòng nọc.
  insect.velvet_ant:
    label: kiến nhung
    summary: Một loài ong vò vẽ không cánh màu cam-đen trông giống kiến.
    info: |
      Kiến nhung thật ra là một loài ong vò vẽ thuộc họ Mutillidae; con cái không cánh và trông giống kiến.
      Chúng có những sợi lông đỏ hoặc cam nổi bật để cảnh báo.
      Con cái có ngòi cực khỏe, biệt danh là kẻ giết bò.
      Chúng ký sinh trong tổ của ong nghệ.
