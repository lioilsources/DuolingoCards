lang: la
pivot: false
title: Insecta
cards:
  insect.ant:
    label: formica
    summary: Parva animalia sociale viventia in coloniis.
    info: Formica est parvum insectum sociale quod in coloniis magnis cum divisione laboris habitat.
  insect.bee:
    label: apis
    summary: Facies nigroflava flosculas pollinat et mel efficit.
    info: Apis mellifica est hymenoptera sociale apia domestica vivens et nectar collectans. Hoc animal flores pollet et mellis magnum copiam reddit.
  insect.butterfly:
    label: papilio
    summary: Insecta volans cum alis coloratis magnis.
    info: Papilio est insectum cum duobus pugillis squamularum alarum, saepe conspicue coloratum.
  insect.dragonfly:
    label: odonatus
    summary: Insecta cum corpore longo et duabus aliis alarum paribus transluentium.
    info: Odontates sunt insecta predatores cum excellenti visu, qui prope aquas caelantur.
  insect.ladybug:
    label: coccineus
    summary: Parvus globosus coccineus coleoptera cum punctis nigris.
    info: Coccineus est parvus insectum, qui vivit ex aphidibus et utilis est in horto.
