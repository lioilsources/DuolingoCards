lang: ur
pivot: false
title: کیڑا
cards:
  insect.ant:
    label: چھوٹا سماجی کیڑا جو آبادیات میں رہتا ہے
    summary: فامکائڈ فیملی سے تعلق رکھنے والا چھوٹا سماجی کیڑا۔
    info: چمچماتی ایک حشر ہے، جو بڑی آبادیات میں پایا جاتا ہے اور ان میں کام کی تقسیم موجود ہوتی ہے۔
  insect.bee:
    label: چکر
    summary: ہلکا سا کالا پیلا جانور ہے، جو فلوں کو بھی تازہ رکھتا ہے اور شہد بناتا ہے۔
    info: چکرا اجتماعی حشر ہوتا ہے جو خانقاہ میں رہتے ہیں اور نектار جمع کرتے ہیں۔ وہ پھولوں کو بھی تازہ رکھتے ہیں اور شہد بناتے ہیں۔
  insect.butterfly:
    label: کیڑا
    summary: پروں والے رنگین پر کیڑا
    info: کیڑا ایک حشرہ ہوتا ہے جس کے دو Coppie چمکدار پر ہوتے ہیں، عام طور پر خوبصورت رنگ میں۔
  insect.dragonfly:
    label: واژکا
    summary: ایک لمبی جسم کے حشرہ جو دو جوڑے شفاف پروں سے لگتا ہے۔
    info: واژکا ایک شکاری حشرہ ہوتا ہے، جس میں بہت تیز نظر کی صلاحیت ہوتی ہے، اور وہ عمومًا آبی علاقوں میں شکار کرتا رہتا ہے۔
  insect.ladybug:
    label: بروکس
    summary: چھوٹا، گول، سرخ کیڑا جس پر کالے داغ ہوتے ہیں۔
    info: بروکس ایک چھوٹا بروک ہے جو مچھروں پر خوراک حاصل کرتا ہے اور گھنٹی میں فائدہ مند ہے۔
