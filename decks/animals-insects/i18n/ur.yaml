lang: ur
pivot: false
title: کیڑا
cards:
  insect.ant:
    label: چھوٹا سماجی کیڑا جو آبادیات میں رہتا ہے
    summary: فامکائڈ فیملی سے تعلق رکھنے والا چھوٹا سماجی کیڑا۔
    info: چمچماتی ایک حشر ہے، جو بڑی آبادیات میں پایا جاتا ہے اور ان میں کام کی تقسیم موجود ہوتی ہے۔
  insect.antlion:
    label: مرکولائن
    summary: اس لاروا کا ذکر ہے جو چلنے والے چلو کو شن میں پانچ بنانے کے ذریعہ پکڑتا.
    info: مرکلیونٹس مچھروں کے لاروا سے تعلق رکھتا ہے جو خشک شن کے اندر اُگرائی حالت میں پانچ بنا دیتا ہے۔جب چلو نمودار ہوتا تو مرکولینڈز قبضہ کرتا ہے، اور آسانی سے غذا کے عصارہ کو داخل کردیتا ہے۔ بالغ فطرت میں زندہ واقعات کرنے والے ہوتے ہیں، جو درجۂ حرارت کے طرح مشابہ ہوتے ہیں، اور شب کے وقت پرواز کرتے ہیں۔ لاروا عام طور پر برقرار رہتے ہیں، مواد کے بغیر زمین کے تحت سالوں تک.
  insect.aphid:
    label: مَشِقُ
    summary: پودوں کی لمبی حصوں پر قابض چھوٹا حشرات؛ زخم کرنے والے عناصر بناتا
    info: چھوٹے پودوں کی شاخوں میں موجود اس حشرات سے نکلنے والا ترشح، جنہیں انگور کے خاندان سے منسلک دسترخواہ بنتا ہے۔ وہ درختوں کے رس سے غذائیت لینے والا ذرّاعظم حشرات ہوتا ہے۔
  insect.atlas_moth:
    label: مارتناتس ایتلاؤس
    summary: دنیا کا سب سے بڑا ماشرا مونجھ جو کہ درخشاں آفت کے نقشوں کے ساتھ فرشتوں کو شامل کردیتا ہے۔
    info: |-
      مارٹناتس ایتلاسس دوسروں کے سب سے بڑا مارچر مومن جوکہ بالغ حالت میں صرف تھوملگ انداز میں نمایاندہ رہتا ہے۔
      اس کے پنجروں کے آخری حصے درندہ طرز کی تصاویر بنائے ہوتے ہیں، جو شکار کرنے والوں کو روکنا چاہتے ہیں。
      بالغوں کے منفعت لینے والا عضو موجود نہیں ہواور وہ خود غذا نہیں کرتے؛ بلکہ فقط بعض دنوں زندہ رہتے ہیں۔
  insect.bedbug:
    label: تِّرَ
    summary: رات کو خون لینے والا؛ عمومًا داخلی حصوں میں چھپ جائے
    info: |-
      گھریلو شکار کا تیرہ جو خون پینے والے حشرات سے متعلق اس قسم کا ذمابند وحشتناک بچنے والا، رات کو فعال ہوتا ہے۔
      اس نامساعد وقت میں آرام کرنے والے ماخذ کے خون کا استعمال کرتا ہے。
      ایسا عام طور پر موٹروں، دسترخوانوں اور عمارتوں کے درمیان موجود سوراخوں میں چھپتا ہے۔
  insect.bee:
    label: چکر
    summary: ہلکا سا کالا پیلا جانور ہے، جو فلوں کو بھی تازہ رکھتا ہے اور شہد بناتا ہے۔
    info: چکرا اجتماعی حشر ہوتا ہے جو خانقاہ میں رہتے ہیں اور نектار جمع کرتے ہیں۔ وہ پھولوں کو بھی تازہ رکھتے ہیں اور شہد بناتے ہیں۔
  insect.beetle:
    label: بروق
    summary: برواق حشرات کے سب سے بڑے اورڈر کا تشکیل دینے والا ہے جس میں ۴ لاکھ سے زائد تفصیلات دینے والے ذرات شامل ہیں
    info: بُروک کوئلیاپٹرا اورڈر میں آتا ہے، جس سے تمام تفصیلات دینے والے حشرات کے قسموں کا لگ بھગ چار فیصد وابستہ ہوتا۔ ان پر زمیندار طاقتور بالائی علاقوں (ایلوترام) موجود رہتے ہیں، جن کے نیچے حقیقی پرواز کرنے والا بالائی حصّہ چھپا رہتا ہے۔ خنزیر کانفٗش درخت کا سب سے لمبا یوروپی بِرون؛ مرداغ کے مضبوط ہالکڑی کے شاخوں کے ساتھ ہوجاتا ہے۔ وہ تقریباً تمام حالتوں میں موذون ہواور ٹרופس سے لوکلائزڈ مناطق تک پائے جاتے ہیں。
  insect.bombardier_beetle:
    label: ستروفليك ديؤ
    summary: بروق جو بوائل توکسيك مخلوط کشمش کرتا ہے۔
    info: |-
      سٹریولک دئے کا ایک بروچ، جو براسنینائے سب فملی میں شامل ہوتا ہے۔ واقعی منفرد طور پر خود کو تحفظ حاصل رکھتا ہے: ذرا لگاتار دونوں شمیمی مواد کو تالوا میں ملایا جاتا ہے، جس سے درجۂ حرارت ١۰۰°س سے زائد واپس نتیجہ ہوجاتا ہے。
       بالغ حد توکسس قسم کی دھواں 498x فریق فرمیاندہ آواز کے ساتھ فائر کردی جاتی ہے۔
       یہ صحت عامہ کے علاقوں میں موجود تمام غیر متوقع اندازوں میں سے ایک ہے۔
  insect.bumblebee:
    label: چملاء
    summary: ایک لمبی بالوں والی مبارک انفجار کے صحت مندانہ نظام کا حصّہ
    info: |-
      چملاک ایک بڑا بالوں والے کنارہ جس میں Bombyx نامی قسم شامل ہوتا، دھماکہ خورد ورلڈ سے تعلق رکھتا۔
      یہ فصلوں کو پالتو بنانے والا حشرات ہے، خصوصًا زیادہ درجۂ حرارت کے علاقائیں جہاں آواز لگتی ہے。
      اس کے پرواز کرنے والے مشینوں کو شدید حرارت سے استحصال کرتا ہے، تو ٹھندرا موسم میں بھی پرواز کرسکتا ہے۔
  insect.butterfly:
    label: کیڑا
    summary: پروں والے رنگین پر کیڑا
    info: کیڑا ایک حشرہ ہوتا ہے جس کے دو Coppie چمکدار پر ہوتے ہیں، عام طور پر خوبصورت رنگ میں۔
  insect.caterpillar:
    label: ہوؤسنکا
    summary: ایک کیڑے یا موٹل کی لاروا؛ وہ پتّے کھاتی ہے اور آمادہ ہجوم کرنے کی تیاری کرتی ہے
    info: ہوئسینکا کیڑے مکھی یا موٹل کی لاروا ہوتی ہے اور وہ زندگی کا براجمان حصّہ پتوں کے خوردبرخورد سے گزارتی ہے تاکہ جسمانی انقلاب کے لیے طاقت حاصل کر سکے۔ بعض ہوسنکائیں شدید رنگ دار ہونے والی قاتلانہ صفت کی نشاندہی کرتی ہیں۔ جب وہ بالغ ہوجاتی ہے تو اُس وقت چربال (Chrysalis) بناتی ہے، جس میں متامافرسس شامل ہوتا ہے۔
  insect.centipede:
    label: ستونوازا
    summary: '''ستونوازا'' ہر قسم کے تن آثار میں ایک زوج ног فراہم کرتا ہے۔'
    info: چلوپوڈا کی اقسام میں سے ایک جانور، 'سٹونواز' بدن کے ہر حصّے پرایک زوج الگ شامل رکھتا ہے۔ نام کے باوجود ان کی تعداد صدِٗ لازم تو واقعی موجود نہیں۔ یہ حشرات، لمبوں اور دنگل والے جانوروں کا شارب ہوتا ہے۔
  insect.cicada:
    label: چکادا
    summary: حشرات جو گرم دنوں میں شدت کے ساتھ گلوخ کے معروف گانا گایا
    info: "چکاڈا کیڑے مار سپر آرڈر سائسداوئلہ جن مشہور ہوتے ہیں، ان تمام حشرات میں اب تک زوروں پر دھواں نکال رہے گرم دنوں میں۔\nمرد براجمان خصوصی طاقت والی بلینکس (ٹمبلز)، وائل فرشتہ لائن کے ذریعے عورتوں کو متاثر کرنے کے لۓ صدائیں بناتے ہیں。\nامریکی موسمياتی نظام میں بعض قومیں سترہ سالہ یا تیرہ سالہ ترقیاتی حلقوں کے تحت شامل ہوسکتی ہیں۔ \nناول (نمفاس) درختوں کے جذروں پر غذا کرتے ہوئے زمین کے نیچے سالوں گزارتا ہے۔"
  insect.cockroach:
    label: شوآب
    summary: رات کے وقت فعال عام طور پر غذا کے علاوہ تمام چیزوں کو کھونٹا، بڑی حد تک مستحکم اور موافق.
    info: |-
      چکن دنیا کے سب سے زبردست حشرات میں سے ایک ہے؛ وہ تابکاری اور ان حالات پر بھی جینے کی صلاحیت رکھتا ہے، جو دوسروں کو ختم کردیتے۔
      4500 سے زائد قسمیں موجود ہیں لیکن محض 30 آدمیوں کے قریب رہائش اختیار کرتی ہیں。
      humans کے قریب
      ان کی عمر قدامت نمایندگی کرتی ہے - شواحب بالآخر 300 لاکھ سال قبل وجود میں آئے اور ڈائناسائرس کو ذرا بھی متاثر نہ کرسکے۔
  insect.crane_fly:
    label: تِیُلوَلْکَا
    summary: ایک لمبا موٗشکا مثل مچھر جس کے بہت لمبے ہاتھ ہوتے ہیں
    info: "تیولکا دو بالہ مچھر کے خاندان تپولاڈئ سے تعلق رکھتا ہے، جس نظر آنے والے اور عظیم الشان زرد وار بعینگل شبیه ہوتا ہے لیکن ٹٹڑاور پراشنسکا نہیں۔\nاس کے لمبائی کے حوالے سے قدروں فرشتوں کے انداز میں الگ ہونے والا حصّہ؛ یعنی ذاتی طاقت کے تحفظ کے عمل (خود تنوع)، شامل ہوتا ہے。\nبالغ ذرات صرف بعض وقت تک زندہ رہتے ہیں اور غذا قبول نہیں کرتے یا شربت استعمال کرنے کے تحت زندہ رہتے ہیں۔ \nذاتی مرحلے (دراطومرم) مختلف مقامات مثلاً زمین میں موجود ہوتے ہیں اور درختوں کی جڑوں پر مشتمل غذا اختیار کرتے ہیں۔"
  insect.cricket:
    label: چھوٹا کرکڑ
    summary: رات کا جانوروں والا حشرہ جو مردوں کے تنظيمى چلاتے ہيں
    info: چھوٹا کرکڑ اورتُپٽرا حشرات کے آؤنڈ میں شامل رات کا جانوروں والا حشرہ ہوتا۔ مرد نسل دودھ پلائش سے خواتین بلبند و علاقہ قائم کرنے کے لئے الگ ترانہ بجاتے ہیں۔ ایسيا میں، لوگوں نے قدامتِ دروازه والے چمتوں کو ان کے غزل کے باعث روایتي طور پر چلا کرتے ہیں۔ مختلف ثقافات میں، وہ عام گرمجوشی اور شادمان حالات کا نمائندہ بن چکے ہیں۔
  insect.damselfly:
    label: شیدلٹکا
    summary: واجکا کا نازک رشتہ دار؛ آرام کرتے وقت اپنا بدنسمت پروں کے ساتھ روایت کردیتا ہے
    info: شیدلٹکا، واجکوں کے قریب رشتہ دار حشرات میں سے ایک نازک جانور ہوتا ہے۔ آرام کرتے وقت اس کے پروں کو بدن کے موازی طور پر تھام لیتا ہے، جن کے مقابلے میں واجکا مختلف ہوتی ہے۔ شیدلٹکا فضائی تعاقبت میں چھوٹے حشرات کا شکار کرنے والے شکاری ہوتا ہے۔ ان کے نمفو براعظم میں زندگی گذارتے ہیں اور دریاوں کے نظام ماحول کا ضروری حصّہ ہوتے ہیں۔ وہ دریاؤں کی صفائی کے معیارات کا ماخذ بھی بن سکتے ہیں。
  insect.diving_beetle:
    label: بوتانوا
    summary: زير水面 حرکت کرنے والا جانور
    info: پوٹاپنیک ويلكى جانور اس ديتيسچيدے خاندان سے تعلق رखتا ہے، جو درياه کشمش ميں پائے جاتے ہين۔ اس نسيت والے بروک کے موذٗر فرشتوں والا شكل ہوتا ہے جو بالشتون جيان عمل کرتا ہے، جبکه يادگار طريقة سے زير水面 حرکت كرنے ميں مدد كرتا ہے۔ اس وقت اس کا آسمان حلقتي سطح پر ليا جاتا ہے اور اس کے تحت چھترية ذخیرہ کردئي جاتي هين۔ اس قسم کا جانوروں ان کے غذا ميں مختلف شاملات مثل چوبند، لاوار، چھوٹي ماچلي اور ضربة استعمال كرتا ہے؛ اور دونوں حالات ميں، زير水面 اور شب ميں، مشغول رهيته ہے۔
  insect.dragonfly:
    label: واژکا
    summary: ایک لمبی جسم کے حشرہ جو دو جوڑے شفاف پروں سے لگتا ہے۔
    info: واژکا ایک شکاری حشرہ ہوتا ہے، جس میں بہت تیز نظر کی صلاحیت ہوتی ہے، اور وہ عمومًا آبی علاقوں میں شکار کرتا رہتا ہے۔
  insect.dung_beetle:
    label: وْربُؤَٗن
    summary: قديم مصر ميں عبادت گذاري والا بروك
    info: وہربرون عبادت کا ایک جانور، سارابےائڈئے خاندان میں شامل ہوتا ہے۔ وہ بچھڑن لاتوں کو بالوروں کی شکل دینے اور انہیں تراشنا پسند کرتا ہے۔ قديم مصر ميں يہ سورج اور حضرت كهفرى کا نمائندہ تصور کيا جاتا رہا۔
  insect.earwig:
    label: چکور
    summary: '''چکور'' ایک لمبا موذٗن حشرہ ہوتا ہے جس کے پُلوں کے آخر میں خصوصی ناخنا شامل ہوتے ہیں۔'
    info: "چکور ایک حشرہ جانو کے تدریسی درجہ 'ڈرماپٹرا' سے وابستہ ہوتا ہے، جن میں پشت کے آخر میں دفاع اور زادوقت بسر کرنے والے خاص ناخنوں(سلائسس) موجود رہتے ہیں۔\nاس لفظ کا آغاز لوگوں کے کانوں میں داخل ہونے کی غلط فرضیات سے ہوا؛لیکن یہ بالکل باطل قرار دیا جا چکا ہے。\n\nحیرت انگیز طور پر عروسوں کی ماں حضرمتوں کا مرغوبہ ہوجانا اور ان کی مندملاروں کی جانب سے دیکھ بھال کرتا ہے،جو عام حشّرات میں مشترک نہیں۔ \nعام طور پر وہ شققوں، سنگموں کے تحت اور پتوؤں کے ذخائر میں مقام اختیار کرتے ہیں۔"
  insect.firefly:
    label: سوال توشكا
    summary: بروق جو باہمی تفاعل کے لئے بلومائننسنٹ روشنی پیدا کرنے کی قابلیت رکھتا ہے۔
    info: سولتوشکا جو لامپیرائیڈے کی فملی سے تعلق رکھتا ہے، اور پٹخ مچانے والے بروک کے طور پر مشہور ہے۔ وہ خاص نوعیت کے دماغ کے ذریعے درجۂ حرارت نہ بدلنے والا روشنی پیدا کرتا ہے۔ مردوعورتوں دونوں مختلف نقشوں کے ساتھ روشنی چلتی ہے تاکہ ان کا تعاقب آسان بنایا جاسکے۔ یہ لوئفرازین اور لوئفرزن کی شیمیاوی رد عمل کے تحت حاصل ہوتا ہے۔ سولتوشکا زندگی کے نظام کی صفائی کا علامت ہے۔
  insect.flea:
    label: بلواچہ
    summary: ایک درجۂ بالا الٗسوار کشمشما کھاتا ہے حیوانات اور طوطی
    info: چکرہ سیفوناپٹیرا کے آؤڈر میں شامل ایک بزنس ناطح جانور ہوتا ہے، جو پارازائیتک زندگی ترجیح دیتا ہے۔ ان کे مضبوط عقبی قدموں کی وجہ سے وہ اپنی لمبائی کے 150 گنا فاصلہ قوم کرتے رقصید ہیں۔ چکروں کھاتے ہیں حیوانات اور طوطیوں کا خون اور بیماریوں کا ذخائر بن سکتے ہیں؛ تاریخی طور پر چکرے بلاء کا منتقل کرنے والے ثابت ہوئے۔ چکراں کمڑوں کے دنیا کے ماہر حرکتوں ہوتے ہیں
  insect.fly:
    label: مچھرا
    summary: ایک عام دوصفت والی فلائی جاندار جو بیماری کے خطرناک جراثیم کو منتقل کرسکتی ہے
    info: گھریلو مچھروں کا سب سے عام دو پہن بکٹیریا منتقل کرنے کی صلاحیت رکھتا ہے۔ اس کی مرکبات آنکھیں تقریباً ٣۶۰ درجہ وار جائزہ لینے کی اجازت دیتی ہیں۔ یہ ضائعات اور غذا دونوں پر قطع نظر، باقاعدہ طور پر انفرادی حملہ کرتا ہے۔
  insect.goliath_beetle:
    label: گولِاش
    summary: افریقہ کے گرم الائنس کے جنگلوں کا ایک سب سے بزرگ اور موثرتر حشرات
    info: گولیاش عظیم اس دنیا کے سب سے بڑھکر حشرات میں شمار ہوتا ہے؛ مرد نمونوں کا وزن تقریباً ١۰٠ گرام تک پہنچ جاتا ہے، ان کی لمبائی ١٢ سینٹی میٹروں سے زائد رہتی ہے۔ وہ مناسب آفتابی لالچ والے درختوں کے غارق فلسفۂ قطبی خطوط کے افریقا کے جنگلات میں پایا جاتا ہے۔ بالغ حالت میں یہ خشخاش اور درخت کی رسدوں پر عملدرآمد کرتے ہیں۔ بعض وقت چودھرا تو لوگوں کے طرح یہ حشرات افریقہ میں بطور玩具 پالے جانے والے ہوتے ہیں، بعد میں وہ جمع کرنے والا شخصوں کو فروخت کردئے جاتے ہیں。
  insect.grasshopper:
    label: چھوپڑا
    summary: لمبوں پروں اور شوروغوغا کاری معائنہ کردہ چھوپڑا
    info: چھوپڑا ارتُہورٹِرا کے آرڈر سے تعلق رکھنے والی مخلوق، جس کे لمبے پیر انقلابات لانے کیلئے استعمال ہوتے ہیں۔ مرد حشرات نال برقع قسم کی آواز دینے کے لئے اپنا بازو زمین پر رگडتے ہیں۔ وہ غذا کے طور پر فصل کاشت کرنے والا ہوتا ہے؛ بڑی تعداد میں موجود تو محصول کو خطرہ بن سکتا ہے۔
  insect.ground_beetle:
    label: ستروفليك
    summary: پانچوں حصوں کے نشتر اور درختوں کے ٹُکڑوں میں رہنے والا تیزرفعت قتل عام کردہ بروچ
    info: سٹریولک کارابائڈ فملی سے تعلق رکھنے والا ایک بروچ ہوتا ہے؛ ان میں زیادہ تعداد نو شام کے وقت حرکت پذیر قاتلین شامل ہیں جو دوسرا حشر، ذرات اور حلزون صاف کرتے ہیں۔ وہ تیز گوشوارے ہوتے ہیں اور خطرے سے دور لمحہ آفریں طرح بھاگ جاتے ہیں۔ بعض اقسام مثل 'فائلوم' بالخصوص متوازن عمارت اور موسمی کشاورزم کے معاملات کا تعاقب کرنے والے غذا کے نظام کے تحت موجود ہوتے ہیں۔
  insect.hornet:
    label: سرشن
    summary: یوروپ کا سب سے بڑا کاچھرہ ہے جس کے قوی ٹارسنڈ اور بلند آوازنزاں ہوتا ہے۔
    info: سروشن عام ایک سماجی کاچھرہ ہے جو تقریباً ٣،۵؍سم لمبائی تک پہنچتا ہے۔ وہ درختوں میں خالی نلسوں یا گوداموں میں کاغذ کے بنا دسترخواں بناتا ہے۔ آئرنز انعام کا طول زائد ہوتا ہے اور حملہ شدید غصّہ والانظریہ ضربت فراہم کرتا ہے لیکن صرف وقت ضلعی خطرہ کے موقع پر حملہ کرتا ہے۔
  insect.hoverfly:
    label: پیسٹرنکا
    summary: ایک موشک جو ووس اور عسل مچھروں کے رنگ کا نقل کرتا ہے، جوند کا لالچ کا ذرائعٴ
    info: "پیسٹرنکا سرفسائڈے خاندان کا دو پروں والا جنتر ہوتا ہے، ووس اور عسل مچھروں کے رنگ کا نقل کرتا ہے تاکہ شاربین (باتوزوفسکا مشملا) کے مقابلے میں حفاظت کرسکے۔\nاس لالچ کا بڑا ذرائعٴ فراہم کردہ؛ مختلف قسم کے غذات سے زائد آمدنی کرتا ہے。\n بالغ لوگوں کو انحلل اور باقاعدہ طرح سے استعمال ہوجاتا ہے۔ \n بعض قسم کے جوانوں کو مچھروں کا شکار کرنا، جوند درختوں میں مدد فراہم کرتا ہے۔"
  insect.lacewing:
    label: زرد آنکھ
    summary: شفاف نالوں والے پرواز؛ لاروا درخت کیڑوں کو قابض.
    info: زلاٹوؤچکا کیڑے مار جانور اس خاندان سے تعلق رکھتی ہے، ان کے شفاف نالوں والے پرواز حلقے بنتے ہیں۔ لاروا دشمن فصل کیڑوں کو قتل کرتی ہیں اور بالغوں غذائیت کم وسائل پر زندگی گزارنے والا طبیعیاتی نظام بنایئے۔
  insect.ladybug:
    label: بروکس
    summary: چھوٹا، گول، سرخ کیڑا جس پر کالے داغ ہوتے ہیں۔
    info: بروکس ایک چھوٹا بروک ہے جو مچھروں پر خوراک حاصل کرتا ہے اور گھنٹی میں فائدہ مند ہے۔
  insect.locust:
    label: کربݨيل کوليو
    summary: کربݩال کوليو دے لوڊز لاکھين شخصيتون شامل.
    info: "کوبلیلکا سٹیہواواس فارس کوبھر لاءٗ اصل وندي، جيڪه خاص حالتن هيٺ ويجهري موبيلن مچرن بڻائي ٿو۔\nmچرو هزارين ماڻهن تان مشتمل ٿئي ۽ ٻير حصيداريءَ ذريعي روزاني بيورو پيدا ڪري سگهي۔ \nافريقوي ۽ آسياتي علاقي تاريخي طور زراعتي نقصان جون اندر بهترين حدود قائم ڪيا آهن۔"
  insect.louse:
    label: چکر
    summary: مخصوص بے پرواز حشرات، جو موذنوں کی چربد اور بالوں میں موجود ہوتا ہے۔
    info: چکر ایک بے پروانہ جگل کا حشرات، فتھیرپٹرا درجہ سے تعلق رکھتا ہے۔ وہ میزبانوں کی خون شاخ داغدار یا بالوں میں زندہ رہتا ہے۔ چکر خون نوش ہوتا ہے اور تنخواہندا لطمات عطا کرتا ہے۔ عام طور پر چکر باشیدار (سر کا چکر)، تمام دنیا میں مشترکہ ہے اور بچوں کو متاثر کرتا ہے، صفائی ستھائی کسی قسم کی حالتوں کو مدّنظر رکھے بغیر۔ قدامت پسنہ دوران ان کے ذریعہ ٹائفوس اور دیگر بیماریاں منتقل کی جایا کردی گئیں۔
  insect.mayfly:
    label: جیبس
    summary: حشرات میں سے وہ جو کمزور عمر والی شخصیت کا مظہر ہے، فقط چند گھنٹوں لے دنوں تک زندہ رہتا ہے۔
    info: جیپس جو افتمروبریرا کے حشرات میں سے ایک قسم ہے، فانوسنگ کا علامت بھی ہے؛ بالغ ان تقریباً صرف چند گھنٹوں لے دنوں تک زندہ رہتا ہے۔ وہ غذا نہیں خوراک لوتو ہوتے کئیونکہ ان کا نظام ذائقہ درست طریقے پر موجود نہیں ہوتا۔ ان کے نمفو آبی حالات میں ١ سال لے ۳ سال تک زندہ رہتے ہین۔ جیبس کا عام شمارنا طبعی منظر ہے؛ ماڈاراس میں دوناؤ ندی میں ان کا مشترکہ روشنائی واحد طرز عمل ہے۔
  insect.mosquito:
    label: کانار
    summary: دو پروں والا حشر؛ مادا خون چوساتا ہے اور بعض وقت غداری بیماریاں منتقل کرسکتا ہے
    info: کانار دو پروں والا کیڑا اور فملی کولسائڈے سے تعلق رکھتا ہے۔ ان مادگی کنچل جماعتوں کی خون نوشی کرتی ہے، جب کہ مرد بقولرین کا استعمال کرتے ہیں۔ وائرسز مثلًا مالیريا، زکا اور دونجئے سمیت متعدد بیماریاں کاناروں کے ذریعے منتقل ہوتی ہیں۔ تمام دنیا میں لگ بھગ ٣۵۰۰ قسم کے مختلف کانار موجود ہیں۔
  insect.moth:
    label: مور
    summary: شب کا حرمت؛ روشنی کے ذریعے پرواز کرتا ہے اور بالوں کے مشابہ ہوتا ہے۔
    info: مُور نیچر کے لپیدوٹیرا آرڈر سے تعلق رکھنے والے شب بہار مڑدروں ہوتے ہیں، جبکہ دن کے وقت پرواز کرنے والے مومن ان کے مقابلے میں درختوں پر قائم اس طرح خاموشی اختیار کرتے ہیں۔ بعض اقسام صاف ستھرا روشنی ضرب عطا کردینگی۔ حشرات الہندوازم کی وجہ سے فطرتی رسماں وجود میں آتا ہے۔ ماونلائٹ مور زمین پر موجود تمام موروں میں سے سب سے شاندار و شخصیت والا ہوتا ہے۔
  insect.praying_mantis:
    label: کودلنکا
    summary: درندہ حشّرات مع عبادت خصوصیت اور الٗقت برائے حملہ
    info: |-
      کُدلاں کا نام مانٹوڈیئن جماعت سے تعلق رکھتی اس درندہ حشرات پر مشتمل ہوتا ہے۔
      اس کا نام، دعا کرتے وقت استعمال ہونے والی قدروں والا آگے کے لباد وجوذ کرنے کی وجہ سے چلتا ہے。
      ایک شکار کا ماہر ہے؛ فوراً برقی طاقت کے ساتھ حرکت کر کے ذرا سی فرصت میں قربانی کو زیر کر دینا۔
  insect.robber_fly:
    label: ستِّرَچُواݢْتَا
    summary: جناح بردار درندگی موشکلات فضاء میں حرکت کرتے ہوئے دوسرا حشرات سمیتو
    info: سٹریچاکتا اصلائیدے خاندان کا دو پروں والا شکاری جنتر ہوتا ہے، جو فضا میں موجود دوسرا حشرات صاف طور پر لڑھکتے وقت تلاش کرتا رہتا۔اس کे مضبوط قدموں سے وہ نشانہ بآسانی قبضہ میں لا سکتا ہے اور زہر انفوجرار کرنے والا بازو بھی ہوتا ہے۔ بعض اقسام بلیمپلز یا عدسوں کے مشابہ منظر عام پذیر کردی جاتی ہیں تاکہ شکاریوں کے مقابلے میں تحفوں کے ذرائع بنایا جا سکے۔
  insect.scorpion:
    label: سکورپیون
    summary: جہلانوالا سَواݙِن جاندار جدوں قابض ذراعات اُچل رہندی۔
    info: "سکورپیون ایک س旁ن جاندار (چھوٹا نہیں) کے طور پر تعرّف دیت‏ ، جد واجد مخصوص قبضے والی زنجیر توڑنے والا ذراعات اُچل رہندی ۔\n اندازناً ٤۳ء لاکھ برس قدیم فاسائل موجود ہن۔ \n آگ لگائݨ والی روشنی تحت اینہارڈ شعاعيں خودروشحۃ ضبط کرن۔"
  insect.silverfish:
    label: رائبنکا
    summary: خانۂ بندی میں کتب اور کاغذ کے قریب پالتو چلتا ہوا حشرات
    info: رائبنکا زیگنٹوما کے حشرات کے اقسام میں سبز وارش جو خانہ بندی میں پایا جاتا ہے۔ ان کا غذا آردھ، کاغذ، کتابوں کا لچڑّوا علاقوں اور ریشمی تاروں پر مشتمل ہوتا ہے۔ نام فرشتہ مثل شکل اور حرکت کی وجہ سے دیا گیا۔
  insect.spider:
    label: پاؤک
    summary: آٹھ بازوؤں والا چوہا، حشرات کو صید کرنے کے لئے فرشتوں کی تشکیل.
    info: چوہا ایک جرثومے کا حشرات نہیں، بلکہ آرنائس سے تعلق رکھتا ہے۔ ان میں دنگل والی قوت موجود ہوتی ہے جس سے وہ شکار پانے یا منڈولوں کو بند کرنے کے لئے فرشتہ بناتے ہیں۔ تمام دنیا میں 48,000 سے زائد چوہا کے مختلف النوع وجود موجود ہیں۔
  insect.stag_beetle:
    label: روہاچ
    summary: اورپ کا سب سے بڑا کیون؛ مردوں کے منڈبل حشرات کے شاخدار حصّے
    info: روہاچ عام اورنکو سب سے بڑا کیون جس میں لمبائی ٧ سم تک پہنچتی ہے۔ مردہ درختوں کے لگانے والے قسم کے فطری مواد میں روزمرہ زندہ رہتا ہے، خصوصاً نارنج کھمبات میں۔ وہ مشترکہ ذخیرہ آلو دشمن طاقت کے باوجود انٹرنسز کے علاقوں میں موجود قدیم جنگل کے غائب ہوجاتے ہیں۔
  insect.stick_insect:
    label: ستراشيلكا
    summary: ایسا جانورو جو درخت کی شاخ یا پتّہ کی نقل کرتا
    info: سٹراشیلکا فاسماتوڈے کی اقسام سے تعلق رکھنے والی جانور ہے، ممثليت کا ماہر؛ اس کا بدن بالکمل طرح شاخوں یا پتوؤں کی نقل کرتا۔ خطرے کی حالت میں وہ بالکلا حرکت سے محروم رہتا ہے۔ بعض قسمیں مردہ وجود کے بغیر آبادگاری کرنے والا ہوتا ہے۔ ان کو غذا لازمی نہیں چونکہ وہ عام طور پر عجیب دلوں کے ذرائع سے زندہ رہنا مشکل نہیں
  insect.termite:
    label: ترمت
    summary: سوشلس حشرہ جو قبرستان کی مثل بالشت سے بُنان
    info: |-
      ٹارمیت سوسکا اس کرپن جو مل، بادام، انڈے والے دانت والا حشرہ شامل ہوتا۔ وہ راجا، محلہ، فوجدار اور محنت کش لوگوں کے شراکت پر زندہ رہتا ہے。
       وہ تھوبڑ نالیاں بناتا ہے، جو کبھی ۹ متائر بلند ہونچ جائین، اور ہوا کے نظام کے ساتھ۔
       درخت کے لَدّان ختم کرنے والے طاقتور عناصر کے طور پر وہ مناسب موسمی نظام میں مرکزی عنصر ہوتا。
  insect.tiger_beetle:
    label: بولنِک
    summary: ایک متغائر رنگ والا تیز روشن کچرا جس کی نزاکت عام ہے
    info: پولنیک اس کچرے سے تعلق رکھتا ہے جو فاسٹ، پرواز کرنے والی صلاحیت اور شدید نظر کا مالک ہوتا ہے۔ وہ بڑی آسانی سے دبلا توڑ دیتا ہے لیکن واپس حیرانگی ختم کرتا ہے کیونکہ حرکت انداز قدرتی نظام کے لئے زیادہ تیز ہوجاتی ہے۔ اس کا بدنا بالخصوص مومندار طرح سے رنگین ہوا ہوتا ہے (سبز، نیلام، سرخ)، اور عظیم آنکھیں ہوتی ہیں۔ اس کی لمبریاں زمین میں عمودی ڈوب کر غار بنائیں اور دروازوں میں موجود ہمارے مقابلے کے منتظر رہتی ہیں۔
  insect.velvet_ant:
    label: |
      مرغچیک سمیٹوف
    summary: آؤرانج بلون کا ذرا سا سفید بالدار چمگوڑا جو چمگادروں کی طرح دکھائی دیتا ہے
    info: "چمگوڑا سیٹن کے خاندان ملٗتيليدائے سے تعلق رکھتا ہے؛ اس فصل نامعلوم جسم والی عورتوں کی طرح دکھایا۔\n ان پر لال یا آلومند شپاتی برش موجود ہوتا ہے، جو انتباہ کرتا ہے。\nعورتیں غیرمعمولی قدر میں مضبوط زہردار حشرات کا استعمال کرنے والا 'بقری قتل' کا عنوان حاصل کئے ہوئے ہیں۔ \n وہ چولاس کے ڈنکوں پر تعطل کشی کرتے ہیں۔"
  insect.wasp:
    label: وزا
    summary: زرد اور کالے جہلاولو کیڑا جو کاغذ کے بالائج تعمیر کرتا ہے
    info: وزا عام ایک جہلادار کیڑا، وسپولا نامی قسم سے تعلق رکھتا ہے۔ ان میں زرد اور کالے رنگ کا خاص تحفظ موجود ہوتا ہے۔ وزوں پتّاس دانہ لئے برقوق کاغذ کے شکلوں والے بالائج بناتی ہیں۔ فرقت حشرات کم کرنے والا طبیعی تناسب برقرار رکھنا، ان کا ذرا سا فائدہ مند عمل ہے۔
  insect.water_strider:
    label: vodoměrka
    summary: سطح توانائی کے ذریعے پانی کی سطح پر چل سکنے والے کیڑے
    info: وادومرکا ایک کیڑا جس میں سطح تانگشن کے استعمال سے پانی کی سطح پر چلنے کی صلاحیت حاصل ہوتی ہے۔ ودودمروں کے ناخن، آب فوبک بالوں کی وجہ سے ان کے قدموں پر لخت بنا رہتا ہے۔
  insect.weevil:
    label: نواسٗ
    summary: چھوٹا بُراک جس کی لمبی منٹھڑی واقعی خاص طرح کی ہوتی ہے۔
    info: |-
      نوساتیک کرچولئونائڈس فملے سے تعلق رکھتا ہے، جو دنیا بھر میں انسانوں کی نسلوں کی وجہ سے پیدا شدہ عظیم الشان خطرناک حشرات میں شامل ہوتا ہے۔
      ایک لمبی انگلی والی منٹھڑی (روستروم)، جو مختلف قسم کے فالتوں، پودوں اور درختوں کو سوراخ کرنے کام آتی ہے。
      بعض اقسام زراعت کے لحاظ سے غیر ضروری ہوجاتی ہیں، مثلًا بالغ نوزاتیک
      دوسری اقسام صرف ایک قسم کے پودوں پر اختصاص کرتی ہیں۔
  insect.whirligig_beetle:
    label: وائرنِک
    summary: ایک درجۂ بالغ برُوز کا جانورو، جو پانی کی سطح پر گول گول موڑ بنا کر چلتا ہے
    info: ویرنیک ود کا ایک جانور ہے، جس میں بروچ فملی سے تعلق رکھتا ہے۔ گرائنائڈئے خاندان کا عضو ہونے کے ناطے، یہ پانی کی سطح پر زندہ رہتاتا ہے اور حفاظت کے لیے دشمنوں سے دور رہنے کے مقصد سے آباداریاں بناتا ہے۔ ان کی دونوں آنکھیں الگ الگ حصوں میں تقسيم ہوتی ہیں؛ ایک حصہ پانی کے اوپر موجود چیزوں کو دیکھتا ہے تو دوسرا حصہ پانی کے تحت موجود چیزیں دیکھتا ہے۔ وہ سطح پر حرکتوں کی طرف متوجہ ہوا جو غذا یا خطرے کی جانب اشارہ کرتا ہے۔ دن کے وقت وہ گردش کرتا ہے، شب کو پرواز کرنے لگتا ہے。
