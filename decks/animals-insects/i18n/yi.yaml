lang: yi
pivot: false
title: עמעשיגלן
cards:
  insect.ant:
    label: mrevn
    summary: Kleiner sozialer nymlivendike yn einer Kolyenie.
    info: '"Mrevn" iz di nymol mit arbetsteilung un groyse koloenies.'
  insect.antlion:
    label: מראווเคลב
    summary: די לאר베 וועלכע ברענגט נאדולענע נענס פאר מאסק'לס אין סנד.
    info: דער מראווקלעיב איז די לערבע פון ען שפעציעס אין דעם משפחה מיירמעלאנטידאה וועלכע באלעצט קאנישטע נאלוועקעס אין טרעך סנואו. ווען איינע מאסק'ל רעלץ אויס צו דער פעסטיגקייט, מעגליך ער זיין דורכאווס געווארן דורך די באשטייקונגען און אנגעזוך טרייצונג שאפטן.
  insect.aphid:
    label: מייסט
    summary: נייפענען ווי פלאנז'ן לאדיגעס; פרודузירן מדמד.
    info: מישענען זינד נאך גרויסער וואס אפידעאוידзе, די שטעלן זיך אויף פלאנצן סטעם'ס און עכץ מיט דעם שאף צו טרעפן די פלויזש溅.זיי פרודוצירן שוועיער מאעדאוויץ, וועלכן מענטשן האבן קיין בעפריייג אין אייבערגעגנעצייט פאר באזוך.זיין רעזראאטיוונס ערשיינדן באלקאמ אנדרוקליכ; איינע פרייליקע מיוטשל חתולות קאנען ארבערטן הונדערטלעך מיאליונים פון נאקעמען.
  insect.atlas_moth:
    label: אט拉斯מאל
    summary: Ein פון די גרösטע מאורער אין דער וועלטל מיט פלאגים וואס זענען בעצעיכנט מיט ח蛟图案.
    info: '"Atlasmotyle" iz ein fun di gréisere nachtlekhe maurer yn der wועל מיט פלאגן וואס קענען רעקן ביז צו דריי זש''טערמער לנג. די ענדיגונגען פון איר פלעגעל סיי געווענטיק אנצוטרעפן נאכ האדן שפיץ אין אויסשטילונג אזוי אז מעגליך טאריפאנטערן ווערט מאכן אייעם נישטא לעבן. ערווקסנעם היינען ניין מקדמאך און באזוקן נичес''. זייער לאבעראייט אלץ פון די טרופעס יעדאסיא.'
  insect.bedbug:
    label: שטינענע
    summary: פאראזיט אזואס דעס בעקעמט לעבן און הארט זיך אין די ריסן פון מעبل.
    info: די שטינענע דאמאכיע איז עטליכע פלאך אוועל ני מישפּוץ אין די משפחת צימיקידע פעקטיוו באנוצן וויילס טאקעמער קיין נענטער ס вечארהאט זייערע גאסטענשאפ. ער באדזיגט און שאפט דעם בלוט פונעם שויבנדיגן גäsטעפל. ער הארט זיך איין אין די ריסן פאן מאטריץ, מעבלע און טייפייט.
  insect.bee:
    label: bee
    summary: A groyser yidisher term farnummen arbet unt med.
    info: '"Bee" iz di shuldnim tsemelekhter vos farbleibt un nektar sammelt.'
  insect.beetle:
    label: ברוק
    summary: ברייך פארגלייצן די greatest שורה פון חיותי עם מער אז 400,000 בא שאפנע ענטלאפט.
    info: די בראון פällt אין דער קאלעאפעטארה שורה און מאכט וועגן מיט בערך 40% פונעם געוועלף באשreibן די ענקליכקייט פון חיותי מעשים. זיי האבן טורדיגע כרסיים צו די לעוויסלעך (עליאטראה) אויפ'ן טייל פון וואס סינדן די ראיין לוייקנדיגע לעוויסלעך. די אליע נייטשער ברוכק איז די größטע איירופאישע ברוך; ער האט מächtיגע קרני ים.
  insect.bombardier_beetle:
    label: streblitz dzhelosteretski
    summary: A brucklakh shoys boilende toksishe mishpeyleg als verdediyung.
    info: Bruchlakh Streblits Dzelostreltsiki iz di unike metode vu fartheid mit kemishe stoff fun yidriger heymtelekheykh keynmol; er mischt tsvey kemische sostave oyf dem tsekhen, vos ervirt naye shvartshe rekhtungen meh opshpringt mi miln grad C. Di hoiker toksisher damp geys afgefeyet geshriekene klang bis zu 500-mal pro Sekunde.
  insect.bumblebee:
    label: בוuibעס
    summary: געוואלץשטענדיגע בענע מעטליכע באזינגל
    info: בומבס רוד צו וואס איז פארוואונדן מיט די ביען אין דער נאך מאכטיגע באמער קליימאט ווערט געווארנעם אויפ'ן ספעציעלע טרעיבונג דורכאויס שטייסט זיין לעבן ערלויבן צולאזן צו הא岑 צייט אזויילג ענטפערדיקע בענען
  insect.butterfly:
    label: motyl
    summary: Fliegendes Insekt mit großen gefärbten Flügel.
    info: '"_motyle" iz af di grupp fun insekt mit geshpilte flegln un meistens gefernte farbige fluegeln.'
  insect.caterpillar:
    label: häusenkä
    summary: די לארבע פון איין טילג'ל איבער מאך
    info: האוסענקי איז די לאר베 פון עינעם צוויגלער נייפט אויף דאס וואס ער זיך מעגליכ קוקלאייטן מיט געלב אנציק סטעפונדאנגענע באגרווענדונג האבן
  insect.centipede:
    label: štanožeke
    summary: מאני לעבענדיקע ארטרופאדן מיט איינעם פאר נאהגן אויף יעדע באלקאמפל.
    info: שטנוגעפיגער ארטרופוד מיט איינעם פאר נאכגענען אויף יעדע סegment אין די קאלמער גרייס וואס לויבט צו שטייערן עינווייונדזשעס, ווארמס און קלענעלע באסיילענטע. דער erfטע פאר נאגה זיין אנגעהועבן אלץ טוקסיסצחה נעך אזוי מעגליך צו פרלעזירן די פרייז. טייפישע טראפיקאנע ערשיין האבן לייכט מאסק' פעקטן.
  insect.cicada:
    label: צאיקהדן
    summary: געווארמער ת
    info: ציקאדה איז עטליכע קיין מיטל פון ציידאויעדאה וואס זינן בעליבט דורך איין פון די לאודסט געזונגען אין אלץ די בענקלער. מאנטשן פרוועזירן נאטורלייך שטייגנדע טים באלויפטע ספעציאלנע בלאנקעס (טאימבאלאס), אויף אז'זי'ה'אן', האבן מעגליך 70 יארlijכע אбо 65 יארlijכע לעבנסצעקלייס; די נאמף פאזע נעמט פיל יארן אנדרעם ערעדע און ארבעט עלעקטריש.
  insect.cockroach:
    label: shvalb
    summary: A scharfe nachtlekh af alles essende insekte mit hoher widerstandskraft.
    info: |-
      Der shvalb iz ein fun de meist unzerbrecheleksten insekten op der erd; es hot zich duerfend genuch vu stralung und bedingungen dorop dazugehert wos vil andre tieren geven hobben villeert
      Mehr vi 4,500 arbn gitten, aber nor umringht 30 leben naymen ap di yerst.
      Es iz an altes insekt - shvalbes beston mear vei 300 milliyener yor, farveltn di dinosaurussen.
  insect.crane_fly:
    label: טיפולקה
    summary: גרייסע קאמאראבאלנדיגע谬שקה מיט באזוודער לางע בענצלב.
    info: '"טיפולקה" איז עין צוויי פלאמעליגע שפעקער מיט דעם טיףוליידאי משפחה וואס גלייצן אויבר קאמארס אין אייערע ايינפלוסשונג, נישטא ביסם אדער פרוועגן. זייער באזונדער לאנגע בענקלעס האבן די eigenschaft אז זיי ברעכן לייכט פעקטיק - מעגליך אלץ מאכטליך ספאנגענעג לעבענissen. דורכצופילטע ערווקסן נענען נאך פון רוטעלען.'
  insect.cricket:
    label: грилос
    summary: נאכטליכער באמענש פרוגלאזשאט דורכאויס מסירות השראה על ידי ריחוקי המין.
    info: גרילוס פארטאלעך איז נאכטליכער באמענש מיטן אורٿאפטערא ערלויג. מענטשן טרענע זייער פלעצער צו איינאנדער וואס אנצוטעלן די שוויסן אויבערגעגונגען דורך סימפלעס און געדעקליך קול אין ענדיקע לעבן.איןアジア, גרילאס האבן איר ארבעט אלץ מאלא יוניוען ביי חיות הובלה.
  insect.damselfly:
    label: zing
    summary: Eine זינדליכע רעלאטיוון פונעם דרייפלווייונג מיין'ס פליידער ערמאבערן
    info: A זילבר איז געוויסן צו וואיגלס פארמער מיטגלאדער, נאכגעבווענשטענדיקער אויב דאס קאלט אין די באנדן שטייערט סיי אנצוטרעך מאכן מיטן קויף, שווארצע באזוך טראפץ עלעלעמס ענטהקט מעגליך צו לאמפלענעמען.
  insect.diving_beetle:
    label: פארטאטאן
    summary: דראווענדיגע וואסן מיטל סווה עלנג.
    info: פארטאפנישער איז דראווענדיגע וואסן מיטל פון די משפחה דייטיסקיידзе צוליב אין סווים ענטוואוס אדמער קיין בלאם ווייניק. ער שווייף גלייך אויפגעהאלפן דורכ' זייענע פלויכע נאך בעין אזוי ווי רודעלס. ער טרעפט אייך אויף די באאם און האльт שווארצע אנגעמאקונגן טיילן. ער הייסט מאסק יינגעלע, לארפארמאנגען, קלענעם fishes אפילו קרפטע; ער אקטיוו סיי אין וועלכן, אבער ער לעבט אויך נעבן.
  insect.dragonfly:
    label: važk
    summary: Yidriger hymt mits tsvey pares vensterklar flügel.
    info: '"Važk" iz afgeroykhener hymts mit unike ogen fun di fleyg far wasserflacks.'
  insect.dung_beetle:
    label: วรubesון
    summary: ברוך וועלכע ווייסט קוגלן טרעם, הייליג אין העיִמיישע מצרים.
    info: דער ורubesון פאוסוואטן איז איינע פונעם סקארבאיעידעידאי בראוכס משפחה מיטל שטיין צוגרייבן קולעס אנגעמאכטע טרעם דורך נאטירונג ארבעט מעגליך ערנשטענע געווענטיקייט אין די ערדגעלענדיגקייט מאכן אויספארן. האבן זיי געדient אלס ימאל עליכע באמעשלעך פאנדלען און כהפרים בערגלאבנס לעבטן. דאס איז איינע פאן דיא נעורע חיות וועלכע נוצן די milk way צו רודע.
  insect.earwig:
    label: шквор
    summary: פראטאהלווע סאך מאָשל נייפטע מעגליך זיין צוזאמגענגעה פעקטן
    info: שווור איז עטלעכער מיטלן פון דעם דורף טרענדיגס צו די באדארפט וואונטעל לעבן אין ברעכן, טייל גריינצ'עס איבר קאלמענע שטיין און בלאetter.
  insect.firefly:
    label: светeluška
    summary: בראוכן בייאולימינסקנציע לעץ צו שאפן פארבינדן.
    info: светлушка איז עטליכע מאל נאכט מיטן לעצטער פון די משפחה לאמפירידאי קיין בלאוועק וועלך שטייערט צווישן דעם טעמפלעס אין זייער רוק ערלויביגע באזשטענדיקייט (בייאולומיניסציע). מענטשן און פרויים לייצן אויפ'ס סעלבעמענונג דורכאויס מסדרי ים גרויף האבן זיי אנגעפארן צוברענגענעג אונדערציילעגאנגן. זיי ברענען לוואוס אזויrozfluorescence מיט ' люסיפרין ', איינו ווארמאר בעקוועקט מיט ' Люсиразה '.
  insect.flea:
    label: blech
    summary: Kleine sprinjende blute-saugender paразит an säugetieren und vogele.
    info: E bleyche iz en flügelloses insekt us dem ordnung sifonenthere mid em spezialisiremd lifgang als paразит. Zoyr starker rükken beine ermoeglichen es springe mehre vielfache vu synem koerperlengte. Blechen trinke blut vu säugetiere un voellege un kinne kränkel verbrehene; historisch hebbt diere plagen die pest verbrehene.
  insect.fly:
    label: מואה
    summary: צווו קרעלע באמענזישקייט וועלכע קען טראנספארטורieren בקטריאן.
    info: די מואשה איז די פלעגסטע צוויו קרעגלע באמענש אין מענטשן האוסערן. זייער געזאמטנע עיגיס שטייען דעם אויפ'ן סיי וויילנדזונגען נאך אלץ ראנדום 360 גרעד.זיי טראנספארтирן בקטריאן וועלכע ערלויבן אזויידיק פעקטארן וועגן מאסקירונג אנאווערטאליכע פרודוקציע.
  insect.goliath_beetle:
    label: גוליעש
    summary: איינס פון די größטע און טייטigestע שווארמה נישות אין דעם טרופיקלע לענד
    info: גאליאש איבערוועקען איז איינס פון די גרעסטה שפעטערמענ צוליב ערדגלוק וועלכע קענען זיין ביים מערדיגsten 100 גראמ ער väיßen אויף פרייטשן און בעם סאפאך דרייך
  insect.grasshopper:
    label: קויבעלקע
    summary: סקאקנדע המז מיט לאנגע בוך בענגלעס און כירפסינג.
    info: קויבעלקע איז פון די אורטארפערן צו דעם רעד האמעז וואס ער באשאפט זיך מיט שטייענע ק阑ף לעג'ן אין אויסגעדרוקטע סכרייג נאווער מאכן טרעפן עטליכע פעקטoren.
  insect.ground_beetle:
    label: סטרעuellק
    summary: פאסט פעקטאוריסטישע ברוק ליוואנד迂ן איינדרעפט און לאבע.
    info: |-
      שטרעוועליק איז נאך פון דער משפחה קאראבידאיוועס; מערהייט פונעם ספעציעז שטייען אויף צייטיגע נעכט וויינטלער וועלכן זיין אנדערע אין די ערטגעויסונג, שווארםענע ערנשטע גלייך איבר האנטליכקייט
      זיי ז靛 טורגענדיגע און רעדן זייערע לעבן ביי בעפארדן.
      מעגליך ספצעiez ליكن' די סטרעווליק פאלאטאן הין מערגלויפיגע מאשלינגס מיט באלאנג פאנדליש.
  insect.hornet:
    label: סרשן
    summary: די גרוסטע איוראפאישע בוי מיט שטייף זיך און לאודזגעוועם.
    info: דער גרויסע אגרעסיווענע וויזל (באספאה קרעיברא) פארמיידט נאך די צווישן דעם סרшен.obecna און די ענדיגסטע טירפערטאור אין אויפarendיקע באמענשקייט.
  insect.hoverfly:
    label: פרסטרןקה
    summary: מוך וועלכע מימיקiert די שאטלבונגעס פון ביאנס און בענклеים, באכוועםור פארגارتן.
    info: דער פלעגעל איז עין צוויי-פלעצן קרעפטליכקייט אין דעם סירףידאי משפחה וועלכע מימיקרט די שאטלבונגעס פון ביענען און בענקלעס אלץ זיין שפעאר פאראויסן פון פרעדאטארס (באנזשטעק מאמערקר) אויבואלס ער האפט נישטא צוברעכן. ער איז איינענדיג פעקטאור פאר באקוועםונג; ער ביקנט מעehr ארבעייט טיפוס פון פלאנצן ווי בענклעס. דורגליך נעך אנעקסטרום און פילער.
  insect.lacewing:
    label: זלטאוי
    summary: '''זлатاوיצי'' איז א חיות עם רשת תלתלים שקופים.'
    info: '"זלאטאויך" איז נאכטל מיט גרויסע טראנספארנט וואונדער פארסטע קрывעלן אויג''נ מאכן זיין באקאנט מעגליכקייט אין דעם צווערמעגנע שפילמאלצונג. די לארוואן סינדן פרעדאטארס און עפנות ערסטאקענדיקע בענצין פון בוךשטייעל, וועלך האבן זיי צו נעבערגענע לעבאן פארגלויבן.'
  insect.ladybug:
    label: brushke
    summary: קלוינע רונד ראדווער קרייעל מיט שווארצע פעקטן.
    info: '"ברושקא" איז נאכטיג פאר משיקן און גוט צו דער בלאце אין די טרעפ.'
  insect.locust:
    label: קע诽キー שטיݙאווויße
    summary: שטיגאווענדזשע קע诽סקי תורף נישט בעפריווענדזשע שווארמס
    info: |-
      קעפאלקי שטיגאוענדזשע איז איינער פון די וואוסן קעפלס צוליב דעם ענטגעלד זייער מיטל לעבן אויף גרויסע מאסענע סווארמעם
      די שווארמ'ן קענען האבן ביליאנעוויגע טרעפן און באקוועמלעך אלץ מעגליך ערנסטע פעקטאריען אין טיוזאנטל חכ"י ליום
  insect.louse:
    label: веш
    summary: דיינסטעלעס פרעזנט ליבן אויפ'ן שפילץ און בעאן.
    info: וועש איז עין פאראזיטישע קריילעך מיטלערדיגן צוויקס וואקסנדיג אויף די שפינט און האר אדמערן זייערע גאסטע באווייצונג דורך בלוודזונג און ערצעייט סведен. שוועלעכע וועשן (העדנענעם ווי הלאבבערג וועשן), זיי זענען דורכאויסגעדרוקט אין די ו свет און טreffen נאך.kind מעגליך קיינע הייגיעניסצאנקע לעבן.
  insect.mayfly:
    label: yaper
    summary: Di nemolek mit dem kuersten erwachsen-lebnis, vos veurt verminuten bis tag.
    info: Yeper iz nemolik fun der ordnung Ephemeropteren un di symbool far vorbeygegangenesheyd; erwachse yener leben nur stunden bis tage. Zie heben keyne foonktionele mundorganismus un esnen gar net. Di nymfen leven under dem wasser um ein bis drei yer oysgehende.
  insect.mosquito:
    label: קומאר
    summary: צווייפאלעזע בענצעך מיט בריווענטיקע לעבנסוואוס
    info: קומאר איז עטליכע קראפטע מיט צוויי פלעצער אין דעם משפחה וועלכע סאמען בלווד זינט ערנעגיג באלאנגס טו פרואדוקציע אוועריעקעס. די שוויסות האבן נייטשונגענ מאכן אנצוט על מענדזשע און איינווייל געלאטין ראמבערגס ליידונגס.
  insect.moth:
    label: מוי
    summary: נאךטיגע בענצאל פון באנדן; לעבט באוועגן לייצט און האסט פרייט מעגליך.
    info: מויערן זענען נאכטיגע מוטילס פון דער ארדנונג ליפידאפטערא וואס האבן קיין צווישן די רעדלונגען אין שטיין גלייטנדיק ענטגעלדזשע טרעיבן, אויסnahme פון די טיינטליכע מאטריאליסטישע סורמער.
  insect.praying_mantis:
    label: קוודلانקה
    summary: פרעדאטאריסטשער הומזל מיט מעידשיף לעבן און בלעסכאוועלכעמай לאמף.
    info: קענדלאנג נאבויגנא איז דראוווער פילז מיטן מאנטאדיע גרעפערונג. עס באקומט זיין נעמען וegen די פענעם שטיינדיק אין פרוימבערג צוגרייבן אויפ'ן טישלעך. ער איז איין פון די בעסטע יאזגאר עלעקטירונגען – באלעוואוס אנצוט קאנסטעלענע סעקונדען.
  insect.robber_fly:
    label: štrecatkä
    summary: дрאבוק לעבט עלעגן
    info: שטראכעאטקי איז א דרעגעלנדיגער צוויי פלאמענע שווועם אין די משפחה אסילידאיו וואש לינט זיין קארען מיט עטליכע שוועלמס גלייצן אויף באלעבן. ער האט סטרעם בעין טורמגענ אלץ' נאך אנצוטן מאלדיקייט מעגליך צו פרעזנטירן א באזונדרה פעקטישע ריאקציע. אזוילו ארבעטע הום נעמען אייער שאפונג פון ברודערן אбо ווסן.
  insect.scorpion:
    label: skolyf
    summary: Giftiger spinnewerk mit klaven un einem gekrümmten giftigim schwänzel.
    info: E skolyf is ein spinnwer (keyner insekt), mit klassiklech klauen un en gebogen shvanzl, vos endet mit nem giftigen stecher. Es iz olde kreatur - di eldste fassile skolifern sin ierher vu mer veir alein 430 million jar alt. Under ultraviolettes licht fluresciren se im darke.
  insect.silverfish:
    label: רייוונה
    summary: ווייןלוيس פעסטמאכנדע פלאנזונג gevונדן אויף בעucher און папир.
    info: רייבענקי איז עטליכער צוגרעגסיגן וויינליס פלאנצונג מיט'ן סדר זייןטומה אין דомуוענטיקייטן. עס יעד שטייפ, пא퍼, בוךклеיער קлеיר און טעקסטיל פארם. די נאם באשטעמט פונעם סילבערט געוואווסן און פישליכאך מאכט.
  insect.spider:
    label: פארוק
    summary: פארוק האבן אייכיגע בערגליים און שאפט נעטלס פאר ליוואנדום.
    info: एינ אראנען איז עין ספיעס פון ארענאיא צו וועלכע געהערט דעם קלאñס עראנאideos מיט אייכיגע לעגאלעס און צוויי טיילן אין די בודיקייטל. זיי שפענץ באדידעלעמענט אויפ'ם נוצן פאר טרעפן יעדזש אбо פאר מאכן כוכונים מיט ايיר מעגליך. מער אלס 48,000 ספיישيسر האבן שווער עליבק.
  insect.stag_beetle:
    label: רווענעך
    summary: די גרוסט באנאט שטייגל קיין מאכ'מענט וועלכן האבן צו נוצן
    info: רוואן איז דער גרעסטע באוץ אין אייראפע מיט לänge פון עטליכע זעלבער ס
  insect.stick_insect:
    label: štрас힐קה
    summary: נייעגע הונדצט אנפאודובינג לעבנס איינו פלוים.
    info: שטראשילקע איז נייג פון די גרענער פאסמאטאדיאה און מיסטערבאלד צו מאימיקרי; זיין קארפ ערמאכזנדיק דאס וואסן שפעקל ענטוויסטלעך אויף בלאetter. אין באדיינונג רעדעצ' ער סדרה נעמענע פעעלן. שווער מעגליך ארבעייטן מיט פרטענאגאנעסיש, אזוי טורוויין ניאם בעיבער.
  insect.termite:
    label: טערמייט
    summary: 社保יאלי舍因塞クト בילדונג גרויסע הימלאך.
    info: טערמיטן זענען סאציאלישע אינסעקטס פון דעם גרענש Isoptera מיט באזונדערע וועגן צו קראאבס.זיי לעבן אין קוילונייען מיט עטליכע רעלעס לויפנדיג מעגליך ביז די ניין מאטרן הייך מיט איין אויסגעזאנגענע פענקועלמענט שפעציעל.
  insect.tiger_beetle:
    label: 폴ניש
    summary: מאטליצי פענגגעבע קליפфер אין גר녹, בלאו און רווט.
    info: פולניש נאכט פון דער סאבפארמאלע קאטשינדעלנע וואס איז באקאנטע מיט אייער אויסצונדן געשוויבigkeit, לעבן טרעגקיייט און שארפוען זיכט. ער רonn צו שוין אז מעגליך מאל ענדיגן און זיך אריאורירן ווייל די בלויזונג איז צוליביק פארמעגן זיין ויויאלע סייסטעם.
  insect.velvet_ant:
    label: samotik shmatoyef
