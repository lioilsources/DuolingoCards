      Der Samtiger Meleze is eigentlik ein vos aus der Famile Mutualide; die weibscheke sinds flügellos un gleiche melezen anzu zien
      Ze han arbetmlek rote oyf orange färben geshvarts zauber um ze warnen
      die Weibchen hefen ekstrem stark stiches un duifel es 'Kuh Mörder'
      sy parazite uf Bienen nest
  insect.wasp:
    label: וויזעל
    summary: שוועלעס Schwarz און צווייגלויכע חיות וואס בauen קארדווארמאל.
    info: וויסע איבערנען פון די גרעס וויזעלע מיט באקאנטע שוועכצשwarz צווייגלונג אין דעם ספיץ שטיל. זיי בauen קארדבאוסמער נאך אויפ'ן טראם פונקט פון בעניצנדיקייט פון ערשטאקע לעעצן מאץ. איינגעגעווענט אזוי אלס יעדע מעגליך צוגרייף.
  insect.water_strider:
    label: וואסערר
    summary: איןעקט וועלך'ס קאן'ס רייצן אויפ'ן וואسهאר דורча סופרא픽עווענע טרענגע.
    info: וואסערר נאכט אינעקט פון דעם געלגערדיד זוג וועלכן קיין צוליב די הימבעפארן שפיעלער אויף די בענkle ים סופראפיקעווענע טרענגע אין דעם וואסהאר. עס הייסט אייך מיט באזונדרה פעלויגקיטענדיקייט אנגעוויזן דורכאויס ביי די הארגשפאלאמען ווייל ער קאנסט זייען מעגליכן מאלצונג נענטן. ער רעדאט זייער שאקלiccelig און קלירט די חורף מיט א געהאלץ פון מער אלס 150 מאל די לעבן לänge פר סיוקיינד.
  insect.weevil:
    label: נאواسאטעך
    summary: קליינע ברוק מיט א לאנגע נעז
    info: נואסאטעך איז בראוכ קיין פעלעדיגער צו די סטממל כורקוליאנוידען וועלכ'איז דיא גרעסטה טירמע שפילגעמאכן אין דעם ערד מיט מאר אלץ זעקס טיוזאנד ארבעטעלעך. אויסגעוועגליך נאשונגענטיקע באוווסונג ראמום ערלויבט אייינצוך אין פרייכטלעס, פרייענע יון בעאם. שוין אזוי מעבר עלעקטאר לעבן פילער אנדרייישענע ארבעטעלעך.
  insect.whirligig_beetle:
    label: וויר镍
    summary: קלוימע באוץ וועלכע קרעייגעל איךגרuppen אויף די שאפטן.
    info: 'וירניק איז עין וואסער באוץ פון דעם משפחה גיירינידע וועלכע לעבט אויף די שפעטן אנד קרעיגל אין גרופעס צוברingen זיין ספוגנישמער נאך מיטגעמאכן. ער האט אייערן טילג''נד אין צוויי טיילן: איינע סיועט ביים שויבן, אןדרע אזויונט לויפנע מעגליכקיטען. ער נעמט ריפלי (וואולנטשיקן) אויף די שאפטן ווארפרונגס מייסן עלעמאנטאר אбо בעפארזוך.'
