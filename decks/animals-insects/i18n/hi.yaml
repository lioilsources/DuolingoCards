lang: hi
pivot: false
title: कीट
cards:
  insect.ant:
    label: मरीचा
    summary: एक छोटा सामाजिक कीड़ा जो बस्तियों में रहता है।
    info: मरीचा एक कीड़ा है जो बड़े झुंड में रहता है और प्रगति के लिए काम का विभाजन करता है।
  insect.antlion:
    label: म्रगलेकोलेओफ
    summary: अधिसभा ऐसे धूल झाड़े के ऊपर थोड़ा ठण्ढा
    info: |-
      म्रगलेंटिडे पर्वतीय चौंघ का सदस्य होने वाले मकड़िए के अपजवुआ भोजी के छिद्र बनाते है।
      जब एक घरेनचढ़ा गहरे खाँचे में फङ जाता है, उसे मकड़िए के आश्म और श्पष्ट रूप से इसे पकड़ लेते है।
  insect.aphid:
    label: मक्‍खिका
    summary: '''अफ़िडिडे'', पौधों के झाँठों पर पाए जाने वाले टिमटिम कीट'
    info: |-
      मक्खियां एपीडोइओएया के सुग्रह में हरे पौधों के रस को चखने वाले छोटे कीट है।
      वे शहद जैसे गलत तरल पदार्थ 'शहद' का उत्पादन करते हैं,
      jisके बदले में भभई इनकी नि‍बाह करते हैं।
  insect.atlas_moth:
    label: मार्टिनाच एटलासोवी
    summary: ऊषण के छोर अभियोध्या के गठिओं के समान आई ऌे ऽिऺ ऻाऄ ऎक ऒर ऋचा ऱी ञाः ऴ्‍छ ळी ङी।
    info: "मार्टिना एटलसोवी हैंड्रेड से पश्चिम के महाद्वीपों में सबसे बड़े शरदऋतुकालीन तिजोरीयों में से एक है।\nउनके पखेप ऐसे भगोजे हए कि उनके छोर अभियोध्या के गठिओं के समान आई और इस प्रकार खास घाँघों को धमकाकर ऊषण करते हैं। \nअफलाही फिष्ण झाऀ थाि ऑइथ ठी ढााढ ऩी ऋचा ऱी ञाः ऴ्‍छ ळी ङी।"
  insect.bedbug:
    label: श्टेस्िनेह
    summary: अजगर के धारण ढंग से ऐक ऑभ्याण्ड जो शाम के समय खून भगाया
    info: |-
      घरेलू बिच्छुआ कीचड़ियों से प्राप्त हमला मकईदन के रूप में जाना गया।
      वह अधिकतर शाम के समय एक वस्तु के ऊपर खून भगाया और उठाई दबाइए。
      उनके घर टटोले में, फर्नीचर के झाड़फाँद आऊर ओढऩ के ठीथर में छिप जाथे।
  insect.bee:
    label: मधुमक्खी
    summary: एक पीले और काले हिस्सों वाला कीट जो फूलों का संपर्क करता है और मेड़ बनाता है।
    info: मधुमक्षि एक सामाजिक कीट है जो शहद उत्पादन करने वाले छत्रों में रहता है और नेक्टर इकठ्ठा करता है।
  insect.beetle:
    label: जीव
    summary: इनमे से एक भाग इंसाफ शास्त्र के ऊपर थे
    info: |-
      कीटों के रूप में प्राणियों सभी हर्मना जगह से लेकर आर्कटिक क्षेत्र और उष्णकटिबंधीय क्षेट्र दुनों मेसे।
      बचलवति कड़े ढँढऩ वानले असमाप्त डखण चदर के खाहे छए।
  insect.bombardier_beetle:
    label: गन कैंची ब्राउचिना
    summary: ऊष्ण चापलूषित भाष के ऑउछल के रूप में आडऩ
    info: |-
      गन कैंची ब्राउचिना सबफेमले में एक पत्थरदार हवमुखीयों का जीव है। यह अपने घटित विधि से खुद की आड़ लेकर दुश्मनों से छुटकारा पाता है - इसके पीठ में चापलूषित और गर्म भाँप फेस डाटा हए।
      इसके शरीर में ऐसे दो रासायनिक पदार्थ होते हैं जो ठंढे झुण्ड में मिलकर ऊष्ण ओज उत्पन्ह करते हैं।
  insect.bumblebee:
    label: चेमलाक
    summary: एक महत्वपूर्ण प्रजनिता
    info: बम्बस जीनुस का सदस्य होते हैं।
  insect.butterfly:
    label: तितली
    summary: चमकदार पंखों वाला उड़ने वाला कीट।
    info: एक तितली हमें दो जोड़े में चमकदार पंखों वाले कीट के साथ मिलती है, जो अक्सर ध्यान आकर्षित करते हुए रंगीन होते हैं।
  insect.caterpillar:
    label: mendha
    summary: एक मेंढऱ या सरसफई की प्रजाकोश ; पत्थे खाता है और mudraण के लिए तैयार होता है।
    info: |-
      एक तिलचट्टा की प्रजाकोश है। मेंढ़े या सरसफई के अपने जीवन के बहुत समय में पत्ति खाने में व्यतीत करते हैं और इसलिए ऊर्जा आरब करते हैं।
      kuch मेढऩ में रंगदार चिह्न होते हैं जो शिकारिओं को उनकी दुष्प्रभावकारी प्रकृति के बारे में भड़काते हैं。
      mudraण के दौरान वे गठरी(खरघिसिडा ) बनाते हैं , जिमें धारिणी का पूर्ण घटना (अधिष्ठान फेरबदल) होता है।
  insect.centipede:
    label: सीटलर
    summary: ऊष्णकटिबंधीय धारा में ऐसे झीलों के ठीठ ढाहे जो एक खंड पर एक जोड़ा पैर रखते हैं।
    info: "चिलोपॉडा कक्ष में शामिल होते हुए सीटलर प्रजननवंश के एक पदार्थ के समान जहाँ प्रति खण्ड त्वचा के अग्रभाग पर दो पैर होते है।\nयह चलने और भोजन बनाकर घसीटने के योग्य छोटे आकार के इलेप्ट्रोफ़्लोइबर्स होते हैं। \nअधिकांश ऊष्णकटिबंधीय प्रजाओं कई फुट लंबे हो सकते हैं।"
  insect.cicada:
    label: चीकादा
    summary: ऊष्ण दिनों में घोंघल के भाषण के ऊँचे झंझट के लिए प्रख्यात कीट
    info: |-
      चीकादा किकडोइओएड सुपरफैमिले में एक प्रकार का हव्वया है। जहाँ यह अन्य कीटों के बीच सबसे शोरगल के ध्वनि के लिए प्रख्यात है।
      जानवर पतले छोटे ट्म्पलीज़ के उद्गार के माध्यम से आवाहन करते हैं और मादा को खींचते हैं。
      अमेरिका में कई प्रजातिओं के चौदह या तेरह साल के डेवलपमेण्टल साइकल होते हैं।
  insect.cockroach:
    label: चिट्ठी
    summary: इसका झुठलाहट रात के ढेर ऊष्णकटिपथी जीव है, जो बहुत मज़बूत और ऑफ़्फ़र बढ़ाई हुई है।
    info: |-
      चिट्ठी दुनिया के सबसे मज़बूत हवेलों में से एक है। वहाँ पर रेडिएशन और ऐसी अप्रभावी परिस्थिति हमले कर सकते हैं जो आमतौर पर घटिया बदखामों को मार चुके हैं।
      अधिकाधिक 4,500 प्रजाओं के उपयग हैं, लेकिन इनमें से केवल छोटे 30 फर्श पर खड़े भी गए हैं।
  insect.crane_fly:
    label: टिपुलका
    summary: एक ऊबड़-खाबड़ मछर जैसा कीड़ा जिसके अत्यधिक लंबे पगडंडि होते हैं।
    info: |-
      टिपुलका डाइप्टेरन कीड़ा है। यह मेंढकों से प्रतीयमान होता है लेकिन चबौजदार और परभक्षण वाला नहीं है।
      इसके अधिकाधिक छोटे पगडंडि आसानी से तोड़ जाए हैं; ऐसा बचाओ का उपाय (ऑटोटॉमी)
      वयस्क दिनों के भीतर खासे शामिल नहीं होते हैं और फलफूल ग्रहण नहीं करते हैं。
      अशुष्ठ घटक (घुठखरई) मिट्टी में रहते हैं और झाँझे पर खाते हैं।
  insect.cricket:
    label: छोटे चिड़चिवुआ
    summary: उभयफलकी अहाता के ऑर्थोप्टेरा आदतवश नौटिंगल छोटे चिड़चिवुआओं
    info: |-
      ग्रिल्स जीनस का पारंपरिक मकड़ियों से हमेशा नौटिंगल छोटे चिड़चिवुआओं।
      एथोपेटरा के आदतवश उभयफलकी अहाता के एजाहब गण。
      अधिकाँश देखभाई बढ़ई और घर के भाइयों के झुंझलाओं के ध्याम्‍बोलिप फलक के ऊष्णकटिबंधीय ऐसे ठीठे थे।
  insect.damselfly:
    label: शिडलाटका
    summary: एक प्रमुख शबद चंगईया ; आराम करते समय अपने पंखों को उसके समानांतर खड़ा करता है।
    info: शिद्लातका एक कीट है जो मेंढ़क से परिवारवत्‍ता हलचल बनाने और छुटकारा पाओ।
  insect.diving_beetle:
    label: पोटाप्निक
    summary: अघुआ ऐसा जलचर शिरशफलकि हई जे जल के नीचे घूमत हई।
    info: |-
      पोटाप्निक वेलकी कुछ प्रजनसे हैं। मध्यम से बड़ा जलचर शिरशफलकि डाइटिस्टिदे के परिवार से सभी तहत आए हई।
      वे एगो चौखाम अउ फ्लॉटिंग गठन ओणके पीछे के पंजर भइयों झाँकि घुमबदर छथि,
      ओणके ऊपर खुले धारा और ठंढा जल में थोड़े ढीले ऑक्सीजन ले रहे हई।
  insect.dragonfly:
    label: वाज़का
    summary: लंबे शरीर वाला कीट और दो जोड़े प्रतिस्पर्शी पंख।
    info: वाज़का एक मांसभूक हिमेशिया है जिसमें अद्भुत दृष्टि होती है और जलयुक्त स्थानों पर शिकार करता है।
  insect.dung_beetle:
    label: खड़मल
    summary: एगिप्शिअन धर्म में खाने के कणों के गोले घसीटने वाला मच्छर
    info: |-
      वरबौन पोशाकी एक स्क्रेबे किडीज़ाईयुक्त मच्छर हैं।
      प्राचीन मिस्र में यह सूर्य और कफऱि देवता के प्रतीक थे।
  insect.earwig:
    label: शक्रोर
    summary: एलांगेट मच्छर पुष्ठ सिलसिला
    info: श्कवोर डेरमेपटिरा कीड़े हैं।
  insect.firefly:
    label: स्वेतलुशका
    summary: आकर्षित करने के लिए बायोलुमिनिसेंस प्रकास बचवाने वाला बऊक।
    info: "स्वेतलुशका लैमपिरीडे के परिवार से होता हैं जो मध्ययहनि के दौरान प्रज्ञापन के उद्धेश्म से ठण्डा प्रकास बचवाकर चमकता है।\nइनके पुरष और महिषा भिंन -भिंन प्रकाण के प्रकास के माध्ियम से एक-एक के अथबटन आकर्षित करते हैं। \nअग्निगुंठन इफ़्फेट फँई ओखलिहरिऩ छोड़कर ऑक्झिऐन के साथ खाऊमिकीय घटना के कारण होता है।"
  insect.flea:
    label: फील
    summary: छोटा झुठलाहट डाट फील घोंघा ओर पक्षीओं के खून के ठीठ धाँवे.
    info: |-
      चीथड़ा एक परजिवि के जीवनशैली पर स्पेशलाइज हुआ मध्यम आकार का कीट होता है।
      इसके मजबूत पिछले पंख उसे अपने लंगह के 150 गुणा ऊपर कदम बढ़ाए देते हैं。
      यह स्थलचर और पक्षियों के खून को चौषता है और निमोनिक भी प्रसारित कर सकता है;
      historically it has carried plague.
  insect.fly:
    label: मक्खी
    summary: आम दो पंखे वाळा कीड़ा जो बैक्टीरिया ले जा सकता हय।
    info: "घरेलू मक्खी दो पंखे का सबसे हमारे घरों में प्रचलित कीड़ा।\nइनकी संयुक्त आंखें उन्हें इतना चौड़ा कहीं भी अपने वामन गोले के बगल में नजदीकी और छवि डाटा जाँचने की एकटा सभी ओर से फैले हए यश। \nअधिकांश शरीर के ऊपर धूल झाड़े ठीठ थे ऐसे बैक्टीरिया ढोई हथिस।"
  insect.goliath_beetle:
    label: गोलिहाँ
    summary: ऊष्णकटिबंदीय आफ्रीका से संसार के सबसे बड़े और भारी मच्छरों में से एक
    info: |-
      गोलियाश ओब्रॉव्सकी संसार के हमशेषु मच्छरों में से एक है। पुत्रि इनका वज़्न 100 ग्राम तक होता है और लंबाई 11 सेनटीमीटर से अधिक होती है।
      यह भौगोलिक आफ्रीका के ऊष्णकटिबंदीय जंगलों में रहते हैं。
      प्रृथक चीजें फल और देखभाल के झड़ों पर टिड़के घूमते हैं।
  insect.grasshopper:
    label: क्रम सामग्री में पहले 'ऑरद' शब्द के बजाय 'ओर्थोप्टेरा'
    summary: '''सुईयाँ'','
    info: टिड्ढा ऑरथोप्टेरन कीड़ा हैं।
  insect.ground_beetle:
    label: स्ट्रेवलिक
    summary: ऊष्णकटिस्थलीय ढेर और पत्तियों में रहने वाला तेज़ चलने वाला शिकारी मच्छर
    info: |-
      स्ट्रेवलिक कारबीडे परिवार से एक मच्छर है। अधिकतर प्रजाति जनवटों, कुछमशरा और खरगोश को शिकार करने वाले सभी दिन चेहरे बदलने वाले ठहरते हैं।
      ये गतिमान होते हैं और डर के कारण धीरे-धीरे भाग जाते हैं。
      प्रजातियों जैसे स्पष्ट फ़्लॉवर कई आकर्षक ऊष्णकटिस्थलीय झिल्ली घेरे हए ओढऩे वाले होते हैं।
  insect.hornet:
    label: सर्शेन
    summary: अफ्रीका की सबसे बड़ी मधुमखी भाषा ठोस ढंढल और झुकझुक थोथे के साथ।
    info: |-
      सर्शेन ओबीकना हैवियों के सामाजिक मधुमखी प्रजाति की सबसे बड़ी वोश है।
      यह एकलपट्टीदार घर गणतईएंग और छतों पर खोलती है。
      इसका डंठल अन्य मधुमखियों की तुलना में लंबा होता है और चोट दर्दनाक होती है,
      lेकिन इसके आक्रमण फक्स उचित धमकी के ऊपर होते हैं।
  insect.hoverfly:
    label: एसरफिज
    summary: इसके ध्वज आकार इतने घनघोर होते हैं कि ऐसा झाँखी फौलाओं और ऊष्णकटिपथी ऑउओआई के ठीठे थे।
    info: पेस्ट्रेंका एसरफिडी के पारिवारिक हमनटोगॉल मच्छर सदृश कीड़ा है। यह चुंबकता और शवयों के अधिमेषण के लिखे बरानि भाग देता है।
  insect.lacewing:
    label: ज़्लातूओच्का
    summary: अणुऊ आकार के पाई ऊ ऐसे फुआइयवश इमाँ ठी ढाळ ऑफ़ ऋजु ऍफ़ ि ा
    info: |-
      ज़्लातूओच्का चेरेडी क्रिसोपिदई से हम पक्षीयवश मधुमखि के जनसंख्या को नष्ट करते हए उदभट शिवारह ह।
      उग अपने बड़े पालघठ और सफेह धागा-बना घुथरे छोछे झिमझिम के पंखों के ओढऩे भी खाए थे।
  insect.ladybug:
    label: बरूश्का
    summary: एक छोटी सी काली चित्रित लाल मच्छरनुमा कीड़े की पहचान।
    info: बरूश्का हरे पत्थर के जीव होते हैं और वे घरेलू उद्यान में फलिए के खाद्य के रूप में बहुउपयोगी होते हैं।
  insect.locust:
    label: सरनची कोबिल्का
    summary: इ दुखद पलटुओमें अफ्रीका आऊर एशियापर कृषि नुकसान करथे।
    info: कोबिल्का सरनची एगो कृषि प्रजाति हवय। महत्वपूर्ण परिस्थितिमें ये बड़े पलटुएमं घुस जाई हई।
  insect.louse:
    label: वेस
    summary: '''दस्थि'', जब भी आप इसे देखते हैं, उच्च ऊँचाई और अधिक घड़ई के बरामदे पर नए छोटे पशुओं के झुण्ड के फौजदार के रूप में ध्यान देता है।'
    info: |-
      वेश एक प्रजातंत्रिक कीट है।
      यह मुख्यरूप से 'फथिरेप्टो' वर्ग का हमला करने लगता है।
  insect.mayfly:
    label: जेपिस
    summary: इसके जीवनकाल के बर्णन के अनुसार जेपिस एक ऐसा हीम ऑधिकतम घण्ऱों अथवा दिनों झबई रहता है।
    info: |-
      जेपिस एफीमेरोप्टेरा के संघ में है और प्रति कालके के प्रतीक कहलाता है। वयस्क जेपियन घण्ड़ों अथवा दिनों बगई रहते हैं।
      उनके पास कामचलाऊ भुखाग उपकरण शाफ थे इसलए आऊटे खाओ छडऩे के चाहे。
      अभद्रा जेपिस पानी के ठीठे मेँ 1 से 3 साल झबई रहते हैं।
      जेपिस के ढेरों धारा एक ऐश्ष ऋतुआत्मक नाटक है; हंगेरी में डौनवेर पर जेपिस के ढेरों धारा एक अद्विितीय घटना है।
  insect.mosquito:
    label: मच्छर
    summary: एक ऐसा दोपक्षीय सूज है जो खून चौबढ़ाई है और इसमें बीमारियों के प्रसारक के रूप में भी भूमिका निभा सकता है।
    info: मच्छर कुलिसीडे पारिवारिक दोपक्षीय सूज है। महिला मच्छर अण्डों के विकाश के लिए प्रति पदार्थ प्राप्त करने के लिए जानवरों के खून का उपभोग करते हैं; पुरुष फूलों के चसकेमुखीय भोजन पर बने रहते हैं। मच्छर मलेरिया, डेङ्गू और झ़िका आदि घातक बीमारियों के प्रसारक होते हैं।
  insect.moth:
    label: मौरा
    summary: सवेरे के बजगड़ के एक नाकाशी जो लाहट और फॉइल द्वारा चलता है
    info: मूर्स रात्रि के मोथ हलकपेटिया संघ परिवार से संबद्ध होती है। इनके पंख आराम के समय ओरहुआएँ होते हैं।
  insect.praying_mantis:
    label: भगदड़ी
    summary: एक प्राणघातक कीट जो एक प्रार्थना की धामधुआढ़ी के साथ और बिल्कुल अचानक हमला करता है।
    info: |-
      प्रार्थना के दौरान हथियारों में पकड़ी गई समयवलि।
      इसका उच्चतम वजन इसके पहुंच के कारण होता है।
  insect.robber_fly:
    label: छहटला
    summary: उडऩे भर आधा उडने धुऊद फंसाओ
    info: |-
      एसिलीडे परिवार से एक हवा में कैच करने वाली चोंटल द्वि-पखुआ जीवज हमशे।
      इसके प्रबल पग शिकार पकड़ने के और बढ़ईया डंठल अभिसरण तत्पर करने घातक छोटे टोकन इंजेक्षन के लिये होत है।
  insect.scorpion:
    label: स्कॉरपिओन
    summary: एक जहरीला मेढ़ी के प्राणि ,खंड और झुका हुआ टेमटे घाँघ
    info: "स्कॉरपियन एक मेंढ़ी के प्राणि होता हैं(चिड़िया नहीं),जिसमें सुईदार पौछला होता है।\nइनके अवशेष 430 मिलियन वर्ष पुरातन हैं। \nअध्दे में इनके शरीर बगृबी चमक फैलाते हैं।"
  insect.silverfish:
    label: रिबेन्का
    summary: एक ऐश्ठिप झलई हम कौन घरों में किताबों आऊर कागज़ के पास पाई जाथे
    info: "रिबेन्का एक प्राचीन संवह हम कृति मुख्य रूप से घरों में पाई जाती है।\nयह शर्करा, कागज़, पुस्तकबद्ध लगड़ी और ऊटकल फाइबर पर खाद्माही है। \nइसका उच्छ्वास अपने टिनकर भाषण आउर मछलिओं के समान डाँधल के कारण है।"
  insect.spider:
    label: spider
    summary: आठ पगड़ी फफजाल बनाऊ झील थे ऐश ठी ऑर्थोपोडा
    info: "चींटियां एरेने कोटि से पवुकना हैं।\nइम्स में आठ पगड़ी और दो भागों वलय होते हैं। \nप्रसिडेट चींटिओं के जालबद्ध बनाकर उन्हें शिकार करने अथवा अण्डों के घेरे के तहत ढके छोए खई इस्तेमाल करते हैं।"
  insect.stag_beetle:
    label: रॉहच
    summary: प्रजनन के दौरान एक शेर के तरफदार के समान भाँवर धाड़ अपनाकर छोटे घोंघों के साथ झगड़ा करता है।
    info: रॉहाच ओबेन्सकी सबसे बड़ा पशु होता है। मध्ययुग के जंगल और मृत लकड़ियां खत्म होने से इसमें गिरावट आई है।
  insect.stick_insect:
    label: एफ़्लेमटोडिओइड
    summary: एक ऐसा हरि जो धाँस या पत्थर के ढाँचे के झुकाऊ उछाल के फ़ाउण्ड के घुमापन को ठीकठीक दोहराता है
    info: |-
      स्ट्रैशिलका एफ़्लेमातोडीया समूह के हरि में शामिल हैं और पुनर्निर्माण के मास्टर हैं। इनका बच्चा डगधुआई या पत्थर के आकार के अपवाह को ठीकठीक दोहराकर छद्मबख़त हो जाता है।
      जब खतरा होता है तो वे पूरी तरह से गति के बिना भी रह सकते हैं।
  insect.termite:
    label: टर्मिड
    summary: एक साझा कीड़ा घाँघरे के भाप के साथ खदान छोड़ता है।
    info: |-
      टर्मिट एक सार्वजनिक कीड़ा है। इसमें पुत्रों महल, बच्चे, सैनियों और श्रमिओं के अवयव होते हैं।
      इनके द्वारा जटिल मधुबखरे तथा उष्णकटिसभी में 9 मीटर ऊपर के गढ़ निर्मित किए जाते हैं।
  insect.tiger_beetle:
    label: पॉल्नीक
    summary: इसका शरीर धातुओं के रंगों में रंगा हआ है और इसकी दृष्टि बेहद तीक्ष्ञ है।
    info: "पॉल्नीक एक काबरा होते हुए सिसेंडेलिनई प्रजन मच्छर है।\nवह इतना तेज़िया से दौड़ता है कि वह रुककर फिर से अपनी ओर ध्यान केंद्रित करना पढ़ता हैं क्योंकि गति आसमान चश्मा के ऑफटर से भी तेज़ होती है। \nउनके शरीर घने और खबरदार ढंग से टखने डाकर ऊष्णकटिपट्‍टीय झाँझ थे(हरा , नीला )और ठण्डकटिपट्टीय झाँझ थे(लाल)\nअथवा ऐसे बच्चे जमीन में ऊध्र्वाधर ट्यूबल बनाते हैं और खाहे के लिए छिद्र में लुभाते हैं।"
  insect.velvet_ant:
    label: सफ़ेद चबूतरा
    summary: एक गौय जैसा दिखने वाला ओरेञ्टल और काम करने वाला छोटा मधुमख
    info: |-
      मुटिल्लीडे परिवार का एक मधुमेख सच है।
      mहलगों के घने बिना प्रजननशीलता के अपवाह होते हैं।
  insect.wasp:
    label: ओबेला
    summary: पीले और काले अम्मा वाहक कीट गण द्वारा शाखा
    info: |-
      वोसा ओबेनकाय हैल्सिफ़ेर की प्रजन संगठन 'वेजुला' में एक डंखदार कीट है।
      iयह पतझड़िए कचरे के टुकड़ों को चबाकर बनाती है।
  insect.water_strider:
    label: वोदमेरका
    summary: अच्छा सूजन जो ठीठी पानि के उपर चढ़कर घूमता है।
    info: "वोदमेरका जीर्रिडेए पारिवार का सूजन है। इसके पंख में नमलत लगी हुई है और यह पानि के सतहीय तनाऊश्चल के काम से बड़ी आसानी से उपर घूमता है।\nइसके अधिकाँश भोजन गभीर झील में खोए हुए सूजनों के शिकार होते हैं जिसे धब्दि के माध्यम से टटोलता है। \nयह छोटे ढंग से फौरन ओझल हो जाता है और एक सेकण्ड में अपने शरीर के 150 गुना थोथरा ऑफर कर सकता है।"
  insect.weevil:
    label: नोसेटेक
    summary: एक छोटा मच्छर जिसके पास एक घुमावदार दाढ़ी होती है।
    info: |-
      नोसेटेक कर्चुलिओनीडे पारिवारिक एक मच्छर है। संसार में जानवरों का सबसे बड़ा परिवार है और इसमें 60,000 से अधिक प्रजाति हैं।
      पहचानदायक लंबा खोखला भाग (रोस्ट्रम), फलों, धान आदि में डगमगाहट के लिए उपयोग होता है।
  insect.whirligig_beetle:
    label: घृषणी
    summary: एक छोटा मध्यप्रदेश का चढऩे वाला धाँस
    info: वीर्निक जल प्रजाति का सूक्ष्म मेढ़े होता है। यह गयरिनिडे परिवार का एक बुनियादी अंग है और इसमें पथरीले भालूओं के खड़े शबदों के साथ घूमने की आदत होती है।
