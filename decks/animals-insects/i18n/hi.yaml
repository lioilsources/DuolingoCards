lang: hi
pivot: false
title: कीट
cards:
  insect.ant:
    label: चींटी
    summary: उपनिवेशों में रहने वाला छोटा सामाजिक कीट।
    info: चींटी एक कीट है जो स्पष्ट श्रम-विभाजन वाली बड़ी कॉलोनियाँ बनाती है।
  insect.antlion:
    label: चींटी-शेर
    summary: सूखी रेत में कीप जैसा जाल खोदकर फिसलती चींटियों को पकड़ने वाला लार्वा।
    info: |-
      चींटी-शेर एक कीट का लार्वा है जो सूखी रेत में शंकु के आकार का जाल खोदता है।
      जब चींटी फिसलकर अंदर गिरती है, यह अपने बड़े जबड़ों से उसे पकड़कर पाचक रस छोड़ता है।
      वयस्क व्याध पतंग जैसा दिखता है और शाम को उड़ता है।
      लार्वा बिना भोजन के वर्षों तक मिट्टी में जीवित रह सकता है।
  insect.aphid:
    label: माहू
    summary: पौधों के तनों से रस चूसकर मधुरस छोड़ने वाला छोटा कीट।
    info: |-
      माहू पौधों का रस चूसने वाले छोटे कीट हैं।
      ये मधुरस नामक मीठा पदार्थ छोड़ते हैं, जिसके बदले चींटियाँ इनकी रक्षा करती हैं।
      ये बहुत तेज़ी से बढ़ते हैं और एक मादा थोड़े ही समय में हज़ारों को जन्म दे सकती है।
  insect.atlas_moth:
    label: एटलस पतंगा
    summary: दुनिया के सबसे बड़े पतंगों में से एक, जिसके पंखों पर विशिष्ट डिज़ाइन होता है।
    info: |-
      एटलस पतंगा दुनिया के सबसे बड़े पतंगों में से एक है, जिसके पंखों का फैलाव 30 सेंटीमीटर तक होता है।
      इसके पंखों के सिरे साँप के सिर जैसे दिखने के लिए रंगे होते हैं, जिससे शिकारी डर जाते हैं।
      वयस्क का मुँह नहीं होता, इसलिए वह कुछ नहीं खाता और केवल कुछ दिन जीता है।
      यह दक्षिण-पूर्व एशिया के वर्षावनों में रहता है।
  insect.bedbug:
    label: खटमल
    summary: रात में खून चूसने वाला चपटा कीट जो फर्नीचर की दरारों में छिपता है।
    info: |-
      खटमल मुख्यतः रात में सक्रिय रहता है और सोए हुए मेज़बान को काटकर खून चूसता है।
      यह गद्दों और फर्नीचर की दरारों तथा वॉलपेपर के पीछे छिपता है।
      हाल के दशकों में अंतरराष्ट्रीय यात्रा के कारण यह फिर दुनिया भर में फैल गया है।
  insect.bee:
    label: मधुमक्खी
    summary: फूलों का परागण करने वाला और शहद बनाने वाला पीला-भूरा कीट।
    info: |-
      मधुमक्खी (Apis mellifera) एक सामाजिक कीट है जो छत्तों में रहती है और शहद बनाती है।
      यह पौधों के परागण में अहम भूमिका निभाती है और खतरे में अपने डंक से रक्षा करती है।
  insect.beetle:
    label: भृंग
    summary: कीटों का सबसे बड़ा गण, जिसमें 4 लाख से अधिक वर्णित प्रजातियाँ हैं।
    info: |-
      भृंग कीटों का सबसे बड़ा गण हैं और सभी वर्णित जंतु प्रजातियों का लगभग 40% बनाते हैं।
      इनके कड़े अगले पंखों के नीचे उड़ान वाले असली पंख मुड़े रहते हैं।
      ये वर्षावनों से लेकर ध्रुवीय क्षेत्रों के किनारों तक लगभग हर आवास में रहते हैं।
  insect.bombardier_beetle:
    label: तोपची भृंग
    summary: बचाव में उबलता ज़हरीला फुहार छोड़ने वाला भृंग।
    info: |-
      तोपची भृंग अपने पेट के सिरे पर दो रसायनों को मिलाकर 100 डिग्री से अधिक गर्म फुहार छोड़ता है।
      यह ज़हरीली फुहार धमाके की आवाज़ के साथ तेज़ी से बार-बार निकलती है।
      शिकारियों के विरुद्ध यह बेहद कारगर रक्षा-हथियार है।
  insect.bumblebee:
    label: भौंरा
    summary: गहरी गूँज वाला रोएँदार कीट जो परागण में अहम है।
    info: |-
      भौंरा (वंश Bombus) एक रोएँदार मधुमक्खी है जो मधुमक्खी की नज़दीकी रिश्तेदार है।
      यह ठंडी जलवायु में विशेष रूप से महत्वपूर्ण परागणकर्ता है।
      यह उड़ान की मांसपेशियों को कँपाकर शरीर गरम कर सकता है, इसलिए ठंड में भी उड़ता है, और मधुमक्खी से शांत रहता है तथा केवल खतरे में डंक मारता है।
  insect.butterfly:
    label: तितली
    summary: बड़े रंगीन पंखों वाला उड़ने वाला कीट।
    info: तितली दो जोड़ी शल्कों से ढके पंखों वाला कीट है, जो अक्सर चटख रंगों की होती है।
  insect.caterpillar:
    label: इल्ली
    summary: तितली या पतंगे का लार्वा चरण, जो पत्तियाँ खाकर कायांतरण की तैयारी करता है।
    info: |-
      इल्ली तितली या पतंगे का लार्वा है, जो पत्तियाँ खाकर कायांतरण के लिए ऊर्जा जमा करती है।
      कुछ चटख रंगों की होती हैं जो उनके ज़हरीलेपन की चेतावनी देती हैं।
      पूर्ण कायांतरण कोया (प्यूपा) के भीतर होता है।
  insect.centipede:
    label: कनखजूरा
    summary: शरीर के हर खंड पर एक जोड़ी टाँगों वाला संधिपाद।
    info: |-
      कनखजूरा बहुपाद वर्ग का है, इसके हर खंड पर एक जोड़ी टाँगें होती हैं, और नाम के बावजूद इसकी टाँगें ज़रूरी नहीं कि सौ हों।
      यह तेज़ शिकारी है जो कीट, केंचुए और छोटे कशेरुकी जीव खाता है।
      इसकी पहली जोड़ी टाँगें ज़हर छोड़ने वाले पंजों में बदल गई हैं।
      कुछ उष्णकटिबंधीय प्रजातियाँ 30 सेंटीमीटर से भी लंबी होती हैं।
  insect.cicada:
    label: सिकाडा
    summary: गर्मी के दिनों में ऊँची आवाज़ में गाने के लिए प्रसिद्ध कीट।
    info: |-
      सिकाडा गर्मी के दिनों में सबसे तेज़ आवाज़ वाले कीटों में से एक है।
      नर अपने पेट के एक विशेष अंग से आवाज़ निकालकर मादा को आकर्षित करता है।
      उत्तर अमेरिका की कुछ प्रजातियों का जीवनचक्र 13 या 17 साल का होता है।
      निम्फ़ वर्षों तक ज़मीन में रहकर जड़ों का रस पीती हैं।
  insect.cockroach:
    label: तिलचट्टा
    summary: रात में सक्रिय, सर्वाहारी, बेहद सख्तजान और अनुकूलनशील कीट।
    info: |-
      तिलचट्टा सबसे सख्तजान कीटों में से एक है और उन कठोर परिस्थितियों में भी टिका रहता है जो दूसरों के लिए घातक हों।
      इसकी 4,000 से अधिक प्रजातियाँ हैं, पर केवल लगभग तीस ही इंसानों के पास रहती हैं।
      यह एक प्राचीन कीट है जो डायनासोर से भी पहले, करोड़ों साल से मौजूद है।
  insect.crane_fly:
    label: क्रेन मक्खी
    summary: बहुत लंबी टाँगों वाली, विशाल मच्छर जैसी दिखने वाली बड़ी मक्खी।
    info: |-
      क्रेन मक्खी विशाल मच्छर जैसी दिखती है, पर न काटती है न परजीवी होती है।
      इसकी बहुत लंबी टाँगें बचाव के तौर पर आसानी से टूट जाती हैं।
      वयस्क कुछ ही दिन जीता है और लगभग कुछ नहीं खाता।
  insect.cricket:
    label: झींगुर
    summary: रात में सक्रिय कीट जिसका नर अपनी झंकार के लिए जाना जाता है।
    info: |-
      झींगुर टिड्डा-गण का रात्रिचर कीट है।
      नर अपने पंखों को रगड़कर झंकार निकालता है जो मादा को आकर्षित करती है और उसका इलाका बताती है।
      एशिया में इसे इसकी आवाज़ के आनंद के लिए प्राचीन काल से पाला जाता रहा है।
  insect.damselfly:
    label: छोटी व्याध-पतंग
    summary: व्याध पतंग जैसी पर पतली, जो विश्राम में पंख समेट लेती है।
    info: |-
      छोटी व्याध-पतंग व्याध पतंग की नज़दीकी रिश्तेदार है पर उससे पतली, और विश्राम में अपने पंख शरीर के समांतर समेट लेती है।
      यह उड़ते हुए छोटे कीट पकड़ने वाली शिकारी है, और इसके लार्वा पानी में रहते हैं।
      यह पानी की स्वच्छता की सूचक मानी जाती है।
  insect.diving_beetle:
    label: गोताखोर भृंग
    summary: शिकार की तलाश में पानी के नीचे तैरने वाला शिकारी भृंग।
    info: |-
      गोताखोर भृंग तालाबों और ठहरे पानी में रहने वाला तैराक शिकारी भृंग है।
      इसकी चपटी पिछली टाँगें चप्पू की तरह काम करती हैं और यह सहजता से तैरता है।
      यह सतह पर आकर पंखों के नीचे हवा भरता है, और कीट, लार्वा तथा छोटी मछलियाँ खाता है।
  insect.dragonfly:
    label: व्याध पतंग
    summary: लंबे शरीर और दो जोड़ी पारदर्शी पंखों वाला कीट।
    info: व्याध पतंग तेज़ दृष्टि वाला शिकारी कीट है जो पानी के पास शिकार करता है।
  insect.dung_beetle:
    label: गुबरैला
    summary: गोबर के गोले लुढ़काने वाला भृंग, जो प्राचीन मिस्र में पूजनीय था।
    info: |-
      गुबरैला गोबर के गोले बनाकर लुढ़काता है, फिर उन्हें दबाकर उनमें अंडे देता है।
      प्राचीन मिस्र में यह सूर्य और देवता खेपरी का प्रतीक था।
      यह एकमात्र ज्ञात प्राणी है जो आकाशगंगा के प्रकाश से दिशा तय करता है।
      यह पोषक तत्वों के पुनर्चक्रण और मिट्टी सुधारने में मदद करता है।
  insect.earwig:
    label: चिमटी-कीट
    summary: पेट के सिरे पर चिमटी वाला लंबा कीट।
    info: चिमटी-कीट के बारे में यह मान्यता है कि यह कान में घुस जाता है, पर यह केवल एक निराधार मिथक है।
  insect.firefly:
    label: जुगनू
    summary: साथी को आकर्षित करने के लिए जैव-प्रकाश छोड़ने वाला कीट।
    info: |-
      जुगनू अपने पेट के सिरे से ठंडा प्रकाश छोड़ता है।
      नर और मादा अलग-अलग चमक-पैटर्न से एक-दूसरे को पहचानते और आकर्षित करते हैं।
      यह प्रकाश ल्यूसिफ़ेरिन नामक पदार्थ की एक एंज़ाइम के साथ रासायनिक क्रिया से बनता है।
      यह स्वच्छ प्राकृतिक पर्यावरण का सूचक है।
  insect.flea:
    label: पिस्सू
    summary: स्तनधारियों और पक्षियों का खून चूसने वाला और दूर तक कूदने वाला छोटा परजीवी कीट।
    info: |-
      पिस्सू पंखहीन कीट है जो अपनी मज़बूत पिछली टाँगों से शरीर की लंबाई से सैकड़ों गुना दूर कूदता है।
      यह स्तनधारियों और पक्षियों का खून चूसता है और रोग भी फैला सकता है।
      इतिहास में यह प्लेग महामारी फैलाने के लिए कुख्यात रहा है।
  insect.fly:
    label: घरेलू मक्खी
    summary: गंदगी ढोने वाली आम मक्खी जो रोग फैला सकती है।
    info: |-
      घरेलू मक्खी (Musca domestica) इंसानी बस्तियों के आसपास सबसे आम मक्खी है।
      अपनी संयुक्त आँखों से यह लगभग 360 डिग्री देख सकती है।
      यह कूड़े और भोजन पर बैठकर जीवाणु फैलाती है।
      इसके उड़ने वाले पंखों की एक ही जोड़ी होती है, दूसरी जोड़ी उड़ान संतुलित करती है।
  insect.goliath_beetle:
    label: गोलियथ भृंग
    summary: भूमध्यरेखीय अफ्रीका का, दुनिया के सबसे भारी कीटों में से एक।
    info: |-
      गोलियथ भृंग दुनिया के सबसे भारी कीटों में से एक है, जिसके नर का वज़न लगभग 100 ग्राम और लंबाई 11 सेंटीमीटर से अधिक होती है।
      यह भूमध्यरेखीय अफ्रीका के वर्षावनों में रहता है।
      वयस्क फल और पेड़ों का रस खाता है, और संग्राहकों के बीच लोकप्रिय है।
  insect.grasshopper:
    label: टिड्डा
    summary: लंबी पिछली टाँगों से कूदने वाला शाकाहारी कीट।
    info: |-
      टिड्डा टिड्डा-गण का कीट है जिसकी मज़बूत पिछली टाँगें उसे शरीर की लंबाई से कई गुना दूर कुदाती हैं।
      नर अपनी जाँघ को पंख से रगड़कर विशिष्ट आवाज़ निकालता है।
      यह शाकाहारी है, और इसके बड़े झुंड फसलों को भारी नुकसान पहुँचा सकते हैं।
  insect.ground_beetle:
    label: ज़मीनी भृंग
    summary: पत्थरों और पत्तियों के नीचे रहने वाला तेज़ शिकारी भृंग।
    info: |-
      ज़मीनी भृंग भूमि-भृंग कुल का कीट है।
      अधिकांश सक्रिय रात्रिचर शिकारी होते हैं जो दूसरे कीट, केंचुए और घोंघे खाते हैं।
      ये तेज़ी से चलते हैं और खतरे में तुरंत भाग जाते हैं।
      कुछ प्रजातियों में सुंदर धात्विक चमक होती है, और ये स्वस्थ मिट्टी की सूचक हैं।
  insect.hornet:
    label: बर्रे
    summary: यूरोप का सबसे बड़ा ततैया, तेज़ डंक और ऊँची गूँज वाला।
    info: |-
      बर्रे यूरोप का सबसे बड़ा सामाजिक ततैया है और लगभग 3.5 सेंटीमीटर लंबा होता है।
      यह पेड़ों के खोखलों या छतों के नीचे कागज़ जैसा छत्ता बनाता है।
      इसका डंक आम ततैया से लंबा और अधिक पीड़ादायक होता है, पर यह केवल सीधे खतरे में डंक मारता है।
      यह दूसरे कीटों का महत्वपूर्ण शिकारी है।
  insect.hoverfly:
    label: फूल-मक्खी
    summary: मधुमक्खी जैसी दिखने वाली पर बिना डंक वाली, बगीचे की अहम परागणकर्ता मक्खी।
    info: |-
      फूल-मक्खी शिकारियों से बचने के लिए मधुमक्खी और ततैया के रंगों की नकल करती है (बेट्सी नकल)।
      पर असल में यह डंक नहीं मारती।
      यह अहम परागणकर्ता है और मधुमक्खी से अधिक तरह के फूलों पर जाती है।
      कुछ प्रजातियों के लार्वा माहू खाते हैं।
  insect.lacewing:
    label: फीता-पंख कीट
    summary: पारदर्शी जालीदार पंखों वाला कीट, जिसके लार्वा माहू खाते हैं।
    info: |-
      फीता-पंख कीट के पंख पारदर्शी और जालीदार होते हैं और आँखें सुनहरी।
      इसके लार्वा बड़ी संख्या में माहू खाते हैं, इसलिए ये प्राकृतिक कीट-नियंत्रक हैं।
      वयस्क पराग और मकरंद खाता है और प्रकाश की ओर आकर्षित होता है।
  insect.ladybug:
    label: सोनपंखी
    summary: काले धब्बों वाला छोटा गोल लाल कीट।
    info: सोनपंखी बगीचे के लिए उपयोगी कीट है, क्योंकि यह माहू खाती है।
  insect.locust:
    label: टिड्डी
    summary: लाखों की संख्या में विनाशकारी झुंड बनाने वाला टिड्डा।
    info: |-
      टिड्डी एक टिड्डा है जो कुछ परिस्थितियों में विशाल प्रवासी झुंड बनाता है।
      एक झुंड में अरबों कीट हो सकते हैं और वह एक ही दिन में बड़े कृषि-क्षेत्र उजाड़ सकता है।
  insect.louse:
    label: जूँ
    summary: मेज़बान के शरीर पर रहने वाला छोटा पंखहीन परजीवी कीट।
    info: |-
      जूँ पंखहीन परजीवी कीट है जो मेज़बान की त्वचा और बालों पर रहती है।
      यह खून चूसती है और खुजली पैदा करती है।
      सिर की जूँ दुनिया भर में आम है और साफ़-सफ़ाई की परवाह किए बिना बच्चों को लगती है।
      इतिहास में इसने टाइफ़स जैसे रोग फैलाए हैं।
  insect.mayfly:
    label: अल्पायु मक्खी
    summary: कीट जिसका वयस्क केवल कुछ घंटे या दिन जीता है।
    info: |-
      अल्पायु मक्खी क्षणभंगुरता का प्रतीक है, इसका वयस्क कुछ घंटों से एक दिन तक ही जीता है।
      इसका मुँह अविकसित होता है, इसलिए यह कुछ नहीं खाता।
      निम्फ़ पानी में एक से तीन साल तक रहती है।
  insect.mosquito:
    label: मच्छर
    summary: दो पंखों वाला कीट जिसकी मादा खून चूसती है और रोग फैला सकती है।
    info: |-
      मच्छर मच्छर-कुल का दो पंखों वाला कीट है।
      मादा अंडों के लिए प्रोटीन पाने हेतु खून चूसती है, जबकि नर मकरंद खाता है।
      यह मलेरिया और डेंगू जैसे खतरनाक रोग फैलाता है।
  insect.moth:
    label: पतंगा
    summary: तितली का रिश्तेदार, रात में सक्रिय, जो विश्राम में पंख बगल में फैलाकर रखता है।
    info: |-
      पतंगा तितली का नज़दीकी रिश्तेदार है (शल्क-पंख गण का), पर विश्राम में यह अपने पंख तितली से अलग, बगल में फैलाकर रखता है।
      कई प्रजातियाँ कृत्रिम प्रकाश की ओर आकर्षित होती हैं।
      रेशम के कीड़े का लार्वा प्राकृतिक रेशम बनाता है।
      चंद्र-पतंगा दुनिया के सबसे सुंदर पतंगों में गिना जाता है।
  insect.praying_mantis:
    label: प्रार्थी कीट
    summary: प्रार्थना जैसी मुद्रा और बिजली सी तेज़ मार वाला शिकारी कीट।
    info: |-
      प्रार्थी कीट का नाम इसलिए पड़ा क्योंकि यह अपनी अगली टाँगें प्रार्थना करते हुए की तरह जोड़े रखता है।
      यह पलक झपकते अपनी अगली टाँगें फेंककर शिकार दबोच लेता है।
      कुछ प्रजातियों में मादा संभोग के बाद नर को खा जाती है।
  insect.robber_fly:
    label: लुटेरी मक्खी
    summary: हवा में दूसरे कीट झपटकर पकड़ने वाली शिकारी मक्खी।
    info: |-
      लुटेरी मक्खी शिकारी मक्खी है जो उड़ते हुए दूसरे कीटों का शिकार करती है।
      शिकार पकड़ने के लिए इसकी मज़बूत टाँगें और लकवा करने वाला ज़हर छोड़ने वाला नुकीला मुँह होता है।
      कुछ प्रजातियाँ बचाव के लिए मधुमक्खी या ततैया की नकल करती हैं।
  insect.scorpion:
    label: बिच्छू
    summary: दो पंजों और मुड़ी हुई ज़हरीली पूँछ वाला अष्टपादी।
    info: |-
      बिच्छू एक अष्टपादी (कीट नहीं) है, जिसके दो पंजे और मुड़ी हुई पूँछ के सिरे पर ज़हरीला डंक होता है।
      यह बहुत प्राचीन प्राणी है, इसके सबसे पुराने जीवाश्म लगभग 43 करोड़ साल पुराने हैं।
      पराबैंगनी प्रकाश में इसका शरीर चमकता है।
      लगभग 2,500 प्रजातियों में से केवल 25 के आसपास ही इंसान के लिए खतरनाक हैं।
  insect.silverfish:
    label: सिल्वरफ़िश
    summary: घर में किताबों और कागज़ के पास मिलने वाला छोटा, फुर्तीला, पंखहीन कीट।
    info: |-
      सिल्वरफ़िश घरों में रहने वाला एक प्राचीन, पंखहीन कीट है।
      यह स्टार्च, कागज़, किताबों की गोंद और रेशे खाती है।
      इसका नाम इसके चाँदी जैसे रंग और मछली जैसी लहराती चाल से पड़ा।
      यह सबसे पुराने कीटों में से एक है, जो करोड़ों साल से लगभग अपरिवर्तित है।
  insect.spider:
    label: मकड़ी
    summary: आठ टाँगों वाला संधिपाद जो कीट पकड़ने के लिए जाला बुनता है।
    info: |-
      मकड़ी एक अष्टपादी (कीट नहीं) है, जिसकी आठ टाँगें और दो हिस्सों का शरीर होता है।
      यह रेशम बनाती है जिससे जाला बुनती है और अपने शिकार तथा अंडों को लपेटती है।
      दुनिया में लगभग 48,000 मकड़ी प्रजातियाँ हैं।
      सभी ज़हर बनाती हैं, पर अधिकांश इंसान के लिए हानिरहित हैं।
  insect.stag_beetle:
    label: हिरण भृंग
    summary: यूरोप का सबसे बड़ा भृंग, जिसके नर के जबड़े सींगों जैसे होते हैं।
    info: |-
      हिरण भृंग (Lucanus cervus) यूरोप का सबसे बड़ा भृंग है, जिसकी लंबाई लगभग 7 सेंटीमीटर तक होती है।
      नर के हिरण के सींग जैसे विशाल जबड़े होते हैं, जिनसे वह मादा के लिए लड़ता है।
      लार्वा सड़ी हुई बलूत की लकड़ी में सात साल तक रहता है।
  insect.stick_insect:
    label: टहनी-कीट
    summary: टहनी या पत्ती की हूबहू नकल करने वाला कीट।
    info: |-
      टहनी-कीट पर्ण-कीट गण का है और छद्मावरण में माहिर है।
      इसका शरीर टहनियों और पत्तियों की हूबहू नकल करता है।
      खतरे में यह पूरी तरह निश्चल रहता है।
      कुछ प्रजातियाँ बिना नर के प्रजनन करती हैं, और इसे देखने के लिए पालतू के रूप में रखा जाता है।
  insect.termite:
    label: दीमक
    summary: मिट्टी से विशाल टीले बनाने वाला सामाजिक कीट।
    info: |-
      दीमक एक सामाजिक कीट है जिसका चींटी से दूर का रिश्ता है।
      यह कॉलोनियों में रहती है जिनमें राजा, रानी, सैनिक और श्रमिक होते हैं।
      उष्णकटिबंधीय इलाकों में यह जटिल टीले बनाती है, जिनकी ऊँचाई लगभग 9 मीटर तक होती है और उनमें वायु-संचार व्यवस्था होती है।
  insect.tiger_beetle:
    label: बाघ भृंग
    summary: बहुत तेज़, तीव्र दृष्टि वाला, धात्विक चमक वाला शिकारी भृंग।
    info: |-
      बाघ भृंग तेज़ दौड़, उड़ान क्षमता और तीव्र दृष्टि वाला शिकारी भृंग है।
      इतनी तेज़ी से दौड़ता है कि दौड़ते समय इसकी दृष्टि धुंधला जाती है, इसलिए यह रुककर दिशा फिर से तय करता है।
      इसका शरीर हरे, नीले और लाल धात्विक रंगों में चमकता है, और इसकी दो बड़ी आँखें होती हैं।
      इसके लार्वा मिट्टी में सीधी सुरंगें खोदकर मुँह पर छिपे रहकर शिकार की ताक में रहते हैं।
  insect.velvet_ant:
    label: मखमली चींटी
    summary: चटख रोओं से ढकी, बेहद पीड़ादायक डंक वाली पंखहीन मादा ततैया।
    info: मखमली चींटी असल में एक पंखहीन मादा ततैया (Mutillidae कुल) है, जो मखमल जैसे रोओं से ढकी होती है और चींटी जैसी दिखती है।
  insect.wasp:
    label: ततैया
    summary: कागज़ जैसे छत्ते बनाने वाला पीले-काले रंग का डंकदार कीट।
    info: ततैया पीले और काले चेतावनी रंगों वाला डंकदार कीट है जो कागज़ जैसे पदार्थ से अपना छत्ता बनाता है।
  insect.water_strider:
    label: जल-पथिक कीट
    summary: पृष्ठ-तनाव के सहारे ठहरे पानी की सतह पर चलने वाला छोटा कीट।
    info: जल-पथिक कीट पानी में डूबे बिना उसकी सतह पर चलता है, जो पृष्ठ-तनाव और उसकी जल-विकर्षक रोओं वाली टाँगों की बदौलत संभव होता है।
  insect.weevil:
    label: घुन
    summary: विशिष्ट लंबे थूथन वाला छोटा भृंग।
    info: |-
      घुन एक छोटा भृंग है जो घुन-कुल का है, जो जंतु-जगत के सबसे बड़े कुलों में से एक है और इसमें 60,000 से अधिक प्रजातियाँ हैं।
      अपने विशिष्ट लंबे थूथन से यह फलों और पेड़ों के तनों में छेद करता है।
      कुछ प्रजातियाँ अहम कृषि-कीट हैं, जैसे कपास का घुन, और कुछ एक ही पौधे तक सीमित रहती हैं।
  insect.whirligig_beetle:
    label: भँवर-भृंग
    summary: पानी की सतह पर झुंड में गोल-गोल घूमने वाला जलीय भृंग।
    info: |-
      भँवर-भृंग एक जलीय भृंग है जो पानी की सतह पर झुंड में गोल-गोल घूमकर शिकार करता है और शिकारियों से बचता है।
      इसकी आँख दो हिस्सों में बँटी होती है, एक हिस्सा पानी के ऊपर देखता है और दूसरा नीचे।
