lang: he
pivot: false
title: 곤충
cards:
  insect.ant:
    label: '"ג''נגל"'
    summary: '{"summary":"חרק חברתי קטן המושב בkolonies."}'
    info: '{"info":"ג''נגל הוא חרק שמקים קולוניות גדולות עם 분업."}'
  insect.antlion:
    label: מרואלוונים
    summary: טיפוס של טפילי אוכלים שנוצרות על ידי חורים קטנים כדי ללכוד נמלים.
    info: מראולוון הוא חרק נסמן מהמשפחה Mravkolev, שמורכבת מחרקים צעירים שמחפשים דוברים למשוך את הנמלים אל תוך פיתיונות בצורת חרוט בדשא יבש. כאשר נמרץ מתגלגל לתוך הפיטרון, המרואלוון תופס אותו עם סנippers ומעביר לו רעל עיכול.
  insect.aphid:
    label: 韭蚜
    summary: 작은 식물 줄기에서 주스를 빨아먹는 곤충; 꿀 같은 물질을 생성함.
    info: '{"hint":"חרש קטן שמסופג חלב צמחים (אפידידה)، נמצא על ענפים של צמחי", "info":"韭蚜蟲是屬於 aphidoidea 超科的微小吸食昆蟲，牠們以植物汁液為生。\n它會分泌出甜美的蜜露，在保護換取食物的情況下由螞蟻照顧。\n繁殖速度極快；一年內一隻雌性個體就能產生數百萬後代。\n它是農作物的重要害虫。","label":"韭蚜","summary":"小型吸取植株枝幹汁液的小型昆虫；产生蜂蜜状物质。"'
  insect.atlas_moth:
    label: מארטינאץ' אטלס
    summary: אחד מה벌יטים הגדולים בעולם עם צלעות ממוסגרות בדפוסי נחשים.
    info: '{"hint":"หนึ่งในแมลงปีกแข็งขนาดใหญ่ที่สุดของโลก (Attacus atlas)","info":"มาร์ตินาช อัตราซัสเป็นผีเสื้อคืนวันชนิดหนึ่งจากจำนวนไม่มากนักบนพื้นโลก มีความยาวระหว่างสองข้างหลังกว่าถึง 30 เซนติเมตร\nขอบปีกก้านของเขาแต่งด้วยลวดลายคล้ายหัวงูเพื่อดับจิตใจศัตรู \nผู้เตี้ยโตจะไม่มีปากและอาหารใด ๆ และสามารถอยู่ได้นานแค่หลายวันเท่านั้นในฐานะผู้เตี้ยก่อนตาย\.\nพวกเขาอาศัยอยู่ในเขตภูเขาเขตร้อนทางตะวันออกเฉียงใต้แห่งเอเชีย","label":"มาร์ตินาช อัตราซัส","summary":"หนึ่งในผีเสือขนาดใหญ่ที่สุดของโลกรอบร้อยโดยการใช้งานแบบแผนงูกำมะถะ."}'
  insect.bedbug:
    label: שניצת
    summary: חרך שדבקני שמגבה דם בלילות ונמצא בחורים בנתח
    info: קימקס ליקטולריוס הוא חרק פלפלובן מהמשפחה קיםידאיי פעיל בעיקר בלילה. מแทง ומסיר דם של המארח הנائم. נחבא בשפופות במזרנים ובמטעמים וכן מתחת לתפריטאות.
  insect.bee:
    label: 蜇蜂
    summary: 黃黑相間的昆蟲，會為花朵授粉並製造蜂蜜。
    info: '{"hint":"חיה דביקה מעוררת ריחות שמגיעה לבניית פתרן (אפיס מליפארה)","info":"וַצ''לָא מֵדוֹנּוסְנוֺס אמיצה היא חיות חברתית שחיים במחצלת ו собирают נectar","label":"蜇蜂","summary":"חרש צבעוני yellow-and-black המ опыמים פרחים ומפיקי мед."}'
  insect.beetle:
    label: בְרוֹק
    summary: ברוקים יוצרים סדרה גדולה ביותר עם יותר מ - 400,000 מיני חיים.
    info: חרש הוא חלק מהסדר קוליאופטרה ומכיל כ - 40% מכלל המינים של חרקים תוארים. הם מאבדדים את הכנפיות הקשיחות שלהם (אליטרא) שמתחתן נמצאות הכנפים האמיתיות לרחיפה.
  insect.bombardier_beetle:
    label: סטרבליק דילה סטראליקה
    summary: חיפה שמזריע אבקה מאירה וקטונית כתגובה הגנה
    info: 'סטברليك דילוסטרלקי הוא חיפושי ממשפחת הברהינינה שמתגונן בדרך ייחודית: מעורבבין שני תרכובות כימיות בזקנו מהווצרת תגובה נפיצה בטמפרטורה של מעל ל-100מערבת גידול טוקסיניים גבוה מאוד פוגעים באשפים עם רעש חזקה עד 500 פעמים בשנייה'
  insect.bumblebee:
    label: bumber
    summary: חיה תלתול עם צלצלה עמוקה שמ служ כמנקה.
    info: בומברוס הוא חרק גדול ו털ת מהסוג בומבוס קרוב לחרקים המפוזרים במים. זהו מנקה חשוב במיוחד בסביבות קרירות שבהן ה벌דנים לא טסים כל כך הרבה בגלל הטמפרטורה הנמוכה. הבומרוס יכול להתחמם על ידי רעידת שרירי الطيران שלו כדי לטוס גם אם الجو קריר.
  insect.butterfly:
    label: פריפור
    summary: חרך טען שמצליף בכנייםו המ색וניים והגדולים.
    info: '{"hint":"חרש טעון שד עם כנפי סקלים גדולות ומסודרות","info":"פרפר הוא חרק בעל זוג צלעות של קורת אבקה מנצנצת, לעתים בצבעי תבניות ניכרים.","label":" פרפור","summary":"חרך טען שמצליף בכנותיו הגדולים."}'
  insect.caterpillar:
    label: טפור
    summary: תינוק לפרווה למירה; לוכד עלים ומתרגל להתבגר.
    info: טפר הוא תינוק של פרוותי או מורה ועובר את חייו בליקוט עלים כדי לאסוף אנרגיה להפיכה שלו. חלק מהטיפרים בעלי צבעים נראיים שמזהירים טורפים독ם.
  insect.centipede:
    label: stinoga
    summary: בעל חיים עם זוג יחיד של רגיים לכל חלק גוף.
    info: סטנוגזה שייכת לסדר ציפודא ומכילה זوج אחד של רגליים בכל קטע בגופה (ולא מאה רגל כמו שמראה השם). זו טורף מהיר שמאכלס חרקים, דבורות ודובבי עיניים קטנים. הזוג הראשון של הרגליים מומר לחפצי פליז כדי להשבית את האכילים.
  insect.cicada:
    label: 螽斯
    summary: 一種以其在炎熱天氣中發出的高聲鳴叫而聞名的昆蟲。
    info: '{"hint":"곤충(Cicadidae), 수컷은 시끄러운 윙윙 소리를 낸다","info":"ციკადოეიძების ოჯახში მყოფი პროტეულით ნაგვის ჰქონდა წამოწყებული ზღაპარის ჩამოყალიბების ერთ–ერთი უხილავი მოვლენა.","label":"ციკადა","summary":"პროტეულით ნაგვის ჟანგის საშინელი სახე."}'
  insect.cockroach:
    label: '"שעב"'
    summary: חרטוע לيلي מהיר ואכל כל הוא עמיד במיוחד ומסתגל בקלות.
    info: '{"hint":"חיה אוכל הכל בלילה מהיר"}'
  insect.crane_fly:
    label: טיפולה
    summary: חרך דומה לנגיף עם רגליים ארכות במיוחד.
    info: טיפולקה הוא חרק דו כנף מהמשפחה טיפולידיאה המזכיר מבחינה חזותית נגיף ענק אך אינו מנגח וไม שיכור. הרגליים האקזוטיות שלו קלות ב جدا ונשברות בקלות - זהו آلגורם הגנה ידוע בשם אאוטומיה. מבוגרים חיים רק מספרימים ואינם צופלים או ספמים עלnectר. הדבשות שלהם חיוא בסלע והן אוכלים גבעולים.
  insect.cricket:
    label: גרילה
    summary: חרק לילי ידוע בצחוק הצלילים שנוצר ע
    info: ג'רילוס פולני הוא חרק לيلي מהסדר האורתופטרה. הזכרים משמיעים צווחה על ידי찰וק החצאיות שלהם זה לזה כדי לגעת בנקבות ולשמרה שטח טוריטוריום. באסיה גירילות נועדו באופן מסורתי כחיידקים לבית עבור קולה הנעים והם גם סמל של ביתיות ושמחה בכמה תרבויות.
  insect.damselfly:
    label: شيدلتكه
    summary: חיה苗条 עם כנפים מקפלות בגוף
    info: שידלטקה הוא חרק דומה לדרקניטים אך יותר苗条 וכאשר ישוב שקט מקפל את הכנפיו במקביל לגופו בניגוד לדרכנים. זהו טורף שמצלם ציפורן קטנה באוויר במהלך הטיסה שלו. נימפותיו חיות במياه ונחשבת לא组成部分 חשובה של מערכות אكوוסמיות מים.
  insect.diving_beetle:
    label: flattnik
    summary: predatory aquatic insect swimming underwater
    info: |-
      פלטן גדול הוא חרק טורף ממשפחת הדיטיסקידה המ חי בריכים במימי עומס ומים נייחות.
      The flattnik flies at night both on water surfaces.
  insect.dragonfly:
    label: '"תולעת"'
    summary: '{"summary":"חרק באורך גוף ארוך ושני זوجות כנפי שקופיות"}'
    info: '{"info":"חגורה היא חרק טורף עם היקפית חזקה מאוד ופוגע באזורים מימי."}'
  insect.dung_beetle:
    label: וראבון
    summary: חיפוששא רוללת כדורי בוץ, קדושים באמפטוס העתיק
    info: |-
      וְרָבוּן פִסַח הוא חיפושי ממשפחת הסקראבאיידהה שמעצבת בוץ לכדוריות ו롤לות אותן להטמינו ולimpanית תخمם
      הוא היה סמל של השמש והאל כפריס באימפטוס העתיק
      זה אחד מהחיות נדירות שמכוונות לפי שביל החלוצים
  insect.earwig:
    label: שְׁקוֹרו
    summary: חרך ארוך עם כף באצבע
    info: שקור הוא חרק מהסדר דרמפטרה עם כפפות אבקיות בקצות הרגליים האחוריים המשמשות הגנה וזוגיה. השם נגזר מאמוואה לפיהם הם מתسلפים לתוך האוזניים של בני אדם - זהו שקר.נקבות השקורים ידועות בכך שהן משמרנות את הביציים והטיפוסים המוקדים שלהן – תופעה נדירה אצל חסרי חוליות.
  insect.firefly:
    label: śwיטлушיקה
    summary: חבלת ייצור אור ביולוגי משך לגעת בן.
    info: śwיתלושקה היא ח벌ת זחלים ממשפחת Lampridae המסוגלת לייצר אור קפוא (ביו люמינו סנציה). גם הזכרים וגם הנקבות פולטים אורות בצירופי צבע שונים כדי לזהות אחד את השני והמשוך אותם. התהליך נשלט על ידי תגובה כימית של לוציפרין עם לוציפוראזא.
  insect.flea:
    label: بلולה
    summary: חרק קטן וה_salivant blood mammals ועופרות.
    info: בּלֵכָה היא חרק ללא כנפיים מהסדר סיפונאפטרה המתקדם על דרך חיים פרזיטי. הרגלי зад חזקים שלה מאפשרות קפיצה של יותר מפעמיים מאורך גופה. בלבולת נושאת דם mammals ועופרים והיא יכולה לה전ית玻璃病; בהיסטוריה ידוע שבלבולות מעבירות תifo.
  insect.fly:
    label: 苍蝇
    summary: 一種普通的雙翅類昆蟲，能夠攜帶並散佈細菌。
    info: |-
      蒼蝇是人類住宅中最常見的雙翅昆蟲。
      其複眼使其幾乎能環視四周達360度。
      它會在垃圾和食物上著陸，因此傳播細菌。
      牠只有一對功能性的翅膀；第二對（稱為楫足）用於飛行時保持平衡。
  insect.goliath_beetle:
    label: גוליה
    summary: אחד החרקים הכי גדולים והכי 무ובדים באמריקה
    info: גוליית האפריקאי הוא אחד מה벌טים הגדולים בעולם; הזכרים משקלים עד 100 גרם ומסתדרים לאורך של יותר מ־11 ס
  insect.grasshopper:
    label: locust
    summary: Jumping insects with long back legs that make noise.
    info: '{"hint":" insekt קופץ עם רגליзадניות ארוכות (סדרה אורתופטרה)","info":"קיפוד הוא חרק מהסדר האורטופטרא עםרגלי зад חזקות המאפשרות קפיצות עד לعشרינית מאורך הגוף.\nThe males produce characteristic sound by rubbing their thighs against wings. \They feed on plants; large swarms can cause damage to crops","label":" locust ","summary":" Jumping insects with long back legs that make noise."}'
  insect.ground_beetle:
    label: 斯特沃尔尼克
    summary: живущий под камнями и листьям быстрый хищный жук
    info: סטרווליק הוא נמלה ממשפחת הקארבידאה; מרבית הסוגים פעילים בלילה ופונדים על חרקים אחרים, דבורות ואוכלי עלים. הם מהירים מאוד והם זורחים במהירות כאשר מזהים סיכון.
  insect.hornet:
    label: סרחן
    summary: הוסת האורבита השקטית והחזקה עם חנית חזק
    info: הסרחן הוא החרש הגדול ביותר באירופה וגדל לאורך של יותר מ־3.5 ס
  insect.hoverfly:
    label: פרוץ
    summary: דורה עם צבעוני כמו ויס ודוברים, מעוררת זיהום באגמים.
    info: |-
      פרצ'נקה הוא חרק דו כנף מהמשפחה סירפידה, שמתאים את צבעיו של וס ונחלים כדי להגן על עצמו ממכשולים (מימיקרא באתזוסקית) למרות שאינו נ螫ט בעצמו.
      is חשוב ל授ת עמלות因为在 גינות ובשטחים פתוחים אחרים, פרוצ'ניקי מבקרים יותר סוגים של צמחים מאשר דבורים.
      is מתغذي על רוטב ואבק אבק,
      is לבני החרקים יש תינוקות שמصطילה פטריות, מה שעוזר בגינה.
  insect.lacewing:
    label: زلوואוקה
    summary: חגורה עדינה עםкрыл קורי דרכי; לארבות יש תכונות טורפיות.
    info: זלוואוקה היא חרק מהמשפחה כריזופידיאה עםкрыים דרכיים שקורים ועם עיניים זהובות. החרקים הם טורפים ונרגשים מצריכי ניקוד עצומים של זחלנים, ולכן משמשים הגנה טבעית על צמחייה. בוגרים אוכלים רוטב פרחים ואבקת פולן.
  insect.ladybug:
    label: brushka
    summary: חובל אדום מעוגול קטן עם точки שחורות.
    info: '{"hint":"חרטומה אדומה עגולה קטנה עם נקודות שחורות (Coccinellidae)","info":"ברושקה הוא ח벌 קטן שמאכלת מזיקים והיא полезна בגינה.","label":"brushka","summary":"חובלה אדום מעוגל קטן עם תчки שחורות."}'
  insect.locust:
    label: '"كيبود مهاجر"'
    summary: القُرَدّة المهاجِرة تشكيل كتلة هائلة من الآلاف.
    info: |-
      {"hint":"קיפוד טפילי שמייצר גושים אгрסיביים","info":"השחף המigrating הוא סוג של קיפוד שמתרבץ תחת ظروف מסוימות ליצירת מוניים ענקיים נעולים.
      The colony יכולה להכיל миллиארד פרטים ולהרוס את כל היקום על פני אלפי דונם ביום אחד.
      biblically ובמדינות האפרית והאסיאנית השחפים היו תמיד חלק מה thảונות חקלאיות הגדולות ביותר בהיסטוריה.
      בספרא הם נחשבים לאחד מעשר פLAGS מצריים."}
  insect.louse:
    label: 베什
    summary: חיה קטן וחסר כנף שמגביר את עורו ושערו של יונקים.
    info: בֶשׂ הוא חרק פרזיט ללא כנפיים מהסדר פתירפרטרא שחי על העור והשיער או השיערות של המארחים שלו.牠 מושך דם וגורם לדרמטולוגיה רעילה. ביש צעירים (벼 ראשוני) נפוצים ברחבי העולם ואffect ילדים בלי קשר לתנאי היגיינה.
  insect.mayfly:
    label: גיפצה
    summary: חרק עם החיים הבוגריים הקצירים ביותר - הוא חי ساعات ועדימים.
    info: |-
      ג'פיצה היא חרק מהסדר האפילימרופטרה והיא סמל ל暂短的生命；בוגרים חיים שעות עד ימים בלבד
      לها אין מערכת פה תפקודית כלל ואין להן אכילה בכלל。
      nymphs חייה מתחת המים בין שנה לבין שלוש שנים.
      The mass emergence of mayflies is an amazing natural spectacle; their massive spawning on the Danube River in Hungary represents a unique phenomenon.
  insect.mosquito:
    label: แมลงหวี่
    summary: แมลงสองปีงที่ดูดน้ำเลือดจากสิ่งมีชีวิต เพื่อนำไปใช้ในการเจริญเติบโตของไข่ โดยเฉพาะในเพศเมียเท่านั้น นอกจากนี้ยังเป็นพาหะนำเชื้อร้ายบางชนิดให้มายังมนุษย์
    info: |-
      {"hint":" insekte טורף דם מרחפים","info":"แมลงหวี่คือ 昆虫双翅目科。
      ผู้เมียดูดน้ำเลือบสัตว์เพื่อได้โปรตีนสำหรับการพัฒนาไข่ของมัน; ส่วนผู้จะกินnectar
      ยุงสามารถแพร่เชื้อก่อโรค เช่น มอลเรีย เดร้งเก และซิกาไวรัส
      dot ในโลกมีมากกว่า 3,500 species ของยุง,"label": "แมลงหวี่", "summary": "แมลงสองปีกดูดน้ำลายและอาจแพร่เชื้อยุโรป"}
  insect.moth:
    label: '"mor'
    summary: A nocturnal relative of butterflies that flies toward light sources.
    info: |-
      מורי הן פרפרים ליליים מהסדר לביפטירה שבד九龙对比休息時翅膀向側面摺疊，與日間蝴蝶不同。
      mori" יש מין נסיבות רבות המושך אור מלאכותי.
      The silk worm caterpillars produce natural silk.
      The Luna Moth is one of the most beautiful moths in the world.
  insect.praying_mantis:
    label: קדמנך
    summary: חרקים טורפים עם תנוחה של תפילה והתקפה מהירה.
    info: קַדמָנְכּוֹת נבוֺא'זע הינן חרקים טורפים מקבוצת המנטודיאה'. השם שלהן בא מהעמדה שבה הן מחזיקות את רגליו האחוריות כאילו ב祈祷. זו מומחית ציד – היא פוגעת במהירות ומעיפה על קורת עיפרון תוך שבריר שנייה אחת. לפעמים אשה תאכל זכר לאחר הזדויגר, אך לא תמיד קורה כך.
  insect.robber_fly:
    label: 斯特雷查特卡
    summary: 空中捕食其他昆虫的掠夺性苍蝇
    info: |-
      סטרכטקה היא חרק טורף דו כנפי מהמשפחה האסילידאה שמחפש אחרחרקים אחרים במהלך הטיסה שלהם. יש לה רגליים חזקות לליקיחת הטרפה וציפורן用于扎入麻痹毒液。有些种类模仿黄蜂或蚂蚁的外观以躲避天敌。
      它有助于控制昆虫种群。
  insect.scorpion:
    label: spina
    summary: זיהום חיות קרקע עם גפי ציפורניים וזנב מעוגר.
    info: |-
      ספינה היא חרק זחלי (ולא昆蟲), עם איברים מתקפלים וذנבו המשוות בקצותיו על ידי מחט רעילתית.
      it הוא יצור ישן מאוד - השרידים המבוקשים ביותר של ספינות הם משנת לפני יותר чем ארבע מאותשלוש עשרה מיליון שנים.
      at הן פלוארסקות באשכולה תחת אור ידועי ultra-violet.
      at מאחר שקיימות כerca שני וחצי אלפים דגמים שונים, רק פחות או יותר חמישע מהם מסוכנים לאדם.
  insect.silverfish:
    label: ライベンカ
    summary: 집 안 책이나 종이 근처에서 찾을 수 있는 낯선 놈
    info: |-
      {"hint":"곤충 (Lepisma saccharina), 날개가 없고 빨리 움직이며 실내에서 발견되는 곤충","info":"라이벤카는 집안에 사는 가장 오래된 벌레 중 하나인 무익류의 원시적인 족벌입니다。
      전분과 종이 및 도서 접착제와 섬유를 머금습니다。
      그 이름은 은색 색상과 물고기처럼 흔들리는 움직임 때문에 붙여졌으며,
      무익류 계통으로 약 3억 년 전부터 거의 변함없이 생존하고 있습니다."}
  insect.spider:
    label: spider
    summary: "\U0001F577️"
    info: אריה הוא חרק אוגנפים (ולא昆蟲 אמיתי), שיושב בדרגת אריאנה עם שמונה רגליים ושני חלקי גוף. יש לו יכולת לייצר סיבית ולייצור תרשים כדי לדוג או להסתיר קוקונים של알ות. בעולם חיים יותר מ - 48,000 זנים של עטלף.
  insect.stag_beetle:
    label: רוֹהָך
    summary: הג'יל גדול בעולם האירויפאי עם קיסודות דומים ל뿔ים
    info: רואח עץ הוא החרסן הגדול ביותר באירופה וגדל לאורך של יותר מ - 7 ס
  insect.stick_insect:
    label: '"סטרהשילקה"'
    summary: '"חגורה דמוויית ענף או פליון."'
    info: '{"hint":"곤충으로 가지를 닮은 애완동물(phasmatodea)","info":"스트라시카는 페이스마토테아 그룹에 속한 곤충이며 완벽하게 모방하는 미미크리의 대가입니다.; 몸이 줄기나 잎을 정확히 재현합니다\. 위협받으면 전혀 움직이지 않습니다\.( 일부 종들은 수컷 없이 파르테노게네시스로 번식합니다\。( 이 동물들 때문에 관상용 야생동물을 기른다는 것이 인기가 있습니다\。")'
  insect.termite:
    label: טֶרפְּמוֹן
    summary: חָבֵל הַחוֺקִים בְּקוֹלוֹנוֹת אֲגֻפָּות.
    info: טירמייט הוא חרק חברתי מהמשפחה האיסופטרה, קרוב לחרקים כמו יתושים ויתושיות. הם חיים בקולוניה עם מלך, מلكה, חיילים ואנשי עבודה שמתמחים בניקוז עץ. טרמיטיטים מבני גזע מורכבים מאוד – לפעמים בגובה של עד תשעה מטרים בטרופוס - הכוללים מערכת ניאול מקיפה.
  insect.tiger_beetle:
    label: 폴נייק
    summary: חבלה עם פיגמנטים metallic ומהירים במיוחד
    info: |-
      פולניקה הוא ח벌ת ממשפחת ה-Cicindelinae ידוע ב מהירות המרשימה שלו, יכולתו לעוף וראייתו האכזריות.
      it רץ כל כך במהרה עד שהוא חייב להאט ולהתיישר מחדש מאחר שההתקדמות היא מהירה מדי למערכת thịיה.
       יש לו גבורה מתכת צבעונית מאוד (ירוקים, כחולים ואדומים), עיניים גדולות
       והטיפוסים שלהוצרים תעלות אנוכיות באדמה ונמצאים בהן מצפים לטרף.
  insect.velvet_ant:
    label: มรัจิก์ซามีโตฟี้
    summary: ג'רדרดำ ואורנגיה ללא כנפים נראה כמו ציפור.
    info: |-
      המוץ השטוף הוא למעשה מוצת משפחת המוטילידאה; الإناث חסרות כנפיים ומסווגות לחרקים דומים לציפורי עץ.
      an> יש להן שערות אדומות או אורנזевые ניכרות לשמש התראה.
      The الإناث מחזיקות בזחית חזק במיוחד הנחשבת לחנית פרווה של הפריים (killer cow).
       הן פarasitize על גלי צלעות.
  insect.wasp:
    label: بوסה
    summary: אישה בצבע זהוב וחום שמתחילה עם גידול纸质 nests.
    info: |-
      בּוֹסָה עֲבוֺנִית הַי אינְשֶׁק מֵעֻרוֿם שֶׂכֱל וֽזֳפֶר ז֭כוֹן בּוֆד י֥צ֬ח ד֣יו כ֤חו־ת צ֫מ֪ח ת֢מו֙ך֩
      היא נושאת חורש פפירוסים מהמסה של עצמות שנDIGested ונחרצה.
      בדומה לabe היא יכולה לה蜇 מספר פעמים,
      והיא שימושית כיוצר טבעי לריכוז המזיקים.
  insect.water_strider:
    label: גרידה
    summary: חרק הלוקד על פני המים בעזרת עוצמת משיכה.
    info: ג'רידה הוא חרק מהמשפחה Gerridae המסוגל ללכת על פני השטח של מים thanks לחוטי שיערה הידרופוביים ולחיכוך המשדר את כוח העומס. הוא נושם דגים אחרים שמתקלים בזעזועים שנוצרות בשפת הנחל או באגם. החיה יכולה לנוע במהירות רבה מאוד – יותר чем פי מאה וחמישים האורך שלה לשנייה.
  insect.weevil:
    label: nocat
    summary: نוכת קטן בעל אפו ארוך.
    info: |-
      נוכת חורש הוא נמלה משפחת ה-Curculionidae, המשפחיה הכי גדולה בעולם עם יותר מ - 60,000 תיפוסים.
      The מאפייני האף הארוך משמש לריקוק בזרעים ופירות ובtronks של צמחים.
      th פולטים מסוימים הם זכרים חשובים לחקלאות כמו nocat algidus.
      th אחרים מתמקדים בצומח ספציפי.
  insect.whirligig_beetle:
    label: وירן
    summary: חרק קטן שעובר בסירות במפגשי מי
    info: '{"hint":"טולב שמסתובב במעגלים על פני המים","info":"וירניק הוא חרק ממשפחת ה-Gyrinidae החיים בפני נוזל וסיבוכים קשורים ליצורים אחרים שמנסים להתחמק מהם. עיניו מחולקות לשתי חלקות - אחת רואה מעל הנ้ำ והשנייה מתחת לנפה. הם מזהירים גלים קטנים שעלולים לסמן אוכל או סכנה. במהלך היום הם מסתחררים但是在 הלילה הם טסים."}'
