lang: he
pivot: false
title: חרקים
cards:
  insect.ant:
    label: נמלה
    summary: חרק חברתי קטן החי במושבות.
    info: הנמלה חרק היוצר מושבות גדולות עם חלוקת עבודה ברורה.
  insect.antlion:
    label: אריה הנמלים
    summary: זחל החופר מלכודת בצורת משפך בחול כדי ללכוד נמלים מחליקות.
    info: |-
      אריה הנמלים הוא זחל של חרק החופר מלכודת חרוטית בחול היבש.
      כאשר נמלה מחליקה פנימה, הוא תופס אותה בלסתותיו הגדולות ומזריק נוזל עיכול.
      הבוגר דומה לשפירית ומעופף בשעות הערב.
      הזחל יכול לשרוד באדמה שנים ללא מזון.
  insect.aphid:
    label: כנימת עלה
    summary: חרק קטן היונק מוהל מגבעולי צמחים ומפריש טל דבש.
    info: |-
      כנימת עלה היא חרק קטן היונק מוהל צמחים.
      היא מפרישה חומר מתוק הקרוי טל דבש, שהנמלים שומרות עליה בתמורה לו.
      היא מתרבה במהירות עצומה, ונקבה אחת יכולה להוליד המונים בזמן קצר.
  insect.atlas_moth:
    label: עש אטלס
    summary: מגדולי העשים בעולם, בעל כנפיים עם דוגמה בולטת.
    info: |-
      עש אטלס הוא מגדולי העשים בעולם, ומוטת כנפיו מגיעה עד 30 סנטימטר.
      קצות כנפיו צבועים כך שייראו כראש נחש ומרתיעים טורפים.
      הבוגר חסר פה ואינו אוכל כלל, וחי ימים ספורים בלבד.
      הוא חי ביערות הגשם של דרום-מזרח אסיה.
  insect.bedbug:
    label: פשפש המיטה
    summary: חרק שטוח היונק דם בלילה ומסתתר בסדקי הרהיטים.
    info: |-
      פשפש המיטה חרק פעיל בעיקר בלילה, הנושך את המאכסן הישן ויונק את דמו.
      הוא מסתתר בסדקי מזרנים ורהיטים ומאחורי טפטים.
      בעשורים האחרונים שב והתפשט ברחבי העולם בשל נסיעות בין-לאומיות.
  insect.bee:
    label: דבורה
    summary: חרק בגוון חום-צהוב המאביק פרחים ומייצר דבש.
    info: |-
      דבורת הדבש (Apis mellifera) חרק חברתי החי בכוורות ומייצר דבש.
      היא ממלאת תפקיד חיוני בהאבקת צמחים ומגינה על עצמה בעוקצה בעת סכנה.
  insect.beetle:
    label: חיפושית
    summary: הסדרה הגדולה בחרקים, ובה יותר מ-400,000 מינים מתוארים.
    info: |-
      החיפושיות הן הסדרה הגדולה בחרקים ומהוות כ-40% מכלל מיני בעלי החיים המתוארים.
      יש להן זוג כנפיים קשיחות שתחתיו מקופלות כנפי התעופה האמיתיות.
      הן חיות כמעט בכל בית גידול, מיערות הגשם ועד שולי האזורים הקוטביים.
  insect.bombardier_beetle:
    label: חיפושית התותחן
    summary: חיפושית המתגוננת בהתזת תרסיס רותח ורעיל.
    info: |-
      חיפושית התותחן מערבבת שני חומרים כימיים בקצה בטנה ומתיזה נוזל רותח שחומו עולה על 100 מעלות.
      התרסיס הרעיל נפלט בקול נפץ ובמנות מהירות רצופות.
      זהו נשק הגנה יעיל מאוד נגד טורפים.
  insect.bumblebee:
    label: דבורת האדמה
    summary: דבורה שעירה בעלת זמזום עמוק ותפקיד חשוב בהאבקה.
    info: |-
      דבורת האדמה (הסוג Bombus) דבורה שעירה הקרובה לדבורת הדבש.
      היא מאביקה חשובה, במיוחד באקלים קר.
      היא מסוגלת לחמם את גופה ברעד שרירי התעופה ולכן עפה גם בקור, והיא רגועה מדבורת הדבש ואינה עוקצת אלא בעת סכנה.
  insect.butterfly:
    label: פרפר
    summary: חרק מעופף בעל כנפיים גדולות וצבעוניות.
    info: הפרפר חרק בעל שני זוגות כנפיים מכוסות קשקשים, לרוב בצבעים בולטים.
  insect.caterpillar:
    label: זחל
    summary: שלב הזחל של פרפר או עש, אוכל עלים ומתכונן לגלגול.
    info: |-
      הזחל הוא שלב הזחל של פרפר או עש, האוכל עלים ואוגר אנרגיה לקראת הגלגול.
      חלקם צבעוניים כאזהרה על רעילותם.
      הגלגול המלא מתרחש בתוך הגולם.
  insect.centipede:
    label: נדל
    summary: פרוק בעל זוג רגליים אחד בכל פרק גוף.
    info: |-
      הנדל שייך למרבי הרגליים, ובכל פרק גוף יש לו זוג רגליים אחד, ומספרן אינו בהכרח מאה חרף שמו הלועזי.
      הוא טורף מהיר הצד חרקים, תולעים וחולייתנים קטנים.
      זוג רגליו הראשון הפך לצבתות המזריקות ארס.
      מינים טרופיים אחדים עולים באורכם על 30 סנטימטר.
  insect.cicada:
    label: ציקדה
    summary: חרק הנודע בשירתו הרמה בימות הקיץ.
    info: |-
      הציקדה מרעישני החרקים בימי הקיץ.
      הזכר מפיק את קולו באיבר מיוחד בבטנו כדי למשוך את הנקבה.
      למינים אחדים בצפון אמריקה מחזור חיים בן 13 או 17 שנים.
      הנימפות חיות שנים באדמה וניזונות ממוהל שורשים.
  insect.cockroach:
    label: תיקן
    summary: חרק לילי זללני, עמיד מאוד ורב-הסתגלות.
    info: |-
      התיקן מן החרקים העמידים ביותר, ושורד בתנאים קיצוניים הקטלניים לאחרים.
      קיימים למעלה מ-4,000 מיניו, אך רק כשלושים מהם חיים ליד בני אדם.
      זהו חרק קדום הקיים מאות מיליוני שנים, עוד לפני הדינוזאורים.
  insect.crane_fly:
    label: יתוש הענק
    summary: זבוב גדול הדומה ליתוש ענק בעל רגליים ארוכות במיוחד.
    info: |-
      יתוש הענק דומה ליתוש ענק אך אינו נושך ואינו טפיל.
      רגליו הארוכות מאוד נשברות בקלות כאמצעי הגנה.
      הבוגר חי ימים ספורים ובקושי אוכל.
  insect.cricket:
    label: צרצר
    summary: חרק לילי שזכרו נודע בציוצו.
    info: |-
      הצרצר חרק לילי מסדרת ישרי-הכנף.
      הזכר משפשף את כנפיו ומפיק ציוץ המושך את הנקבה ומסמן את תחומו.
      באסיה גידלו אותו מקדמת דנא לשם הנאה מקולו.
  insect.damselfly:
    label: שפריתון
    summary: דומה לשפירית אך דק ממנה ומקפל כנפיו במנוחה.
    info: |-
      השפריתון קרוב לשפירית אך דק ממנה, ובמנוחה הוא מקפל את כנפיו במקביל לגופו.
      הוא טורף הצד חרקים קטנים בתעופה, וזחליו חיים במים.
      הוא נחשב מדד לניקיון המים.
  insect.diving_beetle:
    label: חיפושית הצלילה
    summary: חיפושית טורפת השוחה מתחת לפני המים בחיפוש טרף.
    info: |-
      חיפושית הצלילה חיפושית טורפת ושחיינית החיה בברכות ובמים עומדים.
      רגליה האחוריות השטוחות פועלות כמשוטים והיא שוחה בחלקלקות.
      היא עולה אל פני המים לאגור אוויר מתחת לכנפיה, וצדה חרקים, זחלים ודגיגים.
  insect.dragonfly:
    label: שפירית
    summary: חרק בעל גוף ארוך ושני זוגות כנפיים שקופות.
    info: השפירית חרק טורף חד-ראייה הצד ליד מקווי מים.
  insect.dung_beetle:
    label: חיפושית הגלל
    summary: חיפושית המגלגלת כדורי גללים, ונערצה במצרים העתיקה.
    info: |-
      חיפושית הגלל מגלגלת גללים לכדורים, טומנת אותם ומטילה בהם את ביציה.
      היא הייתה סמל לשמש ולאל ח'פרי במצרים העתיקה.
      זהו בעל החיים היחיד הידוע המתמצא לפי אור שביל החלב.
      היא תורמת למחזור החומרים המזינים ולשיפור הקרקע.
  insect.earwig:
    label: צבתן
    summary: חרק מוארך בעל צבת בקצה בטנו.
    info: הצבתן חרק שרווחת עליו האמונה כי הוא נכנס לאוזן, אך זו אינה אלא אגדה חסרת בסיס.
  insect.firefly:
    label: גחלילית
    summary: חרק הפולט אור ביולוגי כדי למשוך בן זוג.
    info: |-
      הגחלילית חרק הפולט אור קר מקצה בטנו.
      הזכר והנקבה פולטים דגמי הבהוב שונים כדי לזהות זה את זה ולהתמשך.
      האור נוצר מתגובה כימית של לוציפרין עם אנזים.
      היא מדד לניקיון הסביבה הטבעית.
  insect.flea:
    label: פרעוש
    summary: חרק טפילי קטן היונק דם יונקים ועופות וקופץ למרחקים.
    info: |-
      הפרעוש חרק חסר כנפיים הקופץ ברגליו האחוריות החזקות מאות מונים מאורך גופו.
      הוא יונק דם יונקים ועופות ועלול להעביר מחלות.
      בהיסטוריה נודע כמפיץ מגפת הדֶּבֶר.
  insect.fly:
    label: זבוב הבית
    summary: זבוב נפוץ הנושא לכלוך ועלול להעביר מחלות.
    info: |-
      זבוב הבית (Musca domestica) הזבוב הנפוץ ביותר סביב מגורי אדם.
      בעיניו המורכבות הוא רואה כמעט 360 מעלות.
      הוא מעביר חיידקים בנוחתו על אשפה ומזון.
      יש לו זוג כנפיים מעופף אחד, והזוג האחר מאזן את התעופה.
  insect.goliath_beetle:
    label: חיפושית גוליית
    summary: מגדולי וכבדי החרקים בעולם, מוצאה מאפריקה הטרופית.
    info: |-
      חיפושית גוליית מכבדי החרקים בעולם, ומשקל הזכר כ-100 גרם ואורכו יותר מ-11 סנטימטר.
      היא חיה ביערות הגשם של אפריקה המשוונית.
      הבוגרת ניזונה מפירות וממוהל עצים, והיא מבוקשת בקרב אספנים.
  insect.grasshopper:
    label: חגב
    summary: חרק אוכל-צמחים הקופץ ברגליו האחוריות הארוכות.
    info: |-
      החגב חרק מסדרת ישרי-הכנף בעל רגליים אחוריות חזקות שבהן הוא קופץ מונים מאורך גופו.
      הזכר מפיק קול אופייני בשפשוף ירכו בכנפו.
      הוא אוכל-צמחים, ונחילים גדולים עלולים לפגוע ביבולים.
  insect.ground_beetle:
    label: חיפושית הקרקע
    summary: חיפושית טורפת ומהירה החיה מתחת לאבנים ולעלים.
    info: |-
      חיפושית הקרקע שייכת למשפחת חיפושיות הקרקע.
      רובן טורפות לילה פעילות הצדות חרקים, תולעים וחלזונות.
      הן נעות במהירות ונמלטות מיד בעת סכנה.
      למינים אחדים ברק מתכתי יפה, והן מדד לקרקע בריאה.
  insect.hornet:
    label: דבור
    summary: הצרעה הגדולה באירופה, בעלת עקיצה חזקה וזמזום רם.
    info: |-
      הדבור הצרעה החברתית הגדולה באירופה, ואורכו כ-3.5 סנטימטר.
      הוא בונה קן נייר בחללי עצים או מתחת לגגות.
      עקיצתו ארוכה וכואבת מזו של הצרעה הרגילה, אך הוא עוקץ רק בעת איום ישיר.
      הוא טורף חשוב של חרקים אחרים.
  insect.hoverfly:
    label: זבוב הפרחים
    summary: זבוב הדומה לדבורה אך אינו עוקץ, ומאביק חשוב בגינה.
    info: |-
      זבוב הפרחים מחקה את צבעי הדבורים והצרעות כדי להתגונן מטורפים (חיקוי בייטסי).
      אך למעשה אינו עוקץ.
      הוא מאביק חשוב המבקר בפרחים רבים יותר מן הדבורה.
      זחלי מינים אחדים ניזונים מכנימות עלה.
  insect.lacewing:
    label: זבוב התחרה
    summary: חרק בעל כנפיים שקופות ורשתיות, שזחליו אוכלים כנימות עלה.
    info: |-
      זבוב התחרה חרק בעל כנפיים שקופות ורשתיות ועיניים זהובות.
      זחליו טורפים כנימות עלה בשפע ומשמשים הדברה טבעית.
      הבוגר ניזון מצוף ומאבקה ונמשך אל האור.
  insect.ladybug:
    label: פרת משה רבנו
    summary: חרק קטן ועגול, אדום עם נקודות שחורות.
    info: פרת משה רבנו חרק מועיל בגינה, שכן היא ניזונה מכנימות עלה.
  insect.locust:
    label: ארבה
    summary: חגב היוצר נחילים הרסניים של מיליוני פרטים.
    info: |-
      הארבה חגב היוצר בתנאים מסוימים נחילים נודדים עצומים.
      נחיל אחד עשוי למנות מיליארדי פרטים ולהחריב שטחי חקלאות נרחבים ביום אחד.
  insect.louse:
    label: כינה
    summary: חרק טפילי קטן חסר כנפיים החי על גוף המאכסן.
    info: |-
      הכינה חרק טפילי חסר כנפיים החי על עורו ושערו של המאכסן.
      היא יונקת דם וגורמת לגירוד.
      כינת הראש נפוצה בעולם כולו ופוגעת בילדים ללא קשר לתנאי היגיינה.
      בהיסטוריה העבירה מחלות כגון טיפוס הבהרות.
  insect.mayfly:
    label: זבוב היממה
    summary: חרק שבוגריו חיים שעות או ימים בלבד.
    info: |-
      זבוב היממה סמל לחלוף, ובוגריו חיים שעות עד יממה בלבד.
      פיו מנוון והוא אינו אוכל כלל.
      הנימפה חיה במים בין שנה לשלוש שנים.
  insect.mosquito:
    label: יתוש
    summary: חרק דו-כנפי שנקבתו יונקת דם ועלולה להעביר מחלות.
    info: |-
      היתוש חרק דו-כנפי ממשפחת היתושים.
      הנקבה יונקת דם כדי להשיג חלבון להטלת ביציה, והזכר ניזון מצוף.
      הוא מעביר מחלות מסוכנות כגון מלריה וקדחת הדנגה.
  insect.moth:
    label: עש
    summary: קרוב הפרפר, פעיל בלילה ומקפל כנפיו לצד גופו במנוחה.
    info: |-
      העש קרוב לפרפר מסדרת קשקשי-הכנף, אך במנוחה הוא מקפל את כנפיו לצדדים בשונה מן הפרפר.
      רבים מן המינים נמשכים לאור מלאכותי.
      זחל תולעת המשי מייצר את חוט המשי הטבעי.
      עש הלבנה נחשב לאחד היפים בעשים בעולם.
  insect.praying_mantis:
    label: גמל שלמה
    summary: חרק טורף בעל תנוחת תפילה ומכת בזק.
    info: |-
      גמל שלמה חרק טורף שכונה כך משום שהוא מצמיד את רגליו הקדמיות כמתפלל.
      הוא שולח את רגליו הקדמיות כהרף עין וחוטף את הטרף.
      במינים אחדים הנקבה טורפת את הזכר לאחר ההזדווגות.
  insect.robber_fly:
    label: זבוב השודד
    summary: זבוב טורף החוטף חרקים אחרים באוויר.
    info: |-
      זבוב השודד זבוב טורף הצד חרקים אחרים תוך כדי תעופה.
      יש לו רגליים חזקות לאחיזת הטרף ופה מחודד המזריק ארס משתק.
      מינים אחדים מחקים דבורים או צרעות כדי להתגונן.
  insect.scorpion:
    label: עקרב
    summary: עכביש בעל שתי צבתות וזנב מעוקל ארסי.
    info: |-
      העקרב עכבישן (ולא חרק), בעל שתי צבתות וזנב מעוקל המסתיים בעוקץ ארסי.
      זהו בעל חיים קדום מאוד, ומאובניו הקדומים בני כ-430 מיליון שנה.
      הוא זוהר תחת אור על-סגול.
      מבין כ-2,500 מיניו רק כ-25 מסוכנים לאדם.
  insect.silverfish:
    label: דג הכסף
    summary: חרק קטן וזריז חסר כנפיים המצוי ליד ספרים ונייר בבית.
    info: |-
      דג הכסף חרק קדום וחסר כנפיים החי בתוך בתים.
      הוא ניזון מעמילן, נייר, דבק ספרים וסיבים.
      שמו בא מצבעו הכסוף ומתנועתו הגלית כשל דג.
      זהו מן החרקים העתיקים ביותר, שכמעט לא השתנה מאות מיליוני שנים.
  insect.spider:
    label: עכביש
    summary: פרוק בעל שמונה רגליים הטווה קורים ללכידת חרקים.
    info: |-
      העכביש עכבישן (ולא חרק), בעל שמונה רגליים וגוף המורכב משני חלקים.
      הוא מייצר חוטי משי שבהם הוא טווה רשתות ועוטף את טרפו וביציו.
      בעולם ידועים כ-48,000 מיני עכבישים.
      כולם מייצרים ארס, אך רובם אינם מזיקים לאדם.
  insect.stag_beetle:
    label: חיפושית האיל
    summary: החיפושית הגדולה באירופה, ולזכרה לסתות כקרניים.
    info: |-
      חיפושית האיל (Lucanus cervus) החיפושית הגדולה באירופה, ואורכה עד כ-7 סנטימטר.
      לזכר שתי לסתות ענק כקרני איל, שבהן הוא נאבק על הנקבות.
      הזחל חי עד שבע שנים בתוך עץ אלון רקוב.
  insect.stick_insect:
    label: חרק המקל
    summary: חרק המחקה ענף או עלה בדייקנות.
    info: |-
      חרק המקל שייך לסדרת חרקי המקל והוא אמן ההסוואה.
      גופו מחקה ענפים ועלים בשלמות.
      בעת סכנה הוא נותר דומם לחלוטין.
      מינים אחדים מתרבים ללא זכרים, והוא נפוץ כחרק מחמד לצפייה.
  insect.termite:
    label: טרמיט
    summary: חרק חברתי הבונה תלים ענקיים מבוץ.
    info: |-
      הטרמיט חרק חברתי הקרוב קרבה רחוקה לנמלה.
      הוא חי במושבות ובהן מלך, מלכה, חיילים ופועלים.
      באזורים הטרופיים הוא בונה קנים מורכבים שגובהם עד כ-9 מטרים ובהם מערכת אוורור.
  insect.tiger_beetle:
    label: חיפושית הנמר
    summary: חיפושית טורפת מהירה מאוד וחדת-ראייה בעלת ברק מתכתי.
    info: |-
      חיפושית הנמר חיפושית טורפת המשלבת מהירות ריצה, יכולת תעופה וראייה חדה.
      מרוב מהירותה ראייתה נעלמת בעת הריצה, ולכן היא עוצרת כדי להתמצא מחדש.
      גופה נוצץ בגוני ירוק, כחול ואדום, ולה שתי עיניים גדולות.
      זחליה חופרים מנהרות אנכיות בקרקע ואורבים לטרף בפתחן.
  insect.velvet_ant:
    label: נמלת הקטיפה
    summary: נקבת צרעה חסרת כנפיים מכוסה בפרווה צבעונית ובעלת עקיצה מכאיבה מאוד.
    info: נמלת הקטיפה היא למעשה נקבת צרעה חסרת כנפיים (משפחת Mutillidae) המכוסה בפרווה כקטיפה ונראית כנמלה.
  insect.wasp:
    label: צרעה
    summary: חרק עוקץ בצבעי צהוב-שחור הבונה קני נייר.
    info: הצרעה חרק עוקץ בצבעי אזהרה צהובים ושחורים הבונה את קנו מחומר דמוי נייר.
  insect.water_strider:
    label: מחליק המים
    summary: חרק קטן ההולך על פני מים עומדים הודות למתח הפנים.
    info: מחליק המים חרק ההולך על פני המים בלי לשקוע, הודות למתח הפנים ולרגליו המכוסות בשׂער דוחה מים.
  insect.weevil:
    label: חדקונית
    summary: חיפושית קטנה בעלת חדק ארוך אופייני.
    info: |-
      החדקונית חיפושית קטנה ממשפחת החדקוניות, מן המשפחות הגדולות בעולם החי, ובה יותר מ-60,000 מינים.
      בחדקה הארוך האופייני היא נוקבת פירות וגבעולי עצים.
      מינים אחדים מזיקים חשובים לחקלאות, כחדקונית הכותנה, ואחרים מתמחים בצמח אחד בלבד.
  insect.whirligig_beetle:
    label: חיפושית הסחרחרה
    summary: חיפושית מים קטנה המסתחררת בלהקות על פני המים.
    info: |-
      חיפושית הסחרחרה חיפושית מים המסתחררת בלהקות על פני המים, צדה ונמלטת מטורפים.
      עינה חצויה לשניים, חלק אחד רואה מעל המים והאחר רואה מתחתם.
