lang: sr
pivot: false
title: Инсекти
cards:
  insect.butterfly:
    label: лептир
    summary: Летећи инсект с великим шареним крилима.
    info: Лептир је инсект с два пара крила прекривених љуспицама, често упадљивих боја.
  insect.bee:
    label: пчела
    summary: Жуто-црни инсект који опрашује цвеће и производи мед.
    info: Медоносна пчела друштвени је инсект који живи у кошницама и скупља нектар.
  insect.ladybug:
    label: бубамара
    summary: Мали округао црвен инсект с црним тачкама.
    info: Бубамара је мали тврдокрилац који се храни лисним вашима и користан је у башти.
  insect.dragonfly:
    label: вилин коњиц
    summary: Инсект с дугим телом и два пара провидних крила.
    info: Вилин коњиц је грабљивац изврсног вида који лови уз водену површину.
  insect.ant:
    label: мрав
    summary: Мали друштвени инсект који живи у колонијама.
    info: Мрав је инсект који ствара велике колоније с поделом рада.
  insect.beetle:
    label: тврдокрилац
    summary: Тврдокрилци чине највећи ред инсеката, с више од 400.000 описаних врста.
    info: |
      Тврдокрилац припада реду Coleoptera и чини око 40% свих описаних врста инсеката.
      Препознаје се по тврдим покрилцима (елитрама) која скривају права летна крила.
      Јелењак је највећи тврдокрилац у Европи; мужјак има снажне вилице налик роговима.
      Тврдокрилци живе у готово свим стаништима, од тропа до арктичких крајева.
  insect.grasshopper:
    label: скакавац
    summary: Скакутав инсект с дугим задњим ногама и цврчећим звуком.
    info: |
      Скакавац је инсект из реда Orthoptera са снажним задњим ногама које омогућавају скокове до двадесет пута дуже од тела.
      Мужјаци производе карактеристичан звук (стридулацију) трљајући ноге о крила.
      Храни се биљем и у великим ројевима може уништити усеве.
  insect.cricket:
    label: цврчак
    summary: Ноћни инсект, познат по цврчању мужјака.
    info: |
      Пољски цврчак ноћни је инсект из реда Orthoptera.
      Мужјаци цврче трљајући крила једно о друго како би привукли женке и означили територију.
      У Азији се цврчци одавно држе као кућни љубимци због њиховог певања.
      У многим су културама и симбол домаће угодности и среће.
  insect.mosquito:
    label: комарац
    summary: Двокрилни инсект; женка сиса крв и може преносити болести.
    info: |
      Комарац је двокрилни инсект из породице Culicidae.
      Женке сисају крв животиња како би добиле беланчевине за развој јаја; мужјаци се хране нектаром.
      Комарци преносе опасне болести попут маларије, денга грознице и зике.
      У свету постоји више од 3.500 врста комараца.
  insect.fly:
    label: мува
    summary: Веома распрострањен двокрилни инсект који може преносити бактерије.
    info: |
      Кућна мува најраспрострањенији је двокрилни инсект у људским домовима.
      Сложене очи омогућавају јој да види готово 360 степени око себе.
      Преноси бактерије јер слеће и на отпад и на храну.
      Има само један пар функционалних крила; други пар (халтере) помаже да одржи равнотежу у лету.
  insect.moth:
    label: ноћни лептир
    summary: Ноћни сродник лептира; лети према светлу и има перната пипала.
    info: |
      Ноћни лептири ноћни су лептири који, за разлику од дневних, у миру држе крила склопљена уз бок.
      Многе врсте привлачи вештачко светло.
      Природну свилу дугујемо гусеницама свилене бубе.
      Лептир месечар (луна) један је од најлепших ноћних лептира на свету.
  insect.caterpillar:
    label: гусеница
    summary: Ларва лептира; једе лишће и припрема се за преображај.
    info: |
      Гусеница је ларвени ступањ лептира и живот проводи углавном једући лишће како би сакупила енергију за преображај.
      Неке гусенице имају упадљиве боје које упозоравају грабљивце да су отровне.
      При преображају ствара лутку (чауру), у којој се одвија потпун преображај (метаморфоза) у одраслу јединку.
  insect.praying_mantis:
    label: богомољка
    summary: Грабљиви инсект с молитвеним држањем и муњевитим нападом.
    info: |
      Богомољка је грабљиви инсект из групе Mantodea.
      Име дугује држању у ком предње ноге држи склопљене као у молитви.
      Мајстор је лова; удара и хвата плен у делићу секунде.
      Женка понекад поједе мужјака после парења, иако се то не дешава увек.
  insect.stick_insect:
    label: штапаста буба
    summary: Инсект који савршено опонаша гранчицу или лист.
    info: |
      Штапаста буба припада групи Phasmatodea и мајстор је маскирања; тело јој савршено опонаша гранчице или лишће.
      Пред опасношћу остаје потпуно непомична.
      Неке се врсте размножавају партеногенезом, дакле без мужјака.
      Популарни су егзотични кућни љубимци због једноставне неге.
  insect.firefly:
    label: свитац
    summary: Тврдокрилац који светли биолуминесцентним светлом да би привукао партнера.
    info: |
      Свитац је тврдокрилац из породице Lampyridae који у задатку може стварати хладно светло (биолуминесценцију).
      Мужјаци и женке светле различитим обрасцима како би се препознали и привукли.
      Светлом управља хемијска реакција луциферина с луциферазом.
      Свици су показатељ чисте животне средине.
  insect.wasp:
    label: оса
    summary: Жуто-црни инсект с жаоком који гради папирната гнезда.
    info: |
      Обична оса инсект је с жаоком из групе Vespula с типичним жуто-црним бојама упозорења.
      Гради папирната гнезда од сажваканих дрвених влакана.
      За разлику од пчеле, оса може убости више пута.
      Корисна је као природни регулатор штетних инсеката.
  insect.cockroach:
    label: бубашваба
    summary: Брз, ноћни, свеждери инсект; веома отпоран и прилагодљив.
    info: |
      Бубашваба је један од најотпорнијих инсеката на свету; преживљава зрачење и услове који би убили друге животиње.
      Постоји више од 4.500 врста, али само тридесетак живи у близини човека.
      Древни је инсект; бубашвабе постоје више од 300 милиона година и преживеле су диносаурусе.
      Брза је и може трчати брже од 5 km/h.
  insect.spider:
    label: паук
    summary: Осмоноги паук који плете мреже за хватање инсеката.
    info: |
      Паук је паукообразни зглавкар (није инсект) из реда Araneae с осам ногу и телом у два дела.
      Може производити свилу којом плете мреже за лов или обмотава чауре с јајима.
      У свету живи више од 48.000 врста паука.
      Све врсте производе отров, али велика је већина безопасна за човека.
  insect.scorpion:
    label: шкорпија
    summary: Отровни паукообразни зглавкар с клештима и повијеним отровним репом.
    info: |
      Шкорпија је паукообразни зглавкар (није инсект) с типичним клештима и повијеним репом који се завршава отровном бодљом.
      Древна је животиња; најстарије фосилне шкорпије старе су више од 430 милиона година.
      У мраку флуоресцирају под ултраљубичастим светлом.
      Од отприлике 2.500 врста само је двадесетак опасно за човека.
  insect.centipede:
    label: стонога
    summary: Стонога с једним паром ногу на сваком чланку тела.
    info: |
      Стонога припада класи Chilopoda и има један пар ногу на сваком чланку тела (не сто ногу, како сугерише енглески назив).
      Брз је грабљивац који лови инсекте, глисте и мале кичмењаке.
      Први пар ногу претворен је у отровне канџе које парализују плен.
      Неке тропске врсте нарасту дуже од 30 cm.
  insect.flea:
    label: бува
    summary: Ситан скакутав паразит који сиса крв сисара и птица.
    info: |
      Бува је бескрилни инсект из реда Siphonaptera, специјализован за паразитски начин живота.
      Снажне задње ноге омогућавају скокове више од 150 пута дуже од тела.
      Сиса крв сисара и птица и може преносити болести; историјски су буве шириле кугу.
      Буве су акробате света инсеката.
  insect.termite:
    label: термит
    summary: Друштвени инсект који гради огромне хумке од земље.
    info: |
      Термит је друштвени инсект из групе Isoptera, у далеком сродству с бубашвабама.
      Живе у колонијама с краљем, краљицом, војницима и радницима.
      Граде сложене термитњаке, у тропима високе и до 9 метара, с властитим системом проветравања.
      Као важни разграђивачи дрвета, имају кључну улогу у тропским екосистемима.
  insect.bumblebee:
    label: бумбар
    summary: Велика длакава пчела с дубоким зујањем; важан опрашивач.
    info: |
      Бумбар је велик длакав инсект из рода Bombus, сродан медоносној пчели.
      Важан је опрашивач, нарочито у хладнијим поднебљима где пчеле мање лете.
      Може се загрејати подрхтавањем летних мишића, па лети чак и по хладноћи.
      Бумбари су блажи од оса и убадају само при непосредној претњи.
  insect.hornet:
    label: стршљен
    summary: Највећа оса у Европи, са снажном жаоком и гласним зујањем.
    info: |
      Стршљен је највећа друштвена оса у Европи и нарасте дуже од 3,5 cm.
      Гради папирната гнезда у дупљама дрвећа или под крововима.
      Жаока му је дужа него код оса, а убод болнији, али стршљен напада само при непосредној претњи.
      Важан је грабљиви непријатељ других инсеката.
  insect.cicada:
    label: цикада
    summary: Инсект познат по гласном цврчању у врелим данима.
    info: |
      Цикада је инсект из надпородице Cicadoidea, позната по једном од најгласнијих звукова међу свим инсектима.
      Мужјаци производе звук помоћу посебних мембрана (тимбала) у задатку како би привукли женке.
      Неке врсте у САД имају развојне циклусе од седамнаест или тринаест година.
      Ларве годинама живе под земљом и хране се корењем.
  insect.locust:
    label: сеобни скакавац
    summary: Селећи скакавац који ствара разорне ројеве од милиона.
    info: |
      Сеобни скакавац врста је скакавца који у одређеним условима ствара огромне селеће ројеве.
      Рој може бројати милијарде јединки и у једном дану уништити усеве на хиљадама хектара.
      У афричким и азијским земљама скакавци су историјски једна од највећих пољопривредних непогода.
      У Библији су једна од десет египатских пошасти.
  insect.aphid:
    label: лисна ваш
    summary: Ситан инсект који сиса сок на стабљикама биљака; производи медну росу.
    info: |
      Лисне ваши ситни су инсекти који сисају, из надпородице Aphidoidea, и хране се биљним соком.
      Производе слатку медну росу, за коју их мрави негују у замену за заштиту.
      Размножавају се изузетно брзо; једна женка може током године дати стотине милиона потомака.
      Важни су штеточине пољопривредних усева.
  insect.earwig:
    label: уховратка
    summary: Издужен инсект с клештима на крају задатка.
    info: |
      Уховратка је инсект из реда Dermaptera, препознатљив по клештима (церци) на крају задатка, која служе за одбрану и парење.
      Име у неким језицима потиче од сујеверја да залази људима у уши; то је мит.
      Женке уховратке необичне су јер се брину о јајима и младим ларвама, што је реткост међу инсектима.
      Живе у пукотинама, под камењем и у стељи.
  insect.silverfish:
    label: сребрна рибица
    summary: Бескрилан брз инсект који се налази у кућама уз књиге и папир.
    info: |
      Сребрна рибица примитиван је бескрилни инсект из реда Zygentoma који живи у домовима.
      Храни се скробом, папиром, књиговезачким лепком и текстилним влакнима.
      Име долази од њене сребрнасте боје и рибљег кретања.
      Припада једном од најстаријих редова инсеката и живи готово непромењена више од 300 милиона година.
  insect.water_strider:
    label: водомерка
    summary: Инсект који хода по површини воде захваљујући површинском напону.
    info: |
      Водомерка је инсект из породице Gerridae који може ходати по води захваљујући водоодбојним длачицама на ногама и површинском напону воде.
      Лови инсекте који су пали у воду, а које препознаје по треперењу површине.
      Брза је и може клизити по води више од 150 пута дуже од свог тела у секунди.
  insect.dung_beetle:
    label: балегар
    summary: Тврдокрилац који ваља куглице измета, свет у старом Египту.
    info: |
      Свети скарабеј тврдокрилац је из породице Scarabaeidae који обликује измет у куглице и ваља их како би их закопао и у њих положио јаја.
      У старом Египту био је симбол сунца и бога Кеприја.
      Једна је од ретких животиња које се оријентишу према Млечном путу.
      Помаже у кружењу хранљивих материја и проветравању земљишта.
  insect.stag_beetle:
    label: јелењак
    summary: Највећи тврдокрилац у Европи; мужјак има вилице налик роговима.
    info: |
      Јелењак је највећи тврдокрилац у Европи и нарасте дуже од 7 cm.
      Мужјак има огромне вилице налик роговима, које се користе у борбама за женке.
      Ларва живи до 7 година у трулом храстовом дрвету и храни се гљивама.
      Озбиљно је угрожен нестанком старих шума и мртвог дрвета.
  insect.atlas_moth:
    label: атлас лептир
    summary: Један од највећих ноћних лептира на свету, с крилима украшеним шаром змије.
    info: |
      Атлас лептир један је од највећих ноћних лептира на свету, с распоном крила до 30 cm.
      Врхови крила обојени су тако да личе на змијске главе, што одбија грабљивце.
      Одрасле јединке немају уста и уопште не једу; живе само неколико дана.
      Потиче из тропских шума југоисточне Азије.
  insect.weevil:
    label: сурлаш
    summary: Мали тврдокрилац с препознатљивом издуженом сурлом.
    info: |
      Сурлаш је тврдокрилац из породице Curculionidae, највеће породице животиња на свету, с више од 60.000 врста.
      Препознатљива издужена сурла (рострум) служи за бушење семена, плодова и стабала.
      Неке су врсте озбиљне пољопривредне штеточине, попут сурлаша памука.
      Друге су врсте специјализоване за једну једину биљну врсту.
  insect.lacewing:
    label: златоока
    summary: Нежан инсект с провидно жиластим крилима; ларве лове лисне ваши.
    info: |
      Златоока је инсект из породице Chrysopidae с нежним, провидно жиластим крилима и златним очима.
      Ларве су грабљивци и прождиру огромне количине лисних ваши, чиме постају природни заштитници биљака.
      Одрасле се јединке хране нектаром и полином.
      Привлачи их светло и показатељ су здраве животне средине.
  insect.crane_fly:
    label: типула
    summary: Велика мува налик комарцу с изузетно дугим ногама.
    info: |
      Типула је двокрилни инсект из породице Tipulidae, изгледом налик џиновском комарцу, али не убада и не паразитира.
      Изузетно дуге ноге лако отпадају; то је одбрамбени механизам (аутотомија).
      Одрасле јединке живе само неколико дана и или не једу или се хране нектаром.
      Ларве живе у земљишту и хране се корењем.
  insect.mayfly:
    label: водени цвет
    summary: Инсект с најкраћим одраслим животом, који траје тек сатима до данима.
    info: |
      Водени цвет је инсект из реда Ephemeroptera и симбол пролазности; одрасле јединке живе тек сатима до данима.
      Немају функционалне усне делове и уопште не једу.
      Ларве живе од 1 до 3 године под водом.
      Масовно ројење водених цветова задивљујући је призор природе; на Дунаву у Мађарској то је јединствена појава.
  insect.damselfly:
    label: девичица
    summary: Витка сродница вилиног коњица; у миру склапа крила уз тело.
    info: |
      Девичица је инсект сродан вилиним коњицима, али витији, и у миру склапа крила упоредо с телом, за разлику од великих вилиних коњица.
      Грабљивац је и лови мале инсекте у лету.
      Ларве живе у води и чине важан део водених екосистема.
      Показатељ су квалитета водотокова.
  insect.robber_fly:
    label: мува разбојница
    summary: Грабљива мува која хвата друге инсекте у пуном лету.
    info: |
      Мува разбојница грабљиви је двокрилни инсект из породице Asilidae који хвата друге инсекте директно у лету.
      Има снажне ноге за хватање плена и убодну сурлу за убризгавање паралишућег отрова.
      Неке врсте опонашају изглед бумбара или оса као заштиту од грабљиваца.
      Корисна је као природни регулатор популација инсеката.
  insect.ground_beetle:
    label: трчуљак
    summary: Брз грабљиви тврдокрилац који живи под камењем и у стељи.
    info: |
      Трчуљак је тврдокрилац из породице Carabidae; већина врста активни су ноћни грабљивци који лове друге инсекте, глисте и пужеве.
      Брзи су и брзо беже од опасности.
      Неке врсте, попут љубичастог трчуљка, имају прекрасан металик сјај.
      Показатељи су здравог земљишта и природне пољопривреде.
  insect.tiger_beetle:
    label: пешчар
    summary: Брз тврдокрилац металик боје с изврсним видом.
    info: |
      Пешчар је тврдокрилац из потпородице Cicindelinae, познат по необичној брзини, способности лета и оштром виду.
      Трчи тако брзо да се мора зауставити и изнова оријентисати, јер је кретање пребрзо за његов вид.
      Има прекрасно обојена металик тела (зелена, плава, црвена) и велике очи.
      Ларве копају усправне тунеле у земљи и вребају плен на улазу.
  insect.hoverfly:
    label: осолика мува
    summary: Мува која опонаша боје оса и пчела; опрашивач башти.
    info: |
      Осолика мува двокрилни је инсект из породице Syrphidae који опонаша боје оса и пчела као заштиту од грабљиваца (Батесова мимикрија), иако не убада.
      Важан је опрашивач; посећује више биљних врста од пчела.
      Одрасле се јединке хране нектаром и полином.
      Ларве неких врста лове лисне ваши и тиме помажу у башти.
  insect.whirligig_beetle:
    label: вртешка
    summary: Мали тврдокрилац који се у ројевима врти по површини воде.
    info: |
      Вртешка је водени тврдокрилац из породице Gyrinidae који живи на површини, а вртење у ројевима помаже му да избегне грабљивце.
      Очи су му подељене на два дела; један види изнад воде, други испод ње.
      Осећа таласиће на површини који сигнализирају храну или опасност.
      Дању се врти, ноћу лети.
  insect.louse:
    label: ваш
    summary: Ситан бескрилан паразит који живи на кожи и у длаци сисара.
    info: |
      Ваш је бескрилни паразитски инсект из реда Phthiraptera који живи на кожи домаћина те у његовој длаци или коси.
      Сиса крв и изазива свраб.
      Главена ваш постоји у целом свету и погађа децу без обзира на хигијенске услове.
      Историјски су ваши преносиле пегавац и друге болести.
  insect.bedbug:
    label: стеница
    summary: Пљоснат паразит који ноћу сиса крв; крије се у пукотинама намештаја.
    info: |
      Стеница је пљоснат овалан инсект из породице Cimicidae, активан углавном ноћу.
      Гризе и сиса крв успаваног домаћина.
      Крије се у пукотинама душека, у намештају и иза тапета.
      Последњих се деценија раширила целим светом захваљујући међународним путовањима.
  insect.antlion:
    label: мрављи лав
    summary: Ларва која копа левкасте замке за мраве у песку.
    info: |
      Мрављи лав ларва је инсекта из породице Myrmeleontidae која копа купасте левке у сувом песку.
      Кад мрав склизне у замку, мрављи лав га зграби вилицама и убризга дигестивне сокове.
      Одрасле су јединке неугледне, налик вилиним коњицима, и лете ноћу.
      Ларве могу годинама живети под земљом без хране.
  insect.goliath_beetle:
    label: голијатски тврдокрилац
    summary: Један од највећих и најтежих инсеката на свету, из тропске Африке.
    info: |
      Голијатски тврдокрилац један је од највећих инсеката на свету; мужјаци теже до 100 грама и нарасту дуже од 11 cm.
      Живи у тропским прашумама екваторијалне Африке.
      Одрасле се јединке хране воћем и биљним соком.
      У Африци их деца понекад држе као играчке, а продају се и колекционарима.
  insect.bombardier_beetle:
    label: бомбардерски тврдокрилац
    summary: Тврдокрилац који у одбрани испаљује врелу отровну смешу.
    info: |
      Бомбардерски тврдокрилац тврдокрилац је из потпородице Brachininae који се брани на јединствен начин; у задатку меша две хемијске материје, што изазива експлозивну реакцију на више од 100 степени.
      Веома нагризајућа пара испаљује се уз гласан прасак и до 500 пута у секунди.
      Један је од најзадивљујућих примера хемијске одбране у природи.
  insect.diving_beetle:
    label: гњурац
    summary: Грабљиви водени тврдокрилац који плива испод површине.
    info: |
      Жуторуби гњурац грабљиви је водени тврдокрилац из породице Dytiscidae који живи у барама и стајаћим водама.
      Спретно плива захваљујући пљоснатим задњим ногама које делују као весла.
      Дише на површини и складишти ваздух под покрилцима.
      Лови инсекте, ларве, мале рибе и пуноглавце.
  insect.velvet_ant:
    label: баршунасти мрав
    summary: Бескрилна наранџасто-црна оса која личи на мрава.
    info: |
      Баршунасти мрав заправо је оса из породице Mutillidae; женке су бескрилне и личе на мраве.
      Имају упадљиве црвене или наранџасте длачице као упозорење.
      Женке имају изузетно снажну жаоку, надимка убица крава.
      Паразити су у гнездима бумбара.
