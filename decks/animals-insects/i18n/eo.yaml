pivot: false
title: Insektoj
cards:
  insect.ant:
    label: ant
    summary: Plej malgranda socia inseto vivanta en komunumoj.
    info: Anto estas insektaro formanta grandajn koloniojn kun labordivido.
  insect.antlion:
    label: antlion
    summary: Insekteklarvo kiu gravuras sandtrapon por atrapi fornikedoj.
    info: Antlion estas insektlarvo el la familio Mrimeleonotidoj kiuj graviĝas konikaj trapoj en seka sablo por prizorgi formikedojn. Kiam unu faligas sin al tie anto ĝi kaptegas per mankoj kaj injektas digestan sukon; adultaj individuo similas libelojn sed flugas noktime dum longa vivo sub tero sen nutro.
  insect.aphid:
    label: aphido
    summary: Malgranda insekto sur ligno de arboj; produktanta meleton.
    info: La aphidoj estas malgrandaj insektoj el la superfamilio Aphidoidea kiu suĉas salkon de vegetalok. Ili produktas glukan melaton por antaŭuloj kiuj protekteblas en respondo al ĉi tiu donaco.
  insect.atlas_moth:
    label: Atlas martinaturo
    summary: Unu el la plej grandaj faraso-specioj en mundo kun krilotegno imitanta serpentokapoj.
    info: La Atlas-martinaturo estas unu el la plej grandaj nokturnaj farasoj de tiu mondo kun krilplato ĝis 30 centimetrojn larĝa. La randoj de ties kriloj havas bildon similan al kapoj da serpento por malhelpi pridontado per predatoroj. Aduktoj mankas buŝo kaj tamen vivantaj nur kelkdaŭre post eksterdiro.
  insect.bedbug:
    label: sangukcido
    summary: Plata insano kiun manĝadas sangon noktime kaj kaŝatas inter mobiliofendeto.
    info: La sanguksido estas plata ovala insekto el la familio Cimicidae, pleji aktiva nokte. Ĝi trafandas per sangon preni dormanta gastigonto kaj kaŝas sin en fendojn de materacoj, aranĝaĵoj kaj sub paperaroj. En lastaj jardekoj disvastiĝis pro internacia vojaĝado.
  insect.bee:
    label: apis Mellifera
    summary: Balzano-faruonta flanko-nigrulo ĉe florpoluo per sia laborado kun la plantoj de ĝin por fari manĝan eblecojn el tiuj plenigitaj sukerumoj dum tio ke Ĝi ankaŭ donacas al homaro grandan parton pri nutraĵoj kiel ekzemple hondoj sed ankaŭ diversaj fruktoproduktaĵoj inkluzive de sagoj kaj mebloj.
    info: '{"hint":"neklara punganta insekto kiu faras balzancon","info":"La Apis mellifera estas socia insato vivanteco en kolonioj kaj kolekteca nektaron.","label":"apis_mellifera","summary":"Flankokolora insato kiun oni poluigas florojn kaj produktas balzman."}'
  insect.beetle:
    label: Broko
    summary: Kolėopoteroj formadas plenon da entomoj kun pripasa ol miliono de deskritaj specioj.
    info: La broko apartenas al la ordeno de Kolėopoteroj kaj formas proksimume 40% el ĉiuj deskribitaj insekte speciojn. Ili havas dura tegmentoj por protekto super iliaj volantaj flankpintiloj sub tiu. La elkornbroko estas plej granda eŭropa broko; virino posedas fortajn hornecajn mandibloj.
  insect.bombardier_beetle:
    label: blindito artileria
    summary: Bruokon kiun emaforas bolanta toksiko mixo.
    info: 'Blindita artilleria estas bruoko el subfamilio de Carabididoj kiu defendas sin per unika maniero: ĝi miksiĝas du kemikoj en la pinto por kreigi eksplosivan rekton kun temperaturo pli ol 100°C. La tre venenema varma vaporo estis forĵeta mekanike supren al kvincent fojojn dum momento.'
  insect.bumblebee:
    label: bombarto
    summary: Granda pelua bombarta besto kun forta bruo pri flugo; grava pollinatoro.
    info: Bombaro estas granda peluza insekto el la genro Bombyx, rilata al apido. Ĝi gravas pro polinigo, aparte en pli malvarmaj klimatecoj, kiuj ne permesas multekostigi flugadon de apiĝoj. La bombara kapablas varmi sin tremante kun volflankaj musoloj por ebligadi flugi ankaŭ dum malpaca vetero.
  insect.butterfly:
    label: butero
    summary: Fluganta insekte kun grandegradaj colorigitaj vangok.
    info: Butero estas insekte kun du paroj da skalahavaj vangoj, ofte klare videblaj.
  insect.caterpillar:
    label: katereco
    summary: La laruvo de papilionido aŭ molko; mangxas foliojn kaj preparas sin por inkokoni.
    info: Katero estas la laruvo de papilionido aŭ molko kaj pasigas sian vivon plejparte manĝante foliojn por akumuli energion necesa al metamorfozo. Kelkes da tiuj katerek havas klare videblajn kolorojn kiuj minacas pridiktulojn pri ilia venenozeco. Post ĉi tio eksterprenis en kokono (ĉirizidon), dum kiu okazos plena transformado al adulta formo.
  insect.centipede:
    label: stonozoko
    summary: Multigambe animalo kun po du gamboj pri ĉiu korpoelemento.
    info: "La stonozoko apartenas al la klaso de ĉilojedroj kaj havas unu paŭron da gambojn sur ĉiu korpelemento (nek cent gamboj, kiel sugestis ties nomo). \nĜi estas rapida pridupredulo kiun manĝatas insektojn, vermojn kaj malgrandajn vertebratojn. La unua paro elgamboj transformiĝis en venenajn ŝtonoklopodojn por paralizi siajn predojn."
  insect.cicada:
    label: zikato
    summary: Insekto fama pri forta voĉdonita kantaro dum varmaj tagoj.
    info: La cikada estas insekto el la superfamilio Cicadoidea konata kiel unu el plej sonoraj inter ĉi tiuj bestoj. Virinoj produktas sonojn per specialaj membranoj en ilia dorso por alproksimiĝigi reprodukte al femaloj. Kelkaj usonaj species havas dudekanjaran vivociklon.
  insect.cockroach:
    label: termito
    summary: Plenkorpulo rapidan nokte agantan kun kapabla adapti sin.
    info: La termito estas unu el la pleje rezistemaj insektoj sur Tero kiu povas vivi eĉ en kondiçoj kiuj mortigus aliajn bestojn inkluzive de radiado. Plie ol 4 500 specioj ekzistas sed nur proksimume trideko da ili loĝadas apud homoj. Ĝi estis jam tie dum pli longe tempo - tiom ol tremilijaro da jarcentoj ke ankaŭ superpremis dinosaurojn.
  insect.crane_fly:
    label: tipulko
    summary: Grandeco-moski simila inspekto kun tre longaj gambejo.
    info: La tipulketo estas dukrilula insekte el la familio de Tipulidoj kiu vide similas al granda moskito sed ĝi ne priduras kaj ne parazitas. Ŝiajn ekstreme longajn gambegele facile rompiĝas – tio funkcias kiel defenda mekanismo nomita autotomy. La plenkreskjupoj vivadas nur kelke da tagoj kaj ne manĝas aŭ nutriĝas per medopulo.
  insect.cricket:
    label: gripi
    summary: Nokaĥa inspekto konata pri strikuladaj voĉoj eldonaĵaj fare de virino.
    info: La Gryllo kampestra estas nokta insekte de la ordeno Ortoptera. La maskuloj emas per frapado kun iliajn kruriloj por allogi femalojn kaj difini sian territorion. En Azio gryljokonfido tradicie establiĝis ĉe homoj kiun amas ties melodiano sonorado.
  insect.damselfly:
    label: libelo
    summary: Malka libelon similaĵo; ĉe ripozo tenas siajn flugilojn paralelan kun la trupo.
    info: Libello estas insekto proksima al libelluloj sed pli maldika kaj dum ripozo ĝiajn flugilojn tenas paralelan kun la korpa akso kontraste de tiuj el la grupo Libelloidea.Ĝi havas pridomon konduton kaptante malgrandan insectaron en volado.Nimfoj vivas subakve kaj formas gravan parton da akuŝaj eko-sistemoj.Krome ili funkcias kiel markato por aguo-kvolo.
  insect.diving_beetle:
    label: POTAMNIKO
    summary: Akva predatoro natanĉanteco subakve.
    info: Grossa potamniko estas predaktora akua formico el la familio dytiskidoj vivanta en ejojn de stagnante akvoj kiel estuaroj. Ĝia glata natado povas dank' al siaj plankaj postuloj funkciantaj kiel remiloj.Ĝi spirmas sur surfaco kaj tenas sian aeron sub ŝvelŝildeto.
  insect.dragonfly:
    label: libello
    summary: Insekto longkorpa per du paroj klarecajn flugilojn.
    info: Libelloyo estas predato hovelo kun tre bonkvalita vidkapablo, kiun oni trovas proksime de akvakoveritoj.
  insect.dung_beetle:
    label: VRABOUD
    summary: Larvalo rollanta bulgojn de stercoro, sankto en Malnov-Egipta.
    info: La Vraboudo sankta estas larvaĵo el la familio de Skarabeidoj kiun formigas sterko en pilkojn kaj rulus ilin por entombigi ĝiajn ovojn. En malnova Egipto estis simbolo pri suno kaj dio Kebro. Tio unu el kelkaj bestoj kiuj navigacias uzante Via Lactea. Helpas reuzadon da nutraĵoj kaj aerigon de tereno.
  insect.earwig:
    label: Termito
    summary: Longa formo kun klavoj sur finflanko.
    info: La termito estas insekte el la ordo de Dermapteroj karakterizita per klavetoj ĉe la fundo por defendado kaj reproduktado. La nomo naskis pro falo ke ili eniras al homoj tra oreloj – tio ne veras. Termites oni pleje unuopaj bestaroj kiuj pridomigos eĝenon pri siajn ovumoj kaj junuloj.
  insect.firefly:
    label: lumembrilo
    summary: Bruko uzanta bio-lumo-emision por atrakti partenron.
    info: La lumenbrilo estas bruko el la familio de lampiridoj kapabla produkti varm-mallongan luminon per luminoemisio en sia pugo. Ambaŭ sexoj emitas diversajn paĝetojn por interesi unui alian kaj trovi parteneron; tiun efikon kontrolas kemia rekto kun luzifero kaj luziferso. Luminibriloj ankaŭ funkcias kiel markulo pri ekologia pureco.
  insect.flea:
    label: pulgu
    summary: Malgranda saltema parazita besto kiun manĝadas sangon de mamuloj kaj birdoj.
    info: Pulgu estas senflugila insekto el la ordeno de Skifontanoj speciale koncentriĝanta al vivado per eksterparazito. Iliajn fortikaĵojn en iliaj malantrankilaraj nocioj ebligas salti pli ol cent kvindekfoje longege ol sia korpotrunko. Pulgoj trinkas sanguin de mamuloj kaj birdoj kaj povas transdonadi infektiojn; historiaj pandemioj estis disvastigitaj pere de pulgoparazitoj.
  insect.fly:
    label: musko
    summary: Ofta dua-fluga insekto kapabla transdonadi bacteriojn.
    info: La Musca domestika estas la plej oftaj duflugiloj en homaj hejmposedaĵoj. Ĝiajn komponigitaj okuloj permesas rigardi preskaŭ 360 gradojn ĉirkaŭe de si. Ĉar ĝi atingas malpurigojn kaj manĝon, ĝi transportas baktariojn.
  insect.goliath_beetle:
    label: goliat
    summary: Unu el la pleje grandaj kaj pesantaj insektoj originante el Tropika Afriko.
    info: La Goliát giganta estas unu el la pleje grandaj insektoj en mondo kies maskloj pezas ĝis cent gramojn kaj atingas longon pli ol naŭ centimetroj. Ili loĝadas tropan arbarojn sub Saharo-Afrikio. Adukuloj manĝas fruktojn kaj lignan sokucon.
  insect.grasshopper:
    label: grilo
    summary: Saltanta insekto kun longaj malantermaj jambokoj kaj klakson.
    info: Grilo estas insekto el la ordeno de Ortoptera kun fortikigitaj nigras piedoj permesantaj saltadon ĝis dudeklonge ol ties korpo. Virinoj produktadas karakterizan sonoradon stridulado tra rubado inter iliajn gamboj kontraŭ flugilujoj. Ili manĝas vegetalecon; en granda grupo povus kaŭzi damaĝoj al agrarproduko.
  insect.ground_beetle:
    label: strivoleo
    summary: Rapide aganta prahuntisto vivante sub ŝtonoj.
    info: Strivoleo estas karabido-kolombo de la familio Carabididae; plej multaj specioj estas aktiva nokta predatoroj kiuj kaptas alian insektaron, vermojn kaj moluĉkojn. Ili moviĝas rapidan kaj forfuĝas rapide antaŭ danĝero.
  insect.hornet:
    label: bombylo
    summary: Plej granda eŭropa vespido kun forta veneno kaj sonora zumbadeco.
    info: Bombyla komuna estas la plej granda eŭropa socia vespo kiu atingas longon pli ol 3,5 centimetrojn. Ĝi konstruas paperhunavejo en arbotrunkoj aŭ sur tegmento de domoj. La venena spico estas pli longa ol tiuj el aliaj vampiroj kaj ties pungado dolorigegas pli multe; tamen bombylato nur subite batalas dum rektaj minacoj por si mem. Tio ankaŭ funkcias kiel grava pridiktoro pri alia insekteco.
  insect.hoverfly:
    label: Pes't-ren'ko
    summary: Insekta muŝo kun aparanca eksteraro simila al Ĉevolo kaj Abeleo sed sen dentilo.
    info: "La pestrenko estas dukrilula insekto el la familio de syrfidoj kiu imitas ĉevalan kaj abelen koloradon por proteksi sin kontraŭ predatoroj ( Batesa mimiko ), kvankam mem ne puŝas. \nĜi gravuramas florpetalojn plenumante polenigon tasko en jardinoj dum manĝado de sokuĵoj kaj pelotoj per sia lingvo. \nPaperoj da kelkaj specioj kaptegas afididojn helpante al homoj kontroladi tiun plantendemon."
  insect.lacewing:
    label: goldenokulo
    summary: Delika inseto kun klare venstretraj Ĉevaloj; Knaboformoj atakas afidos.
    info: La goldenokulo estas insekto el la familio de Chrysopidoj kun delikatajn klare venstretranaj ĉevaloj kaj okuloj en oro-koloro. La knabformoj estas predatores kiuj manĝas grandan kvanton da afidlarvoj, tial ili funkcias naturale por plantprotektaĵo. Adulti vivmanĝadas per nektaro kaj polenon.
  insect.ladybug:
    label: berusk(o)
    summary: Ruda rotonflugilo kun nigri punktoj sur dorso de Coccinelidaj familio.
    info: '{"hint":"malgranda ronda ruĝa kafreto kun nigraj pintoj","info":{"cs":"Berusko estas malgrandaj formidoj kiuj manĝas akarniojn kaj utilas en la ĝardeno."},"label":"berusk(o)","summary":"Ruĝ-kafa rondboka insecto kun nigraripoj."}'
  insect.locust:
    label: grashopido
    summary: Migrantaj grashopidetoj formas forterektenajn grupojn el milioj.
    info: La migranta grashopido estas speco de grashopido kiu sub certaj kondiĉoj formigas grandegajn migrantan multon da individuanojn. La grupo povus esti en la bilionoj kaj detruit plenan rekton sur centoj da hektaroj dum unu tago.
  insect.louse:
    label: pud
    summary: Malgranda senfluga patogeno loĝantaro per la skapo kaj haroj.
    info: Pudo estas senflugila patogena insekto el la ordeno Phtiraptera vivanta sur korpo de siaj gastiguloj. Ĝi trinkas sanguon kaj kaŭzas pruradon. La kap-puda infekto eksterordinare disvolviĝis en tuta mondo kaj afektadas infantojn sendepende pri egeco kondiĉoj.
  insect.mayfly:
    label: mayfluo
    summary: Insekton kun plej mallongviva adulta vivo – ili vivas nur kelkajn horojn ĝis tagoj.
    info: Mayfly estas insekto el la ordeno Ephemeroptera kaj simbolo de efemereco; plenkreskaĵoj vivas nur horojn ĝis tagojn. Ili havas neniajn funkciantajn buŝpartiojn kaj tial neniam manĝas. Ninfoidoj lozi sub akvo dum unu al tri jaroj.
  insect.mosquito:
    label: mosko
    summary: Du-flugila insektego kun kapabeco infekti eksteren.
    info: Moscas estas duflugilaj insektego el la familio Culicidae. La femalo trinkas sanguon de bestoj por akiri proteinojn necesaĵan al reprodukcio; maskloj vivas per nektaro. Moskas transdonadas seruriloj kiuj inkluzivas malariacon, dengefebremon kaj zigovebrenon.
  insect.moth:
    label: polimordo
    summary: Nokturna parenco de papilio; flugas ĉirkaŭ fonto de luminumo kun plumumaj antenoj.
    info: Polimorfok estas nokturnaj papilioj el la ordeno de Lepidoteroj kiuj diferenciĝas de tagpapilionoj pro tio ke iliajn pterilojn ili tenas en ripozo forigita al flankoj. Multe da ripozado species attraheblas artefaritan lumon. Nekutime ni ricevis naturan serapon dank' al larvoj de polimorfoj.
  insect.praying_mantis:
    label: mantismo
    summary: Pretatorhimo kun oreja posito kaj lampurapideca atako.
    info: La mantiso religia estas predatorko el la grupo de Mantomorfoj. Ĝin nomis pro tio ke ŝajne tenas siajn antauanĝulojn en preĝado. Ĉi tiu besto establas rekordon pri pafado per rapideco; ĉe unua momento ĝi atakadas kaj kaptras manĝon dum fragmento da sekundo.
  insect.robber_fly:
    label: streĥatkato
    summary: Insekto kaptebla de streĥatakato dum flugo.
    info: Streĉetko estas duflugila insekteĝo el la familio Asilidacoj kiun ĉasanta aliajn insektoj dum volado per forta gambegego por sereni sian prezan kaj pungilo por enmetadi paralizigantan venenon.
  insect.scorpion:
    label: skorpions
    summary: Venema arakno kun krurumado kaj kurbuma veneno.
    info: Skorpiono estas arkhoneo kun karakterizaj kruroj kaj kurba venena vosto finanta en piko. Ĝi vivas jam ekde pli ol 430 miliardo da jaroj antaŭe la plej malnovaj fossiliaĵoj estis trovita. Ili lumigas sub ultraviola lumo dum noku.
  insect.silverfish:
    label: lepisematido
    summary: Senfluga rapid-movema inseto trovita inter libroj kaj paĵero.
    info: La Lepismatido estas malmoderna senflugila insekte specio el la ordeno Zygentomo vivanta en hejmprezonojn. Ĝin nutras amilozo, paperon, liberkolantom kaj tekstilan fibrilon. La nomo de tiu besto derivas pro sia arĝenta bruo kaj similado al fiŝmovoj.
  insect.spider:
    label: arano
    summary: Okgambega besto kiun oni nombras aranoforma, havante kapablodon fabriki retetojn.
    info: Arano estas artropodo el la ordeno de Araneoformoj kun ok gambegoj kaj du partoj en ties korpo. Ĝi povas produkti filamentojn por konstrui retojn uzotaj al pridomo aŭ protektado da ovoj per kokonoj.
  insect.stag_beetle:
    label: Gran lucano
    summary: La plej grandspeca eŭropa kolombo kun roga-kaptiloj.
    info: El Gran Lucano estas la plej granda eŭropa kolombo atinganta longon pli ol 7 centimetrojn. La masklo havas enorman rogo-mandibulojn por konkurbi pri femaloj. Ĝia larvo vivadas en mortinta arbara ligno de akacio dum ekzakte sep jaroj kaj manĝatas fungoj.
  insect.stick_insect:
    label: strashilda
    summary: Insekto kiun eksteren videblas arbofoliaĵo.
    info: Strashilda estas insekto el la grupo de Phasematodoj kaj mastrimo en imitado; ties korpo perfekte similas branĉojn aŭ foliojn. Ĝi restadas senmova dum danĝero. Kelkaj species reproduktiĝas per partogenesis, do sendepende de maskulo.
  insect.termite:
    label: tarmido
    summary: Sociala inseto kiuj konstrukcias grandegajn termomontetojn.
    info: Tarmido estas socia insekto el la grupo Isopteroj kaj malproksime rilatanta al imiduloj. Ili vivas en komunumoj kun reĝo, reginino, soldatoj kaj laboristoj. Tiam konstruadas kompleksan terman monton ĝis naŭ metrojn alte en tropejoj per ventila sistemo.
  insect.tiger_beetle:
    label: carabdino
    summary: Rapida kaj malvarma kolorita bruokon kun tre bonorda vidkapableco.
    info: Carabido estas bruoko el la subfamilio de Cicindeloidej famata pri eksterordinara rapidemo, kapablo flugi kaj akra videco. Ĝi kuras tiom rapide ke devas haltigi por reorientoĝi mem, ĉar movado tro rapida estis al ties vidosistema; havante metalan brilo kun grandaj okulojn en diversaĵoj kvazaŭ verda, blua kaj ruza.
  insect.velvet_ant:
    label: Eumuttila
    summary: Rubro-naranga flugsensenta veso simila al formiko.
    info: |-
      La Eummutilla eŭropa estas fakte voso el la familio de mutilidoj; ĝin distingas per senflugilo kaj eksterordinare forta stango nomita 'kravo-murdiĝo'.
      Ĝiajn rubran aŭ narandgan plumon oni rigardas kiel aversigadmarkojn por malpermesi al predikontoj proksimiĝi.
  insect.wasp:
    label: vespo
    summary: Flava kaj nigra ŝtopinta inseto faranta paperhunuo.
    info: La vespo ordinara estas ŝtonpapera konstruanta insekto el la genro Vespa kun tipika flave-nigra averto kaj kapabla piki plurfoje male al apidoj.
  insect.water_strider:
    label: akvodetektisto
    summary: Insekte promenanta super akvasuprafacon dank' al tensa forco.
    info: Akvamedio estas insekto el la familio de Geridaj kapabla promeni sur akva surfaco pro hidrofoba pelto kiu ĉasigas naskon en siaj gamboj kaj tenso de akvo-surfaco.Ĝi prizorgas submergitan insectojn kiuj estis trovita per vibraj movadojn pri surfaca agordo.
  insect.weevil:
    label: nasito
    summary: Malgranda buto kun karakteriza allongita nazo.
    info: La nasita ĉevalo estas insektbuto el la familio de Curculionidae, plej granda animalfamilio en mondo kun super 60 mil specoj. Karaktera forlongigita nazo servas por perfortado al fruktoj, semenojn kaj lignon.
  insect.whirligig_beetle:
    label: gyrinoid
    summary: Malgranda insecto formante cirklojn por vivado.
    info: La gyrino estas akua insektido el la familio de Gyrenidaj, kiun trovas sur surfaco de akvo; ĝia rotacio en grupojn helpas al li ekzisti antaŭ gepastoj. Lia okulo estadas dividita du partojn - unu rigardanta super akvon kaj dua subakva. Li detektas Ŝveladon pri nutraĵoj aŭ danĝero.
