lang: ta
pivot: false
title: பூச்சிகள்
cards:
  insect.ant:
    label: '{"label": "ஆலி"}'
    summary: '{ "summary": "குழுவில் உருவாக்கப்பட்ட ஒரு மிஸ்ரஞ்சிய இனம்.", }'
    info: '{"info":"குறிப்பான சமூகத் தண்டவடங்கள் ஆலி(formica)யில் வசிக்கப்போகின்றன."}'
  insect.aphid:
    label: மால்சி
    summary: ஓர் ஒழுங்கான நீரை ஏற்றினஞ்சுகளில் உள்ள பசியற்ற வண்டுஃ ஹௌஸ் ஜெல்.
    info: "மால்சிகள் தென்முகடி aphidoideaயில் உள்ள பசியற்ற வண்டுபோன்றவர்கள், இது ஒழுங்கான நீரை ஏற்றினஞ்சுகளில் ஊசி அடிக்கின்றன. \nஇவை ஸ்ரூஸ் எனப்படும் ஃபிஷ் ஐ உற்பத்தி செய்கின்றன,\nஅதனை ஓர் ant குறிப்பாக பாதுகாப்பு வழங்குவதற்கு மாற்று வடிவில் பெற்றுக் கொள்கின்றன."
  insect.atlas_moth:
    label: Atlas moth
    summary: ஓர் உலகின் பழமையான இளவணியற்றுப் பசுமைத் தோல்விரிச்சுகளில் ஒன்று.
    info: |-
      அட்லாஸ் மொருகின் கனி உலகின் பழமையான இளவணியற்றுப் பசுமைத் தோல்விரிச்சுகளில் ஒன்றாகும், அதன் நீளம் 30 செ.மீ எட்டுகிறது
      இதன் ஓரங்கள் ஹூட்ஸ் ஐ ஞானம் ஏற்படுத்தும்,
      ஆனால் இது ஜீவனை அல்லது ஷௌஹாஃப் ஐ உண்ணாது;
      இது தெற்காசியாவின் ஃப்ளோரி஡ா காடுகளில் இருந்து வருகிறது.
  insect.bee:
    label: அபிஷ்
    summary: இது ஒரு கருப்பு - மஞ்சள் நிழல் கொண்ட கூட்டம்; பூக்களை பூச்சு மற்றும் மொட்டு உறவாக உருவாக்குகிறது.
    info: மொட்டு உறவாகத் திரளான பசி மரபணு கூல்லியின் ஒரு வகையான Apis mellifера நீர்ச்சேர்ஃ அஃபிஸ் என்ற ஆங்கில ஏழை ஜோடியின் ஓர் ஐஸ் ஹௌஸில் வாழும் ஒரு சமூக கூட்டம்.
  insect.beetle:
    label: அறை
    summary: '''ஆலிர்ட்ராஸ்'', ''எலிஃபொர்ஷியா'' ஆகியவை ஹெமிஓஃபெரா ஜாதியைச் சேர்ந்தவை.'
    info: பெரிய குறட்டி பால் உள்ளதும், மனிதக் கணவயில் இருக்கும் 'சோலின்ஸ்' என்ற வழிநீள சூழ்வதுமான ஒரு அறை ஏற்படுத்தும்.
  insect.bumblebee:
    label: மரசலி
    summary: இது ஒரு பெரிய கோழி வண்ண வண்டு ஆகும்.
    info: "பாம்பஸ் குடும்பத்தில் உள்ளவையான மரசலி வண்டுகள் நறுமண இனப்பெருக்க ஊழியங்களாக செயல்படுகின்றன; அவை ஒரு ஜீனசுடன் ஐஞ்சிருக்கின்றன. \nஅவை எளிதில் ஏற்றத்தாழ்வுகளை ஏற்றுக்கொள்ளும் தன்மையுடன் ஓட்டம் காணப்படும் குளிர்காலத்தில் ஹூன்ஸ் வண்டுகளை விட மிக முக்கியமானவை."
  insect.butterfly:
    label: மோட்டகள்
    summary: அழகிய ரூஃபிஸ் ஃப்ளையிங்.
    info: '{"info":"மொட்டகள் எனப்படுவது Lepidopteraயில் உள்ள ஒரு வாலி இனமாகும்; அதற்குச் சீரழிந்த மணியங்களின் ஆடும் ஓர் ஏட்டிற்கு ஐஸ் ஈடுபடும்.","label":"மோட்டகள்","summary":"அழகிய ரூஃபிஸ் ஃப்ளையிங்."}'
  insect.caterpillar:
    label: ஹௌசென்கா
    summary: கொடிமாற்று அல்லது கரணம் ஒன்னுள்ள தவழ்விடப்பூச்சியின் இயல்நிரை ;எலுமிழ்களை உண்ணுவதன் மூலம் ஞாணியாகும்.
    info: கொடிமாற்று பசி அல்லது கரணம் ஒன்னுள்ள தவழ்விடப்பூச்சியின் இயல்நிரை ஆகும். எலுமிழ்களை உண்ணுவதில் ஓரளவு நேரத்தை செலவிடுகின்றது, ஏனெனில் அஃது ஜீவஇயல் மாற்றத்திற்கு(அஸ்திரமோர்ஃபோஸிஸ் )ஆற்றலை குவிக்கின்றது.
  insect.centipede:
    label: செலிபாட்டு
    summary: எல்லா கணுவிலும் ஒரு ஜோடி கால்கள்.
    info: "செலிபாட்டு வகுப்பில் உள்ளதும், தனது கணுவின் ஒரு ஜோடி மடியில் நடையறஅக்கும் இவை(இதன் சொல் அழகு எண்ணிறத்திருப்பதில்லை). \nஇவை ஓர் ஏட்டிங் ஹஞ்சர்; பூச்சிகள் , புழுக்கள் மற்றும் சிறிய நீரிழை விலங்குகளை பிடித்஼ல் .\n முதல் ஐர்ஃப் ஸ்டெஃப் ஷாஸ்ட் குறிப்பிட்ட தொலைவில் உள்ளது."
  insect.cicada:
    label: சிகாட்டா
    summary: ஹாட் ஃப்ளை என அழைக்கப்படும் இது ஞாயிற்றுக்கிழமைகளில் குரலை உயர்த்தி பாடும்.
    info: சிகாட்டா எனப் பெயரிடப்படும் இது cicada நகலற்ற ஒளி வழியில் உணவு சைக்கிள் மற்றும் தொடர்ந்து அதிர்ஷ்ணஸ் ஹீட் ஸ்னோரிங் ஐ ஏற்படுத்தும் ஓர் ஜூஃப் ஆகும்.
  insect.cockroach:
    label: புழை
    summary: ஓர் இரவு நேர பசியற்ற ஃப்ளஷ் ஸ்காவென்ஜர்
    info: |-
      புழையானது உலகில் மிகவும் தட்டி நசிப்பாளரற்ற ஒரு வண்ணமான இனமாகும்; அஃது செறிவு எதிர்ப்பு ஏற்புடன் மற்றும் மற்ற ஜீவராசியினரை கொன்றுவிடும் நிலைகளை தங்களோடு ஐயமில்லாமல் பூஜிக்க முடியும்
      இனம் 4,500 -ஐ விஞ்சியது,
      ஆனால் மனிதர்களுடன் ஓர் இடத்தில் வாழும் இனம் மட்டும் 30 ஆகும்
      அது பழமையான ஹைஸ்;
      புழைகள் 300 மில்லியன் ஆண்டுகளுக்கு மேலாக வாழ்ந்துள்ளன;
  insect.cricket:
    label: எஃப்ஸ்
    summary: ஹம்ஷ் என்று ஒலிக்கும் ஆண்களுக்கு பெயர்
    info: |-
      பூமியார் குழி என்பது ஒறட்டோப்தெராவின் வகையைச் சேர்ந்த ஓர் மலையளவு உணவு அல்லாத ஜீவமாகும்
      ஆண்கள் தங்கள் தொடைகளை ஒன்றோடொன்ரு ஏற்றி ஹம்ஃப் என்று ஒலிக்கின்றன,
      இதனால் பெண்ணை ஈர்க்கவும் ,அவர்களின் பகுதியை காண்பிக்கவும் செய்கின்றன
  insect.dragonfly:
    label: வாஜ்கா
    summary: இயல்ஃ உடல் ஓட்டம் ஆன ஹொமஸ் ஐரோஃப்ன்.
    info: வாஜ்கா ஒரு பிரசம் எதிரி; அதனைக் தண்ணீர் மட்டப் இடங்களில் சற்று நல்வழி.
  insect.dung_beetle:
    label: விரபௌன்
    summary: உடைக்குறியங்களை ஓட்டும் மண்வயல்
    info: |-
      விரபௌன் புள்ளி சாரட்டமலகத்தின் குறியீடு என்று அழைக்கப்படும் ஒரு மண்வயல் உயில்; இது நச்சு ஆறு குறியங்களை உருவாக்கி ஊற்றும் மற்றும் ஏழை ஐஸ் -ஐ ஓட்டுகிறது
      இது பழங்கால ஃஎகிப்தில் ஞாயிற் ஹோலூ ஷெஃப்ரிஜ் ஸிம்பல் ஆகும்
      அது மில்க் வே மூலம் திசை கண்டறியும் மிக குறைவான உயிரினங்களில் ஒன்றாகும்
  insect.earwig:
    label: எல்லாம்
    summary: நெளிஞ்ச உடல் மணிச்சீச்லின்
    info: "ஷ்குவோர் எனப்படும் இது dermapteras வகித்தலையொற்றி அழுத்திய மணிச்சீச்லின்(CERCI), நெளிஞ்ச உடல் ஒரு ஹூஸ் ஏஜெண்ட் ஐ கொண்டுள்ளது .\nஇது ரௌண்டு ஸ்டோன்ஜில் ,அடர்ஃபுல்ல் ஓஃப் என்ற கருத்தில் இருந்து வாய்ப்பு கிழிவுகளில் வாழ்கின்றது \nஆண்ணும் பெண்ணும் குஞ்சுகள் மற்றும் குழந்தைகளை பாதுகாக்கின்றது"
  insect.firefly:
    label: ஐஸ் ஸ்டார்
    summary: இணைந்து கொள்ள ஒளியொன்னூக்கு உண்டாக்கும் ஜீவ ஒளியை உண்டாக்கும்.
    info: சிலுவை பால்மி கடத் தரளமற்ற ஒளியொன்னூக்குப் உண்டாக்கும் வழிசெயல் நீரிழை எஃகு இருக்கிரங்களோடு அமைஞ்சு ஏற்படுத்தும் ஓளியை உண்டாக்கும் ஜீவ ஒளியை உண்டாக்கும் ஃபிளஷ் ஐஸ் ஸ்டார் ஹௌஸ் குடும்பத்தில் உள்ள ஒரு பூச்சி.
  insect.flea:
    label: ஃபிஷனாட்டரா
    summary: இருஞ்செவ்விழை உயிரினங்களின் இரத்தத்தை ஸஹஜமாக ஹஸ்தகாம் செய்யும்.
    info: புழக்கள் சிபோனாட்டராவில் இருந்தும் வசதி மற்றும் ஆய்வுகளை அல்லது உணவு என ஒரு ரூபத்தின் ஊடாக ஏற்றுக்கொள்ளும் ஓர் ஜீவ உயிரியாகும்.
  insect.fly:
    label: மொஹ்சா
    summary: எளிதில் பரவும் இருக்ரீடல் கொண்ட பூச்சி
    info: "மேச்கா டോமஸ்திசாவுடன் பயணப்படி மற்றும் உள்ளது\nஇருக்ரீடல் வழியாக நெருக்கமாக அமைந்த ஒளியை எடுத்துக்கொள்லும் ஓட்டம் \nஅதன் ஏஜின்ஸ் ஐ ஜிங்ஞஷன் ஹௌஸ் ஃபூட்டில் கூட\nஆஃப் கூட அது பாக்டீரியாவை பரப்பும்"
  insect.grasshopper:
    label: காஃப்ஃ
    summary: ஓங்கிய தண்டுகள் மற்றும் 'எழுப்பு' ஸ்டிரி஡ுலேஷன் கொண்ட ஹார்மிஸ்.
    info: "கால்நடை ஒருவன் orthoptera விலி உள்ளதும் பசியற்ற தண்டுகள் கொண்டு மயிர்ச்சப்பெட்டி அளவு இருக்கும். \nஆண்கள் எழுப்பும் ஏதோ ஓசூர்(Stridulation),அவர்கள் கஞ்சின் கீழ் கால்களை மௌஜை செய்யும் .\nஇவர்கள் தாவரங்களை உண்ணும் ; பெரிய ஜனஸ்தானங்களில் , அவர்கள்   ஐயமற்ற விழுப்புகளை உண்டாக்கலாம்."
  insect.hornet:
    label: அழு
    summary: இது ஒரு நீண்ட சூஸிங் அடிப்பு எஃகு ஐயும், ஓசிஃஆர் ஸ்டிண்ட் ஏஜெண்ட் ஜோடியும்.
    info: சர்ஷென் பாதுகாப்பில் உள்ளவற்றையும், Vespa mandarinia -ஐ தவிர மற்ற வலி கடியும் இணைக்கின்றது.
  insect.lacewing:
    label: ஜெரிசாஃப்பிடா
    summary: ஓட்டும் ஃப்ளோரல் ஷௌட்ஸ் மற்றும் புள்ளிகள்
    info: "செரிசாப்பிடி குடும்பத்தில் உள்ள இவற்றின் அலகுகள் வழக்கமான மண்ணையிரங்கள் என்று ஒரு நீண்ட ஜொலியான கண்கள் உடைய ஹூஸ் ஐ ஏற்றுகின்றன. \nஅவை ஓட்டும் ஃப்ளோரல் ஷௌட்ஸ் மற்றும் புள்ளிகள் ஆகியவற்றை உண்ணும்,\nஇவை ஞாலத்தின் ஆரோக்கியம் குறிக்கும்."
  insect.ladybug:
    label: பெருஷ்கா
    summary: இரண்டு கருமையான புள்ளிகள் கொண்ட சிறிய, வட்டமான, சிலியஞ் சிழை.
    info: பெருஷ்கா என்‌றும் அழைக்கப்படுவது ஒரு சிறிய வளையச் சிலி நண்ணல் தொகுதியைச் சேர்ந்த உயிரினமாகும்; மஸ்ஸிட்ஜிங் என்று ஏற்றுக்கூடிய ஓர் உயிரினத்தை உண்ணும்.
  insect.locust:
    label: கோபில்கா ஸ்தேஹொவஞுஸ்
    summary: அழியா ஹஜனூ மில்லியன் ஐடெண்ஷிஃபிங்
    info: கோபில்கா ஸ்தேஹொவஞுஸ்(சரன்சி), ஒரு வளையமலட்டத்தின் பண்ணை மற்றும் அழிந்து உள்ள ஆஃப்ரிக்கா என்று ஏற்படுத்தும் ஓட்டு ஜீவன்களை உருவாக்கும்.
  insect.mosquito:
    label: குளிகை
    summary: இரு ஆடி ; ஊழியர் இரத்தத்தை ஸ்ரஷ்டாக்களாக ஐஸ்ஜூல் ஹௌஜிள் ஃப்ரோ
    info: |-
      குளிகை என்பது சலசடங்கி வரம் மற்றும் தண்ணீர் நிலப்பகுதியின் ஒருவகையான இரு ஆடி உயிரினமாகும்
      இதன் ஊழியர் அணுகும் ஏதோ ஓர் உயிரினத்திடமிருந்து இரத்தத்தை ஸ்ரஷ்டாக்களாக ஐஸ்ஜூல் ஹௌஜிள் ஃப்ரோ புரோட்டின் கிழிஞ்சு கொண்டு குட்டி பொருள்களை உருவாக்கும்,
      அதே நேரம் ஆண்கள் நெக்டர் மூலம் உணவு பெறுகின்றன
      குளிகை மலேரியா , டெங்கு மற்றும் சிகா போன்ற பாதுகாப்பற்ற நோய்களை பரப்புகின்றன
  insect.moth:
    label: மூர்
    summary: இரவு ஓடும் எஃகு ஜோடி ; ஞாயிற்காலத்தில் ஏற்படும் ஊதியம்.
    info: மூர்கள் லிபி‍டாபுதராவின் நகர்வற்ற மணியல் ஆனவையும், திரிச்சல் இழைச்சீலை உற்பத்தியில் அவை ஒரு முக்கிய பங்கு வகிக்கின்றன.
  insect.praying_mantis:
    label: குட்லான்கா
    summary: ஆரஞ்சு ரீதியில் ஐம்ஸ் ஹௌஸ் ஷேஃப்ட் ஃபுட்ஜெஸ் போல் ஓஹோ தெரிவிக்கின்றது
    info: |-
      குட்லான்கா நபோஜினாவ் என்பது மண்டொடி வமசத்திற்குள் உறையும் ஒரு சூழலிய இனமாகும்
      இதன் அழைப்பு ஏற்பங்கள் ஆரஞ்சு ரீதியில் ஐம்ஸ் ஹௌஸ் ஷேஃப்ட் ஃபுட்ஜெஸ் போல் ஓஹோ தெரிவிக்கின்றது
      அதன் முன்ழி பாகங்கள் துரு மிளிர்வில் கொடுக்கப்பட்டு கால் குறிப்பாக கொடுக்கப்படும்
  insect.scorpion:
    label: ஆஜிள்
    summary: ஓர் உறைவிலி வளர்புழு கடல்
    info: "உறைவிலி வளர்புழுக் கடலின் ஒரு மனிதப் பயமானது ; இதன் ஆண்டுகள் 430 நூற்றாண்டுகளுக்குச் சொந்தமானவை .\nஇருளில் , அவை யுவி - எஃகிருங்கு ஏற்று ஓளியோடு ஞாஸ்ஸிழக்கின்றன . \nஅதன் 2500 ஐ குறிக்கும் ஜீன்களில் மனிதனுக்கு ஆபத்தானது."
  insect.silverfish:
    label: ரிபென்கா
    summary: இல்லஞ்சேர் புத்தகங்கள் மற்றும் காகிதங்களில் காணப்படும் வேகமான மஹத்.
    info: ரிபென்கா ஒரு மகத் தண்டுவடமற்ற உயிரி; இல்லங்களின் அடுப்பறைகளில் வசிக்கின்றது. சர்க்கரோஸா என்றழைக்கப்படும் நீரிழை ஏதுமிய ஜூஜிஃபொரா ஐ உண்ணும். இது ஓர் அரிதான ஹெட்ஸ்டோன்ஷிள் குடும்பத்தின் உறுப்பினர்.
  insect.spider:
    label: spider
    summary: எட்டு கால்கள் கொண்ட பாவூக்கள் , பூச்சிகளை கொல்ல வலை கட்டுகின்றன
    info: "பாவூக் என்பது ஆரணியமலடி(Araneae), ஒளித்கற்றையில்லாச் சேரும் மீன்வளையினமாகும்;இதற்கு ஏழு உறுப்புகள் அல்லது நஞ்ஜாக்டஸ் ஐ கொண்ட ஹோமிஸ் ரே ஓட்டிஷ் ஃபௌண்ட் என்பது குறிப்பிழந்து விட்டது\nஅஃது பூச்சி கொல்ல அல்லது குஞ்சுகளை காப்பதற்கு தாங்கள் உற்பத்தி செய்யும் துளை பொருளை பயன்படுத்துகின்றது \nஆண்டு முழுவதும் 5679 பாவூக் இனங்கள் உள்ளன"
  insect.stag_beetle:
    label: ரோஹாச்
    summary: ஐரோப்பிய உறையானின் மிகப்பெரிய இனம் ; ஆண் எஃகு அழகு ஓட்டும்
    info: "ரோஹாச் பிரபலம் ஐரோப்பியக் கடவுளின் மிச்சத்தன்றி 7 ஸெண்டிமீட்டர் நீளம் வளரும் ஒரு உறையான இனமாகும்\nஆண் எஃகு அழகு ஓட்டும் ஏற்பாடுகளைக் கொண்டுள்ளது ஜூஸ் லஞ்ச் ஹௌஸ் ஃபைட்டிங் ஷீட்டுகளை உருவாக்கும் \nஅதன் குழந்தை புழு பழுத்த மரத்தில் வளர்ந்து பூஞ்஛ங்களை உண்ணும்"
  insect.stick_insect:
    label: ஸ்டிராசுரெல்
    summary: ஓர் எஃப் -அல்லது சொறியை நகலெடுக்கும் ஒரு ஹென்ஞிழ்.
    info: "ஸ்டிராசுரெல் ஒன்றும் பஹஸ்மடோயே குழப்பத்தைக் கண்ணி அவற்றின் உள்ளூர் வீடு எஃப் -அல்லது சொறியை நகலெடுக்கின்றன. \nஇவர்கள் ஏதேனும் ஆபத்தில் ஓய்வு நிலையில் இருக்கின்றனர் .\nசில ஸ்பெஷிஃபிக்கு ஹென்ஜென்டிங் , ஐடியா பெண் இல்லாமல் இருக்கின்றனர்,\nஎளிய காரணங்களுடன் பிரபலமான எக்சாட்டிக் பௌட்டிக் பேஸ்ட்."
  insect.termite:
    label: தீர்மிட்
    summary: ஹில் கொண்ட பெரிய ஏரங்களை கட்டும் ஒரு சமூக நொண்ணையிற்
    info: தீர்மிட் எனப்படும் இசைவாலி களோஸ்தெராக்(isopter) வழியில் உறவு சூட்டின ஒரு நொண்ணையிற் அது ராஜா , ராணி, படைத்துறை மற்றும் தொழிலாளர்கள் ஆகியவை கொண்ட ஓர் குடிமனையில் வாழ்கின்றது .அவை ஏரங்களை கட்டுகின்றது; ஃபிளௌரிஷ் ஸ்஥லங்களில் ஜெயிஞ்சு ஹைட்ட் 8 - ஐ அடைகின்றது ;இவை காற்றோட்டம் கொண்ட சிக்கலான கட்டமைப்பு கொண்டவை.
  insect.wasp:
    label: ஓஎஸ்
    summary: அஸ்திரம் - கஞ்சியில் காகித ஏலக்கங்களை கட்டும்
    info: |-
      வெச்புலா வகித்தளம் கொண்ட மரத்தடி நன்றாய் சேறுபோல் உழைத்து ஒரு காகித அஸ்திரம் என்னும் ஏலக்கங்களை கட்டுகின்றது
      இது ஜீஃப் ஐ யூனில் ஓஹெச் ஹௌஸ் ஃப்ளை ஷெட் ஸ்டிண்டிங் என்று குறிப்பிடுகின்றது
  insect.water_strider:
    label: ஆஹஷிண்ஞ
    summary: அதன் மூலம் தண்ணீரின் மேற்பரப்பில் நடக்கும்.
    info: வாடோமிர்கா எனப் பழகும் இதயசலி வளர்ச்தியின் ஒரு நற்றண்டு ஆகும்; அஃது மையில்லா உறுப்புகள் மற்றும் ஏரியின் ஓரத்தில் ஊறும் ஹிஸஸ்ஜிங் ஐ பறிக்கும்.
  insect.weevil:
    label: நோசடிக்
    summary: நீளமான நொஸ்ஸம்(ஆஃப்ஷம்)
    info: |-
      நோசடிக் புழக்கள் curculionidae எனப்படும் தரவலி உயிரினத்தில் இரண்டாகும்;இது அறியப்பட்ட மிகப்பெரிய வகை சீலமாகும்
      அவை ஒரு நீளமான நொஸ்ஸம்(ஆஃப்ஃபு)ஐ ஏற்றிக்கொண்டு விழுங்குகின்றன,
      எடை குறைவான புழக்கள்
