lang: ta
pivot: false
title: பூச்சி
cards:
  insect.ant:
    label: கீட்டுச் சிலா
    summary: தனி குழுவில் வாழும் ஒரு சிறிய சமூகப் பூச்சி.
    info: கீட்டுச் சிலா என்பது Formicidae தொகுப்பின் உறுப்பினரான ஒரு பூச்சியாகும்; இது நல்ல தொழில் முறையோடு அமைந்த பெரிய குழுக்களில் வாழ்கின்றது.
  insect.bee:
    label: தூர்த்து பசினி
    summary: மஞ்சள் - கருப்பு நிற உறவுகள், மலர்களை ஒட்டியும் இனிப்பு வண்ணம் உற்பத்தி செய்யும்.
    info: தூர்த்து பசினி என்பது அதன் ஹோனில் வாழும் சமூக பூச்சி ஆகும், இது நீர்த்த மொட்டை சேகரிக்கிறது.
  insect.butterfly:
    label: பூச்சி
    summary: நிறமுள்ள தட்டைக் கொண்ட பறவை உயிரினம்.
    info: பூச்சி என்பது இரு ஜோடி மலைகளில் வாழும் ஒரு பறவை உயிரியாகும், அதன் ஆடைகள் பொதுவாக கவர்ச்சியான நிறங்களில் இருக்கும்.
  insect.dragonfly:
    label: வாஜ்கா
    summary: இரு பெரிய தெளிவான மணிகள் உடைய நீளமான உடல் கொண்ட பூச்சி.
    info: வாஜ்கா எனப்படும் இது ஒற்றைக்குழுவின் ஒரு பூச்சியாகும்; அது நீர்ப்பகுதிகளில் பிற பூச்சிகளை பிடிக்கும் பார்வை கொண்ட ஓர் ஏட்டு பூச்சியாகும்.
  insect.ladybug:
    label: பெருஷ்கா
    summary: சிறிய வட்ட சிவப்பு தொகுதி மற்றும் கருப்பு புள்ளிகள்.
    info: பெருஷ்கா ஒரு நுண்ணிய தொகுதி; இது அல்லாமல் உயிரினங்களை உணவு என ஏற்றுகிறது மற்றும் வீட்டில் பயனுள்ளதாக இருக்கிறது.
