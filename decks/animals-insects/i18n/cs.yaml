lang: cs
pivot: true
title: Hmyz
cards:
  insect.butterfly:
    label: motýl
    summary: Létající hmyz s velkými barevnými křídly.
    info: Motýl je hmyz s dvěma páry šupinatých křídel, často nápadně zbarvených.
  insect.bee:
    label: včela
    summary: Žlutočerný hmyz, který opyluje květy a vyrábí med.
    info: Včela medonosná je sociální hmyz žijící v úlech a sbírající nektar.
  insect.ladybug:
    label: beruška
    summary: Malý kulatý červený brouk s černými tečkami.
    info: Beruška je drobný brouk, který se živí mšicemi a je užitečný v zahradě.
  insect.dragonfly:
    label: vážka
    summary: Hmyz s dlouhým tělem a dvěma páry průhledných křídel.
    info: Vážka je dravý hmyz s vynikajícím zrakem, lovící u vodních ploch.
  insect.ant:
    label: mravenec
    summary: Malý sociální hmyz žijící v koloniích.
    info: Mravenec je hmyz tvořící velké kolonie s dělbou práce.
