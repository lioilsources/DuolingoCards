lang: pt-BR
pivot: false
title: Insetos
cards:
  insect.ant:
    label: formiga
    summary: Inseto social pequeno que vive em colônias.
    info: A formiga é um inseto que forma grandes colônias com divisão de trabalho.
  insect.bee:
    label: abelha
    summary: Inseto amarelo e preto que poliniza flores e produz mel.
    info: A abelha-mel é um inseto social que vive em colmeias e coleta néctar das plantas.
  insect.butterfly:
    label: borboleta
    summary: Inseto voador com grandes asas coloridas.
    info: A borboleta é um inseto com duas pares de asas escamas, frequentemente vividamente coloridas.
  insect.dragonfly:
    label: libelinha
    summary: Inseto com corpo longo e duas pares de asas transparentes.
    info: A libelinha é um inseto predador com visão excelente que caça em áreas próximas à água.
  insect.ladybug:
    label: caranguejo
    summary: Pequeno besouro vermelho arredondado com pontos pretos.
    info: O caranguejo é um pequeno inseto que se alimenta de pulgões e é útil no jardim.
