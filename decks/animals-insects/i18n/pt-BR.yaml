lang: pt-BR
pivot: false
title: Insetos
cards:
  insect.ant:
    label: formiga
    summary: Inseto social pequeno que vive em colônias.
    info: A formiga é um inseto que forma grandes colônias com divisão de trabalho.
  insect.antlion:
    label: mirimelo
    summary: É uma larva que cova embuscadas nas quais atrai formigas.
    info: O mirimelon é uma lagarta de inseto da família Myrmeleontidae que escava armadilhas cônicas no solo seco para capturar formigas. Quando um formigueiro desliza na emboscada, o mirimelon agarra-o com suas mandíbulas e injeta sucos digestivos em seu corpo. Os adultos são discretos, semelhantes às libélulas, voando à noite; já os estágios imaturos podem permanecer sob terra por anos sem alimentação.
  insect.aphid:
    label: formiga
    summary: Inseto pequeno sugar líquidos em caules vegetais e também pode causar danos às culturas agrícolas.
    info: As formigas são insetos sugadores de sálvia da superfamília Aphidoidea que se alimentam do suco das plantas.
  insect.atlas_moth:
    label: Atlas swallowtail
    summary: Um dos maiores morcegos voadores do mundo cujas asas apresentam padrões que imitam serpentes.
    info: |-
      O Atlas swallowtail é um dos maiores marimbongos do mundo com uma envergadura de até 30 centímetros.
      As pontas das suas asas são coloridas para lembrar cabeças de cobras e servem como defesa contra os predadores.
      Os adultos não possuem bocas ou qualquer tipo de alimentação, vivendo apenas alguns dias após amadurecerem.
  insect.bedbug:
    label: barata
    summary: Parasita plano que suga sangue durante a noite; esconde-se em rachaduras nos móveis.
    info: A barata é um inseto plano e ovado da família dos Cimitídeos que está ativo principalmente à noite. Ela morde e suga o sangue do hospedeiro enquanto dorme. Esconde-se nas frestas das camas, móveis e atrás de papel de parede.
  insect.bee:
    label: abelha
    summary: Inseto amarelo e preto que poliniza flores e produz mel.
    info: A abelha-mel é um inseto social que vive em colmeias e coleta néctar das plantas.
  insect.beetle:
    label: besouro
    summary: Os besouros formam uma grande ordem de insetos contando mais de quatrocentos mil tipos já catalogados.
    info: Besourinhos pertencem à ordem dos coleópterios e representam cerca de 40% das espécies descritas de inseto no mundo todo. Eles são caracterizados por suas alas duras chamadas elytras que cobrem outras alas menores usadas para voar debaixo delas. O besouro cervino é o maior besouro da Europa com machos possuindo grandes mandíbulas cornudas.
  insect.bombardier_beetle:
    label: besoura canhoneiro
    summary: Besouro que atira vapor tóxico fervente como forma defensiva.
    info: 'O strelitzia artilharia é uma espécie de besouro da subfamília dos Carábidos que se defende por meio de um método único: ele mistura duas substâncias químicas no seu abdômen gerando assim uma reação explosiva com temperatura acima de 100°C.'
  insect.bumblebee:
    label: bombinha
    summary: Grande besouro com vibração profunda que poliniza plantas.
    info: Bomba é uma abelha peluda e grande do gênero Bombus, parente da abelha mel.
  insect.butterfly:
    label: borboleta
    summary: Inseto voador com grandes asas coloridas.
    info: A borboleta é um inseto com duas pares de asas escamas, frequentemente vividamente coloridas.
  insect.caterpillar:
    label: lagarta
    summary: É um estágio da fase jovem das mariposas e borboletas em desenvolvimento.
    info: A lagarta é uma larva de mariposa ou borboleta e passa sua vida principalmente comendo folhas para acumular energia necessária para o metamorfose completo no adulto. Algumas lagartas possuem cores chamativas que alertam os predadores sobre seu veneno.
  insect.centipede:
    label: centopeia
    summary: Artrópode com muitas pernas da classe Quiloportada apresenta uma única dupla de membros por segmento.
    info: Centopeia pertence à classe dos quilópodes e possui um único par de pernas em cada segmento corporal (e não cem pernas como o nome sugere). É um predador rápido que caça insetos, minhocas e pequenos vertebrados. O primeiro par de pernas é modificado para formar garras venenosas usadas para imobilizar suas presas.
  insect.cicada:
    label: cigarrinha
    summary: Inseto conhecido por seu canto ruidoso nos dias quentes.
    info: A cigarrinha é um inseto da superordem Cycada que produz uma dos sons mais altos entre todos os insetos.
  insect.cockroach:
    label: perceveijo
    summary: Inseto carniceiro noturno rápido, extremamente resistente.
    info: |-
      {"hint":"inseto rápido e noturno que se alimenta de tudo","info":"O percevejo é um dos insetos mais resistentes do mundo; ele sobrevive à radiação e condições que matariam outros animais.
      Mais de 4.500 espécies são conhecidas, mas apenas cerca de trinta vivem perto das pessoas.
      É uma criatura antiga - os percevejos já existiam há mais de trêscentos milhões de anos antes da era dos dinossauros.
      Ele também corre muito rapidamente por ser capaz de correr com velocidade superior aos cinco quilômetros por hora."}
  insect.crane_fly:
    label: Típula
    summary: Grande libélula similar à mosca-gigante com patas muito alongadas.
    info: A tipúlia é um inseto dióptrero da família dos Típulos que visualmente parece uma mosca gigante e não picota nem parasita. Suas pernas extremamente longas são fáceis de soltar como mecanismo defensivo chamado autotomya. Os adultos vivem apenas alguns dias sem comer ou alimentando-se com néctar.
  insect.cricket:
    label: grilinho
    summary: Inseto noturno conhecido pelo canto estridente produzido pelos machos.
    info: O grilo campestre pertence à ordem dos Ortópteros e é um inseto noturno que emite som através do atrito das suas asas para atrair fêmeas e marcar território. Na Ásia os gilos são tradicionalmente criados como animais de estimação por causa da sua música característica.
  insect.damselfly:
    label: libelula
    summary: Inseto semelhante à libécula porém mais magro cujas asas são dobradas durante o repouso.
    info: Libelinha é um inseto parente das libélulas, mas mais esbelto e repousa com suas asas paralelas ao corpo, diferentemente da libécula que mantêm abertas em ângulo reto no descanso.
  insect.diving_beetle:
    label: Besoura-potápni
    summary: É uma espécie de besouro aquático predador.
    info: O Potápni Velho é um besouro predador aquático da família Dytiscidae que vive em lagos e águas paradas.
  insect.dragonfly:
    label: libelinha
    summary: Inseto com corpo longo e duas pares de asas transparentes.
    info: A libelinha é um inseto predador com visão excelente que caça em áreas próximas à água.
  insect.dung_beetle:
    label: escarabeo
    summary: Besourro que forma bolinhas com excrementos animais; considerado sagrado no Antigo Egito.
    info: O escarabeu sagrado é um besouro da família dos Escarábidos que modela fezes em bolinhas e rola-as para enterramento de ovos. No antigo Egito era símbolo do sol e o deus Khepre. É uma das poucas criaturas capazes de navegar usando como referência a Via Láctea.
  insect.earwig:
    label: escorpião-de-pedra
    summary: Inseto alongado com pinças nas extremidades.
    info: O escorpião-de-pedra é um inseto da ordem dos Dermapteros caracterizado por pinças em forma de cauda no final das patas posteriores que servem tanto para defesa quanto durante acupamento. O nome vem de uma crença popular falsa segundo a qual eles se enfiariam nos ouvidos humanos. As fêmeas são incomuns porque cuidam dos ovos e das lagartas recém-nascidas – algo raro entre os insetos.
  insect.firefly:
    label: Vagabunda
    summary: Inseto que utiliza luminisgência para chamar seu par.
    info: |-
      A vaga-lume é uma vespa da família dos lampirinos capaz de emitir luz fria por meio do processo conhecido como bioluminescência em sua parte posterior.
      Tanto machos quanto fêmeas piscam com padrões diferentes para reconhecimento mútuo e atrair parceiros.
      O fenômeno ocorre graças à reação química entre o lúcido e enzima lusiferasa.
  insect.flea:
    label: bicho
    summary: Pequeno animal pulguento que se alimente da sangue de animais terrestres.
    info: Pulgas são insetos sem asas do ordem dos sifonautéreos especializados em um modo de vida parasita. Suas pernas traseiras fortes permitem saltar mais de cem vezes o comprimento corporal delas e elas sugam sangue tanto de mamíferos quanto aves podendo transmitir doenças como foi historicamente comum durante pestilências.
  insect.fly:
    label: mosca
    summary: Inseto capaz de transportar bactérias.
    info: A mosca-das-féculas é uma das espécies de insetos mais comuns em ambientes humanos e pertence à ordem dos dipterinos por ter apenas um par funcional de asas para voar enquanto outro serve como equilibrador durante os movimentos no ar.
  insect.goliath_beetle:
    label: grilo-gigante
    summary: Um dos maiores grilos do planeta encontrado nas florestas equatoriais da África.
    info: O Goliát é um dos maiores insetos do mundo e pode pesar até 100 gramas com mais de 11 centímetros de comprimento.
  insect.grasshopper:
    label: gafanhoto
    summary: Inseto salta-dor com pernas traseiras alongadas e cantoria.
    info: A gafanhoto é um inseto do ordem dos Ortópteros com pernas traseiras fortes que permitem saltar até vinte vezes seu comprimento corporal.Os machos emitem sons característicos por meio de atrito entre suas patas e asa.Alimentam-se vegetais; quando ocorrem em grandes bandos podem causar danos à colheita.
  insect.ground_beetle:
    label: carabeu
    summary: Besouro predador rápido vivendo sob pedras e folhas.
    info: O carabeu é um besouro da família dos Carábidos; grande parte das espécies são predadores noturnos ativos que caçam outros insetos, minhocas e lesmas. Eles são rápidos e fogem rapidamente diante de perigo. Algumas espécies como o carabeu roxo possuem coloração metálica brilhante.
  insect.hornet:
    label: vespe maior
    summary: É a maior abelha européia dotada de um forte ferrão.
    info: A vespe maior é a maior abelha social europeia e pode atingir mais de 3,5 centímetros de comprimento. Ela constrói ninhos feitos com papel em cavidades das árvores ou telhados. Sua ferrão é maior do que o da abelhas, causando uma picada dolorida; no entanto, ela só ataca quando há ameaça direta.
  insect.hoverfly:
    label: syrfide
    summary: Mosca semelhante às vespas ou abelhas em coragem.
    info: A syrfide é um inseto dipterano da família dos syrhfidés que imita cores de abelhas e vespas como proteção contra os predadores (mimetismo batezoico), embora não possua ferrão por si só.
  insect.lacewing:
    label: libelinha-dourada
    summary: Inseto fino com asas finamente veicas transparentes cujas larvas caçam os ácaros.
    info: A libelinha dourada é um inseto da família dos chrysopeídeos com delicadasasas trasparentes e nervuras em rede bem visíveis e olhos dourados. As lagartas são predadoras que consomem grandes quantidades de pulgões, sendo assim protetoras naturais das plantas. Os adultos alimentam-se do néctar e pólen.
  insect.ladybug:
    label: caranguejo
    summary: Pequeno besouro vermelho arredondado com pontos pretos.
    info: O caranguejo é um pequeno inseto que se alimenta de pulgões e é útil no jardim.
  insect.locust:
    label: gafanhoto migrador
    summary: O gafanhoto migrador pode formar bandos gigantes com bilhões de indivíduos capazes de arrasar cultivos em áreas vastissimas rapidamente.
    info: A gafanhoto migrador é uma espécie de grilo que forma imensos enxames sob certas condições climáticas específicas.
  insect.louse:
    label: piolho
    summary: Pequeno animal parasita vivendo em animais mamíferos.
    info: Piolho é um inseto sem asas do ordem Phthiraptera que vive sobre pele e pelos ou cabelos dos hospedeiros. Ele suga sangue causando coceira. O piolhinho de cabeça está espalhado mundialmente afetando crianças independentemente das condições sanitárias.
  insect.mayfly:
    label: ephêmeros
    summary: Insetos com o ciclo adulto mais curto possível – eles só sobrevivem por algumas horas até alguns dias.
    info: A ephêmera é um inseto da ordem Ephemeroptera que simboliza efemeridade; os adultos vivem apenas horas ou dias. Não possuem aparelho bucal funcional nem alimentam-se de tudo. As ninfas passam entre 1 e 3 anos debaixo d'água.
  insect.mosquito:
    label: mosquito
    summary: Inseto bicúpido que pica e transmite doenças.
    info: Mosquito é um inseto voador pertencente à família dos culícidos com duas asas que suga o sangue de animais para obter proteínas necessárias ao desenvolvimento das suas ovos e pode transmitir doenças perigosas como malaria, febre amarela ou chikungunya.
  insect.moth:
    label: mariposa
    summary: Parente nocturno de uma borboleta; voa com luz e tem antenas plumosas.
    info: As mariposas noturnas são borboletas da ordem dos lépidópteros que diferentemente das diurnas têm suas asas dobradas para os lados quando em repouso.
  insect.praying_mantis:
    label: mantideira
    summary: Inseto carnívoro conhecido por seu posture parecido com o de oração e ataques rápidos.
    info: A mantida religiosa é um inseto predador da ordem Mantódea. Seu nome vem do fato de que ela segura suas patas dianteiras como em uma posição de preces ou orações. É especialista na caça rápida e precisa; ataca com velocidade impressionante para capturar sua presa rapidamente.
  insect.robber_fly:
    label: assélido
    summary: Mosca carniceira que captura outro tipo de inseto durante o voô.
    info: A strelitzia é uma mosca carniceira pertencente à família dos asselídios que caça outros insetos diretamente em vôo. Possui pernas fortes para segurar suas presas e um ferrão capaz de injetar veneno paralisante. Algumas espécies imitam visualmente abelhas ou vespas como forma de proteção contra seus próprios predadores.
  insect.scorpion:
    label: escorpiao
    summary: Inseto venenoso com pinças e cauda encurvada.
    info: Escorpiões são quelicerados com pinças típicas e cauda curvada terminando em uma agulha venenosa.
  insect.silverfish:
    label: lacraia
    summary: Inseto rápido sem asas encontrado dentro de casas próximo a livros ou papel.
    info: A lacraia é um inseto primitivo sem asas da ordem Zygentoma que vive em ambientes residenciais. Ela alimenta-se de amido, papel, cola para encadernação e fibras têxteis. Seu nome vem do seu tom acinzentado branco metálico e o movimento parecido com o das peixes.
  insect.spider:
    label: aranha
    summary: Aranhas têm oito patas; elas tecem teias para capturar insetos.
    info: O aranha é um aracnídeo com oito pernas e dois segmentos do corpo pertencente à ordem dos Arâneidae que não são insetos verdadeiros. Ela tem capacidade de fabricar seda para teiar redes usadas na caça ou em casulos contendo ovos. Existem mais de 48 mil espécies diferentes.
  insect.stag_beetle:
    label: Besourão
    summary: Maior besouro europeu; o macho tem quelíceras semelhantes aos cornos.
    info: O Lucanidae comum é uma espécie de besouro que pode atingir mais de 7 centímetros de comprimento e está presente na Europa. O macho possui quelíceras grandes em forma de chifres usadas para lutar por fêmeas durante os acasalamentos. A larva vive até sete anos no tronco caído ou madeira podre das árvores como carvalhos alimentando-se principalmente de fungos.
  insect.stick_insect:
    label: strashilka
    summary: Inseto que imita com precisão uma haste vegetal.
    info: A strašilka é um inseto da ordem Phasmatoidea e mestre em imitação; seu corpo replica perfeitamente ramos ou folhas. Quando ameaçada ela fica completamente paralisada. Algumas espécies reproduzem-se por partenogênese, sem machos.
  insect.termite:
    label: Termite
    summary: Inseto social que constrói grandes colinas de terra.
    info: Os termites são insetos sociais da ordem dos isópterios e estão distantes relacionados às abelhas.
  insect.tiger_beetle:
    label: carabóide
    summary: Besourinho metálico com olhos muito nítidos.
    info: O carabóide é um besouro da subfamília Cicindelidae conhecido por sua velocidade excepcional e visão aguçada para caça em movimento rápido no solo.
  insect.velvet_ant:
    label: mutelilide
    summary: Vespa sem asa com aparência similar à das formigas.
    info: |-
      O mutelilide é tecnicamente uma vespa da família dos Mutillidae cujas fêmeas são asinacradas e lembram formigas muito de perto
      Elas possuem pelagem vermelha ou laranja proeminente como aviso,
      as quais têm um ferrão extremamente forte apelidado por assassino bovino.
  insect.wasp:
    label: vespa
    summary: Insetos peçonhetes pretas-e-amarelados que constroem ninho em forma de papel.
    info: A vespa comum é um inseto peçonhento da espécie Vespyla conhecido por seu padrão amarelo e preto de aviso característico que constrói ninhos feitos à partir do papel produzidos pela mastigação da madeira. Ao contrário das abelhas, ela pode picar várias vezes ao longo da vida.
  insect.water_strider:
    label: corredor-a-guia
    summary: Inseto que anda pela superfície da água usando sua tensão.
    info: A corredora-d'água é um inseto da família Gerridae capaz de caminhar sobre a superfície graças aos pelos hidrofóbicos nas pernas e à tensão superficial da água. Caça outros insectos afogados detectando vibrações causadas por eles na superfície do líquido.
  insect.weevil:
    label: besourinho
    summary: Pequeno besouro que possui um nariz característico prolongado.
    info: O besouro é uma família de insetos pertencente à maior família animal do mundo com mais de 60 mil espécies. Seu nariz alongado serve para perfurar frutos e troncos. Algumas espécies são pragas agrícolas importantes como o besouro da algodoeira.
  insect.whirligig_beetle:
    label: vírvulo
    summary: Pequeno inseto que forma grupos girando pela camada superficial das águas.
    info: O vírvulo é um besouro aquático da família Gyrinidae que vive sobre a superfície d'água e seu movimento em círculos ajuda-o a evitar predadores. Seus olhos são divididos em duas partes distintas; uma visão acima do nível de água e outra abaixo dela para monitorar os arredores com mais eficiência. Ele detecta pequenas ripples ou ondas causadas por comida próxima ou perigos no ambiente.
