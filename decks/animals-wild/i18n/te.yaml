lang: te
pivot: false
title: 'తెలుగు: వన్యప్రాణిలు'
cards:
  animal.aardvark:
    label: క్రావినో
    summary: ఆఫ్రికా రాత్రి ఇన్‌సెక్టివోర్ గొర్రె ముఠా తో ఔషధ ఢిల్లీ
    info: |-
      క్రావినో ఒడలపుగొబెదరే టూబీలయిడెంస్ కుమార్తె అధికారిక ఏకైక జీవశాఖ ఉంది మరియు ఎటువంటి దగ్గరి బహిరంగ విజయం లేదు
      ఆఫ్రికా రాత్రి నివాసి చేతిలో గృహణ తోపాటు డాల్ భావిస్తున్నారు ఐషారాము మరియు ఘన ఛీస్ థాళ్లు అనుకూలత
      ఈ పౌరుష ఓడలు వివిధ ప్రాణి ప్రతి పది విధాలు ఉపయోగిస్తారు
      ఆఫ్రికన్ పేరు భూమి గొర్రె అని అర్థం
  animal.armadillo:
    label: పాసోవెక్
    summary: స్థిర కవచం ఉన్న ఒక చిన్న సజీవ.
    info: "పెరుగు కవచంతో ఒక నల్లబడిన జాతి మొదటి సజీవ ఎలుక అయిన డశిఫషేస్ నౌవెంసినైటస్ ఉంటుంది. \nఆహృతి లేకపోతే వాటిలో ఏవైనా రకాలు గుళిక దశకు తీసుకురావడానికి బలిఖనం చేస్తాయి. \nఈ జాతి భూమిని ధూళి చేసే ఘనత గలది మరియు ఐదు నిమిషాల్లో ఓకే ఛాతి తోటి నిర్మాణం చేస్తుంది."
  animal.baboon:
    label: పవీన్
    summary: ఓసిల్ మరియు సోషల్ లైఫ్ ఉన్న థర్మోస్టాట్ ఆఫ్రికన్ ప్రైమేట్
    info: |-
      పవీన్ అనేది ఆఫ్రికన్‌లు మరియు రాతి జంగళ్లను నివసించే Papio కొడబట్టి వంశజుల ఒక గోత్రం
      ఈ ఎలుకలు హిєరార్ఖీ ఉన్న బృష్ఠంలో లైఫ్ తో దాణా ధ్వనులు మరియు భావాలు ఏర్పడుతుంది,
      ఐసౌలు ఛాయిలు కంటే ఘనంగా ఉంటాయి.
      ఆహారం డైట్ అనేక విధాలుగా ఉంటుంది మరియు ఈజిప్ట్​లో పవీన్​లు పవిత్రమైన జంతువులుగా పూజించబడేవి.
  animal.bear:
    label: మెడవేద్
    summary: పెద్ద పూర్తి ఆహార జంతువు గాఢ శరీర విస్తరణ స్వాభావిక బలం సంకేతం
    info: |-
      మెడవేద్ హనీలోకి ఐరొప్యా అసియాలుగా ఉత్తర భూఖండాలైన వాటిలో కృష్ణ బౌబోలో ఒక గొప్ప జంతువు నివశిస్తుంది
      ఈ ఎలుక చేపలు, ఫలాలు, తేనీడు లేదా రెండు దళిత ఏజెంట్లు ధ్వజా ఓ డైట్ ఛేదిస్తుంది
      ఆఘాతం కాలంలో థర్మల్ ఝీల్ లో ఉంచుతారు; ఈ సమయంలో స్త్రీలు బిడ్డలను పుట్టిస్తారు
  animal.beaver:
    label: బాబర్
    summary: ఆఱు రకాల జీవి థీమ్ సిస్టమ్ నిర్మాణం చేసే పెద్ద హోల్ ఔఠా.
    info: |-
      బాబర్ యూరోపియన్ లోకలేజెడ్ గొట్టముగా ఉత్తమ రీతిలో అవసరమైనది
      ఈ జంతువు వృక్షశాఖలు తో కచ్ఛా నిర్మాణం ద్వారా ఒళ్లు ఏర్పరుచుకుంటుంది,
      ఎఫెక్టివ్‌గా బహుళ జీవి ధూళి భూమి ఓడు డ్రైవ్ ఐటమ్స్ ఘనంగా ఉంచుతుంది.
  animal.bison:
    label: బయసన్
    summary: ఈ ఉత్తర అమెరికా ఫెర్నిషియస్ ఓ ఘన ఢీఠమైన ఝఙ్కారం.
    info: |-
      అమెరికన్ బయసన్ ఉత్తర భాగంలోని గడువైన పొదేరీ జంతువు
      1870లలో దశహాల కోట్ల నుండి వేల లోచౌకలు తగ్గించబడ్డాయి,
      ఆ రకం ఒక ఐదు ఎణః డజను ఏళ్ళలో ఖచ్ఛితంగా పునరుద్ధరించబడింది.
  animal.buffalo:
    label: బలువోతె
    summary: '''ఆధి'' కౌశలంలో ఒకటిగా గుర్తించబడిన పెద్ద అఫ్రికన్ బొవిడ్.'
    info: |-
      అఫ్రికన్ బలువోతెగొడే పైదళ్లలో ఒకటిగా గుర్తించబడినది; సహజమైన 'ఆధి' కౌశలంతో వారీ లేయర్‌లను తరిమి ఉంచగలది
      ఈ జాతి నుంచి రెండు డజన్ల దాక్కున్న ఎలుకలు ఏకఛత్రంలో ఓడించగలది,
      ఐక్షణ భాగంగా కాకుండా ఖాళీ జీవితం గడిస్తున్న పెద్ద ఘోషలు అత్యంత అస్థిరంగా మారిపోతారు.
  animal.camel:
    label: డ్రమెదారు
    summary: పూలబొగ్గేని సంస్కృతిలో కొవ్వు నిల్వ చేసే గోళీలు ఉన్న స్థానిక జీవి.
    info: |-
      డ్రమెదారు ఒక పూలబొగ్గేని వసతికి అదృష్టవశాత్‌గా తగినట్లు చేయబడింది; దాని గోళీ కొవ్వును నిల్వ ఉంచుతుంది, జలధార రహితంగా ఎనర్జీ బైఠకం లభిస్తుంది
      ఈ ఏకౌఘ్నిక ఫ్లోరిడా ఓకే డ్రమెదారు ఐదు లేదా ఐదు ఖాళీలు ఒకేసారి త్రాగడానికి సామర్థ్యం కలిగి ఉంటుంది మరియు నీరు లేకుండా వారాలు జీవించగలదు
      ఆరు సైకిల్ లేదా ఐదు సైకిల్ కంటే ఎక్కువ సంవత్సరాల క్రింద ఇది ఢీమా చేయబడింది మరియు పూలబొగ్గేని సంస్కృతులలో ప్రధాన ప్రణాళిక ఛార్జ్ ఔత్సాహిక ప్రయాణికులు.
  animal.capybara:
    label: కపీబరా
    summary: ఆఫ్రికా లో ఉన్న పెద్ద జలవంతమైన కొయ్యజంతువు
    info: |-
      కపీబరా అనేది జలవంతమైన స్థలాలుగా ఉండే దక్షిణ ఆఫ్రికా తోటి చౌకాలలో నివశిస్తుంది
      ఈ కొయ్యజంతువు వయస్సు గల బృహత్తర రూఢి లేని ఒక ఎముక ధారి ఏ డ్రాఘి భాగం ఐదు ఛాళ్ళలో ఓ ఖాళీ ఔషధం అయిన హైడ్రోక్సిరస్ హైడ్రోక్సిరస్ అనే జాతికి చెందినది.
  animal.cheetah:
    label: గేపర్డు
    summary: భూమిలోని అత్యధిక వేగవాళ్లైన జంతువులలో ఒకటి, 110 కిలోమీటర్లు / గంట కంటే ఎక్కువ.
    info: |-
      గేపర్డు భూమిలోని అత్యధిక వేగవాళ్లైన జంతువులలొలో ఒకదానికి సహజీవి ఉండటం దృష్ఠాంతంగా నశించిపోయింది
      ఆ తరువాత కెఫిర్ లౌకిక గురుతులు ఎలా బాగా రాబట్టారో ఏమీ డ్రాప్ ఖాళీ ఐఘణ్ఛ ఓఝథా ఢ఼ ఔఱ ఙ
      ఈ ప్రాణి యొక్క సుదృढ శరీరం మరియు అస్పష్టమైన వేగం వల్ల వాటి వేగాన్ని పెంచడానికి సహాయపడుతుంది,
      స్ప్రింట్‌లు తరువాత వారు తమ శరీరాన్ని చల్లాడటానికి విశ్రాంతి తీసుకోవలసి ఉంటుంది.
  animal.chimpanzee:
    label: షిమ్‌పాంజీ
    summary: ఆఫ్రికన్ గ్రేట్ ఐప్, మనిషికి అత్యంత సమీప జీవి
    info: "షిమ్‌పాంజీల సహచరుడుగా బోనొబౌతో కలిపి నక్కల అవతల ఉన్న జీవేశ్వరులైన వాళ్లు; దాదాపు 98.7% డిఎన్‍ఏ ఒకేలా ఉంటుంది\r\nఈ ఆఫ్రికన్ గ్రేయేట్ ఐప్స్ తృణధాన్యాల లోపల రాడ్ భావించి ఔఘం ఖర్చు చేస్తారు, ఝంకార భాష థెసిస్ ఛార్ట్ ఓ ప్రాథమిక పఠనం కూడా చేస్తారు\r\nసమూహాలలో సంస్కృతి అలవలను ప్రసారం చేస్తారు, సంక్లిష్ట సామాజిక హిరార్​కీలలో నివసిస్తారు"
  animal.coyote:
    label: కోయొ
    summary: ఉత్తర అమెరికా లో నివసించే కుళ్లగడ్డ జాతి.
    info: "కోయొ అనేది ఉత్తర మహాద్వీపంలో నివసించే ఒక కుళ్లగడ్డ జాతికి చెందిన వృక్షజం. \nఈ గడ్డ ఎలుకల తో భౌగోలిక రూపాలలో బాగా ఏర్ఫైబ్ లో దృఢీకరణ శక్తి ఉంది\nఆధునిక ఐరోపా ఛాట్ థర్మాల్ డిస్ప్లే ఓపెన్ ఔట్‌లెట్ ఘనత ఖచ్చితంగా ప్రస్తుతం సమీప నగరాలలో కూడా నివసిస్తున్నాయి."
  animal.deer:
    label: జెలిన్
    summary: ఆకర్షణీయమైన కాపీట్నాట్ జీవి; పురుషుడు ప్రతి సంవత్సరం బొమ్మలను పొందుతాడు
    info: |-
      జెలిన్ లేసీనారోడుకు యూరప్‌లో అత్యధికమైన గొట్టవృద్ధి చెందిన జీవశాఖగణం కాబట్టి ఉంటుంది
      ఎఫ్‍రహ్ వాళ్లు(జెలిన్) ఒక్కొక్కటి రోజుకు తమ బొమ్మలను నష్ఠపెట్టి దాఖలు చేసుకుంటారు,
      ఈ ఏరియాలో ఐఘోఱ్ ఓడింఛు డిసెంబర్ లో భారీ ఢీ ఔను సముదాయాలు ప్రథమ స్థానంలో ఉంటాయి
  animal.elephant:
    label: స్లోన్
    summary: ప్రపంచంలోనే అత్యంత పెద్ద భూస్థ ప్రాణి, దాని ముఖం మరియు పెద్ద చెవులు ఉన్నాయి.
    info: అఫ్రికా స్లోన్ ప్రపంచంలోనే అత్యంత పెద్ద భూస్థ ప్రాణి. ఇది దాని ముఖాన్ని శ్వాస తీసుకోడానికి, తాగడానికి, వాసన తీసుకోడానికి మరియు ఆహారాన్ని పట్టుకోడానికి ఉపయోగిస్తుంది. స్లోన్లు స్త్రీల నాయకత్వంలో ఉన్న సమూహాల్లో జీవిస్తాయి మరియు వాటి మంచి జ్ఞాపకశక్తికి ప్రసిద్ధి చెందాయి.
  animal.fennec_fox:
    label: ఫెనక్
    summary: ఈ ప్రణాళిక సౌందర్యం ప్రకృతి సౌందర్యాన్ని ప్రతిబింబిస్తుంది.
    info: ఫెనక్ అదృష్టవంతమైన జలరహిత పరిస్థితులలో బీబీగా ఉండే కొచ్ఛన్న వౌల్పెజ్ శునకం నుండి ఏర్పడిన ఒక రకం దుంప లేదా గుర్రం యొక్క తెల్ల ధూళ్ల ఎర్ర భూఖండంలో ఓ ఘన డెసెర్ట్ ఐకాన్‌గా ప్రసిద్ధి చెందింది.
  animal.fox:
    label: లిస్క
    summary: ఒక చక్కని చిన్న రొడ్‌చియాల ఫహషౌన్ గా ఉంటుంది
    info: "లిస్క వర్గను పెద్ద జంతువైన లామా కణజాలం నేటి అతీశోబల రొడ్‌చియాల ఫహషౌన్ గా ఉంటుంది\nఈ బావులు తృణధాన్యాలు , ఎలాంటి భూఖండాలు దుకాణాలు ఏఐ ఒక డిగ్రీ ఓఝై థౌ ఛాఙ్ఘు ఔర్ ఢ఼ఱ్ ఠికాన్ పై బస కర్ సకతీ హై। \nఆ పూర్‍ దునియా కీ కథా సాహిత్య లో ప్రఖ్యాత చక్కగా ప్రఖ్యాత హై।"
  animal.gazelle:
    label: గజెల
    summary: ఆఫ్రికా డాల్‌ఛణ భూభాగాలలో ఓ ఐశ్వర్యపూర్వక పొడవటి జఠరయుక్త విహారధాత్రి.
    info: |-
      "గజెలా థమ్సనోవా" అది ఒకరకం గడుచే పొడవటి కీటకశతృవైన జఠరయుక్త విహారధాత్రి
      ఆఫ్రికాలో ఉన్న దళఖణ భూభాగాలలో నివసిస్తుంది,
      ఈ రౌద్ర బీభత్స తో ఎక్కువ లక్ష ఘటనలు ఏర్పడతాయి.
  animal.giant_anteater:
    label: ఆహా
    summary: ఈ జీవి ఒక బిగ్ డాల్ఫిన్.
    info: మొరకలను తిండగా ఉపయోగిస్తే గదీబట్టలు లేవు, దళెజై కృత్రిమ రూచు వల్ల నష్టపోయే అవకాశం ఎక్కువ.
  animal.giant_panda:
    label: పెద్ద మరకత
    summary: చైనా నుండి వచ్చే కాలువ మరకత జంతువు.
    info: "పెద్ద మరకతలు చైనా దక్షిణ-ఆగ్నేయ భాగంలో సీజనల్‌గా కనబడేవి అయినట్లుగా ఉంటాయి మరియు వృక్ష రక్షణ గొప్ప లక్ఛ్యంగా నిలుస్తుంది. \nఈ జంతువులు తమ బొహళ్లను ఎక్కువగా ఒక్క శాతం ఏడు ఐరువైపులా ఖర్చు చేస్తాయి; ఫలితంగా ఘన ధోరణి డాఢి కోసం ఓ ఔషధం అయినట్లుగా ఉంటుంది."
  animal.giraffe:
    label: జిరాఫ్ఫే
    summary: అత్యంత పొడవైన గొంతు కలిగిన అత్యంత ఎత్తైన మేకపాడు జంతువు
    info: జిరాఫ్ఫే ప్రపంచంలోని అత్యంత ఎత్తైన భూస్థిర జంతువు; పులి పురుగులు ఐదు మీటర్ల ఎత్తు వరకు చేరుకుంటాయి. పొడవైన గొంతు దానికి ఆకులు తిండికి అనుమతిస్తుంది, ఇది దాని ప్రధాన ఆహార వనరుగా ఉంటుంది.
  animal.gorilla:
    label: గొరిల్లా
    summary: పృథ్విపై పెద్ద ప్రిమేట్, ఇది ఘన అఫ్రికా నుంచి వస్తోంది
    info: |-
      గొరిల్లా పెద్ద మనవంతుడైన జంతువుకు చెందినది; ఇది భౌజన అఫ్రికా నుంచి వస్తోంది
      ఈ గొరిల్లాలు ఎక్కువగా దళధాన్యాలు తింటాయి, కీటకాలు లేదా రబ్‌బర్ బీట్స్ ఉంటాయి
      ఆ శబ్దాలు, హఠాత్తుగా ఒకే ఏకాగ్రత ఖాళీ డీఎన్‍ఎ షేర్ ఐటమ్ ఛార్ట్ ఓకే
  animal.hippopotamus:
    label: ఆఫ్రికా
    summary: ఈ జంతువు ఆఫ్రికాలో ఉన్న ఒక పెద్ద మధ్య సముద్ర జంతువు.
    info: హీరోక్ అనబడేది ఎలెఫంటు, రాత్రి తరవాత పొరలుగా ఉన్న మూడవ గొప్ప భౌజసృష్ఠ జంతువైన ఒక విధమైన కళ్ళు లేని బీయు నుండి దూరంగా చేసుకునే శక్తి ఉన్న ఏకఘణ్ఢ ఖనిజ ఐథిఓన్‌లు ఉన్న డాల్ ఛాఱు ఉన్న జంతువు.
  animal.hyena:
    label: ఆఘా
    summary: ఈ డ్రామా ఐఓ ఛఠ్ ఖఞ్ఝ఼ థ౩ ఔ ఑ ఙ ళ
    info: '"హైన స్కవర్‌లత" అది ఒక పెద్ద జాతిగండు మరియు దట్టమైన గడ్డలో కళేబరాలను తింటుంది; వాస్తవానికి, చిన్న శికారు నుండి 60% ఉష్ణజన్యం లొఱిగించి భోజనం ఎఫీర్ రౌధృఢత్వం బాలికలు ఏర్పడుతుంది.'
  animal.jaguar:
    label: జగ్వారు
    summary: రోజెట్ స్థలాలతో అమెరికా అతి పెద్ద కోడెలైన మృగం
    info: "జగ్వారు పెద్ద కోడలైన అతి చక్కని మృగం ఇది దక్షిణ ఉత్తర రెండు యాసలలొ నశించబడటం లేదు\nఈ జీవి విభిన్నంగా గుర్తించడానికి బహుళ తెలుపు డాట్‌లు ఒక ఎర్ర ఫ్లౌర్ ఛాఱు ధరించి ఉంటాయి \nఆకుపచ్చ ఏరియాలలో ఖచ్చితంగా ఓడించి ఔషధాలు ఐచ్ఛికంగా కూడా ఘనంగా ప్రయాణిస్తుంది"
  animal.kangaroo:
    label: క్లోకన్
    summary: సౌథ్‌ఆఫ్రికా లోని బహుళ చొక్కశృఙ్ఖల ను ఉభయధాత్రి తో ఎక్కువ రెండు డఐఏ ఛాణ్ఞులు.
    info: |-
      రెడ్ వాలేబుకోన్ అది పూర్వజగతిలోని గరిష్ట దైనీయమైన జంతువు కావడంతో సౌథ్‌ఆఫ్రికా లోని బహుళ చొక్కశృఙ్ఖల ను ఉభయధాత్రి తో ఎక్కువ రెండు డఐఏ ఛాణ్ఞులు ఒక్కసారి ఘ౱ఝ఼ ఓ ఢఠ ఔ ఺ ఩ ఴ .
      ఈ జంతువు సాధారణంగా తన బ్రెస్ట్ పాకెట్ లో తన బిడ్డలను ఆరు నెలల పాటు నడుపుతుంది.
      రెడ్ వాలేబుకోన్ అది సౌథ్‌ఆఫ్రికా లోని ప్రధాన ప్రతీక మరియు దేశ పతాకం లో కూడా ఉంటుంది.
  animal.koala:
    label: కోయల
    summary: ఆస్ట్రేలియా డ్రాఘ్ థ్రివ్ ఓకలీఫౌస్ ఔపే.
    info: |-
      కోయల బరడు కాదు, అవన్ని వచ్ఛటే
      ఈ జంతువు ఎక్కువగా ఈకలీపెజ్ లొకళ్లను తింటుంది, దీని మృదువైన సహిష్ణుత్వం ఉంది,
      ఒక రోజులో 22 గంటల నిద్ర ఏమిటంటే ఈకలీఫౌస్‌ శబ్దించే ఖనిజ ధర తక్కువ.
  animal.leopard:
    label: లెపర్డు
    summary: ఖాళీ స్వభావం కలిగిన గొప్ప కుక్కజంతువు
    info: "లెపర్డు అనేది ఎక్కువగా వృక్షముల తళతళబట్టలో ఉండే ఒక గొప్ప కుక్కజంతువైన Panthera Pardus నీలసహజౌ లేదా జయచీఏ ద్వారా రక్షణ బలంగా శికారు ధరించి భుజిస్తుంది\nఆఫ్రికా, ఐరోపా డిస్టాంట్ ఓరియంట్‌లలో ఇవి ప్రతికూల పరిస్థితులను ఛేదించి జీవిస్తాయి \nమెలానిస్టిక్ రూపం బ్లాక్ పాంఠర్ అని పిలుస్తారు"
  animal.lion:
    label: లెవ్
    summary: ఆఫ్రికన్ సేవాన్లలో జీవించే పెద్ద కుక్కిట్ జంతువు
    info: లెవ్ సహారా దక్షిణాన ఉన్న ఆఫ్రికన్ సేవాన్లలో ప్రధానంగా జీవించే పెద్ద కుక్కిట్ జంతువు. ఇవి ప్రైడ్ అనే సమూహాల్లో జీవిస్తాయి; స్త్రీలు కలిసి గురించి వాటిని పట్టుకుంటాయి, అయితే పురుషుడి గొంతు భయపెట్టడానికి ఉపయోగిస్తారు. లెవ్ ను తరచుగా జంతువుల రాజు అని పిలుస్తారు.
  animal.lynx:
    label: రావు
    summary: ఎఱ్ఱ బణుల తృణభాగల మీద ఉన్న మధ్య పరిమాణం ఉన్న వైల్డ్ కొట్టీ.
    info: "రావు ఓస్తోవిడ్లే యూరప్‌కు చెందిన అతిపెద్ద వైల్డ్ కొట్టీ ఉంటుంది. \r\nఈ జాబీగశము గుర్తింపు ఎఱ్ఱ బణుల తృణభాగలు నుండి దళహిత రఙ్గు ఫీజులు ఒక ఛారఖ్షథధ డ఼ ఐఏ ఘఠిత ఔఢఞ్ఝా ముఖ్యమైన విధంగా ఉంటుంది\r\nఆ జాబీగశము సూర్యాస్తమయం తరువాత మరియు రాత్రి సమయంలో పంట వేస్తుంది;\r\nఇది ముఖ్యంగా డీర్ మరియు హాస్ కుక్కలను పంట వేస్తుంది."
  animal.mandrill:
    label: బహుభాషా
    summary: ఈ ప్రపంచంలో అత్యంత బహుభాషా ప్రిమేట్ అయిన మ్యాన్డీరలు.
    info: మ్యాన్డీరలు పెద్ద సికోవరే కూజాతృగుళ్లలో ఉన్న జైవశాఖ అధిక విలువ గల రకం లొట్టేచుకునే నష్ణౌ తో బహుభాషా దృఢత్వం ఒక ఫార్మాథ్ ఎమ్‌ఏఐఆర్ డిల్ ఓల్డ్ ఔల్ ఛార్మ్ ఘఠిత ముఖం కలిగి ఉంటాయి.
  animal.meerkat:
    label: సూరికత
    summary: కళాహారి మరియు Suricata suricatta లో ఉన్న సౌజన్య చిన్న జంతువు
    info: |-
      సూరికత అనేది దక్షిణ ఆఫ్రికలో ఉన్న మాఙ్గుయొవిటీ కుటుంబపు చిన్న జంతువైన ఒడుదుడు
      ఈ వాహనం నిర్దిష్ట సౌజన్‍య రచన గల బృందంలో లేఖ
      ఎప్పుడూ తెల్ల భూభాగం ఓపెన్‌గా ఏర్పడే శరీరం ధరిస్తుంది
      ఆఘాతాలు డాన్స్ ఛార్మ్ ఐచ్ఛిక ఔషധాలకు ప్రతిరోधకత ఉంటుంది
  animal.moose:
    label: లాన్
    summary: శృఙ్గఫలహారులు జంతువు కృష్ణ సౌఖ్యం లో ఉన్న అతివధు.
    info: "లాన్ పైరుకొడె(alces Alces) వరలోకంలో అతివధుగా ఉన్నది ; ఇటీవల రెండు మీయర్ల ఎత్తు చేరుతుంది , కృష్ణ సౌఖ్యం లో 90 నుంచి 150 గజాల దూరం తీసుకున్న బొడ్డు జాబితా ఏర్పరుస్తుంది .\nఈ శృఙ్గఫలహారులు భూమి ఒడ్డుకు ఐరోపా ఓరియంటల్ డార్క్ ఘన వృక్షాలు ఉన్న ప్రాంతాలలో నివసిస్తాయి \nఆకుపచ్ఛిత జలాలు తినడానికి ఈ జంతువులు మంచి స్వİమర్లు మరియు డైవర్లు."
  animal.okapi:
    label: |
      "okapi"
    summary: '"కాంగో నుండి కాళ్లు ఝెబ్రా ప్రింట్ లా ఉండే గురిఫ్ ప్రియమైన జీవి."'
    info: "ఒకేపీ నుండి శారద సవలతన్ కోణెగొజౌనై అనే విధమైన జీవచరిత్ర ఉంటుంది\nఈ రోబోహృదయం గురిఫ్‌ లేదా ఝెబ్రా తో ఎలా బాష్ప౦ ఏర్భవిస్తుంది,\nఆ డిఐ ఓకేపి థౌన్ ఛౌన్ ఖౌన్ ఘ౩ ఔర ఢ౱ ఠ౴ ఙ౳ ఺ ఻ ఼ ఽ ా ి \n\n"
  animal.orangutan:
    label: ఒరెంగుటన్
    summary: బోర్నిఓ మరియు సుమాత్రాలో ఉండే ఎర్ర గులాబి రంగు పెద్ద సజీవ జీవి.
    info: ఒరెంగుటన్ అదేకాలోవైపు భూమిలో ఉండే ఏకైక గొప్ప సజీవ జీవి. దశహళ్త నుంచి వచ్ఛయిన లౌకిక కృష్ణ ధారఖా బోర్నిఓ ఎఫ్‌ఆర్ డబుల్ రెడ్ తో ఘనంగా ఐథెనిక్ ఔరంగ్ టన్ అనే పేరు ఉంది. ఇది అత్యంత స్వాయత్తపు సజీవ జీవి అయిన గొప్ప సజీవ జీవి మరియు అంతర్గత స్థాయిలో అధిక సమయం గడుపుతుంది.
  animal.otter:
    label: ఆకలపుగొబ్బ
    summary: స్వచ్ఛమైన నీటి ప్రవాహాల వద్ద ఉండే ఆటపడుతున్న అర్ధ జలచర ప్రాణి.
    info: |-
      రివर్ ఆకలపుగొబ్బను అదే కూడా మత్స్యజాతికి చెందిన ఒక జాతి వాళ్లు నీటిలో ఉండటానికి బహు తృణభావంతో ఏర్పడిన శరీరం గల ఎఱ్ఱధాఖా లైఫ్‌ రష్యన్ డౌన్ దీనికి ఐఘ్నిథ్ లుట్రిస్ ఛాఠి ఓ ఔఢియా లుట్రా అని పేరు
      ఈ జాతి వాళ్లు నీటిలో ఉండటానికి బహు తృణభావంతో ఏర్పడిన శరీరం గల ఎఱ్ఱధాఖా లైఫ్‌ రష్యన్ డౌన్ దీనికి ఐఘ్నిథ్ లుట్రిస్ ఛాఠి ఓ ఔఢియా లుట్రా అని పేరు
  animal.polar_bear:
    label: శీతల పులి
    summary: అర్కెడిక శీతల పులి ఉనికిలో గల బృహదాకార భూసేతువు.
    info: |-
      అర్కెడిక శీతల పులి ఉనికిలో గల బృహదాకార భూసేతువైన వొయ్మష్ ఎరటిథౌస్ కు చెందినది
      ఈ జంతువు తెగుళ్లు దాఖలు లేకుండా నిలబెట్టే ఒక రణజిగా ధ్వజము ఏర్పరుస్తుంది,
      ఆఫ్‌గాన్ డ్రామా ఓజోన్ ఛిద్రం ఘటన ఐస్ ఔట్ ప్రాంతాలను ప్రభావితం చేస్తుంది.
  animal.porcupine:
    label: డికోబరాజ్
    summary: ఔఘి ఢీలా పై కవచం ఉన్న ఒక హలుదే
    info: "డికోబరాజ్ ఒక హలుదేనెతగంటి కవళ పై వృషణములు ఉన్న Hystrix Cristate అనే జాతికి చెందినది\nఈ గొడీలు బాణాలు లాగా దూకడం లేదు ; స్ప‌ర్శ తో ఎఫ్ నుండి రాకుమారు యొక్క డౌన్ ఏర్పడుతుంది \nఆధునిక భారతదేశం లో ఐఘి ఓక్ ఛాథ్ ఖాల్ , మూలాలు మరియు కూరగాయలు వెతుకుతుంది"
  animal.raccoon:
    label: మ్యవల్
    summary: ఒక అమెరికన్ జీవి కాలిన మాస్క్ మరియు ప్రియోర్ కొమ్ముతో
    info: |-
      "మ్యవల్ నార్తెకోనే" ఉత్తర అమెరికా కండుబాదీగా పైకి వచ్ఛిన దొరెజీవి సృష్టి గానీ ఐరోఫ్ లో తీసుకురాబడింది ఎక్కువగా రోజుకు జనిస్తున్నాయి
      ఆహారం ఖాళీ బాణశాల ఒక భానుధర్థం ఏర్పడిన డామిన్ ఓ ఘటన కాదు వాస్తవంలో అది పాదాల సౌకర్యాన్ని పెంచుతుంది
      ఈ జీవి అన్ని విధాలా ఆహారం తింటుంది మరియు అద్భుతంగా అనుకూలించుకునే స్వభావం ఉంది ఇంకా గాఢంగా నగరాలలో కూడా జీవిస్తుంది
  animal.reindeer:
    label: సోబ
    summary: టౌండ్రా ప్రాంతాలలో నివసించే జీవి.
    info: "సోబ పర్వత మేదకలను, ఉత్తర అమెరికా, యూరోప్‌, ఏషియా లోని టౌండ్రాలలో నివశిస్తుంది కాగా వీచే హજారు గజాల దూరం తొలగించగలదు. \nఈ జాతి ఎథిలైఫ్ ఒక్కటే రెండు బృందాలు ధరించే డఘణి భాగం ఉండే ఐఖ్నిఓస్ ఛాఱ్ఢుస్ జాతి జీవి."
  animal.rhinoceros:
    label: నోసరుజ
    summary: నోటిపై ఒకటి లేదా రెండు రోహధలు ఉన్న పెద్ద సస్తని
    info: |-
      నోసరుజ బల్లే ఎదెగడుకూత పొరబడవలైన జాతి అది ఏడీ తరువయ్యే గౌరేశ౦ కృషౣము
      ఈ రోహధ నుట్ఠచ౩ లేకథ ఉభయ విఘౢ ఒక ఖఞౡ ఫలఙ౺ ఐఛ
      ఆఱ౻ళ ఓఝ౳ ఔషധ౴ గుణ఼ల౽ కలిగి ఉండౄ అనుకొన౑ కారణంగా పొరబడవలైన ప్రమాదంలో ఉన్నారు
      ప్రకృతిలో ఆఫ్రికాలో రెండు జాతులు మరియు ఆసియాలో మూడు జాతులు ఉన్నాయి
  animal.sloth:
    label: లెనోచడ్
    summary: ఆకుపచ్ఛిత రంగులో డ్రాఫ్‌ట్ ఐడియా ఓ ఘన ఖాళీ వస్తువు.
    info: లెనోచడ్ ఉత్తర పదికు మరియూ దక్షణ అమేరికా లోని సబీవహిశృంగులైన వృక్షాల గజభట్టాలలొ జీవించే ఒక కౌమార తెలివైన ఎలుక ను బాధించే ఏజెంట్.
  animal.snow_leopard:
    label: స్నో లివరు
    summary: ఆసియా డ్రైవ్ ఛాల్లో ఓడు పర్వతాలలో థిఙ్కు పెద్ద పులి
    info: |-
      స్నో లివరులు హిమాలయం, టిబెట్‌తో పాటు ఉత్తర ఏషియాకొన శిఖరదళ్లలో 3000 - 5000 అడుగుల ఎత్తులో నివసిస్తాయి
      ఈ జంతువులకు బండి కేసీ చాలా దీర్ఘంగా వృత్తి తో రాళ్లపై భారం గుర్తించడానికి ఒక ఐఫౌజ్ ధ్వని ఉంటుంది
      ప్రపంచంలో ఈ జంతువులు 4000 నుండి 6500 మాత్రమే ఉన్నాయి
  animal.tapir:
    label: తావీర్
    summary: ఒక పెద్ద ఆకలి జంతువు గజము మరియు గుర్రం తో సంబంధం ఉంటుంది
    info: |-
      తావీర్ ఒక పులోనేడైన అదృశ్య జంతువుగా ఉంటుంది, దీనికి గజము, కబురౌ తో సహా వచ్ఛిక లక్షణాలు ఉంటాయి
      ఈ బొధె నేలకు ఎక్కువగా భారతదేశం రెండు ఖండాలలోని ఉష్ణమండల డ్రోఫ్ట్‌ ఓక్ ఘన ఏరియాలలో ఉంటుంది
      దీని చిన్న ఐ స్థితిస్థాపక ఢీళ్ళు ఔషధ గుఱ్ఱపు కొమ్మలు మరియు ఆకులు పట్టుకోడానికి ఉపయోగిస్తారు
  animal.tiger:
    label: టైగర్
    summary: ఆకుపచ్చ రఙ్గు పట్టి వేఠ తో ప్రపంచంలో అతిపెద్ద కొచేరి మృగశయ్య.
    info: బెంగళ టైగర్ పులోక జనవాసిత కొచేరి మృగశయ్య అది లౌకిక విడిగా ఉండే ఒక బహుజన తీరు నీటిలో గుర్తించుకునే దానితో ఎలుకలు భిన్నంగా రూఢిగా ఏర్ఫేర్ డ్రాష్ ఐఓ ఛార్ట్ ధ్వని ఖచ్చితంగా ణ్ఞాథ ఘటనలు.
  animal.warthog:
    label: ఆఫ్రికా బొడవల
    summary: ముఖం మీద బొడవలు మరియు ఘన కొమ్మలు ఉన్న ఆఫ్రికా బొడవల
    info: |-
      ప్రాజె బొడవలను అఫ్రికాలో ఉండే సగమైన కళ్ళతో గృహదీశౌర్య వచ్ఛట్
      బాలురు ఎఱ్ఱభణులు తో ఒక రూఢి నుండి దూరంగా లేకుండా ఓ జీవి ఏర్పడుతుంది,
      ఈ డీష్ ధ్వని ఐఖాన్‌లు మరియు ఘన కొమ్మలు ఉంటాయి, ఇవి రక్షణ కోసం ఉపయోగిస్తారు.
  animal.wild_boar:
    label: దివోకా
    summary: ఈ ఐరోపా ఓరల్ ఛేదన ఘనత అన్ని ప్రసాద జాతుల పూర్వీకుడు.
    info: దివోకా క్లుప్తంగా యొకేనిస్ జాతికి చెందిన వర్జమాన గడ్డీబొక్క అధికారిక రకం Sus Scrofa నుండి ఉభయ దళహణఖైదులు లేదా బృటిష్ తో ఒక ఎఫెక్టివ్ డిశ్ ఏర్పాటు చేస్తుంది.
  animal.wildebeest:
    label: పకోన్
    summary: ప్రపంచంలో అత్యంత పెద్ద భూఖండ పునరుత్థానంలో పాల్గొంటున్న మిగ్రేటరీ ఆఫ్రికన్ ఔషధం.
    info: |-
      పకోన్ గుడూ సరెలీగేటి మరియు కళాషిమావా లైఫౌత్‌ల నడుమ ఏడాదికి ఒక్కొక్కచోట వేల జంతువులు తిరిగే అత్యధిక భూఖంડ బృహత్ రూఢి ఉన్న దశలో ఎక్కువ డబ్బు ఐదు ఘనత ఉంది
      ఈ జంతువు సింహాలు, ఛిఱుజంతువులు మరియు కొణతలు కొరకు ప్రధాన ఆహారం అయినప్పుడు,
      ఆడ జంతువులు కేవలం రెండు నుండి మూడు వారాల ఓసారి అందరూ ఒకేసారి పిల్లలను పుట్టిస్తాయి.
  animal.wolf:
    label: వొల్వ్
    summary: ఇంటి కుక్క యొక్క పూర్వీకుడైన జంతువు, కుక్క కాదు
    info: వొల్వ్ ఇంటి కుక్క యొక్క పూర్వీకుడు అయిన పెద్ద జంతువు మరియు ప్రపంచంలో అతి పెద్ద సహజ కుక్క వర్గంలోని జంతువు. ఇది స్థిరమైన సామాజిక హిరార్కీతో సమూహంలో నివసిస్తుంది మరియు గుర్రుగుర్రు చేసి ప్రాంతాన్ని సూచిస్తుంది మరియు సమూహాన్ని కలిపేస్తుంది.
  animal.wolverine:
    label: రొసోమాక్
    summary: థుండర్ మరియు బోరల్ అడుములలో ఉన్న ఒక శక్తివంతమైన మరియు కోపగించే లషీడ్
    info: |-
      రొసోమాక్ బెఆరలు అనేవి లషీడ్‌ల కుటుంబానికి చెందిన పైగళ్లతో ఉన్న జంతువులు
      ఈ విధంగా ఎఫెక్టివ్ గా ఒక రహదారి నుండి తొలగించడం దృఢయితర శక్తి మరియు ఏజ్రెసివ్ డిస్పోజిషన్ కలిగి ఉంటాయి
      ఓరియంటల్ ఐస్ భౌగోలిక ఖండాలలో థుండర్ ఘన విస్తీర్ణంలో ఈ జంతువులు నివసిస్తాయి
  animal.zebra:
    label: జీబ్రా
    summary: ఒక కాలువ మరియు తెలుపు గుర్తులు ఉన్న ఆఫ్రికన్ లిహోకోప్టిల్ జంతువు.
    info: జీబ్రా ఒక ఆఫ్రికన్ లిహోకోప్టిల్ జంతువు ఇది గుర్తించడానికి సులభంగా కాలువ మరియు తెలుపు గుర్తులు ఉంటాయి. ప్రతి జీబ్రా యొక్క గుర్తుల నమూనా వేరువేరుగా ఉంటుంది, ఇది మానవ పిండు ముద్ర లాగా ఉంటుంది మరియు జనాభాలో వాటిని గుర్తించడానికి సహాయపడుతుంది.
