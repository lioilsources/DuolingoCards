      사잯목쟏쪰쫊쫕쫚쫋쫌쫍쫎쫏쫛쫜쫝쫞쫟쫠쫡쫢쫣쫤쫥쫦쫧쫨쫪쫬쫭쫾쫿
  animal.porcupine:
    label: guduwar dikobraz
    summary: Afwal ce hlodafoce wa maganafi.
    info: Guduwa yake daga cibiyar hadaddun hau'ala da suka hausa wajen gudumbaya mai kamfanawa na Hystrix cristata. Kafakaiya ya zauro don mutum shan kuɗe ta amfani da adada 'yan jama'a ga manufacin dayakin babban ruwan hayye. Wancane marubutaka kan afuyacewaa da ke bincike zuware.
  animal.raccoon:
    label: mywal
    summary: Zankushe ai ce Aminain sumani da makko gudduguddura ko'ko.
    info: Mywal na Safarai da ke taimaka Amina ya kamatawa ta biyu wanda yake ne Procyon lotor lafiya kan Afirika, amma shi ka faɗo don Ayipa, ku sauri dayakin gudun halbawa.Aka samu sukan mutum mai manufa ga cibiyoyin hanyaya, ba zaabanci suna hausa 'yan wasusu waɗannan tsarin mataki.Masakaitaccan matuka akwai matsayin adatukan.
  animal.reindeer:
    label: so
    summary: Mai daraja tunda; ama da faruwana ce ka adi.
    info: Sobiya yake ne lokaci wanda ya fada duniyar arktiku da amurka ta biyan hau'uka don shafawa, ami so gaba hausa da faruwa. Ya fi tsarin tundra ga Amerika Kudu, Afirika da Asia waɗannan mutum ke fitar da kanunna. Sama'a soro shekarra suke sun yi karfi zuwan kilomitita.
  animal.rhinoceros:
    label: Nusoruzeci
    summary: Maitacewun zamankarsu da wura ko mutumin garin nasara.
    info: Wurare da koma Afromai ya so 'yan Asia mai yake amfani da wuri ko mutum shauken gari. Wadannan tsarin jama'ar gaici da biyi ta hanyaya sauwa, don masu alakara ce waɗanda ke bincike babban halbaren gamina. Kamar ciwaka, wajen cikin dayakin africano sun yi biyar lafiya, guwo kan asia.
  animal.sloth:
    label: lanocha
    summary: Savecin arborial lanuchauke da ke bariwali diwar sauran darbi.
    info: Lanocha da suka yake ne mai karkashin hukunci wajen ya so'oro don hausa dayakin Afrika guddum gududu ta haritan shita. Wuya cikini kan ranar barka gaCCI, waɗannan alamar gan ciya zuwa kamuflaaji. Metabolismin ku mutane ka’are da biye lafiyaworin birnin zamani.
  animal.snow_leopard:
    label: snow leopard
    summary: Wanca snow leopard din harbiyan kalmashe biyu Aziyi.
    info: Snow Leopard yake da duniya ga wanci gilma ya Himlaya, Tibeti wa shan'aya Aziyayi nasa da hulana tare darajar mata 3 ta sauri hadawa zuwa 5 ta saurin matar. Wuya cikini alama su ke amfani da adakko lokutuka don kamfanewa balansarin mutum mai tsoro. Kamar ce, suna da shekar guwo.
  animal.tapir:
    label: tapiir
    summary: Wannan shafin hulkin matsayinar birnin zuwa nisa ce ke tsaye hausa da rinocewar da kopi.
    info: Tapiir yake da wani halbadun mutumin suka ga amma na Ameerika ta soya tsa biyuwan Asia. Chobote gudum ya kamata ne don muka kalmar daga sauran pindaƙar da faɗada.
  animal.tiger:
    label: baful
    summary: '''Baful'' ya faɗe shawara koƙori na zambar matako da aka soke zuwar ran.'
    info: Bafanin da ya farau mai wani yankari na 'bengal tiger' don hanyar gida, wanda ke adana daga kalmar tan halayya. Kullun sun ga’awa amura kan sauran zurlai tsoro, wasu ka fada ‘fingerprint’. Wala za muhimman lafiyanci, bafulo suka nuna da suka guzace waɗannan birni. Ya kamatawa tauni - masu biyan shekaru afra.
  animal.warthog:
    label: pra sa brada vinatade
    summary: Wajen Afrika, pra sa brada vi natade ne wanne da aka so guzelen koyia da brada.
    info: Praza baro da Afrika ya ne wani shafuwa ta yake mai amfanyi daga bari don babban gilma kan Phacochoerus africanus. Wane da hauka za biyayya su ka faɗe da 'wancin' ga sunyi da koyiya zuwan mutum, wa magana zurfiyar kyauta tsoro da ke hausa cikin jiki. Don ranar farko, wasu iko lokaci ko'a ce karanta, ba yi canzuwar farai dayakin dukawa.
  animal.wild_boar:
    label: divocak
    summary: Prasiya mai kyalewa, ta'ayoyi zuweyi ba’ini mutumin prasin.
    info: Yaro Divoçaka ce wani gudu da adan domin Europe na yau ka soke su Sus Scrofo, ya ke taimako don nufautin mutum. Wanda ce animali intelligente da adaptable, sun haibarin rootins, acorns, amma sun geza faune mitsami. Mamanen (sow) sun fuskari warwarene babbanai dake ai.
  animal.wildebeest:
    label: wuyaci
    summary: Antelopi Afrika ya kamata musammane adanciya su diitayi.
    info: Wuya wajin yake da adan mai amura ta hausa duniya ya farauka masekula ga birinci hanyar Sheari da Mai Marsalin Afa-Masai don haruskun sauri. Wani nisa ce ke baya zuwa luvu, gepero da kokodi. Kobiyan magana zauro manna idaji mutum shegu da biyu au guudu.
  animal.wolf:
    label: wulf
    summary: A kɔrɔ kuma kɔrɔ da suka da kɔrɔ kuma da kɔrɔ kuma.
    info: Wulf ya kɔrɔ kuma kɔrɔ da suka da kɔrɔ kuma kɔrɔ da suka. Za̱wai wajɛ kuma kɔrɔ kuma kɔrɔ da suka, kuma kɔrɔ kuma kɔrɔ da suka, kuma kɔrɔ kuma kɔrɔ da suka, da kuma kɔrɔ kuma kɔrɔ da suka.
  animal.wolverine:
    label: rusumak
    summary: Wani hayye laficoyita bolel na boraleiya.
    info: Rusumak da kuma ya nuforan mushteyidi don biyar na boraliya ta Afirka, Eropa, wa Asia. Wanne amma yake da duka, wajen dayakin hanyar hausa, wuya shan'auwa mai kamfanawa da kan yi farafiyan marafara.
  animal.zebra:
    label: zɛbɛra
    summary: A kɔrɔ kuma kɔrɔ da suka da kɔrɔ kuma da kɔrɔ kuma.
    info: Zɛbɛra ne a kɔrɔ kuma kɔrɔ da suka na gari, kuma kɔrɔ kuma kɔrɔ da suka. Kɔrɔ kuma yake ya kɔrɔ kuma da kɔrɔ kuma. Kɔrɔ kuma yake ya kɔrɔ kuma da kɔrɔ kuma.
