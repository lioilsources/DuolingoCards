title: ווילד tierן
cards:
  animal.aardvark:
    label: הרעה
    summary: איינציקלעכטע אפריקהנסקי איןסעקטיוור מיט שאפע מעשב, שקופנדיגע נאראוועלן.
    info: הרעבעך קאפסקע איז דער איינציגלעכטע ליבנדיגע שטעל פון די רעד טובלידענטא וואס האפט נישטאמע נען מיט געווענליך צוויבלינגער. עפ夜晚 לעבן סטייל, שווארצע קרשים און בונדנע זאלע באזירן אויף בענצשונג פון מקוואם און טרמיפעס. ער'ס ארומגעזעצטע נארוועלן נוצן דורכאויס אנדרע טייערן.
  animal.armadillo:
    label: פא骚ך
    summary: קליען טיר אין א קרענער האלבאן פון בוני שאפינה.
    info: דער פאסאוועק דעווידטיפאסייס איז די איינציגע טיר מיט א ריאל באשטייקן קרענער. וואסנדיגע סארטן שרייבן זיך צו 'באל' אין געלף. עס איז א שוין קופצונגענעם און ער קאנט מעגליכע נארן אויסהאבן אין ווייני מאנאמען מיילמאכטען מינוטעס.
  animal.baboon:
    label: 狒狒
    summary: גרייסע ערדייער פריםאטן מיט א באלדן נעז' און שאפראנציאליסטישע ליוווג.
    info: 狒狒 איזן פארמילעך וואס האבן סאווה אין דער צפון און שטайнיגע געווייטלעכקיייטן אין עפענע קאנטעננט. זיי לעבן אין טרעפן מיט הירארשישעס אויספארונג און נוצן איינציקלא חלילונגען און מאימיקה צו קוועםמעניקציע. די בעיבוס זענען באקאנט מעגליך גרוesser אלס די וועלבין.
  animal.bear:
    label: медвед
    summary: גרעסער אלגמיינע פרייסטאטן מיט דיך שאפרונג, סימبول פאן נטורלאנגה.
    info: מעדוויעד האנטער איז די גרעסטע טירע פון איוראפע אן דאסיא, וועלכע קאנט מיגראנד צו זיין מאסע ביס אזוי 700 קילוגرامם. ער אז שפינגלש עטליכע סארטן פישלעך, באeren, בעננען אויפ'ן ברודוער מערגעל איבערהאלף ניידיקע מיימל. אין冬季 ער רוסט, און דורכאויסן די פרעמונגען פון די שוין אין די winter sleep.
  animal.beaver:
    label: bibr
    summary: Grösser Haldavants mit Dämmbau un Ershtelung vu Näschtumgeleben.
    info: Der Europäischer Biber iz di tsweite grösste Haldavants der wועל. Er baut Dämme us Tsim un Schlamm um Teene un Sumpfgebiete ze shapen vos sinn dɔm fyr vil Tierarten. Der Biber hot en flach skalyren Schwanz, groyse orange Kieferzähne un watertichtes Haar.
  animal.bison:
    label: ביזאן
    summary: גรอยße ביוויד מיט אראף שאך
    info: ביזאן אמעריקאיי איז די טעפערסטע לאנדטיר אין נארד אייערפען. אויפ'נ צענט וואל מיליאנען פון זיי האבן געווען באזשלאגן דורך מענסכן; קיין מאל ערלויבן ווייניגער אלץ עטליכע הונדרט. דורכאויס שטאטיסטיקע פרוגرامמע סinds זייערע נומבערס רוקגעשטעלט צו בערך חמשแสน.
  animal.buffalo:
    label: בופל
    summary: די באקומענע בעווייזונג פון דעם אפגריקאנעס בווייד מעגליכקייט.
    info: דער אפריקאנע בופל פארט צו די נאכגעוויסטעס טירן אין דעם ערדגלויב וואס ער גייט מיט זייער קאמפלעקסע שטייענשיף צוגרייך אויפ'ן סאווערטיגע פיינקע לעבן.
  animal.camel:
    label: וואעלבלאונד
    summary: עס איז א ווסטענאן שויבעם מיט באכן וועלכע ארבעיען ווי שאפל געפאר.
    info: דער דרומעדאר איז פאראפשעפט צו לעבן אין די וועстаן; זיין באך האלט שפיל, נישטא מים אלס איינצאליגע רעזערבאטיאנ. ער קאנסט טרעקלעכענעמען מער אז' מאלבונק ליטער מים אויף עפעס און סורווייוויין וואכלעגעוואריקייט ביי לאנגה צייטה נענט מעגליך צו טrinkען.
  animal.capybara:
    label: kapibara
    summary: גרעסטע הלאוואוויין, האלב איינוואוסיג און sehr friedlich.
    info: די קאפיבארע איז די גרעסטע לעביווונדיגע חיות אין דער וועלט מיט פילגעווענטן צווישן 35 ביסל 66 קילו. זיי לינגן אויף טרופיקאנגענע ערטער אין שדרה נאמעריקה נעבן טייכן, סאויערן און שוימבערגן. זיין ריאלי חברתי און מעגליך ערשיידונג מאכן זייען בעקאנט מיט אלץ אנdere tier.
  animal.cheetah:
    label: געברוד
    summary: די קייןסטהפטיגע ליווייצייטעל
    info: דער געפארד איז דער קイינסטע לעבן ווען אויף די ארץ און ער באשלאגט מיט צוויי סעקונדן פאר עטליכע שפיליגע נאכ מאקסימום זיבentaווס טאלנט. אין שווארצע באנקעוועל עלפער האלף אייך'ם צו רעדוצירן די ווארמעניש. אלגעמאין מעגליך יוגנד נעמט בעפרייונג נאדיק'ן.
  animal.chimpanzee:
    label: שימפנזע
    summary: אינטעליגנטישער אפעס וואו מיטליבן דעם נאר קיין לעבן פון מענשי
    info: |-
      Der šimpanse iz di nascheste verwandte kreatur fun menysher un teylet men mit hym an ekh hoben viel als 98.7% DNK gemeinsam
      Šimpanzen bruken werktuuge liks az geveyntelekh fir termite un kinne lernen d'grundsats fun geshpitzten spraach
      dey übertragen külturgebraekhen innerhalb von gruppen und leben in komplexen sozialen Hierarchien
  animal.coyote:
    label: קוואוט
    summary: נערדアイירמעריקע קאןיני וועלכער איז אנגעהאלפונג אפילו צו לעבען אין שטאטן.
    info: קויאט איז א פאסיבילע קאניני וועלכער באוויינט געווען די ענטציק צו נארד אייערמעריקע מיטל מאסיגע גרופעס. ער האבן אנגעהאלפן זיך אויפ'ן לעב אין דעם נערגענדיגקייט פון מענסכן און פרוגרעסירט ביס אזוי טאלאנשונגען.אין דער אמריקה אינדיין מיאטלוגלישע שפילט ער די רולע פון א סמארטע טרייכער.
  animal.deer:
    label: deer
    summary: גראזיאנזע פעettleבער; מעסק חאט הhörнер וועלכע זיין יעדעס jaar דורכאוס.
    info: דער וואלדן דע어 איז די מעריסט פאראפנע שטארק גרויסן ראנגע אין אייראפיע. מאנkek'ס האבן הörners וועלכע זיי טרעפן יעדעס Jahr אויבר צו ניידיגע קלאמענטהייט, עס איז די באקוועמסט סך בילדוונג אין דעם tier רייך. ער שייט אזויין לאמף אין דער הרשטע חודש און לוינט שויפצע לענדזשאפטס פאר פרומפלע.
  animal.elephant:
    label: אסלב
    summary: די גרוסטע לאנד טירן מיט'ן חוטוב און גדולים אזנים.
    info: אפריקאנער אלעפנט איז די גרעסטע טירן אויף דעם ערדבאלל מיט זיין רינגענשלאכט צו ברענעמען, פלוין וואasser, ערנסצונג נאר באקוועם און האבן אייך קאפיצייט. סעלבער ליבן אין שפילעס מאכן דורכאויסיגע מעדזימלי באהייפט.
  animal.fennec_fox:
    label: 팬엑
    summary: די קליענסטע חתול עם גדולות אוזנות.
    info: דער פאנעק איז די קליינסטע הונט דיווי שפיץ אין ערדן געווענט צו לעבן אויף די סהאר בעזיר וואלדן. ער האט שווארצע נאכגעוויסנע באניצונג טרעפן מיט זיין גרוסשע אוזנוועגן וועלכן ארבעייטן אלץ אזוי אנגעהאלטיג אז מען קען ליבן בלו爱美מער מאסענדיק פענצילigkeit.
  animal.fox:
    label: פאון
    summary: חכם שטיקליגע טיר מיט איינעם רעדזשעווייßen האר און א גרוזנדע שויף.
    info: דער פאון איז דער מערסטע באקוועםע שטיקליגע טיר אין די וועלט אן א גרויסע אנפאלגונג צו ערלויבן זיך אויפ'נ לעבן אין בוכetten, סטייטן אוןשטאטן. עס איז בערומ קיין חכמה וואס איז געזונגען אין מעשה נעלים און מאראצשין ארבעהמענט. עס יagt מיוסעס, voylעך און insektעך, און אין nødigקייט האקט אפילו עלעקטרישע פעלים.
  animal.gazelle:
    label: גאזעלע
    summary: A slonke, shteyge antelope fon Afrikaysher un Asiyasher Savanne
    info: |-
      "Thomson's Gazelle" iz afrika' oyfger azoylndik un es nemol di meyseste gazell fun Afrika
      Es keynt reyns faser vi 80km/s un farreyts shvartshe hopps um predatorim tsu geven aynerung
      dsives yn groysere herds un is an essentlekh target fur cheetahs lions und hyena dogs
  animal.giant_anteater:
    label: грязле инדיו
    summary: גריזל אינדיאנער - גרויסע בעאזובע סייבק מיט ארימע לענדער און קלופונגע לינגע.
    info: גריזל אינדיאנער איז די גרעסטע פון דעם סדרה און וואכט אין מיטלעמעריקע און צentralamerיקה. ער האפטייג נישטא קיין זשנען; ערש'ר שבר את השורות ביי מאכן טאף באזוך אויפגעצוועגן דורכאויס אנציקלאפעדייע מעגליך 60 см לאנגע לינגע. איינו טייכונג תורם על הפלת יומי של מעל 35 אלפים ants.
  animal.giant_panda:
    label: גרייסע פונדע
    summary: צוויבלוך מאדווד' פון קיין וועלכע איז vegan on bamboo.
    info: דער גרויסע פאנדה איז איינגעבויגן צו דעם מזרח שטיקל קיין וועלכע ער איז אויך ענטפערטעמער נאטורשועזונג דורכאויס סימبول. מעגליכקייט אזוי אלס 99% פון זיין דייעט באשטעלט פאר במבוס טרעיבן, אפילו שוין אנאטומיש' ער איז ein fleischfresser; ער האפט א sixth finger – eine überzählige knochen im handgelenk – וואס ארבעט ווי ain thumb אין הולף צו greifen bamboo stems.
  animal.giraffe:
    label: גאזירה
    summary: די הויסטע שטיין בעesting מיט אמאך נעק.
    info: דזשיראфе איז די הויסייטע טiere אויף דער ערד מיטן וואסמער קארפער פון מאכטיגע מעטרים אין האאביקייט. זיין לאנגה נוקל גיבט אייך צוטרעפן צו בלאאטער פון באומ פעקטיער, וועלכן סיי יעד'נ.
  animal.gorilla:
    label: גרילה
    summary: די größטע priemat אויף ערד באלל
    info: גרילע איז די גרעסטע פריימאט אויף ערדבאלל; דער מיטגליד פון מענטשן אינטשלאגנדיגן צו זייער נאכגעוויסניש קיין מאמעלס וואוס טרייבן אין איקוידעראל ערפאנדיקייט.
  animal.hippopotamus:
    label: ฮีพอโปลิปัส
    summary: เกรส תור יאק מאקס
    info: היפופוטם אמפליביוס איז דער דורכשניטליכע גרעסטע טירן אין צפון נאך די אלף און נעדוראז'ט. ער שläפט פאר מינדזש וואונדן טייג קיין אויסגעווענט האץ; באנאט עטליך ספיערונג זייענעמען. די היל ארויף רעדנדיקע פלאסען וועלכע באווייסט זיך ווי איין נטוראלישע סאן קרימ און אנטי בייאק. אבער מעגליך איז דאס א שווארצגעמאכן און פעסט.
  animal.hyena:
    label: היינע
    summary: סקורניס יאט און מקארד באפעטלער פון אфрיקה
    info: הוינה נאך איז די גרעסטע פון דער מילכעגעמאיך וואן האינדן און ער'ס צווישן סקווירניטע שטעלן קיין מאלצשיגע טיריער אין אפריקאנישע שאוואנעמענט. אויבגעווענדזונגן זייער באלעם,זיי עפצליכן מעגליך 60% פון זייער אייסן דורכאויסן זיי selv.ווייבשלעכן זין בעקוועם מער אלץ מעדלאמס.
  animal.jaguar:
    label: יעגר
    summary: די גרוסטע קט בעהין ארמיקה מיט ראוץטאפט סקרונה.
    info: יאגואר איז די דritten größטע קאט פון וועלט און די איינציגע גרויסע טיגר אין באהיין ארמעריקן. עס האבן קליטלע נוקטלעך אויפ'ן רוזטהפט סקברנענשאפערטער מיט צווישן זיי; שונדאלעכע באזוך ים און פisch מעגליך צו פischen, לויברענגנדיק פעלוועגן און קרפודילעס. ער איז געווען א חלבוליגע סימبول פאר מאayas און aztexים.
  animal.kangaroo:
    label: קאנים
    summary: גרעסער אויסטראלישע וואצנהאטער וואס שפילן מיט יואר חזוכע בענקע ליבם.
    info: דער ראודע קאנן איז די גרעסטע אויסטראלישע וואכנאַץ און דיא פלאפיסט סקיעפן אין דעם ערדגלובוס; ער קענען שפילן מיטר ביי ניין מאטרן לענג. די מעלך האльт זייענע באבי'ס (געוועי) אין אייר ברוועליגן טאש פאר עלפאקס שוין צוויי מאנדזש. דער קאן רעזינטירט אזוי אלס אן ايיקוניונע שאפע ваילאווערטigkeit اوיף דעם אۋשטראליישע לאנד-flag.
  animal.koala:
    label: קויאל
    summary: אווסטרעלישע מעם מאמעלע אין אייוואלויפ סאפט.
    info: קויאלא איז נישט עין בע어, אלא פונקן מאמעלע. זיין דייט באשטעת מערס ווי דריי צווענציג שטייער קלייבער טאגelig.
  animal.leopard:
    label: ליpard
    summary: גרויסה קאט שפילץ מיט סקברנitus הארער, וואנדערבארע קלימבער
    info: |-
      דער ליאפארד איז די מערסטע פארדרויפיגע גרויסע קאט שפיץ וועלכע און נאך ערנסטיקע קלימבער וואס ברingt זיין פריי אין באום קרונן צו שאצועם פון היינעס און לאווים
      די אנפאגליכקייט בלויב דרייוויין עטליכע גרוסשע קאטז מאכן אויף אייער ספעציעל ארמענעגונג איןแอפריקה, נענט מענשליך ווידער און רמייד פעסט יעדע טאג
      מאלניסטיישע פארמה איז געווענליצע שווארצע פאנתר
  animal.lion:
    label: לווי
    summary: Große Katze aus den Savannen Afrikas.
    info: לעוו איז נאטוראליגער קאט פון די גרעסשטע שטארן אין דעם סוד וואונדערבאנק מיטמעגליצייט צו ליבן אויף ערנסציקלאפעדייע. עס האבן זייער איינגעזעצונג אין מאכטיגע טירגראuppen.
  animal.lynx:
    label: רעקס
    summary: מיטל גרויסע וועלד טורעם מיט חומצקי עליפעס
    info: ערשט באקאנטען דורך די אראפיגע שפילזונגען פון בלויט צו ערשיין אויף די סוף ווי נאכטליקס יאזגנישמער קאט אין אייראפ迂.
  animal.mandrill:
    label: מאנדראיל
    summary: די פארפלעגסעсте פריימאט מיטן בעאלואווע פייצ'.
    info: '"מאנדريب" איז די גרעסטע אויפשעפענע וועלט מיטן אלטער שפיל און דיא פארפלויגסטע פריימאט. מאניעל האבן איינציקעליך בלאווע צוגרייסונגעך אין זייער באוווסונג קיין סאציעליי לעכגעווייסטהייט.זי ערדן אנגעפארן אין גרופעס אין טרופישע נאדערungsוויידמערג ים Cameroon, Gabun און Congo.'
  animal.meerkat:
    label: סוריקהטה
    summary: קליינה חברתי חיות יבשתית מקצה הקלהרי
    info: דער סוריקאט איז א קליינע וואלט מיטן מאנגוסטע נאך אין דרום אייראזילנד. עס לעבט צוזמענ פון גרויסם שפילר מעגליך מיט באזונדן סוציאלישע ערדורנעגן; אייןメンバー פון די גרופ迂 טרעפט אויפ'ן הוךפאנקץ. עס האבן-immunität צו שווערצונג פון snakes און scorpions.
  animal.moose:
    label: لوיס
    summary: די גרוסטע דינטער מיט לאנגע פרואן.
    info: לויז איז די גרעסטע דינטער אין ערדע מיט פארן וועלכע ערשיין צו זיין באלץ שפיץ קאפ ספעציעל אלקס אלכס. מענטשן האבן נאך אויבר מאטר טורמענשטייך און באראצאנגענע פרואן ווייליג אנגעווענדט צווישן 90–180 см לנג. זיי לעבט אין בעראלדיקע ברונדן איינופארט ארמיאקעס, יירופע און אזיע.
  animal.okapi:
    label: אק áp
    summary: פארמלויפענע פרודיגענע צוויין מיט זעברענענע לאגן פון דרום.
    info: דער אוקאפיע ווען פארעפנטליכט געווארן אין דעם יאר 1901 און ער עס איינעקס מיטל באדייגע טיר ניידזשונגענ די סIENCE האבן אויסגעדיקטען. צוליב זיין אופציע לעכקייצות מעציף קאמפלעקט שטייך'ו מאמענטאלישע באנאדיגקייט צום זייрафענען, אלץ איז ער דאס נעראсте ליווינדיגע רעלאטיווון פון דער זעירף. ער ליבט נור אין דרענסיגע בערגאן פון דער קונגרעס דעמוקרatische ראпубليك.
  animal.orangutan:
    label: אורנגאטאן
    summary: גרייסע רעד האירדעויף אפיסט און סמאטה.
    info: ארענגוטאן איז דער איינציגסטע גרויסן מיטלמענטש וואו נישט אין עפריקא. די נעם קומט פון מאלאיע צאלג'ונג באהוער מענש'. ער איז אויפגעוווסיגסט פונעם גרױסע מיטלמאנצן און טרעיבט זיין לעבן שפעציעליין אין באום קרונים.
  animal.otter:
    label: reiße
    summary: Spiesselig halb wasserleben tier das bei sauberen Wasserflüssen lebt
    info: |-
      די רייך ווייסע איז עין טירן פון די שפיץ מאכטיגער דינגער מיט גרויסע אנפעקט צו לעבן איןוואסער
      זיי האבן נאך קלאם וואסר באזונדערניש סרייסטלונג, שוועבנדיקע בלויעמער ערמאבערט זיין אויבן איינו מיינוט לנג
      ווייסעסנען זענען אן בעצעיכניס פאר רעדליך וואسريשקייט; ווו זיי לייוועל איך וואר heel
  animal.polar_bear:
    label: איيسבער
    summary: גרעסטע לונדןג טייב נאט מעגליך אין דער ארקטיקה.
    info: דער אייסבער איז די גרעסטע טירען אויף לאנד און דער הילף בערג אין דער ארקטיק. זיין וויße הא어ט פארמייד צוערטעלונג מיט ענטהפטיגע שטייפל חוטים; יעדע קאלם איז הויכלאך און דורכשאואויג. ער איז א שוין סchwimmer און קאנסט באדייערן היינדרייטער קיימער.
  animal.porcupine:
    label: דיקאבראז
    summary: גרייסע היולдавוץ פארגעצייט מיט שריפה איבערפארטיידע סאפנים
    info: |-
      דיקאבראז איז עין גרויסע הלוודאוויצש וועלכער איז פארטעלן מיט טווזנט שפיץ קיין דרמאטע צינדן, וואס זענען אנגעהאלטונגענעווערטיגע חלאים
       די ספאון נעמען נישטא אויף אלץ ווי שויפל; ביי באקוועם האבן זי'רע קלירנדז מאכן זיך לייכט ערשיידונג אין די בעקאם פאן פרעדאטאור
      די dikobraz איז די גרוסטע אפריקהה יודייעוואצעל און ער שאפט זיך נאך צו פיילן קורע, ווארزل און גריinus
  animal.raccoon:
    label: מיוועל
    summary: דיימעלכע בעהיאם מיט א שקאלף עלגאנד און רעדעגליך לעבן אין שטיאטן.
    info: דער נארטיקע מאמעל פון צentral א메ריקן וואס גייט אויפ'נ טיש מיט זיין שווערע באשטענדיגקיייסט האט ער קאומען אין די עירגענע שפילעס דורך מענטשן אינזידונג איבערהויף ביז אייער ספראך אריינגעצוקן. ארבעט ער מיט פרויונ לוטור.
  animal.reindeer:
    label: 骚
    summary: דיין לעפנבאוויי תורף; ביידע מענצחען
    info: דער סאָב פון דעם פוילעראר איז די איינציגע גייטליגע שפילץ וואס האט באנקעלן באידעמענטיק. עס ליבט אין טונדרעס צו נארٿ אמריקה, אויפרטשלאגונג אוןアジア און קענען מאכעניש מיטאלנדזשירן טAUSEND קאמאטירן. די סאם'ס חלים זיין דורכאויסגעשטעלט צו בעהוערן זייערע רעזידיענס.
  animal.rhinoceros:
    label: נאסראז
    summary: מאלצויגע בעהימל מיט איינעם אדער צwei ראגן
    info: די נאכסט גרעסטע טירע אן דער ארץ נאך די אלף וואווערט פארטגעציק מיט איינעם אדער צוויי הארנישמערשיגע קלאפ滕 אויף עים'נע באזוק. זיין רון איז נישטאָש בונען מאכן סאן, אלא מקפלין – אזעלבע חומרי שטיין ווי מענטשן נעגלעס. נאסוראזיס ינדווילידוואלס זענען אין שווארצע לייסט דורכאווס מסחר עם תוצר כדי פרוף לעבן על הاعتقاد השקרתי של כוחות מרפא.
  animal.sloth:
    label: נעeneg
    summary: פאלמאנדעווערע טירער וואס הängט מיט די בערגעלעמס אין די כורת פון בוק.
    info: |-
      ןענענש איז עין טירער מיטל פון דעם צentral און סוד אמריקה וואס גייט זייער שלאגמען לעבן אין די קארונעס פון טרופישע בוכם.
      ez נעeneg מעגליך נאך שוועק אנגעפארט אזוי שאכעמיג אז אויף זיין הארט ערברענגען גרינע אלгадהס וועלכווילן צו камופלויערן.
      ze מאטעמאבליסמוס איז באזוך שאכעמיג אז ער בריקט זיך נור איינ말 אין די וויכענד.
  animal.snow_leopard:
    label: Schneeleopard
    summary: רעגעמאנע גרוסה תירנה ים מיטל ايיסיש מאונטעائن
    info: דער שנעעגנש פארלייבט אין די הארץ אינזלן וועלכע זיין געווענדיג צו דעם הימלאיעס, טי别אט און מיטל אייזיש מאונטעין ביז אויף העיך בין 3,000 צו 5,000 מעטער. ער הייסט נאך קאלף וואס ענטפערט אויפ'ן באלויכונג אויף די סטלעס. עפענזאמ נעמען מעגליך נאן 4,000 bis 6,500.
  animal.tapir:
    label: טאפיר
    summary: גרוסה פריידישע מאסק ינדווידעום מיט א שווארצע אויף אמפלעזשערן חובל
    info: טאפיר איז עטליכע מילן פון קראסיג נאכגעווענשאפט צו רינדער און הונדן וואלשלעך, טרעפן אין דรอยקיקע שטייערנע באלמער פון אמריקה און סדר גרויס איייסטאנ. זיין קויפפיגע פרועליגע חובל ערלויבט די באווייטונג פון ברענגעלע און בלאטער.
  animal.tiger:
    label: טי גר
    summary: די größטע קאט ליאנד טירן אין דער ווארעלד מיט אוראנגעווער סטריך.
    info: טיגריס בונגרשקי איז די גרעסטע וויילנד קאט שפיץ טירן אין דער נאטורלעכע וועלט. יעדער איינצאלנעם האט עפענע פארבינדונג צווישן זיין סטרייפעס, אזויווי מענטשן'ס פינגערפרינטס. אויב אלץ לאווער'ס, טי גריס איז א באזוך מיטמעגליקייט און א שוין בעפאר מאכן.
  animal.warthog:
    label: bras afrikayne
    summary: Afrikanisher wildswine mir groysere klavers un barndeviken
    info: Bras afrikayner iz di freye-livende sudokoptyne yoyfernter dem heymisheh swin. Männcher hoben faser fun der geshtalt un gekrempte klaver far dreyfikung. Bei fluchting lopt er mit em geshpitzten shvanz oprejme keynm anntenformigen. Er gräbt keinerlei eignes holzer, noyshnit die holer fun wilde see.
  animal.wild_boar:
    label: דיווץאק
    summary: דיוויקע פריסע מיט קלעקס, פריידזשאן פון אלץ די פראסע מדרגות.
    info: דיבוצאק איז דער אוריגינאלע אייראפעאיש באש עטליכע פון די אלטסטע שפּריצן מיטלינג צו וועלכע גייט מעגליך נאר קיין חיות אויפצופרענעמען. זיי סinds intelligente און אנאדפטאבילע מאסקאוווענישעס וואס ערגרובן רוטין, אקאנאטונגענטשן, האבן אפילו טוקסיי אין די בוך און הייסטן צו ליווייען קליינע יינווארקי. די שוועסטערס (בוכנים) פאסן אויף די בערגעלך אין גרuppen.
  animal.wildebeest:
    label: pacon
    summary: Eyn migrierende Afrikanisher Antiloop mit nemol grösste landmassiger migration.
    info: Der pakun iz bekend far eine vu de groyssten erdmassen migrations af der wועל; mier fun ein million dieren tragen jorlich umsveeufe tuschen dem Serengets un Maasai-Mara. Er is di huvntik opregel fir loeren, cheperds un kraken. Di weibscher ken shtellen fast alleme mol an einem zeitfenster fan zwey bis dri veek.
  animal.wolf:
    label: uilke
    summary: די וועלדשע שפילצה רעלאטיוו צום האיים
    info: וילק איז די גרעסטע וויילדע שפיץ קייט אין דער פאמליע צווישן הונט מעגליך אויפגעצינדן מיטן נאמען Canis Lupus. ער ליבט און יagt אין טראפן מיט איין סוסיאליתהירארכיה און ענטפלעסיגונג דורכאויס מסרבערט זיין תחום עם בועז'ים
  animal.wolverine:
    label: רוסומאק
    summary: די מאכце און באזויענדיגע צווייגענשאפטלאñe טיר פון די ברועלישע лесунден און тайнья.
    info: רוסומאק איז דער גרעסטע טירן פון די משפחה וואו צוויגענשאפטליכע קאט'ס זינד שפעטמער. אויבגאנגען ניידriger גרייס אין בעקאם ער באלץ מיט ענטציק סייועך און באזוך און קענען רודן אייך אפטיילן פארעם. ער לעבט אויף גרוסע ט אריאלס אין די ברעלישע לעסונדן און טייניין פון נאור ápמעריקע, ירוופע אוןアジア.
  animal.zebra:
    label: צעבר
    summary: איינער פון די מאמעلس אין דעם סדרה פון קאפודעס מיט שווארץ און וeiß פרוג.
    info: זעبرا איז איינער פון די מאמעלס אין דעם סדרת קאַוואידס וואו זיין באקאנט מיטן שווערצשוויץ שטיין געווייסטע צוויי בענקלעך אויף עטליכע טרעפן. יעדע מעגליך האלפט ביי נאטירונגען פארדיגר'ס אין די ריבאלדן.
