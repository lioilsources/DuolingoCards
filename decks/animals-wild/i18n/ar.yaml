lang: ar
pivot: false
title: الحيوانات البرية
cards:
  animal.aardvark:
    label: خرزية
    summary: حيوان آكل للحشرات أفريقي ليلاً مع وجه مشابه للأفراشيات.
    info: الخنزير الأرضي هو النوع الوحيد الحي في رتبة التوبوليدنتاتا، ولا يملك أي أقارب قريبين. نمط الحياة الليلي و الأظافر القوية واللسان اللاصق هما تكييفان لصيد النمل والعثرة. يستخدم الحيوانات الأخرى عشرات أنواع الأنفاق المهجورة التي خلفها.
  animal.armadillo:
    label: خنزير مدرعة
    summary: حيوان صغير معه جلد مشوَّش بطبقات العظام.
    info: الخنزير المدرع ذو التسع حلقات هو الحيوان الوحيد الذي يملك دروعًا عظميًّا حقيقيًّا، وينغلق بعض الأنواع في كرة عند الشعور بالخطر، وهو حفرٌ ممتاز قادر على تشكيل نفق خلال أقل من دقيقتين.
  animal.baboon:
    label: بابوين
    summary: رئيس أفريقي كبير ذو أنوف كبيرة وميزات جسدية واضحة.
    info: البابون هو نوع من الرئيسيات الكبيرة التي تعيش في الأعشاب الطويلة والمناطق الصخرية بأفريقيا، وتعيش هذه الحيوانات بקבוצות لها هرم اجتماعي وتتواصل باستخدام مجموعة متنوعة من الضجيع والإيماءات. الذكور أكبر حجمًا بكثير الإناث، ويأكل البابون كل شيء؛ كما كان يُقدّس كحيوان مقدس في مصر القديمة.
  animal.bear:
    label: دب
    summary: ثعب كبير متعدد الأكلات له شعر سميك وهو رمز القوة الطبيعية.
    info: الدب البني هو أكبر حيوان البر في أوروبا وآسيا، ويمكن أن يصل وزنه إلى 700 كجم. إنه يأكل كل شيء ويستهلك الأسماك والتوت والعسل وحتى الثدييات الصغيرة. يتعرض للنوم الشتوي خلال فصل الشتاء حيث تلد الإناث صغارها فيه.
  animal.beaver:
    label: '"bobr"'
    summary: '{"summary":"حيوان كبير يستخدم السدود لإنشاء نظام بيئي رطب"}'
    info: '{"info":"الببر الأوروبي هو ثاني أكبر حيوان غامس في العالم، يبني سدودًا من الفروع والطين مما يؤدي إلى تشكيل البحيرات والمروج الرطبة التي تكون موطنًا لعديد من أنواع الحيوانات. لديه ذنب مسطح متغطي بالقشور وفكي قاطعة برتقالية كبيرة وكثيفة شعره المقاوم للماء."}'
  animal.bison:
    label: ' Bison'
    summary: Large north american animal that has thick hair around their head.
    info: |-
      البُيسون الأمريكي هو أكبر حيوان بري في أمريكا الشمالية
      كان على وشك الانقراض خلال القرن التاسع عشر؛ إذ تراجع عدده من حوالي ٣٠ إلى ٦٠ مليون فرد ليمت留下来 أقل من ألف فقط، ولكن بسبب برامج الحماية استعاد العدد ليصل تقريبًا إلى نصف مليون.
      it is also known for its long fur on its neck.
  animal.buffalo:
    label: بُوْفل أفريقِي
    summary: حيوان البقر الضخم الذي يعيش ضمن فlocks كبيرة، واحدٌ من مجموعة 'الخمس الكبرى'.
    info: |-
      البُوفَل الأفريقي هو أحد أكثر الثدييات خطرًا في إفريقيا، وهو جزء من ما يسمى بـ'مجموعة الخمس الكبار'.
      يعيش داخل قطعان تضم مئات إلى آلاف الفرد الواحد ويستطيع طرد حتى النمور عبر الدفاع الجماعي.
      إن الذكور العجوزة التي تسكن بعيدًا عن القطيع تكون غير متوقعة وعنيفة بشكل خاص.
  animal.camel:
    label: جمال
    summary: حيوان عاشق للتلال والصحراء مع وجود هضبتين أو إحدى الهضبات التي تعمل على تخزين الطاقة.
    info: |-
      الجمل الأحادي الظهر هو جمل يعيش في الصحراء؛ ظهره يستخدم كخزان للدهون وليس الماء، مما يجعلها احتياطيًا طاقيًّا لهذا الحيوان.
      يمكن لهذا الجمال أن يشرب أكثر من مائة لتر مرة واحدة ويتحمل أسابيع دون شرب السوائل.
      تم ترويض هذا النوع منذ أكثر من ثلاثة آلاف عام وظل أداة نقل أساسية للمجتمعات الصحراوية.
  animal.capybara:
    label: كابيبارا
    summary: أكبر فقاريات عاشبة على الإطلاق وأكثرها هدوءًا.
    info: الكابيبارا هي أكبر حيوان غامس في العالم؛ يصل وزنها إلى ما بين ٣٥ و٦٦ كجم، وتعيش بالمناطق المدارية من أمريكا الجنوبية قرب الأنهار والبحيرات والمياه المالحة. إنها مخلوق اجتماعي للغاية ولطيف جداً مما يسمح لها بأن تتعايش مع جميع أنواع الحيوان الأخرى تقريباً.
  animal.cheetah:
    label: غيبرد
    summary: أقوى حيوان بحراً على اليابسة يصل سرعته أكثر من ١١٠ كيلومتر بال ساعة.
    info: الغепارد هو الحيوان البري الأسرع ويمكنه أن يتسارع من الصفر إلى ١٠٠ كم في الساعة خلال ثلاث ثوانٍ، ويختلف عن باقي الثعالب الكبيرة بأنه لا يستطيع النهم بل يستخدم صوتًا مشابه للنهم. جسده الرفيع ومخالبه التي تبقى دائمًا خارجة هي ميزات لسرعة الهروب وليس القوة العضلية، وبعد ركضته السريعة عليه الراحة لتبريد نفسه.
  animal.chimpanzee:
    label: شيمنزانس
    summary: قُردة ذكية جداً، أقارب الإنسان الحيواني القريب
    info: |-
      شيمпанزي الجبل هو مع البونوب قريبنا الحي الأقرب ونشاركه حواليً ٩٨،٧٪ من الحمض النووي
      يستخدم الشِمْبَانزيس أدوات مثل فروع لصيد النمل والنحل ويستطيع تعلم أساسيات اللغة الإشارية
      ينقلوا العادات الثقافية داخل المجموعات ويعيش في هياكل اجتماعية مركبة
  animal.coyote:
    label: كوياوت
    summary: حيوان ثعلبي أمريكي شمالى يتلاءم للعيش بالمدن.
    info: '{"hint":"كلب شمالي متوسط الحجم (كانيس لاترانز)","info":"الكوياوت حيوان من الثدييات ينتمي إلى عائلة الكلاب ويوجد في جميع أنحاء أمريكا الشمالية\nعلى خلاف الذئب، تكيف مع الحياة بالقرب من البشر وانتشر حتى داخل المدن\nيلعب دورًا مهمًّا كشخص ذكي ومكرٍ في الأساطير الأمريكية الهندية\nيتواصل عبر النباح خاصة عند الغروب وفي الليل."}'
  animal.deer:
    label: أيل
    summary: حيوان كفيف جميل ذو حافتين ؛ ذكره له رؤوس القناة التي تنفصل سنويًا.
    info: ييلن لسني هو أضخم أنواع الأيائل انتشاراً في أوروبا، يحمل الذكور (الإيلياء) قرونًا تُفقد كل عام وتتولد مرة أخرى وهي الأنسجة النامية بسرعة داخل مملكة الحيوانات؛ كما أنهما يتقاتلان من أجل الإناث خلال موسم التكاثر ويطلقون صوتًا عالي الصدى.
  animal.elephant:
    label: الفيل
    summary: أكبر حيوان بري على اليابسة، له منقار وآذان كبيرة.
    info: |-
      الفيل الأفريقي هو أكبر حيوان بري على الأرض. يستخدم منقاره
      للتنفس والشرب والشم وحمل الطعام. يعيش الفيلة
      بشكل مجموعات تُدار من قبل الأنثى الأكبر سناً، ويُعرفون بذكائهم وذاكرة قوية.
  animal.fennec_fox:
    label: الفيك
    summary: أصغر ثعلب بريّ في العالم مع آذن كبيرة جدًا.
    info: الفينكس هو أصغر حيوان من الثدييات المفترسة في العالم، مُكيف للعيش بالصحراء الصحراوية. تساعد آذانته الكبيرة على فقد حرارة الجسم وتحسن السمع بشكل كبير. كلى الفينكس فعالة للغاية لدرجة أنه يستطيع البقاء دون شرب المياه مباشرة؛ حيث يحصل الرطوبة اللازمة منه طعامه.
  animal.fox:
    label: fox
    summary: Clever little canid predator with thick fur coat.
    info: |-
      الثعلب الأحمر هو أضخم حيوان من فصيلة الكلاب في العالم وقادر على التكيف بشكل ممتاز، ويوجد بالغابة والسهول وحتى المدن.
      it is famous for its cleverness which has been sung about by fairy tales around the world.
      He hunts mice birds insects;
      in emergency he collects waste too.
      The female fox gives birth to four up six cubs.
  animal.gazelle:
    label: غزال
    summary: أنيقة ومتناثرة السرع الأصيلة لأعشاب أفريقيا آسيوية.
    info: تُعتبر الغزلان تومبسون واحدة من أنواع الغزالة الأكثر انتشاراً في إفريقيا، ويمكنها الوصول إلى سرعة أعلى من 80 كم بالساعة وإجراء قفزات مميزة لإرسال الإشارة للحيوانات المفترسة. وتعيش هذه الحيوانات بحراوات هائلة وهي فريسة رئيسية لليبّرات والأسود وأبناء عائلة الكلاب.
  animal.giant_anteater:
    label: المراعنة الكبيرة
    summary: حيوان عدوي ضخم لا يتسم بالأسنان ولغة طويل.
    info: يوجد مُرَّاعِنٌ كبير في أمريكا الوسطى وجنوبها، وهو أكبر نوع من أنواع المُراعين ولا يملك أسنانًا؛ حيث يستخدم أظافره القوية لتفريق النمل الأبيض ويجمعه بسان جليدي طوله حتى 60 سم. أنه يأكل أكثر من 35 ألف نملاً وأفراداً من حشرات النيمرتيد خلال اليوم الواحد، كما تحمل الإناث صغارها على ظهرها.
  animal.giant_panda:
    label: الفأر الأسود والأبيض
    summary: فأرة صينية تأكل فقط بامي.
    info: '{"info":"البامبو العملاق هو نوع خاص بالجزء الجنوبي الغربي من الصين وهو رمز عالمي لحماية الطبيعة.\nيمثل أكثر من ٩٩٪ من غذائه نبات البامي، على الرغم أنه أنثروبوفاج بيولوجيًا.\نلديه إصبع سادس متطور يشبه الإبهام ويستخدم في حمل سيقان النباتات."}'
  animal.giraffe:
    label: الزرافة
    summary: أطول حيوان على اليابسة، له عنق طويل جداً.
    info: |-
      الزرافة هي أطول حيوان على اليابسة في العالم؛ يصل طول الذكور
      إلى أكثر من خمسة أمتار. يسمح له العنق الطويل بالوصول إلى أوراق الأكاسيا،
      والتي تُعتبر مصدر طعامه الرئيسي.
  animal.gorilla:
    label: غورية
    summary: أكبر مخلوق في العالم من فئة الرتيان الكبيرة الموجودة بقارة إفريقيا الاستوائية
    info: |-
      الغوريلا هي أكبر كائن من رتات الفصليين؛ يمكن أن يصل وزن الذكر البالغ إلى ما يقارب ٢٠٠ كلغم
       الغوريلا تأكل أساسًا النبات، وتأكل الأعشاب والبراعم والفواكه
       أنها تتواصل عبر الصوت والإيماء والت격يع على صدرها
  animal.hippopotamus:
    label: ال حصان النهر
    summary: حيوان كبير من إفريقيا полу водّي ذو فكين ضخمين.
    info: الحصان النهري هو ثالث أكبر حيوان ب육 على الأرض بعد الفيل والزرافة، يقضى نهاره في الماء لتجنب الارتفاع الحراري وليلًا يستلقِ ويأكل على اليابسة. جلده يقوم بإفراز سائل أحمر يعمل كواقي شمس طبيعي وأدوية مضادة للبكتيريا.
  animal.hyena:
    label: حيونات
    summary: الصياد والجَرّاح الأفريقي في السافانا.
    info: |-
      {"hint":"predator rayyā al-mawti wal-talab fī sawātan Afirikiyyah (Crocota Crocota)","info":"Hiynat assabr wa hiya akthar khaliqa fi kalimat attayyar min ghayri annaha ma tajub lil-katab kama yuqadhar bi-haya qutranin li-l-nithari wala kin tu7aqiq anha ta7sili ila arba'een faqusun min amakin mufardhah.
      a7da9 at-thana3iyat akbar min ad-dawa3 wal-aqudhiyiyan.
      an nathir tahmahu huwa sa5wak tilka allaty ya7rahu ash-shudhud aw alkhawf dhaman ma yakuna da3aman bil-fرح."}
  animal.jaguar:
    label: جاكار
    summary: أكبر سبعٍ أمريكي مع وجود أشكال مثل الورقة.
    info: الجاغوار هو ثالث أكبر نوع من الثدييات المفترسة في العالم، وهو الكائن الوحيد الكبير الذي ينتمي إلى عائلة السباعيات ويوجد فقط في أمريكا الشمالية والجنوبية. على خلاف الليونهيرت فإنه يتمتع ببقع مزينة بنقاط صغيرة داخلها تشبه الأوراق المتعرجة. إنه حيوان جيد جداً بالسباحة وصيد الأسماك حيث يمكن أن يتغذى أيضاً على التمساح وكابيبارا. كان رمزاً دينياً للقوة والإمبراطورية لدى شعب مايا والأزتيكس.
  animal.kangaroo:
    label: كوالا
    summary: حيوان ثديي كبير الأصل يستخدم قدميه الخلفيتين الطويالتان للقفز.
    info: كوالا الرمادي هو أكبر كائن فقاري أسترالي وثديّ، ويمكنه القفز لأكثر من تسعة أمتار في المرة الواحدة. تبقى صغار الكوала داخل جيب بطني مخصص لمدة ستة أشهر تقريبًا قبل أن يبدأوا بالعيش بشكل مستقل.
  animal.koala:
    label: كوала
    summary: حيوان فقري متناثر يعيش على شجرة桉树 في استراليا.
    info: |-
      الكوالا ليست عدوانًا، بل هي حيوان من الفقاريات المُحاطة بالفجوة.
      تتناول غذاءها بشكل أساسي أوراق桉树 التي تكون سامة لمعظم الكائنات الحية؛ فالكوا لا تمتلك نظام هضمي خاص.
      تحظى بفترات نوم طويلة قد تمتد حتى ٢٠ ساعة يوميًّا بسبب قلة القيمة الغذائية لأوراق桉树.
      وهي محمية بموجب القوانين الأسترالية.
  animal.leopard:
    label: ' leopard'
    summary: حيوان كبيرو من نوع السباعي له بشرى متقطعة، وممتاز القفز.
    info: "النمر هو أضخم حيوان من عائلة السباعيات انتشاراً، وهو قارص ماهر ينقل فرائسه إلى الأشجار لحمايتها من الذئاب والأسود. \nإن تكيفه يجعل منه أفضل سبع كبير في البقاء ويعيش بأفريقيا وبمنطقة الشرق الأوسط وإقليم جنوب شرق آسيا. \nشكل النمور الملون بالظلام يعرف باسم نمر أسود."
  animal.lion:
    label: الأسد
    summary: حيوان من عائلة القطط الكبيرة يعيش في الأعشاب الجافة في إفريقيا.
    info: |-
      الأسد هو حيوان من عائلة القطط الكبيرة يعيش بشكل رئيسي
      في الأعشاب الجافة جنوب الصحراء. يعيش في مجموعات تُعرف باسم 'البريد'؛
      تُشارك الإناث في الصيد معاً، بينما تُستخدم شعرية الذكر البارزة
      لردع المنافسين. يُعرف الأسد غالباً بـ'ملك الحيوانات'.
  animal.lynx:
    label: ليونس
    summary: ثعلب صغير مع خصلات الشعر على نصوف الآذنين.
    info: '{"hint":"قطة وحشية متوسطة الحجم بفراء على طرف الأذن (猞猁 لينكس)","info":"اللِّيْنسُ الظَّرِيف هو أكبر قطة عابرة في أوروبا. يمكن التعرف عليه من خلال شعر أسود متفرق على حافة آذانه والذيل القصير. يصيد بشكل رئيسي عند الغروب وفي الليل؛ فريسته الرئيسية هي النمور والأرانب. كان قد انقرضت منه في التشيك، لكن تم إعادة توزيعها بنجاح بعد الحرب العالمية الثانية."}'
  animal.mandrill:
    label: منдрول
    summary: أكثر الثدييات إشراقاً لها شكله بالألوان الزاهرة مثل الأسود والأبيض.
    info: '{"hint":"الثديي الملون ذو الوجه الأزرق والاحمر النابض بالحياة (الماندرييل سفينكس)","info":"إن المندرو هو أكبر قرد من عصر ما قبل التاريخ يعيش اليوم وأكثر الثدييات لونًا في العالم\n إن الذكور لديهم وجه مذهل بلون أزرق و أحمر، وهو مؤشر على مكانة اجتماعية معينة \n توجد هذه الحيوانات ضمن فرق صغيرة داخل غابة الكاميرون الاستوائية وجيبوتى جمهورية الإكوادور." , "label": "مندرول", "summary": "أكبر ثديية حية ذات اللون الأحمر والأزرق."}'
  animal.meerkat:
    label: سوركيتا
    summary: ثديٌ صغير اجتماعي موجود بالقرب من منطقة الكلاهارى ويقف على قدميه الخلفيتين.
    info: |-
      {"hint":"صغير من الثدييات الاجتماعية ينتمي إلى عائلة المانغستات في كالاهاري (السورية سوريكاتا)","info":"سوريكата هو ثديٍ صغير من فئة المنجسطوات التي تعيش جنوب إفريقيا،
      وتعيش ضمن مجموعات ذات هيكل اجتماعي مستقر؛ حيث يكون أحد أعضاء الفريق دائمًا على حذر ويراقب من مكان مرتفع.
      إنها مقاومة لسم الأفاعي وللدود المؤلمين أيضًا.
      تتعلم سوركيا تقنيات الصيد بطرق مختلفة."}
  animal.moose:
    label: لوز
    summary: أكبر哺乳动物 من نوع الجراد مع القرن الشكل المجرا
    info: |-
      اللوس هو أكبر حيوان من عائلة اليلن؛ الذكور تصل إلى ارتفاع يزيد عن مترين في الكاهل وتحمل قرون شبيهة بال مجرفة بطول يصل حتى ١٨٠ سم
      يعيش في غابات السرو الشمالية لأمريكا، أوروبا آسيا
      وهو مُسبّاح ومغطِّس جيد ويغرق رأسه تحت الماء للحصول على النباتات المائية
  animal.okapi:
    label: أوكابي
    summary: الجارح الشجري ذو ساقين مشوختين مثل نمور الصحراء القادمة من دولة الكونغو.
    info: تم وصف الأوكابي علمياً لأول مرة في عام 1901، وهو أحد آخر الثدييات الكبيرة التي اكتشفتها العلوم الحديثة. على الرغم من أنه يشبه بصرياً مزيجاً بين الجمل والنمر السرخسي، إلا أن أقرب كائن حي له هو جمل النوبة. ويوجد فقط داخل غابة المطر بالجمهورية الديمقراطية للكونغو حيث يعتبر رمزاً وطنياً للمكان.
  animal.orangutan:
    label: gorilla
    summary: حيوان كبير ملون بالبني يسكن على أشجار جزيرتي borneo وsumatra.
    info: الغوريلا المُحمرة هي الوحيدة من بين الحيوانات البشرية الكبيرة التي تعيش خارج إفريقيا، واسمها مشتق من اللغة المالاوية ومعناه الإنسان الغابوي. إنها أكثر حيوان بشرة كبيرة انفرادية وتقضى معظم حياتها في قمم الأشجار.
  animal.otter:
    label: الفأر
    summary: حيوان فضولي نصف جوامد يسكن عند الأنهار النقية.
    info: النحلة النهرية هي حيوان من عائلة الفئران المائية مُعدّل تمامًا للعيش في المياه، لديها شعر كثيف مقاوم للماء وغطاسات تساعد على السباحة ويمكن لها البقاء تحت الماء لأكثر من دقيقة واحدة.
  animal.polar_bear:
    label: دب قطبي
    summary: أكبر مفترس برّي موجود بالقطب الشمالي.
    info: الدب القطبي هو أضخم حيوان بري وأكبر مفترس في القطب الشمالي، وفراءه الأبيض يعزل الحرارة بشكل فعّال حيث أن كل شعرة من الشعر تُعتبر خالية داخلها واضحة النظرة؛ كما أنه قادر على السباحة لمسافات طويلة قد تمتد إلى المئات من الكيلومترات. ومع ذلك فإن الاحتباس الحراري العالمي يؤدي لتقلص طبقة الجليد التي يستخدمها الدب للصيد مما يؤثر سلبًا على عدد هذه الفئة.
  animal.porcupine:
    label: ديكوبراز
    summary: ثعبن كبير يتميز بإبر دفاعية حادة.
    info: الديكوبراز حيوان مُغطى بألاف الأشواق الحادة والفارغة التي تتحول إلى شعر، وهي ليست سهامًا بل تنفصل بسهولة عند اللمس وتثبت في جسم المفترس. وهو أكبر نوع من الثدييات النامية وأفريقياً يبحث عن القشر و الجذور والأعشاب ليلا.
  animal.raccoon:
    label: '"قنفاذ"'
    summary: '"حيوان أمريكي له وجه أسود ومداس ذيل مشوّش."'
    info: '{"hint":"قنفذ ليلي مُخفي من أمريكا الشمالية (Procyon lotor)","info":"يأتي القنافذ الشمالي من شمال america، ولكن تم إحضاره إلى أوروبا حيث انتشر بكثرة اليوم.<br> إنه معروف بخداع الناس بأنه يغسل طعامه قبل الأكل؛ في الواقع يقوم بذلك لتخفيف حساسية قدميه.<br> إنها كائن كلاب ومتغير بشكل استثنائي ويوجد حتى داخل المدن ذات الكثافة السكانية العالية."}'
  animal.reindeer:
    label: سُب
    summary: ثعلب عاشق للتندرا؛ لديه إناث أيضاً.
    info: السوب القطبي هو نوع واحد من أنواع الحيوانات الجيلانية التي تملك فيها الإناث أيضًا قرونها، ويوجد في المناطق المتجمدة شمال أمريكا و أوروبا و آسيا ويمكنه الهجرة لمسافات طويلة بآلاف الكيلومترات. يربّي السامويون هذا النوع تقليدياً كحيوان زراعي.
  animal.rhinoceros:
    label: носорог
    summary: حيوان كبير مع واحد أو اثنين من القرن على الأنف.
    info: النسر الأبيض هو ثاني أكبر حيوان بري بعد الفيل، وقرنه مصنوع من الكيراتين مثل أظافر الإنسان وليس العظم. تُهدد قطع الغابات هذه المخلوقات بسبب الإيمان الخاطئ بأن لقرونها خصائص طبية.
  animal.sloth:
    label: لينوكود
    summary: حيوان ثديي سريع النمو علق رأساً قدمين بين أغصان الشجر.
    info: اللِنُوكَوْد هو حيوان ثديي مكيف تمامًا للعيش البطيء في أعالي الأشجار المدارية، حيث يتحرك ببطء إلى درجة أن الطحالب الخضراء تنمو على شعره لتكون كامouflage طبيعياً له. أيضًا معدل التمثيل الغذائي لديه بطئ للغاية لدرجة أنه يستخدم فتحة الإخراج مرة واحدة فقط أسبوعيًا.
  animal.snow_leopard:
    label: ثعلب أبيض
    summary: قط كبير نادر جداً بالجبال العالية بأفغانستان.
    info: '{"hint":"felix grande من جبال آسيا الوسطى المفقودة (النمر البانثر)"، "info": "يعيش الثعلب الأبيض في بيئة الجبل المرتفعة للهيملايا وتيبيت وجبال آسيا الوسطى بين ارتفاعات تتراوح ما بين ٣٠٠٠ إلى ٥٠٠٠ متر\ n لديه ذيل طويل بشكل استثنائي يخدم لموازنة على الصخور \ ن يوجد تقريباً فقط ٤٠٠٠ إلى ٦٥٠٠ منها حول العالم \ ن واحدة من أقل القطط الكبيرة دراساً."'
  animal.tapir:
    label: تاڤير
    summary: حيوان كبير ذو كحل مختصر قريب من النمور والفيلة.
    info: التاڤير حيوان عاشب ينتمي إلى فئة الحوافر الفردية ويعتبر من الأنواع القريبة من الزواحف والخيول، رغم أن هذا غير واضح على الوجه الأول. ويوجد في الغابات المطيرة الاستوائية بأمريكا جنوب شرق آسيا. يستخدم التاڤير خفيفه المرنة لامساك السيقان والأوراق.
  animal.tiger:
    label: تايجر
    summary: أكبر ثعلب شبيهة بالقطط في العالم مع أنماط أفقية بلورية.
    info: النمر البنغالي هو أكبر نوع من الثدييات البرية في العالم، ويعيش بشكل حر دون احتجازه البشر. كل فرد يمتلك نمط خطوط مميزًا جدًّا مثل بصمة الأصابع لدى الإنسان. على عكس النمور الأخرى التي تعيش بجروها أو كمجموعة فإن هذا النوع يتواجد غالبًا بمفرده ويتميز بأنه قادر كبير السباحة.
  animal.warthog:
    label: الخنزير المتململ
    summary: خنزير أفريقي متوحش ذو أسنان طويلة وقرون على وجهه.
    info: |-
      الخنزير المتململ هو خروف أفريقي حر يشبه الخنزير المنزلي.
      The males have fleshy growths on their face called warts and curved tusks used for defense.
      When fleeing it runs upright like an antenna holding its tail vertically up,
      it doesn't dig burrows itself but uses those made by hares.
  animal.wild_boar:
    label: ديكايا
    summary: خنزير جبلي ذو أسنان طويلة، وهو نتاج جميع أنواع خنازيرو المنزل.
    info: |-
      الديكاء هو نوع أوروبي أولي وجدّه لكل سلالات الخنازير الأليفة
      إنها كائنات ذكية ومُناسبة تأكل كل شيء، تنقب عن الجذور والحبوب ولكنها تتبع أيضًا الحيوانات الصغيرة للصيد
       الإناث (الأمهات الديدانية)، تقوم برعاية صغارها في مجموعات
  animal.wildebeest:
    label: جنوا
    summary: أحد أنواع الغزلان الهادرة المشاركة في أضخم هجرة برية.
    info: |-
      يُعتبر جَنْوٌ من الأنواع المعروفة التي تشارك في أكبر هجرة بريّة على الإطلاق، حيث يعبر أكثر من مليون حيوان سنويًا بين سيرينغتي ومارا ماساي.
      it هو فرائس رئيسية للأسود والبنات الثعلب والنِّسور المائية.
      وتلد الإناث تقريبًا جميعها دفعة واحدة خلال فترة قصيرة لا تتعدى أسبوعين إلى ثلاثة أسابيع.
  animal.wolf:
    label: الذئب
    summary: حيوان من عائلة الكلاب البرية، وهو أسلاف الكلب المنزلي.
    info: |-
      الذئب الشائع هو أكبر حيوان من عائلة الكلاب البرية،
      وهو أسلاف الكلب المنزلي. يعيش ويصيد في مجموعات ذات هرم اجتماعي ثابت،
      ويتواصل عبر النباح، والذي يُستخدم لتحديد الأراضي
      ولجمع المجموعة.
  animal.wolverine:
    label: روسومك
    summary: حيوان لاسيتي كبير القوة والعُنيف الذي يعيش داخل الغابات والمغبريات.
    info: الروسماك هو أكبر كائن بري ينتمي إلى عائلة الفئران البرية، ويتميز بالقوة الاستثنائية والعدوانية رغم حجمه الصغير ويمكنه طرد الأسد من قطعة فرائس له. ويعيش في مساحات شاسعـة من غابات المناطق المعتدلة الباردة وتندرا أمريكا الشمالية وأوروبا آسيا.
  animal.zebra:
    label: الزرافة المخططة
    summary: حيوان من عائلة الخيل في إفريقيا، له خطوط سوداء وبيضاء.
    info: |-
      الزرافة المخططة هي حيوان من عائلة الخيل يعيش في إفريقيا،
      ويُعرف بسهولة بخطوطه السوداء والبيضاء. يختلف نمط الخطوط لكل فرد
      بشكل فريد، مثل بصمة الأصابع لدى البشر،
      ويساعد في إرباك المفترسين في القطيع.
