cards:
  animal.aardvark:
    label: hrabanwr
    summary: Insektopor Afegan gyda rysm mharasochedig sy'n copio trwyn
    info: |-
      Mae'r hrabanwr Caffaidd yn y惟一 lifwyd rhag yr ardod Tubulidentata ac nid oes ganddo unrhyw bêntau agoredig arall
      Gweithgariaeth nosweddiadol, croen cryfogol a hyngar adhesif sydd wedi'u cysoniad i geisio am wrthlinyn nhirion a therytirog
      Ddefnyddiwch ei norri ddiladwy dan fynd gan droslyn na thrî deg o feithrin eraill
  animal.armadillo:
    label: pasvodyd
    summary: Arafwr bach gerllawr gan dystiau gogwyddol.
    info: Mae'r pásvod naw-pedwyr yn y惟一 arafwr gyda chrymuad drwyddedig o dystiau gogwyddol. Wrth ei heintio byddai rhagymau peneth nhom ddigon i'ch rholo'n barfannell. Mae wedi'u profi fod yn harfernod dda ac yn gallu groesi tunel dan dwy funud. Mae'n eichian naturiol i basaterith sy'n achael laetr.
  animal.baboon:
    label: pawiân
    summary: Wahanolynt Aferaeg cryfaf efo nosgennau pen danareb a fyw miliniau.
    info: Mae pawiannau yn rhagymyn o wahanolion fach ar y ddaear sydd wedi'u dod o Afrika ac maent yn gweithredu mewn grwpiau gydag ordrefadwy hiarchyddig â chomuniadeiddiad gan gymaint o ddigoniant a pherthnas amharu. Mae'r llynges agored nhw'n eu nodweddiadau pwysicaf ond hefyd mae cydranfaeth naill i'ch enweb ei benywod ryfelor hirac. Maent yn allforfawydwr a chefnogodd Eifftid nhw fel creuthurau craffter.
  animal.bear:
    label: llynvydd
    summary: Lynvydd mawr â chymaint grym na thrin naturiol.
    info: Mae'r llynfydd rhudd yn fwyaf ychydig o fewn yr anifeiliaid llifogydd Lychlynnaidd ac Asiafogaeth sy'n cyrraedd hyntoedd am dan seddi diwrnodol dros ei gyfn normiwg.
  animal.beaver:
    label: bobby
    summary: Rhynfrhaid hirnodwedig sy'n brysio damau
    info: Y bobry'r ail fwyaf rhyngrhydd y gêm yn dod o'r enw Cymraeg 'castor'. Mae'n adeiladu damau gan ddefnyddio twll ac arbedydd sy'n creuro tuniau ond hefyd celtiroedd ryngweithiol i fydofo nhawelion.
  animal.bison:
    label: bismon
    summary: Gŵyl boreidigaeth gyfoesiadur Efrog Newydd â pherthnas agored.
    info: Mae Bison Americanaidd yn fwyafswyr rhewg y gŵyl ar Ddaear yr Unol Daleithiau ac America Fathnasigau. Roedd ganrif o'r trydydd canmil i'w hun wedi cyrraethio am dros drothwy ddynrychiadol yn nhrechu'r uned pen-frys. Mae'n symbol gwirioneddol Cymal Dywyll Llynges Genedlaethol.
  animal.buffalo:
    label: buval
    summary: Bovin Afer na'i wlad yn dod yn grwpiau - rhan o'r Pump Mawr.
    info: Mae'r buvol Affricanaidd yn un o fwyaf anaml y byd plant arno ac fe'w chynigir hefyd fel rhaglen 'Pump Fawr'. Mae'n fyw yn grwpiau sydd gan eu cyfansymudiad dros gantau hyd at filoedd o bobl a gallai nhw ddod â llwyni gyda'u diwrnodion clymiant gymhariaethol.
  animal.camel:
    label: camel
    summary: Savec dwys gyda chirbiadau sy'ch bod yn eu cyfrannu tan.
    info: |-
      Mae'r camwl un-hirb (cammlas dromedaris) yn gwestai'n ysgafliadwy i fyw mewn dyrydwchau; ei Hirb sydd wedi'u cynhyrchu tyfyn na water ac fel adloniant energaethig
      Gall e ddod o hyd at fil liter o wlydr ar yr un pryd a chweil am wythnosau heb gymelli cwt Wyn nhrechu rhagor nag tri mil flwyddyn yn ôl ac fe wel farferniad allan i fathion.
  animal.capybara:
    label: capiwira
    summary: Hedfan cyntaidd amharu ag anifeiliaeth wael
    info: Mae'r kapiwara yn fwyaf ymyl hedfan sydd mewn byd poblog -- gall rhaglawrion gweithredu o dan ochrau 40 i gymeriad hydoeddol ar ôsau neu lynnyddo'n eu heffeithio.
  animal.cheetah:
    label: Geopard
    summary: Byddyn trywelaf ar draws tir cydaeth â olwg dan nodweddiadol
    info: Mae'r gepard yn y byddyn dryfol fwyaf ar y llynys ac mewn tri eiliad gallai barhau o sero i 100km / h. Wedi gwahanol rhag eraill cattiauwch drom rydym ni'n siŵr ei ddweud nad allant writhio ond yn hytrach maen nhw'u gwrthredu. Mae eu corffion anfernhir a chymerriadau sydd dim ond am gymal chi'nt wedi'u crefft at welliant gan hefyd cryfder.
  animal.chimpanzee:
    label: Chimpaz
    summary: Un fath o fyddfrydwyr hynafol, ryfelwr cwbl anhrefnach
    info: |-
      Mae Chimpanzee yn gymlynaeth â'r bonobo'n ein gilydd rhagor ag unrhyw un arall ac mae e'n cyrraedd am ddim ychydig o danrifau genetegol gyda ni - tua pherthnas 98.7%
      wneudir cynnal gan chimpanzees fel defnyddio twll i chweilu termitydyd wneud hyrfforddi cymydogion sydyn nhw chi
      mae chimps hefyd yn symudiwyd traddodiadau allan o fewn grwpiau eu huned a'u bygython pen drith
  animal.coyote:
    label: cwyll
    summary: Fenodydd Sevro-Amerigadol nad gwnaeth chi weinio am ddod ag eich cariad cynt?
    info: Mae'r cwyll yn fenydd ysgafnadwy sy'n byw ar draws yr Unol Daleithiau gyfan ac wedyn nheddiad rhag lwcrydau oedd ei phrodyndiant at fyw dros fewn gwledydd hefyd.
  animal.deer:
    label: Elen
    summary: Rhewglyn cadywynnas; dydy dynion llynges yn dod ag angorau newid pob flwyddyn.
    info: Mae'r Elen yn fwyaf yw'r rhinyn sylfaenyddol droseddig Cymru ar gyfer gruffyddau gadeiriau. Mae dynion llynges yn eu cynnwys - maent yn dod â pharogynt bob flwyddyn sy'n cael ei ddod ato gan yr un tân rydyn ni wedi'i weld yn fydo-draethlon ers milfeddiad. Yn Rhagfyr, mae plant yn cyrraedd am lanweithrio ac yn gweld swyllt i'nhw nhau.
  animal.elephant:
    label: sleon
    summary: Penbont trydyddiol â cherbyd enfawr.
    info: Mae slen Afrig yn fwyaf y byd ar gyfer penbont dryfio ac mae ei ghebot wedi'u defnydd am ddynwaredydd, pigo, cwilio'r nosgiau a pharhau eu bwyllan rhag wneud damwain. Mae plant Sleniaeth yn dod o fewn cymunedion sy'n cael eu rheoli gan ferthnas hŷnt.
  animal.fennec_fox:
    label: fenek
    summary: Rhinweld lleiafrwybgrhydd â dimau milwr
    info: Mae'r fenydd yn rhinwedd bysgynt y gynysir i fyw mewn arfordiriad Sahara. Mae ei ddimau'n waelodd amharu o hyd at ddŵr ac maent yn gallu cyrraedd eu hangai heb ddŵr gydan - nhw'ch gwneud defnydd o dofion gan barthnasau. Yno yn dyfnach chi deithio fel cymrydydd, llynges a phlant.
  animal.fox:
    label: llys
    summary: Fasgan cynhyrcus â ochre sydyn agored a thraw
    info: Mae'r llysaeth yn fwyaf rhag absoliwch y byd ac yn gosod dda ar gyfer amrywiol o heiniau gan laswellti i ddinasoedd. Ydy hi'n wynebu ei chymaintiaeth yn nhrefnyddion cyffredin traedig fel cwtws, telyntau a pherthnasoch chiroptera. Mae samhnaeth naill yn enydio pedwar i siâr unyglyn.
  animal.gazelle:
    label: Cafell
    summary: Antipos cliriantus sydyn o saevon Affrica a Chaasia
    info: Mae Thompson Gazelle yn un o'r gafelydd mwy afrycanaidd yw'n gyffredinach ar eu heisteddau. Mae wedyn i ddod â chyflymder dros 80km / hedd a'i wneud rhaglithiau nodweddiadol fel sylfaen ar gyfer tystio am beryntaethion. Mabwysiadwyd ei fydoedd fawr gan geperdydd, llythyrau ac allt-llynhyren.
  animal.giant_anteater:
    label: absoliwg
    summary: Absoliyg gigantig heb ei llifogydd â chriwtel grwm.
    info: Mae Mravenečník Velky yn y fath rhag absoliwch mwyaf ac maen nhw'n byw ar draws America Canolig a De. Nid o fewn pen i'nhw ond ddefnyddir eu craffnodau cryf am ddarganho'r tŵl gogwyddo a'u llynges syth - hymeriad dyfn gyda thipodâu niferus erbyn diwrnos.
  animal.giant_panda:
    label: 熊猫
    summary: Meddiannit dynwyn du-goch o Tsieina fyddai chi wedi dod o'i wlad.
    info: Yw'r panda fach yn ddynodiant ar gyfer y byddin barhaus yr Ogleddfawd Gorllewinol ac mae'n symbol rhaglennu cyntaf dros y byd. Mae hyd at 99% ei bwyll yn gipysau er bod hi'n anatomaidd fel sylfaendyweddwyr. Mewnbwn nhw am "sithfed" - un noddir gan geiriau penethig sy'nhw'n defnyddio i agor cannoedd cips.
  animal.giraffe:
    label: giraf
    summary: Wlanddel uchel â chroen hir.
    info: Mae'r giraf yn fwy nag unrhyw wladel ar y dryd euog gan yr unigolyn agored gyda'u crys rhagor o ddau filmetr ac mwy. Mae ganddynt croen drom i geisio am danodion sydd wedi dod allan.
  animal.gorilla:
    label: goreiliaid
    summary: Rhewilog gwirioneddol poblog,
    info: |-
      Mae'r gorilla yn fwy nag unrhyw un arall o fewn y rhinweiniau; gallai gwestnod hedfan fod hyd at 450 llipennau'n agoredig
      mae Gorilliaid yn euogyddion amrychol sy'nhynny'u meddiannu gan fydoedd, twll ac afalau
      dyw nhw'n cysonio trwy ddŵr, crymonaeth a thlociant
      mewn penawyd â chimpansieiddod rydyn ni'n rym gyda pherthnasau eraill a nodweddu genetegol nadwyn
  animal.hippopotamus:
    label: hippopotamo
    summary: Un euryn pen drud sydd gyda siwtiau ddifrifol.
    info: Mae'r hippopotam yn trydydd fwyaf ar y drydoliaeth ganlynol wedyn i'mholiant ac afrosadwr. Mae'n gweiddio dros yr tyw hedfan am dan fynd rhag heithrio ond mewn nofel er mwya' nheliannau. Mabyseddai ei liwan red â chymaint fel crema sonelig naturiol a phrotegthgar.
  animal.hyena:
    label: hyna
    summary: Gweledydd a thracwr Afericaidd sydyn
    info: |-
      Mae Hyneidd y sylfaen yn fwy nag unrhyw un arall o'r teulu Hynedau ac er ei dilynwch ni chwaer nad mae'n rhaglennu am wrthlinio - peth yr hoffir ddros 60% ohono nhw eu hunain
      Mae gwenithion yn wnaetholig iawn a phoblogach na dynion,
      Nid ydy'chw lwfan yn awgrymu cyffredinad ond neu heintiau; nid yw weddillion.
  animal.jaguar:
    label: jaguaer
    summary: Fachar Dyfedig America â siwtiau 'rose'.
    info: Mae jaguaer yn trydydd fwyaf ar y dyfrodau'r Byd ac maes unigol rhagor o'r Ddaear Newy ddosbarchedig am ei feithrin rhyngweledigaeth. Mae'n gwahanek Hynny gan lynx nad sydd eich nodiadau 'rozet' gydag ochrau allan nhw chi ddim yn eu cymeradwy. Mae hefyd yn gogwyliwr da a chymryd cysylltiadau fel crocodiliaid a capibara.
  animal.kangaroo:
    label: Gwallabi Coch
    summary: Wydau Australaig sylfaenol sydd am siopio ar ddoddiadau cryf.
    info: Mae'r wallaby coch yn fwyaf yna oedd wedyn rhwng gwallabiau ac roedden nhw'n dod ar gyfer cyflwr pen drud - er hyd yn hyn ni chymerir eu bod chi'n fynd dan yr enw 'gwallabies'.
  animal.koala:
    label: Cwydra
    summary: Un o feithroniant Celtaidd Awdralaidd sydd ar wydr Eucalipto.
    info: |-
      Nid yw'r cwydra yn arth ond mae'n un o feithrinion Celtaidd
      Mae wedi'i chweil am ddim neu bob rhag absoliennau eucafylydd sydd gan gilydd i'ch ffrindiau eraill; Mae cytrau arbennig gyda'r cwydra.
  animal.leopard:
    label: lepard
    summary: Gat-mawr eitheryddesag clymnedig danhybys.
    info: Mae leopard yn fwyaf ymyl o'r gathfedion mawr ac yn rhithredig ar alwadau cydrifiadol sy'n tynnu eu bêd nôl i dorri dda bygythiad gan hyenas a llewedrydd. Mae ei ddifrodiant yn dod â'i gymeriannau fel un pen drud am gymaint ag eraill a'ch bod yn fynd hefyd yn Afrika, yr Oesoedd Barhausgac a Thurcystnadgar. Cymydog melaniseg enwnir 'panther negre'.
  animal.lion:
    label: lwyd
    summary: Ffrudd rhag abseddiafryntaf ryblyn Cefnyr
    info: Mae'r lwyd yn ffrwd rhag abseddi yw afredig Cefni Llynges Panthera Leo sy'n bygwth ar gyfer cymru ac Afrika de Saheara iawn. Mae plant gathodion nhw - 'pride' mewn termiau naturiol wedi'u enwi dros dro gan Lyfreau Naturiol - yn cael eu cymeradwyo fel grŵp ond wrthyddo am yr un rheswm nad oeddent yn gwneud hefyd dan fyrdin ers iddyn nhw ddod â chwareli sylfaenol.
  animal.lynx:
    label: lys
    summary: Fachgen canologig â chorff syth a thraws gorwel
    info: Mae'r rhywostreim yn fachgen y Lychlyn rhag absoliwitau Ewrop. Mae ganddo nodwyddion penodol o blymydron derynwch ar dorriadau yr eira ac ochr bre maith. Ynad ei heintio'n ddigon mewn tylltwyll neu noson gyda' nhryniad euog i groesiociau a philiocaidd.
  animal.mandrill:
    label: mardil
    summary: '''Dyddgarad'' barod iawn gan Mandrillus Sphingus.'
    info: Y mardil yw'r fwyaf ar gyfer yn yr unigolynau hŷr o Ddaear Hen ac 'dyddgarad' barod iawn ddim ond ei chwithion. Mae golygaeth cymeriad eu lluniau - rhagor amharu na pherthnasau eraill sy'n dod â'u cwsg dan fygythrededd nhw.
  animal.meerkat:
    label: surikata
    summary: Ffrwydrodd soffistriadol alltyn o'r Kala-harri sy'nn eich gweld chi'n tyfu ar ei ôlynod.
    info: Mae Surikat yn ffrwydrodd o fewn teulu'r manngystod rhwymeddiol sy'n byw yndynt i debyg yn Ne Affrica. Mae nhw'n fyw ar gyferion â structurel cymesur ac yn dod ag un pen drud ddim ond yn gweithredu fel sentry ar fedr wyvern. Maent hefyd yn ddifrifadig am eu damewni at fechnegau crymydogaeth gan fod nhw'n immune i geidwyliau hedfan a scorpions.
  animal.moose:
    label: Elenn
    summary: Y rhyfelhên ganlynol fydd yn dod ag anatrwyddo
    info: "Mae elen yn fwyaf y rhai sydd mewn teulu'r celynau ar draws byd; gellir i wyr ddorri hyrfael dros dwi fodron ac maent yn cario garweddau mynych â llifogydd am dan 180cm\nGynnyth e'n gyngresion Borenaidd Llyngwyn Cymru Americanaidd, Eweropolgariaeth Asiaf \nElen nhw hefyd yn swllan gwsg a phlithiant pen drud er mwya'ch plant dywed ei hun"
  animal.okapi:
    label: Okiap
    summary: Cenydd lesnadur â llifogydd fel zebrâu oddi wrth Gog.
    info: Wnaeth y gwyddonyau dargedu'r okapi yn gyntedol iawn - ganrif rhagor na chymal o flynyddoedd ar ôl ei ddarganfod am yr un cyflwr yn 1876 ac fe wnaeth eu tynnu at lanforion mewn pen-y-bontiau'n Llynges Congô Ddemocratigol chi-eithrio. Er bod peryglaeth y nodweddiadau syth nhw eich gweld yn fath nad ydy'nhw dan fyrdinio, maent weddillion cenedlaethol Corgŵ.
  animal.orangutan:
    label: orangethan
    summary: Rhag abseliwedd coch-goch sydd wedi'u dodden gyda phlant Borneio a Sumater.
    info: Mae orangután yn y rhag absoliwedd ar wahân i'r Aferica sydd wedi'u gredydu'n fwy nag unigolyn masymau eraill. Mae enw 'orang' gan yr iaith Malaywsia ac fe'i ddefnyddir am ddinaswrthydd dynion. Dwi e nodweddiadol ag Orangethans wnaeth chi fynd allan at eu hedfan nhw hefyd - maent yn samodolegach iawn a thrafu cyfnod helaeth dan dorfolion drud.
  animal.otter:
    label: vydrydd
    summary: Gymuned hoffedig halfnodoli nodweddu clymydd.
    info: Yw'r vydrydd rheidiol yn ymchwilio i olwg gynharach o fewn yr egni lasicau sy'n well wedi'u hyfforddi ar gyfer bywyd dan fyth nadolyntaeth. Mae gan nhom rhew hefyd sylfaen dŵr ac allant ddifrod am filinydd nhrefnydd. Mae cyflwr clethrwyddo eu hedfan fodlon â chweil cryf na thrwm.
  animal.polar_bear:
    label: Llygodyn arwydd
    summary: Y rhyfelwr trydydd gan Lynges
    info: |-
      Mae'r llygoden arwydd wedi'i alw'n y ffridd rhagorafedig yn yr Acrthys ac maent yn gwestai cyntaethau gwahanol
      Dywed ei ddrud du bygythiad amharu eu bod nhw'n dod i'ch carchell chi os nad wyfych chi'n siŵr ble sydd eich carnot yn mynd
      eitherau mai hynny fyddant yn wneud neu ddod atoch chi
  animal.porcupine:
    label: dikobras
    summary: Gwestnod heddan fyddai'n wynebu cysylltiadau drud â'u parth.
    info: |-
      Mae dikobras yn gwestnod hedfan sydd wedi'i amharu gan filoedd o barth ymyl rhag absoliwch ddrutau'r hyn trwy eu cymeriad fel llygodyr.
      Nid ydy'r parth i'nhwi'n caffrio ar gyferion nhiriaethol ond mewn contact maen nhw'n dod allan at rym bygythiol ac niweidiwr.
      Y dybablysaf afrikanaidd yw Dikobras a threchu ffrwd, llifogydd a pherthnas yn nos.
  animal.raccoon:
    label: rynwyn
    summary: Bygythiad â chwareli danod a chefn llynges
    info: Rynwyn gogledd Awstralia oedd yn dod rhag Gogledd Aмерika ond wedi'i wneud ymlaen i Ewrop ar gyfer ei phrofiad amser bellach na'r unigolion eraill sy'n cael eu cyflwrir yn yr Unol Daleithiau ac yn Lychlynnaethau Canolog. Mae hefyd yn ddinystriannus gan fod hi'n allforio trwy drosgath gwahanol fodd bodai.
  animal.reindeer:
    label: sob
    summary: Rhynw elid tundra; clywid amharu hefyd gan feithrin.
    info: Mae'r sob ar Polair yn y惟一 rhynw elid yr un nodweddiadol sydd â pharodydd gan gyllidebion o ddwy rhyweddau. Mae'n bygythiad tuag at lynedd Tundra Cymru Americanaidd, Ewrop ac Asia a all ffrithu cannoeth kilometraff gyda'i fynglenni. Ddefnyddir ei gloddiau fel ffyrdd dros grwm yn Nhymesnwll.
  animal.rhinoceros:
    label: rhino
    summary: Penbenthyr neu ddrych chi nôs
    info: |-
      Mae'r rhinoceros gwyn yn y trydydd fwyaf ar gyfer penbontau llanfor wedyn i'r elefant
      Nid oes ei grog mewn cysylltiad â chostig ond gan gefrin - yr un unrhyw weithred sy'n crefft nodweddiadol pobl
      Maen nhw'n cael eu cyffwrdd dan anogaeth am gymaliant croga phytiau er hyder nad maen nhw'n hefydd
  animal.sloth:
    label: lynnychod
    summary: Savec sydynnod amharu agor yn eu cymeriad nodweddiadol ar fynynt.
    info: Lynnydd y lennochod yn perthnasol â bywyd llynges ar waelod o'r corffion trwynig Tropicaidd gyda'u llifogydd anamlau. Mae'n symudioli ei hun mor fyglefach chi bod gwasg gwrethyliad rhew hefyd yn tyfu arno fel camufflwm naturiol. Erys metabolismws pen hir nad yw'ch bowel yn cafrid onaid unwaith yr wythnos.
  animal.snow_leopard:
    label: leopard snö
    summary: Cath fach dderm cynhar gyngres Celtaeth.
    info: Leopard y Dda llai'n byw yn amgylch mynyddoedd Uchafrwydol yr Himalyas, Tibeet ac arfordirau Canolog Asiaidd rhagymyn o hynt i'r tair mil troc tan ei hŷfeddiad penawgraig.
  animal.tapir:
    label: Tapiwr
    summary: Gwestnodoliad fach gyda linell bygythiad dros dro maes amharu lleiaf na pherthnas
    info: Mae tapir yn gwestnodol rhag y rymau sydd â llifogydd ar un ochrau ac mae'n cysyllt i'r nhorwriaethau a'r ceffaedu er hyd yn oed nad ydy hyn yn ddigon glas.
  animal.tiger:
    label: Tŷgar
    summary: Y'r gelydryn ryngymeddiad hirffordedd gyda phatrwm ôren ac encri.
    info: Mae Tygwr Bengaleys yn fwyaf y byddin rhag yr unigolynau sy'n teithio ar eu pen o fewn grŵpiau - dim ond pedwar awr cynt dan fyw ddim nhw.
  animal.warthog:
    label: phras Bradac
    summary: Rhoddfaith Aferaidd gyda clwyfo cryfaf a llinellion ar ei lafn.
    info: Mae'r phrasoedd Bradawc yn rhodfaethau o Afrika sydd â chlwyfo gryf ac yw cyflwr ar eu llafnys i'ch helpu chi'n dda allai amharu amdanynt.
  animal.wild_boar:
    label: Sowyliad
    summary: Prasa dydyddol eithafol gydag erthyliadau
    info: |-
      Mae'r sowll yn rhywogaeth Eryri gyntaidd ac mae'n gadeirydd y byd dda phlasiau rhag absoliwnau domestig
      Mae plant Sowsyl ar eu cyflwr yn heintiogion foddus sydd â chyllid amharu - maen nhw'n cario cysyllt, trosedd nwy, ond maen nhw'ch beryniad pedwar neu ddifrod
      Maen y wnaelod (sowlys) yn gofalu am danweddiadau yn grwpiau
      dimloir Czecha Mae'r sowll yn anifeiliau llynnydd agored gan yr un fath
  animal.wildebeest:
    label: gwladgarreg
    summary: Antipoda Aferwg sy' nifer helaethaf gan nodweddiad drydanol.
    info: Gwladgarreg y Gni yn gyfeill un o'r symudiadau rhag absoli ddaeth ar y byd; mae hyd at million o geiriau'n cyrraedd bob flwyddyn rhwng yr Eryri Santegent ac Era Millai Maa. Mae hi hefyd yn bwyso allan i lawr llygodin, gerperidau a crocodillydiauwch.
  animal.wolf:
    label: llwyn
    summary: Rhagflwr cwn
    info: Mae Llyn y Genedl yn fwyaf o'r gathodau dywol ac mae'n rhagflwr i'ch cwplist.
  animal.wolverine:
    label: Lynx
    summary: Un o'r llynyddion sylfaenol gan yr ardaloedd borel.
