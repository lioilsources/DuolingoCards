lang: ko
pivot: false
title: 야생 동물
cards:
  animal.aardvark:
    label: 하이브니시
    summary: 야간에 사냥하는 아프리카 곤충 포식자로 쥬크 형태를 지닌 터널 파는 동물.
    info: 하이브니시는 튜불리덴타목의 유일한 생존 종이며 가까운 친척을 가지고 있지 않습니다. 야행성 활동 방식과 강력한 발톱 그리고 점성이 있는 혀는 벌레와螱집 잡기 위한 적응입니다. 그가 버린 굴은 수십 개 이상의 동물종들이 사용합니다.
  animal.armadillo:
    label: 팔소벡
    summary: 척추가 있는 작은 포유류.
    info: 팔소벡 네이버 뉴멘신터스는 진짜 척추를 가진 유일한 포유동물입니다. 일부 종은 위협을 받으면 구슬처럼 말아집니다. 훌륭한 파토끼이며 두 분 미만의 시간 안에 군사를 팔 수 있습니다. 이 동물은 황열균 감염원으로 알려져 있습니다.
  animal.baboon:
    label: 바비언
    summary: 특징적인 코 모양과 사회적 생활을 가진 대형 아프리카 원숭이
    info: 바비온은 아프리카 사바나와 바위 지역에 서식하는 큰 영장류의 종입니다. 계급 구조가 있는 무리를 이루며 풍부한 소리와 표정으로 의사소통합니다. 수컷이 암컷보다 눈에 띄게 큽니다. 이들은 옴니버스이며 고대 에티오피아에서는 신성동물로 숭배받았습니다.
  animal.bear:
    label: ' медведь '
    summary: 털 많은 강력한 씩씩함의 자연 본능을 대표하는 전천후 고기 사냥꾼
    info: 검은곰(사자)는 유럽과 아시아에서 발견되는 최대의 육상 포유동물로 무게가 약 700kg에 달한다. 이 동물은 어류와 열매, 꿀 그리고 작은 포식자를 먹으며 온통잡이 식성을 가진다. 겨울에는 잠복 상태인 '겨울잠'을 들어 그 기간 중암컷들은 새끼를 낳는다. 체코에서는 힘과 안정감의 상징으로 여겨지기도 한다.
  animal.beaver:
    label: 비버
    summary: 습윤 생태계를 만드는 대형 갈라파소.
    info: 유럽 비버는 세계에서 두 번째로 큰 포식자입니다. 가지와 진흙으로 댐을 건설하여 연못과 습지를 만들고 이곳은 다양한 동물들의 서식지가 됩니다. 평평하고 철갑 같은 꼬리에 커다란 주황색 어금니를 가지고 있으며 물기를 흡수하지 않는 모피도 보유합니다. 예로부터 체코에서는 멸종되었지만 지난 수십 년간 다시 돌아왔습니다.
  animal.bison:
    label: 비존
    summary: 북미의 터이 잘 낀 먹鬃기 있는 큰 소과동물
    info: 아메리카 бизون은 북미에서 가장 무거운 육상 동물이다. 18세기에 거의 멸종 직전까지 갔으며 추정 약 3천만~6천만 마리 중 단지 천마리를 남겼다. 보호 프로그램 덕분에 수치가 회복되어 현재는 대략 5백만 마리 정도 된다.
  animal.buffalo:
    label: 아프리카 버펄로
    summary: '''빅파이브(Big Five)''에 속하는 대형 아프리카 소종으로서 큰 냉무대(군체) 형태로 생활한다.'
    info: 아프리카 불은 아프리카에서 가장 위험한 포유동물 중 하나이며 '빅 파이브'의 일부이다. 수백 마리에서 천마리를 넘는 무리는 공동 방어를 통해 사자까지 쫓을 수 있다. 군집 밖에 있는 나이 든 암컷들은 특히 예측할 수 없고 공격적이라는 특징이 있다.
  animal.camel:
    label: 낙타
    summary: 사막에서 살아가는 흔히 볼 수 있는 단혹 또는 쌍혹 포유류.
    info: 단가리 낙타는 사막 생활에 완벽하게 적응한 동물로, 등의 혹은 에너지 저장을 위한 지방이 아니라 기름으로 이루어져 있다. 한 번에 물만 100 리터 이상 마실 수 있으며 액체 없이는 몇 주를 버틸 수도 있다. 이동수단으로 사용되기 시작된 것은 이미 3천 년 전이고, 오늘날까지도 중요한 교통수단이다.
  animal.capybara:
    label: kapipara
    summary: 전 세계적으로 존재하며 수중 활동이 가능한 아주 조용하고 안정된 설치류이다
    info: '{"hint":"세계에서 가장 큰 설치류이며 반수생(Hydrochoerus hydrochaeris)입니다","info":"카피바라(kapibara)는 현재 생존하는 최대의 구멍치기 동물로 성체 개개인은 무게가 약 35kg부터 66kg까지 나갑니다\. 이들은 남미 열대 지방 강변\, 호숫가 및 습지에 서식합니다\. 카비파라는 매우 사회적인 특성을 가지고 있으며 평온한 기질 덕분으로 거의 모든 다른 종들과 잘 어울립니다\. 소셜 미디어에서는 편안함을 상징화시키며 아이콘처럼 인기를 끌고 있습니다"}'
  animal.cheetah:
    label: 기퍼드
    summary: 육지에서 최대시속 110킬로미터 이상으로 주행하는 세계최빠름
    info: 기퍼드는 육상 동물 중 가장 빠른 속도를 자랑하며, 세 초 만에 시속 100km까지 가속할 수 있습니다. 다른 큰 고양이들과 달리 기퍼드는 멱살을 낼 수 없고 대신 소리를 내며 경계합니다. 그의 마르디 몸과 늘어뜨릴 수 없는 발톱은 힘이 아닌 속도를 위한 적응입니다. 짧게 전력 질주한 후에는 식기를 위해 쉴 필요가 있습니다.
  animal.chimpanzee:
    label: 침팬즈
    summary: 인간과 가장 밀접한 관계를 맺고 있는 지능형 영장류입니다.
    info: 보편적인 침팬지(chimpanzee)는 바오노와 함께 인간의 가장 가까운 동물적 관련종이며 우리는 약 98.7%의 유전자를 공유합니다. 침팬지는 도구 사용이 가능하며 예를 들어 벌레 사냥에 나뭇가지를 이용하고 수화 언어 기초도 배울 수 있습니다.
  animal.coyote:
    label: 코요테
    summary: 도심 환경에도 생존할 수 있도록 적응된 북미의 고양이
    info: |-
      {"hint":"중형 북아메리카 개과 동물(Canis latrans)","info":"코요테는 전체 북미 지역에 서식하는 적응력 있는 포유동물입니다.
      volf와 달리 사람 주변에서도 잘 살아남았으며 도시로까지 퍼졌습니다.
      averican 인디언 신화에서는 교활한 장난감으로 여겨집니다.
      call을 이용해 소통하며 특히 해질녘이나 밤 시간대에 자주 울어댑니다."}
  animal.deer:
    label: forest deer
    summary: 아름답게 생긴 발굽 짐승으로, 남성 개체가 연간 교환하는 송곳니를 갖춤.
    info: 숲사슴은 유럽에서 가장 퍼져 있는 큰 사슴이다. 수컷인 숲사는 매년 떨어뜨리고 다시 자라나는 송곳니를 지닌다. 이들은 동물계 중에서도 성장이 매우 빠른 조직을 가지고 있다. 가을철에는 암수(암사슴들)와 경쟁하기 위해 싸우며 강한 소리를 낸다.
  animal.elephant:
    label: 코끼리
    summary: 가장 큰 육상 포유동물로, 코와 큰 귀를 가지고 있습니다.
    info: 아프리카 코끼리는 지구상에서 가장 큰 육상 포유동물입니다. 코를 숨 쉬고, 마시고, 냄새 맡고, 음식을 집는 데 사용합니다. 코끼리는 가장 나이 많은 암컷이 이끄는 무리에서 살아가며, 기억력이 뛰어납니다.
  animal.fennec_fox:
    label: 페네크
    summary: 거대한 귀가 있는 세상 최소 크기의 개과 약탈자.
    info: 페네크는 사하라 사막의 생활에 적응한 세계에서 가장 작은 개과 포유동물입니다. 거대한 귀로 체온을 방출하고 탁월한 듣기 능력을 갖추고 있습니다. 매우 효율적인 신장 덕분으로 직접 물을 섭취하지 않고도 살아남으며 수분은 음식물을 통해 얻습니다. 밤에는 과일벌레와 설치류 그리고 파충类를 사냥합니다.
  animal.fox:
    label: 여우
    summary: 털이 짙은 꼬리를 지닌 갈색 털 소형 개족 육아동물.
    info: 여우는 숲과 스텝지대 그리고 도시에서 사냥하는 세계 최다 분포된 포유류이며 뛰어난 적응력을 가진 동물입니다. 전 세계의 이야기와 속담에서는 그들의 영리함으로 유명합니다. 여우들은 쥐나 새, 곤충을 사냥하며 필요할 경우 평범한 음식물을 먹기도 합니다.
  animal.gazelle:
    label: 가젤
    summary: 아프리카와 아시아 초원에 서식하는 슬림하고 빠른 반추동물.
    info: |-
      톰슨 가젤은 아프리카에서 가장 흔한 가젤 중 하나입니다.
      시속 80킬로미터 이상의 속도를 낼 수 있으며 포식자에게 경고하기 위해 특징적인 점프 동작을 합니다.
      거대한 무리를 이루며 생활하며 코薮豹과 사자의 주요 먹이가 됩니다.
  animal.giant_anteater:
    label: 크게임
    summary: 긴 코와 끈적끈적한 혀를 가진 커다란 무치 포유동물.
    info: 큰개미핥기는 개미핥기 중 가장 큰 종으로서 중앙아메리카와 남아메리카에 서식합니다. 이 동물은 치가 없으며 강한 발톱을 사용하여 벌레집을 파괴하고 최대 60cm 길이의 점액질 혀로 곤충들을 집어냅니다.
  animal.giant_panda:
    label: 판다고
    summary: 중국 삶아래쪽으로 생긴 하얗고 검은곰이다.
    info: '{"hint":"검은색과 흰색의 중국 곰(Ailuropoda melanoleuca)","info":"대형 판다는 서남부 중국에만 분포하며 전 세계 자연 보호를 상징하는 대표적인 동물입니다\.\n전체 식단 중 약 99%는 떡갈나무로 구성되어 있으며 해골학적으로 윤식성인 존재임을 알 수 있습니다\.\n떡갈나무 줄기를 잡기 위해 손가락처럼 사용되는 제6지(팔목뼈)라는 특이한 구조물을 가지고 있습니다\.\n세상에서 야생 상태의 대형 판다 개수는 약 천 팔백 마리 정도뿐 입니다","label":"판다가","summary":"중국산 검정하얀 색상을 가진 나무딸랑이 먹이로 사냥합니다."}'
  animal.giraffe:
    label: 기린
    summary: 매우 긴 목을 가진 세계에서 가장 높은 육상 동물입니다.
    info: 기린은 세계에서 가장 높은 육상 동물이며, 수컷의 키는 5미터 이상입니다. 긴 목은 아카시아 나무의 잎을 먹기 위해 필요하며, 이는 주요 음식입니다.
  animal.gorilla:
    label: горилла
    summary: 세상에서 가장 크며 열대 아프리카 지역 출신 대형 원숭이
    info: 고릴라는 가장 큰 영장류이며 성인 수컷(은등 고릴라)의 무게는 최대 약 200kg에 달한다. 주로 식물성 음식을 먹으며 잎과 줄기 그리고 과일 등을 섭취한다. 소리와 표정 뿐만 아니라 가슴 두드리기를 통해 의사소통하며 인간 외에도 친족 관계가 가장 밀접한 동물 중 하나이다. 셰미판지와 함께 우리는 그들과 거의 모든 유전자를 공유하고 있으며 이들은 우리에게서 분화되기 전까지 우리의 조상이었다.
  animal.hippopotamus:
    label: 흑마
    summary: 아프리카에 서식하는 거대한 반수륙성 포유류.
    info: 하이포포타무스 아مف비우스는 코끼리와 기린 다음으로 큰 육상 포유동물이다. 하루 종일 물속에서 쉬어 과열로부터 보호받고 밤에는 땅 위로 나가서 먹이를 찾는다. 피부에서는 자연적인 자외선 차단제 및 항생제 역할을 하는 붉은색 액체가 분비된다. 외형과 달리 흑마의 경우 매우 치명적이고 므르른 동작도 가능하다.
  animal.hyena:
    label: 히iena
    summary: 아프리카 초원 지역의 반점을 가진 포경동물 및 부패육 섭취 동물.
    info: 반점하이에나는 하이에นา과에서 가장 큰 종이며 소문에도 불구하고 주로 썩은 고기만 먹지 않고 실제로 약 60%의 음식을 스스로 사냥합니다.암컷들은 수컷보다 지배적이며 더 큽니다. 그녀가 웃음소리를 내면 사실 그것은 흥분이나 두려움으로 인한 것이고 기쁨 표현이 아닙니다.
  animal.jaguar:
    label: ' Jaguars'
    summary: 가장 크고 로제타 무늬를 가진 미국 고양잇과 동물.
    info: |-
      자이언트는 세계에서 세 번째로 큰 고양잇과 포유동물이며 유일한 두 아메리카 대륙의 커다란 고양이다.
      레오팍드와 달리 그 루비 메아리는 작은 점들이 내부에 있다.
      뛰어난 수영 및 어업 능력을 가지고 있으며 물고기뿐만 아니라 악어나 카피바라도 사냥한다.
      마야족이나 아즈텍 문화에서는 힘 그리고 왕권을 상징하는 신성한 존재였다.
  animal.kangaroo:
    label: ' kangaroo'
    summary: 강력한 다리를 이용해 절름발이나서 이동하는 큰 호주 포유류.
    info: 붉은 캥거루는 세계에서 가장 높이 점프할 수 있는 동물이며 최대 약 아홉 미터까지 멀리 도약한다.암컷 붉은 캥거루는 배에 달린 주머니 안에서 새끼를 대략 여섯 개월간 키운다. Kangaroo(캥거루)는 오스트레일리아의 상징적인 생물을 나타내며 국가 문장에도 그려져 있다.
  animal.koala:
    label: 코알라
    summary: 호주에서 사냥하는 코아 라 불리는 나무 위를 삶은 유대류
    info: 코알라는 곰이 아니라 유대류입니다. 대부분의 동물에게 독성이 있는 이발리пт 나무 잎을 거의 오로지 먹으며 소화 시스템도 특별합니다. 이 발리프트는 영양가가 낮기 때문에 하루에 최대 22시간까지 자고 있습니다.
  animal.leopard:
    label: 표범
    summary: 털 무늬가 있는 커다란 고양이 포유류로서 우수한 등반 능력을 가진 존재입니다.
    info: "\U0001F406 표범은 가장 넓게 분포된 큰 고양이로, 예외적으로 나무를 오르며 사냥한 먹잇감을 가지에 올려 하이에나와 호랑이로부터 보호합니다. 다른 대형 야생고양이보다 적응력이 뛰어난 동물이며 아프리카 및 근동과 원동 지역에서 서식하고 있습니다. 멜라니즘 형태는 '검정 페럿'으로 알려져 있죠."
  animal.lion:
    label: 사자
    summary: 아프리카 사바나에서 사는 큰 고양이입니다.
    info: 사자는 주로 사하라 이남의 아프리카 사바나에서 사는 큰 고양이입니다. 무리를 이루며 살아가며, 이 무리는 '프라이드(pride)'라고 불립니다. 암컷들은 함께 사냥을 하고, 수컷의 눈에 띄는 수염은 경쟁자를 겁내게 합니다. 사자는 종종 '동물의 왕'으로 불립니다.
  animal.lynx:
    label: '"lynx"'
    summary: '"귀 뒷면에 퍽 모양의 푯말 같은 턱수염이 달린 중형 야생 고양이."'
    info: '{"hint":"털이 난 귀가 있는 중간 크기의 야생 고양이(Lynx lynx)","info":"猞猁는 유럽에서 가장 큰 야생 고양이다.\n귀 끝과 짧은 꼬리에 검정색 털 덩어리를 가진 특징으로 구별할 수 있다.\n주로 해질 녘이나 밤 동안 사냥을 하며 주된 먹이는 산사자와 송곳니다.\n체코에서는 멸종되었으나 20세기에 후반 성공적으로 재도입되었다."}'
  animal.mandrill:
    label: MANDRILL
    summary: 파란색과 붉은색으로 된 얼굴을 가지고 있는 세상에서 제일 다채롭게 보이는 영장류
    info: 만드릴은 옛세계에서 사는 가장 큰 생존 원숭이이며 세계 최고로 화려한 색을 지닌 영장류입니다. 수컷들은 사회적 계급과 신호를 보내기 위해 눈부신 파랑색과 빨강 얼굴 마스크가 있습니다. 캐메룬, 가봉 및 공화국콩의 열대 우림 지역에 무리를 이루어 삽니다.
  animal.meerkat:
    label: 서리카타
    summary: 칼라하리 사막 지역에 서식하면서 두 발로 선 소형 집단적 포유동물.
    info: 서리카타는 남아프리카에 서식하는 개코부과의 작은 포유동물입니다. 고정된 사회 구조를 가진 무리를 형성하며 생활하고 있으며, 무리 중 한 마리는 항상 높은 곳에서 경계합니다. 이 동물들은 파충류 독소와 거미독에도 면역이 있습니다. 또한 서로 사냥 기술을 배우기도 합니다.
  animal.moose:
    label: 러시
    summary: 송곳이나 형태를 한 세상에서 제일 커다란 포유동물
    info: 루스는 세계에서 가장 큰 사슴과 동물이며 수컷은 어깨 높이가 두 미터 이상으로 자라며 최대 약 180cm의 낙엽 모양 송곳을 가진다.
  animal.okapi:
    label: 오카피
    summary: 콩코 숲 속 줄무늬 다리를 띤 기린 관련 종.
    info: 오카피는 1901년에야 과학적으로 기록되었으며, 인류가 발견한 마지막 주요 포유동물 중 하나입니다. 시각상으로 여우와 조랑말의 교배종처럼 보이지만 실제로는 가장 가까운 생존하는 친척을 지닌 기린과 동일합니다. 오직 콩고 민주공화국 열대 우림에서만 서식하며 이 지역 국가 상징기도 합니다.
  animal.orangutan:
    label: 오랑 우탄
    summary: 부르네이와 수마트라 숲속에 서식하는 붉은 갈색 머리를 가진 커다란 원숭이다.
    info: 오랑우탄은 아프리카를 제외하고 사는 유일한 큰 영장류입니다. 이름은 말레이어에서 온 것으로 '숲 속의 인간'을 의미합니다. 가장 고독적인 대형 원숭이로 나무 꼭대기 생활 대부분을 보내며 어미가 새끼에게 최대 여덟 년간 돌보아 줘서 다른 포유동물 중 사람 다음으로 오래 키웁니다.
  animal.otter:
    label: 여우
    summary: 깨끗한 하천 근처에서 사냥하며 놀이는 반각반육성 포유동물.
    info: 강 여우는 물에서의 삶에 완벽하게 적응한 개울가족 포유류입니다. 두꺼운 방수 퍼와 수영을 위한 날개 모양 발蹼 그리고 약 한 분 동안 숨을 참아낼 수 있는 능력을 가지고 있습니다. 강 여우들은 깨끗한 물질 상태를 나타내며 그들이 서식하는 곳은 건강한 환경이 됩니다. 체코에서는 오랜 기간 줄어들었으나 최근 다시 점차 증가하고 있습니다.
  animal.polar_bear:
    label: 빙판 곶감
    summary: 아르ctic지역에서 살아가는 육상 상위 포식자 중 가장 크다.
    info: 북극곰은 육상에서 가장 큰 포식자이며 북극 지역의 최종 먹이사슬에 있다. 흰색 모피는 열을 완벽하게 보존하며 각각 뿔처럼 비어 있고 반투명하다. 수영 기술도 매우 우수하여数百킬로미터를 수영할 수 있으며 지구 온난화가 그들이 사냥하는 얼음 면적과 종 전체 인구에게 위협으로 작용하고 있다.
  animal.porcupine:
    label: 디코브라즈
    summary: 날카로운 방어용 가시가 있는 커다란 곰팡이
    info: 디코브라즈는 천 개 이상의 날카로운 빈 가시에 의해 보호되는 포유류입니다. 이들은 변형된 털이며 화살처럼 발사되지 않지만 만지면 쉽게 분리되어 숙주에게 박힙니다. 디코바르즈는 아프리카에서 가장 큰 곰팡이 먹방으로서 야간에는 껍질과 뿌리를 비롯한 채소를 찾아다닙니다.
  animal.raccoon:
    label: 놀래기
    summary: 검정색 얼굴과 줄무늬 꽃 모양 꼬리를 가진 미국 출신 포유동물.
    info: 북미 원산지인 북부 놀래기(North American opossum)는 유럽으로 도입되어 오늘날까지 널리 번식했다. 음식을 먹기 전에 마치 씻듯이 하는 행동은 실제로 송곳니의 민감도를 조절하기 위한 것이다. 이 동물은 임의로 식사를 하며 환경 적응력 또한 매우 강해 인구 밀집 지역에서도 살아간다.
  animal.reindeer:
    label: 사빈
    summary: 남녀 모두 뿔을 가진 고기잡이 동물
    info: 북극 지역의 사슴으로 북미, 유럽 및 아시아 툰드라에서 서식하며 수천킬로미터 이동할 수 있다.
  animal.rhinoceros:
    label: носорожец
    summary: 코에 하나 또는 두 개의 뿔을 가진 거대한 초식 동물
    info: 백犀는 코끼리 다음으로 큰 육상 포유동물입니다. 뿔은 골격이 아니라 인간 손톱과 같은 각질로 만들어져 있습니다. 백犀와 다른 기린류들은 약용 효능이라는 오해 때문에 사냥당하며 심각한 멸종 위기에 처했습니다.
  animal.sloth:
    label: 렌토chod
    summary: 트리는 끝 위를 거꾸로 걸으며 이동하는 느린 동물
    info: |-
      Лени호드는 열대 나무 층에서 느리게 생활하도록 완벽하게 적응한 포유동물입니다.
      그의 속도가 너무나 천천히 움직여서 녹색 조류들이 그의 품모양에 자라며 카멜레온 역할을 합니다.
      신진 대사율이 매우 낮아 일주일에 한 번만 배설합니다.
      죽은 후에도 매달릴 수 있도록 강력하고 발톱 모양의 발톱들을 가지고 있습니다.
  animal.snow_leopard:
    label: 설산호랑이
    summary: 중부 아시아 고지대를 서식하는 드문 대형 고양잇과 동물이다.
    info: '{"hint":"중앙아시아 산맥의 신비로운 큰 고양이(Panthera uncia)","info":"설산호랑이는 히말라야와 틴체 및 중앙아시아 삼림 지대에서 약 3천 미터부터 5천 미터 높이에 사는 동물입니다\. 특별히 길쭉한 꼬리가 바위 위 균형 유지에 사용됩니다\.(.*?)전 세계적으로 추정치인 최소 4천 마리에서 많게는 6천 5백마리만 남았습니다\. 이들은 전세계에서 가장 덜 연구된 대형 포유류들 가운데 하나입니다","label":"설산호랑이","summary":"중부 아시아 고원 지역의 드문 대형 고양잇과 생태."}'
  animal.tapir:
    label: 타피르
    summary: 짧은 부리를 가진 큰 풀먹이 동물로, 기린과 말에 관련되어 있습니다.
    info: 타피르은 코끼리와 비슷하게 유연한 부리를 사용하여 가지를 잡고 식물을 먹는 초식동물입니다.
  animal.tiger:
    label: 티그르
    summary: 오렌지를 바탕으로 검은색 줄무늬를 가진 세계 최대의 고양잇돌 포유동물
    info: 벵골 호랑이는 가장 큰 야생 고양이입니다. 각 개체는 손가락 지문처럼 유니크한 줄무늬 패턴을 가지고 있습니다. 사자와 달리 벵골호랑이는 혼족이며 훌륭한 수영 실력을 갖추고 있으며, 생존수가 자연 상태에서 네천 마리를 넘지 않아 멸종위기 종으로 분류됩니다.
  animal.warthog:
    label: 뿔멧돼지
    summary: 얼굴에 큰 송곳니와 혹이 있는 아프리카 야생 독수도.
    info: 아프리카에서 사냥되지 않는 야생 멧돼지로 집쥐와 관련이 있다. 수컷은 얼굴에 혹과 휘어진 송곳니가 있어 방어용으로 사용한다. 도망칠 때는 꼬리를 세워서 안테나처럼 움직인다. 굴을 파낼 땐 자신의 힘이 아니라 기존의 쥐구멍을 이용한다.
  animal.wild_boar:
    label: 멧퇘지
    summary: 날카로운 송곳니가 있으며 집에서 기르는 다양한 돼지를 낳았던 와일드한 멧돼지
    info: 멧돼지는 유럽의 원래 종이며 모든 가축 돼지 품종들의 조상입니다. 이들은 지능이 높고 적응력 있는 포식자로 줄기를 파내거나 견과류를 먹으며 작은 동물을 사냥하기도 합니다. 암컷(암멧)은 새끼들을 돌보며 무리를 짓습니다.
  animal.wildebeest:
    label: gnu
    summary: 세계 최대 규모의 육지 상 미igration을 수행하는 아프리카 서식 반추류
    info: gnu는 매년 수백만 마리가 세렌게티와 마사이마라 사이를 이동하며 세계에서 가장 큰 육상 유배 현상을 보인다. 사자, 코아두루 및 악어의 주요 먹이이며 대부분의암컷들이 단 며칠 안에 동시에 새끼를 낳는 독특한 번식 습성을 가지고 있다.
  animal.wolf:
    label: 늑대
    summary: 가정용 개의 조상인 야생 포유동물입니다.
    info: 늑대는 가장 큰 야생 포유동물이자 가정용 개의 조상입니다. 사회적 계급이 있는 무리에서 살아가며, 울음으로 지역을 표시하고 무리를 소집합니다.
  animal.wolverine:
    label: 로소맥
    summary: 방치림 숲과 태erras지대를 생활하는 강하고 격한 여우과 동물
    info: 로소맥은 여우과의 가장 큰 육상 포유동물입니다. 작은 체구에도 불구하고 놀라운 힘과 공격성을 가지고 있으며 곰을 사냥감에서 쫓아낼 수 있습니다. 북미와 유럽 및 아시아 지역에 있는 방위림 숲이나 탄나이 지대 등 널리 분포된 영역에서 서식합니다.
  animal.zebra:
    label: 斑馬
    summary: 검은색과 흰색 줄무늬를 가진 아프리카의 홀가족 포유동물입니다.
    info: 斑馬는 말과 관련된 아프리카의 홀가족 포유동물로, 검은색과 흰색 줄무늬로 쉽게 구별됩니다. 각각의 무늬는 고유하며, 사람의 지문처럼 보입니다. 무리는 포식자로부터 자신을 보호하는 데 도움이 됩니다.
