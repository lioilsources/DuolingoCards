lang: ko
pivot: false
title: 야생 동물
cards:
  animal.elephant:
    label: 코끼리
    summary: 가장 큰 육상 포유동물로, 코와 큰 귀를 가지고 있습니다.
    info: 아프리카 코끼리는 지구상에서 가장 큰 육상 포유동물입니다. 코를 숨 쉬고, 마시고, 냄새 맡고, 음식을 집는 데 사용합니다. 코끼리는 가장 나이 많은 암컷이 이끄는 무리에서 살아가며, 기억력이 뛰어납니다.
  animal.giraffe:
    label: 기린
    summary: 매우 긴 목을 가진 세계에서 가장 높은 육상 동물입니다.
    info: 기린은 세계에서 가장 높은 육상 동물이며, 수컷의 키는 5미터 이상입니다. 긴 목은 아카시아 나무의 잎을 먹기 위해 필요하며, 이는 주요 음식입니다.
  animal.lion:
    label: 사자
    summary: 아프리카 사바나에서 사는 큰 고양이입니다.
    info: 사자는 주로 사하라 이남의 아프리카 사바나에서 사는 큰 고양이입니다. 무리를 이루며 살아가며, 이 무리는 '프라이드(pride)'라고 불립니다. 암컷들은 함께 사냥을 하고, 수컷의 눈에 띄는 수염은 경쟁자를 겁내게 합니다. 사자는 종종 '동물의 왕'으로 불립니다.
  animal.wolf:
    label: 늑대
    summary: 가정용 개의 조상인 야생 포유동물입니다.
    info: 늑대는 가장 큰 야생 포유동물이자 가정용 개의 조상입니다. 사회적 계급이 있는 무리에서 살아가며, 울음으로 지역을 표시하고 무리를 소집합니다.
  animal.zebra:
    label: 斑馬
    summary: 검은색과 흰색 줄무늬를 가진 아프리카의 홀가족 포유동물입니다.
    info: 斑馬는 말과 관련된 아프리카의 홀가족 포유동물로, 검은색과 흰색 줄무늬로 쉽게 구별됩니다. 각각의 무늬는 고유하며, 사람의 지문처럼 보입니다. 무리는 포식자로부터 자신을 보호하는 데 도움이 됩니다.
