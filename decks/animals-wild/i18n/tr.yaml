lang: tr
pivot: false
title: Yaban Hayvanları
cards:
  animal.elephant:
    label: Fil
    summary: En büyük karasal memeli, chobiti ve büyük kulakları ile tanınır.
    info: Afrikalı fil, dünyadaki en büyük karasal memelidir. Chobitini nefes almak, içmek, koklama ve yemeği tutmak için kullanır. Fil, yaşlı dişinin önderliğindeki bir sürüde yaşar ve iyi hafızalarıyla tanınır.
  animal.giraffe:
    label: Geyik
    summary: Çok uzun boylu ve uzun boylu en uzun karasal hayvan.
    info: Geyik, dünyadaki en uzun karasal hayvandır; erkekler beş metreyi aşan yüksekliğe ulaşabilir. Uzun boynu, beslenmesinin ana kaynaklarından olan akasya yapraklarına ulaşmalarını sağlar.
  animal.lion:
    label: Aslan
    summary: Afrika savanlarında yaşayan büyük kedi türü.
    info: Aslan, özellikle Sahara'nın güneyindeki Afrika savanlarında yaşayan büyük kedi türlerindendir. Sürüsüne 'prides' denir; dişiler birlikte avlar, erkeğin dikkat çeken sakalı ise rakipleri korkutmak için kullanılır. Aslan genellikle 'hayvanların kralı' olarak bilinir.
  animal.wolf:
    label: Kurt
    summary: Ev köpeğinin atası olan yabanıl bir psovit memeli.
    info: Köpek (Canis lupus) en büyük yabanıl psovit memeli ve ev köpeğinin atasıdır. Sosyal bir hiyerarşiyle av yapan ve avlayan bir sürüde yaşar. Teritoriyu işaretlemek ve sürüyü toplamak için havlamalarıyla iletişim kurar.
  animal.zebra:
    label: Zebr
    summary: Siyah-beyaz çizgili Afrika köpekboynuzu türü.
    info: Zebr, at ile akraba olan Afrika köpekboynuzu türlerinden biridir. Her bir bireyin çizgileri benzersizdir, bu da insan parmak izine benzer şekilde avcıları kandırmakta kullanılır.
