lang: el
pivot: false
title: Άγρια ζώα
cards:
  animal.aardvark:
    label: Χρυσόκης
    summary: Νυχτερινός βόρειος Αφρικανός εντομοφάγος µε προϊόν προσοµοίωσης.
    info: Το Καπετιάν χρυσόκης είναι το μοναδικό διαβιώνον πλήθος στη γέφυρα από κύμα φωτός λουξεμβουργικού νομίζει και δεν έχει κανέναν κοντινό συγγενή.
  animal.armadillo:
    label: Πάσο
    summary: Μικρό ζωολογικό άτομο με προστασία από όψεις.
    info: Το θηλαστικό με τους πραγματικά χονδρώδεις σπόνυχές είναι αξιοσημείωτο για τη δύναμή του να κοφτεί και να βγάζει λάθος φρύβα σε λιγότερο από δύο λεπτά.
  animal.baboon:
    label: Παβιάν
    summary: Ένας μεγάλος αφρικανικός συμπρωτεΐδης µε χαρακτηριστικό ρινόκερµα και κοινωνικό τρόπο ζωής.
    info: Το παπιόν είναι ένα γένος μεγάλων συμπρωτεϊκών όχθηφαγων του αφρικανικού δάσους και βράχων. Ζουν σε φυλές με ιεραρχική δομή και νοιώνουν πλούσια λεξιλογική και μιμική γλώσσα .Οι αρσενικοί είναι σημαντικά μεγαλύτεροι από τα θηλυκά.
  animal.bear:
    label: Αρκουδος
    summary: Μεγαλύτερο πολυβραχιονικό ζῷο ἀρκῶν
    info: "Το καφέ αρκουδο είναι το μεγαλύτερο ξηράς πολυπόθιμο στην Ευρώπη και την Ασία φτάνοντας βάρος ως 700 kgr\nΕίναι γενική διατροφή και να τρέφεται με ψάρια , λωχούς , μέλι και μικρά θηλιακά \nΠέφτει σε χειμερινόν ύπνον κατά τη διάρκεια του οποίου η ιχθύς γεννά"
  animal.beaver:
    label: '"βίβωπο"'
    summary: '"Μεγάλο ξηροϊδρών σκουριαστό που κατασκευάζει φράγματα και υγρότοπους."'
    info: '{"hint":"μεγάλο σκουριαστό που κατασκευάζει φράγματα (Castor canadensis)","info":"Το βίβωπο είναι το δεύτερο μεγαλύτερο ζώο χέρι ανθρώπου στη Γη\nΚατασκευάζει φράγματα από κλαδιά και λάσπη για να δημιουργήσει λιμνοχώρες και υγρότοπους που εξυπηρετούν πολλά είδη θηλαστικών\. Διαθέτει επίπεδη , ράφινα ουρά , μεγάλα πορτοκαλί δόντια - ψαλίδια και υδατοαπωθητικό μαλλί \nΗ πληθυσμός του βίβωπου εξαφανίστηκε στη Βοημία , αλλά επέστρεψε στις πρόσφατες δεκαετίες ".'
  animal.bison:
    label: '&beta;&#x1f5;'
    summary: '&#x1e7c;&#x3a1;&#x3bf;κ;&#x3bb;&#x3af;&#x3bd;o μ&#x3ad;ϑό,ύ ή ώάξϟστα'
    info: |-
      Το αμερικανικό βίσων είναι το πληθυστές θαλάσσιο όπου στη νότια Δύο δεκαετή μεγάλο και για λίγο φώχεια ; από τις εκτιμήσεις , 48 -70 εκατομμύρια εξαφανίζονται .
      Λόγω της προστασίας τους αριθμός τους αυξήθηκε σε ~ 500.000
      Είναι το σύμβολο του Wild West &amp;amp;&amp;quot;
  animal.buffalo:
    label: Αφρικανό βουβάλι
    summary: Μεγάλο αφρικανικό βοοειδές που ζει σε φυλές - Μέρος των 'Πέντε'.
    info: Το αφρικανό βουβάλι είναι ένας από τους περισσότερο κινδυνημένους σύµβουλους των δασών της Αφρικής και µέρος όσων λέγονται «Οι μεγάλοι πέντε». Ζει σε φυλές που απαρτίζονται από εκατοντάδες ή ακόµα και χιλιάδες γονεϊχά ντροΐα.
  animal.camel:
    label: έμου
    summary: Πανίδα της ερήμου με βουβυζά που ρυθμίζει αποθέματα.
    info: Το έμου σινέργατε είναι τέλεια προσκείμενο για να υπάρχει μέσα από καθηδή δύως· το βουβυζό του φυλάγει λίπος - όχι νερό -, ως ενεργειακό απόθεμα. Δύναται να πιει περισσότερο από 100 λίτρα νερό σε μια φορά και να επιβιώσει εβδομάδες χωρίς να πιει τίποτα.
  animal.capybara:
    label: kapimbira
    summary: Παγκόσμιος μεγαλύτερος γέφυρος , ημιϋδρείας και πολύ ήρεμο.
    info: Η καπιμβάρα είναι το μεγαλύτερο υφιστάμενο θηλυκό που ανήκει στη φυλή των γέφυρών - βάρας· δηλαδή να ζει σε λιμναϊκές περιοχές – τα εξήγορα έχουν βάρος από 40 έως 78 κιλά.
  animal.cheetah:
    label: Γεπαρδό
    summary: Πιο αγωγή στη θάλασσα, φτάνοντας πάνω από 68mph (~110kmh).
    info: |-
      Το γεπαρδό είναι το πιο αγωγή στη ξηρά και μέσα σε δύο βλέψματα ρυθμίζει να φτάσει από τους λεκτών σχεδόν 45 mph / ~72 kph
      Διαφορετικά από τα υπόλοιπα μεγάλα εξωτερικά, ΔΕΝ μπορεί να χαϊδεύει - αντ' αυτού, ψιθύρισμα,
      Ο λεπτός σώμα του και οι απαραβίαστοι δόντια είναι προσαρμογές για την ταχύτητα – όχι για τη δύναμη.
  animal.chimpanzee:
    label: Πιγκουΐν
    summary: Εξαιρετικά έξυπνος σθεναρός, ο πιο κοντινός θηλαστικός συγγενής.
    info: Ο πιγκουίνος ευρύχωμα ζει μαζί της βόμπο και αποτελεί σήμερα όσο δένδρο γενετικά φυλώνοντας να λειτουργεί σε πολύπλοκες κοινωνικές ιεραρχίες.
  animal.coyote:
    label: '"Καιϊοτ"'
    summary: '"Βόρεια Αμερικάνικο σύλωπα υψηλής προσαρμοστικότητας στη Ζωή σε πόλεις"'
    info: '{"hint":"μεσαίου μεγέθους νότιο Αμερικάνικη σύλωπα χυλώδη είδος","info":"Το καιΐοτ προσαρμόζεται αφήνοντας το δάχτυλο για να βρει λύση σε όλη τη Βόρεια Αμερική\nΔιαφορετικά από το λύκο φτάνει να προσαρμοστεί και στη ζωή σε πολύ κοντινή απόσταση από τους ανθρώπους και να εξαπλωθεί σε πόλεις\nΣτη μύθο των ιθαγενών Λεβεντών της ΝΑΜ παίζει ρόλο του απατεώνα\nΕπικοινωνεί με τον ήχο του, ο έχει την τάση να είναι πιο θορυβώδης το βράδυ και τη νύχτα."}'
  animal.deer:
    label: Elafos
    summary: Γραциόζο ζῷο µὲ ποδαράκια · ο ἀρσενικὸς ὁµῶς ᾠδὴν.
    info: Το ελάφι του δρυμού περνα νωρίτερα από χθές σχηματισμό ή και λεγόμενο μεγάλο φώκα για τη Δύση· βρίσκεται σήμερα σ' υψηλό βαθμό στη Γερμανία.
  animal.elephant:
    label: Σφυγμός
    summary: Ο μεγαλύτερος θαλάσσιος ιψιλοζῶος, με χείλος και μεγάλα αυτιά.
    info: '{"hint":"το αφρικανικό ξηράς τεταγμένων με ρύγχος","info":"Το ελπίδιο που βρίσκεται στη νήσο Γκαϊάνα και διαθέτει λυβώδη φυλλωτά για την προστασία του.","label":"Σφυγμός","summary":"Πολύ μεγάλος ζῷος µὲ ῥῠγχὸς."}'
  animal.fennec_fox:
    label: φένεκ
    summary: Ο μικρότερος σαϊμός του κόσμου.
    info: Το φένεκ είναι το μικρότερο σαΐμ που έχει προσαρμογή για να υπάρξει αλώβης και δυνατός λύκος.
  animal.fox:
    label: Αλεπού
    summary: Έξυπνος μικρός σκυλώτης με πυκνό ουρά
    info: Η αλεπού είναι η πιο δημόφιλη σκυλωτή τράχεα και υπέροχος μετασχηματιστής - βγαζει φωτιά γι' αυτό λέγεται να ζουν σε δάση, στεπάδες και πόλεις.
  animal.gazelle:
    label: Γαϊδουρίδα
    summary: Σχολαστική και φθινούσα λαγώβια χαρακτηριστική των βυθών.
    info: Η Τζάγκελα του Θόμπσον είναι μια από τις πιο δημωτικές γαϊδουρίδες στην Αφρική.
  animal.giant_anteater:
    label: myrmekephagos triadaktilos
    summary: Μεγάλο ζῷο µὲ ὀµφαλὸν ἄνευ ῥῖνας
    info: "Το Myrmekofagoς τριδάκτυλο είναι η μεγαλύτερη φθόρα και βρίσκεται στη νοτιοαμερική περιοχή\nΔεν διαθέτει όψων , αποξεφώζει λουπιά με γονατιστά δάχτυλα και συλλέγει σκουλήφατα με την 48cm γλώσσα \nΦάει περισσότερα από 79000 σκουλήφατα & termιta την ήμερα"
  animal.giant_panda:
    label: Πάνδα
    summary: Ασπρόμαυρο δρυόβαθρο από τη Δυτική Νότια Ασία.
    info: '{"hint":"μαύρο - λευκός αγριόχτηνος μπάσω της Κίνας","info":{"label":"Γέφυρα χλώρου","summary":"Μαύρο και πράσινο γέφυρα στη νήσο Γκρίζελι."}}'
  animal.giraffe:
    label: '"Γίραφα"'
    summary: Το υψηλότερο σπουδαίο πλήθος κυβερνώντων φύσεως.
    info: |-
      {"hint":"Ψηλό θαμνωδές αγριοτάφρο με λαιμό","info":"Η γίραφα είναι το ψηλότερο σπουδαίο πλήθος κυβερνώντων φύσεως· οι βροχοκήποι διατρέχουν ναξιωδείς περιοχές.
      Ο μεγάλος λαιμός της της επιτρέπει να φτάνει στα φύλλα των ακακίων,
      που είναι το κύριο πηγάδι της."}
  animal.gorilla:
    label: Γκορίλα
    summary: Το μεγαλύτερο πριμάτε στη Γη - ένας μεγάλος πιθήκωμας από την Αφρική.
    info: Η γκορίλα είναι το μεγαλύτερο πιθήκωμα και η δυσχέρης σπουδάζει αφρικανικό φυλλώδες βλάστηση όπως ντομάτες λαβαντιές.
  animal.hippopotamus:
    label: Χρυσόπουλα
    summary: Μεγάλο αμφίβιο ζῷο ἀπὸ τὴν Ὄθῠνα μὲ τὰ μεγάλα δόντια.
    info: |-
      Το αμφίβιο χρυσόπουλα είναι το τρίτο μεγαλύτερο θηλαστικό στην παγκόσμια γη κάτω από το φώς λέοντας να διδάξει
      Περνά την ημέρα υπό βροχή, που το προστατεύει από την ψύξη· το βράδυ πάει να φάει στην ξηρά,
      Η επιδερμίδα του εκκρίνει κόκκινο ρευστό που λειτουργεί ως φυσικό αντιηλιακό και αντιβιοτικό.
  animal.hyena:
    label: Υιένα
    summary: Σκορπίστη προϊόν και αξιοθραύστης των afrikon savanna.
    info: Η υιένα σκορπίστη είναι το μεγαλύτερο κουμπάς αυτής που ζει στις δασώδεις λεβεντόχωρες της Αφρικής (Crocota crotuta) - γι' αυτό φοβούνται να βρεθούν στο ίδιο μέρος.
  animal.jaguar:
    label: Ιαγουάρ
    summary: Πιο μεγάλη γκέτ συμπαθής της ΝΑΜΗΣ με ρόζετες.
    info: "Το ιαγουάρ είναι το πιο μεγάλη γκέτ συμπαθής κόσμος αφ' υδώρ και βρίσκεται σχεδόν δύο φορές στις Δυτικές Αμερικές. \nΔιαφορετικά από λεβωντάς, έχει νεράδες μέσα στις ρόζετες του. \nΕξαιρετικός κολυμβητής και ψαράς - προΐσταται χαϊδεύοντας ως όψαρα, καπιβάρα και καμιτόνια."
  animal.kangaroo:
    label: kapoucanis
    summary: Μεγάλο αυστραλιανό ζωόφυλο που πηδά με τα δυνατά πίσω πόδια.
    info: |-
      Το καπουκάνι είναι το μεγαλύτερο αυστραλιανό θηλασμένο που χωρίς να διψώνει σχεδόν φθάνει για λίγο τα εννέα μέτρα σε βάθος,
      Οι οφήβες του φέρνουν τα μικρά τους - joey – σ' ένα σακίδιο στο στήθος για περίπου έξι μήνες
      Είναι η εθνική εικόνα της Αυστραλίας και εμφανίζεται στο εθνικό σήμα
  animal.koala:
    label: Κουάλα
    summary: Αυστραλιανή χθηστική φαΐνει μόνο ντοβάγια.
    info: Η κουάλα δεν είναι αγριόχτης πούμπα των θηλυκών σακουδέσφιρων.
  animal.leopard:
    label: Λεόπαρδ
    summary: Μεγάλη φωλιατή κουνέλιας με σβηστή τρίχα.
    info: Το λεόπαρδ είναι η πιο διασκορπισμένη μεγάλη φωλιατή κουνέλιας συνθήκη αφύχτικη την οποία να υψώνει στα γονάτια των δέντρων για να τη βάζει σε ασφάλεια από χιένες και λιοντάρια.
  animal.lion:
    label: Λιο
    summary: Μεγάλη ιθαγενής ζῷο που ζῇ στις αφρικανικὲς βοσκὸτοποὺς.
    info: Ο λιος είναι μεγάλη ημέρα που κυρίως στις αφρικανικές βοσκότοπους νότια της Σахάρας. Ζει σε γεύματα όχι δώδεκα φορές, αλλά οι θήλεις μαζί.
  animal.lynx:
    label: '"lys"'
    summary: Μεσαίος μεγέθους Διάχυτο γκόμπσ με κομβίτσια φυλλών στα βραχύτατα αφτιά.
    info: |-
      {"info":"Το λύγξ είναι το μεγαλύτερο διάχυτο γκόμπσ στη Ευρώπη\r
      Αναγνωρίζουμέ ποδή απ' τα χαρακτηριστικά κομβίτσια μαύρων φυλλών στα βραχύτατα αφτιά του και το μικρός ουρά του\r
      Συνθήκε να μελετά περισσότερο στο σκοτάδι και τη νύχτα· η κύρια θήρα του είναι τα λαγωπόδια και τα λαγοί\r
      Είναι εξαφανισμένο στη Γερμανία, αλλά το δεύτερο μισό του 20ου αιώνα επαναφέρθηκε επιτυχώς."}
  animal.mandrill:
    label: Μαντρίλ
    summary: Η πιο βαθμολογημένη φώληξ του Γέφυρα γάζας.
    info: Το μαντρίλ είναι η πιο χρωματιστή και της απόγευση σύγχρονη νυκτερινή φώληξ του Γέφυρα γάζας δεδομένων.
  animal.meerkat:
    label: '"Συρικάτα"'
    summary: '"Μικρό κοινωνικό θηλαστικό από την Ερήμων Γκαλαχάρι που στέκεται στα πόδια."'
    info: '{"hint":"μικρό κοινωνικό μαγουστάς από τη Σεμίδα περιοχή Suricata suricatta","info":"Η συρικάτα είναι χλώριζο φύσης διαβαθμισμένο για να βρίσκεται στη Δυτική Αφρική\nΖει σε ομάδες με λειτουργική κοινωνική δομή· ένα μέλος της ομάδας πάντα παρακολουθεί από ψηλό σημείο\nΕίναι ανοσοϊξούς προς το δηλητήριο των σκορπιών και των ράτσινων\nΟι συρικάτες μαθαίνουν αμοιβαία τεχνικές "'
  animal.moose:
    label: loss
    summary: To megalyteri thylastiko tis fyles ton dendirion me platia paradendra.
    info: |-
      Το los είναι το μεγαλύτερο θηλαστικό από τη φυλή των δένδρους στο κόσμο· ως βάρος περνά τα δύο μέτρα για να λάβει το «φθιώχτη» και φέρει πλαϊνά παραξενετά με ανοίγματα μέχρι 180cm
      Ζει στα Δυτικά δάση της Βόρειας Αμερικής, της Ευρώπης και της Άσιας,
      Είναι εξαιρετικός κολυμβητής και δύτης - βυθίζει το κεφάλι του κάτω από το νερό για να φάψει υδατικά φυτά.
  animal.okapi:
    label: Oukapio
    summary: Δασικός συγγενής της γιραφαϊκής με περιοχές που μοιάζουν με ιπποπούλια.
    info: |-
      Ο οκάπι είναι μόλις το χρόνο που αναγνωρίστηκε σχεδιαζώντας για να δύναμή και είναι λέξη από τα βαθυτέρα φυσικά είδη που αναφέρθηκαν από την επιστήμη·
      Παρ' όλα που η εμφάνισή του μοιάζει με τη σύνθεση της γιραφαϊκής και της ζεβραΐκης, είναι ένας από τους πιο κοντινούς συγγενείς της γιραφαϊκής,
      Ζει μόνο στο τροπικό δάσος της Δημοκρατίας του Κονγκό.
  animal.orangutan:
    label: orangoutan
    summary: Μεγάλο κόκκινο λεβδικό βράχιο που ζει στα δάση της Μπορνέο και της Σουμάτζα.
    info: Ο orangutάν είναι το μόνιμο λευκαθλής που ζει εξωτερικά από την Αφρική. Δέχεται όνομα από τη μαλαισιανή γλώσσα και σημαίνει «άνθρωπος δάσους». Είναι το νεύρο φυσικό απ' όλα τα λεβδικά βράχια και περνά το μεγαλύτερο μέρος της ζωής του στις κορυφές των δέντρων.
  animal.otter:
    label: Ρινοπία
    summary: Παίζει σε φυσική θέση από την οποία είναι απαραϊτητό να είναι καθαρή.
    info: Η ρινοπία είναι ένα μελάγξη αμφίβιο που συσχέτιζό τρόπως δύναται να καθώς βρίσκεται στ' αγκάδια για λεπτό.
  animal.polar_bear:
    label: Πάγινο
    summary: Ο μεγαλύτερος χθόνιος προηγούμενος που ζει στην Αρκτική.
    info: "Το πάγινο είναι η μεγαλύτερη χθόνια τέμπους και ακρωτήριο φυσικό στην Αρκτική. \nΗ λευκή του γούνα διαχωρίζει το νερό - το κάθε τρίχα είναι κοπαδική και διαφανής. \nΕίναι εξαιρετικός κολυμβητής και μπορεί να βουτήξει εκατοντάδες χιλιόμετρα."
  animal.porcupine:
    label: Δικόβραχδος
    summary: Μεγάλο φωναχτό γεμάτο λεξιλόγιο.
    info: Το δικόβραχδος είναι ένα χλωμάτουρο πεπτώ καθησυχαζόμενο από τέσσερις μύγες σφήκες.
  animal.raccoon:
    label: Μύρινγκα
    summary: Ζῷο ἀπὸ τὴν Νότῳ Σὺν ὁλιγῶς ῥοῦχ
    info: "Το μύρινγκα είναι από τη Βόρειους Αμερική όμως πλέον διαδρατά συχνά και στην Ευρώπη λόγω φθοράς\nΕίναι γνωστό να «ξεπλένε» την τροφή του πριν φάει· βεβαίως, αυτό συμβαίνει για να βελτιώσει την αίσθηση των δακτύλων \nΠολύ προσαρμοστικό και πολυφαγός, ζει και σε πολύ πυκνοκατοικημένες πόλεις"
  animal.reindeer:
    label: Σαμ
    summary: Πολικό θηλαστικό της τούνδρας·
    info: Το σαμό είναι το μόνο ζώο που απέχει από τη φυλή Rangifer και όταν βρίσκεται στη δύναμή τους να γεφυρωθεί σε λάβαρα παγκόσμιας εξάπλωσης.
  animal.rhinoceros:
    label: Κέρας
    summary: Ένα μεγάλο ζῷο µὲ ἕνα ὲὶ δὺο κέρατα.
    info: |-
      Το λευκό κέρας είναι το δεύτερο μεγαλύτερο θηλαστικό στη χθονώδη περιοχή αφού βάζουμε το φωνάκι.
      Η γέννηση του κέρατος δεν είναι από νευρικό ιστό, αλλά από κερατίνη, το ίδιο υλικό με τα νύχια του ανθρώπου.
      Οι κέρατοι είναι σοβαρά απειλούμενοι από την πολυϊξία λόγω της λανθασμένης πίστης στις οπτικές ιδιότητες του κέρατος.
  animal.sloth:
    label: Λενόχωδα
    summary: Πολύ αργό ΔΑΣΙΚΟ ΖΩΟ που κρέμεται ανάποδα στα δέντρα.
    info: Το λενόχωδα είναι ένα σπουδαίο πράμτιστο της βλήτη αβγώδη μέθοδο για να δυκούν υψηλά και φτιαγμένο για να ζει πολύ αργά.
  animal.snow_leopard:
    label: ΛYKOFODIA
    summary: A rare large wildcat found at high altitudes across central Asia's mountain ranges.
    info: '{"hint":"ελατής μεγάλο κουνέλι των βουνών Κεντρικής Ασίας (Puma concolor coryi)","info":"Το λύκοφόδι απομονωμένη εξαιρετικά συχνά περιθώρια χαμηλό φως για να διαβάζει","label":"ΛΥΚΟΦΌΔΙΑΣΜΕΝΗ ΔΡΟΣΟΠΟΘΗ","summary":"Γρήγορη ανάγνωση σε απομονωμένες περιοχές."}'
  animal.tapir:
    label: ταπίρι
    summary: Μεγάλο φυτοϕάγο µε µικρό χобοτάκι, σχετικό του λεµουριού και του άλογου.
    info: Το ταπίρι είναι ένα πρωτόγονο αμφιβληστυκών με σχέση κάθε λευκούς φαΐους ρίζες να διαδραματίζουν βασικό ρόλο γι' αυτή.
  animal.tiger:
    label: Ίταλ
    summary: Η μεγαλύτερη σκυλιώδης φως χέρι με ένα ροζ προϊόν.
    info: |-
      Το ίταλ είναι το μεγαλύτερο που από κάθε σκυλιώδη φως χέρι
      Κάθε δεξί να γράψει λέμε «σχήμα» των βαφτιζόμενων είναι μοναδικό,
      Σε αντίθεση με τα λιοντάρια, το ιβάλ είναι ερημικό και καλός κολυμβητής.
  animal.warthog:
    label: Πράσος βραδεντικός
    summary: Αφρικανικός Διαβατικός πράσος με μεγάλα κλώνια και βραδεντικά.
    info: Ο πράσος βραδεντικός είναι ένα αφρικανικό δωμάτιο του φυλέγχη με σύνθετο γήπεδο και χαρακτηριζόμενο να λειτουργεί όπως το πράσο.
  animal.wild_boar:
    label: διαλκάρη
    summary: Διαλκάρη - Διαφήμιση για να βρεις τον πρόγονο
    info: Το διαλκάρη είναι το αυτόχθων Εύσπερμος σουϊν και πρόγονος όλων των φυλών με λιβέρ.
  animal.wildebeest:
    label: Πακούν
    summary: Μεταναστευτική αφρικανική αντιλόπα που συμμετέχει στη μεγαλύτερη εδάφιας κυβερνήσεως.
    info: Ο Πακούνις γίρεται φημισμένος από μία από τις πλουσιότερες εδάφιες κυβερνήσεως στον χώρο, δια να βγει λεξικό εκατομμύριο ζώα κάθε χρόνο ανάμεσα στο Γκνου και το Μαζάϊ.
  animal.wolf:
    label: Λύκος
    summary: Διάχυτο πσώδες ζῷο, γονὴς τῶν νῦν ἀληθῆ.
    info: Η λύκος είναι το μεγαλύτερο διάχυτο πσωδές θηλασμό και από τους γονεϊκούς στα υιοθετήσεψ.
  animal.wolverine:
    label: Ρόσωμακ
    summary: Δυνατός και θυμωμένος γουβώνθρος των βορειοδυτικών δασών.
    info: Το ρόσωμακ είναι το μεγαλύτερο ξηράς κέντι απ' τη φυλή του γουβώνθρου. Διαφημίζεται πολύ λόγω δύναμης και σχεδόν βίαιης φύσης - μπορεί να αποτρέψει έναν κρίκο από την πρόσβαση στο νεκρό κρέας.
  animal.zebra:
    label: Ζέβρα
    summary: Αφρικάνος πληστόπεδο με ντύσιμο
    info: Η ζέβρα είναι αφρικάνος πληστόπεδο μου σχετιζόμενος με το κούρασμα γνωστή χάρη στις δυϊχρώμες λωρίδες. Το μοτίβο των λωρίδων είναι μοναδικό για κάθε φορέα
