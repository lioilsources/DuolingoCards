lang: pt-BR
pivot: false
title: Animais Selvagens
cards:
  animal.elephant:
    label: elefante
    summary: O maior mamífero terrestre, com um tronco e grandes orelhas.
    info: O elefante africano é o maior mamífero terrestre do mundo. Ele usa seu tronco para respirar, beber, sentir odores e segurar alimentos. Elefantes vivem em manadas lideradas pela fêmea mais velha e são conhecidos por terem uma excelente memória.
  animal.giraffe:
    label: girafa
    summary: O animal terrestre mais alto com um pescoço muito longo.
    info: A girafa é o animal terrestre mais alto do mundo; os machos podem ultrapassar cinco metros de altura. Seu pescoço longo permite que ela alcance as folhas de acácia, que são sua principal fonte de alimento.
  animal.lion:
    label: leão
    summary: Grande felino que vive nas savanas da África.
    info: O leão é um grande felino que vive principalmente nas savanas africanas ao sul do Saara. Vive em manadas chamadas prides; as fêmeas caçam juntas, enquanto a mancha visível no pescoço do macho serve para intimidar concorrentes. O leão é frequentemente chamado de "rei dos animais".
  animal.wolf:
    label: lobo
    summary: Grande carnívoro selvagem, ancestral do cão doméstico.
    info: O lobo é o maior carnívoro selvagem e ancestral do cão doméstico. Vive e caça em manadas com uma hierarquia social definida e se comunica por uivos, que servem para marcar territórios e reunir a manada.
  animal.zebra:
    label: zebra
    summary: Perissodáctilo africano com listras pretas e brancas.
    info: A zebra é um perissodáctilo africano parente do cavalo, facilmente reconhecível pelas listras pretas e brancas. O padrão de listras é único para cada indivíduo, assim como a impressão digital humana, e ajuda a confundir predadores em manadas.
