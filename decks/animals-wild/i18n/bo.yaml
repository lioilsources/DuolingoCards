  animal.giraffe:
    label: པྐྵ࿦࿘࿇
    summary: ལན་སའམ་པུང་དཀར་ལེགས་ཆེན་གྗཔ
    info: |-
      "གྲོ་བར" ལན་སའམ་པུང་དཀར་ལེགས་ཆེན་ཡིན། པཎ་ཚཱས་ཁྲོད་ཅིག་ཏུ་ཕྲུག་ཙམ་གྷཞཹགས་ནས་ཧྭཿ
      གློག་པཊ་ཇ཯་རཻང་གཤིས་ཐ཰འྲྀ་གཟིགས་པཌ་ཡིན་པ་ཅིག་ཡཱུལ་གྦང་གཉིས་གཝ཮
  animal.lion:
    label: པྐྵ
    summary: འະຕຯຣລ ປາກແຫວນໃຫຍ່ ທີ່ອາໄຊຢູ່ຕະເລືອງພຽງຂອງອາຟຣິກາ.
    info: '''གློང་'' ແມ່ນສັດປາກແຫວນໃຫຍ່ທີ່ອາໄຊຢູ່ຕະເລືອງພຽງຂອງບຸຮິໂຄຣນ ອາຟຣິກາ ຫຼັງຈາກຖານ Sahara. ''གློང་'' ພວກເຂົາເຈົ້າອາໄຊຢູ່ໃນກຸ່ມ ເຊິ່ງເອີ້ນວ່າ pride; ຄູໝາຜຶ້ຍິງຈະໄປຈັບສັດປາກແຫວນຮ່ວມກັນ, ໃນຂະນະທີ່ ສາປຽງຂອງຜູ້ຊາຍເປັນເຄື່ອງບັນຍາຍທີ່ເຮັດໃຫ້ຄົນອື່ນຢ້ານ.'
