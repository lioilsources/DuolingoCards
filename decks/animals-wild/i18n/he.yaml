  animal.coyote:
    label: '"كويوت"'
    summary: شامل كلاب شمال أمريكية متكيفة مع الحياة في المدن
    info: '{"hint":"שועל צפון אמריקאי בגודל בינוני","info":"הכוזי הוא חיה טורף מהמשפחה הכלבת הנפוצה בכל נorthand אמריקה\nThe information provided is about coyotes adapting to life near humans by expanding their range towards cities unlike wolves who avoid human settlements\. In Native American mythology it plays tricks on others due its cleverness \"Coyote communicates through howling especially during dusk hours when they''re most active at night."'
  animal.deer:
    label: יון
    summary: חי יך קיפודי עם פרווה חלקה
    info: לויית היער היא היונק הגדול והנפוץ ביותר באירופה. זכרים נושאים קרשים אותם הם מאבדים כל שנה ועושים צומח מחדש – רקמה זו נחשבת המהירה לצמיחה בעולם החיות. בתקופת הריהוพวกם משמעים רועמים ומתחילה תחרויות על الإناث (לויאיות). ברפובליקה הצ'eko slovak הוא סמל לאומי של ההובלה.
  animal.elephant:
    label: סנאי
    summary: הגמד השוכב בגובהו הגבוה ביותר בכדה״א, עם זנב ונשימות חזקות מאוד.
    info: '{"hint":"החיית היבשת האפריקאית עם החוטם","info":"סנאי אפריקני הוא היונק הגדול ביותר על פני כדור הארץ. משתמש בזנב שלו לנשימה, שתייה וشمץ וגם ללכידת מזון. סנאים חיים בחברות בהנהגתן של הנקב старшая והן ידועות במראה המצוין שלהן.","label":"סנאי","summary":"היונק הגדול בעולם, בעל חוטם ואוזניים גדולות."}'
  animal.fennec_fox:
    label: פניק
    summary: היונקת הפכוית הקטנה ביותר עם אוזנים גדולות.
    info: הפנוק הוא היונק הקטן ביותר בעולם המותאם לחיים במדבר הסהרה. האוזניים הגדולות שלו משמשות לשחרור חום וליישר אפקטיבי במיוחד. הכליה שלו מאוד יעילת כך שהיא יכולה להתקיים בלי שתיקח מים ישירות - היא קולטת רطوبة מאוכל בלבד.
  animal.fox:
    label: זאב
    summary: חיית טרף חכמה קטנה עם זנב עבות והדרכו.
    info: ה зайִינ הרגילה היא יונק פסיבי הנפוץ ביותר בעולם ונחשב למשופשף במיוחד. הוא חי ביערות, אקלים צחיחים ובערים. החיה מפורסמת בחוכמה שלה שמוזכרת בסיפורי ילדים ובאגדות ברחבי העולם.
  animal.gazelle:
