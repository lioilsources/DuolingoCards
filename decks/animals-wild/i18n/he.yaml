cards:
  animal.aardvark:
    label: הכרסף
    summary: בעל חיים ים אפריקאי עם פנימית דומה לפילאטוס, חופר גלגל.
    info: הכרסף הדרומי הוא המין היחיד החיים באוירודקטנטדה ואין לו קרובים קרובי משפחה. אורח חיים נוכ turnal, אצבעות חזקות ואзык 黏腻 הם תאמצויות לصيد חיפושיות ובזקורים. בורותיו הנעוזת משמשים עשרות מיני בעלי חיים אחרים.
  animal.armadillo:
    label: 犰狳
    summary: חיwarm קטן בחולש עמוד השדר.
    info: |-
      ה犰狳 ניinemסינקוס הוא יוניקום עם חליפת עצם אמיתית.
      bعض הסוגים מתגלגים לכדור בעת סיכון.
      is מטיל דIGGER מצוין ויכול לחפור בור בתוך פחות משתי דקות.
      ist זה המארח הטבעי של חיידק שגורם ללפרה.
  animal.baboon:
    label: פיון
    summary: זואו אфрיתי גבוה עם נоздרות ייחודיות וחוסך חברתי.
    info: פיאן הוא זוהר אפריקאי גדול המושב בסוואנות ושטחי סלע בחלקים שונים מאפריקה. הם חיים בחברות עם מבנה היררכי מתקדם שמשדרים תקשורת עשירה של צבעי קול ומינימוקה. הזכרים גדולים משמעותית מהנקבות והם טורפים גמולי דגים.
  animal.bear:
    label: бур
    summary: בעל חיים גדול עם פרווה עבות, סמל כוח הטבע.
    info: האריה הבורא הוא השרף הגדול ביותר באירופה ואסיה, ויכול להגיע למשקל של עד 700 קילוגרם. זהו אוכל הכל שמתפרנס מדגים, פירות יבשים, דבורת צוף ודובדבנים קטנים. בתקופת החורש הוא נרדם לחישה חורפית שבה האמהות诞 תינוקיהן.
  animal.beaver:
    label: 鮑勃
    summary: יונה גדולה לבניית 댐ים וייצור מערכות экוסיסטמה לחוף.
    info: |-
      הבוֹבּר האירופאי הוא второй בגדלים מבין היונקים בעולם.
      it יוצר סדomy מזנבות וטיט כדי ליצור אגמים ומישורים רטובים שמשדרגים את חייה של הרבה חיות אחרות.
      it יש לו זנב מרובע עם קשקשים גדולים בצבע כתום אורנז' והעור שלו مقاומ למים.
      The bobr was exterminated in Bohemia but has returned to the region during recent decades.
  animal.bison:
    label: بִזׂו
    summary: 大型北美牛科动物带有蓬松鬃毛。
    info: |-
      ביזון אמריקאי הוא הבעל חיים ים суcho最大的北美洲陸地動物。
       בقرונין התשע עשרה险些灭绝；估计有三千到六千万头，只剩不到一千頭。
      由于保护计划数量恢复至約五十萬頭。
      它是美國西部荒野的象征和美国国兽。
  animal.buffalo:
    label: בופל אפריקני
    summary: בעל חיים גדול מאфрיקה החיים疏导大的群體，屬於所謂的五大危險動物之一。
    info: |-
      ה búvol האפריקאי הוא אחד מהחיות היבשות המסוכנות ביותר באפריקה וחלק ממה שמכונה 'חמשת הגדולים'.
      הוא חי בדרמות של מאות עד אלפים פרטים ויוכל להгонן גם לויונים בעזרת הגנה משותפת.
      male מבוגרים חיים מחוץ zur דרומה נראים במיוחד לא צפויים ומתקדמים.
  animal.camel:
    label: верבלוד
    summary: מַרְכָּע דֶשׁוֹלִי עם גבים המשמשים כסחף השמן.
    info: |-
      ה Верблюд ים תיכון הוא חיה מדברי המותאם בצורה אידיאלית לחיים במדבר; הגב שלו מאחסן שומן ולא מי שתיה כמקור אנרגייה.
      הוא יכול呟 לה海量 עד יותר ממאה 리טר שלמים בו זמנית ולהתאים weeks ללא נוזלים.
      נעשה עבד לפני למעלה משלושת אלפים שנה והוא כלי הובלה מרכזי בממלכות המדבריות.
  animal.capybara:
    label: كبّיبارا
    summary: הגמד האנוכן הגדול בעולם, חי בחציה במים ונינוחיות רבה.
    info: '{"hint":"הסäuית הגדולה ביותר בעולם, חצי מים (hydrochoerus Hydrochae ris)","info":"קיפיבארה היא הסäuיה החייה הכי גדולה ; מבוגרים משקלם הוא בין 35 ל - 66 קילו . \\nvivת באזורים טרופיים של דרום אמריקה ליד נהרות , אגמים ומקורות מי גשמים .\\ nv מחברות מאוד והיא ידועה בפשטות שלה ולכן כמעט כל בעלי חיים אחרים נרגשים עליה .\\ nv הפכה לאيقון של שקט פשוט ברשת החברתית .","label":"كيبابيرا","summary":"הسäuייה הגדולה בעולם , חצובה במים ואינה מאכילה "}'
  animal.cheetah:
