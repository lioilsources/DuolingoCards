  animal.hippopotamus:
    label: hippopotam
    summary: בעל חיים полуводный גדול מאפריקה עם огромными челюстями.
    info: הippo אמפליביוס הוא השלישית בגודלה млך היבשתי אחרי האלף והנשורת. במהלך היום הוא ישן במים שמסייעים לו להימנע מהת열מות; בלילה הוא יוצא ל먹 травות על יבשה. העור שלו מייצר נוזלים 붉ים המ служו כקרם רזרוע וمضادات חיידקים.
  animal.hyena:
    label: hyaena
    summary: .predator spotted ו_mrchozrut Africai Savanna
    info: |-
      הiena סקברניטא היא המember הגדול ביותר במשפחה ההיינית ולאccording לפופולריות אינה אוכלת רק ג死, יותר מ -60% מהאוכל שהיא צודקת בעצמה
      נקבות הן דומיננטיות וגדולות מאחיים שלהן,
      The הัว של היינה הוא למעשה רעש תסכול או פחד ואינו מבטא שמח.
  animal.jaguar:
    label: ג'גר
    summary: הגreatest מיני החיה באמריקות עם סימנים בצורת פרחים.
    info: ג'גר הוא השלישית בגודלה מבין חיות השרד בעולם והייחודנית האמיתית בשתיהן אמריקה הצפונית ואמריקה الجنوبית. בניגוד ללב השחף יש לו נקודות קטנות בתוך סמני הרוזט שלו. זהו שחיין ודוגל מצוינות ולוקה במינים כמו דגים, קрокודיילים ואף כיפריות. בקרב המאיים והאצтекים היה גזע רוחני של עוצמה וחוסר תיאבון.
  animal.kangaroo:
    label: קנגורו
    summary: büyük澳大利亚跳跃哺乳动物
    info: קנגורו אדום הוא הבהמה האוסטרלית הכי גדולה והחיית הסירה הגבוהה ביותר בעולם; יכול לקפוץ יותר משמונה וחצי מטרים מרחק. الإناث נושאות את הגורים בשרשראת הבטן למשך כחצי שנה.
  animal.koala:
    label: קוולה
    summary: וסקופודאט מאוריקני המ חי בפרשת הירכיות.
    info: קואלה הוא לא אסבאב אלא וскопודאטה. הוא נour בעיקר על עלים של יער האוקליפטוס שכולי הם是有毐ים לרוב בעלי החיים אך הקואלה יש לו מערכת tiêu hóa מיוחדת. הוא durms עד לשעתיים ביום כי העלים האלה יש להםערך תغذיה נמוך.
  animal.leopard:
    label: lepard
    summary: שועל גדול עם פרווה סגולה ונחשב למתאימו במיוחד.
    info: ליאוֹפארד הוא השועל הגדול והנפוץ ביותר במשפחת היונקים הקטנים ומשתף ייחודי שמעביר את טרפו לקורה העצים כדי להגן עליו מהיינות ומהלבים. היכולת להתאים עצמה מנצחת זו של יתר القطיות הגדולות והוא חי באפריקה ובמזרח הרחוק ומזרח הקרוב.
  animal.lion:
    label: לוֹי
    summary: חי ים גדול חי באфрיקה.
    info: לוי הוא חיה טרף גדולה מהמשפחה של היונקים החיים בעיקר בסבנות אפריקאיות דרום לסחרא. הם חיים בקבוצות הנקראות פרידס; الإناث냥 יחד בזמן שגוויתו המרשימה של הזכרי משמשת להרתעה אויבים. לוי נקרא לעתים "מלך החיות".
  animal.lynx:
    label: 猞猁
    summary: חתול ים גדול עם חוטמי עיניים.
    info: ה猞猁 הוא האלוף הגדול באירופה. ניתן לזהות אותו לפי שערות שחורות בודדות בציפורן העורף והזנב הקצר שלו. הוא נוהג לדוג בעיקר בסופי היום ולילו ובעיקר לסנאי ובקרים.
  animal.mandrill:
    label: מנדריל
    summary: הפראי מ 색ונית עם הפן הכחול אדום
    info: המאנדריל הוא האפימבאס הגדולה ביותר בעולם והפריים המ색וניים ביותר. הזכרים נושאים מסכת פנים כחולה ואדומה שמסמלת מעמד חברתי. הם חיים בקבוצות באדמות הגשם המשויכות של קמרון, גבוין וجمهورית קונגו.
  animal.meerkat:
    label: '"سوريكاتا"'
    summary: '"יונקתجتماعית קטנה מהמדבר קלארהי."'
    info: |-
      {"hint":"小型社會獴，來自卡拉哈里沙漠（ Suricata suricatta）","info":"סורייקטה הוא יונק קטן ממשפחת המנגוסטים החיים בדרום אפריקה。
      הוא חי קבוצות עם מבנה חברתי קבוע ; תמיד יש 구성員 שמתנדב להגן על הקבוצה מהמקום הגבוה ביותר.
      היאภיה לחומר רעיל של נחשים ו蜇刺。
      סורקטאות לומדות זו את זו טכניקת狞猎技巧。
      "}
  animal.moose:
    label: לו
    summary: ה мл יאלניט עם פארות בצורה של לופה.
    info: לוס הוא היילן הגדול ביותר בעולם; הזכרים מגיעים לגובה מעל שני מטר בזנב ומעלים קוצים בצורת לופט באורך של עד 180 ס
  animal.okapi:
    label: אוקפי
    summary: 來自刚果擁有斑馬條紋腿的森林长颈鹿近亲
    info: |-
      האוקאפי נ发现自己科学地描述直到公元一千九百零一年，是科學最後發現的大哺乳動物之一。儘管視覺上類似於長頸鹿和斑馬的混合體，但它是現存最接近長頸鹿親屬的生物。
      它只生活在剛果民主共和國熱帶雨林中，并且該國家將其視為民族象徵。
  animal.orangutan:
    label: אורנגוטן
    summary: ארנב אדום גדול החיים בעצי ברנאווסומטרה.
    info: אורנגוטן הוא הלאוופון הגדול היחיד החיה מחוץ לאפריקה. השם שלו בא מה말איס ופירושו 'אדם יער'. זהו הלידווף הכי סולטי מבין כל ליוופונים והוא מבלה את רוב חייו בקורה של עצים.
  animal.otter:
    label: ויירה
    summary: חיה יבשתי活泼 חי בזרםמיימים טהור.
    info: הוירדה היבשתית היא חיה קטן מהמשפחה הלטראים המותאם היטב לחיי מים. יש לה שיער צפוף וمض御מַים, רגלי עם קוצים לשחות והיכולת לשמור על נשימה לכמה דקות. אוירים הם סימני אזהרה של ניקוז מיימיים – שם שהם חיים, הנ้ำ בריאה.
  animal.polar_bear:
    label: אריה לבן
    summary: היורה הגדול ביותר באוקיינוס השקט.
    info: האריה לבן הוא היורה הגדול ביותר ביבשת והשד הארקטי העליון שלו. פרוותו הלבנה מבודדת חום בצורה מצודקת - כל שיער ריק ושקוף. זהו צלופים טוב מאוד שיכול לשחות מאות קילומטרים. התחממות ג球ית מקטינה את נפח הקרח שבו הוא 사냥 ומאיימת על כלל המין.
  animal.porcupine:
    label: دיקوبرز
    summary: חמוד גדול עם סיבוב מוגני
    info: דיקוברז הוא חרק הולדה ש محمיו על ידי אלפים של קוצים חדים וריקים המהווים למעשה תאי השן שנשמרים מהשיער שלהם. הקוצים לא נורים כמו стрелы אלא ברגע מגע הם ניתנים לשחרור בקלות ונפצים לתוך גוף היורה. דיקוברז הוא הגדול ביותר מבין החולדות האפריקניות והוא מחפש בשעות הלילה קליפות עץ,뿌ועי צמח והגדר.
  animal.raccoon:
    label: '"قنديل"'
    summary: '"حيوان أمريكي ذو وجه أسود ومزينة ذيله بالخطوط."'
    info: |-
      {"hint":"قنديل ليلي من أمريكا الشمالية مُغطّى بعلامة على الوجه (Procyon lotor)","info":"المكواة الشمالي تعيش في أوروبا، حيث انتشرت بكثرة اليوم بعد أن تم نقلها هناك.
      إنها معروفة بتصرفاتها التي تعطي انطباعًا بأنها تنظف طعامها قبل الأكل؛ ففي الواقع فإن هذا يساعد على حساسية أكبر للقدمين الصغيرتين.
      هي كARNي وقائمة بأعمال مختلفة وتتكيف بشكل استثنائي جدًّا حتى أنها تسكن أيضًا المدن ذات الكثافة السكانية العالية."}
  animal.reindeer:
    label: سوب
    summary: עוז טנדרי בקוטב צפון; גם הנקבות תופסות.
    info: סוב פולרי הוא המין היחיד מהסוג העיזים שבו גם הנקבות נושאות קרשים. חי בטונדרות של אמריקה הצפונית, אירופה וآзיה ויוכל לנוע آلاف הקילומטרים. הסאמויים חוסמים אותו מסיבות כלכליות כבר מימי קדם.
  animal.rhinoceros:
    label: นอสโบรเจช
    summary: มีขนยาวและหนวดสองเส้นที่จมูก
    info: |-
      הנושרג בורח הוא השני בגודלו אחרי הספינה היבשתית הכי גדולה בעולם.
      The horn is not made out of bone but rather keratin – which also makes up human fingernails.
      Pythlacism causes serious threat to rhinos due to false beliefs about their healing properties
      There live five species wild today - three on Asia's continent while another pair dwell within Africa.
  animal.sloth:
    label: لנוך
    summary: סאבך עץ מהירעט slowly悬挂在树冠中
    info: לנוכוד הוא סבאכ שמתאים בצורה מושלמת לחיים איטיים בקורה של עצים טרופי. התנועה שלו כל כך איטית עד שהגזרות על פניו נращת צמיח ירוקה המ служבת כמסקרה. חילוף החומרים chezו כלכך איטי以至于 התרוקנות מתבצע רק פעם בשבוע אחת. יש לו קוצים חזקים במיוחד בצורת גביש, בזכותם יכול להвис גם לאחר המוות.
  animal.snow_leopard:
    label: leopard לבן
    summary: The white leopard lives at high altitudes across central Asia.
    info: |-
      {"hint":"Felidae Panthera uncia","info":"הлеופרד הלבן חי בסביבות ההימלאיה ותיבט בגובה של בין 3 ל -5 ק"מ מעל פני הים. הוא מאבד את שיווי המשקל בעזרת זנבו הארוך במיוחד当他攀爬岩石时。据估计，世界上只有大约四千到六千五百只雪豹。
      The snow leopard is considered to be one of the least studied large cats on Earth."}
  animal.tapir:
    label: טיפר
    summary: חיית בר עם חוטם קטן, קרובה לרינו וחמור
    info: |-
      טיפיר הוא ליחוקופיטן פרימיטיבי קרוב לרינוסים ולחמורים למרות שאין זה ברור במבט ראשון
      הוא חי באמריקה ובדרום מזרח אסיה באזור יערות הגשם הטרופיים
      חוטם קצרו האלסטי משמש ללכידת ענפים ואורנים
  animal.tiger:
    label: תנין
    summary: הfelidae самый большой в мире с оранжевым полосатым узором.
    info: תיגר בנגלי הוא ה felidae הגדול ביותר החיים בטבע. כל פרט יש לו תבנית של פסים ייחודית, כמו טביעות אצבע אנושיות. בנגאלים הם שונאים ו擅长 nadadores מוכשרים.
  animal.warthog:
    label: פרשת הברדלית
    summary: חיה ים תחתוני של האфрיקאי עם קוצים חזקים ובולטים
    info: פרסת ברדאביץ' אתיופי הוא חסיל סורקי דומה לפרוסת בית החיים באפריקה. הזכרים שלו גדלים בגדולי עיניים וברזל שמש כהגנה. במהלך ה逃避 מתרחק עם הזנב מעלה כמו זוג צלחות.
  animal.wild_boar:
    label: دיבוק
    summary: חזה דики עם קוצים, מקורן של כל התרביויות החזירות
    info: |-
      דיבוק הוא המין האירופאי המקורי ואב הקטגוריה לכל מיני חזירים תקינים
      הם חכמים ומקבלים לядם צמחים כמו שורשים ובצלים אך גם יונקים קטנים שהם נוטרים אותם בקבוצות עם אימות הדובע
  animal.wildebeest:
    label: ג'يوוויסה
    summary: אנטילופת אפריקה הנעה בתהליך המиграציה הארצית השכיחה ביותר.
    info: ג'יוויס גנו ידועה כחלק מהмиגרציה היבשתית המאוד גדולה בעולם - מליון בעלי חיים עוקבים כל שנה בין סריינגיי למאסי מארה. היא נמצאת במטרה של לבנים, פנתרים וקрокודיילים. קобы תורמות כמעט כולן בו זמנית בתקופה קצרה מאוד – שבועיים עדשלושה.
  animal.wolf:
    label: Wolf
    summary: predator wild Canidae animal that is an ancestor for pet dogs
    info: '{"hint":"שועל פרימיטיבי (canis lupus) איננו כלב","info":"ה늑ד הוא השועל הגדול ביותר בטבע והאב הקטן של הכלב הזריז. ","label":"wolf","summary":".predator wild canid ancestor to domestic dogs'
  animal.wolverine:
    label: רוסומק
    summary: חיות ליסה חזקה ונוקשה באזור השיח הארקטי והטנדרה.
    info: הרוסומק הוא החבר היבשתי הגדול ביותר במשפחה הליסית. למרות הגודל הקטן שלו ידוע בכוח ובהתקפנות מופלאים והוא מסוגל להרחיק שועל מאוכלתו. חי בשכבות אזוריות שליעי טונדרה בצפון אמריקה, אירופה ואסיה.
  animal.zebra:
    label: זבּרא
    summary: חיית יונקים אфрיקה עם סמל כחול ואפור מודגשים בדפוסי תווים נפוצים מאוד על גופה כמו גם באצבעותיו או בשיניהם.
    info: '{"hint":"סוס דומה עם צבע שחור ולבן","info":"זברה היא לוחש אפריקאי קרוב לסוס שמיוחד בצבעו השחור וה לבן של הפסים שלו.","label":"זברא","summary":"לוהק אפריקני עם פסי שחורים ובנים."}'
