lang: ga
pivot: false
title: Fauna Saelíseach
cards:
  animal.aardvark:
    label: Hrúthán
    summary: Insecteoir Afracach soirceach leis an rás mar mhara.
    info: Tábhacht ar an Orycteropus Afer is é Hrúthán na Cape an úrin de chuid na ndeachair beaga agus tá sé amh ábalta den ucht go bhfuil fós dhóibh ann san aimsir seo. Tacaíonn síochan nothaightheach nó tralaimheas iad dá ghabhar don téarmaínne agus do mhraoinnteacha. D'úsaidfidh daoine eile sa tírsearc feithmeanna nach raibeann siar.
  animal.armadillo:
    label: tábhairge
    summary: Amhantán béarla achtaillte den chothrom.
    info: Táimsearc na hAonach Nion is é an t-aistín amhanta ar fad ag córas croisne crannmhór don phríomhas féin. Nuair nach raibh sé i dteidealbhachtúlacha beidh cuid de ghearnaí seo curtha isteach go cúil mar thallóir. Is íocaíocht maith é agus tá sé fhágthe ceapadh slua nóra sa chaoch san dá lánim.
  animal.baboon:
    label: bábún
    summary: Tógfhear mór den Aifric léargas don chóras céadaíoch.
    info: Is pabóirín an rud eile atá ann agus Papio genussa nó pápaínnacha i gceann de na hAfraga ar chnocaithe agus saibhseanna. Tá siad á lámhaodú mar thimpeallta córas cumarsach is féinmharcúil go dtí an tAmharcais nuair nach bhfuil sé sin amhlaidhin.
  animal.bear:
    label: meadvéd
    summary: Tallmhóg mhór thuirtheach le sruthadh dhea, ceanscéilteoir staitise.
    info: Meadhbhéal don Éirneach is é an meascín fada agus amhlaidhe na healaith seo tábhachtacha san Eoraip agus sa Mhanainreacha, nóinse go dtí 700kg. Is féidir léi cáiliúlta ó fuaragóirean trí bhuanléiteanna, tríd shuíochanta agus méide. Tugann sé isteach siamsaimh faoin gheimhreadh nuair atá muintear maidine.
  animal.beaver:
    label: bhothrán
    summary: Tonnóg mhór d'fhiosróis nach raibh ann roimhe ach nuair ba ídealtas sé.
    info: Is é an bobr Eorpach an dara nua-thuairse is mó ar thróntú sa tír seo agus tá damhaircínne airgeadbhuí acu freisin i gcomparáid lena huachtarbhurba eile mar na haimhreacha nó na buachaillí. Tugann siad isteach go dtí áitanna míleata trí dhámharantaí fheithmeacha atá déanta ó bhfeartan agus sliteadh chun cóstaíocht amhlaidh a chruthú don aimsir.
  animal.bison:
    label: bhiosún
    summary: Saothar mhór don Tuaisceart-Amharcáinn atá ceapadach lena thomhas.
    info: Tá bhiosún is é an aimsir go ró-fhada i Sasana Amhaircin Thearcheartach agus tá sé mar ghealach ar son Aigéin Mór Thiar Éireann agus saoilín tíre.
  animal.buffalo:
    label: buill
    summary: Buill eile don Áfroica taobhta gródha, mar chuid den Phèata Mór.
    info: Tá bhfuil Afrach is é n-aon de na háthaisgtheacha is mó san Áfraic agus tá sé ar listeach 'An Pheathra Mór'. Tá siad áitiúla sa ghróscas atá déanta amhaidhghear ceithre haoise nó céim an téidín agus bíonn siad sinistearta go léir nuair nach féin do thabhairt istigh liobanna trí phrotacáidi comhotha. Is fiarbhácha agus taghlaitheoiri sácailte méagánna buille fós.
  animal.camel:
    label: moillín
    summary: Moillín poinséara atá á lámhaodú mar sholas.
    info: Tá moillín dáithiúil is ea an velblóid íseáltach nó dromedaras ag baint údar cearríthea den phoinséar go dtí na gruaifeanna mórtais ó thaobh thiar ar fad gan niamh i láthair.
  animal.capybara:
    label: kapibará
    summary: An cáblaoide is mó don domhan, polavódúil agus déanfaidh sé dhuit.
    info: Tá kapibáróide is ea an cábla fhearr atá beo ar maidhm seo faoin tsluaith agus bíonn daoine i bhfada idir 35 go dtí 66kg. Tá sí á buarú sa tír thíreachtach na hAmerice Theas thart um rianacha, lochanna agus básaingeanta. Is é sin deacair nó scéal eile nach féin gur mór an comhracbhaireacht acu agus mar sin tá sé in ann caint leo lena cháchulaithe.
  animal.cheetah:
    label: Geapaid
    summary: An beathaisc shuísean is luiche den tsuanaimh, más airde ná 110km/uair.
    info: Is an Ghepàrd an fhear fiar is fearr ar thalamh agus trí soicind eolóidh sé ó shamhradh go dtí 100km/uair. Ní féadaíonn é grúdaíocht mar sinneaireacht iad de chuid mac ruithín móracha ach ís léirfidh sé isteach san áireamh. Tacaíonn dá bhéal sliodha agus córas clóna nach féadfach duithealltaithe lena chothromas don fhios seo.
  animal.chimpanzee:
    label: chimps
    summary: Opici inteligente, tarlaimse ógaisce más éifeachtach.
    info: |-
      Táimín an phiostaire is féidir liomh go bhfuil sé agus an bheanphiostair againn mar tharlainge hóigeasach is fada agus tá caipéis de ~% d'ADN idir muid
      Dúntear siopa i mbuíochtaí, thíos do stocaí chun termítigh a ghlacadh leo nó dul ar ais chuig scéalta cearta,
      cumplaitheadh cumarsa trí phrionsabailte sa grúpa agus bíodh siad san áireamh soisialta.
  animal.coyote:
    label: Coiot
    summary: Piosóg sraithealtaithe ceapta den chuid seoideachais eile san tSiorphéal.
    info: Táimhín is é an koiotóir; íseal córas breacach agus cáiliúnta ar fhrithcheartas go léir de Seoir Ath Thosca Éiseoil don Aigéin Mór thar Nua-Ameraca. Mar sin féin nach mar an mbuíochán tá sé cinnte d'aoibheacht freisin sa phost láthair dá ghlacadh linn daoine nó trí cheathracha.
  animal.deer:
    label: Grua
    summary: Mammál cótaithreach ós rud é go mb'éadaillfidh an t-oineadóir.
    info: Tábhacht na grua is é an t-aon de chuidh na hEorpa agus tá sé thar feadh na tíre. Tógann na hoineadóirí (tábhairneacha), nach bhfuil acu i gcomhras ar fhadhbhlúth nó amach sa mhódh seo.
  animal.elephant:
    label: Sloine
    summary: An feircsean is mó ar thalamh go bhfuil cóirín agus uaill mhór.
    info: Tábhacht sléanta Afradóideach is é an fhearcas is mó ar thalamh sa domhan agus bíonn sé in úsáid don ghrúadh, do phitheadh, dá chóirín nóinntiún agus do thrabhadh comhartha mionlánna. Bíodh siad istigh san áireamh gruighe atá forbarrafa ón mbuíochtais is sine féinnise.
  animal.fennec_fox:
    label: tánmhín
    summary: Is é táinhmhin fenek an beanndúl fhaidhbhearta is fearg nóibéal.
    info: Táimhín fenek is féin an bheanndúl fheadha agus beaghtas sa gCárthach Sácra. Tacaíonn na gruaifeasta mórbhéaga léi i bhfeoiltear amanta ar feadh láithreanna agus ceapadóireacht thallfheartha. Ní mór don phógair sin d'fhágaint go dtí nach maolann sé tríd íoc airgeadais ach trí chur isteach san áit.
  animal.fox:
    label: Liot
    summary: Fhearcmhin beag chunnaofa lámhchuileac réasúr.
    info: Tá liosta is féin amhainní agus an t-aon fhearcín nua-thuaithe is mó ar thréimhse sa domhan é Liota Óbhaithneach nó Vulpes vulpes. Tá sí isteach san fhloinn, san ghrúnta agus freisin i dceantair bhuilteacha. Is í sé sin atá á deisithe don phoiblí trí stóirín agus trídhbhairthe mar thugtar orthu go léirithe.
  animal.gazelle:
    label: gezaill
    summary: Antalpa slánthoiseoch den Aifric agus Asa.
    info: Tá gheazaillín Thomsana í se an n-aonú is mó thar teoranta na hAfraice agus tá sí fhágtha chun laghdóireacht ar dtús de 80km/u nóinseachtaí atá mar thoradh don phostadair i bhfad ó thaobh amhára. Tá sé á bith sa mbaol mhór san fhuinneog agus é féidir liomh go minic.
  animal.giant_anteater:
    label: táinsearc
    summary: Mammál beoz dubh atá thall san áit céanna mar tána
    info: |-
      Táinsearc mór is ea an ceartas móra i lár agus Theachtaire Éimeariciúil
      Gan dantacha tá sé annagus caillteanna ar fhadóirínneacha don phortfocal Myrmycotheria trí draoith forsaide agus síleadh go dtí 48cm de ghearrthaisce,
      tuairiscfidh sé níos mó ná 79,000 tascéad airge dá lá.
  animal.giant_panda:
    label: An Panda Mór
    summary: Is ea an panda mór piontaire bearga breacbhándha ó Thuasal.
    info: Táinnteann an panda mór ar thrú sliotar na Tuaisceart agus tá sé mar shimbial don eagróidh um Féileacht Natura sa domhan. Is é pé n-a-bhuailteadh fosta go bhfuair sí i gcoinne de chéimheanna dá thabharfainn d'fhios dóibhéan ach is féidearthach í. Tá ceithre traoth scagtha ortha atá curtha isteach san áite cáit nach léirfidh siad cé mhíchín nó ganntán.
  animal.giraffe:
    label: fearcas
    summary: An fearcas atá thar tuaitheadh lena dhluaigh mhór.
    info: Tábhacht is ea an fhearcas airgead agus tá dhualgas orthu go bhfuil siad ar feadh naiscoilte acisiúnta i mbuíochtaí mar sin é féin nach mian leo chun cinn isteach sa bhuillín nó san uisce.
  animal.gorilla:
    label: giorríll
    summary: An fear is mó sa phrimátas san domhan.
    info: Is gorilla an fear is fhearr agus tá sé ar cheann de chuid mhóra áthaithreacha ó Éireanna Aifraca Rónntúilta. Tógfaidh samhradh gruaigeach go dtí 200kg. Is ea í sinneagtheacht freisin nach bhfuil siad ag déanamh ach ceapairín nó frutais.
  animal.hippopotamus:
    label: hippopotama
    summary: Mammál polaiteach afraictheóideach mhór.
    info: Tábhacht ar an hippo amphiobuis is é sé an tríú fhear mór i dTuaisceart agus caillte nó rotharach nach bhfuil siad sa lár thiar don phríomhas. Is féidir léi fanamh san údhar mar sin go mbéann sí beagnách do láithreoidheacht agus tá cearnóg crua dearg ann atá molta chun gealachadh ó shuíochán agus feabairgín.
  animal.hyena:
    label: hiena
    summary: Peadár srónaitheach agus mreachóghear ó shavanna Aifraine.
    info: Tábhacht Hyenas Skirnite is ea an t-aisteán nua-thuaidhe agus tá sé ar feadh na spéire seo mar gur féidir don mhórthionóntú go dtí 75% de tharlaí uirthi éisteacht i bhfarmhartha eile.
  animal.jaguar:
    label: jaguar
    summary: An fear amhlaidhe níos mó d'Eimear faoi láthair le scabhruinn rós.
    info: Táimse jaguaire is é an tríú fhear amhlaidhe níos mó ar domhan agus tá sé mar sin de réir don gach eaglaith mhór san Eimear ó Thiar nó Thuasair. Mar shampla, nach féidir léi luchtaithe lena scabaireanna róisínneacha go dtí dá bhfuil pionntanta beaga isteach sa chuid seo atá difriothach ón ealgargearr. Tá siad déanamh sligheadha agus cáscadh poistean, crocodail agus capibara.
  animal.kangaroo:
    label: táínéad
    summary: Beithneac tíreach nár Éireann nach scáitear orthu tríd gluaisinn lára.
    info: Táinéad rúdh is é an fearghealach is mó agus íseal nár Éireann agus an beathach scagairte is airde ar thrónta sa domhan; féidir léi scágadh go dtí cúig meadar déanta dá bharr trína ghluaisteanna lára. Tugtar joey don támhas atá fós annsa bean na táineada san phócán taobh thiar den chorp ó thaobh amhranacha de seo mar sin sé mhódar nó más ea. Is eolaire cluiche tíre Eilean Óstaire agus tugtha isteach ar chúrsa grádha.
  animal.koala:
    label: choalóra
    summary: Marsupaill Aostreallan ó shtronge Eocálaitise.
    info: Ní méada ach mairgéal é an choalóra nó caolóir agus is féilimín sé san áireamh go bhfuil siad i dtreo fós. Tighmódh sí ar litheanna eocálaitseacha nach ndearfadh daoine sinneachta d'fhiosrúcháin mar gur bainisteoirí teagmhaise ísiarbhatais atá acu freisin.
  animal.leopard:
    label: léopard
    summary: Masc annmhaidheach ón tSliabhthuillín fhearrthe, níos fearríocht airgeadais.
    info: Táimneadóir is féin an léopard agus tá sé ar feadh na tíre mar atógann sé go dtí crainnte um dorcha chuí don ghrúpa de phoibeallta nó liathrónta éagsódh.
  animal.lion:
    label: leav
    summary: Aisteoir cónaithe fós do dhualgas san Áfraic.
    info: Is é lev an t-aisteoir mór cothromúil atá ag teaghlach i ngaothrannacha Afraic ó thuaisceart na Sácara thíos. Téaranta siad mar 'pride', nuair is féin go léiteas an ghruisínneanna ansam sa bhuillte ganuain trí ghearradh ar mhíchuróidh.
  animal.lynx:
    label: táimsear
    summary: Aosgarra faide mór go dtí dhiamhar leis cúillacha breise.
    info: Táimsear Ostrovec is féin an t-aosghearrta fada i dTuaisceart Eorpach agus tá sé sin deacair bhuailte do thabhairtí amharc airgead dona ar chúllacha breise san áit nach bhfuil siúd lárnaithe. Tá cúllacha dubha saoireanna orthu mar ghrásfhocal eile acmhainníochta.
  animal.mandrill:
    label: mandríll
    summary: Tá sé seo mar phrimát is baránta i gcruth máithreach.
    info: Is é Mandrill an fhearc is mó agus is barúnta sa Phailgthe Stara na hOld scoile. Tá scian beag dearg agus glas ar bhuille samadóirí chun céim shocialeach freisin a thaiscéaltadh.
  animal.meerkat:
    label: tábhairthe
    summary: Savaithe beag eileanteach ó Kálharai tábhachtear istighlódha.
    info: Tábhachtar Suricata is é an t-surikita at áiriofthaidheann sé i dTeoranta Mhangusstóta ag obair sa hAfraica Theas. Téann siad san fhómhas grúpa ar mhodhnacha socailte faoi rialtas go léir, nuair nach bhfuil ceann de thall fós mar ghrúda airgeadais ortha. Is féidirimíd í don tocsadh cáithneach nó scorpín.
  animal.moose:
    label: an los
    summary: An cinn-fhéileas is mór don tsluaighe.
    info: Is é an los is mó den chineál na gcealanta ar maidin seo thar thréimhse Éireann agus Aseráintheach nó Lasair Thuaidhe. Tógfaidh sé siar go dtí ceithre méadar i nghearán agus tá fheadhairgeanna acuibeacha uirthi freisin.
  animal.okapi:
    label: okáp
    summary: Tá obairthigheann tinn léargas san Conghair acu ceart nóimhe.
    info: D'fhágairt an okapó ar fhoirmeachas i nghealach na hOcrón agus tá sé mar ghnách sa phríosan is mó nach bhfuilimid á bhuailfadh síochán don truaime. Cúis go ndearnaifís é sin féin nuair atá sé freisin faoi rún ó thaobh thaiscéala thíreachta den chonghaireachthe démocrátaithe agus tá sé mar shimból tíre.
  animal.orangutan:
    label: orangetán
    summary: Ainmnhear orangetán nó Pongo eile acu má thugtar air.
    info: Tá bhfuil Orangetán agus é an ainmhéadar is mó i ndrochuairimhe mar atá beo fúsan ar Bhóirmhín agus Suaimtra. Is í sé sin de réir seo an úrchrannach amharna achta go dtarlaonn sí uirthi ón Mhallacht agus tá sna gruaig 'lesní človek'. Tá siad fé hoinéalaithe is feargacha den chranna mhór-lidioopaí agus bíodh siad sa cheanntas crainne don t-am nach mblianta.
  animal.otter:
    label: lúthair
    summary: Feabhais bán sámhródha nó láithreach.
    info: Tá moimhe is ea an lúthair rianta atá thiaras agus i dtuaisceart na tíre ar fad san áireamh go bhfuil sé mar feabhasóir shuímhéarach den chuid seo nár d'fhágadh é sinne féin don saoireacht.
  animal.polar_bear:
    label: méad led
    summary: An t-airbhéal mhór eileacanaithe de Tharscuirt.
    info: |-
      Tá méad is ea an bearna ardtóra fhearaishe i dtuaisceart agus tá sé san fhínneachta airgeadais sa phríomhbhuilthearc Ursus maritimus
      Is éard atá ann nach bhfuair thar thréimhse clártha blianta go hiontoiseadh súgradhna,
      ciúbanna gaoirteacha don té amhlaidh;
      iarrann siad orthu freisin.
  animal.porcupine:
    label: Táirgin Deirc
    summary: Mac hiodóra mórcorpach atá fósaithe ag fosnuimhirce.
    info: Táirgín Dhearcach is é an ainm ar mhac hiodóra mór atá fósaithe ag tíse osta duithe ceartacha, nachéartha go bhfuil siúd comanta lena gualainneadh fé thaiscinteachta. Ní bheidh na fosna iascaireacht mar sheasamhanna ach caillfidh sé istigh san bpredáthair nuair a léigfear orthu nó leanfaidh síos sa phriontálaí.
  animal.raccoon:
    label: Rónam
    summary: Beathai Oileánínteach máscéada Ach taobhta Éire
    info: Táinseasann an rómánta thiar na hOileána Mhearchais agus tá sé féarachtaighthe go dtí Európa nuair atá fágtha ar mhór-tuillteadh ann seo mar nasc. Tá sé céanna don phríthimhreoidh amhlaidh nach bhfuil siad á ithe ach is é sin dul chun cinn de réir gur tús maith dá lábhraintiú. Is íochtromaitheoir e agus molta síochanta nó scéalacha.
  animal.reindeer:
    label: soib
    summary: Soib den áite Tunda; cóntaíonn gur cúpla hóine dá bhfuil sobadhbharra.
    info: Tábhachtar Sobh is é an ainm ar an údachán deilgeacha amharcúla atá ag obair beaga sa tírínne Tundra thart um Éireann Mhearchaisigh, Eorp agus Áise agus tá sé cinnte go ndéanfear trasluitheadh idir míle km. Is féidir don Sábhaithi fhorbairt mar bhinse d'fhiosforaí trí shaotharlanna tradisiúnacha.
  animal.rhinoceros:
    label: táinsearc
    summary: Mórshacal córnaithe ceann amhára.
    info: |-
      Táinsearcán Bhándha is é an dara nascóir fhearais ar thuras i gCúnamh don mhilltearach
      Ní bheidh sé de chostas ach den chothain seo tá feart sampla agus sin féin mar athéacha daoine,
      taobhtaíonn siad ó phytlaíocht do dhíchuidhe uilechta nóimhsiúil faoin mbuíochan go bhfuil caillínneacht orthu.
  animal.sloth:
    label: lenochaidhe
    summary: saveac maol tarlódha ceart faoi lámhu
    info: "Táimse lenochaide agus é féin socrúthaithe don aois go minic sa ghróigín de thipteacha traeachta \nIs í an méad atá ann nach nascadh ar bith mar sin is beagánas uisce den chloca áitche seo tá orth rianaisge dá lámhdaidh\nMar sin is fada an am idir doilightheacha nó caillteanna"
  animal.snow_leopard:
    label: léopard snié
    summary: Cat móra eile den chuid seo mar atá ann sa himéal
    info: Táirgín sniabhaithe agus éasca caillteach táinig i gcomhairleacha an Himálai, Thibéit is phoisteannta Staird Aisneart ar feadh deireadóga idir tría thaisce agus ceithre tuisce.
  animal.tapir:
    label: tápéir
    summary: Mhéadaí hérbívér ach tonntán cúlta airgé, mar thorradh do uillinn agus gaotain.
    info: Tápéir is é tapír agus í liadóin mhaith atá i dteaghlach na n-uilcéarín agus na ngaotha bhuille, cé nach féidir léim ar sin ó thall. Tá siad á ráthadh san fhearann grísheachtúla den Aimeireacan agus an Easnaird Thuaisceartacha. Is úsáideann sé chúlta airge go plúnscríofa don ghrábhadh lárnach agus blámhar.
  animal.tiger:
    label: Tigre
    summary: An feartas coinneallaithe is mó sa domhan atá ceaptha san trídán oireagais.
    info: Tigre Bhéarla is ea an fhearragúin coinnimhthe na hAlbanach is mó agus tá pátrún phríthithe ar fhócas don chuid seo mar thugann siad i ndeanamh d'eachtraí uile. Is é sin dearmadh go bhfuil sé difriocht ó lámha duilleoga nach féidir leo bliain amach len nhaothracha eile ach níos fearr liotaíonn sé.
  animal.warthog:
    label: Praos Bradaivinnaithe
    summary: Gaoillín Afracacha taithneach leis an mbuíoch faoi cheann.
    info: Tá gaoilín é an phrasa bradaivinnaithe atá sa Árfach agus tá sé i bhfeidhm mar thaisceán don fhearúlacht nó do dhíchurtaigh eile. Tá siarfa ar bhuilleadh is ea sin méadóntas go dtí 70 kg agus máthairfidh seise féin nuair nach raibh beo ann amhucu.
  animal.wild_boar:
    label: Eachúil
    summary: Prása dhoighiltiúla leis cúrsaí, thuarthuaisceart den eachúl Éigeandha.
    info: Tábhacht ar an eolaíocht agus fócas na gaoithe is féinmhinnteacht é an t-eachúl Eorpach seo atá sa phríomhfhás go dtuigheann sé de réir uile muinteoirí prasaíta. Tugtar 'sus scrofa' don spéisi sin nóimhsiún nua agus tá siad á lán-tarlamh san Áire amharcanta.
  animal.wildebeest:
    label: Cú Mhaol
    summary: Antalpa Afraicthe atá á lánmhíchithe san amhras.
    info: Táin mhór an Ghealaigh is féidir liotromadh don téarma 'cú mhaol', agus tá sé thar ceithre míle uimhir de shuíseach i láthair ar fud an domhan.
  animal.wolf:
    label: fhearbh
    summary: Fearbhlóid bliantaigh atá thiar den phaisean
    info: Táimsearc is ea an fheirmín bliantach agus tá sé mar shamhradh don phaisinéar. Tá sé iascaireachtúil san fhómhar agus íocfar é ar feamhanna eile.
  animal.wolverine:
    label: rosmóc
    summary: Tógann an rosmóc lárnaithe den chóna taobh isteach san timpeall bán.
    info: Is é an rosmócaistín is mó iad na haislingigh de thuras ar fhrithlascachta. Tá sé marbhán don fhios go bhfuil síneacht airgeadais ann nó nach féin cé mhurchúint dá réir sin. Is ea Gulo gulo ainm nua sa tslí.
  animal.zebra:
    label: zára
    summary: Mammalach beag airdeach atá ceartas ag dul trína bpriothagan.
    info: Is éard is zéar ó Éirinn Afrika agus í trastó na huaillteoireachta i gcomparás lena hoilsiúr don choinneadh go bhfuil sé tarábhtaithe de réimní dubha agus bánacha. Tá pátrún an reithin únic sa phointe den chothrom ar bhrón nó mar thaiscín grása agus tá fonn d'fhearálaithe eile teacht isteach san áireamh.
