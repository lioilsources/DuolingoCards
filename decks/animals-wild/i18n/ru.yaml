lang: ru
pivot: false
title: Дикие животные
cards:
  animal.elephant:
    label: слон
    summary: Самый крупный сухопутный млекопитающий с хоботом и большими ушами.
    info: Африканский слон — самый крупный сухопутный млекопитающий на Земле. Он использует хобот для дыхания, питья, обоняния и захвата пищи. Слоны живут стадами, возглавляемыми самой старой самкой, и известны своей хорошей памятью.
  animal.giraffe:
    label: жираф
    summary: Самое высокое сухопутное животное с очень длинной шеей.
    info: Жираф — самое высокое сухопутное животное в мире; самцы достигают высоты более пяти метров. Длинная шея позволяет ему доставать листья акаций, которые являются его основным источником пищи.
  animal.lion:
    label: лев
    summary: Большая кошачья хищница, живущая в африканских саваннах.
    info: Лев — большая кошачья хищница, живущая главным образом в африканских саваннах к югу от Сахары. Он живёт в стаях, называемых прайдами; самки охотятся вместе, а заметная грива самца служит для устрашения конкурентов. Лев часто называют «королём зверей».
  animal.wolf:
    label: волк
    summary: Дикая псина, предок домашней собаки.
    info: Обыкновенный волк — самая крупная дикая псина и предок домашней собаки. Он живёт и охотится стаями с чёткой социальной иерархией и общается войом, чтобы обозначать территорию и собирать стаю.
  animal.zebra:
    label: зебра
    summary: Африканский нечетнокопытный с чёрно-белыми полосами.
    info: Зебра — африканский нечетнокопытный, родственный лошади, легко узнаваемый по чёрно-белым полосам. Узор полос уникален для каждого животного, подобно отпечатку пальца у человека, и помогает отпугивать хищников в стаде.
