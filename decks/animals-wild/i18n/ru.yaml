lang: ru
pivot: false
title: Дикие животные
cards:
  animal.aardvark:
    label: Хорыги
    summary: Ночные африканские насекомоеды со свинообразными ртом, которые делают подкопы.
    info: '{"hint":"ночной африканский насекомоядный зверь с свиноподобным рылом (Orycteropus afer)","info":"Капская хорыга - единственный живущий вид отряда трубзубов и у нее нет близких родственников\nНочной образ жизни, мощные когти и липкое языка являются адаптацией для охотни на муравьев и термитов\nЕго заброшенные норы используют десятки других животных\nАнглийское название означает "земляная свинья","label":"Хорыги","summary":"Ночное африканское насекомоядное со свиным рылым, вырывающее норы."}'
  animal.armadillo:
    label: поясничник
    summary: Мелкий хищник со щитом из перьев.
    info: Поясничный ящур - единственный млекопитающий с настоящей костяной бронёй. При угрозе некоторые виды сворачиваются в шарик. Он отличается способностью рыть землю и может выкопать нора менее чем за две минуты.
  animal.baboon:
    label: павиан
    summary: Крупный африканская примата с характерным носом и общественным образом жизни.
    info: Павианы – это род крупных приматов, обитающих в африканских савannaх и гористых областях. Они живут стаями со строгой внутренней иерархией и используют разнообразную систему звукового сигнала и мимики для коммуникации; самцы значительно больше по размерам женской половины популяции.
  animal.bear:
    label: Медведь
    summary: Большое всеядное животное с густым мехом символ силы природы.
    info: Коричневый медведь - крупная хищник суши Европы и Азии массой до 700 кг.
  animal.beaver:
    label: Бобр
    summary: Великий грызень, возведение плотин и мокрих эко системах.
    info: '{"hint":"\u043aрупное животное постройки плотин (Castor сanadensis)","info":"Европейский бобр - второй крупнейший грызун мира. Он строит дамбы из веток и грязи, создавая озера и болота, которые служат домом для многих видов животных. У него плоский чешуйчатый хвост, большие рыжие резцы и водонепроницаемое покрывало. Бобер был уничтожен на территории Чехии, но вернулся за последние десятилетия","label":"бобр","summary":"Крупный грызун сооружает плотины и формирует экосистемы заболоченных земель."}'
  animal.bison:
    label: бизон
    summary: Большой животрепещущий житель Североамериканского континента со шкуркой и густым хвостом.
    info: Американский бизон - самый тяжелый сухопутный зверь Северной Америки.
  animal.buffalo:
    label: африканская гну
    summary: Большое африканское быковидное животное живет стадами; один из членов «Великой пятёрки».
    info: Африканский буйвол является одним из самых опасных млекопитающих Африки и частью так называемой Великой пятерки.
  animal.camel:
    label: верблюд
    summary: Пустынный млекопитающий с горами, выполняющими функцию запасающего масла.
    info: Одногорбый верблюд идеально адаптирован к жизни в пустыне; его горба служит для хранения жира как резервной энергии и не предназначена для воды.
  animal.capybara:
    label: капибира
    summary: Самый большой и спокойный полуводный грызун.
    info: Капибара - самый крупный из живущих грызунов; взрослые особи весят от 35 до 66 кг.
  animal.cheetah:
    label: \u4ec5\u6aeb
    summary: \u4ec5\u6aeb\u66fe\u6bd\u6bef\u6cd\u6ce\u6be\u6bf\u6ba\u6bb\u6da\u6dc\u6dd
    info: '{"hint":"\u4f7fstest \u6c9b \u58ee\u6dcb\u5fc3\u5de5\ufffd\u5df1\u5bc6\u7acb\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd","info":"\u4ec5\u6aeb\u66fe\u6bd4\u6bcd\u6cd5\u6cf0\u5ea7\u6cah\u6cc\u6ce\u6be\u6bf\u6ba\u6bb\u6da\u6dc\u6dd\u6ef\u6ed\u6fb\u6fa\u6ff\u6db\u6af\u6ad\u6ae\u6ab\u6aa\u6ac\u6a9\u6a8\u6a7\u6a6\u6a5\u6a4\u6a3\u6a2\u6a1\u6a0\u6az\u6ay\u6ax\u6aw\u6av\u6au\u6at\u6as\u6ar\u6aq\u6ap\u6ao\u6an\u6am\u6al\u6ak\u6aj\u6ai\u6ah\u6ag\u6af\u6ad\u6ae\u6ab\u6aa\u6ac\u6a9\u6a8\u6a7\u6a6\u6a5\u6a4\u6a3\u6a2\u6a1\u6a0\u6az\u6ay\u6ax\u6aw\u6av\u6au\u6at\u6as\u6ar\u6aq\u6ap\u6ao\u6an\u6am\u6al\u6ak\u6aj\u6ai\u6ah\u6ag"}'
  animal.chimpanzee:
    label: шампани
    summary: Интеллектуальная обезьяна - самый близкий живой родственный вид человека.
    info: Обыкновенный шимпанзе вместе с бонобо является нашим ближайшим животным родственником и мы делимся с ними около 98,7% ДНК.
  animal.coyote:
    label: коийот
    summary: Северноамериканская собака, которая также может жить в городах
    info: '{"hint":"среднего размера североамериканский псообразный зверь","info":"Койот - это приспособленческий псивый хищник обитающий по всей Северной Америки\nВ отличие от волка он адаптировался к жизни рядом с людьми и распространился даже до городов\nУ американских индейцев мифология играет роль изворотливого мошенника\nОн общается войом особенно на закате и ночью","label":"коийот","summary":"Северноамериканская собака, которая также может жить в городах"}'
  animal.deer:
    label: лось
    summary: Грациозное копытное животное с рогами у самцов.
    info: Лесной олень - самый распространенный крупный олень Европы.
  animal.elephant:
    label: слон
    summary: Самый крупный сухопутный млекопитающий с хоботом и большими ушами.
    info: Африканский слон — самый крупный сухопутный млекопитающий на Земле. Он использует хобот для дыхания, питья, обоняния и захвата пищи. Слоны живут стадами, возглавляемыми самой старой самкой, и известны своей хорошей памятью.
  animal.fennec_fox:
    label: фенек
    summary: Самый маленький хищник мира с огромными ушами
    info: |-
      Фенек - самая маленькая кошка из семейства псовых в мире, адаптированная к жизни в пустыне Сахаре
      Огромные уши служат для отвода тела тепла и отличного слуха
      Его почки настолько эффективны, что он может выжить без прямого потребления воды; его получает влагу из пищи
  animal.fox:
    label: лиса
    summary: Хитрая маленькая кошка со светлой коричневато-рыжею окраской и длинным пушистым хвостиком.
    info: '{"hint":"хитрый маленький псевдоканни с густым хвостом (Vulpes vulpes)","info":"Рыжая лисица - самое распространенное псообразное животное мира и выдающийся адаптационный вид, живет в лесах, степях и городах.\nОна известна своей изворотливостью, о которой поется в сказках и баснях во всем мире.\nЛовит мышей, птиц и насекомых; при необходимости собирает даже мусор.\nСамки рождают от четырех до шести детеныщей."}'
  animal.gazelle:
    label: гзеля
    summary: Скоростная и стройная антилипа саванн Африки.
    info: Томсонова газель - одна из самых распространенных африканских антилоп.
  animal.giant_anteater:
    label: гигантский муравьед
    summary: Большой зубастый зверь с длинным носом.
    info: Гигантский муравьед - самый крупный вид этих животных и обитает в Северной и Южной Америке.
  animal.giant_panda:
    label: гигантская панда
    summary: Черный белый медведь из Китая питается исключительно бамбусом.
    info: '{"hint":"черно-белый медведь из Китая","info":"Гигантская панда является эндемиком юго-запада Китай и всемирным символом охраны природы.\nБолее чем на 99% ее рацион состоит из бамбука, хотя анатомически она хищник.\nУ нее есть шестой палец - измененный кость запястья, который служит как большой палец для захвата стеблей бамбуковыми побегами.\nНа планете живет около 1 800 диких гигантских панд."}'
  animal.giraffe:
    label: жираф
    summary: Самое высокое сухопутное животное с очень длинной шеей.
    info: Жираф — самое высокое сухопутное животное в мире; самцы достигают высоты более пяти метров. Длинная шея позволяет ему доставать листья акаций, которые являются его основным источником пищи.
  animal.gorilla:
    label: горила
    summary: Самый большой человекообразная обезьяна из тропической части Африки.
    info: Горилла - самый крупный примат на Земле и самая большая обезьяна в экваториальной Африке.
  animal.hippopotamus:
    label: гиппопотам
    summary: Большой полуводное животное из Африки с огромными челюстями.
    info: Гиппопотам - третий по величине сухоземный млекопитающий после слона и носорога.
  animal.hyena:
    label: гиена
    summary: Пятнистый хищник и мертвоядное животное африканских саванн.
    info: Гиена пятнистая - самый крупный представитель семейства гиеновых и вопреки слухам не является в первую очередь падальщиком; более чем на 60% пищу добывает самовыносит. Самки доминируют над самцами и больше их размером.
  animal.jaguar:
    label: ягуар
    summary: Самый крупный представитель семейства Кошек с розовым окрасом
    info: |-
      Ягуар - третий по величине кошачьи в мире и единственная большая кошка как Северной так Южной Америки
      В отличие от леопарда у него на розовых пятнах есть мелкие точки внутри
      Он хороший пловец и рыболов охотится за рыбой крокодилами и капибарами
  animal.kangaroo:
    label: кенгуру
    summary: Большой аustralianский сумчатый зверь, который скачет по мощным задним ногам.
    info: Краслый кенгуру - самый большой австралийский сумчатый и самое высокого прыжка животное в мире; он может перепрыгивать на расстояние более девяти метров.
  animal.koala:
    label: коаля
    summary: Сумчатое млекопитающее Австралии живущее на дереве эвкалипт.
    info: Коала не является медведем, а относится к сумчатым животным. Она почти исключительно питается листьями эвкалипта, которые для большинства существ ядовиты – у коал есть специальная пищеварительная система. Коали спят до двадцати двух часов в день из-за низкой энергетической ценности этих листьев.
  animal.leopard:
    label: рысь
    summary: Крупное пятнистое животное с полосатой шерстью.
    info: Рысь - самая распространённая крупная кошачья хищница и редкий лазунец, переносящий добычу на вершины деревьев для защиты от гиен и львов.
  animal.lion:
    label: лев
    summary: Большая кошачья хищница, живущая в африканских саваннах.
    info: Лев — большая кошачья хищница, живущая главным образом в африканских саваннах к югу от Сахары. Он живёт в стаях, называемых прайдами; самки охотятся вместе, а заметная грива самца служит для устрашения конкурентов. Лев часто называют «королём зверей».
  animal.lynx:
    label: росомаха
    summary: Средняя дикий кошки со взъерошенными волосами на конце уха.
    info: '{"hint":"среднего размера дикая кошка с кисточками на ушах","info":"Росомаха - крупнейшая европейская дикая кошка.\nОна легко распознаваема по характерным чёрным шерстинкам в виде щеточек на кончиках ушей и короткому хвосту.\nОхотится преимущественно при сумраке или ночью; её основной пищей являются оленицы и зайцы.\nВ Чехии она была вытеснена из мест обитания, но во второй половине XX века успешно перезаселена."}'
  animal.mandrill:
    label: мандрил
    summary: Самый цветной примат мира с голубоватым лицевым рисунком
    info: |-
      Мандрил - самая крупная обезьяна Старого света и наиболее ярко окрашенный примат
      У самцов есть очень живописное голубое лицо с красными элементами, которое служит индикатором социального статуса
  animal.meerkat:
    label: сурикаты
    summary: Маленький социальный хищник пустыни Калахари стоящий на задних лапах.
    info: Суриката – небольшое млекопитающее из семейства кошек, обитающие в Южной Африке.
  animal.moose:
    label: лось
    summary: Самый большой млекопитающий зверь с широкими рогами.
    info: Лось - самый крупный из оленей в мире; самцы достигают высоты более двух метров и имеют лопатообразные рога длиной до 180 см.
  animal.okapi:
    label: окапи
    summary: Лесной родственник жирафа с полосатыми ногами из Конго.
    info: Окапи был впервые описан учёными только в 1901 году и является одним из последних крупных млекопитающих, открытых наукой.
  animal.orangutan:
    label: орангутан
    summary: Крупные красноватые деревянные мартышки Борнео и Суматры.
    info: Орангутан - единственный крупный человекообразная обезьяна вне Африки. Его название происходит от малайского языка и означает лесной человек.
  animal.otter:
    label: выдра
    summary: Игривое полуводный хищник живущий у чистых водоемов.
    info: Речная выдра – это животное из семейства куньих идеально приспособлено для жизни в воде.
  animal.polar_bear:
    label: полярный мёдве́д
    summary: Белый мех идеально изолирует тепло; каждый волосок полый и прозрачный.
    info: Полярный медведь - крупнейший наземный хищник и верхушечный predator Арктики.
  animal.porcupine:
    label: дикобраз
    summary: Большой грызун покрывающийся острыми защитными иглами.
    info: Дикобраз - грызун с тысячами острых полых шипов на спине и боках, которые являются видоизменёнными волосками. Шпили не стреляют как стрелы; при касании они легко отдёргиваются от тела хищника. Дикобраз является крупнейшим африканским грызуном по ночам он выискивает кору деревьев, корни растений.
  animal.raccoon:
    label: Маскированный хищник
    summary: Американское животное с черным лицом и полосатым хвостом.
    info: Северный мускарув живет в Северной Америке и был завезен в Европу, где сейчас активно размножается.
  animal.reindeer:
    label: олень
    summary: Тундровый млекопитающий с парными рогами.
    info: Полярный олень - единственный вид из семейства копытных животных у которого самки также имеют рога. Он обитает в тундре Северной Америки и Евразии и способен мигрировать на тысячи километров. Самоеды используют его как домашнее животное.
  animal.rhinoceros:
    label: носорог
    summary: Массивное животное с одним или двумя рогами на морде.
    info: Белый носорог является вторым по величине наземным млекопитающим после слона.
  animal.sloth:
    label: Ленивец
    summary: Медленное древесное млекопитающее подвешивается ногами головой вверх на корнях деревья.
    info: Ленивец – зверь идеально приспособленный к медлительному образу жизни в верхушках тропических деревьев.
  animal.snow_leopard:
    label: снежный лев
    summary: Редкая большая кошка живущая высоко в горах Средней Азии
    info: '{"hint":"румянка из гор Центральной Азии","info":"Снежный леопард обитает в высокогорной местности Гималайских и тибетских горах а также центраальных азиатских хребтах на высоте от трех до пяти тысяч метров\nУ него исключительно длинный хвост служащий для сохранения равновесия при передвижении по скалам\nПо оценкам их насчитывается всего четыре тысячи шесть с половиной тысчич особей\nЭто одна из самых малоизученных крупных кошек мира","label":"снежный лев","summary":"Редкая большая кошка живущая высоко в горах Средней Азии"}'
  animal.tapir:
    label: тапир
    summary: Большой травоядный с короткими щупальцами, родственник слона.
    info: Тапир - примитивное нечетнопалое животное из семейства носорогов и лошадей, хотя это может быть невидимым на первый взгляд.
  animal.tiger:
    label: тигр
    summary: Наивеликий кошачий зверь мира с оранжевым пруированним узором.
    info: Бенгальский тигр - крупнейший дикий котицый хищник в мире. У каждого особь уникальный рисунок полос на теле подобно человеческому отпечатку пальца. В отличие от леопардов он предпочитает одиночную жизнь и хорошо умеет плыть.
  animal.warthog:
    label: свінобродовий
    summary: Дивоке свинарство із мозолем та шипом на обличчі Африки.
    info: |-
      {"hint":"дикая свинья Африки с клыками на лице (Phacochoerus аfricanус)","info":"Свиньи бородавчатые - это дикие животные из семейства копытных в Северной Америке родственники домашней свиньи.
      Мужчины имеют выросты кожи и волосков на лицах (борода), которые служат для защиты от хищников.
      При убегании они поднимают свои задние ноги как антенна.
      В поисках пищи не используют собственные силы, но занимают норы других зверей","label":"свинообразная бородавка","summary":"Африканское дичкое свинообразное со здоровыми зубами и кожными образованиями."}
  animal.wild_boar:
    label: дикие свиньи
    summary: Дикое птица с клыками - предок всех пород домашнего скота.
    info: Дикие свиньи происходят из Европы и являются предками всех пород домашних свиней. Это умные и адаптивные всеядные животные, которые копают корни, желуди или охотятся на мелких существ. Самочки заботятся об отпрысках в группах.
  animal.wildebeest:
    label: гану
    summary: Мигрирующая африканская антилопа участвует во второй по величине сушеходной миграции.
    info: Гну известен одной из крупнейших наземных миграций в мире; ежегодно более миллиона животных пересекают границы между Серенгети и Мааса Мара.
  animal.wolf:
    label: волк
    summary: Дикая псина, предок домашней собаки.
    info: Обыкновенный волк — самая крупная дикая псина и предок домашней собаки. Он живёт и охотится стаями с чёткой социальной иерархией и общается войом, чтобы обозначать территорию и собирать стаю.
  animal.wolverine:
    label: росомах
    summary: Сильное и свирепое млекопитающее из бореальных лесов.
    info: Росомаха - самый крупный наземный представитель семейства куньих животных. Несмотря на небольшие размеры тела росомак обладает исключительно высокой силой и агрессией; он способен отогнать медведя от добычи.
  animal.zebra:
    label: зебра
    summary: Африканский нечетнокопытный с чёрно-белыми полосами.
    info: Зебра — африканский нечетнокопытный, родственный лошади, легко узнаваемый по чёрно-белым полосам. Узор полос уникален для каждого животного, подобно отпечатку пальца у человека, и помогает отпугивать хищников в стаде.
