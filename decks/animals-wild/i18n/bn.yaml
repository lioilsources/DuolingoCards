lang: bn
pivot: false
title: বাঘা প্রাণী
cards:
  animal.elephant:
    label: হাতী
    summary: বৃহত্তম স্থল স্থাবর প্রাণী, যার কাছে একটি চোয়া এবং বড় কান রয়েছে।
    info: আফ্রিকান হাতী পৃথিবীর বৃহত্তম স্থল স্থাবর প্রাণী। এটি শ্বাস করতে, পান করতে, গন্ধ ধরতে এবং খাবার ধরতে চোয়া ব্যবহার করে। হাতীরা একটি জাতিতে বাস করে যা সবচেয়ে বুড়ো মাদুর দ্বারা পরিচালিত হয় এবং তাদের ভালো মনে রাখার জন্য পরিচিত।
  animal.giraffe:
    label: জিরাফ
    summary: বিশ্বের সর্বোচ্চ স্থল প্রাণী যার দীর্ঘ গলা রয়েছে।
    info: জিরাফ পৃথিবীর সবচেয়ে বড় স্থল প্রাণী; পুরুষদের উচ্চতা পাঁচ মিটারের বেশি হতে পারে। এর দীর্ঘ গলা এটি আকাশের পাতাগুলি পৌঁছাতে দেয়, যা এর প্রধান খাদ্য উৎস।
  animal.lion:
    label: সিংহ
    summary: আফ্রিকার সাভানায় বাস করে এক ধরনের বড় বিড়ালের মতো প্রাণী।
    info: সিংহ হল এক প্রকার বড় বিড়ালের মতো প্রাণী যে আফ্রিকার সাভানায় বাস করে যেখানে সাহারার দক্ষিণে অবস্থিত। এরা প্রায়শই প্রাইড নামক দলে বাস করে, যেখানে মাদুর মিলে শিকার করে এবং পুরুষ সিংহের চুল তার প্রতিদ্বন্দ্বীদের ভয় দেখানোর জন্য ব্যবহৃত হয়। সিংহকে প্রায়শই 'পশুদের রাজা' বলা হয়।
  animal.wolf:
    label: ওয়ালফ
    summary: বাঘের মতো একটি জানোয়ার, যা গৃহপালন করা কুকুরের পূর্বপুরুষ।
    info: ওয়ালফ হল সবচেয়ে বড় প্রাকৃতিক পশময় প্রাণী এবং গৃহপালন করা কুকুরের পূর্বপুরুষ। এটি সামাজিক হাইয়ারার্কি সহ একটি দলে বাস করে এবং শিকার করে এবং এটি তার অঞ্চল চিহ্নিত করে এবং দলকে সংগঠিত করে শব্দ করে।
  animal.zebra:
    label: জেব্রা
    summary: চুনচিত্র-সদৃশ কালো-সাদা রঙের পাখি মাংসাশী প্রাণী যা আফ্রিকার এক প্রকার ঘোড়ার মতো প্রাণী।
    info: জেব্রা হল আফ্রিকার এক প্রকার ঘোড়ার মতো প্রাণী যার কালো-সাদা রঙের প্রতিটি দেহে একটি অনন্য ধরনের প্রতিকৃতি রয়েছে। এই প্রতিকৃতি মানুষের আঙুলের ছাপের মতো এবং এটি একটি দলে শিকারীদের ভুল করতে সাহায্য করে।
