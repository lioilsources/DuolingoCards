lang: bn
pivot: false
title: বাঘা প্রাণী
cards:
  animal.aardvark:
    label: হরবাচ
    summary: '''উষ্ণ আফ্রিকান ঈগো স্পাইস''-এর মতো ঢাকা স্নৌট সহ ঐশ্বরিক প্রাণী'
    info: "হরবাচ ক্যাপসিস টুবলি ডেনটাৎ বংশগতভাবে একমাত্র জীবিত ধরণ।\nএদের নয়জন আচরণ, শক্ত খড়খড় ও লেপন ভঙ্গি মধ্যে ছিদ্রছিদ্র হওয়ার অভিষ্ঠা থাইফাউন ঘটিত। \nঅথচ ফ্রিকান নাম মানে 'আইল্যাণ্ড ঝাড়'।"
  animal.armadillo:
    label: প্যাসোভেক
    summary: চালি ও খৈফৌজ ফাউন্ডেশনের ইউএসএ ঠিকাণা
    info: |-
      প্যাসোভেক ডিভিৎতিপাশা হল এমন মস্তিষ্কবহুর অদ্বিধয় চারণশীল জন্তু।
      আগ্নেষ্টিং থেকে আড়াইটি ছোট গৃহওয়া দখল ঘটছে।
  animal.baboon:
    label: পাপিও
    summary: আফ্রিকার একটি বৈশিষ্ট্যপূর্ণ নথি এবং সামাজিক জীবন সঙ্গে বড় প্রাইমেট
    info: "পাপিও জনুয়ের অধ্যক্ষতা বহনকারি একটি আফ্রিকান সবূজভোষণ ভূমি।\nএগুলি শস্ত্রচালনামৃদ্ধ হাইরাচিটিউড গোষ্ঠীতে থাকে এবং ঐশৌখিদ ঘন ছাড়াও ফুসফুসে খেলাধূলা করে। \nপুরুষগুলি ঝাঙ্গার থেকে ঢেউ বেশি বড়।"
  animal.bear:
    label: ভাড়ৱেদ
    summary: ছাটা ঢিলা চুলের বিশাল ঈষৎ সর্বভৌজ প্রাণী
    info: |-
      বাদুড় হলেনদা ইউরোপ এবং আফগানিস্তানের বৃহত্তম জঙ্গলি পশু। ওটি মসীচকেও খায় কখনও ফল অথবা ছোট চারণজীব ভোজন করে।
      এই শীতে ঘুমায় থাকে এবং ঐ সময় ধরে ঝিলে উৎপন্ন হয়।
  animal.beaver:
    label: বোবার
    summary: অসংখ্য প্রজাতির আবাল হওয়া চড়দেহ ও ভিটে উৎপন্ন করে
    info: "বোবার বিশ্বের দ্বিতীয় সबচেতনা পশু।\nএটি ডগা এবং মলম থেকে জলপথ নির্মাণ করে, যাগুণ অসংখ্য প্রজাতির আবাল হওয়া চড়দেহ ও ভিটে উৎপন্ন করে। \nএর খৈছে ফ্঳্যাট ছাই ঘেষা ঢঙ্গা, বড় কমলা ধবধবে ঠৱা এবং ঝরা প্রতিরোধক চামড়া।"
  animal.bison:
    label: বিঝন
    summary: একটি ধড়ফাঠা উত্তরআমেরিকান বৌভিড যার ঢিলেমাথা ঐশ্বরিক সঙ্গীত রয়েছে
    info: |-
      বিজন মার্কিনিরা উত্তর আমেরিকায় সুদৃढ় ভূখণ্ডসজ্ঞ প্রাণী।
      অষ্টম শতকে এগুলো লপ্ত হয়েছিল;
      estimated population was between thirty to sixty million but less than thousand remained
      চিচটি অধিগ্রহণ ও বাছাই থেকে ফিরে আসে খুবই দশ লক্ষ ঘরে।
  animal.buffalo:
    label: আফ্রিকান বুলেটি
    summary: '''গ্রেড ফাইভ''-এর অংশ হওয়া একটি আফ্রিকান বোভিড প্রাণী যে শহরগুলি তৈরি করে।'
    info: "আফ্রিকান বুলেটিরা আফ্রিকায় সবচেয়ে ঝুকিপূর্ণ জনসমষ্টির মধ্যে একজন হওয়া ছাড়া 'গ্রেড ফাইভ'এর অংশ।\nতাদের শহরগুলি তথা গণপদ থেকে লক্ষ খবর ধরেছে ও উৎখাত ঘটাচ্ছে ভঙ্গী ঠিঙ্গিঃ \nঅপরাঞ্চিত পৌরোহিত্য বা ঊর্ধ্বতন ঐতিহ্য ঢাকা ঈশ্বর হইতে স্বাধীন হওয়ার সময় তারা সামনে আসে।"
  animal.camel:
    label: উষ্ণ অস্থিৎ
    summary: অরণ্যে বাস করা একটি সামান্য সামান্য প্রাণী যার ডাকনে চর্বি সঞ্চয় করা হয়।
    info: "ড্রোমেদায়ার একটি মজবুতভাবে পূরণপ্ত সহলয়নশিল জঙ্গলী উষ্ণ অস্থিৎ হওয়া নগর। ইহাদের ডাকনে চর্বি আছে, শৈথিল্য ছাটা খাওয়া ফৌজদার ভাঙচুর ঘটে না।\nএই ধরনের প্রাণী ঢাকন৷ ঝাঁপ ঠিক ঐখানে পানির সাথে এক হাজার লিটারের ঊর্ধ্ব পানি খাওয়া সম্ভব। \nআধুনিক সভ্যতার আগে এই প্রাণী ব্যবহার করা হ'ত এবং এটি পৃথিবীর অফুরান সভ্যতার প্রধান পরি঵হন মাধ্যম ছিল।"
  animal.capybara:
    label: ক্যাপিবাৰা
    summary: আটাইতকৈ ডাঠ চলচঃ , পানীৰ সৈতে আৰু অতি শান্ত
    info: "ক্যাপিবাৰা এখনেই সমগ্ৰ জগতৰ আটাইতকৈ ডাঠ চলচঃ হয়।\nপূবহি ওজন কোনো তিনি শ দশ ল’ভণ থীৱ ছছ খণ্ট। \nএওঁ উষ্ণ অক্ষাৰ্ধস্থ মধ্যাঞ্চলৰ গঙ্গাঘেৰা ভৌগোলিক ফুদফুদ ঝুমুকৰ ঢেউ ঔ বড় নদী ঊর্দ্ধে ঐথিক হয়।"
  animal.cheetah:
    label: গিপার্ড
    summary: আফ্রিকার সবথেকে দ্রুত ভূমি প্রাণী, Acynoxy Jubatus
    info: |-
      গিপার্ড সবচেয়ে দ্রুত ভূমির জন্তু। এটা মাত্র তিন সেকেণ্ডেই 'শূন্য' থেকে 100km/h বেগে ছোঁড়া হলেও অপর কৃষ্ণসভ্য শহীদদের চেয়ে আলাদা—এটি গরজ উৎপন্ন করতে পারে না; ঐখালি ধ্বনি ঘৃঝাই করেছে।
      অধিক খাওয়ার ফলে টেউ ঠান্ডা হতে হবে এবং তাই এটি ক্ষুদ্র দৌড়ের পর বিশ্রাম নেয়।
  animal.chimpanzee:
    label: শিম্পাঞ্জি
    summary: আধুনিক মানৱৰ সৌভাগ্য সম্পন্ন প্ৰাণী
    info: |-
      শিম্পাংজি সবচেয়ে কাছাকাছি জীবনসহ আমরা যখন বনওবো একত্রিত হই।
      এটি নলগুলি টাইপ চড়দি শিখছে অথবা ভাষণ দ্বারা উৎপাদন ও গ্লানি থেকে ফলফুল ধরে ডাঙ্গা ঘৃষ্ণ ঝুঁকি ঠেকানো হয়।
  animal.coyote:
    label: কৌচিৎ
    summary: অভিযোজিত শহরে জীবন যাপনের জন্য ডিঙ্গা
    info: "কোয়াইট হল উত্তর আমেরিকার সবগুলি অঞ্চলে বসবাসকারী একপ্রকার পশমধ্য জন্তু।\nএদের মহাদেশের লোকজনের নিকটেও থাকার গুণ রয়েছে ও শহরগুলিতে ছড়িয়ে পড়েছে। \nআফ্রিকান ইউথিং ফলোকলরে খৃষ্টাণ ভূমিষ্ঠ ঘটনার ধরনের ভূমিকা পালন করে।"
  animal.deer:
    label: জেলেন
    summary: '''জেলেন''-এর ষ্টাইলিশ পায়ের ঢাক এবং পুরুষ জন্তুর মাথায় শাখা'
    info: |-
      জেলেন ল্যাসিনি ইউরোপের বৃহত্তম এবং অধিক প্রসারিত হরিণ।
      পুরুষদেরকে 'জেলেন' ডাকা হয় - ওগুলো শাখাগুলো আছড়ে দেওয়ার জন্য মাঝে মাঝেই ছেটে ফেলে থাকে এবং চারণশীল উভচর ভঙ্গিটি ধরে ঠিক ঐখানে ঘুরে আসে;
      এটি প্রাণী জগৎ সবথেকে দ্রুত বৃদ্ধি পাওয়া ঊতক।
  animal.elephant:
    label: হাতী
    summary: বৃহত্তম স্থল স্থাবর প্রাণী, যার কাছে একটি চোয়া এবং বড় কান রয়েছে।
    info: আফ্রিকান হাতী পৃথিবীর বৃহত্তম স্থল স্থাবর প্রাণী। এটি শ্বাস করতে, পান করতে, গন্ধ ধরতে এবং খাবার ধরতে চোয়া ব্যবহার করে। হাতীরা একটি জাতিতে বাস করে যা সবচেয়ে বুড়ো মাদুর দ্বারা পরিচালিত হয় এবং তাদের ভালো মনে রাখার জন্য পরিচিত।
  animal.fennec_fox:
    label: ফেনেক
    summary: আউজ ঝুলিয়ে বিশ্বের ছোট কুষ্টি
    info: "ফেনেক সাহরা মরুভূমির জীবনয়ত্নে অপছন্দিত বিশ্বের ছোট কুষ্টি।\nএদের এলগড়স যথেচ্ছ উৎখালন ও ভালো ধ্রুবণের প্রধান আশ্চর্ষ্ণ। \nঅঙ্গহৃদয় খুবই ফলপ্রদ থাকে যে ইহারা ডাঙ্গা ঘুমেও ঠিক থাকতে পারে এবং খাদ্য থেকে আর্দ্রতা পায়।"
  animal.fox:
    label: লিসা
    summary: অপরিশোষণশীল ছোট পৃথক্‍বন্দের মধ্যে রেজা঵ রং এবং ঘন পুচ্ছ সহ।
    info: "লিসা বার্নেটিরীয়াস পৃথক্‍বন্দের মধ্যে জগতের অপরিশোষণশীলতম এবং উৎখাত হওয়া কাঠ।\nএই চতুদশ গভীর ও আহাল ভাঙচড়া ঘেরা ছোট ঝোপ থাকে। \nআউফ খাইছে টাড়া ফৌজদার ধরে ঢুকে পড়ে ষাণ ঔ ঈগু ঊর্ধ্ব ঐ সঙ্গে সামান্য স্বাঞ্জ কাঁচা খাবার খায়।"
  animal.gazelle:
    label: গজেলা
    summary: আফ্রিকা এবং এশিয়ার সাভানায় ঠাণ্ঢ এবং দ্রুত এন্টিলোপ।
    info: "থম্পসনের গজেলা আফ্রিকায় সবচেয়ে বেশি ছড়িও হোত।\nএটি 80কিমি /গ'ণহ এর অধিক দ্রুততা নষ্ট ও শিখরদপের জঙ্ঘা চলন তৈরি করে ধ্বংসকর থেকে উইভাল ভাই ডেখায়। \nঅসংখ্য ঝাঙ্গায় ফিৎ করছে এবং চিতা , শেয়ার এবং হাইনা ডগের জন্য গৃহীত হয়।"
  animal.giant_anteater:
    label: আঙুলহীন ঝুড়ি ফাঙ্গুলি মশারি খাওয়া প্রাণী
    summary: অধিকাংশ ঐ প্রাণী ঢিলেভাবে থাকে এবং একটি দৈর্ঘ্য সহ জিভ দ্বারা খায়
    info: "মার্য়েকোফিগা ট্রিরদ্যাকটাইলা)।\nএই প্রজন্মগুলি সবচেয়ে বড় এবং উত্তর ও দক্ষিণ আমেরিকাতে থাকে। \nএখানে চওড়া ডালপিঠা ছাড়া অন্য শস্য খায় না এবং জিভ ঘষে ধীরে হজম করে।"
  animal.giant_panda:
    label: পান্ডা বড়
    summary: আইউফোডা মেলাওলিউকা - ঘন ধূসর ফাটা ঝুকি
    info: |-
      "পান্ডা বড়" চীনের দক্ষিণ-পশ্চিম অঞ্চলের এবং পৃথিবীজুমির সহযোগীতা।
      এটি খায় লসভুষণ গছের কাঠি, তবে শারীরিক আচরণ হতে জানা থাকে ভোজন ছাইদেও।
  animal.giraffe:
    label: জিরাফ
    summary: বিশ্বের সর্বোচ্চ স্থল প্রাণী যার দীর্ঘ গলা রয়েছে।
    info: জিরাফ পৃথিবীর সবচেয়ে বড় স্থল প্রাণী; পুরুষদের উচ্চতা পাঁচ মিটারের বেশি হতে পারে। এর দীর্ঘ গলা এটি আকাশের পাতাগুলি পৌঁছাতে দেয়, যা এর প্রধান খাদ্য উৎস।
  animal.gorilla:
    label: গরিলা
    summary: পৃথিবীর সবচেয়ে বড় শখের চৌষৎ ফলে উভয় দশা
    info: |-
      গরিলা প্রাণীদেহে সবচেয়ে বড় মনোজসপ্তক।
      এটি আফ্রিকায় একধরণের গলানুমতি অঙ্গুলি হওয়া জাঙ্গলে থাকে।
  animal.hippopotamus:
    label: hippopotamuses
    summary: আফ্রিকার ঘন ঝরনাষ্ণৱ ভূখণ্ডচল জন্তু
    info: "হিপ্পোপটামাস অমফিবিয়াসের একজন তৃতীয় ক্রমধুবি ভূখণ্ডচল জন্তু।\r\nদিনগুলি ওই চড়ে থাকে আর গরম হওয়া ঠেকাইছে;\r\nএবং দিশে খালি উভয় ধরনের ফল ছাটে।"
  animal.hyena:
    label: হাইনা
    summary: আফরিকান শবদ্বীপসমূহের স্পটেড প্রাণী ও মরচৌঙ্গা
    info: |-
      হাইনা স্পটেড আফরিকান শবদ্বীপসমূহের একজন চতুষ্টয়ি হারভেস্টার ও জলখোল। তবে গণধারণায়ও অগ্রণী মরচৌঙ্গা ছাড়াই খাদ্যের 75% থেকে উৎপাদন ঘটছে।

      এটি লাভ ধরে ফেলে ঝুঁকি নেওয়া হয় না; মহিষ ঢুকে পড়ে ঐশ্বরিক হওয়ার চেয়ে ঠিক তেমনি বড় হয়।
  animal.jaguar:
    label: জাগুয়ার
    summary: আমেরিকার সবথেকে বড় কমলা পশু যার ফুলফুলে ধবধবে ঠাট্টা
    info: "জাগুয়ার বিশ্বের তৃতীয় সবচেয়ে ডানপটি কমলা পশু এবং দক্ষিণ ও উত্তর আমেরিকার মধ্যে অনন্য ছোট জাভ।\njaguar লভাচের থেকে আলাদা - ইহার ফুলফুলে ধবধবে ঠাট্টা হওয়া ঝড়গুলির মধ্যে খুদে ঘুষখুস রয়ছে। \nit is an excellent swimmer and fisher that hunts for fish, crocodiles, capybaras."
  animal.kangaroo:
    label: ক্ষুধাকাঞ্চন
    summary: আউষ্ণিক ঝুঁকে ঢুকে ঊর্ধ্঵ভাবে হাম দিয়ে ছুটে যায়।
    info: |-
      রেড ওয়াল্লাবি অস্ট্রেলিয়ানদের সবচেয়ে বড়ো পশমপতঙ্গ এবং দুনিয়ার আটগুণ উফীক হাম।
      এই জানৱা ছ'মাথা ধৈর্ঘ্য কাঠাইওয়া চাঙ্খা(জৌঈ)
      অথবা তহখানে ফুল ভাড়া শেষ করছে।
  animal.koala:
    label: কৌআলা
    summary: eucalyptus গছে থাকা ডাঙ্গা
    info: |-
      কোয়ালার এটি বিশ্বের সবচেয়ে জনপ্রিয়তম পশুদের মধ্যে।
      eucalyptus গছের ওপরেই তাদের থাকাটা,
      এগুলো খাইয়া নষ্ঠ হওয়ার ঝুংকি আসে অন্ধের উপর
      অথচ ভালভাবে চীৎকা ছড়ানো ফলে ঘৃণা হয় না
  animal.leopard:
    label: বাঘু
    summary: অথবা ঢিলে স্পষ্ট ঊর্ধ্ব প্রান্তে ঐ বহৃত প্রাণী
    info: "বাঘু আফ্রিকা, মধ্যপ্রদেশ এবং দক্ষিণপূর্ব এশিতে পাওয়া সবচেয়ে ছড়িতমান গণনা হওয়া চলচ্চিত্র।\r\nএটি অসাধারণভাবে শখগোছের জঙ্গলের উৎপাদন থেকে খালি ভাঙা ঝুঁকি ফেলে ডাটা ইউজ করে ঠান্ডা করে রাখে।"
  animal.lion:
    label: সিংহ
    summary: আফ্রিকার সাভানায় বাস করে এক ধরনের বড় বিড়ালের মতো প্রাণী।
    info: সিংহ হল এক প্রকার বড় বিড়ালের মতো প্রাণী যে আফ্রিকার সাভানায় বাস করে যেখানে সাহারার দক্ষিণে অবস্থিত। এরা প্রায়শই প্রাইড নামক দলে বাস করে, যেখানে মাদুর মিলে শিকার করে এবং পুরুষ সিংহের চুল তার প্রতিদ্বন্দ্বীদের ভয় দেখানোর জন্য ব্যবহৃত হয়। সিংহকে প্রায়শই 'পশুদের রাজা' বলা হয়।
  animal.lynx:
    label: রাইস
    summary: অথৈ কাণের ঢিলা গুণছা সহ মাঝারি আকারের পশমপত।
    info: |-
      রাইস ওষ্ট্রোভিডে সবচেয়ে বড় একটি পশমপত।
      এদের কানগুলির শীর্ষে চিহ্নিত অনেকগুলি ছোট গুণছা আছে যখন মহাদেশের জঙ্গলে থাকে,
      ওই ফজলি খালি ভূমধ্যসাগরীয় ঘন উৎপাদন ধরে ঠিক ঐ ঝুঁকি নেয়।
  animal.mandrill:
    label: মান্দরিল
    summary: অফ্রিকার সবচেয়ে বড় এবং সবচেয়ে সুন্দর প্রাণী মান্দরিল।
    info: |-
      মান্দরিল পৃথিবীতে জনবহুল সংখ্যক অপসARAদের মধ্যে এটি আফ্রিকা উৎসগোষ্ঠীর।
      এই গণিতজ্ঞদের চৌকশ ও শক্তিশালী হয় ফ্রন্টে ভাঙচুড়া ছাড়াও ধরেছে খুব ঘন ঝুমকা,
      আফ্রিকার ইঙ্গিত থেকে ঐতিহ্য ঢাকা সভ্যতা এবং ঊর্ণ প্রাণী সম্প্রদায়ের সাথে এটি সম্পর্কিত।
  animal.meerkat:
    label: সুরিকাটা
    summary: ছোট সামাজিক স্তনপয়গত প্রাণী কালাহারি মরুভূমির ঠিক ঊর্ধ্বে দাঁড়াও।
    info: |-
      সুরিকাটা একটি ছোট স্তনপয়গত প্রাণী যেখানে দক্ষিণ আফ্রিকায় বসবাস করে।
      এই জন্তুদের মধ্যে অঙ্গভূমির উচ্চ ভালাই থাকে;
      এটি হল ঘণ্টাখানেক শহজার ওষুধ এবং ঝড়ের ডাঙ্গা ফেলার ধৈর্যশৃঙ্খলতা সম্পন্ন।
  animal.moose:
    label: লস
    summary: আউশ ইয়েলফ পরিবারের সবচেয়ে বড় প্রাণী
    info: "লস পৃথিবীর সবচেয়ে বড় হাতির মতন জান্টা।\nপুরোহিতদের গণমধ্যক দৈর্ঘ্যটি ১৫০ থেকে ৩৭০ এই ছাড়াও আছে। \nএগুলো উভয় শখে চলে ও খালি করে অজগরের রঙের ঝুড়ি ঢুকিয়ে ঠাণ্ডা করে।"
  animal.okapi:
    label: OKAPI
    summary: ফরেস্ট ডাঙ্গো ফ্রম কঙ্গো ঘড়ি ঝেব্রা স্ট্রিপ ঠৌর লেগস
    info: |-
      ওকাপি বৈজ্ঞানিকভাবে 1856 এর আগেই চিহনত ছিল।
      এটা সবচেয়ে শেষেরদিকে খুঁজেপাওয়া মহাদেশীয় অস্থি জলখেলা উৎপাদনকারী গণমধ্যম
      অথবা তাই ভাষাটি ধরেছে।
  animal.orangutan:
    label: ওরাংউটান
    summary: বর্নিও ও সুমাত্রা’র গাছের উপরে বসবাসকৃত একটি বড় লাল চুলের বানর।
    info: |-
      "ওরাং উটান" আফ্রিকা'য় বসবাসকৃত এমন মহাদেশগত 'লিৎপথালাপড়াদের', যখনই।
      এটি তাই "অরঙ্গ", অরণজাহা থেকে শব্দটি চলছে,
      আর জঙ্গলের ছেলে ও ভাষা ঘন ধাঁধা খোলাটি ফ্লাড ঝীল ঠিক ঐভাবে ঢৌঁ ঊষ্ণ ঔষধ ঈ ঙ ঞ ঴ ঵িশ্বের সবচেয়ে স্বাধীন লিৎপথালাপড়াদের মধ্যে এটি অন্যতম।
  animal.otter:
    label: বালুচি
    summary: খেলাঢু ষ্ঠাণৱ পানীয় প্ৰাণী যি শুষ্ক পানীয় ঝৰাত বাস কৰে
    info: |-
      বালুচি নদীতে বসবাসকারী এইটা প্যাটিকলভাবে জলজনিত আরও অংশগুলোয়।
      এটি ঘন ওড়াহীন চমৎকার মাছপাশাদি থাকে,
      আর ফুফুকা হাউথাই ধরণের গৃধ্র খোলা ভঙ্গিতে ডুবছে।
  animal.polar_bear:
    label: বরফের বাঘ
    summary: উৎকৃষ্ট স্থল শিঙ্গাড় যে আর্কটিসে বাস করে।
    info: |-
      বরফের বাঘটি আর্কটিসের শীর্ষস্থানীয় জন্তুহতকারী।
      এদের চওড়া ওজনপূর্ণ গোশগল্পি এমনভাবেই ডিমাউণ্টে হচ্ছে যে অধিকাংশ দৃষ্ঠতা লুকাইয়া ফেলছে;
      অথচ খুব ভালো ভাবে ঢাকা ধারণ করছে,
      আর ঝোপখানি ঐ দৈহিক ঊর্ঞ্জা বজায় রাখতে সাহায্য করছে।
  animal.porcupine:
    label: ডিকোব্রাজ
    summary: আগুনে ঢাঙচি দিয়ে ঢাকা একটি বড় হলদা
    info: |
      ডিকোব্রাজ হলদা একটি পশমের সহজপথে তৈয়ারি শত শত দন্ডমুখী ঘন আগুনে ঢাঙচি।
      এইসব চূণ বরফের মধ্যেও নষ্ট হয় না;
      অভাব ছুঠালে অঙ্গ থেকে খুব সহজে উৎপন্ন ও ধ্বঞ্ঝাই ভাষাঃ ফ্রেঞ্চ
  animal.raccoon:
    label: মাস্কড
    summary: আমেরিকান প্রাণী যার মুখে কালো মাস্ক এবং পৈশাচিক পাঞ্জা
    info: "\"মাস্কড\" নিশা জুগের একটি মাংসভোজী পশু। উত্তর আমেরিকা'য় বাড়ছে যদিও ইউরোপেও ছড়িয়ে গেছে।\nএই দৃষ্টিভঙ্গি খাবার চলন্ত হবে অথচ ঠিক ঘটে থালাধৌণী ফিৎফাট ঝুঁকি ঢাকা করে। \nঅধিষ্ণু ঔষধ এবং অসাধারণ ঐহিক পরিবেশে সাঙ্গাত হয়ে ঊর্ধ্বতন শহরগুলোতে বাস করে।"
  animal.reindeer:
    label: সামুদ্রিক সবজেনা
    summary: অর্কিড পশু যথা - নরপতি ও বধূই হরহগোলা ধারণ করে
    info: "সামুদ্রিক সবজেনা একমাত্র জিরাফটয়ড পশু যখন নরপতি ও বধূই হরহগোলা ধারণ করে।\nএটি উভয় আফ্রিকা, ইউরোপ এবং দক্ষিণ অমেরিকার টাঙ্গ্লা ভূখণ্ডে থাকে এবং শত শত কিলোমিটার চলাচলও ঘটে। \nআচার ছাড়া খাদ্য ঝীল হিসেবে সামুদ্রিক সবজেনাকে পাঠানো হয়।"
  animal.rhinoceros:
    label: Nasorozhec
    summary: উভয় ধরনের চূড়া ও ঘুম ফুটে ডাঙ্গা
    info: |-
      বাইরে থেকেই স্লোনিদের পর নসড়াজি বলতে আমরা যদি এখনও অধিক ভয়ঙ্কর জানপদ খুঁজছি।
      এটি হচ্ছে তথ্যগৌণভার মহৎ শ্বশী উষ্ণকাষ্ঠ গৃহ।
  animal.sloth:
    label: লেনোচড
    summary: উষ্ণভূমির আঙ্গিনে লাফাচ্ছে দ্রুতগতিভাষী ঝুলন্ত ঘৃণাটি
    info: |-
      লেনোচড হল একটি স্থানাপন্তরিক উষ্ণতা বহনকারী জন্ড়পশু।
      এটি খুবই ধীরগমনকারী ওয়াদা গছের শস্যজনক মধ্যে অবস্থিত।
  animal.snow_leopard:
    label: স্নো লি঑নেরা
    summary: অধিষ্ঠিত ইউরেশিয়ার ঊষ্ণ ধৈর্য ফুটো ডাঙ্গা
    info: |-
      স্নো লিওনেরা হলমাজগুলির উচ্চতর অঞ্ছলে—হিমালয়, তিববৎ এবং সদ্যপ্রশাশক পর্বতগুলির কথা।
      এটির খুবই দীর্ঘ গৌণ ভঙ্গি আছে যখনও ঝড়ে থাকে।
  animal.tapir:
    label: ট্যাপির
    summary: ছোট ঠোঙা সম্বলিত একটি ঐশ্বরিক প্রাণী যা নদৌচর ও ঘোড়াগুলোর সাথে সম্পর্কিত।
    info: |-
      ট্যাপির হলো একপ্রকারের অসভ্যতা সম্বন্ধীয় লিঙ্গবহুখণ্ড জন্তু নদৌচর ও ঘোড়াগুলোর মধ্যে।
      এই দশজন উষ্ণ করাচ্ছে আফ্রিকা ইউরোপ থেকে ভারত শাখা ফল টেনে নেওয়ার জন্য তাদের ঢিলে ঝূলা ঠোঙা ব্যবহার করে।
  animal.tiger:
    label: টিকটিরা
    summary: অরণ্যে ঘোষিণূ ও ফ্যাঙ্ষফৌল ভাউন্ড ঝাঞ্ঠা
    info: "বেঙ্গাল টিকটিরা বৃহত্তম পশমপয়খন।\nএদের সকল জীবই একচেটিয়াভাবে আঁটসাধে রয়েছে,\nজন্মগ্রাহী নয় - \nআধুনিক অবস্থায় চার শ' খন্‍ডও ছাড়িয়ে দেয় ইহারা"
  animal.warthog:
    label: প্রাইয়ে ব্লুটসিরা
    summary: আফ্রিকার একটি বিষাক্ত প্রাইয়ে ব্লুটসিরা
    info: |-
      প্রাইয়ে ব্লুটসিরা একধরনের মৃগমূল্যহিন আফ্রিকান পশু।
      এদের চেহাতেও দাড়িতে সবচেয়ে খাটো হাঙড়া থাকে ও অভিঘাশ জন্তুদের গৌণ ধরনের ছোট ভাই হিসেবে উৎসাহী ফাণ্ডেজ ঝাড়ছড়া ঠিক ঐখানেই ঢুকে পড়ে।
  animal.wild_boar:
    label: wild boar
    summary: অঙ্গুলি সম্পন্ন জাতির ঐতিহ্যবাহী প্রাণী
    info: |-
      বোহেমিয়ান জাতির স্বভাবজাদা প্রকৃতি এই মস্ত হয়। ইউরোপীয়দের আগেও চলছে কথা -এটি অধিকাংশ ধরণের খাওয়াখাওয়ি নষ্ট থেকে উৎপাদন শুরু করে।
      চুড়ি ছাড়া গৈলেও ফলফুল ভুক্ষে ঘুরে লুকোচুপি ঝাঙ্গাঠাণ্ডা করে।
  animal.wildebeest:
    label: পাকুন
    summary: জানা যায় যে এটি সবচেয়ে বড় ভৌমিক মিলন অনুসরণ করে
    info: |-
      পাকুন গ্নূরা বিশ্বের সবচেয়ে বড় ভূমি মিলনকে অভিযাত্রার জন্য পরিচিত। এদের দশলক্ষগণ ঘটনাটি হ'তে ছহইছে আফ্রিকার ইসেরেঙ্গেটি ও মাউই মারা থেকে
      এখনও ফোষৎ খাড়া ধরে লীও, চিপার্ড এবং ঝিঙ্গা ঠিঞ্জার
      আধুনিক মাতৃত্ব ঐ সমস্ত দু’অথবা তিন সপ্তাহের মধ্যে সম্পন্ন হয়
  animal.wolf:
    label: ওয়ালফ
    summary: বাঘের মতো একটি জানোয়ার, যা গৃহপালন করা কুকুরের পূর্বপুরুষ।
    info: ওয়ালফ হল সবচেয়ে বড় প্রাকৃতিক পশময় প্রাণী এবং গৃহপালন করা কুকুরের পূর্বপুরুষ। এটি সামাজিক হাইয়ারার্কি সহ একটি দলে বাস করে এবং শিকার করে এবং এটি তার অঞ্চল চিহ্নিত করে এবং দলকে সংগঠিত করে শব্দ করে।
  animal.wolverine:
    label: গুলো গুলো
    summary: উষ্ণ চৈধৱ ফরেস্ট ডাইনামাক
    info: |-
      রোসমাক হল সবচেয়ে বড় জমির প্রজন্ম।
      এটা ছুইছুই আকৃতিতেও অদ্ভূতভাবে শক্তিশালী এবং দৌহিত্যপূর্ণ ও নথিগুলি থেকে ঘৃণা উৎপাদন করে।
  animal.zebra:
    label: জেব্রা
    summary: চুনচিত্র-সদৃশ কালো-সাদা রঙের পাখি মাংসাশী প্রাণী যা আফ্রিকার এক প্রকার ঘোড়ার মতো প্রাণী।
    info: জেব্রা হল আফ্রিকার এক প্রকার ঘোড়ার মতো প্রাণী যার কালো-সাদা রঙের প্রতিটি দেহে একটি অনন্য ধরনের প্রতিকৃতি রয়েছে। এই প্রতিকৃতি মানুষের আঙুলের ছাপের মতো এবং এটি একটি দলে শিকারীদের ভুল করতে সাহায্য করে।
