lang: fa
pivot: false
title: حیوانات وحشی
cards:
  animal.aardvark:
    label: خرگان
    summary: جانور شب‌زا آفرواس با صفت پرتقالی بدن در حال سوراخ انداختن.
    info: خرگان کاپسکی تنها نژاد زنده از راسته توبولیدنتاتا است و هم‌خون قریب به او وجود ندارد. سبک شب‌زنده، موهای ضربت دهنده و زبان لطخت برای شکار مورچه و خوزستان مناسب است. حفره‌های فراموشش توسط ده‌ها نوع جانور دیگر استفاده می‌شود.
  animal.armadillo:
    label: pasovec
    summary: مازن بالغ سبک در لباس زره‌ای از مقواهای استخوان.
    info: پاسوول ده‌نواری تنها مامان با زره واقعی از استخوان است، بعضی نژادها در صورت تهدید به کُرک خود را فشرده می‌سازند. پستاندار برجسته‌ای برای حفر قرارداده شده و قادر به حفاری جالگاه در عرض کمتر از دو دقیقه است.
  animal.baboon:
    label: پاڤیان
    summary: نخسْتِين بزرگي افريقي كه دَمبل ويژه اي و زندگي اجتماعي دارد.
    info: پاڤیان، جنس حيوانات نخستین بزرگ افریقا هستند که در ساوان و مناطق سنگلاخت زندگی می‌کنند. آنان به صورت خوشه‌ای با نظام رتبه‌بندی شده زندگی می‌نموده و از طریق دامنهٔ فراوانی از پدیدارها و حرکاتهای عضلانی برقراری ارتباط می‌جوشند. مردان قابل توجهی بزرگتر از اناث است.
  animal.bear:
    label: медوید
    summary: جانور پستاندار عمومیخوار با مو ضخم، نماد قدرت طبیعت.
    info: ببر قرمز، بزرگ‌ترین مخلوق خشکی اروپا و آسیا است که وزنش تا ۷۰۰ کیلوگرم نمایان دارد؛ غذتش شامل ماهی، سбит، عسل و جوندگان رنده شود. در زمستان به خواب فصلی می‌رود و همزمان با او مادران مثلثت می‌زنند.
  animal.beaver:
    label: ببر
    summary: حيوان خوراك فرساني بزرگ كه براساس طبيعت زيردرية را ميبناid.
    info: ببر اروپایی دومین حيوان خوراک فرس سرزمين است كه مي‌سازد جلوگيري کنند و با شاخ، رس يا مواد ديگر تالابها را بوجود آورد؛ در نتيجه يك منطقه زيستي جديد به وجود ميآيد. او بالعکس نخود هاي قرمزرنگش و ذيل پوشيده شده با لخته اي مثل صفحات.
  animal.bison:
    label: بیزان
    summary: نوع غولپیک دندانمارور شمالآمریکائی با بالشت زیرسر.
    info: بیزان آمریکایی سنگین‌ترین حیوان خشکی اقیانوس پاسifik است و در قرن نوزدهم تقریباً منقرض شد؛ حدود سهاه به هزار عدد باقی ماند که بعداً برنامه‌های محافظتی جمعیتش را به حدود صد هزارتا برساندن.
  animal.buffalo:
    label: بوفالو
    summary: برفلاور بالغ غرب آفریقا، واحد مهم «چندگانه».
    info: بوفالو آفریقایی به همراه جمعیت‌های بسیار زیادش، از پرخطرترین حیوانات خاکستر و عضو «پنجگانه» است؛ مجموعهٔ دامنهای نادرست که در مقابل لئون قدرتمند مقابله موفقی را فراهم می‌نمودند. سروصداها با تعداد صدها الی هزار عدد وجود دارد و قادر به شلختن لئوس در طول عمل مشترک برای دفاع است.
  animal.camel:
    label: فيل
    summary: حيواني خشكاري با همبهايي كه مثلان نفت را ذخيره ميكني.
    info: |-
      کamel اُنواگلیا (درومداروس درومادریس)، حیوان تالش‌زده برای زندگي در سراچه؛ همبه او نفت را ذخيره مى کند، نيست آب به عنوان منبع انرژي است.
      او قادر است بيشتر از يكصد ليتري آب فوراً بنوش و بي شمار هفته بدون جذب مايعات زندي باشد.
      قبل از حدود ٣٠٠٠ سال پيدابيندازي كرد شد و مهمترين وسيله نقليه تمدنهاي صحرايي است.
  animal.capybara:
    label: كاريبارا
    summary: بيسيمرين ديدين فرسوده با طبعي آرام.
    info: کاپیبارا بزرگترین حيوان خراش‌دندان زنده است؛ بالغين آن بين ۳۵ تا ۶۶ كيلوگرم وزن دارند و در مناطق معتدل جهت جنوب امريكا، به ويژه نزديك رودخانهها، لايه هاي آبى و مرطوب سكونت دارند.
  animal.cheetah:
    label: gepard
    summary: سرعت بالاترين حيوان خشك زياني فراتر از ١٢٠ كيلومتري بر ساعت.
    info: گепارد سریع‌ترین حيوان زميني است كه در عرض سه ثانيه از صفر به ۱٠٠ کيلومتري بر ساعت ميرسد. تفاوت آن با بقايۀ شيمپاين های بزرگ، عدم قدرت بلندكردن و جاي ان ريزيدن است. بدنش نازك و دستکشهايش غيرقابل پوشيده شدنه، كمكي براي سريعيت نيستند.
  animal.chimpanzee:
    label: شامpanze
    summary: ماهر ذهنی بالا، خواص غریبهٔ زنده انسان.
    info: شامپانز با ساقی وحید به‌عنوان نسبوهای زنده ما در حیات جا می‌گیرند، تقریباً ۹۸٫۷٪ اسک dna را با آنان مشترک دارم. شامпанزها ابزارهایی مثل فرع برای صید کرم‌تربولو استفاده می‌کنند و قادر هستند پایه‌های زبان علامتی را بیاموزند.
  animal.coyote:
    label: کویوت
    summary: جانور شاهزادۀ آمریقای شمالی که برای زندگی در شهرها مناسب است.
    info: کویوت جانور شاخ‌دار نزدیک به سگ است که در تمام آمریка شمالی زندگی می‌کنند، این حیوان تا حدودی شبیه وحشی به شهرها هم پخش شده است، نقشه مهمتری را در بافتن داستان فرهنگ مردم عرب آمریکایی ایفا می‌کند و بطور خاص در غروب وشب صدا می‌زنند.
  animal.deer:
    label: غلط
    summary: حيوان ظريف با پاهای تومندار؛ مرد دارای قرن است که هرسال شسته می‌شود.
    info: |-
      جَلِن لُغْویی بزرگ‌ترین جَلِن اروپا است و پراکنش فشرده‌ای دارد
      مردانه‌ها، که به آنان «جلين» مي‌شود، قرون حمل مى‌كنند كه هر سال شسته ميشوند و رشد مجدد مى يابند؛ در بين بافت‌های زادآورانه، سريعت بالاي خويش مشاهده مي‏شود
      در مايهٔ توليد مثل نيز صداي بلند و عميق برخاسته و مناقصات مردياني را حول عروسها(زن‌ها)، انجام مي‍دهند
      در جمهوري چك، جلن معالم ملي الارض غني از طبيعت است.
  animal.elephant:
    label: خراف
    summary: بالاترين حيوان خشك، با پوچري و گوشهاي بزرگ.
    info: '{"hint":"خزیل افرواس با بدن دراز","info":"سگ سرکه آفریقایی بالاترین حيوان خشكي زمين است، کليشه‌اش را به عنوان دستگاه تنفس و جذب غذا مي‌نامند. فرسدگى نيز توسط يك قطعه سنديار كمتر شناخته مي‌شود.","label":"خراف","summary":"بالاترين حيوان خشك، با پوچري و گوشهاي بزرگ."}'
  animal.fennec_fox:
    label: فنک
    summary: پستاندار پسرخال با گوش‌های عظمی
    info: فِنک کوچک‌ترین حیوان تاجور با ساک مخصوص به زندگی در بادهای صحرانما است، اذعان دارد عظیم و شنوائی خوبش برای رها کردن حرارت بدنش مهم هستند. نieres فَلزد آب بدون جذب مستقیم قابل مقابله است؛ او مرطوبیت لازمش رو از غذا می‌بره.
  animal.fox:
    label: ليшка
    summary: حيوان ذهن بالا يك جوندي با مناطق بلند و لباف و موهاي سفيد
    info: |-
      سگ معمولی اکوئه دنده سرخترین جانور پسوید درجه و به خوبی توانایی انطباق با محیط را دارد، که در جاهای مختلف مثل جنگل ها، مرزها و شهرستان‌ها زندگی می‌کند
      در تمام نقاط روشن است که هوشمند بودنش موضوع قصّه‌های فانتزیست و شعرهاس
      ماوس، طاووس و حشرات روزمره را صيد مي كنيم؛ وقتى نيازي وجود داشت برروي ضرغام يا مواد غذائي ديگري متكي ميشيم
      زنوي(ليشكاي مايع)چهارتا شش عدد جوجه ميزنم
  animal.gazelle:
    label: گوزیل
    summary: سبک و سریع فانتروپ الافاسفرا و آسیائی
    info: گوزیلا تومبسون از پرجمعیت‌ترین نژادهای گوزила در آفریقا است و میتواند به سرعت بیش از هشتاد کیلومتر بر ساعت دست یابد، حرکات خاصی را انجام میدهد که به عنوان علامت وجود شکارچیان عمل میکند؛ جمعیتهای زیادی از این حیوانها باهم زندگی میکنند و مهمترین غذای لئوپارد، لاشه و موشک مرداری است.
  animal.giant_anteater:
    label: سرسنگ عظیم
    summary: بزرگترین نوع بدون دندان با ردۀ بلند و زبون لطخت.
    info: |-
      سگ مورچه‌خوار بزرگترین نژاد سگاندوز است و در آمریکای مرکزی و جنوبی زندگی می کند، دندون ندارد؛ با انگشت تاج قوی خود به مناطق پر از موش‌ماهر حمله می کند و موشهار را با زبان بلند لطخت جمع می کند
      در طول شبانهروز حداقل ۳۵ هزار عدد موشمار و ماخر مختلف را مصرف می کند
      مادرها فرزندان خردمندانه را روی بالاتنه خود حمل می کنند
  animal.giant_panda:
    label: پاندا
    summary: خفاش قهوه‌ای با منظور خاص از چین.
    info: پاندا بزرگ در جنوب غربی چین زندگی می‌کند و نماد جهانی حفاظت از طبیعت است. تقریباً ۹۹٪ رژیم غذایی آن شامل ساقه برنج کاوشان است، هرچند فساتومی شناسایی می‌شود؛ دست آخر به عنوان پسر انگشت برای محصور کردن ساقه برنج عمل می‌کند. فقط حدود ١٨٠٠ عدد از این موجودات در حال زندگی وجود دارند.
  animal.giraffe:
    label: زرافه
    summary: بالاترين حيوان خشك زي يك سيست طوالت
    info: زیrafه بالاترین حيوان خشکي جهان است؛ نرها ارتفاع آن‌ها ممکن است بيشتر از پنج متر باشد. دارايت طولاني به او کمک مي كند تا برگ هاي سبز را درختان Akacia، منبع عمده غذاي وى فراهم شود.
  animal.gorilla:
    label: گوريلا
    summary: پركام عمده يكاي درياي الكليافريقي
    info: |-
      گوریلا بزرگ‌ترین پرایمات است؛ نر بالغ آنها می تواند به وزن ۲٠٠ کیلوگرم برسند و اغلب هسته شان سفید رومیز خواهد داشت
      گوریلار غذشون عمدتاً شامل برگ، جوشچه و ميوه است
      آنها با صداها، حرکات لحنی و زدن ضربات روی قفسه سيني ارتباط برقرار مى كنند
  animal.hippopotamus:
    label: hippopotam
    summary: پستاندار بزرگ نيم آبي افريقايي با دندان هاي عميق.
    info: هipopotاموس نیم‌آبزی، سومین پستاندار خشکی زا در آفریقا بعد از فلما و کوزه است. روز طول می‌کشد تا به دنبال جلوگیری از بخار شدن باقیمانده؛ شب هایشان بر روی خشکی غذاء می‌کنند. پوست آنها مواد قرمز رنگ جدا می‌کند که مثل ضد عفونی کردن و ضد آفتاب عمل می‌کند.
  animal.hyena:
    label: هيوانا
    summary: predator و carrion eater منطقهٔ Savanna.
    info: هیونا سکورنیتا بزرگ‌ترین عضو خانوادۀ هوانیدهاست و در انتخاب غذایش به عنوان مُرچوز نبودنش معروف است، زیرا پنجاه تا شصت درصد از غذا را با جولختن بدست آورد؛ فروغات قدرتمندتر و بلند قدتر از مردانند؛ صداي كمداري که دارد يك نوع واكنشي يا بيقراري است.
  animal.jaguar:
    label: جاوار
    summary: بزرگ‌ترین ماکی در آمریکا با پوزش روست.
    info: جَوگار سومین بزرگ‌ترین مخلوق خانوادهٔ ماکی در جهان و تنها نهنگ کبیر دنیای آمریکاست، با علامت ها روست اما به طور مشخص نقاط داخل رزته وجود دارد. قدرتمند است برای شنا و صید ماهی، تابع حملات فضاسازی مثل الigators و kapibars.
  animal.kangaroo:
    label: کلوکان
    summary: مارسه‌بال غیر عادی اُسترالیائی که رو قدماهای منقوط می‌خواهد
    info: |-
      کلوقان قرمز بزرگترین مارسپیال اُسترالیا و بالاترین حیوان پرش‌زن رو جهان است که توند به فاصله نزدیک به دو هفتم متر پرت کند
      مادهٔ آن در طول شش ماہ، صفت خود را تو سبد زایمان برداشت و با بدنهٔ خود حمل می‌کرد
      کلوقان سمبل مشهور اُسترالیاست و حتّی رو لوگو دولتِ اُسترالیا نقاشی شده
  animal.koala:
    label: کوا
    summary: مارسوپل الست کاشمر درختان桉树.
    info: |-
      کوآلا نه مارسوبیال است، بلکہ انسان سے بچنے والا جانور ہے۔ وہ تقریباً صرف کاسبرت کے پتوں پر غذا حاصل کرتا ہے، جبکہ ان پتوں میں زندگی کے لئے خطرناک مواد موجود ہوتا ہے؛ کوآلائی نظام ذہین دارد。
       او روزانہ ۲۲ ساعت آرام می‌کند، زیرا برگ های桉树 به طرز عجیبه بافت غذایی ضعیفی دارند。
  animal.leopard:
    label: لَبرُرد
    summary: بزرگترین نوع ماياوس با مو زيباسوز و ظاهر بيروني غميده
    info: "leopard نمونه‌ای از بزرگترین ماماندی کت و پرچند است، با توانائی خاص در بالا رفتن به سمت برگ ها جلو بلند شدن حيوانات دوستش مثل آهوها و لئون هاست\nتوانايي انطباق عالي يك فاكتور كليدي براي وجود اين موجود در قاره ايفرقيا , منطقه خاورنزويى و دورخاور نيزي است \nشكل متغير ديگرى از اين ماياوس به عنوان «پنثر مشکى» معروف است"
  animal.lion:
    label: لئُ
    summary: خزنده بزرگ خانواده موشک‌سان موجود در مناطق سافتِ آفریقا.
    info: لیو، مخلوق بزرگ خانوادهٔ موشک‌سان است که عموماً در سافرهای آفریقا جنوب از صحرای عربستان زندگی می‌کند. لیوها به شرکت همراه با دسته‌بندی پراول ورزیده عمل می‌نموده؛ نسواها به طور مشترک قطعات غذاء را تعقیب می‌کنند، در حالی که وجود تاج بر روی سرشون مردان قادر به فروتنی حریفان است.
  animal.lynx:
    label: رز
    summary: مايه کبیر الاتّقاء عابثة مع أذنين منتفعتين.
    info: '{"hint":"گربه وحشی متوسط با مو در سر دوباره اسپلندیدن لینکس","info":"اُستروِد رَز، بزرگ‌ترین گربهٔ جانورخانهٔ آزاد اروپاست.\nاین حيوان به خاطر وجود تارچه هاي مشكى كوتاه بر فراز نوك گوشهايش شناخته ميشه؛ همراه با ذيل كوتشكي است. \nمعظم وقتها شب يا زمان غروب قمر رو ديده ميشه ؛ طعمت غالب او شامل گوسفندان و لاكتاري هاست . \\nدر جمهوري چيك يافت نشد ولی بعد از پنجاه سال قبل از الان، موفقانه ريزيده شود.'
  animal.mandrill:
    label: مندریل
    summary: رنگارنگ ترین انساژ جهان با وجه قرمز و آبی.
    info: |-
      مَندریل بزرگ‌ترین ماندربک جهان قدیم و رنگارنگ ترین انساژ است
      آقاها دوست خورشید با صفت ناباور کردند، زیرا پوشش رو به سفید شمارده می‌شد؛
      این حشرات در مناطق مختلف آفریقا مثل کامرون، چاد و غزبا وجود دارد.
  animal.meerkat:
    label: سریкат
    summary: جانور کوچک اجتماعی منطقۀ کالاهری قطبین.
    info: "سُریکاتا جانور کوچکی از خانواده مَنگِست‌ها است که در آفریقای جنوبی زندگی می‌کند. \nاین حیوان به صورت دسته‌جمعی و با ساختار اجتماعی مشخصی زندگی می‌کند؛ همیشه عضوی از توده روی نقطه بلند نگاهداری می‌کند. \nsurikatها بدنشان مقاومند به سم پستانداران مثل فصلخرا و سنگوز، و همدیگر روش شکار را یاد می‌دهند."
  animal.moose:
    label: نوذ
    summary: بزرگ‌ترین جاندار اهلیتِ سوسک با بازو های لاتار
    info: |-
      نوز، بزرگ‌ترین جانور از خانوادهٔ سوسک است؛ نرها به قد دومتر در بالای پاه می رسند و بازو ها را تا حدود۱۸۰سانتیمتر فرو کشیده اند
      در مناطق شمال آمریکا، اروپا و آسیا زندگی می کنند
      خوب شنا و غواص هستند و برای جمع آوری گیاهان آبی سرشان رو داخل آب می اندازن
  animal.okapi:
    label: اُکَوْبِ
    summary: همسر لباس جیراف خاص منطقۀ کون-go با خطوط مشابه سابورا.
    info: اکاپی در سال ۱۹۰۱ به‌طور علمی معرفی شد و از آخرین پستانداران بزرگ است که دانشمندان آن را کشف نمودند، هرچند ظاهرش شباهت زیادی با تلاقی جیراف و سابورای قاره آفریقا دارد ولی فامیل مستقیم جیراف است.
  animal.orangutan:
    label: اورانگوتان
    summary: بازوان قرمز با موافزار بالغ که در جنگلهای برونئ و سماترا زندگی می‌کنند.
    info: اورانگوتان تنها لیدوپ بزرگ زنده خارج از آفریقا است و نامش به معنای «مرد جنگل» در مالائس را دارد، که منشاء فرهنگی‌اش همینجا است. او سخت ترکواستترین لیدوپ بوده و عمدتاً وقت خود را روی شاخسارهٔ درختان صرف می‌نمایند. مادران دورتادور هشت سال برای پسرانشان حفاظت می‌کنند؛ بلندترین دوره والدنشدن بعد از انسان.
  animal.otter:
    label: آب‌سرا
    summary: پستانداری هرزمان و نیم‌دریافتی که روی توسعه منابع آب تمیز زندگی می‌کند.
    info: آب‌سرا رودخانه‌ای، پستانداری از خانوادۀ سگماست که به طور کامل بر زندگی در آب تطبّق دارد. بدنش حلقچه ضخیم و ضد آب، غشاهای شناکننده و میتواند نفسش را بیشتر از نصف دقیقه فروبرد؛ وجود آب‌سرها معیاری است برای تمیزی منابع آب؛ جاهائی که زندگی می‌کنند، آب سالم است. بعد از مرحله انحطاط بلاتermین، حالا در تمام نقاط جمهوری چесь بازهم متولد می‌شوید.
  animal.polar_bear:
    label: ببر لانه
    summary: پرشتا باز زمینی بزرگترین حيوان قطب.
    info: ببر لانه‌ای بزرگترین جنده خشکی و شوالیه اصلی قطب شمال است. پوست سفید آن به طور کامل حرارت را عزل می‌کند؛ هر مو درشت، توخالی و نافذ است. دارای توانایی بالاست بر روی صدومت‌ها.
  animal.porcupine:
    label: دیکوبراز
    summary: حیوان خوردکن زغالی است که اسپرش برای مقابله وجود دارد.
    info: دیکوبراز به عنوان بزرگترین حيوان خوراک فرسوده آفریقا، اسپر هزاران تار مو سفت و توخالی دارد که در مقابل مهاجمان عمل می‌کند؛ وقتی شما با او تماس پیدا کنید، اسپرهایش راحت جسم ناهنجیر را سوراخ می‌کنند. شبها غذاشو روی قشر، ريشه و سبزيون ميچوبد.
  animal.raccoon:
    label: کوزل
    summary: جانور آمریکائی با منگولوچشم سیاه و ذنب خطوط.
    info: کوزل شمالی از آمریکای شرقی است، ولی به اروپا منتقل و در حال حاضر با جمع‌آوری زاده می‌شود. معروفترین کار او غسل دست قبل از خوردنش؛ در حقیقت برای ترد ساختن حساسیت پاهایش همراه نبود. تمام طعمدارها را بخوبی تحمل می‌کند و انعطاف بالاست، حتی شهرهای فشرده را بدون مشکل قبول می‌کند.
  animal.reindeer:
    label: سُب
    summary: جاندار نرم‌تنابدِ رَفاهمندِ حوزۀ توندرای عروض بالاتر؛ هم مردانش هم زنانش پارچ دارند.
    info: سوب قطبی تنها جانور از خانوادهٔ سگ‌ماهی است که هر دو جنس آن پارچ دارد و در مناطق برفی شمال، غرب و شرق زندگی می‌کند؛ قادر به تغیر محل با فاصله طولانی است.
  animal.rhinoceros:
    label: نسرین
    summary: پستاندار سنگین با یک یا دو روح روی منقار.
    info: |-
      نسرین سفید دومین بزرگ‌ترین پستاندار خشکی بعد از فلدون است
      رُخ نسرین از مواد کراتین تشکیل شده، همان مطلبی که در زیر انگشتان ما وجود دارد و به علت باور غلط به خواص معنوی رَوِح آنان تحت تهدید قاتلانهٔ جمع‌آوری برای صادرتند.
      dو نوع نسرین در آفریقا و سه نوع در آسیا زندگی می‌کنند.
  animal.sloth:
    label: لنوچود
    summary: ساکن درختان استوائی که مستقراً معکوس در غرفهٔ درختان قرار می‌گیرد.
    info: لنوچود، ساکن درختان استوایی و به زندگی آهسته کاملاً مجهز شده‌است. حرکتش آهسته تا حدی‌است که راسخونسبت فروزن بر روسرش نمو پیدا می‌کنند و نقش اسپار بالقوه را بازی می‌کنند؛ همینطور دارد متقلسم خوبی که تنها بار جلوی هفته تمخرد. لنوچود قدرتمندتر حملات ضربه‌دار داشتن انگشتان بلند و منحنی است که حتی بعد از مرگ هم قادر به تعقیب است.
  animal.snow_leopard:
    label: شامهٔ بُرْف
    summary: فضلاند بزرگ سردابی برخاسته از پوشه‌های بلندمرتبۀ قطب شمال.
    info: شامهٔ برفی در محیط کوهستان‌های بالا آب و هوادار همچون هلائِس، تبت و مناطق جبال اَسیای مرکزی زندگی می‌کنند؛ دم طولانی خاص به عنوان حفظ تعادل روی صخره استفاده می شود. فقط حدود ۴٬۰۰۰ الی ۶٬۵۰۰ عدد این موجودات باقیمانده وجود دارد. یکی از نادرترین فضلاورهاست.
  animal.tapir:
    label: تائِیر
    summary: جانور علوفه‌خوار با حوالو طولانی، رابطه‌اش با خفاش و شترمرغ وجود دارد.
    info: تایپر جانوری اولیه با پاهای فرد است که به خفته‌ها و شترمرغ‌ها نزدیک است، همچون آن‌ها شبیه ظاهرش مشخص نیست. در مناطق مرطوب مدارس بزرگ آمریکا و جنوب شرق آسیا زندگی می‌کند. دارای حالت بلند انعطاف‌ناپذیر برای گرفتن ساقه‌ها و برگ‌ها است.
  animal.tiger:
    label: درجه
    summary: درجه بالاترین حشره قابل مشاهده در مناطق مرطوب.
    info: تیگر بانگال نمونه‌ای از درهم کوچکترین و جنگل زی است، همانند شیرها ولی با الگوهای متفاوت بر روی بدنش. تعدادش به دلیل خطرات مختلف طبیعی و غیرطبیعی بسیار پائین رفته.
  animal.warthog:
    label: خرس باربر
    summary: افریقا حاوی تعداد قابل توجهی از پرواز هواپیماها با سطح بالا وجود دارد.
    info: خوک موهایی آفریقائی، جانور دندان‌دار وابسته به خوزستان است که در طبیعت زندگی می‌کنید.
  animal.wild_boar:
    label: ديواك
    summary: يک نوع قوراق با كليه، يعنی پيشينى عام تمام رنىهای خرس.
    info: دیوچاک، نژاد اصلی و پدرخواندهٔ تمام رنجهای خروس است که در اروپا زندگی می‌کرد. آنهان هم به عنوان موجودات هوشمندانه و انعطاف‌پذیر با غذا سبز وجود دارند؛ حفر برای جستجوی ريشه، تخم مرغ فلفلی، ولی شکار کردن حشرات و حیوانات بزرگتر روزمره است. مادرها ( Bachyne ) عالیت روی صفت لازمه دارد.
  animal.wildebeest:
    label: پَكُنى
    summary: برخاستهٔ آفریقایی با قابلیت مهاجرت بر روی عظیمتترین مهاجرت فرسوده.
    info: |-
      بزاقوچه انسانی به خاطر مهاجرت زمین‌ای بزرگش معروف است که هزاران حيوان سالانه در منطقۀ سورنکِت و ماسائي مارا حرکت می‌کند،
      هدف مهم شیرها، جعبده‌ها و تمساح‌هاست.
      تمام نونهات اناث روزانه فقط دو اليا سه هفته طول می‌کشد.
  animal.wolf:
    label: wolf
    summary: جانور حشراتن، آغازگر سگ.
    info: سگ وحشی، بزرگ‌ترین جانور شکارچی از خانواده سگ است که نسبت به سگ دامی پدیدآمده است. در توده‌ها با هیراسی مخصوص زندگی و شکار می‌نماید و برای تمایل منطقه راهروی خاص خود را فراخواند.
  animal.wolverine:
    label: چاکماق
    summary: سبک فشرده و ناراحت کننده در مناطق شمالی.
    info: چاکماق بزرگترین عضو خشکی‌زی جنس لاسه است و به دلیل قدرت فوق العاده و تهاجم آن شناخته می‌شود، قادر است اسخر را از غذایش دور کند.
  animal.zebra:
    label: زرفا
    summary: مازندهٔ آفریقا با ردّاف سفید و مشکی
    info: زیبرا ماماندگان آفریقایی اسب‌سان با خطوط سفید و مشکی هستند که به راحتی شناخته میشوند، الگوی پارچه بر روی بدن هر فرد منحصر به فرد است مثل نمونه انگشت در دستان انسانها و به جلوگیری از حملات قاچاقچیان داخل توده کمک میکنند.
