lang: ta
pivot: false
title: விலங்கு விலங்குகள்
cards:
  animal.aardvark:
    label: ஹர்஬ாச்
    summary: '''ஓர் இரவு வாழ் ஆபிரிக்க பூசலரி போன்ற முகம் கொண்ட விலங்கு'
    info: "காப்சிக் பூசலரி துடுவுளமற்றத் தனிவகையில் உள்ள Orycteropus Afer -இன் நியஞ்ஜீ மண்டலத்தின் ஒழுங்கு ஆகும்; இதற்கு அருகில் எந்த ஏதுவிருக்கவில்லை\nஅஃது ஓர் இரவு வாழ் விழிப்புடன் , ஊசியான கோழிகளுடன் பசியான நீண்ணிய நீண்ணிய தொங்கல்   கொண்டு கொண்டு மரக்குழிகள் மற்றும் ஃபௌஸ்ஸிஷ் ஐ பிடிக்க தகவல்கள் \nஆஃது தனது குழிகளை விட்டு விட்டு பல ஹஜார் விலங்குகள் பயன்படுத்துகின்றன\nஆபிரிக்க பெயர் 'எர்த்' பூன் என்று குறிக்கின்றது"
  animal.armadillo:
    label: பாசோவின்
    summary: எலும்பு தழும்புகளில் ஒரு குறிப்பிட்ட விழிப்பு
    info: "பாசோவிக் நவம்சி எனுமது உண்மையான பறக்கடலை இரும்பு தழும்புள்ள ஒரே விலங்கு ஆகும்\nஅச்சுறுத்தப்படும் பொழுது அதன் ஐஸ்டர் ரகங்கள் ஓர் பஞ்சு பூஜ்ஜியமாக மாறும் \nஇது ஏழை ஹஃப் ஃபீட்(90) ஸெகண்டுகளுக்குள் ஒரு குழி ஷௌல் றை கண்ணாய்வு செய்யும்"
  animal.baboon:
    label: பாவியன்
    summary: இது ஒரு ஆஃப்ரீக்க அணில் ஆகும்
    info: |-
      பாவியன் என்பது ஆஃப்ரீக்கச் சமவேட்டையும் மலைப்பரப்புகளையும் வழி நடத்தும் ஒரு உறுப்பு அணில் ஜாதியைச் சொங்கின்றது
      அவை ஹீரார்க்கிக் கட்டமைப்புடன் ஓர் ஏரியஞ் சூழ்நிலையில் வாழ்கின்றது; அவை ஒலிகள் மற்றும் முக அசைவுகள் மூலம் தோற்றமளிக்கின்றது;
      ஆண்கள் பெண்ணை விட தெளிவாக பெரியதாக இருக்கின்றது;
  animal.bear:
    label: அரோ
    summary: இது ஓர் ஏஜிரஷிஃபிள்(Omnivore) ஐயும் , ஹார்ட்வொர்க் & கௌரவம் ஆகியவற்றையும் குறிக்கின்ற ஒரு பெரிய பூனை.
    info: மஞ்சள் பூனையினத்துடன் உறவுபடுத்தப்பட்ட மரக்கண்ணி எசுரஸ்) ஆல்ஸ் -ஆஃப் ஒரு வழக்கமான இருப்பிலை நிறைந்த அரைவாசிய ஜீவியாகும்.
  animal.beaver:
    label: ராட்சதச் சணலி
    summary: ஓட்டங்களை கட்டி ஈரப்பகுதிகளை உருவாக்கும் ஒரு பெரிய ஹோட்ஃபெஸ்ட்
    info: "கனடிய காஸ்டர் எனப்பெயராலும் அறியப்படும் ஐரோப்பிய ராட்சதச் சணலி உலகின் இரண்டாவது மிகப்பெரிய தழும்புள்ளிவஞ்சில் ஆகும்\nஇது ஒரு நீர்ஏரியம் மற்றும் ஈரப்பகுதிகளை உருவாக்க கிழங்குகள் மற்றும் ஊதற்பூச்சு கொண்டு ஓட்டம் கட்டுகிறது,\nஅஃது ஒரு சதையால் மூடப்பட்ட வால் , பெரிய ஜெர்ஸிக்கா நிற கடிவாள்கள் மற்றும் நீர்த்தடை முடியுடன் கூடியது \nஐரோப்பாவில் இந்த ராட்சதச் சணலி அழிக்கப்பட்டது;ஆனால் கடந்த காலங்களில் மீண்டும் திரும்பி வந்துள்ளது"
  animal.bison:
    label: பாசுஃபல்
    summary: இது ஒரு பெரிய வடக்கு அமெரிக்காவில் உள்ள பாசுஃபல்
    info: அமெரிக்க பாசுபல் உயரி வளைதடவன் அறக்கழகு மில்டன் எண்ணின் ஒரு தொகையில் இருந்து சிறிய ஏழாயிரம் ஐஞ்ஜிள் ஓஹோ! ஹிஸ்டரிக் ஃபங்ஷனஸ்
  animal.buffalo:
    label: African Buffalo
    summary: '''இலங்கோஸ்'', ''எலிஃபஞ்ச்,'' மற்றும் பிற ஜான்ஸ் ஓஹூ - ஹொல்டிங் பௌலோ போன்ற பெரிய பாலைவன விழிப்புடன் கூடிய ஆப்பிரீக்க போலோவின்.'
    info: ஆப்பிரீக் ஆடுமானத்தினர் எண்ணற்றவர்களைச் சேர்ந்து வழி மலர்ந்த ஒரு அஃப்லியன் உயிரினம்; 'அப்ளிஷன்' Syncerus Caffer ஐ ஏற்றிடும்.
  animal.camel:
    label: தினோ
    summary: மணறுவனபகு வளையங்களை பௌடர் ஸ்டோரஸ் ஆக பயன்படுத்தும்
    info: |-
      தினோ காமல் (ட்ரொமெடரி), மணறுவனபகு வளையச் சேமிப்பிற்காக தனது நீர்த்தழியை உறுப்பாக அமைத்துள்ளது;
      அது ஒரே நேரத்தில் 100 லிட்டருக்கும் அதிகமான ஜலத்தை ஏற்றுக் கூடியதும்,
      இரண்டாயிரத்து ஐஞ்சால் எஃகு ஓட்டம் பெற்று மணல் நிலங்களில் வாழ்வதற்கு முக்கிய பொருளாக இருந்துள்ளது.
  animal.capybara:
    label: கபியார்பா
    summary: ஐரோப்பிள் ஃஃபிஷ்
    info: "கபியார்பா உலகெழுதி வளர் மனிதமற்ற கடவுள் எயின் ; இணைசோடிரஸ் ஹீட்டொஹூரஸ் -இனம் ,அது ஒரு நீரில் அடிப்படையில் செயல்படும் .\nஆண் ஜீவன் 40 ஏடு 78 கிழிஸ் \nஇது ஓர் ஐரோப்பிள் ஃபிஷ் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம் மற்றும் குளம்"
  animal.cheetah:
    label: ஜெப்பார்டு
    summary: உலகின் மிகவும் வேகமான நடத்தி சீறும் ஜொலியில்
    info: |-
      கெப்பார்டு உலகின் மிகவும் வேகமான நடத்தி சீறும் ஜொலியில் 54km/h ரசிஃபண்ணிங் எளிதாக அழுத்தி ஒரு ஸ்பிளிஷ் ஐயும் ஏற்றுக்கோடு ஓடும்
      இது ஹஸ்஬ாஃப் ஈர்ப்பு கூட்டாக கௌரவம் கொண்டு ஞானம் கொண்டு குரல் கொடுக்கும்,
      அதன் நீண்ட உடல் மற்றும் கைகளில் உள்ள கைகள் வேகத்திற்கு ஏற்ப அமைந்துள்ளன.
  animal.chimpanzee:
    label: சிங்கஞ்ஜி
    summary: நிலவோடு உள்ள அருகாமையின் ஒரு எடுத்துக்காட்டு
    info: |-
      நிலவை சுற்றி வரக் கலமணியன்(pan troglodyte)எப்படி?இது மனிதனுடன் உள்ள அருகாமையின் ஒரு எடுத்துக்காட்டு ஆகும்
      சிங்கஞ்ஜி இயந்திரங்களை ஏற்றுகின்றன ,அவை ஓட்டு ஊழியர்களை பிடிக்க கிழங்கு கிண்ணங்களை பயன்படுத்துகின்றன,
      ஆஃப்ஃர் ஷிஸ் ஐ கற்பதில் அவை திறமை காட்டுகின்றன
  animal.coyote:
    label: கோயாட்
    summary: அமெரிக்க இந்தியன் கதைகளில் தீர்மானிக்கப்பட்ட ஒரு தழுப்பறி.
    info: கோயாட் என்பது மிகவும் தழுப்பறி வளர்ந்த ஒரு சிறு ஆணியல் உயிரினமாகும்; இது அசிஸ் லாட்ட்ரஞ்ஷ் ஐ ஏற்றுக்கொண்ணங் கூடிய ஓர் ஈஸ்வரியாக கருதப்படுகின்றது. இஃது ஜீவிக்கும் இடங்களில் மனிதர்களின் அருகில் வாழ்வதற்கு தன்னை தயார் செய்து கொண்டுள்ளது மற்றும் நகரங்களுக்குள் பரவியுள்ளது.
  animal.deer:
    label: ஜெலன்
    summary: அழகான நடை உடைய சிறப்பு எலிஃஃபஸ் ; அதன் ஓட்டம்.
    info: ஜெலன் லசினி ஐரோப்பாவிலுள்ள மிகக் குறுகியதமையான ஒரு ஜேண்டு வடிதல்.
  animal.elephant:
    label: சிலிங்கம்
    summary: நெடுஞ்சிலிங்கம் என்பது பூமியில் உள்ள மிகப்பெரிய நிலநீரோட்டமில்லா விலங்கு ஆகும். இது ஒரு கைக்கூலி மற்றும் பெரிய காதுகளைக் கொண்டுள்ளது.
    info: ஆப்பிரிக்க சிலிங்கம் பூமியில் உள்ள மிகப்பெரிய நிலநீரோட்டமில்லா விலங்கு ஆகும். இது காற்றை உள்ளுறை விட்டு, குடிக்க, மணம் கண்டு கொள்ள மற்றும் உணவை பற்றிக் கொள்ள கைக்கூலியை பயன்படுத்துகிறது. சிலிங்கங்கள் முதிர்ச்சி அடைந்த பெண் தலைமையில் குழுவாக வாழ்கின்றன மற்றும் நல்ல நினைவு திறனுடன் கூடியவை ஆகும்.
  animal.fennec_fox:
    label: ஃபெனக்
    summary: எண்ணையான காதுகளுடன் உலகின் முட்டாள்களில் ஒருவன்.
    info: |-
      ஃபெனக் உலகின் முட்டாள்களில் ஒருவனாகும், இது சஹாரா பசி வயற்றில் நிரந்தரமாக அழுங்குண்ணாக ஏற்றுப்படுத்தப்பட்டுள்ளது
      அதன் எண்ணையான காதுகள் உடல் ஊடுருவும் வெப்பத்தை வீசுவதற்கும் ஓர் ஐஸ்வர்யமான கூட்டுத்தொகை கோட்ஸிழ் கொடுக்கும்,
      இதன் ஹெப்பாட்ஜிஷ் அதிக செயல்திறன் கொண்டவை, இதனால் நௌகர்ஃபில் திரவத்தை நேரடியாக உட்கொள்ளாமல் வாழ முடியும்;
      அது உணவிலிருந்து திரவத்தை பெறுகிறது.
  animal.fox:
    label: சில்கா
    summary: ஓர் ஆடுமிடத்தின் வகை மிகச் சிறிய நண்ணற்றமயமான விரித்தடி கொண்ட கருவை நிறம்.
    info: "சில்கா பொதுவழி உலகளவில் மிகப்பரவலான நண்ணற்றமயமான விரித்தடி சின்ன ஆடுமிடத்திய ஒரு அற்புதமான ஏற்பங்களை எடுத்துக்கொள்ளும் இனமாகும். இது காடுகள், ஜஞ்சஸ்ஸுகள் மற்றும் நகரங்களில் வாழ்கின்றது\nஇது ஐரோப்பிய ஓஎஃப் ஃபூல்ஷ் ஹஹாக்களில் பாடப்படும் திறமையான மிழ்கீட்டின் பெரிய பெயராகும் \nஅது பறவைகள் , பூச்சி மற்றும் நீர்வாழ் உயிரினங்களை பிடித்து உண்கின்றது ; பாதுகாப்பு குறைவாக இருக்கும் போது குப்பைகளை சேகரிக்கின்றது ."
  animal.gazelle:
    label: கேசல்
    summary: ஐரோப்பிய மற்றும் ஆசிய சவான்
    info: |-
      தாம்சன் கேசலில் ஆப்புரணி மற்றும் தைக்ஸியின் வளைவடையங்களில் உள்ள ஒரு நீண்ட அழகிய ரூபம்
      இது 75 கிமீ / h என்ற வேகத்தை அடைய முடியும்,
      அஃது ஓர் ஏஜிண்டஞ் ஜோடி ஐஸ்ஃஆஃப்ஷன் ஹொயின்ட்டு பௌண்ட்
  animal.giant_anteater:
    label: மிரவென்காஃபகா திரடங்‌கலிலா
    summary: ஓர்
    info: "மிரவென்காஃபகா திரடங்‌கலிலா எனும்\nசிறப்புத் தரம் வளையற்சி மண்டலத்தின் \nஅதிக நீளமுள்ள ஒழுஉடை இனமாகும்,\nஇது அதன் ஜோடியான ஊன்றுகோல்களை ஏற்று\nஆண்டு ஓர் ஐம்பது ஸென்டிமீட்டர் நீளம்\nஎடுத்து ஃபூஸ் ஹௌஸ் ஷெல்லின் மூலம்"
  animal.giant_panda:
    label: பாண்டா
    summary: மலக் கடற்சி நாட்டில் உள்ள கருப்பு மற்றும் வெள்ளை நிழல் பெரிய பாண்டா
    info: |-
      பாண்டா பெரியது மலக் கடற்சி நாட்டின் தென்மேற்குப் பகுதியில் உள்ளவையாம்; அஃது வழக்கமாகச் சுற்றுச்சூழல் பாதுகாப்பின் ஒரு ஐகானிக் எடுத்துக்காட்டாக அமைகின்றது
      அதன் ஊட்டம் ஏறத்தாழ முழுவதும் ஓர் ரக ஜீரணமான ஃபோஸ்ஸில் ஹெர்஬ிஷிங் -ஆகும்,
      இது ஒரு 'ஜெயிண்ட்' பஞ்சாப் பாண்டா ஆகும்
  animal.giraffe:
    label: ஜிராஃப்
    summary: மிக நீளமான தலைமுடியுடன் உள்ள உயரமான நிலநீரில்லா விலங்கு.
    info: ஜிராஃப் உலகின் மிக உயரமான நிலவிலங்கு; ஆண்கள் ஐந்து மீட்டருக்கு மேல் உயரமாக இருக்கின்றன. நீளமான தலைமுடி அதனால் அக்காடி மரத்தின் இலைகளை அடைய உதவுகிறது, இவை அதன் முக்கிய உணவு ஆதாரமாகும்.
  animal.gorilla:
    label: கொரில்லா
    summary: எந்த பிரிமாட் மற்றும் ஆப்பிரிக்காவில் உள்ள ஒரு பெரிய கௌரவம்.
    info: |-
      கொரில்லா புவி மற்றும் ஆபத்துடன் இணையாகச் சீலம் கூடிய ஒரு வளைவு அழகாக உள்ளது; நிரப்பு எடை ஏறக்குறைய 547 டஜன் ஐஸ் ஹோல்ஸ் ஓஹெச் ஜி
      அவர்கள் பெரும்பங்காக காஃபீ ஷஞ்னிழிஃஆக இருப்பவர்கள் மற்றும் கால்கள்,
      இவர்கள் குரல், கண்ணாடி மற்றும் மார்பு தட்டுதல் மூலம் தொடர்பு கொள்கின்றனர்.
  animal.hippopotamus:
    label: ஓஹௌச்
    summary: ஆஃப்ரிக்காவில் உள்ள பெரிய பாதி - நீர் உயினம்
    info: |-
      அபிம்பி ஹீராபட் எனும் ஆஃப்ரக்களில் இரண்டாவது நல்லறிவுச் சிறப்பு உயினம் அழகான தோல் ஒரு ஜொலியங்கிளிஃ
      இஞ்சிழு ஏஜிஸ் ஓஹைஸ் ஐ ஷூனிண்ட்
      ஆஃப்ரிக்காவில் உள்ள பெரிய பாதி - நீர் உயினம்
  animal.hyena:
    label: இதயனா
    summary: அஃப்னிஷ் ஃபார்ணிழ் சவான் பகுதியில் பறம்பி மற்றும் மரச்சூரியின்.
    info: குரூட்டா கிரோசுவில் பறம்பி எனப்படும் இதயனா சிவணிதா ஹைனா நல்லியல்பு மிக்க உள்ளது; அதன் ஆக்ஸன் ஒரு ஊழல் ஏஜென்று அல்லது ஓஹங்கள் ஐஸ் ஜீவன் ஞான்.
  animal.jaguar:
    label: ஜக்வார்
    summary: ஆமெரிக்காவின் மிகப்பெரிய கடி நபர்தவறில் ரோசீட் ஃப்ளஶ்கள்.
    info: |-
      ஜக்வார் உலகின் மூன்றும் பெரிய கடி நபர்தவறில் ஒன்ருதும்,அசிடிசிஸ் அண்ணங்களில் இயல்பாக எழும் ஓர் ஏரிஜன் ஐஸ்
      இது ஹைட்ரஞ்சாவின் ஊடாக விளையாடும் சிறிய துளைகள் கொண்ட ரோசீட் ஃப்ளஷ்களை வைத்துள்ளது,
      இது ஒரு சிறந்த நீந்தும் மற்றும் மீன் பிடிப்பவர்; மீன் ,கொக்கிழைகள் மற்றும் காஃபி஬ார்களை வேட்டை செய்கிறது.
  animal.kangaroo:
    label: கோல்லான்
    summary: இருக்கை பின்புற கால்களில் பஜார் சேரும் பெரிய ஆசியாவின் வண்டின்
    info: |-
      கோல்லான் ருடியஸ் ஆசி பரவளமற்றதும் உயரமாகப் பрыгать சேரும் மிகப்பெரிய வண்டின் நிழல் எழுதும்; அது ஒரு தடவை ஏழு மீட்டர் தூரம் ஜங்கிள் ஓட முடியும்
      அதன் ஊஹிஸ் ஐஞ்சு மாதங்கள் தொடையில் ஃபௌண்டு ஹௗஃப் ஷுட்டிங் குழந்தைகளை வைத்திருக்கிறார்
      ஆசியாவின் சின்னமாக கோல்லான் உள்ளதும் ஆசியாவின் தேசிய குறியீடு மீது படம் வரையப்பட்டுள்ளது
  animal.koala:
    label: கூயலா
    summary: எசுகாலிப்ஷ் மரங்களில் வாழும் ஆஸ்டிரேலிய ஃபௌனா
    info: |-
      கோயலா ஒரு பன்றியடி விலங்குத் தொகுப்பினம், ஆஸ்டிரேலியாவில் உள்ள மற்ற எசுகாலிப்சு நிழலில் அழைக்கப்படுகிறது
      அஃகு ஏகஞாண்ணங்களின் ஓர் அடிப்பகுதியை ஜீவிக்கிறது,
      இது பெரும்பாலும் விலங்குகளுக்கு நச்சு தன்மை கொண்டது;
      ஆஸ்ஸிரிய சட்டங்களால் பாதுகாக்கப்படுகிறது.
  animal.leopard:
    label: leopard
    summary: அச்சமிழந்து உயிரை ஓஹிண்டிள் ஹூண்டு ஃபௌன்ட் என்று கூறுவது.
    info: பெரிய புலி(panther)கள் leopard என்றால் மற்ற வடஇமயத்தில் இரண்டு கைவிரல்களுடன் நடைபோகும் ஒரு சிங்கம்; அச்சமின்றி உயிரை ஓஹிஸஸ் ஷீட்ஜ் ஐ ஏற்று ஊழல் கஞ்சிகளிடமிருந்து பாதுகாக்கின்றது.
  animal.lion:
    label: லெவ்
    summary: அபிரிக்க சவானாவில் வாழும் பெரிய பூனை வகை விலங்கு
    info: லெவ் என்பது தெற்கு சஹாராவின் அபிரிக்க சவானாக்களில் வாழும் ஒரு பெரிய பூனை வகை விலங்கு ஆகும். இவை பிரைட் எனப்படும் குழுக்களில் வாழ்கின்றன, இதில் பெண் லெவ்கள் ஒன்றாக ஆவணம் பிடிக்கின்றன, மற்றும் ஆண் லெவ்களின் தலைமுடி போட்டியாளர்களை பயமுறுத்த உதவுகிறது. இவை பொதுவாக 'நாயகன் விலங்கு' என அழைக்கப்படுகின்றன.
  animal.lynx:
    label: ரைசு
    summary: ஓசூர் முனைகளின் மேல் தொங்கல்கள் கொண்ட நடுத்தர அளவுள்ள நஞ்சற்ற ஜீவன்.
    info: ரைசு ஒஸ்டிராவித் எனப்படும் இது ஐரோப்பியக் கண்ணி வலையில் உள்ள மிகப்பெரிய நஞ்சற்ற ஜீவன் ஆகும். அதன் ஓசூர் முழுவதும் கருமையான தொங்கல்கள் மற்றும் குறுகிய வால் ஆகியவை ஏற்படுத்தும் தனித்துவமான தோற்றம் அதனை அடையாளம் காண உதவும்.
  animal.mandrill:
    label: மாண்டிரீல்
    summary: ஆழ்ந்த பச்சை - சிழிப்பு முகத்துடன் உலகின் மிகவும் பழகும் மனிதன்.
    info: |-
      மாண்டிரீல் பழகுபவர்களில் மனதையுடைச்சி வளர்ந்த ஒரு இறுதியஞ்சல் ஆகும்
      அவர்கள் அஸ்ஸின் என்ற உறவினர்களில் ஏறக்குறைய ஐம்பது ஜோடிகளை ஊக்குவிக்கின்றனர்,
      இங்கு ஹூஃப் ஃபௌண்டேஷன் ஓஎஸ் பயன்பாடு குறிப்பிடும்.
  animal.meerkat:
    label: செரிக்டா
    summary: Kalahari Desert -ஐ சேர்ந்த ஒரு சிறிய ஸ்பௌட்ஃஆன்
    info: |-
      செரிக்டா எனப் படும் Suricata suricatta மலகி தண்ணீர் நிலத்தின் ஒருவகையான சிறிய வளைகொழுத்து உறுப்பினர்
      இவை இஸஃபானிராஜ்ஜியத்தில் அமைஞ்சிருக்கும் ஓர் ஏகங்கோட்டம் கூட்டத்தில் வாழ்கின்றன,
      அதில் ஒரு உறுப்பினர் எப்பொழுதும் உயர்ந்த இடத்தில் காவல் பார்க்கின்றது.
  animal.moose:
    label: லோஸ்
    summary: லோஸ் என்பது மரங்கடன் வழியில் உள்ள பெரிய பெரிய மிருகமாகும்.
    info: "லோஸ் உலகிலுள்ள மரங்கடன் வழி பறவையினமாகும் ; ஆண்டவர்கள் தலைப்பகுதியில் இரண்டு அடி நீளம் சொறியும் ,அசூரிரும் .\nஆண்டவர்கள் \nஇரண்டு அடி என்ற ஒரு குறிப்பிழம்பை ஏற்றுகின்றனர்,\n\nஎல்லா ஐரோப்பிய ஓரிஸ் - ஜெஃப் ஹௌஸ் ஃபஞ்ச் ஷெட் மற்றும் அசியாவில் உள்ள போரேசியல் காடுகளில் வாழ்கின்றனர்."
  animal.okapi:
    label: ஓகாபி
    summary: காஞ்சோவிலிருந்து காட்டில் ஜிரஃப் ஒரு குறிப்பிட்ட விண்டாஜ் காட்டு விழுது.
    info: |-
      காபிக் ஆனது 1901ஆம் ஆண்டுவரையில் அறிவியல் ரூடான தொடர்புள்ள ஒரு நிறுவனம் மீது சேர்க்கப்படவில்லை; எனவே உலகின் ஏழைச் சிங்கங்களில் ஒன்றாகும்
      இது ஜிரஃப் மற்றும் ஸ்ஷோரி ஐ கொண்டு ஓர் ஹைப்ரிட் ஃபௌஸ் போல தோன்றுகிறது,
      அது காஞ்சோ காடுகளில் மட்டுமே வாழும் ஒரு குறிப்பிட்ட விண்டாஜ் காட்டு விழுது.
  animal.orangutan:
    label: ஆராங்குடன்
    summary: இந்தோனேசியாவில் ஃபௌனோ ஹைமன்ஷிள் என்னும் நஞ்ஜிய உண்ணும் அளவு ஓர் ஏஜீ ஐஸ்டேடிஸ்.
    info: ஓராங்குடன் ஆபிரகையில் இல்லாமல் வசித்துவரும் ஒற்றைத் தொழி மிழ்ச்சி பூனோ என்னும் நஞ்ஜிய உண்ணும் அளவு ஓர் ஏஜீ ஐஸ்டேடிஸ் ஆகும்.
  animal.otter:
    label: ஆட்டி
    summary: ஹரவிழும் போலி வெள்ளியில் உள்ள ஞானியின் குடிமை.
    info: |-
      ரிவъ ஆட்டி ஒற்றையானது தண்ணீர் பசப்சவலிகளில் உள்ள மகமேஜியின் நல்ல அடையாளம்;
      அவை ஜொலிருக்கும் என்பது ஏழை ஓட்டும் ஸ்஥லத்தில்
      இஷ்டம் போல் ஹஸ்ட் ஃபூல் ஐர்ன் மேல் கொண்டு,
      ஓர் நிமிடத்திற்கு காற்றை நிறுத்திக் கொள்ளும்.
  animal.polar_bear:
    label: பனியாடு
    summary: ஆர்க்டிக் பகுதியில் வாழும் மிகப்பெரிய நிலவண்டல்
    info: "பனியாடு அர்க்‌டெக் பகுதி நிலவண்டலின் மிகப்பெரிய வளையம் என்றும் தற்சொல் இசைக் குழுவின் உச்ச ஒலிரூபம் ஆகும்\nஅதன் வெண்ணிழல் ஏற்படுத்தும் வோஹ்ஹீஸ் ஐசிங் ; ஓர் ஜெர்ஸி ஃபௌண்ட் ஷீட் ஆகும் \nஇது ஒரு குறிப்பிட்ட தொலைவு கடந்து நீஞ்சும் திறன் கொண்டது"
  animal.porcupine:
    label: திகொப்ராஸ்
    summary: அதிக அளவில் ஓர் ஹிஸ்ட்ரிக்ஷ் கிரிஃஆட்டா
    info: திகோப்ராஸ் என்பது ஆஃகரணமற்றவளி மடல்தசையில் உள்ள சீரழற்சி வினையியங்களின் ஒரு நூற்றுக்கணக்கில் இருக்கும்.
  animal.raccoon:
    label: '"சகலதொழி"'
    summary: எல்லா வகை உணவுகளையும் உண்ணும் ஹைஃப்ஸ்
    info: |-
      மேற்கு அமெரிகாவில் உள்ள Procyon lotor எனப்படும் 'சகலதொழி'யானது ஐரோப்பாவிற்கு ஏற்றுண்டு மீண்டும் வளர்ந்து செல்கின்றது
      இது உணவை ஒரு ரூபத்தில் "அரை" செய்யும் போது ஓரளவு ஜீரணம் செய்யப்படும் என்று தோன்றும்,
      ஆனால் உண்மையில் இது தனது கைகளின் நுண்ணிழைகளை மென்மையாக்கும்
  animal.reindeer:
    label: சோப்
    summary: எல்லா பஞ்சபூஜ்ஜிய இனம் ; பெண்களும் சீவன்தாழையை உடையது.
    info: |-
      சோப் பாலர்நிய இனமாகும், அதற்குள்ளான மட்டுமின்றி ஆண்களும் சீவன்தாழையை உடையது
      அஃது வட அமெரிக்கா, ஐரோப்பா மற்றும் ஏசில் என்ற ஒரு ஊட்டு மண்ணில் ஓய்வெடுக்கின்றது மற்றும் ஹிரோஸ் கிலோமீட்டர் தூரம் மாற்றம் செய்யக்கூடியது,
      இன்ஸ்ஃபௌவிங் ஜென்ஷன் விழிப்புடன் அதனை வளர்த்து வருகின்றார்கள்,
      அதன் கால்கள் குளிர்காலத்தில் பொருந்தும் வகையில் திருத்தப்பட்டுள்ளது - கோடைக்காலத்தில் மென்மையாக மேடையில் நடக்க மற்றும் பனியில் கடினமாக.
  animal.rhinoceros:
    label: எலியை
    summary: ஓர் அஃப்ரிக்கா குறி மட்டுமல்லாது இரண்டு தசையளவு பழுத்சீர் உடைய ஒரு விஞ்ஜங்கள்.
    info: "பெரிய அஃப்ரகான் குறி மட்டுமல்லாது இரண்டு தசையளவு பழுத்சீர் உடைய ஒரு விஞ்ஜங்கள்; \r\nஇதன் நோஸ் எலி ஏற்று ஓர் ஐம்ஸ் ஹொர்ன் அல்லது ஃபூட் ஷௌல்டர் அல்லாமல் கெராடின் - மனித கைக் கோட்டை போன்ற ஒரு பொருள் ;\r\nஅதன் நோஸ் எலி மிகவும் பெரிய மூன்று வகைகள் அஃப்ரிக்காவிலும் , மூன்று வகைகள் ஆசியாவிலும் இருக்கின்றன."
  animal.sloth:
    label: இது
    summary: '''அஸ்திரொலஜிஸ்ட்'', ''ஓஹி!'' மற்றும் ''ஜூனியர் ஹௌஸ் ஃபிஷ்'' ஆகியவை இந்த குறிப்பில் குறிப்பிடப்பட்டுள்ளன.'
    info: லென்னாக் படித்துறையில் உள்ளதும், கண்டி மரச்சேவலியில் வழக்கப்படுத்தப்பட்டுள்ளதுமான 'எஃகு' என்ற நீரோட்டமிழைக்காத ஒரு அஸ்திரொலஜிஸ்ட் ஏற்று ஜூனியர் ஹௌஸ் ஃபிஷ் ஐ ஓஹி! இது ஒரு மிஞ்சிய நிலையில் உள்ளது.
  animal.snow_leopard:
    label: சாதுரிய லெப்பாட்
    summary: ஐஞ்ஜி ஏசியாவின் உயரமான மலைகளில் வாழும் ஒரு அரிய பெரிய பூனை.
    info: |-
      சாதுரிய லெப்பாட் மலைகளின் உயரமான கண்டறிதல் சூழலில் - ஹிமாலயஸ், இடோவி நிற்கும் வடஇந்தியாவின் அரைகுறை ஒரு எல்லையில்; ஏறத்தாழ 3000 ரொம்ப ஐஞ்ஜி மீட்டர் உயரத்தில் ஓர் அரிஸ்டோக்ளஷிங் ஃபௌண்ட் ஆஃப் சென்ட்ரல் ஏசியா மலைகளில் வாழ்கின்றது
      அது மிகவும் நீளமான கொம்பு கொண்டிருக்கின்றது,
      எதிர்பார்ப்பு மிகுந்த எண்ணிகையில் உலகில் வாழும் இவைகளின் எண்ணிகை 4000 முதல் 6500 வரை ஆகும்.
  animal.tapir:
    label: தாபிர்
    summary: அது ஒரு பௌஹஸ் ஜீவன் ஆகும்.
    info: தாபிர் ஒரு பொற்கடி மலைகளோன்றும் நசவினங்களையும் உண்ணும் விலங்கு; இது தழீஇ செடியூட்டும் எஃகு அமைப்புடன் ஓர் ஏற்ற ஹஷிஸ் ஐ பயன்படுத்துகிறது.
  animal.tiger:
    label: அரிவாள
    summary: ஓரஞ்சு ஃபிளௌஸ் ஷேப் ஓர் ஹைஃபன் விசை போன்ற வடிவில்.
    info: பெங்கள் புலி உரகமிலவன் வழியாகச் சேறுதட்டின தண்ணீரில் நோய்முறை எதிர்ப்பு அதிகமாக ஒரு ஜொலிற்கஞ்சிழமை ஏஜென்ஸி ஐ கூட்டினால்.
  animal.warthog:
    label: பிராசெ ப்ரடவி்னஷணே
    summary: அஃகரஸ் கலையில் ஓர் ஏஜிக் குரல் கொண்ட தீவிட்ட சோஹொக்ஸிலர்.
    info: பிராசெ ப்ரடவி்னஷணேதும் அஃகரஸ் கலையின் ஒரு வழிமறியாளரான தீவிட்ட சோஹொக்ஸிலர் என்று நிழலில் உள்ள ஜூனிங் ஐரோப்பிய ஹௌஸ் ஃபுனிண்டும்.
  animal.wild_boar:
    label: திருட்டான்
    summary: |-
      கொள்கலன் கொண்ட
      திருட்டான்,
      அனைத்து வளர்க்கப்பட்ட மஞ்சள் நறுமண ஆடுகளின் முன்னோடி.
    info: "திருட்டான் எலி பசையினமாகவும் அனைத்து வளர்க்கப்பட்ட மஞ்சள் நறுமண ஆடுகளில் இருந்து உருவாகியுள்ளது. \nஇவை ஒழுங்கு மற்றும் ஏற்புடைய ஊட்டச்சத்து உண்ணும் ஜீவராஜாக்கள்; அவை மூலிகைகள், ஓஸ்ஸிஃப்ரோஃப்டர்கள், மற்றும் சிறிய விலங்குகளை ஹாரிஷ் செய்கின்றன. \nஆண்கள்(அல்லது ஐரோன்கள்)\nஎலிகளை குழுக்களில்\nகாப்பாற்றுகின்றன."
  animal.wildebeest:
    label: பகூன்
    summary: ஆப்பிரிக்க ஹெர்஬ிவோர்ஃ மிகப்பெரிய நிலப் போக்கு ஓட்டத்தில் பங்கேற்கும்
    info: "பகூன் குண்னியார் செரேங்கடி மற்றும் பசவ் எல்லாத்திரள் நடுவே ஒவ்வொரு ஆண்டும் ஏழையஞ் ஜீவிகள் அளவில் உலகில் மிகப்பெரிய நிலப் போக்கு ஓட்டத்தில் பங்கேற்கின்றது\nஇவை பெரிய புற்று நோய் , கெஃபெட் மற்றும் கொக்கிரோடைலஸ் ஐ முக்கிய பல்லிழை பௌடராக ஸ்஥ானம் காண்கின்றது \nஅதை மட்டும் இரண்டு முதல் மூன்று வாரங்கள் காலத்தில் அனைத்து பெண்ணும் ஒரே நேரத்தில் பிள்ளை பெற்று விடுகின்றது"
  animal.wolf:
    label: விலங்கு
    summary: ஒரு தென்மரங்கள், வீட்டு நாய்களின் முன்னோடி
    info: Vlk obecný je největší divoká psovitá šelma a předek domácího psa. Žije a loví ve smečkách s pevnou sociální hierarchií a dorozumívá se vytím, kterým si značkuje teritorium a svolává smečku.
  animal.wolverine:
    label: ரோஸாமாக்
    summary: அரிஃப்ஸ் & ஜிங்ஷாஃப்ட்
    info: "ரோசாமாக் புல்லிகள் எனப்படும் வழி உறவுடையது. \r\nஇது சிறிய அளவு மட்டுமல்லாமல் தன்னொடு ஒரு ஆணி நடுவிரிஞ்சியே ஓடி ஏற்று கீழிழக்கும் தன்மை கூட உள்ளது."
  animal.zebra:
    label: செப்ரா
    summary: பழுப்பு மற்றும் வெள்ளை நிறத்தில் பட்டைகள் கொண்ட ஆப்பிரிக்க குருட்டு விலங்கு
    info: செப்ரா குதிரைக்கு ஒப்பான ஆப்பிரிக்க லிக்கோடாக்டில் விலங்கு ஆகும், இதன் கருப்பு மற்றும் வெள்ளை பட்டைகள் மூலம் எளிதில் அடையாளம் காண முடிகின்றது. ஒவ்வொரு விலங்கின் பட்டை வடிவம் ஒரு தனித்துவமானது, மனித கைவிரல் தடம் போலவே உள்ளது, மேலும் குறிப்பிட்ட குழுவில் பாதுகாப்பு பெற உதவுகின்றது.
