lang: ja
pivot: false
title: 野生動物
cards:
  animal.aardvark:
    label: hrabač
    summary: 夜に行動するアフリカ原産の虫喰い哺乳類で、豚のように鼻先があり地面を掘って巣を作る
    info: |-
      {"hint":"夜行性のアフリカ昆虫食動物で、ブタのような吻を持つ（オーリクテロプス・アフェル）","info":"ハラダチはチュビュリンデンタ目唯一の現存種であり近縁な仲間を持たない。
      夜間に活動し、強力な爪と粘着質のある舌を持っているのは、蟻や白蚁を捕えるための適応である。彼が掘った空いた穴を利用して数十種類もの他の動物たちも生活している。
      アフリカン語では「地猪」という意味がある。
  animal.armadillo:
    label: アームヤドイル
    summary: 骨製スケールの鎬のある小柄な哺乳類。骨格装甲を持つ哺乳類として特徴的だ。また、危険時には丸くなる習性がある。さらに、土の中でも迅速かつ正確に動くことができるという点も目立つ特長である。そして天然レプトスピラ保有者としても有名なのだ。このようにして、とてもユニークな生き物なんだね！
    info: '{"hint":"甲殻を持つ哺乳類で、骨の鎧（九帯犰狳、Dasypus novemcinctus）を持っている","info":"ナインバンド・アームャドilloは真に骨質な胸板を備えた唯一の哺乳動物です。\n脅威を感じるといくつかの種がボール状になります。\nこれは優れた掘り手であり、わずか二分以内であちこちから穴を開けることができます。\nらい病菌の自然宿主であることが知られています。","label":"アームヤドイル","summary":"小さな骨片の鎌のような外皮を持った小型哺乳動物。'
  animal.baboon:
    label: サル
    summary: 特徴的な鼻を持つ社会的に暮らすアフリカの大型霊長類です。
    info: |-
      {"hint":"アフリカの草原や岩場に生息する大型の地面を歩く霊長類（パピオ属）","info":"サルは、アフリカの大平原と岩石地帯に住む大きな霊長動物です。
      群れで生活し、階層的な構造を持ち、豊かな音声および表情を使ってコミュニケーションを取ります。
      オスの方がメスよりも顕著に大きくなります。
      サルたちは雑食性であり、エジプトでは神聖な生き物として崇拝されました。","label":"サル","summary":"特徴的な鼻を持つ社会的であるアフリカの大型霊長類"}
  animal.bear:
    label: '"くま"'
    summary: 「太い毛皮を持つ大型雑食性の哺乳類であり自然界での力を表すシンボル」
    info: |-
      {"hint":"大型の雑食性哺乳類（クマ属アリカシラ、棕毛熊）","info":"ヨーロッパとアジアで最大の陸棲肉食動物であるヒグマは体重が最長で700kgに達する。
      魚やベリー、蜂蜜、そして小型ほ乳類を食べる。
      冬には妊娠中のメスも含めて冬眠に入る。
      日常会話では力強さと安らぎの象徴でもある。"}
  animal.beaver:
    label: べイバー
    summary: 土手などを築いて湿原などのエコシステムを作る大型げっ歯類であるベイバースピシー(Castor canadensis)のことだ。この種は世界的にも第二大ゲッチャクアニョであり、木々や泥から作る堰によって多数の生物たちにとって重要な環境を作っている。かつてチェコ共和国には存在していたが、後に消えてしまったものの近年になって復活している。またその特徴として平面的な鱗を持つ尾部、橙色の前歯および防水効果がある被毛などが挙げられる。
    info: '{"hint":"大型のげっ歯類でダムを建設する（カスティロ・カナディエンシス）","info":"ヨーロッパビーガーは世界第２位に大きなげっ歯動物です。\n枝や泥を使って堰を作り、多くの動植物が住む池と湿地帯を作ります。\n平らかな鱗状のお尻を持ち、オレンジ色の大きな門牙があり、撥水性のある毛皮があります。\nチェコでは絶滅しましたが最近数十年間かけて再び戻ってきました。","label":"beaver","summary":"堤防を作って湿生生態系を作る大きいげっ歯類。'
  animal.bison:
    label: ビソン
    summary: 特徴的な毛深い鬃を持つ大型の北米牛科動物
    info: アメリカビソンは北米で最も重い陸棲動物です。19世紀にはほぼ絶滅寸前まで減少しましたが、保護プログラムにより約50万頭に回復しています。
  animal.buffalo:
    label: '"バッファロ"'
    summary: '"「五大猛獣」と呼ばれる動物の中に属し、群れて暮らす大きなアフリカ原産の牛。"'
    info: |-
      {"hint":"大型のアフリカ牛で、大規模な群れに生息する（学名：Syncerus caffer）","info":"アフリカン・ウォーターバッファローは、アフリカ大陸において最も危険とされる哺乳類の一頭であり、「五大猛獣」にも含まれる。
      数百から数千匹の大グループを形成して生活しており、集団防御によってライオンさえ追い払うことができる。
      単独行動をする年老いたオス個体は特に予測不能かつ攻撃的である。"}
  animal.camel:
    label: '"らくだ"'
    summary: '"砂漠の動物であり、脂質貯蔵用の隆起部を持っています。"'
    info: |-
      {"hint":"砂漠に生息する、一つまたは二つのヒップを持つ哺乳類（ Camelus dromedarius）","info":"シングルホーンのラクダは砂漠での生活に完全に対応しており；その背中の部分には脂肪が蓄積されおり水ではなくエネルギーとして保存されています。
      一度で100リットル以上の水分を飲むことができて数週間液体なしでも生き延びることができます。
      これは三千年前以上前に家畜化されていて砂漠文明にとって重要な交通手段です。"}
  animal.capybara:
    label: カピバラ
    summary: 世界最大のげっ歯動物で、半水生かつとても穏やかな性質を持っています
    info: |-
      {"hint":"世界最大のげっ歯類、半水生（Hydrochoerus hydrochaeris）","info":"カピバラは現存する最も大きなげっ歯動物であり；成体は体重が約35〜66kgあります。
      熱帯地域の南アメリカで川や湖畔・沼地に住んでいます。
      非常に社交的であるため他のほぼすべての動物と仲良くできます。また性格も落ち着いており、SNSではリラックスした雰囲気を象徴しています。
  animal.cheetah:
    label: チーター
    summary: 最大瞬間スピードが時速110Kmを超える世界一早い陸棲獣
    info: "{\"hint\":\"最も速い陸上動物で、黒色の涙線のような模様がある（アキノニクス・ジュバタス）\",\"info\":\"チーターは最高速度を誇る地上哺乳類であり、わずか三秒以内に時速百kmまで加速します。\r\n他の大型ネコ科とは異なり鳴き声ではなく唸り出すことができませんが代わりに「ヴル」という独特な音を使います。その細長い体と引き出せない爪は速度重視の適応です。短距離走後には冷却するために休む必要があります。"
  animal.chimpanzee:
    label: チンパーンジ
    summary: 知能のあるサルで、ヒトに最も近縁する生物です
    info: |-
      {"hint":"知的な大型類人猿（パン・トロルゴダイテス）、最も近い生きている親戚","info":"チンポジはボノーボとともに、私たちの最寄りな動物的関係者であり、約９８．７％のDNAを共有しています。
      チンパンジーたちは道具を使います。例えば蟻を探すために枝を使っており、手話言語の基本も学習できます。
      彼らはグループ内で文化習慣を受け継ぎ複雑な社会階層の中で生活します。
  animal.coyote:
    label: coyote
    summary: 都会でも生きられるようにした北アメリカ出身のイヌ目の捕食性哺乳類
    info: '{"hint":"中型の北アメリカ原産犬科動物（学名：Canis latrans）","info":"コヨーテは、適応力のあるイヌ目肉食獣で、全体的に北米に生息しています。\. ウルフとは異なり、人里近くでの生活にも順応し都市部まで広がっています。 アメリカ先住民神話では狡賢いいたずら者として登場します。 コヨーテは主にお日柄と夜間に鳴いてコミュニケーションを取ります。").'
  animal.deer:
    label: ジカ
    summary: 優美な草食性の四足歩行者；雄は年に一度ずつ角を取り外す
    info: '{"hint":"優雅な有蹄類の哺乳動物（Cervus elaphus）；雄は角を持つ","info":"ローマンジカはヨーロッパで最も広く分布している大型シカである。\nオス（トナリ）には毎年脱落し、再び成長する角があり、これは動物界でもっとも速く育つ組織だ。\n秋になると大声を上げてメス（サルマタケビ）のために戦い合う。\nチェコ共和国ではこの鹿が狩猟の国民的象徴となっている。");'
  animal.elephant:
    label: ゾウ
    summary: アフリカの陸上で最も大きい哺乳類で、鼻と大きな耳を持っています。
    info: アフリカゾウは地球上で最も大きい陸棲哺乳類です。鼻は呼吸、飲水、嗅覚、そして食物をつかむために使います。ゾウは最も年配のメスが率いる群れで生活しており、記憶力が良いことで知られています。
  animal.fennec_fox:
    label: フェネク
    summary: 非常に大きな耳を持つ世界最小の犬科哺乳類。
    info: '{"hint":"小さな砂漠の狐で、非常に大きな耳を持っている（学名：Vulpes zerda）","info":"フェネクはサハラ砂漠での生活に適応した世界最小の犬科動物です。\n巨大な耳は体熱を放出し優れた聴覚を得るために使われます。\n腎臓がとても効率的であるため水なしでも生き延びることができ、水分は食物から得ています。\n夜になると昆虫や齧歯類および爬虫類などを捕食します。","label":"フェネク","summary":"非常に大きな耳を持つ世界最小の犬科哺乳類。"'
  animal.fox:
    label: '"lisca"'
    summary: 「赤褐色の毛並みと太った尾を持っている知的な小型のイヌ目肉食獣」
    info: "{\"hint\":\"狡猾な短い犬のような毛皮を持つ動物（学名：Vulpes vulpes）\",\"info\":\"リスカ・オビチナは世界中で最も広く分布しているイヌ科の肉食哺乳類であり、非常に適応力が高い。森やステップ地帯だけでなく都市部でも生活しています。\r\nその賢さと機敏性については世界各地に伝わる童話や寓話の中で称賛されています。\r\nネズミや鳥類および昆虫を捕まえますが緊急時にはゴミも集めます。\r\nメスであるリスカが4～6匹ほどの子供を持ちます。\"}"
  animal.gazelle:
    label: ガゼル
    summary: スラットな体格と素早い動きが特長であるアフリカおよびアジアのサバンナ原産の反芻動物。
    info: |-
      トムソンのガゼルはアフリカで最も広く分布しているガゼルの一つです。
      時速80キロメートル以上を達成でき、捕食者に警告するため特徴的なジャンプを行います。
      非常に大きな群れを作り、チーター、ライオンやハイエナ犬などの獲物となっています。
  animal.giant_anteater:
    label: グレートアースウォーム
    summary: 長く粘着力がある舌を持っていて、歯がない大形哺乳類です。
    info: |-
      {"hint":"大型の歯を持たない動物で、長い吻を持つ（学名：Myrmekofaga tryadaktyla）","info":"グレートアースウォームはマウンテンワームの中で最も大きな種であり、中央アメリカと南アメリカに生息しています。\nこの動物には歯がなく、強力な爪を使って蟻塚を壊し、最大60cmもの粘着性のある舌を使いながらミル虫を集めて食べます。\n一日あたり3万5千匹以上のミル虫や白蚁を食べるといわれています。
      雌個体は子供をお腹にくっつけて運びます。","label":"グレートアースウォーム","summary":"長く粘着力がある舌を持っている無牙の大形哺乳類"}
  animal.giant_panda:
    label: グリーンパンダー
    summary: 中国原産の黒色と白色を持ち、専門的に食用とする植物があります。この種類の熊は非常に珍しく、自然界にはわずかな数だけ存在しています。また、全体的な外見や生態系において重要な役割を果たしており、環境保全活動の一環としても注目されています。さらに興味深い点としては、彼らの消化器官構造上、本来であれば肉食動物であるはずなのに実際には主に植物質を取り入れているという特異な特性もあります。このような理由により科学者たちにとって研究対象となっていますし、一般の人々にも親しみやすくて人気のある生き物でもあります。
    info: |-
      {"hint":"中国の黒白熊（アイラオポダ・メラノレウカ）","info":"パンダは西南省に固有で、世界中における自然保護の象徴です。\nその食事のおよそ99％が竹でありながらも解剖学的には肉食動物であることに注意してください。
      手首から突き出た骨があり、これは茎をつかむために使われる第六指として機能します。
      野生では全世界におよかず1800頭しか生息していません。","label":"グリーンパンダー","summary":"中国原産の黒いと白色を持つ熊で、完全な草食性生物です。
  animal.giraffe:
    label: キリン
    summary: 非常に長い首を持つ、最も背の高い陸棲動物です。
    info: キリンは世界で最も背の高い陸棲動物で、オスは5メートル以上に達します。長い首はアカシアの葉に届かせるために使われ、それが主な食物です。
  animal.gorilla:
    label: ゴリラ
    summary: 地上において最も大きい霊長類、熱帯地域のアフリカから来ている大サルです。
    info: |-
      {"hint":"equatorial Africaの大型類人猿、最大の霊長目動物","info":"ゴリラは地球上で最も大きな霊長目であり、成体のメス（シルバーバック）は最重量で200kgに達する。
      ゴリラたちは主におもに草食性であるため葉や茎そして果物を食べる。
      彼らは音声・表情および胸打によってコミュニケーションを行う。
      チンパンジーと同様に我々人類が近い親戚として共通して持つDNAは全体的に98％以上もある。","label":"ゴリラ","summary":"地上における最大の霊長类、赤道部アフリカ原産の大サル"}
  animal.hippopotamus:
    label: ホップ
    summary: 大きな口を持つアフリカ原産の中型～大形の半水生哺乳動物
    info: |-
      {"hint":"大型の半水生アフリカ哺乳類（Hippos）","info":"ホッポタマス・アンフィビウスは、ゾウやサイに次ぐ第三位の大規模な陸上動物です。\n昼間には加熱を防いでくれる水中で休憩し、夜になると岸辺へ出て草食します。
      皮膚からは日焼け止めと抗菌剤として働く赤い液体が分泌されます。
      見かけとは異なり、ホッポタムズは非常に危険かつ速く動ける生き物なのです。
  animal.hyena:
    label: ハイエナ
    summary: アフリカのサヴァンナーでの斑点を持ち、狩人でもあり死骸を食べる生き物です。
    info: |-
      {"hint":"アフリカのサバンナに生息する斑点のある掠奪者とハンター（クロクータ・クロコタ）","info":"ヒイナスミレはハイエナ科で最大であり、噂とは異なり主として腐肉を食べるものではなく、捕獲した食物が食料の大半である。メスの方がオスよりも優位かつ体も大きい。
      その笑い声は実際には興奮や恐怖によるものであって、楽しさを表すわけではない。","label":"ハイエナ","summary":"アフリカのサバーナにおける斑点を持つ狩猟動物および腐肉食性生物"}
  animal.jaguar:
    label: ジャガー
    summary: アメリカ大陸最大のネコ科肉食獣で、バラ模様を持つ。
    info: "{\"hint\":\"アメリカ最大の猫で、バラモットン（パンテラ・オンカ）のような斑点がある\",\"info\":\"ジャガーは世界第三位に大きなネコ科動物であり、両方のアメリカ大陸唯一の大柄なネコである。\r\nライオタールとは異なり、そのロゼッター状スポットには小さなドットが含まれている。\r\nそれは優れた泳ぎ手と漁師として知られおり、魚やワニそしてキャピパを捕まえることができる。\r\nマヤ人とアステック人の文化において聖なる力と王権象徴であった。\",\"label\":\"ジャガー\",\"summary\":\"アメリカ大陸最大のネコ科肉食獣で、バラ模様を持っている\"}"
  animal.kangaroo:
    label: カバール
    summary: 強力な後肢を使ってジャンプして移動する大型のオーストラリア産の哺乳類
    info: |-
      赤カンガルーやマクロポス属の動物は、世界で最も高いジャンプをすることできるオーストラリア最大の有袋類です。9メートル以上跳躍する能力を持っています。
      雌個体は腹部に赤ちゃん（ジョイ）を入れた袋を持っており、約6か月間その中に幼児を育てます。
      カンガルーはオーストラリアの象徴的な存在であり、国章にも描かれています。
  animal.koala:
    label: コアラ
    summary: ユーカリの木に住むオーストラリア原産の有袋类
    info: |-
      コアラはクマではなく、有袋類です。
      eucaliypusの葉をほぼ完全に食べて生きていますが、これらの葉には多くの動物にとって有毒な成分があります。そのため、コアラは特殊な消化システムを持っています。
      kcaliyptusの葉の栄養価が低いので、一日中最大で22時間眠ります。
  animal.leopard:
    label: れっぱうど
    summary: "斑入り毛皮を持つ大きなネコ目哺乳類，非常に良い登攀能力を持っている．\v\v(info) レッピーは最も広い範囲に分布する大型ネコ科捕食動物である。珍しい爬虫家として，獲物を木々の枝葉部分へ移動させることによってハイエナやライオンからの保護を行う。適性が高いことで他の大切よりも勝り，アフリカだけでなく中東及び極東地方でも生活している。メランチック形式では「ブラックパンサー」と呼ばれる。\v\v(hint) 斑点のある大柄な猫(Pantera Pardus)，よく木の上で休息します．"
    info: "{\"hint\":\"シマオドキ（パンテラ・パルデウス）、木の上に休むことが多い\",\"info\":\"レッピーは最も広く分布している大型ネコ科肉食動物であり、希少な登攀者で獲物を樹冠まで運びヒョウやライオンから守ります。\r\n適応力が他の大型猫より優れておりアフリカおよび近東と遠東地域にも生息しています。黒色変異種はブラックペインターという名前です。\",\"label\":\"れっぷー\",\"summary\":\"斑入り毛皮を持つ大きなネコ目哺乳類、非常に良い登攀能力を持っています。"
  animal.lion:
    label: ライオン
    summary: アフリカのサバンナに生息する大型猫科動物です。
    info: ライオンは主にサハラ以南のアフリカのサバンナに生息する大型猫科動物です。群れで生活し、その群れは「プライド」と呼ばれます。メスたちは一緒に狩りをし、オスの目立つ鬣は競争相手を脅かすために使われます。ライオンはしばしば「獣の王」と呼ばれます。
  animal.lynx:
    label: ヨウグン
    summary: 耳先に毛束のある中程度の大きさを持つ野生の猫
    info: "{\"hint\":\"中型の野生ネコで、耳先に毛束がある（学名： Lynx lynx）\",\"info\":\"ヨウグンはヨーロッパ最大の野性的な猫である。\r\n特徴的なのは耳の尖った部分と短い尾にある黒い毛束であり、それによって識別できる。主にお日が暮れてから夜間に狩りを行い、獲物としてシカやハツカワラを捕えることが多い。\r\nチェコでは絶滅していたが、20世紀後半になって成功裏に戻された。"
  animal.mandrill:
    label: マンドリル
    summary: 顔が青と赤の模様で、世界でもっともカラフルな霊長類です。
    info: '{"hint":"colorful primate with vibrant blue and red face (Mandrillus sphinx)","info":"The mandrill is the largest living Old World monkey and most colorful primate species.\nThe males have bright blue-red facial markings that indicate social status within their group structure.\nThey live together in groups inhabiting rainforests across Cameroon, Gabon, and Republic of Congo","label":"mandrill","summary":"World''s most colorful primate known for its strikingly colored face."}'
  animal.meerkat:
    label: サリカテ
    summary: 砂漠カルハーリー立ち上がる後肢
    info: |-
      {"hint":"Kalahariの小型社会性マングース（サリカタ Suricata suricatta）","info":"サリカテは、南アフリカに生息するマングステ科の小さな哺乳類です。\nsociál的な構造を持つグループで生活しており；常に一人が高台から警戒しています。
      ヘビやクモ毒に対して免疫を持っています。
      狩猟技術を互いに学びます。
  animal.moose:
    label: ロス
    summary: 最も大きな偶蹄目哺乳類である鹿のような形質を持つ大型のトナカイ
    info: ロスは世界最大のシカ科動物であり、オスでは頭頂部で身長が2メートルを超え、幅広い枝状に分岐した角を持っています。北アメリカ・ヨーロッパおよびアジア北部の針葉樹林帯に生息しています。優れた泳ぎ手でもあり、水中植物を食べるために顔を水の中に沈めます。
  animal.okapi:
    label: オカピ
    summary: コングから来た足が縞模様になっている木陰のキリヌマタニシ
    info: |-
      オカピは、科学的に記録されたのが1901年で、人類が発見した最後の大型哺乳動物の一つです。見た目ではキリンとゼブラの中間のような姿をしていますが、最も近い生きている親戚はキリンなのです。
      この動物はコンゴ民主共和国に生え茂る熱帯雨林の中にしか住んでおらず、その国の大切な象徴となっています。
  animal.orangutan:
    label: チンパンジ
    summary: ボルネオおよびスマトラの樹上生活をする大きな茶色がかったサプライム
    info: '{"hint":"ボルネオとスマトラの大型で赤毛の中型類人猿（ピョンゴ）","info":"チンパンジーはアフリカ以外に生息する唯一の大形霊長类である。\nその名前はマレー語から来ており、森の人間を意味している。\nこれは大形霊長類の中で最も独占的であり、人生のかなり長い時間を木々の中に過ごす傾向がある。\n母親たちは子供たちへの世話を8年も行い続けることで知られていて、ヒトを除けば哺乳動物中最も長期的な育児を行う。'
  animal.otter:
    label: ' vydra'
    summary: 清らかな水域で暮らす遊び心のある半水生哺乳類
    info: |-
      川イタチは、完全に水中生活に適応したネコ科の動物です。
      密な防水的な毛皮と蹼があり、息を一分以上止めて泳ぐことができます。また、水質が良いことを示す指標生物でもあります。
      チェコでは一度減少しましたが、最近になって徐々に戻りつつある状況です。
  animal.polar_bear:
    label: アーティックホワイトベアー
    summary: Arctic Circle の最も大きな陸上捕食者はこの熊です
    info: |-
      ヒマラヤグマは、北極圏の頂点捕食者であり最大の陸棲肉食動物です。白い毛皮が完璧に保温し、それぞれの中空で透明な毛髪によって体温を維持します。また非常に優れた泳ぎ手でもあり数百キロメートルも泳ぐことができます。
      しかし気候変動により狩りをする氷床面積が減少しており全体的な個体数への脅威となっています。
  animal.porcupine:
    label: ディコブラズ
    summary: 尖った防御用の棘を持つ大型げっ歯类
    info: "ディコブラズは、千本以上の鋭い空洞の棘で覆われたげっ歯類であり、その棘は変異した毛に過ぎない。\nこれらの棘は矢のように射出されず、触れると簡単に外れて捕食者の体中に刺さる。 \nディコブラズはアフリカ最大のげっ歯動物であるが夜間に樹皮や根菜および野菜を求める。"
  animal.raccoon:
    label: ノラネズミ
    summary: 黒いマスクと縞模様のある尾を持つアメリカ大陸の動物
    info: |-
      {"hint":"北アメリカ原産の夜行性哺乳類（プロサイオン・ロータ）","info":"ノラネズミは北米に生息していますが、ヨーロッパへ移入され現在では広く繁殖しました。
      食事前に食物を水で洗うように見える行動ですが実際には足先の感覚鋭さを高めるためです。
      雑食であり非常に適応力があり都市部でも生活します。","label":"ノラネズミ","summary":"黒いマスクと縞模様のある尾を持つアメリカ大陸の動物"}
  animal.reindeer:
    label: トナカイ
    summary: 両性とも角を持つ寒帯の偶蹄目哺乳類
    info: トナカイは北アメリカ、ヨーロッパおよびアジアのツンドラ地域に生息し、何千キロメートルも移動できる。サモエ族の人々が伝統的に家畜として飼育している。
  animal.rhinoceros:
    label: rhino
    summary: 鼻先にある一本又は二本の角を持つ大きな哺乳動物
    info: '{"hint":"大型のアフリカまたはアジアの草食動物で、一つあるいは二つの角を持っている","info":"白犀は象に次いで世界第二位の大柄な陸上哺乳類です。\nその角は骨ではなくケラチンという物質できており、人間の爪と同じ成分です。\n Rhino（犀）は誤った治療効果に関する信仰により密猟によって深刻な脅威を受けています。\n野生ではアフリカには2種がいて、アジアには3種が生息しています。",'
  animal.sloth:
    label: れぬこど
    summary: 木々の中で足下向きになる遅い木上性哺乳動物
    info: "{\"hint\":\"中央および南アメリカの遅く動かれる木に住む哺乳類（ブラディポダエ）\",\"info\":\"レノコドは、熱帯樹冠でゆっくりとした生活に完全に対応した哺乳動物です。\r\n彼はそれほど動きが遅いため、その毛皮にはカモフラージュとして緑色の藻类が生えています。\r\n代謝機能も非常に遡るため週一回しか空腹を感じません。\r\n異常に強い爪を持ち、それが死後でも吊り下げられるようにしています。\",\"label\":\"れぬこど\",\"summary\":\"木々の中で足下向きになる遅い木上性哺乳動物\"}"
  animal.snow_leopard:
    label: せつぼうひょう
    summary: 中部アジアの高い山岳地帯にいる希少な大きなねこです。
    info: |-
      {"hint":"中央アジアの山脈に生息する神秘的な大型猫（パンテラ・ウンチャ）","info":"雪豹はヒマーラヤ、チベットおよび中東部アシアの高地で標高が三千メートルから五千メートルほどの環境に住んでいる。
      バランスを取るために岩場上で非常に長い尾を持っている。
      世界には推定して四千匹～六千五百匹しかいない。
      これは地球上でもっとも研究されていない大型ネコ科動物である一つだ。","label":"せつぼうひょう","summary":"中部アジアの高い山岳地帯にいる希少な大きなねこ"}
  animal.tapir:
    label: タピル
    summary: 短い象牙のような口がある大きな植物食動物で、サイや馬に関連する存在です。
    info: |-
      {"hint":"大型の草食動物で、捕獲可能な鼻を持つ（タピル）","info":"タピルは馬やサイに近い原始的な奇蹄目でありながら、その関係性が明らかではありません。
      アメリカと東南アジアの熱帯雨林の中に生息しています。
      短くて柔軟なトビラを使って枝葉をつかみます。
      森林伐採および密猟によって絶滅のおそれがあります。","label":"タピル","summary":"短い象牙のような口がある大きな植物食動物で、サイや馬に関連します。"}
  animal.tiger:
    label: タイガー
    summary: "オレンジ色の縁取られたパターンを持ち、世界最大の猫型哺乳類であるターゲットを表しています。このカードは、「 Panthera Tigris」として知られる虎について説明します。「 Panthera Tigris」は「 Bengal Tiger(ベンガルトラ)」とも呼ばれていますが、ここでの表現としては一般的な名称として使用されています。これは正確ではありませんが、文脈上問題ありませんのでそのまま翻訳しました。また、「volně žijící」については日本語において自然発生的に存在するという意味ではなく、「野生」または「自由に生きている」というニュアンスになりますから、「野生」を使用するのが適切と考えられます。したがって最終的には以下のような形になりました：\n\n{ \"label\": \"タイガー\", \n   \"summary\": \"オレンジ色の縷取りされたパターンを持ち、世界最大の猫型哺乳類であるタイガーを示す。\",\n   \"info\": \"{ \\\"hint\\\": \\\"オレンジ色と黒の縛り目を持つ最大の野生ネコ科動物（パンテラ・ティグリス）\\\",\\n     \\\"info\\\": \\\"ベンガルトラは、最も大きな野生猫です。\\n      個々には指紋のように一意的な縄目があります。\\n       ライオンとは異なり、ベンガルトラは独居で泳ぎも得意です。\\n        絶滅危惧種であり、自然界では4000頭未満しかいない。\\\"\n }\" }"
    info: '{"hint":"オレンジ色と黒の縞模様を持つ最大の野生ネコ科動物（パンテラ・ティグリス）","info":"ベンガルトラは、最も大きな野生猫です。\n個々には指紋のように一意的な縦じまがあります。\nライオンとは異なり、ベンガルトラは独居で泳ぎも得意です。\n絶滅危惧種であり、自然界では4000頭未満しかいません。","label":"タイガー","summary":"橙色に縫った世界最大の猫型肉食動物。'
  animal.warthog:
    label: '"ラ・ブレッド・ドゥー"'
    summary: 「顎髭がある巨大な牙を持つアフリカの野性的な猪」
    info: |-
      {"hint":"アフリカの野生の猪で、顔に犬歯を持つ（学名：Phacochoerus africanus）","info":"ブラダヴィチナタエは家畜化されていない自由な生活を送るアフリカ原産の偶蹄目動物であり、家の豚と近い関係にある。
      オスには顔部に突起物があり（ブラダビ）、湾曲した牙が備わっており防御のために使われる。
      逃げる際には尾を持ち上げて垂直に向けることでアンテナのように振舞う。
      穴掘りをする際に自身の力を使うことはせず、むしろイノシシの住んでいる洞窟を利用する。"}
  animal.wild_boar:
    label: ドボチャク
    summary: 野生のブタで、全ての家庭用猪品目への先駆者となる
    info: |-
      {"hint":"ユーラシアの野生ブタで牙を持つ（ Sus Scrofa）、家畜化された豚の祖先","info":"ドボチャクはヨーロッパ原産の種であり、すべての家庭用猪品目の祖である。
      彼らは知能があり適応力が高く雑食性で根やアカシデを掘り起こすだけでなく小動物も狩る。
      雌(メス)は仔豬に対して群れの中で世話をする。
      チェコではドボチャクが最も多く捕獲される野獣だ。"}
  animal.wildebeest:
    label: パコニー
    summary: アフリカ原産の移住性反芻類であり、最も大きな大陸内での群れによる季節変異行動に関与している
    info: ガゼルの一種であるパコニョウは、毎年セレンゲティとマサイ・マラを往来する世界最大級の大規模な陸上移動で知られている。この動物はライオンやチータ、ワニにとって重要な獲物となる。メスたちはわずかに二週間から三週間にわたってほぼ同時に子供を産む。
  animal.wolf:
    label: オオカミ
    summary: 家犬の祖先である野生の犬科動物です。
    info: オオカミは最も大きい野生の犬科動物であり、家犬の祖先です。社会的な階層を持つ群れで生活し、狩りをします。吠え声で縄張りを示したり、群れを呼び寄せたりします。
  animal.wolverine:
    label: ロソマク
    summary: 寒帯林やツンドラにおける強いかつ激しいネコ目哺乳類である。
    info: |-
      {"hint":"寒帯森林の太くて攻撃的なネコ科動物（学名：Gulo gulo）","info":"ロソマクは、最大の陸棲ファーン・フェアリー属に所属する。
      体が小さいにもかかわらずその力強さと好戦性で知られおり、熊から獲物を追い払うことができる。北アメリカ、ヨーロッパおよびアジアの広範囲な寒帯林やツンドラ地域において生息している。","label":"ロソマク","summary":"寒帯林やツンドラにおける強いかつ激しいネコ目哺乳類である。}
  animal.zebra:
    label: シマウマ
    summary: アフリカの奇蹄目動物で、黒白の縞模様を持っています。
    info: シマウマは馬に近いアフリカの奇蹄目動物で、黒白の縞模様が特徴です。個々の模様は人間の指紋のように一意であり、群れの中で捕食者を混乱させる役割を果たします。
