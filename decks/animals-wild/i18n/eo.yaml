lang: eo
pivot: false
title: Divaj bestoj
cards:
  animal.aardvark:
    label: kapmoss
    summary: Afrika nokta insektopedo kun porkapo kiu grizigas truojn.
    info: Kapmoss is la sola vivanta specio de ordas Tubulidentata kaj ne havas ajnan proksiman parencon. Noktura vivo, fortikaj unghoj kaj glua lingvo estas adaptoj por ĉaŭpi formikejn kaj tarmidojn. Lia forlasita truo uzatas per dudeko da aliaj animalospecioj.
  animal.armadillo:
    label: pasoĉevalo
    summary: Malgranda mamulo revoltita el osteŝpinego.
    info: La pásovico dekuopinta estas la unua mamulo kun vera ostara ŝildo. Kelkaj specioj ruligu sin en pilkon dum danĝero. Ĝi tre bone spaconas kaj povas gravi truo per du minutojn.
  animal.baboon:
    label: babuino
    summary: Granda afrika primato havanta distingatan nazon kaj socialan manieron.
    info: Babuinoj estas grupo de grandaj afrikaj simiecaj animaloj vivantaj en sabanojn kaj rokaĵon okupitaj regionoj. Ili loĝas en trupo kun socia rango strukturo kaj uzas diversan gamon da sonoj kaj gestararo por interkomuniki. Viroj signife plenkreskas ol virinoj.
  animal.bear:
    label: ursido
    summary: Granda plentempa besto kun densa pelto simboliganta forton.
    info: Brown bears estas la plej granda terrestri karnivo de Eŭropo kaj Azio, atinganta pezon ĝis 700 kilogramojn.Ĝi manĝas fiŝon, beranojn, balzamojn kaj malgrandajn mamiferojn.Kataputante en vinterpauzo dum kiun femaloj donacas al sia prole.
  animal.beaver:
    label: eurasia bobro
    summary: Granda rodo konstrukcianta barojn kaj kreante eko-sistemojn.
    info: Eurasia bobro estas la dua plej granda rodo en mondo kaj konstruas barojn el branĉo kaj limo por formi lagunojn kaj marĉejojn kiuj hejmpastoras multajn animalarbojn. Gxi havas plankan skalecan ujon, grandajn naranĝ-kolorajn molarojn kaj akvodisiprenantan pelon.
  animal.bison:
    label: bisono
    summary: Granda nordamericana buvido kun tipika pelzema manko.
    info: American Bison estas la plej peza terrestri animalo de Norda Ameriko. En la 19-a jarcento ĝi estis preskaŭ elsterigita; inter estimitaj 30 kaj 60 millionoj da individuo restadis malpli ol centero. Dank' al protektado prograamo numero refariĝis al proksimume polormil.
  animal.buffalo:
    label: afrika bòvolo
    summary: Grand-afrika bovido viva en grupoj; membro de Granda kvinero.
    info: Afrikański buvolo estas unu el la pleje danĝeraj mamiferoj de Afrikio kaj parto tiel nomita 'Granda Kvinero'. Ĝi vivas en grupojn kun centoj al miloj da individuo kaj povas forpeladi eĉ leo per komuna defendo. Maljunulo virinoj ekstergrupo estadas aparte neregulecaj kaj agresiva.
  animal.camel:
    label: Kameleido
    summary: Deserta mamulo kun horboj funkciantaj kiel magazeno de graso.
    info: La Dromeđaro estas perfekte adaptita al la dezerto kaj ties horbo tenas grasoletojn por energioreservo, ne akvo. Ĝi povas trinki pli ol cent litrojn da akvo en unun urĝantan momenton kaj vivadi semajnon sen akvopreno.
  animal.capybara:
    label: kapibara
    summary: Plej grandspeca rodo mondo havante semiaquan ekziston.
    info: La kapybaro estas la plej granda vivanta rodo; plenkreska individuo pezas inter 35 kaj 66 kilogramoj. Ĝi loĝas en varmegraj regionoj de Suda Aŭstralio proksime al riveroj, lakegoj kaj marĉaroj.
  animal.cheetah:
    label: Geperdo
    summary: Plej rapido terrestra animalo atinganta pli ol Centdekunok kilomitrojn hore.
    info: La gepardo estas la plej rapida terrestro besto kaj en tri sekundojn akcelas de nulo ĝis cent kilometroj horje. Kontraste al aliaj grandaj katigatoj, ĉi tielbesto ne povas murmuradi sed anstataŭe emitas sonon similan al murmuro. Lia malsuprenmetita korpa formo kaj senpovadle tenadaj unghoj formas adaptaĵoj por rapideco prefere ol forto.
  animal.chimpanzee:
    label: ĥimpanzo
    summary: Instrua simia primate, homo pli proksimo animale.
    info: |-
      La ĥimpanso estas kune kun la bongo nostro plej proksima animala parento kaj ni partumas priproksime 98,7% de DNO.
      Ĥimpanzoj uzas ilon por ekzemple pescado per branĉeto al termitoj kaj povas lerni bazan signolingvon
      Ili transdonas kulturan tradicion en grupojn kaj vivadas komplekso socialajn hierarkiojn.
  animal.coyote:
    label: coyote
    summary: Nord-aŭstralia kanina bestaro kapabla ekzisti inter urboj.
    info: Coyote estas adapta membro de la familio Canida kiu loĝas en tuta Norda Aŭstralio. Kontraste al lupoj ĝi sukcese vivplenumigxis ankaŭ proksime homoj kun disvolviĝo eĉ urbokvarakretojn. En nord-amerekan aboriginismaj mitologiaĵoj ĉefe agadas astute.
  animal.deer:
    label: elpato
    summary: Eleganta kruurtico kun branĉoj
    info: Elapo de la arbaro estas plej disvolvigita granda cervido en Eŭropo. Samecoj portas branĉojn kiun ili perdas unuekte eke rekrektas ĉiu jaron – tiel rapidan tkanonturon havas nur kelkaj aliaj bestaroj. En oktobro ili faras fortan sonadon por ataki rivalojn pri feminoj.
  animal.elephant:
    label: elefanto
    summary: Plej grandspeca terestra mamifko kun naso kaj grandegaj oreloj.
    info: Afrikaneslono estas la plej granda terrestro mamifo sur Tero. Ĝi uzas nason por spirado, trinkado, olfakado kaj prenante manĝo. Elefantoj vivadas en grupoj gviditaj de plenkreska ino kaj havas bonan memoron.
  animal.fennec_fox:
    label: finksimio
    summary: Plej mallonga psa similaj bestoj kun enormaj oreloro.
    info: La feneko estas la plej malgranda psa simila besto adaptita al vivado en sahara dezerto. Ĝiajn grandajn orelojn uzas por elsendi korpa varmecon kaj havadi bonan aŭdon. La renoj de tiuj animaloj funkcias ekstreme bone permesante ilin supervivi sen akvo absorbita rekte – ili ricevas malfarmon tra sia manĝo.
  animal.fox:
    label: Lisxo
    summary: Kapablula psoido kun densa coka kaj ruda pelto.
    info: La liśko generala estas la plej disvolviĝinta kaniida fera besto en mondo kaj tre bonadaptita al diversa medio - ĝi vivas en arbaroj, stepejoj eĉ urbojn. Ĝi establis famon pri sia astuteco pridiktata per fabuloj kaj rakontoj tra tuta mundo.
  animal.gazelle:
    label: gazele
    summary: Slabflanka rapida antilo de african kaj azia saveno.
    info: Thomson-gazel estas unu el la plej disvastigitaj afrikaj gazeloj kiu povas atingi rapidon pli granda ol 80 km/h; ĝi faras karakterizantajn saltetojn por signaligi al predatoroj kaj vivadas en enormaj grupoj estante grava predo de gepardoj, leo kaj hienhundoj.
  animal.giant_anteater:
    label: grandeg-pantiro-mravi
    summary: Grandega bez-dentema besto kun longa naso kaj glata lingvo.
    info: Pantiromravis grandega estas la plej grava specio de pantiromrivido kaj loĝas en Centra kaj Sudameriko. Ĝi havas neniujn dentojn; per forta unghoj disigas formikejojn kaj kuniras formikojn uzante adhezionan lingvon eltenantan ĝis sesdek centimetrojn da longeco.
  animal.giant_panda:
    label: granda panda
    summary: Nigra-blankega urso el Azie ekzkluzive vivanta sur bamboo.
    info: Grande panda estas endemia de sudoka Azio kaj globala simbolo por naturprotekto. Preskaŭ la tutan tagon ŝi manĝas bamon, kvankam anatome temas pri Karnovo. Ŝi havas sesa fingron - modifiitan perono-koston en sia pugno kiun uzas dum preni bamontojn.
  animal.giraffe:
    label: girafo
    summary: La plej alta terestra besto per ekstreme granda nuko.
    info: Girafo estas la plej alta terrestri animalo en mondo kaj masuloj atingas altecon pli ol kvin metrojn. Ĝia mallonga korpo kun tre longakra kolono ebligas al ŝi rektigiĝi por manĝadi foliojn de Akacia arboj.
  animal.gorilla:
    label: gorelio
    summary: Plej granda prima specio sur Tero, grava simia de ekuatora Afro.
    info: La gorilo estas la plej granda primo en Tero kaj pezas ĝis 200 kilogramojn dum plenaĝo. Gorilas manĝas preskaŭ ekzkluze vegetan dieton el folioj, frunojn kaj melekoj. Ili komunikiĝas per sonoj, gemoj kaj pitempo al sia torako.
  animal.hippopotamus:
    label: hippopotamo
    summary: Granda afrika semiaqua-mamulo kun enormaj mandibloj.
    info: La hippopotamo estas la tria plej granda terrestria mamulo post elefanto kaj rinoceronto. Ĝi paŭzegas en akvo dum tago por protekti sin kontraŭ supervarmeco sed foras nokte al pastorejo sur sekca tereno. La poko eldonas ruĝan likvoron funkciantan kiel natursola kreemo kaj antibiotiko.
  animal.hyena:
    label: hiena
    summary: Rupa predatoro kaj mortmanĝulo en afrikan savano
    info: |-
      La hieno rupuca estas la plej granda membro de ties familio kaj kontrarie al ĝia reputacio ŝe troviĝas pri prungrundo plenumante super 60% el sia manĝado per sinmemba lovo
      Influaj femaloj dominas tiujn grupojn kaj havas plenan korpon ol maskloj
      Ilia riseto vere esprimas emociojn kiuj inkluzivas eksciton sed ankaŭ timon
  animal.jaguar:
    label: jaguo
    summary: Plej granda felina besto el Nordameriko kun rotatempigantaj makuloj.
    info: La jaguo estas la tria plej granda felino en mondo kaj unika granda katofonto de ĉiuj du Hemisfaroj. Kontraste al pumaĝo, ĝiajn rozetojn havas malgrandaj punktoj interne. Jaguo tre bone natras kaj fiŝkas; Ĝi prenas por fandio ankaŭ kapibarojn kaj krocodilojn.
  animal.kangaroo:
    label: klokano
    summary: Granda australiana vaçnano kiun karakterizas potencaj posteroj per kiuj saltegas.
    info: Rudokolora klokano estas la plej granda aŭstraliovaĉno kaj plenumas saltetojn ĝis preskaŭ dekmetro alteco; samulo portigas sian proles en ventra saketo dum ses monatoj antau ol forlasiĝi. Klokani estas tre konatan simbolo por landmarkoj kiel ekzemple nacia emblemo.
  animal.koala:
    label: koalo
    summary: En Auztradio vivanta arbodomo kloako.
    info: La Koalo ne estas urso sed kloakulo. Ĝi manĝas preskaŭ nur foliojn de la eukalipto, kiuj estas venenaj por plej multe da bestoj; tiel ekzistas speciala digestema sistemo en la koalo. La koalos dormadas plenumas denove ĝis dudekvir du horojn tagrekte, ĉar la eukalipta foliaĵo havas malaltan nutrivon valoron.
  animal.leopard:
    label: pardalo
    summary: Grandega kato kun punkteca pelfako bone kapabla montro.
    info: Pardalo estas la pleje rozprajta grandega kafokatolfo kiu povas ŝtiriĝi sur arbojn por protekti sian pridomon kontraŭ hiienoj kaj leo. Ĝia adaptivo superas tiujn de aliaj grandegaj katofidoj; vivante en Afriko, proksima oriento kaj malproksima oriento.
  animal.lion:
    label: leo
    summary: Granda felina besto el Afrika sahelo.
    info: Leo estas granda felina besto vivanta ĉefe en afrikanaj sabanoj sude de la Sahara. Ili loĝas kun grupo nomata pride; la femaloj venkas maniero kune dum masuloj havantaj markatan mantelon por intimidi kontraŭulon.
  animal.lynx:
    label: rus
    summary: Mezgrandeco wilddogto kun hairoŝpiteloj en orelokutimo.
    info: La ruso vidis estas la plej granda eŭropa saĝego kato. Oni rekonas lin pro karakterizaj tufeto de nigraj haroj sur ŝpicojn el sia oreloj kaj mallonga vosto.
  animal.mandrill:
    label: mandrilo
    summary: Pleje barvigita primato kun blua kaj ruda fako.
    info: La mandrilo estas la plej granda kaj vivanta simio de Malnovmundo kaj ankaŭ pli barvitaj primatoj. Virinoj havas brilante bluan kaj ruĝan facnomasko montrantan ilian sociajn rangojn en grupoj kiuj loĝadas tropikaj arbaroj ekzemple Kamero, Gabaono kaj Republiko Centrafrika.
  animal.meerkat:
    label: surikato
    summary: Malsama komunuma besto el la dezerto Kalaĥario staranta per ambaŭ piedoj.
    info: La Surikato estas malgranda mamelo el la familio de mustelidoj kiu loĝas en Suda Afriko. Ĝi vivas kun fiksita socia ordigo dum grupo; unua membro observadas ekde alta loko. La animalo havas immunon kontraŭ serpentoj kaj skalpojn.
  animal.moose:
    label: elko
    summary: Plej granda el cervidaj mamuloj havanta larĝajn horoj.
    info: "Elk estas la plej granda membro de familio cervidae en mondo; viroj atingas altecon super du metrojn ĉe la koleno kun vastaj horoj kiuj etendiĝas supren ĝis cento okdek centimetroj. \nĜi loĝas en taigaj arbarumadoj Nordameriko, Eŭropo kaj Azio. \nĈefe pro sia bonkapablo por natado kaj mergadon, elk submergadas sian kapon serĉante akuan vegetacion."
  animal.okapi:
    label: okapi
    summary: Arbarparentejo da Ţirmefo havante stripitajn gambejn partojn originantajn el Kongo.
    info: La okapo estis sciencile deskribita nur en la jaro 1901 kaj estas unu el lastatempaj grandaj mamuloj malkovritaj per scienca esploro. Kvankam ĝia eksteraspekto similas al kruciĝo inter ţirafo kaj zebrido, tamen temas pri pleje proksima vivanta parenteco kun la Ŝirmafio. La Okapoj loĝadas ekskluze en pluvforesto de Demokratikaja Respubliko Kongo kaj servas kiel landismo simbolo.
  animal.orangutan:
    label: oranguto
    summary: Rakonto pri ruĝbruna grandsimia primate el Borno kaj Sumatro.
    info: La orangutano estas la unika grandega homana simio vivanta ekster Azio. Ĝi pasigas plejparton de sia vivo en arbaroj kaj estas tre solita inter tiel nomitaj 'grandegaj primatoj'. Matroj instruu sian proles dum ok jaroj - tio signifas plenuman atenton al infanoj ol ajna mamiferulo escepte homo.
  animal.otter:
    label: vydro
    summary: Plenaĝema duakvia mamiferbesto vivanta proksime pri neturigitaj fluoj.
    info: "La rivera vydro estas besto el la familio luteola perfekte adaptita al akvokonsiderinda vivo. \nĜin havas densan hidrofoba plumaro, nenduktojn inter fingrioj kaj kapablon reteni sian spiradperiodon pli ol minuto. Vydroj servas kiel markato por purigo de akvoj - tiekie ekzistas pureco en la akva medio."
  animal.polar_bear:
    label: polarburo
    summary: La plej grava terestra manĝemano vivante en arkta regiono.
    info: Polarburo estas la plej granda terrestri stribo kaj apoganta predator de Arkto. Ĝia blanka plumaro perfekte isolas varmecon; ĉiu haro malplena kaj transparenta.Ĝi tre bonvolanteme natras kaj povas fornatrigxi centoj da km.
  animal.porcupine:
    label: porcupino
    summary: Granda hodavesto kun multe da defensivaj akrospicigo.
    info: |-
      Porcupine estas granda hodiaŭo protektita per milero da ostromaj malplenaj spicoj kiuj originas el ŝanĝitaj haroj.
      La spicojn oni ne povas forpafi kiel sagojn; ili facile detachesiĝas dum tuŝado kaj eniras la korpon de predatoro.
      Porcupines estas plej grando afrika hodaveto kaj nokte serĉas barkon, radikoĵojn kaj verdon.
  animal.raccoon:
    label: nosfero
    summary: Maskota besto kun striata vango kaj nigrumasko.
    info: La nosfero de Nordameriko estas originema el tiu regiono sed estis enkondukita al Eŭropo, kie ĝi hodiaŭ disvastiĝas ampleksigante multajn lokojn.Ĝi famas pri la maniero ŝajne lavi siajn mankoj antaŭ ol manĝi por pliboniigi ilin per taktileco. Ĝi havas diversmaneran dieton kaj kapablon adapti sin ankaŭ je dense lokitaj urboj.
  animal.reindeer:
    label: reindiero
    summary: Arktisa cervido kun plenkreska kapabeco de migrado.
    info: Reindeer is adapted to its winter environment—its feet become softer for walking on moss during summer but harder when it's icy cold weather.
  animal.rhinoceros:
    label: Noso Rhino
    summary: Granda herbonomo kun unusola du rhinoceros.
    info: La nosorozo blanka estas la dua plej granda terrestre karnofago post elefanto. Ĝia rino ne konsistas el ostoj sed el queratino, sama materialo kiun havas homaj unghioj.
  animal.sloth:
    label: lenokap
    summary: Malrapido arbotre antaŭstaranta kun piedkapoj supren.
    info: La lenokapo estas mamulo perfekte adaptita al malrapideco en la koro de tropeaj arboj. Ĝi moviĝas tiel malrapidamente ke verda musko kreskas sur ties pelfoj por kaŭzado per kamuflo. Tiega metabolismo establas nur unuanfojan dum semajno.
  animal.snow_leopard:
    label: Niveleopardo
    summary: Rara grandbesto el centroazia altmontaro.
    info: La nivoleopardo vivas en alta montara tereno de la Himaĵaj Alpoj, Tibeto kaj centra azia monatojn je alteco inter 3 000 ĝis 5 000 metroj. Gxi havas tre longan vestron por helpi sian ekvilibriĝon sur roko. Estimas ke nur 4–6 mil da tiuj bestoj restadas dum vivo.
  animal.tapir:
    label: tapiro
    summary: Granda herbofago kun mallongan narbon, proksima parenco al la naserodo kaj ekzemple Ĉevalo.
    info: Tapiro estas malplena unghavita bestego rilatanta al naserodoj kaj ĉevaloj, kvankam tio ne ŝuldas klare. Ili loĝas en varmegrejeblarbaroj de Aмерiko kaj sudoriente Azijo. Ilia mallonga elasta naso servas por prenado da branĉoj kaj folioj.
  animal.tiger:
    label: Tigro
    summary: Pleja grandeco da katoligna besto monda kun narankeca stripitajo.
    info: Bengala tigero estas la plej granda libera vivanta fokko felina bestaro en mondo. Ĉiu individuo havas unikan strekan patron sur sia korpo simila al homaj pintonprintoj; tiu patono povas establi identecon de persono per bildigo el satelite sen atakado direkte kontraŭ li/a. Kontraste kun leo kiuj restadas en grupoj dum tago sed forlasas ilin por manĝi sola nokte, Tigeroj preferas agadon sole eĉ dum ludoj inter si mem.
  animal.warthog:
    label: afrika bradeopraso
    summary: Afrika bradeopraso estas granda besto simila al praso sed kun fortika dentaro kaj bradvicetoj sur facio.
    info: La afrikaj bradeohipopotamoj estas libere vivantaj progentroj de la ĉevalpiedoj en Afriko rilata al hejmpraseco. Virinoj havas buŝajn elstarigojn (bradvicoj) kaj kurbozigitajn dentojn por defendado mem. Dum fugado ili movigas siajn korpojn vertikale kun pendo formanta antennon.
  animal.wild_boar:
    label: wildboar
    summary: Malpastro swine having teeths which is predecessor for all breeds.
    info: |-
      Wild boar estas originuma eŭropa specio kaj antaǔulo de omni domestikaj porkspecoj en Eŭrazio
      Ili havas intelekton kaj kapablons adaptiĝi al diversaj kondiĉoj; ili manĝas radikoĵen, akonojn sed ankaû huntas malgrandan faunon,
      samicoj (saminoj) instruas gepatrojn por infanoj kun grupoj.
  animal.wildebeest:
    label: gnoroko
    summary: Afrika migranta antilopo partoprenante pri plenumita dryada migracie.
    info: Gnoroko estas konata per unu el la plej grandaj terrestriaj migraĵoj en mondo; preskaŭ milliono da ĉevalokuloj translokas inter Serengetio kaj Maasi Mabarene jariĝe.Ĝin persekvas leo, gepardo kaj krocodilo.Samicoj naskadas preskaŭ samtempe dum nur du al tri semaipojn.
  animal.wolf:
    label: lupo
    summary: Silvestro pasoforma besto, antaŭulo al la hejmpaso.
    info: La lupo estas la plej granda saĝega kaj silvestra membro de la familio Pseido, antaŭulo al la hejmpaso. Ĝi vivas kaj venkas en trupoj kun fiksita socia hiarĥio kaj komunikiĝas per ululuado por markadi ties tereon kaj voki siajn partneroj.
  animal.wolverine:
    label: lynxo
    summary: Forika kaj fiera mustela besto vivante en boreala forestaro kaj step'arbarejo.
    info: Lynx estas la plej granda dryada membro de familio Musteloformaj. Tamen ĝia grando establis renomon pri eksterordinara forto kaj agreso; eĉ kapablanta droni urson al sia predo. Vivantas en vastaj distriktoj el nordoklimata arbaro kaj taigoj Nordameriko, Eŭropo kaj Azio.
  animal.zebra:
    label: zebro
    summary: Afrika parimebla besto kun nigro blankaj frizoj.
    info: Zebras estas afrikanaj parimebloj rilata al la ekaperas kaj facile rekonigeblaj pro nigrablankaj strikojn. Ĉiu individuo havas unikan strekopatrónon similan al homa pintonprinto, kiun helpas malhelpadi predatecon en grupo.
