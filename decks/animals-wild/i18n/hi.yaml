lang: hi
pivot: false
title: विलग जानवर
cards:
  animal.aardvark:
    label: खुफिया
    summary: एक घरेलू ऑफ्रिकन डाउनलाओइंग फिस्थर
    info: |-
      केप रैटल्टाइजर ही प्रतिबंधित के सभी जीवित प्रजाति है।
      यह मच्छरों और चमगदड़ों का शिकार करने के लिए अपने नौकशील आसन्‍न व गुब्बारे भाषण द्वारा खोजता है।
  animal.armadillo:
    label: पासोवेक
    summary: अधिकाँश फोस्परिण्ड ऑर्नमेंटल ऐस्केलेटर
    info: |-
      पासोवेक नौम किंस्टुज़ मनखे सब प्रकार की हडि्या केरला छत्र के संग एकटा अद्वितीय स्थायी जाड़।
      एहि के खतरा में आउथे बरफे दश घुमकर गोल ले चढऩ के शुरूआत करई भी。
      इ उच्च ऊण्हा धरि ढिठाई और इ ओछे से दो मिमट में झोझ निकाळ सकई।
  animal.baboon:
    label: पापिऑन
    summary: अफ़्रीका के एक ठण्डे ऐश्चर्यजनक चेहरे वाले जानवर जो सामाजिक जीवन जीते है।
    info: "पावियन एक प्रजाति हैं जो केंद्रीय अफ़्रीका महाद्वीप मे सवाना और पतली चट्टानों के क्षेत्रों में रहते है।\nइसमें शुष्क ध्वनिओं आऊर भावभंगी के बड़े लचीले ढंग के साथ घरेलू गठबंधन के ऊपर उछलते है। \nएक छोटे खास झुंड में इनके डामर फँसे हुआई है।"
  animal.bear:
    label: मधवड़
    summary: एक बड़ा आहारशाही उच्च ऊष्णकटिपथी खरगोश इसका घर है।
    info: भूरा भालु हिमाच्छद प्रजाति के सबसे महत्वपूर्ण जंगली शेड़ों में से एक है। यह अफगानिस्तान और रूस दोनों में पाया गया है।
  animal.beaver:
    label: बॉबर
    summary: ऊंचे ढाहे वाला हड़कटनहार जो ड्रम बनाता है ऐवं नदीघाटी आवास प्रणाळी बनाता है।
    info: |-
      बॉबर यूरोपीय संसार का द्वितीय सबले हुए पशुवर्ग में सबलतम हड़कटनहार है।
      इसके शाखाओं और चिकनी मिट्ठि से बने ड्रम जलखण्ड एवं नदीघाटी के अधिपति आवास लगभग छठ्‍छ भिन्न प्रजातियों के घर होते हैं।
      उच्छ्मष्ण फफड़े धाँधली झाइयों के साथ ऊपर के ऑरेञ्ज रंग के ढाहे ऐवं जलअवरोधी बाल इसके विषेि हैं।
  animal.bison:
    label: भालू
    summary: एक ठंढा छोटा डाँगर जानवर था जिसके ऊपर ऐसे ढेर से बाल थे।
    info: |-
      अमेरिकी भालू संयुक्त राज्यों का हवेली प्रजनन और महत्वपूर्ण बचाने अभियानों के कारण फिर से उबड़-खाबड़ हल्दी घटा।
      उसके आधुनिक चिह्मति एक शिखर गठन है और इसे 'दक्षिणी' ओशन के झगड़े के टौर पर ध्यान दिया जाता है।
  animal.buffalo:
    label: अफ्रीकी हिरण
    summary: '''वृहद् पाँच'' का एक सदस्य, इस छोटे ऊष्णकटिबंधीय ढीठ ऐलूर के समूह में रहता है'
    info: "अफ्रीका के सबसे खतरनाक पशुओं में से हिरण एक 'वृहद् पाँच' का हिस्सा होता है।\nयह समूहों में जिनमें सौ लगभग तथा हज़ारों व्यक्ति शामिल होते हैं बड़े समूहों में ठहरता है और साझा आत्मरक्षा के माध्यम से भले ही चीते को घर से दूर फटकार डाल सकता है। \nएकल गर्मप्रधान उम्रदराज अप्रत्याशित ओर आक्रामक होते हैं।"
  animal.camel:
    label: ऊठ
    summary: खम्सा झुण्ड ओढऩे वाला ठंडा ऐसा जीव जिसके ढेर में ऑईल थोथा भरा होता है।
    info: |-
      एकल खम्भा हावी मेंग कैमिलस सहारन पर एकदम से अपने जीवन को तटबंधियों के बजाने के उचितता हुआ।
      इसके ऊँचे चिह्नों में घीयुक्त ग्रीष्मकाळि शक्कड़ा और इसके द्वारा आवश्यकता पर छोटे टुकड़ों में फौरन 100 लीटर पानी के डालने के धाप होते हैं।
  animal.capybara:
    label: कैपिबारा
    summary: एक ओछा ढंग से ऑउटडोअर और शांत जानवर
    info: |-
      कैपिबारा दुनिया के सबसे लंबी होल्डरवेस में से एक है। प्रगतिशील वज़न 35 से 66 किग्रा तक होता है।
      यह उष्णकटिबध्न क्षेत्रों में जमई अफ्रीका के घाटी, झील और चिपचिपदार भूभागों में पाया जाता है。
      इसका आकर्मणकारी इच्छा शांत है और ऐसे काफी खुशमिजाजी था कि लगभग हर धड़कन ऊपर ठीठ रखता है।
  animal.cheetah:
    label: गिपर्ड
    summary: खंड मनुष्य बहुत अधिक गति वाला चीज़, 110 किमी / h से ऊपर प्रकट करता है।
    info: चीता भूमि पर सबसे तेज़ हवाईयल कोई और।
  animal.chimpanzee:
    label: shimpanzee
    summary: एक अप्रधिक जुगलखटि्ठय चित्रण और मनुष्य का सभी दुनिए मेह निकटतम शास्ट्रीय सहचर
    info: |-
      शिम्पांज़ी बोनॉब के साथ हमारा पड़सल मेवरकतवंद है।
      humlogon ke saath unki dna meh lagbhag 98.7% samanata hai。
      unhe nimron ki madad liye jaroorat padti hai aur humne usey mudra bhasha seekhane ka shakthi prapt hua hai。
      uun log ek doosre ko apni sanskritik adatanu pratibha denate hue milte hai aur vyavasthit social hierarchy mein rehte hai
  animal.coyote:
    label: |-
      कोईओट
      (उछल)
    summary: एक ऐसा औषधी जो शहरात रहाण्यास ढाळला आहे
    info: |-
      कोयुट एक प्रतिकूल स्थायी कुनेट हवेरा महसूर करणारा जंगलचा झाडपोश आहे जो समोरखी अमेरिकेत वसति घडवतो।
      भेलदानच्या बरोबरीने इथे शहरामध्ये देखील उघड़ा ठेऊन गेले आहे。
      अमेरिकन भाषाच्छेपी ओझाही मजबूत धोरणासाठी फाईल करतात।
  animal.deer:
    label: जेलन
    summary: एक सुंदर कुञ्जल जानवर ; मर्दके मे परछे हई
    info: "जेलन जंगली हरे पैदा कर्नुस एलाफ़स सबसे महत्वपूर्ण बड़ा हिरण हो। \nमर्दके(एवि) प्रत्येक वर्ष गिराते हई अउ उभटते हई खामखाह परछे धारक होइथे,\njो शास्त्रीय ऊष्ठ घनत्व के सबसे झीठरे भाँच टिछऊ हई।\nअक्टूबर मे ओ आश्चर्यजनक डेढ़ और इधर-ओधर लड़ाई मे ऐ मादा (झीठरे)\nआघे ऑफर करत हई।\nczecoslovakia मे जेलन शिकार के राष्ट्रीय प्रतीक हई।"
  animal.elephant:
    label: हाथी
    summary: पृथ्वी का सबसे बड़ा स्थलीय स्तनधारी, जिसके पास एक खूबसूरत चूचा और बड़े कान होते हैं।
    info: अफ्रीकी हाथी पृथ्वी पर सबसे बड़ा स्थलीय स्तनधारी है। वह अपने चूचे का उपयोग सांस लेने, पानी पीने, खुशबू लेने और भोजन पकड़ने के लिए करता है। हाथी झुंड में रहते हैं, जिसका नेतृत्व सबसे बुजुर्ग मादा हाथी करती है और वे अपनी अच्छी याददाश्त के लिए जाने जाते हैं।
  animal.fennec_fox:
    label: फेनक
    summary: अत्यधिक लंबे कान वाली ऐशिया की सहारन मरुभूमि की छोटी बचड़ों की जाति
    info: "फेनक एशिया के सहारन मरुभूमि प्रजाति की हल्की बचड़ों की छोटी जाति है।\nइसके अत्यधिक लंबे कान शरीर के गर्मी को फैलाने और उपयोगी ध्वनि के आवेदन के लिए होते हैं। \nएकदम सख्त किडनी के कारण इसे खासकर पानी की आवश्यकता भी नहीं होती है - चरघोष के माध्यम से घुले हुए ठंढे पदार्थ के झरने ऊपर ओझल हो जाते हैं।"
  animal.fox:
    label: लिस्का
    summary: छोटे पश्चिमी जानवर जे घने पूंछ भौर लाल बरगद वाला होए
    info: "लिस्का ओबेनाय संसार की सर्वोच्च प्रख्याति हुई मनके जमशद और अपवहत शैया हूएग। इ लड़के बढ़ते झाड़ियों, घाटिम भौर धूमधागे में आजीविका खेळथे।\nइ दुनिएभर के कहाणिहरू छोटे उपहास फैलाथे ऐ ऊषण ढंग से प्रसिद्ध हऊ। \nउ हरने ठेपर, पक्षी भौर कीटनाँ ; आवश्यकता होए त िफर अपवहत भी ऑठत हऊ।"
  animal.gazelle:
    label: गजेला
    summary: अफ्रीकी दक्प ऊ एशिई सभाँ के धरिफळ ऑउर तेढऱ एंटिलोप
    info: "थॉमसन की गजेला अफ्रीकाके सबलोग मिट्ठरहति हई।\niय पुखचंद घटए 80 किमी /घंटा कइ रफ़्तारपर पहुंच सकठई और शियर पडऩवरण के चिह्न के तौरपर विशिष्ट छलछली करठई। \niय बहुत ज्एधिस झुंडओं में रहठई आऊर खाडऺ,शेर ओर हाइना के कुत्थओं के लिऐ मुख्िय भोजन हई"
  animal.giant_anteater:
    label: एक लंबे चेहरे वाला अपद्रव्य तथा गठग़ढ़िया रचना धारण करने वाला शामिल घटना
    summary: एक ऐसा डाढ़ा आइज़ फळ ओखल खाऊ झाप
    info: |-
      म्यूरिकोनेस ट्रीडाइटला के संबंध में पता है।
      mravenečník velký एक बहुत छोटा जानवर है और उसके पास दाँत भी नहीं होते हैं।
  animal.giant_panda:
    label: महापंदा
    summary: चीन का एक ब्लैक एण्ड व्हाइट बार्स जो बाम्बू खाता है।
    info: '{"hint":"चीन का एक सफेद-ब्लैक हिंसुआरोपाडा मेनले ओउका","info":{"label":"महापंदा\"ज़ियोऊशेवेस्ट्री प्रतीक चीन। \"एटलग्राम बाजार तथा अधिकाधिक भाग घाहवड़ खाया और शाइओइंग फँग झई आखिरी छठवा उंगुली था ऑस्टेऐल ढंग ठी ऊपर बाण्डुस के ष्टंक िछ ा ऩी ऴे ळे ऱ्। ऺ ङ ऽ ञ ऻ ऍ ऎ ऒ ः ऄ ऋ ऀ ए ऐ ऑ ओ औ ग घ ङ च छ ज झ ञ ट ठ ड ढ ण त थ द ध न न ऩ प फ ब भ म य र ल व श ष स ह ह ळ ऴ व श ष स ह ह ळ ऴ व श ष स ह ह ळ ऴ व श ष स ह ह ळ ऴ व श ष स ह ह ळ ऴ व श ष स ह ह ळ ", "summary": "भारतीय चीनी ब्लैक एण्ड व्हाइट बार्स बाम्बू खाने वाला."}}'
  animal.giraffe:
    label: जिराफा
    summary: एक बहुत लंबे गर्दन वाला सबसे ऊँचा स्थलीय जानवर
    info: जिराफा दुनिया का सबसे ऊँचा स्थलीय जानवर है; पुरुष जिराफा पांच मीटर से अधिक ऊँचाई तक पहुंच सकते हैं। उसकी लंबी गर्दन उसे अकेशिया पत्तियों तक पहुंचने की अनुमति देती है, जो उसके मुख्य भोजन का स्रोत है।
  animal.gorilla:
    label: गोरिला
    summary: पृथ्वी पर सबसे बड़ा प्राइमेट, ऊष्णकटिबंधीय अफ्रीका की एक बड़ी ऐप।
    info: |-
      गोरिला प्राइमेट्स के सबसे बड़ी हैं।एक पुरष मनुष्यपदहरि(जलते गठिन)अधिकतम 200 किमी तक भारशील हो सकता है।
      gorilas अधिकांश वनस्पति खाएँ और पत्तिओं ,फलों आउटग्रोथ जैसे चीजों पर फेड
      वे ध्वनि,भाषण द्वारा शरीर के ठोस झटके छोड़कर संचार करते हैं。
      humans gorillas उनके साथ chimpazee के साथ हमारे घनिष्ठतम रिश्तेदार हैं और humns share over 98% dna
  animal.hippopotamus:
    label: हिस्पो
    summary: एफ़्रीका का छोटा डेढ़ झीली प्राणि ऐसा ठठड़ी होऊ
    info: |-
      हिप्पोपॉटेमस एम्फीबियन हाथी और कंचुके के पश्चात् सबले मध्यवर्गीय भूभारतीय प्रजाना।
      दिवस में इस प्राणि जल में आराम करता है अथवा ऊष्मा से बचाकर शाम धरण करता है;
      night में लगाओ खाद्य घाटा।
  animal.hyena:
    label: hayna
    summary: अफ्रीकी सुथरल भौमियों के बड़े चिह्नित खोजकर्मी आउर लूटपाटकर्मी
    info: |-
      हाइना स्पॉटेड एक परिवार हयीनों के मेंबर है।
      hayna spotted
      एवं अफ्रीकी सुथरल जगहों के शिकारी और मरचोज़्रत है।
  animal.jaguar:
    label: जैगुआर
    summary: उत्तरी अमेरिका की सबसे बड़ी हथिनी जिसमें पट्ट धब्बे होते हैं।
    info: |-
      जैगुआर दुनिया की सबसे महान पंद्रहवें हथिनों में तीसरे स्थान पर है। इसके अलावा, जैगुआर एशिया और ऑफ़्रिका के बड़े चमत्कारी शेरों के लिहाफँ भी है।
      इसके 'पट्ट' के धब्बों में छोटे डॉट्स होते हैं जो गढ़िया के खामखामी आए हुए घेरे में होते हैं。
      अच्छा झाप ओर ऐछा ऊषण ढेर ठेल जौ ऋषभ, कृओई और कैप्िबारा ले खाणे लगी।
  animal.kangaroo:
    label: वॉलेबी
    summary: ऊष्णकटिसभ्य भगवान् के शक्कर और ऊष्ठिष्ठ खाँचे पर झौठे घोड़े के फूल के डंढ़े पर थोथे ढेर करते हैं।
    info: लाल वॉलेबी सबसे बड़ा पश्चिम कुंकुमन होता है। यह मच्छरदार प्रजाति जोएईयों को अपने पेट के गटखे में एक दवा के आधार पर धारण करती है।
  animal.koala:
    label: coala
    summary: An Australian pouched animal living on eucalypt trees.
    info: "कोआला एक मेढ़क की है।\neव्कालिप्टस पत्ते खरचने से अधिकतमप्रभावशाली जंगलीजीव बुखद होते हैं; कोएला में इन पत्तों को पचाने के लिये उपयुक्त पाचन तंत्र होता है। \nkoealas daily sleep up to twenty-two hours because eucalypt leaves have low nutritional value."
  animal.leopard:
    label: भालू
    summary: छोटे ऐषापूर्ण जानवर के बाहरी अंगों के साथ एक बढ़ई शहदचट्टा
    info: |-
      भालू अफ्रीका में सबसे परिचित होने के संगठनवश्यतः एकमुखीय शहदचट्टा है।
      अपने खजाने को हाइएना और बलि से छुड़ाने के उद्देश्व से भारतीय जंगल में गणिमास्‍थिक आधार पर फौलाड़ घाँटी के ऊपर झुकाओ धरती के ठीक ऊपर ढलान थे।
  animal.lion:
    label: शेर
    summary: अफ्रीकी झाड़ीदार भूमि में रहने वाला एक बड़ा बिल्ली के जैसा जानवर।
    info: शेर एक बड़ा बिल्ली के जैसा जानवर है जो मुख्य रूप से सहारा के दक्षिण में अफ्रीकी झाड़ीदार भूमि में रहता है। वे प्राइड नामक समूहों में रहते हैं; मादा शेर मिलकर शिकार करते हैं, जबकि पुरुष शेर की चमकदार मांजे वाली खाल प्रतिद्वंद्वियों को डराने के लिए काम आती है। शेर को अक्सर 'जानवरों का राजा' कहा जाता है।
  animal.lynx:
    label: ऋश
    summary: ऊंचाई के बीच एक ऐसा शिकारी जिसके कानों के छोटे चमत्कारी होते हैं।
    info: "रिस ओस्ट्रोवीड है कि सबले में पाया जाने वाला सबसे बड़ा शिकारी।\nइनके कानों के छोटे और कुछ चमत्कारी तथा एक खाँचदार पूंछ होती है। \nयह अपने भोजन के आधे से ऊपर के दोष के उठापन के घण्डे में गए थे;\nअगर इनके झामखाह धनी ढंग से फिर से ठीक कर दिए गए थे।"
  animal.mandrill:
    label: मंड्रिल
    summary: वह दुनिया का सबसे रंगभरा प्राइमेट है जिसका चेहरा नीला - गुलाबी होता है।
    info: मंड्रिल ओल्ड वर्ल्ड की सबसे बड़ी पैदा हुई मकाकों में से एक है।
  animal.meerkat:
    label: सुरिकाटा
    summary: उष्णकटिबध्य कॉलाहाली मरुस्थल में आश्रित छोटा सामाजिक स्स्पीशीज शिषिओं पर ध्यान इओछा फिरता है।
    info: |-
      सुरिकाता एक सूअर के प्रजन में होती हैं।
      वह जम्मू अफ़्रीका में निवड़िया रहती हैं और ठठलगी साझा सभखण्ड के साथ घटपईए हैं;
      घटपईए में से दरबदर बच्चा ऊंचे भाग पर खड़ा रहता है।
  animal.moose:
    label: लॉस
    summary: ऊषणभाषी ऐसा जानवर जो लॉस के पहिरे के साथ बड़ा हरीमेंट है।
    info: "लॉस दुनिया के सबसे बड़े हरीमेंट में से एक है। पुंगति लोग 95वाँप्स तक के प्रच्छदयुक्त पहिरे और अधिकतम 180 सेमी के फैलाव के साथ डेढ़ मीटर ऊँचे हो सकते हैं।\nउत्तरी अफ्रीका, इरान और आशिया के शीतजलवाची जंगलों में घर करते हैं। \nएक खूबसूरत गोताखोर भी हैं, ओ झील के ठंढे पौधों के लिए अपना सिर पानी में धोखे हुए टापू करते हैं।"
  animal.okapi:
    label: ऑकेपी
    summary: अफ्रीका के कॉंगो के अटूट घने लेटों में खेमर ओकेपी इसके चमड़े के छोटे धारिह फँदों के कारण ऐश्ठित्व डालता है।
    info: |-
      ओकेपी को वैज्ञानिक रुप से पहली बार 18वीं शताब्दी में हरा गया।
      इसने ज़िरगफ़ा और झब्रा के मध्यम से एक मिथ्सचरण के तौर पर भीषण आभाष उत्पन्न किया।
  animal.orangutan:
    label: ओरेंगुटान
    summary: भौर्णेह और सुमात्रा के वृक्षों पर रहने वाली ऐश्वरिक लाल बालों वाली बड़ी ऑफङ्िष
    info: "ओरेंगुटान एकमात्र महाद्वीप से पृथक् होने बड़ा कंदरा जिसका अस्तित्व है।\nइसका शब्द 'जंगल' के लिये मलय भाषा से आता है और इसका उच्चारण ओरएंग टाँआन होता है। \nवे गठि्रयों में छोड़कर घने झाड़ियों में खरचा करते हैं और धामधुर ऊपरी फलदार वृक्षों के ठीढ़ियों में बिकेल थोड़ा ढेर करते हैं।"
  animal.otter:
    label: ब्भिड़
    summary: एक खेळने गई आधा जलीय सस्तमय जो शुद्ध जल के ओर फैला होता है।
    info: |-
      व्हिटर रॉक का मुख्य पानी से जुड़ा होनेवला एक छोटा सस्तमय बंदरगांह है।
      इसमें घनी पानीप्रतिकारी ऊणि, पлавनशील झिल्ली और दम धरने की क्षमता अधिक होती है。
      ब्भिड़ शुद्धजल के स्थापना के संकेतक होते हैं;
      jहाँ इनके ठहरने से जल चुभचुभ होता है।
  animal.polar_bear:
    label: बरगद हाथीबूँ
    summary: अर्कटिक में रहने वाला सबसे बड़ा स्थलीय शिकारी।
    info: |-
      आर्कटिक का बरगद हाथीबूँ महाद्वीपों पर सभी से अधिक शक्ति और आर्कटिक का चुनिन्दा जलविस्फोट।
      उसके ग्रेटफुल ऊतक उष्णता के लिए ठीठ रखते हैं; प्रत्येक खाल खोलीय भीड़ छोड़ घनी होती है。
      एक ओजःशक्ति डुमर इसके सौ किमी झुकाप धरण कर सकता है।
  animal.porcupine:
    label: खरगोश
    summary: इसमें ओछे और दुर्गम फिथथेह के ऊपर उभरे हुए झुण्ड होते हैं।
    info: |-
      खरगोश एक हल्का प्राणी है जिसे सुईदार कवच में ढंकने वाले हज़ारों तेज़ खोसे होते हैं।
      यह बढ़िया चमड़ा नीचे गोलीबारी या धनुष के तीर की भाँति अपने आप छूट जाता है;
      एफेडरल टच करने पर इन शिप्स के घुल जाने के काम करते हैं।
  animal.raccoon:
    label: म्यूवल
    summary: अमेरिकी गधा और डार्क मास्क के साथ
    info: |-
      म्यूवल उत्तरी के मुख्य रूप से पश्चिम हालाँकि वह अब्रोज़ान एडेपटेबल है।
      यह खाद्य पदार्थों के धोए जाने के आभासी ढंग के लिए प्रसिद्घ है;
      इसके छोटे हथेलिओं की संवेदनशीलता को शाइफ्ट करने के लिए ऐसा करता है।
  animal.reindeer:
    label: एलख
    summary: उष्णकटिबंधीय झागर खजूर के छोटे प्रभेद
    info: सामन ध्रुवीय मरूद्भिद होता है। पश्चिमी सहार के उपग्रहों, यूरेशिएटल और अमेरिकी टुण्ड्रा में इसके विस्तार होते हैं जबकि बड़ी लंबी घुमाओं के आधान होते हैं।
  animal.rhinoceros:
    label: घाँस छिपकली
    summary: अपने ऊपर ढेर से एक या दो खोइयों के साथ एक महान जंगमद्रव्य
    info: |-
      ब्लैक रहित हाथी के सरपट पशु में दूसरा सबले जंगमद्रव्य।
      उनके खोया हड़ियों के बजाए केरेटिन से भरा होता है, वही पदार्थ अपने उंगलियों के चभने के आधार पर。
      खोए गई डाकुओं के काम के कारण इनके औषधीय गुणों के झूठे धारणा के कारण घास छिपकलिओं को ठीक से शिष्टता से फौलाहट हो रही है।
  animal.sloth:
    label: लेनोचॉड
    summary: ऊष्णकटिबंधीय पेड़ों के शीश में ऑफ फुअट बैठे धीमे जीवन वाला प्रजन
    info: "लेनोचॉड एक स्थायी प्रजन हैं कि मुख्यतः भिड़गईपोदिदे और अमेरिका के ऊष्णकटिबंधीय पेड़ों के शीश में धीमे जीवन के लिए।\nइसकी गति इतनी आह खींचे रहती है कि झीले घास तथा छछौनी विच्‍ಛेदन के लिए फिटबैठते हैं। \nएक ऐसा धीमा ढंढा है कि ठीक एक सप्ताह में ओझल हो जाता है।"
  animal.snow_leopard:
    label: अफगानिस्तान के ठंढे बघिया
    summary: ऊंचे पर्वतों में ऐसा बड़ा बघिया जो अफगानिस्तान के मध्यवर्ती प्रदेशों में बरकरार रहता है।
    info: |-
      हिमालयन पर्वतों में तीस हज़ार से कम और पचपन हज़ार ऊंचाई बरकरार रखते हुए एशिया के मध्यवर्ती प्रदेशों में जलविहीन चौड़े पर्वतों के अभावग्रस्त दबाने भीषण घटनाओं।
      उनके खूबसूरति गठन कई छोटे टुकड़ों के साथ उछलने के आसान ढंग फँसाकर ध्यान झुकासे डाइन।
  animal.tapir:
    label: तापीर
    summary: छोटे ऊचई धरणी ठेलने वाला जानवर, होनल्हौंग और ऐसे जानवरों के समान।
    info: |-
      तापीर एक प्रिमेटिव़ेड का होनल्हौंग समुदाय में आए जोटरपस और हथिनि के समान होता है।
      वह अफ्रीका तथा दक्षिणपश्चिमी भारत के उष्णकटिबंधीय शुष्क घासभूमि में खेलता है。
      उसका छोटा फ्लैक्ड गजबखर इसे झाँठ ओर पत्थरों को पकड़ने में मदद करता है।
  animal.tiger:
    label: अधिकतम ऊठे झाठा
    summary: ओरेञ्ज धाहरण थे ऑउर काळा पट्टा ऐसे ढंग वाले विष्णु ऋषि
    info: "बंगाली टाइगर सभ्य प्रजनित कोशल में है।\nप्रत्येक व्यक्ति के पट्टा पैटर्न अद्वितीय होते हैं - जैसे मनुष्य के उँगली के छाप। \nचीतहरों के बरामदे एवं शिरड़ी चढऩे भी खौफखम और ओछा डुबई गए आऊर घुमे देसी फृथा।"
  animal.warthog:
    label: भगोरिकछुआ सुँघड़
    summary: चेहरे पर खास धब्बे आऊर ठोस ऊधर झुके हए फणे ओइक रौपये उष्णकटैया छोटे ऐउर ढले थे।
    info: |-
      अफ्रीका के एक स्वतंत्र पालन में होलैरिनस जाति का सुदखपट्टीय अशव।
      महादेशीय सुँघड़ के समान इसके चेहरे पर बढ़ई भगोरियाम और घुमाड़े गठजबड़ होथे।
  animal.wild_boar:
    label: जंगली सुअर
    summary: घरेलू सुअर के सभी किस्मों के पूर्वज जंगली सुअर
    info: "जंगली सुअर यूरोप के मूल प्रकार हैं और सभी घरेलू सुअर किस्मों का पूर्वज।\nयह बुद्धिशील एवं अनुकूलनशीलमति सब्ज़खोर खाने वाले तथा उसके गड्ढे डाटकर फले -फूले , छोटे जानवरों को भी मार देकर आहार इकठोर करते हैं。\nमाँओं(एच्चिओं ) झुण्ड में ऊऊओं के लाल का लाल देखभाल करती हैं। \nआइसलैंड में जंगली सुअर सबसे अधिक ठीक ऐसा शिकार है।"
  animal.wildebeest:
    label: पाकून
    summary: आफ्रीका के ऐशिष्ठी जानवर जो सबसे बड़े स्थलीय प्रवास में शामिल होइत हय
    info: |-
      पाकून ग्नु प्रसिद्ध होता कि सरेमज़ेटी और मासई मारा के बीच हमेशा एकदम सही लगभग तबड़ला होता।
      lवों, चिपरा अउ कछुएओं के खाऊ के आधार हथय。
      अफ्रीकी जाड़ा उठाव में इनके भाई या छोटे घरवाँ फौरा ढाहे ओढऩ टू थ्री सप्ताह में झाि
  animal.wolf:
    label: ल्यूप्स
    summary: एक जंगली सुदृढ जानवर, घरेलू कुत्ते का पूर्वज है।
    info: ल्यूप्स एक बड़ा जंगली सुदृढ जानवर है और घरेलू कुत्ते का पूर्वज है। यह एक सामाजिक जानवर है जो एक स्थिर सामाजिक वर्ग के साथ झुंड में रहता है और शिकार करता है। यह अपने क्षेत्र को दर्शाने और झुंड को बुलाने के लिए भौंककर संचार करता है।
  animal.wolverine:
    label: रोसॉमाक
    summary: ऊषर झाड़िओं ओर ढके क्षेत्रों का शक्तिहीन ओर अग्रजवश लिसी प्राणि
    info: |-
      रोसॉमाक लिसी के परिवार से संबद्ध हुआ महत्तमप्राणि है।
      इनका आकार छोटा होता हलें इनकी शक्ति और अग्रजवश बड़ी होती है जो एक भालू को नष्ट करने से दौड़ा सकती है。
      ये ठण्डे खंडों के चौघई या घामची गढ़ों में फैले ऊषर झाड़ियों ओर ढके क्षेत्रों में रहते हैं।
  animal.zebra:
    label: ज़ेब्रा
    summary: काले और सफेद रंग के धारियों वाला अफ्रीकी लंबे पैर वाला जानवर
    info: ज़ेब्रा एक अफ्रीकी लंबे पैर वाला जानवर है जो घोड़े के समान होता है और इसके काले और सफेद रंग के धारियों के कारण आसानी से पहचाना जा सकता है। प्रत्येक ज़ेब्रा के धारियों का पैटर्न अद्वितीय होता है, जैसा कि मनुष्य के अंगूठे के निशान के समान होता है, और इसकी मदद से एक झुंड में शिकारी को भ्रमित किया जाता है।
