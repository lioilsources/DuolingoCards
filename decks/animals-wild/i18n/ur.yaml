lang: ur
pivot: false
title: جungle کے جانور
cards:
  animal.aardvark:
    label: بابوءِل
    summary: شام کا افریقا کا کیڑاوار غذا والا جانور، سوراخ کھودنے والی مشتمل منقار.
    info: کپس کا بابوؤں والا جانور، تیوبولائینڈنٹا آرڈر سے تعلق رکھتا ہے اور نزدیکی قارب مخلوقات کے بغیر واحد زندہ دستاویز ہے۔ شب وقت فعالیت، مضبوط پنجوں اور لچکدار زبان انگوروں اور چربتوں کے شکار کرنے کے حوالے سے موافقت اختیار کرتے ہیں۔ وہ خالی درماغ مختلف دسوں نوعیات کے استعمال کے طور پر بناتے ہیں۔
  animal.armadillo:
    label: pasovec
    summary: بڑا جانوروں کے علاوه اُن کشتوں کو فروغ دینے والا
    info: |-
      پاسوويك ديوى تيرا اکلوائس جانور کے ساتھ بنيادی ہڈی والی قسم۔
      چند نسلوں کو خطرہ محسوس ہوتا تو وہ بالکل گول شكل بنالتے ہين。
      این مختلف حشرات، پودوں اور زميني ذخائر کو درجنوں منٹوں ميں اندازه لگانا۔
  animal.baboon:
    label: پاوین
    summary: ایک بزرگ افریقن ماڈرن شخصیت جس کا منفرد چونک اور سماجی نظام مشترکہ ہوتا
    info: بافیان افریقہ کے جھومر دار علاقوں میں رہنے والوں بڑے پرائمرس کا خاص قسم ہوتا۔ وہ سماجی حشرات، تقرراتی تنظیم، مختلف آوازوں اور اندازِ زندگی کے ذریعے باہمی طور پر تعامل کرتے ہیں۔ مرد فحصاء بالکل موٹی نسبت سے لمحۂ فصل چلتے ہیں۔
  animal.bear:
    label: براؤن براعظم
    summary: '''حمل'' درندوں کا خاص طبقہ ہوتا ہے۔'
    info: بُرکس اور کٹوس، بھاری سفید جانوروں میں شامل ہے۔ حملوں پر تین مختلف قسمیں موجود ہیں۔ ان میں زرد رنگ والا، نمک دانت والا اور آئل لائنز شامل ہیں۔
  animal.beaver:
    label: ببر
    summary: ایک بزرگ حلقہ والوں کا پرندہ جو باعث تالابوں کے وجود ہوتا
    info: ببر اورپائی دنیا کے سب سے بڑے جانوروں میں سے ایک حلقہ والوں کا پرندہ ہوتا۔ وہ شاخوں اور لمحوں سے تالاب بناتا ہے، جس سے متعدد قسم کے حیوانات رہتے ہیں۔ ان کا ذرا موٹا نشاندار چھینتا، آئرنگ فرشتوں والا زمینی حصّہ اور پانی کو روکنے والی بال لائن موجود ہوتی۔ چیک ملک میں ببر ختم ہوا تو آخری عشروں میں واپس لوٹ گيا
  animal.bison:
    label: بیسن
    summary: شمالی امریکا کا عظیم الشان بووڈ نسل والا جانورو، جس کے بالوں کی لمبی ہیر قسم کی شناخت
    info: |
      بیسون امریکائی شمالی آ메ريكا کا سب سے بھاری زمیني جانور ہوتا۔
      18 ویں صدی میں، ان کو تقریباً ختم کر دیا گيا؛ لگ بھݗڑن والے ٣۰ لاکھ تو چالیس لاکھ حيوانات مىں سے محض اِكْ thousnd رہ گئين。
      حفاظتی پروگرامز کے ذریعے ان کی تعداد دُوبآرا ٥٠٠٬٠٠٠ تک واپس لوٹ ڳوي
  animal.buffalo:
    label: افریقن بوول
    summary: '''بروزِکا فرفَرس'' کے عنوان سے معروف، افغانستان کا بوفالو افریقہ کا ایک بڑا بُونڈ کشادہ ہوا جسم والا جانور ہے۔'
    info: افریقہ کا بوفالو افریقا کے سب سے خطرناک جانوروں میں سے ایک ہوتا ہے، اور 'گرجھ پنج' کا حصہ۔ وہ صدیوں تک لاٹس کے انداز میں رہتے ہیں اور مشترکہ دفاع کے ذریعے لینچن کو نکلوانا قدرتی طور پر حیرت انگیز ہوسکتا ہے۔ آؤٹلائرنگ بالغ مردوں والے فارمروں غصّے زدہ اور عجیب الفردی بن سکتے ہیں۔
  animal.camel:
    label: درومیدائر
    summary: صحراء والے جانوروں میں موجود دُبنداً مواد کے ذخیرہ کے مقصد کے تحت استعمال ہوجاتا ہے
    info: |-
      رملی سمندر کا انسان نے پال رکھا ہوا جو صحرائوں میں زندگی بسر کرنے کے لئے بالکل تیار ہوتا ہے؛ اس کا دُبلا ونٹ، آبدوزی کے طور پر ذخیرہ کرتا ہے۔
      ایک مرتبہ اس حیوان کو چودہ فنان خون شامل کردینے کی قابلیت ہوتی ہے اور دراز عرصہ تک ان دونوں کے بغیر برقرار رہتا ہے。
      اسے ۳۰۰ٗ سال قبل ماشوم بنادیا گیااور یہ غرب صحرا کے لوگوں کے نظام حیات کا ضروری حصّہ ہے۔
  animal.capybara:
    label: کاپیبر
    summary: دنیا کا سب سے بڑا حلقنوار، نصف آباد اور بہت ہی مناسب.
    info: کاپیبرا جہان کے سب سے بڑھ کر زندہ حلقنوار چوگول اور بالغ فردز میں توازن برقرار رکھتے ہیں، ان کا وزن لگ بھگ ۳۵ سے ٦٦ کلو ٹمبن ہوتا ہے۔ وہ دسائیل آفروزان علاقوں میں ندیوں، دریاؤں اور پودوروں کے قرب و جوش میں موجود ہوتے ہیں۔ وہ بہت خوبصورت طرز عمل والے ہونے کی وجہ سے تمام مختلف نوعیات کے جانوروں کے ساتھ باہمت تعامل کرتے ہیں۔ سماجی ذرائع کے ذریعہ وہ غیر ضابطہ حرارت کی شناخت بن چکے ہیں。
  animal.cheetah:
    label: جبراد
    summary: زمین پر تیزترین ذخیرہ والے جانوروں میں شامل، انکی رفتار 97 کلومیٹر فی گھنٹہ سے زائد چل سکتا ہے
    info: گیپارڈ زمین پر تیزترین جانور اور دوسرے بڑھاپہ کتتوں سے مختلف، ورنالندا نامی آوازوں میں شدید رفتار حاصل کرتا ہے۔
  animal.chimpanzee:
    label: شِمْضَnz
    summary: ایک ذہانت مند بلند درجہ کا ماوا، آدمی کا قریب ترین موجودہ رشتہ دار
    info: شیمپانزے عام، بونوبو کے ساتھ انسان کا قریب ترین جانوری رشتہ دار ہے۔ ان میں ہماری D.N.A. کا لگ بھگ 98.7 فیصد حصہ مشترک ہوتا ہے۔ شِمْضَنز وسائل استعمال کرتے ہیں، مثلًا ندروں کو پکڑنے کے لئے شاخیں، اور زبردست علامتی زبان کے بنیادی عنصر حاصل کرنے کی صلاحیت رکھتے ہیں۔
  animal.coyote:
    label: کُوجَوت
    summary: شمالِ امریکا کا موافق مقامی حیوان
    info: "کوائٹ کا جانور ساری شمال مشرقی امریکہ بسایا گیا۔\nvولف کے مقابلے پر لوگوں کے قرب و جوار میں زندگی لازم نظر آتا ہے، شہروں تک پھیل رہا ہے。\nامریکن انڈین داستانون میں ذرا خود غرض شخص کا نقشہ بناتا ہے۔ \nذبیحہ کرتے وقت خصوص طور پر سورج غروب ہونے والے وقت اور شب میں فطرتی صدا پیدا کرنے والا"
  animal.deer:
    label: جلين
    summary: ایک چلتا ہوا کوؤتن والا جانور؛ مردوں د‏‏ی جانب تو منڈپن دندان ہوسکدن
    info: "جیلین لسنو جہان کے بڑھتے پچاسوں میں سب سے عام اور وسعت اختیار کر رہا۔ مرد حضرات (جیلن) منڈپن تکون دندان، جو ہرسال نشست کردتا ہئي اندازا فرشتوں تو لوٹ جائيندي نيسي، جو زمبن دي شاخن وچ سب تو تيز طرف برخاست گروهوي ٗ۔\n\nسموتري ماہ وچ اُنّھاں د‏‏ی آواز قدرتی نظام وچ خاص مومندار ہِݨدائي ۽ عورتون (لان) د‏‏ی وجہ تو مقابلے وچ شامل ہوجانا۔ \n\nچيك جمهوريہ وچ جيلن صيدغذاء دا mainstream symbol ہَے۔"
  animal.elephant:
    label: ہاتھی
    summary: یہ زمین پر سب سے بڑا جانور ہوتا ہے، جس کے ہاتھ اور بڑے کان ہوتے ہیں۔
    info: افریقی ہاتھی زمین پر سب سے بڑا جانور ہے۔ اس کا ہاتھ سانس لینے، پانی پینے، سانس کرنا اور کھانے کو پکڑنے کے لیے استعمال ہوتا ہے۔ ہاتھی گروہوں میں رہتے ہیں جو سب سے زیادہ عمر والی عورت کی قیادت میں ہوتے ہیں اور یہ اچھی یادداشت کے لیے مشہور ہیں۔
  animal.fennec_fox:
    label: فنک
    summary: دنیا کا سب سے چھوٹا پسوئد جانور ہونے والے حیوانات میں سے ایک، جس کے عظیم الشان کان ہوتے ہیں۔
    info: فینک دنیا کے سب سے چھوٹے پسوئید جانور میں شامل ایک حیوان ہے، جس نے صحرائے ساحرہ میں زندگی بسر کرنے کے لیے خود کو تبدیل کردیا۔ ان کے عظیم الشان کان فطرتی حرارت کو باہر نکالنے اور شناخت کار سماعت کے ذرائع فراہم کرتے ہیں۔ ان کڑواج کافعّالیت اتنی قابل رشک ہے کہ وہ بغیر مستقیماً پانی استعمال کیے بقا برقرار رکھ سکتا ہے؛ آبِ تعزیت غذا سے حاصل کرتا ہے۔ درجنوں وقت چلوں، ڈولروں اور مخصوص چپلوں کا شکار کرتا ہے۔
  animal.fox:
    label: چیتہ
    summary: ذہانت مند چھوٹا سا موافق خوبصورت ذرا لمبا چمن
    info: چیتہ عام دنیا کے سب سے زیادہ پھلکاروں والی جانور اور تبدیلی کی بڑی قابل شخصیت، وہ درختوں میں رہتا ہے۔ اندریالوں، مرغیوں اور حشرات کا شکار کرتا ہے؛ ضرورت نمبر لازم تو فضلات بھی جمع کرنے لگ جائے۔ عورتوں (چیتہ) 4 سے 6 بالغوں کو جنم دینے والا
  animal.gazelle:
    label: گزلہ
    summary: افریقا اور آئزن کے صحراؤں کا لمبا بال و الٗ فرشتوں
    info: "گزلہ تھامسن افریقہ کے سب سے زیادہ پراکس جانوروں میں سے ایک ہے۔\nاس رفتار دنیا بدل سکتی ہے، چوندّ انداز میں لپٹاتی وقت شتر ماخوذ کرنا نشان دینے والی حرکتوں کرتی ہے۔ \nایسا عظیم الشان قافلہ میں رہتا ہے، چلندر، لوؤں، اور حشر خوبصورت کے ذبح کرنے والا بنائی ہوتی ہے۔"
  animal.giant_anteater:
    label: merwanochnik velky
    summary: لبرل بے دانت جانوروں کے درخت کے شاخوں کے ساتھ لمبوں کے ساتھ
    info: مرے ونکوچ نامی جانور سب سے بڑا مروار کھالنا والا حیوان ہوتا ہے اور مرکزی اور شمالی لاطینی آمریکا میں پایا جاتا ہے۔اس کے دانت موجود نہیں، بلکہ قدرتی طور پر تباہ کرنے والے لمبے قدموں کے ذریعے انفنتس کمپاؤنڈ توڑتا ہے، اور گندابدوز خود فرشتوں کو ۶۰ سینٹی میٹر لمبی زبان استعمال کرتے ہیں۔ روزانہ بناء بر وقت کے ٣٥ هزار چوبستہ چوس کھائے جاتے ہیں۔ عقلاres بچوں کو اپنی پشت پر لاد کر منتقل کرتی ہیں۔
  animal.giant_panda:
    label: پندا بلوند
    summary: چائنائیز بلاک اور سفید درندہ جو محض بامبوس پر غذاء اختیار کرتا ہے
    info: "چین کے جنوبی مغرب سے تعلق رکھتا ہے اور دنیا بھر کا قدر مشترک حفاظت طبیعیات کا عالمی نشان۔\nاس کو خود غذا لگتا ہے، بالخصوص بامبوس پر زمیندار ہوتا ہے، حالانکہ آناٹومی کے اعتبار سے وہ شکاری ہے。\nایک 'چھٹا انگُل'، جو فقرۂ بازو کا اضافی حصّہ ہے، موجود ہے، جو بامبوس کے ذرات کو مضبوطی سے پکڑنے میں مدد کرتا ہے۔ \ndنیا میں صرف تقریباً ١۸۰۰ ماڈرن درندوں کی وجود ہے۔"
  animal.giraffe:
    label: چھوٹا
    summary: یہ زمین پر سب سے اونچا جانور ہوتا ہے، جس کے بہت لمبے گردن ہوتے ہیں۔
    info: چھوٹا زمین پر سب سے اونچا جانور ہے؛ مردہ کی اونچائی 5 میٹر سے زیادہ ہوتی ہے۔ اس کی لمبی گردن اسے اکیلیوں کے پتے تک پہنچنے کی اجازت دیتی ہے، جو اس کا اصل غذا کا ذریعہ ہے۔
  animal.gorilla:
    label: گوریلہ
    summary: زمین پر موجود تمام ماکولات میں سب سے بڑا حیوان، روئی کی افریقہ کا درخت
    info: گوریلا زمین پر سب سے بڑا جانور ہوتا ہے؛ بالغ مرد کا وزن تقریباً دو سو کلو ہوسکتا ہے۔ ان میں اکثر خضروات کھانا عام رہتا ہے، وہ لیٹس، فرشتائچی نباتات اور شاخوں کو کھاتے ہیں۔ آواز، علامتوں اور صدر کو مارنے کے ذریعے باہمی طور پر ابلاغ کرتے ہیں۔ ہمارے قریب ترین رشتہ دار ہونے کے ساتھ ساتھ شامپنز کے ساتھ ڈی این اے کا 98% حصہ مشترک ہوتا ہے
  animal.hippopotamus:
    label: ہراج
    summary: افریقہ دا عظیم الشان درمیانی طور پر پانی والاجانور
    info: ہیپوٹامس امفلوبائے آفروک کا تیسر سب سے بڑھر زمیندار جانور بلوند فلوروں لال مصنوعات وچ شامل ہن۔ دن روز ندامت پاݨئي، جوءٗ اوکار تو‏ں روکدا اے؛ شام کتّھى غذا حاصل کردے نيں۔ اُنا بالمقابل خطرناک تے تیز اے۔
  animal.hyena:
    label: ہائناسکورنیٹا
    summary: افریقا کے جھومڑوں کا چوتلا اورمرچوزروت
    info: ہائینا سکورنیٹا حبسن کے خاندان میں شامل افریقی جھومڑوں کا شکار کرنے والا براجمان ترین پستانی چوتل ہے، بالواسطہ نامردی کے باوجود واقعی طور پر مرچوزروت نہیں ہے بلکہ اس کا زائدات ٦۰ فیصد غذا خود لشکران۔ عالمگیر اناث ذکوروں کے مقابلے میں غالب آئی ہوئی ہیں اور بزرگتر ہیں۔ اصل میں اس کا قہقہہ دلجذابی یاخوف کا ظہور ہونا ہے، اللہ تعالیٗ کی رضا مندی کا معبر نہیں۔
  animal.jaguar:
    label: جاگوار
    summary: امریکاس کی سب سے زبردست مچھروں والی جانور
    info: "جیوگر دنیا کے تیرہ سب سے بڑھکر مچھروں والی جانور اور دونوں عظیم الشان آمریکاؤں کی واحد لمبو بالغ قسم ہوتی۔ \n لونڈ، اندر روزتائس پر نظر آئیندے نقطوں کے مقابلے میں مختلف ہوتا ہے۔\n وہ غوطہ خوردی اور ماچس حصول کرنے والا ہوتا ہے، اور مارشلز، الیفانت فرسٹرز اور کپابرا کو شکار کرتا ہے。\n مايا اور ازمک ثقافتوں میں، یہ طاقت اور باادارت اختیارات کا مقدس عنصر تصور کیا گیا۔"
  animal.kangaroo:
    label: کانچن
    summary: مارسوپل جانوروں کا ایک بزرگ آسٹریلونی ذخائر والا جانور
    info: رُدی والا کانچن ابھی تک سबسے بڑा آسٹریلوی مارسوپل جانور ہے، دوسرے تمام قوموں کے مقابلے پر نمایاں طور پر زمین پر لمبا فرشتہ بناتا رہتا ہے۔ عروج حمل کرنے والی خواتین ان کے شاخدار بالوں کے درمیان لگائے ہوئے جونز کو 6 ماہ تک روکے رکھتی ہیں۔ کانچن آسٹریلا کا معروف عنصر ہے اور اس کی تصاویر آسٹریلوی قومی علم پر موجود ہوتی ہیں
  animal.koala:
    label: کوئالا
    summary: آسٽریلوی واجناج جو عقابولطحہ کے درختوں پر رہتا ہے
    info: "کوئلہ ایک مچھرو نہیں بلکہ واجنات کا جانور ہے۔ \n وہ تقریباً صرف ان پتتوں سے غذا حاصل کرتا ہے، جو عام طور پر دوسرا حیوانات زہر قرار دیتا ہے؛ لیکن کوئلا خاص ذخیرۂ آبپاشی نظام رکھتا ہے۔\n وہ دن بھر 22 گھنٹے تک سورمایا کرنے والا ہوتا ہے کیونکہ اس کے استعمال کردہ درختوں کے پتّے غذائیت کے اعتبار سے کمزور ہوتے ہیں۔"
  animal.leopard:
    label: ' leopard '
    summary: سبز موستاق بالا جانوروں کا درجہ، جو غذا کے تحفوں کے لحاظ سے ماہر ہے
    info: چوہا سب سے زیادہ پھلک کٹر بڑا جانور اور نایاب تازہ لطافت والی حشرات، جس میں شاخوں میں قربت فراہم کرنے کے لئے خطرناک ذخیرہ رکھنے والا شامل ہوتا ہے۔ انفرارڈ دشمنوں کے مقابلے میں آسانی سے برقرار رہتا ہے اور وسطی افغانستان، شمالی علاقوں اور دورترین مشرق میں موجود ہے۔ بلند قدروں کی صفت 'بلیک گائی' کہلاتی ہے۔
  animal.lion:
    label: سیاہ
    summary: افریقی جھومر میں رہنے والا بڑا چوہا۔
    info: سیاہ افریقی جھومروں میں رہنے والا بڑا چوہا ہے، جو عمومًا ساہرا کے جنوب میں ہوتا ہے۔ یہ گروہوں میں رہتا ہے، جن کو پرائیڈس کہا جاتا ہے؛ عورتیں گروہ کے ساتھ شکار کرتی ہیں، جبکہ مرد کے نمایاں گریو کا استعمال حریفوں کو ڈرانے کے لیے کیا جاتا ہے۔ سیاہ کو اکثر "جانوروں کا بادشاہ" کہا جاتا ہے۔
  animal.lynx:
    label: رس
    summary: درمیانی درجے والی دھواچہ جس کے کانوں کے اوٹوں میں بال ہوتے ہیں۔
    info: |-
      رائس اُسترووید جنوبی یورپ کا سب سے بڑا دھواچہ ہوتا ہے۔
      اس کو شناخت کرنے میں تین خصوصیات نمایاں رہتی ہیں، آنکھوں پر موجود بلبلے قسم کے بال، لمبا ذراع اور زمانۂ شب میں شکار کرتا ہے؛ ان تمام علاقوں میں وائلڈ فلئیرز اور لانگ شامل ہیں。
      چیک جوملو میں یہ حشرات کش طاقت کمزور ہونے کے باعث غائب ہو چکا تھا، لیکن ٢۰ واں صدی کے آخر میں لوگوں کی جانب سے موثر طریقے سے دوبارہ داخل کردیا گیا۔
  animal.mandrill:
    label: مدربل
    summary: دنیا کا سب سے خوبصورت مکرز جو مندرلس сфنسکس کے طور پر مشہور ہے
    info: مندربل جہان کی سب سے بڑی اور زندہ قسم کا پرانا دنیا کا مکر وں حیوانات ہوتا ہے۔ مردوں کو روشن نیلا اور لال رنگ والی چہروں والا علامت ہوتا ہے، جس کے ذریعے ان کی سماجی درجہ تسلیم شدہ ظاہر ہوجائے۔ وہ کمرین، غابون اور کانز کی جمهوریہ کے معادی خطوط والے موذول فارستس میں آباد ہوتے ہیں。
  animal.meerkat:
    label: سورکیٹا
    summary: کلوہاری صحرا میں پایا جانے والا ذلَل سوسکون ذخیرہ.
    info: سورکیٹا جنوبی افریقہ میں پائے جانے والے، منگسٗو کے خاندان سے تعلّق رکھتا ہوا ذلِل حیوان ہوتا ہے۔ وہ فرقوں میں زندہ رہتی ہے جبکه اندر قائم تنظیم شدہ سماجی نظام موجود ہوتا ہے؛ چناچہ ہرشام غار کے اوپر براجمان نظر دیدہ شخص تعینات رہتا ہے۔ سورکیٹا الئیر درجن کے علاوه ماوراءالطبیعہ طاقتدار سمتوں کے مقابلے میں بھی تحفظ حاصل ہوتا ہے۔ لازوال تقاضاؤں کے تحت آمنے چولنے کے عمل میں اُن لوگوں کو مختلف صلاحیتیں سکھلاتے ہیں۔
  animal.moose:
    label: لوس
    summary: دنیا کا سب سے بڑا جلن والا哺乳動物 جس کے بالشت وسعت اختیار لگائے ہوا
    info: لوس دنیا کے سب سے بڑے جلن والے حیوانات میں شامل ہوتا ہے؛ مردکوؤں کی لمبرائی اور بالشت تقریباً دومتربھر پانچ فٹ تک پہنچ جاتی ہے۔ ان کے وسعت اختیار لگاؤندوارج خصوصتاً آئلز الَسس نامی قسم کے زیرِزمین رہتے ہیں، جو شمالی امریکا،ヨروپ،اور ایشیاء کے شجرستان علاقوں میں موجود ہیں۔ لواس غوطہ خوبصورت طرح سے ڈبوتے ہیں اور درختوں کے ذرات کو منفعت حاصل کرنے کے لئے اپنا سراݪ ٗمائع مادہ میں داخل کرتے ہیں۔
  animal.okapi:
    label: اوکاپي
    summary: کانس کے جنگلوں میں زيرا کی مشابہت والی قدامت باقاعدہ ٹماکوں والی چال
    info: |-
      اکیپ کو سائنس میں صرف سنہ ١٩٠١ء تک درج نام رکھنے والے حیوانات میں شمار کیا جانے لگا اور وہ آخری بڑے پستانی حیوانات میں شامل ہوا۔
      چونکہ دیداری طور پر یہ زیراف اور زبردست قسم کا خلط مختلط حیوان محسوس ہوتا ہے، البتہ یہ زبرا کے مقابلے زرا فل کا قریبی موجودہ عروج والا قربت رکھتا ہے。
      ایسا صرف کانز کی جمہوریۂ آزاد کے غروبی جنگلات میں وجود میں ہے اور وطن کا mainstream symbol ہے۔
  animal.orangutan:
    label: اورنگ اٹان
    summary: بورنو اور سمطرہ کے درختوں پر رہنے والی لمبا بلوند قسم کی بوس
    info: |-
      اورنگ اٹان وہ واحد بڑا لیدوپ کے ساتھ جس میں آفریقہ کے باہر رہائش پذیر ہے۔
      اسکے نام کا تعلق ملایسن زبان سے ہوتا ہے، جس کا معنی درخت والے شخص کے طور پر چلا آتا ہے。
      یہ تمام عظیم الشان لدوؤں میں سب سے زیادہ تنہالی والا ہے، اور ان کا زندگی کا بیشتر حصہ درختوں کی شاخوں میں صرف ہوجاتا ہے۔
  animal.otter:
    label: wydra
    summary: ایک خوشگوار ذرو قوميت والا جانورو جوء‏ صاف ستھرے پانی دي جاريائي.
    info: "رِچنٍ والی ودرا اک جانور حیات کے لئے موزوں لا سائس فملی سے تعلق رکھندی۔\nاس دا بال بہت زبردار، پانی نال موافق ہوندا اَوا باجپل شامݪ ہُندا۔ اوّل توں اندر اک منٹ تک آسمان روک لویندا。\nvyras درست طرح سے صاف ستھرے پانی کم ظاہر کرندي؛ جتي اندر موجود هين، ويجهارا پاڻي صحيح ہوندو۔ \nczech republic ۾ لمبى عرصه بعد واپسيءَ کولاء‏ ضلعيا تعريف."
  animal.polar_bear:
    label: برف کا شیر
    summary: آرکٹس میں موجود سب سے بڑا ساحلی حملہ آورد
    info: برف کا شیر انتہائی بڑے ساحلی جانور میں شامل ہوتا ہے، آرکٹس کا عروج حملہ آوروں۔ ان کے بالوں کا رنگ پارسل نظر آتا ہے؛ ہرنچھ فضا دماغ کے لئے خالص ہوا کے ذخائر تشریف لا رہا ہے۔ وہ غوطہ زندہ ہونے والے ماہرین ہیں اور صد قدم طول وعرض کے دورے دراز کرسکتے ہیں۔ عالمی حرارتی استحصال برادت کے مناطق کو متاثر کرتا ہے، جہاں وہ شکار کرتے ہیں، اور تمام لوگوں کی آبادی کو خطرات لاحق ہوسکتے ہیں。
  animal.porcupine:
    label: دکوبراز
    summary: بڑا جانور جس پر مضبوط تحفظ فراہم کرنے والے خار موجود
    info: دکوبراز ایک بڑا جانور ہے، تقریباً سترن کروڑ خاردار بالوں سے مل کر بنایا گیا۔ ان خالص پتھر نما دانتوں کو شمشاد کی طرح استعمال نہیں کرتا بلکہ وہ آسانی سے لچک جاتے ہیں اور حملاباز کے بدنا میں داخل ہوجائیں۔ دکوبراز رات کے وقت درختوں کی قشر، جڑوں اورسبزیوں کی تلاش میں مشغول رہتا ہے۔
  animal.raccoon:
    label: مارول
    summary: امریکی جانور، منڈولا والی ماشوا اور لمبا بالدار ذراع
    info: |-
      ماسک کے ساتھ ایک جانور، مغربی نارتھ امریکا کا تعلق رکھتا ہے لیکن آج وسطی یوروپ میں بڑی حد تک پایا جاتا ہے۔
      وہ خود فرما دینے سے قبل غذا کو صاف کرنے کے طور پر مشہور ہے؛ حقیقت میں اس عمل سے انگلیوں کی حساسیت کمزور ہوتی ہے。
      چونکہ یہ تمام قسم کی غذائیں استعمال کرتا ہے تو شدید طور پر موافق ہے، اور زبردست طور پر آباد علاقوں میں بھی موجود ہوسکتا ہے۔
  animal.reindeer:
    label: سوبر
    summary: جینلوئٗ دار ذخیرہ زاد فانوس؛ عضوات دونوں لطاف
    info: سوب قطبی امریکا، یورپ اور آسٹریل کے توندروں میں رہتا ہے۔ وہ چند سو کلومیٹر دور بھی جاسکتاتمباڑنگ ان لوگوں نے پالتو حیوان بنایا ہوا ہوتامعروف طبیعت ہے۔
  animal.rhinoceros:
    label: نوسرورج
    summary: ناک پر ایک یا دو روؤں والا مضبوط ذبح
    info: بائیل نوسرورج سمندر کے جانوروں میں دوسرا بڑا حیوان ہوتا ہے، اسکنڈر کے بعد۔ ان کا رخ مواد کھال کی طرح بنایا گیا ہوا تار قائم کرتا ہے، جو آدمی کے منگولوں کی خصوصیت والی چیز پر مشتمل ہوتا ہے۔ لوگوں کے غلط عقیدے کی وجہ سے نوسرورج شدید حد تک لٹیراؤں کا نشانہ بن رہے ہیں، جو روحوں کی درماندار صفات کے باعث فائدہ اُٹھاتے ہیں۔ واقعتاً زمین پر دونوں افریقا میں دو اقسام موجود ہیں اور ایشیاء میں تین。
  animal.sloth:
    label: لینوچود
    summary: ایک درخت والے حشرات کا ذمہ دار شخص
    info: لینوچود ایک جانور ہے، مکمل طور پر کروش آسان زندگی سے تعلق رکھتا ہے۔ وہ بڑا موٹا لباس استعمال کرتا ہے، جس وجہ سے اُس کی حرکت خاصی عجیب نظر آئے گی۔
  animal.snow_leopard:
    label: سنُؤ لوِف
    summary: ایک نادر درجہ بالا حیرت انگیز موذی جانور
    info: "سنوو لیون کے اطراف مغرب، تبت اور وسطی آسیا کے پہاڑوں میں سوروکھن والے علاقوں میں رہتے ہیں جبکہ ان کی زندگی ٣۰۰۰ سے ٥۰۰۰ فٹ بلندی تک حدود۔\nان کلائمرز کے برابر قلب برقرار رکھنے کے لئے لمبا دم موجود ہوتا ہے۔ \nدنیا میں صرف چار ہزار سے شش ہزار تخمینہ طور پر وجود میں ہیں۔"
  animal.tapir:
    label: تُّائر
    summary: ایک بالغوادو کلواج، لمبی زبان والا جانور، جو نسوْراݢ اور گدھے سے مشابہ ہے
    info: تپیر ایک پرانا لچھنے والانشہر جو کہ نساوروز سے ملتا جلتا ہے، البتہ واقعی طور پر واضح نہیں۔ ان کا رہائشگاہ تروپس موسلین فارستس آف امریکاس اور جنووبِ غربٗ عالمگیر شرقِ برصغیر ہوتا ہے۔ ان کا لمبا مضبوط زبان حجم دار درختوں اور پتوؤں کو قبضہ کرنے کے لئے استعمال ہوتا ہے۔ تَّائرز لوڈ کٹاؤ اور خطرات سے متاثر ہوسکتا ہے۔
  animal.tiger:
    label: تِبر
    summary: دنیا کی سب سے بڑی بلبل شکاری حیات جس میں نارنج رنگ والی لمبوں والا نقشہ شامل ہے۔
    info: "بھنگالی تیر جہاں کوئلے اور نارنج رنگ میں پٹیاں موجود ہوتی ہیں، دنیا کی سب سے بڑی آزاد زندہ بلبل شکاری حیات ہے۔\nhر فرد کے پاس ان لائنز کا الگ الگ نقشہ ہوتا ہے، جس طرح لوگوں کے انگُلوں کے علامت مختلف ہوتے ہیں。\ntigers خودمختار چلتے ہیں اور بالمقابل لنواران کے مقابلے میں وہ غوطہ خوبصورتی سے قائم رکھتے ہیں۔ \nایسا کہنا ضروری ہے کہ 4000 سے کم عدد میں واقعی وجود میں آفواج میں موجود ہیں۔"
  animal.warthog:
    label: برداونچتاتي خنزير
    summary: افريقا کا ایک مضبوط خنزير جو چہرے پر برداونچ اور لمبا لمبا ناخن کے ساتھ مشهور ہے۔
    info: براداونچتاتي خنزير افرقيک جو کہ ماحولی حالت میں زندگی بسر کرتا ہے، درمیان سرخ دانت والے پالتو خنزیر کے قریب رشتہ دار ہوتا ہے۔ مرد فٹن تھلائس (برداونچ) اور تحفظ کے لئے موڑے ہوئے ناخنوں کے علاقوں کو استعمال کرنے والا واقعی طاقتور شخصیت کا مالک ہوتا ہے۔ فرار کے دوران وہ ذروں کے اندر داخل ہوجاتا ہے، آسانی سے اپنا وزن برقرار رکھتا ہوا، بالآخر انتینا کی شکل اختیار کردیتا ہے۔ سوراخ بنانے کے عمل میں وہ ذاتی طاقت کا استعمال نہیں بلکہ غربلوں کے موجودہ سوراخوں کا فائدہ اٹھاتا ہے۔
  animal.wild_boar:
    label: دیوچاک
    summary: ایک درندہ بھینسا جو تمام خوبصورت بھینسوں کی نسبت کا آباؤ باپ ہے
    info: دیوچاک اوریجنل european جانوروں کے قسم ہے، تمام خوبصورت بھینسوں کی نسل سمجھا جاتا ہے۔ وہ ذہنی طور پر توانافزااور ماحول کے حوالے سے موافق غذا اختیار کرنے والے عام خوار جانور ہوتے ہیں، ان کا دانتوں والا منڈولا روزمرہ کام کرتا ہے، لیکن وہ گائیدروں کو شکار بنا سکتا ہے۔ عضونات (خواتین) فرشتوں کی جانب سے ٹماکوں کی دیکھ بھال کرتی ہیں۔ چیک جمہوریہ میں دیواجس زیادہ لوئنز کے شکار کردہ جانور ہے۔
  animal.wildebeest:
    label: paconee
    summary: افریقائی قسم کا چلن والا جانوروں کا ذخیرہ
    info: پاکونی کے بچوں میں سالانہ اربنگ فرینڈس جھلور نامی تقریب منعقد کرتے ہیں۔ ان لوگوں کو خصوصی طور پر لفٹ، چِیرڑ اور کروکوائلز کی جانب سے شکار کرنے کا موقع دیتے رہتے ہیں۔ عمدہ حملات کم وقت میں متعدد ماہوا کے دوران ہوتے ہیں۔
  animal.wolf:
    label: لیو
    summary: ایک جانور جو کتے کا اصل ہے۔
    info: لیو عام ہے، سب سے بڑا جانور ہے اور کتے کا اصل ہے۔ یہ گروہوں میں رہتا اور شکار کرتا ہے، جس میں سماجی ترتیب ہوتی ہے، اور گروہ کو چیخ کے ذریعے اور اپنے علاقے کو علامت دینے کے لیے چیخ کے ذریعے بلاتا ہے۔
  animal.wolverine:
    label: روسوماك
    summary: موذون درختوں والے جنگلوں اور لوئر مناطقوں کا مضبوط اور غضبناک لاَسِکُ
    info: روسوماك جملہ لاسکوں والی فامل کا سب سے بڑا زمیندار حیوان ہوتا۔ اس کے قدرتی رنگ میں نسبتاً چھوٹا انداز، طاقتور شان وشوغ اور عدتوالائی خصوصیات کے باوجود، وہ دشمن پر غالب آجانے کے معروف تصور کے ذریعے مشہور ہوا۔ شمالی امریکا، یوروپ اور ایشیاء کے موذون درختوں والا جنگلات اور لوئر مناطق میں موجود وسعت اختیار کرنے والے خطوط میں یہ مقامی طور پر عام ہے۔
  animal.zebra:
    label: زیبرا
    summary: افریقی جانور جس کے سیاہ اور سفید پٹیاں ہوتی ہیں۔
    info: زیبرا افریقی جانور ہے، جو گھوڑے کے قریب ہے، اور اس کی سیاہ اور سفید پٹیوں کی وجہ سے آسانی سے پہچانا جاتا ہے۔ ہر فرد کا پٹیوں کا نقشہ منفرد ہوتا ہے، جیسا کہ انسان کا انگوٹھے کا نشان، اور یہ گروہ میں شکاریوں کو گمراہ کرنے میں مدد کرتا ہے۔
