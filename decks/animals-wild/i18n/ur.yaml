lang: ur
pivot: false
title: جungle کے جانور
cards:
  animal.elephant:
    label: ہاتھی
    summary: یہ زمین پر سب سے بڑا جانور ہوتا ہے، جس کے ہاتھ اور بڑے کان ہوتے ہیں۔
    info: افریقی ہاتھی زمین پر سب سے بڑا جانور ہے۔ اس کا ہاتھ سانس لینے، پانی پینے، سانس کرنا اور کھانے کو پکڑنے کے لیے استعمال ہوتا ہے۔ ہاتھی گروہوں میں رہتے ہیں جو سب سے زیادہ عمر والی عورت کی قیادت میں ہوتے ہیں اور یہ اچھی یادداشت کے لیے مشہور ہیں۔
  animal.giraffe:
    label: چھوٹا
    summary: یہ زمین پر سب سے اونچا جانور ہوتا ہے، جس کے بہت لمبے گردن ہوتے ہیں۔
    info: چھوٹا زمین پر سب سے اونچا جانور ہے؛ مردہ کی اونچائی 5 میٹر سے زیادہ ہوتی ہے۔ اس کی لمبی گردن اسے اکیلیوں کے پتے تک پہنچنے کی اجازت دیتی ہے، جو اس کا اصل غذا کا ذریعہ ہے۔
  animal.lion:
    label: سیاہ
    summary: افریقی جھومر میں رہنے والا بڑا چوہا۔
    info: سیاہ افریقی جھومروں میں رہنے والا بڑا چوہا ہے، جو عمومًا ساہرا کے جنوب میں ہوتا ہے۔ یہ گروہوں میں رہتا ہے، جن کو پرائیڈس کہا جاتا ہے؛ عورتیں گروہ کے ساتھ شکار کرتی ہیں، جبکہ مرد کے نمایاں گریو کا استعمال حریفوں کو ڈرانے کے لیے کیا جاتا ہے۔ سیاہ کو اکثر "جانوروں کا بادشاہ" کہا جاتا ہے۔
  animal.wolf:
    label: لیو
    summary: ایک جانور جو کتے کا اصل ہے۔
    info: لیو عام ہے، سب سے بڑا جانور ہے اور کتے کا اصل ہے۔ یہ گروہوں میں رہتا اور شکار کرتا ہے، جس میں سماجی ترتیب ہوتی ہے، اور گروہ کو چیخ کے ذریعے اور اپنے علاقے کو علامت دینے کے لیے چیخ کے ذریعے بلاتا ہے۔
  animal.zebra:
    label: زیبرا
    summary: افریقی جانور جس کے سیاہ اور سفید پٹیاں ہوتی ہیں۔
    info: زیبرا افریقی جانور ہے، جو گھوڑے کے قریب ہے، اور اس کی سیاہ اور سفید پٹیوں کی وجہ سے آسانی سے پہچانا جاتا ہے۔ ہر فرد کا پٹیوں کا نقشہ منفرد ہوتا ہے، جیسا کہ انسان کا انگوٹھے کا نشان، اور یہ گروہ میں شکاریوں کو گمراہ کرنے میں مدد کرتا ہے۔
