title: Hewan Liar
cards:
  animal.elephant:
    label: gajah
    summary: Mamalia darat terbesar dengan belalai dan telinga besar.
    info: Gajah Afrika adalah mamalia darat terbesar di bumi. Ia menggunakan belalainya untuk bernapas, minum, mencium bau, dan mengambil makanan. Gajah hidup dalam kelompok yang dipimpin oleh betina tertua dan dikenal memiliki daya ingat yang baik.
  animal.giraffe:
    label: jerapah
    summary: Hewan darat tertinggi dengan leher sangat panjang.
    info: Jerapah adalah hewan darat tertinggi di dunia; jantan bisa mencapai ketinggian lebih dari lima meter. Leher panjangnya memungkinkan jerapah untuk mencapai daun akasia, yang merupakan sumber makanan utamanya.
  animal.lion:
    label: singa
    summary: Kucing besar yang hidup di savana Afrika.
    info: Singa adalah kucing besar yang hidup terutama di savana Afrika di selatan gurun Sahara. Mereka hidup dalam kelompok yang disebut prides; betina berburu bersama, sementara tanduk jantan yang mencolok berfungsi untuk menakuti kompetitor. Singa sering disebut sebagai 'raja hewan'.
  animal.wolf:
    label: serigala
    summary: Hewan psovit liar, nenek moyang anjing.
    info: Serigala Eropa adalah hewan psovit liar terbesar dan nenek moyang anjing. Ia hidup dan berburu dalam kelompok dengan hierarki sosial yang tetap dan berkomunikasi melalui auman untuk menandai wilayah dan memanggil anggota kelompok.
  animal.zebra:
    label: zebra
    summary: Lilokopyt Afrika dengan garis hitam-putih.
    info: Zebra adalah lilokopyt Afrika yang kerabat dekat kuda, mudah dikenali karena garis hitam-putihnya. Pola garis ini unik untuk setiap individu, mirip dengan sidik jari manusia, dan membantu mengelabui predator dalam kelompok.
