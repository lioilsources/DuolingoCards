lang: zh-CN
pivot: false
title: 野生动物
cards:
  animal.aardvark:
    label: 刺猬
    summary: 在地面下挖出通道以觅取食物的一类生物体，它们通常于夜晚活跃并有类似于猪嘴般的面部结构来帮助进食小型无脊椎动物如甲壳纲等；这种行为模式被称为“掘土式”生活方式或称作‘穴居者’现象描述了该过程中的生态角色以及与其他种类间的关系网络形成机制分析结果表明这可能是由于长期进化过程中形成的特定生存策略所致因此可以推断这类个体可能属于某个特殊分类单元内成员之一例如哺乳亚门下的某些科属分布区域主要集中在撒哈拉沙漠南部地区包括但不限于东非高原地带及西海岸沿岸平原等地域范围内都可见到相关记录资料存在说明这些地方具备适宜此类生命形式繁衍生息的基本条件要素组合情况较为理想从而得以维持稳定数量规模发展态势良好前景广阔值得进一步深入研究探讨总结归纳得出最终结论认为应当给予足够重视关注程度提高保护力度确保未来可持续发展目标顺利实现创造更多价值贡献社会进步与发展需要共同努力奋斗前行共创美好明天！
    info: '{"hint":"夜行性非洲食虫动物，拥有猪一样的鼻子（学名：Cynictis penicillatus）","info":"开普刺猬是Tubulidentata目现存的唯一物种，并且没有近亲。\r\夜间活动方式、强壮爪子和粘稠舌头是对捕猎蚂蚁与白蚁的一种适应能力。\r\它废弃的地洞被数十种其他动物所利用。\r\其南非语名称意为地猪。","label":"刺猬","summary":"一种具有类似野猪鼻部特征的夜行动物，在地下挖掘隧道寻找昆虫食用。"'
  animal.armadillo:
    label: 穿山甲
    summary: 身披由鳞片组成的骨骼外壳的小型哺乳类
    info: |-
      九带犰狳是唯一一种拥有真正骨甲的哺乳动物。某些种类在受到威胁时会卷成球状以自保。
      它是一种出色的挖掘者，能在不到两分钟内挖出一个洞穴。
      它是引起麻风病细菌的一种天然宿主。
  animal.baboon:
    label: 狒狒
    summary: 一种具有显著鼻部特征、群居生活的撒哈拉地区原住民哺乳动物
    info: |-
      狒狒是生活在非洲草原和岩石地区的大型灵长类动物。
      它们以有等级制度的群体生活，并通过丰富的声音及面部表情进行交流。雄性明显比雌性大，且为杂食性动物，在埃及被当作神圣生物受到崇拜。
  animal.bear:
    label: bear
    summary: 一种大型毛茸茸且杂食性的哺乳动物，代表自然的力量
    info: 棕熊是欧洲和亚洲最大的陆地食肉动物，体重可达700公斤。它是杂食性动物，以鱼类、浆果、蜂蜜以及小型哺乳类为食物来源。棚冬会进入冬眠状态，在此期间雌兽还会产下幼崽。在捷克的日常用语中，它象征着力量与舒适。
  animal.beaver:
    label: 河狸
    summary: 一种体型较大的啮齿类哺乳动物通过筑造堤坝来建立沼泽生态系统
    info: '{"info":"欧洲河狸是世界上第二大啮齿动物。\u005c它用树枝和泥巴建造水坝，从而形成池塘与湿地，并为许多种类的生物提供栖息地。它的尾巴扁平且有鳞片、拥有大型橙色门牙以及防水毛皮。在捷克地区曾一度灭绝了这种物种，在过去几十年里又重新回归来了。");'
  animal.bison:
    label: 野牛
    summary: 北美大型有蹄类哺乳动物（ Bison bison），具有典型的蓬松鬃毛
    info: |-
      美洲野牛是北美的最大陆地动物。在十九世纪，它们几乎被灭绝；估计数量从三千万到六千万头减少至不到一千只。
      由于保护计划的数量恢复到了大约五十万只左右。
  animal.buffalo:
    label: 非洲水牛
    summary: 一种群居生活的大型非洲偶蹄目动物，“五大兽”之一
    info: 非洲水牛是撒哈拉以南地区最危险的哺乳动物之一，也是所谓的‘五大兽’成员。它们生活在数百到数千头组成的群体中，并能通过集体防御驱赶狮子等掠食者；脱离族群的老年雄性个体尤其难以预测且具有攻击性。
  animal.camel:
    label: 骆驼
    summary: 有用于储藏脂肪的一个或两个隆起背脊的荒漠哺乳动物。
    info: |-
      单峰骆驼（阿拉伯 camel）完全适应了沙漠生活；它的背部储存脂肪，而不是水作为能量储备。
      它一次能喝超过一百升的水，并且可以在没有液体摄入的情况下存活数周。
      早在三千多年前就被驯化并成为沙漠文明的重要交通工具。
  animal.capybara:
    label: 水豚
    summary: 世界上体型最大且非常温顺半水生啮齿类哺乳动物
    info: 水豚是现存最大的啮齿动物，成年个体体重在35到66公斤之间。它们生活在南美洲的热带地区，在河流、湖泊和沼泽附近栖息。
  animal.cheetah:
    label: cheetah
    summary: 在所有生活在大陆上的野生动物中跑得最块的一种动物时速超过110千米
    info: |-
      {"hint":"最快的陆地动物，有黑色泪痕条纹（猎豹 Acinonyx jubatus）","info":"猎豹是速度最快的土地哺乳类生物，在三秒内可从静止加速到每小时一百公里。与其他大型猫科不同的是它不能发出低吼声而只能嘶叫；其苗条的身体和不可缩回的爪子是为了适应高速度而非力量的表现形式。
      短距离冲刺后必须休息降温才能恢复状态。
  animal.chimpanzee:
    label: 大猩猩
    summary: 聪明的大猿物种是人科中最接近人的生物种类之一。
    info: |-
      {"hint":"智能大型猿类（潘·特罗格洛迪特斯），我们最亲近的现存亲属","info":"普通黑猩猩与倭黑猩猩是我们最近的人类动物亲戚，共享约98.7% 的DNA。\u005c
      黑猩猩会使用工具，例如用树枝捕捉白蚁，并能学习手语的基础知识。\u005c
      它们在群体中传承文化习俗并生活在复杂的社会等级体系之中。","label":"chimpazee","summary":"智慧灵长目动物、人类最亲密的活着近亲"}
  animal.coyote:
    label: coyote
    summary: 一种已能生活在城市的北美犬类哺乳动物
    info: "{\"hint\":\"中型北美洲犬科动物（学名：Canis latrans）\",\"info\":\"郊狼是一种适应性强的犬形目食肉动物，广泛分布于整个北美大陆。与灰狼不同的是，它已经能够很好地在人类附近生活，并扩展到了城市地区。\r\n在美国印第安人的神话故事里，它是狡猾机智的角色象征。\r\n它们主要通过嚎叫进行交流，在黄昏和夜晚尤为活跃地发出声音来沟通联系。"
  animal.deer:
    label: 鹿
    summary: 优雅的偶蹄目哺乳纲；雄性的犄角每年都掉落
    info: |-
      森林鹿是欧洲最常见的大型鹿类。雄性（公鹿）长有角，每年脱落并重新生长，这是动物界中增长最快的组织之一。
      在交配季节它们会发出响亮的叫声，并为争夺母鹿而进行搏斗。
      捷克共和国将这种鹿视为狩猎文化的国家象征。
  animal.elephant:
    label: 大象
    summary: 陆地上最大的哺乳动物，有长鼻和大耳朵。
    info: 非洲象是地球上的陆地最大哺乳动物。它们用鼻子来呼吸、喝水、嗅闻和抓取食物。大象以年长母象为首组成群体生活，以出色的记忆力著称。
  animal.fennec_fox:
    label: '"fenek"'
    summary: '"世界上最小型的犬形哺乳动物，有着巨大耳廓"'
    info: '{"info":"费内克是适应撒哈拉沙漠生活的世界上最小的犬科动物。\n巨大的耳朵有助于散发体温并拥有极佳听力。\n它的肾脏非常高效，可以在不直接摄入水分的情况下生存；它通过食物获取所需的湿度。\n在夜间捕食昆虫、啮齿类和爬行动物。"]'
  animal.fox:
    label: fox
    summary: 一种有浓密尾巴且毛色呈红褐色的小型犬类哺乳动物
    info: "{\"info\":\"赤狐是世界上最广泛分布的犬科动物，适应性极强，在森林、草原和城市中都能生存。它以聪明机智著称，并在世界各地童话故事中有歌颂它的传说。\r\n它们捕食老鼠、鸟类及昆虫；必要时也会捡拾垃圾为生。\r\n雌性的狐狸（母狐）每次会产下四到六只幼崽。"
  animal.gazelle:
    label: 羚羊
    summary: 一种体型修长、速度快的东非草原和亚洲稀树大平原上的羚羊
    info: 汤姆森羚羊是非洲最常见的羚羊之一。它能以超过每小时80公里的速度奔跑，并通过独特的跳跃动作向捕食者发出信号。
  animal.giant_anteater:
    label: 大食蚁兽
    summary: 有很长鼻子及黏糊舌头的大型无牙哺乳动物。
    info: '{"hint":"大型无齿哺乳动物，长鼻（食蚁兽三趾）","info":"大食蚁兽是最大的一种食蚁兽类，在中美洲和南美洲生活。\r没有牙齿；用强壮的爪子破坏蚂蚁窝，并且能收集长达六十厘米粘性舌头上的蚂蚁。\r一天内吃掉超过三千五百只蚂蚁与白蚁。\r雌性能在背上携带幼崽。","label":"大食蚁兽","summary":"有很长鼻子及黏糊舌头的大型无牙哺乳动物。'
  animal.giant_panda:
    label: 大熊貓
    summary: 一種來自中國以吃竹為主、黑白色的熊類動物。
    info: '{"hint":"来自中国的黑白熊（大熊猫）","info":"熊猫是中国西南部的特有物种，也是全球自然保护的重要象征。\n其饮食中超过99%是竹子，尽管从解剖学上来说它是肉食动物。\n它拥有一个第六指——腕骨突起，在抓握竹茎时起到额外拇指的作用。\n目前世界上只有大约1800只野生的大熊猫。"]'
  animal.giraffe:
    label: 长颈鹿
    summary: 世界上最高的陆地动物，有非常长的脖子。
    info: 长颈鹿是世界上最高的陆地动物，雄性高度可达五米以上。长脖子让它能够吃到金合欢树的叶子，这是它的主要食物来源。
  animal.gorilla:
    label: 大猩猩
    summary: 地球上的最大灵长类生物，在赤道非洲的大猿
    info: |-
      大猩猩是最大的灵长类动物；成年雄性（银背）体重可达200公斤。它们主要以植物为食，吃树叶、嫩枝和水果。
      通过声音、面部表情以及捶胸来交流
      我们与黑猩猩一样是最亲近的亲戚，并且共享超过98% 的DNA。
  animal.hippopotamus:
    label: 河马
    summary: 非洲大型半水生哺乳动物
    info: "河马是仅次于大象和犀牛的第三大陆地哺乳动物。白天它在水中休息，以防止过热；夜晚则上岸觅食。\r\n它的皮肤会分泌一种红色液体作为天然防晒霜并具有抗菌作用。"
  animal.hyena:
    label: 鬣狗
    summary: 非洲草原上的掠食者和清道夫
    info: '{"info":"斑点鬣狗是猫科动物中最大的成员，尽管有传言说它们主要以腐肉为食，但超过百分之六十的食物都是自己捕获的。雌性比雄性强壮且占据主导地位。");'
  animal.jaguar:
    label: 美洲虎
    summary: 拥有玫瑰色斑纹的最大美洲猫科动物
    info: "{\"info\":\"美洲虎是世界上第三大猫科动物，也是新旧大陆唯一的大型猫类。与雪豹不同的是它的玫瑰斑点内部有小黑点。它游泳和捕鱼的本领高超，并捕食鱼类、鳄鱼以及水豚等猎物。\r\n在玛雅人及阿兹特克人的文化中它是力量和王权神圣象征\"}"
  animal.kangaroo:
    label: 袋鼠
    summary: 一种用强壮后腿跳动的大型澳州有胎盘哺乳动物
    info: |-
      红袋鼠是澳大利亚最大的有袋动物，也是世界上跳跃能力最强的哺乳类之一。雌性会在腹部口袋中携带幼崽约六个月的时间进行哺育。

      袋鼠作为澳洲文化的象征，在许多场合都能看到它的身影。
  animal.koala:
    label: 考拉
    summary: 澳大利亚生活在桉树林中的有胎盘类哺乳动物
    info: 树袋熊不是熊，而是一种有育儿袋的哺乳动物。它几乎只吃桉树叶——这些叶子对大多数生物来说是有毒的；但考拉拥有特殊的消化系统来处理这种食物。
  animal.leopard:
    label: 豹
    summary: 一种有斑点皮毛的大型猫科食肉兽，出色的攀援者
    info: "{\"info\":\"豹是分布最广的大猫科动物，是一种罕见的爬树高手。它会把猎物带到树枝上以保护其免受鬣狗和狮子的影响。\r\n适应性使其胜过其他大型猫类，并且生活在非洲、近东及远东部地区。\r\n黑化形式被称为黑豹。"
  animal.lion:
    label: 狮子
    summary: 生活在非洲草原上的大型猫科动物。
    info: 狮子是一种大型猫科动物，主要生活在撒哈拉以南的非洲草原上。它们以“骄傲”为单位组成群体，雌性共同捕猎，而雄性的显著鬃毛用于威慑对手。狮子常被称为“百兽之王”。
  animal.lynx:
    label: 猞猁
    summary: 一种具有耳尖簇毛特征的小型野生动物
    info: '{"hint":"中等体型的野生猫科动物，耳尖有簇毛（猞猁）","info":"欧亚猞猁是欧洲最大的野猫。\n我们可以根据其耳朵和短尾巴上的黑色簇状皮毛来识别它；它们主要在黄昏时分及夜间狩猎，并以鹿类与兔子为主要食物来源。\n捷克曾将其灭绝过，在二十世纪下半叶成功重新引入了该物种。");'
  animal.mandrill:
    label: mandrill
    summary: 世界上面部呈蓝红相间的最具颜色感的灵长目生物
    info: |2-
       mandrill 是现存最大的旧大陆猴，也是最色彩斑斓的灵长类动物。雄性拥有鲜艳蓝色和红色的脸部图案以显示其社会地位。
      mandrills 生活在喀麦隆、加蓬及刚果共和国热带雨林中的群体中。
  animal.meerkat:
    label: 猫鼬
    summary: 来自卡拉哈里沙漠的小型社会性哺乳类站立后腿上
    info: |-
      猫鼬是一种小型食肉动物，属于獴科，在非洲南部生活。它们以群体形式活动，并具有稳定的社会结构；通常有一只成员在高处警戒。
      它对蛇毒和蝎子的毒素有免疫力
      并且会互相学习捕猎技巧。
  animal.moose:
    label: 驼鹿
    summary: 具有铲状犄角的最大型偶蹄目鹿类
    info: 驼鹿是世界上最大的鹿科动物；雄性肩高可达两米以上，并拥有跨度达180厘米的铲形角。它们生活在北美洲、欧洲和亚洲的寒带森林中，游泳能力极强且擅长潜水，在水下会将头浸入水中以获取水生植物。
  animal.okapi:
    label: 奥卡皮
    summary: 一种栖息地为丛林地区、拥有类似斑马上下肢特征并且属于同源关系密切家族成员的新奇生物体
    info: |-
      {"hint":"来自刚果的森林长颈鹿，腿上有斑马条纹（Oiapia jhonsonii）","info":"直到1901年科学家才正式描述了这种动物，并且它是科学界最近发现的一种大型哺乳类。
      尽管在视觉上看起来像是长颈鹿和斑马之间的杂交种物，但它实际上是现存最接近于真正意义上的长颈鹿物种之一。\n它只生活在民主共和国雨林中并成为该国的一个国家象征符号。
  animal.orangutan:
    label: 红毛猩猩
    summary: 婆罗洲和苏门答腊栖息在树木上的大型红色猴子
    info: 红毛猩猩是唯一一种生活在非洲以外的大猿。它的名字源自马来语，意思是森林人。它是所有大灵长类动物中最独居的，并且一生中大部分时间都在树冠上度过。
  animal.otter:
    label: 海狸
    summary: 生活在清澈水域附近的活泼半水栖哺乳类
    info: '{"hint":"顽皮的半水生哺乳动物（Lontra lontra 或Enhydra lutris）","info":"欧亚河狸是一种完美适应水中生活的鼬科小兽。\n它们有浓密防水毛发、蹼足，并能屏息超过一分钟。\n河狸是水质清洁度的重要指标；哪里生活着河狸，那里的水源就健康。\n在捷克经历了长期数量减少后，如今正在逐渐恢复扩展。");'
  animal.polar_bear:
    label: 北极熊
    summary: 生活在北极的最大陆生掠食性动物
    info: |-
      北极熊是最大的陆地食肉动物和北冰洋的顶级捕食者。它白色的毛发能够完美保温；每根毛都是中空且透明的。
      它是游泳高手，可以游上百公里的距离。
      全球变暖正在减少其猎物所需的浮冰面积，并威胁整个种群。
  animal.porcupine:
    label: 豪猪
    summary: 一种身披锋利防御性棘刺的大型啮齿兽
    info: |-
      豪猪是一种大型啮齿动物，身上覆盖着数千根尖锐中空的刺。这些刺是毛发演变而来的，并不会像箭一样射出；当受到触碰时会轻易脱落并嵌入捕食者的身体内。
      它是非洲最大的啮齿类动物，在夜间寻找树皮、植物和蔬菜。
  animal.raccoon:
    label: 浣熊猫
    summary: 一种带黑脸圈、有斑驳尾部特征的美国本土物种。
    info: |-
      {"hint":"来自北美的戴面具的夜行性哺乳动物（浣熊）","info":"北美浣熊猫原产于北美，但已被引入欧洲，在那里现在大量繁殖。\u005C
      它以在进食前看似清洗食物而闻名；实际上这样做是为了让爪子更敏感细腻。\u005C
      它是杂食性的，并且适应能力极强，甚至可以在人口密集的城市中生存。","label":"浣熊猫","summary":"一种带有黑色面罩和条纹尾巴的美洲动物。
  animal.reindeer:
    label: 驯鹿
    summary: 栖息于极地地区的偶蹄目哺乳类；公母皆具犄角
    info: 北极驯鹿是唯一一种雌雄都长有犄角的鹿科动物。它们生活在北美洲、欧洲和亚洲的苔原地区，能够迁徙数千公里。萨米人传统上将其作为家畜饲养。
  animal.rhinoceros:
    label: 犀牛
    summary: 鼻上有单个或者双只的大型哺乳动物
    info: "{\"hint\":\"大型非洲或亚洲食草动物，有一个或两个角\",\"info\":{\"label\":\"犀牛\",\"summary\":\"鼻子上有一到两只的庞大哺乳类动物。\"}, \"info\": \"白犀是仅次于大象的世界第二大陆地哺乳动物。\r\n它的角不是骨头而是由与人类指甲相同的角质构成。\r\n由于人们错误相信其具有药用价值而遭到盗猎者严重威胁。\r\n在野外有两个物种分布在非洲和三个种类分布于亚洲。\","
  animal.sloth:
    label: 树懒
    summary: 一种倒挂着生活在树林中的行动极其缓慢的地栖性哺乳动物
    info: "树懒是一种完全适应在热带树木冠层中缓慢生活的哺乳动物。它移动得如此之慢，以至于绿色的藻类可以在它的毛发上生长以作为伪装。\r\n其新陈代谢非常迟缓，每周才排空一次粪便。"
  animal.snow_leopard:
    label: snow Leopard
    summary: 稀有的大型猫科动物栖息于亚洲中部高山上
    info: '{"hint":"中亚山脉的一种难以捉摸的大猫（Panthra Uncia）","info":"雪豹生活在喜马拉雅山、西藏和中亚山区海拔三千至五千公尺的高山环境中。\n它有异常长的尾巴，用于在岩石上保持平衡。\n全球估计只有四千到六千五百只左右生存着。\n它是世界上最少被研究过的大型猫科动物之一。");'
  animal.tapir:
    label: 貘
    summary: 一种大型草食性哺乳类动物，拥有可弯曲长鼻子并类似犀牛及马
    info: 貘是一种原始的奇蹄目动物，与犀牛和马有亲缘关系。它们生活在美洲热带雨林以及东南亚地区，并以短而灵活的象鼻抓取树枝树叶为食。
  animal.tiger:
    label: 老虎
    summary: 世界最大型猫科肉食性哺乳类动物
    info: |-
      孟加拉虎是现存最大的野生猫科动物。每只老虎的条纹图案都是独一无二，就像人类指纹一样。
      与狮子不同的是，它喜欢独居，并且游泳能力很强。
      目前该物种被列为极危状态，在野外的数量少于四千。
  animal.warthog:
    label: 疣鼻
    summary: 一种拥有巨大犬齿及脸部特征突起物生活在非洲大陆上的野生动物
    info: |-
      {"hint":"非洲面部长獠牙的野猪（学名：Phacochoerus africanus）","info":"疣鼻栖息于撒哈拉以南地区的野生哺乳动物，是家养猪的一种近亲。
      雄性在脸上有突出的小肉瘤和弯曲的大牙齿用于防御敌人攻击。逃跑时会竖起尾巴像天线一样直立着跑开；挖掘洞穴时不靠自己力量而是利用土豚留下的空地居住。
  animal.wild_boar:
    label: 野猪
    summary: 长有獠牙的野生猪类和各种养殖猪肉种类的共同祖先是它
    info: "野猪是欧洲的原生物种，所有家养猪品种祖先。\n它们是非常聪明且适应性强的机会主义者动物会挖掘根部、橡果，并捕猎小型动物。 \n母性（雌性的）照顾小猪群中的幼崽。"
  animal.wildebeest:
    label: 高角羚
    summary: 参与最大规模的大陆迁移活动的一种非洲迁徙型羚羊
    info: 高角羚是世界上最大的陆地迁徙动物之一，每年有超过一百万只在塞伦盖蒂和马赛马拉之间来回移动。它们是狮子、猎豹和鳄鱼的主要食物来源。雌性几乎同时在一个短短两到三周的时间内全部分娩。
  animal.wolf:
    label: 狼
    summary: 野生犬科动物，家犬的祖先。
    info: 灰狼是最大的野生犬科动物，也是家犬的祖先。它们以群体形式生活和捕猎，具有严格的社交等级制度，并通过嚎叫来标记领地和召集群体。
  animal.wolverine:
    label: 貂熊
    summary: 一种强壮而好斗的地栖鼬类哺乳动物，在寒冷地区的针叶林或冻土带上生活着这种生物
    info: 貂熊是陆地上的最大食肉动物，属于鼬科。尽管体型不大却以力量和攻击性著称，并能将猎物从北极熊那里赶走；它们生活在北美洲、欧洲及亚洲的广大寒带森林与苔原地区。
  animal.zebra:
    label: 斑马
    summary: 非洲的黑白条纹马类哺乳动物。
    info: 斑马是非洲的一种类似马的奇蹄目动物，因其黑白条纹而极易辨认。每只斑马的条纹图案都是独一无二的，类似于人类的指纹，有助于在群体中迷惑捕食者。
