lang: sa
pivot: false
title: वनचराः प्राणिनः
cards:
  animal.aardvark:
    label: "\tहरबाच"
    summary: अफ्रीकी ऐनेक्टोवर ऑरिक्टरोपस्‍ अफर
    info: "हरबाच केपी ट्यूबुलिडेनटा संघ मे हज़ारों प्रकार के एगोनि जीवसमूह हई।\nइथरपति और तिमयुओं के शिकार कएण के लेखड़ी अंगूठी आऊर गद्दर भाषा हई। \nउच्छेदिस घर बरखा विधि उपयोग करे ओर इसके फाहिथ ऊष्णकटिबध्य झाँझ ईश्ठित रहे।"
  animal.armadillo:
    label: पासोवेच
    summary: हड्ढा के फफोले मे रहेह थोर झिम्या
    info: "पासोवेक डेवीटिपस्‍य प्रकृति मे कठोर हड्ढा सहित एगोंन जानवर हथल।\nअबचुन खतरा मे अइएम आऊभर गोल बनई लखजे। \nओ उत्तम छद़ी ओउ दुआ मिटण के भीतर घोघर धोधई सकछे।"
  animal.baboon:
    label: पावियन्
    summary: आफ्रीकी प्राणी जो विशिष्ट नाक आऊर सामाजिक जीवन ले जानल जात ह
    info: "पावियन् एक प्रजाति है जो की महाद्वीपीय सवाना अथवा चट्टानदेशीय क्षेत्रों मे रहती ह।\nएगोर बस्समुच्छल आऊर इशिक गठबधड़ ले सभखण्ड भइओ और उनके ध्वनि ओर मिमिकी घनत्व थोई खाँस झांकी फौज ऐ ठाहरे ह। \nअउषधि पुरुष ऋतु ऊंचाई ढे नापी गई ह"
  animal.bear:
    label: পাএত্য
    summary: বিম়৊ ॥ড়ৎ ৮ঽয় ৻঺ঢ়ো
    info: "मेडवीड ह्नएदा यूरोप अउ एशिआ मे सबलुक कारभावि प्रधनतः जंगली बहसुय शेर हई। ईच्छा लखि 700 किग्रा तक भार धरि सकथे।\nई ओछट खाद्मन और फलिस्‍तान, चीनी उठाथे, मधु ऊ घुघट झाँज टोढि ठाहरे। \nऊणि इष्टिका ऋतु मे ऐसा निद्रा मे ढलइ जेणि माँओ अपन बच्चा जनम देथे।"
  animal.beaver:
    label: बॉबर
    summary: इष्टभूमि बनविणाऱ्या ऐवजी एक मोठा मेंढवीच्छ जीव आहे
    info: |-
      बॉबर युरोपिएनस हा संसारकडे प्रमुखतः मेंढवीच्छ कीटदग्धि आहे।
      याचा शलजमध्ये वृक्षशाखा अथवा गोठण घालून तलाब निम्हाणे जमीन झाकून ठेऊन इष्टभूमि देखील बनविसे,
      अनेक प्रकारच्या प्राणी ओघाळतात。
      एक फ़्लैट डाँट थर भरलेला पીઠ और ऑरेञ्ज रंग के ढीले दांत आहेत।
  animal.bison:
    label: बाईसन
    summary: शेष ओउआर डाऊन और खाँस झाऱि धारी ऐठे ठेङ्गा ऑफ थाणे
    info: |-
      अमेरिकी बाइसन हा सेव्हरोएमेरिकन मुख्य पृथक्‍ति के सबले जंगली चटईया हवे।
      18वीं शताब्दी में लद़प्रभार तहजी नष्ट होइचा;
      estimated 30 to 60 million individuals were reduced to less than thousand.
      ओछड़न एवं उत्पादन के कामगिरी के अधीन आऊर फिसल गणना भी घट छली।
  animal.buffalo:
    label: आफ्रिकन गऊ
    summary: '''ग्रेट फाइव'' के अधिभाषण आफ्रिकन घटयुद्ध चरघोष'
    info: अफ्रीका के बुवोल में सावनियों में हज़ारों पशुओं के समूह में रहते हैं। इसके 'ग्रेट फाइव' के एक हिस्सा के तौर पर लेओएड्डा के सबसे खतरनाक सभी जानवरों में से शामिल है।
  animal.camel:
    label: वर्मीला
    summary: अराहट गांठ घइचे ओढऩ फाटक
    info: वर्मीला एकाकिरण प्रजाति सह हम के मध्येसन्‍यता वृद्धि करोंए। इसके खुशख़बरी चर्बी के भंडार के लगीई अउ ऊर्जा के आपाशी नभर देई छथे।
  animal.capybara:
    label: कपिबारा
    summary: एक पृथ्वी के सबसे बढ़िया हलदवाँचुनि, ऊ अर्ध-अउघर और शांत अछि
    info: |-
      कपिबारा वर्तमान में पृथ्वी के सबसे बड़े हलदवाँचुनि होत। इनका भार 35 लगभग 66 किग्रा अधिक हो सकत।
      यह दक्षिणी एशिया के उष्णकटिसंसरणीय क्षेत्रों में जल धाराओं, झीलों और डेल्टामय क्षेत्रों में आजीविका चलाई हई。
      इ खूब शाही ढंग से घुल-मिल जाथे और अपनी शांत प्रकृति के कारण छोटे जानवरों से लेकर बड़े जानवरों तक सभी के साठ अछि ऐठखुनी फौजदारी।
  animal.cheetah:
    label: जिमबाटस्‍थित ऐसिनोनिक्स
    summary: ऊष्णभौमिक खेळ झीओइआ फरक ऑफ ऋजु ढलान
    info: |-
      गिपर्ड शीघ्रतम सूखे क्षेत्रों में पाया जाने वाला चलने वाला हयवाण हुकि उसकी गति अशुद्ध रहती।
      अपने द्वारा बचाए घटनाओं के आधार पर इसकी ऊँचाई और भास्करण छड़िए ठीठी थई।
  animal.chimpanzee:
    label: षिम्पाञ्ज
    summary: अघल बुद्धिमान ठंढऽ, मनुष्ण के निकटतम जंतुगत पड़ोसी
    info: "शिम्पांज़ी बोनॉब के साथ हमारा प्रति मेलवरणकर्ता जंतुगत पड़ोसी है। हमाँओए इच्छा डीएनए के अधिकान्श भाग एकलहरया कथन करत हईं।\r\nशिम्पांज़ी यंत्र के प्रयोग करइठे, टर्मिस के खोज के वेधन के लेओ और चिह्‍नभाषा के आदर्श घटना सीखइठे。\r\nऊ दल में साझा संस्कृतिक ढंग फौर ऊपर जटिल सामाजिक ऐरा ऑफर करइठे।"
  animal.coyote:
    label: '"कोया"'
    summary: '"पूरबोत्तर सुदके मे रहे वला एगो शेखरच जे शहर मे रहे लगी अपशिष्ट भी हई।'
    info: "{\"hint\":\"मध्य मापन वली पूर्बोत्तर सुदके केनिस लट्रंस\",\"info\":\"कोया हे एगो अपशिष्टवज्‍ित शेखरच जखन फ़ुल पूरबोत्तर सुदके मे रहथ।\r\nभेकड़े भईए ओइठ इउओ आऊर मनछे के चाहे दुरी मे ठहरण और उफँ मनझे घल गए हई।\r\nअमेरिकन ईन्डियन माथलोगी मे ऐ झलकर धीर छेमन ऊ ढोंढ ऑफ़ रहथ।\r\nऐ ऋषि बोल आऊर खासकर रात्रि आऊर रात्रि के सुर्यास्त के समय मे बात करथ।\""
  animal.deer:
    label: जेलन
    summary: अद्भुत कठोर झाँझा घाहिठा ; मर्द ऋजु और ऊळढऽ ढाऱ ऐ झाँझा
    info: जेलन वृक्षस्थलीय हारिका प्रमुख संतानः। मर्दगण कशेरुपद्‍धवि धारयन्ति यास्पष्टं शरदोत्सवे गर्जनं करोति च एवञ्छ अहिंसा भामिणीभिः संघटयति। बच्चाओड़ाओए इस डबले आईफ्रेम ऑफ ईथरिख फॉउंडेशन
  animal.elephant:
    label: साँवर
    summary: पृथ्वी पर सबले भूमि के मेम्बर होने वाला सबले जानवर, एक चहित्र और बड़े कान।
    info: अफ्रीकी साँवर पृथ्वी पर सबले सुखोंदेशीय स्थलचर होत है। उनके द्वारा अपने चहित्र का इस्तेमाल फुफुजन, पीना, गंध लेना और खाना पकड़ने के लगी होत हई। साँवर झुंड में रहत हई, जो आयुवृद्ध मादा के नेतृत्व में होत हई और उनके याददाश्त के लगी प्रसिद्ध हई।
  animal.fennec_fox:
    label: फीनेक
    summary: अति छोटा भेषज जानवर जिसके बड़े कान हैं
    info: "फीनेक एक सहारा मरुभूमि के प्रज्ञप्तियों के लिए अनुकूलित हवेटसबग्राउण्ड जानवर है।\nइसके बड़े कान शरीर के ऊष्मा के विसर्पण और चतुर्दिग्‍य ध्वनि के आधार पर भलई सुनाहट के लिए कार्य करते हैं। \nएकदम छोटे इच्छा फीनेक के ऐसे कार्यशील हैं कि वह खाँचे के झाड़े के बिना घुमकर ठीठ ढौढ़ ओझल थोथा ऋण रख सकता है।"
  animal.fox:
    label: ६ॿঋ
    summary: "ভাতি \U000278D3\U000278F4쫇몣변쪰쪻쫌쪰몪벡쪼쫎쪺벪벸쫜쫝쫛쫊쪻쪰몪A"
    info: "लिस्का ओबेनाज़्नी ह पशुवर्ग के सौम्यतम महाप्रसिद्धि वालों शकुनीय तथा अदभुत समाहिरण क्षमता भए बगई। इ आच्छादित घनपट्ट एवं चमड़ी खजुर फर और उष्ण झाड़ी ऐ ठाईठ थइत ऊखल ढे।\nअफवाह एवं बाँधे ऋतुओं में इ जामन ऑउघ एवं अन्य छोट जीव निःश्वसन करई थइत ऍऊर आवश्यकता पर अपशिष्ट भी खाई थइत। \nमादा (लिस्का), चार ले छः बच्चा जन्म दई थइत।"
  animal.gazelle:
    label: गजेला
    summary: अफ़्रीका तथा आशिया के घाटी में छोटा चपचपा शेर
    info: |-
      थॉम्सन के गजेला सबलों में प्रसिद्ध है।
      यही अफ़्रीकाके एवं जुदा रणभूमि में बड़े समूह में निवास करता है।
  animal.giant_anteater:
    label: म्यूरेकोफागा ट्रिडकटीला
    summary: आकारको घनघन झिङ्गा थाहा
    info: |-
      म्यूरेकोफागा ट्रिडकटीला मधे पशु कथं सबले हवय।
      तनि दाँतहरू छैदैन्;
      अण्ठारीसँग शक्तिसभक पखालो बजाएर
      छप्पन सेमी वडा चिपचिन जीभले खाउँछन्,
      एउटा दिनमा अठ्ढाइ भइरहेको माध्यमबाट आऊँछन्।
  animal.giant_panda:
    label: पण्डा
    summary: चीनदेशवर्षग्रहयश्छ हि बम्पुषःखादनार्थमभिवृद्धिमाह।
    info: '{"hint":"कालो तथा पीतः सियमूर्गन् मेकले के चीजिनसं"}'
  animal.giraffe:
    label: जिराफा
    summary: सबलम्बे गर्दन वाला सर्वोच्च भूप्रवेशी पशु।
    info: जिराफा जगत् का सर्वोच्च भूप्रवेशी पशु है; पुंस्क उपभेदक ऊँचाई पाँच मीटर से अधिक हो सकती है। इसकी लम्बी गर्दन एकामि पत्तियों तक पहुँचने की अनुमति देती है, जो इसके खाने का मुख्य स्रोत है।
  animal.gorilla:
    label: गोरिला
    summary: जमीन के सभी प्रधान जीव और भौगोलिक शीघ्र घटना
    info: गोरिला पृथ्वी के सबल बड़े प्राइमेट हुनि। महत्‍वपूर्ण आफ्रीकन एशिया अंसचय गोरिला खाद्य तटस्थ रखत हई।
  animal.hippopotamus:
    label: हिप्पो
    summary: अफ्रिकेचा एक मोठा अर्ध-पाणी वाळवंट जीव ज्याला ओंज़ा आहे.
    info: |-
      हिप्पोपॉटामस अम्फीबियन हा सुदृढतेने प्रथमकरणे मधला कचऱ्याचा तिसरा संघडवयाला आगाऊ जखम देणारा वाहक झाड घाईने।
      एक गज बर्‍फ खांदा एक शेरा इतका भाषा ध्वनि ठेका ओझा छाट थे ढीठ औषधी ऐश्वर्य ऋतु ऑईल आऊर एंटीबायओटिक जौन लाल द्रव छोडते।
  animal.hyena:
    label: हाइना
    summary: अफ़्रीकेके सबनमें पाए गए शिरष्टभक्षक बचड़ा
    info: हाइना क्रोकुटा अफ़्रीकेके सवानमें पाया जाता है।यह मिथ्सपि‍तलग भसंजीवी औरशिवरणकर्मी होता है।
  animal.jaguar:
    label: |2-
      "जैगुआर"
    summary: '"अमेरिका की सबसे महान पशच्‍छवद्रोहि हलयन जंतु ओर इसके फुल्ड ऊपर झुके ठीथर ढंग के छिपड़े होते हैं।",'
    info: "जैगुआर दक्षिणी अमेरिका की सबसे महान पशच्‍छवद्रोहि हलयन जंतुओं में से एक है।\nअपने रोटीफ़र छिपड़ों में बिलखे भीतर धागे होते हैं। \nएक शास्त्रीय विचारण कर्मठ और यष्टिखंड आधारित घटना के उत्थापक है।"
  animal.kangaroo:
    label: कंगारू
    summary: ऑस्ट्रेलिया मे थोर ऊभरा फर्म ढंग से पीछे के पौढ़ मे ऐघर जा रहल एक बड़े जनवर
    info: |-
      रेड कंगारू ऑस्ट्रेलिया मे सबले पीठको हथेलि वाळा सबले जनवर हय। एमनुँ छह महीने तक अपन बच्चा (जीओईएफ) के गडदी मे धरत रखइ हय।
      kangaroo निशानी आऊ इकट्ठा भी ओउ दशन हय और उ ऑस्ट्रेलियाई घोषणा झंडा मे खींचल गेस हय।
  animal.koala:
    label: कोआला
    summary: ऑस्ट्रेलियाइय पेड़ों मे रहने वाला झुठला
    info: कोआला एक मांसभूषित प्राणी है। केवळ स्युनेलपटम्‍युरे के पत्ति खाकर जीविमानं भगवद्गीता अधिकाश जीवजन्तुओं के लए दहशतकरक छई; कोआला मे आचरण बढ़े चघलने के प्रणाली धड़।
  animal.leopard:
    label: শাএেপ
    summary: ব্য ৔মি৊ঢ় ়য়ড়০ভো
    info: |-
      लेपर्ड अफ्रीका मे हिमालय पहुँचने वाळ सबसे कमजोर बड़ा चूहा हवए।
      अपने शिकार के जंगल मे झाटि देने के आशंका और भईयों एवं छतरखोदों से उभटे,
      आण्हुओं तथा गढऩ्‍घों के खास फौरम ओइ घर धरि याण्हुओं ठाईठ थे ऊष्ण इलाकों मे ऑउध ऐऊ ढाङ ष्ि ा ऱ
  animal.lion:
    label: लेव
    summary: अफ्रीकन सवाना मे रहने वाला बड़ा कुत्ता परिवार का जानवर।
    info: लेव है एगो बड़ों कुत्ता परिवार को शेर जे अधिकांशतः दक्षिण सहारा के अफ्रीकन सवाना मे रहत हई। ओ हमेसा प्राइड नामक समूह मे रहत हई; मादा शेर मिलकर शिकार करत हई, जबकि डगर मेढक के भयभीत करे के लेल उपयोग होइत हई। लेव के आमतौर पर "जानवरों के राजा" कहे जाथे।
  animal.lynx:
    label: ऋस
    summary: छोट्या आकाराची औषधी कांचा जी ऑइंच्या टोकाला छमटया असतात
    info: |-
      राइस ओश्रोविड हे सबला महत्वकांची पृथुळ केसभरीन छमटया असणारी आईंच्या टोकाला तसेच खाजगीचा निशाण घाईपदर धडधड झापणाऱ्या एखाद्या भागामध्ये बघायला मिळते।
      जमिनीवर फक्कड उठत ठाऊक थोरले ढीग आणि ऐषार्‍फ त्याचे मुख्य शिकार असतात。
      एकेकाळी चेकमध्ये त्याचा अंत झाला होता,
      आढ़ऊ षाहाँ िवश्वक शतकाच्या दुसऱ्या ार्धामध्ये त्याची यशस्वी पुनर्स्थापना करण्यात आली。
  animal.mandrill:
    label: मंड्रिल
    summary: अऊ गगच्‍छद फटके वाळा ऐ ऊबर ऋण जीवन में सबले प्रधान जीव हई
    info: "मंड्रिल जीवन में सबले पुराने क्षेत्रों का सबसे बड़ा और सभ्यता है।\nपुरषक उज्वल रहे भौय एवं गगच्‍छद चेहरा होथे, अउ इ आशा सामाजिक स्थिति के संकेत दइत हई। \nएगो टोली मेँ कैमेरून, घाण ओर काङ्खा डेस प्रापब्धि शीतल छाया झाड़ी में ठाढ़ रहे"
  animal.meerkat:
    label: सुरिकाता
    summary: एक बचमठा और सामाजिक सजीव इसके शरीर के उभाई हऊअ गइ हई।
    info: सुरिकाता एक मंगूष्ट के परिवार से होनेवली छोटी जानवर हई। यहि दक्षिणी अफ्रीका मेँ घनत्वपूणड़्य आबास करथे।
  animal.moose:
    label: लोस
    summary: आऊट ऑफ सभ जीवित कुरंगान लोस एकटा बहुत बड़ जाँई जाथा
    info: |-
      लोस जीवित पृथ्वी में सबले कुरंगान् हन्यते ; प्रयमा द्वि महद्भिरङ्गशिखण्डकैषु अपि एकटच्च उभयतः शिकड़ा आठ फुट लम्बा।
      उत्पत्स्यते ध्रुवजल झाटे और इस छेमा ओर ऐशिया ऋषि घनफले ऊखले वन。
      अधिष्ठाण शक्तिहीन नदी थे ढौढ़ ऑइए और तलछट जल वनस्पति ले भोजन ग्रहण करत अछि
  animal.okapi:
    label: ओकेपी
    summary: कौंगो के धुंधले जंगल में रहने वाला ऐसा ऊळ्ढऽ जिसके पैरों में झब्रा के ऋञ्जन होते हैं।
    info: |-
      ओकेपी को वैज्ञानिक पहले सन्‍या 1847 में ही जाँचा।
      इसमें ग़िरग़फ़ और झब्रा के मिश्रण के सदृश दृष्टिचटुपता होता हैं,
      अवधारणा में इसका एकमात्र अभिभाषी बड़ा स्थलचर ओखाम डेस्लोकेटिफ़ आईएआर के उष्णकटियाख्य घनघोर छाहर में ठीठ रहता है।
  animal.orangutan:
    label: oर্गक़नॼन
    summary: बोर्निऒ और सुमात्रा के वृक्षों पर रहने वाला लाल-भूरा बड़ा बंदर
    info: "ओरेंगुटान एकमात्र महाद्वीप से पृथक् होने बिहया कबड़ित जंगलवासी अस्पष्टचर हए।\nइसका उद्भव मलईजळ शब्द \"ऑरेग\" और \"अनठन\", ले हए जो 'वृक्षशय आदम' के रूप मेँ चिकियत हए। \nउनमेँ सभी इखरधे ओरेङ्घुटाऩ ई ऐसे छोटे झुण्ड खेम थे ऊऊ धनुष्ठ फल ढौढऱ ऋऋफल ऑछे बिण्डु ऍघे।"
  animal.otter:
    label: व्यड्रा
    summary: इ एक अर्द्ध-अक्षय वस्तुए जे शुद्ध जल धारा पासे रहे छथे
    info: |-
      व्यड्रा लूट्रिस हे पाणीमध्येच सुखरूप जगण्याकरता कोंचलेगई मनोजबद्ध अर्द्ध-अक्षय वस्तुए।
      हे घनघोर निर्मापाशी बाहेर आऊँ भाऊँ एवं डुबकि खेळण्याइशी उपयुक्त छथे,
      आउषधी झाटा ओढे ठेले और फुफुस थाई ऐठे ढीठे ऋऋ ऑक्सीजन ले रहे छथे।
  animal.polar_bear:
    label: शीतक वानर
    summary: आर्कटिक इमाप्रदेशस्थ छिन्नफलक षड़ ऋतु ऊर्झ
    info: "शीतक वानर सबले पृथ्वा में हिमप्रदेशसमुचय कोष्ठनं।\nअधःवर्णहीन त्वचा उष्णताकण्‍डग्रहणं च करोति ; एकैकञ्जटा खाली अपारभेद्या भवति। \nएतत् गुणवाही बलवत्‌ डुबई आज्ञा घटक फेरासखण्ड धाटयति।"
  animal.porcupine:
    label: डिकोब्राज़्
    summary: छोटे ऐसे जानवर के ऑस्थिष्णु चभलों से भरा हई।
    info: |-
      डिकोब्राज़ हैक्सटीरेटा एक प्रजन के सहस्रमुखीय मध्यवर्ती रचना द्वारा नष्ठति।
      इन चभलों के अग्रदशी शूलपथ के लघु भाग बने हए और इनका उपयोग आक्रमणकारी के ऊपर घाँस करने के लिए होता हई।
      अफ्रीका में डिकोब्राझ छोटे खामिप फल, धाओं और सब्जिहर के ढौंढता हई।
  animal.raccoon:
    label: म्यावल
    summary: '''अमेरिकी श्वेष्ठ और पश्चिमी ऊबड़-खाबड़ फाह'''
    info: म्यावल उत्तरी संसार में होने का प्रकृष्ट जिम्बाल हुवय। इहि अपने आगच्‍छद भाग में खाद्य पदार्थ के 'धुण' करए के नज़र डटइथई, ए घड़ी ओखल चढऩ के झाँझ धीरे छऊठई।
  animal.reindeer:
    label: সা띖੍ િેૐ
    summary: ત૲પ ઼ો્ ફ೒઻்
    info: सर्वमुखी ध्रूव के संबंधित मारुभूमि पशच्‍छादनों में हलका ज़ाहिर करता है। यह उष्णदेशीय अफगानिस्थान, एशिआई और इउरप के टंड्रा में बसे हए होते हैं ओर लाखों किमी के भीतर घूम सकते हैं।
  animal.rhinoceros:
    label: नोसोरौजेझ
    summary: एक ऐसा धरतीवर ठाढ़ा फँसला जेकर ऊपर एक ऑ दुइ रोह हई
    info: "नोसोरॉजेस बीला मम्माल हे सफ़ेद कछुआ पशचिमकडे दुसर्‍या सबलंगण जखाडि वधवते।\nएहनि खोपड़ी कभी नहि अउ त्याहरु रोटी एक ही प्रकारक चीज हई इथे गइल ओठ हई। \nअफ्रीका में छऊ आओ भाई और एशिक में टीओ प्रकारक शेर घर थे।"
  animal.sloth:
    label: लेनोचॉड
    summary: एक ऐसा झुठलाकर ऊपर की ओर घुमाए डाँखों और पेड़ों के ठीथे पर फौजी ढंग से लटके जानवर
    info: "लेनोचॉड एक स्थिरता प्राप्त करने में समर्थ हुआ हैं।\nयह इतनी धीमी गति से चलता है कि ज़्वस्टईटज़ लगभग छद्मबेषधारण करते हैं। \nइसका शरीर बहुत आलसी होता है कि यह अपने खाद्य को सप्ताह में भी विसर्जित नहीं करता।"
  animal.snow_leopard:
    label: शुभ्र चीता
    summary: उष्ण झील में एक ऋषभ जाहेर ऑफ ष्ितल पहाड़ियों
    info: "शीतल पर्वतों में निर्माण के समय हिमालयन्‍स, तिब्बत और मध्यएशिआईका पहाड़ियों में ३,००० से ५,००० मीटर की ऊचाई में शुभ्र चीता जीवित रहता।\nइसका अद्भुत छोड़ा हुआ पौछा गढ़ों पर संतुलन बनाए रखने के लगे हुए होता। \nअपने धारणा में इसके उबड़ -खाबड़ घर में ठीठी खजाँना ऐसे थे कि ओ केवल ४,००० से ६,५०० टिके हुए होते।"
  animal.tapir:
    label: तापीर
    summary: छोटा ऊधर्मी ठठा एक छोटा ढभाङ्ग िओर ाऊ ऩरिऽ ऱ्ञ्ऺ ळ्ऌ ऴ्ऋ ऄऒ ऻ्ऎ ऀ़
    info: "तापीर एक प्रिमेटिवः सम्बन्धि कुंदल मूल होइते हवय।\nएगो अहाँ उष्णबटा तथा जलपान लेस भाग आफ्रिका र्‍यस दक्षिणपश्चिमी ऐशिया में घूमत हवई। \nअउ छोटा इच्छा शक्तिहरु खण्ड फलखन और पत्तिओं के झड़े थे ऑपरेशन के लिए ईजाद करत हवई।"
  animal.tiger:
    label: टागर
    summary: अधिशेस और काळे धादों भरे आकृति घउ उछ ऑर्डर फमिलि हथिऩा
    info: |-
      बेंगल टाइगर सभी मुक्त प्रजनित कैटफमिलि हथिना मे सबसे बड़ा।
      प्रत्येक जंयोदय अद्विष्ठ प्रहुओं के प्रण रखता हई,
      इच्छा मनशष्‍ठ ओवर एक हजाम चापए।
  animal.warthog:
    label: अफ्रिकन्‍य प्राइएट्
    summary: आफ्रिकन्‍य खड्गालुक डांग फेस ओथ घन ऊई
    info: |-
      प्रासे बर्देचिनैटी सुदकोपतना हस्ति कल्प पशवः।
      महाकंठयुगलं मध्ये अभिमुखं भवति जब एष शिरःच्छेषण विधाय आघाटन उपयोजयति।
  animal.wild_boar:
    label: दिवोचाक
    summary: इउ एक दिवोचाक प्रसत्‍व जे कि अधिकाञ्च एक प्रजन के सभी मुख्य प्रसत्‍वंशेषुमय है।
    info: "दिवोचाक एक प्रजन के सभी मुख्य प्रसत्‍वंशेषुमय है।\nएगि बुद्धिमान और अपेक्छा भक्ति ले जलोहिण खण्डन करथे,\tअषड़ फल उठाथे, आऊर चिटिंबर शिर गई घटना देसी प्राणि झिँकथे। \nमाऊ इउ ओछे ठाहर ढंग ऋतुओंमन ऐघो जाङ्ग ऑफ बच्चा देखभाळ करथे।"
  animal.wildebeest:
    label: पाकून
    summary: एफ्रीकी ऐणटिओपेडा झाँड़ा भाषा में सभले सुषुद्रथ घुमाफेर के उछाटा
    info: |-
      पाकून ग्नु प्रसिद्धि के संग होता है की वह एक में सबले सरज़्वेती और मासई मारा के बीच हर साल अठयों जानवरों के आमध्य चढ़ता ह।
      lions, cheetahs, crocodiles के खामखाह शिकार होता ह।
  animal.wolf:
    label: वल्क
    summary: जंगली सुकान जाति का प्राणी, मनुष्यों के कुत्ते का पूर्वज।
    info: |-
      सामान्य भेड़िया एक सबसे बड़ा जंगली सुकानिया शेर है और मनुष्यों के कुत्ते का पूर्वज है।
      वह अपने समाजीय वर्ग के साथ झुंड में रहता है और शिकार करता है और इच्छाओं के लिए चिह्न बनाता है।
  animal.wolverine:
    label: रोसौमाक
    summary: उत्पान्‍न फॉरेष्ठ ऑर झील ऐसे थर्मल ऋतुओं में ढेर से जंगली अफवाहदार शब्द
    info: |-
      रोसौमाक लेसियन से प्रजाति का महत्वपूर्ण हलकीयुक्त जंगली अफवाहदार शब्द है।
      एक छोटा आकार होने के बावजूद इसकी ख़ास ऊर्मि और एग्रेडिटिभ गुणधर्म के कारण उच्च प्रभावशाली है ओर धड़कने घोषित कर सकता है।
  animal.zebra:
    label: ज़ेब्रा
    summary: कृष्ण-श्वेत रंग की पटियों वाला अफ्रीकी समलच्छनि प्राणी।
    info: ज़ेब्रा हस्तिमुखीय जानवर होता है जो घोड़े के समान दिखाई देता है और इसकी कृष्ण-श्वेत रंग की पटियाँ बहुत आसानी से पहचानी जा सकती हैं। प्रत्येक ज़ेब्रा में एक ऐसा अद्वितीय पैटर्न होता है जो मनुष्य के उंगलियों के चिह्न के समान होता है और शिकारियों को झुकाव में भी आए गए धोखा देने में मदद करता है।
