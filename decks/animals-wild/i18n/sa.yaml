lang: sa
pivot: false
title: वनचराः प्राणिनः
cards:
  animal.elephant:
    label: साँवर
    summary: पृथ्वी पर सबले भूमि के मेम्बर होने वाला सबले जानवर, एक चहित्र और बड़े कान।
    info: अफ्रीकी साँवर पृथ्वी पर सबले सुखोंदेशीय स्थलचर होत है। उनके द्वारा अपने चहित्र का इस्तेमाल फुफुजन, पीना, गंध लेना और खाना पकड़ने के लगी होत हई। साँवर झुंड में रहत हई, जो आयुवृद्ध मादा के नेतृत्व में होत हई और उनके याददाश्त के लगी प्रसिद्ध हई।
  animal.giraffe:
    label: जिराफा
    summary: सबलम्बे गर्दन वाला सर्वोच्च भूप्रवेशी पशु।
    info: जिराफा जगत् का सर्वोच्च भूप्रवेशी पशु है; पुंस्क उपभेदक ऊँचाई पाँच मीटर से अधिक हो सकती है। इसकी लम्बी गर्दन एकामि पत्तियों तक पहुँचने की अनुमति देती है, जो इसके खाने का मुख्य स्रोत है।
  animal.lion:
    label: लेव
    summary: अफ्रीकन सवाना मे रहने वाला बड़ा कुत्ता परिवार का जानवर।
    info: लेव है एगो बड़ों कुत्ता परिवार को शेर जे अधिकांशतः दक्षिण सहारा के अफ्रीकन सवाना मे रहत हई। ओ हमेसा प्राइड नामक समूह मे रहत हई; मादा शेर मिलकर शिकार करत हई, जबकि डगर मेढक के भयभीत करे के लेल उपयोग होइत हई। लेव के आमतौर पर "जानवरों के राजा" कहे जाथे।
  animal.wolf:
    label: वल्क
    summary: जंगली सुकान जाति का प्राणी, मनुष्यों के कुत्ते का पूर्वज।
    info: |-
      सामान्य भेड़िया एक सबसे बड़ा जंगली सुकानिया शेर है और मनुष्यों के कुत्ते का पूर्वज है।
      वह अपने समाजीय वर्ग के साथ झुंड में रहता है और शिकार करता है और इच्छाओं के लिए चिह्न बनाता है।
  animal.zebra:
    label: ज़ेब्रा
    summary: कृष्ण-श्वेत रंग की पटियों वाला अफ्रीकी समलच्छनि प्राणी।
    info: ज़ेब्रा हस्तिमुखीय जानवर होता है जो घोड़े के समान दिखाई देता है और इसकी कृष्ण-श्वेत रंग की पटियाँ बहुत आसानी से पहचानी जा सकती हैं। प्रत्येक ज़ेब्रा में एक ऐसा अद्वितीय पैटर्न होता है जो मनुष्य के उंगलियों के चिह्न के समान होता है और शिकारियों को झुकाव में भी आए गए धोखा देने में मदद करता है।
