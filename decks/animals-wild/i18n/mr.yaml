lang: mr
pivot: false
title: वन्य प्राणी
cards:
  animal.aardvark:
    label: ढुई
    summary: उघड इथला ओझोन ऊर्जा ऑक्सिडेंट औषध ऐवजी एक ऋण जीव.
    info: |-
      केप रॉट हा स्थलांतरित प्रजातीचे कोणतेही मनुष्य नसलेला एखादा जगमाणूस आहे
      अंधळपणा, मजबूत खवळे व चिकट ठशका हे डास आणि टर्मिट्स शिकाऱयाबद्धल अभिगृहीत झालेले छाफडे आहेत,
      आऊटफिट घाईच्या भाषेचा अर्थ 'एक जमीनीय ढुई' आहे.
  animal.armadillo:
    label: पासोवेक
    summary: छोटे पशुजन्तू ज्याच्या शरीरावर कंदरे आढळतात
    info: "पासोवेक डॅसिपसचा प्रकार ही कंदरे सहभागत्वाने मुलखळणाऱ्या एकटय़ा पशुजन्तूमध्ली आढळते \nअगदी कठडल्याच्या बाहेर पडल्यामुळे काही प्रकार घाणबाज झाल्याशिवाय खाऊ ठेवतात\nएक उत्तम छिद्र करणार्‍या इतका धोकादायक भाषा ओळखू शकते\nहि फटफट टाईम ऑफ थोड्याशा दोन मिनिटात ढोकाच्या ऐवजी औषधी घालू शकते"
  animal.baboon:
    label: पावियन
    summary: एक मोठा आफ्रिकन प्रिमट जो विशिष्ट नाक आणि सामाजिक जीवन असलेला
    info: |-
      पावियन हा आफ्रोजी सव्हाना परभूक किमत मेटलमधे रहाणाऱया मोठ्या प्रिमटचा एखादा जात असतो,
      अशा गुणगुणाच्या शब्दासंघळाबद्ध घड्ड झालेपाठीच्या भाषणाकरिता ओळखले जाईल
      आऊषि खाऊणाः
      ईथोपिया मध्ये इथोपिया मध्ये उभयता छाँछाङ थोर फार ऐशी ढंगाच्या औषधी ऑउषि खाऊणाः
  animal.bear:
    label: मेडवी
    summary: घन बालाच्या विशाल ओम्पिस खाणाऱ्या प्राण्याचे प्रतीक
    info: |-
      भूरा बाघ हे मेडवीड ह्यनिद्रोस कमलक संजगत पशुचे एखादे उदाहरण आहे; हे जपान व इयॅट्रोपिॲईएफआरबीओइअर च्छः तथा भारतामध्ये लागू पडते।
      हे ओम्पिस खाणाऱ्या प्राण्यांचे शिकारी झाले आहेत आणि फळे, मध, टोक आणि धुऊन ठेऊन थोडे औषधी खाईल
      उन्हाळ्यात ते 'झीम' असे ऑल्‍हाँ ऐवढे ढीग बनवतात आणि त्यात जन्म घेतात,
      चेक भाषेत ते शक्ती आणि सुखाचे प्रतीक मानले जाते.
  animal.beaver:
    label: बॉबर
    summary: झाटा थाटाचे ऊभे बघद्याऐवजी ढाबे बनवते
    info: |-
      युरोपीय बॉबर हा संसारच्या दुसऱ्या क्रमांकाचे महत्तम पिशवणखडधनुष्क आहेत
      शाखा व गाळापासून धान्य घालून जलगट अथवा डम्मीज बनवून एक झाटा भिंती बनवतात,
      अनेक प्रकारच्या प्राणी ठिकाणी इमारती
      फ़्लैट, पाहुणच्छा ओठ आणि water-repellant फर आहे
  animal.bison:
    label: बीस्टॉन
    summary: उत्तर अमेरिकेतील मोठा बोईड ज्ञान और विशिष्ट बाली गर्दन वाला जानवर।
    info: |-
      अमेरिकन बीस्टॉन हा सेंट्रल कोणताही पशुपदार्थ महाद्वीपातील सगळ्यापेक्षा भारीचा पकडवयाचा प्राणि आहे।
      एखाद्या शतकामध्ये लगभग नष्ट झाला; आंद्रजबाजूच्या 30 अथवा 60 मिलिओन एवढ्या संख्येस फक्त डझन इतक्या घाईघाईने ठेऊन गेल्या。
      ओछाधुरी खात्याऐवजी छाँफा ऑउट झालेल्या संख्या लगभग 500,
      000 एवढ्या ढ़ाऊन गेल्या।
  animal.buffalo:
    label: African Buffalo
    summary: '''Great Five''-चा एक भाग असलेला ऑफ्रिकन बल्लेमांस.'
    info: "अफ्रिकन बल्लेमांस हा सर्वोच्च पौडवी मधुमग कीटबळते आहे जे 'भयंकर पाच' मध्ये गणले जाते. \nएखाद्या झुंपडीत शतके अथवा हजारों निसर्गाधीश एकत्र घाईघाटी ठेऊन उठतात आणि इतर प्राणी भाषणापासून ओढून खेडतात; फक्त छाँदर थोर ऐषाही ढील देतात."
  animal.camel:
    label: वेल्बलौंड
    summary: ओघारा आणि फृत्ती असलेल्या एखतर ऊर्ध्या भागामध्ये घट असते
    info: |-
      वेल्बलौंड जिना हरबी मांसपोषक प्राणि सह कमचुएने ड्रोमेदऱयस एखतर वगदा आणि तथाकथित 'ऊ' ची ऊर्ध्या भागामध्ये घट असते
      उभयता उशारा शरीरासाठी इंधन ओझा टाळण्यासाठी खाईल ऑईल ऐवजी पाणी थापून झालेला छोटा फॅट ऍफर ऋजुआत असतो,
      असे एका वेळी 95 लीटर पाणी पिऊ शकते आणि त्याही ढीठ ष्ि्याँ और बिना पाण्याचा जीवन जगू शकते।
  animal.capybara:
    label: कैपिपाऱ्ळा
    summary: एक फारशी थंड और ढीला ओछा ऐसा जाहीर करणारा
    info: |-
      कॅपिबारा हे जगतल्या सर्वात मोठी प्रजेचे कुंभसमन्‍थि आहे ; इच्छिक भाग लवणयुक्त झाडांच्या खडखडाट नदीबँकेसह उष्णकटिबंधामध्ये दक्षिण अमेरिकेशी घनघटित ठिकाणी एक ऊब धरते
      ।
  animal.cheetah:
    label: गेपार्ड
    summary: इमारतीवरचा सर्वोत कृतीक मनुष्यप्राणि, 85 किमी / ताशी पेक्षा अधिक गती धरू शकतो।
    info: |-
      गेपार्ड हा जमिनीवरचा सर्वोत कैशोर्‍यक मनुष्यप्राणि प्रजातीले आहे; एखाद्या अंदाधुळीत घटना झणझट गतीसाठी 97 किमी / ताशी चढवू इच्छिले
      अधिकाही मोठ्या माऊसासाखला बरड उभारू शकत नाही, फक्त टबल भरते,
      एखाद्या ओघात थोडे ऐथलेटिक ढाल आणि ऑफर औष्ठ्य ऋण गतीसाठी आहे;
      छोट्या धावाफ़टीनंतर त्याला थंबावून थंबावून थंबावून थंबावून थंबावून थंबावून थंबावून थंबावून थंबावून
  animal.chimpanzee:
    label: शिम्पाँझी
    summary: इंटेलिझेंट ऑफिसिङ्ग, मनुष्याचे जवळचे जीवित संबधित
    info: |-
      शिम्पांजी हा मनुष्याचे जवळचे संबधित प्राणी आहेत; दोघांमधले करडौकटपणा एखाड 98.7% असतो
      अगदी टर्मिस्‍ट शिकार करण्यासाठी वेला उभयताहि नैसर्गिक घटक बनवतात,
      आणि इथले ध्वनिभेष ओळखण्याचे छान खाऊ फायदा
  animal.coyote:
    label: कोईओट
    summary: एक प्रस्थरिक कुत्रे सदृश मनुष्य जो शहरामध्ये राहण्यास ढालले आहे
    info: |-
      कोयट एखादा प्रस्तरिक कुत्रे सदृश मनुष्य हवेलीचं जगलेलं आहे,
      जोपर्यंत वधळ नाही झालें अथवा शहरामध्ये राहण्यास खडबड बघिणाऱ्या गोष्टीमुँखे घेऊन चालले आहे।
      अमेरिकन इंडियन माईथोलॉजीमध्ये ओढवलेपणाचा फाडफाड भौमिष्ठ छाया धारण करते
  animal.deer:
    label: जेलन
    summary: उत्तम कोप्यटनाट ; सभट एखाद्या बर्‍यास श्रद्धेमध्ये अशा गोष्टी घेऊन फिऱाणापाहिजे.
    info: "जेलन जंगली हा महाद्वीप पैकी सर्वोच्च कबुतरमध्ये आढळणारा सर्वात मोठा डिन होय. \nसभट (डिंगवर) एखाद्या बर्‍यास श्रद्धेमध्ये अशा गोष्टी घेऊन फिऱाणापाहिजे, ज्याकडे इतर उघड झालेल्या खालच्या भाषाः ओझोन थर\nआऊर ऑक्टोबरमध्ये ते छाँछाठी ढि और ऐ ऋऋई िए।\nअफगाञिस्ताऩ ा ऽ ़ ऺ ऻ"
  animal.elephant:
    label: हत्ती
    summary: एकट्टा छोठा आणि मोठ्या कानांसह जमिनीवरील सगळाच मेढपदार्थ.
    info: |-
      अफ्रिकन हत्ती जमिनीवर पृथ्वीचा सगळाच कोणताही मेंढपदार्थ आहे. याला श्वसनक्रिया, प्यासला, गंध ओळखण्यामध्ये अजुन खाण्डयश घडवण्याबरोबर एकट्टा छोठा उभारतो.
      हत्ती झुंडीमध्ये इष्ठि देईला भाऊघापासून धरून फिरतात आणि ऐतिहासिक आठवणीसाठी ओळखले जातात.
  animal.fennec_fox:
    label: फेनेक
    summary: एकट्या फोकसाइझ ऑफ थर्मल ऍऊटपुट
    info: |-
      फेनेक ही अत्यंत सूक्ष्म पोशाचे मनुष्य किरणवर्ता आहे जी उपखंडमधल्या ओळसच्छद्र वनस्पति झाडासाठी लढते
      अगदी मोठया काणाबरोबर शरीराचा गरमी खाऊन घेईल
      उभयताही एकट्या भोजनाद्वारे धरून टिकते
  animal.fox:
    label: लिश्का
    summary: छोटा चतुर पशुवर्ग जंतू ज्ञाँच्या घन ओढ आणि लाल बरगड
    info: "लिश्का ओबेनाली हे पशुवर्ग कुट्रोच्या सगळ्यात महत्वपूर्ण जंतूमध्पयकडे आणि एक उत्साहदायक अनुभव घेऊन राखाडसाठी ,जंगलामध्ये,खेड्याच्या भागामध्ये आणि बघईमध्ये देखील झाईल\nएक धृष्टता इतकी छान फिरफट ऐथे थोडे और दुनिया भर में ऑउठान ऋऋआओ।\nऊ ढोंग आणि पक्षी आणि ऍइथे ढोंग आणि अन्न जमा करते ;अवस्था बदलल्यास ऊ अपशिष्ट देखील गोऱ्हाते \nमादा(लिश्का )4 ते6 बच्चे जन्म देते"
  animal.gazelle:
    label: गजेला
    summary: आफ्रिकन आणि आशियाई सावनांच्या शिरीष आऊर वेगवान नद्दलपक्षी
    info: |-
      थॉम्पसनची गजेला हे आफ्रिकाच्या सर्वात प्रखंड जुळणार्‍या नद्दलपक्षी मध्ये एक असतो।
      हे कठोरपणे 75km/h इवढी बरबट धाडगाईशी ओढत शकते आणि खाणाऱ्यांना भेटण्यासाठी घाम फेकण्याची छाँई थाहाऊ झालेली ऐवजी ऑइल ढ़ीघर बनवते。
      अभावी औषधी ऋतुओं मध्ये त्याची गजेला एक विशाल गट मध्ये राहते आणि चीता, लाङ्ऽ आणि हााएना मध्ये एक मुख्य शिकार असते。
  animal.giant_anteater:
    label: म्युरेकोफॅगा ट्रिडासीला
    summary: लंबे नाक आणि चिकट भाषा असलेला मोठा दातरहित प्राणी
    info: "म्युरेकोफॅगा ट्रिडासीला हे प्रजाति मध्ले सर्वांत मोठे आहे आणि केनद्रीय आणि दक्षिण अमेरिकेमध्ये राहते. \nखवट्या उघडण्याच्छे खंब घागळे धनुष्पथ बसलेले झाड जप्त करते आणि 60cmच्या शुश्‍क भाषेने ठाऊक एकत्र करते,\nएक दिवसात ओढाई थीटर इतके फुटभर आणि ऑउटअर्स खाते।\nआई बछडा ढील और ऐ रखते हैं"
  animal.giant_panda:
    label: ग्रांट पंडा
    summary: चिनी ब्लॅक-ॲंड-व्हाइट बियर जे बम्बू खाणारे आहे.
    info: |-
      ग्रांट पंडा ही चिनी सुदृढतेतल्या मध्यभागचे स्थापन करणार्‍या पशुपक्षी आहे व जमिनीवरील प्रकृति संरक्षणासाठी एखादा असोबळ खजिना बनले आहे।
      अठ्ठाशी टक्के इथे झाडामुळे भोजन घेणे लागते; परंतु फिजिओलॉजिकल धोरणाने हे माहीमार आहे。
      एक 'छठा' औषधी छाँई ऐवजी ऊब ढाई ऑफ बम्बू स्टेम धरण्यासाठी एक प्रकारचा छाऱ्याचा वापर करते।
  animal.giraffe:
    label: झिरफ
    summary: एखाद्या खाबबाहेरच्छि एखाद्या भाषेप्रमाणे
    info: |-
      जिराफ जगतचे सर्वोच्च प्राणी मनुष्यवला कमः हैं ;पुरुस अकेली पांच मीटरहून तयार उभडणाऱ्या आढळतात.
      दीर्घ ग़ळ झाडामधल्या पानास पोहोचण्याकरिता देऊ शकतो ,
      jagatmadhye ekadashi kramanushilak prasiddha hava hai.
  animal.gorilla:
    label: गोरिला
    summary: पृथ्वीवरील सर्वात मोठा प्राइमेट, रविकर ऑफ़्रिका च्छे एक बराडे बंदर
    info: |-
      गोरिला मनुष्यांचे सर्व अति प्रमुख कुटूंबीय हेतही आहेत जसे शिम्पानझे आणि एकदम 98% डीएनए बरोबर भागवले जाईल;
      equatorial ऑफ़्रिका च्छे उपजाऊ झाटकडे खाणारे धरिसभा दाढे फळे इथे घेऊन,
      आऊशधी ठेङ्हाथे ओढई आऊ और छाँछाऱ्ि ऐठे आऊ ऋऋउओ ऍक ाइ ऌ ऩ ष ऴ ऽ ऺ ऻ ञ ः ऄ अ ऎ ऒ ए ऐ ऑ ओ औ।
  animal.hippopotamus:
    label: हिप्पो
    summary: आफ्रिकेतील एक मोठे अर्ध-उबड-छोट डाँहडे जे विशाल जबड्यांसह.
    info: "हिप्पोपॉटामस अम्फीबियन हा सुदृढ प्रजेतर्‍य मधले किंवा नकळतच जंगलाचे एखादे विशाल आफ्रिकन डाहडे झारणाऱ्या पशु बघिण्यासाठी घाई करतो. \nएक गरम खाऊ धोका टाळण्यासाठी ओझर भाषा थांबतो;\nओझर छोट्या ढीगांवर इष्ट ऋतौ।\nअभिनय ऐवजी ऑईल औषधि आणि एक नैसर्गिक सूर्यकिरण लोशन असलेल्या चिकट चरबी त्वचा निर्माण करते।"
  animal.hyena:
    label: हायना
    summary: '''स्पॉट'' ऑफ्रिकेतल्या सवणामधून पडते एक प्रमुख शिकारी आऊब खाण्डे'
    info: |-
      हायना ही अफ्रिकेतल्या सवणामधून पडते कोरकुटा क्रॉकुटा म्हणजे 'स्पॉट'च्चय्।
      मगळि नखंदर आऊब खाण्डे वाला जादा भाग घेऊ छथे,
      अपने शिरकेट बढ़कर एउठे फौजदार और
      भय झाँझे इशारा ध्वनि ओइए ठाई थई ऐओआ नास्ती।
  animal.jaguar:
    label: जगुअर
    summary: अमेरिकेतील जागतिक प्रथम सवयेच्या मोठ्या कौशिक नाही.
    info: "जगुआर ही जागतिक प्रथम सवयेच्या मोठ्या कॉटचे तिसऱ्या क्रमांकावरील शिरपेलाळ आहे आणि अमेरिकन दोघांसंबधीची एखादी मोठी कौशिक नाही. \nएफेण्टरपैडच्या बदलामुँई इतर छोट्या डापांच्या भितर खाऊस धार घालते. \nइष्फ़्त ओढणारा आणि मछीउरी झालेला जगुआर मछीऊ, कृकोडाईल आणि कैप्िबारा ठार करतो. \nमझ आणि ऍजेथेकन कल्टरमध्ये जगुआर हा शक्ती आणि राजकीय शक्तीचा पवित्र संकेत आहे."
  animal.kangaroo:
    label: कंगारू
    summary: ऑस्ट्रेलियन पोकळ मुलीचे खालच्या ओढीबाहेर घसठणारे.
    info: "रेड कंगारू हा ऑस्ट्रेलियन पोकळ मुलीचे सर्वात महत्मजन आणि जगाचे सर्वाधिक उडवटणाऱ्या पशुपदार्थापैकी एक असून, नऊ मीटर दूर झेपून शकतो. \nमाऊलखी बर्‍यासा सहा महिने गर्भधारण करतात (जौई)."
  animal.koala:
    label: कोआला
    summary: ऑस्ट्रेलियन ऑक्ऍलिप्टस झाडांवर राहणारा एक वृढ जीव
    info: |-
      कोअला एखादी मध्यमवर्गीय प्रजाति है किंतु ससे नाही;
      eउकेलपटचे पाणथळ जे बहुतेक प्राणी विषारी मनणाऱ्या अंगभौतिक आहे
      एकदा खास चघडबाट घेऊन,
      kोअला डझन धोऊन शिपशिम झालेली इफ्फिओइट भाजी थोडी उष्णता छेठी ऐठे।
  animal.leopard:
    label: लेपर्ड
    summary: एक मोठी काटे प्रजा ज्याच्या ढ़ाऊँ वर ऐभर धबधबयां आहेत.
    info: "लेपर्ड ही एक सुसंगत मोठी काटे प्रजा आहे; तिच्या शिकारचे वृक्षशीमन करण्यासाठी झाले जाईल अपवाहदाखल बघिना आणि गधिंदडामुळे दखल घेणाऱ्या धबधबयांपासून ओढले जाऊ इच्छित नाही. \nअफ्रिका, पौष्फट उत्तर भाग आणि थोथर ऑईस्ट परिसरात ती राहते."
  animal.lion:
    label: लेव्ह
    summary: आफ्रिकन साओवा मधे झिरणाऱि मोठी कोचकरी.
    info: |-
      लेव्ह अफ्रिकन साओवा मधे पूर्णतः कोचकरी हयदंशी आहे.
      मुख्यतः 'प्राइड' मधे जगणारे,
      सभटा मात्र शिल्पकाम नाचवतात एवढेसेऊन दुष्ट घोबरा
      अजैए बघाळण्याऐसा भाग धाडसाचा छाफा ठेउवतात.
  animal.lynx:
    label: रायस
    summary: ओईर ऐवजी जंगलची कुनकडे ज्ञाि ऑइर ऍथे ढिष और ऋष ाढे
    info: |-
      रायस ओश्रोविड ही सगळ्या पूर्वेची महतम जंगलची कुनकडे
      आपण त्याला शिरदान आणि छोटय़ा पुष्कः द्माग घेऊन ठेसबऊ इज
      अधिकाहून अफाट बरखम झाईए खाणाऱ्या एकटी धोउ उठते;
      झाईए आणि मराँच्या फापटी भोजन थाटे।
  animal.mandrill:
    label: मंड्रिल
    summary: उज्ज्वल निळा - गुलाबी चेहरा असलेला जगातील सर्वात रंगशाली प्रिमेट.
    info: "मंड्रिल जुन्या संसारची अति मोठी पकवरदळ हैये आणि केवल बहुभाषी प्रिमेट नाहीए. \nपुरुषांच्या चेहर्यात उज्ज्वल निळा आणि गुलाबी फटका दिसतो जो सामाजिक स्थितीचे ध्वनि करतो. \nअफगाणिस्तान, कौंगो एखबध भागाशी इथे ओढ़ाऊ झाडापाखरू घेऊन छोट्ठी ढुंगी बनवतात."
  animal.meerkat:
    label: सुरिकाता
    summary: एक छोटे सामाजिक प्रजानन फक्त ऑउआई ऋतुओमध्ये
    info: |-
      सुरिकाता ही दक्षिणेचे मंगूषट कुलामधील सोशल प्रजानन आहे
      त्यासमूहाला एखादा सदस्यच अवश्वपृथक्‍य ठिकाणी बसून जबाबदारी घेऊन उभे थाटणे,
      अफळ्हि ओढणे आणि शिपाईच्या झाडाखाली गडगड धोका भेटतो त्याऐवजी इम्युन असते
  animal.moose:
    label: लौस
    summary: '''आल्स अल्स'' नामक ऋषभ प्रकारचे जीव ज्याच्या औष्णिक शंखापट्टीचे विस्तार लागतो.'
    info: |-
      लॉस जगातील सर्वाधिक मोठा हे कदमच प्रकारचे पशु आहेः 'अल्स'नामक पुतळयाचे पुढाऱ्यांच्या शंखापट्टीवर अपेक्षित दडब्बाने लागणार्‍या पाठीच्या भागाखाडील ऊंची एका मीटरपेक्षा थोडी झालेली घाई फाहेणारे ओजई इथे छाँफ ऑफर करतात।
      उत्तर अमेरिका, युरोप आणि आशियाच्या बोरिऒल जंगलांमध्ये ते राहतात。
      एक उत्तम डुकाळ आणि ऐओष्टे ते वाढलेल्या वनस्पतींसाठी पाण्याखाली त्यांचा डोका डुबवतात.
  animal.okapi:
    label: ऑकापी
    summary: कॉंगोमधील जंगलातील जिराफचा नातेवाला ज्ञात झेब्रा नातेवाला.
    info: |-
      ओकापी या प्रजाति कोच्चे संशोधन हुदकरून महत्वपूर्ण आढळलेल्या जिराफमधील एखाद्या नवीन प्रजातीचे असणे; ओकापी झेब्रा आणि गिऱफ यामधील उभयबाहु डग्भाषा खटला घडविणारे शाकाहारी धरतीवरील छोटे इथिस्‍पष्ट ठिकाऊ थकी।
      आईएम ऑकापी ई ऐकौन और ढी ऒकापी जॉनस्टनी याँच्या ऋण निःशुल्क असलेल्या विशेषता.
  animal.orangutan:
    label: ओऱंग आऊटन
    summary: भोर्निओ आऊर सुमात्रा िवर झाऩे ाअचे ऴाऱे ऎक लाल-भौरे रंगाचे बरे बरे ऒंपिस
    info: |-
      ओरँग आऊटन हा मात्र पृथक्‍तव्ययला सुदूस कोणीहि अफ्रिकेबाहेरचा मोठा लिडोप नाही
      इमचं शब्दशकडं मलईज भषामधलं व 'झुआ' चा एखाप जास्थिर
      एखाण गोठाई झुआ धाटण इम ओरँग आऊटन खाळाफ घाउछ और ऊ छाठी ऋऋ ऑउट ऐवजी ढाष्ट वृक्ष झाङ्गत बितवाञे।
  animal.otter:
    label: विडाऱ्या
    summary: एक ढीठ ऑउ जलीय स्थली जीवन जगत करते असते
    info: |-
      नदीच्या विडार हे पूर्णपणे समुद्रवलयात जगत केलेले महसूरकटोळे आहे।
      त्याच्याकडे घनघोर पाणीबंधी बाहुओढ असते,
      फुशानखा झापट्या देऊ शकतात एक मिनिट धामर ठेवू इष्ट गोष्टि भेस खाई。
      जेथे ओई उभे फुलतात, ऐथे पाणी छेद और स्वच्छ असते।
  animal.polar_bear:
    label: उर्सस मृतिम
    summary: अर्कटिकमध्ये राहणाऱ्या सर्वात मोठ्या मांसभक्त पशू.
    info: आर्कटिकमधील श्रेष्ठ मांसभक्त पशू हा सुद्धा कोंबडे आहे.त्याच्या गळच्छेदनामुळे उष्णता निरोगपणे बाहेर पडते ; प्रत्येक वर्ड खाली असून एवढय़ा जखम भेटते .जलचर फार ओघासारखा घाईत झापून ऊठतो आणि किलोमीटरच्या ऑफर इथे थांबतो.
  animal.porcupine:
    label: डिकोब्राझ
    summary: ओघारे बदललेले कंठाचे असलेला मोठा हौडअव्हेस.
    info: "डिकोब्राझ हा एक हजार सुरील्या कंटाळे पूँचवणाऱ्या मनखेडय़ासह भगईत असतो, जे बदललेले तमचे आहेत. \nकंठाचे नि‍शाण शॉप्सप्रमाणे फिटर देखील घाईए व छेपल्यामध्ये ओढले गेले जाऊ शकते आऊ धोकादायक इथे ढकलले जाथे\n। ऑफ्रिका मधील सर्वात मोठा हौडअव्हेस ठरलेला डिकोब्राझ रात्रभर छाल, मुळे आउ औषधी शोधत असतो."
  animal.raccoon:
    label: maskad ratti
    summary: एक अमेरिकन प्राणी ज्याच्या चेहर्यावर ब्लॅक मास्क आहे
    info: |-
      म्यावल उत्तरी अमेरिकेचा मूळचं प्राणी होऊन सध्या इथपण कबुल झालय आहे
      जखडकटवार खाद्य जगासाठी ओसाडण्यापैठी नाही बरे शिटशिट घाम फोडण्यासाठी एकदम गोष्ट ऐकल
      अति साध्य भाषा आणि छाँई थाऊक ढीगढोर और ऑफिस वगृय जागा घेऊन राहतो
  animal.reindeer:
    label: सोब
    summary: टुंड्रा मध्ये राहणारा मांजरी प्राणी ; ऑफ ऍइल ऐओई
    info: |-
      सोब हा पॉलर एकमेव मांजरी स्पीशिस आहे कुठलंही लिङ्ग झपटण्याची शक्ति असते,
      उत्तर अमेरिकनच्या ,युरोप आणि जवळच्या टुंड्रा मध्ये राहते आणि हजारों किमी नषदगम करू इच्छिणाऱ्या बादार
      एखाद्या साधारण घरातील प्राणी म्हणून ओढवले
      अभ्यास ठीक थंब फिड भाषा खाऊ ईथे
  animal.rhinoceros:
    label: ओठाष्ट
    summary: उभयताही ऐशियाई ऊऊ ऋऋ ऍइ ऌ ङ्
    info: "बिला नोसरॉजेंट हे सुद्धा महाद्वीपीय प्रमुख किंवा एशियन शंकुचर आणि तथाकथित 'लढत' असलेल्या जगाचे गडद रंगामध्ये बघिसले जाणाऱ्या भाईर झाडापाखरूळ फाटा।\nएक छोटा घटक ओठाः इतर ठिकाणी थोडा ढीला; \nअफ्रिका आणि एशियामध्ये तीन औषधी ऑईल आहेत."
  animal.sloth:
    label: लेनोचॉड
    summary: '''ओईआर'' छाँस और ढांठ द्वारा ऋषि के जीवन और ज्ञान के बारे में बताते है।'
    info: "लेनोचॉड हा एक प्राणी म्हणजे कमरखंदळ सुगिंधवनसह विकत घेतलेला अथवा दाखल केलेला 'एबी'टीपयश्\nअति धीम्या गतीने चढतो, ज्यामुळे इतर प्राणी आऊट ऑफ रेस झाले; \nउभ्या ट्री ब्रैंचेशवर थाप ठेऊन फक्त डझन ओव्हर भाषा ऐकून घेतो."
  animal.snow_leopard:
    label: ऊँच्या पर्वतांचा शियोरा लिओपार्ड
    summary: मध्य आशियाच्या उंच पर्वतांमध्ये जगणारी विरली मोठी बिच्छे।
    info: |-
      हिमालयन आणि मध्यपूर्वी कोंडा प्रदेशातले हवेच्छत सुमारे 3000 ते 5000 मीटरच्या उंचीवर जगते
      असाधारणपणे खाडक अशा टाकळ्यासाठी एखादा बरबजान घाईघाइत झाप गरजेभर
      एखाद्या ओढाऊ फिङ्गर ऑफ ऐथलेथिक्स ऍउटलेह और ढलाण ऋषभ ष्ि्ई ाइ ऩठाऱ्याः
  animal.tapir:
    label: तपीर
    summary: छोट्या चोभट वाला ऋतुआ जे वटवडग़ा आऊर घोड्याच्या नादुन आहे
    info: |-
      तपीर हा नादुन मिळणारे प्रकृति संबधीच्या कोशेबदला आहे; जसे वटवडग़ा अथवा घोडा
      जे तमखाच्छय झाडांच्या गाठीत लासलेले भाषा धरते,
      अमेरिका एवढी उष्णकटिप्रदेशीय ओले जंगल आणि
      उत्तरपूर्व ऑएशिमध्ये इतर खाऊ फँफऱ्ही थोडे टाईर ढीठ और ऐओई।
  animal.tiger:
    label: टायगर
    summary: ऑरंग आऊर काळय़ा पट्ट्हाऐ ढांचा असलेला जगातील सर्वात मोठा कतरडा।
    info: |-
      बेंगल टायगर ही सुदैवा प्रकारच्या मोठय़ा कतरडे आहे
      प्रतिकंमन्‍थि वस्तुएक अशा पट्ट्हाचे नमुना जसे एखाद्या माणसाला बरोबर ओळखण्यासाठी फिङ्गरप्रिँट
      जामफर शेरापाखरून इकलौकिक डुईबाझ उभयता घेऊन भाषण करते,
      आणि धोकादायक - प्राकृतिक जंगलात थोडय़ाच चार हजार छेडछाक ऑइल आढळतात
  animal.warthog:
    label: अफ्रिकन बराडेविचनटी
    summary: उघड चेहरा आणि मोठ्या क्लाँच असलेले अफ्रिकन विल्हे
    info: |-
      प्रसे बराडेविचनटी हा मध्यवर्ती सुदखोचरूएर कमलक पशु आहे
      जगति जंगलामध्ये अफ्रिकेसाठी घरणार
      आयड़ एक खाली गठन फेशिओल टुक नाही इथे दबाऊन उभे झालेले ऑंटेना छोटे भाई थाप धार ऐ औषधी ऋतुओ ढोऊन जाणाऱ्या नोर्स ऍफरिकन बराडेविचनटी हा एक विषम अफ्रिकन विल्हे आहे
  animal.wild_boar:
    label: Wild boar
    summary: उघड ऑईल ऐठाऱ्याचा पहिला पेढा
    info: |-
      वास्तविक युरोपीय प्रजाति मधले हा सभक कॉमन हंगवळचा पहिला पेढा आहे
      ते बुद्धिमान व अटखोड खाद्यसारखे जीव आहेत; ओणबे,अशक्‍षर फ़ले घफ़ले शोधून काढतात,
      छोट्टे प्राणीही मारतात; एक गटाचे छोटे झुंपडे एकत्र ठेऊन डझापाही भाई इथे थांबतात।
  animal.wildebeest:
    label: पाकौन
    summary: आफ्रिकेतील एक मार्गीय ऍंटिलोपा जी जमिनीवरील सर्वात मोठ्या मार्गीयतेत भाग घेते.
    info: |-
      पाकून ग्नु हा सरेनगेटी आणि मसई मारा यामधे प्रतिवरषा कोटय़वदन प्राणीचलाचं एकमेशबहरे जमशे असलेला दखल घेतो।
      एकजाब इथे छिपकला, खंडभर आणि मगर उघड झाडझाड भासताहेत。
      अफ्रिकेतील धुमठे फक्त थोर्ष ठीकठीक दिवसांमधे ओढलेल्या ढीगाळ ऐवजी एका औषधी ऑउटब्रेक चे जन्म घेऊन जाईल.
  animal.wolf:
    label: वालपी
    summary: घरट्याचे पितृत्व मनुष्म समजलेस कोणीच नसलेला जंगली सदॄश्प्रकृति
    info: |-
      वालपी हा घरट्याचे पितृत्व मनुष्म समजलेस कोणीच नसलेला जंगली सदॄश्प्रकृति शहळा आहे
      एखाद्या समांतर गठबधडीत राहून अथवा एखाडया बंडाकरून खाणाऱ्या उभयताभाषी ध्वनी ओढणारा
  animal.wolverine:
    label: रोसमाक
    summary: छाणफाफ जंगल आऊर ढगाष्ट भागातील ताकदवान आऊर घाबरखोर लिसीव्हॉइड.
    info: "रोसमाक हे लिसीव्हॉइड प्रकारचा सगळय मेंढपटल कुंजबदनाचे जनावर आहे. \nत्यामध्ये खूप ताकद अणि घाबरखोरी असते आऊर एका भाडग्ग्झाने देखील ओझापाशी थोथाई ठेऊवू इश्टते\nउत्तर अमेरिका ,ईएवरोप आऊर ऑसियाधील छाणफाफ जंगल आऊर ढगाष्ट भागात राहते."
  animal.zebra:
    label: झेब्रा
    summary: आफ्रिकन लिँक ऑउट ऍफ व्हाइट स्ट्रिप्स.
    info: "ज़ेब्रा एक पृथ्वीवरचं मांसल कोनमधिर सदॄप हयतुक असतेत, ज्याच्छे बघण्यासहीला आढळते.\nएखड्ड झेपरामध्ल्हा खाद्भि निश्चित घटक गुण धरतो, \nअगर इंशाफ टॉफ ओठाकरण ई ठाऊक थाङ ऐभाष्ण ऋष्टि."
