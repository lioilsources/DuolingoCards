title: वन्य प्राणी
cards:
  animal.elephant:
    label: शेडू
    summary: पृथ्वीवरील सर्वात मोठा स्थलीय प्राणी, ज्याच्या तोंडाला एक चांगला चोपडा आणि मोठ्या कान असतात.
    info: अफ्रिकन शेडू पृथ्वीवरील सर्वात मोठा स्थलीय प्राणी आहे. त्याचा चोपडा श्वास घेण्यासाठी, पाणी पिण्यासाठी, गंध ग्रहण करण्यासाठी आणि भोजन धरून घेण्यासाठी वापरला जातो. शेडू जमावात राहतात जे ज्यांच्या नियंत्रणाखाली आहेत त्यांच्या सर्वात जुन्या मादीच्या आणि त्यांच्या चांगल्या स्मृतीसाठी ओळखले जातात.
  animal.giraffe:
    label: जिराफ
    summary: जिराफ हे अत्यंत लांब गर्दर असलेले उच्चतम स्थलीय प्राणी आहे.
    info: जिराफ हे जगातील सर्वोच्च स्थलीय प्राणी आहे; पुरुष जिराफ चार ते पाच मीटर उंचीपर्यंत पोहोचू शकतात. त्याच्या लांब गर्दरमुळे ते अकाशिया झाडांच्या पानांपर्यंत पोहोचू शकते, जे त्याच्या मुख्य खाद्याचा स्त्रोत आहे.
  animal.lion:
    label: लेपर्द
    summary: अफ्रिकन सावनामधील एक मोठी बंदर जमातीची जनावरे आहे.
    info: लेपर्द हे अफ्रिकेतील सावनामध्ये राहणारे मोठे बंदर जमातीचे जनावर आहे. ते जमातींमध्ये राहतात, ज्यांना प्राइड म्हणतात; स्त्रिया एकत्र शिकार करतात, तर पुरुषांच्या लांब बालांचा वापर इतरांच्या भीती बसवण्यासाठी होतो. लेपर्दला अक्सर 'जंगलाचा राजा' म्हणून ओळखले जाते.
  animal.wolf:
    label: वाल
    summary: खालचा कुत्रा असणारा जंगली साबे प्राणी
    info: वाल हा सर्वात मोठा जंगली साबे प्राणी आहे आणि तो घरच्या कुत्र्याचा पूर्वज आहे. तो सामाजिक वर्गीकरणासह गटात राहून शिकार करतो आणि त्याचे संचारन झालेल्या क्षेत्राची नोंद आणि गटाला बोलावण्यासाठी होते.
  animal.zebra:
    label: जेब्रा
    summary: काळे-पांढरे रंगाचे डाग असलेले आफ्रिकन लिकोपोडियल जनावर
    info: जेब्रा हे एक आफ्रिकन लिकोपोडियल जनावर आहे जे घोड्यासारखे दिसते आणि त्याच्या काळे-पांढरे रंगाच्या डागांमुळे ओळखले जाते. प्रत्येक जेब्राच्या डागांचा नमुना विशिष्ट असतो, जो मानवी बोटाच्या छापील नमुन्यासारखा असतो आणि हे शिकारी गुंग करण्यास मदत करते जेव्हा ते गटात असतात.
