# animals-wild — tier 0 pilot deck (language-neutral spine).
# Display text lives in i18n/<lang>.yaml; images live in images/<style>/.
slug: animals-wild
version: 1
tier: 0
brief_attrs: [source_furry, "(feral:1.25)", quadrupedal, "(realistic animal anatomy:1.35)", "(detailed fur texture:1.3)", "(natural proportions:1.25)"]
styles:
  - pony-cartoon
default_style: pony-cartoon

cards:
  - key: animal.lion
    hint: the big cat (Panthera leo), not the star sign or sports team
    image: animal.lion.png
    brief:
      subject: lion
      attrs: [adult male, sitting, calm]
      setting: [savanna, grass, golden hour, warm light]
      avoid: [text, blood, humans]

  - key: animal.elephant
    hint: the African land mammal with a trunk
    image: animal.elephant.png
    brief:
      subject: African elephant
      attrs: [large, walking]
      setting: [savanna, acacia trees, open plain]
      avoid: [text, circus, chains]

  - key: animal.giraffe
    hint: tall long-necked savanna mammal
    image: animal.giraffe.png
    brief:
      subject: giraffe
      attrs: [standing, browsing leaves]
      setting: [savanna, acacia tree, blue sky]
      avoid: [text, fence]

  - key: animal.zebra
    hint: black-and-white striped horse-like mammal
    image: animal.zebra.png
    brief:
      subject: zebra
      attrs: [standing, grazing]
      setting: [grassy plain, outdoor]
      avoid: [text]

  - key: animal.wolf
    hint: wild canine (Canis lupus), not a dog
    image: animal.wolf.png
    brief:
      subject: grey wolf
      attrs: [standing, alert]
      setting: [snowy forest, pine trees, winter]
      avoid: [text, blood]
