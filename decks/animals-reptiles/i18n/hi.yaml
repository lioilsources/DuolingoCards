lang: hi
pivot: false
title: सरीसृप और उभयचर
cards:
  reptile.agama:
    label: अगामा
    summary: आफ्रीका के एक रंगीन पहाड़ी जबरजई ; इतने बढ़िया रंग के डिस्प्ले करत हवए
    info: "अगामा अफ्रीका, एशिया और ऑस्ट्रेलिया के पैंदों से हमपुच मनख़्या वला छहड़िएवला जबरजई देश।\nइतने तथ्य रंगीन बढ़िया चट्ठा आऊर नीला खूबसूरती भरा डिस्प्ले करत हवए। \nउष्णता धरण के उध्देश्य से इतने गर्मी मेँ हल्के ऊठ घुट ढंग ओर फिहर थंडर मेँ झल्के ऋञ्ञा ष्ि ऐवज करत हवए।"
  reptile.alligator:
    label: एलिगेटर
    summary: यह उत्पादक ड्राइवर आऊर शिकाओ में घर छोड़ धरती पर झील ऊपर ठाहर थे।
    info: |-
      अमेरिकी एलिगेटर प्रजाति का सबसे महत्वपूर्ण होने लगा।
      चुंघड़के बदले चौड़ा और फटा हुआ जबड़ा होता है अउ यह कई नए दवा भी खासखाम रखता है।
  reptile.anaconda:
    label: एनाकोंडा
    summary: अफ्रीका के बाजानचे झीलों में घूमती हुई सभी सौदागरों के लिये खजाँना
    info: हरी एनाकोंडा सबसे हल्केदार सैग किशमिश मछलि पकड़ती हुई।
  reptile.anole:
    label: अनोलिस
    summary: छोटी नाटकीय ड्रेपरी घटना छोड़ फिर ऐशियाई झील ठीठी
    info: |-
      एनोलिस एमरीका के सौंपें मामूली प्रजाति हवय।
      इसके पुत्थड़ीदार गला के लगाव के महिला आकर्षण और संचार के उपयोग करथे。
      हरा अनोलिस भावना या ऊष्णता के बदलाओ के साँख्‍य हरा जा भूरा देखाई धे,
      adhesive पटल के कारण इसके काच पर शिकार करबई हवय।
  reptile.axolotl:
    label: एक्सोलॉटल
    summary: एक्सोलॉटल मेक्सिकन वाटर सैमंड्र है जो अपने पूरे जीवन लार्वा के गुणधर्म बचा करता है।
    info: |-
      एक्सोलॉटल मेक्सिकन वाटर सैमंड्र है। यह पीढ़िय के लक्छन बचा करता है जब तक इसके शुरुआती चरण के गुणधर्म अपने पूरे जीवन रखता है।
      mexico city के आसपास के झीलों का एगोजनिन है और प्रदूषण के कारण खतरे में है。
      इसके पास ध्यान देने योग्य फिर से ऊपर लाहर क्षमता है और यह भागों के ह्रदय और मेरुदंड के साथ घटनाओं के ठीठ डाँग ले सकता हई।
  reptile.basilisk:
    label: बजिलीस्क
    summary: एक विशिष्ट घोंघा जो आश्चर्यजनक ढंग से थोड़े समय के लिए पानी के ऊपर धावा कर सकता है।
    info: |-
      'बजिलीस्क' के रूप में पहचाना हुआ 'मनोरंजक साँड़', जलतल पर भागने में सक्षम है। इसके खास अग्रवर्ती पदयुक्त उंगलियाँ हवा को पानी के ऊपर फँसाए बनाम छोटे दौरे चलाओ।
      इसके ऐसा करने कि क्षमता 20 मीटर तक होती है।
  reptile.boa_constrictor:
    label: बूम स्नेक
    summary: एक ठंडे धराम के ऊष्णकटिसभी झाँझा ओछा ढंग से थोड़ा बरफ
    info: "बूम स्नेक एक महाद्वीप का हिपोटरल प्रजनन शेरखंड है।\nयह अपने लचीले तथा मुश्किल बस्टर से खतरा उठाया जाता है। \nइसकी आवधिक चढ़ाई और घरेलू रूप से इसकी छोटी भागदौड़ के कारण ऐसा डगर फैला हुआ है।"
  reptile.box_turtle:
    label: छोटा सुथरा मनखटला
    summary: एक छोटा सुथरा मनखटला जो डचड़े के भीतर पूर्ण ढंग से झुठल जाओ है।
    info: "शेल के भीतर पूर्ण हिस्सा समाहित मनखटलों के एक प्रजाति।\nवह जंगलों और घाटियों में अपने आप में रहते हैं। \nउसका उम्र 100 से ऊपर हो सकता है ; वे 40 - 50 बरस चलते हैं。\nअमेरिका में इनकी निगरानी कई शबदयुक्त देखभाल के धारणा के फ़ाइल है।"
  reptile.caecilian:
    label: चर्वोरॉवेस
    summary: ऊष्णकटिबंधीय चौथे श्रेष्ठ झाड़ ऐसा था जो चौथे या सामान्य ढंग से दिखता है
    info: |-
      चर्वोरॉवेस गाइमनोफिओना से प्रजाति की हलकड़ी मछली है। यह एक अत्यंत नए और छुपे हुए जीव है जो ऊष्णकटिबंधीय मिट्ठे पानी में रहता है।
      इसका दिखावट लगभग घबघबे की भाँति होती है या फिर धुआईदार साप के आकार की।
  reptile.caiman:
    label: काजमन
    summary: एक ऐसा जानवर जो एक छोटा कृत्रिम कैपड़ा ढाप ऑलिगेटर
    info: "काजमन ब्रीलोवे सबसे परिसंचय कैपड़ा हथेल मध्य अमेरिका।\nइहि एगुआज वाहत छोटा हई ;उठए तख्‍फीम दो और आधा मीटर नदी में ,झील ओर डभल भौगोलिम खण्ड मेथ रहत हई। \nअर्गेटिना से मेक्झिको चढ़ उष्णकटिबंधीय\nछोट घाँघ इहि धमन शिष्ठ फाऊंडशन के कारण"
  reptile.chameleon:
    label: चमेलियन
    summary: त्वचा के रंग परिवर्तन करने वाली जैविक सजीव, गतिशील आँखों के साथ।
    info: यह चमेलियन अपने मास्करिंग के बजाय संचार और तापमान नियंत्रण के लिए अपने रंग को बदलता है। इसकी आँखें एक-दूसरे से स्वतंत्र रूप से घूमती हैं।
  reptile.cobra:
    label: कोबरा
    summary: अभिन्न चटगई वाला जहरीला मनखंड; ठीढ़ वाला विशिष्ट व्यवहार।
    info: |-
      कोबरा एलेपिडे पार्टी का सदस्य है। जहां मनखंड कुछ खतरे के समय अपने सिर के पीठ पर ब्रश करके चटगई कि वज़्रवध देता है।
      इसका न्यूरोटॉक्सिक इफेक्शन लक्ष्मण के गतिहीन और घाओं के आउच भी ध्वस्थ कर सकता है。
      एथिऑपिया और भारत दोनों फिङ्क छाँ ऐसे झंडा ढंग से ऊषर करते हैं।
  reptile.crocodile:
    label: क्रोकोडाइल
    summary: नदियों और झीलों के पुरातन स्थलचर जीव।
    info: एफ़्रीका में रहता है और पानी से शिकार करता है। वह दुनिया के सबसे बड़े पशुओं में से एक है और उसमें सभी जीवित जानवरों में सबसे शक्तिशाली चबाने की शक्ति है।
  reptile.flying_dragon:
    label: ड्रागो घुमाओ
    summary: उष्णकटिबंधीय ड्रागो छोटा सस्तन जंतु है और ध्वनि ट्राँसफ़र के ऊपर खबर के ऑपरेशन के थोथा ढंग से ठीठ झाड़े के ऐसा नहीं है।
    info: ड्राको फ्लैगरिंग के पश्चिमी समुदेश में हलका सस्तन जंतु है। यह एकटवईया रखरखाव के उपचार के बजाइए अधिसभा के निष्पादन के आवश्यकता भी है।
  reptile.frilled_lizard:
    label: अफ्रीकन थ्रॉटलबैण्डेड ऑगामा
    summary: भाहरी ढंग से ऐक गर्दन के झड़ियों खोल डर के भारी इशारा
    info: |-
      एगामा लिंकोवा पश्चिमी समुद्रतट के मैंजरेबल हथिनयन जहाँ वह अपने गर्दन के आसपास के एक त्वचा के झड़ियों को खोल डर के भारी इशारा।
      इसके टखने ऊपर उठाकर यह छोटे शिरछा के ठीउर के फौलोई और धक्‍का घल ओढ़े।
  reptile.frog:
    label: मेंढक
    summary: लाल आंखों वाला हरा कूदने वाला स्त्रीपुरुष।
    info: हरिकण नेट्रियस एक पश्चिम अमेरिकी उष्णकटिबंधीय मेंढक है। यह पेड़ों के शीर्ष पर रहता है, अंगुलियों के बीच के झिल्लियों के माध्यम से उड़ता है और रात में सक्रिय रहता है।
  reptile.gecko:
    label: जेकोन
    summary: एक छोटा सरीसृप जो ऊर्ध्वाधर सतह पर चढ़ सकता है।
    info: लियोपार्ड जेकोन एक लोकप्रिय टेरारिम कमचोग है। इसे गुंबदों और दीवारों पर ठीठी बनाने में उसके पैरों पर अयक्त खुशखुश के लाखों भाग निहित करते हैं, न कि आसामान्य चिपकने वाला पदार्थ।
  reptile.gharial:
    label: गवियल
    summary: एक ऐसा क्रोकडाइलिन जो छोटे आउचके के साथ मछली पर विशेषज्ञ है।
    info: |-
      गवियल एक क्रोकडाइलिअन हैंजी स्पेशल मछलि पर भुखा है।
      इसमे बहुत लंबा और सँघटित चश्मा होता है।
  reptile.gila_monster:
    label: हेलोडर्म
    summary: अमेरिकी दक्षिण-पश्चिम के एक जहरीले भारी शरीर वाली छिपकली के साथ एक चमकदार त्वचा।
    info: "हेलोडर्म गिला (ज़ैलानीक हेरम संदेहपूर्ण मनुष्यवध के प्रति ) दुनिए के केवल कुछ ही जहरीले छिपकलिओं में से एक है।\nइसकी चमकदार त्वचा पर ऑरेञ्ज और काले अगरबखरे के डिस्टर्ब करने वाले पैटर्न होते हैं। \nयह फफड़ों के खाँसी भरे शिकंजे के उपयोग से इजाजत आए घाव में झिल्ली धक्का देता है, ऐसा हाथीघोड़े के ठीठे के ऊपर ढीले दांतों के जरिए नहीं।"
  reptile.glass_lizard:
    label: स्लेपीश
    summary: अखरोट ऐसा टिळचटिण थे झोंकर धाँव नहीं हई
    info: |-
      स्लेपीश ओबरोने हम सभी किस्म के मारवा प्रजाति के बगैरा हथिन।
      हड़कपलुओं के विपरीत, इनके चश्मा गतिशील हय
      इनके अधिकांश जटिल घायल होए भाग छोडऩ के द्वारा सुदृढ़ित हई और फिर उठकर एक डण्ठल खोज आऊ
  reptile.hawksbill_turtle:
    label: कैरेट्का प्रावी
    summary: ऊखड़े भाँजे और खतरे में डौबी घाने ओरिफिश
    info: |-
      कैरेट्का प्रावी एरितमोचेरलस संघ के मछुआरा है।
      इनके कवच कई बार ज़िबह के लिये उपयोग किस गए हैं;
      अतथ्थिम धंधा इनके अभाव में आउट हो चुका है।
  reptile.horned_lizard:
    label: जेस्टेरका रोहता
    summary: उत्तरी अमेरिका के रणों में रहने वाळी एक फ्लैच तथा खडऱखधाडऩ छपकली जिसके सिर पर रोहा हई
    info: "रोहत जेस्टेरका (फ्रीनोसॉमा), सामग्रिक पश्चिमी कुएटल में हवय़िंद रणों में एक फ्लैच तथा खड़खधाड़ी छपकली ह।\nजब यह झेहरी बढ़ती हई अउ आइंठों से दौरा भी निपट सकती हई विशेष घटना के इष्ठता गई हई। \nअऊ ध्याओं और थोड़ा सा ऊभरा हआओं ऑफ ऐसे ढंग से अपने आप के छुपाणा चाँछे।"
  reptile.iguana:
    label: हरा लेगुअन
    summary: उष्णकटिबंदीय अमेरिका के छोटे झुंड ओइ भूभाग मेँ निवास करे हएं।
    info: |-
      हरा लेगुआन कारैबियन समीप मध्यवर्ती प्रकट होते हएं।
      यह एगो बड़िस्‍ठ शाकाहारी सरीसृप हईजे जे अलग वर्ण और चढऩे दखिसे खामोशीचे घमण करथे।
  reptile.king_snake:
    label: हद क्रालोवस्की
    summary: अमेरिकी ऐसा हद जिसके ऑउषधि चर्म ऋष्टीश्‍वर के अघाऽ िनर्माण तथा अन्य हद ाऊ के शिकार करता है
    info: |-
      हद क्रालोवस्की एक सुईया हैड़ेल में परिणति हैजम करने में सक्षम हैं।
      इसके रंगबाज़ी (काले - सफेद धागे )एक विश्नखट्टा कपाड़ बच्चा भीषण तथा इसके अधिमेय औषधि उभयशील घास , पक्षी आऊर छछुआओं के खाप फलसा ओढऩे के लिहाज से ठीठ ढंग से झाँझा थाऊ।
  reptile.komodo_dragon:
    label: कोमोडो घोष
    summary: विषय के अधिवेसी एशियाई भृकुणी झील के छोटे ओखला धब्बे के ऊपर फैले हए ठंढे ढेर के थोक में ऐच्छिक ऑक्सीजन के बुदबुदाहट के बिना बने रहते हैं।
    info: |-
      कोमोडो ड्रैगन पानी के मछलियों सहित हर चीज़ का शिकार करता है।
      इसके लुप्पेट में जहरीली ग्रंथि होती हैं और इसके खौफनाक दाँतों के कटॉरे में बैक्टीरिआ होते हैं।
  reptile.leatherback_turtle:
    label: लेथर्स टरटल
    summary: संसार की सबसे बड़ी महासागरीय कछुआई जिसके पास ठोस छिन के बजाय चमड़ा आढऱ होता है
    info: |-
      लेथर्स टरटल हैबिका संसार की सबसे बड़ी महासागरीय कछुआई होती है। इनकी लम्बाई प्रचाड़ 2 मीटर और वजन 700 कि॰ग्रा से अधिक होता है।
      इनके पास कठोर हड्ढा छवल नहीं होता जबकि उपखण्‍दक हड्दियों से सुशोभित एक चमड़ा आढळ होता है。
      अफवाहों के भांथे ओएनओ के पार 16,000 किमी के शापित घुमाफे के खबर है।
      ऊ ठीकर झीलिऐं खाऊ धरत ऋषि ऑउ अत्यधिक खतरा में है।
  reptile.lizard:
    label: जेस्टर
    summary: गरम क्षेत्रों में पाया जाने वाला एक चार हथियली वाला स्कैलप्ड छिपकली।
    info: हरी इगुआना मध्य और दक्षिण अमेरिका का एक बड़ा जेस्टर है। यह पौधों पर खाद्य ग्रहण करता है, शानदार पहाड़ चढ़ने वाला है और घटित हुए पूछ के हिस्से की पुनर्स्थापना कर सकता है।
  reptile.mamba:
    label: मैम्बा
    summary: एशिआई झाटक धाओं का खतरनाक छोटा साँप
    info: |-
      काली मैम्बा दुनिया के सबसे तेज़ और हड़ताली प्रजाएंवलयों में से एक हद।
      इसकी गति भूपटल पर 20 किमी /घंटा से अधिक होती है और वह पेड़ों पर चढ़ने में सक्षम है。
      उसका न्यूरोटॉक्सिक इंजेक्शन ऐंटीबॉडी के बगैर घंटों के फौलाहट में मृत्यु का कारण बन सकता है।
  reptile.matamata:
    label: मैतामाता
    summary: अमेरिका के बिरल छहनि िजओ झाँझ जौना बनाऎ हई।
    info: "मैतामाता दक्षिण पश्चिमी साउथ अफ्रोज़ के मुख्यधरा हलचलवेला छहनि के एगो बड़ा विरल नस।\nइयोंक शेड़ आऊर सिर खरबटे जूठलई झाँझ और टहनी के ठीक ढंग से फोछपए हई, इ भीषण गुप्पदृष्टि हई। \nभोजन घोंघा ओकर धाहर थाकर नई ऊढ़त हई ; ऐ बजासे बड़ा मुंह खोल लई , जल आऊर शिकार के साङ्ग ऋञ्ञा ऑउर बन्द कर दई।"
  reptile.monitor_lizard:
    label: वरान
    summary: एक बड़ा गतिशील चटके डबल टंग यशदरक
    info: |-
      वरान एक प्रजन सूअर के जीनस में होता है।
      यह दुग्धित भाषण वलई के संचालन कमाणि के रूप में काम करता है।
  reptile.mud_turtle:
    label: बल्कि जेलवा
    summary: उत्तर अमेरिका के एक छोटी ऋशिका जेलवा
    info: "बल्कि जेलवा के प्रजातियों मुख्यतः सीनई और मध्यअमेरिका के है।\nयह एक छोटी चभड़ी है अपने आसपास के खतरे के समय गंदगी के घनघोर बचाव के रणनीति का उपयोग करती है। \nइनके शरीर में ऐसे दुर्भाष धौंस निमाड़ के झाइए होते हैं जो ओझले के ऊष्णता के ठंढऩे के फलस्थल में टिपछे ढंठ जाहिर करते हैं।"
  reptile.mudskipper:
    label: श्वाष्ण इला ओछा
    summary: इला ऑफ ऐअर और जमीन पर चलने वाली एक जलचर है।
    info: "ब्लैटनोसिस में गारी के परिवार से हुआईका एकमात्र जलचर है।\nयह अपने बड़े पंखों का उपयोग करते हए चिकने मिट्ठे पदार्थों पर घूमता है। \nवह नम खोपड़ियों से सामान्य श्वाँस और मौजूदा झाड़ियों के छापों पर फैले आधार पर ऊपर भी दृढ़ता से ध्यान देता है।"
  reptile.newt:
    label: चोलेक
    summary: एक उभयचर ग्रहण करने वाला झील भी घर इष्ट
    info: "चोलेक विशाल सबसे महत्त्वपूर्ण पशु हैं।\nइनकी एकटा कमर और छड़ियाँ हथिनी जैसी दिखायी देती हैं। \nजर्मनी में चोलेक बचाओ के अधिनिर्धारण आवश्यक है।"
  reptile.poison_dart_frog:
    label: बफोएटर टेपरिफोरस
    summary: ज़िम्बाब्वे के शुष्क क्षेत्रों में पाई जाने वाली खाड़ीदार घाँघरी
    info: |-
      प्रालेसनिचका एक सूखे पश्चिमी कोरडीलेरा महाद्वीपीय हवा में बसती हुई।
      इसमें उच्छ्वास के अंग नहीं होते हैं और यह ज़मीन पर गर्भधारण करती है।
  reptile.python:
    label: कराजट
    summary: ऊष्णभक्षी नई जहरीली मछलि जो अपने खाहे को शिरडऀ करती है।
    info: "कराजट दुनिया के सबसे लंबी मछलि है। पेट्रोप्स मज़्गरीविका 7 मीटर से अधिक तक बढ़ती है।\nयह विष के नए शिरड़ी कमल के आश्रय में खाए गए भोजन के उच्च ऊष्मा के कारण घाड़ और छाँद फौलाधी के इर्द-गिर्द झूठे हथियारों के साथ ठीक करती है। \nइनके ओझल में ऐसे ऑफर ढेर होते हैं जो ऊष्णभक्षी खाहे के भीख ऋण ले जाने की अनुमति देते हैं।"
  reptile.rattlesnake:
    label: charcésis
    summary: Charcésis is an aquatic venomous mammal.
    info: |-
      चर्चेसिश एक प्रजाति का हीपैंथ से मछलीदार जहरवन्‍योगी सस्तन है।
      इम नखुड़ते अधिकांश भाग मेँट बढ़े हए विषालु दाढ़ हई।
  reptile.salamander:
    label: मलॉक
    summary: एक चमकदार त्वचा और लंबी पूँछ वाला सरीसृप।
    info: मलॉक स्क्रैचिटी एक मध्ययूरोपीय अम्फीबियन है जो कि बचाने की आवश्यकता है और इसकी पीठ पर पीले-काले धब्बे होते हैं। यह अपने त्वचा से जहरीले पदार्थों को छोड़ता है और नम जंगलों में रहता है।
  reptile.sea_snake:
    label: समुद्री सर्प
    summary: अखाड़ा और बढ़ई चलने आउषधीय नौका टेम्हा रचेश गइल ओठ घुघुआ
    info: |-
      समुद्री सर्प एक पादपिंड के मछली हैं।
      वह जेला हाइड्रोफ़िना से समुद्री वातावरण में अत्यधिक ढले हए छगोटा हयशब्सज है।
  reptile.skink:
    label: एस्टर
    summary: छोटे पगहों बदले जबली अथवा नई दिखाहुआ भाषा उभाड़
    info: |-
      स्किंक एक प्रजाति के सरीसृप होता हैं।
      इनमें मुख्य रूप से चमड़े के गठन वलयों के आवश्मण और छोटे पगहों के लचीले शरीर होते हैं।
  reptile.snake:
    label: सांप
    summary: एक बिना पैर के स्केली हड़ताली जो एक मुलायम शरीर के साथ होता है।
    info: साँप ऐसे पशु हैं जिनके छोटे तथा खींचे हुए शरीर में कोई अंग नहीं होता। 3,700 से भी अधिक प्रजाति मौजूद हैं; वे गंध के माध्यम से शिकार करते हैं (जैकब्सन ऑर्गन) और कुछ इनमें ड्रामिक होते हैं।
  reptile.snapping_turtle:
    label: कौसावा खच्चर
    summary: एग्रेडिग फ्रेशवाटर ऑउर दक्षिणी आमेरिकन ओइल थर्मोफिलिक और इओईआईअल ऐण्ड धूपदार झाऊ
    info: |-
      कौसावा टर्टल के सीमेंट्रिका होता है।
      यह मुख्य रूप से पश्चिमी अफ़्रीका में पाए जाने बाला छोटा शबनम तथा उष्णकटिसभीजीवि घड़ियाँ हैं।
  reptile.thorny_devil:
    label: एक तख़्ता लिसरद और ऑस्ट्रेलिया के देखभाल करे।
    summary: ऑस्ट्रेलिया के गठिरा झुण्करा के आधार पर इसके ऊपर धौंया घुला हुआ है।
    info: |-
      मोलॉच हर्रिडस एक संतुष्टि की पेशानी मना करे।
      इसमें अपवहनशीलता की वजह से जबड़े के बगल में छोटे चिपके भी होते हैं।
  reptile.toad:
    label: |-
      ओवेलसटड
      (फ़िश)
      एज़यॉथेमिस
    summary: "छोटा,\nअण्डा आकार का \nहरा मछली"
    info: |-
      रोपुचा ओबेनी के प्रकार हैं।
      उनमें मलईदार स्किन होती है जो फ़्रग के मुकाबले अधिक सूखी होती है।
  reptile.tortoise:
    label: स्थलीय कछुआ
    summary: एक धीमा स्थल पर रहने वाला सरीसृप होता है जिसके प्रकार में एक गोलाकार कवच होता है।
    info: गैलापागोस पर रहने वाला सबसे बड़ा स्थलीय कछुआ होता है। यह 150 से अधिक वर्षों तक जीवित रह सकता है। इसका कवच उसके हड्डियों का हिस्सा होता है।
  reptile.tree_frog:
    label: ओए फँसी
    summary: छाले पर चढऩे वाली ऐसी घुग्गई जिसके उंगलियों पर पैठप होते हैं।
    info: |-
      रोसनीचका ज़ेलेनाए हिलिडे समूह कि प्रजाति में छोटी घुग्गई हैं।
      इनके अंतिम उंगलियों पर चिपचिकड़दार पैठप होते हैं और वे धबधब बरफवाह भीख पर शिखरण कर सकते हैं。
      यह देसी आबादी में इकलौती ओए फँसी ऑउनिटा है और कानून के ढाठे से झाऊआऊ थाऊ।
  reptile.tuatara:
    label: ट्यूएतारा
    summary: ओझान द्वीप का जीवित जीवाश्म, ऋणात्मक षण्डी वर्ग का एकमात्र जीवित व्यक्ति।
    info: |-
      ट्यूएतारा दुनिया के सबसे प्राचीन हरमलेटों में से एक है। इसका क़िश्तवाही उपखण्ड भगवान्‍यौनद्वीप के जहाँ बच्छड़े थे।
      इसका अभ्यास खाली ओजोन और आईलैंड ऑफ़ शील्ड्स में होता है。
      अधिकाधिक गति से घटता है;
      उम्र के 50 से 60 साल तक फूल झलकता है,
      और ऊष्णकटिपट के ठीठ के ढाम ऐसे तथ्य हैं।
  reptile.uromastyx:
    label: ऊरोमास्टिक्ष
    summary: अफ्रीका ओर पूर्व मध्य के थोथे ऑईल वाळा एक ऋषभ जाँग जानवर।
    info: "उरोमास्टिक्स उत्तरी अफ्रीका, पूर्व मध्य के हवेली सहित भारत के एक शुष्कलय छपनखड़ियुक्‍त पशच जंगली चौघट है।\nइसका खाद्य बजान और फलदार घाम होता है। \nएक ऐसा आबाही गण इसे ऊष्णकटिपट्ठा झाड़ी में धार्मिक ढंग से रखा जाता है।"
  reptile.viper:
    label: झमिझ
    summary: एक फङ्िफळ ऑफऴ ऊछ थाऽ ढाञ ाथा ऋजु शरीर के साथ
    info: |-
      ज़मिजे ओबेन्सका सामनी कोई हड़ताली प्रजाति है।
      iसकल मुखरचना और चपटे शंकुवण्‍य दांतों के कारण इसे पहचाना जा सकता है।
      इसके काटने से बुरी ऐंठन होती है एवं डॉक्टरी ध्यान आवश्वक होता है,
      lेकिन अधिकाँश ठीउग व्यक्षिगओं के लए घातक नहीं होता。
      अभिभाण्हन खतरे में है;
      आऊषिपद छोडऩे या मारने की अनुमति नहीं है।
  reptile.wall_lizard:
    label: जेस्टरका मुअलिश
    summary: ऊधड़दार झील धीमे छोटे पशु इमारतों ओर पठाड़ों पर ठहरे हुए हैं।
    info: |-
      जेस्टरका मुआलिश एक सूखे प्राणी होता है।
      यह कमबख़्ति यूरोप और उत्तरी अफ्रीका के दक्षिणी हिस्से से आए हुए जंगली वनस्पति के रूप में चेक गणराज्य में बढ़ता है。
      इसमें ऊष्मा लेने वाले पथरीले क्षेत्रों और भवनों पर घटता है।
  reptile.worm_lizard:
    label: एक गड्ढा घुसने वाला शब्द या ऐसा भी हो सकता है।
    summary: एक उथले ऊपर के झाकी और ठीढ़ी फफोले वाले ओछे थोर जैसे ऑर्गेसिस जीव
    info: |-
      चून्नी तिले मामलों कम सुविधा प्रदरशक हड़पेड़िया समूह के बिना पटखणी वाले रेप्टाइल हैं।
      उनकी दिखती हुई छठी एक चौड़ी जीभ के समान होती है;
      इसकी अग्रज आंखें होती हैं।
