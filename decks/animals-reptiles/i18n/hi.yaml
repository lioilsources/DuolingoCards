lang: hi
pivot: false
title: मकौड़े और सांप
cards:
  reptile.chameleon:
    label: चमेलियन
    summary: त्वचा के रंग परिवर्तन करने वाली जैविक सजीव, गतिशील आँखों के साथ।
    info: यह चमेलियन अपने मास्करिंग के बजाय संचार और तापमान नियंत्रण के लिए अपने रंग को बदलता है। इसकी आँखें एक-दूसरे से स्वतंत्र रूप से घूमती हैं।
  reptile.crocodile:
    label: क्रोकोडाइल
    summary: नदियों और झीलों के पुरातन स्थलचर जीव।
    info: एफ़्रीका में रहता है और पानी से शिकार करता है। वह दुनिया के सबसे बड़े पशुओं में से एक है और उसमें सभी जीवित जानवरों में सबसे शक्तिशाली चबाने की शक्ति है।
  reptile.frog:
    label: मेंढक
    summary: लाल आंखों वाला हरा कूदने वाला स्त्रीपुरुष।
    info: हरिकण नेट्रियस एक पश्चिम अमेरिकी उष्णकटिबंधीय मेंढक है। यह पेड़ों के शीर्ष पर रहता है, अंगुलियों के बीच के झिल्लियों के माध्यम से उड़ता है और रात में सक्रिय रहता है।
  reptile.gecko:
    label: जेकोन
    summary: एक छोटा सरीसृप जो ऊर्ध्वाधर सतह पर चढ़ सकता है।
    info: लियोपार्ड जेकोन एक लोकप्रिय टेरारिम कमचोग है। इसे गुंबदों और दीवारों पर ठीठी बनाने में उसके पैरों पर अयक्त खुशखुश के लाखों भाग निहित करते हैं, न कि आसामान्य चिपकने वाला पदार्थ।
  reptile.lizard:
    label: जेस्टर
    summary: गरम क्षेत्रों में पाया जाने वाला एक चार हथियली वाला स्कैलप्ड छिपकली।
    info: हरी इगुआना मध्य और दक्षिण अमेरिका का एक बड़ा जेस्टर है। यह पौधों पर खाद्य ग्रहण करता है, शानदार पहाड़ चढ़ने वाला है और घटित हुए पूछ के हिस्से की पुनर्स्थापना कर सकता है।
  reptile.salamander:
    label: मलॉक
    summary: एक चमकदार त्वचा और लंबी पूँछ वाला सरीसृप।
    info: मलॉक स्क्रैचिटी एक मध्ययूरोपीय अम्फीबियन है जो कि बचाने की आवश्यकता है और इसकी पीठ पर पीले-काले धब्बे होते हैं। यह अपने त्वचा से जहरीले पदार्थों को छोड़ता है और नम जंगलों में रहता है।
  reptile.snake:
    label: सांप
    summary: एक बिना पैर के स्केली हड़ताली जो एक मुलायम शरीर के साथ होता है।
    info: साँप ऐसे पशु हैं जिनके छोटे तथा खींचे हुए शरीर में कोई अंग नहीं होता। 3,700 से भी अधिक प्रजाति मौजूद हैं; वे गंध के माध्यम से शिकार करते हैं (जैकब्सन ऑर्गन) और कुछ इनमें ड्रामिक होते हैं।
  reptile.tortoise:
    label: स्थलीय कछुआ
    summary: एक धीमा स्थल पर रहने वाला सरीसृप होता है जिसके प्रकार में एक गोलाकार कवच होता है।
    info: गैलापागोस पर रहने वाला सबसे बड़ा स्थलीय कछुआ होता है। यह 150 से अधिक वर्षों तक जीवित रह सकता है। इसका कवच उसके हड्डियों का हिस्सा होता है।
