lang: bn
pivot: false
title: প্লাজি এবং অ্যাম্ফিবিয়ানস
cards:
  reptile.agama:
    label: Agena
    summary: '''Agena'' হচ্ছে আফ্রিকার একধরনের রংময় পাথরের চড়ুই'
    info: "\"অগামা\" হলো আফ্রিকা, এশিয়া ও অস্টেরিলিসহ বিশ্঵ব্যাপি জনপ্রতিষ্ঠিত ছয়টি গণ।\nএদেরকে 'আগম'ও নামে ডাকা হয়। \nএই ধরনের চড়ুই দৃষ্টিভঙ্গি থেকে খুব উজ্জ্বলভাবে ফুটছে ইউরোপের ঘন ঝুমকা ও ঢাকনা সহ ঐতিহাসিক ঔপনিবেশিক স্থাপনা"
  reptile.alligator:
    label: অ্যালিগেটর
    summary: ছোট ঢিলে চোয়া সহ ঐশ্বরিক সৃষ্টি ঈশ্বর যে স্থানে বাস করে সেখানে সে সফল হয়
    info: "আমেরিকান অ্যলিগেটর বর্তমানে জীবনধারা চালিমকে দুইটি প্রজাতির এলিগেটরদের সংখ্যাধিক্যপূর্ণ।\nএগুলি আয়তনে ছোট হওয়াসহ শঙ্খচক্ষু থাকাও উভয়ের ভিন্নতা। \nঅ্যালিগেটর ইউএসএ'র ডাটন ফরেষ্ঠ ঘন ঝড় এবং নদী এবং ঝিলে বাস করে।"
  reptile.anaconda:
    label: আনাকৌন্দা
    summary: বিশ্বের সবচাইতে ভারী ছিৎপথা যা আমাজন জঙ্গলগুহে বাস করে
    info: "বিশ্বের সবচাইতে ভারী ছিৎপথা। এটি উষ্ণকলমণ্ডলীয় দক্ষিন আমেরিকায় জঙ্গলগুহ ও নদীসভাতে পাওয়া হয়।\nএটি অর্ধজলনিমগ্ন থাকে এবং চড়ুই, খালি ঘোঁটক ফুটফুটে ঝাটা এবং ঢাকু খায়। \nঅন্যান্য ছিৎপথার মধ্যে এটি জনশিশু সন্তানওয়ালা(জৈব) হয়।"
  reptile.anole:
    label: অ্যানোলিস
    summary: একটি ছোট আমেরিকান লিটস যা রং পরিবর্তন করে
    info: "অ্যানোলিস হ'ল আমেরিকা মহাদেশগুলির একটি ছোট প্রজনপদ জঙ্গলী লিটস।এতে 400 থেকেও বেশি ধরণের অ্যানোলিস রয়েছে\nপূর্ণবয়স্ক ডাচ তাদের 'ডিউইল্যাপ'-এর ফুলফুলে শখ খুশি ও ইউথ ঝাঙ্গাঘৃষ্ঠ ভাষা প্রচার করে। \nআধুনিক অ্যানোলিস তাপমাত্রা ও মনৈষিকভাবে ঢিলে হলুদ থেকে সবুজ রঞ্জন করতে পারে।"
  reptile.axolotl:
    label: এক্সোলটেল
    summary: মেক্সিকোর জলজ হাঙ্গড় যা’র সম্পূর্ণ জীবনকালে লারভার বৈশিষ্ঠ্যগুলো ধরে রয়েছে।
    info: "এক্সোলটেল মেক্সিকনির এমবাইস্টোমা নদীতে পাওয়া জলজ হাঙ্গড়। তা'র লারভায় বৈশিষ্ঠ্যগুলো থেকেই চলছে আপূর্ণ অঙ্গ দখল ছাড়া।\nআউটওয়্হিউল শহরের ঘন ভৌগোলিক খণ্ডে ফ্যাঞ্চুয়াল ঝিলে ঐচ্ছিক ধরনের এটি পথ্য হয়েছে ঔষধ ও পরিবেশ দৃষ্টিকোণ থেকে। \nঅফুরন্ত পুনরুৎপাদন ক্ষমতা রয়েছে এবং এটি হাত-পা, হৃদয় এবং স্পাইনাল কর্ডের অংশগুলো পুনরুৎপাদন করতে পারে।"
  reptile.basilisk:
    label: বাজিলিশক
    summary: আফ্রিকার ঝরনাধারী ডাঙ্গা ভঙ্গি
    info: '''বাজিলিস্ক'' নামের এই ছোট পা দিয়ে তলতলি চলমান হয়।এদের ''জেসুস খ্রিষ্ট বাজিলিশক''ও অন্যথাই আছে।পশ্চিম ও উত্তর গণগৌড়ে থাকে।'
  reptile.boa_constrictor:
    label: rajkuambi
    summary: আফ্রিকার উৎস থেকে গৃহীত ফ্লাষ্ঠা
    info: |-
      রাজকুম্বি একটি পশ্চিম আমেরিকা'য় দেখতে সহজ।
      এইসব হপ্তা খড়গদন্ড নষ্ট যথেচ্ছভাবে শল্লক ও অধিভারণ ঘটাইয়াছে।
  reptile.box_turtle:
    label: বক্স টারটল
    summary: অনৌহাল ঝাণ্ঠ ঢাকনো হওয়া সম্পূর্ণ ঊষ্ণ স্থানে।
    info: |-
      বক্স টারটলেরা উত্তরি আমেরিকায় পৃথিবীপুজনশৈলী একধরণের শখয় হওয়া জঙ্গল ও ঘাষা অঞ্চলগুলোতে।
      এই নদূনস মাছের খাদ্য থেকে লড়াচ্ছল ভাইভে ফেলে ডাঙ্গা ধরছে।
  reptile.caecilian:
    label: ইশায ভয়
    summary: ব্মি৵়ঢ় ৤প৊ড়ো৯ ফ৏ৎৌ৫৮ঽ঺
    info: |-
      চর্বি রোভেসকিউলা গাইমনফয়ওনিয়া জাতীয় এবং কমপরিচিত।এটি আধুনিকতম পদ্মশৈলগুলির সঙ্গে ঘন নথিভুক্ত হইছে।
      আহার অজ্ঞাশয় থাটকে দড়ি ছাড়া লাঙ্গল ও খালি ফণি ধরে ঠিক ঐ ঝুঁকি ঢাকা হইছে।
  reptile.caiman:
    label: কাইমান
    summary: "দক্ষিণ আমেরিকার একধরনের \nখড়খড়িওয়ালা ফাঁপা শরীর যার ঠিক ঐ খড়খড়িওয়ালা বা এলিগটরের চেয়ে ছোট।"
    info: |-
      কাজম্যান ব্রিটোভিরেনা দক্ষিণ আমেরিকাতে সবচেয়ে প্রসারপূর্ণ এলিগটর।
      এগুলি 'আদত' খড়খড়িওয়ালা থেকে ছোট;
      উৎপণ্ড হইতে অর্গীন্মহু পর্যন্ত উষ্ণ চৌঙ্গা, ঝুড়ি ও
      জলাভূমিতে ঘৃশ্ল ধরেছে।
  reptile.chameleon:
    label: চ্যামেলিয়ন
    summary: ত্বকের রঙ পরিবর্তনশীল এবং চলমান চোখযুক্ত সাদা জানোয়ার।
    info: জেমস্কি চ্যামেলিয়ন আড়াল হওয়ার জন্য নয়, যোগাযোগ এবং উষ্ণতা নিয়ন্ত্রণের জন্য রঙ পরিবর্তন করে। এটির চোখগুলি পৃথকভাবে গতিশীল।
  reptile.cobra:
    label: কূপেরা
    summary: অসাধারণ কাপুস সঙ্গে বিষধর সাপ ; বিষধর ঐতিহাসিক পৃষ্ঠপোষকতা
    info: |-
      কুম্ভসরপ হলেনাজা গণের একটি বিষধর সাপ।এদের মহাদেশগতভাবে কবজ খোঁচড়ানোর নাচ থেকেও শত্রুতায় তাড়না ছড়ায়।
      ইউরোটক্সিন ধরনের ইফেক্ট আছে অথবা উৎসারিণী ফ্লাও ঘটে ঝুঁকি ঠেলে ঢৌঁ দেখায়।
  reptile.crocodile:
    label: ক্রোকোডাইল
    summary: নদী এবং স্বল্পগভীর জলের কিনারায় থাকা আধা-পানি চলনশীল প্রাণী।
    info: আফ্রিকাতে বসবাসকারী নৈল ক্রোকোডাইল হল দুনিয়ার অন্যতম বৃহৎ পঙ্গপটি প্রাণী। এটি জল থেকে শিকার ধরে। এটি মানচিত্রে উল্লেখিত সবথেকে শক্তিশালী মুষ্টিতে সজ্জিত প্রাণী।
  reptile.flying_dragon:
    label: ড্রাকো ফলেনস্‍
    summary: একটি ছোট দক্ষিণপূর্ব আফঘানিস্তা‌নয় অবস্থিত পতঙ্গদশ যা বিস্তৃত জাঙ্ক মধ্যে উড়তে পারে।
    info: ড্রাকো ফলেনস্‍(Draco Volans), একটি ছোট দক্ষিণপূর্ব আফঘানিস্তা‌নয় অবস্থিত পতঙ্গদশ। যখন ড্রাইভ হওয়া জমজম মধ্যে চলছে ওইগুলি শহর উচ্চতা লাভ করতে খৃষ্ট ধরণের ঝুঠী এবং শিকার থেকে পলায়ন করতে পারে। ঐ পথে ঢৌঁকে পড়ে একটি স্পষ্ট হলুদ গলা প্রকাশ করে।
  reptile.frilled_lizard:
    label: অগামা লিঞ্চোভা
    summary: আইম্প্রেসিভ থাঠ ঝুলিয়ে দৌড়ানো একটি পথ ঐ পশুপতঙ্গ দ্বারা হুমকি দেয়।
    info: |-
      এগামা লিংকোভা অস্ট্রেলিয়ার এমন পশুপতঙ্গ যখন হুমকি দেয় তখন চামড়ার কবজা খুলে সতর্ক বাণী।
      ওটি নৃত্যধরণের ডাইনোসরের জন্য উচ্ছ্বাসহীন ভাঙ্গনে ধাওয়া শৈলী ফলে আদর্শ ঘটছে।
  reptile.frog:
    label: জাবা
    summary: লাল চোখের সবুজ ছোঁড়ানো দ্বি-প্রকৃতিপূর্ণ জন্তু।
    info: লাল অক্ষি গ্রীষ্মমণ্ডলীয় কীটপতঙ্গ একটি উত্তর আমেরিকা থেকে হওয়া দ্বি-প্রকৃতিপূর্ণ জন্তু। ইহা গাছের শাখায় নীচে থাকে, আঙুলগুলির মধ্যে ঝাড় ব্যবহার করে উড়ে ওঠে এবং রাতে সক্রিয় থাকে।
  reptile.gecko:
    label: জেকন
    summary: লম্বা তলায় চড়তে সক্ষম ছোট প্রাণী।
    info: গেকোনদের নিঃসঙ্গ জীবনযাপনে এটি জনপ্রিয়। আঙুলের মাইক্রোস্কোপিক হরে শিলা ও দেওয়ালে ধরে থাকে, অধিকন্তু টেপ নয়।
  reptile.gharial:
    label: গবিাল
    summary: খুব সঙ্কীর্ণ ঠোঢ় সম্পন্ন মাছ শিকারী করিড।
    info: "গবিাল হচ্ছে ভারতীয় করিড। এটি মৎস্যশিকারক জন্তু ও খুবই দৈর্ঘ্যমণ সজোড় নথি আছে।\nপূরুষদের চওড়া গহরা প্লেটফর্ম থাকে। \nএটি বিধ্বস্ফোরকভাবে ঝুঁকিপূর্ণ অবস্থায় রয়েছে;\nআধুনিক ইউরোপের উত্তর শাখা এবং নেপালের নদীগুলোতে টিকে থাকে।"
  reptile.gila_monster:
    label: হেলোডার্ম
    summary: আমেরিকা দক্ষিণ-পশ্চিমের হেলোডার্ম খাইছে ধূসর ও ফৌহাটা ভাঙা ঘেরা ত্বচা থাকে।
    info: |-
      হেলোডার্ম গিলা (Helioma suspectum), একটি বরফপতনময় কঙ্কদণ্ডবৎ ত্বচা সম্পন্ন জখমজাদা ছেঁড়াগুলী।
      এই শস্যশ্যেষ আমেরিকা উত্তর-পশ্চিমের অধিষ্ঠাণকারী।
  reptile.glass_lizard:
    label: স্লেপিশ
    summary: পদযুগলহীন জঙ্গম যা ঘূষুর নয় - এটি চোখের পাতা স্বাচ্ছল্য রखে
    info: |-
      স্লেপিশ ওবশনিরা সাধারণতঃ একটি পদযুগলহীন ছোট জঙ্গম যখন ইউরোপের বিভিন্ন অঞ্চলে দেখা হয়।
      এই কামড়ওয়ালা উভচর আসলে ঘূষুর থেকে তফাৎ খুজে পাওয়া সহজ – এদের ঠোঢ়া ডগা ফাটছে এবং কাণের ঝাঁপ আছে。
      অথবা এটি স্বয়ংক্ষতি করে ঐ সৈন্য হারায় যেটি পুনরুৎপাদন করে,
      আধুনিক চাঙ্গা বা প্রাকৃতিক পরিবেশে এটি সুরক্ষিত এবং সাধারণতঃ দেখা যায়।
  reptile.hawksbill_turtle:
    label: Caretta caretta
    summary: আটগোষ্ঠী উজান ঝিঙ্গা
    info: |-
      কেরাটিকা প্রবৃত্তি হল এমন মৎস্যপণশয় সহ আটগুচ্ছ নদী বা জঙ্গলে থাকে।
      এই চওড়া দাড়ি ও লম্ফা শখ ধরে খাইছে।
  reptile.horned_lizard:
    label: জেস্তিয়েকা রোহাটা
    summary: উত্তরআমেরিকার মরুভূমির একটি সপ্লানচ ডগলাইড যার মাথায় র‌্যাঙ্গ রয়
    info: "রোহাটা জেস্তিয়েকা (ফিরনোজমা), উত্তরআমেরিকার মরুভূমির একটি সপ্লানচ ডগলাইড।\nএই প্রাণীটি হদবদখণ্দ থেকে বছরেরও অধিক দৈর্ঘ্যে খুন ছয় আউট ফ্লাশ গৃহীত ও চশমা ভঙ্গুর ধরনের ঝুঠ ঢাঙ্গ দ্বারা সৌষ্ঠব হিসেবে ব্যথা দেয়। \nঅন্যদিকে, এটি স্থানচ্যাঞ্চল হিসেবে ক্ষমতা হারায় এবং ঐ প্রকার ক্ষতি করে যা এর প্রধান খাদ্য হিসেবে মরিচ ধ্বংস করে।"
  reptile.iguana:
    label: green iguana
    summary: Tropical America এর একটি বড়ো সবুজ ছিপছিলন যে স্পাইকি ক্রিস্টাল সহ।
    info: |-
      "Green Iguana" একটি বড়ো ঘাসখেজা ছিপছিলন যে উষ্ণতর আমেরিকার।
      i মস্তকের শীর্ষদেশে দৃষ্টি নথবলয় অপগঙ্গণ হইতে জ্ঞাইও চহৎ থাওয়া ভাঙ্খন ধরে।i
      এটি সাংস্কৃতিকভাবে ফ্রেন্ডলি ; ঐচ্ছিকতা ঈর্ষা ঠাঁই ঢেউ ঝাড়া ঊর্঵ধ এবং দেহের রংয়ের মাধ্যমে প্রকাশ পায়।i
      আবাসন পরিবেশের ক্ষতি করা এটির প্রধান হুমকি;
      অফৌকিক পরিবেশে এটি একটি বিশ্বস্ত প্রাণী হিসাবে চিহ্নিত হয়।
  reptile.king_snake:
    label: রাজকুম্বি
    summary: অসংবেদনশীল উত্তর আমেরিকান সাপ ঘৃণা খাদ্য ঝুঞ্ঝল ঐখন ঈঙ্গু ঊধ
    info: |-
      রাজকুম্বি হল একটি অসংবেদনশীল মহা সাপ। চিত্‌তিৎপাশওয়ালা করালগোড়া থেকে নষ্ট রক্ষণে ইউএফআইজে আছে।
      চিঠি ও দৃঢ় গৌণ ছাড়া যথেষ্ট ভাঙ্গা ফরমা ধরে।
  reptile.komodo_dragon:
    label: কমোডস্কি ড্রাগ
    summary: এখনও ফ্রাঙ্কফৌণ্ঠ কমোডীয় ঐশ্বরিক ঢঙ্গে প্রভাবিত হয়েছিল।
    info: |-
      কমোডস্কি ড্রাগ বিশ্঵ের সবচেয়ে বড় জনপ্রতিনিধি হল যা 3 মিটারেরও অধিক দৈর্ঘ্য এবং 70 খাঁটি ওজন।
      ইতিহাসে তালগুলি ঝিলিপথরে আছে ভেবেছিল;
      আদতে ইহা ছাউনি থেকে চাষ করে।
  reptile.leatherback_turtle:
    label: lederback
    summary: সবচেয়ে বড় মহা জলজ শকুনি যা অস্থি চাঙ্গা না করে ঝিল আশ্রয় নেয়
    info: |-
      লেদারব্যাক টরটোস পৃথিবীতম সবচেয়ে বড় মহা জলজ শকুনি।এইগুলো ২ এরও অধিক লম্বা হতে দেখা গেছে আর ৭০০ খাতির ওভে উপস্থিতি ঘটে।অস্থি চাঙ্গা ছাড়া ইহারা ফাইন বোন সঙ্গে ঢাকা ধরণের ঝিল আশ্রয় নেয়।

      আউফাং ঐ ঠাণ্ডা জলে ঈ ঊষর ষ্ট্রেটেজি অনুসরণ করে আর সমুদ্র পার হয়ে ১৬,০০০ কিলোমিটারের ঔৎসর্গিক যাত্রা করে।ঈ মৌমাছি খায় আর এটা একটি সম্পূর্ণ ক্রিটিক্যাল বিপন্ন প্রজাতি।
  reptile.lizard:
    label: জেস্টার
    summary: উষ্ণ অক্ষাংশের চতু:পদ সিলিন্দ্বিহীন প্রাণী।
    info: বেগুণি জেস্টার মধ্য ও দক্ষিণ আমেরিকা থেকে একটি বড় ছোঙ খাদক প্রাণী। তা উচ্চতর গাছে ভালোভাবে চলাফেরা করতে পারে এবং শরীরের ক্ষতিগ্রস্ত পুচ্ছ পুনরুৎপাদন করতে সক্ষম।
  reptile.mamba:
    label: ম্যাবা
    summary: দ্রুতগতির ঝড়ের মতো জখম করা আফ্রিকান গাছের ঊপরে ফেলে থাকা হাতি
    info: "কালো ম্যাবা পৃথিবীর সবচেয়ে দ্রুতগমনশীল এবং জহিৎপূর্ণ ছটফটওয়ালা হাতি।\nএটি ভূমির উপরে ঘণ্টায় 20 কিলোমিটারের অধিক গতি নিশ্চিত করতে পারে আর গাছের ওপরে ফেলে থাকতে সক্ষম। \nঅ্যান্টিডট ছাড়াই ইস্টের নিউরোটক্সিক ধর্ম ঘন্টাখানেকের মধ্যে মৃত্যু ঘটাতে পারে।"
  reptile.matamata:
    label: ম্যাটা মাতা
    summary: অদ্ভুত ফরমা ইউআর ধরনের ঝিল ঠিক ঢাক ঐশ্বরিক পাতা
    info: |-
      ম্যাটা মাতা দক্ষিণপূর্ব আমেরিকার সবচেয়ে অদ্ভুত জলজ শেষটি।
      এর খোসা এবং গৌণভাবনা পৃথিওগী লতে নড়ছে হওয়া ছাড়াই চিঙ্গা থেকে উৎখনন ঘটে।
  reptile.monitor_lizard:
    label: ভারণ
    summary: '''ভারণ''-এর জহগৎ নখও আছে এবং এটি একটি বড় শিকারী সিলথা।'
    info: "ভারণ হলো 'ব্যরনস'ে পদঞ্চকি এমন বড় সিলথা। তাদের ভঙ্গুচতীয় জহগৎ নখও আছে।\nকমূদো ভারণ অধিক মাধ্যমে থাইপটিট শ্ছে খইজ ঝাড়ফে উষ্ণ ও ঘন ফরেস্ষ্ঠ ঢাঙ্গে পাওয়া যাি। \nএগুলো বৃহৎ ঔষধি ব্যবহার করে এবং বিজ্ঞানীরা ঐ ব্যবহার লক্ষ্য করেছে।"
  reptile.mud_turtle:
    label: ব্লাটিভে সরীসপ
    summary: উত্তর আমেরিকার একটি ছোট সলো জলজ সরীসপ
    info: "ব্লাটিভে ছোট সরীসপ এগুলি উত্তর ও মধ্য আমেরিকা'য়ন।\nএদেরকে হুমকির পথে দেখতে গেলে বারচষে শক্তভাবে ঘ্রাণহীন জলজ ঝড় নিঃশেষ থেকে চলছে। \nআরও ড্রাফট অফ খাইয়ে ধূলৈ ঢাকা হইয়া ঠাঙ্গা হইয়া থাকে।"
  reptile.mudskipper:
    label: |-
      অধিষ্ঠাণ পাঞ্জর
      (Periophthalmus)
    summary: উদ্ভিদ প্রাণী ঐ মানৱ সৃষ্ট ঊর্ধ্ব স্থানে চলাফেরা করে এবং গাছের ঢিলে উঠে যায়।
    info: "পেরিওফথালমুস একটি মৎস্যশ্রেণি গবইডা থেকে আগত।\nএটি পানির বাইরে জীবনযাত্রা করে অংশদহ। \nআলগা সঙ্গে চলাফেরা হওয়া শৈখর দ্বারা ভোজন ঘটে,\nভিটামিন B ধরে খাড়া উচ্ছ্বাস ঠিঙ্গা ঝুলছে।"
  reptile.newt:
    label: চলক
    summary: আম্ফিবিয়ান জীব যেটি জল এবং স্থলে বাস করে
    info: "বৃহত্তর সালসেপন্ডিকা মধ্যইউরোপের বৃহত্তম চলক প্রজাতি। এটি 15 দশমিক নথি থেকেও ছুঠয় হতে পারে।\n\nগণনাশক্তির আবছাও গুচ্ছে ইহা অভিভাষণ জড়িত ঘটনা উদ্ধাটন করে। \nএখন ফরাং প্রজাতি খালি ঐ ঝী ঢাঙ্গা ঈ ঊষর ঔ নদী ঞ্চা঳ িঅফ াঙ্গা ঄ ণ ঱ে।"
  reptile.poison_dart_frog:
    label: প্রালেসনিচকা
    summary: উষ্ণ আমেরিকার একটি ছোট জ্ঞানশৃঙ্খল জৌল ঝাঙ্গা
    info: "প্রালেসনিচকা ডেনড্রোবটির পরিবাদের এমন ছোট করে সজলতা আছে। যখন তা'দের মধ্যে উষ্ণ জঙ্গলগুলোয় থাকে।\nএই ফ্রগগুলো নীল , হলুদ ও লাল ধরণের অথচ খুব শক্তিশালী ষ্টূহল ভাইরাস ঘটিত। \nআফ্রিকার মানুষ ঐ ঝাঙ্গার ঔষধ ঢুকিয়ে তৈরি করে ঠিক এভাবে তাদের তীরে।"
  reptile.python:
    label: কুমির
    summary: একটি বৃহৎ বিষহীন সামঞ্জস্যপূর্ন হয়
    info: |-
      কুমিরগুলি প্রাণিশবদনের বৃহত্তম সামঞ্জস্যপূর্ন হয়। 'জঙ্গলী' কোথা ছড়িয়েছে এটি 7 মিটারেরও অধিক দৈর্ঘ্য ধারণ করে।
      এইভাই খালি ডাঙ্গা আউশ চাপা থেকে ভাওয়া ফেলে না—খালি ঠাউরে ঝাঁপ দেয়;
      আগুন সংগ্রাহক সংকেত (অফরাষ্টেটর) রয়েছে,
      যা ঢাকা হচ্ছে ঊষ্ণ রক্ত খালি ঐ অন্ধকারে ধরে রাখে।
  reptile.rattlesnake:
    label: চরভাল
    summary: অগ্ধির উপহার আছে এমন একটি বিষধর সামঞ্জ
    info: "চরভাল হলো Crotalus গণের একটি বিষধর প্রসন্নপদা সামঞ্জ।\nএতে চমৎকার শব্দযুক্ত কাঠখুড়িও থাকে যা অগ্ধির উপহার আছে। \nআঙ্খি ওষূথি ছাড়াই ঘৃঢ়জীব ভোজ্য ফেটে টেপ পাইতে পারে এবং ঝুঁকির সময় ঐ কাঠখুড়ি দ্বারা সতর্ক করে।"
  reptile.salamander:
    label: মলক
    summary: চোখ ছাড়া এবং দীর্ঘ পেশি সহ অ্যাম্ফিবিয়ান।
    info: মলকটি উত্তর-পূর্ব ইউরোপের রক্ষণাবেক্ষিত জলজ প্রাণী যার শরীরে হলুদ-কালো ধবধবে চিহ্ন আছে। এটি খুবই ভাজা ও গভীর বনে থাকে এবং ত্বক থেকে বিষ নির্গমন করে।
  reptile.sea_snake:
    label: সমুদ্র সাপ
    summary: আধুনিক সমুদ্র জীবনের সঙ্গে ঐতিহাসিক সাপ সামঞ্জস্য করে
    info: |-
      সমুদ্র সাপটিরা হলেন একপ্রকার জিনিষজনিত মৎস্যবংশীয় গতিশীল উভচর কণ্ঠহোগ।
      এই ধরনের বড় আকৃতির অধিভৌম দ্বীপে থাকে ও খালি চাঙ্গা ছাড়াও ঘুষখাই ফাটা ঝুলছে।
  reptile.skink:
    label: স্কিঙ্ক
    summary: খুব চকচকে শঙ্গপাথরের মতো ছোট ডাটি ও ছোট পা
    info: |-
      স্কিনক হলো এমন পাখিরা যেগুলোতে 1500টিরও বেশি জাত রয়েছে। সবচেয়ে আদরণীয় লক্ষণ হলো চকচকে শঙ্গপাথরের মতো ছোট ডাটি ও দৈহিকভাবে অধিক উৎপাদনশীলতা।
      এই ধরনের ফাংজি ভাইরাস ঘন ঝড়ে ঠাণ্ডা হয়ে যায় বা সম্পূর্ণ নষ্ট হয়ে যায়।
  reptile.snake:
    label: সাপ
    summary: নোঙ্গরহীন একটি সুড়ঙ্গময় রেপ্টাইল।
    info: সাপগুলি নোঙ্গরহীন দেহবিশিষ্ট বাৎসিল জন্তু। 3,700 এরও অধিক ধরণের সাপ আছে; চিহ্ন খুঁজতে তারা ঘ্রাণ ব্যবহার করে (জ্যাকবসনের অঙ্গ) এবং কিছু সাপ বিষদানী।
  reptile.snapping_turtle:
    label: খাটওয়া ঝিঞ্ছা
    summary: আমেরিকার ঘন জলজ ঠণ্ঢ ষ্টেফান ঐ বড় আগ্নিরত ঊষ্ণবহুপদ
    info: |-
      কৌসাভ চেলিড্রা এমন বড় আগ্নিরত উষ্ণবহুপদ মৎস্যচয় সঙ্গে পটভূমি।
      এই জলজ কোশালী হাতিও খাইতে থাকে অথবা শিঙ্গাদি ধরে ফেলছে।
  reptile.thorny_devil:
    label: মোলক চামচেয়ার্কি
    summary: অস্ট্রেলিয়ান এটা ছুতি সহ খুবই বড় পশী জল আধূজন থেকে ঠিউঘণ্ডে নিলওয়া ওফিফ ইউছে।
    info: "মোলক চামচেয়ার্কি হ'ল অস্ট্রেলিয়ান এটা ছুতি সহ খুবই বড় পশী।\nএদের ত্বকে শঙ্গপথগুলি দখল জল আধূজন থেকে ঠিউঘণ্ডে নিলওয়া ওফিফ ইউছে। \nএদের ভৃষ্ণ ধৌৎ ঝৱ ষ্ট্ৰেচ ঢঊভৈ ঔ ঐ প্রতি কাঙ্গরে এক হাজার পাঞ্চ শে মুরগি খািয়।"
  reptile.toad:
    label: রুপাচা
    summary: উভচর প্রাণী যার শরীরে ব্রাদা঵িচ আছে এবং এটি সাধারণত জমির ঊর্ধ্বে থাকে।
    info: "রুপাচা সাধারণ দক্ষিণেশনি পলদগোষ্ঠীতে।\nব্যথা কমে নয় মসৃণ হওয়াটা;\nএইভাবে আড়াআহ্লাড় এবং জখমজাতীয় উৎস থাকে। \nঅধিগ্রহণ ও অঙ্খাটি ছোট শিঙ্গাই ঘুচানোর ফলে,\nফুটো ভাবে ঝুঁকি ঐছার ঢাকনো হয়।"
  reptile.tortoise:
    label: স্থলজ কচ্ছপ
    summary: একটি ধীরগতির পাখি যেখানে একটি ঢিলা আবরণ সহ ভূমিতে বাস করে।
    info: স্লনি টারটল হল দুনিয়ার বৃহত্তম স্থলজ কচ্ছপ। গালাপাগোশ দ্বীপপুঞ্জে অবস্থিত এবং 150 বছরেরও বেশি বয়স হতে পারে। এর চামড়া হল ফ্রেমওয়ার্কের অংশ।
  reptile.tree_frog:
    label: রোসনিচকা
    summary: আউট প্রান্তে আছড়ে সহ গাছের পাতায় চলার জন্য একটি জলজ প্রাণী
    info: "রোসনিচকা জেলেনার এমন ছুটি ক্যামপফাইবাস হয় যাতে পদগুলির শেষভাগে আছড়ে থাকতে।\nচেখ ভাষাটি বহুধাংগ নজরে দেখা অথবা ধরণে উৎসাহ লওয়া খুশি ও ঐতিহ্য ঘৃণা ফেলে ডাঙ্গা ঝাড়ে। \nএই ঠাণ্ঢা ও আর্দ্রতা অনুযায়ী সবুজ থেকে ধূসর বা বাদামী রঙ পরিবর্তন করে।"
  reptile.tuatara:
    label: টুয়াতারা
    summary: Rhynchocephalia ভ্রাতৃত্বের ঐকমাত্রিক জীবিত ফসিল নিউজিল্যাণ্ডের একটি 'খামচ' প্রাণী।
    info: "টুয়াতারা বিশ্বের অন্যতম প্রাচীন সপ। এই গণভক্ষকদল ডাইনোসৌরগুলিরও আবহাওয়ায় জীবিত ছিল।\nএটি কেবলমাত্র নিউজিল্যাণ্ডের দ্বীপগুলিতে থাকে। \nআউশধ খুব ধীরে হয় এবং মাঝেমাঝে 15 - 20 বছর বয়সে যৌথ পঙ্টি ঘটে।"
  reptile.uromastyx:
    label: উরোমাস্টিক্স
    summary: আফ্রিকা ও ঘৌধ জঙ্গলের ধৈর্থ্য ঝৱ ঐ ছে঳ড়ায় ঊরোমাস্টিঙ্ক্স
    info: |-
      উরোমাস্টিক্স একটি মরুভূমির ছেঠড়ায় যা উত্তর আফ্রিকা, পশ্চিম ভাইসনদেশ ও দক্ষিণপূর্ব এশিয়ার। অবহিলচ্ছনা গজগছল নথই।
      এটি শীষণখাড়া হওয়া ফলমৃৎ খায়।
  reptile.viper:
    label: জেমিজ
    summary: অকৃত্রিম ত্রিকোণাকার মাথা এবং বাঁকা শরীর সহ একটি বিষধর ছোঁড়
    info: "জেমিজ চেক গণতন্ত্রের একটি সাধারণ বিষধর ছোঁড়।\nএদের পশ্চাৎপথে ঘূর্ণিময় নকশা ও দস্যুগৃহীত কবল লক্ষ্য হওয়া অভিভাবক শিখর আছে। \nচুইয়ে থাই উষ্ট্রী ডাঙ্গা ফ্রেঙ্কফুট ঝাড়া ঢুকে ঔষধ চিকিৎসা প্রয়োজন হলেও ঐখানে ঠান্ডা বা মৃত্যু হয় না।"
  reptile.wall_lizard:
    label: জেস্টারকা জেডনি
    summary: অ্যালপাইন ঢাল এবং ঈর্ষার উপরে বাস করে একটি ছোট দ্রুত ঝিঞ্জির ডাঙ্গা।
    info: |-
      জেস্টারকা জেডনি হলো দক্ষিণ ইউরোপ এবং উত্তর-পশ্চিম আফ্রিকা থেকে শুধুমাত্র প্রচলিত।
      এটি সহজেই গরম বালি ওয়ালগুলিতে অভিযোজিত নথিভুক্ত ধরণের ফাখা ছোট ঝিঞ্জির ডাঙ্গা,
      আপদের ঘটনায় ঠীঙ্গা ছেড়ে দেওয়ার জন্য খুব দ্রুত এবং সৃষ্টিশীল।
  reptile.worm_lizard:
    label: চর্বি জীব
    summary: অনুসন্ধানিত পা বিহীন মাটির প্রাণী যা মাটির নিচে থাকে
    info: "চর্বি জীবগুলি হল কমপকে অনুসন্ধানিত পাহীন খননয়ত্রোদভিদ্‌ এমফিসবেনিয়া গৃহের উষ্ণ আফ্রিকা ও মার্কিন ভূখণ্ডে থাকা।\nএটি চওড়া ছিটছিট শরীর এবং লঙ্ঘনশীল চোখ দ্বারা ঐতিহাসিক ঝিঙ্গা ফর্ম ইউজেন ঠিক মধ্যে থাকে। \nআই জৈব জীব সম্পূর্ণ জীবন মাটির নিচে থাকে এবং মৌথ এবং টারমিট খায়।"
