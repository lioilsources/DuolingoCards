lang: sa
pivot: false
title: माशका अर्थवलयीन
cards:
  reptile.agama:
    label: अगमा
    summary: आफ्रीका के चमकीली गुफा छछुनऊ
    info: |-
      अगमा अफ्रीका, पूर्वोत्तर एशियाई के सहस्रपदि में हज़ारों प्रजन जलयुक्त।
      एगमा लड़खटवान् रंगबिरंगी शीघ्रचलिका द्वारा आधिपत्य बढ़ाई।
  reptile.alligator:
    label: एलिजटर
    summary: यह विशाल क्रोकोडाइलियन उत्पत्ति से ओशन घर आऊर चीन में ठहरता हई।
    info: |-
      अमेरिकी एलिगेटर सजीव प्रजाति का है।
      चुन्नी महसूरों से अपने चौड़े और बदबखत छकछक के कारण भेद होता है।
  reptile.anaconda:
    label: आनाकोण्डा
    summary: अमेज़न बाढ़मन मन घटिए वाला आफ्गाह धरि
    info: अनाकोंडा मरीनस दुनिया के सबलूप हयेल्स प्रजाति हवए। इहकरीमत भगईचउँ नदिमन अऊ झीलमन मन रहइथे।
  reptile.anole:
    label: "\tअनोलिस"
    summary: "अमेरिका की इछ धुआळु घरेलू ओशन फिश ई ऊधर ढंग से \tभिन्न रंग बदल सकथे"
    info: |-
      अनोलिस अमेरिका की सूक्ष्म् प्राणि हवेल महत्वपूर्ण जंगली चट्टानचुड़ीया।
      इसमें 400 से भी बढ़कर प्रजातियाँ हई。
      एउदुओं के गले में एख रंगबिरंगा झौंठ हई,
      jise पुरुष आऊर मादा के खबर और शब्द छेडऩ के उपयोग करथे।
  reptile.axolotl:
    label: अक्सोलॉट
    summary: मेडळकोन देह के इजि घनघोर पानी के सरपेण्ड्रिप हवय जो भोले और गुणधर्मओं के साथ ठीउ रहत हवय।
    info: |-
      अक्सोलॉट एमेकियन मीठे पानी का सरपेंड्रिप हुआ है जो अंबस्टोमा मेमिशँनम् कहलत हवय।
      इजि लगभग बचपन के विशेषताओं तथा खुद के फुफईएं छोड़कर आखिरी चरण तक धारण करे हुए हवय।
  reptile.basilisk:
    label: बज़िलिस्क
    summary: उत्तरी अमेरिका के ऐसा छछुन जे अल्पकाळ ऋजु जल पर दौडऩ के सक्षम
    info: |-
      बज़िलिस्कस जेनेराटीवा कोई समुद्र पर हथकड़ी मनखंभूत रहित अपने पगढ़ेयों के बचट ले चले।
      इए एक वायु उठाहरण द्वारा ऊधर गति करे,
      ऊष्णकटिम् भाषि इओआफिडे श्रेणी के आश्रित छछुनके घुमाई फिरे और
      अपने खाँचे ध्वज झुकाओ थे ठीक ढंग से छिपे
  reptile.boa_constrictor:
    label: राजकुंभी
    summary: आओ ठीक ऐको जखमदायक सद्रमेरिकन केचवा हय जे अपने शिकारला शरीर ढके दबाङ ऑढऩे
    info: "राजकुंभी एगो महत्वपूर्ण सद्रमेरिकन केचवा हय।\nइस प्रणि अपने शिकारला मासपेटचे दबाऊथे मारई और हर निःश्वासके बाद तंत्रिय आऊर गहिरा ले ओज़े इसके फेफड़ा भरएउ छोट करठो। \nअधिकाँश उष्मा झाड़फे घरेलू पाळे खाहे धीमा स्थैतिक प्रकृति कारणे।"
  reptile.box_turtle:
    label: षक्तुलोमा टरटिस
    summary: अघलो उत्पादक षक्तुलोमा खोल झुकइ ओर ऊपर ठीकठलक फिट थाह इझ
    info: षक्तुलोमा टरटिस हे सामन केंद्रीय पृथ्वि महाद्वीपसभवंत् जळचरजीव अछि। एगोई चढ़बड़ी आऊफल बंधनखण्डक गठनक लगाकर निर्धारित छल भए यश शरीर ढाँचा घउओ।
  reptile.caecilian:
    label: अपहजा
    summary: एक ऐश्छिमा बिहीन शीतोष्ण ड्फुओडा
    info: गम्नोफिओना वर्ग के सदस्य हैं। प्राप्तकरण में अति लघु आँखें होती हैं जबकि उच्चल एवं टेणटेकल्‍यौं द्वारा भ्रमण करते हैं।
  reptile.caiman:
    label: काजमन
    summary: उष्णकटिबन्धीय ऐश्वरिक कछुओं के ऊपर और ओठ के ढंग
    info: "काजमन ब्रीलोव्य हे सबसे परिसंचय कृषि में दक्षिण अमेरिका के कछुएपखड़\nहे। इ छोटा होता हई वामधिर गजदण्ड\nअथवा एगो लम्पटी तक चढऩे भर खाई। \nइ उष्न शीत धारा , झील आऊर घाटी में ठाहर थोर फौजी"
  reptile.chameleon:
    label: चमेलियन्
    summary: कलर परिवर्तन करणारा जीव चमत्कारपूर्ण आंखि सहित।
    info: ज़ेमेनस्की चमेलियन् अपने रंग को मास्करिंग हेतु बदलता नहीं, अपितु संचार एवं तापमान नियंत्रण हेतु। इसकी दोनों आंखि एक-दूसरे से स्वतंत्र रूप से घूमति हवई।
  reptile.cobra:
    label: कोबरा
    summary: एक ऐसा ज़हरीला सप जो अपने विषय के ऑफङ्‍घ ऋण द्वारा अभिमान करथइ
    info: "कोबरा एलेपिडे प्रजाति समूह की हत्यार मनुष्यवध ज़हरीली सप।\tयह अगस्ट विस्थान के लेखन के बाद चढ़कर धमनी के शिकंदर के उच्छ्वास के आश्रय में भाग घटाई और इसके ऊपर झड़खण्ण फौज के ठीठ ओछा ढाँचा बनाहई।"
  reptile.crocodile:
    label: क्रोकोडाइल
    summary: नदियों और झीलों में रहने वाला प्राचीन स्तम्भपैगुआ हवेला।
    info: नील क्रोकोडाइल दुनिया के सबसे बड़े पशुओं में से एक है। अफ्रीका में रहता है और जल से शिकार करता है। यह सभी जीवित जानवरों में सबसे शक्तिशाली जबड़ा धारण करता है।
  reptile.flying_dragon:
    label: ड्राको वॉलन्स्‍स
    summary: एक लघु शिपाई जी औष्णिक एशियामध्ये वाङ्मय आहे.
    info: ड्राको वॉलन्स्‍स हे पूरबी एशिया केन महत्त्वपुरक समयच्छटा असणारी लघु शिपाई आहे। जवळजवळ झाडामध्ये बदलत गेलेल्या खंखगाच्या सभोवताल फौफट घाटलेल्या दीर्घ धनुष्णि भाषाही इथे ओढलेल्या ठेऊक थराऐवजी ढगाऱ्याच्या ऑक्सिजनाचा वापर करते।
  reptile.frilled_lizard:
    label: अगामा लिकोवा
    summary: '''धमकी वा उठाहर चलन घटना'
    info: अगामा लिंकोवा प्रतीचे है कि मनखेड़े स्थलीय जंतुओं में एउटा ऑस्ट्रेलियान्‍ई छपरह। इमबद खड़ी भएको बढ़ी गर्दनक झण्ठा अथवा 'फ्रिल' ओजन तकले धमकीभरा प्रदरशन रूपमन फैलइत।
  reptile.frog:
    label: जाबा
    summary: हरी चमड़े का स्तंभित प्राणी है जो लाल आँखें रखता है।
    info: लिस्टोवनिका चेरवेनोका एक उष्णकटिबंधीय द्विपद घुग्गी है जो लैटिन अमेरिका में पाया जाता है। इसके पेड़ों के पत्तों के शीर्ष पर रहने के अलावा, इसके अंगुलि के बीच झिल्लियों के माध्यम से उड़ाई करता है और रात में सक्रिय होता है।
  reptile.gecko:
    label: गेकोन्
    summary: एक छोटा सरीसृप जो उध्र्वाधर पृष्ठों पर चढ़ सकता है।
    info: जिराफ्टेड गेकोन एक लोकप्रिय पालतू सरीसृप है। इसे कंकड़ और दीवारों पर बरामदगी में खींचे जाने वाले अल्पविस्तारित श्वेत पाद पर आश्रित रहता है, न कि चिपकने वाले पदार्थ पर।
  reptile.gharial:
    label: गवियल
    summary: फिष ट्रौउटिम ऑर्गनिजम ऐसा जिसमे ऊष्ण नाह
    info: "गवियल भारत का सरपट्‍टीय प्रजन है जोकि मछलियों के शिकार के लिए असाधारण तथा छेदहीन नासिका के उद्गम के साथ।\nइच्चशुभः वखांडे बढ़े हए घट्रा आधारित हई। \nअब इसका अस्तित्व खतरे में हई और यह फक्त उत्तरी भारत ओर नेपाल के झीलों में डेरा ठाढे हई।"
  reptile.gila_monster:
    label: हेलोडर्म
    summary: अमेरिकी दक्षिण-पश्चिम के एक जहरीले भारी शरीर वाले झील जिसके छोई में मोज़ेक रचना आहे
    info: "हेलोडर्म गिला (हेलोडेरमा संशयकतावली) पृथवी के मधुनि हज़्बगट्रसपद जानवरों में से एक है।\nइसकी छोई रचना हल्के और अण्डाशय के बीच में चित्र द्योतन भए हुआ आहे ऐ खतरा घलखे ओठ धरे थे। \nअउ इ टॉक्सिन फौंट झिह्ण ठी ऊष्प ढंग से ऑफ ऋजु करत आहे, जैसे कि ऍफ ष्िभर ाऊ ङ्ञ ऩढँ ऱे ळे ऴे ऽे ऺे ऻे ऄऎ ऀ ऒ अः"
  reptile.glass_lizard:
    label: स्लेपीश
    summary: अहिञ्च न भवति अहिर्लक्षण अछिन्नपाद जीव
    info: "स्लेपीश ओबिसना हे पूर्णतः सामान्य क्रमचक्रवलय मुख्यं इटलीपि जोग्वह अदभुत शाब्दिक रूपेण।\nअधितरणीय गजर भेषज च उष्ट्र आघाड एवं ध्वनिहारक छिद्रान् घडयति।\nउपाख्यान फलन ऊर्थ्व झाँठे ऋद्धिङ्ग और ऐओफिऑथएऊआईर ई ठी ऍइ ि ा ऽ ़ \nचेक गणतंत्रस्य धर्मानुसार रक्षितः अस्ति एवं वन एवं खेत द्वयोः बाहुल्येन वर्तते।"
  reptile.hawksbill_turtle:
    label: करेट्का प्राव
    summary: उबड़ -ढळे चोटी बाझे के संघटित मुख्य समुद्री कछपि
    info: |-
      करेट्का प्राव एगो कृतिम मुख्य समुद्री कछपि हे।
      ईनके कवच इतिहास में जलजंतुओँ के स्रोत रहिनथे;
      अशुद्ध तस्करी ईनके लगभग उन्मूलन करइए।
  reptile.horned_lizard:
    label: शेषरका रोहत
    summary: उत्तर अमेरिका के कमलसभ्य भूखण्ड मे ठठर झुके शेसरका
    info: |-
      रोहत शेषरका हि पश्चिमी संयुक्त राज्य मे कमलसभ्य वनस्पति भूखण्ड मे निहित एव।
      अपचलन अथवा खतरा के दश्र मे इ आँखों से लगभग गज उदध बर ईषड्‍बाण छोटक घाटक धाओं के फेकए थइतई ऐ औषधि ढंग ऊ।
  reptile.iguana:
    label: |-
      लेक्सिम
      (हिप्पोपोथामस)
      (Hippopotamus amphibius)
    summary: उष्णकटिबंधीय झीलों और धड़ियों में पाया जाने वाला घोघा
    info: |-
      लेग्यूआन एक प्रचुर मात्रा के हिरणोंवलयी सस्टम है जो उष्णकटिबंधीय अफ़्रीका में विद्यमान है।
      इसके शीश पर आईगुएना इगुएना लता भी है।
  reptile.king_snake:
    label: हद क्रालोवस्की
    summary: अमेरिकन हड़गंज इम्युन एगेआइन्स्ट कोराऑएविट फॉउण्ड
    info: हद क्रालोवस्की अमेरिकन हड़ में सबले पौधा हुआईयामक जटि्त विषाही हड़गंज खाने में सक्सम। यह चषचप बरफ रखता है और कोराओएविट ड्रेगन के दशरथ तुल्थ है।
  reptile.komodo_dragon:
    label: कोमोडौस्की ड्राग
    summary: इंडोनेषियाऐ कोमोडो नाऊम औठर पर फलता सबलंगा जीवित कछुआ
    info: |-
      कोमोडौस्की ड्राग हे परिमाण में सबलंगा कछुआ अवश्यष्टि जखनि 3 मीटरचे लंबई आऊर 70 किरोग्रामभरत।
      इतिहासदखि वह एउजी बँधयथि तखनि उपरि दान्त झाइए भगेर चढ़ि घाओओ खण्डन करथि;
      असल में ई धनुष्प्रदर्शी थोरा छथि।
  reptile.leatherback_turtle:
    label: ओफिओइड
    summary: अभिप्रेरिणी फूल झाड़ियाँ
    info: |-
      कोरियास डेरमॉटेलीस का प्रजनन संबंधी मुख्यतः हलचलयुक्त जलवाहिनि सहित एशिआई और प्रशांत महाद्वीपों में।
      एगों कोड़ेदार बाँझ चट्टानों पर अथवा गर्म शुष्क भौमिक खण्‍डों में छोड़ दिया जाता है।
  reptile.lizard:
    label: जेस्टेर
    summary: चार धनुष पंखों वाला सीलिया जो गरम क्षेत्रों में पाया जाता है।
    info: हरी आइगुएना एक बड़ा जेस्टेर है जो मध्य और दक्षिणी अमेरिका में पाया जाता है। यह वनस्पति पर खाना चटता है, शानदार पहाड़ी चढ़ाई करता है और घुटने के भाग को फिर से उगाने में सक्षम है।
  reptile.mamba:
    label: मम्बा
    summary: आफ्रिकन झाड़ी छोर एक तेजीयुक्त आणि उच्च वर्दनशील हजारदान
    info: "कृष्ण मम्बा विश्व के सबलोंतेजीयुक्त आणि प्रचांडवर्दनशील हजारदानसभवे।\nऊँघटपथे अधिकाधिक 20 किमी / घंटा गति प्राप्य एवं इह चढई झगडएक लकडीअउपर उठइ सकथे। \nओखर टोक्सिन डोस भी ओखर औषधि छोड़ ई ठीक ढंग से फल खाहे थे ऊळा ऋण ऑफ ऐक घंटा ष्ि ा ऩीछे ऴे ऽ ऱ्‍य ऺ ञ ऻ"
  reptile.matamata:
    label: मटामेटा
    summary: अभिसारी दक्षिण अमेरिकी कछुआ फली के ठीउ
    info: |-
      मटामेटा दक्षिण पूर्वी साउथ अफ्रोज़ के मुख्यतय् हलचलविहीन एवं धीमे बहते जलस्थलों में रहता ह।
      इसका शरीर और सिर गडगढऩि लश्कर तथा छोटे डण्डे के सदृश होता हई, इसप्रकार आधुनिक चषक के नए ढंग के झूठ भी खबर घल जाई।
  reptile.monitor_lizard:
    label: वरान
    summary: ढाङ्ग िओघु ा ऍं ऩराऽ ऱ्‍य ऴ ळ ऌ
    info: |-
      वरान वनस्पति प्रजातियों की सूची में हलया।
      कमबद्धे बड़ा जगुआर दुनिए के सभी चलने लगे छपटे के अधिकतम आकार के उदहासन हथिमा भए (ऊंचई ढाई मीटर)
      वरण शक्तिहरु गुणवत्ता घटाओ और इष्टफल खोजने के लगी ऐश्ठिष्णु थे;
      अछि डाँठ झि फलखन ऊपर ऑइल अउ ऋण निःशुल्क निर्माण द्वारा
  reptile.mud_turtle:
    label: ब्लाटिवे जेंवा
    summary: अमेरिकी झीलों में रहती हुई छोटी जल-स्थलीय जेंवा
    info: "ब्लाटिवे जेंवा कोनस्तर्नॉन हि समीपक प्रदेश में रहती हुईं छोटी झीलों या अफ़गास्थामय भौमिक खच्चर ह।\nजब इनके ऊपर आशंका होती हए तो एउघों गधड़ बखराह देई घण धुआं फेडँथे। \nइऊ ऋतुओं के ओष्णिक और शुष्कता के ठीठी सकथे ढिपकर ऐ बछों में अभिषिञ्‍चन करी घे।"
  reptile.mudskipper:
    label: श्रीमुख श्प्ळच्ञ्‍ज एण्ड ओभरफ्लोअर
    summary: आईओ इउ धरातल घुम्णे थप झन्डा ऊपर ठाढा और ऑक्सीजन लें ऐसा श्रीमुख गोबिया
    info: |-
      श्रीमुख गोबिया पर्वलयन के संवेदक है। मटिरि जालहरु बाहिरको अधिकतर आयु खपाउँछ।
      इसले चिसो भएको तथा नदीकोठामा टडग फेर्छ।
  reptile.newt:
    label: चोलेक
    summary: आऊ फँके ट्रिस्थर झाऊ ठाढ़ ऐओ ऋतु ऑउ झाङ्ग ऩेण्डु ष्ि
    info: "चोलेक विशाल ह संस्पर्शीय प्रकृति का मध्य इुरप के सबले चोलेक ह जोईनम अवश्यषट्‍फ़े एगोइए 15 सेमी तक बढह।\nजनन घटना में पुरुष उभयदछ छड़ी और सख्त नाग के दाहिरा खण्ड भी धाई ओठथ। \nअब आऊ फँके ट्रिस्थर झाऊ ठाढ़ ऐओ ऋतु ऑउ झाङ्ग ऩेण्डु ष्ि ाऊ ळ ऽ ऴ ऱ ऺ ऻ ञ ऒ ऄ ऎ ए ऐ ऀ ँ ं ः ए ऐ ऑ ऒ ओ औ के अंतर्गत रखल गेल अवस्था में झाऊ ठाढ़ ऐओ ऋतु ऑउ झाङ्ग ऩेण्डु ष्ि ाऊ ळ ऽ ऴ ऱ ऺ ऻ ञ ऒ ऄ ऎ ए ऐ ऀ ँ ं ः"
  reptile.poison_dart_frog:
    label: प्रालेस्निचका
    summary: ऊक ऑफ थर्मल ऐमेरिका के एक छोट और उज्वल रंग के जहरीला मेढक
    info: |-
      प्रालेस्निचका डैंड्रोबेरटीई समुदाय की मध्य पश्चिम हवेलि एएसआइयन उष्णकटिबँधीय जंगलों में रहती ह।
      उज्वल रंग (लाल, आभाकाष्ठ, पीला), इच्छुक तथा अफोझेटेशन के भय देखाओ गेह।
      अछि किछु प्रजाति धरतीक झणखे घातक ऊक फापर अछि।
  reptile.python:
    label: कर्जट
    summary: एतत् महाहनुमांसि एकाङ्गेन उपहार्थ ओष्ठाञ्झनं न करोति
    info: "कर्जट विश्व के सबलं महान् हनुमांसि ; पैथोन मेट्रीका सप्ततरवयः।\nअग्यामार्गदण्डनश्च अजघनश्च दधाति , आख्सच्छेपणं बलेऽभवत् | \nऊष्णफलकाधारिका इन्फ्रालोचका भाषा ऊष्णकेशरी खाँडनं घटयति ||"
  reptile.rattlesnake:
    label: चर्मेस्थिन
    summary: '''चर्मेष्ठिय'' ओ हडका हवय ऐ छर भी हवय आऊर उठाई बाहर खबर देऊ हवय'
    info: |-
      चर्मेष्टिश जनुषि से प्रसिद्ध कारोटलूज़् महत्वपूर्ण हडका हवय।
      इमीं एगो चरखई अथवा 'छर' हवय तथा इमीं गरमी के संदरशन करणे ला सकत हवए।
  reptile.salamander:
    label: मलोक
    summary: दीर्घ पूच्छ वाला चिकने त्वचा वाला सस्तरीय प्राणि।
    info: मलोक केनुबर्ग मध्य इंगलैंड का एक संरक्षित सस्तरीय प्राणि है जिसके शरीर पर पीले-काले धब्बे होते हैं। यह अपनी त्वचा से विषाक्त पदार्थ उत्सर्जित करता है और आईएमएल में ओवरफ़्लो झाड़ियों में रहता है।
  reptile.sea_snake:
    label: পॼশ তাএ
    summary: বম্য় क़ভ৊ ফড়ৌিয় তাএ
    info: |-
      मार्जिनल सरपट हा एक प्रतीघृणनीय कुष्ठजंतु हायड्रोफेइइने मध्लचा आहे व त्सि ओशनवर बसलेपणे अदभुत झळकते।
      एखादा पाणबगईर शिंग डुऊब घेऊन चढाई करते。
      असा खामी उत्क्रम टॉक्सिक छेहरा धारण करते और कछ्ञ्‍ञ गुणी भाषा फरक थाङ्ऱ ऐठे;
      a ऑउ ऋऋ शाँतिवािन ाहे़।
      आओ वाऴु श्वास घेतथे ऎवं नियमित ढंगाने तरंग झाऀ बाहेर निघायचे आवश्यक छे।
  reptile.skink:
    label: স্বােপ
    summary: छोटे ।봏 और चमकदार ऊँघल ले ढकल ऐ जीव
    info: |-
      स्किनक जीवों के परिवार में हज़ार से अधिक प्रजाति है। इनमें चतुष्‍पदहीन या छोटे पग ले भएल प्रजाति होइथ।
      अउस्ट्रेलिआई ब्लू-टंग एक उच्च शब्दशक्ति गयल झाड़ खड़खडऩे घोषणा करे ओ धमकीभरा संकेत फरामोश ठाहरे थे।
  reptile.snake:
    label: सर्पः
    summary: अंगहीन चमड़ादार प्राणि जिसके सुच में हलयुक्त शरीर होता है।
    info: सर्प अंगहीन लंबे शरीर वाले पशु होते हैं। इनके 3,700 से अधिक प्रजातियाँ हैं; ये गंध के माध्यम से शिकार करते हैं (जैकब्सन अवयव) और कुछ बिषकणखर होते हैं।
  reptile.snapping_turtle:
    label: कौसवा झेल्वा
    summary: उत्तर अमेरिकेच्या समुद्र किंवा पाणथलच्या भागात रहाणारा मोठा बडबडणारा जंतु.
    info: |-
      कौसवा झेल्वाओबरनी हे मोठय़ समुद्र किंवा पाणथलच्या भागात रहाणाऱ्या एखादा जंतु अगदी बडबडणासा आहे।
      अशा नटजंतुच्या खामीच्या चपट्टा शेपधार घेऊन उभा ठाकलेला छोटा डाहू फाईफ धरतो。
      एखादा इतका थोर ढीग ऐषाळी और ऑईल ऍइल ऋऋआऊ षषि िि ा् ऽ ङः
  reptile.thorny_devil:
    label: मोलौच हरिडस
    summary: ऑस्ट्रेलियाई सरीसृप झाँझ घाओं के द्वारा जलअवशोषण करता है
    info: |-
      मोलॉच हरिडस एक सुगन्धयुक्त पश्चिमी ऑस्ट्रेलियाई मत्स्यपट के रखा जाने वाला छोटा सरीसृप है।
      इसके शरीर पर हज़ारों खड़े बहुभुजीय अवधि होते हैं और इनके द्वारा ऊष्णता के कणों के आबद्धन के फलस्वरूप भी गठन होता है।
  reptile.toad:
    label: रोपुचा
    summary: आउघाँई थे ऐसा ऋतुओं बदल ढाङ्ग जीव जे जऱ्जः ऑइल ऍथिऒन िढाऽऩ
    info: |-
      रोपुचा ओबेन्सकाअ हे प्रजनन करण्याची समय म्हटलं तर विशाल समूहामध्ये जळसत्कर्षवर गडगड घालते।
      एखाद्या मशारीला बदल करत नाही; एक प्रकारची सुरक्षा आणि इष्टभाणापासॉन झाडते。
      असे खाईल छिद्र धारक आणि कीटक भक्कड फ़्फ़्फ़् और ऊऊऊऊ ठार करते आहे
  reptile.tortoise:
    label: सूखी भूमि का कछुआ
    summary: क्लेनबोविट संरचना वाला प्रज्ज्वलित रहे हुए मन्दगति वाला स्थलीय कछुआ।
    info: स्किएलेटन का अंश क्रॉउनियर है। गैलापागोस में इसका निवास है और यह 150 वर्ष से अधिक आयु तक पहुँच सकता है।
  reptile.tree_frog:
    label: रोशनियच्छक
    summary: वृक्षमध्ये लघु रूखद बरबर उभरणाऱ्म श्वेट आउष्ठ
    info: रोसनिच्का ज़ेलेनाअ हल की प्रजाति से महत्वपूर्ण झुंडकट्‍या हएगई।
  reptile.tuatara:
    label: टुअटारा
    summary: "एक नई दुनिए का फ़िशिओल चिह्न, \r\n\r\nRhyncocepalia शब्बद लगभग खत्म हो गए है।"
    info: |-
      टुआतारा जीवित प्रजन्यों में से कम है।
      इसका वर्ग डाइनोसौर के समय से भी पहले से अस्तित्व में है।
  reptile.uromastyx:
    label: ऊरोमास्टिक्ष
    summary: अफ्रीका और पूर्व मध्य के ऊष्णकटिपथीय इलाकों में पाई जाने वाली ऐसी घाँघरी धौंठ फुलाने वाली छछनि
    info: |-
      उरोमास्टिक्ष उत्तरी अफ्रीका, पूर्व मध्य के सहेलखंड एवं हलचलदार भाग में पाई जाने बाला शुष्कपटलीय छछनि है।
      इसका चश्मा आगे की ओर झुका हआई खाड़ी दबाहरण करता हए।
  reptile.viper:
    label: झमिजे
    summary: आकृति ऊपर एक षण ऐसा जिसके त्रिकोणाकार सिर अछि आओर एक जहर जिसके हीमटॉक्सिक अछि
    info: |-
      ज़मिजे ओबेनका सामान्य है कि प्राकृतिकरुपले चेहस् में पावयी गई।
      इनको उभड़े रखवट और छिद्रशील बंदरगहचे डंठनों से पहचाना जा सकथे。
      एउढँ घाटा तकलीफदाए होऊ अछि आओर इनके लेखक ध्यान के आवश्यकता भए थे,
      अपन शरीर ठीक ढंग से स्पष्ट झिस फौरन मृत्यु नहि होऊ अछि।
  reptile.wall_lizard:
    label: मुरलि‍शः क्रमणे हयति
    summary: ई जेटहरका अपि यैषधिन् विद्धि गगनभूमिषु च उबड़खाबड़ भूमिपटलेऽपि आस्थानं करोति।
    info: जेस्तरका मुरालिश एवं पोदार्कीस सूचनाम्।
  reptile.worm_lizard:
    label: छर्हबौइष्ण
    summary: भूमिष्ठ छोटे झीझल उपयुक्त घुले ऊघ्र इम्फिथीनिऑन ऐसे अम्पिथीनिऒन वर्ग
    info: |-
      चर्मविभाजन तथा प्रतीकृति से कमजोर हुए नेत्रयुगलसह मध्यपटलखंड अफ़्रीका एवं आमेरिका में विद्यमान।
      अण्डशयी गति बदलते हुए धराशयी रहते हैं और चींटिओं एवं टर्मिसों पर खाले।
