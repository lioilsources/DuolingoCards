lang: sa
pivot: false
title: माशका अर्थवलयीन
cards:
  reptile.chameleon:
    label: चमेलियन्
    summary: कलर परिवर्तन करणारा जीव चमत्कारपूर्ण आंखि सहित।
    info: ज़ेमेनस्की चमेलियन् अपने रंग को मास्करिंग हेतु बदलता नहीं, अपितु संचार एवं तापमान नियंत्रण हेतु। इसकी दोनों आंखि एक-दूसरे से स्वतंत्र रूप से घूमति हवई।
  reptile.crocodile:
    label: क्रोकोडाइल
    summary: नदियों और झीलों में रहने वाला प्राचीन स्तम्भपैगुआ हवेला।
    info: नील क्रोकोडाइल दुनिया के सबसे बड़े पशुओं में से एक है। अफ्रीका में रहता है और जल से शिकार करता है। यह सभी जीवित जानवरों में सबसे शक्तिशाली जबड़ा धारण करता है।
  reptile.frog:
    label: जाबा
    summary: हरी चमड़े का स्तंभित प्राणी है जो लाल आँखें रखता है।
    info: लिस्टोवनिका चेरवेनोका एक उष्णकटिबंधीय द्विपद घुग्गी है जो लैटिन अमेरिका में पाया जाता है। इसके पेड़ों के पत्तों के शीर्ष पर रहने के अलावा, इसके अंगुलि के बीच झिल्लियों के माध्यम से उड़ाई करता है और रात में सक्रिय होता है।
  reptile.gecko:
    label: गेकोन्
    summary: एक छोटा सरीसृप जो उध्र्वाधर पृष्ठों पर चढ़ सकता है।
    info: जिराफ्टेड गेकोन एक लोकप्रिय पालतू सरीसृप है। इसे कंकड़ और दीवारों पर बरामदगी में खींचे जाने वाले अल्पविस्तारित श्वेत पाद पर आश्रित रहता है, न कि चिपकने वाले पदार्थ पर।
  reptile.lizard:
    label: जेस्टेर
    summary: चार धनुष पंखों वाला सीलिया जो गरम क्षेत्रों में पाया जाता है।
    info: हरी आइगुएना एक बड़ा जेस्टेर है जो मध्य और दक्षिणी अमेरिका में पाया जाता है। यह वनस्पति पर खाना चटता है, शानदार पहाड़ी चढ़ाई करता है और घुटने के भाग को फिर से उगाने में सक्षम है।
  reptile.salamander:
    label: मलोक
    summary: दीर्घ पूच्छ वाला चिकने त्वचा वाला सस्तरीय प्राणि।
    info: मलोक केनुबर्ग मध्य इंगलैंड का एक संरक्षित सस्तरीय प्राणि है जिसके शरीर पर पीले-काले धब्बे होते हैं। यह अपनी त्वचा से विषाक्त पदार्थ उत्सर्जित करता है और आईएमएल में ओवरफ़्लो झाड़ियों में रहता है।
  reptile.snake:
    label: सर्पः
    summary: अंगहीन चमड़ादार प्राणि जिसके सुच में हलयुक्त शरीर होता है।
    info: सर्प अंगहीन लंबे शरीर वाले पशु होते हैं। इनके 3,700 से अधिक प्रजातियाँ हैं; ये गंध के माध्यम से शिकार करते हैं (जैकब्सन अवयव) और कुछ बिषकणखर होते हैं।
  reptile.tortoise:
    label: सूखी भूमि का कछुआ
    summary: क्लेनबोविट संरचना वाला प्रज्ज्वलित रहे हुए मन्दगति वाला स्थलीय कछुआ।
    info: स्किएलेटन का अंश क्रॉउनियर है। गैलापागोस में इसका निवास है और यह 150 वर्ष से अधिक आयु तक पहुँच सकता है।
