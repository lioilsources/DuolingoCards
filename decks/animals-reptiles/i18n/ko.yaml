lang: ko
pivot: false
title: 곤충과 양서류
cards:
  reptile.chameleon:
    label: 카멜레온
    summary: 피부 색을 바꾸는 꼬리 없는 뱀과의 파충류입니다.
    info: 예멘 카멜레온은 숨기거나 위장하기 위해 아니라 소통하고 체온 조절하기 위해 색을 바꿉니다. 그들의 눈은 서로 독립적으로 움직일 수 있습니다.
  reptile.crocodile:
    label: 악어
    summary: 강가와 습지에서 사는 고대의 파충류입니다.
    info: 니罗 강 악어(Nilotic crocodile)는 세계에서 가장 큰 파충류 중 하나이며 아프리카에 서식합니다. 물속에서 사냥을 하고, 살아 있는 동물들 가운데서 가장 강력한 이빨을 가지고 있습니다.
  reptile.frog:
    label: 개구리
    summary: 붉은 눈을 가진 녹색 점프하는 양서류입니다.
    info: 적안 개구리는 중남미의 열대지역에서 사는 나무 위를 생활하는 두족류입니다. 손가락 사이에 있는 날개막으로 나는 듯이 움직이며 밤에 활동합니다.
  reptile.gecko:
    label: 게코
    summary: 수직 표면을 기어올라갈 수 있는 작은 도마뱀입니다.
    info: 豹紋 게코는 인기 있는 테라리움용 파충류입니다. 발에 있는 미세한 손톱들이 돌이나 벽을 붙잡아 이동할 수 있게 해주며, 젤 같은 접착제가 아닙니다.
  reptile.lizard:
    label: 도마뱀
    summary: 따뜻한 지역에서 흔히 발견되는 네발 달린 비늘 있는 파충류입니다.
    info: 녹색 도마뱀은 중미와 남미에 서식하는 큰 종류의 도마뱀으로서 식물을 먹고 삶습니다. 등산을 잘하고 꼬리가 끊어졌을 때 재생할 수 있습니다.
  reptile.salamander:
    label: mlok
    summary: 광택 있는 피부와 긴 꼬리를 가진 양서류입니다.
    info: 검은색과 노란색 반점이 있는 중앙 유럽의 보호받는 양서동물인 mlok skvrnitý는 독성 물질을 피부에서 분비하며 습한 숲 속에 서식합니다.
  reptile.snake:
    label: 뱀
    summary: 다리가 없고 유연한 몸을 가진 비늘 있는 파충류입니다.
    info: 뱀은 다리를 가지지 않은 긴 몸의 파충류이며, 3,700개 이상의 종이 존재합니다. 냄새를 맡아 사냥하며(야코프슨 기관), 일부는 독성을 지닙니다.
  reptile.tortoise:
    label: 육상 거북
    summary: 땅에서 사는 돔 모양의 껍데기를 가진 느린 파충류입니다.
    info: 코끼리 거북은 세계에서 가장 큰 육상 거북으로 갈라파고스 제도에 서식하며 150년 이상 살 수 있습니다. 그들의 등갑은 골격의 일부분입니다.
