lang: ko
pivot: false
title: 곤충과 양서류
cards:
  reptile.agama:
    label: 아가마
    summary: 남미 지역의 다채롭게 보이는 돌 도룡뇽으로 수컷에게 눈길 가는 무늬가 있다.
    info: 아가마는 아프리카와 아시아 그리고 오스트레일리아에 서식하는 약 300종 이상의 큰 뱀사자과 파충류입니다. 붉은머리 아가마 수컷들은 우월성을 나타내기 위해 주목할 만한 연두색 머리를 가지고 있으며 몸통에는 푸른 색이 있습니다. 온도 조절을 위해서 활발히 자신의 체온 변화를 반영하여 피부톤을 적응시키며 추우면 어둡고 따뜻하면 밝습니다. 드라코(Dracos) 종 일부는 늘어난 갈비뼈로 날개처럼 하늘에서 나는 것이 가능합니다.
  reptile.alligator:
    label: 악어
    summary: 둥근 주무를 가진 큰 도마뱀류로서 북미 및 아시아 일부 국가들에서 발견되는 동물
    info: 아메리카 악어는 생존하고 있는 두 종의 악어 중 하나이며 다른 한 가지는 중국악어이다. 코가 더 넓고 둥근 모양이고 입을 닫았을 때 이빨이 보이지 않으며 크로커다일과 구별된다. 미국 남동부 지역에서 습지를 중심으로 강줄기와 호수에 서식한다.
  reptile.anaconda:
    label: 애낁콩다
    summary: 남극 산호에서는 풍부한 해양 동물들이 살 수 있는 환경 조건을 제공한다.
    info: |-
      {"hint":"세계에서 가장 무거운 뱀이며 반수생(에네케特斯 머리누스)","info":"초록 애нак콘다는 세계 최대의 거북이로 성체암컷은 체중으로는 90kg 이상이고 길이는 대략 5~6미터입니다.
      열대 아메리카 지역의 습지와 강줄기 주변에서 서식합니다.
      반수산 생활을 하며 물고기를 비롯해 새나 칼라바오 그리고 크레스타드 알igator까지 사냥하며 식사를 합니다.
      크랩과 달리는 이 종류는 난포가 아닌 직접 충분히 자란 후 탄생하는 방식인 살아있는 어린아들을 생산합니다.(유서태)","label":"애낙용다","summary":" 아마존 저습지에서 발견되는 지구상 최무게 빗살뱀."}
  reptile.anole:
    label: 아놀리스
    summary: 미국 원산지인 변신하는 소형 파충류로 수컷에게 눈부시게 반짝이는 낱말들이 붙어있다.
    info: 아놀리스는 아메리카에 사는 약 400종 이상의 작은 도마뱀이다. 수컷은 의사소통과 암컷을 유혹하기 위해 색이 있는 목 주변 낭포(dewlap)를 가지고 있다. 녹색 아놀리는 온도와 감정 상태에 따라 초록빛에서 갈색으로 색상을 바꿀 수 있으며 빠르고 민첩하다. 이들은 접착성 팩(facet) 덕분에 유리를 오른다.
  reptile.axolotl:
    label: аксолотл
    summary: 멕시코 출신 물螈이면서 아동 시절부터 성장 후까지 끝내는 형태를 보여줍니다.
    info: 아코로틀(Axolот)은 멕시코의 수생 두족류이며 종양성으로 인해 일輩 동안 유충기 특성을 유지합니다. 이들은 외부 기관인 폐와 함께 생존하며 메트로폴리탄 지역 주변 호수에서만 발견되는 고유종입니다.
  reptile.basilisk:
    label: 바질리스크
    summary: 북아메리카 지역에서 발견되는 짧은 시간 동안 물표면 위로 달릴 수 있는 파충류.
    info: 장식 바질리스커(예수 그리스도 도마뱀)는 깍지 모양의 발톱이 있어 물 표면 아래 공기를 잡아 수평을 유지하며 뛰어다닐 수 있다. 이동 거리는 약 20미터까지이며 이후에야 침몰한다. 남성 개체는 머리와 등줄기에서 두드러진 척추를 가지고 있으며 나무 위에서는 캠ouflage가 기본적인 방위 전략이다.
  reptile.boa_constrictor:
    label: 황금부아
    summary: 중남미에서 발견되는 크기가 커서 희생자를 자신의 몸 안쪽으로 집어삼키듯이 학살하는 황금부아.
    info: |-
      황금부아는 중남미에 사는 큰 무해한 뱀이다.
      이들은 먹잇감을 죽일 때 몸으로 감싸고 숨 쉴 수 없게 압박하여 질식시키며 잡아먹힌다.
      온순하고 친근하기 때문에 인기 있는 외국산 반려동물로 사랑받으며,
      길이는 최대 4 미터까지 되기도 하고 평균적으로 삶의 기간은 30년 이상 된다.
  reptile.box_turtle:
    label: 상자 거북
    summary: 작은 육지를 사냥하는 동물로 광범위한 갸름 내부를 닫아서 자신을 방어할 수 있는 능력이 있다.
    info: 상자 거북은 북미의 육지거북으로 움직이는 앞 판을 이용해 완전히 껍질 안에 들어갈 수 있다. 숲과 초원에서 혼자가 아닌 무리 지어 생활하며 나이가 든 상체는 약 80~90세까지 산다. 미국에서는 보호받고 있으며 일부 주들은 자연 환경 손상을 막기 위해 채집이 금지되어 있다.
  reptile.caecilian:
    label: 케르보로베茨
    summary: 다리를 가진 것이 아닌 곤충이나 파이톤 같은 형태를 한 고유한 열대성 양서 동물
    info: 고미노피온(Gymnophiona)에 속하는 케르보로베츠는 다리가 없는 양서류이며 열대 지방의 음영 지역에서 활동합니다. 큰 땅벌레나 희끄무레한 도마뱀처럼 생겼습니다. 눈은 작으며 줄어들었으므로 주변을 후각과 머리 위 감각 기관인 Tentaculum으로 인식하며 웁니다. 일부 종들은 출산하여 새끼를 낳기도 하고 다른 종들은 알을 산란하기도 합니다.
  reptile.caiman:
    label: 카이만
    summary: 남아메리카 출신으로 크로커다일이나 알리게이토 보다는 작은 파충류이다.
    info: 브라이오비 카이만은 남아메리카에서 가장 흔한 도마뱀과 비슷한 동물이다. 이 종류는 진짜 악어보다 작으며 최대 길이는 2.5미터에 달한다. 멕시코부터 아르헨티나까지 열대 지역의 강줄기와 호수 그리고 습지에서 서식하고 있다.
  reptile.chameleon:
    label: 카멜레온
    summary: 피부 색을 바꾸는 꼬리 없는 뱀과의 파충류입니다.
    info: 예멘 카멜레온은 숨기거나 위장하기 위해 아니라 소통하고 체온 조절하기 위해 색을 바꿉니다. 그들의 눈은 서로 독립적으로 움직일 수 있습니다.
  reptile.cobra:
    label: cobra
    summary: 특정한 형태로 날카롭고 경고하는 자세를 취하며 독성을 지닌 곰팡이는 해충.
    info: 코브라(Elapidae 계열의 독사)는 위협을 받으면 머리 뒤쪽 피부를 펴서 망토처럼 보이게 하는 것으로 유명하다. 그들의 독(신경독소)은 사냥감의 신경계에 마비 효과가 있다. 눈꽃 코브라는 이집트와 인도의 국가 상징이다.
  reptile.crocodile:
    label: 악어
    summary: 강가와 습지에서 사는 고대의 파충류입니다.
    info: 니罗 강 악어(Nilotic crocodile)는 세계에서 가장 큰 파충류 중 하나이며 아프리카에 서식합니다. 물속에서 사냥을 하고, 살아 있는 동물들 가운데서 가장 강력한 이빨을 가지고 있습니다.
  reptile.flying_dragon:
    label: '"летающий дракон"'
    summary: 동남아 지역 소형 파충류인 летающий дракон은 연장을 한 첫 번째 가슴 쪽 구조물들 위에서 비상할 수 있는 특징.
    info: |-
      {"hint":"날아다니는 뱀이 아닌 파충류로 늘어난 갈비뼈에 피부막을 사용해 나는 것(Draco volans)","info":"드라코 볼 Lans( Draco volans )은 동남 아시아의 작은 도마뱀으로, 연장된 흉추 위에서 긴 맨틀과 같은 표피 조직 덕분에 날 수 있다.
      나무 사이를 비행하여 영토 확보와 포식자로부터 자신을 보호한다.
      수컷은 목 주위에 눈에 잘 드러나는 노란색 혹이 붙여져 있으며,
      활발하게 낮게 내려오는 방향으로 활주하는 것이지 손가락처럼 웅크리며 직접적으로 하강하지 않는다."
  reptile.frilled_lizard:
    label: agama límcová
    summary: 두 다리를 사용해 빠르게 도망치면서 드라마틱한 줄무늬를 전개하는 어미.
    info: 아가마 리임코바는 호주 원주민 파충류로 목 주위의 피부 접이를 위협을 받았을 때 경고 표시처럼 펼칩니다. 두 발로 달리며 미니어처 공룡 같습니다. 평온 상태에서는 이 부위가 접혀 있습니다.
  reptile.frog:
    label: 개구리
    summary: 붉은 눈을 가진 녹색 점프하는 양서류입니다.
    info: 적안 개구리는 중남미의 열대지역에서 사는 나무 위를 생활하는 두족류입니다. 손가락 사이에 있는 날개막으로 나는 듯이 움직이며 밤에 활동합니다.
  reptile.gecko:
    label: 게코
    summary: 수직 표면을 기어올라갈 수 있는 작은 도마뱀입니다.
    info: 豹紋 게코는 인기 있는 테라리움용 파충류입니다. 발에 있는 미세한 손톱들이 돌이나 벽을 붙잡아 이동할 수 있게 해주며, 젤 같은 접착제가 아닙니다.
  reptile.gharial:
    label: 가비알
    summary: 극단적으로 납작한 부리를 지닌 어류 전문 포식자.
    info: 가비알은 인도의 코로나우스 속 동물로서 매우 길고 좁은 주둥이를 가지고 있어 물고기를 사냥하는 데 적응되어 있다. 수컷들은 주둥이 끝에 돌출부인 '그하라(ghra)'를 가진다. 이 종은 위급하게 멸종위기 상태이며 북쪽 인도와 네팔 강에서만 서식한다. 가장 오래된 크록오딜 중 하나이다.
  reptile.gila_monster:
    label: 헬로더마
    summary: 미국 남서부 지역에 사냥하는 모자이크 패턴 피부의 두꺼운 신체와 독성이 있는 도룡뇽
    info: 헬로더마 기ลา(Heloderma suspectum)는 세계에서 드문 독이 있는 도룡뇽 중 하나입니다. 주황색과 검은 색의 반짝이는 피부 무늬가 경고를 나타냅니다. 뱀처럼 구멍 난 이빨 대신 치아에 홈을 통해 톡소리를 전달합니다. 체력 소모가 적으며 느리게 움직이며 매년 몇 번만 먹습니다.
  reptile.glass_lizard:
    label: 스렙이쉬
    summary: 다리를 가진 것이 아닌 점에서 슬프지만 실제로는 렉사르(래커)처럼 생긴 곤충입니다.
    info: 슬레피시 오보체니는 유럽 전역에 서식하는 다리가 없는 도마뱀으로 쉽게 뱀과 혼동될 수 있습니다. 이 동물은 흔히 병색을 나타내며 눈꺼풀이 웅크릴 수 있고 귓구멍도 가지고 있어 일반적인 빗살 무늬의 뿔나무와 구별됩니다. 방어 기전 중 하나로 ꣂ을 잘라 버리는 자절 현상을 보이며 이후 다시 성장합니다.
  reptile.hawksbill_turtle:
    label: 프라바 카레트카
    summary: 좁고 날카로운 부리를 가진 심각하게 위협받은 바닷가재.
    info: 카레트카 프라바는 에레트모케일리스 속에 포함된 비정상적으로 위험한 바다 거북이다. 역사적으론 그들의 등판이 젤로비나의 원천으로 사용되었으며 불법적인 무역은 이 종을 거의 멸종시킬 뻔 했다. 주식 음식물과 코랄 산호 어귀에서 발견되는 해양 생물을 섭취한다.
  reptile.horned_lizard:
    label: 뿔이 있는 도마뱀
    summary: 북미의 사막 지역에 사는 흔히 볼 수 없는 형태와 비슷하게 생긴 광대뼈 모양의 돌출부가 특징적인 평탄하고 첨예한 도마뱀.
    info: 뿔이 있는 도마뱀(Phrynosoma)은 북미 사막에서 서식하는 평평한 가시가 많은 뱀이다. 위협을 받으면 방어 수단으로 눈에서 피를 일 미터 이상 트는 능력도 있다. 이동성이 낮아 캄ouflage에 의존한다. 주요 먹이인 개미를 파괴시키기 때문에 살충제로 인해 생태계 보호 대상 동물이다.
  reptile.iguana:
    label: 레gué앙 녹색
    summary: 열대 아메리카 지역의 가시 덩글머리를 지닌 커다란 녹색 도마뱀.
    info: '{"hint":"가시덤불 모양의 머리카락이 있는 큰 초식용 도마뱀입니다(Iguana iguana)","info":"녹색 레gué앙은 열대 아메리카에서 발견되는 최대 길이 약 2미터에 달하는 대형 식충성 파충류이다. 두피 위에는 광선 변화를 감지할 수 있는 제3눈(정수개체 눈)을 가지고 있다. 사회적 성향이 있으며 우월성을 표현하기 위해 헤드 밀어내기와 몸 색상으로 계급 구분한다. 주된 위협 요인은 자연 서식 환경 손실이며 사육 상태에서는 공격적인 어른처럼 행동한다고 한다","label":"레gué앙 녹색","summary":"열대 아메리카 지역의 가시 덩굴머리를 지닌 커다란 녹색 도마뱀."}'
  reptile.king_snake:
    label: 왕뱀
    summary: 풍뎅물에 강하고 다른 사자들을 잡아먹으며 무해한 미국 왕뱀
    info: 황금부전조는 독이 없는 미국 뱀으로 다른 유독한 부전조를 포함하여 먹을 수 있으며 그들의 풍뎅물에 면역되어 있다. 검은색과 하얀 줄무늬로 이루어진 색상 패턴은 독사인 코랄 스네크와 비슷하게 보이는 모방이다. 생쥐나 조류 및 파충류의 개체수 규제에도 중요한 역할을 한다.
  reptile.komodo_dragon:
    label: 코모도용
    summary: 인도네시아 코모도 섬에 서식하며 세계에서 가장 크고 살고 있는 파충류
    info: 코모도 용은 살아있는 가장 큰 도마뱀으로 길이가 세 미터 이상이고 무게는 일흔 킬로그램을 넘습니다. 과거에는 침 속의 박테리아로 사냥하는 것으로 알려졌지만 실제로는 독소를 가진 뇌관입니다. 멧돼지와 산양 그리고 심한 경우 소까지 포식합니다.
  reptile.leatherback_turtle:
    label: 크래기
    summary: 뼈 판 대신 가죽 같은 왕관을 가지며 세상에서 제일 커다란 바닷거북.
    info: 코자트카 벨가(Kožatka velká)는 길이로 최대 약 2미터 이상이고 무게도 700kg을 넘으며 세계에서 가장 큰 바다 거북이다. 단단한 뼈 갑각 대신 작은 골격 조각(오스테오페르마)으로 강화된 피부를 가지고 있다. 이들은 엄청난 거리를 지나 태평양이나 다른 해역들을 마라톤처럼 여행하며, 기록상의 여정은 1만 6천km에 달한다. 코지아타 카벨레(Dermodysplasia carinata 또는 Dermochelys coriacea)라고 불리는 이 종류는 오직 미드지를 먹고 살아서 생태계 보호 상태가 매우 위급하다.
  reptile.lizard:
    label: 도마뱀
    summary: 따뜻한 지역에서 흔히 발견되는 네발 달린 비늘 있는 파충류입니다.
    info: 녹색 도마뱀은 중미와 남미에 서식하는 큰 종류의 도마뱀으로서 식물을 먹고 삶습니다. 등산을 잘하고 꼬리가 끊어졌을 때 재생할 수 있습니다.
  reptile.mamba:
    label: 매바
    summary: 아프리카산 매우 빠플러 하고 유독한 나무 도마뱀.
    info: '{"hint":"빠른 고독성 아프리카 나무 뱀(Dendroaspis)","info":"검은 매바는 세계에서 가장 빠르고 독성이 강한 둥지뱀 중 하나입니다\.\n땅 위에서는 시속 20킬로미터 이상의 속도를 낼 수 있으며나뭇가지를 탈 수도 있습니다\.\n항체 없이 그 신경毒素으로 인해 몇 시간 안에 사망할 수 있습니다\.\n''검은 매바''(black mamba)라는 이름은 입안 색깔을 나타내며몸통색(회색 또는 올리브 녹색 등)과 아무런 관계 없습니다","label":"매바","summary":"아프리카산 매우 빨라하고 유독한 나무 도마뱀."}'
  reptile.matamata:
    label: 마타마다
    summary: 남미 원주민인 비범하고 나뭇잎처럼 생긴 껌딱지.
    info: 마타마다는 남미 동부의 담수 지역에서 발견되는 매우 특이한 거북이다. 그녀의 등갑과 머리는 썩은 잎이나 가지를 완벽하게 모방하며 이는 독특한 위장술을 제공한다. 마타다는 치아로 사냥하지 않으며 대신 큰 입으로 물과 함께 식량물을 빨아들이고 다시 이를 닫는다. 아마존 강 유역에 서식하는 마타따는 정체된 수면 또는 천천히 흐르는 곳에서도 잘 적응된다.
  reptile.monitor_lizard:
    label: 바단
    summary: 분할된 혀와 함께 활동적인 포식성 크기로 큰 뱀장어.
    info: 바란은 분할된 혀를 이용하는 촉각 기관을 가진 바나누스 속의 큰 도마뱀입니다. 컴도오 바단은 세상에서 가장 커다랗게 자라며 길이가 세 미터 이상 됩니다. 이들은 지능적이어서 과학자들이 간단한 공구 사용 사례들을 관찰했습니다. 니罗 강 주변에서는 바드니크가 악어 알 먹음으로써 그들의 개체 수에 영향을 줌을 보았습니다.
  reptile.mud_turtle:
    label: 블라티프 잉어
    summary: 작은 미국 담수성 반지하 생활하는 거북
    info: ' błatívé želvé (kinostenron) 는 북미와 중미의 약간 크기인 수생용 코끼리다. 위협을 느낄 때 냄새샘에서 강한 향기를 내뿜는다. 건기에 점토 속에 파묻혀 혈액 순환을 멎추고 겨울잠 상태로 지낼 수도 있다. 이들은 곤충과 벌레 그리고 물 식물을 먹으며 올바른 영양 균형 유지가 가능하다.'
  reptile.mudskipper:
    label: 퍼리오펙탄티쿠스
    summary: 공기 속에서 걸으며 수평면과 나무 줄기에 올라가는 특이한 형태의 생선.
    info: 블라토노스 퍼리오판타무스는 고비목 어류로 물 밖에서 대부분의 시간을 보내며 젓가락 모양으로 움직인다. 이들은 두드러진 가슴지느러미를 이용해 진흙밭 위를 걷고 습한 피부와 함께 공기를 통해 호흡한다. 또한 갯벌 숲 나뭇잎 사이를 기어오르기도 하여 주변 영역에 대한 방어 및 활동적인 표시 행위도 보입니다.
  reptile.newt:
    label: .anchor
    summary: 해변이나 바위 위를 오가는 소형 어종이다.
    info: '{"hint":"작고 반수생성 앵두가미로 꼬리가 평평한 형태(Triturus)","info":"크라운 크레스티드 새螈은 중부 유럽에서 가장 큰 종으로 길이가 15cm 이상 자랍니다\. 번식기에는 수컷의 등과 뱀처럼 생긴 점들이 두드러집니다\.(중략) 체코 공화국에서는 모든 앵두가미류는 법적으로 보호받습니다\。(계속)(겨울철엔 나무뿌리를 따라 지하에 있거나 물 밖에서 구멍 속에서 보내요。")","label":"앵두가미","summary":"물도 산다 해양 및 육상 환경을 모두 사냥하는 작은 테일 포유동물입니다":[END]"'
  reptile.poison_dart_frog:
    label: poison dart frog
    summary: 열대 아메리카 지역의 작은 밝게 빠진 풀빛이 있는 곤충.
    info: 프레스니체카는 중미와 남아메리카의 열대 우림에 사는 덴드로바티다과 소형 개구리입니다. 붉은색, 파란색 및 노랑색 등 선명한 샛길들은 독성이 있음을 경고하는 역할을 합니다(아포제마티즘). 일부 종류는 지상에서 가장 유독한 척추동물들 가운데 하나입니다.
  reptile.python:
    label: 蟒
    summary: 먹잇감을 조여죽이는 대형 무독성 둥근뱀
    info: 파이썬은 세계에서 가장 긴 뱀으로서 그물무늬 파이썬의 경우 최대 약 7미터까지 자란다. 이들은 독을 사용하지 않고 목과 몸통 주변에 감아 숨지르기를 이용해 먹잇감을 죽인다. 또한 열수용체를 통해 어둠 속에서도 천적이나 사냥할 수 있는 포유류 등을 탐지한다.
  reptile.rattlesnake:
    label: 가시도마뱀
    summary: 꼬리의 뾰족한 돌기(가시)를 이용해 경보하는 유독성 파이톤.
    info: 가시도마뱀은 끝 부분에 가시를 가지고 있는 독한 도마뱀이다. 이 가시는 각질화된 막대로 구성되어 있으며 위협을 느낄 때 경고용으로 사용된다.
  reptile.salamander:
    label: mlok
    summary: 광택 있는 피부와 긴 꼬리를 가진 양서류입니다.
    info: 검은색과 노란색 반점이 있는 중앙 유럽의 보호받는 양서동물인 mlok skvrnitý는 독성 물질을 피부에서 분비하며 습한 숲 속에 서식합니다.
  reptile.sea_snake:
    label: 바다 도마뱀
    summary: 수생 생활에 잘 적응된 바닷속 독사를 말하며, 날카롭게 발달한 다리 대신 넓적꼬리를 사용하여 웃어요.
    info: 해양 환경에 완전히 적응한 해도는 히드로피나과의 독사이다. 수영을 위해 패들 모양 꼬리를 가지고 있으며 그들의 독은 뱀독보다 여러 배 더 강력하고 신경중추를 공격한다. 하지만 이들은 매우 평화적이며 물 속에서 숙소가 필요하다.
  reptile.skink:
    label: 스킨크
    summary: 매끄러운 광택 있는 털과 짧은 발달한 다리를 지닌 도마뱀
    info: 스킨크는 약 1천 5백 종 이상의 다양한 도마뱀으로 구성된 큰 가족이며 매끄럽고 회전 모양을 띠는 비늘이 특징입니다. 일부종은 다리가 짧거나 아예 없는 경우도 있습니다. 호주 파랑혀 스キン크라는 이름이 붙여진 특정 종류는 포식자에게 경계 신호로 눈에 잘 보이는 청색 혀를 내밉니다. 이들은 열대지역에서 사막까지 여러 생태 환경에서 서식합니다.
  reptile.snake:
    label: 뱀
    summary: 다리가 없고 유연한 몸을 가진 비늘 있는 파충류입니다.
    info: 뱀은 다리를 가지지 않은 긴 몸의 파충류이며, 3,700개 이상의 종이 존재합니다. 냄새를 맡아 사냥하며(야코프슨 기관), 일부는 독성을 지닙니다.
  reptile.snapping_turtle:
    label: 공갈거북
    summary: 강력한 입을 가진 미국의 대형 공격적 담수 거북.
    info: 미국의 큰 공격적인 담수 거북으로 강력한 훅 모양 부리가 있다. 육지에서는 침략적이지만 물속에서 더 평온하다. 무게는 최대 약 35kg이며 수명은 40년 이상이다. 포식자로서 생선과 연어를 사냥하고 죽음을 먹기도 한다.
  reptile.thorny_devil:
    label: 모로크 튼디
    summary: 호주의 가시 독특한 파우더스키 능력과 함께.
    info: 모로크 티니티는 수천 개의 날카로운 가시에 덮인 작은 호주 도마뱀이다. 이 동물은 척추 사이의 모세관 홈을 통해 피부를 이용해 물을 빨아들이며, 그 물이 바로 입으로 유도된다. 머리와 등에는 방어 전략으로 거짓 얼굴 같은 구조가 있다.
  reptile.toad:
    label: 개구리
    summary: 건강한 표면 생활하는 암фи비안 종류로서 개구리는 코끼리보다 더 마른 피부를 가지고 있습니다.
    info: 고어카 오보네가 체코 공화국에서 가장 퍼저 있는 개구리입니다. 기생충은 곤충을 짓지 않으며 방어와 독성 배설물의 원천으로 작용합니다. 매년 대규모 그룹 형태로 수역에 이동하여 번식하며, 청소년들이 도움 없이는 길 건너는 것을 보조해 줄 것입니다. 뱀과 베드버그 그리고 해충들을 먹이로 삶아 정원 손상 요인들의 자연적인 조절자 역할을 합니다.
  reptile.tortoise:
    label: 육상 거북
    summary: 땅에서 사는 돔 모양의 껍데기를 가진 느린 파충류입니다.
    info: 코끼리 거북은 세계에서 가장 큰 육상 거북으로 갈라파고스 제도에 서식하며 150년 이상 살 수 있습니다. 그들의 등갑은 골격의 일부분입니다.
  reptile.tree_frog:
    label: 뿔박쥐
    summary: 손끝의 젤처럼 생긴 마디로 잎을 타고 올라가는 나뭇잎 박쥐.
    info: 녹색 뿔박쥐는 희미한 광택이 나는 나무 위를 오르락내리락 할 수 있도록 손가락 끝에 액체 접착제 같은 발톱 패드가 있는 작은 도마뱀입니다.
  reptile.tuatara:
    label: туатара
    summary: 뉴질랜드의 살아있는 화석으로, 라인코펠리아(Rhynchocephalia) 목에 속하는 유일 생존종.
    info: 투아타라(Tuatara)는 세계에서 가장 오래된 파충류 중 하나로 공룡 시대부터 존재해온 유일한 종입니다.
  reptile.uromastyx:
    label: 우로마스티克斯
    summary: 아프리카와 근 동쪽지역 출신인 척추 끝 부분이 솟드라진 꽃다발 모양 꼬리를 가지며 사막 생태계에 적응된 파충류이자.
    info: 우로마스티كس는 아프리카 북부와 중동 및 인도의 사막 지역에 서식하는 특징적인 가시 꼬리를 지닌 도마뱀입니다. 이들은 방어를 위해 사용되는 날카로운 꼬위가 있는 것이 특징이며 엄격한 초식성으로 씨앗과 풀 그리고 잎을 먹습니다. 이러한 우로마스티크스 종은 악세서리로서 열대 어류 수족관에서 기르기도 합니다. 평균적으로 삶이 20년 이상일 것으로 추정됩니다.
  reptile.viper:
    label: 독충
    summary: 삼각형 머리와 비늘 모양 몸의 풀잎 같은 형태를 가진 돍사는 짐승이다.
    info: 체코에서 자연적으로 서식하는 유일한 독사입니다. 등에 꼬불꼬불한 무늬와 뿔처럼 생긴 침샘이 특징이며, 물린 경우 통증이 느껴지고 의료적 관찰을 필요로 하지만 건강한 성인에게는 거의 드물게 사망으로 이어집니다.
  reptile.wall_lizard:
    label: 벽등사자
    summary: 슬림하고 믿음직한 사자가 돌 언덕이나 건물 외부를 활보하는 모습이다.
    info: 이 종은 남유럽과 북서아프리카 원산지이며 체코에서는 도입종으로 뜨거운 바위와 벽면에 서식한다. 이빨을 물고 꼬리를 잘라 버리는 등 위험 상황에서 유연하게 움직인다. 기후 옹호로 인해 최근 몇 십 년간 더 추워진 지역까지 확장되고 있다.
  reptile.worm_lizard:
    label: 선형파충류
    summary: 지중에서 살아가는 선과 비슷한 형태를 띠고 있는 무족 포 유체.
    info: 줄기 모양의 표피와 퇴화된 눈을 가진 암필리스베니아(Amphibsaenia) 계열에 속하는 열대 아프리카 및 미국 지역에서 사는 거의 연구되지 않은 무족포 파충류입니다. 그들은 지하 생활 전반 동안 개미나螱음을 먹으며 특유의 오르가논식 움직임으로 이동합니다.
