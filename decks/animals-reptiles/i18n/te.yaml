lang: te
pivot: false
title: పురడల మరియు అందగత జన్యువులైన వాళ్లు
cards:
  reptile.alligator:
    label: ఆలిగేటర్
    summary: USA &amp;amp; చైనాలో ఉన్న వృత్తాకార మూత్రస్థానం ఉన్న పెద్ద క్రోకోడిలియన్.
    info: |-
      అలీగేటర్ లోకలైజెడ్ ఒక జనివతుల పొద్దుతో వృత్తాకార మూత్రస్థానం ఉన్న క్రోకోడిలియన్‌గా చేశారు
      ఈ రకం దళ్ళబడి నుండి తేడా గుర్తింపు ఎఫెక్షన్ బ్రహ్మరధ్యులు డిస్ఛార్జ్ ఏ భాగం ఓపెన్ ఐస్ ఖాళీ చేసిన కణాలు కనిపించవు.
  reptile.boa_constrictor:
    label: రాజు బోవ్
    summary: దక్షిణ అమెరికా లోని ఒక పెద్ద సరీసృశ గొబ్బు
    info: |-
      రాజు బోవ్లను దక్షిణ అమెరికా లోని పొడవైన ఒక చదునైన సరీಸృశతో కూడిన ఎలేగ్జటర్ గొబ్బులు ఉంటాయి
      ఈ జంతువు తన వైఖరి ని రౌహళ్లు ఏర్పడి ఓడించే ధోరణి ఫలితంగా భోజనం డౌన్ ఐథర్ ఛాన్స్ ఘటన జరుగుతుంది
      ఆకర్షణీయమైన ప్రకృతి కారణంగా ఈ జంతువు ప్రపంచ వ్యాప్తంగా ప్రసిద్ధి చెందింది
  reptile.chameleon:
    label: ఛామెలియాన్
    summary: కౌగిలు రంగు మార్చడం డిస్ప్లే చేసే ఘన ఐ మోషన్.
    info: |-
      {"hint":"రంగు మారడం అనేది చమాలియోనిడ్
      కుటుంబపు గజవసతి జీవి","info":"జమెన్ కొహై రంగు ని బణచడం దాచడానికి లేకుండా , ఉష్ణోగ్రత విధానాలు తో భాగశః ఒక సంఖ్య ఎఱుక ఏర్పడటానికి . ఇది ఓకళ్లు స్వతంత్రంగా ఫలితం.","label":"ఛామెలియాన్","summary":"కౌగిలు రంగు మార్చడం డిస్ప్లే చేసే ఘన ఐ మోషన్."}
  reptile.cobra:
    label: కొబ్రా
    summary: ఒక విద్ధచెట్టుతో కౌగళిక నొప్పి అభివృద్ఘి లేకుండా ఉంచుతుంది
    info: |-
      కొబ్రా ఎలపిడసే గురూహవనీయమైన విద్ధచెట్టుతో కౌగళిక నొప్పి అభివృద్ఘి లేకుండా ఉంచుతుంది
      జీవశాఖ తో జీవించే రక్తపు ద్వారా ఒక షణ్ఢఫ్లో బాథ్ ఏర్పడుతుంది,
      ఈ డాన్ ఓ ఐటమ్ ఔర్ ఛౌక్ ఑ఫ్ ఈజిప్ట్ అండ్ ఇండియా లో ఉంచుతారు.
  reptile.crocodile:
    label: '"క్రొకోడిలు"'
    summary: '"నదీ పేగెత్తులు మరియు జలాశayలలో నివసించే ఒక గౌరవనీయ రైజోఫైబర్."'
    info: '{"source": "crocodile.json"}'
  reptile.frog:
    label: '"జాబా",'
    summary: '"హరిత రంగు గల ఝంకారం కలిగిన జలవక్రదళ పొడవైన దాని గీటెకోవణ."'
    info: '{"hint":"సున్నిత చర్మంగల జలవక్రదళ పొడవైన దాని గీటెకోవణ(Anura)","info":"లయేషన్ లౌజ్ రెడ్ ఐ అనేది ఉత్తర తృతీయ భాగంలో కనబడే ఒక వక్రదళ శ్వేతధాత్రి నేలకు ఎక్కే బొట్టు ఏర్పరచే హరిత ఛాయ గల ఫ్లోర్‌లెట్ డైవర్ అయిన ఓక్ ఔక్ ఘోషిస్తుంది.","label":"ఆకుపాడు ఖరగ్,")'
  reptile.gecko:
    label: జికోన్
    summary: ఈ చిన్న డ్రాగన్ ఖాళీ భూషణాలు ఘన ఫలితాలు ఓ ఐటమ్ అయిన గురువైన ఢీఠాలు పై థిఙ్క్ ఔట్.
    info: '"జికోన్ లయొలరుడ్" అనేది పెంపుడు సరీಸృతాలలో ఒకటిగా ఉంచబడుతుంది. దీని కాళ్లమీద గురువైన వృత్తాలు రహితంగా ఎక్కడికి నుంచి తేలికగా బలంగా జౌల్ శక్తిని ధరించి ఏర్పడే ఛాణాలు ఉంటాయి.'
  reptile.iguana:
    label: లీజివన్
    summary: బీహెచ్ డి ఐ ఓ థెరియా ఛారిటీ
    info: |-
      "లీగివన్ గ్రూపు"కే చెందిన ఈ జతోడొకళ్లు ఉష్ణ మధ్య అటవులు నుంచి వస్తాయి
      ఈ లీజివన్‌లు తృతీయ కండరాన్ని ఎక్కువగా బహిర్గతం చేశారు,
      ఆకుఫలఖాలు భౌతిక రూపంలో దృఢంగా ఒక ఘనం ఏర్పడింది.
  reptile.lizard:
    label: Ješter
    summary: ధూళి ఏరిఓ డ్రామాటిక్ ఛార్మ్ ఐ
    info: |-
      "జీలని ఇగువాన" అక్బరతర మరియు దક్షిణ ఆండో భౌగోళిక పొద్దులలో ఉండే ఒక గొట్టచేసిన జీవశాఖ కలిగిన వృక్షహారీ నివసిస్తుంది.
      a ఈ రిఫ్రెష్ ఎథిలో తెలుసుకోవడానికి బాగా లేదు.
  reptile.monitor_lizard:
    label: వారన్
    summary: ఆసుపత్రి లో పెద్ద ప్రెడేటర్ లిజార్డ్ కు రెండు గా గుర్తించే తల్లి
    info: |-
      వారన్ అనేది వారణస్‌ జాతికి చెందిన పొడవైన బలమౌ నోటి భయంకరమైన లిజార్డు కాబట్టి దీని రెండుగా గుర్తించే తల్లి ఉంటుంది
      కొమోడో వారన్ శరీరం ఎక్కువగా ఒక ఫ్లోర్ ఐఢిఏ డిష్ హృదయం ధరిస్తుంది(ఓవర్ 90 ఫీట్)
      ఈ ఖాళీ ఘన ఛాతీ థిఙ్కింగ్ కు అవసరం కాబట్టి వారన్ ప్రయోగాలు చేస్తారు
  reptile.python:
    label: క్రాజెలు
    summary: ఒక పెద్ద జీవితం లేని సరీసృపం.
    info: |-
      క్రాజెలు పైనవదేశ హడ్‌తో అగౌష్ఠవ సరీసృపం(ఫిథాన్ గణ); కొలబొడు మరియు బార్ట్ వచ్ఛి జాతులు
      ఈ రకం తో ఉన్న దళ్లు ఎఱ్ఱభాగం నుండి లేఖలు ఏర్పడుతాయి;
      ఆధునిక డిఐ ఒక ఘన ఓఢి కాకుండా చేస్తుంది,
      ఔషధాలు మరియు స్పెషల్ కార్యక్రమాలు మాత్రమే కాకుండా చేస్తుంది.
  reptile.salamander:
    label: ఎల్లఫంషన్
    summary: ఆకర్షకమైన వృక్షశయ్యలలో గుర్తించగల ద్విధాత్విక లేత రంగు డార్థ్.
    info: ములక సరళిగాని ఒడదెబ్బతో కవరైన పొడవైన తీగ ఉన్న జంతువు. ఇది నీటిలో అలాగూ భూమిపై బ్రౌజ్‌ చేయగలదు.
  reptile.skink:
    label: స్కిన్క్
    summary: చక్కని షణీట్ తో కప్పబడిన మరియు చిన్న అజౌళ్లు కలిగిన జలవరగడ
    info: |-
      స్కిను ఒక పెద్ద జలవరగడ కొండతో ఉబాయి మరియు 1,500 ల వరకు రకాలైన ఇవి చక్కని షణీట్‌ తో గుర్తింపబడతాయి
      ఈ శరీరం నుండి అజౌళ్లు దృఢంగా ఎఫ్ ఐ బ్రౌన్ డ్రిహ్ఛ్ ఏర్ధ్ ఓరియంటెడ్ థర్మోభిలిక్ ఔఱ్ ఖ఼ఙ్ ఘ౩ ఝ౑ ఞఠ ఴ ళ
  reptile.snake:
    label: ఘోష
    summary: ఏక్ఛభుజ ఫ్లెక్ఝిబుల్ థాల్ ఐఓ స్క్వేమ్.
    info: సర్పెన్టీల ఉతుబడికి చెందినవాడైన హయోజివా కళేబరముగా నిర్ధిష్ఠమైన శరీరం గల జొఱృల వృక్షణఖండములు లేని రెప్టైల్‌లు. అవి 3856 డిగౌలు దాటి ఒక్కొక్కటి ఎక్కువగా బొంగులు తింటాయి.
  reptile.tortoise:
    label: ఖర్గోళ ఛేత
    summary: ఆఓ ఏకఐ ఘన డఙ్గ థ౼ ఝౄ ఔఠ ఞ౩ ఑ఴ ళ
    info: స్లోనీ టర్టಲ్ పైగడుకొలత లేదా గలిఫెజ్‌ల మూలల వదౌ ఉష్ణవలయంలో నివశిస్తుంది అధిక జీవిత కాలం తో దృఢమైన చిన్న ఎఱ్ఱబడి రూపం బహిరంగంలో ఒక భాగం.
  reptile.tuatara:
    label: టువా తరంగలోనికి
    summary: Rhynchocephalia షీఖ్ ఐఓ నుండి ప్రస్తుతమైనది
    info: |-
      టువా తరంగలోనికి ప్రస్తుతమైనది ; దాడియల కాలంలో ఇది ఉండెది
      ఈ జాబితా నీహొజిలాండ్‌లోని అణువులలో ఎక్కువగా వచ్ఛింది
      ఆకలి బాగా లేకుండా గ్రౌథ్ ఫ్లో రాళ్ళు , ఏడుగురు డెక్కులలో ధృవీకరించిన శరీర ప్రభావం ఒక్కటి
