lang: te
pivot: false
title: పురడు మరియు అందుబాటులోని జీవులు
cards:
  reptile.chameleon:
    label: చేమిలియన్
    summary: కళ్ళు కదిలే శరీరం రంగు మార్చే సరీಸృపం.
    info: జెమ్స్ చేమిలియన్ తన దృఢత్వాన్ని లేదా ఉష్ణోగ్రతను నియంత్రించడానికి బదులు సహసంబంధం కొరకే రంగు మారుస్తుంది. అది వైవిధ్యమైన గుఱ్ఱపు కండ్లు కలిగి ఉంటుంది.
  reptile.crocodile:
    label: క్రోకోడైలస్
    summary: నదులు మరియు జలాశayల వద్ద ఉండే పెద్ద పురాతన రెప్టైల్.
    info: నీలో క్రోకోడైలస్ అనేది లోకలో ఉన్న అతిపెద్ద రెప్టైల్‌లలో ఒకటి. దీని నివాసం ఆఫ్రికా మరియు ఇది నీటి నుండి గొప్ప బంధుకాలను చేస్తుంది. ఇది ఎప్పటికీ జీవించే ఏ జంతువుకంటే తీవ్రమైన బంధుకాలను కలిగి ఉంటుంది.
  reptile.frog:
    label: పురుగు
    summary: కాల్చిన కళ్ళతో ఉన్న ఒక ఆకుపచ్చ దూకడానికి అద్దమైన జీవి.
    info: రెడ్ ఐడ్ ట్రేడ్ లిస్ట్ వాల్ లాటిన్ యామెరికా నుండి తెచ్చిన ఒక ఉష్ణమండల రెండు భుజాల బొమ్మ. ఇది గుబ్బల శిరస్సులలో జీవిస్తుంది, ధిమ్ముల మధ్య ఉన్న ఎముకల సహాయంతో పాఠశాలలో ఉంటుంది మరియు రాత్రి సమయంలో చురుకుగా ఉంటుంది.
  reptile.gecko:
    label: జీకాన్
    summary: లేత ఉపరితలంపై తెగబడే చిన్న సరీసృపం.
    info: జీకాన్ లేదా జీకోన్ అనేది గురుతరమైన హౌస్ రెప్టైల్. దీని కాళ్లపై నుంచి వేల కొద్ది బాలు ఉంటాయి, వీటి కారణంగా దీనికి ఎక్కడికి ఎక్కవచ్చు. ఏ డ్యూష్ లేదా శ్వేత ధాత్రి లేకుండా ఒక గురుతరమైన ఫ్యామిలీ జీకొనిడే సభ్యుడు.
  reptile.lizard:
    label: జేష్టర్
    summary: గరికల పైన ఉండే నాలుగు కాళ్లతో గుర్తించబడే శిలీంద్రము.
    info: జీవితంలో ఒక వృక్షస్థ జీవి, దీని ఆహారం మొక్కలు. అది బాగా ఎక్కడానికి తెలుసు మరియు కొంత భాగం కోల్పోయినప్పటికీ పునరుత్పత్తి చేసుకోగలదు.
  reptile.salamander:
    label: ములక్
    summary: దీర్ఘ వైపుతో ఉన్న తేడుగా కవర్‌ చేసిన జీవి.
    info: ఎరుపు-నలుపు దెబ్బలు గల ఒక అంతర్జల జీవి, ఇది బొట్టు నుండి విష పదార్థాలను విడుదల చేస్తుంది మరియు తేమగా ఉన్న అడవులలో నివసిస్తుంది.
  reptile.snake:
    label: సర్పం
    summary: నడక చెవులు లేని దీర్ఘ శరీరం ఉన్న ఎలుగబాల జీవి.
    info: సర్పాలు అణువులతో కప్పబడిన నది వంటి మృదువైన శరీరం గల ఒక రకం ఎలుగబాల జీవులు. వీటి రకాలు 3700 కంటే ఎక్కువ ఉన్నాయి; వీటిలో కొన్ని వాటి వల్ల బాధ కలుగుతుంది.
  reptile.tortoise:
    label: భూ శరీర కవచపిల్లక
    summary: గడ్డము ఉన్న ఒక నెమ్మదిగా సాగే జంతువు.
    info: ఎలిఫంట్ టర్టిల్ అనేది లోక దిగ్బంధంలో గల పెద్ద భూ శరీర కవచపిల్లక. ఇది గలాపాగొస్ వద్ద నివసిస్తుంది మరియు 150 ఏళ్లకంటే తక్కువ బ్రతకదు. ఈ కవచం దాని హాస్య రచనలో భాగం.
