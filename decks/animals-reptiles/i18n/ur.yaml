lang: ur
pivot: false
title: کیڑے اور دوسرے جانور
cards:
  reptile.chameleon:
    label: چمیئون
    summary: ایک جانور جو اپنے رنگ تبدیل کرتا ہے، حرارت کنٹرول کرنے والی آنکھوں کے ساتھ۔
    info: چمیئون جمنسکی رنگ بدلنے میں نہ صرف خود کو چھپانے بلکہ برقرار رکھنے اور گرمی کنٹرول کرنے کے لیے استعمال کرتا ہے۔ اس کی دونوں آنکھیں الگ الگ حرکت کرتی ہیں۔
  reptile.crocodile:
    label: کروکوڈائل
    summary: نیل کا سانپ، دریاؤں اور جھیلوں میں رہنے والا قدیم پلاز ہے۔
    info: نیل کا کروکوڈائل دنیا کا سب سے بڑا پلاز ہے۔ یہ آفریقہ میں پایا جاتا ہے اور پانی سے شکار کرتا ہے۔ اس کے چباﺅ تمام زندہ حیوانات میں سب سے مضبوط ہیں۔
  reptile.frog:
    label: مینڈیب
    summary: چاروں رنگ کا ایک سکواش کرنے والانامکمل جانور ہے۔
    info: لائسٹوفنس چرمنوؤکا لاطینی امریکا کی ایک گرم علاقائی دوسرے حیاتیاتی زندہ مخلوق ہے۔ وہ درختوں کی چھتریوں پر رہتی ہے، انگولوں کے درمیان تھیلیوں کے ذریعے پرواز کرتی ہے اور رات کے وقت فعال رہتی ہے۔
  reptile.gecko:
    label: جیکون
    summary: ایک اُبھال کر لے جانے والا سطح پر چڑھنے والا ہرشپ
    info: جیکون لوگوں نے تربیت دینے والے میمفل حیوانات میں سے ایک مشہور قسم ہے۔ اس کے قدموں پر لاکھوں بے حد چھوٹے بال موجود ہوتے ہیں، جو اسے پتھروں اور دیواروں پر رکھنے کی اجازت دیتے ہیں، نہ کہ کوئی چسبائی۔
  reptile.lizard:
    label: جیسٹر
    summary: گرم علاقوں میں پائے جانے والے چار ہاتھوں والے اور سکین کا تعلق پلز سے ہوتا ہے۔
    info: سبز آئوانا وسطی اور جنوبی امریکا کا بڑا جیسٹر ہے۔ یہ فروغ دینے والی چیزوں پر غذائیت حاصل کرتا ہے، یہ ایک خوبصورت پہاڑی چڑھنے والا ہے اور ذیلی قسم کے چمتوں کو دوبارہ بنانے کی صلاحیت رکھتا ہے۔
  reptile.salamander:
    label: مُلُوک
    summary: ایک تالاسرا جانور، نمدار اور لمبی ذنب کے ساتھ۔
    info: مُلُوک سکِرْنٗٹا وسطی یورپ کا تحفظ یافتہ دوسر حیاتیاتی جانور ہے جس پر زرد اور کالی سکرن میں موجود ہوتی ہیں۔ یہ اپنی جلد سے جہلاندار مواد خارج کرتا ہے اور گیلا درختوں والے جنگلوں میں رہتا ہے۔
  reptile.snake:
    label: سیب
    summary: ہاتھ اور پاؤں کے بنا چمکدار جلد والا سانپ۔
    info: سیب لمبے، خشک جسم کے ساتھ نجاستوں کے حشرات ہوتے ہیں۔ ان میں سے تقریباً 3700 قسمیں موجود ہیں؛ وہ گنداسن کے ذریعے شکار کرتے ہیں (جاکبسون آرگن) اور بعض زہریلے ہوتے ہیں۔
  reptile.tortoise:
    label: ساحلی کچھل
    summary: زمین پر رہنے والا جلدی نہ ہونے والا سانپ جو ایک گولائی دار ڈھانچے میں رہتا ہے۔
    info: سلاونی ٹورٹلس دنیا کی سب سے بڑی زمینی کچھل ہے۔ وہ گالاپاگوس جزائر میں پائی جاتی ہے اور 150 سال تک عمر بھی حاصل کرسکتی ہے۔ اس کا ڈھانچا اس کی ہڈی کا حصہ ہوتا ہے۔
