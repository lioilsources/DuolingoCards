lang: ur
pivot: false
title: کیڑے اور دوسرے جانور
cards:
  reptile.agama:
    label: اگامہ
    summary: افریقا کی روشن لرزندہ؛ مرداً واضح رنگدار
    info: اگاما، افریقہ، جنوب شرقی آسٹریلیا میں پائے جانے والے سبز رنگ کے بالغ حشرات ہوتے ہیں۔ انکی قسموں کی تعداد دوسروں کے مقابلے میں زائد چارسو بھی واقع ہوا۔ بعض خصوصیت کے طور پر نمایاں رنگین منڈولوں والا عضد درج ذیل فطری تنوع کے تحت شامل ہوتا ہے۔
  reptile.alligator:
    label: الائگٹر
    summary: USA اور چائنہ میں پیدا شدہ لمبا الائگٹر جو مندل تو ہوا ہوا ہے۔
    info: |-
      امریکن الائگٹر زندہ اور موجودہ دو قسم کے الائگٹروں میں سے ایک ہے، جبکہ دوسرا چھوٹا صینی الائگٹر ہے۔
      ایسے پانی والے علاقوں میں رہتے ہیں جہاں ان کا مندمل ناخوت والا حلقہ وسعت اختیار کرتا ہے، لہٗذلئے کپڑا بنا کر تبدیل ہوجاتا ہے。
      جغرافیائی طور پر امریکن الائگٹر جنوب مشرقی اتحادی خصوصی مقامات، دریاؤں اور لاکھوں آدمیوں کے ذمّہ دار فطری نظام کے تحفظ کے لئے ضروری ہے۔
  reptile.anaconda:
    label: انکونڈا
    summary: دنیا کا سب سے بھاری مچھروں والا جملہ جو امازون کے موذوماتوں میں موجود ہوتا ہے۔
    info: ہرینا انکوندا دنیا کے سب سے بھاری مچھروں میں شامل ہوتی ہے؛ اس کی خواتین بالائی نو منٹ جانوروں تک وزن حاصل کرتی ہیں، پانچ لے کر چھ مترا لمبا۔ وہ شمالی آمریکا کے زمیندار علاقوں کے دریاؤں اور موذوماتوں میں رہتی ہے۔ وہ شعاعی، طوطے، قابیراس، اور الگئنس کو شکار کرنے والی ہے۔ فرق کے مقابلے میں وہ غلظ توڑتا ہوا مرغوب ذخائر پیدا کرتی ہے۔
  reptile.anole:
    label: انولس
    summary: ایک چھوٹی آمریکی جھلہ جو رنگ بدلتی ہے؛ مردا خصوصی لوافروں والا
    info: انولس امریکا کے تقریباً چار سو قسم کی جھلہ بدلنے والی لمبائی دم لizards ہوتی ہیں۔ مرد انولس میں رنگدار ٹراؤتھ فلوپ، وقفے پیداوار کرنے اور عورتوں کو حوصلہ شامل ہوسکتا ہے۔ زرد انولس درجۂ حرارت اور موڈز کے طبقات کے ذریعہ نیلا سے بنالاسکتا ہے۔
  reptile.axolotl:
    label: اکسو لوٹل
    summary: ایک ماکسیکن آبی سالمیندر جو تمام عمر انفانتائی کی وجہ سے مشہور ہے۔
    info: اکسولوٹل میکزیکن وادھ سالامانڈر کے نام سے جانا جاتا ہے، اور یہ بچپن والی خصوصیت پوری زندگی برقرار رکھتا ہے۔ یہ لاروا کی حالت کی علامتوں بشمول باہمی فلوموں کو تبدیل کرنے کی صلاحیت رکھتا ہے۔
  reptile.basilisk:
    label: بازیلسک
    summary: '''بازیلسک'' شمالی امریکا کا ایسا ٹائم ہے جو وقتا فوقتا پانی کی سطح پر دوڑنے کی صلاحیت رکھتا ہے۔'
    info: بازیلیسک سرخ کا اصل نام 'جیسو' جانور بھی کہلاتے ہیں، وہ پانی کی سطح پر دوڑنے میں قابل ہوتا ہے۔ ان کے رگڑدار انگُلوں میں فضا ذرات سمائی لینے والے تار موجود ہوتے ہیں جو آسانی سے پانی کے زیر水面 حرارت حفظ کرتے ہیں۔ عام طور پر وہ بغیر غرقاب ہونے کے چودہ مختلف متراً دورتک دوڑتا ہوا چلا جاتا ہے۔ مرد بازیلسک کے سروں اور بالشتِر کے عقب میں خاص شقّ وجود رکھتے ہیں۔ درختوں پر چھپنا ان کی بنیادی تحصیل حمایت کا حصہ ہوتا ہے۔
  reptile.boa_constrictor:
    label: بُواۓ کونستروٗچِر
    summary: جَنوبي امریکا کا لمبا درجندا ہد.
    info: بُوائے کانسٹرکٹور جنوبی امریکا سے تعلق رکھتے ہیں۔ وہ غیر زہر آلود حشرات پر قابض ہوتے ہیں، انہیں مارنے کے لئے نمایاں طرح سے بندش استعمال کرتے ہیں۔ شکار کے ہر باہر سانسوں کے دوران عضلّات مضبوط کردینگے، جو فضا کے داخلے کو روک دیتا ہے۔ آرام والی شخصیت کی وجہ سے لوگ خصوصی پالتو جانوروں کے طور پر ان کو منتخب کرنے کے لئے مشہور ہیں۔
  reptile.box_turtle:
    label: شکتو لووا زلووا
    summary: ایک چھوٹی جھونپڑی والی مچھر بالکل داخل ہوجانا کرونوئر کے ذریعے
    info: شکتولووا زلووا شمالی امریکا کے جھونپڑی والی مچھر سانس لینے والا، تحرّک پہلی صفحات کرونویر نامور بندوبست۔ وہ درختوں اور گائیدارن انفرادی حیوان کے طور پر رہتا ہے۔ اس کی عمر دوسروں کی خدمت میں 100 سال سے زائد ہوتی ہے؛ آزاد فطرت میں 40 سے 60 سال کی عمراوقعت کرتی ہے۔ امریکی موافقت عام طور پر قانون کے تحت تحفظ حاصل ہے اور مختلف علاقوں اس کی ذاتی ضمانت کو روکتے ہیں۔
  reptile.caecilian:
    label: چرووروواکس
    summary: ترموں والے خطوط میں پائے جانے والا ایک بے پا جانور، جو اُماج اور ہادوؤں کی تصویر کشی کرتا ہے۔
    info: چرووروواکس ایک بے پا جانوروں کا وہ حشرات گرمنفونيا سے تعلق رکھتا ہے، جن کا مطالعہ نسبتاً کم ہوتا ہے۔ ان کا زندہ وجود دباؤ والی علاقوں میں موجود ہوتا ہے۔ یہ لمبا خارش لینڈ یا شلغم طرح کا ظاهر اختیار کرتا ہے۔ چرووروواکس کی آنکھیں چھوٹی اور غیر فعال ہوتی ہیں؛ وہ بو کرنے اور ہدایت کردہ آلۂ سماعت کے ذریعے راستہ درست کرتے ہیں۔ بعض قسمیں تو بالخصوص ماں کے پیدائش کے بعد بچّے پالتی ہیں، جبکہ دوسرا حصہ انڈوں کو رسپاس کرتا ہے۔
  reptile.caiman:
    label: کمان
    summary: جنوبی امریکا کا موٹر نسبتاً موٹر یا الیگیٗٹر سے چھوٹا
    info: کیمن برائے لوو جنوب امریکا کا سب سے عام مچھروں والانہیں ہوتا۔ واقعی موٹر نسبتاً گندم زور دار بڑا؛ تقریباً ۲،۵ مترا درجات پر فائز رہتی ہے۔ ان کا قحط مرغزار، لاکھدار حوض اور غلظ خشخاش کے علاقوں میں موجود ہوا کرتا ہے جس کا آغاز میکسا اور اختتام Argentine میں ہوتا ہے۔
  reptile.chameleon:
    label: چمیئون
    summary: ایک جانور جو اپنے رنگ تبدیل کرتا ہے، حرارت کنٹرول کرنے والی آنکھوں کے ساتھ۔
    info: چمیئون جمنسکی رنگ بدلنے میں نہ صرف خود کو چھپانے بلکہ برقرار رکھنے اور گرمی کنٹرول کرنے کے لیے استعمال کرتا ہے۔ اس کی دونوں آنکھیں الگ الگ حرکت کرتی ہیں۔
  reptile.cobra:
    label: کوبرا
    summary: خوددار ہونے والا جہر لات سانپ؛ جہر لات وضع اختیار
    info: کوبرا ایلپائڈے کا جہر لات سانپ ہوتا ہے، خصوصتاً وارنگ دینے والی حالت میں سر کے پشت کھال بچولت کا مشہور معروف عمل رکھتا۔ نوروٹอกسن آلات ذهنی نظام کوفروغ دیتا ہے۔ مصر اور اندا کوبرا فرشتوس کا قومی علامت ہے۔ بلند ترسیلا کوبرا (ناجا نِجربُلوَلس)، دو متائر سے زائد دوری پر سمٗ کو باقاعدہ طرح سے شمارش کرنے کا صلاحیت رکھتا ہے، جبکہ اس کا مقصد آنکھوں کو بنانا ہوتا ہے
  reptile.crocodile:
    label: کروکوڈائل
    summary: نیل کا سانپ، دریاؤں اور جھیلوں میں رہنے والا قدیم پلاز ہے۔
    info: نیل کا کروکوڈائل دنیا کا سب سے بڑا پلاز ہے۔ یہ آفریقہ میں پایا جاتا ہے اور پانی سے شکار کرتا ہے۔ اس کے چباﺅ تمام زندہ حیوانات میں سب سے مضبوط ہیں۔
  reptile.flying_dragon:
    label: ڈراک ولنس
    summary: جنوب مشرق آسٹریا کا چھوٹا سانپ دار حشر، جبکہ بڑھئے ہوئے رسوں پر مواد کے ذریعے حرکت کرسکتا
    info: ڈریکو فلائینگ جنوب مشرق آسٹریا کے ایک نہایت چھوٹا سانپ دار حشر ہوتا ہے، جو بڑھئے ہوئے رسوں پر تارتازم ختم شدہ بالوں کی وجہ سے لفافہ قسم کی مواد استعمال کرتا ہوا علاقوں کے درمیان حرکت کرنے کی صلاحیت رکھتا ۔ وہ درخت سے درخت تک چلنے والے مقاصد مثل خطۂ زندگی کے تحفوں یا شکار کے دوران فرار کے لئے بلاتعیر طور پر حرکت کرتا ہے۔ مرداً ان لوگوں کے گرد غصّہ کا واضح روشن حصہ موجود ہوتا ہے۔ یہ حرکت اصلی پروں کے ذریعے نہیں بلکہ فقط چلتا ہے۔
  reptile.frilled_lizard:
    label: لمکوا اگاماس
    summary: ایک جسترجو درخشاں لنف کھلنے اور دوروں پر براجمان ہونے کے علاقوں میں مشغول
    info: اگاما لمکوا ایک آسٹریلین پستاندہ جانور ہے، جو خطرات کے وقت تھنڈربول رقبہ والے سنسروں میں دفاعی نشان بنائے۔ وہ بپیدال انداز میں دونوں قدموں پر لمحۂ فرار حملہ کرتا ہے، جبکہ عام طور پر لمبا سوزن شکل اختیار کرنے والا چمڑا موجود ہوتا ہے۔
  reptile.frog:
    label: مینڈیب
    summary: چاروں رنگ کا ایک سکواش کرنے والانامکمل جانور ہے۔
    info: لائسٹوفنس چرمنوؤکا لاطینی امریکا کی ایک گرم علاقائی دوسرے حیاتیاتی زندہ مخلوق ہے۔ وہ درختوں کی چھتریوں پر رہتی ہے، انگولوں کے درمیان تھیلیوں کے ذریعے پرواز کرتی ہے اور رات کے وقت فعال رہتی ہے۔
  reptile.gecko:
    label: جیکون
    summary: ایک اُبھال کر لے جانے والا سطح پر چڑھنے والا ہرشپ
    info: جیکون لوگوں نے تربیت دینے والے میمفل حیوانات میں سے ایک مشہور قسم ہے۔ اس کے قدموں پر لاکھوں بے حد چھوٹے بال موجود ہوتے ہیں، جو اسے پتھروں اور دیواروں پر رکھنے کی اجازت دیتے ہیں، نہ کہ کوئی چسبائی۔
  reptile.gharial:
    label: گاوُل
    summary: ایک فشرخ کروکوڈائل جانوروں کا شمار کرتا ہے۔
    info: گاول جو کروکودائل سے تعلق رکھنے والی ایک حیات آباد ہے، جس میں بڑا لمبا پتل وار نساں خصوصیت ہوتا ہے۔ مرد انچل کے بالائی حصے پر 'غرا' نامی عضواالاسعٗ موجود ہوتا ہے۔ یہ شمالی ہندستان اور نپال کی دریاؤں میں زیرِ وجود ہے۔
  reptile.gila_monster:
    label: |-
      جلا
      (ہیلوڈرم)
    summary: امریکن جنووبی غرب کا جالدرو قسم کا جلدوار
    info: |-
      ہیلوڈرم جلا، امریکن ساؤتھ وسٹ میں پائے جانے والے دنیا کے تقریباً خطرناک زمینی سپلز میں شامل ہوتا ہے۔
      اس کو رُوزر آورنج براﺅنز فارمولہ والا مواد حملہ کرنے کے لئے استعمال ہوتا ہے。
      ایسا نشاستہ درندگان کے ذرات کے نظام کے طور پر ان کے دانتوں کے ذخیرہ کے عوض استعمال ہوتا ہے۔
  reptile.glass_lizard:
    label: سلیش
    summary: بدنوحا چھڑند ہے، حالانکہ یہ حاطم نہیں ہے؛ اس کا حرکات شدہ نظردار درزا ہوتا ہے۔
    info: "سُلیش عالم عام جو اوروپا کے پورے خطہ میں رہتی ہے، حطیم سانپ لگنے والی بدنواحی چھرند ہوتی ہے۔\nحطیموں کے مقابلے میں انکے حرکات و تحرک کرنے والا نظیر دار درز موجود ہوتا ہے اور آذانی سوراخ。\nدفاع کے طور پر وہ ذنب الٹ کردینے کی صلاحیت رکھتا ہے؛ ذنب فرشتوں کو دوبارہ بنالیتی ہے۔ \nچیک جوملوں میں قانون کے تحت تحفظ حاصل ہے اور جنگلاتی اور زرعی باوقوع مقامات دونوں میں مشترک ہے۔"
  reptile.hawksbill_turtle:
    label: کارتکا درست
    summary: ناجائز معاملات کی وجہ سے بالکل خطرے میں ڈوبی ساموتی چھلانگ
    info: کریٹا کارپس اور جانوروں دونوں پر مبنی تھے۔ انہوں نے سمندری زلزلا کو بچایا، لیکن غیر قانونی دکانات ان کو ختم کرنے والی بن رہی ہیں۔ وہ صرف طاسوں اور گوندروں کے عمارتوں میں موجود حشرات اور آبی ذخائر کالعدم کرتی ہیں۔
  reptile.horned_lizard:
    label: جیسترش رُوحَتِه
    summary: ' شمالی امریکا کے صحرا میں پائی جانے والی روحت والی تخت، خاردار سپ'
    info: روہت جیسٹرکا امریکن صحراؤں میں پائے جانے والی تخت، خاردار سپ کھرا۔ وہ بچوں کے لئے نمایش دینے والا آبشار بناتا ہے، جو فطرتاً حرارت زدگی کا باعث بنتا ہے۔
  reptile.iguana:
    label: سبز لیگوان
    summary: ایک درختوں والا موذون جانوروں کا قسم جو امریکا کے ٹروپکل خطوط میں موجود ہوتا ہے۔
    info: لیگوآن سبز اتر کے ممالک کا بڑا جانور ہوتا ہے، جس کی لمبائی دوم تک پہنچتی ہے۔ اس کے بالشت والے منھر کے علاقوں میں روشنی کے تغیرات کا تعقبن لازم ہوتا ہے۔ وہ خود فطرتاً آئشواح نظر اندازا رہتے ہیں؛ حملوں کا مقابلہ طاقت کے ذریعے کرتے وقت اپنا منھر زد کرنے یا بدلتی رنگت کا استعمال کرتے ہیں۔
  reptile.king_snake:
    label: ہد کرالوکي
    summary: آمریکن غیر زہریلا سانپ ہدا کرالوا رتسلسنک کے زہر کے مقابلے میں مناعتی ہوتا ہے، دوسروں ساماء کا شکار کرتا ہے۔
    info: "ہاد کرالوکا ایک غیر زہریلے آمریکن سانپ ہوتا جس میں دوسروں زہریلا حشرات، شامل رتھلسناکز خوراک بنتا ہے۔ وہ ان حشمات کے تعلق والے زہر پر مناعتی ہوتا ہے۔\nاس کا رنگ (سوٹ فارم) قرمزی نمونہ لینے والا چونا ظاہر کرتا ہے。\nایسا ضبط کرنے والے موئس، طوطے، اور reptiles کے عمارتوں کا بنائے گا۔ \nیہ لوگوں کے درمیان عام مشغولیت کا ذریعہ ہے کیونکہ اس کی شفاف شخصیت۔"
  reptile.komodo_dragon:
    label: کومودو کا سانپ
    summary: '''کومودو کا سانپ'' انڈونیشا کے جزیرے کومودو پر آباد دنیا کا سب سے بڑا زندہ وجود والا جانور ہے۔'
    info: |-
      کومودو کا سانپ دنیا کے بڑھتے جماعتوں میں اب تک زندہ موجود بدگوش، انڈونیشیائی جزیرے 'کومودو' پر واقع چار فٹ لمبا اور ۷٠ کلو وزن والی حشرات ہوتا ہے۔
      ابتداءً لوگوں نے خیال کیا کہ اس کے لعابِ منہ میں بافٹروں کے ذریعے شکار کو قتل کرتا ہے؛ درحقیقت اس کے زہر آلود غدد ہوتے ہیں。
      اسے مرغزار، بالدگئیل اور حتیٴ موذی جانوروں کو شکار کرنے کا مشغلہ رہتا ہے۔
  reptile.leatherback_turtle:
    label: کوزاتکا
    summary: دنیا کا سب سے بڑا دریائی مچھروں والا جانور
    info: کوژاتکا ویلکا دنیا کے سب سے بڑھ کر دریائی مچھروں میں شامل ہوتی ہے جس کی لمبائی اُٹھاردو متراور وزن تقریباً ۷۰۰ کلوگرام تک پہنچتا ہے۔اس کے شدید مضبوط خاص قسم کے ڈرماؤمائلسس کوروئیجیاء نامی زرد رنگت والے بال، مواد سے بنایا گیا ہوا غیر مستحکم بازو موجود ہوتا ہے۔
  reptile.lizard:
    label: جیسٹر
    summary: گرم علاقوں میں پائے جانے والے چار ہاتھوں والے اور سکین کا تعلق پلز سے ہوتا ہے۔
    info: سبز آئوانا وسطی اور جنوبی امریکا کا بڑا جیسٹر ہے۔ یہ فروغ دینے والی چیزوں پر غذائیت حاصل کرتا ہے، یہ ایک خوبصورت پہاڑی چڑھنے والا ہے اور ذیلی قسم کے چمتوں کو دوبارہ بنانے کی صلاحیت رکھتا ہے۔
  reptile.mamba:
    label: مامба
    summary: افریقی درخت والے نسبتاً تیز اور بالغ طور پر خوفناک سانپ
    info: |-
      کالا مامبا دنیائے کفایت سے تیز اور خطرناک سانپوں میں شامل ہوتا ہے۔
      اس کی رفتار زمین پر گھنٹے فی 20 کلومیٹر سے بڑھ جاتی ہے، درختوں پر چڑھنے کی صلاحیت حاصل ہوتی ہے。
      نوورو توکسک سم دونستل انٹربولنٹس کے بغیر چند گھنٹوں کے دوران لقمۂ اجل بن جانا ضمان شدہ ہوجاتا ہے۔
  reptile.matamata:
    label: ماتاما
    summary: جبالدوز غیر معمولی جلوؤں والا جنوبی امریکی چھلنگ لطیف درخت کے براداشتوں کی تصویر کشی کرتا
    info: "مٹاماتا جنوبی امریکہ کے مشرقی علاقوں کی سب سے بزرنگ ترین پانی والی چھلانگ لطیف انواع میں شامل ہوتی۔\nاس کا بالشت اور سر ناقص حالت میں وسوسے کی طرح دکھائی دیتے، جو خاص قسم کا رخسار بنایا جارہا ہوا ہے。\nغذا کو زندہ ذرات کے ذریعے نہیں بلکہ اپنا منہ باڑھ کر آسانی سے فلٗٹرو کرتا ہے۔ \nآمازوئنز کے موذج اور سست رو شاخوں میں موجود ہوتا ہے۔"
  reptile.monitor_lizard:
    label: اوران
    summary: ایک بڑا موثر شکاری جانور جس کی زبان تقسيمات کے تحت ہوتی ہے۔
    info: "ویران وارنوس جی اقسام کے ساتھ بڑا مچھروالہ پکس دانت والا لizard ہوتا ہے، جبکہ اس کی زبان منقسم شدہ حالت میں رائگند تسلیم کرتی ہے۔\nکومودو وران نامورت عالمی طاقتورترین موجودہ مچھر والے جانوروں میں شامل ہے (لenght ٣ متراز). \nوارناس ذہنتی طورپر بالغ؛ ماہر علم نے ان کے استعمال کردہ آسان آلے قائم کئے。\nوارنايِّ نيلس درخت کے خواتین کے تخم مرغا کے فطرتی نظام کو غذا بناتے ہیں۔"
  reptile.mud_turtle:
    label: بلاتیو زلواں
    summary: ایک صغيرى امریکى مايعي زمينى-آبى زلواں
    info: |-
      بلاتیو زلواں کینوسٹرنن سے تعلق رکھتی ہیں، جو شمال امریکا اور مرکزی امریکا میں پائی جانے والی لگ بارہ انچ لمبی خشک آباد واقع ذرا درجہ حرارت حفاظتی چربی والا قسم کی ڈرائنگ نظام استعمال کرتی ہیں۔
      جب وہ خطرے میں ہوتی ہیں تو وہ شدید بو دماغ کردیتی ہیں。
      اس دوران وہ موٗسومی طوفون کے باوجود نالیوں میں موجود بالغو فرشتوں، چرواہوں اور پودوں کے علاوه تمام غذا کو شامل کرسکتی ہیں۔
  reptile.mudskipper:
    label: بلائٹونوز
    summary: جومین روڈ اندر موثر حرکت کرن لئي صدور کمزور استعمال کرتا هوي
    info: "شپلہواویس بلائٹونوسنے اک رُبڑ کمّت جوب سمندھ توں براہر زندگی دا وݙا حصہ خورو۔ \nاس نال مٕچ ترجمان پلن لَوار، شِلمار طور برآمدات کردئي۔\nایہو مرطوب حلقہ عبراء ذرات فضا کماويا ۽ منقرونز کرنس لوکلا ظرف سے بالغ قوت والے عمارتوں تے چڑھدا آهي۔"
  reptile.newt:
    label: چولک
    summary: ایک چھوٹا موٹا بالغ اواسط لائن والا موجودہ جانور جس کا وجود پانی اور زمین دونوں میں ہوتا ہے۔
    info: چولک ویلگا سب سے بڑا مرکزی اوروپین جانور ہوتا ہے، جو کہ پندرہ سینٹ میٹر تک لمبا ہوسکتا ہے۔ نسل繁衍 کے دوران ذکور خاص طرح کے دم اور حلق والی علامات کے ساتھ آشوبت رائج کرتے ہیں۔ چیک جوماشدروں میں تمام قسم کے چلوں کو قانون کے تحت تحفظ فراہم کیا گیا ہوا۔ زمستان ان لوگوں کو درختوں کے جزر یا پانی کے باہر غاروں میں گزارنا پڑتا ہے۔
  reptile.poison_dart_frog:
    label: برقوق
    summary: ایک چھوٹا، روشن رنگ دانہ، سم حامل برطواح شمالی امریکہ
    info: پرالسنيچکا ایک جنوبی اور وسطی آمریکہ کے مداری غاروں والی زمین پر رہائش اختیار کرنے والا برقوق، روشن رنگ دانہ قسم کا تیرجھل ہوتا ہے۔ ان کے سفید، نیلا، اور پیلا رنگ خطرناک سم کی موجودگی کا علامت ہوتا ہے (ایݔوزماتزم)، بعض اقسام دنیا کے بدترین سم حامل جانوروں میں شامل ہیں۔ مقامی لوگ ان کے سم کو تیروں میں استعمال کرتے ہیں (اس لئے 'ٹॉক्सिक فرو' کے طور پر مشہور)
  reptile.python:
    label: کرجٖتوا
    summary: ایک بزرگ، عدم جذامدار، ہلاکتبار مچھروں کا تحفظ
    info: کرائٹس دنیا کے سب سے لمبے اور بڑے نہ جھلساوے والے مچھروں میں شامل ہوتے ہیں؛ ان میں پانچ مترا سے زائد طول والا 'مُردَّد' درج موجود ہوتا۔ وہ شکار کو سماعت کے ذریعے قتل کرتے ہیں، بلکہ غیر فطری رسمِ تباہی استعمال کرنے کے بجائے گلو اور بازوؤں کو مضبوطی سے لپیٹ کر ختم کر دینے کی صلاحیت حاصل ہوتی ہے۔ ان کے حرارتی مستقبلات وجود میں آئے ہوتے ہیں جو شب میں بھی گرم خون والے شکار کا تعقیب کرسکتا ہے۔ 'برمنز کراجٗوا' فلورڈا میں داخلی نوعیت اختیار کرچکا ہے، جہاں یہ علاقائی جانوروں کی تعداد کمزور کر رہا ہے۔
  reptile.rattlesnake:
    label: چھریسٹش
    summary: پُلوں کے اختتام پر وجود رکھتا ہے جو خود کو تحفظ فراہم کرنے کے طور پر عمل کرتا ہے۔
    info: |-
      چھریسٹش جماعت کروتالوس سے تعلق رکھنے والا ایک خطرناک نہائوں والا زحل باندھ ہوتا ہے۔
      اس میں پُلّوں کے آخر میں موجود واقعاتی آلۂ حفاظت، ’’چِستَ‘‘ شامل ہوتا ہے جو فولادی قسم کے روغن شدہ حصوں سے بنایا جاتا ہے。
      جب دباؤ محسوس ہوا تو یہ آلات حرارتی استحصال کرنے کے لئے استعمال ہونے والے سوراخوں کے ذریعے درجہ حرارت کا تعین کرتے ہیں۔
  reptile.salamander:
    label: مُلُوک
    summary: ایک تالاسرا جانور، نمدار اور لمبی ذنب کے ساتھ۔
    info: مُلُوک سکِرْنٗٹا وسطی یورپ کا تحفظ یافتہ دوسر حیاتیاتی جانور ہے جس پر زرد اور کالی سکرن میں موجود ہوتی ہیں۔ یہ اپنی جلد سے جہلاندار مواد خارج کرتا ہے اور گیلا درختوں والے جنگلوں میں رہتا ہے۔
  reptile.sea_snake:
    label: سمندري سَٓنِّي
    summary: جہلمزدار سانپ جو سامُردگى والى زندگى کے لئے مناسب بناليا گيو
    info: |-
      سمندری سانپ ایک جہل خور حیات آباد کے فیراچائنا بیننر میں شامل ہوتا ہے، جو بالکمل طور پر دریاؤں میں زندگی لے لوٹھا۔
      i
      اس کا دم تار و شمشیر نما ہوتا ہے تاکہ غوطہ لے سکے。
      i
      ایش کا جسم عصبی سم مواد سے براجمان ہوا ہے جو عام سانپ کے مقابلے میں متعدد مرتبہ مضبوط ہے؛ البتہ ان سانپوں کافروغ قومت ہوتا ہے۔
  reptile.skink:
    label: سکنک
    summary: ایک لمبی دم والی ٹائم کے علاقوں میں پالتو ہونے والی ماڈل
    info: سکنک ایک بڑا جانور کے خاندان سے تعلق رکھتا ہے، جو پچاس سوروں سے زائد قسموں کو شامل کرتا ہے۔ ان میں بعض ناقابل حمل آرائش والے ہوتے ہیں یا بالکل بغیر بازوؤں والا شکل اختیار کرنے لگتے ہیں۔
  reptile.snake:
    label: سیب
    summary: ہاتھ اور پاؤں کے بنا چمکدار جلد والا سانپ۔
    info: سیب لمبے، خشک جسم کے ساتھ نجاستوں کے حشرات ہوتے ہیں۔ ان میں سے تقریباً 3700 قسمیں موجود ہیں؛ وہ گنداسن کے ذریعے شکار کرتے ہیں (جاکبسون آرگن) اور بعض زہریلے ہوتے ہیں۔
  reptile.snapping_turtle:
    label: کُئسوَاءِ ژِلا
    summary: ایک بزرگ انحصار والی امریکن سلاد وارمنٹ ڈائناصور
    info: "کوؤسوا کیچڑا عام امریکن سلاد وارمینٹ تورتلو ہے جس میں لمبا حمل دانت والا منھ ہوتا ہے۔\n خشک زمین پر یہ عدوانی ہوتا ہے؛ لیکن آبی ذخیرے میں بہتر طرح سے رہتا ہے。\n یہ ۳۵ کلوگرام وزن تک برداشت کرسکتا ہے اور عمر ٤٠ سال سے زائد ہوسکتی ہے۔ \n یہ تمام قسم کے غذا استعمال کرتا ہے، مثال کے طور پر فشرز، آبی بالغان اور مردوں کو بھی کھاتا ہے"
  reptile.thorny_devil:
    label: مولوج تربّذ
    summary: آسترليا جي يشنجر جنهن تربيتن سان پاڻي جي واصل شي
    info: مولوچ ترنيتى ایک چھوٹا آسٽريليا جانور هجوم لاءِ وڏي سخت مارن کان بنايو، ان جي پٺتي هيوندريين ناقابل برداشت شاخون موجود آهن۔ ڪپلرن حفظات جي ذريعي موثر طرح سان ٻيرهه جي فائبر جي استعمال سان ڌرتيءَ کان پاڻي خود بهتر ريت قبول ٿئي ۽ منہ کان لنگهي۔ ڳالهُ جو صرف ڍنڍ جي ماشيان تي عملدار هجي؛ هر وقت ۲ ہزار ݙويں کان زائد ماشيان کيس ڀوڄائي۔ دفاعي نظام جي حيثيت ۾، ان جي ڊيولز تيز ترين غلط درجن جو علاوه وجود آهي
  reptile.toad:
    label: روبوا
    summary: ایک زمیندار مشتمل بالغ مرطوب محصول ہے۔
    info: روچا عام کے پاسکو میں سب سے زیادہ تعداد میں موجود امپلبرینس ہوتا ہے۔ برابرائٹس موشک نہیں رنگتے؛ حفاظتی مقصد برآوردگی کرتے ہیں اور جھال کے خارجات کا ذخیرہ ہوتے ہیں۔ ہرشام عظیمات فصلوں کے لئے آبی ذخائر میں لوگوں کے طور پر شامل ہونے والے بڑے گروہوں میں منتقل ہوجاتے ہیں، جہاں چیک وولانٹیرز انہیں روڈ کراس کرنے میں مدد دیتا ہے۔ وہ حلقوں، لمبوں اور درندوں پر غذاء اختیار کرتے ہیں اور باحترافی تناسب شاخسانہ قابضوں کے تحمل کا نظام عملدرآمد کرتے ہیں。
  reptile.tortoise:
    label: ساحلی کچھل
    summary: زمین پر رہنے والا جلدی نہ ہونے والا سانپ جو ایک گولائی دار ڈھانچے میں رہتا ہے۔
    info: سلاونی ٹورٹلس دنیا کی سب سے بڑی زمینی کچھل ہے۔ وہ گالاپاگوس جزائر میں پائی جاتی ہے اور 150 سال تک عمر بھی حاصل کرسکتی ہے۔ اس کا ڈھانچا اس کی ہڈی کا حصہ ہوتا ہے۔
  reptile.tree_frog:
    label: روسْنِچَّکَا
    summary: درختوں پر چلنے والا مچھر سبز جانوروں کا ذراتی حصہ، جس کے انگُلوں میں لپٗئت ہوتے ہیں۔
    info: "روسنيچکا زلینا ایک ہائلائڈ فملے کی گھٹن والی مچھر سبز جانور ہوتی ہے، جو انگُلوں پر موجود لپیت حلقے دار ناخنوں کی وجہ سے صاف سطحوں پر تڑف سکتی ہے۔\nچیک ریاست میں اصلی طور پر روشنِچَّکا عام آزاد وجود میں ہے؛ قانون کے تحت اس کی تحفظات شامل ہیں。\n temperatire aur nemی کے بدلنے کے ساتھ یہ خود کشادۂ رنگ الٹتا ہوا شدید سبز سے درمیانی براؤن یا گراݢن وجوہات اختیار کرتا ہے۔ \nخصوصًا رات کے وقت اور موسلادھار برسات کے قبل، یہ لمبا عرصہ تک غیرمعمولی بلند آوازاں گانا سنایا جاسکتا ہے۔"
  reptile.tuatara:
    label: توائِتَرا
    summary: '''نووازليند'' کا زندہ سنگ قبر، الراسخفائلیاء کے شاخ سے تنہا باقی.'
    info: ٹوئیا تارا دنیا کے سب سے پرانے مچھروں میں سے ایک ہے؛ ان کا رتبہ جانور درندگان کے زمانے میں موجود تھا۔ وہ صرف نیوز لینڈ کے جزائر پر آباد ہوتا ہے۔ بڑا ہونے میں خاص طور پر لمبا عرصہ لاتا ہے، بالغوں کی حالت تقریراً ١۰ سال بعد حاصل کرتا ہے۔ قدامت پسند فرد عمر 100 سال سے زائد اختیار کرسکتے ہیں اور بچپن والے 'تریسر' نظر عملدرآمد ہوسکتا ہے
  reptile.uromastyx:
    label: اوروماستکس
    summary: افریقا اور وسطی مغرب کے صحرا میں پائی جانے والی لمبائی دم لizards
    info: "یوروماسٹکس افریقہ کے شمال، وسط مشرق اور انڈیا سے تعلّقات رکھنے والی باغچوں والا جانوروں پر شکار کرنے والی خاص طرح کی لمبائی دم لizards ہوتی ہے۔\nایسا غذا کرتا ہے جو فصلوں، علائقیات اور درختوں کے پتتوں پر مشتمل ہوا۔ \nیہ قسم کے حشرات عام طور پر نمونہ زندگی کے آزماؤں میں موجود ہونے کے باوجود انسانوں کے ذخیرہ میں شامل ہوجاتے ہیں۔"
  reptile.viper:
    label: زمروں
    summary: ترقی یافتہ مثلث الشکل سر اور خمیدہ بدنساز حشرات کا قسم
    info: |-
      زموئے اوبشينا جمهوریہ ملک کا واحد زہریلا سانپ ہے۔
      ایس پٹھوں والے نقشوں، تیرنداشتہ دانتوں کے لحاظ سے شناخت کرنے والا ہوتا ہے。
      چبائی بوجھدار ہوتی ہے اور طبی نگرانی ضروری ہوتی ہے، البتہ صحت مند بالغ شخص کے لیے عام طور پر فاتال نتیجہ در آمد وارف نہیں ہوا۔
  reptile.wall_lizard:
    label: جسترجا زدن
    summary: سبک وزن جلدی جسترجا جبکہ درختوں اور سنگلاسوں پر موجود
    info: |-
      جدول جیسٹرکا زدین کے افراد سوذران یورپ اور شمال مغربی آفروق کے رہائش پذیر حشرات ہوتے ہیں۔
      چیک دنیا میں انھیں تعارفو کار ذرائع عبرت والے صخور و عمارتوں پر نظر آتا ہے。
      an خطرے کی وجہ سے وہ براحت کم کرتا ہوا لگایا جاسکتا ہے،اور آخر کلائم کالونز کے طاقتور بننے کی وجہ سے شمال میں فرشتہ قسم کا بڑھنا مشترکہ ہوجانا۔
  reptile.worm_lizard:
    label: چروکنے والا
    summary: ایک لغوبلا بلّد قسم کا زندگی ختم کرنے والا جانورو
    info: چروکنے والی کرائم جانورات افریقہ، تھاپوائٹس سبزی نمودار ملخمات حشرات پالتو بنا دین۔ ان کے زیرزمین رہتے ہیں اور تمام عمر وقفہ طلب حرکت کرتے ہیں۔
