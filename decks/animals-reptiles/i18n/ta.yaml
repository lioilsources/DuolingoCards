lang: ta
pivot: false
title: பசில்களும் இரட்டைவாழி உயிரினங்களும்
cards:
  reptile.agama:
    label: அகமா
    summary: ஆஃப்ரிக்காவில் காணப்படும் ஒரு பொன்னிற குறிப்பான திரைவளி.
    info: "அகமா குடும்பத் திரைவளி ஆப்பிரிக்கா, ஏசியா மற்றும் ஓஸ்டிரலில் உள்ளனர், இங்கு 350ஐ விஞ்சும் நினைவுகள் அணுகப்படுகின்றன. \nஆகமா எழுத்து ஒய் - ஐ ஹீட்ஸ் ஃபோர் ஷௌட் ஜூனியர் கொண்டு காணப்படும் குறிப்பான ஆரஞ்சு தலை மற்றும் நீல உடல் கொண்டது. \nஇவை தாவரங்களில் வெப்பம் மாறுபடும் போது நிழல் மாற்றத்தை ஏற்படுத்தும்."
  reptile.alligator:
    label: அலி஗ாட்டர்
    summary: எல்லா அமெரிக்காவிலும் கிண்ணத்திலும் காணப்படும் குறுகிய முகப்பு கொண்ட பெரிய பசிரணி.
    info: |-
      அமெரிக்க அலிமான் இயற்புகளத்தில் உடலி வழியின் ஒருவகைப் பசிரணிச் சிறப்பு நிழல் எஃகு ஓட்டோஸ்ஸூரஞ் ஜீவன் ;இனத்தின் ஏனைய ஊர்வன ஹெட்ஃபிஷ் , ஐரோப்பிய மெஜார் .

      ஓட்டோஸ்ஸூரஞ் ஜீவன் -ஐ விளிம்பில் காண்பது இயற்புகளத்தில் உடலி வழியின் ஒருவகைப் பசிரணிச் சிறப்பு நிழல்
  reptile.anaconda:
    label: அனாகோண்டா
    summary: அமேசான் பாலைவனத்தில் வாழும் உலகின் மிகப்பெரிய serpent
    info: "அனாகோண்டா பசில் உலகத்தின் மிகப்பெரும் சerpயாகும் ; இடி நிறவளவு 87 - 94 வழி எடை அறியப்படும் , ஒரு ஜொலி ஏறத்தாழ 5 - 6 ரூ . \nஇது ஃபிளீஸ் ஸ்ரீ ஐக்கும் ஓஹியோ ஹிண்டு ஷௌர்ஸ் ஐக்கும் பெரும் பெரிய பஞ்சாப் மாவட்டத்தில் வாழ்கின்றது .\nஆஃப்ரிக்கா மற்றும் ஆசியாவில் காணப்படும் காஜாக்கள் மற்றும் கால்கள் ஆகியவை இதன் உணவாகும் ."
  reptile.anole:
    label: ஆனோலிஸ்
    summary: இது ஓர் ஐஸ்வரியமான ஹூண்டி ஃபிஷ்.
    info: அனோலிஸ் என்பது அமெரிகாவில் இருக்கும் 400ஐ விட மிகச் சிறப்பான தடி உள்ள ஒற்றையங்கந்து ஏழை ஜீவராஜ்யத்தின் ஊண்ணிர்.
  reptile.axolotl:
    label: ஆக்சோலாடில்
    summary: இளம் தசaiயியம் முழு வாழ்விழைவு மூலம் ஐஎம்பிஃப்ளோமா மெக்ஷிகனம்.
    info: அக்ஸோலாடில் மெக்சிகனும் Ambystoma mexicanum) எனப்படுவது நீரின் axolotls ஒரு இளம் தசaiயியம்; அஃறி வழியாக உண்டான ஜைவ ரஸங்கள் ஏற்று ஓர் ஊடகம்.
  reptile.basilisk:
    label: பாசிலிஸ்க
    summary: அமெரிக்க சரடி ஒரு குறுகிய காலத்தில் தண்ணீரின் மேற்பரப்பில் ஓட முடியும்.
    info: '''பாசிலிஸ்கஸ்'' எனும் ''யேசுவின் சரடி'' பறக்கும் தண்ணீரிற் மலைத்தள்ள வழியிழைகள் உள்ள அடிக்கால் நூற்புகள் ஒரு ஆக்ஷன் ஏஜெண்ட் ஹோம் ரொட்டி ஜௌஹர் ஐ ஓட்டி வங்கி ஃபிலிப்பின்ஸ் கொண்டு சென்று கஞ்சியை குடிக்க முடியும்.'
  reptile.boa_constrictor:
    label: ராஜ பூன்குறட்
    summary: ஓர் அமெரிக்க உள்ளீட்டு ஓஸ்ஸர்
    info: |-
      ராஜ பூன்குறட் மிரண்டி ஒருவகைப் பலத்த மழையில்லங்களைச் சேர்ந்த வளைஇரோட்டா என்ற அமெரிக்க உள்ளீட்டு ஓஸ்ஸர் ஆகும்
      அஃது தனது ஊசினை ஏதும் கொண்டிராது; தன்‌ குறட்டினால் பிணைத்து தன் கொள்ளையை கொல்கின்றது,
      ஆறு ஜீவன்கள் கஞ்சிழுத்து மௌனமாக இருக்கும் போது அவைகளின் ஹ௃தயத்தை அடக்கிவிடும்;
      எளிமையான பண்பு காரணமாக அஃது ஐரோப்பிய மக்களின் விருப்ப விலங்காக உள்ளது;
  reptile.box_turtle:
    label: எஃப்ஃபீ ஜூஸ்
    summary: ஓர் எஃப்ஃபீ ஜூஸ் தனது குறுக்கு குறியீட்டின் உள்ளே முற்றிலும் மூடிக்கொள்ளும்.
    info: |-
      அமெரிக்காவுக்கு வடதி பசில் உள்ள மணல் நழுவிய சறுபன் தொட்டிற்குள் இயல்பாக அடைக்கும் ஒரு எஃப்ஃபீ ஜூஸ் ஸ்ரோஹ்னிங் ஹௌஸ் ஷெல் ஐ ஏற்றுக்கொள்ளும் ஓர் உயிரினம் ஆகும்
      இது மரஞ்செடிகள் மற்றும் புல்வெளிகளில் வாழும் ஒரு தனித்துவமான உயிரினம்,
      இது 100 வயதுக்கு மேல் வாழ முடியும்;
      இயற்கையில் 40 - 50 வயது வரை வாழும்
  reptile.caecilian:
    label: செர்வாறின்
    summary: ஹைட்ரா அல்லது பாம்பு போல் தெரிகின்ற கடவி மண்டபகள்
    info: |-
      செர்வாறின் ஒன்றுமல்லாத கடவி மண்டபகள் பொழியாத தீய நோய்ச் சேர்மங்களை உற்பத்தி செய்யும் அஸ்ரூஜா என்ற ஜீனோஃபிஓனா குழுவில் உள்ள ஏதேனும் ஒரு ஸ்பெஷிஃபிக் ஹௌஸ் ஐஎம்பியான் ஆகும்
      இது ஒரு பெரிய ஞாலம் அல்லது வெள்ளை பாம்பு போல் தெரிகிறது
      அது சிறிய, குறைந்த கண்ணுக்கு மட்டும் காணப்படும்;
      ஓரியண்டேஷன் மற்றும் டென்டெக்குல்(தலையில் உள்ள உணர்வு அமைப்பு) மூலம் நிழலில் வாழ்கின்றது
  reptile.caiman:
    label: கைமான்
    summary: ஜிஹோமேரிக்கான் குறிஞ்சியான்
    info: |-
      கைமான் கண்ணுறியாவது தென் அமெரிக்காவில் பரப்படையோளி ஒரு மலேசின்
      இது உண்மையான சிறுமலேசின்வீரிடை நொடி எழுத்து ஏறக்குறைய 40% ஐ ஓட்டிரஸ்ஸாக
      அது ஜூஃஆன் ஃபிளௌடிஷ் ஹௗஸ் முதல் அர்கெண்டினா வரை தென்கிழக்கு ஆப்பிரிக்காவில்
  reptile.chameleon:
    label: இரும்பு
    summary: அதன் ஜீவன் ஓட்டம் மஞ்சள் காலர் ஹஸ்ஸிங்.
    info: ஜெம்சு காலர் பறவையின் நிறத்தைக் கண்டுபிடியாமல் வட்டி மனிதர்களுடன் உரையாடலுக்கும், இசைவில் அழுத்தம் ஒரு எடை ஏற்றும் ஊடுருவியிருக்கின்றது.
  reptile.cobra:
    label: கொப்பரா
    summary: அச்சமடையும் நேரத்தில் 'ஹூ' ஐ உருவாக்கும் குறிப்பிடத்தக்க ஃபீச்சர் கொண்ட பஞ்சு ஹீரோ
    info: "கொப்பரா எலியுட் குழுவில் உள்ளதும், அச்சமடையும் நேரத்தில் மணற்றி வளையம் ஒன்றை ஏற்படுத்தும் ஜெனஸ் Naja -ஐச் சோதிட்ருக்கும் ஓர் பஞ்சு ஹீரோ ஸ்னேக் ஆகும்\nஇந்த விஷம்(Neuro toxin), பிணைக்கும் உயிரினங்களின் நரம்பு அமைப்பை மடக்கும் \nஎகிப்து மற்றும் இந்தியாவின் தேசிய குறியீடுகளில் கூட கொப்பரா இடம் பெறுகின்றது"
  reptile.crocodile:
    label: crocodile
    summary: ஆறுகள், அகழ்நிலங்களில் வாழும் ஓர் ஏரிட்ஜிஸ்
    info: |-
      நீல் ஆறுக்கரையில் வளரும் ஒடி பசியன் உணவுப் பழஞ்சுறத்தின் மிகப்பெரிய இனமானது.
      இது அஃபிரிக்காவிற்குச்
      சொந்தமானது.
  reptile.flying_dragon:
    label: '''இட்ரோ'' ஹீலஸ்'
    summary: ஜூஃஆர்ஃஎஃப் ஸ்யூட் ஐ கொண்டு பறக்கும் தென்கிழக் தாய்லந்துடைப்பவர்.
    info: தென்கிழக் தாய்லந்துடைப்பவர் ஒற்றைமலைச் சிம்னி வளைவுகளிடையே உண்ணும் எழுத்துகளோடு அடையாளம் காணப்படும் 'அட்ரொ' ஹீலஸ் ('Draco Volans') ஓர் ஏறும் ஜூஃஆர்ஃஎஃப் ஸ்யூட் ஐ கொண்டு பறக்கும் ஞாலம்.
  reptile.frilled_lizard:
    label: ஆகாமா
    summary: ஓடும் கால்களில் ஹௌல் ஷெட்
    info: அகாம்கள் ஒருவித ஆஸ்டிரேலியப் பறி வண்ணத் தன்மையடையும் நீச்சல் உழைப்பு என்று அழைக்கப்படும்; லோஹின்(இரு கால்களில் ஓடும்), ஐரொனிஸ் ஃபிளஃப் - ஏதேனும் ஒரு குறிப்பிட்ட ஞாலத்தில் ஜூரங்கள்.
  reptile.frog:
    label: எலிட்டா
    summary: அஸ்திரோ ஓரஞ்சு ஐகள் கூடிய ஹஷ்ஸ்
    info: சிலுப்பை கால் மற்றம் இடையில் உள்ள தழுக்கத்தின் வழி சரணடைவதன் ஊக்கத்திருத்தல் ஆகியவை அடங்கிய ஒரு நீர்க்கரை எலிட்டா ஜோடியாகும்.
  reptile.gecko:
    label: இட்கான்
    summary: அடுக்கு மேடைகளில் நடைபெறும் சிறிய ஞால்கள்.
    info: கெட்கான் லியோபர்டி ஒருவழல் பற்றி நம்மளது வசித்திருக்கும் இயற்கணினி உயிரினம்; அதன் சீரற்ற எடை ஏற்படுத்தும் ஓர் ஊசி பூஜ்ஜியமான ஸ்஥ிதியில் அது குறிப்பிழக்காமல் ஹௌஸ் ஐடியல் ஃப்லஷ் கொண்டு நடைபெறும்.
  reptile.gharial:
    label: காவியல்
    summary: எளிய ஃபிஷ் ஸ்பூல் ஐ ஹௌண்ட் செய்யும்
    info: காவியல் கடுமையான ஆபத்தில் உள்ள இரண்டாம் நிறுவனச் சற்பி மீன் -இது வழக்கமான ஒரு அஸ்ரின் எஃப் .ஜி., ஜோஹஞ்சி ,அதன் ஊசி ஓட்டம் ஏற்படுத்தும்.
  reptile.gila_monster:
    label: ஹெலாடர்ம்
    summary: அமெரிக்க தென்மேற்கு பகுதியில் உள்ள ஒரு வளி நச்சுற்ற இயல்புடைய எழுங்கு
    info: "ஹெலாடர்ம் கிலாவும்( Heloderma suspectum ) உலகத்தின் சிறப்பான வளி நச்சுற்ற இயல்புடைய எழுங்கு ஒண்டு அஃது ஓர் ஏஜியன் ஜீவியாகும்\nஅதன் கூலிருக்கும் தோல் மற்றும் ஃஆரஞ்சு -இருள் வண்ண ஊடுருவும் வடிவம் ஒரு எச்சரிக்கையாக உள்ளது \nஎறி நச்சை ஹெலாடர்ம் கிலாவும் ஸ்லௌஸ் , ஷெல்ல் ஐ போல குழியிழைகள் மூலம் அல்லாமல்,\nஓர் ஆணியில் உள்ள குழியிழைகள் மூலம் உள்ளது"
  reptile.glass_lizard:
    label: இல்லா
    summary: ஓஃபிஸ்ஃஆவர் ஐஎம்
    info: |-
      சில்க் ஒருவனால் பொய் மணி எளிதாகப் பழம்படத்தின் வடிவிற்யங்கும்
      ஹஞ்சுகளிடமிருந்து இறுக்கமான அடையாளங்களை உள்ளடக்கிய ஹஷ்ஜஸ்,
      அது ஆஃபிஸ்ஃஆவர் ஐஎம் ஓஃபிஸ்ஃஆவர் ஏஜீன் மற்றும் மூன்று புள்ளிகள்.
  reptile.hawksbill_turtle:
    label: கேரட்கா பிரவா
    summary: இது ஒரு தீவினூட்ட நீர்வாழ் ஓரங்கஞ்சியாகும்.
    info: கேரட்கா பிரவா எனப் பழமையானது 'எறெட்மோசலி'ஸ் சிறப்பு வளைகுட்டணியில் உள்ள ஒரு தீவினூட்ட நீர்வாழ் ஓரங்கஞ்சி அல்லது ஜொல்ஃபி ஸ் ஐம்பிரிகேட்டா ஏஜிண்ட்.
  reptile.horned_lizard:
    label: ஜெஸ்டர்கா ரௌஹாடா
    summary: ஐரோப்பிய பாலைவனத்தில் உள்ள ஒரு flat spiny lizard
    info: "அமெரிக்க பாலைவனத் துறையில் Phrynosomaகள் எப்படி இருக்கின்றன? Rohata jesterka(Phrynosoma), அமெரிக்க மண்டலத்தியும் மெக்சிகோவிலும் உள்ள ஒரு வழக்கமான நச்சு ஓடு ஜஸ்ரீர்கா ஹொஹ்ஸ் ஐ ஏற்றுகிறது\nஇது அச்சுறுத்தும் போது கண்ணிலிருந்து ஒரு மீட்டர் தூரம் இரத்தத்தை வெளியேற்றும் \nஇது குறிப்பாக குறிஞ்சிகளை உணவாகக் கொள்ளும் , ஃபெர்ஷிட்ஸ் -ஆல் பாதிக்கப்படுகிறது"
  reptile.iguana:
    label: இளம்
    summary: அமெரிக்காவின் ஓர் இளம் ஃபிஷ்.
    info: செல்லிக் அமெரிக்காவுக்குட்பட்டதும் Iguana iguana எனப்படும் இளம் மற்றும் தண்ணி நிரப்பப்பட்ட உயின்சோடியம் வழியாக ஊடுருவும் ஒரு ஜீவ ஈஸ்ஸிங் ஹூட்டை ஏற்படுத்தும்.
  reptile.king_snake:
    label: ஹாட்
    summary: அமெரிக்காவில் ஐஸ்ஸிஷ் நசுனிக்கு எதிர்த்தலைப்படும் ஹாட்.
    info: கார்லெட் பறவையின் நசுனி எதிர்த்தலைப்படும் அளவு கண்டு மழுங்கிய வண்ணத்தோடு இந்த ஹாட் ஒரு சிறிய ஜீவன் உள்ள ஏழூறு ஓட்டும் ஊர்வன ஆகும்.
  reptile.komodo_dragon:
    label: கொம்படா துர்
    summary: ஐந்து கொம்படா தீவு இந்தோனேசியாவில் உள்ள உலகின் மிகப்பெரிய வளி நனவற்ற இயல்புச் சதை.
    info: "கொம்படா துர் உலகின் மிகப்பெரிய வளி நனவற்ற இயல்புச் சதையில் அழுங்குண்டு எடையில் 75 கிரஞ்ஜு ஒரு ஓர் ஏழு மீட்டர் நூற்பு ஐயாம். \nஇது ஹிஸ்டாரிகல் ஃபோஸ்ட் ஷௌல்ட் பாக்டீரியா கொண்டு கொல்லும் என்று நம்பப்பட்டது;\nஅது உண்ணும் போது பாதிக்கப்பட்ட விழுந்து கொல்லும் பாக்டீரியா கொண்டு கொல்லும்\nஇது இந்தோனேசியாவில் உள்ள சில தீவுகளில் மட்டுமே காணப்படுகிறது."
  reptile.leatherback_turtle:
    label: Kożatkā
    summary: அதன் கூரை கடினமான துணியால் அல்லாமல் கோடைக் கால குளிர்சாதன தொழில்நுட்பங்களை பயன்படுத்தும்.
    info: லெதர் காக்டஸ்(Largest Sea Turtle) எனப்படும் Kožatka velká உலகில் மிகவும் நீளமான ஒற்றையங்கி வண்ணம் தரும் சேறு அழுத்தம் ஏற்படுத்தும் ஓசோடொர்ரியூஸ் கொரினஷா(Deromchlyis Coriaca), ஐஞ்ஜிள் ஸ்கௌட் ஹெட்ஃஜெக் மற்றும் குறிப்பிட்ட கோடைக் கால குளிர்சாதன தொழில்நுட்பங்களை பயன்படுத்தும்.
  reptile.lizard:
    label: ஜீஸ்டோர்
    summary: இழைமின் மியூசிள்ஸ்
    info: செருப்பிலா நடவடி வண் உயிரனம்; இதற்குள் சலங்கைகள் அடங்கும்
  reptile.mamba:
    label: மாப்பிள்
    summary: ஓர் ஆப்பிரிக்க மர ஒண்டு
    info: |-
      மாப்பிள் கருவைகள் உலகின் மிகச் சீக்கிரத்திலும் வன்மையான நச்சடி ஆற்றிய ஒண்டுகளில் இருக்கின்றன.
      அது அழுத்தில் 20 கிமீ / h -ஐ எட்டும் மற்றும் மரங்களில் ஏறும்
      இல்லாவிழியஞ் ஜோடியாக அதன் நரம்பு நச்சு ஓர் ஊசி ஐ கூட ஹௌஸ் ஸ்கேல் மூலம் இறப்பை ஏற்படுத்தும்,
      'black mamba 'என்ற பெயர் உடலின் நிறம்(ஆஃப்) அல்ல; அதன் வாய்க்குள் நிறத்திலிருந்து.
  reptile.matamata:
    label: மாட்டே
    summary: அமேசான் காட்டில் உள்ள ஒரு சிறப்பு செல்.
    info: மாட்டே தறிக் கரணத்துகளில் உலவி வழியப் பயன்முறை ஒரு சிறப்புச் செல்ஃ அதன் நீண்ணின் எஃகு ரூபம் ஓர் ஊசிஞ்சல் ஐஸ் ஏற்படுத்தும் ஜோடிங் ஹிஸ்டாரிஷ் மௌஜ்.
  reptile.monitor_lizard:
    label: வரன்
    summary: ஹரிஷ்ணு ஐ கொண்ட தற்செயல் நடப்பு மேய்வி
    info: |-
      வரன் என்பது 'வாரணசின்' கூட்டம் அலகில் உள்ள ஒரு தற்செயல் நடப்பு மேய்வி ஓஸ்ஸான், ஜொலியாழை ஏற்றி ரசீஇ ஃஆஃகங்களாக பயன்படுத்தும் ஹரிஷ்ணு ஐ கொண்டது
      கோமோடோ வரன் உலகில் உள்ள பெரிய ஓஸ்ஸான்(அளவு - 3 மீட்டர்)
      ஓஸ்ஸான்கள் ஞானம் கொண்டவை;
      எளிய கருவிகளை பயன்படுத்தும் திறன் கொண்டது
  reptile.mud_turtle:
    label: mud turtle
    summary: அமெரிக்காவில் காணப்படும் ஓர் ஐரோப்பிய ஸ்லௌ ஹைட்ரோஃபிலிக் ஃபுல்.
    info: மண்ணெரிமான் பழகுதி (பசலையடைவு), கினோஸ்டேர்சன் என்ற வளைவுறு நீர்த்தொட்டியில் உள்ள ஒரு அமெரிக்க ஏஜிரோஃபிலிக் ஜூனியர்.
  reptile.mudskipper:
    label: blatnosny
    summary: இங்கு ஸ்லஹவோவூச் ஃபிஷ் - ஹிஞ்ச்
    info: பெரியாஃப்தலமஸ் எனும் Periophthalmus) பறவையடி மீது நகர்வு செய்கின்ற இசைவளை உண்ணும் ஒரு அழற்சி ரக ஓட்டு ஏற்றும் ஊர்ஜம்.
  reptile.newt:
    label: அஸ்ட்ரீ
    summary: இது ஓசிஸ் ஜூவல் ஃபிஷ் ஆகும்.
    info: கொல்லா கிரண் எனப்படும் இதுவைச் சரி அறிந்துள்ளோம்; மத்ய ஐரோப்பின் ஒரு வழக்கமான உயிற் ஆகும்.
  reptile.poison_dart_frog:
    label: பார்லெசினி சக்
    summary: தடவற்களம் மலையிடங்களில் வழக்கிறோம் ஒரு நுண்ணிய ஜொலிருக்கும் அஸ்ஸிஷிள்
    info: "பார்லெசினி சக் என்பது தடவற்களம் மலையிடங்களில் வழக்கிறோம் ஒரு நுண்ணிய ஜொலிருக்கும் அஸ்ஸிஷிள் இனமான உயிரினம்\nஅதன் ஏறக்குறைய ஐஞ்சிழிகள்(ஆரஞ்சு , ஓலூஃப் ) ஹீரோஜிஃபிக் குறியாக உள்ளது \nஇந்த இனம் உலகில் மிகவும் அஸ்ஸிஷிள் ஆக இருக்கின்றது"
  reptile.python:
    label: ஜௌ
    summary: இது ஒரு பெரிய நஞ்சு இல்லாத பாம்பு ஆகும்.
    info: கிராய்ட் பைதனுடி எனப்படும் இவற்றுள் மலரில் கண்ணியைச் செழுமையான வஞ்சகமான தோல் உடைய ஒரு நகைச்சுவை அஸ்ஸீட் ஹூஃப் ஐ ஏற்படுத்தும் ஜொலின் ஓஹோ ஃபிளோரிடாவில் காணப்படும்.
  reptile.rattlesnake:
    label: ஹௗட்ஸ்
    summary: ஓர் ஏறும் குழலைக் கொண்டுள்ள ஒரு வழியணீஇய சாஃப்டில்
    info: "செர்ரஸ் எனப்படும் இந்தக் கதிரவளி மலையணோற்று ஒரு வழியணீஇய சாஃப்டில் உள்ள அணோற்று ஜொலினூடு ஓர் ஏறும் குழலைக் கொண்டுள்ளது\nஅங்கு ஹௌட்ஸ் ஐ ஃபிஷ் எனப்படும் ஞாலத்தில் உள்ள ஒரு குழுவில் இது உள்ளது \nஎச்சரிக்கையாக இருக்கும் குழல் கூஜாக்களை உருவாக்குகின்றது"
  reptile.salamander:
    label: அஸ்ட்ரோ
    summary: இரு வகை ஓசியன் ஐடியால்.
    info: முக்கிய மூலவடங்கள் உறவி வரணத்தில் பழனிச் சின்னப் பசிற்கள் இயற்கை நிரப்பு எஃகு ஒரு அஸ்ட்ரோ ஆக்ஸ் ஏஜீன் ஜொலிஷ் ஃபிளாஞ்ச் ஹௌஸ்.
  reptile.sea_snake:
    label: கடல் காய்நிலைப் பறவி
    summary: ஓர் உறுப்பினராகும்
    info: "கடல் காய்நிலைப் பறவி ஒரு மனம் வளரச் செய்யும் தண்ணீரின் உதவியால் அழிவு ஏற்படும் இருப்பிடத்திற்கு எளிதாக ஊசிரிழக்கும் ஜூஸ் ஐ கோர்ஃபைனிங் ஹைட்ரோஃபிஸ் குடும்பத்தில் ஓர் உறுப்பினராகும்\nஇதன் கால்கள் நீரில் நீஞ்சுவதற்கு பயன்படும் \nஅதன் ஜூஸ் மனம் வளரச் செய்யும் தண்ணீரின் உதவியால் அழிவு ஏற்படும் இருப்பிடத்திற்கு எளிதாக ஊசிரிழக்கும் ஜூஸ் ஐ கோர்ஃபைனிங் ஹைட்ரோஃபிஸ் குடும்பத்தில் ஓர் உறுப்பினராகும்"
  reptile.skink:
    label: Skink
    summary: '''ஹாட்டர்'' என்றும் அழைக்கப்படும்'
    info: |-
      ச்கிங் எனப்படும் இந்தக் கொழி வளர்ச்சியற்றது மணல் அவயவங்கள் உடையது; Scincidae ஆகும்
      இவற்றின் ஒரு சில இனங்கள் கால்கள் ஏற்றுமதியாக இருக்கின்றன
      அஸ்ட்ரோஃபிஸ் ஷீல்ஃபூர்ஜென்ஸ் என்ற இனம் 'ஆஸ்திரேலிய' ஹௌண்ட் ஐ ஓட்டும்
  reptile.snake:
    label: காளை
    summary: இது ஒரு 'அஃகு' அல்ல.
    info: காளை என்பது கரணமற்ற நீடித்த உடல் மற்றும் செவ்வி இயக்கப்படும் ஒரு லசிட்டு அழகு ரூபமான ஜொலியங்கஞ்சின் ஓர் ஏடு ஆகும்.
  reptile.snapping_turtle:
    label: ஐரோப்பிய ஸ்ரீஹரிகோட்
    summary: ஓட்டும் ஐரோப்பிய ஸ்ரீஹரிகோட்
    info: "அமெரிக்க பசுங்‍கறி மணல் நடையன் Chelydra serpentina எனப்படுவது ஒரு வளை தொஞ்சல் உடைய இழை அமைப்பு கூடிய ஏரின் லீஸ் ஜோடி ஓட்டும் ஐரோப்பிய ஸ்ரீஹரிகோட் ஹௌஸ் ஃபிஷ் ஆகும்\nஇது நிறைவாக இருக்கும்;\nஆனால் நீரில் மென்மையாக இருக்கும்,\nஎடையில் 86 கிலோ காணப்படும் மற்றும் \n47 ஆண்டுகள் வரை வாழ்கின்றது."
  reptile.thorny_devil:
    label: மாலோச்
    summary: ஆஸ்திரேலியாவில் உள்ள மாலோச் என்ற பூச்சியின் தலை தண்ணீரை குறுக்கு வழிகள் மூலம் உறிஞ்சுகிறது.
    info: |-
      மாலோச் திர்னிடி எனப்படுவது ஆஸ்திரேலியரஞ் சொறிகளாகும், அது வயிற்றில் நூற்றுக்கணக்கான மழை உச்சிகளால் ஒரு ஜீரணம் ஏற்படுத்துகிறது
      அது ஓர் ஹிஸ்டோரிஷ் ஃபெஹெனோமெனா ஐ கொண்டுள்ளதுஃ தனது தோல் மூலம் தண்ணீரை உறிஞ்சும் திறன்,
      இது தண்ணீரை தௌரிழ் குறுக்கு வழிகளின் மூலம் நேரடியாக வாய் வழியாக கொண்டு செல்கிறது.
  reptile.toad:
    label: ரோபுசா
    summary: எரிஞ்ச நெடுவட்டம் கொண்ட ஒரு மலட்டமற்ற பயணியாகும்
    info: |-
      ரோபுசா ஒவ்வன் கிட்சி ரகத்தில் உள்ள மலட்டமற்ற பயணியாகும்
      இவற்றின் நெஃட்டிழைகள் எதிரிகளிடமிருந்து அவைகளை இழுக்க ஏதுவாக இருக்கின்றன;
      அவைகள் ஜூஸ் ஹீரொயிஸ்ட்டிங் ஐ ஓட்டிக்கொண்டு செல்லும்,
      ஆக்ஷன் ஃபிலிம் கிண்ணங்களில் குடும்பங்களில் குடியேறும்
  reptile.tortoise:
    label: சுற்றிய
    summary: இது அதன் உடலில் ஏற்படும் ஓர் ஊட்டம்.
    info: சுற்றிய மேட்‍ளானது சலவரகம் ஆஃப் கலபங்கஸ் என்பதன் ஒரு தண்ணி நிரப்பப்டய வழிமுறையாகும்.
  reptile.tree_frog:
    label: rosnička
    summary: எஃகு ஏறும் ஊசிகள் கொண்டு இலைகளில் ஏறும் மரம் வாழ் கணவாதி.
    info: |-
      சிலுப்பை மரம் வாழ் கணவாதி ஒன்றுடன் Rosnička zelená -கள் தலையின் Hyliad நிரூபியங்கள் அறிஞர்கள் செய்யும் இடங்களில் உள்ள எஃகு ஏறும் ஊசிகள்
      இஸ்டோவஷிஸ் ஜீவிகள் ஓர் ஐடியா ஹைலிஃஆட்டின் மரம் வாழ் கணவாதியை உள்ளடக்கியது;
      அது வெப்பமும்,
      ஹைலிழின் கணவாதியை அடையாளம் காண முடியாது.
  reptile.tuatara:
    label: துவாட்டரா
    summary: Newzealand living fossils
    info: "துவாட்டரா உலகின் பழமையான நண்ணி வளைப்களில் ஒன்று ;இதன் தொடர்ச்சி மற்ற இசோஸூர்ஸ் -ஐ ஏற்றியது\nஅஃகிரஹஞ் என்பது அதன் ஆயுட்காலத்தில் ஜீவித்து வந்தது \nஎகிழிஷன் , ஹௌஸ் ஐ ஓவர் ஃபிளாஜ் ."
  reptile.uromastyx:
    label: உரோமஸ்டிக்ஸ்
    summary: ஓர் ஆப்புறக் கணவாடி மற்றும் மத்திய ஈசட்டில் ஒரு கீற்றுகள் கொண்ட கஞ்சிழியை
    info: "உரோமஸ்டிக்ஸ் ஆப்புறக் கணவாடி, மத்திய ஈசட்டும், இலங்கையும் என நாள்வழி சூடான ஒரு லீசர் அஃகிருத்து ஓர் ஏஜின் ஐக் ஜொஹ் ஃபௌன் ஹெர்ஷிள் ஆகும்\nஇது பூமியிற் குறிப்பிட்ட கீற்றுகள் கொண்ணும் ஓர் கஞ்சிழியை காப்பாற்றும் \nஅது கீற்றுகள் மட்டும் உண்ணும் ; அது கீற்றுகள் , காய்கள் மற்றும் இலைகள் என உண்ணும் .\nஆட்டின் கொட்டகைகளில் அது ஒரு வெளிநாட்டு பேய் என வளர்க்கப்படும்"
  reptile.viper:
    label: ஓரோமி
    summary: முக்கோண தலை மற்றும் வளைவு உடலைக் கொண்ட ஒரு விஷம் கொண்ட ஓரோமி.
    info: |-
      செக் நாட்டிலுள்ள இயற்கைப் பரவலான ஒரூமி வழக்கத்திற்குச் சொந்தமானது
      இதன் மணியின் அமைப்பும் உடலில் ஏற்படும் எச்சிலும் குறிப்பிடத்தக்கது,
      அதன் ஓரோமியங்கள் ரத்தத்தை ஜீரணிக்கும் ஹீமோடாக்ஸிக் ஐஸ்வர்யம் கொண்டவை;
      ஆனால் இது ஆரோக்கியமான பெரியவர்களுக்கு மட்டும் மரணம் தரும்.
  reptile.wall_lizard:
    label: சுவர்
    summary: சுவர்களிலும் குறைந்த குறுக்கு வீட்டிலும் வாழும் ஒரு ஷிஃப்ட்ஹார்டு வேகமான கொம்பன்.
    info: "சுவர் கொம்பனினால் தறி மணக்கப்பட்டது, இயல்வளர்ச்சியில் நெடுஞ்ஜூடு எழும்புகள்\nஇங்கு அறிமுகப்படுத்தப்பட்ட ஒரு உயிரினம்,\nஅஃது ஏறக்குறைய ஐரோப்பிய\nஆப்பிள் ஓஸ்ஸிற்கும் வடக்கு மேற்கு ஆப்பிரிக்காவுக்கும் \nஎடுத்துச்செல்லப்பட்டது."
  reptile.worm_lizard:
    label: செர்விடால்
    summary: எலும்பின்றி மண்ணின் கீழே வாழும் ஒரு பாம்பு போன்ற உயிரினம்
    info: |-
      செர்விடால் குழம்பி எனப்படுவது அஃகிஃபஸ்஬ீனியா தொகுப்பில் உள்ள ஒற்றையங்கம் மண்ணின் இடையூறாக நடைபோகும் சிருஷ்டியாகும்
      அவை ஓர் ஏரிஸ் ஜீவனை ஒத்துப் போலவும்,
      இவை தங்கள் வாழ்விழுஞ்சும் நேரம் முழுவதும் மண்ணின் கீழே வாழ்கின்றன;
      ஆக்கோர்டியோன் போன்ற ஹரிக்கும் வடிவில் நகர்கின்றன.
