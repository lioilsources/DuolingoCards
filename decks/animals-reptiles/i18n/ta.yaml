lang: ta
pivot: false
title: பசில்களும் இரட்டைவாழ்வினரும்
cards:
  reptile.chameleon:
    label: செம்மால்
    summary: தனது தோலின் நிறத்தை மாற்றி கண்களை இயக்கும் விலங்கு.
    info: ஜம்பர் செம்மால் அழகு மற்றும் வெப்ப ஒடுக்குவதற்காக நிறத்தை மாற்றுகிறது; அதன் கண்கள் ஒன்றை ஒன்று தடுத்து நிர்வகிக்கின்றன.
  reptile.crocodile:
    label: குரோடில்
    summary: நதி மற்றும் ஈரப்பசாரிகளின் அருகே வாழும் ஒரு பண்டைய ஆமை.
    info: நீல குரோடில் உலகின் மிகப்பெரிய ஆமைகளில் ஒன்றாகும். ஆப்பிரிக்காவில் வாழ்கின்றது மற்றும் தண்ணீரிலிருந்து சிக்கலான முறையில் பிடிக்கின்றது. எல்லா உயிரினங்களிலும் இதன் தூக்கு மிகவும் வலிமையானது.
  reptile.frog:
    label: குளிர்கால் நீர்வாழி
    summary: சிலும்புத் தோலுடன் இருப்பினையறவிய மிக்க சிறிய ஆணி உடைய ஒரு அனுரா குடும்பத்தின் உயிரினம்.
    info: ஆர்டிக் எஃகு குளிர்கால் நீர்வாழி ஒரு தென்கிழக்கு அமெரிக்காவில் காணப்படும் ஓர் ஆகர்ஷக ஜீவன் ஆகும். இது மர கொடிகளில் வாழ்கின்றது, குறிப்பாக பறவைகளின் கால்களில் உள்ள கால்களுக்கு இடையில் உள்ள கால்களின் கூரைகளை பயன்படுத்தி பறக்கின்றதும் இரவில் செயல்பாடு காணப்படும்.
  reptile.gecko:
    label: ஜெக்கான்
    summary: சுவரில் ஏறும் திறன் உள்ள சிறிய பாம்புப் பூச்சி.
    info: ஜேக்கான் என்னும் மலையோடு நடைபெறும் விலங்கு ஒரு பிரபலமான டெரேரியம் அணுகுமுறை பழுது. அதன் கால்களில் உள்ள நுண்ணிய தொடைகள் மூலம் குறிப்பிட்ட கற்கள் மற்றும் சுவர்களில் நிலைத்து நிற்கின்றது; அது ஒரு பொருளை பற்றிக் கொள்ளும்.
  reptile.lizard:
    label: இகுவானா
    summary: தெப்பமில் நாடுகளில் காணப்படும் சரிவறையின் நால்தசை உயிரி.
    info: சிங்கார இகுவானா மத்திய அமெரிக்கா மற்றும் தெற்கு அமெரிக்காவில் காணப்படும் ஒரு பெரிய ஜீஸ்டெர் ஆகும். இவை தாவரங்களை உண்ணும், மலையேறுவதில் திறமையாக இருக்கும் மற்றும் ஓட்டையின் நழுவிய பகுதியை மீள் உருவாக்க முடியும்.
  reptile.salamander:
    label: முலோக்
    summary: நீரிலும் பசி இடத்திலும் வாழும் ஒளி கொண்ட சரிவற்ற தோலுடன் மற்ளும் நீளமான ஓயரை உடையவன்.
    info: முலோக் ஸ்க்ர்னிட்டி எனப்படும் அதன் மூலம் ஆஸ்திரியாவில் பாதுகாக்கப்படும் ஒரு கரை மற்ளும் கருமை நிற புள்ளிகளை கொண்ட ஒரு ஜீவன் ஆகும். அதன் தோலிலிருந்து விஷம் வெளியிடுகிறதும் மற்ளும் ஈரப்பசி காடுகளில் வாழும்.
  reptile.snake:
    label: காயல்
    summary: முழு கைகளின்றி நீட்டப்பட்ட தச்சுத் தன்மை உடைய வண்ணமற்ற ஆவரணம்.
    info: காயல்கள் இடைவெளியில்லா தசை அமைப்பு கொண்ட நீண்ட உடல் கொண்ட வண்ணமற்ற ஆவரணங்கள். 3,700 க்கும் அதிகமான இனங்கள் உள்ளன; அவை மணக்கும் கருவியான 'ஜேக்கப்' என்ற அமைப்பை பயன்படுத்தி உணவை துருத்தும் மற்றும் சில வகைகள் விஷம் கொண்டவை.
  reptile.tortoise:
    label: சுற்றிய மீன்
    summary: நிலத்தில் வாழும் குரண்டு பட்டையுள்ள இலைவிங் உடைய ஒரு சிலப்பின ஆமை.
    info: கலபாகோஸ் தொடர்க்கோளில் வாழும் ஸ்லோனி ஆமை உலகின் மிகப்பெரிய நில ஆமை ஆகும். 150 ஆண்டுகளுக்கும் அதிகமாக வாழும் என்பது இதன் சிறப்பு. இதன் குரண்டு அதன் எலும்பு ரசித்தின் ஒரு பகுதியாகும்.
