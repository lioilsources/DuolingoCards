title: Insekten und Amphibien
cards:
  reptile.chameleon:
    label: Echse
    summary: Farbwechselnde Echse mit beweglichen Augen.
    info: Die farbverändernde Baumbewohner-Eidechse (Familie Chamaeleonidae) verändert ihre Farbe nicht zur Tarnung, sondern zur Kommunikation und Temperaturregulation. Ihre Augen können unabhängig voneinander sich bewegen.
  reptile.crocodile:
    label: Krokodil
    summary: Großes urzeitliches Reptil, das an Flüssen und Sumpfgebieten lebt.
    info: Das Nilkrokodil ist eines der größten Reptilien der Welt. Es lebt in Afrika und jagt aus dem Wasser. Es hat den stärksten Biss aller Lebewesen.
  reptile.frog:
    label: Kröte
    summary: Grünes springendes Amphibium mit roten Augen.
    info: Die Roteckige Baumfrosch ist ein tropisches Amphibium aus Lateinamerika. Sie lebt in den Kronen von Bäumen, fliegt mithilfe der Haut zwischen ihren Fingern und ist nachtaktiv.
  reptile.gecko:
    label: Gecko
    summary: Kleiner Echsenartiger, der an vertikalen Oberflächen klettern kann.
    info: Der Leopardengecko ist eine beliebte Art im Terrarium. Millionen winziger Haare auf seinen Füßen ermöglichen es ihm, über Steine und Wände zu klettern – nicht Klebstoff.
  reptile.lizard:
    label: Echse
    summary: Vierbeiniger schuppiger Reptilien aus warmen Regionen.
    info: Die grüne Igel ist eine große Eidechse aus Mittel- und Südamerika. Sie ernährt sich von Pflanzen, ist ein ausgezeichneter Kletterer und kann abgebrochene Schwanzteile regenerieren.
  reptile.salamander:
    label: Axolotl
    summary: Amphibier mit glatter Haut und langem Schwanz.
    info: Der Axolotl ist ein geschütztes Amphibium Mitteleuropas mit gelb-schwarzen Flecken. Er sondert Gifte über die Haut ab und lebt in feuchten Wäldern.
  reptile.snake:
    label: Schlange
    summary: Lebewesen ohne Beine mit langem, flexiblen Körper.
    info: Schlangen sind Reptilien mit verlängertem Körper und fehlen Gliedmaßen. Es gibt über 3 700 Arten; sie jagen mithilfe des Geruchssinns (Jacobsons Organ) und einige davon sind giftig.
  reptile.tortoise:
    label: Landkrebs
    summary: Langsamer Landplaz mit einer kupferförmigen Panzerung.
    info: Die Galäpagos-Schildkröte ist die größte Landschildkröte der Welt und lebt auf den Galäpagosinseln. Sie kann über 150 Jahre alt werden. Der Panzer ist ein Teil ihres Skelettes.
