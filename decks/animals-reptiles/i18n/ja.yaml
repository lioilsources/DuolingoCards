lang: ja
pivot: false
title: 昆虫と両生類
cards:
  reptile.chameleon:
    label: カメレオン
    summary: 体の色を変える爬虫類で、動く目を持っています。
    info: ジンマスカメレオンは隠れるためにではなく、コミュニケーションや体温調節のために体の色を変えます。また、その両眼は互いに独立して動きます。
  reptile.crocodile:
    label: ワニ
    summary: 川や沼地に生息する古代の爬虫類。
    info: ナイルワニは世界最大級の爬虫類であり、アフリカで水から獲物を捕まえます。現存する動物の中で最も強力な歯を持っています。
  reptile.frog:
    label: かえる
    summary: 緑色の体と赤い目を持つ跳ねる両生類。
    info: リストヴニツェ チェルヴエノウカは、ラテンアメリカに分布する熱帯性の樹上生活をするカエルです。葉冠で暮らしており、指同士を結ぶ膜を使って飛行します。夜間に活動的です。
  reptile.gecko:
    label: げこん
    summary: 垂直な表面を登ることができる小さなトカゲ。
    info: ヒョウモントカゲワシは人気の熱帯魚や爬虫類飼育用の動物です。足には無数の微細な毛がついており、これによって岩や壁に張り付きますが、粘着剤のようなものではありません。
  reptile.lizard:
    label: トカゲ
    summary: 温かい地域に生息する四足の鱗を持つ爬虫類。
    info: 緑色のイグアナは中米および南米原産の大きなトカゲです。植物を食べ、優れた岩登りができ、尾が切断されても再生することができます。
  reptile.salamander:
    label: モル
    summary: 光沢のある肌と長い尾を持つ両生類。
    info: スミレモルは、黄色と黒色の斑点がある中欧の保護された両生動物です。皮膚から毒物を分泌し、湿った森に生息しています。
  reptile.snake:
    label: 蛇
    summary: 四肢のない鱗を持つ爬虫類。
    info: 蛇は体が長く伸びた、四肢を持たない爬虫類です。3700種以上存在しており、においを嗅いで獲物を探します（ヤコブソン器）。一部の種は毒を持っており危険です。
  reptile.tortoise:
    label: 陸棲亀
    summary: 陸上で生活するドーム型の甲殻を持つ爬虫類。
    info: ゾウガメは世界最大の陸棲カメで、ガラパゴス諸島に生息しています。寿命は150年以上にもなります。その甲羅は骨格の一部です。
