lang: ja
pivot: false
title: 昆虫と両生類
cards:
  reptile.agama:
    label: アガマ
    summary: アフリカ原産でカラフルな岩場のトカゲ；特にオスの目立つ模様
    info: アガマは、アフリカやアジアおよびオーストラリアに生息する約300種を超える大型のトカゲ科です。赤頭（あかがしら）アガマなどの雄には鮮明な橙色の顔と青い体を持つ個体があり、支配的な姿勢を示します。体温調節のために積極的に体表の色彩を変えます：寒さでは暗く見え暖かくなるにつれて淡くなります。ドラコ属など一部の亜種は肋骨を使って滑空することが可能です。
  reptile.alligator:
    label: アリゲータ
    summary: アメリカ合衆国と中国に生育している円形の吻を持つ巨大なクワガタ目動物です。
    info: "{\"hint\":\"USAおよび中国に生息する丸い吻を持つ大型の鱗を持った爬虫類（アリゲーター）\",\"info\":\"アメリカ・アリゲータは、生きている二種類のアリゲータの中でも大きな方で、もう一つは小型のチャイニーズ・アリゲータである。\r\nクロコダイルとの違いとして、より広くまるみを帯びた口鼻と、歯茎が閉じても牙を見えない点がある。\r\n北米南部地域の沼地や川、湖などに住んでいる。\r\n湿地生態系において重要な頂上捕食者であり保護者の役割をしている。\",\"label\":\"アリゲータ\",\"summary\":\"アメリカ合衆国と中華人民共和国に生育している円形の吻を持つ巨大なクワガタ目動物\"}"
  reptile.anaconda:
    label: '"anaconda"'
    summary: 「アマゾン湿原などで見られる世界最重なヘビ」
    info: |-
      {"hint":"世界で最も重い蛇、半水生（Eunectes murinus）","info":"グリーンアナコンダは世界最大の体重を誇るヘビであり；メスでは体重量が90kgを超えることもあり、長さも約5〜6mに達する。
      熱帯南アメリカの大沼や川などの水域に住んでいる。
      水中生活者として魚類・鳥類だけでなくカピバラやカメレオなども捕食対象となる。
      卵ではなく胎盤を通じて子供を産む点において他の多くの爬虫類とは異なる。"}
  reptile.anole:
    label: アナキッド
    summary: 北米原産の変色する小さなトカゲ；オスは顕著な垂れ耳を持っている。
    info: |-
      アノリスはアメリカ原産の小型トカゲで、約400種類が存在します。
      雄にはコミュニケーションやメスを引きつけるために使う色鮮やかな喉当てがあります。
      緑色を持つ個体（グリーン・アナキド）は温度と感情によって青から茶へ色を変えます。
      彼らは速く俊敏であり、接着性のある足裏のおかげでガラスに登ることができます。
  reptile.axolotl:
    label: aksohotoru
    summary: メキシコ出身の水棲両生動物で、生涯を通じて幼虫のような特徴を持っている。
    info: "{\"hint\":\"メキシコの水棲サカモリで外鳃を持つ（アミステマ・メヒカンム）\",\"info\":\"アクソロトゥルは、一生幼体的な特徴を保つネオテニー現象を見せるメキシコ原産の水中両生類である。Mexico City周辺の湖沼に固有種であり、汚染によって絶滅危惧種とされている。\r\n驚異的回復力を持ち、四肢や心臓の一時部、脊髄まで再生できる。\r\nユニークな見た目から人気のあるエキゾチックペットでもある。\",\"label\":\"aksohotoru\",\"summary\":\"メキシコ出身の水栖両生動物で、生涯を通じて幼虫のような特徴を持っている。\"}"
  reptile.basilisk:
    label: バジリス
    summary: アメリカ原産の爬虫類であり、短時間だけでも水上を走ることができます。
    info: |-
      {"hint":"水の上を後足で走ることのできるトカゲ（バジリスク）","info":"装飾的なバジルスケック（イエスキリストトカゲ）は、縞模様のある指が水面下に空気を捕らえるため、水中での移動が可能です。\nこれにより沈む前に約20メートルまで泳ぎ抜くことができます。
      オスには顔と背中に目立つ冠があります。
      木々の中で擬態することがその基本的防御戦略です。
  reptile.boa_constrictor:
    label: 王トカゲ
    summary: 体で絞めて狩る南米の大型ヘビ
    info: 王トカゲは南アメリカの大きな無毒蛇である。獲物を捕える際には、その周りに巻きついて呼吸ごとに筋肉を使って強く締め付け、息ができなくさせる。性格がおだやかなので人気のあるエキゾチックなペットとして知られている。
  reptile.box_turtle:
    label: 箱庭カメ
    summary: 小型の陆栖カメで，可動式前面パネルにより甲羅内で体を完全に包み込むことができるものです。
    info: |-
      {"hint":"土地の亀で、完全に甲羅の中に隠れる（テラペン）","info":"箱庭カメは北アメリカ原産の陸棲カメであり、動く前板によって殻を完璧に閉じることができます。\n森や草原などの単独動物として生息しています。
      寿命が百年以上にもなります；野生では一般的には40〜50年生きることがあります。
      米国において保護されており、多くの州では自然から捕獲することを禁止しています。","label":"box turtle","summary":"小さな陸地用カメで、その全体的な外皮内へと自分自身を完全に入れることができる"}
  reptile.caecilian:
    label: セロヴェッツ
    summary: 足がない熱帯の両生類で、蠕蟲または蛇のような外見をしている。
    info: |-
      {"hint":"足のない熱帯両生類で、寄生虫（無脚亜綱）に似ている","info":"セロヴェツは、Gymnophionaというグループに属する足を持たない両生動物であり、研究が少ない熱帯地域での隠れた生活をしています。
      大きなミルクワームや白いヘビのように見えます。
      小さな退化した目を持っており；嗅覚と頭部にある感覚器官である触手を使って方向を感じ取ります。
      いくつかの種では胎盤によって子供を産みますが、他の種では卵を産むこともあります。","label":"セロヴェ茨","summary":"足がない熱帯の両生類で、蠕蟲または蛇のような外見をしている"}
  reptile.caiman:
    label: カイマーン
    summary: 南アメリカ原産のワニであり、一般的なワニまたはオールigatorよりも小型です。
    info: |-
      {"hint":"南アメリカのワニ類で、真のクロコダイルよりも小さい（カイマン）","info":"ブラインド・アリゲーターは南米最大のワニである。
      これは本物のワニより小さく；体長は最長でも約2メートルに達する。
      メキシコからアルゼンチンまでの熱帯地域の川や湖および沼地に生息している。
      皮のために狩猟されているため、一部では数が減っている。"}
  reptile.chameleon:
    label: カメレオン
    summary: 体の色を変える爬虫類で、動く目を持っています。
    info: ジンマスカメレオンは隠れるためにではなく、コミュニケーションや体温調節のために体の色を変えます。また、その両眼は互いに独立して動きます。
  reptile.cobra:
    label: コブラ
    summary: 特有の形状を持つカフーを展開し、威嚇する毒蛇
    info: |-
      {"hint":"脅かされると兜を広げる毒蛇（ナージュ属）","info":"コブラはエラピド科に分類される、頭の後ろにある皮膚を開いてカフーと呼ばれる警告用の装飾を作り出すことで知られる有毒なヘビです。
      その毒素である神経毒性物質によって獲物の中枢神経系が麻痺します。
      インドやエジプトでは象徴的な存在として扱われています。
      特にニグリコッリス・ナジャという種は、二メートル以上先まで唾液状態で吐き出せる能力を持っています。この行動により目などへの攻撃を行います。
  reptile.crocodile:
    label: ワニ
    summary: 川や沼地に生息する古代の爬虫類。
    info: ナイルワニは世界最大級の爬虫類であり、アフリカで水から獲物を捕まえます。現存する動物の中で最も強力な歯を持っています。
  reptile.flying_dragon:
    label: 飛ぶ竜
    summary: 東南アジア原産で、伸張した肋骨上での滑走を行う小さなトカゲ
    info: |-
      {"hint":"肋骨の膜を使って滑空するトカゲ（ドラコ・ヴォランス）","info":"飛ぶ竜（Draco volans）は東南アジアに生息し、延長された肋骨上の皮膚組織によって滑翔が可能な小型の爬虫類です。
      木から木へと領土を確保したり捕食者から逃げるために滑って移動します。
      雄には明るい黄色の首飾りのような突起があります。
      翼を使わずにただ落下しながらだけではなく、主動的に羽ばたいて飛び立つことはありません；それは単なる滑降行動です。"}
  reptile.frilled_lizard:
    label: アガマ・リムコヴァ
    summary: 危険を感じると大きな襟を開きながら両脚を使って逃げるトカゲ
    info: |-
      アガマ・リムコヴァは、オーストラリアの爬虫類で、首回りに皮膚が折れ曲がっている。脅かされるとその襟を大きく広げて威嚇する。
      二足歩行して走る様子から「ミニチュアな恐竜」とも呼ばれる。
      普段は襟部分が畳まれている。
  reptile.frog:
    label: かえる
    summary: 緑色の体と赤い目を持つ跳ねる両生類。
    info: リストヴニツェ チェルヴエノウカは、ラテンアメリカに分布する熱帯性の樹上生活をするカエルです。葉冠で暮らしており、指同士を結ぶ膜を使って飛行します。夜間に活動的です。
  reptile.gecko:
    label: げこん
    summary: 垂直な表面を登ることができる小さなトカゲ。
    info: ヒョウモントカゲワシは人気の熱帯魚や爬虫類飼育用の動物です。足には無数の微細な毛がついており、これによって岩や壁に張り付きますが、粘着剤のようなものではありません。
  reptile.gharial:
    label: ガビアル
    summary: 非常に狭窄な口を開けて魚専門とする爬虫類
    info: |-
      {"hint":"魚を食べる、非常に長い細い吻を持つクロコダイル（ガヴィアリス・ガンゲティクス）","info":"ガビアルはインドの爬虫類で、特徴的な極めて長く狭い鼻が釣りに適応しています。
      オスには嘴先端に突起物があります。（グラハ）
      絶滅危惧種であり、北インディアとネパールの川だけに生息します。
      最も古い時代から存在するカрокダイル科動物の一つです。かつてほぼ全アジアに広まっていました。
  reptile.gila_monster:
    label: ヘルオダー
    summary: アメリカ南西部原産の一文皮膚を持ち有毒な太っているトカゲ
    info: ヘロダマ・ギラ（学名：Heloderma suspectum）は、世界で数少ない毒を持つトカゲの一つです。珊瑚のような肌に橙色と黒が混ざった模様があり、警告を意味しています。歯には溝があるため蛇のように空洞のある歯ではなくて毒素を入れています。動きは遅く、エネルギー消費も少なく年間わずか何回しか食事をしません。
  reptile.glass_lizard:
    label: '{ "label": "blindworm", "summary": "Legless lizard resembling but not actually related to snakes; possesses mobile lids over eyes." }'
    summary: '"Summary": Legless lizard resembling but distinct from actual snakes because possessing moveable eye-lid coverings.'
    info: |-
      {"hint":"legless lizard that resembles a snake (Ophisaurus)","info":"The common legless lizard is an amphibious reptile found throughout Europe which easily mimics snakes by its appearance.
      Unlike true serpents it has movable eyelids and ear openings.
      The species can shed their tails for defense purposes known as autotomy;
      tails regenerate after being lost.
      In Japan they're protected under law due to frequent sightings both within forested areas and field habitats."}
  reptile.hawksbill_turtle:
    label: 真アシタカガメ
    summary: 瀬戸際の危機的な海亀であり、細長いくちばしを持っている。
    info: "{\"hint\":\"狭い嘴を持つ絶滅危惧種の海亀（エレトモケリス・インブリカータ）\",\"info\":\"真アシタカガメは、エレトモケリス属に分類される希少な海洋爬虫類です。\r\n歴史的にその甲羅がゼラチンとして利用されましたが、違法取引によりほぼ絶滅寸前まで追い込まれました。\r\n主食とするのは藻とサンゴ礁内の無脊椎動物であります。この摂餌行動によって健康な珊瑚礁を維持する役割を持っています。\",\"label\":\"真アシタカガメ\",\"summary\":\"尖った喙のある瀕死状態にある海亀。\""
  reptile.horned_lizard:
    label: ロハタ・ジェシュテルカー
    summary: 北アメリカの砂漠地域に生息する頭部に角を持ち平坦で棘のあるトカゲ
    info: |-
      {"hint":"平らかで棘のあるトカゲ、頭部に角のような突起がある（フリノソマ）","info":"ロハタ・ジェシュテルカー（Phrynosoma）は北アメリカの砂漠地帯である米国南西部とメキシコ原産の扁平面格子状の棘を持つトカゲです。脅威を感じると防御手段として目の前から一メートル以上離れたところまで血を噴射することができます。
      この動物は動きが遅く、主に擬態によって身を守っています。
      農薬によりその主要な食物であるアントが破壊されているため絶滅危惧種となっています。
  reptile.iguana:
    label: レオパードアイグアナ
    summary: 熱帯アメリカの大きな緑色のトカゲで、尖った背びれを持ちます。
    info: |-
      {"hint":"大型の食草性トカゲで、棘のある頭冠を持つ（イグアナ・イグアナ）","info":"レオパードアイグアナは熱帯アメリカ原産の大柄な雑食性爬虫類であり、最大で体長が約2メートルに達する。
      頭頂部には光変化を感知できる第三の目を持っている。
      社会的な動物である；支配階層関係では首押し合いや身体色によって現れる。
      主として自然環境の喪失により絶滅危惧種とされている。飼育下でも攻撃的になる傾向がある。
  reptile.king_snake:
    label: キングスネーク
    summary: コブラなどからくる毒に対する免疫力を持ち、他種の蛇を狩る非毒性の北米原産の蛇
    info: "{\"hint\":\"毒のない蛇で、カタトビヘビを含む他の蛇を食べる\",\"info\":\"キングスネークは非毒性なアメリカ産の蛇であり、その毒素に対して免疫を持っており、コブラなどの有毒な蛇も捕食する。\r\n体色（黒白縞模様）は危険な珊瑚のような外見をしている。これは擬態である。\r\nそれはねずみや鳥類および爬虫類の個数調節に重要な役割を持つ。\r\n温和なので人気のあるエキゾチックペットとして飼われている。"
  reptile.komodo_dragon:
    label: コモドオース
    summary: インдонезリア・コンドイズランドでしか見られない世界最大の生きている爬虫類
    info: コモドオースは、体長が3メートル以上になり体重も70キログラムを超える世界最大の爬虫類です。かつては唾液に含まれる細菌によって獲物を殺していると考えられていましたが、実際には毒腺を持っていることが分かっています。シカやブタだけでなく水牛さえ狩ることもあります。この動物はインドネシア諸島の中でもほんの数つの島だけに生息しており、絶滅危惧種とされています。
  reptile.leatherback_turtle:
    label: コウザン
    summary: 硬い鱗板のかわりに革状の背びれを持つ世界最大の海亀
    info: |-
      {"info":"コウザンカエルスは、体長が2メートル以上で体重も700kgを超える世界最大の海亀です。硬い骨質甲羅ではなく小さな骨片（オステオデルム）を備えた革のような皮膚を持っています。
      海洋全体にわたる膨大な距離を移動します；記録された旅路は1万6千キロを超えています。
      ミズクラゲだけを食べていて絶滅危惧種となっています。
  reptile.lizard:
    label: トカゲ
    summary: 温かい地域に生息する四足の鱗を持つ爬虫類。
    info: 緑色のイグアナは中米および南米原産の大きなトカゲです。植物を食べ、優れた岩登りができ、尾が切断されても再生することができます。
  reptile.mamba:
    label: マムバ
    summary: とても早く、強烈な毒を持ったアフリカの木登り蛇
    info: "{\"hint\":\"高速で非常に毒の強いアフリカ原産の木登り蛇（デンドロアスピス）\",\"info\":\"ブラックマムバは世界でもっとも速く、もっとも毒性が強く危険なヘビの一つです。\r\n地面を時速20km以上走ることができ、また木に上ることもあります。 \r\n神経毒素性を持つその毒液には抗血清がないと数時間以内に死ぬことがあります。\r\n名前『黒いマムバ』は体色ではなく口の中の色素から来ています。（実際の体色は灰色またはオリーブ色です。）"
  reptile.matamata:
    label: マタマータ
    summary: 葉っぱみたいに見えるユニークな外観を持ち、南アメリカ原産のカメ
    info: |-
      {"hint":"葉のような頭を持つ奇妙な南アメリカの亀（Chelus fimbriata）","info":"マタマータは、南米東部で最も異様に見える淡水カメの一つです。
      その甲羅と顔つきが完全に腐った葉や枝のように見えており、非常に優れた擬態となっています。
      獲物を歯を使って捕まえません。代わりに大きな口を開けて水と一緒に餌を取り込みます。
      アマゾン河流域の中でも特に静かな水域またはゆっくり流れる川辺での生活をする傾向があります。
  reptile.monitor_lizard:
    label: ワラーン
    summary: 分岐した舌を持つ大型の積極的捕食型トカゲ
    info: |-
      {"hint":"大型の積極的な捕食性トカゲ（ワラーン属）","info":"バランは、分岐した舌を嗅覚器として使用するワラーンという種に属す大きなトカゲです。
      コモドオリョウニシキヘビが現在地球上で最も大きい爬虫類であり、全長は3メートルを超えます。
      ワラーンには知能があり、科学者たちは単純な道具を使用することも観測しています。
      ナイルワラーンはクロcodileの卵を消費することでその個体数を削減します。","label":"ワラーン","summary":"分岐した舌を持つ大型の積極的捕食型トカゲ"}
  reptile.mud_turtle:
    label: 泥食い亀
    summary: 北米の小柄な淡水域・陸域両用カメ
    info: |-
      {"hint":"北アメリカ原産の小型半水生カメ（キンオステルノン）","info":"泥食い亀属（キンストーン）は、体長約15cmで北米と中米に分布する小さな淡水性カメです。
      危険を感じると臭腺から強いにおいを放ちます。
      乾燥期にはぬかるみの中に埋まりヒバーネーションします。
      雑食であり昆虫やミミズおよび水中植物などを食べています。"
  reptile.mudskipper:
    label: '"シュパハベツ・ブラートノシ"'
    summary: 「胸びれによって地上や木々上で動き回ることができる特殊な種類の魚である」
    info: "{\"hint\":\"空気を呼吸して陸上に移動する魚（ペリオファトマウス）\",\"info\":\"シュパハベツ・ブラートノシはゴビイド目というグループの一種で、多くの時間を水中以外でも過ごす。\r\n両生類のように脚状になった胸びれを使って泥地を歩き回る。\r\n湿った皮膚を通じて酸素を取り込みながら、紅樹林などの根っこにも登ることができる。\r\nまたその場所では縄張り意識が強く見せかけも際立っている。\"}"
  reptile.newt:
    label: カメレオン
    summary: 両棲類として陸上および水上でも生活する小型の有脚動物
    info: |-
      {"hint":"尾が平たくて半水生のサメウオ（トリトゥルス属）","info":"チェコ共和国ではすべてのカモシノリ科は法律で保護されています。冬を木々の根や水中以外での穴の中で過ごします。
      繁殖期には雄に蛇のような模様と背中の目立つ斑点があります。
      中央ヨーロッパ最大の大形種であるこの動物は、体長が15cmを超えます。
  reptile.poison_dart_frog:
    label: '"praesynitsuka"'
    summary: ' "中米および南米の熱帯地域における小柄で彩り豊かでありながらも劇的に毒を持ったカエル。"'
    info: "{\"hint\":\"小さな鮮やかな色の非常に毒を持つカエル（デンドロバタ科）\",\"info\":\"パラエスニツカは、中央および南アメリカの熱帯林に生息するデンドロバタ科というグループの中の小型のカエルです。\r\nその明るい色彩（赤・青・黄など）は毒性を警告するために使われており、アポゼマティズムと呼ばれます。ある種類では世界で最も有毒な脊椎動物であるとも言われています。\r\n先住民たちはこのカエルから毒素を取り出して矢にくっつけていました。（ここからは「ポイズンダートフグ」という名前の由来になります）。\"}"
  reptile.python:
    label: パイソン
    summary: 大きな無害性の蛇であるパイソンはその捕食者に対して窒息死させる習性があります。
    info: |-
      パイソンは世界で最も長い蛇であり、マングース・スネークの体長は7メートルを超えます。毒ではなく首や胴を締めることによって獲物を殺します。
      熱受容器（赤外線センサー）を持ち、暗闇でも温血動物を見つけ出すことができます。
      アメリカ両生類学会によると、フロリダでは外来種として導入されたパイソンが野生生物に深刻な被害を与えています。
  reptile.rattlesnake:
    label: チャリスト
    summary: 尻の末梢にあるチャレステークで警戒している有毒蛇類です。
    info: |-
      {"hint":"毒を持つ尾にチャレストイツを備えたピットビパー（クロタラス属）","info":"チャリストは、特徴的なチャレステークが付いた尻の先端を持ち、有毒なヘビである。
      このチャレステークは角質化した節からなり、脅威を感じたときに警告として機能する。
      熱受容体（穴）を持っており、暗闇でも温血動物の獲物を見つけることができる。
      その咬み傷に対して即時の医療処置が必要となる。","label":"チャリスト","summary":"尻の末梢にあるチャレステークで警戒している有毒蛇類"}
  reptile.salamander:
    label: モル
    summary: 光沢のある肌と長い尾を持つ両生類。
    info: スミレモルは、黄色と黒色の斑点がある中欧の保護された両生動物です。皮膚から毒物を分泌し、湿った森に生息しています。
  reptile.sea_snake:
    label: 海蛇
    summary: 海水生への適応がされた有毒な蛇で、パドルのような尾を持っています。
    info: |-
      海蛇は、海洋生活に完全に対応したヒドロフィネ科の毒を持つ爬虫類です。
      彼らには泳ぐための平らなパドル状のお尻があります。
      その毒素は神経毒性があり、ヘビよりも何倍も強力ですが；しかし、これらのヘビたちは非常に温和です。
      空気を呼吸し、定期的に水面へ上がることを求められます。
  reptile.skink:
    label: Skink
    summary: 短い四肢と光沢のある平たい鱗を持ったトカゲ
    info: |-
      スキンクは、滑らかなサイクロイド鱗を持つ爬虫類の大きな科で、種数が1,500を超える。一部の個体では脚が退化し、あるいは完全に無足であることもある。
      オーストラリアブルータンゲ・スキンクという一種は捕食者に対して舌を出して威嚇する習性があり、その舌には鮮やかな青色がある。
  reptile.snake:
    label: 蛇
    summary: 四肢のない鱗を持つ爬虫類。
    info: 蛇は体が長く伸びた、四肢を持たない爬虫類です。3700種以上存在しており、においを嗅いで獲物を探します（ヤコブソン器）。一部の種は毒を持っており危険です。
  reptile.snapping_turtle:
    label: '"かみつくタガメ"'
    summary: 「大柄な攻撃的な米国淡水カメで強い顎を持つ」
    info: |-
      {"hint":"大型で攻撃的な淡水亀（Chelydra serpentina）","info":"アリゲーター・テルスは、北アメリカ原産の大きな攻撃性のある淡水カメであり、強くて湾曲した嘴を持っています。
      陸上では攻撃的ですが水中ではより平和主義です。
      体重が35kg以上になり寿命も40年以上あります。
      雑食で魚類や水鳥を捕まえたり死骸さえ食べます。"}
  reptile.thorny_devil:
    label: モロクス・トリティ
    summary: 棘のある体を持ち、毛細血管によって水分吸収を行うオーストラリア原産の爬虫類
    info: |-
      {"hint":"オーストラリアのトゲを持つワニのような爬虫類で、露水を口に運ぶ（学名：モロクス・ホリダゥス）","info":"モロクス・トリティは数千本もの尖った棘が生い茂る小型のオーストラリア産ヘビである。
      興味深いことにこの動物には棘と棘との間にある毛細管溝を通じて皮膚から水分を取り込む能力があり；その結果として水分は直接的に口中へ送られる。
      彼らは完全な形態では小さなアントのみを食べる。一回につき最大でも約二千五百匹までしか食べない。
      また防御戦略の一環として背中の棘状部分上部には偽装された頭がある。
  reptile.toad:
    label: カガミヒキエビ
    summary: 乾地性の疣状を持つ両生類であり、蛙とは関係ありません。
    info: |-
      カガミヒキエビはチェコ共和国で最も広く分布しているトノサマグ娃です。
      ワタホシモドキの刺胞はありませんが、防御と毒分泌源として機能します。
      毎年大規模な群れとなって繁殖のために水辺に移動し、チェコではボランティアたちによって道路を渡る際には助けてあげます。
      貝や虫・昆虫などを食べていて庭園害虫の自然的な調節者となっています。
  reptile.tortoise:
    label: 陸棲亀
    summary: 陸上で生活するドーム型の甲殻を持つ爬虫類。
    info: ゾウガメは世界最大の陸棲カメで、ガラパゴス諸島に生息しています。寿命は150年以上にもなります。その甲羅は骨格の一部です。
  reptile.tree_frog:
    label: rosnička
    summary: 葉っぱを這い上がる指先に吸盤のある樹上性アマガモです。
    info: |-
      {"hint":"色とりどりの木登りカエルで、吸盤を持つ趾（ヒリダエ）","info":"グリーン・ツリー・フロッグは小型のヒルガメであり、足先に滑らかな表面を這うための吸盤がある。
      チェコでは原産地が広範囲にある；法律によって保護されている。
      温度や湿度により体の色調を変え、緑から灰色または茶褐色へと変化する。
      主におよび雨降る前には夜間に明瞭な鳴き声を発す。","label":"rosnička","summary":"葉っぱを這い上がる指先に吸盤のある樹上性アマガモ"}
  reptile.tuatara:
    label: '{"label":"タートゥアラ"'
    summary: '"summary":"新しい地図の活着化された化石、Rhynchocephalia目の唯一の生存者です。'
    info: |-
      {"hint":"ニュージーランドの生きている化石爬虫類、その目録から唯一残ったもの","info":"タータラは世界で最も古い両生動物であり；彼の階級は恐竜時代に存在していました。
      それは完全にニュージランド諸島に住んでいます。
      成長が非常に遅く；性成熟には10〜20年かかります。
      最古個体は寿命を越えて百歳以上になります。子供たちにも機能的な第三眼があります。
  reptile.uromastyx:
    label: うろますちっくす
    summary: アフリカと近東から来ている棘がある尻尾を持った砂漠トカゲ
    info: |-
      ウロマスチックスは、北アフリカや中東およびインドの砂漠地帯に生息する特徴的な棘のある尾を持つトカゲです。この尾には防御機能があります。
      草食性で種子・雑草・葉などを食べます。
      エキゾチックなペットとして熱帯魚水族館などで飼育されています。
      寿命としてはおおよそ二十年以上生きると考えられています。
  reptile.viper:
    label: ズマイェ
    summary: 三角形の頭を持ち体をねじいている毒のある爬虫類である
    info: "{\"hint\":\"三角形の頭とヘモトキシック毒を持つ有毒な蛇（ウミチビカド科）\",\"info\":\"ズマイェ・オブシェネはチェコで自然に生息する唯一の一夫多妻制の有袋類です。\r\n背中の波状模様や、鋭い歯が特徴的です。\r\n刺咬された場合でも痛みがあり医師の監視が必要ですが健康な成人では滅多に致死的なことはありません。\r\n法律によって保護されており；チェコ国内において捕獲したり殺すことさえ禁止されています。\",\"label\":\"ズマイェ\",\"summary\":\"三角形の頭を持ち体をねじっている毒のある爬虫類である\"}"
  reptile.wall_lizard:
    label: wall gecko
    summary: 細長く速い体つきをしており、石垣や崖などの環境に生息する爬虫類である
    info: |-
      壁鬣蜥（かべじゃくりゅう）は、南ヨーロッパと北アフリカ原産の小型トカゲです。チェコでは温かい岩場や壁面に導入された種として見られます。
      素早く敏捷で、危険を感じるとしっぽを振り落とします。
      気候温暖化により最近数十年間でより北部へ範囲が拡大しています。
  reptile.worm_lizard:
    label: クモリヘビ
    summary: 土中での生活をする、ナメクジのような外見を持つ無脚の地底性爬虫類
    info: |-
      {"hint":"足のない地中を掘る爬虫類で、大きなミズワラムシに似ている（アフィスベニア）","info":"クモリヘビは熱帯地域のアフリカとアメリカ大陸に生息する、研究が進んでいない無脚の両棲・陸栖動物である。見た目は巨大なナメクジのように見える。
      体には区画された皮膚を持ち、退化した目のみがある。
      彼らは一生を通じて地下生活を行い、蟻や白蚁などを捕食している。
      特徴的なのはその風船のような動きだ。
