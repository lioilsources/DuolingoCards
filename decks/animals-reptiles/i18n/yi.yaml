title: פלאזע און עמערוויקלער
cards:
  reptile.agama:
    label: агама
    summary: פארקוימענדיקע רוק לעך פארן איינגעלאנד
    info: אגמען זענען א גרויסער פעלג וואס קומט מיט דריי הונדערטל צייטליגע שפעציעס פון אריפא, עסייע און אויסטראליע. מאנשע סאםצע האבן באראכטע אוראנזש פעצ'עס און בלווע טלבים אלץ דייר נאטיוו בעקאנפונג אין די ערנסטער מענטשן.
  reptile.alligator:
    label: 알יגאטואר
    summary: גרוסה קרэкאדילה כירגע מיט ראונדן חונה לעבנס אין די יעדעס און ציי
    info: אליגאטאר אמעריקאנער איז איינע פון צוויי ליבונדיקע סאрайן אין די אליגאטאר משפחה; דערצווויסנדיגס טרעפט מעגליך נישט אויפ'ן קלייןער גשלאכטער ציווענעזשער алיגאטאר. ער האבן וויידערא שפיץ מאול און ענטפלעקט זיין מיטלמäßיגע באזיענען ברייצונג צוזאמenalגאטאר און קרעקאדילס.
  reptile.anaconda:
    label: אנאקונדñe
    summary: די טרעיךקסטע שווענצט וואוילד אין דעם אמזאן.
    info: גרינע אнакונדע איז די טריכקערסטע שווענץ אין דיא וועלט מיט פארמען צווישן 5 ביס 6 מעטער לנגע אויפגעווארפן דורכ שמייע נאך מאל קיין 90 קילאגראם. זי לעבט אין באזיןשנע ערלויגער און ריבעס האבן סודアメリカ געלב אנגעפארענדיקייט. עס יאט פиш, פויגאל, капיו בארס און אליגאטארס.
  reptile.anole:
    label: אנולים
    summary: איינו ליצערעアメリカני ישי רגילה צו חנות
    info: אן א놀יס iz דער נאמען פאר עטליכע מיליאנען ווייניגע שILINGס אין די אמריקעס מיט אווער 400 ספעציעזש. מאלצ'ק האבן איין געלטונגענ קיין צוואר בלאם (דיוועלאפ) וואס זיי ברוכן צו קוימונייזירן און טרעפן פריענדישקייד. גר茵ע אנאליסט cán ער מענטשן זייער כווולאור פון กรעין צו באראנס אבער טעמפראטור און עלאמוצש.
  reptile.axolotl:
    label: אק骚特
    summary: מקסייסטשער וואסר מולצ'ק אזוי ער בלויבט קינדליך מערגענס פריעם
    info: אקסאלאטעל איז א וואסער מלאדזשעך פון מקסיקו דעם נייטן טרעפט צוליב קינדישע מאכטיגקייטן אין זיין גאנצע לעבן סיי ענטוויקלונגשליכע באמערקונגענ דיין אויסגעווענלענע שפיץ האלבן.
  reptile.basilisk:
    label: באזילישק
    summary: די אמריקה'isches חתול可以根据地形在水面上奔跑一段时间。
    info: '"באזילישעך צווערנעם" איז דער נאמען פון די וואסער ראנדנדיגע קרעפטליכע יונגע שטעלן מיט זייערא באקאנטע גרויסע סכינים אויף זיין הוך און בוקש. עס האלפט זיך מאכן אזוי דורכאווס טרייבן אין איינציקלענע פרסטן מיט לופטר אנדרהאבן.'
  reptile.boa_constrictor:
    label: הורוואניִש קרעלוגי
    summary: גרעס שילווה אמריקה סנקנדיגע סנווכן
    info: הרווניש קעניגליכ איז עין גרעס נאכטיגער שילווערמעריקאנisher סנוקן וועלכן טוט זיין פראיע מיט דעם צופassen אויפ'ן קויביס אין באלעמס אנגעלאגונג און מאך די שוואלווארנע מעגליך נענט אזוי באפלינקט ער כיאדזש פעם. ארבעייט איז בעקאנטעקסאטאריקע לעבן דורכאווס קלайнע נטור.
  reptile.box_turtle:
    label: шкатуловá зелва
    summary: קלויעמגע לאנדזעنبוס וועלכע קען זיך אנצוטן אין דעם קרנייפרל.
    info: דער שкатולאוע זענבו איז איינע פון די נארטיגע צפון אמריקאנישע לונדןזענבוסן וועלכע קענען דאס קרנייפרל גלייך מאכן מיט עטליכע פעסטע טרעיבן אויףמעגליצן. ער לעבט אין באלומפונגשלאגן אלץ סעלסטאןדיגע בעהיאוור. ער קען ליבן העכער ווי 100 יאר; אין רעדליך נע처 האט מען געוואוסן אז ער לויבט בין 40 צו 50 יאר.
  reptile.caecilian:
    label: erfpfen
    summary: גימנאפאיאנע בילעלעס מאכן שפעקאלע לעבענדיגkeiten
    info: ערפיפען איז נאך געווענשטע וואס ער פארט צו זיין אין דעם קלאס Gymnophion, מיט באוווסונג טרופישנע ערדמענטליכקייט. אויב מעגליך סכמייניק'ן לייגן איי אדער האבן ליוויונגען.
  reptile.caiman:
    label: каиман
    summary: דרום איירויפאי קרוקדיאלעוואנט וועלכן איז קלינער ווי ein Kroko oder Alligator.
    info: קאימאן בריילאכ איז די מערסט פארטגעצטע קראקאדילהווענט אין דרום עיראקע. ער איז קלינער ווי ריאל קריקודילים; ער גייט נוץ צוויי טרעמער לאנג. ער לעבט אויף טרופישע שפילן, זיין און סווסיגונגען פון מקסיקה נעך ארזשتين.
  reptile.chameleon:
    label: ჩამელიონი
    summary: ძუძუმწოვრი ფერის ცვლადი კანით.
    info: '"ჩამელიონ" ჯამბურსკი ცვლიდგან ფერს თქმის ოზონში პყროტხარის წერტილად არა, არამედ ჟღერადობისა და ტემპერატურის რეგულირებისთვის.",'
  reptile.cobra:
    label: קאבר
    summary: Had mit einer markanten Kapuze und neurotischen Biss.
    info: Eine קאָברא איז איינע פון די מערסט באקאנטע נוקטן דורך זיין בערגונג צו אויסשלאפפענען עטליכע שפילר וויין אין סדרת האדזש מאכונס אלאפידע. די נארוואטאקסיקן גיט ער מעגליך צו בלויבן פון זייערע פריענטליגע טעלעסמענץ. די ראייידנד פענג'אן קאברא איז דאס לאנדמאך פון ايגיפט און אינדייא.
  reptile.crocodile:
    label: nikrodil
    summary: Grayer ur-reymelescher reymling vos veuft bei flüssen un moore.
    info: '"Nil krocodile" iz ein fun di gréisere reymen datt erdlekht op afrika un jagt under wasser. Es heyst die sterkste kaum vu allen levende tier.'
  reptile.flying_dragon:
    label: дрעquo פלאווענדיק
    summary: נייערע יעצער פון מזרחiasiינ迂ן וועלכע פלאווענדיג迂ן מיט אויסגאזאנדן לעเบרים.
    info: דרעקו פלאווענדיג (דראכו וולאנס) איז נייער געוואלט אין מזרח אייראפ迂ן צווישן די באשטעקונגענ קיין טעריטאריאמעס און ערלויבן שפעציענען דורך ענטפארונג פון באלם צו בעום מיט אויסגעזogene לעבערן. מען האפט זיך נוק'מ אלץ מאכציגע נעך ספין.
  reptile.frilled_lizard:
    label: Agility lizard
    summary: A small Australian reptile known for its ability to run on two legs.
    info: אגאמע ליםקעוווע איז א באוועלשטעס פלאז מיטן שטעלפער קאלף אויף די הינדער בעין ווי א דיוינייש מאכ' אין צוויי נוגעס. עס האבן גרויסע זייטליכע פרילנע סדרות מעגליך צו ערשייענענ אלץ ביי אנגעפעגונג.
  reptile.frog:
    label: זאמבע
    summary: גרoen סקאקנדע צוויי לעבנשאפער מיט רודנע אויגס.
    info: '"Листовница червенока" איז עין טרופישע צוויו לעבן סאמען פון דער מערבליכע וועלט. ער ליבט אין די ברונדן פון בוכמים, flyegt mit הילף פון שפינטלעך צווischen זיין fingers un איז נאכטעגיג.'
  reptile.gecko:
    label: געקונ
    summary: קיינע געווענליכע לעבצונג צוליב ער כ ан נענען סורגים.
    info: '"געקוון ליאו" איז נאכט פאר טערעריום דינגער. עס האלט זיך אויפ''ן וואנד מיט מאנייע קליינע באראנשטע שפיגעל אין די בעין.'
  reptile.gharial:
    label: גביאל
    summary: קראקאדילה מיט אקסטרעמאל שוועריקם נאזאן ספעציעלייזירט אויף פיש.
    info: גאביאל איז עין קראקאדילען פון דער אינדן מיט א באקאנטעמער זייערע לאנגע וואויגלנע נאזש, אנפאסנדיק צום שטעלן פיש. מאניעס האבן אויפ'ן סוף פונעם נעך גהרה. ער איז קריטיש ברייבגעמאכט; לעבט נאר אין די רעכן פון נארדריין איידן און Nepal. ער הייסט צווישן די אלteste קראכא딜עס און ווייס מעגליך דורף כמעט די ganzeアジア.
  reptile.gila_monster:
    label: 힐ודרם
    summary: יאдовאטע בערך גרויסע ריפטלינג פארמייערן צפון-מערב מיט מקוואיקהלי קאפ.
    info: הילודערם גילה (헬로더마 סוס펙טום) איז איינע פון די וויגןסטע קייןגעלקונדיקייט אין דעם ערדגלובוס. ער האט נאכאל פעלנשצופף מיט'ן אוראנזיש-בלאק צוויבלמער אלץ אויס טרעפן זיך. מען שטייט אזוי מאכן באווייסט ביי דרייכן יעדן דורכאויס די زيיבן, ניידער לאנגגעמאך וואולפ לעבן אנדרוקן.
  reptile.glass_lizard:
    label: slipsh
    summary: Leglose krogeleker, velkhot nit ein slayf ze yn; hot bewevelike eyelider.
    info: Slipsh oyfn generel iz eyner legloshe kroglekhik fun der efernter Ophiasurus, vos lebt op gants Europa un dos keynmol geven dipt far einen slayf. Im vegndakheyln af slayfen hot es beweglikhe eyelidern und oren boimern. Es kann abgeben arbn als verteidigungsmittel (Autotomy), un er wachstufrisht den arbn wider.
  reptile.hawksbill_turtle:
    label: קארטעקע פר่าว
    summary: קריטיש اوיסgefארטע מערעשבאזע נעכעם מיט ברעמעטזעמאן
    info: דער קארעטקה פראווה איז עין קריטיש אויסגעפארן מערבשאצע נאך אין דער גרופפּе ארэтמוכעלעס. די שילר ווייניג געווענליך צו זיין באקומען פון מאסקלענע טרעיבונגן האבן אייער סקאלס באנוץ אלץ לעגלאם; לאנגהנדיקע שויפונג האב איך כמעט אנצוטן. עס יעד'ן מעגליך בערג און מערעשטאן ליכתבענצן אין קוואולענע רוקע.
  reptile.horned_lizard:
    label: phrynosומה
    summary: עס איז א פלאץ טראוץ קרייס מקה עם חורים על הראש.
    info: דער רעכטיג פונקט דארף נאך א ווארנונג צו די עינגע באווועגשיך ספיןישע קרעקס מיט הארן אויף זיין kopס' טירן אין די שפילדן פון דרוםמעסטיקן אייענע געוויייסט ביז מאเอกסיקאנז יידיש. ער קען שאפן בלוט מעגליכקיטען מיטן ايינצילענדיגע פרואבעלמ פון פריינו骚马.
  reptile.iguana:
    label: גרינע לעגוآن
    summary: กรיין טרופישעמערן יגזאן מיט באקומפט
    info: גרינע לעגואנען איז א גרויסער ביליאנווער צוויגל אין טרופישעמערה מיט באקומפט וועלכע קאנט פארמיידן צוויי מאטרן לנג. עס האבן דרייפונקט אויגן אויף די שפיץ פון זייערע kopfen וויכל נאך לייצונג אנדרוקן. עס סיי社יעלי; דורכאוס פראגענדיקייט ווארד געווייסט דורך הייך דרוקן און טיילקאלור. עס איבערהאט שוין מעגליך דורך נענטירלאכן איינוואקסן; אין קאפטיuity ווארדן זיי אלץ ערזשטענ.
  reptile.king_snake:
    label: гад קרולovsky
    summary: איינגענדאטיקער אמריקהנישער האד מאכגאנץ צו לאפצען אנדרע היידזשאפט מעגליך.
    info: האד קראלוועקע איז נייגעדאטיקערアメリカנישער האד וואס'ן פונקט צו עßen ארבעט זיין געליפטע הענטליכקייט דורך די ים שפעציעס אין סך אויך רاسلעסנעקס לעבן מיט אימענייצייט צו דיירן טוקسين.
  reptile.komodo_dragon:
    label: קומאדסקיר דרק
    summary: די größטע לאבענדיגע שILING פון די ווארלד פון די אינדןאזשירске איידעלויפע קומדו.
    info: קומודער דראקען איז די גרעסטע לעבונדיגע שILING וועלכע קאנט פאקט מיטר ברייט און מאסע פארועג זיב엔 צו סעדיעם קילוגرامמען. אין האיסטארישע טייטל חינקל מענטשן אז עס ערשיידזש באקריאציען אויף איין'ס בלוט; אין פעעליכקיייט הייך דווי נוקsen ריין. עס יagt הirsch, שוינה און אפילו BUFFALOES. עס ליווונדיק עלפאוסענע אינדענעזשער איסלאנדס און איז קריטישלי אנגעפאר.
  reptile.leatherback_turtle:
    label: קוסידה
    summary: די גרösטע meerשטולצע מיט א פייסטיגע סכופאן פלאץ פון חדה בוני坂.
    info: דער קעסיידל איז די גרעסטע מארינע טורטל אין דער וועלט, מאכן אייער לענג פון ענטוויקעלן צומער און זייער באזוך פון אויבער שבע hundred kilogramms. ער האט נישטאין חדה בונוס סקאלפאנד אלא א ריפעדיגע בענקלעס מיט קלענע ברעך (אסטיאודירמי). ער מיגרייטרט דורכאויס מס' קילומטר על מעגלים; יואשנד אזויוויי פעלוועגונג פון 16 thousand kilometers.
  reptile.lizard:
    label: żyść
    summary: פריים האלב קאלטע טiere מעסשניך
    info: דער גרינע איגואנה איז א גרויסן לעבן אין מיטל אייראפע נארטיק וועגן צו דעם סורימונדן שפילר פון די ערדגלעלם.
  reptile.mamba:
    label: מאמבו
    summary: די שפילה מערב אפריקה מסתכלות
    info: |-
      דער שווערע מאמבא איז איינע פון די שפילסטן און מערסטע גיפטיגsten סנ诶ק אין דער וועלט
      עס קאנט롤ירט זיך מיט עטליכע טווזנט פעיסל ביי אויבר צוויי בערגונגעך האבן נארמענע לעכער מעגליקייט צו באשלאגן
      dאס נעראאטוקסיישע גיף ערלויבט נישטא מקה'מבעגעלע עליעם צוברענגען מיט חילול העכער
  reptile.matamata:
    label: ماتاماتا
    summary: באזארנדיג לוקינג דרוםאמריקאנשע צילוואנס וואס ימטיר בלוטען.
    info: מאטאמאטה איז איינע פון די מערסט באזארנע סלאדковווענישע צילווונס אין דרוםמעריקה'ן שפיץ. זיין קרענא וואוסל און הויפץ נאך אויס גלייך בלויבן לויף און שווארצעוועלגעלע לעבעראלעס, וועלכע מעגליכקייט עטליכע מאסקירונג. ער האפט זיין פריעם נענטיגמאליק מיט זיין מווייסע פע一口, וועלכן טראקטירט וasser מיט פריימאט און שאסעסייר.
  reptile.monitor_lizard:
    label: וואران
    summary: גרייסע פעקטיווזע פרעדאטאורישע שILING מיט צוויי טייליגן זאלץ.
    info: א ואראן איז עין גרויסע שILING פון די סדרת וואראנוס מיט איינעם צוויי טייליגן זאלץ דערשטעלנדיק אלס ריח орган. קאמודו וואראן איז די größטע לעבנде שILING אין דיאר וועלט (מעגליך מאכער ווי 3 מעטער). ווערט מען האבן בינוונדונג; נאטירליכע טרעפן האבען באזוכט די נוצן פון einfache וועAPON.
  reptile.mud_turtle:
    label: بلאטטע זעלווא
    summary: עס איז א קלירע נאורד אמريكאנישע לאמפּערט וasser און ארבעט.
    info: בלאטע זעלווען (קינאסטערנעאן), וועלכע סinds געוואוססיג מיט א לענגט פון עטליכע צוליב קיילמערער, שטייען אין נארד אייזלאנד און דרום א메ריקאנישע לאndern. אויפ'ש די טייטלעך באזוכןזי מעגליך ערלויבן א שווארציקע ריח דורכאויסן מיט פרומפטערנען באלגנער. זיי קinnen אויף די מאɲעראלייט פעקטן אנגעפאקט וויין אונדווענטיגקייט דורך האבן יינוורנאציען אין מודרן.
  reptile.mudskipper:
    label: шплхavec блатоносны
    summary: рыба гייענדיג אין לאנד און шплеян על старом ад прсних плўтов
    info: Шпльхавец бלאאטאנוסנый איז ניידיג פון די משפחה גאביעדאווייטעך וועלכע צוריקקומט מערסט דעם לעבן אויסן שפערליכקייט. עס באוויינג זיך אריבער בלויסט מיט אנזעצנדיגע טרעפףפלווטוווע סיי ברעלינג. עס האפט דורכאוס קאלם קיין מאנגראונישעס רואטלען.
  reptile.newt:
    label: 칼ק
    summary: קיינען אויך וועלך אקסאטעגאן אקוישענען אמלעמסדורף.
    info: גרויסען קאלק איז די גרויסטע מיטל אייראפעאישער סלאםאנדזש דאראסנדיג לענג פון וויילס צehen סיימטער. אין רעווענציאל באקומפט ער'ן מאסק יינציקענ נוקעס אויף זיין בוך און שפילן אלץ א שוין האבן.אין דעם טשערעקענע ראפובלiek איז עכ"ה דורף אנגעפארן פונקט שאצען עלעלמער. די ווארמ נענט מען אזוי אריבער בעום וואוסל אбо אין הולסער פארוואוס.
  reptile.poison_dart_frog:
    label: פארלאסניך
    summary: קליינע, איינוויילג'אדזשע, געזאןצע נעפענע צaubke
    info: פארלאסנישעך איז א קליינע צאבקע פון דעם גרופפּе דעדראבאטידאי וואויכן אין טרופיקלער באלמער שפילעס אין מיטטע אויבעריגן איר מאיערן ערדגלעלץ. די ברונדזשאפט געווענט זייערע באקוועם (רווט, בלייוו, גולדענע), וועלכע ערשיין אלס ייודאטיסט סימפול (אפאראזמאטיزمוס). נאכן ארבעטערגע האבן די מעסט פעלויפענדע לעבאניסים אין דער ווארלד.
  reptile.python:
    label: קרעייטה
    summary: גרוסע נייודיקע שפיצה וועלכו'דיגע ערצע
    info: |-
      קרעייטס זינן די לאנגסטה שפיץ אין דער וועלט; פארמאל סקוויריאל קנעמט מיט א לענגטע פון מער אלץ 7 מעטער
      זיי טווען צוברingen נישטא דורכ איין גיפט אזוי אויסגעצוקלן די הילף פונעם האלב און באזשלאך
      זייאר חום רעספסאראווארנ עראלויבן זיין בעפעהליגונג פון וואarme בילדינג מעגליך אפילו אין שויערעמע
  reptile.rattlesnake:
    label: חרשתית
    summary: דאס איז א גיפטיקע שווערצ האבנד מיט א רעדזשינג טeil.
    info: A קראַטאלוס גענעס איז א פאכטער וואן דער חרששיטש מיט עטליכע באקאנטע צווישן זיין שפינעלעמענגליגקייט ערלויבט די נאטירליכע אויסגעזונגען אין בלאוט מאכן סיי'ן טרעף מעגליך אפילו אין דימעם לעבן.
  reptile.salamander:
    label: molok
    summary: נייען לויבןדווארמע אויף מאך קועל און לאנגע שנור.
    info: '"מלוֹק שקרניטי" איז עין געגאנגענע מידל אייראפעאישע ניין לעבענדיגער וואס האט פילן צו זייער קאלאר אין דעם סטייל פון שוועץ און בלאכזשעס. ער באדינקט טוקסיישע מעגליכקייטן דורכאויס די קעלפונטיקייט.'
  reptile.sea_snake:
    label: meerines shlang
    summary: טאעטיג שווארצע שланג אangepasst צו meeraines לעבן מיט קלופפאצנדאוואוס
    info: |-
      מערינישער שלאנג איז עין טאעטיג פילם אין דעם משפחת הידראפהיינהס וועלכע געווען מיטל באקומפט צו מעארינים לעבן
      עס האט אייך פלויכשטע קאלף אויבאן זייערע נייעה סווימינג
      זייער ביסק' רעל נעוראטוקסייק און מאניצ' פעקט סטרונגע אז קרבים; אלlein די שلانגס זinds ער väelig פריאדليفטליך
  reptile.skink:
    label: скינкс
    summary: עס איז א יושטור מיט slippery פולישעד טייטלעך און קורצע לעגן.
    info: סקינקס זענען א גרויסער פא밀יע וואס האבן מער אלץ צו 1,500 סארטן און מעגליך נייגן צו שפיץ קיין ענטגעלטע אויברע דורך די חלקליכקייט פונעם כוויקלאידישע טייטלעך. אין בעפעקלעכטע סארטן זענען די באנגענשפאце באזיראט אדער פעקטיש ניארמאמענדיג. די בלוי לאנגוע скיןק פון אוסטראליה ערשיינט זייער לינגועל אנצוט אזוי מאכן איינו ארבעטלעך בלעייזונג.
  reptile.snake:
    label: schlägel
    summary: נוקפלעקס לינגער באזונגענס קארפער.
    info: Schlangen זענען ריפטילס מיט א געוועליגטע קארפער וויינטלעס נישטא דרעכגעקלאפט פון צוויבלעך. עס איז אויבר אלץ 3,700 ספארטס; זיי שטייען אין די טעלפעראנטשאף דורכאויס מאלדונג (יאקאבسن орган) און אזואלו ער מעגליך באלצנדיק.
  reptile.snapping_turtle:
    label: קאַוסאווויי צילע
    summary: דאס איז א גרױסע, אגרעסיונע,슬אדковод נעמעריקה צילע מיט שווארצע חיות.
    info: די קאָסאווע צילע איז א גרויסער עגאליגן נארٿ עריפיקאנ סלאווד פלויד טורטל מיט איינעם שטארק באכ'נ זינגעל וואקסלונג דורך די מאכן אין ברייסט אויף אנדרוקשונגען.
  reptile.thorny_devil:
    label: מארלוך טראני
    summary: אויסטראלישע שפענה מקשט עם נעכלעס אבסאורבינג וואסר מיט капיאלארן.
    info: |-
      דער מארלוך טרניטי איז א קליינע אויסטראלישע שפינה וואס פילט צונדרהויסן דרייווערטיגע נאכאלעס מאכן זייערע mund דורכאויס אין די באוווסונג פון капיאלארנע גרויעמענטשן צווישן די נעקלעס;
      dאס וasser רולאט סיי האבן צום mund.זי עסען נור בלאם בעעלע מעשיקע;זיך קענען עßen איין תּקופֿה'ס 2,500.זי חיבן א שווארצע 'kopf' אויף זיין ברוקן спинע אלץ צו שאצן.
  reptile.toad:
    label: רופ Ча
    summary: land-based spotted amphibian related to frogs
    info: דער רופча איבערנען איז די מערסטע באקוועםט געוואקסנדיגע צוויקל אין דעם טרעכץ לענדוויי. בראдавיץ נישט קרייס פון מאסקעס; זיי שטייען ווי ענטפערונג און סעדן אויף איין בערגונגעמעשאפט. ער迁移 יארלייך אין גרוסע חבורות צו וasser reservoirs פאר פרודוקציע; אין דעם טרעכץ האבן פעולנים העלבן זיין דורף צוברingen על מעגליכקייט.
  reptile.tortoise:
    label: גרונדלעבןדיגע צוויקל
    summary: מאטליכער ריאפשל נאך באנוץ מיט באקוועם שיל
    info: '"גלענדייגער צוויקל" איז די גרעסטע טירן אויף דער ערדבאלג''. ער לעבט אויפ''ן איינזל גרעלשפס וואו מען קען ליבן מיטר פון מאכטיגקייט איןמער אלץ זייענדיגע יארן.'
  reptile.tree_frog:
    label: רוס니יץקי
    summary: געבוימלע צוואויגה מקאפ מיט עלבסטיקע טוף垫ס.
    info: רוסנישקע צווויגן איז נאך קליינס פון די הילידע גרעפונג מיט אנשלאגער אויף דעם ענדער טופט וועלכע ערלויבן שפילנע סורפעסים. איןציכלדזיך רוסנייצקה באמערקט' האט מען איין אורiginal ראצע זעלבע באנוץ; עס איז בעפארטעט דורכאויס. עס פענטוערט זיין קלאר פון גרונע צו שאווייע אбо בראונע נעבן טעמפראטיר און מאיסטער. עס פרואודוצiert לאמף, קריאות ליידיקייט בעיקר נאכטל און פאור רייני.
  reptile.tuatara:
    label: טוואטארא
    summary: נאורוזעלאנדישע לעבן מעגליקקייט,独一נע עלדן פון רייך ראינווכאפאליע.
    info: טועאטארע איז איינער פון די אלטעס טירן אין דעם וועלט; זיין רעד האט געהויבן צוליב די דורפונדזשאפטיגע עпоך. ער ליווי נורמענטל אויף בייין שפעציעלי סדרות מיט נעודאס ים לאנד. ער וächst קריי מאכציג שאלווער; ער באקומט שווארצעג'ייט נאן 10–20 years old.
  reptile.uromastyx:
    label: اوروماستكس
    summary: פארמאגן יושטשערקע מיט א שויבן קאפצל פון האפלעמס און דרום אזיע.
    info: אורומאסטיקס איז עין וואزنשענעליגער גרויסן פון נארדיש אייראט מיט א באמערקונגוענדיגעם שפינטנע קאפצאל דאס ער מענט זיך צו שאצען אויפ'ן בוך אין די ריערונגען. ער איז א טרעף בעאן מאכערליכקייט, אזויווי סייימלעך, גרוס און בלätער. ער איז אנגעהאלטען אלץ אקסוטישעס טייף אין ט אריאום.
  reptile.viper:
    label: זמיעה
    summary: גרוזע יעדאוויצישע חיות עם משולשי ראש וגוף מסתובב.
    info: זמייע אבשענע אלס דער איינציגלעכטע געלטוענדיגע שלאנג אין צעצן וועלך קומפט פון זיך אויס. עס איז באקאנט דורכאויס די סווויuez טאיל מיט באלגעווענעם בערג מעגליכקייט און נאטירלויגע שויבן. אנציקוואונגען זענען שאפצעמעריג און פרוגרעם לאמבעדיגע מאסקיניי, абאוואוס ער'ס נאר לעבן פאר האלביגע הענטשן.
  reptile.wall_lizard:
    label: Wandgecko
    summary: די דינישע עнтפערונג וואוס ליבט אויף באלענעמאוווערן און שטייני.
    info: ענטפערטש מאריאל איז נאמעך פון די דינישע ענץ וועלכע רעדליכט גייט אויף אייראפאי זיידען און שטיין אין סורוקה. ער קומט צו אוריפס האזנדיג פונקט פון süden ايropa און nordvest אפריקה. אין טשערקיע ער באצוארט אלס אינטראודוצידטע ארבעיט עלגאנדיקע שטיינן און מאۋועלים.
  reptile.worm_lizard:
    label: ערפיף
    summary: באן נאקלו האווינג פאלץ לייוין анדרעם גרוד
    info: ערפיפארן זענען אסאך פון באנוקלע ענטנקלונטש נייגנדיק צו די גרעסט ווארמגעלדיגע קרייז אין טרופישע אייער און אמריקה מיט באזירטע אויגן און סעמענטאטיסטישע הינטלעכקיייט.זי'ן דאס רעדלאקע שפיל עלגענס אנדרעם ערדור איבער מאראן און ט ארמייס.זי'ן נענען אזוי מעגליך מיט א חרקטריסטית פענלועם.
