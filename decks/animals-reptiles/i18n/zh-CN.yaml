lang: zh-CN
pivot: false
title: 昆虫和两栖动物
cards:
  reptile.chameleon:
    label: 变色龙
    summary: 一种皮肤能改变颜色、眼睛可独立移动的蜥蜴。
    info: 也门变色龙（Chamaeleonidae科）会变换体色，不是为了伪装，而是用于交流和调节体温。它的眼睛可以各自独立活动。
  reptile.crocodile:
    label: 鳄鱼
    summary: 一种生活在河流和沼泽附近的古老爬行动物。
    info: 尼罗河鳄是世界上最大的爬行动物之一，主要分布在非洲。它们从水中捕猎。它的咬合力在所有现存动物中是最强的。
  reptile.frog:
    label: 青蛙
    summary: 绿色跳跃两栖动物，有红色眼睛。
    info: 红眼树蛙是来自拉丁美洲的热带两栖动物。它们生活在树木冠层中，通过手指间的膜滑行，并且在夜间活动。
  reptile.gecko:
    label: 壁虎
    summary: 一种能够沿着垂直表面爬行的小型蜥蜴。
    info: 豹纹守宫是一种受欢迎的宠物爬行动物。它依靠脚上的数百万根微小毛发附着在岩石和墙壁上，而不是使用胶水。
  reptile.lizard:
    label: 鬣蜥
    summary: 一种四足有鳞的爬行动物，常见于温暖地区。
    info: 绿鬣蜥是一种来自中美洲和南美洲的大型蜥蜴。它们以植物为食，是出色的攀岩者，并且能够再生断尾部分。
  reptile.salamander:
    label: 火蜥蜴
    summary: 一种有光滑皮肤和长尾巴的两栖动物。
    info: 斑点火蜥蜴是一种受到保护的中欧两栖动物，身上带有黄黑相间的斑纹。它会从皮肤分泌毒液，并生活在潮湿的森林里。
  reptile.snake:
    label: 蛇
    summary: 一种无足的有鳞爬行动物，身体细长且灵活。
    info: 蛇是体形修长、没有四肢的爬行类动物。目前已知超过3700种；它们通过嗅觉（雅各布森器官）来捕猎，其中一些种类是有毒的。
  reptile.tortoise:
    label: 陆龟
    summary: 生活在陆地上的有圆顶甲壳的缓慢爬行动物。
    info: 象龟是世界上最大的陆生乌龟，生活加拉帕戈斯群岛，并且可以活到超过150岁。它的背甲是骨骼的一部分。
