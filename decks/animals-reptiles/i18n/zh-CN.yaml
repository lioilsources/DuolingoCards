lang: zh-CN
pivot: false
title: 爬行动物和两栖动物
cards:
  reptile.agama:
    label: 变色龙
    summary: 一种具有鲜明着色特征且主要分布在非洲地区的小型双足移动生物。
    info: '{"hint":"非洲和亚洲的色彩鲜艳岩石蜥蜴（变色龙属）","info":"阿加马是来自非洲、亚洲及澳大利亚的大约有超过300种的巨大爬行动物家族。\n雄性红头阿加玛拥有显著橙红色头部与蓝色身体，作为其支配地位的表现信号。 \n它们在体温调节过程中会主动改变颜色；寒冷时较深暗，在温暖环境下则更明亮。 \n某些种类如飞蛇能够利用延长肋骨进行滑翔。","label":"变色龙","summary":"一种具有鲜明着色特征且主要分布于非州地区的岩栖型两足行走小型动物."}'
  reptile.alligator:
    label: 短吻鳄
    summary: 一种具有圆形吻部长居于美国与中国的大型爬行动物.
    info: '{"hint":"大型鳄形目动物，拥有圆钝的吻部，在美国和中国均有分布（短吻鳄）","info":"美洲短吻鳄是现存两种短吻鳄之一；另一种是中国较小体型的扬子鳄。\n它与鳄鱼的区别在于更宽而圆形的嘴以及闭合嘴巴时牙齿不可见的特点。\n它们生活在美东南地区的沼泽、河流及湖泊中。\n它是重要的顶级捕食者，并对湿地生态系统起到保护作用。","label":"短吻鳄","summary":"一种具有圆形吻部长居于美国与中国的大型爬行动物."}'
  reptile.anaconda:
    label: 绿水蟒
    summary: 栖息于亚马逊地区的一种世界上最沉重体型巨大的爬行动物
    info: |-
      {"hint":"世界最重的蛇，半水生（学名：绿森蚺 Eunectes murinus）","info":"绿水蟒是世界上体重最大的蛇类；雌性个体重量可达超过90公斤、体长在五到六米之间。它们生活在热带南美洲地区的沼泽和河流中。
      这种蛇具有很强的游泳能力，并以鱼类、鸟类以及凯门鳄等为食猎物包括鱼、鸟甚至凯门鳄。
      与大多数卵生蛇不同的是，它会直接产下活的小崽子（胎生）。"}
  reptile.anole:
    label: anole
    summary: 一种会变色的小型美洲蜥蜴；雄性能展示显著的颜色斑纹
    info: |-
      安乐蜥是一种美洲小型敏捷的壁虎，有超过400个种类。雄性拥有彩色喉部褶皱（称为 dewlap），用于交流和吸引雌性。
      绿色安乐蜥可以根据温度与情绪在绿褐色之间变换颜色；它们速度快且灵活，并能借助粘附垫攀爬玻璃。
  reptile.axolotl:
    label: 墨西哥钝口螈
    summary: 一种终身保持蝌蚪特性的墨西哥水域两栖动物
    info: 墨西哥钝口螈是一种来自墨西哥的水生蝾螈，表现出新特征现象（即终生保留幼体性状），包括外部鳃。它是墨西哥城周围湖泊特有的物种，并因污染而面临极度濒危威胁。它具有惊人的再生能力，可以恢复四肢、部分心脏和脊髓。
  reptile.basilisk:
    label: 鬃背美洲蜥
    summary: 一种能够在短时间内于水面行走或跑步的美国蜥蜴。
    info: '{"hint":"蜥蜴，能用后腿在水面上奔跑（鬣鳞蜥）","info":"鬃背美洲蜥（耶稣基督蜥蜴）能够凭借其带沟槽的脚趾和能在水中捕捉空气的小毛发，在水面短距离奔跑。它可以在沉入之前跑过约二十米的距离。"]'
  reptile.boa_constrictor:
    label: 王蟒
    summary: 一种体型较大的南美洲以身体压迫方式捕杀食物的大蛇
    info: |-
      王蟒是一种大型南美无毒蛇。它通过缠绕猎物并在每次呼吸时加强压力来窒息其对手，从而杀死猎物。
      由于性情温顺而成为受欢迎的异国宠物。
      体长可达两到四米，并且寿命超过三十年。
  reptile.box_turtle:
    label: 盒子龟
    summary: 一种小型陆生海龟能够完全闭合在其外壳内部
    info: '{"hint":"能够完全缩入壳内的陆龟（盒甲龟）","info":"盒子龟是一种北美大陆性乌龟，它可以通过活动的前板将身体完全封闭在盔甲内。\u007c 它们生活在森林和草原中，并以独居动物的身份生活着。 \u007C 可活过一百年；野生状态下寿命可达四五十岁。在美国受到保护，在许多州禁止从自然环境中采集它们。").'
  reptile.caecilian:
    label: 蚓螈
    summary: 一种没有脚、外形似蜈蚣或者蛇形的热带两栖生物
    info: '{"hint":"无腿的热带两栖动物，类似蠕虫（蚓螈目）","info":"蚓螈是一种属于蚓螈目的无足两栖类，在研究中较少见，并且隐居于热带土壤之中。\u005Cn它看起来像一条大蚯蚓或苍白的小蛇。\u005Cn它们有小而退化的眼睛；通过嗅觉和触角状的感觉器官来定位方向。\u005Cn一些种类会直接产下活体幼崽，另一些则产出卵。")."'
  reptile.caiman:
    label: 凯门鳄
    summary: 一种分布于南美的小型鳄形目生物
    info: '{"hint":"南美洲鳄鱼类动物，体型比真正的鳄鱼小（凯门龟）","info":"眼镜凯曼是南美最广泛的爬行动物。\n它小于真正意义上的鳄鱼类；最大长度可达两米五左右。\n它们生活在从墨西哥到阿根廷的热带河流、湖泊和沼泽中。\n由于其皮革价值而被猎捕，在某些地区数量因此受到威胁。");'
  reptile.chameleon:
    label: 避役
    summary: 皮肤能变换色彩、眼睛可活动的爬行动物
    info: '{"hint":"变色树栖蜥蜴（避役科）","info":"也门角尾短吻鬣蜥改变颜色不是为了伪装，而是用于交流和调节体温。它的双眼可以独立移动。");'
  reptile.cobra:
    label: 眼镜蛇
    summary: 具有特征性头罩并能进行防御行为的一种毒性很强的眼镜蛇
    info: |-
      {"hint":"毒蛇在受到威胁时会展开领口（眼镜蛇属）","info":"眼镜蛇是属于Elapidae科的有毒蛇类，以能在头部后方展开皮肤形成兜帽作为警告而闻名。其毒素(神经毒素)会麻痹猎物神经系统。
      埃及和印度将眼镜蛇视为国家象征之一
      黑颈眼镜蛇(Naja nigricollis)，能够吐出距离超过两米远、瞄准眼睛喷射毒液的特殊能力。
  reptile.crocodile:
    label: crocodile
    summary: 一种栖息在河流和沼泽附近的古老大型爬虫
    info: '{"hint":"大型半水生爬行动物（鳄目），不是短吻鳄","info":"尼罗河鳄是世界上最大的爬行类动物之一。它生活在非洲，从水中捕猎食物，并拥有所有现存生物中最强大的咬合力。");'
  reptile.flying_dragon:
    label: 飞行鬣鳞蜥
    summary: 一种小型亚洲东南部蜥蜴能够使用其延伸出的肋条上的皮膜来进行空中滑降运动
    info: |-
      {"hint":"利用肋骨膜滑翔的蜥蜴（飞龙 Draco volans）","info":"飞行鬣鳞蜥（Draco volans），又称作会飞翔的龙，是一种来自东南亚的小型爬行动物。它通过在延长的肋上张开皮肤薄膜进行滑行，在树与树之间移动以获取领地或逃避捕食者。
      雄性具有显著明亮黄色颈部褶皱装饰。
      它们并不主动拍打翅膀来实现真正的飞行；而是依靠从高处下滑的方式前进。"}
  reptile.frilled_lizard:
    label: 领蜥
    summary: 一种在受惊扰时常会展现出夸张喉部并以双足奔逃的壁虎
    info: 领蜥是澳大利亚的一种爬行动物，当受到威胁时会张开颈部的皮肤褶皱作为警告。它像微型恐龙一样用后腿奔跑，在平静状态下颈饰折叠起来。它是北澳地区的象征性动物和广受欢迎的形象。
  reptile.frog:
    label: '"\u00e8\udc9b"'
    summary: '"绿色、有红色眼睛并能跳动的两栖生物."'
    info: |-
      {"hint":"光滑皮肤的两栖动物，会跳跃和鸣叫（无尾目）","info":"红眼树蛙是来自拉丁美洲的一种热带青蛙。它们生活在树木冠层中，在夜间活动，并通过手指间的蹼膜滑翔。

      "}
  reptile.gecko:
    label: 守宫
    summary: 一种能够沿着垂直表面攀登的小型蜥蜴
    info: 壁虎是一种受欢迎的宠物爬行动物。它能通过脚上的数百万根微观毛发在岩石和墙壁上攀爬，而不是依靠胶水。
  reptile.gharial:
    label: 印度鳄
    summary: 具有极端狭窄嘴型专门捕食鱼类的一种爬行动物
    info: '{"info":"鳄鱼科动物，拥有非常长而窄的吻部（印度鳄），适应捕鱼。雄性在喙尖有突起物(ghraa)，濒临灭绝；仅生活在北印度和尼泊尔河流中。");"'
  reptile.gila_monster:
    label: 吉拉毒蜥
    summary: 美国西南部的一种有鳞片纹理和毒性的一类粗壮型蜥蜴
    info: |-
      吉拉毒蜥（Gila monster，学名：Heloderma suspectum）是世界上少数几种有毒的爬行动物之一。它的皮肤呈珊瑚状，并带有橙黑色图案作为警告标志。
      它通过牙齿上的沟槽注入毒素，而不是像蛇那样使用中空牙。
      这种动物动作缓慢、懒散；能量消耗少且每年只进食几次。
  reptile.glass_lizard:
    label: blindworm
    summary: 一种没有脚但不是真正意义上的蛇、拥有活动眼睑的小型爬行动物
    info: '{"hint":"无腿蜥蜴，看起来像蛇（Opisurus）","info":"欧洲普通盲蛇是一种遍布整个欧州的无足蜥蜴，很容易与毒蛇混淆。\n不同于真正的蛇类的是它有可动的眼睑和耳孔；\n它们能通过断尾自卫机制来保护自己，并且尾巴可以重新长出来。\n在捷克共和国受到法律保护，在森林及田野生境中都很常见。");'
  reptile.hawksbill_turtle:
    label: 棱皮龟
    summary: 一种具有狭长嘴部特征、处于极危险境地中的海水生物——即我们所说的棱皮龟。
    info: '{"hint":"濒危的海龟，喙狭窄（学名：Eretmochelys imbricata）","info":"绿蠵龟是属于科属为Eretmochelys的一种极度濒临灭绝状态下的海洋爬行动物。历史上其甲壳曾被用作角质材料；非法贸易几乎将其赶尽杀绝。")'
  reptile.horned_lizard:
    label: 带角的鬣蜥
    summary: 一种来自北美洲荒漠地区的、具有头部长出类似鹿茸结构并呈平面形态及覆盖着棘刺的身体构造特点的地栖性两足行走类群成员
    info: '{"hint":"\"扁平多刺蜥蜴，头部有角状突起（Phrynosoma）","info":"带角的鬣蜥（Phrynosoma）是一种生活在北美西南部和墨西哥沙漠中的平坦且带有尖刺特征的小型爬行动物。当受到威胁时，它能够从眼睛中喷射血液至一米以外的距离作为防御机制；这种动物移动缓慢，并依赖伪装来保护自己免受捕食者的攻击。其生存状况因农药使用而受到影响——这些化学物质破坏了它们主要的食物来源：蚂蚁。").'
  reptile.iguana:
    label: 绿鬣蜥
    summary: 一种生活在热带美洲的大型绿色带刺背脊蜥蜴
    info: '{"hint":"大型草食性蜥蜴，有棘状冠（绿鬣蜥）","info":"绿鬣蜥是来自热带美洲的一种大体型植食性爬行动物，体长可达两米。它头顶有一个能感知光线变化的第三只眼——顶目视器。");它是群居动物；通过头部推搡和身体颜色来表现支配等级关系。";主要受到自然栖息地丧失威胁；在圈养环境下会表现出成年个体攻击性强的特点。'
  reptile.king_snake:
    label: 王蟒
    summary: 对眼镜蛇毒素免疫且能猎杀其它蛇只的美国无毒蛇
    info: '{"hint":"非毒蛇，以其他蛇类包括响尾蛇为食","info":"王蟒是一种无害的美洲蛇种，能够捕食并消化有毒的眼镜蛇等物种，并对其毒素具有免疫力。\r它的颜色（黑白条纹）模仿了珊瑚蛇的颜色模式。\r它在调节鼠、鸟和爬行动物的数量方面起着重要作用。\r由于性情温顺而成为受欢迎的家庭宠物。");'
  reptile.komodo_dragon:
    label: 科莫多龙
    summary: 世界最大活著的蜥蜴来自印度尼西亚岛屿科摩多岛
    info: 科莫多巨蜥是现存最大的爬行动物，体长可达三米以上、体重超过七十公斤。历史上人们认为它通过唾液中的细菌杀死猎物；实际上它是有毒腺的毒蛇类动物。它们捕食鹿和野猪甚至水牛。
  reptile.leatherback_turtle:
    label: leatherback
    summary: 具有皮革状背甲而非坚硬鳞片的最大海龟
    info: |-
      {"hint":"最大的海龟，拥有皮革般的外壳而不是坚硬的（棱皮龟科）","info":"巨型棱皮龟是世界上体型最大的海洋 turtles ，体长可达两米以上、体重超过七百公斤。它没有硬质骨甲壳而是由小骨头强化过的皮肤构成。
      migrates 巨大的距离穿越 ocean；记录到 migration 超过一万六千公里。
      以水母为食，并且处于极度濒危状态。"}
  reptile.lizard:
    label: 鬣蜥
    summary: 一种四足有鳞片的冷血动物，在温暖地区常见
    info: 绿鬣蜥是中美洲和南美洲的一种大型爬行动物。它们以植物为食，擅长攀岩，并且能够再生断尾。
  reptile.mamba:
    label: manba
    summary: 一种速度快、毒性高的非洲树栖眼镜蛇
    info: '{"hint":"快速且高毒性的非洲树蛇（Dendroaspis）","info":"黑曼巴是世界上最快的和最致命的蛇之一。\n它在地面上的速度可以超过每小时20公里，并能爬到树木上。\n其神经毒素如果没有抗血清，可在数小时内致死。\n"black mamba"这个名字来源于口腔内部的颜色而非身体颜色——它的体色其实是灰色或橄榄绿色。").'
  reptile.matamata:
    label: matamata
    summary: 一种长相怪异、类似落叶碎片状的美洲南部乌龟
    info: 玛塔马塔是南美东南部最奇特的淡水龟之一。它的背甲和头部完美地模仿了腐烂树叶与枝条，是一种极佳的伪装手段；它并不用牙齿捕捉猎物而是张开巨大的嘴巴吸进水及食物后闭合捕获。
  reptile.monitor_lizard:
    label: 变色龙
    summary: 一种具有分裂舌的大型主动猎杀者
    info: |-
      {"hint":"大型活跃的掠食性蜥蜴（巨蜥属）","info":"科莫多龙是世界上现存最大的爬行动物，体长超过三米。它们拥有分叉舌头作为嗅觉器官，并且表现出使用简单工具的能力；尼罗河鳄鱼种群因被其捕食而数量减少。
      "}
  reptile.mud_turtle:
    label: 泥龟
    summary: 一种小型美洲半水栖的淡水陆生物种
    info: |-
      泥龟（Kinosternon）是来自北美和中美洲的小型淡水陆生水栖动物，体长约为15厘米。当它们受到威胁时会从气味腺释放出强烈的味道进行防御。
      在干旱时期可以通过埋入泥土中并进入冬眠状态来生存下来。
      这些乌龟杂食性地以昆虫、蠕虫以及水中植物为食物。
  reptile.mudskipper:
    label: 泥滩弹涂鱼
    summary: 一种靠胸鳍行走陆上、攀登树木的空气呼吸型鱼类
    info: '{"info":"泥滩弹涂鱼是一种来自虾虎科的鱼类，它一生中大部分时间都在水外度过。\n它们用明显的胸鳍像步行一样在泥地上移动。\n通过湿润皮肤呼吸，并能攀爬红树林根部。\n它们会在板状区域保卫领地并进行显著展示。"]'
  reptile.newt:
    label: 肋螈
    summary: 一种生活在水域与陆地上兼具的小型有尾两栖动物
    info: '{"hint":"小型半水生蝾螈，具有扁平的尾巴（新龟属）","info":"大肋螈是中欧最大的肋螈之一，体长可达超过15厘米。\n在繁殖季节时雄性会展示明显的背部和类似蛇纹路斑点。\n捷克共和国境内所有种类的肋螈都受到法律保护。\n它们会在树根下或陆地上的洞穴里过冬而不是水中度过冬天。",'
  reptile.poison_dart_frog:
    label: poison dart frog
    summary: 一种生活在拉丁美州地区的颜色鲜明的小型有毒蟾蜍
    info: |-
      {"hint":"小型色彩鲜艳且剧毒的青蛙（箭毒蛙科）","info":"树栖雨林中的小体型两生类动物，属于箭毒蛙家族，在中美洲和南美洲热带森林中生活。它们明亮的颜色如红色、蓝色或黄色是警告捕食者其毒性的一种方式——称为警戒色。
      某些种类甚至被认为是世界上最致命有毒脊椎生物之一。
      当地土著居民曾利用这些毒素涂抹在他们的矛尖上进行狩猎活动；因此也被称为“毒镖蛙”。"}
  reptile.python:
    label: 蟒
    summary: 大型无毒、以绞索方式捕食猎物的眼镜蛇
    info: |-
      蟒蛇是世界上最长的蛇；网纹蟒体长达七米以上。它们通过绞杀而非毒液杀死猎物，缠绕其颈部和躯干使其窒息而亡。
       它们拥有热感应器（红外线感受器官），即使在黑暗中也能探测到温血动物的存在。
       巴拉曼森蟒是一种入侵物种，在佛罗里达州大量繁殖并威胁当地野生动物。
  reptile.rattlesnake:
    label: 响尾蛇
    summary: 一种具有警报功能、在其身体末梢长着特殊结构用来警示他人的毒性爬行动物
    info: |-
      {"hint":"毒蛇，尾巴上有响铃（角蝰属）","info":"响尾蛇是一种有毒的游蛇科成员，在其尾巴末端有独特的响环。\n这些响片由坚硬鳞片组成，并在受到威胁时发出警告声以吓退敌人或捕食者。\n它们拥有热感应器官(坑)，即使是在黑暗中也能探测到温血猎物的位置。
      被咬伤需要立即接受医疗救治处理以免造成严重后果。"}
  reptile.salamander:
    label: 大斑纹火蜥蜴
    summary: 一种具有光滑肌肤和长尾部的有毒两栖类生物（Caudata目）
    info: |-
      {"info":"大斑纹火蜥蜴是一种受到保护的中欧两栖动物，身上有黄黑相间的条纹。它会从皮肤分泌毒液，并且生活在潮湿森林里。
      ","label":"大斑纹火蜥蜴
      ","summary":"一种具有光滑肌肤和长尾巴的有毒两栖类生物"}
  reptile.sea_snake:
    label: 海洋蛇
    summary: 适应海水生活、带有鳍形尾部结构的一种有毒爬行动物
    info: '{"info":"海洋蛇是海蛇科中一种完全适应了海洋生活的毒蛇。\n它们有扁平的桨状尾巴用于游泳，其神经毒素比眼镜蛇强数倍；但这些蛇非常温顺。\n它们用肺呼吸空气，并且需要定期浮上海面换气。");'
  reptile.skink:
    label: stone dragon
    summary: 一种具有平滑闪亮鳞片和短腿的小型爬行动物
    info: |-
      石龙子是一类拥有超过1500个物种的蜥蜴科，它们以光滑且有光泽鳞片为特征。有些种类四肢退化或完全无肢。
      澳大利亚蓝舌石龙子会伸出明显的蓝色舌头作为对捕食者的警告信号。
  reptile.snake:
    label: snake
    summary: 一种体形修长大而灵活、不具足部和鳞片覆盖的身体结构特征明显的冷血脊椎类生物
    info: '{"hint":"无腿的细长爬行动物（蛇亚目），不是蠕虫","info":"蛇是身体延长且没有四肢的两栖动物。目前已知有超过3700种；它们通过嗅觉捕猎（雅各布森器官）并且其中一些是有毒性的。");'
  reptile.snapping_turtle:
    label: 咬人鳄鱼龟
    summary: 一种体形大而好斗的大西洋沿岸地区的淡水乌龟
    info: '{"hint":"大型具有攻击性的淡水龟（Trachemys scripta elegans）","info":"红耳滑稽龟是一种体型较大的北美淡水海归，拥有强壮的钩状喙。\n在陆地上它表现出较强的侵略性；而在水中则较为温和。\n它可以重达超过35公斤，并且寿命可超40年。\n它是杂食动物：捕猎鱼类、水鸟以及也会吃腐肉。");'
  reptile.thorny_devil:
    label: 刺尾龙
    summary: 覆盖有棘的澳洲蜥蜴能通过毛细管吸水
    info: 刺尾龙是澳大利亚一种身上长满尖锐棘的小型蜥蜴。它拥有令人着迷的能力，可以通过棘之间的毛细血管吸收水分，并直接将水输送到口中；它们只以小型蚂蚁为食，在一次觅食能吃掉多达两千五百个蚂蚁；为了防御天敌，它的背部还有一颗假头。
  reptile.toad:
    label: 火蜥蜴
    summary: 一种与蛙类似但在陆地上生活的带有疣状特征的两栖物种。
    info: '{"hint":"陆生有疣的两栖动物（蟾蜍科），皮肤比青蛙干燥","info":"普通火蜥蜴是捷克共和国最常见的蛙类。\u005Cn它的疙瘩不会叮咬苍蝇；这些是用来防御和分泌毒液的地方。每年它都会成群结队地迁徙到水体中繁殖，在捷克斯洛伐克，志愿者会帮助它们穿越公路。\u005Cn以蜗牛、蚯蚓及昆虫为食，并且能自然控制花园害虫。":["label": "火蜥蜴", "summary": "一种与蛙类似但生活在陆上的带疣状突起的两栖生物"]'
  reptile.tortoise:
    label: 陆生海龟
    summary: 缓慢的栖息于大陆上的爬行动物具有圆顶状外壳（科名：Testudinidae）
    info: '{"info":"加拉帕戈斯象龟是世界上最大的陆地乌龟，生活在加拉帕戈斯群岛，并且寿命可超过150年。它的甲壳实际上是骨骼的一部分。'
  reptile.tree_frog:
    label: rainfrog
    summary: 一种具有爪尖吸附力、能在树叶上行走的小型森林蟾蜍
    info: '{"hint":"色彩鲜艳的树栖青蛙，脚趾上有粘性垫（雨蛙科）","info":"绿雨蛙是一种小型树木上的青蛙属于雨蛙科，在手指末端有吸盘可以攀爬光滑表面。\n在捷克有一种原生种普通雨蛙；受法律保护。\n它会根据温度和湿度改变颜色从绿色到灰色或棕色。\n主要会在夜间及下雨前发出响亮短促的声音。").'
  reptile.tuatara:
    label: 喙头蜥
    summary: 来自新西兰的新西兰活化石生物，Rhynchocephalia 目唯一幸存者
    info: 喙头蜥是世界上最古老的爬行动物之一，其目在恐龙时代就已存在。它只生活在新西兰的岛屿上，并且生长极其缓慢；性成熟需要长达十年到二十年的时间才能完成。最年长个体可超过一百岁，在幼崽中第三眼具有功能。
  reptile.uromastyx:
    label: 尖尾蜥
    summary: 一种拥有带棘尾巴的非洲及近东地区的沙地蜥蜴
    info: 尖尾蜥蜴（Uromastyx）是一种来自北非、中东和印度的沙漠鬣鳞，以其用于防御的独特刺状尾巴而闻名。它们是严格的草食动物；以种子、青草和树叶为生。在爬虫馆中被作为异国宠物饲养，并被认为可以活超过二十年。
  reptile.viper:
    label: snake
    summary: 带有一个三脚形状脑袋并拥有缠绕体态的一种有害生物。
    info: |-
      {"hint":"毒蛇，具有三角形头部和血液毒素（蝰科）","info":"普通响尾蛇是唯一一种在捷克自然分布的有毒蛇类。\u005c
      它可以通过背部蜿蜒图案以及类似针尖状的大牙识别出来。\u005c
      被咬伤会很疼痛，并需要医疗观察；但对于健康的成年人来说几乎不会致命。\u005c
      该物种受到法律保护，在捷克不得捕捉或杀害这种动物。","label":"snake","summary":"带有三角头及盘绕身体的一只毒性爬行动物。"
  reptile.wall_lizard:
    label: 墙蜥
    summary: 一种生活在围墙与岩坡上的瘦长快速型蜥蜴
    info: |-
      壁蜥是一种小型爬行动物，原产于南欧和西北非。在捷克共和国的温暖岩石表面及墙壁上可见其分布，并且它被引入当地生态系统中生存。
      这种动物非常敏捷，在遇到危险时会主动断尾逃生以求自保
      由于近年来气候变暖的影响，它的活动范围正在向北扩展。
  reptile.worm_lizard:
    label: 蚯蚓蜥
    summary: 类似蚯蚓的地栖性无脚爬行生物
    info: |-
      蚯蚓蜥蜴是生活在热带非洲和美洲的阿米菲蛇类群中少被研究的小型无足爬行动物。它们看起来像大蠕虫，皮肤呈分节状，并有退化的复眼。
      一生都在地下生活并以蚂蚁与白蚁为食。
      通过一种独特的风箱式运动方式移动。
