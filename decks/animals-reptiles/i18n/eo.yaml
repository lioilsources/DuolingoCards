pivot: false
title: Plazoformaj kaj amfibioj
cards:
  reptile.agama:
    label: agama
    summary: Vivanta barema roko-reptilo en Azio/Afrikao; samulo havas kontrastan plumigon.
    info: Agamoj estas granda familio de reptoĵoj el Afroazio kaj Aŭstralio kun super 300 specioj. Samuloj ĉe la genro Agama havas klare videblan ruĝoran ŝildon sur kapo kaj bluan korpon por montri dominadon dum termoregulado. Ili aktive prilaborigadas iliajn kolorojn al temperaturo - en malvarme ili fariĝas mallumaj kaj varmume lumplene. Kelkaj specioj ekzemple Draco povas glui per etendo ribozono.
  reptile.alligator:
    label: alligator
    summary: Grandeco krokodelekto kun ronda naseto loĝanta Usonoj kaj En Chino.
    info: American alligators estas unu el la du vivantaj specioj de alligatores; la dua pli malgranda chinesa alligatoretro. Eblas distingii ilin per pordis mallarĝa rondeta nazo kaj fakte ke en fermito buko oni ne povas rigardi dentojn.
  reptile.anaconda:
    label: anacond
    summary: Pleja pesanta serpente en mundo kiuj lovas en amazonaj mardrogo.
    info: "La Green Anaconda estas la plej peza serpento en mondo; femalo atingas perton pli granda ol 90 kilogramoj kaj longeco inter kvin ĝis ses metroj. \nĜi vivas en marĉo kaj riveroj de Tropika Sudameriko. \nEstas semiaŭtoktona kaj manĝadas fiŝon, birdojn, kapibarojn eĉ kaĵanojn."
  reptile.anole:
    label: anoles
    summary: Verdeŝanĝanta amrika reptilo; masklulo montras granda gulteto.
    info: Anolisoj estas genro de malgrandaj kaj rapidaj reptoformoj el la Aмерiko kun pli ol 400 specioj. Maskloj havas bagreman gulton por signalado al najbaro kaj atirante femalojn per ĝia movigo. Verda anolo povas ŝanĝi sian koloron inter verdo kaj bruno depende pri temperaturo kaj emocio.
  reptile.axolotl:
    label: akvaro
    summary: Akva salemandro de Meksiko kun permane entute larvoformaj trajtoj.
    info: La Axolotle estas akua salemandro el Meksiko montranta neotezmon, do ĝi tenas la larvan videblon dum tutan vivon inkluzive eksteraj branĥioj.
  reptile.basilisk:
    label: basilio
    summary: Panama saurio kapabla bremsbana kuradi super surfaco da akvo.
    info: La Bazilisko ornata (Kristas bazilisko) povoras per ĝiaj falangoj kun kanaloj kaj tremoloj kiuj kaptegas la subakvon por forigi sin de akvo sur tiun manieron dum pli ol dudek metroj antaŭ imerĝado. Virino havas distingan spicon en sia kapo kaj dorso; kamuflo estas ties plej grava defenda tekniko inter arboj.
  reptile.boa_constrictor:
    label: reĝinserpent
    summary: Granda sud-amereka serpentanta rektangulo kiun oni strangulante la prizorgon.
    info: Reĝinserpento estas granda senvenena sudamericana serponto kiu mortigas siajn predojn per enpresado de ilia korpo dum spiradrestokontakto por malpermesigi plenan spiron. Ĝi attingas longecon inter du kaj kvar metroj kaj vivadas super tridekjaro pro siama mildemo.
  reptile.box_turtle:
    label: Box Turtle
    summary: Peta tera tortuo povanta fermi sin internen komplete.
    info: La Box Turtle estas nord-americana tera turtlo kapabla plenigita ferma sian skelon per moviĝema antera planketo. Ĝi loĝas en arbaroj kaj herbejoj sola. Kapable atingi daŭrigi vivon super cent jarojn; ekzistas inter 40 al 50 jardoj de vivo la naturo. Protektis en Usonoj kaj multaj ŝtatoj forbadas iliajn kolektado el naskio.
  reptile.caecilian:
    label: ĉerborovo
    summary: Senmara tropeama amfibio similanta vermion.
    info: La ĉerborovo estas nesekigita amfibio el la grupo de la gimnofonioj, malfacile esplorate kaj vivanta kaŝe en varmeglatenca tereno. Eksteras simila al granda vermo aŭ blankflanka serpento kun mallongigitaj okuloj. Gvidatas per olfako kaj tenkapuletoj sur kapo.
  reptile.caiman:
    label: brillantokajmo
    summary: Sudamericana ripo formo malplena ol reela krokodilo.
    info: Brillantokajmo estas la pleje mallarĝa krokodilformo en Suda Aмерiko. Ĝi plenkreskas nur ĝis longeco de maksimume duonmetro kvindek centimetroj. Vivadas tropeke riveroj, lakegoj kaj marĉaro inter Meksiko kaj Argentina.
  reptile.chameleon:
    label: Kemiaelo
    summary: Reptilo kun kapabla ŝangi skin-kolorecon per movadaj okulo.
    info: La chameleo de Jemen ŝanĝas naskolorojn por interkomuniki kaj reguli temperaturon; ĉar ili vivas en arboj, iliajn okulojn oni povas movigi sendepende unu de la alio.
  reptile.cobra:
    label: cobra
    summary: Venena serpenton kun karakteriza 'kapuko'; venemminacaĵo.
    info: La kobra estas venenema serpento el la familio de Elapidaj konata per sia abileco etendi ĝian pordon sub la kapo en formo da mantelo por minacadoj. La veneno (nervetoksino) paralizigas la nervacan sistemon de pridomo. Kobra kun okuloj sur ŝildoj estas landmarksimbolo de Egipto kaj Hindio.
  reptile.crocodile:
    label: crocodile
    summary: Grandega malnovtempa herbo estanta apud riveroj kaj marĉegoj.
    info: Nilokrokodilo estas unu el la plej grandaj herbeoj de nia planedo kiu loĝas en Afriko kaj ĉasnigas proksime al akvo. Ĝi havas tiun fortikan mordadon inter vivantaro.
  reptile.flying_dragon:
    label: volanta drako
    summary: Mallonge aziana reptilo kiun oni povigis flugadi uzante sian pektumon.
    info: Flying dragon (Draco volant) estas mallonga repto el Sudorienta Azio kapabla flugi per ĉarno membro etendita sur longigitaj lateroj.Ĝi vojas inter arbotoj por akiri territorion aŭ ekaperi de manĝemuloj.Malestro havas distingan flavan pordon en la nuko.Gxi ne spolas aktive kun siajn membranoj sed nur slidadas.
  reptile.frilled_lizard:
    label: Agamo kun mantello
    summary: Reptilanta besto elpuŝantas dramaturgan mantelon kaj kurante per unuj nigradoj.
    info: La Agamalimaco estas aŭstralia reptilio kies limako (pelo ĉirkaŭ la horloĝo) malfermiĝas dum danĝero kiel varavarmilo. Ŝi iradas sur du piedoj simile al mikra drakodino. En ripozo ties limako restadis malfondita.
  reptile.frog:
    label: ranego
    summary: Verda saltanta ranego kun ruĝaj okulbalojn.
    info: La Listameno rufa okulo estas troka amfibio el Suda Aмерiko kiu vivas en arbaraj foliejoj, flugas per membrano inter siaj fingroj kaj agadas nokte.
  reptile.gecko:
    label: Gecko
    summary: Petro-kaptanta reptilo kapabla ruliĝadi per vertikalaj surfacoj.
    info: La gepardogecko estas populara en terrarioroj kaj havas miliardojn da malgrandaj harpetoj sur siaj piedetoj por teni ĝin al rokoj kaj murpiedoj.
  reptile.gharial:
    label: gavigalo
    summary: Reptilo simila al krakodo per granda specifa adapto en formiĝinta nazo.
    info: La gavigalo estas repto el Indio kun tre mallonga kaj larĝa nazo adaptita por pescado de fiŝoj. La maskulo havas eksterordinaratan strukturon nomitan 'ghra' ĉe la fino de sia naso.
  reptile.gila_monster:
    label: gila helodermo
    summary: Venena grasa reptilio el Suda Okcidento Usono kun marmorpeleto.
    info: La Helodermo de Gila havas perlajnan peleton kun orangecaj signoj por averti pri damaĝo. Ĝia veneno estas enkondukiita per kanaloj sur dentiloj anstataŭe ol malfermaj bukoj kiuj uzatas fare de serpentoj.
  reptile.glass_lizard:
    label: blindserponto
    summary: Leglesa reptilio ne estanteca serpente sed havinta movemblan okulpaŝtebon.
    info: Blinda serpento estas leglesa kajgano vivanta en tuta Eŭropo kiu facile konfuziĝas kun serpentoj. Kontraste al serpentoj, tiel havante moveblo paŝtebon kaj orelintrapason. Kapabla forĵeti la veston por defendi sin (memforperdo), kiun repostulas.
  reptile.hawksbill_turtle:
    label: praw-karetko
    summary: Critik'e dange ra ma rkap ibar o kun st reĉa pavo.
    info: La praw-karetko estas kritike danĝera mara kapibara el la genro Eretmohelifto. Ĝia ŝelo estis historia fonto de testudo; ilegalaj komerco preskaŭ elmortigis ĉi tiun specion. Ĉeĥas esceptive fungojn kaj marnan vivon en karbonato-rokojn.
  reptile.horned_lizard:
    label: jeŝerko rōtā
    summary: Plana spintruo ſerpento kun horoj sur kapo el nort-americaj dezertoj.
    info: La Rohata Ješerkato havas formon de Phrynosa kaj vivas en la dezertoj de nordokcidenta Ameriko kaj Meksikano. Ĝin protektas per kamuflado kontraŭ predigiloj sed estas malfacile movema. Kiam minacas al si mem, ĝi povas elĵeti sangon for ekde unu metro distanco por defendi sin.
  reptile.iguana:
    label: verd-legano
    summary: Granda verdkolora reptilo el Tropiko-Ameriko kun spintra krono.
    info: Verda legano estas granda herbofago de Tropika Aŭstralio kiu povas atingi ĝis du metroj da longeco.Ĝi havas trian okulon sur la frunto reagantan al lumŝanĝoj.Grande socia animalo montras dominadon per kapopremado kaj ŝangojn en korpo-koloro.Estas minacata plejparte pere disperdo de ties nativa hejmpovo;
  reptile.king_snake:
    label: reĝa serponto
    summary: Netoksan uzunan serpentidon, kiuj estas immunaj kontraŭ la venom de virgato.
    info: La reĝa serpento estas netoksa usona serpentido kapabla manĝi aliajn toksajn serpentojn inkluzive de virgatoj kaj malpermesas ilian venenon efiki lin. Ĝia striko-kolorigo similigas tiun el la koralo-serpento. Ĉeĥio regulas nombrojn da musoj, birdoj kaj reptilioj.
  reptile.komodo_dragon:
    label: Komo-drako
    summary: Plej grando vivanta repto el insuleto de Komedo.
    info: La Komo-drago estas la plej granda ekzistanta reptilio atingante longecon pli ol tri metrojn kaj pezon super cent sepdek kilogramojn. Historie oni pensis ke ĝi mortigas per baktario en sulo; fakte havas venenan glandon. Ĝi prenas cervidojn, porkojn eĉ buflojn.
  reptile.leatherback_turtle:
    label: leviatano
    summary: Plej grava marbestio kun elasta ŝelo anstataŭ dura tabulo.
    info: Leviatan korisama estas la plej granda marbato en mondo atinganta longon pli ol du metrojn kaj pezon super cent sepdek kilogramojn. Ĝi havas glatecan pelsan ŝelon anstataŭ rigida ostosperita skvalto. Migras gigantaj distancoj tra oceanoj; registrado de vojaĝado trans sesdekmil kilometroj ekzistas.
  reptile.lizard:
    label: varangxo
    summary: Kvadrunkapa skalpita herbofago vivanta en varmaj landoj.
    info: La Viridia Iguano estas granda varanĝo el Centra kaj Suda Aмерiko kiuj manĝas plantojn; ĝi tre bonvolas montrosurmonte kaj povas rekreigi perdonitan parton de la vosto.
  reptile.mamba:
    label: mambo
    summary: Plenkorpigita afrika arbserpento kun tre potencega nervosenigaĵa veneno.
    info: La nigra mambo estas unu el la plej rapidaj kaj plej venenemaj serpenoj en mondo. Ĝi atingas rapidecon pli grandan ol 20 km/h sur tereno kaj kapablas grimpi al arboj. Lia neuroparalizanta veneno sen kontraŭkorpoj povus mortigi homon jam dum kelkaj horoj.
  reptile.matamata:
    label: matamato
    summary: Neordinare videbla sudamerika ŝelo similanta al arbofolia detritum.
    info: La matamato estas unu el la pleje bizara dulakova ŝelo de Sudokcidento en Suda Aмерiko. Ĝia skvalo kaj kapo perfekte imitas korumpitan folion kaj branĉeton, tio estas ekzempla kaŝiĝado. Ĝi ne prenas manĝon per dentojn; anstataŭe malfermas grandan bukon por trinki akvon kun pridomo kaj fermas ĉian.
  reptile.monitor_lizard:
    label: dragonto
    summary: Granda aktiva predaĵreptilo per divida lingvo.
    info: La varano estas granda reptilio el la genro Varanus kun dividita lingvo funkciantanta kiel olfakorgano. La komoda dragonto estas plej grando vivanteco reptilmonstro en mondo (longecole pli bonegol ol tri metro). Dragontoj havas intelekton; sciencistoj notis uzadon de simplaj iloj.
  reptile.mud_turtle:
    label: mudta tortuo
    summary: Peta nord-americana akua-tera tortujo.
    info: Mudtortoj de Kinosternon estas kiraŭ ĉirkaŭ 15 centimetrojn granda specio el Nordameriko kaj Centrameriko. Kiam minacataj, ili emitas fortan odoron per sagozonoj. Ili povas atendadi sekkecon enkrustiĝante al fango kaj dormanta dumhibernaĵe.
  reptile.mudskipper:
    label: amfibia perioptalmuso
    summary: Gobiaso kiun povas iri super solidaj surfacoj kaj montriĝi kun specifaj finhoj.
    info: Amfibie perioftalmuso estas gobiaso kiu pasigas grandan parton de ĝia vivo forigu la akvon.Ĝi moviĝas sur malvarmaj plankoj uzante sian elstarantajn pectoralaj nelojn simile al piedpastroj.Dum ne regatas humidan epidermon por spirado kaj kapablas grimpi inter ripozoj de mangrove arboj.Kaptis en sia propra regiono faras ekspoziciaĵoj.
  reptile.newt:
    label: heredo
    summary: Peta akvo-klimata amfibio vivanta en akuakaj kaj terrestriaj medio.
    info: La granda Triton estas la plej grava mezo-eŭropa heredo kiu atingas longeco pli ol 15 centimetrojn. Dum reproduktado viro montras distingeblan dorsoplanĉo kaj makulojn similante serpentojn. EnĈekio ĉiaj specioj de heredio protekteblas per tutoleĝoj.
  reptile.poison_dart_frog:
    label: Prilesnika
    summary: Tropika amerkana malgrandegrandeco brilhav-kolora toksiga salamandro.
    info: La pralesniko estas malgranda salamandra el la grupo de dendrobatoj vivanta en tropike arboresko kaj centraj kaj suda ameriko. Ĝiajn klare videblan roĝon, bluan kaj flavecon uzatas por montri nigran venenoceston (aposomatismo), kio signifas ke temas pri tre danĝera besto; kelkaj species eĉ estis nomitaj inter plej potence venenebestoj sur Tero.
  reptile.python:
    label: boojno
    summary: Granda neĵova serpentego, kiu strangulas siajn viktimojn.
    info: Boojno estas la plej longa serpento en mondo; boojnon ruzokostan atingas plenumpekon ol sep metrojn. Ĝi mortigas sian prizonulon per strangulado anstataŭ veneno; tordas ĝin proksime al nuko kaj korpo. Ili havas varmajn receptorilojn (varmaptikoj), kiuj ebligas trovi varmekrvitan prezan dum mallumo.
  reptile.rattlesnake:
    label: rattlesnako
    summary: Venenema serpento uzanta sonoran signalon survango por alerta.
    info: Rattlesnake estas venenema serpento el la grupo de kobravidoj kun karakteriza sonorilo ĉe la pinto de sia vango. La sonorilo formita per kerigitaj ringoj servas kiel averto dum minaco.Ĝi havas termikajn rektorojn por trovi varmajn predojn eĉ en malvarmecon.
  reptile.salamander:
    label: molok
    summary: Amfibio kun glateca epidermo kaj mallonga vosteto.
    info: La Mloko Skvernita estas protektata eŭropa amfibio kun flanke ruĝaj makuloj. Ĝi eldonas venenon per la poko kaj loĝas en humidaĵplena arbaro.
  reptile.sea_snake:
    label: marhad
    summary: Venema serpentido adaptitaj al mari kun plankeca coka.
    info: Marhundo estas venena repto el la familio de hidrofinoj tute adaptita al mara vivo. Ĝi havas planktonan paletocason por nado. ĝia venom estas nervotoksa kaj multekartpe forta ol serpenoj; sed tiuj serpentidoj tre mirindis.
  reptile.skink:
    label: skink
    summary: Reptilo kun glataj brilantaj ŝvelel ĉefe kaj mallongaj gamboj.
    info: Skinks estas grandega familio de reptiloj kun pli ol 1 500 specioj kaj havas glatajn cikloiddan ŝvelojn. Kelkaj el ili perdis siajn gambojn tute aŭ partale pro adaptado al la tero. La azura-lingva skinkaŭstrala montras eksterordinare bluan lingvon por minacigi ties malamikon.
  reptile.snake:
    label: serpento
    summary: Senmanĝa skvaloka ĉevalo kun mallonga fleksema trupo.
    info: Serpentoj estas kruuroplazo kun longaj korpotrunko sen membroj. Ekzistas pli ol 3 700 speciojn; ili pafas per odorilo (organo de Jacobson) kaj kelkaj el ili havas venenon.
  reptile.snapping_turtle:
    label: kaposerpento
    summary: Grandagresiva sudokvarlanda usona torto per fortoj denta.
    info: La kaposerpentema tortoj estas grandaj agresivaj nordamerykanaj dolorklavakvo-tortoj kun fortika harapta buko. Ĝi estos plenkruda sur tereno sed malpli agresa en akuaĵo. Tio povas pezi super 35 kilogramojn kaj vivi dum preskaŭ kvindek jarojn.
  reptile.thorny_devil:
    label: moloko spinoso
    summary: Reptiliaĵo de Aŭstralio kun spineca korpo adsorbanta aku pere di kapilo.
    info: La Molocha spinosa estas malluma aŭstralia reptilio revoltita per mileroj da akraj spinoj. Ĝi havas intrigantan abiliton alvoki hidron tra la skapo uzante kapilarajn kanalojn inter la spineco por direkti ĝin rekte en muelojn. Ĉeĥa ekzkluze pri mikromalgrandaj formikidoj – konsumadas eĉ du el kvin centimoj dum unun tagmezo.
  reptile.toad:
    label: Bufo
    summary: Terrestri branĉa amfibio rilata kun ŝneko.
    info: La Bufo bufo estas la plej disvastigitita ropuĥo enĈekio. La bradojn de tiuj anurbasoj uzatas por protekti sin kontraŭ predikontoj kaj produktadas venenaĵojn. Ili migracias jare al akvoretoj per grandegrandaj grupoj dum reprodukcio; volontuloj helpas ilin transpasi stratojn.
  reptile.tortoise:
    label: tertuко
    summary: Malrapido repto kun arkatita korpo vivanta sub sekcaĵoj.
    info: La slona tuco estas la plej granda terrestriajna tuko en mondo; ĝi loĝas sur insuloj de Galapago kaj povas atingi pli ol cent kvindek jarojn. La skvalo formas parton el ties osara strukturo.
  reptile.tree_frog:
    label: arboro-havo
    summary: Arbaro-havo kun adhezia padetoj serkiĝantaj folion.
    info: Verda arboro-havo estas granda rosnico el la grupo Hyloj kiun havas suĉpadojn sur fingroj por klimbado per glataj surfacoj. EnĈeko vivas unu originala specio - verda arborohava, kiu protektita fare de juro. Ŝanĝigas siajn koloreco inter verdaj al grizaj aŭ brune en dependeco pri temperaturo kaj humideco.
  reptile.tuatara:
    label: Tuatara
    summary: Nova zeelandana 'viva fosilio', sola superviviinto el sia ordo.
    info: La tuataro estas unu el la plej malnovaj reptoiloj de nia planedo; ties ordo ekzistis en epoko kiam vivis dinosaŭroj. Ĝi loĝas nur sur insuloj de Nova Zeelando. Tuataropoj grandegas tre malmolle; ili atingas seksematuron interdekimo al dudekimo da jarojn post naskiĝo.
  reptile.uromastyx:
    label: uro-mastikso
    summary: Deserta reptilo per spina cauda de Aferiko kaj Proksimum Oriento.
    info: La uromastyxo estas dezertajtalo el norda Afro, la proksima oriento kaj Indo kun karakteriza spinema pugo uzata por defendo. Ĝi mangas nur vegetalegeksemplerojn kiel fruktojnojn, herbojn kaj foliojn. En terrarioj oni havigas ĝin kiel ekzotican hejmpetsimion.
  reptile.viper:
    label: bituro
    summary: Venena bitura besto per triangula kapo kaj spirale formata korpo.
    info: Bituro kroĉas estas la unika venenema serpento nature trovita enĈekio. Ŝi havas zigzag-motifon sur dorsflanko kun du grandaj dentoj similantaj al piko de akvo. La mordado dolorigas kaj postulas medicinan atenton sed preskaŭ neniam mortigos sanan plenkreskinton.
  reptile.wall_lizard:
    label: muraleto
    summary: Malgrandega rapidulo vivanta inter muroj kaj montarumado.
    info: La Podarcis muralis estas malgranda lageto originanta el suda Eŭropo kaj nordokcidenta Afroko. En la lando troviĝas sur varmegraditaj rokjordaĵoj pro eksterlanda enkonduko.
  reptile.worm_lizard:
    label: ĉervo
    summary: Senpiedo subterana repto simila al ĉermo vivanta sub tereno.
    info: Ĉerboj estas malplene esplorataj senpiedaj reptoformoj el la grupo Amphisbaenia vivantaj en Tropika Afriko kaj Aмерiko. Ili similas grandajn vermojn per sia sekmentigita epidermo kaj reduktitaj okuloj. Vivante sub tero dum tuta vivo ili manĝas formikojn kaj termitojn moviĝante kun karakteriza akordiona ago.
