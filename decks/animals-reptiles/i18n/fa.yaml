title: ماهی‌ها و دوزندها
cards:
  reptile.agama:
    label: اگاما
    summary: مارمولک پرتونافع اروپا؛ نمرساز مناسب
    info: |-
      اگامایان جنسی از مارمولک‌های آفریقا، خاورمیانه و استرالیاست که بیشتر از سومصد نژاد دارد
      نرها در برخی انواع به عنوان علامت قدرت هدفدار شده رأس زرد روشن و بدنهٔ آبی دارند
      برای تنظیم حرارت فعال با تغییر رنگ واکنش نشان میدهد؛ وقتی سرمای وجود داشته باشد تیره‌تر و وقتی گرماست روشن‌تر میباشد
  reptile.alligator:
    label: آلیگاتور
    summary: جاندار حشرخوار بزرگ با قسمت بالشت بلند و گرد، طبعًا در نقاط مختلف شمال غربی آمریکا و مرتفعات لوسیانا.
    info: آلیگاتور آمریکایی، یکی از دو گونه زندهٔ موجود در جنس «آلیگاتور» است؛ همراهش کوچکتر و منقرض شدۀ چینی محسوب می‌شود. تفاوت عمده بین آلیگاتورها با سانسالوها وجود فرم پهن و گردتر صفت به علاوه عدم نمایاندن تمام دندان‌ها وقتی خرطوم را ببسته می‌زنند است.
  reptile.anaconda:
    label: آنكواندى
    summary: سنگينترين مار جهان كه در مرديبه ياموزيك وجود دارد.
    info: اناكوندا سبزی سنگین‌ترین مار جهان است؛ اناث این پستاندار تا وزن بیش از نود کیلو و طول پنج الی شش متر رشد می‌کند. در مردابها و رودخانه های مناطق حوضة آبرو به خوبى زندگى مى كند، دوماهى است و غذاى فرآورده مثل ماهى، پرنده، капيبارا و كلانت رو بايد كرد.
  reptile.anole:
    label: anole
    summary: مارمولک کوچک آمریکایی؛ پسرمروارید دارد.
    info: |-
      انولیس جنس کوچکی از مارمولک‌های آمریکا است با بیش از ۴۰٠ نژاد مختلف
      نرها دارای تاج رنگی روی سینه هستند، به منظور برقراری ارتباط و جذب انوثا
      مارمولک زرد در حالت عفونت قابل تحمل حرارت بالاتر از حد طبیعی خود شده و قادر به تغییر رنگ از سبز به قهوه‌ای تحت تعاملات موثر فشار هوائی و غضب
  reptile.axolotl:
    label: اکسولوتل
    summary: تخمین زنگی مکزیکی است کہ طوال عمرش صفات لاروا را حفظ میکند.
    info: اکسولوتل، تخمین زنگی آبی است که در مکزیک وجود دارد و ناتوان از جلوگیری پوست لاروا خود راه انداخته شده است؛ به عبارت دیگر، تمام عمرش با حفظ صفات بچہ‌ای مثل فلس همراه است. فقط منطقۀ ساحلی شهر ماخیدرو بر روی نقشه قرار داشته و تحت تهدید آلودگی قرار دارد. قادر به تحمل بالاست و میتواند اندامها، قسمتی از قلب و ستون فقری خود را بازنوسازی کرد.
  reptile.basilisk:
    label: Bazilisk
    summary: سرمازمینچهٔ آمریکائی متخصص در ردپذیری مواد سطحی.
    info: بازیلیسک زین‌درازه شده قادر به دویدن روی سطح آب است که اثر جالب توجهش مانند خود عیسو و حضرت عیسی هست، با انگشتان راهبرداری نمایندهٔ هواساختار در پاها برای فشردن بقای الهام‌بخش وجود دارد؛ این موجودات میتوانند قبل از غرق شدن حداقل۲۰ متر روی آب حرکت کرده و بعد از مردانه‌روزخوری بالغ بر لباس قرمزرنگ بلند کمرشان رفته، مناسب طول عمرشون توخته بشمارند.
  reptile.boa_constrictor:
    label: بوزاق ملكي
    summary: زمين‌خور بيسيسماني كليدي جنوبي كوچك
    info: |-
      بُزاق ملکی، زمین‌خور جنوب آمریکایی بزرگ و بدون سم است که قربانی را با پوشش دادن به بدنش و فشار اعمال شده در هر نفس خروجی توسط عضلات ضعیف نسال می‌کند
      در اثر طبع سالم و ثابت، حیوانات خارق العاده معروف برای بالغ شدن وجود دارد
      طول او حدود ۲ الی چهارت متر است و عمر بلندی داشته که ٣٠ سال ادامه می‌پذیرد
  reptile.box_turtle:
    label: گوزن جعبه‌ای
    summary: سوسک خردی که قادر به تعويض تمامي بدنش درون قاب.
    info: "گوزن جعبه‌ای، سوسک خشکی شمال آمریка است که می تواند به طور کامل پوست بدن را با صفحات اصلی حرکت دهد و در داخل قاب زندگی کرده. \nدر مناطق جنگلی و مرتعی به عنوان موجود واحد زندگی می کند. \nمیتواند بالغ بر ۱٠٠ سال عمر کند؛ در محیط های طبیعی سنین چهل الی پنجاه سال رسیده."
  reptile.caecilian:
    label: چروروونس
    summary: جاندار بدون پا شبیه به مواد غذائی در محیط‌های معتبّل.
    info: چروروونس، موجودی بدون پا از جنس کم‌پژمره است و در مناطق معتدل زندگی مخفیانهٔ خود را دارد. به نظر همانند یک قارچ سفید بزرگ یا عقرب فرسته می‌آورد. آنها چشمهای کاه شده با توجه به حواس بالاتر مثل بویایی و لامسه بر روی سرشان وجود دارد.
  reptile.caiman:
    label: كايمان
    summary: يكي ديگر از موجودات مشابه كوكاليلار در جنوبي آمريكو كوچكتري از يك كوكاليل يا الياژور.
    info: کایمن لینچ ها در جنوب آمریکاست که پراستر شده است، از ساندروها بزرگتر نمی‌شود و طول تقریبی دو متر و نیم را به خواهد رسید؛ زندگی او در مناطق حوضه روزنه با فعالیت بالا شامل رودخانه ها، لاک قطبی و مراعات است. صيد كرمك برای عرضه مواد غذائي ضعيف است.
  reptile.chameleon:
    label: خرس‌پشت
    summary: راکودار با زردوزد متغیر و چشم‌ها قابل حرکت.
    info: '{"hint":"سگنالده کردن راکوداران تغییر دهنده رنگ درخت، خانواده Chamaleonidae","info":"خرس‌پشت جمنسک برش نمیدهد برای پنهان شدن بلکه برای انتقال و تنظیم حرارت استفاده میشود. چشم های او به طور مستقل حرکت میکند.","label":"خرس‌پشت","summary":"راکودار با زردوزد متغیر و چشم‌ها قابل حرکت."}'
  reptile.cobra:
    label: cobra
    summary: خزن سم‌دار؛ وضعیت هشداردهنده.
    info: کبرا جانوری سم‌دار از خانواده الپیدا است که به دلیل توانایی باز شدن پوست در قسمت سر و تشکیل لاله معروف است، همچنین سم آن شامل نوروتوکسین می‌شود که بر روی سیستم عصبی فقرات عمل می‌نماید. کبّرا بُروئِلو نقش حامی رمز ملی مصر و هند است.
  reptile.crocodile:
    label: crocodile
    summary: پرتوتال حفاظت کننده با توجه به مناطق مردابها.
    info: کрокودیل نایلون از بزرگ‌ترین پستانداران جهان است و در آفریقا زندگی می‌کنید، همچنین شکار خوبی را به عنوان غذش دارد.
  reptile.flying_dragon:
    label: درام لاتاجي
    summary: جوجهٔ حيوانات كوچك آسيا كه قابليت راه اندازي بدون هواپيمائي را دارد.
    info: دراک پروازی به دلیل وجود غشای جلدی که روی استخوان‌رباط فشرده شده، میتواند بین درختها با حرکت بال بلندتر از خود عبور کردن و تغذیه بر سطح زمین نسبتاً موثر عمل کنید.
  reptile.frilled_lizard:
    label: اژدم لِمر
    summary: جوجه‌ماهی که بالافور لَبروز می‌کند و با دوتنه مشابه دینوساورها.
    info: اگامهٔ لیمک به زبان فارسی، پستاندار اُسترالیایی است که در هنگام تهدید باز شدن جلد بزرگ حول سر خود را نشان می‌دهد و آن را برای دفاع انجام می‌دهند. وقتی تحت حمله قرار می‌گیرد مثل چوپتر روی پاهای عقب حرکت می‌کند شبیه یک موجود قدیمی. در حالت طبیعی بدون تحریف، جلدو متراکم است.
  reptile.frog:
    label: سالنگ
    summary: تکاملاً دوقلو، پرنده خوب و شب غذاخور.
    info: سالنگ قرمزچشم، تکامل دو زندگی از لاتین آمریکا است که در جنگل‌های مدار نپذیر بافت سبز و فعال شبانه روزانه به وجود میآید.
  reptile.gecko:
    label: گکون
    summary: خزن روزمره توانمند برای بالشتنتن بر صفحات عمود.
    info: گکون لیوپارد به خاطر ظاهر جذابش در محبوبیت است و با دهان‌چین‌های نازل روی پاها، بدون همراه شدن از آدامس قادر به حرکات برجسته بر سطوح قائم مثل سنگ فراموش کنید.
  reptile.gharial:
    label: گاولي
    summary: حيوان شب‏خزنده اي با پنس بي نهايت ضيق متخصص در صيد مايع.
    info: گاول جانوری است از خانواده کрокوديل‌ها در هند با دم و بینی طولانی، مناسب برای شکار ماهي. نرها يك تكان كوتاه به اسم «غرا» روی سرشان دارن. اين موجود فقط تو رياح شمال هند و نيپال زندگى ميكني. بين فرسليت بالايي قرار داري.
  reptile.gila_monster:
    label: هلودرم
    summary: خوزنه سنگین وزن سم زاد منطقۀ غرب جنوبی آمریکا با پوست شبیه الماس.
    info: هلودرم جیلا به همراه نام علمی اش که هلودرما سوسpektوم است، یکی از تعداد بسیار معدود خزنده‌های سمی دنیاست. پوست آبشارگون با الگوهای قرمز و مشکی بر روی بدنش وجود دارد که نقش هشدار را در مقابل شکارچیان انجام میدهد.
  reptile.glass_lizard:
    label: سلصیش
    summary: مارچوب بدون پاهایی است که البته حشره نیست بلکه عضلات لرزشمندهای غرفه داشتن.
    info: سُلَصِی‌ش اورباین، مارچوب بدون پا است که در سراسر اروپا زندگی می‌کند و به راحتی با خزن آشفته می‌شود؛ برخلاف خزنهای واقعی دارد فراموش نکرد مثل همراهان قابل حرکت و شنوائی مناسب. قادر به جدا کردن ذنب خویش به عنوان تدافع (اتوتومی) بوده ولی بعد از جداسازی، ذنب دوباره روستاده.
  reptile.hawksbill_turtle:
    label: کارتکا
    summary: در معرض خطر فروپاشدن سگ موذب دریانما
    info: کارِتکا پراوآ کریتیکال به معنای خطرناک، در معرض انقراض قرار دارد و از جنس الرتموچلیس است. ساب تخته‌اش منبع باستانی زغال بود؛ صادرات غیرقانونی آن نزدیک شده است کہ تمام شود.
  reptile.horned_lizard:
    label: سرخود
    summary: جوجهٔ لخت با حلقه‌های مشابه مواد بلند در سرتاسر بدنش.
    info: سگان خرطومیت (فروینوسما)، جانور پوچه و تراش با دندان‌هاست که در بیابان‌های غرب آمریکا شمالی و مکزیک زندگی می‌کنند. این موجودات وقتی تحت فشار قرار می‌گیرد، قادر به شلیک خون از ناحیه عدسی همراه با ساختار مقعدی بر روی بالغتر از ۱ متـر است؛ ابزار دفاعی منحصر به فردی را تشکیل می‌دهد. حرکتش ضعیف است؛ بنابراین مستقلاً به نقاشی طبیعت محاطی متوکله است.
  reptile.iguana:
    label: لزغون سبز
    summary: سبزي کندوياني عظيم آمريكا استوائي با يال غرقابي.
    info: گرگان زرد، ساکن امریکای استوائی با طول برش تقریبًا دومتر و پوشش نخوده مقوار در بالاترین قسمت سرو خود به عنوان حس‌گره برای تشخيص تغييرات روشنائي وجود دارد. اين جانور فعاليت هاي اجتماعي روزانه مثل تعريف مرتبه غالبتي بين ديگران را داشته كه شامل ضرب شدن صدفهاست.
  reptile.king_snake:
    label: سرسبا
    summary: هدوئون آمریکائی نامعروف با مقاومت بالا علاوه بر توانستن غذش را فراهم کرد.
    info: خیلی از کرکس ممتد به هدف دانه‌ای است، شامل سرسپارها و حشرات در برابرش جنگند.
  reptile.komodo_dragon:
    label: سحلب کامودو
    summary: درجه حرارت بالاترین پستاندار زنده جهان از جزيرة کمدو در اندونزيا.
    info: کومودو دراگون بزرگترین مار زنده جهان است که طول آن بالای سه متر و وزنش از هفتاد کیلوگرم فراتر رفته‌است، تاریخچه نشان دهنده باور به قتل عاملها با باکتریهای موجود در لعاب دندان؛ ولی در حقیقت غدد سم دارد، حیوانات مثل مرغ موظل، خوک و حتی گاو را شکار می‌کند، فقط روی بعضی جزیره های انحصاری اندونезیائی زندگی می‌کند و وضعیت او منجر به وجود خطر برای آن شد.
  reptile.leatherback_turtle:
    label: کوزاتا
    summary: بزرگ‌ترین ماهیچه دریائی با لباس مواد مرغوب به جای مقوا.
    info: کوزاتا ولگو نمونه ای است از بزرگ ترین مارمولک درساز جهان که طولش بالای دومتر و وزنش فراتر از هفتсот کیلوگرم رفته است، به جای پوشش سخت عظمت آن با قطعات غضروفی محکم شده است. او دور زدن صد هزار کیلومتر روی نقشه ثبت شده است؛ فقط برروی مدوزها حرفه‌ای عمل می‌کند و وضعیتش خطرناک است.
  reptile.lizard:
    label: جَوْزن
    summary: چهار پا فروزان لطیف موجودی مشاهد در مناطق گرم.
    info: گوزن سبز جانوری بزرگ است که در آمریکای مرکزی و جنوبی زندگی می‌کند، این حشرات خوار باشد، بهترین تیر انداختن دارد و قادر به رونق قسمت شلخواسته ذُخلصش نمود.
  reptile.mamba:
    label: '"سارچاه"'
    summary: '"سریع و بسیار سم‌دار، مار درختی آفریقا."'
    info: |-
      {"hint":"سریع و بسیار سم‌دار، مار درختی آفریقایی (دندرواسپیس)","info":"مار سرخابه از جمله پرتانو ترین و سمگرانترین موشکله دنیاست.
      در زمین به راحتی با سرعت بالا حرکت کرده و قادر است روی درختها فعالیت نماید.
      jadid neurotoxin ان بدون وجود antiserum منجر به مرگ در عرض ساعات خواهد شد.
      nام 'سارچاه' بر اساس رنگ داخل دهان او مشخص شده است،نه لازوماً رنگ بدنش(آبی یا Oliv) "}
  reptile.matamata:
    label: ماتاماتا
    summary: ماهی آبرسان حلقه‌وار متراژده وجود دارد.
    info: ماتاماتا از جنسیت ماهی‌های آب شیرین در منطقۀ غربی و مرکزی قارهٔ آمریکای جنوبی است که به خاطر ظاهر عجیبش مشهور است، سطح پوستش شبیه برگ فاسد با لبه همراه است؛ دندان ندارد ولی موادغذائی را توسط زبان بزرگاش جمعآوری می‌کند.
  reptile.monitor_lizard:
    label: وران
    summary: مار فعال با لب تفرجمند.
    info: واران جنسی از مارهای بزرگ است که دندان‌ها و زبانش به شکل خاصی هستند، برخی انواع آن در مناطق مختلف پراکنش دارد.
  reptile.mud_turtle:
    label: بلاتيوا
    summary: مايكرو كرتك انقليسي كوچك.
    info: گوزیل‌های لجنی (کینوسترنون)، سلاح جانوران کمتر از پنجم قارچ در نواحی آمریکا شمال و مرکزی هستند، وقتی تهدید میشود به شدت بوی بد با غدد عطر دارد. قادر است خشکسالی را با حفر زیر بخشهای رسوبات طبیعی و فعالیت ذغال سنگ تحمل کرد.
  reptile.mudskipper:
    label: شاموک باتانوس
    summary: ماهی اسکلتی که با پرهای بالشتی روی خشکی حرکت می‌کند.
    info: ماهی شاموک باتانوس، ماهی‌ای از خانواده جوبیدها است که زمان قابل توجهی را در محیط آب بدون سرگرمی به حالت نشستن و حرکت روی لغزنده هاست. با پرهای بالشتی مشابه فلتر دودخواه بر روی مواد غیرآبی مثل بلوط حرکت می‌کند. تنفس این ماوراء طبیعی از طریق پوست مرطوب صورت می‌پذیرد و قادر به عبور از مناطق مختلف شامل رشد درختان مانقرفون است.
  reptile.newt:
    label: چولك
    summary: جانور صفت‌دار كوچكي كه درآبي و روياي يابيد.
    info: چولک بزرگ‌ترین جانور از خانوادهٔ سالامندرها در منطقۀ مرکزی اروپا است که طولش ممکن است به بالای پونده و نصف دسیметر برود. هنگام تولید مثل، آلت تناسلی نر با وجود شاخساری مشخص و لطمات شبیه فصلند قابل تشخیص است. تمام انواع مختلف چولک در جمهوری چک تحت حفاظت قانون قراردارد. زمستان را در زیر ريشه درختان يا غارهاي دور از محل‌های آبی گذراندن.
  reptile.poison_dart_frog:
    label: سم فرا
    summary: جانور سمومی کوچک با رنگ های روشن در منطقۀ آمریکای ترمو.
    info: سگماهی ابریشمک جانور کوچکی است متعلق به خانواده دندراباتیدا، در مناطق مرطوب و سبز تروپیکال آمریکای شمالی و جنوبی زندگی می‌کند. رنگ های روشن مثل قرمز، آبی و طلائیش نمودار حالت بدن برای بازنده شدنش (آفزايشتزم)، وجود دارد. بعضی انحصارها این موجودات غیرقابل تحملترین پستانداران جهان هستند.
  reptile.python:
    label: کرايت
    summary: مار بزرگ بدون زهر كوركوي كوبي.
    info: کرایت‌ها بلندترین مارهای جهان هستند؛ کرایتا رشته ای طولش بیش از شفت و سوم است. آنها با سم نمی‌کُشد، بلکه قربانی خود را درگیر حلق و بدنش می‌خورد تا نفس ندهد. دارای پذيرفته حرارتی (لچاهای فروسرخ) برای تشخيص غذاي گوشتى حتى در تاريكي وجود دارد.
  reptile.rattlesnake:
    label: چرستیش
    summary: مار سم‌داری است که شامل چند عدد ضربه بالغ روی ذنب است.
    info: چرستیش جانور خطرناک و سم‌دار از دسته مارهای زمینگون است که در پاصلب به طول فردی، قطعات سخت بافت شده رنده وجود دارد. هدف آن ترس اندازن بودن برای حمله نامطلوب علیه غذای لازمه است.
  reptile.salamander:
    label: ملوك
    summary: جانور با لبده براق و ذنب بلوند.
    info: ملوک اسپوت‌دار، تاگلی مدرن وسط آلمان است که دارای جراثیمش به رنگ زرد و سیاه است. مواد سمی از پوست خود فروش میدهد و در جنگلهای مرطوب زندگی می‌کند.
  reptile.sea_snake:
    label: عقاب دریائى
    summary: جنس سم‌زن موافق محیط دریاء با ذُخلَّة شبیه قطب
    info: |-
      عقاب دریایی، پستاندار جویندگان خانواده هیدروفونا از نظر کاملاً به زندگی در اقیانوس سازش دارد
      چرخنده‌اش مثل قطب راهرو برای شنا غیرقابل انکار است
      تقل آنان عصب‌تنش‌زا و بسیار توانمندتر از مسمومیتهای فلزات سنگین؛ ولی حشرات باعث تعجب نمی‌شود
      آنها هوافشاری می‌جوشند و لازمهٔ تنفس دائمی بالا رفتن به سطح وجود دارد
  reptile.skink:
    label: اسکِنس
    summary: مارمولکی با زوزنهای صاف و مشابه المعاتم و پاهای کوتاه.
    info: سکنی‌ها خانواده بزرگی از مارمولک با بیشتر از ۱٬۵۰۰ نژاد هستند و دارای زوزنهای صاف سیلوئیدال هستند. برخی انواع فاقد پاهاست، تقریباً بدون پا است یا به طور کامل بدون پا. سکینک آسترالیایی رنگ لب منفردی در حال حرکت قرارداده شده است مثل چراغ بل瞀 جهت حفاظت.
  reptile.snake:
    label: زنبر
    summary: بادون زنبیر فاقد لاغر و موافق نوار بلند.
    info: وزغ‌ها مهره دارانی با بدن اسکلت شده و بدون پا هستند، کمتر از سه هزار نوع وجود دارد؛ آن‌ها به جویدن برای تشخیص غذا استفاده می‌کنند (از طریق عضوهائی مثل اورگان jakobson)، بعضی انحاعل وزغ‌ها سم خطرناک ترشت.
  reptile.snapping_turtle:
    label: کوساوا زوزه
    summary: زنده مايه اى تهاجمى امريكاى كوچك با دندان هاى ضخيم.
    info: کوساوا زوزه عام به آمریقای شمالی متعلق است و نهنگ دریائى بزرگ، تهاجمى با دندان هاي قوى اسید فسفات سرپنتیناست که وزن بالغ بر ۳۵ کیلوگرم را حمل مى‌تواند کرد و عمرش ممکن است پنجاه سال طول بكشد. غذافروزى كلى است؛ شاخه هاى جلبكى مثل ماهى ها، مرغان آبى و حتى مواد خوراكى بدون عضو وجود دارد.
  reptile.thorny_devil:
    label: مورخ تراخت
    summary: مارز زمینی است که با سوزنان پوشیده شد.
    info: مولوچ تراکته مارز زمینی است که با هزاران سوزن پوشیده شده‌است، این حشرات در خاکستر جذب آب را دارد و قادر به جذب آب از طریق لایسنس فروشندگان بوده؛ نتیجهٔ این عمل عبور مستقیم آب به منطقع اوست.
  reptile.toad:
    label: سگماهی
    summary: جاندار قاره ای با لخته های پوستی شبیه زاو
    info: |-
      سگماهی سرخ عمومی در جمهوری چک پراستفاده‌ترین زا هاست
      برادو نمی‌زنند؛ به عنوان محافظت عمل می کنند و منبع ترشحات سمی هستند
      هر سال با دسته بزرگ از آبها برای تولید مثل حرکت می کنند، در چک مردم خود راندرونهای عبور از معابر شهری را مدیریت می کنند
      با موشکاه، انفاس و حشرات غذاء می شوند و تنظیم کننده طبیعی موجودات فرسائش است
  reptile.tortoise:
    label: ماهی خاویار
    summary: پلان با غلاف لوبی بر روی خشکی.
    info: '{"info":"تامار هرمنگ الکسیلور نمونه‌ای از بزرگترین ماهیان جهان است که در منطقۀ ساحل شرق آفریقا زندگی می‌کنند و طول عمرش تا بالاتر از صد پنجاد سال رسیده است، قسمت مهمی از استخوان فقراته را تشکیل دهد.","label":"ماهی خاویار","summary":"پلان با غلاف لوبی بر روی خشکی."}'
  reptile.tree_frog:
    label: روزنیچکا
    summary: سبزیجفت سالم با لبه‌های تمیز
    info: |-
      سالنگ سبز روزیچکا از خانواده هایلیدئ به عنوان جوجه‌خور درختان با پد مخصوص دست و فوت بر روی صفحات نرم است که تغذیه آسانتری ارائه می‌دهند
      در زمینهٔ بلغارستان، فقط نوع واحدی وجود دارد؛ حفاظت قانونی انجام شود
      براساس حرارت و مرطوب بودن محیط، رنگش از سبز به خاکستری یا قهوه‌ای عوض میشه
      همراه با طبل موسمی شبها، غناء بالایی داره
  reptile.tuatara:
    label: توتارا
    summary: 化石 زنده توآتارا تنها ذره اسپرم از ردۀ رونچوفالیا.
    info: تواتارا از قدیم‌ترین پوزهای جهان است؛ رده آن در دوران دایناسورها وجود داشته است و فقط روی جزر سرزمین نو زندگی می کند. به شدت با فشار رشد میکند، بلوغ جنسی تقریباً بعد از ۱۰ الی ۲۰ سال حصول می کند. بعضی افراد بالغ سن خودشان بر ١٠٠ سال هم غلبه می کند و چشم سوم موجود در صفت نوزادان عملکرد دارد.
  reptile.uromastyx:
    label: اوروماستیكس
    summary: جانور خشخاش افروز با ذُخلتِ تراشه از آفریقه و خلیج فارس.
    info: "اوروماستیکس جانور خشخاش افروز در منطقه آفریقا، خلیج فارس و هند با دم تراشه‌ای مشخص است که برای پناهگاه بهتر مورد نیاز است. \nاین حشرات فقط سبزی خوار بوده و غذای آنان شامل دانه، علف و برگ است. \nدر محیط زادوباردار شده طریق ماکروبیوس قرارداده می‌شوند."
  reptile.viper:
    label: زمج
    summary: مار زمجمان سم‌دار با سرش مثلثی و بدنش انحافت.
    info: زنگ جنوبی تنها مار سم‌دار طبیعی در کشور است و به دلیل الگوی منحنی روی پشت خود و فکر ترسناکش شناسایی می‌شود.
  reptile.wall_lizard:
    label: جدال كليدي
    summary: حيات كوچك و سريعى است كه بر روى ديوارها و صخره‌ها زندگى ميكند.
    info: جسترشکا زدینی جانورچه کوچک و اصلآ سرزمين های جنوبى اروپا و شمال غرب آفریقا است، در چك به عنوان يك نژاد معرفى شده بر رووى سنگهاي داغ و ديوارها پراكنش دارد. سريع و انعطاف‌پذير بوده؛ وقتى خطر وجود داشته باشد عقب راهش را تكان میدهد.
  reptile.worm_lizard:
    label: سرما
    summary: پوز توئولوژيكى بي ногى مثل كرم كه زير زمين زندگى مىكرد.
    info: چرخ‌های بدنی در افراد جنس «آمفسباِن» به خوبى مطالعه نشده است، کرم هاى بدون پاهستند كه عضو يك دسته با عنوان آمفيسبينىا واقعاً زيرزمينى هستند؛ تقریبًا شبیه سانسکربالار ضخيم ديدي مي شوند، پوست قطاعى و چشمهاى روديمنتري داشته و تمام عمر تحت فشار زمين زندگى مىكنند و غذشترين بر رووى مورچه ها و ماياز هاستند.
