lang: mr
pivot: false
title: प्लेरिया आणि अम्फीबियन
cards:
  reptile.chameleon:
    label: चमेलियन
    summary: त्वचा रंग बदलणारे प्राणी, स्वतंत्रपणे हलणाऱ्या डोळ्यांसह.
    info: जेमेन कमेलिओन आपला रंग मास्करिंगसाठी नव्हे तर संपर्क आणि तापमान नियंत्रणासाठी बदलतो. त्याच्या अशा दुहेरी डोळे स्वतंत्रपणे फिरू शकतात.
  reptile.crocodile:
    label: क्रोकोडाइल
    summary: नदी आणि स्वामितळ परिसरांमध्ये राहत असलेला मोठा प्राचीन कीटक.
    info: नैल क्रोकोडाइल हा जगातील सर्वात मोठे पंखवाले प्राणी आहे. एशियामध्ये राहतो आणि पाण्यापासूनच शिकार करतो. त्याचे दात सर्वात बलदार आहेत.
  reptile.frog:
    label: कवच
    summary: लाल डोळे असणारा हरभरट प्रज्वलन करणारा समुदायीय जंतू.
    info: लिस्टोफेनिक्स चेर्वेनोओका हा एक उष्णकटिबंधीय द्विपादी ताहडपग आहे जो लॅटिन अमेरिकेमध्ये आढळतो. तो झाडांच्या माथ्यावर राहतो, फिङ्गर्समधील छिद्रांद्वारे उडतो आणि रात्रीच्या वेळी सक्रिय असतो.
  reptile.gecko:
    label: गेकोन
    summary: उभ्या पृष्ठांवर चढणारा लहान सरपटती माशा.
    info: जेवे कि गेकोन लिओपार्ड हा एक जलद प्रसिद्ध घरगुती पंखधारी आहे. त्याच्या पायामध्ये असलेल्या छोट्या बाळांमुळे तो खडकांवर आणि भिंतींवर टिकून राहतो; इतकेसुद्धा कि त्याच्यावर लापच नाही.
  reptile.lizard:
    label: जेस्टर
    summary: गरम भागात प्रचलित चोहोकडे मुंगीसारखा सरपटत जनावर.
    info: भिन्न हिरवी इगुआना ही मध्य आणि दक्षिण अमेरिकेमधून येणारी मोठी लिझार्ड आहे. ती बाळांच्या उपयोगाने खाते आहे, एक उत्कृष्ठ क्लाईम्बर आहे आणि घालवलेल्या पुच्छिसचा भाग पुन्हा तयार करू शकते.
  reptile.salamander:
    label: मलॉक
    summary: शुष्क आणि सतही कोरडेपणाचा असलेला द्विजन्मी प्राणी आणि लांब पुच्छल.
    info: मलॉक स्कवर्निटी हे मध्ययुरोपीय रक्षित द्विजन्मी प्राणी आहे ज्याच्या शरीरावर पिवळा-काळा धागा आहे. त्याच्या त्वचेमधून एंटीजेनिक पदार्थ बाहेर पडतात आणि ते ओल्या जंगलांमध्ये राहतात.
  reptile.snake:
    label: साप
    summary: कोंडी आणि प्रत्ययशील शरीर असलेला बिनचपट किंवा सुराख वगळून इतर कोणतेही भाग नसलेला मासे.
    info: साप हे एखाद्या चपट त्वचेमध्ये रहाणाऱ्या जनावरांमध्ये घालून झाकून ठेवलेले असतात. 3,700 हून अधिक प्रजाती आढळतात; ते ओळखण्यासाठी धूप वापरतात (जैकब्सन ऑर्गन) आणि काही त्यांच्या डांबांद्वारे जहाल असतात.
  reptile.tortoise:
    label: स्थलीय कराचा
    summary: कोमविहीन जमिनीवर राहणाऱ्या प्राणीचे संदर्भपूर्वक शेडबर्न असलेले मनुष्यजातीतील प्राणी.
    info: गैलापागोसवर हा सरळ आहे आणि 150 वर्षांपेक्षा धन्यवाद झालेला एक बर्फखाल आहे. त्याच्या हडबर्न खासगी घटक आहे.
