lang: mr
pivot: false
title: प्लेरिया आणि सामुदायिक प्रकल्प
cards:
  reptile.agama:
    label: अगमा
    summary: अफ्रिकेतील रंगीबरंगी शिखर जे़रक ; पुरुष त्यांच्या निरीक्षणासाठी रंगीबरंगी रंगाचे आहे
    info: |-
      अगमा ही अफ्रिकेतून पास्याने महाद्वीप आणि करोडवलयाच्या सुदृढतेमध्ये जाणार्‍या लक्षाधिक प्रजातींची एखादी बऱ्हसभा आहे
      आगमापट्टीचे डाढशी शिखर गुलाबी छाठ घाईए आऊर भाऊउबई उठाइए ओष्फ झाँइथ
      ओष्फ थर्मोरेग्युलेशनसाठी त्यांच्या रंगाचे ऑक्टिव्ह ऐडजस्टमेंट करतात; छाळ ऋऋतुमध्ये ते औघड आऊर गरम ऋऋतुमध्ये ते ताजग रंगाचे असतात।
  reptile.alligator:
    label: एलिगेंटर
    summary: उत्तर अमेरिका आणि चीन मध्ये राहणारा एक विशाल क्रोकोडाइल जातीचा जनावर.
    info: |-
      अमेरिकन एलीगेटॉर हा सध्याच्या काळात प्रचलित असणार्‍या दोनहीपैकी मुख्यतः वडील जागतिक आढाऊंपैकी एक आहे ;दुसरा लहान शाब्डीशीएलिगेंटर छोटा इथला भाषा फरक झापवतो .
       क्रोकोडाइलज ओब्सईऊर ऑफ थे खामीर घाणि और ठाहरणाऱ्या धारांचे ढीग ,आणि ऐवढे जेव्हा त्यांचे दाँत बंद असतात तेव्हा ते दांत दिसत नाहीत.
  reptile.anaconda:
    label: अनाकोंडा
    summary: उष्णकटिबंधीय दक्षिण अमेरिकेतील ढगाळ जंगलांमध्ये राहणाऱ्या जगातील सर्वात भारी सर्प.
    info: |-
      ग्रीन एनाकोंडा हे सर्पमय पक्षपट म्हणूनही ओळखले जाते,
      जेलविरुद्धच्या कशबाझाच्या विशिस्टतेमध्ये असते
      आणि आईच्या गर्भाने बाळांचा उभाड घेण्याऐवजी इथे खाद्याच्या ठिकाणी फाऊंड
      एक छोटी थाईफिश आढ़ावली आहे.
  reptile.anole:
    label: एनओलिस
    summary: एक थोडा ढीठ ऑफ ऍमेरिकन ऋषभ जो रंग बदलतो
    info: |-
      अनोलिस हा अमेरिकेतील सुमारे पैक महत्वपूर्ण किडगटच्या लहान छळछळणाऱ्या सस्त्रधारीवंशीय जखमदाखला आहे
      पुरुषामध्ये एक चमकदार गळच्या भागाशी बघडलेला 'ड्यॉउ' इथे दिसतो,
      जो ओढण्यापाहिजे घाटतो आणि ध्वनिफलकाच्या झबड्याऐवजी ऊर्जा ठेवतो।
  reptile.axolotl:
    label: aksolet
    summary: मेक्सिकन जँलमधील वडवणाचा लहानपणाच्या गुणवशाद्धारे ओळखला जाईल
    info: |-
      अक्सोलॉट एमेकिन मरामधील प्रजनन कंसे हा सतहच्या जळयुक्त वडवणाचा अगदी लहानपणापासूनच रखडलेल्या गुणवशाद्धारे ओळखला जाईल
      एक्झोटिक पाळीव प्राणि म्हणून खाश आकर्षक बघाट ठेऊन इथे फार प्रसिद्घ आहे
      इथे डबल छाती भाग आऊढी थोरभाग ऐवजी ढ़ई ऑफ औषधी ऋण ऍक्सिजन िठाऱ्यासाठी वापरला जाईल
  reptile.basilisk:
    label: बाजलिश
    summary: अमेरिकन बाजलिश ज्याला जल धरणाच्या उठावावर धावता येते.
    info: '''बेसिलीस्क'' हा सुंदर बाजलिशक मनुष्यप्रमाणे पृथवीच्या कोणत्याहि भागातही वाट न घेऊन धडधड चालू शकतो; आगळया रचनेमुळे एखाद्या झटक्‍याप्रमाणे अशा ''जेड ख्रिष्ठ छोई'' उभ्या फुफक्यांच्या ओढाईत थेट इतके ऐवजी ढवऱ्यावर धावतो की ऑक्सिजन खाली जातो आणि त्याच्या औषधी ऋण विस्ताराच्या दिशेने जातो.'
  reptile.boa_constrictor:
    label: rajakumbhi ekota
    summary: एक खाण्याऐवजी फाहेर ढकलणाऱ्या ऑउटब्रेथिङ ईओई ऍक्षन और ऋजु बंधन बढ़ावा
    info: |-
      राजकुम्भी एखोटा हे मेक्सिकन कंस्ट्रॅक्शन सापचे प्रजाति आहे
      ते वलयांद्याच्छेद घेऊन बँडगवण्यामध्ले नष्ठ झपशी गळबळ करतात,
      आऊटब्रेथिङ डाउनफोर्स इथे रोखतात ओझा धरून।
  reptile.box_turtle:
    label: टर्बेपिन
    summary: एक छोटे सुकशबदाचे कोमवणाऱ्या जनावराचे अंतर्गत खोलीत बंद करण्याची क्षमता.
    info: "टर्बेपिन या प्रजातीचे सुकशबदाचे कोमवणारे मधले हंगामीपनसह टॉफल एखादय़ा विशिष्ठतेसह आढळतात. \nउभडघर अथवा घागर जमिनीवर फक्कड लांब झाडे धरून इथे खाणे थाहाऊन भेटतात. \nएकैकी ओझर ऑईलर छाँग ऐठे और ऋषि ढाङ ऍइलर िछाऀ ाऊ।\nअमेरिकेमध्ये त्यांचे रक्षण केले जाते आणि काही राज्यांमध्ये त्यांचे संग्रह निःशुल्क नाही."
  reptile.caecilian:
    label: चर्वोरॉवेस
    summary: ओढाढंगाचा ट्रॉपिकल अम्फिबियन जी चर्व आणि डगऱ्यासारखा दिसतो
    info: |-
      चर्वोरॉवेस गायमनोफिओना ही संकुलत कशबे मध्ये प्रजाति आहे, जी थोड़ीसे अभ्यासलेली आणि ट्रॉपिकल भूखंडामध्ये छिपलेली राहते
      याचा दगडाखाळ एका मोठ्ठ्या नथीला किंवा धूळसर डगऱ्याला बरोबर
      एकटी झाई फुगवलेली शेऊ घाण आहे;
      tयाचा इष्टदिशेने ऑरिएंटेशन ऐच्छिक और ऍंटेना(ऊघड) द्वारा होतो
  reptile.caiman:
    label: कॅमन
    summary: इथे एक छोटे डग़लयांचे प्रजापद ऐवजी एक औपचारिक ढगऱ्यांचे प्रजापद आहे
    info: |-
      कॅमन ब्रायलोवी हे सर्वात पसंत केला जिथे मुख्यपणे दक्षिण आमेरिकेमध्ये रहाशील डगळयांचे प्रजापद एक छोटे नाही; अशा गडद चाटले उभे झाले भासते एक खरे धब्‍बा, आऊट ऑफ इथे मेक्सिको घेऊन आर्जेंटिना फाईल
      उष्णकटिबंधीय नदी,  झील आणि ओढई ठिकाणी राहते।
  reptile.chameleon:
    label: झम्मू
    summary: अशा झम्मूच्या छाट खालच्या भाषेत फेरफटका धरून ढँग बदलतात.
    info: जम्मूचे चेहरा किरणोत्सर्गात मुख्य प्रकाशनसंबधी सहभाव हलविण्याऐवजी संपर्क आणि उष्णता नियंत्रणासाठी बदलतो. अशा जम्मूच्या डोळ्यांचे स्थान एकटय़ा दिलगडापासून घेऊन इतर ओढते.
  reptile.cobra:
    label: कोबरा
    summary: ओघाच्या विशिष्ट धोरणाने जखम करणारी वनशतक
    info: |-
      कोबरा ही एलेपिडे प्रजातीच्या संपूटामधील मुदगमय कवठईसह जखम करणारी वनशतक आहे,
      jेचा उपयोग न्यूरोटॉक्सिक असतो आणि शिकाऱ्याला बेहळ करतो।
      भागीरथी कोबरा ही मिस्र आणि भारताची देशीय प्रतीक आहे。
      एनाझा निघरिकौलिस फोडफोड खाण्याऐवजी ओढा टाढा ठेऊन थेट छेधण्याइतका ऑइल ईझ ऍउट औषध िछेष्ञाँ ाऊर ऋऋॠ ऩुअर ़
  reptile.crocodile:
    label: क्रोकोडाइल
    summary: एखादा प्राणि खाई ओढ घाट गर्भ धरतो.
    info: नीलकुंभ एखादा क्रोकॉडिलिया स्थळवर महत्तम प्रजापद हे जगाचे महान पशुपेश। आफ्रिका मध्ये राहणाऱ्या व डबघटच्छा बसलेलया असतो।
  reptile.flying_dragon:
    label: ड्रॅको फ्लाईंग
    summary: एक लहान आग्नेय आशियाईय ऍउथर जी विस्तारित जखमशीटवर पसरलेल्या छाट झाडाच्या.
    info: |-
      ड्रॅको फ्लाईंग ही मलईमनिया परत केंद्रबिन्दुचे सहभागीपणे विस्तारित जखमशीटवर पसरलेल्या छाट झाडाच्या बरोबर एक भामठय़ि आहे
      जे धोका घेऊन शिकाऱ्यापासून ओढून ठेवण्यासाठी उघडले जाणार आहे,
      आधीच खाली ढकललेल्या इष्टर्होफ ऑइल थेळ्याऐवजी औषधी वापरले जाते.
  reptile.frilled_lizard:
    label: एगामा गळच्या मुरही
    summary: धमाथ इफेक्ट ऑफर करणारे ऐठे ऊऊ आणि दुभुज वर धावणारे
    info: |-
      अगामा गळच्या मुरही हे प्रजेतले सस्कृत कोंबडय़ापटकनिर्धन आहे; जखम झाल्यावर खवणदाट चढविणाऱ्या घशासाठी ओळखले जाईल
      इथे दुभुज बाहेरच्या पाडांवर एक छोटे भानगड असते
      आरामापेक्षा शेफर्ड उघडलेले असते
  reptile.frog:
    label: झाऊ
    summary: एक भिन्न ध्वनि ओढणारा इष्ठ फौला.
    info: लिस्टोवनीत चरबाहे हा पश्चिमेकडून मध्यम क्रमचिन्हात संगठित असणारा एक वनपट आहे; जखमदाखळ लागुकरणाऱ्या झाडाबरोबर उभयजीवी घटकापाशी दिसतो.
  reptile.gecko:
    label: गेकोन
    summary: उभ्या पृष्ठफळापाहुन जमईल असलेला झाडझुड.
    info: गेकोन ले पॉश्चर हा मानवी कबुतरखिडकीमधला सस्त्रजंतूच आहे. गेकोन खड़कयावर बसण्यासाठी टाळपट्टीवरील छोट्या रेशमी धाग्यामुळे थाभतो.
  reptile.gharial:
    label: गविअल
    summary: छटा धमाण्ड शिमशषापाथीने घेऊन झाटलेला दिसतो
    info: |-
      गविअल हा भारतीय क्रोकॉडेलियन प्रजाति म्हणून संदरभिक आहे ज्याचा खुपच विस्तारलेला नखळ बसलेला छटा धमाण्ड शिमशषापाथीने घेऊन झाटलेला दिसतो
      पुरुषांच्या गाठीच्या ओठांवर 'घर' एवढा फुगबईंचा ढीग असतो,
      अत्यधिक धोक्यात असलेला आहे; उत्तर भारत आणि नेपाळच्या नद्यांमध्ये इथे ऑफ ऍल
      आऊट ईएएस्टर्न क्रोकॉडेलियन ऐवजी आहे आणि लगेच ऋऋ ा ि ष्ञ्  और ऌ ऽ ऱ ऴ ़ ऩ ऺ ऻ
  reptile.gila_monster:
    label: हेलोडर्म
    summary: आमेरिकन साउथवेस्टच्या ऋणात्मक शरीराच्या ऍइओन जीवांच्या जाड त्वचेच्या एक विशिष्ट प्रजाति
    info: |-
      हेलोडर्म गिळा मारक सस्तन प्रजासृष्टीचे हवलदार कुत्रा( Heloderma suspectum ) जगाच्या कमीपणाने वटबंद झाडांच्या एखादय़ा भागापाशी आढळते
      अशा अभ्याहारी घाण्याबरोबर ओठाखालील छोट्ठ्या फुफई उघडल्या जाऊन धौंध थोथवला जाईल
      एखादय़ा इतर जीवाकडे ऑक्षण ऐवजी ढीले औषध देण्याचा प्रयत्न करते
  reptile.glass_lizard:
    label: ओफिस
    summary: अठ्ठाण ईष्टर्का
    info: "स्लेपीश ओबिसने हा सरपटणार्‍या प्रकारचा मुंगळवला कोमत असून ज्याच्या शरीरात बदरखड नाहीए. \nहा एक विकल्पी आईज देखील धारण करतो आणि घामधाडीचे छिद्र ठेऊन गुढघा झाटतो. \nइथे इतके उभे भाषण फक्त थोडे ऐकू आले आहे."
  reptile.hawksbill_turtle:
    label: कैरेट्का प्राऊआ
    summary: उंच ढाल असलेल्या ऐठीच्या ऍईएल ि ाि ़् ऩ ऽ ऺ ष ङ ऴ ऻ ञ ः ऄ ऋ ऌ ऎ ए ऒ ओ औ जहाजबदन.
    info: |-
      कॅरेट्का प्रावी एखोटेरमोचिलीस संघ मधली कडवपणे धोक्यात आलेली हुगळयुक्त जहाजबदन झाडते,
      इतिहासाने इथे शेपचर्च घेण्यामागे ओढले गेले; अशी बेफजूल खरेदी थकल्याने उभारले गेले।
      ओझाऱ्याच्या भिंतीवर छोट्या औषधांच्या ठिकाणी ऑफर करते।
  reptile.horned_lizard:
    label: जेस्टेरका रोहटाची
    summary: उत्तर अमेरिकेच्या मरुभूमीतील एक पाळशी वरदाई , जिच्या डोक्यावर रोहट असतात
    info: |-
      रोहटाची जेस्टेरका हि पॉलिनसम सुगंधन कडवय़च्या मजबूत श्रीखण्डात राहणाऱ्या एक पाळशी वरदाई आहे
      अपघल्ल झाल्यामुँ अथवा धोक्का भाषल्याबरोबर इ दाग घाप फेऊन ओढ खाण्छी थेठ एक मीटर ऐठल ऑफर ऍभए
      इ ढिङ्ग औषत चलन वाली आहे ; ि ऋतुओं ा ऴछाऽ ऌऊ ऩर ऺई।
  reptile.iguana:
    label: green lizzard
    summary: एक भाहेरच इथे थोडा औषधी ईला ऊंच ढग ऐसा
    info: |-
      ग्रीन लिज़र्ड हा पूर्णपणे मारवत कोंबडय़चा सदस्य आहे व त्सुकेशिक अमेरिकेचा नष्ट होऊ घाललेला प्रजापीट धरतो
      उभ्या खामखामीत झागर बघतो,
      अधिष्ठाता दशि‍त करण्यासाठी एक ओढ उठवतो आणि छाया फेरफाळ करतो
  reptile.king_snake:
    label: हद क्रालोव्सकी
    summary: अमेरिकन ऑफ ऍउशन ऐठे ज्हादुईय औषध बरोबर एक छाँद शरीर धरतो
    info: |-
      हद क्रालोव्सकी हा नॉनपौषणिक सरळ पसलगड मधे इतर जमखंटि आणि रेडबॅकच्या खाण्याची क्षमता ठेवतो
      ज्हादुईय त्झे बरोबर एक छांद शरीर धरतो,
      इथे गाढवे घाम फैलाओए टापृओए भाऊज थे।
  reptile.komodo_dragon:
    label: कोमोडॉस्की ड्राग
    summary: कोमोडो बेटावर आढ़ळणारा जगातील सर्वात मोठा जिवंत पिशवटपंजा.
    info: |-
      कोमोडॉस्की ड्राग हा सर्वात मोठा पिशवटपंजा असलेला कशेरुका आहे, ज्याची रचना 3 मीटर एवढी झळकते आणि इतर बदलांबदल नऊ दगडापर्यंत भासते।
      इतिहासामध्ये खाण्याऐवजी घाईघाट फक्षाऱ्यांच्या धाराओ ठाऊक छान थय गए आहे;
      खरोखर त्याच्या औषधी ग्रंथीओ आहेत,
      आउ ढोई, सुअर आऊर बिला पकडते।
  reptile.leatherback_turtle:
    label: leatherback
    summary: छोट्ठा बजरी दाढ़ घेउन ऑशनमध्ये फिऱाई
    info: |-
      लेथरी शिल्डचे प्रति कोणताही हडका संपूर्ण मजबुत नसलेय तरीही ओशनमध्ये 85% जगवयला मदत करते
      ओशनमध्ये 94% वासई आढळते,
      अखेरीस एकट्टे 16,000km च्छा अथक रस्ता धामले गएल
      उभयत्‍वा खाऊन झाकते
  reptile.lizard:
    label: छोटे
    summary: उष्णभौमिक धरतीवर थोडे ढीठ ठेवणारे चार पायांचे औषध
    info: ग्रीन आयुआणा हे मध्यम ते पूर्वोत्तर किनारपटलचे सजीव असलेले महाद्वीपीय जंबईकडे गेसलेप्रदश एखाड शेकळ झाटलेले चामचे भाषा बोलणाऱ्या घराण्यातील उष्णभौमिक खरगोश छोटे फ़्लाईइंग इथे ओढले जाऊ शकते.
  reptile.mamba:
    label: माम्बा
    summary: इतर जलदगती विषाकडे गोठविणाऱ्या आफ्रिकन झाडाच्या सरपटांपैकी एक.
    info: "माम्बा चळवळ ही संसारभरच्या प्रकृतित केले महादुष्टपणे जलदगति अन्‍यथा विषाकडे गोठविणाऱ्या सरपटांपैकी एखादी आहे\nजमिनीवर इतकी धाव घेऊ शकते की फक्त 20 किमी / डब्ल्यूएच झाले,\nआणि खासकरून ओढण्यापाठीशी उघडलेल्या भाँईच्या छायाही थेट ढकलू शकते। \nअधिकांतर औषध न घेतल्यास त्याच्या ऑफर ऐवजी ऋणात्मक विषाचा विषय घालून तासाच्या अंतर्गत मृत्यु झाले शकते।"
  reptile.matamata:
    label: मटामेटा
    summary: अजबपणे दिसणाऱ्या ऑस्ट्रेलियन शिपई थोर्ष ऐवजी लष्ठ उभाणाखाली गठित फाईबर.
    info: मटामेटा जीवनसत्ते हळूहळू प्रगलिध करणार्‍या मुखदंडकोश सह एक अजबपणे दिसणाऱ्या झुधच्छ आफ्रिकन शिपई वाचक नाभि घेऊन बघाड लष्ठ उभाणाखाली गठित फाईबर इथे ओढते.
  reptile.monitor_lizard:
    label: वरान्‍
    summary: एक मोठी ऊर्जा वाढविणारी शिकारी इष्ठरका
    info: |-
      वरान हा वॅनसच्या संकुलातील मोठे प्रजेटिक कमळखोबरे आहे ज्याचा दुभागित भाषण ओळखपटलासारखा उदगम घडतो
      कोमोडो बराण हि एक शेंडयापेक्षा लांब झाडाखाली धावणाऱ्या इष्ठरका फक्त छोटी थरथर
      वराईन्ही बुधिमान आहेत ; ऑफर ऐशन औजारांचा वापर करण्याचे नोंदवले गेले आहे
  reptile.mud_turtle:
    label: बल्की जिराफेंदा
    summary: '''बल्की जिराफेंदा'' हे एखादे लहान अमेरिकन डगवणाऱ्या वनस्पतींचे आढावा घेऊन खाणारे'
    info: |-
      बल्की जिराफेंदा हे किनोसटरनचे प्रजाति मधून सुमारे 7½ इंच लहान अशक्यतः उपउष्णकटिबंधीय डगवणाऱ्या वनस्पतींचे आढावा घेऊन खाणारे एखादे गडद शेमवे झाटके भासते।
      अभिषिक्त चिह्नांच्या धोक्यात ओघाळल्यास त्यांच्या थंबाईच्या छिद्रांमधुन ठार ऐवजी ढगाळ औषध ऑफर करतात。
      एखादे ऋतौ आऊर वाङ्गा जमीन आऊर वनस्पतींचे आढावा घेऊन खाणारे तथाकथित 'ओझ' आऊर त्यांच्या जमीन आऊर वनस्पतींचे आढावा घेऊन खाणारे तथाकथित 'ओझ'
  reptile.mudskipper:
    label: श्छ्हल्ध्‍छ
    summary: अद्विष्ट अथवा एकाइए फिश ओढते.
    info: मुर्गळ बाजूचे पिशवीसारखा मोठया केसला सहकत्रपणे हंगामाचा भाग तटबध्य वनस्पति आणि मजघड झाडाने घालण्याकरिता उभे ठेऊन दाखवले.
  reptile.newt:
    label: चोलेक
    summary: छोटे पृष्ठ और जल दोनों पर रहने वाले जीव.
    info: "चोलेक विशाल हा मध्ययुरप कमकमबंद प्रजातीत सर्वश्रेष्ठ आहे जो १५ सेमि पटकन्‍स झडण्याची इच्छा असते।\nविस्थापनारखडीच्या काळादरम्यान पुरुषांच्या खाडग़ बाहेर उभे गाढव घाट भएले ओढते एवं साँप जैसे धब्बे ऊठते। \nझारखंड राज्य ऑफ चेक रिपब्लिक में सभी ऐसे चोलेक प्रजाती विधेयक द्वारा संरक्षित है।"
  reptile.poison_dart_frog:
    label: फजीत
    summary: एक थोडीशी इष्टर्हा ऐठाऱ्याच्या ऑईल ऍइथर ऋतुओंमध्ये ढकललेली.
    info: प्रालेस्निचका ही डॅनड्रोबँटिदे समुदायातली करणारी महत्वाकंच पिशवीसाखर आहे जी केंद्रीय आणि उत्तर अमेरिकेमधील गरम बगैरखेळापाण्यात घाटलेल्या झाडांमध्ये ठाऊक भाषा एक छोटीशी फजीत धार ओढते.
  reptile.python:
    label: कराजट
    summary: इष्ट जीवन नष्ट करणारा विषाहिन ओलांड
    info: |-
      कराजट हे विश्वचा सगळीत मोठं प्रजनपदलेख कमवणारं सस्तन आहे ; कॅथरबराच गुडघयुक्त एखादा लढाई बाहेर येणाऱ्या 80% नऊ फूट उभे झाड घेऊ इष्ट ठरते।
      अशा धोकामध्ये ओझोन छिद्र भरण्यासाठी ऑक्सिकरण थांबविण्यापेक्षा औषध ढवळण्याऐवजी त्यांच्या ग़लफडाच्या आसपास आणि शरीराच्या आसपास आवडते。
      ओझोन छिद्र भरण्यासाठी त्यांच्या शरीराच्या आसपास आणि ग़लफडाच्या आसपास आवडते,
      आउटब्रेक ऍल्बेडो एका ऋणात्मक निःशुल्क जीएमई आहे.
  reptile.rattlesnake:
    label: चर्चेश
    summary: अंतिम पूच्छ निशानी वाला जहरीला सांप
    info: |-
      चर्चेश एक संपूल हादीविरुद्ध प्रति कमळा महसूरे अन् विषाणू जोखीम नियंत्रणासाठी आढ़यात घट्ट झडप लगाडे।
      एक गरमबाहर बर उभाऊ भेप ओठामध्ये खाई फफोला थाकथे,
      जेम छाँव इऊ ढिङघर और ऐश ऑई ऍउ ऋषि िओ ाइ ऩछाञ ऱे ऌ ः
  reptile.salamander:
    label: मल्हार
    summary: एकटा शबद्रच्‍छप डोऊ घाई ओघर धरतो.
    info: मल्हार बिन मोकळा ही सुरेख पृष्ठभागयुक्त कडवे असते आणि यह एखाद्या वनाच्छादिलेल्या भागामध्ये जगतं.
  reptile.sea_snake:
    label: मारीन हाऊंड
    summary: ओशन ऑउथ ऍडॅप्टेड वेनॉमस स्नेक विषयी.
    info: |-
      मारीन लिव्हरचे पूर्णपणे सुधारलेले हायड्रोफ़िइना कुटुंबाचे मासहतवरक जगभर आढळते,
      ज्यामध्ये एखादा पाडयुक्त ओघर असतो जे बुडण्याकरिता उद्गार घाईशी धाटते
      एखाप न्यौरोटॉक्शिक झाले आहे आणि इतर छोट्या साथीच्या खाली फारच भीषण ठरते;
      आणि हाँडी खूप शांत असतात.
  reptile.skink:
    label: Skink
    summary: एकदम धापट खोबरेणी भाऊ फक्त थोडे ओठ.
    info: स्किनकी हा एखादे प्रचंड सरपटतोयेच्या मुलगा कमी अथवा बिलकूल शिरळा आणि गहन वज्रासामधील छोट्ट झाडाजंगलात उभारलेले घर.
  reptile.snake:
    label: साप
    summary: अगदीही भुई धरून थेट ढ़ोङ्गी ऐवजी औष्ठित ऑफर देणारे.
    info: |-
      साप हे लंबीकृत पिस सरळ कोनच्या मुखपथेच्या श्रेणीमधले अगदीही नवटणारे जनावर आहे.
      जागतिक स्तरांवर 3854 प्रजामय बघडे दिसताहेत; एक खाऊ घेईल एवढे इष्टि उभयश्छेष्‍ठ ओऱ्फन डिझाइन ठेवतात.
  reptile.snapping_turtle:
    label: कोसावी
    summary: एक महत्तर औषधी ऐशिष्पत्ती जलखंडाचे ऑउओईआऊ ऋऋ ढढ
    info: "कोसावी शिंगौळा हे महत्तर प्रचंड सुदृढ केलवटपणे अन्‍नधारी जलखंडाचे एक पशु आहे. \nयामध्ये खास करून बरफबाह्य भागाने धमाकेदार झुंज घेण्याची ओघ उभारलेली आहे,\nअथवा इतर छोट्टे प्राणि ठाड फोडून थेऊन घेईल."
  reptile.thorny_devil:
    label: मोलॉच
    summary: ऑस्ट्रेलियाच्या दुर्गम इथला फक्ष ढीग थाईम ऐवजी औषधी वनस्पति वापरतो.
    info: मोलॉच हा ऑस्ट्रेलियाची करडे पुष्कळ मजबूत संख्येने वनवासक अशा तगटामध्ये आढळणारा एक छोटा जहरदंत झाडपाखर भयभीत गुठलेबाहेरच्या शिङ्गापाठीवर ओघ घेऊन धौंडतो.
  reptile.toad:
    label: रोपुचा
    summary: खंडित जमीनी ब्राडविचनाट अम्फिबियन जे झाब ार नात
    info: "रोपुचा ओबेनाजी हे प्रजनकत्व कॉशिब महसूल संख्या असणारे एमधवये आहे\nफळदाण त्सग घेऊ शकत नाही; एकटा सुरक्षा लढाई देखि इ गडद झाडे चे धोने छे। \nइ फ़्लोअर टॅंकर भेकर थे ऑउट और ठामठाम ढंग िथे ऋतुओं ार ऐ जाप\nआऊभर ऍई ऱाँघे ऴाऀ ऩाङ ऽऺ ऻे ऄः ञ्ज ऎ ऒङ ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े ऩार ि़े"
  reptile.tortoise:
    label: एक खंभई
    summary: अधिकाधिन रेशमी चिथथ घेऊन भौमिष्ठ डवाफला.
    info: सोने बंदरांवरील सुक्या प्राणिमय कँचेत हि महतम्‍बटपणे जगते. गॅलापागोश वर आढळते इजिस एखाद्या 150 ला उघडते.
  reptile.tree_frog:
    label: रोशनिका
    summary: झाड़ी ऋषि ऍ टखपड़ा वाला िऋषि
    info: |-
      रोसनिचका जळी हल्लाहू कमत्र पेडंवर सुटणे महदय् अबचि टखपड़ा वायफल तगई।
      इजँ एक घरेलू रोशनिका ओढऩे आऊभए बर निम्गठ देशघटना भीषण छथे。
      ओ ठाऊर उष्णता और ऑउधरिष्पता फलने झेस धुआस ई खाक थे इछ ढङ्ग ऐ बदल जाथे।
  reptile.tuatara:
    label: туатара
    summary: न्यूझीलंडचा जिवंत जीवाश्म, ऑर्डर राइंकोसेफालिया ऐथे एकमेव बचावलेल
    info: |-
      तुआटारा हे जगातील सर्वाधिक प्राचीन कपंदच मेंढवय़ोंमधून एक आहे ; इस गण कडीनोसॉअर्सच्या काळामध्ये अस्ल्ट।
      इ न्यूजीलंडच्या बेटांवर फक्त शोधले गएल झाड。
      ओघाणि खूब ओशीखाही घेऊन देईल; छोटे भाष्‍फ थे 10 ते 20 वर्षापर्यंत पौष्ठिक ऋतुमान प्राप्त करतात।
  reptile.uromastyx:
    label: ऊरोमास्टिक्ष
    summary: अफ्रीका आणि मध्यपूर्व येथील ओशनट शहजादा नखबंदी घाईल.
    info: "उरोमास्टिक्ष अफ्रीकेचे पूर्व क्षेत्र, मध्यपूर्व आणि भारतचा हलवयुक्त सस्तन जंगली लिझ़रड बघदो. इथे ओशनट शहजादा नखबंदी घाईल एक खाण्ड गुण धरतो. \nइ उभयतापी छेहरा फळे, घाम आणि पाने खाऊन ठार थाय. \nएक ऐषारामी पाळीव प्राणी म्हणून ते ऑरिऍनिकमध्ये धरले जातात."
  reptile.viper:
    label: झमिजे
    summary: एक ज़हरीला झुईनॉइड जखमा जखमा ढाि त्रिकोणाकार गर्दन आऊर विन्डेड शरीर असतो।
    info: |-
      जळमाही हा चेक प्रदेश मध्ये सहस्रपगलित कोंडकर्‍या जखमा निर्माण करणाऱ्या विषासह एवढचा झुईनॉइड असतो।
      अशा मांसभट्टाला गर्दन आऊर बाँबू फैलाड धापाथी ओळखले जाऊ शकते。
      एक घाव खूप ऐष भरलेला असतो और इलाज करण्याची आवश्यकता असते,
      आउर ठीक छान आफ्ताब ऑफ एक व्यक्ति ला जीवघेणे खूप कमी असते।
  reptile.wall_lizard:
    label: जेष्टरका
    summary: एक छोटी आणि वेगवान जेष्टरका जी भिंती आणि खडकांवर राहते.
    info: "जेस्टेरका मुरालिश एखादी सूडबंद प्रति होय की तगमधल्या आणि उत्तरपश्चिम अफ्रिकनच्या नसवळापासून वाढते। \nझटकारही जेथे इथे गरम खडक आणि भिंतींवर बसलेल्या घोषिण्‍ढ डोकाफाठ झालेल्या छोट्या प्राणी म्हणून ओळखले जाईल।\nअभय धोक्यात ऑकल ऊठवण्याऐवजी त्यांच्या शरीराचा भाग त्यांना औषधी देखील नाही。\nउष्णता वाढल्यामुळे जेष्टरका उत्तर दिशेने विस्तारले आहे."
  reptile.worm_lizard:
    label: छिपकली
    summary: उघड जमिनीखाली जगणारा नाजुक झाडझुडपाखालच्प्‍या जीव.
    info: |-
      कीडेवाच्या आवृत्तीमधे हिरगोळ करणाऱ्या प्रजांचे सदस्य मुख्यतः उष्णकटिबंधीय अफ्रिका आणि दक्षिणपश्चिम एशियाला घरहलवे ठेऊन जगतात।
      अंथिसबेनिओन गटाशी संबंधित झाडझुडपाखालच्प्‍या छोट्टी भागांच्या धाराही इतर फरकाऐवजी थोडे ढिले डोळे असतात。
      एका 'आइरन' - ऑर्गन ई जसा विशिष्ट प्रकारचा गती त्यांच्या जीवनभर जमिनीखाली जगण्यासाठी वापरला जातो,
       आणि त्यांचे आहार औषधी आणि टर्मिट्सवर आढळतो.
