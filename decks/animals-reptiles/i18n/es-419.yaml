lang: es-419
pivot: false
title: Anfibios y anélidos
cards:
  reptile.chameleon:
    label: camaleón
    summary: Reptil arborícola que cambia de color y tiene ojos móviles.
    info: El camaleón emite cambios de color no para camuflarse, sino para comunicarse y regular su temperatura corporal. Sus ojos pueden moverse independientemente uno del otro.
  reptile.crocodile:
    label: cocodrilo
    summary: Reptil antiguo que vive cerca de ríos y pantanos.
    info: El cocodrilo del Nilo es uno de los reptiles más grandes del mundo. Vive en África y caza desde el agua. Tiene la mandíbula más fuerte de todos los animales vivos.
  reptile.frog:
    label: rana
    summary: Anfibio verde saltador con ojos rojos.
    info: La rana de ojo rojo es una rana anuro tropical de América Latina. Vive en las copas de los árboles, vuela gracias a membranas entre sus dedos y es activa durante la noche.
  reptile.gecko:
    label: géko
    summary: Pequeño lagarto capaz de escalar superficies verticales.
    info: El géko leopardo es un reptil popular en terrarios. Se mantiene sobre rocas y paredes gracias a millones de pelusas microscópicas en sus patas, no por pegamento.
  reptile.lizard:
    label: lagarto
    summary: Reptil de cuatro patas con escamas común en zonas cálidas.
    info: La iguana verde es un lagarto grande originario de América Central y del Sur. Se alimenta de plantas, es un excelente escalador y puede regenerar la parte cortada de su cola.
  reptile.salamander:
    label: salamandra
    summary: Anfibio con piel brillante y cola larga.
    info: La salamandra manchada es un anfibio protegido de Europa Central que tiene manchas amarillo-negras. Libera sustancias tóxicas por la piel y vive en bosques húmedos.
  reptile.snake:
    label: serpiente
    summary: Reptil alargado sin patas con cuerpo largo y flexible.
    info: Las serpientes son reptiles con cuerpos alargados y sin extremidades. Existen más de 3 700 especies; cazan usando el sentido del olfato (órgano Jacobson) y algunas son venenosas.
  reptile.tortoise:
    label: tortuga terrestre
    summary: Reptil lento con caparrosa carapa en tierra.
    info: La tortuga gigante es la mayor tortuga terrestre del mundo. Vive en las islas Galápagos y puede llegar a vivir más de 150 años. Su caparrosa forma parte de su esqueleto.
