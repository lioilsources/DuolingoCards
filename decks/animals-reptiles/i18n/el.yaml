lang: el
pivot: false
title: Πληγούντα και αμφίβια ζώα
cards:
  reptile.agama:
    label: Αγάμα
    summary: Πολύχρωμος λιβαδικός ψηλός
    info: Οι αγάμες είναι μεγαλύτερο γένος χηλωπών της Αφρικής και νότιου Ευρώπης που σχηματίζουν διάσπαρτα φθινοπωρινά βροδιά.
  reptile.alligator:
    label: Σαωρό
    summary: Μεγάλο φθήνο λιβυδοχελιδόνιο με βραχύ νότιο χείλο που ζει στις ΗΠΑ.
    info: Το αμερικάνικο σαουρό είναι ένας από τους δύο υφιστάμενους γένους πληγών· το μικρό κινεζικό σαυρό.
  reptile.anaconda:
    label: Ανακόντα
    summary: Το βαρύτερο σκώληξ στον κόσμο που ζει στις αμαζονικές λιβαδικές περιοχές.
    info: Η πράσινη αнакόντα είναι το βαρύτερο σκώληξ στο κόσμο· οι χήνες μπορούν να φθάσουν τα γυγέχωνδα διαβαζοντας λεπτομέρειες.
  reptile.anole:
    label: Ανόλι
    summary: Μικρό λιζάρδιο από τη Δύση.
    info: Το Anolis είναι γένος μικρών θηλαστικών από την περιοχή των νυμφών στους βάθη χωρίς κύβο διαγραμμισμένο φύλλο.
  reptile.axolotl:
    label: Αξολότλ
    summary: Μεξικανικό υδρόβιο σάμπως που διατηρεί τα λαρύθρια γνωρίσματα.
    info: Η αξολότλ είναι ένα υδρόβιο σάμπως που κυκλοφορεί μέση τη νεογέννησή - δηλαδή φυλάγει λαρύθρια γνώρισμα όπως τις εξωτερικές βράχιες σ' όλη τη ζωή του.
  reptile.basilisk:
    label: basilisko
    summary: Αμερικανικὴ εἰχνίδα ἱκανὴ νὰ τρέχῃ ἴσχυρα ἅμα ἢ πάνω ἂπ' τὴν επιφάνεια τῆς θάλασσα.
    info: Το Basilisk μπορεί να τρέχει πάνω από θηλυκή εξαιτίας δαγμώσεων ρύθμου και φυλλώδων σφυρῶν για λήψη αέρα βαθὺς ὑπὸ τὴν ζῆλῳ· Δὲν μπορεῖ νὰ τρέχῃ πᾶν 20 μέτρα πρὶν ἀπὸ τῷ βύθιζε. Τὸ ᾄρων ἔχει ῥᾳστῇ ṣῑβὼν ἐπὶ τῆς κεφαλῆς καὶ τῶν πλαϊνῶν· Για τὴν προστασία ἡ κρυπτικὴ ἰδιότητα ἦν ủν βασικὴ.
  reptile.boa_constrictor:
    label: Βασιλικό
    summary: Μεγάλο Δυτικοαμερικανικό ψεύτικο.
    info: Το βασιλικό σερπί είναι ένα μεγάλο αδημέτων χιουμβυχών δυτικής Αμερικής που καθιστά τη νύφη φονική λόγω της γλυκερής φύσης του.
  reptile.box_turtle:
    label: '"box turtle"'
    summary: Ελαφρύς χερσαϊκός χλωμόκηπος που μπορεί να κλείσει πλήρως μέσα στο carapace.
    info: '{"hint":"χερσαίος χλωμόκηπος που κλειδώνεται宣完全在其 carapace μέσα σ'' αυτή τη φθάγρα Τerrapene","info": "Η Box Turtle είναι βόρειο - νότια δύο γης χλωμόκηπος που μπορεί να κλειδώσει πλήρως το carapace λόγω της mobile front panel\nΖει σε δάση και λεκάνες ως solitary animal\nΜπορεί να ζήσει πάνω από 100 χρόνια· στη φύση φτάνει την ηλικία των 40–50 ετών\nΠροστατεύεται στις Ηνωμένες Πολιτείες και πολλά states απαγορεύουν τη συλλογή τους από τη φύση."'
  reptile.caecilian:
    label: χελιδόναμη
    summary: Απώ τροπικό οποΐον που μοιάζει με ξιφίδι.
    info: Το χελιδόναμη είναι έντρυω απώ του γένους Γύμνοφθάλμια που δε βγήκε καλά μελετημένο να σχηματίσει φυσικά λεβεντούσες στις τροπικές περιοχές. Δεν θυμίζει ιδιαίτερα ζιζανιά ή αξενόψαρο.
  reptile.caiman:
    label: caiman
    summary: Νοτιοαμερικανικό κρουκόδειλο ημιψύχρου
    info: Το caiman με πλαίσιο είναι το κρουκόδειλο ή σχετικά όμοιο φύσης από νότια δυτική Δωμάτιο γέφυρας βρώγχων λεβητοθάλαμος.Είναι μικρότερο από τους 'πραγματικούς' κρουκόδειλους· φτάνει σε μήκος μέχρι 2,5 μέτρα.
  reptile.chameleon:
    label: Xamailéontas
    summary: Eksafos me roz aneirosa xromatos stin epidermis tou gia thn ekthesi ton akton toy sto fwsis apo to enan pros ton allon.
    info: '{"hint":"χρωματιστός δενδρολίθικος εξάπου τύπου χαμαιλέοντα","info":"Ο Χαμαϊλέοντας από τη Γιβούτ λαμβάνει μεγαλύτερο ποσοστό φώτισης και συνήθως βρίσκεται γύρω από νερό.","label":"Χαμαΐλεοντας","summary":"Εξάφους με ροζ και λευκό ύφος."}'
  reptile.cobra:
    label: Κόμβα
    summary: Δηλητήριο ψηλό όπως το Naja.
    info: Η κόμβα είναι ένας δηλητήριο χελώνι του γένους Naja που φυσά μπρούμαγκα στο λαιμό αφ' υψωθεΐς να βγάζει «χαϊδεμένο».
  reptile.crocodile:
    label: κροκόδειλο
    summary: Παλαιόβιος ψυχραιμικός λεπίζων που ζει σε ποτάμια και υγροβιότοπους.
    info: '{"info":"Το κρокόδειλο του Νίλου είναι μία από τις πιο γυάλτσες χημέων σκύθες βγήχει να φώφει δρομολογικά.","label":"κροκόδειλο","summary":"Παλαιόβιος ψυχραιμικός λεπίζων που ζει σε ποτάμια και υγροβιότοπους."}'
  reptile.flying_dragon:
    label: Δράκος
    summary: Μικρό νοτιοανατολικοασιατικό ζῷο.
    info: To Draco πτερούμενο είναι μικρό θηλαστικό από τη νοτιοδυτική Ασία και διέγχει σωληνώς χάρη σε φουσκωτή βλεφαροειδή λωρίδα γεμάτη από τους εξελιγμένους ριβοϊζούς.
  reptile.frilled_lizard:
    label: Αγάμα
    summary: Εφηβικό είδος που ανοίγει θεαματικό λαικό.
    info: Η αγάμα με το λαικό είναι έντρυπο πλησιάζων σώμα χαραχτήρις δέρμα γύρω από του κρου ν' ανοίξει όταν βρίσκεται σε κίνδυνο ως φθόνιμο σήμα.
  reptile.frog:
    label: βρυχαδάκι
    summary: Γρασιάς νυχτερινός θαλάσσιος µε κόκκινα µάτια.
    info: '{"hint":"λεία ζωογόνη που αμπέλισται και βρυχάζει (τάξης των χήνων)","info":"Η Listovnice červenooká είναι μια λατινοαμερικανική νύφη στρώμα γνωστή για τη δραστηριότητά της φθινοπωρινά.","label":"βρυχαδάκι","summary":"Πράσινος νυχτερινός οβιΐζιβλος με κόκκινα μάτια."}'
  reptile.gecko:
    label: Γέκον
    summary: Ψηλοπατούμενο θηλαστικό που μπορεί να περπατά σε κατακόρυφες επιφάνειες.
    info: '{"hint":"μικρό σαλαγδάτο χερσαιμένο με λυπηρή πίουν αφρώδως ιζύθρα το δάχτυλο( είδος Geckonidae)","info": "Το γέκον καβάλος είναι φιλοξενούμενο πλάσμα στο ντερμπέρι. Δεν βασίζεται στην κόλλα , αλλά σ'' εκατομμύρια μικροσκοπικά τρίχια στα πόδια του για να περπατά σε πέτρες και τοίχους .","label": "Γέκον", "summary": "Πολύ μικρό ψηλοπατούμενο ζῷο."}'
  reptile.gharial:
    label: Γαβιάλ
    summary: Κροκόδεμο με εξαιρετικά στενό φρύγανα που ειδικεύεται στα ψάρια.
    info: "Το γαβιάλ είναι ένα κροκόδεμο από την περιοχή του Γάγγεως με χαρακτηριστικώς πολύ μακρυό και σφιχτό φρύγανα διαμορφωμένο να λовάψει ψάρια. \nΟι αρσενικοί άτομα έχουν βλαστώματα ('ghar') στην κορυφή του φρύγανα\nΕίναι εξαιρετικά επιζήμιο· ζει μόνο στους ποταμούς της βόρειας Νότιας Ασίας."
  reptile.gila_monster:
    label: Γυψώδης
    summary: Δηλητηριαχέ παχύ με γυψώδη φθορά.
    info: Το Heloderm του Γιλα είναι ένα από τα λίγα δηλητήρια χελωνάκι στο κόσμο.
  reptile.glass_lizard:
    label: Σπάθυλο
    summary: Αμφίβληστρα χωρίς πόδια, παρ' ως και να μην είναι φίδι;Έχει κινητά βλέφαρα.
    info: Το Slepýš είναι μια αμφίβληστρα χωρίς πόδια του Ευγενές σπάθυλο και δύσκολα γίνεται να λήψεις το φίδι· Διαχωρίζεται από τα φίδια με βάση τα κινητά του βλέφαρα και τα αυτιά του · Για να προστατευτεί , μπορεί να απώλεια την ουρά του ;Η Ουρά του αναπτύσσεται ξανά .Είναι προστατευμένο από νόμο στην Τσεχία και εξαπλώνεται σε δασικά και αγροτικά βιότοπα.
  reptile.hawksbill_turtle:
    label: Καρέτκα
    summary: Πολύ σπάνια οδοντωτή ζώντα.
    info: Η καρέτκα είναι μια πολύ σπάνια θαλάσσια χελώνη του γένους Eretmochelys. Το φυλλωμένο δόγχινής αξιοθαύμαστα λεβιοθάνια να βρεθεί.
  reptile.horned_lizard:
    label: Φρυνοσώματιδης
    summary: Λέζιδες με σπινθῆρες από τις αμερικανικές ερήμους.
    info: |-
      Η Φρυνοσώματιδης είναι μικρό σπινθήρων ψεύτικο λέζι που βγάλε τα αφρικανικά και νότια δυτικά των ΗΠΑ και του Μεξικού·
      Σε περίπτωση κινδύνου για τη ζωή του φαίνεται να εκχύνει αίμα από τα μάτια του σε απόσταση πάνω από ένα μέτρο,
      Είναι αβολιστικός και εξαρτάται από την καμουφλάζ.
  reptile.iguana:
    label: '"chlorus leguanas"'
    summary: '"Μεγάλο πράσινο καβαλλίδιo της βόρειας Αμερικής με ακανθωτό σπινθηριακό."'
    info: '{"hint":"μεγάλος φυτόφαγος θηλαστικό μπρουνίδι απ'' τη νύχι πέτρα όψη εξωθήλιο σώμα","info":"Το Iguanidae chlorus είναι καβαλλίδιo βόρειας Αμερικής γεμάτο λάζο δύο μέτρα\nΈχει τρίτο μάτι στην κορυφή (παριεταλικό μάτι), ευαίσθητο στις αλλαγές φωτεινότητας\nΕίναι κοινωνικό· Δείχνει ιεραρχία δύναμης με πίεση κεφαλής & χρωματικές αλλαγές \"Σώμα\"\nΠροϊόν απειλής είναι η απώλεια φυσικού περιβάλλοντος · Για τον ζωοτροφείο είναι αγρευτικός"'
  reptile.king_snake:
    label: Κρατικό σέπε
    summary: Αμερικάνικο non-toxin υψηλότερο που είναι ανθεκτικό στο venom των βαθμονιχτών.
    info: "Το Κρατικό σέπε είναι μη δηλητήριο αμερικάνικο χωρίς τύφλου που φάγε και νευριστικών γεύσεων , συμπεριλαμβανομένων των βαθμονιχτών, στα οποία είναι αδιάρρητο .\nΗ ροζέτα του ( λευκό - μαύρο ) μιμείται το νευριστικό ψαράκι . \nΕίναι σημαντικός όρος για τις πληθυσμούς των ποντικιών, πτηνών και αμφιβίων.\nΔημοφιλές εξωτικό ζώο λόγω της ήρεμης φύσης."
  reptile.komodo_dragon:
    label: ΚΟΜΩΔΕΣ
    summary: Πρόκειται για το μεγαλύτερο ιχθύϊκό ον που χρησιμοποιεί τον Ινδονησιακό νησίδα Γιαβα.
    info: Το κόμωδες είναι το μεγαλύτερο ζώο που υπάρχει σήμερα από τη φυλή Varanidae, διαστέλλοντας για λεφθά ναξικά βαζίνα και βάρος πάνω από 70 κιλά.
  reptile.leatherback_turtle:
    label: Λερχύλις
    summary: Το μεγαλύτερο ψαροξύθο με δερµατικό νώτιο µεταξύ σκληρών πλακών.
    info: Η λεπίδοτα Λέρχυλις είναι το μεγαλύτερο χελωνόκηπο στο κόσμο φθάνοντας πάνω από δύο μέτρα σε μήκος και βάζουν πάνω από 700 κιλά. Δεν έχει σκληρό γαλβανισμένο νώτιο πλάγιο, αλλά δέρμα εφοδιασμένο με μικρά οστά (osteoederms). Μεταναστεύει τεράστιες αποστάσεις πάνω απ' τα ωκεανά· η μετανάστευση που καταγράφεται φθάνει τα 16.000 χιλιόμετρα.
  reptile.lizard:
    label: '"Σαῦρος"'
    summary: '"Τετραποδικό ἀθρακῶπος ᾠῳδὸς ἐμφανὴς ἔμπνευση ἡλιόφθορος"'
    info: '{"hint":"κλίματος","info":"Η πράσινη αγχωπόδα είναι ένα μεγάλο σαυρό του νότιου και βόρεου χώρου της Δύσης. Τρέφεται με φυτά, δεξιόβημο για λήψη ύψους και μπορεί να αναπαράγει το κομβώδες τμήμα της ουράς."}'
  reptile.mamba:
    label: black cobra
    summary: Γρήγορος υψηλός βιβασμένος ολιβεϊκός δαιτίδα.
    info: '{"hint":"Γρήγορη υπερβιβασμένη Αφρικάνικη δαιτίδα με πλουθωρό αυξημένο σώμα","info":"Η καύχος είναι μία από τις γρηγορότερες και βιβασμένες φίδια στον κόσμο\u202f; \"Φτάνει σε ταχύτητα πάνω από 20km\/ora στο έδαφος και να λαμβάνει πάνω από τα δέντρα\u202f;. To νευροτοξικό του βιβασμένο χωρίς αντισώματα προκαλεί θάνατο σε ώρες\u202f;. Το όνομα black cobra προέρχεται από το ρυθμό του εσωτερικού της στοματικής, όχι από το χρώμα του σώματος (που είναι γκρι ή olive)\", "label": "cobia", "summary": "Σύντομος ψηλός βιβασμένος ιταλικός δαιτίδα."}'
  reptile.matamata:
    label: Ματάματα
    summary: Φερύγως χαρακτηριστική νεχυλώδης υδρόβια ζώντα που μιμείται φύλλα.
    info: |-
      Η ματάματα είναι ένα από τα πιο φερύγως ψηφισμένα νεχυλώδη κρουστά στο νοτιοανατολικό τμήμα της Δυτικής Ήμβρος
      Το γαϊδούρι της δε βγάζει λεξίγραψτα - αντ' αυτού, ανοίγει τεράστια στόμα, σύρει νερό με την θηραμαΐα και το κλείνει.
  reptile.monitor_lizard:
    label: βαράνι
    summary: Μεγάλη ενεργός προϊδρική ψαλλίδα.
    info: Το βαράνι είναι μεγάλη χτένωπή του γένους Βαράνος που διαθέτει αφυδρό και σχισμώδες φύλλο, λειτουργούντα ως νύξη. Το Komodo baranias είναι το μεγαλύτερο ζῶο που θὰ ὑπῆρχε (μῆκος πάνω απὸ 3 μ.)· τα βαρανιὲς εἶναι νοῦς, καὶ οἱ ἐπιστᾶμες κατέγραψαν τὴν χρῆση αἰτιολογικῶν ᾧν.
  reptile.mud_turtle:
    label: Πλαϊστική χελώνα
    summary: Ένας μικρός αμερικανικός ωκεανικός ψυχρό από τη Σεβαστιανίδα
    info: |-
      Οι χελώνες Kinosternon είναι μικρές θαλάσσιο - πηδήμων από τη βόρεια και ντου γύρω σχεδόν 15cm
      Αυξάνουν δυνατό φθόγγο από τις μυρωδιάζουσα λάφυρα όταν απειλούνται,
      Μπορούν να περάσουν την ξηρασία καβαλισμένες στο λάσπη και να υπνοψιαστούν.
  reptile.mudskipper:
    label: perioftálmos
    summary: Ψάρι που περπατά στην ξηρά και ανεβαίνει σε δέντρα χάρη στα πλευρικά πτερύγια.
    info: |-
      Το Periophtalmus είναι ψάρι από τη θαλάσσια φυλή γκουβιών που στέλνει μεγάλο κομβωδύς δρόμο νερού.
      Περπατά λιθοχαλμό βοηθημένο από εξεζησμένα πλευρικά πτερύγια,
      ψυχραιμίζει μέσω της υγρής επιφάνειας και μπορεί να ανεβαίνει σε ρίζες μανγρόβιων
      Στο πλάτος του καταλαμβάνει εδάφη και εκτελεί εντυπωσιακές επιδείξεις.
  reptile.newt:
    label: newt
    summary: A small tailed amphibian living both underwater and land.
    info: '{"hint":"μικρό ημίυδατο σάλπιγξ με επίπεδη κουνιστή ράχη","info":{"label":"Salamandra","summary":"Πού τζένως παι δ'' αφρώ για να βρεθεί φτερωτό;\"\r\nThe large newt is the largest central European newt growing to lengths over 15cm\. During breeding season males display distinctive crests like snakes on their backs\. In the Czech Republic all species of newts are protected by law\. They spend winter under tree roots or burrows out of water."}'
  reptile.poison_dart_frog:
    label: Πραλεσνιτςκα
    summary: Μικρή φθαρματώδης λύγα γνωστή για τον εξαιρετικό της ρόλο.
    info: Η πραλεσνιτςκα είναι μικρό χάμο της οικογένειας Δενδροβάτιδων απ' όπου κυκλοφορεί στα δάση της νότιας και βόρειας Γιουχάνας.
  reptile.python:
    label: Πύθων
    summary: Μεγάλος μη δηλητηριαστικός ίχνος που σκοτώνει την νωδρέψει ασφυξώντας.
    info: Οι πύθονες είναι τα μεγαλύτερα σκάμπη ασφυξώντας και όχι ξηρόβους δηλητήριο· γδύνουν νωδρέψεις λαιμό και φαγούρα. Διαθέτουν θερμικούς αισθητήρες – «ϊνφρακό» - που βοηθούν να εντοπίζουν ζῷα με οργανική θερμότητα ακόμη και σ’ απολύτως σκοτεινές συνθήκες.
  reptile.rattlesnake:
    label: '"Φόνιψ"'
    summary: Δηλητήριος ψύλλος με κουπάσ στο έλεος των αυχένων.
    info: '{"hint":"δηλητήριο χείμαρρος με κουπάσ στο άκρο των αυχένων που λειτουργεί ως εξώφθαλμος δύσβατος","info":"Ο φόνιψ βρίσκεται στη γενιά Crotalus και είναι νεφελιζόντιος ψύλλος με εξώφθαλμο δύσβατο στο έλεος των αυχένων\"Εκείνος ο δύσβατος είναι σχηματισμένος από απορροφημένα στρώματα και όταν απειληθεί υποδεικνύει την απειλή\"Έχει θερμικούς αισθητήρες(θηλές), που του επιτρέπουν να ανιχνεύει ζεστά ιχνηλάτα ακόμα και στο σκοτάδι\"Η δηλητηριασία του απαιτεί ίσως αμέσως ηλεκτρική ή ξενική προστασία."}'
  reptile.salamander:
    label: mlok
    summary: Οξύ γλυκό φυτό.
    info: '{"hint":"oδηγία","info":"Το mlok εμφανίζεται συχνά με λουστρό κι υπολεύθερο έως πολύ ακατέργαστο δέρμα.","label":"mlok","summary":"Πλήρως νερόβιο τριχώματος."}'
  reptile.sea_snake:
    label: Θαλάσιο σκύμνη
    summary: Εξειδικευμένο σκύμνη για ξηρό ή άλλο
    info: "Το θαλάσιο σκύμνη είναι μια τρυπερή χτένως από τη φυλή Hydrophiidae που βγήκε καθώς διαβίζει για να ζήσει στη Θάλασσα\nΈχει λεπτό , πλαϊνό ουρά για να πλεύσει \nΗ δηλητηρίαση του είναι νευροδηλητηριαστική και πολύ πιο ισχυρή από την κοφτερή· αλλά τα σκύμνη είναι πολύ ειρηνικά"
  reptile.skink:
    label: Σκίνκ
    summary: Χτύπος με λεία λαμπερά πλοΐα και μικρά πόδια.
    info: Τα σκίνκι είναι μεγάλη οικογένεια χτυπωδών που αριθμούν τόσο και λίγο πάνω από δεξιά φυλής γεμάτες νεφέλια βλεχρά και περιβάζουν τα κυκλοειδή τους πλοϊκά.
  reptile.snake:
    label: Σαμπάνα
    summary: Πλήγμα για να φράξεις βρώμικο νερό.
    info: Οι σαμπάνες είναι έλυτρο με κοφτό τύβου που δεν ακονίζεται ως λέχθωση.
  reptile.snapping_turtle:
    label: Κουστική χελώνα
    summary: Μεγάλη αгресивная υδατόφιλη Амерιканская челявка с мощными челюстями.
    info: Η κουστική χελώνα είναι μια πούργωπόδη Αμερικάνικη τέφρα αλυς σχεδόν βαθμωτή δίνει να φαΐ για λεβεντούλες.
  reptile.thorny_devil:
    label: Μολόχ
    summary: Αυστραλιανός βάφρος με ακίδες.
    info: Το Moloch με τις ακίδες είναι ένα πλησμωτό κρυάγου σήπιο υψώματος δέχεται νύξη για λεπτοϊδρική φθορά.
  reptile.toad:
    label: Τρυγόνη
    summary: Σχετικό του ράκου µε βρύξες.
    info: Η Τρυγόνη είναι το πιο διαδεμέντο χλωράκι στην Επικράτεια και μεταφέρουν αβύσθις για να φτάσουν στα λίμνα για αναπαραγωγή· βοηθώντας τα πεζοπόροι στη Γερμανία.
  reptile.tortoise:
    label: '"land turtle"'
    summary: '"Πολύ βραδύ πλαϊσιασμένο με κρουνύριο που ζει στην ξηρά"'
    info: '{"info":"Η χελώνη των γκατού είναι η μεγαλύτερη σπουδασμένη πιάτα αυτής της κόσμου. Διαβιώνει στις Γαλάπαγκος και διαζευχθεί να φτάσει τα 150 όφελος. Το κρουνύριο είναι μέρος του λεμφικού της."}'
  reptile.tree_frog:
    label: Ροζίτσα
    summary: Συμπλεγόντως αφών με κοχύλιδες στα δάχτυλα.
    info: Η Πράσινη ροζίτσα είναι μικρή συμπλεγόντως αφών που φέρει κοχύλιδες για να τραβιέται σε λεία δάπεδα· βρίσκεται στην οικογένεια Hylidae.
  reptile.tuatara:
    label: tauata
    summary: Νεζηλανδικός 'Ζωντανός από την εποχή', μόνος επιβιών
    info: Η τουάταρα είναι ένος από τους πιο παλιές χελωνώφθημες στο κόσμο· το γένος της διήνυγε μέχρι να βρεθεί λύση στα φυτά. Διαβιώνει μόνο στα νησιά της Νέας Ζηλανδίας. Αναπτύσσεται ακριβώς πολύ αργά · γίνεται εξ’ ολού Γεννητός μόνο σε ηλικία 5–7 ετών.
  reptile.uromastyx:
    label: uromastix
    summary: Περιβότη χλωμάδι με ακαντωτό ουρά από την Άφρικα.
    info: Το Uromastyx είναι ένα περιβότη χλωμάδι από τη βόρεια Αφρική και τους γύρω μέχρι να συγκαταλεγθεί δισών φυτοφάγος, τρέφεται με λουλούδια, σπόρους και φύλλα. Διατηρείται σε θεραρίουμ ως εξωτικό σκύλος.
  reptile.viper:
    label: Χρυσοπίτα
    summary: Δηλητηριασμένος σκύλος με τριγωνικό κεφάλι.
    info: Η Χρυσοπίτα είναι το μόνιμο δηλητήριο σκύλος που υπάρχει φυσικά αυθεντικά στη Γερμανία και γνωρίζεται λόγω του καμβέρδου ντούφου στο βάρος της και των αξιών της.
  reptile.wall_lizard:
    label: Σκάλα τοίχου
    summary: Πολύ λεπτή και γρήγορη σκάλα που ζει σε τοίχους.
    info: Η σκάλα τοίχου εμφανίζεται από νότια Ευρώπη και βορειοδύση Αφρικής ως μέγεθος που φτάνει για δωμάτια λόγω της θερμοκρασίας σε ζεστές πετρώδεις περιοχές και τοίχους.
  reptile.worm_lizard:
    label: Σκώλητρο
    summary: Άποδας ραχιαίος πάσχας με εμφάνιση σκώλητρα
    info: "Τα σκώλητροειδή είναι λιγότερο μελετημένα άποδα πάσχα απ' τη γενετική υποομάδα των Aφθυβαινιών και βρίσκους τα δύο φυσικά νότια της Γης - στη Δύση και Νότο\nΦαίνονται σαν μεγάλα σκώλητρα·Έχουν κομβώδη δέρμα και εξεζητημένα μάτια,\nΖουν όλη τη ζωή τους κάτω από το έδαφος και τρέφονται με σκωλήτες και \nΚινούνται με χαρακτηριστικό τρόπο «ακορντεόν»."
