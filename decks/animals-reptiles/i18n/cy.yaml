lang: cy
pivot: false
title: Ynysyddion ac Obygyddwyr
cards:
  reptile.agama:
    label: agama
    summary: Rhew hefyd 'afal'
    info: Mae Agamia'n rhodfa'r afal yn grefydd o fewn yr Unol Daleithawd i Ewrop ar gyfer y siopau ac mwy na dair cant nodweddiad sy'ch chi all fynnu.
  reptile.alligator:
    label: aligators
    summary: Crocodile megri â chroes glân yn bygwtho Yr Unol Daleithiau a Tsieina.
    info: Mae Aligator Americanaidd yn un o'r dwy ryw sy'n yfed ar grynhoedd heddiwydd nhedlaethau pen wythnos cynharach i'nhynny - yr ail fath amryws ei hun rhag Chinea. Mae weddillion gwahanol gan krikodylliaid fel eich bod chi'n dod ag anafael wnael ac nad ydynt yn cydnabodi eu llifogydd pan fyddant yn cau'u llygred. Mewn natur yn bygythio cymylau, afonydd a lynnod de-chweil Cuntries Unys.
  reptile.anaconda:
    label: ananconda
    summary: Siarad gwirioneddoli erthyliadau Amzon naill ai barod.
    info: |-
      Mae Anakena Gwyrdd yn sgarabed fwyaf y byd gan yr enillion sy'n cyrru dros rhagfyr o'r unigolyn Eunectes murinus;
      wedi'u gwaith mewn brynau ac afonau Tropiwlaidd Cymru Barbar,
      methu ar eu llifogydd gyda phrydyntiau, cefndiroedd, capybariaid a chaymanydd
      ac maen nhw'n anifeiliau fydoledig.
  reptile.anole:
    label: anoleg
    summary: Ysgawn fach ryngweledig o America' cannofo ethaetho
    info: |-
      Mae Anolys yn genedig o ysgawnder rhag absoliwch Americanaidd â gystadleithiau hyd at 400 nodweddiad
      Cynffydau'r wladfaen nhw'n eu dewlap - un cyseinedd ar eu llafn sydd wedi'u defnyddio i symudiadaeth ac amserion cymunedecthwyth gyda pherthinwen,
      Gall Llafn Eglur ddod dan fygythiad gan ei newid rhag glas i ôs yn dibynnu ar tymperaturedd a chroesoedd.
  reptile.axolotl:
    label: Axioltwl
    summary: Cymrydd Mecksioc nad yw'n datgano ethedigaeth llarfann
    info: |-
      Mae Axolotl yn ymladdwr dŵr o Mecsico sy'n cynhyrchu neotheniaeth felly fe'w chwalennir at nodweddiadau llarffan gyfan yr bywyd gan gynnwys grilau allanol
      Ydy e wedi'i wnaio'r llynfydd ar draws Dinas Mechsyco ac maes ei phenhaent yn cael ei heintyno dan fygythiad cryf am ddifrodion
      Gadewch chi iddo credu cyflwr adfer rhag absoliwerthedd - gallai redeg gwaelodfeddiau, rhan o sercwm neu mychod
  reptile.basilisk:
    label: chwarael
    summary: Jeştėr gan America sy'n gallu brynhoedi ar hyd
    info: Chwarael y Lys ar Dŵr (Llys Jesus Crist), mae'n gallu taro'r llifogydd o hyd yn natïol trwy ei grwmiau gogwyn sy'nhwylau hevyra dan yr awyr i ddod â chymaint rhagofio. Gall e fynd am odrych o filmetru cyn iddo feithrin. Mae capel enillion ar ben ac ar waelodion pen drud ag emyn nhrawdd.
  reptile.boa_constrictor:
    label: boa
    summary: Had absoliwitau amerycangen y De sy'n llygrededd at ei brynthawn.
    info: Mae Boa'r gogwyddwr yn rhag absoliwitau amerycan y de fawr ac anafodol. Mae'n lladd ei brynhawn tr'yn cael eu cywilyb i gyrru arnynt a'u cysylltu ag eich hofalus erthyliad syth bob tro - gan ddweud nad oes modd iddynt fynd dan yr un nodweddiadaeth. Mewn naturiad rydyn nhw'n poblogiwch weithgarion trydanig ondat heb dorri.
  reptile.box_turtle:
    label: troselin bont
    summary: Troselin llychlyn na all fe fynd llantrith olwg.
    info: Y'r yw'r troselin fach yn neimio arnoch America gan yr unigolyn sydd hefyd yn gallu cau ei grymyl gyfan gwyrth ryngweithred rhagoredwy ddodweddiad hir dros 100 o flynyddoedd ond dim nodiant am danau'n naturiol nesa i 60.
  reptile.caecilian:
    label: gimrodd
    summary: Obydd ambiwedig trogedig heb nosau fel cynfforddfad.
    info: Cynfforddffod yw'r gymroddwr yn rhag absenolwg noethau ac mae'n bygythiadu ar waelod tir trwyddedig. Mae ei unithion sylfaen nhwit i'ch gilymau neu nodfed ddaeargar. Mabwedd pen drud ag anifeiliau sydd â chynteyoedd (organau disg) ar ben eu corffiau.
  reptile.caiman:
    label: cymal
    summary: Crocomil sydd yn barhaus tu ôl i'ch gilydd
    info: Mae Cymal yn y rhywlas mwyaf o'r crikodyllau ar Ddaear Lysawd Gorllewin America. Mae'n fyrach na criwg rhagynir gwirioneddol ac efallai ei bod am dair metro gyfan i hyrfaethiad. Mabwyliaf gan Rio Paraguay at Rio Orinoco.
  reptile.chameleon:
    label: '"Giamwel"'
    summary: '"Ystâg sy''n newid liwt llanor â''i ochrau agored."'
    info: '{"info":"Mae chiamwelydd ymenach yn newid lliwt er hyd yn dda hefyd i weithredu ac amseru''r haelwr. Mwy cafodd ei hun rhag gweledigedd ond ar gyfer cysonhad cymunedol."}'
  reptile.cobra:
    label: Cobr
    summary: Aderydd gyda phodel pen hoffebwl a'i feinogydd ffaith
    info: "Mae cobr yn aderydd unigol gan y tebygfa elapidau sy'n gwybod am ddifrod rhaglennu'r llygredd i ffurfio capel wrth weithredu ar ei hun dan fygythiad neu anafriad\n Mae'ch neuroffaintiaeth chi wedyn yn atal system yr awyrgochion \nDyma nodweddiadol eich gwirnod mewn Ciprid Egipt ac India hefyd"
  reptile.crocodile:
    label: '"croc"'
    summary: '"Rhewyn pen drud syfy mynychai rhyng noderiaeth a phaenestri er hyd yn ddim crocodile."'
    info: '{"info":"Mae krokodiyl Nil yn un o''r rhewyn fwyaf mawr y byd. Mae''n fyw ar Afrika ac yn luniadu oddi noddi. Eddych chi ei ghefnau sy''nfy nhedfan i bob dyfrod."}'
  reptile.flying_dragon:
    label: drac
    summary: Ještěra sy'n defnyddio crwm erthyliol ar rybriau wedi'u wydreiddio.
    info: Mae'r drac yn ffrwydro rhag gwestai i wneud y profesiwn hynny oheredd ei grwm ar gyfer cyrraedd llefydd neu heintio gan ddifrodwyr.
  reptile.frilled_lizard:
    label: agama lim
    summary: Aderyn llec rydyn nhw'n dorri'nt amdanynnau trwm ac maethion dan eu dwy ochrog.
    info: Mae agamau'r lym yn adar yw gwestai Australia sydd â chlyffwr (clywedig ar hydrefnod yr henwythnos) sy'n dod i olwg fel sylfaen rhew hefyd pan ddifrodir o ran dilynwyr. Mae'n fyrru gyda'u llawer nodweddiadol felly mewn ffurfiad dyngasoriaidd miniaturiol. Yn ei normaleg nid oes clyfliadau wedyn.
  reptile.frog:
    label: amphib
    summary: Amfibiaidd glas sy'ch ef i drosglwyfo gyda dwyo cochion.
    info: Mae'r Listyn Ceryddig yn amfibio trwy groesi y Tropau ganbarth Lathin America. Mae'n fyw ar dorri ddrudfedd ac mae wedi'u gweithredu druthus.
  reptile.gecko:
    label: Geck
    summary: Ywrol bysgig ag anhrefnydd clwb cwareli.
    info: Mae'r gecko leopard yn ywrol rhag abseddi ar gyfer teithriau tyn nhadaethol. Mae ganddo miliwn o fechaniau microscof ar beni ei liwtroedd sy'n cynorthwyio i'w symudiad dros waelodfa ac allfor.
  reptile.gharial:
    label: cawal
    summary: Rhewygwr rhewogydd cysones at frwydrau.
    info: Mae gafial yn gywraig rhew hefyd o India sydd â chynffon hyfgrych ac agored y mae wedi'i feithrin i geisio ar ffrwydroedd. Mae'r wlywdion yn cael eu nodi am ddwyn grugau 'ghar' ar ben cynffin nhw. Mewn naturiad ciritigol dyma e chi ei weled yn yr unig rhes penfenthyrnogiaeth yn nhrefo'n erthyliadau Gogledd Asia.
  reptile.gila_monster:
    label: giliwr
    summary: Rhewynaeth dywyll ac anaml â llanror peniarach gan yr Orllewin Canolog America.
    info: Gilydd Helodera (Corytophanes cristatus), sy'n un o'r rhewynion gelydgar y byd yn gywiriant i'w tân dromorolig ar wael na pherthnasau eraill.
  reptile.glass_lizard:
    label: sluwff
    summary: Aderydd heb nodfed ond ni'ch dynnu tyndir - maen nhymhoed nosfetaeth.
    info: Mae Slewff y Cynt yn aderydd an-nofio sy'n dod o'r un arwyneb â thynnythau ac mae wedi'u caniatàd gan gyfreithlon rhagorol dros Gymru boblogaidd yn tirwyseddau gogleddig hefyd.
  reptile.hawksbill_turtle:
    label: crawl
    summary: Adar môr criwtigaethus â chynhwyslin lliŵg.
    info: Mae Karetka praw yn adar môr sydd wedi dod o'r teulu Eretmochelys ac mae'n yw cyflwr crythigol ar gyfer ei phwyllfa. Roedd grawn ei groesi dros dro fel allfor i geffylau, felly roedden nhymheithredu heb ddod rhag anafu poblion pen drud am gymalau corredigion. Mae hi'n brynu ethlydiadau moroedirol gan fydoedd coral.
  reptile.horned_lizard:
    label: eithin rhodda
    summary: Eithin rhagosell ar yr ochryniau Cymreiddiol gydag olwynnaedd ar ben.
    info: Mae Phrynosoma yn eithin rhaglennig sydd mewn dywyllion y de-gogle-ddwyrain Unedau Gyntaeth America ac i'r Mecsico. Wrth ei gwrando all fynnyru crym cynnar dros un meter gan fy merch fel cydran barhaus.
  reptile.iguana:
    label: legoan gwyrdd
    summary: Cryadwr cwbllynrheweg ar gyfer ambylyriannod gan America'r Trophau â grwm ddifrif.
    info: Legoan Gwyrdd yw cryfadwr gynffith rhewgol o'r Tropau America sy'n cyrraedd hyd at dwi ryddfeddi yn eu tywyllion naturiol.
  reptile.king_snake:
    label: had kràlowyski
    summary: Aderydd Americanaidd nad yw'n edwynus i Jad Chrestes
    info: |-
      Mae Had Králofski yn aderydd an-jadwy o'r Unol Daleithiau yw'n galluo'u cymryd gwasg ar ddigon rhag absoli i'ch bodlau nhw - gan gynnig atebion cymeriad am eu dadfforddi
       Mae ei wneud (llini enillion du-goch) yn copio uniant ryblyth corall,
      yw wedyn nodweddu modfeddynt ac eiddiniaid.
  reptile.komodo_dragon:
    label: llawdra
    summary: Rhewelwr trydyntaidd sydd yn dod o Indoneisia ac maeth yn dibynnu ar geiriau eraill.
    info: Mae'r llawdran yn y rhewyn fwyaf ar gyfer bygythiad gan ddod o hyd at ei gilydd mewn tân neu'n dilyn eu cymorth i'w gofnodi am reswm penillion sydd wedi'u cymeradwy dan fybyniadau.
  reptile.leatherback_turtle:
    label: llinelli
    summary: Rhaid fach â llifogydd llethredol yn gynnyrodig
    info: Llinell y Karetwr Mawr yn rhai'r llynedd mwyaf ar y byd gan gyrraeth dros dwy fetra ac hygyrchiant i rhywion saith cant chwil.
  reptile.lizard:
    label: '"Igwan"'
    summary: '"Plas drafftodgar ar wydr yn gyffredin yn ardaloedd dyfryn"'
    info: '{"info":"Mae Iguana Gwyrdd yn ffrwydro o Ddeithio ac America Delwedd sy''n ei chymryd gan olwynau grefyddol ynddo. Mae wedi''i heintiau''r tŷ plantoedd, mae hi''n gorlefedig i ddynladd rhag anafriadaeth."'
  reptile.mamba:
    label: mbama
    summary: Aderydd go iawn sy'n ddynodol am afrikanaidd
    info: |-
      Yw Mabma Goch yn un o'r adar rhagoraf ac ynddi fwyaf hefyd ar gyfer ei feithrin.
      Gall cyrraedd piciad dros 20km / h ar fydrfaethau a gall wneud cloddiau druo ar glynforion.
  reptile.matamata:
    label: matamata
    summary: Ffyrdd bizarn gan America Barbar na'n copio'r tywyll.
    info: Mae'r matamata yn un o'r ffyrdd mwyaf bizarn yng nghefn gwledig yr Aimerica Fawr Drithronol. Mae ei gryno ac euclw ar wahân i'w nodi'n copio cymeriad rhew hefyd at liwtiau dywyll a pherthnasau sydd wedyn nhw chi'n camouflâu effaith pen drud. Nid ydynt yn cymylu beth rydych chi'n chweil amdanynnwch chi eich dannedigaeth - byddant yn agored'u geirionedd ddifrifach, yn tynnu llygred gyda llai dan fynd â'i bobloglwr.
  reptile.monitor_lizard:
    label: varan
    summary: Ystâg cryf ryng weithredydd cynhyrchol gan grwm.
    info: Mae'r varan yn ystâg fawr o rym yr uned rhagweddol sydd â heinfforddi dychmygu ar gyfer gwylio am egniwlau bygythiad. Mae'n defnyddio ei liwf ddifrod wedyn i geisio clywed am dan y llithrig ac mewn tân neu wasgarion. Mewnbwn nhom niweidig eu cydran.
  reptile.mud_turtle:
    label: platif
    summary: Tynffydd sylfaendrig Siambr Americanaidd
    info: Mae'r blâtifau yn ymchwil am Kinosternon o fewn yr Unol Daleithiau ac Mwlgaria ar draws cymru rhagor i'ch enw gwreiddiol 'blatiff'. Pe byddant yn gogwybod eu hun dan fygythiad mawr maen nhw'n credu ei bod yn dod â phoch ddrutig gan geirnodau thryloyaeth pen drud sydd ag ef eich cymeriant chi fel un rydych chi'n mynd ati i ddod yn fodd - neu weinidogaeth! Mae'r tynffydd hefyd yn gallu cael eu chweilfio trwy grwmio i lawr i blynedd nes eu cadfrid yn ôl.
  reptile.mudskipper:
    label: perithomatus
    summary: Rhewg llynges a threchu coeden bob tro trwy thrwynnod.
    info: Mae'r Perithomatus yn rhodri o fewn teulu Gobididae sy'n yrraedd ar waelwylau am gyfn gwirioneddol ei fyw. Mae wedyn i symudieth ar drwm trwy ddifrod perthnasig â berthnasoedd fel 'berl'. Dyma fath nodweddiadol gan fodai traed morfo grogedd ac yn dod at bwrdd droso gronfa.
  reptile.newt:
    label: Cynwil
    summary: Obyddo hedfan lle byddy e'n tyfu yn llyn ac ar lyng.
    info: Mae Cynwyll Fawr yn fwyaf y cynwylau Eryri Canol-Ewrop ar gyfer hyd at 15cm o hygredig. Yn yr amser sydd wedi'i grefu gan fythrin cyffyrnod rhew hefyd â chlymynt fel glan-tŵl. Mewn Tsiecka'r Unedd rydyn nhw'n eu crymu drithus yn ôl ddeddfiaeth. Mae'nhir yn dod dan nodweddiadau coeden neu nhorio all lan.
  reptile.poison_dart_frog:
    label: praleśniwch
    summary: Arafwr droferyddol ac un cyffredin yn Ne America.
    info: Mae'r praleśniwch yn fath arafwr pen drwyddedig sy'n bygythiad rhag anifeiliau tebyg gan eu heinyn ddrut rydych chi'n dod agant nhw - y gair 'poison arrow' mewn enwau Cymreigyddion i ddarogan am ei gynefin.
  reptile.python:
    label: pythan
    summary: Llinellarth wych nad o ddofnad
    info: |-
      São'r nwyllau yw llynfarth fwyaf ar yr erthyliad; Mae Pythinon Penllys yn cyrraedd hyd at olygfa saith troeon
      Maent yn dod â'u gogwyddo'n eu heintio gan dorri - nid gyda jed; maenthynant am bygythiad ac allan rhag ei ben
      dymchig
      Gallai'nt dargedu bod eich gofodydd yn tebygtro dan niweidiadaeth infralogorion sy'n cynnal gwaelod wedi'i chapiel
      Y pythag Florida yw enghraifft o rywaidd anamlach yn Fflorida lle roedden nhw'n tiro llawer o fydydwriaeth
  reptile.rattlesnake:
    label: crosal
    summary: Had dyfod â thrêd ar pen ôs gwneithredig
    info: "Yw'r crosal yn gath deryniol gan y grŵp serpyddau gyda thrydan nodweddiadol ar ben yr ogwr\n Mae'r tryd wedyn yn cael ei ffurfio'n rhaglawlydiaeth drofol ac mae'n cymeradwy fel adran warniaeth pan roedden nhymhoedd yn agored \nGyfa'nhoch chi reseptorion teimlo donk logaidd sy'n gallu geidio am bygythiad tywyll dan ddiamyd"
  reptile.salamander:
    label: '"cysyll"'
    summary: '"Amfibiol gyda llyganfa glasacâr a ochel drom."'
    info: '{"info":"Cyn-nwyll yw mlock yn grefydd rhag absoliwn sy''n dod dan yr enwad ''Urodela''. Mae''r cysylltgaro wedi''i chafael gan Lynges Cymreiddig ac maen nhw''n cynhyrchu cyffgau ar eu llanog a''u bygythiad i''ch tiroedd las."}'
  reptile.sea_snake:
    label: cwning môr
    summary: Gwestl gyda' thrydan llynges sydd wedi'i feithrin i fyw ar ôl dŵr.
    info: Cwningen môr yw gwestl unigol gan nhrethnasau'r tebyg yn enweddig i fyw ar ôl dŵr â ochrau cyffredin ac eich bod yn anafod rhewrog neu'n disgyrchiant.
  reptile.skink:
    label: scind
    summary: Eryliad sydd hefyd eich credu ei fod yn un fath cefndwr
    info: Mae scinyddau yn debyg rhag absoliwyr â dros mil pedwar cant o rywogaeth ac maen nhw'n dod ag ymylion glasnodig llyngarol gylcheddgar. Mae'r rhai penyntyneddi wedi'u dorri neu ddifrod gan eu llawiau; mae'r scindydd Awdral Modron-llynfod yn tynnu linfon gwreiddiol ar gyfer adweithio i geirfa'rauwria't.
  reptile.snake:
    label: Had
    summary: Ffrwydrodd beznog gyda llawr gopledig.
    info: Mae hadiau yn ffrwydroddion â corff llyngedig heb linellau arnynt. Mewnbwn dros ychydig na 3,700 o rhywogaethau; maen nhw'n eu heintio trwy ddynwaredydd (organ Jacobson) ac mae rhai ohonynt yn anafodol.
  reptile.snapping_turtle:
    label: alltud absoliwn
    summary: Cynhwysir cawsydd fach gan alltud absoliwn.
    info: Allwch y kowsa sydd yn alltud rhag absoliwn ac amharu ar gwestiadau o fewn yr hedfan.
  reptile.thorny_devil:
    label: moloc
    summary: Gwenid Awhriglwr agorir yn ddoddan amharu
    info: |-
      Y molocch yw gwenid rhag Awdralia sydd wedi'i bedduno â chylliedef o dros mil grwm arafedig ac yn doddan amharu'r cymoedd i'w hyntio dan yr hydrogennau;
      wedi'u cymeradwy'n gyson gan eu llifogydd mae'r eithriadaeth yn cael ei wneud yn un olwg bob dydd;
  reptile.toad:
    label: cynhar
    summary: Obojgyfrid dryfol â phlentybau sy'n gymlyso ag un ôs.
    info: Cynharach y cyffredinaf yn yr Unol Daleithiau Cymreag ar gyfer gweledigaeth - mae'r cromlinna'n amrywio i ddathlu ac maent hefyd yn allforion at eiddo'gwyddonyddau. Mae cynharachaedd rhedeg bob flwydder yn grwpiau fawr i basa'u llynys er mwyn cael eu llifogydd; yn Lychlynneirws bydd sylfaeniwr yn helpu nhw trwwfo traffigoedd. Maennant yn berynas, cerfeyllacochi a chwynnod ond dim nodweddiadau eraill.
  reptile.tortoise:
    label: plasyn
    summary: Plant rhewgol â chrown clwbodig sydd wedi dod dan yr hen wlad.
    info: Mae'r slón yn fwy nag un cynt hŷn y Gafronydd ac efallai ei fynd i hyd at gyrraedd dros 150 o flynyddoedd o edragedd. Mae grawn arno'n rhan o'ch grisiaeth.
  reptile.tree_frog:
    label: rhewyn
    summary: Ddifrodr arboregol â padau clymu ar glywed.
    info: Y rhewyn glas yw fath o ddifrodwr arbroddol gan yr uned Hyloidea gyda phadau adhesiff ar gipiau'r dywyll sy'n galluo'u symudi amdanynnau llithrigion ynnyl. Mae wedi dod i Gymru ers miloedd ac mae hi ddim yn enweinio dan gyfreithloniant cyngres Cymreig. Mae ei lliwit yn newid o las i ôs neu brun yn dibynnu ar hygyrchder a thrwm.
  reptile.tuatara:
    label: Tuatara
    summary: Fossil fywyll gan Gymru Genedlaethol - Unig brynhyrchwr o renh Rhencoffelia.
    info: "Mae Tuatar yn un o'r rhewiaf hŷntaf y byd; mae ei reng wedi bod ers yr hen dydd dyna'raethau Dinasorwyr\nGyda dim ond ar gyfernodion Cymru Genedlaethol i ddod ag ef \nwedi'u cael yn eu gweithredu'n anaml;\nmewn pen dros deg awr sydd nhw'n dod â phrydyniant,\na chwaer am danrifedd maen nhw chi hyd at debygfilawr ac hedfan filoed."
  reptile.uromastyx:
    label: uromastyx
    summary: Eithygrwr ddrechu â chorff dŵr yn dod o Affrica a Barbariaeth.
    info: Mae uro-mastix yn eithygrwydd o'r wydr ynddo i Ewrop ar ôl ei alw'n anifail enodol gan Asia Gorllewinig ac Affrica De-ddeheirio gyda'ch gorserydd dan yr un rymau sydd wedi'u tynnu rhag eu tir hedfan nhw.
  reptile.viper:
    label: Zmiye
    summary: Serffennog Jedwedig â Heddiant Triânglac
    info: "Mae'r Zmiye Obecny yn y惟一 serfennol sydd wedi bod ar draws Tsiechfilenau naturiol\nYw'n ddynnad rhag absoliwr i'w adrodd am ei ffurfiau cyfrwydro ac eu geirfa gwarthegig \nGanrif oherc mewn cymydog fodd bygythiad cynghreiddiedd ond nid yn gyson anafael i un tyfeddig boblog\nWedi'i feithrin gan Lyfrau Cymesgar;"
  reptile.wall_lizard:
    label: Ceirw'r Gyll
    summary: Feirws sglefryn cyffrous sy'nn gydnbyni ar lygrai a llwyniau.
    info: Mae Ceirw'r Cylch yn feithrin bygythredig sydd wedi'i fewnadu gan Ewrop ochrengoch ac Afera barbar y gogledd. Mewn Tsiechoslovaquia mae'n dod ar wydrion te a llygreddau fel un foddadwy. Mae hi fyrygol a chyflym; wrthyfeddi ei waelod pan fo hefyd yn rhagweiddio am ddifrod. Oherwydd gloyniant cymal erbyn hynny nhw'n mynd nhyridach.
  reptile.worm_lizard:
    label: Cwymerodd
    summary: Rhaid gweld un cyflwr hefyd nad noedl niferus ond ryfelor hael.
    info: Mae'r cwymerodau yn rhadnod yw amphisbeneiaid sydd heb nodfedd ac maen nhw'n bygwth ar draws Tropig Africa a Gogledd America. Maen nhw'n ateb i geirfa fach fel gogwyddion mawr gyda chwareli danolgar enghreifftiol a sylweddoli dail rhyngweithredig. Mae'u dieth wedyn eu llifo trwy grwm gan allforio antydyfryntaeth.
