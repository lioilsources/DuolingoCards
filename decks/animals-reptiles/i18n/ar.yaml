lang: ar
pivot: false
title: الزواحف والبرمائيات
cards:
  reptile.agama:
    label: أغامة
    summary: الزواحف الصخرية الملونة بأفريقيا؛ ذكرها يملك لونًا ملفتًا.
    info: |-
      الأغاميا هي عائلة كبيرة من الزواحف الأفريقية والآسيوية والأسترالية التي تحتوي على أكثر من 300 نوع
       الذكور في أنواع أغاما ذات الرؤوس الحمراء تمتلك رؤوساً برتقالية مشرقة وأجسام زرقاء كعلامة للهيمنة.
  reptile.alligator:
    label: إلليلجاطور
    summary: حيوان كبير من عائلة الزواحف المائية يعيش بالولايات المتحدة وإلى جانبها دولة واحدة أخرى.
    info: |-
      الإيليجاتور الأمريكي هو أحد نوعي الإيلاigators الحيين؛ والنوع الآخر أصغر وهو إلليجатор الصيني。
      يميزه عن الكрокوديل أن له فكًا أوسع ومستدير الشكل، ولا تظهر أسنانه عندما يكون الفم مغلقًا.
      يعيش في المستنقعات والأنهر البحيرات جنوب شرق الولايات المتحدة الأمريكية.
  reptile.anaconda:
    label: أنكواد
    summary: الأكثر ثعباناً الذي يوجد بأماكن الامازون.
    info: |-
      {"hint":"أثقل ثعبان في العالم، نصف جواني (إينيكتس مورينوس)","info":"أنقوندا الخضراء هي أثقبة الثعابين بالعالم؛ الإناث تصل وزنها إلى أكثر من ٩٠ كجم وطولها بين خمسة وأربعة أمتار.
      تعيش ببرك الأمازون وأنهار أمريكا الجنوبية الاستوائية.
      هي نصفي عبّاسية ولت الصيد الأسماك والطيور وكيبيرا الكايمنات أيضاً.
      على العكس من الزواحف الأخرى فإن أنغواندي تنجب صغارها حياً (الحمل الحي).
      ","label":"أنقواندة","summary":"أكثر ثعبان يعيش بالأمازون."}
  reptile.anole:
    label: أناولي
    summary: الزواحف الأمريكية الصغيرة التي تقوم بتغيير اللون؛ إن لدى ذكرها علامات بارزة.
    info: |-
      أنوليس هو جنس من الزواحف الصغيرة الأصلية في أمريكا، يحتوي على أكثر من 400 نوع
      إن الذكور تمتلك رقعة لونية ملونة تحت الرقبة (دفلوب)، وتستخدمها للتواصل والجذب الجنسي لل الإناث.
      anolises يمكن أن تتغير ألوانها بين الخضراء إلى البني حسب درجة الحرارة والعاطفة.
      وهي سريعة ونشطة؛ ويمكن لها التسلل عبر زجاج بسبب وجود طبقات بلлиقة.
  reptile.axolotl:
    label: أكسولاتيل
    summary: حيوان مائي مكسيكي يحتفظ بمميزاته الجنينية طيلة حياتـه.
    info: |-
      الأسكولوتل هو حيوان مائي من الملاط يعيش في المكسيك ويتميز بظاهرة النتوتية، أي أنه يستمر بالاحتفاظ بميزات الطفولة طوال حياته بما فيها الزعانفر الخارجية.
      it is endemic to lakes around مدينة المكسيك ويعاني تهديدًا خطيرًا بسبب التلوث البيئي.
      له قدرة استثنائية على التجدد ويمكن له أن يقوم بإعادة بناء الأطراف والجزء الجزئي من القلب وحتى الحبل الشوكي.
  reptile.basilisk:
    label: الباسيليسيس
    summary: ثعبان أمريكي قادر على المشي لفترة قصيرة فوق سطح الما.
    info: البازيليسك المزيناً يُمكنه الرّكض على سطح المياه بفضل أصابع محفورة مع شعر تلتقط الهواء تحت الماء، ويمكن له أن يركض أكثر من عشرين متراً قبل الغرق. الذكر لديه ظهر ورأس بهما حافة واضحة. في الأشجار يستخدم التمويه كاستراتيجية أساسية للدفاع.
  reptile.boa_constrictor:
    label: ثعلب البواء
    summary: ثعبان جنوبي أمريكي ضخم يستخدم الضغط الجسدي للقضاء على الفريسة.
    info: الboa الملكي هو ثعبان كبير غير سام من أمريكا الجنوبية يقتل فرائسه عن طريق لفها وشد عضلاتها بقوة عند كل نفس خروج لها، مما يؤدي إلى إيقاف التنفس فيها. كما أنه حيوان أليف شائع بسبب طبعه الهادئ ويصل طوله بين مترين وأربعة أمتار ويمكن أن تعيش أكثر من ثلاثين عامًا.
  reptile.box_turtle:
    label: السمكة المربوطة
    summary: ثعبان أرضي صغير يستطيع الإقفال الكامل داخل جلده.
    info: |-
      السمكة المربوطة هي ثعبان أرضي أمريكي شمالي قادر على إغلاق القشرة تمامًا بلوحة أمامية قابلة للحركة
      تعيش في الغابات والأعشاب كحيوان منعزل
      يمكن أن تعيش أكثر من مائتي عام؛ وتصل إلى عمر يترواح بين ٤٠ و٥٠ سنة في البرية
  reptile.caecilian:
    label: قرميزة
    summary: حيوان بدون أرجل وشبه دود مثل الثعابين.
    info: القرمزيلا هو حيوان مائي ينتمي إلى مجموعة الجيمنوفيونا، وهو نادر الدراسة ويوجد بشكل خفي في التربة المدارية. يبدو كديدان كبيرة أو ثعبان فاتح اللون. لديه عينان صغيرتان منتفختان؛ يستخدم الشامه وال Tentaculas (أعضاء إحساس على الرأس) للتنقل.
  reptile.caiman:
    label: كايمن
    summary: زواحف كروكيدية جنوبي أمريكية صغيرة عن الكрокوديل أو التمساح.
    info: الكايمن المُرَصِّع هو أكثر أنواع الزواحف الكروكيديالية انتشاراً في أمريكا الجنوبية، وهو أصغر من الثعلب الحقيقي ويزن حتى طوله حوالي مترين ونصف. يعيش هذا الحيوان في الأنهار والبحيرات والمياه المالحة بالمناطق الاستوائية التي تمتد من ميكسيكو إلى الأرجنتين. يتم الصيد به كجزءٍ من صيده للجلود؛ مما يؤدي لانخفاض تعداده ويهدد وجوده بعض المناطق.
  reptile.chameleon:
    label: خنفساء الألوان
    summary: أفعى شجرية تغير لون جلدها، وعينيها متنقلتان.
    info: يُغيّر خنفساء الجماعي الألوان ليس للتغطية بل للاتصال والتحكم في درجة الحرارة. عيناه تتحركان بشكل مستقل.
  reptile.cobra:
    label: كобра
    summary: ثعبان مسموم مع غطاء القبة المميزة؛ أداء التحدي بالسامة.
    info: |-
      الكوبرا هي ثعبان سام من عائلة اليلابيدا تشتهر بقدرتها على فتح جلد خلف رأسه إلى شكل قبعة ك预警.
      The venom (Neurotoxin) يُسبب الشلل في الجهاز العصبي للضحيّة.
      The King Cobra هو رمز وطنى لمصر والهند.
      three Cobras السوداء يمكن أن تقذف السم لمسافة أكثر من مترين، وتستهدف بها العين.
  reptile.crocodile:
    label: كروكوديل
    summary: ضفاف نهر كبير يعيش بالقرب من الأنهار والمستنقعات.
    info: الكrokوديل هو أحد أكبر الزواحف في العالم، ويوجد في إفريقيا ويصطاد من الماء. كما أنه لديه أقوى عضة بين جميع الحيوانات الحية.
  reptile.flying_dragon:
    label: 晰蜴 طائرة
    summary: يشرسة صغيرى من جنوب شرق أسيا تتزلج عبر الأضلع المتصلة.
    info: '{"hint":"ящرسة تطير باستخدام أغشية الجلد الممتدة على الأضلاع (دراكو فولانس)","info":"ال晰蜴 الطائرة (Draco volans) هي يشرسة صغيرة من جنوب شرق آسيا قادرة على التزلج بفضل غشاء جلدي ممتد على أضلعاها المستطالة.\nتستخدم هذه اليشرسة القدرة على التزلج بين الشجرة والشجرة للحصول على منطقة نفوذ أو الهروب من الحيوانات المفترسة.\nإن الذكر لديه عنق ذهبي لامع بشكل واضح.\nولا تستطيع الرفرفة بالريش بل فقط الانزلاق."}'
  reptile.frilled_lizard:
    label: أغاما ليمكويا
    summary: ثعبان يفتح علامة تحذيرية كبيرة ويفر عندما يتعرض للتهديد.
    info: |-
      أغاما اللِّمْكُوَا هى حيوان أسترالى ينتمي إلى فئة الزواحف، وعندما تشعر بالخطر فإنها تمد عنقًا كبيرًا مطويًّا حول رقبتها ك警示作为一种警告的表现。
      هى تركض على قدميها الخلفيتين بطريقة ثنائية الأرجل مثل دиноصور صغير الحجم.
      وعادة ما يكون هذا الرباط المفتوح في حالة سكونه منغلقًا.
  reptile.frog:
    label: ضفدع
    summary: ضفدع أخضر يقفز وله عيون حمراء.
    info: الضفدع الأحمر العين هو ضفدع مائي من أمريكا اللاتينية المدارية. يعيش في قمم الأشجار، ويستخدم الغشاء بين أصابعه للطيران، وهو نشيط ليلاً.
  reptile.gecko:
    label: جيكو
    summary: ثعبان صغير قادر على التسلق على الأسطح الرأسية.
    info: الجيكو المخطط هو ثعبان شائع في تربية الحيوانات الزاحفة. يمسكه ملايين الشعر الدقيق جدًا على قدميه على الصخور والجدران، وليس بواسطة المادة اللاصقة.
  reptile.gharial:
    label: غوافيال
    summary: حيوان زاحف كركديلي مع فكوك بارز جداً متخصصة في الصيد السمكي.
    info: "الغافيل هو نوع من الزواحف الكрокوديلية يعيش في الهند، وله أنف طويل جدًا ضيق يتميز به وهو متكيف للصيد الأسماك\n الذكور لديهم نتوء على طرف الأنف الخاص بهم (غر). \n إنه خطر بالانقراض؛ حيث أنه موجود فقط في الأنهار شمال الهند والنيبال. \nوهو أحد أقدم كائنات الزواحف الكروكوذلية وكان منتشر تقريبًا عبر آسيا بأكملها."
  reptile.gila_monster:
    label: حيدورم
    summary: ثعبان سام عضلاتي ذو الجلد المتقطع موجود بالجزء الجنوبي الغربي الأمريكي.
    info: الحلزير جيلا هو أحد القلائل من الزواحف السامة في العالم، ويتميز بجلده المتشابك مع أنماط حمراء داكنة كتحذير للحيوانات الأخرى. يحقن السم عبر مسارات على أسنانه وليس عن طريق أنياب فارغة مثل الثعان. إنه سريع الحركة ويتطلب قليلاً من الطاقة ويمتص الطعام عدة مرات فقط سنويا.
  reptile.glass_lizard:
    label: سلعيش
    summary: سام بدون فخذين وليس حيوًا حقيقيًّا؛ لديه جفنان قابلين للتحرك.
    info: السُّلْعِيَش الْمُجَرَّد هوا سامٍ مفتق الأقدام يعيش في جميع أنحاء أوروبا، ويصعب التمييز بينه وبين الحية. على عكس الحيوات، لديه جفنان قابلة للحركة وأذن دخيلة. يمكن له أن يتخلص من ذنبه كوسيلة للاختباء؛ ثم تنمو الذيل مرة أخرى.
  reptile.hawksbill_turtle:
    label: كارياتكا
    summary: سلخفة بحرية معرضة للخطر بشدًه ولديها فم ضيق.
    info: كارييتا بريما هي نوع من أنواع السلحفاة البحرية المهددة بالانقراض تابعة لعائلة إيرتموشيليس، وظهرها كان مصدر جلود الزينة في الماضي؛ والتجارة غير القانونيّة أتاحت لها انقرضًا شبه كامل. تتغذى بشكل حصري على الفطريات والحشرات المرتبطة بالأعشاب الوردية.
  reptile.horned_lizard:
    label: Thorny Devil
    summary: ثعالب بلاطة ذات أشواك وأطراف مشوهة مع وجود خصلات طويلة مثل القرون.
    info: الثعبان المزود بالأشواك والبلاطات هو ثعلب صخري مسطح يعيش في الصحراء جنوب غرب الولايات المتحدة والمكسيك، ويتميز بوجود تفرعات على شكل قرون على رأسه واسم علميه Phrynosoma. عندما يتعرض للخطر يستطيع أن يستخدم آليّة دفاعية فريدة من نوعها وهي إفراز الدم عبر عينيه لمسافة أكثر من مترين كوسيلة لإبعاد الأعداء عنه. كما أنه لا يتمتع بالمرونة الكافية؛ لذلك يعتمد بشكل كبير على التمويه.
  reptile.iguana:
    label: '{"label": "إكوانا خضراء"}'
    summary: '{"summary": "ثعلب ضخم أخضر بأطراف حادة موجودة في أمريكا استوائيّة"}'
    info: '{"info":"الإكوانا الخضراء هي ثعبان كبير يعيش في أمريكا الاستوائية يصل طوله إلى مترين، وله عين جانبية على جبهته تُشعر بالضوء وتسمى العين الجلدية. وهي كائنات اجتماعية؛ حيث تعبر عن هرمها الهرمي من خلال الضغط المستمر للرأس والتغير اللوني لجلدهم. إن التهديد الرئيسي الذي تتعرض له هذه الثعابن هو فقدان بيئتها الطبيعية؛ كما أن الإيكوا المرباة تكون متعجرفة مثل الكبار."}'
  reptile.king_snake:
    label: ثعلب إمبراطوري
    summary: ثعبان أميركي غير سام مقاوم لمضادات السم لدى الأفعى الرattlesnake ويتغذّى على أنواع أخرى.
    info: |-
      الإمبراطورية هي ثعبان أمريكي غير سام قادر على أكل الثعابين السامة، بما في ذلك الأفاعي المقرصة التي يمتلك مناعة ضد سمها.
      zفرادته اللونية تشبه لونيًا الإفراطيات السمية مثل الكارافلوريد.
      يلعب دوراً مهماً كمُنظم لل种群 الفئران والطيور والحشرات الأخرى.
      nوهو حيوانٌ شائع بين الناس بسبب طبعه الهادي.
  reptile.komodo_dragon:
    label: تَنِينٌ كُمُودَا
    summary: أكبر الثدييات البحرية الموجودة على جزر إندونيسيا.
    info: التنين الكومودو هو أكبر ثعبان حي يبلغ طوله أكثر من ثلاثة أمتار ووزنه حوالي سبعين كجم، ويُعتقد تاريخياً أنه قاتل بالبكتيريا في اللعاب؛ لكن الحقيقة أن لديه غدد سمّية تقتل فرائسه مثل الغزلان والخنازير وحتى البقر.
  reptile.leatherback_turtle:
    label: كوشيتا
    summary: أكبر ثعلبان بحر مع غلاف جلدي بدلاً من الأظافر الصلبة.
    info: الكوزاتكا الكبيرة هي أكبر ثعبان بحري في العالم، حيث تصل طولها إلى أكثر من مترين وكتلتها الزائدة عن ٧٠٠ كجم. أنها لا تحتوي على قشرة عظمية صلبة بل جلد مقوى بالعظام الصغيرة (الأوستوديرميا). تقوم هذه الثعلبات البحرية الهائلة بمigration عبر المحيط؛ وقد تم تسجيل رحلة مدفوع بها لمسافة تزيد على ١٦ ألف كيلومتر. إنها تتغذى فقط على الجُرَاديات وتواجه خطر الانقراض.
  reptile.lizard:
    label: الثعبان
    summary: أرباعي الأرجل مغطى بالقشور، يعيش في المناطق الدافئة.
    info: الإكناز الخضراء هي ثعبان كبير من أمريكا الوسطى وجنوبها. تأكل النباتات، وهي قادرة على التسلل ببراعة والتعافي من الجزء المقطوع من ذيلها.
  reptile.mamba:
    label: ' мамба'
    summary: ' ثعبان شجري إفريقي سريع للغاية ويحمل السم'
    info: |-
      {"hint":"سُلَّطٌ سريِع جداً ومميت من الأفاعي السامة الإفريقية المتناثرة في الشجرة (ديندرواسبيس)","info":"تتميز مامبا السوداء بأنها واحدة من أسرع وأكثر الثعابين فتكاً بالسموم على مستوى العالم،
      وقد تصل إلى скорости أكثر من 20 كيلومترًا الساعة عند الحركة فوق الأرض وقادرة أيضاً على التسلق عبر الأشجار.
      إن سمها العصبي القاتل بدون مضادات جسدية يسبب الوفاة خلال ساعات قليلة فقط.
      الاسم 'مامبة سوداء' يأتي بسبب لون الداخل الفموي وليس اللون الحقيقي للجسم الذي يكون رماديا أو أوليفيا."}
  reptile.matamata:
    label: '"матамата"'
    summary: السلحفاة الأمريكية الجنوبيّة الغريبة الشكْل والتي تماثِل النفايات الخضراء.
    info: |-
      {"hint":"أفعى الماتاماتا ذات الشكل غريب الأطوار من أمريكا الجنوبية مع رأس على شكل ورقة (Chelus fimbriatus)","info":"ماتاماتا هي واحدة من أغرب السلاحف العذبة في جنوب شرق أمريكا الجنوبية.
      درعها وجسدها يشبهان الورق المتحلل والفرشاة، وهو تمويه استثنائي للغاية.
      لا تعتمد ماتاماتا الأسنان لالتقاط الفريسة؛ بدلًا من ذلك تستعرض فم كبير وتشفط المياه والفريسة ثم تغلقه.
      تعيش هذه السلحفاة في مجاري المياه الثابتة أو التي تتقدم بشكل بطئ مثل تلك الموجودة في نهر الأمزون."}
  reptile.monitor_lizard:
    label: واران
    summary: سحلية كبيرة نشطة هجينة ذات لسان مفروق.
    info: |-
      الواران هو ثعبان كبير من جنس الوران له لسان مجزأ يخدم كعضو حسي للرائحة
       والواران الكومودو هو أكبر سحلية على قيد الحياة في العالم، حيث تصل طوله إلى أكثر من ثلاثة أمتار
       ويرتبط الواران بالذكاء؛ فقد رصده العلماء استخدام أدوات بسيطة
  reptile.mud_turtle:
    label: الوزغ الأصفر
    summary: سلحفاة صغيرة أمريكية عاشبة ونهرية.
    info: الوزغات الطينية هي نوع من السلاحف الصغيرة بطول حوالي ١٥ سم، تعيش في أمريكا الشمالية والوسطى. عندما تكون مهددة، فإنها تنبعث رائحة قوية بواسطة الغدد العطرة لديها. يمكن أن تحتمي بالجفت وتبقى نائمة خلال فترات الجفاف.
  reptile.mudskipper:
    label: سمكة المشي في الطين
    summary: ' الأسماك التي يمكن أن تتسلق الشجيرات والمشي على الأرض بفضل عضلاتها القوية.'
    info: الأسماك المتنقلة على اليابسة تعيش معظم حياتها خارج المياه، وتتحرك عبر الأرجل الناعمة باستخدام أطراف الصدر كالأقدام. كما أنها تستطيع التنفس من خلال الجلد الرطب وصعود جذور شجر الساحل.
  reptile.newt:
    label: خنزير
    summary: حيوان عمودي العنق نصف إسفنجي يعيش في المياه والبر.
    info: '{"hint":"ضفدع بحري صغير مع ذيل مسطّح (تريناتوروس)","info":"الخنزير الكبير هو أكبر خنزير في أوروغسيا الوسطى يصل طوله إلى أكثر من 15 سم\nفي موسم التكاثر يبرز الذكر ظهرًا واضحًا وعلامات تشبه الثعابين\نفي جمهورية التشيك يتم حماية جميع أنواع الخنازير بالقانون\نويقض الشتاء تحت جذوع الأشجار أو داخل الحفر بعيداً عن الماء."}'
  reptile.poison_dart_frog:
    label: ضفدعة البراسلينيكا
    summary: ضفدعة صغيرة ذات لوني جريء وسميت موجودة بالأميركتين.
    info: البراسلينيتشكا هي عبارة عن ضفدع صغير ينتمي إلى مجموعة الدندروباتيدا ويوجد في الغابات المدارية بأمريكي الجنوب والشمال. تتميز ألوانها الجذابة مثل اللون الأحمر والأزرق والأصفر كتحذير من سميّتها، وهي مثال على الظاهرة المعروفة باسم 'الأبوة التخويف'. بعض أنواع هذه الضفادع تعتبر الأكثر سمًا بين الحيوانات الفقارية بالعالم.
  reptile.python:
    label: كرطة
    summary: ثعبنة كبيرة غير مؤذية قادرة على شنق حيوائها.
    info: الكروت هي الأطول من بين الثعابين في العالم؛ حيث تصل كرطة المخطَّط إلى طول يزيد عن سبعة أمتار، وتقتل فريستها بالانقباض وليس السُم، وتشنِق الفريسة حول رأسها وجسمها. كما أن لها مستشعرات حرارية تعطي القدرة على اكتشاف الحيوانات ذات الدم الدفء حتى في ظلام الليل.
  reptile.rattlesnake:
    label: خراصة
    summary: ثعبان سميك ذو ذنب متقطع لإصدار إنذارات.
    info: |-
      الصقر هو ثعبان سام ينتمي إلى مجموعة الثعابين المُحدَّدة ويتميز بذيل مزود بأجزاء صلبة تصدر رجفًا عند الخطر
      تتكون هذه الأجزاء من حلقات قاسية، وتستخدم كإنذار عندما يكون الصقر في خطر
      ويحتوي على مستشعرات حرارية تساعدها اكتشاف فرائسها الدموية حتى في الظلام
  reptile.salamander:
    label: مُلوك
    summary: حيوان ذا جلد لامع وذيل طويل.
    info: يتميز الملوك ذو البقع بجلده الأصفر والأسود، وهو حيوان مهدد بالانقراض يعيش في الغابات الرطبة ويُنتج مواد سامة من جلده.
  reptile.sea_snake:
    label: ثعبان البحر
    summary: ثعبان سامي يتكيَف مع الحياة تحت الماء له ذنب شكله كتجويف.
    info: |-
      ال眼镜蛇 البحري هو ثعبان سام ينتمي إلى فصيلة الهيدروفيينا، وهو مُكيف تمامًا للحياة في المحيط
      له ذيل عرض مثل التجويف لتسهيل السباحة
      إن سمّه من النوع العصبي وقوته عدة أضعاف أكثر مما لدى الثعابين الأخرى؛ لكن هذه الأفاعي هادئة جدًّا
      تتنفس الهواء ويجب أن تطفوا على السطح بانتظام
  reptile.skink:
    label: سكوينك
    summary: ثعبان ملساء مع زعانف صغير.
    info: السكينك هو عائلة كبيرة من الزواحف التي تحتوي على أكثر من ألف وخمسمائة نوع، ويتميز بجلده الملساء المكون من قشور دائرية ناعمة. بعض الأنواع تمتلك أرجلًا صغيرة أو بدون أقدام تمامًا. السكينك الأسترالي ذا اللسان الأزرق يظهر لسانه ذو اللون البارز كإشارة تحذير للحيوانات المفترسة.
  reptile.snake:
    label: ثعبان
    summary: ضفير مماثل للديدان مع جسم طويل مرن.
    info: الثعابين هي حيوانات الزواحف التي تتميز بجسومها الطويلة الممتدة بدون أطراف. يوجد أكثر من 3700 نوع؛ وهي تتغذى باستخدام شمّها (عضو ياكوبسون)، وتعتبر بعض الأنواع سامة.
  reptile.snapping_turtle:
    label: السلحفاة المفترسة
    summary: سلحفاة أمريكية ضخمة ومائية معروضة لها أسنان حادة.
    info: السلحفاة المفترسة الشائعة هي سلحفاة كبيرة وعنيفة من أمريكا الشمالية تعيش في المياه العذبة ولها فك قوي على شكل鉤. إنها عدوانية خارج الماء، لكن أكثر هدوءًا داخله. يمكن أن يصل وزنها إلى ما يزيد عن ٣٥ كجم وتصل أعمارها لأكثر من ٤٠ عاماً. وهي مُنتِجة للطعام؛ حيث تتغدى على الأسماك والطيور الجَرّارة وحتى الأشلاء.
  reptile.thorny_devil:
    label: '"الثعلب ذو الأسنان"'
    summary: '{"summary":"ثعبان أسترالي مُحاط بأعشاب شائكة تمتص السائل بها القنوات الشعرية."}'
    info: '{"info":"المولوش الحوافر هو ثعبان صغير أسترالي يغطيه آلاف الأشواك المدببة، ويتميز بقدرتة على امتصاص الرطوبة عبر الجلد باستخدام قنوات رفيعة بين الشوك؛ تنتقل هذه المياه مباشرة نحو الفم. كما أنه يتغذى فقط على النمل الصغار ويتناول ما يصل إلى ألفي نحلة في كل مرة واحدة. وعلى ظهره المشوه بالأشواك يوجد رأس زائف كجزء من استراتيجية دفاعية."}'
  reptile.toad:
    label: الحصان
    summary: حيوان عباقرة ذوي غطاء قشري مشابهة للضفادع.
    info: "الحصان البري هو أكثر أنواع الحيوانات المائية انتشاراً في جمهورية التشيك\n تستخدم الغدد الجلدية للحماية وتصدر مواد سامة، ولا تقوم بمضغ البعوض مثل الضفدع \n كل عام يهاجر إلى خزانات مياه كبيرة لتكاثره ضمن أعداد هائلة؛ وفي تشيكا يتم إرشاؤه عبر الطرق بواسطة المتطوعين\n يتغذى على السлим والديدان والحشرات ويُعتبر منظمًا طبيعيًا لمسببات الأمراض الزراعية"
  reptile.tortoise:
    label: السمكة البرية
    summary: ضفدع بري بقشرة مُحدَّبة يعيش على اليابسة.
    info: السمكة العملاقة هي أكبر سمكة برية في العالم، وتعيش على جزر غالاباجوس ويمكن أن تصل إلى أكثر من 150 عامًا. القشرة جزء من هيكلها العظمي.
  reptile.tree_frog:
    label: ضفدع شجرية
    summary: ضفدع شجري لديه أحبار في أقدامه للتعلق بالأوراق.
    info: |-
      الضفدع الأخضر هو ضفدع صغير من عائلة الهيليدا مع أحبار على أطراف الأصابع تسمح له بالصعود إلى السطوح الملساء
      في التشيك يعيش نوع واحد فقط وهو الضفدع العادي؛ وي受到 قانون حمايته
      يمكن أن يتغيّر لونه من الأخضر إلى الرماد أو البني اعتمادًا على درجة الحرارة والرطوبة
  reptile.tuatara:
    label: توتايرا
    summary: فossil حيّ جديد زهيلي الوحيد الباقٍ ضمن الرتبة رينشوسباليا.
    info: تواتارا هو أحد أقدم الزواحف في العالم؛ كان رتبته موجودة منذ عصر الديناصورات، ويعيش فقط على جزر نيوزيلندا ويُعتبر من الكائنات التي تنمو ببطء شديد حيث يبلغ النضج الجنسي بعد عشر إلى عشرين عامًا.
  reptile.uromastyx:
    label: يوروماستيك
    summary: ثعبان رملوي ذو الذيل المدبب يأتي من أفريقيا والشرق الأوسط.
    info: يوروماستكس هي ثعبان رملي من شمال إفريقيا وجنوب آسيا مع ذيل مميز يشبه الإبرة يستخدمه للدفاع عن نفسه، وهو نباتي صارم ويأكل البذور والعشب والأعشاب. تُربى كحيوان أليف في الأقفاص الزجاجية.
  reptile.viper:
    label: أفعى
    summary: حيوان أفاعي سام ذو رأس ثلاثي الزوايا وجسم منعطف.
    info: الصقر هو الأفعى السامة الوحيدة التي تعيش بشكل طبيعي في جمهورية التشيك، ويتميز بوجود نمط ملتف على ظهره وأسنان حادة مثل سكين الجيب. يمكن أن يكون عضة الصقر مؤلمة وتحتاج إلى رعاية طبية ولكنها نادراً ما تكون قاتلة للشخص البالغ الصحي.
  reptile.wall_lizard:
    label: جرذان الجدار
    summary: ثعبان سريع نحيف يسكن الأماكن المرصوفة أو المغبرّبة.
    info: الجَرذان الحائطية هي حيوان صغير يعيش أصلاً في جنوب أوروبا وشمال غرب إفريقيا، ويُعتبر نوعًا مقدمًا إلى التشيك حيث توجد على الصخور الدافئة والأسوار هناك؛ إنها سريعة وماهرة وتلغي ذيلها عند الشعور بالخطر.
  reptile.worm_lizard:
    label: ديدا
    summary: حيوان بلا قدمين يتشابه مع ديدان ويحيا تحت التربة.
    info: الديدانيات هي عبارة عن مخلوقات بدون أقدام من فصيلة الأمفيسبيين تماثل اليراع الكبير، وهي تعيش في أفريقيا وآسيا المداريتين. يشبه شكلها الخارجي حشرة الدود الكبيرة؛ لديهم جلد متقطع وأعين بسيطة للغاية. إنها تقضي حياتها بأكملها تحت الأرض وتتغذى على النمّال والدبابرة.
