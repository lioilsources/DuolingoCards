lang: he
pivot: false
title: פלאזמה ודו-חיים
cards:
  reptile.agama:
    label: agyema
    summary: עקרב ספונטי באמריקה הדרומית; הזכרי הוא בצורות ניכרות.
    info: אגמות הן משפחת יתושים גדולה מאפריקה וآסיה עם יותר מ - 300 תבניות. זכרים של אגמה קרועה ראש יש להם ראשים צבעוניים כתום בהירים ובגדם כחול כדי להראות עליונות. הם מתאימים את הצבע שלהם בצורה פעילה לרגולציה טרמאלית – בקור הם أغונים而在 חום פלטניים.
  reptile.alligator:
    label: אגוול
    summary: agywal עם זקן עגול חי בארצות הברית ולוי.
    info: האיגוילון האמריקאי הוא אחד משני המינים החיים של איגואלים; השני קטן יותר ונקרא האגווול הצ'ייני. מאבדים אותו מקрокודילים בזקן הרחב והמעוגל שלו וכן בכך שאין ראייה בשיניו כשהפה סגור.
  reptile.anaconda:
    label: '"蟒蛇"'
    summary: '"世界最重之蛇居住在亞馬遜沼澤地帶。"'
    info: |-
      {"hint":"蟒蛇，半水生（Eunectes murinus）","info":"翡翠安哥拉是世界上最重的蛇；雌性體重大於90公斤且長度為五到六米。\n它生活在熱帶南美洲的沼澤和河流中。\n它是半水生物種並捕食魚類、鳥類、卡皮巴拉甚至短吻鳄。
      與其他鱷不同的是其產活幼崽的方式。（胎生）。"
  reptile.anole:
    label: アナオリス
    summary: 色が変わる小さな南米トカゲ；オスは顕著な襟を持つ。
    info: |-
      アナオリスはアメリカ原産の小型トカゲで、約400種いる。
      雄にはコミュニケーションやメスを引きつけるために使う色鮮やかな喉袋がある。
      緑アナオリスは気温と感情に応じて体の色を変えられる。
      彼らは速く俊敏であり、接着性のある足裏のおかげでガラスにも登れる。
  reptile.axolotl:
    label: אקсолאט
    summary: מַלוּחִם מימי מקסיקני שמхран את התכונות הלורבוניות בכל חיי
    info: |-
      אקסולוטל הוא נ螈 מים מהמקסיקו המציג אקזוגניזיה – כלומר שמר על תכונות לארווות לאורך כל חייו כולל סדקים חיצוניים.
      it הוא ייחודי לסביבת הערים סביב מקסיקו ситי וקריטית בסיכון עקב זיהום.
      it יש לו יכולת רegerציה מרעיפה והוא מסוגל להחליפו גפיים חלקיות של לב ואף עמוד השדרה.
      it זהו בן אדם פופולרי כחיוך טרפיק בגלל האסתטיקה הייחודית שלו.
  reptile.basilisk:
    label: بزيليسكوس
    summary: עקרב אמריקני היכול לרוץ באופן זמני על פני המים.
    info: בזיליסקוס המפואר (סנאי ישו הנוצרי) יכול לרוץ על פני מים thanks לפסלים מרוסקים עם שערות שמจילים אוויר מתחת للمים. הוא מסוגל לעבור כך יותר чем עשרים מטר לפני שהוא נוגף במים. הזכר שלו מאופיין בחרש גדול בראש ובגב. כשיש לו גישה לעצים, קמפלאז'ה היא אסטרטגיית הגנה בסיסית.
  reptile.boa_constrictor:
    label: 蚺 מלכתי
    summary: נחש ים תחתון דרום אמריקני שממית בשרף.
    info: ה蚺 המלכות הוא נחש גדול ורעיל דרום אמריקאי שמשמיד את טרפו על ידי סיבוב סביבו והחיזוק של שרירי הגוף בכל נשיפת אוויר כדי למנוע ה흡 נוסף. הנחש פופולרי כחיות בית אקזוטית בשל התנהגותו הרפתקנית שלו.
  reptile.box_turtle:
    label: \"\u07d9\u06dd\u06ce\u06aa\u06cf\"
    summary: זאבים קטנים能够在龐壳内完全關閉的陸生烏龜。
    info: '{"\u07d9\u06cc\u06a8 \u06c4\u06b5\u06cd \u06af\u06ca\u06f2\u06cs}" מתרחשת בצפון אמריקה ויכולה לסגור לחלוטין את הגבורה שלה באמצעות לוח קדמי נע. היא חיה ביערות ובשדות כחיית ירקןבודדת. יכולה להתקיים יותר ממאה שנה; בסביבה טבעונית מגיעה לגיל ארבעים וחמישים שנים.'
  reptile.caecilian:
    label: גרנופוניה
    summary: זחלי תרמי безרגלים הדומה לגזר או לנמה.
    info: גרנופוניא הוא חרק זחלים טרופי ללא רגליים המזכיר גזר או נמלה לבנה גדולה. יש לו עיניים קטנות ומעוותות והוא מכוון לפי הריח והטנטקולוס (אורגאנים חושיים על הראש). חלק מהדרכים יולדין צעירים חיים ואחריותวางת ביצים.
  reptile.caiman:
    label: קימאן
    summary: كروكوديلوفيت דרומי אמריקאי שקטより קרוקודי או אליגטור.
    info: קימן עיניים הוא הקрокודילואיד הנפוץ ביותר באמריקה הדרומית. קטן מהクロקורדילים האמיתיים וגדל עד לאורך של כ -2.5 מטר. חי בנהרות טרופיים, אגמים ומתקשים ממексיקו ועדארגנטינה.
  reptile.chameleon:
    label: תנש
    summary: עוף עם כפפות ורגליים ארוכות המטפס על עצים ומצייר את עצמו בדמויות שונות של צבעי העץ והлистים כדי להסתתר מהטורפים או למשוך חיות אחרות.
    info: '{"hint":"蟒蛇科的變色樹棲蜥蜴","info":"葉鶴竜（Chameleon）改變顏色不是為了偽裝，而是用於溝通和調節體溫。它的眼睛可以獨立移動。","label":"變色龍","summary":"一種會根據環境改變皮膚颜色、眼睛可自由活動的爬行動物。"}'
  reptile.cobra:
    label: cobra
    summary: A poisonous snake known to spread its characteristic hood.
    info: |-
      קобра היא נחש רעיל מהמשפחה אלפידיים המוכר ביכולתו למתוח עור מתחת הראש לכיפה כpering预警。
      The venom (neurotoxin) paralyzes the prey's nervous system.
      The Egyptian Cobra is an emblem for both Egypt and India.
  reptile.crocodile:
    label: כְרוֹקוּדוִי
    summary: נמלה גדולה שוחה במياه ונמצאת בנהר או בגבעות המים.
    info: '{"hint":"reptil ים גדול חצי מימי (סדרת Krocodile) ואינו אליגטור","info":"קрокודיל נילי הוא אחד הפלאז הגדולים בעולם. חי באפריקה ודוגל מהמים. יש לו את הסיבוב החזקה ביותר מכל היונקים החיים.","label":"كروكوديل","summary":"חיית אדמה ענקית חיים ליד נהרות ומתקדשים."}'
  reptile.flying_dragon:
    label: דראקו מרוכז
    summary: זרע דרוםמזרח אסייתי שמגלה באמצעות סיבי חזה расширенные
    info: |-
      דרק המרחף (Draco volans) הוא זוחר קטן מדרוםشرق אסיה שמסוגל לגלוש בעזרת קרני עור מתנופפים על עמוד השן שלו
      הוא גולש מעץ לעץ כדי להשיג תחום או להימלט מהונדים
      הזכר כולל צוואר עם פlector זהוב בולט
  reptile.frilled_lizard:
    label: agyema lipit
    summary: נשורת חרקים עם פיה里斯 וריצה ثنائية
    info: אגמה ליפית היא יונק אוסטרלי שפיה הليس (העתק העור סביב הצוואר), נפתח כמגף תירחתי בעת סיכון. הוא רץ עלרגליו האחוריות בשיטה דו עוקומת כמו דינוזאור קטן. כאשר לא מודלק הפיה הליס מתכווץ.
  reptile.frog:
    label: '"זחלי"'
    summary: '"אquo תושב ירוק דופוף בעיניים אדומות."'
    info: '{"hint":"סנאי עם עור חלק שדוהר ומכורע (סדר האנוורה)","info":"ליסטווניצה רודפת עיניה אדומה היא זוחלת טרופית מאמריקה הלטינית המחיות בשתי הסביבות. מתקיימת בפסיפסים של עצים, 나는 בעזרת קרשים בין הידיים והיא פעילה בליל."}'
  reptile.gecko:
    label: '"ג''עquo"'
    summary: '"小型蜥蜴能够在垂直表面上攀爬。'
    info: '{"hint":"ящר קטן המ карабкающийся על קירות עם סנפלי אצבעות דביקים (משפחה גקונידאה)," "info":"ג''עקו ניילו הוא יastrה פופולרי ב养殖。他的腳上有數百萬個微小的毛髮，而不是膠水，讓他能在岩石和牆上行走。",'
  reptile.gharial:
    label: ג惟יאל
    summary: חסיל כריש עם מקור צר במיוחד המבוסס על דגי
    info: |-
      גוויאל הוא חסיל כריש מאינדיה עם מקור אופייני מאוד ארוך וузкий שמתאים לصيد דגים
      זכרים יש להם גידול בקצה המקור (גרה)
      הוא בסיכון קритית; חי רק בנחלים של צפון הודו ונפאל
  reptile.gila_monster:
    label: 헬로더마
    summary: עכבר ים עבה ואחרון מצפון המערב الأمريكي בעור מתולתל.
    info: הלוודרמה של גילה (Gila Monster - Heloderma suspectum) הוא אחד מהסנakes הядניים בעולם. יש לו עור מוצרי עם תבניות כתומות וכהות כpering预警. הנשיקת השן היא באמצעות חריטים בדרכו ולא שיני חלוש כמו אצל נחשים.
  reptile.glass_lizard:
    label: סנאי
    summary: "\U0001F40D סנאי – יונק חסר רגליים אך אינו נחש因为他有活動的睫毛"
    info: סנאי היבש הוא זוחל חסר שוקיים המתקיים בכל אירופה ומסתובב בקלות עם נחש. בניגוד לנחשים יש לו כיסויים נעימים ואוזניים פתוחות. יכול להטיל את הזנב שלו כדי לברוח מטורפים והזנב גדל מחדש.
  reptile.hawksbill_turtle:
    label: כריטה
    summary: שחמת ים בסיכון חמור עם מכסה צר.
    info: כרייטקה פרווה היא יונקת הים מסוכנת ביוון קритית מהמשפחה ארטמוצ'ليس. בעבר שריוןיה היה מקור לשרף; המסחר האללי גבהר את המספר שלה כמעט לגמרי. אוכלת אך ורק פטריות ויצורים ימיים על ספינות ערביעי.
  reptile.horned_lizard:
    label: סנאי מורכזה
    summary: סנאי פלוסק עם רגלי חנית בצידי הגלגול הצפוני.
    info: הסנאי המורכזת (phrynosומה) היא סנאי מישנה עם קוצים חיים במדבריות של צפון א메ריקא ומקסיקו. כאשר נמצאת בסיכון יכולה להפליג דם מהעינים למרחק מעבר למטר כ آلטנטיבי הגנתית. הסנאים נעים לא טובות ולכן מתבססות על מסכה.
  reptile.iguana:
    label: ליגואן ירוק
    summary: זוחה אדומה עם גב ייחודי מהאמריקה הטרופית מתחילה לגדול עד שניים ממטרים ועם עין שלישית על הראש שמתגלה במשיכת אור.
    info: '{"hint":"蟒蛇，一種大型草食蜥蜴，有棘刺冠（鬣鱷）","info":"綠色鬣龍是一種來自熱帶美洲的大型草食性爬行動物，體長可達兩米。\n它頭頂有一個第三隻眼睛（松果眼），對光線變化敏感。\n它是社會性的；支配等級通過推撞和身體顏色表現出來。\n主要受到自然棲息地喪失的威脅，在圈養環境中會像成年動物一樣具有攻擊性。","label":"green anole","summary":"熱帶美洲的一種大塊绿色蜥蜴，具尖銳脊柱。"'
  reptile.king_snake:
    label: נחש król
    summary: американский неядовитый змея иммунный к яду чрезвычайных и охотится на других змей.
    info: |-
      האד ה królewski הוא נחש אเมריקאי לא是有독 שיכולה לצרוך חיות אחרות עם רעלים כמו צלופחורים ורattlesnakes שהוא עמיד לרעילה שלהם
      צבעיו של הנחש (פסלי שחור לבן) מחקי את הצבעים של קוראלוס有毒。
      הוא משחק תפקיד חשוב בהפחתת האוכלוסייה שלفئות, יונים וחסילאים.
      מכך לבעל חיים פנימי פופולרי בגלל טבעו הרועש.
  reptile.komodo_dragon:
    label: .dragon קומודי
    summary: dragon קומודי היא הצב השור存最大的动物来自印尼科莫多岛
    info: |-
      דרagon קומודו הוא האליגטור הגדול ביותר בעולם וגדל לאורך של יותר משלושה מטרים והולך במשקל מעל ל - 70 קילוגרמים. בעבר חשבו שהוא杀死了唾液中的细菌；实际上它有毒素腺。它可以捕猎鹿、野猪甚至水牛。
      牠只生活在几个印度尼西亚的岛屿上，而且濒临灭绝。
  reptile.leatherback_turtle:
    label: latigrata
    summary: אוכפת ימיית גבורה בעלת חגורת עור במקומה של קרני שיני
    info: לטיגרטה הגדולה היא האוכף ימית הגדול בעולם המגיע לאורך של יותר מ-2 מטרים ומשקל מעל ל-700 קילוגרם. במקום כרונח עץ קשה יש לה עור מחוזק עם אוסתודרם קטנים. היא נעה מרחקי миграציה עצומים דרך האוקינוסים; מסע באורך כולל של למעלה ממאה וחמישים אלפים ק
  reptile.lizard:
    label: '"igrna"'
    summary: '"פולגונאי חום עם קשקשים נמצאים במדינות החמות"'
    info: '{"info":"גרען איגואנה הוא ינשוף גדול ממזרח ודרום אמריקה שמתפרנסת מ식ומני צמחיים, היא טיפוסית מצוינת והכרחנית להחזיר את הזנב שנקרעה."}'
  reptile.mamba:
    label: '".label": "מַמְבَا"'
    summary: '{"summary":"נשך שחור יחסית מהר ורעיל במיוחד מאפריקה."}'
    info: '{"info":"הממבא השחורה היא אחת הנחשות המהירות והמסוכנות ביותר בעולם.\nmגיעה למהירויות של יותר מ - 20 ק"ם לשעה בקרקע והיא מספחת עצים. \njד נווטוקסיק שלו יכול לגרום למוות תוך שעות ללא אנטי גוף מתאים. \namת שמה ''ممبא שחומה'' מגיעה מהצבע שבפנים הפה ולא מקleur הגוף עצמו שהוא אפור או ירוק."}'
  reptile.matamata:
    label: матамата
    summary: צ'לו צבא עם ראש בצורת עלים
    info: ماتמטא היא אחת הצבים המ-thumbnails יותר ביזאריות במימי החוף של דרום אמריקה الشرقית. פנימיה וראשה מחקות בדיוק עלה רטוב ואשכולת עצמה, מה שמייצר קמפלינג יוצא מן הכלל.
  reptile.monitor_lizard:
    label: וארן
    summary: זחל פעיל טרייסטי בעל לשון מספיקה.
    info: |-
      וורן הוא זוחל גדול מהסוג ורנוס עם שפת חוטמה מחולקת המאפשרת תחושה חושית חזקה יותר.
      vאראן קומודואני הנו הזחלי הגדול ביותר בעולם היום בגובה של מעל מטרים אחדי.
      vארנים הם בעלי ידע גבוה מאוד והמדע נוכח בהם בשימוש בכלי עבודה פשוטים כמו סכינים או גבישים.
  reptile.mud_turtle:
    label: צבי בוץ
    summary: טירה אמريكאית קטנה המתקיימת במياه מתוקות
    info: צבים בוערתיים (קינוסטרון) הם צבים קטנים בגודל של כ -15 ס
  reptile.mudskipper:
    label: פריפתלמוס
    summary: דג הנעות באוויר וחוצה עצמות באמצעות סיבובי החזה.
    info: פריפתלמוס הוא דג מהמשפחה הגוביאידהים שחי זמן רב מחוץ למים. הוא זז על הקרקע בעזרת כנפי חזה ניכרות כמו ברילות ומשם נשימה דרך העור לח. הדג יכול לעלות עץ מנגروف ולהגן על אזור תחום שלו תוך ביצוע הצגת התנהגות ייחודית.
  reptile.newt:
    label: '"צפע"'
    summary: '"חיית ים מתוקה קטנה עם הזדמנות לחייה במياه וגם על האדמה."'
    info: |-
      {"hint":"סנאי קטן חצי מימי עם זנב שטוח (טריטורוס)","info":"הצפרדע הגדולה היא הצפעת המרכז אירופאית הגדולה ביותר ועוברת לאורך של יותר ממאה וחמישים סנטימטרים ב trưởngותnya.
      The male displays an impressive crest during breeding season along with snake-like spots on its back.
      In the Czech Republic all newts species are protected by law.
      During winter they spend time under tree roots or burrows outside water."}
  reptile.poison_dart_frog:
    label: פראלֶסניקח
    summary: זאבים קטנות בצורות מבריקות עם יוד רעיל מאמריקה הטורפית.
    info: פרלסניצה היא זעבורה קטנה מהמשפחה דנדרובאטידיאה הנמצאת ביערות טרופיים של אמריקה الوسطית והדרומית. צבעיה הבהירים שלה (אדום, כחול וצהוב) משמשים כסימן אזהרה לяд毒 (אפוזמטיזם), ונחשבת לאחת הזועקות ביותר בעולם. עמים ילידיים השתמשו ביודם כדי להטמין חניתות.
  reptile.python:
    label: كراجتا
    summary: 蟒蛇是一种大型无毒的蛇，通过缠绕来捕食猎物。
    info: |-
      קרג'ט הוא האל הגדולה בעולם; קרג'ת המורכזת יכולה להגיע לאורך של יותר מ - שבעה מטרים
       הם杀戮 את טרףם על ידי חنق ולא רעל;הם לוחצים סביב צוואר ובטן
      temperatura יש להם חיישני תדר גבוה ( infralocha ) שמאפשרים לזהות יונקים גם בظلام
  reptile.rattlesnake:
    label: charash
    summary: זיתן רעיל עם חרוטה באוקפתו כpering.
    info: |-
      חֲרִשׁת'א הינו זיתן רעיל מקבוצת הזמינות עם חרטיק מאופיין בחרטיקה בסוף האוכף שלו.
      The rattle is made up of keratinized segments that serve to warn when threatened.
  reptile.salamander:
    label: มลก
    summary: สัตว์น้ำและบกดินที่มีผิวดวงด้วยแสงสะท้อนและความยาวของหางมาก
    info: '{"hint":"עופל חסר ציפורן עם עור רטוב ו הזנב הארוך","info":"המלוֹק השוודי הוא עוף טרומפי מזרחי אירופה עם כתמים желточерные על העור שלו. הוא מייצר תרכובות독 מהעור ונמצא ביערות לחים.","label":"מלוק","summary":"חיה דו栖 עם עור לוהט והזאב הארוך."}'
  reptile.sea_snake:
    label: adder הים
    summary: adder רעילה ממשפחת הhydrophiidae עם הזנב בשורת האוכלים.
    info: |-
      הadder הים הוא זוחל רעיל מהמשפחה hydrophiidae המותאם לחלוטין לחיי ים
       יש לו הזנב שטוף כדי לשחות בו;
      jed שלו נוירוטוקסי וחזק פי כמה וכמה מקобра אךadders הם בעלי חיים 평화롭ые במיוחד;
      dyche אוויר חייבים לעלות בצורה קבועה לפני השיט
  reptile.skink:
    label: سكينك
    summary: ящר קטן עם קשקשים מעוצבים היטב ובו ידיים קטנות.
    info: סקינקים הם משפחת ינשופים עם יותר מ - 1,500 תיפוח ומאפיינים שפין חלקים בצורת ציקלואיד. כמה מה.tipi חסרי הרגליות או בעלי רגליים קצרות מאוד. סקינקי האוסטרלי בעל הלسان הכחול פולט לسان כחוך בכחול כדי להזהיר טורפים.
  reptile.snake:
    label: adder
    summary: A legless scaled lizard having long flexible body.
    info: '{"hint":"蟒蛇是一種無腿的延長爬行動物（亞目：Serpentes），不是蠕蟲","info":"毒蛇是沒有四肢且身體細長的蜥蜴。目前已知有超過三千七百個品種；牠們靠嗅覺捕食，有些則是有毒的。","label":"snake","summary":"一種無腳、具有鱗片和柔韌身軀的爬行類動物。"}'
  reptile.snapping_turtle:
    label: צלע
    summary: צלע – זבוב טרי American alligator
    info: צב ים מתוק גדול ומר מזרחה אמריקאי עם פה עוצמתי בצורת קрюק. הוא אгрסיבי על הקרקע אךสงบ יותר במים. יכול לשקול מעל 35 קילוגרמים ולחיות מעבר לחמישים שנה.
  reptile.thorny_devil:
    label: מולוך טרני
    summary: זוהלת מאזור האוקיאנוס השקט עם עיניים גדולות ואוזניים קטנות.
    info: מולהך טרניטי הוא זוחל קטן באוסטרליה שמכסה אלפי ספוגים חדירים על גבו. יש לו יכולת ייחודית של הימסorption מים דרך העור באמצעות תעלות קפילריות בין הסכינים; המים נאספים ומובילים ישירות אל פיו. הוא אוכל רק חרקים קטנים כמו דבורות; במהלך יום אחד הואיכול לאכול עד ל - 2,500.
  reptile.toad:
    label: גוזל
    summary: עוף יבשתי עם צלקות דומה לזחל
    info: |-
      הגרוש היבש הוא הזוחר הנפוץ ביותר בČeská republika
      הגושים על גבו לא קמים כמו אצל זחליים אלא משמשים הגנה והם מקור ליצירת רעלים.
      The species migrates every year to water bodies for reproduction;
      in the country volunteers help them cross roads safely.
  reptile.tortoise:
    label: черепаха слон
    summary: животное медленно передвигается по земле со щельером в форме гребня из семейства Черепашьих (Testudinidae).
    info: '{"hint":"סנאי איטי עם קירח בצורת גג המושב על היבשה","info":"ה черепаха слон - это крупнейшая наземная черепаха в мире; она обитает на Галапагосских островах и может дожить до возраста более чем 150 лет. Щетина является частью её скелета.","label":"наземный жабан","summary":"Медленное животное с куполообразной скорлупой живущее на суше."}'
  reptile.tree_frog:
    label: росница
    summary: זאבה עץ עם пады прилипания באצבעות מתחילה לעלים.
    info: |-
      רוסניצ'קה צהובה היא זעירה של משפחת הילידיאה עם אצבעות בעלות פסיפסים המאפשרים לה каָלט על משטחים חלקים。
      בצימר קיימת רוסניצה אחת מקומית - הרואלית;
      罗斯尼察 зеленая меняет цвет с зелёного на серый или коричневый в зависимости от температуры и влажности.
  reptile.tuatara:
    label: טואאטארה
    summary: ฟอสซิลที่ยังมีชีวิตจากนิوزแลนด์ เหลือเพียงตัวเดียวในลำดับ Rhyochephalia
    info: |-
      טואטארא הוא אחד הפלוזים העתיקים ביותר בעולם; סדרו קיים מאז ימי הדינוזאורים
      הוא חי רק על איי ניו זילנד
      יש לו גידול איטי במיוחד והוא מגיע לגיל הרפיה בגילאי ١٠–٢٠ בלבד
  reptile.uromastyx:
    label: اورومستิกס
    summary: זוהרת דsertית עםしっן באג מאפריקה ומהמזרע.
    info: אורומסטיקס הוא זוחר מדברי מצפון אפריקה והמזרח התיכון עםしっן באג שמש כהגנה. זהו צמחוני טהור הניזון从来 תירס, עשב ופירות עלים. אורומסטיקים נחוצים לעיתים קרובות בטרריומים כאורגניזם חיות ייחודי.
  reptile.viper:
    label: زمית
    summary: חי ידיני זמיזים עם ראש משולש וגוף מעוות.
    info: |-
      זמית' עתידה היא הנחש הядין היחיד שמתפתח באופן טבעי בチェסכו。
      היא מ识别 על ידי הדפוס האקראיบน הגב וצינורות השן המussed שלה。
      لدירה יש כאבים ויש צורך להתייעץ עם רופא אך לרוב לא מסוכנת לדמות gesunde.
      נמצאת תחת חיסון חוקי; בČeskko אסור ללכוד אוฆ杀 אותה.
  reptile.wall_lizard:
    label: زنبב ידידותי
    summary: זנב דק ומהיר שחי בסלעים וב скаלות.
    info: זנבה אירופאית היא זנב קטן באורך של כמ"א אחד וחצי והיא נמצאת בעיקר בجنוב וצפון מערב אפריקה. בישראל פועלת על סולמות חמים או קירות ונעה מהר מאוד כאשר מתעוררת תחושת מסוכנות – לפעמים גם מאבדים את הזנב שלה.
  reptile.worm_lizard:
    label: גרווייצר
    summary: חסר השוקיים צמח קרקע דומה לジ蜈蚣عيش תחת האדמה.
    info: ג'רוויטצרים הם יונקים חסרי שוקיים נמוכי מחקר מהקבוצה אمفיסבניה החיים בטרופיקו של אמריקה ואפריקה. נראה כמו זיגאלות גדולות עם עור מפוצל ועיניים רודימנטאריות. חיים תחת הקרקע כל חייהם והם먹וני פולטרת ומחרידים.
