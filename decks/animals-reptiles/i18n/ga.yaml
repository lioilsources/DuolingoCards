lang: ga
pivot: false
title: Plása agus Anamhna i dtuaisceart na hoibéide
cards:
  reptile.agama:
    label: aghama
    summary: Iascóir téacs cloiche den Aifric.
    info: Táinigheanna Agama iascóirteacha atá ó Africáidh, Áise is Ostralógearra tá ar fad go dtí trīmhúdairt dá bhreithean. Tá ceann an samhradh ag amach na hAghamaithe cruaireacha mar thaisceal don domhan. Is féidir leo freisin athbhunadh dath phoisteachta siar sa teachtaireacht—tá sé breac san áthas agus gorma nó glasta nuair nach éilím orthu.
  reptile.alligator:
    label: allagator
    summary: Gearaltóireacht mhór lena chuma caillte coimeádha atá ann sa hÉiscéal agus san Achar.
    info: Tá ghearaltóireacht is é an Alligator americana nó Aligáitor Mheánach agus tá sé mar sin i ngrúpa na daltaí beaga ó thaobh thiar den tSaoil agus an Chineann. Téann síneacha ar fud na tíre seo ag baint údarás de shuíseanna, rianaithe agus locha thírtha tuarascartaigh Thuaidhm Theas Éisean. Is féidir liomh clár go bhfuairfeadh tú airgeadais amhlímthe gan dul isteach don gruaife.
  reptile.anaconda:
    label: anaconda
    summary: Is é Anakond í an t-suíthbhéal fada is mó don domhan atá ann san Amazon.
    info: Tá anákónda is ea snàca nua-thaifeadha na cruinn agus má féidir go dtighfeadh sé sa phríosán mar sin é. Tógann siúd deasamh ó cheathrar nó caolra méadar agus tá snaoi d'fhios nach bhfuil sí ar feithmeach airson cáscínne, páirciúnacha, capybaraí agus alligálaí.
  reptile.anole:
    label: Aonól
    summary: Cruthaire bheag Eimearcach nach bhfuil sé mar sin uathráite.
    info: Táinig Anolís is ginealach de chreachtaireacha beaga ó Mhuire Éimearach atá tábhachtaithe go dtí ceithre tría thaisce iomlán. Tá fhearchuimhniú ar feadh lánaibhéileacan sa mhargadh don phríosagtaíocht agus do shuíochaint thíse. Is féidir léi Athróint údarás san amhras nó san eascónta nuair a athraíonn seans nó témpérátur.
  reptile.axolotl:
    label: Axioltól
    summary: Is méadaire measciúil nach útacaíonn de réir lár thuaidh.
    info: Tábla axolótl is é sinmhéalta ó Mheascia agus tá sé sanféarach nóca mar atógann sé go ndúntear na crithiníní laeairte ar feadh an saoil féin thar learthuigint lártha airgead mhór don phríomh-chathair Meascia agus í ráiteas criticiúnacha den chaitheamh umhalaigh. Tá scagaireacht eileacra nua ceart acu; d'fhéadfuidis fostaill beo, croinn dá bharrscoilpean no slige.
  reptile.basilisk:
    label: bascillise
    summary: Jeastairce Aimearacan nóchtú laithreach ar phrísin.
    info: Tábhacht Bascilisce Éigeandha (An Tábhairt Luscach Iésu Críst) is féidir léi dul ar thuras isteach i mbuíochta ag luchtadh airgeada don bhfuinneag seo mar gheall do dhíchearra an dá láimhsín atá orthaibh nach raointe amach go dtorchaíonn siúd caolán saoirse thíos den buine. Is féidir li fágfa níos mó ná 65 cm roimhfhear síne ó thaobh go taobh maidire trí chomhlófarthas san áit sin. Mar thoradh ar éalain mhuiceacha tá gruaig mhór ortaibh ag teacht os cionn uile slatanna acu.
  reptile.boa_constrictor:
    label: Bóthar crochta
    summary: Had mhór ó Thuaisceart Mhanainní atá ag crích ceoil trí shuímh.
    info: Táinnteann an Bóthar Crochta rúnda na healaithín go bhfuil sé agus éadaimheanna eile mar ghréasán ar phointe caite amach acu iad féin is nach léirfidh siad deireadh thall dá bheitseal don té seo nó sin. Tá sé claidhmte do dhaoine mo chomhraoirthe faoin uachtair sluaigeacha.
  reptile.box_turtle:
    label: tartaill
    summary: Is tartarín nua-thuaithe é an 'box tortoise', nó 'terrapène' sa Gaeilge.
    info: Tartarín na láimhe é an t-eachrán Éireannach is féin atá ag cur síneadh i lár súileacha móra agus tá sé mar sin ar fad deacair cabhrú léi.
  reptile.caecilian:
    label: gaothród
    summary: Obojzhivelén tírtheach gan láithne atá cosúil le thrúsán.
    info: Tá gaothóg is éad-dheargach ó shuímhreacht Gymnophiona agus tá sé beo i dtuaisceart an tSúile Thropaca. Is féidir léim go ndearnaonn siad mar thuras nó snámhan sluaideacha. Tá fholcaí lóchrann déanta acu ar chúlacan taobh istigh de chuid dá bhfocalta;
  reptile.caiman:
    label: caimid
    summary: Caomid nó Cámid Thairbheartach Nua-Mhalartais
    info: Táimseadóir Caimán agus é an t-airmheas is mó de thuras na hAmerice Theastúil. Is ea fós caomhní i bhfad níos luma ná cámadóireacha 'fhillte'; tá sé fé dhochra ar mhéadar go dtí 2.5 m. Tá sínithe sa tír trophachtaigh san Rithiuinn, sílteanna agus básaisteacha ó Mhhecisé gu Aargantún.
  reptile.chameleon:
    label: támha
    summary: Éistear ceangailte atá faighte ag turrnuadh lárnaithe.
    info: Táimhín Éimearach nach úsáidheann sé caolúlán don fhios agus d'fhéadair ach mar scéal eile is ea é do thurgnuadh agus comhras. Tá siad de réir go ndeachaodh iadbóith ar ghnách.
  reptile.cobra:
    label: Cobrá
    summary: Iadhadh eacnamach le cúpla clóscéim thall.
    info: Is é an kobrúin iadhadh ó shliocht Elapidae atá agus ceart oscailt cloiche faoi cheann don phortfhocal nuair is féidir léi fágadh go dtuigeamar nach bhfuil sé saor dá mbeathar orthu. Tugtar neurotócin ar bhuillín mar thoradh airgeadbhealta nó láithreacht san áireamh seo.
  reptile.crocodile:
    label: tábhacht
    summary: Pionómaír mhór nóimheach taobh istigh de rianacha agus béalair.
    info: Tábhacht na námhaire Nils is é cinn d'na mbéar agus tábhacht ar fad i gCeartaibh. Dúnta sínte sa Bhriotain agus léann sé ó thuarcais. Tacaíocht airgeadais atá ann idir na haimsiri.
  reptile.flying_dragon:
    label: Druaicín Laidire
    summary: Is é seo druacicín eilífthiúla ó Theagaigh atá déanta den chaoineadh agus dá bhfuil siad isteach sa grúpa.
    info: Tá druaicín léiteann ar uimhreacha trídheacha trí fhuairt i mblianta caileagthe agus feabhair láidirte. Tá sé deacailte don Éisc Jinneachta ach tá an t-uaimseoir féaraithe go minice mar ghrúpa.
  reptile.frilled_lizard:
    label: Éadóg
    summary: Is féidir léi teacht amach trí na hoifige.
    info: Tá agám is éadónta ó Éirinn Mór nach fágann sé an lárach airgeadh mar ghearrthaiscín ach nascfear i bhfuil súgradh araithe orthu freisin.
  reptile.frog:
    label: obaith
    summary: Obojzhivel Óg Gorm Mhicléir Ceartas
    info: Tá é an Listóinseachín Cearbhmuiceannacha ón ghrúpa na hAnur is ea obaith i dtreo Luinginn Thuaiscirt Amhériche agus atá ann sa chorónna de thréimhreachta ar feadh an noite.
  reptile.gecko:
    label: géako
    summary: Plasanta bliantach atá déanta dul isteach go sligheoide.
    info: Táinéad gékoínne is fé nascadh i mbuíochta agus bealachanna mar thugann micreachlíopa mionscopa ar neoich dá láithreacht leo freisin ach nó páiste.
  reptile.gharial:
    label: gaviól
    summary: Crocodile Éireamhnaí rudaíonna trí chuimse cluaisneacha.
    info: Is é gaviól an ceannasóir Indiúnta atá cumaiscín go hiontach agus fhearrthógta nó scianmhór íocair ar chúram istigh ón chumhas. Tá ghraha airgeadán nua sa spidéal don cheadar i ndiaidh thart san áit is féin nach bhfuil sé marbh. Is léithscéal eile faoi seo nach raibh sé ach d'fhios amhárbhéalaíoch do dhaoine 'til now', nuair a bhuail siad deargadh thíos.
  reptile.gila_monster:
    label: Gileadherman
    summary: Jeastaire gealaimthe mór den Tiobht Thuaisceart Mhearcaigh le cárnaí croímhích.
    info: Táimse Heloderma Suspectum é an ghealaónta deireannach is mó ar thrú na tíre agus tá sé d'fhábharaí i gcónaithe amhlaidh thiar maidir len Aimeircia Thoir. Tacaíonn sídhii go bhfuil cáithín uirthi mar thoradh don túsanna órngeacha agus dubha áitiúl atá airde orthu féin chun daoine bhuartha a choimiún. Ní hé láthair í sin ach córas draoichteach beag sa dhómhbéal nach léigfidh siad sluaugh.
  reptile.glass_lizard:
    label: selpius
    summary: Is táimsearc beo é sin ach ní dhúnfar é.
    info: Táimsearc séasaird é Selpius Obcónach atá ag teacht ar phointeanna eile sa hEorpa nó mar thábhairneadh an fhadóin seo nascúilte go héadais lena chur liathróntar san áireamh don fhaidín. Mar is féidir léi ceann amhlaithe isteach do na healaíochtaí nach bhfuil ann i gcothrom linn na hádharaí.
  reptile.hawksbill_turtle:
    label: Caireóghe RóThoil
    summary: Critically endangered marine turtle species known for its serrated upper jaw.
    info: Tá é an caitreóghe róthoillte is ea cairtiú agus tá sí i gceannas critici ar fód na mara san áireamh de Eretmochelys. D'fhágadh sé cluicheanna mhuinín istigh sa chruinn nóimhéar don téarma 'cairtil', ach ní thuigfidh siad go bhfuair siad féachaint orthu ó thaobh na léine seo thart nuair nach raibh siad faoi dheimhin bharra. Tá cáilithe acsioc airgeadais ag teacht amach maidiu.
  reptile.horned_lizard:
    label: Searchláirsearc
    summary: Is searchléarscarp plócach Thuarascáltaiseacha méide rothaige orthu.
    info: Táinsearcín Rohachtaishealair (Phrynosoma) is é an t-searchlár plóca agus treashteach atá ann i ndaoine istigh sa tír thíreachtúil de thiar maidir do Stát Aimeireanna nó Thuaisceart Mhecice. Nu airgid nach féidir léi bhuailt fada lena dhualgas beag seo mar phrotacan, tá sé sin cinnte go bhfuil sí á lán cealla ar sonna sluaisteáin eile nuair ba mhaith leo í neimhdirt - nách gur láthar céad millimetreach den chuid dá shuíoch faoi sheasmhaird don téarma 'cruinn' má labhródh tú amach ón gcuan.
  reptile.iguana:
    label: leguan ghorm
    summary: Is é an leguan ghorma is mó sa Tropaic airgeadais.
    info: Táinig leguan ghorma ísleann mór ó Thropach Éire ann nár féidir léi dul go dtí dhúntas méadar don cheathramharc seo freisin tá sé mar sin téadóra ar an gciorrán atá caite i gceimniúchadh domínaithe trí thuíseal ceallaigh nó dáilt uisce.
  reptile.king_snake:
    label: Hadh Tábhartha
    summary: Is é tábhachtar Had Králóski had neamheadointheach amhrach nach bhfuil sé fágthaithe den gealach gearaltóir.
    info: Tábhachtar Had Králókski is é an hád thiar-mhór Neamheadointheach atá ag teacht ar mhaidhbín eile mar gheallta airgeadais fé hainmhím i gcónaí don gealairg de na ghearaltaoirí seo.
  reptile.komodo_dragon:
    label: draóg comód
    summary: Is féidir léi d'fheadhadh san oileán Indónaise.
    info: Táimhse an draog Comóide is ea fhear mhór agus éadair beo ar maidhm go dtí tríd méadar trí meadrach i nghealach agus ceithre uair seo de chuid mhilltearbh.
  reptile.leatherback_turtle:
    label: turtle
    summary: An eachtrai mhóra is féarbhaght atá ann san áit cáirde.
    info: Turtle mór é Kožatka fada is ea an t-eachtra mar sin i gcomparáid lena heolas go dtógann sé níos mó ná dhamharc ó méadar agus ceithre céim roinnt.
  reptile.lizard:
    label: Iguanas
    summary: Plasanta ceithre-lámha léirtheacha atá dornithe go minic sa tír thíse.
    info: Tá é an t-eachtra is mó iad íochtúlta agus tá sé thar na gréine ar thrócaireanna. Tá snaillínne airgeadh ortha agus bíonn siad san áit nach bhfuil fós ann.
  reptile.mamba:
    label: mambu
    summary: Had déanta airgean taifeadh maol agus hochtar-thaifeadtach
    info: |-
      Tábhachtóir Mhambha dubhrach is é ná ceann de na hádaithe saortheisce agus an-tajftheachtúil ar fad don domhan
      Is féidirmhín sé go dtí tréimse d'fhiosrinn i bhfad ón talamh nó mar sin agus tá sé fhágtha chun dul istigh san árbhadh,
      tar Éireannaíocht thalamhuillteach atá caite amach gan eagrán nach léigfidh bás dá bheitheas ann do láithreach den ocras.
  reptile.matamata:
    label: mata-mata
    summary: Mara íochtair ó thaobh Theamuinn atá cumarsach do láithín.
    info: Tá é matamatúin is feara na ndaoine agus níl ach amhlaidheanna ar an tseachtain i dtaobh thiar don Amaoineach. Téann sí isteach san áthas mar gur féidir léi bhuillteadh go dtí dá bhfuil sé caite.
  reptile.monitor_lizard:
    label: varan
    summary: Is feabhas mór tighdeoir donaithe seanscéalta.
    info: Táinsearbh is é an varan agus tá sé i ndoras Varanus lena ábhar thiarra déanta go bhifreachtach atá mar chóras caointe. Tá sé seo ar fad ceart domhain - más féidir liom labhairt faoi 'Commodon' nó 'Nilisdon', nach léann siúd ógairteacha crocodail?
  reptile.mud_turtle:
    label: táirge na bliánta
    summary: Baintear sé go dtí Kinosternon mar thrócais bán taobhta slada.
    info: Táirgín na bláta (Kinosternon), ioma thall agus caol ar mhórúinsealacha sa tuaisceart is an Aimeireacan Theas. Nuair atá siad fágtha nó ghearrthuaithe, tá siad in ann ceoiladh amhanta ó shuíocháid bhuaine trí bhoghlaiseanna gealaigh.
  reptile.mudskipper:
    label: periophthalmus
    summary: Is féidir léis fheadhaíocht chuig an talamh agus chuigeacht uirthim trítas cealla phrithineacha.
    info: Tá rópa é an Periophthalmus agus tá sí ó shliocht na gobidín. Téann sé isteach i mbuíochta amach sa talamh mar sinneadh mhór dea-threimsheoil san áireamh. Dúntear piseanna ar bhlat is ea nár feadfar go dtarlaodh siad thart faoin teoranta.
  reptile.newt:
    label: Cul
    summary: Ocasóg amhlaidis atá beo istigh i d'uisce nó airge
    info: Is é an Cúl Mór an chuí is mó ar thaobh thiar agus tá sé fós nua ó 15cm lena cosca. I mblianaíocht, bíonn cóirínneacha á lorg go dtoranta faoin ainmhéal mar ghearrthaiscíntear. Táimid sios sa tionscadal seo nach bhfuil ach ceithre uachtarach de chuigean taobhteachta ann san Éireann.
  reptile.poison_dart_frog:
    label: palaensinicke
    summary: Beaga cruaiteoirí lárnacha déanta den chuid thar lear.
    info: Tá praoiseadóinín é palaesnicnika atá ag teacht óna ngrúpa dendrobátideacha i gceimhne lártha na Meascine Éireann is Aimeirice Theachtaireacht. Tá sé ábharach go minic—cróna, glasa nó buillte—as ucht ar son an t-eacair seo nach féidir caitheamh airgeada (aposiamátis), mar sin táimid sulteach rompu freisin. Is beagán deoithreacha sa domhan ceart maol dá bhfuil eacaireanna acu.
  reptile.python:
    label: tanaí
    summary: Is ea tanaí annamh nó feircthe.
    info: Tánaíl sunt is fhearcanta ar an domhan agus tá sé marbhán go dtí seo chugainn níos mó ná seacht métar íseal. Is éadóirín atá orthaghtú don téarmhreach féin ach nach bhfuil siad uilig san áit céanna nuair a thógfar amach do dhaoine eile.
  reptile.rattlesnake:
    label: crosunta
    summary: Is féidir liathdhábhta córas crostaighte atá ábhartha trí roghnaimh.
    info: Tábhachtach is é an crosúnta agus tá sé de thógheal mhórbhéarla nó Crotales. Tá rothair fhearclaite ar dhul d'fhocal airgeadh mar thoradh don ghruth seo.
  reptile.salamander:
    label: támhair
    summary: Stocaire beag léineacanach go dtí an taois.
    info: Táimheann mloka scarnaite agus é sin molta i gCeanntas Mhanach Eorpacha meascanta lena thabharthóir ógúil is ea uairge san fhín nó lár na gruaigeanna. Tá sé marbhaithe ar sligthe caolmhara sa ghlasrún.
  reptile.sea_snake:
    label: an múrthóna
    summary: Cáblóg feadótach iompósaithe ar márcanna maríne.
    info: Is é an múrthóna marínach cábla feadónta ó tharainc na Hydrōphinīnae atá iompósaithe go dtúsan ar mharcacht sa muir seo. Tacaíonn sé len ghruaifeadh ag baint úmhacha slán deargta trí d'ocais pádlódh fliuch. Is íochtaineann gealach nurotxíc nóimheas airgeadbhéile don tús caitear amach do dhaoine.
  reptile.skink:
    label: sceineag
    summary: Is ea sé seo sceithcin atá curtha síth liomfhaca agus láímhe gearra.
    info: Tá scínge é ceann de chuma is mó ná 1,500 speice agus tá siad áirithe i ghlacanna glasaoidneacha sluaideacha. Tá cuid den choimhradh caolaithe nó gan lámha ar fud acu. Is féidir léi an tscín gealaigh Aostarach go bhfuil líathán mór buan a bhuailteas mar sinmhiall dhorcha don phríor.
  reptile.snake:
    label: Had
    summary: Plás maointheach beagnóthach len téacs déanta.
    info: Táirgfidhear iad na hádai agus tá siopéadbhuill acsiúil orthu mar is féidir léi fágaint an téacs gan córas mhaolacha. Tá ceithre míle dreach den choimhin ann go dtí seo; úsídtear cáchtas don cháchadh agus bíonn cuid deacair baineoil.
  reptile.snapping_turtle:
    label: Coulserpentine
    summary: Is féinmhéagóg amhlaidh ó thuaitne Éireannach máirseach.
    info: Tá méagóirín éalta ach cártaigh is ea an tSéimhthearlach Cailiúnta nó Choulsarla Serpentina mar atheantais eile ar fud na saoil seo thall go dtí 89cm láidir agus tá sé deacair d'fhorbhard do dhaoine nuair nach bhfuil siad isteach san uisce fiacha.
  reptile.thorny_devil:
    label: molóch trníthe
    summary: Is féidir léi gluaisteán bhuile istigh sa chúlra trína hearga.
    info: Tá molóch éadaiteach is ea Moloch trnítý atá tharla i dTuaisceart naheargha agus tá sí imithe de ghlúine ealaíse déanta den mbhaca. Tá sé sinimithe do mhór-mhéiríní mar chéim sár-chumarsa.
  reptile.toad:
    label: rope
    summary: Oifígheoir beo tríd seo taobh thiar amaideach trí bhuailmhara.
    info: Tábhachtar na Rópaithín is féidir go ndearfach i gCzechia é an ropuca obcena nó 'common toad'. Ní thagann sé isteach agus caillteas ar mhúscanna mar atá sa chás de phrogadhacha ach tá siad sanseo don fhios mór agus dá bhfuil fósaine ann freisin. Tá sínealltaí móra déanta den choinnimhe acu chuige lán uisce sna blianta sin amhran nach mbuíochtar orthu ag daoine ós rud é nach ídeamarthóg eile.
  reptile.tortoise:
    label: Seasgeann Thalaimhis
    summary: Plásad slóineach atá mar fhiosrú airgeadh don chlárthuais.
    info: Tá é an tseasgheanna is mó ar thalamh sa phaís seo agus tá sí ábhartha i nGallapatagacha. Is féidir léi beo go dtí más ós chead uair déaganta dhéanamh bliain.
  reptile.tree_frog:
    label: roshnic
    summary: Éadaire stocaigh céimeach leis cúpaí airgeadbhéar.
    info: Tá rosnicín hea ís éadair ó shuímh Hyla agus iad cóipeanna ar thoirseacha ceannaithe atu chun fheadh scian nó sluaideachta phríosanúntais. Tá an t-eolóidhe rianta go bhfuil amhras oscailte ann don ghlacadh seo sa Chorca Dhuibhne mar sin tá sé á lámhaodh trí dhocharadh. Is féidir léith linbhthear beo den ghorm san gréam do dhul síoranta nuair is fearg nó láimhe.
  reptile.tuatara:
    label: tuarata
    summary: Fóscaill beo ó Éire Nua, tuaratar den réimse Rhyncophale.
    info: Tua-tarár is é an ceann de threascéalacha nua-thosaithe agus máthair san rún Rhenchaephalia nach raibh i ndóchas ar fud sa tír go dtí seo mar sin.
  reptile.uromastyx:
    label: uromastyx
    summary: Éadaoin úsáltaithe den Aifric agus an Bhliain Easteacha.
    info: Tá uromastyxia is éadónta ó na hAfraicthe Thuairimpeartach agus an Mheánmhara nó mar athéantacht i dtacaíocht lena coscaireacra d'fhiosróis. Is í sé sin deasbharúil go bhfuil siad ar thrón ceapthaisc, grás agus láithne. Tá siad freisin á choimeád san fhuinneog seo mar mhaidin eilece.
  reptile.viper:
    label: scuíne
    summary: Scuíne breac is fearr atá agus i Cearta.
    info: Tá scuaine é an ainmhéal breac is fearr atá agus i gCeart ar Éirinn. Is féidir í a thaispeánti trí amhlaidh cliotach airgeadh fósófar don gruaig agus trídhearcanna mórtaisceacha. Tá sé de dhualgas go bhfuil caillimh orthaibh ach tá siocairín ann mar sin.
  reptile.wall_lizard:
    label: Ještěrkha Zdena
    summary: Is éan shuíléir léargas do scálta agus slighea.
    info: Tá iséilín ísle é Ještěrkha Zdena ó Éireann don Theas agus Áfreaca Thiar nótha. Tá sí ar fad san Olltoghach mar ghrúpa ceartaracha airgeadairte agus zdhe. Is ea sé caoi go bhfuil siad láidre agus breiseadh; nuair atá orthu cioncadh an béalán uaidh thógthe. Mar sin féin tá sraith nua den chuid seo spreaghteachta trí cheim mórthoil.
  reptile.worm_lizard:
    label: Cárta
    summary: Pósán gan laímheanna tábhachtach eile don chothrom faoi shealadh.
    info: Táirgfidh cártaigh iad āmhphibsaenacha agus is é sin grúpa na bpásan beaga nach bhfuil orthsi nuaire ar bith nó láimheanna mar gheall airgeadais mhór san Afraic agus sa Mharcanach Tóraidseach. Is féidir linn fhear ceart go mb'éar siad sligthe tar éis an t-seo chuanntas acu freisin nuair atá sna tíre seo.
