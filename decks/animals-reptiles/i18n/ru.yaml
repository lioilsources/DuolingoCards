lang: ru
pivot: false
title: Рептилии и амфибии
cards:
  reptile.agama:
    label: агама
    summary: Цветная скальная ящерка в Юго-Восточной Европе
    info: Агамы - большая семья ящериц из Африки и Азии с более чем 300 видами. Мужские агамы красноголовые имеют выразительные оранжевые головы и голубое тело как сигнал доминирования.
  reptile.alligator:
    label: аллигатор
    summary: Большой рептилия с круглым носом обитающий в США и КНР.
    info: Американский аллигатор - один из двух живых видов аллигатора; второй представляет собой меньший китайский аллигатор.
  reptile.anaconda:
    label: Анаконда
    summary: Самый крупный по весу представитель семейства полозообразных из Амазонских болот.
    info: '{"info":"Зеленая анаконда - самая тяжёлая змея в мире; у некоторых особей масса может превышать 90 кг и длина достигает от пяти до шести метров."\"Она обитает во мховых болотах и реках тропической Югоамериканской области."\"Это полуводное животное охотится на рыбок, пернатых существ, капибара и аллигиаторов."\"В отличие от прочих родственных видов она рождает живое потомство (вивипарность)"}'
  reptile.anole:
    label: анолис
    summary: Малая американская ящерка меняет цвет; самцы имеют заметные лапки.
    info: Анолисы - это род маленьких ящериц из Америки с более чем 400 видами.
  reptile.axolotl:
    label: аксолотл
    summary: Мехиканская водная саламандре сохранившая ларвальные признаки всю жизнь.
    info: Аксолотл – водная саламандра из Мексики, проявляющая неогению и сохраняющая личиночные черты на протяжении всей жизни включая внешние жабры.
  reptile.basilisk:
    label: базилиска
    summary: Американская ящерица умеющая кратковременно бежать по гладкой поверхности.
    info: Островерхий басилиск может пробегать по воде благодаря выемкам на пальцах с перепонками, которые улавливают воздух под поверхностью воды. Так он способен преодолеть до двадцати метров перед тем как окунуться в неё полностью.
  reptile.boa_constrictor:
    label: королевский анаконда
    summary: Большая южноамериканськая змея задушает свою жертву телесным объемом.
    info: Королевская коралловая змея – крупная неядовитая южноамериканская змея. Добычу она убивает тем, что обвивается вокруг и при каждом выдохе добычи усиливает давление мышцами, чтобы помешать вдыханию воздуха. Из-за спокойного характера это популярный экзотический питомец.
  reptile.box_turtle:
    label: коробковая черепаха
    summary: маленькая земляная черепаха может быть полностью заключена внутри своего панциря
    info: |-
      {"hint":"земная черепаха с возможностью полностью закрыться в панцире","info":"Коробчатая черепаха - это пресмыкающееся из Северной Америки способное полностью закрывать свой панцирь подвижными передними пластинами.
      Она обитает преимущественно на лугах и в лесу как одиночный вид животного мира.
      Может жить более ста лет;
      в дикой природе живет от 40 до 50 лет.
      В США она находится под защитой,
      mногие штаты запрещают сбор этих существ прямо из их естественной среды."}
  reptile.caecilian:
    label: червообразник
    summary: Безнижний теплический охотничий рептилии напоминающий черва или гадюку.
    info: Червовидный земноводный животный без ног из группы Гимногиона малоизучен и живет скрытно в тропических регионах. Он выглядит как крупная ного или бледная змея с маленькими уменьшенными глазами ориентируется по запаху и тентацилам - органы чувств на голове некоторых видов рождают детенышей а другие откладывают яйца.
  reptile.caiman:
    label: кайман
    summary: Югоамериканская разновидность крокодила меньшего размера чем обычные виды.
    info: Кайман с бинокулярными очками - самый распространённый крокодиловец Южной Америки. Он меньше настоящих крокодильев и достигает длины до двух метров пятьдесят сместеров. Обитают в тропических реках от Мексиканских территорий до территории современной Армении.
  reptile.chameleon:
    label: хамелеон
    summary: Ящурок с подвижными глазами и меняющей цвет кожей.
    info: Хамелеоны не меняют окраску для маскировки, а чтобы общаться и регулировать температуру тела. У них глаза двигаются независимо друг от друга.
  reptile.cobra:
    label: кобра
    summary: Ядовитый змей с характерным капучио и угрожающим жестом.
    info: Кобра - ядовитая змея из семейства элафидов известная способностью раскрывать кожу за головой в виде капюшона как предупреждение.
  reptile.crocodile:
    label: крокодил
    summary: Большой древний пресмыкающийся, живущий у рек и болот.
    info: Нильский крокодил является одним из крупнейших рептилий в мире. Он обитает в Африке и охотится из воды. У него самые мощные челюсти среди всех живых животных.
  reptile.flying_dragon:
    label: летающий дракон
    summary: Ящурка из Юго-Востока Азии может плыть в воздухе при помощи кожи между длинными рёбрами как параходик.
    info: '{"hint":"ящура, парашютирующая с помощью вытянутых реберных мембранов (Draco volans)","info":"Летающий дракончик (Draco volans) - маленькая ящурка из Юго-Восточной Азии способная планировать благодаря кожаной перепонке натянутой на удлиненных рёбрах\nПарашютится от дерева к дереву для получения территории или убегания перед хищниками\nСамец имеет выраженный желтый шейный лоскут\nНе летает активным взмахом крыльев; только скользит","label":"летающий дракончик","summary":"Малая юговоэасточном азиатская ящурка парашютующая посредством удлинённых рёбер."}'
  reptile.frilled_lizard:
    label: ящурка с каймой
    summary: Распространяет драматическую щель и бежит на двух ногах.
    info: Ящурка с каймой - австралийская рептилия, у которой кожистая складка вокруг шеи раскрывается при опасности как предупредительный сигнал.
  reptile.frog:
    label: лягушка
    summary: Зелёный прыгающий земноводный животный с красными глазами.
    info: Черноокая лягушка — тропическое земноводное из Латинской Америки. Она живёт в кронах деревьев, летает при помощи кожистых перепонок между пальцами и активна ночью.
  reptile.gecko:
    label: гекон
    summary: Мелкий ящериц, способный лазать по вертикальным поверхностям.
    info: Гекон пятнистый популярен как террариумное животное. Он держится на скалах и стенах благодаря миллионам микроскопических щетинок на ногах, а не клею.
  reptile.gharial:
    label: гавиал
    summary: Крокодилий вид со сверхузким носом специализированным под ловлю рыб.
    info: Гавиал – крокодил из Индии с характерно очень длинной и узкой мордой, приспособленный для охоты на рыбу.
  reptile.gila_monster:
    label: гилева змея гелодерма
    summary: Ядозубый толстокожий хамелеон юго-запада Америки со мраморной кожицей.
    info: Гилевая змея Гелодерма (Gila Monster Heloderma suspectum), является одной из немногих ядовитых ящериц мира с коралловой кожей и оранжевой полосатостью как предупреждающий сигнал.
  reptile.glass_lizard:
    label: слепыш
    summary: Бесногая ящерка, которая не является гадюкой; она имеет двигательные века.
    info: Обыкновенный слепыш - бесхвостая ящерица, обитающая по всей Европе и легко путающаяся с змеей. В отличие от змей он имеет подвижные веки и ушные проходы. Он может избавляться хвостом в качестве защиты (автотомия), который затем снова растет ему заново.
  reptile.hawksbill_turtle:
    label: правая каритетка
    summary: Критично эндемичная морская черепашка с тонким длинным клювом.
    info: Правая кариетка - это морская черепаха из рода Эретмохелис находящаяся в состоянии крайней угрозы исчезновения. Исторически ее панцирем была источником желе для производства лаков и других изделий; нелегальный бизнес почти вывел её из обихода. Она питается только грибами и другими организмами на коралловых рифах.
  reptile.horned_lizard:
    label: рогатый хамелеон
    summary: Плоский шипастый дракон с рогами на голове в американских пустынях.
    info: Рогатая ящерица (Phrynosoma) – плоская колючая ящерка из пустынь юго-запада США и Мексики. При угрозе она может выстреливать кровь на расстояние более метра как защитный механизм. Ящерица плохо двигается по земле и полагается на маскировку.
  reptile.iguana:
    label: \U0437\U0435\U043b\U0435\U043d\U044b\U0439 \U0438\U0433\U0443\U0430
    summary: Крупный зелёный хамелеон тропических районов Американского континента с острыми гребнями.
    info: '{"hint":"\U043a\U0440\U044b\U0448\U0435 \U043f\U044c\U0449\U043e\U0436\U043d\U043e\U0434\U043d\U044b\U0439 ящур с шипастым наростом у головы","info":"Зеленый игуановый леопард - крупная травоядная рептилия из тропической Америки длина которой может достигать двух метров. У него есть третье глазное отверстие в области темени чувствительное к световым изменениям. Это социальное животное; иерархия доминирования проявляется при помощи толчков головой или изменением цвета кожи. Основной причиной его вымирания является потеря естественной среды обитания; в неволи он становится агрессивным взрослым особью."}'
  reptile.king_snake:
    label: королёвская змея
    summary: Неядовитый американский змейка с иммунизацией от яду кобр, охотится на других змей.
    info: '{"hint":"неядовитая змея, питающаяся другими змеями включительно чёрных коралловых ужей","info":"Королевский питон - неядовитый американский змейка способный потреблять другие ядовитые змеи, в том числе и кобры, против их яда он иммунитет\nЕго окраска (черно-белые полосы) подражает ядозубному коралику\.\nОн важен регулирует популяции мышей, птиц и пресмыкающихся\.\nЭто популярное экзотическое домашнее животное благодаря мягкому характеру."}'
  reptile.komodo_dragon:
    label: комодский варан
    summary: Самый большой из современных видов ящерок с острова Комодо.
    info: Комодский варан - крупнейшая живущая ящерица длиной более трёх метров и весом свыше семидесяти килограммов. Ранее считалось, что он убивает животных бактериями во рту, но на самом деле имеет ядовитые железы. Он охотится за антилопами, свиньями даже быками.
  reptile.leatherback_turtle:
    label: кошачья
    summary: Самый большой вид морской черепахи со скорлупой кожи вместо жёсткой корочки.
    info: Кожистая черепаха – самая крупная морская черепаха в мире длиной более двух метров и весом свыше семи сотен килограммов. У нее нет твёрдого хрящевого панциря, а есть кожа с усилением из маленьких косточек (кожночелюстные образования). Она совершает огромное путешествие через океаны; зафиксировано перемещение на расстояние больше шестнадцати тысяч киллометров.
  reptile.lizard:
    label: ящерица
    summary: Четырехногий чешуйчатый пресмыкающийся, распространенный в теплых регионах.
    info: Зеленая игуана – крупная ящерица из Центральной и Южной Америки. Питается растениями, хорошо лазает по горам и способна регенерировать оторванный хвост.
  reptile.mamba:
    label: Мамба
    summary: Быстрая высокоядовитая африканская древесная змея.
    info: '{"hint":"быстрый высокоядовитый африканский деревянный змейка","info":"Черная мамба является одной из самых быстрых и ядовитых змеи мира.\nОна достигает скорости более чем в 20 километров на час по земле и способна лазать по деревьям.\nЕе нейротоксический яд без антител вызывает смерть за несколько часов.\nНазвание черной мамбы происходит от окраски внутренней части рта, не цвета тела (которое серо или оливкового цвета)","label":"Мамба","summary":"Быстрая высокоядовитая Африканской дерева Змея."}'
  reptile.matamata:
    label: матамата
    summary: Странно выглядящая ямайская черепашка имитирующая листовой мусор.
    info: Матамата - одна из самых странных пресноводных черепах юго-востока Южной Америки.
  reptile.monitor_lizard:
    label: варан
    summary: Большая активная хищническая змееподобное животное со сплюснутым язычком
    info: |-
      Варан - это крупная ящерица рода Варавнус с раздвоенным языком для обоняния
      Комодский варан является самой большой живущей на сегодняшний день ящеркой размер которой превышает три метра по длине
      У этих животных высокий уровень интеллекта и учёные зафиксировали их использование простых орудий труда
  reptile.mud_turtle:
    label: блатьевая черепаха
    summary: Маленькая американская пресноводная полуводяная черепаха.
    info: |-
      Блатьевые черепахи (Киностернон), это небольшие пресноводные полуземляничные черепахи Северной и Центральной Америки размером около 15 см
      При угрозе они выделяют сильный запах из пахучих желёз.
      Они могут переждать засуху зарывшись в грязь во время гипобариию.
      Это всеядныe животные которые едят насекомых, кротов и водную растительность.
  reptile.mudskipper:
    label: периофталмус
    summary: Рыба хождение на суше и лазание по деревьям благодаря плавникам.
    info: Периофтальмус – рыба из семейства камбаловидных, которая проводит большую часть жизни вне воды.
  reptile.newt:
    label: чёрная
    summary: Худощавое тело полоскаться по воде и суши .
    info: '{"hint":"малый полуводный саламандр со сплюснутым хвостом ( Triturus )","info":"Чернобрюхий тритон - крупнейший центральноевропейский вид длиной более чем на 15 см .\ n В период размножения самец гордится выразительным спиной и пятнышками , как змеи . \ n Во всей Чешской республике все виды черноспинных защищены законодательством . \ n Зиму он проводит под корнями деревьев или в норах вне воды ","label":"черноволосая","summary":"Мелкий хвостатые амфибии живут во воде и суше."}'
  reptile.poison_dart_frog:
    label: лесная жаба
    summary: Маленькая ярко окрашенная ядовитая лягушка тропической Америки.
    info: Пояснительный текст
  reptile.python:
    label: питон
    summary: Большая небьющаяся змея из рода Python.
    info: Коралловые питоны - самые длинные змеи в мире; полосатый королевский питон может достигать длиной более семи метров. Они убивают свою жертву путем сдавливания и не ядом; они обхватывают шею и туловище своей добычи. У них есть теплочувствительные рецепторы позволяющие определять теплоносителей даже во тьме.
  reptile.rattlesnake:
    label: черчестыш
    summary: Ядовитая змея с шумящим устройством на конечном участке хвоста как сигнал тревоги.
    info: '{"hint":"ядовитый змей с хвостовым колокольчиком из рода Crotalus","info":"Черчестыш - ядовитая ужовая змея со специфическим щелкающим органом на конце хвоста.\nЩёлкатель состоит из кутикулированных чешуй и служит предупреждающей сигнализацией при опасности.\nОн имеет тепловые рецепторы в виде пазух для обнаружения теплокровной добычи даже во тьме.\nЕго укус требует немедленного медицинского лечения."}'
  reptile.salamander:
    label: млек
    summary: Амфибия с гладкой кожей и длинным хвостом.
    info: Млек пятнистый – защищённая центральноевропейская амфибия с жёлто-чёрными пятнами. Он выделяет ядовитые вещества через кожу и обитает во влажных лесах.
  reptile.sea_snake:
    label: морская змея
    summary: Ядрыстый хвост с ластообразным концом.
    info: Морской змея - ядовитая пресмыкающаяся из подсемейства гидрофов, полностью адаптированная к жизни в океанической среде.
  reptile.skink:
    label: сцинк
    summary: Ящер со светлыми блестящими чешуйками короткие ноги.
    info: Сцинки – большая семья ящериц с более чем 1 500 видами и отличаются гладкими циклоидными чешуями.
  reptile.snake:
    label: змея
    summary: Чешуеносное пресмыкающееся без ног с длинным гибким телом.
    info: Змеи – это пресмыкающиеся с вытянутым телом и отсутствием конечностей. Существует более 3 700 видов; они охотятся по запаху (орган Якобсона), а некоторые ядовиты.
  reptile.snapping_turtle:
    label: крокодиловая черепаха
    summary: Большая агрессивная американская пресноводная черепаха со стойкими челюстями.
    info: Крокодиловая черепаха – крупная агрессивная пресноводная черепаха Северной Америки с мощным клювовидным ртом и длинными ногами на плавниках. На суше она особенно опасна для человека из-за своей злобности в борьбе за пищу или территорию.
  reptile.thorny_devil:
    label: малый щетинистый молоч
    summary: Австральский хищник покрывает тело жесткие иглы для сбора воды.
    info: Молох колючий – маленькая австралийская ящерица с острыми шипами на теле. У нее удивительная способность поглощать воду через кожу при помощи капиллярных борозд между иглами; вода направляется прямо к рту. Питается исключительно мелкими муравьями и может поесть до двух тысяч пятисот за один раз.
  reptile.toad:
    label: жаба
    summary: Сухопутный бугристый охранный родственник лягушки.
    info: Обыкновенная жаба – самая распространённая разновидность лягушек в Чешской республике. Бугорки не кусают мухи и служат защитой от химических выделений яда. Каждый год она массово переселяется на водоёмы для спаривания; чехам помогает добровольцы переходить дорогу этой земляной амфибии с кожей суше, чем у других видов.
  reptile.tortoise:
    label: сухопутная черепаха
    summary: Медленный наземный пресмыкающийся с куполообразным панцирем.
    info: Слоновая черепаха является крупнейшей сухопутной черепахой в мире. Она обитает на Галапагосских островах и может дожить до более чем 150 лет. Панцирь представляет собой часть её скелета.
  reptile.tree_frog:
    label: рознишка
    summary: Деревьянная жаба со скользящими подушечками на ногах карабкается между листвой.
    info: Зелёная лягушка – маленькая деревянная жаба из группы Хилиды с присосками на кончиках пальцев для взбирания по гладким поверхностям. В Чехии живёт одна местная вид - зеленая розничка; она охраняемый законом организм. Она меняет цвет от зелёного до серовато-коричневого в зависимости от температуры и влажности.
  reptile.tuatara:
    label: туатары
    summary: Новозеландский живой ископаемый остаток, единственный выживший представитель порядка Рифоцефалии.
    info: Туатара - один из древнейших рептилий мира; его отряд существовал в эпоху динозавров.
  reptile.uromastyx:
    label: урамастикс
    summary: Пустынная ящерица с шиповидными ушками на спине из Африканского континента.
    info: Уромастикс – пустынная ящерица с характерным колючим хвостом для защиты из Северной Африки и Ближнего Востока. Он строго травоядный животное, питается семенами, зеленью и листьями. У ромастиксов в террариумах содержат как экзотических домашних любимцев.
  reptile.viper:
    label: змиж
    summary: Ядовитый членистое животное со шестиугольниковой головой и спиральной формой тела.
    info: "{\"hint\":\"ядовитая змея с треугольной головой и гемотоксичным ядом\",\"info\":\"Обыкновенная кобра - единственная из естественным образом встречающихся в Чехии ядовитых змей.\r\nОна легко распознаваема по петлеобразному рисунку на спине и иголкообразным зубам жалобного типа.\r\nУкус болезненный и требует медицинского контроля, но почти никогда не бывает летальным для здорового взрослого человека.\r\nЗакон защищает эту особь; в Чешской Республике ее нельзя ловить или убивать.\"}"
  reptile.wall_lizard:
    label: земляная ящерица
    summary: Худая быстроходящаяся ящерица живущая по стенам и каменистым склонам.
    info: Земляная ящерица – маленькая змея из южной Европы и северо-запада Африки. В Чехии встречается как внесённый вид на прогревшихся скалах и стенах домов. Она быстрая и лёгкая; при опасности отбрасывает хвост.
  reptile.worm_lizard:
    label: червообразник
    summary: Бесножный почвенное животное похожее на гусеницу живущий под землёй.
    info: Червоподобные ящерицы - это малоизученные бесногие рептилии из группы Амфисбенионии, обитающие в тропической части Америки и Африки. На вид они напоминают крупных червей с членистой кожей и недоразвитыми глазами. Они проводят всю жизнь под землей питаясь муравьями и терmites.
