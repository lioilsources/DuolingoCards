pivot: false
title: Черви и амфибии
cards:
  reptile.chameleon:
    label: хамелеон
    summary: Ящурок с подвижными глазами и меняющей цвет кожей.
    info: Хамелеоны не меняют окраску для маскировки, а чтобы общаться и регулировать температуру тела. У них глаза двигаются независимо друг от друга.
  reptile.crocodile:
    label: крокодил
    summary: Большой древний пресмыкающийся, живущий у рек и болот.
    info: Нильский крокодил является одним из крупнейших рептилий в мире. Он обитает в Африке и охотится из воды. У него самые мощные челюсти среди всех живых животных.
  reptile.frog:
    label: лягушка
    summary: Зелёный прыгающий земноводный животный с красными глазами.
    info: Черноокая лягушка — тропическое земноводное из Латинской Америки. Она живёт в кронах деревьев, летает при помощи кожистых перепонок между пальцами и активна ночью.
  reptile.gecko:
    label: гекон
    summary: Мелкий ящериц, способный лазать по вертикальным поверхностям.
    info: Гекон пятнистый популярен как террариумное животное. Он держится на скалах и стенах благодаря миллионам микроскопических щетинок на ногах, а не клею.
  reptile.lizard:
    label: ящерица
    summary: Четырехногий чешуйчатый пресмыкающийся, распространенный в теплых регионах.
    info: Зеленая игуана – крупная ящерица из Центральной и Южной Америки. Питается растениями, хорошо лазает по горам и способна регенерировать оторванный хвост.
  reptile.salamander:
    label: млек
    summary: Амфибия с гладкой кожей и длинным хвостом.
    info: Млек пятнистый – защищённая центральноевропейская амфибия с жёлто-чёрными пятнами. Он выделяет ядовитые вещества через кожу и обитает во влажных лесах.
  reptile.snake:
    label: змея
    summary: Чешуеносное пресмыкающееся без ног с длинным гибким телом.
    info: Змеи – это пресмыкающиеся с вытянутым телом и отсутствием конечностей. Существует более 3 700 видов; они охотятся по запаху (орган Якобсона), а некоторые ядовиты.
  reptile.tortoise:
    label: сухопутная черепаха
    summary: Медленный наземный пресмыкающийся с куполообразным панцирем.
    info: Слоновая черепаха является крупнейшей сухопутной черепахой в мире. Она обитает на Галапагосских островах и может дожить до более чем 150 лет. Панцирь представляет собой часть её скелета.
