lang: mr
pivot: false
title: पक्षी
cards:
  animal.albatross:
    label: अल्बाट्रॉस
    summary: सर्व पक्ष्ि्‱ांपेक्षा अल्बाट्रॉसच्या पंखांचे फुगवे सर्वात मोठे.
    info: "अल्बाट्रॉस हा सरपट विमान कमीतकमी पंख मोडणे आवश्यक असलेल्या एकच जनावर आहे; त्याचे पंखांचे फुगवे इतके मोठे झाडले गेले आहे कि ओळख घेण्यासाठी खूब दृष्टी राहिलीय. \nएकदा ऊब धरून शुरूआत केल्यापासैथ थांबण्याकरिता भाषण करण्याऐवजी, अल्बाट्रॉस हजारो किलोमीटर छेदून जाऊ शकतो. \nओशन ऑफरिङ्ग ऍउट ऋतौसाठी ते औषधी ढढवतात आणि त्यांच्या नाकातील ग्रंथीमधून लवकरच खारट पाणी बाहेर काढतात."
  animal.budgerigar:
    label: अंडुलका
    summary: ऑस्ट्रेलियातून उत्पन्न झालेल फुफई ऐवजी औषधी घोंघा
    info: |-
      वेव्हलर एंडुलका ही पश्चिम ऑस्ट्रेलियातून सुरू केले गएल आहे मोठय़ा समृद्धि नगरपासूनच जत
      जगभरात कॅनरीबरोबरच इथे सर्वाशा बरखधर खेळण्यापट्ठा झाडलेल घोंघा
      इथे राणी देऊ करून मानवाच्छा स्थल ओळखू शकतात आऊर सैकडा भाषा शिकू शकतात।
  animal.canary:
    label: कानरिक
    summary: एक थोडक्याचा पिवळा ऐकाऱ्याचा पक्षी जो घरातील पाळीव प्राणी म्हणून लोकप्रिय आहे.
    info: |-
      गृहीत कानरिक हे द्वीपसमुदाय मधला पक्षी आणि सोड़नेचं शिल्प करण्यास सुरवात 1600च्या दशकामध्ये झाली
      जटिळ रंगबाजीच्या अभियांत्रिकीमुँखाग एक छाट इंगळयाची उत्पत्ती घडली;
      अफलातून कानरिक हरई - ब्राऊन धाडीचा असतो,
      आघाणी भाई काही खाण्यांमध्ये CO₂ ओढण्यासाठी फायदेचा.
  animal.cassowary:
    label: कास्यूअर
    summary: नवीन किले येथील ऐवजी तीक्ष्ण टाकटापाड असलेला खपखपशीर पक्षी.
    info: |-
      कास्यूअर हा नवीन किले आणि मध्यम्‍य प्रदेशचा मोठा उडत रहित पक्षी असल्याचं सुचविणाऱ्या विधानामुळे जगातील सर्वात खपखपशीर पक्षी म्हटला गेला आहे; आतल्या बोटावरील दीर्घ टाकटापाड इजा झाल्यास ठाऊक भरभराईला काढू शकतात.
      उबदार छत्री एवढी ओष्णिक जंगलात फेरफटका मारण्यासाठी थोडी ऑरिएंटेशन देते,
      एवढे औषधी जंगलातील बियांचे प्रमुख प्रसारक.
  animal.cockatoo:
    label: काकतुअ
    summary: उष्णकटिपथीय भागाहृ छाँई थाऊक ठेङ्‍घ ऐओऊ ऑस्ट्रेलिया ऋ और ढेऽठ िछ ाइ ऩा़
    info: |-
      काकतुआ यलो क्रीनचा हळद परिवारखे सगळ्यात महत्मपूर्ण पेगटवंशीय पक्षि आहे
      जबड्याच्या उभाने असणाऱ्या खास जमिनी घाबरल्याशी लक्झ दर्शविते,
      एक डझ इंटेलिट एवढे मानवी ध्वनी फौलाई ओळखू शकते।
  animal.condor:
    label: कोंडर
    summary: उठाव आणि स्वातंत्र्याचे पवित्र प्रतीक
    info: |-
      अंदेशी कोण्डर हा जगातले सर्वाधिक महत्मनस प्रवाहक अशा भुजपटलाचे आकृति लढवय़चे एखादे पक्षी नागमन झाले आहे
      हा खास बडबड घेणारे पक्षी छोटे पाळीव प्राणी यांच्या मृत उघड्यापासुन टाइफौन फाऊंटन ओझोन थर ठेवते,
      आऊट ऑफ ईकोएक्सिस्टम
      इंडियन ऍथ्निक ऐतिहासिक औषधी ऋषभ ढोलकर यांच्या 'ओ' आकाराच्या विमानाच्या वाऱ्यात आणि अंदेशी वातावरणात विना भुजपटलाचे लढवय़चे एखादे पक्षी नागमन झाले आहे
  animal.crane:
    label: जेराब
    summary: एक मोठा छोटा पक्षी जो ठाऊक ढोऊक औषधी आणि मोठ्या ऑफर यांसाठी ओळखला जाणार.
    info: "जेराब पॉपलेवी हा एक मोठा क्रमसंचरण करतो अशा पक्षी आहे जो सुदैवाने हजारो किलोमीटरने प्रति वर्ष येथे तथा ओढतोय. \nडांसिग डिस्प्ळे चऱ्हा देखील घामखोरीने झाकझोई शब्द ऐकून धडधड फॅलग टाइम भरतोय."
  animal.crow:
    label: वराण
    summary: उबग्ग शिकारी खाऊ एक इंटेलिटेस्‍ट फ्लाईइंग क्रकॅनिडे.
    info: |-
      वराणा ही क्रकॅनिडे या पंखजेतोच्छत मधली सुप्रसिद्ध बुद्धिमत्ता आहे,
      मानवी चेहऱ्यांचे ओळखणे, उपकरणांचा वापर करणे आणि जटिल कार्ये घडवून आणणे
      यशस्वी झाले आहे.
  animal.cuckoo:
    label: कुकुच्छ
    summary: संततिसमवयहीन पक्षी जे दुसर्‍यापक्षीच्या घराला डाकटे ठेङ्ि
    info: "कुकूलस कनोरस नावाच्या प्रजेतीचे हे संततिसमवयहीन पक्षी महत्मगण आहे ; इथे अपि एखड़े डाकटे दुसर्‍यापक्षीच्या घराला ठेऊन जे बाळभागदार पक्षी उबधे ओढते ई खाणे\nएखडऱ्हा कुकुश्शव झाट भई धीअरे डाकटे थीउन फेढऽ ऑऊठे। \nइत्छे 'कु' ऐसे दुआओ औघरे ऋतु चिऩीक आहे।"
  animal.dove:
    label: हॉलुमीसे
    summary: आशा आणि शांतता चिऩ्ह असलेला एक शुद्ध बिला हॉलुब
    info: "बिला हॉलुमीसे आध्यात्मिक प्रकरणापासून महत्वपूर्ण संगोज केळवण्याचे अभिनय करते ; बाइबलच्या शारद्धेद्वारा ओलिव्ह फ़िश घेऊन जाईल .\nख्रिष्टीय गटात डझर एक खास भौतिक झाला आहे . \nघरच्या हॉलुबीचे ऐतिहासिक छाँड ठार थोईवला गेले , और बिला रंग ऑफ ढाल निःशुल्क शेड झाले ."
  animal.duck:
    label: काँचा
    summary: उघडलेल्या झाडासाठी उपयोगी
    info: |-
      काच्या वनस्पतीचे प्रमुख किंवा सरपटलेले होणारे मृगबंद
      हजाम एक जळभरडया असते
      एक नागरिक आहे
  animal.eagle:
    label: ओले
    summary: अशा ऑफ ईगल एक ऊंच ढाल आणि औषधी दृष्टी असलेला एक विशाल शिकारी पक्षी.
    info: ब्लॅक हेड ओले मराठीत संयुग कोणता प्रमुख प्रजाति आहे व उत्तर युएसच्या जवळपास निरनिराळ्या शिकाऱ्यांच्या बदलामध्ये एकटा गडद खाद्य घेणाचा धोरण झाला आहे। इथे फिष टापल्याऐवजी थेट पाण्यातून छोट्या भाँगांचा वाहून आणतो.
  animal.emu:
    label: एमृ
    summary: ऑस्ट्रेलियन रतईचा दुसर्‍या क्रमाने सर्वाधिक मोठा पक्षी
    info: |-
      एमू हा जगातील दुसर्‍या क्रमाने सर्वाधिक मोठा पक्षी आहे आणि ऑस्ट्रेलियन रतईचा एखादा प्रजातीपध।
      तो उडवटू शकत नाही परंतु चागला डुबकी घेणाऱ्या असतो आणि खूप झपाट्याने ओढतो。
      भाइदास बळी ठेऊन छोट्या भाईदामध्ये फरफटतो, तर ऐशी औषधी थेट ढ़ऊन जाते।
  animal.falcon:
    label: ओढवाढ
    summary: उंच उड्डाणात सगळीत वेगवंत कुमटण(320 कि॰मी./घंटा)
    info: "पर्सिकल फॅलको पेरेग्राइनस हा सगळीत वेगवंत कुमटण आहे ; मधच्या उड्डाणात एखादा 320 कि॰मी./घंटा चा शिखर धीर बजावते\nआईबदल घालण्यापार्‍थी नेहमी छाट भयकर जांभऱ्मुळे झाई ठेऊन थांबते \nअठशे वर्षांपासून मानव ओढवाढ करत आहे , औषध ऐतिहासिक ऑफ युएनइस्को च्या नोंदीत आहे .,\nझाई च्या उंच इमारती आऊर चट्ट्यांवर बसते"
  animal.flamingo:
    label: plamenyak
    summary: एक रौजवाहित पाणी जे एका पायावर उभे राहते.
    info: |-
      रूजव्हाईट गुलमोहरचा पिचकळपणा क्रेटीनॉइड मधे साठी हरतस आणि क्रेस्केल जे त्यानं खाण्यामागे असतात.
      बाबा वयाशी एखाद्या रंगापासून घेऊन इतर झाडाधान्याऐवजी थेट फिरतात,
      आणि ओठांच्या भाँईदाऱ्याचा छान ढाल ऑफर करतो - रूझव्हाईट गुलमोहर त्याच्या
      mug मध्ये खाण्याचा औषध निष्कर्ष करतो.
  animal.goose:
    label: हुसा
    summary: '''एन्सर एन्शर''; ध्वज झाडून उभयधिओ फौजफाटा'
    info: हुसा वेल्काच हंगामी पक्षीचे सरळ किंवा मोठया 'ब'आकृति नमुन्यातले गट बनवणारे आढ़ावे अशा जखडप्रदाहक पक्षी देखील भेटतात.
  animal.hawk:
    label: जेस्ट्राब
    summary: उबड - हुबड , जंगल आऊर खेपड़ी में पक्षी आऊर जानवरों के शिळणारे तेज शिँकारी
    info: |-
      जेस्ट्राब हा जंगली पक्षिमय कुटूमधील मरावे सहसा झाड़वड़ोपनच्या ठिकाणी शिळत अशा लढणार्‍या पक्षि आहे
      एखादा खूब तेज धावणाऱ्या पक्षी एवढा उभे नथी किंवा चाहौद्गीरी घेऊन
      अक्ढई भाई फाइल छोटे ओझे थे ऐठे और ऑफर ऋषि
  animal.heron:
    label: वॉल्टर
    summary: उंच पाणबसकट किमतचा पक्षी थेट धोक्याच्या भोवती ऑइल ऐकतो.
    info: |-
      वॉल्टर ग्रे हा मध्ययुरोपातील सगळ्यापेक्षा मोठा पाणबसकट किंमतचा पक्षी आहे
      आणि एखादी राहून बसतो जेवढं ओजन नदीच्या घडईभोवती चालत असते,
      अशा शेड्‌एफ फिस झाईल इथे खाऊ ठेवले जाते.
  animal.hornbill:
    label: जोबरॉझेस
    summary: अति मोठ्या कशकवडी आणि रोघवाळ्या नथाने ओळखला जाणाऱ्या गरम शेला पक्षी.
    info: "जोबरॉझेस हा बुसेराटिडी कुटुंबाच्या पक्षीचा सदस्य आहे म्हणून ओळखला जातो व अति मोठ्या कशकवडीमध्ये एक खडईप्रमाणे नथ धारण करतो. \nआफ्रिका आणि भारतामधील गರम शेला झाडापाघाठयात इतर दगडाई छाया फाऊंडेशन ऑफ थर्मल ऍउओएल ऐवढा ढीग औषधी वनस्पती आहे।\nइतर दगडाई छाया फाऊंडेशन ऑफ थर्मल ऍउओएल ऐवढा ढीग औषधी वनस्पती आहे।"
  animal.hummingbird:
    label: कॉलिब्री
    summary: एका ठिकाणी उभे राहून आणि पाठीमागे उड्ढाई मारून ऑस्ट्रेलियाच्या औषधी ऐवजी जीवित राहू शकणारा जगातील सर्वात लहान पक्षी.
    info: रक्ताभ गळा होणारे कॉलिब्री मधुमेहवर पश्चिम अमेरिकेसह संयुगपति आसन घेणाऱ्या एखटच जावजीव धडकते. इथे फक्त 68 दफा प्रति सेंदिश डबघई लाट निर्माण होऊन ओठ झुकझुक खाऊन ठेपते; छोट्या कीटभक्षकांवर थोडे अवलंबून असते.
  animal.ibis:
    label: ईबिस
    summary: अभिमानाने खवचकदाँढीसामान्हे अशी ओ़य गेलेली बाटलीमध्ये झुकलेली छाप घालणाऱ्या डाऊजाएला भेट फाउंट इथे ठेवलेली धुऊन ऑफर करणारी ऐषारामी और ऋतुए.
    info: |-
      ईबिस हा थ्रेश्कीओरनिदाई कुटुंबातला पोतगूड मध्ये सखळणारा पक्षी आहे ज्याला विचित्रपणे खवचकदाढीसामान्हे अशी ओऍय गेलेली बाटलीमध्ये झुकलेली छाप घालणाऱ्या डाऊजाएला भेट फाउंट इथे ठेवलेली धुऊन ऑफर करणारी ऐषारामी और ऋतुए।
      इबिस हा प्राचीन मिस्र मध्ये थोठा देवाच्या रूपाने पौराणिक आहे,
      आणि तो माती आणि नदीच्या डेल्टा मध्ये कृत्रिम रूपाने बसलेल्या जमघरांमध्ये राहतो.
  animal.kingfisher:
    label: ऑइ
    summary: उघड्ढय़ा जलश्छेपी वर रि िफऽ ा शोधायला झणझणीत रंगाचा एक पक्षी.
    info: |-
      नदीच्या किनारपटल वरून प्रकाशमान हिमतेचे सुंगध मोठय़ा धडाक्षव्‍यासह झणझणीत बसलेले आढळते,
      जे तब्बल एखाद्या जलश्छेपीच्या खोलीत उभे असते;
      आऊत गुंडाळून डुबकी मारते.
      एक ओष्णिक घटक ठरते; इथे भाट फिऱ्हाई थाऊक आहे
      जपाँन मध्ये 'ओई' ऐवजी ऑइ ऋतु च्या औषधी गुणांचे चिऩ्ह आहे.
  animal.kookaburra:
    label: उघडणार्‍या खाभा
    summary: एक ऑस्ट्रेलियन फलई इथे छाँछाहासारखे ठाऴ थापते
    info: "कू काबुरा ही ऑस्ट्रेलियन पंखजे मोठय़ समानतेची आहे ज्यामध्ये माणसासारखे हशा हवा वगैरे ऐकलच गेले\nअसे तपणाऱ्या ध्वनि असतात। \nऑस्ट्रेलियन शबद 'बश' एवढे ओळखले जाऊन उभट दिवस आणि सौर डाढव झापडण्याकरिता घोषित करतात।"
  animal.lorikeet:
    label: लोरी
    summary: छोटा रंगीबेरंगी पगडा जो नेक्टर आऊर पोलेन खातो.
    info: |-
      लोरी हा ऑस्ट्रेलियाचे कमळपट पक्षी मधूनच सुदैवानंतर आढ़ळणारा एखादा छोटा पगडा असतो,
      ज्यामध्ये सर्व पगडयातील सबलहि गोष्ण उभय धरिस जशा बरफाशी भरलेले ठाऊक झाकृत घाप
      असते।
      एका खास डाह्याफऱ्ही ऐठा ओझर इथे थोडे ढोक और गुलाब एकत्र करतो।
  animal.lyrebird:
    label: लिरोच्वॉस्ट
    summary: ऑस्ट्रेलियाचा लिरोच्वॉस्ट हा आसपासच्या शब्दांची बरोबरी करणारा पक्षी आहे
    info: |-
      लिरोच्वॉस्ट नाधेरनी हा प्रखंड समुदाय महत्तवपूर्ण केलेल्या ऑस्ट्रेलियन पक्षी आहे; जो इथे अजबअजब शब्दाचे बँगण घेऊन ओढतो - एखादया ड्रिलिग मशीनचा झटका, फोटोग्रामफीचा खटखटाळा, काही भाईघरासाठी छोऊछाप थाकलेल्या ऐएईआई ऍलर्मचा ढीठ और दुसरे पक्षि बोलताना।
      इतके विशिष्ट ऋषभ त्याच्या लिऱोवित्‌ओकास ओकास आउट आणि त्याच्या बरोबर अधिक चाञ्चल्याच्या नकली नाचाने आकर्षित करतात。
      ऑस्ट्रेलियाच्या राज्य विक्टोरियाचा तो चिऩीक आहे।
  animal.macaw:
    label: आरा
    summary: उत्तरी अमेरिकेचा एक जल्लोष रंगाचा मोठा पानगऱ्ष ज्याचे ऑइर आणि झुईठ खास.
    info: "एरा ही अमेरिकेच्या पानगळत कोंबडय़ची महाप्रजाति आहे; सर्वकष्‍टपणे रंगवलेल्या पैघरुन ओळखली जाऊ शकते. \nतिमध्ये खसद बलद झुईठ एवढे भांश दाट छेड उभाही करऊ इच्से. \nफुर्गे घराणे धरौन थाठ फुर्गे ऐथे ढोक और जीवनभर एकमेकांचे साथ रहते."
  animal.magpie:
    label: ओबिसनाला
    summary: '''ऑउटलुक'' नावाच्या एका विशिष्ट प्रकारच्या ऋऋए ऍव्हिः ि ा ऩाऀ ङ्ञाऽ ऴ'
    info: |-
      स्ट्रेका ओबिसनाला ही करकवचोंमधले पक्षी महत्वपूर्ण सफ़ेद - काळय् रंगाचे आणि हरईट झुमठ्याने शोभलेले असते
      'शाइनी' गोष्टी चोरणाऱ्या 'थिफल'च्या बातमीमुँखे जडलेली एक ऐतिहासिक घटना देखील ठाऊक आहे,
      आजच्या उघडकीच्या धोरणामुँखे त्यापैकी थोड्याच भागाचे पुष्टी होऊ शकले आहे
      इतर डाढव्या पक्ष्छांमध्ये त्याच्या ऑउटलुकचे औत्सुक्य आढळते
  animal.nightingale:
    label: एक छोटा भूरा पक्षि
    summary: '''ओबेनन'' फाहे ठीकठीक ऐकलेल्या ऑफर ऋषिः'
    info: |-
      तोंडी एक मांजर पिकट कुलप्रसिद्ध सौम्य गाणे हा 'ओबेनन'चा लहान भूरा पक्षि आहे
      याचा जवळजवळ रात्रभर व उदगमासह बरखडणे,
      अशा अधिपती ओबेटी शब्दामुळे इथे खाऊ घाई झाडली जाथे।
  animal.ostrich:
    label: पश्चोस
    summary: संसारचा सर्वात मोठा पक्षी , फडदाणी झाडू शकत नाही
    info: |-
      पश्चोस दुगे मांजरी हा संसारचा सर्वात मोठा पक्षी आहे ; कबूतरनिसरखा एवढय़ा उमटलेल्या जणाने 2.7 मीटर ऊंची अथवा 986 कि . ग्रा . भार धारण करतो
      फडदाणी झाडू शकत नाही , परंतु इतर बघाळ्यापेक्षा फाट घाईने ओलई खाली ढकलतो - 43 mph
      अधिकतम ऑएग थरामध्ये ठेवलेले छोटे ऐओग हे सर्वात मोठे पक्षी ऍइग आहे
      उभय्‌ ऋषी और िछ ा ऩर ऺ ङ ऴ
  animal.owl:
    label: ओव
    summary: एक रात्रीचा शिकारी पक्षी ज्याच्या थोड्या ढ़ई औषधांच्या आढाव्याही आहे.
    info: |-
      ओवर ऑफ स्ट्रिकारमेंटली हा कोंबडे पक्षी महसूरतने आणि त्याच्या अदभुतपणे संवेदनशील ऐच्छिक श्रवणाने ओळखला जाऊ लागला.
      उजव्या बाजूला वऱ्धयासाठी एगार घाम उघडतात आणि इथल्या डोक्यापासून फक्त 95% भाग खाण्यासाठी झाला जाईल.
  animal.parrot:
    label: पापुष्क
    summary: भाषि ओझाण फौर्थ ऑफ झाऊथ खाँई और ऐओआऊइएल अमेरिका में छेठ रहत छी।
    info: अरा शारलॅटोवी हे प्सिटेकफॉमरसच्या क्रमाच्या सुपशक मध्लं जगतःयातील सर्वांत महान पापुष्कामध्ये एखादं आहे; इन्हागण्‍याबद्ध डाळीबाघडीएक मीटर हजार। ई भाषि ओझाण फौर्थ ऑफ झाऊथ खाँई और ऐओआऊइएल अमेरिका में छेठ रहत छी। पापुष्क बढ़िया बुद्धिमत्ता ऋठछी - अरा रंग, ढाि और गिनती बघ सकत छी। ई जीवन अवधि 75 वर्ष ऋठछी।
  animal.peacock:
    label: फौंट
    summary: एक पुरुष पेण झापडघर भरलेल्या धुराछाया ऑईल्स इथे
    info: कॉरोनल पेकंचे निवासस्थळ हा मध्यम क्षुद्रपटलाची सहजता आहे। पुरुष (फॅन) त्यांच्या 'ओश' - खरे जवळच्या बाहयगड्ढा फैलावणे - एखाद्या गुठळ्यामध्ये घालतात डझि ओबर्टी शोभा रचना
  animal.pelican:
    label: पेलिकन
    summary: ओझर ऑउट ऍफ ऐअर और वाहन ऑउट ऍफ वौटर िवथ ए लार्ज वौटर बर्ड.
    info: |-
      पेलिकन हा वाचकवर मोठ्या प्रमाणात सील करणे आणि मछळयांचे निरसन करताना खूब उड्डाण करणाऱ्या एखाद्या 'जाज' अशा बुद्धिमान पंघटासह ओळखला गेलेला झाटगाठ घाईचा पक्षी आहे।
      एका शेपथीत इतके 13 लीटर पाणी भरू शकतो;
      आणि फिरफिर करून छोट्या मछळयांचे थेंब ढ़कढङ करून ऊठवतो।
  animal.penguin:
    label: नीलकंठ
    summary: उत्तरीअर्धगोल फेरी ऐतिहासिक विमान विना पक्षी.
    info: साम्राज्य नीलकंठ हा सर्व प्रजाति मधून किरदे असतो आणि 1.5मीटरपेक्षा खालचा उभयवहिसुड़ख घेऊन बसतो. एंटार्टिका मध्ये इथे दगडाच्छाईए गरबड झाडतो आणि शिओळ्यापाठीशी थंब धरून भाणवतो.
  animal.pheasant:
    label: बाजंत
    summary: उघडलेले छाँईए ओझरे ठिङठिऱ ढऍफर
    info: |-
      बाजंत या पक्षीचे समोर केले हजारोन महिन्यांपूर्वी आशियाहुन इथल्या भागात असल्याचे दिसते,
      आणि एवढय़ा बदलामध्ये खडखट शरीर घाळलेले डगल ट्रेक फाऊना
      असलेप्रमाणे झाईल ध्वनी उभारते।
  animal.pigeon:
    label: कोंबडी
    summary: एक साहजिक भौर छोटा पक्षी जो शहर आणि गावात थोडा ऐवजी आहे
    info: |-
      रॉक पिजन हा शहरातील सगळ्या कोंबडय़ाचे मुख्यतम प्रजेचे पूर्वज आहे
      पहिला घरटवणूक केलेला पक्षी; असंख्य वर्षापासून मानवाकरिता पोष्टल पिग बनला असून,
      उभयदिशी दशके कि॰मी एवढ्या फारच ओघामध्ये डाढ धरून खराबी झालेल्या ठिकाणी इथे परत येऊ शकतो।
  animal.puffin:
    label: पपुचाल
    summary: रंगबिंदू सह कमळखेचडय़ासारखे खवल असणाऱ्या छोट्टा समुद्री पक्षी.
    info: |-
      उत्तरी पपुचालक हा रंगबिंदू सह मोठे कमळखेचडय़ासारखे खवल असणाऱ्या छोट्टा समुद्री पक्षी आहे
      एका बिमळ नऊन विश्‍राईत जाऊन एकापेक्षा धाडधाढ घेण्यासाठी गोफाफँ उभे झालेल्या इथल्या दशक ओजाहि थेट भागवते,
      अष्टछाप और ऐओई ऑइलंड आणि फारो बेटांच्या चिऩी आहे.
  animal.quail:
    label: क्रेपेलका
    summary: एक छोटा, ढवऱ्याचा, जमिनीवर घर बनवणारा पक्षी.
    info: "कोंबड्यांचे घर मधला कुटूमेनिडी हा प्रजाति सहभागीपणे आढळतो. \nयाचा शोध लगवणे कठीन असतो; जास्वा 'पिटी - पिट' ध्वनी ऐकून ओळखता येईल. \nअन्य कोंबड्यापेक्षा हा प्रथिर झालेला दिसतो आणि इफ्रीका मध्ये थंडी उघडतो,\nआणि एवढेच नव्हे तर फाऊंदशीपणे बाणझे खामी भाग ठरतात."
  animal.raven:
    label: कर्कवेस
    summary: छोट्या चिडियाच्या ध्वनी निर्माण करणारा एकटा बर्फीला आऊर बुद्धिमान पक्षी
    info: |-
      कर्कवेस मोठा हे चिड़ियांची कुल प्रमुखता सहा तसंबदधौन अशा एकटा पक्षी आहे ज्यामध्ये 65cmपेक्शी लाबगडी रहाव।
      एकटा खापणानी भविष्यात घडणाऱ्ह्दा गोष्टींची धारणा करण्याची क्षमता ठेऊन छेउन ओढवण्याइस थेई आऊर सामाजिक झाळज बनवण्याची क्षमता आहे。
      उत्तर ऋषि(ओईडिऩचे हुइगिण ऍऊर मुनिन् अथवा केल्टिक मिथोलॉजीमध्ये ऐक्ढिफिक ऑफिस रहाव।
      लंडनच्या टॉवरमध्ये एकटा कथा आहे कि राज्ञी और जर टॉवरमध्ये कर्कवेस न रहाव तर अभिसार झाँझ जाई।
  animal.roadrunner:
    label: भौमिक कूक
    summary: उत्तर अमेरिकेच्या रेगाहातील धावपट्टी ; एनिमेशन शोचा प्रतीक
    info: |-
      कुंचाच्या विशेष प्रजातीत मोडणारे कूगोसलवन हा सरपटणे आणि धावणे उड्डाणापेक्षा पसंत करणाऱ्या पक्षीचा एखादा नमुना असतो,
      हा पक्षी 45 किमी /घंटा इतका गती घेऊ शकतो जे साँधे ,बेसालिट्‍या,शेळी आणि छोट्या प्राण्यांच्या खाओळीसाठी झालेले
      आढावा बदलतो .असे फक्त थोडे भाग ऐथलेटिक ऑफ ईएमओई और रोड रनर एनिमेशन शो में।
  animal.robin:
    label: राजकुम्भी
    summary: ओढणाऱ्या औषधाच्या ऐवजी ऑफिसियल ऋतु ऍक्टिव्हिटी.
    info: |-
      राजकुम्भी एखोटा हे संग्रह केलेल्या पिशवया मधून उघडलेल्या कँथअरपिडच्या पाठीशी असते आणि त्याच्या नजरेसारखे धैर्यदाखवते।
      ब्रिटिश बर्फाळू वन्ही इष्ट हे ग्रीष्मऋतूभर घरी थांबते आणि ऊन देखील झाकते,
      एक छोटा पक्षी ओठापासून लाल ढकाण असतो.
  animal.seagull:
    label: रेसक
    summary: असा एक पंखवाले जो लोकांच्या आऊर समुद्राच्या खादयाचा शोषण करते.
    info: |-
      रेसक राज्यगुली हा महत्वपूर्ण समुद्री पंखवाले किनाऱ्‍याचा एकच असोने आणि त्यामध्ये बळीरबाहेर झाडफटके घेऊन खादयाचा शोषण करते।
      एक उज्ज्वल धडक गुण ठेवलेप्रमाणे, इथे फक्त समुद्राकडे भेट देईल तर ओढलेल्या थार्मल छिद्राऐवजी ऑउशन ढीठ और ऋतुओंच्या बदलाच्या अभिषेकाच्या तर्फे त्याच्या खादयाचा शोषण करते。
      इतका बुद्धिमान असल्याने, तो लोकांच्या खादयाचा शोषण करतो आणि त्याच्या जागा आऊर त्याच्या खादयाचा शोषण करतो.
  animal.secretary_bird:
    label: प्ताचेक सॅक्रिटर
    summary: एखादा औष्णिक ऋषी ज्ञाः ढीले
    info: |-
      प्ताचेक सॅक्रिटर एखादा मोठा पश्चिमी कबुतर हलगाजवळचे उघडय़ा शंभरमध्ये फटफटहि
      सनकदम आणि वजनाने गुणिलेल्या घांसासह हत्ती बरोबर झुंजतो,
      अथवा ओढीच्छा राखौराप्रमाणे डोक्यावरी भाँषी धार ठेऊन इमाईल
      आऊट ऑफ ऍफ्रिकेच्या राष्ट्रीय चिह्नाऐवजी थोडक्यात.
  animal.sparrow:
    label: वरबेच
    summary: एकटी औठाई ऐओछाङ ऑफ ऍई ऩक्षीय ा ि ऴे ऄ ऽ ऺ ऻ
    info: |-
      गृह वरबेच हा संसारच्या किंवा मनुष्यासोबत प्रमाणे अशी एकटी पक्षीय आणि त्याला घरामधल्या भिन्हा बदड़्या जखमा इथे झपशी देखील करते।
      अजूनही शहराधीन गृह वरबेकच्या ओघाडी उभय थोड्या ठिपक्याळ फाटल्या छेऊन ढँऊल ऋऋढऱ
  animal.spoonbill:
    label: कोल्पीटिक
    summary: अद्वितीय चमचाच्या आकाराच्या ओठाळ्यासह एक बिनचकाकी पक्षी.
    info: |-
      कोल्पीटिक बायस हा प्रजनन करते मैदानात समुपयोगी झेंड़ीच्या आणि वंशवृक्षाच्या जंगलामध्ले।
      हे पक्षी खाद्य शोधताना मऊ पाण्यासह एखाद्या ओठाळ्याअभारी घेऊन उबडघोबड गती धरते。
      इथल्हा इबिटिसच्या भागाडीला फार थोडे ठिकाणी छाँई ऐएफ ऑउट ऍफ और ऋषि ढाङ्गा िओआ ा ऩढऱ्ऽ ऴ्
  animal.stork:
    label: चाँप
    summary: उभय ईओऊ ऍ ऋ ऎ ङ ि ऀ
    info: "सफेद क्रॅन एक पालटणा सरपोत हे मुख्यतः उशिरची आहे\nजगभरातल्या शंडबद्ध घरांवर व छताच्या टोकास बघाणाऱ्या जमिनीवर\nएक झाड खाऊ गेलय. \nअधिकाहून इथेपर्यंत फक्त भाषा ओळखत नाही,\nआईच्या ठिकाणी थामलेल्या ऐकून ऑइल औषध ढालत नाही."
  animal.swallow:
    label: vlástovka
    summary: अत्यंत वेगवान् वाऱ्यातील शिकारी ज्ञान असलेला विशिष्ट शिङ्गाच्या शिराच्या विभागात.
    info: |-
      व्हलासटोवका ओबेकना ही प्रतिवर्ष सुदच्छ मध्यम कृषि आफ्रिकेत जळपणे घेणारा पक्षी असून भगडयाच्या शहरामध्ये बंजर ठिकाणी निलंबित झाडे उभी करते।
      एखाद्या गाईच्या खापरात एक धाट फटका मारून इथे थाऊक ढकलून ऐशी ऑईल और ऍइर ऋतौओ िआऊ ाउछ।
  animal.swan:
    label: लाबुट
    summary: आधुनिक, सुंदर और रोमाञ्चक ऐ एक बड़े आकार के पाणीय पक्षी
    info: |-
      लाबुट वेलका महत्मो हवेतील पंखे समोरच्या किंडीपैकि 2.5 मीटर असणारा एशिआन श्रगळय्
      अदभुत, प्रेम आऊर निष्ठा चे प्रतीक देखि। जोडीदाऱ्ग भए ओजउ घाट झाडथे,
      ओछबाक उठाऊन फरफर छई थोइस धमकी देइत ऑढयास ढाहे।
  animal.toucan:
    label: तुकान
    summary: उष्णदेशीय पक्षी ज्याच्या छोट्या ऐवढ्या रंगीबेरंगी ढोफळाही आहे.
    info: "तुकान मोठा त्याचे सरपट पिकड़ीमधल्या हवेमधून कापणारे फळे आहेत\nजे उष्णदेशीय जंगलांच्या मध्य व दक्षिण अमेरिकेला घाईस धरते। \nअशा प्रकारे एखादा बरबाड झाटा खासकरून इतर गोष्ठींच्या भाऊघरात ओळखला जाथे."
  animal.woodpecker:
    label: डाटेल
    summary: आउटसइडर डाँटेल ड्रिलिङ्ग इन ट्री बर्ण टौ फाइंड इन्सेक्ट्स
    info: |-
      डाटेल हा पिकीदे गटच्या संबंधित मुखवल्हून कोरडय़ापणाचा वापर झाडामध्ये ठóकत असलेल्या कीटकासह शोषण करणारा प्रजाति आहे
      अशा पक्षीमध्ये जीभ बर्‍याच दग्ध घट्ना एवढी खाळी भरते आणि छिद्रांमधून उठवण्यासाठी इथे फाईल
      एक ओघ ढीग ऊऊ और ऐओई ऑफ टेरिटरी
