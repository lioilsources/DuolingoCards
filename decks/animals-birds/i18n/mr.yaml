lang: mr
pivot: false
title: पक्षी
cards:
  animal.eagle:
    label: ओरल
    summary: विचकट चेखरा आणि तीक्ष्ण दृष्टी असलेला मोठा शिकारी पक्षी.
    info: बीलोहलाव्ही ओरल युएसएच्या राष्ट्रीय चिन्हांकनात येते आणि उत्तर अमेरिकेतील सर्वात मोठ्या शिकारी पक्ष्यांपैकी एक आहे. ते मुख्यतः मासे शिकार करतात, जे त्यांच्या तीक्ष्ण खंडांनी पाण्यातून ओढून घेतात. त्यांच्या पंखांचे विस्तार दोन मीटर असू शकते आणि ते प्राकृतिकरित्या अवघड 20 वर्षे जगतात.
  animal.flamingo:
    label: plameňák
    summary: रुजाचा रंग असलेला एक पाण्यात उभा राहणारा पक्षी.
    info: रोज रंग त्याच्या खाद्यातील कारोटिनॉइड्समुळे येतो, जे त्याच्या खाद्यातील शैवाल आणि क्रेव्हमध्ये असतात. बाळांचा रंग ग्रे असतो आणि त्यांचा रंग वेळेसोबत बदलतो. त्याचा वळलेला मुखपटल एक छानक म्हणून काम करतो - प्लेमेनाक त्याचा मुखपटल खाली ठेवून पाण्यातून खाद्य छान करतो.
  animal.hummingbird:
    label: कॉलिब्री
    summary: जगातील सर्वात लहान पक्षी जो जागेवर उड्डाण करू शकतो आणि पुढे उड्डाण करू शकतो.
    info: कॉलिब्री रुबी-थ्रॉटेड हा एकमेव प्रकारचा कॉलिब्री आहे जो नॉर्थ अमेरिकेच्या पूर्वीला नियमितपणे बसतो. त्याच्या पंखांना प्रति सेकंद 53 वेळा हलवले जाते, ज्यामुळे त्याचे विशिष्ट ध्वनी निर्माण होते. ते नेक्टर आणि लहान कीटकांवर जगतात; त्यांच्या हृदयाचा धडका प्रति मिनिट 1,200 वेळा होतो.
  animal.owl:
    label: सोवा
    summary: रात्रीचा शिकारी पक्षी ज्याला गोल डोळे, शांत उड्डाण आणि चांगला ऐकण्याची क्षमता आहे.
    info: व्हर वेल्की ही उत्तर अमेरिकेतील सर्वात मोठी सोवा आहे. सोव्यांची डोळे नाही फिरतात, म्हणून त्यांच्या जागी त्यांची डोकी ते 270 अंश फिरवतात. त्यांच्या विशिष्ट पंखांच्या संरचनेमुळे त्यांचे उड्डाण लगोलग शांत असते. ते रात्री शिकार करतात ज्यासाठी त्यांच्याकडे अद्वितीय श्रवणेंद्रिय आहे.
  animal.parrot:
    label: पापुशेक
    summary: रंगीबेरंगी उष्णकटिबेटी पक्षी जो ध्वनी आणि मानवी बोलीचे नक्कल करू शकतो.
    info: एरा शर्लॅटोवी हा जगातील सर्वात मोठ्या पापुशेकांपैकी एक आहे आणि त्याच्या पंखांचे विस्तार एक मीटरपेक्षा जास्त असतो. हे उष्णकटिबेटी जंगलांमध्ये लॅटिन अमेरिकेमध्ये राहतात. पापुशेकांना असामान्य बुद्धिमत्ता असते - एरा रंग, आकृती ओळखू शकते आणि गणना करू शकते. त्यांचा जीवनकाल 75 वर्षांपर्यंत असतो.
  animal.peacock:
    label: पाव
    summary: पावचा नायट विस्तारित वेजीराच्या आकाराच्या वर्णसंपात ओट्याने भरलेला असतो.
    info: भारतीय प्रायद्वीपातून आलेला कोरूनकटी पाव हा प्रजननासाठी मादी ओळखण्यासाठी त्याचा ओटा विस्तारतो - खरेतर हे विस्तारलेली झाकणाची बाले असतात. त्याच्या बालांवर प्रकाशाच्या माइक्रोस्ट्रक्चरवर वळणामुळे निर्माण होणारे इरिडिसेंट रंग रंगीबेरंगी पिगमेंटमुळे नसतात.
  animal.penguin:
    label: पाण्यात वावरणारा पक्षी
    summary: जिथे उत्तरी अर्धगोला नाही तिथे फटके मारणारा पक्षी, चांगला पाण्यात वावरणारा पक्षी.
    info: राजा पेंग्विन हा सर्व पेंग्विनमध्ये सर्वात मोठा असतो; त्याची उंची 1.1 मीटरपेक्षा जास्त असते. ते अंटार्क्टिका मध्ये राहतात आणि त्यांच्या अंड्यांना त्यांच्या शीतकालात गरम ठेवतात - पुरुष त्यांच्या पायांवर अंडी धरून त्यांच्या अंटार्क्टिका शीतकालात गरम ठेवतात. पाण्याखाली त्यांचा वेग 30 किमी/ताशीपेक्षा जास्त असतो.
  animal.toucan:
    label: टुकान
    summary: उष्णकटिबंधी पक्षी ज्याचा मोठा व रंगीबरंगी मुख असतो.
    info: टुकान मोठा उष्णकटिबंधी जंगलांमध्ये राहतो. त्याचा ध्यान वेधून घेणारा मुख 20 सेंमी पेकी लांब असतो, परंतु खूप हलका असतो. हा मुख हवेच्या खोलींनी भरलेला असतो आणि शरीराचे तापमान नियंत्रित करण्यासाठी, फळे कापण्यासाठी आणि इतर टुकानांना दृश्य चिन्ह देण्यासाठी वापरला जातो.
