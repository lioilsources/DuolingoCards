lang: ar
pivot: false
title: الطيور
cards:
  animal.albatross:
    label: ألفانتوس
    summary: طائر بحري يملك أكبر امتداد للأجنحة بين جميع الطيور.
    info: يمتلك الألفانتوس الامتداد الأكبر للأجنحة من بين كل الطيور، حيث يمكن أن يصل إلى أكثر من 3.5 متر. يقضى معظم حياته في المحيط المفتوح ويمكنه الطيران آلاف الكيلومترات دون هبوط. يشرب مياه البحر ويطرد الأملاح عبر غدد الأنفية. وفي التقاليد البحرية، فإن قتل ألفانتوس هو علامة على الحظ السيئ.
  animal.budgerigar:
    label: أوندولا
    summary: طير باراقويت صغير ملون من أستراليا، حيوان أليف شائع.
    info: يأتي الببغاء الموجّه الأندولكا من المناطق الداخلية في أستراليا حيث يعيش في قطعان كبيرة. هو الطائر المنزلي الأكثر انتشارًا في العالم بعد الزغب. الذكور قادرون على تقليد الصوت البشري وتعلم مئات الكلمات. تتميز أنواع الأندولكا البرية بلونها الأخضر والأصفر؛ بينما نتجت طفرات لونية مختلفة عن التهجين.
  animal.canary:
    label: كناري
    summary: طائر صغير أصفر يُغنى به كحيوان أليف.
    info: يأتي الكاناري المنزلي من جزر الكناري وتم ترويضه في القرن السابع عشر. ظهر لون الأصفر نتيجة التهجين؛ بينما يكون اللون البري أخضر بنيّاً. الذكور تغني موسيقى معقدة، وتعد مسابقات غناء الكاناري ظاهرة عالمية. استخدموا تاريخياً في المناجم ككاشف لم氧化碳.
  animal.cassowary:
    label: كاسوار
    summary: طائر خطر لا يطير من جزر نيو غينيا لديه حواف حادة.
    info: الكاسوار هو طائر كبير غير قادر على الطيران ويوجد في جزيرة نيو غينيا وشمال أستراليا. يعتبر هذا الطائر أكثر الطيور خطورة في العالم؛ حيث أن الأظافر الطويلة الموجودة على إصبعه الداخلي قادرة على تسبب إصابات خطيرة. القبعة العظمية المرتفعة التي على رأسه ربما تُستخدم كوسيلة للتنقل عبر الغابات الكثيفة. كما أنه لعب دورًا أساسيًا في انتشار بذور الغابة المدارية.
  animal.cockatoo:
    label: كاكادو
    summary: ببغاء أبيض من أستراليا وآسيا الجنوبية مع خصلات صفراء مميزة على الرأس.
    info: يُعتبر الكاكادو الأصفر أحد أكثر الببغاوات شهرةً في عائلة الكاكادو. ترتفع خصلاته الصفراء عند الشعور بالحماس أو الخطر. وهو ذكي ويمكنه تقليد صوت الإنسان. يعيش حتى 80 عامًا في الأسر، ويُنظر إليه كمُضرٍ للحصاد في أستراليا.
  animal.condor:
    label: كوندور
    summary: أكبر طائر مُحلق في أمريكا برأسة العارية.
    info: الكوندور هو أكبر طائر يطير من حيث الوزن وامتداد الأجنحة في العالم. إنه نوع من الطيور الجارحة التي تأكل لحوم الحيوانات الميتة ويؤدي دورًا مهمًا في النظام البيئي. يستخدم الكوندور التيار الهوائي الساخن الضخم فوق جبال الأنديز للتحليق دون ارتعاش الأجنحة.
  animal.crane:
    label: الجراب
    summary: طائر كبير مهاجر معروف بعروضه الرقصية وصوته العنيف.
    info: يعتبر الجراب رمادي اللون طائرًا مهاجرًا كبير الحجم يقطع آلاف الكيلومترات سنويًا. اشتهر هذا الطائر بعرضه الأدائي الذي يتضمن قفزات وحركات تشبه الرقص أثناء اختيار الشريك. كما أنه يهاجر في أسراب هائلة عبر جمهورية التشيك في الخريف والربيع.
  animal.crow:
    label: الكركي
    summary: طائر أسود ذكي من عائلة الكركفيات قادر على حل المشكلات.
    info: الكركي هو طائر من عائلة الكركفيات معروف بذكائه الاستثنائي. يمكنه التعرف على وجوه البشر، استخدام الأدوات وحل المهام المعقدة. يعيش في أزواج أو مجموعات صغيرة وهو كARNيvor.
  animal.cuckoo:
    label: كُوكَاچَکَا
    summary: طائر يعتمد على التف寄卵 إلى أعشاش أخرى.
    info: الكُوكَاچَکَا مشهورة بسلوكها كطيور تفريخية؛ حيث تضع بيضها في أعشاش أنواع أخرى، والتي تقوم الأبوان المضيفان بلقائها وتربيتها. يطرد صغير الكُوكَاچَکَا سريعًا البيض والأبناء الآخرين من العش. نغمة 'كو كو' الصوتية ثنائية الإيقاع لها رمزية خاصة لموسم الربيع. الذكور فقط هم الذين يصدحون بهذه النغمة بينما الإناث تطلق أصواتاً مزروعة.
  animal.dove:
    label: الحمامة البيضاء
    summary: رمز للسلام؛ حمامة بيضاء نظيفة ذات ريش ناعم.
    info: الحمامة البيضاء هي رمز دولي للسلام منذ العصور القديمة ؛ في الكتاب المقدس أحضرت واحدة من الحجارة إلى نوح. كما أنها تمثل الروح القدس في المسيحية. إنها في الواقع حمامة صخرية مُدَّرسة، واللون الأبيض نتج عن التحسين الوراثي. إطلاق الحمامات البيضاء جزء من المراسم والأعياد حول العالم.
  animal.duck:
    label: كُرْدَة
    summary: طير مائي ذو منقار عريض؛ الذكر (الكرديّر) له رأس أخضر.
    info: |-
      الكردة البرية هي أكثر أنواع الكردات انتشاراً في العالم وهي سليلة معظم السلالات المنزلية.
      The male (goose) has characteristically shiny green heads, while females are inconspicuously brown.
      They are dabbling ducks that feed by skimming at the surface rather than diving.
      The duck is an inseparable part of ponds and river flows in Bohemia.
  animal.eagle:
    label: النسر
    summary: طائر شرس كبير ذو منقار منحني وبصر حاد.
    info: النسر الأبيض هو رمز وطني للولايات المتحدة الأمريكية وهو أحد أكبر الحيوانات المفترسة في أمريكا الشمالية. يصطاد بشكل أساسي الأسماك، والتي يلتقطها مباشرة من الماء بمخالب حادة. يصل طول جناحيه إلى أكثر من مترين ويصل عمره في البر إلى حوالي 20 عامًا.
  animal.emu:
    label: emu
    summary: الطائر الثاني حجمًا في العالم، طائر عملاق أسترالي لا يطير.
    info: إن الطيور الصرخة هي ثاني أكبر طائر في العالم وهي متوطنّة فقط بأستراليا. لا يمكنها الطيران لكنها تسبح جيدًا وتسابق بسرعة. الذكر هو الذي يجلس على البيض ويُعنى بالصغار بينما تغادر الأنثى المكان. وفي عام 1932 خسر الجيش الأسترالي ما عُرف باسم الحرب ضد الصرخات بسبب الجموع الكبيرة من هذه الطيور التي كانت تهدد المحاصيل.
  animal.falcon:
    label: الصقر
    summary: أسرع حيوان في العالم أثناء الطيران الهابط (أكثر من 320 كم/ساعة)
    info: |-
      يُعتبر الصقر المهاجر أسرع كائن على الأرض؛ حيث يصل إلى سرعة تزيد عن 320 كم/ساعة خلال الطيران الهابط.
      له بقع داكنة مميزة تحت العينين، تعمل على قمع انعكاس ضوء الشمس.
      استخدمه الإنسان للصيد لأكثر من ألفي عام؛ وتم تسجيل رياضة الصيد بالصقور ضمن قائمة اليونسكو للاستعمالات الثقافية.
      في التشيك يبني أعشاشه على الأبنية المرتفعة والجبال.
  animal.flamingo:
    label: ' flamingo'
    summary: طائر رمادي وردية يقف على قدم واحدة في المياه الضحلة.
    info: يكتسب الطائر رمزيته من الكاروتينات الموجودة في الطحالب والأسماك التي يأكلها. تولد صغاره بيضاء رمادية وتصبح ملونة تدريجياً. يخدم المنقار المنحنى كمرشح - يرشح الطائر طعامه من الماء عن طريق وضع رأسه إلى الأسفل.
  animal.goose:
    label: الغَاز
    summary: طائر مائي كبير يهاجر في هيئة مثلث؛ ويتقن البيض على الأرض.
    info: |-
      الغابة الكبيرة هي سليلة البرية للغواصات المنزلية.
      إنها تهاجر بتنسيق المثلث المعروف، حيث يستبدل الطيور القيادة دورياً.
      إنها طيور جريئة جداً أثناء وضع البيض وتدافع عن صغارها بشدة.
      في التاريخ، حافظت الغواصات على كابيتولينيوس في روما، حيث أثارت الصوت عدداً من الأعداء الغاليين.
  animal.hawk:
    label: الصقر
    summary: حيوان أنيق يصيد الطيور والثدييات في الغابات والمزارع.
    info: |-
      الصقر هو نوع من السناجب يتبع عائلة الصقاريات، ويتميز بقدرته على الصيد داخل الأشجار الكثيفة بسبب جناحيه القصيرين المستديرتين وذيله الطويل.
      وهو سريع جداً ومرن؛ حيث يصطاد الطيور أثناء الطيران أو بالانتظار.
      عادة تكون الإناث أكبر بكثير من الذكور.
      كان الصقر طائر صيد مطلوب في رياضة الصيد.
  animal.heron:
    label: النسر
    summary: طائر طويل يقف ثابتًا لصيد الأسماك بالقرب من الماء.
    info: النسر الرمادي هو أكبر طائر متناثر في أوروبا الوسطى. يقف كتمثالٍ ثابتٍ ويتوقع أن تأتي السمكة إليه، ثم يضرب بمنقاره بسرعة. يمكنه بلع الأسماك والضفدعات كاملةً. يطير مع عنقه مشوهًا على شكل حرف S، مما يميزه عن الطيور الأخرى التي تطير مع إبقاء العنق مستقيمًا.
  animal.hornbill:
    label: زبروجِي
    summary: طائر استوائي ذو منقار ضخم وقشرة مُحْرَجَّة.
    info: |-
      الزبروجي هو طائر ينتمي إلى عائلة الباسكروتيدي، يتميز بمنقار كبير مع قشرة عظمية.
      يعيش في غابات المناطق الاستوائية بأفريقيا آسيا.
      لا يبني أعشاشًا داخل الحفر بل داخل ثقوب الأشجار؛ حيث تغلقه الأنثى بالذكر وتبقى داخلها خلال فترة التزاوج.
      تعد وجوده مؤشرًا على صحة الغابة الاستوائية.
  animal.hummingbird:
    label: كوليبري
    summary: أصغر طائر في العالم قادر على الطيران إلى الخلف والبقاء في مكان واحد.
    info: الكوليبري الأحمر الصدر هو النوع الوحيد من الكوليبريات التي تبني أعشاشًا بانتظام في جنوب شرق آسيا. ي flap جناحيه حتى 53 مرة في الثانية، مما ينتج عنه صوت مميز. يأكل عصارة الزهور والحشرات الصغيرة؛ يخفق قلبه حتى 1200 مرة في الدقيقة.
  animal.ibis:
    label: إيبس
    summary: طير يمشي في الماء له منقار ملتف، مقدس في مصر القديمة.
    info: الإبس هو طائر يمشي في الماء ينتمي إلى عائلة ثريسكيورنيثيدا مع مناقير طويلة مشوهة بشكل مميز. كان الإبس المقدس معبودًا في مصر القديمة كرمز لل신 تحوت. يعيش هذا الطائر في مستعمرات بالمياه المالحة و deltas النهرية. تم إدخال الإبس البني عن طريق الخطأ إلى أوروبا وهو اليوم يتصرف بعنف ويتوسع كמין غازي.
  animal.kingfisher:
    label: الصقر الأزرق
    summary: طائر ملون يصيد الأسماك بالغوص في أنهار الجداول.
    info: |-
      يُعتبر الصقر الأزرق أحد أجمل الطيور بأوروبيا، حيث يتميز بظهره الأزرق الكهرماني وصدره البرتقالي.
      يقع على فرع فوق الماء ويتابع الحيوانات؛ ثم ينحدر إلى أسفل للبحث عنها.
      يعتبر مؤشرًا على نقاء المياه النهرية؛ لأنه يعيش فقط في المياه النظيفة والصحية.
      في اليابان، فإن نوع مشابه من الصقور (هيسيوي) هو رمزٌ لجمال الطبيعة.
  animal.kookaburra:
    label: الدِّرَّاجُ الْمُضْحِك
    summary: طائر الدِّرَّاج الأسترالي المعروف بضحكته الصاخبة التي تشبه ضحك الإنسان.
    info: |-
      يُعرف الدِّرَّاج المضحك أو كوكابورا بأنه طائر كبير من أستراليا يشتهر بصوته العالي والساخر الذي يشبه الضحك البشري.
      يعتبر رمزًا للغابة البرية في أستراليا، ويبدأ صوته يوميًّا الإعلان عن شروق الشمس وغروبها تقليديًّا.
      يلتقط هذا الطائر الزواحف والسحالي والعقارب والجرذان والحشرات.
      يعيش ضمن مجموعات عائلية حيث يساعد الأفراد الأصغر الوالدين على تربية الفراخ.
  animal.lorikeet:
    label: لوري
    summary: طائر ببغاء صغير متعدد الألوان يعيش على العسل النحل وحبوب اللقاح.
    info: الببغاء لوري الملون هو طائر ببغاء صغير من أستراليا الآسيوية يتمتع بأكثر أنواع البُرَص تألّقًا في العالم. يستخدم لسانه المشابك خصيصًا لجمع عصير الزهرة وحبوب اللقاح من الزهور الاستوائية، وهو ملقح مهم للغابات الاستوائية. يعيش هذا الطائر في مجموعات كبيرة ويتميز بأنه ضجير ومزاجي؛ كما أنه سريع التعلق بالإنسان عند احتجازه.
  animal.lyrebird:
    label: الليروكفوست
    summary: طائر أسترالي يقلد بدقة مثالية أي صوت من حوله.
    info: الليروكفوست النادر هو طائر أسترالي مشهور بقدرته على تقليد معظم الأصوات المحيطة مثل أصوات شفرات الطواحين، أو كاميرات التصوير الفوتوغرافي، أو صفارات السيارات، أو حتى نداءات الطيور الأخرى. يستخدم الذكور ذيلهم المعقد الشكل والمشابه للآلة الموسيقية الليرا لجذب الإناث مع عرض تقليد دقيق. وهو رمزًا رسميًّا للمقاطعة الأسترالية فيكتوريا.
  animal.macaw:
    label: أرا
    summary: طائر ببغاء نيوتروبيك كبير ذو ريش ملون وفم قوي.
    info: الأرا هو نوع من الببغاوات الكبيرة التي تعيش في غابات أمريكا الاستوائية، ويتميز بألوانه الزاهية بشكل لافت بين جميع الطيور. يمتلك فماً قوياً ومقوساً يستطيع به كسر حبات المكسرات الصلبة. هذه الطيور تعيش أزواجًا تبقى مع بعضها طوال حياتها. كما أن الأرا مهددة بسبب إزالة الغابات والتجارة غير القانونية للحيوانات النادرة.
  animal.magpie:
    label: الغواص
    summary: طائر أسود وأبيض ذو ذيل أخضر لامع.
    info: الغواص الشائع هو طائر من عائلة الغواصات يتميز بلونه الأسود والأبيض وذيله الطويل اللامع باللون الأخضر الداكن. يُعتقد أنه سارق للأجسام المعدنية اللماعة، لكن الدراسات العلمية لا تؤكد هذه الأساطير. كما أنه أحد الطيور القليلة التي يمكنها التعرف على انعكاس نفسها في المرآة. ويُعتبر رمزاً للسعادة والسعي إلى الخير في الصين.
  animal.nightingale:
    label: الصبي
    summary: طائر بني صغير يُغني أحد أجمل الأغاني الطيور.
    info: الصبي هو طائر بني صغير، حيث يقوم الذكر بإصدار واحد من أغنى وأجمل أنواع الغناء بين الطيور. غالبًا ما يغني في الليل وفي الصباح الباكر، وهو مصدر لاسم هذا الطائر. إنه قريب بعيد للقوقعة الحمراء. شهد الشعراء حول العالم منذ دانت حتى كيث إشادة بالغناء الصبوي باعتباره رمزًا للرومانسية والحزن.
  animal.ostrich:
    label: البطريق
    summary: أكبر طائر في العالم، غير قادر على الطيران؛ يركض بسرعة تصل إلى 70 كم/ساعة.
    info: البُطْرِيق ذو الأصابع الثنائية هو أكبر وأثقل طائر في العالم؛ يصل ارتفاع الذكور إلى 2.7 متر ووزنهم أكثر من 150 كجم. لا يمكنه الطيران، لكنه أسرع حيوان ذي قدمين ثنائية الإصبع في العالم، حيث يستطيع الوصول إلى سرعة تزيد عن 70 كم/ساعة. بيوض البطريق هي أكبر بيوض بين جميع أنواع الطيور. إصبع القدم المقابل للإبهام غائب لديه؛ إذ يملك فقط إصبعين.
  animal.owl:
    label: عُقاب
    summary: طائر مفترس ليلي العينان دائريتان، له طيران هادئ وسمع ممتاز.
    info: العُقاب الكبير هو أكبر عُقاب في أمريكا الشمالية. عيون العُقاب لا تتحرك، لذلك يدور رأسه حتى 270 درجة بدلًا من ذلك. طيرانه هادئ تقريبًا بسبب تركيب خاص للريش. يصطاد في الظلام باستخدام سمع استثنائي الحساسية.
  animal.parrot:
    label: صقر
    summary: طائر استوائي لونه زاهٍ قادر على تقليد الأصوات والكلام البشري.
    info: صقر الشارlat هو أحد أكبر الرموز في العالم بامتداد أجنحة يزيد عن المتر. يعيش في غابات الأمازون الاستوائية في أمريكا اللاتينية. تتميز الرموز بذكاء استثنائي – يمكن للصقر التعرف على الألوان والأشكال والعد. يعيش حتى 75 عامًا.
  animal.peacock:
    label: البومة
    summary: ذكر البومة مع ذيل مفتوح على شكل فان يحتوي على علامات ملونة رائعة.
    info: البومة ذات العينين تأتي من شبه القارة الهندية. الذكر (البومة) ينشر ذيله – في الواقع يتألف من ريش كثيف ممتد – في شكل فان أثناء التزاوج مع الإناث. الألوان المعدنية لا تنتج عن الصبغات، بل عن انحناء الضوء على هيكلات دقيقة في الريش.
  animal.pelican:
    label: البطريق
    summary: طائر مائي كبير ذو فكٍ واسع كمحبس للأسماك.
    info: البطريق هو طائر مائي كبير يتمتع بمنقاره المميز على شكل حقيبة تُستخدم كشبكة لصيد الأسماك. يمكن أن يحتوي الحقيبة حتى 13 ليترًا من الماء، ويقوم الطائر بإخراجها ومن ثم بلع السمك. كما أنه يستخدم أشكالاً هندسية في الهواء أثناء الطيران، ويستفيد من التيارات الهوائية الناتجة عن بعضها البعض.
  animal.penguin:
    label: 企鹅
    summary: 不会飞的南半球鸟类，游泳能力极强。
    info: 帝企鹅是所有企鹅中体型最大的，身高超过1.1米。它们生活在南极，能在极寒中孵蛋——雄性企鹅会在整个南极冬季用脚掌孵化蛋。在水下，它们的速度超过每小时30公里。
  animal.pheasant:
    label: بازانت
    summary: طائر كبير لونه زاهٍ؛ الذكر له ألوان مشرقة وذيل طويل.
    info: |-
      البازانت الشائع تم إحضاره إلى أوروبا من آسيا، لكن الآن هو جزء طبيعي من الحياة البرية الأوروبية.
      The male (rooster) has striking coloration, green-brown body, and characteristic red wattle around the eye.
      It is the most widespread game bird in the Czech Republic and forms the basis of hunting tradition.
      It nests on the ground in dense vegetation.
  animal.pigeon:
    label: الحمام
    summary: طائر رمادي شائع في المدن والريف، نسلاً عن الحمام الصخري.
    info: يُعتبر الحمام الصخري أسلاف جميع الطيور المنزلية والمفترسة من نوع الحمام في المدن. كان أول طائر يتم ترويضه؛ واستخدم الناس هذا النوع كحمامة بريد منذ آلاف السنين. يمتلك حاسة اتجاه استثنائية وقادرة على العودة إلى منزلها من مسافات تصل إلى مئات الكيلومترات.
  animal.puffin:
    label: بوبو
    summary: طير بحري صغير ذو فك ملون مثل الببغاء.
    info: البوبو الشمالي هو طائر بحري صغير يشبه البطريق، وله فك لونه زاهي مشابه للببغاء. يصطاد عن طريق الغوص والسباحة خلف الأسماك؛ ويمكن أن يحمل أكثر من عشرة أسماك في الفك دفعة واحدة. يتجمع هذا الطائر في مستعمرات على الصخور المرتفعة والأنفاق.
  animal.quail:
    label: كُرْبَلَا
    summary: طير صغير مختبئ يبني أعشاشه على الأرض في العشب.
    info: 'الكرابلة الحقلية هي أصغر عضو من عائلة الفسائنية بأوروبا. تتميز بالتخفي؛ نسمعها بسهولة (تقول: «بيت-بيت») أكثر مما نراها. على خلاف باقي أنواع البازلاء، فهي هاجعة وتقضي الشتاء في إفريقيا. بيوضها تعتبر طعامًا فاخرًا.'
  animal.raven:
    label: كركاع
    summary: طائر كبير وذكي أسود اللون يُعرف بنباحه المميز.
    info: الكركاع الكبير هو أكبر طائر من عائلة الكركاعيات، ويصل طوله إلى أكثر من 60 سم. يتمتع بإدراك استثنائي وقدرته على التخطيط للمستقبل واللعب وبناء روابط اجتماعية. كان له مكانة سحرية في الأساطير الشمالية (حمامة أودين هوجن ومونيّن) وفي الأساطير الكيلتية. ت受到 الأسطورة حماية البرج العثماني، حيث يقال إن الإمبراطورية ستنهار إذا غادر الكركاعات البرج.
  animal.roadrunner:
    label: كواكا تربية
    summary: العدو السريع في صحراء أمريكا الشمالية؛ رمز لرسوم متحركة.
    info: الكواكا التربوية الكبيرة (الركض على الطرق) هي طائر من عائلة كوكاكيتيداي يفضل المشي والجري بدلاً من الطيران. يمكنه الوصول إلى سرعة تزيد عن 30 كم / ساعة ويأكل الثعابين، الزواحف، الحشرات وحتى الثدييات الصغيرة. قادرة على اصطياد وقتل الأفاعي. أصبحت معروفة كبطولة رسوم متحركة أمريكية مثل 'Road Runner' و'كوياوت'.
  animal.robin:
    label: الصقر الأحمر
    summary: طائر صغير ذو صدر أحمر، رمز لعيد الميلاد في بريطانيا العظمى.
    info: |-
      الصقر الأحمر هو طائر غنائي صغير يتميز بلون بطني البرتقالي والأحمر النموذجي.
      إنها شجاعة إلى حد ما؛ تراقب الحيوانات التي تنخر الأرض وتجمع الديدان الكبيرة المكشوفة.
      هي الطائر الوطني لبريطانيا العظمى ورمز تقليدي لعيد الميلاد.
      تبقى على أرضها طوال العام وتغني حتى في الشتاء.
  animal.seagull:
    label: راكي
    summary: طائر побشري يبحث عن طعام بالقرب من البشر والبحر.
    info: الراكي الفضي هو أحد أكثر الطيور البحرية انتشارًا في أوروبا. إنه متكيف ومتغذٍّ على كل شيء؛ ويوجد ليس فقط على الساحل البحري، بل أيضًا داخل اليابسة قرب البحيرات والنهر. وهو ذكِي جدًّا وقد يتذكر الأماكن التي تطعمه فيها الناس. فاهتمامه العدوان ب الطعام البشري مصدر العديد من القصص بين الزوار عند الشاطئ.
  animal.secretary_bird:
    label: النسر الكاتب
    summary: طائر أوروبي طويل الساقين يقتل الثعابين بالركض.
    info: النسر الكاتب طائر كبير من آسيا والقارة الأفريقية، ويتحرك بشكل رئيسي مشياً على سهول المروج المفتوحة. يُستخدم قدميه القويتين لضرب الحيوانات مثل الثعابين والفئران بقوة تزيد ثلاث مرات عن وزنه الجسدي. يحمل اسمه بسبب وجود ريش طويل على رأسه يشبه شعر الكاتب خلف الأذن.
  animal.sparrow:
    label: الغراب
    summary: طائر صغير بني يعيش بالقرب من أماكن السكان.
    info: الغراب المنزلي هو أحد أكثر الطيور انتشاراً في العالم وهو مخلص للإنسان. يبقى قريباً جداً من المساكن البشرية حيث يبني أعشاشه في الشقوق بين الجدران وأسطح المنازل. خلال العقود الأخيرة، انخفضت أعداد الغرباء بشكل كبير داخل المدن. بالنسبة للفلاسفة التشيشين، فإن الغراب رمز للordinariety والتكيف.
  animal.spoonbill:
    label: كولبيك
    summary: طائر أبيض يمشي في الماء وله فم مميز على شكل ملعقة.
    info: الكولبيك الأبيض من عائلة الطيور التي تشبه الإيبس، لكن يمكن التعرف عليه بسهولة بسبب فمه المسطح والمُلقم الشكل. أثناء البحث عن الطعام، يتحرك الفم من جانب إلى آخر في المياه الضحلة. يبني أعشاشه في مستعمرات داخل الغابات الرطبة والغابات العشبية.
  animal.stork:
    label: البطريق
    summary: طائر أبيض كبير ذو فك أحمر؛ يقال إنه يجلب الأطفال.
    info: البطريق الأبيض هو طائر هجرة يبني أعشاشه على السطوح والأسياخ في جميع أنحاء أوروبا. يقضي الشتاء في إفريقيا الاستوائية ويُعيد إلى نفسه نفس العش كل عام، مما يجعله أكبر سنًا مع مرور السنوات. يعتبر رمزًا للربيع والعذوبة؛ وفي التradition الشعبي، فإنه يجلب الأطفال. تشكّل التشيك واحدة من أكثر الدول أهميةً في أوروبا لبناء البطاريق لأعشاشها.
  animal.swallow:
    label: النحل
    summary: طائر سريع يأكل الحشرات في الهواء وذوؤه ذيل مجزأ.
    info: النحلة الشائعة هي طائر هجرة تمضيه فصل الشتاء في إفريقيا جنوب الصحراء الكبرى وتبيض في أوروبا. إنها ماهرة جداً في الطيران؛ حيث تتغذى على الحشرات فقط أثناء الطيران، ويمكنها شرب الماء من سطح البحيرة دون أن تنخفض للهبوط. تبني أعشاشها في العنابر تحت الأسطح؛ وفي الثقافة الشعبية فإن وجود النحلة يجلب الحظ السعيد للمنزل. كما أنها رمز للربيع والعودة وللولاء لبيوتهم.
  animal.swan:
    label: البط
    summary: طائر مائي أبيض كبير وفخم، رمز الجمال والرومانسية.
    info: |-
      البط الكبير هو أكبر طائر طائر في أوروبا مع امتداد جناحين يزيد عن 2.4 متر.
      يرمز إلى الجمال والمودة والعطاء؛ لأن الأزواج تبقى مخلصة لبعضها البعض مدى الحياة.
      يُرفع منقاره وينفخ ريشه بغير قصد كتحذير للعدو.
      في قصة هـ. تش. أندرسون للأطفال، يكون البط رمزًا لتغيّر الديك البشع.
  animal.toucan:
    label: توكان
    summary: طائر استوائي يملك منقارًا كبيرًا وألوانه زاهية.
    info: يوجد التوكان العملاق في غابات المطر في أمريكا الوسطى وجنوبها. منقاره المميز يبلغ طوله أكثر من 20 سم، لكنه خفيف جدًا لأنه مكوّن من غرف هوائية. يُستخدم المنقار في تنظيم درجة حرارة الجسم، وتقشير الفواكه، وكمصدر إشارات بصرية للطيور الأخرى من نوع التوكان.
  animal.woodpecker:
    label: داتيل
    summary: طائر يطرق قشرة الأشجار لبحثه عن الحشرات أو حفر تجويف.
    info: الداتيل هو طائر من عائلة Picidae مُعدٍّ للطرق على الخشب بمنقار صلب وذيل متين كدعم. لسان الطائر قد يصل إلى ثلاث مرات طول المنقار، ويستخدمه لسحب اليراعات من الثقوب المحفورة. كما يستخدم الطرق للتواصل وإعلان أراضيه. الداتيل الكبيرة (Dryocopus martius) هي أكبر داتيل في أوروبا.
