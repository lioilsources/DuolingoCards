lang: ar
pivot: false
title: الطيور
cards:
  animal.eagle:
    label: النسر
    summary: طائر شرس كبير ذو منقار منحني وبصر حاد.
    info: النسر الأبيض هو رمز وطني للولايات المتحدة الأمريكية وهو أحد أكبر الحيوانات المفترسة في أمريكا الشمالية. يصطاد بشكل أساسي الأسماك، والتي يلتقطها مباشرة من الماء بمخالب حادة. يصل طول جناحيه إلى أكثر من مترين ويصل عمره في البر إلى حوالي 20 عامًا.
  animal.flamingo:
    label: ' flamingo'
    summary: طائر رمادي وردية يقف على قدم واحدة في المياه الضحلة.
    info: يكتسب الطائر رمزيته من الكاروتينات الموجودة في الطحالب والأسماك التي يأكلها. تولد صغاره بيضاء رمادية وتصبح ملونة تدريجياً. يخدم المنقار المنحنى كمرشح - يرشح الطائر طعامه من الماء عن طريق وضع رأسه إلى الأسفل.
  animal.hummingbird:
    label: كوليبري
    summary: أصغر طائر في العالم قادر على الطيران إلى الخلف والبقاء في مكان واحد.
    info: الكوليبري الأحمر الصدر هو النوع الوحيد من الكوليبريات التي تبني أعشاشًا بانتظام في جنوب شرق آسيا. ي flap جناحيه حتى 53 مرة في الثانية، مما ينتج عنه صوت مميز. يأكل عصارة الزهور والحشرات الصغيرة؛ يخفق قلبه حتى 1200 مرة في الدقيقة.
  animal.owl:
    label: عُقاب
    summary: طائر مفترس ليلي العينان دائريتان، له طيران هادئ وسمع ممتاز.
    info: العُقاب الكبير هو أكبر عُقاب في أمريكا الشمالية. عيون العُقاب لا تتحرك، لذلك يدور رأسه حتى 270 درجة بدلًا من ذلك. طيرانه هادئ تقريبًا بسبب تركيب خاص للريش. يصطاد في الظلام باستخدام سمع استثنائي الحساسية.
  animal.parrot:
    label: صقر
    summary: طائر استوائي لونه زاهٍ قادر على تقليد الأصوات والكلام البشري.
    info: صقر الشارlat هو أحد أكبر الرموز في العالم بامتداد أجنحة يزيد عن المتر. يعيش في غابات الأمازون الاستوائية في أمريكا اللاتينية. تتميز الرموز بذكاء استثنائي – يمكن للصقر التعرف على الألوان والأشكال والعد. يعيش حتى 75 عامًا.
  animal.peacock:
    label: البومة
    summary: ذكر البومة مع ذيل مفتوح على شكل فان يحتوي على علامات ملونة رائعة.
    info: البومة ذات العينين تأتي من شبه القارة الهندية. الذكر (البومة) ينشر ذيله – في الواقع يتألف من ريش كثيف ممتد – في شكل فان أثناء التزاوج مع الإناث. الألوان المعدنية لا تنتج عن الصبغات، بل عن انحناء الضوء على هيكلات دقيقة في الريش.
  animal.penguin:
    label: 企鹅
    summary: 不会飞的南半球鸟类，游泳能力极强。
    info: 帝企鹅是所有企鹅中体型最大的，身高超过1.1米。它们生活在南极，能在极寒中孵蛋——雄性企鹅会在整个南极冬季用脚掌孵化蛋。在水下，它们的速度超过每小时30公里。
  animal.toucan:
    label: توكان
    summary: طائر استوائي يملك منقارًا كبيرًا وألوانه زاهية.
    info: يوجد التوكان العملاق في غابات المطر في أمريكا الوسطى وجنوبها. منقاره المميز يبلغ طوله أكثر من 20 سم، لكنه خفيف جدًا لأنه مكوّن من غرف هوائية. يُستخدم المنقار في تنظيم درجة حرارة الجسم، وتقشير الفواكه، وكمصدر إشارات بصرية للطيور الأخرى من نوع التوكان.
