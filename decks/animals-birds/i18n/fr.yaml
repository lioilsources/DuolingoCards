lang: fr
pivot: false
title: Oiseaux
cards:
  animal.eagle:
    label: aigle
    summary: Grand oiseau de proie avec un bec courbé et une vision perçante.
    info: La buse impériale est le symbole national des États-Unis et l'un des plus grands prédateurs d'Amérique du Nord. Elle chasse principalement des poissons qu'elle attrape directement dans l'eau avec ses griffes acérées. Elle peut avoir une envergure d'ailes d'environ deux mètres et vit environ 20 ans dans la nature.
  animal.flamingo:
    label: flamant
    summary: Oiseau rose se tenant sur une patte dans des eaux peu profondes.
    info: Le flamant rose tire sa couleur caractéristique des caroténoïdes contenus dans les algues et les crustacés dont il se nourrit. Les oisillons naissent grisâtres et ne prennent leur teinte rose qu'avec le temps. Son bec courbé sert de filtre – le flamant filtre sa nourriture de l'eau en plongeant la tête en bas.
  animal.hummingbird:
    label: colibri
    summary: Le plus petit oiseau du monde capable de se maintenir en suspension et de voler à reculons.
    info: Le colibri à gorge rubis est le seul colibri nidifiant régulièrement à l’est de l’Amérique du Nord. Il bat des ailes jusqu’à 53 fois par seconde, ce qui produit un bourdonnement caractéristique. Il se nourrit de nectar et de petits insectes ; son cœur peut battre jusqu’à 1 200 fois par minute.
  animal.owl:
    label: chouette
    summary: Oiseau de proie nocturne à yeux ronds, vol silencieux et ouïe exceptionnelle.
    info: La chouette effraie est la plus grande chouette d'Amérique du Nord. Les yeux des chouettes sont fixes, donc elles tournent leur tête jusqu'à 270 degrés. Leur vol est presque silencieux grâce à la structure spéciale de leurs plumes. Elles chassent la nuit en utilisant une ouïe particulièrement sensible.
  animal.parrot:
    label: papouga
    summary: Oiseau tropical coloré capable d'imiter des sons et la parole humaine.
    info: L'ara rouge est l'un des plus grands perroquets du monde, avec une envergure dépassant un mètre. Il vit dans les forêts tropicales d'Amérique latine. Les perroquets possèdent une intelligence extraordinaire – l'ara peut reconnaître les couleurs, les formes et compter. Ils peuvent vivre jusqu'à 75 ans.
  animal.peacock:
    label: paon
    summary: Mâle paon avec une queue en éventail iridescente pleine de couleurs.
    info: Le paon à couronne provient du sous-continent indien. Le mâle (paon) étale sa queue – en réalité, il s'agit de plumes couvertes allongées – en éventail lors de la courtisance des femelles. Les couleurs iridescentes ne proviennent pas de pigments, mais de la réfraction de la lumière sur les microstructures des plumes.
  animal.penguin:
    label: pingouin
    summary: Oiseau non volant de l'hémisphère sud, excellent nageur.
    info: Le pingouin empereur est le plus grand de tous les pingouins; il mesure plus de 1,1 mètre de haut. Il vit en Antarctique et pond ses œufs dans les froids extrêmes – les mâles les tiennent chauds sur leurs pieds pendant toute la saison d'hiver antarctique. Sous l'eau, il peut atteindre une vitesse de plus de 30 km/h.
  animal.toucan:
    label: toucan
    summary: Oiseau tropical avec un bec gigantesque et coloré.
    info: Le toucan géant vit dans les forêts tropicales d'Amérique centrale et sud-américaine. Son bec remarquable mesure plus de 20 cm de long, mais est très léger – il est constitué de chambres d'air. Il sert à réguler la température corporelle, à croquer des fruits et à agir comme un signal visuel pour les autres toucans.
