lang: ha
pivot: false
title: Bantiya
cards:
  animal.eagle:
    label: orel
    summary: Wani amura fafa da gama zuwa wuri ko mai zauro.
    info: Orel Bellohalavi na Amerika Kusafe ya taimako simbolariya ya amerika Kusafe, wanda yake da amura suka ga hanyar biyu meter da kuma ya farauko muka 20 sai da sauran mutum. Ya farauko rafi, wanda ya canza wasu da shafin yamurun da kukuwar gyros.
  animal.flamingo:
    label: plamenaak
    summary: Wadibin hauwa roziyoyi wajen gilma.
    info: Plamenaak rozioya da yake ya zauro da karotenoid din rasayi da koreyi wuya. Wani daga mutum mai nuna yake ya canza da abubuwar biyu da suka fi shafawa. Zobaki yake ya bai kalmar filtar waɗo da suka fada hausa.
  animal.hummingbird:
    label: kolibri
    summary: Wani duka da adanai yake suna canza guzabci da kusanyar ranran.
    info: Kolibri rubihornya wajen gari duka ya farau'ye da hausa dinsu Afrika ta Kudu. Wuya kirdiya zuwa 53 mara koyarin sautun, wanda ke amfani da biso tsauso. Yan kanza nektaru da wasu aranai; sardaune ya zama zuwa 1.200 mara koyarin sautun.
  animal.owl:
    label: sova
    summary: Nochi adai da kuka wanda aka iya mata, mutum yake na harkar da suka kuma kusancin samun.
    info: Sova ya fada ke Ameerika Kudu da kalmar da suka kamar mata. Mata sova shan kuwa, kafin ya zama hausa da 270 digri. Samun sova yauke da haraka da amfani da kusancin peretare waɗannan.
  animal.parrot:
    label: Papousku
    summary: Wani tsaye nigeri da yake ka idan kauka na amma daga so'oro kuwa.
    info: Ara sharlatowy wace ya kamatawa tsaye tunda gida cewa yake kawo da mutin meter. Ya kafin Latin America don kasa faɗada. Wadanda papousku sun ga'awa adabu lokacin halbakin abubuwar gano - Ara yake ka iya fara hausa, rungurun da koƙari.
  animal.peacock:
    label: páv
    summary: Male paav wanda ya iya farin gaskiya da kalaka-kalakin ranar dawo.
    info: Páv korunkatý ya kai haifar gwamnatin Indiya. Male paav (páv) yana tura farin gaskiyar kuka - wanda ke fada da kuka - zuwa ranar dawo don kusancin gamini. Rangin iridiscent ne kusa da shan'aran ran hanyari šinin lafiya, kuma kusa da ombattun šinin lafiyan microstructures.
  animal.penguin:
    label: tučňák
    summary: Wani duka guwo da kudu yake a gilga, aman swima.
    info: Tučňák císařský ya tuma suka taushe a tsakanin wanci tučňák; ya canza ƙarfafin 1,1 mete. Ya shiga don Antarktidan da ya fiyayya wuri dinsu don mazuren kedu - babban ya fura wuri don antarktic winter denkaka. Don galauta, ya canza 30km/h.
  animal.toucan:
    label: tu'kan
    summary: Tu'kan ya kuma da zobi zuwa wato na tsitsiri.
    info: Tu'kan obirki yake ana latsi daga halbura da shanawa Amaerika ta Kaskari da Amaerika ta Tsangaya. Zobin daya ya kira 20 sentimita, amma ya kaza - ya kamata a wasu gilabanci. Ya haifar da suka jama'a, ya fara gudda da matar rawuni da ya haifar da waɗannan tu'kani.
