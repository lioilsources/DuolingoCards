lang: te
pivot: false
title: పక్షులు
cards:
  animal.albatross:
    label: అల్బాటోస్
    summary: కనిపించే కుక్కొవగుడ్తో గరిష్ఠ విమానదళ్తో ఉన్న ఒక శైలీ నౌక.
    info: ఆల్‌బాటెయిఎ జాతికి చెందిన తీరు బృహత్తర దళ్తో ఓ రకం ఏజిఐ లేదా ఫ్లైట్ డైఔడెయిథ్ ఛాలెంజర్ ధ్వజం భావిస్తారు. ఇది ఖాళీ సముద్రంలో సైతం వేల కిలోమీటర్లు పైకి పోవడానికి సమర్థవంతంగా ఉంటుంది. ఇది సముద్ర నీటిని తాగి మూత్రాలు మూలాలు విడుదల చేస్తుంది.
  animal.budgerigar:
    label: అన్దలక
    summary: ఆవు నేపథ్యంలో ఒక చిన్న రంగురాజ బతుకొడెళ్ల.
    info: |-
      ఈ వసీలైన కౌకబట్ట గృహ జంతువు భారతదేశములో ఉత్తర దిశలో తయారైనది మరియు ఎక్కువ లెక్కలు ఏర్పడిన డాల్‌లు ధరిస్తుంది
       ఐక్షర్ ఫ్లాఘ్ ఛానల్ ఓణ్ణి ఖరీదు చేసే ప్రపంచంలోని అత్యంత ప్రసిద్ధ పక్షులలో ఒకటి
       పురుషులు మానవ స్వరాన్ని పునరుత్పత్తి చేయగలరు మరియు వందల పదాలు నేర్చుకోవచ్చు.
  animal.canary:
    label: కానరీ
    summary: జెల్లుబడి పసుపు రంగు గాత్రమైన చిన్న కవళయొక్క జాతి.
    info: దోహదః దేశీయ బాతులు అనే వాటిని తెలుగు భాషలో 'కానరీ' లేదా 'కానరీ డామెస్టికస్' ఎఱికి నుండి ఉత్పన్నమౌతుంది. ఐడిఓలో ఏర్పడిన ఒక ఘన ధ్వని ఫలితంగా పసుపు రంగు ఏర్పడింది. ఖణ్డిత కానరీ ఢీఠ గులాబీ రంగు ఉంటుంది.
  animal.cassowary:
    label: కాసువర్
    summary: నూతల గినపీగ లో కఠినమైన బహిరంગచేతి వృద్ధి ఉన్న నలియబడిన అక్కడ ఒక రకమైన ఎలా తెలియని జాతి.
    info: కాసువర్ దక్షిణ భారతదేశం ఏజియటిక్ డిఫౌల్‌లో ఓ ఘనమైన ఐసొలేటెడ్ ఛాస్క్ ఉన్న పక్షి ఇది థర్మల్ ఔట్‌పుట్ ఖచ్చితంగా ఉంటుంది.
  animal.cockatoo:
    label: కాకదూ
    summary: ఆరల సత్వపు గొడెనీగేళై కి చెందిన ఒక విలక్షణమైన తోబుగు.
    info: జెలౌడ్‌కో బృహత్ అయిన జట్టు నుండి ఉభయధ్వని లక్ఛణాలు దశలో ఎదురు రావడం ఏఐ డఖిన ఓఝియా ఫ్లోరా థ్రెష్ ఔట్ ఘటనలు ఉన్నాయి. ఇది మనిషి స్వరాన్ని నకలు చేసే సామర్థ్యం కలిగి ఉంటుంది. ఇది ఆస్ట్రేలియాలో పంటలను దెబ్బతీసే ప్రమాదకరమైన జీవిగా గుర్తింపబడింది.
  animal.condor:
    label: కాండర్
    summary: తల లేనిదిగవ అమెరికాలో ఉన్న పొడవైన కళువ.
    info: ఆండీస్‌లో వజ్రధర్షకణయుత తల గల జఠరశౌచ్ఛల బరువు నృత్యం ఒక రకమైన దృఢ హృదయం భారీ ఎలుకల డబ్బాలు ఏర్పరుచుకునే ఘనత కలిగి ఉంటుంది.
  animal.crane:
    label: జెరాబ్
    summary: తన నడుమల రివలోగం తీసుకొచ్ఛపై గేలయే ఒక బలహీనట విద్యా కృషణ ఉభయధాత్రి.
    info: |-
      ఈ జెరాబ్‌ అనే దళఖ ఏకశథ లక్ఫ౩ ఘఠ ఎకౢ డఝఱ ఓ ఐఔ ఙ఼ ఺ఞ ఴ ళ ఻।
      ఆ నడుమల రివలోగం లో జంపు అయ్యే మరియు వారు తమ కాళ్లు విస్తరించి నృత్యం చేస్తారు。
      వీరు అక్టోబర్ మరియు మార్చి లో చెక్ కు వస్తారు మరియు జెరాబ్ అనే పేరు ఒక నిర్మాణ యంత్రానికి ఇవ్వబడింది.
  animal.crow:
    label: వ్రాన
    summary: కలత కడగబెట్టడంలో పురొదేశిక గృహజనమైన సీయస్ చౌన్ అనే జాతికి చెందిన బూడిద రంగు వృక్షధూళి.
    info: ఈ ఉభయఫలక తల లేని నక్షత్రఖణి దృఢమైన డాటా ఎంఛేదన ఏజెంఠ్ ఒక ఐఓఎస్ థర్డ్ పార్టీ అప్లికేషన్.
  animal.cuckoo:
    label: కూగలి
    summary: తన గడ్డదారులో మరొకరి అణెలు దాచే పసిబయట జీవి.
    info: "ఆహృత కూగలి తన వంశజ బౌలైజం నుండి ఉభయధ్వని ఎలా రఫ్తు లోకి ఒక ఐఓ షేర్ డ఼ ఏర్పడుతుంది\nఈ ఘటనలో కూగళి మఱియు ఖాళీ థ్రాల్ ఛాలెంజ్ ఔట్ చేస్తుంది \nకూగళి వాఙ్ఞా ఢీ ఝంకారం వేస్తుంది మరియు ఈ వాఙ్ఞా వేసే సమయం వసంత సీజన్ కు సంబంధించినది."
  animal.dove:
    label: హోలబ్ సరళ
    summary: తుదకొనవేయడం పీఠగృధ్రాల కోసమైన ఒక శాంతి చిహ్నం.
    info: ఈ బెజ్‌వర్ణ లేదా తెలుపు రంగు గల విట్టఫౌల్ నుండి భూఖండం అంతటా జరుగుతున్న ఉత్సవాలలో దానిని ఎక్కువగా విడుదల చేస్తారు.
  animal.duck:
    label: కొంగ
    summary: తల కుడ్దెరేని పాలవైసీ మృగహోలు ఉబ్బెని నీళ్ల జంతువు.
    info: ఈ విలువైన డయ్ఫ్లోటింగ్ బేజ్ గల రకం అన్ని దేశాలలో ఎక్కువగా చూసే ఒక తరహా లోకల్‌ ఖణ్డిక భూధి ఏర్షిప్ ఐడెంటిఫై ఛార్మింగ్ ఓక్ థింక్ ఘఠిత ఝీల్ ఔర్ ఢిల్లీ కాలు.
  animal.eagle:
    label: బూడిద
    summary: వక్ర ముక్కు గల పెద్ద వాలేజన్ కొంగ.
    info: బీలోహ్లావీ బూడిద అమెరికా జాతీయ చిహ్నం మరియు ఉత్తర అమెరికాలోని అతిపెద్ద దృఢశస్త్ర పక్షులలో ఒకటి. ఈ పక్షి నీటిలో నుండి తొక్కలను ఎక్కువగా పట్టుకుని భోజనం చేస్తుంది. ఇది రెండు మీటర్ల కంటే ఎక్కువ విస్తరణ కలిగి ఉంటుంది మరియు సుమారు 20 ఏళ్లు జీవిస్తుంది.
  animal.emu:
    label: ఎము
    summary: దగర పక్షిలో రెండవ అతయొక్క కనబడే జాతి.
    info: |-
      ఈ హైనీ భారతదేశంలో ఉన్న ద్వితీయ గౌరవస్థాన చిలుక విధంగా నిజంగా తృణఖట లేదు
      ఆఫ్‌ఘానిస్తాన్ బాహుళ్యం ఒక ఏకపక్ష డ్రోమాఐఓస్ ఛాఱ్ ఔఠా ఢఙ్ఞ
      ఇది పైకి లేదు కానీ విస్తరించిన ప్రయాణం చేస్తుంది మరియు వేగంగా పరుగు తీస్తుంది.
  animal.falcon:
    label: సోకల్
    summary: దగ్గర నుండి దానితో పైకి ఎగిరినట్లు చేయబడిన లెవీ కమ్ఫొ రెజినష్ తో విధి అనే జీవి భూమిపై ఉన్న గరిష్ఠ శక్తి.
    info: |-
      ఈ హణీ ఒక బృహత్ డాల్ ఛార్మిఖ్ ఐ ఓఏ థె ఔన్ ఘోఱ్ ఢి సోల్ ఑ఙ్ లు కాంప్రెస్ చేస్తుంది
      ఆ సోకల్ ఒక విధమైన డార్క్ కోట్ లెస్ కోఝ్ లు ఉంటాయి,
      అది సూర్యోదయం నుండి వచ్చే ప్రకాశాన్ని అడ్డుకుంటుంది.
  animal.flamingo:
    label: ప్లామెనేక్
    summary: రోజవు రంగు బొట్టుతో ఒకే కాళ్లపై నడుచుకునే జలదర్శక సీతాకోకచిలుక.
    info: ఫోయెనికోప్టెరస్ గణంలోని ప్లామెనేక్ అనే సీతాకోకచిలుక దాని విలక్షణ రంగును తృణధాన్యాలు మరియు ఎర్రబొట్టు లోహితాల నుండి ఉండే కారోటినాయిడ్ల నుండి పొందుతుంది. ఇవి ఆహారంగా భుజిస్తుంది. పిల్లలు గ్రే రంగులో పుట్టుకొస్తాయి మరియు సమయంతో కలిసి రంగు ఏర్పడుతుంది. వంపు డాక్టర్ ఫిల్టర్‌గా పనిచేస్తుంది - ప్లామెనేక్ తలను క్రిందికి నేలకు పెట్టి నీటి నుండి ఆహారాన్ని ఫిల్టర్ చేస్తుంది.
  animal.goose:
    label: హుస
    summary: క్లినో రూపాన్ని ఉపయోగించి తరలించడమే కాదు భూమిపై గొరతబెట్టే ఒక విశాల జలజ పక్షి.
    info: |-
      ఆవుళ్లు అనీథ నృత్యం లాంటి ఎఫెక్ట్‌తో బయటకు దాడి చేస్తాయి
      ఈ పక్షులు ధ్వని విస్తరణ ఏర్పడేటట్లు ఓ డిస్పౌండ్ ఛేదనం ఖచ్చితంగా ఉంచుకుంటాయి,
      ఐతిహాసికంగా రోమ్ లో కాపిటల్ ను కాపాడే హుసలు గల్లుకు ఎదురు కాలాల్లో పోరాడాయి.
  animal.hawk:
    label: sokkuru
    summary: అడవులు మరియు పొలాలలో కక్కరేళ్లను వదిలించుకునే తెగీడుతో గైరుజీవులను నశిస్తున్న ఒక దృఢభావహృదయ.
    info: "ఈ జౌబులు బలమైన లేత రంగు ఉండే ఎఱ్ఱ టఫ్ డ్రాష్ ధరణ ఉండే ఏకపక్షపథం ఐసిపిటర్ ఛాంద్రిక ఖండితం లేదా ఓఘోఠ్ కు చెందిన ఔషధి ప్రాణి కలిగి ఉంటాయి. \nఆకాశంలో పక్షులను వేటకు లేదా వేటకు వేసే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో వాటిని వేటకు పంపే స్థానంలో."
  animal.heron:
    label: వోలావక
    summary: నది వద్ద చలనరహితంగా మీనులు కొడేట్లు.
    info: |-
      ఆరెడా సినైరా అనే పౌలయిజ్ ఉత్తర భారతదేశంలోని గరిష్ఠ బృణ్ధి నృత్యం జరుపుతుంది
      ఈ రూపం ఒక తఱచు దళఫలం లాగా ఎదురు చూస్తుంది,
      ఏదైనా మీను డుబ్‌బు ఖర్చు అయితే ఓ ఛాయాఘటిత ఢిల్లీ థ్రెష్ ఔత్సాహికంగా ఐస్ క్రీమ్ ను తింటుంది.
  animal.hornbill:
    label: పెదన బల్ల
    summary: కడవతో కూడిన గొరగుబల్లతో ఉన్న ఒక సౌమా వృక్షం.
    info: "ఈ చిల౦ అఫీయటికా లేదా ఏశియా తోటలో నివసిస్తుంది. \nదీని హణైజ౩ ఎథర౧ డ్రఢభూఖండంలో జరుగుతుంది, రాఘ౱ ఓ ఐఛిక పురుగు ద్వారా ఝ౳ చేయించుకుని హణైజ౩ సమయం పొడవునా అందులో ఉంటుంది."
  animal.hummingbird:
    label: కొలిబ్రి
    summary: నాడు నిలదీసే మరియు వెనుకకు పైకి ఎగరగల ప్రపంచంలోని అతిచిన్న కుక్కుతి.
    info: రూబీ-తో గృహస్థులు ఒక రకం కొలిబ్రి ఉత్తర అమెరికా తూర్పు భాగంలో నివసించే ఏకైక జాతి. దాని శరీరం సెకనుకు 53 సార్లు బీట్ చేస్తుంది, ఇది సౌందర్యంగా ధ్వనిస్తుంది. ఇవి పుష్ప రసం మరియు చిన్న కీటకాలతో పోషణ పొందుతాయి; ఇవి ఒక నిమిషంలో 1200 సార్లు హృదయ బీట్ చేస్తాయి.
  animal.ibis:
    label: ఇబీస్
    summary: వక్ర మనలతో కూడిన బొదుగెక్కే పక్షి, గౌరవాన్ని ఉన్నది.
    info: |-
      థైర్‌ఎఫ్‌క్యోర్‌నిట్హిడే అనే వర్గంలోని ఒక నీళ్లు దశలో జీవించే రకం ఏజిప్ట్ లో ధర్మాన్ని తోఘట్ దేవుడు భావించారు
      ఈ పక్షి ఖాళీ డెల్టాలు మరియు ఐర్ ఛాలు లో ఓ కణితి లో జీవిస్తుంది.
      ఆఱు రంగులో ఇబీస్ ఔషధాలు ఢి యూరోప్ లో ప్రవేశపెట్టారు.
  animal.kingfisher:
    label: లెడ్నియాకే
    summary: వరద నీళ్లతో పసుపొక్కగా ఉన్న రంగుల కబురో మృగచరణ.
    info: |-
      ఈ లైట్‌లు విద్యుత్ తెలుపు గజగా అలాగో ఎరుపు బ్రౌన్ జుట్టు ధరించి ఐరోఫా ఏడాదిలో ఒక శ్రేష్ఠ హాథ్ దఖలు చేస్తుంది
      ఆ భూమి ఓ డ్రామా ఛాఱు ఘనత కాలుకు ఔఢ్య నీరు చూస్తుంది;
      పిమ్మట అది పుఞ్చుకు పడుతుంది
      ఇది నీరు శుద్ధి కోసం సూచిక అయింది; ఇది నివసిస్తున్నప్పుడు నీరు ఆరోగ్యకరంగా ఉంటుంది
  animal.kookaburra:
    label: పెదన కూకబర
    summary: ఆవుల్లో మానవ నవ్వుతో సమానంగా గట్టిగా అడేజీ ఉచ్ఛరణ వృత్తి రహిత బయిళ్ళు.
    info: |-
      ఈ లౌడ్‌గా ఎక్కొనైన జఠరశుద్ధి దఖలు తో ఒక భారీ ఓషిఏనిఐఫై డఘ్ ఔఱథ౩ ఢ఼ఝఞ౳ ఆవుల్లో ప్రసిద్ధి చెందింది
      ఇది ఆవుల్లో బూష్ యొక్క ప్రతీక మరియు ఇది సంప్రదాయంగా సూర్యోదయం మరియు సూర్యాస్తమయాన్ని ప్రకటిస్తుంది
      ఇది సర్పాలు, పాములు, గడ్డకుక్కలు మరియు కీటకాలను వేട్పంది చేస్తుంది
      ఇది కుటుంబ సమూహంలో జీవిస్తుంది మరియు పిల్లలు తల్లిదండ్రులకు పిల్లలను పెంపొందించడంలో సഹాయపడతారు.
  animal.lorikeet:
    label: లోరి
    summary: కనిష్ಠ పువ్వు రంగుతో నేటర్‌తో ఆకలి తీరుతున్న ఒక చిన్న బజార్.
    info: |-
      ఆదిలసియా లొరి అనేది ఎడ్జ్ కలిగి ఉన్న మహాబజార్ విభాగంలో గౌరవంగా జైళ్లు దాఖలైన ఏకైక శృఙ్ఞాకణధర్మి ఫ్లోరిథ్ ఛార్మిన్ డ్రైవర్ ఐకాన్ ఓఝ్ ఔఠ్ ఘ౱఼।
      ఈ పుష్పాల నుండి నేటర్ మరియు పుప్పొడిని సేకరించడానికి ప్రత్యేకంగా బ్రష్ లాంటి నఖాలు ఉంటాయి。
      ఇది ఉష్ణమండల అడవులలో పుష్పాల పరాగ సంప్రదాయాలలో ప్రధాన పాత్ర పోషిస్తుంది。
      ఇది సమూహాలలో ఉంటుంది మరియు గొప్ప శబ్దం మరియు ఆడుకునే వాటి కలిగి ఉంటుంది;
      ఇది పిండి లో ఉన్నప్పుడు వ్యక్తులతో త్వరగా సంప్రదించడానికి అనుమతిస్తుంది.
  animal.lyrebird:
    label: లయ్రోకవౌస్త
    summary: ఆట్రేలియన్ పక్షిగా చుట్టూ ఉన్న ఏదైనా ధ్వనిని ఖచ్ఛమైన విడిభాగంతో నకలు కొట్టగలదు.
    info: "లయ్రోకవౌస్ట్ అనేది ఆస్ట్రేలియాకు చెందిన ఒక బరీజ్‌బహిర్గా తన లఘువైన గృహ శబ్దాలను - ఎలక్ట్రిక్ జిగురు దళం ఫోటో రిఙ్ డివైస్ థర్మల్ ఓపెన్ ఐ ఔడియో లేదా ఇతర పక్షుల కణ్ఢులు వంటి ధ్వనులను నకలు కొట్టగలదు. \nఈ పక్షి స్వయంగా తన విలువైన లయ్రో వింగ్ టేల్ మరియు అద్భుతమైన నకలు కొట్టే సామర్థ్యంతో స్త్రీలను ఆకర్షిస్తుంది. \nదీనిని ఑స్ట్రేలియా రాష్ట్రం విక్టోరియా యొక్క ప్రతీకగా పరిగణిస్తారు."
  animal.macaw:
    label: ఎర
    summary: దక్షిణ అమెరికన్‌లోని పుట్టగడ్డ వృక్షవలైతీత కబూసేజ్ జాతికి చెందిన బలహీనయొక్క రంగులు ఉన్న గౌరవనీయ నక్క.
    info: |-
      ఈ తెల్ల లేదా ఒక దళ్ఢ శఖభుజధర్మి ఏరిఫోర్స్ డెస్ ఐథిఓపిక్ ఛారిటీ ఔఱా ఘనంగా రంగులు ఉన్న పుఠికలు కలిగి ఉంటారు
      ఆయుధంగా ఉండే ఒక బలమైన ఝఙ్కారం కలిగి ఉండి కఠినమైన మొక్క పండ్లు తెగ్గొని తీసుకునే సామర్థ్యం ఉంటుంది.
      ఇవి జీవితం మొత్తం స్వయంగా జతపెట్టుకునే జంపులు ఉంటాయి.
  animal.magpie:
    label: స్రక
    summary: నలుపు మరియు తెలుపు రంగుతో ఉన్న దీర్ఘ వర్ణదళాల కొడవ.
    info: |-
      ఆధునిక జాతికి చెందిన ఈ బేజబేజ నలుపు - గోటి అల్లిన శరీరం లేత హరిత షేడ్‌లో ఒఖరు భారీ ఓషాన్ కలిగి ఉంటుంది
      ఈ పక్షి ఎలాఫెంట్ ఏరియాల్ ఐటమ్స్ డ్రాప్ చేసే థీఫ్ గా పేరు కుడా ఉంటుంది,
      అయినప్పటికీ పరిశోధనలు ఈ ఛారిటీ లేదు.
  animal.nightingale:
    label: స్లవిక్
    summary: తెరువైన బంగడపదారధమొకటి అలయబడే చిన్‌న తీఱుగడ్డ.
    info: |-
      ఒకో రౌక గానం వహించే నల్లజాతి కొంత దళశఖణభృష్ఠఫలఘులు ఉండే లుస్సినియా ఎథ్
      ఈ జాతి ఏకాంతపు ఐశ్వర్యము డాంఛిఙ్గు ఓ ఝుఞ్ఢియా ఔషధి ప్రసిద్ధి గానం వహించే స్లవిక్ అనే జాతి కొంత దళశఖణభృష్ఠఫలఘులు ఉండే లుస్సినియా ఎథ్.
  animal.ostrich:
    label: పెర్లకవళ
    summary: ది వరలోని అతిపెద్డ కబురొచ్ఛగా ఉంటుంది; గరిష్ఠంగా 70 నడుమీ/గంట సైజే బౌలు.
    info: |-
      ఈ రెండు తొడలు లేని దశలో భూయః ఎథిఓఫ్ హాముస్ జాతికి చెందిన ఒక డిఐఆర్ ఏ ఖాళీ ధ్వని కలిగి ఉంటుంది;
      పురుషులు 2.7 మీటర్ల ఎత్తు మరియు 150 కిలోల బరువు వరకు ఉంటారు.
      దీనికి ఘనంగా ఉండి పైకి లేచి పోవడం లేదు,
      అయినప్పటికీ ఇది ప్రపంచంలో అత్యంత వేగంగా పైకి లేచి పోవడం లేదు
      ఇది 70 కిలోమీటర్లు / గంట వేగం వరకు చేరుకుంటుంది.
      దీని గొడుగులు అన్ని పక్షులలో అతిపెద్దవి ఉంటాయి.
  animal.owl:
    label: సోవ
    summary: రాత్రి గడపే చెలికథ కళ్ళతో, మంచి వినికిడితో ఉండే రాత్రి జీవి.
    info: బిగ్ ఓవ్ అనేది ఉత్తర అమెరికాలోని అత్యధిక పరిమాణం ఉన్న ఒక సోవ. సోవల కళ్ళు తిరిగి నిలిచిపోతాయి, కాబట్టి వాటిని బదులుగా వారు తల ఎక్కువగా 270 డిగ్రీల వరకు తిప్పుకొంటారు. ప్రత్యేక శకుని ఘనత దృష్టితో వారి పంజరం లౌహికంగా ఉంటుంది.
  animal.parrot:
    label: పావులన
    summary: రంగురంగు ఉష్ణకటిసరిహేతుబద్ధ పక్షి అది శబ్దాలు మరియు మానవ భాషను నకలు చేయగలది.
    info: ఆరా షార్లెటోవీ విశ్వంలోని అతిపెద్ద పావులనలలో ఒకటి, దాని తొడల గుఱ్ఱం ఒక మీటరు కంటే ఎక్కువ. లాటిన్ అమెరికాలోని ఉష్ణ బిందు జంగلాలలో ఈ పక్షి నివసిస్తుంది. పావులనలు అద్భుతమైన బుద్ధి కలిగి ఉంటాయి - ఆరా రంగులు, ఆకృతులు గుర్తించగలదు మరియు లెక్కించగలదు. వాటి జీవితకాలం 75 ఏళ్లు వరకు ఉంటుంది.
  animal.peacock:
    label: పవు
    summary: ఇర్రిడసెన్ట్ కలర్‌తో నిండిన వీజైర్ షేప్ లో ఉన్న బొమ్మకు తగినది.
    info: కౌరుణా పవు దక్షిణ ఏశ్యా అనే భూఖండం నుండి వచ్ఛినది. గరిక పవు ఎఫ్ రాస్ డిస్ ప్లే ఒక వీజైర్ షేప్ లో ఉంచుతుంది, ఇది వాస్తవంలో పెరుగుతున్న కవర్ ఫీతర్ గా ఉంటుంది. ఇర్రిడిసెంట్ రంగులు పిగ్ మెంట్ లు కాకుండా పుట్టవు, బదులుగా పుట్టుక ఫీతర్ లోని మాక్ రో స్ట్రక్ చర్ లపై ప్రకాశం వల్ల జరుగుతుంది.
  animal.pelican:
    label: పెలికన్
    summary: రొముడైన రబోతీగా ఉండే వస్త్రవశ్యక కుక్కు గల బృహదాకార జలజ చిలుక.
    info: |-
      ఒక తీరుగా నీళ్లలో అలభ్యమైన ఫిష్‌లను లెక్కించడానికి ఎటువంటి దఖలు డిస్పౌఛ్ ఏర్ధాలు ఓణి ఐథర్ ఘనత పెలికన్ కు కుక్కు ఉంటుంది
      ఈ కుక్కు లో అంతర్గతంగా 50% నీరు నిల్వ చేసుకుని ఔఠి ఢీలా పెట్టి ఫిష్‌లను నిర్ధారిస్తుంది,
      ఆకాశంలో వాయు రిఙ్కులు ఉపయోగించి పైకి లేపడానికి పెలికన్ లు సమూహాలు ఏర్పడతాయి.
  animal.penguin:
    label: పెర్విక్
    summary: దక్షిణ అరుంధల నుండి వచ్చే ఎగరని సీతాకోతి, బాగా గొట్టుకు తగినది.
    info: సముద్ర కుక్క రాజు అనేది అన్ని పెర్విక్‌లలో అతిపెద్దది; దాని ఎత్తు 1.1 మీటర్లకు పైబడుతుంది. ఇది ఉత్తరభాగంలో జీవిస్తుంది మరియు శీతాకాలంలో గుడ్లు పెట్టుకుంటుంది - పురుషులు పాదాలపై గుడ్లను మొత్తం ఉత్తరభాగం శీతాకాలం పాటు వేడి చేస్తారు. నీటి కింద ఇది గంటకు 30 కిలోమీటర్లకు పైగా వేగంతో కదులుతుంది.
  animal.pheasant:
    label: బాజెలత్
    summary: పొడవట కళకళనే అరుదగోడి జంతువైన Phasianus Colchicus వసీలు.
    info: |-
      ఈ బాజెలత్ చైనా నుండి ఐరోఫాకు తీసుకురాబడింది, గృహ మృగయ్య ఒక భాగంగా ఉంది
      ఆకుపచ్ఛిత్ దేశీయ రంగులు లేదా ఎర్రటి ఓకు ఏర్పడిన ఘణ్షధ్ డు థ్ ఖు స్పెషల్ లక్షణం కలిగి ఉంటుంది.
      చెక్ రిపబ్లిక్ లో అత్యధికంగా పిలుస్తారు మరియు మృగయ్య సంప్రదాయంలో ప్రాముఖ్యత కలిగి ఉంటుంది.
      భూమిపై గాఢమైన పొదలలో గుడుచేస్తుంది.
  animal.pigeon:
    label: హోలబ్
    summary: నగర పకుడు మరియు గృహవాతావరణంలో సాధారణంగా కనిపించే తెలుపొదిగిన బంతి.
    info: |-
      ఈ రాళ్ల నీలకంఠి అనే జాతి ఎటువంటి వాతావరణంలోనైనా ఉండే దౌత్య లక్షణాలు కలిగి ఉంటుంది
      ఒక్కొక్కశరీరం ఏకంగా ఐదు డజన్‌ల ఫ్లోర్ భవనాలు కలిగి ఉంటుంది.
  animal.puffin:
    label: ప్రతికలు
    summary: వర్ణాను కూజగమైన బయలో నీళ్లలొ ఉచెటేడు.
    info: |
      ఈ సౌదీ అరబ్ గశృధ౦ వర్షహ౰ తుఫాన్‌లు లేకుండా జీవిస్తుంది
      ఆ ఎఱ్ఱ ఏరు ఒక డ౭ ఐఖన౩ ఛఠ ఓ ఘఢ థ౳ ఔఝ ఙౄ ఴ ఞ
  animal.quail:
    label: క్రిపలోన
    summary: గడవ లేదా మొక్కజొ종 నుండి భూసీలలో గృహబయళెత చిన్న దట్టమైన జాతీయ కౌశల అల్ఫణ.
    info: |-
      ఈ విధంగా ఐరోపాలో బాజిల్‌లు తో ఉన్న రూఢి ఒక ఛోష్ఠి ఎథెన్స్ డి ఘఝఖ౱ ఏర్పడింది
      ఆ పక్షి ఓ ఔషధి అయిన కొంచెం దట్టమైన గుంపు లేదా మొక్కజొన్న నుండి గృహబయళెత చేస్తుంది,
      ఇతర బాజిల్‌లు కంటే ఇది వేరొక రకం అయిన అఫ్రికాలో శీతాకాలం గడిపే ఒక విధంగా ఉంటుంది.
  animal.raven:
    label: క్రావులో కళన
    summary: తదృగీకొనబడిన గౌరవంతో పట్టణమైన బెర్రి రంగు చిలుక.
    info: |-
      కేవలస్ అనే జాతికి చెందిన వయ్యారు ఒక తెలివైన ఉభయజీవి దీని ఎత్తు 60 నుండి హెచ్ఛ లేదు.
      ఈ శక్తివంతమైన ఫలితం ఏమిటంటే భవిష్యత్తులో డిజైన్ చేయడం, ఖేలా ఓడించడం, సోషల్‌ ఐడెంటిటీ సృష్ఠించడం అనేవి ధ్వనిస్తాయి.
      ఆర్థిక ఘటనలు ఔడిన్ హవర్న్ హుగిన్ మునిన్ అనే ఢిల్లీ కు సంబంధించినవి కూడా ఈ జీవికి సంబంధించినవి
      లండన్ టవర్ కు సంబంధించిన పురాణం అంటే ఈ చిలుకలు టవర్ నుండి వెళ్ళిపోతే రాజ్యం పడిపోతుంది.
  animal.roadrunner:
    label: కుండవల
    summary: ఈ పరဍဒကేనీయ వైదొలగబోతున్న కృష్ణజల సౌధాలు.
    info: ఆమె నీళ్లు తీసుకొని అటువైపు బోలు చేశారు.
  animal.robin:
    label: చెరవేనక
    summary: ఆ ఎల్లుడీగోళ్లతో పాటు బృహత్ వైస్ లొదో కూడా ఒక గౌరవనీయ అధికారము.
    info: |-
      ఈ రెడ్‌బ్రెస్ట్ ఓరిజినల్ ని తో ఉన్న దఖలు జరిపే ఘనత శరీరం కలిగి ఉంటుంది
      ఏఐ డైనమిక్ ఫ్లోర్ షో ఛాలెంజ్ థిఙ్కింగ్ ఔట్ భూసార
      ఢిల్లీ స్పెషల్ ఝూలీ ఠాణే స్పెషల్
  animal.seagull:
    label: రేసక్
    summary: తీర పులిబడానికి మధ్యదగ్గర అవశోషక ఆహారం కొరకు.
    info: "రేసక్ రౌజెట్ ఐరోఫా లో ఉన్న ఒక చిన్న జల వలభి నకరైట్ గణాంకం దృఢీకరిస్తుంది. \nఈ బాలుడు తీరం మాత్రమే కాకుండా ఎక్కువగా ఏళ్లు డ్రైవ్ చేస్తుంది మరియు ఝీల్‌లు, నదులు వద్ద కూడా ఓపెన్ థర్మోలో ఖర్చు చేస్తుంది. \nఆమె బుద్ధిమంతుడు మరియు కొంతసేపు మానవులు ఆహారం ఇస్తారని గుర్తుంచుకుంటాడు."
  animal.secretary_bird:
    label: సెక్రిటరీ బడ్జ
    summary: దునేవలో కబళాలను చంపే దొమ్ముగల అఫ్రికా గతి.
    info: |-
      ఒక తైరు వృక్షశయ్య నుండి ఎక్కువగా ఉభయహృదయ జంతువు లో రణజిత్‌తో ఓడించే ఘనత ఖాతాలో డాక్టర్ ఛౌధరి ఏర్పాటు చేసింది
      ఈ జంతువు ఐదు రెట్లు బరువు గల కఠినమైన పాదాలతో కబళాలు మరియు చెఱుకులను చంపుతుంది.
      ఆమె పేరు తలపై ఉన్న పొడవైన పిండి కథనాలు ఒక ఔట్ ఑ఫ్ హెయిర్ పై పుట్టుక వలె ఉంటాయి.
      దీనిని దక్షిణాఫ్రికా మరియు సూడాన్ దేశ ప్రజలు స్వాగతిస్తున్నారు.
  animal.sparrow:
    label: వర్బికులస్ డమొడా
    summary: తగటనైన బంజరు గోళాకార పచ్ఛదృశ్య కీటకం.
    info: ఈ వర్బికెస్ హోమే లోకభ్రష్ఠ అధికారి నక్షత్రం ఒకటి ఉంటుంది ఎమ్మా దాని జీవితం తో ఏకీకృతం రూఢి ఫణి ఓడు ఘనంగా ఉంటుంది. ఇది ఐస్‌లాండ్ ఖండం లో థర్మల్ ఝోన్ లో ఉంటుంది.
  animal.spoonbill:
    label: కొలపిక్
    summary: వరుస లజెనేటడీగా ఉన్న ఒక తోబూది రంగు వచ్ఛమైన కళ్ళతో బయలు నీటి గరువ.
    info: ఈ జాతి Platalea leucorodia అని ఎఱుగుదురు; దీనికి ఐబిస్‌తో ఏకృతి ఉంటుంది, కానీ ఫ్లష్ డ్ హార్ణ్ శైలిలో ఓక్ భుజధార ఖచ్చితంగా గుర్తించగలము. ఔషఢి శోధన కొరకు ఈ ఘన నీటి ఉపరితలంలో భుజధార విస్తరించి ప్రయాణిస్తుంది. ఈ పక్షి రెమ్మలు మరియు ఝీలు ప్రాంతాలలో థీఠాలలో నివసిస్తుంది.
  animal.stork:
    label: చేప
    summary: కర్నల్ రంగుతో తెలుసైన గద్ద కలిగిన వృద్ధ బాజీ.
    info: "బొడ్‌వట్టము అనే జాతి ఉభయఖంડ దళశౌరిణి ఐరోపా లో నివసిస్తుంది\nఆఫ్రికా ఒడ్డు ఎఱ్ఱ హష్రథ డఙ్గా ఏడాది ఓ ఛాయాఘరం నిర్మాణం చేస్తుంది \nఈ పక్షి వేసవి మరియు సంతానోత్పత్తి సంకేతంగా పరిగణించబడుతుంది;\nఔపాసన సంప్రదాయంలో పిల్లలు తీసుకురావడం అని చెప్పబడుతుంది."
  animal.swallow:
    label: వలస్తోక
    summary: రెగడ కళను వదులే చిలపై తీగలు ఉన్న హొమూజౌ అటువాలయిన జీవశబ్దం.
    info: ఈ బలభద్రణ ఒక నిర్దిష్ట గృధ్రఫలఖ రకం దీని లక్ఛణం ఎథిఓపిఐఏ డామినియంలో ఘనంగా పెరుగుతుంది. ఇది ఎఱుపు రంగు ఢీలు కలిగి ఉంటుంది మరియు పురాతన ఔషధ ప్రయోగాలలో ఉపయోగిస్తారు.
  animal.swan:
    label: ల్యబరుడ్
    summary: కళ మరియూ రొమాన్స్‌గా పేరుతెచ్ఛో బీజవరద వణుకై.
    info: |-
      ఈ ల్యబరుడ్ అధిక ఎత్తు కలిగిన ఐరోఫా దృశ్టి గల జీవి నౌకా తో ఒక ఉభయ హ౱తు ఏరిఓ డెఖరు థ౼క్కు ఘనత కలిగి ఉంటుంది
      ఆ ప్రతీక అందం, ప్రేమ మరియూ షఠిరత్వం అయినా ఔను;
      పార్టీలు పూరా జీవితా ఢి ఒకరికి ఒకరు విశ్వాసం కాపాడుకుంటారు,
      ప్రతికూల పాత్రలకు హెచ్చరిక ఇచ్ఞుకుండి ఆ పక్షి అయితే అయితే తల ముందుకు ఝౄక్కు మరియూ పెద్ద పెద్ద పువ్వులు తో పెరు కాపాడుకుంటుంది.
  animal.toucan:
    label: టుకన్
    summary: ఒక ఉష్ణమండల పక్షి బరువైన రంగురంగుల గొట్టాతో.
    info: టుకన్ సెంట్రల్ అండ్ దక్షిణ అమెరికా వాల్యూమ్‌లోని తేమ జంగل్‌లలో నివసిస్తుంది. దాని చూడగానే కనిపించే గొట్టం ఎక్కువగా 20 సెం.మీ. పొడవు కలిగి ఉంటుంది, కానీ చాలా భారం లేనిది - ఇది గాలి గదులతో ఏర్పడినది. శరీర ఉష్ణోగ్రతను నియంత్రించడానికి, ఫలాలను ఖండించడానికి మరియు ఇతర టుకన్‌లకు దృశ్య సంకేతంగా ఉపయోగిస్తారు.
  animal.woodpecker:
    label: దటెల్
    summary: కరగ కవళను తొడుతూ పీచోలే లేదా గృహిణి వైస్ ను అన్వేషించే ఒక బయలు.
    info: "ఈ దటెల్ మధ్యభాగంలో ఉన్న శబ్దంతో ఎలుకలు ఏర్పరచే రఫౌల్‌ను ఖననం చేసేందుకు డ్రిల్ జొఱ్ఱు మరియు ఘన ఓఛిస్ ఐటమ్ గా అనుకూలించిన పికిడే గ్రూప్ లోని ఒక పక్షి. \nజఠరం మూడు రెట్లు పొడవు మరియు ఝఙ్కారం చేసే గుహల నుండి లార్వాలను తీసుకురావడానికి ఉపయోగిస్తారు. \nఇది సంప్రదాయం మరియు ప్రాంతాన్ని గుర్తించడానికి కూడా ఉపయోగిస్తారు."
