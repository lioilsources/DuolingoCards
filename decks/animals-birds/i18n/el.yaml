lang: el
pivot: false
title: Πτηνά
cards:
  animal.albatross:
    label: Αλβατρός
    summary: Θαλάσσιο πουλί με τη μεγαλύτερη δυναμική πτύση.
    info: Το αλβατρός έχει τη μέγιστη δυναμική πτύση όλων των πουλιών και φθάνει σε επίπεδο για να λειτουργήσει πάνω από 3,5 μέτρα. Δαπανά το μεγαλύτερο μέρος της ζωής του στο ανοιχτό ωκεανό και μπορεί να πετάξει χιλιάδες χιλιόμετρα χωρίς να βγει από τον αέρα. Πίνει θαλασσινό νερό και αφήνει την αλατότητα μέσω των προϊόντων.
  animal.budgerigar:
    label: Παπαγάλος
    summary: Ένας φθηνός δώρο βοσκός.
    info: Η Andulca είναι από το μεσαυλικό Αμβέργου και υπάρχει σε πολύ γεωτρήδης λόφοι.
  animal.canary:
    label: Κανάρι
    summary: Πολύ μικρό κίτρινο πουλί που αγαπάται από τους ανθρώπους.
    info: |-
      Το κανάρι έχει τη προέλευσή του από τα νησιωτικά σύμπλεγμα Γαλίας όπου εξαιρετικά φυτώθηκε για διαβίωση μέσα στο Δ’ αιώνα
      Η λευκή χρωματική βαφή του είναι αποτέλεσμα της ανθρωπογενούς παρέμβασης· το «διάζω» του είναι πράσινο - καφέ,
      Οι αρσενικοί κανάριοι είναι γνωστοί για την πολύπλοκη μελωδία τους · οι αγώνες κανάριας είναι παγκόσμια φαινόμενα.
  animal.cassowary:
    label: Κασουάρ
    summary: Πολύ εξιχνιαζόμενο λεβεντώδες πτηνό της νέας Γκινέα.
    info: Το κασουάρι είναι ένα μεγάλο πτηνό χωρίς δυνατότητα τήρησης από τη νέα Γκινέα και βόρεια Αυστραλία. Δύο σχεδόν φθαρμένα γραφήματα.
  animal.cockatoo:
    label: Κακατού
    summary: Λευκός παπαγάλος με εξαιρετικά χρωματιστό κρούνο.
    info: Το Kakadu είναι ένα από τα πιο γνωστά μέλη της κατηγορίας του Cacatuus σε όλη τη νήσο Αυστραλία - Δύο φοβερώς λαμπρά βελονάκια διαθέτει σχεδόν πάντα.
  animal.condor:
    label: Κουντζίρ
    summary: To μεγαλύτερο πτηνό που πετάει στην Αмерική με αποκαλυπτόμενο κεφάλι.
    info: |-
      Το Ανδεικό κουντζίρ είναι το μεγαλύτερο πτηνό συμπεριφέρεσθαι από βάρος χωρίς να γνιώξει διάχυτα φτερά
      Είναι λύκος· τρέφεται με νεκρή σάρκα µεγάλων θηλαστικών και παίζει σηµαντικό ρόλο στο οικοσύστηµα,
      Πετάει σε τεράστια thermal streams over the Andes without flapping its wings.
  animal.crane:
    label: '"griffon"'
    summary: '"Μεγάλος νηστικός γνωστός για τις ριτουαλιστικές παραστάσεις"'
    info: |-
      {"hint":"μεγάλο χαριτωπό μη κυνήγου που είναι γνωστό από τις δύναμές σκαχτών θεατρικές παραστάσεις","info":"Το Γρύφος λεβάνδινος είναι ένας μεγάλος νηστικός που φθάνει ως χιλιάδες χιλιόμετρα κάθε χρόνο\nΓνωστός για τις ριτουαλιστικές του παραστάσεις, όπου οι ζευγάρια βγαζουν και ανοίγουν τα πτερύγια τους·
      Περνά σε μεγάλες ομάδες πάνω απ' την Δυτική Ευρώπη το φθινόπωρο
      Ο Γρύφος ήταν το ψευδώνυμο του σκευάσματος.
  animal.crow:
    label: \u03a6\u03caλ\u03b1
    summary: \u039f\u03c1\u03bd\u03b7\u03c4\u03af\u03be\u03c4\u03b9\u03ba\u03bf και φ\u03bdo\u03c1\u03b7\u03c4\u03af\u03ba\u03bf από τ\u03b1 δίδυμ\u03b1 ράφιν\u03b1 ε\u03c1χ\u03bf\u03c5\u03c3\u03b7\u03c2.
    info: '{"hint":"\u045d\u03b7 \u03c6\u03bb\u03bf\u03af\u03bd\u03cc κ\u03ac\u03c9\u03bc\u03b1 με\u03b8\u03cdνος πτ\u03b7ρα για τη λύση συγκεκριμ\u03ad\nu03BDων θ\u03aeμ\u03ce\u03bd (\'
  animal.cuckoo:
    label: Κούκου
    summary: Παρασιτικό που βάζει τα αβγά της σε νιδοθήκες.
    info: Η κούκουα είναι γνωστή από τη συμπεριφορά παρασιτισμού ως φιλοξενητές άλλων πτηνών· βάζει τα δικά της αβγά μέσα σ' ξένους νιδοθηκες, όπου λαχανιάζονται και τροφοδοτούνται από τους «γονεϊκούς» φιλοξενητές.Ο νεοσσός κούκουα εξαΐρεσης βγάζει έξω τα υπόλοιπα αβγά και νεοσσούς απ’ το νιδό.Το διψήφιο 'κου-κου', που εκπέμπει το θηλυκό, είναι σύμβολο της Άνoιξης.
  animal.dove:
    label: ptinida
    summary: Σύμβολο εἰρήνης· λευκὸς ptinidās μὲ εὔπτυστον πτερὺ.
    info: "Η λευκή πτηνίδα είναι διεθνές σύμβολο του επαγράφω από την Αρχαϊστική φάση· με βιβλικό κείμενο υποψηφιώ να γνωστοποιήσῃ τῷ Δαυΐδ ὁ Γάββᾳ ἀξῖος ᾖ. \nΣτὸν Χριστιανισμό ῥῆσις ἐπὶ τὴν Πνεῦμα τῶν Άγιῶν. \nΤὰ σπίτια πτηνίδα εἶναι πραγματικὰ πτηνίδα που ἔχουν εὐζωγοποιηθῇ · ἡ λευκὴ χρωματισμὸς ἦν ἄπορροια τῆς εὑζῳγίας."
  animal.duck:
    label: Χήνα
    summary: Υδρόβιο πουζό με ευρύ στόμιο· o αρσενικός(φιλοξήνας) έχει πράσινο κεφάλι.
    info: |-
      Η παγκόσμια ευρύχείλη κοτένς η χήνα των απάθειών μου συνδέεται γενετικά με τις περισσότερες φυλές δόμης
      Ο αρσενικός (φιλοξήνας) έχει λαμπερό νυχτερινό κεφάλι, ενώ ο θηλυκός είναι βρώμικος καφέ,
      Είναι πολύ κοινός τύπος υδρόβιου που τρέφεται στην επιφάνεια του νερού και όχι με κολύψιμο.
  animal.eagle:
    label: GERANOS
    summary: Megalos arpaktiko pouli me kamilo sphyri kai akribi oraasi.
    info: '{"hint":"Πολύ μεγάλη αρπακτική που διαθέτει καμπυλωμένο σφυρί όσο εξαιχμαλώς ορόβη τη φαΐδα","info":"Το λευκόκερας γερανός είναι το εθνικό σύμβολο των Ηνωμένων Πολιτειών να βρίσκεται ανάμεσα στα μεγαλύτερα αρπακτικά της Βόρειας Αμερικής.","label":"ΓΕΡΑΝΟΣ","summary":"Μεγάλο αρπακτικό πουλί με καμπύλο σφυρί και ακριβή όραση."}'
  animal.emu:
    label: EMOUS
    summary: Δεύτερος μεγαλύτερος πουλιόσκυλος, απίθηνος Ιταλικός.
    info: '{"hint":"δεύτερος μεγαλύτερος πουλιόσκυλος· απίθηνο Αυστραλή τάβμα και χωρίς φτέρωση (Dromaius novaehollandiae)","info":"Το εμού ντρώμαϊους νοβαχολλαντιά συνδέεται με δεύτερο λευκό για βραζιλιάνικο πουλί και εξαφανίζεται από την Ελλάδα\nΔεν μπορεί να πετάξει , αλλά είναι καλός πλούμενος και γρήγορος \nΟ αρσενικός θα κάψει τα αυγά και η οικογένεια έχει παιδιά","label":"ΕΜΟΥΣ","summary":"Περιοχή Δεύτερος μεγαλύτερος πουλιόσκυλος, απίθηνος ιταλικός."}'
  animal.falcon:
    label: Περισταλάκων
    summary: Γρηγόριτέρο θηλασματικό στη Γη σε υπερπτώση (>320km/h)
    info: |-
      Το περισταλάκων είναι το γρηγόριτέρο ζώο στη Γη και μπορεί να φθάσει ρυμουλχής ακμή δύναμης πάνω απ' τα 320 χλμ./ώρα
      Έχει λεξιβάζα βλέφαρα που καταπολεμούν την αναδίψανση του ηλιοφωτός,
      Ο άνθρωπος το χρησιμοποιεί για αναπαραγωγή πάνω από 2.000 ώρες·
      Η αναπαραγωγή του είναι εγγραφείσα στη λίστα του UNESCO.
  animal.flamingo:
    label: Πλαϊμέν
    summary: Ροζ πουλί που περπατά σε ελαφριά νερά.
    info: "Το ρόδανο που έχει τη δικαιώματά συγκρίσιμως από καροτένια με βλύβα νήματα εξαιρετικά φθηνά γι' αυτό λεγόμενα «φθηνά».\nΟι νεοσσοί γεννιούνται γκριζωποί και \nχρωματίζονται με την πάροδο του χρόνου."
  animal.goose:
    label: Ανατολίς
    summary: Μεγάλο νερό που διαμορφώ νει φυσική λεπτομερή «Δ».
    info: Η Ανατολίς μεγάλη είναι το πρωτόκου σύ για αυτέ ς καθώς διαμορφώ νουν φυσική λεπτομερή «δ»», στην οποία αλλάζουν βασιλεία.
  animal.hawk:
    label: Αεράκι
    summary: Γρήγορος πτηνόθρυψος που κυνηγά πτηνά και θηλαστικά.
    info: Το αεράκι είναι ένας τύπος πτηνόθρυψου δέλφινων με σχήμα ώστε να κυνηγά γρήγορα λόγω των βραχύτερων φτερών του και του μεγάλου ράδου του.
  animal.heron:
    label: Αρδέα
    summary: Πολύ ψηλή φθινοπωλία που στέκεται ακίνητη για να πιάσει ρύβες.
    info: Η Αρδέα είναι το μεγαλύτερο πουλί βάψιμος στη νότια Γερμανία και χωρίζεται από τα γυρσώφια λόγω του διχρόνικου λαιμού της.
  animal.hornbill:
    label: ζωγραφικό
    summary: Πτηνό με γενεϊδικό δύσμο.
    info: Το ζωγραφικό είναι πτηνό από τη νεμέσυς Bucerotidae με χαραχτικά δύσμο και σκληρή φτώχεια (casque). Διαβιώνουν στα τροπικά δάση της Αφρικής και της Ασίας.
  animal.hummingbird:
    label: Κολιβρή
    summary: Παγκόσμιος μικρότερος πτηνός που μπορεί να περιστραφεί στον αέρα και να πετάξει προς τ’ αντίθετο.
    info: Το ρόδινης θωρακίζεται από τους πέλμα είναι μοναχά φυσιγγών σύνθημα κολιβρή ντρέφονται δυνατό για βόρεψη στην ανατολική Βόρεια Αμερική. Χτυπά λαβίδια τους μέχρι 53 φορές το δευτερόλεπτο, παράγοντας τον χαρακτηριστικό «μπι» ήχο. Δίνει νεκτάρ και μικρά έντομα· o καρδιά του χτυπά μέχρι 1.200 φορές το λεπτό.
  animal.ibis:
    label: ibis
    summary: Πουλι με καμπύλο σφυρά, ιερό στην αρχαία Αίγυπτο.
    info: Το ibis είναι ένα πουλι με λόγχη από τη φυλή Threskiornithidae και χαρακτηριστικό δύο σφυρά για να βρέξεις. To Ibis holy was revered in Ancient Egypt as an embodiment of God Thoth.
  animal.kingfisher:
    label: Λεδέντσαχ
    summary: Φαβοζωΐδιο που κυνηγάψει χρυσάφι.
    info: |-
      Το ρυακινό λεδέντσαχ είναι μεριάς από του πληθωμένού Ευρώπης και διαφαίνεται για νήμα στο βράγχιστρο του και φωτεϊνό πορτοκαλί στήθος
      Περνάει πάνω απ' την επιφάνεια του νερού και παρακολουθεί ψάρια· μετά πέφτει προς τα κάτω.
  animal.kookaburra:
    label: Kookaburra
    summary: Αυστραλιακό που της με θόρυβο χαζομπούρισμα.
    info: |-
      Το kookaburras είναι ένα μεγάλο αυστραλιακό που της γνωστό για τη φωνή του όπως και να σχέδιο λαϊκών δύο
      Είναι σύμβολο του Australian bush και o βομβηθός του παραδοσιακά αναφέρει το ανατολικό και Δύσιμο του ήλιου,
      Προΐσταμε σε εξωτερικούς, σεψίδες, ποντίκια και ινσεκτς.
  animal.lorikeet:
    label: lory
    summary: Πεταλούδωμενο φθογγοφόβο.
    info: Το lory είναι ένα μικρό πεταλούδωμένο από τη νότια Γ΄Ασία και βάζει συχνή χρώς για λουξ.
  animal.lyrebird:
    label: Lyrócho
    summary: Αυστραλιάκη που μιμείται με ακρίβεια οποιοδήποτε ηχητικό.
    info: Το Lyrochvost είναι αυστραλιάκη που χειρίζεται με ιδιόμορφο τρόπο και σχήμα φωνές γύρω του - δηλαδή βγάζει νότες λεξιβών, φωτογραφικών μηχανών, αυτοκινητικών συναγερμών ή φθέγγους άλλων πτηνών.
  animal.macaw:
    label: ARA
    summary: Έχει γκρίζος φτερύγια.
    info: Το ara είναι ένα μεγάλο πουλι των υποτρόπηδων δασών στη νέα Γη και φέρει αυτή τη λαμπρή βαφή.
  animal.magpie:
    label: Στράκα
    summary: Ασπρόμαυρο πουλί με μακρύ πράσινο ξερό.
    info: Η στράκα είναι πουλιό της οικογένειας Krkavec με χαραχμένο και λευκό ασπρόμαύρο βαφτό γεωμετρικώς διαβήτη να φαίνεται και ένα μακρύ πράσινο λαμπερό άδειο που υποθέτεται ως ζωγραφικό.
  animal.nightingale:
    label: '"Σχήμα"'
    summary: '"Λεπτύ φθηγό που συντονίζει ένα από τα πιο όμορφα ντουέτα"'
    info: '{"hint":"μικρό καφέ πουλί γνωστό από το δυνατό μελῳδιώδες ύμνημά του","info":"Το Σχήμα είναι λεπτύ φθηγό που συντονίζει ένα από τα πιο πολύπλοκα και όμορφα ντουέτα που βρίσκονται στον αέρα\nΠαίζει κυρίως τη νύχτα και την πρωϊνή ώρα, απ'' όπου προέρχεται το ψευδώνυμό του\nΕίναι απομακρυσμένος συγγενής του Γερανοβίου\nΟι ποιητές απ’ όλο τον κόσμο - από το Δάντη μέχρι τον Κίτσι – εξαψουλούν τον ρυθμό του θρυλικού τραγουδιού ως σύμβολο της ρομαντικής ιδέας και της μελαγχολίας."}'
  animal.ostrich:
    label: Ομήρα
    summary: Πάπλων ταχύτερος από τα 70km/t
    info: Το ομήρας είναι το μεγαλύτερο κι όχι πάπλων αυτό στη Γη· η βδέσφικο φθάνου να γίνει δύο ,7 μέτρα και βάρος πάνω απ' τα 150 κιλά. Δεν μπορεί να πετάξει, αλλά είναι το ταχύτερο δίψηφος πάπλων στον κόσμο, φθάνοντας ταχύτητα πάνω απ’ τα 70 χιλιόμετρα την ώρα. Τα λουλούδια του είναι τα μεγαλύτερα από όλα τα πάπλων.
  animal.owl:
    label: Σούς
    summary: Νυχθημερός θηλαστικός πτηνός με κυκλικά μάτια.
    info: Η Σόβα του Γκρέι είναι μεγάλη σούς πτήμα από βόρειες χώρες και νυχθημερων γρασσαριδων . Δε διαθέτει φακελωτο λεπί , γι' αυτό πρέπει να περιστρέφει το κεφάλι του προς τα δεξιά ή αριστερά για να «ζουμ» και να επεξεργαστεί την εικόνα.
  animal.parrot:
    label: ΝΕΦΩΣΗ ΛΑΒΉΔΡΑΧΜΗ
    summary: Γεμάτο ροδόχρωμο πουλί που μπορεί να αντιγράψει ήχους και την ανθρώπινη φωνή.
    info: "Το Ara σαρλάτιν είναι με τη σειρά που ακούγεται ένας από τους κυριότερους γεμάτων χρώμα νέφωσε λαβή δραχμή βόθυξ από τα φυλλώδη τζάγκαν της Δυτικής Αμερικής·\nΟι νέφωσε λαβή δραχμή βόθυξ είναι ιδιαίτερα άψογοι - το Ara μπορεί να αναγνωρίσει \nχρώματα , σχήματα και να μετρήσει . Ζουν ίσως 75 χρόνια."
  animal.peacock:
    label: φίφι
    summary: Αρσενικό φίφι με εντυπωσιακό υπολογιστικό όργανο
    info: '{"hint":"αρσενικό πάους με ιώδη ρούχο στήλη","info":"Το κομψό φίφιθλο επέργω της νότιας αυτοκρατορίας διαβαινει από τη βόρεια γη.Ο αρσενικός(φίφι) ξετρέπει το λεπτό του -σ'' πραγματικότητα είναι επιμηκυμένοι κρυπτικοί φτερά-σε χαϊτί σε ερωτική προσπάθεια να προσελκύσει τις θηλυκές.Η ίριδα δεν προέρχεταιαπό pigmenta,αλλά από διάθλαση φωτός σε microstructures των φτερών.'
  animal.pelican:
    label: Πελικάνας
    summary: Μεγάλο υδρόβιο που τη ντύνει κέφσιμο δίχω απ’ το φαϊ.
    info: "Το πελικάνας είναι ένα μεγάλο υδρόβιο που τη ντύνει συμπαθή κέφσιμο δίχω απ' το φαΐ για να λαμβάνει ρύζα. \nΣτο βαγονάκι του μπορεί να χώνει ίσχυς 13 λίτρα νερό· το νερό το ψάξει και τις ρύζες τις τρώει."
  animal.penguin:
    label: Πέγνυς
    summary: Νεναὐτὲς πτηνὼν ἔκ τῆς νότιας ἡμισφαιρίδος, ἕξις πλού.
    info: Το βασιλικό πέγνυς είναι το μεγαλύτερο απ' όλα τα πέγνουδα· φθάνει σε έξη κιβωτώματα για να διαφύγῃ. Διαβιοῦ ἐν τῇ Ανταρκτὶκὴ καὶ τὰ λουλοὺδια ῥᾳζῶνται ᾗχρις τῆς μεγίστης ψύχης—ὁ ἀρσενικὸς θερμαῖ τὰ λουλούδια ἄνω τῶν ποδῶν ὔψῳ πᾶσαν τὴν ζῷμήν.
  animal.pheasant:
    label: Φασιάνο
    summary: Μεγάλο ψηλό πουλί ; ο αρσενικός έχει άγραφο χρωματισμό και μεγάλο κρουστό
    info: "Το φασιάνο ήταν εισαγόμενη σπουδαιότητα από της νήσων προς την Ευρώπη ωστόσο μέχρι και σήμερα βλέπεται δίκαια για λύθει την ευρωπαϊκή ζωολογία\nΟ αρσενικός (φασιάνος), έχει εξαιρετική χρωματική απεικόνιση - πράσινο – ροζ το σώμα , και ιδιαίτερο κόκκινο σακούλα γύρω από το μάτι \nΕίναι το πιο διαδεδομένο πτηνό στη Γερμανία και αποτελεί τη βάση της θηρευτικής παράδοσης .\nΚάνει φωλιά στο ξηρό σε πυκνές περιοχές"
  animal.pigeon:
    label: Πετρόπουλο
    summary: Συνηθισμένο γκρι πουλί των πόλεων και της ύπαιθρος.
    info: Το πετρόπουλο είναι το γονικής φυσικά αφέγγα όλων οι καθημερινών μπαχαλιστές στα δύο να βρίξει λεβεντούδες.Ήταν το πρώτο που ερημιζόταν πουλί· εξυπηρετούσε τους ανθρώπους ως ταχυδρομικός μπαχαλιστής χιλιάδες χρόνια.
  animal.puffin:
    label: Παπουτσάκη
    summary: Μικρό θαλάσσιο πουλί με χρωματιστό παπαγαϊώδες λαβύρι.
    info: To Βόρειο παπουτσάκη είναι μικρό ψύλλων τυγχανών αξιόμετρος κήλη σφραγιδωτές λαβύριθμος δρομέας φαΐνει να βρίζει για να πιάσει ρύψες· μπορεί να κρατήσει περισσότερες από δέκα ρύψες ταυτόχρονα στο λαβύριθμο.
  animal.quail:
    label: Κρεπέλκα
    summary: Μικρό φύσιχο βουβό λαϊκό πουφ
    info: Η Κρεπέλκα είναι το μικρότερο αυγάδων στην Ευρώπη και περνά χρήμα για να δουλέψεις.
  animal.raven:
    label: '"krkavec"'
    summary: Πολύ μεγάλο νηφαλιό μαύρο πουλί με χαρακτηριστικό "Krakking"
    info: '{"hint":"μεγάλο μαύρο πουλί στην οικογένεια των κόραξ απ'' όπου γνώρισε νήφυς διαχείριση","info":"Ο Krkavec είναι το μεγαλύτερο πουλί της φυλής Corvidae με μήκος πάνω από 60cm\nΕίναι εξαιρετικά νηφαλιός και έχει την ιδιότητα να βλέπει λεπτομερώς το μέλλον , να παίζει και να δημιουργεί κοινωνικές σχέσεις \nΣτις μύθους των Βορείων(Η Περιβόλα Odins Huggin & Munnin ) και των Γαλλών ήταν μυστικιστικός .\nThe Tower Of Londres είναι προστατευμένο από την παραδοσιακή θεωρία πως το βασίλειο ξεπερνάει αν τα πουλιά αποχωρήσουν από την Tour"}'
  animal.roadrunner:
    label: Γεωγραφική κουκούνη
    summary: Σύµβολο των αµερικανικών σχεδιασµένων σειρών.
    info: Η Γεωγραφική κουκούνη είναι πτέρα από τη νidiάδα Coccyzidae η οπoία υπολογίζει συχνότερα βήμα με βήμα για να φθάσει στον στόχο της λόγω δρόμου αντί για πterώση. Διατρέχει ταξίδια με ταχύτητα πάνω από 65km/t και τρέφεται με χταπόδια, ψηφίδες, εντομα και µικρά θηλαστικά.
  animal.robin:
    label: Κόκκινη
    summary: Μικρό πουλί με κόκκινο στήθος, σύμβολο Γιορτών στη Μεγάλη Βρετανία.
    info: Η Κόκκινη πεταλούδα είναι μικρή τσουχτέρα αυγάς και φέρει χαρακτηριστικό λωφό σώμα γεμάτο ντυμένο σε βερίκοπο - κόκκινο ροζ. Δεν δίνει την προτεραιότητα στην αξιοθράψιμη ζωή – ακολουθεί άγρια οργανισμούς που ανασηκώνουν το έδαφος και συλλέγει εκτεθειμένα σκώληxα.
  animal.seagull:
    label: racos
    summary: Παραθαλάζιο πουλί που χρησιμοποιεί την πολυψυχία του για να παραβιάζει τρόφιμα.
    info: Το Ρακός είναι από τα πιο δημωγενή ψάριστρουτα στην Ευρώπη και γνωστό με το λαϊκό όνομα «Ρακέλ». Δύναται να βρίσκεται φθηνή τροφή σχεδόν παντού - στη θάλασσα, σε λίμνες, ποτάμια – και εξαιρετικά συχνά σε παραθαλάσσιες περιοχές.
  animal.secretary_bird:
    label: '"ptáček sekretář"'
    summary: '"Δλούγονογος Αφρικανός αέτης που σκοτώνει φήμπεϊ με κυβίστους."'
    info: |-
      {"hint":"μεγάλος Αφρικανός αέτης με κυβίστους πόδες των βρύχων χθαιρών για να σκοτώσει φήμπεϊ εξαιτίας Sagittarius serpentarious","info":"Ο λεγόμενος ptáček sekretář διατρέχει προτιμότερα την ανοιχτή σαβάνα·
      Σκοτώνει φήμπεϊ και ροδιά με ισχυρούς κυβίστους πόδες,
      Που έχουν τριπλάσιο βάρος απ' ό,τι το σώμα του
      Λέγεται "sekretár" επειδή οι μακρές φτερούγες του ",
  animal.sparrow:
    label: Παπί
    summary: Μικρό καφέ ζωντανό θηλαστικό που ζει κοντά στα ανθρώπινα σπίτια.
    info: |-
      Η παπιά είναι ένα από τα κορυφαία στελέχη μεγάλων δύσκολων χώρων γής και βομβουδιζει τον άνθρωπο να φτάσει στον στόχο του·
      Δραστηριοποιείται λίγο πιο κοντά στα ανθρώπινα σπίτια, ρίχνοντας τα κουνιά της στα παράθυρα των παραθύρων και των στέγων,
      Στις τελευταίες δεκαετίες η πληθυσμιακή της αξία στις πόλεις ήταν πολύ μεγάλη.
  animal.spoonbill:
    label: Καλπίτιδο
    summary: Λευκό πουλί που βρίσκεται στην επιφάνεια με υψηλό φορμαγκιού.
    info: Το λευκό Καλπίτιδο είναι σχετιζόμενο με τους κάστρωνες αλλά διαφέρει ρητώς για να παρατηρήσεις το βύθισμα φορμαγκιού του. Για να βρει τροφή, κινεί το βύθισμα απ' τη μια πλευρά στην άλλη στο νερό. Δημιουργεί αποικίες σε χώρους με ψηφίδες.
  animal.stork:
    label: Γουραλίτσινθο
    summary: Μεγάλο λευκό πουλί με κόκκινο δόντι ; φέρνει παιδιά.
    info: "Το Λευκός Γουραλίτσινθο είναι μη κάτω που φτιάχνει σπήλαια αγρύπων τόσο ροφήματα όσο δένδρα σ’ όλη την Ευρώπη\nΠερνά νύξες για λεβεντικές περιοχές της Αφρικής και βρίσκεται συνεχώς στον ίδιο σπήλαιο,\noπού τον μεγαλώνει κάθε χρόνο·\nΣυμβολίζει την άνοιξη και την αναπαραγωγική ικανότητα · \nΗ Δημοτική Παράδοση λέει πως φέρνει παιδιά."
  animal.swallow:
    label: Κορυδαλίς
    summary: Γρήγορος αεροβόρος που λовάρει εξωτερικά.
    info: Η Κορυδαλίς επισκέπτεται την πόλη για να αναψουχή καθώς χειμάζει στη δυτική Αφρική με βάση τη φύση.
  animal.swan:
    label: Λαβος
    summary: Μεγάλο ελεγχόμενο λευκό νερό που συμβολίζει την ώρα
    info: "Η μεγάλη πατρινή είναι το κυνός γουπύ ακέφαλο στη Ευρώπη όσο διάμετρο φτερωτό να λεβιδώνει πάνω από 2,50 m\nΣυμβολίζει την ωραιότητα , την αγάπη και την πίστη ; Δίνουν βούλιξη σε ζευγάρια για χρόνια .\nΠροχωρεί αθέλητα το κεφάλι του και φουσκώνει τα φτερά του για να προειδοποιήσει τους επιτιθέμενους \nΣτην περιβολή του Hans Christian Andersen η πατρινή είναι σύμβολο μεταμόρφωσης του άψογου μπεϊκ"
  animal.toucan:
    label: τουκάν
    summary: Θερμοζώνη που ξεχωρίζει με το μεγάλο χρωματιστό ψαλίδι.
    info: "Το τουκάν ζει στα πρώην δάση της Κενδρικής και νότιας Αμερίκης. \nΗ εξέχων ράφι απ' όλο μήκος γύρω στα 5cm φυλαγμένο - \nθα λειτουργεί για τον έλεγχο της θερμοκρασίας\nτης βοήθεια στην προσβολή των φρούτων και ως οπτικό σήμα."
  animal.woodpecker:
    label: δαχτύλιο
    summary: Πώς μπορεί να επηρεάζει το δαχτύλιο την αξία.
    info: Το δακτύλιο είναι που τρέφεται με ένσημά σπόγυρα απ' όπου βγήκε και φως για να λύθει την αξία του.
