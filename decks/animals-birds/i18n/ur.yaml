lang: ur
pivot: false
title: پرندے
cards:
  animal.albatross:
    label: البتراس
    summary: سب سے زیادہ پرواز کا وسعت اختیار کرنے والی مچھر جانور۔
    info: مigratory Albatross تمام طیروں میں سب سے بڑا پرواز حملہ آور، تقریباً ٣٫۵ مترا تک پائیدار رہتا ہے۔ اس نے عمومًا خشک براعظم کے مقابلے میں دریاؤں کے اوپر وقت صرف کرتا ہے اور گنوا کلو میٹر فضا میں قدم جمائے بغیر لفظی معنوں میں چلنا مشق کرسکتے ہیں۔ اس کے علاقوں میں سمندری پانی استعمال کرنا شامل ہوتا ہے، جو ان کے منڈلانوں کے ذریعے نمک کا الائج دکھاتا ہے۔
  animal.budgerigar:
    label: انڈولکا
    summary: ایک دنیائے افریقہ کا بڑا پرندوں میں شامل جگل رنچھ، لوگوں نے ان سبز-پلاٹ لوند وارنا تبدیلوں کو خوبصورت طور پر استعمال کرتے ہیں۔
    info: "انڈولا فینسکوا آؤستراݢیئن درمیان والے علاقے سے تعلّقات رکھتا ہِے، جتھ‏ٔو وُડے حلقےآں وچ زندگی گذارتَ ہِے。\nan\nدنیا دے تمام چرب پالتو پرندوں وچ اسنو دوسرے مقام اُتے قابض ہِے، جتنے کافرنچ کرواتَ ہِے۔\nمرداں انسانی آوازاں تو ملائم کرسکدے نيں اور سوروں الفاظ سکھ سکدے نيں۔ \ndivokee anudlki so zelene-zlatoo barvy; colorate mutations were created through breeding."
  animal.canary:
    label: کاناری
    summary: ایک ننھا زرد رنگ کا بولتے ہوئے پرندہ جسے اپنا محبوب حیوان بنایا جاتا ہے۔
    info: |-
      خاندانی کینارک، کینیر ساحلی علاقوں سے تعلق رکھتا ہے اور ۱۷ ویں صدی میں قابض کیا گیا تھا۔
       شادمانی کے ذریعے زرد رنگ وجود میں آیا؛ دبستان کاناڑک لُجائی چمکدار ہوتا ہے。
       مردوں کا غزل گاؤن معروضی ہوجاتا ہے؛ کانارک کے گلوکاری مقابلے تمام دنیا میں مشہور ہیں۔
  animal.cassowary:
    label: کاسوائر
    summary: نیوز لینڈ کا خطرناک نہل سے پرندہ تیز دانشور اور زخم بھی بناتا ہے۔
    info: "کسوار جدید گائنئی اور شمال مشرق آسٹریlia کا ایک لمبا، فضائی طاقت وار قابل عمل حاضر پرندا ہوتا ہے۔\nایسا عالمی معروف غیر ضروری پرندا ہونے کا شمار کرتا ہوا چمڑا والے اندر کے انگُلوں کے درامد سبب سنگین زخموں کا باعث بنتا ہے۔ \nبلند ہڈی کا ہتھیار (کسو)، موذٗن کے ذریعے بالغ جنگلات میں راستہ بتانا ہوسکتا ہے۔"
  animal.cockatoo:
    label: کاگادو
    summary: ایک خوبصورت سفید پرندہ جس کی علامت وارنے والی زرد دم تھی۔ اُترالاسیا، آسٹریلیا متعلق。
    info: |-
      کاگادو زلفدار بڑا ذہین طبیعت والا فوجائی حملہ آور نمونہ چونٗ لاتا ہے۔
      جب وہ متاثر یا غصّے میں ہوتا تو اپنا شاندار زرد بال بلند رکھتا ہے。
      آؤسریلوشِئا میں ان کو محصولات کا نقصان دہ قرار دیا جاتا ہے۔
  animal.condor:
    label: کنڈور
    summary: امریکا کے سب سے بڑا پرواز کرنے والا طوطا جس میں بالوں والی نہیں۔
    info: "اندز اینٹلر اندازن دنیائے حشرات میں وزن اور پنجرا کمپوزیشن کے لحاظ سے سب سے زبردست فضا مارچ کرتا ہے۔\nایک قسم کا شیر خوار گوشت، وہ درندوں کے مردوں پر غذاء اختیار کرتا ہے اور تھاموسفائر نظام میں ضرب القدر کا کردار ادا کرتا ہے。\nanimals کے حرارتی رجحانات پر بغیر آوازوں کے عظیم الشان پرجاتی ہوتی ہے۔ \nاورن لوگوں کے لئے کوندور آسانی اور آزادی کا علم برآورد ہے۔"
  animal.crane:
    label: جِرب
    summary: تاریخی طور پر تانز کے رسمی اداکاروں اور بڑھاپہ آوازوں سے مشہور واقعات.
    info: |-
      جراب جنوب مغربی خطہ میں موذون قطاروں کے ذریعے لاکھوں کلو میٹروں کا سفر کرتا ہے۔
      اس نام لائق فرشتوں کو خصوصی عبادت گاہوں میں دماغ کے انحرافات، زرد شدید حرارت اور حلقہ بازنی کرنے والے عمل کے بعد معروف کیا گیا。
      چند ماہ قبل اس کے بزرگ لوگوں کے درختوں کے ذریعے غیر منظم ہلچل کا مقابلہ کرنا ضروری ہوتا ہے۔
  animal.crow:
    label: چوہا
    summary: ذکی سیاہ پرندہ جس کے خاندان میں مشغول رہنے والے اور مسئلہ حل کرنے کی صلاحیت والا شامل ہوتا ہے۔
    info: "چوہا، ذکاء کے لحاظ سے بڑھ کر معروف، نمونہ قسم کے عمارتوں کا تعلق حادثاتی طبیعیات سے ہوتا ہے。\n وہ انسانی گال دوروں کو شناخت کرسکتا ہے، آلات استعمال کرتا ہے اور پیچیدہ کام کرلیتا ہے۔\n ان لوگوں کے زوجوں یا چھوٹے گروپوں میں رہائش اختیار کرتے ہیں اور تمام غذا کھاتے ہیں۔ \n چیک ماڈولوجی میں عام طور پر چوہوں کو فضائل باطنی کا علم حاصل ہوا ہوتا ہے۔"
  animal.cuckoo:
    label: کوواچا
    summary: نسلی پاراسٹ جس کے انڈے دوسروں کے تالو میں رہتے ہیں۔
    info: "کُکَچْکَا عام طور سے نسلی تعقّب کرنے والی مشہور عدالت ہوتی ہے؛ وہ اپنا آؤ لینا، دِماغ فرما کر بڑھانے والا ماں باپ کے حوالے کرتی ہے。\nنو عمر کُکَچْکَا بالغ وقت میں دوسرے انڈوں اور بچوں کو تالو سے خلاص کردیتا ہے۔\nایک منفرد 'کُک' صدا، جو موسم گرم کا علم دیتی ہے، اس کی شناخت ہے۔ \nمردوں کو واچلائندہ آواز ملتی ہے تو عورتوں کو زیرزمین قائم ہونے والی آوازوں کا ذخائر۔"
  animal.dove:
    label: ہو لوب
    summary: امن کا علامت؛ ایک صاف سفید بالوں والے پرندہ۔
    info: "سفید حلق مذہبی طور پر قدامت سے آج تک جاری رہا ہے، بائبل میں نوح کو اس کے ذریعے خشخاش کی شاخ دی گئی。\nمسیحیت میں وہ اللہ تعالٰی کے فرشتوں کا عالم ہوتا ہے۔\nhoushold голуб درحقیقت سنگھلوب کا قومی نوع ہے، جس کا سفیدرنگ ماڈلنگ کے دوران وجود میں آیا۔ \nsfied golubs کو مختلف مقاصد کے تحت تمام دنیا میں رسماً استعمال کیا جاتا ہے۔"
  animal.duck:
    label: کچھنہ
    summary: ایک پانی کا طوطے جس میں ایک تخت زبین ہوتا ہے؛ مردہ (کچر) سبز رنگ کے سروں والا ہو۔
    info: "کچنا دِواج، عالمی حد تک وسعت اختیار کرنے والی قسم کا براجمان فصل ہے اور عمومًا تمام خاندانی نسلوں کا ماخذ ہے。\nمردہ (کچیر)، صفت آشوب لالچدار سبز سر کا حامل ہو توئل، اناث عام طور پر غائب ہونے والی بندرگڑھ ہندوار ہو۔\nkaccha ڈابنے والی کچنوں کا ذمہ دار ہے، جو مناسب درجات میں بالائے سطح کے ذخائر استعمال کرتے ہیں، نہ کہ ٹُپکتے ہیں۔ \ncanary چیکوں میں لاشعوری حصّہ ہے، جلاوطنی کے نظام اور دریاؤں کے روستوں کا۔"
  animal.eagle:
    label: اورل
    summary: چوگوں کا چوگا ہوا جانور جس کا چوگا موڑا ہوا ہوتا ہے اور نظر تیز ہوتی ہے۔
    info: بیلو ہیڈڈ ہالی ایٹس امریکی جمہوریہ کا قومی علامت ہے اور شمالی امریکا کے سب سے بڑے شکاریوں میں سے ایک ہے۔ یہ بالخصوص مچھلی کا شکار کرتا ہے جو اپنی تیز ناخوں کے ذریعے پانی سے سیدھا پکڑ لیتا ہے۔ اس کے پروں کا پھیلاؤ دو میٹر سے زیادہ ہوتا ہے اور وہ پہاڑوں میں تقریباً 20 سال تک زندہ رہ سکتا ہے۔
  animal.emu:
    label: EMU
    summary: دنیا کے دوسرے بڑے پرندہ، نالائٹنگ آسٽرلین راتائِت جيئ.
    info: EMU اُمارا سمندر وارو هجوم تيار ڪري لاءِ مهيا ٿيل دنيا جو ٻيو ويجهو فطرتي حجم واري قسم جو عظيمانه پکڙو آهي. انداز به ناهي ۽ هيءَ تمام ئي شاديءَ وارو هلائي ٿو. مرد انڊن جي منهن ۾ وجهيندو آھي ۽ ماچرو خود واپسي ٿيندي آھي. عام طور تي 1932ع ڌيان آسٽرليون فوج EMU جي جنگ ۾ انهيءَ جي ڀرسان بيحد موثر هو.
  animal.falcon:
    label: سکواول
    summary: دنیا کے تیزترین جانور اُڑن میں سرخ زخم والوں پر، چھلانگ لگاتے وقت رفتار ۳۲٠ کلو میٹر فی ہائیر سے بھی آگے۔
    info: "سَکوالِل شتّه‏واڤا دنیا کا تیزترین حیوان ہے؛ چھلانگ لگاتے وقت وہ ۳۲ٰ کلومیٹر فی گھنٹہ سے زائد رفتار حاصل کرتا ہے۔\nاس کی نظروں کے ذریعے سورج کی روشنی کم ہونے والا خاص الاؤ شامل ہوتا ہے۔ \nآدمی ان کے ساتھ ڈوبن کے عمل کو ۲٬۰۰ٗ سال قبل استعمال کرنے لگا تھا؛ یوئنسکو قائم کردہ درخت میں اس کا ذکر موجود ہے。\nچیک جمهوریہ میں وہ بلند عمارتوں اور صحراء میں تنقید کرتا ہے۔"
  animal.flamingo:
    label: plameňák
    summary: ایک رُضّی چوکا جو ایک ہی پاوں پر گہری پانی میں کھڑا ہوتا ہے۔
    info: رُضّی کا رُضّا رنگ جراثیم اور خون کے کاروٹینوئیڈس کی وجہ سے ہوتا ہے جس پر وہ کھاتا ہے۔ نوزائیدہ رُضّی سرخی سے گھلے ہوئے ہوتے ہیں اور وقت گزرنے کے ساتھ رنگ پکڑتے ہیں۔ چوکا زوبہ فلٹر کے طور پر کام کرتا ہے - رُضّی اپنے سر کو نیچے کر کے پانی سے کھانے کو فلٹر کرتا ہے۔
  animal.goose:
    label: ہوس
    summary: 'بڑا پانی کا جنگلی طوطے، اسکول میں تبدیلی لاتا ہوا بھاگتا رہتاجو زمین پر نسل در نسل۔ '
    info: "ایک حیرت انگیز واقعہ سامنا کرنے والی عظیم الشان چوندروں کا ذخائر دار فطری ماخذ ہوتا ہے۔ \n خصوصی شکلوں میں حرکت کرتے وقت مختلف مقاصدوں کے تحت قائد کی حثیت اختیار کرتے ہیں۔\n آئندہ دور میں بالخصوص تنقید کے معاملات میں غوروفکر کا تقاضا ہوتا ہے۔"
  animal.hawk:
    label: جیسٹراب
    summary: جنگلات اور زمینوں میں پکڑنے والا جانوروں کا تیز دُشمن۔
    info: |
      ایک درندہ طبیعت والا بچھDick، جو موذون فلائت سے حملہ کرنے کی صلاحیت رکھتا ہے، خاص طور پر وہ لمبا ذنب اور چارپائی شکلوں کے باعث نسبتاً تنگ علاقوں میں حرکت کرتا ہے۔
      اس کی لاجق قسم بالخصوص آزاد اندازمیں پرواز کرسکتی ہے؛ وہ عام طور پر پنجوں سے چیزوں کو پکڑنا یا لوفر کردیتی ہے。
      آواز کے اعتبار سے عمومًا ماڈل مرد مقابلے میں عورتوں کی جانب سے واضح طور پر غالب
  animal.heron:
    label: چوکا
    summary: ایک بلند پانی کے جھاؤ میں رہنے والی اور نمودار بناۓ رکھتی تلاشِ مچلگین۔
    info: |-
      چُواَر فرانس، آلمان اور سلوونيا سميت وسطی یوروپ کے علاقائی درجات میں زیر حراست موجود سب سے لمبا لڑدالٹݨ والا طوطّا ہئي۔

      اس دا شمار خصوصی طور پر غرقاب بنادينٛدا ہئي، جدوں اوٗ کمزور حرکت تو‏ں موثر انداز وچ قدم باقاعدہ طرح سامنے لاواݙ دا انتظار کردٖتا ہئي۔
  animal.hornbill:
    label: زوبوروژیس
    summary: افریقہ اور آئے کو زدگان تھن لکڑیاں والے جارحات سبج فامل بُسرٗٹائڈ، مثال کے طور پر وائل نتینچر انضمام۔
    info: اس قسم کے چونچ والا حشرات خوار چند دماغی علاقوں مثلاً مواد کے رخسار کے ذریعے شناخت کرتا ہے۔ وہ غرب افریقا اور شمال مشرقی ایشیاء کے درمندانہ جنگلات میں پایا جاتا ہے۔
  animal.hummingbird:
    label: کولبرک
    summary: دنیا کے سب سے چھوٹے پرندے کے طور پر جانے جاتے ہیں جو مقام پر اڑ سکتے ہیں اور پیچھے کی طرف بھی پرواز کر سکتے ہیں۔
    info: کولبرک روبن ہرٹلی وہ واحد قسم کا کولبرک ہے جو مغربی امریکہ کے مشرقی حصے میں منظم طور پر گھر بناتا ہے۔ اس کے پنجوں کو سیکنڈ میں 53 بار ہلایا جاتا ہے، جو اس کی خصوصی گونگھل گونگھل کی آواز کا باعث بنتا ہے۔ یہ نکٹر اور چھوٹے کیڑے مکوڑوں پر پالا جاتا ہے؛ اس کا دل منٹ میں 1200 بار دھڑکتا ہے۔
  animal.ibis:
    label: آئبِس
    summary: ایک بروڈوی پرندہ جن کے منحنی ناک والے زوبائچھ ہوتے ہیں، قديم مصر ميں اس کی تعظيم تماشہ سمجھا جاتا رہا۔
    info: |-
      آئبس وائلد فلور خاندان کا ایک براؤڈ ولنگ پرندا ہے جس کا لمبا منحنس زوبائچہ حیرت انگیز طرح سے علامتی شکلوں کا دارومدار بن چکا ہے۔
      قرآن مجید میں آئبس کو قدیم مصر کے الٰه ثُوات کا ظاهر کردہ وجود بتایا گیا ہے。
      یہ غربتوں اور دریاوں کے مثلثی حصّوں میں عمودی مشترکہ نظام میں رہتا ہے۔
  animal.kingfisher:
    label: لیڈنچاک
    summary: دریاؤں کے پاس مچھلوں کو تلاش کرنے والے اس جادوجائے رنگت والا طوطہ۔
    info: |-
      رِّفٹ لیڈنچاک، سبز البدو بدن اور نارنجی سینے والے عظیم الشان درجات حمل وصول کرتا ہے۔
      ایک شاخ پر براجمان ہوتا ہے اور آبی زندگی کا تعقیب کرتا ہے؛ فوراً ہی غرقاب ہو جاتا ہے。
      یہ پانی کی صفائی کا معیار ہے؛ جہاں موجود ہوا کرے تو پانی صاف ستھرالا
      جاپان میں مشابہ لیڈنچاک (هيسوي)، خوبصورتی کا علمبردار ہے۔
  animal.kookaburra:
    label: ہنسنے والا کوکابوررا
    summary: ایک اسٹریلین بچھڑا جو آدمی نما خوشالی سے پکارتا ہے۔
    info: ہنسنے والا کوکابوررا، اسٹریلوں میں مشہور دِبّاندۂ حشرات و ذخیرہ فروش جانوروں کا شمار کرتا ہے۔ اُس کا تقرف لمحہ صبح اور سورج غروب ہونے کا علامت بن گئی ہے۔
  animal.lorikeet:
    label: لوری
    summary: ایک خوبصورت رنگوں والا نектار اور پولین کھانے والا بلبل۔
    info: "اوراسئس سے تعلق رکھنے والی لری، تمام بابوزروں میں سب سے زیادہ جلوہ انگیز رنگوں والی قسم ہے۔\n وہ متخصص بالشت دانتوں والے زبان استعمال کرتا ہوا حوض کشیدہ درختوں کے فرشتوں سے نektار اور پالسن کا ذخیرہ کرنے کا مشغلہ اختیار کرتا ہے。\n ٹائپکل جنگلات کے آمدورفت کا ضامن بناتا ہے۔ \n وہ لوگوں کے تعامل میں شامل ہونے کے علاوه شوخ طبعیت اور حرکّتِ بازو کا مظاہرہ کرتا ہے؛ محبوسان حال میں انسانوں کے ساتھ تقریباً فوری ربط برقرار کرسکتا ہے۔"
  animal.lyrebird:
    label: لائروچوسٹ
    summary: ایک آسٽریلوی پنگھا جو اطراف کے تمام قسم کے آوازون تقریق سان مماثلت رکھندؤ۔
    info: |-
      لائروچوسٹ نادار واقعی اترال زور لاءِ مشہور ہئي، جوءَّ موڑ توں بجلی والى منجݨ ديا فرشتې، عکاسی ديا ماشين، ڈرائيولرن ديا الارمن يا ٻيوں پنجهن ديا صدا سميت تقریقاً هر قسم ديا آوازا ئي ملا سڳدؤ۔
      مردانهُ خواتون لاک ليهي انکا بالغ شكل والا لمب واخرا اويس لوڻ ۽ حفظياتي تقليدن سان。
      اوءَّ استرالياني رياست ويڪٽوريآ ديا علمبردار به هو
  animal.macaw:
    label: ارا
    summary: 'امروکی تھرمل جنگل کے اس عظیم پراوٗش میں زبردست رنگدار بالوں اور مضبوط بادلوالے مشہور طبیعات موجود ہوتے ہیں۔ '
    info: آرام، دنیائے حيوانات کے سب سے ناقابل فراموش رنگ والے پنجاب میں شامل ہے۔ ان کے قوي منحنی شکل کے دانت موٹے آمونچھ کوزئے توڑنے کی صلاحیت رکھتا ہے۔ وہ جوڑے میں رہتے ہیں جو تمام عمر باہمی محبت برقرار رکھتے ہیں۔ درختوں کے ختم ہونے اور غیرقانوني ذخائر کے معاملات کی وجہ سے ان کی زندگی خطرات میں مبتلا ہے۔
  animal.magpie:
    label: سٹرکا
    summary: ایک کالے اور سفید پنڈلی والا جانوروں والا طوطہ، دوسرے رنگ میں تارنوں کی طرح لمبائی۔
    info: اس عالم عامہ نامی بچھڑے کے بال بلند لباس کے قدرتی حالت میں کالے اور سفید رنگ کے درمیان فرق موجود ہوتا ہے۔ وہ لوگوں کو زرد روشن آئینے میں خود کا منعکس تصویر تشخیص کرنے کی صلاحیت رکھتا ہے۔
  animal.nightingale:
    label: سلاویک
    summary: ایک ننھا براون پرندہ جو اپنا سب سے خوبصورت پرندہ کانٹروں میں شامل ہوتا ہے۔
    info: سلاویک عام، ایک چھوٹا براؤن تاراجوڑا ہے جس کا مرد حملہ آور ان تمام معقد اور دلفرما فرشتوں میں سے ایک زمیندار گلوکار بناتا رہتا ہے۔ وہ بالعموم شب اور صبح کے وقت غزل گائے ہوا ہے، جس سے اُس کا نام منقول ہواتا ہے۔ یہ بلبل کا دور دراز قربان ہے۔ عالمِ شاعرانہ دانتش سے لے کر کئتس تک سلاویک کے گانا محبت اور ذوق کا علمبردار سماعت کرتا رہا ہے۔
  animal.ostrich:
    label: پشتراس
    summary: دنیا کے سب سے بڑے پرندہ، نالائٹن؛ اس رفتار تک دوبارہ جاتا ہے۔
    info: "دو انگلی والا زردچین دنیا کا سب سے لمبا اور وزنی طوطا ہوتا ہے؛ مرد حضرت میں فرشتوں کی بلندی ۲٫۷ متراً تک پہنچتا ہے اور وزن ١٥٠ کلو گرام سے زائد ہوسکتا ہے۔\n وہ لانے کی قدرت نہیں رکھتا، البتہ دنیا کا سب سے تیز چلنے والافرسودہ ہونے کی وجہ سے 70 کلومیٹر در ساعت کی رفتار تک پہنچ سکتا ہے。\n اس کے آمادہ تمام پرنده کے مقابلے میں سب سے بڑے ہوتے ہیں۔ \nایک قدموں کا بالکل علاحدہ حصہ غائب ہوجاتا ہے ؛ صرف دونوں انگلیاں موجود ہوتی ہیں۔"
  animal.owl:
    label: سوا
    summary: رات کا شکاری پرندہ جس کی آنکھیں گول ہوتی ہیں، چلائیں ہلکی ہوتی ہیں اور سننے کی صلاحیت بہت اچھی ہوتی ہے۔
    info: وائر ویلکی سب سے بڑا شمالی امریکا کا سوا ہے۔ سوا کی آنکھیں گردش کرنے کی صلاحیت سے محروم ہوتی ہیں، اس لیے وہ اپنی گردن کو 270 ڈگری تک گھماسکتے ہیں۔ ان کی پروں کی خصوصی ساخت کی وجہ سے ان کا پرواز تقریباً چپ چاپ ہوتا ہے۔ وہ تاریکی میں شکار کرتے ہیں، جس میں ان کی سننے کی بے مثال حساسیت کا کردار ہوتا ہے۔
  animal.parrot:
    label: پاپوگ
    summary: ایک رنگین گرم اور ہر دم چیچک جو آوازوں اور انسانی گفتگو کی نقل کر سکتا ہے۔
    info: اک ارا شرلوتوفی ہر دم چیچکوں کی دنیا کی سب سے بڑی قسموں میں سے ایک ہے، جس کا پر کا پھیلاؤ ایک میٹر سے زیادہ ہوتا ہے۔ یہ لاطینی امریکا کے گرم اور ہر دم جنگلوں میں پایا جاتا ہے۔ ہر دم چیچکوں کی بے مثال ذہانت ہوتی ہے - ارا رنگ، شکل اور گنتی کو پہچان سکتی ہے۔ یہ 75 سال تک زندہ رہ سکتے ہیں۔
  animal.peacock:
    label: پاو
    summary: پاو کا جنگلی جسم ایک خوبصورت چھتری نما پیٹھ کے ساتھ بھرپور رنگ کے گھیرے سے ہوتا ہے۔
    info: پاو کورونا سے ایشیائی زمینی حصے کا تعلق رکھتا ہے۔ جب جنگلی جسم (پاو) جذب کرنے کے لیے عورتوں کو ملتا ہے تو وہ اپنے چھتری کو پھیلاتا ہے۔ یہ واقعی میں ایک توسیعی چھپنے والے بال ہیں۔ اس کی چمکدار رنگت پیگ مینٹس کی وجہ سے نہیں بلکہ روشنی کے مائیکرو ساختوں پر جھکاؤ کی وجہ سے ہوتی ہے۔
  animal.pelican:
    label: پیلکن
    summary: ایک بڑا پانی کے جانور والا طوطہ، مچھلی اُگلانے والا وسیع تازہ دم خردر لالو۔
    info: پیلکن ایک بڑا آبی پرنٹ ہوتا ہے جس کا نشتر غیر معمولی انداز سے فرشتہ کی شکل اختیار کرتا ہے۔ اس کا منظوم قسم کا زبان حجم تقریباً ١۳ لیٹروں تک رہتا ہے؛ اس وقت اس میں موجود پانی کو باہر نکلواتا ہوا اور مچھلی کھانا شامل کردیتا ہے۔ اس طرح ائربسوں کے درمیان حرارتی جذبات استعمال کر کے انتظامی نظام میں پرواز کرتا ہے۔ عیسائی علامتوں میں، پیلکن محبت کے ذبح کے معنوں کا ظاهر کنندہ ہے۔
  animal.penguin:
    label: پنگوئن
    summary: جنوبی نیم کرہ کا پرواز کرنے سے قاصر پرندہ، عمدہ تیراک
    info: چانچل پنگوئن سب سے بڑا پنگوئن ہوتا ہے؛ اس کی اونچائی 1.1 میٹر سے زیادہ ہوتی ہے۔ یہ اینٹارکٹکا میں پالا جاتا ہے اور سب سے زیادہ سردیوں میں انڈے دیتی ہے - مرد پنگوئن ساری اینٹارکٹک سردیوں کے دوران اپنے پاؤں پر انڈوں کو گرم رکھتے ہیں۔ پانی کے نیچے یہ 30 کلومیٹر فی گھنٹہ سے زیادہ کی رفتار حاصل کر سکتا ہے۔
  animal.pheasant:
    label: بازنٹ
    summary: ایک بڑا رنگین پرندہ؛ نر کے خوبصورت رنگ اور لمبا دم ہوتا ہے۔
    info: "برابزانت عام طرح سے آسیان لائے جانے والوں میں شامل تھا، البتہ موجودہ وقت میں یوروپ کی فاؤنا کا قابل ذکر حصّہ بن چُکا ہے。\nnr (مردہ مرغ) کے عمدہ رنگ ہوتے ہیں، سبز-تنوس زردجسماورآنکھ کے گِروار میں وضاحتی چرن حلقہ\nچلکتا ہوا۔\nچیک جمهوریہ میں سب سے زیادہ مشترکہ بالدار شکار ہے اور شکار کی روایات کا بنیادی عنصر ہے۔ \nزمین پر موذون درختوں میں غذا کرتا ہے۔"
  animal.pigeon:
    label: ہو لو ب
    summary: 'ایک عام سا ادھر کے شہروں میں پائندہ جانور، درحقیقت اس کا نسب скаرن ہولوب سے وابستہ ہے۔ '
    info: "اس حوالے سے تمام دنیا کے آباد علاقوں میں موجود مقامی چونچلے انڈومیٹکائز ہو لئے گئے ہولوبز کے ماخذ ہوتے ہیں۔\n\nیہ تاریخ میں پہلا فرد ہوا جسے خصوصی طور پر قید کرتے رہے؛ صدیوں بعد تک لوگوں کو خطوط پہنچاتا رہا。\n\nیہ شخصیت غیرمعمولی داخلی نظام ذہانت کا استعمال کر کے سوروں کلومیٹر دور سے واپس منزل کی جانب موڑتا ہے۔ \n\nدنیا کی مختلف ثقافتوں میں یہ تحفظ اور عدم تعصب کا زبردست عنصر بن چکا ہے۔"
  animal.puffin:
    label: پاچلک
    summary: ایک درمیانے سائز کا نہری پنجاب جس میں اونٹوؤں والے منقار کی طرح رنگین منقار موجود ہوتا ہے۔
    info: شمالی فراٹرکولائڈ، برف زدہ علاقوں میں پایا جاتا ہوا چھوٹا توقنوالا مرغ دار حیوان ہے جس کا منقار مختلف رنغوں کا بننا مشورت ہے۔ وہ غذا کے لئے آباد شاخوں میں داخل ہوجاتا ہے اور اندر سے ماچھلی کو پکڑتا ہے؛ اس قابل ہے کہ ایک وقت میں چند ماچھلیاں اپنے منقار میں سماسوتر کرسکے۔ یہ سنگی روسری اور خوبصورت مقامات پر تنظیمات کرتا ہے۔ یہ آئسلینڈ اور فیرروز کے مضبوط ثقافتی معالم میں شامل ہے۔
  animal.quail:
    label: کرپلکا
    summary: چھوٹا جانور، زمین پر تیار کردہ اُگنے والے درخت۔
    info: |-
      کِروں سے براجمان فاسانا نسل میں موجود واقعات کا ذکر ضروری ہوتا ہے۔
      ایسے حشرات دیدۂ غضب کے لحاظ سے مشہور رہتے ہیں، انہیں سننا آسان ہوتا ہے (جیسا کہ 'питі-пít') لیکن دیکھنا مشکل ہوتا ہے。
      دوسرے قسم کے بازن٘د توائے مقابلے میں یہ موذون ہوتا ہے اور خواتین کے طور پر عربستان میں شام کرتا ہے۔
  animal.raven:
    label: کرگو
    summary: ایک بڑا اور ذہین کالے رنگ کا پنجاب جس میں خصوصی حلق سے آواز نکلنے والا تھنا ہوتا ہے۔
    info: "کروچوس کاراکس، جانوروں میں سب سے لمبا قومیاتی طرح کا فلائٹ انڈکنس ہے، جس کی لمبائی ۶۰ سینٗتِمیٗتر سے زائد ہوتی ہے۔\nیہ غیر عادی ذہانت والا جانور مستقبل کے لئے منظم کرنے، کھیلوں کی صلاحیت اور سماجی رشتے بنانے کی وجہ سے مشہور ہے۔ \nشمالی لوگوں (اوردائن کے شکاری حشرات ہوجُن اور موَنِن)، کیلت لوگوں کی داستانون میں واقعی معنوی مقام رکھتا ہے۔\nلاند برطانیہ کے ٹاور کو تحفظ حاصل ہے کہ اسطورتوں کے مطابق اقتدار گرانے کے بعد اگر کراچون ٹاور چھوڑ دیں تو۔"
  animal.roadrunner:
    label: کوچا کن زمینی
    summary: شمال امریکہ کے بارسن میں تیز رفتار جانور؛ انگریزوں کے سیرال کا پاسبطہ۔
    info: |-
      زمینی کوچوا (روڈرنن)، نامعلوم فلائنگ والے طوطے، دبئی لڑائی، ٹربولنس، وغیرہ شامل ہوتے ہیں۔
      ایسے حشرات، چھوٹے موذون، اور خاص طرح قابض کردہ شاخوں کے ذخائر استعمال کرتا ہے。
      اس کی صلاحیت موجود ہے کہ اپنا غذا بازار بنانا، اور ضبط کرنا۔
  animal.robin:
    label: چرورنکا
    summary: ایک چھوٹا پنجاب جس کی سین لال رنگ کے، برطانیہ میں عید الفطر کا نمائندہ۔
    info: "چروڑنا عام ایک چھوٹا بولتی والا تاراسلام زرد-لالم سامع کے ساتھ۔\n وہ غیر متوقع طور پر شجاع ہوتا ہے؛ حفاظتی فصل کاشتوں کو دیکھتا ہوا ظاہر ہونے والے انڈمز کو جمع کرتا ہے。\n یہ برطانیہ کا قومی تارااور روائی عیدالفطر کا نشان ہے۔ \n وہ سب موسموں میں اپنے خطۂ آبادی پر باقی رہتا ہے اور زمستان میں بھی گانا بجائے ہے۔"
  animal.seagull:
    label: ریسک
    summary: ایک ساحلی پنجنے والا طوطہ جو لوگوں اور دریاؤں کے قریب غذا تلاش کرتا ہے۔
    info: راسلار آرجینٹائوس، ریسک نامی ایک بحری طوطہ، یوروپ میں سب سے زیادہ عام حشرات الاعشاش میں شمار ہوتا ہے۔ وہ موٗقّتی اور تمام خواص والا چھلانگ لطاف دارد؛ صرف سمندری ساحلوں بلکہ اندر کے علاقوں میں لاکھروں اور ندیوں کے قرب میں بھی موجود ہوتا ہے۔ ذہانت مند ہونے کے باعث بعض وقت انسانوں کے فرشتوں کو یاد کرنے کی صلاحیت رکھتا ہے۔
  animal.secretary_bird:
    label: پتّاچک سیکرٹیر
    summary: ہندوستان کے افریقائی شوال جس میں حملہ آور پن بھی ہوتا ہے۔
    info: "ptaček sekretár، دلتوں والی زمیندار فوج نے صاف ستھرا خاندان بنایا ہوا ہے۔\n وہ تقریباً تین وزن کے قدم استعمال کرتا ہے جب ان کو گدڑ لات مارتا ہے۔ \nاس کا نام اُس وقت رکھا گیا تھا جب اِس کے بال بلند ہونے لگے تو اَفغان علاقوں کے نقشے کی طرح دکھائی دئيٗں。\n وہ جنوبی افریقا اور السودان دونوں کے قومی معروضات کا حصہ ہے۔"
  animal.sparrow:
    label: چوہا
    summary: ایک ننھا براون رنگ کے پرندے جس میں دلچسپ آواز اور لوگوں سے قربت کا خاص وصف موجود۔
    info: |-
      دروازہ والے چوہا زمین کا سب سے عام ترین پرندا ہوتا ہے، جو شخصی طور پر انسانوں کا حامی ثابت ہواتا۔
      اس وقت ان کی عمارتوں کے درمیان ٹھنڈا لاتااور شہرت کمرشل مقصد برقرار رکھتا。
      آخری دہائیوں میں شہروں میں ان کی فوجی کارروائی واضح طور پر کمزور ہوئی۔
  animal.spoonbill:
    label: کولپیک
    summary: ایک سفید بروڈنگ پرندہ جس کا خصوصی لڑھکے والا منقار ہوتا ہے۔
    info: بلاٹلئیرا لوچوروڈِائی انسان، کُلوْمَّٗک وحشی نسل میں شامل ہے، البتہ فاروقیت سے اس کا تعلق انوباس کالونیز سے ہے۔ اس کا لمبا، چوड़ा اور چاقوا شکل والا منقار غذا کی طلب میں آسان بناتا ہے۔
  animal.stork:
    label: چاپ
    summary: 'ایک بڑی سفید پرندہ جس کے لال منھ میں اور تختوں پر آواج دیتا ہے۔ وہ خود شادی نہیں کرتا، بلکہ بچّوں کو لا رہا ہوتا ہے۔ '
    info: چاپ ان تمام علاقوں میں روofs اور ستونوں پر غار بناتا ہے۔ موسم گرم میں وہ حبش کے زمیندارانہ خطوط میں قدم جمائے ہوئے ہوتا ہے۔ عام طور پر وہ صرف ایک ہی غار استعمال کرنے کے بعد اسے سال در سال بڑھاتا ہے۔ لوک فنتراء میں چاپ جب باغت سے واپس آتا ہے تو وہ بچّوں کو لائے ہوئے ہوتا ہے۔
  animal.swallow:
    label: چوہا
    summary: تیز فضا میں پرواز کرنے والا جانور، اکثر ذرا سا برق تھلائی دم۔
    info: |-
      چوہا عام طرح زمستان کر رہتا ہے جنوبی عرب کے خطے میں اور نests وادی انگورستان میں بناتا ہے。
      ایک لڑکا آسمان کا ماہر؛ حشرات صرف فضامیں شکار کرتا ہے اور بغیر روکے سطح پانی سے پینا بھی قابل ہوتا ہے۔
      اس کا غذا خشخاش کے ٹولس اور چھتوں کے تحت ہوتا ہے؛ لوک ثقافت میں چوہا موجودگی منزل کی برکت سمیت لاوا۔
  animal.swan:
    label: لابوٹ
    summary: ایک بڑا، خوبصورت سفید پانی کا طوطہ جس میں حسن اور عشق کے تشخصات موجود ہوتے ہیں۔
    info: |-
      لارج لبّنٗس ولر نامی قسم انگوروں والے بالشت کے بعد دنیا کا سب سے لمبا پرواز کرنے والا فرشتوں کا شمار کرتا ہے۔
      اس کا رومانس، محبت اور وفاداری کا معنوادار تصوير چھپتا ہے؛ زوجین آمنے سمونے تمام عمر باہم وفا کرتے ہیں。
      دشمنوں کو تحذیر کے لئے غلطی سے منقار بلند کر کے اور بالوں کو بچول کر کے اشارہ دیتی ہے۔
  animal.toucan:
    label: چوکا
    summary: ایک گرم اور بارش کے جنگل کا پرندہ جس کے پاس ایک بڑا رنگا رنگ چوکا ہوتا ہے۔
    info: چوکا جنوبی اور وسطی امریکا کے بارش کے جنگلوں میں پایا جاتا ہے۔ اس کا نمایاں چوکا 20 سینٹی میٹر سے زیادہ لمبا ہوتا ہے، لیکن بہت ہلکا ہوتا ہے۔ یہ ہوا کے چمبوں سے بنا ہوتا ہے۔ یہ جسم کے درجہ حرارت کو کنٹرول کرنے، میوے کاٹنے اور دوسرے چوکوں کو دکھانے کے لیے استعمال ہوتا ہے۔
  animal.woodpecker:
    label: کوواچ
    summary: یہ پرندے درخت کی قشر مارنے سے حشرات تلاش کرتا ہے۔
    info: |-
      ڈائٹل، اس وقتاندوز فامیلی 'پِکُئید' سے تعلق رکھتا ہے جب وہ مضبوط زبان اور لمبا دم استعمال کر کے لکڑی کو نقصان پہنچاتا ہے۔
      اس کی زبان اتنی طاقتور ہوتی ہے کہ وہ خراگروں کو سوراخ سے باہر نکالنا بھی آسان بنادیتی ہے。
      ایسا انداز سے وہ اپنے علاقے کو ظاہر کرنے یا اشارہ کرنے کے لیے بول بھی سمجھاجاتا ہے۔
