    info: הסוקול המigrant הוא בעל החיים מהיר ביותר על פני כדור הארץ; בירידה חופפת יורד למהירות של יותר מ - 320 קמ
  animal.flamingo:
    label: 플맨크
    summary: розовый птица ходит на одной ноге в мелких водоемах.
    info: פלמנק רוזовый מקבל את צבעו האופייני מקרוטנואידים המוכלים באלגאות ובקדם, עליה הוא נour. גורלי פלמןקים рожאים בצבע אפור לבן ומתחילים להירגע רק עם הזמן. הפה המשולב משמש כמסנן - הפלאメンקי מסנן תזונה מהמים כשהוא שותה ראש למטה.
  animal.goose:
    label: אוץ
    summary: "\U0001F426 ציפור גדולה שמגיעה לנדידה בכיוון ג' ונמצאת על פני השטח."
    info: הoose הגדולה היא אב טיפוס של האוזים הביתנים והם נודדים במבנה מха특רייסטי בצורת חנית שבה הם מתחלפים בהובלה. הן מאוד שמרניות בעת קידוחן ומביעות את ילדיהן ללא פחד.
  animal.hawk:
    label: латח
    summary: ציפור הנבלת טורפים mammals ולוכדים חיות בר גבעה ובשדות
    info: |-
      לטאה הוא מין של ציפור נבילה מהמשפחה האקיפטרידיא שיכולה ל 사냥 בתוך יער דחוס nhờ כנפי קצרות עגולות וסاقית ארוכה
      הוא מאוד سريع וחכם; הוא מתחרפן בطائر או מצודת התרסה
      נקבות הן בדרך כלל גדולות משמעותית מאחיים
  animal.heron:
    label: וולביקה
    summary: ציפור גבוהה שממתין ללא התנועע ליד המים以便 לדוג.
    info: הוולבק הגרניתי הוא הציפור הגדול ביותר במרכז אירופה שדרכה לדוג בדגים במימי נחל או מפלסמים. הוא עומד במקום כמו פסל ומחכה עד שהปลา יגיע אליו ואז תופף במהירות עם עיניו כדי להכות בו. יכול לאכול דגים וחיזות שלמות.
  animal.hornbill:
    label: زוברויז'ש
    summary: ציפור טרופית עם מקורק מוצף ובנוי מאלומיניום.
    info: זוברווז'ש הוא ציפור מהמשפחה בוסרוטידהה עם מקורק גדול במיוחד בצורת כיסקוס של עצמות או עור רך. הם חיים בחורשים טרופיים באפריקה ובסין ולא יוצרים גידול בתוך חורים אלא בתוך עצי אקליפס. הנקבות ננעשות על ידי הזכרים ונשארות bên תוך העץ במהלך כל תהליך הגידול.
  animal.hummingbird:
    label: קילבר
    summary: 작은 새로움으로서 יכול לעוף אחורה ולרחף במקום.
    info: הקוליבר הורוד הוא המין היחיד של קוליברים ש둥ם במזרח אמריקה הצפונית. הוא מטיח את כנפיו עד ל -53 פעמים בשנייה, מה שמ産ז סאונד טיפוסי של רשרוש. הם אוכלים נектאר וחרקים קטנים; לבם פועם حتى 1200 פעם לדקה.
  animal.ibis:
    label: איביס
    summary: "\U0001F426‍⬛ אייביס - ציפורה ברודית בסנפירה מסובך, נחשבת לקדושה בממלכת מצרים."
    info: אייביס הוא ציפור בродת ממשפחת Thriskioronitidak עם סנפיר אופייני ארוך ומסווג. האיביס הקדוש נعبد במصر העתיקה כצורתה של הלה תות. הם חיים בכמויות באזורי המים והדלתאות הנהריות.
  animal.kingfisher:
    label: לֶדוּן
    summary: ציפור פורחית בצבעי אבן תקועה שמחפירה אחר דג בסולמות.
    info: הלדן האט'יס הוא אחד התרנגולים הנעימים ביותר באירופה עם גב כחול חשמלי וอก כתום. יושבים על עץ מעל המים וחובשים דגים ואז צונחים למים בזינוק חד. זהו מדד ניקוז של מפלולים – שם שבו חייה, מי הנהר ברורים ונקיים.
  animal.kookaburra:
    label: لدניאק מצחק
    summary: צורת לנדינאק אוסטרלית עם קול דרמטי של בצחיק
    info: לדניאק הצוחה הוא ציפור גדולה באוסטרליה ידועת בקול רם הדומה לצחוק אנושי. זהו סמל ה'בוש האוסטרלי', וקריאותיו מסורתיות מודיעות על עמוד השמש והשקיעה שלו. הוא ניזון מאוכפים, חסילאים, קופצים ומחרקים.
  animal.lorikeet:
    label: لوري
    summary: ציפורת קטנה בצבעוני מאוד הניזונה מנ액טר והפרשות.
    info: לורי גוֹרמי הוא ציפור קטן מקצה האוקיינוס השקט עם הצבעים הבהירים ביותר מכל הפופושקים. באמצעות שפת יסוד מברשתית הוא אוסף נектאר ופולן מתאנים טרופיים והוא פורץ חשוב ליערות אלה. הוא חי בדרמות גדולות ונלהב במיוחד כשהוא נמצא בשבי.
  animal.lyrebird:
    label: ليروكوست
    summary: ציפור אוסטרלייה המ仿任何聲音都非常準確。
    info: 'לירוכווסט נאדרון הוא ציפור אוסטרלית ידועה ביכולת שלה לחקות כמעט כל קול בסביבתה: סורגי מנועים, רעשי מכוניות תקשורתי או קריאות של ציפורי אחרים. הזכרים משכו את הנקבות על ידי 展示 their elaborated lyre-shaped tails וimitations מדויקות. זהו הסמל של מדינת ולorta באוסטרליה.'
  animal.macaw:
    label: אראה
    summary: פנינה טרופי גדולה בצבעיה ידידתיים ובמקור חלש.
    info: ארה הוא ציפור נוצצת בגוונים של עצי האראן באמריקה הטרופית עם הצבעים הנעורים ביותר מכל העוף. יש לו מקור חזק ומסתובב שיכול לשבור גרעינים קשיחות של פירות אגוז. הם חיים בזוגיות שנשארת יחד כל חייהם.
  animal.magpie:
    label: סנאי
    summary: ציפור שחורה בלבנה עם ذنب אפור כחול.
    info: הסנאי הוא ציפור משפחת הגרגירים עם מראה שחור לבן וذנב ירוק זוהם. יש לו תיאום של גונב פריטים משקופי אך מחקרים לא מאשרים את המיתוס הזה. זהו אחד מהעטים הנדירניים שיכולים לזהות רפלקס שלהם במראת.
  animal.nightingale:
    label: '"סנאי"'
    summary: ="ציפור חומה קטנה שמגנה אחת מהשירים האסתטיים יותר בציפור"
    info: '{"hint":"ציפור חומה קטנה ידועה בזמר המלודי והחזק שלה","info":"סנאי הוא ציפורי קטן עם שיערחום; זכריו מנגנים אחד מהשירים היפה ביותר של הציפורים בעולם. הם נוטעים בעיקר בליל ובערבון - שם השם שלו מגיע ממנו. סנאים קרובים למשפחת החולות. משוררים מכל רחבי העולם החל מדנט'' וכלה מקייס מאחללים את הזמרה שלהם כסמל לרומנטייה ודימום."}'
  animal.ostrich:
    label: emu
    summary: the biggest bird on earth, flightless; it can run up to seventy kilometers per hour
    info: |-
      הemu鸵 הוא התרנגול הגדול והหนוק ביותר בעולם; הזכרים מגיעים לגובה של עד שני מטר ושלושת סנטימטר וחצי ומתוכם משקל מעל קילוغرמים.
      it לא יכול לעוף אלא זה המammal מהיר ביותר על פני כדור הארץ, הגורמת למהירות יותר чем七十 קמ"ש.
      The ביצות שלו הן הביצות הכי גדול מכל העופר.
      The אצבע האגודל חסר;
      there יש רק שתי אצבע.
  animal.owl:
    label: סווה
    summary: חיית ים תחתונה עם עיניים מעגליות ושמיעה מצוינת.
    info: ה сов הגדולה היא największa сова w Ameryce Północnej. עיניה של הסова אינן יכולות לזוז לכן הן מחליקות את הראש עד ל - 270מעלות . טעופתן כמעט שקטת thanks to their unique feather structure.
  animal.parrot:
    label: pastor
    summary: ფრინტას თევზობული ოჯახიდან psittacidae
    info: ארה שראולובית הוא אחד הפסטורים הגדולים בעולם עם טווח כנפי של יותר מètre. הם חיים ביערות הגשם הא열יים של אמריקה הלטינית. פסטורטים חכמים במיוחד - ארה יכולה לזהות צבעים וצורות ולספור; תקופת החיים שלהם מגיעה עד ל-75 שנה.
  animal.peacock:
    label: 雉
    summary: 雄性的孔雀有著色彩繽紛、呈放射状排列的眼睛圖案组成的漂亮扇形尾巴。
    info: '{"hint":"雉雞雄性具有虹彩扇形尾羽展示","info":"冠孔雀來自印度次大陸。公鳥（即孔雀）在求偶時會展開其尾巴——實際上是由延長的覆蓋羽毛組成的扇子，以吸引母鳥。這些彩虹般的顏色並非由色素產生，而是光線經過羽毛微觀結構折射所形成的。","label":"孔雀","summary":"擁有華麗多彩眼睛狀斑點之扇型尾部的雄孔雀。}'
  animal.pelican:
    label: פילקן
    summary: ציפור מים גדולה עם פה גדול用于 рыбаření.
    info: פליקן הוא ציפור מים גדולה עם סנפיר אופייני בצורת שקית שמשמש כרשת ל الأسירות באשכולות עד 13 ליטרים של מי ים ומעביר אותם דרך הפה כדי לאכל את הדגים.
  animal.penguin:
    label: ṭaʿan
    summary: طائر לא טעון מהגולה הדרומה, שחייסט כ טוב.
    info: הטוען האימפריאלי הוא הגדול מבין כל הטרפים; גובהו עולה על מטר אחד וחצי. חי באנקטיידה ומכניס שם ביצים גם בחום הקיץ - זכרים מחממים את הביצה בעיניפם לאורך החורף האנטארקטאי כולו. מתחת למשחה מגיעה למהירות של יותר чем קילומטר לשעה.
  animal.pheasant:
    label: בוזנט
    summary: ציפור גדולה ונשגבת; הפיקרים שלה יש צבעי תכליתיים ואורך זנב
    info: |-
      הפלורל הוא נاقل אסיאתי שהובא לאירופה אך כיום מהווה חלק טבעי בфаונה האירופאית
      הפקר שלו מאפיין צבעים עזים וגוף ירוק-ברונזה עם שקע 붉ות סביב העיניים והذנבו ארוך במיוחד
      הוא המין הנפוץ ביותר של בעלי חיים טאיירים בצ'כיה והוא构成了 היבט מרכזי בטקס מסורתית
  animal.pigeon:
    label: 홀ובר
    summary: בצבע серый ציפר עירוני וארצי הנגזר מהלובה הסקליני.
    info: הולוב סקאלני הוא אב הקדמון של כל התרנגולים הביתיים והשאבים בעיר. היה הציפור הראשונה שנכלה על ידי בני אדם ושימשה כצפר לשליחת מכתבי דואר כבר לפני אלפי שנים. יש לו תחושת ניווט יוצאת דופן והוא מסוגל למצוא את הדרך חזרה לביתו גם מרחקי מאות קילומטר.
  animal.puffin:
    label: פקרקל
    summary: ציפור ים קטנה עם מקור בצבע זהב כמו פפרונים.
    info: הפקרקלק הצפוני הוא ציפור ימית קטנה עם מקור מ색י דומה לזה של פפרון. הוא לוכד рыбы על ידי שיטוף תת המים והשאלה אחריהן באקווריום; יכול להחזיק יותר מעשר рыбы בו זמנית במקורו. הפטריות נמצאות בכמויות גדולות trên סלעים ו בתוך גזעי.
  animal.quail:
    label: קריפלה
    summary: ציפור קטנה וסודאית של אדמה המטילה את ג巢 שלה בתוך העשב.
    info: קְרֵפֶלָה שדה היא הנמוך ביותר מבין משפחת הפסנתריים באירופה. זהו ציפור סודית שאנו מקשיבים לה יותר ממה שנראה – קולה 'питі–пıt'. בניגוד לשאר הבזאנטים, זו חיה נדידה ונוחתת בקיץ מאפריקה.
  animal.raven:
    label: 渡鸦
    summary: 一種大而智慧的黑色飛禽，以獨有的喉音啼叫著稱
    info: '{"hint":"大型全黑的烏鴉科鳥類，以其聰明才智聞名（學名叫 Corvus corax）","info":"渡鸦是乌鸦家族中最大的鸟类之一，体长超过六十公分。\n它異常聪明，并且具备计划未来、玩耍以及建立社会关系的能力。\n在北欧神话和凯尔特文化里都有神秘的地位——例如奥丁有两只神鸦希金与穆宁。\n伦敦塔则流传着一个传说：如果这些鸟儿离开高塔，则帝国将灭亡。");'
  animal.roadrunner:
    label: קוכאקצה
    summary: במהרה בזויות בצפון אמריקה; סמל לסדרות אנימציה.
    info: קוקצ'קה זממית גדולה (רווד ראנר) היא ציפור משפחת הקוצ'קות העדיפה ללכת ו לרוץ על טיסה. מגיעה למהירות של יותר מ -30 קילומטרים לשעה ואוכלת נחשים, גיזelles, חרקים ואפילו יונקים קטנים. יכולה ללכוד ולהרוג כריש.
  animal.robin:
    label: ציפור אדומה
    summary: "\U0001F426 ציפור קטנה בצבע כתם أحمر, סמל חג המולד שבבריטניה."
    info: הציפור האדומה היא ציפורי קטן עם חזה אדום-כתמי שידוע בזמר שלו ועוקב אחרי גננים שמפרידים את הקרקע כדי לאסוף תולעים שנחשפות. הציפור נמצאת בכל רחבי בריטניה לאורך כל השנה ונשארת על טריטוריה שלה גם בחודשי החורף.
  animal.seagull:
    label: shahaf
    summary: Ptach chofshi shelo achilato shel adam ulam al ha'yam.
    info: '{"hint":"ptak ים אוכל פודים לאורך החוף","info":"השחף הלבן הוא אחד התרנגולות הנפוצים ביותר באירופה.\nest מתקפל ומאכל כל דבר - חי לא רק על חוליי האוקינוס אלא גם בפנים הארץ ליד 호수 y rivers.\nest thông minh và đôi khi nhớ được những nơi mà con người cho nó ăn.\nest sự quan tâm hung dữ của anh ấy đối với thức ăn của con người là nguồn cảm hứng cho nhiều câu chuyện du lịch bên bờ biển."}'
  animal.secretary_bird:
    label: bryophyta
    summary: Nonvascular plants reproducing via water-dependent sexual reproduction
    info: '{"hint":"pteridophyte","cards":[{"question":"What is alternation of generations?","answer":"A life cycle pattern where organisms alternate between haploid gametophyte stage producing spores through meiosis"},{"question":"How do bryophytes reproduce sexually?","answer":"Through antheridia releasing sperm which swim to archegonia containing eggs during moist conditions"}],"title":"Bryology Basics"}'
  animal.sparrow:
    label: וארביא
    summary: עווף קטן בגון 갈색 שחי באזורים נוכריי.
    info: הוורבצ'יק הוא אחד מהעופות הנפוצים ביותר בעולם ולוודאי בן המחבר של האדם. חי קרוב לאזורים מושבה אנושיים בהם יוצר גידול במרחבים בין חומות ובכיפת בניין. במהלך העשורים האחרונים אוכלוסיית הווארבייצקי עירוני דועכה משמעותית.
  animal.spoonbill:
    label: kopik
    summary: ציפור בורחת بيضاء עם סניף אפייני בצורות מלעקה.
    info: קופיק לבן הוא קרוב לאייביסים אך ניתן להבחין בו בקלות לפי הסניף הפלטתי בצורת מلعקה שלו. במהלך חיפוש האוכל נע סנוויתם מצד לצד במياه poco. הם יוצרים ערים ברזס וברשפים.
  animal.stork:
    label: צ'יף
    summary: "\U0001F426 ציפור גדולה בצבע לבן עם פנינה אדומה; לפי המיתוס מביאה trẻים."
    info: צ'יפן לבן הוא ציפור נסיעה הנמצאת על גגוניות ופלטפורמות בכל אירופה. היא חורשת בטבע האפריקאי הטרופי וחוזרת כל שנה למחנה同一ה שלה ומגדילה אותו לאורך השנים. הציפור מסמלת את ימי הקיץ והעדרון; בתרבות הפולנית יש לה תיאום עם הולדת ילדים.
  animal.swallow:
    label: ווארדו
    summary: חרקונט זעיר עם הזנב המפוצל.
    info: הוורדה האירופאית היא ציפור נודדת שצובעת בדרום אפריקה ועושת גידול באירופה. זהו מומחה טיסה – הוא תוקף חרקים רק בטיסות ואוכל לשתות מהسطح ללא התחמקויות. הווארדא עשויה בגגות ובמטעמים; לפי המסורת הפופולרית, קיומה בבית מביא 행운 לבית.
  animal.swan:
    label: לוויתנית
    summary: ציפור רחצה לבנה גאונית סימנת ליופי ולרומנטיקה
    info: |-
      הלויתן הגדולה היא הציפור המרחפת הכי גדולה באירופה עם טווח כנפיים של יותר מ - 2.5 מטר
      סמלת יופי, אהבה ואמותנות; זוגיות אמיצות כל חייהן
      מעיפה את ראשה ומורפחת כדי להזהירים מהתקפות
  animal.toucan:
    label: טוקר
    summary: ציפור טרופיקלית עם זנב צבעוני ומס做强
    info: טוקן ענק חי ביער הגשם של אמריקה הדרומית והמרכזית שלו הוא מזג שיניים ניכרת באורכו מעל 20 ס
  animal.woodpecker:
    label: דאטל
    summary: ציפור מצמיד את עצמה לעץ על מנת למצוא זחל או ליצור ניחוז
    info: |-
      דאטל הוא ציפור מהמשפחה פיקידה שמתאימה לקלף עץ עם מקור חזק וסاقית קשיחה כמסגרת תומכת
      השפתו ארוכה פי שלוש מאורכה וממשרת להוצאת ח벌ים מחריצי העצים שנפוחות בהם
      הוא משתמש במקור כדי להעביר מסרים ולגדר גבול טריטוריום
