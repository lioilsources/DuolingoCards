      它不能飛，但擅長游泳和奔跑迅速。
      雄性孵蛋並照顧幼鳥，而雌性則離開。
      在1932年澳大利亞軍隊輸掉了所謂與成群威脅收穫量的大雁戰爭。","label":"鸸鹋","summary":"世界第二大的不會飛行的澳洲巨鷯。"}
  animal.falcon:
