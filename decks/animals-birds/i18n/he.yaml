  animal.budgerigar:
    label: אינדורק
    summary: צפרדע קטן בצבעוני מאוסטראליה, חיות בית פופולריות.
    info: אנדולקה וונלקובה מגיעה מהיבשת האוסטרלית, שם חייה בקבוצות גדולות של ציפורים. זוהי הציפור הנפוצה ביותר בעולם אחרי הكنר. הזכרים יכולים להחקיק את קולה של האדם וללמוד מאות מילים.
  animal.canary:
    label: קנהרך
    summary: ציפור קטנה בצבע желтоватый עם יכולת לשיר
    info: קנאריק הבית בא מהאיים הקאנריים ונדומסטקי במאה ה-17. צבעו הצהוב נוצר על ידי גידול מכוון; קנהריקה בר ים הוא ירוק בהיר וחומה. זכרים שרירים שירי תווית מסורתיים; התחרות בזמר של קנאריקים היא פלא עולם.
  animal.cassowary:
    label: קסקוואר
    summary: ציפור מסוכנת ואינו טורף עם קוצים חדירים.
    info: קסקואר הוא ציפור גדול שאינו מטוס מאזור ניו גינאה וצפון אוסטרליה. נחשב לציפר המסוכן ביותר בעולם – האגרס הארוכים על המпалח הפנימי יכולים לגרום לվOUNDS חמורים. הגבורה העשויה עצם גבוהה שבקדקוד הראש משמשת כהתקןavigation ביערות הצפופים.
  animal.cockatoo:
    label: קאקדו
    summary: פראץוף לבן אוקסיאני עם סירוג צהוב מבлик.
    info: קאקדו צהוב הليس הוא אחד מהפרצופים המוכרים ביותר במשפחה הקאדואידיאה. סיברו הצבעוני שלו מתנשא כשהו מודאג או נלהב ויכול לחקות את קול האדם. ידוע על האורך חיים הגבוה של הפרט - עד שמונים שנה בשבי והינו נחשב כזיהום חקלאי באוסטרליה.
  animal.condor:
    label: 콘дор
    summary: הג'אי הגדול ביותר באמריקה עם ראש פורח.
    info: קונדור האנדים הוא הציפור המרחפת הכבדה והעפה הגדולה בעולם לפי משקל ורוחב כנפיים. זהו צייד שד啃 את גופה של יאצרים גדולים ומלאכות חשובה במערכת экוסיסטם. הוא מטפס על זרמי חום ענקיים מעל ההרי אנדי ללא התנועותขาשיות.
  animal.crane:
    label: '"jerab"'
    summary: Jerab pa'amavi merakevet me'ein tzofat hashpia u'mitzvah g'dolah.
    info: '{"hint":"ptor gadol ve''ed sheyakir lo tzafot hashpa''a shel halayla"}'
  animal.crow:
    label: ורנה
    summary: ציפור שחורה חכמה ממשפחת הגרויזיים מסוגלת לפתור בעיות.
    info: ורנדה היא ציפור משפחת הגרוזים המפורסמת בذכינות יוצאת דופן. ניתן לזהות פנים אנושיות, להשתמש בכלי ופתירת משימות מורכות. הן חיים זוגי או קבוצתי והן אוכלים כל דבר.
  animal.cuckoo:
    label: 鹊
    summary: מנצלת בית הטייה שמخبאתبيضתה בבית אחרים.
    info: |-
      ה鹊 הרגילה היא ידועה בהנזרת ההטיה שלה; שותלת ביצים באגמים זרים שם הם נחוצים ונשמרת על ידי האב המאכילים。
      The צלע של קוקו מנקז את הביצה והחיילונים האחרים מהבית.
      The קריאה הדו תונטית "קוקו" מסמלת את הגעת הקיץ.
      The הזכרי מתבקעים וTHE الإناث פולטות טון רם.
  animal.dove:
    label: ג'וּלְבוֹ
    summary: סמל של שלווה; ג'לו
    info: |-
      ה голובית הלבנה היא סמל של שלווה מאז העתניקה; בביבליה הביאה את עלה האוליב לנח
      בכינство הסимвולה רוח הקודש.
      The鸽子 is actually a domesticated rock dove; its pure white coloration was developed through selective breeding.
      Releasing white doves has become part of ceremonies and celebrations around the world.
  animal.duck:
    label: GINEST
    summary: "\U0001F426‍\U0001FABF עוף רטוב עם פה רחב; זכרים (קצר) יש להם הראש בירוק."
    info: ג'ינס ווילד הוא המין הנפוץ ביותר של גינה בעולם ואב הקורה מרבית הסוגים הרגילים בבית. הזכרי (קצער) בעל ראש ירוק לוהט במיוחד, והנקבה בצבע חום מתון יותר. הן קנים דבלות ש먹רות על פני מפלמי מי ים ולא צוחקות.
  animal.eagle:
    label: אורל
    summary: עוף טורף גדול עם מקור עקומה ונראות חדה.
    info: האorus לבן הוא סמל לאומי של ארה'ב והוא אחד היריות הגדולים באמריקה הצפונית. הוא נוהג לדוג דגים אותם תופס בזנבו החודר ממים באמצעות קוצים חדירים שלו. הרחבה כנפיו יכולה להגיע למטר וחצי ובערך שניים, והם חיים בטבע עד גיל העשרים.
  animal.emu:
    label: 鸸鹋
    summary: 세계에서 두 번째로 큰 비행할 수 없는 오스트레일리아의 대형 조류입니다.
    info: |-
