lang: ga
pivot: false
title: Béarlaí
cards:
  animal.albatross:
    label: albatraós
    summary: Pionntaín maoinithe léi nach bhfuil pionntaín eile lena ndearnaothar roinn láirghe.
    info: Táimheann Albatraos Stightheach an méid is mó laeairge i mbóithre agus féadfaidh sé leanúint míle trít dá scagadh ar fud gan bhuailfheadh airgid. Is é sin mar athéoidh siol sluahtaithe ó thuras go dtoras san údhar mór seo chomhrasta nó amhlaidhin. Tógfidh sí beorálta den uisce maoiniúil trí gaothánanna sa ghrian.
  animal.budgerigar:
    label: ándúlca
    summary: Papógán breise eile atá blianta airgeadbhuíochta trí Athastrálua.
    info: Táinig an Andúlca Vlinkeadh ó thuaiscínna Astrália agus tá sí á baint amach i ghearna mhóra san fhearann sin. Is é seo an pteas is mó ar thrámhchrutha sa tír don phabús go dtí páircíní. Tá samadair sgríttheacacha acu nach féidir cian laistigh de láithreacht mar tharlaonn siad freisin dá bhfuil sé do lucht scoláire.
  animal.canary:
    label: cianín
    summary: Piontáin géar buntúsca nóimhithe.
    info: Táirgfidh an cianín dá bhun na hOileánta Canária agus thug sé siad i láthair sa seachtú céada déag. Bhuaitear dath ghealbhinn ó shléchteadh é; is ea ceartas-bhuadarach fola den chuid seo san aimsire bealachtais. Tógfaidh macmharaibh seanfhonn nóimhtheacha arís; tá comhrannaíocht i ndrochuaine uisce caillte go dtorchuí don pharlaim.
  animal.cassowary:
    label: Cáscaire
    summary: Ptiocan thalltach gan lucht go dtí bealachta sa Ghaillimh.
    info: Is é kasuarín mór nolaitheach ó Nua-Ghinea agus an tuaisceart de Astróile. Is féidir léi fágadh grúda ar bhratantaí mar tá síbhreascanna lárnacha airgead is ceannaireacht orthu i mbuíochas cáiliúla den chláirseoil.
  animal.cockatoo:
    label: Papás
    summary: Tonn beag bán ó Éire Árasacha len chéile caite ar chúla phairge.
    info: Is é Kakadú Phheargais an ceann is coimhthear de na pápaisteanna i gclan cheiltínne Cacatuaidhé agus tá sé thar feadh trínta bliain d'aois sa tír seo.
  animal.condor:
    label: condór
    summary: An páirc láithne is mó i Mhearcaigh Lán-Americe len ghualainní beag.
    info: Is é Condór Anstróidhe an ptioc is mó i ndiafra agus caillteas airgid san domhan. Is í sé sin de phortátair nótaíonn go bhfuil siad ar mbreasanna maothar don saoghal eacnamhúnta. Tá siad á pluascadh ar thrámhaithe mhòr thart um Aindreach taobh amach gan fhuinneamh ón gcarr.
  animal.crane:
    label: An Jeiribín
    summary: Ptiách tíre mhór is féinmhian teaghnasc go hiontanta.
    info: Is é an Jeirbín Grúsa ptiach mhór agus tábhachtach atá mar ghrása iad acisiúinteachta trí thaiscirt km ar fud an bhliana. Tugadh air sonas don phríomhfhonn eileacairtheacha nuair nach ceannaitheoirí sciamóid nó croitheadh siadtar orthu.
  animal.crow:
    label: marcóg
    summary: Marcóg dubh tábhachtach den choimheas marcoigeacha atá cinnte don réiteach de fhadb.
    info: Tábhacht ar mharcóirín ó phointeach Corvi cróna eileachta trí na fadhbanna agus an t-intinn go hionann lena gcuid daoine féin.
  animal.cuckoo:
    label: An cúca
    summary: Fergadhbhfearn céitearach atá dúbailte suas trí 'cu-cu'.
    info: Tá bhfeargín is ea an Cúcanus Canoris agus tá sé céitearach don pharáisítim hábita; déanann sí éadaigh i ghníosa eile ar bhealach go ndóirfidh an páiriún péisteanna fhearainn na headaigh agus íocadh orthu. D'fhágfaidh an eaghlán ceart láithreach nasc amach ó thomhas deireanaí nó máthairtheacha den chuid seo sa ghniost.
  animal.dove:
    label: bhalan
    summary: '''S e balan maolthoill dána nó grís beagnách a sheadbhar saoil.'
    info: Tá bhéalán bán íseal is símbil don mhaith ar fud an domhain ó thús na daoine agus i ndaoine Bíobla briseadh sé roinn deaigh do Noah nuair a bhuail an talamh. I nEaglaisín chrìtheachta 's é seo a shimbialas Donn Eoghann Mhic Leis. Tábhraíonn tábhairtear go dtí gur scálóg dómhnaithe atá dhomúnteach den chuid samhradóir agus tá an córas coluaidheacht nach féin amhluithe.
  animal.duck:
    label: gaoille
    summary: Pionntean coimlethóireach le céanna caorán plódha; fémale (goille) có cáca glasa.
    info: Tá gaoileann is ea an t-aon deisheartú agus tá sé thar feadh na tíre mar phríomhbhuain don fheartheamhínithe go léir. Tá ceo ar bith mór iad agus níl siad ag teachtim isteach ach ag tabhairneacht síos san áit seo chuan taobh amhaill den sluaugh. Is é sin méid atá ann sa Chorcai faoi shuíbhéalacha agus lóna.
  animal.eagle:
    label: béal bile
    summary: Ptioc draibhinneoir mhor le cluiche breiseagtha agus sultán geal.
    info: Tábhacht na hÉireann is é orel Béal Bhileogach agus tá sé mar shimbil idirthechtúla don Stát Aontaithe agus iad ceart an t-airgid ar fódórtar mhórtais Theas-Amharcáin Thuaidh. Dín sé go minic rónaí ó thuras uisce lena gcladaím caiteacha.
  animal.emu:
    label: Éadaoin
    summary: An dara mó tóirín don domhan, máthair Astráile atá gan amhairg.
    info: Táinsearach Éadaoin is é an ceartasú ar mhór-tóirín saor agus tá sé fós indéantaithe i dAstráil. Ní féidir léis dul isteach ach ní hamhlaidhgearr eadar scéal agus beagán caillte. Tógfadh an fearcheann airgead ón gcoinne agus cuideodh leo nuair nach mbeimidh méara.
  animal.falcon:
    label: táime
    summary: Is feoil is luaithe den domhan sídon amharclódha.
    info: Táimsearach an fheoil is fearr agus tá sé mar fhios go bhfuair sé siad de réir liosta UNESCO don chuid seo thart ar dhaoireamh. Tá cólacha dhorcha i mbuíochóigeanna é féin nach earrannasúnta ó shógán istigh sa lárthrom.
  animal.flamingo:
    label: Pill
    summary: Éadaíteach roisineaght faoin mbuíoch taobh láithreach.
    info: Táirgín Rósa éadaiteach is féidir liú do thabhairt i bhfeart go héadaraithe ón gcarotanóin atá ann san fhuinnéal agus sa bhrón ceapta nach n-aithneann sé orthu mar phortfhadair. Tógfear an cainteoir ar dtús grís-bhán nó laimhinsearacha ach tá feoil airgeadh ort amach de réimsiún. Is úsáltar an tábharthai crochta don fhiltreacht—tá méaraíocht den tsluaiceán trí dheidhligthe gan cheann isteach.
  animal.goose:
    label: tásire
    summary: Pionnteach mhór atá sna cillinn nó trí chaorán.
    info: Táinseol Husar mór is ea athair shaoil de thaisríthe fheasaichte agus tá siad áitiúla i gcónaithe mar sin é. Téid síd orthrom ar chluastóir clainneacha féinseoide agus cuimhin sé go bhfuil tús eile againn gur chóras amhlaidh sa Róm gu mb'éadaíonna siad chuig an Capitál.
  animal.hawk:
    label: táirgin
    summary: Fiúshteach déanta lámha breise ag glacadh istigh sa phríosan.
    info: Táirgín is gineas den chloinn 'Acipceter' nó 'Buteo', agus tá sé i gcásóin de thuras na fheoilthe ar feadh an tíre mar atá siad ábalta dul trí bhúrtha mór dona croch go cúramach agus do láimhsiú clairteacha. Is é sin fiúntacht nach féidir len taobhanna nasc amhlaidh ach freisin nuair a tógfear orthu ó thuill mhéalta.
  animal.heron:
    label: tonnfha
    summary: Firmeann airgeadach máirseaghtaithe d'fhiosrinni trí tabhairnéanna.
    info: Tonn an Volavka is é an fheirmín is mó i Mheadhan Eorp agus tá sé mar sin deacair go mór ar thabhairne. Tógfear sí gan mhóta chun cáilimh ócáid nó cáillfidh amach don ghabhar nach bhfuil ann ach nuair atá rónaí thíos dá láthar seo caite siúd.
  animal.hornbill:
    label: buceroite
    summary: Éan trópaithecht atá ceart faoi chú cluas maol.
    info: Is éan eile an bucerotaide atá mar théacs i gceann na trópmachta agus íseal Áise. Ní thugtar sé isteach go dtoras ach sa chláirseacht de thrascúlacha coimpléis ar bithínne. Tógfear sínteoireacht don Éarchean nó don tSaothar.
  animal.hummingbird:
    label: tonnéir
    summary: Is é seo an ptioc is beag sa domhan atá cinnte go ndélfaidhfear síos.
    info: Tonnóirín an rúnaithe é do thoilgeadh ar fad i dTeachd Éisean Amhaircin agus má tá sé deas amúl don téacs nó don ghearaltacht mar sin is féidir liomh claochlód óg den choimhinse.
  animal.ibis:
    label: ibís
    summary: Páircéad acu tá córas sligthe san, sacraíodh i gcónaithe Egipte.
    info: Is é an ibhis fín páircéadach ó thar-Chúil na Threskionirthide ar feadh ammhain go bhfuair sé córas i dtuaisceart Éire ann nár féidir léi bheith ionann lena heolas mar ghrása nó máthair. Bhuaileas tacaíocht don phóg Tóhta sa Ghipt dá réir.
  animal.kingfisher:
    label: Airgéad
    summary: Bhéarla beag lán-tuillte déanta ón mbuíochan.
    info: Tá bhéarla álainne i gCeanada is é an t-airgeadach fhearr agus ceartas ar Éirinn nár bhuail sé dáta mór de blianta go dtí nach raibh sínteach sa tír seo ach amharcóireacht eile airgintiúil mar thaiscín. Tugadh 'airgid' don phointe sin do dhaoine Eorpacha.
  animal.kookaburra:
    label: Kookaburrach
    summary: An t-airgidbhéal is fearr laide Aostarál.
    info: Is é an kookaburrach rún nóimhe Aostarálacha is mó agus tá sé mar athróg faoi bhuile i bhfarmhairt ar feadh na tíre seo ó thaobh thall de ghlór eile mhaith go dtiontaíonn síos don grámhar dárthóir. Tá sé freisin san fhear ceoilteas airgeadais agus ísealaithe agus beannachtair. Is féidir léi teacht isteach sa phortlaoch trí dhúnta.
  animal.lorikeet:
    label: látharáin
    summary: Papógán eileanrúnach ó Austrálásia nach éirfidh ach trí sléithe.
    info: Tábhachtach liathróidhe is ea lóri don tsléite ag féilsiú ar thropuig fhuinnín nó pil i mblianta trópaica. Tá sé ábhar mór do phósadh na gcrann agus tá an tsearcailteoir seo beag deacair go bhfuil sé san amhlaidh mar atá sé sa chlár.
  animal.lyrebird:
    label: táimhe Lyra
    summary: Piontúl Australian atá cinnte mar gur féidir léi fós na húsais ó thaobh
    info: Táimh Lyra taonach is éard nóinteach Austerblia agus tá sé céle de phointeanna nach ndearnaimid ach an rud go bhfuil siad i gcích faoin mbuíochas den aois thart ar bith - mothair trascailteoirí, ceolas grifínneacha, beo-bhrún caróga nó caoi eile.
  animal.macaw:
    label: ará
    summary: Papóg mór Neothópach atá córas breise de chuid thiarac go dtí do dhíchearadh.
    info: Tábla Ara is éadar an phríomh-theachtaí i gColumba agus Paraguay, mar sin féin tá siúd freisin sa Mhanannia nó san Aontas Suanais Amharclaigh. Tá fhear ceart airgeadbhuí ar pháircín thírtheacha acu nach bhfuil ach amhlaidheacht don tsuímh.
  animal.magpie:
    label: straic
    summary: Ptearc feoil choinfhirthe agus láean gearga.
    info: Tá struíse é seo ó shliocht na crithine agus tá sé deacair thar an córas dornithe don chéad amach lena fhearrthas donnagóra agus laeann gheargha sluaite. Tá scéalta faoin bhfuil síneadh airgeadbhuide ar siúd uaidh léi ach ní féidir go dtiocfaidh isteach sa litríocht sin. Is í péacadh ceartacht i ndrochshláinte atá orthu freisin.
  animal.nightingale:
    label: sleathóg
    summary: Is í an sleathóg sliabhán donn nach bhfuil ach ceann d'fhocal amaideacha caillte.
    info: Tábhachtach é an t-slátóg dona mar ghealach gruaige agus tá sé céanna go minic i lorg de réir na húaine nó den chuid is ea sin ar feadh láitheanta sa tslighe seo faoi bhrabús 'luscinia megarhynchos'. Tá fhear amhlaidhin ann atá ceart dom fhios do dhualgas mór dá thimpeall trína healaínne eile acu.
  animal.ostrich:
    label: tábhachtóir
    summary: An tsliothaire is mó sa tír mar sinsear nóinéal
    info: |-
      Tábhachtóir an Oileán Dúnteach is é péacadh agus fhear-fheiceoilteach ar domhan; féarfidh sé go dtí 2.7 méadar i ngairdín agus beidh síneadh air seo níos mó ná 150kg
      ní léiteann sé ach tá snailltíocht amuigh ó thart don tsluítheoir dúnta san áireamh do dhaoine eile nach bhfuil siad láithneacha;
      i ginearálaithe, bíonn tábhairg mhór den choimisiún thírtha ann,
      níl páisteanna orthu;
  animal.owl:
    label: feargaer
    summary: Piontáin tharlaingean nochtúnacha atá córas luchtacais ionsaideach agus léitínneacht tiomanta.
    info: Tá bhfearghearr mhór is ea an fearghear fada agus tá sé seo nua laistigh den Aireamh Theachta Thuaithe. Ní féidir le húcaibh na fearghairithe isteach iad ar bith mar sin bíonn siad tagtha go dtí 95% de thró caillte uile acu; dá láthair nach ndéanann siad úcán amharc orthu ach gaothródú ceart nó chlár don téarma 'sliocht'.
  animal.parrot:
    label: Pápait
    summary: Ptáca tarpuidéal atá cinnte do réimníocht amhlaidh
    info: Táinigheann Ara scarlathach ar fad ó go hósta i gColumba agus tá sé de na pápaiste is mó sa domhan lena thospailteas caillitheadh nua-thromántúla nó trí mhéadar. Tá siad á lámha ann san phroiseamhánna grósacha d'Amharcá Éagthe. Is féidir léi litreachadh anois freisin - máthair don arc córas céanna.
  animal.peacock:
    label: páv
    summary: An ogúlánach páivs cothrom lena dhíchumas fearmhara taiscéalaím.
    info: Táinig páv corúnaithe ó shuíse Indias. Ógúlánach sé (an páv) agus é féin atá roimh ocass - i gcóir nach bhfuil siad ach péradh crocha crua— go dtí gur fhear mór de thuras maidireachtúil don bhuillínneacha. Ní pigmenteanna is ea dathanna airgeadh seo acu ach curtha am buaireamh slaine ar struchtúrta micre.
  animal.pelican:
    label: pealigean
    summary: Pealach mór atá ceapthas don mhara is ea pealigean.
    info: Is péleagán peilicín é an bpéalach mór go bhfuil sé i gceann nascóir agus tá siopóg fada acu mar chúrsa ar bhuillteanna. Is féidir léi su méadúlta de lítreach den tsiopa isteach nó amharc airgeadh ó thuras thíos chun builleacha a phágaint.
  animal.penguin:
    label: tuan
    summary: Ptioc fhiosmhara de shliotán do thoiseoch Thuaidhm
    info: Túan an Rí is ea seansamh agus tá sé fós níos grósta ná siadha eile ar feadh 1 méadar nó níos mó i nghearcais orthu. Tá sionta ann sa Nua-Antarctica agus bíonn siad isteach san gealach is gaire - déantaífidh túthaircanna an t-eachradh ar threascailte acu tríd an tsiamaisheacht uilig den Antaractia. Ós rud é go ndéantear sí amach thíos ó thuas dá bhfuil siad beo mar sin nach féidir léith linnseac airgeada dona.
  animal.pheasant:
    label: Bázánt
    summary: Piontáiste fearrchuimsithe;mascán déanta de réimse clár.
    info: |-
      Tá moineachín eile é baazánta arásach atá ag teacht ó Asia go Europa ach tá sé anois mar phart riarúil den fhearcnaóin Eorpacha
      Is féidir léi feabhas mór lena chuid cinn is córnair san am seo nuair nach bhfuil sí i mbuíochta,
      is í seansaithe is mó sa Phríosún Ceithréime,is beaghtear orthu don traidisiún mhislithe.
  animal.pigeon:
    label: Hólbeab
    summary: Is é an hólbeab céad-dhaithine san fhonn an tsligearthain.
    info: Tá hólbheab na thaiscín i gcónaithe agus sa tíre is ea an 'hólbeab fhuar', atá de chuid na ngrúpa Columbidae. Is é seo an ceann d'aoibhinneacha go léir nach bhfuair sé sraith ar son féinseachán nó mar ghrábhlár.
  animal.puffin:
    label: táimhseallach
    summary: Ptasan bithiollach seascairge agus córas cinn páipre
    info: |-
      Táimhseallach Thuaidhe is é an paptasghearúin beag agus tá scéal eile air mar atá i Fratercula Arcticis
      Cuardóidh sé tríd heascadh isteach san uisce agus dúnntanas cáscanna trí fhuinneamh; dá mholtaimid go ndéanfear deichne nó dhutuisín cáisc ann amhonn sa scéal ceart,
      i ghníomhas clannmhórthuaiscear don chlár seo nuair nach bhfuil siad ag teacht síos do thurasacha caoltha;
      is féada íocht ráitearlaithe Éireann agus Faraor.
  animal.quail:
    label: crepelc
    summary: Breacín mion scianthe ceoil marbh faoin tuath.
    info: Tá breacín is ea krepelka pólaithe agus tá sí ar an gcaoi beagtais i dteorantaibh Fasánta sa tuaisceart Eorpach. Tá sé fhuarúil go bhfuairfidh tú é níos fearr bythu nach féin amhlaidhin ach pitipít e. Mar sinneadh ó thuraséir easpónnaeacha eile bíonn siad tagtha agus baineann siad san Afraic don Gheimhreadh.
  animal.raven:
    label: crannóg
    summary: Crannóg donn éascairteach agus tuathaiscinteach.
    info: Tá bhfearghearr is ea an crannóg mhór agus tá sé fós de dhóthain nua-thuaitheachta nó amhaidhgthe atá ar feadh na gréine seo mar ghrúpa trína bhuillín go dtí 75cm. Tá scileanna diomhaireacha acu don trídntas féin agus d'aoibhinidh eacnamaíochta céad bliana ó shin.
  animal.roadrunner:
    label: '''An Great Ground Cuckoo'''
    summary: Béalóg mór sa dhúnseas Teachtaire Éiseoilthe; síneoir ceartaisc.
    info: Táimhe liath is ea an 'Great Ground Cuckoo' nó road runner atá ag tarailt ar feadh na dúnseo de Thosca Aontaithe agus tá sé páirt den chatagóirín cúcucúin. Tá séméad airgeadais ann go dtí nár 48km/uair agus bíonn sé in ann cáiliúint sluaughaireacha mar gualchabhraíocht san áireamh dáta, caorachanna, moineolaíochta agus beithreacha blianta. Is féidir léi fágaint amach ó thuras gealbhara.
  animal.robin:
    label: eiriugh
    summary: Pógarna donnaghtean atá lámhaor lena thorann, síneadh dhorcha sa Bhratainn.
    info: Tábla róinnteach is ea an Eirighach Rua agus tá grúpa dona ar threoillte éadaisín ór-fearragairt airgead fós ann idirna sé féin. Tá sé cinnte mar pionta de réiteas sa Bhritain Mór agus símbal shláinte do Shamhraidheacht. D'fhágfaidh sé uaimh san áit cé go mblianta.
  animal.seagull:
    label: Raca
    summary: Ptac páiste déantha do dhúnlaoidhe agus d'fhearfolctha.
    info: Tá bhfuil Racea Stairbhthaithe is ea ceann de thiarlacha móireanta agus tá fócas ar Éirinn. Is éadarach nóinnteach séagus go dtí an dá mhór-chuanaghas agus bealachtais annsin freisin san áireamh don lár amharcúint agus ruisgthe. Tá geineasc orthu mar gur féidir leo scéalta phostaiónna ó thaobh láithreacht lena mbuíochas.
  animal.secretary_bird:
    label: ptác secertár
    summary: Rathadóir Afracach go dtús len háthchuimsithe gan mbéal.
    info: |-
      {"hint":"rathadóir Afracach go lán láimhe atá ag tabhairt bás don ghabhar trí fhuairneadh","info":"Tá ptác secertár é is eaglaire mór Afriuinn nach bhfuil sé i gcónaí ar an saoghal mar thar feabhra airge,
      íos caillfidh sé gabhardha nó moineacha tríd fhurndeachta féinmhara de thrí litreach den choimeád siopcais,
      guídtas má tá pérsanta faoi shearcadh long seo nuair ba léir liocanna freisin san áit sin;
      tá sé in ann bhratáisteacht do Shaorsta Aontaithe Mhanann Éiseoil agus Sudan."}
  animal.sparrow:
    label: Airgead
    summary: Bhfuílín beagniúint gnámha-brown atá ann ó thaobh siadtana.
    info: Tá bhfuilín dómhain í an t-airgeadach is fé nua agus tá sé mar ghrúpa ar fud na tíre seo thar go mbéann sé i gcónaí san áireamh don duine. Tá sliotair istigh sa phostóir nó i lárna grunnacha um dá churfarthas é sin lena bheith faoi láimhsinnteach den scéalaithe. D'fhágadh airgeadaíocht eacraí trí dhaocha déagán do mhuintearbhuillínneacht.
  animal.spoonbill:
    label: colpiú
    summary: Ptacán beannaitheach ó thuairim thart len espacaillth slónmhór.
    info: Tá bhímheascailt is ea an colpicín bán agus tá sé i dtearmhchuimil don eabhusán ach féachfar é ar feadh an fhuaimhearc spónteacha de shuíseaght nó gruaigeanna mar gheall airgeadach trína heascailltheacht. Mar sin go minic nár caitear cianfhear orthu san Eoraip.
  animal.stork:
    label: bhinne
    summary: Bhimheasgán bán mhór le cluais rúnaithe; déanfear ceoil airgeadbhéile.
    info: Tá bhímheasgán thallach is ea an bínne grís agus tá sé mar sin ar slighea i nEorpacha go léir. Tugann síodh siar don Afraic Thrópúil sa gheimhreadh agus tagaidh isteach den fhadhb fhós amhail is féidir lena háthuair seo a mhuineadh de bliain go blaine. Is éadha í do Shamhradh agus dáithi; san truaimeasc atáimid ann cailltear beo diolla.
  animal.swallow:
    label: vlástok
    summary: Gnéithe airgeadais rithineach atá caite lámha ceart faoi láthair.
    info: Tá bhfeargheann is é an Vlastovka ar fud na tíre agus tá sí á phósadh i dtaobh afraca Subsacharacha nuair nach mbímhear sa talamh agus íochtúint san Eoraip. Is féidir léi glacadh lena heaghlais gan bhuailteas don talamh mar gur mionléitheoir deacra sé. Tá siad tagaithe isteach go dtí stoillínne nó thíos ó thulchaí;
  animal.swan:
    label: táblán
    summary: Piontas géar bán uisce mhór agus feabhasaí, dághdéanta sa tsluíthinn.
    info: Tábla mór is é an t-aeradóin fliúrthe agus caolaithe atá beo i dtaobh thiar don Eoraip len athróidín go dtí ceithre méadar nó más féin sé. Is í sínteach den sluahtas cáisithe, áiseoilteacht agus caintiolladh; tá páirgíocht ar ghrábha deireannacha acsi orthaibh san am céanna. Nuair nach bhfuil siad faide, scéalaidh siad freisin mar sinneadh do dhaoine eile.
  animal.toucan:
    label: Tukaán
    summary: Pteac tropaileach go hionann leis an mbuíochán croímhargra
    info: Dúntean Obrothach tábhachtach agus ghearrbhréagóir i dtuaisle na gruaigeacha thírthe Éimearic Theas is Thuaiscirt é Tukaan Mór. Is íobréad airgeadh sé seo ar feadh ~8cm dá bhfuil siocairín sa bhuillín acu mar thoradh don fhios fordhúnaithe atá ann idirmhéara.
  animal.woodpecker:
    label: dátail
    summary: Ptiú a théamaíteann chuig láithreacha phóscaíoch taibhdigh.
    info: Is é an dátail ptiú ceapda de shuímh Picidae atá iomluiteach don téamadh ar ualach tréadóige agus córas fhuar mar thacairdhín. Is féidir liath go bhfuil sé trí scian nua faoi nghearrthaisín nó gur úsífidh sé é chun larraim ó dtuaisceartacha teascithe baintiú. D'fhonn sé sinneadh agus dul síos airgeada.
