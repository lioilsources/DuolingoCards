# Czech — PIVOT language. Author info+summary here, fact-check, then translate
# into the remaining 19 languages.
lang: cs
pivot: true
title: Ptáci

cards:
  animal.eagle:
    label: orel
    summary: Velký dravý pták se zahnutým zobákem a ostrým zrakem.
    info: |
      Orel bělohlavý je národní symbol USA a patří mezi největší dravce
      Severní Ameriky. Loví hlavně ryby, které chytá přímo z vody svými
      ostrými drápy. Dosahuje rozpětí křídel přes dva metry a dožívá se
      v přírodě přibližně 20 let.

  animal.owl:
    label: sova
    summary: Noční dravý pták s kulatými oči, tichým letem a výborným sluchem.
    info: |
      Výr velký je největší sova Severní Ameriky. Oči sov jsou nepohyblivé,
      takže místo nich otáčejí hlavou až o 270 stupňů. Jejich let je
      téměř tichý díky speciální struktuře per. Loví za tmy pomocí
      výjimečně citlivého sluchu.

  animal.penguin:
    label: tučňák
    summary: Nelétavý pták z jižní polokoule, skvělý plavec.
    info: |
      Tučňák císařský je největší ze všech tučňáků; dosahuje výšky
      přes 1,1 metru. Žije v Antarktidě a snáší vajíčka v největších
      mrazech – samci zahřívají vejce na nohách celé antarktické zimy.
      Pod vodou dosahuje rychlosti přes 30 km/h.

  animal.parrot:
    label: papoušek
    summary: Barevný tropický pták schopný napodobovat zvuky a lidskou řeč.
    info: |
      Ara šarlatový je jeden z největších papoušků světa s rozpětím
      křídel přes metr. Žije v tropických pralesích Latinské Ameriky.
      Papoušci mají mimořádnou inteligenci – ara dokáže rozpoznat barvy,
      tvary a počítat. Dožívají se až 75 let.

  animal.flamingo:
    label: plameňák
    summary: Růžový brodivý pták stojící na jedné noze v mělkých vodách.
    info: |
      Plameňák růžový dostává svoji charakteristickou barvu z karotenoidů
      obsažených v řasách a krevní, jimiž se živí. Mláďata se rodí
      šedobílá a barví se až postupem času. Zahnutý zobák slouží jako
      filtr – plameňák filtruje potravu z vody postavením hlavy dolů.

  animal.toucan:
    label: tukan
    summary: Tropický pták s obrovským pestrobarevným zobákem.
    info: |
      Tukan obrovský žije v deštných pralesích Střední a Jižní Ameriky.
      Jeho nápadný zobák je přes 20 cm dlouhý, ale velmi lehký –
      je tvořen vzdušnými komorami. Slouží k regulaci tělesné teploty,
      trhání ovoce a jako vizuální signál pro ostatní tukany.

  animal.peacock:
    label: páv
    summary: Samec páva s nádherným vějířovitým ocasem plným barevných ok.
    info: |
      Páv korunkatý pochází z indického subkontinentu. Samec (páv)
      roztahuje svůj ocas – ve skutečnosti jde o prodloužená krycí péra –
      do vějíře při namlouvání samic. Iridiscentní barvy nevznikají
      pigmenty, ale ohybem světla na mikrostrukturách per.

  animal.hummingbird:
    label: kolibřík
    summary: Nejmenší pták světa schopný vznášet se na místě a letět pozpátku.
    info: |
      Kolibřík rubínohrdlý je jediný druh kolibříka pravidelně hnízdící
      ve východní části Severní Ameriky. Mávne křídly až 53krát za sekundu,
      čímž vytváří typické bzučení. Živí se nektarem a drobným hmyzem;
      srdce mu bije až 1 200 krát za minutu.

  animal.crow:
    label: vrána
    summary: Inteligentní černý pták z čeledi krkavcovitých schopný řešení problémů.
    info: |
      Vrána je pták z čeledi krkavcovitých proslulý výjimečnou inteligencí.
      Dokáže rozpoznat lidské tváře, používat nástroje a řešit složité úkoly.
      Žijí v párech nebo malých skupinách a jsou všežravci.
      V české mytologii bývají vráně přisuzovány mystické vlastnosti.

  animal.pigeon:
    label: holub
    summary: Běžný šedý pták měst a venkova, původem skalní holub.
    info: |
      Holub skalní je předkem všech domácích a zdivočelých holubů ve městech.
      Byl prvním domestikovaným ptákem; sloužil lidem jako poštovní holub tisíce let.
      Má výjimečný navigační smysl a dokáže najít cestu domů z vzdálenosti stovek kilometrů.
      V kulturách celého světa je symbolem míru.

  animal.sparrow:
    label: vrabec
    summary: Malý hnědý zpěvný ptáček žijící v blízkosti lidských sídel.
    info: |
      Vrabec domácí je jeden z nejrozšířenějších ptáků světa a věrný průvodce člověka.
      Drží se v blízkosti lidských sídel, kde hnízdí ve spárách zdí a střech.
      V posledních dekádách jeho populace ve městech výrazně klesla.
      Pro Čechy je vrabec symbolem obyčejnosti a přizpůsobivosti.

  animal.robin:
    label: červenka
    summary: Malý ptáček s červenou hrudí, symbol Vánoc ve Velké Británii.
    info: |
      Červenka obecná je malý zpěvný ptáček s typicky oranžovo-červenou hrudí.
      Je nenápadně odvážná; sleduje kopající zahradníky a sbírá odhalené žížaly.
      Je národním ptákem Velké Británie a tradičním symbolem Vánoc.
      Zůstává na svém teritoriu celoročně a zpívá i v zimě.

  animal.duck:
    label: kachna
    summary: Vodní pták s plochým zobákem; samec (kačer) má zelené hlavy.
    info: |
      Kachna divoká je nejrozšířenější druh kachny světa a předek většiny domácích plemen.
      Samec (kačer) má charakteristicky lesklou zelenou hlavu, samice je nenápadně hnědá.
      Jsou to dabující kachny, které se živí potrahou u hladiny, nikoli potápěním.
      Kachna je v Čechách nedílnou součástí rybníků a říčních toků.

  animal.swan:
    label: labuť
    summary: Velký elegantní bílý vodní pták, symbol krásy a romantiky.
    info: |
      Labuť velká je největší létající pták Evropy s rozpětím křídel přes 2,4 metru.
      Symbolizuje krásu, lásku a oddanost; páry si jsou věrné na celý život.
      Bezděčně nadzvedává zobák a nafukuje peří jako varování útočníkům.
      V pohádce H. Ch. Andersena je labouť symbolem proměny ošklivého kachnete.

  animal.goose:
    label: husa
    summary: Velký vodní pták stěhující se v klínu; hnízdí na zemi.
    info: |
      Husa velká je divoký předek domácích hus.
      Stěhuje se v charakteristickém klínovém formátu, v němž ptáci střídají vedoucí pozici.
      Jsou velmi teritoriální při hnízdění a nebojácně brání mláďata.
      V historii střežily husy Kapitol v Římě, kde svým křikem přivolaly poplach před Galy.

  animal.stork:
    label: čáp
    summary: Velký bílý pták s červeným zobákem; přináší prý děti.
    info: |
      Čáp bílý je tažný pták hnízdící na střechách a tyčích v celé Evropě.
      Zimuje v tropické Africe a každoročně se vrací na stejné hnízdo, které rok od roku zvětšuje.
      Je symbolem jara a fertility; v lidové tradici přináší děti.
      Česko je jednou z nejvýznamnějších zemí Evropy pro hnízdění čápů.

  animal.heron:
    label: volavka
    summary: Vysoký brodicí pták číhající nehybně na ryby u vody.
    info: |
      Volavka popelavá je největší středoevropský brodivý pták.
      Stojí nehybně jako socha a čeká, až ryba připluje do dosahu, pak bleskem udeří zobákem.
      Dokáže spolknout ryby a žáby celé.
      Létá s krkem zahnutým do tvaru S, čímž se liší od jeřábů, kteří letí s nataženým krkem.

  animal.crane:
    label: jeřáb
    summary: Velký tažný pták proslulý tanečními rituály a mohutným křikem.
    info: |
      Jeřáb popelavý je velký tažný pták migrující každoročně tisíce kilometrů.
      Proslavily ho taneční rituály, při nichž páry skáčou a rozkřídlují se.
      Tahnou v obrovských hejnech přes Česko na podzim a na jaře.
      Jeřáb dal jméno stavebnímu stroji.

  animal.ostrich:
    label: pštros
    summary: Největší pták světa, nelétavý; běhá rychlostí až 70 km/h.
    info: |
      Pštros dvouprstý je největší a nejtěžší pták na světě; samci dosahují výšky až 2,7 metru a hmotnosti přes 150 kg.
      Nemůže létat, ale je nejrychlejší dvoukopytník na světě, dosahující rychlosti přes 70 km/h.
      Jeho vejce jsou největší vejce ze všech ptáků.
      Protistojný palec nohy chybí; má pouze dva prsty.

  animal.emu:
    label: emu
    summary: Druhý největší pták světa, nelétavý australský obrovec.
    info: |
      Emu hnědý je druhý největší pták světa a endemit Austrálie.
      Nemůže létat, ale je zdatný plavec a rychlý běžec.
      Samec sedí na vejcích a pečuje o mláďata, samice odchází.
      V roce 1932 prohrála australská armáda tzv. Válku emu proti hejnům ptáků ohrožujících úrodu.

  animal.pelican:
    label: pelikán
    summary: Velký vodní pták s obrovským vakovitým zobákem na rybaření.
    info: |
      Pelikán je velký vodní pták s charakteristickým vačkovitým zobákem sloužícím jako síť na ryby.
      Do vaku pojme až 13 litrů vody; vodu vytlačí a ryby spolkne.
      Letí v aerodynamických formacích a využívají vlny vzduchu vzájemných stoupavých proudů.
      V křesťanské symbolice je pelikán symbolem obětavé lásky.

  animal.puffin:
    label: papuchalk
    summary: Malý námořní pták s barevným papouščím zobákem.
    info: |
      Papuchalk severní je malý tučňákovitý pták s barevně pruhovaným zobákem.
      Loví tím, že se potopí a plaváním pronásleduje ryby; dokáže přenést přes desítku ryb najednou v zobáku.
      Hnízdí v koloniích na skalnatých útesech a v norách.
      Je stálou ikonou Islandu a Faerských ostrovů.

  animal.albatross:
    label: albatros
    summary: Mořský pták s největším rozpětím křídel ze všech ptáků.
    info: |
      Albatros stěhovavý má největší rozpětí křídel ze všech ptáků, dosahující přes 3,5 metru.
      Většinu života stráví na otevřeném oceánu a dokáže letět tisíce kilometrů bez přistání.
      Piji mořskou vodu a vylučuje sůl nosními žlázami.
      V námořnické tradici je zabitý albatros příslib neštěstí.

  animal.seagull:
    label: racek
    summary: Pobřežní pták lačně hledající potravu u lidí i na moři.
    info: |
      Racek stříbřitý je jeden z nejrozšířenějších mořských ptáků Evropy.
      Je přizpůsobivý a všežravý; žije nejen na mořském pobřeží, ale i ve vnitrozemí u jezer a řek.
      Je inteligentní a někdy si zapamatuje místa, kde ho lidé krmí.
      Jeho útočný zájem o lidské jídlo je zdrojem mnohých historek turistů u moře.

  animal.hawk:
    label: jestřáb
    summary: Rychlý dravec lovící ptáky a savce v lesích a polích.
    info: |
      Jestřáb je rod dravců z čeledi jestřábovitých schopný lovu v husté vegetaci díky krátkým zakulaceným křídlům a dlouhému ocasu.
      Je velmi rychlý a obratný; loví ptáky za letu nebo z číhání.
      Samice bývají výrazně větší než samci.
      V sokolnictví byl jestřáb ceněným loveckým ptákem.

  animal.falcon:
    label: sokol
    summary: Nejrychlejší zvíře světa v střemhlavém letu (přes 320 km/h).
    info: |
      Sokol stěhovavý je nejrychlejší zvíře na Zemi; v střemhlavém letu dosahuje rychlosti přes 320 km/h.
      Má charakteristické tmavé kotlíčky pod očima, které potlačují odraz slunečního světla.
      Lovil s ním člověk přes 2 000 let; sokolnictví je zapsáno na listině UNESCO.
      V Česku hnízdí na vysokých budovách a skalách.

  animal.woodpecker:
    label: datel
    summary: Pták klepající do kůry stromů, aby našel hmyz nebo vytesal dutinu.
    info: |
      Datel je pták ze skupiny Picidae přizpůsobený ťukání do dřeva pevným zobákem a tuhým ocasem jako oporou.
      Jazyk je až třikrát delší než zobák a slouží k vytahování larev z vrtaných otvorů.
      Klováním komunikuje a označuje teritorium.
      Kovářský (Dryocopus martius) je největší datel Evropy.

  animal.cuckoo:
    label: kukačka
    summary: Hnízdní parazit skrývající vajíčka do cizích hnízd.
    info: |
      Kukačka obecná je proslulá hnízdním parazitismem; klade vejce do cizích hnízd, kde je pěstounský rodič vylíhne a odkrmí.
      Mladé kukaččí mládě záhy vyhodí ostatní vejce a mláďata z hnízda.
      Její dvouslabičný hlas kuku je symbolem příchodu jara.
      Samc kukají, samice vydávají bublající tón.

  animal.kingfisher:
    label: ledňáček
    summary: Klenotem zbarvený ptáček střemhlavě lovící ryby u potoků.
    info: |
      Ledňáček říční je jeden z nejkrásnějších ptáků Evropy s elektrickým modrým hřbetem a oranžovým hrudníkem.
      Sedí na větvi nad vodou a sleduje ryby; pak se střemhlavě ponoří.
      Je indikátorem čistoty vodních toků; kde žije, je voda zdravá.
      V Japonsku je podobný ledňáček (hisui) symbolem krásy.

  animal.canary:
    label: kanárek
    summary: Malý žlutý zpěvný pták oblíbený jako domácí mazlíček.
    info: |
      Kanárek domácí pochází z Kanárských ostrovů a byl domestikován v 17. století.
      Šlechtěním vznikla žlutá barva; divoký kanárek je zeleno-hnědý.
      Samci zpívají složité melodie; soutěže v kanářím zpěvu jsou celosvětovým fenoménem.
      Kanárci byli historicky využíváni v dolech jako detektor oxidu uhelnatého.

  animal.nightingale:
    label: slavík
    summary: Malý hnědý pták zpívající jeden z nejkrásnějších ptačích zpěvů.
    info: |
      Slavík obecný je malý hnědý ptáček jehož samec zpívá jeden z nejkomplexnějších a nejkrásnějších ptačích zpěvů.
      Zpívá především v noci a za úsvitu, odkud pochází jeho jméno.
      Je vzdálený příbuzný červenky.
      Básníci celého světa od Danteho po Keatsea oslavují slavíkův zpěv jako symbol romance a melancholie.

  animal.dove:
    label: holubice
    summary: Symbol míru; čistě bílý holub s jemným peřím.
    info: |
      Bílá holubice je mezinárodním symbolem míru od starověku; v Bibli přinesla Noemovi olivovou ratolest.
      V křesťanství symbolizuje Ducha Svatého.
      Domácí holub je ve skutečnosti domestikovaný skalní holub; bílé zbarvení vzniklo šlechtěním.
      Vypouštění bílých holubic je součástí ceremonií a oslav po celém světě.

  animal.raven:
    label: krkavec
    summary: Velký chytrý černý pták s charakteristickým hrdelním krákáním.
    info: |
      Krkavec velký je největší pták z čeledi krkavcovitých s délkou přes 60 cm.
      Je mimořádně inteligentní a má schopnost plánovat do budoucnosti, hrát si a navazovat sociální vazby.
      V mytologiích Seveřanů (Ódinovi havrani Huginn a Muninn) i Keltů měl mystický status.
      Tower of London je chráněn legendou, že říše padne, pokud krkavci opustí věž.

  animal.magpie:
    label: straka
    summary: Černo-bílý pták s dlou hým duhově zeleným ocasem.
    info: |
      Straka obecná je pták z čeledi krkavcovitých s výrazným černobílým zbarvením a dlouhým zelenavě lesklým ocasem.
      Má pověst zloděje lesklých předmětů, ale výzkumy tuto legendu nep otvrzují.
      Je jedním z mála savčích ptáků, který rozezná svůj odraz v zrcadle.
      V Číně je symbolem štěstí a radosti.

  animal.swallow:
    label: vlaštovka
    summary: Rychlý vzdušný hmyzožravec s typicky rozvětveným ocasem.
    info: |
      Vlaštovka obecná je tažný pták přezimující v subsaharské Africe a hnízdící v Evropě.
      Je mistr letu; hmyz loví výhradně za letu a dokáže se napít z hladiny bez přistání.
      Hnízdí v stodolách a pod střechami; ve folklóru přináší přítomnost vlaštovky štěstí domu.
      Symbolizuje jar, návrat a věrnost domovu.

  animal.condor:
    label: kondor
    summary: Největší létající pták Ameriky s obnaženou hlavou.
    info: |
      Kondor andský je největší létající pták na světě co do hmotnosti a rozpětí křídel.
      Je to sup; živí se mršinami velkých savců a hraje důležitou roli v ekosystému.
      Plachtí na obrovských termálních proudech nad Andami bez mávání křídly.
      Pro indiánská národy And je kondor posvátným symbolem nebe a svobody.

  animal.macaw:
    label: ara
    summary: Velký neotrop ický papoušek s jasně zbarveným peřím a silným zobákem.
    info: |
      Ara je velký papoušek tropických lesů Ameriky s nejnápadnějším zbarvením ze všech ptáků.
      Má silný zahnutý zobák schopný rozlousknout tvrdá ořechová jádra.
      Žijí v párech, které zůstávají pohromadě na celý život.
      Jsou ohroženy vykácením lesů a ilegálním obchodem s exotickými zvířaty.

  animal.cockatoo:
    label: kakadu
    summary: Chocholkatý bílý australský papoušch s výraznou žlutou chocholkou.
    info: |
      Kakadu žlutočelý je jeden z nejznámějších papoušků z čeledi kakaduovitých.
      Jeho výrazná žlutá chocholka se vztyčuje při vzrušení nebo poplach u.
      Je inteligentní a dokáže napodobovat lidský hlas.
      Žije až 80 let v zajetí a v Austrálii je považován za škůdce úrody.

  animal.budgerigar:
    label: andulka
    summary: Malý barevný papoušek z Austrálie, oblíbený domácí mazlíček.
    info: |
      Andulka vlnkovaná pochází z australského vnitrozemí, kde žije ve velkých hejnech.
      Je nejrozšířenějším chovným ptákem na světě po kanárkovi.
      Samci dokáží napodobovat lidský hlas a naučit se stovky slov.
      Divoké andulky jsou zeleno-žlutě zbarveny; barevné mutace vznikly šlechtěním.

  animal.hornbill:
    label: zoborožec
    summary: Tropický pták s obrovitým zobákem a zrohovělým výrůstkem.
    info: |
      Zoborožec je pták z čeledi Bucerotidae charakteristický obrovitým zobákem s kostěným nástavcem (casque).
      Žije v tropických lesích Afriky a Asie.
      Nehnízdí v norách, ale v dutinách stromů; samice se nechá zazdit samcem a zůstane uvnitř po celou dobu hnízdění.
      Jeho přítomnost je indikátorem zdravého tropického lesa.

  animal.roadrunner:
    label: kukačka zemní
    summary: Rychlý běžec pouští Severní Ameriky; symbol kreslených seriálů.
    info: |
      Kukačka zemní velká (roadrunner) je pták z čeledi kukačkovitých preferující chůzi a běh před létáním.
      Dosahuje rychlosti přes 30 km/h a živí se hady, ještěrkami, hmyzem i malými savci.
      Je schopna ulovit a zabít chřestýše.
      Zproslynula jako hrdina amerických kreslených seriálů Road Runnera a Koyota.

  animal.kookaburra:
    label: ledňáček smějící se
    summary: Australský ledňáček s hlasitým smíchem připomínajícím lidský řehot.
    info: |
      Ledňáček smějící se (kookaburra) je velký australský ledňáček proslulý hlasitým voláním připomínajícím lidský smích.
      Je symbolem australského bushe a jeho volání tradičně ohlašuje úsvit a západ slunce.
      Loví ještěrky, hady, hlodavce a hmyz.
      Žije v rodinných skupinách a mladší členové pomáhají rodičům vychovat mláďata.

  animal.lorikeet:
    label: lori
    summary: Malý pestrobarevný papoušek živící se nektarem a pylem.
    info: |
      Lori duhový je malý papoušek z Australasie s nejpestřejším zbarvením ze všech papoušků.
      Se specializovaným kartáčovitým jazykem sbírá nektar a pyl z tropických květů.
      Je důležitým opylovačem tropických lesů.
      Žije v hejnech a je hlučný a hravý; v zajetí rychle navazuje kontakt s lidmi.

  animal.ibis:
    label: ibis
    summary: Brodivý pták s zahnutým zobákem, posvátný v starém Egyptě.
    info: |
      Ibis je brodivý pták z čeledi Threskiornithidae s charakteristickým dlouhým zahnutým zobákem.
      Ibis posvátný byl uctíván ve starém Egyptě jako ztělesnění boha Thovta.
      Žije v koloniích v mokřadech a říčních deltách.
      Ibis hnědý byl nechtěně introdukován do Evropy a dnes se agresivně šíří jako invazní druh.

  animal.spoonbill:
    label: kolpík
    summary: Bílý brodivý pták s charakteristickým lžičkovitým zobákem.
    info: |
      Kolpík bílý je příbuzný ibisi, ale snadno ho odlišíme podle plochého lžičkovitého konce zobáku.
      Při hledání potravy pohybuje zobákem ze strany na stranu v mělké vodě.
      Hnízdí v koloniích v rákosinách a vrbinách.
      V Čechách je kolpík vzácný, ale pravidelný host na jižní Moravě.

  animal.secretary_bird:
    label: ptáček sekretář
    summary: Dlouhonohý africký dravec zabíjející hady dupnutím.
    info: |
      Ptáček sekretář je velký africký dravec chodící převážně pěšky po otevřené savaně.
      Zabíjí hady a hlodavce silnými dupnutími nohami s hmotností třínásobku tělesné váhy.
      Svůj název dostal od dlouhých per na hlavě připomínajících brky za uchem pisaře.
      Je státním symbolem Jihoafrické republiky a Súdánu.

  animal.cassowary:
    label: kasuár
    summary: Nebezpečný nelétavý pták Nové Guineje s ostrými drápy.
    info: |
      Kasuár je velký nelétavý pták ze Nové Guineje a severní Austrálie.
      Je považován za nejnebezpečnějšího ptáka světa; dlouhé drápy na vnitřním prstu jsou schopny způsobit vážné zranění.
      Vysoká kostěná přilba (casque) slouží pravděpodobně jako navigace v hustém lese.
      Je klíčovým roznašečem semen tropického lesa.

  animal.lyrebird:
    label: lyrochvost
    summary: Australský pták imitující libovolné zvuky okolí s dokonalou přesností.
    info: |
      Lyrochvost nádherný je australský pták proslulý schopností napodobit téměř jakýkoli zvuk z okolí: motorové pily, zvuky fotografického aparátu, alarm auta nebo volání jiných ptáků.
      Samci lákají samice vystavováním propracovaného lyrovitého ocasu a dokonalých imitací.
      Je symbolem australského státu Victoria.

  animal.quail:
    label: křepelka
    summary: Malý skrytý stepní ptáček hnízdící na zemi v trávě.
    info: |
      Křepelka polní je nejmenší zástupce čeledi fasánovitých v Evropě.
      Je skrytá; snadněji ji uslyšíme (pití-pít) než uvidíme.
      Na rozdíl od ostatních bažantů je tažná a zimuje v Africe.
      Její vejce jsou oblíbenou delikatesou.

  animal.pheasant:
    label: bažant
    summary: Velký barevný ptáček; samec má výrazné barvení a dlouhý ocas.
    info: |
      Bažant obecný byl dovezen do Evropy z Asie, ale dnes je přirozenou součástí evropské fauny.
      Samec (kohout) má nápadné barvení, zeleno-bronzové tělo a charakteristický červený váček kolem oka.
      Je nejrozšířenější pernatou zvěří v Česku a je základem myslivecké tradice.
      Hnízdí na zemi v hustých porostech.

