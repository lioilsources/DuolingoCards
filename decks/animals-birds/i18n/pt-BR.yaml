lang: pt-BR
pivot: false
title: Aves
cards:
  animal.eagle:
    label: águia
    summary: Aguia de grande porte com bico curvado e visão aguçada.
    info: A águia calva é o símbolo nacional dos Estados Unidos e uma das maiores fêmeas predadoras da América do Norte. Ela caça principalmente peixes, que pega diretamente da água com suas garras afiadas. Tem um envergadura de asas de mais de dois metros e vive na natureza por cerca de 20 anos.
  animal.flamingo:
    label: flamingo
    summary: Ave rosa que se alimenta em águas rasas, ficando em uma perna.
    info: O flamingo rosa recebe sua cor característica de carotenoides presentes nas algas e crustáceos que consome. Os filhotes nascem cinzentos e adquirem a cor rosa com o tempo. O bico curvado serve como filtro – o flamingo filtra o alimento da água mantendo a cabeça para baixo.
  animal.hummingbird:
    label: beija-flor
    summary: Ave mais pequena do mundo capaz de pairar no ar e voar para trás.
    info: O beija-flor rubi-garganta é a única espécie de beija-flor que nidifica regularmente no leste da América do Norte. Ele bate as asas até 53 vezes por segundo, produzindo um zumbido característico. Alimenta-se de néctar e pequenos insetos; seu coração pode bater até 1.200 vezes por minuto.
  animal.owl:
    label: coruja
    summary: Ave de rapina noturna com olhos arredondados, voo silencioso e audição excelente.
    info: A coruja é um ave noturna de rapina com olhos voltados para a frente. Ela não consegue mover os olhos, então gira a cabeça até 270 graus. Seu voo é quase silencioso devido à estrutura especial das penas. Caça à noite usando um ouvir extremamente sensível.
  animal.parrot:
    label: papagaio
    summary: Ave tropical colorida capaz de imitar sons e falar como humano.
    info: O arara-azul é um dos maiores papagaios do mundo, com envergadura das asas de mais de um metro. Vive nas florestas tropicais da América Latina. Essas aves têm uma inteligência excepcional – o arara consegue reconhecer cores, formas e contar. Vivem até 75 anos.
  animal.peacock:
    label: pavão
    summary: Macho de pavão com uma cauda vistosa em forma de leque cheia de olhos coloridos.
    info: O pavão comum é originário do subcontinente indiano. O macho (pavão) abre sua cauda – que na verdade são penas alongadas – em forma de leque durante o cortejo às fêmeas. As cores iridescentes não são causadas por pigmentos, mas pela refração da luz em microestruturas das penas.
  animal.penguin:
    label: pinguim
    summary: Ave não voadora do hemisfério sul, excelente nadador.
    info: O pinguim-imperial é o maior de todos os pinguis; atinge uma altura de mais de 1,1 metro. Vive na Antártida e põe ovos no inverno mais frio – os machos aquecem os ovos com os pés durante todo o inverno antártico. Sob a água, atinge velocidades superiores a 30 km/h.
  animal.toucan:
    label: tucano
    summary: Ave tropical com bico grande e colorido.
    info: O tucano gigante vive nas florestas tropicais da América Central e do Sul. Seu bico chamativo tem mais de 20 cm de comprimento, mas é muito leve, pois é formado por câmaras de ar. Serve para regular a temperatura corporal, quebrar frutas e como sinal visual para outros tucanos.
