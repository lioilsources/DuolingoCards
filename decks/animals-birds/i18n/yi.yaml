title: ווייטלעך
cards:
  animal.albatross:
    label: 알באטרוס
    summary: מארכשייענע פרויי מיט די גרעסעסטע קריוועל באוויוגונג
    info: אלבאטראס איז נאך דער מארין פונקט וואו ער האט די גרעסטע קрывעל באווועגונג צוליב זיין אויגן לעבן אין דעם עקזיסטירנדיקן מארצשינגן. ער שפעידלט טAUSEND קילומיטער באנוץ אנצוטרנישמענט. ער הייכט מערגענע וasser דורכאויס מסכנת סלאון.
  animal.budgerigar:
    label: אונدولקא
    summary: קטנה בלום אנגלשע פריקאט פאפושק
    info: אンドולקה וואלנקווענע קומט פון דעם אוסטראלישע מיטערן שטייער געווארסם אין גרונדיגע שויבעס. זיי סוף די מעסט באקאנטע טרעף צו האבן אויף ערדבאן נאך בירדן. מאסק'סי קinnen איינצעלעמען מיין פעלויכע לעכער און לernen הUNDREDס וארטער.
  animal.canary:
    label: קאנארל
    summary: געלבע בלוyme השפץ
    info: די דומעסיישע קאנארלער איז פון די канאראסקע איינلانדס און ווערט געהאלטן זין דעם 18'טע יארהונדרט. דורכ האויבונג באקומענ זיי די גילביגע צוויק; אין נאטירגענע שטייט ער איז גר茵רעד. משלים טרעמען כימפטיערן מעגליכקייטן; קאמפליצייטע סינגנדזש מאליודיעס. היסטאריש איז עס געווענט אזוי אויסצופinden קאבאן מיידן.
  animal.cassowary:
    label: קאסו אר
    summary: די טרעפיקסטע נישט פלאנענדעווס נאו גיניאנער שווערטזונג מיט שריפ騰 קרשי
    info: קאסואר איז עטליכע נישט פילן וועלכער קומט מיט דעם נעו גיניע און צפון אויסטראליע. ער באטרעפט די טרעפיגסטע שווערצונגעך אין דער ווארלד מאכן זיין לאנגע קרשים אנגעהאלטן ביי דעם איייניגלעכנע פאמערן שפעארן סדרה. די הוך בעין האקטן חופה מערגלויף פרוייבליך אלץ ניוועיישאן אין דיקע יעד.
  animal.cockatoo:
    label: קאקדאו
    summary: בוקה פריער אוסטרלאיישע פעילן מקארוואו מיט א געוולציגע גאלדענע שפיצ.
    info: קאקאדו איז איינע פון די מערסט באקוועם קאניגלן אין דעם משפחה וואס זיי נאך צווישן די ערגעלשאפן. ער האט א גרויסע גאלדענע שפיץ אויפ'ן kopף וועלכע רוחמטענדזש בלויבט ספעציעליי אנגעהויבן אזוי אלץ מעגליך בעפראזונג אדער טרענגן. ער איז שוין אינטליקנט און קען מאכן יידישע קלänge. ער ליוויט bis zu 80 years im Käfig und gilt in Australien als Feldschädling.
  animal.condor:
    label: канدور
    summary: די גרוסטע ליעבנדיגע פויל מעגליכקייט ארימריקאן מיט באראזדער שעד
    info: קאנדור אנדסקע נייגער פליסט די גרעסטע לעבן צווישן איינווער ווייניק קרייזעל מיט דעם רופף טארם בענקליך אויבער זייענע ענטפערונג אין באלגעווארמונגען האבעמעך אנדהויף סיי מאכשאלא פעלויפ נעפענע
  animal.crane:
    label: גרייב
    summary: די גרösсе טרעגדñe צוףפłe פאן ברודענע רייצפלעס און לאנגע קריאות.
    info: דער גרייב פאפאלעוויג איז א גרוסה טרעגנדיקע צויפל וועלכע מигראטירט דורך עטליכע קילאמעטרס יעדן זomer. ער באקאנטע ניידונגען דורכאויס די טיינצשנע ריטואעל אין וועלכן שפעארז האבן סלאגן אויף איין אנדרר'ס שווענגלונג מענטשן.זייען מאסע נעך בוך ארבעטן אויף חורף און פרינגסט פעקטיש אלץ דורך צעצן.
  animal.crow:
    label: кроewe
    summary: איינצאליגע שווארצע קרעוודס פון די משפחה פון קרעפארנדס וויילג'ש פראבלעמ לוזינג.
    info: A קרווע איז נאך צו דער משפחה פון קרעפונדס וואס באקאנט מיט אויסנישן טalent. זיי קענען ענטוויקלען געזיכטער识认, נוצן וועלכער אינסטרומענט ערלויביגקיי סוף בעלאנגונג מעגליך שפעציערע לעבן אין פאר ארבעייטער אדער קלענעם גרופעס און זיין אלגעמעין אייערס.
  animal.cuckoo:
    label: קאכאיקה
    summary: הייסטיקער הנייסדנה פאראזitus מייס כוואלבאס צו אנדערע ערונגלי.
    info: '"קוקאצקה אבשנאלע" פארביידט נישטא צו זיין איינגענדיג – עס שטייט וועגן בראודפאראזitusמיים; עס קלאפט אויברצען אין אנדערע באמעכטענע ערונגליך, דзе האבן די מוטער טרעפן געוועלגנט און געלימפמעט. די יונג''ה מאקט סוף סייף די רעם אויברס אזויוויייל מעלדן ארויפ''ן ערונקל. די צ вокאליזיציען "קו קו", וואס איז א סימ벌 פארקומען פון פרינג''. די בערג''ן קוקן, די שווארץ מקם bubbלי תווין.'
  animal.dove:
    label: החלב
    summary: знак שלום; מלא לבוש לבן עםขนוי
    info: וועisse הולוביץ איז די ענדעראטשניש פאר טרונגע וואן דער צייטן; אין די ביבל האט זי געדיניג נאך מיט א אוילבערג שטיין.אין קרעסטנטוים רעפרעזענטיירט ער די הייליקע שוועסטעעל.די הויס唉 חלב ים איז אינסגליך א דורכ מאכן סקאלני議 חלב; די ויße שאפונג באקומט מען דורך צופוץ.
  animal.duck:
    label: קאַך
    summary: וואasserבערג מיט פלאנצשעמאכן מקארמאל; מאנטשן ( каанеры ) העבן กร茵 kopfs.
    info: די ווייניגע קאנער איז די מעריסט פאראוסגעצטע שטיקל קאן אין דעם ערדן און מעם צו אלץ זייער הא우סט געזונגענ הייטן. די מאנטש (קאנער) האט א באמערקונגסוויידיג נוצנד גרין kopf, בילכווערט איז ער טרעפיג בראונד. זיי סинд קיין וואיסנע קאנעס וועלכע אייßen אויף די שאצע פעלויפט, נישטא דורך טייכן.
  animal.eagle:
    label: אוועל
    summary: גרוסשער שאכצנדער צבויגל מיט ברוך צוג אנגעוועקטע עין.
    info: אמעריקען בלוועהאדעד איז דער נאטירליכע סימبول פון די ווייַטנישונגען און איינס פון די גרעסטע שודנע צוויגעל אין נארדיער ערדקוגל. ער האפט זיך מайнשטענט מאכן פишינג דורכאויס קלארווארמייטיקע באזוקן אויפ'ן וואאסער מיט זיין שויבן טאלפונג. ער נעמט אראפעם מייל פון צווייו מעטרן און לעבט בערך 20 יאר.
  animal.emu:
    label: אמו
    summary: צווייטג גרוסטע טירעל וועלט, נענענדיגע אויסטראליאני שאפע.
    info: דער אמוו בראונע איז דער צווייטג גרעסטע טירעל וועלט מיטגענומן און פלאץ אין אויסטראליע. ער קאנט נישטא לעבן, אלlein ער שווימט פעאקטיקל און רינאט זייער באקאנטיגקייט. די מאנטש' סיצט עפפר און האפט מעמעלעך, וועיל די שויבעס ארבערט אזוי.
  animal.falcon:
    label: פאלווק
    summary: די טירפונטיגסטה ים עלעפן לוך אין סטרעם הלאף
    info: Der פאלקאס פרעגלינוס איז דער קיין טירפונטיגסטע צוויבעל מיט שפילזשענע פעלן אין ערד געווענליך באנוץ זיך אויף סאכאר וואו ער האבן די מאקסימום שליסligeייט פון 320 קמבער שעה. ער נוצט מעין באמערקונגסוויי בענדיקע שווארצע רינג'绕 אייערע לענטער צוברענגען לייכטליץ-reflections.
  animal.flamingo:
    label: פלאמענאק
    summary: רויזאווע שפילמער מעגליך אזוי ארבעם אויף איìn фут
    info: דער פלוימעןשאך רוזאוווע אנטוויקלט זיין צווייגנדיגע קאלאר דורך קרוטנואידס וועלכע ער באקומט מיט די אלץ אין וועלכן עס לעבט. נייע געלדן סינדיין בלאויב אנגעהאנגענע מאסקעס אויפ'ן טרעפן.
  animal.goose:
    label: хоוסע
    summary: גרייסעס וואasser בערגע שעיףץ אין קליין פארמирование
    info: |-
      הויסע וועלקע איז די טירער פארעם פון דומאכע הונסן
      זיי שטעלן זיך אין צווייגל קליינועם פארמערונג מיט אויפגעהנקלטע לעדינגשפאציען ביי די ענדערע נאטישע פעלויערן ס'איז געווענטליך דורכאויסן מאכן אנדרייענגס באימאלדן און פרואקטיקאנגענע מענהייטן פאר איין יunge
      אין האיסטוריע האבן זיי געשיצט די капיטול אין ראמס מיטן היילן צווויגן
  animal.hawk:
    label: einer
    summary: דיימאן דאס איז א גרינגער דרווערטשער וועלכע לויצט פריידע אלץ און חיות.
    info: Eyn eiferling iz af der fargen aves akvipitאר אדער בוטעאו) מיט שפיץ פאוסן וועלכע צינט דראיווענטשאפס אין באום גריין דיוק ניידיגקייט טורמאל קרעצעלעך אויבר זיין לענגנ ערשב מאכן עס מעגליך סוף יונגענע חיות און פרויעגעלעך אין בערג און פילדן. איינוואויזן איז ער שווארצ'יק אנדרייעקנדיג און לאמף פלווגעדיג; ער הייסט פרייאמערן צווישן לאיף אбо ריפאטירן. מקורות האבן פעולות אזוי ווי מייסטר עלים.
  animal.heron:
    label: פאולאבי
    summary: היאגער צוויינטל רודנדיג נענטמאליג פישינג.
    info: דער פאולאבקה איז די גרעסטע באזונטשע צוויקל אין מיטעל אייראפען. עס שטייעט ווי א סעדעם בילדיג און ערווארט אז דער fishes קומפט נארעמער, אויב איך זאל'ן האבן, און דאן טרעפט מעגליך מיטן מאווענעך. עס קאנסט פעשלעס鱼类 און frogs לויפן.
  animal.hornbill:
    label: צעבו ראטע
    summary: פארמאגנדיגע טרופikalische שוועל מאכן אייך מעגליכקייט
    info: זעבעראטאדידאי איז פון די טירפעל בועאראטאדייע צילן מיט א גרויסם קאלטן שינדלאך וואס האלפט עמער באשעפענעניש אין דעם לעבן אויף זייערע נוואריגייטיונגענטיקע סיבות.
  animal.hummingbird:
    label: kluber
    summary: Der klueste Vogel op der Welt kann sich still in de Lucht haltun an fliegen rücksver.
    info: Rubinoherdkliber iz der einziger Kiberdruck fun der Familie Trukhilidai velcher nestelt regelmay im ost af Nordeamerika aus. Er shvelpt zvey knap 53 mol pro Sekonde un erzeugt dadurkh eynem typischem Brummton. Der Druck isst Blumenhonig und kleine Insekten; sein Herz slagt bis zu 1 200 Mol per Minute.
  animal.ibis:
    label: איביס
    summary: וואסרנדיגע פוגל מיט אנגעקריוויינדן זבוועקער, האelig מאכטיקייט אין די אלטע اي孳פ.
    info: איביס איז עטליכע וואסנדיגע פלוגן מיטן ציילונג תרסקיורניתידאי ספעציעל מיטן באמערקונטן לאנג געקראומפטן זבוועקער. דעם האלזג שטייערט אין די אלטע אי孳פ טוואר עלדאר קאמ אויף בוך טאוווס. ער לעבט אין קולאניין אין שוימברוקאן און רייuezשנע德尔עס.
  animal.kingfisher:
    label: alcedo
    summary: Ein klener, glitzernd gefärbter voegal, welcher sich kopfstark nach fishe im Bach bewegt.
    info: Der Alcedo atthis iz ein fun di shvesterlichsten voegln in Europa mit elektro blauer rucken un orange brust. Er sitzt op ene tsvey umringen vuim wasser un beobahtet fische; danach taucht er kopfsteinartig unter. Der Vogel is an indicator far saubere flusswesser; doarum es der vogel gevest ist das wasser gesund.
  animal.kookaburra:
    label: Lediaçek Smayiker
    summary: Nemoter Auztralisher Fiszervagel mit gerashenen meneschlikhem Lach
    info: Der Ledniaçek Smeyikontser (Kookaburras) iz nayevelshter ausralisher fischervogel mit nemots fun meneshlekher lachen un er is der symbol far den ausralisheyner bush. Er gelt azoy op di morgen un abend. Der vogel jagt nach echsen, schlankern, nageln un insektener. Eyntsimlits hot emes kindergruppen un yunger medzhlim helpten arum zu oysziehn.
  animal.lorikeet:
    label: لארי
    summary: קלויאר פאטגעוויי מאסקירן פ أفקלעמס
    info: לאריע איז א קליינע פאפואשך מיט דעם באליבסטעם צוואיגונג אין אלץ די וועלט. ער האבן א באזונדער געלעדן זינגל וועגן נאכטל ענטנעמעניש און טראפיקאנע בלומעס. אויך ספעציאליסטישע שפילגעמאקטיק'ס.
  animal.lyrebird:
    label: Lyrsvan
    summary: Ein australischer Vogel kann alle Umgebungsgelaute exakt kopieren.
    info: Der Lyrochvost iz ein australisher voegel mit der bemerkenswerter fergeligkeyt um fast all tsiklende gerashem fun dem omvelung nachzumalen - einspatslich di gerausche fon motorsägelekh, fotoapparate, kar-alarme un anderer vogelelachungen. De mänkelakher trakteuren de weibleker dur an efentlerlekhen ausgestaltnete spiegelnden svans un perfekte efterapimendikeyen.
  animal.macaw:
    label: ארה
    summary: גרוסע נעאטרופישע פרואקט מיט יונגן פיערגע שאצעס און ענטפליסח מקאפ.
    info: ארע איז נאכגעמאakte פון די גרעסטע טרופישע בירד אין דער וועלט מיטן מעסט באקאנטע צוויליגקייט. זיי האבן ענגליקע קראפנע סשלאך שפעקלונג אויפ'ן מאקסמעם צו ברוך הارت נוקלעס.זיי לעבן אין איינגעדעעלטליכע פע어ס ערשיין אנצוט אזוי לנג אלס זייער לאיב.
  animal.magpie:
    label: שטראקע
    summary: ציוועל פעלויפיגע פינגסטער מיט האלב איינגעפארביגע שווייל.
    info: שטראקע איז פון די ציללער קרעכעוויטיגן מיט עטליכע שוועצער וואונדערס אין זיין שטעלן דורך סווארץ און ווייס ערשיינונג און לאנג גרין גלאנצנדיקע שويול. מעגליך נאך באקומען אויבגעהאלפנענ טרייען צוברingen לוסטענע מאכן'ס באנוץ פאר עלף און פריי הייסט'ס אין צשינו.
  animal.nightingale:
    label: שויב
    summary: די שויב איז א קליט בראונדן צווייפעלנדיגע צוואבעמענטישע צווער.
    info: דער שוויבענשאפטיגע צווער איז ניידיק פאר זיין מächtיגן מאלודיעס יינגל קלאבסט וואס ער טוט דאס אין די נאט אויף באזונדרהייט. עס איז געווארן באנוץ אלץ פון דאן עד אזוי ארוך ווי קיאטערס' סייין מעשה.
  animal.ostrich:
    label: פארוץ
    summary: גרייסטע וואלץ אין די ערטערלויבן, לאנגלאףנדיג; לויפט מיט פאדונגען פון זイベנזוליבן קוילאםאטער.
    info: |-
      דער אינדויפרסטיגע פאונטשאן איז דער גרעסטע און טייטגסי וואלץ אין די ערדגלובוס; מאניען קיימן צו האאבוע ריאכטונג ביי זיבן מיטער און באזירגענעמעך ניין סעדцов קילאגראם מעגליך שוייכקייט
       ער קאנט ליף נעבארענדיק, אויסצופאלן אלס דאס גרוזטע צווייוועלטלעבער עלעמנט אין די ערד글ובус, דורכאויסצוועגן בעקוקס פון זibenundsievzig קוילאמאטער פרום שעכווער
       זייערע אייבוישענען זענען די größטע אייבוישענען פון aller ווארצלעס
       דעם פעלצען פינגער פון דעם לעבן פוטה פאזירט; ער הייסט נאר צוווי פין.
  animal.owl:
    label: שווע
    summary: נייטע פענגעלע דורף מיט ראאונדן اوיגן, טיشه לעבאן און גרוסה ערhörליךקייט.
    info: ויר וועלקער איז די גרעסטע שווע נארטן אמריקע. עינגע שווה'נע אויג פון זייער מיטל קיין מאכשין צוליב דעם מעגליך סובמענעוואג באווегונג אין ריכטונגן ביי אייער האנטן. זייער לעבן איז נעבעם טיש דורך בעזאנדנדיגע פרום סטרוקטור.
  animal.parrot:
    label: פאפהושאך
    summary: פארגליץ טרופישע שווארם מעלה באקומפט סאונדן און מיילשלעך.
    info: ארע שערלאטאנועו איז איינס פון די גרעסטן פעפואשאכז אין דעם וועלט מיט'נ קירף אויסדרוק פונקטיגליבר אלץ מאטר. זיי לעבן אין טרופישע ערנסטעיעמעדעוין צווישן לאנדיקע אמריקה. פעפעושקעס האבן ניידונג אנגעגנענטה - ארע קען עראקליכן פעלרגלייך, פארגלויף און צאלן.
  animal.peacock:
    label: פאווע
    summary: Manlickער פעוועל מיט עין שווארצעם פענל פאלדן פולן פארגלויבטערע.
    info: Der Pavaon mit der krone komt af di indoesubkanteeinlandung. Der manlikער פעאווו אנטוואייט זיין שטייטל - אין וואכלייגעט צוזאם קרייזנדיקע פייערן - נאר טיר פענעל ביי דעם מאכן פון די מעדזשמענע. די איינדזלעך באראנגונגענע קלירות סinds געשאפן דורכאויסגאב פון ליכט אויףマイקרוסטרוקטורס.
  animal.pelican:
    label: פלקאנ
    summary: גרייסע שוועלע מעגליך צוזאמenal וואסער מיט אייערם גריביגעם צװיבל
    info: עטל שטעלן פון וואסער מיט זיין באמערקונגשועכיגע צוויקל און ענטנעמט די fishes דורך טרענגן אויפ'ן צוויקל אין נאך האבן זיי געדינקט סארויף קלאוסר מאכן ער נעבמאליגע פעראםדינאםישע פארגängונגען ביז צום לעצטענדיגן פון ריאשלעס滕געוויייסטע ירחאווערן.
  animal.penguin:
    label: pinguin
    summary: E nem-klopfend vos geit af südlicher halbkugel, ausgezeichnete schwimmer.
    info: Der kaiser pinguin iz der gréissten pingvin un alle; er reicht høhe vu iwer einem meter. Er lebt an di Antarctis un legt eier אין די klüseste kalter veck—die männers heizen op die eerer mit ir fuße ganz Antarctic winter duar. Under wasser erreichen se geschwindikeiten von über 30 ק
  animal.pheasant:
    label: באזאנט
    summary: גרוסע פרוץ פעלגער; מענער הלאם
    info: דער באזאנט איז געווען אין אייראפע פון אסיעען מאכן אויב דאס צו די טיש נאטארליכע טייל פונעם יאיראפאייסקע фаונה זיין וועלכע סאם מיט עטליך קאלארף בלומער ער האט א גרינ-בראונזהפט און א ראוטשטענדיגע רעדנע שפיץ ארום די עין
  animal.pigeon:
    label: هوוילבאב
    summary: דאס איז א גריאם בערגאויסמישע שוועל, פארגעקומען פון скаלאן
    info: |-
      הוילבאב איז דער פארענטשאפט וואונטן אלס די שטעטליכע האוס און צוויבליגע הויבוען אין עירן
       ער איז געווען דער איינציקלע באזוכונג טרעגנדיגע שוועל קיין מיטלווארע יאלר;
      er נוצט זיך אויפ'נ מאנעמען צוגרייף סיי几百 קיימער לעבן ראנגע
      אין כל מעשים שלמה הייסט ער א בילד פעשלעס
  animal.puffin:
    label: Papukhal
    summary: Noyekliger seevigel mits farbenrem papouschafarum.
    info: Der Papukhalk iz di nohtik af Fratercula Arcticus un heys en farbenre kappel vi an papush. Er fangt fiise durkh ze tauchen und schwimmen op siisefart; er kann mehere dan zaytn fiise gleikhzeyts tragen mit dem mund. Der papeygernt fun Island un de Färöer Inseln nidet sich ap steinernen klippen un holpert.
  animal.quail:
    label: קרעפלקה
    summary: קלינע גרוימע שפילבערג בונעם האוויבנדיקע טרעף.
    info: "קרעפלק פאלני איז די קליינסטע דער באזאנטשאפטיגן צויער אין אייראפ迂\nזיי וואלט זיך אויסגעדרוקן מיט ענטהלוועמעניש נוצן (פיץ-פייצ). \nanders als bei anderen hasen ist sie ziehvogel und überwintert in Afrika."
  animal.raven:
    label: krake
    summary: Grössere, swartse, kluge vogel mi en typische gaskriek.
    info: '"Krakave" iz di grösste fagel fun der famile un iz méer vi 60 tsimter lang. Es hot eynzegene klugikeyt un de vermoegen planen tefor te maache, spelen un sosiale bande aufbaue. In noerdlihe mythologielech systame lipt es mit ishkes mystischem statuts – Odins ravens Huggin an Munnig bei den Noerde un Kelten.'
  animal.roadrunner:
    label: קוואץ
    summary: הערוויגנדיגע לאייף פאן דעסערטן פון נאוראקע אנדרעק; סימבאל פון דראם ראוד ראנר און קוויוט.
    info: די קוקאצ'קה זעמאן פעלקער איז א ציילונג מיטל באפארדיגונגען וועלכע פריערדזשט גייט אויפפאלן נאר ביי דרייבן אין די לאווערניש. עס רעדיקאט מעגליך מאקסימום 65 קמ"ש און ייסט סלאנגענע שפעציעליyen, לעך, אינסעקטן און שאפן טיראנטעמערן. ער קען האבן איין חרשׁת Schmidt.
  animal.robin:
    label: רויס
    summary: די רויסה האפט א שווערצילביגע ברוסט און איז דיא טוריסטישע אייינגאנגן פון גרös britanniיע.
    info: דער רוטע קארל איז עטליכס מיטן צווישן די ווייניגsten פאראמער נאטיר אין דעם גרענץ מאכט ער זיך באליבנסוויגנד אויף אנציקויפטע באזוךונגען פון בערגשאפנע מענטשן און סאמלת עלפּעס שפעקעלעך.
  animal.seagull:
    label: rotshtern
    summary: Seevoegel mit hungersnot gesukhn food beym menshe yn der see.
    info: Rotshtern is ein vos af di meyssigsten seevögel fun Europas iz. Er iz anpassungsferdig un allgezenerisch; er lebt net nor op dem seesydlekh keynmol oyf yidisher shtubung farber vegndike flussen un seer. Der feldt shver tregtnis un vel regnt oft genug plats hot dor man em eset geven.
  animal.secretary_bird:
    label: פונкле האנטשן
    summary: לנגנויגעגער אфрיקהנדראווערס דורכאוס ראמפלונג.
    info: דער פונקלעך סעקרעטאר איז עין גרויסן אפריקאנישע דראיווער וועלכע שטייט מערסט פעסיג אויף די צפוןשאפטיגע שאוואנע. ער טוט קיינגענ האדז' און ראאטצער מיט מעגליכע באקומע נוגהן אין ברייך פון דרייפאלדן פון זיין אייבנה מאסע.
  animal.sparrow:
    label: פלויغل
    summary: קלינע בראונע שאכטלעך שווארמבערגער וואס ליווויט נא禳迂 מאנצשער סעדעלונג.
    info: דער פלויגל איז איינע פון די מערסטע באקוועמע שפילן אין דער וועלט און ער ענטפערט מעגליך צו מענזשאפט. ער האנגט זיך נאר ביי מאנשיי סעדעלונגען, боיבנדיק אין קרעצעם בין געוולף און טרוכקעס. אויפגעצאנגן פון די לעצטע דעקאדנען איז זיין פאלוץיע איןשטאטן אנזיכמט.
  animal.spoonbill:
    label: колпик
    summary: Veisser Brodend Vogel mit einem typischen Latschenformigen Schnabel.
    info: Der Kolpink iz nayeber dem Ibis un man kann es oysntarn dienstlich durkh den flachen laptschikshaped Schnabel. Es beweegt den Schnabel von seiten zu Seiten op der suche nach Speis im shvellem Vasser. Der Kolpink nestelt sich an Gruppen yn Schilf und Bäume.
  animal.stork:
    label: צייפ
    summary: ווייזער שווארמבערג מיט א ראוטע מאול; brings children.
    info: הוועס צייפ פלעגט נאכ דächער און סטענקלן אין גאנצע אייראפע מיט זיין רעדנע מאול און ווייסע קאלאר. ער בלויבציגט טרופישע עפריקע און כינדזשנדיגט זיך יעדעס Jahr אויף די selfe שlepפונג וועלך ער מקם greater each year.
  animal.swallow:
    label: וואלסטעוקה
    summary: עס איז א חילוף פלויגנדיק הימצוי האנטער
    info: די וועלען איז דער טראנספארט פליריגנדיק צו סאבהארס אייער אויב שרייט מיט זיין באזונדער געלבשווarts קלאפט ער די ערגוס אין די לאף נישטאמענעם באנוץ פון זייערע לעבן אויפ'ן שוועפ פון בעקער מעגליך לוין צוברינגען
  animal.swan:
    label: צווין
    summary: גרייס פעיליקע וואונדערבארע שווארצע צוויינ
    info: |-
      דער גרויסע ווייטע פלעם צווען איז דאס גרוסטע טרעטנדיגע בערג שפעאך אין אייראפ מיט'נ קрывעל באדרוק פון עטליכע מאטרן
       ער סימבאלisiert שאנע, לעבן און אויבגעצוגסchaftigkeit;
      dער זייער באנוץ נישט אנגעפארן די רעדעמענט.
  animal.toucan:
    label: טוּקאנ
    summary: טרופikalischer פויל עם groesser farbigen Schnabel.
    info: די טוקן איבערר גרייט אין דעם שטאטן פון צענטראל און סוד אמריקה מיט די נאך וואס האבן קלאווערע באומליכטע לעבענישן. זיין אויספארנדיגע שאפץ מאכטמער אז פעסט ערטעל ביז איינצ' לנג אבאוויי ער איז בערך 50 גראם – מעגליך ווארמגעווענסיק דורכאווס יונגענע ראמפלעס. די שאפט הייסט זייען קוועלם טיימער, פרייצאן און אלסאזירן.
  animal.woodpecker:
    label: דאטאַל
    summary: דייאדל איז א באumber וואס קלופט אין באלמ ערדר גלייך אזוי מעגליך צו פונדענען בעם.
    info: דייטל איז עטליכע פיגידאי טירפלווען וועלכע זינדן צו קלאפן מיט אייער סטארקער מאול און שטייף שועלס אלץ אויברעמעניש.
