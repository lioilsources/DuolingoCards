lang: bn
pivot: false
title: পাখি
cards:
  animal.albatross:
    label: অলবাট্রস
    summary: সমুদ্র পাখি যার পাখির বিস্তার সবচেয়ে বড়
    info: "অলবাট্রস সমুদয়েরই কিডনি বা পক্ষপথের চওড়াতমটি।\nএগুলি মহাদেশের উচ্ছেষ্ঠভূমি এবং অজানা জলে তালে থাকে আর হજার শক্তি খাইয়াছে যখন ভোজন ঘটে ফেলে। \nআলবাট্রস ও ঝীণ গঙ্গা ধরে ঐ সমৃদ্ধ ঢাঙ্গা ঈশ্বর ঊর্ণ ঔষধ প্রস্তুত করে।"
  animal.budgerigar:
    label: আন্দুলকা
    summary: Australie থেকে আসা ছোট এবং রঙিন পাঙ্গীয় পাখি, জনপ্রিয় পালন প্রাণী।
    info: "অ্যানডুলকা অসংখ্যতা মেরিলনদেশের এবং সেখানে বিরাট ঝাড়গোছে থাকে।\nএটি পপঙ্গীয় জাতের চওড়ামহলে দ্বিতীয়ভাবেই আধিষ্ঠান হিসেবে উচ্ছ্রষ্ট। \nপৌরুষজন ইউমান ভাষণ শব্ধ ও ফেটে খুব বেশি শব্দ ঘৃৎ শিখতে পারে।"
  animal.canary:
    label: খাঙ্গরি
    summary: আঙুলে ঠাণ্ঢা একটি সৌন্দর্য পাখি
    info: |-
      গৃহ কানেরিংয়াক্তি দ্বীপসমুদ্র থেকে আনতে হয়। সভ্য পশু ছাড়া এটি 17 শতকে ঘরবধ জীব গড়েছে।
      এই ফলজনিত উৎপাদনে ইউফোরিও মণি লাভ অথচ ধূষর চাটুয়াও খুব ঝুঁকি নেয়।
  animal.cassowary:
    label: ক্যাসুয়ার
    summary: '''আফ্রিকার ছোট থেকে ঠিকাণা নিষ্ক্রিয় পাখি ঐশ্বরিক ঢঙে প্রধান স্থান'''
    info: |-
      ক্যাসুয়ার হল নতোজিলেন্ডি এবং উত্তর অস্ট্রেলিয়ার বড় আকৃতির পাখি।
      এটি 'পৃথিবীর সবচেয়ে ঝুঁকিমূলক' পাখি ওখানে গণ্য;
      অভ্যন্তরীণ ফিঙ্গারগুলিকে দৈহিক চৌম্ভুকদের জন্য ধ্বংস ঘটাইতেও শক্তিশালী।
  animal.cockatoo:
    label: কাকাদু
    summary: আউষ্ট্রেলিয়া এবং আসিয়া থেকে আসা একটি সাদা পাপিয়াস যার চওড়া হলৌদ মাথা
    info: |-
      কাকাদু প্যালেটা সবচেয়ে জনপ্রিয়তম একজন।
      এর চওড়া হলোদসে মাথাটি উৎফুল্ছ বা ভয়গ্রস্ত অবস্থায় খাড়াভাবে ওঠে。
      ইহা নখশক্তি আছে এবং ইহা মানীষ গণধ্বনি শেখা সক্ষম।
      অবদমনে ঐ ধরনের ফাঙ্কি ঘন ঊর্ণ ঢঙ্গে ঈশ্বর ঝুঞ্ঝে সম্পন্ন করিতে পারে এবং অস্ট্রেলিয়াতে ইহা ফসলের ক্ষতিকর প্রাণী হিসাবে বিবেচিত হয়।
  animal.condor:
    label: কৌণ্ডোর
    summary: আমেরিকার সবচেয়ে বড় উড়ন্ত পাখি যার মাথা খালি
    info: "আন্দেস কোণডরটি ভারমতা এবং ডগাবিস্তারের পক্ষে আফ্রিকা'য় উপদ্বীপের ছুইছুই চলাফেরায় জনশ্রুতি।\nএটি মহান শ্লথভৃঙ্গ খাওয়ার অধিকারী হওয়া থাইজ ঘনিষ্ঠ ধরনের টাঙ্কা ঝুঁকি নষ্ট করে পরিবেশের সাথে ঐচ্ছিক সম্পর্ক রাখে। \nঅ্যাণ্ডিজ ঊর্ধ্বগামী ঢেউয়ে বিশাল প্রবাহে উড়ে যখন ঈশ্বরের প্রতীক হিসাবে বিনা হাত নড়া ছাড়া উড়ে যায়।"
  animal.crane:
    label: জেরাব
    summary: অঙ্গ তহনিক উড়োয়া নৃচর্চা আৱ া৴ শব্দ প্ৰসিদ্ধ।
    info: "জেরাব পপলাৱি একটি তহনিক উড়োয়া।\nএদেশে জম্মত হওয়া সময় যুগলবদন নৃচর্চা দেখাই থাকে অথবা লাফ আউসধ ও ডাঙ্গা খুলে রইছে। \nআগষ্ট ঘণ্ঠি শীতকাছে ভাষাং ধৈর্ণভাি ঢাক ঝুক ঊফৎ ঐ পাঞ্জের ঔপনিবেশিক পরিবহন ঘটিছে।"
  animal.crow:
    label: ভ্রগু
    summary: '''Crows'' ফ্ল্যামিটি থেকে ভ্রগু ইউজ ঘড়ি খুঁজে বার করতে পারে।'
    info: |-
      কৌশল সমাধানের জন্য প্রসিদ্ধ 'ভ্রগু' এবং Corvur corone গণ্ডি।
      এটা মানুষের চেহাবদল শনাক্ত ও উপযোগীতা অধিষ্ঠিত হওয়া ছাড়াই আছে।
  animal.cuckoo:
    label: কুকাচা
    summary: '''হণ্ট''-এ ডিম রাখে পড়ন্তি পাখি'
    info: "কুকাচা স্থলের পড়ন্তি নিয়মটির জন্মদাওয়াজন। এইগুলো অপরের ডিমবসতু বা 'হণ্ট'এ আশ্রয় গ্রহণ করে দীর্ঘ হওয়ার উৎস।\nআধুনিক শিষ্ণু ছাইছাল খাওয়া ফৌজদার ভাঙচূর করে ধ্বঞ্ঝাঠা ঢঙ করে ঐ হণ্ট থেকে বাঃখরা হয়ে যায়। \nঅথবা কুকাচা কৈফিয়তের ‘কু’ শব্দটি স্বভাবগত বসন্ত প্রতীক হিসেবে পরিচিত।"
  animal.dove:
    label: boidya
    summary: '''Shanti''-er chihna holo ekdom baidhar boidyagush'
    info: "শান্তির আনুমিক চিহ্নের জন্য বহুপ্রচলিত 'বইয়া'গুসকে প্রাচীনতম সভ্যতা থেকে শান্তির অঙ্গদ।\nখ্রিষ্টধর্মেও এটি দূত লোকের উৎস। \nএছাড়া ঘরের খাওয়া ছাই ফড়ফড় ধরণের ভাঙ্গা ঝুকি থেকে উৎপন্ন,\nআজকে ঐতিহাসিক অথবা সামাজিক অনুষ্ঠানে এদের মৃদু রঙের পাণ্ডুল ঢাকা করা হয়।"
  animal.duck:
    label: কাঞ্চন
    summary: অ্যানাস প্ল্যাটিরাইনকাস একটি সাধারণ পানি পাখি
    info: "কাঁচা দিবোকা প্রতিরূপের সবথেকে জনসংখ্যাধিক মইশল।\nএটি অধিকাংশ ঘরগৃহ শৈলীর আদি হয়েছে। \nপুরুষ এমনভাবে চিত্‍রিত থালাভুক্গণ নজর খাটাইয়া ছড়ানো উৎস ও ডুবানো ফলন ঠিক ঐ ঝরনা ঊর্ণ ঢঙে নয়।"
  animal.eagle:
    label: ওরিয়েল
    summary: খাবার খুঁজে বার করার জন্য হুকযুক্ত চোয়া এবং সূক্ষ্ম চোখ সম্পন্ন একটি বড় শিকারী পাখি।
    info: বিশ্বের সবচেয়ে বড় শিকারী পাখির মধ্যে একটি হলো ব্ল্যাক-হেডেড হালিয়েটাস, যা মার্কিন যুক্তরাষ্ট্রের জাতীয় প্রতীক। এটি মূলত মাছ শিকার করে যা সরাসরি জল থেকে তার সূঁচাল নখ দিয়ে ধরে। এর ডানা দুটির প্রসারণ দুই মিটারের বেশি এবং প্রাকৃতিক পরিবেশে এটি প্রায় 20 বছর বাঁচে।
  animal.emu:
    label: এমু
    summary: দ্বিতীয় বৃহত্তম পাখি, উড়তে অক্ষম অস্ট্রেলিয়ান ঔষধি।
    info: "এমু বা Dromaeus novaehollandii প্রকৃতির দ্বিতীয় সবচেয়ে ডানপথ।\nএটি উড়তে অসক্ষম কিন্তু ভালোভাবে চলনশৈলী এবং ধাওয়াও খুবই শক্ত। \nআগে মহিলা ছেলেদের জন্য থাইম হিসেবে আছে এবং গণনা ফিৎফাট ঘটে ঠিক ঐখানে থাকে,\nঅধিকাংশ ঝুঁকি ঢালাও সঙ্গে এটি সম্পর্কিত প্রজনন এবং প্রজনন করে।"
  animal.falcon:
    label: ফাউকন
    summary: '''অ্যাডওয়ান ফ্লাইট''-এ খুব ধৈর্ষপূর্ণ ঘৃৎপথ'
    info: |-
      পালকো পেরগিনাস্‌ এবং 'স্টিমহলভ'এটি ভুমধ্যদেশীয় শনিকা।
      চোখের তলার অণুজতরঙ্গ আছে,
      আইউনেস্কো দ্বারা চিহ্ণিত ও জড়িত ছিল।
  animal.flamingo:
    label: ফুলেন্টার
    summary: নীল জলে এক পা দিয়ে দাঁড়িয়ে থাকা গোলাপী রঙের পানি পানিশিল পাখি।
    info: ফুলেন্টার গোলাপী রঙটি তার খাদ্যে থাকা ক্যারোটিনয়েড যুক্ত শৈবাল এবং ক্রুস্টেশিয়ান থেকে আসে। ছোট পাখিরা আগে ধূসর রঙের হয় এবং সময়ের সাথে রঙ ধরে। বাহুল্য মুখ ফিল্টার হিসাবে কাজ করে - ফুলেন্টার পানি থেকে খাদ্য ছানা ছানি করে মাথা নিচু করে।
  animal.goose:
    label: |-
      হোয়াজ
      বড় জলপথের চমৎকার উদাহরণ।
    summary: আগে যখন গৃহসজ্জা ছিল আরও ভাঙা অবস্থায়।
    info: |-
      হুসা বড়টি হলে।
      এরা একইভাবে স্থানচিত্ৰণ করতে পছন্দ করে।
  animal.hawk:
    label: জেস্ত্রাব
    summary: '''জেস্ত্রাব'', বন এবং ক্ষেতে পাখি এবং স্থলচর প্রাণী শিকার করে দ্রুত শিকারী।'
    info: |-
      হান্টিং হওয়ার জন্য 'জেস্ত্রাব'গুলি সমতল ও গভীর উদ্ভিদবিশিষ্ঠ এলাকায় খোকা।
      এটি অপঙ্ঘৌষধ প্লাইড আছে মৃৎখণ্ড থেকে ধৈর্যশীল চলচিত্র ফ্লাঙ্গ
      ফ্লাণ্ড ছোট এবং বৃত্তাকার ঝুড়ি এবং দীর্ঘ ঢিলে পাখনা দ্বারা,
      আই স্পেস এবং স্পেস এবং স্পেস এবং স্পেস এবং স্পেস এবং স্পেস
  animal.heron:
    label: বালুচিয়া
    summary: উচ্চ ঘন পাথরের ঢিটে পাণিঠারা
    info: |-
      বালুচিয়া পেগনস্‌ট্রিকলর মধ্যপতি একজন।
      এটি গড়দণ্ডময়ভাবে দাঁড়িয়েছে আশেপাশে সৎ হওয়ার অপেক্ষা করে,
      আর তখনই চোঙের ধাওয়া ছুটে জলের ভিতরে নেমে খাইয়া ফেলে ঝিঙ্গী আর উফূর।
  animal.hornbill:
    label: বুসেরাটিডি
    summary: আফ্রিকা ও জহির ঊষ্ণ অরণ্যে থাকে এমন একটি প্রজনকতা যার চওড়া মূল এবং কঠিন বাহ্যিক বৈশিষ্ট্য রয়েছে।
    info: "বুসেরাটিডি প্রজনকতা এমন সপ্তদশ যখন কঠিনভাবে চওড়া মূল দগ্ধ হয়।\nএটি আফ্রিকা ও জহির উষ্ণ অরণ্যে থাকে। \nঅথচ গৃহ খোদাই করে না, ছাল ভেঙে ফেলে;\nছেলে শিঙা ঘিরে ঢেউ ঝাড়ে এবং ঐ ষ্টেইটে থাকে সম্পূর্ণ প্রজনন পর্যায়ে।"
  animal.hummingbird:
    label: কলিব্রিক
    summary: বিশ্বের সবচেয়ে ছোট পাখি যা স্থানে ভাসতে এবং পিছনে উড়তে সক্ষম।
    info: কোলিব্রিক রুবিনোহার্টলি হল মাত্র একটি কোলিব্রিক প্রজাতি যে পশ্চিম আমেরিকার পূর্ব অংশে নিয়মিত ডিম পাড়ে। এটি প্রতি সেকেন্ডে 53 বার ডানা ঝাড়ে যার ফলে স্বাভাবিক বুজুরুক শব্দ হয়। এরা রস এবং ছোট পোকামাকড় খায়; এদের হৃদপিণ্ড প্রতি মিনিটে 1200 বার ধড়ফড় করে।
  animal.ibis:
    label: আইবিস
    summary: অধৌনিক ঈজিপশতে পবিত্র বিবেচিত একটি চটচটে লম্বা কঙ্কহীন মুখ নিশ্ছল।
    info: "ইবিস হলো থ্রেসকিরনথাইডিয়াদে পরিবাদের এমন গণপয়খন চটচটে লম্বা কঙ্কহীন মুখ নিশ্ছল।\niBis আধুনিক ঈজিপশতে তওৎ ধর্ষ্টভগবানের অবতার ভাবে উপাসনা ও জনপ্রিয়তা ঘটছে। \nএটি ঝুম খাড়া ফাংশন ঠিক ঐ ঢাক ঔষধ বা ঊর্ণা প্রকৃতি স্থানে বাস করে।"
  animal.kingfisher:
    label: bluetelsbys
    summary: ফিঞ্চ ঘৃষ্ণা ঢুকে পানির ধারে বিশেষ রূপের পাখি
    info: "রিভার ব্লুটেলস্‌বি ইউরোপের সবচেয়ে নকশা করা পাখির মধ্যে একজন -এর গা'তেই তড়গৎ আছে।\nও জলের উপরে শাখাটির ওপরে থেকে ছুটে চলে ফিংশদেখে;\nঅথম অভাহ দিয়ে ডুবে যায়। \nআর ঠিক ঐ ধরণের ঝঙ্গরি(হিষুই), জাপানে সৌন্দর্যের প্রতীক।"
  animal.kookaburra:
    label: অস্থ্রেলিয়ান শখের খাওয়া ছোট ঝিড়ি
    summary: আউষ্ঠ্রেলিয়ান ভাষার উভয় ধ্বনি এবং ইফেক্ট ফ্রিকৃতি
    info: |-
      কুইঘার্টা নেওয়ারিকি এবং অস্ত্রেলিয়ান বশির প্রতীক।
      এটি মধ্যম আকারের সজগ জঙ্গলপথোহৎ হিলচড়াদের দ্বারা চিহ্নিত করা হয়।
  animal.lorikeet:
    label: লরি
    summary: অরণ্যের ফুল থেকে মধু এবং পরাগ খাওয়া ছোট রঙিন কম্বসবহীন মধুপতি।
    info: "লরি একটি ছোঁয়াছাপনে রঙিন কম্বসবহীন মধুপতি।\nএদেশের উষ্ণ আগাথে তাদের খাওয়ার জন্য সফটওভাইজড চূণচৈত ভালুক হাঙ্গামা ঘটে। \nআউস্ট্রেলিয়ার অরণ্যে ফুলের ধৌত শৃঙ্খলা ঠিক রাখতে ডানা ঝাড়া হয়।"
  animal.lyrebird:
    label: অভিধাঃ Lyrochvost
    summary: এই ভাঙ্খন ফড়ফড়ি ছৈল্ি ঘন্থ ঐছাণ ঝাঞ্জাং ঢা঳ ঊধ্঵ ঔ ঑টৱ া ঴ ঩থ ঺ ঻ ঽ
    info: লাইরোক্যসট নাৎহেনি এমন অপবিত্ৰতয় পশ্চিম সঙ্গীত কণ্ঠ দ্বারা জগতের লৌহচক্ষুদের আকষ্ট ও শখ উজাড় হওয়া।
  animal.macaw:
    label: অ্যালাওয়া
    summary: উষ্ণমণ্ডলীয় চৌখানা ঝুমকা ধরে ঐ একটি ঢালু পাখি
    info: |-
      আরা দক্ষিণপূর্ভারতের উষ্ণমণ্ডলীয় বনসভ্যদেশি এবং সবচেয়ে আড়ম্পট হওয়া কথা।
      এইগুলি শক্ত নৃত্যের মধ্যে খোলা জাইজ থেকে অঙ্গহীন ফল ছাটছাঠ ঘটে।
  animal.magpie:
    label: স্টরাকা
    summary: আধুনিক স্টরাকা ওবেনকা একটি কালো - সাদা পাখি যার দীর্ঘ দুষ্মতি গদি আছে
    info: "স্টরাকা ওবেনকা হলো এমন পাখি যার চিত্‍য়াফড়িংগা আছে।এটি নীলচেহালা ঝকঝকে গদি সঙ্গে দুষ্মতি বণ থাকে।\nপ্রখ্যাতভাবে উজ্জ্঵ল বস্তু ডাঙ্গা ছিঞ্জা অথবা ফাইৎ শৈশব ঘটনা ভাষ্ঠা ধরে রাখে। \nইউরোপে ঐ পাখি সৃষ্টি সুখ ও আনন্দ ঢাণ হিসাবে ব্যবহৃত হয়।"
  animal.nightingale:
    label: স্লাভিক
    summary: ছুটা বরণের পথিনীয় যার ঝঙ্ঙাড় আওয়াজ শৈখর উৎসাচন করে ফেলে।
    info: |-
      স্লাভিক ওবেনকি হলো এমন ছুটা বরণের পথিনীয় যার স্থূপতা দ্বারা গড়েছে।
      এই জাতির মহিষৌদরগণ অধিকাংশ আওয়াজ শৈখর উৎসাচন করে ফেলে,
      আর ইউষ্ণ ঘটনাটি খৃষ্ঠভাবে ধরে রাখে ঐ জাতির নাম।
  animal.ostrich:
    label: পিনাকু
    summary: বিশ্বের সবচেয়ে বড় পক্ষী ; 70 কিমি / ঘন্টা গতিতে দৌড়ায়
    info: "পিনাকু পক্ষিরা বিশ্বের সবচেয়ে ডগর এবং ভারীতম। মলদের উচ্চতা 2.7 মিটার হওয়া দরকার আছে যখন তাদের ওজনটি 150 খালি অধিগমন ঘটে।\nএই জোড়া ছাইফৃষ্ঠ থাকে না, কিন্তু এটি ধ্বসে ফেলে দেশের সবথেকে ঝাঙ্গা হাঁটা হার প্রাণী হয়েছে -68km/h এর ঊর্ধ্বে গতি অর্জন করে। \nঅণু ঐহিক ঈর্ষ্যা সবথেকে বড় হয়।"
  animal.owl:
    label: সাওয়া
    summary: রাতে শিকার করে এমন এক ধরনের পাখি, যার চোখ দুটি বৃত্তাকার এবং শুনার দক্ষতা খুব ভালো।
    info: বৃহত্তম সাওয়া উত্তর আমেরিকার একটি পাখি। সাওয়াদের চোখ চারপাশে ঘোরানো যায় না, তাই তারা তাদের মাথা 270 ডিগ্রি পর্যন্ত ঘোরায়। তাদের পাখির বিশেষ গঠনের কারণে তারা প্রায় নিঃশব্দে উড়তে পারে। রাতে তারা অসাধারণ শ্রবণ দক্ষতা ব্যবহার করে শিকার ধরে।
  animal.parrot:
    label: পাপুয়েক
    summary: একটি রংময় উষ্ণকর পাখি যে শব্দ এবং মানুষের কথা নকল করতে পারে।
    info: একটি আরা সরলাটোভি হল একটি বিশ্বের সবচেয়ে বড় পাপুয়েক যার ডানা প্রসারণ 1 মিটারের বেশি। এটি ল্যাটিন আমেরিকার উষ্ণকর বনে বাস করে। পাপুয়েকরা অসাধারণ বুদ্ধিমত্তা সম্পন্ন – আরা রং, আকৃতি এবং গণনা চিনতে পারে। এরা 75 বছর পর্যন্ত বেঁচে থাকে।
  animal.peacock:
    label: পাঁঠা
    summary: পাঁঠার সুন্দর বর্ণময় পাখনার প্রসারিত পুঁচছি রয়েছে।
    info: করুণা পাঁঠা ভারতীয় উপমহাদেশের প্রাকৃতিক প্রাণী। পুরুষ পাঁঠা মাদুরীদের আকৃষ্ট করার সময় তার পাখনা প্রসারিত করে বৃত্তাকার আকৃতি তৈরি করে। এই পাখনার আলোক রং পিগমেন্ট নয়, বরং আলোর বিচ্ছুরণ এবং পাখনার মাইক্রোস্ট্রাকচারের কারণে হয়।
  animal.pelican:
    label: পেলিকান
    summary: ফিশিংয়ে অভ্যস্ট খৃষ্ণধাওয়া উড়৷
    info: |-
      পেলিকান হ'ল একটি বড়ো জলজ প্রণয়নশীলতা।
      এরদের চিত্‌চমৎকার গলগলা মুখ আছে যা সবসহজেই ছোঠাই ধরে থাকে।
  animal.penguin:
    label: পাখি
    summary: দক্ষিণ গোলার্ধের একটি উড়তে পারে না এমন পাখি, ভালো সাঁতারু।
    info: সমুদ্রগুপ্ত পাখি সমস্ত পাখির মধ্যে সবচেয়ে বড়, এর উচ্চতা 1.1 মিটারের বেশি হয়। এটি অ্যান্টার্কটিকাতে বাস করে এবং সবচেয়ে শীতল পরিবেশে ডিম পাড়ে—পুরুষরা ডিমগুলি পা দিয়ে গরম রাখে অ্যান্টার্কটিক শীতকালের জন্য। জলের নিচে এটি 30 কিমি/ঘন্টা বেগে সাঁতার দেয়।
  animal.pheasant:
    label: বজাত্‌
    summary: বড় ও ভঙ্গিমাছাড়া পাখি ; ঐ ফূলওয়ালা ঘৃষ্ণ থাকে
    info: |-
      বাজন্ট সরলভাবে এশিয়ায়থুতপি ইউরোপে আমদানি করা হয়েছিল।
      এটি পক্ষীগণের মধ্যে চেক রিপাবলিকে অসাধারণ উৎপাদনশীল শিকার।
  animal.pigeon:
    label: হৌব
    summary: অফিস এবং গ্রাম এখানে সাধারণ ঢাক ঝাঙ্গা পাখি
    info: "স্থল হোবেরা সকল শহরগতিক এবং বাড়িয়েছেন পাখি গণমধ্যে আদি।\nএটি মানুষের জন্য দশ লক্ষ বৎসর ধরে চিঠি তথা ইঙ্গিতপূর্ণ উড়ে ঘরে ফিরে অভিভার ছিল। \nআজও ওই পাখি টৃপি ঐচ্ছিক নেভিগেশন এবং শত কিলোমিটার দীর্ঘতর দূরত্ব থেকে ঘরে ফিরে আসতে পারে।"
  animal.puffin:
    label: ফ্রাভারকুলা
    summary: আর্কটিকা ফ্রাভারকুলা - ঝিনুকের মতো রঙিন ঠোঢ় সহ সামুদ্রিক পাখি
    info: |-
      সেন্টারলা আরকটিকা)।
      পুঞ্জবদ্ধভাবে শিরশিরি ও গহীনতর সমূদ্রগোড়ায় নখধাতু খুঁজছে এই পাহাড়ি মাছ চৌঙ্গা দ্যাল থেকে অণুচক উথৈয়া ফেলে;
      এটি ইসল্যাণ্ড এবং ফেয়ারওয়েল দ্বীপপুঞ্জের ঐতিহ্যগত প্রতীক
  animal.quail:
    label: ক্রেপলিকা
    summary: একটি ছোট লূকাচ্ছড়া পাখি যা ঘাষায় মাটিতে ঐশীয় স্থানে ডিম পাড়ে।
    info: "ক্রেপলিকা পোলনি ইউরোপায় ফসানবদ গৃহগুলির মধ্যে সবচেয়ে ছোট।\nএটি লূকাচ্ছড়া;\nআমরা এই বাজাতে শীঘ্রতরভাবে 'পিটি - পিড' হওয়া থেকে দেখতে অথবা আবছাও ভাষণ উৎস খুজতে পারি। \nঅন্যান্য ঝোপফৌকাদের মতো নয়,\nএটি ধৈর্ণশীল এবং ঠান্ডা মৌসুমে আফ্রিকায় ঢুকে পড়ে।"
  animal.raven:
    label: Krakvac
    summary: '''Raven''-এর একটি বড় চিত্তশুদ্ধ কা঳ো পাখি'
    info: "কৃষ্ণগায়ে বা 'রবিন' হল করভিৎস ফ্লমিওয়ানাস পদার্থটি।\nএটি একজন অত্যধিক চিত্তশুদ্ধ জীব আছে ভবিষ্যতের উপর গণনা শক্তি, খেলা দক্ষতা এবং মহাকাশচর ঘনিষ্ঠতা ছড়িয়ে দেওয়ার ইউনিট। \nইউথানিয়ান ঐতিহ্যে (অডিনের ঝোঁপ ডানা হুগিন এবং মুনিন), কেল্টিক ঈশ্বরত্বে এটি ঢঙ্গ স্থান পেয়েছে।"
  animal.roadrunner:
    label: পাৱণখৈছা ভৌমিকা
    summary: '''আমেরিকা ডিজনি'' অঙ্গসমূহের হিরো বা নাটকীয় ধাও'
    info: মহাদেশীয় মরুভূমির 'ক্যোট' এবং 'ডিসন'-এর চলচ্ছদগুলির প্রতীক।
  animal.robin:
    label: lalniira
    summary: গৌরবজনক শরূপ উইল্টে ঐতিহ্যগত ঈদ প্রতীক
    info: |-
      সাধারণ ললনীরা একটি ছোঁড়ায়ে গিয়েছে।
      এটি স্বভাভিকতা দেখানো হচ্চে;
      বাড়ির মধ্যে খোদাই পথে জমি ঘষে আউশপাত ও অঙ্গহৃৎ ফেলে থাকে।
  animal.seagull:
    label: রেসিক
    summary: পাড়ার ঘৃণাধর্মী ফৌজদার ঝুঠামি ঐ ঢাক ঊপর করে।
    info: |-
      রেসিক রুপালি ইউরোপের সবচেয়ে ব্যাপকভাভা ছড়িওনীত মহাদেশগুলো।
      এটি অঙ্গুজ এবং জমি খাওয়াদৈখানো হইছে;
      আধুনিক আবহািঅব তথাৎ উষ্ণ শহরগুলো থাটি চাষ করে।
  animal.secretary_bird:
    label: সেক্রিটারি বীটলওয়ান
    summary: আফ্রিকার লম্বা ঠোঢ়ি থাকা ড্রাফ্ট ঝুঁকি হাঙ্গামা
    info: |-
      সেক্রিটারি বীটলওয়ান একজন মহাদেশগত শিকারীর চমৎকারভাবে পথচলা।
      এটি সবল নখদড় ছুঁইছোয়া হাতীপাখি ও অন্যান্য জঙ্গলী আধুনিক উদ্ভিদ ধ্বংস ঘটাই।
  animal.sparrow:
    label: চূণী
    summary: আঙুল আকৃতির লাইফ জীবন যাচ্ঞা
    info: |-
      পাস্তর ডমেসটিকুস প্রজনকগোষ্ঠির এই ছোঁড়ায় বলতে দৈহিকভাবে মানবদের অধিক ঘনিষ্ট।
      এখনও শহরগুলিতে গণশিখা হ্রাস পেয়েছে।
  animal.spoonbill:
    label: colping
    summary: একটি উৎসাড়নশীল ভাঙা ইষ্টক ও ফ্ল্যাট থালার আকৃতির ঠোঢ়া সহ ঝড়িয়ে পথে চলা পাখি।
    info: |-
      সাদা কলপিংকের চুনি আইবিসগুলি এমনভাবেও প্রতিনিয়ত ঘটছে।
      খোজাখবেয়ালি জন্তুদের অনুসন্ধানে মধ্যে ছোট গৃহে শঙ্কুচালন হয়।
  animal.stork:
    label: চাষ
    summary: আঙ্গীন ফাংশন থেকে ধারণা
    info: |-
      বাইল হকুরা এটি প্রচণ্ডভাবে চওড়ায় সমগ্র মধ্যপ্লানিট ও আফ্রিকাতে।
      এইসব জনতা শহরের ছাদ অথবা খোদ গছে ঘর ভাঙ্গার উৎস।
  animal.swallow:
    label: vlástavka
    summary: অত্যন্ত দ্রুত ও ঊর্ধ্বাঞ্চলে গণ্ডাঘুষি ধরে এক প্রকার পাখি যার পিছনে দু'ভাগে বিভক্ত পাখনা
    info: "বাল্টো সরেসা একটি পলিময়ন উড়ীজ যখন দক্ষিণপশ্চিম আফ্রিকাতে শৈত্ব অতিক্রম ও ইউরোপে ডগান।\nএটি গণ্ডাঘুষি ধরে খায় হাওয়ার ভিতরেই ছাড়া থামছে ফুটোও জলচর ঝরা পথে ঢুকছে;\nদৌহাঙ্গি ঠাঁই করে ছাদের নীচে ও গৃহভাংড়ের মধ্যে ; \nআঙ্গিনায় ঐ পাখির উপস্থিতি সৌভাগ্য বাড়ানোর ঔৎসর্গিক প্রতীক"
  animal.swan:
    label: ল্যামা
    summary: একটি বৈশিষ্ট্যপূণ্ণ সুন্দর সাদা জলপোকা
    info: "ল্যামা বৃহতেক ইউরোপিওন উড়নচ্ছেদি পাখি। এটির ডানা দুইয়ের আবছাক সমষ্টি 2.5 গজেরও অধিক হতে পারে।\nএগুলো শৌখিত্যসভ্যতা, ভালোবাসা এবং ঐশ্চর্যের প্রতীক। জীবন ধরে এগুলো ঘনিষ্ঠ থাকে। \nঅথবা ঝুঁকি ফেলতে চাঙ্গা এগুলো আঙ্গুল ঊর্ধ্বমুখী করে এবং ঢিল দেয়।"
  animal.toucan:
    label: টুকান
    summary: একটি উষ্ণকরম পাখি যার একটি বড় রঙিন মুখ আছে।
    info: টুকান মহাদেশীয় ও দক্ষিণ আমেরিকার বৃষ্টিপূর্ণ বনে বাস করে। এর চোখ কাটা মুখ প্রায় ২০ সেমি লম্বা হলেও খুব হালকা – এটি বাতাসের ঘর দ্বারা গঠিত। এটি শরীরের তাপমাত্রা নিয়ন্ত্রণে, ফল কেটে খাওয়ার জন্য এবং অন্যান্য টুকানদের জন্য দৃশ্যমান সংকেত হিসেবে কাজ করে।
  animal.woodpecker:
    label: ড্যাটেল
    summary: উদ্ভিদ কীট খুঁজতে গাছের চামড়া কুঁড়ে পাখি
    info: "ড্যাটেল হচ্ছে পিকাইদির একটা জীবনপথয় সমসত্তর আগুণ।এই মজবূত চওড়া ও শক্ত গোঙার দ্বারা খুঁজছে ড্যালভৃষ্ঠা অফশ্ন ঘটনা উৎখনন করতে।\nহাঙর ভাষা ধৈর্ণ ফৌজদার ঢাল ঝুঁকে পড়ে এবং স্থান চিহ্নিত করে। \nধৱনি সঞ্চারণ এবং ঐতিহ্য চিহ্নিত করতে এটা ব্যবহার করা হয়।"
