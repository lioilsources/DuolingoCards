title: पक्षीनि
cards:
  animal.eagle:
    label: ओरल
    summary: एक बड़ा मांसाहारी पक्षी हुक्ड चोंच अउ तिकोन दृष्टि सहित।
    info: ओरल एगो नेशनल सिम्बल हवे यूएसए के अउ उत्तरी अमेरिका के सबले से बड़े शिवरों में से एक हवे। ओ खासकर मछली मारथे जे ओ ठीकठीक पानी से अपने भेदी धाँदों से पकड़थे। इ के पखेवों के फैलाव ले दो मीटर से ऊपर हवे अउ ओ प्राकृतिक रूप से लगभग 20 वर्ष झिलथे।
  animal.flamingo:
    label: फोएनिकोप्टेरस
    summary: हल्का रंग का पक्षी मुख्य आधार पर सेंटौरस जीनस है।
    info: फोएनिकोप्टेरस के शरीर का विशिष्ट गुण उनके भोजन में निहित कृमिद्रव्यों और लाल चट्टानों से प्राप्त कैरोटीनॉइड्स के कारण होता है। इनके बच्चे एक छाया रंग में जन्म लेते हैं और धीरे-धीरे अपना विशिष्ट रंग प्राप्त करते हैं। झुका हुआ खाँस फ़िल्टर के रूप में कार्य करता है - फोएनिकोप्टेरस अपने सिर को ऊपर से डालकर पानी से भोजन छानता है।
  animal.hummingbird:
    label: कोलिब्री
    summary: विश्व का सबसे छोटा पक्षी जो स्थान पर हवा में रहने और पीछे की ओर उड़ने में सक्षम है।
    info: एक लाल-गला कोलिब्री एशिया में घने अपने आम तौर पर उत्पादित एकमात्र कोलिब्री का प्रजाति है। इसके पंख 53 बार प्रति सेकंड हिलाते हैं, जिससे एक चिह्नित ध्वनि उत्पन्न होती है। यह फूलों के रस और छोटे कीटों पर खाद्य गुण भरता है; इसका हृदय 1200 बार प्रति मिनट ठोकर मारता है।
  animal.owl:
    label: सोवा
    summary: रात्रि में शिकार करने वाला पक्षी हैं जिसमें गोल आँखें, चुपचाप उड़ाई और अद्भुत सुनवाई होती है।
    info: उत्तरी अमेरिका की सबसे बड़ी नीड़ है 'ओथर द ग्रेट'। सोवाओं की आँखें घूम नहीं सकतीं, इसलिए वे अपनी छोटी गर्दन के साथ 270 डिग्री तक घूम सकती हैं। उनकी खास पंखों की संरचना के कारण ये चुपचाप उड़ सकती हैं।
  animal.parrot:
    label: पापूशेक
    summary: एक रंगीन उष्णकटिबंधीय पक्षी होता है जो कि ध्वनियों और मानव भाषा के अनुकरण कर सकता है।
    info: आरा शरलौटोवी दुनिया के सबसे बड़े पापूशेक में से एक है जिसमें पंखों का फैलाव एक मीटर से ऊपर होता है। इस प्रजाति लैटिन अमेरिका के उष्णकटिबंधीय घने जंगलों में रहती है। पापूशेक में अद्भुत बुद्धिमत्ता होती है - आरा रंगों, आकृतियों को पहचान सकता है और गिन सकता है। इसकी आयु तकरीबन 75 वर्ष तक पहुंच सकती है।
  animal.peacock:
    label: पाव
    summary: मुर्गे का पूंछ जो सजीले रंगों से भरा हुआ है।
    info: भारतीय महाद्वीप के मूल निवासी पाव के पुरुष अपनी लड़कियों को आकर्षित करने के लिए अपने पूंछ को फैलाते हैं - वास्तव में इसमें खाल के बढ़े हुए चूंचे शामिल होते हैं। इरिडिसेंट रंग पिगमेंटों से नहीं, बल्कि प्रकाश के ऊपर माइक्रोस्ट्रक्चर्स पर झुकाव से उत्पन्न होते हैं।
  animal.penguin:
    label: टूक्नाक
    summary: दक्षिणी गोलार्ध से उड़ने की असमर्थता वाला पक्षी, शानदार तैराक।
    info: टूक्नाक सबसे बड़ा होता है; इसकी ऊंचाई 1.1 मीटर से भी ज्यादा होती है। यह एंटार्कटिक में रहता है और ठंढ़ के मुख्य ऋतुओं में अण्डे रखता है - पुरुष टूक्नाक अपने पैरों पर अण्डे रखकर पूरी एंटार्कटिक ठंढ़ तक उन्हें गर्म रखते हैं। पानी के भीतर यह 30 किमी/घंटा से भी अधिक गति तक पहुंच सकता है।
  animal.toucan:
    label: टुकान
    summary: उष्णकटिबंधीय पक्षी जिसमें एक विशाल रंगबिरंगे मुँह का होता है।
    info: टुकान ओब्रोवस्की सेंट्रल और साउथ अमेरिका के तूफानी जंगलों में रहता है। इसका ध्यान आकर्षित करने वाला मुँह 20 सेमी से भी अधिक लंबा होता है, लेकिन बहुत हल्का होता है - यह वायु सभागों से बना होता है। यह शरीर के तापमान को नियंत्रित करने, फलों को काटने और दूसरे टुकानों के लिए दृश्य संकेत के रूप में काम करता है।
