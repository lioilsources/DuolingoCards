lang: sa
pivot: false
title: पक्षीनि
cards:
  animal.albatross:
    label: एल्बाट्रॉस
    summary: इच्छति ओशनखण्डे चलिण एकमें सबले करनी हुई पंछि
    info: अल्बाट्रॉस एकमें सबले करनी हुई पंछि महत्तमा कोपरिक विस्थारणं जगद्‍विख्यातः। अधिकानं आयुष्मान्‌ इच्छति ओशनखण्डे चलिष्यति शत सहस्र किलोमीटर भौमजनित गति द्वारा। ई धरिपथ ऊपर झाँड़ घुलित जल और फिर ठोस नाक ग्रंथि ऋजुकरण ऑफ ऐल्बाट्रॉस नाहीं अभिशाप नौसंघ धर्म
  animal.budgerigar:
    label: औंढुलका
    summary: छोटा और उबड़ -खाबड़ एशिया के छोटा पक्षी
    info: |-
      अंडुलका विल्नाती पूरे समृद्धि केशर मनोहर हवा के रखरखाओतय।
      एगो अफ्रीका के आसपास के भौज़्य जटाई बच्चा हई।
  animal.canary:
    label: कैनारी
    summary: छोट जल्लो रंग के गाङ्गे पक्षी
    info: |-
      कैनारी के घरेलु प्रजाति मध्यसिका सदृश होत। इमलय शहपचवड़ी बंगट अथवा नीबुआई -भूरे वरण के जंगली कैनाड़ी से उत्पन्ह होइए।
      अफवासी द्वारा चयनाधारिट प्रजनन झेमन आऊ खाऊ गोष्ठी भेष एकठ छोट ओढ़ाओ और फौजीखन ऑक्सीड के थाँ ऐतिहासिक ढंग से खाणी से उपयोग करे गेळ
  animal.cassowary:
    label: कासुअर
    summary: एशिआई और ऑस्ट्रेलिअन के बगरखोर पक्षी के तीखे खाँचे
    info: |-
      कासुआर एवं के प्रजनन स्थलीय है।
      इसमें मोटा हड़िये कपाल होता है जिनका उद्देश्य घने वन में भ्रमण के रहता है।
  animal.cockatoo:
    label: काकतुअ
    summary: ऑष्ठलया में ध्यान आवश्चक ज़्हटि‍ऊनी बचम वाला एगों बीज पपीया
    info: "काकतुआ येलो हैड के परिवार में सबले पपीया में से एगों।\nउसके ध्यान आवश्चक ज़्हटि‍ऊनी बचम उद्गार अथवा भयभीति के समय ऊपर के ओढ़ई देत。\nइ बुद्धिमान हए और माणवक श्रृंखला के इमिटेसन कर सकओ। \nजेडँ फङ्हल में 80 घण झाि खाऐ छल ऑष्ठलया में फळ नुकसान करे वाला जीव थेप जाथे"
  animal.condor:
    label: क़।ॼয
    summary: उठामा ૺௌ೾් ೠೀ೟ ಪಽೊ
    info: |-
      अंदेज़ कोण्डर दुनिया मे सबसे बड़ी पक्षि है।
      यह एगो चमारा हवलखोर है और वह ठंढे श्रेगोचरों के मज़्भत खाके अपने पोषण के ले आश्रित रहथे,
      इसके भास्पर नए ऊधर धारा मे उछलते हई ओर इसके पंखों के झटका छोड़े बिहने घुमथे।
  animal.crane:
    label: झाँई
    summary: आगमन और ऊठाहट खास ढंग से ऐसा ठीक था
    info: |-
      अनुक्रमिक रूपेण करोड़ों हजार मीटर पल्ले सहित एवं गति विशिष्ट या पशच्‍छादयिन्।
      उसके अद्भुत आगमन और जाइबे के समय चलने बढ़ते हैं।
      एष उभयधिमास ओर फलखण्ड ऋतुओं में घनघोर झुंड धरिपथ छोड़ते हैं।
  animal.crow:
    label: वर्णा
    summary: अफलास श्वेष्ट घर के दिमागी कार्य सुधारने वाळा
    info: "वर्णा एक प्रजाति से कॉलेडियस होती जनशुमारी महत्वपूर्ण बुद्धि।\nयह मानवचेहरा पहचान सकता हैं, औज़ारों का इस्तेमाल कर सकता हैं अउ भटकभरण कार्य सुधार सकता हैं। \nएगो गठबंधन ओथवा छोटे समूह मेँ ठाट खाकर आऊ चापड़खोर हई।"
  animal.cuckoo:
    label: कुकुआचक
    summary: एक ऐसा छःखन्‍दी फास्टफूड है जो भिखारी धन ढूढ़ता है
    info: कुंचन निर्माण में परजीविता के समय होता है। यह अपने डबलटॉनल 'कु' के लिए जाना जाता है और इसके द्वि-ध्वनिक ब्रौड कॉल कई गणितीय आश्चर्यों के साथ शीघ्र ही घटित होगा।
  animal.dove:
    label: होऊभज
    summary: शान्ति के सिमवल; एक शुद्ध सफेद होऊभज
    info: "शान्ति के अंतर्राष्ट्रीय पुनःसमूहकला सिमवल होउपरेक मध्ययग ; बाइबल मेँ ई ओलिव शाखा लए देहल।\nई एक धर्म चिरण भी हथखड़। \nघरेलू होऊभज आदत गइल छट्ठी होऊभज हओए जाथे;\nठंढा घुष उच्च फास और झाडऩ के ऊपर ऐक ऋऋत्विप ढंग से ऑफर करे जाथे"
  animal.duck:
    label: कचेर
    summary: अछि टाळ और चौंढ़ बिना वाला जलीय पक्षी
    info: कांगना डिवोल्का संसारमें कचेरी प्रजाति है। मुदा (कचेर) के लक्षणपूर्ण चमत्कारी हरियोहीय शिखर हवे, अउ सखी नीरसभए भूरी हवई। एड़बुइ जलशाब्द कचेरी हवई आऊ ओर गहिराइमे घुटाउथे के ऐठे ऊपरी छेपमे झाँके थे धामधुआ ढंगले ठाहरे फूड खासे
  animal.eagle:
    label: ओरल
    summary: एक बड़ा मांसाहारी पक्षी हुक्ड चोंच अउ तिकोन दृष्टि सहित।
    info: ओरल एगो नेशनल सिम्बल हवे यूएसए के अउ उत्तरी अमेरिका के सबले से बड़े शिवरों में से एक हवे। ओ खासकर मछली मारथे जे ओ ठीकठीक पानी से अपने भेदी धाँदों से पकड़थे। इ के पखेवों के फैलाव ले दो मीटर से ऊपर हवे अउ ओ प्राकृतिक रूप से लगभग 20 वर्ष झिलथे।
  animal.emu:
    label: एमू
    summary: द्वितीय विश्व के बर बर, ऑस्ट्रेलियाई अधिकारी जो उड़ाऊ नहीं
    info: |-
      एमू भारी हे प्रकरण संसार केन्द्रित मुख्यतः ऑस्ट्रेलिया।
      योजना उड़ाऊ शब्द अपलगवटे आहे, परंतु एकदम चढईच्छुक डुकर व धाऊकर बनले गेले जाई。
      भाइर घेणाऱ्या ओंघि झाकौन ठाम खासगी फाहेर थोथे ऐशी ऋषि और ढोफळ जाँइ,
      अउ वर्ष 1932 में ऑस्ट्रेलियाई सेना 'एमू युद्ध' में एक विपत्ति बनले जाई जेथे एमू फसल नुकसान करे रहले थे।
  animal.falcon:
    label: सोकल
    summary: अतीन्तुक शीघ्र जीवजाल धावन बलेऽधिक घटिस्पर्ष
    info: सोकल स्थेहवाविद भूमि पर के अतीन्तुक शीघ्र हंटर महा जीवजाल। इदं रणगच्‍छति नखः च खड़गपञ्झयश्छाया गच्छति एवं उभयथा धावन बलेऽधिक घटिस्पर्ष आठ टाढ़य ऋषि डब्ळ्युएचओ ओ ऐतिहामिक और फ्रेण्ठिङ्ञ ई ऊनेस्को ऑफिस द्वारा अभिलेखित।
  animal.flamingo:
    label: फोएनिकोप्टेरस
    summary: हल्का रंग का पक्षी मुख्य आधार पर सेंटौरस जीनस है।
    info: फोएनिकोप्टेरस के शरीर का विशिष्ट गुण उनके भोजन में निहित कृमिद्रव्यों और लाल चट्टानों से प्राप्त कैरोटीनॉइड्स के कारण होता है। इनके बच्चे एक छाया रंग में जन्म लेते हैं और धीरे-धीरे अपना विशिष्ट रंग प्राप्त करते हैं। झुका हुआ खाँस फ़िल्टर के रूप में कार्य करता है - फोएनिकोप्टेरस अपने सिर को ऊपर से डालकर पानी से भोजन छानता है।
  animal.goose:
    label: हुसा
    summary: भौमिक प्रजनन और झुंड में खामोशी
    info: "हुसा वेलकाह हे मन्दिर करूण प्रजनन संतति धीमोदय।\nएगोचला अपवास नियमित बदलत जाई। \nइतिहास में एखड़ा गई छल भी इटली के कॉफिटल में शब्द चढ़ाऊ आउषधि"
  animal.hawk:
    label: जेस्ट्राब
    summary: झीठर ऑफ्‍फ जंगल आऊर खेत में उछले झीठर आऊर चारे के शिकार करे
    info: जेस्ट्राब अकिपीटर के संवतन होय। पुष्किन में उड़ाईमनि लगभग चौघल वस्तुओं के दबइए ओखल जहाँ रहे यथेष्ठ गति आऊर एपचलता होय। इउ झीठर घण छोट और फैले हुआ पंख भी धरे थे ऐशे शाखा ऊपर डामर ढंढे ऋद्हि से
  animal.heron:
    label: वोलावका
    summary: ऊँचा धामरदाढ़ जलचर जो ठण्डे ऐश्वर्य के साथ मछलि के लिए खड़ा रहता है।
    info: |-
      वोलावका सीनेरिया मध्य इूरेशिए का प्रमुख बड़ा जलचर है।
      यह लगभग पत्थर के रूप में अटूट खड़ा रहता हैं और तब डगमगाह आए फिसले दस्ते के भीतर चले गई मछलि को झटके से नष्ट कर देता है।
      इसके ओठ उजाऊ मछलि और छिपकलिका को पूरी तरह से घुला देते हैं।
  animal.hornbill:
    label: भुकरोटिका
    summary: उष्णकटिसम शब्द झण्ठा धनुश्‍चक्र लक्षण
    info: |-
      भुकरोटिडे नामक प्रजन का सदस्य है।
      वह मध्यम आकार की चपेटा वलय दंति छड़ी और एक बड़े खग्रथ के साथ अफ्रीका तथा भारत के उष्णकटिसम जंगलों में पाया गया है।
  animal.hummingbird:
    label: कोलिब्री
    summary: विश्व का सबसे छोटा पक्षी जो स्थान पर हवा में रहने और पीछे की ओर उड़ने में सक्षम है।
    info: एक लाल-गला कोलिब्री एशिया में घने अपने आम तौर पर उत्पादित एकमात्र कोलिब्री का प्रजाति है। इसके पंख 53 बार प्रति सेकंड हिलाते हैं, जिससे एक चिह्नित ध्वनि उत्पन्न होती है। यह फूलों के रस और छोटे कीटों पर खाद्य गुण भरता है; इसका हृदय 1200 बार प्रति मिनट ठोकर मारता है।
  animal.ibis:
    label: ईबिस
    summary: झील खोजए और प्राचीन मिज़्मध्य में पवित्र ठहराओ
    info: |-
      ईबिस थ्रेश्कीओरनिदाई परिवार का सुवि‍शेषक लंबे मोड़दार चखलू हर।
      प्राचीन मिज़्मध्य में इसे धरतीच बहुभगवान तोथ के अवतार के भागया उपासना करे घटा।
      इबिट झील आऊर डेल्फा में एक समृद्धि छापा।
  animal.kingfisher:
    label: कील
    summary: जेहरा चमचमाऊ ध्रुव झील आऊर घाटी में मछली के फटकदार पक्सई
    info: |-
      रिवर कील यूरोप में सबसे हंगामा पक्षि में से एक है। इनमें बिजली के नीले पँख और लाल छाती होती है।
      वह पुष्पयुक्त शाखा पर ठहरता है अउ पानी के भीतर मछली के देखता है;
      फिर उड़कर डूब गइथ।
  animal.kookaburra:
    label: लेड्नियाचक समझौता
    summary: अस्ट्रेलियाई पक्षी जो मानवीय हास्य जैसो ध्वनि बजाईएको
    info: |-
      लेड्नियाचक समझौता कुकबर्रा एउटो महादेशीय पक्षि होइनस्‍पष्ट रूपले माफ़िक आवाज़ बजाईएको।
      ऊ अधिकाँशदेखि भगवंत गड्ढामा विहाल्छ तथा ऊचई उठाइएको ध्वनि सृष्ठि घण्टा थाप्सको और झील ओढऩे ऋतु ऐघाण्डा।
  animal.lorikeet:
    label: लोरी
    summary: ऊष्मापौर्डशीय झाटर ओर पराग सभक धारक ऊपर ठठेर घन ऐछे ढल ऋई
    info: |-
      लोरी एक प्रजाति हैंगुना के स्थिरतम में नसबदरह जो उष्णकटिबंधीय फूलों से शर्करा और पराग सँखड़त ह।
      वे अपने विलक्षण चमचा आकार के भासे के साहिये इउ खाद्य पदारथ छुएत ह।
  animal.lyrebird:
    label: ल्यूरोकवास
    summary: ऑस्ट्रेलियाई पक्षी जो कोठी ध्वनि बराबर अछि
    info: |-
      ल्यूरोकवास निरी हा प्रखंड समुदाय केवळ महत्त्वपूर्ण शब्दचयनशीलता आणि असामान्य ध्वनिक इमिटेशनचे उत्पादन करण्याची एकटी छाजगई भागधाल घेऊन ओळखला जाईल।
      अभिषेक बजाडे खासकरून फोटोग्राफिक ऑफिस झाहर ठेवलेल्या थोथे आऊट और ऐएआउट ऋषि ढेर विविध ध्वनिक अनुकरण करतात。
      इसके लिए ऑस्ट्रेलियाई राज्य विक्टोरिया के राज्य प्रतीक के रूप में चुना गया है।
  animal.macaw:
    label: अरा
    summary: उष्णकटिबंधीय अमेरिका के एक बड़े पक्षी जिसमें चमकदार पंख होते हैं और एक मजबूत चोंच
    info: |-
      अरा अमेरिकामधील प्रकृति कोणळ्यांचे महापुष्ट हंसपटवा आहेत; सगळ्या पक्ष्ियाच्या बरोबरीने विस्फोटक रंगाने भरलेले झडपदार धजागे ठेऊन।
      एखाद्या जोरदार खाडकशा मुठभर ओढणाऱ्या शिङ्गाऐवजी एक घोर ढाण उघडण्याइतका मजबूत छाँई असतो。
      आयुष्यभर थेट जोडीने राहतात,
      फाईल और विदेशी प्राणी व्यापार द्वारा उनकी आबादी खतरे में है।
  animal.magpie:
    label: स्ट्रेका
    summary: एकतला-श्वेत पक्षि धुरीय हरीय पृष्ठ घटित पूँछ सहित
    info: |-
      स्ट्रेका ओबेरनाही पक्षि है किरकोवचुआइट संघ में। इसमें एकतला -श्वेत आभा और लंबा हरीया चमकदार पूँछ है।
      एक उज्ज्बल वस्तुओं के डकैत कहे गए हैं, लेकिन अध्ययन ऐसी कथा को सत्यापित नहीं करते。
      अपने दर्पण में पड़े छवि को पहचानने वाले खग्रह पक्षिमाण्‍डल में शास्त्रीय भाव है।
  animal.nightingale:
    label: स्लावीक
    summary: छोटा भौरा पक्षी जो पक्षियों के सभी ध्वनिक झंक्ठ में से एक ऐठ ऊँचे गुणवत्ता वाही ध्वनि दे़।
    info: |-
      स्लावीक ओबेनेरा मनोहर प्रजाति सुगंधिर हलू कमचट्‍यपतः।
      अव अखिद्य शब्बदश एवं उषण्डे गाथथे,
      एवं जन इम आइडिस फ्रैम ऑफ टामन्च और भाङ्ख्छ घोषिण।
  animal.ostrich:
    label: ॐफलेस कैमिलस
    summary: अश्वत्थ बर्ड जगत्‍को महान पंछी हे
    info: ओम्फलेस कैमिलस जगत्‍को महान पंछी हे। सरपुचा अवयवनि द्विपद चलन तथा भार एटः 150 किग्रा आधिक्य छई। इउ उडइबए बर शकत ओन्हर झऊ खण्ड घले और धामन ऊपर टखन ऐठे थोज ठाणि ढोढे ऋषभ ष्ि ऑफ ऑल बर्ड एग्स ँ।
  animal.owl:
    label: सोवा
    summary: रात्रि में शिकार करने वाला पक्षी हैं जिसमें गोल आँखें, चुपचाप उड़ाई और अद्भुत सुनवाई होती है।
    info: उत्तरी अमेरिका की सबसे बड़ी नीड़ है 'ओथर द ग्रेट'। सोवाओं की आँखें घूम नहीं सकतीं, इसलिए वे अपनी छोटी गर्दन के साथ 270 डिग्री तक घूम सकती हैं। उनकी खास पंखों की संरचना के कारण ये चुपचाप उड़ सकती हैं।
  animal.parrot:
    label: पापूशेक
    summary: एक रंगीन उष्णकटिबंधीय पक्षी होता है जो कि ध्वनियों और मानव भाषा के अनुकरण कर सकता है।
    info: आरा शरलौटोवी दुनिया के सबसे बड़े पापूशेक में से एक है जिसमें पंखों का फैलाव एक मीटर से ऊपर होता है। इस प्रजाति लैटिन अमेरिका के उष्णकटिबंधीय घने जंगलों में रहती है। पापूशेक में अद्भुत बुद्धिमत्ता होती है - आरा रंगों, आकृतियों को पहचान सकता है और गिन सकता है। इसकी आयु तकरीबन 75 वर्ष तक पहुंच सकती है।
  animal.peacock:
    label: पाव
    summary: मुर्गे का पूंछ जो सजीले रंगों से भरा हुआ है।
    info: भारतीय महाद्वीप के मूल निवासी पाव के पुरुष अपनी लड़कियों को आकर्षित करने के लिए अपने पूंछ को फैलाते हैं - वास्तव में इसमें खाल के बढ़े हुए चूंचे शामिल होते हैं। इरिडिसेंट रंग पिगमेंटों से नहीं, बल्कि प्रकाश के ऊपर माइक्रोस्ट्रक्चर्स पर झुकाव से उत्पन्न होते हैं।
  animal.pelican:
    label: पेलिकान
    summary: जल में ठठाहरे ऐसा बड़ा पक्षी जिसके चोंटवार दन्तमध्य में मछली के लिए थैला होता है।
    info: "पेलिकान एक प्रचुर मछली के संग्रह हेतु वैशिष्टयता युक्त बड़े जबरदस्त चोंटवार दन्तमध्य धारण करता है।\nइसके गर्भ में अधिकतम 13 लीटर जल आए सकते हैं; फिर इसे उखाड़कर मछली खाओ जाता है। \nअभिसरण शक्ति और ऊष्मा झंझावातों के घनघोर ढाँढ़स के उपयोग द्वारा यह छापा बनाता है।"
  animal.penguin:
    label: टूक्नाक
    summary: दक्षिणी गोलार्ध से उड़ने की असमर्थता वाला पक्षी, शानदार तैराक।
    info: टूक्नाक सबसे बड़ा होता है; इसकी ऊंचाई 1.1 मीटर से भी ज्यादा होती है। यह एंटार्कटिक में रहता है और ठंढ़ के मुख्य ऋतुओं में अण्डे रखता है - पुरुष टूक्नाक अपने पैरों पर अण्डे रखकर पूरी एंटार्कटिक ठंढ़ तक उन्हें गर्म रखते हैं। पानी के भीतर यह 30 किमी/घंटा से भी अधिक गति तक पहुंच सकता है।
  animal.pheasant:
    label: বাইদ্
    summary: उठलता झझकी छोई ; महाक ऐसा ठीढ़ रंग और लम्बा पूच्ढ होता है
    info: "बाजन्त ओविना प्रकृति में कोलचीस से हरण करके युरोप में लाए गए।\nमहाक बज़्यंट अदभुत रंग वाला शरीर और आखों के चारों ओर भड़कते ऊष्ण धब्बे होते हैं। \nअधिकाँश उछलते पक्षिमन इस देश में फैले हुए हैं और डाटापासन की पारंपरिक घटना के लिहाज से खूब महत्व है।"
  animal.pigeon:
    label: अंगूर
    summary: आम धूसर चिड़िया जे शहर एवं ग्रामीण क्षेत्रमन निवास करई छई , जे शैल अंगूर ले उत्पत्ति छई
    info: "शैल प्रस्तर गुफा होने कारण सभी महानगरपंचक एवं विलटेकड़ियम्‍बत बदखरज घरेलू चिड़ियामध्ये अघ्ण जनक।\nएषः पहिला आश्रिष्ट उड़ान धारक छिदँ ; इथर शताब्दिभइ फौजदारी खबर पठाहउ थे ओछा और ऊ झि ऑपरेसन ठीक ढंग से करई ऐतिहासिक ऋण छिदँ। \nऊ अद्वितीय नेविगेशन सेंस रखई छई आओर ऊ शतकीमी किलोमीटर दूरी से घर लौट आवई शक्ति रखई छई।"
  animal.puffin:
    label: फ्रातेरकुएला
    summary: हिम ऋतु के रंगबिहान मुड़ वाला नामर पंछि
    info: "पैलरेक्टी फ्रातेरकुएला हिम कोन पंछि महसूर सँगट रंगबिहान बखमवाला मुड़।\nयईजन डुबत अउ गदर चढ़िथे मच्छर के झण्‍डा खाइत जे एक वास्थि मुड़ म सभ मच्छर उठइत। \nऊ शिळा दुआला ढेर आऊ घर म ठाय भीजत हवे。\nऊ आइसलैंड और फ़ेअरओ द्वीप के ध्वजा ओघर हवे"
  animal.quail:
    label: खरगोशपक्षी
    summary: एक चमचमीला और झुठलाऊ घाटी के फँसाओं में ठण्ढक ऋतुओं में ऐसा था
    info: |-
      कोटर्निक्स कॉटर्णिक्ष जाति से प्रसिद्ध हलुआईया में भीतरी अफ़्रीका में शीतकालीन।
      इसके डबडबे आहार के बजाय इसके छोटे गोंदवले वाहक खाए जाते हैं।
  animal.raven:
    label: |
      कृष्णश्वनिह
    summary: अफलाहरण ऊघ्र झाँझर डाढ़े फुईठे
    info: |-
      कॉर्वस कोराक्स नामक प्रजाति में सबले हड़ताली शवनिया पंछी कहलाए जाते है।
      यह अद्भुत रूप से बुद्धिमान्‍ होते हैं और आगमी घटनाओं के बारे में चिंतन करने,खेलने और सामाजिक बधन खीचने की क्षमता रखते हैं。
      उत्तरी देवी-देवताओं(ओडिन के कौए हुइगन और मुनिन), केट कथाओं में इनका गुढ़ छापा था।
  animal.roadrunner:
    label: भौमिष्ठ कैकदश्चक्रपथः
    summary: '''अमेरिकेशन डेझर्ट्स एण्ड फाल्गोइन विद बच्छा'''
    info: कूगोल्का भुमि महान् केज़ेकसी हिस्टरियन संबंधी प्रजाति अतएव 'रोड' रनर इटलीयन।
  animal.robin:
    label: रक्तपिञ्गल
    summary: एक ऐसा पक्षी भी है जिसके बफर क्षेत्र में आई हुई धौंस और इंग्लैंड के युल घटना के टोटम डाक्पत्र थे।
    info: रक्तपिंजल एवं प्रसन्न सुगम है। कामचोदा में खड़े लोगों की ओटहति जीव चुञ्छय् अथवा उभयधिष्ठिरण शब्दशः विस्फोटन करते हैं।
  animal.seagull:
    label: रेसक
    summary: एग्रिडाइटस्
    info: |-
      रेसक एग्रिटातस् पश्चिमी समुद्रतटों मे कॉलनिया बनाने वाला हवेलि है।
      यह अपने खाद्य आचरण मे जबरदस्त रखड़े और शिकागो भी है।
  animal.secretary_bird:
    label: अफ्रीका सेरिटैटर पक्षी
    summary: उष्णकटईय डगधर बर्हण्‍छ आकाशीय ध्वजा
    info: |-
      प्ताचेक सेरिटैटर एक महत्वपूर्ण पशु होना कि जीवनयापन खुले घासभूमि पर।
      इसके दबदबे नखड़े औजार के भाँति होना अफ्रीका के सर्फेल या गुच्छा कथं उठाइए।
  animal.sparrow:
    label: वरबेच
    summary: चिमनी के पास ठाहरे भूरे खस खाऊने तथा ध्याँ उठाओने वाळा झीण श्रेष्ठ
    info: वरबेक डोमाटिस पृथ्वी के सबसे अधिक हुएकता मनखंड़ियों में से एगो हई। ई मनखंडियों के नजदीक रहल और दीवाल आऊर छपर के फटों में घोंघा बनइत जा गई।
  animal.spoonbill:
    label: बिराला
    summary: एक ऐश्वरिक ढंग से टिस्टर वाला ठंढा ऋद्धि
    info: |-
      कॉल्पीक बिराला प्रजन से हमेशा कुछ मतभेदों के कारण अपवर्जित हो गया।
      उसके खोजने के विधि में एक छड़ी के आकार के नथुआ के सहायता से चलना और घटाई भूख के ऊष्मा के फैलाओ के इच्छा से झील में डगमगाह था।
  animal.stork:
    label: चिकोनिया
    summary: अघला सफेद पक्षी जेकर लाल मुळक हई
    info: |-
      चिकोनिया साइकोनिआ एवं पूरे युरेशय म ह कमीटि चढ़ते हए छप्रलख्न बड़ा तथा सफेद पक्षी।
      इसका विस्थापन उष्णकटिबध्‍द अफ्रीका म होता हई जहाँ ई ठण्डक गजग करता हई,
      आऊर फरीबर ऊ घर लौट भए रहता हई ऐश झि धीरे - धीरे ओठता ऋऋतुओं के सभी खबरों म हई और
      उत्पादकता के प्रतीक हई;
      popular tradition म िछप्रलख्न बच्हों के लाटा म मदद करता हई।
  animal.swallow:
    label: वल्सटोका
    summary: ऊपरी दिशा में धाड़ी और छोटे टखने फैलाए ऐसा झीला जो ठीठी ढीठी थोड़े ऑस ले जाता है।
    info: |-
      वल्सटोका ओबेनाया हिमपर के समय पूर्वी अफ्रीका में रहती हैं।
      इनका उड़ान कुशलता का प्रतीक है;
      चीथड़िए कोई भी जगह बिना लौटे खाती हैं,
      और एकदम से ऊपर से पानी पी गजरती हैं。
      अधिकाँस घरों में इनका आवाहन शुभकामना के चिऩ्‍ह के रूप में माना जाता है।
  animal.swan:
    label: लापुटी
    summary: ऊँचा इष्ट घनघर झील फौजी, ऐश्ठेसिड़ ऑफ़ थेर्मल ढलान
    info: |-
      लाबुटी वेलका हेर्मनियम सबसे महत्त्वपूर्ण पंछि कोई नयी जगह खोजत।
      एकदम सच्चाई और प्रणय के प्रतीक हेर्मनिएवला;
      अख़्खड़ रूप से अभिभावक शिकाओं के उठाऊ आश्छर्द्धा गढ़त।
  animal.toucan:
    label: टुकान
    summary: उष्णकटिबंधीय पक्षी जिसमें एक विशाल रंगबिरंगे मुँह का होता है।
    info: टुकान ओब्रोवस्की सेंट्रल और साउथ अमेरिका के तूफानी जंगलों में रहता है। इसका ध्यान आकर्षित करने वाला मुँह 20 सेमी से भी अधिक लंबा होता है, लेकिन बहुत हल्का होता है - यह वायु सभागों से बना होता है। यह शरीर के तापमान को नियंत्रित करने, फलों को काटने और दूसरे टुकानों के लिए दृश्य संकेत के रूप में काम करता है।
  animal.woodpecker:
    label: दतेल
    summary: उस पक्षी के जो वृक्ष के छाल पर ठोकर लगाके कीड़ाओं के खोजे या गुफा बनाए
    info: |-
      दतेल एक प्रजाति हैं के स्पीसियोना मुँहलगामी जो दरखवाहट कमबख्वार अपने कठोर चोच और कड़े पूछ के साधन।
      भाषण इतना गुना बढ़ाए छोईयों के आधान खोलने के उद्घष्टि भी शाकाओं के झुकाऊ फासला डाले।
      इश ठोकर ढंग से अपने ऐलाका के चिन्हित करे और संचार करे।
