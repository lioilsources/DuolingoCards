lang: vi
pivot: false
title: Chim chóc
cards:
  animal.eagle:
    label: sếu
    summary: Chim ưng lớn với mỏ cong và thị lực sắc bén.
    info: Sếu đầu trắng là biểu tượng quốc gia của Hoa Kỳ và là một trong những loài chim ăn thịt lớn nhất tại Bắc Mỹ. Nó chủ yếu săn bắt cá, thường bắt cá trực tiếp từ mặt nước bằng móng vuốt sắc nhọn. Sải cánh của nó có thể lên tới hơn hai mét và trong tự nhiên có thể sống khoảng 20 năm.
  animal.flamingo:
    label: plameňák
    summary: Chim bơi lội màu hồng đứng trên một chân trong vùng nước nông.
    info: Màu sắc đặc trưng của plameňák růžový đến từ các carotenoid có trong tảo và động vật phù du mà chúng ăn. Ấu trùng sinh ra có màu xám trắng và chỉ dần chuyển màu theo thời gian. Mỏ cong của chúng hoạt động như một cái lọc – plameňák lọc thức ăn từ nước bằng cách cúi đầu xuống.
  animal.hummingbird:
    label: kolibřík
    summary: Chim nhỏ nhất thế giới có thể lơ lửng tại chỗ và bay lùi.
    info: Kolibřík rubínohrdlý là loài chim duy nhất thường xuyên làm tổ ở miền đông Bắc Mỹ. Nó vỗ cánh lên đến 53 lần mỗi giây, tạo ra âm thanh tí tách đặc trưng. Nó ăn mật hoa và côn trùng nhỏ; tim của nó đập đến 1.200 lần mỗi phút.
  animal.owl:
    label: sova
    summary: Chim ẩn mình ban đêm có mắt tròn, bay thầm và thính tai tuyệt vời.
    info: Výr velký là loài cú lớn nhất ở Bắc Mỹ. Mắt của cú không thể di chuyển, vì vậy chúng xoay đầu tới 270 độ thay vì đó. Cánh của chúng có cấu trúc đặc biệt giúp bay gần như thầm lặng. Chúng săn mồi vào ban đêm nhờ thính giác cực nhạy.
  animal.parrot:
    label: đà điểu
    summary: Chim nhiệt đới sặc sỡ có khả năng bắt chước âm thanh và tiếng người.
    info: Đà điểu đỏ là một trong những con chim bồ câu lớn nhất thế giới, với cánh rộng hơn một mét. Nó sống trong rừng nhiệt đới của châu Mỹ Latinh. Chim bồ câu có trí thông minh phi thường – đà điểu có thể phân biệt màu sắc, hình dạng và đếm. Tuổi thọ của chúng có thể lên đến 75 năm.
  animal.peacock:
    label: páv
    summary: Con đực của loài công có đuôi hình quạt đầy màu sắc.
    info: Công xanh đến từ bán đảo Ấn Độ. Con đực (công) sẽ xòe đuôi của mình – thực chất là những lông phủ dài – thành hình quạt khi thu hút con cái. Màu sắc lấp lánh này không phải do sắc tố mà do hiện tượng khúc xạ ánh sáng trên cấu trúc vi mô của lông.
  animal.penguin:
    label: đà điểu
    summary: Chim không biết bay ở bán cầu nam, bơi rất giỏi.
    info: Đà điểu hoàng đế là loài đà điểu lớn nhất, cao hơn 1,1 mét. Nó sống ở Nam Cực và đẻ trứng trong điều kiện lạnh giá nhất – con đực ấp trứng bằng chân suốt mùa đông Nam Cực. Dưới nước, nó có thể bơi với tốc độ hơn 30 km/h.
  animal.toucan:
    label: tukan
    summary: Chim nhiệt đới có mỏ to và nhiều màu sắc.
    info: Tukan to sống trong các rừng mưa nhiệt đới của Trung và Nam Mỹ. Mỏ nổi bật của nó dài hơn 20 cm nhưng rất nhẹ – được cấu tạo từ các khoang chứa khí. Mỏ giúp điều hòa nhiệt độ cơ thể, bẻ quả và làm tín hiệu thị giác cho các con tukan khác.
