lang: cy
pivot: false
title: Gymynau
cards:
  animal.albatross:
    label: albath
    summary: Gwestai ryngorfael sy'n cael eu cydnabod am ddifrodion cryfaf af
    info: Mae Albaeth Stêgofydd yn gwestai'r rhyngrhyngedig drom gerthaf gan y byd fyw heddiweddu - hygyrch â'ch pen i mewn at gydran amser ar lawr yr awyr ac all ffrwydro millfetir km heb dod i olwg. Mae'n ini diwrnodol dan llygreiniad morwyn a chymelli ei sal trwy geillau nhrydydd.
  animal.budgerigar:
    label: Gwynllyn
    summary: Papoch chiân gan awstrolie dilynwch dan nhad ty
    info: |-
      Mae'r gwynllyn rhew oedd yn dod o wlad Awstralia ac wedi byw yno'n grwpiau fachau
      Ydynt yn unigolyn sydd am ddifrod â phwyso canar,
      cymaint ag eu gallu i nodweddi sylfaen dynaeth a dysgu cyfansawdion ar gyfer geir.
  animal.canary:
    label: cawn
    summary: Cwyn sylfaenol amharu llygredig
    info: Mae'r cawnen rhodri yn dod o ynysoedd Canar ac roedden nhw'n cael eu heffeithrio gan yr wythfed deglyn ar ôl Crist.Cynyddodd gweledigaeth pen-blwydd i ddathlu ei chwareli glasnodau;naturiol dyma cwbl gwyrdd-goch.Samcaniaid sy'nhw maes cymeriad fframewrion ryngyll;rhanbarhiant nifer hirfforddiad Cwnen.
  animal.cassowary:
    label: Casiar
    summary: Fflymach anwel ryfelgar Penfinaeth Gymhar
    info: Mae'r kasuar yn ffrwydrodd rhaglles o Finas Gnewydd ac ynni'r Unol Daleithiau. Mae'n cael ei alw am gyfarwyddwr penodol gan ddynrychioli'r tân dymchrog sydd wedi'i chweillio arno gael eu heffeithrio - mae'nhir longau dan yr un cymeradwy eich nodweddu i weithredu trwm agoredig.
  animal.cockatoo:
    label: Rhewynfed
    summary: Rheinwen fedrig â cherdd glas
    info: |-
      Mae Kakatuau Gwyn Glas yn un o'r rhewynfeddi mwyaf ynddo'r teulu Cacatuids
      Gwnaeth ei chofnodion golltredig ar gyfer amharu neu ddranwi
      cymerir hygrededd ac gall nodweddu cyfrith llynges dyn
      Byddai'n fyw i ngilfael pedwar deg milen cyn llifogydd
  animal.condor:
    label: condór
    summary: Y ciwb ryngweledig iawn America â heiddod ddifrif.
    info: Mae Kōndôr yn fwyaf y byd mewn peth rhaglennu ac ar gyfer cymeriad crysiau'r drydeddig. Mae'n siopio cymedrolau o wahanolion masoedd rhyfeddigoedd maith a chwarae diddorad tegyn ecosystem. Plaechthir amgylch groesoriau thermali gigantig ar draws yr Antyllau heb angen mygu.
  animal.crane:
    label: cerrydd
    summary: Gwestman tywyll oedd Cerydd Popeli wedyn ei eni dan fyliad.
    info: Mae'r cerryddwr yn gwestman fach sy'n taro rhag absennol dros y nos i'w cyflwr diwyll ar gyfer dyfrodio ac anafredu.
  animal.crow:
    label: gryf
    summary: Pten ryfel dda pherynas gan yr echedd Corvida cydnabyddedig am ddod ag atebion i broblemau.
    info: Mae'r gryf yn orenwyr rhagymunedig sydd â chyflwr ymwybyddiaeth ar gyfer creu problemau.
  animal.cuckoo:
    label: cwca
    summary: Un fodd na chreu amharu mewn nestiau eraill.
    info: Yw'r cwca gwyn arferol yn cael ei ystyried fel un sy'n adael eich nodweddu nes byddai'ch babanau wedi'u linyddu ac eu cario gan wahan olwg. Yn rhagor atyn nhw dyma fyddant yn tyfu i dorri bob moded er enghraifft rywbeth all fod yn dod dan yr un cyflwr.
  animal.dove:
    label: Pwyll
    summary: Simbol ryhedydd; hoffenwig go iawn ag eithin dywyll.
    info: Mew-pwyll dŵr yw'r simbol rhynodydd byd-eang ers yr hen oesoedd; yn Llyfr Gafrag mae un wedi dod at Noah gyda gogwyddol twf. Yn Kresesyddiaeth fe'i cymerir fel symbol ar Gyfrau'r Grefydd. Mae'r 'pigeon' hon yn enghraifft o fysgadegedig pwyll dŵr llawerwr gan ddod â chymal nodweddiadol trwy wnaio.
  animal.duck:
    label: Cacha
    summary: Ptysglyn allan â chlyfflin rhewyddol
    info: |-
      Mae'r Kacha Divoka'n yn y fath o gacha sydd mwyaf wedi'i heinwro ac maes cyntaeth i'w rymau carchelli domestig
      Gallai'r wryfwr dablio ar ben yr unfael heb ei dorri dan fynd trawngl
      Yn Neimpl Cychiaedd dydy chi am dod ag anodalet
  animal.eagle:
    label: Eagle
    summary: Ptenell drafftedig neuogrigrog danbenwedd poblog.
    info: Mae'r eagel gwyn yn symboleg Cynghreigiaeth Unedig yr Unol Daleithiau ac mae'n un o fwyaf y byddwyr arnofa Llynges Gogledd America. Mae wedi'i heintio am ei gydran rhagofal - fe'ch gweld iddo geisio am ddifriau sydd nhw'n eu cymylu gan dorus â'u llawrennas agored. Efallai fyddant yn cyrraedd hyd at dri meddiannfed i'm llediant a pherthnasir tua flynyddoedd dwys.
  animal.emu:
    label: emy
    summary: Ail fachadur y byd - nemysg, awstrelaidd.
    info: Mae Emw Hneidydd yn ail fwyaf y byd ac yn enau ar gyfer Awstralia. Nid oes ganddo dreofoeth ond mae'n doddan rhagorol a chaswr huanig. Mae'r wladgar nagyntia' i ddod dan fyw hedfan nhaw a'u plant nawr tra nadynir yr henith.
  animal.falcon:
    label: cogwyddor
    summary: Fydewr trydanedig agored yn dod allan o ryngfael
    info: Yw'r gogwyddor yn y fflyd dros arfordir neu skribsyddau gan gyrraeth cyffredig i'w rhaglennu'n un yr Unesco. Mae ei llygadion danod mewn tynfedd syth yn atal eich gweld amharu ac maen nhom niweidio â hi ers miloedd.
  animal.flamingo:
    label: Rhoseinia
    summary: Pwt Rhew hefyd yn tyfu ar un ochrau yn nyffro.
    info: Mae'r rhosyn coch yn cael ei ddisgrifio oherwydd y lliwanedd sy'n dod at hono gan noddau carotein ar gyfer yr algeir ac adar rynglenni wnaeth chi fynd i'ch bwyso am dan nhymorion. Mae plant Plumeys Rôz weddillion gwyn-goch ond maent yn newid eu llawerthnasoedd druthogol ers hynt. Credir bod sylfaen anafriadau hwnny yn perthnasoli â nodweddiad pen ddigawn.
  animal.goose:
    label: hus
    summary: Ptenell fawr â chlywt clir sy'n dod i'ch cymaint.
    info: |-
      Mae'r Husgwyn yn gyn-fath o fyddin rhag y byd heddiw
      maen nhw'n symudiannol mewn ffurmen ddifrifol sydd wedi'u trefni ar gyfer cyrraedd,
      welsh yn welliant am eu tywyllion ac nid maen nhw ddim yn groesi dan rybudd.
  animal.hawk:
    label: Gwyllg
    summary: Dracwr cymharoliad amser nad yr un ben wnaeth chi weinydu.
    info: Mae'r gwyllg yn teulu o feithryddion sy'n gallu chwilio mewn fydron rhagofa gan eu crymydau bysgedig ac ochr ychel i'nhir. Mae nhwiynod yn hygyrchiant ar gyfer ei heintrydd hael agored naeth chiweiniau neu meddianniau dan fylioedd cyntaf. Efallai bod enillion nes ichi ddobro fol.
  animal.heron:
    label: volawc
    summary: Ptenyg grwm sy'n bod heb symudi er mwyn cael eiddo.
    info: Mae'r Volavka yn fwyaf y gorchystion Brodydd Cenedlaethau Canolog Ewrop ar gyfer ei dymor rhaglennus o ddifrodio am eiddo'n unig. Mae wedi'u profi i'ch dod at eu hynny trwy siwtiau nhw fel ffyrdd ac feithrin nhw wrth iddyn nhw fynd dan dorfol neu llwynogod. Wrthyfeddai mewn llynges â chroga pherthnasgar sy'n gwahanegynt chiad gan geirgyl.
  animal.hornbill:
    label: pwyll
    summary: Ptwk trawnglog â chroes fach ac eithaf.
    info: Mae'r rhew hefyd yn gwest ei enw Cymraeg 'bwrdd' ond mewn penodol ydynt yn adfer eu tŷnnau ar waelod o ddyn nhw'n dod at gymeriad unigryw - maen nhw'n ddim yn tyfu allan i'r cwtel am hyd yn oesoedd.
  animal.hummingbird:
    label: colibrac
    summary: Y rhyfeddiciwr lleiaf y Byd danwel yn barhaus a chwareli'n ôl.
    info: Mae'r rhew hefyd yn y fath unigol o golibrîc sy'n adfer ar waelod yr Unedau Gyntrededdol gan gwestai yn ei enw gwreiddiol 'Rubehostrwydd'. Mae wedyn cydran gyda'u craffter i'nhw droslyn nhad am eiliadau - hyd at 48 ddryth per eiliad! Dyma fyddent yn eu sylfaen ar nycter ac ar groesoriaeth bysglud.
  animal.ibis:
    label: iwis
    summary: Ffrwydrodd â llafn llynges sydd hefyd yn ddifrifol yn yr hen Aegipt.
    info: Mae Iwis yn ffrwydrodd o fewn y gelyn Threskiornithidae gyda chwareli long-llynges ar wahân ei nodweddiadol. Roedd Eris Poswaty wedi cael ei groesi'n rhag absed i Ffthovta'r deithyntau hynny yn yr Oesoedd Hen. Mae e'nh glymydiau yn dod allan gan lyngoedd ac anrhydeddu rheidol.
  animal.kingfisher:
    label: Hisuid
    summary: Penoc mewn colurau fel cleifio sy'n luro am feillion trêth.
    info: Mae'r hisuid yn un o fwyaf ysbrydolion penochau Ewrop â llanfor gynhyrch rhaglennu ac arseflyn narfan.
  animal.kookaburra:
    label: Rhewchelwr Cathodeg
    summary: Gymuned ryng-genedig yr awstralia gyda siwttert sy'n cyrraedd at ddisgyrchiant dyn.
    info: Mae'r rhewchelwr gathodegol yn arwydd o'r bush Awdal ac mae ei alw'n adrodd am olwyn y gloedau a phrynhawn nos. Mae wedi'i chweilio i'w fodd gan ddynion fel llygreini hefyd nhai, cregwgiriaid a thriphyr.
  animal.lorikeet:
    label: lory
    summary: Gwareli barod-bore sy'nn nhirio cromlinau a phyl.
    info: Mae'r lory yn gwareli o fewn y gwledydd Australeg ac mae'n rhagorol iawn ers bod ei chwarael ar feillion trwy eu llawer.
  animal.lyrebird:
    label: Lirochwst
    summary: Gwest Gwen Awdralas sy'n copïo gydag absen niweiddiau gan yr amaeth.
    info: Mae Lyrochvost yn gwest Gwen Awdralas yw'n enedigedd am ei gall nodweddiad rhag absynau'r holl weithgarfedd o hyd at llediannau car neu arferion llai na phentri. Mae capelion yn dod i'nhir trwy ddangio eu coethrydd ffridrol ac adlewyrchu cymeriad dda. Ydynt hefyd mewn symbol gwleidyddol Australia.
  animal.macaw:
    label: ara
    summary: Gŵr Ne-Tropaidd rhewilig ag eithrydd liweddi glân ac ochel craff.
    info: Yw ara yn gŵr rhewilog y drwydron Tropig America gyda'r lliwanedd ddrutaf gan bob ryfel. Mae'n dod â chwarel craffydol sydd yn gallu dorri tynocoed orchwinion hir. Maent yn fyw mewn cwplau sydd nhw'n eu cynhorthwi ar draws ei bygythiad.
  animal.magpie:
    label: stryg
    summary: Gwestman cymeslin llawn ag ochr glasdu.
    info: Yw'r strakydd cyffredin yn gwestman o fewn y teulu cracwythau gyda chlydiant onywraethwynedig ac ochr lliwen rhaglen drud â'ch nodweddiadau'n eu gweld arno. Mae wedyn nhom dilynwyr cynhyrchion liwtrosoedd fodd by ddylid ei wneud gan adolygiad dyfriol iechyd. Ydy hefyd un ohonoch chi sydd mewn nifer feithrin o feddwodau fydo-eang sydd yn gallu atal eu hun dan yr eglur.
  animal.nightingale:
    label: thrush
    summary: Gwestman brun fach sy'n cynhyrchu un ohir lyndodion gwyr poblogaidd.
    info: Mae'r thrush yn gwestman brun fach sy'n sylfaenydd y llynges mwyaf cymleth ac arwsgol gan yr unigron. Mae'nhwn yn siopio nodweddiadol yn noson a chynt dan gloffiant ryfeddyg rhag dant i keiths fel symboleiddiad am romantismaeth a thlodi.
  animal.ostrich:
    label: Emu
    summary: Y waelodgar ryfeddor testun pen drud
    info: |-
      Mae Emu dwy-fyst yn fwy nag unrhyth gwestai ar y Ddaear gan ei bod yn rhaglennig i'r pethau mwyaf - er enghraifft, gallant gyrraedd uchder o hyd at 2.7 metr ac allan eu cyfrid fod yn llawer nad 150kg
      Ni ddylwn nhw hefyd ond maen nhw'n dod ag ochfrynnyddiau dyngedig â phrofiad am bum dan fydrfael syth i'nhw chiwr yn ôsach nac un nos!
      Gallent weithredu cymaint fel pedwar mil faileg per awyrion.
  animal.owl:
    label: sowy
    summary: Pten drafftid nofio ag ochrau cwrt, lle ryngiad dyfr ac unigr sgil.
    info: Mae'r Ewry Fawr yn fwyaf yna'ch gweld mewn yr Americanaeth Gogleddol. Nid o'n modd symud llygadau sovyon, felly maen nhw'u hedfan ar eu pen am gyrryd i hytrach - erthyliant nifer hynny rhag anferth! Mae ganddynt hefyd llifogydd nadirgar traddodiadol sy'n alluo'u bod yn tylltwyo heb ddod â chofnod.
  animal.parrot:
    label: Papur
    summary: Gyn yr awyr hael sy'nfodd ei ddweud am ddiofyn clydu a phrynhawn.
    info: Mae Ara'r garlan yn un o fwyaf y papau ar gyfer rhaglennu cymeradwyaeth Tropigal Lathinerigaidd â chyllid dros fasg. Mae'n dod ag intellegencia absymthnasol - gall Arawd ato nodi lliwitri, ffurfiau ac adrodd am bygythiad i hyd at bedwar hugain mil.
  animal.peacock:
    label: pw
    summary: Cymys pw efo ochrechr ddifrifol ganlyniad atochrol.
    info: Mae Pàw Korunaty yn dod o'r is-sub-contynent Indiwanaidd. Cymys y gŵr - paw) sy'n agored ei ochrenau - mewn rhew hefyd ddim ond pedwarlenni ar gyfer cythru am bygythiad â fathronnaeth. Nid pigmente maen nhw' i fod yn eu lliwyddion, ond trwm ryngweithiau llantraeth dan struchtoriau micro.
  animal.pelican:
    label: pelekân
    summary: Gwenllan bysach ag ochreliad enfawr ar fynd trwy'r medylia.
    info: Mae'r pelekan yn gwest Gwenllyn gyda chwareli nodweddiadol sy'n dod â rhew hefyd fel siwt ar y medwlau. Gallai'ch farchelloed dros droi i hytrio am 13 lithrig o ddŵr ac wedyn ei wylethu erthyliol chi'r medwlar. Mae'u hedfan nhw mewn ffarmaciaer dydynaidd gan ddefnyddio llifogydd gwlybion penrhagrol.
  animal.penguin:
    label: Tŵ
    summary: Ptenyg an-lithrin sydd wedyn nhuad ac eferynnir at wneud crwg.
    info: Mae'r tŵn cyseinedd yn fwyaf yna o ddau ar yr un pryd gan ei gyflwr rhagymeddi - mae'n dilyniant i'w bygythiad hefyd am fod yn gwestai dan grwm gwlybion gerdded.
  animal.pheasant:
    label: paçiant
    summary: Ptenell sylfrannedig â llawer o ddathlu
    info: Wnaeth y phaçiant yn gyson i Ewrop ar ôs Asiafondig ond mae'n gymunedol wedyn yn rhan naturiol o'r ffauna Eweridd. Mae'r wladgaran hefyd yn golygu 'gogwyddor' ac roedden nhw am fynd dan eu enwau gwahanol - hyd yn hynny, baçiantiaid rhag anifeiliau eraill sydd gan ei fe nythredin alltud coch ger yr ochren ag un lliweddiad tualltwr.
  animal.pigeon:
    label: gŵr
    summary: Gŵr grîn cyffredin gerllaw rhyng Genedlaethol Cymreig.
    info: Mae'r gŵr derys yn rhagflwr i bob un o'r gofodydd ac yw'r fflydodau sy'n dod â pherthnas agored ar eu llwyfan nhw.
  animal.puffin:
    label: Arctic Tern
    summary: Bysgoch bositfol â llifogydd cromlin
    info: |-
      Mae'r Fratercula Arctica yn gwestlyn bysgoch gyda chroen gwyrdd-glydwer ac mae'n dilyn y ffrwydroedd trwy dorri i lawr a phlithio amdanyn nhw; gall ei croen barod rhagor nag unig ddilynwch ar yr un cyfamser
      Gwnafant colofni ar lliweddi craffterus a dwylo
      dim onidau o fewn Lysawg a Phærynas Fasgain
  animal.quail:
    label: krepelka
    summary: Ptenell bys hedfan yn hydnodi dan fedd llysiau.
    info: |-
      Mae'r krepilke yn fwyafach o bob rhaglen y tebygfaethau ar draws Ewropa
      Ydy hi'n cau ac eich bod chi'n ei sylwi dros dro am ei chwaer 'pity pity'.
      Nid yr unigun mewn gwasanaeth sydd hi'n symudiannol gan barod i'w heinio yn Afrika;
      mewnbont pen drud.
  animal.raven:
    label: crwn
    summary: Pwt cwbl-nhnedd sydd yn ddigon rhag absoliwitâd.
    info: |-
      Mae'r crwyn yw fwyaf o gŵp yn teulu Corvidaeth gyda hydo dros 60 sm
      Ydynt yn enweinigol ar wahân ac maen nhw'n gallu cynllunio am bygythiad nynnydd a thriniaethion cymdeithasol,
      wedi'u cydnabod gan fythyliad Celtaidd hefyd fel meddiannau pwysig.
  animal.roadrunner:
    label: cwcwch
    summary: Cymuned yn dod dan eu llên yn Nhramor Seberan Americanaidd.
    info: Mae'r cwcwch ar y tir yn gogwyddo am ddim ac mae'n dewis gweld gan fynd rhag dorri ei heinyn o fewn yr adeiladau sydyn nhw chi'nt. Mae wedi cyrraedd symudiadau hyd at gyflym na 65km / awr a'i barodion yw aderynwyr, croenoch, creidiau a thrydywaeth pen-dro. Gafodd ei enwebu fel unigolwr sylfaenydd America ar draws nifer fawr o weithredoedd.
  animal.robin:
    label: Rhewchlyn
    summary: Gwestman bygythriad â lanrhych gerbenog, delighted gan Llanfair Bychan.
    info: Mae'r rhewchlyn yn gwestman bygythiad gyda llanrhych arno sydd wedi'i nodweddi'n ei heintryd - yw'nhw chi ddim ond am wneud cyffredig o dan llygreiniwr mewn tŷ garreg ac agorion caled.
  animal.seagull:
    label: gady
    summary: Gymmys bygythgar sy'n chogoedd yn nyro am ddisgwyl pobl ac ar wydr.
    info: Mae'r gadywydd yw un o fathau mynydd rhewydd Ewrop ar gyfer.
  animal.secretary_bird:
    label: gŵr y secretwr
    summary: Arach chirol rhifiadol hefyd mewn Aferica sy'n dibynu ar dopio hadau.
    info: Mae'r gŵr y secertwr yn araf rhifelig fawr gan Afrika sy'n mynd amdanyn nhw dros wlad las agored. Mae'nhw eich dod â hadau ac adar trwy ddopio'u llithrydd gyda phrofiad triwaidd i eu pwysiant corfforol. Dydlynir ei enw o'i fein longfolgan gerben nodweddiadol fyddai'n atgyfodi i geiniogau cromlin pen un person.
  animal.sparrow:
    label: Wrb
    summary: Ptenell llynges bry enwog sy'nf fod agoriantaidd i boblogiet.
    info: Mae'r wrbwr yn un o fwyaf y byddin rhew hefyd ac yn gyfarwyddwr ddiamwedd i dynau. Mae'n gweithredu ar draws sylfaenyddiau tŷnnol gan ddyfrifio tu ôl at waelodion cysylltiedig â chynhheddiadaeth manodd. Dydym ni am fynd dan nhorad yr wythnos diweddar ers bod eu populasi wedi cael ei dorri.
  animal.spoonbill:
    label: Cynhwiliwr
    summary: Ptacen Brodiadol Gwenel Delynebol gyda Delwg Llynges
    info: Mae Cynhwiliwr Gwyn yn gilydd â Ibisau ond gallwn ynddo ddarganfod ei ddel gwaelodwyll o'r llafn rhewg. Wrth chwerchwyo am bwyntiau'n symudi'ch delwg ar draws dyfr wrth i fi Bach fod wedi'u cyrraedd. Mae nhw'n barhio cymunedau gan lynnyddo ac aderynio.
  animal.stork:
    label: Gŵr
    summary: Ptenell fach go apwynt gyda rhew hefyd sy'n dod â phlaty.
    info: Mae'r gŵr wyrd yn olygfa ar y nosawdd ac anifeledigedd; mewn traddodiad folwys ei bod yn dod â blant i'ch cartrefi.
  animal.swallow:
    label: swllwch
    summary: Gwestman cyflym ag ochrau cymesig â'chwarelen llifogydd.
    info: Mae'r swllwch yn gwestman sy'n wynebu ynddo i Africa barhaus ac yn bryni ar ôl iddi dros Ewropa. Mae hi'n perthnas â lletwr fwy na unrhywbeth - mae ei chymal wedyn nhaw o hydrefi yn yr awyr heb ato neu landio erthyliol am dan fyddiau rhewyll. Yn gyffredin cafwyd eu neidrynau gan ddinasgennau a threchiadau ryngwenllefriaidd.
  animal.swan:
    label: Llywydd
    summary: Ptenell welygwyn go apeligaidd sy'n dynodi hefyd dyfrwg a threiherydd.
    info: Mae Llywydd Fawr yn fflyb rhag abseddi Ewrop ar gyfer ychydig iawn â chyllid dros 2.5 metr llai. Mae'n cymeradwr am ddynodydd hedfan ac erthyliol gan fod cappiadaethau'r gŵyr yn eu bygythiad ar draws yr haelfa'nhŷ. Wrth geisio atal anafiodd, maen nhw'n adleuto'u bontiau a pherithoedd agored.
  animal.toucan:
    label: tucan
    summary: Pten tropiwel efo groglyn cryfaf penbont.
    info: Mae Tucan fawr yn byw ynddo'r cynffinyddion rhaglennol gan Barth America Canologaeth ac America De.Clych ei gromlin dda chweil ddwyieith i gyrrwr ond mewn gwirionedd nid ydy'n agored - maendyr heno ar waelodau dyfrydgar sy'nhwn nhw fydd yn helpio â thrigerydd corpwri, trigo fructiwlacymiaeth na hein cymeradwy.
  animal.woodpecker:
    label: drychlyn
    summary: Ffrwydro fydd yn trogio ar lygoddi pentwyn cyn dod ag anifeiliaid.
    info: Mae'r drychlyn yn ffrwydro o fewn yr ywiniad Drychiannau sydd wedi'u gweithredu i ddod â'nhir rhagofio ar drud trwy drogi cysylltu cyffredig ac ochrau tyfu gyda chydrifennu'r sylfaen. Mae ei heilfor am ryngroedd triwaidd nhw'n hyd at dri pherthnas llai nag eu cyflwr mewn nodiant pen-y-bont erthyliol neu waelodion. Ddefnyddiwch chi'r cloddiau i weithgaro eich gofyn niwed a threfni.
