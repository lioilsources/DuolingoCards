lang: zh-CN
pivot: false
title: 鸟类
cards:
  animal.albatross:
    label: 信天翁
    summary: 翼展最大的海鸟。
    info: 漂泊信天翁拥有所有鸟类中最大的翼展，可达超过3.5米。它们一生大部分时间在开阔的海洋上度过，并能飞行数千公里而无需着陆。它们饮用海水并通过鼻腺排出盐分。在航海传统中，杀死一只信天翁被认为是厄运之兆。
  animal.budgerigar:
    label: 和乌尔卡
    summary: 一种来自澳大利亚的小型彩色鹦鹉，是受欢迎的宠物。
    info: 波浪纹虎皮鹦鹉原产于澳大利亚内陆地区，在那里它们以大群落的形式生活。它是世界上继金丝雀之后最广泛饲养的鸟类之一。雄性能够模仿人类的声音并学会数百个单词。野生的虎皮鹦鹉呈绿黄色；通过人工培育产生了多种颜色变异体。
  animal.canary:
    label: 金丝雀
    summary: 一种受欢迎的小型黄色鸣禽宠物鸟。
    info: 家养金丝雀起源于加那利群岛，于17世纪被驯化。通过人工选育形成了其明亮的黄色羽毛；野生金丝雀则是绿色带褐色的。雄性会唱复杂的曲调；全球范围内都举办有金丝雀歌唱比赛。历史上它们还曾用于煤矿中检测一氧化碳气体的存在。
  animal.cassowary:
    label: ' cassowary'
    summary: 新几内亚一种危险的不会飞的鸟类，有锋利的爪子。
    info: 驼鸟是一种来自新几内亚和澳大利亚北部的大型不会飞行的鸟类。它被认为是世界上最危险的鸟类之一；其内趾上的长爪能够造成严重伤害。高大的骨质头盔可能用于在茂密森林中导航。它是热带雨林种子传播的关键物种。
  animal.cockatoo:
    label: 凤头鹦鹉
    summary: 一种来自澳大利亚和亚洲的白色凤头鹦鹉，具有醒目的黄色冠羽。
    info: 黄冠凤头鹦鹉是凤头鹦鹉科中最著名的鸟类之一。它的鲜明黄色冠羽在兴奋或警觉时会竖起。这种鸟非常聪明，并能模仿人类的声音。它们在圈养中可以活到80岁，在澳大利亚被视为农作物害鸟。
  animal.condor:
    label: 安第斯神鹰
    summary: 美洲最大的飞行鸟类，头部无毛。
    info: 安第斯神鹰是世界上按体重和翼展计算的最大飞行动物。它是一种秃鹫，以大型哺乳动物的尸体为食，在生态系统中扮演重要角色。它们在安第斯山脉上巨大的热气流中滑翔时几乎不需要拍打翅膀。对于安第斯地区的土著民族来说，这种鸟象征着天空与自由，具有神圣的意义。
  animal.crane:
    label: 鹤
    summary: 一种大型迁徙鸟类，以其舞蹈仪式和响亮的叫声而闻名。
    info: 灰鹤是一种每年迁徙数千公里的大型候鸟。它们以求偶时跳跃并展开翅膀的独特舞蹈表演而著称。秋季和春季，成千上万只灰鹤会飞越捷克共和国。此外，“起重机”这种建筑机械的名字也来源于“鹤”。
  animal.crow:
    label: 渡鸦
    summary: 一种聪明的黑色乌鸦科鸟类，擅长解决问题。
    info: 渡鸦是一种以非凡智慧著称的乌鸦科鸟类。它们能够识别人类面孔、使用工具并解决复杂任务。通常成对或小群体生活，并且是杂食动物。在捷克神话中，渡鸦常被认为具有神秘特性。
  animal.cuckoo:
    label: 杜鹃
    summary: 一种巢寄生鸟类，以其双音节叫声著称（学名：Cuculus canorus）。
    info: |-
      普通杜鹃以巢寄生行为闻名；它会将自己的蛋产在其他鸟的巢中，并由养父母孵化和喂养。
      刚出生不久的小杜鹃就会将巢中的其他蛋或幼雏推出去。
      它的“咕咕”两声鸣叫是春天来临的象征。
      雄性发出“咕咕”的声音，而雌性的叫声则像气泡般的声音。
  animal.dove:
    label: 鸽子
    summary: 和平的象征；羽毛柔软洁白的鸽子。
    info: 白鸽自古以来就是国际公认的和平象征，在《圣经》中，它曾为诺亚带来橄榄枝。在基督教中，鸽子代表圣灵。家养的鸽子实际上是驯化的岩鸽，其纯白色是通过人工选育产生的。在全球各地的文化仪式和庆典活动中，放飞白鸽是一种常见做法。
  animal.duck:
    label: 鸭子
    summary: 一种扁嘴水鸟；雄性（公鸭）有绿色头部。
    info: |-
      绿头鸭是世界上最广泛分布的野鸭种类，也是大多数家养品种的祖先。
      雄性（公鸭）具有特征性的闪亮绿色头部，雌性则是低调的棕色。
      它们属于浅滩觅食型鸭类，在水面觅食而非潜水。
      在捷克地区，鸭子是池塘和河流生态系统中不可或缺的一部分。
  animal.eagle:
    label: 秃鹰
    summary: 大型猛禽，有弯曲的喙和敏锐的视力。
    info: 白头海雕是美国的国家象征，属于北美最大的猛禽之一。它们主要捕食鱼类，用尖锐的爪子直接从水中抓取猎物。白头海雕的翼展超过两米，在野外寿命约为20年。
  animal.emu:
    label: 鸸鹋
    summary: 世界上第二大鸟类，不会飞的澳大利亚鸵鸟。
    info: 鸸鹋是世界上的第二大鸟类，并且是澳大利亚特有的物种。它不能飞行，但游泳能力强、奔跑速度快。雄性会孵蛋并照顾幼崽，而雌性则离开。在1932年，澳大利亚军队甚至与成群威胁庄稼的鸸鹋发生了所谓的“鸸鹋战争”并失败了。
  animal.falcon:
    label: 隼
    summary: 俯冲时速度最快的动物（超过每小时320公里）。
    info: 游隼是地球上最快的速度动物，俯冲时速可超过320公里。它的眼睛下方有独特的黑色斑纹，可以减少阳光的反射。人类已经驯养它们用于狩猎超过2000年；这项传统已被列入联合国教科文组织名录。在捷克共和国，它们通常在高大的建筑物和岩石上筑巢。
  animal.flamingo:
    label: 火烈鸟
    summary: 一种粉红色的涉水鸟，单脚站在浅水中。
    info: 火烈鸟的特征性颜色来自其食物中的类胡萝卜素，例如它们食用的藻类和甲壳类。幼鸟出生时是灰色的，随着时间逐渐变色。弯曲的喙部用作过滤器——火烈鸟低头将头插入水中，通过喙部过滤食物。
  animal.goose:
    label: 鹅
    summary: 一种大型水鸟，以V字形迁徙；在地面筑巢。
    info: |-
      灰雁是家鹅的野生祖先。
      它们以特征性的V字队列进行迁徙，在飞行中轮流担任领头位置。
      繁殖期间非常具有领域性，并勇敢地保护幼崽。
      历史上，罗马卡比托利欧山上的鹅曾因鸣叫而发出警报，赶走了高卢入侵者。
  animal.hawk:
    label: 鹰
    summary: 快速的捕食者，在森林和田野中猎取鸟类和哺乳动物。
    info: 鹰是猛禽科中的一个属，拥有短而圆的翅膀和长尾巴，适合在茂密植被中狩猎。它们非常迅速且灵活；可以在飞行中或从隐蔽处捕捉其他鸟类。雌性通常比雄性明显更大。在过去，人们驯养鹰作为珍贵的狩猎助手。
  animal.heron:
    label: 苍鹭
    summary: 一种高大的涉水鸟，常静立水中等待捕鱼。
    info: 灰苍鹭是中欧最大的涉水鸟类。它像雕像一样一动不动地站立着，等待鱼游到够得着的地方后迅速用喙出击。它可以整条吞下鱼类和青蛙。飞行时它的脖子呈S形弯曲，与颈部伸直的鹤类不同。
  animal.hornbill:
    label: 犀鸟
    summary: 一种拥有巨大角质喙的热带鸟类。
    info: 犀鸟是一种属于犀鸟科、以巨大的带骨质突起（角）的喙为特征的鸟类。它们生活在非洲和亚洲的热带雨林中。这种鸟不在地洞筑巢，而是在树干上的空腔里；雌性会被雄性封闭在巢内，并在整个繁殖期间留在里面。它的存在是健康热带森林的重要指标。
  animal.hummingbird:
    label: 蜂鸟
    summary: 世界上最小的能够悬停和倒飞的鸟类。
    info: 红喉蜂虎是唯一一种定期在北美东部筑巢的蜂鸟。它的翅膀每秒可拍打多达53次，从而发出典型的嗡嗡声。它们以花蜜和小型昆虫为食；心脏每分钟可跳动多达1200次。
  animal.ibis:
    label: 朱鹭
    summary: 一种长弯曲喙的涉水鸟，在古埃及是神圣的。
    info: |-
      朱鹭是一种具有显著特征的长曲嘴涉禽，属于鹮科。
      在古埃及，圣朱鹭被崇拜为智慧之神托特的化身。
      它们通常栖息于湿地和河流三角洲，并以群居方式生活。
      褐朱鹭意外引入欧洲后，如今作为入侵物种迅速扩散。
  animal.kingfisher:
    label: 翠鸟
    summary: 一种宝石般色彩的捕鱼鸟类，从溪流上空俯冲捕食。
    info: 河翠是欧洲最美丽的鸟类之一，背部呈明亮蓝色，胸部为橙色。它栖息在水面上方的树枝上观察鱼群，然后垂直潜入水中捕捉猎物。它是水流清洁程度的重要指标，在哪里出现就说明那里的水质健康。在日本，类似的翠鸟（hisui）象征着美丽。
  animal.kookaburra:
    label: 笑翠鸟
    summary: 澳大利亚的笑翠鸟以其类似人类笑声的大声鸣叫而闻名。
    info: 笑翠鸟（又称科卡布拉）是澳大利亚一种大型翠鸟，因其叫声像人发笑而著名。它是澳大利亚丛林地区的象征性鸟类，其叫声传统上标志着日出和日落的到来。它们捕食蜥蜴、蛇类、啮齿动物和昆虫。这种鸟以家庭群体生活，年幼成员会帮助父母抚养雏鸟。
  animal.lorikeet:
    label: 彩虹 lorikeet
    summary: 一种小型色彩鲜艳的吸食花蜜和花粉的鹦鹉。
    info: 彩虹 lorikeet 是来自澳大拉西亚的一种小型鹦鹉，拥有所有鹦鹉中最绚丽的颜色。它用特化的刷状舌头从热带花朵中采集花蜜和花粉，在生态系统中是重要的传粉者。它们群居、喧闹且活泼；在人工饲养下能快速与人类建立联系。
  animal.lyrebird:
    label: 琴尾鸟
    summary: 一种能完美模仿周围各种声音的澳大利亚鸟类。
    info: 琴尾鸟是澳大利亚著名的鸟类，以其能够几乎精确地模仿任何环境中的声音而闻名：如电锯声、相机快门声、汽车警报器或其它鸟类叫声。雄性会展示其精致的琴形尾巴和完美的拟真能力来吸引雌性。它也是澳大利亚维多利亚州的象征。
  animal.macaw:
    label: ara
    summary: 一种拥有鲜艳羽毛和强壮喙的大型新热带区鹦鹉。
    info: ' Ara 是南美热带雨林中体型较大的鹦鹉，是所有鸟类中最引人注目的色彩之一。它们有强而弯曲的喙，能够剥开坚硬的坚果外壳。这种鸟通常成对生活，并终生不分离。由于森林砍伐以及非法交易外来动物，它们正面临威胁。'
  animal.magpie:
    label: 乌鸦
    summary: 黑白相间的鸟类，拥有长长的彩虹绿色尾巴。
    info: 普通寒鸦是一种羽毛呈鲜明黑白色、尾羽带有绿光的长尾鸟。它以偷走闪亮物品而闻名，但研究并未证实这一传说。它是少数能够识别自己在镜子中倒影的鸟类之一。在中国，这种鸟象征着幸福和喜悦。
  animal.nightingale:
    label: 夜莺
    summary: 一种小型棕色鸟类，以其美妙的歌声而闻名。
    info: |-
      普通夜莺是一种体型较小、羽毛呈褐色的小鸟。雄性夜莺能唱出复杂且优美的鸣叫，在夜间和黎明时分尤为活跃，这也是它名字的由来。
      它是红尾鸲的远亲。从但丁到济慈等世界各地诗人都赞美夜莺的歌声为浪漫与忧郁的象征。
  animal.ostrich:
    label: 鸵鸟
    summary: 世界上最大的鸟类，不会飞；奔跑时速可达70公里。
    info: 双峰驼（即鸵鸟）是世界上最大、最重的鸟类；雄性身高可达2.7米，体重超过150公斤。它不能飞翔，但却是世界上最快的两足动物之一，速度可超过每小时70公里。它的蛋也是所有鸟类中最大的。脚上的第一趾缺失，只有两个脚趾。
  animal.owl:
    label: 猫头鹰
    summary: 夜间圆眼猛禽，飞行安静且听觉敏锐。
    info: 大角鸮是北美洲最大的猫头鹰。猫头鹰的眼睛无法移动，因此它们能将头旋转多达270度。它们的飞行几乎无声，这是由于羽毛的特殊结构。它们在黑暗中依靠异常敏锐的听觉捕猎。
  animal.parrot:
    label: 鹦鹉
    summary: 一种能模仿声音和人类语言的色彩鲜艳的热带鸟类
    info: 红金刚鹦鹉是世界上最大的鹦鹉之一，翼展超过一米。它们生活在拉丁美洲的热带雨林中。鹦鹉拥有非凡的智力——红金刚鹦鹉能够识别颜色、形状并计数。它们的寿命可达75年。
  animal.peacock:
    label: 孔雀
    summary: 雄孔雀拥有绚丽多彩的扇形尾巴
    info: 印度次大陆是蓝孔雀的原产地。雄性孔雀在求偶时会展开其尾羽——实际上这些是延长的覆羽——形成一个扇形。这些虹彩般的颜色并非由色素产生，而是由于羽毛上的微观结构对光的折射。
  animal.pelican:
    label: 鹈鹕
    summary: 一种大型水鸟，拥有巨大的袋状喙用于捕鱼。
    info: 鹈鹕是一种大型水鸟，具有标志性的袋状喙，用作捕捞鱼类的网。它的袋子可以容纳多达13升的水；通过挤压排出水分并吞食鱼。它们以空气动力学编队飞行，并利用彼此上升气流中的波浪来节省体力。在基督教象征中，鹈鹕是牺牲之爱的象征。
  animal.penguin:
    label: 企鹅
    summary: 不会飞的南半球鸟类，游泳能力极强。
    info: 帝企鹅是所有企鹅中体型最大的，身高超过1.1米。它们生活在南极，能在极寒中孵蛋——雄性企鹅会在整个南极冬季用脚部孵化蛋。它们在水下的时速可达30公里以上。
  animal.pheasant:
    label: 雉鸡
    summary: 一种大型色彩鲜艳的猎鸟；雄性有明显的颜色和长尾巴。
    info: |-
      原产于亚洲，后被引入欧洲，并已成为欧洲动物群的一部分。雄性（公雉）具有醒目的羽毛颜色、绿色铜色的身体以及眼睛周围特有的红色肉垂。
      在捷克共和国是分布最广的鸟类之一，也是狩猎传统的重要组成部分。
      它们在地上茂密植被中筑巢。
  animal.pigeon:
    label: 鸽子
    summary: 常见于城市和乡村的灰色鸟类，起源于岩鸽。
    info: |-
      岩鸽是所有家养及野生城市鸽类的祖先。
      它是人类最早驯化的鸟类之一，在过去几千年中被用作信鸽。
      它拥有非凡的方向感，能够从数百公里外找到回家的路。
      在世界各地的文化中，鸽子都是和平的象征。
  animal.puffin:
    label: 北极海鹦
    summary: 一种拥有彩色鹦鹉嘴的小型海洋鸟类。
    info: 北极海鹦是一种小型类似企鹅的海鸟，其喙部色彩斑斓。它们通过潜水并游泳来捕捉鱼类；一次可以同时在喙中携带十几条鱼。它们成群地在岩石悬崖和洞穴中筑巢。它是冰岛和法罗群岛的标志性动物之一。
  animal.quail:
    label: 鹌鹑
    summary: 一种小型隐秘的在草地地面筑巢的小型猎鸟。
    info: |-
      欧洲最小的雉科代表是田鹌鹑。
      它非常隐蔽；我们更容易听到它的叫声（pí-tí pí-tí），而不是看到它。
      与其它野鸡不同，它是迁徙性的，在非洲过冬。
      它的蛋是一种受欢迎的美食。
  animal.raven:
    label: 渡鸦
    summary: 一种体型大、聪明的黑色鸟类，以其独特的喉部叫声而闻名。
    info: 渡鸦是雀形目中最大的物种之一，体长超过60厘米。它们极其聪慧，能够计划未来、玩耍并建立社会关系。在北欧神话（奥丁的信使赫尔敏和蒙宁）以及凯尔特文化中都具有神秘地位。伦敦塔受到传说保护——据说如果渡鸦离开塔楼，帝国将覆灭。
  animal.roadrunner:
    label: 地栖杜鹃
    summary: 北美洲沙漠中的快速奔跑者；动画片的象征。
    info: 大钝尾雀（道路跑者）是一种偏好行走和奔跑而非飞行的地栖杜鹃科鸟类。它的时速可达超过每小时30公里，以蛇、蜥蜴、昆虫以及小型哺乳动物为食，并有能力捕捉并杀死响尾蛇。它因成为美国卡通系列《跳跳虎》和《野狼谷》中的主角而闻名。
  animal.robin:
    label: 红胸脯鸟
    summary: 一种胸部红色的小型鸟类，是英国的圣诞节象征。
    info: 普通红胸脯鸟是一种小型鸣禽，以其典型的橙红色胸部为特征。它胆子不小，常常尾随在园艺工人身后寻找他们翻出的蚯蚓。它是大不列颠的国鸟和传统的圣诞象征，并且全年留在自己的领地内，在冬季也会歌唱。
  animal.seagull:
    label: gull
    summary: 沿海的海鸥以在人类和海洋附近觅食为特点。
    info: 银鸥是欧洲最常见的海鸟之一。它适应性强，杂食性；不仅生活在海岸边，还出现在内陆湖泊和河流附近。它们很聪明，有时会记住人们喂养过它的地点。对人类食物的好奇心常常成为海边游客讲述的故事来源。
  animal.secretary_bird:
    label: 秘书鸟
    summary: 一种长腿的非洲猛禽，通过跺脚杀死蛇类。
    info: 秘书鸟是一种大型非洲猛禽，在开阔的大草原上主要靠步行活动。它用强壮有力的双脚（重量是其体重的三倍）进行跺地动作来捕杀蛇和啮齿动物。它的名字来源于头部长长的羽毛，看起来像文员耳后的胡须。它是南非共和国和苏丹的国家象征之一。
  animal.sparrow:
    label: 麻雀
    summary: 一种小型棕色食谷鸟类，常生活在人类居住地附近。
    info: 家麻雀是世界上最广泛分布的鸟类之一，也是人类忠实的伙伴。它们通常在人类聚居区附近的墙壁和屋顶缝隙中筑巢。在过去几十年里，城市中的麻雀数量显著下降。对于捷克人来说，麻雀象征着平凡与适应力。
  animal.spoonbill:
    label: 勺嘴鹬
    summary: 一种白色的涉禽，具有特征性的勺形喙。
    info: 白琵鹭与朱鹮有关，但我们可以根据其扁平的勺状喙轻松区分。觅食时它会在浅水中左右摆动喙部寻找食物。它们在芦苇丛和灌木中成群筑巢。在波西米亚地区较为罕见，但在摩拉维亚南部则是常见的访客。
  animal.stork:
    label: 鹳
    summary: 一种大型白色鸟类，长有红色喙；据说会带来孩子。
    info: 白鹳是一种迁徙性候鸟，在整个欧洲的屋顶和杆子上筑巢。它们在热带非洲过冬，并每年返回同一个巢穴，年复一年地扩大这个巢。它是春天与生育力的象征；根据民间传统，它会为人们送来婴儿。捷克是欧洲最重要的白鹳繁殖国之一。
  animal.swallow:
    label: 燕子
    summary: 快速的空中食虫鸟类，具有典型的分叉尾羽。
    info: 家燕是一种候鸟，在撒哈拉以南非洲越冬，并在欧洲繁殖。它们是飞行大师；只在飞行中捕食昆虫，甚至可以在不着陆的情况下从水面饮水。它们常在谷仓和屋檐下筑巢；在民间传说中，家中有燕子象征好运。它象征春天、归来与对家园的忠诚。
  animal.swan:
    label: 天鹅
    summary: 大型优雅的白色水鸟，象征美丽和浪漫。
    info: 大天鹅是欧洲最大的飞行动物之一，翼展超过2.4米。它象征着美、爱情与忠诚；成对的天鹅一生彼此忠贞不渝。当受到威胁时，它们会无意识地抬起头部并鼓起羽毛以示警告。在安徒生童话中，天鹅还象征着丑小鸭变美的转变过程。
  animal.toucan:
    label: 巨嘴鸟
    summary: 一种拥有巨大彩色喙的热带鸟类
    info: 巨嘴鸟生活在中美洲和南美洲的热带雨林中。其引人注目的喙长达20多厘米，但非常轻，由空气腔组成。这个喙用于调节体温、啄食水果，以及作为其他巨嘴鸟的视觉信号。
  animal.woodpecker:
    label: 啄木鸟
    summary: 一种敲击树皮寻找昆虫或凿洞的鸟类。
    info: 啄木鸟属于鴷科，它们用坚硬的喙和作为支撑的硬尾巴适应于叩击树木。其舌头长度可达喙的三倍以上，用于从钻孔中取出幼虫。通过叩击进行交流并标记领地。大斑啄木鸟（Dryocopus martius）是欧洲最大的啄木鸟。
