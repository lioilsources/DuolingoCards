lang: ja
pivot: false
title: 鳥類
cards:
  animal.albatross:
    label: アカボシアルカ
    summary: すべての鳥の中で最も大きな翼幅を持つ海鳥。
    info: アカボシアルカは、生きてる鳥の中でもっとも広い翼幅を持ち、最大で3.5メートルを超える。生涯の大半を開放的な海洋で過ごし、数千キロメートル飛行することなく着陸せずに済ますことができる。海水を飲み、鼻腺から塩分を排出する。航海士の伝統では、殺されたアカボシアルカは災厄の前兆とされる。
  animal.budgerigar:
    label: アンドルカ
    summary: オーストラリア原産の小さなカラフルなインコで、人気のあるペットです。
    info: |-
      アンドルカはオーストラリア内陸部に生息し、大規模な群れを形成して生活しています。
      世界中で最も多く飼育されている鳥種の一つであり、金翅雀（カンナリ）に次ぐ普及率を持っています。
      オスは人の声をまねることができ、数百語もの単語を習得する能力があります。
      野生の個体は緑と黄色が主体ですが、品種改良によってさまざまな色を持つ変異も生まれています。
  animal.canary:
    label: 金翅雀
    summary: 人気のある黄色の歌う鳥として飼育される小型の明るい黄色の鳴禽。
    info: 家金翅雀はカナリア諸島原産で、17世紀に家畜化されました。黄色の色調は品種改良によって生まれたものであり、野生の金翅雀は緑褐色をしています。雄が複雑なメロディを歌い、「金翅雀の歌声コンテスト」は世界中で行われています。また、歴史上では坑道で一酸化炭素検知のために利用されていました。
  animal.cassowary:
    label: カサハラ
    summary: 尖った爪を持つ、ニューギニアの危険な飛べない鳥。
    info: |-
      カサハラは、ニューギニアとオーストラリア北部に生息する大きな飛べない鳥です。
      内側の指にある長い爪で深刻な傷を引き起こす可能性があり、世界で最も危険な鳥と考えられています。
      頭部には高い骨質の冠（カスク）がついており、おそらく密林でのナビゲーションのために使われています。
      熱帯雨林における重要な種子散布者でもあります。
  animal.cockatoo:
    label: カカトゥ
    summary: 顕著な黄色の冠を持つオーストラリア原産の白いインコ。
    info: 黄金色カカドウは、カカトゥ科に属する最も有名なインコの一つです。興奮したり警戒状態になるとその目立つ黄色い冠を立てます。この鳥類は知能が高く、人間の声をまねることができます。飼育下では最大で80年生きることがあり、オーストラリアでは農作物への被害を与える害獣とされています。
  animal.condor:
    label: コンドル
    summary: 頭部が裸の最大の飛べる鳥で、アメリカに生息しています。
    info: アンデスコンドルは世界中で最も重く、翼幅も広い飛行可能な鳥です。これはワシの一種であり、大型哺乳類の死骸を食べており、生態系において重要な役割を持っています。アンディーズ上空では巨大な熱対流に乗って翼を動かさずに滑翔します。アンディース諸民族にとっては、コンドルは天と自由の神聖な象徴です。
  animal.crane:
    label: クジャク
    summary: ダンスのような求愛行動と大きな鳴き声で知られる大型の渡り鳥。
    info: |-
      ヒシクジャクは毎年数千キロメートルを移動する大型の渡り鳥です。
      求愛のためにペアがジャンプして羽を開く踊りを見せることで有名です。
      春と秋にチェコを巨大な群れで飛来します。
      クレーンという建設機械の名前にも由来しています。
  animal.crow:
    label: カラス
    summary: 問題解決能力のある黒い知的な鳥で、カササギ科に属する。
    info: |-
      カラスはカササギ科の鳥であり、卓越した知性で有名です。
      人間の顔を識別し、道具を使ったり複雑な課題を解決したりできます。
      ペアや小さなグループで生活しており、雑食性です。
      チェコ神話では、カラスには神秘的な特性が帰せられています。
  animal.cuckoo:
    label: カッコウ
    summary: 他の鳥の巣に卵を産みつける繁殖寄生を行う鳥。
    info: カッコウは繁殖期に自分の卵を他の鳥の巣に産み、その親が孵化させたり育てたりする繁殖寄生を行います。孵化したカッコウの雛はすぐに他の卵や雛を巣から突き落とします。特徴的な「クークー」という二音節の鳴き声は春の到来を象徴しています。雄はこの鳴き声を発し、雌はブーブルという音を出します。
  animal.dove:
    label: はと
    summary: 平和の象徴；柔らかな白い羽毛を持つ白いハト。
    info: |-
      ホワイトピグミー・ドバは古代から世界中の平和の国際的象徴となっています。聖書ではノアにオリーブの枝を届けました。
      キリスト教においては、聖霊を表しています。
      家畜化された岩ドバであり、純白の色調は品種改良によって生まれたものです。
      白いハトの放鳥式は世界各地で儀礼や祝賀行事の一環として行われています。
  animal.duck:
    label: カモ
    summary: 平たい嘴を持つ水鳥；雄（カケル）は緑色の頭を持っている。
    info: |-
      野生のカモは世界で最も広く分布しているカモの種であり、多くの家畜品種の祖先である。
      雄（カケル）は特徴的な光沢のある緑色の頭を持ち、雌は控えめな褐色をしている。
      これは水面に潜らず、表面で餌を摂る「ダブリング」タイプのカモである。
      チェコでは池や川の風景に欠かせない存在だ。
  animal.eagle:
    label: オウル
    summary: 湾曲した嘴と鋭い視力を持つ大型の猛禽類。
    info: ホシハジロワシはアメリカ合衆国の国鳥であり、北アメリカ最大の猛禽類の一つです。主に魚を捕食し、鋭い爪を使って水から直接捕まえます。翼展は2メートル以上になり、自然界では約20年生きることがあります。
  animal.emu:
    label: エミュー
    summary: 世界で二番目に大きな鳥であり、オーストラリアの飛べないラティテス。
    info: ブラウン・エミューは世界で二番目に大きい鳥であり、オーストラリアに固有の種です。飛ぶことはできませんが、泳ぎや走ることが得意です。オスは卵を抱いて雛を育て、メスは去ってしまいます。1932年には、収穫を脅かすエミュー群に対して行われた戦いである「エミュー戦争」において、オーストラリア軍が敗北しています。
  animal.falcon:
    label: ハヤブサ
    summary: 急降下飛行で世界最速の動物（時速320km以上）。
    info: ヒヨドリ属に属するハヤブサは、地球上で最も速い動物であり、急降下飛行では時速320キロメートルを超える速度を記録しています。目元には特徴的な暗色のクマがおり、これは太陽光の反射を抑える役割があります。人間による狩猟歴史は2000年以上続いており、この習俗である「鷹狩」はユネスコの無形文化遺産にも登録されています。チェコでは高層建築物や岩場に巣を作っています。
  animal.flamingo:
    label: フラミンゴ
    summary: ピンク色の羽毛を持つ、片足で浅い水辺に立つ歩行鳥。
    info: フラミンゴは藻やプランクトンに含まれるカロテノイドによって特徴的なピンク色を獲得します。ヒナ鳥は灰色白く生まれ、時間が経つにつれて色づいていきます。湾曲した嘴はフィルターとして機能し、フラミンゴは頭を下に向けて水から餌を濾し出します。
  animal.goose:
    label: ヒユ
    summary: 群れをＶ字に編成して飛ぶ大型の水鳥。
    info: |-
      ヒユは家畜化されたヒユの野生の祖先です。
      特徴的なＶ字形の隊列で移動し、先頭の位置を交代しながら進みます。
      繁殖期には非常に縄張り意識が強く、子供たちを勇敢に守ります。
      歴史上ではローマのカピトリオ山で鶴のように見張り役を務め、ガリア軍からの攻撃時に鳴き声で警報を発しました。
  animal.hawk:
    label: ハヤブサ
    summary: 森林や原野で鳥類や哺乳動物を狩る速い猛禽。
    info: ハヤブサは、短く丸い翼と長い尾を持つことで密な植生の中でも狩猟が可能な、中型の猛禽である。非常に素早く機敏であり、飛行中に他の鳥を捕まえるか、隠れて狙う方法を使う。メスはオスよりも顕著に大きい。かつてはトレーニングされた愛好家向けの狩猟用としてハヤブサが重宝されていた。
  animal.heron:
    label: ワシカモメ
    summary: 水辺で魚を捕まえるためにじっとしている高さのある歩行鳥。
    info: 灰コクガンは中央ヨーロッパ最大の水中で獲物を探す鳥である。像のように動かずに立ち、魚が届く範囲に来た瞬間に嘴を使って素早く襲うことができる。魚やアマガエルまるごと飲み込むこともできる。飛ぶときは首をS字状に曲げており、これにより首を伸ばしたまま飛ぶカモメとは区別される。
  animal.hornbill:
    label: ゾボロージェツ
    summary: 巨大な角質の嘴を持つ熱帯鳥。
    info: ゾボロージェツは、骨質の突起（カスク）がある特徴的な大きな嘴を持った、トキ科に属する鳥です。アフリカとアジアの熱帯林で生息しています。巣を穴ではなく木の空洞に作り、メスはオスによって閉じ込められ、産卵中はその中に留まります。この鳥が存在することは、健全な熱帯雨林であることを示す指標になります。
  animal.hummingbird:
    label: コリブリ
    summary: 世界最小の、場所にとどまりながら飛行し、逆飛行もできる鳥
    info: ルビーネックコリブリは、北アメリカ東部で定期的に巣を作っている唯一のコリブリの種です。翼を秒間最大53回も振ることで特徴的な唸り声を立てます。花蜜と小さな昆虫を食べて生きています。また、心拍数は1分間に最大1200回にもなります。
  animal.ibis:
    label: イビス
    summary: 湾曲した嘴を持つ歩行鳥で、古代エジプトでは聖なる存在とされた。
    info: イビスは特徴的な長く湾曲した嘴を持った湿原に生息する鳥である。古代エジプトでは神トートの象徴として崇拝されていた。彼らはコロニー単位で湖沼や川のデルタ地帯に住んでいる。一方、ブラウン・イビスはヨーロッパへ意図せず導入され、今日では侵略的外来種として広がっている。
  animal.kingfisher:
    label: ツグミ
    summary: 川辺で魚を狙って頭から突っ込む宝石色の鳥。
    info: |-
      リッチャーチェはヨーロッパで最も美しい鳥の一つであり、電光石火のような青い背中とオレンジ色の胸を持つ。
      木の枝に座りながら水面下の魚を見張り、それから頭からダイブする。
      これは水質の良さを示す指標でもあり、その場所では水が健康であることを意味している。
      日本にも似た種類のツグミ（ヒスイ）があり、それは美しさの象徴として知られている。
  animal.kookaburra:
    label: 笑うツグミ
    summary: オーストラリアの鳥で、人間のような笑い声を発する。
    info: 笑うツグミ（クーカバッラ）は、オーストラリア原産の大柄な鳥であり、人の笑いに似た大きな鳴き声で知られている。これは伝統的に朝と夜の境界線として使われており、オーストラリアのバスヘ（自然環境）の象徴でもある。トカゲや蛇、ネズミ、昆虫などを捕食し、家族単位で生活しており、若い個体も親とともに子育てに関わる。
  animal.lorikeet:
    label: ローリー
    summary: 色彩豊かな蜜を吸う小型のオウム。
    info: 虹色を持つローリーは、オーストラシア原産の小さなオウムで、すべてのオウムの中で最も鮮やかな色合いを持っています。専門的なブラシ状の舌を使って熱帯植物の花から蜜と花粉を集める重要な授粉者です。群れで生活し、騒々しくて遊ぶことが好きですが、飼育下では人間との関係をすぐに築きます。
  animal.lyrebird:
    label: リラテール
    summary: オーストラリアの鳥で、周囲のどんな音でも正確に真似ることができる。
    info: リロテイル・エレガント（Lyruraptor elegans）は、オーストラリア原産の鳥であり、電動ソー、カメラのシャッター音、車のアラームや他の鳥の鳴き声など、ほぼすべての周囲の音をまねすることができる。雄は雌を誘うために美しい竪琴のような尾羽を披露し、完璧な模倣を行うことで知られている。この鳥はオーストラリア州ビクトリアの象徴的存在である。
  animal.macaw:
    label: アラ
    summary: 南アメリカの熱帯雨林に生息する、鮮やかな羽毛と強くて湾曲した嘴を持つ大型のパロット。
    info: アラは南アメリカの熱帯雨林に住む最も目立つ色合いを備えた鳥である。 強くて湾曲した嘴を使って硬いナッツの実を砕くことができる。 終生一緒に過ごすペアで生活しており、森林伐採や希少動物密輸によって絶滅が危惧されている。
  animal.magpie:
    label: ストレーカ
    summary: 黒白の輝く緑色の長い尾を持つ鳥。
    info: |-
      コガラスは、目立つ黒白色調と青みがかった光沢のある長いつま先を持ったカラス科の鳥です。
      輝く物を盗む泥棒という評判がありますが、研究ではこの伝説は確認されていません。
      鏡に映る自分の姿を識別できるのは、少数の類人猿以外の鳥の中でも珍しい特徴です。
      中国では幸せや喜びの象徴として扱われています。
  animal.nightingale:
    label: スズメ
    summary: 小さな茶色の鳥で、美しい鳴き声を奏でる。
    info: |-
      スズメは小型の茶色い鳥であり、オスが非常に複雑かつ美しく歌うことで知られている。
      彼は主に夜や朝焼け時に歌い、その名前もそこから来ている。
      ツグミとは遠縁である。
      ダンテからケイシーまで、世界中の詩家たちはスズメの歌声をロマンと憂いの象徴として称賛してきた。
  animal.ostrich:
    label: ストゥルティウム・カメレーオス
    summary: 世界最大の鳥で飛べないが、時速70kmまで走れる。
    info: |-
      ダチョウは世界最大かつ最も重い鳥であり、オスでは身長が最大2.7メートル、体重が150kgを超える。
      飛ぶことはできないが、世界最速の二足歩行動物として知られ、時速70キロ以上の速度を出すことができる。
      その卵はすべての鳥類の中で最も大きい。
      また、脚の親指がないため、足には2本の指しかない。
  animal.owl:
    label: フクロウ
    summary: 夜行性の猛禽で、丸い目と静かな飛行、優れた聴覚を持つ。
    info: アメリカ大陸最大のフクロウはオオフクロウである。フクロウの目は動かせないため、代わりに頭を最大270度まで回転させる。彼らの飛行は、特殊な羽の構造によりほぼ静かである。暗闇の中で、異常に鋭い聴覚を使って獲物を捕まえる。
  animal.parrot:
    label: インコ
    summary: カラフルな熱帯鳥で、音や人間の言葉を真似ることができる。
    info: アラ・シャラトヴイは世界で最も大きなインコの一つで、翼の開きは1メートルを超えます。中南米の熱帯雨林に生息しています。インコは非常に高い知能を持ち、アラは色や形を識別し、数えることができ、最大で75年まで生きます。
  animal.peacock:
    label: 孔雀
    summary: 雄孔雀は美しい扇形の尾羽を持つ。
    info: 冠孔雀は南アジア原産の鳥である。雄は求愛の際に、実際には伸びた覆い羽である尾羽を扇のように広げる。その虹色の輝きは色素ではなく、光の屈折によるものである。
  animal.pelican:
    label: ペリカン
    summary: 巨大な喉袋を持つ大きな水鳥で、魚を捕まえるために使います。
    info: ペリカンは特徴的な袋状の嘴を持った大型の水鳥であり、その嘴を使って魚を捕獲します。この袋の中には最大13リットルもの水を入れることができ、その後に水を押し出して魚だけを飲み込みます。飛行時には空力的に効率的な隊列を作り、互いの上昇気流を利用して滑翔しています。キリスト教の象徴として、ペリカンは自己犠牲的な愛の象徴とされています。
  animal.penguin:
    label: ペンギン
    summary: 南半球の飛べない鳥で、優れた泳ぎ手。
    info: 帝企鵝はすべてのペンギンの中で最も大きく、1.1メートル以上の高さに達します。南極に生息し、最も厳しい寒さの中で卵を産みます。雄は卵を足で抱えて、南極の冬の間、卵を温めます。水中では時速30キロメートル以上を出します。
  animal.pheasant:
    label: バザント
    summary: 大型のカラフルな鳥；雄は目立つ色柄と長い尾をもつ。
    info: |-
      バザント（Phasianus colchicus）はアジアからヨーロッパに導入されたが、今ではヨーロッパの自然な一部となっている。
      雄（コウドリ）には注目的な模様があり、緑や青銅色の体と目の周りの特徴的な赤い袋状器官がある。
      チェコでは最も広く分布する狩猟用の鳥であり、狩猟文化の基本とも言える存在である。
      巣は地面で茂みの中につくる。
  animal.pigeon:
    label: はと
    summary: 都市や田園地帯に多い灰色の鳥で、岩穴ハトが祖先です。
    info: |-
      岩穴ハト（学名：Columba livia domestica）は、すべての家畜化されたおよび野生化した都市のハトの祖先です。
      これは人類史上最初に飼い慣らされた鳥であり、何千年もの間、郵便を届けるメッセンジャーとして使われてきました。
      驚くべき導航能力を持ち、数百キロメートル離れた場所から自宅に戻ってくることができます。
      世界中の文化において、平和の象徴でもあります。
  animal.puffin:
    label: パピュンカールク
    summary: 色とりどりのカラフルな嘴を持つ小さな海鳥。
    info: |-
      北極フグリは、鮮やかな縞模様の嘴を持った小型のアホウドリ目鳥類です。
      捕食時には水中に潜って泳ぎながら魚を追いかけることができ、一度に十数匹もの魚を嘴で運ぶことができます。
      岩場の崖地や穴の中で群れを作って巣を作ります。
      アイスランドやフェロー諸島では恒久的な象徴として知られています。
  animal.quail:
    label: クレペルカ
    summary: 草むらで地面に巣を作り、隠れる性質を持つ小さな草原の鳥。
    info: |-
      ヨーロッパで最も小型なファサニタチ科の鳥である。
      臆病であり、見つけるよりも鳴き声（ピティ・ピティ）を聞く方が簡単だ。
      他のバザンとは異なり、この種は移動しアフリカで越冬する。
      その卵は人気のある高級食材とされる。
  animal.raven:
    label: カラス
    summary: 賢く、特徴的な鳴き声を持つ大きな黒い鳥。
    info: |-
      カササギはコリャク属の中で最大の種で、全長が60cmを超えます。
      非常に知能が高いことで知られ、未来を計画したり遊んだりし、社会的関係も築きます。
      北欧神話（オーディンの渡り鳥ヒュグニルとムニル）やケルト文化では神秘的な存在として扱われていました。
      ロンドン塔には伝説があり、もしカラスたちが塔から姿を消せば帝国が崩壊するとされています。
  animal.roadrunner:
    label: カクアチカ
    summary: 北アメリカの砂漠で速く走る鳥；アニメシリーズの象徴。
    info: カクアチカ（ロードランナー）は、飛行よりも歩いたり走ったりを好むコウキョクチョウ目ヒヨドリ科の鳥です。時速30km以上を達成し、ヘビやトカゲ、昆虫、そして小型哺乳類を捕食します。サソリを捕まえて殺すことも可能です。アメリカン・コミックアニメ『ロードランナー』と『コヨーテ』のヒーローとして有名になりました。
  animal.robin:
    label: ツバメ
    summary: 胸が赤い小さな鳥で、イギリスのクリスマスの象徴です。
    info: ツバメは典型的なオレンジ色から赤い胸を持つ小さなくちばしの鳥です。臆せず大胆にも庭仕事をする人を追いかけ、掘り出されたミミズを集めることがあります。これは英国の国鳥であり、伝統的なクリスマスのシンボルでもあります。また、一年中自分の縄張りに留まり、冬でも鳴き続けます。
  animal.seagull:
    label: gull
    summary: 海岸や人里で、人の食べ物をねらう食い意地の足りない海鳥。
    info: 銀色カモメはヨーロッパで最も広く分布する海鳥の一つです。適応力が高く雑食性であり、海水浴場だけでなく湖や川などの内陸でも生活しています。頭がよく、時には人々に餌付けされた場所を覚えることもあります。そのようにして得る人間の食べ物への強い関心から、多くの観光客たちのエピソードとなっています。
  animal.secretary_bird:
    label: 秘書鳥
    summary: アフリカの長脚猛禽で、蛇を踏みつけて殺す。
    info: |-
      秘書鳥は主に開けたサバンナを歩く大きなアフリカの猛禽類です。
      その足は体重量の三倍もの重さがあり、これを使ってヘビや齧歯動物を強力な踏みつけで殺します。
      名前は頭にある長い羽が文書吏（秘書）の耳後ろのひげのような見た目から来ています。
      南アフリカ共和国とスーダンの国家象徴でもあります。
  animal.sparrow:
    label: スズメ
    summary: 人里近くに生息する小さな褐色の歌う鳥。
    info: 家来スズメは世界で最も広く分布している鳥の一つであり、人類にとって忠実な伴侶である。人間の住居近くを好んで巣を作り、壁や屋根のすき間に営巣する。近年では都市部での個体数が大きく減少した。チェコの人々にとっては、スズメは平凡さと適応力の象徴でもある。
  animal.spoonbill:
    label: コルピク
    summary: 特徴的なスプーン状の嘴を持つ白い水辺の鳥。
    info: コルピク・ビエリ（学名：Platalea leucorodia）はイbisに近縁だが、平らなスプーンのような嘴で簡単に区別できる。餌を求める際には嘴を使って浅い水面を横方向へ動かす。葦や木々の中での集団で巣を作り、チェコでは希少であるが南モラヴァ地方では定期的に見られる。
  animal.stork:
    label: ツァプ
    summary: 赤い嘴を持つ大きな白鳥；子供をもたらすと信じられている。
    info: |-
      ツァプビライはヨーロッパ全体で屋根や杭に巣を作り、移動する鳥である。
      冬は熱帯アフリカで過ごし、毎年同じ巣に戻ってきて、その度に巣を大きくしていく。
      春と豊穣の象徴であり、民衆の伝統では子どもを運ぶという。
      チェコはヨーロッパで最も重要なツァプの繁殖地の一つである。
  animal.swallow:
    label: ツバメ
    summary: 尾が分かれた特徴的な形をしており、空中で素早く飛行する昆虫食の鳥。
    info: ツバメは冬をサハラ以南アフリカで過ごし、ヨーロッパで繁殖する渡り鳥です。空中での捕食に優れており、飛行中にのみ虫を捕まえ、水面に着陸することなく水を飲むこともできます。屋根裏や倉庫などで巣を作ります。民話では家の中にツバメがいると幸運がもたらされると信じられています。また春、帰還、そして故郷への忠誠心を象徴しています。
  animal.swan:
    label: 白鳥
    summary: 美しい白い大型の水鳥で、美しさとロマンスの象徴です。
    info: ヨーロッパ最大の飛べる鳥であり、翼幅は2.4メートルを超えます。美しさ、愛、忠誠を象徴し、ペアは生涯を通して互いに忠実です。警告として、無意識的に嘴を持ち上げて羽毛をふくらませます。H.C. アンデルセンの物語では、醜いガチョウが変化する象徴としても知られています。
  animal.toucan:
    label: トカゲ
    summary: 熱帯鳥で、非常に大きなカラフルな嘴を持つ。
    info: |-
      トカゲは、中米および南米の熱帯雨林に生息しています。
      その目立つ嘴は20cm以上ありますが、非常に軽く、空気の部屋で構成されています。
      体温調節、果物の切り裂き、他のトカゲへの視覚的シグナルとして使われます。
  animal.woodpecker:
    label: ドリルバード
    summary: 木の皮を叩いて昆虫を探すまたは穴を掘る鳥。
    info: ドリルバードは、硬い嘴と尾を使って木に叩きつけることに適応したピキダエ科の鳥である。舌は嘴の長さの最大三倍になり、打ち抜いた孔から幼虫を取り出すのに役立つ。また、叩く音でコミュニケーションや縄張りの主張にも使う。ヨーロッパ最大のドリルバードはカモシカ（学名：Dryocopus martius）である。
