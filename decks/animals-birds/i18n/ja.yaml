lang: ja
pivot: false
title: 鳥類
cards:
  animal.eagle:
    label: オウル
    summary: 湾曲した嘴と鋭い視力を持つ大型の猛禽類。
    info: ホシハジロワシはアメリカ合衆国の国鳥であり、北アメリカ最大の猛禽類の一つです。主に魚を捕食し、鋭い爪を使って水から直接捕まえます。翼展は2メートル以上になり、自然界では約20年生きることがあります。
  animal.flamingo:
    label: フラミンゴ
    summary: ピンク色の羽毛を持つ、片足で浅い水辺に立つ歩行鳥。
    info: フラミンゴは藻やプランクトンに含まれるカロテノイドによって特徴的なピンク色を獲得します。ヒナ鳥は灰色白く生まれ、時間が経つにつれて色づいていきます。湾曲した嘴はフィルターとして機能し、フラミンゴは頭を下に向けて水から餌を濾し出します。
  animal.hummingbird:
    label: コリブリ
    summary: 世界最小の、場所にとどまりながら飛行し、逆飛行もできる鳥
    info: ルビーネックコリブリは、北アメリカ東部で定期的に巣を作っている唯一のコリブリの種です。翼を秒間最大53回も振ることで特徴的な唸り声を立てます。花蜜と小さな昆虫を食べて生きています。また、心拍数は1分間に最大1200回にもなります。
  animal.owl:
    label: フクロウ
    summary: 夜行性の猛禽で、丸い目と静かな飛行、優れた聴覚を持つ。
    info: アメリカ大陸最大のフクロウはオオフクロウである。フクロウの目は動かせないため、代わりに頭を最大270度まで回転させる。彼らの飛行は、特殊な羽の構造によりほぼ静かである。暗闇の中で、異常に鋭い聴覚を使って獲物を捕まえる。
  animal.parrot:
    label: インコ
    summary: カラフルな熱帯鳥で、音や人間の言葉を真似ることができる。
    info: アラ・シャラトヴイは世界で最も大きなインコの一つで、翼の開きは1メートルを超えます。中南米の熱帯雨林に生息しています。インコは非常に高い知能を持ち、アラは色や形を識別し、数えることができ、最大で75年まで生きます。
  animal.peacock:
    label: 孔雀
    summary: 雄孔雀は美しい扇形の尾羽を持つ。
    info: 冠孔雀は南アジア原産の鳥である。雄は求愛の際に、実際には伸びた覆い羽である尾羽を扇のように広げる。その虹色の輝きは色素ではなく、光の屈折によるものである。
  animal.penguin:
    label: ペンギン
    summary: 南半球の飛べない鳥で、優れた泳ぎ手。
    info: 帝企鵝はすべてのペンギンの中で最も大きく、1.1メートル以上の高さに達します。南極に生息し、最も厳しい寒さの中で卵を産みます。雄は卵を足で抱えて、南極の冬の間、卵を温めます。水中では時速30キロメートル以上を出します。
  animal.toucan:
    label: トカゲ
    summary: 熱帯鳥で、非常に大きなカラフルな嘴を持つ。
    info: |-
      トカゲは、中米および南米の熱帯雨林に生息しています。
      その目立つ嘴は20cm以上ありますが、非常に軽く、空気の部屋で構成されています。
      体温調節、果物の切り裂き、他のトカゲへの視覚的シグナルとして使われます。
