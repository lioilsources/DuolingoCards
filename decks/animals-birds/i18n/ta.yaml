lang: ta
pivot: false
title: பறவைகள்
cards:
  animal.albatross:
    label: அல்லாட்ரஸ்
    summary: எல்லா பறவைகளிடையே அதிகபட்ச எச்ஸ்ஜி உண்ணும் ஒரு கடல் பறவை.
    info: "இங்கு ஓர் Albatross ஐப் பற்றி குறிப்பிடுகின்றது - அது எல்லா பறவைகளிலும் மிகப்பெரிய ஊசி விளிம்பு கொண்ட பறவை ஆகும், இது 3.5 மீட்டர் வரை அளவு கொண்டுள்ளது. \nஇது திறந்த கடலில் தான் பெரும்பாலும் வாழ்கின்றது மற்றும் தரையில் இறங்காமல் ஆயிரக்கணக்கில் கிலோமீட்டர் தூரம் பறக்க முடியும் .\nஇது கடல் நீரை குடிக்கின்றது மற்றும் ஷௌல் ஹைட்ரோஃபிழ்(salt glands) மூலம் உப்பு வெளியேற்றுகின்றது."
  animal.budgerigar:
    label: அண்டுலகா
    summary: ஆஸ்திரேலிய சிறிய பசி கழற் மரபனது.
    info: |-
      வளையமில்வட்டக் அண்டுலகா ஆஸ்ஸின் உள் நிலப்பகுதியில் ஒரு ஜன்னல் என்று ஏற்றுக் கொள்ளப்பட்டுள்ளது
      இது ஐரோப்பிய ஹங்கர் பிண்ணஞ்சியின் பின்னர் உலகில் மிகவும் பரவலாக ஓட்டுபவையில் ஒன்றாகும்,
      ஓட்டுபவர்கள் மனித குரலை பூஜ்ஜிழைகளாக காண்பிக்கவும் நூற்றுக்கணக்கில் சொற்களை கற்றுக்கொள்ளவும் முடியும்.
  animal.canary:
    label: கானரே
    summary: சிறு பழத்தடி நல் மணவள்ளி.
    info: |-
      இயற்கைப்
      p>அதன் வண்ணம் ஆஃப்ரோஸ்டாட் என்னும் மரத்தில் உள்ள ஒரு சிங்கிஸ் அல்லது 'ஆன்ஜின்' ஐ ஏற்றிக் கொண்டு ஓர் ஆண் ஃபிஷ் ஹூப் காணப்படுகின்றது.
  animal.cassowary:
    label: காசுவர்
    summary: பெரிய கடல்பறவையில்லாத நீண்ட மனம் வளைஞர்.
    info: |-
      இது ஒரு தொழி இல்லாத சிறப்பு உடலின் அஸ்ஸிரிங்கிள் என்ற ஜோடிஃ ஐரோப்பாவில் ஏற்படும் ஓர் ஹூஃப் ஷௌட் பறவை ஆகும்
      அதன் கைகளில் உள்ள கொடிகள் மிகவும் கடினமானவை மற்றும் மனிதனை காயப்படுத்தும் திறன் கொண்டவை.
      அதன் மூக்கில் உள்ள காஸ்கெட்(Cassique), காட்டில் நெரிசலை கண்ணோட்டம் கொண்டு செல்ல உதவும்.
  animal.cockatoo:
    label: காட்ஜோ
    summary: விசித்ரமான முலையணி கொண்ட ஆசியரப் பறவை.
    info: "ஆஸ்திரேலின் வளைகுடங்களில் உள்ளது ஒரு நிறைவஞ்சியான அழகிய பறவை\nஇதன் எழுந்த முலையணி ஏதேனும் ஓட்டம் அல்லது ஹீரோ ஐ காட்டும் \nஅது புத்திசாலியாக இருக்கின்றது மற்றும் மனிதனின் குரலை கண்ணிழந்து பின்பற்றும்"
  animal.condor:
    label: கொண்டார்
    summary: அமெரிக்காவின் முடி இல்லாத தலையுள்ள பறப்பு நா叼ன்.
    info: |-
      ஆண்டஸ் சிரசியூட்டு உலகில் எடையும் அடி விறைப்பும் ஏற்ற ஒழுங்கில் பறக்கும் பறவைகளில் மிகப்பெரியது
      இது ஓர் ஹோல்ஃப்; பெரிய ஸஃபானியின் ஜீவராசிகளை உண்ணி உயிர் வாழ்கின்றது மற்றும் ஐகோசிஸ்டமில் முக்கிய பங்கு வகிக்கின்றது
      இது ஆண்டஸ் மேல் பெரிய தரை மண்டலங்களில் கைகளை அசைக்காமல் குறைக்கும்
  animal.crane:
    label: குரூஸ் கிரசி
    summary: தாவல்மயமான நடனப் பண்டலியையும் வளைவற்ற இசையையும் அழுத்திச் சொல்லும் ஒரு உயர்ந்த ஆடும் பறவை.
    info: இங்கிழஞ்சி என்னும் பறவை 'ஜிஸ்' ஜிரஸ் என்னும் ஆங்கில போதனையில் ஏறக்குறைய ஐந்து ஆயிரம் கிலோமீட்டர் ஓட்டம் செய்யும் பறவை ஆகும். இதன் ஹிண்டு ஃபுட்டிங் ஷோ பறவைகள் குறிப்பாக இணைந்து குதிக்கும் மற்றும் தோள்களை விரித்து காட்சி காட்டும் தனித்துவமான நடனம் ஆகும்.
  animal.crow:
    label: கர்வஸ் கொரனியா
    summary: சமயத்துவப் பறி மட்டுமல்லாமல் சிரின்ற நண்பர்களுடன் இணைஞ்ஜியிழை அழைக்கும் ஒரு ஆஃப்ளிஷ்.
    info: இந்த எளிஸ் உலகில் 'ஆஃப்ளிஃ' ஐ ஏற்றுக்கொண்ணும்; ஹூமன் ஓஜிகளோடு பௌல் கீட்டும், தொழில்களை பயன்படுத்தும், கடினமான பிரச்னைகளை தீர்க்கும்.
  animal.cuckoo:
    label: குட்டிகொழி
    summary: தன் மஞ்சள் பறவையரணம் வலைப்பின்னாச்சி.
    info: ஓர் Obecná Kukavka Cuckoo) -ஆனது 'இரு தேடு' அழைப்பு ஒலியை உள்ளடக்கிய நெறில் எஃகு ஏவூர்ப்பு பறவையாகும்(Cuculus Canorus). ஓர் ஹஸ்ஸிர் ஜோடி தன் முட்டைகளை மற்ற பறவைகளின் கூட்டில் வீசி வளர்க்கின்றது.அதன் ஐந்து நாள் வயது குஞ்சு மற்ற முட்டைகளையும் குஞ்சுகளையும் கூட்டிலிருந்து தள்ளி விடுகின்றது.
  animal.dove:
    label: ஹோலுபிஸ்
    summary: இயற்றுமையின் அழகிரித்தனமான ஒரு நீல உறவு எஃகு.
    info: "ஆரம்பகாலத்திலிருந்தே , 'ஹெஸ்ஃப்' -ஐ ஏற்றுக்கொண்டு ஓலிவ் கிளையை ஹூஓமுக்கு கொண்டு சேர்த்தது . \n\nகிறிஸ்தவ மதத்தில் இது ஐயப்பரிஷத்தின் குறிச்சொலாகும்\n\nஎல்லா உலக நாடுகளிலும் ஜனங்கள் பௌதிக விழாக்களில் இந்த நீல உறவு எஃகுகளை விடுவிக்கின்றனர்."
  animal.duck:
    label: காட்டு கொசி
    summary: மரத் தண்ணியில் வளரும் பறவையின் ஒன்று;
    info: இப்பறவை Anas platryrhyncusஆகும்.
  animal.eagle:
    label: ஓரல்
    summary: மடிந்த தொங்கள் மற்றும் கண்கள் கொண்ட பெரிய பறவை பறக்கும் விலங்கு
    info: ஓரல் பெரிய முதுகு அமெரிக்காவின் தேசிய குறியீடு மற்றும் வட அமெரிக்காவின் மிகப்பெரிய பறக்கும் விலங்குகளில் ஒன்றாகும். இது முக்கியமாக மீன்களை பிடிக்கிறது, அவை தண்ணீரிலிருந்து நேரடியாக கைப்பற்றப்படுகின்றன அதன் குத்தான கைகளால். இதன் கைகளின் நீளம் இரண்டு மீட்டருக்கும் மேல் மற்றும் இயற்கையில் சுமார் 20 ஆண்டுகள் வாழ்கின்றன.
  animal.emu:
    label: எமு
    summary: உலகின் இரண்டாவது பெரிய நடனபறி மற்றும் அஸ்திரோசிலிஸ்.
    info: இளஞ்சிவப்பு எமு குழுவின் ஒரு பயிரிழப்பை ஏற்படுத்தும் பறிகளை நீக்க ஓடும்.
  animal.falcon:
    label: சோகல்
    summary: மிக வேகமான உயர்ந்துள்ளதுடன்(வழி) 320km / h -ஐ மணிப்பதற்றில்.
    info: பெரிய சீருங்களின் ஒரு 'ஸ்டைல்' எஃகு அடிப்பகுதியில் ஏறும் ஓட்டம் ஐந்து ரூபாய் ஊர்ஜமான ஸ்டீல் ஃபஞ்ச் ஷீட்டுகள் மீது ஹெவிடி கொண்டுள்ளது.
  animal.flamingo:
    label: ப்லேமென்னாக்
    summary: ஒரு காலில் நின்று குளிர்ந்த நீரில் நடமாடும் பாசன பறவை
    info: கரோட்டினாய்டுகள் கொண்ட சிலிக்கல் மற்றும் கிரேவியில் உள்ள உணவுகளை உண்பதன் மூலம் ப்லேமென்னாக் பாசன் தனது சிறப்பு நிறத்தைப் பெறுகிறது. இந்த பறவையின் குஞ்சுகள் ஆரம்பத்தில் பச்சை நிறத்தில் இருக்கும் மற்றும் நேரத்துடன் நிறம் மாறும். குழியான நோக்கி உணவு குறிப்பாக தண்ணீரில் இருந்து உணவை வடிகட்டும் கருவியாக செயல்படுகிறது, இதன் தலையை கீழே நோக்கி நிலை மாற்றும் மூலம் உணவை வடிகட்டும்.
  animal.goose:
    label: குரூட்டி
    summary: வானில் வழியாகச் 'தமல்' எண்ணெய் பறப்பவை;
    info: |-
      'அன்சர் அன்ஸர்', குளிர்ந்த இடங்களின் முனையில் உள்ள ஒரு ஏரியில் ஓடும் ஹஸ் ஐ ஊர்ஜிற்கின் முன்னோடியாக கருதப்படுகிறது
      இவை விழிப்புடன் குடும்பங்களை பாதுகாக்கின்றன
      ஹஸ் குரூட்டிகள் ஃபிஷ் பீஃப் மற்றும் கொண்ட உணவுகளை பெரிதும் விரும்புகின்றன
  animal.hawk:
    label: குரங்கிறை
    summary: மழப் பனி மற்றும் வயல்களில் தடவைகள் அல்லது நச்சு உண்ணும் இனங்களை ஆராயும் ஒரு எளிய ஏட்டு.
    info: "ஜஸ்ரஷாப்(ஆஃகிபினர்) என்பது ஜஸ்ஸ்ரஞாபோவிட்டீ ஐக் குடும்பத்தில் உள்ள ஓர் ஏட்டு ஊர்வன குடும்பம் ஆகும். இது குறுகிய மற்றும் வட்டமான கூடைகள் மற்றும் நீளமான வாலுடன் குறுகிய பசுமை பகுதிகளில் ஆராய திறன் வாய்ந்தது. \nஇது மிகவும் வேகமாகவும் திறமையாகவும் இருக்கின்றது;\nஅது பறக்கும் தடவைகளை அல்லது 'ஓஹா' என்று குறிப்பிடும் நிலையில் ஆராயும்."
  animal.heron:
    label: வால்லோ
    summary: தண்ணிர் பகுதி மற்றும் நடப்பு கரையின் அருகில் உள்ள வழியில் இனிதாகச் செல்லும் ஒரு எஃகு ஊர்ஜம்.
    info: இது Arda cinerae ஐ ஏற்றுகிறது; ஓஹங்கஞ்சா டிஸ்ஃப்ரஸ் ஹீரோ ஷூட்டிங் செய்யும் போது இது மௌனமாக நிற்கிறது. இது முழுமையாக மீன்கள் மற்றும் குள்ளங்கால் பூச்சிகளை உண்ண முடியும்.
  animal.hornbill:
    label: கால்கோன்
    summary: துவரிலி பறவையினம் - ஒட்டு மணியளவு நச்சிரப்புடன்.
    info: இது ஆஃப்ரிக்கா அல்லது தொழிற்பு இலை வாழ் எலி உள்ள ஏதேனும் ஓரிடத்தில் வாழும் ஒரு துவரிலி பறவையினமாகும். இதன் ஹங்ஸ்ஃ ஐஸ்(Casques) அல்லது 'அடர்' என்று அழைக்கப்படும் ஜீவியின் முக்கிய அடையாளமாகும்.
  animal.hummingbird:
    label: கொலிப்ரிக்
    summary: உலகின் மிகச் சிறிய பறவை ஆகும், இது இடத்தில் தன்னை மிதக்கவைத்து மற்றும் பின்னோக்கி பறக்க முடியும்.
    info: கொலிப்ரிக் ரூபினோஹர்ட்லி என்பது வட அமெரிக்காவின் கிழக்குப் பகுதியில் வழக்கமாக குடிசை கட்டும் ஒரே கொலிப்ரிக் வகையாகும். ஒரு விநாடிக்கு 53 முறை தனது கைகளை அசைத்து ஒரு தனிப்பட்ட குரலை உருவாக்குகிறது. இது நெக்டர் மற்றும் சிறிய பூச்சிகளை உண்ணும்; இதன் இதயம் ஒரு நிமிடத்திற்கு 1200 முறை துடிக்கிறது.
  animal.ibis:
    label: ஐபிசு
    summary: இஸ்ராஎலில் அழிக்கப்பட்ட ஒரு ஊர்ஜூன பறவை.
    info: "அஃபிஷ் - ஐபிசு ஏஜிஃப்டிக் ஹௌஸ்(threskion) என்ற ஓர் இரட்டை மரபில் உள்ள ஒரு பறவை ஆகும்\nஆன்டிக் எகிப்தில் தெஹௗத் என்ற தெய்வத்தின் உருவாக ஐபிசு பறவை கருதப்பட்டது \nமஞ்சள் ஐபிசு ஐரோப்பாவில் தொடர்ந்து பரவியது"
  animal.kingfisher:
    label: லெட்னியாசேக்
    summary: மணலுறவர மனதி கழிவுபயன்படுத்தி நீரில் சைகையிடும் ஒளிர்வான உயிற்பொறி.
    info: "ஆல்ஸெடோ அட்ஹிஷ் - எலெக்ட்ரான் பச்சை ஓர்ணஜ் ஜிஞ்ச் ஐட்டஸ் ஏற்படுத்தும் ஃபிளூஃபிழில் பௌன்ட் போன்ற ஒரு பறவை ஆகும்\nஅது நீரில் மேலே இருக்கும் மரத்தில் உள்ள கிளைகளில் உட்கார்ந்து மீன்களை கண்காணிக்கிறது;\nஇது தெளிவான நீரில் உள்ள மீன்களை கண்டறியும் ஒரு 'ஹிஸு' ஆகும் ; \nஎங்கும் இது வாழ்கிறதோ அங்கு நீர் ஆரோக்கியமானது."
  animal.kookaburra:
    label: கூலாபர்ரா
    summary: இது மனித கசகசவடி ஒற்றிய இயல் பொழிவுள்ள ஆஸ்டிரேலிய லண்ட்னஷீஃப்.
    info: கோஹாம்ஸ் - 'கூலாபர்ரா' என்பது நகைப்பது சார்ஜியிழ் அல்லது ஹஞ்சர் உடைய ஓர் ஏரிஃபிண்ட் ஐரோப்பிய ஆஸ்டிரேலிய பறவை ஆகும்; இது மனித கசகசவடி ஒற்றிய இயல் பொழிவுள்ள ஆஸ்டிரேலிய லண்ட்னஷீஃப்.
  animal.lorikeet:
    label: லோரி
    summary: இனிப்பு சேர்ந்த ஒவ்வொரு உணவும்.
    info: லோரி என்னும் லெயிட்ரஸ்(trichoglosus) அழகிய ஈர்ப்பு ஏற்பங்களை கூட்டும்.
  animal.lyrebird:
    label: லைரா குறி
    summary: அவத்தியப் படகன் அணுகளோடும் செயலில் முழுச் சரிநேர்வுடன் ஒலிகளை உருவாக்கும் ஓர் ஆஸ்டிரேலியப் பறவை.
    info: |-
      ஆஸ்டிரேலின் 'லைரொஹ்ஸ்ட்' ('Lyrachrost') என்ற பறவை ஏறக்குறைய எந்த ஒலியையும் - ஜீனரேட்டர், ஃபூட்டோ ஷூட்டர், ஹோர்ண் அலங்காரம் அல்லது மற்ற பறவைகளின் குரல்களை - துல்லியமாக காப்பி செய்யும் திறனுடன் கூடியது
      இந்த பறவை தனது சிகை போன்ற கால்களை காட்சிப்படுத்தி மற்றும் ஐமிடேஷன்களை காட்டி பெண்களை ஈர்க்கிறது,
      இது ஆஸ்டிரேலியாவின் விக்டோரியா மாநிலத்தின் குறியீடாக உள்ளது.
  animal.macaw:
    label: அரா
    summary: மிகவும் பளபளத்தகூடிய நறுமணச் சல்லி மயக்கனம் உடைய ஒரு வளர்ந்த அமெரிக்க ஊழல்.
    info: ஆரா என்று இருக்கும் இந்த ஏரின் ஜீனஸ் ஐக் கொண்ட ஓர் அமெரிக்க ஃபார்ரோட்ஸ் ஆகும்; இது மிகவும் கவர்ச்சியான நிழல் கொண்ட பறவைகளில் ஒன்றாகும். இஃது கனமான பழுப்பு பௌட்டர் ஹௗஸ் கொண்ட ஒரு வலிமையான கூடு கொண்டுள்ளது. இவை முழு வாழ்வு முழுவதும் குடும்பமாக வாழ்கின்றன.
  animal.magpie:
    label: கருப்பிடி
    summary: நீல வண்‍றயம் கொண்ட மட்சளத் தோற்றமுள்ள ஒரு ஆனவுறு இசைகழிய உயிர்.
    info: இது அழகில்லா ஓவிங்ஸ் என்னும் குடும்பத்தில் ஏற்படும் ஒரு மட்சள நிழல் கூடிய பறவை; அதன் நீளமான காஸ்டல் ஜெர்ணி ஐரோப்பிய ஹெரஞ்ச் என்னும் பெயரில் அழைக்கப்படுகிறது. இது 'அழகிய' பொருட்களை கொள்ளை கொள்ளும் என்று கூறப்படும் போதிலும், ஆராய்ச்சிகள் இதனை உறுதிப்படுத்தவில்லை. இது கண்ணாடியில் தன் பிம்பத்தை கண்டு கொள்ளும் மிக குறைந்த பறவைகளில் ஒன்றாகும்.
  animal.nightingale:
    label: படவளையின்
    summary: இது ஒரு சில நண்டு இரண்டு அழகிய எஃகு உருவங்களை ஏற்றுகின்ற ஓர் ஊர்ஜிரமான பறவை.
    info: |-
      ஓர் Obecny Slaviyak என்பது ஒரு சிறிய ஹீஸ் ஃபிளூ ஸ்போர்ஷ் ஐ கொண்டுள்ளது; இதன் ஆண் பறவை ஒரு மிகவும் சிக்கலான மற்றும் அழகிய பறவை பஞ்சகத்தை கொண்டுள்ளது
      அது முக்கியமாக இரவு மற்றும் காலை நேரத்தில் பாடுகிறது,
      இது தனது பெயரை பெற்றுள்ளது;
      இது redstart இன் தூரத்தில் உள்ள உறவு ஆகும்;
      Dante முதல் Keats வரையிலான உலகம் முழுவதும் கவிஞர்கள் படவளையின் பாடலை காதல் மற்றும் குறிப்பிழந்த உணர்வின் குறியாக கௌரவிக்கின்றன.
  animal.ostrich:
    label: பாட்டிரோஸ்
    summary: லண்டு பறக்கமுடி வில்லவதனர் -அச்சமயம் 70 கிமீ / நாள்.
    info: இரண்டு தொழுகை ஓடும் உறுப்பு இருக்கும் ஒரு ஆஃப்ரிக்க எருமை அடியின் ஏரிங்கிள் ஸ்ட்ரூதியோ கேமெலஸ்) ஐ ஜோடிற்கு ஃபிஷ் ஹஞ்ச் குடும்பத்தில் உள்ள ஒரு பறவை ஆகும்.
  animal.owl:
    label: சோவா
    summary: குறுக்கு கண்கள், அமைதியான பறவை மற்றும் சிறந்த காது கொண்ட இரவு பறவை பறவை.
    info: வெஸ்ட் கொள்ளை விரித்து வட அமெரிக்காவின் மிகப்பெரிய சோவா ஆகும். சோவாக்களின் கண்கள் நகர்த்த முடியாதவை, எனவே அவை தலையை 270 டிகிரி வரை திருப்பி கண்களை மாற்றுகின்றன. அவற்றின் பறவை சிறப்பு பூந்துளை கொண்ட கூட்டு காரணமாக குறைந்த ஒலியுடன் பறக்கின்றது. அவை மிகவும் நுண்ணிய காது உணர்திறனை பயன்படுத்தி இரவில் பிடித்து உணவு பெறுகின்றன.
  animal.parrot:
    label: பப்புச்
    summary: நிறமிகள் ஒரு வகை தென்னிந்திய பறவை ஆகும், இது ஒலிகளையும் மனித குரலையும் காப்பி எடுக்கும் திறன் கொண்டது.
    info: சர்லாட்டோ அரா என்பது கைக்கூடாரத்தின் நீளம் ஒரு மீட்டருக்கு மேல் இருக்கும் உலகின் மிகப்பெரிய பப்புச் பறவைகளில் ஒன்றாகும். இது தென்னாமெரிக்காவில் உள்ள குறிப்பிடத்தக்க காடுகளில் வாழ்கிறது. பப்புச் பறவைகள் மிக உயர்ந்த நுண்ணறிவு கொண்டவை ஆகும் - அரா நிறங்கள், வடிவங்களை அடையாளம் காண முடியும் மற்றும் எண்களை கணக்கிட முடியும். இவை மிகப்பெரிய வாழ்நாளை கொண்டவை, 75 வருடங்கள் வரை வாழும்.
  animal.peacock:
    label: பாவி
    summary: பாவியின் சிறப்பான கலர் கண்கள் நிரம்பிய கூந்தல் வடிவிலான தலை கொண்ட ஆண் பறவை
    info: குறிப்பாக இந்திய உபகண்டத்திலிருந்து வந்த பாவியின் ஆண் (பாவி) தனது முதுகுத் தோலை விரித்து முதுகுத் தோலை நீட்டிய கால்களை உள்ளடக்கிய கூந்தலை முதுகில் விரித்து பெண்களை ஈர்க்கிறது. இரிடிஸெண்ட் நிறங்கள் பிக்மெண்ட்களால் உருவாவதில்லை, ஆனால் ஒளியின் விலகல் மைக்ரோ கட்டமைப்புகளில் உருவாகின்றன.
  animal.pelican:
    label: சிலிங்னஸ்
    summary: அழைப்பதற்கு ஏற்ற ஒரு நீர் சிட்டிரஞ்ஜன் இருக்கும்.
    info: இது அழைப்பதற்கு உதவும் எஃகு போன்ற ஓர் ஊசியின் மூலம் ஐஷிஸ் ஹௌஸ் ஃபிளை செய்யும்.
  animal.penguin:
    label: பறக்கா பறவை
    summary: தெற்கு அரைக்கோளில் உள்ள ஒரு பறக்கா பறவை, நன்றாக நீந்தும் திறன் கொண்டது.
    info: தெற்கு அரைக்கோளில் உள்ள இந்த பறக்கா பறவை நன்றாக நீந்தும் திறன் கொண்டது. இது மிகப்பெரிய பறவையாகும், 1.1 மீட்டர் உயரம் வரை அடைகின்றது. இது துருவப் பகுதியில் வாழ்கின்றது மற்றும் குளிர்காலத்தில் முட்டைகளை முட்டைகளை தனது கால்களில் வைத்து வெப்பப்படுத்துகின்றது. நீரின் கீழ் இந்த பறவை மணிக்கு 30 கிலோமீட்டர் வேகத்தில் நீந்தும் திறன் கொண்டது.
  animal.pheasant:
    label: பாஜன்ட்
    summary: மிக பெருஞ்சறி நகைச்சவடி ; தண்ணீர் மலையில் உள்ளது.
    info: "இங்கிருந்து ஏழை விற்பன்னோர் , அஸியாவிலிருந்து ஐரேசியாவுக்கு எடுத்துச் செல்லப்பட்டது .\nஆண்(அடை ) ஒரு கண்கவர் ஃபூல் - ஊசி ஹீல் ஜீன்ஸ் மற்றும் கண் ஓட்டம் சுற்றிய குறிப்பிடத்தக்க கருமை நிழல் உள்ளது . \nஐரேசியாவில் மிகவும் பரவலாக காணப்படும் குறிப்பிடத்தக்க பறவை விஷயம்,\nஎஃகு மிகுந்த தரையில் குடியிருப்பது."
  animal.pigeon:
    label: குரூப்பா
    summary: மிகவும் சாதாரணமான நல்லி - மட்டற்ற தளத்தின் ஒரு வழக்கமான ஆயிரம்.
    info: |-
      ஹோலுப் ஸ்கல்னி அனைத்து ஊர்களியும் இரசிக்கும் ஹோலுப்புகளின் ஓர் உறவினத்தை ஏற்படுத்தியது
      இது மனிதர்களால் எளிதில் கீழடக்கப்பட்ட முதல் பறவை;
      ஆயிரக்கணக்கில் ஆண்டுகளாக மனிதர்களுக்கு ஐம்பது ஜோடிங் குறிஞ்சிகள் போல சேவை செய்தது.
  animal.puffin:
    label: பாஃபின்கள்
    summary: சோடி பறவையும் நனக்சலர் மணியும்.
    info: |-
      தென்துழாவில் உள்ள Fratercula arctica என்ற இனத்திட்கு அடுத்தடுத்து வரும் ஒரு சிறிய ஏரிருப்பு பறவை ஆகும்
      இது ஓட்டுதல் ஊர்ஜம் மூலம் ஐஸ்லாந்து மற்றும் ஃபாரோ தீவுகளில் ஸ்஥ாயி குறியாக உள்ளது.
  animal.quail:
    label: மணலி
    summary: பசியின் மரட்டிற் சிரளன்.
    info: |-
      யூரோப்பிள் தொடர்நிலை இருப்பிழை ஒரு உறுப்பினர் ஆகும்
      இஃது அஸ்ஸிஷிஃஆகும் ;அதன் எளிய ஓசை(Piti-Pitu)
      மற்ற ஜாஹ்ஹஞ்ணிகளிலிருந்து ஏனைய ஐரோப்பிய
      எளிய முட்டைகள்.
  animal.raven:
    label: கர்கவேச்
    summary: நடுத்தர அளவிலான மற்றும் புலி வண்ணப் பழுப்பு சின்னக்குருவி.
    info: இது Corvus corax என்ற ஆய்வு ஒரு உயிரியல் குடும்பத்திடம் ஏற்படுத்தும் ஈஸ்ஸிழிஷ் ஐஎஃப்ஜி ஹீரோ ஃபூல் ஓவர் ஊர்வலம்.
  animal.roadrunner:
    label: குட்டிக் செஞ்ஜி
    summary: வளர்ந்த அமெரிக்கப் பசுமைத் தலையணொற்று வனப்பகுதியில் ஓடும் ஒரு மிருகம்;
    info: அமெரிக்க எரிஸ்னஸ் இழைகளில் 'Road runner' உம் ' Coyote' உம் ஏற்படுத்தும் காரிங் ஹீரோவாக பெயர்.
  animal.robin:
    label: கருப்பு
    summary: இது ஒரு வழக்கமான நெடுங்கஞ்சு உடைய தொழினீர் எஃகு அதன் இருப்பிடம் UK.
    info: |-
      அது ஓஜஸ்வியான ஃபிரஷ் - சிவப்பு மடலில் .
      எளிதில் ஏறும் ; ஜன்னல் ஹாட்ஸ் ஐ கண்காணிக்க மற்றும் காண்பிக்கும் விழுத்துகளை சேகரிக்க.
  animal.seagull:
    label: கடல் குரூப்பான்
    summary: மணறிலுள்ளவர்களிடத்திலும் மக்களின் உணவுகளையும் நசுக்கி எடுக்கும் ஒரு வழியாக இந்த சீரிஸ் அஸ்ரெட்டஷ் ஹஞ்ஜ்.
    info: "இந்த Laru argentatus ஐரோப்பாவில் ஏறக்குறைய ஓர் ஊரிற்கு மற்றொரு ஊருக்கு பரவியுள்ள மிகவும் பரவலான கடல் பறவையாகும்\nஅஃது தன்னை தானே தயார் செய்து கொள்ளும் மற்றும் அனைத்து வகை உணவுகளையும் உண்ணும் ; கடற்கரையில் மட்டுமின்றி , குறிப்பாக ஏரி மற்றும் ஆறுகளுக்கு அருகிலும் வாழ்கின்றது . \nஇது புத்திசாலித்தனமானது மற்றும் மக்கள் அதனை உணவு கொடுக்கும் இடங்களை நினைவில் வைத்துக் கொள்ளும்."
  animal.secretary_bird:
    label: பிராணி குறிப்போர்
    summary: சதையடக்கம் செய்யும் தலைவன் - மழை வளைவு நகர்வு.
    info: அஃபிலின் இஸ்ஸிட்டர் என்று அழைக்கப்படும் ஒரு உயிரிஞர் ஏற்கனவே ஓர் ஐரொப்பிய ஜீவன் குறிப்போர் என்று அழைக்கப்படும் 'இஸ்ஸிட்டர்' என்ற ஹூரோன் சொல்லிலிருந்து பெறப்பட்ட பெயரைக் கொண்டுள்ளது.
  animal.sparrow:
    label: வரபேச்
    summary: இலட்டீஸ் வளையங்களில் உறைவியாக நடந்து மனிதர்களுடன் ஒரு அருகில் ஆக்கிரமிக்கும் எளிய ஹோல்ஸ்.
    info: |-
      அது ஏறக்குறைய ஐரோப்பிள் ஊர்ஜூன் ஓர் ஃபிஷ் ஆஃப் மனிதர்களுடன் ஒரு பெரிய பறவை ஆகும்
      எல்லா மனிதர்களும் வாழ்க்கை முறையில் ஒரு குறிப்பிட்ட இடத்தில் குடியிருப்பதை மனிதர்கள் கண்ணும் கருவியுமாக கொண்டுள்ளனர்,
      ஆனால் இந்த காலத்தில் அவர்களின் குடியிருப்பு மனிதர்களின் குடியிருப்பு குறைவதற்கு காரணமாக உள்ளது.
  animal.spoonbill:
    label: கொல்பிக்
    summary: மாறுபட்ட தண்ணி மரத்தளவு வந்த இனச் சிலம்பையின் ஒரு உயிரி.
    info: "இஸிஸியின் அண்மை உறவாக கோல்பிக் ஆனது, ஓர் எளிதிற் கண்காணிக்கக்கூடிய சீருடை ஜோவங்கிளை ஏற்றிய தலையை கொண்டுள்ளது. \npழுக்கஞ் செய்யும் உணவு தேடும் போது குறுக்கு வழியாக தண்ணியில் தனது ஜோவங்கை நகர்த்துகின்றது\nஅஃது குறுக்கு வழிய஼ாக தண்ணியில் தனது ஜோவங்கை நகர்த்துகின்றது."
  animal.stork:
    label: காவி
    summary: சிவப்பு நோட்டர் கொண்ட ஒற்றைத் தலம் உள்ள மின்சன பறவை.
    info: |-
      ஐரேயில் அழகிய ஆஸ்ரயம் என்றும் ஐரோப்பாவில் ஏற்படும் ஓட்டக பறவை ஆகும்
      இது ஃபிஸிங்ஜியா ஷிணிஞியா என்று அறியப்படுகிறது,
      அஃது தூய்மையான தீவின் மீது குடியேறும் பறவை ஆகும்.
  animal.swallow:
    label: அதிவேகமான தூய்மை நீர் செலவில் அளவு எடுக்காமல் ஒரு ஜோடி ஏற்றும் ஹியூண்டோ ஃபஸ்ஸின்.
    summary: இது ஓர் அதிவேகமான காற்றில் உள்ள பூச்சிகளை உண்ணும் பறவை ஆகும்.
    info: "ஹிங்கோ ரஃப்ஷிகா என்பது ஐரோப்பாவில் குடியிருப்பதும், குறைந்த சாஹாரா ஆப்பிரிக்காவில் குளிர்காலத்தைக் கழிக்கும் பறவை ஆகும். \nஇது காற்றில் பறந்து கொண்டே பூச்சிகளை வேட்டை செய்கிறதும், நிழலில் தரையில் குறுக்கு வெட்டு இல்லாமல் தண்ணீர் குடிக்கும் திறன் கொண்டதுமாகும்."
  animal.swan:
    label: அஸ்ஸிட்
    summary: இது ஒரு அழகான இருள் உறைவின் எஃபோரியா ஐகான்.
    info: |-
      ஆன்ஃபீட் ஏஜிள் ஹொஹூ ஜீனஸ் ஓலோர்) என்பது ஐரோப்பாவின் மிகப்பெரிய பறக்கும் பறவையாகும், அதன் கைகளின் நீளம் 2.5 மீட்டருக்கு மேல் உள்ளது
      இது அழகு, காதல் மற்றும் பக்தியின் குறியீடாகும்;
      எதிரிகளுக்கு எச்சரிக்கையாக இது தனது முக்கூட்டு மற்றும் துடைப்பை நிரப்பும்.
  animal.toucan:
    label: துகான்
    summary: துகான் என்பது ஒரு பெரிய பச்சை நிற முக்கை கொண்ட ஒரு நெடுந்தூர பறவை ஆகும்.
    info: துகான் என்பது மத்திய மற்றும் தெற்கு அமெரிக்காவில் காணப்படும் காடுகளில் வாழும் ஒரு பறவை ஆகும். அதன் கணிசமான முக்கை நீளம் 20 செ.மீ ஆகும், ஆனால் மிகவும் குறைந்த எடை கொண்டது ஆகும். இது காற்று குழாய்களால் ஆனது. இது உடல் வெப்பநிலையை சமன் செய்வதற்கும், பழங்களை நொறுக்குவதற்கும், மற்ற துகான்களுடன் தொடர்பு கொள்ளவும் பயன்படுகிறது.
  animal.woodpecker:
    label: தடைல்
    summary: மரக்காயிலுள்ள பசி வண்டுகளைப் பறவை தன்னோடு இழுக்க அடித்து நொறுக்கும்.
    info: இது 'Picae' என்ற மரக்காய் செடியின் ஒரு உறுப்பினர்; இது ஓர் ஏறும் ஜீவன் பறவை ஆகும், இதன் குறிப்பாக ஃபிரஸ்ஸிங் ஷூட்டிங் ஐடியா ஹௌஸ் ஆஃப் பைரோலிழிஞ்ச் மற்றும் காட்டு மரங்களில் உள்ள பசி வண்டுகளை கண்ணாடி மூலம் கண்டுபிடிக்க உதவும்.
