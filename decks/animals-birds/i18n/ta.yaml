lang: ta
pivot: false
title: பறவைகள்
cards:
  animal.eagle:
    label: ஓரல்
    summary: மடிந்த தொங்கள் மற்றும் கண்கள் கொண்ட பெரிய பறவை பறக்கும் விலங்கு
    info: ஓரல் பெரிய முதுகு அமெரிக்காவின் தேசிய குறியீடு மற்றும் வட அமெரிக்காவின் மிகப்பெரிய பறக்கும் விலங்குகளில் ஒன்றாகும். இது முக்கியமாக மீன்களை பிடிக்கிறது, அவை தண்ணீரிலிருந்து நேரடியாக கைப்பற்றப்படுகின்றன அதன் குத்தான கைகளால். இதன் கைகளின் நீளம் இரண்டு மீட்டருக்கும் மேல் மற்றும் இயற்கையில் சுமார் 20 ஆண்டுகள் வாழ்கின்றன.
  animal.flamingo:
    label: ப்லேமென்னாக்
    summary: ஒரு காலில் நின்று குளிர்ந்த நீரில் நடமாடும் பாசன பறவை
    info: கரோட்டினாய்டுகள் கொண்ட சிலிக்கல் மற்றும் கிரேவியில் உள்ள உணவுகளை உண்பதன் மூலம் ப்லேமென்னாக் பாசன் தனது சிறப்பு நிறத்தைப் பெறுகிறது. இந்த பறவையின் குஞ்சுகள் ஆரம்பத்தில் பச்சை நிறத்தில் இருக்கும் மற்றும் நேரத்துடன் நிறம் மாறும். குழியான நோக்கி உணவு குறிப்பாக தண்ணீரில் இருந்து உணவை வடிகட்டும் கருவியாக செயல்படுகிறது, இதன் தலையை கீழே நோக்கி நிலை மாற்றும் மூலம் உணவை வடிகட்டும்.
  animal.hummingbird:
    label: கொலிப்ரிக்
    summary: உலகின் மிகச் சிறிய பறவை ஆகும், இது இடத்தில் தன்னை மிதக்கவைத்து மற்றும் பின்னோக்கி பறக்க முடியும்.
    info: கொலிப்ரிக் ரூபினோஹர்ட்லி என்பது வட அமெரிக்காவின் கிழக்குப் பகுதியில் வழக்கமாக குடிசை கட்டும் ஒரே கொலிப்ரிக் வகையாகும். ஒரு விநாடிக்கு 53 முறை தனது கைகளை அசைத்து ஒரு தனிப்பட்ட குரலை உருவாக்குகிறது. இது நெக்டர் மற்றும் சிறிய பூச்சிகளை உண்ணும்; இதன் இதயம் ஒரு நிமிடத்திற்கு 1200 முறை துடிக்கிறது.
  animal.owl:
    label: சோவா
    summary: குறுக்கு கண்கள், அமைதியான பறவை மற்றும் சிறந்த காது கொண்ட இரவு பறவை பறவை.
    info: வெஸ்ட் கொள்ளை விரித்து வட அமெரிக்காவின் மிகப்பெரிய சோவா ஆகும். சோவாக்களின் கண்கள் நகர்த்த முடியாதவை, எனவே அவை தலையை 270 டிகிரி வரை திருப்பி கண்களை மாற்றுகின்றன. அவற்றின் பறவை சிறப்பு பூந்துளை கொண்ட கூட்டு காரணமாக குறைந்த ஒலியுடன் பறக்கின்றது. அவை மிகவும் நுண்ணிய காது உணர்திறனை பயன்படுத்தி இரவில் பிடித்து உணவு பெறுகின்றன.
  animal.parrot:
    label: பப்புச்
    summary: நிறமிகள் ஒரு வகை தென்னிந்திய பறவை ஆகும், இது ஒலிகளையும் மனித குரலையும் காப்பி எடுக்கும் திறன் கொண்டது.
    info: சர்லாட்டோ அரா என்பது கைக்கூடாரத்தின் நீளம் ஒரு மீட்டருக்கு மேல் இருக்கும் உலகின் மிகப்பெரிய பப்புச் பறவைகளில் ஒன்றாகும். இது தென்னாமெரிக்காவில் உள்ள குறிப்பிடத்தக்க காடுகளில் வாழ்கிறது. பப்புச் பறவைகள் மிக உயர்ந்த நுண்ணறிவு கொண்டவை ஆகும் - அரா நிறங்கள், வடிவங்களை அடையாளம் காண முடியும் மற்றும் எண்களை கணக்கிட முடியும். இவை மிகப்பெரிய வாழ்நாளை கொண்டவை, 75 வருடங்கள் வரை வாழும்.
  animal.peacock:
    label: பாவி
    summary: பாவியின் சிறப்பான கலர் கண்கள் நிரம்பிய கூந்தல் வடிவிலான தலை கொண்ட ஆண் பறவை
    info: குறிப்பாக இந்திய உபகண்டத்திலிருந்து வந்த பாவியின் ஆண் (பாவி) தனது முதுகுத் தோலை விரித்து முதுகுத் தோலை நீட்டிய கால்களை உள்ளடக்கிய கூந்தலை முதுகில் விரித்து பெண்களை ஈர்க்கிறது. இரிடிஸெண்ட் நிறங்கள் பிக்மெண்ட்களால் உருவாவதில்லை, ஆனால் ஒளியின் விலகல் மைக்ரோ கட்டமைப்புகளில் உருவாகின்றன.
  animal.penguin:
    label: பறக்கா பறவை
    summary: தெற்கு அரைக்கோளில் உள்ள ஒரு பறக்கா பறவை, நன்றாக நீந்தும் திறன் கொண்டது.
    info: தெற்கு அரைக்கோளில் உள்ள இந்த பறக்கா பறவை நன்றாக நீந்தும் திறன் கொண்டது. இது மிகப்பெரிய பறவையாகும், 1.1 மீட்டர் உயரம் வரை அடைகின்றது. இது துருவப் பகுதியில் வாழ்கின்றது மற்றும் குளிர்காலத்தில் முட்டைகளை முட்டைகளை தனது கால்களில் வைத்து வெப்பப்படுத்துகின்றது. நீரின் கீழ் இந்த பறவை மணிக்கு 30 கிலோமீட்டர் வேகத்தில் நீந்தும் திறன் கொண்டது.
  animal.toucan:
    label: துகான்
    summary: துகான் என்பது ஒரு பெரிய பச்சை நிற முக்கை கொண்ட ஒரு நெடுந்தூர பறவை ஆகும்.
    info: துகான் என்பது மத்திய மற்றும் தெற்கு அமெரிக்காவில் காணப்படும் காடுகளில் வாழும் ஒரு பறவை ஆகும். அதன் கணிசமான முக்கை நீளம் 20 செ.மீ ஆகும், ஆனால் மிகவும் குறைந்த எடை கொண்டது ஆகும். இது காற்று குழாய்களால் ஆனது. இது உடல் வெப்பநிலையை சமன் செய்வதற்கும், பழங்களை நொறுக்குவதற்கும், மற்ற துகான்களுடன் தொடர்பு கொள்ளவும் பயன்படுகிறது.
