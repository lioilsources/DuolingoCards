lang: fa
pivot: false
title: پرندگان
cards:
  animal.albatross:
    label: آلباتروس
    summary: پرنده‌ی دریایی با بزرگترین پهنای بال از تمام پرندگان.
    info: '{"info":"الباتروس مهاجر دارای بزرگترین پهنای بال از همهٔ پرندگان است که به طول فراتر از سه و نیم متر میرسد، حالت زمان خود را در روی آب باقی میدهد و قادر به پرواز صدها کیلومتر بدون فرود است. او از آب دریائی غذاء میکند و شوریت را توسط غدد انفی جدا میسوزد. در جوامع دریانوردی قتل الاترس معنای بدشگاهی برای مردان دارد."}'
  animal.budgerigar:
    label: اندولکا
    summary: پروار رنگی سبک به نام ان долکا، چهره معروف حیوانات جانبی در استرالیا.
    info: اندولکا ونلکووا از منطقه داخلی استرالیاست که در توده‌های بزرگ زندگی می‌کند. انдолکا دومین پرنده خانگی شناخته شدۀ جهان بعد از ققنوس است.
  animal.canary:
    label: کاناره
    summary: پرتقالی کوچولو، مرغ لطافتمندی که مثل ماشین شخصی خانگی محبوب هست
    info: |-
      کانارهٔ خانگی از جنوب آتالانتی و در قرن هفدهم به‌خاطر دست کاشته شدند
      با پرواز نژادها، رنگ زرد ظاهر شد؛ حالت طبیعی کاناره سبز تیره است
      مردان ملودی‌های پیچیده‌ای رو با صدا برجا می‌ذارن؛ مسابقات غنای کاناره فینوم عالمی هستشون
      در سابقه، کاناره برای تشخیص منوکسید کربن تو معادرهای ذغال سنگ استفاده بشدن
  animal.cassowary:
    label: کسوار
    summary: پرندهٔ بدون بال اما خطرناک نواحی نوگینا با سوزنهای برنج.
    info: |-
      کاسوار پرندگان بزرگی هستند که در نوگینا و شمال استرالیا زندگی می‌کنند، از لحاظ خطرناک بودنش به عنوان غیرقابل مقایسه ترین پرنده جهان شناخته میشوند؛ انگشت داخلی آنها دارای سوزنب بریده قابل باعث صدمه جدی میشه
      تاج عظیم فلزی روی سرشان که نقش راهنمائی در جنگلهای متراکم را دارد
      همچنین نقش مهمی در حمل بذور جنگلات گرمدار دارند.
  animal.cockatoo:
    label: کاکادو
    summary: پرندهٔ فراموش با بالهای سفید و موچسب طلائی.
    info: کاکادو زردسر، به عنوان پرندگانی از خانواده کاکادوها شناخته می‌شود و در بین آنها معروفتر است. سربار جلوتای نمایان را دارد که هنگام عصبانیت یا ترس بلند می‌شود.
  animal.condor:
    label: condor
    summary: بزرگترین پرنده بالافلک قاره آمریکا با صفت عضو غیرقابل مشاهده.
    info: کوندور آندزی بزرگترین پرنده بالاپرواز جهان از نظر وزن و بازوای کردن است؛ این حشرات خور مخصوص به مرغان داغ سبک زمین روزنه هستند، در تغذیه انسجام فراوان وجود دارند و نقش مهمی در محصولات طبیعی ایفا می‌نمائید. بدون حرکت دادن بالها بر روی جریان هوا عمومی بلند شدنشان را انجام می دهد.
  animal.crane:
    label: جرب
    summary: پرنده‌ی مهاجر بزرگی است که به رituál‌های رقصانه و صدای بلند معروف است.
    info: '{"hint":"پرنده‌ی بزرگ و باشوق مهاجر که به نمایشهای رقصانه معروف است، جنس Grus grus","info":"کرووا سفید پرندۀ اصلی است که هزاران کیلومتر درسال تغ迁 می‌کندا.\nبا طقوسهای رقاصانه مشهور شد که زوجها قدم فوت می‌زنند و بال خود را باز می‌دارند.\nدر حجم عظیم روی دشت ایران در پائیز و بهار حرکت می‌کنند.\nاسم ماشین بلندکمر براساس اسم این پرنده آمد.'
  animal.crow:
    label: وِرانَ
    summary: پرندهٔ سياه هوشمند اهل حل المسائل
    info: |-
      وُرَنَا پرنده‌ای از خانواده کروکس است که به هوش فوق العاده معروف شد، می تواند صورت ها را تشخیص دهد و با نمونه ها سازگار عمل کند
      در جمع آبجکتها مشغول فعالیتهای مختلف بوده و غذختون علاوه بر حشرات شامل انواع مواد غذايى ديگر نيز ميشود
      در متافيزيك تاريخي چيك قديم به ويژگيهاى ماوراءالطبيعى اختصاص يافته
  animal.cuckoo:
    label: کوچ
    summary: هنوزده با وجود تخم‌های غیرمستقل.
    info: |-
      کوچا کلر به خاطر پارازیت هنوزده شناخته می‌شود؛ تخم را در جایگاه دانه‌ها قرار می‌دهد، جایی که والدین اساتید آن را فراموش و نابالغ می‌کند。
      پسرخوانداز کوچا سبک زودتر تمام تخم‌ها و بقیه صفت‌های حلقه را از داخل جایگاه دور انداخته است.
      hlas دوقلوی او «کُ» علامت رسیدن بهار است.
      kukají مردان، ton بلوندزن زنان.
  animal.dove:
    label: merghabī
    summary: نشانه صلح؛ مرغابی سفید بدون لطافت
    info: |-
      بی‌مارم دروازه، نشان ملحد اسلام است؛ به کتاب عهد قدیم خداوند فرستادن پرنده با ساقه زایچه برگرفته شود
      در مسیحیت دلالت بزرکتر روح القدس است
      مرغابی منزلی واقعاً مرغابی سنگین تربیت شده است؛ طراوت آسمانی اثر هجمناژ مصنوعی است
      آزاد کردن مرغان آسمانی جزو رسوم مهم انواع مختلف رویدار است
  animal.duck:
    label: کاچن
    summary: پرندهٔ جنسیت خودرو به اسم «کاچن» در تمام نقاط جغرافیایی وجود دارد.
    info: کاچن دیوُکه، پرندگان آبزی با زَمین کوتاه و سفید است؛ نام علمی اش Anas platyrhynchos می‌باشد.
  animal.eagle:
    label: ورلن
    summary: پرندهٔ شکارچی بزرگی با منقار انحناءدار و دید تصاح.
    info: اورل سفیدسر نماد ملی امریکا است و به بزرگترین پرندگان شکارچی آمریکای شمالی تعلق دارد. عمدتاً ماشوم را هدف قرار می‌دهد که با فنجن خود مستقیماً از درون آب صید می‌نماید، زیرافته حاوی موثرات ضعیفی بر روی جلد است. بالهای او طولی حداقل دو متر داشت.
  animal.emu:
    label: '{"label": "ماکوئه",'
    summary: '"summary": "دومین پرنده بزرگ جهان، غربلاط لخت و اصلی.'
    info: '{"hint":"دومین پرنده بزرگ؛ نمیتواند بالزدن، راتای استرالیا اهلیت دارد","info":"ماکوئه قهوه‌ای دومین درجه جنوب شرقی و به طور خاص منطقه مرکزی آسیا محسوب میشود\nدر ساختار فرهنگی مهمترین نقشه هستند که توسط حوزه علمی مدیریت میشوند\nهمچنین ماکوئهها باعث زحمت برخی مشاغل عمومی مثل خدمات شهرداری میشوند\nدر سال ۱۳۹۰ دولت استرالیا تصاحب تمام حقوق معنوی ماکوئهها را متوقف کرد.'
  animal.falcon:
    label: سرقل
    summary: سرقل سريعترين حيواني است كه در حركت مستقيم بالغ بر ۳۲٠ كيلو متري بر ساعت مي‌كند.
    info: سرکل سیاه‌بال پرتابانترین حيوان زمين است كه در حركث شيريني به روشدي بيش از ۳۲٠ کيلومتري بر ساعت مى‌رسد؛ داراي لوزالمعمري تاريكي تحت عيناپيس، جلوگيري از بازي نور خورشيد است. مردم براي صياحي و قاچيزني آن حدود ٢ هزار سال ديگر استفاده كردند؛ فعاليت «سوكولنيتي» ثبت ملي يونيسيف است.
  animal.flamingo:
    label: phoenix
    summary: بروزفونیکوترس قرمز دم روی چوب بلند در مناطق مرطوب.
    info: |-
      رَنگِ خاص رُزفونیکتره‌ها از کاروتن ها موجود در جلبک و ماهیان ناشئ شده است، مواد غذایی آب را با زبانش فلتر می‌کند.
      در حالت طبیعی پرن به صورت سپید تولد می‌شد ولی بعد از لحظات برجسته رنگ بدیند.
  animal.goose:
    label: هوشا
    summary: پرندهٔ آبی بزرگ با حرکات مثلث؛ غذاخوری روی زمین.
    info: هوسا بزرگ پیشین خانوادگی های دوم است و به صورت مشخص در قالب کلید مهاجرت می‌کند، جاهای رهبری اصلی نوبتی توسط مرغاب فراهم شده است. آنها وقتی قفس زدن می‌کنند حساسیت بالایی بر روی منطقهٔ خود دارند و بدون ترس سرچشمه‌زنی مال موذول را مقابله می‌کنند.
  animal.hawk:
    label: سَرمَا
    summary: پرهاس متخصص در قتل موش‌ها و مرغ‌ها
    info: سرما، خانواده‌ای از پرندگان شکاری است که توانایی مدرن در جنگل با دم بلند و بال ها را به علت ساقط بودن آنها دارد؛ نسبت به حالت طبیعی فعالترین نوعش بر روی صید پرنده هاست.
  animal.heron:
    label: گرگ‌ماهی
    summary: برفراز آب قرار می‌گیرد و برای صید ماشم ثابت می‌ماند.
    info: گرگ‌ماهی خاکستری بزرگترین پرندهٔ جویدن در منطقۀ اروپای مرکزی است، که مثل مجسمه نمیلرزد و منتظر میماند تا ماش به سمت آن حرکت کند؛ بعد با زمزمه بلند فوران دارد. قادر است تمام ماشه ها را بدون تقسیم شدن بلع کند.
  animal.hornbill:
    label: زوبوروج
    summary: -ptak tropical با zobák enormní و rozhornelený.
    info: زوبوروژه، پرندگانی از خانواده بوسروتیدا هستند که به‌خاطر زبای عظیم و دارنده قسمت استخوانی آشکار شناخته می‌شوند. در جنگل‌های سوزنبیرانی آفریقا و آسیا زندگی می‌کنند. این پرنده‌ها توپول نمی‌زنند بلکه داخل سوراخ‌های درختان تخم می‌ذارند؛ ماده را موچع طرف مقابل بازوهایش می‌کند و تمام دوران فراموشی در داخل اندازه می‌ماند.
  animal.hummingbird:
    label: کلیبر
    summary: پرنده جهان کمتر وزنش قادر به تعامل هوائی بدون حرکت و پرواز معکوس.
    info: کلیبر روبینهال دسته‌ای از پرندگان کوچک است که تنها در شرق آمریکا شمالی زاد و ولد می‌شود، با تعداد بال‌زنی همزمان به اندازهٔ ۵۳ بار در ثانیه صوت خاصی ایجاد می‌نماید. غذاء مناسب بر روی عسل سبز و حشرات نسبتاً فراوان وجود دارد؛ قلب او حداقل ۱٬۲۰۰ ضرب در دقیقه حرکت می‌کنید.
  animal.ibis:
    label: ابیس
    summary: بروز بردار ذره بنفش، معروف به مصر باستان.
    info: |-
      {"hint":"نکته","value":"پرندۀ برود با زانوی بلند و خمیده؛ مقدس در مصر کهن (تِرسْكئورونثُردَها)","info":"ایبیس پرنده‌ای است ساحلگیر از تراکمهٔ ترشکئورونثریدا، دارای فنجان طولانی به شدت منحنی مشخص.
      در مصر قدیم، «ایبیس مقدس» به عنوان جلوه‌ای ازخداعطات عبادت میشد.
      این پستانداران در محله های مرغزار و حاشیه رودخانه هاست
      «ایبیس قهوه ای» بدون آگاهی به اروپا منتقل شد و الان به صورت نفوذآفرین به طرز توهم انگیخته ای چترش می کند.
  animal.kingfisher:
    label: کلندن
    summary: طوطئه‌ای شبیه سنگ چمن برای صید ماهی در رودخانه.
    info: |-
      کلندن رودخانه‌ای از زیباترین پرنده‌ها در اروپا است که دم و سرش برق آبی، قفسهٔ شش ضلعی نارنجی دارد؛ روی تنه بالاتر از جوی مینشیند و ماهی ها را تعقیب می‌کند؛ بعد به طور مستقیم فوند می‌زنید
      در مناطق خالص وجود او حالت عادی است؛ وقتی باشد، آب تمیز است
      در ژاپن نوع مشابهی از کلندن (hishu) موجود است که معناگذار زیبائیست
  animal.kookaburra:
    label: پرندهٔ خنده
    summary: چشم انداز جذب در دیدار زمانی که لبخند روز تازه روشن میشود.
    info: کوکابورا، که به عنوان پرندگان خنده‌دار استرالیایی شناخته میشود، نماد بوس استرالیاست و صدای آن سنتی برای بازتاب فجر و غروب خورشتراست.
  animal.lorikeet:
    label: لوري
    summary: مرغان رنگارنگ سازماندهی شدۀ بر روی نكترو غبر.
    info: لوری دوهووه، مرغ خانه‌ای کمک می‌کند و رنگارنگترین پاپوشک از همه است. با زبان فرشت نектر و غبار حشرات در چمنزارها جمع آورد. به عنوان مهم ترین عامل لقاح باغ‌های گرم‌آبی عمل می‌نمود.
  animal.lyrebird:
    label: لیروچوست
    summary: پرنده‌ای استرالیایی که تمام صوت‌های محیط را با دقت فوق العاده تقسیم می‌کند.
    info: لیروچوست نایدرون از پرندگان استرالیا محسوب می‌شود که به خاطر توانائی در شبیه سازی همه صداها، مثل ماشین برش دنده، دوربین عکاسی و فراموش شدن زمزمهٔ جوجه‌های دیگران مشهور است. مردان با نمایش بال‌های لیر آشنا و قابلیت انعکاسات دقیق برای جذابیت زنان عمل می‌نمایند.
  animal.macaw:
    label: آرا
    summary: پرواز بلند ناتروفیکال با بال‌های فشرده و لخت.
    info: ارا پرندگان بزرگی هستند که در جنگل‌های استوائی آمریکا زندگی می‌کنند و بهترین رنگبافت از تمام پرنده‌ها دارند، با سرسوزن قدرتمندشان قادر به شکستن تخم مرغ صعب العبور هستند.
  animal.magpie:
    label: کَراخ
    summary: پرندهٔ سیاه و سفید با ذُلّتِ طولانی.
    info: |-
      کرکس عمومی پرنده‌ای از خانواده کرکاوه است با رنگ سفید و مشکی متمایز و دم بلند به رنگ سبز درخششدار آسمانی
      در جمع شدن با مواد براق معروف است، ولی تحقیقات نتوانستند این قصه روشن کن.
  animal.nightingale:
    label: شلیک
    summary: پرنده‌ای کوچک قهوه‌ای که یکی از زیباترین آوازان موجودات پروازدار روزمره را تنဆت می‌نمائذ.
    info: شلیک سرخ رنگ، پرنده‌ای کوچک و قهوه‌ای است که نام مرد آن از ترانه‌پسندان برجسته در ماه زرد با صداهای عالی معروف شده است. او عموماً شبها و قبل از طلوع خورشید به غنای دارد؛ بنابراین اسمش همینجا منشاء گرفته است. فرزاد جوجهٔ دورترش است.
  animal.ostrich:
    label: EMU
    summary: پرندۀ بزرگترین جهان، غیرقابل پرواز ; راهرفته سرعتش هفتدونفرساد کیلومتر
    info: "emu دو انگشت، پرندۀ بزرگترین و سنگین‌ترین جهان است؛ نرها می تواند ارتفاع آن به ۲٫۷ متر و وزنش بالای ١٥٠ کیلوگرم باشد\n قادر به پرواز نبود ولی سرعتش در هفتاد کیلومتر بر ساعت قرار دارد \nتخم مرغ او بزرگترین تخم مرغ تمام پرنده‌هاست\n انگشت عقب فوت شکمش وجود ندارد فقط دارای دو انگشت است"
  animal.owl:
    label: سرخکوه
    summary: پرنده شب زاد شکاری با چشم‌های دور، پرواز بدون ضربات و شنوایی فوق العاده.
    info: ویر بزرگ‌ترین شاهِ سرخکوه شمال آمریکا است. چشمان این پرنده قابل حرکت نبوده، بنابراین جانور برای دید به همه طرفها توان محدودی در فراز و کج کردن سرش را دارد؛ حداکثر انحراف بالغ بر ۲۷۰ درجه است. بافت خاص منقار و پرهایش علت صداقت لطافت بلندش محسوب می‌باشد.
  animal.parrot:
    label: پلنگ
    summary: ماهل ماوراء طبیعی قابلیت شباهت صداها و صحبت انسان.
    info: ارا شرلوتی از بزرگ‌ترین پلکان‌های جهان است که بال‌ها دارد و در مناطق مرطوب مدارس سرد آمریکای لاتین زندگی می‌کنند. هوش فوق العاده‌ای نسبتاً به خود اختصاص می‌دهد - قادر به تشخیص رنگ، تفاوت ها و حساب باشد.
  animal.peacock:
    label: پاو
    summary: مردۀ پاوا با دمچهٔ خوش‌رنگ و شبیه فانوس.
    info: پاک کروناته از جنوب آسیای هندو است. نر پاک، واقعاً موهای برجسته‌شده را به شکل فانوس در زمان ترغیب مادگان باز می‌کند. رنگ‌های عارضه‌دار ناشی از انحناء نور روی ساختارهای ماکرو موهاست.
  animal.pelican:
    label: کوزه
    summary: پرندهٔ آبزی بزرگ با زبان عظیم برای صيد.
    info: کوسه‌ماهی، پرندگان آبزی بزرگ با دهندهای واقع شوند که مثل شب به ماهی استفاده میشود. این حلقه تا ۱۳ لیتر آب را جذب کنید؛ سپس فشار آب را بردارید و ماهی خوردن. در هوا نمونه حرکت انعطاف پذیر طبق قوانین هواداران مشابه بالابرها است.
  animal.penguin:
    label: توچنک
    summary: پرنده بدون پرواز از نیمه جنوبی عالم، شناور فوق العاده.
    info: توچنک سلطنتی بزرگ‌ترین توچنک است؛ ارتفاع آن بالاتر از ۱٫۱ متر می‌شود و در قطب جنوب زندگی کرده، تخم را به دمای مناسب نگه میدارد - پسران توچنک طول فصل زمستان قطب جنوب را با حرارت دادن تخم روی لباهای خود صرف میکنند. تحت آب قادر به رسیدن به سرعت حداقل ٣٠ کیلومتر بر ساعت هست.
  animal.pheasant:
    label: بازانت
    summary: سبک بالدار؛ نرش ظاهر خاص و ذُلّ عقبِ بلند دارد
    info: |-
      بازانت عمومی از آسیا به اروپا وارد شد، ولی الان بخش طبیعی fauna اروپایی است
      نر بازانت (کوچ) دارای رنگ‌های نمادین مانند بدنه سبز–برنزی و جراب قرمز در کنارت چشم است
      در فصل زمستان پراست هوازی در تمام مناطق بلغارستان وجود داشته و بنیان مهم برای تولید حشرات است
  animal.pigeon:
    label: کolibر
    summary: پرنده سبز روزمرهٔ شهرها و روستاها با منشا کolibری سنگ.
    info: کolibری سنگین اجداد همه پرنده‌های خانگی و دودمانش در شهرهاست. نخستین مرغ کشف شد؛ به عنوان حملنامه برای تحویل م通信، قرون متعدد استفاده شده است.
  animal.puffin:
    label: پرواز
    summary: برف‌سرازم بالدار
    info: کاواچه شمالی پرندگان دریایی کوچک با زبده رنگارنگ شبیه نهنگ است، این پرنده ماهی‌ها را به شناوری و غ潜 دنبال می‌کند؛ قادر است بیشتر از ده عدد ماهی همزمان داخل زبان خود حمل کند. آن‌ها روستاها بر ساحل سنگلاخ و تونلهای طبیعی جوجه می‌زنند.
  animal.quail:
    label: کروپل
    summary: سبزخورد مرغ غذائی کوچک، همسطح با زمین.
    info: کروپلکا زمینی کوچک‌ترین عضو خانواده فاسونگیت در اوروز است، و معمولاً پنهان باقی می‌ماند؛ به راحتی قابل شنیدن (بوق بوق) ولی دشوارتر قابل روئیت است. برخلاف سایر جوجه‌ها، تابستان ناخودآگاه و در آفریقا زمستان می‌کند.
  animal.raven:
    label: کراواس
    summary: بزرگترین نوع ذهنبر ماشهٔ مشخصی با صدا.
    info: کرکاوس بزرگ‌ترین پرنده از خانواده کروواسیت با طول بالای ۶۰ سانتیمتر است، به شدت هوشمند و توانائی برنامه ریزی برای آینده دارد، میتواند بازی کند و تعاملات اجتماعی برقرار نمود؛ در فرهنگ های شمالی مثل افسانه افدن حومون و منن و جاهای کلتی وضعیت معنوی داشته است؛ قلعه لندن تحت عنصر الегورافی قرار داراست که مردم اعتقاد دارند اگر کرواوسها قلعه را تخلّی کنند، تمامی نظام زیرپوشنه.
  animal.roadrunner:
    label: کوچاک زمینی
    summary: دونفر ماژور صحراهای آمریکای شمالی؛ شخصیت معروف مستعار.
    info: کوچاک زمینی بزرگ، که به عنوان راننده جاده شناخته می‌شود، پرنده ای است از خانوادهٔ کواخک های آمریکای شمالی که علاوه بر پرواز دوش با فعالیت در حرکات قدم و دوندنش مشغولند. سرعت بالایی تقریباً نزدیک به ۳۰ کیلومتردر ساعت دارد و غذتش شامل موشهای مختلف مثل انفجارها، لاکپشت ها، حشرات و حتی بعضی ذوات الفردوس است.
  animal.robin:
    label: چربن
    summary: پرنده ای کوچک با پشت رود، سمبل عروسی بریتانیا.
    info: چرخه عام به زنبورک سفید و قرمز با صدای خوش است که در تمام فصول می‌ماند و حتی در تابستان نیز آواز می‌خواند.
  animal.seagull:
    label: گوشت‌خوار
    summary: دریافت‌کننده طبیعی مواد غذاء انسانی و منابعش شامل تمام نوع موجودات دریایی.
    info: گوشت‌خوار سفیدپوش از پرندگان دریایی شناخته‌شده و متداول آسیا است، که به خوبی می‌تواند محیط زیست مختلف را تحمل کندا. هم بر روی خط تراکتورها جلوتر حرکت می‌کرد و هم با دستان بزرگاش مواد غذائی را نفوذ می‌داد. علاوه بر مناطق مرزی دریاچه‌ها و رودخانه‌ها، حضور فعالی در شهرها و نقاط توسعه‌دار وجود دارد.
  animal.secretary_bird:
    label: پرنده نویس
    summary: آفریقا، طول قد بالا، غذا انحصاراً زمینی، مردار حضرا
    info: کبوتر نویس، پرندۀ بزرگ آفریقایی است که عموماً در مناطق باز ساوانا می‌چالد و حشرات را به خوبی تغذیه می‌شود. این پرنده هادها و موش‌خوران را با ضربت قدرتمندانه فوت می‌کنند که وزنش حداقل دوبرابر جرم بدنهٔ شان است. اسمش براساس بلوند بلند روی سرش است که شبیه خطوط جانبی صفحه عقب گوش شخص ثبت‌کننده است.
  animal.sparrow:
    label: وراب
    summary: پرنده صفت عادی با لباس قهوه‌ای روشن کہ در محلّی مشخصی زندگی می‌کند.
    info: ویژه‌نامه ورایسک دمیش به عنوان گنجینه جہان است کہ انسان را همرا با خود می‌برد، در نزدیکی ساختمان‌ها زندگی می‌کرد تا بتواند در فضاهای داخلی پرواز کند. طبیعت آزاد او تحت شدت قرار گرفت و حال حاضر شهرنشینان برخورد مناسبتری با محصولات غذایی دارند.
  animal.spoonbill:
    label: کلپیک
    summary: -ptak brouska se značnou částí مشخص شانه‌ای
    info: |-
      کولپیک سفید نزدیک به ابیسوس است، ولی ممکن است آسان‌تر با لبه تخت و شانه‌ای دندانه‌دارش تشخیص بدهیم
      وقتی غذا جستجو کردن در حرکات جانبی را زیرآب فراموش می‌کنم
      در مناطق مرطوب مثل پارچینگ همسفر خود را توسعه می‌دهد
  animal.stork:
    label: چاپ
    summary: بزرگترین مرغ سفید با منقار قرمز؛ گمان می‌رود که بچه‌ها را می‌آورد.
    info: چاپ سفید پرنده‌ای تاجنده است که در تمام اروپا روی شمع و قله سنگین می‌سازد، زمستان را در آفریقا جنوبی به همراه خودش می‌کشد و هرسال دوباره برای توسعه نمونه قبلی بازخواهد گشت؛ علامت فصل باروری و بهمن است، طبق قدیمات حامل بچه‌هاست.
  animal.swallow:
    label: ستوراک
    summary: شکارچی هوائی با ذُخل قابل تقسیم.
    info: "ستوراک عمومی پرنده‌ای است مهاجر که در آفریقا جنوب ساحل عاج زمستان می‌گذراند و در اروپا تخم‌می‌رود. \nماجربال بال هست؛ حشرات را فقط به صورت هوامرد شکار می‌کند و بدون فرود، قادر به نوشیدن آب روی سطح است. \nدر انبارها و زیر سقف خونه‌سازی می‌نماید؛ وجود ستوراک براساس داستان محلی بخشندهٔ فرصت به خانواده است."
  animal.swan:
    label: لابوته
    summary: طوطئهٔ مرغِ سفیدِ لخت، نماد زیبائی و معنویت.
    info: |-
      لابوت بزرگ‌ترین پرندهٔ بالافاصله اروپاست که دم به طول فراتر از ۲٫۴ متری دارد؛ نشانۀ زیبایی، عشق و سخنران است ؛ جفت با همدیگرش در تمام عمر تعهد حفظ میکند
      به خودارادی قلب را بلند میکشد و منقار را تحرّک میدهد مثل آتش شعله بردارد.
  animal.toucan:
    label: توکان
    summary: پرنده تروپیکال با فنجان عمومی رنگارنگ.
    info: توکان عظیم در جنگل‌های بارانی آمریکا مرکزی و شمال شرقی زندگی می کند، نوکش به طول بالاتر از دوازده سانتی متراست ولی خیلی هفتم است، داخل پوچخانه هوائی وجوددارد.
  animal.woodpecker:
    label: dartel
    summary: پرنده‌ای است که با ضربت زدن به قشر درختان، موشک‌ها را جستجو یا غرفه مخصوص می‌سازد.
    info: داتل پرندگانی از خانوادهٔ دارکوب‌سان، که با زوزن سفت و شلاق به درخت می‌خورند تا حشرات را بیابند؛ جبینش آنها تقریباً سه برابر طول زوزنش است و برای فروبردن لاروها از سوراخ‌های نفوذ کردۀ قبلی استفاده می‌کنند. همچنین با ضربت زدن روی درختان، منطقه خود را مشخص می‌نمایند.
