lang: ko
pivot: false
title: 새
cards:
  animal.albatross:
    label: 알바트로스
    summary: 모든 새 중에서 가장 넓은 날개 폭을 가진 해양 조류입니다.
    info: 이동성 알바트로스는 모든 새 중에서 가장 큰 날개 폭으로 3.5미터 이상 되며, 대부분의 생애를 열대해역에 보내 수천 킬로미터 비행도 착륙 없이 할 수 있습니다. 바닷물을 마시고 콧등샘을 통해 염분을 배출합니다. 해군 전통에서는 사냥한 알바트로스가 불길하다고 여겨집니다.
  animal.budgerigar:
    label: 안둘카
    summary: 호주에서 온 작은 색이 있는 파피용, 인기 있는 애완동물입니다.
    info: |-
      안둘카는 호주의 내륙지역에 서식하며 큰 무리로 살아갑니다.
      세계적으로 가장 널리 사육되는 조류 중 하나이며 캔아레보다 많습니다.
      수컷은 사람의 목소리를 흉내낼 수 있고 수백 개 단어를 배울 수 있습니다.
      야생 안둘카는 녹색과 노란색으로 치장되어 있으며, 다양한 색상 변종들은 교배를 통해 만들어졌습니다.
  animal.canary:
    label: канарейка
    summary: 작고 밝은 노란색을 띠는 소형 새로, 애완동물로 인기가 많다.
    info: 집칸아레이는 캐나리아 제도에서 유래하며 17세기에 길러지게 되었다. 품종 개량으로 인해 노란색이 생겨났으며, 야생 카나리는 녹갈색이다. 수컷들은 복잡한 멜로디를 부르며, 세계적으로 카나리아 가창 경연이 열린다. 역사적으로 탄광에서는 이들을 일산화탄소 감지기로 사용하였다.
  animal.cassowary:
    label: 카사우아리
    summary: 날 수 없는 뉴기니의 위험한 새로 날카로운 발톱을 가지고 있다.
    info: |-
      카사우아리는 뉴기니와 북부 오스트레일리아에 사는 큰 비행할 수 없는 조류입니다.
      세계에서 가장 위험한 새로 간주되며, 내측 손가락의 긴 발톱은 심각한 부상을 입힐 수 있습니다.
      머리에 있는 높은 뼈 모양 덮개(캐스크)는 아마도 두꺼운 숲속에서 방향 감지를 돕는 역할을 합니다.
      열대 우림의 씨앗 확산에 중요한 역할을 합니다.
  animal.cockatoo:
    label: 카카두
    summary: 눈이 뚜렷한 노란색 머리가 있는 흰색 오스트레일리아 파피용새.
    info: 황머리카카두는 카카두과에 속하는 가장 유명한 앵무 중 하나입니다. 흥분하거나 경계할 때 눈에 띄는 노란색 머리를 곧게 세웁니다. 이 새는 지능이 높고 사람의 목소리를 모방할 수 있습니다. 포로 생활 시 최대 80년까지 사육되며, 호주에서는 작물 해충으로 간주됩니다.
  animal.condor:
    label: 콘도르
    summary: 머리가 벗겨진 최대 크기의 비행 새인 아메리카 조류입니다.
    info: 안데스 콘도르는 무게와 날개 폅이 가장 넓은 세계에서 가장 큰 비행 새입니다. 이 동물은 독수리에 속하며, 대형 포유동물의 시체를 먹고 생태계에서 중요한 역할을 합니다. 안데스 산맥 상공 거대한 온난한 공기 흐름 위로 날아다니며 날갯짓 없이 나는 것이 특징입니다. 안데스 지역 원주민들에게는 하늘과 자유의 신성한 상징으로 여겨집니다.
  animal.crane:
    label: ' crane'
    summary: 긴 다리와 날카로운 부리를 가진 대형 이동성 조류로, 춤추는 연애 행동으로 유명하다.
    info: |-
      흰 Crane은 매년 수천 킬로미터를 여행하는 큰 이주 새이다.
      이들은 짝짓기 의식에서 점프하고 날개를 벌리는 등 화려한 춤을 추며 유명해졌다.
      가을과 봄에 천 개 이상의 무리로 체코 공화국 상공을 나는 모습도 볼 수 있다.
      Crane이라는 이름은 건설 기계에도 사용된다.
  animal.crow:
    label: vrána
    summary: 문제 해결 능력이 뛰어난 까만 머리카락 조류
    info: 버나는 머리카락과 비슷하지만 특별히 지능이 높은 새로 알려져 있습니다. 사람의 얼굴을 인식하고 도구를 사용하며 복잡한 작업을 해결할 수 있습니다. 쌍 또는 소규모 그룹에서 생활하며 포식자입니다. 체코 전설에서는 버나에게 신비한 성질이 있다고 여겨집니다.
  animal.cuckoo:
    label: 뻐꾸기
    summary: 다른 새들의 둥지에 알을 숨기는 번식 기생충입니다.
    info: 참새는 번식 기간 동안 자신의 알을 다른 새의 둥지에 낳습니다. 이 알은 보호자인 새가 부화시키고 키우게 됩니다. 참새 새끼는 곧 다른 알과 새끼들을 둥지에서 밀어냅니다. 두 음절로 구성된 '뻐꾹' 소리는 봄이 오는 상징이며, 수컷은 노래하고 암컷은 거품처럼 들리는 소리를 내냅니다.
  animal.dove:
    label: ' голуб'
    summary: 평화의 상징; 순백색 깃털을 가진 부드러운 종류의 비둘기.
    info: |-
      흰비둘기는 고대부터 국제적인 평화의 상징으로 사용되어 왔으며 성경에서 노아에게 올리브 가지를 가져온 바이두입니다.
      기독교에서는 성령을 상징합니다.
      집비둘기는 실제로 야생 돌비둘기를 길들인 것입니다; 흰색은 교배와 사육을 통해 생겨났습니다.
      전 세계적으로 백색 비둘기를 날려 보내는 것은 의식과 축하 행사의 일부로 행해지고 있습니다.
  animal.duck:
    label: 오리
    summary: 날개를 퍼덕이며 수면에서 먹이를 찾는 평평한 부리를 가진 물새입니다.
    info: |-
      야생 오리는 세계적으로 가장 넓게 분포된 오리 종류로 대부분의 집짐승 오리 품종의 조상입니다.
      수컷(오랑우탄)은 특징적인 광택 있는 녹색 머리카락을 가지고 있고 암컷은 눈에 잘 띄지 않는 갈색을 띱니다.
      이들은 수면 아래로 잠기지 않고 날갯짓하며 수면 위에서 먹이를 찾아먹습니다.
      체코에서는 연못과 강줄기에 없어서는 안 되는 존재입니다.
  animal.eagle:
    label: 독수리
    summary: 날카로운 부리와 예리한 시력이 있는 큰 포식성 새
    info: 백두리 독수리는 미국의 국가 상징이며 북미 대륙에서 가장 큰 포식자 중 하나입니다. 주로 물 속에서 직접 물고기를 낚아채는 방식으로 사냥합니다. 날개 폭은 2미터 이상이며 야생에서 약 20년까지 사는 것으로 알려져 있습니다.
  animal.emu:
    label: 鸸鹋
    summary: 세계에서 두 번째로 큰 비행할 수 없는 오스트레일리아 원시조류.
    info: |-
      검은색 엄지는 세계에서 두 번째로 큰 새이며 오스트레일리아에만 서식한다.
      날지 못하지만 훌륭한 수영 선수이자 빠른 달리기 능력을 가졌다.
      암컷 대신 수컷이 알을 인큐베이트하고 새끼를 돌보며 암컷은 떠난다.
      1932년에는 이새들의 무리를 제거하려는 작전으로 호주군이 전투에서 패배하는 사례가 있었다.
  animal.falcon:
    label: 독수리
    summary: 머리 위로 날아드는 동작에서 최고 속도가 시속 320km를 넘는다.
    info: 스텔라이오티 독수리는 지구상 가장 빠른 동물이며, 머리 위로 날아드는 동작에서 시속 320킬로미터 이상의 속도에 도달한다. 눈 아래에는 태양빛 반사를 억제하는 특징적인 어두운 고리들이 있다. 인간은 이 새와 함께 사냥을 2천 년 이상 해왔으며, 이러한 활동인 '독수리 훈련술'은 유네스코 세계 무형문화유산으로 등록되어 있다. 체코에서는 높은 건물과 암석들 위에서 번식한다.
  animal.flamingo:
    label: 플라멘카
    summary: 분홍색 깃털을 가진 한 발로 서서 얕은 물에서 수영하는 조류
    info: 플라멘카 루조스는 조류와 갯가재를 먹으며 이들의 카로티노이드 성분으로 특징적인 분홍색을 얻는다. 새끼들은 처음에는 회색을 띠고 태어나며 점차 색이 변한다. 부리가 구부러져 있어 먹이를 걸러내는 역할을 하며, 머리를 아래로 향해 물속에서 먹이를 걸러낸다.
  animal.goose:
    label: 오리
    summary: 대형 수생조류로, V자 형태를 이루며 이동하고 땅에서 번식합니다.
    info: |-
      야생 오리는 가정용 오리의 조상입니다.
      특징적인 V자 모양으로 이주하며, 새들은 앞서가는 위치를 교대로 맡습니다.
      번식 시에는 매우 영역성을 보이며 새끼들을 용감하게 방어합니다.
      역사적으로 로마의 카피톨리움에 있는 오리들이 갈리아인들의 공격을 경보 울려 알렸다고 합니다.
  animal.hawk:
    label: 독수리
    summary: 숲과 들판에서 새와 포유류를 사냥하는 빠른 육식동물입니다.
    info: 독수리는 짧고 둥근 날개와 긴 꼬리를 가진 소형 조각새로, 풍성한 식생 속에서도 사냥이 가능합니다. 매우 빠르고 민첩하여 비행 중이나 숨어 있는 상태에서 다른 새들을 사냥합니다. 암컷은 수컷보다 눈에 띄게 큽니다. 과거에는 독수리가 사냥용으로 귀하게 여겨졌습니다.
  animal.heron:
    label: volavka
    summary: 물가에서 고요하게 서서 물고기를 기다리는 높은 체장의 수영하는 새입니다.
    info: 볼라바카 포펠라바는 중부 유럽 최대 크기의 수중 어류를 잡는 조류입니다. 마치 석상처럼 움직이지 않고 서서 물고기가 접근할 때까지 기다렸다가 갑작스럽게 부리로 공격합니다. 이새는 생선과 개구리를 통째로 삼킬 수 있습니다. 비행 시 목을 'S'자 모양으로 구부려서 다른 종인 거위와 구별됩니다.
  animal.hornbill:
    label: 뿔ปาก새
    summary: 열대 지역의 거대한 뿔이 달린 부리가 있는 새입니다.
    info: 뿔ปาก새는 Bucerotidae과에 속하며, 뼈로 된 돌출부(뿔)를 가진 특징적인 큰 부리를 가지고 있습니다. 아프리카와 아시아 열대 우림에서 서식합니다. 이들은 구멍이 난 나무 안쪽에서 알을 품습니다. 암컷은 수컷에게서 구멍이 막히게 되어 번식 기간 동안 그곳에 머뭅니다. 그리고 이들의 존재는 건강한 열대 숲 상태를 나타내는 지표입니다.
  animal.hummingbird:
    label: hummingbird
    summary: 세상에서 가장 작은 새로, 현지에서 정지 비행과 후진 비행이 가능하다.
    info: 루비네크 볼리비크는 북미 동부에서 정기적으로 번식하는 유일한 종입니다. 초당 최대 53회까지 날개를 휘두르며 특유의 윙윙거리는 소리를 냈습니다. 꿀을 먹고 작은 곤충을 포식하며, 심장 박동은 분당 최대 1200회에 달합니다.
  animal.ibis:
    label: 이비스
    summary: 긴 곡선 모양의 부리를 가진 수영하는 새로 고대 이집트에서 신성시되었다.
    info: 이비스는 Threskiornithidae과에 속하며 특징적인 긴 곡선 모양의 부리가 있는 수영하는 새이다. 고대 이집트에서는 타투신을 상징으로 숭배받았다. 습지와 강 삼각주 지역의 군락에서 생활한다. 갈색 이비스는 유럽에 실수로 도입되어 오늘날 침략종으로서 공격적으로 확산되고 있다.
  animal.kingfisher:
    label: ledňáček
    summary: 강가에서 머리부터 뛰어들어 물고기를 사냥하는 보석처럼 반짝이는 새입니다.
    info: 전 세계적으로 강물이 깨끗한지 알려주는 지표종으로 여겨지는 강도요새는 전 유럽에서 가장 아름다운 조류 중 하나로, 전기 같은 파란 등과 주황색 가슴을 가지고 있습니다. 나무 가지에 앉아 물 속의 물고기를 감시하다가 그 위를 따라 머리부터 곧바로 달려듭니다. 일본에서는 비슷한 종인 hisui(히수이)가 미와 자연 상태의 상징으로 여겨집니다.
  animal.kookaburra:
    label: 웃는 킹피셔
    summary: 호주의 웃는 소리로 유명한 큰 크기의 킹피셔입니다.
    info: 웃는 킹피셔(kookaburra)는 호주에서 발견되는 큰 크기의 조류로, 사람의 웃음처럼 들리는 시끄러운 울음소리로 잘 알려져 있습니다. 이 새는 전통적으로 아침과 저녁을 알리는 역할을 하며, 호주의 버시 지역 상징으로 여겨집니다. 도마뱀, 뱀, 설치류와 곤충 등을 사냥합니다. 가족 단위로 살아가며 어린 자식들은 부모에게 새끼를 기르는 일에 도움을 줍니다.
  animal.lorikeet:
    label: 로리
    summary: 작고 화려한 색을 띠며 꿀과 수분을 섭취하는 파피용새입니다.
    info: 로리는 오스트레일라시아에 사는 작은 파피용새로서 모든 파피용새 중 가장 생동감 있는 색상을 지닌 것으로 알려져 있습니다. 전문화된 손수건 모양의 혀를 사용하여 열대성 꽃에서 꿀과 수분을 수집합니다. 이들은 열대림의 중요한 벌개미 역할을 합니다. 무리를 이루어 삶이 소란스럽고 장난기 넘치며, 가두어지면 사람과 신속하게 친근해집니다.
  animal.lyrebird:
    label: 리로초스트
    summary: 호주에서 주변의 어떤 소리를든 완벽하게 모방하는 새입니다.
    info: 리로초스트 나디르니는 호주의 유명한 조류로, 전동 사제기나 카메라 소음, 자동차 경고음이나 다른 새들의 부름 같은 거의 모든 주변 소리를 흉내낼 수 있는 능력으로 알려져 있습니다. 암컷을 끌어들이기 위해 수컷은 복잡한 리오브형 꼬리를 드러내며 완벽한 모방 연기를 보여줍니다. 이새는 오스트레일리아 주인 비クトORIA의 상징이기도 합니다.
  animal.macaw:
    label: 아라
    summary: 강한 부리와 선명하게 색이 칠해진 깃털을 가진 대형 중미 열대 조류인 아라는 있습니다.
    info: 아라는 남아메리카 열대림의 큰 앵무로, 모든 새들 가운데 가장 눈에 띄는 색상을 지닌 것으로 알려져 있습니다. 단단한 견과류를 깨기 위해 강하고 굽은 부리를 가지고 있으며, 평생 짝사랑하는 습성을 보입니다. 숲 벌채 및 이국어 동물 밀수 거래 등으로 인해 생존 위협을 받고 있습니다.
  animal.magpie:
    label: 스트라카
    summary: 검은색과 흰색의 긴 무지개 녹색 꼬리를 가진 새.
    info: 스트라카는 검정색과 흰색으로 뚜렷이 구분되는 깃털과 짙은 녹색 반짝이는 긴 꼬리가 특징인 조류입니다. 빛나는 물건을 도둑맞는다는 소문이 있지만, 연구 결과 이 전설은 사실로 확인되지 않았습니다. 거울 속 자신의 모습을 인식할 수 있는 몇 안 되는 조류이며, 중국에서는 행복과 기쁨의 상징으로 여겨집니다.
  animal.nightingale:
    label: 뻐꾸기
    summary: 갈색 작은 새로 아름다운 새 노래 중 하나를 부른다.
    info: 참새는 갈색 작은 조류이며 수컷은 새들 중 가장 복잡하고 아름다운 노래 중 하나를 불러요. 주로 밤이나 해가 떠오르기 전에 노래하죠, 그래서 이름이 유래되었습니다. 로버스트와 친척 관계입니다. 다nte에서 케이츠까지 세계의 시인들은 참새의 노래를 로맨스와 서정을 상징하는 것으로 찬양해 왔습니다.
  animal.ostrich:
    label: 鸵鸟
    summary: 세상에서 가장 큰 비행할 수 없는 새로, 시속 70km까지 달릴 수 있다.
    info: 두발鸵는 세계에서 가장 크고 무거운 조류이다. 암컷은 최대 2.7미터의 키와 150kg 이상의 체중을 가진다. 날지 못하지만, 이 종은 세계에서 가장 빠른 두 발 짐승으로 시속 70킬로미터에 이를 수 있다. 그들의 알은 모든 조류 중에서 가장 큰 알이다. 한쪽 발가락이 없으며, 오직 두 개의 발톱만 가지고 있다.
  animal.owl:
    label: 사자
    summary: 둥근 눈, 조용한 비행, 뛰어난 청각을 가진 야행성 포식 조류
    info: 북아메리카에서 가장 큰 사자는 큰 눈을 가진 야행성 포식 조류입니다. 사자의 눈은 움직일 수 없기 때문에 대신 270도까지 머리를 돌릴 수 있습니다. 깃털의 특별한 구조 덕분에 비행이 거의 조용합니다. 뛰어난 청각을 이용해 어둠 속에서 사냥합니다.
  animal.parrot:
    label: 앵무새
    summary: 색이 화려한 열대 조류로, 소리와 사람의 말을 모방할 수 있다.
    info: 사라라 앵무새는 날개 폭이 1미터가 넘는 세계에서 가장 큰 앵무새 중 하나로, 라틴 아메리카의 열대 우림에서 서식한다. 앵무새는 놀라운 지능을 가지고 있으며, 사라라 앵무새는 색상, 모양을 인식하고 수를 세는 능력이 있다. 수명은 최대 75년에 달한다.
  animal.peacock:
    label: 독수리
    summary: 남성 독수리는 아름다운 무늬가 있는 부리 모양 꼬리가 특징이다.
    info: 왕독수리는 인도 아대륙 원산지이다. 수컷인 독수리는 구애할 때 실제로는 연장된 덮개 깃털로 이루어진 꼬리를 부리 모양으로 펼친다. 이르디스런트한 색상은 색소가 아니라 깃털의 미세 구조에서 빛이 굴절되어 생긴다.
  animal.pelican:
    label: 鹈鹕
    summary: 물고기를 잡기 위해 거대한 주머니 모양의 부리를 가진 큰 물새입니다.
    info: 鹈鹕는 물고기를 잡기 위한 특징적인 주머니 모양의 부리가 있는 큰 수생 조류이다. 이 부리는 최대 13 리터의 물을 담아서 물 속에서 물고기를 걸러내는 역할을 한다. 물은 밀어내고, 남은 물고기는 삼킨다. 이들은 공력학적으로 형성된 무리로 비행하며 서로의 상승 기류를 이용한다. 그리스도교적 상징에서는 희생적인 사랑의 상징으로 여겨진다.
  animal.penguin:
    label: 펭귄
    summary: 남반구의 비행할 수 없는 새로, 훌륭한 수영자이다.
    info: 황제펭귄은 모든 펜귄 중 가장 크며 1.1미터 이상의 키를 가지고 있다. 남극에서 서식하며, 가장 혹독한 추위 속에서 알을 낳는다. 수컷은 한 마리의 알을 다리에 끼고 남극의 겨울 내내 그 알을 따뜻하게 한다. 물속에서는 시속 30킬로미터 이상의 속도를 낼 수 있다.
  animal.pheasant:
    label: 바잔트
    summary: 큰 무늬 있는 조류; 수컷은 눈에 띄는 색상과 긴 꼬리를 가지고 있다.
    info: |-
      바잔트 오비첸이(Phasianus colchicus)는 아시아에서 유럽으로 도입된 종이지만 오늘날에는 유럽의 자연적인 동물군 일부가 되었다.
      수컷인 코후트(kohout)는 주목할 만한 색상을 지닌 녹색-청동빛 몸통과 눈 주변의 특징적인 붉은 주머니를 가진다.
      체코에서는 가장 널리 퍼져 있는 날짐승이며 사냥 문화의 중요한 기반이 된다.
      그들은 밀집된 식생지 위의 땅에서 구멍을 파서 새끼를 품는다.
  animal.pigeon:
    label: 도요
    summary: 도시와 시골에서 흔한 회색 새로, 원래는 바위 도요입니다.
    info: |-
      바위 도요는 모든 가정 및 야생화된 도심의 도요들의 조상입니다.
      인류 역사상 최초로 길들여진 새이며 수천 년 동안 사람들은 이들을 우편용으로 사용했습니다.
      이들은 뛰어난 방향 감각을 가지고 있어 수백킬로미터 떨어져서라도 집으로 돌아올 수 있습니다.
      세계 여러 문화에서는 평화의 상징으로 여겨집니다.
  animal.puffin:
    label: 북극방울새
    summary: 색이 있는 파피용 모양의 부리를 가진 작은 바닷새입니다.
    info: 북극방울새는 밝은 줄무늬를 띤 부리가 특징이며, 수중에서 물고기를 추적하며 잡습니다. 한 번에 여러 마리의 물고기를 부리로 운반할 수 있습니다. 이들은 주로 암석 절벽이나 구멍 속에서 무리를 지어 서식합니다. 아이슬란드와 페로 제도에서는 상징적인 동물로 여겨집니다.
  animal.quail:
    label: 꿩
    summary: 풀밭에서 지상에 둥지를 틀고 사는 작은 습지 조류.
    info: 유럽의 가장 작고 대표적인 야생조류 중 하나이다. 숨어 있기 때문에 보다는 듣기 쉽다(啼啼). 다른 고니와 달리 이동성이 강하며 겨울을 아프리카에서 보내며 그녀의 알은 인기 있는 특별 요리로 여겨진다.
  animal.raven:
    label: krkavec
    summary: 지능이 높은 검은색 큰 새로 목소리가 특징적입니다.
    info: 크라카프(Krkavec velký)는 길이가 60cm 이상 되며 까마귀과 중 가장 큰 조류입니다. 미래를 계획하고, 놀고 사회적 관계를 맺을 수 있는 뛰어난 지성을 가지고 있습니다. 북유럽 신화(오딘의 두 까마귀 휴긴과 무닌)와 켈트 민족의 전설에서는 신비한 존재로 여겨졌습니다. 런던 탑은 만약 이새들이 탑을 떠나면 왕국이 붕괴된다는 전설에 의해 보호받고 있다고 합니다.
  animal.roadrunner:
    label: 지면뻐기
    summary: 북아메리카 사막의 빠른 주자이자 만화 시리즈의 상징.
    info: 큰 지면뻐기는 비행보다 걷거나 달리는 것을 선호하는 매스컴에 속한 새입니다. 시속 30킬로미터 이상으로 달릴 수 있으며, 도마뱀, 곤충, 작은 포유류와 함께 파도사자를 잡고 죽일 수도 있습니다. 미국 애니메이션 '로드러너'와 '코요테'에서 영웅으로 유명해졌습니다.
  animal.robin:
    label: 붉은가슴뻐기
    summary: 붉은 가슴을 지닌 작은 새로, 영국의 크리스마스 상징이다.
    info: 붉은가슴뻐기는 주로 오렌지색과 붉은색으로 이루어진 특징적인 가슴을 가진 소형 노래새입니다. 조용하면서도 용감하게 움직이며 흙을 파는 동물들을 따라다니며 드러난 땅벌레를 줍습니다. 이 새는 영국의 국가적 새이자 전통적인 크리스마스 상징이며, 연중 내내 자신의 영역에 머무르고 겨울에도 노래합니다.
  animal.seagull:
    label: racek
    summary: 사람들과 바다에서 먹이를 찾아 다니는 해안가의 포식 조류입니다.
    info: 레이첵 스트리브리티(Larus argentatus)는 유럽에서 가장 넓게 분포하는 해양조 중 하나입니다. 이 새는 적응력과 육식성 식성을 가지고 있으며, 단지 해변뿐만 아니라 호수와 강 주변 내륙에서도 서식합니다. 지능이 높아 때때로 사람들은 어디서 자신을 길러 줬는지를 기억하기도 합니다. 인간 음식에 대한 그의 공격적인 관심은 해변 관광객들 사이에서 많은 이야기 소재가 됩니다.
  animal.secretary_bird:
    label: 서식이
    summary: 다리가 길고 사하라에서 뱀을 발로 짓밟아 죽이는 포경조.
    info: 서식이는 주로 개활지인 초원을 걸어서 이동하는 큰 아프리카 포경조입니다. 강력한 다리를 이용해 몸무게의 세 배에 달하는 무게를 발로 짓밟아 뱀과 설치류를 잡습니다. 머리 위의 긴 깃털들이 서기관 귀 옆의 수염처럼 보여서 이름이 유래되었습니다. 남아프리카 공화국과 수단의 국가 상징으로도 사용됩니다.
  animal.sparrow:
    label: 참새
    summary: 인류 주거지 근처에서 사는 갈색 작은 노래 새입니다.
    info: 집참새는 세계적으로 가장 흔한 조류 중 하나이며 인간의 충실한 동반자로 알려져 있습니다. 이들은 인구 밀도가 높은 지역에 서식하며 건물 벽과 지붕 사이에 구멍을 파서 번식합니다. 최근 수십 년간 도시 지역에서는 그들의 개체수가 감소했습니다. 체코 사람에게 참새는 평범함과 적응력의 상징이기도 합니다.
  animal.spoonbill:
    label: kolpík
    summary: 특징적인 숟가락 모양의 부리를 가진 흰색 수영조.
    info: 흰수염涉禽은 비단오리과와 관련이 있지만, 평평하고 숟가락 모양의 부리 끝으로 쉽게 구별할 수 있다. 먹이를 찾을 때는 얕은 물에서 부리를 오른쪽 왼쪽으로 움직인다. 갈대밭이나 버드나무丛에 무리를 지어 번식한다. 체코에서는 드문 종이지만 남부 모라바 지역에는 정기적으로 나타난다.
  animal.stork:
    label: 鹄
    summary: 붉은 부리를 가진 흰색 큰 새로, 아이들을 가져다준다고 합니다.
    info: 흰鹄은 유럽 전역의 지붕과 기둥에 둥지를 트는 이동성 조류입니다. 여름을 아프리카 열대지방에서 보내고 매년 같은 둥지로 돌아와서 점점 더 크게 만듭니다. 이새는 봄과 생식력을 상징하며 민간 신화에서는 아이를 가져다줍니다. 체코공화국은 유럽에서 가장 중요한鹄 서식 국가 중 하나입니다.
  animal.swallow:
    label: 스ISK리
    summary: 날아다니며 곤충을 잡는 빠른 비행 포식자로, 갈라진 꼬리를 가짐.
    info: 유럽에서 번식하고 아프리카 서부 사하라 이남 지역에서 겨울을 보내는 마이그레이션 조류입니다. 공중에서만 벌레를 잡으며 날아가면서 물을 마실 수 있습니다. 창고와 지붕 아래에 구멍을 파서 새끼를 품으며, 전통 문화에서는 집안의 행복과 안녕을 가져온다고 여겨집니다. 봄, 귀환 그리고 고장에 대한 충성심을 상징합니다.
  animal.swan:
    label: 백조
    summary: 아름답고 날씬한 흰색 물새로, 아름다움과 로맨스의 상징이다.
    info: 유럽에서 가장 큰 비행하는 새인 백조는 날개 폭이 2.4미터 이상 된다. 아름다움, 사랑 그리고 충성심을 상징하며, 짝은 생애 동안 서로에게 성실하다. 경계를 위해 무의식적으로 부리를 들어 올리며 깃털을 곤두세운다. 안데르센의 동화 속에서는 못생긴 오리가 백조로 변신하는 이야기에 등장한다.
  animal.toucan:
    label: 투카닉
    summary: 열대 지역의 거대하고 다채로운 부리를 가진 새
    info: 거대 투카닉은 중미와 남미의 우림지대에서 삽니다. 눈에 띄는 부리는 20cm 이상 길이지만 매우 가볍습니다. 이 부리는 공기 방으로 구성되어 있어 체온 조절, 과일을 갈라 먹기, 그리고 다른 투카닉에게 시각적 신호를 보내는 데 사용됩니다.
  animal.woodpecker:
    label: 啄木鳥
    summary: 나무 껍질을 두드리며 곤충이나 구멍을 찾는 새입니다.
    info: |-
      啄木鳥은 단단한 부리와 꼬리를 지지대로 나무를 두드리는 Picidae 계열의 조류로 적응되어 있습니다.
      그들의 혀는 부리보다 최대 세 배 길어 둔 침입구에서 유충을 뽑아내는 데 사용됩니다.
      두드리기로 의사소통하고 영역 표시를 합니다.
      유럽에서 가장 큰 啄木鳥인 Dryocopus martius가 있습니다.
