title: Vögel
cards:
  animal.eagle:
    label: Adler
    summary: Großer Raubvogel mit gebogenem Schnabel und scharfem Augenlicht.
    info: Der Weiße Haubadler ist das Nationalsymbol der USA und einer der größten Raubvögel Nordamerikas. Er jagt hauptsächlich Fische, die er mit seinen scharfen Krallen direkt aus dem Wasser fischt. Er erreicht ein Flügelspannweite von über zwei Metern und erreicht in der Natur ein Alter von etwa 20 Jahren.
  animal.flamingo:
    label: Flamingo
    summary: Rosa Wadenbird, der auf einem Bein in flachem Wasser steht.
    info: Der Rosa Flamingo erhält seine charakteristische Farbe aus Karotinoiden, die in Algen und Krebsen enthalten sind, von denen er sich ernährt. Jungtiere werden grauweiß geboren und färben sich erst im Laufe der Zeit. Der gebogene Schnabel dient als Filter – der Flamingo filtert seine Nahrung aus dem Wasser, indem er den Kopf nach unten hält.
  animal.hummingbird:
    label: Kolibri
    summary: Kleinstes Vögelchen der Welt, das in der Lage ist, sich in der Luft zu halten und rückwärts zu fliegen.
    info: Der Rotschwanzkolibri ist die einzige Kolibri-Art, die regelmäßig in der östlichen Hälfte Nordamerikas brütet. Seine Flügel schlagen bis zu 53 Mal pro Sekunde, was das typische Summen erzeugt. Er ernährt sich von Nektar und kleinen Insekten; sein Herz schlägt bis zu 1200 Mal pro Minute.
  animal.owl:
    label: Eule
    summary: Nachtpredatorischer Vogel mit runden Augen, leisem Flug und ausgezeichnetem Gehör.
    info: Die Große Eule ist die größte Eule Nordamerikas. Ihre Augen sind unbeweglich, weshalb sie ihren Kopf bis zu 270 Grad drehen kann. Der Flug der Eulen ist fast geräuschlos aufgrund der speziellen Federstruktur. Sie jagen nachts mithilfe ihres außergewöhnlich empfindlichen Gehörs.
  animal.parrot:
    label: Papagei
    summary: Farbenreicher tropischer Vogel, der Geräusche und menschliche Sprache nachahmen kann.
    info: Der Karottenvogel ist einer der größten Papageien der Welt mit einer Flügelspannweite von über einem Meter. Er lebt in den tropischen Regenwäldern Lateinamerikas. Papageien besitzen außergewöhnliche Intelligenz – der Karottenvogel kann Farben, Formen erkennen und zählen. Er erreicht ein Alter von bis zu 75 Jahren.
  animal.peacock:
    label: Papagei
    summary: Männlicher Pfau mit einem wunderschönen, färbigen Fächer im Schwanz.
    info: Der Indische Pfau stammt aus dem indischen Subkontinent. Der Männchen (Pfau) breitet sein Schwanzgefieder – in Wirklichkeit verlängerte Deckfedern – zu einem Fächer aus, um Weibchen anzulocken. Die iridisierenden Farben entstehen nicht durch Pigmente, sondern durch das Brechungsverhalten des Lichts an mikroskopischen Strukturen der Federn.
  animal.penguin:
    label: Pinguin
    summary: Nicht flugfähiger Vogel aus der Südhalbkugel, ausgezeichneter Schwimmer.
    info: Der Kaiserpinguin ist die größte Pinguinart; er erreicht eine Höhe von über 1,1 Metern. Er lebt in der Antarktis und legt Eier in den größten Kälte – die Männchen erwärmen die Eier mit den Füßen die ganze antarktische Winter hindurch. Unter Wasser erreicht er Geschwindigkeiten von über 30 km/h.
  animal.toucan:
    label: Tukan
    summary: Tropischer Vogel mit einem riesigen farbenfrohen Schnabel.
    info: Der Große Tukan lebt in den Regenwäldern Mittel- und Südamerikas. Sein auffälliger Schnabel ist über 20 cm lang, aber sehr leicht – er besteht aus Hohlräumen. Er dient zur Regulation der Körpertemperatur, zum Zerkleinern von Früchten und als visuelles Signal für andere Tukane.
