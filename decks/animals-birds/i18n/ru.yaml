lang: ru
pivot: false
title: Птицы
cards:
  animal.albatross:
    label: альбатрос
    summary: Морская птица с самой широкой размахом крыльев среди всех птиц.
    info: Альбатрос имеет наибольшее размах крыльев из всех птиц, достигающее более 3,5 метра. Он проводит большую часть жизни в открытом океане и способен летать тысячи километров без посадки. Пьёт морскую воду и выводит соль через носовые железы. В морской традиции убитый альбатрос является предвестником несчастья.
  animal.budgerigar:
    label: андалка
    summary: Маленький яркоокрашенный попугай из Австралии, популярная домашняя птица.
    info: Андалка волнистая происходит из внутренних районов Австралии и живет большими стадами. Это самая распространенная комнатная птица в мире после канарейки. Самцы могут имитировать человеческий голос и учиться сотням слов. Дикие андальки окрашены зелено-желтыми цветами; красочные мутации возникли благодаря селекции.
  animal.canary:
    label: канарейка
    summary: Маленькая желтая птица, популярная как домашний любимец.
    info: Домашняя канарейка происходит с Канарских островов и была одомашнена в XVII веке. Желтый окрас появился благодаря выведению; дикий канареец имеет зеленовато-коричневую окраску. Самцы поют сложные мелодии; конкурсы на канарейчье пение являются мировым явлением. Исторически канарейки использовались в шахтах для обнаружения угарного газа.
  animal.cassowary:
    label: касуар
    summary: Опасная нелетающая птица Новой Гвинеи с острыми когтями.
    info: Касуар – крупная нелетающая птица из Новой Гвинеи и Северной Австралии. Он считается самой опасной птицей в мире; длинные ногти на внутреннем пальце способны причинить серьёзное повреждение. Высокий костяной шлем, вероятно, служит для ориентации в густом лесу. Касуар играет ключевую роль как распространитель семян тропического леса.
  animal.cockatoo:
    label: какаду
    summary: Жёлтоочерченный белый австралийский попугай с яркой жёлтой чёчевицей.
    info: Какаду желтоочерственный один из самых известных попугаев семейства какадуовых. Его выразительная жёлтая чёчевица поднимается при возбуждении или тревоге. Он умён и способен имитировать человеческий голос. Может прожить до 80 лет в неволе и в Австралии считается вредителем урожая.
  animal.condor:
    label: кондор
    summary: Наибольшая летающая птица Америки с голой головой.
    info: Андынский кондор является крупнейшей по массе и размаху крыльев летающей птицей в мире. Это ястребиный хищник; он питается трупами больших млекопитающих и играет важную роль в экосистеме. Он плывёт на огромных тепловых потоках над Андами без взмахов крыльями.
  animal.crane:
    label: журавль
    summary: Большая мигрирующая птица, известная танцевальными ритуалами и громким криком.
    info: Журавль серый – крупная перелетная птица, которая ежегодно преодолевает тысячи километров. Он прославился своими танцующими церемониями, во время которых пары прыгают и расправляют крылья. В огромных стаях он перелетает через Чехию осенью и весной. Журавлю обязан своим названием строительный кран.
  animal.crow:
    label: ворон
    summary: Интеллигентная чёрная птица из семейства вороновых способна решать задачи.
    info: Ворон – это птица из семейства вороновых, известная исключительной интеллектуальной развитостью. Он может распознавать человеческие лица, использовать орудия труда и выполнять сложные задания. Живут они парами или небольшими группами и являются всеядными животными.
  animal.cuckoo:
    label: кукушка
    summary: Гнездовой паразит, прячущий яйца в чужие гнезда.
    info: 'Кукушечник обыкновенный известен своим гнездовым паразитизмом: откладывает яйца в чужие гнезда, где их инкубируют и кормят родители-няньки. Молодое кукушонок вскоре выталкивает другие яйца и птенцов из гнезда. Её двухсложный зов «ку-ку» является символом прихода весны. Самцы поют, самки издают булькающий тон.'
  animal.dove:
    label: голуб
    summary: Символ мира; чисто белый голуб с мягким пером.
    info: Белый голуб является международным символом мира со времён древности; в Библии он принёс Ною оливковую ветвь. В христианстве он символизирует Святого Духа. Домашний голуб на самом деле — это одомашненный скальный голуб; его белое окраска появилась благодаря разведению. Выпускание белых голубей стало частью церемоний и празднований во всём мире.
  animal.duck:
    label: утка
    summary: Водоплавающая птица с широким клювом; самец имеет зеленую голову.
    info: Дикая утка – самый распространенный вид уток в мире и предок большинства домашних пород. Самцы имеют характерно блестящие зелёные головы, а самки незаметного коричневого цвета. Это водоплавающие птицы, которые добывают пищу на поверхности воды, не ныряя. Утки являются неотъемлемой частью прудов и рек Чехии.
  animal.eagle:
    label: орёл
    summary: Большая птица с крючковатым клювом и острым зрением.
    info: Белоголовый орёл — национальный символ США и один из крупнейших хищников Северной Америки. Он охотится в основном на рыбу, ловя её острыми когтями прямо из воды. Размах его крыльев превышает два метра, а в природе он живёт около 20 лет.
  animal.emu:
    label: эму
    summary: Второй по величине птица мира, не летающий австралийский оберек.
    info: Эму коричневый является второй крупнейшей птицей в мире и эндемиком Австралии. Он не умеет летать, но хорошо плавает и быстро бегает. Самец сидит на яйцах и заботится о потомстве, самка уходит. В 1932 году австралийская армия проиграла так называемую Эму войну против стад птиц, угрожавших урожаю.
  animal.falcon:
    label: сокол
    summary: Самое быстрое животное в пикирующем полёте (более 320 км/ч)
    info: Сапсан – самое быстрое существо на Земле; в пикирующем полёте он достигает скорости более 320 км/ч. У него характерные тёмные круги под глазами, которые уменьшают отражение света. Люди охотились с ним больше двух тысяч лет; ловля соколов занесена в список ЮНЕСКО как культурный памятник. В Чехии он гнездится на высоких зданиях и скалах.
  animal.flamingo:
    label: феникс
    summary: Розовый водоплавающий птица, стоящая на одной ноге в мелких водах.
    info: Розовый феникс получает свою характерную окраску от каротиноидов, содержащихся в водорослях и креветках, которыми питается. Птенцы рождаются сероватыми и окрашиваются постепенно со временем. Закруглённый клюв служит как фильтр — феникс фильтрует пищу из воды, опуская голову вниз.
  animal.goose:
    label: гусь
    summary: Большая водоплавающая птица, перелетающая стаями в форме «восьмёрки»; гнездится на земле.
    info: Дикая утка является диким предком домашних гусей. Она мигрирует в характерной форме клина, где птицы поочерёдно занимают лидирующую позицию. Гуси очень территориальны во время размножения и смело защищают своих детенышей. В истории гуси охраняли Капитолий в Риме, их крик привлекал внимание перед нападением галлов.
  animal.hawk:
    label: сокол
    summary: Быстрый хищник, охотящийся на птиц и мелких млекопитающих в лесах и полях.
    info: Сокол — род хищных птиц из семейства соколовых, способный охотиться в густой растительности благодаря коротким округлым крыльям и длинному хвосту. Он очень быстр и проворен; охотится на птиц во время полёта или засадой. Самки обычно значительно крупнее самцов. В искусстве дрессировки соколов он был ценной охотничьей птицей.
  animal.heron:
    label: волавка
    summary: Высокая птица, которая стоит неподвижно у воды в поисках рыбы.
    info: Волавка серая – крупнейшая водоплавающая птица Центральной Европы. Она стоит как статуя и ждёт, пока рыба подплывет ближе, а затем мгновенно хватает её клювом. Может заглатывать целых рыб и лягушек. Летит с изогнутой шеей в форме буквы «S», что отличает её от цапель, летящих со сложенной шеей.
  animal.hornbill:
    label: носорог
    summary: Тропическая птица с огромным клювом и роговым наростом.
    info: Носорог – это птица из семейства носорожьих, известная своим гигантским клювом с хрящевым наростом (роговицей). Он обитает в тропических лесах Африки и Азии. В отличие от других птиц, он не строит гнёзд в дуплах деревьев или ямах, а самец запечатывает самку внутри дерева во время размножения.
  animal.hummingbird:
    label: колибри
    summary: Самая маленькая птица, способная зависать в воздухе и летать задом наперёд
    info: Колибри с красной грудью — единственный вид колибри, регулярно гнездящийся на востоке Северной Америки. Он машет крыльями до 53 раз в секунду, создавая характерное жужжание. Питается нектаром и мелкими насекомыми; его сердце может биться до 1200 раз в минуту.
  animal.ibis:
    label: ибис
    summary: Бродячая птица с изогнутым клювом, священная в Древнем Египте.
    info: Ибис – это бродячая птица семейства Threskiornithidae с характерным длинным изогнутым клювом. Святого ибиса почитали во время древнего Египта как воплощение бога Тота. Он живет колониями в болотах и речных дельтах. Бурый ибис был случайно завезен в Европу и сегодня агрессивно распространяется как инвазионный вид.
  animal.kingfisher:
    label: ледяной голубь
    summary: Переливающийся птица, преследующая рыбу в воде.
    info: Речной ледяной голубь – один из самых красивых европейских птиц с электрически-голубой спиной и оранжевым грудным оперением. Он сидит на ветке над водой и наблюдает за рыбами, затем ныряет головой вниз. Это индикатор чистоты воды – где он живёт, там вода здоровая. В Японии похожий вид (hisui) является символом красоты.
  animal.kookaburra:
    label: смеющийся киви
    summary: Австралийский киви с громким смехом, напоминающим человеческий хохот.
    info: Смеющийся киви (кукабурра) — крупная австралийская птица, известная своим громким криком, похожим на смех человека. Он является символом австралийского буша и его голос традиционно объявляет рассвет и закат. Питается ящерицами, змеями, грызунами и насекомыми. Живет в семейных группах, а молодые особи помогают родителям выращивать потомство.
  animal.lorikeet:
    label: лори
    summary: Маленький яркоокрашенный попугай, питающийся нектаром и пыльцом.
    info: Лори дуэльный – это маленький попугай из Австралии с самым разноцветным окрасом среди всех попугаев. С помощью специализированного щетинистого языка он собирает нектар и пыльцу с тропических цветов, что делает его важным опыляющим животным в тропических лесах. Он живёт стаями, шумный и игривый; в неволе быстро налаживает контакт с людьми.
  animal.lyrebird:
    label: лайротейл
    summary: Австралийская птица, имитирующая любые окружающие звуки с высокой точностью.
    info: 'Лайротейл прекрасный – австралийская птица, известная способностью подражать почти любым окружным звукам: цепной пиле, щелчку фотоаппарата, автомобильному сигналу или крикам других птиц. Самцы привлекают самок демонстрацией изысканного лирообразного хвоста и идеальных подражаний. Это символ штата Виктория в Австралии.'
  animal.macaw:
    label: ара
    summary: Большая неотропическая попугайка с ярко окрашенным пером и мощным клювом.
    info: Ары – крупные птицы тропических лесов Америки, обладающие самым выразительным окрасом среди всех видов. У них прочный изогнутый клюв, способный раскалывать твердые орехи. Они живут парами, которые остаются вместе на всю жизнь. Их популяция угрожает вырубка лесов и нелегальный рынок экзотических животных.
  animal.magpie:
    label: страка
    summary: Черно-белая птица с длинным радужно зеленым хвостом.
    info: Страка обыкновенная – это птица из семейства воронковых с яркой черно-белой окраской и длинным зеленоватым блестящим хвостом. Ей приписывают репутацию вора сверкающих предметов, но исследования не подтверждают эту легенду. Она одна из немногих перьевых животных, которые могут распознать свое отражение в зеркале. В Китае она является символом удачи и радости.
  animal.nightingale:
    label: соловей
    summary: Маленькая коричневая птица, поющая один из самых красивых певчих голосов птиц.
    info: Соловей обыкновенный – маленькая коричневая птица, самцы которой поют один из наиболее сложных и прекрасных птичьих напева. Он чаще всего поет ночью или на рассвете, откуда происходит его имя. Это дальний родственник розового скворца. Поэты со времен Данте до Китса воспевали соловьиное пение как символ романтики и меланхолии.
  animal.ostrich:
    label: страус
    summary: Самая большая птица мира, не летающая; бегает со скоростью до 70 км/ч.
    info: Страус двупалый является самой большой и тяжелой птицей в мире; самцы достигают высоты до 2,7 метров и веса более 150 кг. Он не умеет летать, но является самым быстрым двухногим животным на свете, развивая скорость более 70 км/ч. Его яйца являются крупнейшими из всех птичьих яиц. Первый палец ноги отсутствует; он имеет только два пальца.
  animal.owl:
    label: сова
    summary: Ночной хищный птица с круглыми глазами, тихим полетом и отличным слухом.
    info: Сова большая — крупнейшая сова Северной Америки. Глаза сов не могут двигаться, поэтому они поворачивают голову на 270 градусов. Их полет почти бесшумен благодаря специальной структуре перьев. Они охотятся ночью с помощью исключительно чувствительного слуха.
  animal.parrot:
    label: попугай
    summary: Цветастая тропическая птица, способная имитировать звуки и человеческую речь.
    info: Ара шафрановый — один из крупнейших попугаев мира с размахом крыльев более метра. Обитает в тропических дождевых лесах Латинской Америки. Попугаи обладают исключительным интеллектом — ара способна распознавать цвета, формы и считать. Могут доживать до 75 лет.
  animal.peacock:
    label: павиан
    summary: Самец павиана с великолепным веерообразным хвостом, полным цветных глаз
    info: Павиан коронованный происходит из Индийского субконтинента. Самец (павиан) распускает свой хвост — на самом деле это удлинённые покровные перья — в виде веера во время ухаживаний за самками. Иридиесцентные цвета не создаются пигментами, а возникают за счёт преломления света на микроструктурах перьев.
  animal.pelican:
    label: пеликан
    summary: Большая водоплавающая птица с огромным мешковатым клювом для ловли рыбы.
    info: Пеликан — большая водная птица с характерным мешком на клюве, который служит как сеть для рыбной добычи. В свой мешок он может вместить до 13 литров воды и затем выжимает её, чтобы проглотить улов. Пеликаны летают в аэродинамических формациях, используя воздушные потоки друг от друга. В христианской символике пеликан является символом самоотверженной любви.
  animal.penguin:
    label: пингвин
    summary: Нелетающая птица из южного полушария, отличный пловец.
    info: Императорский пингвин — самый крупный из всех пингвинов; его рост превышает 1,1 метра. Он обитает в Антарктиде и откладывает яйца в самых сильных морозах — самцы держат яйца на ногах и греют их всю антарктическую зиму. Под водой он может развивать скорость более 30 км/ч.
  animal.pheasant:
    label: фазан
    summary: Большая яркая птица; самец имеет выразительное окраску и длинный хвост.
    info: Фазан обыкновенный был завезён в Европу из Азии, но сегодня является естественной частью европейской фауны. Самец (петух) обладает заметной окраской, зеленовато-бронзовое тело и характерный красный мешок вокруг глаза. Это самый распространённая пернатая дичь в Чехии и основа охотничьей традиции. Гнездится на земле среди густой растительности.
  animal.pigeon:
    label: голубь
    summary: Часто встречающийся серый городской и сельский птица, происходящая от скального голубя.
    info: Скальный голубь является предком всех домашних и диких городских голубей. Это был первый одомашенный птицей человек использовал как почтового голубя на протяжении тысячелетий. У него исключительное чувство навигации, позволяющее находить дорогу домой из сотен километров. В культурах по всему миру он символизирует мир.
  animal.puffin:
    label: папукаль
    summary: Маленькая морская птица с ярким попугавым клювом.
    info: Папукали арктические – маленькие тюлениковые птицы с разноцветным полосатым клювом. Они ловят рыбу, ныряя и преследуя её под водой; могут держать в клюве сразу более десятка рыбок. Гнездятся колониями на скалистых берегах и в норах. Являются постоянной символикой Исландии и Фарерских островов.
  animal.quail:
    label: курица
    summary: Маленькая скрытая птичка, гнездящаяся на земле в траве.
    info: Полевая курица – самая маленькая представительница семейства фазановых в Европе. Она осторожна и чаще слышится (пи-пи), чем видится. В отличие от других перепелов она мигрирует и зимует в Африке. Яйца этой птицы являются популярной деликатесом.
  animal.raven:
    label: ворон
    summary: Большая умная чёрная птица с характерным криком.
    info: Ворон обыкновенный – крупнейший представитель семейства вороновых длиной более 60 см. Он исключительно умен и способен планировать будущее, играть и создавать социальные связи. В мифологиях Северян (соколы Одина Хугинн и Мунинн) и Кельтов он имеет мистическое значение. Башня Лондона охраняется легендой, что королевство рухнет, если вороны покинут башню.
  animal.roadrunner:
    label: земная кукушка
    summary: Быстрый бегун пустынь Северной Америки; символ мультсериалов.
    info: 'Земная кукушка (бегемотка) – это птица семейства куковичковых, предпочитающая ходьбу и бег полётам. Она может развивать скорость более 30 км/ч и питается змеями, ящерицами, насекомыми и мелкими млекопитающими. Ей под силу поймать и убить чёрного скорпиона. Знаменита как герой американских анимационных сериалов «Бегемотка» и «Волк». '
  animal.robin:
    label: щегол
    summary: Маленькая птица с красной грудью и символом Рождества во Великобритании.
    info: Щегол обыкновенный – это маленький певчий воробьиный зверек с характерно оранжевой или красной грудкой. Он смело следует за теми, кто копает на участке, собирая червей. Щегол является национальной птицей Великобритании и традиционным рождественским символом. Эта птица остаётся на своей территории круглый год и поет даже зимой.
  animal.seagull:
    label: gull
    summary: Побережная птица, ищущая пищу у людей на побережье.
    info: Серебристый галапагосский чайка — один из самых распространенных морских птиц Европы. Он приспособленный и всеядный; живет не только на морском побережье, но также в глубине суши около озер и рек. Он умён и иногда запоминает места, где люди кормят его. Его агрессивное интересование человеческой едой является источником множества историй туристов у моря.
  animal.secretary_bird:
    label: птица секретарь
    summary: Длинноногая африканская хищная птица, убивающая змей ударом ногой.
    info: Птица секретарь – крупный африканский хищник, передвигающийся в основном по открытой саванне пешком. Она охотится на змей и грызунов, используя мощные удары ногами, масса которых в три раза превышает её телесную массу. Её название связано с длинными перьями на голове, напоминающими брови писаря. Это государственный символ Южноафриканской Республики и Судана.
  animal.sparrow:
    label: воробей
    summary: Маленькая коричневая птица, питающаяся семенами и живущая вблизи населенных пунктов.
    info: Домашний воробей – одна из самых распространённых птиц мира и верный спутник человека. Он держится близко к жилым зданиям, гнездясь в щелях стен и крыш. В последние десятилетия его популяция в городах значительно сократилась. Для чехов воробей символизирует обыденность и приспособляемость.
  animal.spoonbill:
    label: колпи́к
    summary: Белый водоплавающий птица с характерным ложечковым клювом.
    info: Колпик белый родственник ибиса, но его легко отличить по плоскому ложечкообразному концу клюва. При поиске пищи он двигает клювом из стороны в сторону в мелкой воде. Гнездится колониями в камышовых зарослях и тростниках. В Чехии колпик редкий, но регулярный гость на южной Моравии.
  animal.stork:
    label: чаплыг
    summary: Белая большая птица с красным клювом; якобы приносит детей.
    info: Чаплыг белый – это перелетная птица, гнездящаяся на крышах и столбах по всей Европе. Зимует в тропической Африке и ежегодно возвращается к своему старому гнезду, которое год за годом увеличивает в размерах. Он является символом весны и плодовитости; согласно фольклорной традиции, он приносит детей. Чехия одна из самых важных стран Европы для размножения чаплов.
  animal.swallow:
    label: ласточка
    summary: Быстрый воздушный насекомояд с характерно разветвлённым хвостом.
    info: Ласточки обыкновенные – перелётные птицы, зимующие в Субсахарной Африке и гнездящиеся в Европе. Они мастерски летают, ловят насекомых исключительно во время полёта и могут напиться воды с её поверхности без посадки. Гнездятся они в амбарах или под крышами; в фольклоре присутствие ласточек приносит удачу дому. Ласточка символизирует весну, возвращение домой и верность родному месту.
  animal.swan:
    label: лебедь
    summary: Большая элегантная белая водоплавающая птица, символ красоты и романтики.
    info: Лебедь обыкновенный – самый крупный летающий птица Европы с размахом крыльев более 2,4 метра. Он символизирует красоту, любовь и верность; пары остаются верными друг другу на всю жизнь. Инстинктивно поднимает клюв и распускает перья в качестве предупреждения для нападавших. В сказке Г.-Х. Андерсена лебедь становится символом превращения уродливого цыпленка.
  animal.toucan:
    label: тукан
    summary: Тропическая птица с огромным ярким клювом
    info: Тукан живёт в дождевых лесах Центральной и Южной Америки. Его заметный клюв длиной более 20 см очень лёгкий — он состоит из воздушных камер. Он служит для регулирования температуры тела, разрывания фруктов и как визуальный сигнал для других туканов.
  animal.woodpecker:
    label: дятел
    summary: Птица стучит по коре деревьев, чтобы найти насекомых или высверлить укрытие.
    info: Дятёл – птица из группы Picidae, приспособленная к стуку по дереву с помощью прочного клюва и жёсткого хвоста в качестве опоры. Язык может быть до трёх раз длиннее клюва и служит для вытягивания личинок из сверлённых отверстий. Стуканием он общается и обозначает территорию. Дятел большой (Dryocopus martius) является крупнейшим дятлом Европы.
