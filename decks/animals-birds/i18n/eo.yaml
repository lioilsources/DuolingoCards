lang: eo
pivot: false
title: Birdoj
cards:
  animal.albatross:
    label: albato
    summary: Marpego kun plej grandskalo krilo-salteto.
    info: La Albatroso migranta havas la plej grandan krilospeton inter ĉiun ajn vivo-haviptajlo, plenumante super 3,5 metrojn. Pasumon de ties vivado pasigas sur malfermita maro kaj kapablas flugi milojn da km sen atingado tereno. Inges salatan akvon kaj elmetegas salon per nazaj glanduloj.
  animal.budgerigar:
    label: papago
    summary: Peta malgranda barilita papego el Aŭstralio.
    info: La Andulo ondita originas el la interna partoj de Aŭstralio, kie vivas en grandaj grupoj. Ĝi estas pleje ŝprucata birdospico sur Tero post la kolombo. La maskloj povas imiti homan voĉon kaj lerni centoj da vortoj.
  animal.canary:
    label: kaņark
    summary: Petolaflaveta kanta ovo uzata kiel hejmpetservo.
    info: La Domokaňarido origine de la Insuloj Kanaario kaj estis domesticigita en la 18-a jarcento. Per selektbrudoformado naskiiĝis ĝia flava paco; wilda kaņarkas estas verdetegno-brunecaj. Virinoj kantadas kompleksaj melodiojn; konkursoj pri kaņarks-kantu ekzistas globalmente.
  animal.cassowary:
    label: casso
    summary: Perfida nesupera pasereto kun akraj ongloj.
    info: Cassowan estas granda nesupera pasereto el Nuna Gvinejo kaj nordo de Aŭstralio. Ĝi havas longajn ungujn sur la interna fingero kiuj povas kaŭzi gravajn traumojn al homoj. La alta osfra kapŝildo probable helpas en orientado per densarbo.
  animal.cockatoo:
    label: blankpapago
    summary: Blanka papagao kun notinda flavflugila kapŝildeto.
    info: La Kakatoe blanka estas unu el la pleje konataj per kiu birdoj de familio Cacatuideaŭ. Ĝia distinganta flava kapŝildo levigasĝis dum emocio aŭ alarmado. Ĉi tiuj bestoj havas altan intelektivon kaj povas imiti homajn voĉojn.
  animal.condor:
    label: konker
    summary: Plej granda volantbirdo Nordameriko kun malhava kapo.
    info: Andina Kondero estas la plej granda fluganta birdo en Peso de Mondo kun grandsupereco kaj vasteco elkrigiloj. Ĝi manĝas mortintajn korpojn da grandaj mamuloj kaj ludas gravan eko-sisteman rolon. Plenkreskas sur enormaj varmegrajndoj super Alpido sen movado de flankoj.
  animal.crane:
    label: heronido
    summary: Grandega migrante pico famkonata per siaj dansoj kaj potenca voĉdonaco.
    info: La pelgrana heronido estas granda migranta ovopeco kiun oni konas pri ties dansaj prezentadoj dum rutinoj en paroj kun saltetojn kaj elvolutigita flugiloj.
  animal.crow:
    label: raveno
    summary: Nigra intelligenta korvido dekrinita por savi problemon.
    info: Raveno estas birdo el familio Krakvitaj konata per eksterordinara intelektado kaj kapablo solvi kompleksajn taskojn. Ĝi povas distingi homan facion, uzi ilon kaj vivanta en paroj aŭ malgrandaj grupoj kun omnivora diëto. En la ĉekmitologia ravenoj havas mistikajn ecojn.
  animal.cuckoo:
    label: Kuako
    summary: Reproduktivulo metanta ovalo en fremdenido.
    info: La Kukaco ĝenerala estas konata per sia reproduktiva parasito eco; depozicias sian ovon en aliajn nidojn, kiuj estos ekloĝigitaj de la gastiga gepatro. La kuakato post eklongo elpelas ajnan estranovojn kaj nestinfanojn el la nido. Ŝi havas du-tonan 'ku-kú' voĉdonadon simbola por venko da printempo.
  animal.dove:
    label: blankpigula
    summary: Simbolo pri paco kun belaj plumoj.
    info: Blanka pigo estas internacia simbolo de paco ekde malnovtempoj; en la Biblio ĝi donis Olivan branĉon al Noaho. En kristianismo ĉiu blankpeta birdo reprezentas Spiritan Santemon. La hejma piga fakte originas el roka pigulo domestikaĵita dum jarcentoj.
  animal.duck:
    label: ansa
    summary: Akua obo kun plata beko; virinaj ansorojn havas verda kapo.
    info: La mallarma estas la plej disvastigita specio de ansero en mondo kaj antaŭulo multe el hejmpolitikoj. La virino havas karakterize brilantan verdan kapon dum la patro (ansero) establas senzorge brunecan plumagon. Ili estas surfacantaj anseroj kiuj manĝadas per forlasi sub akvo sed ne plongi.
  animal.eagle:
    label: aquilo
    summary: Granda preda birdo kun kurba rado kaj agila videbleco.
    info: Belaheĝa aquila estas la nativa simbolo de Usono kaj unu el plej grandaj predatores en Nordameriko. Ĝi prinsas precipe fiŝojn kiujn kaptegas rekte ekde akvo per siajn malmolajn ŝpicojn. En natura stato atingas krilamadon plenpunkte du metrojn longan kaj vivadas proksimume dudekkvin jarojn.
  animal.emu:
    label: emo
    summary: Duama en dimensio inter ptegoj de tiun mondo, malflugema aŭstralia birdo.
    info: La Emu estas la dua plej granda pajlo kaj originas el Aŭstralio. Ĝi ne povas flugi, tamen ĝi bonbasa neserĉeblas kaj rapidan korpon havanta. La maskulo sidigas sur ovumoj kaj prizorgadas gepupetojn dum la inkubado periodo.
  animal.falcon:
    label: falko
    summary: La plej rapida animalo mondo dum plombo kun rapideco super 67 m/s.
    info: Peregrina falko estas la plej rapida besto sur Tero kaj dum plombado atingas rapidon super 485 km/h. Ĝi havas karakterizan malluminan ringojn sub okulo por malpligrandiĝigi reflektojn de sunlumo. Homaro uzis tiun birdon en falkejo ekde antikve epoko proksimume du mil jaroj kaj tio establis tradicion inkludita al Unesco patrimonio.
  animal.flamingo:
    label: roseflankego
    summary: Rosroza akua ovo sur unu piedo je malprofunda akva.
    info: La Rosaflankulo havas sian karakterizan rozan coloron el karotenoideoj enhavitaj en aligeroj kaj krustakojn kiuj estas ĝia manĝo. Nova naskiĝinta puto establas grisecajn kolorojn sed iom perdiĝe ricevas la rozan tonon dum tempo pro tiun efikon de nutraĵoj. La kurba beko funkcias kiel filtra aparato - la rosaflanko uzas siajn kapo inversigitan por filtros pri trovi manĝon.
  animal.goose:
    label: ansero
    summary: Akva papageto kun klina flugmaniero.
    info: Grandan kapablon pri navigado havas la grandega akvo-papago Ansero ansero dum sia migracio en karakteriza 'klino'. Ĝin oni konis pro ties forta voĉdonaco por varniĝoj antike.
  animal.hawk:
    label: hawk
    summary: Malgrandega predato hundo kiun oni trovas en forstaraĵoj kaj agrarum.
    info: Hawk estas genro de rapidoj el la familio Accipitridae kapablaj venkadi en densa arbararo pro mallongaj rondigitaj flugiloj kaj longa pugo. Ĝi tre rapidas kaj manĝeblas por pridemandi bestojn dum volado aŭ ekde kaŝiteco. Inagoj kutime grandegas pli ol viroj.
  animal.heron:
    label: volovo
    summary: Alta akva pesko staranta silenteme por pescadi.
    info: La Volavo griseca estas la plej granda akvo-pesko en Centra Eŭropo. Ĝi restas senmove kiel skulpturo kaj atendisĝis ke fiŝo venos al proksimeco antauke ĝi rapidas per sia beledo. Kapabla manĝi entirajn fiŝon kaj ranon.
  animal.hornbill:
    label: rohpalo
    summary: Troplaŭda ovo kun grandego rago kaj horakto.
    info: Rhopalostila estas ovo de la familio Bucertidaj karakterizita per grandega rogo kun kostaĵeto (kaske). Ĝi vivas en troplandaj arbaroj de Azio kaj Afroko. Ne konstruas neston sub tereno sed internen de lignodutoj; pino restadas enfermita dum tuta reprodukta periodo.
  animal.hummingbird:
    label: rubanekolibo
    summary: La plej malgranda ovo-havinta bestulo kapabla restadi sur loko kaj voli inversen.
    info: Rubanekolibo estas la sola specio de kolibo regule konstruantanta neston en orienta Nordameriko. Ĝiajn flugilojn balancas supre al kvindek tricoj por sekundo, kreante karakterizajn vibradojn; manĝadas per sokaĵo kaj mikro insektejoj dum ties korpu pulsoiras plenumas mil ducent batoj pro minuto.
  animal.ibis:
    label: ibo
    summary: Ostaro per kurbega beko, sanktega en Malnov-Egiptujo.
    info: Ibo estas broda ostaro el la familio Threskiornithidae kun karakteriza longa kaj kurba beko. La sankta ibo estabas reverkata en malnova Egipto kiel manifestacio de dio Toto. Ili vivadas sur nunejoj kaj riverdeltoj.
  animal.kingfisher:
    label: alcedon
    summary: Tre bele emplumita avido kiun oni trovas proksime al riveroj.
    info: La Alcedo estas unu el la plej belaj oceaniajn pasero kun elektroblua dorso kaj naranĝa brusto. Ĝi sidas sur branĉeto super akvo por rigardi fiŝojn antau ol plombi sin en ilin.
  animal.kookaburra:
    label: kukubura
    summary: Grandan australian birdon kun voĉo similanta al humana rideto.
    info: Kukubura estas granda birdo el Aŭstralio konata per ĝia forta kriado simila al homa risado.Ĝi vivas en familiargrupoj kun plenkreska helpo de junuloj por eduki gepatrojn pri la patrujo.La kukuburo havas varian dieton inkluzivante reptilojn,kaprelojn,insektojn.
  animal.lorikeet:
    label: duhorio
    summary: Duho-koloreca papagapeco vivanta per nektorano kaj plenumo.
    info: Duhokolora lorio estas malgranda papago el Aŭstralazio kun la plej varmegaj koloroj inter ĉiuj papagidoj. Ili havas specialigitan broskadlan lingvon por kolektado de nektro kaj polenon sur tropeaj floroj kaj funkcias kiel gravaj pollinigistoj en tiu ekosistemaĵo.
  animal.lyrebird:
    label: liropasto
    summary: Ova Aŭstralio povas precize ripeti iun ajnin sonon en sia najbaro.
    info: 'Liropastro belasema estas aŭstralia ovo kiu fami pri kapablo imiti preskaŭ ajnan sonon el la ĉirkaûo: ŝtormilojn de motorklopodoj, fotoaparatojn, automobilalarmojn aŭ aliajn paserinojn. Virinoj atkrakas virinojn per montrado ilia beleco kun plisplata lyropasta cirklo kaj perfektaj imitaĵoj.'
  animal.macaw:
    label: ara
    summary: Granda Neotropa papagoo per brila plumaĵo kaj forta bokko.
    info: Aras estas granda papago de la varmegrajso en Suda Ameriko kiu havas pleje kontrastan plumon el ĉiuj birdoj. Gxi posedas fortikan kurban bekon kapablan frakasi dura nukletoj da ŝeloj. Ili vivadas kun partnero dum tuta vivo.
  animal.magpie:
    label: urostrepto
    summary: Nigre-blanka birdo per longa arkeologia verdega vango.
    info: Urostreptus komuna estas birdo el la familio de korvikoj kun kontrastanta nigra kaj blanka plumaro kaj longa verda brilpluma vango.Ĝi havas reputacon pri fariĝado al rubandojn sed es plenumis ne pravigas tiun legendo.n Li unu el malgrandaj mamiferaj birdoj kapabla distingi sia reflekto en spegulo. En Ĉinio temas simbolo da bonfaco kaj gajo.
  animal.nightingale:
    label: luscinio
    summary: Malsaĝa kasta pajlo plenumanta unusan el beleco aviadila harmonio.
    info: La Luscinio estas malsupera kastana pajlo kies masklulo eldonas unu el la pleje kompleksaj kaj belaj aviadilharmoniilojn en sia domaro. Ĝi pleji freke harmono dum nokto kaj mateno, de kiun origino venis ties nomo. La lusciniolo apartenas al proksima rango kun rubetido.
  animal.ostrich:
    label: emu
    summary: La plej grando birdo el tuto termonde, kiun kapablas ne voladi; kurado rapidoĝe supren ĉe 70km/h.
    info: Emu estas la plej granda kaj peza ovo-hundo sur Tero; viroj atingas altecon ĝis 2,7 metrojn kaj perton pli ol 150 kilogramon.Ĝi ne povas flugi sed temas pri la plej rapida du-piedulo en mondo kun rapideco superanta 70 kilometron po horo.Siaj ŭgloj havas la plejegrandan ekzemplaron inter tiom da bestaro.Limigita unua fingro de piedo mankas al li; restadas nur du fingro.
  animal.owl:
    label: uro
    summary: Nokta predaci plumo kun rondigitaj okuloj, senzorgena volado kaj eksterordinare malgranda akustika perceptemo.
    info: Uro pod granda estas la plej grava uro de Nordameriko. La okuloj de urinoj ne povas moviĝi kaj do ili turnadas iliajn kapojn ĝis 270 gradoj por rigardi en malsamaj direkcioj. Ilia flugo establas pro tre silenta perrangaro.
  animal.parrot:
    label: Papego
    summary: Vivanta tropika ovoformo kapable imiti sonojn kaj homan parolon.
    info: La Ara rubro estas unu el la plej grandaj papegoj en mondo kun flugilo pli longa ol metro. Ĝi loĝas en varmegrejeblaj arbaroj de Latinameriko. Papegido havas eksterordinaran intelektadon - kapabla distingi kolorojn formojn kaj nombri; vivdureco atingas eĉ sepdek kvin jarojn.
  animal.peacock:
    label: korunkepo
    summary: Masklpevo kun magnifika plumplena birdoko.
    info: Korunkepa estas originanta el la sudazia insubkonto. La masklo etendas siajn pendojn - kiuj en realo estas longigitaj kaŝperoj - al birdokonformo dum serĉado de gepatro. Ĝinaskoloras rezultigatas ne pigmentoj sed lumofrakto je mikrostrekoj.
  animal.pelican:
    label: peliĥano
    summary: Granda akva ovo kun enorma sakforma beledo por peska.
    info: Pelikanas estas granda akua ovo kun karakteriza tasko en la buko funkciantanta kiel reto por pescadoj. En tiun taskon ĝi povas metigi supren al tredek literoj da akvio; tiam elpremas la akvon kaj manĝas la peĉatojn. Ili flugas per aerodinamika aranĝo kaj uzadas fluadon de varmaj aerostrumadoj inter si.
  animal.penguin:
    label: stranlok
    summary: Nevolanta ptero el suda hemisfiero bone kapabla nadi.
    info: Imperiestrajno estas la plej granda el ĉiuj stranlokoj kaj atingas altecon super unuon kilometron en longo de duono da metro.Ĝi vivas sur Anktarido kaj povoras ovumojn dum ekstremaj malvarmoj - maskuloj varmegras ovojn per piedoj tute tra anktarida hiverno.Sub akvoreto ĝia rapideseco transiras tridek kilogrammon horintere.
  animal.pheasant:
    label: papago
    summary: Granda kolora volatulo; la maskulino havas eksterordinarajn plumojn kaj mallongan voston.
    info: Pheasant was introduced to Europe from Asia but is now part of European fauna. The male pheasant displays striking coloration—green-brown body and red wattle near its eye—and it nests on land among dense vegetation.
  animal.pigeon:
    label: Kolumbo
    summary: Ofte vidata griza birdo en urbojn kaj agrarareojn, origine petro-kolombo.
    info: Petrokolombo estas antaŭulo de ĉiuj hejmpastraj kaj feraligitaj urbaj kolombeoj. Li estis la unua hom-domestiĉigita birdo; servad al homo kunmesagileco dum miljarde da jaroj. Baldaû havas eksterordinaran orientiĝan senton kaj povas trovi sian vojon reen el centeroj da km for.
  animal.puffin:
    label: fratercelo
    summary: Alibabo marbirdo kun barilita papucego bokalo.
    info: La Fratercelo polarna estas peta alibabo kun koloraj plumboj ĉe la beko. Ĝi peĉas per mergado kaj sekvante fiŝojn sub akvo dum pluraj minutoj en ununura eliro de surfaco. La birdeto kapablas portadi preskaŭ cent fiŝetulojn samtempe sur sia beko.
  animal.quail:
    label: krepelo
    summary: Pli malmola kaj mallonga stepa birdo vivanta proksime al grundo.
    info: La kampokrepelo estas la plej malgranda reprezentantino de faŝanido en Eŭropo. Ŝi restas kaŝita inter herbo sur tereno kaj oni multeplene atendos ĝin eksterpreni ol aŭdi sian karakterizan 'pipipito'. Kontraste al tiuj el resto da perduoj, temas pri migranta specio pasigante vintraon en Afriko.
  animal.raven:
    label: urniso
    summary: Granda malnova nigrulo per karakteriza guto.
    info: Urnis granda estas la plej grava birdo el familio de korvido kun longeco super 60 centimetrojn. Ĝi posedas eksterordinaran intelektadon kaj kapablon planigi por estontecoj, ludadi kaj formi socialajn rilatojn. En mitologioj nordanoj (Odino havras Hugonn kaj Munnin), ankaŭ keloitaj tiam mistika stato.
  animal.roadrunner:
    label: '''Granddeserto'''
    summary: Piedrapida besto en nordamerika dezertego; simbolo por animaciaj filmserioj.
    info: La 'granddeserta tielbirdo' estas birdo el la familio de la tialirdoj kiun plenumas pado kun piedirado ol flugadiĝo. Ĝi atingas rapidon super 30km/h kaj manĝadas serpentojn, varanojnojn, insektarojn kaj etaj mamuloj. Kapabla al preni kaj mortigi nacelojn.
  animal.robin:
    label: rubiculo
    summary: Malsaĝa ptilonto per ruda brustokoloro, kristnadza signifo en Gbrito.
    info: Rubiculo komuna estas mala kantanta ptilonto kun tipike orangeco-rubra brusto. Ĝi neatente atakas hortistojn kiuj grumbeladas kaj kolektas ekzaltenintajn vermojn. Ĉar temas pri la nativa ptilonto de Gbrito kaj tradicia simbolo de Kristnadzoj.
  animal.seagull:
    label: racus
    summary: Marlima birdo serĉanta manĝon proksime de homo kaj malproksime.
    info: Racus argentea estas unu el pleje disvastiĝintaj marbirdoj en Eŭropo. Ĝi adaptas sin bone al diversaj situacioj kaj manĝas preskaŭ ion ajn; vivas non nur sur mariolimo sed anke internomare apud lakegoj kaj riveroj. Ili havas bonan memoron por lokoj kie homoj donacas ilin manĝon.
  animal.secretary_bird:
    label: sekretaŭro
    summary: Longopedila afrikana rapido kiun oni tuŝas per piedbato.
    info: La Sagittarius secretary bird estas granda afrika predilo kiu promenas sur malfermaj stepoj. Ĝi mortigas serpentojn kaj rodomatojn kun fortikaj piedbatoj pezantaj trioble ol ties korpa pezo. La nomo devenis pro longaj plumoj en la kapo similante al barbetuloj por skribisto.
  animal.sparrow:
    label: passero
    summary: Peta bruna kantanta pico vivanta apud loĝlokoj.
    info: Domata passero estas unu el la pleje disvastigitaj birdoj en mondo kaj fidel kompanio al homaro. Ŝi restas proksime al lokaĵoj kun homo, kie konstruuĝas nidojn inter murfrakturoj kaj tegmentoj. En lastaj jardekadoj ties populacio urbisme tre malpliiĝis.
  animal.spoonbill:
    label: blanka kolpingo
    summary: Blanka brodanta oceana besto kun karakteriza kuŝeta kapo.
    info: La Kolpingo blanka estas parente de la ibisoj, sed facile distingas per ties plataj kuŝetformaj radoj. Serĉante manĝon movadas siajn radokapon el flanko al flanko en malprofunda akvo. Ties nidoj troviĝas sur insuloj inter palustroj kaj salicejoj.
  animal.stork:
    label: Ĉapo
    summary: Granda blanka ovo kun ruza beledo ;diratas ke ĝi donacas infanojn.
    info: La ĉapo blanka estas migranta ovo kiu konstruas nidojn sur domrojoj kaj piloero en tuta Eŭripo. Wintros temas Tropic Africa kaj revenas al la sama nestiĝeĉe ĝis pligrandiĝas.Ĝi simbolas printemon kaj fruktecon;la popola tradiicio diras ke Ĝi portadas infanojn.Ceskio estas unu el pleje gravaj eŭriparoj por Ĉapoj.
  animal.swallow:
    label: hirondino
    summary: Malrapida aerila inspekto kun specifa bifurcita pinto.
    info: La Hirundor komuna estas migranta birdo pasigante la vintran sezono en sub-Sahara Afriko kaj nidumado en Eŭropo. Ĝi havas grandan mastron de flugo; ĝi venĝas insektoj nur dum volado kaj povas trinki el surfacon sen atingi teruregion. Nidumas en agraraj konstrukciaĵoj kaj malsupre de tegmentaroj; en folkloro oni konsideris ke portadas bonŝanco al hejmprezenco.
  animal.swan:
    label: labuto
    summary: Granda eleganca blanka akua avido simboliza belecon kaj romanikon.
    info: La Labuti granda estas la plej grava fluganta paserofonto en Eŭropo kun alvoluo de pli ol 2,5 metrojn inter ĝiaj du flankoj. Simbolas belon, amon kaj fidelulon; tiuj paroj restas unuiĝitaj dum tuta vivo. Averinteme levigas sia bekon kaj inflamas plumum por minacadi atakantojn.
  animal.toucan:
    label: papaga
    summary: Tro-pika ptafino kun grandega multkolora bokalo.
    info: Papago giganta vivas en pluvaj tropikoarbaroj ĉi tie Centra kaj Suda Aŭstralio. ŝia atentigema beko estas super 20 centimetroj longa sed tre malpeza - formita per aerĉambroj. Uzatas por regado da korpa varmo, fruktodisĵetigo kaj videbla signalizado al la ceteraj papaguloj.
  animal.woodpecker:
    label: droso
    summary: Ovo frapas sur lignokuro tro esplori insektaro.
    info: Droso estas ovo de la familio Picoideoj adaptita al perforto kun malmola beko kaj rigida pugo por apogo kontraŭ arbotrunkoj. Ĝia lingvo povas esti trioble plilonga ol sia nazo kaj servas por eltrovi larvojn en forigitaj truoĵoj. Per fortika perkutado droso interkovras sian ekstercon kondamnon kaj markadon.
