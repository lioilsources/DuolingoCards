title: पक्षी
cards:
  animal.eagle:
    label: सुपारी
    summary: एक बड़ा शिकारी पक्षी जिसका मुंह घुमावदार होता है और दृष्टि तीक्ष्ण होती है।
    info: हालिएटस एक बड़ा शिकारी पक्षी है जो उत्तरी अमेरिका के सबसे बड़े शिकारी पक्षियों में से एक माना जाता है। यह मुख्य रूप से मछलियों का शिकार करता है, जिन्हें अपने तीक्ष्ण नखरों के साथ पानी से सीधे पकड़ लेता है। इसके पंखों का फैलाव दो मीटर से अधिक हो सकता है और वास्तविक जीवन में लगभग 20 वर्ष तक जीवित रह सकता है।
  animal.flamingo:
    label: फूलों का पक्षी
    summary: एक गुलाबी रंग का ब्रॉडिंग बर्ड जो एक पैर पर खड़ा होता है और छोटे पानी में रहता है।
    info: फूलों का पक्षी अपने लाल रंग को रेशों और क्रेव्स में मौजूद कैरोटीनॉइड्स से प्राप्त करता है, जिन पर वह खाद्य ले रहा है। इसके बच्चे शुरू में धूलई रंग के होते हैं और बाद में रंग धीरे-धीरे बदलता है। झुका हुआ चोंच एक फिल्टर के रूप में काम करता है - फूलों का पक्षी पानी में खाद्य पदार्थ छानने के लिए अपना सिर नीचे करके फिल्टर करता है।
  animal.hummingbird:
    label: कोलिब्री
    summary: दुनिया का सबसे छोटा पक्षी जो स्थान पर उड़कर रुक सकता है और पीछे की ओर उड़ान भर सकता है।
    info: कोलिब्री रूबी-थ्रोटेड एकमात्र प्रजाति है जो नियमित रूप से उत्तरी अमेरिका के पूर्वी भाग में घर बसाती है। यह प्रति सेकंड 53 बार पंख फड़काता है, जिससे एक विशिष्ट बज़र ध्वनि उत्पन्न होती है। यह नेक्टर और छोटे कीटों पर खाद्य ले रहा है; इसका दिल प्रति मिनट 1,200 बार धड़कता है।
  animal.owl:
    label: सोवा
    summary: रात्रि का शिकारी पक्षी जिसकी आंखें गोलाकार होती हैं, उड़ान शांतिपूर्ण होती है और श्रवण शक्ति अच्छी होती है।
    info: वृहद यूरोपीय नाइट हॉक उत्तरी अमेरिका की सबसे बड़ी सोवा है। सोवाओं की आंखें अचल होती हैं, इसलिए वे अपने सिर को 270 डिग्री तक घुमा देते हैं। उनकी उड़ान लगभग शांतिपूर्ण होती है क्योंकि उनके पंखों की विशेष संरचना होती है। वे अद्भुत रूप से संवेदनशील श्रवण शक्ति के साथ रात्रि में शिकार करते हैं।
  animal.parrot:
    label: पैरोट
    summary: एक रंगीन उष्णकटिबंधीय पक्षी जो ध्वनियों और मनुष्य के बोलने की आवाज के अनुकरण कर सकता है।
    info: एरा शरलैटोवी दुनिया के सबसे बड़े पैरोट में से एक है जिसका पंखों का फैलाव एक मीटर से अधिक होता है। यह उष्णकटिबंधीय वर्षा वनों में रहता है। पैरोट में असाधारण बुद्धिमत्ता होती है - एरा रंगों, आकृतियों को पहचान सकता है और गिन सकता है। यह अधिकतम 75 वर्ष तक जीवित रह सकता है।
  animal.peacock:
    label: पाव
    summary: मादा को आकर्षित करने के लिए पाव का पूंछ फैलाकर एक वेज़ाइर का निर्माण करता है।
    info: कोरोनेटेड पाव भारतीय उपमहाद्वीप का मूल निवासी है। नर पाव अपने पूंछ को फैलाता है, जो वास्तव में एक बढ़े हुए छिपाने वाले पंख का बना होता है, जब वह मादा को आकर्षित करने के लिए प्रयास करता है। इरिडिसेंट रंग पिगमेंटों से नहीं, बल्कि पंख की माइक्रोस्ट्रक्चर पर प्रकाश के अपवर्तन से उत्पन्न होते हैं।
  animal.penguin:
    label: टुकान
    summary: एक उड़ान न उड़ाने वाला दक्षिणी गोलार्ध का पक्षी, शानदार तैराक।
    info: साम्राज्य टुकान सभी टुकानों में से सबसे बड़ा होता है; यह 1.1 मीटर से अधिक की ऊंचाई तक पहुंच सकता है। यह अंटार्कटिक में रहता है और बर्फीली ठंड में अंडे रखता है - नर टुकान पूरी अंटार्कटिक शीतकाल के दौरान अपने पैरों पर अंडे गर्म रखते हैं। पानी के नीचे यह 30 किमी/घंटा से अधिक की गति तक पहुंच सकता है।
  animal.toucan:
    label: टुकान
    summary: एक उष्णकटिबंधीय पक्षी जिसका एक बड़ा रंगीन चोंच होता है।
    info: टुकान एक बड़ा पक्षी है जो केंद्रीय और दक्षिणी अमेरिका के वर्षा वनों में पाया जाता है। इसका चोंच 20 सेमी से अधिक लंबा होता है लेकिन बहुत हल्का होता है क्योंकि इसमें हवा के गुमर भरे होते हैं। यह शरीर के तापमान को नियंत्रित करने, फलों को काटने और अन्य टुकानों के लिए दृश्य संकेत देने में मदद करता है।
