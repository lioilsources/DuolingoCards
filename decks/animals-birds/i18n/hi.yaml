lang: hi
pivot: false
title: पक्षी
cards:
  animal.albatross:
    label: |-
      एलबेत्रौज़् समनियच कहा जाने वाला अल्बाट्रॉस दुनिया के सभी चलने और घूमने वाले पक्षियों में से सबसे छोटे पखवाड़े फैलाओं के साथ है।
      यह खुले महासागर पर रहता है और हजारों किमी भूपर्पटि पर आगे बढ़ सकता है।
      इसके ऊषणश्श्िद झिल्लिका से इसके धड़े ऑफ़ ठंडक ढेर हो जाते हैं।
      नौसृज कथा में, मारा गया अल्बाट्रॉस ऐसे बुरे भाग्य का प्रतीक है।
    summary: ओशन पक्षी जिसके पखवाह दुनिया के सभी पक्षियों में से सबसे छोटे हैं।
    info: अल्बाट्रॉस एक मछुआरा पक्षी होते हैं।
  animal.budgerigar:
    label: एटलासजीनस
    summary: एटलासजीनस छोटे और शाखाओं वाले पेड़ हैं जो अधिकाँश ऊष्णकटिबंधीय इलाकों में पाए जाते हैं।
    info: |-
      वेवली मार्कोस ऑफ़ सॉउथ पश्चिम के हरमना जंगलों में प्रचुरता से पाया जाता है।
      यह दक्षिणपूरब एशिआई भाग में बड़ी मान्यता प्राप्त लघु फलदार झाड़ियों का प्रतिनिधि है।
  animal.canary:
    label: कनाड़ी
    summary: छोटा पीला फॊकरा पक्षी जे घरेलू पाळी के रूप में लोकप्रिय हई
    info: |-
      गृह बिल्ली कनारा में से हर प्रकार कोशलता के उदय के संबधि हुआई।
      प्रजनन के कामसे इमका पीला अवटच विकसित हुअउ ; जंगली कनाड़ी हरा -भौर दखइए。
      फैल्स गठन के आऊषधि नृत्य के एक भाषण के चढऩ छिट
      ऐतिहाशिक रूप से , कनाड़ी खाणी में काढङ ऑक्साइड के धुओं के पता लगाओ के लगाऐ घलथे
  animal.cassowary:
    label: कैसुअर
    summary: एक खतरनाक ऐसा चिड़गट्ठा जो नई गिनी का है और जिसके धारीदार घोंघे होते हैं।
    info: |-
      कैसुआर एक प्रचंड काले हिस्टलेशन समोहीया में नई गिनी और उत्तरी ऑस्ट्रेलिया का बढ़िया चिड़गट्ठा है।
      वह दुनिया के सबसे खतरनाक पक्षी माना जाता है; अपने आंतरिक वजनदार पंखों में छोटे धारीदार घोंघे होते हैं जो भारी इजाफा कर सकते हैं。
      ऊंची हड़्डी के ढाँचे वाली झामर ऊषण जंगल में ओरिएंशन के लिहाज से थोड़ा सहायता प्रदान करती है।
  animal.cockatoo:
    label: काकैड्यु
    summary: एक ऐसा पीला छोटा फखफखा हौआ ऑस्ट्रेलियाई धृष्ठभाण्ड जिसके थोड़े बाळी बाँध होते हैं
    info: "काकैड्यु जलोसा के परिवार से हीन मेंशंज़ियोग्‍वोट्रम।\nउत्साह अथवा चिड़चिड़ापन के समय इसकी खबरदार नामक लंबी पीली बाँध ऊपर उठ जाती है। \nइसमें दिमाग होता है और आदमी की एह भाषण के झूठे ढंढोरे घुमाओ शक्ति होती है।"
  animal.condor:
    label: कौंडोर
    summary: अमेरिका के सबसे बड़ा उड़ने लगा पक्षी झुकी हुई सिर
    info: |-
      एंडीज़ कॉन्डोर दुनिया में सबसे हलकापन और पखवारों के फैलाव के महत्त्वपूर्ण आधार पर सबसे बड़ा उड़ने लगा प्रमुख।
      यह एक चटई है; इसका भोजन ठण्ढे जानवरों के मृतशरीर होते हैं अउ यह पारिस्थितिकी तंत्र में महत्वपूर्ण भूमिका खेळथे。
      इसके शामिल गठिट ऊष्मा के प्रभाव में ओ ऐंदीज़ के छत्र घूमत हैं बिहिना पखवाँओं के हिलाऩ,
      ऐंदीज़ के ऋतुआफ़्रो के लिए कौंडोर आकाश अऊ मुक्ति के पवित्र प्रतीक हे।
  animal.crane:
    label: जेराब
    summary: एक ठंढऩ डास जो नृचन रिथयलों ओर धमाही ऐधट के लिम जाञे वाळा होऊ
    info: "जेराब पॉपलेवी एक महत्त्वपूर्ण क्रमिका होने से लगभग हज़ारों कि॰मी॰ की यात्रा करती हुई।\nइसे इसके नृचन रिचयलों के कारण प्रख्यापित किया गया है, जब टीमें छलाँग मारती हैं और अपने पंछे फैला देती हैं। \nवे शरद्‍‍ऋतु और आषाढ़ में भारत के ऊपर खूबशेर झुड़कों में घूमते हैं।"
  animal.crow:
    label: व्राना
    summary: उच्छछट बढऽ ढऴरी जो कि परिवार के झुकों के समस्याओं के समाधान कर सकथे।
    info: "व्राना परिवार के एक महत्पूणीय सदस्य होने के कारण अपेक्षाचंल बुद्धि के लिहए जात हई।\nइमे मनखओं के उच्छछट देख सकथे, औज़ारों के इष्टेमाल कर सकथे आऊर भगडऩ घटनाओं के समाधान कर सकथे। \nवे झुकों ऐठा गधरे फँफळ में ठाडऱ थे ऊ ऑभिसाश्‍चिक ईश्िबाणी हई।"
  animal.cuckoo:
    label: कौआ
    summary: अपने ऐलुओनिक झूठ के लिहाज से थोथे अंडे के लिए अभिषेक करता है।
    info: |-
      कूवा चिड़ियाएं प्रसिद्ध हनीज के समरोह में अपने जुड़वाँ नोट कल के लिये।
      इच्छित घर में उत्पन्न बच्चे कई विस्मरणशील आदर्श गठबंधन और इष्टतम रखरखाओ के भीतर खुद के ऊपर फैले हए ढेर के ठगी करते हैं।
  animal.dove:
    label: होलुवाई
    summary: अहिंसा के चिह्न ; घनघटिट झिड़के और छोटे पक्षी
    info: |-
      बिल्कुल सफेद गौरमय पक्षी होलुवाई के मनखा संस्थान के अहिंसा के चिह्न के रूप में।
      ईज़दति बाइबल मेँ यह एगो ओलिव के शाखा लइए के जात हई。
      ईश्राम के धर्म में ऊ आध्यात्मिक उर्स के भी चिह्न हई।
  animal.duck:
    label: कछुआ
    summary: एक ऐसा पानी के पक्षी जिमके ठोस चोंच होथे ; पुरुष (गदरख़्ति ) हरे सिर वाले होथे
    info: "काचा डिवोल्का पूरे संसार में कचहीयन कई हुएवम घरेलू नस्लों का प्रतिद्य।\nपुरुष (गदरख़्ति) के एक अभिजात गडबढ़ा भरा हरा सिर होथे, और माँजी बेहद छोटी आऊर धूधर शरीर ओठे। \nइ हुआओ खास ढंग से ऊपरी सतह पर झुंघलाउ फैलाथे, इ टापण ऑफर नहीं करथे।"
  animal.eagle:
    label: सुपारी
    summary: एक बड़ा शिकारी पक्षी जिसका मुंह घुमावदार होता है और दृष्टि तीक्ष्ण होती है।
    info: हालिएटस एक बड़ा शिकारी पक्षी है जो उत्तरी अमेरिका के सबसे बड़े शिकारी पक्षियों में से एक माना जाता है। यह मुख्य रूप से मछलियों का शिकार करता है, जिन्हें अपने तीक्ष्ण नखरों के साथ पानी से सीधे पकड़ लेता है। इसके पंखों का फैलाव दो मीटर से अधिक हो सकता है और वास्तविक जीवन में लगभग 20 वर्ष तक जीवित रह सकता है।
  animal.emu:
    label: एमू
    summary: ऑस्ट्रेलियाई एक बड़ा पक्षी जो उडऩे के अक्िमत हईं।
    info: "एमू हरियो दुनिए के पहली सबसे मेग्हा पक्षि हईं।\nओ उड़त नइयाँ, लेकिन ओ अच्छा तैराऊगी आऊर धीट भगोउगी हईं। \nजवाबदारी डामर जखन घरपर विच टमर झाखणा और इछ्‍छुआ श्रथा फरे थे, ऐठे ठाढ़ी ऑफर घर जासे।"
  animal.falcon:
    label: चिढ़िया
    summary: '''उछलते'' फ्लायिंग में सभी जानवरों में सबसे तेज़'
    info: गुफ्तार चिड़िया पृथ्वी के सबसे शक्तिशाली हंटर में से एक है। इनमें 'प्रोजल' नामक उड़ाई के दौरान 85 m/s / ~306 mph (~497 kph) की गति भी हासिल कर सकते हैं।
  animal.flamingo:
    label: फूलों का पक्षी
    summary: एक गुलाबी रंग का ब्रॉडिंग बर्ड जो एक पैर पर खड़ा होता है और छोटे पानी में रहता है।
    info: फूलों का पक्षी अपने लाल रंग को रेशों और क्रेव्स में मौजूद कैरोटीनॉइड्स से प्राप्त करता है, जिन पर वह खाद्य ले रहा है। इसके बच्चे शुरू में धूलई रंग के होते हैं और बाद में रंग धीरे-धीरे बदलता है। झुका हुआ चोंच एक फिल्टर के रूप में काम करता है - फूलों का पक्षी पानी में खाद्य पदार्थ छानने के लिए अपना सिर नीचे करके फिल्टर करता है।
  animal.goose:
    label: हुसा
    summary: '''व'' के आकार में इच्छापूर्ण ऊषण ऋतुओं के लिए ओढऩे वाला ठंडा पक्षी ; ऐसे पक्षी जमीन पर अपने बच्चों के लिए ऑफर करते हैं।'
    info: |-
      हुसा बड़ी पक्षियों के मामले में हॉन्कर और समृद्धि के लिए 'व' के रूप में जानते है।
      ये प्रजनन के दौरान अधिकाँश भूखे होते हैं तथा शिविर छोटे चिह्नों के खिलाफ आगे झुके हए गठबंधन के ढंग से डाटे थे।
  animal.hawk:
    label: झुकाओ
    summary: इउओ लेस आऊर खेत मेँ पक्षियों आऊर स्थलचर पशुओं के शिकार करे वाळा एफऽ तेज़ शिकारी जानवर।
    info: "जावर जेब्रा के पक्षियों से हुआईयन में एक शीघ्रतम और अचौथड़ा चलाने लगा।\nवह उसके छोटे गोलाकार पखेड़ों आऊर दीबाई खासिति से घने फ्लोरा मेँ धाप्टा भेठए। \nअधिकाण्ह झुकाओ इउओ ऊपर ढामणी थोदः ऋषभ ऐठे।"
  animal.heron:
    label: वोलावका
    summary: ऊंचा ऐसा चमचम जो ऑउटर ढंग से बिना हरकत किए मछलियों के लिए खड़ा रहता है।
    info: "वोलावका पॉपेलावा मध्य इरोप के सबसे बड़ी तिरंगने वाली चमचम है।\nयह एक प्रतिमुखि के जैसे अटूट खड़ी रहती है और फिस के पानी में आए देखती है; फिश घटिट भाग में आई थी ओजोर के झटका मारती है। \nइसके पाठे पूरी छोटी मछलियों और डफलिकों को धक्षता से ऊपर उठा लेते हैं।"
  animal.hornbill:
    label: जूबोरेज़ेक
    summary: ऊष्णकटिबंधीय पक्षी जिसके दाँत में एक बड़ा अधिशेष होता है।
    info: |-
      जूबोरेज़ेक बुसीरोटिडे प्रजाति का हल्का महसूस करने वाला संगठनवद पशुपति एकमान चढ़ाए गये अधिशेष दाँत के साथ।
      इसके घर आफ्रीका और एशिया के उष्णकटिबंधीय रणनखड़ हैं。
      अपने टीचे के खास छेदों में इसके झुंड भी ठीक ऐसे ही होते हैं;
      उसकी ओर से फौरन ध्वनि ऊपर ढके हुए रहते हैं और अभिप्रेरित ऋतुओं के दृष्टिहीन ऑथर्मोस्फेरिक अवधि तक रहते हैं।
  animal.hummingbird:
    label: कोलिब्री
    summary: दुनिया का सबसे छोटा पक्षी जो स्थान पर उड़कर रुक सकता है और पीछे की ओर उड़ान भर सकता है।
    info: कोलिब्री रूबी-थ्रोटेड एकमात्र प्रजाति है जो नियमित रूप से उत्तरी अमेरिका के पूर्वी भाग में घर बसाती है। यह प्रति सेकंड 53 बार पंख फड़काता है, जिससे एक विशिष्ट बज़र ध्वनि उत्पन्न होती है। यह नेक्टर और छोटे कीटों पर खाद्य ले रहा है; इसका दिल प्रति मिनट 1,200 बार धड़कता है।
  animal.ibis:
    label: ईबिस
    summary: चख्रयुक्ति घटाएले या झाड़ियों में खोजने वाला पशु, प्राचीन मिज़्रदेश में पवित्र
    info: |-
      ईबिस थ्रेश्कीऑरनिदाई परिवार से हुआ करता है। इसमें महत्त्वपूर्ण लंबा मोड़ा हुआ चख्रयुक्ति होती है।
      इबिस पवित्र मिज़्रदेश में बौद्धिक भगवान ठोथ के प्रतीक के रूप में पूजा गए थे।
  animal.kingfisher:
    label: एक प्रभाकर पक्षी
    summary: झीलों में मछली चुथाओ घुमघुमाहट आउंठा
    info: |-
      नदी के बिजली स्पैश हरा पक्षी यूरोप में सबसे सुंदर प्रजाति में से एक है।
      यह वृक्ष पर नमूना देखता है और फिर उछलकर पाला डालता है。
      इसकी गड़गड़ाहट शुद्ध झीलों के स्थान का संकेतक है;
      japán में hisui भी इसी अवधारणा का प्रतीक है।
  animal.kookaburra:
    label: कू काबरा
    summary: '''कू काबरा'', जो Dacelo novaeguineae के भी आउए है, इसके ऊच्छ्वास गुञ्झन के कारण खामोश घर फैलाओ डर के कारण ऐतिहासिक ढंग से जाना जाथे है।'
    info: |-
      कू काबरा एक महत्वपूर्ण प्रजन हंसमुखी सिरोटे है।
      यह ऑस्ट्रेलिया के 'बश' का प्रतीक है और उदगवईल तथा सौरभि के समय अपने शोरगड़्ढ़ चिह्न के कारण प्रसिद्ध है।
  animal.lorikeet:
    label: लोरी
    summary: छोटा रंगीन पपुआजवईया जो नेक्टर और पुष्प धूल से खाँटा
    info: "लोरी एक मामूला पिपड़े का हमशख्न संग्रहण करनेवाला पपुआजवईया और ऑस्ट्रेशिया का चमत्कारी बच्छा है।\nइसके अद्भुत फॉटोएबिस जीभ द्वारा इसके गुफा में खौफ आउषधि तथा पुष्प धूल घुल जाती है। \nअपने ऊर्जा झंझाओं के कारण यह डेढ़ ठंढ़े ऋतुओं में ऐसे थोड़े बहुत बीज भी ले जाता है।"
  animal.lyrebird:
    label: लायरोक्वेस्ट
    summary: ऑस्ट्रेलियाई पक्षी जो अपने आसपास के किसी भी ध्वनि को बिल्कुल सटीक तरीके से नकल कर सकता है
    info: "लायरोक्वेस्ट गौडिएस से प्रख्यात है कि इनमें मुज़ाहिरा की लगभग किसी भी आवश्मय ध्वनि की क्षमता होती हैं -इलेक्ट्रिक स्पष्टक, फोटोग्राफिक कॅपचर के शब्द, कार के चेहरे और जानवरों के बुलाओ। \nफॉएमले डेढ़ खदेरा घुण्ठ छोड़कर ऊपर झुठलाऐ थे अधिकतम ऑथेण्टिकता के साँग करते हई।\nऊ ऑस्ट्रेलियाई राज्य विक्टोरिया के प्रतीक हई।"
  animal.macaw:
    label: आरा
    summary: उष्णकटिबंधीय आरा नदी के पश्चिम में घने झाड़ियों में शाइनिग ओरनेस ऑफ़ धीमी ऊंचाई के ढलानों पर रहते हैं।
    info: |-
      एरा एक प्रजाति हैं के सबसे मनोहर रंगीन पक्षियों।
      वे अपने मज़बूत और मुड़े हुए चखेटे के साथ कठोर बीज के छल्ले भी फटा सकते हैं。
      ये ऐमे जोड़े खेमे में ठहरते हैं जो उनके पूरे जीवनभर वफादार रहते हैं।
  animal.magpie:
    label: bila
    summary: एक काला - सफेद पक्षी है और धूप के हरे घुटने
    info: |-
      एक सामान्य बिलली मुरगा है क्रोवफेसमिडे परिवार से जहां इसका अभिप्रय चमचमता हरा टखना।
      इसके पास एक उपदंड है शानदार आईटमज़ के तौर पर छीनने के दबाओ,
      लेकिन खोज ऐसी कथा कि फैली गई थी झूठी है।
  animal.nightingale:
    label: स्लावीक
    summary: छोटा भूखा पक्षी ऐ झाहर के ध्वनि के एगोहि सुंदरतम पक्षी के बच्चों के डाठई हई।
    info: "स्लावीक ओबेने ह कमला प्रजन सुर मिश्रण गैयों के एगोहि अत्यधिक जटिल और सुदंड़ पक्षी के बच्चों के तथ्य।\nवह खासकर रात आऊर उषांश के दौरान डाँठई हए,\njiskे इस छप के नाम के भी ऊपर से आउत हई। \nइ फिटफिप के घरवाला हई।"
  animal.ostrich:
    label: पश्रोग
    summary: दुनिए का सबसे भारी पक्शि ,उडऩहट ;ऊषण गति
    info: ओम्बीज़ रैना पक्षियों में सबसे लंबा और हल्का कामचुआई तखतवाना है।
  animal.owl:
    label: सोवा
    summary: रात्रि का शिकारी पक्षी जिसकी आंखें गोलाकार होती हैं, उड़ान शांतिपूर्ण होती है और श्रवण शक्ति अच्छी होती है।
    info: वृहद यूरोपीय नाइट हॉक उत्तरी अमेरिका की सबसे बड़ी सोवा है। सोवाओं की आंखें अचल होती हैं, इसलिए वे अपने सिर को 270 डिग्री तक घुमा देते हैं। उनकी उड़ान लगभग शांतिपूर्ण होती है क्योंकि उनके पंखों की विशेष संरचना होती है। वे अद्भुत रूप से संवेदनशील श्रवण शक्ति के साथ रात्रि में शिकार करते हैं।
  animal.parrot:
    label: पैरोट
    summary: एक रंगीन उष्णकटिबंधीय पक्षी जो ध्वनियों और मनुष्य के बोलने की आवाज के अनुकरण कर सकता है।
    info: एरा शरलैटोवी दुनिया के सबसे बड़े पैरोट में से एक है जिसका पंखों का फैलाव एक मीटर से अधिक होता है। यह उष्णकटिबंधीय वर्षा वनों में रहता है। पैरोट में असाधारण बुद्धिमत्ता होती है - एरा रंगों, आकृतियों को पहचान सकता है और गिन सकता है। यह अधिकतम 75 वर्ष तक जीवित रह सकता है।
  animal.peacock:
    label: पाव
    summary: मादा को आकर्षित करने के लिए पाव का पूंछ फैलाकर एक वेज़ाइर का निर्माण करता है।
    info: कोरोनेटेड पाव भारतीय उपमहाद्वीप का मूल निवासी है। नर पाव अपने पूंछ को फैलाता है, जो वास्तव में एक बढ़े हुए छिपाने वाले पंख का बना होता है, जब वह मादा को आकर्षित करने के लिए प्रयास करता है। इरिडिसेंट रंग पिगमेंटों से नहीं, बल्कि पंख की माइक्रोस्ट्रक्चर पर प्रकाश के अपवर्तन से उत्पन्न होते हैं।
  animal.pelican:
    label: पेलिकन
    summary: एक ऐसा शांख्ट घाँघा है जो छोटे आकार के मछली को ध्यापने के लगभग ठीक ढंग से ओढऩे के लिहाज से ऊषर झाडङ थाळी ले रखा होता है।
    info: |-
      पेलिकन एक महान प्रजाति हैं। इसमे कर्मचारी सुईदार चोटी जबला बड़ा गुणवत्‍ता वाला खादय भरा हुआ होता है।
      इसमे अधिकतम 13 लीटर पानी डाला और फिस उठाया जा सकता है।
  animal.penguin:
    label: टुकान
    summary: एक उड़ान न उड़ाने वाला दक्षिणी गोलार्ध का पक्षी, शानदार तैराक।
    info: साम्राज्य टुकान सभी टुकानों में से सबसे बड़ा होता है; यह 1.1 मीटर से अधिक की ऊंचाई तक पहुंच सकता है। यह अंटार्कटिक में रहता है और बर्फीली ठंड में अंडे रखता है - नर टुकान पूरी अंटार्कटिक शीतकाल के दौरान अपने पैरों पर अंडे गर्म रखते हैं। पानी के नीचे यह 30 किमी/घंटा से अधिक की गति तक पहुंच सकता है।
  animal.pheasant:
    label: बाझाँट
    summary: भड़कपॉर अथच्‍छ भापी ; महीष ओढऩे घोर शरीर छठि
    info: बाज़ांट को एशिया से इलेवर प्रवतन हुआ था। महीसूख्मक लम्बे पंजे और आईयों के चारोंओर नएदाई गुणगति दिखाता है।
  animal.pigeon:
    label: हॉब्ह
    summary: घर आऊर खेत के छोटे चिड़िया, मूल रूप से हॉब्बन
    info: |-
      शहरों में सभी घर के हॉब्स और प्राकृतिक हौलुवस का पैतृक हॉब्बन।
      यहमनख़िए के लिए हजारों साल तक पोषण हॉब्यूट के रूप में काम करता था。
      इसके पास अद्वितीय नौगेशन सेंस है जो सैकड़ों किलोमीटर की दूरी से भी गृह ढूढ़ सकता है।
  animal.puffin:
    label: समुद्री कबूतर
    summary: एक छोटा समुद्री पक्षी जिसका गुणवत्‍ता भरा खच्चर के दाढ़ी झुकाओ आकार का होता है।
    info: |-
      उत्तरी पैलेटिक एक समुद्री कबूतर होने वाला मछलीखोर पक्षी है।
      यह डुबकर और नाचकर मछली का शिकार करता है;
      eकटपगईं मछलियों को अपने मुँह में बड़ी संख्या में उठा सकता है।
  animal.quail:
    label: क्रेपल्का
    summary: एक छोटा झाडऩा घाटी के ऊषर में ठण्ढई ऐठे थे ऑउघर
    info: |-
      क्रेपल्का पॉलीनि यूरोप में कुमावटिस से सबसे छोटा हथिन।
      यह अजगरता हैं; हम इसे आवाज़ (चिचिम-चितिल) से बड़े ध्यान से सुन सकते हैं और देख भी नहीं सकते。
      अधिकाँश फारखाओं के विपरीत यह एफ्रीका में शीतकाल गुजारता हैं।
  animal.raven:
    label: कर्कवेस
    summary: चतुष्पादी चतुर्घर्षी उभयफलक
    info: "कर्कवेस बड़ा प्रजाति के सबसे लंबी हिमलयन मुख्यतः ६० सेंटीमीटर।\nइसमें अद्भुत बुद्धि होती है और वह नए खेल शुरू कर सकता है एवं सार्थक साझगति जोड़ सकता है। \nउत्तरी ओडिन के हवरण हुगिन्‍न आऊर मुनिन्‍न इथने केट्ठ महत्वपूर्ण गुढ़ता छई।"
  animal.roadrunner:
    label: भूकुकाच्का
    summary: '''रोड रनर'' ऐशिस ऑफ धरती का ढीठ बदखाहिपन वाला चिड़िया है जो उष्णकटईया भूमि में दौङा लेता है।'
    info: "रोड रनर कुकाच्का पृथिवी से मेलवलय हमेशा उसके जंगलों के बजाय भागते और दौँचते हए।\nइसकी तेझी 35 कि॰मी./घण्टा से अधिक होती है एवं इसका खानपान सांप, छछुआ, कीट आऊर छोटे स्थलचर फ्रॊबहुत होता है। \nयह घोंघा पकड़कर ओउर मारकर ठीठ डाम सकता है।"
  animal.robin:
    label: चटगईड़िए
    summary: ब्रिटेन में वाणपर्मवधि का प्रतीक
    info: |-
      लाल ब्रैस्टेड कोयरा हमारे सुंदर पक्षियों में से एक है।
      इनकी छाती नाज़ुकता से ऑरेञ्ग और लाल दिखती है।
  animal.seagull:
    label: रेक
    summary: छोटे जलपथ पर लोगों और समुद्र के पास खाद्य ढूंढने वाला एक समुद्री पक्षी
    info: |-
      रेक एग्रिटास ह्यू के पशु महीना सबसे अधिक फ़ैला हुआ समुद्री पक्षी है।
      यह लचीला और सभी खाद्यवस्तुओं को बर्डर करता है; वह समुद्री छोटे जलपथ के साथ-साथ आंतरिक क्षेत्रों में झीलों और नदिओं के पास भी रहता है。
      इसमें बुद्धि होती है और कई बार उसे ऐसे स्थानों को याद रखने में सफलता मिळती है जहाँ इंसान चढ़ाए गए घड़े शामिल होते हैं।
  animal.secretary_bird:
    label: सचिव पक्षी
    summary: अफ्रीका के लंबे ठोढ़ी वाले शिकारी जो छिपकलियों को मारने के लिए ढेर मारते हैं
    info: "सचिव पक्षी एक महाद्वीपीय सवना के खुले हुए क्षेत्रों में ज़्यादैतर पैदल चलने वाला बड़ा शिकारी है।\nइसमें छिपकलियों और गुठलि डालने वालों को मारने के लिए अपने टखनों के भारी हथगोटे के साथ मजबूत धक्का मारने की क्षमता है। \nउसका नाम उसके सिर पर झूलते आधे इंच ऊंचे पंछी के ओढऩे के फर्से के ऐश्वर्य के कारण घोषित किया गया है।"
  animal.sparrow:
    label: गायक
    summary: एक चिटके ओढऩे वाळा झुठेठा ऊखल जो मनुष्णया बस्ति के पास रहत हई
    info: |-
      गृह गायक प्रजन के सबसे अधिक होल्डर में से एक हैं।
      mनुष्मया बस्तीओं के पास रहते हैं और दीवालों व छप्परों के खाँचों में घर भी इमानदार आदमी के साथ जुड़े रहते हैं。
      अंतिम दशकों में शहरों में उनकी आबादी में धीरे - धीरे फैलाहट हई है।
  animal.spoonbill:
    label: कॉलपिक
    summary: एक ऐसा ओढऩवाहक पक्षी जिसमें एक विशिष्ट ढलानदार चमचुआई जैसे बिस्तरने होते हैं।
    info: "सफेद कॉलपिक इबीज़ से परिवार में होता हैं, लेकिन आमतौर पर एक फ्लैट चमचुआई जैसे बिस्तरने ग्रहण करता है।\nखाँचे कि खोज में यह अपने छड़ी के साथ धीरे -धीरे पानी में घूमता है। \nयह झाड़ियों और शृंगामय भूभागों में टीम में ठहरता है।"
  animal.stork:
    label: चाँदी
    summary: अखरोट के साथ ऊँचे श्मशानघर के झण्डे इसके ऐतिहासिक ढांढ़स के ओछे तथ्य हैं।
    info: |-
      चांदी के चिड़िया प्रजनक हैं। सम्पूर्ण यूरोप में छतों और खम्भों पर घुटले बनाते हैं।
      वह उष्णकटिबध्न अफ्रीका में सर्दियों गुजारते हैं एवं प्रतिवर्ष लौटकर ठीठीसे जगह फिसड़े आए हुए धब्बे में टिके रहते हैं।
  animal.swallow:
    label: वलस्टॉक
    summary: अधिकाँश फ्लाइइंग डास्ह ऑर्थोपोड्स के साथ ध्वनि ओर झुकाव ऐसा होता है।
    info: |-
      वलस्टॉक रुषटिका सामने की हवा में प्रति-शरदऋतु कोई अफ़्रीका में बचाता है।
      यह एक विशेषज्ञ आंखों के लगभग ऊपर चढ़ता है;
      hम जबड़े के द्वारा नए गठन करता है और यह घर के छत पर भी खेळता है।
  animal.swan:
    label: एण्डरसन कथा
    summary: अदभुत शामिति एवं आध्यासिक गुणों का प्रतीक
    info: |-
      लबिट वेलका पूरे क्रीड़नखंड में स्थायी होती है।
      यह खौफ और अपमानजनक चीजों के बारे में भी जगरुक करती है।
  animal.toucan:
    label: टुकान
    summary: एक उष्णकटिबंधीय पक्षी जिसका एक बड़ा रंगीन चोंच होता है।
    info: टुकान एक बड़ा पक्षी है जो केंद्रीय और दक्षिणी अमेरिका के वर्षा वनों में पाया जाता है। इसका चोंच 20 सेमी से अधिक लंबा होता है लेकिन बहुत हल्का होता है क्योंकि इसमें हवा के गुमर भरे होते हैं। यह शरीर के तापमान को नियंत्रित करने, फलों को काटने और अन्य टुकानों के लिए दृश्य संकेत देने में मदद करता है।
  animal.woodpecker:
    label: डाटेल
    summary: एक प्रजन डाटेल झाड़ियों के ऊपर ऐसे झटके मारता है जिससे उसे घोंघों या गुफा बनाने में सहायता मिलती है।
    info: |-
      डाटेल पिकीदे नामक समूह का एक प्रजन होता है। इसका मुंह अपने जबर्दस्त चख़्चे और कठोर पौछल के कारण वृक्ष के बगल में ठोकर मारने के उद्देश्य से ढाँढ़िया होता है।
      इसकी भाग आवश्यकता पर खोटे के छिद्रों से घोंघों को निकालने के लिए धाप कई फुट लंबी होती है।
